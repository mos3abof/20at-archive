base_url = "https://20at.mosab.me"   # the site's address (static/CNAME); zola serve uses its own
title = "عشرينات"
description = "أرشيف موقع عشرينات: ٨٥٤٢ مقالًا، كما حفظها أرشيف الإنترنت."
default_language = "ar"
theme = "arabesque"

compile_sass = false
generate_feeds = true
feed_filenames = ["atom.xml"]
build_search_index = false         # our own, smaller index (pipeline/site.py write_search, js/search.js)

taxonomies = [
  { name = "authors", feed = true },     # one page per writer, grouped by year (templates/taxonomy_single.html)
  { name = "sections", feed = true },     # one page per section, all its articles by year, with a filter
]

[slugify]
taxonomies = "safe"                # keep Arabic author names in their URLs

[markdown]
smart_punctuation = false          # keep the archived punctuation exactly
external_links_target_blank = true
external_links_no_referrer = true

[markdown.highlighting]
light_theme = "arabesque-light"
dark_theme = "arabesque-dark"
extra_themes = ["themes/arabesque/highlighting/arabesque-light.json", "themes/arabesque/highlighting/arabesque-dark.json"]
add_color_scheme = false

[search]
index_format = "fuse_json"         # indexes Arabic; elasticlunr can't

[extra]
author = "عشرينات"
tagline = "أرشيف موقع الشباب العربي ٢٠٠٤–٢٠١٠"   # under the logo (templates/partials/header.html)
n_articles = 8542   # in the header's search field
wayback_url = "https://web.archive.org/web/20100315235959/http://www.20at.com/"   # the original, in the footer
cutoff_label = "١٥ مارس ٢٠١٠"   # the last day the archive covers (footer)
years = [2004, 2005, 2006, 2007, 2008, 2009, 2010]   # the years with articles (footer: browse by year)
# readers' comments; the provenance box; the look of 20at.com in 2009 (templates/partials/header.html …)
stylesheets = ["css/comments.css", "css/archive.css", "css/twenty2009.css", "css/home-v2.css", "css/authors.css", "css/sections.css", "css/extras.css", "css/header.css"]

