subject = "أنا أعرف الدكتور درويش"
author = "أمير"
posted = "2005-12-18"
text = "الدكتور أحمد درويش كان استاذى يوما ما أثناء دراستى لتمهيدى ماجستير فى هندسه القاهره<br />وهو رجل فاضل و يعتبر بحق عالم فى مجاله<br />و لكن مجاله ليس للأسف التنميه الاداريه!!!!!<br />بل هو استاذ فى معالجه الصور بالكمبيوتر أى انه بالتأكيد يصلح وزيرا ولكن بالتأكيد ليس للتنميه الاداريه<br />ان الاستوزار فى مصر لايعتمد على التخصص مطلقا و ايضا لايعتمد على الموهبه الاداريه<br />ولا الاتجاه السياسي ولا الخلفيه العلميه<br />ولا حتى النزاهة و المصداقيه<br />والا فكيف تفسرون التعديل الغريب جدا بمنح البلتاجى كرسى الاعلام و الفقى الشباب و بعد اقل من سته اشهر تبادلا الكراسي<br />لو كان الفقى صالحا للاعلام فلماذا يكون وزيرا للشباب<br />و ان كان البلتاجى لا يصلح للاعلام -وهذا غير صحيح- فلماذا استوزروه فيها<br />الموضوع فعلا غريب و بعد كده محدش يستغرب أى صفر ناخده لاننا ممكن نكون مانستحقهوش بس مالقوش غيره"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113500/http://www.20at.com/article2.php?sid=104"

