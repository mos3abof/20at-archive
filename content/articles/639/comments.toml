subject = "وا حسرة على مصر!!!"
author = "مسلم..مصرى..عربى"
posted = "2005-12-20"
text = "والله يا اخى لن تفعل الخارجية المصرية اى شئ لانه لن تفعل الناس المصرية الى شئ!<br />لانه لا تاتى الصحوة الا من الشعب,واذا كان شعبنا الموقر قد رضى بالذل فالياخذ منه ويغرف مثلما يشاء..نحن السبب للاسف.<br />يقول الشيخ الشعراوى\"لا تسل الظالم لماذا ظلم,ولكن سل المظلوم لماذا قبل الظلم\",ونحن يا اخى قبلنا بالظلم ,ام اراك ناسيا وفاء قسطنطين,وcd الاسكندرية,والكويز,و...<br />حسبى الله ونعم الوكيل."
archived = "2006-11-02"
