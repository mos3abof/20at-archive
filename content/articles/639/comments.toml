subject = "الخارجية تُهرِّب سائحًا رُوسيًّا اعتدى على مصري!!"
author = "إخوان أون لاين - 17/12/2005"
posted = "2005-12-17"
text = "كتب- سمير سعيد<br />قامَ سائح روسي بالاعتداءِ على مواطنٍ مصري (محمد السيد الأبياري- فني كهرباء 22 سنة) في إحدى القرى السياحية بمدينة الغردقة؛ حيث يرقد المواطن المصري بمستشفى البحر الأحمر بين الحياةِ والموت.<br />وقد شهد ظهر يوم الخميس 15/12/2005م الماضي حادثة اعتداءِ سائحٍ روسي بقرية \"ليليلاند\" السياحية بمنطقة الغردقة على فني كهرباء مصري يعمل بالقرية مسببًا له إصاباتٍ بالغة وهي، حسبما جاء في التقرير الطبي لمستشفى البحر الأحمر الذي أعدَّه كلٌّ من الدكتور محمد علي السيد والدكتور عبد الكريم، كسرٌ بالأنفِ وارتجاجٌ بالمخِ وكسرٌ بالفك وكدماتٌ كثيرةٌ بأنحاء متعددة من الجسمِ، ووصفت حالته بالحرجة ومنذ أمس لم يتم التمكن من استجوابه حول الواقعة؛ نظرًا لسوءِ وخطورةِ حالته.<br />وكانت قرية \"ليليلاند\" قد شهدت واقعة الاعتداء والتي بدأت عندما كان محمد الأبياري يقوم بأعمال الصيانة بحكمِ عمله وهو أعلى السلم، بينما كان أولاد السائح الروسي يقومون باللعبِ في المكانِ الذي كان يعمل فيه الأبياري وقاموا أكثر من مرةٍ بجذبِ السلم مما كاد يتسبب في سقوطِهِ، فقام على الفورِ بإبعادِ الأطفال عن المكانِ إلا أنَّ الأطفال الذين لا يفهمون العربية ذهبوا إلى والدهم السائح الروسي وادَّعوا أنه ضربهم وشتمهم، فمَا كان من السائحِ الروسي إلا استدعاء الأبياري للتأكدِ مما ذكره الأطفال له، وهو ما نفاه الأبياري، إلا أنَّ إدارة الفندق اعتذرت للسائحِ الروسي وقام بترضيته.<br />ولكن السائح لم يكتفِ بما حدث فقامَ بالاعتداءِ على الابياري وأوسعه ضربًا بطريقةٍ وحشيةٍ، وفور الواقعة تمَّ إلقاء القبض على السائحِ الروسي المعتدي وتمَّ اقتياده من قِبل شرطة السياحة إلى قسمِ الغردقة للتحقيقِ معه.<br />وتمَّ تسجيل محضر بالواقعة يحمل رقم (92 أحوال)، إلا إنه وخلال ساعات معدودة تمَّ الاتصال بالسفارة الروسية التي قامت بدورها بالاتصالِ بالخارجيةِ الروسية وتوسطت لدى السلطات المصرية والخارجية المصرية وبالفعل تمَّ إخراج السائح الروسي.<br />وقد توجَّه السفيرُ الروسي إلى القريةِ السياحية التي شهدت الواقعة محاولاً إنهاء الموضوع بالضغطِ على صاحب القرية إلا أنَّ الأخير قام بطردِ السفير مطالبًا بحقِّ العامل.<br />وفي تقدمٍ خطيرٍ لإغلاقِ ملف القضية، وعلى طريقة ما حدث في قضية الأمير القطري الذي تسبب في قتلِ خمسة مصريين ثم لاذ بالفرار إلى بلده، قامت السفارة الروسية بإجراءِ اتصالاتٍ وحصلت على موافقةٍ على إخراج السائح الروسي إلى خارج مصر وإعادته إلى روسيا ليهرب من التحقيقِ والعقابِ، ومن المقرر أن يهرب من مصر في تمامِ الساعة الواحدة ظهرًا على متن إحدى الطائرات المتوجهة إلى روسيا.<br />وكان وفد من أمن الدولة والخارجية المصرية قد توجَّه إلى القريةِ؛ حيث قابل صاحب القرية ومدير الصيانة الذي يرأس العامل المصري؛ حيث طالب الوفد \"المصري\" بحلِّ القضية وديًّا مقابل مبلغٍ من المال ومطالبًا \"بإنهاءِ الموضوع في ساعتين\"، وهو ما لم يُوافق عليه صاحب القرية ومدير الصيانة، واستنكروا موقف الوفد المصري، كما لو كان وفدًا روسيًّا؛ حيث طالبا بحقوقِ العامل كاملةً ومحاكمة السائح الروسي بعد التحقيق معه.<br />وفي تطورٍ آخر قامت الخارجية الروسية بالاتصال ببعضِ الصحف الروسية وزودتها بمعلوماتٍ كاذبةٍ حول قيام المصريين باغتصابِ الأطفال الأجانب، وبناءً عليه نشرت الصحفُ الروسية أمس تحذيراتٍ للسائحين الروس بعدم اصطحابِ أطفالهم معهم؛ خوفًا من اغتصابهم في مصر، وذلك في حملةٍ قذرةٍ تستهدف سمعة مصر وسُمعة السياحة فيها للتغطيةِ على جريمةِ السائح الروسي وتأليب الرأي العام الروسي ضد مصر!!!<br />وقد هددت السفارة الروسية العاملين بالقرية وصاحب القرية، وأعرب السفير الروسي أنه سيتم إخراج السائح الروسي بأي وسيلةٍ ولن يتمكَّن منه أحد.<br />والآن ما زال التحفظ على جوازِ سفر السائح الروسي (قريب أحد المسئولين في الخارجية الروسية) ساريًا إلا أنَّ السفارة قامت باستخراجِ وثيقة سفر لتهريبه خلال ظهر اليوم أو الساعات القليلة القادمة.<br />وقد شهد الواقعة عددٌ من السائحين الأجانب منهم سائح أمريكي غادر مصر إلا أنه تركَ كافة بيانته للتعاون في القضية والشهادة فيها، كما أبدى أيضًا سائحون ألمان تعاونهم الكامل واستعدادهم للشهادةِ في القضية، منددين بما قام به السائح الروسي.<br />كما قامت عددٌ من الشركاتِ السياحية الإيطالية بزيارةِ المواطن المصري بعد أن علمت بالواقعةِ وأعلنت تضامنها مع المواطنِ المصري وتطالب بالتحقيق في الحادثة!!!<br />وتجدر الإشارة إلى أنَّ محمد السيد الأبياري البالغ من العمر 22 سنة هو الابن الوحيد لوالده (عمدة قرية) إضافةً لثلاث بنات.<br />وقد أثارت هذه الحادثة الكثير من علاماتِ الاستفهام حول دور الخارجية المصرية ودور السلطات الأمنية في الحفاظِ على حقِّ المواطنين المصريين على أرضهم.. فماذا عن المصريين في الخارج؟!!"
archived = "2006-11-02"
