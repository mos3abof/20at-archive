[[comments]]
order = 4
subject = "العملة الصعبة في البترول"
author = "محمد صلاح"
posted = "2006-08-07"
text = "السلام عليكم ورحمة اللة وبركاته:<br />العملة الصعبة في البترول<br />العملة الصعبة في البترول لا أقصد بها الدولار ولكن أقصد بها منع الاجازات بدون مرتب لذوى الخبرة من رجالة البترول كما يطلق علينا المهندس/ سامح فهمى.<br />فقد تم فتح أجازات السنة الاولي والثانية في شركة بترول بلاعيم في عهد المهندس عبد العليم طه رئيس مجلس الادارة السابق الذى أصبح الان رئيس هيئة البترول لسياستة الحكيمه وتقديره لظروف بلدنا حيث يسافر طالب الاجازة مطمئنا\" الي أي دولة عربية حيث المرتبات العالية ويأتى بعد سنة أو أكثر بالعملة الصعبة والخير لبلدنا وهو مطمئن لرجوعة الي وظيفته<br />والان تم منع الاجازات في ظل سياسة رئيس مجلس الادارة الجديد المهندس/مدحت السيد مع أنه من ذوى الكفاءات العالية حيث تولي هذا المنصب في هذا السن المبكر فهو يرفض جميع الاجازات حتي السنة الاولي التى حق لكل موظف لظروف خاصة أو عائلية أو مرافق لزوجته واعتقد أن هذا ضد سياسة الدولة حيث الاجازات مفتوحة في جميع الوزارات بالدولة.<br />ومع اني أعاني من ظروف عائلية صعبة وموافقة مديريني علي أجازتى فقد تم رفض طلبي<br />فارجو من وزير البترول بفتح الاجازات بدون مرتب حيث يوجد الان عقد توريد عمالة بين شركتى صان مصر وبترومينت و شركة بترول بلاعيم لسد العجز وبذلك يتم فتح فرص عمل جديدة ومستقبل افضل لبلدنا مصر الحبيبة.<br />م/محمد صلاح حقول سيناء<br />أرجو الاهتمام وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113500/http://www.20at.com/article2.php?sid=104"

