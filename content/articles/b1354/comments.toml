subject = "مجرد تعليق"
author = "الزيني بركات"
posted = "2006-10-16"
text = "السلام عليكم<br />ارى ان لكل مجتمع خصائصه التى قد لا يدركها الا افراده و برغم اختلافى مع العديد من عادات الاخوة فى المملكة الا انى اكن لهم قدرا من الاحترام<br />و لا ينفى هذا ان اسجل اعتراضى على اشياء وان وافقت عادتهم الا انى لا توافق العقل و لا يأمر بها الشرع مثالا حيا على هذا قضايا تفريق الزوجان دون رضاهم !!!!!!!!!!!!!!!!<br />اما بالنسبة لمنح الجنسية فأعتقد انه ليس من حقنا ان نلومهم لمنحهم الجنسية لزوجة السعودي و لا يمنحها لزوج السعودية فالحال فى مصر كذلك و ان كنا فى مصر قد قطعنا شوطا كبيرا فى منح الجنسية لأبناء المصرية المتزوجة من اجنبي<br />اعود و انهى كلامى و اقول ان لكل مجتمع خصوصيته يجب ان تحترم طالما لم تمس بثوابت العقل و الشرع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153619/http://www.20at.com/article2.php?sid=1354"

