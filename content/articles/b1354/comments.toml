subject = "أبدا"
author = "ولو بأموال الدنيا كلها لن أتنازل عن جنسيتي وهويتي المصرية مقابل جنسية بلد أخرى ولو كانت السعودية."
posted = "2006-10-17"
text = "رغم جميع المآسي في مصر وصعوبة العيش واحتقار الحكومة لأهل البلد الا اننى لا اقبل ان اتخلى عن هويتي مقابل حفنة من الريالات السعودية ولو مغلفة بغلاف من ذهب ..<br />عفوا فلست للبيع"
archived = "2006-11-02"
