subject = ""
author = "تبقى فى بقك"
posted = "2009-10-07"
text = "تبقى فى بقك وتقسم لغيرك<br />وبعدين مش يموت ابوة الاول وبعدين ندور على الورثة<br />ومش ممكن يبقى زى الفيلم الهندى افلاما راجا كابور ويطلع ان ابوة متجوز واحدة تانية وفية وريث غيرة<br />والا ممكن يقسموا البلد على الورثة وكل واحد ياخد حتة<br />ما هى بقت عشة فراخ<br />الموضوع بايخ قوى ومش قابل للهضم يعنى اية يورثوا"
archived = "2009-10-09"
capture_url = "https://web.archive.org/web/20091009022740/http://www.20at.com:80/masr/2khbar/13643--10.html"

[[comments]]
order = 1
subject = ""
author = "استاذ جمال"
posted = "2009-10-07"
text = "الاسبوع اللى فات كان كيلو السكر ب اتنين جنية ونص او تلاتة الا ربع<br />النهاردة الصبح كيلو السكر بقى ب خمسة جنية ونص<br />وحياة ابوك يا شيخ انت دارى بحاجة<br />انت عارف ان اللى بيتحكم فى معيشتنا مافيا المستوردين والتجار الكبار<br />هتحكموا اية بس<br />الاسعار بتزيد مية فى المية فى يوم واحد<br />يبقى فين هى الحكومة اللى هتحكموها<br />زمان قوى زكريا محى الدين رفع سعر كيلو الارز من خمسة صاغ الى خمسة صاغ ونصف<br />جمال عبد الناصر شالة من الوزارة<br />انما المافيا دلوقتى هنشيلها ازاى"
archived = "2009-10-09"
capture_url = "https://web.archive.org/web/20091009022740/http://www.20at.com:80/masr/2khbar/13643--10.html"

[[comments]]
