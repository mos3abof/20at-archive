author = "لاسوا"
posted = "2009-10-07"
text = "اعتقد انة لن يكون مستقبلنا اسوا مما هو علية الان<br />ستطول المدة فقط<br />فلا يوجد اسوأ مما نحن فية الان"
archived = "2009-10-09"
capture_url = "https://web.archive.org/web/20091009022740/http://www.20at.com:80/masr/2khbar/13643--10.html"

[[comments]]
