subject = ""
author = "تعديل الدستور"
posted = "2009-10-07"
text = "التعديل الدستورى بينص بما معناة ان جمال مبارك هو المرشح الوحيد وبس<br />وكل الشعب اقر التعديل الدستورى<br />واللى عايز يترشح ضدة يجيب موافقة ثلثى اعضاء مجلس الشعب و500 عضو من المحليات - حاجات كدة زى البحث عن العنقاء والجنى التاية لان كل اعضاء مجلس الشعب القادم من الوطنى وبتوع المحليات كلهم من الوطنى<br />يعنى العملية منتهية من زمان<br />وزمان قوى<br />والخبر مفيش فية جديد<br />جمال مبارك هيحكم هيحكم"
archived = "2009-10-09"
capture_url = "https://web.archive.org/web/20091009022740/http://www.20at.com:80/masr/2khbar/13643--10.html"

