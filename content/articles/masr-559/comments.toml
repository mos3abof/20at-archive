text = "هي البلد بايظة باظة في واحد عمره 80 سنة ولسة بيعرف يحكم ليه يعني ! لا وبيحكم كام 75 مليون مصري يعني هو من قله المصريين ربنا ياخدك يا بعيد انت وحاشيتك يللي بتخاف من بوش اصل انت الدلدول بتاعه وفي النهاية بادعي لالاء اللي هما مبعتوش ورقها للمفتي اصلها بلد كوسة"
