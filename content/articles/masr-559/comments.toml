posted = "2006-06-27"
text = "اعلن البيت الابيض ادراج اسم فتاه الامتحان ذات الثلاث عشر ربيعافى قائمه الارهابيين واعلنت عن مكافئه 10مليون دولار لرصدها وعاش العرب للامريكان سوال؟؟؟؟ لوالبنت دى فى امريكا ماذا كان تم معها؟؟؟؟؟؟؟؟"
