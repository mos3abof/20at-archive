[[comments]]
order = 50
subject = "سذاجة"
author = "عربي مصري محنط"
posted = "2006-06-27"
text = "اللي فالقني وموتني مش إن الحلوف عمل كده، ما أنا مش متوقع غير كده. اللي يغيظ هو طيبة الشعب المصري الزايدة عن الحد، العبط والسذاجة والهبل بتعبير آخر، كل من ضرب لنا على طبلة نجري نرقص على أنغامه.<br />السادات برضه لما عمل سلام مع أهله، والسعودية والعرب عارضوا، طلع بحكاية\"هالة الصغيرة\" قال طفلة مصرية عايشة في السعودية، وإيه بتناشده إن ينقذ أبناءه من الإضطهاد، أسألوا اللي عاشوا الفترة دي؟ النتيجة قمنا نردح للعرب بالجملة، وإخوانا بتوع الكاريكتير ماسبوش حد، وخرجت مظاهرة قدام عمر مكرم تهتف\" لافلسطين بعد اليوم!\". لو تسأل أي واحد منا يقول لك، علشان فلسطين دخلنا ثلاث حروب، بالزمة؟ تعالوا نتحاسب<br />تمانية وأربعين ممكن، وبأمر الإنجليز علشان ننهزم إحنا والعرب وتضيع فلسطين، سته وخمسين علشان تأميم القناة، سبعة وستين اليهود هجموا علينا وإحنا نايمين في العسل، تلاته وسبعين كانت برضه علشان فلسطين؟<br />خلينا مرة نعترف إننا سذج وبنجر ورا كل واحد بينفخ فينا أمجاد كاذبة. الشعب المصري أصيل وجذورة ومصيره وعمقه مع إخوانه العرب، من غيرنا همه ضايعين وإحنا بلاهم لاشئ.<br />الموت للخائن الحلوف، تحيا مصر والأمة العربية."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 51
subject = "النصف الفارغ والنصف الممتلئ من الكوب"
author = "مدحت خطاب"
posted = "2006-06-27"
text = "الخبر يحوي في مضمونه شعور بالتفاؤل وشعور بخيبة الامل ...<br />كون البنت كتبت الكلام ده يعني انه لايزال هناك امل في ان يقوم من بين ابناء هذا الشعب من يقف ويقول رايه بكل صراحة حتى لو كان ضد رئيس اكبر دولة في العالم وخيبة الامل تتمثل في من حاولوا ان يكتموا هذا الصوت بكل خسة ونزالة<br />لا أظن ان جورج بوش بكل مساوئه لو قرأ ما كتبته الطالبة أن يطلب رسوب هذه الطالبة بل سيحاول ان يستدعيها ويشد على يدها لشجاعتها ويعاقب هؤلاء الذيول التي تهتز لجبروته وصطوته<br />تحيةعطرة من القلب للطالبة النجيبة ولاتحزني يابلد لأن أشد ساعات الليل سواداً تلك التي تسبق الفجر<br />الفجر قادم رغم انف الجميع"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 52
subject = "صح النوم يا بلد"
author = "المسحراتي أبو طبلة"
posted = "2006-06-27"
text = "آه والله ياعربي مصري محنط ده حصل وأنا شاهد عليه، من يوم مبادرة الكلب السادات المشئومة وإحنا العدو بتاعنا أهل مصر الوطنين وفي فلسطين وفي السودان وليبيا و..و...و.....<br />دول نحاربهم ونربيهم ونتآمر ضدهم، أمال دول أعداء وإسرائيل صديق وحليف.<br />الواطي واطي يعني كان بوش طلب من إبن الشرموطة يعمل كده، ولو حتى كل الشعب المصري خرج يهتف الموت لأمريكا، راح يهتم بوش أصلا، مهما عارفينا نتنفخ قوي ونفش على مفيش.<br />بكره يعمل لنا ماتش كورة ونتلهي وننسى كل حاجة حتى التوريث.<br />آه يابلد إزاي أصحيكي؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

