subject = "الجريمة جريمة بلد بحالها"
author = "ماجدة سليمان"
posted = "2006-06-26"
text = "ما تزعليش يا بنتي العيب فينا مش فيك .. ببراءة فاكراها ديمقراطية ..لقيتيها قهر وسلاسل حديد حوالينا في كل مكان .. ما تزعليش .. بكرة يمكن يكون أحسن من النهاردة ..خلينا نحلم ببكرة نحلم كمان وكمان<br />فين البراءة فين ..<br />فين النقاء فين ..<br />النفوس اتلوثت ..<br />والقلوب الصافية اتغيرت ..<br />اتبدلت .. اتخنقت ..<br />خنقها الدخان ..<br />وكل ذكرى حلوة ..<br />كانت زمان ..<br />كانت وكان الحلم بالأمان ..<br />ليه يادنيا ؟<br />كل حاجة حلوة كانت زمان ..<br />ليه الألم .. ليه الندم ..<br />ليه اتبخر السلام ..<br />ليه الجامعة بقت فرقة وخصام ..<br />وسيجار أمريكي يعمل أزمة ..<br />وتضيع القضية وسط الدخان ..<br />ونضيع أنا وانت وهي ..<br />نضيع وسط الضباب ..<br />وكان الأمل في الجامعة ..<br />لقيناها فرقة جوا قلوب مصدية ..<br />وعذابات شعوب تفضل زي ما هي ..<br />وعقول صلاحيتها منتهية ..<br />تحكمنا من غير ديمقراطية ..<br />ونعيش كلنا بكرامة ملغية ..<br />نعيش وسط الرماد جوانا بركان ..<br />نفسنا نحطم الحدود نتخطى المكان ..<br />نساعد أطفال فلسطين والضفة والجولان ..<br />والناس في وادي والزعماء في فرقة وخصام ..<br />خلينا نحلم ببكرة ..<br />نحلم بفارس الفرسان ..<br />ييجي شايل حلمنا فوق حصان ..<br />ييجي يحرر أرضنا ..<br />من الأمريكان ..<br />مادام الواقع مر ..<br />خلينا نحلم كمان وكمان .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

