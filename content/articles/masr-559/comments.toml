[[comments]]
order = 19
subject = "هى دى مصر يا شباب"
author = "مصراوى"
posted = "2006-06-26"
text = "اجمل ما فى الموضوع يا شباب هو تخيلى للمدرس و انا اأسف طبعا لذكر المهنة العظيمة فى هذا الموضوع ... فالتدريس يعنى ان نعلم الانسان التفكير و الاختيار و الابداع و ليس له علاقة بما يدور من المدرسين امثاله الذين لا يقدرون على اكثر من محو امية او تحفيظ نص<br />تخيلى له (و الهاء هنا ضمير عائد عليه بالطبع) و هو يجرى و يقول الحقوا يا ناس ... الحقوا يا عالم بنت بتفكر و بتقول رأيها ... الحقونى ها روح فى داهية لان البت لو نجحت هاكون موافق و لا رسبت هيكتشفوا حقيقتى<br />ثم جاء رئيسه المحنك الخبير و قال الموضوع اكبر من كده بكثير ... ده مش كلام بنت فى الثانوية ولا حتى فى الجامعة ... نحن لم نعلم الاولاد التفكير بعد .... و الناس ديه انا عارفهم و عارف ابوها .... غلابة مفيش نت و لا ستاليت و حتى لو فيه طول النهار فيديو كلاب .... ده أكيد تنظيم سرى ...ديه مؤامرة ضد النظام و البنت ديه و ابوها عملاء فى خلية سرية .... انا لازم ابلغ و اخللى مسئوليتى ... الى ان وصلنا الى الجهاز الامنى و هو لسه مقروص من الشرم و غيرها و اصبح و جوده على كف محاولة اخرى ... و هنا ظهر عبقرى جديد و قال ... هو ده الخط الذى سنصل به الى باقى الخلية و الحماعة اياهم<br />يا سادة الموقع جميل و رائع ... احنا فعلا فى حاجة الى شباب بيحب مصر ... احنا فى حاجة الى نماذج جديدة .... بس مش علشان النهاردة ... احنا عايزين لغدا ربما يكون افضل حينما نتعلم التفكير ... حينما نتعلم كيف نتحاور و نختلف و نتفق من اجل مصلحة هذا البلد و التى هى مصلحتنا كلنا ... استمروا يا شباب .. بس بلاش تكونوا صيادين للاخطاء<br />علموا الناس حب مصر<br />دوروا على الامل و ارسلوا منه باقة لكل محتاج"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 20
subject = "إقتراح ياسادة من بياع الخضار"
author = "بياع الكوسة"
posted = "2006-06-26"
text = "يا ريت لو كان ممكن حد يستأذن أهل الفتاة الشجاعة دي، اللي عندها فهم وشجاعة ووطنية تعادل كل الجرمق اللي كل حكوماتنا من عهد الحلوف الكبير السادات لغاية خليفته حلوف الحلاليف حسنية، أقول يستأذنهم إما إنهم يعطونا عنوانها إما البيت أو الإلكتروني أو حتى رقم التيلفون، حتى نقوم بمساندتها معنويا على الأقل، إيه رأيكم؟<br />ومقدما أعبر عن أسفي إن كانت الفكرة ساذجة أو طفولية، أنا برضة ثمرة التعليم هنا، ياعالم كم مخبر درس لي وأنا ما عندي خبر، هو أنا بقيت بياع خضار من شوية، في بلد كلها كوسة؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 21
subject = "q"
author = "القبض على الديكتاتور مبارك وتقديمه لمحاكمة عادلة وعاجلة"
posted = "2006-06-26"
text = "أخي المواطن المصري،<br />هذا البيان منك إنْ كنت واحدا من الذين انتظروا طويلا محاكمة الرئيس حسني مبارك على مئات الجرائم التي ارتكبها في حق شعبنا.<br />الرئيس هو الذي أمر بنهب أموال المصريين، وقام بتسهيل عمليات النصب والاحتيال والقروض والهروب سواء بأوامر مباشرة أو بصناعة إدارة مالية فاشلة أصر هو على استمرارها طوال فترة حكمه.<br />الرئيس هو الذي قام بحماية مُجرمي الزراعة والري لأكثر من عشرين عاما، عندما علم بكوارث الأمراض والتلوث والمواد المسببة للسرطان والفشل الكلوي مما أصاب أكثر من ربع أبناء شعبنا بها.<br />الرئيس رفض معاملة المصريين إلا بأحكام عرفية في قانون طواريء مما أفقد الشعب حقه الطبيعي في الوقوف أمام محاكم مدنية.<br />الرئيس هو الذي أعطى توجيهاته بامتهان كرامة المصريين في أقسام الشرطة والمعتقلات والسجون، وتعذيبهم، واغتصابهم، وانتهاك حرماتهم، بل وصل الأمر باشعال ضابط أمن النار في أحد المواطنين، ولما علم الرئيس بالأمر استحسنه .<br />في خلال فترة حكمه دخل السجنَ أكثر من ربع مليون مواطن، ولايزال يحتفظ بثلاثين ألفا دون محاكمة اذلالا لهم ولأهلهم وذويهم.<br />هل هناك أحد لا يظن أن المشهد المصري في عصر الطاغية كارثة تنذر بطوفان؟ فشل في كل المجالات الزراعية والصناعية والاعلامية والسياحية والادارية والتعليمية والأخلاقية والتربوية والثقافية والفنية فتراجعت مصر في عهده، وتقدم لصوص صنعهم لسرقة اللقمة من أفواه المصريين، وشهدت البطالة والعنوسة وسكان المقابر والغلاء والأمراض والادمان والفساد والتلوث والتهريب حالة مصرية عامة، ولا يزال يُصرّ على الكذب، ويقوم بتصعيد ابنه ليصبح الوحيد المؤهل فيرشحه مجلس الشعب دون المرور على فكرة التوريث المرفوضة شعبيا.<br />هذه ا<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

