[[comments]]
order = 31
subject = "بلد ساقطة"
author = "أبو أسامة"
posted = "2006-06-26"
text = "حاجة تضحك ما البلد كلها عارفة وبتقول<br />الكلام الى قالته ألأ يبقى البلد كلها<br />ساقطة.فعلا البلد دى كلها ساقطة فى التعبير<br />بالذات لأنهم يا عينى مش قادرين يعبروا<br />عن الهم الى حسين بيه حتى الى بيعبر بيسجنوه زى المواطن الى مع ابراهيم عيسى<br />ولا يسقطوها زى ألأ يا رب تسقط فى بلاعة ماتطلع منها يا حسنى انت والكلاب الى حوليك<br />امااالمدرس التافه اللى بينه من امن الدولةولا من امن التعريص انت بتعلم الطلبة بتوعك ايه بالظبط انهم يبقوا معرصين زيك وموالين لأمريكابتعلمهم ان<br />الفلسطنين ارهابيين وان الى يطالب بحقه<br />يبقى ارهابى وان الى يقول الحق يبقى<br />خاين .الله يخرب بيوتكم مليتوا البلد<br />هو التعريص بقى فى كل مكان حتى فى التعليم<br />اتارينى بقول الشباب راح فين الجامعة الى كانت بتدار فيه المظاهرات وبتخرج منها الأصوات بقت كلها اموات كل الى يهمهم الموضة والفيديو كلب اهم الى زيك هما السبب فى خراب البلد لأنه بيعلم الخنوع والذل والتفاهة والتعريص يبقى انت بقى<br />والى زيك السبب فى الى احنة فيه من الصمت<br />الى خلانة فى أسوأ مكانة فى العالم وفقدنا<br />احترامنا لنفسنا وشبابناالى ضاع فى الهيافة والتفاهة منك لله انت والى زيك."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
