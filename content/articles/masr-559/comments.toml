text = "مو عيب يا مصحح تدمر مستقبل شابه لانه عندك مشكله مع والدتهه واحب اضيف انه سبب تخلف الوطن العربي وتدهور اوظاعه هو وجود مثل هذا المصحح المحترم في الوظائف الحكوميه .كفاكم تملق لامريكا واذيالها من الحكام العرب وانتبهوا لانفسكم قبل ان ياتي يوم لا ينفع فيه ندم"
