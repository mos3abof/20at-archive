text = "أظن أن الموضوع واضح فصغار كبار الموظفين هم من هيمنوا وأسسوا التعقيدات فى كل حياتنا ولا عجب أن تكون وزارة بها هذا الكم من المحالين للمحاكمة بسبب تسرب الأمتحانات أن يكون هذا حالها<br />أحب أن نعرفكم بفضيحة أخرى داخل تلك الوزارة وهى حجب إعلان بعض نتائج أبناؤنا بالخارج رغم تقديم الأوراق للسفارة المصرية بجدة وبها جميع عناوين المراسلات قبل حوالى خمسة أشهر من الأمتحانات ورغم قيام المسئولين بإصدار أرقم الجلوس بحجة عدم إستكمال الأوراق"
