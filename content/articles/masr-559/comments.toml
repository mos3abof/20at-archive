[[comments]]
order = 56
subject = "حربنا في أكتوبر ليه؟"
author = "ساقط توجيهية"
posted = "2006-06-27"
text = "حربنا في أكتوبر ليه؟<br />معلهش يعني أصلي ساقط ثانوية عامة وبعيد عنكم قفل وغبي، سؤالي للي يعرف، هو إحنا حاربنا ليه في تلاته وسبعين ومين وعلشان إيه بالظبط؟<br />حاربنا علشان تبقي عيلة السادات كلها ملياردية وعيلة الحلوف مبارك، وعلشان أرض مصر تطلع لنا حرامية كثير قوي زي عيش الغراب فوق أكوام السبخ والجلة، بلا مؤاخذة؟<br />حاربنا علشان نبقى عميل أمريكا الأول بين العرب؟<br />حد يقولي؟ حد يفهمني؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 57
subject = "متزعلش مني والنبي"
author = "متزعلش مني والنبي"
posted = "2006-06-28"
text = "لجان حقوق الجان؟ سلامات يابو لجنة ليه يا أسطى بقينا في أوروبا وماعنديش خبر؟ أخشى ما أخشاه إن الحلوف المنوفي ماسيبش حكاية إنهم فضحوا الحكاية في الفضائية، وبعد كام يوم نسمع خبر حادث سير، آه ونقول زي العادة المرحوم كان غلطان، وأسيب ليك إختيار المرحوم، لاقدر الله.<br />إحنا أجبن شعب على وش الأرض من يوم ما إتخلقت، خمسة وسبعين مليون فار، مافينا راجل وإلا، ياحبيبي خلي مبارك الحلوف عنده إتنين مليون عسكري، لو كل واحد منا تف عليهم تفه والله نغطيهم لو عايزين. لو كنا رجالة وبنفهم ما حكمنا حتى المماليك اللي كنا بنشتريهم قرون طويلة وبعدهم العثمانين، إحنا قطيع فيران خواف.<br />ربنا لما أرسل موسى وهارون قال\"إذهبا الى فرعون إنه طغى، فقولا له قولا لينا لعله يتذكر أو يخشى!\" ولاذكر للمصريين كشعب مرغوب في هدايته بكل القرآن، ليه لأننا عبيد بننساق زي العميان ورا الفرعون.<br />إقتراحك وجيه لو كان حد في العالم بينظر لينا كبشر النهارده، الشكر للكلب ده وللسادات اللي خلونا أقل من السباخ."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 58
subject = "بدون زعل"
author = "أبو شادي"
posted = "2006-06-28"
text = "أول شيء والسؤال موجه للأخ وزير التعليم المصري وأكيد لازم يكون عنده خبر بمثل هيك حدوتة على رأي أخوانا المصريين ؟؟؟؟<br />لماذا وبأي حق تم ما تم مع هذه الفتاة أو مع هذه الطالبة .........<br />أولاً هي لم تتعدى على الحكومة ولا على رئيس الحكومة ولا على الرئيس نفسه , يبقى ليش تتعاقب هذه الطالبة على مجرد كلمات<br />والله لو قال هذه الكلمات شخص أمريكي لرفعوه فوق الأعناق وعملوله حفلة وكرموه .<br />انتو بتفتكرو أمريكا هبلة زيكو علشان مجرد كلمات تعمل منها قضية وتحقيق وقلبة على الحكم والحاكم .<br />هل هذا يعقل يا وزير التعليم ؟ وبعدين يا سيدي ده كان مجرد رأي .الطالبة لم تطلب منكم ان تحاربو أمريكا. أعقلوا بقا وعيب الي بيحصل ده .<br />فلسطيني طفران ............."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 59
subject = "تحيا الحرية"
author = "م اعدادي هندسة"
posted = "2006-06-28"
text = "في البداية أحيي ألاء من كل قلبي وقول لسه فيه امل في شباب الأمة الجيل الصاعد هو اللي هتقوم ع ايده الحريه والتقدم بس بعيد عن تلاميذ الحزب الحاكم وانا مع الاء في كل كلمة وقولها ان كنتي بتتحربي دلوقتي عشان قولتي كلمة الحق فاثبتي كلنا معاكي وهنقف معاكي وأوجه كلامي لوزارة التربية والتعليم عيييييييييييب عليكم كفاية كبت لحريات المواطنين مش كفاية غلا الاسعار والاقتصاد اللي في الحضيض ومعاناة الطلاب في التعليم ونظمه السيئه واعتقالات المواطنين حرررررررام نسيتم يوم الحساب والعرض على رب العباد اتقوا الله في أنفسكم وفي الشعب المطحون"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 60
subject = "العميل المنافق"
author = "أبو إسراء"
posted = "2006-06-28"
text = "الدكـ(طور)الذى كان موجودا اليوم فى برنامج العاشرة مساء أريد أن أعرف هويته بالضبط هل هو عميل مأجور ؟ أم أنه ينافق الرئيس لغرض دنيوى دنئ حقير مثله ؟000 أعتقد هذا فهو (طور) ظالم منافق يريد الكرسى 00لكنى أذكره بالمقولة الشهيرة 00 لو دامت لغيرك ما وصلت إليك 000 ولعلمك أنا متأكد إن شاء الله بأن الرئيس الأب الإنسان حسنى مبارك سوف لاترضيه هذه المهزلة التى افتعلتها أنت ووكيل الوزارة الذى انخدعنا فيه (ناقص )عنانى والله أحمد المرسى جوهر كان أحسن وأفضل منه ألف مرة"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

