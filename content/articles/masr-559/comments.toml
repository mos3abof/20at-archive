[[comments]]
order = 12
subject = "وكأنها تتطاولت علي الذات الالهية"
author = "ميوزة"
posted = "2006-06-25"
text = "استغفر الله العظيم وكان البنت تتطاولت علي الذات الالهية انا سمعت البنت بتتكلم علي العاشرة مساء وبصراحة مبروك ليها السقوط وياريت كل الناس الي بتعيد السنة تكون زيها ياه منتهي الظلم والاجحاف ويا سلام لو سمعت المذيعة وهي بتسال وكيل الوزارة هي الاء كتبت اية بالظبط يقولها لا يا فندم مقدرش اقول الكلام الي كتبتة والبنت تقول انا بقي عايزة اعرف انا كتبت اية طب فكروني انا مش عارفة وأجمل حاجة لما البنت قلت لمني الشاذلي اذا كانت المظاهرات بتطلع قدام البيت الابيض وتشتمه .<br />صحيح اية يعني بقي هم هناك يشتموه ومحدش يقدر يقلهم حاجة واحنا هنا لو حد فتح بقة يكتموة ويكتموا اهلة بلد عجايب صحيح لا والي يضحك اكتر من كدة لما ابوها بيقول لوكيل الوزارة انا جيت لحضرتك كذه مرة ومعرفتش اقابلك الوكيل يقله محصلش طب يا اخي اذا كان المتحدث مجنون فالمستمع عاقل هو من امتي في مواطن في البلد دي بيعرف يقابل مسئول متخلي الطابق مستور احسن.<br />وفي النهاية هي دي نهاية اي حدح بيفكر في البلد دي وعلي راي مني الشاذلي يبدو ان مشكلة الاء الرئيسية هي زيادة الافكار"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 13
subject = "يا عملاء يا ولاد ااـ.."
author = "مصرية مقهورة بموقع صحاب"
posted = "2006-06-25"
text = "يا ولاد الـ.... يا عملاء ، بنت عمرها 15 سنة هتشتغل فى تنظيم سرى ، جتكوا القرف والمصحف الواحد قرف من مصر بسببكم الواحد يج يروح فين يا كفرة ، خربتوها وقعدتوا على تلها فرقنا ايه عن العراق استعمار بالباطن وحكومة زى صدام بالمدة والزمن فرقنا ايه يا بلد ، شبابنا راحوا من المبيدات المسرطنة وفولسنا راحت مع حرامية البلد وصحتنا راحت مع الماية المصدية حسبى الله ونعم الوكيل بينام ازاى بيجيله نوم ازاى ، هيقول ايه يوم الموقف العظيم ، ربنا يزله يارب ، يارب مش عاوزين حاجة غير ارحمنا برحمتك من القهر والذل والفقر اللى نابنا من الفساد والرشاوى اللهم ان طلب الموت لا يجده يتمناه ولا يجده هو واولاده وزوجته ، يارب كووون مع الغلبانة البنت المثقفة اللى حاسة ببلاوى بلدها اللهم انها دعوة بنت مظلومة فلا تردها يارب العالمين ..... اللهم تقبل دعائى فهو فى جوف الفجر اللهم آمين ."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 14
subject = "تعليق تانى للعميل"
author = "اديبة مصرية"
posted = "2006-06-25"
text = "يعنى البنت دى تعمل ايه ، تكتب لهم عن السياحة ف الصحرا ، يا جهلة يا متخلفين مهو لازم تكتب عن حالة مصر الاقتصادية مرورا بالباشا اللى استعمارنا وحنا فى دارنا ومرورا بخط الفقر اللى طال الطبقة المقتدرة والمتوسطة ومرورا كمان بمستوى الخدمات والمعيشة النار عاوزين نغنى ونقول اخترناك ياخى .... ارد اقول ايه بس سؤال حارق دمى والنبى اللى قرب ع التمانين دة معندوش شيخوخة مبكرة ؟؟؟؟؟ بيحكم ازاى ولا هو صحيح ميحكوووووومشى والله انا نفسيتى تحت الصفر سافرت بلد اخرى وقد ايه غارت نفسى على بلدى اللى كلها حضارات واماكن اى دولة تتمنى تبقى فى جوها او تاخد حتة من جمالها ، اللــــــــه يلعنه شرد ناس واعتقل ناس وماتت ناس ظلم وجودع ورشاوى هياخد ايه معاه ، يا خلق حد يرد عليا هياخد ايه حفرة ضيقة ضلمه كحل يطلعلك بعدها الشجاع الاقرع تعرفه؟؟؟؟ الغريبة انه عارف انه مكروووه من الكل ، بس صدقونى الشيخوخة بانت حتى لو عمل 80 عملية شد وتجميل وبقى عمرو محيو ملك جمال لبنان ودليل على تخريفه مستناش على ايمن نور واتلفق له واتحبس واهو بيموت ف السجن ، وقلنا اهو ايمن عمل وعمل وصدقنا كدبه لكن نعمان جمعه كمان الله؟ اشمعنى دول بس دور خدلك 300 جمبهم يا اخى عشان تتحبك بلاش هبل وعبط ، روح جوز ابنك اللى عنده سرطان مو من اعمالكم سلطت عليكم ولو ان الشماتة مش من طبع المسلمين الا انى والله شمتانه يارب يموت قدام عنيك ، اكبر مستشفى ف الشرق الاوسط للسرطان معمولة فيكى يا مصر ، بالجهود الذاتية بقى مرض عادى ، سقطت البت عشان موضوع تعبير ، روح اقلب فرشة الجرجير بتاعة الراجل الغلبان لأنه بيدعى عليك واقلب قدره الفول للراجل عشان بيحسبن عليك واقلع زرع المستأجر الارض عشان المبيدات طلعت مسرطنة ياباشا ربنا لما بيكره حد وميحبوش يطول ف عمره عشان حساب<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 15
subject = "بلد كوسه صحيح"
author = "مصرى مقهور"
posted = "2006-06-26"
text = "أه يا بلد تعبنا من الذل والقهر ووكتم حرية التعبير هماالناس دولعاوزين مننا إيه بالظبط وشيخ المنصر بتاعنا خلاص يعنى ورثنا هو بالظبط ولا إيه يعنى مصر كلها مفيهاش غيرة اللى يعرف يحكم ماهو لو كان عرف كنا نقول مش مشكله غير ده دمر البلد ودمرنا حتى الأطفال يا ناس مش قادرة تتكلم عاوزنا نعمله إيه يعنى نصليله ركعتين يعنى الله يكحته مطرح ماهو قاعد يا رب خدوا يا رب إحنا مش عاوزينه تعبنا منه ومن الجماعه المعرصين بتوعه المصرى دلوقتى ملوش كرامه فى بلده ولا برة بلده وأأأأأأأأأاه يا بلد.وبعدين ماله الريس<br />>والله انتم ظالمين الراجل<br />>ضيّع عمره ومين يستاهل<br />>حتى الاكل بياكله بدالنا<br />>طالع واكل نازل واكل"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 16
subject = "اسفة انتمى لتنظيم المثقفين"
author = "مصرية وتهمتى مثقفة"
posted = "2006-06-26"
text = "صباح الفل يا بلد مقهورة<br />صباح الورد ملعوبة بيكى الكورة<br />النهاردة مش هعلق<br />هقول كلمتين ف حق الغلبانة آلاء<br />عشان الحرامى يسمع والكلب يحس<br />والكافر يتعظ ، والناس اللى بتقرا تحس وجعة قلب واحدة مصرية محروووووقة زيكم ..... ممكن تقروا دة معايا<br />((((( سامحينا يا آلاء))))<br />عملتى ايه ياآلاء<br />ليه صوت الحق ضاق<br />ردوا قالو بجفاء<br />تنظيم سرى ووباء<br />عملتى ايه يا الاء<br />نقلت الصورة صح<br />عن صحرا زرع بح<br />عن اقتصاد وراح<br />عن بوش وريس مرتاح<br />عملتى ايه يالاء<br />هاجمت انا فى التعبير<br />عن اللى كان له ضمير<br />عن عصر كلو فساد<br />ريسنا قال دة رخاء<br />عملتى ايه يا الاء<br />تعبيرى اخد عشرة<br />نادونى بأنى حشرة<br />ابصم ليكو بالعشرة<br />انا لا جمال ولا علاء<br />عملتى ايه يالاء<br />غلطتى ثقافتى وقرايتى<br />ادى قصتى وحكايتى<br />اسقط واعيد السنة<br />واكون عبرة للى جنى<br />يفكر يكتب تانى<br />تعبير بلد بتعانى<br />سامحينا يا الاء<br />توب الرجولة ضاق<br />ومعادش ينفع نشجب<br />لازم نطاطى ونسكت<br />بنقدم الولاء<br />سامحينا يا آلاء"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

