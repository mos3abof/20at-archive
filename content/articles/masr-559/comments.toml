posted = "2006-06-26"
text = "حرام عليه انا وعلى امى لانى قريت تعليقتكم الظالمه ديه على رجالنا ومناضلنا فى الحروب ضد المصريين والاحرار. ضد اطفالنا وشبابنا حتى الناس الكبار يا قلبى اللى فى سن نعمان جمعه مسلمش بس برضوا الاء لسه صغيره واكيد هم بيمرنوه على الصبر والنداله حتى تكون مواطنه مصريه كفيفه قصدى شريفه ييوووووووووه وعجبى"
