text = "واللة يا جماعة كفاية ان الواحد يقول امتي حيمشي من البلد ال؟؟؟؟؟؟؟؟ دي<br />وكفاية ان الواحدبيحس بالغربة في بلدة<br />وعلي العموم البلد دي للحرامية الكبار بس<br />وفي النهاية البلد دي ماشية بنظام ابناء العاملين حتي في الرئاسة وربنا يستر عليناوعلي عيالنا<br />من اخ اتخنق من بلدة وحياتة في البلد الوسخة دي"
