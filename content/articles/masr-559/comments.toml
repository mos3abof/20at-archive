posted = "2006-06-26"
text = "أنا أتضامن معك يا بياع الخضار<br />ليتنا نستطيع الأتصال والتواصل معهالنعوضها بعض الذى عانته بسبب الظلم والأجحاف وحقوقها التى ضاعت بسبب سلبيتنا وصمتنا. فلو كنا ببلد أخر لأستطعنا أن نجبر الحكومة على التراجع ولكن ما باليد حيله . من يستطيع التوصل الى هاتفها أو عنوانها يخبرنا لطفا ."
