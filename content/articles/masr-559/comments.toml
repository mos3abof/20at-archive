[[comments]]
order = 2
subject = "ولا يهمك"
author = "مها"
posted = "2006-06-24"
text = "لقد رأيت منذ دقائق تلك الصغيره الأء مستضافه فى البرنامج الشهير العاشره مساءا.<br />مالهذه الصغيره الهشه من قدره على الأهانه والسب,بل ماكتبته أنما نابع عن كبت طال أمدا وأحوال فاسده تراها حولها والذى أكد لديها تلك الفكره الموقف المتعصب الغاشم الذى أتبعته معها وزاره التربيه والتعليم . حيث أستبدلت معنى أسمها بأخر . فبدلا من أن تناقش وتقنع وتربى زبحت وأحبطت وأضاعت مستقبل تلك الصغيره الأء. بربكم ما الخطر الذى تمثله طفله فى عمر الزهور . أهذا هو العلم الذى نرجو به أبنائنا. أين حريه الرأى والتعبير أم تريدوننا أمه من الصم البكم . نحن نحكم بمبدأ أن الشعب الجاهل سهل القياده.<br />الأء لا تهتمى يا ملاكى أن أجهضوا حريتك يوما سيأتى اليوم الذى تصرخين فيه بأعلى صوتك بحريه بدون قيود."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

