[[comments]]
order = 4
subject = "عندما تخلو الساحة إلا من أشباه الرجال"
author = "بقلم : محمود شنب"
posted = "2006-06-25"
text = "لا فائدة ... كلمة قديمة وجديدة .. قالها بالأمس سعد زغلول ، ويقولها اليوم الشعب المصرى المغلول بجرائم حكامه وهوان نظامه واستقواء الفاسدين وتمكنهم من كل مواقع الدولة..<br />ولسنا الوحيدين فى ذلك ، فكل عربى يشعر بما يشعر به كل مصرى ، لكن وزن الهم يختلف وما يشعر به المصرى لا يتساوى مع ما يشعر به الخليجى أو اليمنى ، فالمواطن المصرى الذى كان يفخر بالأمس بأن بلاده كانت على مر التاريخ قائدة ... يتجرع اليوم حسرته وهو يراها قوادة..<br />المصرى الذى عاش لأكثر من ألف عام يفخر بالأزهر ... يدارى اليوم وجهه خزيًا وعارًا من تصرفات شيخ الأزهر وبعض رجاله..<br />المصرى الذى شاهد أجداده يحفرون قناة السويس بأيديهم ... يعز عليه اليوم أن يحفر قبره بيده..<br />المصرى الذى علم الدنيا كلها ... ترتفع فيه نسبة الأمية لتغطى نصف شعبه..<br />المصرى الذى آمن بالتوحيد من قبل نزول الرسالات ... يعيش حكامه اليوم على الشرك والضلال وموالاة الأعداء ويعيش شعبه على المعونات والصدقات..<br />المصرى الذى نشر الفضيلة فى كل أرجاء الدنيا ... تتعرى نساءه اليوم فى النوادى والطرقات..<br />المصرى يُحارب اليوم من الداخل أكثر مما يُحارب من الخارج ، ويلقى الهوان على يد حكامه أكثر مما يلقاه على يد أعدائه..<br />لكن النظرة العامة للمنطقة وأساليب الحكم وأنواع القضايا يجعلنا نجزم بأن العرب على اختلاف أقطارهم يشعرون بشعور واحد .. شعور الإهانة والإمتهان وفقد الكرامة والشرف .. من أجل ذلك أقول ان ما يشعر به كل مصرى يشعر به أيضًا كل عربى من أقصى الخليج إلى أقصى المحيط \"فكلنا فى الهم شرق\" مثلما يقول شوقى ، وحكامنا لا يختلف أحدهم عن الآخر .. لقد بصق كل منهم فى فم الآخر بعدما بصقت أمريكا فى وجوههم ، فصار اللعاب واحدًا وصارت القذارة واحدة.<br />يقول أحمد مطر<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 5
subject = "يووووة"
author = "رنا"
posted = "2006-06-25"
text = "لا حول ولا قوة الا باللة. لية يحاكموا واحدة ماقليتش غير الحقيقة؟ اللى على راسة بطحة يحسس عليها! وبعدين لما هما مش قد حرية الراى سمحوا بيها لية و اذا كان بوش بيتشتم من امريكا ذات نفسهاهى جات علينا يعنى. بصراحة للازم يبقى فى وقفة لان اللى حصل دة ممكن يحصل لاى حد و يكون اوحش من الاول و ساعتها مش حنقدر نعمل حاجة."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 6
subject = "ياصبر أيوب"
author = "أيوب"
posted = "2006-06-25"
text = "كويس إنهم إكتفوا بكده، مين عارف لو كانت هي ولو حد من أهلها زار بلد عربي من مية سنة حيلفقوا ليها إيه؟<br />من رؤوس القاعدة وقيادتها؟ وسمير رجب وسعده ونافع وكلاب مايو وباقي شلة الأنس يسبحوا بحمد الحلوف الكبير، ورجال الأمن الي وجودوا معاها أقلام رصاص كثير، كانت ناوية تهرب الجرافيت المصنوعة منه لإيران علشان بناء المفاعل النووي بتاعها. بالزمة مش حيطالبوا بأنها تروح جوانتامو، وإلا تحال أوراقها للمفتي اللي مش حيمانع وحيرحب زي العادة.<br />بلد إيه دي اللي راكبها حلوف خاربها، مش كما تكونون يولى عليكم. بالزمة فينا واحد بيفهم هنا وعنده دم، وميقموش ولو يحدفهم بالطوب زي أطفال الحجارة في فلسطين؟<br />خلينا ساكتين لغاية مايخذوا منها ثمن الهوا اللي بنتفسه إن مكناش بندفعه فعلا. حد قرا مقال الإستاذ شنب؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

