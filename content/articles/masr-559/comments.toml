[[comments]]
order = 8
subject = "مدرس ولا مخبر يا وزراة التعليم"
author = "بياع قوطة"
posted = "2006-06-25"
text = "ملعون أبوها بلد اللي فيها المدرس بيشتغل مخبر، إيه ده؟ ولافي مجاهل أفريقيه سمعنا عن حاجة زي دي.<br />هو التعليم مستواه بقي مليون درجة تحت الصفر من شوية، ياناس إذا الكورة اللي ماحناش فالحين نفتي إلا فيها، سبقتنا بلد زي غانا في الفيفا، جتنا نيله والله إحنا جبناء وأذلاء ومافالحين إلا في الفشخرة والهمبكة، وإحنا اللي بنينا الهرم ودهنا الهوا دوكو، وإحنا بهيم زي الحلوف ده ممشينا على العجين مانلخطبه، بلا فلقه، إمتى حنحس؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 9
subject = "لماذا؟؟؟؟؟؟؟"
author = "ايوته"
posted = "2006-06-25"
text = "فليمهل الله هذه الفتاه واهلها الصبر على ما ابتلاهم من ظلم للفتاه والتى ضاع مستقبلها وكل ذلك لانها قالت الحقيقه التى يجب ادراكها قبل ان تحدث الكارثه ونعود مره اخرى لما حدث سابقا واحتلال الانجليز والاجانب لبلادناكفانا نفاقاومسانده لهؤلاء الكلاب الذين لا يريدون الا احتلال مصر والسيطره على الجزء الاكبر من الوطن العربىفليحمى الله مصر من شر البلاد الاخرى ومن يريدون اخذها غصبا وهذا قطعا سيحدث اذا استمرينا فى هذه الذله والمهانه والخضوع لما يقوله الاخرون واخيرا اقول لهذه الفتاه اصبرى فسيرد اليك حقك يوما ما وحسبنا الله ونعم الوكيل حسبنا الله"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 10
subject = "طب عايزنها تجاوب إيه ياحيوانات ياحكومة؟"
author = "بياع قوطة"
posted = "2006-06-25"
text = "محنا محتلين جاهز يا ايوته والله، شوف السعودية وبلاد الخليج، شوف العراق والسودان وشوف ليبيا، وعندنا مش اليهود في سيناء، آسف بيسموهم قوات طوارئ دولية.<br />حلوفنا حيحامي عن سمعة أمريكا؟ ده أخلص حليف لأمريكا إسرائيل بتديلها كل يوم بالشبشب، واللي يبيع نفسه رخيص يبقى ذنبه على جنبه، الكلام لل.....<br />كان لازم التلميذه تجاوب تقول إيه؟ بتوع حماس همه السبب؟ ولا الفلسطنيين والعرب؟ ولا العراق؟ مسخرة دي وعبودية ما مرت في تاريخ الأمم، ملعون جدودك ياحسنية وملعون أبو المنوفية كلها،"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

