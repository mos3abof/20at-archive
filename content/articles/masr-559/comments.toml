author = "ندا"
posted = "2006-06-26"
text = "انا في نفس سن الاء و ارى ان ما فعلته هو رد فعل طبيعي لاي مواطنه مقهوره و لا تحد اي تعليم او اهتمام ثقافي او رياضي او حتى صحي جيد و او كنا في اي دوله محترمه لكان فعلها هذا شيئا عاديا و لكن انا ارى انها حتى لو كان عندها قليلا من الوعي السياسي فقد اختارت الموقف غير المناسب لان هذا لا يفيد احدا فالمصحح هو الشخص الوحيد الذي سيقرا هذا و هو مجرد موظف حكومي مقهور و بقاله 5ساعات بيصحح و لكن مع ذلك احييها على موقفها البديهي"
