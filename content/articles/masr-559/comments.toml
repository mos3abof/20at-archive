subject = "مصر \\\\المنصوره"
author = "محمد صلاح"
posted = "2006-06-30"
text = "هل المسلمين ارهابين؟ (هذا ما تعرفه عنا امريكا) هل نحن همج ؟ (هذا ما تعرفه عنا امريكا). اقروا الصحافه الاجنبيه \\ اقروا ما كتبوا عن الرسول كنت اتمني من الرجال الاشداء العظماء الذين قرءوا موضوع التعبير ان يهاجموا اعداء الاء وهي علي حق (ملحوظه) رجال التربيه و التعليم ليس لهم اي عمل و لذلك يتصيدون اي مشاكل تجعلهم ابطال"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

[[comments]]
order = 65
subject = "عزينى يابهيه"
author = "محمد احمد"
posted = "2006-07-01"
text = "عزينى يابهيه فى الامه العربيه وحكامنا يابهيه عايشين فى الدنيا تايهين يابهيه .امريكا تأمر وهما حاضر ياعنيا .كلهم يابهيه خايفين يابهيه والكرسى يابهبه مريح يابهيه .وان واحد قال رايه يابهيه سنينه سوده يابهيه اما ارهابى او فى تنظيم معادى يابهيه والله يابهيه انا حاقولك حاجه ورزقى على الله يابهيه التلاميذ بالصف السادس يابهيه مش عارفيين يكتبوا وبيغشوا وبينجحوا يابهيه وعلشان انا مدرس كل ما ادخل لجنه الاقى الغش مفروض من الملاحظيين وخصوصا حاملى دبلوم المعلمين يابهيه والله 90فى الميه منهم ماينفع يابهيه"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

