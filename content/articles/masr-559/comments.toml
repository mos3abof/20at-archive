[[comments]]
order = 27
subject = "حيبيع بنات مصر القاصرات الوقتي؟!"
author = "بديع الزمان"
posted = "2006-06-26"
text = "إسمعوا يا إخوانا من فضلكم، مفيش حد في المحيط اللي له إحتكاك بمصر مايعرفش تفاهة وحقارة نظامنا الحاكم من سنة سبعين لغاية النهارده والي أن يشاء الله زواله.<br />لا مواخذة حتى المعرص بياخذ بدل السمسرة بتاعته، وإبن الكلب الحلوف مين طلب منه يعمل ده؟ وإيه المكافأة اللي بيتوقعها مقابل بهدلة تلميذة لا هي خبيرة إقتصادية، قالت رأيها. يتوقع البتاجون يقوله برافو ياواد ياحسنية، وإلا إيه بالظبط.<br />مش كفاية إبن المومس باع الفلسطنيين وقبض، والعراق مرتين وقبض، وقبل كده مصر والسودان وليبيا وبيحجل دلوقتي حوالين سوريا، لأ فاضل يبيع بنات مصر القاصرات؟ ده حصل في العراق المحررة، من الشيعة والأكراد للكويتين ولأغبياء الخليج والسعودية.<br />عايزين ده يحصل عندنا؟ أقصد علني وعلى عينك ياتاجر؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

