[[comments]]
order = 43
subject = "كلنا لهاااااا"
author = "محمد سالم"
posted = "2006-06-27"
text = "والله شئ محزن ومقزز<br />ان نتشدق بالديموقراطيه ونحن نرتعب<br />منها ومن يحاول ان يسلكها<br />تنظيم القاعده اصبح هاجس الجميع<br />انت لا تحب امريكا اذا انت تبع تنظيم<br />سرى او تنظيم القاعده<br />الديموقراطية برواز فقط ممنوع الاقتراب<br />منه ... والبنت غلطانه كان المفروض<br />تمدح فى الامريكان شويه<br />ربنا سيتر على البنت دى<br />وما تتسلمش للامريكان ومصيرها<br />معروف طبعا ثم الارسال الى جونتانامو<br />الان لا يوجد فرق<br />ليه ياجماعة كدا<br />بدأناها بمعاهدة سلام<br />وستنتهى بنا للذل والخنوع والرعب<br />هذا مصير من يساير امريكا واسرائيل<br />صدقونى عندما تصاحب لا تصاحب الا<br />ماهو مكافئ لك عندها ستشكلان قوة<br />الان نلبى الامر على استحياء<br />غدا سنصفع لتلبيته<br />محمدسالم"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010807/http://masr.20at.com:80/article.php?sid=559"

