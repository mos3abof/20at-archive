[[comments]]
order = 2
subject = "مصر أولاً"
author = "مصرى بيحب مصر"
posted = "2005-11-21"
text = "ؤية مستقبلية : أستطاع الأخوان طوال السنوات الأخيرة أن تهيأ الرأى العام إلى ما حدث اليوم من بدأ ضياع مصر و تفككهاوكان الأخوان يعتمدون على الأموال الطائلة القادمة من الخارج وعن طريق الوصول إلى كل بيت و توزيع المال عليها والهدايا و أستقطاب الأطفال من الصغر و أستغلال ظروف البلد أن تضحك على هذا الشعب الطيب بالدين أى أنها تتاجر بالدين من أجل الوصول إلى الهدف الذ سوف يزج بمصر إلى ما وصلت إليه العراق ويخطأ من يعتقد من الأخوان أن الأمور ستسير كما يريدون بدون صدام إجتماعى رهيب يودى بمستقبل مصر إلى التهلكة فرسالتى للأخوان أن يراجعوا أنفسهم قبل أن تضيع مصر بدون أن يشعروا وبالتالى لن يحدث لا أصلاح و لا نهضة للأمة"
archived = "2007-08-17"
capture_url = "https://web.archive.org/web/20070817123136/http://egyvote.20at.com:80/article.php?sid=29"

[[comments]]
order = 3
subject = "الذين يتخذون الكافرين أولياء"
author = "زائر"
posted = "2005-11-21"
text = "ال تعالى: \" بشر المنافقين بأن لهم عذابا أليما . الذين يتخذون الكافرين أولياء من دون المؤمنين . أيبتغون عندهم العزة فإن العزة لله جميعا\".[النساء138و139]<br />هذا نص حوار نائب المرشد العام للإخوان المسلمين لقناة الجزيرة<br />محمد خيرت الشاطر [متابعاً]: في دائرة وادي النطرون إحنا بندعم مرشح قبطي هناك في مواجهة الوزير اللي موجود مرشح الحزب الوطني، المرشح القبطي مرشح مستقل.<br />أحمد منصور: وادي النطرون وزير الزراعة المرشح فيها.<br />محمد خيرت الشاطر: آه وزير الزراعة إحنا بندعم مرشح قبطي هناك مستقل إتصل بينا ونسقنا معاه ووافقنا على دعمه بشكل واضح وبالتالي مش قاعدة إن إحنا ما بندخلش في كل دوائر الوزراء أو الشخصيات الكبيرة.<br />أحمد منصور: بخصوص المرشح القبطي ما طبيعة العلاقات والتحالفات بينكم وبين الأقباط؟<br />محمد خيرت الشاطر: نحن على قناعة إنه لابد من تمثيل الأقباط في الحياة السياسية، شأنهم شأن أي فصيل آخر موجود في المجتمع المصري بغض النظر عن قضية الدين إنما إحنا بنتكلم عن قضية مصر الآن وقضية نهضة مصر وبناءها بعد حالة التخلف الشديدة وبعد تفشى مثلث التخلف والفساد والاستبداد اللي موجود وبالتالي نحن نرى إنه كل القوى لابد أن تكون موجودة وممثَلة وعلاقتنا بالأقباط علاقات صحية ومستمرة وليست وليدة هذه الأيام وليست مرتبطة بالانتخابات وده أمر بيأمرنا به ديننا أصلا.. يعني المسألة مش مسألة تكتيك ولا مسألة سياسة كما يحاول البعض أن يروج وهمّ الأقباط اللي اتصلوا بينا، إحنا في الانتخابات السابقة تعاونا مع الأستاذ منير فخري عبد النور وتركنا دائرة الوايلي أو دعمناه فيها وهذه المرة أيضا نفس الموقف وكذلك في دائرة وادي النطرون ولا مانع لدينا من التعاون مع أي مرشح قبطي أو أي مرشح من أي قوى سياسية أخرى أو من أي فصيل آخر طا<br />اقرأ بقية التعليق .."
archived = "2007-08-17"
capture_url = "https://web.archive.org/web/20070817123136/http://egyvote.20at.com:80/article.php?sid=29"

