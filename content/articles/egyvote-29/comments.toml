[[comments]]
order = 8
subject = "شجاعه دكتورة نهى الزينى"
author = "منقول"
posted = "2005-11-28"
text = "قفت د.نهى وقفة مائة رجل وهي تدلو بشهادتها عن مخالفات قانونية شهدت حدوثها في الرقابة على الانتخابات. تقطعت بها الأسباب لكي تحول دون وقوع الخطأ. ولكنها لم تصمت؛ بل شهدت شهادة حق تكتب لها عند ربها. وأبت أن تسكت على الباطل؛ حتى لا تنعت بوصف بعض السلف: \"الساكت عن الحق شيطان أخرس\". إذ تقف شهادة المؤمن له يوم القيامة، وتكون النجاة والشافعة له يوم لا ظل إلا ظله."
archived = "2007-08-17"
capture_url = "https://web.archive.org/web/20070817123136/http://egyvote.20at.com:80/article.php?sid=29"

