posted = "2005-11-25"
text = "ارايكم الان بعد ماقالتة وصرحت بة السيدة الفاضلة المستشارة\\نهى الزينى - لقد جاءت الحقيقة على لسانها مماجعل السادة القضاة يهتزون ويجتمعون وتاتى بقية المسلسل هل سنكذب مايقولة السادة القضاة القائمين بالعملية ونصدق الدكتور الفقى الذى ليس عندة الا ان كل من يقول الحقيقة انة منتمى للاخوان هل الاخوان المسلمين سبة حرام عليكم اتقوا اللة. هل ستكون فضيحة فقى"
