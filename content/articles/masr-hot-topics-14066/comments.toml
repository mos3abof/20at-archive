subject = ""
author = "يا ريتنا سودان"
posted = "2009-11-16"
text = "واحد صديقى راح لزميلى عوض السودانى وقال لة احمد ربنا انكم سود علشان كدة سموكم السودان انما لو كنتم بيض كانوا سموكم بيضان<br />والمبكى ان الدولار الامريكى يساوى 3 و 25 جنية سودانى<br />والجنية السودانى يساوى42و3 جنية مصرى<br />فين ولاد —- بتوع الاصلاح الاقتصادى<br />والمبكى التالت ان السودانيون هيشجعوا منتخب الجزائر لان معظمهم لا يطيق سماع سيرة المصريين وطبعا القطيعة الطويلة الماضية بعد نظام البشير وكراهيتنا للنظام الاسلامى بتاعهم"
archived = "2009-11-17"
capture_url = "https://web.archive.org/web/20091117133402/http://www.20at.com:80/masr/hot-topics/14066-2009-11-16-12-58-34.html"

[[comments]]
order = 1
subject = ""
author = "السودان مع الجزائر"
posted = "2009-11-16"
text = "الشوارع السودانية من الان مملوءة بالاعلام الجزائرية والجماهير السودانية ستهتف للجزائرى<br />والكراهية للمصريين فى كل مكان<br />موقفنا من حصار غزة<br />موقفنا من تشجيع تشاد ضد السودان فى مباراة العام الماضى<br />موقفنا من السودان بعد حادثة اغتيال الرئيس فى اثيوبيا والقطيعة الطويلة معهم<br />انهم يعتقدون اننا نتامر عليهم<br />موقف الفريق المصرى ضبابى<br />ربنا معانا"
archived = "2009-11-17"
capture_url = "https://web.archive.org/web/20091117133402/http://www.20at.com:80/masr/hot-topics/14066-2009-11-16-12-58-34.html"

