author = "الزول السودانى"
posted = "2009-11-16"
text = "يا زول<br />انت هتشجع مين<br />الجزاير والا مصر<br />اظن شوية هيشجعوا مصر وهم حزب الخاتمية اما الاغلبية بتوع حزب الامة اتباع المهدى فهؤلاء مع الجزائر<br />دى شعور طبيعى من ايام المهدى الكبير ومذبحة ام درمان"
