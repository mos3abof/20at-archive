subject = ""
author = "ملكش دعوة"
posted = "2009-11-17"
text = "يا جماعة السـودان بتشجع مصـر تعالو شوفو السودانين الى موجودين فى اسوان اد اية و حب السودان لمصـر مفيش كـره لمصـر اسـاسـا و المصيرين مش مكروهين من حـد و الى يعمل نفسو انو بيكره مصر ده حاقد و حاسس ان احنا احسن منة ليه لانو مفيش فى بلده واحد اسمو ( احمد زويل - مجدى يعقوب - طه حسين - ام كلثوم - عبد الحليم حافظ )<br />مفيش عندهم ناس زى احمد حلمى عادل امام مفيش عندهم اماكن فسح و مناظر طبيعية زى الى فى مصر ولله يا جماعة مصر دى احسن بلد فى العالم بس الى ماسكينها هما الى جايبينها لورا افتخر انك مصرى مصر دى الى ساعدت الجزائر فى الحرب الى ساعدت فلسطين فى محنتها الى وقفت مع الكويت ايام حرب العراق الى و الى و الى<br />سيبوكم منهم و بلاش فتن و اشعال حرب بين الناس<br />المصيرين شغالين فى كل العالم هاتلى واحد خليجى او ليبيى بيفهم<br />هتلاقية مش بيتكلم غير فى العربيات و الموبيلات و جبت ده من باريس و جبت ده من ابوظبى لكن المصرى فى كل حتة طالع عينو و بيعرف يجيب القرش من بوء الحوط سلام"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073825/http://www.20at.com:80/masr/hot-topics/14066-2009-11-16-12-58-34.html"

