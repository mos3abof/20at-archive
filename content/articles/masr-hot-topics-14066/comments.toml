text = "Shokran 3ala el nasa2e7 ya a7'y el 3azeez. Laken bema enny mohandes etisalat we darast el GSM wel CDMA a7eb awada7lek we lekol el qare2een en el CDMA mesh technologia motatawera we mesh a7san men el GSM. Howa mogarrad \"standard\" aw nezam lel hatef el ma7moul. Fy bedayet wogoud el mobile phones 2oroupa esta3meloh el GSM we fy Amrica esta3meloh el CDMA fel bedayah. Wa laken besabbab el sha3beya el akbar lel GSM we le2en mo3zam sharekat el hatef el ma7moul tasta3mel el GSM fa delwa2ty Amrica testa3mel el GSM ba2alha kaza sana. El CDMA mesh a7san men el GSM fy 7aga we la tadol 3ala enn el balad elly testa3mel el CDMA motatawera aktar. Bel3aks el CDMA fy tareiqoh ela al enqerad. Ma3 hatha, fa ba2eit el maqaal bayen mennoh en el Sudan motatawer aktar bekteer men ma takhayalt."
