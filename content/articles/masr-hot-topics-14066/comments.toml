posted = "2009-11-16"
text = "يا جماعة ايه الي كاتبينو ده؟؟؟؟ مين قال انو السودانيين بيكرهو المصريين؟؟؟ طيب انت عارف السودان عمل ايه بعد ما مصر خادت كاس افريقيا؟؟؟ جابت المنتخب المصري السودان و عملماتو متش تكريم … و تقولو كره"
archived = "2009-11-17"
capture_url = "https://web.archive.org/web/20091117133402/http://www.20at.com:80/masr/hot-topics/14066-2009-11-16-12-58-34.html"

