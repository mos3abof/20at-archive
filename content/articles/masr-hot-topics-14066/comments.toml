text = "بسم الله الرحمن الرحيم<br />مصر والسودان بلد واحد<br />والمصريون والسودانيون شعب واحد<br />يعني لو انت في السودان اعتبتر نفسك في مصر<br />والسوداني في مصر زي بلده<br />والسودانيون يعشقو المصريين لاننا ولاد بلد واحدة كما انه بيننا اتفاقية الحريات الاربعة"
