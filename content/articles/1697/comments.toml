[[comments]]
order = 4
subject = "لم يكذبوا عندما قالوا \"يا مصر أنا رضعت هواك&q"
author = "ندما غنى عبد الوهاب \"يا مصر أنا رضعت هواك من الصبى وجري في دمي . .أحب نيلك وسماك إنتي أبويا إنتي أمي\" فأعتقد أنه لم يكذب !!"
text = "وأعتقد أنه رغم الحال الكئيبة للبلد وإرضاع النفاق للأطفال في المدارس منذ الصغر . . فإنه برغم كل ذلك كان هناك شيئا صحيح دائما، رغم كثرة العزف عليه وهو أن مصر من أجمل بلاد العالم جوا<br />على الأقل الحمد لله نحن لا نشاهد مثل تلك الأعاصير التي تزور أمريكا كل سنة، ولا نشاهد مثل تلك الثلوج التي تغطي موسكو لمدة ستة أشهر، ولا نستيقظ لنجد تاسونامي قد أغرق بيتنا !!<br />وأقصى شيء شوية حر والواحد يفتح التكييف ولا يقعد تحت الدش والموضوع ينتهي<br />ولعل هذا من رحمة الله بنا، فهو يعلم أنا حالتنا \"كرب\" وأن الشعب مش ناقص أي حاجة زيادة عن الحكام ولاد الستين في سبعين اللي نهبوا البلاد<br />عمرو مجدي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151938/http://www.20at.com/article.php?sid=1563"

[[comments]]
order = 5
subject = "اين نحن من قدرة الخالق"
author = "تحليلات الانسان اعتقد انه قادر حتي فرعون كان معتقدا ذلك ....."
text = "فهل بختبرنا الخالق ليذيقنا من نفس الكارثة ... احفظنا ياخلق الكون واللهم ارفع مقتك وغضبك عنا وامنا في اوطاننا واحفظ علينا ايماننا انك ارحم الراحمين .<br />هذا الموضوع بين تفاهه الانسان علي الارض وعدم قدرته علي التجكم في ملك الله سواء تحركت الرواسي في اعماق المحيطات لظهرت قارات جديدة (انا انشأناه خلق اخر) ولايستطيع حتي حماية نفسه عند خروج الروح من الحلقوم فمنذ انشاء الارض منذ بلايين القرون والتاريخ به اكثر مما ذكر بحجم وضخامة الاعاصير الواردة ويعتقدون انهم ذو الفكر والعلم وفوق ذو علم عليم فجهل الانسان واضح ونعيش كدواب علي الارض نركل بعضنا البعض والنهاية في يد الخالق سبحانه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151938/http://www.20at.com/article.php?sid=1563"

