[[comments]]
order = 2
subject = "لله جنود لا تروها..."
author = "قد يغفل الكثير منّا عن سنة العذاب التي ينزله الله على القوم الذين طغو في الأرض و الذين قتّلوا المؤمنين و الؤمنات بغير حق، و الذي يقول لماذا خصّ الله بهذا العذاب ولاية من الولايات المتحدة دون غيرها فقذ يخشى عليه الكفر و الشرك ! إن لله شؤون هو الذي يسأل و لا يسئل،ولقد علمنا من كتابه سبحانه أن عذابه يأخذ القرى و المدن بفاسقيها و بمتقيها، نسال الله العافية و السلامة."
text = "عبد الله - كندا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151938/http://www.20at.com/article.php?sid=1563"

