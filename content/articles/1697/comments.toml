[[comments]]
order = 0
subject = "عماد"
author = "بل ان يبدأ بعض المعلقين باتحافنا بنظريات الانتقام الالهي التي قرأناها في الصحف. على الاخوة ان يأخذوا مجموعة امور في الحسبان:"
text = "1.سبق لزلازل عنيفة ان ضربت مصر وايران<br />2.تسونامي لم يدمر تايلند فقط وانماايضا دول اسلامية مثل اندونيسيا وماليزيا<br />3.اليابان ومنطقة خليج المكسيك هي تاريخيا وجغرافيا مناطق زلازل واعاصير<br />4.للعلم فقط فان من ماتوا وشردوا غالبيتهم الساحقة من الفقراء السود والمعدمين فهل اراد الله الانتقام من هؤلاء?<br />واخيرا لا تدينوا حتى لا تدانوا وهدانا الله واياكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151938/http://www.20at.com/article.php?sid=1563"

