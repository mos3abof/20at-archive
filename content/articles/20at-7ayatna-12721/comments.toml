text = "تحياتي الى الاخوه القراء والاخ الكاتب<br />ليست غريبه ضاهرة الرشوه على مؤسساتنا فرغم ثقل راتب الموظف الحكومي تحديدأ ونستثني القليل الا نه لايشبع<br />0000000لكن الاهم هل تنفع هذه الكامرات فعلا<br />0000000وماذا لو كان حاميها حراميها وهذا هوه الموجود<br />هذا سؤالي لم اجد اي اجابه عليه وشكرأ"
