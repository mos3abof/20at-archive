author = "عائد الهلالي"
posted = "2009-07-22"
text = "ان ظاهرة التصدي للرشوه يجب ان تتم على عدة محاور وان تشترك المنظومه الاجتماعيه والسياسيه والامنيه للدوله العراقيه للقضاء عليها ويجب ان تنمي اولا الوعي المتبادل في جميع الامور القانونيه بالنسبه للمواطن والموظف على حد سوى ثانيا تفعيل مفهوم المواطنه بحيث يصبح الاساس والمعيار الحقيقي لولاء الفرد بالنسبه لوطنه ثالثا الابتعاد على الفئويه الضيقه والمكاسب المحدوده واخيرا على الدوله ان تفعل دور القانون بحيث يصبح الفيصل في الحكم في مثل هذه المواضيع"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814015640/http://www.20at.com:80/20at/7ayatna/12721-2009-07-21-12-35-16.html"

