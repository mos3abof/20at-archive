[[comments]]
order = 10
subject = "دوما ما تتحفنا بأسلوبك!"
text = "المقال جميل يا عبيد ، وبالطبع لن أتحدث عن روحك الساخرة التي تمس أوجاعنا الاجتماعية دوما ، ولكن لي ملاحظة .. وددتُ لو كتبت المقال بالفصحى مع بعض التطعيمات بالعامية ، مثل مقالك السابق: (أنا واخويا وعطية) ، فلقد كانت له نفس الروح الساخرة اللاذعة ، إضافة إلى نفحة من قوة ورصانة أكسبتهُ إياها الفصحى .. عموما هو رأيي وأنت تعلم أني لم أعد متعصبة للفصحى كذي قبل :)<br />أعجبتني بعض الأجزاء كثيرا وفجرت ضحكي أكثر من غيرها..<br />- وصفك لأغنية الفيديو كليب..<br />- الجرأة والتهذيب في نفس الوقت في الإشارة إلى الإعلان الطويييييل.<br />- كان موفقا جدا تعليقك بهذه الجملة \"بصراحة ساعتها بس فهمت معنى \"الحرب الباردة\".\" على ما تعرضه الـ Nile TV من الفقرة العبرية المستفزة.<br />- الختام بدءا من جملة \"صراحة حاجات كتيرة ما فهمتهاش ...\"<br />في النهاية أحييك على المقال وأنتظر القادم ..<br />أجنادين<br />26/5/2004"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033901/http://www.20at.com:80/article.php?sid=270"

