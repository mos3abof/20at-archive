author = "صعب يا سيدى"
posted = "2009-07-13"
text = "صعب يا سيدى وانت فى هذة السن وبعد رحلة الكفاح الطويلة ومعارك التحرير والاستقلال ان ترى بلدك اخيرا تدار بواسطة المندوب السامى الامريكى السيدة سكوبى<br />ثم التصريحات الغبية لرئيس الوزراء امس والتى يقول فيها للشباب على احد الشواطىء<br />شوفوا يا عيال احنا لما نصدر الغاز لاسرائيل بنحط رقبتها فى ايدينا<br />وضحكت حتى استلقيت على قفاى<br />ال سيادة رئيس الوزراء يقدر يوقف تصدير الغاز لاسرائيل<br />سيدى السفير تناول عشائك بدرى مثلى واقرا قليلا من القران وترحم على اموات المسلمين ثم ضع راسك على المخدة وقل لقد اديت دورى الوطنى المطلوب منى وانا راضى عنة<br />وليجعل خاتمتنا طيبة وان يرحمنا برحمتة"
archived = "2009-07-17"
capture_url = "https://web.archive.org/web/20090717103044/http://www.20at.com:80/masr/ebn-balad/12640-2009-07-13-13-22-39.html"

