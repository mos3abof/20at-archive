order = 2
subject = "العيب فينا"
author = "ديمقراطي"
posted = "2006-09-06"
text = "نعيب ديمقراطيتنا والعيب فينا ... ومالديمقراطيتناعيب سوانا .. الديمقراطية مصططلح يجب تحليله الى عوامله الاولية وتفسير كل عنصر وكل معنى فيه تحليلا دقيقا حتى ناخذ منا ما يتفق مع قيمناالاسلامية والعربية ونرفض ما يختلف ولكن المشكلة في بعض الناس التي تقبل او ترفض المفهوم كلية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133249/http://www.20at.com/article2.php?sid=1194"
