[[comments]]
order = 0
subject = "..& الديمقراطية التى لا يعرفها حكامنا العرب &.."
author = "..& هيكل الأزهرى &.."
posted = "2006-09-05"
text = "والله يا جماعه انا مش مستغرب ولا حاجه امريكا فعلا من اوائل الدول فى العالم اللى فعلا فيها ديمقراطية كبيرة جدا جدا واحب احيي واشكر كاتب المقالة دى لأنه فعلا فسرها بطريقة جميلة واحب اقول إن الديمقراطية الحقيقية حكامنا العرب ربنا ياخدهم عاجلا قبل آجل لا يعرفوا عنها الا اسمها .. يالله ربنا يريحهم مننا وياخدهم كلهم عاجلا قبل آجل يارب العالمين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133249/http://www.20at.com/article2.php?sid=1194"

[[comments]]
order = 1
subject = "داخلي فقط"
author = "د محمد عاصي"
posted = "2006-09-06"
text = "فعلا امريكا من اولي الدول التي طبقت نظام الديمقراطية وحتي الان امريكا من اكثر الدول الديمقراطية ولكن امريكا ديمقراطيتها تقتصر علي مواطنيها فقط وتتعامل مع بقية العالم من منطلق ان الشعب الامريكي هو الشعب السوبر وانه من حقه فرض ارائه علي جميع الشعوب ومحاولة فرض التجربة الامريكية في الديمقراطية علي بقية الشعوب مع ان فرض اي راي علي اي شخص اخر هو في حد ذاته ضرب لصميم مبادئ الديمقراطية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133249/http://www.20at.com/article2.php?sid=1194"

