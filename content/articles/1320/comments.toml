[[comments]]
order = 0
subject = "الله يكون معكم والف تحية الى اهلى القنيطرة"
author = "عبد الوهاب )ليبيا"
posted = "2006-03-23"
text = "الف تحية الى كل اهلى القنيطرة وانا من ليبيا قراء المقالة واقول لكم الف تحية على روح تحدى التى عندكم اهل القنيطرة واعتبر من يقوم بى تخريب ووقف الحركة انما هو اكيد ليس من القنيطرة والف تحية اليكم يا اهل القنيطرة من عبدالوهاب ليبيا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142359/http://www.20at.com/article2.php?sid=528"

[[comments]]
order = 1
subject = "المهزلة"
author = "فاطمة"
posted = "2006-06-13"
text = "انا من مدينة القنيطرة.و نحن نعيش ازمة يومية مع الطوبيس فقد اصبحة عادة لدينا حمل كمية من المال كاحتياط ادا ما اراد الاطوبيس اخد اجازة ...\"عشنا او شفن\"....؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142359/http://www.20at.com/article2.php?sid=528"

[[comments]]
order = 2
subject = "والله العظيم مشكله"
author = "زهير"
posted = "2006-09-27"
text = "الرجاء من المسؤولين العمل على حل هده المشكله باقصى سرعه ممكنه لان حبيبة القلب من قنيطره وانا فلسطينى وما احب تتغلب او تتعب وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142359/http://www.20at.com/article2.php?sid=528"
