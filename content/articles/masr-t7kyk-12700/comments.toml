[[comments]]
order = 1
subject = ""
author = "الاسراء والمعراج"
posted = "2009-07-19"
text = "يعنى فى المناسبة الكريمة دى تكتبوا لنا عن الفنان مش عارف مين<br />وفيلم مش عارف اية<br />ومواضيع يمكن تاجليها<br />ولا تكتب عشرينات عن تلك الليلة ليلة الاسراء والمعراج<br />فى الوقت الذى يكرس فية اليهود تهويد القدس وعمل معبد مكان حائط البراق الذى يسمى ظلما حائط المبكى لبعض المتصهينين<br />تتجاهل عشرينات تلك الليلة<br />لماذا ؟"
archived = "2009-07-21"
capture_url = "https://web.archive.org/web/20090721184706/http://www.20at.com:80/masr/t7kyk/12700-2009-07-19-12-08-37.html"

