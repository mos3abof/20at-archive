[[comments]]
order = 5
subject = ""
author = "أحمد كريم"
posted = "2009-08-17"
text = "أحب أسمع القرآن بصوت الشيخ محمد رفعت، ثم محمد رفعت، ومحمد رفعت ولا غيره..<br />بدل ما ينفق الكثيرين الجهد والمال لتسجيل القرآن بأصوات قد تصلح للطرب ولكن لا تصلح للقراءة والتلاوة أبدا.. دعونا نرمم قرائات سيد مقرئي القرآن في القرن العشرين وشيخ شيوخهم<br />لقد رممت الإضاعة قرائاته من قبل، ولكنهم حارمين الجمهور منها، وما يصلنا من قراءة الشيخ رفعت في رمضان قبل الإفطار لهو نذر يسير صغير ويزداد صغرا كل يوم، والقرائات الموجودة له على مواقع الانترنت قليلة وأحيانا ناقصة<br />أتمنى أن تصل تلك الرسالة لشخص ما"
archived = "2009-09-20"
capture_url = "https://web.archive.org/web/20090920181801/http://www.20at.com:80/masr/t7kyk/12700-2009-07-19-12-08-37.html"

