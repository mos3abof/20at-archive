[[comments]]
order = 0
subject = "تسلميلى يا هبهوب"
author = "نيفين"
posted = "2006-02-14"
text = "ربنا يخليكى يا هبهوب<br />بس بالراحه على البنيه<br />رديت على تعليقاتك ابقى اقرايها<br />و متنسيش الايميل بتاعك انا عايزاه علشان هبعتللك عليه<br />عايزه اقوللك كل عيد حب و انتى طيبه<br />و بنصحك تسمعى انهالرده بالمناسبه دى انا لحبيبى لفيروز"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150136/http://www.20at.com/article2.php?sid=429"

