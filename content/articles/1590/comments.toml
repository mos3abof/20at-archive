subject = "هيافة"
author = "عمر"
posted = "2006-02-21"
text = "كله هيافة في هيافة وحرام في حرام ولو تأملت الأغنيات القديم هتلاقي معانيه أكثر فسق من الأغاني الحالية وفيها مخالفات للعقيدة الإيلامية وربنا يهديك"
archived = "2006-11-02"
