subject = ""
author = "ما بدي احكي اسمي بلاش تفكروني"
posted = "2008-06-18"
text = "شو الإشي اللي بستعيذ منه الشعب الاردني اكثر من الشيطان ؟<br />الجواب: السياسة والمخابرات.<br />والله أني تعاملت مع المخابرات ووالله إني ملتزم دينيا بالصلولت الخمس على وقتها وأني كثير الانتقاد البناء من حبي للوطن ولم يحدث لي شيء بل وجدت رجال المخابرات من أكثر الناس ديموقراطيه وتسامح وحرية وحب لمساعدة الناس ونصرة المظلوم بالغالب ووجدت من ينتقدهم لو استلم مكانهم لاترحمنا عليهم وعلى عدالتهم . طيب يا أردنيين شو بدكم ضمانات شخصية تخليكم احرار اطلبوها ومن الملك فبابه مفتوح للجميع ولكن لا تقعدوا تحكوا عن الكبت والرقابة فقط لأنه أن تضيء شمعة خير من أن تلعن الظلام .وتذكروا أن الحرية تنتزع فحددوا ماهية حريتكم وانتزعوها."
archived = "2009-08-31"
capture_url = "https://web.archive.org/web/20090831162917/http://www.20at.com:80/20at/eshtbak/7189.html"

[[comments]]
order = 4
subject = ""
author = "محمد العمايره"
posted = "2008-06-18"
text = "قبل أيام كنت في نقاش مع مثقفين ومتنفذين،موالين ومعارضين حول سؤال هو هل الاردن دولة بوليسية؟وكانت النتيجة وهو ما اؤمن به كلا ولكن الناس يخافون من كل شيء ومفهوم الدولة والامن مشوه لديهم من خلال أما جهلهم بالاردن او قياسها على دول مجاورة أو الغموض أو الأفتراء والكذب أو من بعض الأشخاص الملكيين أكثر من الملك.وبالنهاية أجد موالاة الحكومة في بعض المناطق أصعب بكثير من معارضتها أمام الأمن والشجاعة هي الحل. إن كنت صادقا ولا تخاف الموت فكيف تخاف التعبير عن رايك،وكما قيل للحرية الحمراء باب.تحدثوا بصراحة وسترون أنكم لن تأذوا ولن يعمل لكم ملفات!<br />ولكن إن كان كثير من الناس يؤمنون بدولتهم لا يعني ذلك أنهم خائفون فالشجاعة لا تعني المعارضة بل تعني التعبير عن الرأي بصدق وفق ضوابط دينية واسألوني شخصيا عن هذا الموضوع."
archived = "2009-08-31"
capture_url = "https://web.archive.org/web/20090831162917/http://www.20at.com:80/20at/eshtbak/7189.html"
