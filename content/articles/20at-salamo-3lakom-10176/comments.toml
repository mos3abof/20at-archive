text = "ما هى مؤهلاتك لكى تقلل او تنتقد اخ فاضل مثل الاستاذ عمرو خالد الاسلام الان لايحتاج الى مشككين ذى ماحاجتةالى موحدين ذلك الفكر الغريبة تسئ الى الاسلام رجاء كل من بيده عمل اى شئ يخدم الاسلام يفعل ويترك غيرة يعمل ميقدر عليه الاخ العزيز كل منهما له فن فى الدعوة الى الله ولا تنسى حديث الرسول صلى الله عليه وسلم من كان يؤمن بالله واليومالاخر فليقل خير اوليصمت0"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014755/http://www.20at.com:80/20at/salamo-3lakom/10176.html"

[[comments]]
order = 9
subject = ""
author = "The Rock"
posted = "2008-10-29"
text = "مش معنى إنك شوفت حلقتين للشيخ محمد حسان إنك بقيت من صفوة المجتمع ومن علماء الأمة عشان توصف الأستاذ عمر خالد<br />ب \"هجيص\" وتكلم الأستاذ ممدوح بالطريقة السافلة دي أعتقد أصلا أصلا إنك لو فعلا بتابع الشيخ محمد حسان أو أبو إسحاق الحويني أو محمود المصري أو محمد حسين يعقوب أو مسعد أنور وكلهم شيوخ كبار و افاضل<br />عمر ما حيكون حوراك بالأسلوب الردئ والبيئة ده وعمر ما حيكون نقاشك بالأسلوب الواطي ده<br />اغلب الظن إنك واحد من الناس الفاشلة إياهم<br />اللي ما يعرفش حاجة في أي حاجة ولكن مجرد بغبغان بردد اللي بيسمعه فقط لاغير بدون أن يعقل أو يفهم وبالتالي بيغير من أي شخص ناجح زي الأستاذ عمر خالد"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014755/http://www.20at.com:80/20at/salamo-3lakom/10176.html"

[[comments]]
order = 10
subject = ""
author = "alb arslane"
posted = "2008-10-30"
text = "السلام عليكم اولا<br />ثانيا خلاص وصلت الحالة بإننا نقارن بين الشيوخ مين احسن من التانى ودى حاجة لا يعلمها إلا الله واحنا منعرفش مين احسن من مين وياريت كل واحد يشتغل بدل الكلام اللى لايودى ولا يجيب دا غير إن انا من وجهة نظرى الفقيرة شايف إن الكلام لا يجوز الكلام فية هلى الملا يراة المسلم والكافر والمحب للدين والكارة له والعالم والجاهل وفى النهاية ندعو الله عز وجل ان يبرم للامة امر رشد يجمع فية شملها ويعز اهل الطاعة ويهدى اهل المعصية ورجاءا بلاش ناخد العلاقة يبن فضيلة الشيخ محمد حسان والاستاذ عمرو خالد على انها علاقة مصر بإسرائيل لانهم هم الاتنين دعاة الى الله وكل واحد يبذل ما فى وسعة وهذا فضل الله يؤتية من يشاء وانا اشهد الله عز وجل على حبى لهما ولكل الشيوخ والعلماء والدعلة الافاضل الذين لا يسع المجال لذكر اسمائهم<br />والسلام عليكم ورحمة الله"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014755/http://www.20at.com:80/20at/salamo-3lakom/10176.html"

[[comments]]
order = 11
subject = ""
author = "طائر حزين"
posted = "2008-11-01"
text = "أ/ عمرو خالد : رؤية عملية وواقعية للحل الإسلامي<br />ومع احترامي للشيخ محمد حسان والحويني وغيرهم إلا أني لم أسمع منهم من قال كلمة حق<br />كلمة حق عند سلطان جائر ولا مفيش سلطان ظالم في مصر<br />ويا ريت نحترم الآخرين ونعمل لما يخدم الاسلام وليس لما يفرقه<br />ويا ريت كمان قبل ما نهاجم داعية أيا كان مكانته نهاجم أهل الفساد في الأرض ولا دول كمان خلصم<br />حرااااااااااااا ااام عليكم اتقوا الله"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014755/http://www.20at.com:80/20at/salamo-3lakom/10176.html"

[[comments]]
order = 12
subject = ""
author = "أبو الحسين السلفي"
posted = "2008-11-15"
text = "لن أقارن عمرو خالد بالمشايخ الذين طرحت أسمائهم من قبل و لكن يا إخوان الرجل ( أي عمرو ) رجل قصاص و ليس عالم دين فأنا سمعت له أكثر من مرة اخطأ مثل قوله عن الرسول صلى الله عليه و سلم أنه فشل و انه مفيش في الإسلام ختان نساء (رغم الأحاديث الصحيحة الثابتة عن الرسول صلى الله عليهه و سلم مثل حديث إذا التقى الخاتنان …) فمثله لا يتصد للدعوة قبل أن يحني ركبه أمام العلماء.<br />ثم عمرو خالد رجل حزبي (إخواني ) و هو يزعم أنه يدعو لإتباع سنة النبي صلى الله عليه و سلم و مش باين أنه مسلم غير من أسمه لبسه (دقنه المحلوقة ) … و اتباع النبي صلى الله عليه و سلم مش بالعواطف و الإثارة المرويات الضعيفة<br />لو خيرت أن أسمع لعمرو أو أن أطفئ التلفاز طبعا سأطفئ حتى لا يرتفع ظغط دمي<br />و الله المستعان"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014755/http://www.20at.com:80/20at/salamo-3lakom/10176.html"

[[comments]]
order = 13
subject = ""
posted = "2008-11-20"
text = "العمل مهم جدا فى حياتنا ولكن بجانب العمل يجب البحث عن الحق مين الخطأ ومين الصح فلا يجب أن نقول على الشيوخ الأفاضل مثل الشيخ محمد حسان أو أبى إسحاق كلام غير صحيح ويجب أن نعرف من الذى يخدم الدين ومن الذى يضر بالدين وأنا أستجب من الناس الذين يسمعون أشخاص يتكلمون دون ذكر أحاديث النبى صلى الله عليه وسلم فكيف يعرفون أن الكلام صحيح ومع أحترامى لعمرو خالد أنه ليس داعيه كما قال هو وإنما هو مصلح أجتماعى . وبارك الله فيكم جميعا وأرشدكم إلى الحق"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014755/http://www.20at.com:80/20at/salamo-3lakom/10176.html"

