posted = "2008-10-09"
text = "الاخ مش حولك اولا شتان ما بين عمر خالد وبين فضيلة الشيخ حسان نحن نتكلم عن رجل عالم دين متمكن مش بتاع هجيص زى الا خ عمرو حالد فنحن ناخذ دنيا ودنيا من هولاء ولو تابعت الشيخ حسان هتلقية بيعمل اضعاف الى بيعملة عمر خالد بس لاسف هولاء يعملون فى صمت ولوجة الله وليس لالاعلام واشهرة هدنا الله واياك سوال للاخ زخرى هو انت ملتك اية با لظبط"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014755/http://www.20at.com:80/20at/salamo-3lakom/10176.html"

[[comments]]
order = 6
subject = ""
author = "فهد"
posted = "2008-10-10"
text = "يا زخارى انت حتى اسمك ليس لهو معنى طيب لما انت مسيحى مالك انت باموار الدين الا سلامى اولا لما تتكلم عن الشيخ محمد حسان تتكلم بادب لان امثالك من العلمانين لا يعرفون من الدنيا الا اسمة اكيد امثالك لا يعرفون الشيخ محمد حسان او ابو اسحاق الحوينى او الا لبانى كل هولاء يا زى الخرة علماء فى الدين الا سلامى بس احنا عارفين اسلبكم من الفتن والمهترات وانا مش هدخل مع امثالك فى مجادلة لان اخرك الى تعرفة احسن من اللى متعرفهوش دى اسلوبك انت اما اسلوبنا نحن نبحث ونتعلم حتى نعرف الحقيقة لان الله خلقنا لنبحث عن الحق"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014755/http://www.20at.com:80/20at/salamo-3lakom/10176.html"

[[comments]]
