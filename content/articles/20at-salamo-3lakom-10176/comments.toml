author = "اكتب اسمك هنا"
posted = "2008-10-04"
text = "وانا اشاهد حلقات عمر خالد على تلفزيون ابوظبي قصص القران<br />تأكدت تماما ان مصر بحاجة الى رجل مثل عمر خالد ليرئسنا ويغير حياتها<br />وانا ارشد عمر خالد لرئاسة مصر في الفترة الرئاسية القادمة مع احترامنا الشديد لايمن نور وجمال مبارك<br />مصر بحاجة ماسة الى رجل تغيير مثل عمر خالد مش كلام<br />يا رب ولي علينا خيارنا ولا تولي علينا شرارنا"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014755/http://www.20at.com:80/20at/salamo-3lakom/10176.html"

[[comments]]
