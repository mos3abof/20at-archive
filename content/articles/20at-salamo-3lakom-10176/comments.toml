posted = "2008-10-06"
text = "انا لا اتكلم من الوجهة الدينية<br />انا اتكلم من كون عمر خالد شخصية قيادية حركية انتاجية محركة لهمم الشباب<br />وخير شاهد على ذلك صناع الحياه التي اصبح لها فروع في معظم الدول العربية"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014755/http://www.20at.com:80/20at/salamo-3lakom/10176.html"

[[comments]]
