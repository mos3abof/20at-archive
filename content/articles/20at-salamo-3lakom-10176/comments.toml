author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-08"
text = "حقا اعتقد ان تعيين (عمر خالد)لرئاسة و زارة الشباب و الرياضة و الثقافة و الاعلام أيضا<br />سوف يكون لة شأن عظيم فى ترشيد ابناء الوطن الى خير و طنهم مصر و انتمائهم الحقيقى لة؟<br />(عمر يا خالد)تعجبنى و تعجبنى بساطة كلماتك و سهولة شرحك؟<br />فكرتنى بالامام الراحل الدكتور(محمد متولى الشعراوى)رحمة اللة"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014755/http://www.20at.com:80/20at/salamo-3lakom/10176.html"

[[comments]]
order = 4
subject = ""
author = "ممدوح زكى زخارى جرجس_الاسكندري"
posted = "2008-10-09"
text = "اولا نحن نعرف (عمر خالد )جيدا<br />اما فضيلة الشيخ حسان هذا!<br />الذى تتكلم عنة فلن نسمع عنة من قبل؟<br />هو بيطلع فين؟و بيقول اية؟و بيدعوا الى اية؟و لية هو مختفى لية؟<br />و اللى تعرفة احسن من اللى (ما تعرفهوش)<br />اما بخصوص سؤالك لى عن مللتى بالضبط فهى<br />انا افتخر بكونى:_<br />انا مسحيى الديانة<br />مصرى الجنسية<br />و طنى الانتماء<br />(عندك مانع )يا قط!"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014755/http://www.20at.com:80/20at/salamo-3lakom/10176.html"

[[comments]]
