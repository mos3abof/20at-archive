text = "قدم عمرو خالد رؤية مختلفة للقرآن ولقصص القرآن وجعلها تتماشى معنا وتصحي فينا التغيير الذي نحتاج اليه.كل يوم يمر نحس انه تغير فينا شيء .<br />الله يوفقه لما يحب ويرضى وتكون محاضراته دائما نافعة للأمة ."
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014755/http://www.20at.com:80/20at/salamo-3lakom/10176.html"

