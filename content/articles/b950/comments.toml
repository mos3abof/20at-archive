subject = "لا عجب"
author = "عودة عابر القارات"
posted = "2006-06-18"
text = "لا عجب أو أستغراب من أن العرب يقاطعوا حماس فأستطيع أن أقول بنفسا واثقة أن أفراد حكومة حماس هم أنظف و أشرف , أضع ألف خط تحت هاتين الكلمتين فالعصابة الحاكمة و الجاثمة على أنفاسنا المنقطعة هم لصوص و أفاقين و لاحسى أحذية أمريكا و إبنتها المدللة إسرائيل فما الذى تنتظروه من هذه العصابة؟؟ هل تنتظرون منها أن تناصر إخوانها فى الدين (إذا كانوا أصلا يخافون الله تعالى) فمن أدار ظهره لوزير خارجية حماس لهث وراء مقعدة أولمرت ليقبلها..... لا أدرى هل أصابهم مرض نقص النخوة و الرجولة ؟؟ أم هم نساء فى ملابس رجال؟؟!!"
archived = "2006-11-02"
