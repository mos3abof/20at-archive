text = "طيب امنا بالله مسجد خاشعين ولكن صدمت أمام هذه العبارات :تعرضت للعديد من حالات الإغماء في صلاة التراويح<br />\\\"\\\" تبدأ بترتيل آيات القرآن بصوت مرتفع وجميل\\\"\\\" كيف يعني إمرأة تقرأ بصوت مرتفع و جميل و اللي عامل التقرير رجل كيف سمعها والا تابعها مش زابطة<br />\\\"\\\"على خشبة القرآن فإذا بالدموع قد كتبت - يا الله-!! \\\"\\\"\\\" وسعتها كتير يا كاتب الموضوع<br />اتق الله يا أخي شو هالكلام مسجد المعجزات و المصاريع هذا"
