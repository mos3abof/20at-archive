[[comments]]
order = 3
subject = ""
author = "ممدوح جلال"
posted = "2007-11-29"
text = "بسم الله<br />أولاً قبل أن أعلق على المقال …<br />أنا مستغرب فقط من هجوم من سبقني في التعليق …<br />أنا بصراحة لا أرى أي تحيز أو عدم موضوعية في المقال …<br />المقال ببساطة : أبلغ عن وجود ظاهرة الاتجاه نحو التصوف<br />ثم تعريف التصوف عند الصوفية<br />ثم تمثيل للواقع المعاش<br />ثم سؤال هل ما تحمله معاني التصوف هي الحل …<br />السؤال هنا … هل التصوف يحمل هذه المعاني التي نتفق جميعًا على أنها الحل بالفعل<br />هل التصوف الموجود الآن هو الحل<br />عندما بدات قراءة المقال … استغربت لأنه تقريبًا كان يصفني<br />كنت مع الجماعة الإسلامية ثم الإخوان المسلمين ثم السلفيين<br />ثم انتهيت مع التصوف<br />كان دائمًا داخلي سؤال<br />لماذا يخسر المسلمون دائمًا … رغم كل المحاولات لماذا ترتد إليهم ضرباتهم<br />لماذا دائما أمر في تديني بحالة موجية … يوم فوق ويوم تحت …<br />كانت الإجابة فعلاً في التصوف … كل ما سبق (جماعة إسلامية - إخوان مسلمين - سلفيين) اهتموا بالظاهر<br />عمروا الظاهر … لحية - جلباب قصير - سواك - نقاب - صلاة جماعة … مع الاتفاق مع أهمية هذه الظواهر<br />لكن يجب الاهتمام بالباطن أيضا بل وقبل الظاهر … وهذا هو جوهر التصوف<br />لكن أرجع وأقول أي تصوف … تصوف الموالد والأضرحة والرقص<br />أم تصوف الغزالي وابن عطاء الله السكندري والجنيد وابن حارث المحاسبي والنووي والعز بن عبد السلام"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530002152/http://www.20at.com:80/malafat/7425-2009-04-14-13-37-51.html"

