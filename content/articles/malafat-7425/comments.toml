subject = ""
author = "أحمد نصر"
posted = "2008-01-05"
text = "يعني الكاتب قال بأنه ثم اقبال من الشباب على الطرق الصوفية..ورغم اطلاعي على حضرات للصوفية إلا أنني لم ألمس ما قال..وقلنا ماشي..<br />ثم ادعى أن الشباب أقبلوا على هذه الطرق، تخلصا من الواسطة بين الله والعبد..أفي هذه الطرق يكون التخلص من الواسطة؟<br />حقا هذا قول مضحك!..أفي طريقة شيخها يقول أن الله أمره ونهاه له ولمن معه..يكون التخلص مما اعتبر واسطة؟..في حين لو نظرنا إلى كل من ذكرهم الكاتب لما وجدنا أي حال من التوسط بين الله والعبد!!<br />ياسيدي الفاضل ليكن الأمر واضحا..كل هؤلاء الذين بحثوا عن راحتهم النفسية وتركوا الدنيا واعتزلوها ليسوا إلا دراويش بحثوا عن حظ نفسهم..هربوا من مسؤولية اعمار الأرض وتعللوا وأرادوا إضفاء الشرعية على خمولهم و[ *** ]لهم وتقصيرهم وفشلهم باللجوء إلى الطرق والتصوف..<br />لا وقت عندنا للتصوف..إنك إن تركت حراسة في سبيل الله لتقف مصليا صلاة الليل فأنت جبان مقصر قد تولى يوم الزخف.."
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530002152/http://www.20at.com:80/malafat/7425-2009-04-14-13-37-51.html"

