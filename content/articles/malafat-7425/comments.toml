[[comments]]
order = 10
subject = ""
author = "شريف الغندور"
posted = "2008-02-17"
text = "السبب ليس روحانياً..هو الهرب من سيد إلى سيد .. ومن وسيط إلى وسيط..<br />الطرقية هي مجرد \"ريم[ *** ]\" لعلاقة الوساطة بين الناس والله .. هناك دائماً وسيط.. أعلى .. مُلهَم.. لا يأتيه الباطل من بين يديه ولا من خلفه..وعليه فالهاربون من حركات \"الإسلام السياسي\" قرروا فقط تغيير السيد.. وهذه هي مشكلتهم.. ومشكلة معظمنا.. الرغبة في \"التضاؤل\".. في أن تكون طوبة ، أو عصا ، أو قنبلة يحركها أمير الجماعة أو الشيخ السلفي أو شيخ الطرق.. أما أن تصبح \"بني آدم\" لك إرادتك المستقلة وتفكيرك المستقل .. أهو دة اللي مش ممكن أبداً..<br />الطرقية فقدت وجهها الرومانسيكي الذي تحدث عنه التقرير من باب الـ Pulp fiction.. الطرقية بدأت من أجل بقائها ووصولها لمبتغاها وهو السيطرة على المؤسسات الدينية (مثلهم مثل خصومهم التاريخيين التيار السلفي) في الكلام في السياسة ونظام \"عاش مهيج الجماهير\".. واستخدام أفيون \"الأمة الأمة الأمة\" المستعمل من كل تيار .. الأمة التي يريدون.. أمة العصيان والطوب والحجارة والحرق والتخريب..<br />إذا أردت أن تكون عصاية في يد أي شخص ، من أي مذهب ، من أي طريقة ، أنت حر.. فقط لا تسأل عن آدميتك.. وإن أردت الأفيون فلا تسأل عن لحظة فوقان.. من شب على مخدر شاب عليه.. لطالما لمنا كمستقلين غير منتمين لتيارات دينية على أصحاب الفكر الشيوعي قولهم أن \"الدين أفيون الشعوب\".. وها نحن نطبق ما يفترضه الشيوعيون..سيشكروننا من نياط قلبهم بكل تأكيد.."
