author = "مصري"
posted = "2007-10-31"
text = "ليس لنقاش أن يكون إلا بنظر، وليس لنظر أن يتوجه إلا بشغف لدى صاحبه بموضوعه وإرادة للبحث فيه. لا أسئمنا من حديث إلا ادعاء فيه بالموضوعية ونفاق باسم التجرد. ولم يكن الكاتب ليدعو إلى نقاش كهذا إلى برغبة منه في ذلك، وله الحق، مثلنا جميعًا، في الحديث بما يراه صوبًا. ولنعلم أن العاطفة بعض العقل وأن العقل هو كل التعاطف مع أوجه الحق واليقين. فهلا كان إلى ذلك ميلنا دون انحراف إلى ما ندعيه استقامة."
