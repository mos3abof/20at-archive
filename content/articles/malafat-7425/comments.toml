subject = ""
author = "طالب ازهري"
posted = "2007-12-05"
text = "بارك الله فيك اخي المتحدث انفا فيما قلته عن التصوف وما هو جوهر التصوف فمن الملاحظ ان معظم اصحاب الطرق والمريدين اصبحوا مثلهم كمثل المشركين فاصبح التبرك بالاضرحة وعمل الموالد والحضرات هي اساس التصوف لديهم واذا اقتربت من احدهم لا تجده يعرف يعرف قراءة الفاتحة واصبح كل الهم الخروج من [ *** ]ل الجامعات الاسلامية الي [ *** ]ل المتصوفين يقول عز من قائل (( فخلف من بعدهم خلف اضاعوا الصلاة واتبعوا الشهوات فسوف يلقون غيا )) الاية وبالنسبة للتوسل الي الاولياء الاحياء قبل الاموات فهذا شرك بين لا جدال فيه فكما قال سيدنا ابو بكر الصديق رضي الله عنه حين مات سيد المرسلين من كان يعبد محمدا فان محمدا قد مات ولم رسول الله ومن كان يعبد الله فان الله حي لا يموت فانه قال محمدا وذلك ليبين لعامة المسلمين ان الرسول بشر يموت ويفني ويحشر وختاما اختم بقوله اخي هل التصوف تصوف الصحابة والتابعين ام ماذا هذا سؤال يجيب علي تفسة ."
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530002152/http://www.20at.com:80/malafat/7425-2009-04-14-13-37-51.html"

