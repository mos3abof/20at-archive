text = "أنقل لكم صورة من الأردن حيث هناك ما يؤيد ما كتب في المقال فلأول مرة من سنوات نسمع عن شباب يتوجهون إلى زوايا الصوفية ويقبلون على قراءة كتب التصوف مثل كتب الغزالي و ابن عطاء الله وغيرهم.<br />كثير من الشباب عائد من الحركات الإسلامية الحركية مبررين ذلك باستغراق الحركات سياسياً على حساب التربية والعلم.<br />من الجدير بالذكر أن أكثر طرق التصوف عليها اقبال في الأردن طريق الحبايب في اليمن (الحبيب علي الجفري وشيخه الحبيب عمر)."
