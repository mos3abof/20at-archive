text = "لا أظن أنني أحتاج أن أضيف شيء عن التصوف وموقف العقيدة الإسلامية منه ولكني أري أحيانا أن التصوف ربما كان محاوله للهروب من الواقع إلي عالم من الروحانيات أننا بحاجه الأن إلي نبذ الفرقة والإختلاف والنظر للأمور بواقعية فكيف يكون الحل هو الإتجاه لمذهب أصبح يمثل الوثنية ولكن بأسلوب إسلامي<br />هذا رأيي أحييك علي تناول هذا الموضوع وأتمني لك المزيد من التفوق والنجاح"
