text = "بالنظر السطحي أو العميق للتصوف لن تجده يخرج عن:<br />- الابتداع في الدين بما ليس فيه: وتأمل عبادات هز الرؤوس وضرب الطبول والتطوح يمين ويسار<br />- بحر من الشركيات: وما العبادات القبورية من دعاء الاموات والاستغاثة بهم بخافية<br />- الانغماس في الهلاوس: فتجدهم يزعمون أن أوتوا ما لم يؤتى الصحابة..وانهم يرون النبي يقظة! .. وأن من يصل الى مرتبة اليقين تسقط عنه العبادات!<br />- العلم الكهنوتي: فعندهم اصحاب المقامات العلية لديهم اسرار كونية وسماوية رهيبة لم يطلع عليها أحد غيرهم!!!"
