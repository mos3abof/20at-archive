[[comments]]
order = 0
subject = "خطوة مباركة"
author = "نورس الامارات"
posted = "2006-04-03"
text = "الله<br />ما شاء الله ، جميل جدا هذا العمل<br />احلى الاعمال على الاطلاق التي تكون مغلفة بالمشاعر الانسانية الصادقة ..<br />و مشاعر الناس الصادقة تجاه هذه الفئة المهمة من المجتمع هي التي حركتهم لهذه التجرية الجميلة ..<br />انا عندي اخ معاق على كرسي ..<br />بحب دايما ادفع الكرسي و لا ارفض له طلب ابدا لو حب يتمشى ، لانه لا يستطيع دفع الكرسي بنفسه ،، بس هذا لا يعوض ابدا الشعور في داخل الطفل المعاق الذي لا يمكنه المشي ..<br />أحيانا كثيرة يظل في الكرسي ثابتا في نفس المكان من غير ان يتقدم اي شخص لدفع الكرسي او يسأله تحب تتمشى او تغير المكان .. لانه ببساطة احنا مش في مكانه .. لا نحس باحاسيسه ..<br />ياريت كلنا نحس بان المعاق انسان ، فيه نفس المشاعر اللي عندنا ، و مش لازم ننتظر منه ان يخبرنا او يتكلم ، يجب ان نفهمه بنفسنا ، يجب ان نحاول ان نضع انفسنا مكانه و نفكر يا ترى بماذا يفكر و ماذا يجول في نفسه ..<br />يا رب توفق جميع المسلمين في كل البلدان لتحقيق الدمج الكامل للمعاق في الحياة العامو للمجتمع ، حتى تكون الامور سهلة للمعاق و لاهله و للمجتمع ايضا<br />و شكرا يا اخ احمد على الموضوع الجميل جدا جدا جدا<br />الى الامام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151421/http://www.20at.com/article2.php?sid=651"

