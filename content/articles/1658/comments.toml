subject = "تفتكروا دي طريقه"
author = "سنووايت"
posted = "2006-04-03"
text = "مع احترامي لطريقه التفكير دي<br />بس انا معترضه عليها جدا<br />احنا ممكن نحس بالمعاق واحنا بنمشي على رجلنا واحنا بنحمد ربنا على النعمه دي<br />اما عن معاناه المعاق دي واضحة جدا مش محتاجه كراسي وتقمص هوه انتوا بتعالجوه نفسيا - حاجة مش ممكن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151421/http://www.20at.com/article2.php?sid=651"
