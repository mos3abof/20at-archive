author = "حم الله الأفغانى ,,,,,,,"
text = "فقد كان نبراسا للحق فى زمانه لكن كعادة العظماء تنتهك كرامتهم فى أوطانهم ,,,, ولا يجدونها إلا عندالغرباء .<br />وما احوجنا اليوم لأمثالك اللذين يتعاطون الدين بأعتدال وروية وينبذون الغلو والتشدد الذى أودى بحياة الآلاف من المسلمين .<br />وما أحوجنا لعلمك كى ننظر بعين الحكيم والمتدبر فى تفسير النصوص القرآنيه والأحداديث الشريفه ولا نفرها حسب أهواءنا ونلقى بديننا وأنفسنا الى التهلكه .<br />جمعنا الله وأياكم والمسلمين فى جنات النعيم مع سييد الغر المحجلين وآخر دعواى أن الحمدلله رب العالمين"
