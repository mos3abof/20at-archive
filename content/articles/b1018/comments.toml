[[comments]]
order = 11
subject = "دي أجمل حاجه في حياتي"
author = "Romantic_Rose"
posted = "2006-07-06"
text = "انتي مش عايزه تلبسي دبله ؟؟ أول مره أسمع فيها بنت بتقول كده .. صدقيني .. دبلتي هي أجمل حاجه في حياتي .. و و الله مهما أكون مبهدله و مش لابسه اللي علي الحبل و انا خارجه .. مجرد أني لابسه الدبلة و التونز بتاعها ف صباعي بحس أني أجمل بنت ماشية ف الشارع و راكبة المواصلات و قاعده ف المدرج لمجرد أني لابسة دبلة حبيبي اللي عليها أسمه و تاريخ ارتباطنا.. و لما دبلة خطيبي ضاقت علي صوباعه .. نفسيتي تعبت جدا بالرغم من انه اشتري واحده تانية و لبسها .. بس حسيت اني ما بقيتش موجوده معاه لما غير الدبله اللي لبستهاله بنفسي !!<br />حاجه تانيه .. شوفي نظرة الويترز في كافيه أو سنيما أو مواصلات و انتي قاعدة مع خطيبك أو جوزك حتي و مش ف ايدك دبله هتحسيهم بيرموكي بنظرات من شرر .. أما لو الدبله ف صباعك هتلاقي مية من نفسه يقولك ربنا يهنيكي ..<br />ربنا يهنيكي يا بنوته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144837/http://www.20at.com/article2.php?sid=1018"

