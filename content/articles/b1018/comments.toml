subject = "هى جات على الدبله!!!!!"
author = "oya"
posted = "2006-07-04"
text = "يعنى انتى سيبتى كل مشاكل الخطوبه والجواز اللى بتحصل وجايه على الدبله!!!!! يا شيخه حرام عليكى وانا شايفه انها مهمه لو انتى مثلا فى شغلك وواحد اعجب بيكى لما يشوف الدبله فى الاول لو كان محترم هيحاول يبعد بس من غيرها ممكن يقرب اكتر وفى الاخر تقوليلو مخطوبه او العكس للراجل وكمان الواحد بيحب يكون معاه حاجه من حبيبه يعنى حاجات كده شكلك ملكيش فيها"
