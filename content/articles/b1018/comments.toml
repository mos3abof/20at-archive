[[comments]]
order = 1
subject = "دبلة الخطوبة"
author = "بنت فلسطين"
posted = "2006-07-03"
text = "قصة انو الدبلة بتقوي اواصر المحبة بين العروسين هادا الشي موجود في الديانة المسيحية بقولوا المسيحيين انو الخاتم هادا لما ينحط على الاصبع برتبط مع شريان في الجسم اسمه شريان الحب واحنا طبعا( المسلمين) اخدنا هادا الشي على محمل الجد وصار اشي استحالة الاستغناء عنه<br />بس انا برايي انو اذا في بنت مش مقتنعة بالدبلة ما في مشكلة ما تلبسها وبالاخر هي حرة وارضاء الناس غاية لا تدرك مش كده برده ولا ايه؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144837/http://www.20at.com/article2.php?sid=1018"

[[comments]]
order = 2
subject = "إحتراما وتقديرا لكى أيتها الدبلة المظلومة"
author = "خالد موسى"
posted = "2006-07-03"
text = "أختلف جدا مع الأخت العزيزة بنت العشرين فى التقليل من أهمية لبس الدبلة بين المخطوبين فالدبلة تظل من الأشياء التقليدية الجميلة فى عادتنا وتقاليدنا العربيه والمصريه على وجه الخصوص فهى رمز من رموز الحب وإحترام هذا الحب أو هذاالإرتباط بي المحبين أو الطرفين المخطوبين لذلك لابد من تأصيل هذة العادة والعمل على إعطائهامزيدا من الوقار والأحترام حتى لا تفقد وقارها وهيبتها حتى ولو كانت قطعة من الحديد على حد تعبيرك بنت العشرين مع كل الأحترام والتقدير لرأيك فعندما تكبرين شويه وترتبطى بالشخص الذى تحبينه عند وصولك لهذة المرحلة سوف تعرفين تماما قدر وقيمة هذة القطعة من الحديد إذا ما فكر زوجك أن يتركها حتى على سبيل السهو والنسيانوشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144837/http://www.20at.com/article2.php?sid=1018"

