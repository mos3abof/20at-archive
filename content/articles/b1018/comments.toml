subject = "دبله الارتباط المقدس"
author = "قاضي القلوب"
posted = "2006-07-04"
text = "اجمل حاجه للبنت هي يوم خطوبته اليوم التحلم فيه براجل اكون حبيبه وحياته والدنيا بتاعته.<br />لما يكي اليوم ده وتلبس فيه الدبله حيكون اليوم ده يوم السعد ليه<br />وعاوزاه متلبس الدبله ليه حرام عليكي<br />دي الدبله حاجه مقدسه عشان الكل يعرف ان انا لابساه بعد الحب الجميل العشتوا مع حبيبي<br />انا مع الدبله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144837/http://www.20at.com/article2.php?sid=1018"

