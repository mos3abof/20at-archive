[[comments]]
order = 14
subject = "انا مخطوبه وليا رأى"
author = "so7a"
posted = "2006-08-04"
text = "بصى بقى انا بردو فى بعض العادات والتفاليد بضايقنى بس بحترمها جدآ لانى لما بركز شويا بلاقى الناس دى بجد عندهم فكر وان العادات دى تنفع لكل زمن او وقت يابتنى صدقنى انامبقدرش اخلع الدبله من ايدى لما بتوضى برفعها لفوق شويا علشان المايه توصل تحتها وبعدين ارجعها وبعد الخطوبه تحت الدبله الجلد التهب جدآ وكل اخواتى قالوللى انقليها فى الايد التانيه حتى خطيبى قالى انقليها والله ماقدرت وبعدين دى كفايه انها حاجه منه موجوده معايا فى كل وقت وكمان حمايه ليا من اى عين او اى شخص يحاول التقرب منى من الاخر بتحط سد منيعاى واحده بتنخطب وتحب خطيبها بتبقى مش عايزه اى عين تشوفها غير خطبها ربنا يهديكى وتلبسيها دى حتى بتدفى فى الشتا"
