[[comments]]
order = 8
subject = "am00r"
author = "دي عادات و تقاليد احنا اتعودنا عليها من ساعة ما اتولدنا و لحد ما هانمووت، و احنا الشعب المصرى اسرى للعادات و التقاليد حتى لو غلط."
posted = "2006-07-05"
text = "الناس كلها فى مصر هنا بتعرف ان البنت المرتبطة لازم يكون فى واحدة من ايديها دبلة، سيبك من انها بتقوى العلاقة و تزود مشاعر الحب، لأن المشاعر أصلها القلب مش حتة الحديدة، بس الدبلة بتمثل رمز من رموز الارتباط الجدي و لبسها دليل على مدى جدية الطرفين فى العلاقة.<br />و بعدين طوول ما الواحدة مش لابسة الدبلة و هي مخطوبة ممكن تتعرض للمعاكسات او حتى تفاجأ ان فى واحد تانى يروحلوهم البيت عشان يخطبها، يقوم اهلها رادين عليه \"معلش يابنى، بنتنا مخطوبة!!!\"<br />انا متهيألي - كشاب طبعا - إن أي بنت بتكون لابسة دبلة الخطوبة بتبقى فرحانة و سعيدة و بتتفاخر بيها كمان احياناانها مرتبطة و جه عليها الدور، و ان القطر ما فاتهاش زي بنات كتير.<br />البسيها..البسيها..<br />أي حاجة ممكن يبقى ليها مزايا و عيوب، و احنا على هـ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144837/http://www.20at.com/article2.php?sid=1018"

[[comments]]
order = 9
subject = "الدبلة في السنة النبوية"
author = "هزازة البزازة"
posted = "2006-07-05"
text = "مع كل الاحترام لكل الآراء خاصة الأخت الفلسطينية ان الدبلة دي حاجة خارج الدين الإسلامي فالكلام ده غير صحيح لأن العادات التي لا تتعارض مع الإسلام أقرها الإسلام والدليل أن الرسول صلى الله عليه وسلم جائته امرأة فقالت اني وهبت نفسي لك يارسول الله فلم يرد الرسول الزواج فقال أحد الجالسين زوجنيها يا رسول الله فقال ما معك فقال ليس عندي إلا ازاري قال وما تصنع بإزارك فقال له الرسول التمس ولو خاتما من حديد فقال لا أجد فقال فما معك من القرآن قال معي سورة كذا وكذا فقال الرسول زوجتكها بما معك من القرآن. اذا الرسول لو كان يعلم أن الخاتم أو الدبلة أو ما شابه فيه منافاة للدين لما طلب من الرجل أن يعد للزوجة مهرا خاتم من حديد مع الوضع في الاعتبار عدم المغالاة لأن الرسول جاءه رجل يريد أن يتزوج فطلب المعونة فقال له الرسول على كم تزوجت فقال على اربعمائة درهم من الفضة فقال له الرسول كأنما تنحتون الفضة من عرض هذا الجبل ثم قال له الرسول اذهب ليس عندنا ما نعطك."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144837/http://www.20at.com/article2.php?sid=1018"

