text = "انا مش فاهم ايه مشكلتك في لبس الدبله بلاش عقد بقي وايه المشكله لما الناس في الشارع يشوفوا الدبله في ايدك يعرفوا انك مخطوبه أو محجوزه زي ما قلتي هو مش خطيبك بردو نفس الوضع وبعدين دي حاجه مش هتسيئ ليكي يبقي ليه اصلي مش مقتنعه ومقتنعه خلي حياتك ابسط من كده وربنا يكون في عون خطيبك بجد"
