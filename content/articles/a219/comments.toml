subject = "بنوتة"
text = "جميل اوى يا مفروسة بالتوفيق دايما انا عندى اقتراح احنا ارتبطنا بالكاتبه اسلوبا و موضوعا بس ليه الشخصيه دى ما يكونش ليها شكل محدد او شخصيه كاريكاتورية محددة يعرفها بيها الناس و ترتبط بذاكرتهم مثل شخصيات مصطفى حسين و البعكوكة و يكون فيها من ملامح الكاتبه بشكل ساخر طبعا او حتى من غير ما يكون فيها من ملامحها يمكن هى مش عاوزة حد يشوفها (بهزر) يكون فيها سمات شخصيه البنت المصرية و ملامحها بس المهم ان شخصيه صابرين اللى ارتبطنا بيها دى يصبح لها كيان.ارجو ان ينال اقتراحى اعجابكم و اللى مش عاجبوا ما يعلقش"
archived = "2004-10-16"
capture_url = "https://web.archive.org/web/20041016082403/http://www.20at.com:80/article.php?sid=219"

