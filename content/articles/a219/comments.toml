[[comments]]
order = 11
subject = ",واحد رخم"
text = "لمؤاخذه كل ما واحد يتقدم لسيادتك تقعدى تتقمعى وتعملى فيها انه موش نافع لما هو موش نافع من قبل مايجى كل مرة تنزلى تشترى باتية وجاتوه والبتاع الرفتنع ده اللى اسمه ساليزون ليه ،اذا كان جواز الصالونات موش عاجبك قوليها من اولها وريحى الحاجة والدتك اللى كل مرة تتعب فى نوع الفستان اللى بتشتريهولك ،وطالع عينها فى نوع الايشارب اللى هتلبسيه ، واذا ناوية تتجوزى بالطريقه دى يبقى ما تتقمعيش على مخاليق ربنا وسيبى امك تجيب لك العرسان وافحصيهم بدل ما فى يوم نلاقيك بتضحكى ضحكه الحاجة مارى منيب وتقولى \" اهاها انا اللى دوبتهم سعبة فى وش العدوين \""
archived = "2004-10-16"
capture_url = "https://web.archive.org/web/20041016082403/http://www.20at.com:80/article.php?sid=219"

