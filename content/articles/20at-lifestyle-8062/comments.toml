text = "هذي الظاهر ملعونه و هم يخذون حريتهم في المدارس و الادارة تشوفهم و ما تكلمهم وكأن شيء طبيعي وهم يتكاثرون يوم بعد يوم وإذا استدعت المديرة أم البوية تشوف المديرة الأم مثل بنتها وهذا ألي صار في مدرستي"
archived = "2009-05-23"
