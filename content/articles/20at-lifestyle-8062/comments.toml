posted = "2008-02-19"
text = "السلام عيكم ..<br />انا فعلا انقبضت جدا وانفعلت من المقال ده ياطارق<br />ازاى فى بنات تعمل كده ايه فين الاهل ودورهم فى حياة أولادهم؟ وكمان انت بتقول ان ده بيحصل فى المدارس ؟<br />كأن المدارس دى بقت شوارع ولا نادى مش حرم تربوى ولا للتعليم . هنفضل ننتقل من انحطاط لانحاط لحد إمتى<br />أقول ايه (اللهم انتقم من كل الفاسدين فى الأرض وربنا يهدى)."
archived = "2009-05-23"
capture_url = "https://web.archive.org/web/20090523230138/http://www.20at.com:80/7ayatna/8062.html"

