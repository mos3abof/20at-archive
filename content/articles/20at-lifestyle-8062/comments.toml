text = "الواحد لما ايجوف هاذا الشي جدامه من صغرا و لا ينقال عنه جذي يصير جذي و في وايد بويات ودهم يردوون بس ما يقدرون جافو نفسهمو اهما جذي و في وايد صارو جذي من اهلهم الي ينفصلو و لا الي ما يهتمون بعيالهم والبويه ما يبيلهالا انا تسمع محاضر ولا محاضرتين تلقين شي من داخلها يتحرك ماكو شي بالغصب و اذا حاولت تضغطون عليهم راح ايزيدون بشي فضيع و هاذي نصييحه و انشالله اكون ساعدكم"
