[[comments]]
order = 2
subject = ""
author = "متحولة"
posted = "2008-11-03"
text = "هذا تخلف لا تقدم كل من هب ودب كتب وافتى وحلل وحرم على كيفه في فرق بين اضطراب الهوية الجنسية والتشبه والجنوس والبويات والمسميات اللي ماادري من وين تطلع ومالها اي معنى علمي مجرد كلام عامي ينقال وبس..<br />كل واحد قرى جم كتاب ولا درسله شويه قام يحلل الناس وعللهم..!!<br />شي غريب منو انتوا علشان تتكلمون بحالة معترف فيها ومحللينها ومخلصين من قبل منظمة الصحة العالمية ومعترف فيها عندنا وبكل الدول العربية..<br />حسافة ان الناس الفاهمة ماتطلع تتكلم عن هالموضوع ومخلين الناس اللي موعارفه شي وتبي تطلع موعارفة شلون تتكلم بكيفها تذكروا ان وراكم اهل وعيال باجر ممكن يصير فيهم هالشي بنشوف شنو بتقولون وقتها، لان مايحس بالشي الا اللي مبتلى فيه..<br />اشكر كل شخص قال كلمة حق واقول حق كل واحد فاضي ويفتي بكيفه خل يتقي ربه لان مثل ماقلت ممكن يكون اقرب الناس له بهالحالة..<br />والسلام عليكم ومسير الحق والصح يبين ان شالله…"
archived = "2009-05-23"
capture_url = "https://web.archive.org/web/20090523230138/http://www.20at.com:80/7ayatna/8062.html"

