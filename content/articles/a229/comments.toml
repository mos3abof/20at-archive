[[comments]]
order = 0
subject = "الحكم"
text = "الحكم ده م الآخر كده عايز يتردم في ميدان عام .. أما البنت فربنا يجعلها عفيفة دائماً ويرزقنا الهدى والتقى والعفاف والغنى أجمعين ..<br />ميرسي كتير ليا أني علقت على الموضوع"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040924/http://www.20at.com:80/article.php?sid=229"

[[comments]]
order = 1
subject = "واحد رخم"
text = "تفتكروا عفيفة ممكن تلبس نقاب وهيا بتلعب ولا برضه هيعوق حركتها ، جننتونا يا عالم ،"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040924/http://www.20at.com:80/article.php?sid=229"

[[comments]]
order = 2
subject = "واحد ارخم"
text = "سؤال تعليقى لمؤاخذة للشيخ الشبابى تبعكوا ، هو لبس عفيفة ده شرعى فعلا ولا حاجه تسد وخلاص يعنى حكاية فضفاض ولا يشف ولايصف دى نخلع منها بقى ونريح الانفوخى من اشتراطات الفقهاء وما دام الشعر اتغطى يبقى خلاص كله فى الاوكيه ؟"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040924/http://www.20at.com:80/article.php?sid=229"

[[comments]]
order = 3
subject = "حجاب عفيف من صنع عفيفة"
text = "بداية اشكر الاخت ياسمين كتابة هذا المقال الطيب ..<br />ثانيا علينا جميعا ان نظهر ونلمع وننشر النماذج الاسلامية الناجحة ..لأنهم عنوان للاسلام والالتزام<br />ولو أن هناك بعض التقصير فعلينا ان نعمل على جبرها وليس قتل الاخت...<br />فالواحد منا جالس خلف الكمبيوتر وتحت التكييف وبيشرب حاجة ساقعة ويقول ويتكلم ولا غير ذلك ويهاجم الناس بل يتمسخر عليهم وهو ولا مؤاخذة قفص جوافه لا بيهش ولا ينش<br />يا اخونا ارحمونا<br />الاخت عفيفة بتعمل اللي في امكانيتها وقد ادت ومازالت تؤدي دور هام وحيويو ومؤثر فيا ريت نبطل كلام ونقد وتجريح ونبدأ نفكر ازاي كل واحد فينا في مجاله او هوايته يخدم دينه ليس بمظهره فقط بل بسلوكه"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040924/http://www.20at.com:80/article.php?sid=229"

