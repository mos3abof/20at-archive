[[comments]]
order = 0
subject = "ملكة جمال انواكشوط ؟؟؟!!!"
author = "عبد الله ولد إبراهيم ولد محمد اعل"
posted = "2006-07-02"
text = "ما هذا الخبر السيئ ؟ الله يخرب بيت اللي مسؤول عنو(الله يحرق اظريع بيُّ و بي ذاك)<br />نحن الموريتانيين لم يبق لدينا من الكرامة إلا بقية من ديننا الحنيف ، فهل تريدوننا أن نقد هذا أيضا.<br />إنني أدعو إلى منع مثل هذه النشاطات بأية وسيلة ممكنة و الحيلولة دونها.<br />و أما بالنسبة للنساء اللائي قد يشاركن في مثل هذا النشاط المشين فإني أقول لهن : إذا كانت لديكن كرامة فلا تشاركن في هذا، أما إذا لم تكن لديكن كرامة (وهذا هو الواقع) فأنتن فاسقات (حوبارات و شراميط).<br />و أما بالنسبة للرجال الذين لديهم علاقة في الموضوع فكل واحد منهم إما أنيكون قوادا أو ديوثا.<br />و أخيرا أذكركم بان الذي أهلك بني إسرائيل هو أنهم كانوا لا يتناهون عن منكر فعلوه.<br />مع تحياتي<br />المهندس عبد الله ولد ابراهيم ولد محمداعل من أبناء مذينة أطار<br />و مقيم حاليا في الخارج"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141933/http://www.20at.com/article2.php?sid=1005"

