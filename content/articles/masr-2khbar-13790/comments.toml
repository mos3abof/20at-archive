text = "احنا شعب مقرف وكلة مشاكل وعندنا فقر وازمة عيش ومليون ازمة تانية ونحن نشفق عليك من حكمنا<br />فيا استاذ جمال بلاش تتعب معانا احنا خايفين عليك - شوف لك حتة تانية او شعب تانى احكمة<br />وربنا يسترها معاك يا شيخ"
archived = "2009-10-23"
capture_url = "https://web.archive.org/web/20091023132356/http://www.20at.com:80/masr/2khbar/13790-2009-10-22-09-00-14.html"

