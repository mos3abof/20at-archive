[[comments]]
order = 5
subject = ""
author = "انها امانه"
posted = "2009-10-23"
text = ". إنها أمانّة وإنها يوم القيامة خزيٌّ وندامة ,,!!<br />هكذا قالها رسول الله صلى الله عليه وسلم يوم أن طلب أباذر الغفاري تسلم زمام أمر من أمور المسلمين .. فردّه الرسول - صلى الله عليه وسلم - بلطف وقال .. يا أباذر .. إنها أمانة وإنها يوم القيّامة خزيٌّ وندامة ..<br />لقد اسمعت اذ ناديت حياً لكن لا حياة لمن تنادي<br />_______________ _______________ _____<br />لاترد الحقوق في مجلس الامن ولكن في مكتب التجنيد<br />ان الفي قذيفة من كلام لا تساوي قذيفة من حديد"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027103750/http://www.worldcup2006.20at.com:80/masr/2khbar/13790-2009-10-22-09-00-14.html"

[[comments]]
order = 6
subject = ""
author = "مبارك بيكره ابنه"
posted = "2009-10-23"
text = "حسني مبارك بيكره ابنه اوي<br />اوعوا تفتكروا غير ذلك<br />لو بيحبوا كان بعدوا عن السكه دي<br />بالضبط زي معاوية ابن ابي سفيان<br />استخخدم كل سلطته وقوته لتوريث ابنه وعلى حساب من يستحقها وهما الحسن والحسين<br />وما كنش حاسس انه بيقعد ابنه على كرسي من نار<br />يزيد ابن معاوية لما استلم اتورط في قتل الحسين وهما 3 سنين فقط واتجنن<br />يبقى معاوية كان بيكره ابنه ولا لا<br />اللي بيحب ابنه لا يمكن ابد يقعده على كرسي حكم مصر وخصوصا في هذه الظروف الصعبه<br />_______________ ____________<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027103750/http://www.worldcup2006.20at.com:80/masr/2khbar/13790-2009-10-22-09-00-14.html"

[[comments]]
order = 7
subject = ""
author = "كنت اقول لك"
posted = "2009-10-23"
text = "لو فرض اننى احاورك<br />مع علمى ان الشباب الذين سيختاروا للحوار من شباب اكاديمية مبارك للشرطة والاسئلة معدة لهم من قبل مخرج سياسى وملقنين جيدا<br />لكن لو<br />كنت اقول لك<br />لو ذهبت لقرى الصعيد وبتوعدهم بالمجارى وعمل مدرسة ابتدائى هى موجودة فعلا من ايام مولانا الملك فؤاد - انما لو وعدتهم ان الحكومة هتعمل هناجر او مصانع صغيرة تصنع فوانيس رمضان وسجادة صلاة بدلا من الصين وفى قرية تانية مصنع صغير يصنع دراجات وعجل للاطفال<br />وقرية تالتة تصنع بطاريات جافة<br />ومدينة تصنع ملابس جاهزة ومدينة تانية تعمل كاوتش عربيات<br />هى دى الصناعات الصغيرة<br />وهى دى التنمية وهى دى اللى تعمل وظايف وتجيب دخل للبلد<br />انما ادخال المجارى لقرية من المعونة الامريكية دى خدمات مش تنمية"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027103750/http://www.worldcup2006.20at.com:80/masr/2khbar/13790-2009-10-22-09-00-14.html"
