[[comments]]
order = 5
subject = "احذروا من هذا الموقع"
author = "هشام"
posted = "2006-01-09"
text = "اقسم عليكم أيها المسلمون أن تحذروا من هذا الموقع الذي هدفه نشر السم بين كل أخباره ونصوصه التي تحتوي على الكثير من التوجيه غير المباشر..<br />اتمنى منكم ملاحظة طريقة العرض والسرد والبحث عن الهدف الحقيقي الخفي ..<br />هذا الموضوع بالذات يهدف الى تشويه صوره الحج بالنسبة الى المسلمين..<br />أنا لست مع من يصطحب معه حراسة،، لكن ليس هذا هو الهدف من هذا الموضوع..<br />لاحظوا جميع نصوص وأخبار هذا الموقع فهي تؤدي نفس الغرض..<br />وأنت يا صاحب هذا الموقع ..<br />انتظر مني الكثير.. لن أتركك يا عميل<br />لن أتركك<br />لن أتركك<br />لن أتركك<br />لن أتركك<br />لن أتركك<br />يا حقيــــــــــر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123624/http://www.20at.com/article2.php?sid=221"

[[comments]]
order = 6
subject = "أسبرينة ريفو + مرهم هيموكلار"
author = "واحد اتخبط وهو بيعدي"
posted = "2006-01-09"
text = "إيه يا مااان..<br />ما تهدئ أعضائك كده يا حاج هشام..<br />موقع عميل إيه وهباب إيه وحقير إيه..<br />وسم إيه اللي أنت جاي تقول عليه..<br />أهدا كده وخد أسبرينة ريفو وأنت تبقى زي الفل.. وأنصحك تدهن الكيبورد مرهم هيموكلار عشان واضح إنه بعافية شوية.. وتنزل شوية زيت خاروع على الماوس عشان الهضم عنده مش أد كده<br />وأبقى اتغطى كويس عشان الدنيا برد بالليل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123624/http://www.20at.com/article2.php?sid=221"

[[comments]]
order = 7
subject = "التوجيه المباشر والغير مباشر"
author = "®Cipher"
posted = "2006-01-09"
text = "الأخ \"ماك جايفر\" اللي بيقول لن اتركك لن اتركك لن اتركك لن اتركك..... كان فيه كلام كمان ممكن تقوله و شفناه في افلامك بتاعة اخترما لك زي \"تباً لك , ايها الوغد و سحقاً\" و بعدين ايه القصيدة النص كم دي \"انتظر مني الكثير.. لن أتركك يا عميل\" ده كلام بيقوله مشجعين نادي السكة لما الأهلي او الزمالك بيقطعهم<br />\" و نصيحةاخيرة اترك الموقع علشان باين اوي انك انتا اللي عميل و اتفأست"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123624/http://www.20at.com/article2.php?sid=221"

