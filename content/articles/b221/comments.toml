[[comments]]
order = 12
subject = "هيهات هيهات"
author = "أبو محمد"
posted = "2006-05-06"
text = "أخوة الإسلام لاأعتقد أن الرسول صلى الله عليه وسلم كان يصحب مرافقته إلى أداء فريضة الحج مع العلم أنه ليس هناك مجال للمقارنة وهيهات هيهات فهو رسول الله وما هذه المظاهر التي ورد ذكرها إلا هي تكبر على الله .....على فكرة يوم القيامة مافي خيار و فقوس بس الله يرحم القائل<br />أمنت لما أقمت العدل بينهم<br />فنمت فيهم قرير العين هانيها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123624/http://www.20at.com/article2.php?sid=221"

[[comments]]
order = 13
subject = "مصري"
author = "عاطف"
posted = "2006-05-30"
text = "المجرم مش بيهمه انه في مكان مقدس علشان يرتكب جريمة او لا و زي ما الكل عارف في مجرمين بتروح الحرم علشان تسرق هو ده برده مش من ضمن الحجاج و الناس الذكرتوهم كلهم شخصيات عامة و مرموقة و اكيد لهم اعداء و الجايز جدا لو مش معاه حرس يكون ده فرصة لأعداءه اما الرسول عليه الصلاة و السلام فكان الحارس له الله الأقوى من اي بودي جارد و لا اي انسان اما نحن فلا يمكن ان نشبه به و كان عدد الناس من المسلمين قليل لدرجة انهم كلهم بيعرفوا بعض تقريبا و كان المجتمع له تقاليد امان غير موجوده حاليا احنا الأن لا تربطنا اي قيود ولا اي اتفاقيات و لا شروط للأسف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123624/http://www.20at.com/article2.php?sid=221"

