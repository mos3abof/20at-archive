[[comments]]
order = 15
subject = "الاخ عاطف المصرى"
author = "رجاء"
posted = "2006-07-17"
text = "الناس جميعا يحرسهم الله(قل لن يصيبنا الا ما كتب الله لنا) ولو كنت شخصية مهمة فسادهب الى الج دون بودى جارد<br />و ادا قتلنى احدهم فسيكون جميلا من قبله<br />فلن اجد مكانا اموت فيه احسن من الكعبة الشريفة و انا اقوم بمناسك الحج و بين يدى الله<br />اعد النظر فى طريقة تفكيرك و لا تحاول ايجاد اعدار واهية للغير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123624/http://www.20at.com/article2.php?sid=221"
