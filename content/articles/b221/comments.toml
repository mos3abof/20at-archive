[[comments]]
order = 0
subject = "بركاتك يا حاج ( جارد )"
author = "مصــegyــري"
posted = "2006-01-07"
text = "حلو حوار مرشد الاخوان مشهور اللي كان معاه (متطوعين جارد )<br />بالمناسبة بيقولوا ان المرشد الحالي عاكف نصحه الاخوان بمرافقة حرس له من شباب الاخوان ايام الانتخبات و بعدها خاصة بعد اشاعات عن اغتياله قدوة بحسن البنا ... لكنه رفض الفكرة رفضا شديدا<br />الا صحيح هو مش العادلي قال على مراقبة التليفونات (اللي خايف مايتكلمش )<br />خلاص ... احنا نعمل حكمه مضادة بتقول \" اللي خايف .. مايحجش)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123624/http://www.20at.com/article2.php?sid=221"

[[comments]]
order = 1
subject = "متطوعين ايه"
author = "المصرى"
posted = "2006-01-08"
text = "الاخ المحترم واضع الموضوع انت تقول<br />(والطريف أن المرشد العام للإخوان المسلمين الأسبق مصطفى مشهور قام هو الآخر بأداء فريضة الحج بصحبة المتطوعين لحراسته من شباب الإخوان !! )<br />والاخ المحترم جدامصــegyــري<br />للعلم مرشدين الاخوان لا يسيرون بحراسة وهذا الكلام قاله مرشد الاخوان مهدى عاكف انه لا يخشى من القتل وانه يسير بدون حراسه وقال حتى انى اذهب واشترى الفطار بنفسى واشترى الفلافل والعيش<br />وحكاية المتطوعين دى بتكون رحلة طلعين الحج مع المرشد ودول مش متطوعين ولا حاجه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123624/http://www.20at.com/article2.php?sid=221"

