order = 0
subject = "مشكلة الإخوان إنهم مؤدبين شويتين"
author = "نصير الإسلام المضروب على قفاه . . المواطن مصري"
posted = "2005-11-23"
text = "لمشكلة الحقيقية ان الإخوان حساسين جداً من ناحية شكل الجماعة وسمعتها والأهم من كده انها تتقي الله فيمن يعتدون عليها بشكل يكاد يكون اقرب لفلسفات المسيحية \"باركوا لاعنيكم - أدر خدك الأيمن لمن لطمك على خدك الأيسر\" وهو اسلوب دعوي رائع نجد له أيضاً أصل في القرآن الكريم \"إدفع بالتي هي أحسنفإذا الذي بينك وبينه عداوةٌ كأنه وليٌ حميم\" وهنا تكمن المشكلة؟؟ هذا الأسلوب الدعوي الذي نجح مع الكفار والرومان الوثنيين هل ينجح مع رجال الحزب الوطني؟ هل مشكلتنا معهم ستنتهي بمجرد أن يعلنوا رضائهم بالحكم الإسلامي؟ أم ان هناك حقوق للمجتمع لابد أن تقتضى منهم!<br />ان من سرقوا اموال الشعب وكمموا فمه ولوثوا هوائه وسمموا وسرطنوا طعامه وباعوا ارضه لن تجدي معهم اية اساليب دعوية؛ وان كانت مجدية فيجب ألا تأخذنا بهم شفقة.<br />ولشد ما كنت اتمنى أن يكون للإخوان بلطجية يقفون في وجه كلاب الوطني ومجرميه ولكن كما قات في البداية مشكلة تلك الجماعة في مبادئها"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813230038/http://egyvote.20at.com:80/article.php?sid=37"
