[[comments]]
order = 2
subject = "خلاصة الإجتهادات"
author = "محمد علي"
posted = "2006-01-15"
text = "خلاصة الاجتهادات المختلِفة في أوقات رمي الجمرات في الحجّ، وفيما انتهى إليه تيسير على حُجّاج بيت الله الحرام، وتخفيف للمشقّة الشديدة التي تَلحقُهم بسبب الزِّحام الشديد عند الرمي، وصدق الله العظيم (وما جَعَلَ عَلَيْكم في الدِّين مَنْ حَرَجٍ) (الحج: 78).<br />1 – وقت رمي جمرة العَقبة:<br />رمي جمرة العقبة يبدأ من فجر اليوم الأول، أي: يوم الأضحى بالإجماع، سوى أنّه عند الشّافعية يبدأ من منتصَف ليلة العيد، ويستمرُّ إلى غروب شمس آخر أيام التشريق، وهو اليوم الرابع، فيرميها الحاج ليلًا أو نَهارًا، ويكون كلُّ ذلك أداءً عندهم.<br />وعند الحنفيّة يستمرُّ وقته من فجر اليوم الأول إلى فجر اليوم الثاني، والأفضل عدم تأخيره عن وقت الزّوال من اليوم الأول، ويُباح تأخيره إلى الغروب، ويُكرَه بعده.<br />2 – رمْي الجمرات الثلاث:<br />رمي الجمرات الثلاث بعد اليوم الأول، يبدأ وقته من زوال كل يوم إلى فجر اليوم التالي في معظم المذاهب.<br />إلا أنه عند الشافعية يَبدَأ وقت الرَّمي في كل يوم بزوال الشمس فيه، ويستمر وقته إلى الغروب من آخر أيام التشريق، ولكنْ لا يصحُّ الرمي عن يوم إلا بعد الرمي عما قبله.<br />وعند أبي حنيفة أن اليوم الرابع من أيّام العيد، وهو يوم النفر الأخير يبدأ وقت الرّمي فيه من الفجر حتى غروب الشمس، فيستطيع المتعجِّل أن يرميَ قبل الزوال وينفرَ.<br />وقال إسحاق: إن يوم النَّفر الأول (وهو الثالث) هو كالرابع يبدأ الوقت فيه لأجل الرمي من الفجر أيضًا، تسهيلًا لمَن يُريد النّفر فيه (كما في نيل الأوطار للشوكاني).<br />أما اليوم الثاني من أيّام العيد، فالجمهور على أن وقت الرمي فيه يبدأ من الزوال، فلا يصحُّ الرمي فيه قبل الزوال، لأنه لا نفرَ فيه.<br />ولكن خالَف في ذلك الإمام الباقر محمد بن علي من آل البيت (كما في بداية المجتهد)، وكذا الإمام الناصر من الزّيديّة (كما في البحر الزخار) وكذا من التابعين عطاء وطاووس (كما في نيل الأوطار) فقال هؤلاء جميعًا: إن الوقت في اليوم الثاني أيضًا يبدأ من الفجر، فيرمي قبل الزوال مُطلقًا.<br />وفي قول آخر عند الحنفيّة أيضًا غير القول المشهور: أنّ اليومين الثاني والثالث أيضًا يجوز الرّمي فيهما قبل الزّوال.<br />وعليه يكون في الأيّام الأربعة كلّها مجال للرّمي من الصّباح قبل الزوال في مختلف الاجتهادات، ولو في غير يوم النّفر للمستعجِل وغيره؛ لأن في الرمي قبل الزوال تيسيرًا كبيرًا على الناس حتى على غير المستعجِل لأجل النفر، فإن الماكِث أيضًا قد يحتاج إلى التبكير في الرمي اجتنابًا للزِّحام الشّديد في الحَرّ الشديد، ولا يخفَى أن المكلَّف عليه أن يتبع أحد المذاهب المُعتبرة أيًّا كان منها، ويتقبّل الله تعالى منه، فإن الدين يُسر بنصِّ الحديث الثابت."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152732/http://www.20at.com/article2.php?sid=256"

