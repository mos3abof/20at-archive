subject = "أنا معاك يا سمير"
author = "محمد علي"
posted = "2006-01-15"
text = "نتذكر معا سيدنا أمير المؤمنين عثمان بن عفان رضي الله عنه عندما جعل للجمعة آذانين ليسمعه كل سكان المدينة المنورة بعد أن اتسعت و زاد سكانها<br />كذلك فإن هناك العديد من الأفكار الإدارية التي من شأنها تنظيم الأمر و لكن للأسف لا تلقى الإهتمام الكافي<br />رحم الله شهداءنا"
