order = 0
subject = "تجديد الدين"
author = "احمد سمير - مصر"
posted = "2006-01-15"
text = "من قال لا اعلم فقد افتى<br />ولكنى اقول ان الدين الاسلامى دين يسر لا عسر وانه على فقهاء الامه تجديد الدين ومراعاة الظروف الحالية وعدم التمسك بالقديم من الاحكام الفقهيه باعتبارها اصول لا تمس وانما يجب عليهم مجارة العصر حتى يلحق المسلمون بركب العالم المتحضر.<br />وفى راى انها فكرة وجيه جدا تحمى الحجاج من التزاحم و الاختناق و الموت كما نرى كل عام حيث يزداد حجاج بيت الله الحرام دوريا وبالتالى تزيد الحوادث ويموت الحجيج من الزحام و التدافع .<br />ولكن الكلمة الاخيرة فى هذا الامر ترجع الى جموع الفقهاء وعلماء الدين وارجو ان يعلقوا على هذا الفكر الجديد .<br />وجزاكم الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152732/http://www.20at.com/article2.php?sid=256"

