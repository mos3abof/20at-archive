text = "كان لنا فى هذه البلاد تاريخ عظيم<br />قالت لى زميلة دراسه أسبانيه من قبل \"أتمنى أن تعود أيام الأندلس !! \" و حينما سألتها لماذا قالت لى لأنها هى الفتره الوحيده التى أستوعبت كل الأديان و كل الثقافات بدون تناحر تحت مظله واحده<br />يا خساره و يا حسره على ضياع الأندلس"
