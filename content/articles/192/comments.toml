subject = "سيدة القصر"
text = "يقول الرسول صلى الله عليه وسلم:\"تبسمك فى وجه أخيك صدقة\"..<br />ترى كم من الثواب حصل عليه كرم -أكرمه الله- للإسعداه ملايين من المصريين فى وسط الهم الذى يعانوه يوميا..<br />ربنا ينوره قلبه مثلما أضاء قلوبنا بالفرحة..<br />وعقبال كل واحد فينا ما يكون سببا فى إسعاد أهل بلده ودينه..<br />وعقبال ما نحرر القدس..<br />فوزك ياجابر شوف وصلنا بالأمانى لحد فين...<br />وإن شاء الله ستتحقق..<br />طالما هناك من هم مثلك..<br />بكرة أحلى ؛ قولوا : إن شاء الله.."
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831020727/http://www.20at.com:80/article.php?sid=571"

