subject = "نقلاً عن حسن المستكاوي في أهرام السبت"
text = "جلس كرم جابر علي المنصة في المؤتمر الصحفي بعد فوزه بالذهبية وبجواره رافازا نودي الجورجي وميميت أزال التركي الحاصلان علي الفضية والبرونزية‏..‏ وبدأ كرم جابر تصريحاته بإلقاء كلمة بالإنجليزية ممزوجة باللهجة الأمريكية‏'‏ واللهجة الإسكندرانية‏'..‏ وقال لي أحد الصحفيين الأجانب‏:‏ إنه يجيد الإنجليزية‏..‏ أين تعلمها‏!‏<br />إنهم لايفوتون أي شيء‏,‏ وأي جزئية صغيرة‏,‏ و قلت له‏:'‏ كثير من المصريين يتحدثون بلغات إنجليزية وفرنسية‏..‏ وهو له أشقاء في الولايات المتحدة يعيشون بها ويسافر إليهم كل عام‏!'‏<br />لكن الواقع أن كرم جابر صاحب روح دعابة فائقة‏'‏ وعنده كاريزما إبن البلد وقد سألته ثاني سؤال في المؤتمر الصحفي عن أصعب وأسهل مباراة في طريقه إلي الميدالية الذهبية<br />وبعد أن طرحت السؤال‏..‏ خشيت أن يشير كرم جابر إلي يمينه ويساره إلي ميميت أوزال الذي عجنه وإلي رافازا نودي الذي جعله يكره المصارعة ويقول‏:'‏ أسهل مباراة كانت مع‏..‏ هذا وهذا‏'!‏<br />لكن كرم جابر كان دبلوماسيا وحصيفا فقد قال‏:'‏ لاتوجد مباراة صعبة أو سهلة‏..‏ في الأوليمبياد‏..‏ لكن يمكن القول ان المباراة النهائية لها رهبتها وضغطها النفسي لأنها تعني الفارق بين الذهبية والفضية‏'..‏ وسأل صحفي كرم جابر لمن تهدي الميدالية‏..‏ فقال مداعبا‏:'‏ أهديها إلي كرم جابر‏..‏ لأنه تعب جدا‏..‏ وأضاف‏:‏ أهديها إلي مصر طبعا‏'!!‏<br />وسأله أحدالصحفيين الأمريكيين‏:'‏ قرأت تقارير عنك وأنك بصدد احتراف المصارعة في الولايات المتحدة‏..!‏<br />رد كرم جابر بأنه تلقي عدة عروض بالفعل‏..‏ لكنه لم يقررشيئا بعد‏!‏<br />وقد خطف كرم جابر قلوب وأنظار الجماهير اليونانية بخفة ظله‏..‏ فبعد فوزه مباشرة جري إليه مدربه المصري محمود فتح الله لإحتضانه وفوجئنا بكرم جابر يقلبه ويطرحه أرضا بلمس الأكتاف في حركة سريعة كأنه يصارعه‏..‏ فضحك الجمهور علي المشهد‏'!‏<br />لكن إعجاب الصحفيين والخبراء بأداء كرم جابر كان شديدا وكان الصحفيون الأجانب الذين حضروا المؤتمريسألوني كل فترة عن مهارات وموهبة مصارعنا الموهوب فقد لعب‏5‏ مباريات و فاز في الأولي علي البولندي مارك سيتمنك بالنقاط‏(6|‏ صفر‏)..‏ كما هزم منافسه اليوناني جورجيوس كوتسيومباس‏(6/11‏ وفي مباراته الثالثة أمام منافسه الثالث الكازاخستاني أسيت مامبيتوف وفاز بعد دقيقة و‏28‏ ثانية بلمس الأكتاف ثم هزم ميميت أوزال‏11/‏ صفر‏..‏ في‏69‏ ثانية ثم هزم الجورجي رافازا نودي‏1/12‏ في ثلاث دقائق و‏20‏ ثانية‏!‏<br />وأكرر أنه أول رياضي مصري اشاهده في هذا المستوي المرتفع من المنافسات الأوليمبية أو العالمية يفوز بفارق المهارة والموهبة الشاسع بينه وبين منافسيه وأول رياضي مصري أراه واثقا جدا من نفسه وواثقا في قدراته ولايبالي ولايعرف الضغوط النفسية والعصبية والتوتر وهو أول مصارع أيضا أراه يدخل البساط وهو‏'‏ أخر انبساط‏'‏ سعيد ومرح ومستعد‏..‏ وتلك كلها من أسرار تفوقه‏!‏<br />الصحف اليونانية ماذا قالت<br />وأشادت الصحف اليونانية بكرم جابر‏..‏ وقالت صحيفة‏'‏ سبورت داي‏'‏ تحت عنوان‏:'‏ النجم اللامع كرم جابر ينهي غياب الذهب عن بلاده بأداء رائع‏'..‏ قالت ان الرجل الأول في عروض المصارعة كان المصري كرم جابر الذي فاز بأول ميدالية ذهبية لبلاده وقدم مستويات رفيعة المستوي في مبارياته كلها وأنهي علي حلم جورجيا في ميدالية في هذا الوزن خلال ثلاثة دقائق‏,‏ وقد كانت فرحة البعثة المصريةعارمة بهذه الميدالية الذهبية التي حققها أحسن مصارع في الدورة‏..‏ وأشارت الصحيفة إلي تصريحات كرم جابر وشعوره بالفخر وهو يري علم بلاده يرتفع في صالة المصارعة الأوليمبية‏'..‏<br />عن برونزية نجم التايكوندو تامر صلاح بيومي قالت صحيفة‏'‏ توفيما‏':‏<br />‏'‏ أن ميخالي موروتسو الفائز بذهبية دورة سيدني ظهر بصورة غير لائقة أمام المصري تامر صلاح الذي حقق فوزا سريعا وسهلا‏..‏ وفي دورة سيدني خسر المصري طلعت أمام اليوناني ميخالي موروتسو لكن تامر صلاح كان مستعدا هذه المرة للأخذ بثأر زميله‏!'‏"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831020727/http://www.20at.com:80/article.php?sid=571"

[[comments]]
order = 1
subject = "بيب بيب كرم"
text = "لم أكن بالبيت حينما فاز كرم، وعندما عدت قلبت كل القنوات لا لأشاهد كرم ولا لأشاهد المباراة.. كنت أنتظر معشوقي .. الذي أحبه حبا جما .. وهو السلام الوطني المصري.. وللأسف لم أشاهد اللقطة إلا سريعاً على قناة الجزيرة الإخبارية التي تركت السلام يعزف لنهايته رغم أنه خبر رياضي في القناة الإخبارية وليس الرياضية..<br />والله كدت أبكي في مشهد عزف السلام الوطني..<br />وبما أن للنصر ألف أب.. أعلن أني واحد من أصحاب هذه الميدالية، فقد دعوت الله لكرم ولجميع مسلمي الدورة..<br />ولهذا أهدي هذه الميدالية إلي أسرى فلسطين المضربين على الطعام.. وإلي شهداء فلسطين والعراق، وجميع شهداء الإسلام.. وأهديها إلي مجاهدي الفلوجة وفلسطين وجميع مجاهدي الإسلام..<br />وأهديها إلي كل من يعلي كلمة الله في شتى المجالات.."
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831020727/http://www.20at.com:80/article.php?sid=571"

[[comments]]
order = 2
subject = "نقلا عن موقع الأولمبياد الرسمي"
text = "Men's Greco-Roman 96kg : IBRAHIM (EGY), NOZADZE (GEO), OZAL (TUR) 26 Aug. 2004<br />ATHENS, 26 August - Comments from medallists Karam IBRAHIM (EGY), Ramaz NOZADZE (GEO) and Mehmet OZAL (TUR).<br />Karam IBRAHIM (EGY) - gold medallist<br />On his tournament:<br />\"There is no such a thing as an easy match. The final was the most difficult match. The Georgian (Ramaz NOZADZE), although young, has received medals in World Championships.\"<br />On his medal:<br />\"Egypt has not received a gold medal in wrestling since 1928. It is nice to hear the national anthem after such an absence.\"<br />On his motivation:<br />\"What motivated me to work hard for this gold medal was that people were looking forward to see me winning.\"<br />On his love of wrestling:<br />\"I just love wrestling. I have been wrestling since I was six.\""
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831020727/http://www.20at.com:80/article.php?sid=571"

[[comments]]
