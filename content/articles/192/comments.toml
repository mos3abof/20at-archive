subject = "أبطال الاوليمبياد سيصرفون مكافآتهم كاملة دون استقط"
text = "أكد أنس الفقى وزير الشباب أن قيمة المكافأت الخاصة بوزارة الشباب للاعبين والاجهزة الفنية الحاصلين على ميداليات هى مليون جنيه للذهبية و750 ألف جنيه للفضية و500 ألف جنيه للبرونزية<br />وصرح وزير الشباب بأن قيمة الجائزة ستصرف كاملة للاعبين والاجهزة الفنية المعاونة دون استقطاعات مؤكدا أنها ستصرف فورا مشيرا الى أن تكريم الدولة للابطال يتمثل فى الجانب المادى والادبى أما تكريم المجتمع والقطاع الخاص فيعتبر تحفيزا واثابة للابداع والموهوبين وتقديرا للقدوة الشبابية وقال إن<br />رجال الاعمال تبرعوا بمبالغ كبيرة لتكريم الابطال وصل البعض منها الى 300 ألف جنيه للذهبية و200 ألف جنيه للفضية و 100 ألف جنيه للبرونزية<br />وأضاف الفقى أن الوزارة ستقوم باستقبال بعثة مصر الاولمبية بمطار القاهرة بعد غد /الاثنين/ مشيرا الى أنه يتم حاليا الانتهاء من التجهيزات والاستعدادات الخاصة بالاستقبال ليليق باستقبال الابطال مؤكدا أن هذا الاستقبال يعبر عن اهتمام الدولة والمجتمع بشباب مصر الذين يحققون الانتصارات الدولية والذين رفعوا اسم مصر عاليا فى المحافل الرياضية العالمية"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831020727/http://www.20at.com:80/article.php?sid=571"

