text = "القروج يحقق ذهبيته الثانية في أولمبياد أثينا<br />دخل العداء المغربي هشام القروج التاريخ الأولمبي من بابه الواسع عندما اقتنص ذهبية سباق خمسة آلاف متر ضمن منافسات ألعاب القوى بأولمبياد أثينا ليحقق ذهبيته الثانية في هذه الدورة بعد ذهبية 1500 متر التي فاز بها قبل ثلاثة أيام.<br />الله أكبر.. لك الحمد يا الله.. اللهم اعنا على رفعرايتك عالية دوماً يارب العالمين<br />ألف مبروك لكل المسلمين"
