[[comments]]
order = 20
subject = "نور سجين الحرية"
author = "عمرو"
posted = "2006-03-31"
text = "احنا عارفين ان ايمن نور مسجون سياسيا علي حسب اوامر العائلة الملكة<br />فرضاااا وو احتمال ضعيف مليون في المية ان نو زور<br />كل السرعة ديه في تجهيز التهمة<br />دة لو كان الحكومة نظيفة علي غير مسمي دة كان البلد ما فهاش فساد وله رجال اعمال وزراء وله حرميه كبار وو مسئولين اعدين في السلطة اكتر من 25 سنة وو بهدلوو البلد والاقتصاد ائول آيه وله آيهالبلد ماليانة بلوي<br />ظهر الفساد في البر والبحر<br />ربنا معاك يا نور انتا وامثالك حيكتب اسمكم في صفحات التاريخ بمية الذهب لكن العصابه الي بتحكم مصر في مزبلة التاريخ ان شاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125715/http://www.20at.com/article2.php?sid=150"

[[comments]]
order = 21
