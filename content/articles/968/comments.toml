[[comments]]
order = 5
subject = "الاغبياء"
author = "عبد الرحمن جادو"
posted = "2005-12-25"
text = "ايمن نور ليس الاول فى ولن يكون الاخير فى قائمة طويلة عريضه ضمت اعتقال الالاف من المصريين دون ادنى سبب الا انهم قالوا ما عجر غيرهم ان يصرحوا به وطالبوا بما ارتجفت افئدة المرضى من ان يطالبوا به جهارا نهارا؛ فكل من نادى بالاصلاح او قدم نفسه على انه بديل للسلطة يكن مصيره خلف الاسوار او يتعرض له بعض بلطجية النظام كما فعلوا مع عبد الحليم قنديل وكما فعلوا مؤخرا مع احمد منصور فضلا عن لغز الصحفى رضا هلال؛ تعرض الاخوان المسلمين للاعتقال بل وللمحاكمة امام محاكم عسكرية وقضى بعضهم خمس سنوات فى المعتقلات دون اى تهمه ؛ثم جاء تلفيق قضية ايمن نور متزامنا مع صعود نجمه السياسى ومحاولته طرح نفسه كبديل للنظام بطريقة قد نختلف او نتفق على صحتها لكنها كسرت حدود كثيرة بالتزامن ايضا مع حركة كفايه ؛وبما ان نور يتمتع بخبرة سياسية اكتسبها من تواجده بالوفد وايضا ممارسته البرلمانيه كانت قوية الى حد كبير وايضا قدرته فى الخروج بحزب يجمع شخصيات كثيرة (ربما كان انتماءها للحزب هو انتماء شرفى وشكلى الى حد كبير) الا انه بخروج حزبه للنور قد اوجد حركة جيدة رغم ما القته الحكومة عليه من تهم العمالة للخارج و و الخ,, ان الحكم على ايمن نور هو بلا شك سيصنع من نور بطلا وستزيد حالة الاحتقان فى توقيت صعب لدى الشعب الذى خرج لتوه من مسلسل الانتخابات مصابا بحالة احباط قوية سيزيدها الحكم على نور يقينا بان هذا النظام فقد عقله تماما بل واصبح الاغبياء هم صانعى الابطال حتى وان كانوا ابطالا من ورق واصبح اى ضحية هو بطل شعبى سيلتف حوله الناس وسيؤثرونه على من ظلمه وحسبنا الله ونعم الوكيل فى الاغبياء ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125715/http://www.20at.com/article2.php?sid=150"

