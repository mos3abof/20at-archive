subject = "وادي جزاة اللي يقول لا"
author = "مصري"
posted = "2005-12-25"
text = "فعلا اه يابلد محتاجة رجاله ،اللي حصل مع ايمن نور ياجماعة انذار لاي واحد يفكر او حتى يحلم يكبر او يعبر عن رايه بحريه في البلد دي البلد يعني بابا حسني وقريبا يعني جيمي بحزبه اللي ناوي يعمله وسلم لي على الجديموقراطية والحرية والاحزاب ولجنة السياسات"
archived = "2006-11-02"
