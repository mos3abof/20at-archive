author = "الثوابت الوطنية"
posted = "2009-11-18"
text = "من حق اى سياسى ان يقيم خطوط اتصال مع كافة الجهات ولكن بشروط المحافظة على الثوابت القومية والوطنية واهم الثوابت هى ان اسرائيل مغتصبة ارضا عربية ويجب ان تتركها والى ان تتركها فهى العدو الرئيسى<br />ماهى فوائد الاتصال هل لاضافة بناء او مصنع للبلد والا مجرد اتصال للكلام والرغى وعمل ضبابية<br />احنا عايزين سياسيين يتصلوا بالداخل مش بالخارج<br />سياسيين يقولوا لنا اية برامجهم للقضاء على البطالة<br />سياسيين يقولوا لنا ازاى نبنى بلدنا وما يجيبوش سيرة حاجة ممجة ومقيتة ومستهلكة اسمها جذب المثتثمرين لان البلد دى مش هيبنيها غير عيالها<br />نفسى سياسى يقول ازاى هنبنى بلدنا بايدنا احنا مش من احد جاى من برة<br />سياسة المثتثمرين فشلت فشلا زريعا"
archived = "2009-11-20"
capture_url = "https://web.archive.org/web/20091120201720/http://www.20at.com:80/masr/news/14089-2009-11-18-09-16-07.html"
