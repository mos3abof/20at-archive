[[comments]]
order = 2
subject = "اتقوا الله"
author = "الأخت الصحفية الظريفة اللطيفة اللى كتبت الموضوع....سؤال صغير: اشمعنا رحاب محمد قالت ان الموضوع مش مشكلة -و بدت وكأنها فتاة علمانية او لا يهمها أمر الدين فى الموضوع او غير متدينة او بمعنى اخر لا تضع رأى الدين فى حسبانها وعلى النقيض جاء بالمقال بعدها مباشرة ان فتاة تدعى ....شنودة قالت ان رأى الدين اساسي بقولها(اذا كان شكل البنت مقبول يبقى حرام)؟"
posted = "2006-12-26"
text = "لية اللبس والخلط ده ولية الاسمين دول بالذات؟ خلوا بالكم وبلاش فتنة طائفية."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102548/http://masr.20at.com:80/article.php?sid=1358"

[[comments]]
order = 3
subject = "توقيت ممتاز"
author = "فارس_fr"
posted = "2006-12-26"
text = "فعلا الموضوع ممتاز وشيق ومناسب جدا فى توقيته , مناسب مع النيولوك الدستورى , برضه مبارك كل يوم بيطلع لينا بلوك جديد للدستور المباركى , كل سنة وانتوا نايمين غفلانين ,,<br />مش هقولك يا ايمان ان الموضوع توقيته ممتاز ولا هو هايف ولا حاجه ولا انك معملتيش حسابك ان فيه ناس مش لاقيه تاكل ولا حاجه .....<br />ارحموناالله يرحمكمم وارجعوا لدينكم قبل فوات الاوان"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102548/http://masr.20at.com:80/article.php?sid=1358"

[[comments]]
order = 4
subject = "اللى عندة قرش محيرة"
author = "زعبلة"
posted = "2006-12-26"
text = "ناس عندها فلوس ومش شايلة هم يعملوا اللى هما عايزين يعملوة<br />تكبر طيزها تصغر بزازها<br />وناس مش لاقية تاكل العيش الحاف<br />ولا عندهم لحاف يدفيهم فى الشتا<br />وفية اطفال شوارع او اطفال ضالة على وزن الكلاب والقطط الضالة بتلف فى الشوارع جوعانة فى بلد اسمها المحروسة<br />انتظروا مزيدا من الضنك<br />هل هؤلاء الناس يدفعون ضرائب<br />لماذا ياخذون ضرائب على الملاهى ولا ياخذون من هؤلاء الناس اليسوا متخمين بالنقود<br />يابلدنا بصى لولادك بالعدل"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102548/http://masr.20at.com:80/article.php?sid=1358"

[[comments]]
order = 5
subject = "موضوع خفيف اكثر من اللازم"
author = "شريف الدواخلى"
posted = "2006-12-27"
text = "فعلا . أنا مع التنوع فى المضمون مش كله جاد .. بس الخفيف يكون بحدود .. وبصى يا استاذه<br />أولاً : الموضوع من نوعية قالت منى وأكد أحمد مش صحافة خالص خالص \" لكذا سبب : منها أنها صحافة المبتدئين يعنى انا اذكر فى بداية عملى بالصحافة فى موقع \" مصر العربية بتاع الاسبوع \" كان الديسك يقولنا انزلوا الشارع خدوا رأى المارة فى كذا وكذا .. بس كان فى كام حاجة فارقة اولا.. ان الموضوعات كانت سياسية \" آنية \" كان مهم فيها رأى الشارع \" زى موقف مصر من الحرب على العراق ..مثلاً وثانيا اننا كنا بناخد رأى الشارع \" بكل اطيافه \" مش الشباب اللى فى الجامعة \" ولو قولتيى ان الجمهور المستهدف هنا هو الشباب ها قولك بس المتلقى مش شباب بس يبقى \" انتى كده عينتك متحيزة يا استاذه \" ماشى .. وبعدين الموضوعات ديه أقرب للعملى اللى كنا بنعلمه فى الكلية فى \" صوت الجامعة\" عشان الدرجات بس<br />ثانيا: الموضوع مكرر بلا شك<br />ثالثا : بغض النظر عن كل اللى فات ده فى نقطة مهمة جدا وهى أن الموضوع مفيهوش رأى موثق يوحد ربنا \" يعنى دراسة على التجميل .. حجم ما ينفق على عمليات التجميل جملة وتفصيلاً .. وده متوافر بسهولة لاى صحفى بيدور على المعلومة بس انتى استسهلتى ... وغير كل ده فين راى الدين فى الموضوع وفين رأى اساتذه الاجتماع والنفس يحللوا الظاهرة ديه ..<br />الموضوع كلن مممكن يكون أحسن من كده لو كنت عملتى شغل فيه .. بس شدى حيلك<br />رابعا : ممكن يكون كلامة ضايقك ويمكن أنا اكون اصغر فى السن منك بس الفكرة انى اتمرمط فى الصحافة فعشان كده عرفت يعنى ايه اعمل موضوع تمام ويعنى ايه اعمل موضوع عشان اسمى يينزل بس وهاتتأكدى من الكلام ده لو روحتى أى جرنال شديد زى الدستور والفجر والاسبوع .. وارجو مكنش ضايقتك"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102548/http://masr.20at.com:80/article.php?sid=1358"

