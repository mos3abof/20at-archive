subject = "هو البنات بس الى بتغير شكلها"
author = "Max"
posted = "2006-12-25"
text = "هو موضوع لزيز جدا عشان نعرف مدى الفراغ والفضاء الى بقا موجود فى المجتمع بس هو مش موضوع اساسى هو موضوع جانبى اهميته مش ضخمة ومش محتاجنهاها دلوقتى بس اهم حاجة شغل كويس من واحد او واحدة مجتهدة عايز يعرفنا حالة مجتمعنا بس لو حاجة زى ديه تتعمل بالتصويت يبقا احسن يلا اول خطوة صحافة ربنا معاك"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102548/http://masr.20at.com:80/article.php?sid=1358"

[[comments]]
