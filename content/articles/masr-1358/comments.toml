subject = "استغفر الله العظيم.........."
author = "مصرية مهمومة"
posted = "2006-12-25"
text = "هو اساسا تغيير خلق الله حرام<br />اما اذاكان ذلك لحكمة كاصلاح عيب خلقى مثلا فقد اباحه عدد من الشيوخ<br />اما التغيير عشان نعمل لوك جديد فهو فرااااااااااغ وحرق دم"
archived = "2007-01-28"
