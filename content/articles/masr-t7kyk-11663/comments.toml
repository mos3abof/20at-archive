author = "قرفان من شغل العيال"
posted = "2009-03-23"
text = "اتنيلوا متفتكروش انكم حاجة للآتي :<br />لافكرة<br />لا دعوة<br />لابرنامج<br />لا تخطيط<br />لا هدف<br />لا مشروع<br />لا حاجة غير الشهرة وكانت مرة وصابت والتانية خابت فتنيلوا واعملوا حاجة تنفع البلد وبلاش خيبة"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422050933/http://www.20at.com:80/masr/t7kyk/11663.html"

