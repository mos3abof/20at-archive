[[comments]]
order = 1
subject = ""
author = "اكتب اسمك هنا"
posted = "2009-03-23"
text = "يا شباب بلاش اضراب<br />هى هتوقع لوحدها - لان الكل قاعد منتظر الفرقعة هتيجى من اين<br />فية فرقعة جاية<br />كل يوم فية تذمر - كل يوم فية اضراب فى جهة داخل البلد واعتصامات ودى بوادر الفرقعة<br />لا الامن المركزى نافع - واذا كان جدع يتدخل - لان الناس هتضربة وهتولع فية<br />ولا امن الدولة قادر يعمل حاجة مع المعتصمين والمضربين فى كل جهة حكومية<br />بلاش اضراب<br />طالبوا بحكومة انقاذ وطنى ودستور جديد"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422050933/http://www.20at.com:80/masr/t7kyk/11663.html"

[[comments]]
order = 2
subject = ""
author = "بنت مصرية"
posted = "2009-03-23"
text = "بإذن اللة سأشارك حتى لو لم يشترك فيةاحد وحتى لو مفيش فايدة زى بعض الاخوة السلبيين مابيقولوا لان اى فعل مهم كان صغيرا اكيد لة فائدة حتى ولو كانت بسيطة وغير ملموسة وواضحة لكنها اكيد هتأثر غدا بشكل اكبر لكن المهم ان نفعل شيء وألا نقف مكتوفى الايدى لان من يفعل ذلك فهو فعلا يستحق مايفعل بة"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422050933/http://www.20at.com:80/masr/t7kyk/11663.html"

[[comments]]
