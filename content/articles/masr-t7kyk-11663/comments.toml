author = "عاطل عن العمل"
posted = "2009-03-22"
text = "مش 6 ابريل بس هقعد فى البيت<br />انما انا قاعد فى البيت على طول<br />انما لو عايزين انزل الشارع بعصا او شومة انا جاهز<br />اطلب تلاقى - 80 مليون فدائى"
