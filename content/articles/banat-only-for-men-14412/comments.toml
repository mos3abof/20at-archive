text = "أنا بقى بنتظر أي واحد يعمل أي حركة مش ولا بد علشان أمسح بيه الأرض وأفرج عليه أمة لا اله الا الله علشان أخد حقي من الناس اللي كانت بتستغل برائتي وأنا صغيرة وكنت أخاف وأتكسف أتكلم … لدرجة أني مش بزعق وأشتم بس اللي ممكن يعمل معايا حركة كده ولا كده في المواصلات لأ ده أنا كمان بقيت أضرب وعملت كده كذا مرة واللي ضربتهم مستجروش ينطقوا .. كان الألم ينزل على وش الواحد منهم يتسرع ويتصدم وميفتحش بقه لأنه مش متوقع رد الفعل ده<br />فيا بنات متخافوش تدافعوا عن نفسكوا لأن كل واحد يعمل كده وتفضحوه وتمسحوا بيه الأرض هيخليهم يفكروا مليون مرة قبل ما يتحرشوا بأي واحدة والبنت اللي بتسكت وتضيع حقها بتخليهم يتمادوا ويستسهلوا مد الأيد والتحرش بأي واحدة"
