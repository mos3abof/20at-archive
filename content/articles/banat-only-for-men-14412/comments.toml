author = "دعـــــاء"
posted = "2009-12-16"
text = "موضوع بناء بس عامة عدم الثقة دا شئ متبادل مش من قبل المراة تجاة الرجل وانما بين كل الاطراف حتى من نفس الجنس<br />المشكلة ان الدنيا مبقاش ليها امان ابدا فى اى حاجه واللى بنسمعه وبنشوفة من حوادث على الطريق وقله الضمير<br />وحالات الاغتصاب اللى حتى مسبتش الاطفال<br />تقدر تقولى مجتمع زى دا وناس عايشة بالوحشية دى فى الدنيا دا يدي امان لبنت او لست ماشية فى الشارع او حتى فى بيتها وقفلا عليها بكام ترباس<br />المسألة بقت اكبر من كدا واكيد اللى بيحصل ليك او لغيرك مش من فراغ…"
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218065911/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

[[comments]]
order = 9
subject = ""
author = "جيمي"
posted = "2009-12-17"
text = "أعتقد أن الراجل مش متحيز لأي حد من الطرفين وبيتكلم فى نقطة محددة .. هى إنعدام الثقة والأمان وده اللى بيسبب إحراج لناس ملهاش ذنب فى اى حاجة ..<br />بدليل أنه قايل أن الناس أفتكرته أنه \" واحد من أياهم\" بما يفيد بأنه بيعترف بأن فيه شباب شغلتهم الوحيدة فى الحياة أنهم يتحرشوا ويضايقوا البنات وهو ما أنكرش ده فى الموضوع .<br />ليه بقى بنصر على أننا نخرج لموضوعات فرعية فى موضوعاتنا .. ناقشوا الحتة دى يا بنات ولا أنتوا خايفيين ."
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218065911/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

[[comments]]
order = 10
subject = ""
author = "enexenemoon"
posted = "2009-12-17"
text = "الحقيقه يا استاذ محمد رغم انى بنت الا انى بأيد وجهه نظرك تماما انا نفسى بيستفزنى وبيضايقنى جدا مناظر البنات وهى راكبه وبشوفان البنت دى لو هوى فعلا محترمه ومش عاوزه تتعاكس هتنزل بلبس من بيتها احسن من ده واكثر احتراما وحشمه<br />وبصراحه تامه<br />البنت اللى بتلبس لبس ذى ده متلمش ابدا على اى راجل يحاول يعاكسها او يضايقها<br />لكن برضه ارجو من حضرتك انك متنكرش ان فى رجاله بنقابلهم -واكيد حضرتك شفت مواقف ذى دى- بتعاكس حتى البنات المحترمه<br />لمجرد انهم ماشين فى الشارع<br />وبصراحه اكتر دى بتبقى رجاله نسيت او تناست معنى اساسى وهام جدا فى حياتهم<br />هو معنى الرجوله<br />ولا يخفى على حضرتك طبعا ان هذااللفظ يحمل العديد من المعانى التى قاربت على الاختفاء من ذكور هذه الايام<br />ده اللى بيخلى اى بنت تخاف من اى راجل بتركب جنبه فى ميكروباس وتكون عدائيه ناحيته<br />فدعنا لانلقى اللوم فى هذه العدوانيه على النساء فقط"
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218065911/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

