text = "مقال رائع جدااا وكتير مننا جدا بيشوف الحجات دى يوميا وبيتعرض ليها كمان<br />بس بجد مش بس الشباب اللى بيعملو كده<br />والله انا ادامى بنات بيعملو كده وبيلزقو فى الشباب<br />هو انا مش هاقول زيك افترضى حسن النيه ولكن متحطيش الموضوع ده فى دماغك الا لو لقيتى حاجه تدل عليه<br />المشكله مثلا انى اتحطيت فى الموقف ده اكتر من مره ومبعرفش اتصرق لانى بخاف مبيبقاش ادامى غير انى احط الشنطه فعلا او اغير الكرسى او حاجه زى كده<br />ربنا يحفظنا يارب"
