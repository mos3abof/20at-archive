text = "واضح ان الاخ جيمس معقد اوى ومش عايز يسمع غير صوته هو وبس مش متقبل اى راى يخالف رايه وده واضح جدا من ردودك الغير مقبوله بالمره على اراء الماره وده يدل انك شخص معقد و غير سوى ومحتاج انك تخضع لمعالجه نفسيه قبل ما تتكلم ولو يا سيدى مش عايز حد يعلق على كلامك او يعترض عليه ارجوك احتفظ بيه لفسك ما حدش قالك انك تعرضه على الموقع<br />واحب اسالك مادام العيب فى البنات وبس<br />! زى ما بتقول!!<br />لو قارنت زمان كانت البنات بتلبس ايه وبين الوقت الحاضر هاتلاقى ان البنات دلوقتى محترمين جدااا غير ازدياد اعداد المحجبان والمنقبات بشكل كبير اوى تقريبا كان الاول ما فيش محجبات بس بالرغم من ده كان الشباب محترم وبيحترم البنات اللى ماشيه ومابيبصش حتى عليها؟ ده غير ان عمرنا ما سمعنا ان كان فى حالات تحرش او غيره<br />يعنى عايزه اقولك ان حال الشباب اتغير للاسوا! بالرغم من ان حال البنات اتغير للاحسن!؟"
