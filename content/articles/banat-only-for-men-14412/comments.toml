author = "prenciss"
posted = "2009-12-26"
text = "والله انا مش عرفه انت زعلان ليه انت شايف انك محترم في غيرك مش محترم ومش عيب البنت تدافع عن نفسها انت خلاص محترم خليك في حالك والله الي بيحصل في المواصلات يستاهل الواحد بشيل مطوه مش شنطه وبعدين متهاجمش بقلب كده تخيل ان اختك او امك حصلها الموقف ده تحب ساعتها تعمل ايه بلاش اختك او امك خليها مراتك شوف انت ساعتها هيكون موقفك ايه وبعدين عيب اوي انك تهاجم بنت بمجرد انها اتصرفت باحترام علشان تدافع عن نفسها وتاني مره خليك في حالك"
