text = "اقتباس جيمس:<br />تصدقى يا ranranانك شكلك كدة معقدة وخلاص وماوراكيش غير انك تنتقدينى فى اى مكان فى المنتدى ده والله انا بقول راى ومالكيس فيه انتى تتنيلى على عينك فقط وتسمعى راى وخلاص وبلاش تنتقدينى وممكن تقولى رايك باسلوب افضل لانك شكلك كدة معقدة من الرجالة كلهم وهتطلعى عقدك على وانا مش ناقصك وبعدين يابنات ياملائكة هو انتم مافيكمش بنات بتتحرش بالاولاد ولاايه ولا علشان انتم ملائكة فانتم عمركم مابتغلطم ولا بتشجعوا الشباب على انهم يتحرشوا بيكم اسمعوا لو كنتم بتدوروا على حل فلازم الاول تدوروا فى نفسكم وماتقولوش حتى المنقبات والمحجبات بيتحرشوا بيهم لان كليبات المنقبات والمحجبات السكس ملت الدنيا وخلاص الشباب بقا عنده فكرة اغلبية الا بتلبس نقاب بتدارا فيه وبس وتعمل الا هى عاوزاه<br />و انت مشفتش اسلوبك فى الرد ؟؟؟<br />ما علينا انا بس عايزة أعلق على نقطة واحدة هى انك شكلك فعلا محترم بدليل متابعتك لما يسمى (كليبات المنقبات و المحجبات السكس)<br />أظن بعد كده ملكش أى حق انك تنتقد واحدة محترمة عايزة تحافظ على نفسها."
