text = "شوف يا محمد العيب مش عليك لانك زى ما بتقول معملتش حاجة و لا العيب على البنت اللى حتى لو زى ما بتقول بتدعى الاحترام لانها لابسة بودى و بتعملل حركة الشنطة المعروفة على ظهرها و هى نازلة عشان تستر نفسها بس فيها حتة لسة نضيفة و خلتها تدفس الشنطة بينكوا عشان تعمل فاصل بين جسمها و جسمك برده منلومش عليها<br />اللوم على السبب اننا بننتقل كل يوم ولاد و بنات بين بيوتنا و اى مكان سواء شغل او جامعة بعلب السردين."
