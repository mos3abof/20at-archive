text = "قبل كل الكلام البنت المفروض تسال نفسها<br />لو عايزة تحمى نفسك من التحرش والافعال الى بتماثلة يبقى<br />لية متحميش نفسك من نظرات الشباب مهى برضوا تحرش<br />تحرش بسبب مظهرك ولبثك المثير<br />وكلوا واحد الملس والنظر<br />البنت الصح القوية هى الى هتفهم ان الحرية الشخصية مش بس فى اللس والمظهر<br />لاااااااااااااا ا دا احترام لكونك بنت"
