text = "انا عايزه احكي موقف كنا في الجامعه انا واصحابي انا وصاحبتي ماشيين والولاد ورانا اتعاكسنا لما الولاد اللي معانا اتخانقو معاهم قالو ايه ده والله ماكناش عارفين ان انتو معاهم احنا اسفين<br />انا بس نفسي اسال الولاد سؤال ليه البنت لو ماشيه لوحدها بتتعاكس وممكن يمد ايده وبيقعد يبصلها ويجبها من فوق لتحت بعنيه وحاجات من دي كتير<br />ولو ماشيه معاها واحد تلاقي اي واحد معدي يحط وشه في الارض"
