text = "انا مع كل كلمة اتقالت فى التعليق على الموضوع دا وهو ان السيدة اللى حطت الشنطة بينك وبينها دى حاجة كويسة جدااا والمفروض انك تتبسط من ان دا بيحصل وتقولها اتفضلى كمان زى ماقال USAMA وانا احترمت دا فيه جدااااا انا عاوزة اسالك سؤال منيين انت بتقول انك متعاقد مع وسائل المواصلات بصفة يومية ومنيين مش بتشوف التحرش والمضايقات اللى بتحصل للبنات والسيدات فيها؟وانا شايفة ان موقف السيدة بحط شنطتها بينك وبينها مايسببلك اى احراج من اى نوع مش المفروض انها تفترض حسن النية فى كل واحد تقعد بجانبه فى الميكروباص وحتى لو انت محترم وهى عارفاك مثلا بردو لازم يكون فى مسافة ولو صغيرة بينك وبينها دا احترام منها لنفسها ودا بيسبب احراج ليها هى بتتجنبه دا مايحرجك فى شىء وليه انت شايف ان الناس اللى حواليك كلهم باصين عليك وبيتهموك وانت ليه تبص حواليك اصلا كانك عامل عاملة دانت يااخى لو مش عامل حاجة من نظرتك ليهم حواليك هيصدقو انك عامل حاجة مشينة وهل الركاب كلهم هيشوفو ها وهى بتحط الشنطة بينها وبينكبالتاكيد لا لايعقل يعنى"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106142256/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

