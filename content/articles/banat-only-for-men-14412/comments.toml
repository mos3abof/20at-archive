text = "iهو بالنسبة للاخت صاحبة الشنطة لو عملت معايا كده …<br />اقولها بكل باحترام اتفضلي اعملي اللي انتي عايزاه ويا ريت كل البنات زيك …عشان انا شاب وعارف المسخرة اللي بتحصل في الميكروباصات والزنقة والارف وعمري ماهرضى لاختي انها تكون في موقف ده<br />اما الاخت اللي كانت بتتكلم عن نظرات الشباب …فانا شاب وبقولك البنت لو ماشية محترمة ولبسها كويس جدا تفتكري الشاب هيبص على ايه …انا اسف بس العيب منكم انتو مش من الشباب<br />ماينفعش واحدة تبقى ماشية في الشارع جسمها هيطق من هدومها من كتر ضيقها وتقوللي ماتبصش …خاصة الايام دي والشباب اساسا مش لاقي يتجوز …قبل ماتحكمو فكرو كويس ولو 2دقيقة"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106142256/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

