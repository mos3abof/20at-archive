text = "لتاني مرة بقولك يا جيمس احترم نفسك و اوعى تجيب سيرة أهلي على لسانك دة .. انا محجبة ومعيدة في الجامعة و أهلي اللي انت نازل فيهم شتيمة دول ربوني وعلموني كويس وأحسن منك ميت مرة و اعرف ديني كويس واللي بيأمرني بيه .. وخلي بالك انت كدة اتعديت حدودك قوي في كلامك عليا وكمان على أهلي وانا ماسمحلكش لحد هنا ولم نفسك بقى ..<br />انا عارفة أخلاقي كويس ومش مستنية واحد زيك يرميني بالباطل وخلي بالك انت كدة بترمي المحصنات .. ولو كنت تعرف دينك صحيح وعارف عقوبة قذف المحصنات ماكنتش عمرك قولت اللي قولته دة على واحدة عمرك لا شوفتها ولا تعرفها وكل اللي انت عامله دة عشان بترد عليك وعلى اللي زيك في تفكيرهم العقيم .. كلامك ليه معنى قذر أنا مش هاقبله وانا أشرف منك ومن عشرة زيك ..<br />انا فضلت ماسكة نفسي عليك وادخل أشوف شتيمتك بعيني واقول مارودش خليكي أحسن منه طالما مستواه كدة .. لكن انك تشتمني و تشتم أهلي فانا مش هاسكتلك .. لم لسانك وخليك محترم بقى واعرف انت بتكلم مين"
