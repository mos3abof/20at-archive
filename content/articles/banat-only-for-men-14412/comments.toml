text = "عارفة ايه كل المشكلة ان الشباب شايف انه من حقه يتحرش ببنت حتى لو لابسه ضيق!!!!!!!!!!<br />و مش فاهم انها حرة زى ما هو حر يسقط بنطلونه لغاية ركبه،ايه الازدواجية دى؟؟؟<br />أتأمرون الناس يالبر و تنسون أنفسكم؟؟<br />هى ليها رب يحاسبها زى ما هيحاسبك على تسقيط بنطلونك بس انت خليك فى حالك و هى فى حالها."
