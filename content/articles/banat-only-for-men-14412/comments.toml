text = "هو صراحه فى حد ذاته موقف محرج لك اكيد لكن انت لازم تعذر الست دى لان اللى بنسمعه وبنشوفه وبنقراه يخلى الواحده بجد تخاف تنزل من البيت<br />لكن الواحد بيتوكل على الله وبيبقى فارض حسن النيه لكن ممكن بقى يجى واحد من اياهم وانا قاعده كده فى امان الله يعمل اى حاجه وساعات فى بنات مابتقدرش تتكلم بتتكسف وتتحرج فده اسلم موقف عشان تمنع انه الحاجه دى تحصل من اولها<br />وفى ناس كتير محترمه برضه والله وهما اللى بيتكسفوا يقعدوا جمب بنت فى الميكروباص او اى مواصله<br />اللى عايزه اقوله انه اكيد فيه الكويس والوحش لكن فى وقتنا ده صعب تفترض حسن النيه"
