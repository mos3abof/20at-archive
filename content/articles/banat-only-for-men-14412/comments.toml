text = "ياجماعة لازم كل واحد وواحدة يبدا بنفسه ويصلح اى عيب بيكون موجود فيه فعلا فى خلل فى المجتمع بقينا فى مجتمع مافيهوش امان كا ام بقت خايفة على بنتها وعلى ابنها الدنيا ماعدش فيها امان لالاسف ماعدش فى حد بيحب ولا بيخاف على حد بس فى ناس والله محترمة وبتخاف على ولاد الناس وبقول لكل بنت بيحصلها تحرش ماتسكتيش وعلى صوتك وماتخافيش لان الا بيعمل كدة هو انسان جبان وبقول لكل البنات ياريت اللبس يكون محترم والسلوك والكلام وبلاش نمشى ورا اى حد ونقلده لازم نفضل نحافظ على عادتنا وتقاليدنا وكل واحد وواحدة يبدا بحملة توعية فى بيته وفى جيرانه ومدرسته وجامعته وعمله لازم نبدا نغير ونتحرك وبلاش نعد نعيط لازم كل واحد مننا يبدا يعمل اى حاجة يغير بيها نفسه والا حواليه ولو عملنا كده صدقونى هنتغير وحتى نحس بامان شوية بلاش الكل يرمى غلطه على التانى لازم كل واحد واحدة يتحمل مسئولية شوية لازم نوعى نفسنا ونوعى الا حوالينا وصدقونى هنتغيير"
