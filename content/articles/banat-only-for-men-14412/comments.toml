author = "جيمس"
posted = "2010-02-14"
text = "اسمحى اقولك ياranaran انك مش مفروض اقول عليكى جاهلة لانى هشتم الجهل لو شبهتك بيه ياجماعة بعيد عن المتخلفة دى انا بقول وجهة نظرى ووجهة نظرى ان البنت المحجبة المحترمة لو حتى واحد ضايقها فبتلاقى الف واحد يدافعوا عنها ام البنت الا زلا الا اسمها ranranالا بتلبس البادى القصير والبنطلون الضيق والجيبالافوق البطن وترجع وتقول تحرش واغتصاب الا زيك ماتتكلمش لانها ماعلهاش غلط الغلط على اهلها الا سمحولها تكون كدة اى حد هيلاقى بنت لابسة لبس مش كويس وحد بيعمل فيها حاجة بييقول تستاهل وهى فعلا تستاهل لانك ماصونتيش نفسك لانك لو صنتى نفسك ربنا هيسترك ويقف معاكى لكن بقا يام جهل حبيتى تكونى اوروبية او جماعة الا موجوديين فى مصر ومش مسلمين فاتحملى الا يحصلك لانك بتقولى انا مابيهمنيش الا بتحترم بتحترم نفسها والبنت المحجبة الا بيحصل لها وهى محترمة ثوابها كبير وربنا بيعوضها ام البنت الا ماشية على حل شعرها وبتهاجم فى مخاليق ربنا وبتدعى على الناس الجهل والا جاية تضحك على عقول بنات زيك فاكيد انا اشرف واطهر منها ومن امثالها الواقحين وانا بحى كل بنت مسلمة محجبة محترمة عارفة ربنا وهى طبعا احسن منى ومن ranran"
archived = "2010-02-27"
capture_url = "https://web.archive.org/web/20100227162814/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

