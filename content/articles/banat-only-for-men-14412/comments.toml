text = "واضح ياملائكة من ان المحجبات زادم والمنقبات زادم بدرجة وواضح كمان ان اللبس الخليع اسف بوصفه باللبس وهو مش لبس دا تعرى عينى عينك ساعات اشوف اندر البنت كانه فوق الجيبة فوق البنطلون مش تحتها وكمان ابقا فى عز البرد هموت من البرد ولبس 15 بنطلون فوق بعض ودى لبسة جيب فوق الركبة لامش فوق الركبة فوق البطن وانا لبس 12 تيشرت برقبة ودى ياعينى صدرها كله طالع يشم هوا من البلكونة حرام عليكم عيب عليكم الشباب بقا بيركب الاتوبيس يدور على ضهر بنت واندر بنت باين ده فضايح وتقولى حشمة هههههههههههههه ياحشمة ياحشمة"
