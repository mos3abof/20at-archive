author = "حسبناالله ونعم الوكي"
posted = "2009-12-26"
text = "السلام عليكم الاول<br />بجد موضوع فكرنى بحجات مقرفه كتير ومش عايزه اقول غير حسبى الله ونعم الوكيل فى كل انسان مش محترم سواء بنت او ولد للاسف مابقاش فى دين ولا اخلاق وماقدرش انى ماغلطش البنات اللى لبسهم فى شىء زى مابيقولوا محزق وملزق<br />بس بجد الولد مابقاش يفرق معاه لابسه ايه والله لو لابسه خيمه بيبص وبيتكلم بجد اخر زباله انا لبست اسدال عشان اصون نفسى وقولت كده مافيش معكسات ولا هسمع كلام مش كويس<br />والله اول يوم نزلت من البيت بالاسدال سمعت كلام بجد مش بحب افتكره<br />ومرة تانيه انسان والله مايستاهل نقول عليه انسان تطاول بايديه قمة الزباله وقلة الادب لدرجة والله ماكنت قادره انزل الشارع ولا حتى اروح الجامعه من كتر القرف اللى بقيت اشوفه<br />حرااام بجد انا والله بكتب والدموع فى عنيا على الدنيا اللى مش فيها امان<br />لا والاكتر لما تيجى البنت تتكلم مافيش راجل يتحرك لا ده كمان يبصولها بصه مش تمام كانها هى اللى اتحرشت بالراجل<br />لا اله الا الله ياارب احفظنا يارب وابعد عنا ولاد الحرام"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106142256/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

[[comments]]
