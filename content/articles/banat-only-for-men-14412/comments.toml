text = "البنات بيعملو كده من كتر اللى بيشوفوه فى كل حته<br />ويا اخ جيمس انا معاك ان فى بنات لبسها مستفز جدا وماينفعش خالص بس المشكله بقت ان مفيش حد بيفرق بين اللى لابسه كويس واللى لابسه مش كويس الكل بقى بيتعاكس وبيضايقوهم بحركات مش محترمه خالص انا شفت كتير اوى منقبات ولابسين اسدالات بيتعرضوا لتحرشات فظيعه وللاسف الشباب اللى بيعاكسو البنات مابقوش بس من الولاد اللى مش محترمه او مالهاش حد يلمها للاسف ممكن تلاقى شباب من عيله وولاد ناس كويسين اوى واهلهم محترمين جدا بس بيضايقو البنات فى الشارع انا طبعا مش بعمم بس فى ناس كده فعلا"
