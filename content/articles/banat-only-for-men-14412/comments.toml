text = "وبالنسبة لصاحب التوبيك …<br />أنا مش فاهمة بجد .. انتو زعلانين قوي كدة ليه من تصرفها .. بل بالعكس .. المفروض ان البنت تغلب سوء النية قبل حسنها خصوصا في المواصلات .. هي ماتعرفش حضرتك عشان تتوقع منك انك تكون محترم !!!<br />وبعدين انت بتقول للبنات ماتتصرفوش بعدوانية !! انت محاسيسني انها مسكت الشنطة و ضربتك بيها !!!! أو ان البنات ماشيين في الشارع يقولوا يا شر اشتر !!!<br />عيب قوي الكلام دة بجد .. المفروض انك كنت تنبسط لما تشوف واحدة بتحاول تحافظ على نفسها .. مش تهاجموها كل الهجوم دة .. بس أقول ايه !! لو كنت بنت كنت حسيت .."
