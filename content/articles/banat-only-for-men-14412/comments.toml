order = 7
subject = ""
author = "Ahmed Saad"
posted = "2009-12-16"
text = "عامة انا عاوز أقول حاجة وهي إن كل واحد شخصيته مختلفة عن التاني وكل شخص له رد فعد مختلف عن التاني في اي موقف ,,, نتيجة لشخصيته أو المواقف والتجارب اللي تعرض ليها في حياته …<br />أنت لو اختك جت قالتلك انا واحد ركب جنبي النهارده وشكيت في حركاته لمجرد الشك انت نفسك حتقولها محطيتيش اي حاجه بينكم ليه او بعدتي عنه على قد ما تقدري؟؟ … مع ان البعد ده بردو حيخلي النا س تبصلو النظره دي وممكن يكون مظلوم …<br />فأنا رأيي ان في حل ممكن يكون وسط وميظلمش الطرفين :<br />البنت لما تركب مواصلة لو فكرت تحط حاجه بينها وبين اللي جانبها لأي سبب شك أو انها شافت حاجه ممكن تحطها بكل هدوووء وتلقائية ومن غير ما توجه للي جنبها اي نظرات او انه يحس بأي حاجه ممكن تحرجه كأن الموضوع عادي أو تحط الشطنه جنبها وهي لسه بتقعد من الأول بكل تلقائيه بردو وبدون أي نظرات من باب الإحتياط بسس ..<br />ساعتها محدش حياخد باله من حاجه ومحدش حيفكر في اي حاجه ونكون راضينا الطرفين ومحدش زعل من حد …<br />سوري طولت عليكو بقى … بس أعتقد ان ده اسلم الحلول يعني …"
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218065911/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

[[comments]]
