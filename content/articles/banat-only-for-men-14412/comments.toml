author = "بعرفش !!"
posted = "2009-12-15"
text = "صراحة انا مع هيك تصرف :) , ,<br />ولكن طرقة وضع الشنطة أو الكتاب أو أو يختلف يعني ممكن البنت من أول ما تفوت سيارة تحط الشنطة أو الكتاب أو يعني بدون نظراتها هاي أو تبدي أرتياح للشخص إلي بجوراها مع وضعها للشنطة بردو , لإنو صراحة هادي الحوادث وخصوصا \"التحرش\" بالسيارت الأجرة كتير كتير , فبعتقد البنت تاخد حذرها ما بيكون أي مشاكل , وبما أنك منيح من داخلك وهيك سواء حطت شنطة ما حطت أطلعت بنظرات ما أطلعت , لازم تبدي ثقتك بنفسك وما يهمك شي لإنك مش عامل شي وأنتا قاعد بكل أحترام , اما عن ظاهرة تانية فانا شاب أحيانا أطر لوضع كتاب بيني وبين بعض الفتيات لوضعية جلوس معينة منهم أو هيك منعا لكلام السواق أو بعض الناس لإنو اللوم دايما عالشب اما البنت شو ما تعمل ما فيه لوم , فوضع الكتاب مني بكون بمثابة أهانة للفتاة فعلا , لإنها بتكون مضايقاني فعلا وهي إلي المفروض الناس تطلع عليها بنظرات , من مضايقات الفتيات للشباب جلوسهم بكل راحة وأريحية وما بيهمهم وهاي مشكلة بالنسبة إلي , لإنو بالأخر الناس زي ما قلت بنظروا للشاب بعين الأتهام ومش للفتاة ,,<br />شكرا وأعذروني أطلت عليكم :)"
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218065911/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

