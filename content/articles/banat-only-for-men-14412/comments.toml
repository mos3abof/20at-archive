text = "يا جيمس افهم القصد من الكلام<br />ان الشباب مش بيفرقوا بين البنات المحترمة واللى مش محترمة البنات كلها بتتهان فى شوارعنا و محدش بيدافع عنهم بالعكس الكل بيهاجم حتى لو البنت آية فى الاحترام و ده عن تجرية شخصية مش كلام.<br />وحتى لو البنت مش لابسة محترم من وجهة نظر الشاب ده ميديلوش الحق فى محاسبتها او معاقبتها.<br />ولا انت رأيك ايه؟؟"
archived = "2010-02-27"
capture_url = "https://web.archive.org/web/20100227162814/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

[[comments]]
