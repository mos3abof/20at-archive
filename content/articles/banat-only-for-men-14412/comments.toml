posted = "2010-01-06"
text = "فعلا عندها حق واكيد اللي حصل منها ده من مواقف كتير حصلت وياما بنشوف من مواقف الشباب البايخه.\"مابتكلمش عليك طبعا\"<br />بس فيه شباب مابيفرقوش بين بنت محترمه ومش محترمه بقت سلطه<br />دى حاجه الحاجه التانيه بقي<br />انتشر اللبس الضيق بين البنات بصوره مفزعه وربنا يكون ف عون الشباب بجد حاجه تغيظ<br />حاجه تالته لبس الولاد بردو بقي مستفز بنطلون ساقط وبوكسرات باينه<br />دى دا غيير الاسترتش ولد يلبش استرتش طب ليه؟؟<br />انا شايفه اننا محتاجين حمله لاعاده ترتيب اوراقنا كشباب لان<br />حال الشباب بقي مش تمام والوضع بيسوء يوم عن يوم<br />اللهم اصلح حال اشباب امه محمد اللهم امين"
