posted = "2009-12-27"
text = "انا متهيألى ان البنت اللى حطت الشنطه جنبها المفروض كل البنات تعمل زيها والمفروض انت كمان تتبسط من كده عشان هى لو اختك انت هتتبسط من كده برضه وبعدين هو ايوه الشباب كلهم مش زى بعضهم و الصوابع مش زى بعضها بس المفروض صح انها تعمل كده بس الموقف التانى المفروض طالما هى من الاول مش عملت معاه كده خلاص ما الولد ده اكيد عنده اهل محتاجينه وطالما هى مش عايزاه يعد جنبها ليه اعدته جنبها من الاول بصراحه فى دى هى الغلطانه اوى اوى لكن الموقف الاول هى مش غلطانه خالص بالمره لكن الموقف التانى دى حاجه مستفزه منه وبعدين ده ولد عنده 16 سنه يعنى لسه صغير هيعمل فيها ايه يعنى اما الموقف التالت فالبنات برضه هم الغلطانين فيه ليه يلبسوا قصير او ضيق يبقى الشباب كده معملوش اى حاجه غلط بالعكس طالما البنات هم اللى عاملين كده يبقى هم اللى عايزين كده مالها يعنى اللى لابسه واسه محترمه فى شكلها وفى منظرها وسورى مش باين منها اى حاجه ليه البنات متلبسش واسع والبنات اللى لابسين ضيق ومحجبات كمان كده هم بيسيئوا للحجاب اللى هم لابسينوا وكمان بيسيئوا لدينهم كمان برضه ماله اللبس الطويل؟ حتى محدش يبص على اللى البنت لابساه وشكــــرا"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106142256/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

