posted = "2010-02-14"
text = "اقتباس جيمس:<br />تصدقى يا ranranانك شكلك كدة معقدة وخلاص وماوراكيش غير انك تنتقدينى فى اى مكان فى المنتدى ده والله انا بقول راى ومالكيس فيه انتى تتنيلى على عينك فقط وتسمعى راى وخلاص وبلاش تنتقدينى وممكن تقولى رايك باسلوب افضل لانك شكلك كدة معقدة من الرجالة كلهم وهتطلعى عقدك على وانا مش ناقصك وبعدين يابنات ياملائكة هو انتم مافيكمش بنات بتتحرش بالاولاد ولاايه ولا علشان انتم ملائكة فانتم عمركم مابتغلطم ولا بتشجعوا الشباب على انهم يتحرشوا بيكم اسمعوا لو كنتم بتدوروا على حل فلازم الاول تدوروا فى نفسكم وماتقولوش حتى المنقبات والمحجبات بيتحرشوا بيهم لان كليبات المنقبات والمحجبات السكس ملت الدنيا وخلاص الشباب بقا عنده فكرة اغلبية الا بتلبس نقاب بتدارا فيه وبس وتعمل الا هى عاوزاه<br />بطل تشتم يا زفت الطين انت ياللي اسمك جيمس واحترم نفسك .. انا سيبتلك المواضيع اللي مصّر تتكلم فيها ومارضيتش أرد عليك هناك وساكتة وكل شوية أقرا اللي كاتبه وأقول مش هارد لأني ماعجبنيش اسلوب الحوار يوصل للدرجة الحقيرة دي .. بس لحد كدة بقى واحترم نفسك واعرف حدودك كويس واتعلم تتكلم بأدب يامتتكلمش ودة يبقى أحسن"
archived = "2010-02-27"
capture_url = "https://web.archive.org/web/20100227162814/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

[[comments]]
order = 53
subject = ""
author = "Nounna0"
posted = "2010-02-14"
text = "طيب تقدر تقولى محدش بيتكلم ليه لما يلاقى ولد مسقط البنطلون لحد ركبته؟؟؟و ملابسه الداخلية كلها طالعة برا؟؟؟<br />ولا هو مجرد تبرير لأمراض نفسية؟؟<br />يعنى الأولاد (على حد قولك) يتابعوا الأفلام الخليعة و تطلع عقدهم على البنات؟؟<br />أكيد مش بقول أن البنات كلهم محترمات، بس ميرضيش ربنا أن لبسى (مثلا) يكون مطابق لشروط الزى الاسلامى و الاقى واحد مريض يتحرش بيا بالكلام أو الفعل، طيب اعمل ايه اكتر من كده؟؟<br />و ده عن تجربة شخصية.<br />و الأسوأ بقى موضة الفرجة على أفلام خليعة فى المواصلات العامة يعنى أكون قاعدة فى أمان الله و الاقى واحد بيتفرج على حاجات زى دى و لما أعترض يقولى هو انا جبت جمبك؟؟؟<br />والله الدنيا بقى فيها مرضى اكتر مما تتخيل.<br />و علشان مطولش أكتر من كده هقولك بس تسأل واحدة من أهل بيتك على اللى بيحصلها فى الشوارع من (كلاب السكك) يعنى أختك أو أمك أو حتى زوجتك.<br />و لو مش مصدقنا أكيد هما هيفهموك الفكرة."
archived = "2010-02-27"
capture_url = "https://web.archive.org/web/20100227162814/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

