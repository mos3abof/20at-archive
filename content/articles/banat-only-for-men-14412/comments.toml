text = "بداية احييك على الموضوع عشان واضح انك خدت وقت كتير فى كتابته دانتا يمكن تكون مسحت زراير الكيبورد بتاعتك و فى الآخر ماستفدناش حاجه غي انو واحد جديد جاى يستنكر افعال البنات … بس انا ليا اعتراض على رايك فى البنت اللى بتشد البادى او غيره انتا ايه اللى يحشرك و يخليك تبص عليها احنا ملنا ياعم ماللى عايزه تشد تشد واللى مش عايزه براحتها انا عايز افهم حاجه هوا لو اللى نازل من الاوتوبيس دا ولد انتا هاتبص عليه ولا هاتفرق معاك هوا لابس ايه ولا بيعمل ايه - احنا ليه مابنخليناش فى حالنا - معلش انتا اللى بتدى للفرصه للبنت تعمل حاجات غريبه قدامك لان انتا بتتعامل معاها باسلوب مختلف … و على فكره ليا استنكار على حاجه بيعملوها البنات و هيا الشكوى يعنى المنظر كان بيبقا رخم قوى لما بنت تنده للدكتور فى المحاضره و تشتكيله من اللى قاعد جمبها ما يا ستى لو غلط فييكى ارزعيه بالقلم وخلاص و متسيبيش حد يعاملك على انك ضعيفه و محتاجه مساعة دكتور عمرك شوفتى ولد بينده على دكتور و بيقولو الولد دا ولا البنت دى اتنيلو عملوا اى حاجه ماهو مدام البنت خرجت من البيت لازم تبقى قويه كفايه انها تشيل مسئولية نفسها يااما ماتخرجش"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127083432/http://www.20at.com:80/banat/only-for-men/14412-2009-12-15-11-15-11.html"

