text = "اه وبالنسبة للحركة الاستفزازية اللي حضرتك بتقول عليها وهي شد البنت للبادي …<br />عارف .. بجد ضحكتني هههههههه<br />فكرتني بنفس الحركة الاستفزازية اللي كلنا للأسف بنشوفها وبقت منتشرة بين الشباب ..<br />يسقط البنطلون على الأاااااااااااا ااخر ويلبس عليه تي شيرت طويلة .. وطول مايجي يتحرك ولا ينزل من الميكروباص يقعد يشد فيها لحسن *****<br />احنا البنات والله العظيم تلاتة بنتكسف من المناظر دي وبنغض بصرنا ..<br />فا ياريت قبل ماتنصح البنات \"بتظبيط\" لبسهم .. انصح بني جنسك الأول .. دة لو انت عايز الدنيا فعلا تتظبط"
