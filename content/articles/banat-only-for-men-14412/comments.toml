text = "0 (25) ranran 2010-01-04 / 11:15 اقتباس جيمس:<br />الكلام الا بتقوله الدكتورة ده مش صحيح لان عذرية البنت لو ضاعت حتى لو ماكانتش فى ممارسة فانها يوم الدخلة بتبان انها مش بنت بنوت وبعدين الزوج ماهوش طب شرعى علشان يعرف انها مارست ولالالا<br />——————————————————————————————————————————ranran<br />والنبي الأخ جيمس يروح يتركن على جمب و احتفظ بأرائك لنفسك<br />ولما العلم يتكلم انت تسكت و تخليك في حالك .. هتفهم أكتر من دكتورة اصلك !!!!!!!!!!!!<br />وبعدين انت ايه اللي مدخلك هنا أصلا؟!!!!!!!!<br />ماتروح تشوفلك حاجة مفيدة تعملها بدل الفضول و التدخل في اللي مالكش فيه !!!!!!!!!!<br />كلام الدكتور صح جدا .. الرجال المتخلفين فقط هم من يعتقدوا أن عذرية البنت هي مجرد غشاء .. العذراء هي اللتي لم تقم بالعلاقة الحميمة من قبل ————————————————————————- اظن ده كلامى وده كان ردك ياranran اظن انى مغلطش فيكى وانتى يامثقفة الا شتمتينى بالتخلف مع انك انتى الا متخلفة"
