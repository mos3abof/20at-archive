text = "لا طبعا انا افضل سوء الظن حتى يثبت لي العكس ويقول الشاعر \"سوء الظن عصمة وحسن الظن نقمة\"<br />ثم ان الرجال كلهم خونة ومالهومش أمان الا من رحم ربي يعني ممكن نقول بنسبة 20% وانا ايش دراني اني هقابل واحد من الكويسين ؟؟؟؟<br />ياعمي البلد سكانها كتير وال20% دول عاملين زي اللي بيدور على ابرة في كومة قش"
