text = "انا بقا اسمعى لابرمى محصنات ولا اصلا اعرفك من اساس ولا اعرف اهلك ولايهمنى معرفة انتى مين ولا عاوز اعرف عنك اى حاجة وانتى بصى لنفسك كدة فى كل حتة فى المنتدى ده انتى الا بتهاجمينى من الاول مع انى مابغلطش فى اى بنت محترمة وبتكلم عن نوعية معينة من البنات ولو انتى زى مابتقولى معيدة وربنا كدة يعنى كدا ادالك علم مادهوش لواحد جاهل زى كنتى فهمتى انا بتكلم فى ايه وبقول ايه ومتهيئلى مافيش اى بنت محترمة هتزعل من كلامى لانى مابوجهش كلامى الا للنوعية فاسدة نوعية مقلدة كل شئ قذر اوعى تهاجمى كدا على طول لازم تتانى فى كلامك ورد فعلك وبلاش كل ماحد يقول راى مش عاجبكم تعملوه جاهل اسمعوا من اى حد وفكروا ايه المشكلة مابتخديش براى ولا تعملى بكلامى الجاهل ياستى طالما انا بتكلم عن البنات الا بتلبس لبس مش كويس وانتى ىزعلانة اوى كدا انا بقول راى كواحد عادى لاانا معيد ولا هعيد ولا عاوز ابقا حاجة فى اى حاجة بس قولتى راى وهسبلك المنتدى ليكى وماعدتش داخل هنا فى اى مكان هنا تانى"
