capture_url = "https://web.archive.org/web/20061102112508/http://www.20at.com/article2.php?sid=415"

[[comments]]
order = 9
subject = "مبروك و مش مبروك"
author = "خالد"
posted = "2006-02-11"
text = "الف مبروك طبعا للمنتخب المصرى و عقبال السنين الجاية بس فى حاجة لفت نظرى اوى فى الماتش اللى هى وجود رئيس الجمهورية فى الماتش و بعدين بيدى الكاس للكابتن حسام حسن غريبة مش كدة؟ اصلى احنا ماشوفنهاش طلع بقرار او بذم او حتى باى نحاضرة او كلمة لنصرة الرسول صلى اللة علية وسلم و لا حتى شوفناة طلع ينعى اهل اسر الضحايا فى العبارة اياها دة<br />و السؤال هو لية كدة؟ هل الكرة و الفوز بكاس فرحتة هترو السنة الجاية لو خسرنا اهم من ارواح الناس اللى راحت هدر دة؟ و ماحدش عاقب المسؤلين؟ و لا احنا رئيسنا تافة اوى للدرجة دة؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112508/http://www.20at.com/article2.php?sid=415"

