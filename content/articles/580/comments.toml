subject = "خلاص فرحنا.. ياللا بينا على الجد"
author = "mody kody"
posted = "2006-02-11"
text = "الحمد لله ومليون مبوك على مصر كلها..<br />لكن أنا شايف إن أحنا منطولش في الفرحة..<br />يعني هو كفايه النهاردة..<br />علشان احنا ورانا شغل كتير..<br />أوعو تكونوا نسيتو!!!<br />مش أحنا قلنا هنتعلم سيرة الرسول صلى الله عليه وسلم.. وهنخطط أزاي ننصره.. وهنحارب الفساد اللي في البلد .. وهنحاول نعرف الغرب مين هو الرسول بتعانا صلى الله عليه وسلم..<br />مش كده ولا إيه؟؟؟؟<br />يالا بينا على الجد"
