posted = "2006-02-12"
text = "أنا متهيألى ان أنا الوحيد اللى فى مصر كان بيتمنى ان المنتخب ما يكسبش الكاس .... ممكن تقول عليا أهبل ومجنون ومعنديش انتماء بس ولا ه هو ده احساسى .. عارفين ليه . عشان اللى ما يتسموا خلصوا على الفرحة اللى عندنا . حتى الكورة يا بنى ادمين مش سيبنا نفرح بجد فيها .. لازم المنظرة بتاعتهم . عمرهم ما يسبولنا حاجة عشان ننفس فيها عن اللى فينا .. فى مباراة قبل النهائى لما كسبنا ، الأغنية اللى بعد الماتش كل اللى كان بتصوره عيال الرئيس زى مايكون مصر ما فيهاش حد يطلع فى الصور غيرهم .. أيوة ماهو المحروس ابنه جيمى بيلمع نفسه عشان يمسكنا ، على أساس إن إحنا العزبة بتاعت ابوه .. يارب إرحمنا منهم وخلصنا منهم"
