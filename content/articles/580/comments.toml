subject = "بمووووووت في كابتن احمد حسن"
author = "والله وعملوها الرجالة ورفعوا راس مصر..."
posted = "2006-06-21"
text = "مصر بلدنا اللي عمالين تقولوا عليها كلام المفروض انه ميتقالش من المصريين..<br />المهم مبروك لمصر ولكل الناس ولأجمل لاعب مصري الكابتن احمد حسن اللي جاب لوحده تلت اجوان مصر في البطولة (4 اجوان) واتبرع بنص مكافأته لمحمد اللي نجا من العبارة.. ياريت نقدر ان لاعيبتنا عملوا حاجة ويستاهلوا كل خير .<br />اجمل تحية مني لكل مصري ومصرية ولكابتن احمد حسن والحضري."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112508/http://www.20at.com/article2.php?sid=415"

[[comments]]
order = 27
subject = "مصر المنصورهميت عنتر"
author = "محمد صلاح الدين عبد السلام هلال"
posted = "2006-09-05"
text = "مبروك للكابتن حسن شحاته وايضا للعيبة الكبار مثل (ابوتريكة وعماد متعب وأحمد حسام ميدو وأحمد حسن و عبد الظاهر السقا{بلدياتي وجاري وصديقي }وعصام الحضري ومحمد شوقي و وائل جمعه و حسن مصطفي و عمر ذكي و محمد بركات وعبد الواحد السيد وحسام حسن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112508/http://www.20at.com/article2.php?sid=415"
