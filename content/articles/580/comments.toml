order = 17
subject = "متى نفرح"
author = "مسلم"
posted = "2006-02-12"
text = "أحد الاخوة يقول : الا تفرحون ؟!<br />نفرح إذا الامة تخلصت من الطغاة ، وتنفست نسائم الحرية<br />نفرح إذا الامة بنت دولة المؤسسات ، القائمة على الدستور ، والشفافية.<br />نفرح إذا الامة تختار حكامها وتحاسبهم إذا قصروا ، بل وتنزع الامر منهم ، إذا اقتضى الامر.<br />نفرح إذا احرزت الامة قصب السبق في ميادين الصناعة ، والابتكار والابداع.<br />أما اليوم ، فلا يحق لحر قد استعبدأن يفرح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112508/http://www.20at.com/article2.php?sid=415"

