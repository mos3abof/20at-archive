text = "على اللى ماتوا فى العبارة<br />على اللى ماتوا فى السجن<br />على الدعارة والسرقة<br />وهز الوسط<br />يا بلد تملها طبلة وتفرقها عصاية<br />ارقصوا انتم والحضرى بتاع كفر البطيخ<br />وتوز فى اساتذة الجامعه والعلم والبحث والتقدم<br />المهم ان شعار المرحلة ارقص<br />يا شعب طيب<br />بكره ترقص زى ركاب العبارة لما رقصوا عشان ارضية السفين كانت سخنه<br />يا ترى الطفل اللى اهله ماتوةا حضر الماتش ولا ملحوقش يوجهوا له الدعوة<br />وصبح تاتا"
