subject = "الوطن بقى زبالة خالص"
author = "اه والله"
posted = "2006-02-11"
text = "يعنى لم وبقى موضوه قديمة<br />11شحط لابسين شورت بيجروا ورا كوره يقولك مصر والوطن<br />والوطنية<br />نسوا ان الفرعون استغل ده فى صالحه<br />نسوا ان البلد جعانه<br />وعطلانه<br />ومفيهاش فلوس<br />وان الحرمية وكلينها<br />نسوا ان الاعبيين بيلعبوا عشان الاحتراف والمكافات<br />نسوا ان بعد الدور الاول طالبوا زيادة النسبة على الاعلانات 0( المصرى اليوم )<br />نسوا ان مصر بلد مفيهوش صناعه<br />ولا زراعة<br />ضحكوا عليكم بالكرة<br />فى واحد عريان وجعان وشحات ربنا رزقه ب 100 جنيه بدل ما يجيب بيهم ملابس داخلية<br />يروح يلون وشه بيهم ويهز علم مصر<br />ويهز ...............<br />الف مبروك لمصر<br />والعب يا حضرى ارقص يا جمال مبارك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112508/http://www.20at.com/article2.php?sid=415"

