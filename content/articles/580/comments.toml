text = "الف الف مبرووووووووووك لكل المصريين<br />والله لعيبة مية مية والحمد لله على الفوز لانة كان صعب اوى العالم دى كلها تمشى وهية زعلانة \"الحمد لله\"<br />وبقول للناس المكتئبة اللى فوق دى اييييييييييييييييييية مش عرفين تفرحوا شوية انتو اللى نسيتو يعنى اية فرحة!!<br />ومالة لما نقول ارقص يا حضرى وارقص يا جمال وارقص يا شعب مصر كلة<br />\"ارقص يا حضرى\"<br />\"ارقص يا حضرررى \"<br />\"ارقص يا حضرررررى \"<br />\"ارقص يا حضررررررررى\"<br />\"ارقص يا حضرررررررررى \"<br />\"ارقص يا حضررررررررررى \"<br />\"ارقص يا حضرررررررررررررى\"<br />\"ارقص يا حضررررررررررررررررى \"<br />\"ارقص يا حضررررررررررررررررررى \"<br />\"ارقص يا حضررررررررررررررررررررى\"<br />\"ارقص يا حضررررررررررررررررررررى \"<br />\"ارقص يا حضررررررررررررررررررررررى \""
