[[comments]]
order = 1
subject = "حاجة جميلة"
author = "عبد الله"
posted = "2006-02-11"
text = "حب الوطن حاجة جميلة وسنة عن النبى علية الصلاة و السلام ( عندما خرج من مكة قال و الله انك لأحب البلاد الى قلبى ) بس الأولى كنا نزعل على سب النبى زى ما فرحنا بفوز مصر ، حاجة جميلة ان مصرنا تفوز بكأس افريقيا ونفرح فرح كبير علشان هى مصر وننسى ان هناك اسر مصرية زعلانة بفقد احبائها وفلزات اكبادها على فكرة انا اكتر واحد فرحان بفوز مصر بس المفروض اننا منظهرشى بالمظهر دة مراعاة للأهالى الحزينة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112508/http://www.20at.com/article2.php?sid=415"

[[comments]]
order = 2
subject = "في بعض الاحيان ننسى نبص لنص الكوب المليان"
author = "أكرم"
posted = "2006-02-11"
text = "يا جماعة المنتخب ورجالته كانوا قد المسئوليه و عملوا الوحوش احسن عنوان للي حصل لاننا كسبنا بالروح و العزيمة مش بالفن و اللعب و الهندسة و بعدين احمد حسن كابتن المنتخب بعد جدو حسام حسن كان اول من تبرع بمكافأة الفوز هو اللاعبين لضحايا العبارة و كمان اخدوا الولد الصغير اللي ابوه و امه ماتوا ( تغمدهم الله بالرحمه ) لمعسكر المنتخب و قعد معاه اغلب الوقت<br />ليه دايما متشائمين على طول يا اما فرحانيين فرحه طاغية<br />بص لنص الكوب المليان و الفاضي كمان يعني خلي نظرك 6 / 6"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112508/http://www.20at.com/article2.php?sid=415"

