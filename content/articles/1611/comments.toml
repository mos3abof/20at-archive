[[comments]]
order = 0
subject = "يابختهم"
author = "في صمتك مرغم"
posted = "2006-06-22"
text = "صراحة مش حالهم بس اللي \"يأطع الألب\"<br />احنا كمان حالنا بقى وحش خالص, وده لاننا قبلنا بكده من الأول, لاجئين عددهم بيزداد كل يوم, وبرده عباس البذيء هيعمل استفتاء على شرعية وجود اسرائيل وحقها في طردنا, هدى والاف غيرها اتشردوا وفي كتير ماتوا, وبرده عباس الدنيء هيعمل الاستفتاء<br />\"ومن تأخر أخره الله\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150716/http://www.20at.com/article2.php?sid=977"

[[comments]]
order = 1
subject = "اللجوء الى الوطن"
author = "رائد بغدادي"
posted = "2006-06-22"
text = "أعانهم الله هذا هو مايدفعه شعب الشهداء نتيجة المرتزقة والعملاء الذين باعوا الوطن بثمن بخس فوالله ياأخت مرفت كل العرب الشرفاء وكل المسلمون الشرفاء يدفعون ثمن ذلك فمن لم يأتيه الدور فسيأتيه دوره ولاعجب فأنهم يحسون بالغربة في أوطانهم التي أضحت سجادة وطأتهم احذية الغزاة وهم يظنون انهم بلدان امنه بالأمس كانت فلسطين واليوم بغداد وغدا على العرب السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150716/http://www.20at.com/article2.php?sid=977"
