[[comments]]
order = 0
subject = "حسبى الله ونعم الوكيل"
author = "ابراهيم فوزى"
posted = "2006-12-29"
text = "بسم الله الرحمن الرحيم وبه نهتدى ونستعين<br />اما بعد 000<br />الموضوع المطروح من اخطر المواضيع اليوم<br />لأن الزهر الشريف اصبح اداة لتحقيق بعض الاغراض السياسية فقط دون الدينية وهو الدور الاهم المفروض ان يقوم بة الأزهر الشريف"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127114930/http://masr.20at.com:80/article.php?sid=1307"

[[comments]]
order = 1
subject = "هذا هو الأزهر الشريف"
author = "ماجد الطيب"
posted = "2007-01-07"
text = "سيظل الأزهر الشريف منارة العلم ، ولو كره المبطلون.<br />ومن البلايا نقل الفتاوى هكذا،دون التحقق منها، ودون ذكر تفاصيل الفتوى أو الفتوى كاملة من أولها الى آخرها ، مما يجعل الكثير يفهم فهم خاطىء.<br />وأقول: اذا أفتى أحد علماء الأزهر المعتمدين المؤهلين للفتوى ، وكان على خطأفله الأجر ، ولا يحق لأحد أن يستهزىء ويقلل من شأنه.<br />وبالنسبة لوصف فضيلة الشيخ/ على جمعة الجماعات المتطرفة الذين يستحلون دماء الأبرياء ويثيرون الفتن ، فلا يكفى وصفهم بالأوباش.<br />ووصفه لبعض الاعلاميين بما وصف ، أرى أنه يوجد هذا الصنف ( بعضهم ) ، والكل والواقع يشهد بذلك"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127114930/http://masr.20at.com:80/article.php?sid=1307"
