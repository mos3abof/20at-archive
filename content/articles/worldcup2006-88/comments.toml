[[comments]]
order = 4
subject = "تصريحات"
author = "طارق حسن"
posted = "2006-07-31"
text = "واليكم بعض تصريحات الفريق البرازيلى بعد المباراة النهائيه<br />رونالدو:بعد رحله احترافى الفاشله فى ريال مدريد ساتجه للعب للزمالك المصرى لاتوج رحاتى الكرويه<br />روبينيو:انهزمنا نفسيا قبل بدء اللقاء<br />روماريو: احمل المدير الفنى الخسارة فقد تسولت مشاركه منتخب بلادى دون جدوى<br />رونالدينهو:لم اكن استحق الطرد والاعب ابراهيم سعيد لاعب مستفز وشاذ فقد قام اكثر من مرة بادخال يدة داخل شورتى من الخلف اثناء سير المباراة مما دفعنى للكمه حفاظا على شرفى وذلك اثناء تجول الحكم البلتاجى فى منطقتنا وقام باشهار الكارت الاحمر فى قفايا<br />وهناك ايضا تصريحات الابطال المصريين بعد اللقاء<br />عمرو سماكه: سابدا من جديد مع فريق كهرباء طلخا وسانطلق منه نحو العالميه<br />مدحت عبد الهادى :ساترك شهواتى وابداء من جديد وساتخذ من عقدى الجديد مع فريق كفر الدوار طوق النجاة<br />ابراهيم حسن:الدهن يا جماعه فى العتاقىوبصفتى اكبر عتقى فى مصر اعلن ان امامى عشر سنوات اخرى فى الملاعب و15 سنه لحسام اخى"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074713/http://worldcup2006.20at.com:80/article.php?sid=88"
