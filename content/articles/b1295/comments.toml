[[comments]]
order = 0
subject = "ايحاء منه فيه"
author = "مزعج"
posted = "2006-10-01"
text = "واللة فعلا الموضوع ده حلو<br />انتوا بتجيبوا الكلام الجامد ده منين<br />بس لو كده عندكوا حل يخليلى اشفى بالايحاء من أم عباس حرمنا المصون !<br />إلى الامام ياشيرى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112816/http://www.20at.com/article2.php?sid=1295"

[[comments]]
order = 1
subject = "صح"
author = "نيفين نيفى نوفا"
posted = "2006-10-01"
text = "فعلا يا جماعه ثبت عميا صحه اكلام دا فى حالات مرضيه كتير<br />وحتى لو فشل الايحاء فى انعدام وجود المرض بينجح على الاقل بانه يسكنه لفتره<br />كمان قوه الاراده ممكن تخلى شخص عمره ف الدنيا شهور مثلا يطول و يبقى سنين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112816/http://www.20at.com/article2.php?sid=1295"
