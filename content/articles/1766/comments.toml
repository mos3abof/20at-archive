[[comments]]
order = 1
subject = "..& لا يساوى الصدق الا الصدق &.."
author = "..& هيكل الأزهرى &.."
posted = "2006-08-31"
text = "اولا احييكى جدا على اختيارك للموضوع دا يا نورهان ربنا يكرمك .. احب اقول ان الموضوع ككل فعلا مميز ورائع ولأسباب مش مش بقول اشادة والسلام , اول الأسباب انه فعلا بيحصل رغم اننا كتير جدا بننكره , انا ليا وجهة نظر مختلفة جدا عن الأخ كازانوفا اللى بحب اسمه وبختلف على كلامه لأنى لما ربنا يكرمنى واحب انسانه معينة ودى سايبها على قضاء ربنا وقدره مش انا اللى هسعى للشىء داإنى فعلا اصارح حبيبتى بمعظم تجارب حياتى ومن خلال صدقى اللى هيا فعلا حاساه اكيد هتبقى معايا صادقه معايا واحب اقول كلمة لاى مهتم إن الصدق او الصراحة هما واحد بس مختلفين فى اللفظ مفيش اجمل منهم فى اى شىء والله مهما كانت الصراحة صادمة بس بجد اروع الف الف مرة من اى خداع مهما كان وفعلا احيانا عشان كدا احب اقول لكل مهتم عيش بالصدق عيش بالتسامح عيش بالحب لكل الناس صدقنى دى اهم خطوات الحياة .. واجدد شكرى للأخت الجميلة نورهان على موضوعها المحترم الجميل ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152736/http://www.20at.com/article2.php?sid=1164"

