text = "........ والله الي ماضيه سيئ اكيد مستقبله اسوا فمثلا الفتاة الي لها علاقة جدا حميمة مع شاب هايت مثلها وعمل معها الاعاميل وش تسوي ليلة الدخلة ماينفع معها صارحت او ما صارحت مكشوفة ....... والفتاة ماتثق بالشاب الي له ماضي مغبر والفتاة ايضا ... فكيف سيثق الشاب في تربية ابنائة ويتطمن على مستقبلهم"
