[[comments]]
order = 3
subject = "الماضى والدين"
author = "وفاء &وليد"
posted = "2006-09-04"
text = "الماضى انه لموضوع مهم تقع فيه الفتيات اول الأرتباط الرسمى واعتقد ان الأخت التي قالت ايش عم تسوي ليلة الدخله اعتقد ان الحديث عن الماضى المراهق وليس الماضى المؤلم الذي تحدثتي عنه فهذا الأمر سينكشف فعلا اذا لم تقول الصراحه للاهل اولا ولكن الدين يتحدث عن الماضى ليس بهذا المعني ولكنى اعتقد والعلم لله ان الأمر يتعلق بالعلاقات البريئه التى نخطأ فيها ايضا ان الله يجعل سترا علي العبد فيصبح مستورا واذا ذهب وقال لقد حدث كذا وكذا ففضح نفسه ففضحه الله .<br />ولذلك يعد الموضوع من دروب المجاهرة بالذنب وليست الصراحه ان تعترف الفتاة عن الماضى ولكن في ان تخلص للحاضر ولا تحلم بالماضى ابدا واذا كان الشاب متخيل ان الأعتراف يزيل الماضى من داخل الفتاه فذلك وهم .<br />وإن النفس لأمارة بالسوء وسوف يحدث موقف ليغير النفوس ولحظتها سيتذكر كذا وكذا فلنخلص دون تشويه ماضينا بكاءا فيه على الأطلال."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152736/http://www.20at.com/article2.php?sid=1164"

[[comments]]
order = 4
subject = "لو اختك"
author = "وفاء &وليد"
posted = "2006-09-04"
text = "اخي كازانوفا:الموضوع ليس كما تقول اعرف اصلها. الأصل هم الأهل وإذا كانت هناك علاقه مع شاب قبلك فهل ستحاسبها علي ماضى لم تكن انت قد ولدت في حياتها ياكازانوفا ان الله لا يسأل العبد بعد الأسلام عن ذنوبه ليغفرها له ولكن المغفرة عن كل مامضى دون تميز ذنب عن ذنب وان الله غفور رحيم وهل لنا نحن العباد ان نحاسب بعضنا كفانا همومنا فلا نزيدها في هراء عن الماضىولو هذة اختك ومش لازم اختك بالدم صدقنى سوف تنصحها بالنسيان وفتح صفحة جديدة في يوم مشرق بالحب والأستقرار."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152736/http://www.20at.com/article2.php?sid=1164"
