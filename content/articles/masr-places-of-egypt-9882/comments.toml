order = 0
subject = ""
author = "مش احمد القطب ولا شريف الدواخل"
posted = "2008-08-16"
text = "يا اخت هبه عاشور<br />اشمعنى يعني اختارتي الثلاثة اشياء دول<br />1) شرب السيجارة<br />2) ينام في الشارع<br />3) يتسول<br />الا يوجد اخطار اكثر من ذلك من وجهة نظرك [ *** ]حية بتعرضي قضية خطيرة مثل هذه<br />المفروض في عرض قضية خطيرة مثل هذه نذكر على سبيل المثال وليس الحصر<br />يعني مثلا تخطفه عصابة وتعلمه السرقة<br />او عصابة مخدرات ويتعلم شرب وتجارة المخدرات<br />او يلتقطه مثلا والعياذ بالله انسان ما عندوش رحمة ويستخدمه جنسيا في اللواطه مثلا<br />هذه ثلاثة اشياء خطيرة المفروض ان تكون تواجه اطفال الشوارع والمفروض ان تتصدر موضوعك كموضوع خطير يواجه اطفال مثل اطفالنا<br />اتعلموا ازاي تكتبوا<br />سلام يا هبه عاشور"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202121357/http://www.20at.com:80/masr/places-of-egypt/9882-2009-06-10-17-52-23.html"

[[comments]]
order = 1
subject = ""
author = "هايدي"
posted = "2008-08-16"
text = "ميرسي لالك هبة على هاد الموضوع بس ياريت تسمعوني وتعطونا (للبنات)طرق علاج وتأهيل ل الشباب الي ما بحلوا عن مدارس البنات لانو بصراحة بدهن اعادة تأهيل وتربية اخلاقية لانون وسخوا سمعت المدارس …(حبيبه بعيد عنكن)..ههههه …ازا بتريدو اعطونا طرق غير التطنيش …وغير البوكس الي بلمهن …<br />بلييييييز شباب ما تزعلوا لانو الحكي مو للكل<br />مع تحياتي :هايدي سنفورة بس كتير امورة"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202121357/http://www.20at.com:80/masr/places-of-egypt/9882-2009-06-10-17-52-23.html"

[[comments]]
