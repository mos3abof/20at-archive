text = "ربنا يكتر امثالكم ولاالله الاالله ورعاكم الله لما تبذولون من مجهودات جبارة مع تلك الفئة احمايتها من الانجراف فى حياة الشارع وهدى الله منجيبهم وهداهم اليهم وانا اعتز بإطلاعى على موقعكم اتلمرموق وسأكون من اول الزائرين لاماكن تواجد هاؤلاء الاطفال لاساعدهم واساعدكم وسوف ابدأ بشارع الخليفة المأمون مارا على كوبرى عباس"
