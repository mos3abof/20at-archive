posted = "2008-08-17"
text = "السلام عليكم جميعا…جد انو كلام الاخ صحيح لانو مو بس هاي هيه المشاكل الي بس بيتعرضلها اولاد الشوارع لا في اخطر من هيك متل ما ذكر اخونا لازم تتناولوا بمواضيعكوا الامور الاكثر اهمية حتى نقدر نجدب المساعدات وهي الامور وحدها ما بتكفي …ومرة تانية يسلم لسانك يا اخ (مش احمد القطب)..<br />مع تحياتي :هايدي"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202121357/http://www.20at.com:80/masr/places-of-egypt/9882-2009-06-10-17-52-23.html"

