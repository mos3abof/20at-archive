subject = ""
author = "عيد"
posted = "2008-08-16"
text = "5نعم التلمذة الصناعية هى الحل لهؤلاء الاطفال فبجانب الايواء والطعام والمتابعة يجب الحاق هؤلاء الاطفال بورش حكومية او قطاع خاص يتعلم من اوسطى قديم المهنة التى يميل اليها كنجار موبيليا او ميكانيكى سيارات او لحام ضغط عال او يشغل ماكينة نسيج اوسباك او حداد مسلح<br />اذا اكتسب مهنة ضمنا لة باب رزق<br />اما نرعاة فترة ثم عندما يكبر نطلقة الى الشارع مرة اخرى فسينضم الى عصابة او يسرق ويكون من زوى السوابق"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202121357/http://www.20at.com:80/masr/places-of-egypt/9882-2009-06-10-17-52-23.html"

