order = 1
subject = ""
author = "انت كنت فين ؟"
posted = "2010-03-04"
text = "هو مش سيادتك كنت النائب لرئيس الهيئة ومدير التشغيل فيها - كانت فين الرؤية بتاعتك<br />والا كنت بتقول تمام يا افندم واؤمر معاليك<br />مش سيادتك كنت من القيادات السابقة<br />كنت فين يا صاحب الرؤية المنفتحة<br />والا التجديد والرؤية بتاعتك هتشمل تغيير المكاتب وتبديل المكيفات والسجاد<br />يا عم روح الهند واهى بلد فقير زينا وشوف عملوا اية فى السكة الحديد بتاعتهم<br />وانقل ما فعلة الهنود بالمسطرة<br />انا رحت الهند وشفت القطارات بتاعتهم اللى بتنقل عشرات الملايين فى اليوم وزى الساعة<br />ولا تبدأ من الصفر زى عادة المصريين -كل واحد ييجى يرمى البلاوى على اللى قبلة ويهد ويبدأ من الصفر<br />روح الهند<br />نصيحة"
archived = "2010-03-08"
capture_url = "https://web.archive.org/web/20100308103851/http://www.20at.com:80/masr/news/15590-2010-03-04-12-29-27.html"
