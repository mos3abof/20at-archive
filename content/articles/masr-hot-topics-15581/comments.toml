order = 8
subject = ""
author = "بنـــت مصـــر"
posted = "2010-03-09"
text = "على فكرة لو كل واحد هيدخل يقول هو مع مين او ضد مين او مين وحش او حلو يبقي مصر هتفضل على حالها و هتفضل كده<br />بس ربنا ميزنا بالعقل و طالما في عقل يبقي ندور بينا في اللى هيقيم العدل لانه اساس الملك<br />مش لازم كل مرشح يقول هو هيعمل ايه لمصر<br />المهم احنا دورنا ايه نعمله و نغيره في نفسنا و في البلد<br />العيب مش من حاكم مافيش حاكم هيشوف بلده بتضيع و يسيبها<br />لاء العيب فينا احنا مش فالحين غير في الكلام و بـــــــــس عمرنا ما قولنا و عملنا كل واحد يدخل يقول تعليق ياريت يبقي رئيس جمهورية نفسه يفكر هو هيعمل ايه عشان يغير مصر و يبداها من بيته و جيرانه و حارته و هكذا<br />يارب حد يوافقنى<br />انا عموما بغير مصر و بداتها من شارعنا و ان شاء الله هتوصل للمحافظة و كان الله في عون الجميع من حكام و محكومين"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309095724/http://www.20at.com:80/masr/hot-topics/15581-2010-03-03-16-41-45.html?utm_source=facebook_ads&utm_medium=masr&utm_campaign=nafsyt-elbaradi"
