subject = ""
author = "مليش في السياسه ولكن"
posted = "2010-03-07"
text = "يا جماعه اسمحولي اقول راي انا مليش في السياسه وكل الي بتقلوه حلو انا بدرس علم نفس<br />بس لازم تعرفوا ان السياسين قبل مابقولوا حاجه او يتصرفوا اي تصرف بحسبوا الف حساب ليه<br />انا نفسي اهم من التحليل النفسي اهتم اه الخطه الي عايز يعملها<br />سمعت في احد القنوات انه عايز اول حاجه لما يكسب الانتخابات انه يلغي الدين الاسلامي من مصر والله اعلم<br />بالله عليكم يا امه المسلمين ده يرضيكم<br />اتاكدم قبل مترشحم حد انه بجد بيحب البلد مش بيحب المنصب وبس"
archived = "2010-03-08"
capture_url = "https://web.archive.org/web/20100308161805/http://www.20at.com:80/masr/hot-topics/15581-2010-03-03-16-41-45.html?"

