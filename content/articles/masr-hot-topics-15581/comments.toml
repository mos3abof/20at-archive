text = "مصرى راجل زينا مربى شنبة زى الرجالة ومش بيصبغ شعرة زى النسوان ولا بيحط مكياج يخفى صفار الموت اللى على وشة<br />راجل مصرى على طراز سعد باشا زغلول وراجل محترم مش راجل هفأ وبيتحرك فى وسطنا بسيارة عادية مش مدرعة"
