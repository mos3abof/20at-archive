author = "ال محى الدين"
posted = "2009-10-14"
text = "من ايام انقلاب العسكر فى 52 وبعد طرد الملك وكان من الثورجية البكباشى خالد محى الدين والبكباشى زكريا محى الدين مع البكباشى جمال عبد الناصر<br />ثم ظهر لهم ابن عم ايام السادات اشتغل ر ئيس وزراء مصر فترة من الزمن اسمة الدكتور فؤاد محى الدين<br />ثم فى العصر الحالى جاء لنا محمود محى الدين وزيرا للاثتثمار الراسمالى<br />والغريب<br />ان خالد محى الدين يحمل فكر شيوعى لان المرحلة كانت تتطلب ذلك<br />وزكريا محى الدين امريكى الهوى<br />وفؤاد محى الدين كان وسط<br />اما شبل عائلة محى الدين الجديد وزير اثتثمار مصر فهو متخصص فى البيع<br />وعقبال عيالكم لما يورثوكم"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019070738/http://www.20at.com:80/masr/2khbar/13708-2009-10-14-07-56-48.html"

[[comments]]
