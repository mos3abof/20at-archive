author = "لعب عيال"
posted = "2009-10-14"
text = "من الاول ومن ساعة ما اعلنوها من لجنة الحزب اياة<br />كل الناس قالت لعب عيال<br />والعيل بيغير كلامة كل شوية<br />مش ممكن مصير بلد يقعد شوية عيال وكانهم بيلعبوا اتارى او بلاى استيشن يقرروا مصير اقتصاد بلد فقير وعلى حافة الجوع<br />كان فية دكاترة اقتصاد زى القيسونى وغيرة عارفة البلد دى فيها اية"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019070738/http://www.20at.com:80/masr/2khbar/13708-2009-10-14-07-56-48.html"
