author = "محمد نواف الحمدالله ..."
posted = "2007-12-21"
text = "الشهيد / غسان كنفاني .. رجل حمل على أكتافه هموم فلسطين وشعبها .. رجل تحدى الصعاب والعوائق والصعوبات لكي يصل إلى مبتغاه .. رجل ضحى وبذل الغالي والنفيس ليحيا شعبه بعزة، بشرف، بكرامة ..<br />رجل أضحى اليوم تحت تراب القبر مدفون .. اغتالته إيدي المخابرات الإسرائيلية ( الموساد ) بكل برودة دم وبلا هواده أو حتى شفقه ورحمه !!<br />رجل لا ولم ولن يكن في يوم من الأيام محور ضعف أو حتى أن يحس بهذا الإحساس !<br />رجل مكلل بالعزم، بالإصرار، بالتحدي، بالتضحية، بالشرف، بالنصر والعزة والكرامة، ..<br />عذراً ياغسان .. يا ابن فلسطين البار .. فالكلمات لاتوفيك بحقك !!<br />أنت إنسان عصفت به الأيام والشهور والسنين !<br />إنسان ذاق مرارة وتعب وشقاء السنين الطوال !<br />إنسان \" الله وحده \" يعلم كيف عاش طفولته البريئة !<br />إلى روحك الطاهرة يا غسان .. أنت موجود في قلب كل فلسطيني وعربي .. أنت شعلة من النور والحرية لن تنطفئ .. أنت<br />رجل مواقف بحق وحقيق .. إنك لطالما كبرت فينا حب وطننا \" فلسطين الحرية \" .. وكيف الدفاع عنها يهون إذا بذلنا أروحنا سبيلاً لرفعتها ومجدها وعروبتها الشامخه !<br />أبو فايز وليلى .. أطفالك جعلهم الله في حضن والدتهم الصابرة المحتسبة .. سوف يكبر هؤلاء الأطفال في يوم ما .. وسوف يعرفون من هو والدهم .. وسوف يمشون في شوراع فلسطين مرفوعين جباههم للأعلى وعيونهم قوية لاتخشى نظرات الناس لهم .. وكانوا أشداء صامدين .. وسوف يقول الناس حينها .. \" اللي خلف مامات ياغسان ؟! \"<br />* ومضــــــــــــ ــــــــــه عجبتني في إحدى كتب الروائي الكبير القدير / غسان كنفاني : \" لو لم تكن الحياة حزينة .. لما ولدتنا أمهاتنا .. ونحن نبكي .. \""
