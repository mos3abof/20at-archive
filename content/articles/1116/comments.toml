[[comments]]
order = 1
subject = "حد آلك ما تحبش يا خوي"
author = "هزازة البزازة"
posted = "2006-05-09"
text = "وإيه اللي دخل كل المجموعة اللي حضرتك بتحبها في الموضوع حب يا خويه زي ما تحب وربنا يحشرك ويحشرهم ويحشرنا مع المصطفى في الجنة بس الموضوع حلو ومشاركتك برة الجون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132457/http://www.20at.com/article2.php?sid=785"

[[comments]]
order = 2
subject = "عندك حق"
author = "مسلمه"
posted = "2006-05-09"
text = "الحقيقه انا حاسه بمعانة كل الشباب والله<br />لكن الحق عليهم وعلى اهلهم اللى بيخلوهم يشتركو فى القنوات دى<br />لكن برضو انا بقول ربنا معاهم ومعانا احنا كمان<br />بصراحه البنات كلها بقت تقلد<br />هتعمل ايه مهى خايفه وشايفه كمان الشباب عملة ايه فيهم هيفا وروبى<br />على الموم ربنا معان<br />اللهم اهدى شباب المسلمين اللهم اهدى فتيات المسلمين<br />اللهم استر بنات المسلمين<br />اللهم احفظنا واحفظ ..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132457/http://www.20at.com/article2.php?sid=785"

[[comments]]
order = 3
subject = "غريبة دي!!!"
author = "Pumpkin"
posted = "2006-05-09"
text = "بصراحة قصة غريبة، في أجزاء مش مفهومة أوي وعندي إحساس إنها متآكلة وكان ممكن تكون أحسن من كده مليون مرة...<br />معلش يا أخ بس بجد نوع القصص ده بيبقى مفيهوش أي عنصر إثارة ولا أنا مستنية حاجة تحصل و أكيد النهاية متوقعة... طفي التلفزيون ونام... كانت حتبقى جامدة مووت لو كان في تكملة بعد النهاية التقليدية دي...<br />حظ سعيد المرة الجاية..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132457/http://www.20at.com/article2.php?sid=785"

