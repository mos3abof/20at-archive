posted = "2006-05-10"
text = "أحبتي العشرينيون.. ومن حام حولهم<br />أسعدتموني بجد بتعليقاتكم ونصائحكم التي ستكون بإذن الله محط الفكر والنظر<br />واحب اشكر كل الذين أشادو بالقصة اياها رغم انها عادية جدا.. وكذلك اعتذر للذين لم ترو غليلهم مثل الأخت(pumpkin)فقط وددت لو فصل لي الإخوة والاخوات جوانب نقدهم للقصة حتى أستفيد من ذلك في مستقبل الأيام<br />لكني سعيد جدا بهذه المشاركة الأولى في موقعنا الجميل .. عشرينات.. واعتبر هذه القصة رغم تواضعها مجرد عربون صداقة لكل أحبة عشرينات<br />ونلتقي معكم دوما.. يحملنا الود ويحدونا الصدق<br />أشكركم : اخوكم كاتب القصة حسام من السودان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132457/http://www.20at.com/article2.php?sid=785"
