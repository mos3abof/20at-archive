subject = "ماكس الدجال"
author = "ابو كيرلس"
posted = "2006-07-19"
text = "اناوكل قبطي في الاردن نقول البابا شنودة يامليح يلي اختارك المسيح للاقباط وعلي كل قبطي ذهب الي ماكس مشيل يعتبر ذهب الي المسيخ الدجال في يوم القيامة هذا دجال وليس معترف فية في طائفتنا القبطية الرب يحفظ ليتا حيات البابا شنودة الثالث<br />ابو كيرلس"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090919/http://masr.20at.com:80/article.php?sid=611"
