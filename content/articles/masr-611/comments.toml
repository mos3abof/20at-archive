[[comments]]
order = 7
subject = "برافو أبو شريف"
author = "عابر القارات"
posted = "2006-07-05"
text = "برافو لأخ أبو شريف على رده الهادئ العاقل و أنا كمسلم أرجو من أخوانى المسلمين عدم الكتابة فى هذا الموضوع لسبب بسيط أننا كمسلمين بيخفى علينا كثير جدا من جوانب الدين المسيحى و طبعا هذا بسبب عدم تعمقنا فيه أو حتى إحتكاكنا المباشر بالحياة الدينية المسيحية و يجب الكتابة فقط للرد على منهم مسئ للاسلام أو غير الفاهمين له كما تدخل اخى ابو شريف و خصوصافيمايتعلق بقضية جوهرية مثل إستحداث كنائس و خلافه و ذلك إتقاءا لشر الفتنة و غلقا لأبواب جهنم يريد أعداءانا لو حتى نفتح منها ثقب لنكتوى بنارها عفنا و عفاكم الله"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090919/http://masr.20at.com:80/article.php?sid=611"

[[comments]]
