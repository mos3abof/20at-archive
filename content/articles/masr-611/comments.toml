[[comments]]
order = 10
subject = "وصمة عار"
author = "كيرلس"
posted = "2006-07-12"
text = "السادة الأفاضل<br />ان موضوع الأب مكسيموس هو وصمة عار على جبيننا منذ بدايتها وستظل الى ان تنتهى سواء بكسره او فوزه وذلك للأتى : -<br />1 - كيف وجد هذا الرجل فى بلادنا هل هو حقا انقسم على البابا شنوده؟ درب من الخيال فهل اذا قام جندى بالجيش بخزعبلات نقول ان هناك انقلاب فى الجييش؟ ان الأنقسام معناه قيام كبار القاده واجتماعهم واعلان التمرد .. فهل تمردت الكنيسة على البابا شنوده..<br />2- هدايا الغرب وعطاياه واغداقاته لهذا الرجل .. هل حقا هناك هدايا؟ اذا كانت هناك هدايا وعطايا هل دخلت بلادنابارادتنا ورضانا ام عنوة وقصرا؟ ان بلادنا حرة لا تقبل القهر او العنوة .. وايضا مصرنا عزيزة لا تقبل الرضوخ او الأستكانه؟ اذن فهى واحدة من اثنين لا ثالث لهما<br />أ - زوبعة سرعان ما تنتهى وتنفض<br />ب - مؤامرة على بلادنا ولابد من التصدى لها بكل الطاقات والأمكانات.. اما ان كنا بنعمل بالمثل البلدى اللى بيقول بلدك بتخرب ياجحايرد يقول مدام بعيد عن بيتى انا مالى... نبقى بنعمل زى النعامه الى بتدفن راسها فى الرمل عشان ما تشفش الصياد....وعلى رأى فؤاد المهندس<br />مش كده والا ايه..<br />كيرلس"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090919/http://masr.20at.com:80/article.php?sid=611"

[[comments]]
order = 11
subject = "قبطية"
author = "قبطية"
posted = "2006-07-15"
text = "الاخ اللي مش عارف اي حاجة بتاع (واحد عارف النصاري عايزين ايه) ..<br />الكلام اللي انت كتبه ده شغل عيال .. ده إيميل بيبعتوه الناس لبعض على لسان الشيخ الغزالي في كتاب قذائف الحق .. بس الحقيقة ان الراجل لم يملك تسجيلا ولا اي شيء وان فيه واحد نصاب ضحك عليه وورطه والراجل نفسه اعتذر فيما بعد عن كتابة الخرافات غير المنطقية دي ..<br />فياريت لو عندك رد من دماغك تقوله .. وبلاش تنقل لنا كلام سمعناه ألف مرة ويمكن اكتر كلام معاد وسخيف ولا يصدقه سوى الجهلة والبلهاء لانه اصلا مناف للمنطق والعقل"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090919/http://masr.20at.com:80/article.php?sid=611"

[[comments]]
