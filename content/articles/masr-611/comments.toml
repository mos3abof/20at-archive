[[comments]]
order = 0
subject = "ليه هدايا الغرب اقروا شنودة بيقول ايه"
author = "واحد عارف النصاري عايزين ايه"
posted = "2006-07-04"
text = "خطاب ألقاه البابا شنودة في الكنيسة المرقصية الكبرى في اجتماع سري أعان الله على إظهار ما وقع فيه ...<br />نقدم لسيادتكم هذا التقرير لأهم ما دار في الاجتماع :-<br />بعد أداء الصلاة و التراتيل طلب البابا شنودة من عامة الحاضرين الانصراف ولم يمكث معه سوى رجال الدين وبعض أثرياء الأسكندرية ، وبدأ كلمته قائلاً :<br />\" إن كل شىء على ما يرام و يجري حسب الخطة الموضوعة لكل جانب من جوانب العمل على حدة في إطار الهدف الموحد \" ، ثم تحدث في عدد من الموضوعات على النحو التالي :<br />أولاً : شعب الكنيسة<br />صرح لهم ( أي شنودة ) أن مصادرهم ـ في إدارة التعبئة و الإحصاء ـ أبلغتهم أن عدد المسيحيين في مصر بلغ ما يقارب الثمان مليون(8.000.000) نسمة ( هذا الكلام في عام 1973 ) ، و على شعب الكنيسة أن يعلم ذلك جيدًا ، كما يجب عليه أن ينشر ذلك و يؤيده بين المسلمين ، إذ سيكون ذلك سندنا في المطالب التي سنتقدم بها إلى الحكومة التي سنذكرها لكم اليوم . و التخطيط العام الذي تم الاتفاق عليه بالإجماع و الذي صدرت بشأنه التعليمات الخاصة لتنفيذه ، وُضع على أساس بلوغ شعب الكنيسة إلى نصف الشعب المصري ، بحيث يتساوى عدد شعب الكنيسة مع عدد المسلمين لأول مرة منذ 13 قرنًـا ، أي منذ (( الاستعمار العربي و الغزو الإسلامي لبلادنا )) ـ على حد قوله ـ ، و المدة المحددة وفقًـا للتخطيط الموضوع للوصول إلى هذه النتيجة المطلوبة تتراوح بين 12 ـ 15 سنة من الآن .<br />و لذلك فإن الكنيسة تحرم تحريمًا تامًا تحديد النسل أو تنظيمه ، و تعد كل من يفعل ذلك خارجًـا عن تعليمات الكنيسة ، و مطرودًا من رحمة الرب، و قاتلاً لشعب الكنيسة ، و مضيعًـا لمجده، و ذلك باستثناء الحالات التي يقرر فيها الطب و الكنيسة خطر الحمل أو الولادة على حياة المرأة ، و قد اتخذت الكنيسة عدة ق<br />اقرأ بقية التعليق .."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090919/http://masr.20at.com:80/article.php?sid=611"

[[comments]]
order = 1
subject = "كفايه بقى"
author = "قبطى مصرى جدا جدا"
posted = "2006-07-04"
text = "إيه المشكلة لما يبقى فى كنيسة موازية و يبقى فى حرية إختيار مش لازم كل حاجه جديدة نهاجمها مش لازم نشوف على الواقع مساوءها و إيجابياتها و بعدين نحكم و بعدين إيه المشكلة من التجديد الناس أصبحت مبرمجه على القديم و بعدين معلش يعنى موضوع البابا شنوده انه يحكم لوحده طول المدة دى كلها و يتحكم فى مصير ملايين و ما يحلش موضوع شائك زى موضوع الطلاق طول السنين دى كلها و كل يوم بتزيد مشاكله أفقد البابا شنودة بعض من محبيه من الشعب و خلاهم يدوروا على قشه تنقذهم من وضعهم اللى هما فيه و خصوصا انهم لا عارفين يتجوزوا و اغلبهم مصاحب و طبعا ده وضع مش كويس ... أنا اسف على صراحتى بس حبيت اعبر عن رأى يمكن يكون مخالف عن عامة الاراء دلوقتى"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090919/http://masr.20at.com:80/article.php?sid=611"

[[comments]]
order = 2
subject = "جبت الكلام ده منين"
author = "مسيحي مصري"
posted = "2006-07-04"
text = "الاستاذ اللي كاتب اسمة (واحد عارف النصاري عايزين اية) والحج اللي كاتب اسممة \"قبطي مصري جدا جدا\"<br />جبتوا الكلام ده مين هل في عند اي حد فيكوا اي اثبات علي الكلا ده الاول اللي عارف النصاري كويس بغض النظر عن كل كلمة قلتها لو انا قلت دلوقتي ان شيخ الازهر اتفق مع بعض الجماعات الارهابية علي قتل النصاري بعد ماصلي التراويح وهو اللي حط الخطة أو ان مفتي الديار المصرية اللي كل يوم يصدر فتوي جديدة من خيالاته من غير دليل ممكن اقلب المسيحين علي المسلمين بكلمة واحدة بس انا دلوقتي بس عايز اسالك سؤال واحد فقط<br />هل عندك دليل اثبات واحد فقط واحد فقط او علي الاقل التاريخ بتاع الاجتماع اكيد ماعندكش يبقي تقعد ساكت وبلاش نشر كلام مالوش لازمة مممكن يثير فتنه علي الفاضي<br />أما الاستاذ بتاع انهم \"انهم لا عارفين يتجوزوا و اغلبهم مصاحب و طبعا ده وضع مش كويس \"تعرف حد مصاحب ولا الاسلام هو اللي قال مثني وثلاث ورباع وما ملكت ايمانكم وجواز الليلة الواحدة أ كما يطلق علية البعض جواز المتعه بس ده تعاليم الدين الاسلامي فده العادي يعني ربنا يعنكوا<br />انا اسف لان كلامي كتر عن المألوف بس حسيت ان كل اللي عنده مسرحية عايز يألفها ويحطها تحت موضوع بتاع قس منشق بتحصل وأنت عايز تفهمني مش كل يوم يطلع شيخ يتكلم كلام مالوش لازمة زي بتاع ارضاع الكبير اللي اتعرض علي برنامج هاله شو الراجل اتمسخر صعب عليا بصراحة واللي كان قاعد قدامة بتاع القرأن بس والاحاديث كلعا خطاء<br />تقدر تحت موضوع ذي ده<br />لو فضلنا نخبط في بعض بالمنظر ده الناتج النهائي هيكون اللي كلنا عايزنه لمص مش هايتم<br />كلامي دلوقتي موجه للمسئولين عن الموقع ارجو حزف الموضوع نهائيا من علي الموقع رجاء حتي لا يتحول هذا الموضوع الي صفحة للسب والقذف ارجو حذفه واشكركم"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090919/http://masr.20at.com:80/article.php?sid=611"

[[comments]]
order = 3
subject = "لك مني كل الاحترام"
author = "واحد عارف النصاري عايزين ايه"
posted = "2006-07-05"
text = "اولاَ:تاريخ كلام (البابا) شنودة مارس 1973 وأتمني ان تتحقق من صحة هذا الحديث إلا لو عندك نسخة منه, ثانياً:الأخ قبطي مصري واحد مسلم لأن كلمة أقباط ديه مش معناها النصاري بس دول سكان مصر قبل الفتح الأسلامي العظيم ودخلوا في الإسلام يعني إحنا كلنا اقباط علشان بس محدش يقول ان الاقباط(اللي هما النصاري) أصحاب الأرض والكلام الفاضي اللي بنسمعه اليومين دول, مع ده كله انا احب اوجه لك تحية علي كلامك, وعايز اقولك مفيش واحد مسلم حقيقي ممكن يقول ارفعوا السلاح ضد النصاري او ضد المدنيين إحنا دينا دين تسامح, الحوش اللي انت بتكلم عنهم دول لازم تقول عنهم كده لأن هما اللي وصلوا الاسلام لإنك تتكلم وتقول الكلام بتاعك, موضوع الجواز يأخي انت زعلان ليه ربنا مدينا الحق ده, انا مش طائفي ولا ادعوا لها علي الاطلاق بس المقال هزني جداً وارجوا ان تقوم باثبات ان النصاري ليسوا هم الطائفيون بتأكيد نفي المقال السابق ."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090919/http://masr.20at.com:80/article.php?sid=611"

[[comments]]
order = 4
subject = "تعدد الزوجات"
author = "ابو شريف"
posted = "2006-07-05"
text = "علي الرغم من عدم إقتناعي للمقالات التي يتم نشرها وتتعلق بالمسيحية أو الإسلام ويقوم بالفتوى فيها اي شخص سواء كان مسلم او مسيحي وبدون علم او دراية مما يعمل علي تأصيل الفتنة الطائفيه داخل البلد الواحد وهذا مايدعو اليه اعداء مصر ... وانا كمسلم معجب جدا بموقف البابا شنوده من عدم زيارته للقدس بسبب وجودها بين الإسرائيليين وأعتقد ( وأوقول اعتقد) أن ما تم مؤخراً فعلا يندرج تحت بند هدايا الغرب وذلك من اجل ايجاد بديل له يعترف بالوجود الإسرائيلي في القدس أما من حيث الإجراءات فالأخوة المسيحيين أعلم بها مني إن كانت صحيحة أم خاطئة ، ولكن بالنسبة للأخ الكريم الذي ينكر علي الإسلام وجود تعدد للزوجات وزوجة لليلة الواحدة أولاً يا أخي الكريم لايوجد في الإسلام زوجه لليلة الواحدة أو زواج المتعة وهو تم تحريمه وكون انه يوجد من المسلمين من يقوم بتحليله فهذا مثله مثل المسيحي الذي كان يطلب مال من أجل جلب صك الغفران بدعوى ان الذين يدخلون الجنة هم من يحملون ذلك الصك لكن لايوجد فتوى اسلامية تبيح زواج المتعة أما تعدد الزوجات فقد أحلها الله سبحانه وتعالي وذلك لمنع الفاحشة في حالة مرض الزوجة او عدم انجابها فيكون من حق الزوج ان يتزوج بأخرى أو عدم إكتفاء الزوج بأمرأة واحدة من الناحية الجنسية وأمور أخري فمنعا من حدوث زنا او صداقة او مصاحبة تتم ذلك في اطار شرعي وفي نفس الوقت اكد الله سبحانه وتعاله علي ضرورة العدل بين الزوجات يعني الموضوع مش سايب ... فيا اخي الكريم هذا افضل مايحدث في الغرب من ان تجد عروس تتزوج وابنتها الغير شرعية تحمل شمعة الزواج ... هل الزواج الشرعي افضل ام الزنا ... الأخوة المسيحيين يحالون حاليا ان تسمح لهم الكنيسة بالطلاق حتى يستطيعوا الزواج مرة أخري ويحيوا بطريقة طبيعية فأيهما افضل يا اخي الكر<br />اقرأ بقية التعليق .."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090919/http://masr.20at.com:80/article.php?sid=611"

[[comments]]
order = 5
subject = "ردود"
author = "كفايه كده"
posted = "2006-07-05"
text = "أنا بس عايز أعلق على الكلام اللى بيتقالز<br />أولاً موضوع الإجتماع السرى بتاع البابا وموضوع تحديد النسل:ياريت ماحدش يروج إشاعات... تقدر تجيب دليل أو تسجيل للكلام ده ولا ده كلام سمعته وبتردده بس... وبعدين أنا طول عمرى وانا متربى فى الكنيسه وعمرى ماسمعت الكلام ده.<br />ثانياً موضوع الأسرار السبعة: الكنيسة الأرثوزكسية قايمه على الأسرار السبعة(الزواج, التناول, التوبة والإعتراف,...).<br />ثالثاً الأخ المسيحى اللى بيقول ليه نرفض التعدد وبيتكلم عن الديمقراطية: انا أشك انك مسيحى ولو كنت فعلاً تبقى انت مش عارف حاجة فى كنيستك و مسيحى بالإسم بس، البابا ده اختياره من عند ربنا (تقريباً زى ما المقال بيقول) مش بترتيب بشرى أو بفكر أرضى، وعمرها ما حصلت فى تاريخ الكنيسة (لو انت عارفه) ما حاجة زى كده نجحت... حتشوف ربنا حيتدخل إزاى فى الموضوع ده... لأن المسؤل عن الكنيسة هو ربنا اللى بيحميها.<br />أخيراً: أظن ان احنا عندنا مشاكل فى البلد وفى حياتنا هنا أهم وأخطر محتاجين نتكاتف عشان نحلها بدل ما نقعد ننقد فى أديان بعض.<br />شكراً"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090919/http://masr.20at.com:80/article.php?sid=611"

