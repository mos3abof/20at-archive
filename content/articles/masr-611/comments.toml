subject = "لمن سأل عن هدايا الغرب"
author = "shereen"
posted = "2006-07-06"
text = "المقصود بالغرب هو الكيان الصهيونى و التمويل الامريكى<br />أما فيما المسيحية فانا لا اختلف معك فى ان المسيحية تقوم على المسيح نفسه ولكن الاسرار السبعه هى ركائز هذا الكيان بتأسيس من شخص المسيح ذاته وانا هنا اخص بالذكر الطائفه الارثوذكسيه .اما ما ذكرته فهى رأى الطائفة البروستانتية فى الاسرار"
