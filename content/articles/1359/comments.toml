[[comments]]
order = 1
subject = "زيزو..لو شوه شوه دى فرنسى"
author = "نيفين"
posted = "2006-04-29"
text = "يعنى زيدان دلوعه الفرنسيين<br />اللى بيحبو زيدان يودعوه ف المونديال السنه دى<br />و يستنى ماتش الاعتزال الاسطوره اللى هيحضره جاك شيراك بنفسه<br />انتو بتتكلمو ف ايه يا جماعه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142838/http://www.20at.com/article2.php?sid=745"

[[comments]]
order = 2
subject = "معتقلو كفاية وصحفيون يرفضون التحقيق معهم أمام نيابة أمن الدولة لعدم دس"
author = "اللهو الخفي"
posted = "2006-04-29"
text = "رفض المعتقلون من حركة \"كفاية\" والصحفيون الذين القي القبض عليهم أثناء مناصرتهم في الشارع للقاضيين المحالين لمجلس الصلاحية ، رفضوا التحقيق معهم أمام نيابة أمن الدولة لعدم دستوريتها وطالبوا بانتداب قاضي تحقيق عدا الصحفي ساهر جاد.<br />وكانت قوات الامن قد فرضت حسارا مشددا على نقابتي المحامين والصحفيين ونادي القضاة ، واعتدت بالضرب على المئات من المتظاهرين بالقرب من مبنى دار القضاء العالي يوم أمس الاول الخميس اثناء مثول المستشارين هشام البسطويسي ومحمود مكي أمام لجنة الصلاحية برئاسة المستشار فتحي خليفة والتي انتهت بالتأجيل إلى جلسة 11\\5\\2006 وهو التاريخ الذي يسبق خروج المستشار خليفة ومعاونيه بالمجلس الاعلى للقضاء من مناصبهم أول يونيو المقبل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142838/http://www.20at.com/article2.php?sid=745"

[[comments]]
order = 3
subject = "زيزو"
author = "ملجد"
posted = "2006-05-06"
text = "ويش اقول بعد مااصبحت لعيب تعتزل في هذا<br />السن حرام<br />ماذا اقول خساره حسافه<br />كل هذا ما ينفع<br />بعتقادي انك اصبحت افضل لاعب افضل من رونالدينهو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142838/http://www.20at.com/article2.php?sid=745"

