[[comments]]
order = 15
subject = "السنة هي الاساس"
author = "مهتمه"
posted = "2006-08-30"
text = "السُنة هي الاساس ، الرسول - صلى الله عليه وسلم - كان يدعو على من يعتدي على المسلمين ، وهذا حدث في القصة المكعروفة في غزوة بدر ، وحدث عندما اعتدت احدى القبائل على حفظة القرآن ، فهل نحن ارحم من الرسول - صلى الله عليه وسلم - ؟ بالتأكيد ، اليهود المحاربين ، قوم معتدون لا يستحقون فقط الدعاء عليهم ولكن يستحقون القتل ، والحب والرحمة وكل الالفاظ الرقيقة لا يصح بحال من الاحوال ان توجه اليهم او عنهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123617/http://www.20at.com/article2.php?sid=1151"

[[comments]]
order = 16
subject = "لا إله إلا الله"
author = "شهداء فلسطين ولبنان"
posted = "2006-09-06"
text = "كل امام لا يجرئ على السب أو الدعاء على اليهود فهو غير مؤهل للكلام مع المسلمين أو دعوتهم أو التحدث بأسمهم وعيب على كل من يستخدم الدين لتحريم وتحليل ما يريد مثل ما حدث في كثير من الدول الاسلامية التي لها وزنها الديني وكلمتها على المسلمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123617/http://www.20at.com/article2.php?sid=1151"

[[comments]]
order = 17
subject = "حسبنا الله ونعم الوكيل"
author = "زهلت من تعليقات المسلمين"
posted = "2006-09-08"
text = "السلام عليكم ورحمة الله وبركاته<br />تعلمون جيداً ان الدعاء هو قلب العبادة لما لا تتركونا ندعو عليعم اانتم بهذا الجبن ياشعب مصر حسبى الله ونعم الوكيل خيفين من مين من جراد الارض لا حول ولا قوة الا بالله الله يسامحكم جعلتونى اخجل بأنى مصرية ولكنى أتباها بأنى مسلمة<br />والسلام عليكم ورحمة الله وبركاته<br />اللهم ماأنصر الاسلام والمسلمين واقهر الظالمين وششتتهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123617/http://www.20at.com/article2.php?sid=1151"

[[comments]]
order = 18
subject = "سؤال واللى يجاوب له الثواب"
author = "نجوى ابرهيم"
posted = "2006-09-16"
text = "انا لن اعلق على مسألة الدعاء وتحريمه او تحليله فقط سأقول جملة وأسأل سوال<br />اولا:كان الرسول صلي الله عليه وسلم فى احدى المعارك وظل الكفار يضربونه حتى سقطت رباعيته\"اى اسنانه الاربعة الامامية\"فرفع يديه الى السماء فقال الصحابة :\"سيدعو عليهم\" وفوجئوا برسول الله يقول:\"اللهم اهد قومى فانهم لا يعلمون\" او ما معناه ذلك...لن ندعو لهم ولكن<br />وعند لكن يأتى السؤال وتأتى ثانيا:اسرائيل وامريكا نازلة ضرب فى فلسطين بقالها اكتر من 50سنة واحنا بندعى عليهم لما ريقنا نشف وكل واحد قاعد فى بلده زى ال...........زى الباشا<br />بذمتكم الدعاء حرر القدس؟الدعاء هد امريكا وخلاها ماتدخلش العراق؟الدعاء منع اسرائيل عن تدمير لبنان؟<br />عيب .....عيب ربنا قال \"ان الذين امنوا وعملوا الصالحات\" مقالش \"الذين امنوا وتكلموا عن الصالحات\"<br />اعملوا يا مسلين ..اعملوا....<br />حسبي الله ونعم الوكيل<br />هو سعد زغلول الله يرحمه قالها ومات...مفيش فايدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123617/http://www.20at.com/article2.php?sid=1151"

