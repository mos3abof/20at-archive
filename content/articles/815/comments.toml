subject = "الى الاخت بنت مسلمة من مصر"
author = "ريم بنت السعوديةoooooooo"
posted = "2006-08-26"
text = "حبيبتي اختي مسلمة من مصر ........ انا قرات ما كتبتي وياليتني لم اقراة غضبت وغضبت وغضبت لكن ماذا اقول *** دعيني اسالك وتكلمي بلغتك لا بلغة النقل من الصحافة والتاثر بها لاني لا اعترف بها بتاتا .......... اتعتقدين اننا ان دعونا على شعب انه دعاء من فراغ هكذ ا كا اليهود ابرز مثال هل برايك انهم شعب مسالم هل في التاريخ وجدنا لهم حسنة كلا كلا .. هل مايعملونه في فلسطين واولا القبلتين حق ام في العراق واطفالها ونسائها المساكين ام في لبنان والمجازر التي حدثت فيها قولي لي بصراحة ان كنتي"
