subject = "الدعاء ثم الدعاء"
author = "ريم بنت السعوديةoooooooo"
posted = "2006-08-25"
text = "الان يتضح من هم عملاء اليهود ,,, فزق زوقكم منعكم من الدعاء عليهم ماذ ا يقصد الا الموالاة لهم فقط لاغير ............. ونحن في السعودية ليس لدينا بنود سلام ولا اتفاق مع اليهود ولا نخاف في الله لومة لا ئم فقد اعطتنا حكومتنا الضوء الاخضر للدعاء على اعداء الاسلام فلا اسمع في الجوامع الا ............ اللهم عليك بامريكا اللهم عليك باليهود اجمعين ولاتبقي منهم احدا ......... نحن مسلمون مسلمون ونفتخر فااذا لم نستطع ان نجاهد مع اخواننا فعلينا بالدعاء فهو سلاح المؤمن وهو الي يرد القدر وعلينا ان ندعو ونكثف الدعاء الدعاء على اليهود فقد سعو في الارض فسادا ........... اللهم اهلك اسرائيل اللهم اهلكها واهلك امريكا اللهم انهم لايعجزونك فا ذا لم ندعو فماذ ا عسانا ان نفعل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123617/http://www.20at.com/article2.php?sid=1151"

