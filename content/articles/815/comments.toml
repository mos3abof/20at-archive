[[comments]]
order = 4
subject = "سوف ندعو عليهم حتى اخر نفس بداخلنا"
author = "نصيرة الاقصى ( فلسطينيو 48)"
posted = "2006-08-25"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم ورحمة الله وبركاته<br />سوف ندعو ونبقى ندعو عليهم حتى اخر نفس بداخلنا ان شاء الله<br />كيف تقولون بان الدعاء على اعداء الله وعلى الصهاينة وعلى المغتصبين والذين يقتلون ابنائنا في ارضنا فلسطين وفي لبنان والعراق والمغتصبين حبيبنا المسجد الاقصى كيف كيف ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />سوف ندعو وندعو عليهم وعليكم انتم الذين كتبتم هذا المقال ان شاء الله وحسبنا الله ونعم الوكيل عليهم وعليكم<br />السلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123617/http://www.20at.com/article2.php?sid=1151"

[[comments]]
order = 5
subject = "تحية لنصيرة الأقصى"
author = "ياسين من غزة-فلسطين"
posted = "2006-08-25"
text = "السلام عليكم جميعا..<br />ان الدعاء عبادة لله وحده عز وجل<br />معك حق أخت نصيرة الأقصى. وبأبلغ تحياتي لأهلنا في الداخل.. لكن مش لازم ندعي على المسلين..حتى لو كانوا قد أخطأوا فالإنسان يخطئ ويصيب، ولازم ندعيلهم مش ندعي عليهم ، فبنقول الله يهديهم..<br />فحقا الكاتب نسي شي مهم في مقاله وهو أن الرجل عندنا استيقظ المفروض أنه أول شي صلى الفجر. قال صلى الله عليه وسلم\"من صلى البردين دخل الجنة\"<br />بعدين أي انسان يصير مهموم من المفترض انه يلتجئ إلى الله عز وجل<br />ولكن من المفترض الإنسان يستمع لإخبار المسلمين وهمومهم اذا هو قاعد في البيت ومرتاح راح يتضايق من الصور!!!<br />طيب وايش يقول المجاهد الذي لاينام الليل وهو مرابط .؟!! ماذا يقول الداعية الذي يبذل كل وقته وجهده في سبيل المولى عز وجل.<br />وبالنسبة لأختنا ريم من السعودية الأخت نيتها طيبة .وايش ذنبها اذا حكومتها طاغية في الفساد؟! حقا الآن توجد صحوة إسلامية بين الشعوب العربية<br />و أنا أحيي كل كلمة حق أمام سلطان جائر<br />ولكن من يقول الحق .<br />فنرجو عدم شتم المسلمين أو الدعاء عليهم وأرجو من الاخ التأسف للأخت من السعودية ويتفهم الموقف.<br />وبارك الله فيكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123617/http://www.20at.com/article2.php?sid=1151"

[[comments]]
order = 6
subject = "يا أمة ضحكت من جهلها الأمم"
author = "بنت مسلمة من مصر"
posted = "2006-08-26"
text = "ثم انتبهت إلى السؤال الذي طرحته على نفسي \"أين الحب في الدين الإسلامي كما نراه يمارس اليوم؟\"<br />فزعت منه.<br />ثم صممت عليه.<br />وأسألكم لذلك أنتم أعزائي: \"أين هو؟\"<br />فأنا في الواقع لم أعد أراه.<br />أين حب الإنسان، حب الآخر، في ديننا في زماننا الحاضر؟<br />حب الإنسان لمجرد كونه إنسان.<br />لأنه ينتمي إلى الجنس البشري.<br />لأن الله خلقه، مثلي ومثلك.<br />جبله من الطين نفسه.<br />ونفخ فيه من الروح نفسها.<br />أبحث عنه عبثاً ذلك الحب.<br />فالصوت الذي نسمعه اليوم عالياً يقول لنا \"لا تحبوا الآخر\".<br />\"بل أكرهوه\".<br />\"لا تجالسوا الأخر ثم لا تأمنوا جانبه\".<br />\"بل ألعنوه في سركم\".<br />وتذكرت الضجة التي أثارها قرار وزارة الأوقاف المصرية في 21 أغسطس بإلزام أئمة المساجد بعدم الدعاء على اليهود.<br />بعض فقهاءنا ثارت ثائرتهم معتبرين أن الدعاء على اليهود في المساجد \"واجب شرعي يدخل في باب المعلوم من الدين بالضرورة\".<br />\"واجب شرعي\" أن ندعو بالشر على الغير.<br />أي دعاء هذا بالله عليكم؟<br />ندعي على اليهود؟<br />اليهود كفئة بشرية تنتمي إلى ديانة محددة.<br />لا نتحدث هنا عن سياسة حكومة،<br />عن بشرٍ نتحدث،<br />بشر يؤمنون بديانة مغايرة.<br />نذهب إلى المساجد، وبدلاً من أن نتوجه إلى الله عز وجل بأفئدتنا، بدلاً من أن نتقرب منه بتطهير أرواحنا للحظات، نثلج صدورنا بسماع الأمام وهو يلعن أهل اليهود.<br />\"الله يخرب بيوتكم\".<br />\"الله يلعنكم\".<br />يردد أمام جموع المصلين بحرقة.<br />والله، ياللخزي، لا يستجيب.<br />ما الذي تركناه للمراهقين من بيننا؟<br />هذا عن مساجد مصر، وقس على ذلك مساجد البلدان العربية الأخرى، ولا داعي لذكر مساجد المملكة السعودية التي تعرفونها أكثر مني، فيها يدعي الأئمة اللهَ أن يديم عمر ولي الأمر، ثم يرسلون بعد ذلك لعناتهم على الغير، كان ما كان هذا الغير، مسلماً من الشيعة، مسيحياً، يهودياً، ملحداً، أو عضو في الطابور الخامس الذي يبدو أني أنتمي<br />إليه...<br />فالغيرُ كثير لديهم.<br />أعود إذن لأسألكم \"أين الحب في ديننا الإسلامي كما نراه يمارس اليوم؟ \"<br />\"حب الإنسان.\"<br />ضاع منا؟<br />أم أضعناه عامدين بعد أن عجنا الدين بالسياسة؟<br />أقحمناه في كل صغيرة وكبيرة من حياتنا.<br />وعندما فعلنا ذلك طمسنا وجهه الروحاني.<br />طمرنا التراب عليه، ثم دفناه.<br />فلم نعد نراه.<br />لم نعد نرى وجه الله المحب.<br />لم نعد نرى رحمته.<br />ولا غفرانه.<br />ولا النور الذي يشع منه.<br />ولا الحب أساس الإيمان.<br />بل نرى وجه غاضب،<br />ساخط،<br />متشنج،<br />ومحبط،<br />ياللأسى،<br />ونسمع حناجر صارخة متوعدة،<br />ألسنتها تزعق في أرواحنا،<br />تقول وهي تنفخ \"لا تحبوا\"،<br />\"واكرهوا\"<br />\" فإن الكره واجب شرعي\".<br />elham.thomas@hispeed.ch<br />نقلا من شفاف الشرق الأوسط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123617/http://www.20at.com/article2.php?sid=1151"

