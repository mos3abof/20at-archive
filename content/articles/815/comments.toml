[[comments]]
order = 2
subject = "المشكلة في (الهوك)"
author = "المشكلة في (الهوك)"
posted = "2006-08-25"
text = "المشكلة بيننا وبين اليهود هو كالأتي:<br />عندما نزلت اية واعدوا لهم ما استطعتم من قوة فالصحابة سالوا الرسول ما هي القوة يا رسول الله قال لهم الا ان القوة هي الرمي الا ان القوة هي الرمي الا ان القوة هي الرمي.<br />الرمي قد تطور الان واصبح اسمه في الغرب (هوك) عن طريق الطائرات والصواريخ.<br />واسرائيل قد امتلك (الهوك) ونحن لا (هوك) لنا كما شفنا في لبنان اسرائيل دمرت لبنان بالهوك.<br />اما اليهود فهم جبناء ولا مكان لهم في الحرب البرية.<br />حد عنده حل لمشكلة الهوك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123617/http://www.20at.com/article2.php?sid=1151"

