[[comments]]
order = 8
subject = "اتق الله"
author = "سليمان"
posted = "2006-08-26"
text = "بسم الله الرحمن الرحيميَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَقُولُوا قَوْلا سَدِيدًا<br />يُصْلِحْ لَكُمْ أَعْمَالَكُمْ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَمَن يُطِعْ اللَّهَ وَرَسُولَهُ فَقَدْ فَازَ فَوْزًا عَظِيمًا<br />اتقوا الله<br />ليت الواحد قبل يكتب يتأمل كلمة اتق الله<br />انا بصراحه ويازين الصراحه بعض الاحيان يجي بخاطري اسب والعن واسوي بلاوي<br />بس يمنعني كلمة اتق الله نعم اتق الله<br />ارجوا نتفكر ونتأمل هالكلمة اتق الله<br />لو عرفناها ووعيناها وصدقنا بها كان كنا بأحسن حال وارتحنا وارتاحت انفسنا<br />اتق الله<br />اذا كنت مقدم على سب فلان فتذكر كلمة اتق الله<br />اذا كنت تنوي فعل شي يؤذي الاخرين فتذكر كلمة اتق الله<br />اتق الله كلمة عظيمه<br />ومن يعمل بها مسلم بحق<br />واللي يقال له اتق الله ولا يتق الله ايش هو<br />في الاية القرانية سورة البقرة ( واذا قيل له اتق الله .....) النتيجه معروفه<br />والعقاب مذكور كما في القران<br />ssmo11@yahoo.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123617/http://www.20at.com/article2.php?sid=1151"

[[comments]]
order = 9
subject = "بيكفي ردووود"
author = "ياسين غزة - فلسطين"
posted = "2006-08-26"
text = "السلام عليكم<br />أنا راح أنصحكم جميعا نصيحة واحدة ..<br />اقرأوا آخر رد للأخت ريم (الله يفتح عليها)<br />والي ما بيستوعب الكلام يظل ساكت..<br />أيضا أرجو من الجميع أن لا يتم نقاش في هيك مواضيع وشتم المسلم للمسلم..فيجب أن نكون أوعى من هيك...<br />فليتخيل كل واحد منا انه الآن يوجد يهودي يقرأ ردودنا (احنا العرب) هاي على الدعاء عليهم.. شو بالكم راح يكون رده...<br />راح يضحك علينا لأننا أغبياااااااء بجدارة...<br />و أرجو أن يكون ردي هو آخر رد في هذا..<br />الموضوع لأنه الأمور صارت واضحة كالشمس..<br />مشكورة أخت ريم ع معلوماتك الصحيحة عن تاريخ اليهود المظلم..<br />وبارك الله فيكم أجمعين<br />أخوكم يس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123617/http://www.20at.com/article2.php?sid=1151"

[[comments]]
order = 10
subject = "يا مسلميييييييييييييييييييييييييين"
author = "محمد"
posted = "2006-08-27"
text = "قال صلى الله عليه وسلم<br />\"دعوووووووووووووووووها فإنها منتنة\"<br />وقصد بذلك التعصب للعرق والأصل وكان ذلك في حادثة تشاحن الأوس والخزرج بالمسجد<br />أقولها ثااااااااااانية::<br />\"دعوها فإنها منتنة\"<br />صلى الله على محمد صلى الله عليه وسلم<br />هذه هي السنة يا أنصار السنه<br />يا أحباب الحبيب يا متبعين غير مبتدعين<br />يا حامين بلد رسول الله يا خادمي الحرم وضيوف الرحمن وكفاكم هذا شرفا<br />يا من قال عنهم رسول الله :<br />استوصوا بهم خيرا<br />يا خير أجناد الأرض<br />يا من لهم مع النبي نسب وصهر يا أهل مصر الخير<br />بالله عليكم توقفوا من كان منكم محباً للنبي محمد صلى الله عليه وسلم<br />فليتوقف الآن لوجه الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123617/http://www.20at.com/article2.php?sid=1151"

