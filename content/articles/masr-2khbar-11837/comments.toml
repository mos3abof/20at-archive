text = "هل التعديل الجديد للموقع لتحديد شخصية المعلقين والقبض عليهم بواسطة الامن ؟<br />وهل التعديل تم بناءا على طلب جهات امنية ؟<br />اية حكاية البريد الالكترونى وادخال حروف معينة عند ادخال التعليق<br />على فكرة البريد الالكترونى المكتوب مضروب<br />باى باى عشرينات<br />وافضل لكم الغاء حكاية التعليقات فالموقع اصبح مشبوة"
