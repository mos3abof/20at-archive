[[comments]]
order = 2
subject = "ياريت محمد بن راشد يرضى نستعيره"
author = "مصرية مقيمة في أحلى مدينة (دبي)"
posted = "2006-06-23"
text = "نفسي أعرف الأخ اللي فوق ده متضايق ليه. يا سيدي هوا ده الإبداع إزاي ناس ماعندهمش من مقومات الريادة غير الفلوس والعزيمة قدروا يخلوا لنفسيهم موقع وقيمة في العالم لدرجة انهم اشتروا الشركة اللي بتدير أكبر الموانيء في أمريكا مما أثار حفيظة محافظي أمريكا وخلاهم شنوا حملة علي شركة موانيء دبي منعتها من إدارة موانيء أمريكا. الدور والباقي على اللي ياحسرة عنده بترول ممكن أكتر من بترول دبي وعنده قناة السيويس اللي دخلت في يوم واحد 15 مليون دولار وكل عوائدها بتروح لرياسة الجمهورية ما اعرفش بيعملوا إيه بكل الفلوس ديه. وعندها ثروة بشرية تتمثل في 70 مليون نسمة (بينما دبي بتستلف العمالة من كل أنحاء العالم)، وعندها زي ما قال الأخ المفروس الأزهر والعديد من المواقع الأثرية والثقافية وعندها عقول لامعة وبعد كل ده يا حسرة عملت إيه. بدل ما نعد نتريق ونتأنعر ونقول هما دول كانوا إيه ده إحنا اللي علمناهم وإحنا وإحنا خلينا نتعلم منهم عل وعسى نوصل لنص اللي وصلوله. أعتقد إن إحنا بدل الكلام اللي مالوش لازمة ده نطلب إعارة الشيخ محمد بن راشد لمدة كام سنة هوا ده اللي حيصلح البلد."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131953/http://www.20at.com/article2.php?sid=979"

[[comments]]
order = 3
subject = "يامسكر ياجزر"
author = "فكهاني"
posted = "2006-06-23"
text = "مش عارف اقول ايه ياأسيدنا بس هاقولكم حاجه الواد ابني الصغير النبي حارسه وصاينه اتعلمها في المدرسه<br />بيقولي يابويه كل الدول اقتصادها بيتنامي كل سنه اكتر من الاول واحنا حتي البطيخ باظ عندنا في مصر<br />بيقولي كمان حتي ربطة الجرجير اللي كنا بنبعها بشلن بأت بخمسه وعشرين قرش ولو سألني الزبون اقله الدولار غالي واثر علي سعر السوق<br />حاجات كتير ياجماعه والله وكلها في محل الفاكهه بتاعي تبين ليك الوضع بجد في مصر<br />ودي ابسط الحقوق وهي الاكل والشرب اللي احنا محرومين منها<br />اما السياسه والاقتصاد والحاجات الكبيره دي انا مش هاتكلم فيها<br />اشطه ياجوافه<br />وعجميه ياتين<br />واشوفكم طيبين<br />فكهاني مقهور"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131953/http://www.20at.com/article2.php?sid=979"

[[comments]]
order = 4
subject = "يا خساره على المقومات \"مات\""
author = "عابر القارات"
posted = "2006-06-24"
text = "للاسف الجامد طحن إن اللى بيعيب على دبي المفروض يبكى دم على القاهرة و الا الاسكندرية و لا أى مدينة فى مصر .... أنا أقولكم ليه يا سادة يا كرام يا اللى مش فاهمين .... دبى دى بلد كل مقوماتها إنها صحراء قاحلة و بحر يعتبر الساحل الشمالى بتاع مصر بالنسبة له ميه معدنية و طقس حوالى 9 شهور فى السنة عبارة عن درجة حراره متوسطها 40 درجة و الرطوبه لا تقل عن 80% يعنى لو مشيت فى الشمس 10 دقائق هتشم ريحة دماغك بتشيط و على فكرة اللى يقول البترول هوه اللى غير دبى يبقى غلطان لأن دبى لا تعتمد على البترول الا بنسبة ضعيفةجدا مقارنة مثلا بأبوظبى لكن يا سادة يا كرام مع هذا كله بقت دبى هيه دبى و اللى يشوف دبى مثلا من أسبوع و يرجع لها أكيد هيتوه لأن كل يوم فى تغير و تعديل و تحسين و توسيع و إرادة جبارة ورا دا كله بتلهث نحو الافضل و الاجمل و الارقى و بالرغم من كل اللى بي}خذ على دبى من إنفتاح له سلبياته المعروفه لكن اللى عاوز يروح الخماره يروح و اللى عاوز يدخل يصليله ركعتين المساجد مفتوحة 24 ساعة و اللى بيؤخذ عليها أيضا إرتفاع مستوى المعيشة الفاحش و اللى بيمتص معظم معاشات الناس هنا لأن ما هو عندنا فى مصر الناس بتبيع هدومها و بتلاقى فى الاخر خدمات زى الزفت ..... و تعالوا نقارن بقى أمكانيتهم و امكانياتنا المتنوعة من بحر و شمس و خضرة و نيل و الى أخرة ... و تعالوا بقى نقارن إنجازاتهم و إنجازتنا ... و لا بلاش كفاية فضايح خللى الطابق مستور و كافيين على خيبتنا مجور"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131953/http://www.20at.com/article2.php?sid=979"

[[comments]]
order = 5
subject = "الحضارة ليست مجرد عمارة"
author = "لآ شك أن ما وصلته دبي في مجال العمران والخدمات أمر يعجب ، ولكن الحضارة ليست مجرد مظاهر حضارية ."
posted = "2006-06-24"
text = "الحضارة هي الانسان ، الانسان الحر هو الانسان المبدع ، دولة المؤسسات هي دولة الابداع ،أين الامارات من هذا كله، انها مجرد ضيعة يحكمها ال النهيان وال مكتوم تزول بزوالهم .<br />أعلموا -اخوتي - أن الانسان هو الذي يبني العمارات ، ويوفر الخدمات .<br />أما العمارات والخدمات فلن تصنع الانسان مهما علت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131953/http://www.20at.com/article2.php?sid=979"

[[comments]]
order = 6
subject = "تساؤل: من أفضل حالاً.. دبي أم باقي المدن العربية؟"
author = "مهندس فلسطيني"
posted = "2006-06-24"
text = "بالنسبة للموضوع الأساسي فلا أجد ما يعيبه، أما بالنسبة للردود فأرى أن هناك العديد من الآراء التي تستحق النظر والتقدير..<br />فمثلاً الإنسان هو صانع الحضارة بالفعل، وحركة العمران الهائلة في الإمارات معظمها مصنوعة بتكنولوجيا غربية.. وصحيح أن لكل مدينة من دول العالم حضارتها الخاصة...<br />ولكن السؤال الذي يطرح نفسه هو: من أفضل حالاً.. دبي.. أم باقي المدن العربية؟؟<br />الإجابة التي سيجيبها أي عاقل هي: دبي..<br />فدبي أفضل حالاً من الاسكندرية (التي درسنا تاريخها العظيم) بالرغم من أنهما ساحليتان.. ودبي أفضل حالاً من البصرة مع إنها تفوقها في مخزون النفط...<br />ولكن كما ذكر الشيخ ابن راشد أن المشكلة في الدول العربية ليست مشكلة إمكانات.. ولكنها مشكلة إدارة...<br />فالإدارة هي التي حولت دبي من صحراء قاحلة لا زاد فيها ولا ماء إلى قبلة سياحية يؤمها السياح من جميع أنحاء العالم...<br />باختصار.. الإدارة السليمة هي كلمة سر الحياة...<br />تحياتي لكم والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131953/http://www.20at.com/article2.php?sid=979"

[[comments]]
order = 7
subject = "الحلم العربي"
author = "محمد حسن غنيم"
posted = "2006-07-12"
text = "اصبحت دبي حلم عربي لكل دولة عربية تريد و ان تصل إلى العالمية و المنافسة<br />و إذا كانت الإمارات قد خصها الله بالتطور الإقتصادي إلا ان سبب تطورها الاول ودليل نجاخها هو جودة التخطيط السليم و السلوك الحضاري القويم الصادر من شعب الإمارات او الوافدين فأنا على مدار الثلاث سنوات إقامة في دبي لا أجد شخص مهما كانت جنسيتة يسيء لها فهى لها فضل كبير في تقويم سلوك الشعوب الاخرى الوافده الموجوده بها ناتج من النظام و المحافظة على معالمها مما ادى ان تكون دبي عالم آخر غير العالم المعروف<br />ولكن لي كلمة اخيره<br />اجد ان كل معالمها معالم جماليه اصطناعية وليست طبيعية مثل معشوقتي مصر<br />محمد حسن غنيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131953/http://www.20at.com/article2.php?sid=979"

