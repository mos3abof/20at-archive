text = "السلطان البطل قلاوون الاب طرد الصليبيون من امارة الرها فى الشام<br />وخلفة ابنة البطل محمدبن قلاوون فحرر منطقة اخرى من الشام<br />اما البطل الحفيد اشرف ابن قلاوون فرمى باخر صليبيى من ارض الشام فى البحر وطردهم الى جزيرة رودس ووضع نهاية لحرب صليبية استمرت 300 عاما<br />انها عائلة ابطال عاشت فى ميدان القتال وماتت فى ميدان القتال"
