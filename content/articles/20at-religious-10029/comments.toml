posted = "2008-09-08"
text = "ازيك وازي صحتك عامل ايه<br />نشكرك على المجهود الطيب<br />بس القادم احنا ما لناش دعوة بيه<br />خلينا في الحاضر<br />خلينا في الاغاثة<br />عايزين نجمع تبرعات بسرعة وتكون تحت امر الناس المتضررين<br />عايزين نساعد (مصريين بالخارج ومصريين بالداخل)<br />لو كل واحد دفع جنيه حيبقى عندنا 80 مليون جنيه<br />قوتنا في عددنا<br />قولنا يا عم نتبرع ازاي من الداخل ومن الخارج<br />بسرعة يا خباب<br />لازم يكون فيه لجنة اغاثة<br />المصريين يتبرعوا ازاي من الداخل ومن الخارج يا خباب<br />احنا منتظرين المصريين في الخارج منتظرين<br />سلام يا خباب"
