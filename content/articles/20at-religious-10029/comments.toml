text = "تحية الى ابطال التحرير ابطال العبور ابناء القوات المسلحة المصرية<br />حماة الوطن فى كل الاوقات و الازمات ؟<br />اللة معكم و الى الامام<br />عبرتم بمصر من هوان الهزيمة و الاحتلال الى شرف النصر و التحرير؟<br />و اليوم عبرتم لنجدة ابناء و طنكم فى المحنة رافعين سواعدكم الفتية لانقاز ابناء الوطن و قت الشدة<br />اللة معكم دائما و ابدا لنصرة الضعيف و قت البلاء و الشدة"
