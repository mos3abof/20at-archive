posted = "2008-09-12"
text = "شرف لنا جميعا ان نكون مسحيين اقباط مصريين<br />نحن لم نبيع فلسطين او العراق؟<br />جميع المسحيين من جميع جنسيات الارض حررت لكم الكويت متمثلة فى جيوشها الجرارة؟<br />متمثلة فى قرارات الجمعية العامة بالامم المتحدة!!!!!<br />كنتم فين ياحاقدين على المسيحية و ليس لكم سوى سباب اهل الذمة يا عرب عديمى الايمان و الذمة؟<br />(من ازى زميا فقد ازانى) حديث شريف؟<br />دعوا اهل الدين فى حالهم؟<br />اللى بيحصل لكم الان من غضب اللة عليكم يا عديمى الايمان عظة لكم لعلكم تتقون؟ و ما انتم لتتقون؟<br />اليهود عندهم من ادب الحوار ما انتم تفتقدونة؟<br />(فاقد الشيئ لا يعطية)<br />الادب فضل عن العلم ايها الجهلة"
