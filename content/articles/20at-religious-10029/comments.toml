subject = ""
author = "البابا شنوده"
posted = "2008-09-14"
text = "شوفوا يا جماعة زخاري جرجس دخل الموقع بقالي فترة معينة وبدأ بسب وشتم المسلمين في صورة (الاخوان) وهذا يبين لكم كيف تحدث الفتن الطائفية في مصر<br />طبعا الاقباط اقلية ضعيفة لا قيمة لها لكن لسانها طويل زي زخاري كده يتطالوا على اسيادهم اصحاب البلد<br />تكون النتيجة ايه المسلمين يتلموا عليهم ويأكلوهم علقة محترمه اوي اوي زي ما بيحصل في الريف ومن غيظ المسلمين يحرقوا عليهم بيوتهم ويكسروا الدنيا على دماغهم وبعد كده يصوتوا ويلطموا ويقولوا المسلمين عملوا فيها وسوا فينا<br />اهو حالة زخاري كده<br />لو احنا شايفين زخاري جرجس دا ادامنا الان كان حياكل علقة محترمه هو واللي يتشددله ويتبهدل وينداس على كرامته<br />وهو دا اصل الفتن الطائفية اللي بتحصل في البلد<br />طول لسان الاقباط وقلة ادبهم واستفزاز المسلمين<br />يقوم المسلمين يدوهم بالجذمه<br />شوف زخاري دا علشان خاطر احنا مش قادرين نوصله عمال يقل ادبه ويتسفل<br />ما بالك باه لو احنا شايفينه كان انضرب بالجذمه هو والقبيلة بتاعته والكنيسة بتاعته كلها<br />يا زخاري عدد المسلمين 94% يا زخاري<br />مش حتقدروا على المسلمين يا زخاري<br />يا زخاري الكنيسة بتصوت من عدد الاقباط اللي بيسلموا كل يوم<br />المسيحيين اعدادهم بتنقص يا زخاري<br />انتوا مش ادنا يا زخاري لا اد الاخوان ولا اد الوطني ولا ادنا خالص<br />انتو خلاص يا زخاري بتنقرضوا من مصر<br />ادي مثل حي للفتن الطائفية اللي بتحصل<br />قلة ادب من الاقباط وطول لسان فقط (القبطي ما يقدرش يعمل اكثر من كده)"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105185313/http://20at.com/20at/religious/10029.html"

