text = "الجبان اللى دائما يكتب الى(زخارى)<br />طيب قولى يا روح امك ماذا كنت عايزنى اكتب و اقول اية لاخوتنا المسلمين اللى ماتوا نتيجة انهيار الدويقة ؟؟؟؟؟<br />يابن الكلب يابن المرة [ *** ] امك اللى جابتك من السفاح؟<br />بلاش تحاول استغلال مصائب الوطن للتباهى بالكلمات شماتة فى الموتى المساكين؟<br />ما تروح تشمت فى امك المومس اللى ما عرفتش تربيك يابن الحرام و السفاح<br />معلش ملكش اب يعرف يترد علية<br />علشان انت ة اقسم باللى العظيم ابن ستين حيوان يابن المعرص و المرة المومس اللى اسمها امك؟جاتك ستين خيبة و متنساش تتبول و تتبرز على امك؟"
