posted = "2008-09-11"
text = "انتم بتحلموا تعملوا لجنة اغاثة<br />فى قانون الطوارىء اى شخص او جهة تجمع نقود او تبرعات تحت اى مسمى تخرق قوانين امن الدولة - وهيرد عليك المنظرين بتوع الوطنى - واية اللى يضمن ان الفلوس دى ما ترحش للارهابيين<br />كل حاجة يجب ان تتم من خلال الدولة ومن خلال الحزب الوطنى<br />ليس هذا تهريجا انة واقع مؤلم<br />احذروا ان تقعوا فى اخطاء تمس امن الدولة على حسب فهمهم المريض"
