posted = "2008-09-12"
text = "(من ازى زميا فقد أزانى) حديث شريف<br />(و لتجدن أقربهم اليكم قسيسين و رهبانا————————-ألى أخره!!!؟) قران شريف<br />حقا أشكركم من كل قلبى طوال ما حييت لاكتشافى حقيقة ما انتم تكونون؟<br />و هنيئا للاسلام بامثالكم ايها السفهاء!!!؟<br />لقد اسائتم لعقيدتكم و رسولكم؟<br />سامحكم و غفر اللة لكم لانكم عمى الاعين و العقول و القلوب و لا ترون و تفهمون و تفهمون؟<br />بارك اللة من امثالكم الجهلة المرتدين السفهاء<br />ان ما يحدث فى مصر و المنطقة العربية لهو من غضب اللة عليكم؟ فتوبوا و اتعظوا قبل فوات الاوان؟<br />(احبوا بعضكم) ايها الحاقدين يابناء الشياطين و العقارب<br />و معلش كلاكيت مليون مره(اللى بيتهم من زجاخ بلاش يرموا اسيادهم بالطوب ايها الحثالة السفهاء الحاقدين الاغبياء اعضاء الجماعة المحظورة اياهااااااااااا ااااااااااااااا ااااااااااااااا ااااااااااااا؟)"
