text = "جزاك الله خيرا ياخباب عبد المقصود أفضل تغطية صحفية وأفضل كلمات معبرة<br />لكن ده مش كفاية وأنا بضم صوتي للفوق عاوزين خطوات عملية لنجدة الناس دية وتكون فزعة شعبية بعيد عن كل الحرمية بتوع الحزن الوثني<br />وياريت تعلنوا عنها ويتبناهانقابةال صحفيين أو لجنة الاغاثة بنقابة الاطباء أو أي جهة موثوق فيها ويكون راعيها شخصية محترمة بعيدة عن اللصوص ويكون الصندوق ده دائم وليس مؤقت علشان كوارثنا كتيرة وحكوماتنا طناش<br />ربنا معاك يا مصر بس لازم نحرك يا أولاد مصر"
