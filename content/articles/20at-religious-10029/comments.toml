text = "طيب ما انت بتقول انك مسلم غيور على دينك ?????<br />انت فاكر انك الوحيد اللى تقدر تشتم و تزم و تهين اسياد ابوك و امك يابن المرة المومس [ *** ] و ابوك الكالب يابن ستين مليون 000000000000000 000000000000000 00000000000000ح يوان!؟<br />طيب لية انكم جميعا عندما تكتبون للرد و اهانتنا و تتطاولوا على اسيادكم المسحيين اصحاب مصر ؟<br />(لية كلكم دائما تختارو اسماء رجال الدين المسيحى)؟<br />هى الشيوخ عنكدكم و لا مؤاخذة اسمائها بقت عورة حرام الناس تعرفها و لا اية؟ الحكاية ؟؟؟؟؟<br />(كم من فئة قليلة غلبت فئة كثيرة بازن اللة)<br />يا ريت تكون لديك من الشجاعة و تبقى تكتب لى على اسم و عنوان بنت المركوبة امك علشان اجى اديها العيدية؟<br />خص شهر رمضان اوشك على الانتهاء و العيد على الابواب و لازم ادى امك العيدية علشان تشترى امك بيها بعض من الملابس اللى تقدر تستر بيها عورتها يابن بائعة العورة؟"
