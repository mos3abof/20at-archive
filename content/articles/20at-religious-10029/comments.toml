posted = "2008-09-12"
text = "يا زخاري انت انسان وسخ وقذر وانا دوري هنا ان انا اكشفك دايما<br />القوات المسلحة ما بتحبكش واللي زيك ممنوع يشتغل فيها<br />عارف ليه يا زخاري لانكم خونه وعملاء لليهود<br />علشان خاطر الخونة امثالك ممنوع يشتغلوا في القوات المسلحة<br />وانت عارف كده كويس<br />وبعدين ابقى خلي ماما تروح تغفر عند مرقص عزيز عندكم في اسكندرية علشان خاطر<br />بس ابقى روح معاها ما تسبهاش لوحدها لحسن يعمل فيها حاجه كده ولا كده"
