text = "القوات المسلحة لا تفرق بين مسلم او مسيحى يابن الحمار<br />القوات المسلحة للدفاع و الزود عن الوطن؟<br />تزكر انة كان هناك من القادة المسحيين بالجبهة و ابلوا بلاء عظيما مثل اللواء الراحل(فؤاد عزيز غالى)<br />و ايضا كان منكم ايضا من خافوا و هربوا الى ليبيا و كانت مراكزهم القيادية متقدمة اكثر ؟مثل الفريق اللى ما زال حبيسا فى السجن الحربى كخائن و جبان و لا داعى لذكر الاسم؟ لانكم تعرفوة جيدا يا جبناء!!!<br />الوطن ليس حكرا على جماعة يا حمار يابن الحمار يا منافق و مزورى التاريخ و مصطنعى الاشاعات و الحاقدين على ابناء الوطن و الباحثين عن الفتنة الطائفية ايها الخنازير مربى الذقون و مدعى العلم و الثقافة و الايمان؟<br />و ما انتم الا حثالة من حثالات التاريخ و القتل و الارهاب؟<br />و تذكر جيدا ان مصر انجبت لنا من ابنائها المسلمين و المسحيين ما شرفها و شرف العالم كلة و لم تفرق بين مسيحى او مسلم؟<br />د-بطرس غالى سكرتيرا عاما لمنظمة الامم المتحدة<br />د- مصطفى مشرفة عالم الطبيعة النابغة<br />د-مصطفى المشد عالم الذرة رحمة اللة<br />د-مجدى يعقوب جراح القلب العالمى<br />د-محمد زويل العالم النابغة و الحاصل على جائزة نوبل فى العلوم<br />الاديب الراحل نجيب محفوظ رحمة اللة و الحائز على جائزة نوبل فى الاداب<br />الرئيس الراحل انو السادات و الحائز على جائزة نوبل فى السلام ايضا؟<br />اما انتم يا اعضاء جماعة(الاخوان المسلمين) عفوا أقصد رعاع (الجماعة الموبؤئة)او (الجماعة المحظورة) فماذا افرختم للمجتمع سوى جماعات متخلفة ارهابية قتلة<br />الهارب القاتل ايمن الظواهرى<br />السجين الاعمى المتخلف الموتور-عمر عبد الرحمن<br />و اخيرا و ليس اخرا شيخكم الخرف الضاحك المبكى -مهدى عاكف؟<br />التاريخ دائما ما يلفظ الكذبة امثالكم ؟<br />تشرفنا بالخدمة بالقوات المسلحة المصرية و سوف نتشرف بها طوال ما حييناو لسوف نلتجاء و نحتمى بها عند المحن الحقة<br />انها درع مصرنا الحامى لكل مصر مسحيين و مسلمين؟<br />اما انتم يا جهلة و مريدى الفتنة و الفساد فعليكم لعنة اللة و طريقكم دائما هو المجارى لتستحموا بالبول و البراز الذى تستحقونة دنيا و اخرة"
archived = "2010-01-05"
