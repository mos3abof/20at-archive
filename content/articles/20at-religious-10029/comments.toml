text = "منتظرين النائب العام يوجه الاتهام التقصير و التربح و الفساد الى محافظ القاهرة و كل و جميع المتسببين فى الاهمال الذى اودى بحياة العشرات من الغلابة بتوع الدويقة؟<br />انفطرت قلوبنا و ليس لنا سوى الدعاء لكم يالجنة و الغفران<br />اما العصابة اياها فعليهم لعنة اللة و غضبة من الصغير الى الكبير و حتى لو كان محافظ او و زير"
