text = "بعد ما شفت الفيلم<br />والله المأساة مش حنعملها افلام يا جماعة<br />المأساة عايزه لجنة اغاثة بسرعة<br />اعملوا يا عشرينات لجنة اغاثة<br />وقوللنا نتبرع فين<br />احنا منتظرين"
