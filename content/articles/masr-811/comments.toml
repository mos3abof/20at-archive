[[comments]]
order = 1
subject = "بمناسبة التعداد نهدي هذا المقال"
author = "حكاية امه اسمها مصر"
posted = "2006-08-18"
text = "حكاية أمة اسمها \"مصر\"<br />بقلم<br />أبوإسلام أحمد عبدالله<br />Abuislam_a@hotmail.com<br />ليس من الصواب أن ننسلخ من تاريخنا العريق إلى أجدادنا الفراعنة, سواء الموحدين منهم أو الوثنيين أو الذين اعتنقوا المجوسية أو اليهودية أو النصرانية, وسواء الذين اعتنقوا نصرانية روما االبيزنطية, أو نصرانية خاصة بهم في الأسكندرية, بغض الطرف عن تلك النصرانية التي جعلت من المسيح عليه السلام \"إلها\", ومن أمه \" أم الإله\", أو تلك التي رفضت ألوهية المسيح وعُذب أهلها من أجل ذلك حتى الموت, فيما يعرف بالنصرانية الآريوسية كما عُرفوا بالموحدين.<br />إن هؤلاء جميعاً وغيرهم من أصحاب العقائد والطوائف والملل والنحل الوثنية والكفرية والشركية والموحدة, كلهم يشكلون نسيج أجدادنا الأقباط, الذين استقبلوا الفتح الإسلامي, أو الغزو العربي ـ كما يحب أهلنا نصارى مصر أن يقولوا ـ<br />وبغض النظر عما إذا كان أجدادنا الأقباط قد استقبلوا هذا الفتح بالدفوف, أو هذا الغزو بالحراب, فإن الإسلام حط بجناحية على بلاد الأقباط, وفرض قوانينه وعرض بضاعته, بما فيها من ترغيب وترهيب, وعطاء وأخذ, وعدل وقهر, ومصحف وسيف, فالمهم والحاصل والمحصلة والنتيجة النهائية, أن الأغلبية الغالبة من أجدادنا الوثنيين والكفرة والمشركين والموحدين, قد اختاروا الإسلام والتوحيد عقيدة لهم, وارتضوا محمداً خاتم الأنبياء والمرسلين نبياً لهم, فمنهم من قبلها خوفاً وطمعاً, ومنهم من قبلها خشية الموت جوعاً, ومنهم من قبلها رغبة في الجنة, ومنهم من قبلها خلاصاً من الظلم الكنسي الذي كان متسلطاً على الرقاب آنذاك باسم المسيح الرب, أو الإله المصلوب, ومنهم من ارتضى الإسلام ديناً لأنه كان بلا دين, أو ليعفي نفسه من دفع الجزية, أو انبهاراً بقوة المسلمين, أو حباً فيمن انتصر على عد<br />اقرأ بقية التعليق .."
archived = "2006-08-27"
capture_url = "https://web.archive.org/web/20060827134312/http://masr.20at.com:80/article.php?sid=811"

[[comments]]
order = 2
subject = "عندى أمل كبير"
author = "فاقد الأمل"
posted = "2006-08-19"
text = "مفيش أى تعداد فى مصر طلع مظبوط لغاية النهاردة السبب بسيط خالص وهو إن مافيا الجهاز المركزى يسرقون المبالغ المخصصه للتعداد ولا يتم تدريب العدادين التدريب الكافى بالإضافة إن عملية ترقيم المبانى لا تتم بالدقة الكافية مما يجعل كثير من المبانى ساقطة من التعداد بالإضافةأن فى مصر نسبة كبيرة جداً تسكن المقابر وهؤلاء لا يتم عدهم ولا حصرهم بالإضافة أن فى العشوائيات أماكن يصعب على العدادين الوصول إليها لما بها من نسبة كبير من الخارجين عن القانون يحولون دون وصل أى عداد إلى المنطقة مثل منطقة منشية ناصر على سبيل الحصر بالإضافة أن اسئلة الأستمارة لا بد وأن تنسب إلى ليلة العد المخصصه للحصر مما يجعل كثير من الأشخاص ربما ينتقلون من سكن إلى آخر فتم عدهم مرتين ومشاكل كثير فى عدم مراجعة البيانات قبل الإدخال بالإضافة إلى مشاكل إدخال البيانات المعدومة للدقة وبالتالى فهذا المبلغ تم صرفة قبل التعداد وكل تعداد وأنتم طيبين"
archived = "2006-08-27"
capture_url = "https://web.archive.org/web/20060827134312/http://masr.20at.com:80/article.php?sid=811"

[[comments]]
order = 3
subject = "مجرد توضيح"
author = "مصرى"
posted = "2006-08-22"
text = "أنا عايز أوضح للأستاذ إللى بيسأل إزاى ها يعدونا فى سنتين وأن المصريين ها يكونوا زادوا خلال السنتين دول أنه عند القيام بعمل تعداد يكون هناك ليلة إسمها ليلة العد وهى تكون معروفة ومحددة أثناء إجراء التعداد للشعب كله بالإعلان عنها وينسب العد إلى هذه الليلة بمعنى أنه عند السؤال تقول أين كنت يوم كذا أى يوم العد ونتائج التعداد تنسب لليلة العد هذه يعنى خلال السنتين دول يكون تعداد السكان نسبة إلى ليلة العد وليس لواقع الحياة بعد سنتين.<br />ولكن هناك حساب آخر لعدد السكان عن طريق تقدير السكان وهذه تكون بحساب معدل زيادة السكان كل سنة وضربها فى عدد سنوات التقدير وحساب المواليد والوفيات والمتغيرات الأخرى فى أعداد السكان ويكون بالحساب وليس بالحصر الفعلى كما فى التعداد.<br />وهذا للتوضيح فقط والله المستعان"
archived = "2006-08-27"
capture_url = "https://web.archive.org/web/20060827134312/http://masr.20at.com:80/article.php?sid=811"
