[[comments]]
order = 0
subject = "تخاريف ولا حقيقة عن بلد إتسرقت في دقيقة"
author = "أيوا، دي بلدي"
posted = "2006-10-16"
text = "كان مبارك منذ نحو عامين قد غضب كثيرا بسبب قيام صحيفة الميدان و هى صحيفة محلية مستقلة بنشر صورة جثة السادات و كانت تلك هى أول مرة يرى فيها الرأى العام فى مصر و العالم كلة هذة الصورة التى كانت تعتبر سرا كبيرا لمدة 22 عام. هذا، و قد صدرت أوامر عليا لكل الصحف سواء كانت حكومية أو غيرها بعدم نشر هذة الصورة مرة أخرى.لدى مبارك أسباب وجيهة كثيرة لكى يحجب المعلومات الخاصة باغتيال السادات و يرفض اجراء تحقيقات حقيقية كاملة و نزيهة لكشف غموض هذة الجريمة.<br />و كانت جريدة العربى الناصرى قد نشرت فى عددها الصادر بتاريخ 19-6-2005 تقريرا مبنى على أقوال أحد الشهود مفاده أن السادات كان ينوى طرد مبارك و تعيين غيره نائبا لرئيس الجمهورية. كان السادات قد أخبر مبارك بعزمة تعيين غيرة فى أواخر سبتمبر من عام 1981 بسبب قيام مبارك بعمل اتصالات فى الجيش من وراء ظهر السادات مما جعل السادات يتوجس خيفة من مبارك و يشك فى نواياة. و فى صباح يوم 6 أكتوبر من عام 1981 أى قبل ساعات من اغتيال السادات عين السادات الدكتور عبد القادر حاتم نائبا لرئيس الجمهورية بدلا من حسنى مبارك الا أن القرار الخاص بذلك كان سيجهز و يوقع بعد الاستعراض العسكرى. هذا و قد نشرت الجريدة المذكورة صورة للسادات و هو يصافح عبد القادر حاتم صباح 6 أكتوبر. و طبقا لتقارير أخرى غضب السادات بشدة عندما علم بأن مبارك كان يجرى من خلف ظهرة اتصالات مع العائلة المالكة السعودية التى كانت قد فطعت العلاقات معة بعد توقيعة معاهدة السلام مع اسرائيل. أما المؤسسة الدينية السعودية المتطرفة المرتبطة بالعائلة المالكة هناك فقد أحلت دم السادات لانة عقد صلح و سلام مع \"اليهود أعداء اللة\". و قد رد السادات فى تحدى بقولة ان \"السعويون كانوا رعاع و نحن الذين علمناهم التمدن\". أما ا<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 1
subject = "دعوة للتفكير"
author = "دي بلدنا كلنا"
posted = "2006-10-16"
text = "والله كلام معظمه ماشي مع المنطق وإن كان به بعض الهنات، بس اللي غايظني فعلا ومن صغري،مين اللي حط الكرسي الخشب المعفن أسفل المنصة ومباشرة أمام السادات،راجع أي صورة للمنصة،وكمان ده لما حصلت حادثة بورسعيد لمباك،البلد دخلت دماغه،شال مدير الأمن وبعدين المحافظ ولغي المنطقة الحرة وشرد أهلها،يبقي بعد حادثة المنصة يخلي وزير الدفاع ويرقيه رغم كونه المسئول الأول،وحاجات تانية كتير زي فين حراسة رئيس الدولة،قارن ذلك برد فعل حراسة مبارك في حادثة أثيوبيا ولا بلاش في حادثة بورسعيد لأن القاعدة عندهم مفيش حد غير مصرح له مهما كان يقدر يقرب من الرئيس في حيز معين خاصة في الأماكن المفتوحة واللقاءات الجماهيرية وفي الحالة دي بيكون الضرب في المليان"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 2
subject = "مبارك قاتل السادات"
author = "لا تخاريف ولاحاجة"
posted = "2006-10-16"
text = "الكلام فعلا يتفق مع العقل والمنطق وفى الجرائم اذا عرفت الدافع لارتكاب الجريمة عرفت الجانى فبالله عليكم من المستفيد الوحيد من موت السادات بالطبع مبارك وليس تخليص الشعب من حكم الكافر لانه لو كان كافر يبقى مبارك اشد كفرا لو كان ظلم يبقى مبارك اشد ظلما لو كان حرامى يبقى مبارك شيخ منصر انا لا انفى ديكتاتورية السادات واخطاؤه الكبيرة اهمها زيارة القدس ولكن هل يتساوى بعميل امريكى من الطراز الاول يحاول توريث الحكم لابنه يظهر اماما دائما طيب وحنين وهو فى الحقيقة شرييييييييييييييييييير"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 3
subject = "فينك يا حرية"
author = "إرحمونا بأة"
posted = "2006-10-16"
text = "وإيه حكاية المشير أحمد بدوي دي كمان، بقي وزير الدفاع وأكبر 13 راس في الوزارة راكبين كلهم طيارة واحدة ـ يا سلام ـ والراجل الثاني في الوزارة ،رئيس الأركان ، إن شاءالله ليه مكانش معاهم، والطيارة دي بكل بساطة تقع ـ يا حلاوة ـ هي كانت طيارة ورق ولا كان فيها شوية كتاكيت. عقبال طيارتك يا حسني ـ قولوا يارب.<br />بتفكرني بحكاية طيارة مصر للطيران، أكيد فاكرينها. اللي كان فيها 30 من خيرة كفاءات القوات المسلحة في كافة الأفرع واللي إنصرف علي إعدادهم دم قلب البلد و حضروا دورات متخصصة في أمريكا لمدة تزيد عن 3 شهور كل في تخصصه، وبعدين كله راح ... راح ... راح ......."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 4
subject = "قصيدة أحمد فؤاد نجم"
author = "بمناسبة خطوبة رئيس مصر القادم جيمي بن مبارك"
posted = "2006-10-16"
text = "مبروك يا عريسنا<br />يا أبو شنة ورنة<br />يا واخدنا وراثة<br />اطلب واتمنى<br />واخرج من جنة<br />أدخل على جنة<br />مش فارقة معانا<br />ولا هارية بدنا<br />يا عريس الدولة<br />افرح واتهنى<br />ما احناش كارهينك<br />لكن هارشينك<br />راح تكمل دينك<br />وتطلع ديننا"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 5
subject = "فينك يا حرية"
author = "إرحمونا بأة"
posted = "2006-10-16"
text = "حسنى مبارك استدعى شيخ الازهر وسألة ان يفتى له فتوى ان جمال يمسك الحكم من بعده<br />شيخ الازهر: قاله لا يجوز<br />حسنى : انت بتستهبل ياطنطاوى<br />طنطاوى : ابدا ياريس مش انا اللى بقول كده<br />حسنى : امال مين اللى يقدر بقول كده<br />طنطاوى : ربنا بيقول كده فى القرأن<br />حسنى : ازاى ياطنطاوى<br />طنطاوى : الاية بتقول: ولا تنكحوا ما نكح ابائكم"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 6
subject = "نصير الشعب على الفساد"
author = "مصرى"
posted = "2006-10-17"
text = "طلعت السادات كل لما بشوفه وهو بيتكلم وببساطة اهل البلد ولا بيرفع حواجبه زى مبارك ولا يبنفخ بقه زى صفوت الشريف ولا بيهزأ من الناس زى فتحى شرور بأحس من كلامه أنه فعلاً صادق وبيعبر عن المصريين ولازم كلنا نؤيده فى دفاعة فى هذه القضايا الشنيعة التى لا يرتكبها إلا المجرم المخضرم مبارك الذى سيذكره التاريخ كما يذكر نيرون وهولاكون مصاص الدماء فهو أقذر من دنس تراب مصر الغالى ونهب وفجر وله نفس النهايات التى أنهى بها حياة كفاءات مصر الغالية اللهم امين اللهم خلصنامن هذه العائلة كما أنجيت مصر من فرعون اللهم امين"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 7
subject = "منوفي قتل منوفي، وإيه؟"
author = "شاهد عيان"
posted = "2006-10-18"
text = "وماذا يهمنا اليوم إنا نعرف مين اللي موت الخنزير العميل السادات، بلدياته المنوفي ولا الشهيد الإسلامبولي، ولا حتى السي إي إيه، بعد حرق ورقة السادات وحاجتهم لعميل جديد لانج ومطاوع زي سلفه ومنحط زيه. لايستبعد إن المنايفة الكلاب كلوا لحم بعض، ده تقليد منوفي عريق سجلته الأجيال بالمثل\" المنوفي لا يلوفي ولو أكلته لحم الكتوفي\". السادات كافر مدعي للألوهية حلال الدم، وبلدياته مبارك من نفس الطينة الوسخة. السادات أول من مهد للصوصية والنهب العام والعمالة في مصر، وطبعا طلعت وعصمت وجيجي ويتامي أيام النهب الذهبية بتاعة السادات بيحنوا لعهده، لو مبارك يوسع دائرة النهيبة بتاعته ويضمهم ليه، حتلاقيهم بسبحوا بحمده ويلعنوا أصل السادات الواطي، لكن لكل زمان بلطجيته ولصوصة."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 8
subject = "العرب الجرب همه السبب"
author = "المهندس عادل"
posted = "2006-10-18"
text = "ملعون أبو العرب الجرب همه سبب تأخرنا وبيجرونا للخلف. ملناش غير أمريكا وإسرائيل دول همه أصدقاءنا الحقيقين، أنا نفسي أكون يهودي والإسلام ده مش عاوزه ولا المسيحية. وأحسن حسنات السادات إنه صالح إسرائيل، وخلاها طايحة في العرب بدل مننا.<br />نعم للتوريث وإستكمال المسيرة"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

