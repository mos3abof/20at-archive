[[comments]]
order = 14
subject = "مخدوعين فيه"
author = "م.سامى"
posted = "2006-10-19"
text = "الاخ مصرى صاحب تعليق نصير الشعب على الفساد ، واضح انك صغير السن او تأخذ بالمظاهر اذ ان ما نسمع عن احوال عائله مبارك كان لا يقارب بما كانت تفعله عائله السادات خاصه فى السنوات الاخيره من حكمه بدايه من ملكه مصر جيهان السادات وهى التى ادخلت لقب سيده مصر الاولى هذا لاول مره وكانت تتعامل على انها رئيسه جمهوريه ، وحتى اصغر فرد فى عائله الرئيس السادات ، فعندما تصف طلعت السادات بهذا الشكل الرومانسى المثالى لا املك الا ان اضحك حقا فكل ما هنالك انه بالبلدى كده بيتمسكن لحد ما يتمكن."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 15
subject = "بلاش تجريح شخصي يا مصري"
author = "شاهد عيان"
posted = "2006-10-19"
text = "ولدي العزيز مصري، حضرتك لا تعرف سني ولا رتبتي العسكرية ولا شئ بالمرة عني وكويس كده. أتمني عليك بحرارة إن التجريح لا يأخذ صفة شخصية. أنا السادات أعرفه أحسن منك بكتير وقبل ما يبقى ريس، لغاية ما أعدم في يوم الزينة بتاعه وكانت نهايته زي قارون.<br />السادات لا بطل ولا شجاع، وأصلا هو مات من الرعب بالسكته القلبية، قبل ما تستقر في جسده الخبيث رصاصة واحدة. أنا مش فاهم إزاي شايف فروق بينه وبين بلدياته مبارك وهمه الإتنين نفس الولاء والتبعية لأمريكا وإسرائيل. السادات مهد الأرضية الخصبة للفساد والنهب العام، ومبارك أكمل بناء إمبراطورية الفساد. خذ حتى مذكرات أكثر موالين الصهيونية زي بطرس غالي وشوف هو كاتب عن كامب ديفيد إيه؟ وأتمنى إنك تعرف مين بطرس غالى؟ عيلة السادات كلها تحولت لحيثان الإنفتاح وبقى في إيدهم كل إذون الإيراد والتصدير وكل من نوى يعمل بزنس كان لازم يدفع لهم إتاوة يعني..بلاش تجادل في النقطة دي؟<br />أما عن كون السادات بطل حرب فعندي وعند غيري كثير نقوله ويثبت إن السادات تآمر على السوريين أولا وعلى الجيش المصري ثانيا وضيع إنتصارنا في حبك مؤمرات مع كيسنجر. مش عايز أتكلم كثير وتكفيني شهادة الفريق الشاذلي رئيس الأركان في هذه الفترة. وإلا برضه الشاذلي كمان أعمى وحمار؟"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 16
subject = "يا رجل حرام عليك"
author = "معلق"
posted = "2006-10-19"
text = "انا عاصرت فترة الرئيس السادات كويس يا اخ سامي وهي لا تقارن في الانجازات بالنسبة لمبارك واكبر غلطة للسادات العظيم انه جاب مبارك نائب السادات عهده ماكانش فيه تعذيب وسلخانات زي اللي قبله واللي بعده مبارك اللي متحالف مع رجال الاعمال هو وولاده وشفطو البنوك والبورصة يكفي السادات انه انتصر في اكتوبر ورجع سيناء السادات هو اللي عمل المحكمة الدستورية وهو الغي قانو الطواريء وكان في عهده المناصب في الجامعه بالانتخاب والعمد في القري وكل ده الغاه مبارك فلا وجه للمقارنة فلنتق الله في احكامنا السادات هو الذي جعل الشريعة الاسلامية المصدر الرئيسي للتشريع ومن الممكن للمحكمة الدستورية الغاء اي قانون مخالف للشريعة رحمك الله يا سادات وغفر لك"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 17
subject = "الي شاهد عيان"
author = "منوفي"
posted = "2006-10-19"
text = "حسبي اله ونعم الوكيل في السب اللي سبته في اهل المنوفية لقد شتمت 4مليون مصري باقذع الشتائم في رمضان ثم بتقول ان سنك كبير لكن للاسف عقلك صغير ومن السهل عليك كده تكفير الناس وتكذب وتقول ان السادات ادعي الالوهية ياخي اللي زيك شيطان في هيئة انسان وسنختصمك ونقتص منك يوم الدين"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 18
subject = "ياعزيزى"
author = "م.سامى"
posted = "2006-10-19"
text = "يا عزيزى معلق ، انا لا اتحدث عن كل هذا بل اتحدث عن ممارسات عائله كل منهما فمعروف ان عائله السادات كانت تدخل فى شركات ومشروعات ضخمه الارباح وكل راس مالها اسم الرئيس ، نفس الحال كما يحدث الان ، كما انك تعرف اعتقالات السادات فى اواخر ايامه (مع مقوله ان هذه الاعتقالات تمت كى تمر مساله تسليم سيناء بسلام) تلك المقوله الغامضه التى لا تفسر اعتقال كتب و مفكرين و قساوسه وشيوخ وافراد من الجماعات الاسلاميه (انظر التناقض) ام ان كل هؤلاء من الشرق الى الغرب اجمعوا على عرقله مسيره السلام هذه؟ فكما تعرف سياسه السادات الشهيره هذه اضرب ده بده اخرج الاخوان لتضرب الشيوعيين و الناصريين وفى النهايه انقلب الكل ضده!"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 19
subject = "تكمله"
author = "م.سامى"
posted = "2006-10-19"
text = "فما اريد ان اقوله ان لكل اخطاؤه ، والسادات عندما لاقى معارضه ضرب بكل الشعارات الديموقرلطيه عرض الحائط ، بالاضافه الى ان الاصلاحات معظمها شكليه مثل تعدد الاحزاب الوهمى الذى مازال قائما الى يومنا هذا ، لو كان الاساس قوى لما وصلنا الى هذه الحال ، ولا تقل ان مبارك هدم صرح الحريه العملاق الذى بناه السادات (اين كان هذا ومتى) ، فان كنت ترى ان النقطه السوداء فى حكم السادات فقط هى نائبه ، فانا اختلف معك (بلا غضب او تعصب) بان النقطه البيضاء الوحيده فى فتره حكمه كانت استعاده سيناء."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 20
subject = "للمنوفي اللي لا يلوفي"
author = "كاره أم المنوفية"
posted = "2006-10-20"
text = "القذر منوفي الفلاح بن العبيد عايز يعمل بالمثل خالف تعرف، يابن الأوساخ فيه عاقل واحد في المجرة كلها بتكلم كويس عن أحط المخلوقات اللي همه إنتم يا دون يا بهايم يا منايفة يا عدمات الشرف والعرض والدين. هات لي بس واحد ميكونش مضروب خسران من عينتك واحد بس يقول إن المنوفي على الأقل إنسان، إنتم حيوانات خنازير بالضبط عايزين تكوشوا على كل حاجة باللسلبطة كده وبغير وجه حق.<br />يكفي شرعا إنك منفي علشان تذبح على العيد الكبير يابن الجاموسة والكندوز، بالزمة مش مكسوف تعترف إنك منوفي؟ بدل ما تتدارى في خرابة تلمك، أخلاق جواميس دي. بدل ما تغلط في الراجل الطيب المؤدب شاهد عيان كان لازم تشكره لشهادة الحق، آه الخنزير السادات جمع رؤساء الصحف وقالهم \"بره بيكتبوا عني إني نصف إله ليه ما بتعملوش زيهم؟\". الكلام ده ذكره سمير رجب وإبراهيم نافع وغيرهم. بلاش دي مقالهش إبن العاهرة في آخر خطبة ليه\"وما أنا بظلام للعبيد؟\" بيشبه نفسه الحقير برب العزة سبحانه وتعالى. وبعدين إيه سيناء اللي رجعت دي؟ فيه سياده مصرية على سيناء؟ بترولها وغازها بيروح لمين؟ والقواعد الأمريكية الإسرائيلية اللي هناك ناسيها؟ إسرائيل ما بتدفنش نفاياتها النووية في سيناء؟ بلاش فضايح عيب إن مصر بقدرها وحجمها تنلقب غفير يحرس حدود إسرائيل، كله علشان شوية ملياردات في حساب السادات وعيلته."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

