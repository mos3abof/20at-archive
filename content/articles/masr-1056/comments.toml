[[comments]]
order = 22
subject = "للمنوفي أوي دور على أمك في الغيطان"
author = "إبن القاهرة"
posted = "2006-10-24"
text = "هو المنوفي يابن المنيوكة فالح إلا إنه يتناك في الغيطان؟ دور على طيزك وعلى عيلتك الشراميط كلها تلاقيهم مربوطين في الزرايب والغيطان منيوكين مركوبين.<br />أمك ناكها الواد سعد الله الأفريكي النمنم وجابتك وقبله برضه أبوه حسب الله ناك أم السادات وخلفته بالحرام، أمال هو كان زنجي عبد تموم زي أمك ليه؟<br />قولي بقى يابن الزنوج يا متناك هي أمك مش مومس وبتشغل في بيت دعارة وبتتناك بعجوة ويوسف أفندي وبلح أمهات وكوسة؟<br />السادات كان بيعرص على جيهان الشرموطة ويكدس فلوس على قلبه، هو المنوفي الحلوفي اللي زيك مش إتخلق علشان يكون ديوث ومتناك يا خنيث."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

[[comments]]
order = 23
subject = "يا طلعت يا بطل"
author = "يا طلعت السادات يا بطل الشعب كله معك ومؤيد لك ويريدك أن تظهر حقيقة قتل السادات حتى يوضع القاتل فى السجن جزاء لم فعل وكفاية عليه 26 سنة سرقة ونهب فى مصر هو وعيلته"
posted = "2006-10-25"
text = "طلعت السادات هو خير من يقود الشعب لإنه واحد منهم ويشعر بالفقير وهو فى قوة مصطفى كامل وسعد زغلول والشعب كله معك والله يوفقك يارب"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

