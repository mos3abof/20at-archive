[[comments]]
order = 11
subject = "إلى أعمى عيان"
author = "مصرى"
posted = "2006-10-19"
text = "يا شاهد عيان أنت أعمى عيان لأن لو أنت شاهد كنت شهدت الحق وعرفت إن القائد هو إللى بيدافع عن تراب بلده ولكن العميل الحقير هو إللى باع بلده لليهود زى الخنزير الكبير مبارك لما باع مصانع مصر شركاتها لليهود ونهب أموالها لكن واحد عمل جيش قوى لمصر وقدر يكسب بيه حرب كبيرة وبعدين يصنع سلام مع أعدائه فهو رجل حرب وسلام عن حق ولكن الخنزير الكبير هو رجل نهب وفساد<br />يا طلعت السادات كلنا معك لتعرية القاتل اللى قاعد فى الحكم بقاله 25 سنة بينهب وكان المفروض إنه يقضى الفترة دى فى المعتقل إللى مليه بأغلى أبناء مصر ولكن الله سيظهر الحقيقة ويعرف العالم كله كيف خان سيده وطلع منها زى الشعرة من العجين وربنا يفضحه يارب والله معك ياطلعت السادات والشعب كله معك فلا تيأس ودائماً الأشجار المثمرة هى التى تلقى بالحجارة أما النباتات الشيطانية فتداس بالأقدام"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061519/http://masr.20at.com:80/article.php?sid=1056"

