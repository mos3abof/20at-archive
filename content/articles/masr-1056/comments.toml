subject = "معروف"
author = "م. سامى"
posted = "2006-10-19"
text = "من المعروف ان طلعت السادات كان من اللى عايشينها بالطول والعرض ايام فتره حكم الرئيس السادات (عامل زى علاء كده دلوقت) واسألوا من عاصر هذه الفتره ، فماالذى جرى ليصبح الان مناضل يبحث عن حقوق الشعب"
archived = "2006-11-28"
