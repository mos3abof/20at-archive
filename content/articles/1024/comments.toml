subject = "تصحيح لابد منه"
author = "أبو بيبرس الصومالي العدني"
posted = "2006-08-07"
text = "هناك خطأ ورد في المقال الجميل الذي يحمل عنوان الصومال أرض.. وتاريخ للكاتب أحمد الهواري بأن هناك أقلية مسيحية من الصومال فهذا شئ يعلمه القاصي والداني في الصومال أنه لايوجد أي أقليات دينية ولا مذهبية فصومال كله شعب مسلم سني لايوجد أي مذهب آخر إلا أن هناك بعض العوائل التي تنصرت في الصومال إبان الإستعمار البريطاني والإيطالي والفرنسي وهذا العوائل لم تعد تقطن الصومال فمنها من سافرت مع خروج الإستعمار ومنها من عادت إلى ماكانت عليه من العقيدة الصحيحة فإني أقول لكاتب بدلا من أن تكتب من دون علم فستشر أهلها ( فأهل مكة أدره بشعابها)"
archived = "2006-11-02"
