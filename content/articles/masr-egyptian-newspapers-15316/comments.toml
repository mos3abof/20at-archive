posted = "2010-02-14"
text = "جامدة يا غادة كما هو متوقع<br />و أنا معاكي جدا<br />بس من غير نفسنه<br />خصوصاً بقى لو هندخل ع الأقزام المتحركة دي<br />^ـ^<br />غادة ضد الفلانتين … و أنا معاها<br />^ـ^"
archived = "2010-02-16"
