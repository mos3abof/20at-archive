author = "izzy"
posted = "2010-02-14"
text = "واللهي انا بكره الفالنتين جدا عشان دايما بيجي عليا بنكد و حتي لما باكون بحب عمر الحب ده ما بيوصل ليوم الفالنتين … بس انا مش شايف اي حاجة مقنعة في مقالتك مع الاسف وحاسس انها مقالة مع ان اسلوبها الادبي كويس انما مش هاتقنع غير الناس اللي معندهاش حد تحتفل معاه وبتدور علي اي حاجة تقول انها بسببها مش عاوزة تحتفل … وأي حد من اللي بيحتفلوا بالفالنتين مع اللي بيحبوه لو قولنا الاسباب ديه هيقولنا حاجة واحدة \"ده قصر ديل يا أذعر\" … فنسيب اللي بحتفل يحتفل واحنا نحتفل بحبنا لاهلنا وربنا واصحابنا وبلاش نتلكك للناس واسف ان كان ردي جارح بس فعلا ده اللي حسيت بيه"
archived = "2010-02-16"
capture_url = "https://web.archive.org/web/20100216115759/http://www.20at.com:80/masr/egyptian-newspapers/15316-2010-02-14-13-46-45.html"

