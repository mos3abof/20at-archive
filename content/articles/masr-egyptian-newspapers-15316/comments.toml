[[comments]]
order = 2
subject = ""
author = "عابر سبيل"
posted = "2010-02-15"
text = "اقتباس ليش يا ابن المنيوكة:<br />وليش انت وهي ضد الفالتاين ؟؟ أنا بعرف لأنو مافي ولازب ولا اير صرلكم .. يعني بصريح العبارة عم تدوروا على شي شب خرج ينيك أمك وامها مشان تصيروا تحبو الفالتاين .. عهر بعهر من تحت العبايات<br />كم مرة بتمارسي العادة السرية سا شر موطة انت وياها<br />كم مرة لعبت بزنبورك وحكيتيه بالحيط<br />بدي انيككك انت وياها اذا لسى بتنزلو هيك مواضيع كذب ودجل وبتناقض دعارتكم<br />كس اختك على اختها شر اميط<br />ايه القرف الى انت كاتبه ده<br />فين الاداره تشيل الرد ده<br />وبالمره تشيل ردى عشان انا مقتبس الرد معاها<br />انت شكلك ملحد اصلا . وباين من ردك التانى"
archived = "2010-02-16"
capture_url = "https://web.archive.org/web/20100216115759/http://www.20at.com:80/masr/egyptian-newspapers/15316-2010-02-14-13-46-45.html"

[[comments]]
order = 3
subject = ""
author = "الحق"
posted = "2010-02-15"
text = "يا [ *** ] يا غادة<br />هل تعلمين لو كان الفلانتاين على دور محمد ؟؟؟<br />كان باع كل الامة الاسلامية و اشترى بيهم ورد<br />طبعا انتي عارفة ليش ؟؟<br />كانت عشيقاته كثيرات و كان يحب النيك كتير<br />و خاصة نيك المحارم<br />يعني اختو او بنتو او زوجة عمه التي ناكها في القبر و هي ميتة<br />اكيد اللي خلاكي تكتبي هيك موضوع النقص العاطفي اللي عندك<br />يا ست طيب الا تحبين سنة النبي ؟؟<br />كان يحب النيك كتير<br />انتي لازم تمشي مع السنة النبوية<br />اعطيني ايميلك و انا سوف اعوضك عن اللي فات"
archived = "2010-02-16"
capture_url = "https://web.archive.org/web/20100216115759/http://www.20at.com:80/masr/egyptian-newspapers/15316-2010-02-14-13-46-45.html"

