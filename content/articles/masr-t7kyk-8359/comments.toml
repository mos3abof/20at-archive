text = "دى مش اسمة بنك الحظ - دى بنك الفقر الدولى<br />ارسل رئيس بنك الفقر الدولى الى مندوبة فى مصر بنشر الفقر بين طبقات الشعب وجعلهم يقفوا طوابير طولها 2 كيلومتر علشان يشتروا رغيفين عيش<br />وبعمل تحقيق مع احد الواقفين فى الطابور من 3 ساعات - شكر الرجل الواقف فى الطابور الحكومة واشاد بالحزب الوطنى وقال انة مجهوداتة نجحت فى جعل الوقوف فى الطابور 3 ساعات بعد ساعتين للحصول على رغيفين من الخبز<br />وبسؤال الاسطى بلية العجلاتى وامين التنظيم افاد بأن ازمة الخبز سببها الرئيسى هو اصرار حكومة الوطنى على تصدير الارز مما تسبب فى غلائة وجعل الناس تاكل الطبيخ بالعيش بدل طبق الرز اللى كان جنب الخضار<br />كما اشتكى تجار الكيف بان الناس انصرفوا عن الحشيش والبانجو نتيجة للفقر والعوز وضيق ذات اليد<br />شكرا على الانجازات والمحافظة على المكتسبات الفقراوية<br />واللة المعين"
archived = "2009-07-01"
