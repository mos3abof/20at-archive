author = "مناضله"
posted = "2006-05-09"
text = "فى البدايه الموضوع ده لازم مناقشته بقوه وبجديه مش مجرد كلام يعنى .<br />اولا لابد لنا من معرفه السبب وراء هذه الكارثه وانا فى رائي<br />ان عدم تثقيف البنات وعدم الاهتمام بتعليمهم كيفيه الدفاع عن النفس سبب هام .<br />فنجد ان الاهالى يقولون للبنت لا يصح ان تنظري لشاب ولا يمكن ان تضربيه مما يولد عن البنات شعور بالضعف وبالتالى لا تستطيع البنت التصرف فى هذه الحاله حتى لو مثلا صحتها قويه لا تعرف ماذا تفعل وكيف تقاومه .<br />انا اعتبر هذا سذاجه ولابد ان تتخلص منها بنات حواء فلابد ان نعلم بناتنا الدفاع عن النفس بل يجب الاهتمام بذلك اكثر من الشباب لان البنت اكثر عرضه للتحرش والظلم .<br />ثانيا الطرف القذر فى هذا الموضوع وهم الشباب ما دافعهم لذلك:<br />اعتقد ان الدافع هو التربيه الخاطئه وعدم التمسك بالدين والاخلاق الطيبه<br />فنجد ان بعض الاباء يهتمون بالشباب عن البنات وتغرسون فيهم ان البنات تحت تصرفكم وانهم جواري لكم .<br />هذا ما يغرز فى نفوس الشباب بطريقه غير مباشره للاسف<br />فصار الشاب يعتقد ان البنات اداه للتسليه وانهم ملك له وليس لهم حق الاختيار او المعارضهكما انهم يتلذذون بعذاب الضحيه<br />والسبب الثاني ان اللوم على الفتاه فنجد ان عاقبتها اليمه<br />تظل مكروه ومنبوذه حتى من اقرب الناس لها للاسف والمجتمع ينظر لها على انها ساقطه وحيوانه وغير شريفه<br />بينما يفر المجرم بفعلته ولا احد يذكر اسمه او حتى يريد معرفته<br />اذن عدم وجود عقاب لهؤلاء السفله اوجد المشكله<br />فلو كان المجتمع يقف بجانب الضحيه ويعاقب المجرم لكان الوضع مختلف<br />نجد انه اذا سرق احد الشباب فانه يفضح ويسجن الخ<br />لكن فى هذه الحاله و كان شئ لم يكن<br />هل بعض المسروقات مثلا اهم من شرف وعرض مسلمه<br />اريد اجابه<br />عقوبه الاغتصاب من الناحيه الاجتماعيه ومن الناحيه القانونيه تعتبر لا شئ<br />مقابل ما تتدفعه هذه المسكينه من الام<br />لابد ولابد ولابد<br />ان تكون العقوبه<br />الاعدام<br />فالاعدام<br />ويجب ان يوجد رقابه شديده على الشباب لان معظم المصائب من هؤلاء<br />اذا اخذنا بهذه الاساليب وطبقناها سوف يتغير الوضع كثيرا كثيرا<br />وكم نتمنى ان يتغير هذا الوضع<br />لذلك لابد من التفكير بهذه الاسباب وحلها والتخلص من السلبيات وتعديل طريقه تربيه الشاب فى هذا المجتمع<br />واناشد بنات جنسي عدم التهاون بتلك المشكله فما يوجع فتاه يوجعنى انا ايضا لانها من نفس جنسي المظلوم كثبرا<br />ولابد ان يدفع هذا الحقير الثمن غاليا ويجب ان يتمنى الموت الف مره ولا يجده<br />والسلام عليكم ورحمه الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

[[comments]]
order = 50
subject = "اذن فالسبب باختصار هو............."
author = "مناضله"
posted = "2006-05-09"
text = "توصلت للسبب وهو<br />الاستهتار ثم الاستهتار<br />استهتار من الاهل من المجتمع الظلم للبنت ومن القانون الذي لا يعاقب المجرم العقاب الذي يستحقه ومن سوء التربيه للبنت او الشاب بالاخص والاستهتار من من لا يقدر حجم هذه المصيبه<br />بدليل<br />تعليقات الشباب السخيفه التى قراتها<br />وكانهم لا يبالون ابدا<br />اعتقد انتم قرائتم بعض التعليقات الشخيفه صح؟<br />هؤلاء بنظري يبررون للمجرم فعلته<br />بل ولا يمانعون ارتكاب تلك الجريمه البشعه لذلك نجد منهم الاستهتار<br />الاستهتار هو الى ضيعنا وراح يسوقنا الى الف مؤلفه من الاخطاء<br />ويجرعنا من الذل براميل مبرمله<br />............. واشكركم على القراه وانتظر الردود فالموضوع لم يقفل ولن يقفل ابدا طالما هناك انذال وسفله لازالوا يرتكبون مثل هذه الجريمه<br />اللهم استر علينا وعلى اعراضنا واعراض المسلمات والمسلمين الى يوم الدين<br />اتقوا الله فالله هو مخلصنا<br />وانا خلصت كلامي بس المره دي بجد اطمنوا<br />والسلام عليكم ورحمه الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

