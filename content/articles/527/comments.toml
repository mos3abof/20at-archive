[[comments]]
order = 25
subject = "كلام فى المليان"
author = "المهندس/ محمد عبدالله"
posted = "2006-01-20"
text = "انا بشكر الى طرح مثل هذا الموضوع للمناقشه عمتا الموضوع مهم ويجب علينا جميعًا بدلا من ان نتكلم عنه يجب التفكير فى حل لمثل هذه العادات والممارسات الغير سويه ولابد علينا أن نرى الموضوع بشكل أكثر موضوعيه ومن هنا أقول لكل الفتايات اللئى قد ممرن بمثل هذه التجربه المريره يجب عليكن ان تتخلصو من هذه الزكريات الاليمه والتفكير فى ماهو باقى والشىء الباقى اهم وهوه انفسكم وحياتكم المقبله الماضى شىء مهم فى حيات الانسان ولاكن الشىء الاكثر أهميه هوه المستقبل انا لا اقول ان تلقوا بالماضى وراء ظهوركن ولاكن حاولوا ان تتغلبوا على ألامكم بالتفكير فى المستقبل وكيف تحولوا حياتكم الى ماهو افضل وأن الله فى عون كل من فى مثل ظروفكم كما قال الله سبحانه وتعالى ( بسم الله الرحمن الرحيم) واستعينوا بالصبر والصلاة على قضاء حواجأكم. صدق الله العظيم<br />وفى الختام اتمنى منكن أذا وجدة واحده منكم الى نصيحه او اى شىء أخر فأنا بأذن الله موجود معكم اذا احتجتمونى فى اى شىء والله المستعان وأرجو من الله ان يوفقكم الى مايحب ويرضى<br />المهندس*/ محمد عبدالله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

