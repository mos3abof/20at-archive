posted = "2006-07-08"
text = "السلام عليكم ورحمه الله وبركاته<br />اما بعد<br />يا اخوانى المشكله مش منانحن المشكله من هولاءاللاتى يتبرجن ويلبسن اللباس الضيق الذى يثير هولاء المراهقين مما يولد شهوه عارمه<br />كل هذا بسبب هذة الاعمال مما يجعل الانسان لا يفرق بين الصغيره والكبيره فانا ادعو اخوانى واخواتى ان نتحد سويا لبناء مجتمع سوى قائم على الاخلاق الدينيه والاسس الشرعيه والله المستعان"
