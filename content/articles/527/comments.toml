author = "عبدالله مفتاح"
posted = "2006-01-02"
text = "مفيش فايده بردو هبه مصممه على انها تتناول المواضيع الحساسه باسلوب مهني سيء<br />انا مش فاهم ايه فايدة انها تنشر آراء البنات يعني لو كانت قالت انها ظاهرة وقالت اسبابها كان لسانها هيتقطع مظنش<br />ولما حد يخرج عن شعوره ويخونه التعبير يبقى وحش ومتخلف وكوخه<br />انا مع اي موضوع مهما كان بس الاسلوب اللي يتم تناول بيه الموضوع ميبقاش مستفز<br />مرة تانيه بطلب من ادارة الموقع الا تتبع اسلوب العند شايفين الناس مستائين من الاسلوب ده في مناقشه هذه النوعيه من المواضيع ليه العند والاصرار على طرحها بالاسلوب ده على فكرة العند حاجه مش كويسه<br />انا بنصح وانتو احرار عايزين تطرحوا المواضيع بنفس الاسلوب براحتكم<br />وانتي يا هبه خليكي زي منتي اصل اللي دماغها بالطريقه دي ملناش غير ان ندعي ان ربنا يهديها<br />بس لما الواحد بيلاقي واحده بالعند ده بيعرف فعلا انهن خلقن من ضلع اعوج وان اعوج ما في الضلع اعلاه<br />ربنا يهدي الجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

[[comments]]
order = 13
subject = "لا مؤاخذة"
author = "أول ما تابعت موقع عشرينات كانت الموضوعات رائعة فعلا ..لكن المستوى حاليا يتدهور جدا"
posted = "2006-01-04"
text = "أولا يا هبه شغلك رائع و ممتاز ..و الفكرة منتشرة مفيش كلام لكن التعليق كان على احساسنا كقراء بأن اسرة تحرير عشرينات و خاصة هبه بيستكردونا عدم اللامؤاخذة بأنهم بيقولوا قالايه جابو اربع بنات تعرضوا للاغتصاب في الصغر..يعني الموضوع لايصدق بهذه السهولة خاصة في مجتمع بيكفي على الخبر مجور<br />ثانيا وده الاهم..ان اسرة عشرينات بقى مخهم صغير جدا ..وعاملين فيها كبار و ناصحين..بمعنى انهم وقفوا بتحدي ضد رأي القراء ..الليهما في لاساس بيشتغلوا علشانهم..ومش معنى ان الوضوع بيثير الجدل يبقى معناه انكم ناجحين حاليا..بالعكس انتو مستواكم في النازل..<br />كمان اصبحتوا بتكونوا جبهة عداء ضدالقراء واستهزاء منهم..ليه مع انكم انتو اللي بتضحكوا علينا!!!<br />ثالثا و ده الاهم الاخ براء ..يعني ايه تكتب لنا خطبة تنهيها بـ\"الله ..الوطن ..عشرينات\" تحاول من خلالها انك تفلسف اخطاء هبه و مش بس كده تدعس انها شطارة و ذكاء منها...إذا كان المتكلم كذا...فالقاريء عاقل!!!<br />ولا ايه؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

