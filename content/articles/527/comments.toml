[[comments]]
order = 6
subject = "تساؤل"
author = "مهتم"
posted = "2006-01-01"
text = "اعتذر بشده عما ساكتبه و لكن الاحصائيات هي الحكم في هذا الموضوع..من قراءتنا لمشاكل اسلام اون لاين لاحظت ان معظم مشاكل المثليه الجنسيه تاتي من السعوديه و الخليج. و معظم مشاكل الاصحاب و الصاحبات و الحركات الهبلاء التي تؤدي الى فقد العذريه من مصر!! لا اريد ان اوجه اتهامات و لا ان اثير فتن و لكن المسأله وصلت من الخطوره الى الحد الذي يجب الاهتمام الجدي بحلها...المشكله مش مشكله حالات فرديه و انما مشكله ثقافه مجتمع!!<br />و المشكله ايضا اننا بين نموذجين لمجتمعين كليهما تولد عنه مشكله..الاول نموذج الانغلاق و عدم الاختلاط كالسعوديه و لكن نرى نتاج ذلك انحراف في الفطره الانسانيه لشباب كثير من هناك..النموذج الثاني و هو الانفتاح الى حد ما كما في مصر و لكن نجد نتاج ذلك مشاكل تاتي من بنات مسلمات تتحدث عن فقدها لعذريتها و لكنها تشتكي من موضوع اخر الا و هو هل زعل حبيبها المأفون من انه اصابه ما اثار غثيانه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

[[comments]]
order = 7
subject = "كان الله فى العون و كفايه كده يا شمحطجى"
author = "نيفين"
posted = "2006-01-01"
text = "اولا شكرا لكاتبه الموضوع و ثانيا اقول كان الله فى عون كل تالضحايا من البنات فى هزا الموضوع و ربنا يصبرهم جميعا بس يا جماعه اظن حرام جدا ان ميكونش عقاب المغتصب اعدام و اناشد كل اللى من سلطتهم سن القوانين فى هزا البلد ان يكون الاعدام جزاء كل حيوان يعمل كدا لانى ف قضايا كتير بلاقى ان لو فيه اكتر من فرد ف القضيه و كلهم مغتصبين ان التهمه بتتقسم عليهم و بتبقى كام سنه سجن و خلاص و دا حرام<br />و للشمحطجى بقول عيب نستهين بمصايب الناس و يا ريت نحسن اسلوبنا ف المناقشه عن كدا<br />و ربنا يستر على و لاياك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

[[comments]]
order = 8
subject = "صلوا ع النبي"
author = "البراء أشرف"
posted = "2006-01-01"
text = "سلام عليكم جميعا أولا..<br />ثانيا.. كل سنة وانتوا طيبين<br />ثالثا.. صلو ع النبي..<br />رابعا.. عليه الصلاة والسلام..<br />خامسا بقى نقدر نقول باختصار شديد جدا ان جمهور الموقع الكريم الواضح انه بقى أبو لمس ..<br />أبو لمس يعني انه اصبح غير قادر على فهم المقصود من الموضوع لكنه فقط يتوقف عند التفاصيل التي ربما لن تزيد أو تنقص من الموضوع شيئا.<br />خلينا ناخد موضوع هبة مثال، أولا انا كنت معترض على نشر اسماء البنات كاملة في موضوع اسرار البنات، لكن في الموضوع ده هبة طلعت ذكية واستفادت من التجربة وحطت اسماء بنات عادية.<br />لكن يا ترى البنات دي حقيقية ولا لأ..؟<br />في 3 احتمالات..<br />الاول ان البنات دي موجودة فعلا وده يبقى شيء يضاف للكاتبة انها عرفت تحصل على شهادتهم رغم اننا نعيش في مجتمع كتوم زي ما الاخ الشمحطجي قال.<br />الثاني ان البنات دي تكون صاحبات تجارب سابقة منشورة على مواقع انترنت وفي الحالة دي برضه يضاف للكاتبة انها كلفت نفسها وعملت سيرش لحد ما جابت الشهادات وفلتت من انها تدفع لكل بنت 50 جنية عشان تاخد حكايتها، لكن لو الاحتمال ده صحيح كان مهم ان هبة توضح ده في الموضوع.<br />والاحتمال الثالث ان هبة تكون ضاربة الموضوع.<br />والغريب ان الاحتمال ده لو كان صحيح كان برضه هيضاف للكاتبة، تقولولي ازاي .. اقول لحضراتكم..<br />القصص سهلة ومعروفة والسيناريو واحد وموش محتاجين حد يحكيلنا عليه، وبالتالي القصة موش هي البطل في الموضوع.\\<br />البطل هو كلام الدكتور أحمد عبد الله وكذلك تعليقات الجمهور الكريم.<br />وبالتالي فالقصص الهدف منها فقط التمهيد للموضوع وخلق حالة من الاندماج بين القارئ وبين القضية المطروحة.<br />وموش هيفرق كتير لو كانت القصص دي لبنات موجودات فعلا ولا مختلقة.. لاننا كلنا متأكدين من شيء واحد، وهو ان الموضوع ده بيحصل وبقدر غير ضئيل ، يبقى دورنا يا استذتي اننا نناقش القضية موش نناقش حكايات البنات، لانها في النهاية عينة عشوائية، تؤكد فقط على ان الظاهرة موجودة.<br />انا خلصت كلامي ...<br />واحب اشكر الاخوة المحترمين اللي علقوا قبلي، وبالنسبة للتعليقات احب اقولكم ان النظام الجديد اللي عشرينات بدأ يشتغل بيه هو نظام تقني معقد جدا بيخلينا منقدرش نشوف كل التعليقات.<br />وان شاء الله هيتصلح قريب لما الحاج مصعب يخلص امتحانات ويرجع يشتغلنا، اقد يرجع يشتغل .<br />اسف جدا على الاطالة بس بقالي فترة طويلة معلقتش ومشتاق قوي اني اكتب تعليق واني اقول رأيي واسمع آراء حضراتكم القيمة<br />اشكركم جدا<br />البراء أشرف<br />محرر بالموقع الذي تقومون بزيارته الآن<br />عشرينات يعني<br />الله.. الوطن.. عشرينات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

