text = "كان من الممكن من هبه ان تقوم بكتابه مقدمه بسيطه عن الموضوع ياتى بعدها أراء النفسيين ،والتى كان من الواجب ان تتضمن حلول يلجأ اليها اصحاب تلك المشاكل ولايكتفى بعرض انواع المواقف النفسيه المختلفه من الحادث الاليم.<br />حلول<br />حلول<br />حلول<br />اطالب بان يكون شرطا اساسيا من عرض المشكلات ان يتم عرض حلول لتلك المشكلات ولو حلول بسيطه.<br />اللهم العن من استحل اعراض ودماء المسلمين<br />آمين<br />وفق الله الجميع"
