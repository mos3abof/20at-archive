posted = "2006-03-26"
text = "القضيه مطروحه من مده احنا اللي مش عيزين نعترف بوجودها في مجتمعاتنا .هي موجوده وللاسف بكثره اي اصبحت ظاهره . وربنا يسترها مع كل المسلمين.<br />اما بالنسبه للاخ شمحطجي ليس من حقق التكذيب ولاكن ساعد في الحل ولو بكلمه عزاء للمنكوبين ولو مش عايز تواسي قول الحمدلله الذي عافاك وابتلى به كثيرا غيرك.<br />اما كلمتي للمنكوبين لانها افزع من المصيبه اي نكبه ربنايصبركن ويعوض عليكن باذن الله"
