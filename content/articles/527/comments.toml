author = "قذائف الحق"
posted = "2006-01-31"
text = "السلام عليكم<br />الموضوع موجود فعلاًً و لكن لي بعض الملاحظات<br />1-البعض منا يستقي معلوماته من النت و البلوجرز و المشكلة أن أي شخص يمكنة كتابة أي شئ دون تدقيق و كثير -و أقول كثير و ليس كل- من المعلومات التي تكتب في هذا الموضوع أصحابها مغرضون و كاذبون يؤلفون هذه المواضيع بغرض نشر الفاحشة في المجتمع المسلم.<br />ثانيا يصف المولى سبحانه و تعالى المؤمنون بانهم يمرون باللغو كراما و إذا خاطبهم الجاهلون قالوا سلاما و لكن بعض الاخوة يصرون على الد على اللغو بلغو و فحش أكبر منه<br />3-بعض -و اقول بعض و ليس كل أو معظم- من وقعن في الفاحشه يدعين الاغتصاب لتمرير فعلتهن<br />4-مراعاة أحكام الاسلام و بعض تقاليدنا يمكنها تقليل -و أقول تقليل و ليس منع- حجم هذه الكارثة مثل:<br />ا-احتشام البنت و التزامها بالزي الشرعي<br />ب-عدم تأخر البنت خارج المنزل<br />ج-عدم اختلاء البنت مع غريب (مدرس - سائق -خادم -......)<br />د-تعويد البنت على الشجاعة وقوة الشخصية من صغرها حتى تكون قادرة ردع من تسول له نفسه مثل هذه الجريمة<br />ه-تعويد البنت أن لها خصوصيات لا تسمح لاحد بمسها أو النظر إليها حتى أقرب ألاقربين و احترام هذه الخصوصيات من أقرب الأقربين -حتى الأب عليه احترام خصوصية البنت- و منذ الصغر<br />6-وجود علاقة دافئة داخل الأسرة ووقت للنقاش بين الأب و الأم و الابناء<br />7-اشباع الجانب العاطفي للبنت<br />8-عفة الاب منذ الشباب رحم الله الشافعي<br />عفوا تعف نساؤكم في المحرم ..... وتجنبوا ما لا يليق بمسلم<br />إن الزنا دين فإن أقرضته ..... كان الوفا من أهل بيتك فاعلم<br />يا هاتكا حرم الرجال وقاطعا ..... سبل المودة عشت غير مكرم<br />لو كنت حرا من سلالة ماجد ..... ما كنت هتاكا لحرمة مسلم<br />من يزن يزن به ولو بجداره ..... إن كنت يا هذا لبيبا فافهم<br />من يزن في قوم بألفي درهم ..... يزن في أهل بيته ولو بالدرهم<br />9-الاستعانه بالله سبحانة و تعالى و دعائة<br />هذا بالنسبة للبنت و يبقى جزئان اخران ليسا أقل أهمية بالنسبة للولد و بالنسبة للمجتمع عسى الله أن يوفقني أو يوفق أيا من الاخوة لاضافتهم قريبا<br />و السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

[[comments]]
