text = "العبره مش بعدد اللي مروا بالتجربه دي او هم مين او قالوا ولا لاء العبره بوجود ظاهره زي دي وسوا قالوا او لا فهي للاسف موجود وعلي فكره مش بس البنات اللي بيتعرضوا لحاجه زي كدا الاولاد كمااان بيتعرضوا لحاجه زي كدا من بنات اكبر منهم ومش بالحلوي والشيكولاته هذه المره وانما بلعبه عريس وعروسه المهم ربنا يستر علينا وعلي المسلمين جميعا يارب ويجعلوا عامر"
