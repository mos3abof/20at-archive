[[comments]]
order = 38
subject = "الى كل اخت مما اصابها من نار الدنيا"
author = "جمال احمد المصرى"
posted = "2006-03-11"
text = "اولا السلام عليكم ورحمة اللة وبركاتة<br />ابدا كلامى بتعاذى وموساتى الى كل اخت اصابها هذة الداء العين من بنى الانسان حتى ولو كانت مسيحية فهى انسانة اولا واخيرا وديننا شرع الحق للعباد ولا يفرق بين اى انسان على وجة الا رضوبعد<br />اولا الى كل اخت كريمة واختى فى دينى دينى محمد الا تياس فاللة علمة وسع كل شى ولا تخافى من الذمن ومن البشر ابدا وتذكلرى ان رب كريم انتى فى حماة وهو معكى فعندى اقتراح طيب واتمنا ان تفهمى كلامى لو بكلمة واحدة كل منا خطاء سوا كان بنت او ولدولا اعنى كنت واحدا من هولاء والعيذ باللة ولاكنى اقتراح ان كل منكم تعش حياتها كاملة واول طريق لها فى راحتها ان تعلم والدتها لاذم لاذم وهى تقدر حتى ترشدك فعندها اذحتى نصف هموممك وثانيا تعلمى ان من خير ما تثقين بهم من شباب اقولها وانا واحد منهمان تقبلى بقلبك وعقلك كل من يكن الدين عنوانة ولغتة وحياتة فهو هذا خير الارض واقسم لكى باللة ان كلامى ليس فية حرفامنافقا لكى فعليكى حين ان تودين ان تفتحى قلبك عليكى بالمسلم المتمسك بدينة ودينة هو لغتة بمعنى انة على لسانة دائما للذكر والارشاد فى الحياة ولكى الاجابة على الباقى<br />فالذى يعرف دينة وهو لغتة هو اقرب شخص الى ربة وتمسكا بسنة نبينا محمدا وحين ان كان يتقرب منكى وتودينة ان يكن لكى فبعد ان يتقرب منكى فى التعرف بكى وتثقين بة انة يريدك زوجة صدقينى اذكر لة ما بداخلك واعلمى ان ردة بالاجابة عليكى بانكى احسن انسانة وذلك لانى اعتيطية الثقة لذاتة واحتراما لة وهو يتفهم جدا لانة يعرف الخلق الطيب والرحيم وحينها يحترم شخصك ويتمسك بكى اكثر وهذا بصدق وان كان لا قدر اللة لا يريد ان يرتبط بكى صدقينى انة هو امن الناس على سرك بعد امك وابيكى وانتى تتفقين معى على ذالك واعلمى ان الدين هو عصمت الحياة وان كرمك ربك فاعلمى ان تردى الدين الا وهو ان يكن بيتك على منهج الاسلام والتوعية والتمسك بة وسوف تكونين اسعد الناسواقبلى حياتك معة فى حلوها ومرها واطيعى تكسبين الدنيا والاخرة وصدقينى كل كلمة منى كتبتها من اخ صادق ويتمنى لكى السترة والسعادة والحياة السعيدة ولكى منى اغلى سلام وذلك اكرر سواء اخت فى اللة مسلمة او انسانة مسيحية فكلنا بشر وربى معكم واذكرونا بالدعاء<br />امضاء شاب مسلم مصرى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113516/http://www.20at.com/article2.php?sid=178"

