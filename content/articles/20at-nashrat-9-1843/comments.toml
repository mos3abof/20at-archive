subject = "ما وراء الصورة"
author = "منار"
posted = "2006-03-06"
text = "الجماعة بيقرؤا سورة الفاتحةعلى شهداء الامة الاسلامية، ويقولون وداعاً للقاومة، وتعبنا من الهروب والاختباء وحمل السلاح ، وحان الأن موعد السهر واللعب والضحك ."
