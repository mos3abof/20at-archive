[[comments]]
order = 0
subject = "ما وراء الصوره كتيييييير"
author = "نيفين"
posted = "2006-03-05"
text = "اللى ممكن اتخيله ورا الصوره شعب مغيب و مضاع داخل اراضيه<br />اللى ورا الصوره اطفال بتتعلم ف الطفوله تمسك الاحجار بدل االعرايس و الالوان<br />اللى ورا الصوره على اليمين ارمله و على الشمال هناك اهوه شهيد<br />و ف الجنب طفل اسمه محمد الدره<br />ورا الصوره كمان ناس ماتوو لسه ماندفنوش و اسمهم العرب زى ما قال نزار<br />ورا الصوره ناس مشرده عايشين اموات ف المخيمات مش عايزين ينتظرو مفاوضات تانى لانهم كدا بينتظرو جودو<br />عايزين تعرفو مين اللى صور الصوره و صور كتير<br />شبح اسمه الصمت العربى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152750/http://www.20at.com/article2.php?sid=520"

[[comments]]
order = 1
subject = "الراجل اللي شعره ابيض دا ولابس نضاره"
author = "هبهوب"
posted = "2006-03-05"
text = "اوعي تبص وراك هضربك بقولك اهو , وعندك حق يا نفين , انزف يا جرح المسلمين يا علي حق ضاع علي قلوب المجروحين تحت الرماد بنحكي ونقول مجدنا والماضي كاره زلنا .<br />والمشهد مالوف يا جدعان الجزيره قرفانه بيه 24 ساعه ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152750/http://www.20at.com/article2.php?sid=520"

