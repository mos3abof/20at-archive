[[comments]]
order = 0
subject = "و لا يهمك يا ابو ايتو عندى انا الشاى ده"
author = "مناضل أنترنتى قديم"
posted = "2006-03-09"
text = "عارف ياد يا ايتو يا ابو شقيق على النعمه العالم ديه متغاظين منك علشان انت نجم كبير و لعيب خطير و ايه يعنى لما يعملولك صوت قرد كل لما تلمس الكوره مش دارون بتاعهم بيقول ان الأنسان اصله قرد يمكن قصدهم خير و عايزين يقولوا لك ما تتغرش انت اصلك انسان بالذمه انت احسن و لا المسلمين و العرب اللى اتحبسوا فى ابو غريب و لا بالله عليك الناس بتوع جوانتانامو و لا انشا الله عن الأمريكان ما ناموا<br />عفوا يا ساده اعذرونى فهذه كلمات انسان مفروس و حانق وفاض به الكيل<br />بالله عليكم اهذا جديد على الغرب المتخلف و الذى ينعت نفسه زورا بانه الغرب المتحضراليس هم الذين يكيلون الأتهامات و حتى بدون تحرى للمسلمين لمجرد وقوع اى حادث فى اى مكان فى العالم اليس هم الذين سبوا الحبيب صلى الله عليه وعلى اله و صحبه وسلم بدعوه حرية التعبير و على الجانب الاخر لا يجرؤ اى منهم لمجرد التشكيك من قريب او بعيد بالمحرقه النازيه لليهود اهناك عنصريه و اضطهاد اكبر من ذلك ايها الغرب الفاسد اخلع عنك قناعه البراءه<br />اما انت يا ايتو فيكفيك حسن خلقك و تواضعك الشديد الذى شهد به كل من عرفوك و يكفينا نحن مهارتك التى نستمتع بها<br />و حسبنا الله و نعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142653/http://www.20at.com/article2.php?sid=547"

[[comments]]
order = 1
subject = "بالعكس"
author = "mark"
posted = "2006-03-10"
text = "لا ياايتو اوعى تزعل واللهى ناس كتير اوى بيحبوك هناك<br />مش علشان واحد ولا اتنين حاقدين عليك يبقى الكل كدا لا<br />لكن الاغلبية بيحبوك هناك وبيهتفولك مع كل كورة لانهم ناس بتفهم اللعب الصحيح وتقدرو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142653/http://www.20at.com/article2.php?sid=547"

[[comments]]
