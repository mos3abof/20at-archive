[[comments]]
order = 3
subject = "و ماذا عن امه مضطهده"
author = "نيفين"
posted = "2006-03-11"
text = "يا جماعه دا لاعب<br />امال لما الامه الاسلاميه تكون مضظهده<br />عموما دا بيفكرنى بحكايه هانى رمزى اللاعب المصرى الكبير لما اضطهدوه و كان هيروح ورا الشمس لما رفع ايده ف الملعب بحركه عشوائيه فسرها البعض(و البعض دول وسطنا و ف كل مكان)على انها اشاره النازى<br />و انا مره ف احدى قصائدى(بكتب شعر اه)قلت مره جمله كدا و الدنيا قامت و مقعدتش لما القصيده اتنشرت<br />معلش بتحصل ف احسن العائلات يا عم ايتو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142653/http://www.20at.com/article2.php?sid=547"
