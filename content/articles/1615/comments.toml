posted = "2006-02-14"
text = "اكيد جيمس كولتون دا عاوز العباسيهازاي دي احلى صوره لمايجيب صورة واحده باين عليها البؤس ويقول احلى صوره طبعا ماهو اللي زيه بيستمتعو بالصور اللي من النوع دا وهي دي الصور اللي بتعجبهم انك تحط ايدك على بقك وتخرس وماتنطقش بحرف واحد وتكتم نفسك خالص لو عرفت (عشان خاطر ماما امريكا تحبك وتجيب لك شيكولاته )"
