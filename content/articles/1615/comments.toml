subject = "ان الانسان بلا حب ذكرى انسان"
author = "نيفين"
posted = "2006-02-14"
text = "هى دى الحياه<br />ضحكتين و اه<br />يا ريت نشوف اللى اتمنيته يوم يا اكرم و تصدق مقوله مصطفى محمود حين قال سوف تتحطم اسرائيل الكبرى على صخره الاسلام<br />بس صدقنى كتير دموعنا هى اللى بثبتلنا اننا لسه بشر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150754/http://www.20at.com/article2.php?sid=420"

