order = 0
subject = "انا ليا تصور تانى خاااااالص ف الموضوع دا"
author = "نيفين"
posted = "2006-02-12"
text = "انا بقى الصوره اللى بشوفها اهم صوره ف حياتى و اللى لا انا و لا كتير زيى مش ممكن يتسوها<br />الصوره اللى وقفت الزمن عند يوم معين ميتنسيش<br />الصوره اللى وقفت الزمن علشان تفكرنا بالذل<br />الصوره اللى ضمت شخصيت بس لكنها جمعت مليون الف احساس بالهوان و ميت الف اه<br />هى صوره الره اللى مات ف حضن ابوه و هو بيقول ............<br />كملو انتو بقى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150754/http://www.20at.com/article2.php?sid=420"

