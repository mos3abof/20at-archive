subject = "اجمل مأساه"
author = "أكرم"
posted = "2006-02-12"
text = "ليه اجمل صورة تبقى دايما مأساه ؟؟؟<br />انا احب انا اجمل صورة في 2099 هي دخول الرؤساء العرب و المسلمين الي ساحة المسجد الاقصى ليصلوا صلاة الغائب على كل شهداء الذل و هوان الصمت العربي القاتل ( أي قتلتني يا مجرم ) و طبعا يكون اليهود انسحبوا الى صياصيهم ( حلوه صياصيهم دي )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150754/http://www.20at.com/article2.php?sid=420"

