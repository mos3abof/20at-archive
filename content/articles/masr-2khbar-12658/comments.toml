author = "كلة فى الادراج"
posted = "2009-07-15"
text = "النظريات الحديثة والابحاث عندنا كتير قوى<br />وكلة فى الادراج<br />ولو واحد عايز يطبق اى نظرية حديثة هيطلع لة الف واحد يقول لة انت اللى فالح وانت بس اللى فاهم واحنا لا<br />التعليم فية نظريات كتير وكلام كتير وملخص الكلام<br />نشوف المقررات البريطانية فى المدارس البريطانية ونترجمها بالحرف وندرسها زى زمان فى المدارس ونضيف عليها اللغة العربية والدين<br />الهند وباكستان عاملة كدة<br />وماليزيا ايضا كدة<br />هاتوا المقررات البريطانية وترجموها ورجعوها تانى<br />امريكا ودتنا فى داهية"
archived = "2009-07-16"
capture_url = "https://web.archive.org/web/20090716142649/http://www.20at.com:80/masr/2khbar/12658-2009-07-15-09-28-16.html"
