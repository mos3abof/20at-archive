text = "والله البنت دي نموذج مشرف للفتاه العربية عموما وللفتاة العراقية خاصة بدل الناس كلها ماهي شغالة تقارن بين نانسي عجرم وهيفاء وهبي ، وهي فعلا استطاعت انها تعبر عن معاناة بلدها وشعبها من خلال التكنولوجيا شكرا ياعشرينات على الموضوع المتميز ده وللامام"
