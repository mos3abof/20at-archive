[[comments]]
order = 1
subject = "كلمات أقوى من وقع الرصاص"
author = "مناضل أنترنتى قديم"
posted = "2006-04-13"
text = "السلام عليكم ورحمة الله و بركاته<br />احيانا تكون للكلمات وقع أقوى من طلقات الرصاص هذه الفتاه نموذج للقهر فى البلاد العربيه فلقد فقدت عملها و أمانها تحت وطاة نيران المحتل و عشوائية التفجيرات التى لا نعلم من أصحابها و إن كنت على قناعه تامه بأن اغلب هذه التفجيرات بتدبير من المخابرات الأمريكيه و الموساد ليس من باب إلقاء اللوم على الأخر و لكن بشىء من التفكير المتريث نكتشف أن هذه التفجيرات تطول فى أغلبها المدنيين العراقيين و ليس جنود الاحتلال علاوه على ان هذه التفجيرات تضمن بقاء قوات المحتل بحجة غياب الأمن و الامان<br />أن هذه الكلمات و التى تشبه اليوميات يوميات شخص مقهور تذكرنا بكلمات الشاعر الراحل نزار قبانى و أن كانت الكلمات قد تخلت عن رداء الشعر وارتدت رداء همهمه مع النفس او فضفضه فى النهايه هى تعبر عن معاناة جيل بأكمله من الشباب العربى جيل من الشباب اما واقع تحت قهر و ظلم الاحتلال و أستباحته لكل شىء المال .. الأرض .. العرض .. الثروات .. الامان .. الحريه أو واقع تحت وطأة وبطش أنظمة حكم فاسده تشبه شجرة الجميز العجوز التى ليس فوقها ثمار و التى أصبحت جذورها الفاسده ضاربه فى الأرض بعمق<br />و لكن متى نخرج من مرحلة الكلام إل الفعل و التنفيذ إن الظالم يا ساده لا يعترف إلا بمنطق البقاء للأقوى و سواء كان هذا الظالم محتل غاشم او نظام حكم فاسد فلن يزول إلا بقوه تعيين الحق على ان يعود لأصحابه و ليس الحل دائما العنف و التفجير و دائما يكون الحل فى قوة الأيمان بالله و التمسك بشرع الله و قوة العلم و قوة الإراده و لكى نحوذ هذه المفاتيح فيجب على الجميع أن يعمل و يجد و يجتهد و ينجح كلا منا فى مجاله و يتمسك بشرع الله و يعض عليه بالنواجذ حتى تختفى من حياتنا ......... حالة منحنى النهر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133302/http://www.20at.com/article2.php?sid=693"

