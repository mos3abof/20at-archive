[[comments]]
order = 4
subject = "الحرية و حرية الوطن"
author = "ابن الوطن الحر"
posted = "2006-03-21"
text = "في لبنان تحول .يوم عيد العشاق الي ؟؟؟؟؟<br />عيد العشق .وعشق حب لبنان والوطن الغالي .اصبح الشعب البناني ؟؟؟؟يحب الون الاحمر و شعارة الون الازرق؟؟؟؟؟؟<br />نحن علي عهد الشهيد ماضون نريد الحقيقة<br />من المستفيد.بقتل الحريري .اقول لكم الغرب لائنهم خائفون من لبنان هذا البلد الصغير...اقول بصراحة تامة ..انة في صيف<br />سنة؟؟؟2004 قبل استشهاد الحريري كان موسم السياحة مزدهر عاد لبنان الي عهدة السابق سواح..من كل صوب؟؟عرب واجانب ...<br />لقد كان الغرب و بعض الدول العربية....<br />خائيفون من هذا الوضع؟؟لبنان يعود الي ايام زمان..اقول الي العالم كلة عندما..يتكلم الشعب البناني الجميع يسمع<br />لقد خاف .العرب من رفيق الحريري .انة المارد العملاق.لايخاف من احد سوي اللة<br />لماذا يذهب العرب الي لبنان.هذا خطر علي الدول المستفيدة من قتلة؟؟نحن نحب بلدنا<br />لقد علم الشهيد.ان الوطن اغلي من كل شيئ<br />في العالم العربي ابطال هذا العصر هم<br />عمر المختار جمال عبد الناصر الملك خالدبنعبد العزيزوالشهيد ابو بهاء.رحمهم اللة رب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124944/http://www.20at.com/article2.php?sid=443"

