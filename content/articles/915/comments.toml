order = 0
subject = "عرس الحرية"
author = "ابتداء ، أبارك للشعب اللبناني الحر الكريم هذه المظاهرة المطالبة بالحرية والديمقراطية والرافضة للبولسية والمخابراتية ."
posted = "2006-02-14"
text = "لقد -والله - أحيو فينا بعد أن كدنا أن نفقدالامل بل لعلنا فقدناه في أن الشعوب العربية قادرة على صناعة الاحداث ، ونزع حقوقهاالمستلبة ، ووضع حد للظلمة.<br />فحياكم الله -يا شعب لبنان - وبارك فيكم.<br />فلقد -والله - ضربتم مثلا يحتذى ، فأكملوا المسيرة ببناء لبنان حر يقوم على المؤسسات والولاء للدولة اللبنانبة فقط."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124944/http://www.20at.com/article2.php?sid=443"

[[comments]]
order = 1
subject = "نجاح لبنان نجاح للعرب أجمع"
author = "يا شباب لبنان الحر ، اعلموا أن نجاحكم في بناء لبنان حر يقوم على المؤسسات والتداول على السلطة والشفافية والولاء للوطن ، واستقلال القضاء ، ليس نجاح لكم في لبنان فقط ، بل هو نجاح لنا نحن العرب أجمع ."
posted = "2006-03-01"
text = "فامضوا راشدين على درب الحرية والديمقراطية ، فنجاحكم ديمقراطيتكم سيشعل فتيل الديمقراطية في جميع انحاء وطننا العربي المغلوب على امره ، وفقكم الله ، وسدد خطاكم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124944/http://www.20at.com/article2.php?sid=443"

[[comments]]
order = 2
subject = "يجب"
author = "عصام"
posted = "2006-03-12"
text = "يجب ان يعرف الساة مرسلو التعليقات والمرحبين بانعتاق اللبنانيين من السيطرة السورية المزعومة ان هؤلاء الزعماء اللبنانيين الداعيين للتظاهر هم انفسهم ولقبل سنة كانو العماد الاول والداعم الاساسي للوجود السوري في لبنان . وقد تقير موقفهم بعد تغير البوصلة السياسية العالمية واصبحت اميركا هي المفتاح الاساسي للمنطقة .. كما يرجى التنويه ان هؤلاء الساسة اللبنانيون المحتفلين بالحرية هم نفسهم الذين ذبحو الحرية طوال ثلاثين عاما .ز في حرب اهلية طائفية قذرة راح ضحيتها اكثر من مئة الف قتيل مدني لبناني .. هل يمكن لاي واحد فيكم ايها السادة ان يخبرني كيف يمكن لزعيم طائفي قاتل مثل وليد جنبلاط وسمير جعجع ان ينادي بالحرية وان يكون مثالا للوطنية .. حقا انه زمن اعوج وللشعب اللبناني اقول كما تكونو يولى عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124944/http://www.20at.com/article2.php?sid=443"

