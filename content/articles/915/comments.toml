[[comments]]
order = 6
subject = "عاشقة سعد"
author = "xxxxx"
posted = "2006-05-17"
text = "استشهد الرئيس الحريري لأنّه حرّ ولأنّهم عبيد قتلوه.يا سعد بيروت أولاً يسعدلي مساك الحلو وتقبرني طلتّك شو حلوة.إنت مثالي الأعلى وحلم لبنان وأمله.الله يرحم الشهيد, وما يرحم يللي قتله،ما حدا يقول إنّو إسرائيل هيّ يللي قتلت الشهيد لأنّو هيدا بيصير ضحك على الدقون. بسّ الحمدلله لأنّو حررّنا من الشقيقة وانا فتاة لبنانية لي الشرف بأني لبيت طلب الشيخ سعد ونزلنا في 14آذار وحررّنا وطننا لبنان من الوصاية السورية.لبيك يا غالي يا غبن الحبيب.أنا كتير حابّة شوفك وأحضنك لأنّو كتير كتير بحبك.وبتمنّى من كل قلبي إنّو تكون عم بتشوف تعليقي. نيّال لبنان لأنّو انت فيه. والحمدلله إنّو انا لبنانية لإتصبّح وإتمسّه بهذا الوجه الحلو.نحنا بنفديك بأرواحنا بس انت شاور يا غالي. الله يحميك ويقويك على يللي بيعاديك لتفضل منوّر لبنان ولتكيد العزّال ّّ.ونحن على دربك سائرون."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124944/http://www.20at.com/article2.php?sid=443"

