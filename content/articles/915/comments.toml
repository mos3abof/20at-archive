text = "السلام عليكم ورحمة الله وبركاته ,,,<br />أرجو من الذي يقرأ هذه الرساله أن يساعدني على أن اتوظف بشركة سعودي أوجيه بالسعوديه للأنني لا اجداي عمل لي وحالتي الماديه سي جدا\" فأرجو منكم كسب الثواب بي وذلك من يعرف اي شخص من أسرة الشهيد الشيخ رفيق الحريري .<br />رجاءا\" رجاءا\"<br />وشكرا<br />الأسم : هاني خالد<br />الجنسيه : لبناني<br />مقيم بالسعوديه بمدينة جده<br />رقم الجوال : 0507590070<br />البريد الألكتروني : hanianterhani88@yahoo.com"
