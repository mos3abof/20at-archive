[[comments]]
order = 0
subject = "على حسب"
author = "نسمه"
posted = "2006-01-28"
text = "أولا بحب أهنيكم على الموقع الجميل .. بحس فيه برتم مجاري للعصر ومواضيع مواكبة للأحداث وأول مره أشارك بتعليق فيه.<br />ما وراء الكواليس إحنا كمشاهدين بنحسه بعد الفاصل .. بنحس إن الضيوف كانوا مشغولين بمناقشة في الفاصل والجو العام اهدى وفي نقط معينه تثار للحوار بعد الفاصل لم تكن مطروحه قبله .. واهم شئ بيؤثر على الضيف هو المحاور ( مقدم البرنامج) حيث يستطيع أن يمتص توتر ضيفه ويساعده على الإسترخاء , أو يزيد من حدة توتره .. فبتصور إنه البرنامج كله بيعتمد على ذكاء المحاور وسرعة بديهته .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131300/http://www.20at.com/article2.php?sid=344"

[[comments]]
order = 1
subject = "تعليق التعليق"
author = "أكرم بس"
posted = "2006-01-28"
text = "صديقتنا بسمه الجديدة في الموقع<br />احب اقولك ان الموقع اللي عاجبك ده بايظ دلوقتي<br />زمان كان احلى بكتير قبل ما يتباع<br />الروح صحيح لسه موجده<br />بس للاسف روح بلا جسد<br />و جسد بلا روح زي روح بلا جسد<br />نفسي باب كلاكيت يرجع تاني<br />و نرجع لعشرينيات شباب النت كشعار تاني<br />و الاسطى مجاهد فينه<br />انا بصراحه مقريتش الا التعليق بتاع بسمه و بفكر اللي قايمين على الموقع بالموقع القديم ( انا عايزه يرجع و ماليش دعوه ) و ادعو رواد الموقع القدامى بقول رأيهم او نقدي لو كنت غلطان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131300/http://www.20at.com/article2.php?sid=344"

[[comments]]
order = 2
subject = "طلب من عشرينات"
author = "السلام عليكم"
posted = "2006-01-28"
text = "اعتقد انه عشرينات سمعت زي اي حد تاني بقضية تهجم الدنمارك على الرسول صلى الله عليه و سلم<br />لماذا لم يطرح اي موضوع حتى الان ؟؟؟<br />و السؤال الاهم : لماذا لم يطرح اي موضوع للتعليق على ما قامت به المملكة العربية السعودية جزاهم الله خيرا و ردهم كان اقوى رد على المستوى الحكومي ؟؟؟؟<br />اتمنى ان لا يكون اخوانا في عشرينات بيكتبوا عن الدول العربية الشقيقة في النقد و التهجم و السلبيات بس زي لاصحافة الصفراء .. اتمنى انهم يشدوا على ايد اللي يقدم خدمة للاسلام و يشيدوا بيها زي ما بتنتقدوا بشدة و احيانا باسلوب مش كويس الحاجات الخطأ في بلدانا العربية<br />و لا ايه يا عشرينات ؟؟<br />خلينا نكون حقانيين مع الناس ، و اللي كل شوية يقولي آل سعود و آل ما عرفش ايه يا ريت يتكلم دلوقتي و يقول ال سعود عملوا ايه لنصرة محمد صلى الله عليه و سلم<br />جزاكم الله عنا كل خير يا اهل السعودية و كل مسلم في اي بلد مسلم قدم حاجة في القضية دي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131300/http://www.20at.com/article2.php?sid=344"

