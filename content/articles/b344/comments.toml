[[comments]]
order = 5
subject = "اضم صوتي"
author = "أضم صوتي لصوت الاخ يا ريت نخصص مساحة كاملة لموضوع الاساءة للنبي محمد صلى الله عليه و سلم"
posted = "2006-01-29"
text = "و اقترح انه الموقع كله يبرز هذه القضية و ان نجعل هذا الاسبوع اسبوع محمد صلى الله عليه وسلم من خلال طرح مواضيع عن النبي صلى الله عليه و سلم بعنوان اعرف نبيك و مواضيع توضح موضوع الاساءة الدنماركي و رصد كامل لموقف المسلمين يوميا في كل مكان<br />و ممكن نخصص مكان بحيث كل واحد يكتب التحرك اللي حصل في بلده<br />انتوا فين يا عشرينات من القضية دي ؟؟؟ نمتوا و لا ايه ؟؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131300/http://www.20at.com/article2.php?sid=344"

