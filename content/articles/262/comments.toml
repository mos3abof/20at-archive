[[comments]]
order = 8
subject = "احمد خان"
text = "السلام عليكم ورحمه الله وبركاته<br />احب اولا ان اشكر الاستاذه عبيرصلاح الدين على المقاله<br />الاسباب المذكوره في اول المقال هى اسباب تخص مصر تقريبا او بعض الدول العربيه ولكنها لا تنطبق على الدول الاوربيه ونقط اذاكر ازاي فعلا جيده والطريقه التي كتبت بها صحيحه بس الي ينفذها<br />المشكله الي احنا بنواجهها بجد في مصر هي مكتبه الجامعه الي بيسكنها عفريت فعلا محدش بيسال عن مكتبه الجامعه وتقريبا محدش بيدخلها ليه؟؟<br />لان احنا تواعدنا انا احنا ناخد المعلومه من فم الدرس الثانوي يعني زي مايكون بيرضعهالنا<br />في حاجه تانيه البني ادم الى داخل الجامعه وما تعملش مع بنات خالص بحس ان هو صعيدي في الجامعه الامريكيه اول ما بنت تقوله كلمه يتهيئلوا ان هي حبته ويحلم بيها بليل ويصحى على كلامها واخر السنه يسقط"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035841/http://www.20at.com:80/article.php?sid=628"

