subject = "بجد بجد ربنا يبارك لكم"
text = "أنا مش فاهم الناس عايزة هيافة هيافة<br />ايه يا جماعة الموضوع رائع وجميل ومعبر جدا<br />منكم لله<br />بس هعمل ايه؟<br />الناس تموت في الكلتشات<br />سلام"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035841/http://www.20at.com:80/article.php?sid=628"

