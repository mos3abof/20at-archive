subject = "مفروسة"
text = "كلام كلام كلام<br />الحاجة الوحيدة اللي بنفهم فيها وما فيش عمل خالص انا سمعت الكلام دة مليون مرة من ساعة ما دخلت الجانعة بس في النهاية حسيت اني فاهمةها احسن من كل اللي تكلموا عشان كدة عرفت ازاي استمتع بيها"
