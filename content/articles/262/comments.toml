subject = "جنكيز خان"
text = "انا دي تاني مره اشارك فيها في تعليقات في هذا الموقع<br />بس كنت عايز اقول اني جيبت اخري من الموضوع ده خلاص ارحمونا يا ساتر ايه ده كل سنه الواحد يقرا عن بدايه السنه ويقعدوا يقولونا دي مش عارف ايه سنه ثالثه ثانوي بلطجه ودي سنه اولى جامعه روشنه ودي سنه اولى فقع خلاااااااااااص"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035841/http://www.20at.com:80/article.php?sid=628"

[[comments]]
