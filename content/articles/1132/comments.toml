subject = "بالعلم تنبؤات الأبراج كاذبة"
author = "امين الشيخ"
text = "أثبت العلم الحديث أن مواقع الأبراج<br />قد تغيرت، وأن الشمس تجتاز في مسارها<br />13 برجاً وليس 12 كما اعتقد الأقدمون،<br />ولايزال الناس يبحثون عن حظوظهم<br />في تلك الأبراج الخطأ!<br />شهد القرن الثامن عشر- عصر الأنوار- تراجعاً كبير الشعبية النجامة. وكان الفلكيون يحصدون بالمقابل شعبية متزايدة مع اكتشافاتهم المدهشة. فقد اكتشف هرشل Herschel أول كوكب شمسي جديد هو أورانوس واضعاً بذلك النجامة بمنظومتها السباعية الأجسام في مأزق حرج. والحق أن النظام البطليموسي القديم كان قد أنهـار تماماً، ومع انهياره لم تكن النجامة وحدها التي عانت من المشاكل! فجميع المعتقدات القديمة كانت بشكل أو بآخر ترتكز على هذا النظام، وبانهاره سقطت مركزية الأرض ومنظومة الكواكب السبعة وتضعضعت جميع المنظومات العقائدية التي تقوم معرفتها الكونية على النظام البطليموسي. وسرعان ما اكتشف كوكبان جديدان هما أورانوس وبلوتو إضافة لآلاف الكويكبات. ومع تطور التقنيات الرصدية بعد منتصف القرن العشرين بخاصة عرقنا أن كوننا ليس أوسع فقط من منظومتنا الشمسية بل ومن مجرتنا أيضا، إذ أكن للمرة الأولى معرفة بنى كونية هائلة لاترى بالعين المجردة ولاتشكل مجموعتنا الشمسية فيهـا سوى هباءة! ولم يكن بإمكان أحد من القدماء بحال من الأحوال معرفة شيء عن هذه البنى وعن هذا الكون الذي تبين أن اتساعه وعظمته يفوقان بما لايقاس جميع التصورات العقائدية التي كانت تنسب للآلهة.<br />وكان علماء الفلك قد تجاوزوا بأرصادهم المنظومة الشمسية واكتشفوا في البداية أن هـناك منظومات نجمية غير منظومتنا. فإذا كانت النجوم المزدوجة تدور حول بعضها فلم لا تؤثر على البشر أيضا كالكواكب؟ وبالمقابل كان الفلكيون قد أثبتوا أن الشمس ليست كوكباً ، وأن النجوم الثابتة ظاهرياً ليست كذلك في الواقع. وهكذا توالت الأسئلة على النجامة، وأهمهـا كان: \" لماذا لم تكشف المنظومة النجامية، إذا كانت متجانسة، عن خلل ولو بسيط في التنبؤات كما كان الحال بالنسبة للعلم مما أدى إلى اكتشاف الكواكب الجديدة في المجموعة الشمسية؟\" وإذا كان تأثير النجوم يتعلق بقوة مجهولة فإن هذه القوة لابد أن يضعف انتشارها عبر المسافة، أما إذا كان التأثير النجامي مستقلاً عن المسافة فلماذا لاتوجد نجامة للنجوم البعيدة والمجرات والكوازارات؟ وكانت هذه الأسئلة أشبه بسؤال ساخر يوجه للمنجمين: فلو كان موروثهم صحيحاً فلماذا لايتنبأ أحدهـم بجائزة لوتو مثلاً أو يعرف تقلبات الأسهم في البورصة ويعلم وكيله بذلك؟ لقد شكلت الاكتشافات الفلكية حقاً ضربة قاسية ومتلاحقة للنجامة.<br />ومع ذلك فقد عادت النجامة للظهور في القرن التاسع عشر مع الرومانسية وعودة الحركات الباطنية، وكانت جاذبيتها هذه المرة تعتمد على القدرات الخارقة التي كانت تعد بها مقارنة بالصناعة والتكنولوجيا، وهكذا تحولت النجامة إلى الجمعيات الباطنية والسرانية إنما دون إهمال الجوانب العملية للحياة كالمهنة والمال والزواج ، وظهر في إنجلترا خلال هذه الفترة منجم اسمه ريتشارد موريسون Richard Morrison أسس مجلة كان من بين اهتماماتها التنبؤ بمصائر الشعوب، ويمكن أن نقرأ فيها مثلاً \"إن سيف الموت المريع يتقدم نحو هذا البلد، وستحدث بلبلة في السوق المالية\" إلخ.<br />ماهي المشاكل التي واجهتها النجامة؟ إن الطالع الفلكي هو جدول يرتكز على كون مركزه الأرض، مما يعني أن النجامة لاتزال ترتكز على النظام البطليموسي. والحق أن النجامة لم تستطع التحول أو التأقلم مع النظام الكوبرنيكي، وهو تحول لن يعني شيئاً في المحصلة لأن المنجمين- يأخذون تأثير الكواكب تبعاً لمواضعها بالنسبة للأرض المركز وبالمقابل، فإن إمكان إنشاء نجامة اعتمادا على منظومات غير المنظومة البطليموسية يظهر كم أن النجامة لاترتكز على أسس صحيحة أو حتى متجانسة بغض النظر عن منظومة الإسناد التي تستند إليهما. ومن جهـة أخرى يمكن أن نتسأءل عن الذين يولدون في الشمال القطبي أو في الجنوب القطبي، فهل غياب الأبراج في هذه المناطق خلال شهور طويلة يعني أن شخصية هؤلاء الناس لم تتطور بالنسبة للذين يولدون قرب الخطوط الأقرب إلى خط الاستواء؟ أليس من الأفضل أن تفسير اختلاف شخصية هؤلاء البشر اعتماداً على المناخ المختلف للمنطقة القطبية؟<br />ومن جهة أخرى، كيف سنفسر أثر الرحلات القضائية على القواعد النجامية؟ لم يكن القائلون بتأثير الكواكب ليتخيلوا إمكان السفر بين الكواكب والوصول إليها لا بل والنزول عليها! ولم يكن خيالهم ليتجرأ على الاقتراض بإمكان السفر عبر سماواتها بل وإلى أبعد من ذلك بكثير والانفتاح على عوالم أرحب وأوسع! ترى أي أثر كان للمنازل- المرتبطة بالأفق الأرضي حصراً- على رائد الفضائل نيل أرمسترونج Neil Armstrong عندما مشي على سطح القصر؟ وإذا أجرينا حسابات الطوالع الفلكية على القمر آخذين بعين الاعتبار تأثير الأرض فهل سيكشف ذلك عن شخصيات جديدة وغير متوقعة؟ من المرجح أن أطفالاً سيولدون في القرن القرن على القمر أو حتى على المريخ، فما سيكون طالعهم؟ وأخيراً، لو افترضنا وجود حياة عاقلة غيرنا في الكون، وهذا شبه مؤكد، فإن دائرتهم البروجية ستكون مختلقة عن دائرتنا تماماً، ومؤلفة من نجوم غير التي نراها من على الأرض. فماذا سيعني لهم عندها برج الجدي أو الجوزاء؟<br />يرد المنجمون والمؤيدون للنجامة على هذه الحجج كلها بأنها ظروف واعتبارات لم يأخذها المنجمون بحسبانهم ، وأنه يمكن بناء مخططات تتوافق مع هذه المعطيات العلمية الجديدة! ومثالهم في ذلك أن المنجمين بعد اكتشاف أورانوس مثلاً أضافوا تأثيره إلي خرائطهم مع ملاحظة أنه يؤثر على المدى البعيد عبر أجيال متعاقبة! والحق أن هذا الموقف يشبه إلى حد بعيد حجة الذين يدافعون عن موروث لم يعد صحيحاً فقط لأن هذا الموروث يرضي جانباً في نفوسهم هو الركون إلى الحلول الجاهزة والخوف من مواجهة المجهول وجهاً لوجه، إن السؤال الحقيقي الذي يجب طرحه على هؤلاء هو مامبرر النجامة أصلاً، ولم يجب أن يضاف إليها دائماً الجديد من المكتشفات بحيث تستمر وهي لاتقوم أصلاً على أساس صحيح؟<br />العلم والنجامة<br />لخص الفلكي بيلي 1780 ( Bailly ) رأي الفلكيين بالتنجيم بقوله: \"إن النجامة هي أطول مرض أصاب المنطق \". ويقول لابلاس: \"لقد استمرت النجامة حتى نهاية القرن السابع عشر وهو العصر الذى بدأت تنتشر فيه معرفة النظام الصحيح للعالم التي دمرت هذه النجامة إلى غير رجعة\"، كذا يجزم الفلكيون والعلماء- وهـم محقون- بأن النجامة لم تستطع مجاراة وتمثل الاكتشافات العلمية الحديثة. وأهم الحجج التي يقدمونها هي أن مفهوم البرج الذي ترتكز عليه النجامة هو مفهوم خاطئ علمياً. كان الأقدمون يتصورون القبة السماوية مثل سطح كرة أملس ثبتت عليه النجوم بحيث أنها تبعد كلها بعداً متساوياً عن الأرض التي تقع في مركز هذه القبة. وكان القدماء يعتبرون أن كل ما يقع من هذه القبة إنما يكون بفعل إلهي غرضه معاقبة الأرواح الشريرة! ولايزال المنجمون حتى الآن يعتمدون على هذه الأسس في فهم العالم كما في قراءة الطالع لكن العلم بين منذ نحو أربعة قرون أن مسافات النجوم مختلفة جداً في بعدها عن الأرض، هذا ناهيك عن أنه لا الأرض ولا حتى الشمس تقعان في مركز الكون إن عشرات ومئات وآلاف السنين الضوئية تفصل عنا النجوم التي نراها في السماء بالعين المجردة. وبالتالي فإن الصلة التي كان يفترضها الأقدمون ولايزال المنجمون يأخذون بها بين نجوم البرج الواحد ليست صحيحة في الواقع. وهذا يعني أن ما نسميه برجاً ليس موجوداً أصلا، فما نراه ليس في الواقع سوى خداع بصري ناجم عن اختلاف المسافات وحجوم وطاقات النجوم.<br />لقد حاول المنجمون في القرن العشرين اكتساب احترام العلم، وكانت إحدى أهم المحاولات تلك التي قالت بوجود أمواج كهرومغناطيسية تؤثر بها الأجسام السماوية على الحياة الأرضية. والمنجمون الذين يتبعون هذه المقولة يعتبرون أنفسهم أصحاب علم جديد هو \"النجامة الحديثة\" ويميزون أنفسهم عن المنجمين القدماء مثل بطليموس أو كبلر. ومع ذلك، فإن منجمين كثيرين إضافة إلى غالبية الجماهير نبذت هذه النجامة الجديدة وكانت ردة الفعل معاكسة تماماً للمتوقع على هذه المحاولة العلمية! فالنجامة هي علم روحي كما يزعمون، والروح لا يمكن أن تخضع يوماً لأي إطار علمي، ويعكس ذلك في الواقع مدى تمسك الإنسان عبر هذه النجامة التقليدية بما هو بالنسبة له حل نفسي لما يعاني منه من شعور بالانفضال عن هذا العالم.<br />لكن هذه الرياضيات كانت ملاذ المدرسة التنجيمية العلمية من أجل برهان صلاحية النجامة بتطبيق الطرق الإحصائية عليها. وهكذا لجأ هؤلاء إلى الحاسوب. وظهر عام 1970 في الولايات المتحدة كتاب بعنوان \"رموز الشمس\" بيع منه نحو مليون نسخة. وتؤكد فيه مؤلفته ليندا جودمان: \"إن الشمس هي أكثر النجوم والأجسام السماوية تأثيراً، بحيث يمكن وضع جدول محدد تماماً لشخصية فرد ولد في اللحظة التي كانت الشمس تعطي طاقتها تحت التأثير غير المرئي لمركز نجامي معين. فاهتزازاتها الكهرومغناطيسية (بغياب مصطلح أفضل على مستوى الأبحاث الحالية كما تقول!) تستمر بتشكيل شخصية الفرد على امتداد حياته تبعاً لبرجه النجامى\". ويمكن اعتبار هذه الأفكار الساذجة إنما ذات الرواج أفضل ما توصل إليه المنجمون الملتفون برداء العلم وقد استفادت هذه الأفكار من التقدم العلمي الذي حققه الفلكيون. فبعض الظواهر المرتبطة بالنشاط الشمسي لها تأثير مباشر على الأرض. فالثورانات الشمسية المرتبطة بظاهرة البقع الشمسية هي سبب تشويش البث الراديوي كما الشفق القطبي، وعلى الرغم من أنه لاعلاقة لهذه البقع بالنجامة، فإن المنجمين سرعان ما تمسكوا بها كما يتعلق الغريق بقشة للقود بتأئير شمسي مباشر على الإنسان واعتبارها بالتالي كإثيات على مبادئ النجامة. وبالمقابل، ولجهل المنجمين بالعلم وتفاصيله الأوسع فإنهم لم ينتبهوا إلى أن الأرض مغمورة دائماً بدفق الأشعة الكونية عالية الطاقة والتي كان بإمكانهـم اعتبارها مصدرا لتأثير نجومي بعيد!<br />وقد حاول النجاميون إيجاد توافقات أخرى بين التأثيرات العلمية المعروفة وأشكال التأثير النجامي. فدرس جون نيلسون John.H.Nelson إمكان ارتباط الاتصالات اللاسلكية بمواضع النجوم وأعلن عام 1951 أن النقل السيىء للاتصالات ينجم عن وجود كوكبين من الكواكب الداخلية الستة في وضعيات التقابل أو الاقتران أو الترابع، وبحسب نيلسون يكون احتمال تشويش الاتصالات كبيرا فى هذة الوضعيات والتي تكون هي سببه المباشر في 93 % من الحالات. لكن تحليلا حديثاً بين لسوء حظ النجاميين أن هذا الأثر يتعلق بالطريقة التي تمت بها الحسابات، فعدد تكرار هذه الوضعيات خلال السنة كبير جداً وهو أعلى بكثير من عدد أيام حدوث التشويش مما يلغي قيمة مثل هذه الفرضية.<br />والحق أن النجاميين لم يكونوا أبداً بمستوى تقديم أفكارعلمية حقيقية داعمة لأفكارهم ، ويعتبر ذلك منطقياً لأن من سيفكر بجدية النجامة بشكل علمي سينتهي إلى الإقرار بزيفها وبطلانها! ومع ذلك فقد وجد النجاميون أن التحليل الإحصائي قد يفيدهـم في إقناع جمهـور أوسع من الزبائن! فمثلاً يقول المنجمون: إن الصفات المرتبطة بشخص مولود عندما تكون الشمس في برج الحمل هي القوة والطاقة، وبالتالي يكون مواليد هذا البرج طموحين ومفعمين بالحماسة ومتصلبين! وهكذا قام المنجمان إيزابيل باجان Esabelle Pagan والآن ليو Alan Leo بجرد مشاهير مواليد الحمل\" مثل ليوناردو دافينشي، جوزيف هايدن، هنري \"جيمس، فينسانت فان كوخ، أرتورو توسكانيني، شارلي شابلن، مارلون براندو..\"، ليبينوا بذلك برهان تنبؤات الطوالع النجامية. فهؤلاء كلهم كانوا فعلاً طموحين وحققوا نجاحات كبيرة. ومع ذلك فإن قائمة أخرى يعطيها المؤلفان لمشاهير برج الجدي \"بول سيزان، هـنرى ماتيس، بابلو كازال، كاري جرانت، اسحق نيوتن، بنيامين: فرانكلين...\" تكشف عن طموحات وبحاحات لاتقل شأناً في المجالات عينهـا! والرد على مثل هذه الإحصاءات المخادعة والساذجة بسيط. فكم من المواليد الذين ولدوا مع كل من هؤلاء المشاهير فى اللحظة عينهـا إنما كانوا بلا طموح ولم يحققوا نجاحات تذكر؟ بل كم من التو<br />08/05/2006<br />اقرأ بقية التعليق .."
