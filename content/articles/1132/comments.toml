[[comments]]
order = 23
subject = "الأبراج علم كبقية العلوم"
author = "علي الشمري"
posted = "2006-08-26"
text = "أخواني الأعزاء علم الأبراج هو علم كبقية العلوم يدرس في كثير من جامعات العالم وفيه من المصداقية الشيء الكثير وهناك عالم فلك كبير يسمى(أبو معشر) قد قسم الشخصية الأنسانية الى 36 حالة أي في كل برج 3 حالات وحسب الولادة يوما وشهرا وفيها 90 بالمئه حقائق . والخطأ الشائع هوأن أغلب الناس يقرأ برجه من الجرائد والمجلات وهم ليسو أصحاب أختصاص وليسو صادقين وأنما الغايه جمع الأموال والضحك على الذقون . وثانيا أغلب الناس لايعرف ميلاده الحقيقي اليوم والساعه والشهر فيتخبط في قراءة برجه ويقول هذا دجل وليس فيه مصداقيه. بالنسبه للمشايخ فكل شيء لديهم حرام في حرام وبعد مدة يتراجعون ويحللونهكما في سياقة المرأة للسيارة وسماع الأغاني ومشاهدة التلفاز وغيرها من المستجات الحياتية أضافة الى أنهم يخلطون بين علم الفلك والأبراج وبين السحر والشعوذه وعلم الغيب وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133014/http://www.20at.com/article2.php?sid=781"

[[comments]]
