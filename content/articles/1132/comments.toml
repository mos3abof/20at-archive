text = "اولا احب اقول لداليا بطلى هبل<br />اة بطل تفتى<br />كفاية فتاوى حرام عليكم<br />ماهى ناقصاكى علشان تفتى انتى كمان<br />ثانيا الابراج الواحد يستفيد منها فى حالة واحدة بس<br />هى ؟؟؟؟<br />هى شخصية كل واحد يعنى اية ؟؟؟؟<br />يعنى انا مثلا حبيبتى برج الجدى اروح ادور فى صفات برج الجدى وهلاقى مثلا انها رومانسية وهادية وعاقلة والعيوب كذا وكذا وكذا<br />بس دا اللى بنستفيدة من الابرااااااااج"
