text = "ببساطة شديدة، الأبراج كلها عبط وتخريف<br />ويمكن معرفة مدى السذاجة لما أفتح الجريدة في أي يوم وأطالع \"حظك اليوم\" لا يوجد فارق أصلا بين العبارات غالبا<br />ففي برج معين تجد مكتوبا \"حاذر من أصدقائك اليوم\" .. وفي برج آخر \"اليوم مليء بالمفاجآت .. خذ الحذر\"<br />وهكذا.. كلها تكهنات متشابهة وساذجة.. وسلم لي على التخلف العقلي"
