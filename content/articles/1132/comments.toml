text = "أحب اقول اني متفقه مع اراء العالم اللي فوق دي , وعندي حته اعتراض صغننه خالص<br />لو ترجعوا لوراء حتلاقوه ان اليهود لما جيبهم يعرفوا المسيح حيتولد ولاه لسه كانت الاشاره المعروفه بواسطه شهب في السماء ومن خلالها تنبأوه بقرب موعد ميلاده<br />حاجه كمان في شخص اسمه \" توماس ديستسودان \" وهو يهودي الماني ولد قبل الحرب العالميه بقرن تقريباً , الجدع دا ليه كتاب مشهور ليه تكلم فيه عن تنبواته بس صعب جدا الحصول علي نسخه دقيقه لان معظمها محرف او مضاف له تنبوات هو ماقلهاش ,المهم لما جيه اتكلم عن الحرب العالميه التانيه قال في واحد اسمه \" هتلر \" او بتلر\" حيحكم العالم والكل حيطيعه وحموت موته مرزيه ودا بالظبط اللي حصل الشخص اللي اتكلم عليه اللي هو\" بتلر \" اتولد في حي فقير جدا وحكم العالم في الحرب ومات موته بشعه<br />واتكلم كمان عن حرب الخليج في مقطع مش فاكره بالظبط ,بس عامه لما كان بيتكلم عن الحرب بوصفها بالعاصفه او اللون الاحمر للدخان<br />كان لما يوصف مشهد حرب يقول \" خنزير راكب حاجه \" ارجع بقفاك لوارء لو انت مكانه ومفيش تكنولجيا لو شفت واحد لبس خوده حتقول عليه خنزير كوصف لراسه<br />الجامده بقي بتاعت 11 ستمبر اللي فيها قال مش بالنص اوي يعني اللي فاكره ماشي<br />تومأن عظيمان ينهاران .....<br />عند 33شرق او 71 غرب ...<br />اللون الاحمر يسري ....الهلع علي الوجوه يقال ان فاعلها الامير زو اللحيه من الاقاصي ...طبعا كان يقصد برجان التجاره العالمي , و33 و71 دي مكان المدينتين علي الخريطه والشيخ اياه \"بن لادن \"<br />غير انه كان مهتم بفن الطب جداً وفي عصره حصل وباء قاتل فهو اللي ايه عمل العلاج بتاعه وكان تقريبا تيفود حاجه زي كدا وابتكر اساليب جديده جدا في فن التعقيم , المهم الحلو ما يكملش مراته صابت بالمرض دا وعكف علي رعايتها ولكمن يا ولداه ماتت , شويه زعل كدا, ورجع تاني للابراج والفلك شهرته طغت في الفن دا اوم ايه بقي ملك البلد طلبه عشان يشفلوه الكف بس الطالع بتاع كان وحش الملك اتغاظ ام جاي ايه نفيه في حته كدا مع نفسيته بعد ام خرج من السجن تفرع لقرايته الاقارب وبس<br />في حتت حلوه تنبا بيه بخصوص نفسه<br />مره واحد صحبه عزمه عشان يشكك في معرفه بالطالع وقاله انا عزمك النهارده علي الاكل وحدبح الخنزير الابيض<br />, اوم عمك توماس يقوله لا انت حتدبح الرمادي<br />ودا بالفعل اللي حصل لما الشخص دا روح لقي ان التعلب كل الخنزير الابيض فملقاش ادامه غير الرمادي ودبحه ,<br />خطيره بقي الحته اللي جي دي ساعه لما تعب الدكتور اللي معالج ليه قاله في احلك الطروف يعني لما تجي تموت اقل حاجه حمشي علي قبرك بهزار يعني ,<br />قاله مش حتلحق ومش حتمشي ورايا الغريب لما مات فعلا الدكتور مرحش كفنه وحصلتله حادثه وقعد في البيت ,<br />\"القبر\" بقي , \" علي لوحه القبر بتاعه كان في لوحه مكتوب عليها اشخاص حيلاقوه القبر دا واحد فيهم حيجيلوه جنون وواحد حينتحر , ودا اللي حصل لما مات فعلا وبعد كام سنه شويه مساطيل كانوا شاربين فتحوه القبر بتاعه واحد طسته عربيه وواحد من هول المفاجاه اتجن , اللي عايزه اقوله ان في ناس فعلا عندها ملكه معرفه الغيب بس دا استثناء للقاعد يؤكدها ولا ينفيها , بس .. خلاص<br />انا عندي تنبوه اني\" حسني في عيد ميلاده الجاي\" حيموت قولو اميييييييين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133014/http://www.20at.com/article2.php?sid=781"

