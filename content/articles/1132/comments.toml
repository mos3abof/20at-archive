posted = "2006-05-09"
text = "على فكرة يا جماعة موضوع الابراج ده مهم فعلا في موضوع الصفات الشخصية لاني فعلا بالاقيها نفس الصفات اللي في الابراج والله العظيم كده وكمان التوافق والتنافر بس المهم ان اللي يكتبها يكون فاهم مش بتوع الجرايد اللي بيصحوا الصبح يهبلوا بس الموضوع حلو قوي برافو انكم طرحتوه وعلى فكرة الموقع منور اليومين دول هو فيه ايه ياعشرينات يارب يكون خير"
