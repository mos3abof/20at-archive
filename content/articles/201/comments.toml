[[comments]]
order = 5
subject = "TM TM"
text = "اعتقد أنه يمكنكى أن تزيدى على مقالة الألومبياد الظريفة: كل الهزائم التى منينا بها فى هذه الدورة لأنى لاأعتقد أن أى من الجرائد الرسمية ينوى جمع كل هزائمنا فى مقالة واحده.<br />أما موضوع سجدة شكر فهناك سجدة كفر قد حدثت عندما فازت العداءة اليونانية فى سباق الجرى بالذهبيه ، وعندها خرج لها مدربها إلى ساحة الجرى فور فوزها وعانقهاوقبلهاوهى بالتالى بعدت عنه مسافة صغيرة وباشرت بالسجود له ، وفى هذه اللحظة قامت أجهزة الأمن بإخراجه من ساحة اللعب حيث أنه ممنوع؟؟؟ شفتى الفرق؟<br />هناك مفارقات كثيرة أرجو أن تكملى الكتابة عنها فى مقالاتك المقبلة وشكرا لكى لهذه المعلومات القيمة."
archived = "2004-09-01"
capture_url = "https://web.archive.org/web/20040901180214/http://www.20at.com:80/article.php?sid=565"

