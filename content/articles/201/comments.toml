subject = "مصري"
text = "سألني أبي لماذا اهتمت قناة الجزيرة بنصر القروج، قلت له لأنه الأقوى والأفضل بين العرب، وقد كان ذلك، وأنا فرحان جداً بهذا النصر، إلا أن نصر مصر الذهبي والبرونزي يبرز لإنها أول انجاز على جميع الأصعدة منذ حرب أكتوبر<br />آآآآآآه يا بلد"
archived = "2004-09-01"
