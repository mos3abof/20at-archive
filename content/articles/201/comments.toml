subject = "المغرب بلد الرياضة والرياضيين"
text = "لماذا لم يتكلم أحدكم عن هشام الكروج الذي رفع رأس هذه الأمة عاليا طوال عقد من الزمن وأخيرا بانتزاعه للميدالية الذهبية في سباق ١٥٠٠ متر...<br />شخصيا لا أفرق بين الأقطار الاسلامية فجميعنا أمة واحدة"
archived = "2004-09-01"
capture_url = "https://web.archive.org/web/20040901180214/http://www.20at.com:80/article.php?sid=565"

[[comments]]
