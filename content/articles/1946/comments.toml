subject = "أرسل هذا التعليق بواسطة : اكتب اسمك هنا"
text = "السلام عليكم*والله العظيم انتو ناس فاضية ومش حاشين بحاجة فيلم جاباحي ولا جنسي ايه وقناة ايه وزفت ايه انتو ليكوا اصلا نفس تشوفه وتتفرجوا وتعلقوا كمان.انا بس عايزة اي حد من الصحفين الكبار ينزل الشارع ويجي عندنا في بورسعيد ويسال الشباب ايه اهتمامتكوا وايه مشاكلكم وبيتفرجوا علي القذارة ديه ولا لأ . شبابنا بيقع واحد ورا التاني من الغلاء الي احنا فيه والمشاكل والبطالة والمرض الي بيطارد الكبير والشاب والطفل والي بيتفرج يعيني عليه والله كان عارف ربنا بس لا عارف يجيب شقة يستر نفسه فيها ولا عارف حتي يخطب ويصبر نفسه ويبقي عنده امل انه حيعمل كده في الحلال بس هو اصلا لا بيشتغل ولا لاقي ياكل اصلا.بالله عليكوا فوقوا بقي واعرفوا ايه الي بيحصل حوليكوا واهتموا الاول بمشاكل الشباب ديه والي بيحصلهم ولانهيار الي حسين بيه<br />انا مبقولش نسكت عن المشكلة ديه لالالالالالا بس بقول حل مشكلنا الاول وبعدين نشوف في وقت فراغهم هيشوفوا ايه وهيعملوا ايه والله لو لقوا فعلا نفسهم ولقوا فرصة لتحسين وضعهم ويعفوا نفسهم مش هيتفرجوا<br />وبرضه مش بلوم عليكوا بس لا بلوم الشباب انتو ليه سكتين ليه مستسلمين سايبن ده يلطش وده يشتم وده يتكلم دافعوا عن نفسكم وريهم انتو ازاي بتتغيروا قولوا مشكلكم اطلبو الحل<br />يا كبار احنا بنضيييييييييييييييييييييييييييييييييييييييييييييييييييع<br />اجتماعيا وثقافيا ودينيا وسياسيا واعلاميا وبنضيع مليون مرة في الدقيقة<br />انا ايمان 21سنة والي مش عاجبه كلامي انا اميلي اهو يرد عليا mony_moon3000@yahoo.com"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202061927/http://www.20at.com:80/20at/arts/3625.html"

