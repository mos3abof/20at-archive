text = "السلام عليكم ,رحمة الله وبركاتة الله سبحتنة وتعالى قال من رأى منكم منكرا يغيرو واضعف الايمان هو القلب ولكن يا اخوانى التربية والقيم والمبادىء والاخلاق هم الاساس وبعدين خلاص كل شىء انصلح حاله وبقت هذة المشكله وشاغلين بها حالنافأذا كان على التغير فلابد من تغير كل شىء وهذا مستحيل من البشر كلها ولكن ان شاء الله سوف يتم التغير من عند الله سبحانة وتعالى لان اصبح المجتمع فى امرض لا يوجد لها حل ابدا وهذا من غضب الله سبحانة وتعالى وربنا يهدى كل انسان يريد الهدايا قبل فوات الاوان لان اصبح مجتمع فاشل ورذيل وكله مشغول بنفسة وبنزواته والله يهدى"
