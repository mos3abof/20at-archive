order = 60
subject = "أرسل هذا التعليق بواسطة : اكتب اسمك هنا"
text = "السلام عليكم ورحمه الله وبركاته ..... وبعد بالنسبة لكل الكلام والتعليقات جميعها يتلخص في ان في فعلن افلام كدة ومش قناة واحدة دة اكتر من قناه ومش بس كدة دة على الاقمار العربية و الاقمار الاوربيه طيب يا جماعة وكل ايلي نفسو حاجة بيعملة ويلي عاوز حاجة بيشوفة ويلي يا عيني علية مش عاوز يشوف بيشوف غصب عنه من الاغاني والفيديو كلب يعني حاجة عليها العجب بصراحة الناس بقه بيتجرو مش بيعرضو موضوع هادف او بناء بلعكس بيهدم تفكير الشباب وتثقيفهم لبر الامان طيب ما تيجي ننظر في صلب الموضوع ونشوفلة حل مش نقول في عن كل ايلي نتمناه ويلي عاوزينه يتحقق وممكن يتحقق في يوم من الايام ان فعلن والاساس عن حل اي مشاكل متعلقة عن فساد بلد والاخص عن شبابنه هي دور الفعال الاساسي للحكومة فين هو من حقوق ومن حق اي حكومة ان تمنع اي عرض من العروض الاباحية وعن التدخين الضار يعني مثلن على شان مطولشى عليكم مثلن زى بلد السعودية تيجي تدخل على النت وتشوف او تفتح اي موقع اباحي مستحيل انه يفتح معك وكمان والاهم في وقت الصلة كلو والمحلات تقفل والناس يذهبة الى الصلاة ويلي مش بيصلي يخش السجن يعني المفروض ان الحكومة ان تكون لديها دور فعال وحل صغير يحل المشكلة كل واحد في المنزل يشفر هذة القنوات الاباحية ولا يتفرج عليها وشكرا"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202061927/http://www.20at.com:80/20at/arts/3625.html"

