text = "اولا كتير من القنوات حاليا ليس عليها رقابة وهنروح بعيد ليه سيبنا من الاجانب ونبص لنفسنا الاول يوجد افلام عربي لا تليق بان تنسب للعرب ومخرجين عرب وبرضو ممثلين فاكرين نفسهم عايشين في اوربا ونسيوا كل ما يتعلق بالدين والاخلاق والعادات و التقاليد وبيقولوا علي الي ينتقدهم متخلف ورجعي وبعدين كل الي يهمهم المكسب سواء المنتج ولا الممثل ولا المخرج ولا صاحب القناة طب يعني مينفعش يكسبوا باحترام شوية ويتقوا ربنا في شبابنا وبناتنا ومتحاولوش تقنعوني ان ده فن اصل كدة هضحك.<br />اهم حاجة يكونوا عارفين ان الي بيعملوه ده عيب وحرام ولو مكنوش عارفين دة تبقي كارثة لوحدها علي العموم انا قلت الي عندي وخلصت ضميري وربنا يهدي قولوا امييييييييييييييييييييييييييييييييييييين"
