text = "أرسل هذا التعليق بواسطة : واحد تانى وخلاص<br />معروف ان نجيب ساويرس مسيحى ومعروف ان معاملة المسلمين للجنس غير معاملة المسيحيين ومعروف ان النيل واحد ومعروف ان T يعنى صليب ومعروف ان رقاصة يعنى جنس ، ومعروف ان يوسف شاهين يعنى علمانية على الحياد ومعروف ان الشباب شافوا الفيلم او شافوا مناظره على الاقل ومعروف ان الريموت ممكن يحول ومعروف ان فيه قناة الناس والحكمة وميلودى ومزيكا والعفاسى . ومعروف كمان ان قنوات البورن ومواقعه بتحقق اعلى نسبة مشاهدة<br />اللى عايز اقوله ان القناة موجودة وحتى لو جمعنا مليون حملة مش هتتقفل بس الريموت موجود و عبد السميع موجود وعبد المسيح موجود والفقر موجود و الكافيار موجود والمرض موجود والساونا موجودة .<br />والـــــ O ممكن تكون شباك او مجرد خرم اوعين او بق او عجلة او زرار ممكن تحول منه . ومش مهم تقولها المهم تاكلها<br />سلام !!!!!!!!!!!!!!!!!!!!!!!!!!!"
