subject = "أرسل هذا التعليق بواسطة : اكتب اسمك هنا"
text = "اهو واحد من العاملين نفسهم من اهل الفضيلة ، طيب يا سيدي و ماله ، انا المصري الحقيقى بقول حسبي الله و نعم الوكيل من كل من يدعى التدين و الفضيلة و يداري تخلف المجتمع وراء تلاكيك ، طيب انت مش عاجبك القناة ما تتفرجش عليها و لا هو ايد فى المياة و ايد فى النار ، يا ناس الكمبيوتر اللي احنا بنستعمله علشان نكتب هذا الكلام مصنوع فى دولة تانية مش كان احسن نصنعه احنا بدل ما نتلكك لبعضنا على الهايفة ، و لعلمك يا سيدي الفاضل اننى مل ليش دعوي بالسيد ساويرس لكن معجب بيه لانه بيساعد الطلبة الموهوبين بمنح من فلوسه و عامل منظمة خاصة لدعم العلم ، مش كدة احسن و لا مهاجمة كل شئ جميل احسن ، يا ناس اصحوا بقى !"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202061927/http://www.20at.com:80/20at/arts/3625.html"

