subject = "أرسل هذا التعليق بواسطة : رغد"
text = "بصو هوا كل انسان بيشتغل بحاجة هوا اختارها بارادتو وبايدو<br />القناة مش بس بتعرض افلام كده ده حتى لو جابت دعاية للقناة ركزو هتلاقو فيها حاجات اباحية من الدرجة الاولى<br />ولكن هي مسألة اختيار اللي عايز يفتح ويتفرج<br />وعلى فكرة القناة بتعرض برامج مفيدة جدا بجد احنا ممكن ناخد القناة دي حتى ولو كانت قاصدة الفساد زي مالبعض قالو لحتى تكون مصدر فايدة لينا<br />والله فيها برامج يومية جميلة بتناقش مواضيع ممتازة<br />فالانسان اللي عارف مصلحتو ومش قاصد اي حاجة تسيء لاخلاقو يقلب لو شاف حاجة غلط ويستثمر اي معلومة بتتقال بالقناة دي عشان تبقى مصدر للافادة"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202061927/http://www.20at.com:80/20at/arts/3625.html"

