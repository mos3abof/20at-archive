subject = "أرسل هذا التعليق بواسطة : واحد من الناس"
text = "على فكرة كنت عايز اسال سؤال (هو نجيب سويرس كان يقصد ايه بالقوى الرجعية)الا هو صحيح نجيب سويرس هايوزع بنات على الخطوط ؟وممكن الواحد يختار بنت مميرة زى الارقام المميزة؟يعنى هو نجيب سويرس بقى قواد ولا هو واحد من القوادين؟طيب لو نجيب ساويرس هايوزع بنات على الخطوط هانستلمها منين من فرع الشركة ولا من حتت تانية+؟؟؟؟؟؟؟؟طيب سؤال تانى هو نجيب سويرس ناوى يفتح قنوات تانية امتى اصلى عرفت ان فى ممثله قديمة اسمها هويدا ليها افلام تجنن منها فيلم اسمه الرسام بس مش بيزيعو افلامها خالص مش عارف ليه؟؟؟؟؟؟؟اتمنى انى اشوف الفيلم دا على واحدة من قنوات سويرس وعلشان تبقى قنوات سويرس رمز للراجل دا ولكل الناس اللى شبهه فاخلاقة وتربيته وجهوده وجهود اللى وراه"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202061927/http://www.20at.com:80/20at/arts/3625.html"

[[comments]]
order = 17
subject = "أرسل هذا التعليق بواسطة : كنيسة"
text = "الاخ اللى بيقول ان مصر فيها جهل جنسى وهو سبب طلاق كتير من الستات انا بهنيه على اسرته الناجحةوعلمهم الغزيروانا عارف امه مطلقتش ليه لحد دلوقتى وبقول لنجوبى حبيبى سيبك منهم دا مفيش غيرى ولو قنواتك اتهاجمت ولا يهمك ابقى تعالى عندى وقول ذيع واحنا هانذيع يا حبيبى وفكك من الكلام دا كله احنا الاصل وهانذيع وطول عمرنا بنذيع ولو نسيت كوكى المحروقى تعالى اتفرج عليه دا بيدرس دلوقت تحت مبدا سياسة الاستفادة من الكوارث ذيع"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202061927/http://www.20at.com:80/20at/arts/3625.html"

