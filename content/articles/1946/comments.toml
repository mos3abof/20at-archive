text = "الكلمه دى اخذتها من الله يرحمه صدام حسين دا لو افترضنا انو مات القناه اللى انتوا مهاجمنها دى اكتر القنوات التى تعاملت بحضاره شديده مع شعب للاسف لايعرف معناها فنحن بالفعل غوغائين .....خلاص سيبتو البرامج الهادفه والتى تعارض وتناقش بشكل جدى قضايا الشعب....وبتتكلموا على المذيعيات اللى كاشفين عن سيقانهم....اللى برده بيتكلموا فى موضوعات شديده الاهميه ....وسايبين الشيوخ من هب ودب شغالين تلوث فى عقولنا ...مافيش حد اتكلم عنهم ليه<br />اصحوا بقى فوقوا ....وبغدين تعالوا مش دى الافلام اللى انتوا بتجروا وراها على النت وبتسهروا الساعات على نزولها<br />على الاقل القناه صريحه بان الفيلم فيه لقطات خارجه ليه بتتفرجوا عليه وبعدين تتفرجوا عليه بالكامل وبعدين تستغفروا ربنا<br />وتدعوا على القناه واللى عمل القناه فى ايه مالكم ايه اللى حصلنا.......فوقوا بقى.......فوقوااااااااا"
