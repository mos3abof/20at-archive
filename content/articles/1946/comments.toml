subject = "أرسل هذا التعليق بواسطة : محمد المصري"
text = "اولا انا مليش علاقه بالمصري اللي رد في الموضوع قبلي ،، انا رأيي ان الشباب يبدأوا يشنوا حملة علي كل شركات ومنتجات سويرس ، مهو مش بفلوسنا يا سعاده الملياردير ،، لازم يبقي في رقابة علي القنوات الفضائية المصرية<br />ولا هم فالحين بس يهددوا بقفل قناه الناس لأن مركزه علي الجانب الأسلامي وبدأت تبعد عن الثقافي وكلام من هذا القبيل ، حسبي الله ونعم الوكيل ، حسبي الله ونعم الوكيل"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202061927/http://www.20at.com:80/20at/arts/3625.html"

