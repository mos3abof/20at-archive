[[comments]]
order = 3
subject = "مع بالغ أسفي للإطالة"
author = "مصري"
posted = "2006-02-26"
text = "مبدئيا أحبذ أن تكون لغة الخطاب منصبة على من تنطبق عليه العبارة سواء بالسلب أو الإيجاب على كل حال : مع احترامي لهذا الفكر الجميل أتمنى أني لم أخدش أناقة كل منهما<br />بالنسبة لمقولة (وراء كل رجل عظيم امرأة)<br />فأعتقد أن نسبة إيماني بها متفاوتة .. فهي ترتفع في نفسي مع تجليها ووضوحها في بعض التجارب وتنخفض أيضاً في نفسي مع انعدام رؤيتها في بعض التجارب الأخرى .<br />لا أشك أن المرأة التي تهز طفلها بيمينها هي تهز العالم بشمالها .. ولكن لا أستطيع أن أعمم هذه النظرة إذ تبقى هناك مسألة ترشيد الطاقة المعنوية التي تمنحها المرأة لهذا الرجل كي يكون عظيماً أو العكس .. كما أن يقيني بأن الرجل ما لم يكن مأهولاً لتلك العظمة فإن المرأة مهما كانت قوية في تشجيعها ودفعها له تبقى تواجه عواقب كثيرة في تحريكه نحو الأفضل .. وقد تصل إلى مرحلة فشل إذا انعدمت أرضية ذلك الرجل من تقبل بذور التميز والعظمة .<br />ربما أستطيع أن أضيف شيئاً على هذه الجملة لتصبح (وراء كل رجل عظيم امرأة إلى المنحدر) وربما أحرّف الكلمة من جديد أيضاً وأقول (وراء كل رجل غير عظيم امرأة إلى الصعود) ..<br />أريد أن أضرب مثالاً للكلمتين :<br />1 ـ رجل يملك من الإبداع ما لا يوصف ، ارتبط بامرأة عدوة للإبداع وأهله .. أرادها أن تحتفي به وتمدحه وتشجعه وتعطيه الوقت والراحة لمؤازرة إبداعه .. تذمرتْ .. تمللتْ .. تأففتْ ، بدأ الإحباط يتسلل بكل خفة ورشاقة إلى قلب ذلك الرجل .. وبدأ إبداعه يتجه إلى الضمور والانطفاء .. فلم يعد ذلك الوهج ولا ذلك الضوء يزين عتمات الحياة ..<br />2 ـ رجل لا يملك من الوسامة والمال إلا الحظ القليل ، رفضته بنات الجيران حين تقدم لخطبتهن .. نظر إليه عمه بالحب والرحمه .. زوجه ابنته الذكية .. أخذت تدعمه بالعطاء وتشعره أنه الأجمل وإن رفضته بعض النسوة .. منحته قلبها وعصرت له روحها في إناء التضحية وقدمته شراباً سائغاً لذة له .. لم يعد يشعر بالنقص بل بدأ يشعر أن للحياة معها رائحة ونكهة جميلة تختلف .. فراح ينشر عبق روحه على المجتمع ويعطي ويقدم .<br />أحياناً ، نجد على سبيل المثال : زوجاً رسم لنفسه أهدافاً وطموحات يسعى لتحقيقها ولكنها خيالية غير متحققة الوقوع .. فهنا المرأة الذكية جداً تجذبه وتلفت انتباهه إلى أن لا يغادر أرضية الواقع كي لا يعيش في أحضان الوهم ومن ثم يرتطم بجدران الخيبة والفشل الذريع .<br />وأيضاً نجد امرأة وصلت من الذكاء أنها حينما ترى زوجها يهوي أو ربما هوى ترفعه على جناح الأمل وتذكره بنجاحات أخرى سابقة له وأنه لابد من السقوط مرة وأخرى ولكن المهم المحاولة حتى النجاح ..<br />أيضاً لا يفوتني هنا سؤال يلح :<br />متى تملك المرأة من الصفات ما يكفيها لتكون خلف الرجل العظيم ؟!!<br />لا يكون ذلك إلا إذا كان الرجل ذاته وفر لها سبل الراحة لتعطيه إياها من جديد .. وأن تكون على اطلاع ودراية واسعة على ما يحتاجه ذلك الرجل من الوقود والدعم وما يأخذ بيده إلى بوابة غد أجمل .. ومن وجهة نظر خاصة فإن الرجل الذي يكدح ويعمل ويثابر ليل نهار كانت المرأة لحضنه هدية من السماء تخفف أعباءه وثقله وتمسح عرقه وآلامه ..<br />ربما السر في إطلاق تلك الكلمة بهذه الرحابة أن المرأة إذا أحبت الرجل فقد أحبته بكلها فيما إذا أحبها الرجل احبها بجزء منه وقسم البقية على نظيرات لها في حياته .. قد لا تكون هذه النظرة صائبة 100% ولكنها الأعم الأغلب على مستوى كبير ومساحة ساحقة من المجتمعات ..<br />أها ، قبل أن أختتم مداخلتي وإن أطلت<br />نستطيع الخروج بهذه الكلمة عما هي عليه الآن فنقول من باب المثال فقط : (وراء كل مستوصف خاص امرأة) فنجدها بكامل الزينة في الاستقبال .. وأيضاً (وراء كل مدير ناجح امرأة) فنجدها بكامل الزينة في السكرتارية .. وأيضاً وهذا أدهى (وراء كل مجموعة للشحاتين امرأة) وهنا قد لا نجدها في كامل زينتها (أصول الشغله ) لأن الوضع هنا يحتم إظهار الضعف والفقر لاستثارة العطف والشفقة . وهذا مع كل أسف استغلال سيء للمرأة من ذوي الضمائر الميتة .<br />طبعاً هذه الأمثلة الأخيرة بما أنها استغلالية وتضع المرأة في مكانها غير الصحيح فهي لا تنطبق على المرأة التي تعرف قيمتها وثقلها .<br />بقي أن أشير أن العظمة ليست هي الباب الوحيد للسعادة .. فقد يكون هناك عظماء وزوجات عظيمات أيضاً ولكنهم يعيشون في أفران من الهموم والنكد المرير .. وما ذاك إلا أن تلك العظمة قد جاءت على حساب النفس والجسد والوقت وهذه ضريبة يدفعها العظيم .. فما تستقر الحياة إلا بالتوازن ..<br />ألف تحية .. مع بالغ أسفي للإطالة .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134041/http://www.20at.com/article2.php?sid=500"

