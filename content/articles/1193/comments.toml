[[comments]]
order = 13
subject = "ليه"
author = "dark angel"
posted = "2006-03-25"
text = "حاجة غريبة اوى واضح ان الانسه سالى بتعقدنابتتكلم على النواحى السلبية والقصص المحزنة بس وماجبتشى ولا ناحية ايجابية فى ولا زوج طيب ده سؤال للانسه سالى<br />لو جوزك عمل فيكى كده هاتعملى فى ايه؟<br />يا ترى هاتقطعيه وتعبيه فى اكياس ولا تستسلمى للامر الواقع ولا تتمردى بهدوء وارجو الرد عليه فى المنتدى"
