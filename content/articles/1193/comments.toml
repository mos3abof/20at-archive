text = "هية لما اختارت تتجوز مكنتش عرفة هوة<br />خاين ولا قريب من ربنا اتاكدي لو قريب من<br />ربنا مش هيخون بس انتو بحبو الصيع ..<br />وراء كل رجل عظيم امرأة ووراء كل امرئة<br />كويسة راجل بيمشيها هههههههه<br />ياريت تفوقو قبل ما تموتو وسيبكم من الكلام<br />الي لا هيودي ولا يجيب..<br />وشكرا"
