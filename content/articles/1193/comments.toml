[[comments]]
order = 8
subject = "وراء كل امراه عظيمه رجل"
author = "ساره"
posted = "2006-03-03"
text = "رغم انه الامثله المطروحه بدايق بجد بس حلو الواحد يعرف برضو حاله بيوصل لايه لما بيختار خطا لانه كل تجربه مطروحه اساسها عدم فهم كل طرف للتاني صح قبل الجواز عشان كده حصلت المشاكل زي الي بتقول انها مدايقه من جوزها لانه متسلط بس هيه وافقت على تسلطه فتره الخطوبه عشان كده هو فضل متسلط<br />والي مدايقه من جوزها لانه بيسكر وهي كانت عارفه انه عتده قابليه للشرب وغي كده<br />بالنسبه ليه اي بنتلازم دي مرحله الخطوبه اهميتها لانه لو الالاساس كان صح الحياه هتمشي صح<br />وبالنسبه لوراء كل رجل عظيم امراه انا بقول انها موجوده واكيد \"وراء كل امراه قويه رجل\"<br />ولا هتخالفوني!!!!!!1"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134041/http://www.20at.com/article2.php?sid=500"

