[[comments]]
order = 1
subject = "فيتو (vito)"
author = "sweet_princess"
posted = "2006-02-26"
text = "لابقى انا لازم اعترض بجد :<br />اشمعنى امريكا بس اللي تقول فيتو ....<br />طب فيتو بقى (vito)<br />جرى ايه يابنتي مافيش اي نماذج كويسه خالص كده دا انتي هتخوفي البنات من اي عريس ممكن يتقدم لهم.<br />انتي حسستيني ان شباب مصر نصهم( مدمن وخمورجي )والنص التاني( فالاتي وعينه زايغه).<br />وعلى فكره ( برضه زي مافيه الوحش في الرجاله فيه الوحش اوي في الستات كمان احنا مش ملايكه.<br />مع كل الاحترام لرايك انتي وصاحبات المشاكل اللي كتبتي عنهم في مقالك فيه ناس كتير جدا كويسه وكان لازم تتعرضي للكويسين زي ما اتعرضتي للصنف الفاسد.<br />والحمد لله انا اعرف نماذج كتير جدا من الشباب المتزوجين واخلاقهم عاليه جدا وزوجاتهم سعداء .<br />بصي بقى انتي لازم تصالحي قراء مقالك دا من الشباب بانك تعرضي المقال الجاي دا على طول صور ونماذج كويسه (اوك).<br />بس اوعي تيجي تصالحيهم تقومي تتقلبي علينا احنا (تبقي عملتي زي الدبه اللي قتلت صاحبها).<br />واخيرا شكرا ع المقال واحنا طبعا عارفين ان دي مجرد نماذج تتعد ع الاصابع وبس (بس برضه بيني وبينك يعني كنتي حطي كام نموزج كويس )."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134041/http://www.20at.com/article2.php?sid=500"

