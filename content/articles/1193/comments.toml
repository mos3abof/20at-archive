subject = "المستشارة نهى الزيني, صاحبة شرارة الإصلاح"
author = "مصري"
posted = "2006-03-03"
text = "بين ليلة وضحاها، أصبحت نجمة متألقة ، ليس لأنها بطلة فيلم سينما ، ولكن لأنها صاحبة مبدأ وشهادة حق وكلمة شرف .. لمعت نجوميتها لأنها رفضت وتحدت وواجهت بكل شجاعة ما هرب منه عشرات الرجال ، إما خوفا علي منصب أو كرسي ، أو هربا بالأبناء من جحيم تحدي الحكومة ، خاصة وأن السجون والمعتقلات لا تخلو من القضاة الشرفاء.<br />عندما تسألها عن سر تطوعها وتقدمها للشهادة ، لا ترد إلا بهذه الكلمات الثلاث ... \"هذا هو واجبي\"..."
