[[comments]]
order = 1
subject = "شوفت بعيني محدش قال لي"
author = "هشام حمزة"
posted = "2005-12-19"
text = "مدير: صباح الخير<br />المساعد: صباح الفل يا باشا<br />مدير: والنبي شوف لي عندك كام اجتماع النهاردة؟<br />المساعد :الحق انت عندك تلات اجتماعات<br />مدير: طيب اعمل لنا اجتماع الادارة الدوري بالمرة عشان يبقى النهاردة نقضيهااجتماعات وبكره نشتغل.<br />المساعد: كلامك سليم. والله انت بتفهم<br />في اليوم التالي:<br />المساعد: القسم اللي كنا مجتمعين معاه مش فاهم احنا عايزين ايه؟ واغلبهم بيقول انهم فصلو من تالت ساعة في الاجتماع؟ وبالتالي مفهموش اللي باقي من الاجتماع \"ساعتين\".<br />مدير: طيب فين محضر الاجتماع ؟<br />المساعد: ايه؟ سعادتك احنا ماشين مع بعض امبارح؟ انت فاكرني هأعمله امتى وفين وازاي ؟<br />مدير: اه صحيح. طيب عايزين نعمل اجتماع انا وانت عشان نشروف هنظبط الموضوع ده ازاي ؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113957/http://www.20at.com/article2.php?sid=114"

