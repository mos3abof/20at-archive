text = "افرجوا عنه وقولوله بلاش لعب عيال بقا<br />حان الوقت لكل الطوائف السياسية للدولة انها تتصرف تصرفات كبيرة وعيب شغل العيال الصغيره دا<br />زي اخوانا الفلسطينيين مش عارفين يتفقوا لانهم شوية عيال<br />واسرائيل شغالة تغيير في ملامح القدس<br />اكبروا بقا وبلاش لعب عيال وتحملوا المسئولية<br />اسرائيل بتنتقل من (اسرائيل الصغرى) الى اسرائيل الكبرى)<br />اكبروا بقا وبلاش لعب عيال"
