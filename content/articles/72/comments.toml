[[comments]]
order = 1
subject = "ايه الحلاوة دي"
text = "فعلا موضوع جامد<br />ربنا يبارك لك<br />ايوة قولي كمان عشان الناس تفهم ان احنا رجلاة و حريم زي الفل<br />HMH"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616055351/http://www.20at.com:80/article.php?sid=211"

[[comments]]
order = 2
subject = "راسكولينكوف"
text = "فهمنا الفكرة من الموضوع لكن يا ريت رجال مصر يفتحوا مخهم شوية ويتنازلوا عن العجرفة الرجولية الفراغة ويفهموا الغرض من الحكايات الي حكيتيها دي"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616055351/http://www.20at.com:80/article.php?sid=211"

[[comments]]
order = 3
subject = "رنيــــــــــــــ الحب ـــــــــــــــــــــن"
text = "بسم الله الرحمن الرحيم<br />طبعا فهمنا والموضوع كويس جدا ويارب كل الرجاله تفهمه<br />رنين"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035837/http://www.20at.com:80/article.php?sid=211"

[[comments]]
order = 4
subject = "الجزائر"
text = "بارك الله كاتب هذه الاسطر المضيئة من تاريخنا الاسلامي العريق ولكن هل لكاتبته ان تقول لي اين يوجد مثل هذا النموذج من النسء في عصرنا الحاصر؟"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035837/http://www.20at.com:80/article.php?sid=211"

[[comments]]
order = 5
subject = "فهد"
text = "تستحقين الشكر افهمو يا بنات العرب احسن ما تصيرو سلعة بيد الصهاينة واتباعهم للبيع في سوق الجواري والعبيد"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035837/http://www.20at.com:80/article.php?sid=211"
