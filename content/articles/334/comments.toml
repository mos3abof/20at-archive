[[comments]]
order = 1
subject = "رحلة العمر!"
text = "أعتقد أن الكل يحلم برحلة إلى المسجد الأقصى و لكن بعد تحريره من أيدي الصهاينة المغتصبين,ندعو الله أن ينولنا شرف زيارته و الصلاة فيه و يكون الذهاب إليه في نفس سهولة الذهاب إلى أي بلدة عربية مجاورة!<br />فلندعوا الله أن يتحقق هذا الحلم!<br />نتمنى أن يكون عدد المصلين في المسجد الأقصي مثل عدد المصلين في المسجد الحرام و مسجد الرسول عليه الصلاة و السلام.<br />للأسف يا جماعة الموضوع صحيح مش مثير أوي يعني, بس برده مش وحش.<br />فيه فكرة جديدة!"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022005327/http://www.20at.com:80/article.php?sid=482"
