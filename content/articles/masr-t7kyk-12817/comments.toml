text = "ياااااااااااااا ااااااااااااااا اااااااااااه<br />ده كان يوم أبيض ، يوم ما فكرت أروح مع أصحابي نصيف كام يوم<br />في يوم طقت في دماغنا بعد ما خلصنا امتحانات أولي معهد بفترة أننا نروح نقضي كام يوم في شاليه صاحبنا في الغردقة .. العربيات موجودة و الشاليه موجود و الفلوس بتدبر بس المشكلة الوحيدة الى قابلتنا كلنا أننا إزاى نقنع أهالينا انهم يوافقوا .. كل واحد قالهم قبلها بيومين وهما طبعاً أعترضوا أننا نطلع لوحدينا ( عاشمانين انهم يطلعوا معانا بقى ) وقعدنا اليومين فى مجادلات ومهاترات مع اننا عارفين انهم مش هيوفقوا بس قولنا تبقى تمهيد للى جاى<br />وبعد اليومين دول اتفقنا اننا كلنا هنروح لأهل كل واحد ونتحايل عليهم ونقولهم ده اخونا و احنا عايزينه معانا وكلنا هنخلي بالنا من بعض ومش هننزل البحر ده احنا هننزل حمام السباحة بتاع القرية وبس .. وقد كان واتنفذ المخطط ونجح وخدنا العربيات وطيرنا قعدنا أسبوعين جااامدين جداً ."
