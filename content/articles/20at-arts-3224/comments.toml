text = "أرجو من القائمين علي الموقع متابعته باستمرار وإزالة أي كلام قذر أو سباب يتم فيه , وخاصة هذا المعتوه الذي قام بسب الدين . . .<br />وأحيي الصديقين عمارة وياسين علي تصرفهما الحضاري واعتذار كل منهما للآخر . . .<br />أنا من محبي نبيل فاروق بشدة , صحيح أن أسلوبه به بعضا من العيوب والانتقادات إلا أن التأثير الجبار الذي قد أرساه في عقول الملايين من الشباب لا يمكن أن يتجاهل , وأعتقد أن انتشار روايات أدهم صبري في أوساط الشباب خير من انتشار أرسين لوبين أو مجلات البورنو<br />الرجل يريد أن يصلح ما أفسده المجتمع علي مر عقود , وأتمني أن نري مثله في مجالات الموسيقي أو السينما"
archived = "2009-06-02"
