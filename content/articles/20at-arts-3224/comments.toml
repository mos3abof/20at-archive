[[comments]]
order = 28
subject = ""
author = "الكنزي"
posted = "2009-03-07"
text = "سبحان الله إن الدكتور نبيل فاروق الذي ربي ملايين القراء على التواضع و الصدق والنبل و الصدق و الشهامة وحب الوطن يتهم بالغرور و عدم النزاهة الادبية واستخدام الادب [ *** ]بوبة لتربية العيال.<br />المشكلة طبعا ليست في الدكتور تبيل (ربنا يعين الدكتور نبيل) المشكلة ان صحيفا يقابل كاتبا كبيرا و عظيما كالدكتور نبيل فلا يحترم الوقت الذي أعطاه له (كان يستغل الوقت في السبوبة) ولا أن الدكتور خارج من عمليتين لو أجرى احدهما غيره لتقاعد، لم يحترم صراحة الأستاذ و صدقه و لا المساحة الخاصة التي أكرمه بها ، لم يحترم كل هذا فصار يكيل له الاتهامات ويكثر فيه الطعن بقول فلان قال فيك كذا وكذا وما هو المطلوب من الدكتور؟ هل المطلوب ان يقول : ما دام قال ذلم فلإعتزل الكتابة و اقعد في البيت فهؤلاء الحاقدون هم نخبة النصحاء الامناء في هذا البلد.<br />من سمع عن المخابرات المصرية قيل د. نبيل<br />من سمع عن قصص خيال علمي عربي في العصر الحديث اساسا<br />الم تكن كلها مجموعة من الألغاز و الاحاجي و الاضاحيك يا سادة.<br />المضحك المبكي ان يرى احدنا فيلما قريبا من احداث رواية للدكتور او حتى مقالا فيثبالى ذهنه ان الدكتور سرق هذا و اقتبس ذلك دون ان يفكر ولو للحظة ان التيمات معدودة و أن المجالات محددة ، فمن المضحك أن قصص الدكتور التي تحمل ثراء أدبيا و فنيا ازرى - إن لم يكن غطى ومحق - نظيراتها من قصص ارسين لوبين و جيمس بوند رغم ان الحبكة واضحة القوة في قصص الدكتور و لكنها عقدة الدونية التي نحملها نحن أبناء الحضارة الى هؤلاء الذي يظنون انهم احفاد قردة<br />نخجل من تراثنا و التزامنا و أخلاقنا وحضارتنا و نتضلع الى موضات العري و كؤووس الخمر الكريستال و غناء المدمنين و رقيص الافاعي وعلاقات حيوان الغاب بكل الافتتان وقد فغرت أفواهنا شدها و تبلها.<br />نعم كما افاد احد الاخوة - لا كرامة لنبي في وطنه - فكيف لد. نبيل ببعض العرفان بالجميل من أبناءه و قراءه.<br />لقد قرأت للدكتور نبيل في كل حالاتي منذ ما يربو على العشرين عاما، كانت كتاباته تمدني بالقوة و العزة عندما كانت القصص الاخرى تجرعني مرارات الخوف من الخيانة و الخوف من الحاكم و الخوف م الاخ و الصديق و الزوجة بل والابن و الابنة والاب و الام، كانت كتاباته تزرع الامل و الثقة و لكنه لم يدرك عندما كان يكتبها انها ستكون مدخلا لإتهامه بالغفلة وهل من الغفلة ان يحب الرجل وطنه و بيته وصحبه؟ أعتقد ان ذنب الدكتور نبيل فاروق الوحيد هو انه لم يكن انهزاميا عندما تخلعت جحافل الشعوب - لم يقل لأي منا احضر رفشك واحفر قبرك - خطأه هو أنه أعطانا الأمل ولهذا الخطأ وجب عليه أن يرجم بجمار الجهل و عقد الدونية و الاضطهاد - لقد ظن (وما أفدح ظنه) أن للكاتب رسالة - رسالة أمل و بصراحة لا أرى كثيرا من رعيله يقترف نفس الخطأ الفادح<br />جدا<br />جدا<br />نعم لقد احببنا اسلوبه و عشقنا حكيه و انداحت في دماء قلوبنا سقيا أفكاره فلله لو كان الرجل في أرض غير الارض او في شعب غير الشعب لعلت مبيعات كتبه على قصص هاري بوتر وسيد الخواتم ولكن شاء الله ان يمتحن صبره و الله المستعان.<br />ومن المثير ان عقلة لسان بعض الحاضرين قد انطلقت فهذا مصري لا يشرفه ان يكون مصريا لأنه يرى ان مواقف مصر لا تشرفها - لهذا الاخ اقول (وانا لست مصريا) ان مواقف مصر لا يصنعها مبارك - ولا السادات ولا حتى ناصر و ما يفعله هذا و ذاك لا يمثل شعب مصر وعندما يختار الشعب المصري من يحكمه يمكننا حينا ان نحكم من خلال هذا الشخص على مصر وأهل مصر وبصراحة مصر أكبر من أن اذكرها في كلامي بعد قول الله تعالى (أهبطوا مصرا فإن لكم ما سألتم) وكفى بالله حسيبا.<br />وفي النهاية التمس من هؤلاء المهاجمين المطاعنين ان يجردوا كتب الد. نبيل وان يجدولوا اصولها، اهدافها، سمات شخصياتها، حال المجتمع فيها و أخيرا خواتيم القصص و الرسالة المستخلصة منها ثم ليفعلوا المثل بمن أحبوا من الكتاب والرواة (من كل الازمان والاصقاع) وليقارنوا الحبكة و الجزالة و الاسلوب ثم ليحكموا بعد ذلك بما شاؤا.<br />وفي النهاية الى كل من اتهم الدكتور نبيل فاروق بالغرور في رده العصبي على الصحفي المستفز أن يقرأ بعض شعر المتنبي وان يقول أن المتنبي - المغرور فعلا - ليس من أعظم الشعراء العرب أن لم يكن أعظمهم على الإطلاق.<br />والعظمة لله أولا و أخير<br />شكرا و ،اسف على الاطالة."
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094135/http://www.20at.com:80/klam-rosas/3224.html"
