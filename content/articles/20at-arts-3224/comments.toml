text = "أستغرب من الذين تهجموا على الدكتور نبيل فاروق ..فهل هو مسؤول عما يحدث في بلدكم مصر<br />- هذه أمور سياسية ليس له بها أي دخل فهو مجرد مواطن مصري عادي مثله مثلكم ؟؟!!!!<br />ومع ذلك في هذا الزمن الرديء حاول ومازال يحاول زرع وتثبيت شيء اسمه ( عدم اليأس ) مهما كانت الظروف<br />وهذا الأمر هو مايحاول زرعه أعداء العرب والمسلمين جميعاً وليس المصريين فقط …<br />أنا أشكره على تعليمه لنا شيء واحد فقط وهو ( عدم اليأس ) مهما كانت الظروف ..وذلك من خلال قراءتي لقصصه طوال<br />هذه السنين الطويلة منذ البداية ولحتى الآن ..أما أنحطاط مصر وتدهورها فليس هو المسؤول عنه …<br />خلاصة الكلام :<br />لو كان هذا المبدع ينتمي لدولتنا لبنينا له تمثال من الذهب !!!!<br />مع تحيات : الصريح ( السعودية )"
