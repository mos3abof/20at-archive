text = "أخى ياسين أنا متأكد أنه ليس لك دخل بهذا الشخص العاهر فأنت عندما أعتذرت لم ت[ *** ]ب أحترامى وتقديرى وحدى بل [ *** ]بت أحترام وتقدير القراء والذى أقصده بالتحديد أن بعض القراء المتحمسين جدا لايقبلون النقد وهم رغم كل شئ محترمون ولذلك كما يلجأ بعض الناس لأستئجار بلطجي ليؤدب أحدا يقوم بعض القراء بأستئجار أحد المشردين ليكتب ما لايستطيع هو كتابته ولذلك كن مطمئنا ياأخى فأنا أكن لك كل الأحترام والتقديرe"
