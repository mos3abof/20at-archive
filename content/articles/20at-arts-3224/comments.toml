text = "المدعو romeo ربما تخفى وراء هذا الأسم لشعوره بعقدة نقص حادة تجاه الجنس الأخر حيث أنه شاذا أما الكلام الذى ذكره فهو يدل على البيئة المنحطة التى أتى منها ربما كان من سكان حوش بردق أو عزبة القرود حيث تربى وسط أوسخ فئات المجتمع هذا أذا كان تربى ولم يكن لقيطا أما ما وصف به والدتى فهو ينطبق على والدته أيضا وألا كيف أنجبته؟؟ ربما عن طريق الأنابيب لعدم قدرة والده على القيام بواجباته الزوجية وربما كان لقيطا كما ذكرت من قبل وأحب أن أقول لك يامن تعمل قوادا لمن دفعوك لسبى أن دين أمى الذى لعنته هو دين أمك وأبيك وأجدادك هذا أذا كان لك دين من أصله يالقيط"
