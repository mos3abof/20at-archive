posted = "2008-03-31"
text = "أخى ياسين أعتذارك يدل على أنك أنسان جدير بالأحترام فلو أحد أخر مكانك ربما كان تبادل معى السباب وهذا يجعلنى أعتذر لك بدورى تكريما لأخلاقك الحميدة<br />ثانيا لم أقصدك وحدك ياأخى الفاضل ولكن هناك تعليقات قبلك لأختين وكلها مديح مفرط فى دكتور نبيل وأنا لم أعترض سوى على الأفراط فى المديح مما جعلنى أعتقد أنه هو الذى يرسل تلك التعليقات أما بالنسبة للأخوة الذين هاجموه بلا موضوعية فأنا لا أتفق معهم على وصفه بالغرور وخلافه ولكن لفت أنتباهى وربما أنتباهك أيضا أحد الأخوة وهو يتهم دكتور نبيل بلأقتباس من الأفلام الأجنبية وقد أعطى أدلة على ذلك أنا عن نفسى لم أتأكد مما ذكره ولكن يكفى أنه ساق عدد من الأدلة ربما كانت صادقة وربما لا ولكن يكفى أنه لم ينعت دكتور نبيل بصفات أعتقد أنه بعيد عنها تماما<br />وأخيرا أكرر لك شكرى وأعتذارى ياأخى الفاضل"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094135/http://www.20at.com:80/klam-rosas/3224.html"

