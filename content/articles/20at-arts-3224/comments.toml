[[comments]]
order = 12
subject = ""
author = "عمارة الليثى"
posted = "2008-04-17"
text = "أخى ياسين<br />بعد التحية و السلام<br />بالنسبة للدكتور نبيل فاروق فاروق فهو كاتب متميز بلا جدال بالرغم من أننى لم أقرأ له سوى عملين فقط وهما سلسلة زووم ورواية أرزاق وللأسف الشديد لم يكمل العملين دول مع أن سلسلة زووم لو أستمرت لكان لها صيت عالمى وليس محلى فقط ويعجبنى فى دكتور نبيل نزعته الوطنية وغيرته على كل ماهو مصرى أو عربى والأكثر من ذلك هو نشر أعمال الأدباء الهواة فى كوكتيل 2000 وهو مالم يقم به أى أديب معاصر وهذا ردا على من يتهمونه بالغرور<br />أما بالنسبة للدكتور خالد توفيق فقد قرأت له بعض الأعداد من سلسلة وراء الطبيعة وأحسست أننى أشاهد أفلام رعب رأيتها من قبل وهذا لا يقلل من أحترامى له ككاتب له مكانته<br />بالنسبة لموضوع الأقتباس فهذا ذكره الأخ أيهاب صالح و ستجده موجود فى تعليق بعنوان ليس من تتخيلونه وبالمناسبة فقد ذكر الزميل أنه لديه الكثير أرجو منه ذكر أقتباسات خاصة بالأفلام لأن مجلات تان تان صعب الحصول عليها لأنها توقفت منذ زمن طويل<br />وأخيرا ياأخى العزيز معقول فى طنطا مسقط رأس الدكتور نبيل لا يوجد بها منفذ للبيع أعتقد أن هذا الأمر يحتاج لتدخل عاجل من دكتور نبيل وبالنسبة للقاهرة بها أكثر من منفذ للبيع أشهرهم هو فرع المؤسسة العربية فى شارع الفجالة بميدان رمسيس بالأضافة ألى بعض المكتبات داخل محطة مصر نفسها<br />وأخيرا يا أخى العزيز أيميلى هو bahaa@ iname.com<br />وأستودعك الله ياأخى ألى لقاء قريب"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094135/http://www.20at.com:80/klam-rosas/3224.html"

