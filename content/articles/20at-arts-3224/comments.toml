text = "الأخ العزيز هشام لقد طالبت أدارة الموقع بحذف التعليقات البذيئة ومعك كل الحق فى هذا ولكن مارأيك فيما سأقوله لك الأن<br />لقد أرسلت ردا للأخ محمد عوض تعليقا على أنكاره لأقتباس نبيل فاروق قصصه من بعض الأفلام القديمة والمجلات وقد كان ردى عليه مؤيدا بالدلائل القاطعة مثل أقتباس ملف المستقبل العدد رقم 43 من الفيلم الأمريكى The Final Countdown (1980) ويشهد الله أننى لم أستخدم لفظا جارحا أو تعليقا خارجا ومع ذلك تم حذف تعليقى بعد نشرة بيوم واحد لمصلحة من الله أعلم مما يفقد هذا الموقع مصداقيته و حياده و أرجو منك قراءة تعليقى قبل حذفه"
