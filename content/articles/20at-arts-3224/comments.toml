text = "أولا أشكرك كثيرا على ردك الهادئ الرزين فيكفى أنك لم تلجأ لأسلوب عنيف فى الرد وهذا يبين مدى أتساع صدرك<br />ثانيا الذى يحدثك الأن من نفس جيل نبيل فاروق فأنا من مواليد 1958 وقد عاصرت ماعاصره نبيل فاروق وشاهدت ما شاهده أيضا من أفلام ومسلسلات خيال علمى فى ستينات و سبعينات القرن الماضى وبالتالى لن يحكم على مؤلفاته سوى القراء من جيلنا أنا ونبيل فاروق أى من تجاوز الخمسين وهم فقط القادرون على أكتشاف تلك الأقتباسات<br />ثالثا انا لم أقل أن كل مؤلفات نبيل فاروق مقتبسةفهو رغم كل شئ كاتب كبير فرض نفسه على الساحتين المصرية والعربية وهو يتمتع بخيال خصب لا جدال فى ذلك ولكن ذلك لايمنع أن يتذكر بعض الأعمال الفنية التى شاهدها أو قرأها فى شبابه وأحيائها من جديد من خلال بعض مؤلفاته وأرجو منك ياأخى أن تحاول الحصول على الفيلم الأمريكى الذى ذكرته فى ردى السابق ولو عن طريق أنزاله من النت شاهده أولا ثم أقرأ الرواية بعد ذلك وأنا سأتقبل حكمك مهما كان"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094135/http://www.20at.com:80/klam-rosas/3224.html"

