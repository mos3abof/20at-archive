[[comments]]
order = 18
subject = ""
author = "محمد عبد الحميد"
posted = "2008-05-30"
text = "لا أعلم لماذا يسيطر علي عقولنا الفكر الاحادي المطلق .. لماذا لانقبل بالتعددية التكاملية … من يحب دكتور نبيل (وأنا من عشاقه بالمناسبة) ينسي أنه بشر قد يخطيء وقد يصيب .. بل وينسب السباب والشتائم لدكتور أحمد خالد .. ومن يكره دكتور نبيل ينسب اليه كل النقائص ويدعي ان الدكتور يكتب مديحه بنفسه… ما هذا كله يا أخواني .. الاختلاف بيننا هو سنة الحياة .. مالعيب في ان نقبل الاخر علي علاته … فالانسان يستمد تميزه ووجوده من هذا الاخر …<br />ملحوظة أخيرة أخواني .. تعجبت كثيرا من تناول مسالة الغيرة بين الدكتور أحمد خالد والدكتور نبيل … صعب أوي حاجة زي كده تكون حقيقية … احنا بنتكلم عن اتنين من كبار مثقفي هذه البلد .. مش عن اتنين مطربين .. واظن اصحاب هذا الراي من اخواني لم يقرأوا قصتي (اسمه أدهم) و (أرشيف الغد) للدكتور أحمد .. من قرأهم سيجد أن القصتين عبارة عن قطعة سيمفونية في مديح الدكتور نبيل وأعماله … خصوصا رجل المستحيل وملف المستقبل …<br />عن نفسي أنا بدأت اقرا رجل المستحيل وملف المستقبل وكوكتيل منذ السابعة من عمري … ومش هاقدر أوصف مهما حاولت اثر هذا في حياتي … يكفي أن أذكر انني ومعي مجموعة من الاصدقاء الذين بدأوا قراءة هذه السلاسل في مثل عمري كنا نتحدث ونحن في الصف الثاني الاعدادي عن روسيا القيصرية والاتحاد السوفيتي وحالة التقشف الرسمية المعلنة فيه …<br />اخواني في الله أرجو تقبل الاخر والتعايش معه بل والتكامل معه …"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094135/http://www.20at.com:80/klam-rosas/3224.html"

[[comments]]
order = 19
subject = ""
author = "banota masreya"
posted = "2008-06-04"
text = "الدكتور نبيل فاروق دا راجل محترم ويستحق دا عن جداره ولو اخدنا بالنا من كل ابطال قصصه نلاقيهم بيصلو وبيلتزمو باخلاق فاضله مش ممكن نلاقيها دلوقتى وبيحاربو بنبل وشرف مش بحقاره ومن ورا الضهر وبعدين الراجل ده عاش عمره كله يحاول يزرع الوطنيه وحب البلد جوانا من بنات لاولاد ويحسسنا اننا بشر اذا كنا بدانا نفقد ادميتنا فى الواقع هوا بيحاول يرجعهالنا وانا عن نفسى اول ماقريت قريت قصصه واول معلومات كانت برده من قصصه ورواياته وان كانت فى اطار مسلى والمعلومه اللى كنت بصادفها فى قصه عمرى مابنساها مش زى معلومات كتب المدرسه اللى اول ماخرج من الامتحان انسى اسم الماده اصلا احنا بدل مانهاجم الدكتور نبيل المجترم المثقف نهاجم مافيا الاسعار اللى خنقونا وخلو الناس تستغنى عن اساسيات فى حياتها علشان الاسعار اللى ولعت وبعدين هوا مش ذنبه ان عقله سابق عصره والبلد اللى عايش فيها هوا كان ممكن يسافر برا ويكتب ويشتهر مليون مره اكتر من دلوقتى وي[ *** ]ب مليون مره اكتر من دلوقتى بس للاسف هوا وطنى حابب يفضل فى مصر واللى فى مصر مش مقدرينه وعلى فكره هوا لو مغرور مكنش اتكلم مع محاور او محاوره مجهولين الهوويه او مبتدئين بالذمه ده مش قمه التواضع خلينا ساكتين احسن"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094135/http://www.20at.com:80/klam-rosas/3224.html"

