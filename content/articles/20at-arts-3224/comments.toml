text = "الاخ romeo لماذا تسب اخى عماره وهو عنده حق فى انه يرد عليك بالفاظ منحطه ذيك وانا لا احب السباب بالمره ولكنك تسب اخى وانت ياعمار ربما تظن انى اسبك بهذا الاسم المستعار والله العظيم انا ما صاحب تعليق romeo ,وانه شخص يسعى بالوقيعه ولو انك تظن انى صاحب هذا التعليق قانا لست بهذا الغباء`حيث اعتذر لك ثم اسبك باسم مستعار فابالتاكيد انا اول شخص سيوج اليه الاتهام وكان يمكننى لواردت السباب ان اسبك باسمى دون اسم مستعار فما الذى سيخيفنى وانا لاارفك فعليا لذلك يااخى ابتعد عن سؤ الظن ومره اخرى اقسم بالله العلى القدير انى لست صاحب تعليق romeo"
