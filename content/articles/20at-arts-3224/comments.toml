posted = "2008-04-09"
text = "د.احمد خالد توفيق شخص حاقد يحقد على د.نبيل لعدم قدرته على تحقيق شهرته وانا متاكد مثل محمد عبد الله انه صاحب كل تعليقات سب واهانة د.نبيل وقد تحققت من مايقوله ايهاب صالح وتاكدوا يااصدقائى ان ذلك ليس له اى شىء من الصحه فابى كان من محبى القراءه وهويمتلك معظم مجلات تان تان وقد تحققت بنفسى من ذلك الكلام كما ان ابى قد شاهد فيلم ارض العمالقه وراجعت انا الروايه ووجدت ان كله كلام فارغ ياد.احمد هناك وسائل متحضره عما تفعله كما انى لم اقراء اية روايه لك الاووجدتها مقتبسه من افلام سوير مان وهرقل ولاتشوه صورة هذا الرجل وقد رايت انك لم نحضر الندوه التى حضرها د.نبيل حقدا عليه لعدم رغبتك فى ان تجلس فى مكان هو موجود فيه لانك تغير منه ويا اصدقائى تاكدو ان قول ايهاب صالح ليس له اى شىء من الصحه"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094135/http://www.20at.com:80/klam-rosas/3224.html"

