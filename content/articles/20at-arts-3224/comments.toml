text = "عزيزى دكتور نبيل حاولت كثيرا الأتصال بك لعرض قضية هامة عليك أرجو أن تتبناها وتدافع عنها وهذه القضية هى حرب أكتوبر ستسألنى ما المشكلة ؟؟<br />المشكلة هى أن الدعاية الصهيونية روجت فى العالم بأكمله أن حرب أكتوبر أنتهت بنصر للجيش الأسرائيلى وللأسف هذا الكلام يدرس كتاريخ فى بعض الدول العربية ولعلك ياسيدى قد لاحظت أن السادس من أكتوبر من كل عام لا يحتفل به سوى مصر وسوريا فقط . وقد شاهدت منذ سنوات على قناة أم بى سى برنامجا يسمى خمسون عاما على الصراع العربى الأسرائيلى وهو من أنتاج محطة البى بى سى البريطانية وتم دبلجته للعربية وقد أستضاف البرنامج عددا من الشخصيات العربية و الأجنبية ممن عاصروا تلك الحرب ولكن ما لفت نظرى حقا هو ما قاله السفير السوفيتى فى واشنطن فى تلك الفترة ويدعى أناتولى دوبرينين ويبدو أنه أفرط فى أحتساء الفودكا قبل ظهوره فى البرنامج فقد ذكر لافض فوه أنه بنهاية حرب أكتوبر كانت الدبابات الأسرائيلية تحاصر القاهرة تمهيدا لأقتحامها ( نعم لم تخطئ القراءة ولم أخطئ الكتابة) وأن الرئيس السادات كان منزعجا من أحتمال أحتلال القاهرة فى أى وقت . أولا الكل يعلم ظروف حدوث ثغرة الدفرسوار والدور القذر الذى لعبه هنرى كيسنجر وزير الخارجية الأمريكى خلال تلك الحرب بأعطائه الضوء الأخضر لأسرائيل لخرق وقف أطلاق النار للحصول على مكاسب جديدة تساعدهم فى المفاوضات وقد كان أحرى بالسيد دوبرينين أن يتحدث عن موقف بلاده المخزى من مصر خلال الحرب ففى الوقت الذى أطلقت فيه الولايات المتحدة جسرها الجوى الشهير الذى أنقذ أسرائيل من هزيمة مروعة أكتفى الأتحاد السوفيتى ببيانات الشجب و الأستنكار التى يجيدها ولولا الدول الصديقة كيوغوسلافيا و الجزائر سارعت بأمداد مصر بالدبابات عوضا عما فقدته ما تمكن الجيش المصرى من محاصرة الثغرة ووقف أنتشارها تمهيدا لتصفيتها وأقول للسيد دوبرينين أذا كانت القوات الأسرائيلية شرق القناة كانت تخوض معارك عنيفة لمنع قواتنا من أغلاق الثغرة وقطع طريق أمدادها الوحيد والقوات الأسرائيلية فى غرب القناة كانت فى وضع حرج جدا بعد أكتمال حصارها وأصبحت مهددة بالأبادة فأين هى القوات التى من الممكن أن تحاصر القاهرة بل وتحتلها أذا لزم الأمر؟؟؟؟<br />عزيزى دكتور نبيل لقد أعيتنى الحيلة بعدما بعثت بهذا الموضوع الى أكثر من صحيفة أو مجلة ولم يهتم أحد بالأمر وأنا كلى ثقة بأن أحدا غيرك لن يهتم بتلك القضية فلديك العديد من المؤلفات الوطنية التى يقرأها الجميع من كل الأعمار وأنت قادر بأذن الله على تصحيح هذا الوضع فى عيون الكثير من شباب بلدنا ممن يحبونك ويثقون فيك.<br />وفقك الله والسلام عليكم ورحمته وبركاته"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094135/http://www.20at.com:80/klam-rosas/3224.html"

