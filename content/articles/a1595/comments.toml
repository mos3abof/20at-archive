subject = "سسسس"
author = "ن وجهة نظري فتره الخطوبه مهمه جدا وخاصه بعد كتب الكتاب لانه كل طرف بيتعرف على التاني اكتر وبعدين لما بنخطو خطوه كتب الكتاب لازم يكون كل من الطرفين متاكد بنسبه سبعين بالميه بانه ده هو الشخص المناسب لانه بيكون اعد معا كتير قبل كتب الكتاباما فتره الخطبه بتكون مهمه عشان نعرف صفات معينه بشريك الحياه مثلا مزاجه الحاجات الي بحبها وكد"
text = "وربنا يوفق الجميع"
archived = "2006-11-02"
