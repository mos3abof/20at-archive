[[comments]]
order = 0
subject = "لماذا كتب الكتاب ياعريس"
author = "ي فترة الخطوبة نعيش كالفراش التنقل في وسط الحقول من زهرة الي زهرة وكل حياتنا احلام ورديه ونظرات متبادلة تذيب القلوب وكلمات معسوله لاتغفل عنها طوال الليل وهمسات ولمسات تدمع العين واختيار الالفاظ تريح القلب ."
text = "كل من الطرفين يلبس قناع المروءة والملائكية والطهر والعفاف وكأن هذا الموضوع الوردي سيدفعنا للجنة بعينها ودعائنا معا لربط هذ الحب الجارف .<br />تم كتب الكتاب .......<br />خرجت عليك في اول زيارة لها برداء مهرول وفسان قديم متأكل كله ثقوب وكانك لم تتزوج ملاك ولكن تفرك عينيك تجدها عفريت اسود واستعملت الالفاظ البالية ولا يوجد خجل ولا احمرار وجه وفيه لطم وزعيق وتطورات وتدهورات والفاظ جارحة لامك وامها وابوك وابوها وانقلب الحال فاذا لم تكن محامية اختارت لك محامي ذات جبروت وسيط يدوي في المنطقة يقدم التقاير الطبية بانك ضربتها وطبعا سهل الحصول عليها وتستدعي اشقائها واخوتها واعمامها وعائلتها لضربك العلقة المحترمة لاتمام الدخلة والا ستنال الكثير والكثير ويصدر ضدك حكم بالنققة والمتعة والشقة فين لسة بندور عليها ف أياك والتكاسل للبحث عن المجهول وتخرج يوميا من بيتها تسب اليوم الاسود انك كتبت الكتاب وتاخد تحور وتدور وتقول ياريتني ياريتني ويراك الناس في الطرقات وعقل ذاهل ونظراتك زائغة مبهمة وتخرج منك الالفاظ كمعتوة اصابه الشلل وانت لم تعلم لماذ اقبلت علي هذا فكنت حرا حرا بعد ان نفر وابتعد عنك اصدقائك وذهب شبابك وااصبحت لغة الارقام عشرة الاف وميت الف وسبعة الاف هي لغتك ومن اين تاتي بالنقود وهل تشتغل حرامي ولا ابحث عن عمل ارحم ولا اهرب من المجتمع واعيش اعزب طيب بعد ايه والمحامين يحاربوك ويرسلون لك الانظارات والشكاوي بالمراكز والتقارية الملفقة وستدفع وتخرج من الموضوع كما ولدتك امك تتكفف الناس بعد ان طارت الشقة والعزال ورموا هدومك من الشبك في الشارع ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143226/http://www.20at.com/article.php?sid=1595"

[[comments]]
order = 1
subject = ":: الـبــاشـــا ::"
author = "لسلام عليكم ورحمة الله وبركاته"
text = "اولا ..<br />انا بحب عمرو خالد في الله<br />ونحسبه من خيرة الناس ولا نزكي على الله أحد<br />تانيا ..<br />بس برضه زي ما حكى كتير منكم<br />ما بدنا نخليه نبي .!!<br />هو انسان ملتزم ومتدين ... وما شاء الله عليه اسلوبه في الكلام والدعوة جميل ومؤثر<br />جزاه الله عنا كل خير<br />وثبت الجميع لما يحب ويرضى<br />وتاني بقولها ..<br />والله بحبك يا عمرو في الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143226/http://www.20at.com/article.php?sid=1595"

[[comments]]
order = 2
subject = "ده رأى"
author = "تهيألى يا جماعة ان المسلمة و المسلم اللى بيحبوا بعض جدا فى فترة الخطوبة مش هيبقوا براحتهم فى التعبير عن مشاعرهم زى ما يكونوا مكتوب كتابهم , لان عند العقد فهو اصبح زوجى شرعا و قانونا فبالتالى هبقى براحتى فى اى تصرف او كلام يصدر منى لحبيبى اللى هوه بقى زوجى , و اذا لا قدر الله و حصل اى خلاف اوجب الطلاق افضل انى يقال عنى مطلقة و لا انى احس بعدم الرضا عن نفسى انى عملت حاجة غلط مع حد ايا كان تحت مسمى رسمى و ليس شرعى و هو الخطوبة , و انا عندى رد على الاخ شريف اللى ادلى برايه داخل الموضوع ان خطيبتة المفروض انها مش تكلمة فى اى مواضيع متعلقة بالجنس فى فترة الخطوبة نهائى, المفروض و الصح ان الكلام ده يكون فى فترة كتب الكتاب ."
text = "و دمتم سالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143226/http://www.20at.com/article.php?sid=1595"

[[comments]]
