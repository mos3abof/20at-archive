[[comments]]
order = 0
subject = "الاتحاد قوة"
author = "السلام عليكم ورحمة الله وبركاته"
posted = "2006-08-20"
text = "هذا المقال كدرني كثيرا فنهايك عن اللغة الجميلة والعنوان المثير ووضعه في الصفحة الرئيسية ألا أنه يدعو إلى الفرقة ويشغل المسلمين في أنفسهم (تذكر الدعاء على الاعداء بأن يشغلهم الله في أنفسهم) أي أن هذا ليس وقت الفرقة بل يجب على جميع المسلمين أن يتحدوا ويعتصموا بحبل الله حتى يتحقق النصر على أعداء الإسلام<br />أي ليس هذا وقت ذكر الفتاوى أو الاشخاص المتأثرين بأفكار الاخرين على حد زعم الكاتب بل أن الحرب الدائرة يجب ان تجعل من المسلمين كيان صلب مصفوف ضد أعدائهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143827/http://www.20at.com/article2.php?sid=1140"

