subject = "الاسلام نعمة"
author = "حازم حسين"
posted = "2006-04-29"
text = "السلام عليكم في البداية انا تربيت في السعودية ورجعت وطني بعد ان اتممت 20 عاما وعندما جئت السودان رايت العجب العجاب من البدع والخرافات واتباع الغرب مما جعلني اتذكر نعمة الاسلام في بلدكم فلاتجد عندنا هيئة معروف وهنا الفرق فالبدع في ازدياد والضلال عم فأنتم في نعمة كبيرة لايشعر بها الا من يفقدها فعيد الحب وشم النسيم وغير ذلك مما لا اصل له ثقافات غربية يجب الترفع عنها هدانا الله واياكم"
