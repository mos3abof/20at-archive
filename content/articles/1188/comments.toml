[[comments]]
order = 14
subject = "والله وفي ناس طلعلها لسان"
author = "محمد"
posted = "2006-05-30"
text = "والله اشوف في ناس طلعلها ولسان وقام تتكلم على آل سعود بعد هذه في مثل يقول -الكـ..... ما يعض اليد اللي اتمدتله - هذا وهو الكـ.... كيف اذا كان بني ادم لكن يبدوا انه في ناس ما تقدر الجميل هذا بعد ما جابوكم من الصحراء وبنولكم افخم عمارات وابراج بعد ما كنت تركب البعير - اعزكم الله - صرت تركب الحوت والليكزس بعد ما كنت تشيل في يدك عصا تهش فيها الغنم صرت شايل Nokia N70 وبعد ماكنت ساكن في خيمة مشقوقة صرت ساكن في فيلا 4 طوابق وبعد ما كنت تلبس (زبيرية) - كمان اعزكم الله - صاير تلبس Boss وبعد......... اعتقد يكفي لانه القائمة تطول وبعد هذا كله جاي تتكلم ياشيخ عيب عليك استحي على وجهك خل عندك احساس حنا ما نقول انه ال سعود ملائكة لكن على الاقل سوا اللي عليهم وزيادة واعتقد انهم بني ادمين زينا زيهم (كل ابن ادم خطاء ) بعدين تعال ياللي فاتح اثمك قد فم التمساح لو كنت مكانهم كنت بتسوي ربع اللي عملوه آل سعود .<br />يا شيخ اللي يعز آل سعود ويخليهم فوق روسنا ويعطي ملكنا الحبيب (الملك عبدالله) الصحة والعافية ويرحم أبو فيصل ويسكنه فسيح جناته<br />ملاحظة هامة أنا غير سعودي لكن السعودية أصبحت وطني الاول ما اقول الثاني وعلى قول اخوننا المصريين - لحم كتافي من خيرهم -<br />ومعليش على الاطالة وطبعا لن انسى كاتب الموضوع من الشكر الجزيل على طرحه للموضوع الذي ارى ان رأيي فيه هو رأي محايد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133958/http://www.20at.com/article2.php?sid=431"

[[comments]]
order = 15
subject = "الله يعزك ياديرتي"
author = "بنت ابو متعب"
posted = "2006-06-10"
text = "الموضوع رائع لانه راح يبين لأي شخص يطلع عليه مدى تمسك السعوديه بتعاليم ديننا الحنيف وانه البلد الوحيد الذي يرفض مثل ها الاحتفالات التي لاتمد للاسلام بصله واحب اقول لللي يقول ال سعود سبب كل بليه انت والله اكبر بليه شفتها وانا متاكد انك منت سعودي وال سعود هم اللى رفعوك للعالي وعمرك ماشفت النعمه الا على يديهم وعلى العموم مايحتاج نتكلم عن ها الاعياد اللى انتم طالعين فيها عيد الام وعيد الحب وووو اللى اعرفه ان المسلمين عندهم عيدين فقط عيد الفطر وعيد الاضحى غيره مافيه للاسف المسلمين يقلدون تقليد اعمى للغرب وكاننا حمير عندهم أسالكم باالله عمركم سمعتم غربي احتفل بعيادنا طبعا لا وحنا كل ماسمعنا شئ باالغرب نقلد احب اشكر كل من قال كلمة حق بديرتي السعوديه واخص باالذكر الاخوان حازم حسين ومحمد واقولهم السعوديه بلدكم واذ ما شالتكم الارض تشيلكم عيونا اسفه طولت عليكم اتمنى للجميع التوفيق والستر انشاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133958/http://www.20at.com/article2.php?sid=431"

