posted = "2006-07-10"
text = "اعز الله ال سعود واطال في اعمارهم ونحن فداء لهم وانا احب ال سعود فهم بعد الله من جعل الخيرات بيننا فلو تذلاي دولة عربية وجدت حكامها قد اكلت اموال شعبها وتركتهم في فقر الا دولتي ومملكتي فقد جعلت منا ملايين ومليار ديرا ''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''اما اعياد الصهاينة واليهود فلن اعلق عليه ولاثم لا ولن اتشرف بالرد عليه فهم اعداء الا سلام واعداء بلدي [[[[[[[[[[[[[ والا سلام فيه حب لا تحسبوه رهبانية بل كله سلام و وئام ورحمه وحب ;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;لكم خالص شكري ريم بنت السعودية وبكل فخر\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"
