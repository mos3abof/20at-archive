[[comments]]
order = 0
subject = "عن هيئة الامر بالمعروف"
author = "Dabdoob"
posted = "2006-02-14"
text = "الموضوع جميل بلا شك<br />لكني اريد ان اخرج عنه قليلا لاتحدث عن هيئة الامر بالمعروف والنهي عن المنكر .<br />1-هل من حقها ان تجبر الناس علي اتباع الدين الي درجة ان تمنع الناس من ارتداء ما تريد؟<br />2- هل وجود هذه الهيئة يمنع الناس من ارتكاب المحرمات؟<br />3-بعد كل هذا الحزم والشدة في تطبيق الشريعة واجتناب الشبهات (ربما بشيء من الغلظة ) الم يصل المجتمع السعودي الي نفس النتيجة التي وصلت اليها مجتمعات اخري عربية (واقصد بهذا وجود فئات منحرفة وفئات اخري متشددة)؟<br />اخيرا انا لم اقصد بهذه الاسئلة الاستهزاء او السخرية بقدر ما قصدت ان افهم وان اقتنع.<br />والسلام<br />Dabdoob<br />هذا السؤال ليس استهزاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133958/http://www.20at.com/article2.php?sid=431"

[[comments]]
order = 1
subject = "اشمعنا يعني 14 فبراير"
author = "أكرم"
posted = "2006-02-14"
text = "انا معنديش اعتراض ان الواحد يحتفل بالحب و الام و كل واحد من حقه يفرح و يحتفل بس ليه عيد الحب 14 فبراير بالتحديد و ليه انا مجبر احتفل بيه اليوم ده ( مع العلم ان في مصر عيد حب محلي في شهر نوفمبر ) و ليه عيد الام 21 مارس و عيد العمال 1 مايو و الاعياد كتير<br />طبعا هيقولولي ان احنا نختار يوم في السنة للحب في العالم طب ليه كده منخليها اسبوع و لا شهر في السنة<br />ااقولكم احسن خلوها طول السنة احسن و السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133958/http://www.20at.com/article2.php?sid=431"

[[comments]]
order = 2
subject = "دا جزء من قصيده لسعاد الصباح"
author = "نيفين"
posted = "2006-02-14"
text = "عام سعيد عام سعيد<br />انى افضل ان نقول لبعضنا حب سعيد انا احبك فى بدايات السنه<br />وانا احبك فى نهايلت السنه<br />فالحب اكبر من جميع الازمنه و الحب ارحب من جميع الامكنه ولذا افضل ان نقول لبعضنا حب سعيد<br />يا عشرينات<br />يا شباب<br />يا بنات<br />يا كل مصر<br />happy happy happy valentines day<br />و الى هبهوب<br />a special valentines day 4 u<br />مع انك طنشتينى و مبعتيش الايميل<br />مستنيه تبعبى ايميللك يا هبهوب<br />طولت معلش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133958/http://www.20at.com/article2.php?sid=431"

[[comments]]
order = 3
subject = "re: to Dabdoob"
author = "Zax"
posted = "2006-02-15"
text = "الأخ دبدوب<br />أولا أحييك على أسلوبك الجميل<br />ثانيا أحب أرد على سؤالك<br />احنا متفقين ان السعودية زيها زى كل البلدان العربية فيها كل أنواع الفساد اللى تتخيله و اللى لا تتخيله<br />بس هل يعنى هذا أن يترك كل مسؤوول مسؤوليته و يقول خلاص ماهى خربانه خربانه؟<br />مثال بسيط<br />دلوقتى واحد مثلا مش بيصلى و جه علينا شهر رمضان, هل معنى كده انه مايصومش؟ ماهى بايظه بايظ<br />الواقع بيقول ان شرع ربنا لابد من تطبيقه و فى ناس اللى هما ولاة الأمر هما اللى مسؤلين عن تطبيق الشرع ده و ربنا هيحاسبهم على أدائه ان كانوا مقصرين أو ظالمين أو أو دى مشكلتهم<br />انما معنى ان فى فساد يبقى خلاص نسيبه؟<br />رأيى الشخصى انك مش مستوعب أصلا فكرة ان تطبيق حدود الله مسؤلية ولى الأمر مش أمر اختيارى للمسلم<br />يقول سيدنا عثمان بن عفان رضى الله عنه<br />ان الله ليقيم بالسلطان مالا يقام بالقرآن<br />أو قريبا من هذا الكلام<br />و السلام عليكم و رحمة الله و بركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133958/http://www.20at.com/article2.php?sid=431"

