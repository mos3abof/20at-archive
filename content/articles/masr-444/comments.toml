order = 0
subject = "طاقم حكم حقير وكاذب..ياشرفاء مصر الثورة الآلآلآلآلآلآلآلآلآن"
author = "مصرية"
posted = "2006-06-05"
text = "ليس بالغريب ان يقف اى فرد من أفراد عصابة القرصان الحاكم ويصرح بالأكاذيب والغش..لأن أى حقيقة تقال فى أى مجال هى بمثابةانسلاخ من جلدهم الذى نحس وتبلد من النفاق و الكذب على الشعب طوال عهدهم الغابر ولا أعتقد أن هناك مصرى لديه حتى ولو ذرة من الكرامه يقبل المشاركة فى حكومة هذا الطاغية الفاسد..اما الضرب بالجزم فهو قادم لامحالة..حينما يضع الشعب هؤلاء السفلة فى مكانهم الطبيعى..وحين يضعهم التاريخ فى أحقر مذبلتة..<br />أخى جاوز الظالمون المدى<br />فحق الجهاد وحق الفـــدى<br />يا شرفاء مصر من الجيش والشعب<br />الثــــــــــــــــورة الآلآلآن<br />لآلآلآلآلآلآلآلآلآلآلآلآلآلآلآ للقرصان وسلالته وعصابته<br />ونعم..نعم..نعم..لثورة الجيش والشعب على الظلم والفساد..اللهم اجعله يوما قريبا<br />آآآآآآآآآآآآآآآآآآآآآآآمين"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143604/http://masr.20at.com:80/article.php?sid=444&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

