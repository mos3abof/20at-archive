order = 1
subject = "حتي انتي 0000يا مااااااا"
author = "الاستاذشيكو"
posted = "2006-06-06"
text = "حتي (ما)جات علي مصر وحلفت انها لازم تمسح بكرامه الحكام والمطبلاتيه بتوع مصربكرامتهم الارض وتبينهم علي حقيقتهم<br />واالله حاجه تضحك مصر عايزة تبقه عضوة في حقوق الانسان ايه الخيبه التقيله دي<br />طيب تبص لحاجه عليها القيمه شويه حاجه تنفعهم (الكبار بس )البنك الدولي او المؤسسه العربيه للنهب والفلوس وكل ما علي شاكلتها<br />والله الواحد مش عارف يعمل ايه ولا حتي يضحك ازاى عالم معندهاااااش دم<br />مصر مالهاش وجود علي الخريطه الافريقيه ولا العربيه ولا الدوليه ولا في اي حتي اصغر بلد برقبه مصر<br />بكل اسف اللي غيرنا عمله حسني والحراميه بتوعه مسحوة باستيكه وسخه<br />اما كلام زفت الطين وزير خارجيتنا فهو زى اللي قبله اللي انضرب بالجزمه من الفسطينين عشان حسوا ان فيه مكيده مدبرة للفلسطينين فقاموا ضربوة بالجزمه"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143604/http://masr.20at.com:80/article.php?sid=444&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
