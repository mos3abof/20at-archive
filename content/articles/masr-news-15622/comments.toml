author = "2 مليون دولار"
posted = "2010-03-07"
text = "ايوة يا سيدى صحف اسرائيل نشرت على حسب ما جاء فى اليوم السابع ان مصر صرفت 2 مليون دولار من فلوس الغلابة على ترميم معبد يهودى ترضية لاسرائيل وتشجيعا لها على حفر انفاق تحت الاقصى لهدمة<br />2 مليون دولار يعنى 11 مليون جنية مصرى<br />اللة يخرب بيت فاروق حسنى على بيت نظيف ولاد الكلب لانهم لم يصرفوا جنية واحد على جامع الحسين او مسجد السيدة او حتى جامع السيد البدوى<br />ربنا يسود وجهوكم يا عالم يا ظلمة يا جبناء<br />كان كفاية يندهن بشوية جير وبوية وخلاص"
