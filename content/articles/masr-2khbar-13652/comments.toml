author = "ما خنزير الا بني ادم"
posted = "2009-10-08"
text = "على مقولة<br />ما عفريت الا بني ادم<br />نقول ما خنزير الا بني ادم<br />حذرتو الناس من الذهاب الى العمره وها هو 3 مليون معتمر ولا يوجد اصابة واحدة<br />والناس في مصر عماله تعطس في الشوارع ولا فيه اي حاجه<br />فيه اية بتقول ايه<br />وما هو بضارين به من احد الا باذن الله"
