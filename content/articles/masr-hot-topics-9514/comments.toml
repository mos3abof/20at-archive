text = "اللي عايز يبقى غني في مصر لازم ينهب الشعب الجعان المسكين اللي واقف يتفرج على اي حاجه<br />على قناة الرحمة فيه برنامج اعلاني اسمه المشتاقون الى الجنة ودا عبارة عن تسويق تلاجات ميه تتحط في الشوارع وجنب الجوامع علشان خاطر الناس تشرب منه<br />ومسمينه المشتاقون الى الجنه علشان خاطر يستفزوا الناس دينيا وكل واحد يطلع من جيبه على طول<br />وعلى قناة الرحمة بيبيعوا طقم للعرايس ابقاع وحلل ثمنه 299 جنيه<br />طبعا سعر مغري جدا<br />فيه ناس راحت اشترته لقيته النوعية بتاعته رديئة جدا<br />ولذلك نرفع الامر الى فضيلة الشيخ محمد حسان مسئول القناه علما بأن فضيلة الشيخ (خريج اعلام وليس اصول دين)<br />نرفع اليه الشكوى لان ما يصحش تبقى قناة الرحمة فيها اعلانات عديمة الرحمة هدفنا اخراج القرش من جيوب الناس الغلابه<br />وزي ما قلتلكم اللي عايز يبقى غني يستثمر في شعب مصر وعلى راسهم الاطباء والمحامين وخلافه"
