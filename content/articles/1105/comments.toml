[[comments]]
order = 9
subject = "haraaam"
author = "سالمة"
posted = "2006-07-31"
text = "ياايها العرب رجاء ماتقولو هيك<br />بدى تشعرو بنا نحنا اللبنانيين<br />نحنا عم نتعذب والسبب هو هدا المتهور الاحمق نصراللة<br />ياعرب نحنا كنا بنعيش بسلام مافى اى شى عم يحصل<br />ليش بدانا بالخطف مع دولة حمقاء متل اسراثيل وكلتنا عم نعرف اننا ما بنقدر عليها<br />واللة ما بنقدر مهما حصل وفعلنا<br />ماتوافقو على نصر اللة نحنا هن ندعى علية<br />ليش هيك يانصر اللة ليش كل ها الدمار والخراب واللة حرام عليك حرام عليك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132251/http://www.20at.com/article2.php?sid=1110"

[[comments]]
order = 10
subject = "ان كان نصر الله احمق!! فنتمني ان نكون كلنا حسن نصر الله"
author = "معتصم بالله"
posted = "2006-07-31"
text = "ويحك يا سلمي , احزينة من خطف حزب الله لجنود صهاينة؟؟!! , احزينة لان قتل 400 شهيد منذ بداية الحرب؟؟!! احزينة من الدمار الذي الم ببلدك الحبيب؟؟!!.<br />انا لا اوافقك الرأي فكان لزاما علي حزب الله ان يفعل ذلك فهو يحفظ بذلك كرامة لبنان بل كرامة العرب جميعهم , و يكفيكي فخرا ان بلدك (لبنان) هي اول دولة في التاريخ بعد العراق التي تهدد الكيان الصهيوني بأكمله و تدخل الرعب في قلوبهم , لا تنظري الي خسائرك بل انظري الي خسائر عدوك الذي لم يجرؤ علي عبور شبر واحد في الارض اللبنانية نتيجة المقاومة الباسلة لحزب الله, حسن نصر الله ليس بأحمق فهو يهدد و يتوعد و ينفذ و يهدد الكيان الصهيوني بأكمله اما السلبية التي يعيشها الحكام العرب من صموت و تخاذل هي الخطأ , و لا تنس ان ارضك مازالت محتله و لابد لهذه الارض ان تعود و اشكرك علي حسن استماعك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132251/http://www.20at.com/article2.php?sid=1110"

