author = "رغدانيا"
posted = "2006-08-02"
text = "كما يقال كل يغني على ليلاه، وكل له رأيه وكل له تفكيره ولا احد يستطيع أن يقف حارساً على تفكير الناس طبعاً، التعليقات تعبر عن آراء أصحابها لي تعليق بالتحديد على تعليق سلمى اولا من ناحية اللهجة التي كتبت بها فهي ليست لبنانيه ولا تمت للبنانية بصلة، ثانياً فهي لا تعرف معنى حزب الله ولا تعرف معنى الكرامة، إن كانت فعلاً لبنانية، فنصر الله هو الكرامة على هيئة بشر، ما فائدة أن ننام مرتاحين وغيرنا يتألم ؟؟ ورؤسنا منكسة، وألسنتنا مربوطة ببلاعيمنا؟ من قال ان لبنان يعيش بأمان؟ من قال أن حزب الله البطل أقلق أمان لبنان أو أقلق أمان أي عربي؟ حزب الله هو الضمير الحي الذي صاح، الكرامة التي تولد من قلب المقاومة، وأنا كفلسطينية أعاني نير الاحتلال، اعاني بأنني أرى جنودهم يومياًفي عيني حتى احياناً اتمنى أن أتبرأ من عيني عندما تقع على جنودهم، يؤلموننا في كل لحظة يحاولون إذلالنا ولكننا مرفوعي الرأس كيف لا لأننا ننام كما تريد سلمى براحه بل لأننا نقتطف بعض النوم ونترك الباقي للكرامة لا نريد النوم بلا كرامه لا نريد الأكل والشرب بلا كرامه لا نريد عد الأيام بمذلة واستكانة، مع اننا مرابطين في بيت المقدس، نتحمل إيذاء العدو الصهيوني مع أننا نُحارب كل يوم صنعوا حولنا جدار مقيت قسم أوصال الوطن الحبيب، ونشعر مع كل ذلك بالتقصير نشعر أن علينا فعل الأكثر والأفضل، نعم نريد فعل الأكثر والأفضل. هنا في مجال. أما مجال أن نلوم الحكام العرب فلا مجال لذلك متى يسمع الميت النداء، فلنوفر أصواتنا للدعاء لحزب الله ومناجاة الله في نصره بدل أن نحاول ايقاظ الضمير العربي في الحكام لأنه لن ولم ولا يستيقظ خلص يجب أن نعتبر الحكام العرب في قائمة الأموات سيئي الذكر، ولا نرجو منهم الخير ولا نقول لماذا لا ينظرون إلى حال لبنان لأن لا عيون لهم انهم أصنام على العروش، وهل ينتظر من الصنم أن يشعر، بعضهم صرح أنهم ضعفاء لا حول لهم ولا قوة لا جيش ولا عتاد، فإن كانوا كذلك فليسقط الصنم عن عرشه بقوة الشعب وليعتلي تلك العروش من هم أحق مرفوعي الرأس وليس أذناب لأمريكا والغرب، لا نريد من الحكام العرب شيء لأنهم لا شيء، واذا كان الحاكم العربي يرى في نفسه السلبي معدوم الإرادة والسلاح والجيش وإن كان مخلصاً لتنحى، وبما انه يريد أي الحاكم العربي الكرسي والعرش والمادة على حساب الشعب الشعب والمخلصين من الجيش عليهم إزاحة هؤلاء الحكام الأصنام، ليحضر من له الكرامة والذي يدرب الجيش لأجل الحرب لا كل يوم احتفال في بلد من أجل الجيش واين هذا الجيش إن لم يحارب لكرامة الأمة وعزتها؟؟ إذن علينا مقاطعة نصح الحكام لأنهم بلا آذان. وللحبيب نصر الله كل التحية وكلنا فدى الله والمقاومة، نحن أدرى الناس بالصهاينة والاحتلال، نحن أدرى الناس بالكرامة لأننا نعيشها مع محاولة قتلها فينا فهي تتعملق، يا سلمى لا نريد الأكل والشرب والنوم، نريد الكرامة. وسلامي للسيد حسن نصر الله من شرايين كل الشعب الفلسطيني من دماء كل الشعب الفلسطيني الشهداء والأحياء."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132251/http://www.20at.com/article2.php?sid=1110"

