text = "بحب اقلك انوا من ورة الجنديين الثنيين ممكن اكتير انطلع اسرى يمكن انتة عايش بحرية مش حاسس فيهم كيف عايشين في السجن الاحتلالي وكيف بتعذبوا معلش خلينى انموت وتتخرب بيوتنا فداء للوطن لانوا ما في شي بغلا عن الوطن واذا استشهدنا بكون مصيرنا الجنة واذا اتهدموا ابيوتنا ابتتصلح يعني احنا مش خسرانيين اشي بس هم الخسرانيين وشكرا عشان اسمعتني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132251/http://www.20at.com/article2.php?sid=1110"

