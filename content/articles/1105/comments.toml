subject = "اللله ايهدكوا"
author = "فدائيه"
posted = "2006-08-03"
text = "الله ايهدكوا ياعرب مش يهديكوا وكمان ابتدعوا على الشيعه طب ليش وانتوا شو امساوين الله ينعن ابوها من عبارات تافه بتعبروا فيه عن غضبكو شو هل حكي على فكره انا مسلمه سنه بس ما في فرق بينا وبين الشيعه وهذا التعليق لصاحب التعليق التالي (لعن الله الشيعة ) شو هل حكي هو الاسلام هيك مش شايف شو بصير وانت قاعد ابتعمل فتن الله ايسامحك شو هذا صحيح العرب بقر وما بعرفوا شو بحكوا<br />وقت التفرقة كمان احنا مابدنا حرب اقليميه هو قاعد بقول لعن الله الشيعه شو هل حكي يازلمه والله لو جمعت امتك ميت مره ما راح اتلاقي ولا واحد مثل ظفر حسن نصر الله وعلى فكره انا سنه مش شيعه والله ينصر الجميع وينصر المقاومه يا اغبياء<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132251/http://www.20at.com/article2.php?sid=1110"

