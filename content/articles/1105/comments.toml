subject = "يا رب نصرك لحزب الله .."
author = "إبن بهية"
posted = "2006-08-01"
text = "كنت قد بدأت في الدعاء على من كتب التعليق القميء الذي يدعو فيه على الشيعة بجهل منه وربما هو تابع لحزب الحكومة .. لكني تراجعت حتى لا يكون الموضوع كله ردح ودعاء متبادل كالسباب .. إن حزب الله والشيعة إخوة للسنة ولا فرق بينهما كما أوضح كل علماء الأمة الموثوقين كالسيد الأستاذ مهدي عاكف المرشد العام للإخوان المسلمين وهم غالبية الشعب المصري وكما قال الدكتور يوسف القرضاوي بل جرم من يقف ضد حزب الله وكما قال الأستاذ عمرو خالد وفقه الله وغيرهم الكثير الكثير من علماء السنة وعلماء السعودية الأحرار غير المكبلين بقيود الحكومة الغاشمة هناك التي جعلتهم يبيعون ضمائرهم وآخرتهم بدنياهم كبن جبرين والحمد جعل الله منهما ومن شيخ الأزهر عبرة للعالمين ... يا رب نصرك لحزب الله .. يا رب نصرك لجنود الله .. يا رب نصرك لأمة محمد .. ادعوا ربكم في كل صلاة .. ادعوا لحزب الله بالنصر .. يا رب آمين آمين آمين<br />إبن بهية<br />http://ibnbahya.blogspot.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132251/http://www.20at.com/article2.php?sid=1110"

