posted = "2006-08-02"
text = "لايستطيع احد ان ينكر قيمة الكلمة فى حربنا ضد العدو سواء كانت مقروؤة اومسموعة اومغناه وكل قافلة تحتاج لحادى<br />يشد من ازرها ويعينها على الصبر والغناء درب من الجهاد كالتبرع والدعاء والقتال الخ.. فالمقاوم على خط النار لابد ان يسمع صوت مؤيديه ولابد ان يكون هناك ميدان خلف الميدان لزرع القوة فى صدرونا<br />بالقران والسنه والخطبه والنشيد وكل ما سبق كلام ولكن هو اساس البناء ...فكما نغنى لاطفالنا ليناموا لابد ان نغنى لشعوبنا لتفيق.... والله من وراء القصد"
