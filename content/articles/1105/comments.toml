[[comments]]
order = 33
subject = "إلى الوهابيين التكفيريين موتوا بغيظكم!!"
author = "إلى الوهابيين التكفيريين موتوا بغيظكم!"
posted = "2006-08-05"
text = "موتوا بغيظكم!<br />لقد أصبحت الوحدة الإسلامية واقعاً فرضته عليكم المقاومة الإسلامية وسيدها حسن نصر الله..<br />موتوا بغيظكم!<br />لقد وصل العشق بالله بين السنة والشيعة إلى حد أفقدكم صوابكم، كل ذلك بسبب انتصارات المقاومة الإسلامية المؤيدة بالله ورسوله وكل المؤمنين اللذين يساندونها بالمال والكلمة والدعاء.<br />موتوا بغيظكم!<br />لقد أصبحت الوحدة الإسلامية أمراً واقعاً بسبب الوعي الشعبي لمقتضيات المرحلة، رغم أصواتكم النشاز ومحاولاتكم التعلق بقشة التشويش على وحدتنا.<br />موتوا بغيظكم!<br />لقد تكشف للعالم الفرق بين من هو المجاهد الحقيقي ومن هو الذي ضل طريقه ووجه سلاحه وعبواته المتفجرة لتمزيق أجساد المسلمين في المساجد والحسينيات والأسواق.<br />موتوا بغيظكم!<br />لقد انتصر الدم على السيف مجددا في لبنان وفلسطين (وهي مقاومة سنية، فماذا قدمتم لها؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟). وهذا النصر هو لكل الأمة بكل طوائفها، ومن ضمنها أنتم، شئتم أم أبيتم! فالخير هنا يعم، والشر يخص! لقد فرض عليكم انتصار مشرف لم تعتادوا عليه ولا تستحقونه!<br />موتوا بغيظكم!<br />لقد سقطت أقنعتكم عن وجوه مشوهة ملؤها الحقد، الحقد على كل ما هو نظيف وشريف في هذه الأمة، الحقد على الشرفاء اللذين أثلجوا صدور الأمة بانتصارات بطولية ضد عدو يشبهكم في عنصريته وإجرامه..<br />موتوا بغيظكم!<br />لقد اختار المقاومون الأبطال والمؤمنون الشرفاء من خلف أظهرهم خط المقاومة ضد عدو الأمة الحقيقي، تاركين لكم تكفير المؤمنين بسبب أطوال أثوابهم أو لحاهم!<br />موتوا بغيظكم!<br />لقد مكرتم ومكر الله .. والله خير الماكرين!!<br />موتوا بغيظكم!<br />فكلنا شيعيون من أجل لبنان.. وكلنا سنيون من أجل فلسطين..<br />ولا عزاء لكم!<br />والسلام على غيركم ورحمة الله وبركاته...<br />بل نقول لكم ..... \"سـلامـــا!!!\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132251/http://www.20at.com/article2.php?sid=1110"

