posted = "2006-09-04"
text = "بسم الله الرحمان الرحيم بدي اعرفكم على حالى انا احمد من القدس من باب حطه انا بدي احكي معاكم عن القاومه انا نفسي اجاهد بس ما بطلع في يدي حيله فا ارجو ان تساعدوني نا ما بدي توقف الحرب لانو حسان نصر الله لم يبعي اي اسرائيلي متمان انهو سوفه يعيش ارجو من حسان نصر الله ان يكمل الحرب ونحنو معك بزن الله ان شاء الله والله اكبر من اي شيء في الدونيا ولاخر والسلام علاكم ورحمت الله وبركاتو"
