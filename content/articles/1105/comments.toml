[[comments]]
order = 6
subject = "الصوره ابلغ من التعليق"
author = "بسم الله الرحمن الرحيم"
posted = "2006-07-31"
text = "لو كانت صاحبة هذه الصورة طفلة فلسطينية لقامت الدنيا ولم تقعد وهي تتحدث عن وحشية الفلسطينيين والعرب والمسلمين الذين يعلمون أطفالهم القتل وسفك الدماء.. لكنها - يا سادة- لطفلة إسرائيلية دعاها جيش الاحتلال الصهيوني لتكتب رسالتها لأطفال فلسطين ولبنان على صاروخ سيمزق أشلاءهم.. وهذه الدعوة لا تدل إلا على ذروة الإنسانية.. إنسانية الغرب التي تنظر للعرب على أنهم أدنى بكثير من الحيوان<br />مرحى لأطفال (الدولة الديمقراطية) الوحيدة بالمنطقة مثلما فلق رؤوسنا الغرب بوصفها. وهي الدولة الوديعة التي تعيش بين كومة من الوحوش والإرهابيين..<br />نحن الإرهابيون - ربما لأننا نقتل بصمت...<br />نحن الإرهابيون.. ربما لأننا نترك أشلاءنا مباحة أمام الكاميرات والعالم.. ولا ندفن أنفسنا أحياء<br />وصلت الرسالة.. لكن هذه الطفلة لم تقرأ رسالة الأطفال الإسرائيليين من على الصاروخ الذي مزق جسدها.. ولم يقرأها أحد.. لم يأبه أحد بهذا الجسد الطري الممزق.. انشغل المحللون من على شاشات الفضائيات بقضايا أخرى، وضاقت أنفس القادة العرب بشعوبهم غير المسؤولة التي تعشق الموت والمغامرة.. والأمم الغربية أمم أميركا وبريطانيا، شربت نخب الديمقراطية..<br />وصلت الرسالة... ونام جسد الصغيرة نومة أراحته من هذا العهر الذي نعيشه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132251/http://www.20at.com/article2.php?sid=1110"

[[comments]]
order = 7
subject = "قانا والامة المعتصبة"
author = "نهى"
posted = "2006-07-31"
text = "عندما رايت مذبحة قانا وجدت الدماء تجري في عروقي وكنت في شدة الغضب وكتبت تلك الكلمات لعلهم يسيقظوا من نومهم<br />\" قانا\"<br />من أب داعر وأم مغتصبة<br />جاءت تلك الأمة المنتصرة<br />عريضة المنكبين<br />صاحبة السيادة<br />صاحبة الطبلة والصاجات والقيادة<br />من أب داعر<br />وأم مغتصبة في كربلاء<br />حل علينا هذا البلاء<br />ولدنا سفاحا<br />من أم صارت تمارس هذا البغاء<br />ثمن لكسرة خبزا عفنة<br />وشربة ماء<br />من أب داعر وأم مغتصبة<br />مر ما بين ساقيها<br />كل جنود الأرض سواء<br />فصارت تلك الأمة<br />مزخمة بمجهولي النسب<br />بالقوادين 00 باللقطاء<br />صار كل ما نملكه<br />زيف 00 عجز00 ضعف 00 رياء<br />ماتت قانا والأشجار<br />وبصقت تلك الأرض علينا<br />دم مخاض<br />من ذات الأم المغتصبة<br />بصقت قادة<br />شجب واستنكار<br />تداعى علينا ألف جدار<br />ماتت قانا والأشجار<br />كل مساء<br />حين يضم الرجل إمرأته<br />ستزكم أنفه رائحة أخرى<br />تأتي من ناحية الغرب<br />وتحاصره باستعلاء<br />أي بلاء أي بلاء<br />ماتت قانا والأشجار<br />ونحن نجاهد باسم البيبسي<br />وقطعة كنتاكي وسيجار<br />ماتت قانا والأشجار<br />ونحن نحارب بالكلمات وبالأشعار<br />والساسة يريحوا ضمائرهم<br />بالتنويه والاستنكار<br />ماتت قانا والأشجار<br />حين نشاهد أرض<br />تنفض بالأحجار نزم شفانا<br />حين يقولوا ضربوا قانا<br />يسيل بكانا<br />ماتت قانا والأشجار<br />ونحن نحيا موتى موتى كالأحجار<br />من أب داعر وأم مغتصبة<br />جاءت تلك الأمة المنتصرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132251/http://www.20at.com/article2.php?sid=1110"

