text = "لنقول جميعا لأبطال حزب الله و أبطال الأمةو زعيم الأمة سيد المقاومة حسن نصر الله نقول لهم<br />منصوب القامة يمشى مرفوع الهامة يمشى و فى يدى قصفة زيتون و على كتفى نعشى و انا و أنا امشى هذا هو حال ابطال المقاومة مرفوعى الهامة و رفعوارؤوس العرب فالجميع يحيى المقاومة الباسلة و يدعوا لها بالنصر و تمزيق الصهاينةو تمريغ كرامتهم فى التراب"
