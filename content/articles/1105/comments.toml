text = "يالبنانية<br />والبندقانى رماكموا<br />بالصهيونة تقتل<br />ولدكوا فى حماكوا<br />يالبنانية وانا<br />بدى اجاهد معاكوا<br />ايدكوا فى ايدايا<br />نمحى اسرائيل وامريكا<br />مع المقاومة الله يكون معاكوا<br />على راس اسرائيل<br />والنصر اول خطاكوا<br />والدول العربية<br />باذن الله<br />هتشارك معاكم<br />وفى النهاية اقول الله معاكم ياحزب الله ولبنان"
