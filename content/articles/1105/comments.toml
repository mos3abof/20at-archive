text = "اولا ارسل تحياتي الى الامين العام لحزب الله السيد المدافع عن العرب والمسلمين السيد حسن نصر الله ونحن في فلسطين نشد على ايدي المقاومةفي لبنان الشقيق وادعوا جميع البنانيين الى الوحدة ودعم المقاومة بشتى الوسائل المتاحة لانهم فخر الامتين العربية والاسلامية وانا ادعوا اللبنانيين الي عدم نسيان الاسرى في السجون الاسرائيلية والمجازر التي ترتكبها اسرائيل في اي وقت دون موقف دولي يدينها والله ينصر المقاومة واحنا فدا كندرة حسن نصر الله شكرا"
