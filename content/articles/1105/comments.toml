text = "بداية أشكر من كل قلبي الأخ قلم رصاص كاتب هذا الموضوع .. وأشكر بالطبع كل الشباب المسئول عن هذا الموقع الجميل .. كلمات جميلة يا ولاد .. اشدوا بيها في كل لحظة .. حفظوها لاخواتكم الصغيرين .. دندنوا بيها كل ساعه .. المقاومة لن تموت في أرضنا .. دي الشباب اللي تفرح بجد والله ربنا معاكم يا رب .. فيه موقع سواري عليه أغاني الشيخ إمام وأشعار عمنا أحمد فؤاد نجم .. روحوله واحفظوا الكلام الدرر ده ووزعوه في الشوارع .. حفظوه لولادنا .. خلونا نرجع زي زمان .. رجاله .. مش هفق زي ما الصهاينة عايزين ومعاهم طبعا اللي ما يسموش بتوع حكومتنا وعلى رأسهم الواطي مبارك ..<br />أخوكم<br />إبن بهية<br />http://ibnbahya.blogspot.com"
