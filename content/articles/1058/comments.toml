author = "محمد المصري"
posted = "2006-10-30"
text = "السلام عليكم ورحمه الله وبركاته<br />معلش يا اخ ناجي طالما دخلت قصه الاخراج واجب عليك انك تستفيدمن نقد الفيلم وتعرف ان اراء الناس مهمه ليك ولازم تاخدها مقياس ليك علشان تنفعك في الاعمال القادمه وياريت متزعلش من النقد ده مش انت اللي صح والناس كلها غلط لازم تصحح العيوب اللي الناس انتقدتك عليها ربنا يوفقك .....السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131619/http://www.20at.com/article2.php?sid=1386"

[[comments]]
order = 20
subject = "الرد على دخلت الدوامة"
author = "ناجى العلى"
posted = "2006-10-30"
text = "شكراً على تعقيبك .. ولكن من اخبرك اننى انزعجت من النقد ؟؟<br />سيدى .. لم يبدر منى اى فعل يدل على استيائى من النقد ..<br />كل ما هنالك اننى اوضح وجهة نظرى فحسب كما يطلب الزملاء ..<br />وحكاية مش انت اللى صح والناس كلها اللى غلط .. فدى مش محك لقياس مدى النجاح ..<br />المهم كيفية النقد وليس كميه النقد<br />افتكر معايا مصير فيلم صلاح الدين وباب الحديد لشاهين فى اول تاريخهم ..<br />او فيلم بين السماوالارض لابو سيف ..<br />اعتقد ان الموضوع نسبى مش مطلق .<br />تحياتى<br />ناجى العلى<br />مخرج مستقل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131619/http://www.20at.com/article2.php?sid=1386"

[[comments]]
order = 21
subject = "تمام يا ناجي"
author = "خالد محمد"
posted = "2006-11-01"
text = "الفيلم تمام يا ناجي وعلى فكره هو فيه بعض الرتوش البسيطه اللي ناقصاه يعني حركة الكاميرا كانت حلوه جدا جدا لكن عند القطع فيه زوايا سامحني في قولي لك انك مش ظابتهاوعلى فكره انا عايز اقولك مبروك لانجازك ده لان كفايه جدا انك ماوقفتش قبل كده في لوكيشن تصوير ومطلع فيلم بالبراعه ديه حقيقي يا ناجي انت بارع<br />يا راجل من حلاوة فيلمك انا نسيت اعرفك بنفسي<br />انا خالد محمد اخرجت عمل قبل كده لقناة المحور لكن للاسف لم يعرض لمشاكل في الانتاج وبأذن الله هايتعرض في قناه تانيه<br />وانا كمان باجهز لفيلم قصير قريبا تصويره بأذن الله<br />وانا حقيقي سعيد بعملك الرائع ده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131619/http://www.20at.com/article2.php?sid=1386"

[[comments]]
order = 22
subject = "النص غير منطقي"
author = "بالنسبة للاخراج فكان ضعيفا"
posted = "2006-11-02"
text = "يعتمد المباشرة و تسلسل غير واضح للأحداث<br />القصة غير منطيقة وهو متوهم لمدة سبعة سنين، الصوت يوجد مشاكل، تقنية، الصوت البشري غير واضج، اما المؤثرات لاتتناسب مع موضوع الخيانة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131619/http://www.20at.com/article2.php?sid=1386"

[[comments]]
order = 23
subject = "تجربة ممتازة"
author = "محمد عادل"
posted = "2006-11-02"
text = "التجربة ممتازة جدا لاني أعلم كيف تخرج و تنتج فيلم بموارد تكاد تكون بسيطة لأني لمست هذا الامر و أنا أخرج أول فيلم تسجيلي من أنتاجي فتحية عميقة و كبيرة للمخرج ناجي و للممثلين هبة و محمد السباعي و أخص الممثلة هبة لان دورهاأتقن.<br />الى التقدم الدائم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131619/http://www.20at.com/article2.php?sid=1386"
