subject = "بداية موفقة"
author = "بداية موفقة"
posted = "2006-10-26"
text = "ألف مبروك يا أستاذ ناجي على الفيلم و على البداية الموفقة . الفيلم بجد رائع و فكرته جميلة بالنسبة لانك لسة في البداية و الامكانيات اللى معاك قليلة لكن الصورة ظهرت واضحة و المؤثرات جميلة و متقنة.<br />لى بس تعليق على حاجتين:<br />الأولى : مافهمتش الغرض من لقطة الاستحمام بتاعت اكرم .. يمكن ده يكون قصور في فهمى أنا للرمز لكن حبيت انك توضحهولى.<br />ثانيا : أداء هبه كان يحتاج لبعض التمرين . انا مابقولش ان تمثيلها وحش لا بالعكس لكن في بعض المشاهد ماكانتش على نفس مستوي أداء محمداللى كان رائع فعلا .<br />على العموم ربنا معاك و اتمنى أشوفلك فيلم طويل قريب...."
