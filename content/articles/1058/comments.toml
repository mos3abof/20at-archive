[[comments]]
order = 13
subject = "لا حياة مع الشك"
author = "عائشة"
posted = "2006-10-26"
text = "لقد شاهدت فيلم دليل خيانة ولم اجد اي مبرر للزوج في الشك في اخلاص زوجته, علما بان الزوجة كانت مثال الزوجة متحجبة وامراة محترمة, فلو كانت الزوجة متبرجة وكثيرة الدخول والخروج لارتاب الزوج في وفائها واخلاصها لكن العكس ما حصل فالشيطان تمكن من الزوج بشكل رهيب وجعل حياته رهيبة وافسد حياته وحياة زوجته, حتى الله سبحانه وتعالى قال في كتابه العزيز : واذا جاءكم فاسق بنبأ فتبينوا من تصبوا قوما بجهالة فتصبحوا على ما فعلتم نادمين<br />وقال رب العزة كذلك : فامسكوهن بمعروف او سرحوهن بمعروف , ومارايناه في الفيلم ان الزوج رغم شكه بزوجته الا انه رفض تطليقها, فهنا بعد عن الدين وتمكن الشيطان منه, وتهديده المستمر للزوجة بالقتل مما جعلها هي تقوم بقتله , فاي زوجة عاشت ظروفها كانت حتتصرف نفس ظروفها خصوصا انها طالبت الزوج بالطلاق ولكنه ابى لظنه انها ستتزوج بالشخص الذي في مخيلته بانها تخونه معه, هنا سؤال مهم يطرح نفسه , اين كرامة الرجل فرضا ان الزوجة تخونه لم لا يطلقها ويحفظ كرامته لم يفرض نفسه عليها ويابى ان يمنحها حريتها فهي لو خائنة لا تستحق ان تكون على ذمته وتحمل اسمه وتصون شرفهة اما اذا كانت بريئة فبدل من يعيش نفسه في جحيم وتكون نتيجة لا يحمد عقباها لم لا يطلقها تبقى دائما كرامة الرجل تلعب دورامهماان كانت الزوجة من تطلب الطلاق لكن كان لابد من التيقن حتى لو كان هناك شك يجب التاكد حتى لاتكون حياة الزوجين جحيما بدل حياة سعيدة. اما من ناحية الفيلم فاهم شيء اتسم به الاحترام ليس كما اعتدنا ان نرى في الافلام المصرية ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131619/http://www.20at.com/article2.php?sid=1386"

[[comments]]
order = 14
subject = "تعقيب على الاخت عائشة"
author = "تحية طيبة وبعد"
posted = "2006-10-26"
text = "مع كامل احترامى لتحليلك .. الا ان التحليل ابتعد تماما عن سكة الفيلم .. وعن قصة الفيلم تماماً بشكل لم الحظو من قبل على نقد الفيلم ..<br />نادية لم تقتل اكرم ..<br />برجاء قراءة تقرير الطب الشرعى الموجود فى نهاية الفيلم .. قراءة بدقة شديدة .. وربطه وربط احداث الفيلم خلال ال 19 دقيقة كلها ..<br />وفهم ما يراه اكرم<br />الفيلم محتاج شوية تركيز يا جماعة عشان نفهم كل تصرف قام به اكرم ..<br />ومش اقصد ان الفيلم دماغة عاليه قوى .. لكن فيه تفكير شوية فى علاقة اللقطات ببعض<br />اسف للاطالة<br />ناجى العلى<br />مخرج مستقل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131619/http://www.20at.com/article2.php?sid=1386"

[[comments]]
order = 15
subject = "الى الأمام"
author = "أم عزت"
posted = "2006-10-26"
text = "روعة ما شاء الله عليك بجد يا اخ ناجي إالى الأمام<br />على فكرة البنت أدائها كان جميل جدا بس كانت محتاجة شوية إنفعال اكتر بمعنى ان اي واحدة مكانها بتبقى عصبية هي كانت شوية هادية حتى و هو بيضربها<br />كمان مفيش واحدة ست بتهدد جوزها بالقتل بسبب الغيرة<br />ممكن اما انها تطلب الطلاق أو لو حتهدده و عايزة تغيظه ممكن تقول انت مجنون و حوديك بإيدي مستشفى المجانين او اي حاجة زي كده او تقول اه اعرف واحد أو غيرها من ردود الفعل اما كونها تقول حقتلك يعني جملة مبالغة<br />بس الأداء رائع جدا<br />الفكرة رائعة و هو هادف<br />و الله لم أقصد بالنقد المهاجمة بل قصدت النصيحة عشان العمل القادم يطلع احسن<br />و ان شاء الله نشوف اعمال ليك تاني اروع واروع الى الأمام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131619/http://www.20at.com/article2.php?sid=1386"

[[comments]]
order = 16
subject = "عمل فني ممتاز"
author = "مشاهد"
posted = "2006-10-27"
text = "هناك ثلاثة أمور لفتت نظري في الفيلم:<br />أولا: الأداء الرائع والمتميز للممثل والممثلة والمخرج العبقري حيث أدى الثلاثة ادواراهم أمام الكاميرا أو خلفها باقتدار وحرفية.<br />ثانيا:بساطة الأمكانات لاتمنع من تقديم عمل فني راق حين يكون هناك رسالة وذوق فني!<br />ثالثا: العمق والثراء في مدلولات الفيلم سواء من الناحية النفسية والاجتماعية أو من الناحية السياسية حيث أن الزوج ضابط شرطة وحالته تجسيد رائع للسلطةالتي تعاني من العجز والشكوك وتمارس الاستبداد والتسلط وتسير نحو الهاوية.....<br />تحية للمخرج الذي سبب اسمه التباسا طيلة الدقائق الأولى من المشاهدة<br />وتحية للمثلين القديرين السباعي والحسيني<br />وبانتظار المزيد من الابداع والتألق<br />وكل عام وأنتم بخير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131619/http://www.20at.com/article2.php?sid=1386"

