[[comments]]
order = 7
subject = "من سمير عِشرة"
author = "سمير عِشرة"
posted = "2006-10-26"
text = "السلام عليكم<br />مبروك يا استاذ ناجي فيلمك الروائي الاول<br />ولي بعض ملاحيظ ومش مستني رد منها<br />يعني ايه واحده تقعد ف بيتها وعلى سريرها من غير الحجاب ؟ ، واسملحي اقولك ان الصورة حلوة قوي بس على قد ما كانت الصورة حلوة على قد ما كان أداء الممثلة مش تمام ، خصوصاً ان كل فعل من الممثل كان متوقع من الممثلة ( زي لقطة وهو بيضربها بالقلم مثلا وغيرها وغيرها ) ايضا دلوقتي انا اعرف منين ان ده ظابط شرطه ؟ من مسدس اطفال ؟ ولا من تليفون جاله وقعد يتكلم فيه ؟ ، وكمان ممكن اعرف هو ليه كده ؟ بيغير على مراته ليه يعني ؟ وايه ف تصرفات مراته خلته يغير عليها ؟ يعني ما شوفناش شوية دلع ودلال من مراته عشان تخليه يشك فيها مثلاً بقول مثلا يعني ,,, عموماً الف مبروك عالفيلم والمرة الجاية بليييييييز عاوزين فيلم احسن من كده .. وما تناش ( مش منتظر تعليق او رد ) والى ان نلتقي قريبا .. تحياتي .. ابن الفراعنة .. سمير عِِشرة . ابقو نزلو فيلمي يجدعاااان عشان اشوف النقد .. ايميلي اهو sas2ss@yahoo.com<br />سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131619/http://www.20at.com/article2.php?sid=1386"

[[comments]]
order = 8
subject = "الرد على بسله مسلمة مصرية"
author = "شكرا على النقد والي سيادتك الرد:"
posted = "2006-10-26"
text = "التعليق الاول : سبب علة أكرم<br />التعقيب : الفيلم القصير يختلف فى اسلوب السرد عن الفيلم الروائى الطويل .. كالفرق بين الرواية والقصة القصيرة .. فلا يتم التعرض لاسباب حالة مجسدة بقدر التعرض وابراز الحالة نفسها كحدث وكنتيجة بدون التعرض للمسببات<br />التعليق الثانى : مراعاة الواقعية<br />التعقيب .. اعتقد ان موضوع الفناجين دا .. امر ممكن يبقى صح وممكن يبقى فيه مجال للنقاش لو كان تناول المشروبات فى اكواب مدهبة .. او اكواب بها مايدل على الثراء الفاحش .. واعتقد انه اتضح انه ميسور الحال من العربية واللاب توب .. وديكولا الشقة<br />بالمناسبة دى شقتى<br />على العموم .. تبقى ملاحظة تحت النظر<br />هناك امر تالت تم التعقيب عليه وهو اسباب احتمال نادية كل تلك الفترة وهى 7 سنين<br />التعقيب : ترك مساحة من الفكر لدى المتلقى لتخيل ما الدوافع التى تقود امراءة لتحملها تلك العلاقة ..<br />فى النهاية .. اشكرك على حسن التعليق<br />ناجى العلى<br />مخرج مستقل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131619/http://www.20at.com/article2.php?sid=1386"

