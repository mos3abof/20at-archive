[[comments]]
order = 4
subject = "أسباب التجربة"
author = "ناجى العلى"
posted = "2006-10-26"
text = "السلام عليكم<br />فى البداية اشكر ادارة الموقع على استضافتها لاولى افلامى المستقلة انتاجياً ..<br />واشكر كل من شارك برأية سواء كان بالسلب او الايجاب كتعليق على الفيلم ..<br />لم ولن ادافع عن دليل خيانة ..<br />سأدافع عن أسباب التجربة وليس نتائجها<br />لماذا دائماً نحكم على نجاح التجربة بنتائجها .. ولا نحكم بأسبابها ؟؟ !!<br />التجربة تبقى وتعيش هنا ليست بنتائج ماحققته هذه التجربة.. ولكن تبقى بأسبابها التى خلقت من اجلها هذه التجربة ..<br />نجاح توماس اديسون ليس فى اختراع الكهرباء .. والاناره ..<br />لقد كان نجاحه انه حاول مايقرب من 999 محاولة للوصول الى مصدر يشع نوراً .. !!!<br />اى اصرار وعزيمة تلك التى قادت أديسون الى الصبر حتى حاول 999 محاولة فاشلة ؟؟!!!!<br />انها أسباب التجربة المستترة التى لايدركها الا من يحمل بين طيات ذاته جملة :<br />\" انا ماقبلش اكون انسان على الهامش ..<br />انا ماقبلش اكون عايش ومش عايش .. \"<br />أيها السادة ..<br />انظروا دائماً فى اسباب التجربة وليس نتائجها ..<br />لمزيد من التواصل والتفاصيل عن الفيلم<br />اتشرف بزيارتكم لموقعى<br />www.nagi.2freedom.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131619/http://www.20at.com/article2.php?sid=1386"

[[comments]]
order = 5
subject = "حلو اوى بجد"
author = "بسلة مسلمة مصرية"
posted = "2006-10-26"
text = "بص بقى يا عم ناجى الفيلم عبقرى وموسيقى والتصوير والاداء اذا كان محمد او هبة هما الاتنين كويسين اوى وحركة الكاميرا مش بتدوخ ولا حاجة بس طالما انت ليك فكر واضح وكويس كدة ليك عندى نقطتين واطلب منك الرد عليهم اولا كان المفروض توضح اساس العلة بمعنى انة كان لازم يكون هناك سبب واضح فى اعماق اكرم عقدة قديمة مثلا ثانى كان المشهد بتاع السفرة والموت جميل مناسب اوى لعيش كئيبة زى دية والله بتكلم جد مش تريقة بس مثلا كان لازم نراعى الواقعية فمثلا احنا فى بيوتنا مبنشربش الشاى فى فناجين دول ناس متجوزين وقرفنين من بعض يبقى حيبقى فى فناجين ولا براد صينى ممكن عشان الشياكة يبقى فى براد بالكهربا (كاتل يعنى ) ثانية كان لازم يكون فى سبب واضح ان مراتة تستحمل كل الاهنات دى منة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131619/http://www.20at.com/article2.php?sid=1386"

