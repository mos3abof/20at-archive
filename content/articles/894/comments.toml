text = "حسن البنا ذلك الرجل الاسطورة افرح عندما تذكر سيرتة فهو من عبق التاريخ ومن بقية المخلصين واخاف الا يجيد صاحب الدور<br />فتهتز صورة ذلك الرجل في اعين احبائة الذين لايعرفونة ابراهيم"
archived = "2006-11-02"
