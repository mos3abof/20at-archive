posted = "2006-04-25"
text = "طيب انا عايز اعرف هو مثل قبل كده؟<br />يعني هيعرف يادي كويس؟<br />خايف لحسن الدور يكون كبير عليه ونسبة الاجادة تكون منخفضة"
archived = "2006-11-02"
