[[comments]]
order = 11
subject = "عنوان شيق جدا"
author = "منال الدراوى"
posted = "2006-06-18"
text = "السلام عليكم ورحمة الله وبركاتة ازيك يا استاذ ابراهيم والله انت استاذنا وفى نفس الوقت اب لنا كلنا ولكل مضر وانا سعيدة جدا بيك وانت رجل فاضل واناهكون سعيدة عندنا ارى الفيلم الذى نشاهدة انشاء الله عن الامام حسن البنا وانت فعلا الشخصية التى تمثل هذة الشخصية وانا سعيدة جدا بثقتك التى تجعلك تقوم بتمثيل هذا الفيلم بالرغم من انى اعرف انك صحفى وكما انك تقوم بدراسة بالفعل فى المعهد الفنون المسرحية قسم تمثيل واخراج وبالتالى انت خريج المعهدوانت ممثل فى عرف النقابة المهن التمثيلية وانت بالفعل صديق وقريب واخ واب وكل شىء لنا انا ما بجامل والله انا شايفة فيك كدة كلصفة كويسة وانشاء الله تجسد الشخصية صحوانشاء الله ربنا يوفقك فى هذا الفيلم ونفتخر بوجودك فية وتمثيلك للشخصيةواهم حاجة ان ربنا يوفقك وان الفيلم يكتشف لى وللعالم كلة جميعا موهبة جديدة وهو (ابراهيم الدراوى)ممكن تثرى هذة الحياة السينمائية غير ذلك انك تقوم بتمثيل الرجل الاسطورة هزا الدور الذى يقوم بة ابراهيم الدراوى من شان هذا الرجل الاسطورة الامام حسن البنا الذى يرفع من صورتة وبالفعل يعتبر الامام حسن البنا موجود عندما نرى الشخصية التى تمثلة الرائعة (ابراهيم الدراوى )وانشاء الله يراة ملايين من الجماهير وانا ادعو لك بالتوفيق وانشاء الله كل مصر تدعو لك بالتوفيق فى اى اعمالك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124736/http://www.20at.com/article2.php?sid=729"

