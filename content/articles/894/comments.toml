[[comments]]
order = 2
subject = "مناسب جدا"
author = "ياسين"
posted = "2006-04-25"
text = "اولا ممتاز جدا اننا نشوف عمل درامى عن حياة حسن البنا وربنا يوفقهم<br />ثانيا اللى اعرفه ومتأكد منه ان ابراهيم الدراوى هو صحفى مصرى متخصص فى الفن وكمان بيدرس فى اخر ترم فى معهد الفنون المسرحية قسم تمثيل واخراج<br />وبالتالى هيكون موفق الى حد كبير لاداء الدور ان قام بمثيله<br />ثالثا لو الفيلم خرج من تحت ايد مخرج بجد من بتوع السينما الحقيقية هيبقى تحفة<br />وربنا يعنكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124736/http://www.20at.com/article2.php?sid=729"

[[comments]]
order = 3
subject = "ابراهيم لا يصلح"
author = "الاخ ابراهيم الدرواي صحفي فني جيد ..لكنه لا يعتبر ممثلا وليس لديه القدرة على التمثيل وهو ليس خريج ولا دارس في معهد الفنون المسرحية هو مستمع في معهد السينما وهناك فرق كبير"
posted = "2006-04-26"
text = "ارجو ان يخرج فيلم الاماما البنا كما يليق بتاريخه وليس اجتهادات شخصية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124736/http://www.20at.com/article2.php?sid=729"

[[comments]]
order = 4
subject = "شكر"
author = "هيثم"
posted = "2006-04-29"
text = "أشكر كل من :إيمان عبد المنعم – خباب عبد المقصود<br />على هذا الحوار الجامد بالنسبة للأخ اللي بيقول ان الدراوي صحفي فني بس مش ممثل أو ملوش في التمثيل<br />لا الدراوي دارس معهد فنون مسرحية اللي مخرج كل الممثلين غير كده انو قسم اخراج على حد علمي ولاايه يا مستر خباب<br />اكيد انتى أدرى<br />وانا احييك ياخباب على الموضوع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124736/http://www.20at.com/article2.php?sid=729"

[[comments]]
order = 5
subject = "دارس على ذمة المعهد"
author = "ياسين"
posted = "2006-05-05"
text = "ابراهيم الدراوى يدرس بالفعل فى معهد الفنون المسرحية قسم تثيل واخراج بالتيرم الاخير وبالتالى يمكن القول بانه فعلا فى نهاية صيف هذا العام بيكون خريج للمعهد ...... اذن هو ممثل فى عرف نقابة المهن التمثيلة .<br />واهم حاجة ان ربنا يوفقه وان الفيلم يكتشف موهبة جديدة ممكن تثرى الحياة السنيمائية العربية."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124736/http://www.20at.com/article2.php?sid=729"

[[comments]]
order = 6
subject = "تصحيح"
author = "ليث-الأردن"
posted = "2006-05-16"
text = "الدور الذي جسدة نور الشريف هو عمر بن عبد العزيز و عمر بن الخطاب رضي الله عنه و ان شخص سيدنا عمر لا يجسد لأنه من الخلفاء الراشدين.كما شاهدنا في فلم الرساله لم تجسد شخوص كل من ابو بكر الصديق و عمر و علي بن أبي طالب و عثمان بن عفان.<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124736/http://www.20at.com/article2.php?sid=729"

