text = "الاخ ابراهيم سيكون الشخصية المثالية التي ستقوم بالدور على اكمل وجه ونتمنى ان يتم الاخراج والمونتاج بالطريقة المناسبة لشخصية الامام<br />ونتمنى ان يرى هذا العمل الجليل النور قريبا وشكر خاص لأسرة المنتدى وتحياتنا الى الصحفي المتألق الأخ الخباب والأخت ايمان"
