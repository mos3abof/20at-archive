[[comments]]
order = 8
subject = "فرحان ومشفق"
author = "حسين عبد الظاهر"
posted = "2006-05-21"
text = "فرحت كثيرا عندما علمت بإعداد فيلم عن الإمام حسن البنا<br />لكننى وضعت يدى على قلبي عندما عرفت أن ابراهيم الدراوى - وهو صديق عزيز- هو الذى سوف يجسد الشخصية<br />لا أخفيكم سرا أخاف على الفيلم أن يفشل وأشفق على الدراوى من ان يوضع على مشرحة النقد الحاد<br />عموما ربنا يسترها ويوفقك يا دراوى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124736/http://www.20at.com/article2.php?sid=729"

[[comments]]
order = 9
