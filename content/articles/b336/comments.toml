[[comments]]
order = 0
subject = "لكل داء دواء"
author = "د.عمرو العنانى"
posted = "2006-01-26"
text = "كلنا نتمنى ان يظهر اكتشاف يرحمنا من الام الاسنان ومن كل الامراض ولكن ما توصل اليه الباحث الكندى هى مجرد مضمضة وهى نوع من مطهرات الفم بمعنى انها من الممكن ان تقلل( لمن يحافظ على استخدامها)من التهابات الفم ولكنها ليست بديلا عن الجراحة او الحشو<br />*اى انها نوع من الوقاية وليست علاج*.<br />وبالنسبة لارتفاع نسبة خلايا الدم البيضاء<br />فان ذللك يحدث عند وجود اى التهاب بالجسم مثل التهاب الزائة الدودية مثلاوليست مقصورة على جزء معين من الجسم.<br />اتمنى لكم التوفيق دائما<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145504/http://www.20at.com/article2.php?sid=336"

[[comments]]
order = 1
subject = "حرااااااااااااااام عليكو هتخربو بيوتنا"
author = "طالب في كلية طب الأسنان"
posted = "2006-01-27"
text = "على فكرة أنا بتحدى أي شخص سنانه توجعه<br />يروح لسي مايكل دة...<br />ويبقى يقابلني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145504/http://www.20at.com/article2.php?sid=336"

[[comments]]
order = 2
subject = "مضمضه وماله يا خويا وماله لا هو عيب ولا حرام"
author = "عبده نصحي"
posted = "2006-01-28"
text = "وماله يا حبيبي وماله مضمضه شوف ازاي لا هو عيب ولا حرام الا قولي يا سي مايكل هو انا كشفت ولا لسه . دوكتر شديد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145504/http://www.20at.com/article2.php?sid=336"
