posted = "2010-01-05"
text = "اة ما هم قالوا انة اثناء زيارة الحبيب نتنياهو فى شرم الشيخ طلب نتنياهو السماح بعمل مولد ابو حصيرة فتم الاذعان فورا<br />وعلشان 600 يهودى مهووس عايزين يعملوا مولد مصر تتكلف 12 الف عسكرى امن مركزى وظبابيط وعربيات ونبطشيات واكل وشرب وكلة من حساب دافعى الضرايب الغلابة<br />شكرا على الزيارة يا حج نتنياهو"
