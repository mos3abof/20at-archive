text = "بقى نعمل مولد ابو حصيرة مع انتشار انفلونزا الخنازير ونلغى مولد السيدة زينب<br />فى ذمتكم معناة اية<br />ابو حصيرة عندهم اهم من السيدة زينب<br />يبقى دول مش يهود<br />اشتم واسب ميتيين ابوهم<br />اتفو"
