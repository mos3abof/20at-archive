author = "حمرا يا زخاري"
posted = "2010-01-05"
text = "جمال منيب، منسق حركة «فوق أرضى لن يمروا»:<br />عادل العطار، منسق حركة كفاية فى البحيرة<br />دعوى قضائية جديدة، رفعها مصطفى رسلان، المحامى،<br />القوى الوطنية عن مشاركتها فى المظاهرة المزمع إقامتها اليوم فى دمنهور،<br />محمد عوض، منسق حركة كفاية وحزب الكرامة بالدقهلية،<br />حمدى حسن، عضو مجلس الشعب،<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــ<br />علشان خاطر نكسب القضية<br />لازم نفهم القضية<br />البهايم دول مش فاهمين حاجه خالص<br />شوية عيال جهله ودونا في دهيه<br />شوية شعارات كاذبة اضاعت فلسطين من قبل<br />انت عارف يا روح امك انت وهو ان النت اللي انتم قاعدين عليه طول النهار دا مفتاح تشغيله مع اليهود<br />يعني بكره الصبح اليهود ممكن يقفلوا عليكم النت"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107091054/http://www.20at.com:80/masr/news/14751-2010-01-05-08-13-24.html"

