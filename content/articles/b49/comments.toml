[[comments]]
order = 1
subject = "يا اخ احمد عيب"
author = "مينا"
posted = "2005-12-09"
text = "عيب يا اخ احمد احنا كدا دايما نشتم فى رموزنا الفنية العالمية<br />بعدين يعنى ايه حد يهدى الراجل ده انتا شايفه مجنون عشان بيجسد الواقع انتا مش متفق معايا و مع يوسف شاهين و مع كل المستنرينن ان الفوضى فى مصر عارمة يبقى بتنكر الواقع اللى عايز يجسده يوسف شاهين ليه<br />وبعدين مدة صلاحيته منتهتش ولسه عند يوسف شاهين قدرة على الابداع و العطاء بدليل ان اخر جايزة ليه كانت من 6 سنينن ( السعفة الذهبية فى مهرجان كان الفرنسى ) ودى جايزة كبيرة<br />ولعلمك فيلم الناصر صلاح الدين من اخراج يوسف شاهين اترشح للاوسكار فى وقته<br />وكان و مازال و هيفضل الفيلم العربى الوحيد اللى اترشح للاوسكار<br />ليه دايما نيجى على بعضينا و نشتم و نهين رموزنا الفنية العظيمة<br />واخيرا ممكن تقول يرحمنا من ايه (حسب اخر جملة فى تعليقك )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154841/http://www.20at.com/article2.php?sid=49"

