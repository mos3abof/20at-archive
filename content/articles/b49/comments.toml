[[comments]]
order = 3
subject = "إلى الأخ مينا"
author = "يويا"
posted = "2005-12-11"
text = "ا أخ مينا عاوز أقوللك حاجة بلاش تخلط الأمور . بقى يوسف شاهين ده رمز اللي بيجيب بنات مصر كلهم على انهم فتيات دعارة مافيش واحدة فيهم ترفض أن واحد يبوسها بل بالعكس تبقى مبسوطة . ده بلغ بيه الحد أنه صور بنت ابن رشد في فيلمه المصير على انها بالشكل ده . بالذمة ده رمز . أما إن كان على الموضوعات اللى بيتناولها فأي مخرج غيره ممكن يتناول القضايا دي و يخرجها بشكل أحسن. و مايغركش الجوايز اللي بياخدها من الاجانب دي بالظبط علشان هو كده بيفكر بنفس طريقتهم اللي بتصور الحرية على انها الهمجية و الحيوانية."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154841/http://www.20at.com/article2.php?sid=49"

[[comments]]
order = 4
subject = "يوسف لا مؤاخذة شاهين"
author = "صايع وقديم"
posted = "2006-01-01"
text = "من الحكايات المشهورة عن جو ان قال في يوم من الأيام\" **** وانا حر فيها\"<br />كنوع من التعبير عن الحرية من وجهة نظرة و التي يرفض اي رجل مسلم كان او مسيحي انه انه يرضاها لنفسة<br />مش غريبة علي واحد بالتفكير الشاذ دة انة يطلع كل الناس في افلامة منحلين زية و ربنا يرحمنا بقي----- وعلي فكرة مينا شاب مثقف وصاحب حجة ربنا يهدية للاسلام لاني احترمتة فعلا<br />hebo_sherif@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154841/http://www.20at.com/article2.php?sid=49"

[[comments]]
order = 5
subject = "رسالة"
author = "محمد مراد"
posted = "2006-06-23"
text = "ارسلت من مدة علي موقع الاستاذ يوسف شاهين قصة فيلم( خرج دود الزمن ) و لم اتلقي ردا منه لا بالرفض و لا بالايجاب<br />بالامس 22/6/2006 ي حديث علي روتانا فوجئت بالممثل هشان سليم يتدث عن الفيلم الذي يقوم بتصويره في الوقت الحالي مع المخرج / خالد يوسف - يتحدث عن الانتقال من فترة زمنية الي فترة زمنية اخري _ الانتقال عبر الزمن و كان هذا موضوع فيلمي الذي ارسلته الي الفنان يوسف شاهين الفيلم كامل عندي علي الكومبيوتر القصة و السيناريو و الحوار<br />ارجو ان كان الفيلم الذي يتم تصويره هو فيلمي الاعتراف بذلك و مراسلتي علي هذا الاميل<br />فيلم ( ارج حدود الزمن) الانتقال عير الزمن من فترة الي فترة اخري و كيفية التعايش مع زمن الانتقال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154841/http://www.20at.com/article2.php?sid=49"

[[comments]]
order = 6
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-19"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154841/http://www.20at.com/article2.php?sid=49"
