subject = "من قال ان جوجل تحترم أحد"
author = "عقلاني"
posted = "2006-02-12"
text = "ايه الي بيحصل دا!<br />موقع زي جوجل اذاع اعلان ومش عارف انه بيمس المسلمين وانه يتعارض مع القيم والمبادئ للموقع.اعذرني نحن لسنا بهذا الغباء حتي نعتقد انهم لم يعلمو بِشأن الاعلان.وانهم علي علم اليقين بوجودة.<br />ثم ان الشركات الربحية مثل جوجل لا يهمها سوي المال ولذلك ظل الاعلان الذي يشين بالعرب الفترة الكافيه.وهي شهر حتي يرفعوه.نعم شهر.وهل هذا مدة بسيطة.في هذا الشهر كان الموقع قد استفاد منه استفادة كافية.وبعد ذلك ازالوه كما لو انه يتعارض مع قيمهم.<br />من الغريب اننا نصدق ان جوجل وهي شركة امريكية 100 في ال 100 ان لا تتعاون مع البنتاجون ضد الارهابيون\"الذي هما نحن\" المسلمون والعرب.ان لم تفعل جوجل ذلك فانها وبكل تأكيد سيشهر بها انها لا تريد التعاون من اجل سلامة امريكا الدولة الام التي تحمي الامريكان البسطاء.<br />لمن لا يعرف فليعرف الاتي وانا اسف اني سأقول هذا فيكون كلامي ضد كاتب المقال. ولكني ساقوله علي اي حال.<br />هناك \"الهاجاناه\" و الهاجاناه هم الجزء من الموساد الاسرائيلي التي تهتم بالجانب الاليكتروني.هذة الجهة لها أيد طائلة في كل المواقع في العالم.ولها باع اطول في المؤسسات الامريكية مثل جوجل.<br />الهاجاناه مسؤلون عن تتبع التنظيمات المعادية لآسرائيل وامريكا.تتبع اعمالهم وتتبع رسائلهم وايضا تتبع مواقعهم.وهم مشهورون باقفال المواقع الجهادية والتي تبث افكار عدائية .يسمونها المواقع الارهابية .ويجبرون الخادم \"وهو المستضيف للموقع في السيرفر الخاص به\" ان يغلق الموقع.وقد اغلق الهاجاناه العديد من المواقع الاسلامية التي تبرر الحق للمسلمين عن الدفاع عن انفسهم وهو حق الجهاد بدعوي انها مواقع تحريضية.<br />وذلك عن طريق الادارة الأمريكية التي تهد الخادم بانها ستقطع عنه الخدمة برمتها اذا لم يغلق هذا الموقع الارهابي.<br />ولذلك فان المواقع الاسلامية لم تجد مفر الا انها ذهبت الي السيرفرات الماليزية.فرارا من الهاجاناه.وذلك لأن المواقع الماليزية ليس عيها ضغوط من الادارة الأمريكية.ولكن طالتها الادارة الأمريكية وتتبعت المواقع الموجودة علي خادمات ماليزية.ونجد ان المواقع التي تكون في العادة جهادية دعوية بامتداد .دبليو اس .مثل موقع ابوقتادة.او موقع توحيد دوت دبليو اس.وهي مواقع جهادية بحته.تشرح للمسلم ما وراء حكوماته.وما هي الادارة الامريكية .<br />ومن المعروف عن الهاجاناه انها تتفق مع محركات البحث ان لا تظهر مواقع الجهاد في محركات البحث للمعنيين من الامريكان او الاوروبيين وكذلك من بعض العرب.حيث ان المستخدم يبحث عن الموقع الجهادي فلا يجدة ولا يستطيع الوصول ايه.حتي ان بعض المواقع اذا فتحتها لا تفتح معك.مع انها موجودة في محرك البحث .<br />ثم<br />ان محركات البحث تتفق مع شركات .الاتفاق ينص علي \"عن ماذا يبحثون الناس في الشرق الاوسط في محركات البحث.عن سيارات! و منتجات تجميل!عن اجهزة خليوية!.ومهما كان المنتج فان محرك البحث يقوم بابلاغهم.فيكثفون من الاعلانات في المنطقة علي حسب ما يبحث عنه الناس ومنه انهم يبعثون له دعايه لمنتجات عن طريق الايميل.<br />ان من الغباء ان نعتقد ان اي شركة امريكية نظيفة الدين تجاه المسلمين والعرب. نحن اذا كنا في موقفهم سنسخر آلاتنا من اجل الايقاع بعدونا.فهم يفعلون المثل.<br />ما اريد قوله اننا لا نريد ان نكذب كذبة ونصدقها.\"نحن مستهدفون\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114912/http://www.20at.com/article2.php?sid=416"

