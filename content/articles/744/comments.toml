subject = "المقاطعة مش حل؟؟ من قال ذلك"
author = "شكرا على المقال يا عشرينات"
posted = "2006-02-12"
text = "اهدي المقال لكل الذين قالوا و يقولون انه المقاطعة لا تنفع و انه العرب و المسلمين ناس مش عقلانيين و تصرفاتهم غوغائية ... هذه نتيجة المقاطعة<br />هذه امم لا تفهم الا منطق القوة<br />وايضا لا انسى اهداء الموقع لموقع عشرينات"
