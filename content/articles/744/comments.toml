posted = "2006-04-26"
text = "نحن في هذا الوطن العربي الصغير الذي قمنا بتحجيمه في نطر الشعوب<br />الغربيه القويه وغير القويه والضخمه والمسخه مثل تلك الدولهالبقريه التي يبلغ عدد البقر فيها اكثر من بني البشر .على اي حال نحن على مستوى الشباب المثقف الواعي المسلم علينا ان نتابع ونكافح بكامل قويتنا لصد تلك الهجمه الشرسه التي نواجها في هذا الوقت سواء اعلاميا اواقتصاديا وانا احي جميع الاخوه الذين ساهموا في صد تلك الهجمه على العرب عموما وعلى النبي(ص)وحزاهم الله عنا كل خير"
archived = "2006-11-02"
