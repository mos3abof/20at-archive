[[comments]]
order = 2
subject = "الي الغبي محمد من الكويت"
author = "عقلاني"
posted = "2006-02-13"
text = "ان \"الهاجا ناه\" ليست \"الهجامة\" الفيلم الذي هو من بطولة ليلي علوي وهشام سليم وسيمون.الهجامة اللي في الفيلم يعني اللصوص يعني جاءت من فعل الهجوم.<br />اما الهجانة.وهم الشرطة التي تركب الهجن اي الدواب جاءت من كلمة هجن.او الجمال.وهم كانو باتحاد مع المصريين ايام وحدة مصر والسودان وبالغالب هم من السودانيين وبعض المصريين ويمكنك ان تراهم في اخر فيلم \"ابن حميدو\" الذي هو بطولة اسماعيل يسن واحمد رمزي وهندرستم.بتاع الباخرة نورماندي تو. عندما قبضو علي لاتانيا واصحابها عندمت كانو يأخذون المخدرات من \"بطن الزير\" يعني البحر.<br />اما الها جا نااه .فهم من اقصد بالمقال الجزء المخبي وراء الاجهزة الاليكترونية والكمبيوترات من الموساد.<br />بما ان ثقافتك فيلمية بحته وتكاد تخلو من العلم يا محمد الكويت.ارجو ان اكون قد شرحت لك معني الها جا نااه باسلوب الافلام الذي تفهمة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114912/http://www.20at.com/article2.php?sid=416"

