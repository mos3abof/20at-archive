author = "ابومحسن غربة 27 سنه 30 سنه صحا"
posted = "2008-11-17"
text = "الخبر منقول من المصري اليوم كالتالي<br />وبعدين المصري اليوم عندهم خطأ في الطباعة انهم لما كتبو برءاشة القاضي فلان وعضوية القاضي هشام جيوشي<br />عملوا من اول السطر على النحو الثابت في مقال المصري اليوم اقروا السطور التالية<br />أجلت المحكمة الفصل فى الطعن لجلستين سابقتين، ومدت أجل النطق بالحكم إلى الجلسة الثالثة التى عقدت أمس، وذكرت هيئة المحكمة برئاسة المستشار محمد قشطة، نائب رئيس مجلس الدولة وعضوية المستشارين هشام جيوشى،<br />ونصر منصور وأمانة سر محمد إبراهيم ضمن أسباب حكمها أنه ثبت لديها أن صدور القرار شابه سوء فى استعمال السلطة، وأكدت أن الحكم جاء مراعياً لمصلحة الناس، وحماية استقرار معيشتهم، بما يرقى للمصلحة العامة التى تعلو على مصلحة الدولة فى نزع ملكية الجزيرة.<br />فحصل ايه في الفقره الخطأ كتبتو كما ذكرت جريمة المصري اليوم يعني مشيتو على خطأ المصري اليوم وبقا المقال فضيحه<br />كما ذكرت جريدة المصري اليوم ان نصر منصور وامانة سر<br />فغلط تكتبوا كماذكرت جريمة المصري اليوم في هذا المكان لان هذا المكان موصول بالفقرة اللي قبلها<br />وحياة ابوكوا اقرأوا كويس قبل ما تنشروا<br />عيب كده اللي انتو بتعملوه دا<br />كما ذكرت جريمة المصري اليوم محطوطه في مكان غلط صلحوا المقال لو سمحتو"
archived = "2009-08-18"
capture_url = "https://web.archive.org/web/20090818170646/http://www.20at.com:80/masr/2khbar/10520.html"
