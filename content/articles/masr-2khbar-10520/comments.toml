author = "سمسار"
posted = "2008-11-17"
text = "المحكمة حكمت لهم<br />هو احنا عندنا قضاء<br />عندنا واحد مستشار بييجى يقعد على المنصة برتبة قاضى ويقول تؤجل القضية سنتين لبحث الملفات وبعد سنتين ييجى واحد يقول تؤجل القضية 10 سنين<br />فى النهاية يموت اصحاب القضية<br />والورثة يبقوا ياكلوا بعض<br />قضاء اية اللى بتتكلموا علية<br />دا اسوأ قضاء فى العالم<br />انا شفت فى دول الخليج اكبر قضية لا تزيد عن اسبوعين<br />انما القضاء عندنا - اعوذ باللة"
archived = "2009-08-18"
capture_url = "https://web.archive.org/web/20090818170646/http://www.20at.com:80/masr/2khbar/10520.html"

