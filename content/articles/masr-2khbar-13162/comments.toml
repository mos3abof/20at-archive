text = "من فترة طلع علينا وزير الاوقاف اللى اسمة زقزوق وقال ان فية اذان موحد وصرف ملايين الجنيهات على التجارب الفاشلة والمعدات التى رميت فى المخازن<br />وانا اقترح علية ان يعمل حاجة اسمها السحور الموحد بحيث تضرب الموبيلات كلها فى وقت واحد كجرس منبة<br />واهو يطلع من الشغلانة دى بقرشين وكم فيلا فى القاهرة الجديدة"
