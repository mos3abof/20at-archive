text = "على فكرة : أولا صورة هيفاء وهبي حرام شرعا .. حتى وهي لابسة هدوم<br />ثم ممكن أعرف الموضوع ده فايدته إيه ؟؟ واحنا مالنا .. ما في ماية مليون واحدة لامؤاخذة زي هيفاء وهبي .. هو عشرينات هيغير"
archived = "2004-09-26"
