text = "بسم الله الرحمن الرحيم<br />بصراحه يا جماعه دى مش صحافه صفراء ولا حاجه كل الموضوع انه الاستاذ عبد المنعم والقائمين على الموقع عايزينا نستفيد ونعرف اكتر عن كل اللى حوالينا وبالذات اللى بيقولو عليهم مطربين وبعدين احنا مزعلين نفسينا ليه ما تعمل اللى تعمله هى قابله على نفسها كده هو احنا اللى هانتحاسب مش كده وله ايه؟"
