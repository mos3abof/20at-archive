text = "أنا اعتقد أن الأنسان العربي يستمتع عندما يرى هذه المناظر المثيرة ولكن اللوم لا يقع عليه بل يقع على المجتمع ككل لأنه منالطبيعي لشخص عاش في مجتمع كهذا أن يتكون لديه شئ من الاحباط ولذلك فهو يساير نفسهبقليل من المتعة و الاثارة وطبعا فان هيفاء وهبي تحت الطلب لانها بصراحا ترضي جميع الاذواق و انابرأيي انا ققد تحمل الميدالية الدهبية في مسابقة تخريب البيوت فوق رؤوس اصحابها"
