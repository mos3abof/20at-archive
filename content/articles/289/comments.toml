[[comments]]
order = 6
subject = "عمي وتاج راسي"
text = "بالنسبة للجملة الأولى دي محتاجة فتوى شرعية من متخصص حول الصورة المنشورة هل هي حرام شرعا أم لا .. إلا لو حضرتك مفتي طبعا<br />الموضوع ده فايدته ايه ...<br />انت نفسك جاوبت لما سألت سؤال استنكاري.. هوة عشرينات هيغير؟<br />وأنا بقولك بدون استنكار وليه ما يغيرش يا أخي مش رسولنا علمنا اننا نزرع فسيلة حتى لو القيامة هتقوم ممكن أي حد يقول يعني ايه لازمة الفسيلة؟.. لكن الرسول قال ازرعها وبالمثل متهيألي عشرينات بيزرع بس مش فسيلة لكن اسفين بين هيفاء وبين أحبابها الذين يصورونها ملاكا وادخل يا شيخ على موقعها والمواقع اللي جنبها وانت تعرف<br />فلما عشرينات يظهرها على حقيقتها أكيد تفرق قوي<br />وممكن يغير إن شاء الله"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044114/http://www.20at.com:80/article.php?sid=361"

