author = "لكو يا اولاد الشرموطه يا اسلام ليش بتطلعوا كلمات سكس مثل الطرش.... ولموا روحو شوفو خواتكو يا ولاد القحبه كل اخت فييكو عمتنتاك مع 16000 رجل بالوعر... ولكو كس امه كل واحد كتب عن هيفاء وهبي....ولكو كس اختو هيك موقع مثل كس ست اللي سواه....وكس ام كل واحد بطلع اشعه عن هيفاء وهبي ونانسي عجرم واليسا...والخ."
