[[comments]]
order = 2
subject = "منهج النعام"
text = "ما علاقه الصحافه الصفراء بالموضوع .. ايهما افضل ان تعرف و تكون رائيا بنائا على معلومات موثوق فى مصدرها ام ان نكون اراء انطباعيه قد يكون لا علاقه لها بالواقع ام ان تتبع المنهج العربى الشهير بدفن رؤسنا فى الرمال و كان شيئا لا يحدث . لقد سمعت من اسبوع حديث بين مجموعه من الشباب و الشابات كانوا جالسين على طاوله خلفى فى احد المطاعم و كان الحوار عن هيفاء وهبى و كيف ان ما نراه على شاشات التليفزيون لا يعكس بالضرورة حقيقتاها و ردد احدهم الجمله المذكورة علي لسانها فى المقال بانها انسانه محتشمه و تحترم قواعد مجتمعها .. و اخذت افكر كيف يدافعون عنها بهذا الحماس ؟ الم يقرؤا ابدا .. الا يفهمون ما يروة .. صحيح انى لم اعتد ان اصدر احكاما على الاخرين بظاهرهم لان الظاهر من الناس لا يعكس بالضرورة باطنهم و لكن للظاهر دلاله يجب ان نفكر فيه . لقد كتب الموضوع باسلوب جديد احى الكاتب عليه ."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044114/http://www.20at.com:80/article.php?sid=361"

