[[comments]]
order = 8
subject = "كفاية وبرضه حرام"
text = "اما حكاية الفتوى الشرعية فدي مش اختصاصي فعلا ..<br />ولكن بتقول انك بتكشف هيفاء وهبي امام معجبيها واقولك ان هيفاء وهبي مكشوفة امام معجبيها (من غير كشوف) .. وان معجبيها معجبين بيها بالشكل ده وهي قدوتهم في التحلل الاخلاقي ، والمشكلة انها صارت قدوة للشباب ف هذا الكشف اكثر من اللازم وهو ليس التعري فقط بل البجاحة في التعري .. وهي تريد مزيد من الأضواء كي تسلط عليها وعلى سوءاتها<br />وبالتالي احب اقول لك كان فيه موضوعات اهم تقدر تقدمها للشباب وتكشف لهم حقايقها وتدعم اهتمامهم بها<br />ودمتم يا استاذ"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044114/http://www.20at.com:80/article.php?sid=361"

[[comments]]
order = 9
subject = "هريدي"
text = "ممكن أسأل سؤال واحد لبناني يجاوبني عليه .. ومع احترامي للشعب اللبناني .. أنا لو لبنانب كنت رفعت قضية على هيفاء واخواتها اللي بيبرروا تعريهم شبه الكامل بأنهم لبنانيات ..\" وأصل احنا في لبنان بنلبس كده .. ههئ ههئ \" والله دول شوهوا الشعب البناني اللي اتحول على شاشات الفضائيات لكباريه مفتوح ع الهوا<br />يا استاذ علي ما تعمل موضوع عن حزب الله أحسن وفكرنا بتحرير جنوب لبنان بدل ما احنا قاعدين ماسكين في سيرة ستات لا مؤاخذة يعني (مع احترامي لكل الستات المحترمات)"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044114/http://www.20at.com:80/article.php?sid=361"

