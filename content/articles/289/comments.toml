subject = "عاشقة لبنان"
text = "السلام عليكم اخوتي<br />بالنسبه لسؤال الاخ هريدي اولا انا بخجل جدا من كون هيفاء وامثالها من بلدي بالاخص انهم شوهوا صورة لبنان لدرجه انه اصبح مثال التسيب والعري ,اللي يزعجني اكثر ان العرب لا يرون فينا الا هيفاء ونانسي واليسا بس والله فينا محجبات محترمات والحمد لله.القضيه ما رح تنفع لان ناس تفاخر بالفاحشه لن ينفع معها شيء لان ان لم تستحي فافعل ما تشاء والمضحك تنها بتقول انها تراعي الاخلاق ما شاء الله وارجو ان لا تحكموا علينا من خلال حثاله تعرضها قنوات تسعى للقمه عبر عرض العري على شاشاتها والسلام"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044114/http://www.20at.com:80/article.php?sid=361"

