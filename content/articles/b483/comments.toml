subject = "الى عبد الله مفتاح ثم الى هبهوب"
author = "نيفين"
posted = "2006-02-25"
text = "اولا الاستاذ عبد الله اقر بصراحه ان انت صح لان الوسطيه فعلا معناها الصحيح و الدقيق هى اخذ المذاهب الوسط و علشان كده انا ببحث عن كلمه توصل اللى قصدته و لان الموضوع طويل اسمحلى اطلب منك الانتظار لحد ما ابعث ما قصدته نظرا لضيق الوقت حاليا<br />و انتى يا هبهوب ازعل بقى و لا ايه<br />اكرم يقرا المزكرات قبل منى بتاع ايه يعنى انا لو شجعتينى و نزلت مزكراتى زيك هديها لحد قبللك<br />و بعدين هو الموقع اللى قلتى هتبعتيه هو اللى فوق دا و لا ايه<br />هبهوب ببليز لو هو قولى الخطوات واحده واحده اصل الدراسه محت مخى و بقيت بفهم بصعوبه و مش عارفه دى اعراض غباء مبكر و لا ايه<br />مستنياكى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123853/http://www.20at.com/article2.php?sid=483"

