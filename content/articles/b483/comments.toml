[[comments]]
order = 1
subject = "الالتزام"
author = "أبوعبدالله"
posted = "2006-02-22"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم ورحمة الله وبركاته ’’’’<br />سئل الشيخ محمدبن عثيمين رحمه الله عن كلمة ملتزم فقال لايسمى ملتزما ولكن يسمى مستقيما’’<br />اما تعليقي علىالموضوع هو ان الانسان اذا استقام فمعنى ذلك انه انتبه من نعاسه وتيقظ عن غفلته إلى إصلاح نفسه واستكمالها وتزكيتهافهو يسعى إلى طريق الفلاح قال تعالى(قد أفلح من تزكى...)الآية<br />وقال تعالى(قدأفلح من زكاها...)الآية فهو أي المستقيم حري به أن يتعلم كيف الطريق لإصلاح نفسه وكسب قلوب أسرته لدعوتهم إلىالاستقامة على أمر الله اما الجاهل فسيقع كثيرا في أخطاء كثيرة تؤدي إلى كره أهله للإستقامة فأوصي نفسي والشاب المستقيم أن يقرأ قوله تعالى(ادع إلى سبيل ربك بالحكمة والموعظة الحسنة...) الآية بتدبر وتعقل فبدا جل وعلا بالحكمة قبل الموعظة وأسأل الله لنا وله الثبات على هذه الاستقامة حتى نلقى الله عزوجل فكلها أيام أو ساعات أودقائق أو ثواني ونحن مغادرون عن هذه الدنياوأسأل الله ان يجعلنا ممن قال فيهم(إن الذين قالوا ربنا الله ثم استقاموا تتنزل عليهم الملائكة ألا تخافوا ولاتحزنوا وأبشروا بالجنةالتي كنتم توعدون نحن أوليائكم في الحياة الدنيا...)الآية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123853/http://www.20at.com/article2.php?sid=483"

[[comments]]
order = 2
subject = "قصة ملتزم فى بيته"
author = "محمود حنفى"
posted = "2006-02-22"
text = "الحمد لله على نعمة الإسلام و كفى بها نعمة...<br />بداية إلتزامى كانت بداية ميلادى. و بداية الخير الوافر على بيتنا. حيث كنت العضو المشاغب دائماَ... مع الكل. أنا فاكر لما أختى شافتنى وأول مرة ماسك المصحف بقرأ فيه بصوت مسموع؛ فضلت مبحلقة فياكأنى كائن فضائى<br />و بابا لقيته بيعدى من جنبى و هو بيختلس النظرات ثم سمعته و هو ماشى بيقول: ربنا يهدى<br />المهم:::<br />بعد الالتزام بتتغير الثوابت بتاعتك, و أحياناً تتناقض مع الثوابت بتاعة أهلك, فالمطلوب منك الحكمة و الصبر الشدييييد على الأفكار الخاطئة و الثوابت المخالفة للدين مع الالتزام بالأفكار الصحيحة و القيام بأعمال الدين أمامهم. و هم برضه عندهم عيون بيشوفوا و بيتأثروا. كذلك مهم جداااااااا إنك تكرمهم باستمرار(طبق حلويات - شيكولاتة - فاكهة ...) الأكل بيوصل الدين من أسلك السبل و إلى القلب مباشرة و ليس إلى الجوارح فقط...<br />و صدقونى لما بلاقى بابا أو ماما بيقوموا الليل بسبب تأثرهم من التزامى بفرح أوى. لما بلاقى أختى الصغيرة بتسمع قصص الصحابة و الصالحين منى و هى مبرقة عنيها و متشوقة بتهون عليا أى معصية ممكن يكونوا لسة مستمرين عليها!!!<br />لما أخويا اللى فى سن المراهقة ييجى يستشيرنى فى الدين بحس إنى كبير في عينه بسبب الالتزام بقول اللهم لك الحمد إنك مجمِّل صورة الالتزام فى عنيهم بسببى و بدعيلهم هما كمان ربنا يكرمهم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123853/http://www.20at.com/article2.php?sid=483"

[[comments]]
order = 3
subject = "كويس"
author = "sweet_princess"
posted = "2006-02-22"
text = "دا شئ جميل ان الانسان يلتزم بس مش يتعصب بقى وكل شئ حرام حرام لاء لازم يكون في عقل متفتح وبيفكر باستمرار في الكلام اللي بيسمعه ومش اي حاجه تتقال كده تتاخد على انها صح<br />والشئ اللي لاحظته بجد ان اللي بيلتزم دا لو كان التزامه صح ومن غير تعصب شديد بيبقى خير ليه ولاهله كمان والحمد لله ان اخويا وخطيبي الحمد لله ملتزمين ودا شئ بيسعدني<br />وربنا يثبتنا كلنا على الاسلام<br />وفي النهايه احب اشهدكم كلكم على حاجه وكده ابقى خلصت كلامي وياريت كلكم تقولوها ( لا اله الا الله محمد رسول الله )<br />اللهم احينا وامتنا على الاسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123853/http://www.20at.com/article2.php?sid=483"

[[comments]]
order = 4
subject = "الالتزام جميل بس المهم الدَّخْلَة"
author = "احمد"
posted = "2006-02-22"
text = "الالتزام جميل بس المهم يتوجه صح يعني ان الواحد قبل لما يمشي لازم يكون فاهم وطبعا مش هايفهم الا لم حد يفهمه ولازم اللي يفهمه ده يكون فاهم هو كمان لان اللي بيحصل ان الواحد بمجرد ما يلتزم بيبقى في الاول معندوش فكرة عن اي حاجة في الدين فأي كلمة بيسمعها من اي شيخ بيصدقها ويعمل بيهاالمهم ان الواحد يفكر قبل اي تصرف وان ميسمعش من طرف واحد لازم يسمع كل الناس الاول وبعدين يشوف هو مقتنع بفكر مين يعني (يستفتي قلبه من الاخر)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123853/http://www.20at.com/article2.php?sid=483"

[[comments]]
order = 5
subject = "يا ملتزمين العالم صبرا"
author = "نيفين"
posted = "2006-02-22"
text = "البيت كله ملتزم و الحمد لله بس لو تقصدى بالالتزام اطلاق اللحيه و منع الاغانى و التلفزيون و النت الا المواقع الاسلاميه و ....... الى اخر الممنوعات يبقى اخويا<br />و رحله الالتزام دى بدأت من سنتين تقريبا و كانت الممنوعات فيها بتتدرج يوم بعد يوم<br />و بصراحه بنواجه معاه مشاكل لانه بيصطدم بينا كتير و لو جينا للحق هو صح بس هو موصلش للى هو فيه فجأه و لكن تدرج فلمازا يطالبنا بالتغير فجأه<br />و هزا هو الصراع اليومى معاه على الاقل بالنسبه لى لان مجرد سماعى اغنيه بيدخلنى ف جدال عقيم معاه<br />و عشان كدا بقول لكل الملتزمين و الله العظيم انتو صح بس ادزنا فرصه نتدرج ف القرب من ربنا زى ما انتو اتدرجتو<br />اصبروا علينا دا ربنا قال للرسول و لو كنت فظا غليظ القلب لانفضو من حوللك<br />و الدعوه<br />تكون باللين و الرفق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123853/http://www.20at.com/article2.php?sid=483"

[[comments]]
order = 6
subject = "و ما العيب ف الوسطيه"
author = "نيفين"
posted = "2006-02-22"
text = "و بعدين ايه العيب فى الوسطيه و اتخاز المنهج الوسطى طالما اؤدى فرائضى و برضى ربنا و بحط ضميرى ادام عينى ف كل تصرفاتى<br />انا مش عايزه اخوض ف الكلام دا لان انا مش من الدين بمكان لدرجه انى افتى بس انا طالبه من كل ملتزم الصبر على الباقيين<br />و خلونا ندعى دعاء عمرو خالد يا رب طلعنا من الدنيا دى على خير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123853/http://www.20at.com/article2.php?sid=483"

[[comments]]
order = 7
subject = "يا ايها الدين امنوا انا جعلناكم امة وسطا اية"
author = "نور شيت"
posted = "2006-02-22"
text = "بسم الله الرحمان الرحيم اما بعد اخواني اخواتي في الاسلام درسة هده المقالة فنالت اعجابي كثيرا فانا ابادر واعلق عليه واقول شكرا يا هبة الله احمد على هده المقالة الرائعة التي من خلالها يدرك البعض ان في دكر الله تطمئن القلوب شكرا... اما بعد فانا اخطبكم واقول لقد استهل هبة الله مقالتها الثمينة بدكر الالتزام واثاره داخل الاسرة.. فتفكرو معي كيف سينعكس التزام الاسرة على المجتمع اجابيا ..واقول كدالك ليس الالتزام هو التعصب لا ابدا فالاسلام هو اول من دعى الى التسامح والدي حتنا الرسول صلى الله عليه وسلم كدلك فلدا يجب ان نتبع منهج الوسطية والاعتدال لا الخروج عن نطاقه والتشدد فنصيحة مني يا اختي المسلمة لا ترتدي الحجاب بدون اقتناع فالاقتناع هو اللاساس الدي ينبني عليه اسلامك اتبعي المرحلية في حياتك _1 ادعو من الله التوبة والمغفرة تم ابدا بقلبي الركيزة لاماني_2 استر عورتي تفاديا للفتن _3 افكر في حجابي ارتديه بقتناع لاكون مرتاحت البال فهده سبل لتزامك اختاه فقد عملة على الحفاط على نفسي مند ان دخلت لدين الله فكان اقتناع برتداء حجابي منبع راحتي تم تابعت مسيرة حياتي والحمد والشكر لرب العالمين واستغل دخولي لهدا الموقع لاقول لكم معا يدا بيد لنحرص على وحدة ديننا ولا ندع فتحتا او تغرة لدخول الاعداء ليدمرون ونصيحتي لشباب اليوم صبيانا وصبايا ادرسو سير الصحابة الكرام وكيف دافعو عن دينهم واستعدو لكي يموتوا في سبيل ان يصل الينا معززا مكرما فلنفعل متلهم والندافع عن ديننا ليبقى شامخا في العلى ليصل بدوره لابناءنا وشكر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123853/http://www.20at.com/article2.php?sid=483"

[[comments]]
order = 8
subject = "الوسطيه كويسه ولكن"
author = "عبدالله مفتاح"
posted = "2006-02-22"
text = "الوسطيه حاجه جميله اوي ولكن ميكنش الواحد في معصيه واتعود على انه يعملها ويقول عشان اكون متوسط يعني مثلا اعرف شلة ولاد بيخرجو مع البنات ويقولو انهم بيخروجو باحترام ودي وسطيه ولازم محدش يشد عليهم ويقلهم متصاحبوش بنات لان ده في نظرهم تشدد والاكتر من كده ان شلة البنات لبسهم سبور خالص و بردو مقتنعين انهم لازم يكونو وسطيين لان الحاجات الواسعه من وجهة نظرهم للكبار وهما لسه صغيرين ولازم يعيشوا سنهم ولو معملوش كده يكونوا متشددين والدين يسر<br />اللي عايز اقوله من الاخر ان الوسطيه تكون اتباع راي من اراء العلماءالمشهود لهم بالكفاءه لكن اني اكون بعمل حاجه كله متفق على انها حرام واعتبر نفسي متوسط ابقى غلطان لاني كده خرجت من الوسطيه للحرام ربنا يهدينا جميعا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123853/http://www.20at.com/article2.php?sid=483"

