subject = "تؤامى ملتزم"
author = "الحقيقه ان المفروض اننا فى البيت ملتزمين يعنى طالعين على تربيه اسلاميه بغض النظر عن اننا كنا بنعمل بيها او لا انا عن نفسى كنت ملتزمه لكنى باحب البس على الموضه والوان جميله وترتر واكسسوارات وكده"
posted = "2006-03-02"
text = "لكن اخى التؤام اللى كان عايش حياته اوى لما التزم بقى واحد تانى خالص بيقعد معانا فى البيت وجيب لنا هدايه وكما لبس جلابيه وربى لحيه<br />وبعدين بقى يقول حرام التليفزيون ويقولى بطلى حب الدنيا ولبس الملابس ديه مع انى محجبه ومبلبسش غير جيبات بعض اخواتى بقوا يتضايقوا منه ويقولولو بس يا عم الشيخ انت مبيعجبكش حاجه<br />لك انا على العموم فرحانه بالتزامه ورجوعه الى الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123853/http://www.20at.com/article2.php?sid=483"

