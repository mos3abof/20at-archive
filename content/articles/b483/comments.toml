subject = "الاتزام......."
author = "هاجر عبد الرحمن"
posted = "2006-02-22"
text = "الالتزام كلمة لابد ان يعرفها الجميع علما وعملا فالالتزام ليس تعصب بل هو اناره وجه وحب العمل ونظافة ثوب واثبات اعجاب الاخرين بك فالملتزم او الذى اندرج تحت هذه لواء هذه الكلمة فلابد ان تكون طريقة التزامه سلسة مقبولة من الاخرين حتى يقبلوا هذا الالتزام من كل الاوجه فلابد الملتزم يكون ذو بهجة وجه على الناس."
