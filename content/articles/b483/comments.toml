[[comments]]
order = 11
subject = "الشيخ أكرم"
author = "أكرم ابو دقن ( سابقا )"
posted = "2006-02-22"
text = "لو الالتزام دقن و لحية و بتاع ( سني على رأي ابويا ) يبقا انا كنت ملتزم و ارتديت يعني حلقت دقني<br />طب ليه كده ؟؟<br />السبب المعلن : عشان الجيش<br />السبب غير المعلن : طبعا مش هقوله<br />باختصار انا كنت ملتزم و اتعرضت لضغوط كبيرة من كل افراد العيلة فردا فردا ( الاقارب حتى الدرجة السابعه ) لدرجة ان الموضوع وصل ان احمد ابن خالي محمد ذو ال3 شهور قال لابوه يقولي انه مش هيبقا طيار عشان ابن عمته ارهابي و مسجل سلفي في امن الدوله<br />على العموم الدقن مش هي كل حاجه بس حاجة مهمة جدا و الله نفسي ارجعلها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123853/http://www.20at.com/article2.php?sid=483"

