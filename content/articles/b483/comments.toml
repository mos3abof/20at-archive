subject = "القصه وما فيها"
author = "عبدالله مفتاح"
posted = "2006-02-21"
text = "الموضوع ان بعض الناس بيطلبوا من البنت انها تهزر مع كل البشر وتدحك مع اي حد واي حد يستخف دمه يبقى مطلوب منها تجامله وتدحك وتسلم على اي حد يدخل البيت وتعد معاه وتتعرف عليه وبكده تكون هي بنت اجتماعيه يا اما تتحول الى انطوائيه وعندها كل الامراض النفسيه وطبعا يا ريتها ما التزمت"
