author = "حنان"
posted = "2009-07-12"
text = "الحزب الذى عرض الدفاع عن القاتل حزب متطرف يسمى بالحزب القومى الألمانى أو النازيين الجدد، ويوجد جدل حول منعه أو لا، كما أنه مراقب من الحكومة الالمانية،<br />لأا أحاول الدفاع عن الالمان ولك الصورة ليست أبيض وأسود،ويجب فهم السياقات المجتمعية وانه يتعرض للانتقاد من الأحزاب الأخرى، ولكن يجب أن يكون المجتكمع الالمنى أكثر حزماً فى صد العنصرية ومد اليمين المتطرف"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713154450/http://www.20at.com:80/masr/2khbar/12626-2009-07-12-12-18-50.html"

[[comments]]
