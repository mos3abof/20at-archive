subject = ""
author = "hoda mourad"
posted = "2009-07-12"
text = "رحم الله الشهيدة وادخلها فسيح جناته فدم الشهيدة الطاهر يلطخ يد كل مسلم خائن لدينه الذي يعتقد ان المسلمين يجب ان يضعوا ايديهم في ايدي اعداء الاسلام وهذه حقيقة والله ان اعداء الاسلام كانوا يتخفون و يخفون عدائهم لنا ليجذبوا اليهم الجهلاء و لكن الان بسبب ضعف المسلمين هم انفسم اسقطوا ا لاقنعة و اصبح العداء سافرا و اعلي ما في خيلنا نركبه.ودفاع اي مسلم عن دينه هو فرض عين كما علمنا من كبار علمائنا ومن يسقط فهو شهيد مات دون دينه"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713154450/http://www.20at.com:80/masr/2khbar/12626-2009-07-12-12-18-50.html"

[[comments]]
order = 2
subject = ""
author = "حادث فردى ازاى"
posted = "2009-07-12"
text = "وهناك دعم من احد الاحزاب للقاتل بالمال والمحامين للدفاع عنة<br />وسيؤلف المحامين قصة مثل انة كان تحت تاثير الخمر او حالة نفسية متوترة نتيجة الارهاق والعصبية التى سببتها لة المصرية الشهيدة<br />سيؤلفون القصص وهياخد حكم مخفف بالتعاون مع الحكومة المصرية وهيدفعوا كم مليون يورو لتوريد طرمبات محطة مجارى تسميها الحكومة تنمية<br />والسلام على روح الشهيدة<br />وابقوا قابلونى فى سوق المشمش"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713154450/http://www.20at.com:80/masr/2khbar/12626-2009-07-12-12-18-50.html"
