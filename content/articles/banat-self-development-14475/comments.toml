text = "اقتباس mishmesh:<br />والله يا جماعه الواحد مش لو قاله انت كده هترضيني دا لو قاله انت كده هتحييني مبعملش غير الي في دماغ الي خلفوه دا دماغه جزمه لو وقفت علي دماغي الي عوزه يعمله<br />هههههههههه والله ده إنتي موتيني من الضحك أنا عندي نفس النوعية السوده دي اللي دماغها زي الجزمة مش عارفة أعمل في أمه إيه أقوله على حاجة مضيقاني يقولي حاضر مش هعملها ومفيش خمس دقايق يقوم عاملها تاني كأنه متسلط عليه أنا قربت يجيلي الضغط والله"
