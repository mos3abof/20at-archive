author = "كلي امل"
posted = "2009-05-20"
text = "الحمد لله والصلاة والسلام على خاتم الانبياء والمرسلين<br />ياجماعة اتوقع المشكلة ليست في البنات التي يقمن في هذه الممرسات الغير محببه يكون سببه اولا الاسرة التي لم تربي بنتها التربية الصحيحه التربية الاسلامية وتعريفها بالعادات والتقاليد .<br />المفروض من الاسرة مناقشة بعض الامور مع الابناء والبنات والستماع الى راي كل واحد منهم في اي موضوع يتم مناقشة وفي حالة وجود بعض الافكار عند اي واحد منهم يتم مناقشة امام الجميع وتوضيح الامور ويبن له الاب او الام الصح او الخطاء وبعدها يفهم الجميع ان هذا الكلام لايجوز ان يكون في المجتع المسلم ونبذ هذه الممارسات الخاطئه<br />واخيرا اتمنى من الله عز وجل ان يحمي بنات وابناء المسلين من كل شر"
archived = "2009-05-22"
capture_url = "https://web.archive.org/web/20090522133505/http://www.20at.com:80/7ayatna/9553.html"

