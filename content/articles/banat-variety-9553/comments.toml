author = "عــــــســـل"
posted = "2009-08-19"
text = "اااااخ بس الله يلعنس ياهيفاء البويه هي البويه الوحيده الي بالمدرسه<br />وتسوي الي مايتسوا والبنات خاقين معها وموعجبين بها ذاك اليوم صديقتي النوري راحت تشتري من كفتريا المدرسه وعندنا بالمدرسه زحمه وتدافع وربي مانقدر لاندخل ولانطلع ثانوي ومتوسط وكل وحده ورا الثانيه وفوقها<br />الموهيم قامت النوري دخلت وسط الزحمه فجأه لقت هيفوه البويه وراها وبسبب التدافع وكل وحده ضاغطه الثانيه هيفاء البويه لاصقه فيها من ورا وماسكه بطن صديقتي وتلمسها من ورا<br />ومحد ايلاحظ لان زحمه وتدافع عصبت صديقتي النوري<br />وطلعت بسررعه زعلانه ومااشترت شي من المقصف بسببها.<br />الله ياخذها هيفاء البويه مره منتصه عندي فأيام الاختبارات وتجي تجلس جمبي وانا ادرس لحالي اقول شتبي ذي ياناس؟<br />خوفتني والبنات يطالعوني يقولون وش جابهم مع بعض لايكون حبيبتها<br />المهم قاعده تسأل قامت تهاايط مهاااايط<br />قمت اصرف واحط رجولي وانحااش عند صديقاتي.والحمد لله ابشركم تم وبحمد الله ذهاب هيفاء من مدرستنا يعني السنه الجايه مو عندنا سافرت والبنات يبكون عليها<br />اكررره البويات الظاهره خطيره جدا"
archived = "2009-12-28"
capture_url = "https://web.archive.org/web/20091228090934/http://www.20at.com:80/banat/variety/9553-2009-11-04-12-59-21.html"

