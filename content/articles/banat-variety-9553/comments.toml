posted = "2010-02-17"
text = "بصراحه البويه بنات كارهين جنسهم مره وهذا سببو مش الاهل هذا سببوالمخالطه بين البانات والاولاد انا اقولكم كيف البنت لازم لم تطلع الى اي مكان لازم تكون محترمه وضابطه ومحتشمه نفسها اما مع الاولاد فماراح يشره عليهم احد يعلي صوته في السوق او في المستشفى او في اى مكان وهذا شىء واضح فلما تشوف البنت الولد تميل عن جنسها الى الجنس الاخر الا وهو البوي وهكذا تكره نفسها الى ان تصبح بوي بوووويه وانا بصراحه كل بنات عمامي بويات اسوا ايام عمري لما اروحلهم والمشكله اني اخاف منهم ولما اشوفهم<br />ييييييييييييع ولازم اسوي نفسي مثلهم انا اخوي يقولي ان حياه البنت احلا من حياة البنات انا مستغربه اقوله لي يقولى بعدين اقولك بصراحه اناهاذي فكرتي عن البويه"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309061354/http://www.20at.com:80/banat/variety/9553-2009-11-04-12-59-21.html"
