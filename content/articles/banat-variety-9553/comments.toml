posted = "2010-01-25"
text = "اول شي هذا اسمه حريه شخصيه ودام انتو خايفين من البويات هالكثر بعدو عنهم ومالكم شغل باحد<br />وبعدو عن الاماكن المعروفه الي احنا الليديات والبويات نتيمع فيها<br />واذا احنا انحب البويات فاهاذا شي من داخلنا ما نقدر انغيره<br />و اعتقد ان بويات المدارس اذا شافوا ان النت عطتهم مجال فيصير الشي عادي سووو ماتيون وتلومون البويات<br />سي يوووووووووووو<br />sweet lady"
