text = "الحمدلله وكفى والصلاة والسلام على النبي المصطفى<br />المشكلة ان بعض المسؤولين يطلعون ويقولون انه هذه حالات نادرة وقليلة ولا ترقى لمستوى الظاهرة الى ان تتفشى اكثر واكثر ويحل غضب الله علينا لاننا ساكتون على الفسق لا ننصح ولا ناخذ بيدهم ولا نصدر القوانين التي تحد من نشاطاتهم وتبين حقائقهم …<br />الله يعين"
archived = "2009-05-22"
capture_url = "https://web.archive.org/web/20090522133505/http://www.20at.com:80/7ayatna/9553.html"

[[comments]]
