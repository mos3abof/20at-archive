subject = "مش قاعدة"
author = "رحاب"
posted = "2006-10-09"
text = "مش شرط ان تكون احلام الطفولة كلها عن الوظيفة وبس ممكن تكون احلام اجتماعية, يعنى الاولاد والاسرة ومن المعروف ان ليس كل مايتمناه المرء يدركة, انا عن نفسى اتمنيت انى ادخل اعلام القاهرة والحمد لله كان, اتمنيت وانا فى ثانوى انى ابقى من الأوائل على مدرستى والحمد لله, بس دا ميمنعش انى فى حاجات تانية اتمنتها ومتحققتش.<br />صعب نطبق على البشر قاعدة ونقول ان حلم الطفولة ضاع.<br />يمكن تبقى القاعدة انه هيضيع لاجيال تانية<br />طول ما الوضع يبقى اسوا يارتنا نقول يبقى على ماهو علية<br />واقصد بية كل حاجة وضع احتماعى , سياسى<br />لاننا فى مجتمع، الحمد لله متغير كل ثانية.<br />ربنا يستر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113449/http://www.20at.com/article2.php?sid=1319"
