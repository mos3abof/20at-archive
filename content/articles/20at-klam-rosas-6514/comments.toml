author = "مش مهم"
posted = "2007-07-01"
text = "انا مش شايفة اى داعى للنقد ده اساسا ولو كان الفيلم ده هايف وملخبط زى ما بتقوله امال بقى<br />الافلام اللى موجودة على الساحة تبقى ايه وعموما انا شايفة ان ديكتاتورية الرجل وتحكمه الزايد<br />مهما زاد المستوى الثقافى والمادى والاجتماعى هى فعلا موجودة وتستحق اننا نركز عليها<br />والحياة مليانة امثلة كتيرة كده فى الواقع وفى علاقات بتستمر بمعرفة الاهالى وفى كتير<br />بطله بقى تدفنه راسكم فى التراب وتقوله ازاى ومش ازاى والفيلم فى حتة كوميدية نتيجة<br />الموقف تحترم وبجد انا شايفة الفيلم رائع وافضل من حاجات كتير وافكاره جديدة"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014502/http://www.20at.com:80/20at/klam-rosas/6514.html"

