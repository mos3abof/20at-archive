text = "مش كل البنات تستاهل المعاملة اللى أنت قولت عليها يا محمود .بعدين دى وجهة نظر خاصة يعنى انت سألت بنت واحدة<br />مش سألت كل البنات .وبالنسبة للفيلم لايوجد أم تسمح لأبنتها أن تصاحب ولد لأن ذلك يضر سمعة بنتها واخواتها حتى<br />وان كانوا متربين مع بعض."
