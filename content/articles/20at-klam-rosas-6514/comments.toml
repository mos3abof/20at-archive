author = "أي حد"
posted = "2007-07-06"
text = "بصراحة الفيلم يعتبر من أحلى أفلام السقا و أساسا الفيلم المفروض أنه كوميدي و مش بيفرض أن الراجل لازم كلمته هي اللي تمشي و الناس اللي دخلت الفيلم علشان تستمتع به هتعرف أنه كوميدي و لذيذ لكن الناس اللي عايزة تنقد لمجرد النقد ممكن يدخلوا الأفلام الدرامية _ الأجتماعية لكن مش الكوميدية لأن الفيلم ده على الأقل كوميديا راقية مش كركر و التفاهات اللي ملهاش موضوع أساسا و الفيلم ده هو أحسن الأفلام في هذا الموسم على الأطلاق و له قصة و موضوع و بداية و وسط و نهاية مش زي كل اللي موجود حاليا"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014502/http://www.20at.com:80/20at/klam-rosas/6514.html"

[[comments]]
order = 8
subject = ""
author = "محمود مهدى"
posted = "2007-07-06"
text = "مع حضرتك حق ..بس فى امهات كتييييييير تسمح لبنتها تصاحب ولاد ! احنا اخلاقنا ما انحدرتش من شوية<br />الابهات والامهات اللى بيربوا شكلهم بينقرضوا !!!<br />نرجع تانى للفيلم<br />السقا فى الفيلم بيحبها وحريص مش متحكم ومسيطر وديكتاتورى<br />وبعدين الفيلم كان ماشى رومانسى وكوميدى لطيف بس فجأة مسدسات وخطف وبتاع ! لا كده الفيلم رخّم اوى<br />وعجبنى مشهد انهم يتقابلوا فى الغردقة وفى نفس المكان ! وبنتريق على الافلام الهندى او افلامنا القديمة<br />وكمان من قلة الاسامى…تيمور وشفيقة !"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014502/http://www.20at.com:80/20at/klam-rosas/6514.html"

