[[comments]]
order = 0
subject = ""
author = "واحد و خلاص انتوا ها تنسبوني؟؟"
posted = "2007-07-01"
text = "لما تشوف الفيلم انه متلخبط امال الواقع يبقى ايه؟؟ دا هو الواقع يعينه… شباب كده فاضية و مجوفة بسبب تربيتها و مشكوك طيعا في البنت اللي في نظرهم عندها استعداد للانحراف و دا كمان بسبب تربيتها و الشباب ما عندهمش غير ما تلبسيش و ما تعمليش و البنات عايزة تتجوز فتقرا ليه و تثقف نفسها ليه بلا وجع دماغ و الامههات تشتغل على ودان البنات \"يا بنتي عنيكي و القراية\" \" انتي اخرتك بيت جوزك\" الكلام دا بيتقال سنة 2007!!! و الامهات بتبقى عارفة ان البنات مصاحبة و بتسكت يمكن البنت تلاقيلها عريس و تززاح من على قلبنا و الاهالي تتخلص بقى من العار اللي اسمه عانس<br />و انتي يا ست ماجدة ياللي اتصدمتي اكبرررررررررررر صدمة في تاااااااااااااا ريخ البشرية انتي و الاستاذ طارق دا ان دل فبيدل على انكم ما لكوش علاقة باللي بيحصل في مجتمعكم و قاعدين في ابراج عاجية بتبصوا للناس من فوق…بجد انتوا عايشين فيين؟؟ طب دا حتى محترم انه بيبوسها في الاصانصير!!!"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014502/http://www.20at.com:80/20at/klam-rosas/6514.html"

