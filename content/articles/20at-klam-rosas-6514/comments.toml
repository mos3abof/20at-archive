[[comments]]
order = 5
subject = ""
author = "لؤلوة"
posted = "2007-07-04"
text = "انا دخلت طبعا كل الافلام اللى موجودة فى السينما طبعا وعاوزة اقول ان فيلم تيمور وشفيقه احسن الافلام الللى نزلت طبعا فى الاتجاة اكوميدى ورغم انى ليه تعليقات على السيناريو الا ان الفيلم جميل وفيه احاسيس جميله والسقا عندة سنس لايت كوميدى والاكشن كان عادى لانه من تنفيذ السقا ودة جيه نتيجه خبراته وعاوزة اقول حرام تظلموا الفيلم دة لانه احسن من عمر وسلمى اللى خنقنى قصه ولا ليها اى لازمه ومعرفش ليه جاب كل الايرادات دى وكركر اعوذ بالله ولا بيضحك ولا قصه ولا اى حاجه وقريبا هبشركوا ان سعد سيلقى مصير هنيدى وعاوزة اقول انى لا اتفق مع رأى ماجدة خيرالله مع انى انا فين وهى فين بس الى الان فيه ناس ديكتاتوريه والفيلم مش هيناقش ازاى البنت تتتعامل مع الولد ولكن دى قصه حب عاديه من بقيه القصص واكيد فيها الصح والغلط ورغم كل دة الفيلم فيه توهان شويه لان المخرج اول عمل ليه وعادى ممكن يتقدم المرة الجايه رغم انه شايفه انه مونتير ممتاز"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014502/http://www.20at.com:80/20at/klam-rosas/6514.html"

