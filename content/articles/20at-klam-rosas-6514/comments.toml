text = "اولا انا مش شايفة ان دة موضوع هايف لان بجد السينما بتنقل الواقع والحياة اللي عايشينها<br />وانا شايفة ان الفيلم حلو جدا وصور العلاقة بينهم بواقعي حتي احوارات اللي بتدور بينهم بتحصل بجد بين اي اتنين انا كنت حاسة اني بسمع الكلام بتاعهم بين اي اتنين"
