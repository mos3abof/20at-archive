subject = ""
author = "محمود مهدى"
posted = "2007-07-02"
text = "انا اللى مشعارف حضرتك عاوز ايه<br />تقول هنا كلام وتكتب فى الدستور كلام !<br />(وخروج تيمور وشفيقة منه وهم مهلهلين الملابس فأعطي إيحاء للمشاهد أن ما حدث بين تيمور وشفيقة يفوق كثيرا القبلة)<br />(ما أن الفيلم ناقش بوضوح العلاقة بين الشباب والفتيات)<br />يالها من علاقة رومانسية رائعة !<br />معظم البنات عاجبهم الفيلم جداً وفى بنت قالتلى انا نفسى اتجوز واحد زى تيمور عشان يغير عليا زى شفيقة ويتحكم فيا<br />عرفت ان البنات محتاجين المعاملة دى …وعاوزين اللى يديهم بالقديمة"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014502/http://www.20at.com:80/20at/klam-rosas/6514.html"

