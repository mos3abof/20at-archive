text = "مال الفيلم الفيلم يا جماعه انتوا منبهرين بيه على الفاضي مش عارفة ليه ده ولا قصه ولا احداث وفعلا مروه عندها حق الاحردداث مفتعلة وعن نفسي بحب كل افلام احمد السقا جدا والفيلم ده مش قصدى انه وحش سيء جدا يعنى لكن ليس بحجم افلام السقا هذا هو كل ما اقد والناقده ماجده خير الله بصراحه عندخها الف حق"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014502/http://www.20at.com:80/20at/klam-rosas/6514.html"

[[comments]]
order = 10
subject = ""
author = "نيفين نيفى نوفا"
posted = "2007-07-10"
text = "ثوانى بقى يا جماعه علشان انا كده اتلخبطت<br />اولاى مين قال ان الفيلم رومانسى انا من خلال البرومو لاحظت ان الفيلم لايت كوميدى و فيه تاتش رومانتيك يعنى مش هيبقى حبيبى دائما و مع ذللك احترم اراء اللى شافو الفيلم<br />و لكن المضحك و العجيب ان طارق الشناوى قال كلام تانى خااااااااااالص( على طريقه محمد صبحى ف كارمن ) فى برنامج روتانا سينما على قناه روتاناو قال الفيلم جميل و حتى بداه على مرجان احمد مرجان لعادل امام<br />و شكلى مش انا بس اللى بقول كده لكن فيه حد علق و قال انه قال كلام تانى ف الدستور<br />و بخصوص النقطه بتاعه ان الاهالى بتوافق على العلاقات ده صحيح و للاسف منتشر جدا"
archived = "2009-10-03"
capture_url = "https://web.archive.org/web/20091003014502/http://www.20at.com:80/20at/klam-rosas/6514.html"

