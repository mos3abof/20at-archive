[[comments]]
order = 4
subject = "المجانين انواع"
author = "زهرة الرمان"
posted = "2007-01-22"
text = "المجانين كتير وانواع<br />المصرى اللى يحتقر اخوة المصرى يبقىمجنون<br />المصرى اللى يعذب اخوة المصرى ويهينة ويمسح كرامتة مجنون<br />المصرى اللى ما ينجزش معاملة اخوة المصرى بدون تعقيد ولا واسطة يبقى مجنون<br />المصرى اللى سلوكة الزحام والزق فى مواصلات النقل العام مجنون<br />المصرى اللى يقبل واسطة من اخوة مجنون<br />المصرى اللى ما بيصليش مجنون<br />اى سلوك غير مألوف يبقى صاحبة مجنون<br />اهم حاجة اننا نحترم بعض وكرامة بعض<br />ونقضى مصلحة الناس الفقراء الاول<br />مش عايزين سلوك مجانين"
archived = "2007-01-24"
capture_url = "https://web.archive.org/web/20070124104751/http://masr.20at.com:80/article.php?sid=1472"

[[comments]]
order = 5
subject = "من هو المجنون !!!!!"
author = "فارس_fr"
posted = "2007-01-22"
text = "زهرة الرمان , تعليق ممتاز ووصف جيد لحالة الجنون والعبث اللى وصل لها الشعب المصري من جراء ما حدث ويحدث له على مرئي ومسمع من اولى الامر والنهى فى مصر ولا يحركوا ساكنا . بل لهم اليد العليا فى تحضير والفاق التهم بمن يعبث معهم , اما مجنون او مختل عقليا , كل من يحاول ان يطالب بحقة فهو مجنوووووووون"
archived = "2007-01-24"
capture_url = "https://web.archive.org/web/20070124104751/http://masr.20at.com:80/article.php?sid=1472"

[[comments]]
order = 6
subject = "مجانينو"
author = "نيفين نيفى نوفا"
posted = "2007-01-22"
text = "بيقولو الفنون جنون و الفنانيين اللى بيشتكو من جنون معجبيهم هما كمان عندهم تكه جنون و الفنان اللى بيقفد التكه دى ميبقاش فنان<br />انا بقول دلا بحكم ان ليا اصحاب كتير فنانيين مسرحيين ؟(مغمورين طبعا)<br />بس الجنون ف بلدنا ليه اشكال تانيه بما ان مصر ام الدنيا يبقى لازم الجنون يلبقى على مستولاى عالمى<br />يعنى مثلا ف مديريه الامن فيه قسم اسمه مجانينو كان اخر زوتره سفاح بنى مزار و سفاح كنائس الاسكندريه و اى قضيه تفشل فيها الشرطه المصريه ومش بعيد لو مكانش ممدوح اسماعيل سافر كان اكيد هيبقى احد نزلاء قسم مجانينو<br />بس بالنسبه لموضوعك يا هايدى انا شايفه ان المجنون الوحيد اللى نلتمس ليه العذر فعلا هو مجنون سعاد حسنى<br />معذور<br />انا متهيالى ان كل المصريين مجانين سعاد حسنى<br />الله يرحمك يا زوزو"
archived = "2007-01-24"
capture_url = "https://web.archive.org/web/20070124104751/http://masr.20at.com:80/article.php?sid=1472"

