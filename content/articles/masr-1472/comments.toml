subject = "75 مليون مريض نفسى"
author = "احمدابوصالح_صحفى معارض"
posted = "2007-01-21"
text = "بصراحة موضوع هايل جداا يا هايدى ولكن البنت الهى مرشدة سياحيةاسمها نسرين انا صحفى وقبلتها وفهمت منها القصة وهو لا جواز عرفى ولا يحزنون هى بتقول ان هنيدى عايز يكسر شوكتها بسبب سوء تفاهم اثناء المسرحية وحتى بعد ما سابت المسرحية هنيدى بيحاول يقطع اكل عيشها فى الشركات البتعمل فيها على حد قولها لذلك لجئت للصحافة عشان تعمل فيها لكن بتقول لاهو معجب لا حاجة ولا كلام الجرايد دة ولا انا معجبة بية خالص بالنسبة لسوء التفاهم انة حس انها بتتنك علية على حد قولها بردة بس هو دة الموضوع وربنا يشفى الجميع اذا كانوا مرضى اصل مصر فيها 75مليون مريض نفسى"
archived = "2007-01-24"
capture_url = "https://web.archive.org/web/20070124104751/http://masr.20at.com:80/article.php?sid=1472"

