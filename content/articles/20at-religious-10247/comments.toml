text = "قال صاحب المقال تحت عنوان احفر قبرك و في نهاية الفقرة الاولى : ثم نقله لمثواه الأخير<br />و هذا خطأ فالقبر ليس بالمثوى الأخير عن المسلم بل هو مرحلة إنتقالية و فيه حياة برزخية إما عذاب أو نعيم حتى تقوم القيامة و يحاسب الناس إما سعيد إلى الجنة أو شقي يؤخذ به إلى النار و الله المستعان<br />فانتبه يا صمدي"
