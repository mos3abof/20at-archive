subject = "مصـ( الخير )ـعب"
text = "إهئ إهئ إهئ<br />زعلتيني والله يا غادة<br />إهئ إهئ إهئ<br />بس على العموم ماتقلقيش<br />كل أصحابك في الحلف الالكتروني<br />هيتوسطوا ليكي عند الأمم المتحدة<br />و قوات حفظ السلام<br />لأن الموضوع ده<br />عامل \" قلق في المنطقة العربية\"<br />على رأي واحد عندكم<br />طبعا عرفيه...!!!<br />المهم<br />بشرى<br />جاءنا البيان التالي<br />\" أعلن مصدر مسئول بقسم<br />الأطافيل و المراهيق العرب<br />بلحنة التربية و التخطيط العمراني<br />في جمهورية الواق الواق<br />أن هذه الحالة من متطلبات المرحلة السنية<br />و أن الوقت كفيل بعلاجها\"<br />ترقبوا البيان التأسيسي للحلف الالكتروني الفظيع!!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018080010/http://www.20at.com:80/article.php?sid=509"

[[comments]]
