text = "اعرف واحد صاحبي حلو وامور وبتاع روشنة والذي منه<br />الغريبة انه يوم ما حب بجد حبيبته قالتله موش عايزة اتجوز قبل 3 أو 4 سنين<br />الغريبة انه مستحمل ومستني مع ان الموبايل موش بيسكت من اللمكالمات الحريمي بتاعة بالليل<br />استني يا غادة علي اخوكي لحد ما يحب بجد !!!!"
