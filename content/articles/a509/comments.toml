subject = "واحدة"
text = "عايزة اقول لكل شاب بالشكل دهانه مش هيلاقى واحدة محترمة ترضى بيه غير لما ينصلح حاله<br />لان البنت المؤدبة المتدينة اللى بيحلم بيه الاخ محمد(الاسم على غير مسمى -و كان اولى بيه انه يغير اسم الرسول باسم اخر روش زيه)<br />المهم البنت دى مابتختارش الا من نفس نوعيتها<br />و اذا قبلت واحدة بالمواصفات دى بيك وانت على حالك ده يبقى تأكد انها بتمثل عليك"
archived = "2005-06-25"
capture_url = "https://web.archive.org/web/20050625083021/http://www.20at.com:80/article.php?sid=509"

