[[comments]]
order = 3
subject = "اخويا ..دونجوان عصره واوانه"
text = "بصراحة، الموضوع داس لى على طرف، و بمعنى ادق طرف اخويا، لأن محمد أخو غادة، صورة كربونية من أخويا \"محمد\" برضه<br />اللى بتصبح على رنة التليفون من الساعة عشرة و نص الصبح لحد قرب الفجر من تانى يوم ، لدرجة ان زميلاتى و زميلات أختى بيشتكوا أنهم بيحاولوا\"بالايام\" الاتصال بنا فى البيت و التليفون على طول مشغووووووووووول<br />هاقول لكم على موقف حصل من كام يوم، كان خارج البيت و اتصل بنا ، تصوروا ليه، بيسأل الأفندى إن كان حد اتصل به ولا لأ، ولما اخبرته اختى ان فيه \"بنات\" اتصلت به، قالها \"كام واحدة\" بزمتكم مش حاجة تفرس<br />و مرة كان بيشتكى لابنة خالتى فقال لها، انه من كثرة البنات اصبح \"يتلغبط فيه أصواتهن<br />بصراحة باحس ان فيه حاجة غلط، لكن مش عارفة هل الخطأ فيه هو ام نحن الذين اصبحنا \"دقة قديمة\""
archived = "2004-08-05"
capture_url = "https://web.archive.org/web/20040805132555/http://www.20at.com:80/article.php?sid=509"

