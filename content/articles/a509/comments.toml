[[comments]]
order = 11
subject = "تحية كبيرة لمحمد"
text = "محمد وامثالة ما اتولدش حبيب وبتاع بنات، البداية بتكون من بنت تافهة زي كل البنات بتتعلق بيه علشان وسيم وامور وبتديلة الاشارة بنظرة وبيبدأ سكته بنجاح منقطع النظير ولانه وسيم وكل البنات عادة ما يتعلقون بالشكل الذي يحرك مشاعرهم وغرائزهم في تلك السن فسهل عليه يوقع اي بنت وانا باقول اي بنت شريطة انه يعجبها ويدخل المزاج .<br />وكل واحدة بتحاول تحصل عليه لنفسها مع ادراكها انه يعرف اكتر من ميت بنت وبنت وكل واحدة بتحاول تحصل عليه بطريقتها ، بالتدين ، بالملاحقة ، بالهدايا والعزومات وباي طريقة تري انها تستطيع الحصول بها علي ذلك الصيد الوسيم وربما بطرق اخري عافنا الله منها وكله باسم الحب.<br />ولان محمد اكيد دمه خفيف كده ويتحب علي طول فهتلاقي البنات تتحدف في سكته ليل ونهار وهو بيسلي وقته.<br />ولكن المشكلة يا محمد انك ساعة الجواز الشك هيركبك في كل واحدة وستصل للحكمة بتاعة اخونا نابليون في الاخر ومش هيبقي سهل عليك الاختيار ، دا غير ان سيادتك كدة بتبوظ علينا البنات وبتعصيهم علينا يا سيدي لاننا مش في خفة دمك ووسامتك خصوصا في اواخر العشرينيات بعد ما شبنا وتعبنا في تجهيز نفسنا لانهم هيقرنونا بيك وغالبا هيرفضوا لاننا دمنا تقيل وبايخين كدة وياسم وحاجات تانية كتير.<br />وهنضطر ندور علي عرايس تعدو السن القانوني وخلاص عقلوا بقي وفهموا ان الي انتوا بتعملوا ده لعب عيال وتسالي مراهقة.<br />وانت يا محمد مثال حقيقي للكثير من الشباب وانا عارف بتاع يجي خمسة منهم مقضينها تليفونات وحب وساعة الجواز بيخافوا زي العيل الصغير وعندهم شك في صوابع ايدهم وحاسين ان الي عملوه في الناس هيطلع عليهم وبيفكروا يتجوزو بنات وحشين طبقا للحكمة القائلة ( الست الوحشة في البيت نعمة) علشان يناموا وهمت مطمئنين ومستريحي البال وافهم انت بقي يا سيدي .<br />خف يا محمد انت والشباب الي زيك رأفة بك وبأمثالك وليس رافه بالبنات فانت الرجل العاقل وهما مساكين معدومي العقل خلقة ربنه.<br />ابو دم تقيل"
archived = "2005-06-25"
capture_url = "https://web.archive.org/web/20050625083021/http://www.20at.com:80/article.php?sid=509"

