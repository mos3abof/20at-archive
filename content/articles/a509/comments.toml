text = "هذا الشاب وأمثاله نماذج موجودة بالفعل وهى نماذج تافهة وتثير الإشمئزاز أكثر من أى شىء آخر ...<br />الأكثر إثارة للإشمئزاز ..الفتايات اللواتى يخن الله تعالى بعلاقات تفتقد إالى العفة والحياء مع أمثال هؤلاء الشباب<br />وأنا أرى بعضهم فى الجامعة يجلس مع أكثر من (مخدوعة) فى أوقات متفرقة وربما تظن كل واحدة منهن أنها الوحيدة التى عرفها منذ ولد<br />ولا حول ولا قوة إلا بالله"
