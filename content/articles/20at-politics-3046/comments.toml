posted = "2007-04-17"
text = "الكلام دة معروف جدا لاننا بنقراة ونشوفة فى التليفزيون لكن الامر عندنا فى مصر حاجة اصعب واخطر بس الفرق ان اليهود معروف اماكن معتقلاتهم لكن هات حد يقول انه يعرف مكان معتقل مصرى ودة الاخطر والفرق التانى ان اليهود بيعذبوا غير اليهود اما فى مصر المصرى يعذب المصرى فى المعتقلات المصريه وعشان تعرفوا ايه اللى بيحصل داخل المعتقلات اسألوا واحد تم اعتقاله وخرج مش بس تتفرجوا على التلفزيون او تقروا كلمتين مالهمش مصدر"
archived = "2010-02-14"
