text = "الظاهر ان اليهود اصبحوا فى قمة الرحمة … هل هذه فقط أساليب التعذيب التى يستعملونها ؟؟ اعتقد إن كان الأمر كذلك ان ياتى وفد من زبانيتهم إلى :: مــــــــــــصـ ــــر :: المحروسة ليأخذوا كورس مكثف على يد بعض رجال بابا حسني الشرفاء بعدها … اعتقد ان هذا المقال سوف يتم تغيير محتواة بشكل كبير …"
