author = "أخوانى سابقاً"
posted = "2005-11-21"
text = "رجت كثيرا لما حققه الأخوان من تقدم فى الأنتخابات و لكن كانت تراودنى الشكوك دائماً لما يحدث وماذا سيحدث لو وصلناللحكم للأسف لا يوجد لدينا برنامج واضح نستطيع من خلاله قيادة البلد فرأيت فى خيالى مشهد أسود لمصر ماذا سيحدث بعد ذلك فقررت ترك الجماعة و الأعتكاف و البعد عنها ."
archived = "2007-08-15"
capture_url = "https://web.archive.org/web/20070815123440/http://egyvote.20at.com:80/article.php?sid=26"

