[[comments]]
order = 4
subject = ""
author = "لنتعلم التعصب منهم"
posted = "2009-07-08"
text = "نعم لنتعلم منهم<br />لنتعلم منهم الكراهية والتعصب واحتقار الاخر<br />قابلت المانيا فى الخليج يتعامل مع رئيس العمل المواطن بجفاء<br />فقال لة الخليجى هل تستطيع ان تركب تلك السيارة المرسيدس التى تصنعونها لنا ونحن نركبها بفلوسنا<br />فقال لة الالمانى لا انها غالية جدا<br />فقال لة الخليجى<br />انت مسخر لنا مثل الخيل والبغال لتركبوها وانتم لتصنعونها لنا<br />انتم مثل الخيل والبغال<br />احتقار باحتقار"
archived = "2009-07-09"
capture_url = "https://web.archive.org/web/20090709112059/http://www.20at.com:80/component/content/article/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 5
subject = ""
author = "مش ححبك"
posted = "2009-07-09"
text = "صدمة في ألمانيا<br />ومن جانبها، واصلت الصحف الألمانية الاهتمام بالحادثة وأوردت المزيد من التفاصيل عنها مؤكدة أنها سببت \"صدمة\" في ألمانيا.<br />وقالت صحيفة دير شبيغل \"إن الجريمة كانت مفاجئة ولم يخطر على بال أحد أن يحدث ذلك<br />\" مشيرة إلى أن \" الجاني انقض على الضحية وطعنها 18 طعنة\". ووصفت الصحيفة ما حدث بـ\"الكارثة\" مؤكدة أن الجميع داخل ألمانيا يعيش حالة \"<br />صدمة\". وبدورها قالت صحيفة دي فيلت إن قاضي الجلسة توم ماجافيسكي حاول إنقاذ الضحية بدق جرس الإنذار لاستدعاء رجال الأمن الذين وصلوا بعد 32 ثانية، بحسب الصحيفة.<br />وأضافت أن أحد ضباط الأمن في غرفة مجاورة سارع بالحضور للقاعة وأطلق الرصاص على زوج القتيلة ظنا منه أنه الجاني لأنه كان يحمل السكين."
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043506/http://www.20at.com:80/masr/2khbar/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 6
subject = ""
author = "مش ححبك"
posted = "2009-07-09"
text = "بحثت عن النت ووجدت شيء يشير الى الحقيقة<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــ<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />وقال توماس شتيغ المتحدث باسم ميركل إن مقتل الشربيني شكل \"عملا مروعا ومثيرا للغضب\" معتبرا أن الحكومة الألمانية لم تتحرك مبكرا للتعقيب على \"الجريمة\" لعدم توافر التفاصيل الكافية حينها.<br />وكان شخص من أصول روسية يبلغ من العمر 28 عاما قد سدد الأسبوع الماضي طعنات قاتلة إلى مروة الشربيني وهي حامل وذلك بعد أن أدانته المحكمة بتهمة إهانة الشربيني في قضية تعود إلى شهر نوفمبر/تشرين الثاني الماضي.<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />يا اخوة افهموا الموضوع الاول<br />مروى مدعية في قضية<br />المدعى عليه شخص روسي متهم بسب مروى<br />عندما ادانته المحكمة انهال عليها طعنا<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــ<br />وهذا يحدث والله العظيم في محاكم مصر"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043506/http://www.20at.com:80/masr/2khbar/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 7
subject = ""
author = "ابومحسن غربة 28 سنه"
posted = "2009-07-09"
text = "اولا احب ان اقول ان القتل والاعتداء في قاعات المحكمة امر موجود عندنا في مصر<br />فقاعات المحاكم المصرية شهدت عشرات جرائم القتل والاعتداء اثناء المحاكمة ومحكمة جنوب القاهرة بباب الخلق خير شاهد على ذلك<br />الامر الثاني ان توصيف الواقعة اللي حصلت في المانيا بقتل مصرية منقول خطأ<br />الواقعة كما حصلت نقلت الينا بصورة خاطئه وغير صحيحة والمقصود منها الاثارة فقط<br />جريمة قتل الشربيني اكيد اتفتح لها ملف هناك واكيد التحقيقات جارية واجهزة الاعلام الالمانية حتكشف عن الحقيقة بعد انتهاء التحقيقات<br />اصبروا شوية"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043506/http://www.20at.com:80/masr/2khbar/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 8
subject = ""
author = "لوموا انفسكم اولا"
posted = "2009-07-09"
text = "اذا كان المصرى غير محترم فى بلدة<br />ويضرب على قفاة داخل اقسام الشرطة وتسب امة واباة من اى وضيع فى الشرطة<br />وتحتقر المحجبات ويمنعن من الظهور فى التليفزيون ويشتمن عيانا جهارا من وزير الثقافة والمسئولين ويطرد المدرسين الملتحين من سلك التدريس الى وظائف ادارية<br />حينما تفتح المانيا جامعة تدرس ادارة الاعمال برسوم 60 الف جنية فى القاهرة بينما بلد مثلنا اسمها تركيا ليس فيها اى جامعة خاصة<br />حينما يكون المصرى محتقرا فى بلدة ويضرب بخيرزانات الامن المركزى عند التظاهر لابداء الراى<br />كيف يحترمكم العالم والشعب تحت الاحكام العرفية وقوانين الطوارىء لمدة 30 سنة<br />العالم قرية كبيرة<br />وادق تفاصيل حياتنا يعرفها كل انسان فى اقاصى قرى الهند وقرى المانيا<br />لا احد يحترمنا<br />لاننا اناس لا تحترم نفسها<br />واذا ضربوا المصريين فى الخارج بالجزمة فهذا رد فعل لما يحدث فى الداخل<br />احترموا انفسكم اولا"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043506/http://www.20at.com:80/masr/2khbar/12570-2009-07-05-22-17-50.html"

