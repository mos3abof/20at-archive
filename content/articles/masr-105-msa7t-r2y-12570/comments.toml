author = "حاجة تكسف موت"
posted = "2009-07-10"
text = "نشر موقع مصراوى اليوم الجمعة ان ايران استدعت السفير الالمانى فى طهران وابلغتة بقلق ايران من سلامة الجالية الاسلامية فى المانيا بعد مقتل مروة الشربينى<br />تصوروا ايران<br />ايران<br />ايران يا عرب<br />اين الاشاوس<br />واللة حاجة تكسف موت<br />ناس معندهاش ريحة الدم"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043506/http://www.20at.com:80/masr/2khbar/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 11
subject = ""
author = "اهل السنه والجماعة"
posted = "2009-07-11"
text = "اهل السنه والجماعة هو المذهب الرئيسي في الاسلام<br />فتح المسلمون الشرق والغرب ببركة مذهب اهل السنه والجماعة<br />الشيعة ما بيعملوش حاجه الشيعه بيسبوا امهات المؤمنين والخلفاء الراشدين وبس<br />والحمد لله الفاطمين دحرهم صلاح الدين الايوبي وتحول الازهر الى قلعة من قلاع اهل السنه والجماعة في العالم كله<br />ولعنة الله على سبابين الخلفاء الراشدين:<br />ابو بكر وعمر وعثمان<br />وسبابين امهات المؤمنين عائشة وحفصه وام حبيبة"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043506/http://www.20at.com:80/masr/2khbar/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 12
subject = ""
author = "الشتامين"
posted = "2009-07-11"
text = "كل الكلام الفارغ دة عن الشيعة بطلوة<br />مصر هى اللى اخترعت المذهب الشيعى<br />والسيدة زينب بعد مقتل الحسين فى كربلاء جاءت الى مصر واستقبلها المصريون فى العريش<br />وكل امهات الفقة الشيعى كتبت فى الازهر ايام الحكم الفاطمى فى مصر<br />بل ان العلويين فى سوريا والدروز فى الشام هم نتاج الفاطميين فى مصر<br />وحتى وقت قريب جدا كان المؤذنون فى قرى مصر يقولون فى الاذان قبل الجمعة اشهد ان عليا ولى اللة<br />انا مش شيعى ولكن اكرة سب الملل والمذاهب الاسلامية<br />لا تشتموا الشيعة فهم مذهب من مذاهب المسلمين باعتراف الازهر<br />اما من يسب الصحابة والخلفاء فجزاءة عند ربة"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043506/http://www.20at.com:80/masr/2khbar/12570-2009-07-05-22-17-50.html"

