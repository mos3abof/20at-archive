[[comments]]
order = 14
subject = ""
author = "هالة"
posted = "2009-07-11"
text = "المشكلة الحقيقية فى التغطية الإعلامية الألمانية، لا يوجد شخص أعرفه في ألمانيا لم يتأثر ويتعاطف مع الضحية، ولكن ردود الأفعال الألمانية على المستوى السياسى لم تتوالى<br />إلا بعد تفاقم ردود الأفعال ومبالغتها فى مصر.<br />العنصرية لا وطن لها، ألا يوجد بعض التعصب لدى الذات عند المصريين وفى الخليج وفى جميع دول العالم،ألم يتم تعذيب مواطنين مصريين فى قسم الشرطة بالكويت بغمرهم فى مياة النار، أين المظاهرات والاحتجاجات امام سفارة الكويت؟<br />المشكة أن موضوع مروة أخذ أبعاد أكبر لوجود بعد الغرب فى مقابل الإسلام، وكل من نبوءة هانتجتون المشئومة"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043506/http://www.20at.com:80/masr/2khbar/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 15
subject = ""
author = "المستشارة ميركل هتدف"
posted = "2009-07-12"
text = "خلاص المستشارة ميركل اجتمعت مع المسئولين وسالتهم عايزين كام وتسكتوا فقالوا لها على كام مليون يورو يتحطوا فى بنوك سويسرا<br />والعملية فى النملية ولا عزاء للسيدات<br />يعنى هى فى نظر المسئولين احسن من مين ؟ بتوع العبارة اللى غرقت والا القطر اللى ولع والا الدكاترة اللى بينجلدوا فى السعودية والا المئات اللى بيموتوا يوميا فى حوادث الاسفلت<br />سلموها للمولى<br />بكرة الالمان يابجوا الناس والناس تبقى مبسوطة<br />واوعدكم ان الموضوع هيخلص بعد اسبوع ومحدش هيجيب سيرة الموضوع دة وهتصدر تعليمات للصحف بعدم فتح الموضوع تانى<br />ابتسم فانت فى مصر العربية"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043506/http://www.20at.com:80/masr/2khbar/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 16
subject = ""
author = "حزب المانى"
posted = "2009-07-12"
text = "فى جريدة المصرى اليوم ان حزبا المانيا اعلن تاييدة للقاتل وانة سيدعمة بالمحامين والمال فى الدفاع عنة امام المحمكة<br />ولا زال المتخلفين عندنا يتكلمون فى قضية عمرها 1200 سنة بين اهل السنة والشيعة ومش عارف اية وخلافات اية<br />اتنيلوا على عنينين اهليكم وشوفوا البلاوى انتم عايشين فيها من فقر وتخلف وهمجية<br />الالمان يقفون وراء القاتل بالمال والمحامين<br />واحنا قاعدين نشتم ونقل ادبنا على الشيعة والسنة والبدنجان والملوخية<br />انما فعل مفيش<br />لسان طويل وبس<br />عاملين زى اقباط المهجر عاملين عنتر خلف الكمبيوتر وبرة الكمبيوتر شوية ارانب اليفة جدا"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043506/http://www.20at.com:80/masr/2khbar/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 17
subject = ""
author = "الاضطهاد الديني"
posted = "2009-07-13"
text = "اللي بيته من زجاج ما يحدفش الناس بالطوب<br />انا في مصر عندنا مسيحيين<br />اي خلاف يحصل بين مسيحي ومسلم بيضيع حق المسيحي<br />يعني مثلا المسيحيين ممنوعين من بناء كنائش فبيتحايلوا على القانون يبنو بيت عادي ويعملوا المدخل بتاعه صالة علشان خاطر يصلوا فيها اول ما المسلمين يعرفوا يروحوا يكسرولهم هذا المكان ويعملوا مشكلة كبيرة مع ان المسيحيين هدفهم الصلاة فقط وفي الصعيد بيحرقولهم مزارعهم وبيوتهم وحقهم بيضيع<br />المسلم في اوروبا كالمسيحي في بلادنا<br />لازم ينضرب بالجذمه اذا كان عاجبه<br />هي دي الحقيقة<br />اذا كنتو عايزين المسيحيين في بلادهم يحترموا المسلمين<br />احترموا انتم المسيحيين في بلادهم<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــ<br />مش لازم"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811013425/http://www.20at.com:80/masr/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 18
subject = ""
author = "يوسف جيلانى"
posted = "2009-07-13"
text = "ليس بعد الكفر زنب دائما عدوك عدو دينك وهاهوالدليل وكل يوم دليل رحم الله المعتصم وخلافة المؤمنين فلنكن دوما على يقظة لنصرة دين الله"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811013425/http://www.20at.com:80/masr/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 19
subject = ""
author = "لم تجنى على نفسها"
posted = "2009-07-13"
text = "لو كانت تعرف غدرة لضربتة بالجزمة وكان جوزها مسح بة الارض<br />الاسلام مفيش فية اعطاء الخد الايمن والخد الايسر<br />ولكنة فاجا الجميع بالسكين الذى معة<br />وبعدين دة جبن مسيحى صليبى ان رجل طويل عريض يضرب امراة حامل بسكين ودى مش رجولة دة جبن وخوف منها ولو كان راجل وفية ذرة رجولة كان مد ايدة من غير سكين<br />كانت قطعتة باسنانها<br />احنا مش بنخاف على بناتنا<br />ولكن للغدر ظروف"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811013425/http://www.20at.com:80/masr/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 20
subject = ""
author = "هي جنت على نفسها"
posted = "2009-07-13"
text = "مروى الشربيني هي اللي جنت على نفسها<br />انتي مسلمه في دولة مسيحية<br />وواحد مسيحي قل ادبه عليكي<br />اصبري واحتسبي عند الله<br />لكن تصعيد الامر هو اللي قضى عليها<br />زي عندنا في مصر<br />المسلمين بيسيئوا للمسيحيين والمسيحيين ما يقدروش ياخدوا معاهم حق ولا باطل<br />هي دي الحقيقة<br />مسلمه في المانيا دولة مسيحية كبرى ما لهاش حقوق<br />الراجل شتمها وسبها تصبر وتحتسب عند الله<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ<br />مش شريف الدواخلي ولا البراء اشرف<br />ولا رضوى حسن ولا مروى صلاح"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811013425/http://www.20at.com:80/masr/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 21
subject = ""
author = "التعليقين السابقين"
posted = "2009-07-14"
text = "انا لا اتكلم من هذه النواحي<br />انا قلت ان المسيحي لما بيختلف مع المسلم في مصر بياكل بالجذمه القديمه وبيضيع حقه وخصوصا في اقسام الشرطة<br />هذا ما اقصده<br />اما كون المسيحيين مسيطرين على 60% من الاقتصاد<br />فهذا من خيبة المسلمين وليس من شطارة المسيحيين<br />لان المسلمين بيضيعوا فلوسهم في مشاهدة افلام السينما ومباريات كرة القدم وخلو لعيبة الكورة والممثلين يبقوا مليونيرات والمسلمين قاعدين مفلسين على طول واهي القنوات الفضائية عماله تضحك عليهم وتقولهم اتصلوا بالرقم 0900 وحتكسب 5000 جنيه وحتكسب شقه وحتكسب عربية وشبكة للعروسة زي ما انتوا عارفين وخصوصا قناعة موجه كومدي<br />لكن المسيحيين شاطرين عمرهم ما يصرفوا فلوسهم في الهلس<br />المسيحي بيحط القرش على القرش ويبني مصنع<br />اما المسلم اهبل وعبيط وبيجري ورا عادل امام وابو تريكه<br />فالمسيحيين بيستغلوا خيابة المسلمين<br />تماما كأسرائيل بنت نجاحها على خيبة المسلمين<br />والموضوع يطول شرحه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــ<br />التوقيع<br />مش ححبك<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــــ"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811013425/http://www.20at.com:80/masr/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 22
subject = ""
author = "نصلى فى الشارع"
posted = "2009-07-14"
text = "المسلمون من قلة المساجد وضيقها يصلون فى الشوارع امام الجوامع ولم نرى مسيحى يصلى فى الشارع<br />المسلمين اولى ببناء المساجد اما النصارى فعدد الكنائس كتير جدا عليهم<br />ولكن هنقول اية للسلبطة والصهينة ولازم يلاقوا حاجة يشتكوا منها<br />هنقول اية غير ان اصلهم يهودى من اليهود الذين لم يخرجوا مع سيدنا موسى<br />وعلى فكرة مش كل اليهود خرجوا مع سيدنا موسى كلا كان فيهم المريض واللى عايز يقعد واللى مش يخرج وهم اصل المسيحيين فى مصر"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811013425/http://www.20at.com:80/masr/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 23
subject = ""
author = "المسيحى فى مصر يضطهد"
posted = "2009-07-14"
text = "المسيحى فى مصر طوال التاريخ يضطهد المسلم وبيذلة وطلع ميتيين اهلة لغاية حملة نابليون<br />فى العصر الرومانى كان فية مصريين ورومان ويهود متاغرقين وبيتكلموا اغريقى وهم جباة الضرائب من الفلاح المصرى الفرعونى<br />ولما فتح عمرو مصر جعل النظام كما هو لم يغير شيئا وهؤلاء الاقباط يجمعون الضرائب والجزية ويسلموها للعرب بعد ان يسرقوا نصفها<br />وفى العصر المملوكى والايوبى والعثمانى استمر هؤلاء الاقباط تحت وظيفة المشد والملتزم يجمعون الضرائب ولهم قوات خاصة يذهبون بها للقرى لجمع الضرائب وقهر المسلمين والفلاحين وكم قصص فى التاريخ تبين اذلال المسلمين بواسطة هؤلاء الاقباط<br />حتى جاء محمد على بعد الحملة الفرنسية ولغى وظيفة الملتزم او المشد القبطى وعمل دولة مدنية<br />وفى ايام الانجليز كان الانجليز يعينون الاقباط فى تميز واضح فى وظائف السكة الحديد والبريد ودوواين الدولة فى تميز رهيب عن الشعب المصرى<br />واليوم<br />الاقباط 6 % من عدد السكان ويسيطرون على 60 % من اقتصاد البلد<br />كل محلات الذهب والصيدليات ومصانع العاشر والمدن الجديدة للاقباط<br />يبقى اضطهاد اية وكنايس اية<br />هو كل فرد مسيحى عايز كنيسة مخصوصة لوحدة"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811013425/http://www.20at.com:80/masr/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 24
subject = ""
author = "االماء العكر"
posted = "2009-07-15"
text = "اصطادوا فى الماء العكر اصدروا بيانا بالتعزية فى وفاة مروة الشربينى وربطوة بقتلى حادث الكشح - ربنا يكشحهم جميعا<br />ثم اية لزوم عمل اجتماعات فى الغرب<br />هيخوفونا بالغرب مثلا<br />اذكرهم بما كان علية النصارى فى العراق ايام صدام وما حدث لهم فى وجود 23 دولة صليبية تحتل العراق حيث تم هدم كنائسهم وطردهم من العراق ولم تفعل امريكا لهم شيئا<br />بنقول لهم اتلموا<br />واى مطالب تبقى من داخل الدولة انما شوية عيال تظهر فى الاعلام فهذا مش كويس لهم ولاسرهم ولاقليتهم حاضرا ومستقبلا"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811013425/http://www.20at.com:80/masr/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 25
subject = ""
author = "الاقباط ينعون مروى"
posted = "2009-07-15"
text = "افتتح اتحاد المنظمات القبطية بأوربا مؤتمره الدولى الأول بالعاصمة النمساوية فيينا مساء أمس الجمعة ،برئاسة الدكتور عوض شفيق.<br />وتلا الحاضرون البيان التالى \"بكل اسف واسي تلقينا خبر قتل مروة الشربيني بالمانيا ، ونعلن نحن كمنظمات حقوقية بالنمسا ادانتنا الكاملة لهذا العمل الاجرامي ونستنكر تلك الجريمة التى تخالف جميع الشرائع والأعراف والمواثيق الدولية\".<br />وطالب المؤتمرون الحكومة الألمانية بتطبيق العقوبة على الجانى دون أى محاباة، إذ تعد تلك الجريمة اعتداء عنصريا على الآخر، وجريمة فى حق الإنسانية. وارسل المؤتمر ببرقية عزاء الى اسرة القتيلة مروة الشربينى"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811013425/http://www.20at.com:80/masr/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 26
subject = ""
author = "الى المعلق السابق"
posted = "2009-07-16"
text = "الجزئية اللي انت ذكرت فيها مسيحيين العراق<br />امريكا دخلت العراق علشان خاطر تعطي الحكم للشيعة وتطلع تاني<br />والشيعة اخبث من النصارى<br />اتذكر الشيطان بوش وهو بيقول ان امريكا مصممة على قطع شقفة الارهاب فاهم يعني ايه شقفة الارهاب<br />يعني السعودية يعني مكه والمدينة<br />فشيعة ايران مع شيعة العراق عملوا كماشة لمكه والمدينه<br />فهمت<br />ليه كل الهيصة دي لان الشيعة ما عندهمش حاجه اسمها الاسراء والمعراج<br />ما عندهمش حاجه اسمها القدس<br />اظن بقت واضحة دلوقتي<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــ<br />يا زخاري اقرا وانت ساكن ما تبلغش اسرائيل بالكلام دا"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811013425/http://www.20at.com:80/masr/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"
