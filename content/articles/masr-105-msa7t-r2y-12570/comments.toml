posted = "2009-07-10"
text = "نشرت الشروق المصرية ان مظاهرة نسائية خرجت من امام جامعة طهران وهم يحملون نعشا وهميا وصور لمروة الشربينى ويهتفون بسقوط المانيا<br />القضية بدات تتفاعل<br />وايران تستغل القضية لتكسب بعض النقاط فى الشارع العربى"
