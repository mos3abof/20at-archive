subject = ""
author = "السفارة الالمانية"
posted = "2009-07-05"
text = "لماذا لا نرسل استهجانات الى سفارة المانيا فى القاهرة ونقول لهم انتم نازيون<br />لماذا لا تدفع المانيا تعويضات لاسرة الضحية وللشعب المصرى ؟<br />لماذا نستقبل الخبر بالصمت والحزن ونرضى بكلمات عزاء من هنا وهنالك ؟<br />هل دم المصريين رخيص الى هذا الحد"
archived = "2009-07-09"
capture_url = "https://web.archive.org/web/20090709112059/http://www.20at.com:80/component/content/article/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 1
subject = ""
author = "ومن الغريب جدا"
posted = "2009-07-05"
text = "ان الغرب يتهم المسلمون بالتعصب وهم الغربيون اشد الناس تعصبا ضد المسلمين<br />فهم يكرهون الاسلام من اعماقهم<br />ولنفترض ان مصريا قتل المانية فى منطقة الاهرام لانها تلبس ملابس قصيرة وسروالها الصغير يظهر جزءا من عورتها القذرة - ماذا يكون شعور الالمان ؟<br />وجعوا دماغنا ولاد الكلب فى الداخل والخارج باحترام ثقافة الاخر فلماذا لا يحترمون ثقافتنا ام ان الاحترام مفروض من ناحيتنا فقط<br />بل ويعلمون الطلبة فى المدارس باحترام ثقافة الاخر وعادات الاخر وفى الواقع الاخر يقتلنا لمجرد تمسكنا بثقافتنا<br />اذا لم يقتل هذا الكلب الالمانى الذى قتل المراة البريئة التى هى اطهر واشرف من المستشارة بتاعتة ميركل فمن حقنا فى مكان ان نحتقرهم وان نفرح اذا خطف اليمن رهائن منهم وقتلهم<br />اصبحنا نحن المصريين الحيطة الواطية لولاد الكلب"
archived = "2009-07-09"
capture_url = "https://web.archive.org/web/20090709112059/http://www.20at.com:80/component/content/article/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"

[[comments]]
order = 2
subject = ""
author = "ابوضيف محمد _ سوهاج"
posted = "2009-07-06"
text = "لقيت حضرتك بتقولى الجبن والباراجماتية هناك هما السيبل عشان تاكلى عيش ، طيب هل معنى كده انك هتقلعى حجابك؟ طبعا انا عارف ان كل المغتربين هيخافوا من الكارثة اللى حصلت للشهيدة مروة وفيه كتير منهم هيقلعوا الحجاب عشان كده ، بس لو ده حصل يبقى الأفضل لهم يرجعوا بلدهم احسن ويحافظوا على حجابهم ، وفيه كتير هيقول لا : الأفضل يقلعوا الحجاب عشان يحافظوا على حياتهم وهو مبدأ أصيل فى الإسلام ( المحافظة على النفس ) ويكملوا تعليمهم هناك ، وانا هنا ما اقدرش افتى فى دى لكن من وجهة نظرى ليه يقعد من أساسه هناك أصلاً ؟ ! ييجى هنا ويكمل تعليمه أو يشتغل ويحافظ على نفسه وأسرته وبكده يبقى حقن دمائه فى ظل الهمجية بتاعة الغرب اللى سايدة العصر الحالى مع إن فيه منهم بعض المحترمين والمناصرين لحقوق المسلمين والدليل النائب البريطانى جورج غالاوى والأطباء والمحامين النرويجيين اللى كانوا عايزين يساعدوا أبناء غزة فى محنتهم ولكنهم مُنعوا وغيرهم .<br />أما ذنب مروة ففى رقبة الحكومة والخارجية اللى شكلهم هيخسعوا ومش هيعملوا حاجة وحسبنا الله ونعم الوكيل .<br />ربنا يرحمها ويكتبها عنده شهيدة ويرجع لنا المغتربين من هناك على خير."
archived = "2009-07-09"
capture_url = "https://web.archive.org/web/20090709112059/http://www.20at.com:80/component/content/article/105-msa7t-r2y/12570-2009-07-05-22-17-50.html"

