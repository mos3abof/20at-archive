subject = "خبرهام لطلبة امتياز طب"
text = "إذا اردت التفوق لدينامجموعة العاب فيديو جيمز و بلاي ستيشن...في غاية الدقة و التطور.<br />نرجو الاسراع قبل النفاذ.<br />و سلملي على الكومندوز."
archived = "2004-09-26"
