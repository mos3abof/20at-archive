[[comments]]
order = 2
subject = "برافو"
text = "هما عاوزين ايه غير اننا نقعد قدام الجيمز..علشان نزداد تخلف بجد...الواحد من دول يقعد يلعب بالساعات \" بيذاكر\"..<br />و مع العلم ان في ابحاث علمية كتيرة و كلنا قرينا عنها بتقوا ان العاب الفيديو بتجيب تبلد..و احيانا تخلف من نوع ما...<br />و عجبي!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040632/http://www.20at.com:80/article.php?sid=304"

