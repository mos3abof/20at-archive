subject = "تعريف موقع \" كل الطلبة\" المنقول ده بتاع"
text = "هيا ملحوظة بسيطة التعريف بتاع الموقع المكتوب فى الموضوع على انه تعريف موقع كل الطلبة والذى يقول:<br />\"\"موقع روش جدا..بس مش طحن\" وفي مقدمته التعريفية \"الروشة\" يعود كاتبها فيستدرك \"يعنى الروشنة اللى فى كلامنا واسلوبنا مش معناها اننا هانتخلى عن ثوابتنا وقيمنا، وعشان ننجز والكلام يبقى من الاخر..<br />إحنا شباب مجدع وزى الفل.. بنحب الإسلام.. وبنحاول نطبقه فى حياتنا من غير تشدد ولا تنشنة ولا تكشيرة.. لأننا بنحب الحياة جدا.. ومؤمنين إن الحياة في سبيل الله مهمة جدا.. بالضبط زى الموت في سبيل الله\"<br />هو منقول عن تعريف موقع يللا طلبة وليس موقع كل الطلبة الخاص بجامعة القاهرة"
archived = "2005-03-03"
capture_url = "https://web.archive.org/web/20050303091532/http://www.20at.com:80/article.php?sid=902"

