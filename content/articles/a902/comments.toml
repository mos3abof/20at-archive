subject = "الجزء الثالث من الرد .."
text = "السلام عليكم ..<br />ألف باء كتابة تحقيق .. هوالإهتمام بالجديد<br />ولأن الجديد معناه يعني ماحدش عمله فهذا يعني أننا إذا وجدناه سيكون قد تم عمله لأول مره<br />وهذا ماحدث بالفعل مع تحقيق أستاذي الفاضل مجدي سعيد ، والجديد في تحقيق الأستاذ مجدي هو أنه قال (( وتركز تلك الأخبار على مساحتين: )) ثم كتب بعدها الأولى .. الثانية .. والثالثة .. وهذا يعني حاجه من تلاته اما أن ريبورتاج استاذنا الفاضل كان ارتجالي سلق بيض يعني أو أنه كان من باب تقديم الجديد أو أنه كان من باب آخر لم يصل مستوايا الصحفي لفهمه أو معرفته ..<br />هذا بالإضافة للمعلومة التي نقلها كاتبنا عن موقع كل الطلبة وطلعت إنها من موقع يللا طلبة<br />عموماً ماعلينا<br />وأرجو ماحدش يزعل مني<br />نرجع لموضوعنا .. ولنعتبر كلمة مساحتين غلطة مطبعية ونحسن الظن باستاذنا الكبير<br />لن أتطرق للمساحة الأولى وجزاك الله خيراً عنها<br />وسأنتقل فوراً للمساحة الثالثة والتي أفاض فيها زملائي السابقين في التعليقات<br />حيث جاء الأستاذ مجدي بقنبلة صحفية ليفجرها في تحقيقه ويزيده وزناً عندما اتهم التيار الاسلامي بافراد البنات بركن خاص بهم وهو مافسره سيادته أنها دعوة لفصل البنات عن الشباب وأوصلها لبعد أبعد من ذلك عندما قال (( وكأنهم في مدرج يمنع فيه الاختلاط، )) .<br />وللرد على هذه التهمة ..<br />أراكم في الجزء الرابع ..<br />مع تحيات : المهندس - عضو في منتدى جامعة أون لاين"
archived = "2005-03-03"
capture_url = "https://web.archive.org/web/20050303091532/http://www.20at.com:80/article.php?sid=902"

