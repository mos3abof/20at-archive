subject = "الجزء الرابع من الرد .."
text = "السلام عليكم<br />من طبعي لاأحب أن أسيء الظن ، لكن أحياناً المعلومات الضئيلة المتاحة أمامك لكي تحكم على شيء تكون قليلة جداً ولعل منها هذا المقال فلو كان صدر عن موقع آخر غير العشرينات لما كنت فكرت أن أرد على ماجاء فيه بل ولكنت أيقنت أنها حملة مدبرة لمحاربة هذه المواقع .<br />ولعل دليلي على احترامنا الشديد لهذا الموقع بالذات هو أنه كان أكثر المواقع التي نقل منها موقع جامعة اون لاين ملفاته في ركن ملفات ساخنه<br />وهذا باختصار ماأحزنني للأسف<br />فكما يقول الشاعر :<br />يهاجمني العدو فلا أبالي .. وأبكي حين يخدعني الصديق<br />عموماً .. أنا لاأمثل أي جهة وهذا رأيي الشخصي ومازالت العشرينات بكل كواكبها رمز لي وستظل كذلك بإذن الله لي وستظل كذلك للجميع<br />نرجع لموضوعنا ، والاتهام الخطير أن مواقعنا تفصل الشباب عن البنات<br />وهو اتهام مردود عليه بسهوله ففكرة عمل باب مخصص للبنات ليس من باب منع دخول الشباب إليها ، بل العكس هو الصحيح فالمعروف دائماً أن الممنوع مرغوب وعليه فعندما نفتح باباً باسم للبنات وبس فإن اول الزائرين سيكون الشباب أنفسهم ، ويمكن ده كان واضح جداً من الأسلوب الروش والساخر للزجل الذي سبق صفحة الدخول لركن البنات وبس وأذكر والله على ماأقول شهيد أنه في أول زيارة لي لموقع جامعة أون لاين كان أول باب زرته هو هذا الباب<br />ده الرد الأول على هذا الإتهام .<br />الرد الثاني هو أن النت ماهواش محاضرة أو مدرج ولايمكن بأي حال من الأحوال أن يكون كذلك<br />فلايمكن أن يتم فرض حماية على أبواب وأركان البنات لمنع دخول الشباب إليها وده الرد التاني<br />ثالثاً .. الهدف من هذاالباب وكما ذكرت سابقاً أن كل باب هو وسيلة لتحقيق هدف وهذا الباب بالتحديد هدفه الأساسي هو دمج ومعايشة البنات مع الشباب وانصهارهم في موقع واحد كل ذلك حسب تعاليم الشرع والإسلام<br />وكان عليك ياأستاذ مجدي أن تزور أنجح المواضيع على منتدى موقع جامعة أون لاين في باب الجامعة وحرمها وهو الموضوع الذي خصص لقضية الاختلاط في الجامعة والذي توصلنا فيه إلى أن كلمة الإختلاط ليس لها أساس في الاسلام وانما هناك حدود وضوابط للعلاقة<br />وأرجو أن تخبرنا كيف كنت تريدنا أن نتناول القضايا التي تهم الفتاة دون غيرها<br />حتقولي مالهاش لازمة حقولك يبقى كلامك مردود عليه لأن البنات جزء من المجتمع الجامعي ولابد بصفتنا موقع طلابي جامعي أن نلبي متطلباتها على قدر استطاعتنا<br />حتقولي مافيش مواضيع تهم الفتاة دون غيرها حقولك أنا لم أسمع عن رجل حط مكياج أو شاب بيطبخ وبينوع في الطبيخ وبيروق البيت لكنه عندما يحتاج مثل هذه الأشياء فإنه سيزور أركان البنات<br />حتقولي اللي أنا أقصده مش كده أنا أقصد تعامل البنات مع الشباب والرد ورد الفعل والتصاهر معاً حقولك كان ينبغي عليك أن تزور منتدى جامعة أون لاين قبل أن تقول هذا الكلام<br />فأحد المشرفين على باب المواضيع العامة وهو باب للبنات والشباب هي بنت وليست من التيار الإسلامي<br />وراجع مواضيع المنتدى المختلفة وشاهد الردود والمشاركات بل إن أنجح الحملات التي ينوي الموقع تبنيها في الفترة القادمة كانت من بنت أيضاً وهي فكرة مصلى في مكتبة الإسكندرية<br />وأدعو القاريء والأستاذ مجدي من مراجعة مشاركات الشباب والبنات في هذا الموضوع أو غيره ولكم الحكم<br />الغريب جداً أن الأستاذ مجدي جاء في الآخر ليقول (( وفي تلك الأركان البناتية تغلب الموضوعات النسائية : الريجيم، الأكل، الزواج، الجمال إلخ. )) وهو مايتنافى مع مقولته ((تفصل البنات في ركن خاص، وكأنهم في مدرج يمنع فيه الاختلاط)) ..<br />الغريب أنه في الوقت الذي نزل فيه هذا التحقيق كان الخبر الرئيسي في موقع كل الطلبة هو خبر خاص بالطالبات ومع ذلك لأنه يهم الجميع لم يضعه محرري الموقع في ركن البنات وبس وانما وضع كخبر رئيسي وبصورة على الصفحة الرئيسية<br />مش بس كده بل إن التجربة الرائدة الجديدة التي قام بها موقع كل الطلبة لانتخابات المشرفين في منتداهم كانت أكبر دليل على عدم وجود تأزم وتزمت في العلاقة بين الشباب والبنات<br />وإن كنت مازلت أقول حتى لايفهمني حد خطأ ، فإن في مقابل هذا الاختلاط حدود فهناك ركن بناتيت في المنتدى للبنات وبس حتى لايتحول الباب لشات ياهو أو ماشابهه<br />أرجو أن تكون رايي واضح وأرجو من الأستاذ مجدي أن يكون له رد على ماذكرته الآن<br />ومازلنا في الرد على باقي الاتهامات السخنة<br />نلقاكم في الجزء الخامس<br />مع تحياتي : المهندس - عضو في منتدى جامعة أون لاين<br />* ملحوظة : كل ماسبق لا يمثل إلا رأي ناشره وليس هو الرأي الرسمي لموقع جامعة أون لاين أو منتداه"
archived = "2005-03-03"
capture_url = "https://web.archive.org/web/20050303091532/http://www.20at.com:80/article.php?sid=902"

[[comments]]
