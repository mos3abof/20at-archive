subject = "التكنولوجيا والتعليقات والأرشيف"
text = "دي خطورة الاعتماد الكامل على التكنولوجيا الحديثة، لما الكهربا بتقطع حياة الناس في المدينة تصاب بالشلل، خاصة إن كتير منهم ماعندوش مهارات العيش من غير تلك التكنولوجيا، ولما الموقع يضرب كل المواد اللي عليه تطير..ماله عبد الشكور أفندي موظف الأرشيف، كان زمانه مسيف لنا التعليقات دلوقتي..عموما أنا عندي جزء من التعليقات متسيف ديجيتال، وجزء للأسف متأرشف ورقي..ممكن تعملوه قراطيس"
