subject = "موقع كل الطلبة .. يتقدم بخالص التحية والشكر للدكتو"
text = "أستاذنا الفاضل لا يسعنا فى هذا المقام إلا أن نتقدم لكم بالشكر الجزيل على هذا النقد وهذه النصائح .. ومهما اختلفنا او اتفقنا على النقاط المذكورة كلها او بعضها .. فإن هذا لا ينقص من تقديرنا لجهدكم فى تحليل مواقعنا الطلابية .. والتى نامل أن نراها يوما قدوة ومثالا يحتذى بين شريكاتها فى البلدان الاخرى . وتكون نقلة فى النشاط الطلابى الجامعى بوجه عام.<br />نكرر لكم شكرنا ويسرنا دوما تلقى نقدكم وتوجيهكم لنا ويمكنكم مراسلتنا من خلال بريد موقعنا<br />alltalaba@hotmail.com"
archived = "2005-03-03"
