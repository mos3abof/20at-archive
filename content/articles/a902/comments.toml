[[comments]]
order = 4
subject = "تاريخ الحركة الطلابية في مصر"
text = "قائمة بيبليوجرافية مشروحة مرتبة زمنيا<br />أولا: المصادر العربية<br />1) د.عصام ضياء الدين السيد علي الصغير،الحزب الوطني والنضال السري 1907-1915،القاهرة،الهيئة المصرية العامة للكتاب،1987<br />* يأتي الكتاب في 362 صفحة من القطع الكبير ويتناول دور الحزب الوطني في النضال السري ضد الإنجليز في الفترة من 1907 وحتى 1915 وهي الفترة التي تولى فيها محمد فريد قيادته،ودورجمعية التضامن الأخوي الطلابية السرية في ذلك النضال والتي كانت تتكون من طلبة المدارس العليا قبل إنشاء الجامعة الأهلية<br />2) د.عاصم محروس عبد المطلب،دور الطلبة في ثورة 1919 1919-1922،القاهرة،مركز وثائق و تاريخ مصرالمعاصر،سلسلة مصرالنهضة،الهيئة المصرية العامة للكتاب،1990<br />• والكتاب في 320 صفحةمن القطع المتوسط،ويتناول دورالطلبة في الثورة في الفترة التالية لفترة نضال الحزب الوطني وبداية نضال حزب الوفد<br />3) د.ضياء الدين الريس،الدستور والاستقلال والثورة الوطنية 1935،القاهرة،دار الشعب للصحافة والطباعةوالنشر والتوزيع،ج1،ج2، عام 1975<br />• ويتناول في جزئين 216 صفحة من القطع الكبير لكل منهما دور الطلبة في ثورة عام 1935 للمطالبة بإعادة دستورعام 1923 والمطالبة بالاستقلال الوطني<br />4) حسن دوح,صفحات من جهاد الشباب المسلم،القاهرة،دار الاعتصام،1979<br />• ويتناول الكتاب في 192 صفحة من القطع الكبير دورطلبة الإخوان المسلمين في أوائل الخمسينيات في مقاومة الاحتلال الانجليزي في القناة<br />5) صلاح الدين البستاني،معركة القناة كما شاهدتها1951-1952 ،القاهرة،مكتبة العرب،1956<br />• ويتناول الكتاب في96 صفحة من القطع المتوسط بطولات الطلبة المصريين،وفظائع الاستعمار البريطاني في معركة القناة في الفترة المذكورة<br />6) محمد جلال كشك،ماذا يريد الطلبةالمصريون،بيروت،ب ن،ط2، 1968<br />• ويتناول الكتاب في 112 صفحة من القطع المتوسط مظاهرات الطلبة عام 1968 التي أعقبت نكسة يونية<br />6) أحمد عبدالله،الطلبة والسياسة في مصر،ترجمة إكرام يوسف،القاهرة،دارسينا للنشر،1991<br />• ويتناول بالتحليل العلاقة بين طلبة الجامعات والسياسة منذ بداية الحركة الطلابية حتى عام1973<br />7) وائل عثمان،أسرار الحركة الطلابية،1968-1975،القاهرة،مطابع مدكور،1976<br />• ويتناول الحركة الطلابية منذ مظاهرات ما بعد النكسة وحتى مظاهرات الطلبة في أوائل السبعينيات ضد السادات<br />8) الاتحاد العام لطلاب جمهورية مصرالعربية،مشروع ميثاق العمل الطلابي،ب ن،ب ت<br />* ويتناول في 64 صفحة من القطع المتوسط موجزا لتاريخ الحركة الطلابية في مصر منذ الحملة الفرنسيةعلى مصر،ثم يتناول علاقة الطلاب بالمجتمع والتنظيم السياسي والجامعة،وكذلك التنظيم الطلابي،وعلاقته بالحركة الطلابية العربية والأفريقية<br />9) السيد عبد الستار المليجي،تاريخ الحركة الإسلامية في ساحة التعليم 1933-1993،القاهرة،مكتبة وهبة،1994<br />• ويتناول الكتاب في 328 صفحة من القطع الكبير عرض سريع وموجز لتاريخ الحركة الطلابية الإسلامية المنتمية لمدرسة الإخوان المسلمين في الفترة المذكورة و ذلك من بداية الكتاب حتى صفحة 110<br />10) بدر محمد بدر،الجماعة الإسلامية في جامعات مصر حقائق ووثائق،ب ن،1989<br />• ويتناول الكتاب في 140 صفحة من القطع المتوسط نشأة التيار الإسلامي في أوساط طلبة الجامعة عقب نكسة يونية ووفاة عبد الناصر وسرد سريع لأهم محطات العلاقة المتوترة بينه وبين السادات حتى نهاية تلك المرحلة باعتقالات سبتمبر واغتيال السادات<br />11) عصام العريان،مجدي سعيد،إبراهيم البيومي غانم،الانتخابات الطلابية بالجامعات المصرية 1988-1989،ب ن،1989<br />• ويتناول الكتاب انتخابات اتحادات الطلاب بالجامعات المصرية في العام المذكور،مع التركيز حول دلالاته،وأحداث العنف فيها،والتغطية الصحفية لها<br />12) سمير فاضل إبراهيم،الطلاب وممارسة العمل السياسي داخل الجامعة،القاهرة،مجلة جسور،العدد الثاني،سبتمبر1999،ص ص52-61<br />13) وائل عبد الفتاح،أروى صالح شاهدة من أهلهم،جيل السبعينيات وثائق الحلم والسقوط، روز اليوسف العدد3604، 7/7/1997،ص ص 10-11<br />14) يونان لبيب رزق،الأهرام ديوان الحياة المعاصرة العدد192، ميلاد الحركة الطلابية،الأهرام،31 يوليو 1997<br />المصادرالأجنبية:<br />1) Erlich, Haggai, Students and Universities in Twentieth Century Egyptian Politics, London, Frank Cass, 1989<br />With my Best Wishs for Students'Movement in Egypt & All the World<br />Magdy Said"
archived = "2005-03-03"
capture_url = "https://web.archive.org/web/20050303091532/http://www.20at.com:80/article.php?sid=902"

[[comments]]
order = 5
subject = "من موقع جامعة عين شمس\" شمساوي\""
text = "تعجبني المقالة بما فيها من نقد بناء إلا أنني ألمح الكثير من التجني فيها<br />ربما لا يتاح لي الوقت لكتابة جميع أوجة التجني هذة لكن أذكر منها الآن على الأقل الأتي<br />أولا موضوع ركن البنات<br />وهذا أمر فعلا عجيب كيف يعترض الكاتب على وجود مثل هذا الركن الذي يحتوي وكما ذكر المقال على مواضيع بناتي \"الجمال والزواج والأكل ...\"وهذا سمت عام لكل الصحف والمجلات سواء أيصدرها الأسلاميين أو غيرهم وليس في الأمر شبهة تحكم طالما أن هذة الموضوعات يقرأها الطلبة والطالبات كما يقرأون كل أبواب الموقع فما هي المشكلة في وجود مثل هذا الركن<br />ثانيا موضوع الخلطة الروشة كما ذكر المقال<br />فهي أيضا أمر عادي لأن القائمين على هذه المواقع شباب وليسوا شيوخا عواجيز فهم يتكلمون بلسانهم والشباب هم الشباب كانوا أعضاء من التيار الأسلامي أو غيرهم ولكن هذه الروشنة بالفعل يجب ألا تجر الشباب إلى الحرام كأن يتبادلوا العبرات البذيئة أو الصور الفاضحة باسم الروشنة فعندما يقدم شباب التيار الأسلامي مواقع روشة لكنها لا تنساق ألى الحرام ولا تنسيهم الثوابت الأخلاقية فهذا لأنهم يعبرون عن أنفسهم وبصدق وليس في هذاما يعيب<br />هذا بعض ما يسمح به الوقت الآن وسأكمل ملاحظاتي في وقت آخر<br />أحد محرري موقع شمساوي<br />www.shamsawy.com"
archived = "2005-03-03"
capture_url = "https://web.archive.org/web/20050303091532/http://www.20at.com:80/article.php?sid=902"

[[comments]]
order = 6
subject = "مجرد رأي .."
text = "السلام عليكم<br />جزاك الله خيراً أستاذ مجدي على هذا الموضوع الرائع وعلى فكرة فتح باب النقاش في المواقع الطلابية<br />هذه المواقع (التي يقوم بها طلاب ) يعني (التي يقدمها ويحررها ويصممها طلاب) يعني (التي يتحمل تكلفتها وتنظيمها وتحرير أبوابها الطلاب أنفسهم) ..<br />وبصفتي أحد طلاب الجامعة المتابعيين لموقع جامعة أون لاين أوؤكد لك كلامي هذا، بدليل واضح وهو إغلاق موقع جامعةأون لاين وهوأول موقع طلابي شبابي إسلامي مثلاً هذا الموقع كان ولمدة ثلاث سنين هي عمره كان يغلق أيام الامتحانات ودائماً ماكانت تظهر على صفحته الرئيسية جملة \" لأننا طلاب مثلكم فنعتذر عن عدم تجديد الموقع هذه الفترة من أجل المذاكرة والإمتحانات ونسألكم الدعاء\"<br />عموماً .. اللي عاوز أقوله إن هذه المواقع قائمة على طلاب وهذا لايعني فقط أن هناك بعض الأوقات لايتم فيها تجديد الموقع لظروف الطلاب<br />ولكن هذا يعني أن الطالب بمجرد أن يتخرج من الجامعة فإن علاقته بالموقع تقل إن لم تنعدم ويخلفه طالب آخر يكمل المسيرة وهذا تقريباً يحدث سنوياً ودليلي على ذلك هو التغيير والتجديد الذي يطرأ على هذه المواقع كل فترة .<br />فكل جيل له أسلوبه وطريقته وإمكانياته<br />وحتى يكون كلامي ليس مجرد كلام فدليلي عليه هو التجديد الذي طرأ على موقع مثل جامعة أون لاين هذا العام عن العام الماضي والعام الماضي عن سابقه<br />وحضرتك ياأستاذ مجدي سعيد سيد العارفين إن تغيير فريق تحرير موقع كل فترةأمراً صعباً<br />مش بس كده ، حضرتك سيد العارفين برده المجهود الذي ينبغي أن يقوم به محرري الموقع لضمان نجاح موقعهم وهو مايتنافى مع ظروف القائمين على الموقع الذين يقومون بتحرير هذه المواقع ليس من باب الاحتراف ، فهم أولاً طلاب وثانياً ليسوا ذوي خبرة عاية في مجال الإعلام وليس معظمهم إن لم يكونوا كلهم من طلاب كليات الإعلام<br />وليس جميعهم مصممي مواقع أو مهندسين برمجه وجرافيك وفوتوشوب وفلاش وغيره من المتطلبات التي يحتاجها أي فريق تحرير<br />أضف إلى ذلك أنهم لم يعتمدوا حتى الآن إلا على إمكانياتهم المادية المحدودة فهم لايحصلون على أي دعم من إدارة الجامعة أو الكليات أو الإتحادات الطلابية ولاحتى يحصلون على إمكانيات من خلال القيام بإعلانات تجارية أياً كانت نوعها<br />لذلك ياأستاذ مجدي أنا لاأرى أن مهاجمتك لهؤلاء القائمين بهذا العمل في هذا الوقت بالذات هي في محله ولم يصلوا لاحتراف موقع مثل عشرينات أو لعالمية موقع مثل إسلام أون لاين أو لإمكانيات موقع الجزيرة نت"
archived = "2005-03-03"
capture_url = "https://web.archive.org/web/20050303091532/http://www.20at.com:80/article.php?sid=902"

[[comments]]
order = 7
subject = "الجزء الأول من الرد"
text = "السلام عليكم ورحمة الله وبركاته<br />الأستاذ مجدي سعيد .. جزاك الله خيراً على الإهتمام بمواقع الطلاب الشبابية الأخلاقية<br />واسمحلي أستاذي الفاضل .. أن أرد على تحقيقك مقطع مقطع ..<br />وتعالى نبدأ من الأول ..<br />في البداية قلت حضرتك : (( أن يعرف طلاب الجامعات، وتحديدا من التيار الإسلامي طريقهم إلى شبكة الإنترنت، فتلك خطوة متقدمة ما كنا نحلم بها، وقت أن كنا طلابا في ثمانينيات القرن العشرين ))<br />فجيل الثمانينات لم يحلم باقتحام التيار الإسلامي لشبكة النت ليس لعيب أو جمود في اللتفكير أو لقلة إمكانياتهم أو لبعدهم عن الجديد والتجديد والابتكار والوسائل التكنولوجية وإنما لأن النت في الثمانينات ماكان يعرفه الشعب المصري أساساً<br />ثم قلت حضرتك بحزن : (( لكن المحزن حقا أن تنظر إلى تلك المواقع فتجدها نسخا بالكربون، ليس بالطبع من حيث الموضوعات، ولكن من حيث الطابع والروح والاهتمامات ))<br />وهذا الكلام غريب جداً فطبيعي جداً أن يكون الطابع والروح والاهتمامات قريبة جداً من بعضها في المواقع الطلابية<br />فكما أن المواقع الإخبارية تشابه بعضها في الروح والطابع وبامكانك التأكد من ذلك من خلال رجوعك لموقعي العربية نت والجزيرة نت رغم ان امكانياتهما المادية عالية جداً<br />وكذلك المواقع الغنائية تجدها قريبة من بعضها في الطابع واروح وبإمكانك الرجوع إليها وغير ذلك من المواقع<br />وهذا طبيعي جداً إذ أن كل موقع يتم تدشينه يكون له هدف معين يختلف عن غيره من المواقع فالموقع الإخباري هدفه توصيل الخبر مهما كان كبيراً أو صغيراً هاماً أو غير هام له أهمية أوليس له ، وكذلك مواقع الأغاني فهدفها تقديم كافة أنواع الأغاني عربية كانت أو أجنبية تافهة كانت أو جيدة جميلة كانت أو سيئة<br />وعندما تجدأي موقع ليس له هدف واضح فهو محكوم عليه بالفشل مهما كانت إمكانيات الموقع<br />وعليه فالمواقع الطلابية لها أهدافاً تختلف عن غيرها من المواقع ولتشابه هذه الأهداف بين المواقع الطلابية تتشابه وسائل تحقيق هذه الأهداف في المواقع وبالتالي يتشابه الطابع وتتشابه الروح<br />وهذا ليس بمحزن أبداً يااستاذ مجدي وانا أرى أن الصواب قد جانبك ياأستاذي العزيز في أن تشابه الطابع والروح شيء محزن وانما كان المفروض أن تحزن عندما يكون هذا الطابع وهذاالروح لاتحقق أهداف الموقع الطلابي<br />نقطة أخرى ياأستاذ مجدي وقعت فيها وهي أنه إذا افترضنا أن المواقع متشابهة في الشكل والروح والطابع فهي مختلفة في المضمون والمادة والتحرير فكل موقع يستهدف شريحة معينة فجامعة أون لاين يستهدف طلاب جامعة الإسكندرية وكل الطلبة يستهدف طلاب جامعة القاهرة إلى غير ذلك<br />ثم قلت حضرتك ياأستاذ مجدي : (( والمواقع هي:\"كل الطلبة\"ويمثل طلاب التيار الإسلامي في جامعة القاهرة، موقع\"جامعة أون لاين\"،ويمثل طلاب التيار الإسلامي بجامعة الإسكندرية، أما الموقع الثالث فهو موقع\"يالا طلبة\" )) وطبعاً هذه ليست فقط المواقع الطلابية وان كانت هذه المواقع أهمها<br />ثم قلت سيادتك : (( الأخبار الرئيسية للمواقع الثلاث هي الأخبار السياسية: ففي بلد شعبه منزوع السياسة، لا عجب أن يكون شبابه \"المؤدلج\" مهووس بالسياسة وتحديدا في ثلاث مساحات هي: فلسطين والعراق، والسياسة المصرية بالطبع. ))<br />وهذا غريب حقاً أن تقوله حضرتك رغم أنك ذكرت في بداية كلامك أنك خريج الجامعة في الثمانينات وهذا يعني أنك تعرف دور الحركات الطلابية او بالأخص دور التيار الإسلامي في قضايا الامة والتي تتركز هذه الأيام في فلسطين منذ اندلاع انتفاضة الاقصى وتتركز على العراق منذ احتلالها من أمريكا وتتركز على مصر لأنها الوطن الأول لهذه المواقع وليست من باب المراهقة أو ماشابه<br />ورغم ذلك فإن هذه المواقع اهتمت بأخبار أخرى كثيرة غير أخبار فلسطين والعراق بل إني أتحداك أن تخرج لي خبراً واحداً فيه خبر عاجل عن عملية في فلسطين لم يكن لها صدى واسع أو عن عملية جهادية من العمليات اليومية التي يشاهدها العراق ، وهذا يعني أنه ليس الهدف من فقرة الأخبار في المواقع الطلابية هو نقل الاخبار السياسية وحسب<br />وقد ذكرت لك أن لكل شيء تنقله هذه المواقع له هدف ، حتقولي طب وايه الهدف الذي يتحقق من وضع الأخبار وهو الهدف الذي تحققه مواقع أخرى ، وهنا سأقول لسيادتك أن هدف المواقع الطلابية هو توضيح القضايا الإعلامية الهامة للطلاب وتبسيطها وتوصيلها بسلاسة وبأسلوب شبابي للطلاب<br />ثم تصنيفك للأخبار التي تناولها الطلاب في الموقع بأخبار فلسطين والعراق ومصر وحسب هو تصنيف ظالم فمع تلك الأخبار نقل الموقع أخبار سياسية أخرى خارج نطاق هذه الأماكن ، ونقلاً عن موقع جامعة أون لاين سأذكرك ببعض هذه الأخبار<br />أيضاً اتهامك للمواقع الطلابية بالإهتمام بالسياسة أولاً في أخبارهم هو اتهام ظالم، أيضاً إذ أن تلك المواقع اهتمت بأخبار الرياضة والفن والحوادث والأدبية والأخبار الشبابية<br />وهذا يدل أن حضرتك لم تتصفح جميع الأخب<br />Read the rest of this comment..."
archived = "2005-03-03"
