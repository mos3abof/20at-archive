subject = "الجزء الأخير من الرد .."
text = "السلام عليكم ..<br />قديماً قالوا مابني على خطأ فهو خطأ ، ومابني على باطل فهو باطل ولقناعتي ببطلان الآراء التي رآها الأستاذ مجدي فطبيعي أن أكون مختلفاً معه في أسبابها<br />وهو ماسأحاول أن أوضحهه في السطور القادمة<br />السبب الأول في رأي أستاذنا كان : النمطية والتقليدية فانتماء تلك المواقع إلى فكر تنظيمي معين، لا يخلق قدرة على الإبداع الحر، وهذا أدى إلى التشابه الحادث بين تلك المواقع<br />وأرجع القاريء إلى الجزء الأول من رسالتي ففيه بإذن الله السبب الحقيقي حول تشابه المواقع<br />وإلا فالفكر لم يكن يوماً من الأيام سبباً في تشابه شكل الموقع وأبوابه وهذا كلام بديهي جداً في عالم النت وحتى لا أطيل في الكلام فسأذكر مثال واحد فقط وهو موقع كتائب عز الدين القسام هذا الموقع الذي لايمر عليه شهرين إلا وتدمره لهم اسرائيل وفي كل مرة يخرجون بشكل جديد وأبواب جديدة وأسلوب جديد رغم أن فكره واحد .بل إن البعض يتهمونهم أنهم متجمدي الفكر ولايريدون تغيير فكرهم في الجهاد وغيره<br />فلم يكن الفكر في يوم من الأيام ينطح على شكل الموقع وأبوابه وهذه حجه ضعيفة<br />ثم يأتي اتهام آخر بلهجة شتيمة وهو (( عدم وضوح الدور: وأقصد به أن هؤلاء الطلاب القائمين على تلك المواقع لا يعرفون دور الحركات الطلابية في تاريخ الأمم، ومنها الأمة المصرية، ولا يعرفون أشكال الأنشطة الطلابية التي يمارسها طلاب آخرين في بلدان أخرى من العالم، كل ما يعرفونه في الغالب هو انتمائهم لتنظيمات إسلامية معينة أو انتمائهم لجيل معين ذو سمات معينة، منبت الصلة بما قبله وما حوله )) ولاأعرف مالداعي للإشارة بالتجريح للفكر والتنظيم بسبب أن موقع ماطلعش كويس أو حتى كان فاشل ، هل هذا يعطي الحق أن نهاجم الفكر كله ؟؟<br />وسأكتفي برد الأخ الذي عنون رسالته بـ \" من فضلك: كثيراً من الموضوعية وقليلاً من البر \"<br />وذلك حتى لاأطيل وأنتقل لنقطة أخرى قد تكون هي أفضل ماجاء في الريبورتاج وأعتقد أنها وصلت كثيراً وهي روشتة نجاح المواقع الطلابية<br />وأنا معك فيها كلها ولأكثر من هذه الخدمات<br />ولكن كل ذلك يحتاج مجهود وماده وامكانيات ووقت واحتراف وتفرغ وبإذن الله سيتحقق حلمك وحلمنا ، إذا سنحت الفرصة إما بمؤازتك البنائة معنا باقتراحاتك وأعمالك وكتاباتك أو بمؤازرة الجهات المختصة والمهتمة بالطلاب سواءاً كانت الاتحادات الطلابية أو إدارة الجامعة<br />وعلى رأي المثل اطبخي ياجارية ... كلف ياسيدي<br />وعلى كل حال أرى أن هناك العديد من المواقع الطلابية كانت قد بدأت ولو بشيء بسيط في بعض ماقدمته سيادتك من اقتراحات ولعل أهمها الاستشارات متنوعة لحل مشكلات الطالب الجامعي :الاجتماعية/الاقتصادية/الصحية/النفسية وذلك من خلال باب فضفضة مثلاً على جامعة أون لاين كذلك باب فتوى أون لاين الذي يخدم مشكلات الطلاب ورؤى الشرع فيها وأخيراً باب سلامتك ياصاحبي والذي يخدم مشاكل الشباب الصحية والمرضية والطبية<br />أرجو أن أكون قد وصلت رأيي دون أن أزعل أحد مني بسبب صراحتي التي أضطررت إليها بسبب سخونة الموضوع وطريقة عرضه<br />وأكرر أن موقع العشرينات بجميع رموزه سيظلون رموزاً لنا كمواقع طلابية وشبابية وأخلاقية<br />كانت هذه رأي ابنكم الصغير أرجو أن لاأكون قد أطلت عليكم<br />وختاماً لايسعني إلا أن أشكر الأستاذ الكبير الدكتور مجدي سعيد على هذه النصائح الغالية .. وأتمنى أن يكون هذا الموضوع فاتحة خير بيننا وإن توجهونا دائما بخبرتكم السديدة . .<br />مع تحيات : المهندس - مشرف في منتدى جامعة أون لاين<br />* ملحوظة : كل ماسبق لا يمثل إلا رأي ناشره وليس هو الرأي الرسمي لموقع جامعة أون لاين أو منتداه<br />نلقاكم في مواضيع أخرى .. وأستودعكم الله"
