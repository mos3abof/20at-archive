subject = "الجزء الثاني من الرد .."
text = "عودة لتكميل الرد ..<br />وقفنا عند تصنيف الأستاذ مجدي للأبواب الجامعية في المرحلة الثانية بعد الأخبار السياسية التي صنفها الأستاذ في المرحلة الأولى<br />فرغم أنني ذكرت أن المواقع الطلابية وبالأخص جامعة أون لاين اهتمت بكافة أنواع الأخبار السياسية والشبابية والرياضية والفنية وغيرها والتي تحتاج عمل زووم عليها للطلاب الذين هم رجال الغد ووزراء وحكام المستقبل والتي ينتظرها الشباب دائماً من إخوانهم وزملائهم في التيار الإسلامي أكثر من غيرها ،سواءاً من خلال النت أو من خلال الكليات<br />ومع ذلك فإن هذه المواقع لم تضع هذه الأخبار في المرتبة الاولى وكله بالدليل<br />وسأذكر لك أسماء الأبواب التي خصصت للأخبار السياسية وأسماء الأبواب التي خصصت للأخبار الجامعية وسأترك لك وولقاريء الحكم ، على من الذي يستحق المرتبة الأولى :<br />ونبدأ بالأخبار الجامعية وقد خصص لها موقع جامعة أون لاين على سبيل المثال الأبوب التالية :<br />الباب الأول : نبض الجامعة ويهدف لنقل جميع أخبار الكليات وتسويقها لزملائهم في الكليات الأخرى وتسويق أعمالهم وأفكارهم في الجامعات الأخرى ثم تسويقها لأقرانهم في العالم كله وللمعنيين من وسائل إعلام وصحفيين ومسؤوليين وأساتذه ووزراء وغيرهم<br />الباب الثاني: مراسلين تحت التمرين وله نفس الهدف السابق أضف إليه إهتمامه الخاص باقضايا التي تهم الشباب وتحتاج لرأي عام أو لإيصالها للمسؤوليين عنها، وعلى فكرة عالماشي كده مافيش ولاتحقيق يخص طلاب التيار الاسلامي في هذا الباب<br />الباب الثالث : يوميات جامعاوي ويهدف إلى استكشاف الأسرار الجامعية وإيصالها للطالب بأسلوب قصصي شبابي ساخر يخفف من حدة القضية التي تتناولها القصة<br />الباب الرابع : كليات الجامعة حيث يتم تخصيص صفحة تخدم كل كلية ولهذا الباب مكان على الصفحة الرئيسية وسيتم فتحه قريباً جداً بإذن الله<br />الباب الخامس : الكاميرا الشقية وفلسفته الرئيسية هي الحصول على صورة من داخل الجامعة وكتابة تعليق عليها<br />الباب السادس : اجتماعيات ويهتم بأخبار التهاني والتعازي للطلاب أو أعضاء هيئة التدريس وأقربائهم داخل الجامعة<br />وكل هذه الأبواب على الصفحة الرئيسية<br />أما على المنتدى<br />فالباب الأول في المنتدى هو باب الجامعة وحرمها<br />ثم الباب الثاني هو باب الخلاصة في الدراسة<br />تعالى بقه نشوف الأبواب التي تهتم بالسياسة أو الأخبار<br />الباب الأول : آخر خبر وقد سبق شرحه<br />الباب الثاني : ملفات ساخنة ويهتم أحياناً وليس دائماً بالقضايا السياسة بشرط أن تكون أهميتها من الدرجة الأولى مثل قضية الطلاب الستة المصريين أو قضية الكويز<br />وهذان البابان فقط هما المعنيين بالسياسة على الصفحة الرئيسية<br />أما على المنتدى فالركن المهتم بقضايا الأخبار السياسية هو ركن قضايا الساعة وهو الركن رقم (4) في ترتيب أركان المنتدى<br />وعليه وباختصار فالأبواب الطلابية تضمنت 6أبواب على الصفحة الرئيسية والركنين 1 و 2 في المنتدى<br />بينما الأبواب الإخبارية هي بابين أثنين فقط على الصفحة الرئيسية وركن واحد فقط على المنتدى<br />وإلى هنا أرجو من القاريء ومنك ياأستاذ مجدي أن تحدد الآن أي الأبواب تستحق المرتبة الأولى وأيها المرتبة الثانية<br />وللحديث بقية .. مع الجزء الثالث<br />انتظروني<br />مع تحيات : المهندس - مشرف في منتدى جامعة أون لاين<br />* ملحوظه : هذا الرأي أيضاً لايمثل إلا رأي ناشره وهو العبد لله .."
