text = "انا حلمت ببركات مع اني زملكاوي انا حاسس انه هيعمل حاجه اتمني عمرو زكي وابوتريكا واحمد حسن والسقا ومتعب يهدفو لحد ميزهقو واتمني ربنا يسترها مع عصام الحضري الي كان سبب اساسي في صعود مصر الي اي بطوله وربنا يكرمنا ويكرم حسن شحاته وباقي الجهاز واتمني من الجماهير تكون مشرفه انشاء الله هنكسب يا رجاله ربنا مش هيخزلنا"
