author = "مودى النوبى المصرى"
posted = "2009-11-09"
text = "احنا المصرين لازم نكسب<br />انا حاسس ان الدنيا بتغنى لينا من قلبها وان شبكتنا هتفضل نظيفه طول عمرها<br />لا هيدخل فينا جون من قبلها ولا من بعدها وعمرو زكى امه دعياله طول عمرها شبكات المحمول هتبقى معانا طول عمرها بس لو اتصالات الوقتى وقتها او موبنيل بتتكلم من قلبها<br />او فودافون ست ستها مصر ده مفيش قبلها ولا بعدها"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110174311/http://www.20at.com:80/masr/news/13944-2009-11-06-23-16-44.html"

[[comments]]
order = 7
subject = ""
author = "حماده.... الشاعر"
posted = "2009-11-09"
text = "بكل الحب هنشجع ونقول يارب…يا 80 مليون مصرى يا كل قلب<br />بيحب مصر .. وعشان ننول الفوز والنصر…نقول يارب<br />يارب يا خالق هذا الكون … فرح الـــ80 مليون<br />اصل مصر غاليه علينا …هتفضل دايما جوه عنينا<br />بين ارضيها …وبين صحاريها<br />كل حته وشبر فيها<br />جوه دمى … حبيبتى امى<br />الغاليه مصر<br />يا مصر يا ام الاوطان …من نيلك تسقى العطشان<br />من حبك تديله حنان … ومن دينك تمليه بأيمان<br />يا مصر يا ام الاوطان<br />يا مصر يا بلد الامان … يا ام لكل الاديان<br />عيسى والانجيل …ومحـــــ ـمد القرأنـــــــ<br />يا مصر يا ام الاوطان<br />من اجلك بنعدى بحور …ونعدى لو مليون سور<br />وعشانك دايماً احرار …يا مصر يا مصر<br />يا مصر يا ام الاوطان<br />حــــــــــــما ده …الشاعر"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110174311/http://www.20at.com:80/masr/news/13944-2009-11-06-23-16-44.html"

