text = "اقصى حمل كهربائى لجمهورية مصر العربية 80 مليون نسمة هو 17 الف ميجاوات فى اقصى ساعات الذروة فى الصيف<br />اقصى حمل لدولة الامارات العربية المتحدة 4 مليون نسمة هو 22 الف ميجاوات فى اقصى ساعات الذروة فى الصيف<br />اقصى لدولة مثل ايطاليا تعدادها 50 مليون نسمة هو 80 الف ميجاوات فى اقصى ساعات الذروة<br />اما المانيا فلا داعى<br />يعنى شعب متواضع جدا وغلبان جدا فى استهلاك الكهرباء<br />عايزين تضيقوا علية لية<br />الناس غلابة<br />انتم هتحسدوا الميت على الكفن<br />هى الكحكة فى ايد اليتيم عجبة<br />ارحموا الناس"
