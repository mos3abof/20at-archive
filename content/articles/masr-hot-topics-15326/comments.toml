posted = "2010-02-14"
text = "عارفين السبب اية<br />اخر احصائية رسمية صادرة عن الدولة ان عدد افراد وزارة الداخلية من ظباط وامناء شرطة وعساكر وخفر ومرشد شرطة 850 الف فرد<br />هذا بخلاف مليون عسكرى امن مركزى مجند<br />وكل دة يا محترم بيستهلك ميزانية 9 مليار جنية من فلوس دافعى الضرايب الغلابة<br />وجهاز امن الدولة بفروعة التى وصلت للقرى ليس لة شغلانة غير القبض على الاخوان والافراج عنهم<br />والا هيظهر انة لا يعمل وانة مالوش لزمة<br />ليلة العيد الكبير الماضى ضابط امن الدولة فى منطقتنا جمع كل اصحاب الدقون فى المنطقة وكل واحد بالكمبيوتر بتاعة وحبسهم ليلة العيد وفى الصباح اطلق سراحهم وقال لهم انا جايبكم علشان نتعرف<br />بدون نيابة ولا امر قبض ولا امر اعتقال<br />عايزين نتعرف<br />جهاز مالوش شغلانة غير القبض على شوية عيال والافراج عنهم<br />واحيانا تأتى اتهامات مضحكة زى هز نظام الحكم وزحزحة ترابيزة الحكم وتكدير الصفو العام<br />وسلم لى على البدنجان<br />مفيش ذرة امل ان البلد دى تتقدم وتنضف وتبقى حتى زى موريتانيا او موزمبيق<br />مفيش امل<br />فلا تهتموا بمثل تلك الاخبار<br />دى شىء عادى"
archived = "2010-02-16"
capture_url = "https://web.archive.org/web/20100216115805/http://www.20at.com:80/masr/hot-topics/15326--t-.html"

