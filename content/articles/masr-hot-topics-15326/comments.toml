text = "زهقنا يا محمد جمال الدين<br />طهقنا من لعب العسكر والحراميه دا بقا<br />عيب لما دولة عريقة زي مصر شعبها يلعب عسكر وحراميه<br />عيب على وزارة الداخلية عيب على المنتمين للاخوان<br />عيب عيب عيب<br />اكبروا بقا وبلاش لعب عيال"
