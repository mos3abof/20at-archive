subject = "ايام الجامعة"
author = "واحد تاني"
posted = "2006-03-20"
text = "افتكر كانت فى ايام معينة كل سنة لازم الكلية تتقفل ابوابها علينا ونتحاصر من قوات الامن اللى واقفة بالرشاشات على اسوار الكلية .... ليه يا اخواننا فى ايه ؟ قالك انتو ولاد وحشين وخطرين .... انتوا هندسة.... يعنى معقل الاخوان المسلمين بجامعة اسكندرية والحمدلله اني سبت البلد بعد الايام دى ومشفتش اللى حصل للغلابة اللى كان نفسهم يختاروا نواب ليهم يتكلموا بلسانهم ويحاولوا.... يحاولوا بس يصلحوا ما افسده الدهر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142002/http://www.20at.com/article2.php?sid=589"

