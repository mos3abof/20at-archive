order = 7
subject = "ردا على islam_physics"
author = "قذائف الحق"
posted = "2006-03-22"
text = "السلام عليكم<br />عزيزي اسلام<br />يوجد ضابط في أصول الفقه يسمى الضابط التكاملي و هو يعني أنه قبل استقاء الحكم لابد من جمع كل النصوص الوارده فية.<br />و الحديث الذي أوردته يمكن أن يضاف إليه أن المسلمون الاوائل خرجوا يوما من دار الارقم بن أبي الأرقم صفين عل صف عمر بن الخطاب و على الاخر حمزة بن عبد المطلي رضي الله عنهما و يهتفون الله أكبر و لله الحمد حتى وصلوا إلى الكعبة.<br />و قال الصحابة لأبي بكر رضي الله عنة لو وجدنا فيك اعوجاجا لقومناه بسيوفنا<br />أما الحديث الذي أوردته فحسب فهمي يصلح مع من يخاف الله و يخشي ايغار نفسه بالنصح أمام الناس أما في مثل حالاتنا ......<br />سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142002/http://www.20at.com/article2.php?sid=589"
