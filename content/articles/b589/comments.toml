[[comments]]
order = 0
subject = "اسألونى انا..مدوباهم اتنين"
author = "نيفين..نيفى..نوفا"
posted = "2006-03-19"
text = "ازل مره من كام سنه لما دخلت مظاهره تبع الاخزان على انها للانتفاضه و انسحبت (على مبدا عيش نمله تاكل سكر)لما لقيتهم بيقةلة حسن البنا يا شهيد دمك راجع من جديد<br />المره التانيه كنا كبرنا و فهمنا قلت عيب لازم اشارك<br />انا ف بلد ديمقراطى<br />كان دا ف معرض الكتاب السنه اللى فاتت<br />و فعدنا نقول يا حريه فينك قينك الطوارىء بيننا و بينك<br />و عينكو ما تشوف الا النور<br />عارفين الباقى بقى<br />بس و الله يا جماعه اجمل احساس ف الدنيا لما تبقى ف مظاهره و بتقةل حاجه انت مقتنع بيها<br />سعد سعد يحيا سعد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142002/http://www.20at.com/article2.php?sid=589"

