author = "Dabdoob"
posted = "2006-03-21"
text = "انا مااشتركتش في مظاهرات قبل كده لسببين<br />الاول ايام الجامعة كانت المظاهرات كلها اخوان وانا مابطيقش الناس دي ومش مقتنع بافكارهم فطبعا ما دخلتش معاهم<br />الثاني بعد الجامعة لاني كنت مرتبط بشغلي وكمان لان في الفترة دي الموضوع زاد عن الضرب ودخل في التحرش الجنسي للرجالة والستات وبهدلة الاهل وكل الطرق الجميلة اللي بتحصل في مصر وعشان كده طبعا خفت اشترك مش جبن لكن لاني عارف ان بعد كل الاهانات والبهدلة اللي هاتحملها.... مفيش فايده<br />والسلام عليكم<br />Dabdoob<br />مفيش فايده يا جماعه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142002/http://www.20at.com/article2.php?sid=589"

[[comments]]
order = 4
subject = "إن الله لا يغير ما بقوم حتي يغير وا ما بأنفسهم"
author = "islam_physics@yahoo.com"
posted = "2006-03-21"
text = "السلام عليكم...<br />قال تعالي \" إن الله لا يغير ما بقوم حتي يغيروا ما بأنفسهم \" أي أننا السبب في هذه التعقيدات الدنيوية التي نعيش فيها فكل شيئ نحولة إلي أهوائنا دون الرجوع إلي الكتاب والسنة ودون الرجوع إلي المنهج القويم في ديننا الحنيف، فموضوع المظاهرات لا أعلمة من أي باب في الدين يقوم به بعض الناس ، ربما للغيرة علي الدين وربما نصحا لحكامنا وتقويما لأخطائهم وربما إعتراض علي ما يفعلون من مفاسد ، ولكن لو رأينا منكرا من أي أحد عموما ومن الحكام خصوصا كيف نغيره، ألا يجب أن نعرف الطريق النبوي السليم كلكم طبعا تودون الصواب - وأنا مثلكم - فتعالوا معي ،<br />يقول رسول الله -صلي الله عليه وسلم- من كان ناصحا لصاحب سلطان فلا يبديه علانية وليخلو به ... الحديث.<br />فالحديث بين أن السلطان أو من له سلطان ينصح -من كان ناصحا- ولا يؤمر أو يهدد ثم بين كيفية النصح وهي الخلوة به وليس علنا أمام الناس وعلي مشهد كل العالم فمن عواقبه أنه يقلب السلطان علينا مثلما يحدث من ضرب وأيضأ أنه مخالفة لأمر النبي والحديث صحيح ثم أننا إن أردنا أن نغير منكرا يجب أن نراعي الحالات الأتية الواردة في حديث من رأي منكم منكرا فاليد ثم اللسان ثم القلب ولما تلك التقسيمات لانه ربما صعب علي البعض في ظل اوضاع معينة الإنكار باليد واللسان وعليه ينكر بقلبة بالدعاء وعدم الرضا القلبي<br />فربما سبب الانكار باليد واللسان خراب عظيم من تدهر ....<br />وهناك الكثير ومن أراد فاليراجعني<br />إسلام عبد السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142002/http://www.20at.com/article2.php?sid=589"

