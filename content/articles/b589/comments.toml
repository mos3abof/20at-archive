subject = "مظاهرات ايه وبتاع اي.....!!!"
author = "sweet_princess"
posted = "2006-03-21"
text = "ايه الكلام الغريب دا :<br />بقى في واحده اسمهاسويت تشترك في مظاهرات ....<br />الحمد لله انا لسه بعقلي ... وكفايه اللي بنسمعه وبنشوفه كل يوم للبنات اللي بيشتركو وبيحصلهم (وخصوصا ايام انتخابات الرئاسه )وكلاب الحزب الوطني اللي كانو بيتحرشوا بالبنات ويقطعول لهم هدومهم (والعياذ بالله)..<br />هو اخويا عملها مره في اولى جامعه ورجع (متخرشم) ... ,من يومها مكررهاش تاني ..<br />ال مظاهرات ااااااال قولوا كلام غير دا ."
