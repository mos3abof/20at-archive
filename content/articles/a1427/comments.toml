[[comments]]
order = 0
subject = "حكيمة من المغرب"
author = "سم الله الرحمان الرحيم والصلاة والسلام على اشرف المرسلين."
text = "وقفت وقفة طويلة امام ما كتبه احد الاخوان سامحه الله واطلب من الله تعالى ان يهديه لقد جرما عظيما بقذفه للمحصنات.<br />صحيح هناك مغربيات نطلب من الله تعالى ان يهديهن الى الطريق الصحيح. ولكن ماذا عنك ايها العفيف؟ وماذا عن ابناء جلدتك؟ ماذا عنكم يا خليجيين؟ اتعرفون شيءا ان اخباركم تذاع صباح مساء في كل ارجاء العالم. لمذا تحملون لافتات تحاولون تغطية ما يدور تحت الستار اتعرف اخي ان هذه اللافتات وهذه الستائر لن تحجب عن اعييننا ما يدور عندكم وفي منازلكم. صحيح هناك شابات فاسقات لكن هل اجبروك على شيء . لماذا تحول انت مبلغا هائلا من الاموال في سبيل المتعة والسفر الى المغرب؟او الى مصر؟او الى سوريا؟او لبنان؟ او..او..لماذا؟. سالتك نفسك لماذا ؟ ساجيبك انا الان لانك لا تحترم المراة وتستغلها بابشع الطرق؟ لقد تناسيت ان امك مراة واختك مراة وزوجتك مراة وبنتك مراة. اما عن نعتك المغرب او اي بلد ثاني فانصحك اخي ان تهتم بمايدور عندك هنا داخل بلدك الحبيب العفيف.تعتقدون انكم تخفون ولكن الرائحة لا تخفى لقد خنقت العالم.وعلى كل حال لا تعاير اخيك عسى الله ان يعافيه ويبتليك.<br />اللهم اصلح امور هذه الامة .اللهم اصلح شباببناونسائنا ورجالنا واعل كلمة الحق بيننا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154524/http://www.20at.com/article.php?sid=1427"

[[comments]]
order = 1
subject = "هل عجبكم هذا"
author = "ل اعجبكم ما يقال عنكم يا مغاربة سبحان الله ماتت النخوة وماتت الرجولة ومات الاسلام خلاص ارتحتو يا مسؤولين.فنامو الان وانتم قريري الاعين ومرتاحي الضمائر ..............حسبناالله ونعم الوكيل......"
text = "اللهم دمر اعداء الدين ودمر كل من يهتك عرض امراة او يريد بالمراة سوء .اللهم ارنا الحق حقا وارزقنا اتباعه وارنا الباطل باطلا واجتنبوه.<br />اخذكم الله ما ساقطات لم تتركو لنا قيمة نرفع بها رؤوسنا كيف سنقول غدا انا مغربية باي وجه ساقولها رحماك يارب<br />ح.المغرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154524/http://www.20at.com/article.php?sid=1427"
