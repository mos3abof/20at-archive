[[comments]]
order = 0
subject = "حدث بالفعل"
text = "الغريب يا جماعة<br />إن فعلا الجامعة الأمريكية اللي هي المفروض تكون ضد القومية والثوابت والكلام الكبير ده كله<br />ولكن المفارقة بقى<br />أن الجامعة تكون فيها أكبر جماعات مناهضة للهيمنة الامريكية وكمان يكون فيها إلى جانب العري والأخلاق الفشنك عيال ملتزمة ومتدينة وكدة<br />يللا<br />خير إن شاء الله"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022134644/http://www.20at.com:80/article.php?sid=556"

[[comments]]
order = 1
subject = "واضح انهم هيلغوا مكان الـتأمل كمان ...!!"
text = "طلاب متدينون في الجامعة الامريكية إن الجامعة مهتمة بتخصيص مكان لعبادة غير المسلمين يسمونه * مكان التأمل* أو في المقابل يرفضون بناء مسجد في الجامعة ويكتفون بالمصلي الحالي الذي يقول الطلبة إنه كان عبارة عن مطعم مهجور ولايكفي اعداد الطلاب الراغبين في الصلاة بحيث يضطرون لتناوب صلاة الجماعة عدة مرات!!"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022134644/http://www.20at.com:80/article.php?sid=556"

