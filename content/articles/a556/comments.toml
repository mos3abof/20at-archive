[[comments]]
order = 3
subject = "بيرو"
text = "طلبة الجامعة الامريكية ينظوفون الشوارع ويطلون الجدران ويعطفون علي اليتيم ...<br />ياه ...يعني طلعوا بشر زينا وبيحسوا وبيعرفوا يعملوا حاجات كويسة ..<br />لا يا شباب ...هو ده اللي امريكا عايزاه ... عايزة الناس تحس دايما ان فيه فرق بين اي شيء أمريكاني وبين اي حاجة تانية ...<br />عايز الشبح والعفريت اللي ساكن جوا دماع كل واحد مننا يكبر ويكبر ويكبر<br />العفريت ده اسمه امريكا ..الدولة العظمي ...التكنولوجيا والفلوس والدولار وتمثال الحرية ...<br />الكلام الحلو والافلام الأكشن ومايكل جاكسون وجوليا روبرتس<br />الحقيقة ان شباب الجامعة الامريكية بيدرسوا بشكل مختلف ومحدش ينكر انه متميز اكتر بكتير من اساليب التعليم العربية<br />لكنه موش خرافي ...يعني عادي ...بيحصل<br />فطبيعي ان الشاب اللي بيتعلم بشكل متطور يحاول تطوير بلده اللي اتولد فيها واللي بينتمي ليها<br />بلاش يا جماعة العفريت يكبر ويكبر لحد ما حايجي اليوم اللي هنبطل ناكل فيه التفاح الامريكاني ونقعد نتفرج عليه بس لانه جاي من الجنة بتاعة ماما ...امريكا ..!!"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022134644/http://www.20at.com:80/article.php?sid=556"

[[comments]]
order = 4
subject = "جديد الموقع"
text = "ايه يا جماعة؟ انتوا ليه واخدنها بالمعنى ده؟<br />أنا مانكرش ان الشبح ده أ عقدة الخواجه معششه جوانا، لدرجة إني نفسي فعلا أدخل الجامعة الأمريكية و أتفرج عليها و على الناس إلي جوه و حياتهم برهبه كبيره إلى حد ما، رغم إني أعرف منهم ناس مصريين أكتر من أي معنى أعرفه لكلمة مصري! و رغم إني أعرف (من واحد منهم) إن المجتمع جوه الجامعه زيه زي أي مجتمع تاني فيه كل الطبقات و الفئاف و التوجهات بكل تناقضاتها!<br />لكن بصراحه لما باشوف و بسمع عن الشباب دول و عن إلي بيعملوه و مشاريعهم إلي من النوع ده، باحس إنهم أكبر قلم خدته أمريكا على (...) ولا مؤاخذه!<br />بالضبط زي موسى إلي اتربى في قصر فرعون عشان يكبر و يحاربه و يحارب دولته!<br />كفايه بقى سيطرة لفكرة \"نظرية المؤامرة\" على تفكيرنا في كل كبيرة و صغيرة! ده إلي بيكبر الشبح.. كأن الأمريكان دول فعلا ناس خارقين و بيعرفوا كل حاجه و بيخططوا لكل صغيرة و كبيرة في حياة كل خلق الله!!"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022134644/http://www.20at.com:80/article.php?sid=556"

[[comments]]
order = 5
subject = "مصـ( الخير )ـعب"
text = "السلام عليكم يا جماعة<br />أنا متفق تماما مع الكلام اللي بيقوله \" بيرو \"<br />مش عشان الحلف , ولكن علشان قناعة داخلية جوايا<br />و الأخ \" جديد الموقع \" :<br />\" اللي عارف نظرية المؤامرة و مؤمن بيها<br />لا يمكن أبدا تبقى عنده عقدةالخواجة<br />بس الكلام ده لو فاهمها صح \"<br />و هم بالفعل بيفكروا في كل حاجة<br />بس هم مسيطرين لأن اللي بيواجههم عندنا معدومي العقل<br />أو بمعنى آخر :<br />\" هم متفوقين علشان مفيش<br />حد غيرهم حاول ينهض , أما لو في حد<br />- يا رب اوعد أمتنا - مش هيبقوا ...\""
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022134644/http://www.20at.com:80/article.php?sid=556"

[[comments]]
order = 6
subject = "بيرو"
text = "الاخت جديد الموقع ...موش عارف ليه انا حاسس انك \"اخت \"<br />المهم انا شايف ان حضرتكط متفقة جدا مع الكلام اللي انا قلته في البداية ..يعني مفيش اختلاف جوهري<br />ويا استاذ مصعب الخير ...حاول تبقي اهدأ مع الزباين الجداد ...<br />متقطعش عيشنا امال ...الناس داخلة وبتقول يا هادي هنقول تعليق ...يبقي يوم ما يقولوا تعملهم حلوانا في سلوانا وتقعد تقطمهم ...<br />مصعب ...مخصوم منك تعليقين ...ولو اتكررت هعمل بلوك لتعليقاتك ...<br />معلقين آخر زمن ..!!"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022134644/http://www.20at.com:80/article.php?sid=556"

[[comments]]
order = 7
subject = "مصعب الخير"
text = "لا مؤاخذة يا بوس ...عندي أنا الكوبيات اللي أتكسرت دي ...<br />بس ولو فيها رزالة ...يعني ايه حلوانا في سلوانا ؟؟"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022134644/http://www.20at.com:80/article.php?sid=556"

[[comments]]
order = 8
subject = "جديد الموقع"
text = "جداد؟؟<br />اظاهر انت مش واخد بالك يا أخ بيرو انت و مصعب انتوا بتكلموا مين، إحنا اقدم منكوا في الموقع ده.. كانوا لسه بيقولوا يا هادي يارب لما ابتدينا \"شغل\" معاهم..:)<br />أنا مش \"ضيفه\" فعلا، أنا صاحبة شغل :P<br />خلي بالكوا بقى لحسن المره الجايه حتقعوا في مدير الموقع شخصيا :D"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022134644/http://www.20at.com:80/article.php?sid=556"

[[comments]]
order = 9
subject = "سيادة المحافظ"
text = "الأخوة الأفاضل<br />بالنسبة لموضوع الجديد والقديم<br />عيب قوي<br />مش عشان ساكتين لكم انا وغاندي البلد الأخ المحترم<br />تقولوا انكم قدام وكدة<br />احنامن زمان قوي هنا<br />لكن بطلنا نكتب عشان ندي فرصة للشباب اللي زيكم<br />فعيب بقى تستولوا على أقدميتنا<br />من فضلكم<br />نحترم السلم الوظيفي شوية<br />إخص<br />إخص<br />إخص"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022134644/http://www.20at.com:80/article.php?sid=556"

[[comments]]
order = 10
subject = "غاندي البلد"
text = "سيادة المحافظ.. ميرسي خالص على شعورك الوظيفي تجاهي..<br />بالنسبة لجديد الويب سايت والحجاج فرافيرو ومحور الشر دول.. شايف إن كلهم في خندق واحد يا خويا يا محافظ كلهم آخر موديل... لكن احنا (الدهن ف العتاقي) .. وخد مني أنا..<br />وعلى رأي المثل:<br />إخص إخص إخص"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022134644/http://www.20at.com:80/article.php?sid=556"

[[comments]]
order = 11
subject = "جديد الموقع"
text = "والنبي إيه؟!<br />يا سيادة المحافظ و تابعه (و بلاش نفسر أكتر عشان ما نفضحكوش) إعملوا الشويتين دول على حد غيري، انتوا مفئوسين و عندنا ملف كامل عنكوا و عن نشاطكوا، بالأماره أنتوا منتمين (من تحت لتحت) للحلف الإلكتروني الفظيع بقيادة الإرهابي \"بيرو\" و قائد عام الحلف \"مصعب الخير\".. و إلي على راسه بطحه، ميلعبش مع ناس قديمه زينا :P"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022134644/http://www.20at.com:80/article.php?sid=556"

[[comments]]
order = 12
subject = "وعباس لسه كابس عليه النوم"
text = "ايه الاسماء الغريبة دي؟!<br />غاندي البلد<br />بيرو<br />سيادة المحافظ<br />مصعب الخير<br />جديد الموقع<br />اسماء غريبة.. فين الأيام الحلوة بتاعة: دفرواي تامر الشبراويشي، وأخوه كرع الهوارة، جغبوب الحوق، فغرللي حبككش، وكده<br />الله يرحم إنترنت الرجل بتاعة زمان"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022134644/http://www.20at.com:80/article.php?sid=556"

[[comments]]
order = 13
subject = "سيادة المحافظ"
text = "فكرتني والله يا غاندي يا ابني<br />بالأيام الحلوة بتاعت الناس الكبارة اللي تفهم في العيب والأصول والعادات والتقاليد عم هلال بتاع التموين وشاي شمتو وترابيزات البينج بونج في الشوارع ولعبة جين جين دراويش والسبعاوية وصيادين السمك ... يا سلام ...<br />فاكر فاكر؟"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022134644/http://www.20at.com:80/article.php?sid=556"

