posted = "2006-01-05"
text = "Just a reminder to my brothers and sisters that Hajj is the 5th pillar of Islam. It is like salah and zakah and Ramadan fasting. I don't find no excuse for those who find a way to postpone Hajj Plz remind yourselves and your parents to make it our priority for the next year. Specially that it is one of the garanteed ways to increase our rizq according to the hadeeth of our beloved profet PBUH wassalam"
