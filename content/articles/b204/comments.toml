text = "أغرب قصة سمعتها في الموضوع ده كانت قصة والد صاحبي<br />كان بيجمع ( من و هو في الجامعة ) العملات الـ\"فكة\" اللي بتتبقى و بعد 10 سنوات من الإدخار ، كانت تمثل 75% من تكاليف الرحلة ، و الباقي كان من السهل تدبر أمره"
archived = "2006-11-02"
