subject = "كنت ناوى ولازلت"
author = "mlo2006"
posted = "2006-01-05"
text = "والله دى امنية حياتى ان احج لبيت الله الحرام وكنت ناوى السنه دى لكن ظهر لى موضوع الزواج فقررت الزواج اولا وبعدين احج مع زوجتي انشاء الله و امنيتى ان يطيل الله فى عمرى وان لا يحرمنى من زيارة البيت الحرام وعقبال كل المسلمين يا رب وكل عام والمسلمون بخير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124146/http://www.20at.com/article2.php?sid=204"

[[comments]]
order = 1
subject = "يا رب اكتبهالنا"
author = "نفسي بجد أطلع أحج . المشكله انى ماعنديش القدرة المادية اني أطلع و معايا مرافق كمان خصوصا اني لسة ماتجوزتش"
posted = "2006-01-05"
text = "و بعدين انتو ليه يا عشرينات بتعرضوا وجهة نظر واحدة . ده في شباب كتير جدا نفسه يطلع يحج لكن أعتقد إن الزواج هو الذي يمنعهم لان الشباب يقولون أن الزواج أبدى و البنات ينتظرن الزواج أولا ثم الذهاب مع الزوج للحج.<br />و أنا أعرف واحدة ماكانش حيلتها غير 15 ألف وارثاهم من أبوها و أول ماتجوزت راحت تحج بيهم مع جوزها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124146/http://www.20at.com/article2.php?sid=204"

