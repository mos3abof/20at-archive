subject = "فلسطين مسقط راسي ومكة مسقط روحي"
author = "امل"
posted = "2006-01-08"
text = "بنسبة لي فكل يوم ابكي عندما اشاهد حجاج بيت اللة الحرام على الفضائيات لكن مشكلتي هي في السن المحدد من قبل الدولة لسماح للحج اكثر شى اب ان افعلة في الحج هو التلبيه (لبيك اللهم لبيك )والطواف وقد سبق لي العمرة مرتين وهي سبب التزامي لذا ادعو الشباب للحج والعمرة لانها الشى الروحاني الوحيد الباقي في ظل الحياة المادية التى نعيش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124146/http://www.20at.com/article2.php?sid=204"
