text = "أنا مش عارفة انتم مسمينها فتوى أصلا ليه<br />الفتوى تصدر من أهل الفتوى وبأدلة وأحاديثو آيات .. والرأى ده مجرد رأى ولا يحسب على الدين<br />والله هو عايز مراته وبنته وأخته تتباس … هو حر … احنا مالنا<br />ده مالوش علاقة بالدين<br />نفسى افهم انتم حاسبينه على أهله الفتوى ليه وأزاى ؟ !!!!!!!!!"
archived = "2010-02-10"
capture_url = "https://web.archive.org/web/20100210070936/http://www.20at.com:80/20at/lifestyle/8449.html"

