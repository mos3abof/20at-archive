[[comments]]
order = 7
subject = ""
author = "الدميرى"
posted = "2008-03-15"
text = "لما يطلع(شيخ) الله اعلم من هو ويصدر فتوى تمس عقيدة المسلمين لازم يعرف قصة مفتى سيدنا الامام مالك حين سئل فى 49مسئله لم يجب منها الا على 13 مسئله وهو الذى قيل فى حقه لا يفتى ومالك فى المدينه واضعا نصب عينيه الحديث(اجرأكم على الفتوى اجرأكم على النار) ولا ننسى قوله تعالى _ان الذين يحبون ان تشيع الفاحشة فى الذين امنوا لهم عذاب شديد فى الدنيا والاخره والله يعلم وانتم لا تعلمون)سورة النور.<br />ولو حاولنا الرد على صاحب الفتوى المسمومه لقلنا ان القرءان حرم النظره اساسا وقال (ولا تقربوا الزنى)ولم يقل ولا تزنوا<br />لانها مجرد خطوات…خطوات<br />انا اللى عايز اعرفه لماذا يحاول الشيخ ابو التساهيل ان ينشر الفساد فى المجتمع المسلم؟؟!!!!!!<br />اعتقد ان الاجابه واضحه…هو اما يريد شهره او ثناء او نشر الفساد<br />ياااااااااااااا اه…زرحم الله زمانك يا عمر لو سمعت فتوى الشيخ احه مد"
archived = "2010-02-10"
capture_url = "https://web.archive.org/web/20100210070936/http://www.20at.com:80/20at/lifestyle/8449.html"

