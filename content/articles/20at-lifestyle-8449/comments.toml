posted = "2008-03-11"
text = "بعيداً عن الموضوع الفتوي الغير منطقى<br />انا ارى ان المشكلة أصبحت فى عدم الثقة الموجوده عند الناس فى اى فتوى وأن الناس فى الوقت الحاضر أصبحت هى التى تقوم الفتوى هل هى جيده ام لا وهذا امر خطير خصوصا فى ظل الفتاوى غيربه الشكل التى تظهر مثل هذة الفتوى<br />ولابد من تحديد هيئة شرعية ككدار الافتاء مثلا ولا يحق لاى احد بعد ذلك ان يصدر اى فتوى<br />وفى النهاية انصح الشباب كل واحد يخاف على عداد عمره وميلعبش فيه احسن(( وعيش مأدب تموت مستور … ولو خد بوسه هتموت بالسطور ))"
archived = "2010-02-10"
capture_url = "https://web.archive.org/web/20100210070936/http://www.20at.com:80/20at/lifestyle/8449.html"

