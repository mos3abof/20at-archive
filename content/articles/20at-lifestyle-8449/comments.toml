author = "محمد يونس"
posted = "2008-03-14"
text = "الحوار بكل بساطة .. أولا هو ليس عالم … و ليس داعية مثلا له بذله الجبار لدين الله<br />لن أخوض قى شخصه …أو أقارنه بأخيه …<br />الحوار بكل بساطة … كون إن الذنب \" من اللمم \" على حد قوله .. و إن الله يغقره على طول ببساطة …<br />1- ماذا لو مت و أ،ا أرتكبه ؟؟؟؟؟؟؟؟؟؟<br />2- أين التوازن بين الخوق من الله و الرجاء قيه ؟؟؟<br />3- لإقرارك بإنه ذنب … لا يبيح ليك إننا نقول \" ماهو ذنب صغير فحلال إن أعمله \" !!!!!<br />يا جماعة الله يكرمكو … ما كنش له لازمة هذا المقال أصلا … لآنه بيلقى الضوء على شىء تاقه .. و فكرة عبيطة … قضلا عن كونها تخالف صريح الدين"
archived = "2010-02-10"
capture_url = "https://web.archive.org/web/20100210070936/http://www.20at.com:80/20at/lifestyle/8449.html"

