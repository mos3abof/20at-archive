author = "battot"
posted = "2008-03-11"
text = "جديدة حكاية الفتوى دي،،،، مسمعتش عنها غير منك يا احمد،،،،،،،، بس بصراحه فتوى مسخرة ايه العبط ده<br />الناس دي بتستهبل اوي<br />الموضوع ده فكرني برأي الدكتور مصطفى محمود لما واحده قالتلو ان مفيش فرق بين السلام بالأيد مع رجل غريب وتقبيل رجل على أساس انه في الاخر ده عضو بيلمس عضو ،،،،،،،، ورد عليها د مصطفى محمود وقالها ان تأثير السلام بالايد غير تأثير التقبيل<br />وانا مع مها اللي قالت ان خطيبها لو فكر في كده يبقى بيلعب في عداد عمره<br />وفي الاخر انا رايي ان اللي قال الفتوى دي يسيبه من التفكر في الاسلام ويروح يفكر في اي حاجه تانية"
archived = "2010-02-10"
capture_url = "https://web.archive.org/web/20100210070936/http://www.20at.com:80/20at/lifestyle/8449.html"

