text = "السلام عليكم<br />فعلا في المغرب عادات مشينة في عاشوراء بعضها يصل إلى بصمات فيها تشيع واضح<br />لكن البسطاء لا يعرفون ذلك ويفعلونها عن حسن نية<br />غير ان الدعاة واجبهم أن يبصروا الناس بتلك المخالفات<br />اما الموضوع فهو جيد صياغة وأسلوبا ومعلومات<br />شكرا لك استاذ عبد الله التفراوتي"
