author = "علي"
posted = "2007-02-04"
text = "التشيع بمصر والمغرب العربي مغروس بنفوس وقلوب الناسمن اجيال منذ الدولة الفاطمية ليومنا هذا ولا يوجد ما بعارض الشريعة والدين في اقامة مراسم عاشوراء وان كانت مشوهه كثيرآ فتحولت لأشبه بالكرنفال والسبب ان الناس مغيبين عن تراث اهل البيت عليهم االسلام وليس لاحد الحق بمصادرة ثقافة اي شعب تحت اي مسمى ومصاردة معتقدات الناس بمجرد عدم توافقها مع تيار معين سواء كان اقصائي او تكفيري."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105225903/http://20at.com/20at/lifestyle/3138.html"

[[comments]]
order = 2
