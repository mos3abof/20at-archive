author = "كريمة"
posted = "2007-02-08"
text = "انا مغربية عشت و ترعرعت في المغرب و ادكر طقوس الاحتفال بعاشوراء كما هي مفصلة في التقرير ، و بحكم تواجدي في فرنسا و احتكاكي بالمجتمع الغربي ارى ان ظاهرة عاشوراء ما هي الا خليط من الموروث الشيعي في الجانب الدرامي للظاهرة من اشعال للنار و عدم الحلق و التعطر بالنسبة للرجال طيلة العشرة ايام الاوائل، و هي ايضا مناسبة للتعبير عن الانتماء للاسلام سواء من طرف اناس جهلة عاميون او مثقفون واعوون هدا التعبير يتمثل في الصيام و الزكاة و الادكار ، و عن الجانب الغربي فهي اقرب ما تكون الى عيد المسيحيين في الخامس و العشرين من دجنبر من كل سنة ميلادية او ما يعرف عندهم بنويل، ففي هدا العيد المسيحي الكثيؤ من الطقوس المشابهة للطقوس العاشورية اولها حق بابا عيشور او تلك الدريهمات التي كنا نسعى جميعا و نحن صغار الى اخدها و مازال من هم اصغر منا الأن يفعلون نفس الشيئ ، فهده العادة متواجدة هنا بنفس الطريقة حيث يخرج الاطفال الصغار مع قناديلهم طرقا في الابواب طالبين لحق نويل، ماعدا عن التسمية فبابا عيشور اقرب الى بابا نويل ناهيك عن اللعب التي تظهر في هده السنة و التي تهدى للاطفال لكن في المغرب ليس من طرف بابا عيشور(بابا نويل) بل من طرف الأباء و الامهات، و ايضا الفواكه الجافة(الفاكية) فهي داتها المتواجدة في الاسواق الازربية طيلة فترة نويل و تختلف فقط طريقة العرض، و في الاخير الوجبة الخاصة ففي المغرب القديد و في اوروبا الديك الرومي و سمك السلمون."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105225903/http://20at.com/20at/lifestyle/3138.html"

