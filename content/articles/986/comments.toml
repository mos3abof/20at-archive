order = 0
subject = "احييك جدا"
author = "عاقل"
posted = "2006-04-29"
text = "واللهى ياض يانجاد انا بقيت احترمك<br />واللهى انت مفيش زيك اتنين<br />ايوة كداالبنات تروح الاستاد عادى جدا<br />تقعد جنب الولاد عادى اوى<br />تقلع الحجاب بردو عادى<br />دانت عسل ياراجل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125910/http://www.20at.com/article2.php?sid=746"

