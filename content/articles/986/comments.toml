[[comments]]
order = 4
subject = "موضوع تعبان!"
author = "مش أنا"
posted = "2006-04-29"
text = "موضوع تعبان جدا مع إن اللقطة حلوة، و ممكن كنت أقرا الموضوع بنفس لولا الأسلوب الضعيف اللي مكتوب بيه، يعني مثلا في تلات فقرات ما ضافوش أي جديد و لو اتشالوا مش هيفرقوا في حاجة، و حاجات تانية بنفس المنظر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125910/http://www.20at.com/article2.php?sid=746"

[[comments]]
order = 5
subject = "بصراحة ناس محترمة"
author = "أسد الدين"
posted = "2006-04-30"
text = "أحلى حاجة في الناس دي إنهم بيعملوا كل حاجة من غير ما يقعوا في حرام.<br />-البنت تروح الملعب .. وماله بس لا تقعد جنب ولد ولا تتزاحم معاه ولا تخلع حجاب<br />- البنت تلعب رياضة .. وماله بس لبس محترم وبدون ظهور عورات.<br />- يعملوا أفلام وتمثيليات ... وماله بس من غير لا ست تلمس راجل ولا العكس ناهيك عن اللبس البوس والذي منه ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125910/http://www.20at.com/article2.php?sid=746"

[[comments]]
order = 6
subject = "ونعم البلاد"
author = "ونعم البلد ايران التي ضربت المثل في القوة والايمان والتمسك بمبادها امام اي تيار غربي"
posted = "2006-04-30"
text = "كما انها البلد الوحيد التي تشكك في قدرة الادارة الامريكية بمنتهي القوة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125910/http://www.20at.com/article2.php?sid=746"

[[comments]]
order = 7
subject = "قاريء غلبان"
author = "صبحي"
posted = "2006-04-30"
text = "والله بحس ساعات إن القاريء والصحفي بينضحك عليهم لأن كل حاجة تحدث في بلد هي موقع نظر العامل للصراع تتحول مباشرة إلى سياسة، ويتقال اما هجوم او مدح ، وفي كل الأحوال.. الأمر بسيط جدا، والمسلمين مش محتاجين نماذج لحرية المراة، او طريقة يتعلموا بيها أزاي المراة تتعامل في المجتمع .. عندنا قواعد علينا نطبقها وكفاية بقى القارئ الغلبان اللي اتهرى أخبار بفايدة وبدون فايدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125910/http://www.20at.com/article2.php?sid=746"

[[comments]]
order = 8
subject = "نعم للحريه"
author = "zina"
posted = "2006-05-01"
text = "اكيد دى حاجة كويسة ان المراة تاخد الحق فى الحاجات دى وبالزات فى بلد زى ايران بس اكيد مش عايزين الرئيس نجادى بعد شوى نلاقيه طالع ياول دة الحجاب يتمنع زى تونس وفرنسا ودول تانيه كتير لانها كدة مش هتبا حرية ولا ايه بس انا مفتكرش انو يعمل كدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125910/http://www.20at.com/article2.php?sid=746"

