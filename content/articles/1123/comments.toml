[[comments]]
order = 17
subject = "الفساد فى مصر اصبح عنوانا لها"
author = "الشهيد"
posted = "2006-03-14"
text = "لان بلدنا المحروسه 00محكومه بالفساد فمن لم يمت حرقا فى بنى سويف مات غرقا فى البحر الاحمر ومن لم يمت بهذا او ذاك مات بانفلونزا الطيور او فى حجز قسم الشرطه او سقط من قطار السكه الحديد او مات فى الزلزال<br />لكن حاكمونا بالمباحث قاعدين وما لهمش علاقه باللى يحصل للغلابه<br />اقول<br />حسبنا الله ونعم الوكيل<br />لابد من يوم معلوم تترد فيه المظالم ابيض على كل مظلوم اسود على كل ظالم<br />لقد جاوز الظالمون المدى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132900/http://www.20at.com/article2.php?sid=382"

