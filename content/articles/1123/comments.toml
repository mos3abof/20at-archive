subject = "وأيه يعني مهم غلابه"
author = "الأصيل"
posted = "2006-02-05"
text = "يعني شئ طبيعي أنه يحصل ده ، لأني حدث أكثر من مرة العديد من الأهمال ولا يوجد من يتحمل المسئولية ، مصر البلد الوحيد الذى مهما يحدث فيها لا تجد من يتحمل المسئولية من يوم حريق القاهرة حتى الان، نفسي أعرف عندما يقصر الموظف فى عمله تشتكيه لمين لكي تأخذ حقك ، بالعكس ممكن الموظف مهما كان وضعه الوظيفي أنه ممكن بالحصانة الذى معه (( وهى اعتداء على موظف أثناء تأدية عمله)) يستغل هذه الحصانةعكس ما هو قررت من أجله<br />فى أحدى الزيارات لمصر كنت سافرت إلى مصر بالسيارة وعليها جمرك السويس فى القاهرة رجل مرور برتبت صول ، أول ما شفني بالسيارة وعرف ان السيارة جمرك السويس حضر لي وقال أني بنتي نجحت فى السنوية العامة واريد منك 20 جنية لكي أحضر لها هدية ، هل أستطيع أن أقول لا؟ بالطبع لا أستطيع لسببين لو أشتكيته للضابط التابع له أكيد الضابط عنده خبره وبيقسم معه ومن المؤكد أن يقومون بتلبيسي قضية ، والسبب الأخر أنه الصول نفسه لو رفضت له طلبه حيعطيني مخالفات كل يوم حتى لو لم أمر بالطريق الذى هو فيه ويخرب بيتي، ليه الدولة لا تضع جهاز رقابي على كل جهة حكومية ، لأني بصراحة الموضوع زاد عن حدة ووصل لدرجة القنبلة الموقوته الذى حتضيع البلد ،"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132900/http://www.20at.com/article2.php?sid=382"

