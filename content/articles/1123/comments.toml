text = "انا نفسي اقول ان لو الحادثة دي في بلد اوروبي كان زمان حصلت تحركات جامدة مش احنا وياحرام معظمهم صعايدة وفلاحين وانا بحكم عيشتي في السعودية فان الصعايدة هناك يا سواقين ياعمال فحرام علينا هما نفسهم يوفروا ليهم عيشة كريمة وحياة حلوة بس القضا جيه قضى على احلامهم والقبطان عديم الضمير اللي هرب وسابهم والحكومة محلك سر حسبي الله ونعم الوكيل وربنا يصبر اهليهم"
