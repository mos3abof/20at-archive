subject = "خبر"
author = "تيتانيك مصر.. \"إهمال\" رسمي وتقصير للطاقم"
posted = "2006-02-05"
text = "القاهرة- حمدي الحسيني- وكالات- إسلام أون لاين.نت/ 4-2-2006<br />أقارب ضحايا عبارة ( السلام 98 ) ينتظرون أنباء عن ذوويهم<br />شهد ميناء سفاجا المصري على البحر الأحمر تدفق آلاف المصريين من أقارب ضحايا حادث غرق العبارة المصرية \"السلام 98\" الذين وجهوا الاتهامات بالتقصير والإهمال عن الحادث للسلطات من جهة واتهامات بالمسئولية المباشرة لطاقم العبارة من جهة أخرى.<br />وقال محمد إبراهيم الذي كان ينتظر شقيقه وثلاثة من أقاربه على متن العبارة المنكوبة لـ\"إسلام أون لاين.نت\": إنه سيسعى لـ\"تأسيس جمعية أهلية تضم ذوي المفقودين من أجل مقاضاة السلطات المصرية عن إهمالها الذي تسبب في كارثة لا تختلف كثيرا عن مأساة تيتانيك\"، في إشارة إلى الباخرة الشهيرة التي غرقت في عام 1912 في رحلة من لندن إلى نيويورك وعلى متنها أكثر من ألفي راكب غرق غالبيتهم العظمى.<br />وحول طبيعة هذا \"الإهمال\" قال محمد إبراهيم: \"التأخر في إغاثة ركاب العبارة الذي بلغ 24 ساعة، كما أكد لنا العديد من الناجين، أدى لزيادة الضحايا. كما أن الحكومة مسئولة عن التأكد من توفر إجراءات الأمان والسلامة على متن العبارة\".<br />وأضاف بلهجة غاضبة: \"قال لي ناجون من الحادث إن عدد قوارب النجاة التي كانت على متن العبارة لم يزد على خمسة أو ستة فكيف يمكن لهذا العدد أن يكفي لإنقاذ أكثر من 1300 راكب؟ وكيف لم تتأكد السلطات من هذه الإجراءات الحيوية؟\".<br />تقصير الطاقم<br />ووجهت أصابع الاتهام بالتقصير إلى طاقم العبارة أيضا. حيث ذكر ناجون للصحفيين في ميناء سفاجا أن الطاقم واصل الإبحار بدلا من العودة إلى الميناء السعودي رغم أن العبارة بدأت تميل على جانبها بعد فترة وجيزة من الإبحار.<br />وقال نادر جلال عبد الشافي وهو ناج آخر: \"كان هناك حريق بالأسفل. وقال لنا الطاقم لا تقلقوا سنخمده. وعندما ساءت الأمور بشدة أخذ الطاقم قوارب الإنقاذ وتركونا على السفينة\".<br />وقال آخر كان يتحدث لتلفزيون \"رويترز\": \"كنا نرتدي سترات النجاة لكنهم (الطاقم) قالوا لنا إنه لا يوجد شيء وطلبوا منا خلع سترات النجاة وأخذوها.. وكان قائد العبارة أول من قفز\".<br />اشتباكات<br />ومع بدء وصول الجثث، شهدت منطقة الميناء اشتباكات بين الشرطة والأهالي الغاضبين الذين هاجموا الحواجز التي أقامتها قوات الأمن المركزي، كما رشقوا الشرطة بالحجارة بعد أن منعتهم من الوصول إلى الأرصفة البحرية للبحث عن ذويهم المفقودين نتيجة قلة المعلومات المعلنة من قبل الجهات المسئولة.<br />وذكر مراسل وكالة الأنباء الفرنسية أنه \"في الوقت الذي استشاط فيه الأهالي غضبا شوهد موظفون حكوميون يسرعون بطلاء أرصفة شوارع المدينة انتظارا لوصول الرئيس حسني مبارك لزيارة الناجين\".<br />وعلق أحد الأهالي الغاضبين: \"إنهم منهمكون في الاستعداد لزيارة الرئيس وليس لديهم وقت للاهتمام بأبنائنا\".<br />مقاضاة هيئة الفحص<br />وحول مدى خضوع العبارة الغارقة للمعايير الدولية قالت هيئة التصنيف الإيطالية \"ريجيسترو إيطاليانو نافالي\" التي فحصت العبارة: إن صلاحية العبارة للإبحار تم التأكد منها مرتين خلال العام الماضي، وأبدت في الوقت نفسه استعدادها للتعاون في التحقيق.<br />غير أن وكالة الأنباء الفرنسية ذكرت أن الهيئة الإيطالية تواجه حاليا مقاضاة في فرنسا لاتهامات بأنها فشلت في إجراء فحص لائق على الحاوية \"أريكا\" التي كانت ترفع العلم المالطي وتحطمت على الساحل الفرنسي منذ 6 أعوام.<br />كما أن العبارة \"السلام 98\" إحدى العبارات الإيطالية التي تم تزويدها بأسطح إضافية بهدف زيادة قدرة السفينة على استيعاب الركاب؛ وهو ما اعتبر بنية فوقية وفرت تعريضا أكبر للهواء وأثرت على توازن العبارة.<br />نفي حكومي<br />في المقابل نفى السفير سليمان عواد المتحدث باسم الرئاسة أي إهمال أو تباطؤ رسمي في التعامل مع الحادث قائلا: \"القوات البحرية المصرية تحركت فورا تجاه موقع الحادث بمجرد الإعلان عنه وبدأت عمليات الإنقاذ حيث تم انتشال مئات الركاب أحياء يتم علاجهم حاليا على نفقة الدولة\".<br />وانتقل الرئيس المصري بنفسه صباح السبت إلى الغردقة وقام بزيارة المصابين وأعلن في ميناء سفاجا عن صرف إعانة مالية عاجلة لجميع أسر المفقودين وللمصابين والناجين، كما طالب بإجراء تحقيق فوري في الحادث.<br />وخلال زيارته استمع مبارك لبيان من قائد غرفة العمليات المشرفة على الإنقاذ والتابعة للقوات المسلحة أوضح فيه أن \"العبارة لم تطلق رسالة استغاثة واحدة ولم يعرف أحد بها إلا بعد أن اكتشف مندوبها في السويس تأخرها فأرسلت طائرات هيلكوبتر عسكرية لمسح المسار البحري للسفينة\".<br />وأضاف: \"بعد 3 ساعات من المسح اكتشف وجود ناجين على سطح المياه فأرسلت قوارب عسكرية لانتشالهم.. إلا أن اللغز الذي يفرض نفسه لماذا لم ترسل السفينة إشارة استغاثة؟\".<br />واستجابة لطلب الرئيس بإجراء تحقيق كلف النائب العام ماهر عبد الواحد فريق محققين للاستماع لكافة الناجين لمعرفة ملابسات الحادث تمهيدا لتحديد المسئولية.<br />وكانت العبارة التي انطلقت من ميناء ضبا السعودي في طريقها لميناء سفاجا المصري تحمل 1272 راكبا معظمهم من المصريين، وطاقما مؤلفا من 100 فرد عندما فقدت الاتصال بالشاطئ في نحو الساعة العاشرة مساء الخميس 2-2-2006، واختفت بعدها من شاشات الرادار.<br />وفي أكتوبر 2005 غرقت عبارة أخرى تملكها نفس الشركة هي \"السلام 95\" في البحر الأحمر بعد اصطدامها بسفينة تجارية قبرصية، ولكن تم إنقاذ جميع الركاب تقريبا فيما عدا شخصين.<br />وفي ديسمبر 1991 غرقت العبارة \"سالم إكسبريس\" قبالة الغردقة ( 550 كم جنوب القاهرة) وعلى متنها 476 شخصا لقوا جميعا حتفهم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132900/http://www.20at.com/article2.php?sid=382"

