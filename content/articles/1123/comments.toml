subject = "المسؤول هو الشعب المصري"
author = "مسلم"
posted = "2006-02-05"
text = "إن مسؤولية هذه الفاجعة -أسأل الله العظيم أن يتغمدهم بواسع رحمته ، وأن يلهم ذويهم الصبر والسلوان - تقع على الشعب المصري ، إذ رضي بالهوان ، ورضي أن يسترق لهذا الفرعون الفاجر .<br />فيأشعب مصر ، الامر بايديكم للثأر من هذا الطاغية الاثم .<br />ضعوا ايدكم بيد كل مصلح سواء الاخوان أو كفاية أو اي مناد بالاصلاح ، وانقذوا وطنكم من براثن هذا الفاجر ، واحذروا التوريث ، فإنه يحيك المؤمرات ؛ ليجعله واقعا .<br />ثوروا ، واسقطوا الطاغوت ، وابنوا لانفسكم بلدا مؤسساتيا دستوريا ، يقوم على المحاسبة والشفافية ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132900/http://www.20at.com/article2.php?sid=382"

