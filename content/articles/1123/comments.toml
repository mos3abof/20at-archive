subject = "راحوا بلاش يا ولداه"
author = "غارق فى أحزانه"
posted = "2006-02-05"
text = "لا حول و لا قوة الا بالله .... أولا فى واحد مسطول دخل علينا و بيقول كلام وسخ واضح أنه شارب زفت مغلى و دخل غلط هنا ... المهم يا جماعة عاوز أقول حاجه السفينة سالم أكسبريس مملوكة لأل سالم و كمان السلام 98 مملوكة لنفس العائلة و الانكت من هذا و تلك هو أن أل سالم دول أصحاب الريس الروح بالروح و من أباطرة شرم الشيخ الكبار قوى قوى ... يعنى سلمى على الترام لو حصلهم حاجه و فى الاخر اللى هيروح فيها القبطان و يقولك الراجل ده كان ابن كذا و كذا و الشركة 100/100 و أصحابها لا بيشتروا سفن خردة و يقيفوها علشان تنقل ركاب غلابه بيجروا على أكل عيشهم من السعودية لمصر و العكس و لا حاجه و كل ده كذب و أفتراء و أيه يعنى لما تغرق طيب ما التايتانك بجلالة قدرها غرقت و هيه لسه بشوكها و مش عاملة حتى 10000 كم يعنى بالمختصر المفيد اللى ماتوا دول شوية فراخ و الاطفال اللى غرقوا بين أيدين أبوهم و لا أمهم دول شوية معيوز و لا فراخ من اللى بيدبحوهم بمناسبة أنفلونزا الطيور طيب و أيه يعنى عندنا 75 مليون غيرهم ربنا يديهم طولة العمر و نقصف عمرهم على أيدينا .... لا أقول إلا حسبى الله و نعم الوكيل و خللى السمك يتعشى"
archived = "2006-11-02"
