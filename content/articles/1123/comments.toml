text = "حرام عليك يا مبارك يا انت وعيالك عايزين ايه من البلد حرام كفاية خلاص بتموتونا واحد ورا التانى وعايزين مننا ايه تانى الفلوس ونهبتوها كمان احسامنا وسرقتوها بالامراض اللى زرعتوها فيها كرمتنا واهنتوها عايزين ايه تانى ربنا يولع فيك انت وعيالك ونشوف فيك يوم اسود تصيبك امراض انت وعائلتك كلها يا رب تموت ميتة ابو لهب بالجذام ويمنع عنك التوبة من اللى عملته فينا حسبنا الله ونعم الوكيل"
