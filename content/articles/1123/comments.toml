text = "حرام اللى حصل دا<br />بس انا حاسة ان الشركة دى كدابة اوى وانها اهم حاجة عندها تاخد فلوس<br />تصورو علشان السفينة غرقت هيعوضو صاحب الشركة بفلوس يالهوى كتيرة اوى<br />بس الناس الغلبانة دى ذنبها اية<br />ربنا يرحمنا بقى<br />يلا باى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132900/http://www.20at.com/article2.php?sid=382"

