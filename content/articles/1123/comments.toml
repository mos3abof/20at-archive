[[comments]]
order = 5
subject = "فيلم لا عزاء للدماء المصريه ..اكشن عاشر مره"
author = "نيفين"
posted = "2006-02-05"
text = "لان الفيلم دا فيلم رعب زى هارى بوتر كده فله كزا جزء يا جماعه<br />الجزء الاول منه كان قديم شويه و اسمه العباره سالم اكسبريس و بعده نزل الجزء التانى بتاع الطياره و بعد كده الجزء بتاع القطر و بعده قصر ثقافه بنى سويف و لان الدم المصرى ارخص دم على وجه الارض فان شاء الله الاجزاء اللى جايه هتكون كتيره<br />و الجزء دا بعنوان العباره السلام 98<br />و لانه فيلم غير عادى فله اكتر من سيتاريو مش بس سيتاريو واحد زى كل الافلام<br />السناريو الاول<br />العباره استغاظت و قوات النجاه نفضتلها<br />السناريو التانى<br />العباره لم تستغيث لان الطاقم فاشل و فشنك<br />السيناريو التالت و الاكثر اثاره<br />مفيش اصلا جهاز اغاثه فى العباره<br />ده برومو الفيلم و تقدرو تشوفوه على كل القنوات الفضائيه مجانا<br />مع تمنيات اشركه المنتجه اللى كلكو عارفنها كويس بمشاهده ممتعه اوى<br />و سمعنى احلى سلام للعباره السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132900/http://www.20at.com/article2.php?sid=382"

[[comments]]
