text = "المقال بحد ذاته جيد جدا .. واضاف عندي معلومات لم اكن اعرفها عن نظام التشغيل الجديد ..<br />ولكن لفت نظري الخطأ الفادح في عنوا المقال .. حيث ان ويندوز هو نظام التشغيل الشهير من اصدار مايكروسوفت .. بينما نظام التشغيل الصادر من جوجل هو شئ تاني خالص .. والاصح ان يكون العنوان : 10 اسرار عن نظام تشغيل جوجل ..<br />شاكرين لكم تعاونكم<br />تحياتي"
