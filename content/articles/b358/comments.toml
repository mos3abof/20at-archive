[[comments]]
order = 4
subject = "هل انت راضية .أم؟؟؟"
author = "yacine"
posted = "2006-04-21"
text = "يابنات حواء تعليقكم على العريس ومعناه اصطلاحا وتشريعالايفي بالغرض ,لماذا ؟؟<br />-لأن القرار الأول يعود اولا للوالدين ,فمنهم من يقبل ويرضى ومنهم من يعارض والكلام قياس أنتم تفهمونه أكثر..<br />-أما القرار الصائب الحق الذي ليس فيه خبث ونفاق فيعود لله وحده ,لانه هو ربكم وتذكروا قصة سيدنا ادم وحواء هو لباس لها وهي لباس له في السراء والضراء يا حبيباتي الأعزاء لكل شيء قدر<br />***ادعوا الله أن يمن عليكم بالزوج الصالح<br />هناك لؤلؤ مكنون من الرجال ولكنهم قلة ومحجوبون لايلتقيهم الا الذي هو مثلهم ,نحن الرجال لا نعرفهم ,ادعوا الله أن يؤتيكم من فضله<br />فالرجال الصالحون قليلون والنساء التي نبغاها نحن الرجال قليلات .اعاننا الله ان نلتقي بمن نحب . تقبلوا مني الحب والسلام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134712/http://www.20at.com/article2.php?sid=358"
