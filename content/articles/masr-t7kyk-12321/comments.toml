posted = "2009-06-09"
text = "فكرة تافهة من شخص … ومبن ماجد إبراهيم دا أساسا أنا أول مرة أسمع بالإسم دا والفكرة تافهة لأننا يا استاذ في مجتمع زكوري لا يعترف بالمرأة من الاساس ورأيي دا مش رجعية وتخلف لأنه واقع فعلي موجود في مصر شوف كام بنت وسيدة بيتحرش بيهم الرجل يوميا في الشغل والمواصلات والشارع .. ولا بلاش أقولك حاجة أحلي تعالي نقعد الرجالة ترضع في البيت وننزل النسوان علي رأيكم يشتغغلوا ياتري إيه اللي هيحصل ساعتها فوضي وسوء إدارة وتفاهة وياسلام بقي تبقي رئيسة الوزرا حامل وعاوزة اجازة وضع ونشغل الستات علي عربيات النقل أو تباعين علي الميكروباصات اللي للبنات وبس اللي الذكي اللي أنت عملته مسئول دا بيقترحها ياتري هو ساعتها هيقعد في بيتهم ومراته تنزل تجيب له المم طب ما تبص لعربيات المترو التانية اللي النسوان بيقفوا فيها بالرغم من أن عربيات النسوان المخصصة ليهم فاضية وسبحان الله يا مؤمن تموت وتقف في الزحمة عشان هيا ست لامؤاخذة"
archived = "2009-06-11"
capture_url = "https://web.archive.org/web/20090611132053/http://www.20at.com:80/masr/t7kyk/12321-2009-06-09-11-20-12.html"
