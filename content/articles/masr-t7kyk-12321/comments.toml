posted = "2009-06-09"
text = "ياريت بجد القائمين علي الموقع الجيد دا يبصوا لنوعية المواضيع اللي بتتعرض جميل أن الموقع فكرته شبابية لكن بالشكل اللي يستخف بعقولنا دا أسمحولي يعني تبقوا ساعتها ناس مبتفكرش ةوأي حاجه تتطرح والسلام وطظ في عقلية اللي بيقرأ أو بيتابع وأرجو أني مكونس حد لامؤاخذة بس دا رأيي وياريت الصحفيين اللي مسئولين عن الموقع يهتموا بالفكرة أكتر من الحشو وإلا إيه الفرق بينكم وبين الجرائد اللي بتحشي كلام لمجرد أنها تلحق تطبع دون النظر للقاريء .. وبعدين يعيطوا لما القاريء يبطل يشتري جرائد والجرنال مبيعاته تقل لأنه فقد مصداقيته في الشارع .. رجاء مرة أخري من اللي بيشتغلوا أنهم يراعوا عقولنا وميستخفوش بيها دا مجرد رأي ولكم مطلق الحرية في أنكم تبقوا شبه الجرائد ولا ناس فعلا عاوزة تتميز زي ما قولتوا في الخبر اللي أنتم عاملينة بخصوص المجلة اللي علي ما أتذكر تكلم فيه أثنان من المسئولين علي الموقع رجاء أخير .. رأفة بعقولنا وكفاية حشو كلام في الفاضي لأن المحرر أسلوبة حلو لكن الفكرة سوري يعني لامؤاخذة .. مجرد رأي"
archived = "2009-06-11"
capture_url = "https://web.archive.org/web/20090611132053/http://www.20at.com:80/masr/t7kyk/12321-2009-06-09-11-20-12.html"

