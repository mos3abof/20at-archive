author = "الجنس الناعم"
posted = "2009-06-09"
text = "هيافات الحزب اوطنى اضافت 45 مقعد للسيدات فى مجلس الموافقات علشان الغرب يرضى عنا<br />فى الغرب تقاليد وهنا تقاليد تانية<br />فى الغرب زواج بعقد شراكة كل واحد يدفع النصف فى البيت وكل واحد يطبخ يوم وكل واحد يغشل هدومة بنفسة والمراة تشترى ملابسها وذهبها من دخلها الخاص ولا علاقة للزوج<br />اما عندنا فالوضع مختلف<br />الزوج يشتغل ويتعب ويقبض راتب ويسلمة لزوجتة على داير المليم وهى بتعطية المصروف اليومى ومكرمة فى بيتها<br />طبيب مصرى كان يعمل فى مستشفى فى باريس وجراح متخصص وعملة من 8 صباحا الى 8 مساءا ومعة زميلة طبيبة فرنسية تعمل معة من 8 صباحا الى 8 مساءا<br />سالتة يوما - اين تعمل زوجتك ؟<br />فقال لها - زوجتى لا تعمل فهى تجلس فى البيت لرعاية البيت والاطفال<br />سالتة - من يشترى لها الملابس والحلى ويدفع ايجار البيت وتكاليف الطعام ومدارس الاولاد وكل المصاريف<br />قال لها انا<br />سالتة - بدون مقابل<br />قال لها نعم - تلك عادتنا وديننا الرجال قوامين على النساء يعنى يصرفوا عليهم من الالف الى الياء وان كان مقتدر يحضر لها خادمة ايضا<br />قالت لة تزوجنى فورا وانا مستعدة اقعد فى البيت<br />حافظوا على عادتنا ورقة ونعومة سيداتنا<br />حافظوا على القوارير"
archived = "2009-06-11"
