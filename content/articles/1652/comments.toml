[[comments]]
order = 1
subject = "صاحبنا العزيز صاحب تعليق \"بونجور\""
author = "رحبا بك سواء كنت شابا او شابة ..في موقعك عشرينات"
text = "ولا تعتبر نفسك ضيفا فقط بل انت جزء من منا..<br />ونرجو فقط لو لديك رغبة في الكتابة عما تراه إيجابيا في المغرب فإننا سنكون مسرورين جداااااااا<br />وسنسعى لنشر مساهمتك بالموقع.<br />وللاشارة فالموقع لايمثل دولة بعينها ولايسعى الى تشويه الدول وإنما نحن هنا كلنا مسؤولون على ابراز ما لدينا من مساوي وإيجابيات على حد سواء ..<br />فليس موضوعيا أن نتناول فقط السلبيات كما أنه ليس موضوعيا أيضا أن نتناول فقط المظاهر الإيجابية..<br />ويمكنك أن ترجع إلى ارشيف الموضوعات وستجد عدة مواضيع تتحدث عن تقاليد وعادات بلدنا ..<br />المهم لا اريد أن أطيل لكن لاحظت أن هناك نبرة ما في تعليقات بعض المغاربة وارجو أن تفهموا أننا لاننوي الإساءة بأحد وإنما نورد حقائق موجودة بالفعل والسكوت عنها لايخدم جديتنا كمنبر إعلامي عالمي.<br />مع وافر الشكر والتقدير<br />أبو نور الهدى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151355/http://www.20at.com/article.php?sid=1552"

