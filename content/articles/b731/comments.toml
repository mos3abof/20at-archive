posted = "2006-04-28"
text = "مافيش غيرهم اليهودالي عملوها<br />ولا عندكم راي تاني؟؟؟<br />بلاش نضحك عبعض اديهم بيلعبو بينا ويحركونا زي ماهم عايزين واكيد هيحطوها بالمسلمين ويقولوا عنا ارهابيين<br />ربنا هينتقم منهم فيوم<br />يااااااااااارب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142555/http://www.20at.com/article2.php?sid=731"

