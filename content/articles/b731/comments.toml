subject = "يجب ان تعرفوا الارهابين يا مصر ولا تشجعوا الارهاب"
author = "ارجوان"
posted = "2006-04-25"
text = "كل الاخوة المصريين يسمون التفجيرات الي تصير بمصر ارهاب و الي اتصير ب العراق مقاومة وبيشجعوا عليهه وخاصة مسولينهم اعرفوا الارهاب ومين يستهدف الارهاب و الي اصير بمصر و العراق و الاردن و السعودية هوة ارهاب الاسلام اليهوديلانهم تركوا اليهود يذهبون وفجروا"
archived = "2006-11-02"
