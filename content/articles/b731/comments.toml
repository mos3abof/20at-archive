[[comments]]
order = 7
subject = "والله انتو اللى بتدحكو على نفسكم"
author = "mimoooooooo"
posted = "2006-07-14"
text = "والله انتو اللى بتدحكو على نفسكم يا مسلمين انا زيكم بردو مسلم بس الحكايه ان احنا مش عوزين نسدق ان الاسلام بيدعونا للئرهاب واؤكد كلامى ب ارهبوهم التى وردت فى نص قرئانى وانتو مش عوزين تسدقو لا بس سدقو احنا اللى بنبوظ نفسينا بنفسينا<br />طيب وعمليات الكنيسه بتاعت الاسكندريه دى بردو اسرئيل ولا مجنون زى ما قالو هه اكيد ارهابى بردوبس كان حالق دقنو علشان ميعرفهوش ههههههههههههه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142555/http://www.20at.com/article2.php?sid=731"
