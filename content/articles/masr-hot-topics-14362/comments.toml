[[comments]]
order = 6
subject = ""
author = "الصحافة هى فين"
posted = "2009-12-13"
text = "فى بداية الثورة - الثورة عملت جريدة ناطقة باسمها اسمها جريدة الجمهورية الموجودة حاليا<br />والغريب ان رئيسها كان المرحوم البكباشى انور السادات<br />والبكباشى انور السادات متخرج من مدرسة الحربية وكان بيكتب مقالات ورئيس التحرير ومسئول عن الجريدة ولم تكن هناك كلية اعلام<br />فاذا قفزت حاليا الى الوضع الموجود<br />كل رؤساء التحرير اما خريجى اداب او حقوق او اولاد صحافيون سابقون ورث ابنائهم مهنتهم بالعافية<br />المفروض نلغى كليات الصحافة والاعلام وكليات السياسة والاقتصاد لان كل السياسيون لواءات اركان حرب وكل المحافظون ورؤساء الشركات لواؤات اركان حرب<br />كل الموجود على الساحة كلام فارغ<br />والذى دمر الصحافة هو الحاج انور السادات لما ابتدأ بالجمهورية"
archived = "2009-12-14"
capture_url = "https://web.archive.org/web/20091214030633/http://www.20at.com:80/masr/hot-topics/14362-2009-12-12-16-06-36.html"
