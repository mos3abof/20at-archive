author = "يهمنا سلم النقابة"
posted = "2009-12-12"
text = "احنا ما يهمناش النقابة من جوة<br />يهمنا الاحتجاجات اللى بتحصل على سلم النقابة والمواقف الرافضة التى تعلن من على السلم<br />والشباب المعارضين امثال محمد عبد القدوس والوطنيين الغيورين من الصحافيين"
archived = "2009-12-14"
capture_url = "https://web.archive.org/web/20091214030633/http://www.20at.com:80/masr/hot-topics/14362-2009-12-12-16-06-36.html"

