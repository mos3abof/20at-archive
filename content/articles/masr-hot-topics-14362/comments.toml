author = "ايمن"
posted = "2009-12-12"
text = "متهيألي لو مكرم نجح مفيش اي حاجة جديدة حتحصل وحتفضل النقابة زي ما هي وزي حاجات كتير في البلد مليانة اخطاء وعيوب وروتين ومش حتتغير خااالص<br />يعني حتلاقي كل الناس اللي عاوزين مصلحتهم ومش عاوزين حد من الشباب يطلع، حتلاقيهم هما اللي ماسكين النقابة ومش يدونا فرصة ناخد حقوقنا<br />بس برده ضياء مش في ايده قوة ولا سلطة كبيرة كل اللي يملكه حب الناس انا عارف ان ده شيء قوي وكويس ..<br />يا ررب ضياء يكسب"
archived = "2009-12-14"
capture_url = "https://web.archive.org/web/20091214030633/http://www.20at.com:80/masr/hot-topics/14362-2009-12-12-16-06-36.html"

