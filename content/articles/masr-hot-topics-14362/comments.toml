author = "ثورة في النقابة"
posted = "2009-12-12"
text = "اتمنى بأن يكون هناك ثورة في نقابة الصحافيين يقوم بها خريجي كلية الصحافة والاعلام ويطالبوا بان تكون الصحافة مهنة تخصصية تماما وعلى سبيل المثال وليس الحصر كالمحاماه<br />ينفع اي خريج جامعة يشتغل محامي<br />ارجو<br />ان تقتصر مهنة الصحفي والاعلامي على خريجي كليات الصحافة والاعلام<br />لان كلية الصحافة والاعلام قاعدين على الارصفة مش لاقيين شغل لان حقهم واخده خريجي الكليات الاخرى<br />وشكرا<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـ<br />مع تحيات مش ححبك"
archived = "2009-12-14"
capture_url = "https://web.archive.org/web/20091214030633/http://www.20at.com:80/masr/hot-topics/14362-2009-12-12-16-06-36.html"

[[comments]]
order = 1
subject = ""
author = "جيمي"
posted = "2009-12-12"
text = "موافقك جداً يا مزيكا<br />وممكن كمان تاخد جريدة الدستور كمثل<br />معاملة زي الزفت .. ومرتبات ماتكفيش تعيش نملة وجوزها ، وكمان كان فيه بعض الأشخاص بيشتموا الصحفيين بألفاظ أبيحة .. وليا أصحابى كانوا فيها وكنت بسألهم على أيه اللى مصبرهم على كدة وكان جوابهم أنهم مستحملين فقط علشان يدخلوا النقابة وبعد كدة الوضع هيتظبط !!!!<br />ونفسي فعلاً يكون فيه كارنيه نقابى للصحفيين الأكترونيين ، بما انه صحفي زيه زي أحسن صحفي ورقى .. والفرق في الوسيلة بس .. بل انه في أحيان كثيرة بيكون احسن من الصحفي الورقى لأن طبيعة شغل النت عايزة سرعة نقل الخبر وده اللى بيعمله الألكترونى …"
archived = "2009-12-14"
capture_url = "https://web.archive.org/web/20091214030633/http://www.20at.com:80/masr/hot-topics/14362-2009-12-12-16-06-36.html"

[[comments]]
order = 2
subject = ""
author = "mazzika"
posted = "2009-12-12"
text = "اكتر حاجة بتضايقني في نقابة الصحفييين انها مش بتعترف بصحفيين المواقع الالكترونية ومش ليهم الحق انهم يكونوا اعضاء فيها .. طب ليه هما ناقصين ايد ولا رجل؟فيه مننا ناس كتير احسن من اللي بيشتغلوا في الصحافة الورقية<br />ولا هو عشان الكبار مش بيعرفوا يستخدموا النت ويدخلوا على المواقع وكل اللي اتعلموه في حياتهم هو قراية الجورنال وخلاص<br />تاني حاجة ليه خريج قسم الصحافة ما يبقاش عضو في النقابة اول ما يتخرج او على الاقل يبقى شغال في مكان ومش شرط يبقى متعين عشان ياخد الكارنيه هما كده بيخلوا اصحاب الصحف يتحكموا في الشباب ويذلوهم ، يعني مثلا صحفيين زي بتوعوا اليوم السابع بقالهم سنة مفحوتين شغل ولسه ما ليهومشي نقابة صعبانين عليا والله"
archived = "2009-12-14"
capture_url = "https://web.archive.org/web/20091214030633/http://www.20at.com:80/masr/hot-topics/14362-2009-12-12-16-06-36.html"

[[comments]]
