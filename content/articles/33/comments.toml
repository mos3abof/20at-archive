[[comments]]
order = 1
subject = "اقتراح"
text = "انا شايف ان الزوج المفروض وهوا بيأسس شقته يزود غرفه علشان تكون قهوة.والزوجه تشارك فى تأسيسها.ممكن تشترى الشيشة وباقى المسائل.المهم ان القهوة فى البيت هتحل مشاكل كتيرة وربنا يكرمك يا رب<br />بس بجد الموضوع لذيذ.ممكن واحد حلبه قبل ما امشى"
archived = "2004-04-22"
capture_url = "https://web.archive.org/web/20040422182901/http://www.20at.com:80/article.php?sid=40"
