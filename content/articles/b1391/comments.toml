subject = "الحمد لله على نعمة الأمن والإيمان"
author = "sami"
posted = "2006-10-31"
text = "انا شاب جزائري ، طالب إعلام على وشك التخرج وأدير جمعية شبانية جزائرية<br />عشت كغيري من الشباب الجزائري سنوات صعبة خاصة ان المدينة التي تربيت فيها كانت من أخطر المناطق في الجزائر من حيث انعدام الأمن والاعتداءات الإرهابية المتكررة<br />منذ حوالي 5 سنوات استقرت الأمور كثيرا واصبحنا ننعم بقسط كبير من الامن<br />تغيرت عادات الجزائريين بسبب هذا الاستقرار واصبحوا يتنقلون ليلا ويسهرون ويتزاوزون ويسافرون في أرجاء بلدهم بعد ان كانت كل الطرق تؤدي إما إلى هلاك محتوم أو إلى جحيم خوف وترقب يرافقانك طيلة الطريق ودام هذا الوضع أكثر من 12 سنة حتى اصبح صفحة في تاريخه الجزائر تدعى : العشرية السوداء<br />طيلة شهر رمضان الماضي وانا أفكر في نشر رسائل بالاس أم اس وعبر الإيميلات والجرائد<br />مفاده أن الله تعالى يقول :<br />'' لئن شكرتم لازيدنكم ولإن كفرتمولئن كفرتم إن عذابي لشديد'' إبراهيم آية7<br />ويقول تعالى<br />\"ذلك أن الله لم يكن مغيرا نعمة أنعمها على قوم حتى يغيروا ما بأنفسهم\".<br />على الجزائريين جميعا أن لا يتوقفو عن شكر الله بنعمة الأمن والسلام التي نعمنا بها منذ 5 سنوات حتى لا تزول النعمة لا قدر الله<br />وشكر النعمة يجب أن يكون باللسان وبالقلب وبالجوارح<br />فعلينا أن نكثر من قول الحمد لله -باللسان<br />وعلينا أن نستحضر نعم الله علينا ونجعها صوب أعيننا دوما- بالقلب<br />وعلينا أن نستعمل النعمة في مايرضي ربنا لا فيما يسخطه فغذا كنا نستطيع أن نخرج من بيوتنا ونسهر ونتجول فمن الأحسن لنا أن يكون كل ذلك في سبيل الله وليس في سهرات الرقص والمجون وجولات المعاصي وخرجات المنخذي والمتخذات أخدان<br />وما هذه إلا أحداث عابرة ربما ينبهنا الله بها لهذه النعم وبأننا مقصرون في شكره عليها وفي استخدامها في طاعته<br />اختم كلامي بإعلان الحب في الله لكل الشباب الجزائري والامهات الجزائريات والىباء الجزائريين الرائعين الذين رايتهم في احلك الضروف يفكرون في بعضهم ويحبون بلدهم ويتحدون الخوف ويرجون الرحمة والتخفيف من الله<br />كانت الدعوات لله تذاع في التلفزيون كلما استجوب احد المواطنين الجزائريين فكان يختم كلامه بقول :<br />نطلبو ربي يطفي علينا هذي الجمرة<br />واقول لغخوتي الشباب غن مانسمعه من تعليقات سلبية من بعضنا هي من خوفنا وقلقنا على بلدنا لكننا نحبها نحبها نحبها لأنها هي نفسها نعمة من الله فهي تذكرنا به سبحانه وتجعلنا دوما مرتبطين به"
archived = "2006-11-02"
