[[comments]]
order = 0
subject = "قشعريرة الموت"
author = "أكرم"
posted = "2006-02-06"
text = "انها النهاية و لا شك قشعريرة الموت تنبت داخلنا دون ان ندري و هذه الانفاس المعدودة انى لها ان تعود اذا خرجت<br />اننا نحب الحياة لاننا نعلمها و لا نحب الموت لاننا نجهله لاننا نخاف لاننا جبناء لاننا في الحقيقة اموات و لسنا احياء (و لا كيمياء و لا فيزياء )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113855/http://www.20at.com/article2.php?sid=396"

[[comments]]
order = 1
subject = "لو كان بيدى"
author = "أرجوان"
posted = "2006-02-06"
text = "على صغر سنى حاسه انى مريت بمصائب ما مرش بها ناس شعرهم شاب...لما بفكر فى الانتحار بيكون فى لحظة ذرة الهم و الاحزان و لكنى عمرى ما هاقدم عليها حتى لو هاتقطع...لانى عارفه انى كده اهموت كافره يعنى جهنم...يعنى لا دنيتى و لا اخرتى,...و كنت بانتحر عشان استريح كده موش هاستريح لا...هاروح لعذاب اكبر انا موش هاقدر اصلا عليه.<br />انا الى بفكر فيه...ان حد يموتنى<br />بس مايهونش عليا ادخل حد السجن بسببى.<br />و فى الاخر لازم اقول لنفسى و اقولكم...ان سيدنا محمد قال فى ما معناه..لا يتمنى احدكم الموت و ان كان ولا بد فاعل فليقل..اللهم امتنى لو كان الموت خيرا لى و احينا ما كانت الحياة خير لى.<br />ربنا يريح قلب شباب المسلمين و يبعد عنهم الافكار و الهواجس و يحصنهم و يفرح قلبهم...بس نصيحه ليا و ليكم<br />قربوا من ربنا اكتر يا شباب هو المجلئ الوحيد.<br />سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113855/http://www.20at.com/article2.php?sid=396"

[[comments]]
order = 2
subject = "اتمنى و لكن"
author = "نيفين"
posted = "2006-02-07"
text = "اتمنى اموت و لكن ليس الان<br />ساطلبها من الله بقلب صادق لان الواحد بصراحه يا جماعه مش متاكده ان حستانى دلوقتى تدخلنى الجنه و يوم ما اتاكد من دا هطلبها من ربنا بقلب جامد لان الظلم اللى اتعرضت يه فوق احتمال البشر<br />يا رب طلعنا من الدنيا دى على خير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113855/http://www.20at.com/article2.php?sid=396"

