[[comments]]
order = 5
subject = "الحياه فيها ليسه حلو"
author = "الصقر الاحمر"
posted = "2006-08-08"
text = "يا جماعه انا شايف ان الكل هنا بيتمنه الموت مع ان فى ليسه حاجات حلوه فى الحياه يعنى هو كل الى يقبله حاجه صعبه او اتخناء من حياته يتمنه الموت مهو الكل هيموت بس لازم تعيش حياتك الاول مش تتمنه الموت عشان ايه تتمنه الموت عشان اويك ولا عشان مش لاقى شغول ولا ........الخ<br />الحياه حلوه وجميله يمكن ليسه مفيش حد ليسه عاشها بس الصبر حلو ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113855/http://www.20at.com/article2.php?sid=396"

[[comments]]
order = 6
subject = "حرام والله"
author = "الصقر الاحمر"
posted = "2006-08-08"
text = "والله حرام<br />واحده عشان مش لاقى شغول وحبيبها سبها اتمنت الانتحار والتانى عشان ابوه توفى والتالت عاشن اتخناء من الحياه هههههههه<br />يعنى لو حبيى سبنى اموت نفسى عشانه<br />لا حول الله ناس عجيبه والله<br />ازاى تتمنه الموت مع انك ليسه شباب والحياه ادامك طويله<br />وانت اول حاجه متعرفش نصيبك فين ولا مين هو نصيبك او شريك حياتك<br />وليسه الحياه ماشى مش هتقف بس انت مفكرتيش لو انتحارت جزاك ايه عند الله<br />ولا ده كلام وخلاص<br />اتقو الله<br />واستغفروه عشان يتوب عليكم ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113855/http://www.20at.com/article2.php?sid=396"
