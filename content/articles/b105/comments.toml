order = 0
subject = "عندك حق"
author = "أمة الله"
posted = "2005-12-17"
text = "بسم الله الرحمن الرحيم<br />قرأت مقالتك وكأني أراك وأنتي في المسجد فلقد قابلت بعض من هذة النماذج وأنا أيضا أعطي بعض الدروس الدينية في بعض المساجد في فيينا ولي أحد الزميلات التي تتبع هذا المنهج من الترهيب المستمر حتي إني أنا شخصيا أشعر وأنا أستمع إليها في الدرس إنه لا يوجد في أمل وإن أنا ببساطة لازم أروح أولع في نفسي عشان ربنا يرضي عني ولكن أنا أفضل دائما الموارنة بين الترهيب والترغيب وإن الواحد لازم يكون بشوش حتي لو كان موضوع الدرس شديد زي عذاب القبر مثلا وأنا مش فاهمة الناس دي جابت الاسلوب ده منين إذا كان النبي صلي الله عليه وسلم شخصياً عمره ما كان بيكشر في وش حد علي العموم ربنا يهدينا ويهديهم ويرزقنا فاهمة الاسلام صح عشان الحكاية مش ناقصة<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123139/http://www.20at.com/article2.php?sid=105"

[[comments]]
order = 1
subject = "موضوع مهم"
author = "Dabdoob"
posted = "2005-12-18"
text = "الموضوع مهم جدا وانا لاقيت نماذج كثيرة مشابهة لهذا النموذج للاسف ولشيوخ كبار ايضا !!!<br />واذكر انني سمعت مرة درسا مسجلا لشيخ شهير اصابني بالاكتئاب لعدة ايام لان الشيخ كان يتحدث عن اننا لابد ان نتجهم ويتسائل مستنكرا (لماذا تضحكون؟؟ والموت قادم لا محالة) وكانني اذ علمت ان الموت قادم لا محالة فلابد ان اقضي ليلي ونهاري ابكي في انتظاره !!1<br />ثم انني حقا لا اعرف ما هي حكاية الصوت العالي السائد والمبالغ فيه بين الائمة والوعاظ. سمعت من احد اصدقائي ان هذا سنة النبي ولكنني لا اعرف دقة هذا !!!<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123139/http://www.20at.com/article2.php?sid=105"

[[comments]]
order = 2
subject = "الجنة و النار"
author = "نجوان"
posted = "2005-12-18"
text = "الموضوع رائع فعلا يا سارة ...لكن في المقابل انا حضرت درس في المسجد من فترة قريبة ،و كانت الداعية منتقبة ,و طبعا عرفت ان موضوع الدرس عن الموت او العذاب او شبيهه..لكن الغريب ان هذه السيدة الفاضلة حكت لنا عن يوم القيامة و عن الجنة ونعيمها و الكلمة التي ظلت عالقة في ذهني الى الآن \"كلنا هندخل الجنة..ولكن هنتقاسم فيها الدرجات بإذن الله و رحمته ولكن يغركم كرم الله و رحمته واعملوا للفردوس الأعلى من الجنة و اسألوا الله رفقة الحبيب المصطفى\"كمان قالت \"الكفار و المشركين هيشمتوا في المؤمنين العصاة اللي دخلو النار و يقولوا لهم...كنا نشرك بالله ولا نصلي ولا نصومودخلنا النار و انتم امنتم بالله وصليتم و صمتم ووو..و دخلتم معنا النار..فيأبى الله ان يعذب المؤمنون فيخرجهم برحمته من النار \"<br />بس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123139/http://www.20at.com/article2.php?sid=105"

