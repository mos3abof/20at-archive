[[comments]]
order = 8
subject = "مش كلهم"
author = "aliaa"
posted = "2005-12-25"
text = "السلام عليكم ورحمة الله وبركاته :<br />أشكرك على هذا الموضوع الهام وأود الإشارة إلى نقطة هامة أنني أذهب إلى مسجد لحفظ القرآن الكريم والمحفظة هي إحدى المنقبات المتدينات ولا أستطيع أن أصف لكي كم السماحة والنور اللذين يعلوان وجه هذه المرأة - بارك الله فيها - وقد شجعت جميع عضوات الحلقة على الحفظ والإجتهاد والكل أحبها جدا جدا ويسارعن إليها في كل درس ليسلمن عليها ويدعون لها ولأولادها فهي دائما تعطينا الأمل وبشوشة جدا جدا وأصبحت قدوة لكثير منا في أخلاقها وتدينها وأسلوبها البسيط - بارك الله فيها - وزاد من أمثالها بإذن الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123139/http://www.20at.com/article2.php?sid=105"

[[comments]]
order = 9
subject = "ده بالنسبه ليكي"
author = "عبدالله مفتاح"
posted = "2005-12-29"
text = "على فكرة مش كل الناس بتكره الاسلوب ده انا ليا اصحاب كتير بيحبوا الاسلوب ده جدا وبيحسوا انه الوحيد القادر على انه ياثر فيهم<br />اللي ميعجبوش الاسلوب ميحضرهوش مش يكتب مقال روح النقد تبقى خارجه منه اللي ميعجبوش ميحضروش يدور على غيره لكن يبعد عن النقد<br />ايه اسهل حاجه ننتقد العلماء حاجه تزعل والله حاجه تزعل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123139/http://www.20at.com/article2.php?sid=105"

[[comments]]
order = 10
subject = "لاتقنطي"
author = "علي العبيد"
posted = "2006-05-25"
text = "جزاك الله خيرا على هذا المقال فقد اثر فيني<br />ولكن يااختاه اعلمي ان الله سبحانه وتعالى يحب التوابين ويحب المتطهرين ، وما تقرب الي عبدبي بشى احب الي مما افترضعه اليه ، ومازال عبدي يتقرب الي بالنوافل حتى احبه ، واذا احببته كنت سمع الذي يسمع به ويده التي يبطش بها ورجله التي يمشي بها ولان سالني لاحطينه ولان استعاذني لاعيذنه ، قالله سبحانه وتعالي قريب من التائبين (قل ياعبادي الذي اسرفوا على انفسهم لاتقنطوا من رحمه الله) فالتوبة التوبة والرجعة الرجعة وديننا يحب الوسطية لاافراط ولا تفريط .<br />اللهم تب علينا وعلى جميع المسلمين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123139/http://www.20at.com/article2.php?sid=105"

