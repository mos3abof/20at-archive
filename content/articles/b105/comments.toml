text = "في الحي عندنا اكثر من مسجد كنت انا وصديق لي بنختلف مين اما المسجد الاحسن<br />كنت انا احب الهادئ الي بيخطب الجمعه من غير انفعال<br />وصاحبي كان بينام مع الامام ده<br />بينما كان بيحب امام تاني بيخطب بنفعال اماانا كنت بتدايق من صوته العالي<br />المسئلة ازواق"
