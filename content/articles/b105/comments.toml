[[comments]]
order = 6
subject = "عندك حق"
author = "عندك حق و الله لازم يكون فيه جهة تصرح للواعظين أن يعظوا أو لا فأنا أيضا تعرضت لموقف مشابه. فعندنا في معهد تحفيظ القرآن واعظة شبيهة بمن تتكلمين عنها. كل كلامها عن الترهيب و النفاق و الشرك حتي اني بخرج من الدرس بتاعها بحس أن الناس كلهم مشركين أو منافقين و العياذ بالله و بتحسسني بجد اني لازم أروح أولع في نفسي و اني مافيش مني فايدة و اني بتاعت دنيا . لدرجة ان اللى بتحاول تستأذن لما الدرس يطول و تقولها و لادي مش معاهم مفتاح و مش هيلاقوا حد يفتحلهم تقولها انتي الدنيا شاغلاكي و ان الشيطان هو اللي بيخليها تعمل كده و ان ولادها دول لن يغنوا عنها من الله شيئا يوم القيامة و اللي يحاول يفهمها ان دول أمانة في رقبتنا و ان تربيتهم برده شئ هيحاسبنا عنه ربنا تقول يعني هي جت على الوقت بتاع الدرس و تقولى كده مش ده لو كان مشوار للدنيا كنتى هتتصرفي و تحسس الواحدة انها عاصية و لازم تتوب علشان عاوزة تروح تلحق ولادها."
posted = "2005-12-21"
text = "المشكلة بقي انها فرضت علينا بجانب حفظ القرآن علوم شرعية و اجبارى و طبعا بنفس الطريقة و المنهج بتاعها و طبعا هي اللى بتدرس و حاولنا كتير نقولها اننا بناخد مواد شرعية في أماكن تانية و ان كده هيسببلنا تشتيت تقول اللى مش عاجبه يروح أي معهد تاني.<br />يا جماعة الدعوة إلى الله شئ جميل طبعا و كل حاجة لكن مش كل الناس عندها الملكات بتاعته و بعدين الدعوة مش لازم تكون بالوعظ يعني اللى مش حاسة في نفسها الإمكانيات و القدرة على تحبيب الناس في الدين تدعو إلى الله لكن بشكل تاني عن طريق مثلا توزيع الأشرطة الدينية للشيوخ المعتدلين . المشاركة في دور الأيتام و عيرها كثير لكن ماتوعظش الناس بالعافية.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123139/http://www.20at.com/article2.php?sid=105"

