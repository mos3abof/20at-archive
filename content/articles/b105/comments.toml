[[comments]]
order = 12
subject = "سؤال"
author = "سائل"
posted = "2006-06-24"
text = "السؤال: الى متى سنتبارى في حضور دروس ( دينية ) نستمع اليها من كل من هب ودب ؟ اليس في حياتناأصلا شيء نعمله الى هدر الوقت ؟ اما آن الاوان لنعمل ؟ كل المجتمعات تعمل وتقدم أشياء جديدة للانسانية الا مجتمعاتنا الاسلامية التي لاهم لها سوى القعود في الجوامع والاستماع الى ( الوعاظ ) وتوجيه الاسئلة الى من يسمي نفسه مفتي , افليس المفروض أن نعمل لدنيانا أيضا ؟ ماذا نقدم اليوم للبشرية ؟ تصوروا لو نقاطع - مثلا - كل المنتجات والبضائع والاكتشافات والاختراعات التي تقدمها الدول الحضارية للانسانية فماذا سيتبقى لنا ؟ بضع جوامع وبضع دكاكين والكثير من الابتهالات والادعية . الحمد لله ان باقي الشعوب ليست مثلنا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123139/http://www.20at.com/article2.php?sid=105"

