posted = "2006-07-11"
text = "بسم الله والصلاة والسلام على رسول الله صلى الله عليه وسلم<br />قال رسول الله في حديث معناه: ان هذا العلم دين فانضر عمن تاخذ دينك<br />فلهذل يا أختي الأولى بك ان تعرفي لمن ستنصيتين في الدروس قبل الذهاب إلى الدرس<br />وفقك الله على مجهودك الرائع في تنمية إيمانك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123139/http://www.20at.com/article2.php?sid=105"

