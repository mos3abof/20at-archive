text = "أيها الأرعن .. الذي أنت أغبى من الغباء نفسه .. أيها ال[ *** ] المنيك الداعر العاهر الأمريكي العميل الجاسوس المرتزقة ..<br />ولك يا جلب يابن الجلب .. من متى طالعك لسان تجكي بيه ياحيوان !!<br />فعلاً، مثل ماقال رئيسنا العراقي الله يرحمه صدام \" صــــــــــ العرب ــــــــــقر \" :<br />لا قرت أعين الجبناء يوما .. وإلى جهنم وبئس المصير .. وتحيا العراق حرة أبية عظيمة .. الله أكبر .. الله أكبر .. الله أكبر"
