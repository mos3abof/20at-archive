text = "نمت باكرا، استعدادا ليوم عظيم.. إنه يوم في الفلوجة. جاءني السائق مصطفى مبكرا، فخرجت، على عجل، دون إفطار. شغلني غموض ما ينتظرني وشوقي له عن كل شيء سواه. وفي الطريق كنت أسجل كل ما أرى وكل ما أسمع.. أطراف بغداد، على طريق الفلوجة، معظمها مدمر.. مصانع ومعامل وشركات تابعة للدولة، ومعسكرات سابقة للجيش العراقي، دمرها القصف الأمريكي بعنف، وأتم الدمار ما بات يعرف في بغداد اليوم باسم \"الحواسم\"، وهم اللصوص والمجرمون والغوغاء، الذين اجتاحوا بغداد كالجراد، عقب سقوطها في أيدي قوات الاحتلال، وغياب الدولة والأمن فيها.<br />أطلال خربة بعد عمار.. آثار القنابل والرصاص في الطرقات المحفرة.. بنايات متهاوية، بعضها سويّ بالأرض، وبعضها ظل نصفه أو ربعه واقف وجزؤه الآخر انهار.. مصانع ومخازن لا تزال بعض بقايا أكياس الحنطة والدقيق مكدسة فيها بشكل عشوائي.. حديد متناثر.. حجر أو طوب صناعي مكسور.. زجاج مبعثر في كل اتجاه وفي كل مكان. أوساخ تنتشر في كل مكان.. وأعشاب متوحشة تزحف في كل اتجاه."
archived = "2004-05-05"
capture_url = "https://web.archive.org/web/20040505110451/http://www.20at.com:80/article.php?sid=99"

