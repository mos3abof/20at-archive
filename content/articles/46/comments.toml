subject = "اعتذر لكِ وأرفع رأسي بكِ عاليا يا حبيبتي"
text = "اعتذر لكِ وأرفع رأسي بكِ عاليا يا حبيبتي:<br />سامحيني يامدينتي ..يا مدينة الخيول والصهيل والرماح،<br />سامحيني أن لم تقبل دماي في هذه اللحظات ترابك الشريف وتراب كل أخواتك الصابرات المناضلات في هذه الساعات العصيبة.<br />أمريكا جاءت لتجلب لنا الديموقراطية فجلبت لنا الرعب والدمار والقتل الوحشي!!<br />ديموقراطية بال F16 والأباتشي والصواريخ والحديد والنار!!!<br />فما الفرق بينهم وبين من جاءوا ليحررونا منه؟؟؟<br />أخزاهم الله وشوى صدورهم بأيدي المؤمنين أيتها الحبيبة<br />الغالية.<br />ليس للمحتل إلا وجه واحد، انه وجه القهر والقمع وسرقة الاوطان ولإنسان وقتل روح وإرادة من يحتل ومسخ هويته ووجود وجعله تابع ذليل لكن هذا بعيد عليهم وفينا مثلك ومثل أخواتك من مدننا العظيمة.<br />آسف مرة أخرى وأرجو أن تقبلي اعتذاري."
archived = "2004-05-05"
capture_url = "https://web.archive.org/web/20040505110451/http://www.20at.com:80/article.php?sid=99"

