text = "تنام الفلوجة بين أحضان الفرات، بل لعلها تضمه بحنان إلى قلبها.. وتضعه بين حنايا الضلوع.. هذا هو النهر، الذي يحمل اسما شهيرا، يعرفه كل عربي، من المحيط إلى الخليج، منذ الفطام، ويحلم سائر العرب بالشرب من مائه، حتى لا يظمأ الواحد منهم بعد ذلك أبدا.. هذا هو النهر، الذي شرب منه الشعراء والأمراء والعظماء، منذ آلاف السنين، وخلده الشعر: ديوان العرب، في آلاف من القصائد، التي لا تعرف النهاية، على مر الدول والعصور والأجيال.<br />يقسم الفرات الفلوجة إلى نصفين.. نصف يطلق عليه أهلها اسم المدينة، ويطلقون على النصف الثاني اسم القرية، ويربط بينهما جسران.. الجسر القديم، وبني في العام 1929، والجسر الجديد، أو جسر الوحدة، الذي يذكر لك كثير من أهل الفلوجة، حتى الأطفال وطلاب المدارس، متى أسس، ويتفقون على أنه أسس في العام 1965، ويذكرون لك من ساهم من الحكام العرب في تأسيسه، ومن صلى في الجامع الكبير من الزعماء العرب."
archived = "2004-05-05"
capture_url = "https://web.archive.org/web/20040505110451/http://www.20at.com:80/article.php?sid=99"

