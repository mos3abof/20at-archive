text = "\"ارفع رأسك إنك من أهل الفلوجة\".. \"سلاحك شرفك.. لا تلقي شرفك\".. \"مدينتنا مدينة الجوامع والمساجد، وجهادنا في سبيل الله والإسلام لا في سبيل الأشخاص\".. \"قائدنا محمد صلى الله عليه وسلم لا صدام\".. \"صدام طاغية لكنه أفضل ألف مرة من قوات الغزو الكافرة\".. \"قتلنا الأمريكان وسنقتلهم، ولن نتركهم يهدؤون في العراق\".. \"ذبحناهم ذبحا، وأذقناهم الويل، وأخرجناهم من مدينتنا الطاهرة بالقوة\".. \"من جاء بلدك بالقوة لن يخرج منه بغير القوة\".<br />هذه بعض الكلمات، التي قرأتها مكتوبة على جدران الفلوجة، أو سمعتها من أهلها، وأنا أتأمل الوجوه والأشياء والأماكن، وأحاول أن أفهم سر شهرة هذه المدينة، التي ملأت أرجاء الأرض قاطبة، وسر عنادها وصمودها في وجه قوات الاحتلال، وسر خوف الأمريكان منها، وارتعاش أطراف جنودهم، كلما ذكر اسم هذه المدينة، التي وصفها صحفي عراقي بارع بأنها \"منطقة ملتهبة.. نقطة ساخنة.. بقعة حمراء، على خارطة رمادية\"، هي خارطة العراق."
archived = "2004-05-05"
capture_url = "https://web.archive.org/web/20040505110451/http://www.20at.com:80/article.php?sid=99"

