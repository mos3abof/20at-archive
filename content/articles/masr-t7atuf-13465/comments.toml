[[comments]]
order = 1
subject = ""
author = "ابو سعيد المصري"
posted = "2009-09-16"
text = "وختامًا؛ فالإسلام هو نصير المرأة أمًّا وأختًا وابنة، ومنقذها ومحررها ومخرجها من الطغيان والذل، وجعلها تخرّج الأجيال والأبطال، فوراء كل عظيم امرأة، فلا خداع ولا مداهنة ولا فلسفات فاسدة، ولكنه تاريخ يمتد عبر العصور، وحضارة تثبت جدارتها وإنسانيتها، وقدرتها على الابتعاث من جديد، عرف من عرف، وجهل من جهل."
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923045956/http://www.20at.com:80/masr/t7atuf/13465-2009-09-16-06-39-32.html"

[[comments]]
order = 2
subject = ""
author = "ابو سعيد المصري"
posted = "2009-09-16"
text = "أن تمارس أدوارًا خارج فطرتها؟! أن تمارس أعمالا لا طاقة لها بها؟! أن تتمرد على أنوثتها؟! أن تخالف رقتها؟! أن تبعثر جمالها؟! عجبا أن يطلب من القمر المضيء أن يكون شمسًا محرقة! أهذه حقوق؟! أم أنها مفاهيم عفنة وألفاظ تتصادم مع الفطرة وتعجل بانتقام الخالق سبحانه.<br />إن الإسلام هو المملكة التي أعطت الحقوق لكل من فيها ذكرًا كان أو أنثى، إنسانًا أو حيوانًا، صغيرًا أو كبيرًا، فقيرًا أو غنيًّا، وسيظل الإسلام ظاهرًا وباقيًا محفوظًا بحفظ الله وسنعيش في تلك المملكة طالما تمسكنا بتعاليمه وقواعده فهو مصدر عزتنا وكرامتنا قديما وحديثًا ومستقبلاً، والمرأة هي الكيان التي تقوم به تلك المملكة ولو خرجت عن هذا الكيان وعن دورها فيه لتحطمت تلك المملكة وانهارت."
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923045956/http://www.20at.com:80/masr/t7atuf/13465-2009-09-16-06-39-32.html"

[[comments]]
order = 3
subject = ""
author = "ابو سعيد المصري"
posted = "2009-09-16"
text = "أما الكونت (هنري دى كاسترى) فقد تناول عقد الزواج عند المسلمين فقال: \"إن عقد الزواج عند المسلمين ي[ *** ] للمرأة حقوقاً أدبية وحقوق مادية من شأنها إعلاء منزلة المرأة في الهيئة الاجتماعية\"، وهذا أيضًا هو ما دفع العالم الألماني (دريسمان) أن يسجل قوله : لقد كانت دعوة محمد إلى تحرير المرأة السبب في نهوض العرب وقيام مدينتهم، وعندما عاد أتباعه وسلبوا المرأة حقوقها وحريتها كان ذلك من عوامل ضعفهم واضمحلال قوتهم. إن الفضل قد يخرج من الأعداء في لحظة صدق وإنصاف والفضل ما شهد به الأعداء.<br />نعم عاد من أبناء جلدتنا من سلب المرأة حقوقها وأرادها خراجة ولاجة يساومونها على عفتها وكرامتها وشرفها عبر إعلانتهم التجارية وفضائياتهم العفنة، وآخرين يعتدون على أنوثتها ويدنسون رقتها قالوا لها: كوني رجلاً! وقابلي المجرمين لتقضي بينهم ! كوني مقاولة ..! تنقلي بين البلاد واغتربي لتكوني سفيرة ..!! زعموها حقوقا!! هل من حق المرأة أن تكون رجلاً ؟! أن تخرج عن خِلقتها؟!<br />أ"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923045956/http://www.20at.com:80/masr/t7atuf/13465-2009-09-16-06-39-32.html"

[[comments]]
