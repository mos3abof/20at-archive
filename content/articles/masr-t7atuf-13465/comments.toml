subject = ""
author = "ابو سعيد المصري"
posted = "2009-09-16"
text = "وقد كتبت جريدة \"المونيتور الفرنسية\" عن تصور احترام الإسلام ونبيه للمرأة فقالت: لقد أجرى الإسلام ونبيه تغيراً شاملاً في حياة المرأة في المجتمع الإسلامي فمنحها حقوقاً واسعة تفوق في جوهرها الحقوق التي منحناها للمرأة الفرنسية."
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923045956/http://www.20at.com:80/masr/t7atuf/13465-2009-09-16-06-39-32.html"

[[comments]]
order = 5
subject = ""
author = "ابو سعيد المصري"
posted = "2009-09-16"
text = "السلام عليكم ورحمه الله وبركاته … من قال اخي الفاضل ان الفكر السلفي يختصر المرأة فى كونها أداة متعة ومصدر غواية وماكينة إنتاج أطفال وخادمة بيت بالعكس تماما اخي الفاضل الفكر السلفي يحترم المرأه ويضعها في مكانها اللائق و حتي كلامك فيه الكثير من الإفتراء فالفكر السلفي يري ان المرأه في البيت اهم لا لأنها ماكينه انتاج اطفال بل لأنها تربي الابطال والزعماء والقاده … فدورها ف بيتها اهم و رأينا نزول المرأه للعمل وما له من اضرار كبيره علي الأمه وعلي اخلاقيات ابناء الأمه فالمرأه في الإسلام مصانه ولها مكانتها ولها احترامها … بالعكس انتم من يري المرأه جسد فقط … فهي موديل او ممثله او مطربه او راقصه … وتقولون فن … وتروا ان الفكر السلفي متخلف … لكن هذا الفن الذي يثير الشهوات … هو التقدم والتحضر هداكم الله .. والسلام عليكم ورحمه الله وبركاته"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923045956/http://www.20at.com:80/masr/t7atuf/13465-2009-09-16-06-39-32.html"

