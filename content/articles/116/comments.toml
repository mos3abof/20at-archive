[[comments]]
order = 1
subject = "موقع عشرينات"
text = "** تم حذف المداخلة السابقة.. وموقع عشرينات يرجو من الجميع عدم خروج التعليق عن سياق الموضوع محل النقاش"
archived = "2004-07-03"
capture_url = "https://web.archive.org/web/20040703154124/http://www.20at.com:80/article.php?sid=413"

[[comments]]
order = 2
subject = "ضمير"
text = "سينما الكتابه هكذا شعرت وانا اقرأ موضوعك يا احمد واعتقادى الشخصى منذ ان بدأت القراءة لك انك تكتب بكاميرا وبمؤثرات تتعدى حدود الصوت والصورة ..على اية حال لا تتجاهل ان قارئك مازال يقرأ كلمة وانك ايضا تمسك بقلم وبين هذا وذاك ستأخذ التجربه وقتها لتصبح شكلك الذى احترمه واستطيع التنبؤ به الان اكثر من اى وقت مضى.لاتنسى استاذ احمد اذا كنت ممن يستخدمون الكاميرات الديجيتال ان اعين البعض لم تعتد بعد على الاستقبال الرقمى....وكفايه كده"
archived = "2004-07-03"
capture_url = "https://web.archive.org/web/20040703154124/http://www.20at.com:80/article.php?sid=413"

[[comments]]
order = 3
subject = "بحب صدام حسين"
text = "كان واثقا .. كعادته دائما له حضور كبير .. بصراحة أنا لما بأشوفه بحس اني بحبه رغم كل الكوارث اللي هو مسؤول عنها (هو اللي احنا فيه ده شوية ) ...لكن بصراحة كان أسد"
archived = "2004-07-03"
capture_url = "https://web.archive.org/web/20040703154124/http://www.20at.com:80/article.php?sid=413"

[[comments]]
order = 4
subject = "سونيا الشريرة"
text = "المهم المخرج حرص في البداية على إذاعة عرض صامت (كان واثقامن أن صورة النجم لوحدها تبيع ولا افيشات هوليود ) .. وبعدين شغلوا السماعات .. نظام تشويق وإثارة ياباشا"
archived = "2004-07-03"
capture_url = "https://web.archive.org/web/20040703154124/http://www.20at.com:80/article.php?sid=413"

