[[comments]]
order = 7
subject = "بيرو"
text = "وعلي الباغي تدور الدوائر ...كان هذا رأي نصف المهتمين بالموضوع ده والنصف التاني قال : ان الشماتة طبع اللئام لكن علشان حد يحاول يفهم الفيلم اللي هو عايش فيه. أبدا ... برافو ياعرب وبرافو يا \"كراسي\" هناخد جايزة أجدع جمهور"
archived = "2004-07-04"
capture_url = "https://web.archive.org/web/20040704041119/http://www.20at.com:80/article.php?sid=413"

[[comments]]
order = 8
subject = "بحب السيما"
text = "هاشوفوه يعني هاشوفوه..وحتي لو عملوه مسلسل (ريال تي في) ..هاشوفوه برضوه!!!!!!!!!!!<br />تصدق هوه مسلسل احسن<br />كركركركركركركركر"
archived = "2004-07-04"
capture_url = "https://web.archive.org/web/20040704041119/http://www.20at.com:80/article.php?sid=413"

[[comments]]
order = 9
subject = "من هريدي"
text = "يا لئيم انت عارف كويس انا اقصد مين ، ثم ان القفص يتسع للجميع .. مين تقول تجار المخدرات ، وممكن تقول مخرجي الفيديو كليب .. وممكن اللي في بالي .. يااااارب ... المهم ان القفص يتسع للجميع والرصاصة لا تزال في جيبي"
archived = "2004-07-05"
capture_url = "https://web.archive.org/web/20040705034416/http://www.20at.com:80/article.php?sid=413"
