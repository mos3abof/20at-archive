text = "عفوا بالنسبة لعبارة إن التوبة عادة ماتكون صعبة جدا وغير متيسرة بسهولة بالنسبة لهؤلاء فإن المقصود هو ان فاعل هذه الجريمة الشنعاء لابد من أن يمر بمرحلة قصاص من الله ويبتليه ليتوب عليه هذا إذا كان محظوظ ورضا عنه وماسبهوش فى غياهب الظلمات يرتع كما ترتع البهائم , ولكن طبعا الله يغفر لمن يشاء ولا يدخل فى علمه شىء ."
archived = "2005-03-19"
