subject = "باسل"
text = "مستحيل اي واحده تمشي في الشارع بشكل محترم وبلبس محترم ان حد يعاكسها مش يغتصبها ..مش المناظر اللي بنشوفها دي..واللي تلبس حجاب لشعرها وبقيه جسمها مكشوف او مفاتنه باينه ..طب ملازم لما تمشي في الشارع تتعرض للكل حاجه واكيد مدام هيا لابسه كده يبقي فرحانه باللي بيحصلها انا مش بدافع عن الشباب المنحرف بس ليهم كل العذر اما هيا فملهاش اي عذر والاهل ليهم دور كبير اوي لان اللي يسمح لاخته او بنته تمسي كده يبقي معلش يعني .......اما بالنسبه النادره جدا للمحجبات بجد وبقول بجد عشان مقصدش المحجابت شعر وبس دول اكيد بيتعرضو لامتحان من ربنا ..واكيد ربنا معاهم ..بس"
