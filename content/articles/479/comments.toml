order = 0
subject = "القرار متعلق بمسئولية الفتاة"
text = "يعني هل الفتاة شاركت في عملية الاغتصاب ، بكونها خرجت من بيتها مظهرة مفاتنها بشكل مستفز ؟!<br />أم أنها مثلا - كما هو في مثال المرأة الكويتية - لم يكن لها أي ذنب . . فهي في بيتها أصلا . . أو خرجت من بيتها ولكن بحجاب واحتشام ؟!<br />في النوع الأول - الفتاة المتسيبة - فهذه لا أقبل الزواج منها حتى ولو لم تغتصب فعليا !! فهي تغتصب كل يوم ألف مرة من قبل عيون الشباب التي تتابعها والمعاكسات التي تتعرض لها . .<br />سواء اُغتصبت بالمعنى الكامل للكلمة أم لا . . فهذه الفتاة لا أقبل الزواج منها أبدا<br />فهي حتى وإن لم تغتصب ، أعتقد أنها مرت بتجارب جنسية من قبيل التقبيل أو على الأقل الحب مع شباب من قبل .<br />أما في النوع الثاني . . المرأة ضحية فعلا . . ضحية لإجرام وحوش بشرية يجب أن يقتلوا ويقتص منهم ، وهذه المرأة أنظر لها بعين الشفقة والعطف . . والحنان . . وأسأل الله أن يلهمها الصبر والسلوان<br />إلا أنني أعتقد أن الله بكرمه ورحمته لن يجعل فتاة محتشمة محجبة تتعرض لمثل هذه التجربة الشنعاء . .<br />يعني إذا أجرينا إحصائية فأعتقد أن 90% من الفتيات اللاتي تعرضن للاغتصاب ، هن من الفتيات غير المحتشمات والمتسيبات<br />وربما تصل النسبة لأكثر من 99% خاصة في البلدان العربية والإسلامية ، حيث لا يجرأ شاب أصلا أن ينظر أو يعاكس شابة محجبة حجابا صحيحا<br />وتبقى النسبة ال 1% هؤلاء بالتأكيد الله سبحانه وتعالى لن يتركهن . . بالتأكيد سوف يوفر لهن حياة زوجية سعيدة وكريمة . .<br />أنا لا أتألى على الله سبحانه وتعالى ، ولكني أقول أن الفتاة المحجبة المحترمة لو تعرضت لاغتصاب ، فإن الله سبحانه يعلم أنه لا ذنب لها في هذه الجريمة . . وسوف يبدلها خيرا ، خاصة إذا صبرت واحتسبت الأجر عند الله<br />كما أنني أستنكر على الكاتب أنه لم يبرز مسئولية الوحوش الآدمية . . عن مثل هذه الجرائم<br />أنا أعلم أنه لا يقول بأن المسئولية هي مسئولية الفتاة فقط ، ولكن كان عليه أن يبرز ذلك واضحا جليا<br />كان عليه أن يقول أن الوحش الآدمي هذا ليس معفي من المسئولية حتى ولو كانت الظروف كلها ضده"
archived = "2005-03-19"
capture_url = "https://web.archive.org/web/20050319093227/http://www.20at.com:80/article.php?sid=1042&mode=&order=0"

[[comments]]
