[[comments]]
order = 15
subject = "حبيبة"
text = "يا سلام وصل بينا الحال الى هذه الدرجة من الدونية والحيوانية ان نتعبر اي بنت تخرج الى الشارع بلبس قصير او مكياج مباحة للاغتصاب. هل وصلت بنا الحالة الى هذه الدرجة ان الرجل او الشاب يثار جنسيا في الشارع بمجرد رؤية فتاة. ماذا تركنا للحيوانات فهذا ما يحدث في الغابة. انا اعتقد ان هؤلاء المغتصوبون وكل من يبرر جرائمهم مكانهم حديقة الحيوان ولننقي المجتمع منهم وكفانا النظر الى المراة على انها مجرد قطعة لحم مثيرة جنسيا. ماذا لو تواجد هؤلاء المغتصبون على البلاج او حمام السباحة ؟ هل من حقهم اغتصاب كل البنات والسيدات؟ ولماذا لا يفعلها الرجال في المجتمعات الاخرى. هل لاننا مجتمع حميري لا يستطيع ان يسيطر على غرائزه. عموما الشعب الذي لا يملك السيطرة على نفسه جنسيا شعب مصيره الانهيار. النهارد بنت غير محتشمة في الشارع بكره اخته وبعده امه وكل ده وهو غصب غنه علشان الحمار ما قدرش يسيطر على نفسه... يا سلام."
archived = "2005-03-19"
capture_url = "https://web.archive.org/web/20050319093227/http://www.20at.com:80/article.php?sid=1042&mode=&order=0"
