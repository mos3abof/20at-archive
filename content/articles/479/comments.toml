subject = "نونا"
text = "اتفق معاكوا بس مش معني ان بنت محجبة انها ميه ميه<br />انا محجبة و بشوفو بسمع في الشغل عندي و بقابل كتير<br />احنا بعدنا عن الدين قوي<br />انا نفسي بلبس في ايام لبس مش حجاب خالص<br />و ايام ابص في المرايا و ازعل من نفسي<br />الجريمة عموما و مش بس الاغتصاب انتشرت في مصر<br />و ده انا شفته بعيني<br />او سمعته من حد موثوق منه<br />1- في ميدان رمسيس واحدة ضربت واحد في قلبه و فضل ينزف و مفيش عسكري حتي قرب منهم يمكن فضلت اتفرج حوالي 15 دقيقة بعدين زهقت و الراجل كان بدء يدوخ و يفرفر<br />2- زملائي بيشتغلوا في سور في امبابة ناس جم اغتصبوا بنت و البوليس و زملايي مش عارفين يعملوا حاجة للبلطجية<br />3- ابن صديق للعائلة هجم عليه ناس بمطاوي و ضربوه و قطعوا هدومه راح القسم و اتعرف علي واحدمنهم العساكر راحوا رجعوا و قالوا ملقيناهوش و نصحوه ميعملش محضر و معملش بس نفسيته زفت<br />4- ابن خالتي و اصحابه طلع عليهمناس بامواس و مطاوي عشان يسرقوا الموبيلات و الساعات<br />معدل الاجريمة بيرتفع و ده انا شايفاه من الملاحظة بس ممكن يطلعولك احصائية ان كله تمام<br />او حظي انا بقي ان عرفت الجرايم دي كلهاو الجرايم مش بتحصل غير حواليا لكن باقي مصر بخير<br />اكيد البنت لازم تحافظعلي مظهرها كبنت محترمة و كمان تتربي تربية دينية<br />و مامتها تفهمها و تعلمها<br />شكرا علي وقتكم"
archived = "2005-03-19"
capture_url = "https://web.archive.org/web/20050319093227/http://www.20at.com:80/article.php?sid=1042&mode=&order=0"

