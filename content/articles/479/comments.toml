subject = "ابن زيدون المجنون"
text = "أعجبنى تعليق تونا, وبالنسبة لرأيى فإن الشباب أو الفتيات لاينبغى لأى منهم ان يكون كالحامى يدور حول الحمى يوشك أن يخالطه وأن لايفتح على نفسه او غيره أبواب الفتن فالباب اللى يجيلك منه الريح سده واستريح فكل أخت فاضلة إذا حرصت على غلق باب الفتن فى كلامها ولبسها وتحركاتها وتصرفاتها فدى مين هايحاول يطولها غير بالزواج وكذلك الشاب إذا بعد عن الأفكار المريضة وحاول أن يقترب من الله إستحالة هايكون واحد من هؤلاء المجرمين الذين لن يفلحهم الله أبدا دنيا ولا اخره فهو بهذا الإغتصاب قد إغتصب أيضا إنسانيته وهيهات أن تعود إليه إلا من تاب والتوبة عادة تكون صعبة جدا ولا تتيسر بسهولة بالنسبة لهؤلاء .<br />وأعتقد ان أى فتاة يتم إغتصابها فهى بحاجة اولا إلى إعادة تاهيل نفسى كى تصلح لتكون زوجة لديهاثقة فى نفسها ومقدرة على تربية أبناء , فإذا ما تم تاهيلها وبرئت نفسيا وجسديا فلا مانع من أن تتزوج أى أحد ولا تخبره بما حدث طالما هو إنسان وجدت فيه زوجا صالحا فالفاعدة أنه إذا أبتليتم فاستتروا حتى لاتعم الفاحشة ويهون شأنها فى عين من لم يفعلها فيقدم عليها.<br />وطبعا لو أى حد واحدة قالت له ان تم إغتصابى لن يتزوجها وحتى لو فعل وظنت انها قد صارحته وخلصت فهى قد قضت على مستقبل علاقتهما معا ولن تكون الحياة طبيعية أبدا بينهم سواء من جهته أو حتى من جهتها فلو كانت تركته فى حاله ولم تتزوجه لكان أنفع له ولها . وأى حد يغتصب واحدة سواء شجعته بلبسهاأم لا يستاهل إعادمه فى ميدان عام ضربا بالبلغ ."
archived = "2005-03-19"
capture_url = "https://web.archive.org/web/20050319093227/http://www.20at.com:80/article.php?sid=1042&mode=&order=0"

