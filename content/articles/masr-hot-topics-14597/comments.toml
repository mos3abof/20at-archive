text = "اقتباس مفيش قش ارز:<br />الحمد للة رب العالمين انة ليس موسم القش ارز<br />فى الحال كان هيطلع دكتور من الدكاترة اياهم يرمى التهمة على فلاح حرق قش ارز فى المنزلة او دمياط والدخان وصل بالقطار للقاهرة وعمل الضباب والسحابة اياها<br />السحابة السودة غير الضباب يا برنس"
