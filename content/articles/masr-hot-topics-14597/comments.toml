posted = "2009-12-27"
text = "اقتباس dody amin:<br />انا شفت الشبورة دى وكنت على طريق سفر الصبح والطريق كان وحش جدا كان كله حوادث بس ربنا ستر الحمد لله<br />أنا كنت مسافر من حته أسمها المحموديه ألي الاسكندريه علي الساعه 11.30 ولا فيت عربيه نيسان لابسه في أخر الدولي حاجه الصراحه زفت أول المشوار تفائل وروحت الاسكندريه ورجعت علي الساعه 5 الفجر رجعت تاني الاسكندريه يعني أنا حضرت الشبوره أمبارح من أولها لحد أخرها والحمد لله"
