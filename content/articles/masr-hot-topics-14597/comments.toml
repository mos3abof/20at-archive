posted = "2009-12-27"
text = "لما الضغط الجوى بينخفض شوية عن المعدل الطبيعى - المياة بتتبخر وتعمل سحابة فوق سطح الارض - امس لم يكن هناك سحابة فى العاشر من رمضان - والجو كان مشمس ورائع انما طرق طنطا والزقازيق كانت مغلقة تماما"
