text = "انا ماشفتش الشبورة بالليل<br />بس عانيت من آثارها الصبح والحمد لله … 3 ساعات ده غير ان الميكروباصات مش راضية تروح ناحية المحور خالص علشان بعيد عنكم فيه حادثة كبيرة أوي .<br />ده غير ان طريق مصر اسكندرية الصحراوي واقف تماماً فموقف نص المحور<br />يعنى ياريتنى كنت شوفتنى الشبورة علشان مانزلش خالص من بيتنا النهاردة ."
