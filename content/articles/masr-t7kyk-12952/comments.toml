posted = "2009-08-18"
text = "اسم الجروب مستفز جدا واعتقد ان تم تغيير اسمه قريب<br />اما عن فكرته فده تخلف إننا نحصر الاستقرار بعلاقة جنسية أعتقد إنها مبقيتش بالصعوبة دي في مجتمعنا<br />بدليل وجود فتيات الليل ووجود مدافعين عن حقوقهم والكثير من العلاقات الخفية بين الشباب<br />وده إثبات لمدى السطحية اللي بيتعامل بيها مؤسسي الجروب مع فكرة الزواج"
archived = "2009-08-19"
capture_url = "https://web.archive.org/web/20090819152134/http://www.20at.com:80/masr/t7kyk/12952-2009-08-16-14-48-00.html"
