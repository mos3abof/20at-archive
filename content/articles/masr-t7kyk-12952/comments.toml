[[comments]]
order = 2
subject = ""
author = "Doha Helmy"
posted = "2009-08-18"
text = "السلام عليكم ورحمة الله وبركاته<br />أنا صاحبة الجروب وردا على المقالة وعلى تعليبقاتكم .. فكرة الجروب كلها عن الجواز وعن العنوسة اللى بتزيد في البلد<br />الفكرة محروقة لكن الأسم استفز كتير من الناس وأتهمنا بإننا بندعو للجنس<br />لا .. أنا حابه أصلح المعلومة دي<br />الأسم أنا أخدته من الرسالة اللى وصلتنى على موبايلي<br />الرسالة كانت (شارك في حملة زواج البنات تحت شعار : لحد أمتى هنفضل نحضن المخدة)<br />وأنا نقلت الفكرة على الفيس بوك مش كدعوة \"للعلاقات الحميمية التي لا يمارسها غير المتزوجين\" زي ما كتب في المقال<br />الفكرة واضحة وموضحينها في وصف الجروب .. والأسم تم تغيره لـ (الوسادة الخالية) منعا للأقاويل اللى بتقول أنى بدعو للجنس أو أى أقاويل أخري<br />تحياتى : ضحى حلمي"
archived = "2009-08-19"
capture_url = "https://web.archive.org/web/20090819152134/http://www.20at.com:80/masr/t7kyk/12952-2009-08-16-14-48-00.html"

