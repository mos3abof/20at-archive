author = "الإجابه"
posted = "2009-08-16"
text = "السؤال ليس بغريب<br />فأي شخص يسعى للإستقرار العاطفي و ليس فقط الجسدي ( كإشباع الرغبات الجنسيه )<br />الإجابه هي عندما نتخلى عن التفكير المزدوج بين الدعوه لإبنتك بالزواج بأي شخص لكي ( تسترها ) و بين المغالاه في الطلبات من العريس الموعود الذي إما الدفع أو الدفع على عتبة الباب للخارج طبعا<br />فلا يفكر أحد في الزواج من فتاه أباها و أمها على قيد الحياه فهم السبب في المشكله"
archived = "2009-08-17"
capture_url = "https://web.archive.org/web/20090817235954/http://www.20at.com:80/masr/t7kyk/12952-2009-08-16-14-48-00.html"

