posted = "2009-08-16"
text = "حتى يرحل النظام الفاشل<br />وييجى نظام يعطى راتب للخريج الجديد 3 الاف جنية كحد ادنى<br />واما يعمل عملة جديدة وينزل جنية جديد قيمتة 10 دولارات امريكية<br />ساعتها الناس تعرف تعيش وتتجوز"
