subject = ""
author = "نيفين نيفى نوفا"
posted = "2007-05-23"
text = "الايام فعلا هى اللى هتبين موهبه هيثم من عدمه<br />ياما نجوم كتير فشلو ف الاول و لكن لما جتلهم ادوار بينت امكانياتهم ظهرو و دايما اكبر مثال بيحضرنى هانى سلامه و انا شايفه يا جماعه ان دى مسئوليه المخرج الشاطر<br />بس يا خوفى و اخشى ما خشاه اننا نقارن هيثم باحمد زكى لان صدقونى المقارنه دى غلط لان مفيش اوجه ليها"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122559/http://www.20at.com:80/20at/klam-rosas/5973.html"

[[comments]]
order = 1
subject = ""
author = "مصرى حتى النخاع"
posted = "2007-05-24"
text = "ايام اية بس يانفين اللى انتى مستنياها<br />انتى لسة مش فاهمة ان التمثيل دة سبوبة كبير ة ووهم مافيش موهبة ولا زفت وهيثم احمد ذكى حيبقى زى كل اولاد الفنانين بيضحك علينا وياخد فلوسنا ويعمل فيها واحد مهم<br />اياحضرات تقدم الدول يقاس يعدد مهندسيها وماطبائها ومفكريها اما التمثيل فهو فكرة شيطانية بكل ماتعنى الكلمة وفى امريكا واولروبا اعترف مخرج امريكى انة لابد من تقديم جرعة لقطات جنسية مدتها 10 دقائق فى كل فيلم لضمان نجاحة اما عندنا هنا فمثلا هل فلم الباطنية انهى ادمان المخدرات هل زود فلم الطريق الى ايلات الانتماء للوطن<br />وهم كلة وهم<br />اتفرج النهاردة على فلم الارض وقوللى حسيت باى حاجة ولا هوا فلم والسلام<br />والسلام ختام"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122559/http://www.20at.com:80/20at/klam-rosas/5973.html"

