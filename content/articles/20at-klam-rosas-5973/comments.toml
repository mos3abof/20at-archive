[[comments]]
order = 6
subject = ""
author = "نيفين نيفى نوفا"
posted = "2007-06-03"
text = "يا مصرى حتى النخاع انا رديت و افتكرت تعليقى وصل و بدخل دلوقتى اكتشفت انه لم يصل هحاول الخصللك ردى الاخرانى و<br />انا كنت لارديت ف الاول لان الموضوع كان بيتعلق بموضوع هيثم لكن انت دلوقتى بتدخلنا ف كذا موضوع<br />اولا فيما يتعلق بهيثم لاانا مقلتش ان الموهبه هتيجى بالوقت زى ما البعض فهم لان الموهبه لا بتبقى موجوده من الاساس يا لا و اللى قصدته اننا نديله فرصه يعمل اللى يقدر عليه و اللى بتتيحه امكانياته<br />ثانيا الفن غذاء للروح فعلا شئنا ام ابينا و فيه انواع من الفن راقيه و لا يختلف عليها اتنين زى الفن التشكيلى باتجاهاته و الباليه و الموسيقى بانواعها و المسرح و غيرها من افنون الراقيه اللى فعلا بتسمو بالروح<br />ثالثا ازاى تختزل الفن بمجالاته الكتيره لصوت حلو و بس<br />اسمحلى دى نظره قاصره شويه"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122559/http://www.20at.com:80/20at/klam-rosas/5973.html"

[[comments]]
order = 7
subject = ""
author = "احمد محمد الديب"
posted = "2007-12-16"
text = "احمد الديب / فى مرات كتيره يشاء الله بتدخل القدر فى حيات الانسان ويغير مجرى حياته ثم بعد فى نهايه المطاف يكتشف انه كان على صواب او كان على خطاء و من الممكن تكون الحقيقه فى الدقائق الاخيره من حياته … و عزرا يا هيثم احمد ذكى يجب عليك السير الى نهايه الطريق فتأكد انك لن تخطوا خطوه لن يكتبها الله لك اخيرا اعقلها و توكل على الله وفقت فيما انت فيه و رحمه الله على ابيك و شكرا"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122559/http://www.20at.com:80/20at/klam-rosas/5973.html"

