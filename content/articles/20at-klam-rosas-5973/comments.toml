subject = ""
author = "الحزينه"
posted = "2009-02-08"
text = "السلام عليكم بعد التحيه عليكم كلكم والسؤال عن صحيتكم<br />انا من اسكنداريه وبحترم كل الاراء الموجوده<br />بس المفروض كلنا نسمع بعض نقنع بعض للاننا فى الاخر ممكن نبقى اصدقاء<br />وعلى فكره …<br />هيثم احمد ذكى انسان كويس يعنى وانا حاسه من طريقته فى التمثيل كويس جدا<br />وكمان كان باين فى عنيه معانى جميله اوى فى برنامج البيت بيتك<br />احب اعرف مين ياشركنى الراىء دا ومين لا ؟<br />وياترى تقابلونى صديقه معاكم ولا لا ؟<br />والسلام ختام"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122559/http://www.20at.com:80/20at/klam-rosas/5973.html"

