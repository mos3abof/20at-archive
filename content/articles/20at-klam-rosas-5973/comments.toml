subject = ""
author = "لا طبعا"
posted = "2007-05-29"
text = "مع كامل احترامى لكلامك بس انا مختلف معاكى يعنى نعطى فلوس وشهرة لنص موهبة لمجرد ان ابن فنان وبدل لما نتكلم عن عماد بعرور تعالى نتكلم عن امال ماهر اللى الصدفة وحدها حطتها على طريق شهرة تستحقها وتخيللى ان فية كتير من امال ماهر مستنيين نص فرصة<br />انا بقى عاوز اسالك اية هوا الفن اصلا ؟<br />سيبك من الكلام الفاضى بتاع الفنانين انة غذاء الروح ومش عارف اية ؟<br />مافيش حاجة اسمها فن غير الناس اللى ربنا عطالها صوت كويس وبس"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022122559/http://www.20at.com:80/20at/klam-rosas/5973.html"

