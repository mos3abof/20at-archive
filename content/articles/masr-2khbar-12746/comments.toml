text = "اجدع مسلسل السنة اللى فاتت كان مسلسل الدياسطى<br />وكان مسلسل دمة خفيف جدا واكثر من رائع<br />واعتقد ان مسلسل المفتش كرومبو سينجح<br />قرفنا من الممثلات الممصوصى الوجوة والصفر من كثرة الرجيم والسهر وشرب الخمر ورخامة عباس الابيض ورخامة الراقصات لما يمثلوا<br />اجدع مسلسل السنة اللى فاتت كانت الدياسطى<br />والسنة دى هيبقى كرومبو علشان مفيش فية ساقطات"
