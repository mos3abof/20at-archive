[[comments]]
order = 6
subject = "اهلا عبدوف -"
author = "ايمن امام"
posted = "2006-11-22"
text = "اهلا وسهلا استاذ عبدوف انتا جيت انتا كنت فين ياراجل - وحشنا كلامك المبقلظ كل كلمه تفسرها الكلمه اللى بعديها واللى قبليها واللى فوقيها واللى تحتيها واللى وراها - ولابلاش وراها لحسن تقهمنى غلط - حاكم انا عارفكم اليومين دول اعصابكم على المحك - حلوه المحك دى - المحك غير واحد حك !!! لانه مش لاقى مرهم - المهم يا كاتب الروائع والملاحم الشعريه والادبيه - لافض فوك - حلوه دى برضه شوف انا بدلعك اذاى ياعبدوف ايه اللى جابك هنا ماكنت متدارى وبتكتب فى جرنال ومجله لايقرأها الارئيس التحرير وشويه المخبرين اللى بيحموكم قال ايه شخصيه عامه - كبيره قوى وبسبب حب مصر - تتعرض للخطر والله العظيم ولاحد حتى عارف شكلك الا شويه من اللى ساعات لما يكونو عاوزين يشعروا بالقرف يفتحوا التليفزيون بتاع الرياده - المهم ياعبدوف يافلته عصرك واوانك ياكبد امك - حلوه دى برضه كبد امك - انا باقول ياكبد امك - ما قولتش حاجه تانى - والله غفور رحيم - المهم - مالك ومال حذاء المرشد العام للاخوان المسلمين وبدايه اقسم بالله العظيم اننى لم اشرف بان اكون منهم - عشان ما تقولش - تخاريف - ذى صاحبك اياه - المهم - باقولك مالك ومال حذاء الراجل - وليس كلامه او انتمائه - لان سيادتك كبيرك تتكلم على الحذاء - حلوه دى برضه خد دى كمان يمكن تلم الليله - دا انتا ليلتك- ذى قلبك - لالا - دى احلى - قولى ياعبدوف ياحبيبى اخبار الكرملين ايه - مش عارف اذاى يكون الواحد كرمنلاوى ويكون على علاقه طيبه بابونا بوش واتباعه - والنبى ياعبدوف انا كنت محتاج اشترى كلينكس للحمام - قعدت ادور على ارخص نوع لانى منوفى اولا وهذه حقيقه لااخجل منها - فسيدنا موسى كان يهوديا ولكنه كان نبيا - قعدت ادور على الكلينكس الرخيص لانى كنت عاوزة للحمام - علشان الخلفيه الثقافيه - م<br />اقرأ بقية التعليق .."
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195917/http://masr.20at.com:80/article.php?sid=1191"

[[comments]]
order = 7
subject = "\"فقاقيع الإخوان!\""
author = "أسامة صابر مصطفى"
posted = "2006-11-23"
text = "منذ أن بدأ ما يسمى بالحراك السياسي قبيل الانتخابات الرئاسية غير المسبوقة قبلاً، تابعت رغماً عني أخبار جماعة الإخوان وهنا أحب أن أؤكد أني تجاهلت الصحف القومية وأخبارها المبالغ فيها عن الإخوان، وقررت أن أكون فكرتي ورأيي في الإخوان من خلال وسيلة إعلامهم هم والمتاحة للجميع وهي موقع الإخوان أنفسهم على الإنترنت.<br />ومنذ هذه الفترة وأنا أتابع موقع الإخوان بشكل يومي، وكانت بالطبع تثير اهتمامي تصريحات المرشد العام السيد مهدي عاكف. وهنا بدأت الرؤية تتضح عندي قليلاً عن الإخوان، وذلك بمرور الأحداث..<br />الآن، متبقي أيام قليلة على انتخابات الرئاسة المصرية، وبالتالي كنت مهتماً بموقف الإخوان من هذه الانتخابات.. في البداية أعلن الإخوان أنهم سيقاطعون هذه التمثيلية على حد وصفهم، ولن يشاركوا فيها، وهم بذلك اتفقوا (عن بعد) مع حزب التجمع والناصري والوفد.<br />بعدها، أعلن الإخوان أنهم لن يقاطعوا الانتخابات، وصدرت تعليمات لشباب الإخوان، بأن يستغلوا الفرصة لاستخراج بطاقات انتخابية، وصرح المرشد (بمنتهى التراخي) أنه يريد أن يدرب شباب الإخوان على العمل السياسي. فقط هذا ما يريده! وبعد أن انتهت الانتخابات تنامي إلى علمي أن شباب الإخوان الذين ذهبوا، كانت مهمتهم هي إبطال أصواتهم والشطب على المرشحين العشرة!<br />وهنا بدأت أسأل نفسي لماذا هذه السلبية المقيتة، التي تعتبر من أسباب تخلف البلد؟ إن موقف الإخوان، لم يكن سلبياً فحسب، وإنما أوضح لي بعداً آخر وذلك بعد أن بدأت الانتخابات البرلمانية.. وهنا اختلف موقف الإخوان بشكل ضخم..<br />المرشد العام يؤكد أن\"الإيجابية فريضة دينية\"، لماذا الآن يا مرشد الإخوان أصبحت الإيجابية فريضة دينية، أهذا لأنكم مشاركون في هذه الانتخابات؟ هل الانتخابات البرلمانية \"فريضة\" والانتخابات<br />اقرأ بقية التعليق .."
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195917/http://masr.20at.com:80/article.php?sid=1191"

[[comments]]
order = 8
subject = "الي الاخ سواح"
author = "شيماء"
posted = "2006-11-23"
text = "السلام عليكم و رحمة الله و بركاتة<br />الاخ الفاضل / سواح<br />اشكرك علي تعليقك و توضيح وجهة نظرك<br />مبدئيا انا فعلا مقرتش كل المقال انا قريت منه مقتطفات لان صراحة حسيت ان المقال و الكاتب ميستحقوش اني اضيع وقتي في قراية المقال كامل لكن المقتطفات الي قريتها هي و العنوان كافيين اني افهم ان الكاتب مش بينتقد الاخوان لكنه هجوم واضح و صريح لسبب او بدون سبب لناس قرر انه يتصيدلهم اخطائهم و يأول بعض الاراء الي مش عاجباه الي اخطاء و دة شئ مرفوض مش بس مع الاخوان لكن مع اي حد لان ده ضد الموضوعية و النقد البناء.<br />النقطة الثانية : منكرش ان حكمي علي النظام الاوربي مش نابع عن قراءة سياسية لكن انا من اكتر الناس الشغوفين بالادب الاوربي و اكثر قراءاتي لروايات لكتاب اوروبيين و احنا عارفين ان الادب بالذات بيعكس ثقافة و فكر و حياه الشعوب بالاضافة الي ما نعرفة من خلال وسائل الاعلام و كلنا عارفين ان الاتجاه السائد في اوروبا هو العلمانية اي فصل الدولة عن الكنيسة او عن المؤسسات الدينية بشكل عام و دة بالنسبة لنا كمسلمين حيتسبب في ازمة كبيرة جدا لان المسلمين مطالبين بالرجوع للدين في كل حياتهم و معاملاتهم اذن العلمانية لا تتفق مع ثقافة الشعوب الاسلامية.<br />3. من حقك طبعا انك تكره او تحب الي عاوزة بس صعب انك تحكم علي كل جماعة الاخوان ان الاسلام عندهم مجرد شعار فقط حتي و ان بدا دة علي قياداتهم زي المرشدالعام لانك بالتأكيد متعاملتش معاهم كلهم و موقفتش علي كل افكارهم. و هنا في نقطة مهمة جدا يجب ان نأخذها في الاعتبار و هي الاخوان مش حزب سياسي و لكنة جماعة دينية بتعتبر ان مرجعيتها الاساسية هي الاسلام و دة حيكون له بعض النتائج:<br />1. كونة مش حزب سياسي معترف به و انما جماعة و كمان حظرتها الحكومة و رافضها بعض المثقفين و كل ال<br />اقرأ بقية التعليق .."
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195917/http://masr.20at.com:80/article.php?sid=1191"

[[comments]]
order = 9
subject = "باقي التعليق"
author = "شيماء"
posted = "2006-11-23"
text = "في نقطة مهمة نسيت اوضحها و هي ان اغلب الشعب المصري بيعتبر ان الاخوان الطريقة الوحيدة الي حنتخلص بيها من الحزب الحاكم و من خلال متابعتنا لمجلس الشعب بنلاقي ان اعضاء الاخوان هم اكثر الاعضاء كشفا للفساد و اثارة للمواضيع الحيوية و دة سبب كافي لناس كتير انها تمارس حياتها السياسية من خلال الاخوان و لو صدمنا الناس دي في الاخوان بالشكل العنيف دة حيتسبب في ازمة ثقة لانهم باختصار مش لاقين حد يستحق ثقتهم و دة ممكن يتسبب في نوع من البلبلة او التوهان السياسي الي يأ اما يؤدي الي عنف و تطرف ياما يؤدي الي سلبية و لامبالاه و كلاهما مرفوض."
