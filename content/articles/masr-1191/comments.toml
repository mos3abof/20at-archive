order = 0
subject = "رسالة الي الوالي قصدي الكاتب"
author = "شيماء"
posted = "2006-11-21"
text = "السلام عليكم و رحمة الله و بركاتة<br />رسالة الي الكاتب<br />يا احول القلب مال اهلك و مال الاخوان , عاملينلك ايه متكاد و متغاظ منهم له الي غيران منهم يعمل زيهم , بقي دلوقتي الاخوان هما سبب البلاوي الي في العالم كله و سي حسس و ابنة و فرقة حسب الله بتاعتة هما الملايكة البريئة المظلومة الي مبيعملوش حاجة غلط. حسبي الله و نعم الوكيل ربنا يريحنا من المطبلاتية امثالكم عشان صراحة فرقة حسب الله خلاص اتملت علي الاخر و مش ناقصة مطبلاتية و بتوع صاجات و الرقاصة خلاص عدت ال 80 سنة و مبقتش قادرة تهز وسطها.<br />و بعدين اية الي حظر الاخوان هو بسلامتك مسمعتش ان في 88 نائب اخواني في البرلمان , ازاي تبقي جماعة محظورة و منها 88 نائب في مجلس الشعب ايه دخلوا من تحت عقب الباب . ايه مزعلك ان الاسلام هو الحل تحب سيادتك ايه يكون الحل \" العنب العنب العنب\".<br />ما احلمك يا الهي عايشين في ملكه و بتاكلوا من ارضه و بتتنافسوا هواه و بيرزقكم من رزقه و في الاخر بتحاربوا دينة لكن نقول ايه يمهل و لا يهمل و الي قدر علي فرعون يقدر عليكم.<br />و حسبي الله و نعم الوكيل."
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195917/http://masr.20at.com:80/article.php?sid=1191"

