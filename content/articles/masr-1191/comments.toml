text = "Hi Shaimaa;<br />1st of all thanks for the nice replay, and I like your way of thinking, may be you are more political than me, as you like ekhwan in a way that says \"2a7san el mawgodeen\"<br />and may be we should accept this, but on the other hand i got problemsd with this way of thinking:<br />1) you said that هي الاخوان مش حزب سياسي و لكنة جماعة دينية بتعتبر ان مرجعيتها الاساسية هي الاسلام<br />and u said also<br />عشان انتمي لحزب معين اني اقف علي كل افكارة و اقتنع بيها تماما و ان الافكار دي لازم تكون واضحة وضوح الشمس و دة مستحيل يتحقق في المرحلة دي لانها زي مقولت قبل كدة مرحلة عدم نضج سياسي مع جميع الاحزاب في مصر .<br />and ikhwan is using this contradition to get votes, and go to magles el shaab, i.e. work in politics, if i wish to work in politics i should sheck what does people want, but i cannot feel ikhwan does so, they do not have a plan, and they should have one as long as they r fe magles el shaab.<br />I lived in western countries for quiet a good amount of my life, and I wonder why would i vote for someone without even a plan ?!!!<br />even 1 guy fe magles el shaab should got a plan else hantakheboh leh?!<br />on the other hand, this makes their fight pretty selective, i.e. ikhwan did not fight corruption hard enough, they did not talk about mahsakel el tawzef wel ta3lem, yet, i can see some of them fight hard 3ashan mayoh momaselah or oghneyah hayfah 7abeten, and this hurts me, not because i liek to see el mayoh, but because we r loosing our effort in minor problems.<br />3rd and most<br />اقرأ بقية التعليق .."
