[[comments]]
order = 3
subject = "الي الاخ احمس"
author = "شيماء"
posted = "2006-11-22"
text = "السلام عليكم و رحمة الله و بركاتة<br />الي الاخ الفاضل احمس<br />اولا اشكرك علي تعليقك علي تعليقي و توضيح وجهة نظرك.<br />ثانيا انا كمان حعلق علي تعليق حضرتك:-<br />بالنسبة الي جزئية ان الاخوان بيمثلوا الاسلام فنقدر نقول انه علي المستوي السياسي و الحزبي ايوة الاخوان بيمثلوا الاسلام لانهم رافعين شعار \" الاسلام هو الحل\" و بينادو بتطبيق الشريعة بحذافيرها في مصر و اعتقد ان دي حاجة متزعلش حد حيث ان تطبيق الشريعة الاسلامية في بلد اسلامي شئ وراد و مقبول و مطلوب و معلهش اي غبار و مش عارفة اية الي ممكن يتقال لمسلم مش عاجبة الشريعة الاسلامية.<br />ثانيا: اغلب دول العالم و خاصة اوربا فيها احزاب دينية الي احنا بنسميها يمنية اش عجب هما يبقي عندهم احزاب دينية معترف بيها و معلن عنها صراحة بل و المنتمين لها بيفخروا بيها و احنا يعني الي \" وقعنا من قعر القفة\".<br />ثالثا : سيدنا محمد صلي الله عليه و سلم لما تفاوض مع اهل المدينة من اجل الهجرة تفاوض معهم علي انه يكون حاكم المدينة مش مجرد نبي او شيخ يقعد في حجرة يعلم الناس الدين و بس و دة ليس طمعا في الحكم حاشا لله و انما لبناء الدولة الاسلامية علي اساس صحيح و علي اساس الشريعة الاسلامية لان اهل الحكم و السياسية هما الي في ايدهم اهم القرارات التي علي اساسها بيتحدد مصير و هوية الشعوب اذن مش غريب علي الاخوان انهم يطالبوا بالحكم لتطبيق حكم اسلامي في دولة اسلامية يعني السياسة هنا بتخدم علي الدين اما بقي دعاه الليبرالية و الحرية و الكلام الاهبل دة فدول متصدقهمش و ادي واحد منهم بيقولك انا حمنع زوجتي من لبس الحجاب \" هي بقي دي الحرية الي بيتكلموا عنها\".<br />اخي الفاضل الاسلام عمره مكان ضد الحرية طالما في حدودها الشرعية و الا بقي ميجيش واحد يضربك او يضرب حد من اهلك و يقولك دي حرية ش<br />اقرأ بقية التعليق .."
archived = "2006-11-30"
capture_url = "https://web.archive.org/web/20061130195917/http://masr.20at.com:80/article.php?sid=1191"

