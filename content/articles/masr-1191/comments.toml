subject = "المخبر كوكو"
author = "مهدي"
posted = "2006-11-22"
text = "انا ساعات بحس اني هتجنن بيكسبوا كام واد ايه علشان يدافعوا عن العيشه الحرام اللي معيشنا فيها القائد المفدي حسني مبارك يا عم كوكو انت انسان سافل مهما كان اختلافك مع المرشد العام ماتقولش عليه صاحب رزيله يا سافل ده جزمته برقبتك تاني حاجه ايه الأعتراض علي ان الأخوان بيقولوا انهم علي حق ما هو انا لو يساري لبرالي ولا جن ازرق هقول اني علي حق تقدر انت ترفع عينك في شنوده ولا في اي مقطوع من القساوس الا وتقول صاحب التعاسه والقداسه اما عن الحظر والمحظوره نتائج الأنتخابات بعد كل القرف اللي حصل فيها يرد عليك اللي حظرها ديكتاتور ظالم وهو زعيمنا القائد المفدي حس<br />سيدي المخبر كوكو قطعت والفراخ بايضه"
