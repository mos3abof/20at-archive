text = "اقتباس انتم بتحلموا:<br />ديك رومى اية وحمام محشى اية على الفطار<br />جوز الحمام ب 30 جنية<br />ودكر البط ب 100 جنية<br />اما الديك الرومى فلن يقل عن 300 جنية<br />انتم بتكتبوا لسكان مارينا<br />احنا ناس غلابة من الشعب العادى<br />بنفطر حتة لحمة وطبق شوربة لسان العصفور وطبق خضار وطبق ارز والحلو خشاف<br />انما الحمام المحشى والديوك الرومية فبيننا وبينها بعد المشرقين<br />خليكوا حلوين<br />اما السحور بتاعنا فدائما فوووووووووووووو ووووووووووول<br />الفول أحسن سحور يا باشا<br />ورمضان مش شهر أكل ومحمر ومشمر وإنما شهر تقوى وزهد<br />أما الديوك دي فتبقى في العيد ان شاء الله (لو تمنها موجود)<br />ولو مش موجود، فالحمد لله ربنا رزقه لا يضل عن صاحبه أبدا ان شاء الله"
archived = "2009-08-24"
capture_url = "https://web.archive.org/web/20090824203557/http://www.20at.com:80/masr/t7kyk/13011-2009-08-20-14-09-59.html"
