author = "نيفين نيفى نوفا"
posted = "2007-05-23"
text = "هل من احد يخبرنى ماذا نسمى تللك الفتوى و ماذا نسمى موضوع ارضاع الكبير<br />اليس هذا العبث الذى انتشر حتى طال الدين<br />احب ان اقول كلمه ربما تردع الكثيرين<br />قال رسول الله من كذب على متعمدا فليتبوأ مقعده من الناو كل انسان الزمناه طائره فى عنقه"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027021313/http://www.20at.com:80/masr/2khbar/6002.html"

[[comments]]
