subject = ""
author = "علي الغرياني"
posted = "2008-07-31"
text = "ان ماقاله فضيلة الدكتور مفتي الديار المصريه صحيح عن ارضاع الكبير وليس بتدليس وقبل ان نظلم فضيلة المفتي نقراء ونبحث اولا يا أمه إقراء واتباع الرسول المصطفي علية الصلاة والسلام نقراء فى مختصر صحيح مسلم فى كتاب الرضاع فى باب رضاع الكبير وهو حديث عن السيدة عائشه رضى الله عنها زوجة الرسول وليس حديثا مرويا عن فلانه اوعلانه لاتوجد لها اصول فقهية او معرفة بامور الدين الاسلامى<br />برجاء قبل ان نفتي بدزن علن لابد من التأكد أولا من قبل القاء التهم بجهالة"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027021313/http://www.20at.com:80/masr/2khbar/6002.html"

[[comments]]
