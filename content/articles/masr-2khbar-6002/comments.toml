subject = ""
author = "الانسه زعلانه"
posted = "2007-06-19"
text = "والله العظيم الواحد مش عارف يلاقيها منين ولا منين يلاقيها من( الفتاوى فتى وكل معايا يااخى)ولانلاقيه ا من الحكومه اللى متالعا عينا ومبهدلانه انا عايزه اقول حاجه سورى يعنى هى الفتوه بول الرسول هاتفادنا فى ايه هاتفيدنا نكون مومنين وليس مسلمين بالاسم فقط مين من الشباب فاهم دينه صح وبيعمل بيه انا واحده من الناس اللى من كتر مشاهديتى لكل البرامج الدينيه اللى منها تجارى ومنها دينى متعصب جالى اكتئاب لمدة سنه وده اكيد حال معظم الشباب . لازم نفوء ونفكر فى اللي يهمنا واللى ميهمناش."
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027021313/http://www.20at.com:80/masr/2khbar/6002.html"

[[comments]]
order = 7
subject = ""
author = "اكتب اسمك هنا"
posted = "2007-10-27"
text = "iهاهاهاهاهاها، ياللمسخرة، بالفعل أن الدين الاسلامي دين ضعيف وو هي أمام الحضارة و المنطق و اليوم نحن مسخرة العالم و مضحكته للاسف لحد الأن لا ارى إلا الأحبط و العتف و قلة العقل إذا كان اليوم شخاخ الرسول و بكر خروج من سيكون و يرفع إلى رتبة القداسة؟ و بعدين يا غبي حتجيب بول الرسول من أين للتمسح به؟<br />على فكرة هناك نوادي للجنس في أروبا يبولون فيه على بعضهم البعض و هم أيضا مثقفين مثل من اصدر الفتوى البولية<br />يا للعار و الاسف عليكم."
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027021313/http://www.20at.com:80/masr/2khbar/6002.html"

