author = "محمد هاشم"
posted = "2009-01-25"
text = "د/على علامة العصر وزقزوق لايفقه الا لم فلوس الأوقاف الله يوقف حاله مع الحكومه ايا كانت اما الدين اتركوه لأهله امثال فضيلة المفتى الذى رزقنا الله به ليجدد للأمه دينها بعد ان دنسها الوهابيه والشيعه خذوا الدين من هذا الأمام واعرفوا قدر ال البيت وحبوهم حقا تحشروا معهم وصدق سيد الأنام يحشر المرء مع من احب"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027021313/http://www.20at.com:80/masr/2khbar/6002.html"

[[comments]]
order = 11
subject = ""
author = "عيد حسن"
posted = "2009-03-03"
text = "هذا هو حال المسلمين , مخدوعين بأحاديث محمد و التي هي دائماَ َ تصب لمصلحته الشخصية , حتى أنه جعل أتباعه يشربون بوله و دمه الخارج منه بسبب الحجامة . محمد الذي طلق زوجة إبنه من التبني لأنها أعجبته و إشتهاها ، فأنزل آية على مزاجه تخرجه من الموقف الحرج و تبرر له زواجه من زوجة إبنه بالتبني (( زيد )) و الآية تقول (( لما قضى منها زيداَ َ وتراَ َ زوجناك إياها )) عيني على الرب الذي يحب أن يخرب بين زوجين لإشباع رغبة محمد .<br />و دائماَ َ هناك تبريرات للمواقف الحرجة التي يقع بها نبي الإسلام .<br />مساكين أيها المسلمين كم أنتم مخدوعين بهذا الدين الذي تشير مؤشراته الواضحة للعاقل بأنها ليست من وحي رب العالمين ."
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027021313/http://www.20at.com:80/masr/2khbar/6002.html"

