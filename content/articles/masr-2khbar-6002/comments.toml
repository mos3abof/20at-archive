author = ".ufgm زعبلة"
posted = "2007-05-23"
text = "خلاص كل مشاكل المسلمين اتحلت والمسلمين اخر تمام وكلهم شبعانين والحمد للة كل واحد عندة يخت ومرسيدس شبح وفيلا فى الساحل الشمالى وبعدين قاعدين نفكر فى ارضاع الكبير وبول الرسول والصحابة وكل اعمال التخريف التى تشغل الحكومة بها السذج والخدج واسافل الناس حتى ينشغلوا عن تعديل الكستور والاخوان وجواز الانجال وبلاوى الحكومة المتلتلة وكة كلام مجالس قهاوى وتصلح عند لعب الطاولة وموجات التنكيت على العجوز المتصابى"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027021313/http://www.20at.com:80/masr/2khbar/6002.html"

