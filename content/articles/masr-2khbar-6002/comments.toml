subject = ""
author = "واحد من الناس"
posted = "2007-05-24"
text = "يا جماعة أفهموا بقى … كل ده و انتم مش فاهمين يا نهار اسوح!!! … يعنى الحكومة كل شوية تطلعلكم قصة تلهيكم فيها و انتم شعب يحب اللت و العجن … مرة هالة سرحان … و مرة سفاح المعادى … و مرة التوربينى … و مرة عم الشيخ اللى اتفطم بدرى ده … و الشعب عامل زى الكورة المفسية فى رجلين الحكومة و ناس مشاكله و همه اليومى … فوقوا بقى و سيبكم من الهيافة و خليكم فى حالكم اللى اتقندل و انتم بتحكوا فى ارضاع الكبير … هوه انتم اصلا بقيتوا بترضعوا الصغير علشان ترضعوا الكبير ما كله لبن صناعى … مع ان مفيش احسن من لبن الام … الله يمسيكي بالخير يا ماما كريمة مختار"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027021313/http://www.20at.com:80/masr/2khbar/6002.html"

