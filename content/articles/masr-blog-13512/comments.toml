text = "يا رب يستجيب منها وماتلبسش الحجاب لغاية ما تموت وتورينا بئه كل ده نفعها بأيه<br />يا رب ما تكتب عليها الحجاب<br />وبصراحه العيب مش عليها دي واحده منحله العيب علي اللي خلوها تظره في التليفزيون واللي بيروحو يشوفو افلامها واللي بيتفرجو عليها في التليفزيون"
