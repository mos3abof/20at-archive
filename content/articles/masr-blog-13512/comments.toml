text = "ياجماعو انا مستعد اراهن اى حد ان الانسانة دى مريضة نفسيا اصلا<br />وعلى فكرة انا كدة مش مبشتمها انا بتكلم بجد<br />دى اكيد جرالها حاجة فى حياتها سواء وهى صغيرة او وهى كبيرة وحاسة انها غلظ فانفسها ان كل الناس يبقوا زيها عشان ماتتألمش لوحدها<br />زى مدمن المخدرات بالظبط بيبقى بيحاول يجر ناس كتير للطريق دة عشان مايبقاش لوحدة ويتعذب لوحدة"
