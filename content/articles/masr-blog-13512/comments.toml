text = "وجود الشخصية دي اساسا شيء مستفز دى تقريبا من عائلة ابليس اللي بتعثو في الارض فسادا ووقاحة و ابتذال مالوش نظير . و بعدين مدام عايزة تعيش في جو موبوء كده ماتغور في داهية بعيد عن مصر… الست دي كل ما اشوفها بحس اني عايزة اجيب اللي في بطني علي وشها.ربنا ياخدها و يريحنا من شرورها هي و امثالها و اللي بيوافقوا يمثلوا معاها كمان"
