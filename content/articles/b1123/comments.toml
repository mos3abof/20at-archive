text = "الي كل عامل في مصر وكل ممثل! وكل مسؤول<br />وكل وكل وكل<br />اعلم ان للكلمة صدي كبير وتكتسب الكتير من الغضب ولاكن في بعض الاحيان تكون شديدة الصدي<br />فارجو الي كل من يقول لا ان يعلم متي يقولها ومتي يستثنيها حتي لا يحدث مثلما حدت<br />فانا مازلت اقول لا وسوف استمر في قولي هذا ولاكن اين من يقدر معني هذة الكلمة الشديدة !!"
