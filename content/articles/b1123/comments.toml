order = 0
subject = "حلفت ما اقولك ]] لا [[ الا اذ قلت انساني قلت لك لا"
author = "ريم بنت السعوديةoooooooo"
posted = "2006-08-06"
text = "اهلا ومليوووووووووووون سهلا بكم ماراح اقول للكاتب [[ لا ]] فانا ساشارك معك في مواقفي مع لا اولا احب اقول اني خجولة ومن المجاملين ولا استطيع في بعض الاحيان اقول لا لاني ان قلتها سوف الاقي كلام شديد وعنف وانا ما اتحمل حساسة واي كلمة معها دمعة كموقفي مع امي او ابي او اخواني الكبار او استاذتي بالجامعة واسميه احترام لشخصهم اما الاماكن العامة والمنتزهات والملاهي فانا ساخذحقي ولا اكون امعة اقدمهم واكون الاخيره بل اقول لا لان حالي حالهم واما في مجتمعي بين اهلي واصدقائي فانا جدا مجامله وهذا جعلني محبوبة من الجميع فهي مجامله ممزوجة بحب و وئام وحرارة المشاعر وانا ايضا المس في اعينهم واقرا المجاملة [[[[[[[ وخلاصة كلامي لابد ان نكون وسط فلانكون لا ولانكون نعم بل لكل موقف مايناسبه من العبارات ]]]]] وشكرا محبتكم ريم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134431/http://www.20at.com/article2.php?sid=1123"

