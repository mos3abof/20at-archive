text = "اذا كان من حقى اكسر الخجل والخوف واقول لا فأنا عايزه اقول<br />لا لمبارك والمحروس ابنه<br />لا للظلم والفقر والهيمنه والذل والاستسلام<br />لا للنظام الفاسد<br />لا للشعب الساكت عن حقوقه<br />لا لخيبه الدول العربيه<br />لا للهيمنه الصهيونيه<br />لا للتفرقه العرقيه والدينيه<br />لا للكوسه والحلاوه الطحينيه<br />لا لا لا لا لا لا لا لا لا"
