posted = "2006-09-07"
text = "اسيب العز والجاة....واكل السمك البكلاة ..دة غير فلوسي اللي تغطي مصر من المعصرة للانفوشي...دة غير البرلمان اللي مليان خرس وطرش وعميان.....دة غير الخدم من الوزير الاول لغاية قائد عسكر طربوشي...دة غير الجرايد اللي بتكتب عني طول النهار...دة غير المباحث اللي صاحية من الصبح للعصرية عشان حركة كفاية اللي بيقولو عنها حركة شطار؟؟؟؟؟؟؟؟لكن علي مين دانا كنت طيار يا ولاد الحمار؟؟"
