subject = "الازوزة في الكازوزة"
author = "جمال مبارك"
posted = "2006-09-07"
text = "الازوزة في الكازوزة والعبارة في الدوبارة ونظيف في الوزارة وبابا في الرياسة وابن بابا في الوراثة<br />والمدام اخر شياكة والفلوس في البنوك والبزنس للتيوس والبوليس عندو اوامر اضرب الشعب المعارض اللي بيقول كفاية احنا وصلنا للنهاية مش باقول الازوزة في الكازوزة والعبارة في الدوبارة"
archived = "2006-11-02"
