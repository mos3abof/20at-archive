text = "انا بردو خجولة لكن عندى كرامة اوى<br />يعنى محدش ابدا يقدر يفرض عليا انى اقول لا مهما كان هو مين<br />يعنى انا بمزاجى وبس اقول لا فى الوقت اللى يعجبنى<br />وطبعا اسلوبى دا بيزعل ناس لكن ميهمنيش بناقص اللى هيزعلو دول<br />انا موش بسمع غير نفسى وبس<br />ميرسى باااى"
