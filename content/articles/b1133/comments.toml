[[comments]]
order = 0
subject = "aux mesulmants"
author = "haykel"
posted = "2006-08-10"
text = "عدو الحياة حبيب الظلام<br />لا يغرنك صحو الفضاء و انبلاج الصباح<br />فوراء الافق البعيد لهيب حزبالله فج و رياح و صوت و كفاح<br />نصرة للدين و الدنيا<br />على ملوك كساح<br />الغبار ينجلي<br />والفجر لاح<br />فهبو لبيك يا نصرالله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 1
subject = "ايه التنكيت دا"
author = "هنادي"
posted = "2006-08-11"
text = "ايه الهبل و العبط بتاع الناس دا؟؟؟<br />لبنان لا ها يفدها غنا و لا شعر<br />لبنان عايزة اللي يحارب معاها و يواسيها باللي يوقفها على رجليها............<br />لو ما نقدرش يبقى ما نستعبطش<br />واحد بيموت علشان محتاج نقل كلية اجيب له وردة وقصيدة؟؟؟ كفاية مسكنات بقى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 2
subject = "وجهة نظر غير سليمة"
author = "اسكندراني"
posted = "2006-08-11"
text = "كلام هنادي غير سليم بالمرة<br />وذلك لأن الحفلات الغنائية هو نوع من المشاركة الوجدانية لفلسطين ولبنان وإلا فما معني المظاهرات التي يقيمها وينظمها شباب الإخوان بالجامعات ؟؟؟<br />والتي قال عنها الأستاذ خالد مشعل مسئول حركة حماس أن مظاهرة واحدة من مظاهرات جامعة الإسكندرية تعادل عملية إستشهادية<br />لذلك أرجو عدم التسفيه من الدعم المقدم للمقاومة أيا كان هذا الدعم ماديا أو معنويا<br />فالنبي صلي الله عليه وسلم يقول لا تحقرن من المعروف شيئا وإن تلقي أخاك بوجه طليق أو كما قال صلي الله عليه وسلم<br />يا جماعة توكلوا علي الله وبالتوفيق وإذا كان في فرصة للسفر حنيجي ونشارك كمان لأن أخوكم منشد وباقول حلو أوي بفضل الله في المواقف الحماسية إللي زي دي<br />بالتوفيق وجزاكم الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 3
subject = "دعوة للتفكير العاقل"
author = "brainstorm"
posted = "2006-08-11"
text = "كم أتعجب حقاً من حماستنا التي تفتقر إلى الفكر المنطقي. يبدو أنها سمة غالبة علينا كعرب. فأي مقاومة تلك التي تتحدثون عنها أرها مقاومة ضد لبنان تتصرف بطيش من منطلق غوغائي حماسي لا يهمه الشعب أو الأرض المهم هو الشعارات التي لا تأتي بأي نفع. إنني أدعو الله أن يرحم لبنان والعرب من حماقة البعض منا وتهورنا تحت شعارات دينية أو قومية لا تتصف بأي حكمة. هذه الحماقة هي التي تمنح العدو الخارجي الفرصة ليفعل كما فعل الآن."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 4
subject = "لا تبالوا بالمثبطين"
author = "ابن عاشور"
posted = "2006-08-11"
text = "أيها الإخوة والأخوات في موقع عشرينات..فكرتكم رائعة ولا تبالوا بالمثبطين، واحد بيعتبر الدعم المعنوي للمقاومة تنكيتا، والثاني يشكك في واحدة من أشرف الظواهر في الوطن العربي..شكله واحد من أزلام النظم العربية المتواطئة مع العدو الصهيوني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 5
subject = "سيروا ولا تلتفتوا للمثبطين"
author = "ابن الخليج -السعودية"
posted = "2006-08-11"
text = "ياهو يالمثبطين سيبوا الناس في حالها..<br />والله عجيبة فعلاً لا انتو اللي اشتغلتوا ولا سبتو الناس تشتغل..<br />فعلا لبنان لا تحتاج للغناء لبنان تحتاج للغناء ولكل شي نقدر نقدموه لهم.<br />بصراحة: أنتم لا رحمتو الناس ولا خليتور رحمة ربنا تنزل.. عجيب والله عجيب..<br />تحية لموقع عشرينات ولكل شباب عشرينات.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 6
subject = "اية ؟؟؟؟؟"
author = "مادونا"
posted = "2006-08-12"
text = "اية دا ؟<br />اللى فوق دا عاقل ولا اية<br />انت ازاى تقول كدا لبنان بلد عربية بغض النظر عن المسيحين والمسلمين<br />وتانى مرة حاسب على كلامك يابتاع انت بليز وكفاية تعصب اعمى وخليك عاقل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 7
subject = "للأخ الصهيوني اللي فوق"
author = "ابن عاشور"
posted = "2006-08-12"
text = "للأخ الصهيوني بتاع لبنان مسيحي ما تدافعوش عنه، ومين قال انه لو حتى كله مسيحي ما ندافعش عنه؟ الرسول تكلم عن حلف الفضول وأثنى عليه والحلف كان دفاعا عن كل مظلوم وضد كل ظالم بغض النظر عن الدين، كفى تثبيطا أيها الصهيوني المندس وكفى دعايات مكشوفة ومفضوحة..اخرس ولا تفتح فمك بكلام فارغ مرة أخرى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 8
subject = "xxx"
author = "حمدى"
posted = "2006-08-12"
text = "لا حول ولا قوة الا باللة<br />انتو ماعندكمش دم اطلاقا واية ذنب المسلمين اللى بيتقتلو بلبنان ؟<br />وهى اصلا مش ارضهم واصلا اغلبها مسيحين<br />لية كل المسلمين مع المقاومة ؟<br />فين عقلكم ؟<br />بتدافعو عنهم وعن امريكا ؟ ههههههههه<br />ههههههه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 9
subject = "احييك جدا"
author = "كريم"
posted = "2006-08-12"
text = "فعلا واللهى<br />المفروض لبنان متكونش دولة عربية<br />لا تكون دولة غير عربية<br />وانا معاك ياحمدى<br />وطظ فيك يانصراللة ياغبى وياريتك هتستفيد حاجة ياهبل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 10
subject = "تصحيح"
author = "لبنانى"
posted = "2006-08-12"
text = "شو عم يحصل يالمصريين ؟<br />كيف تقولو هيك ؟<br />نحنا اخوة حتى لو مسيحين او مسلمين نحنا لبنانين وحقنا يغتصب امام اعينا<br />نحنا بلدة عربية ومايفرق بينا شى<br />بالة عليك ماتقول هيك مرة اخرى لاننا مانعرف للتعصب معنى بيننا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 11
subject = "كلام فارغ"
author = "أسكندراني"
posted = "2006-08-12"
text = "بعض الردود في هذا الموقع في منتهي الغباء وبعضها قليل أدب<br />أنا شخصيا لن أقرأ ردودا في هذا الموقع إلا إذا قامت إدارة الموقع بإتخاذ إجراء مناسب لمنع مثل هذه السخافات التي نقرأها<br />أتقي الله يا إللي أسمك حمدي لأن سيدنا النبي صلي الله عليه وسلم يقول ليس المسلم بالطعان ولا باللعان ولا الفاحش البذئ<br />خلي بالك من لسانك لأن مش كل الناس زيك وحاول تفهم طبيعة حربنا مع اليهود<br />هداك الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 12
subject = "وقاحة وتعصب يتستران بالدين"
author = "brainstorm"
posted = "2006-08-13"
text = "لم أكن أتصور أن يخرج علينا أحد الأشاوس بمثل هذا الكم من الوقاحة وعدم المعرفة. فأولا بالنسبة للأخ حمدي أقول له أن الأغلبية الحقيقية في لبنان هي للمسلمين وليس للمسيحيين وخاصة الشيعة - بالمناسبة - كذلك فإن التفكير بهذا المستوى الديني المتعصب يدل على عقلية مريضة لا أعتقد أنها ترضي الله سواء كنت مسلما أو مسيحيا. نحتاج أن نفكر بحكمة وألا نعتقد أن الله يمكن أن يشاركنا تعصبنا وشرورنا فحاشا لله من ذلك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 13
subject = "لا يجوز"
author = "سالمة"
posted = "2006-08-13"
text = "مرحبا<br />نعم لبنان اغلبها مسيحيين<br />فالمسيحين بلبنان يسكنون الشرق والشمال والغرب وبكل منطقة يشكلون 90 % منها<br />ماعدا الجنوب فهو العكس اغلبة مسلمون<br />هدا التوزيع الصحيح لبلدى لبنان<br />لكن مابدى نكرة بعض واللة وما شعر اى منا اننا مثلا اقلية او غير ذلك<br />وشو فى ان رئيسنا مسيحى هذا امر طبيعى لما يشكلة اعداد المسيحين هن<br />اتقى اللة اخى حمدى ولو بدكن كرة المسيحيين اذن ببلادكن وليس بلادنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 14
subject = "اقول اية بعد كدة"
author = "المنشد / محمد محمود"
posted = "2006-09-05"
text = "السلام عليكم ورحمة اللة وبركاتة : انا اعتذر لاننى لم اشارك منذ مدة معكم وذلك لانشغالى انا واخوانى فى فريق جنة المصرى الاسكندرانى فى اعداد وعمل حفلات خاصة باخواننا فى لبنان الذى يستحقون منا اكثر من ذلك واقسم لكم اصدقائى اننى فى حفلة كانت بنادى المحامين رايت بنات هم اخوات يبكون وكانهم من اهل لبنان وتمنيت ان اريكم اصدقائى مارايت فكم كان هذا شعورا طيبا من هذة الفتاة بارك اللة في كل اخواتنا ورزقهم اللة خيرا على اخلاغصهم وخلصنا اللة من هؤلاء الذين يشككون فى اهمية الاعمال الفنية التى هى نبض الشارع المصرى الذى لايعرف الان سوى القهر والظلم وخلصنا اللة من المنافقين الللهم امين اخوكم المنشد محمد محمود الجامعة العمالية الاسكندرية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"

[[comments]]
order = 15
subject = "الى اختى سالمة"
author = "الصادق"
posted = "2006-09-05"
text = "اختى سالمة كم انتى صاحبةشعور يهذ القلب جعلنى اعرف حقا ان اللة محبة وان المسيحيين كم هم اصحاب تسامح وانا مصرى واحببت ان اشاركك شعورك بان اقول لك انى احبك فى اللة وارجوا ان اراكى فى بلدك الثانى مصر اختى سالمة انتى حقا فتاة يحتذى بها كصديقة اخوكى ساتركك انتى تعرفين اذا اردت ذلك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132846/http://www.20at.com/article2.php?sid=1133"
