[[comments]]
order = 0
subject = "البورصة"
author = "مصطفى عصمت مصطفى"
posted = "2006-03-15"
text = "اولا اشكر ادارة المنتدى على استضافتى والشكر الاكثر على اتاحة الفرصة الى للتعليق ممكن للشباب ان يدخل فى مجال البورصة ويحقق ربح انا عمومانفسى اتعلم البورصة وكيفية التداول فى البورصة مرة اخرى اشكر ادارة المنتدى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114454/http://www.20at.com/article2.php?sid=5"

[[comments]]
order = 1
subject = "هي البورصة بس في الأموال"
author = "ديانا كرزون"
posted = "2006-05-09"
text = "يا خوي يا طارق ديلواني هي البورصة في الأردن بس في الأموال والأسهم ، صار كل اشي عنا بالأردن بورصة العمل بورصة ، والأكل بورصة ، ةاللعب بورصة ؟، حتى المتعة والجنس بورصة، واكبر دليل الساحة الهاشمية فيها بورصة للي بدو بنات وللي بدو أولاد(تبعون الأولاد) ، يعني في الساحة الهاشمية بتلاقي اللوطيين وتبعون الأولاد بيعملوا بورصة لكل ولد مين بيدفع أكثر بيطلع مهع وبسليه وصار في اقبال للخليجيين والعراقيين على هذه البورصةلأنهم بيحبوا ينوعوا بين البنات والأولاد وينبسطوا معهم<br />شكراً جزيلاًً."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114454/http://www.20at.com/article2.php?sid=5"

[[comments]]
order = 2
subject = "طلب مساعدة"
author = "ناصر"
posted = "2006-09-03"
text = "انا شاب طموع عمري 22 سنة و ارغب بتعلم اساسيات البورصة و المضاربة و لكن ليس لدي الامكانيات المادية اللتي تسمح بذلك ارجو من القراء الاعزاء مساعدتي ببعض النشرات او اي شئ من الممكن افادتي منه بهاذا المجال و لكم جزيل الشكر<br />اخوكم ناصر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114454/http://www.20at.com/article2.php?sid=5"

[[comments]]
order = 3
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-18"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114454/http://www.20at.com/article2.php?sid=5"

[[comments]]
order = 4
subject = "البورصه لعبه حقيره"
author = "على"
posted = "2006-09-19"
text = "كلها كذب بكذب ونصب واحتيال وبرامج يتم شراءها من الخارج ويتم تنصيبها على سيرفرات محليه والتحكم بها من خلال برامج خاصه<br />على - كمبيوتر وحاسوب ومدير دائره حاسوب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114454/http://www.20at.com/article2.php?sid=5"
