subject = "غيرت رايي"
author = "عبدالله مفتاح"
posted = "2006-02-13"
text = "غيرت رايي وهقول انا كنت ممكن اعمل<br />اول حاجه كانت هستخلص البرامج اللي بتبين ان الحب احضان وقبل(جمع قبله) والبرامج هتكون عبارة عن انواع من الحب محدش واخد باله منها كحب الخير او حب الاسرة لبعضها او حب زوج وزوجته<br />وهحاول يكون في برنامج يوضح ان اي حب يدخل فيه تصور الافلام العربي للحب يبقى مش حب<br />ولازم طبعا يكون في برنامج للدعاة للتحدث عن انواع الحب حبذا لو محمود المصري<br />اهم حاجه نبين ان اي حب مش شرعي يبقى قلة ......<br />من الاخر هحاول اصحح مفاهيم خاطئه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154916/http://www.20at.com/article2.php?sid=432"

[[comments]]
order = 3
subject = "اعزائى المشاهدين اليكم فقرانتا لليوم"
author = "نيفين"
posted = "2006-02-14"
text = "و الله يا جماعه لو هيطلبو منى اختار للتليفزيون فقرات للنهارده هختار مثلا افلام زى نهر الحب<br />خلى باللك من زوزو<br />حافيه على جسرؤ الذهب<br />لو اجنبى زى unfaithful<br />nine months u ve got email today<br />city of angels<br />bodyguard<br />لو اغلنى كل فيروز و عبد الحليم و فوزى و اسمهان و فريد<br />لو عبد الحليم شغلونى<br />لو فيروز انا لحبيبى و اديش كان فة ناس<br />لو اجنبى im alive<br />more than that<br />لو اجنبى قديمthe music played<br />strangers in the night<br />ولو اشعار<br />الى تلميذه و الرسم بالكلمات لنزار<br />كل حاجات كامل الشناوى<br />و لو اغانى حديثه<br />كل اغانى عمرو خصوصا وياك و حكايتنا يا روح قلبى حكايه<br />يا ليل لا تنتهى لكاظم<br />تنده اقول حاضر و بره الشبابيك لمنير<br />اكيد دا جزء من زوقى<br />يتاريت يكون عجبكو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154916/http://www.20at.com/article2.php?sid=432"

