[[comments]]
order = 5
subject = "هبهوب"
author = "السيده ريسه التلفيزيون : هبهوب"
posted = "2006-02-14"
text = "قررنا انا بصفتنا رئيس للتلفزيزن الجديد الاتي :<br />1- تشغيل برنامج بين الناس لمده 24ساعه .<br />2- تشغيل برنامج خلف الاسوار ايضا 24 ساعه , للتاديب ولمن تسول له نفسه بعمل حاجات وحشه.<br />3-اشعار الادان في القناه اللي طالعه فيها القناه التانيه .<br />4-رجوع المديعات المحجبات اللي شيلنهم بره دول.<br />5-مسسسح وتنظيف صوره الريس حسني مبارك بالقوة, نحن نعلم حجم الغتاته حين نخلع هده الصوره فلسوف تتحدث وتقول \" تكبها كدا تجلها كدا هي كدا\", بس مش معاياه , حنشغل الحاجه الساقعه حسسسسني , وبدلك يتجمد الريس ونخلع الصوره ال________.<br />6- ترحيل المذيع الامع \" مبيد فوري\" الي كوكب المريخ , رئيس التلفيزيون بعاتلي قالي عايز واحد يلمعلهم الكوكب بتعهم . يلا مع الف ورنيششش.<br />7- بعد صلاه الجمعه , كام ساعه انشاد لتنظيف اذن المستمع . لعملاقه الانشاد,ابو راتب , موسي مصطفي, عصام فتحي , ميس , ايو خاطر , العزاوي, _____________.<br />8-الست فيروز تغني في اول يوم افتاح ببلاش طبعا هي مش عارفه انا مين , واول كرسي لنفين واختي.<br />9- بالحق قلتولي المرتب كام ؟؟؟؟؟؟؟؟؟!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154916/http://www.20at.com/article2.php?sid=432"

