[[comments]]
order = 0
subject = "يمكن"
author = "مسلمه"
posted = "2006-05-05"
text = "الحقيقه فيه مواقع كتير عن الاسلام على الانترنت جميله جدا<br />والحقيقه انا باسأل فيهاكتير<br />وفيها مجموعه من التلاوات والدروس المفيده جدا وطريقتها جميله برضوا<br />احنا مش لازم نعمم<br />اللهم اهدنا الى ما تحبه وترضاه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124305/http://www.20at.com/article2.php?sid=760"

[[comments]]
order = 1
subject = "القرأن هو الاساس"
author = "ياسر شعبان"
posted = "2006-08-01"
text = "اخوانى المتحدثين عن الاسلام ان القران فيه كل التعاليم الخاصة بالاسلام ولذلك فان قراناه واستوعبناه فلن يشوه تفكيرك اى تفكير او راى او فتاوى سيئة بل انه ستجد نفسك قادرا على الرد على اى منها وللعلم فانه هناك دخلاء على النت يتعمدون الافتاء بصورة تشوه الاسلام.تعرفون لماذا؟لنفس الاسباب التى وضحت من آراء الاخوة ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124305/http://www.20at.com/article2.php?sid=760"

[[comments]]
order = 2
subject = "القراءن والسنة"
author = "صوت من الحياة"
posted = "2006-09-01"
text = "السلام عليكم ورحمة الله وبركاته<br />اصل الاسلام هو القراءن والسنةفمن تمسك بهما لن يضل ان شاء الله<br />وبالفعل هناك مواقع تدعى انها اسلامية وهى ليس لها اى علاقة بالاسلام واخرى بالفعل نستفيد منها الكثير<br />فلا يجب التعميم ولكن فى نفس الوقت لا نعتمد على الانترنت كوسيلة وحيدة لمعرفة اسلامنا<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124305/http://www.20at.com/article2.php?sid=760"
