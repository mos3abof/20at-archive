text = "صدق أيمن -أسأل الله أن يحفظه قائما وقاعدا وعلى جنبه - نعم إن ما أخذ بالقوة لا يرد الا بالقوة ، وإن البلاد لا تحرر الا بالدماء .<br />وإن أولى الناس بالمحاربة هم طواغيت العرب ، وعلى رأسهم ال سعود وحسني والاسد وملك الاردن."
