text = "ياه ملكش مكان يلعن رايه الا عند الاقباط عموما الندوات بصفه عامه بيبقي فيها اكل ولحمه وجاتوة وبعدين ميقلص صفحات الاهرام ولو حتي لليهود هي فارقه يعني محدش بيفهم حاجه من الحاج مظهر بتاع الازهر ولا زقزوق وبعدين عندنا 17 مليون امي في مصر احنا بس بنشتري جرايد علشان نلف فيها الاكل لتلميذ المدرسه ليس الا ودة مش جهل بس الواحد هيوجع دماغه ليه ويقرا لسرايا او غيرة واحنا مش عارفين اذا كان صحفي ولا سباك صحي ولا حتي بواب بمؤسسه الاهرام"
