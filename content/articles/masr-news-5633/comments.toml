text = "سامحك الله يا عبد الصمد… و اعتقد ان العقل المريض وحده هو الذي يسب الناس بالباطل …و المصطلح اللي تاعبك ده عربي صميم لا علاقة له بمصر أو السعودية ..و لكن خيالك المريض الكاره للعروبة سول لك اني سعودي.. انا مصري أصيل… و أتحداك ان كنت تعلم معنى العلمانية التي اتحدث عنها…انصحك بان تبقى في منتديات الكورة و المزيكا و فيديوهات الموبايل و ملاكش دعوة بالكلام الكبير ده يا حمادة"
