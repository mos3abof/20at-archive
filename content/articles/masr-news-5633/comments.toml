[[comments]]
order = 6
subject = ""
author = "المواطن مصرى"
posted = "2007-04-29"
text = "بصوا ياجماعة قبل ماتتتجروا للشرك دة المقالة دى تحريضية لية بقى لان اسامة سرايا رغم عدم اعجابى بية الا انة ولا مرة اتكلم فى موضوع الحجاب بالرغم انة هارينا مقالات دى واحدة غير ان كاتب المقال استعمل ذكائة فخللى الكلام دة فى لقاء مش مقالة واية كمان فى كنيسة ؟<br />ياسلام يعنى الراجل دخل الكنيسة يقول الحجاب ضار وياسلام بقى دكتور وبيتكلم عن مضار الحجاب لاننا فى درجة حرارة مرتفعة 40 ؟ دة على سبيل ان معندناش 3 فصول درجة الحرارة بتبقى حوالى 20<br />ياجماعة المقالة دى تحريضية لان المتكلم هوا رئيس تحرير الاهرام يعنى راجل مسئول ولان مافيش حد اتكلم عن الكلام الاهبل دة غير المقالة دى<br />وبعدين اربط موقفة المزعوم بموقف تعيس العقل وزير الثقافة توصل على طولل لاستنتاج ان دة موقف الحكومة خصوصا ان مافيش حد سلم من الشتيمة حتى شيخ الازهر بالرغم من ان لحوم العلماء مسمومة ولايجابة العالم الاعالم مثلة<br />فاضل بقى الهدف الاعلى ؟ انتوا ياشعب مبتقوموش بثورة لية فى وجة الكفار دول<br />واللة اعلم بمين هما الكفار"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130205747/http://20at.com/masr/news/5633.html"

[[comments]]
order = 7
subject = ""
author = "الفارس"
posted = "2007-04-29"
text = "بجد أسوأ مقال … لا لا مش اللى مكتوب هنا لا لا . أنا أقصد مقال أسوأ رئيس تحرير للأهرام سابقا ولاحقا فلا أظن أسوأ من هذا الرجل يمكن أن يحتل هذا المنصب. لو قرأت مقاله ستجده مليان بل طفحان \"زى البلاعات لمل تطفح\" بالنفاق . أنا أحيانا أكاد أتقيأ عندما أحاول أن أقرأ له مقال من شدة النفاق. الذى يخرج منه. وأكثر من ذلك تلك البلاهة الشدية التى يستخدمها فى تحليل القضايا التى من المفترض أنه يناقشها . مش ممكن ده لو صحفى فى سنة أولى إعلام ما يعملش كده … بجد بجد حرام واحد زى ده يحتل هذا المنصب المرموق . الذى جلس عليه أساتذة و عباقرة ومفكرين من الطراز الأول . بس بجد هو نفسه مش مصدق نفسه أنه بقى رئيس تحرير الأهرام … عشان كده نازل وهات يا نفاق وتعالى يا نفاق وروح يا نفاق. بجد أنا لو كنت النفاق نفسه والله كنت زهقت منه… وبعد كل ده جاى روح (…) يفتى فى الدين لا مش كده وبس والطب كمان ويقول يؤثر سلبا على الصحة. إيه اللى عرفة هو إن ده ممكن يؤثر على الصحة. كان عمل أبحاث عليه ولا هو أخذته الجلالة من كتر ريحة العفن اللى طالع من مقالاته عشان يفتى فى الدين والطب فى جملة واحدة وفى نفس واحد …\"هو شكله فعلا كان نفس بانجو بس تقيل حبتين\" ——————- فى إحتمال واحد باقى إنه مغرور أيوة مغرور بقرعته ومفكر إن كل الشعر لما يخف الصحة تتحسن والتهوية تبقى تمام احتمال هو أدرى"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130205747/http://20at.com/masr/news/5633.html"

