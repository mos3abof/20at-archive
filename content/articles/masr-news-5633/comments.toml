[[comments]]
order = 1
subject = ""
author = "الى المصرى الحزين تانى"
posted = "2007-04-29"
text = "بص ياعم الحاج الاول يعنى اية مصطلح ؟<br />ربما تكون ضعيف فى الثقافة المصطلح هو ماصطلح الناس على التعبير عنة بكلمة محددة علشان كدة كلمة فئة ضالة دى كلمة عربية انا عارف بس ياعم الشيخ محدش فى مصر مثلا بيستعملها لكن كتير دلوقتى فى السعودية بيطلقوها على الارهابيين والعلمانيين حسب تفكيرهم وانتا ادرى بيهم ؟ فهمت ولا لسة<br />طيب<br />وبعدين تسالنى عن العلمانية بص ياعم هما الشيوخ بتوعك قالولك اكيد ان العلمانى هو الكافر الزنديق الذى يؤمن بطبيعة الاشياء المادية فقط ؟ زى لما قالوا ان الاشتراكى كافر وملحد ؟؟؟؟؟؟؟؟؟<br />بص ياعم الحاج العلمانية مصطلح طلع بعد الحرب العالمية التانية مباشرة وكان تنظير من واحد المانى اسمة نيتشة زمان قبل كدة واخدوة وقالو علية بتصرف انة تجريد الحقائق وخرج منة حاجة اسمها التخصص وتقسيم العمل اللى كانت نواة للتقدم اللى العالم كلة فية الا احنا .<br />بتقولى اروح منتديات الكورة ؟ جميل هوا مش سيدنا عمر بن الخطاب قال علموا الولادكم السباحة والرماية وركوب الخيل ؟ يعنى الرياضة حلال الحلال<br />والمزيكا طيب نقر الدفوف حلال والمزيكا كتير من الشيوخ افتوا بانها حلال بشرط متخاطبشى الغريزة<br />ومنتديات الموبايل ماهو دى حضرتك تكنولوجيا مقدرناش نصنعها طب نفهمها<br />وعموما سعاتك الحاجات دى وغيرها بتكون حاجة اسمها دنيا<br />فهمت ياعم الشيخ<br />اشك ؟ طب ارجع لشيوخك بتوع السعودية واسالهم هوا لية فية 50 حالة حمل من زنا محارم فى السعودية ؟<br />هوا لية الزنا بقى جنب الحرم ؟ بالرغم من غسيل الدماغ اللى عملوة ليك ولغيرك<br />عارف لية ؟ لان الايمان بالقلب مش بالعصاية"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130205747/http://20at.com/masr/news/5633.html"

