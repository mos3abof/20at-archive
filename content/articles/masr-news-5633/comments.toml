text = "مش عارف الناس دى فى دما غة اية شكله كدة صاحب وزير الثقافة وزيزة طبعا انتو فهمين لاحول ولا قوة الا بالله واحد بنتة تقولة هدخللك الجنة وهو يقوله لا طيب فية اية تا نى وااللة ان شاء ربى ما هتشوفها دة عاوز يتحول على سريا مشتشفى المجنين فعلا نحن فى زمن الردة والبهتان اكتب ما شات ولا تخجل يا جبان فيا حسرة على الا يمان الا سم مسلم ولا اظن ان يعرف شى عن الا يمان حسبى ربى وهو نعم الوكيل"
