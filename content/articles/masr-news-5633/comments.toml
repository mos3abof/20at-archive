order = 11
subject = ""
author = "محمود البستنجي - الاردن"
posted = "2009-03-18"
text = "الحمد لله الذي جعلنا مسلمين وكفا بها من نعمه وجعل القران الكريم بيننا نقرأه اناء الليل واطراف النهار يقول الله تعالي في سوره الاحزاب (يا ايها النبي قل لازواجك وبناتك ونساء المؤمنيين يدنين عليهن من جلابيبهن ذلك ادنى ان يعرفن فلا يؤذين وكانالله غفورا رحيما لئن لم ينته المنافقون والذين في قلوبهم مرض والمرجفون في المدينه لنغرينك بهم ثم لا يجاورونك فيها الا قليلا ملعونين اينما ثقفوا اخذوا وقتلوا تقتيلا سنه الله في الذين خلوا من قبل ولن تجد لسنه الله تبديلا ) هذا قول الله ومن احسن من الله قيلا - اما المنافقين ومحاربي المسلمين الذين يقولون (الذين اذا قيل لهم لا تفسدوا في الارض قالوا انما نحن مصلحون الا انهم هم المفسدون ولكن لا يعلمون ) قول الله تعالى اما الذين يريدون ان يغيروا سنه الله واوامره فعليهم لعنه الله في الدنيا وفي الاخره لهم عذاب عظيم - انتبهن اخواتي بنات الاسلام في مصر عليكن ان تتبعن اوامر الله بارتداء الحجاب وعدم سماع او قرأه ما يقوله اولئك المفسدون وما اكثرهم في هذا الزمان ولا حول ولا قوه الا بالله العظيم ."
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130205747/http://20at.com/masr/news/5633.html"
