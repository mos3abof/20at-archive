text = "أنا مش فاهم إنتم تعبانين من العلمانية ليه ؟؟<br />هو يعنى لازم نبقى زى أفغانستان علشان نبقى كويسين ؟؟؟<br />ما العلمانية ماشية زى الفل فى كل حتة فى العالم و كل الناس المتحضرين المتقدمين علمانيين …<br />الدين ده علاقة خاصة جدا بين الإنسان و ربنا .. و مش معنى إنك علمانى يبقى كافر ولا ملحد ولا ملكش دين ولا ملة .. لا أبدا …<br />العلمانية بتقول إن الكل متساويين و مفيش حاجة إسمها دين يتفرض على الناس ولا دين للدولة .. ناس بتسيب الناس تعمل اللى هى عاوزاه طالما ملتزمين بالقانون .. فيها إيه غلط دى ؟؟؟؟<br />أما و الله أمركم غريب !!!!!"
