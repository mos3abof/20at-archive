[[comments]]
order = 0
subject = "هل أنت فضولي"
author = "أحلام فاضل"
posted = "2006-05-01"
text = "الحقيقةأناشخصيةليست فضولية,ولا أهتم بشؤن الآخرين إلا بما يسعدهم حقيقة, ولكن لدي أخت الله أكبر فهذه الصفة لاتكفيها, فهي تجد نفسها أم الجميع كما تقول ,وهي ذات الخبرة الكافية التي تعطيها الحق في توجيه الآخرين وفرض رأيها سواءا بالود أوبقوة الصوت والغلبة, نعم فهي تحب الإطلاع والتعرف على أحوال الآخر مع التحفظ على أحوالها ,فهي تطبق مقولة \"داووا أموركم بالكتمان\"لشخصها ولمن يهمها أمرهم ,أما للآخرين فتطبق عليهم مقولتها المعهوده \"كون إنسان واضح وصريح\"و\"الي عندو سر ,إذن عندو بلا أي مصيبه\" وشكرا لكم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134656/http://www.20at.com/article2.php?sid=754"

[[comments]]
order = 1
subject = "فضولى بشكل طبيعى"
author = "مسلمه"
posted = "2006-05-02"
text = "نتيجه الاختبار طلعتلى كده<br />مع انى حاسه انى فضوليه جدا(وده عيب خطير) لكن الاسئله جات لصالحى<br />بس اعتقد انى مش فضوليه قد مانا باحب اعرف وافتش عن اى حاجه اسمع عنها<br />يعنى ماحبش اقرا حاجه او اسمع خبر جديداو اسمع عن ممارسات غريبه او فتوى جديده الا اما احب اعرف ايه ده ولازم اعرفه علشان انا موجوده يبقى لازم اعرف كل حاجه لانى ممكن احتاج المعلومه او حتى الفتوى الغريبه فى يوم من الايام<br />يمكن دى فضوليه بس انا حباها جدا<br />وكمان مبحبش مكونش عارفه حاجه عن اللى حواليا لازم اعرف بيتصرفو ازاى واراقبهم فى مواقف كتير علشان احكم عليهم \"ويمكن ده مرض\"<br />اللهم اهدنا واشفنا واشفى مرضى المسلمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134656/http://www.20at.com/article2.php?sid=754"

