[[comments]]
order = 3
subject = "الفضول وحب الاستطلاع"
author = "وائل الشريف"
posted = "2006-05-03"
text = "اعتقد ان الفضول هو البحث عمايخص الاخرين والشعور برغبة عارمة في معرفة ادق الاسرار وده فضول مميت ورخم ام الفضول لمعرفة احوال شخص عزيز عليك يمر بحاله نفسيه سيئه فأعتقد أن ده فضول كويس بدافع الرغبه في مساعده هذا الصديق بأي شكل كان أما حب الأستطلاع فأعتقد انه لا يندرج تحت قائمه الفضول ولكن بندرج تحت قائمة الأستزاده من علم أو من أخبار أو احداث مما ينتفع به الأنسان والعالم كالعالم والصحفي والطبيب والمخترع.(انا شايف ان ده موضوع جامد جدا وبشكر كاتب هذا الموضوع على طرحه للمناقشه)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134656/http://www.20at.com/article2.php?sid=754"

