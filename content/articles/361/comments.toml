[[comments]]
order = 3
subject = "تحدي مصاعب الحب"
text = "من الممكن تحدي الانسان المصاعب من اجل الحب الموجود في الدنيا فيكون الانسان متحدي الصعاب مثلا تحديه لا هله من اجل انسان اخر الحب وتكون النتيجه خيانه في خيانه وهذا حل في وقتنا الحاي من المغامره الصعبه......."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018173822/http://www.20at.com:80/article.php?sid=652"

[[comments]]
order = 4
subject = "قطوب"
text = "نفسي حد يسأل أثامة باشا ده عن حياته العاتشفيه، وهل هو متجوز وللا ايه ظروفه ؟ وايه مدى خبرته ودرايته وهل عنده خلفيه قوية تأهله انه يسهوك قصدي يوجه الناس وينصحهم كأنه حكيم العشاق زي ما احنا بنسمع كدة..<br />أنا في اعتقادي ان أثامة ده ممكن يكون شخصية خيالية من استخراع الحكومة، زي أبو مصعب الزرقاوي كدة، بس أثامة شغلته يقتل الفراغ عند الناس الفاضية، لكن أبو مصعب شغلته يقتل الناس الفاضية، ويسيب الفراغ..!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018173822/http://www.20at.com:80/article.php?sid=652"

[[comments]]
order = 5
subject = "احمد خان"
text = "السلام عليكم ورحمه الله<br />انا مش معترض على البرنامج ده يا جماعه ...بس معترض على الي بيقدم البرنامج جدو اسامه منير<br />انا اول ما سمعت البرنامج حسيت ان الراجل ده في التلاتينات وصوته من الاصوات الي البنات بتحبها<br />المهم...انا كنت مع الراجل ده في حفله قبل كده ..انا اول ما شفته وعرفت ان اسامه منير اتفزعت<br />الراجل ده والله معدي 55 سنه واكتر كمان..وفاكر نفسه شاب ..لا ومش اي شاب كمان ..ده شاب روش اوي<br />وعلى فكره لو تلاحظوا ان برنامجه اغلبيه الي بيخليهم يتكلموا في التليفون كلهم بنات..وحسيت انهم بنات مش ولا بد اغلبيتهم دبلومات..وحجات غريبه<br />انا نفسي واحد يقدر يتصل بيه في برنامجه ويسئله عندك كام سنه؟؟؟؟"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018173822/http://www.20at.com:80/article.php?sid=652"

[[comments]]
order = 6
subject = "أنا والنجوم وجفاك..!!"
text = "عايزين برنامج يكلمنا عن علاقتنا مع ربنا ..يفهمنا نعمل ايه علشان نتوب ...يعلمنا ازاي نكون له أقرب<br />عايزين برنامج يعلمنا ازاي نعيش وازاي نموت ..عايزين برنامج يفهمنا هنرجع فلسطين ازاي وبغداد هتعود امتي ...<br />عايزين اسامة ....بن زيد..!!<br />بيرو"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018173822/http://www.20at.com:80/article.php?sid=652"

