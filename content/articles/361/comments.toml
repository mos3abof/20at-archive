text = "يا جماعه اسامه منير دة راجل بيحض البنات والشباب علي العلاقات المحرمه والبرنامج بتاعه ملوش هدف تاني وعنال يستعبط ويتسهوك والبنات عاجبها موت<br />يا جماعه حرام حرام حرام"
