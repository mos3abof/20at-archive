[[comments]]
order = 9
subject = "حكايتي مع البرنامج"
text = "تعرفت على البرنامج ده من اختى، حيث كانت من عاداتها أنها بتذاكر بالليل على صوت الراديو، و في مرة حكيت لى عن البرنامج، بس بصراحة كان شكلها قرب يجيلها \"نقطة\" من المذيع و من البنات اللى بتتصل ومن الحكايات السخيفة، و حاولت انها تحضنى على الاستماع الى هيافته مرة، لكن للأسف كنت بنام بدرى، و تصادف انه فى يوم خطوبتي و اثناء رجوعنا مع اخى و اختى و خطيبي استمعنا الى جزء منه فى راديو العربية، بصراحة اول ما سمعت الصوت وطريقة الكلام، قرفت و معدتى قلبت و أخى اتريق على المذيع ورجيته ان يقلب المحطة، بصراحة لم اتحمل ان استمع لهذه الهيافات خاصة وان خطيبي كان يجلس بجانبي، يعنى بالعربي انكسفت منه، حسيت انه برنامج مايختشيش"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018173822/http://www.20at.com:80/article.php?sid=652"

