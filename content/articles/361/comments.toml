[[comments]]
order = 12
subject = "المشير سوار الذ هب"
text = "بصراحة الموضوع ممتاز وبيناقش قضية مهمة أنا مع ان يكون فيه برامج زى الزفت أسامة ده بس المشكلة مين الى يقدمها المفروض من وجهة نظرى انه يكون شاب ملتزم داعية عنده علم شرعى و علم وخبرة دنيوية وحياتية الاثنين مع بعض لأن حاليا الحب فعلا موجود وبدل ما يجى واحد زى ده يشوهه ويدفع الاثنين اامعصية يكون فيه واحد يرشدهم لكيفية الارتقاء بمشاعرهم دى عشان تكون فى طاعة ربنا"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018173822/http://www.20at.com:80/article.php?sid=652"
