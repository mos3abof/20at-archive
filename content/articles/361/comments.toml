[[comments]]
order = 0
subject = "بيرو"
text = "حراااااااااااااااااااااااااااام<br />كله كوم والبرنامج ده كوم تاني ..<br />البرنامج ده هو أكتر حة بتخليني احس ان البلد كلها فاضية ..<br />بدأت علاقتي بالبرنامج عن طريق اخويا ..لقيته في يوم الساعة 2.00 بالليل بيطنطط فوق السرير وانا نايم وبيقولي ....:أنا موش مصدق نفسي أنا كلمت أسامة ...<br />ومن يومها سمعت البرنامج ده حلقتين تلاتة ..بس بصراحة ..مقدرتش استحمل بعدها .."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018173822/http://www.20at.com:80/article.php?sid=652"

[[comments]]
order = 1
subject = "زمزم"
text = "انا سمعت البرنامج ده بعد ما لقيت فعلا كل الناس بتتكلم عنه بس بصراحه مالقيتش فيه غير (سهوكه)من اسامه اللى مسمينه صوت الحب<br />ورايى ان الناس اللى بتكلمه عشان مشاكلهم دى ناس تافهه هو مين يعنى عشان يقولك اعملى ايه وماتعمليش ايه<br />اهو دلع والسلام"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018173822/http://www.20at.com:80/article.php?sid=652"

