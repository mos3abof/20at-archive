author = "آية"
posted = "2007-01-29"
text = "واضح انها بقت ظاهرة بجد … مش في المساجد بس لا في الجامعة كمان …<br />هو انا شخصيا مش اتعرضت للموقف … بس دخلت انا و صاحبتي نصلي في الكلية في حجرة الطالبات و احنا خارجين … فضلت تدور على حذائها … فص ملح و داب… و هي تدور و انا ادور و البنات اتلمت تدور … و في الاخر كلمت والدها عدى عليها خذها من الكلية و هي بالقبقاب …"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105225851/http://20at.com/20at/lifestyle/3127.html"

[[comments]]
order = 3
subject = ""
author = "محمد الكسيح"
posted = "2007-01-30"
text = "كل ما ادخل أي جامع ألقي ورقة في كل حتة خلى بالك من متاعك خلى عينك على الجاكتة<br />جنسه أيه بن اللئيمة اللى بيسرق من المساجد وسط ناس في صلاتها قاعدة اللى خاشع واللى راكع<br />غصب عني لقيتني بأضحك بس كانت ضحكة مرة لما جه في بالي صورة أني جيت أصلي مرة<br />بس حتى قبل ما أدخل او حتى أقول سلام الاقي ورقة بيقولوا فيها أنهم سرقوا الإمام"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105225851/http://20at.com/20at/lifestyle/3127.html"
