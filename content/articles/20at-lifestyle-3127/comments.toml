subject = ""
author = "محمد بن الجراح"
posted = "2007-01-27"
text = "السلام عليكم<br />ياااااااااااااا اااااااه ، العديد و العديد من المرات ، اولها كان شبشب جديد يعتبر ثاني مره ارتديه و عندما ذهبت للصلاة و بعد الانتهاء منها قمت لاذهب لاخذ الشبشب و لكني لم اجده ، و لكن الحمد لله البيت كان بجوار المسجد ارسلت اخي فأتي لي بأخر ، المرة الثانية كانت في رمضان و ذهبت للمسجد الذي بجوارنا وبعد ان انتهينا من الصلاة ذهبت لاري الخذاء فلم اجده ، المرة الثالثة كانت في اول ايام رمضان ( مش عارف في ايه ) وضعت الحذاء في اخر المسجد و بعد الانتهاء من الصلاة لم اجده و لكن هذه المره كان المسجد بعيدا عن البيت ، فقام امام المسجد بأعطائي شبشب جديد و ذهبت الي المنزل ثم في اليوم التالي رددته الي الامام …"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105225851/http://20at.com/20at/lifestyle/3127.html"

[[comments]]
order = 1
subject = ""
author = "سيف الإسلام"
posted = "2007-01-28"
text = "الحمد لله رب العالمين عمرها ماحصلت معايا الى فى السعوديه<br />متفكروش الحكايه دي فى مصر بس<br />لا دي فى كل دول العالم وحتي جوا مسجد المدينه المنوره ومكه المكرمه<br />وانا الحمد لله عمري مااتسرق مني حاجه فى مصر<br />فى السعوديه والامارات حصل معايا الكلام دا ومشيت حافي كمان<br />لان الناس ماسعدتنيش<br />زي المصريين الطيبين<br />بحبك ياام الدنيا مهما عملتي فينا"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105225851/http://20at.com/20at/lifestyle/3127.html"

[[comments]]
