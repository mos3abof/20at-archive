[[comments]]
order = 1
subject = "الرئيس الشرعي"
author = "أحمد بلال"
posted = "2006-10-19"
text = "و مهما كان ما كان<br />فإن ما يحدث الآن لا يهين الرئيس صدام حسين بقدر ما يهيننا نحن كشعوب عجزت عن تغيير حكامها فأتى إلينا الغرب حاملا ديمقراطيته داخل فوهات البنادق ودانات المدافع<br />جاؤا الينا بحجة التحرير فقتلوا منا اضعاف ما قتل في عهد الرئيس الشرعي للعراق صدام حسين<br />و برغم اختلافي مع الاسلوب الذي مارس به صدام حسين السلطة و هو اسلوب ديكتاتوري لا يختلف كثيرا عن يقية الحكام العرب الذين تفوق ديكتاتورية البعض منهم ديكتاتورية صدام حسين<br />برغم الاختلاف الا اننا يجب علينا جميعا ان صدام حسين هو الرئيس الشرعي للشعب العراقي لان الاحتلال هو الذي ازاحه عن السلطة و الاحتلال باطل و ما بني على باطل فهو باطل<br />صدام حسين الديكتاتور السابق و المعتقل الحالي لا يستحق منا في هذه اللحظات شماته و لا تهكم صدام و برغم كل مساوئة لا يستحق من وجهة نظري اللحظية سوى نظرات اعجاب لمعتقل يحاكم قاضيه و جلاديه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152517/http://www.20at.com/article2.php?sid=1358"

