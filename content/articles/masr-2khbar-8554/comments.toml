subject = ""
author = "عمرو ابو النجا"
posted = "2008-03-21"
text = "سيد على هو قلم ولسان الاماراتيين فى مصر خاصة رجال المال و الاعمال هناك،بالضبط زى ما لميس الحديدى ومصباح قطب عمرو اديب كلاب لمحمد العبار فى مصر ،ويبدوا ان سيد على واخد موبيل جديد او ساعة رول[ *** ] وطمر فية فكتب الى كتبة ،ويمكن علشان ساويرس مارضاشش يعمل برنامج لسيد على على otv يهبش منة كم باكو زى الى بيهبشم غيرة من الصحافيين فى الفضائيات .<br />يعنى الجنازة حارة والميت والمعزين كلاب فى كلاب وكلها مصالح شخصية وياميت خسارة على الصحافة المصرية."
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100539/http://www.20at.com:80/masr/2khbar/8554.html"

[[comments]]
order = 1
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-03-21"
text = "يسلم بقك يا استاذ سيد على .ومن هذا ساويرس لكى يشهد بنزاهه دحلان اولى له ان يبحت عما يشهد له عن نزاهته وبعدين يروح يبرء العملاء الكلاب<br />كلنا نعلم من هو دحلان الخائن العميل الكبير<br />وايضا نعلم من هوساويرس<br />ولكن افضل من هذا وذاك نعرف جيدا حماس الحركه المناضله الشريفه هى وكل مؤسسيها ومن فيها التى كل ما تجنيه هذا بسبب انها تتكلم بأسم الاسلام"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100539/http://www.20at.com:80/masr/2khbar/8554.html"

[[comments]]
order = 2
subject = ""
author = "علي سيد سيد علي"
posted = "2008-03-21"
text = "تخريب وتدمير غزه بالكامل اصبح وطنية<br />واللي عايز يرفع المعاناه عن شعبه اصبح خائن<br />وبعدين ايه الصورة اللي انتوا حاطينها دي ممكن تشرحولنا معناها ايه يعني تقصدوا ان الراجل بيشرب خمرا ولا ايه<br />الراجل دحلات دا يا جماعة عارف ان اسرائيل ليها بداية ونهاية في القران ولسه ما جاش وقت النهاية لسه بدري لان زوال اسرائيل مقمدمة لعلامات الساعة الكبرى<br />فلسه ما جاش الوقت ولحد ما يجي الوقت خلي حماس تستفز اسرائيل واسرائيل تدمر في غزه"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100539/http://www.20at.com:80/masr/2khbar/8554.html"

[[comments]]
order = 3
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-03-21"
text = "الصراحه انا احتقرت ساويرس لما دافع عن دحلان ,,انا كدا كدا مش طايق ساويريس بس مشوفتش عليه فساد مالى او حاجه الا قناه OTV والقرف بتاعها وتصريحاته على الحجاب<br />لكن لما يقول انه على علاقه شخصيه بجاسوس حقير مثلا دحلان وعلاقه شخصيه لمده 10 سنين<br />اذا ساويرس دا لازم يت[ *** ]ر"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100539/http://www.20at.com:80/masr/2khbar/8554.html"

[[comments]]
order = 4
subject = ""
author = "ابوصالح"
posted = "2008-03-21"
text = "طالما ان نجيب سوارس هو البيدافع عن دحلان يبقى اكيد هذا الدحلان فاسد كبير لية؟ لان السيد نجيب سويرس مفيش دول واخد فيها شغل الا وتطالة رائحة الفساد ومفيش حد يعمل الثروة الضخمة دة اكيد من الحلال الا واكيد ثروة طالة الحرام والفساد على مصراعية فلما واحد زى دة ويجى يدافع عن دحلان يبقى اكيد فاسد زية (الطيور تقع على اشكالها)<br />وبالنسبة الاستاذ سيد على الصحفى فهو راجل محترم وبيحارب الفسادين بس ساعات بيكون الفساد اقوى بسطوة الفلوس والاعلام ؟؟… هو دة تحليلى الشخصى الى السجال الصحفى القائم … وشكرا"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100539/http://www.20at.com:80/masr/2khbar/8554.html"

[[comments]]
order = 5
subject = ""
author = "أبو عمار"
posted = "2008-03-21"
text = "الله ينور يا أستاذ سيد<br />عاوزين أقلامنا الوطنية الشريفة تدافع دايما عن الشرفاء والوطننين وتفضح العملاء والمرتزقة والذين يبيعون بلادهم ليل نهار فى أسواق اللى يدفع أكثر<br />وأظن إن دفاع واحد زى ساويرس اللى كلنا عارفين علاقته بالأمريكان أكبر دليل على عمالتهم الاتنين<br />يا ريت مصر بلدنا اللى عذبت الفلسطينيين علشان يعترفوا بتفاصيل المقاومة ومكان احتجاز القرد شاليط يخلوا عندهم شوية دم ويطردوا دحلان من بلدنا .. أصل العملية الصراحة مش ناقصة نجاسة .. كفاية علينا ساويرس والحزب الوطنى وفاروق حسنى"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100539/http://www.20at.com:80/masr/2khbar/8554.html"

[[comments]]
order = 6
subject = ""
author = "شايف"
posted = "2008-03-21"
text = "سويرس ودحلان فردتان لجزمة واحدة - عملوا فلوس ومليارات من المخابرات المركزية<br />سويرس اشتغل فى الاتصالات والمحمول كواجهة فى الدول المتخلفة زى مصر والجزائر واليمن وفى الاتصالات بيشتغل هناك مخابرات يهود وامريكان وبيتصنتوا على كل صغيرة وكبيرة فى البلد - يعنى بالمفتشر عارفين دبة النملة فى البلد<br />اما دحلان فرجل امريكا واسرائيل اللى حط السم لعرفات ا"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100539/http://www.20at.com:80/masr/2khbar/8554.html"

