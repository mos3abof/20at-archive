text = "قرات التعليقات والمقال فوجدت معاطفين مع الكاتب وعلى الع[ *** ] مطعاطفين مع الى ما يتسمو لكن يجماعه الفروض نكون احسن من كده وننظر للؤمور بننظره فيها شموليه اكتر من كده نعرف مين عدونا ومن الخاين والعميل ومين الوطنى واظن ان الاحداث وضحت الدنيه فمنتشغلش بان نرد على الخونه او القرود واعونهم لكن احنا محتجين اكتر نرجع لدنا بشموليته علشان امثال الخونه ميتطاولوش وعلشن يقفو عند حدهم وعلى راى المثل ايه يفرعون فرعنك ملقتش حد يلمنى"
