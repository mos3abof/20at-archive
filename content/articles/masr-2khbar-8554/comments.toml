text = "لو صدقت مزاعم ساويرس بأن حماس عميلة لسوريا وايران ، فأعتقد أن العمالة لهاتين الدولتين أشرف الف مرة من العمالة لإسرائيل وأمريكا.. ساويرس الذي يدعى الوطنية هو المصدر رقم واحد للعمالة المصرية لإسرائيل، وشركة اوراسكم تقوم بالإمدادات اللوجستية للقواعد الامريكية في الخليج"
