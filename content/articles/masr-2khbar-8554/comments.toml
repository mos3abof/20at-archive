posted = "2008-03-22"
text = "اصبحت حماس هيه العميله وهي من تسببت بمعاناة الشعب الفلسطيني وبالمره هيه المتسسبه عن ن[ *** ]ة 67 وهزيمة 48 بل باقتحامها للحدود كما يزعم ممكن نقول انها السبب في ازمة العيش وارتفاع الاسعار!!!!!!!! !!!!!!<br />لا اريد ان ياخذ الموضوع منحي طائفي فكم من المسيحين لهم تاريخ وطني عريق للدفاع عن الامه<br />ولكن المتخمين امثال ساويرس لا يعرفون معني النضال والجهاد في سبيل قضيه بل عنده م نموذج الوطنيه يتمثل في دحلان<br />صدق القائل الطيور علي اشكالها تقع"
