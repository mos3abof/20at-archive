posted = "2008-06-08"
text = "كل العرب واولهم حماس ليس الا خونة لبلادهم علشان كدة هاربين فى الدول العربية او فى الجحور مثل الفيران مثل هنية وحسن نصرللة ومشعل وكل قادتهم الجبناء وعندنا الصحافة الماجورة الفاشلة للى فاكرة بكلامها بتصلح اقتصاد مصر شوف ساويرس بيعمل اية فى اقتصاد مصر وانتم يصحافة يتعملو اية فى مصر انتم زى الخوان فى مصر وحماس فى فلسطين وحذ للة فى لبنان والسعودية فى العالم العربى ةالاسلامى لو ساويرس عاميل لامريكا يبقى حسنى مبارك وحكومتة وانتم للى بتاكلوا من المعونات الامريكية والاوربية عملاء وخونةا"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100539/http://www.20at.com:80/masr/2khbar/8554.html"

[[comments]]
