posted = "2008-08-27"
text = "الله يرحم الشرفاء و الحكام العظام لقد اصبحنا في غابة من ياكلنا و يحصل علي فلوسنا و يسرقنا و يجمع المليارات من اكبادنا اصبح يتكلم و يعترف علي رفيقة في العمالة لا امريكا و اسرائيل لانهم الاثنين لو هناك عدل لن يساويا هذه الدقيقة التي اكتب فيها تعليقي عليهم لكن اين العدل و من يطبقة فالي الجحيم انتم الاثنان يا اكلي لحومنا و بائعييننا بحفة دولارات"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100539/http://www.20at.com:80/masr/2khbar/8554.html"

