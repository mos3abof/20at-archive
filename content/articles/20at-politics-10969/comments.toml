posted = "2009-01-18"
text = "فى فلسطين العدو واضح وظاهر وضوح الشمس أما فى فلسطين فالأوراق مختلطة تماما فهناك عشرات المجموعات المسلحة التى تتقاتل ولا نعرف لماذا ولا يعلن أحدا مسؤوليته عن اغلب الأحداث وتقيد كل التهم ضد مجاهيل ولذلك فى حالة العراق لا يعرف المتابع البسيط للأحداث أن يفهم ما المطلوب ومن الذى ينبغى دعمه وما هى الجهة التى تمثل فعلا الإرادة الشعبية وإن كان حقا هناك إرادة شعبية واحدة<br />على عكس فلسطين الذى يختلف اثنان على أن إسرائيل هى العدو وأن الخيار الشعبى الوحيد هو المقاومة<br />ربما تتشابه الحالتان فى التواطئ العربى الرسمى فقط<br />وحسبنا الله ونعم الوكيل"
archived = "2010-01-05"
