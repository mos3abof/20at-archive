posted = "2009-01-17"
text = "الفلسطينيون شعب خنوع و غدار جدا و أنا تعاملت معهم لأكثر من 15 عاما و أعلم ذلك جيدا<br />أما العرقيون فهم شعب أبى و شجاع ولا يستجدى أحدا فعلا بعكس الفلسطينيين و بخاصة الحمساويين الذين لا يهمهم فلسطين أو غير فلسطين بل هم ينظرون فقط لأنفسهم و لدولتهم الإسلامية التى يريدون إقامتها حتى ولو ضحوا بكل فلسطين وليس بغزة فقط"
archived = "2010-01-05"
