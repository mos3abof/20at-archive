subject = "لا حول ولا قوة الا بالله"
author = "وارف"
posted = "2006-07-09"
text = "لا ليست حرية شخصية ...<br />ابداااااا ..<br />لا مكان للجهلة بيننا، ونقول انها حرية ، ابدااا .<br />هذا اسلامي وعرضي \" ديني السامي \" ...<br />لكن ...<br />حتلاقي جزاءها ...<br />اقتباس :<br />sendbad_tornado<br />أعملى ما تشائى ؛؛ فأنت من المتخلفين الذين لايفهمون الدين الاسلامى على حق؛؛ ان كنت قد قابلت من ينصرك اليوم ؛ فمن ينصرك غدا من الله ؛؛ وتذكرى.. أن الله يمهمل للظالم حتى اذا أخذه لم يفلته ؛؛ فستذكرون ماأقول لكم وأفوض أمرى الى الله<br />_____<br />اخي<br />نجم الدين ...<br />اتقي الله ...<br />صعب ان نكفر ، وان نرمي هذا بالنفاق<br />أخي انت ذاك<br />فلنحافظ على ماتبقى من وحدتنا!!! و نعمل لها واحيائها بدلا من هذا الكلام ...<br />بارك الله فيك ."
archived = "2006-11-02"
