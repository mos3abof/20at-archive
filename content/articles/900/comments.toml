[[comments]]
order = 18
subject = "هولندا تتجه لنزع الجنسية عن برلمانية اشتهرت بمهاجمتها الإسلام"
author = "]دبي- العربية.نت"
posted = "2006-05-14"
text = "كشفت دوائر سياسية هولندية عن تورط البرلمانية الصومالية الأصل حيرزي علي، والتي اشتهرت بعدائها للإسلام في تزوير طلب اللجوء السياسي إلى هولندا عام 1990.<br />وأكدت هذه الدوائر أنه تبعا لذلك فإن إجراءات حصول حيرزي على الجنسية تمت بناء على معلومات مزورة. ولم يقتصر تزوير حيرزي على اسمها وإنما شمل أيضا تاريخ ميلادها.<br />وبالمقابل، طالب خبير إدارة الهجرة والجنسية بإعادة النظر في الحق القانوني لحيرزي فيما يتعلق بحصولها على الجنسية. بدورها، وعدت وزيرة الهجرة والجنسية ريتا فير دونك بمناقشة هذه المطالب، وذلك وفقا لما ذكرته صحيفة \"الوطن\" السعودية.<br />يذكر أن حيرزي شقت طريقها نحو الأضواء بمهاجمة الإسلام وتطاولها على الرسول صلى الله عليه وسلم ودعوتها لما أسمته بالتحرر من الحجاب وكل القيود الجنسية، واشتهرت بانتاجها فيلم \"خضوع\" الذي يتهم الإسلام بإساءة معاملة المرأة والتشجيع على إهانتها وضربها ومنع حقوقها<br />وقد اختارت مجلة \"ريدردايجست\" الواسعة الانتشارحيرزي علي كأشهر شخصية أوروبية عن عام 2005، وذلك \"لدفاعها عن حقوق المرأة\"، خاصة المرأة المسلمة ومحاولة إنقاذها مما تتعرض له من القهر حسب ما زعمته المجلة.<br />يشار إلى أن الحزب الديمقراطي الهولندي قرر تعيين حيرزي علي قبل حوالي عامين متحدثة رسمية عن لجنة اندماج الأقليات بالبرلمان، وهو المنصب الذي صارعت لأجله \"حيرزي\" منذ مدة وهددت بالاستقالة من الحزب إذا لم تحصل عليه.<br />وتؤكد على أنها الأقدر على التعبير والشعور بقضايا الأقليات فيما جاء تعيينها في هذا الموقع ضربة موجعة للمؤسسات الإسلامية التي أقلقها شطط البرلمانية وتطاولها على الإسلام على مر الأشهر الماضية، بدءا من اتهام الرسول صلى الله عليه وسلم بأنه داعية لدين متخلف، ومرورا باتهام الإسلام بإهدار حقوق المرأة، وانتهاء بمطالبتها بالتخلي عن النصوص الدينية التي تحمي أخلاق المرأة بوصفها نصوصاً متخلفة لا تتوافق مع العصر الحالي.<br />الأحد 14 مايو 2006م، 16 ربيع الثاني 1427 هـ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124813/http://www.20at.com/article2.php?sid=784"

