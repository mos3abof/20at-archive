[[comments]]
order = 7
subject = "عودة من أمستردام"
author = "Light"
posted = "2006-05-09"
text = "قرأت مقالة نشرتها جريدة الهيرالد تريبون وأنا عائدة من أمستردام إلى القاهرة وكانت كاتبة المقال هي أيان هيرسي علي نفسها وكانت تلك المرة الولى التي أرعف فيها أنها كانت متعاونة مع ثيو فان جوخ في إخراج ذلك الفيلم الذي يسيء للمرأة المسلمة والذي قتل بسببه... المقال كان يشرح تفصيلاً كيف ترى أيان أن الإسلام أساء كثيراً للمرأة ورأيها عن المرأة في الإسلام أو تحت نظان الحكم الإسلامي...<br />ولكن للأسف لا أعتقد أن هذا المقال يصلح للنشر على الموقع هنا لأنه سوف يثير الكثير من الفتن التي نحن بغنى عنها من قبل امرأة معقدة مثل أيان تتمتع بجهل وعداء واضحين لا يمت للإسلام بصلة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124813/http://www.20at.com/article2.php?sid=784"

[[comments]]
order = 8
subject = "متى تنتهي الحرية الفكرية عند المسلم؟"
author = "مسلم"
posted = "2006-05-10"
text = "إن للمسلم أن يقول مايشاء ويفعل مايشاء شرط اللا يتجاوز حدود الشرع ، أو ماعبر عنه ربنا -عز وجل - بحدود الله .<br />اقرأ<br />وَمَن يَعْصِ اللَّهَ وَرَسُولَهُ وَيَتَعَدَّ حُدُودَهُ يُدْخِلْهُ نَارًا خَالِدًا فِيهَا وَلَهُ عَذَابٌ مُّهِينٌ )<br />وهذه الحدود هي ماثبت بنص شرعي لا يحتمل التأويل .<br />مثال هذه الحدود قول النبي -صلى الله عليه وسلم : من بدل دينه ، فاقتلود )فهذا نص واضح في قتل المرتد ، ولا يمكن تعطيله لاي سبب ، وغير ذلك من النصوص واضحة الثبوت والدلالة.<br />فلا يمكن بحال قبول من يزعم ظلم المرأة ؛لأن الاسلام اعطاها نصف نصيب الرجل ؛لأن هذا اصطدام صريح بقول الله -عز وجل : للذكر مثل حظ الانثيين .<br />ثم أمر آخر ، وهو أن المسلم والمسلمة منصاع لامر الله -عز وجل - وهذا هو معنى الاسلام ، فهو الاستسلام والخضوع لامر الله .<br />اقرأ<br />إِنَّمَا كَانَ قَوْلَ الْمُؤْمِنِينَ إِذَا دُعُوا إِلَى اللَّهِ وَرَسُولِهِ لِيَحْكُمَ بَيْنَهُمْ أَن يَقُولُوا سَمِعْنَا وَأَطَعْنَا وَأُولَئِكَ هُمُ الْمُفْلِحُونَ )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124813/http://www.20at.com/article2.php?sid=784"

