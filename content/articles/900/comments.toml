[[comments]]
order = 10
subject = "ايان ليست ألد أعداء الرسول صلي الله عليه وسلم"
author = "ايان ليست ألد أعداء الرسول صلي الله عليه وسلم و لكن الد اعداء المتخلفين الذين يتحدثون باسم الرسول و يرتكبون الاخطاء و الفاحشة باسم الاسلام ... ايان معرفتش تفرق بين الاسلام و المسلمين و للاسف هي عندها حق في كل الكلام اللي قالته لكن الاسلام مش هو السبب ... السبب الحقيقي في ضعف الاسلام و اضطهاد المرأة هو المسلمين و الصاقهم كل اخطاءهم بالدين ... نعم المرأة المسلمة مضطهدة لكن مش بسبب الاسلام لكن بسبب الجهل"
posted = "2006-05-10"
text = "ايان و امثالها محتاجين حد فاهم يتحاور و يشرح الفرق بين العقيدة و التطبيق بمعني الفرق بين الاسلام و المسلمين<br />المسلمين ايضا محتاجين حد يفوقهم و يفهمهم الاسلام الصحيح لكن للاسف انا شايفة ردود الافعال سلبية جدا ... فريق يتجاهل ادعاءاتها و يعتقد ان الله سيظهر الحق و فريق اخر يهاجم بشدة و يستنكر ... حيفيد بايه الاستنكار و التجاهل ... قدمنا ايه للاسلام بالاستنكار و الشعارات الزائفة ... لازم علي كل مسلم انه يفهم دينه الصحيح و يتفهم وجهة نظر الاخر و يتحاور معه و بكدة يخدم دينه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124813/http://www.20at.com/article2.php?sid=784"

[[comments]]
order = 11
subject = "ليس من الاسلام"
author = "صانع حياة"
posted = "2006-05-10"
text = "بسم الله الرحمن الرحيم يقول الله تبارك وتعالى\"ومن يرتد منكم عن دين فسوف يائتى الله بقوم يحبهم ويحبونه اذلة على المؤمنين اعزة على الكافرين\"العداء للاسلام ليس بجديد ولكنة مستمر من بدء الخليقة وحتى قيام الساعة ولا غرابة فيما قرانا وليست هذه هى الحالة الوحيدالتى قرائناها ان بين المسلمين اشخاص يعرفون بانهم مسلمين لكن من يدقق ورائهم يكتشف غير ذلك وخصوصا فى هذه الفترة من ذمننا هذا وقيام دولة اسرئيل بين ظهرانين وقد قرت فى احد كتب الشيخ محمد الغزالى ان جاسوسا اسرئيلى دخل سوريا وتدرج فى المناصب حتى انه قد رشح لمنصب وزير فى سوريا الشاهد هنا ان البيئة التى زرع فيها الوزير اصبحت خاوية من تعاليم الاسلام حتى انة لم يعرف المسلم من غيره يبقى علينا نحن المخلصين لله للرسول باذن الله ان نعرف من بيننا ومن يكون وماذا يقدم لدنيا الناس حتى ننهض بهذه الامة من جديد معن ما قراناه عن ظلم الاسلام للمراة فهذه حجج واهية واكبر دليل على ذلكما وصلت الية المراة فى اوربا من الانحطاط والتمزق وعن الحال فى الاسلام والرقى الذى وصلت الية المراةفى اسلامنا واكبر دليل على ذلك نحن المسلمين وهم اهل الكتاب واختم بقول عمر كنا اذلاء حتى اعذنا الله بالاسلام..وانا لله وانا اليه راجعون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124813/http://www.20at.com/article2.php?sid=784"

