subject = "شخصيه محبه للظهور , مدمنه للكذب"
author = "ماجد"
posted = "2006-05-17"
text = "مجرد شخصيه محبه ومدمنه للظهور , لا تستطيع ان تعيش فى الظل دون ان يسلط الاعلام عليها الاضواء اللتى ابهرتها فأدمنتها , فأصبحت اكاذيبها على جرعات تصبها لصالح استمرار بريق الاعلام والشهره حولها<br />عموما شخصيه مثلها فجه وقبيحه الى ابعد الحدود, ولها من حظوظ دنياها ان يتعامل معاها البشر كاللعنه تصيب من حولها<br />يكفيها ما يحدث لها الان من فضيحه مدوبه انفجرت , فى اعتراف لها انها كذبت لتحصل على حق اللجوء السياسى فى هولندا واسبابه اللتى استندت اليها من اضطهادها لتحصل على الجنسيه الهولنديه, وقصتها غير الحقيقه والجانب الخفى انها لجأت الى 3 دول اوربيه قبل هولندا, ولاكنها لم تجد فيهم المجد الذى تبحث عنه!, وتبعتها باللعب على اوتار مشاعر الهولنديين لتدخل البرلمان الهولندى,<br />الان من ادخلوها البرلمان , يطالبون بسحب الجنسيه منها وطردها خارج البلاد!!"
