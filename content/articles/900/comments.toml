author = "هو لند ية مسلمة"
posted = "2006-05-14"
text = "تسكن هذة الملعونة فى العاصمة الهولندية السياسية (دنها خ) تحت حراسة مشد دة وهى مكرو هة حتى من الهو لندييين المعتد لين وتسسبب لنا العد يد من المشاكل فهى تطالب بتر حيل وطر د المسلمين من هولندا ومنع الحجاب وقاموا بسن قوانيين جديدة لمنع النقاب وهذة اللعينة تذ هب الى ابناءنا فى المدارس الا سلا مية وتسالهم اين الله فيقول الا طفال الله لا يراة البشر فتقول الفاجرة وكيف تؤمنون بشىء لاترونة ولقد قام الجيران المجاورون لبيت هذة الكافرة بتقديم شكوى الى البلدية لنقلهاالى منطقة اخرى بعيدا عنهم خوفاعلى انفسهم من تهديدات المسلمين المتواصلة لها وخاصة بعد مقتل فان خوخ (المخرج السينمائى )الذى قتل بسبب اخراجة لفيلم من تاليفها تستهزأ فيةبالرسول واخيرا نسالكم الدعاء لمسلمى هو لندا بان يكف عنا اذى هذة المرتدة وان يرد كيدها الى نحرها وان يعيذ نامن شر ها وشر امثالها"
archived = "2006-11-02"
