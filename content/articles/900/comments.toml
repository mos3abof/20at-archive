[[comments]]
order = 25
subject = "الحمد لله على نعمه الاسلام"
author = "سمراء"
posted = "2006-06-16"
text = "السلام عليكم و رحمه الله و بركاته<br />اولا انا مش شايفاها جميله ولا حاجه بالعكس ده حتى كلامها مأثر على شكلها<br />ثانيا على اي اساس توضع هذه في قائمه اكثر مائه شخصيه مؤثره؟ ليه يعني؟<br />بس الحاجه المهمه اللي عايزا انبه عليها الاتي:<br />الصومال دي بلد كلها مسلمين<br />معظمهم جعانين و عريانين و مش لاقيين ابسط الامور اللى المفروض تكون عند البني ادمين الاحياء<br />حتى اللي يستر عوراتهم مش موجود<br />بيموتوا من العطش واحنا هنا بنشرب غير الميه العصير و الحاجه الساقعه و الشاي و غيييييييييييييييره<br />كل واحد فينا و انا اولكم لو فتح دولابه هيلاقي عشرات الملابس اللي بقالها سنين ماتلبستش و همه بدون مبالغه و انا شفت الصور مش لابسين حتى اللي يغطي العوره<br />ابسط حاجه!!!!!!!!!!<br />كنت بشرب \"سوبيا\" يعني لبن مخلوط بجوز الهند و الفانيليا و بارد و الدنيا كانت حر جدا و اثناء شربي لهذا المشروب اللذيذ قلت في نفسي: لبن و عليه جوز هند وللمزيد من الاستمتاع فانيليا و كمان بارد؟؟<br />يا ترى حد منهم من اهالي الصومال او اثيوبيا او غيرهم من اهالى المجاعات و الصحراء و الجفاف \"المسلمين\" حلم او مر بخياله حاجه زس اللي كنت باشربها دي و اللي تعتبر عندنا حاجه بسيطه جدا و من ارخص المشروبات؟<br />طبعا لا لانه مش في احلامه اكتر من الميه اللى عايز يبل بيها شفايفه خوفا من الموت<br />طيب مين مننا بيفكر يساعدهم؟<br />بتمن كبايه عصير قصب او او لبانه او اي حاجه من النعم الكتير قوي اللي في ايدينا و مش حاسين انها نعم لا و الاكتر من كده ان بعضنا حاسس انها من حقه<br />بتمن علبه سجاير و لا اي حاجه مالهاش لزمه تقدر تستغنى عنها و تدور على هيئه تقدر توصلهم اي حاجه؟<br />الخلاصه ان الست دي ماشفتش من المسلمين حاجه تخليها تحس بعظمه الاسلام<br />لان المشكله مش في الاسلام و لكن المشكله فينا احنا اللي بنمثل الاسلام بشكل قد يسيء في بعض الاحيان اليه<br />طيب و مين اللي بيساعد هؤلاء المساكين \"المسلمين\"؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />الهيئات التبشيريه و التنصيريه و الارساليات المسيحيه هي التي تقدم لهم الغذاء و الماوى و الدواء و التعليم و غيره و كان الاولى ان يتولاهم المسلمين اليس كذلك؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />رجاء حار من يعرف اي مؤسسه موثوق بها من الساده القراء او من المسئولين عن الموقع يمكنها توصيل اي شيء لاخوتي في هذه المناطق يكتب ذلك<br />و لا تنسوا اخوتكم هناك على الاقل من دعائكم<br />اللهم فرج كرب المكروبين<br />و جزاكم الله خيرا و عذرا للاطاله"
