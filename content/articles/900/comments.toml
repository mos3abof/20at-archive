[[comments]]
order = 23
subject = "لاغرو أن ترتد وفينا هؤلاء!"
author = "نجم الدين"
posted = "2006-05-23"
text = "أيها السادة/<br />مايشجيكم ويؤرقكم كذا من ردة عاهرة زنجية لاحسب لها ولانسب ولا أصل كريم؟ أهي أول من جاهر بعداوة هذا الدين الحنيف الذي تعهد رب العزة سبحانه وتعالى بأن يظهر على الدين كله ولو كره الكافرون.<br />أي مصيبة أفدح بالله عليكم أولي الألباب ردة مومسة مثلها من الأنعام، أو ردة \"مارية آل خليفة\" إبنة حاكم البحرين أو إبنة أخيه، مابي والله من معرفة الأراذل من غرض.<br />أبوها أوعمها نصب نفسه بعدها ملكا على البحرين إبتهاجا بهذا الحدث السعيد، ولمن لايعرف الحكاية منكم، فإن ربة الصون والعفاف والأصل الماجد مارية هذه قررت الهروب مع الجندي مجند\"جونسون جونسون\" والإقامة معه ببلاده على سفاح لانكاح، ثم تنصرت ولا أدري أتزوجت النفر جونسون أم لا. ولقد صنعت هولوود فيلما أحسبكم شاهدتموه وأستمتعتم به، يروى قصة هروب درة البحرين مع عشيقها المذكور متخفية بزي المارينز، وكيف أنها فضلت شظف العيش مع عشيقها على قصور الوالد الديوث وأمواله القارونية. قصة الهروب والعشق هذة تحتاج لمجلدات تبين عورات الأنظمة الورقية ببلاد الخليج وتعمق الإنحلال والمجوسية فيهم حكاما وسوقة.<br />لكني هنا أود أن أسألكم :أيقل إضرارا ونكاية وهدما لأركان الإسلام وطمسا لمعالمه وتذوبيا لحدوده مايفعله شيخ الأزهر الفاسق الكافر ومشايخ جزيرة العرب الجهلاء المنافقون وخنازير الخليج المجوس، عما قد تفعله ملايين من أمثال عاهرة الصومال الزنجية هذة؟<br />أتعلمون أعدى أعداء الأمة قاطبة؟<br />لاوالله ماهم الصليبيون ولاعبدة العجول من اليهود فقط ولا أذيالهم من حكامنا، إنه النفاق المتحكم بكل أفعالنا يرادفه ويؤازره جهل لاعلاج له. قضى الإسلام على الكفر وظهر عليه بكل جولة معه صدق المسلمون فيها ربهم، ولكن ولحكمة لايعلمها إلا لله، وفق الإسلام عاجزا أمام النفاق، وما أستطاع حتى خدشه، دع القضاء عليه.<br />المنافقون هم أشد الناس ضراوة على الدين وعلى كل القيم، أما المرتدون أمثال سليمان رشدي وعاهرة الصومال وشيخ الأزهر ومشايخ الشيعة في العراق وجل علماء السلاطين ببلاد الحرمين والخليج وغيرها، فهؤلاء أمرهم مكشوف وسترهم مفضوح وسعيهم في خسار، والله ناصر لدينه رغم أنوف هؤلاء.<br />الخطر في المنافقين المندسين بيننا، ممن نجهل ونحسن الظن بهم ونستفتيهم بأمور ديننا ودنيانا، فيفتون بغير علم ولا هدي أو عن غش ومكيدة. الخطر في جهلاء نصبوا أنفسهم علماءا، كون أحدهم قرأ كتيبا في تفسير الحديث فغاب عنه معظمه، وظن أنه وعى الأمر كله واستحق رتبة كهنوتية في الإسلام ما أنزل الله بها من سلطان. لاغرو إذن أن يظهر علينا أمثال الفيشاوي وغيره من جهلة فسقة يعلموننا بأصول الدين، طالما إختفى العالم الحق بين ظهرانيننا وانقرض أو غيب أو إستقطب بلعاع من الدنيا ومتاع قليل. لاغرو أن الأحبار والقساوسة اليوم يحددون لعلماء السلطان منا مايجب حذفه من القرآن وما يجوز الإحتفاظ به، الخاخامات والقساوسة فقط؟ لا ومن رفع السماء بلا عمد، جرؤ على الإفتاء حتى بوش ورايس وتشيني وبول والعلامة رامسفيلد!<br />أي بلد من بلاد المسلمين قاصيها والداني إمتنع عن تطبيق شريعة الإسلام الأمريكية المعدلة هذة؟ خبروني. لم إذن لاترون إلا عاهرة الصومال؟ أهي أشد عهرا من فاجرات الكويت أوعمان أو قطر أو البحرين أو بلاد الحرمين؟ لندع النفاق ولنضرب على أيدي أهل الفساد منا، وبعدها ننظر فيما يصلح الزنج والعجم وزرق العيون.<br />أهل الجاهلية كانوا أصدق مع أنفسهم من معظمنا، ولطالما تساءلت ماذا كان يحبسهم عن التلفظ بالشهادتين مثل حكامنا، ويفضلون عليها ضرب الأعناق؟ ألا والله إنهم علموا أن الإسلام قول وعمل والتزام، أتفهمون عني؟<br />ليس هناك أكثر تشدقا بالإسلام من آل سعود وآل قرود وقباح وجوقة الخليج، هذا مع كل مانراه من هدمهم للإسلام وإصرارهم على المجوسية، وإباحتهم بلاد ودماء المسلمين لمن شاء، فقط لأنه يطبعون بعض المصاحف وببلادهم مقدساتنا الإسلامية. بنو الخبائث الفاتيكان يصنع أضعاف ما تصنعون أضعافا مضاعفة، ويزيد عليها بمساعدات مادية وخدمات وغيرها، حتى توطد للتبشير قدم ببلاد إسلامية بآسيا وأفريقية لايعرف عنها بنو قرود وقباح سوى أنها مصدر لتوريد الغلمان والقصر من الفتيات اللاتي دون العاشرة لإشباع نهم كبارهم الجنسي، ولابأس أن تسيح حريمهم مقابل ذلك مع الخدم من هند وسند وزنوج.<br />هؤلاء القائمون على الإسلام ببلادنا، أتعجبون بعد ذلك أن يبزغ نجم بن لادن والظواهري والزرقاوي عند جماهير كرهت الفساد، فلم تجد أمامها غير هؤلاء، ولا تبال عندها أكانوا علماءا أو دون ذلك.<br />{ الأعراب أشد كفرا ونفاقا وأجدر ألا يعلموا حدود ما أنزل الله على رسوله والله عليم حكيم } .<br />نجم الدين"
archived = "2006-11-02"
