subject = "دعوها فنحن نعلم دينانا على اتم وجه"
author = "احمد المصرى"
posted = "2006-05-11"
text = "نحن مسلمون نعرف دينانا<br />جيد جدا ونعلم ايضا ان له اعدء<br />ولم نخف منهم لانهم بلا قيمه<br />لان دين الله فى الارض هوه الاسلام<br />واذا كان فيه اسائه لاى شىء<br />فكان لم يتعجب منه اشد اعدائه<br />وكانو لم يقسمو بائنه على حق<br />فدمنا نعلم ذلك فلماذ نخف من من لم<br />يجرو الى وراء مصلحهم الشخصيه فهيه فتاه هربت من بلادها اثناء الحرب فماذا تنتظرون منها صدقونى لو احد قال لها سبى والدك فى وسائل الاعلام وانا اذيدك من مناصب او مال لافعلت هى لا شىء هذا يكفى لى كارد عليها"
