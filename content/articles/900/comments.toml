subject = "مين دي؟؟؟؟؟؟"
author = "adhb_85"
posted = "2006-07-08"
text = "ايه يا جماعه مستغربين ليه من اللي بيتقال ده طيب ده احنا عندنا في مصر اكتر من كده عندناشوية عواجيز بس مشاكل (نوال التعساوي وادبار بركهو غيرهم) عايزين المراه حره لان الاسلام دين ارهابي متطرف متشدد لازم المراه تاخد حقها اكتر من كده كمان بعد ما لعبناها الكوره والمصارعه لا المفروض ننادي الولد باسم امه مش ابوه يعني يبقى اسمك مثلا عتريس جولفدان او مخيمر سوزي كده هنديلها حقها وكمان علشان نريحهم اكتر احنا نلغي ايات الحجاب واحاديث الحجاب وتخلي مقالاتهم في الدين تدرس في المدارس لانهم علماااااااء في التين ومش واخدين حريتهم يعيني عايزيين يبقو زي الغرب اللي المراه فيه سلعه رخيصه علشان اعمل منتج احط عليه صورة واحده حتى لو المنتج ده كاوتش عربيه او مكن حلاقه رجالي عندهم في الغرب يا متحررات بيعرضوهم في المحلات زي سوق الرقيق زمان عندهم مفيش حاجه اسمها مسؤليه لما الاولاد يكبروا يرموا اهلهم والزوج مش مكلف انه يصرف على زوجته المدارس هناك نفسها تطبق الفصل بين الجنسين بسبب زيادة ابناء السفاح<br />يا سلام على اسلامنا الجميل اعز المراه وادالها ورث وحصنها وخلاها زي اللؤلؤه الغاليه لكن هما بتوع الحريه دول عايزيين الرخص هختم بايه (إِنَّ الَّذِينَ يُحِبُّونَ أَن تَشِيعَ الْفَاحِشَةُ فِي الَّذِينَ آمَنُوا لَهُمْ عَذَابٌ أَلِيمٌ فِي الدُّنْيَا وَالْآخِرَةِ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ) [النور : 19]"
