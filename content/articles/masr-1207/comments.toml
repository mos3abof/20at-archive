[[comments]]
order = 0
subject = "الموت للسعودية الوهابية"
author = "مصرى للابد"
posted = "2006-11-25"
text = "الف مليون لعنة على العرب البدو الهمج<br />انا مع الوزير المبدع فى كل ماقاله<br />لا للعودة للتخلف والهمجية<br />لا لاتباع هؤلاء البدو الهمج<br />مصر تحولت الى مجرد تابع لدولة الارهاب الاولى فى العالم السعودية الوهابية<br />كم اتمنى ان تقوم امريكا بضرب وسحق السعودية ونظامها الارهابى الوهابى<br />ان السعودية وليست العراق هو المصدر الاول للارهاب فى العالم<br />يجب ضرب السعودية وازلة نظامها الحقير<br />ولكن السؤال : ماذا يجب علينا كمصريين عمله لحماية بلادنا من هذا السرطان الهمجى الوهابى<br />التوقيع<br />مصرى للابد"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232402/http://masr.20at.com:80/article.php?sid=1207"

[[comments]]
order = 1
subject = "إلى مصري للأبد"
author = "أبو عماد"
posted = "2006-11-25"
text = "للأسف أني قرأت هذا الكلام الفارغ الذي ينضح كراهية وغباء ولمز كثر في هذه الأيام حيث ينعت كل من هب ودب وكذا من هو أغبى من حمار أهله أي أمر شرعي له من الله برهان بأنه آت من الوهابية أو من البدو فهذا الخطاب العنصري القميئ الذي يصم كل ما هو إسلامي بالتخلف والهمجية هذا لضحالة فكر وانحسار مساحة الإيمان في النفوس الغبية يجب أن نسأل أولاً في أمر يطرأ هو مستنده إلى الله ورسوله عندها نسلم ونسنده إلى الله ورسوله دون وصف ذلك الأمر بأنه اتباع للبدو أو لغيرهم . هذا الكلام الذي يتصف بالسطحية والضحالة والجبن راجع إلى عدم استطاعته مهاجمة أمر الله أو مهاجمة رسول الله فيتصدى إلى مهاجمة الوهابية والسعودية يا أغبى من حمار أهلك ألا تعلم أن نهضة السعودية الصناعية تفوق عشرات المرات نهضة الأدعياء الذين ياكلون ويعيشون على اجترار الماضي البعيد ألا تعلم أن السعودية يا بغيض تصدر لك قمحاً حتى يأكل أمثالك مع أن أرضكم أصلح وأخصب .<br />كفاك تفاهة وغباء<br />أما من ناحية الذين يدافعون عن هذا الوزير فإنما يدافعون عن اتجاه علماني حسب ادعائهم تنويري حسب أقوالهم ويصفون غيرهم بالظلامية والتخلف مع أن معاييرهم ساقطة عقلاً ومنطقاً فضلاً عن شرعاً وإسلاماً فنصيبهم في الإسلام بهذه الطريقة يحتاج إلى مراجعة ووقفة منهم قبل فوات الأوان"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232402/http://masr.20at.com:80/article.php?sid=1207"

[[comments]]
order = 2
subject = "قطه سكر"
author = "ايمن امام"
posted = "2006-11-25"
text = "مقال القط مقال كله سكر فهو يدافع عن الوزير بأعتبار ان ما قاله يشكل دردشه عاديه - ثم يؤكد ان ما قاله الوزير السكر - رأى شخصى- ثم يؤكد ان الحجاب المنتشر الان هو موضه وانه سأل زميله عنه فقالت له انها تخلعه عندما تعود الى المنزل - واغلب الظن انها خافت منه فأدعت ذلك حرصا على عدم نقلها الى قسم كالارشيف او ما شابه ذلك - ثم يقحم الاخوان المسلمين فى الموضوع ليضعنا امام نقطه اللاعوده وهى ان كل من يهاجم الوزير يعطى الاخوان نقطه قوه - كذلك يهاجم من انضموا الى ملايين الغاضبين من الشعب من اعضاء الحزب الوطنى ويتهمهم بأنهم لايفهمون مبادىء الحزب وصنع القرار- وانهم انساقوا وراء البلبله التى احدثها الاخوان - ثم هو يوجه رساله الى مؤسسه الرئاسه مضمونها ان اقاله سكر فيها نصر للاخوان وبالتالى - فلن يقال سكر بيه- حتى لايقيم الاخوان الافراح والليالى الملاح - اما عن الشعب فأنه لايفهم - كذلك فأنه يزعم ان انتشار الحجاب ورائه الموضه فقط وليس نزعه التدين التى لجأءاليها العديد من الفتيات- بأختصار - الحجاب ليس رمزا للتدين وانه موضه وعزل الوزير نصر للاخوان - واعضاء مجلس الشعب من الحزب الوطنى الذين انضموا لهجوم الاخوان - لايصلحوا ان يكونو فى الحزب - وانبه الساده القراء ان هذا المقال - هو رساله للجميع -- لن يقال فاروق حسنى ولن يستجوب ولن تطرح الثقه - لان الدوله نجحت لما لها من اذرع فى كل مؤسسه صحفيه - ان تسيس الموضوع وكان هذا هو المخرج الوحيد لادخال البلبله على مؤسسه الرئاسه لاثنائها عن عزل هذا الرجل- كنت اتمنى من القط - ان يتحدث فى مقاله عن اهانه علماء الدين (شيوخ بتلاته مليم) تغاضى القط عن هذه النقطه - كنت اتمنى من القط ان يقول لنا هل هى مصادفه- ما يحدث فى تونس - وفى اوروبا وماقاله الفاتيكان - مع ما قاله الو<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232402/http://masr.20at.com:80/article.php?sid=1207"

