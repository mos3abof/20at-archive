[[comments]]
order = 13
subject = "إديها علمانيه...تديك ثآفه"
author = "Drsalah_hanie"
posted = "2006-11-26"
text = "لقد أصبح كل من يدافع عن الاسلام أناس همج متخلفين متعصبين متزمتين رجعيين وكل من يهاجم عقائد المسلمين ودينهم هم أناس مثقفين مفكرين مبدعين متنورين.!!!<br />أصبح الجانى مجنى عليه والعكس بالعكس وأصبح إلصاق كل نقيصه بالاسلام ومن يحملون هم دينهم أمرا طبيعيا بل ومشروعا وعندما تهم بالرد تصبح من المغضوب عليهم من وجهة نظر العلمانيين اللى همه المثقفين وكأنهم النخبة المنتقاة وعصارة المجتمع الميمونة مع أن دورة حياتهم معروفه للجميع:<br />سفالة وقلة أدب على الاسلام ورموزه ـــــــــــــــــــ ثم الحصول على أوسمة الرضا من \"الشيطان \"وأتباعه من الأنس ــــــــــــــــــــــ ثم إلى مزبلة التاريخ.<br />(ملحوظه: هذه المزبله من أقذر وأوسخ مزابل التاريخ وهى معده خصيصا لكل من يتهكم على الاسلام ورجال الاسلام معتبرا ذلك هو القربان الاسمى للشيطان الرجيم).<br />ولانامت أعين المنافقين والعلمانيين .<br />قولوا أمين.<br />امين"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232402/http://masr.20at.com:80/article.php?sid=1207"

[[comments]]
order = 14
subject = "هاتروح النار ياقط"
author = "اشرف"
posted = "2006-11-26"
text = "ايه اللى عايزه ممتاز الزفت ده ؟ يعنى انتماء العضو للحزب اهم من انتماءه لربه ودينه!------ فاكرين القسيس اللى اسمه فلوباتير جميل وكان عضو فى الهيئه العليا لحزب الغد ويوم ما اعلن ايمن نور ترشيحه لرئاسة الجمهوريه كان واقف على يسار الدكتور ايمن افتكرتوه ولا لسه ----هذا القس عندما اعلنت الكنيسه المصريه تايدها للرئيس مبارك فى الانتخابات الرئاسيه ماكان منه الا ان قدم استقالته من حزب الغد وايد موقف الكنيسه --- وانا لاالومه على هذا الموقف المشرف بالنسبه له -- لانه لو فعل غير زلك يكون قد باع دينه بدنياه ولم يلومه اويهاجمه احد لانحيازه لدينه--- اما الاستاذ الغير محترم الافاق المدعو ممتاز القط فيريد من اعضاء الحزب الوطنى تايد الوزير الشاذ حتى لوكان على حساب عقيدتهم ياريت الاخ القط يتعلم من القسيس فلوباتير ان الدين هو راس المال وان ضياعه هو اعظم الخسران!"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232402/http://masr.20at.com:80/article.php?sid=1207"

