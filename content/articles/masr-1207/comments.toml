[[comments]]
order = 11
subject = "والله فعلاً"
author = "كل الوزراء الأشد فساد بيكونوا تحت رعاية السيدة الفاضلة فها هو إبراهيم سليمان وحبيب العادلى وفاروق حسنى يحظوا برعاية خاصة منها علشان كده مش ها ممهم من أى حد وطايحين"
posted = "2006-11-25"
text = "الإخوان المسلمين ناس بعيد عن المقارنة مع الحثالة دى لإنهم أطهر من أن يقارنوا بأى فاسد ويكفى أن وجودهم فى مجلس الشعب عن حق وليس بالتزوير كما فعل باقى الأعضاء أو بالتعيين لكن رغم التضييق عليهم فى الإنتخابات أنتزعوا 88 مقعد ولكن حب الشعب لهم يعطيهم ال 444 مقعد بتوع المجلس كله<br />فيه مشاكل أهم بكثير من واحد مش باين له أذا كان راجل أو مخنس يدلى بتصريحات لا تنم إلا عن شخص بعيد كل البعد عن الإسلام وكان من الأفضل الا نهتم بمثل هذه التصريحات ولكن يكون كل إهتمامنا مسخر لإقتلاع هذا الفساد المستحكم من رأسه وتطهير مصر منهم جميعاً<br />إحنا مستنيين أيه الشعب وأهانوه وباعوا أملاكه لأجانب يعنى أصبحنا محتلين وقضوا على الشباب بالبطالة والمعتقلات ونهبوا البلد وكل ده وهما مالهمش شرعية فى الحكم لأنهم مزورين لكل الإنتخابات ومش مكفية عايز يقعد فى الحكم لآخر نفس فيه ربنا يقطع نفسه ويريحنا منه أحنا سايبينهم ليه هى دى مش بلادنا ولا شعور الغربة إللى فرضوه على الشعب علشان ما يطالبش بحقه مش ها نقدر نتخلص منه يا شباب ما فيش غير الثورة للتغيير وحكومة أنتقالية"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232402/http://masr.20at.com:80/article.php?sid=1207"

