[[comments]]
order = 9
subject = "فاروق حسني رمز يشرف المصريين"
author = "عربي"
posted = "2006-11-25"
text = "والله تستاهلو انه حتى رجالكم تلبس حجاب مش بس نسوانكم يامتخلفين ياجهله ياظلاميين ياارهابيين \"وطبعا انا عارف حيطلع واحد متخلف اذنه زي اذن الحمار ويقول ده كلام الامريكان \"لكن اقسم بالله العظيم تستاهلو كل اللي يجرالكم مادمتم بعقولكم هذه وانتو عاوزين تعملو مصر طالبان ثانيه وياريت بدل مافالحين تشتمو الغرب وتكفروه ياريت تتركو الكومبيوترات والنت لانها من عقولهم مش انتو اللي عملتوها وريحونا من قرفكم وفارقونا وروحو عيشو بالكهوف والصحارى زي ماكان النبي واصحابه عايشين ولما تقدرو تفكرو وتعملو نت او جهاز كومبيوتر اسلامي ابقو استعملوها ياجهله ياجهله ياجهله.....ياجهله"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232402/http://masr.20at.com:80/article.php?sid=1207"

