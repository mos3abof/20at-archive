[[comments]]
order = 6
subject = "ايها الكاتب العزيز"
author = "شيماء"
posted = "2006-11-25"
text = "السلام عليكم و رحمة الله و بركاتة<br />ايها الكاتب العزيز<br />لا يسعني الا ان اقول \" يشفي الكلاب و يضرك\"<br />يعني اهانة امر من اوامر الله و فريضة من فرائض الاسلام و اهانة رجال الدين حرية شخصية لا تستوجب النقد و المساس بشخص السيد الرئيس عمو حسحس و الجيش الي ملوش لازمة هو ما يستوجب الحبس و العقاب .. ياخي اننننننناه علي رأي المرحوم اسماعيل يس . لما البلد فيها حرية اوي كدة امال ابراهيم عيسي و طلعت السادات في السجن بيعملوا ايه بيلعبوا دورين دومنه,, جايز بردة.<br />موضوع الحجاب يتعلق بالدين و الشعب المصري متدين بطبعة لذا لم يكون هناك فرق بيهن اخوان و وطني امام اهانة امر من اوامر الله و اهانة امهاتهم و زوجاتهم و اهليهم و ذويهم من المحجبات من وزير و شخصيات لا يسووا مليم واحد.<br />ان مقالك هو الذي لايسوي 3 مليم لانه و ان نم عن شئ فانه ينم عن حقد دفين للاخوان و عن الفكرة التي تتبناها الحكومة المصرية \" و التي يروج لها امثالك معانا و لا مع الناس التانيين\" بصرف النظر اي منهم علي حق او حقيقة الموقف يعني لو وزير كفر بالله مش اهان الحجاب علي الحزب الوثني ان يقول امين بلا اعتراض و كأن اعضاء الحزب الوطني بلا دين و لا فكر و لا رأي و لا هوية و كأننا صرنا شعبين شعب الوطني و شعب الاخوان الان تظهرون علي حقيقتكم الات تفوح من اقلامكم رائحة رغبة تشتيت و تفريق الشعب المصري لخدمه اهداف النظام .<br />لا حول و لا قوة الا بالله<br />و صدق الله العظيم القائل في كتابه الكريم \" و ما قدروا الله حق قدره\"<br />حسبي الله و نعم الوكيل"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232402/http://masr.20at.com:80/article.php?sid=1207"

[[comments]]
order = 7
subject = "مهى برضوا دردشة"
author = "لو أعتبرنا ما قالة السفية فاروق حسنى دردشة ووجهة نظرة الحقيرة فى الحجاب والمرأة يبقى برضوا ما قاله السيد طلعت السادات كان دردشة ووجه نظر ليه فى أمر كل الشعب يضع عليه علامات أستفهام منذ 26 عاماً وهو من المسئول عن أغتيال الرئيس السادات ولا الدردشة ما بتكونش إلا لصالح الحبايب فقط"
posted = "2006-11-25"
text = "بالنسبة للإخوان المسلمين فهم عيون ساهرة لمحاربة الفساد إللى بقى للركب وكل من هب ودب فيهم بيتكلم على كيفه ومافيش أى وجه مقارنة بين فكرهم الرافض للفساد وفكر هذا الحقير وإللى ساندينه ومحافظين على فساده"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232402/http://masr.20at.com:80/article.php?sid=1207"

