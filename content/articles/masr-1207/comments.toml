text = "قرات في احدى الصحف الغربية لكاتب فرنسي يطالب حكومته الا تهاجم او تمنع الحجاب بل يرى ان عدم التضييق علي الملسمين في زيهم يسهل مهمة حصرهم وبالتالي محاصرتهم والقدرة اكثر علي تحجيمهم ارجو ان نهتم اكثر بما يحدث من الدول الاستعمارية اكثر بشخص مقدور عليه زي الوزير علينا ان نتفرغ لمشروع الشرق الاوسط الصغير الذى في طريقة للتنفيذ واحنا مشغولين بالدفاع عن الحجاب والاسلام كله في خطر بلا فاروق حسني بلا القط بلا شوية الموظفين الحكوميون"
archived = "2006-12-16"
