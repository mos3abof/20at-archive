[[comments]]
order = 17
subject = "نداء الى قراء هذا الموقع"
author = "ايمن امام"
posted = "2006-11-27"
text = "السلام عليكم/ لاحظت ان هناك ردودا خبيثه من اناس سواء كانو مصريون عربا مسلمين او مسيحيين المهم ان خلاصتها فتنه ويعمل على استفزاز القراء - والرد على امثال هؤلاء ارجوكم - ان يكون بالتجاهل التام - واولى بأى شخص ليس مسلما ان يكون مهذبا مع الاخرين خاصه وان الاخرين لم يتعرضوا له او لدينه بأى سخريه او ما شابه- والى ان يعرف امثال هذا الشخص ماهو الاسلام - فأننى ادعوه الى التوقف عن البذأت فمن السهل ان اوجه لك الاهانات عبر هذا الموقع ولكن من الصعب عليك ان تتقبل اننا لم نشعر بوجودك ولانرحب بوجودك - واولى بك ان تتفرغ لتدرس دينك جيدا - والله حليم ستار - نحن امرنا ان نحترم شرائع الاخرين وان نؤمن بما انزل على عيسى وموسى ومن سبقهم وغير ذلك الايمان فأن الشخص يكون بعيدا عن الاسلام - لو لاحظت ايها المحترم - انه ورغم ماقاله بندكت عن الاسلام وعن محمد صلى الله عليه وسلم - فأننا كمسلمين لم نتعرض بحرف واحد لعيسى وموسى صلى الله عليهم وسلم- لاننا نؤمن بهم ولكننا لانؤمن بمن حرفوا رسالتهم - وهذا موضوع شرحه يطول واذا كانت لديك الشجاعه وسعه الصدر لان نتحاور فى هذا وبمنتهى الادب والاحترام - دون تطاول فمرحبا بك / ايمن امام"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232402/http://masr.20at.com:80/article.php?sid=1207"

[[comments]]
order = 18
subject = "إيفون ريدلي: فاروق حسني عار على الإسلام وينبغي أن يعزل"
author = "عبدالله ( منقول )"
posted = "2006-11-27"
text = "22 - 11 - 2006 م<br />في محاضرة مثيرة ضمن فعاليات المؤتمر العاشر للندوة العالمية للشباب الإسلامي الذي تستضيفه القاهرة، هاجمت الصحفية البريطانية إيفون ريدلي التي كانت حركة \"طالبان\" اعتقلتها أثناء محاولتها دخول أفغانستان في أكتوبر 2001م قبل أن تطلق سراحها فيما بعد وتعلن إسلامها، تصريحات وزير الثقافة فاروق حسني التي هاجم فيها الحجاب.<br />وقالت: لقد التقطت اليوم صحفًا مصرية لأكتشف أن وزير الثقافة قد لقب النساء اللاتي يلبسن الحجاب بأنهن رجعيات، متسائلة: كيف يجرؤ وزير مسلم على قول ذلك، ولماذا يصمت رجال مصر ويقفون عاجزين عن إسكاته، بعد أن طعن هذا الوزير في شرف وعفة كل امرأة مسلمة ارتدت الحجاب.<br />ووصفت فاروق حسني بأنه \"عار\" على الإسلام، واعتبرت تصريحاته مجرد كلمات حقيرة، متسائلة: أية رسالة تلك التي يريد أن يرسلها إلى شبابنا بكلماته الخبيثة؟<br />وقالت إن هذا الوزير وجنسه هو تقليد شاحب من الرجال الحقيقيين خصوا أنفسهم في محاولة مثيرة للشفقة أن يصبحوا غربيين أكثر من الغربيين.<br />وأشارت ريدلي إلى أنه يجب أن يعزل الوزير من منصبه لإهانته كل امرأة مسلمة اختارت ارتدت الحجاب، لافتة إلى أن النقاب والحجاب أصبحا رمزًا لرفض أسلوب الحياة الغربية السلبي بما فيه من تعاطي المخدرات والمسكرات: إنها رسالة أخلاقية للغرب بأننا لا نريد أن نحيا بطريقتهم.<br />ورأت أن هؤلاء العرب الذين يريدون أن يكونوا غربيين في سلوكهم أكثر من الغربيين أنفسهم يثيرون السخرية أمام الآخرين.<br />ومن غرائب ما ذكرته قولها: آخر مرة زرت فيها القاهرة تم تلقيبي بالمتطرفة، الاتهام جاءني من شيخ الأزهر الدكتور محمد سيد طنطاوي، \"لأني عندما مد إلي يده لمصافحتي رفضت المصافحة ـ التزاما بحكم شرعي ـ فقال لي أنت متطرفة\".<br />وحملت الصحفية البريطانية<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232402/http://masr.20at.com:80/article.php?sid=1207"

[[comments]]
order = 19
subject = "إلى النصرانى القذر اللى كان فوق"
author = "Drsalah_hanie"
posted = "2006-11-27"
text = "نعم إنك أيها السافل لم تخيب ظنى فيكم وفى قلة أدبكم فهاهو نصرانى قذر يسب أشرف الخلق سيدنا محمد صلى الله عليه وسلم,<br />وهو هيجيب من بره,فهو ليس أقل سفاله من الارهابى الأكبر\"بنيدكت\" وليس أقل وضاعه من \"زكريا بقلظ\",<br />ولك أخى أن تدخل على موقع<br />baladynet.net/<br />للشيخ الجليل(أبو إسلام أحمد عبد الله<br />الموقع الذى يفضح مخططاتهم وأهدافهم الخبيثه فى مصر.<br />قساوسة مصر الذين يدعون حب مصر يقول أحدهم فى أحد الشرائط كلاما كله حب فى مصر وأهل مصر المسلمين الطيبين يقول فيه\"يامبارك لــــــو ماحققتش اللى إحنا عايزينه لو ماإدتناش حقنا يامبارك أقسملك إنك هتلاقى أمريكــــــــــــــــا بكره فى مصــــــــــــــــر ,وها تعمل فيكم يامسلمين زى ماعملت فى العراق,أقسملك يامبارك هانخلى مصـــــــــر عــــــــــــــراق تانيه\".<br />واللى عايز الرابط يقوللى وأنا هاكتبه المره الجايه.<br />والله يانصرانى ياجاهل لأفضح سفالتكم فى كل حته وهابين مدى حقدكم على المسلمين الغلابه اللى عايشين فى مصر اللى أنتم عايشين على أرضهم وبتاكلوا من خيرهم وبعدين تطعنوهم فى ضهرهم.<br />فللأسف عندما غاب الحق وهو الاسلام ,ظهر الباطل بجبنه وقذارته وعوت الذئاب ونبحت كلاب النصارى فى كل وادى.<br />ولكن لاتتعجل الشماته فينا فالاسلام وأهله قادمون وسوف ندافع عن ديننا وأرضنا وأهلنا الطيبين حتى آخر نفس فأبقوا على غيكم حتى يأتى نصر الله"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216232402/http://masr.20at.com:80/article.php?sid=1207"

