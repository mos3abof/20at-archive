text = "أهنئ فريق عشرينات الحلو على رحلتو دي، و أقول لوا ألف مبروك عليكم الرحلة ، بعد أتعاب ساعات العمل المتواصلة في مقر عشرينات…<br />و الله في الحقيقة ، بفكر بجدية أن أزور مصر و بالمناسبة أزور فريق عشرينات (: اللي وحشني أوي.<br />دمتم في القمة دائما…"
