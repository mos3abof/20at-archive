posted = "2006-02-01"
text = "اذا كان ما يجري على الارض هذه الايام لا يرضيك فماذا تريد ياعلي واذا كان الاسلام والمسلمين يقاومون على مدى الايام والسنين فاين انت من العايشين ان المقاومه ليسة انظمه ولا جهات ذات صله بالحكم انها امة هل تعرف ماذا تعني امه وبعد هذا انما يدور هذه الايام ليس صحوة حكام ولكنه خوف حكام ويريدوا من ورى ذلك تجميل صورهم تجاه شعوبهم اولا والامة الاسلاميه ثانيا اما بالنسبة لدول الغرب فلا يبالوا في مواقف الانظمه لانها من صنعهم وتحت ادارتهم هل تعرف لماذا لان ما انتجته الاانتخابات الفلسطينيه كشفة كل شي كان مستور هل فهمت ياعلي"
