subject = "سكت دهرا"
author = "السلام عليكم و رحمة الله وبركاته"
posted = "2006-02-02"
text = "اولا اقول اللهم صلي وسلم عليك يا نبي يا حبيب<br />اعجبني جدا جدا رد الاخ \"عفوا لن نقرأ لعلي\" و اعجبتني كل الردود من كل الاخوة .. و أحيي اخواني اللي علقوا على هذا المقال جميعهم على وعيهم و سعة ادراكم و الحمد لله اننا نقرأ و نفهم و لا نقبل انه\"الكلام تحشى به عقولنا حشوا \" بلا تفكير يا عشرينات<br />سكت دهرا و نطق كفرا ... لا احب هذا المثل كثيرا و لكن قد يكون هذا المقام مناسبا لقوله ...<br />في البداية كنت اتمنى ان ادخل على موقع عشرينات بعد حادثة التعرض للنبي لاجد عشرينات تشن حملة كبيرة على موقعها فاشارك فيها .... فخاب ظني<br />ثم بدأت كغيري اطالب \"بمشاركة عشرينات لنا \" في حملتنا للدفاع عن النبي صلوات الله وسلامه عليه .. فخاب ظني<br />و الان بعد قراءة هذا المقال .. أقول لعشرينات .. كان الاحسن ان تخرسوا و لا تبرروا ما فعلتوه بالكلام الفظيع في المقال .. كان اكرم لكم ان تسكتوا على ان تضعوا هذا المقال ..<br />هذه اهانة لنا يا موقعنا المبجل ؟؟<br />هذه اهانة لقرائكم الذين تظنونهم شوية عيال او قراء داخلين نحفظ كلامكم و نسمعه ..<br />للاسف احنا الغلطانين .. يا اخواني اسمحولي اقول احنا الغلطانين .. من الخليج الى المحيط .. اننا سمحنا لعشرينات دوما انها تضحك علينا بمقالات يظنون انه طرحها \"شجاعة \" بينما هي لم تكن الا محاولات لاثارة المشاكل و جلب اكبر عدد من القراء ...<br />لا اعرف ما اقول ... اخي صاحب الرد \" لن نقرأ لعلي \" شكرا جزييييييييييييييييلا النك قلت اللي في بالي بطريقة واضحة جدا ...<br />و اضيف ردا على المقال : لا تزر وازرة وزر اخرى يا بشوات عشرينات .. و اننا نسكت مرة لا يعني اننا نسكت كل مرة و نستمرئ السكوت و الاهانة .. و لكل انسان كبوات و اخطاء .. و واجبكم يا بشوات ان تستنهضونا لتصحيح اخطاءنا و الاقدام على خطوات ايجابية بدل ان تثبطونا و تحتقرون العمل الصغير في حجمه و العظيم في أثره ان شاء الله اللي قام به الناس من محبين الرسول بتلقائية ...<br />و تتكلم عن اننا وقعنا فريسة و انه الحكومة السعودية معرفش ايه ,,, يا اخي اتقي الله و شد على ايد الناس اللي تقدم على خطوة صح .. و لا تحاول تضحك علينا بهذا الكلام .. السعودية اقدمت على خطوة صحيحة و تلقائية و فورية واحنا استقبلنا عملهم بحب وترحيب لاننا مش مغفلين بالدرجة اللي تخلينا نفسر عملهم بالطريقة الساذجة في مقالكم ...<br />فعلا سفسطة آخر الليل ...<br />عيب عليكم انكم تهللوا لكل فضيحة تقع في يديكم عن اي دولة عربية و تعملوا مقال طويل عريض و تبثوا الاحقاد في قلوب العرب على بعضهم البعض دون ادنى مسؤولية او اهتمام منكم .. بينما تخرجون لنا بمقال ردئ كهذا و تبريرات تافهة كهذة في وقت متأخر جدا .. بعد ان سبقكم السابقون لنصرة الرسول صلى الله عليه و سلم ..<br />عيب يا عشرينات .. الحمد لله انه ظني فيكم لم يخب .. انا كنت خايف انكم تخبئون لنا مفاجأة ستفجرونها لنصرة الرسول لذلك تأخرتم علينا .. و كتمت غيظي حتى لا اسئ الظن بكم و نلتمس لكم العذر .. لكنكم طلعتم لنا بمصيبة ... كان سكوتكم احسن<br />كان سكوتكم احسن<br />كان سكوتكم احسن<br />اللهم صلي و سلم على النبي و بارك اللهم في كل خطوة لنصرته ،، اللهم انصر نبيكم بنا و ان قل عملنا لنصرته ، اللهم اجمع امبة حبيبكم محمد على نصرته يا رب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

[[comments]]
order = 13
subject = "كلنا نجحنا"
author = "للرسول رب يحميه! ؟؟؟؟؟؟"
posted = "2006-02-02"
text = "و الله المقال باين من عنوانه ..<br />بس احب اضيف حاجة ..<br />اليس هو هذا الموقع اللي كل شوية ينتقد و ينتقد اخطاء العرب و المسلمين و العرب فيهم و فيهم و كلهم مش فاهمين الا عشرينات ..<br />يعني تنتقدوا اننا لم نتحرك و لما تحركنا تنتقدونا بكلام و تفسيرات و خلط اوراق سيئ جدا من قبلكم ..<br />احب اقولكم بلا اثارة استفسارات هبلة ..<br />الكل نجح في الامتحان ..و رسبت عشرينات ..<br />لا تحاولوا تغطية هذه الحقيقة و تحويل الانظار عنها ... و بكلام ليس منطقي ابدا يا اهل المنطق .. يا اهل المقالات اللي على نمط \" ماذا لو\" ،، و \"لماذا \" ، \"حيث ان \"...<br />كلنا نجحنا و انتم رسبتم و شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

[[comments]]
order = 14
subject = "الطواغيت هم سبب هواننا"
author = "لم تتجرأ علينا الامم ، وتستهين بنا؟"
posted = "2006-02-02"
text = "الجواب ، اننا أمة ضعيفة في كل النواحي ، فنحن لا ننتج شيئا ولا نبدع شيئا ، واقصى ما نعرفه أن نبيع هذا البترول - الهبة من الله - وننفقه على شهواتنا .<br />حق للامم أن تستهين بنا وبثوابتنا ، فالبشر لا يحترمون الا الاقوياء.<br />من هم سبب ضعفنا ؟<br />الجواب ، هم طواغيت العرب وعلى رأسهم ال سعود وحسني مبارك والاسد وجوقته -المتخوضة في دم الابرياء - وباقي الطواغيت -أسأل الله أن ينزع ملكهم سريعا.<br />ضيعوا أموالنا ، وجعلوها في حساباتهم الخاصة ، قيدوا حرياتنا فلا ننطق الا بما يشتهون ، سجنوا صالحينا ، قتلوا مجاهدينا ، فهم أشد على المجاهدين من الامريكان الكفرة .<br />بعد ذلك تريدون من الامم أن تحترمنا وتحترم رموزنا .<br />أن اولى اولويات المغضبين -إن كانوا حقا غاضبين لله ورسوله - أن يجتهوا في ازالة الطواغيت ، ويعجلو بذلك .<br />كل بلد لطاغوته ، فأهل مصر يجتهوا في ازالة الفرعون حصنى مبارك ، وأهل الحرمين يجتهوا في ازالة ال سعود المجرمين ، وأهل سوريا يجتهدون في ازالة العبيديين الجدد ، وهكذا كل بلد يجتهد في ازالة طاغوته.<br />ثمم تتوحد تلك البلاد تحت أمرة الشريعة ، ونبنى بلدا قويا منتجا ، حينئذ تحترمنا الامم وتحترم رموزنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

