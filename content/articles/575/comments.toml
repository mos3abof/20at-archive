[[comments]]
order = 10
subject = "مقالة رائعة ومفيدة جدا أعجبتني وأتمني منكم قراءتها للإستفادة"
author = "عبدالله"
posted = "2006-02-01"
text = "هل استفزاز المسلمين استراتيجية غربية؟<br />بقلم:إسماعيل الشطي<br />نشرت صحيفة Jyllands Posten الدنماركية اثني عشر رسما كاريكاتيريا للسخرية من شخصية رسولنا محمد صلى الله عليه وسلم، وقد قام بهذا الفعل الوضيع اثنا عشر رساما هم: Kurt Westergaard، Jens Julius Hansen، Franz Fuchsel، Arne Sorensen، Annette Carlsen، Erik Abild Sorensen، Rasmus Sand Hoyer، Claus Seidel، Poul Erik Poulsen، Peder Bundgaard، Bob Katzennelson، Lars Refn، وقد تبارى هؤلاء الاثنا عشر رساما في الاساءة للاسلام ونبيه من خلال رسومات تحقيرية، فالرسام Kurt Westergaard رسم شخصا كتب فوقه اسم محمد وجعله مشبعا بملامح القسوة وذا حاجبين كثيفين وعينين جاحظتين وشنب موصول بلحية كثة، وفوق رأسه عمامة سوداء كالدخان كتب عليها عبارة الشهادة وزرع فيها ديناميت مشتعل، اما Franz Fuchsel فقد رسم شخصا كتب فوقه اسم محمد وجعله واقفا يخطب في مسجد وبجانبه رجلان يحملان ديناميتا وسيوفا، اما Erik Abild Sorensen فقد رسم شكلا لامرأة مدخلا الهلال والنجمة كجزء من تشكيلها وكتب عبارة سباب للنبي (صلى الله عليه وسلم) لأنه ابقى المرأة مضطهدة، بينما رسم Rasmus Sand Hoyer صورة لرجل بلحية كثة ويحمل سيفا عريضا وكتب فوقه محمد وغطى عينيه بخط عريض اسود، ثم جعل خلفه امرأتين ملفوفتين برداء اسود لا تظهر منه الا عيناها، وقام Poul Erik Poulsen برسم شخص ملتحي وكتب فوقه اسم محمد وجعل في عمامته قرني ثور، ولقد قامت الصحيفة بهذا الفعل وهي تعلم ان هذا يستفز مليار ونصف المليار مسلم على وجه الارض، ناهيك عن آلاف المسلمين الذين يعيشون معهم على ارض الدنمارك، اذ لا يخفى على الصحيفة ردود الفعل الغاضبة التي صاحبت نشر رواية (آيات شيطانية) لسلمان رشدي وآثارها التي لم تلتئم حتى اليوم بعد، كما أن ردود الفعل الغاضبة التي تبعت نشر أخبار الإساءة للمصحف الشريف في سجون غوانتنامو ما زالت ساخنة لم تبرد، فما الذي يدفع تلك الصحيفة للمضي في هذا الطريق؟ وهل كانت الحكومة الدنماركية فعلاً غائبة عن هذا الفعل الوضيع رغم ما يسببه لها من احراجات امام العالم الاسلامي؟ نقول ذلك بعد ان برزت ظاهرة التشكيك والافتراء على الاسلام ورموزه لضرب الحضارة الاسلامية، ووضع الاسلام في حالة المدافع عن نفسه، اذ لا يكاد يمر شهر منذ جريمة الحادي عشر من سبتمبر حتى يتلقى المسلمون اهانة يستغرقون جهداً في الرد عليها، وتكرر هذه الاهانات بترتيب يبدو ارادياً من دولة غربية الى اخرى يجعلنا نفكر فيما اذا كانت هذه جزءا من استراتيجية حلف الناتو، فتوجيه الاهانات تكرر في فرنسا وبلجيكا وهولندا وايطاليا وانجلترا والولايات المتحدة الامريكية، وهي دول ذات تاريخ استعماري، اما دخول الدول ذات التاريخ غير الاستعماري مثل الدنمارك والنرويج في توجيه هذه الاهانات للمسلمين فإنه يدفعنا لأن نشك بأن هذا الاستفزاز شرط من شروط الاستحقاقات الغربية في حلف الناتو، وإلا كيف نفسر تورط مثل هذه الدول بهذه الظاهرة الاستفزازية وهي التي لم تصنع تاريخاً عدائياً بينها وبين المسلمين؟ ما الذي يدفعها لاستعداء مليار ونصف المليار من المسلمين؟ من الذي يدفعها لدعوة رسامي الكاركاتير الدنماركيين للمباراة في استفزاز المسلمين؟<br />إن دعوة صحيفة دنماركية لرسامي الكاريكاتير الدنماركيين لمباراة حول الاساءة لنبي الإسلام صلى الله عليه وسلم هي امتداد لسياسة أعلنت عنها ملكة الدنمارك نفسها التي اعتبرت الإسلام تحدياً ينبغي التصدي له<br />محليا وعالميا،، وحثت حكومتها اليمينية على عدم اظهار التسامح تجاه الاقلية المسلمة في البلاد، وكانت قد سبقت هذه التصريحات سلسلة من التشريعات والممارسات التعسفية تمثلت في التغييرات المستمرة لقوانين الهجرة واللجوء والاقامة، وسحب الجنسيات والتجسس والاعتقال التعسفي، وتسببت هذه الاجراءات والممارسات في انتهاكات واسعة النطاق لحقوق المسلمين الذين ولدوا في الدنمارك ودرسوا في مدارسها وجامعاتها، ثم لا يجدون لهم مكانا في سوق العمالة، فضلا عن استهداف المرأة المسلمة والمتحجبة ومنعها من العمل، ان تبجح الحكومة الدنماركية في تبريرها للاهانات التي وجهت للاسلام بحجة حرية التعبير والصحافة اكذوبة مفضوحة، فهي حكومة لا تحترم حرية الاعتقاد عندما يتعلق الامر بالاسلام، وهي حرية لاتقل اهمية عن حرية التعبير، غير أن اكذوبة حرية التعبير لم تعد تنطلي على المسلمين الذين يشاهدون يوميا ازدواجية المعايير في تعامل الغربيين مع قيمهم تجاهنا، فبينما هم يظهرون الغضب والاحتجاج ويتصرفون بفزع وارتباك عندما يتطاول شخص ما في العالم على اليهود او مقدساتهم، في المقابل يتصرفون بلا مبالاة وازدراء عندما يتطاول شخص منهم على مقدسات المسلمين، ورغم اننا لا نبيح التطاول على المقدسات اليهودية او غيرها الا اننا نريد من هذه الاشارة الى كشف بطلان الزعم بعدم التدخل في حرية الصحافة، لقد منعت رئيسة وزراء بريطانيا السابقة مارجريت تاتشر كتاب «صائد الجواسيس» وقد كانت تردد قبل قرارها هذا بأشهر انها لا تستطيع منع نشر كتاب في بريطانيا لانه يتعارض مع القيم الثقافية البريطانية وذلك في ردها على المسلمين المعترضين على نشر كتاب سلمان رشدي «آيات شيطانية» وما زالت المانيا تمنع استيراد مطبوعات قد «تهدم النظام الديموقراطي الحر» حتى لو لم تدخل البلاد بهدف البيع، وفي فرنسا يمكن حظر اي كتابات بلغة اجنبية او «ذات اصل اجنبي» حتى لو كانت صادرة عن دار نشر فرنسية، وقد استخدم هذا القانون بشكل واسع حتى مطلع الثمانينات من اجل حظر استيراد المطبوعات الشيوعية، ومازال مستخدما ضد النماذج المتطرفة من الاعمال الادبية او الفنية الاباحية او المعادية للسامية، كما استخدم مؤخرا لمنع كتب السيد قطب وغيره، واستخدم كذلك بالاستجابة لطلب حكومات افريقية وشرق اوسطية من اجل حظر معارضة كانت تصدر داخل او خارج فرنسا، اذ صودرت صحيفتان تصدران بالعربية ابان حرب الخليج، ومازال لدى النمسا وفرنسا والمانيا وهولندا والنرويج واسبانيا قوانين مكتوبة تجرم ازدراء الحكومة، او اعضائها، او الرموز الوطنية -وتشمل الألوان الدالة عليها والعلم والنشيد القومي- والملك او رئيس الحكومة والهيئة التشريعية والمحاكم والجيش والعاملين بتلك الهيئات او ممثلي الدول الاجنبية، وهي مواد قانونية لا تستخدم الا عند اللزوم، وفي النرويج يفهم الدستور على انه يحظر بالمعنى الحرفي للكلمة كل رقابة مسبقة على المطبوعات، ورغم ذلك قد تأمر المحاكم ـ وهي تأمر بالفعل ـ بتوجيه انذار قضائي للصحف قد يمتد ليصير انذارا دائما لحماية مصالح اساسية مثل الحق في حسن السمعة، وهكذا تم الامر سنة 1989 في احدى القضايا حيث جرى حظر فوري على بعض المطبوعات وابدت المحكمة العليا توجيه انذار دائم بغرض ايقاف عرض فيلم ونشر تقرير يشهران بعدة صيادين لاصطيادهم اسماكا تتمتع بحماية بحرية وممنوع صيدها، والادعاء بان الحكومات الغربية لا تملك الادانة او الاعتراض على ما تنشره الصحافة قول زائف، فالمستشار النمساوي ادان بشكل صريح ملصقات تصور الرئيسين جورج بوش وجاك شيراك وملكة بريطانيا اليزابيث الثانية في وضع جنسي وذلك في معرض فني في فيينا منذ فترة قصيرة، ومن اراد ان يستزيد من الشواهد الدالة على ان التدخل في حرية الصحافة يتم بالغرب حينما يريد الساسة فليرجع الى كتاب نجاد برعي «دليل للبرلمانيين والاعلاميين».<br />ان تمادي الغرب في اهانة المسلمين يعود بالدرجة الاولى الى ضعف المسلمين انفسهم، وهو ضعف يتبدى في جمودهم الفكري والعلمي، اذ مازال التراث يهيمن على حاضرهم دون التفريق بين الفكر البشري والوحي الإلهي، مما يعطي انطباعا خاطئا عن الإسلام وقدراته على الاستجابة لمتطلبات الحاضر، ويعود كذلك الى ضعف القيادات الدينية الواعية التي تحظى بالاحترام، وابرز مثال على ذلك رد فعل شيخ الازهر على موقف حكومة الدنمارك من إهانة الإسلام، إذ لم يتصرف كقائد ديني بل تصرف كأحد أضعف دبلوماسيي وزارة الخارجية، إذ تمنى على حكومة الدنمارك الا تسمح بذلك ليس لان المساس بشخصية رسول الله صلى الله عليه وسلم إهانة واستفزاز لمليار ونصف من المسلمين، انما لانه من الاموات الذين له حرمة لا يجوز المساس بها، كما يعود هذا التمادي الى حكام المسلمين الذين لم يعنهم الحفاظ على كرامة شعوبهم طالما هم يشاركون بانتهاكها، فهم يسلكون نهجا لامتصاص الغضب في مثل هذه الحالات دون علاجها، إن اهانة الدنمارك للمسلمين يجب ألا تمر بسلام، والاعتذار لا يجدي طالما هناك نوايا مبيتة لتكرار هذا الاستفزاز، ولذا فان المؤتمر الاسلامي مطالب بجدية بدعوة اعضائه من اجل بحث هذا الموضوع واتخاذ استراتيجية مضادة، فالعالم الاسلامي رغم ضعفه ما زال يملك عناصر قوة يستطيع ان يلوح بها ضد تلك الاستفزازات.<br />تاريخ النشر: الخميس 2/2/2006"
archived = "2006-11-02"
