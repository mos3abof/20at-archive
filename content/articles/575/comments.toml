subject = "اللهم صلي على سيدنا محمد"
author = "معزو نوال"
posted = "2006-02-01"
text = "السلام عليكم ورحمة الله وبركاته وقبل ان استهل حديثي هدا ارغب من كل من قرا تعليقي هدا ان يصلي على حبيبنا رسول الله اللهم صل عليه وسلم تسليما كلنا فداك يا حبيبي يا رسول الله نفديك بقلوبنا وارواحنا وانفسنا لاتستغربوا اخوتي في الله من حفدة الخنازير والشياطين فما فعلوه ةيجب علينا ان نتوقعه في كل وقت وحين لكن يجب على كل محب لرسول الله ان يكون على اهبت الاستعداد كما فعل الصحابة رضوان الله عليهم هل نسيتم اخوتي ما حصل له صلى الله عليه وسلم في الطائف الم يقل اللهم اليك اشكو ضعف قوتي وقلة حيلتي وهواني على الناس ونحن على اثرك وعلى نهجك نسير يا حبيبي يا رسول الله ونقول اللهم اليك نشكوا ضعف قوتنا وقلة حيلتنا وهواننا على الناس فيا رب انتقم من كل من اساء الى حبيبنا وقرة اعيننا سيدنا محمد واتمنى من كل مسلم وميلمة قرا تعليقي هدا ان يصلي ركعتين في الثلث الاخر من الليل اليوم ويدعو عليهم بالله عليكم اختكم في الله نوال والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

