[[comments]]
order = 46
subject = "لماذا أرفض مقاطعة الدنمارك ؟"
author = "عبد الرحمن كمال"
text = "د. صلاح عـز : بتاريخ 10 - 2 - 2006 - جريدة المصريون<br />بثت فضائية (البي بي سي) خبرا في مقدمة نشرتها الإخبارية صباح 8/2 يقول أن المجلة الفرنسية (شارلي هبدو) ستعيد نشر الرسوم الكاريكاتورية المستهزئة بسيدنا محمد عليه الصلاة والسلام ، وستضيف إليها مجموعة رسوم أخرى من عندها. وليس هذا فحسب .. بل إن القضاء الفرنسي رفض إلتماسا من مسلمي فرنسا بالتدخل لمنع نشر هذه الرسوم. بتعبير آخر، فإن القضاء الفرنسي الذي يجرم معاداة السامية والسخرية من اليهود ، أعطى المجلة الفرنسية وغيرها من المنابر العنصرية في فرنسا ضوءا أخضر للسخرية من الإسلام ورسوله. صحيح أن جاك شيراك أدان هذا الفعل من جانب المجلة الفرنسية ، ولكنه لم يعتذر. فماذا نحن فاعلون ؟ لاشئ .. لأننا لا نقدر على فرنسا كما لم نقدر على أميركا من قبل .. إنها قصة الحمار والبردعة ، وهي أسوأ ما في قضية الرسوم المسيئة ، وأهم الأسباب التي تدفعني إلى رفض مقاطعة الدنمارك.<br />لقد بدأت القضية بنشر جريدة (يولاندس بوستن) اليمينية 12رسما كاريكاتوريا ساخرا عن سيدنا محمد (ص) في عدد 30سبتمبر، أثارت مشاعر مسلمي الدنمارك الذين هبوا لإنشاء \"اللجنة الأوربية لتكريم الرسول\" والتي تضم تحت لوائها 27 منظمة مسلمة في الدنمارك. قامت اللجنة بصياغة بيان إحتجاجي جمعت عليه 17ألف توقيع، وتوجهت به إلى مكتب رئيس الحكومة مطالبة بإنصاف المسلمين من الصحيفة. تجاهلت كل من الصحيفة ورئيس الحكومة مطالب المسلمين ، فما كان منهم إلا أن توجهوا إلى عدد من السفراء العرب للتدخل في المسألة. وعندما طلب السفراء مقابلة رئيس الوزراء ، رفض الاجتماع بهم. طوال شهري أكتوبر ونوفمبر، ظلت القضية محصورة داخل الدنمارك دون أن يشعر بها أحد في الخارج. وبسبب تعنت وعجرفة كل من الصحيفة ورئيس الوزراء وعدم وجود منابر إعلامية دنماركية معروفة دوليا يمكن للمسلمين عن طريقها نشر إحتجاجاتهم ، وبسبب قيام اليمين الدنماركي بإرسال صور أخرى مسيئة للرسول ، أشد صفاقة مما نشر، إلى المسلمين عقابا لهم على تحركاتهم ، قررت اللجنة المسلمة تصعيد المسألة ، وذلك بتشكيل وفد يطلب النصرة من الحكومات العربية. قامت اللجنة بتجهيز ملف للقضية من 43 صفحة توجه به الوفد إلى القاهرة في أوائل ديسمبر حيث إجتمع بشيخ الأزهر ووزير الخارجية والسيد عمرو موسى. كما تحدث أعضاء الوفد إلى الإعلام المصري ، وظهروا في برنامج (العاشرة مساء). وذهب وفد آخر إلى بيروت اجتمع بمفتي لبنان الشيخ رشيد قباني والزعيم الشيعي الشيخ حسين فضل الله ، وظهروا على فضائية (المنار). وحمل وزير خارجية مصر ملف اللجنة الدنماركية المسلمة معه إلى مكة لعرضه على مؤتمر القمة الإسلامي الذي إنعقد منذ شهرين. كل هذه التحركات كانت كافية لرفع القضية من المستوى المحلي إلى المستوى الإقليمي ، مما أدى إلى صدور دعوات مقاطعة المنتجات الدنماركية في دول الخليج ، وإنطلاق التظاهرات والاحتجاجات والهتافات وحرق الأعلام . وكان ذلك معناه رفع القضية وكل ما يصاحبها من صخب وقلق إلى المستوى الدولي. عندئذ قرر عدد من الصحف الأوربية الرد على إحتجاجات العرب والمسلمين بتصعيد التحدي معهم. فكانت البداية من صحيفة نرويجية قامت في 10 يناير بإعادة نشر الرسوم المسيئة ، وأعلن رئيس تحريرها أنه إتخذ هذا الإجراء لإظهار التضامن مع الدنمارك و\"لمواجهة الإسلام المتطرف\". وسارت صحف أخرى في إسبانيا وإيطاليا وهولندا وألمانيا وأخيرا فرنسا على نفس المنوال ، وكله بدعوى حرية التعبير. وكان رئيس تحرير مجلة (دي فيلت) الألمانية الشهيرة من أهم من رفعوا شعار \"تحدي الإسلام المتطرف\" عندما قال أن \"نشر الرسوم يقع في قلب ثـقافتنا ونحن لا نستطيع التوقف عن ممارسة حرية التعبير في إطار القانون\". أي أن المسألة كلها مرتبطة بوجود القوانين القادرة على كبح جماح العنصرية الأوربية. فما يمنعه القانون هو فقط العنصرية تجاه اليهود والسود والشواذ جنسيا. عدا هذه المجموعات ، كل شئ مباح.<br />في هذا السرد السريع لتصاعد الأزمة يتضح أن المحرك الرئيس لها كان مسلمو الدنمارك الذين إستـفزتهم عجرفة الصحيفة ورئيس الحكومة الدنماركية. وهنا علينا أن نتساءل لماذا لانرى تحركات مشابهة من مسلمي أميركا. فمنذ واقعة 11 سبتمبر، والإسلام ورسوله يوجه إليهما السباب يوميا في ولاية ما بالولايات المتحدة ، سواء كانت صحيفة أو مجلة أومحطة إذاعية أو تلفزيونية .. ولم يحدث أن قام مسلمو أميركا بإرسال وفد يطلب النصرة من حكومات العرب. علينا أيضا أن نتساءل لماذا إستجابت الأنظمة العربية لطلب النصرة؟ أظن أن الإجابة واضحة وضوح الشمس.<br />من الناحية الأولى ، فقد رأت الأنظمة في هذه القضية فرصة لا تعوض لصرف أنظار الشعوب عن قضيتها الأساسية مع طغيان الداخل، والإيحاء للجماهير المنفعلة بأن معركتها يجب أن تكون مع عنصرية الحاكم الأوربي ، وليس مع تسلط وفساد الحاكم العربي. إستجابت الأنظمة (وخاصة نظام مبارك) وهي تعلم أنه لا يوجد ما تخسره في مواجهة دولة صغيرة كالدنمارك. ولهذا سكتت هذه الأنظمة عندما هددها الاتحاد الأوربي بأنه لن يسكت على مقاطعة عضو من أعضائه. ومن الناحية الثانية ، فقد تحرك مسلمو الدنمارك لعلمهم بأن بلدهم صغير لا حول له ولا قوة ، وأنه مهما كانت عجرفة رئيس حكومته ، فهو لن يستطيع في النهاية أن يصمد أمام ضغوط العرب الاقتصادية. أما مسلمو أميركا من الناحية الثالثة ، فهم يعلمون بأنهم مهما تحركوا بهدف حشد تأييد الأنظمة العربية ضد الإهانات الموجهة للإسلام في الولايات المتحدة ، فلن يجدوا إلا أذنا من طين وأخرى من عجين. كما أنهم ليسوا في حاجة للتحرك لأن كل ما يجري في أميركا معروف ويجري نشره عبر وسائل الإعلام ومواقع الإنترنت (وهو ما كان يفتـقده مسلمو الدنمارك).<br />ماذا فعلت الأنظمة العربية عندما علمت بأن حراس جوانتانامو كانوا يركلون المصحف بأقدامهم ويدوسون عليه بأحذيتهم؟ هل جرؤ زعيم عربي على مطالبة بوش بالاعتذار؟ لقد خرجت حكومة حزب مبارك بتصريحات توحي وكأنها تغار على رسولنا الكريم لدرجة أنها طالبت ــ كما أعلن السيد مفيد شهاب ــ بعدم ترشيح أي دنماركي لأي منصب دولي وعدم ترشيح الدنمارك لعضوية لجنة التمييز العنصري ، وحثت دول العالم العربي والإسلامي على المشاركة في هذا الموقف. فأين كانت غيرتها تلك طوال السنوات الأربعة الماضية عندما كان جيري فولويل وبات روبرتسون (وهما من قيادات اليمين المسيحي الأمريكي الذي ينتمي إليه بوش) يسبان الإسلام والرسول ؟ أين كانت هذه الغيرة عندما كان سب الإسلام والرسول ينشر في كبريات الصحف من أمثال الواشنطن تايمز الأمريكية والديلي تلجراف البريطانية والجيروزاليم بوست الإسرائيلية؟<br />إن المجتمعات الأوربية لا يوجد لديها مقدسات من أي نوع .. حتى كنيسة المهد عندما<br />حاصرها الإسرائيليون و قصفوها لم يحتج أحد في أوربا ، وكان المسلمون هم الأكثر تألما لما يجري لكنيسة مهد المسيح عليه السلام. ولهذا لم يستوعب رئيس وزراء الدنمارك سبب ثورة المسلمين ، وأصر على إعلاء \"حرية التعبير\" فوق أي إعتبار آخر. وبالتالي إذا كان ما فعلته الدنمارك يمكن إدراجه كخطأ، على أساس جهل الصحيفة ورئيس الوزراء بقدسية الرسول عند المسلمين ، فإن ما فعلته صحف أوربا الأخرى ، التي أعادت نشر الرسوم وأضافت إليها رسوم أخرى أكثر بذاءة ، كان جريمة متعمدة مع سبق الإصرار والترصد ، لأنهم فعلوا ذلك وهم عاقدون النية على إهانة المسلمين. فأي الفريقين أولى بالعقاب؟ لقد إحتشد الحكام العرب ضد الدنمارك ورئيس حكومتها ــ وهي الدولة الصغيرة التي لا حول لها ولا قوة ــ بينما لا يجرؤ حاكم واحد منهم على تكرار موقفه هذا مع بوش ولا حتى شيراك. فيا لها من شجاعة أن يتركوا الحمار ويضربوا البردعة. هل تستطيع حكومة مبارك أن تعلن رفضها ترشيح أي فرنسي لأي منصب دولي (وهو موقفها الذي أعلنته تجاه الدنمارك) بناء على ما نشرته مجلة (شارلي هبدو) وتأييد القضاء الفرنسي لها ؟ أظننا نعلم الإجابة لأن نظام مبارك أجبن من أن يواجه فرنسا (ولن أقول أميركا).<br />نعم لقد أخطأ رئيس وزراء الدنمارك وأخذته العزة بالإثم وظل يعاند حتى إقتنع أنه لا مفر من إعلان الأسف على إيذاء مشاعر المسلمين . وظلت الصحيفة تكابر وتعاند حتى إضطرت للإعتذار على صفحة كاملة في (الأهرام) وغيرها من الصحف. حتى الصحيفة النرويجية التي نشرت الرسوم في 10يناير إعتذرت بقوة. وهذه إنجازات كبيرة معناها واضح ، وهو أن الرسالة وصلت وأن الدنماركيين أدركوا مدى تـقديس المسلمين لدينهم ورسولهم . هنا كان يجب على المسلمين وضع نهاية للمشكلة مع الدنمارك ، ثم تصعيدها مع الإتحاد الأوربي بمطالب محددة وواضحة يأتي على رأسها إدانة الإتحاد وبرلمانه لجميع الصحف والمجلات التي تعمدت الإساءة إلى المسلمين بإعادة نشر الصور، ثم إعلان الإدانة لكل ما يرتبط بظاهرة الإسلاموفوبيا في أوربا (التحريض على كراهية الإسلام والسخرية من رسوله وشعائره وتـقاليده) كما هوالحال مع معاداة السامية والتشكيك في المحرقة النازية. لقد أصدر \"المركز الأوربي لمراقبة العنصرية وكراهية الأغيار\" تقريرا في إبريل2004 عن تـفشي معاداة السامية في أوربا ، علق عليه رئيس البرلمان الأوربي بمطالبته للقوى السياسية الأوربية بالتوقيع على \"ميثاق الأحزاب السياسية الأوربية لمجتمع غير عنصري\" من أجل التعامل مع \"سرطان معاداة السامية\". وأكد تقرير المركز الأوربي على أن \"الأحداث العنصرية تنخفض عندما يشدد القادة السياسيون على الملأ بأنه لا تسامح مع كراهية الأغيار.\" وما نريده من أوربا هو مواقف غير متسامحة مع الصحف العنصرية التي تصر على سب المسلمين وإهانتهم ، ومطالبة الدول التي تجرم معاداة السامية ، وعلى رأسها فرنسا ، بتجريم معاداة الإسلام. إما هذا وإما إتخاذ موقف قوي وواضح من كل من يرفض إدانة أو تجريم العداء للإسلام والتحريض على كراهيته.<br />إذن فإني أرفض مقاطعة الدنمارك للأسباب التالية :<br />أولا: أن هذه التجربة هي الأولى التي تسئ فيها الدنمارك للمسلمين, وأرى أنه يجب وضع نهاية لها باعتذار الصحيفة. وعلينا ألا نأخذ البرئ بذنب المذنب إلا إذا تكررت الإساءات ، وتبين أن هناك إصرارا على الجرم.<br />ثانيا: أن الأولى من مقاطعة الدنمارك هو مقاطعة فرنسا التي منح قضاؤها ضوءا أخضر للإساءة للإسلام في صحافتها ، ومقاطعة إيطاليا التي سب رئيس وزراءها الإسلام علنا. وإذا علمنا أن أسواقنا مليئة بمنتجات أوربية ، فهل المطلوب هو مقاطعة منتجات الدولة المعتذرة والتي إرتكبت الجريمة عن جهل ، لكي نشتري منتجات الدول غير المعتذرة والتي إرتكبت جريمتها عن عمد وسبق إصرار على إهانتنا ؟ أي منطق سقيم هذا؟<br />ثالثا: أرفض مقاطعة الدنمارك لأنه إجراء غير ممنهج ، ورد فعل إنفعالي تقرر بناء على مصادفة لا يد لأحد فيها إلا مسلمي الدنمارك. أقاطع إذن عندما تكون المقاطعة سياسة ثابتة تجاه كل من يهين ديني ورسولي.. عندما يكون لديّ آلية لمراقبة صحافة وإعلام الغرب وتصريحات مسئوليه والتصدي لكل كلمة مسيئة تصدر عن أي صحيفة أو تلفزيون أو مسئول ، كما يفعل اليهود. أما أن أنفعل وأغضب بناء على مصادفة ، ثم أقاطع إنتـقائيا فهذا أمر أرفضه.<br />رابعا: أرفض المقاطعة على خلفية تدخل حكومة حزب مبارك الفاسدة باستغلالها السياسي<br />للقضية. عندما تكون لدى هذه الحكومة الشجاعة اللازمة للمطالبة بعقاب مسئولي أميركا<br />وفرنسا على ما يصدر في بلادهم من إساءات للإسلام ، سيختلف الأمر.<br />خامسا: المقاطعة فعل إحتجاجي سلبي يحتاج إلى فعل إيجابي مصاحب له يخرج هذه الشعوب من جهلها بالإسلام ودعوته. بدون هذا الفعل الإيجابي من جانبنا ، فإن شعوب أوربا التي إعتبرت إسرائيل الخطر الأول على السلام العالمي ستـنقلب علينا ، بينما القرآن يحثـنا على أن ندفع بالتي هي أحسن (.. فإذا الذي بينك وبينه عداوة كأنه ولي حميم).<br />سادسا: دعوة المقاطعة التي تستند إلى رفض رئيس وزراء الدنمارك الإعتذار أرفضها لأن الرجل محق عندما يرفض الإعتذار عن خطأ لا علاقة له به. والذين يصرون على إعتذار رئيس الحكومة لا يتبينون للأسف بأن هذه سنة ليس في صالحنا إقرارها دوليا ، وإلا كان على حسني مبارك أن يعتذر لليهود كلما كتب مصري عن الهولوكوست بأسلوب يعتبرونه مهينا. فهل نقبل ذلك؟ إن مبارك عندما يُسأل في رحلاته إلى الولايات المتح<br />24/02/2006<br />اقرأ بقية التعليق .."
