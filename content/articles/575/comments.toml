author = "المغربي"
posted = "2006-02-20"
text = "للرسول رب يحميه هذا لا ينفيه أحد أو يختلف فيه أي مسلم الرسول صاحب الرسلة لكل البشرية ولكن أيضا لانستطيع أن نبقى مكتوفي الأيدي ونعرف أن لا يكتمل ايمان المرأ حتى يكون النبي أحب من الناس والأهل والنفس فكيف نبقى مكتوفي الأيدي أقل ما نستطيع فعله هي المقاطعة وهذا سيأثر على حياتهم المليأة بالترف ولا يكترثو لأي شيئ ويسمو ما قد حصل بأنها حرية وأية حرية هذه وسيذوقون شر ما فعلوه وسيعرفو بأن حياتهم الرغدة و النعيم الذين يعيشون فيه ببسب الأسواق العربية والاسلامية وسيذوقون المر بعد هذه المقاطعة والله أكبر"
