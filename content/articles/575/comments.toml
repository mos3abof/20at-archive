text = "د. صلاح عـز : بتاريخ 24 - 2 - 2006 جريدة المصريون<br />عندما بدأت الكتابة حول أزمة الدنمارك منذ أربعة أسابيع ، كان في تصوري أن القضية لا تستحق إلا مقال واحد يتناول سبب إستخفاف صحافة الغرب بنا. غير أن هذه القضية ظلت تتفاعل إلى الدرجة التي إستدعت مقالا رابعا على ضوء التطور الخطير الذي إنتـقـل بها من مرحلة المكاسب إلى مرحلة الخسائر. المرحلة الأولى صاحبها تفهم الرأي العام الأوربي لحساسيات المسلمين ، وكان الغضب فيها مبررا والاحتجاجات متحضرة قادت إلى مكاسب كان علينا أن نقـنع بها ، مثل إعتذار الصحيفة الدنماركية الذي تكرر أكثر من مرة بجميع اللغات ، وإعلان رئيس وزراء الدنمارك الأحمق عن أسفه لما جرى ، ومواقع الطلبة الدنماركيين التي نشرت رسائل إعتذار ومصالحة للمسلمين ، عليها توقيعات آلاف الدنماركيين. أما مرحلة الخسائر فقد صاحبها غوغائية لا تبدو لها نهاية في الشارع الإسلامي الذي إنطلق في غضبته يصرخ ويحطم ويحرق ، وهو ما إستغله الإعلام الصهيوني تماما كما توقعت في حديثي أمام مجموعة من الأخوة من حزب (الوسط) . هنا كان يجب أن تتدخل نخبة الدعاة وعلماء الدين لإنهاء الأزمة ونقلها من مرحلة الغضب والاحتجاج إلى مرحلة العقلانية والحوار. غير أن ما جرى هو نقلة إلى مرحلة الحمق والغوغائية ، أصبحت فيها الكلمة لشارع منفعل لا ضابط ولا رابط له ، وغياب شبه كامل للأصوات العاقلة (باستثناء مبادرة 42 من الدعاة الذين يقودهم عمرو خالد) ، ورغبة في تحويل كل ما تراكم في نفوس المسلمين خلال العقود الماضية من إحباطات وإهانات في إتجاه الدنمارك لأنها الهدف السهل الذي يمكن تنفيس الغضب فيه والثأر منه بلا عواقب ، أو هذا على الأقل ما يعتـقده الداعون إلى الثأر. فهل تستحق المسألة كل هذا الافتعال والمبالغة؟ وهل تستحق تحميل آيات القرآن بما لا تحتمله من معان؟ وهل تستحق أن نخسر من أجلها الرأي العام الأوربي وندفعه دفعا إلى أحضان إدارة بوش وإسرائيل؟ وهل تستحق المسألة أن يستغلها التحالف الصهيوني من أجل تعبئة عالم الغرب ضدنا حتى لا تتكرر إحتجاجات وتظاهرات شعوب أوربا ضد الحروب القادمة التي يخططون لها ؟ وهل تستحق المسألة أن توضع على رأس أولويات الشارع الإسلامي الذي لا يدري شيئا عما يجري من تهويد للقدس والأقصى وما يجري من نخر في لبنان والسودان؟<br />دعونا ننظر إلى مزيد من الحجج التي يستند إليها الداعون للمقاطعة والثأر:<br />أولا: الزعم بأن الرسوم الكاريكاتيرية مسيئة ومهينة للرسول. وكنت قد كتبت منذ أسبوعين رافضا هذا الزعم لأن أحدا لا يستطيع أن يهين رسولنا محمد عليه أفضل الصلاة والسلام. وأدلل على ذلك بآيتين كريمتين: (إنا كفيناك المستهزئين) الحجر، و(.. ورفعنا لك ذكرك) الشرح. يقول إبن كثير في تفسيره للآية الأولى \"إن الله كافيك إياهم وحافظك منهم\" ، فمن هذا الذي يستطيع أن ينال أو يسئ إلى من كفاه الله وحفظه ، ومن هذا الذي يستطيع أن يخفض من رفع الله ذكره؟ إن الإهانة لحقت بنا نحن الشعوب ، ووضعتنا في مواجهة وحل العجز الذي مرغ فيه حكامنا أنوفنا ، ووضعت الملح على جروح كل ما لاقيناه من إهانات في فلسطين والبوسنه والعراق و.. إلخ.<br />ثانيا: الزعم بأنه على الرغم من أن صحفا أخرى أوربية وأمريكية أعادت نشر نفس الرسوم ، وزادت عليها برسوم أخرى أكثر بذاءة ، إلا أن علينا مقاطعة الدنمارك فقط لأنها البادئة، ولأنها حرضت الصحف الأخرى على نشر الرسوم لكي \"يتوزع الدم بين القبائل\" ، فيعجز المسلمون عن مقاطعة الجميع. وكوننا ضعفاء لا نقدرعلى الكبار لا يعني ألا نواجه الصغار. كما أن هناك نظرية تؤكد أنك يجب أن توجه ضرباتك في مكان واحد من جسد الخصم حتى تؤثر فيه خصوصا لو كان الخصم قويا، وهذا المكان سينهك الجسد كله. هذه الحجج تتردد لتبرير الاستـفراد بالدنمارك، وتبرير الازدواجية التي نتعامل بها مع من يهينوننا ، والهروب من التحدي الذي يفرضونه علينا بالتعامل معهم كأمة واحدة كما يعتبروننا نحن أمة واحدة ويستهدفوننا على هذا الأساس ، وأيضا للرد على منطق الحمار والبردعة. وهي حجج يغلب عليها التبسيط والتسطيح ، غير سليمة شكلا وموضوعا.<br />من حيث الشكل ، سنفترض أن ضرب الدنمارك ينهك جسد الأعداء ، فلماذا يتركنا العدو نضربها بدون رد ، خاصة وأنه يتفوق علينا في ميزان القوى على جميع المستويات (باستثناء قوة الإيمان والرغبة في الاستشهاد، وهي أسلحة أبدعنا فيها في المجال العسكري فقط) ؟ وكما قلت الأسبوع الماضي فإن المقاطعة هي بمثابة إعلان حرب إقتصادية ، فماذا نفعل إذا ردت أوربا ، كما هددت ، بحرب إقتصادية على العرب ؟ هل أعددنا لهذه الحرب حتى ننتصر فيها ، أم أنه سيكون علينا التراجع المهين ؟ ثم عندما تطمئن الدول الأخرى إلى أننا سنستهدف الدنمارك فقط بغض النظر عما يقومون هم به (لأنها هي البادئة) ، ألا يعني ذلك تشجيع لصحافة هذه الدول على التمادي في سب الرسول ؟<br />أما من ناحية المضمون ، فمن قال أننا لا نقدر على الكبار؟ المشكلة هي أن أنفاسنا قصيرة في كل معركة نخوضها. ومتى كانت الدنمارك مؤثرة في جسد الغرب حتى يؤدي ضربها إلى إنهاكه؟ هذه مقولة تنطبق على إسرائيل التي تـقيم علاقات تجارية مع معظم بلاد العرب ، ولا يجرؤ أحدهم على مقاطعتها ، وإلا طرد من الجنة الأمريكية. فهل هذا هو الوضع مع الدنمارك؟ وفي المضمون أيضا ، إذا كانت الصحيفة الدنماركية أذنبت عن جهل وغباء ، فإن الصحف الأخرى أذنبت عن عمد وسبق إصرار بنية الإهانة. فمن أحق بالعقاب؟ كما أنه لا يوجد دليل واحد يدعم الزعم بوجود تحريض دنماركي للصحف الأخرى بإعادة نشر الرسوم. صحيح أنه لايوجد دليل بالعكس. غير ان تجربة عشرين عاما من معايشتي ومطالعتي اليومية لصحافة الغرب (وهي تجربة أظنها فريدة في هذا الجزء من العالم) تجعلني أقول أن الأمر لم يكن فيه مؤامرة ، وإنما فرصة إغتنمها عدد من المحررين الصهاينة والعنصريين لإهانة المسلمين تحت غطاء \"حرية التعبير\". ومع زيادة الغوغائية والعنف في الشارع الإسلامي ، وجدها الصهاينة فرصة للتحريض على الإسلام . والأمثلة كثيرة أكتفي منها بمقتطفات من ثلاثة مقالات نشرت في يوم واحد ، أضعها أمام القارئ بدون تعليق : الأول في (كريستيان ساينس مونيتور 23/2) يتساءل كاتبه جوناثان زيمرمان أستاذ التاريخ في جامعة نيويورك عن سبب عدم نشر معظم الصحف الأمريكية الرسوم الدنماركية ، ويؤكد أنه على القارئ أن يقرر ما إذا كانت هذه الرسوم مهينة أم لا ، بدلا من أن يقرر رؤساء التحرير ذلك بالنيابة عنه. ويصف شمولي بوتيتش في (جيروزاليم بوست) دين الإسلام بأنه \"بلطجي دولي\" وأنه إذا كان المسلمون يدمرون ويحرقون ويقتلون من أجل شئ عديم القيمة مثل رسوم كاريكاتيرية ، فهذا يؤكد أن كل ما يقال عن علاقة حرب العراق وتأييد إسرائيل بالعنف الإسلامي هو كذب.\" غير أن أخطر ما قرأت في هذا الصدد هو المقال المنشور في (الواشنطن بوست) الذي يحرض فيه كاتباه على<br />نشر الرسوم. يقول ويليام بينيت (وزير تعليم أمريكي سابق) وألان درشويتز (أستاذ القانون في جامعة هارفرد) : \"على مدار الأسابيع الثلاثة الماضية خانت الصحافة الأمريكية أماناتها ومسئولياتها عندما رفضت نشر الرسوم الكاريكاتيرية للنبي محمد. ثلاث صحف فقط هي التي حملت هذه الأمانة : أوستن ستيتسمان وفيلادلفيا إنكوايرر ونيويورك صن. إن تجنب نشر هذه الرسوم لا يعني إلا أن الإسلاميين الراديكاليين إنتصروا في حرب ترهيب الصحافة الأمريكية. منذ 11/9 ، ونحن نعلم أنهم يكرهون أسلوب حياتنا وفضائلنا وحرياتنا. وما لم نتصوره أبدا هو أن تكون صحافتنا الحرة هي أول من يعلن إستسلامه أمامهم.\"<br />أما أهم ما يدحض حجج دعاة المقاطعة فهو التفرقة بين الدنمارك ، وغيرها من الدول المتورطة في سب الرسول والإسلام ، على أساس القوة والضعف. نحن ندين إزدواجيتهم في المعايير المطبقة على دولة قوية محترمة مثل إسرائيل ، ودول العرب الضعيفة غير المحترمة ، ثم نفعل ما ندينه في قضية الرسوم.. والقرآن يحذرنا من هذا السلوك في قوله تعالى (يا أيها الذين آمنوا لم تقولون مالا تفعلون كبر مقتا عند الله أن تقولوا مالا تفعلون). إن ما أقدمت عليه الصحيفة الدنماركية لا يقارن بكم البذاءات المنشورة في الصحافة الأمريكية عن الرسول والإسلام منذ واقعة 11/9 ، ومع ذلك لم يقع ضد أميركا ما يجري الآن ضد الدنمارك. فمن المسئول عن ذلك؟<br />ثالثا: كتب لي أحد الأخوة القراء معترضا على رفض المقاطعة، قائلا: \"لو خسرتهم دولار واحد حيزعلوا ويبقى إحنا أنجزنا شئ\". وهنا يخلط دعاة المقاطعة بين الوسيلة والهدف. فليس الهدف هو تدمير شركات دنماركية لا ذنب لها في قضية الرسوم ، وإنما الهدف (الذي أرفضه لعدم منطقيته ولما قد يتمخض عنه من عواقب وخيمة) هو أن تجبر الحكومة الدنماركية على الاعتذار تحت ضغط من هذه الشركات. غير أن حكومة الدنمارك تنتمي إلى اليمين العنصري الذي تحتل الكراهية حيزا واسعا في تفكيره ولايعبأ بما يقع على شركات وطنية من اضرار.<br />يقولون أيضا أن المقاطعة الشعبية الواسعة أصابت عدة شركات دنماركية بخسائر كبيرة ، وهو ما يعني فعالية هذا السلاح. وهي مقاطعة وليدة بضعة أسابيع فقط ، فكيف يكون الحال لو إستمرت لشهور وسنوات؟ وأرد على هذا بالقول : ومن قال أن المقاطعة لن تضر في المدى القريب بدولة صغيرة لا حول لها ولا قوة ؟ إن القضية تتعلق بالطرف المتضرر في المدى البعيد ، والذي يجري الآن تعبئة الرأي العام الأوربي ضده على خلفية هذه القضية. وطالما أن المقاطعة فعالة مع الدنمارك ، فلماذا لا نوسع نطاقها ونطبق معيار واحد على الكل؟ لو أن المقاطعة كانت خطوة مخطط لها على طريق الاكتـفاء الذاتي والاستغناء عن واردات أوربا ، لكنت أول الداعين لها. ولو كانت خطوة على طريق التجهيز لمقاطعة أشمل وأوسع لقوى الغرب من أجل نصرة فلسطين والعراق ، واستعدادا لمستـقبل قاتم يتوحدون فيه ضدنا ، لما كانت هناك مشكلة. أما أن تكون المقاطعة وسيلة للزعم أننا \"أنجزنا شيئا\" ، وتكتيك يفتـقد الاستراتيجية الداعمة له ، فهو في هذه الحالة يعتبر سوء إستخدام وإبتذال لهذا السلاح الخطير. وأن توصف هذه المقاطعة السهلة بأنها تعبير عن \"ثـقافة المقاومة\" ، فهو أمر عجيب. لأن المقاومة تعني المجاهدة . وأنا لا أرى صراحة أية مجاهدة في مقاطعة عدد من ماركات الجبنة ، أو لعب الأطفال. ما يحدث لا علاقة له بالمقاومة، وإنما هو إنفعال مدفوع بعاطفة غير منضبطة قصيرة النظر، غير مستعدة للغوص في أعماق الأزمة للبحث في خلفياتها واستشفاف أبعادها.<br />رابعا: أحد الأخوة الأعزاء الذين أحبهم في الله وصل به الإنفعال ليس فقط إلى حد الدعوة الغير منطقية إلى إجبار الدنمارك على تغيير دستورها بما يتلاءم مع مطالب المسلمين ، وإنما أيضا إلى حد الإستخدام الخاطئ للآية القرآنية (وإذا رأيت الذين يخوضون في آياتنا فأعرض عنهم حتى يخوضوا في حديث غيره) ، فقال إن الإعراض هنا يعني المقاطعة الاقتصادية. بينما كلمة الإعراض معناها واضح ، وهو، كما يقول إبن كثير، عدم مخالطتهم والجلوس معهم. والعرب أصلا لا يجالسون الأوربيين ولا يخالطونهم تاركين عقولهم فريسة للإعلام العنصري والصهيوني. أي أننا أصلا معرضون عنهم بلا سبب سوى تقاعسنا عن حمل الأمانة المكلفين بها ، وهو ما فتح الباب للقوى العنصرية للوصول إلى الحكم.<br />إن التنفيس الأمثل عن الغضب والرد الأفعل على الإهانة لا يكون بالغوغائية والحجج المتآكلة، وإنما يكون بإغداق ملايين الدولارات على السلطة الفلسطينية الصامدة التي يراد إسقاطها والشعب الفلسطيني البطل الذي يراد تجويعه. التنـفيس الأمثل والرد الأفعل لا يكون بافتعال معارك مع حكام أوربا العنصريين لأن معركتنا كانت وستظل مع حكام العرب الطغاة . يكون الرد الأمثل بفعل كل ما يمكن القيام به على طريق إنهاء حكم الظلمة الذين ترعاهم وتحميهم قوى الغرب ، وذلك بإغراق الصحف المصرية بخطابات تطالب بمعاقبة بلطجية يوم الاستفتاء ومن أرسلهم لانتهاك أعراض أخواتنا ، وبمعاقبة كل مسئول أمر بإغلاق لجان الانتخابات ، وإسقاط عضوية كل عضو مجلس شعب إحتل مقعده بالرشوة ، وإعتذار الرئيس مبارك عن كل ما جرى في عهده من جرائم وآثام سواء كان تزييف إرادة الشعب أو كارثة شركات توظيف الأموال أو كارثة العبارة أو تهريب المليارات إلى الخارج أو.. إلخ. إن دور النخبة ليس الإنقياد و<br />24/02/2006<br />اقرأ بقية التعليق .."
