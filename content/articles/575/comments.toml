subject = "عفوا لن نقرأ لعلي"
author = "اولاً تحياتي للأخ علي على هذه المقالة(الزباله) .. وآسف كثيراً لاستخدام هذا اللفظ لأنني لا احب أن أقم بتجريح أي شخص لكن لم يجد لساني تعبيراً أخر لوصفها غيره. يا اخ علي : كنت من اشد المعجبين بمقالاتك وطريقتك في الكتابة وكنت أقرأ بشغف كل ما يكتب تحت أسمك (المصون قبل هذه المقالة بالطبع). لكنك إنجرفت مثل غيرك من الكتاب في هذا الموقع(ليس كلهم بالطبع للانصاف) في نبرة التعالي علي البشر وعدم الاعتراف بالخطأوذلك عندما تجنبتم إبراز موضوع المقاطعة رغم مطالبة الكثير من الشباب لكم بذلك اعتقاداً منهم انهم (صوت الشباب) لكنك كما تنبأ أحد الشباب خرجت علينا بموضوع تبرر فيه عدم تناولكم وإبرازكم لموضوع المقاطعة بمنطق تكسير العظام ولغة تحبيط العزائم واستراتجية تبرير الخطأ بالخط. أجبني يا أخ على على هذا السؤال وأتحداك إن أجبت عليه: هل لو ضربك أحد الأمريكان على قفاك وانت ماشي في الشارع هل ستسكت عليه وقتها بحجة ان العرب لم يتحركوا وسكتوا للأمريكان عندما احتلوا العراق وضربوا الشعب العراقي؟!. يا أخ علي التصرف السلبي(إلى حد ما) تجاه إهانات الأمريكان وغيرهم من الغربين السابقة للاسلام والمسلمين واعتداهم عليه، لا يعني ولا يبرر أبداًان نسكت دائما على ما يحدث بمطق (هما اللي قبلنا عملوا أيه) و(إشمعنا إحنا). لماذ لم تكتب يا اخ علي الموضع بمنطق أن هذه لافتة إيجابية من الشعوب العربية والاسلامية وان نشيد بهذا الموقف ونقوم بالتنظير لهذا الموقف ليكون موقفنا دائما تجاه من يستهزا بديننا ويعادينا. الموضع الذي كتبته يا أخ علي أكد لي بجلاء بعض الأشياء:"
posted = "2006-02-02"
text = "- اولاً انك أصبحتم صوت أنفسكم لا صوت الشباب بل للأسف كان منطقكم في موضع المقاطعة اقرب إلى منطق رئيس الوزراء الدنماركي(ربما يكون رشاكم) أي اصحتم صوته.<br />- ثانياً: أنكم حبة عيال بتكتب وخلاص بلا منطق قوي يتم الاستناد عليه ولا فكري راجح تتحركون من خلاله.<br />- ثالثا: يبدو أن ًالأخ علي كان سكران وهو بيكتب الموضوع أو ربما داخل شريك مع احد المستثمرين الدنماركيين وبيوزعوا مع بعض بضائع دنماركيه في السوق.<br />أرجو يا اخ علي أن تراجع نفسك وتعلن اتوبة عما بدر منك. وإلا فأنا أطالب من الان بمقاطعك ومقاطعة ما تكتبه وان يرفعوا شعار (عفوا لن نقرأ لعلي).<br />في النهاية أرجو ان تسامحوني على أي لفظ غير مناسب صدر مني لكني أؤكد دائماً انني لا أقصد التجريح واني اكن كل إحترام للجميع. فكلهم اخوتي في الاسلام. لكن ما كتبته من باب وذكر فغن الذكرى تنفع المؤمنين."
