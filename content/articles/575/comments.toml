subject = "حكومة مصر تسب الله ونبيه وهذا الدليل"
author = "غريب محمد"
text = "مركز الإمام على لحقوق الإنسان<br />عضو الشبكة الدولية لدعم الديمقراطبة<br />karar0000@yahoo.com - www.alkerar.com<br />عناوين الرسالة<br />رسالة خطيرة من قائد العرض الرياضى امام مبارك يكتبها من زنزانة الموت \"عربة الترحيلات\"..قادة أمن الدولة يسبون الله والنبى ص ويقولولون ان ابا لهب معرفش يتعامل معه ولو موجود الان هاعلمه الأدب.. هى دى مصر مبارك يابطل.. مرفق وثيقة بخط اليد<br />ومتى لم يسب الرسول وآله ياتجارالدين ؟؟<br />حرب الشيدر<br />هل تحاكم نقابة المحامين مبارك اسوة ببوش؟<br />__________________________<br />نص رسالة عسكر بلامونتاج ومرفق ملف بصورة منها..سبوا الله ونبيه وانا اللجوء الى امريكا او اسرائيل<br />السلام عليكم ورحمة الله وبركاته<br />الي اخي الحبيب الأستاذ الفاضل محمد الدريني عفاك الله من اي سوء عفاك الله من اي بلاء وارجو ان تكون في اتم صحة وعافية لقد كتبت اليك يااخي الحبيب رسالة وكتبت لك المختصر والآن سأكتب لك عن اشياء كثيرة وياريت تنشرها بمعرفتك وفي اقرب وقت وفي جميع الصحف ارجو مساعدتك لي يااخي الفاضل كنت اود ان اخرج من هذا السجن اللعين لكي اكون بجوارك واكون معك في اي شيئ ولكن قدر الله وماشاء فعل, واريد اخي الكبير ان يقف وقفة معي كبيرة ماشي يااستاذ الاساتذه ياابو فاطمة كيف حال فاطمة وام فاطمة لعلهم ان يكونوا في احسن صحة وعافية وجميع الأولاد سلامي إليك بقلبي ويدي وعقلي وارجوا ان اكون معك دائماً وانا اعلم عنك الكثير والكثير الرجولة هذا وارجو نشره في اي صحف ومعها صورتي ، بطل مصر يقول من وراء القضبان وقول انت ماشئت لانك افقة مني واعلم مني ولكن سأقول لك علي المسودات وتنشر انت ماتحب نرجع للقول العنوان عقيد عبد اللطيف بدران يسب الله عز وجل ويسب رسول الله عندما ذهب رضا فوزي عسكر الي فرع الشرقية بالزقازيق جاء عبد اللطيف بدران وامر المخبرين بان يعصبوا عينيه ثم بعد ذلك امر بتعليقي مثل الذبيحة ثم ظل يكهربني في المناطق الحساسة فعندماقلت له اتقي الله ياباشا قال لي بألفاظ قبيحة ياابن ويا ابن لو الله نزل من السماء ساعذبه معك والكثير يشهدون علي ذلك ثم سب الله سب صريح فقلت يان انت يارسول الله فقال هه من رسول الله وقال يابن الو وابن الـ بأقبح الشتائم لو الرسول موجود في هذا العصر لعذبته واعتقلته مثل الكلا .. لا احب ان اكمل الكلمة, وقال ابو لهب حمار معرفش يعامل هذا الرجل اما نحن امن الدولة العليا لااحد يقدر علينا والله قال هذا كله واكثر واريد نشره علي مسؤليتي بصورة مني وهذا دليل خط يدي علي هذا او اكمل الباقي انت يااستاذ محمد الدريني جعلك الله عونتا لكل مظلوم ولي انا بالأخص ,,وظل يعذبني ويعذبني ثم يأمر المخبر بان يتبول في فمي وفي اذني وانا عريان واكمل الباقي فانت تعلم الباقي كله وهناك شهود بذلك فقال آخر انني لا اعلم بعد هذا المقال الأول سيمكرون بي او يغربوني الي اي سجن اخر وانا مستعد لاي شييء وافعل ماشئت فانا علي رضا علي ما تفعله من اجلي ووكلتك في امري عليك وعلي عبد اللطيف بدران كل شيئ عليه الآن وبعد الآن عليك به.. نرجع للمقال 2 ذهب عبد اللطيف بدران الي سجن ليمان ابي زعبل عندما تم تهريب رضا فوزي عسكر الي هناك فقام بنفسه بتعذيب رضا عسكر وامر مامور السجن بان يكون ليس عليه اي لبس يعني عريان كما ولدته امه ويعلق من حين لآخر وامر بان لايدخل عليه طعام ولا شراب لمدة ستة ايام وظل رضا مسلسل بالكلبشات ومعلق حتي 6 ايام ثم جاء مندوب من طرفه وقال له هو يلعنه وخلي الصحف تنفعك وان مت ملكش اي دية وممكن نموتك ونقول مرض ومات او اي شييء امن الدولة مش هتغلب فيك يا، ويااا ويا اا وياكل الشتائم ثم اعلنت الأضراب عن الطعام وهم يعذبوني بأمر من عبد اللطيف بدران عصابة كبيرة يحكمها كلاب امن الدولة مثل عبد اللطيف بدران وغيره من الظالمين وعندما قربت علي الموت جائني مندوب من عند اللواء مصطفي رفعت وقال لي فك الأضراب وسنأمر بالأفراج عنك قريب ففكت الأضراب بناءاً علي وعود من قبلهم ولكن تعنت معي بدران في الفرع مرة اخري وقام بتعذيبي بكل انواع العذاب ويقول خلي الشيعة تنفعك يقصد الأستاذ محمد الدريني وزادت المعناه وزاد العذاب مرة اخري علي يد عبد اللطيف بدران المقال الثالث وهو اعلان بكل ما قلته من تعذيب ومن الأعتداء علي المنزل وضرب ماذكرته رضا فوزي عسكر المعتقل بدون اي تهمة او اي شيئ يريد محاكمة عبد اللطيف بدران محاكمة عادلة لانهم منعوا رضا بان يوكل محامي لكي يرفع قضية تعذيب علي عبد اللطيف بدران الظالم المعتدي ويريد مساعدته في رفع قضية علي بدران الظالم المعتدي ويريد مساعدته في رفع قضية علي بدران وعنده شهود كثيرة ويقول الكل هنا يمشي من امن الدولة لانهم يعلمون عنهم انهم يفعلون مايشاؤون وايضاً ارجوا مقالات منك يااخي وصديقي الحنون وانا متاكد منك ومن وقوفك بجواري اكتب كل شييء واي شييء وفي اي شيئ المقال الرابع من قبل طلب رضا فوزي عسكر اللجوء الي اسرائيل فهو يقرر ويقرر اللجوء الي اسرائيل وارجو ان ياتيني السفير الأسرائيلي او السفير الأميركي لماذا ؟لان اسرائيل تحترم الله ولاتسبه اماعبد اللطيف بدران وغيره يسبون الله ورسوله .<br />ثانياً لان هناك في اسرائيل عندهم حقوق للأنسان اما هنا علي يد بدران الظالم لايعرفون اي حقوق للأنسان بل يعاملونا كالجمادات يعني الحيوانات افضل منا في هذا البلد ثالثاً زوجاتنا وامهاتنا واخواتنا واخواننا يعيشون في ذل دائم من قبل امثال بدران فإني اطالب بجدية هذا اللجوء السياسي الي اسرائيل وبسرعة وكل ذكره هو بدران بدران الخائن الظالم .<br />ارجو ان تكون رسالتي واضحة كنت اكتب هذه الرسالة في عربة الترحيل فأنني لفيت جميع السجون النطرون 2- ابي زعبل 3- الأستقبال 4- ليمان ابي زعبل 5- الوادي الجديد 6- 440 وغيرهم<br />ارجو يااخي الحبيب ان تفعل لي اللازم وفي اسرع وقت واطمن ولو علي موتي لا اقول انك فعلت كذا وكذا إلا ان قلت انت فإنني افديك بروحي لانك تجاهد جهاد اصيل فانت نعمة الرجال وطلبي منك ان تعين لي محامي يرفع لي قضية تعذيب ضد عبد اللطيف بدران وايضالاكثرمن 4 هنا<br />والسلام عليكم ورحمة الله وبركاته<br />بيان اسرة الزمر<br />في الوقت الذي نتوجه فيه بالشكر الى كل المتضامنين معنا المهتمين بمحنتنا منذ اختفاء ابننا عبود الزمر فإننا ندعو كل المهتمين بالشأن العام في بلادنا ان يقوموا بواجبهم تجاه الدفاع عن الرجل والكشف عن مكان وجوده ومصيره حتي لانترك السلطات في بلادنا تعبث بمصائر المدافعين عن كرامة هذا الشعب وعزة هذا الوطن ... كما اننا نعلن للكافة ان أي ايذاء يلحق بعبود الزمر لن يمر مرور الكرام بل سنواجه المسئولين عن ذلك بكل الوسائل حتي لو اضطررنا الي اللجوء الي الأمم المتحدة .... ولايسعنا إلا ان نعلن للجميع ان المتابع لمواقف وتصريحات عبود خلال عام 2005 يجعل اصابع الأتهام بشأن اختفائه تتجه وجهة محددة حيث عملت بالفعل علي اخفاء هذا الأسم المزعج والذي يثير الأضطراب علي الخريطة السياسية الجديدة التي تجري رسمها خلال عام 2006 فلم يكن احد يتوقع ان يمر ترشيح عبود لرئاسة الجمهورية دون حساب وهو مالم يحرم منه ايمن نور او نعمان جمعة وان كان بشكل أقل قسوة . ان اسرة الزمر لتأسف وهي ترصد في ذات الاسبوع الذي يدشن فيه جمال مبارك خطواته في اتجاه الرئاسة بتوليه نائباً للأمين العام للحزب ترصد ايضاً العمل علي اخفاء عبود الزمر عن المشهد السياسي المصري ..ان احد لايشك في ان مواقف عبود ومطالبة بشأن حقوق التيار الأسلامي والأفراج عن كافة المعتقلين والسجناء السياسين ومحاكمة المسؤلين عن التعذيب هي السبب الرئيسي وراء اختفائه ولهذا فاننا نهيب بالكافة إلا يصدقوا المعلومات التي تسربها المصادر الأمنية بِشأن مصيره . وليكن الأصرار علي ضرورة ظهوره مرة اخري واجباً علي كل الشرفاء في هذا البلد قبل ان يأتي يوم لاينفع فيه الندم<br />اسرة الزمر<br />____________________________________________<br />ومتى لم يسب الرسول وآله ياتجارالدين ؟؟<br />احمد مهدي الياسري<br />منكر هذا الذي يحصل من قبل بعض الصحف الدنماركية وغيرها ممن يستهزئون بنبي الرحمة والسلام والانسانية محمد صل الله عليه وعلى آله وسلم , نبي الامة الذي ما اختاره الله الا ليتمم به وبآله مكارم الاخلاق وليعطي للانسانية رونقا ما كان سيتوفر لو مضت تلك الجاهلية الرعناء وفق مناهجها الخاصة واجرامها وفجورها , مناهج الوأد والربى والسحت والكثير من اللاقيم.<br />ولكن هناك سؤال يتبادر للذهن في هذا الوقت وخصوصا حينما رايت تلكم الامة التي بالامس القريب جدا يتكلم احد رموز الخرف الاعلامي من على قناة الـ anb حيث يقول عن الفعل الارهابي الاجرامي الذي قام به مهدم ومحارب الاسلام ورسوله واله الاطياب الاطهار اسامة ابن لادين في نيويورك بانه غزوة كغزوة بدر الكبرى !!!<br />بهذا المنطق السفيه يقول الكثير ممن تربوا في مدرسة الارهاب الاموي مدرسة اللحى المقملة والمجرثمة , مدرسة قصير القمصان وطويل البهتان , تلك هي مدرسة من سن سنة السب والشتم بحق اطهر خلق الله رسول الامة محمد صل الله عليه وعلى اله وسلم , حيث سنت تلك العاهات الاجرامية تلك السنة السيئة بعد ان انقلبت على الحق وهظمت حق ال بيت محمد عليهم افضل الصلاة والسلام وهم نفس الرسول وروحه وهم خزان علم النبوة ومصدرها الاوثق .<br />من حق اي مسلم حقيقي ان ينبري للدفاع عن رسول الامة ونبي الرحمة ولكن قبل ذلك تعالوا نحاسب المسبب لهذا السب القادم من الشمال والغرب الاوربي تعالوا نحاسب تلكم المدرسة التي هي اليوم تحتج على سب اعظم خلق الله وهي في نفس الوقت تترحم على من آذى عترته وتقول عن امير السب وشتم امير الاسلام ذو الفقار علي الدر وباقي الناس تراب بانه امير المؤمنين واجب الطاعة وانه من المرضي عنهم عند الله .<br />ولا ادري كيف يرضى الله ورسوله عن امة تهب اليوم تحتج على شتمه من قبل الاغراب وهي اول واقذر شاتميه على المنابر دهرا من الزمن وعمر ابن عبد العزيز يشهد على ذلك وهو من منع واوقف تلك المخزية من وصمات العار الاموي المجرم وتلك ومنائر الشام الخمسة في جامعها الاموي تشهد على ذلك ولو نطقت لقالت للعالمين ان من قال عنه رسول الانسانية علي مني وانا من علي , انا مدينة العلم وعلي بابها , يا علي أنت أخي وأنت مني بمنزلة هارون من موسى غير انه لانبي بعدي ، أما علمت يا علي أن أول من يدعى به يوم القيامة يدعى بي ، قال : فأقوم عن يمين العرش في ظله فاكسى حلة خضراء من حلل الجنة ، ألا وإني اخبرك يا علي أن امتي أول الامم يحاسبون يوم القيامة ، ثم أنت أول من يدعى لقرابتك مني ومنزلتك عندي. تخبرهم تلك المنائر انه هو ذا علي نفس الرسول وروحه وتلميذه واخيه من يسب ولولا انه خاتم الانبياء لكان هو النبي كما كان هارون لموسى ولكن لانبي بعدك يا ابا القاسم .<br />امة تتاجر بك يارسول الله ردحا من الزمن تاتي اليوم لتعلن على العالمين ان من يسبك هو فاجر ساقط على الامة انكاره وان من يقول بمدح من سب رسول الله ومن احب رسول الله فهو منكر سافل وهنا عظمة عدلك رباه حيث امهلت ولم تهمل تلك المدرسة السارقة لحق رسولك لياتي اليوم لتخزيها بايديها حيث انها اعلنت انهم الملعونين وانهم المذمومين لانهم يقدسون من شرع شرعة سب الرسول وآله الاطهار .<br />السؤال الاهم هذا اليوم هومن الذي اعطى هؤلاء الاغراب في الدنمارك لا بل في كل انحاء الدنيا وان لم يصرح البعض منهم المبرر بان يطعنوا بالاسلام ورسول الاسلام صلوات الله وسلامه عليه وعلى آله ؟؟؟؟؟؟؟<br />اليس هو منهجكم الاعور وطريقتكم السفلى في التعاطي مع انسانية الانسان وقدسيته بطريقة حز الرؤوس الطاهرة والعاهرة معا وفق منهج خالف القرآن الذي يقول وادعوا الى سبيل ربك بالحكمة والموعظة الحسنة وجادلهم بالتي هي احسن , ووفق مهج لاتكن فضا غليض القلب فينفضوا من حولك , او وفق منهج وادرء السيئة بالحسنة فاذا الذي بينك وبينه عداوة كأنه ولي حميم.<br />اليس هو منطق اميركم اول من سن سنة سب اطهر خلق الله على ارض انتم كنتم فيها علي ابن ابي طالب عليه السلام حبيب رسول ونبي هذه الامة والان تحتجون على سب معلم علي عليه السلام وها هوبخاريكم ينطق بذلك ولست انا حيث يقول:<br />(أخرجه البخاري: (كتاب العيدين، باب الخروج إلى ال<br />07/02/2006<br />اقرأ بقية التعليق .."
