text = "مروة ألست أنتي البنت المثقفة في موضوع كنيسة الأقصر؟؟؟<br />http://www.20at.com/article2.php?sid=292<br />على العموم نحن المسلمون لا نرضى بتشويه صورة أي نبي و على رأسهم سيدنا محمد و مش غيرنا حيفرض رأيه علينا<br />ثم هل كان نبينا ( محمد ) بهذه الأخلاق البشعة كما صورها المخبوا في الصحيفة الدنماركية؟<br />و إن كان الموضوع حرية و ديمقراطية... لماذا لا يتكلمون عن إسرائيل أو الهولوكوسة؟<br />و أخيرا.. بما أن الموضوع حرية و ديمقراطية فمن حقي أن أسبك يا مروة و أقول عليكي كذا و كذا و ليس من حقك الدفاع عن نفسك"
