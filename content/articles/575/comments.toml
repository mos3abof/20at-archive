[[comments]]
order = 38
subject = "سامي عندو الحل"
author = "سامي الفلسطيني"
posted = "2006-02-19"
text = "السلام عليكم<br />مساء الخير يا قوم<br />انا اقول باختصار في موضوع التهجم على نبينا محمد صلى الله عليه وسلم<br />من تهجم عليه واحد حاقد على الاسلام واهله ومدفوع من جهات حاقدة تحركها الصليبية الغربية هذا اولا<br />ثانيا ان لست مع حرق السفارات والتهجم على الاخريين انا اقدر حب الرسل عن اهل الاسلام ولكن اقول ان تحرك الجماهير جاء بعد موقف الصمت المخزي من قبل اقطاب النظام العربي الرسمي ،، وجاء ايضا بعد تخاذل ما يسمون علماء الامة الجبناء عن اتخاذ موقف مشرف في هكذا قضية<br />كان الحل من وجهة نظري هو احلال وهدر ردم هذا الحاقد ليكون عبرة لغيرة كما حدث مع الحاقد سلمان رشدي والذي اختفى كالكلب الاجرب وهذا يكفي<br />لكن للاسف لا يوجد اب يدافع عن المسلمين اب يمتللك ايدي تخربش الاعداء<br />هذا الحاقد لا يستطيع سب اليهود لانه يخاف منهم لا غير<br />متى يخافنا الغرب<br />اقول ايضا ان السفارات التي حرقت ستبنى على حساب وزارة الماية في بلاد العرب يعني على حسابكم<br />اما عن معاداة شعوب اوروبا فهم ومعهم الشعب الامريكي شعوب غبية<br />يريد عمر خالد عمر خالد ان يذهب اليهم على حساب من ستذهب يا عمر انا اكرهك في الله يا اخي لا اطيقك على الاطلاق ولا اطمئن لك ابدا لم احبك يوما ما<br />ستحاور من شعوب لا تفهم لا بالدين ولا يوجد عندها شيء مقدس وتؤمن بحرية مطلقة لا حدود لها ولا يعرفون عن محمد او عيسى او موسى شيئا انا اعتقد ان الحوار معهم ربما ينجح لو كان حوار في منطق الحرية بمعنى ان يفهم اهل الغرب ان الحرية يجب ان تلازم العدالة يحق لك ان تقول دون ظلم الاخرين العدالة عنصر التحكم في مد وجزر الحرية هذا ما اقوله للغرب<br />لا ان اذهب على طريقة عمر خالد اتوسل واعتذر وابكي وانوح يا اخي لن يرحمك التاريخ انت والمال السعودي الذي سيسهل لك تكلفة هذه الرحلة<br />انا قلت الحل اهدار دم هذا الحاقد وفقط ولا نوسع المسالة بالعكس يتم تضيق المسالة في شخص هذا القذر وشكرا لكم اخوكم samii666@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

