subject = "صحيح ولكن.."
author = "نعيم"
posted = "2006-02-01"
text = "صحيح أن أكبر مجرم هو حكوماتنا العربية..<br />وصحيح أن أكبر إهانة لرسولنا الكريم هو تخاذل الحكومات العربية العلمانية عن نصرة الاسلام والمسلمين سوء على أرض فلسطين والعراق أو على كثير من الأراضي حيث يقتل المسلمون بحجة الارهاب...<br />أقترح أن تقوم الشعوب العربيةالمسلمة بمقاطعة شاملة للحكومات العربية بعد الانتهاء من أمر الدنمارك<br />ونحن فعلا لا نهتم لرأي الحكومات، لأن المقاطعة رد فعل عفوي من كل مسلم غيور..بغض النظر عن انتماءاتنا الحزبية والطائفية<br />لعنة الله على أمريكا ومن على شكالتها<br />ونسأل الله الهداية لرؤسائنا العرب أو أن يستبدلهم بقوم أعزاء على الكافرين أذلاء على المسلمين<br />وشكرا لكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

