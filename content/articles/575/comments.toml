[[comments]]
order = 0
subject = "سفسطة اخر الليل"
author = "أكرم بس"
posted = "2006-02-01"
text = "تعليقا على مقالكم المبجل و استجداء عطفكم للدفاع عن نبينا و نبيكم احب ان اوضح لكم بعض النقاط<br />1- من قال لكم اننا ننتظر شيئا من الحكومات العربية لنصرة الدين بل نريد مقاطعه شعبية عارمة و غضب عام يجبر الحكومات على احترام الاسلام ( بالغصب يني )<br />2- من قال لكم اننا لا نقاطع السلع الامريكية و الاسرائيلية<br />3- صدق قول صديقنا المعلق على مقالة العام الهجري الجديد انكم ستعودون و تناورون باسلوب اشبه بالسفسطة منه الى الحوار مع رواد الموقع الكرام ( و انا منهم )<br />4- انت تقول للرسول رب يحميه على غرار قول عبد المطلب للبيت رب يحميه فهل لو اقام الامريكيين مله لهدم الكعبة فهل ستقول ساعتها للبيت رب يحميه<br />5- حسبنا الله و نعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

[[comments]]
order = 1
subject = "الحملة الشعبية"
author = "أكرم الشجاع"
posted = "2006-02-01"
text = "اولا يا صديقي الذي لا يقول ان محدش مقاطع احب اعرفه ان في حاجة في مصر اسمها الحملة الشعبية لمقاطعة المنتجات الامريكية و الاسرائيلية و هي حملة منظمة و ليها هدف اقتصادي كبير و بتدعو ايضا لايجاد بدائل للسلع الامريكية بديل ظهور مشروب مكه كولا الشهير و هو انتاج فرنسي<br />اما عن اصحاب المحلات فهناك الكثير من السوبر ماركت و الصيدليات المشاركين في الحملة<br />و اذا الشعب يوما اراد الحياة فلابد ان يستجيب القدر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

[[comments]]
order = 2
subject = "لا تلعب خارج الملعب"
author = "ابن باريس"
posted = "2006-02-01"
text = "لا تستهتر بالايذاء الموجه لمشاعر كل مسلم وتحول المسألة الى امور اخري لم يرضى عنها اي مسلم لا فى وقتها ولا بعد وقتها لكن لنستنهض الامة فى كل وقت ولاي سبب كبيرا كان ام صغير فليس بالسخرية من رسول الله بالامر الهين على نفس المسلم الذىلا يتم ايمانه حتى يكون رسول الله احب اليه من نفسه واذا كانت الحكومات الخائبة الضعيفة فى خذلان امام موقف ولكنها نهضت امام موقف اخر فلنبارك هذه الخطوة ولعلها تشجعهم على الاستمرار اذن بلاش تهدم الموقف بفلسفة عمياء وتلعب علينايا سيد على عبد المنعم فلا تهاون بعد اليوم ولتنهض الامة باذن الله ويعود اليها مجد وحدتها باذن الله راجع نفسك عسى الله يجعلك قوة دافعة للامة لا مزعزع لهمتها<br />والله يوفقك ويهديك الى الصواب انه ولي ذلك والقادر عليه<br />وكما للبيت رب يحميه ولمحمد رب يحميه فله امة امنت به وعليها ان تحميه وتحمي دينها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

