text = "اولا عنوان المقاله غايظنى جدا<br />مش هجرح و لا هشتم بس عايزه اقول لعلى جت اوت المره دى لان لما تشوف الناس بتعمل موقف حلو و اساسى لدينها و رسولها مش المفروض يكون دا رد فعللك<br />عيد حساباتك و راجع نفسك و اذا تاكدت قدم اعتذار للقراء على الموقع اما اذا فضلت على موقفك فربنا معاك لان عبد المطلب لما قال للبيت رب يحميه قالها ف محلها لكن لما انت تقول للرسول رب يحميه تبقى طلعت اوت<br />و الاحسن ليك الا تجادل و لا تناقش يا اخ على<br />بالنسبه بقى للاستاذه المحترمه مروه انتى بقى حكايه لان لو النتى مسيحيه مش هعرف غارد عليكى و لو انتى مسلمه خساره ارد عليكى"
