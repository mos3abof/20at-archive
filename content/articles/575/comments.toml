text = "من قلة علمك و زيادة تكبرك فات عليك أن الجريدة الدنماركية قد أعادت نشر الصور ثانية بلا أي داع و لم تعتذر حتى الآن...دلني على تصريج الإعتذار يا عاقل عصرك و زمانك<br />ثانيا...أي اعتذار هذا يليق بمقام سيد الخلق و قد افتروا عليه بهتانا و زورا<br />ثالثا... مين سيادتك كي تعلن عن تقبلك الإعتذار الموهوم من هذه الجريدة الدنماركية و بتقبلك هذا يصمت جميع المسلمين لأنهم غير عاقلين و لكن انت العاقل الوحيد على مدار 1400 سنة<br />لقد قرات رسالة قوية توضح الإعتذار الذي يجب أن يكون و هذا نصها<br />_______________________________________<br />و هل يكفي الإعتذار؟<br />_______________________________________<br />نعم ، هل ننتظر رسالة اعتذار لا تساوي الحبر الذي طبعت به من أبقار الدنمارك ؟ هل تلك الوقاحة تنتهي ببضع كلمات سخيفة و كأننا أطفال صغار ؟ بالأمس استضافت الجزيرة أحد المحررين العاملين في هذه المخربة الدنماركية و سؤل :\" هل تستطيع أن تتكلم عن (الهولوكوسة) ؟\" فكان جواب هذا الأقذر من روث بقر و جاموس الدنمارك بعد طول صمت:\" نحن في الدنمارك هنا يوجد ديموقراطية !!\" فسأله مذيع النشرة :\" و هل ديمقراطيتك تتيح لك تفنيد الهولوكوست أو التشكيك في شرعية إسرائيل؟\" فأجابه الأحمق :\" لقد كنا بصدد قبل اشتعال الأزمة رسم كاريكاتير ينتقد سياسة شارون مع الفلسطينيين...!!\" ... أيها الزنيم العنين أجعلت نبينا ( صلوات الله و سلامه عليه و آله و صحبه ) كشارون ؟<br />أرى أن الاعتذار الحقيقي الذي يجب أن نراه هو أن تقوم الصحيفة بنشر تراجم معاني القرآن الكريم باللغة الدنماركية على نفقتها الخاصة و سيرة المصطفى ( صلى الله عليه و آله و سلم ) و ذلك تحت إشراف المؤسسات الإسلامية الرسمية كمنظمة المؤتمر الإسلامي و الأزهر الشريف و توزيع هذه التراجم القرآنية والسير مع الصحيفة مجانا فمن أفسد شيئا فعليه إصلاحه و من حق المواطن الدنماركي الذي تكونت في عقله صورة مكذوبة عن رسول الرحمة أن يرى الصورة الحقيقية – و أظن أن هذا يدخل في نطاق حرية النشر و التعبير و \" الديمقراطية\" و إذا التزمت الصحيفة بذلك يمكن إعادة النظر في المقاطعة لألبان أبقار الدنمارك و إنقاذهم من أزمة حقيقية.<br />إني أتمنى من كل من تصله هذه المقالة أن ينضم إلى حملة إسلامية عالمية لتوصيل الفكرة إلى المسئولين في البلاد الإسلامية و إلى الجالية الإسلامية في الدنمارك فمتى نشعر و لو لمرة بالقدرة على التغيير و الإصلاح؟<br />إِلاَّ تَنصُرُوهُ فَقَدْ نَصَرَهُ اللّهُ<br />_______________________________________<br />للأسف أمثالك ممن أرادوا ان يكونوا أذلة على الكافرين أشداء على المسلمين يستمتعون بلعق أحذيةأسياده في الغرب فهنيئا لك المذاق<br />و بلاش عوجان"
archived = "2006-11-02"
