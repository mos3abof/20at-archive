subject = "نونو"
author = "فعلا يا أخي قارئ بالصدفة"
posted = "2006-02-04"
text = "معاك حق ، مثلا في فرنسا و غيرها يحرم نشر اي شئ معادي لليهود بحجة \"معاداة السامية \" .. لماذا هذا المجال لا يفتح امام اصحاب حرية الرأي ؟؟<br />هذا معناه انه الحكومات لو ارادت ان تمنع اهانة الاديان فانها بامكانها ذلك و بامكانها وضع حدود لحرية الصحافة مثل الحال مع موضوع السامية .. و لكنهم حقيقة لا يريدون ذلك و هذا ما نطلبه منهم كمسلمين .. وضع قانون حرمون فيه اي تطاول على الرموز المقدسة لاي ديانة و ليس فقط اليهودية ...<br />و بالامس كنت اشاهد برنامج تلفزيوني .. و كان احد المشاركين له رأي جميل جدا .. عن الحملة الموجهة ضد كل ماهو اسلامي و محاولة استفزاز المسلمين و المس برموزهم المقدسة ، فقد قال انهم في بلدانهم اهانوا كل الديانات ن و استهزءوا بكل قيمهم الدينية و رموزهم حتى المسيح عليه السلام ، و لم يبق امامهم الا الاستهزاء بمقدسات المسلمين الذين لازالوا حتى الان يقدسون دينهم و رموزه و يحترمون الدين و يقيمون له وزنا في حياتهم و هذا ما يغيضهم منا ...<br />و كان ايضا احد الاخوة له مداخلة جيدة عن سبب الهجمة على الاسلام ، و هي انه كلنا نقرأ عن مدى الكراهية التي يكنها الناس خصوصا في اوروبا لليهود ن و انهم كانوا منبوذين و غير مرغوب فيهم في كل مكان يتواجدون فيه بسبب اخلاقهم ، حتى انه يوجد جمعيات مناهضة لليهود في اوروبا و غيرها و خصوصا في بريطانيا و هي جمعيات فاعلة جدا تحاول كشف حقيقة الدسائس اليهودية ،، فكيف فكر اليهود في القضاء على البغض و لاكره الموجه لليهود ؟؟ ببساطة الحل يكمن في توجيه دفة الكراهية الى جماعة اخرى و هي المسلمين<br />و هذا ما يجعلنا نرى الحملة الموجه ضد الاسلام من حروب و استفزازات و غيرها .. فهي حرب موجهة ضد كل ما هو اسلامي لزرع الكراهية ضد المسلمين في كل العالم ...<br />اعجبتني هذه الاراء و احببت ان اشارككم بها مع احترامي لكل المعارضين<br />نونو"
