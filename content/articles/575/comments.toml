text = "باسمي مباسم جميع المسامين أقول : ليس من حق اي مواطن من اي طائفة كان ان يمس او يعلّّق على مقدساتنا فلدي سؤال الى هؤلاء الذين شوّهوا وجه نينا (ص):من مس مقدساتكم ؟<br />لكل دين مقدسات ونحن لا نستطيع السكوت عن هذا العمل فاذا الدول لن تقوم بعمل ما او معاقبة هؤلاء نحن \"الشعب الاسلامي\"سنقوم بالعمل المناسب . فلعنة الله على امّة مسة نبينا .<br />واخيرا وباسم طلاب الجامعات مسلمين ومسيحيين نقول ان محمد رسول الله) لن نسكت ولن نسكت وان نسكت لهؤلاء السفلاء هم ورؤساء الدول التي تحرّضهم على هذا الشيء لانه دائما المبير يعلم الصغير .<br />وانشاء الله دمنا فداااااااااء نبينا."
