[[comments]]
order = 22
subject = "لا تلفت أبدا الى اصحاب الاصوات العالية"
author = "محمد"
posted = "2006-02-02"
text = "متفق معك تماما لن اعلق بامثر من ذلك لانى على يقين تماما من ان السادة اصحاب الصوت العالى قد يجدوا الفرصة لان يطلقوا العنان لالسنتهم ليصرخوا بل عقل محاولين تعويض قلة حيلتهم<br />لاتنزعج ابدا مما يقولوه لان ما يتحدثون عنه هم لايفقهوه<br />هذه ليست مصادرة على احد ولكنها الحقيقة لان لو واحد منهم فقط فكر قبل ان يتكلم لادرك حقيقة الامور الجريدة الدانماركية اخطأت بما فعلت منذ تلات شهور اخطات فى حقنا وفى حق نفسها وتراجعت واعتذرت وبعد تلات شهور تولع الدنيا ... من صاحب المصلحة ؟<br />ان الله غفار حليم والرسول نفسه كان غفورا حليم هم اخطاوا واعتذروا وانا واحد من الناس الذين قبلوا اعتذارتهم<br />فياايها الشماليل اظهروا غضبكم على من لا يعتذر اظهروا غضبكم على انفسكم التى تخطئ كل يوم دون ان تعتذر لا لنفسها ولا حتى لربها"
archived = "2006-11-02"
