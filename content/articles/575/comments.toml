[[comments]]
order = 16
subject = "الصلاة و السلام على النبي"
author = "أخي الفاضل"
posted = "2006-02-02"
text = "صاحب التعليق الخاص بالطواغيت<br />يا اخي لقد سئمنا من ترديد هذا الكلام في وقت ليس وقته .. و بلا فائدة<br />و نحن اعقل من ان نحول انظارنا عن قضية مهاجمة الرسول صلى الله عليه و سلم الى قضايا اخرى ...<br />ليس هذا وقت الحديث عن من اسميتهم بالطواغيت ..<br />هذا الوقت لنا لكي نلتف حول كل من يعمل شئ لنصرة هذه الامة<br />هذا وقتنا لكي نتكاتف و نتحد ضد الاخر العدو و ليس ان نلقي الاسهم و نطلقها على بعض متناسين القضية الاهم<br />صلي على النبي يا اخي .. صلي على النبي و لنجتهد في الدفاع عن هذه القضية و نصرة النبي بطريقة عقلانية واضحة و قوية كالمقاطعة و مساندة كل خطوة جريئة ... صلوا على النبي .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

[[comments]]
order = 17
subject = "مكشوفة !!"
author = "اخواني في عشرينات"
posted = "2006-02-02"
text = "فعلا خذلتونا .. و جيتوا تكحلوها بس للاسف عميتوها ..<br />انا ما افهم الكلام الكثير اللي في المقال .. انا افهم شئ واحد ..<br />افهم انه المحل اللي وضع لافتة بسحب المنتجات الدنماركية ذبا عن عرض النبي الكريم احسن بكثير عندي من موقع يفرد المساحات فقط لنشر صور نانسي عجرم و هالة سرحان و غيرهم بحجج الحرية و \"الروشنة \" ...<br />هذا ما افهمه ... افهم انه النبي صلى الله عليه وسلم حبيب الى قلوب هؤلاء .. بينما اين هو في قلوب الذين طنشوا موضوع المقاطعة لا ندري لماذا ثم خرجوا علينا بمقال غير مقبول ..<br />هذا ما افهمه .. و طبعا الظاهر انه اجوبتي و فهمي لا يتطابق مع الاجوبة النموذجية اللي وضعها أساتذة الموقع لذلك فالرسوب هو مصيري مقدما ..<br />و أأسف على لهجتي لو كان فيها سخرية .. و لكن سامحوني يا عشرينات حال الموقع و وضعه يثير السخرية بقوة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

[[comments]]
order = 18
subject = "حسبنا الله و نعم الوكيل"
author = "لاحظتوا يا جماعة ؟؟؟"
posted = "2006-02-02"
text = "الموقع يدافع عن موقفه بطريقة غريبة جدا و في موقفين ؟؟<br />اولا موضوع (لن نحتفل بالهجرة ) .. و طبعا كان محاولة منهم للرد على من سألهم لماذا لم يتطرقوا لهذا الموضوع مع انهم أفردوا صفحات و مواضيع كثيرة للكريسمس .. فاكرين ؟؟ فاكرين مقال ماما نويل ... المهم<br />المحاولة الثانية هو هذا المقال . و ايضا وردت فيه جمل مثل (لن نقاطع الدنمارك ) .. مع تبريرات يتذاكون فيها لتبرير عدم المشاركة او التطرق للحادثة الفظيعة اللي مست كل مسلم ..<br />لاحظتوا يا جماعة ؟؟<br />بس ماذا اقول؟؟<br />حسبنا الله و نعم الوكيل . بالنسبة لي الموقع لم يعد له اي مصداقية ، كل مواضيعهم في ذم العادات الخطأ و أخطاء المسلمين و عدم فهمهم و اداركهم و سلبيتهم .. بينما في وقت الجد و وقت الفعل اول الفاشلين هو عشرينات<br />الظاهر انه مقالاتهم مجرد كلام بس<br />اخوي صاحب التعليق لن نقرا لعلي<br />انا معك في كل ما قلت مع تحفظي على احدى النقاط اللي ذكرت فيها كلمة \"سكران \" استغفر الله .. ربما لا تقصد بها شئ بس انتبه يا اخوي لانه كل كلمة محاسبين عليها و هذه نصيحة من اخ محب<br />و ايضا كلام الاخ الملازم و كل من سبقني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

[[comments]]
order = 19
subject = "ياريت تضيفو ا هذا للمقال"
author = "د.اميمة الاحمدي"
posted = "2006-02-02"
text = "والله انا ارى ان كل ما قلتوه تقريبا صحيح<br />ولكن الفكروة ان الجزاء يجب ان يكون من جنس العمل فمثلا في احد الغزوات قام احد الكفار بهجاء الرسول (صلى الله علية وسلم وفداه ابي وامي)فقام احد الصحابة وحسان بن ثابت (شاعر الرسول)فرد علية بشعر وقال ابياتا من اروع الابيات<br />هجوت محمدا فدت عنة وعند الله في هذالجزاء<br />هجوت مباركا برا كريما رسول الله شيمته<br />الوفاء<br />فان ابي ووالده وعرضي لعرض محمد منكم فداء<br />(ان لم تخني الذاكرة) وعلى هدا ارى انه كان من الاوقع ان نستدعي ها الرسام وبعض الاعلاميين ونوضح لهم مكانه النبي صلى الله علية وسلم عندنا وانه ليس بالسياسي الذي بدعوى الحرية يمكن ان ينال منه لا هو ولا كل الانبياء صلوات الله وسلامه عليهم اجمعين لاننا وبطبيعة الحال مقصروون جدا في ايصال هذا المعنى للعالم اجمع ومتفرغون لاشياء تاااااافهة جدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

[[comments]]
order = 20
subject = "شعوب مدفونة تحت حطام كرامتها"
author = "إسلام لطفي"
posted = "2006-02-02"
text = "السلام عليكم؛ أولاً انا مبسوط يا علي انك رجعت تكتب<br />ثانياً يا ريت توقف كتابة<br />يا عم علي انت بتتكلم في فكرة صح مليون في المية ولكن في توقيت غلط ميت مليون في المية<br />الفكرة هي اننا بنناضل ونكافح ونضحي بأرواحنا في قشور - طبعاً السخرية من الرسول مش قشور لكن انا باتكلم عن ظاهرة - وبنترك قضايانا المصيرية والجهورية دونما ادنى تحرك.<br />والتوقيت غلط لأن بالفعل القضية دي مش تافهة لأن ده رمز وكل امة او فكرة بيكون فيها رموز او شوية افكار دوجماطيقية غير قابلة للمناقشة . . زي فكرة الهولوكوست عند الإسرائليين او صلب المسيح عند المسيحيين وزي القرآن وشخص الرسول والصحابة عند المسلمين . وكون ان المسلمين اتحركوا دفاعاً عن الرمز فده مؤشر كويس لأن كل الدلائل كانت بتقول اننا شعوب مدفونة تحت حطام كرامتها والدليل اننا سايبين القضايا المصيرية زي اغتصاب اراضي الأمة والإستسلام لحكم الطغاة وأذناب الإستعمار واستجدائنا للقمة العيش وسايبين القضايا الخاصة بالرمز زي منع الحجاب في فرنسا وزي تدنيس القرآن في جوانتناموا<br />وبالتالي لما ألاقي الناس اتحركت علشان رمز ما احبطهمش واقولهم انتوا اولوياتكم غلط . . لازم اشجع تحركهم وازكيه واقومه لو هو غلط<br />يا عم علي انت بتتكلم على شعوب بقالها 100 سنة استعمار خارجي و 50 سنة استعباد داخلي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112418/http://www.20at.com/article2.php?sid=364"

