subject = "طبعا الكل هيقول نعم"
author = "مبارك سقط مثلا كلنا هنعمل ايه هنتعب ونلوص اعتقد ان مفيش في مصر والعالم العربي كله افضل من حسني مبارك وانا اعرف ان معظم الشعب المصري يدعون له دبر كل صلاة ان ربنا يديمه في الحكم ويجي لنا واحد من ذريته يكون زيه قولوا امين يارب العالمين"
text = "كفايه الديمقراطيه اليي انتم عايشنها والانتخابات<br />اعترفوا وقولوا كلمه حق<br />واقول بكل قوة لازعيم بعد مبارك ولازعيم قبله مبارك افضل زعيم ولو فيه انصاف كان يحكم العالم مش مصر بس دة حكيم العرب وحاميهم يارب طول في عمرة مائه سنه كمان او مائتين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151925/http://www.20at.com/article.php?sid=1285"
