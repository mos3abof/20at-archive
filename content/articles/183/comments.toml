[[comments]]
order = 11
subject = "شكر .. واقتراح"
text = "الأخ الفاضل \"مصعب الخير\" .. وعليكم السلام ورحمة الله وبركاته<br />أشكرك على هذه المجاملة الرقيقة وقد تشرفت بلقائك ولقاء أمثال حضرتك من الشباب النابهين بهذا الموقع المميز ..<br />وإن كان لى عتاب على إدارة الموقع الذين تركوه هكذا (سداح مداح) يختلط فيه الحابل بالنابل<br />.. لماذا لا يتم تخصيص مساحة للزائرين الذين لا يحسنون القراءة ولا الكتابة؟ أمثال \"الأخ\" الذى أشرت إليه ..<br />أقترح أن نطلق على المساحة المخصصة لهؤلاء (خواطر بصمجى) مثلا أو (أصدقاء فك الخط) ..<br />أعتقد أنها سوف تكون فرصة سانحة ليعبروا من خلالها عن ذواتهم وما يعانون من ضغوط الحياة والمجتمع ..<br />و يكونوا معزولين فى ذات الوقت عن بقية الزائرين<br />ما رأى القراء وإدارة الموقع فى هذا الاقتراح ؟؟؟<br />فى انتظار الرد<br />حسين عبد الظاهر"
archived = "2004-08-24"
capture_url = "https://web.archive.org/web/20040824034345/http://www.20at.com:80/article.php?sid=550"

