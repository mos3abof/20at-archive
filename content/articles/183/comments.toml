subject = "مصـ( الخير )ـعب"
text = "السلام عليكم<br />لو حضرتك أستاذ حسين عبدالظاهر اللي في دماغي<br />يبقى ميت أهلا و ميت سهلا<br />أنا أحد المعجبين بيك<br />و ربنا ينفع بيك يا رب<br />و الأخ اللي بيشتم<br />عيب مش من أخلاق الرجال كده ..."
archived = "2004-08-24"
