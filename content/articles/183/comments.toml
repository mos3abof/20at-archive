[[comments]]
order = 18
subject = "اليوم الاصعب ... يدا بيد"
text = "ربما كنت من القليلين الذين أتيحت لهم الفرصه أن يطلعوا على هذا المقال في صورته الورقيه يدا بيد من الأستاذ محمد مصطفي ولا انادية بغير الأستاذ فهو بحق \" استاذ التعبير عن المشاعر \" مبكية ومضحكة وشعرت بذلك التيار الجارف الذي مسنى وانا اقرئها واشعر اننى معه في كل خطواته وحتى في لحظات خلواته شعرت اننى معه<br />أقول للراحل الحبيب الأستاذ مصطفي .. ربما رحلت عن الدنيا ولكنك تركت من خلفك \" أستاذا\" أحسنت تربيتة ولولاك ما كان هو بكل مفردات تلك الشخصية التى لم يقترب منها أحد الا احبها ...<br />واللي خلف ما متش"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018095804/http://www.20at.com:80/article.php?sid=550"

[[comments]]
order = 19
subject = "من ابو اسكندر ...كنت لنا شاطئا"
text = "بسم الله الرحمن الرحيم<br />استاذي واخي وصديقي ....<br />عرفت بوفاة والدك قدرا ... فاجئني الخبر .. ولكن لم يفاجئني صبرك وتحملك ..<br />اخي الحبيب :<br />كنت لنا شاطئا حينما تتلاطم بنا الامواج .. فنفرح بلقائك ونأنس بجوارك .. نتعلم منك الابتسام رغم الآلام ،،،، لم اراك يوما متضجرا .. وان جدث هذا فيكون غضبك وسخطك وضيقك سخرية من هذه الاسباب التي دفعتك للغضب .. الا ان كان الامر يخص غيرك وشعرت ...بالظلم الواقع عليه فردا كان او شعبا حتى الارض لا ترضى بان تظلم... كنت المح عندها حزنك<br />فاراك تحمل حجرا في القدس<br />وتحمل طفلا في العراق<br />وتضمد الجراح في الشيشان ..<br />محمـــــــــــــــــــــــــــــــد<br />انت ...انســــــــــــــــاااااان<br />بمعنى الكلمة ...<br />لقد عجزت لفترة طويلة ان اكتب لك تعليقا<br />لاني وجدت نفسي قد ظلمتك كثيرا<br />لعدم استشعاري لهذا الكم الهائل الذي جاز حدود عقلي من المشاعر الدفينة في داخلك وان اخفاها وجهك البشوش دائما ال ان كلماتك قد اعلنتها ..<br />استمر في صبرك ورحم الله والدنا جميعا<br />فكن له خير خلف لخير سلف"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018095804/http://www.20at.com:80/article.php?sid=550"

[[comments]]
