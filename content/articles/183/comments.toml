[[comments]]
order = 15
subject = "النسمة الحزينة"
text = "أبى الحبيب..<br />مر حتى الآن 4 شهور على فراقك..<br />وحشتني جدا جدا جدا جدا..<br />غير قادر على التحمل أكثر من ذلك..<br />أشتاق إلى أن تضمني إلى حضنك وتناديني بكلمتك الأثيرة: \"أنت ابن عمري\"<br />محن وأزمات ومشاكل.. أحتاج إليك.. أحتاج إلى رأيك.. إلى استشارتك.. إلى نصحك.. لكني أفتقدك.. لا أجدك كما كنت معتادا دائما.<br />كل شيء حولي يقول لي أن أبي مات..<br />أبي ماااااااااااات..<br />لقد كدت أنسى خلال الأيام السابقة هذه الحقيقة – واللهم لا اعتراض – ...<br />في زحمة المسئوليات و( تنفيذ الأوامر) كنت أتعامل مع الموقف كأنك غائبا وستعود مجددا – على الاقل حتى تتسلم منى تقريرا مفصلا عن فترة غيابك- ...<br />أما الآن وقد (فقت) على هذه الحقيقة المرة..<br />أسمح لي أن أترك الفرصة لشلالات دموعي أن تخرج من محابسها..<br />أبي الحبيب – عليك رحمة الله - ...<br />اسمح لي أبكي..<br />كيف لا يسمح لك ..<br />وقد أهلكنا نحن البكاء ..<br />صديقي ..<br />لن أقول لك لا تبك .. لأنني أبكي الآن بكل خرقة قلبي .. وأنا لا أعرفك أو أعرف والدك .. رغما عنا سنبكي ونختبيء عن كل الأعين وندفن أحزاننا في قلوبنا .. إنا لله وإنا إليه راجعون .. تصبر يامحمد .. فإن لك به لقاءٌ بعد عمرٍ يكثر به العمل الصالح ولا تنس أن من مات انقطع عمله إلا من ثلاث أجداها (ولد صالح يدعو له) وإننا نحسبك كذلك .. فلا تنس والدك من دعائك .. تعال إلى مكة واعتمر أو حج عنه .. بر أصدقائه ومحبيه بالزيارة والسؤال .. أعرف أنك تفعل كل هذا .. ولكنه عزاء الحزين للحزين .. تصبر ياصديقي .. ودع من ألمك قوة تساندك .. إن والدك (رحمه الله رحمة واسعة) قد غاب ظله عن الدنيا .. لكن لم يغب مقامه في قلبك .. إنه معك .. بقربك .. يمسح دمعك ويربت على كفك .. إنها إرادة الله .. ( وحشتني جدا جدا جدا .. ) كنت تكتبها وأنت تبكي وتبكي .. وأبكيتنا جميعًا .. لا أريد أن أقول لك أنني لاأكاد أرى الحروف من شلالات الدمع التي تتفجر من عيني .. قلبي معك .. ودعائي ..<br />كن بخير"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018095804/http://www.20at.com:80/article.php?sid=550"

