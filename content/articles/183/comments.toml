text = "قولوا لمحمد ان اباه لم يمت<br />وكيف يموت من يحيا الحياة ابد<br />وكيف يموت من يخلف فى الأرض نبت<br />بقيت روحه وغاب الجسد<br />محمد .....انت صبرت كثيرا وارضيت اباك اكثر<br />فحافظ على صبرك ...ليرضى عنك ربك"
