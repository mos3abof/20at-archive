text = "اعتقد ان محمد مصطفي فيه الي مكفيه و كان المقصود ان نقف جنبه لكن انتم بتسيئوا استخدام التعليق في مكان مينفهش فيه خناق<br />ياريت تحوطوا نفسكم مكان محمد و كانكم بدل ما تروحوا بيته تقفوا جنبه رايحيين تتخنقوا<br />لكل مقام مقال يا بشر.............."
