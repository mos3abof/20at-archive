[[comments]]
order = 5
subject = "مصـ( الخير )ـعب"
text = "السلام عليكم و رحمة الله وبركاته<br />كان الله في عونك<br />على فكرة أنا أكتر واحد من اللي علقوا حاسس بيك<br />لسبب بسيط إن احنا زملاء تجربة واحدة<br />لكن أنا تجربتي قبلك بشوية<br />وفاة والدي كانت من سنتين<br />وقبله والدتي بثلاث سنين<br />لكن مش هي دي القضية<br />تعالى نحسبها بشكل تاني :<br />\" الإنسان أول ما بيتولد بيبكي بحرقة<br />عارف ليه؟!<br />لأنه فقد الصورة اللي هو متعود عليها<br />علشان ياخد الغذاء بتاعه من رحم الأم<br />و لما بيتفطم برضه بيبكي<br />لأنه مش شايف صورة تانية ياخد بيها الغذاء<br />و هكذا لغاية أما بيموت ,,,\"<br />الشاهد في الموضوع إن في صورة تانية تدير بيها حياتك<br />صورة تانية بعيدة عن الإحساس الرهيب اللي انت حاسه<br />و فكر معايا كده , والدك كان هيفرح لما يشوفك منهار<br />و للا لما يشوفك شايل المسئولية يا بطل؟!<br />أنا معاك الإحساس صعب لأني مجربه لكن<br />\" مش الأصل في الحياة المعاناة \"<br />كلمة قالها لي أعز أصدقائي<br />مش عارف اقول ايه تاني<br />وربنا يسامحك قلبت عليّ المواجع<br />بس يللا زي أخويا برضه<br />يللا سلام علشان بقية الناس تلحق تعلق"
archived = "2004-08-24"
capture_url = "https://web.archive.org/web/20040824034345/http://www.20at.com:80/article.php?sid=550"

