subject = "بيرو"
text = "خلينا نغني سوا يا محمد ...<br />أنا ليه مكونش ع الجراح قادر<br />وأكسر بأيدي كسرتي ويأسي<br />وأرمي الهموم المرة ع الآخر<br />وأعمل أنا بنفسي حساب نفسي ....؟؟؟<br />و أخرج ..من طريق حيرتي وأحزاني<br />وأرحل...أنا وقلبي اللي بيعاني<br />أنا ياما شربت مرار الصبر<br />أنا ياما كتير بتاخد غدر<br />وبعد ما تاهت مني خطايا<br />وبعد ما عاش الخوف جوايا<br />هدور يمكن الملم روحي<br />وأداوي جروحي<br />وألاقي البر<br />وأعيش من تاني في دنيا لا فيها<br />ضياع ولا فيها<br />جراح ولا مر ..!!"
archived = "2004-08-24"
capture_url = "https://web.archive.org/web/20040824034345/http://www.20at.com:80/article.php?sid=550"

