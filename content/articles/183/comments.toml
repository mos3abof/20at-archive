[[comments]]
order = 7
subject = "أو ل تعليق"
text = "السلام عليكم ورحمة الله وبركاته<br />منذ بضع سنين وأنا أطالع شبكة الانترنت ولا أتذكر أن كتبت - فى يوما- تعليقا على مقال قرأته على النت .. وما دفعنى للتعليق على هذا المقال أمران:<br />حميمية التجربة الأنسانية التى تناولها كاتب المقال وهى الشعور بانهيار الجدار الذى كان يركن إليه المرء ويتخذ منه سندا وعونا أو كما يقول بعض الشباب\"بيدلع على حسه\" ليس هذا فحسب بل مطلوب منه أن يصبح هونفسه رغم آلامه وأحزانه جدارا بديلا يركن إليه الآخرون !<br />الأمر الآخر الذى دفعنى للتعليق على هذا المقال هو ما أعرفه عن كاتبه من خفة ظل جعلت له قلما شبابيا ساخرا استطاع من خلاله رسم العديد من الابتسامات لدى جميع من يطالعون تحقيقاته وموضوعاته الصحفية سواء على النت او فى الصحافة الورقية فكانت مفاجأة بالنسبة لى أن يكون لدى الصديق \"محمد مصطفى\" القدرة على إبكاء القراء .. كما يكون لديه القدرة على إسعادهم<br />حسين عبدالظاهر"
archived = "2004-08-24"
capture_url = "https://web.archive.org/web/20040824034345/http://www.20at.com:80/article.php?sid=550"

[[comments]]
order = 8
subject = "مفارقة"
text = "المفارقة مابين<br />*** بكاء قلبي من مشاعر رقيق القلب باسم الثغر مثال الادب: محمد مصطفي والتي نجح بسلاسة نقلها الي قلوبنا عن طريق انه قال اللي في قلبه ببساطة-- وواضح ان محمد كان ماسك الاجندة اياها _بني او سودة غالبا_ واللي اي حد فينا لما همومه بتغلبه بيستفرد بيها ويفضل يطحن فيها ويكتب عن اللي مسبب له كل الغم اللي هو فيه لما بتكره اليوم اللي طلعت فيه من المطبعة<br />وبين<br />***ضحكي من تعليق الاخ اللي بيقول انه بيطالع الانترنت منعدة سنين وحسيت انه بيشتغل القراء لاني عارفه وعارف انه مايعرفش الفرق بين المكواة وبين الكمبيوتر<br />واللي مش مصدق يسال عماد لحود<br />وهو وسيادة المحافظ فاهمين انا بقول ايه<br />الخواطر رائعة يا محمد ومستني اقرا لك في عشرينات تاني قريب"
archived = "2004-08-24"
capture_url = "https://web.archive.org/web/20040824034345/http://www.20at.com:80/article.php?sid=550"

[[comments]]
order = 9
subject = "لا تطمع فى المزيد"
text = "أضحكنى ذلك الفتى الذى خاض مغامرة تحسب له حقا وقام بكتابة تعليق على التعليق الذى كتبته على المقال .. وقد ذهب \"المعلق\"- بغض النظر عن ركاكة الأسلوب وكثرة الأخطاء اللغوية- إلى أبعد مسافة- لا أعتقد أنه كان يحلم بها من قبل ولا من بعد- وهى أن يظفر ببضع ثوان من وقتى تشرف خلالها تعليقه بأن ألتفت إليه.. فضلا عن أن أمنّ عليه وأبلّ ريقه بالرد.. لقد ارتقيت مرتقا صعبا يا هذا<br />أرجو ألا تسول لك نفسك إمكانية أن أدخل معك فى معركة كلامية على النت .. فلم تكن من عادتى أن أظلم قلمى بخوض معارك وهميةأو أن أجرب سيفى فى الهواء<br />حسين عبد الظاهر"
archived = "2004-08-24"
capture_url = "https://web.archive.org/web/20040824034345/http://www.20at.com:80/article.php?sid=550"

[[comments]]
