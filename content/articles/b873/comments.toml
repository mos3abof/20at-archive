[[comments]]
order = 0
subject = "فلسطين ..رغم كل شىء"
author = "ديمة"
posted = "2006-05-29"
text = "مجهودجميل بجد، واحنا فعلا محتاجين نعمل بانوراما عن كتير من الموضوعات واولهم الموقف فى فلسطين طبعا، نجحتم الى حد كبير فى نقل الصورة ولكن كان فى تعارض لبن اتجاه الموضوع بشكل عام وجزأية صغيرة ، ولكن يمكن ده يرجع لان القضية فعلا ملعبكة وياريت يبقى لها حل مايحتملش تأويل او لخبطة، بس بجد الموضوع جه فى وقته، وياريت يتكرر وكل مرة طبعاهتبقى احسن من اللى قبلها اكيد.. وربنا يكرمكم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125541/http://www.20at.com/article2.php?sid=873"

[[comments]]
order = 1
subject = "فلسطين لن يحررها أهل فلسطين"
author = "فلسطين لنا نحن جميعا -أهل الاسلام- ولا يملك أهل فلسطين حق التصرف بها ، ولو تفانوا أهل فلسطين جميعا لن يغير من حقيقة أن فلسطين أرضا اسلامية ينبغي على جميع المسلمين السعي لتحريرها."
posted = "2006-05-29"
text = "المشكلة التي نعاني منها -نحن أهل الاسلام- هي غياب دولة الشريعة التي ينضوي تحتها جميع المسلمين أو أغلبهم .<br />وفلسطين لن تتحرر حتى تقوم دولة الاسلام الواحدة ، وحتى تقوم دولة الاسلام الواحدة لا بد من اسقاط الطواغيت وفي مقدمتهم رؤوسهم الخمسة : ال سعود ، حسني مبارك ، برويز مشرف ، الاسد وجوقته المجرمة ، ملك الاردن الخائن لله ورسوله والمؤمنين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125541/http://www.20at.com/article2.php?sid=873"

[[comments]]
order = 2
subject = "فلسطيني ابيت ان ابيع هويتي"
author = "محب فلسطين"
posted = "2006-05-31"
text = "المواضيع المتناولة رائعة جدا، وتتكلم عن هذه المعاناة الفلسطينية التي نحن العرب لا ندركها حتى نقع فيها، المال الذي يقدمه العرب ليس كافي، نحن بحاجة الى نفوس تبذل في سبيل الله تعالى، وفي سبيل فلسطين لتحريريها من الغاصبين المتمردين المارقين. لك الله يا فلسطين.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125541/http://www.20at.com/article2.php?sid=873"

[[comments]]
order = 3
subject = "مافيا الفسادفى فتح هل تستمر"
author = "دحلان موسادى"
posted = "2006-06-11"
text = "الحرب الاهلية الفلسطينية ستضيع فلسطين للابدوبدون رجعة ولن يثق العالم بعدذلك سوى فى اسرائيل لحماية ماسيتبقى من الشعب الفلسطينى هذاان بقى منهم احدلذلك اعطواالحكومة المنتخبة شعبيا الفرصةلتنفيذوعودهاالتى قطعتهالناخبيهاوفوتواالفرصةعلى من يحثكم على الاقتتال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125541/http://www.20at.com/article2.php?sid=873"

[[comments]]
order = 4
subject = "توافق مصالح"
author = "معتصم"
posted = "2006-06-15"
text = "توافقت مصلحة الفتحاوين مع المصالح الامريكية و الصهيونية , من جهة يعارض الامريكان و الصهاينة اي حكم لفصيل اسلامي فالمستهدف الاسلام وليس فصيل بعينه ,, و حماس مثلت الاسلام ,, و من جهة اخرى الفتحاوين على مدى الاحد عشر سنة الماضية مارسو من خلال السلطة ابشع اشكال الفساد المالي و الاداري و اعتادو على ملء بطونهم من اموال المساعدات المخصصة للشعب الفلسطيني الغلبان ,, و تود استعادة منجم الذهب و السلطة بأي ثمن ,, ولا يهمها ان يجوع الشعب في سبيل الحصول على السلطة ,,<br />حسبنا الله و نعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125541/http://www.20at.com/article2.php?sid=873"

[[comments]]
order = 5
subject = "مشروع وفشل"
author = "نورس فلسطين"
posted = "2006-06-23"
text = "ابعت من هنا عبر هذا الصوت المسموع بكل التحية الى كل من افشل هذا المشروع<br />لا تسألو ما هو المشروع<br />انا سوف اجاوب<br />بالعربى هذا مشروع الخائن محمد دحلان<br />ومرتزقية من الخونة الذين باعو<br />تراب الوطن بالرخيص<br />كان يحلم بان يكون رئيس وزراء او رئيس سلطة على حساب هذا الشعب<br />انزل قائمة لحركة فتح على المقاس الى يستطيع ان يفصل بة اى شىء<br />ولكن فتح الذى قادها دخلا فشل مشروعها الصهيو امريكى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125541/http://www.20at.com/article2.php?sid=873"
