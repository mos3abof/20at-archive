subject = "مصري"
author = "اه يا بلد"
posted = "2006-03-07"
text = "عندك حق والله يا بنتي ان ما خفي كان اعظم هو فيه حد في مصر مش عارف ان همه دول اللليواكلين البلد ونهبنها وشفطنها عيني عينيك حتى ال.....<br />المهم ربنا يحميكي من السجن، اما موضوع العفو ده فدي مسخرة فعلا والله مسخرة الحرامي برة والشريف في السجن<br />اه يا بلد"
archived = "2006-11-02"
