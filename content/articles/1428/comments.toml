[[comments]]
order = 2
subject = "اهين يا بلد"
author = "نيفين"
posted = "2006-03-08"
text = "هيروح الموضوع دا و ييجى غيره كتير<br />اصلنا بنسسى بسرعه اوى<br />موضوع القطر قامت الدنيا و قلنا مش هتقعد و قعدت<br />الطياره شرحه<br />قصر ثقافه بنى سويف شرحه<br />العباره فى طريق النسيان<br />يا جماعه احنا بنقوم نقوم و ننزل على مفيش<br />احنا زى ما قال عادل حموده نحن اقدم امه و اضعف ذاكره"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143629/http://www.20at.com/article2.php?sid=530"
