[[comments]]
order = 0
subject = "الشجر الميت لا يثمر"
author = "يا اخوان حتى متى وأنتم تعولون على هؤلاء الاموات ، وأكثرهم خائن لله ورسوله، محارب للاسلام وأهله ، يعمل لصالح الكفرة أكثر مما يعمل لصالح بلده."
posted = "2006-03-29"
text = "الحل -بايديكم يا شباب الاسلام- ثوروا على الطواغيت ، واقيموا دولة المؤسسات."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145941/http://www.20at.com/article2.php?sid=633"

[[comments]]
order = 1
subject = "نعم ناااااعم"
author = "فكرتيني بأغنية جميلة نغنيها لزعمينا اللي مدلعنا و مهشتكنا بتقول"
posted = "2006-03-29"
text = "\"نعم..نعم..نعم نعم بنقولها بحق\"<br />نعم ...نعم ...نعم نعم مش هتكون لأ !!!<br />أصل لأ كلمة مش جاية على لساننا ..وقلبنا مش بيطاوعنا نقولها<br />كل نعم واحنا و انتو طبيبين اوي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145941/http://www.20at.com/article2.php?sid=633"

[[comments]]
order = 2
subject = "فرق السما من العمى"
author = "وفاء اسماعيل"
posted = "2006-03-31"
text = "فرق كبير بين لألأت عبد الناصر ولألأت القادة العرب القرن الواحد والعشرين فلألأت عبد الناصر كانت عن يقين وارادة الشعوب العربية ولألأت قمة العرب 18 هى للأستهلاك المحلى وزر الرماد فى العيونوتشبه الى حد كبير لأ التى قال عنها فريد الأطرش ( تقول لأ واقول لأ وتقول قلوبنا آآآه مالوش حق يقول لأ اللى بيقصد آآه)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145941/http://www.20at.com/article2.php?sid=633"

[[comments]]
order = 3
subject = "يارب"
author = "مؤمن"
posted = "2006-03-31"
text = "اللهم انصر أمة الاسلام.<br />اللهم انصر المسلمين فى كل زمان ومكان.<br />اللهم ان هؤلاء زعمائنا تخلو عنا فلا حاجة لنا فيهم وانت ربنا.<br />يارب اهدى شبابنا ونسائنا وقوى عزائمنا وثبت أقدامنا وانصرنا على القوم الكافرين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145941/http://www.20at.com/article2.php?sid=633"

[[comments]]
order = 4
subject = "ما المنتظر منهم"
author = "الفارس العربى"
posted = "2006-04-01"
text = "ما المنتظر من حكومات طالما أطاحت برغبات شعوبها عرض الحائط ونهالت على الأرض تقيل القدم الأمريكية نسوا دينهم ونسوا مكان العزه فزلهم الله حسبى الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145941/http://www.20at.com/article2.php?sid=633"

[[comments]]
order = 5
subject = "انا بصراحه زهقت"
author = "داليا"
posted = "2006-04-01"
text = "يا جماعه لازم نبوس القدم زي ما الاخ اللي فوقي قال بصراحه انا زهقت من الاقرف اللي احنا عايشين فيه حنلاقيها منين ولا منين كلهم خونه زكلاب كفايه سبع البرومبه اللي حاكمنا احنا المصريين ده بقى مالهوش حاكم غير ربنا وربنا يقصفلنا في عمره بقى دا راجل مقرف جاتوا البلاوي تشيله هو وعيلته ناهبين البلد وسيبين الشعب الغلبان يلهث التراب مفيش حاجه عدله في البلد تخلينا نشفعله الحيوان ده ربنا ياخده في نار جهنم الحمرا يارب قولو امين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145941/http://www.20at.com/article2.php?sid=633"

[[comments]]
order = 6
subject = "سلامات يا قمه"
author = "نيفين"
posted = "2006-04-02"
text = "حلوه الحته بتاعه فريد دى يا وفاء<br />ال قمه ال..و النبى يا عشرينات متتجددوش الالم<br />القمه اللى غاب عنها الزعماء و على راشهم البيج بوص بتاعنا اللى قال منشغل بامور داخليه و لقيناه تانى يوم بيشاهد كسوف الشمس<br />الشمس اتكسفت و هو مبيتكسفش<br />سينما نعم<br />سينما لا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145941/http://www.20at.com/article2.php?sid=633"
