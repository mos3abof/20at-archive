text = "تفتكروا مين يستحق يكون الرئيس :<br />ايمن نور طبعا لا بالنسبه ليا وفي كتير موفقيني<br />الاخوان برضه لا والاغلبيه متفق معايا<br />مبارك مش هيعيش طول الزمن<br />طب مين<br />جمال تفتكروا ينفع ؟ مش عارفه طب لو مكنش ابن الرئيس كان هيبقى كويس وينفع احيانا بقول ممكن وبعدين مش عارفه بتشتت<br />بس اللي متأكده منه ان استحاله اللي اسمه ايمن اقبله او اي حد من المعارضه علشان انا عرفت الناس دي عن قرب واكتشفت انهم احقر ناس وميهمهومش الا المنصب والحاجات دي مفهمش رجاله والله<br />طب مين يبقى الرئيس"
