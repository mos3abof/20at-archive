subject = "واحد بيحب مصر"
text = "الحزب الوطنى جاله جنان من أيمن نور ...لأنه أعلنها بصراحة أنه حيرشح نفسه فى أنتخابات رئاسة الجمهورية<br />وبيقابل الناس سيرا على الأقدام برغم محاولات الأمن منعه والتضيق عليه بس هو مصر على موقفه وربنا معاه<br />أيمن نور رئيس مصر القادم بأذن الله"
archived = "2005-05-19"
capture_url = "https://web.archive.org/web/20050519081800/http://www.20at.com:80/article.php?sid=1144"

[[comments]]
