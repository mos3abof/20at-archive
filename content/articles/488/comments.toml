subject = "شارون أفضل من الإخوان المتأسلمين"
text = "والله العظيم ثلاثا أنني مسلم مؤمن موحد بالله، وأشهد أن لا إله إلا الله وأن محمداً رسول الله، وأصلي وأصوم وأؤدي الزكاة وأتمنى أن ييسر لي الله سبيل الحج إلى بيته العتيق،<br />هذه المقدمة لقطع الطريق على مزايدات البعض بأنني حاقد على الإسلام وهذه التهم الفارغة التي تشبه تهم الحكومة بالإساءة لمصر، فالحكومة تختطف مصر وتتحدث باسم الوطنية، وعصابة الإخوان تختطف الإسلام وتتحدث نيابة عن الله ورسوله ..<br />لماذا إذن شارون أفضل من الإخوان ؟<br />لأن شارون لن يجرؤ على المزايدة، وهو عدو واضح، لكن الاخوان عدو يعيش تحت جلدنا، يختطف شبابنا المتحمس ويضمهم لعصابة لطخت يداها بالدم منذ تأسيسها، ويعلمونهم كراهية الآخرين، لدرجة ان الجماعة عندهم أفضل من الإسلام ذاته، وإذا كنا كلنا مسلمين، وإخوة فما داعي وجود جماعة بعينها باسم الإخوان المسلمين، هو نفس أسلوب الخوارج حين رفعوا شعار (إن الحكم إلا لله) وتجرأوا حتى على الإمام علي رضوان الله عليه، وهو من هو ، وكفروه .. هكذا سيكون الإخوان، نسخة من حركة طالبان الغبية الإرهابية التي دمرت الحرث والزرع والنسل ومنحوا الأغراب حق احتلال بلادهم بغبائهم واستضافتهم للحابل والنابل باسم الإسلام،<br />أقول .. لا تنخدعوا بشعارات الاخوان ، اعرفوهم ، فالشعوب ليست فئران تجارب<br />والله غالب على أمره"
archived = "2005-05-19"
capture_url = "https://web.archive.org/web/20050519081800/http://www.20at.com:80/article.php?sid=1144"

