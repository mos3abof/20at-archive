[[comments]]
order = 10
subject = "بيان الجبهة الشعبية السلمية لانقاذ مصر- سلام"
text = "بخصوص التطورات الاخيرة علي الساحة السياسية المصرية<br />القاهرة 8\\4\\2005<br />في طور التغييرات الاخيرة التي جرت علي الساحة السياسية المصرية من تعديل دستوري ديكوري ومشاركة اكثر من جهة معارضة في المطالبة بالتغيير ابتداءا من مطالبتها من مبارك التنحي عن السلطة مرورا بالمطالبة بالتعديلات الدستورية التي يتفق عليها الجميع , اضافة الي وضوح اللعب الخارجي في شئون التغيير المصرية والتي تتمثل في تمويل او مغازلة بعض الاطراف السياسية في مصر, فان جبهة سلام تعلن استقلاليتها التامة عن اي حزب او جهة ورفضها للعبث بمصالح مصر الداخلية والخارجية ومزايدة اي جهة معارضة علي معاناة الشعب المصري من ظلم الديكتاتورية المصرية , كما ان الجبهة تعلن انها بدأت اعادة تنظيم كوادرها علي الارض والاستعداد لمرحلة جديدة في العمل بمنهج واضح ومشاريع تغييرية تمس الشعب المصري مباشرة ونابعة من تراثه وحضارته ودينه وتهتم بمشاكله الاساسية من ظلم وفقد للعدالة الاجتماعية وتفشي الفساد بكل صوره , محاولين ان نجعل مفهوم الحرية معني يعيشه الانسان المصري بشكل يومي حتي يأتي اليوم الذي يحدث فيه التغيير المنشود.<br />رسالتنا<br />هي خلق جيل من الشباب يقدر حرية الرأي والتفكير ويحترم التعدد في اطار خصوصية حضارتنا وديننا , حرية تقتلع جذور الثقافة التي بذرتها الديكتاتورية في كل بيت مصري وتخلق مجتمعا يواجه الظالمين ويدافع عن ابسط جقوق الانسان وويطبق اركان العدالة الاجتماعية التي تحترم حق كل مواطن ..حرية لا تستمد من الأجنبي ولكن تحترم التجارب الانسانية وتقوم علي العدالة مؤسسة علي اصول الاسلام واحترام الاديان وحقوق الانسان الممنوحة من الله ...للإنسان<br />حادث التفجير الاجرامي بالأزهر<br />تستنكر الجبهة هذا العمل الاجرامي وتعتبره فعلا يسبب الاضطراب ويخلق البلبلة ويعطي الحكومة المبرر للابقاء علي حالة الطوارئ المعلنة منذ عقود , وانها لا تصب الا في مصلحة الديكتاتور وغيره من المنتفعين من بقاء الوضع الحالي علي ما هو عليه , ونهيب بالشباب عدم الانسياق وراء دعاوي التفجير بحجة انها مرضاة لله , فالله لا يرضي بظلم ولاسفك دماء الابرياء ولا بترويع الامنين<br />ما يسمي بجبهة انقاذ مصر اللأوروبية<br />تعلن جبهة سلام انها أول من رفعت شعار انقاذ مصر وانها ليست لها اي صلة بم يسمي بجبهة انقاذ مصر والتي مقرها في لندن , حيث اننا لا نعرف من هم المسؤولين عنها ولا تمويلهم ولا نواياهم , كما اننا لا نشكك فيهم , الا اننا نوضح توضيحا لا لبس فيه اننا لا نمت لهم بصلة من قريب أو بعيد وانهم يستخدمون اسما مقارب لإسمنا بقصد أو غير قصد وهذا لا يعني أننا ننتمي اليهم أو انهم ينتمون الينا بأي شكل او صورة<br />هكذا بدأنا<br />كنا من اول من رفع صوته ضد ظلم الطاغية المصري ونظامه الديكتاتوري وغيرنا من المخلصين الذين تزامنوا في المطالبة بتخليص مصر من قبضة الظلم التي جثمت علي صدور المصريين لعقود من الزمان , وكنا من اول من نزل الي الشارع المصري ليستطلع رايه بخصوص الانتخابات الرئاسية القادمة حيث ان الغالبية من الشعب المصري كانت تري ان عمرو موسي هو افضل مرشح رئاسي في حالة حدوث انتخابات رئاسية وقد حولنا هذه الرغبة الي عريضة تجمع التوقيعات لاجل هذا الغرض<br />حرصنا ان نكون من الناس واليهم ورفضنا اي شكل من التدخل الاجنبي مهما كانت نواياه , وحركناالماء الراكد ولازلنا علي نفس الطريق حتي نحقق ما يرنو اليه الشعب المصري<br />رؤيتنا<br />ونحن الان نتحرك علي الارض ونتصل بأعضائنا وجها لوجه ونعيد ترتيب كوادرنا , نستمع اليهم ونعرف اراءهم ونتلمس خطانا من خلال جمهور من أيدنا وساندنا بأي شكل وصورة , نحب ان نبشرهم بأن مشاريعنا لا تنتهي بانتخابات الرئاسة المصرية لعام 2005 بل تبدا بها , واننا فقط في اول الطريق حيث ان مهمتنا الاعظم هي تدمير ثقافة الديكتاتورية التي غرست في كل منا مثل المرض بفعل ديكتاتورية عشناها لاكثر من خمسين سنة فجعلتنا جميعا ضحايا لها .<br />ولذا فاننا وبرؤيا نابعة من قاعدتنا ومستندة الي اراء الاغلبية من اعضائنا والذين لا نترك اي فرصة الا وتواصلنا معهم , رؤيا مرجعيتها مستمدة من الاسلام وتحترم الاديان والتكوين الحضاري والثقافي وخصوصية مجتمعنا المصري بكل عناصره ومختلف طوائفه , رؤيا ترسخ قيم العدالة الاجتماعية وتنافح من اجل حق الانسان المصري و ذلك الحق الممنوح من الله لكل الناس<br />لذا فاننا بهذه الرؤيا ستكون مشاريعنا القادمة هي تطبيق عملي لمنهجنا الذي وضعنا خطوطه العريضة ,وسنعمل بكل شكل سلمي ثقافي او اعلامي او سياسي لغرس بذور ثقافة تحترم الاخر وتنتصر للمظلوم وتنتقم من الظالم وتجأر بالحق وتعلم الحرية وتقيم العدالة وتحترم المواطنة وتنتمي لحضارتنا بلا استيراد اعمي ولا تقليد مندفع<br />دعوة للشباب<br />نحن نؤمن ان الشباب من<br />Read the rest of this comment..."
archived = "2005-05-19"
capture_url = "https://web.archive.org/web/20050519081800/http://www.20at.com:80/article.php?sid=1144"

