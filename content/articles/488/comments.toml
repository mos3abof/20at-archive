subject = "يارب احفظها من الحاقدين والطامعين"
text = "كل واحد بيتكلم علشان مصلحته مش مصلحته البلد كل هدفه الكرسي واللي حوليه الامتيازات اين كان حكومه معارضه سيان<br />مفيش حد بيتكلم عن الوطن محدش بيعمل حاجه الا علشان ياخد قبل مايدي ده لو ادى اصلا<br />ايه النتيجه عمل ارهابي حصل في القاهره انا احساسي بيقول من الهمجيه اللي انتشرت في الشعب الايام ديه<br />الزن ع الودان من غير فهم وعقل<br />يارب احفظ البلد ديه"
archived = "2005-05-19"
capture_url = "https://web.archive.org/web/20050519081800/http://www.20at.com:80/article.php?sid=1144"

[[comments]]
order = 6
subject = "الرجاله"
text = "والله البلد مش ناقصه... منهم لله اللى وصلوها لكده<br />تيجى تبص حواليك .. يمكن تلاقى حد تشعبط فيه ولا تمشى وراه .... تقرف من اللى بتشوفه<br />جعجعه وكلام فارغ<br />ال 24 سنه اللى فاتم بهدلوا البلد ..ولم يسمح لأى راجل يرفع راسه<br />وده شئ طبيعى .... لما رئيس يبقى امكاناته قليله وبسيطه .. هايجيب فى ريحه ناس بتفهم عشان تكشفه .<br />والله انا باكسف من نفسى لما بيتكلم ...وخصصوصا امام الأجانب .<br />طب تعالى نبص شويه حوالينا علشان نعرف احنا رايحين فين<br />أيمن نور ومايفرقش عن حسنى حاجه الا فى شوية ذكاء ؟؟<br />الإخوان المسلمين والعوض على الله .... انتم شايفين قيداتهم شكلها إيه.<br />مرتضى منصور وراح الزمالك والعوض على الله فى النادى ( لازم نضحك شويه).<br />يبقى مفيش ادامنا غير ... حمال ... جمال ؟؟؟ .. يادى النصيبه هم تانى<br />( يامصر ... قلبك ... واجعنى)"
archived = "2005-05-19"
capture_url = "https://web.archive.org/web/20050519081800/http://www.20at.com:80/article.php?sid=1144"

