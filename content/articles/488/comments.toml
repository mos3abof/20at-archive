subject = "والله شعبيته زادت يمكن انا سمعي تقيل"
text = "انا مشفتش حد متريقش عليه ومسخره اصله يستاهل بصراحه ده حته بتاع ولا ليه لازمه مش فالح غير الشعارات وانتوا مش فالحين غير المظهرات ده هبل في عبط والله ولا ليكم لازمه"
