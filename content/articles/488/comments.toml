subject = "سبحان الله"
text = "اتقوا الله اذا ما اراد احد ان يدعو الى الله يتهم بانه غير مسلم ومتاسلم<br />واسم الجماعة لا يقصد منه ان غيرهم غير مسلم<br />وفى مصر حزب الاحرار هل غيرهم مستعبدين<br />ابوجاسر<br />محمد جمال الياسرجى<br />الشرقية فاقوس قنتير<br />abogasrm@yahoo"
archived = "2005-05-19"
capture_url = "https://web.archive.org/web/20050519081800/http://www.20at.com:80/article.php?sid=1144"

