[[comments]]
order = 18
subject = "تحذير من إلغاء زيارات لمسئولين أوربيين"
text = "د. حمدي حسن<br />حذر عضو الكتلة البرلمانية لنواب الإخوان المسلمين بالبرلمان المصري- النائب الدكتور حمدي حسن- من خطورة كثرة اعتذارات مسئولين سياسيين أوربيين وأمريكان عن عدم زيارة مصر.<br />وقال النائب في طلب إحاطةٍ وجَّهه لأحمد أبو الغيط وزير الخارجية المصري: لقد أثار إلغاء عدد غير قليل من الزيارات السياسية لمسئولين أوربيين وأمريكيين لمصر خلال شهر واحد فقط تساؤلات عديدة في الأوساط الدبلوماسية والسياسية المختلفة؛ حيث بدأ هذا المسلسل بتأجيل اجتماع مجموعة الدول الثمانية مع وزراء خارجية الدول العربية، تبعها إلغاء زيارة وزيرة خارجية أمريكا كونداليزا رايس، وكذلك السيد بيرلسكوني رئيس وزراء إيطاليا الذي أعلن عن إلغاء زيارته لمصر في اليوم التالي للإعلان عن الزيارة.<br />موضحًا أن الأمر لم يتوقف عند هذا الحد؛ بل تم الإعلان عن زيارة رئيس الوزراء الدانمركي لمصر وجدول زيارته وجولاته ومقابلاته الرسمية ثم تم إلغاء الزيارة!<br />وأوضح النائب أنه بالرغم من هذه الإلغاءات المتتالية لشخصيات سياسية كبري لها ثقلها في المجتمع الدولي إلا أن الخارجية المصرية تجاهلت الأمر ولم يصدر عنها أي تفسير حتى الآن، ولم توضح الأسباب التي دفعت هؤلاء المسئولين إلى اتخاذ هذا الموقف من مصر، وهو ما يتطلب أن تقوم الخارجية بتوضيح هذه الأمور لتهدئة الشارع المصري الذي بدأ يشعر بأن هناك أمرًا غريبًا في هذا الموضوع."
archived = "2005-05-19"
capture_url = "https://web.archive.org/web/20050519081800/http://www.20at.com:80/article.php?sid=1144"

