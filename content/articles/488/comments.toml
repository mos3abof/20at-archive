subject = "شوف ولاد الـــ"
text = "\"الوطني\" يدعم مبارك.. \"اللي نعرفه أحسن\"<br />القاهرة- وسام الدويك- إسلام أون لاين.نت/ 16-4-2005<br />الرئيس المصري خلال إعلانه عن التعديل الدستوري المقترح (أرشيف)<br />\"نعم لمبارك من أجل مصر وكل المصريين.. مدينة سرس الليان تؤيد وتبايع السيد الرئيس محمد حسني مبارك رئيس الجمهورية لفترة رئاسة جديدة\"..<br />هذا هو نص ما أسماه أحد أعضاء المجالس المحلية من المنتمين للحزب الوطني الديمقراطي الحاكم في مصر \"وثيقة تأييد للرئيس محمد حسني مبارك\" حيث شرع في حملة لجمع توقيعات عليها من المواطنين بالمدينة الواقعة بمحافظة المنوفية شمال غرب القاهرة وتأتي بموازاة حملات مشابهة لأعضاء الحزب في مختلف محافظات مصر تتسم بدعم رسمي ملحوظ.<br />ويستهل \"علاء أحمد حمزة\" صاحب مصنع للزجاج بالمدينة وعضو الحزب الحاكم كلامه مع إسلام أون لاين.نت قائلا: \"اللي نعرفه أحسن من اللي ما نعرفهوش\"، إذ يرى حمزة أن أي رئيس آخر غير مبارك سوف يجرب في المصريين.<br />ويقول إنه تمكن من جمع أكثر من 20 ألف توقيع من أصل 80 ألف نسمة يسكنون المدينة خلال بضعة أيام.<br />وحول فكرة تلك الحملة قال حمزة: \"إنها نبعت من أحد شباب الحزب.. أعتقد أنه من حقنا كمواطنين أولا، وكأعضاء في الحزب ثانيا أن نعبر عن تمسكنا بالرئيس مبارك بأية طريقة، فهناك من يقومون بتعليق لافتات، وآخرون يكتبون مقالات تأييد في الصحف، بل إن الأمر وصل إلى وجود تظاهرات تنادي بالتمسك بالرئيس، إلا أننا ارتأينا أن هذه هي الوسيلة الأفضل\" على حد قوله.<br />مساندة أمنية<br />ويقوم الموقِّع بكتابة اسمه ورقم بطاقة هويته أسفل تلك العريضة. وحظيت تلك العملية بمساندة من أجهزة أمنية، حيث يقول أحد سائقي سيارات الأجرة رفض الكشف عن هويته: إنه أجبر على التوقيع بعد أن لاحظ أن الشخص الذي يجمع التوقيعات قد دون مسبقا رقم سيارته في ورقة كانت معه وكان يلمح من تصرفاته أنه مسئول أمني.<br />وأضاف السائق قائلا: \"أنا رجل بسيط، وأخشى أن يقوم أحد الكبار بإجراء ضدي يكون من شأنه التأثير على عملي في موقف السيارات وبالتالي على رزق أولادي.. وفي النهاية البلد بلد الحزب الوطني\"، على حد وصفه.<br />إلا أن آخرين أصروا على رفض التوقيع على العريضة من بينهم طبيب -طلب عدم الكشف عن اسمه- ووصف الأمر بأنه \"مجرد تهريج\".<br />وتساءل الطبيب قائلا: \"ما معنى أن يأتي خفير المستشفى مع أحد الأشخاص لجمع التوقيعات بهذا الشكل من موظفي الهيئات الحكومية، بل ومن المواطنين في الشوارع، أليس في ذلك نوع من الترهيب؟\".<br />كما تناقل بعض الأهالي أنباء عن أن حمزة يجبر عمال مصنعه ليس على التوقيع فحسب وإنما على المشاركة في جمع التوقيعات أيضا مقابل 10 جنيهات عن كل ورقة يتمكن العامل من إكمالها (الورقة تتسع لعشرين توقيعا).<br />إلا أن حمزة نفى ذلك وقال: \"إن من يقوم بجمع التوقيعات متطوعون، بعضهم من شباب الحزب وبعضهم يعمل في قطاعات مختلفة، ونحن لا نجبر أحدا على التوقيع، وأتحدى أن يكون أي شخص قد تم تهديده بأي شكل لإجباره على التوقيع\".<br />وعلى طريقة المثل الشعبي المصري الذي يقول \"اللي نعرفه أحسن من اللي ما نعرفهوش\"، يرى حمزة أن \"أي رئيس آخر غير مبارك سوف يجرب فينا، حيث سيأتي بطاقم عمل جديد تماما، وهو الأمر الذي سيعرّض البلاد لخطر تجربة سياسية لا قبل لمصر بها\". إلا أنه يستدرك قائلا: \"وليس معنى هذا أننا ضد التغيير ولكن التغيير المطلوب يجب أن يكون تدريجيا وبطيئا حتى لا تحدث كارثة\".<br />الجانب القانوني<br />وحول مدى قانونية حملة التوقيعات تلك يقول المحامي \"وائل الصعيدي\" أحد سكان مدينة \"سرس الليان\": \"هذه الحملة ليست ذات صفة قانونية، فهي مجرد مسألة معنوية، والعبرة في النهاية بنتيجة صندوق الاقتراع\".<br />وتعد هذه الحملة الأولى من نوعها منذ الحملة الشهيرة التي وقّع فيها المصريون عام 1918 على توكيلات بأسمائهم بتفويض الزعيم الوطني سعد زغلول للحديث مع الاحتلال الإنجليزي ومطالبته بالجلاء.<br />يذكر أن محافظة المنوفية في منطقة دلتا النيل هي مسقط رأس مبارك والذي كان أعلن في جامعتها في فبراير 2005 عن كتابه الذي أرسله إلى مجلس الشعب المصري (البرلمان) يطلب فيه تعديل المادة 76 من الدستور، لتسمح بانتخاب الرئيس عن طريق الاقتراع المباشر بين أكثر من مرشح بدلا من الاستفتاء على مرشح واحد يقره البرلمان الذي يسيطر عليه الحزب الحاكم.<br />أما مدينة سرس الليان فهي إحدى 3 مدن تمثل دائرة (منوف) الانتخابية المكونة من مدن منوف وسرس الليان وأضيف إليهما مؤخرا مدينة السادات، التي تقع بها مصانع الحديد والصلب التي يمتلكها رجل الأعمال أحمد عز النائب بمجلس الشعب عن الدائرة وأحد أبرز وجوه الحزب الحاكم.<br />هجوم على المعارضة<br />وشن حمزة هجوما عنيفا على بعض رموز المعارضة قائلا: \"ال<br />Read the rest of this comment..."
