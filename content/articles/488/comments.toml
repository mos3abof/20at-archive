text = "ياريت أيمن نور يكون هو الرئيس القادم<br />وملاحظ أن كل يوم شعبيته بتزيد عن اليوم الى قبليه.<br />وده فعلا مخلى بتوع الحزب الوطنى مش على بعضهم"
