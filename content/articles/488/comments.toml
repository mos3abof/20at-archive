[[comments]]
order = 16
subject = "اذهب إلى الجحيم"
text = "و الله بقى القضية مش كبيرة للدرجة دى خالص...<br />إنتوا لو مسلمين زينا كنتم أقدرتم مشاعرنا..<br />الكلام اللى قلتو غالبا صح..<br />و التسامح ده شىء أساسى فى الإسلام..و عدم السب كذلك..<br />لكن مع راجل-لعنه الله- زى ده..و مع غيظنا من كل اللى بيحصل..و مع قضايا زى مظاهرات النصارى فى القاهرة و الفيوم..طبيعى إن كل ده يتقال و أكتر كمان..<br />إنتوا إيه مابتحسوش؟<br />أما بقى اللى اتكلم عن السياسة و الغرب و رد على الأخ المسلم بقوله/<br />إنت بالفعل إنسان سافل و بجح و كلامك الوقح القذر يدل عليك..<br />و مش بس كده ده إنت كمان مبتفهمشى حاجة و أعمى البصر أو البصيرة..<br />و واضح إن إنت و لا حماسى ولا غيور على دينك..<br />ده يا جاهل لو كنت أساسا مسلم"
archived = "2005-05-19"
