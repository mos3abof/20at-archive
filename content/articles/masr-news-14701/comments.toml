text = "وهو امن امتى الحكم في مصر كان غير وراثي<br />مصر عمرها 7000 سنه امتا كان الحكم غير وراثي<br />عبدالناصر جاب انور السادات وعينه ولي عهد مصر<br />السادات جاب حسني مبارك وعينه ولي عهد مصر<br />امتى بقا في مصر كان الحكم غير وراثي"
archived = "2010-01-06"
