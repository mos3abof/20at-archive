author = "مش مهم"
posted = "2010-01-02"
text = "مش مهم مين الحمار اللى قاعد على الكرسى<br />المهم السلطات اللانهائية اللى تحت ايدة<br />لما يبقى واحد فى ايدة كل السلطات فى جميع القطاعات وجميع المجالات يبقى مش هيعمل اى حاجة ولا اى شىء<br />والكل هيقعد حاطط ايدة على خدة ومنتظر التعليمات العليا والتوجيهات من سيادتة<br />ودى اللى حاصل فى البلد<br />كل شىء واقف ومتجمد<br />لان مزاج سيادتة متعكر شوية او سيادتة فى المشتى او المصيف يبقى مش مهم يتعين وزير مواصلات الا لما سعادتة يفوق<br />المفروض الصلاحيات تتوزع والدستور يتغير<br />بكدة نهرب من التكتيفة اللى البلد متكتفة بها"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106054535/http://www.20at.com:80/masr/news/14701-2010-01-02-09-45-05.html"

