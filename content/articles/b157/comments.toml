[[comments]]
order = 12
subject = "انا بحس بالوحدة اوى"
author = "ريرى"
posted = "2006-01-30"
text = "انا بحس كتير بالوحدة على الرغم من توافر كل شئ من حولى ولكن ما بعرف انا ليه كدة ومشكلتى كمان انى بعند يعنى مثلا اهلى ما بيوافقوا على عمل شئ معين اقوم عملاه بس لانى محتاجة لحد بجد وحاقولكم حاجة انا عاوزة حل لمشكلتى انى انا بتكلم مع ولد فى التليفون وعرفته من الشات بس المهم انه محترم جدا وانا عارفة كدة وكنت بتكلم من ورا اهلى المهم ان فى يوم عيطت كتير وقولت لاختى انى بكلم واحد فى التليفون وانى ما بقدر ابطل الموضوع دة لانى استريحت ولاقيت حد بيسمعنى ويتكلم معى لان اصحابى مش فى كل الوقت موجودين ومش فى كل الوقت بيبقوا عاوزين يسمعوا مشاكل وكل كلامهم تفاهات مش حاجة تانية وانا بتكلم معه بستريح وبحس بالراحة بس ما حدا فاهمنى انى محتاجة للكلام معه بجد وانا لحد الان بتكلم معه فى التليفون من ورا اهلى بس مش عارفة اعمل ايه وانا عاوزة حل لمشكلتى هل انا لازم ابطل الموضوع دة وانى ما اتكلمش ولا اتكلم واستريح ولانهم اصلا مابيقتنعوا بكلامى وبيقولوا على لسة صغيرة وان كل حاجة بقولها غلط وكمان انا الى حصلى زمان مش بيخلينى صديقة مع امى ومع اى حد ومش بقول كل حاجة وانا كتير ببقى حزينة وما بلاقى حد اتكلم معاه ومش عارفة اعمل ايه يعنى بجد وببقى كتير مخنوقة ومحتاجة انى اتكلم مع حد وياريت ياجماعة جيبوا لى حل فى الموضوع دة وارجو الرد سريعا<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134015/http://www.20at.com/article2.php?sid=157"

