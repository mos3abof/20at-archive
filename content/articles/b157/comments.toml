[[comments]]
order = 0
subject = "العائله ولو بشكل غير مباشر"
author = "فؤاد محمد من ليبيا"
posted = "2005-12-27"
text = "انا اعاني من الوحده التي هي من النوع الاول فعلى الرغم من انني لا املك وقت فراغ في حياتي والناس من حولي في جميع الاقات الا انني اعاني من الوحده وبشكل كبير والسبب على حد استنتاجي يرجع الى عائلتي الكريمه فانا ابن لعائله تركهم الاب ورحل عن هده الدنيا الفانيه وانا في سن الخامسه عشر وترك لنا اطفال صغار اضغرهم لا يتجاوز عمره العامين ومن يومها بدأت في كيف اعول نفسي واقيها شر هده الدنيا، كنت في اول سنه في الثانويه العامه لما توفيا الوالد رحمه الله وكنت احرص ما يكون على اتمام تعليمي ولاننا من عائله محدودة الدخل بدأت في التفكير في كيفية الحصول على المال الدى احتاجه ومنها والحمد لله وبتوفيق منه المشروع اللى ادخله يمشي حاله وينجح الى ان اصبحت املك محلات لحساب نفسي ، وكنت قد تحملت اعباء الاسره ومصاريفها الكبيره فقط لان اخي الدي يكبرني سنا كان يتحمل مصارف الاكل والشرب والتنقل ، فأصبحت ملاذ العائله في ما تحتاجه ولست ببخيل عليهم في شئ فكانت نظرتهم لي على ان اهميتي تكمن في الحاجات الكبيره فقط واستمروا في تلك النضره التي ينضرون بها الى هدا الابن ولقد تطور تجاهلم لي الى ان اصبحوا لا وجود لي الا في حدود ما يحتاجونه فقط ودلك ليس مقصودا بالتأكيد ولكن هدا كله سبب لي شعورا بالوحده اعاني منه الكتير من الويل فكرت في الرحيل فكرت في الطرف الاخر وانه من الممكن ان يكون هو الحل الدي من المفروض ان يكون موجود وخاصة وانني لم يكن لدي الوقت لكي افكر في ان تكون في حياتي امرأه حقيقيه تبادلني نفس المشاعر وبما انني في اخر سنه بالجامعه فكانت الفرصه لهده التجربه سهلة الحصول وفعلا تعرفت على فتاة رايت فيها كل ما هو جميل وقلت في نفسي هي التي سوف تعوضني على ما فات ولكن للاسف حضي لم يكن موفقا معها لم تتمكن من فهمي او انني كنت صعب المراس لم نكن نتفق او بالاحرى لم يكن هناك توافق بيننا فكانت نضرتي مستقبليه وكانت نضرتها الى الحياة أنيه ، فقررنا الانفصال ولان انا قمة الوحدانيه ادا كانت لها قمه وكل ما اخاف منه هو ردة فعل هده الوحده عليا . ولكن والحمد لله قناعتي بالله سبحانه وبانه جعل من بعد الكرب الفرج وعسى ان يكون قريبا فدلك هو ما اجعله رفيقا في وحدتي .<br />واشكر الاخت العزيزه فاطمه على طرحها لهذا الموضوع فقد ازاح ولو شئيا من على قلبي<br />\" فصبرأ جميل والله المستعان\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134015/http://www.20at.com/article2.php?sid=157"

