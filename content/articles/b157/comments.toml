posted = "2006-01-24"
text = "مسأله صعبه وأشوف ان الاجابه تخصك وأنا ماأبغى أكون الا اني أتوفق<br />في اختياري وأتمناها تكون من حلاها تطفي ناري . ابحث عنها ياقلبي بأول واّخر مدااااّك ,أبحث عن من تشوفه بروحه يفتديك ,وأبحث فالكون كله بدراً يظوي سماااااك ,.....وياحلو حط جرحك وسط قلبي وأرمي همومك علي وخلها خلي واحد مننا يصبح جريح ,وواحد يعيش الحياة ويفلها ,هي صحيح بتكثر جروحي صحيح ,لكن جروحك من اللي يلمها , وأحفظك في وسط عيني ماتطيح أصلاااااااا<br />إن طحتي عيوني من لهــــــــــا ,على العموم أنا أتمنى التوفيق للجميع وأتمنى الأفضل والأحسن والأرق والأجمل والأحلى لنفسي طبعاً ,أريدالدفئ الذي يفتقره الرجال أريد الحنان الذي ينعش الجوارح أريد أن أكون غارقاً في الرومنسيه,<br />.......................ياحبذا لو كانت قبليه أيضاً ,وحرارتها (100% )*<br />أعذروني لقد نسيت نفسي وإندمجت في بحر النساء آآآآآآآه من النساء ,لاأريد أن أزيد على كل ماقلت شئ لأنني لاأستطيع ...................لماذا لأنني أنا وإنتي ياروحي روحين بروح لو راحت روحك ياروحي روحي بتروح ....kw_te_r@hotmail.com<br />0505574715//0556799955"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134015/http://www.20at.com/article2.php?sid=157"

