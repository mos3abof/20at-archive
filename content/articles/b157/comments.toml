subject = "الوحدة وسط الاهل"
author = "هدى"
posted = "2006-07-30"
text = "انا عن نفسي بحس بالوحدة و انا وسط اهلي<br />لاني بعيش تناقضات مابيين افعلهم واقولهم وتغيرهم بدون مبرر ولا سبب.<br />انا لازم اضحي من اجل الجميع و مع ذالك الكل بقول يا نفسي<br />ولو اخطات شوي بيجو العبر و النصايح والتخويف ادرجة اني اخاف اني اغلط<br />علشان مينقليش اني غلطانة<br />احس بالوحدة في افكاري وافعالي<br />احس بالذل من قلة الحيلة وقلة ذات اليد<br />مع الوقت اصبحت بجد وحيدة ومنعزلة<br />ومع ىذالك زي الخاتم في اصبع اي حد<br />ياريت الي عندو حل لمشكلتي يتصل بي على الاميل hoda200020000@yahoo.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134015/http://www.20at.com/article2.php?sid=157"

