order = 15
subject = "وحده في كل مكان"
author = "طول عمري وحيده"
posted = "2006-02-22"
text = "اخخ الوحده الوحده.. تعذب كثير كثيييير..<br />اسالوني يابشر ياعالم.. وحده في كل مكان بحياتي.. في قلبي بين اهلي وبين اصدقائي.. واكثر شي بالجامعه.. ماعندي أحد.. واصدقائي بجامعة ثانية.. احاول اني اصادق طالبات معاي بالمحاضرات اضحك معاهم وادردش.. لكن احس مافي اي فايده.. ايش اسوي لهم عشان اخليهم اصدقائي.. كل وحده تشوف مصلحتها وتمشي.. وحتى بعضهم عملوا صداقات او يمكن لهم صداقات من ايام المدرسة بس انا لا.. اروح احس اني وحيده وارجع البيت بنفس الاحساس..فراغ وقهر في قلبي.. واللي يزيد من القهر اني احس صديقاتي بالجامعه الثانيه صايره تخف علاقتنا ببعض وهذا من الوقت كل وحده في مكان وكل وحده مشغوله.. يالله ماعرف ايش الحل.. ماعرف كيف املي هالفراغ والله تعبت.. انتظر ينتهي الفصل بفارغ الصبر لعل وعسى اتعرف على ناس تملي حياتي وتفهمني.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134015/http://www.20at.com/article2.php?sid=157"

