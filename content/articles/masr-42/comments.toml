[[comments]]
order = 0
subject = "حتي عمرافندي يا اللى ملكوش عزيز"
author = "المواااااطن المطحون"
posted = "2006-03-21"
text = "يلا مهو باعو شركات ومؤسسات و أخلوا مسؤليتهم و كمان باعو الشعب و تخلوا مسؤليتهم جايين على عمر افندي و تتكلموا حط لسانك جوا بقك منك له وكل عيش و ربي عيالك انتا وهوا وبلاش تغلطوا ف السياد الشرفا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021818/http://masr.20at.com:80/article.php?sid=42&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 1
subject = "من ده بكرة بقرشين"
author = "فادي اسكندر"
posted = "2006-03-21"
text = "من ده بكرة .. بقرشين<br />عند مبارك .... بقرشين<br />شعب مصر ... بقرشين<br />عمر افندي ... بقرشين<br />يااااااااه دول باعوا حاجات كتير اوي واحنا مش واخدين بالنا<br />كفاية ... كفاية ... كفاية"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021818/http://masr.20at.com:80/article.php?sid=42&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 2
subject = "فساد داخلى وخارجى"
author = "على عبد التواب"
posted = "2006-04-21"
text = "لية منبعش عمر افندى واحنامش عارفين نستثمروا ودا دليل على فشل داخلى وخارجى وخيبة المصريين وخيبة وزارة الآستثمار وخيبة البلد وحرامية من جوا عمر ومن برة عمر وشوف ياسي عمر اللى هيحصلك وتستاهل اللى هيحصل<br />موظف بالشركة المنكوبة لا يتعدى راتبه 200جنية وهو حاصل على مؤهل عالى وياريت يتباع عمرافندى"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021818/http://masr.20at.com:80/article.php?sid=42&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 3
subject = "جات الحزينه تفرح مالقتش لها ماترح"
author = "نصر شعبان عبد الله"
posted = "2006-04-22"
text = "لما حاتبيعوا عمر افندى يبقى الواد ميسو بتاع كفر الدوار حيبيع قماش لمين يالهوىعلى الى بيحصل وربنا يديم الانتدابات لنا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021818/http://masr.20at.com:80/article.php?sid=42&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 4
subject = "عمرافندى فى ذمة التاريخ"
author = "مجدى محمود"
posted = "2006-05-21"
text = "ياريت يباع عمرافندى أحسن من السرقة والنهب اللى حاصل فيه سيادةرئيس مجلس الادارة السابق منه لله خربها ومشى ومفيش حد سأله انت عملت ايه اشمعنى حبسو بتاع هيئة النقل العام وعجبى"
archived = "2006-05-25"
