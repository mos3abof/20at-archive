text = "الاستاذ احمد الهوارى المحترم<br />يبدوا يا عزيزى انك بعيدا جدا عن عالم الشباب<br />اجلس فى مقهى واسمع هؤلاء الشباب يتحدثون فى مجموعات - نضوج كامل ومعرفة بادق خفايا السياسة وما يدور فى خفايا وكواليس الحكومة<br />ولكنة عندما يتحدث امام الغرباء والمخبرين والبصاصين فى وسائل المواصلات فانة يغير اتجاة البوصلة ويتكلم بما يرضى النظام او ما يتبناة النظام<br />لا تخاف على شباب مصر فشباب مصر واعى ومثقف ورائع وفاهم وبيلعب بالبيضة والحجر"
