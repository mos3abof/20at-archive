author = "ابنتى كانت كذلك"
posted = "2009-10-20"
text = "ابنتى كذلك<br />وفى مدرستها الاعدادية فى دولة الامارات التفت البنات المواطنات حولها وسالوها<br />رئيس الدولة الشيخ زايد فمن هو رئيسكم<br />ردت ابنتى بسذاجة<br />رئيس دولتنا الشيخ حسنى مبارك<br />وحتى الان واللة العظيم لا تعرف شيئا عن جغرافية بلدها وتظن ان اسوان بجانب طنطا واسيوط حى من احياء اسكندرية<br />دى ضريبة الشتات المصرى فى بلاد الغربة بعد خراب بلادهم"
