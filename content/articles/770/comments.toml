[[comments]]
order = 8
subject = "موسوعة طنطاوي اخر زمن ج1"
author = "عقلاني"
posted = "2006-02-16"
text = "تم تعيين الدكتور سيد طنطاوي شيخاً للأزهر في 27 مارس 1996 رغم أنه كان في ذيل قائمة تضم أكثر من أربعين عالماً أزهرياً إذ تم تصعيده إلى رأس القائمة بقدرة قادر! طبعاً بقدرة تقارير أمن الدولة التي أثبتت أن الشيخ طنطاوي لا يرد يد لامس وخاصة يد رئاسة الدولة!!<br />ومن عجائب المقارنات الأزهرية: أن هناك تشابهاً بين شيخ الأزهر عبد الرحمن تاج [1954 – 1958] والشيخ طنطاوي... فالشيخ عبد الرحمن تاج يضرب به مثل العالم الذي يكون أداة في أيدي النظام،؛ مثل العالم الذي باع آخرته بدنياه... فهو الذي أصدر فتواه الشهيرة بأحقية الدولة في التجريد من شرف المواطنة - سحب الجنسية - وكان يقصد اللواء محمد نجيب أول رئيس جمهوري لمصر بعد النظام الملكي!!<br />لكن شهادة حق: فإن الشيخ عبد الرحمن تاج يعتبر قطرة في محيط فساد شيخ الأزهر الحالي... حيث فاق أقرانه وأتى بفتاوى وأقاويل وأحكام لم يأت بها الأوائل!! فالشيخ طنطاوي يفصل الفتاوى حسب المقياس الرسمي للدولة!!<br />وهذه عينة من فتاوى وسلوكيات شيخ الأزهر طنطاوي:<br />أفتى طنطاوي بجواز التحاق الفتيات إلى الكليات العسكرية والإلتحاق بالجيش!!<br />أفتى بجواز تحويل الرجل إلى أنثى بشرط الضرورة الطبية.<br />أفتى بأن تطبيق الشريعة الإسلامية يحتاج إلى وقت طويل يصل فيها الجميع إلى القناعة.<br />بارك توصيات مؤتمر المرأة في بكين وقال إن مطالب مؤتمر بكين الخاصة بالمساواة بين الرجل والمرأة لا تتعارض مع الشريعة الإسلامية!!<br />أيد طنطاوي الدولة في إغلاق بيوت الله وخاصة الزوايا والمساجد الصغيرة التي كان يتردد عليها بعض أفراد الجماعات الإسلامية.<br />أيد قرار رئيس الجمهورية بإحالة أعضاء الجماعات الإسلامية إلى المحاكم العسكرية!!<br />لم يطالب الدولة مرة - ذراً للرماد - أن تلغي قانون الطوارئ... كما لم يطالب الدولة صراحة بتطبيق الشريعة الإسلامية وقت أن كان مفتياً إلى أن صار شيخاً للأزهر!!<br />في عام 1995 عندما كان مفتياً قام بزيارة إلى أمريكا بمصاحبة القس \"صموئيل حبيب\" رئيس الطائفة الإنجيلية... وتم حصوله على الدكتوراه الفخرية من جامعة \"وستمنستر\" بولاية بنسلفانيا!!<br />.....يتبع---->"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123120/http://www.20at.com/article2.php?sid=450"

[[comments]]
order = 9
subject = "موسوعة طنطاوي اخر زمن ج2"
author = "عقلاني"
posted = "2006-02-16"
text = "أما أهم فتاواه، فهي:<br />إباحته للربا وهي الخاصة بشهادات الاستثمار وصناديق التوفير حيث أفتى بأن المعاملات فيها جائزة شرعاً.<br />وفي حرب الخليج 1990 كان بوق النظام الرسمي... وقد كان في صف الكويت والسعودية حسب الدور المرسوم له من الدولة!! بل إنه ذهب بنفسه إلى السعودية لزيارة القوات المصرية في حفر الباطن!! وأيد الإستعانة بقوات أجنبية وقال بجواز ذلك شرعاً!!<br />نقل الشيخ صادق العدوي من خطابة مسجد الجامع الأزهر إلى مسجد النور بالعباسية ليتولى الخطابة مكانه نظراً لشعبية الشيخ العدوي المتزايدة وكثرة انتقاده للدولة.<br />أعلن أنه على استعداد لزيارة فلسطين إذا دعاه ياسر عرفات رغم علمه بأنه لزام عليه أن يحصل على تأشيرة من الكيان - إسرائيل -<br />وافق على منع كبار علماء الأزهر من الخطابة إلا بتصريح من وزارة الأوقاف.<br />منع إعادة طبع فتاوى الشيخ جاد الحق لأن بعضها لا يتفق مع فتاواه.<br />تسبب في قطع أرزاق نحو ألفي داعية أزهري من جبهة علماء الأزهر من إدارة الوعظ والإرشاد بمنعهم من ارتقاء المنابر وقصر ذلك على موظفي وزارة الأوقاف.<br />كان دائم التردد على أندية \"اللوينز\" بمصر الجديدة وغيرها، وهي أندية مشبوهة تديرها شبكات يهودية بهدف السيطرة على العالم والقضاء على الأديان وإشاعة الفوضى الأخلاقية وتسخير الشباب للتجسس على بلادهم... ذكرت جبهة علماء الأزهر التي أسست في 1946م أن هناك فتوى صادرة من الأزهر في مايو 1985 تحرم على المسلمين الانتساب تلك الأندية؛ أندية \"اللوينز\" و \"الروتاري\".<br />أفتى بأن الفلسطينين الذين يقومون بتفجير أنفسهم ضد أهداف مدنية إسرائيلية ليسوا شهداء... ردت عليه جبهة علماء الأزهر تحت عنوان \"تبرئة وبيان\" اعتبرت فيه منفذي العمليات الإستشهادية في فلسطين أنهم أفضل الشهداء، وجواز قيام الفلسطينيين بتفجير أنفسهم، لأن إسرائيل دار حرب وجميع أهلها أهل حرب ولا حرمة ولا عصمة لدمهم.<br />وافق على قرار وزير التعليم بمنع دخول المحجبات المدارس إلا بعد موافقة ولي الأمر.<br />أفتى الشيخ نبوي محمد العش رئيس لجنة الفتوى بالأزهر بتحريم التعامل مع مجلس الحكم العراقي لأنه مجلس غير شرعي وأسسه الاحتلال وأن من يتعامل معه يخالف شرع الله.<br />زار ديفيد ولش السفير الأمريكي بالقاهرة شيخ الأزهر معترضاً على الفتوى. ثم في 29 أغسطس 2003 أصدر طنطاوي قراراً بإيقاف الشيخ العش عن العمل ونقله إلى منطقة نائية في أطراف الدلتا بمصر. ولم يكتف الشيخ بذلك بل أعلن أن الأزهر مؤسسة مصرية وليس مؤهلاً للفتوى.<br />أصدر قراراً بإقالة الشيخ أبي الحسن رئيس لجنة الفتوى السابق بالأزهر بسبب تصريح له بأنه لا يجوز مد يد العون للعدوان الأمريكي على العراق ودعا إلى الجهاد ضد هذا العدوان.<br />أحال عالمين ضريرين - هما الدكتور إبراهيم خليفة رئيس قسم التفسير بكلية أصول الدين، والدكتور حسن محرم أستاذ العقيدة بنفس الكلية - إلى التحقيق بتهمة توزيع منشورات تسئ إلى مقام الإمام الأكبر شيخ الأزهر!!<br />استصدر قراراً من محافظ القاهرة يحمل رقم رقم 318 لسنة 1998م بحل جبهة علماء الأزهر وتعيين إدراة موالية له.<br />التقى حاخام إسرائيل الأكبر \"مائير\"، ومن قبله سفير إسرائيل في مصر.<br />تحت مسمى تطوير الأزهر؛ أيد القانون الذي يقلص سنوات الثانوي الأزهري من أربع إلى ثلاث سنوات.<br />أحال الدكتور إبراهيم الخولي والدكتور محمود حماية إلى التحقيق وكذلك الدكتور يحيى إسماعيل الذي غادر مصر إلى إحدى الدول العربية الذي لاحقه شيخ الأزهر قضائياً... كل ذلك بسبب معارضتهم لفتاواه الضالة!<br />قال؛ أن المرأة تصلح أن تكون رئيسة للجمهورية وأنها تتمتع بالولاية العامة التي تؤهلها لشغل المنصب.<br />فتوى صك غفران لوزير الداخلية الفرنسي \"نيكولاس سركوزي\" ورئيسه \"شيراك\"؛ من حقهم سن قانون بحظر الحجاب!! افعلوا ما شئتم بالمسلمين فقد غفر لكم شيخ الأزهر!! أما مسلمات فرنسا فإما أن يخلعن الحجاب ويدخلن في دين الملك... فأهل فرنسا أدرى بشعابها! وإما أن يرحلن عن فرنسا أو يشربن من نهر السين أو البحر المتوسط!<br />........يتبع------>"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123120/http://www.20at.com/article2.php?sid=450"

[[comments]]
order = 10
subject = "موسوعة طنطاوي أخر زمن ج3"
author = "عقلاني"
posted = "2006-02-16"
text = "كما لا يخفي علينا الموقف الاخير من النصرة للرسول. كما في المقال الرثيسي.<br />صفوة القول:<br />خلاصة القول في الشيخ سيد طنطاوي؛ أنه اختير بعناية من قبل النظام... وكان رجل المرحلة التي تمر بها الدولة المصرية المأزومة دائماً!! والدولة لم تقصر معه فالرجل جاء من صعيد مصر شبه معدم مادياً والآن صارت له قصور ولأبنائه.<br />اللهم لا اعتراض، إلا سؤال برئ على الطريقة العمرية: من أين لك هذا يا شيخ الإسلام!! قد يفسر هذا سر انبطاح الطنطاوي لكل رغبات الدولة... بل إن الرجل نظراً لزلة ما صار يعمل آلياً إذ لديه قرون استشعار عجيبة يعرف بوصلة الدولة أين تتجه... فيتفي بدون طلب على طريقة: اللبيب بالإشارة يفهم! وهو لبيب جداً في هذا المجال!!<br />إن الشيخ طنطاوي يتصرف مع علماء الأزهر بأخلاق زعيم عصابة... أخلاق جلاوزة التعذيب وليس أخلاق الشيوخ؛ حملة مصابيح الهدى!!<br />يجب أن يحاكم هذا الرجل تاريخيا وشرعياً؛ لمخالفته لما هو معلوم من الدين بالضرورة ولضربه صريح النصوص القرآنية عرض الحائط، ولولائه لأعداء الأمة الإسلامية، ولاستهزائه بعلماء الإسلام والتنكيل بهم لحساب قوى الشر... مع حسابه عن استغلاله لنفوذه في تكوين ثروة توجب المساءلة...<br />لزام على علماء الأزهر أن يتصدوا لهذا الرجل لأنه صار منكراً يجب دفعه شرعاً وعقلاً بالطرق المتاحة قدر المستطاع.<br />للأسف الشديد؛ لقد كان تصدر هذا الرجل لأعرق مؤسسة دينية في العالم الإسلامي السني إهانة بحق لتاريخ هذه المؤسسة، وإهانة مضاعفة لكل مشاعر المسلمين في أنحاء المعمورة... فالطنطاوي لم يكن أهلاً لمنصب الإفتاء، ولم يكن جديراً بمنصب شيخ الأزهر!!<br />فالأزهر ليس مؤسسة مصرية فحسب بل هو مؤسسة عربية وإسلامية لكل المسلمين في سائر أنحاء العالم الإسلامي.<br />لكن الأزهر الشريف في عهد شيخ الإسلام الطنطاوي! صارعتبة مقدسة لبني صهيون، وكعبة مشرفة لساسة البيت الأبيض وقصر الإليزيه!! ومرتعاً لكل من هب ودب من جواسيس العالم!!<br />صار الأزهر ودار إفتائه في عهده الميمون! بورصة فتاوى... صعوداً وهبوطاً حسب مزاج الدولة وتوجهاتها!<br />في عهد شيخ القصرالجمهوري طنطاوي! تصرخ مآذن الأزهر وأروقته وجدرانه على لسان شاعر النيل حافظ إبراهيم:<br />مَنْ المداوي إذا ما علةٌ عرضتْ من المدافعُ عن عرض وعن نشبِ<br />ومنْ يميطُ ستارَ الجهل إن طُمستْ معالمُ القصد بين الشك والرّيَبِ<br />لقد اختطف طنطاوي الأزهر وحبسه في أحد أزقة القاهرة الضيقة... الأزهر العملاق الذي كان يثور على قوى الظلم والبطش وكان معقل الثوار ودرب المجاهدين... حبسه الطنطاوي في قمقم؛ مفتاحه في يد نظام فاسد متآمر آيل للسقوط لا يرقب في أمة العرب والإسلام إلا ولاذمة!!<br />من عجائب الدهور حقاً أن يكون على رأس مصر ناطور خشبي وعمامة خشبية، وصدق المتنبي إذ قال:<br />وكم ذا بمصر من المضحكات ولكنه ضحك كالبكا<br />ملحوظة : الموسوعة بأجزاءها الثلاثة منقوله من منبر الجهاد والتوحيد.الكاتب: هاني السباعي]<br />أشكر له التوضيح."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123120/http://www.20at.com/article2.php?sid=450"

