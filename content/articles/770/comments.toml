text = "شيخ ازهر ايه و مفتي ايه يا جماعه دي كلها مؤسسات حكومية يعني على راي سمير غانم في فلم رمضان فوق البركان ( هنا محدش يفتح بقوا )<br />يعني كلام مبارك = كلام طنطاوي = كلام جمعه<br />و كله في الكليتش<br />انا بقالي سنين عايش في مصر مشفتش رجل دين دخل الحكومة و خرج نضيف الا الشيخ نصر فريد واصل ( و عشان كده طلعوه ع المعاش )<br />لو حد شاف حد غيره يقولي لان انا نظري ضعيف حبتين"
