author = "مواطن مقهور"
posted = "2006-03-08"
text = "بجد مرسيى على الموضوع دا لانى بجد مخنوقة من الراجل ده اووووووووووووووووووى دا مجرد برفان ساتر ترابى للحكومة .اين عمر بن الخطاب اين الشريعية الاسلامية . لقد اكتفى فى تعليقة على الاساءة للرسول الكريم بانة انسان ميت ولا يجوز مهاجمتة دا راجل بجد اهبل عبيط الرسول حى فى قلوبنا مادامت الحياه . وبعدين ياجماعه لو تاخدو بالكو من كلامة معندوش غير كلمتين بس تعاونو على البر والتقوى لا على الاثم والعدوان بجد يارب ارحمنا وطهر امه محمد من هذة النوعيات التى لاتمت للاسلام بصلة يارب العفو . لاتاخذنا بما فعل السفهاء منا. اه وتعاونو على البر والتقوى لا على الاثم والعدةان ."
