text = "اما ان النبى صلى الله عليه وسلم اخبر ان اخوف ما يخاف على الامة منافق عليم اللسان يجادل بالقرآن .وحسبكم فانى لم اطلع على ما فى قلبه فالله حسيبه .ولكن القرائن كلها تدل على ذلك ,ولا احسبه الا كما قال الله تعالى(واتل عليهم نبأالذى آتينه آياتنا فانسلخ منها فاتبعه الشيطان وكان من الغاوين.ولوشئنالرفعنه بهاولكنه أخلد الى الارض واتبع هواه فمثله كمثل الكلب ان تحمل عليه يلهث أو تتركه يلهث)والله حسيب كل متجرىء على شرعه وحسبنا الله ونعم الوكيل"
