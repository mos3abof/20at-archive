subject = "على رسلكم"
author = "ازهرى"
posted = "2006-03-02"
text = "ان الحمد لله احمده واستعينه واستغفره واستهديه وبعد فان خير الكلام ما قل ودل والله اسال ان يجعلنى ممن اوجز فى الكلام واوسع فى المعنى فاقول اليكم اخوانى اعذركم جميعا فلعل منكم من اخذته نخوة الغيره على دينه واباح بكلام اسال الله العظيم ان يغفر لى وله فان من تتحدثون عنه هذا عالم ليس غير وهذا لا يحتاج الى شهادتكم عذرا فى القول فهذا ليس تقليلا من شانكم ولكن من الممكن اناكثركم تكلم على شيخنا الجليل نحسبه على خير ولا نزكى على الله احد من اممكن ان يكون كلامه هذا مبنيا على بعض ما قراه فى الصحف وهذا ليس كافيا على شتم وسب عالم كهذا ولكن كل ما علمه لنا الرسول الكريم صلى الله عليه وسلم ان نحم علماؤنل ونوقرهمولا يجوز باى حال من الاحوال ان نشمت به فانه امام الجميع شيخ الجامع الازهر فانلم نحترم الشيخ فمن الواجب علنا ان نحترم المؤسسه التى يراسها وليس كلامى هذا ان مع الشيخ او ضدكم ولكن كلمة اسال الله ان اكون صادقا فيهاوجزاكم الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123120/http://www.20at.com/article2.php?sid=450"

