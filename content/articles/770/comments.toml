text = "السلام عليكم ورحمة اله وبركاته<br />قدر لي منذ عامين تقريبا صلاة العيد في شرم الشيخ لعملي هناك باحد فنادقها ، ولقد امنا في الصلاة شيخ الازهر الذي اكد في خطبته كالعاده كلامه الذي لا يبقى له مفعول بمجرد ان تتقبله العقول. ولقد حاولت جاهدا ان اتذكر اي جملة منه عقب خروجي من المسجد لكن الذاكرة لم تسعفني.<br />ولي ان اطرح عدة اسئلة لفضيلة المفتي عن هذه الكيفية لصلاة العيد المباركيه؟؟ وما راي الشرع فيها؟؟ لانه رجل مفتي قديم وشيخ اكبر كما يلقبونه، والذي اعرفه عن صلاة العيد ان يواصل المصلون التكبير بصوت مسموع في جنبات الساحات اوالمساجد، حتى يحين موعد الصلاة وينادي الامام على الجموع : الصلاة جامعه الصلاة، جامعه ثم يصلي الناس العيد وبعدها يكون الاستماع للخطبه.<br />وما حدث ياامامنا الفاضل وبحضورك ؟؟ انه لم يسمح لنا بالتكبير في المسجد ، وجلس الجميع في صمت مطبق... اضاع بهجة التكبير في العيد ... الى ان وصل الرئيس قبيل موعد الصلاة الذي حددوه (بعد الثامنة صباحا) وارشدوه الى مكانه ، بعد ان رصوا صفوف الوزراء ورجال الدولة ليس باسبقية الحضور بل اقربهم وادناهم منه منزلة وترتيبا ..كل هذا ونحن المصلين ننظر ونتابع ..<br />ثم اعتلي المقرىء الشيخ نعينع كرسي التلاوة ، وقرء ثلاثة ايات من الذكر الحكيم !!!؟؟؟ثم كبر ثلاث مرات من ورقة بيده وبعدها اقيمت الصلاة...<br />فهل ورد ياامامنا صلاة العيد بهذه الكيفية ؟؟وفي اي كتاب فقه؟؟ اما اننا نتبع المذهب الحسنوي المباركيى في الصلاة ومن اهم ملامحه وضع اليد اليسرى فوق اليمنى(شوهد الرئيس في الصور هكذا) اثناء الوقوف في الصلاة ..وفرجة بين كل وزير واخر في الصفوف تكفي لمكان مواطن محدود الدخل او ربما لعدم انتشار العدوى ؟؟ دون ان تقول لهم ياشيخنا استووا واعتدلوا ..تماسوا تراحموا ..لعل الله يرحمهم.<br />ثانيا: لماذا هذا الخوف والرهبه اثناء القائك الخطبة وبعدها ياشيخنا الجليل ؟؟ تتلعثم ياشيخنا في قرائتك للفاتحة اثناء الصلاة ولقد ردوك في قراءة الفاتحة وردوك في السورة القصيرة..!!وفي الركعة الثانية ايضا نسيت قراءة ايه في الفاتحة وردوك ايضا..واخطات في سورة الغاشية ؟؟ هل كبر السن ام انها الخشية من الله؟؟<br />وهذا بعض ما شاهدناه نحن المصلين في صلاة العيد المشهوده.. بعد اقامة حاجز الفصل العنصرى بيننا وبين الاسياد ، لانهم حتى في المساجد يجب ان تفصل بيننا الحواجز ،على الرغم من ان الصلاة نموذج للوحده بين المسلمين وعدم الفرقة بين الغني والفقير والوزير والخفير؟؟<br />ورب قائل لعل هذا اجراء امني واقول لهم لقد اُمرت الفنادق في شرم الشيخ-من قبل الجهات الامنية- ان تاتي بمن يرغب في الصلاة في موعد محدد بعد الفجر بقليل قبل غلق الطرق والمنافذ المرورية بالمدينة مع التنبيه على ترك اجهزتهم المحمولة ومن جاء بها ستؤخذ منه على الباب!!ولقد نصب الامن بوابات امن الكترونية عند باب المسجد المخصص لصغار المصلين وترك الباب الكبير لاستقبال شيخ ائمة المذهب المباركي ...<br />اضف الى هذا الاجراء الامني تنصيب اعداد غفيرة-وتحيط بالمصلين- بعد هذا الحاجز العنصري من طاقم الامن المركزي والذي البسوه ملابس بدو سيناء... ليهلل ويكبر عند استقبال الرئيس وعند انتهاء الصلاة:.. ربنا يخليك لنا ياريس كل سنه وانت طيب ياريس .....كلنا فداك ياريس..وصفقنا جميعا في قلوبنا فلقد انتهت الصلاة انتهت فصول المسرحية ..<br />حقا ياسيدي ..انهم يحبونك حتى الموت.. فهل ستموت دونهم ...ام يموتون دونك؟؟<br />....اللهم تقبل صلاتنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123120/http://www.20at.com/article2.php?sid=450"

