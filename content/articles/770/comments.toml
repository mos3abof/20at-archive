[[comments]]
order = 3
subject = "ايه الحكاية ؟؟؟"
author = "السلام عليكم و رحمة الله و بركاته"
posted = "2006-02-16"
text = "لا افهم منطقكم ابدا يا عشرينات ان كان هناك من منطق !!<br />هل هذا هو اسلوبكم في استغلال القضايا المهمة للامة ... ؟؟؟<br />مقاطعة شيخ الازهر؟؟؟<br />ما شأن شيخ الازهر و مقاطعته بالمقاطعة الحالية للدنمارك ؟؟<br />نحن نتكلم عن مقاطعة لنصرة الرسول صلى الله عليه وسلم ،ن و رجاء يا اخوتي في عشرينات مع كل احترام أرجو ان تحترموا عقولنا لانه مقال مثل هذا يوحي لي و كأنكم تستهزؤون بمقاطعة الدنمارك و حاشا لله ان يكون منكم ذلك<br />لا نريد خلط اوراق و توجيه الانظار الى كلام و قضايا مش مهمة .. اذا اردتم تحويل انظارنا الى قضايا مهم و تذكيرنا بقضايانا المصيرية فذكرونا بقضية فلسطين و العراق و لا تتكلموا في مواضيع ليس فيها منظطق مثل مقاطعة شيخ الازهر؟؟؟<br />و جزاكم الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123120/http://www.20at.com/article2.php?sid=450"

[[comments]]
order = 4
subject = "جدد حكامك يا وطنى"
author = "زكريا ابراهيم"
posted = "2006-02-16"
text = "أعداؤك عادوا يا وطنى<br />عاد الرومان وعاد الفرس<br />وأراهم يقتسموك الأن<br />وأرانا لا نتكلم هس<br />جدد حكامك يا وطنى<br />حكامك وصلوا سن اليأس<br />واضرب بعصاك الأرض كموسى<br />اخرج من طينك أهل البأس<br />حكاماً لا يخشون أمريكا<br />حكاماً لا يحنون الرأس<br />يحمون ضعافاً فى بغداد<br />يمشون ذراعاً نحو القدس<br />جدد حكامك يا وطنى<br />وارحمنا من زمن الترهيب<br />زمن التعذيب وزمن الحبس<br />هل يعقل يا وطنى المجنون<br />أن يمضى القرن العشرون<br />وبنفس الماء يدور الكأس ؟<br />حكامك نفس الحكام<br />من عهد تميم وهند وعبس<br />فى أى زمان نحن نعيش<br />زمن العميان أم زمن الخرس ؟<br />منقول"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123120/http://www.20at.com/article2.php?sid=450"

