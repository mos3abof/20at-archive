text = "الاول هاى يا هبهوب و الايميل اللى بعتيه مش عارفه هو على الياهو و لا<br />وضحى علشان اختك بتبقى ساعات غبيه شويتين<br />بالنسبه للموضوع ده انا مش معاكى يا هبه لان الراجل دا مشفتلوش وقفه صح فى ااى موقف و اخرها موضوع النمارك<br />و بالنسبه لعقلانى انت فكرتنى بقول الشاعر عمر ابو ريشه:<br />وطنى كم من هرم مجدته<br />لم يكن يحمل طهر الصنم<br />و مقصدش الطنطاوى هنا لان ف الاول و ف الاخر دا رمز دينى و فعلا ربنا اللى هيحاسبه بس انا بقصد ان كل شىء جايز مع انى مش بصدق كل اللى بقرأه او اسمعه او اشوفه"
