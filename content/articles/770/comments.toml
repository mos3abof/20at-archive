[[comments]]
order = 23
subject = "لا يا مفتي مصر ما هكذا تورد الإبل"
author = "younes mina l maghrib"
text = "لا يا مفتي مصر ما هكذا تورد الإبل<br />بسم الله الرحمن الرحيم<br />الحمد لله رب العالمين والصلاة والسلام على رسول الله وعلى آله وصحبه أجمعين .<br />أما بعد :<br />فقد نشرت صحيفة المدينة في عددها ( 15621) الصادر في يوم الأحد 29/12/1426هـ الموافق 29/1/2006م مقالاً تحت عنوان \" مفتي مصر أكد التحرك لمقاضاة الصحيفة الدنماركية \" هذا نصه :<br />[ علمت (المدينة) أن التصدي لحملة الصحافة الدنماركية المسيئة إلى نبي الإسلام عليه الصلاة والسلام تتصدر أجندة الوفد الإسلامي المسيحي الذي غادر القاهرة قبل أيام متوجهاً لإيرلندا في زيارة تستغرق خمسة أيام، وكشفت مصادر بدار الإفتاء المصرية لـ ''الرسالة'' أن مفتي الديار د. علي جمعة الذي يترأس الوفد أجرى عدة لقاءات بوسائل إعلام ايرلندية وأوروبية ونقل إليهم استياء العالم الإسلامي من هذه الهجمة الشرسة على نبي الإسلام وأنه وجد تفهما من بعض السياسيين والإعلاميين ورجال الدين المسيحي في إيرلندا واستنكاراً لتلك الحملة والتي تتصادم مع أبسط مبادئ الحرية لأنها تسيء إلى خاتم الأنبياء وأكثر من مليار ونصف المليار مسلم حيث قال مفتي مصر: إن الإسلام يؤمن بالحوار ومد جسور التعاون مع أتباع الديانات الأخرى ويؤمن باحترام المقدسات الدينية دون تمييز. مؤكداً حرص بلاده على تقديم النموذج المصري المتميز في العلاقات الإسلامية المسيحية إلى العالم الأوروبي والغربي. وأشار جمعة إلى أن الوفد الذي يضم رئيس الكنيسة الأسقفية في مصر وشمالي أفريقيا والقرن الأفريقي المطران منير حنا أنيس ورئيس لجنة حوار الأديان بالأزهر الشيخ فوزي الزفزاف ونائب رئيس اللجنة الدكتور علي السمان إلى أهمية توحيد الجهود الإسلامية المسيحية في مصر والعالم العربي ضد تيار الإلحاد في الغرب والذي يسخر بشدة من الأديان كافة سواء المسيحية أو الإسلام أو حتى اليهودية من خلال أعمال درامية أو مقالات ورسومات في الصحف وغيرها من وسائل التعبير. وقال إن حرية التعبير التي يتشدق بها الغرب يجب أن تكون حرية مسؤولة ولا تنتهك حرية الآخرين. وأشار مفتي الديار المصرية أن الزيارة تستهدف إيصال الإسلام الصحيح إلى العالم الغربي من خلال مد جسور الحوار والتأكيد على أن الإسلام يرفض الإرهاب بشدة ويسعى إلى نشر السلام وثقافة الحوار. ودعا الحكومات الغربية إلى عدم الدفاع عن ازدراء الأديان تحت دعوى حرية الرأي والتعبير كما حث المسلمين أن يسلكوا قنوات الشريعة عند تضررهم بما يسيء إلى عقيدتهم ونبيهم عليه الصلاة والسلام. وأكد مفتي مصر اللجوء إلى القضاء فيما يتعلق بانتهاكات الصحف الدنماركية للعقيدة الإسلامية لكنه قال إن هذه الأخطاء شخصية ولا يجب أن تعمم على كل أوروبا والعالم الغربي. وكانت رئيسة الجمهورية الأيرلندية ماري ماكليز قد أعلنت حرصها على ترتيب لقاء مع الوفد الإسلامي المسيحي واصفين الزيارة بأنها ''تاريخية''. وهي الزيارة التي تأتي بدعوة من الكنيسة الأسقفية في ايرلندا وبالتنسيق مع الحكومة الايرلندية وتجري في إطار تنفيذ اتفاقية الحوار التي وقعت بين الأزهر الشريف والكنيسة الأسقفية في بريطانيا عام 2002م] اهـ .<br />وسوف أناقش بعض هذه الفقرات التي نسبت إلى مفتي مصر من باب بيان موقف الإسلام الحق والصحيح من الديانات الأخرى قياماً بواجب النصيحة للإسلام والمسلمين , وقياماً بواجب الأمانة العلمية التي سنسأل عنها بين يدي الله يوم لا ينفع مال ولا بنون إلا من أتى الله بقلب سليم .<br />1- يقول المفتي : \" إنّ الإسلام يؤمن بالحوار ومدّ جسور التعاون مع أتباع الديّانات الأخرى ويؤمن باحترام المقدسات الدينية دون تمييز \" .<br />وأقول : لا ندري ما هي هذه الجسور ؟ ولا ندري ما هي المجالات التي يتم التعاون فيها بين الإسلام والديّانات الأخرى ؟ نرجو من مفتي مصر أن يبينها لنا ؟.<br />وأين في القرآن والسنة الإيمان باحترام المقدسات الدينية دون تمييز ؟ .<br />هل نحترم معابد البوذيين والهندوك ونؤمن بقداستها ؟<br />وهل الإسلام يؤمن باحترام الصلبان التي يقدسها النصارى ويعبدونها ؟ .<br />وهل نؤمن بقداسة الكنائس وما فيها من مظاهر الشرك ؟ .<br />وهل عقيدة : (أنّ عيسى هو الله أو ابن الله أو ثالث ثلاثة ): عقيدة مقدسة عند المسلمين؟.<br />إنها عقيدة كافرة كما قال تعالى : (لَقَدْ كَفَرَ الَّذِينَ قَالُوا إِنَّ اللَّهَ هُوَ الْمَسِيحُ ابْنُ مَرْيَمَ)(المائدة: من الآية17) وقال تعالى : (لَقَدْ كَفَرَ الَّذِينَ قَالُوا إِنَّ اللَّهَ ثَالِثُ ثَلاثَةٍ)(المائدة: من الآية73) .<br />وهل نأخذ من قول المفتي : ( إنّ الإسلام يؤمن باحترام المقدسات الدينية دون تمييز ) :<br />أنّ الإسلام وهذه الديانات كلّها تقف على قدم المساوات سواء بسواء دون تمييز للإسلام على غيره ؟ فأين أنت أيّها الرجل من قول الله تعالى<br />هُوَ الَّذِي أَرْسَلَ رَسُولَهُ بِالْهُدَى وَدِينِ الْحَقِّ لِيُظْهِرَهُ عَلَى الدِّينِ كُلِّهِ وَلَوْ كَرِهَ الْمُشْرِكُونَ) (الصف:9)<br />فالهدى ودين الحق خاصّان بالإسلام ,والأديان الباطلة تختص بالباطل والغي والضلال .<br />ويجب أن يكون الإسلام هو العالي وهو الظاهر ,وكلمة الكفر هي السفلى وكلمة الله هي العليا .<br />ونقول لأهل الإسلام ما قاله الله تعالى : (وَلا تَهِنُوا وَلا تَحْزَنُوا وَأَنْتُمُ الأَعْلَوْنَ إِنْ كُنْتُمْ مُؤْمِنِينَ) (آل عمران:139)<br />إنّ الله ليأبى هذه المساواة وكذلك الإسلام والمسلمون قال تعالى : ( أفنجعل المسلمين كالمجرمين مالكم كيف تحكمون أم لكم كتاب فيه تدرسون ) .<br />فكيف يرضى الله والمؤمنون بالمساواة بين الإسلام دين الله الحق وبين الديانات الكافرة الباطلة ؟ فهل تستوي الظلمات والنور ؟ قال الله تعالى : ( وما يستوي الأعمى والبصير ولا الظلمات ولا النور ولا الظل ولا الحرور ) ، ( فاطر 19-20) .<br />2- قال المحرر : ( وأشار جمعة ( يعني المفتي ) ... إلى أهمّية توحيد الجهود الإسلامية المسيحية في مصر والعالم العربي ضد تيار الإلحاد في الغرب ,والذي يسخر بشدة من الأديان كافّة سواء المسيحية أو الإسلام أو حتى اليهودية من خلال أعمال درامية أو مقالات أو رسومات في الصحف وغيرها من وسائل التعبير ) .<br />أقول : وأنا أسأل المفتي عن توحيد الجهود الإسلامية المسيحية ...ضد تيار الإلحاد .<br />كيف يكون هذا التوحيد ؟ وكيف تُوحَّد هذه الجهود الإسلامية المسيحية ضد الإلحاد ؟<br />وأسأله ما هو موقفنا من جمعيات القساوسة التي تطعن في الإسلام ورسول الإسلام عليه الصلاة والسلام ؟!.<br />وما هو موقف هؤلاء المتوحدين من جمعيات التبشير والتنصير التي تنتشر في أرجاء العالم الإسلامي مشارقه ومغاربه - إلا ما شاء الله - ؟<br />ولعلَّ هؤلاء المنصّرين يبلغون الملايين ، وإذا سخر شخصٌ ملحد أو غير ملحد من أسطورة \"الصلب \" أيجب على المسلمين أن يتوحَّدوا مع الصَّليبيين فيهبُّ الجميع للدفاع عن هذه العقيدة ؟! .<br />وإذا طعن شخصٌ أو أشخاص أو صحفٌ في مظاهر الشرك في الكنائس أو طعن بحقٍ في عقيدة : \" أنَّ عيسى هو الله أو ابن الله أو ثالث ثلاثة \" فهل على المسلمين وعلمائهم أن يذبُّوا عن هذه العقائد الباطلة باسم المقدسات ؟! .<br />وهل يغضب النصارى إذا هاجم تيار الإلحاد الإسلام ونبي الإسلام ؟! وهل أنت متأكد أنَّ الصحف التي سخرت من رسول الله صلَّى الله عليه وسلَّم أنَّها صحف تيار الإلحاد الذي يسخر من الإسلام ونبيِّه وأنَّها تسخر من الديانة النصرانية ورموزها ؟!<br />أو أن هذه المقولة من ألاعيب النصارى خُدعتَ بها ، أما علمت أن كل الهيئات الحكومية في الدانمارك قد تضامنت - وهي نصرانية – مع الجريدة الساخرة من رسول الله صلَّى الله عليه وسلَّم ؟! وأن الرأي العام الدانماركي قد تفاعل مع هذه الجريدة وهم نصارى لا ملحدين كما يزعمون ؟! .<br />وهل اليهود مستعدون أن يُدافعوا عن الإسلام ونبي الإسلام ؟!<br />لا يمكن أيُّها الشيخ أن يفعلوا شيئاً من ذلك إلاَّ أن يتخلَّوا عن يهوديتهم قال تعالى : (لَتَجِدَنَّ أَشَدَّ النَّاسِ عَدَاوَةً لِلَّذِينَ آمَنُوا الْيَهُودَ وَالَّذِينَ أَشْرَكُوا وَلَتَجِدَنَّ أَقْرَبَهُمْ مَوَدَّةً لِلَّذِينَ آمَنُوا الَّذِينَ قَالُوا إِنَّا نَصَارَى)(المائدة: من الآية82) .<br />فالذين وصفهم الله بهذا الوصف كانوا على النصرانية ثم أسلموا كما يدلُّ عليه سياق القرآن ؛ وليس المراد النصارى المتعصبين لدينهم المعادين للإسلام .<br />أيُّها المُفتي : ألاَ ترى خطورة هذا الأسلوب على شباب المسلمين الذين يقدِّرونك ويعتبرونك من أئمة الإسلام الذين لا يقولون إلاَّ الحقَّ فيقعون في الإيمان بأخوة الأديان أو وحدة الأديان ؟!<br />ويزداد الأسى أنَّ هذا المنحى الذي سار عليه مُفتي مصر قد سار عليه كثير من المؤسسات والكُتَّاب في صحف المسلمين .<br />وفي هذا الاتجاه من الأخطار والأضرار الكبيرة ما لا يعلمه إلاَّ الله والفائدة من ورائه ضئيلة جداً إذا قيست بحجم الأضرار والمكاسب الكبيرة لأعداء الإسلام الذين لا يخسرون إلا الاعتذار إن حصل منهم ,وهو حبر على ورق كما يُقال .<br />فالواجب على المسلمين أن يتمسَّكوا بدينهم وأن يعضُّوا عليه بالنَّواجذ ومن عنده منهم انحراف في عقيدته أو منهجه فليعد إلى الحق فإنَّ هذا هو أكبر نصرٍ للإسلام وأعظم نكايةً وغيظاً لأعدائهم وطريق للمسلمين إلى استعادة عزِّهم ومجدهم ومهابتهم .<br />3- قال المفتي : \" إنَّ هذه الأخطاء شخصية ولا يجب أن تعمم على كل أوروبا والعالم الغربي \"<br />- أقول : وهذه النتيجة غنيمة كبيرة على الأقل لحكومة الدانمارك إن لم تكن غنيمة لأوروبا كلها والغرب كله .<br />هذه هي النتيجة التي تمخضَّت عنها رحلة مفتي مصر والوفد المرافق له أن يُبرِّئ أوروبا والغرب من مسؤولية أكبر جريمة تُرتكب تحت سمع وبصر حكومة الدانمارك والنرويج وتحت سمع وبصر الرأي العام في الدولتين ,رُغم صيحات المسلمين في أوروبا والعالم الإسلامي وتنديدهم بهذا العمل الإجرامي والهُتاف بالمؤسسات والهيئات الدينية والسياسية للقيام باستنكار هذه الجريمة فتُقابل إمَّا بالرفض عن الاعتذار وأنَّ هذا العمل إنَّما يُعبِّر عن حرية الرأي وإمَّا بالسكوت وعدم المبالاة من كل هذه الجهات .<br />وهل نسيت أيُّها الرجل ما قامت به منظمة نصرانية من تشويه صورة النبي صلَّى الله عليه وسلَّم ووصفه بأبشع الصفات وسعي هذه المنظمة بدون كلل لوقف انتشار الإسلام هذه المنظمة تُسمَّى بـ \" منظمة رابطة الرهبان لنشر الإنجيل \" وتُدعَّم بالأموال الطائلة من الفاتيكان وهي منظمة كبيرة يبلغ عدد الناشطين فيها المليون (!!) .<br />كيف تُبرِّئ ساحة أوروبا وأمثل من فيها يعملون هذه الأعمال وهل يُوافقك المسلمون على هذه التبرئة ووصف الجريمة بأنَّها شخصية ؟!<br />هذه هي ثمرة الجهود الإسلامية المسيحية (!) ومدِّ جسور التعاون مع أتباع الديانات أو أخوة الأديان !<br />إنَّ خسارة الإسلام والمسلمين كبيرة جدا في هذا التآخي والتعاون والمكاسب كبيرة لمن يُجيدون التلاعب بعقول المسلمين وعواطفهم العمياء .<br />فعلى المسلمين أن يتفطَّنوا لمكائد الأعداء التي ترمي إلى إخراجهم من دينهم . قال تعالى : (وَدَّ كَثِيرٌ مِنْ أَهْلِ الْكِتَابِ لَوْ يَرُدُّونَكُمْ مِنْ بَعْدِ إِيمَانِكُمْ كُفَّاراً حَسَداً مِنْ عِنْدِ أَنْفُسِهِمْ مِنْ بَعْدِ مَا تَبَيَّنَ لَهُمُ الْحَقُّ )(البقرة: من الآية109) .<br />وليعلم المسلمون وغيرهم أن الإسلام يكرم الأنبياء والرسل وما أنزل إليهم من كتب قال تعالى : ( آمن الرسول بما أنزل إليه من ربه والمؤمنون كل أمن بالله وملائكته وكتبه ورسله لا نفرق بين أحد من رسله ) الآية .<br />وقال تعالى : (قُولُوا آمَنَّا بِاللَّهِ وَمَا أُنْزِلَ إِلَيْنَا وَمَا أُنْزِلَ إِلَى إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَاقَ وَيَعْقُوبَ وَالأَسْبَاطِ وَمَا أُوتِيَ مُوسَى وَعِيسَى وَمَا أُوتِيَ النَّبِيُّونَ مِنْ رَبِّهِمْ لا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْهُمْ وَنَحْنُ لَهُ مُسْلِمُونَ) (البقرة:136)<br />فيؤمن المسلمون بهؤلاء الرسل ويجلونهم ويوقرونهم ويعتقدون أن من كذَّب رسولاً منهم فقد كذب الرسل جميعاً ومن انتقص واحداً منهم فقد انتقصهم جميعاً وأن من كفر بكتاب واحد فقد كفر بالكتب جميعاً .<br />هذا هو موقف الإسلام والمسلمين من الأنبياء والرسل عليهم الص<br />11/03/2006<br />اقرأ بقية التعليق .."
