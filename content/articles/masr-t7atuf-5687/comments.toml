author = "محمود المصرى"
posted = "2009-03-03"
text = "أرفع يدك عن مصائرنا شلت يدك<br />أرفع يدك عن مقدراتنا قطعت يدك<br />فاجر فاسق و من اين اكتسبت شرعيتك<br />قصير مكير حقير و ما اكثر ما تحوى بة جعبتك<br />تخلط الحق بالباطل و سم وراء ابتسامتك<br />تحتمى بوريث عرش لتخفى ورائه وقاحتك<br />تصول و تجول و ترقص فوق رفاتنا بمنتهى سفالتك<br />سيأتى يوما ينكشف فيه فساد مسيرتك<br />و سيكون يوم دعاء على كل من لعرض المصريين هتك<br />يوما لن تجد فيه حتى ورقه توت لتستر بها عورتك<br />أرفع يدك شلت يدك قطعت يدك"
archived = "2009-07-31"
capture_url = "https://web.archive.org/web/20090731122639/http://www.20at.com:80/masr/t7atuf/5687.html"

