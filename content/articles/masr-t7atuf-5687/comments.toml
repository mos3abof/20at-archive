author = "محمود المصرى"
posted = "2009-03-17"
text = "كشفت المخابرات العامه المصريه منذ عده سنوات عن ملحمه بطوليه كان بطلها البطل المصرى رفعت الجمال الشهير برأفت الهجان و قام بالمعالجه الدراميه الكاتب المتميز الاستاذ صالح مرسى و عندما تم عرض المسلسل قامت الدنيا و لم تقعد و خصوصا فى مصر و اسرائيل،،، فى مصر قامت الدنيا اعجابا ببطلها الذى خدع الجميع لسنوات عديده ووصل الى اعلى المناصب فقد كان الرجل صديقا شخصيا لمؤسسه الرئاسه الاسرائيليه بل و لقد وصل الامر الى ان تطلب منه الحكومه الاسرائيليه ترشيح نفسه فى انتخابات الكنيست بل و ضمنت له الفوز الا ان هذا الامر قوبل بالرفض من جهاز المخابرات المصريه،،، اما فى اسرائيل فقد قامت الدنيا بسبب المفاجأة الغير متوقعه و من قسوه الخدعه و راحت تنشر الاشاعات بانه كان عميل مزدوج و ذلك حفاظا على ماء وجهها امام العالم و لكن هيهات ان يصدق احد هذا الهراء فصمتت اسرائيل و لكنها صممت على الانتقام و رد الصاع صاعين بل و بنفس الطريقه و من هنا بدأ زرع المهندس القزم !!! نعم فان جذوره اليهوديه و ما توفرة له من خصائص حقيرة ناهيك عن ميوله التدميريه و التى نبعت عن مرض نفسى جعله يكرة كل ما يتحرك على وجه الارض لكونه ولد قزما جعلت منه الاختيار الامثل و تم تزويده بالمال و زرعه بجانب جمال مبارك و نجح الموساد نعم نجحوا فى زرع الرجل و اصبح من صانعى القرار فى مصر بل لقد اصبح هو صاحب القرار الاوحد و بدأ المخطط صدقونى يا سادة اننا امام عمليه كبيرة جدا و خطيره جدا جدا جدا من عمليات الموساد الناجحه نجاح منقطع النظير الى الان فالرجل وراء جميع القرارات و القوانين الاخيره و التى تسببت فى الاضرابات و المظاهرات و المصائب التى حلت بمصر فى الاونه الاخيره و لكم ان تتخيلوا مدى النجاح الذى يمكن ان يحققه الموساد لو ان جمال مبارك تولى حكم مصر بعد والده فان من الطبيعى ان يكون هذا القزم المكير نائبا له و هذا بديهيا حيث انه يلعب هذا الدور منذ زمن و تحديدا منذ 2004 و لو حدث لا قدر الله اى حادث لجمال ميارك فسيقفز هذا القزم على حكم مصر !!! و يصبح رجل الموساد الاول فى مصر هو رئيس مصر !!! هذا هو المخطط هذا هو الرد العملى على خدعه المخابرات المصريه للموساد من خلال رجلها رافت الهجان !! أريد أن أصرخ أريد ان يسمعنى أحد أقسم بالله انها الحقيقه يا ساده فهل من مجيب ؟؟؟"
archived = "2009-07-31"
