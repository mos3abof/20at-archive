[[comments]]
order = 1
subject = "واحد راح الساقية"
text = "\"ساقية الصاوي.. ساقية الصاوي.. لازن تروح ساقية الصاوي..\" هكذا كان يلح علي الكثير من أدصقائي، فلا أحد يراني إلا ويقول لي: كيف تعمل في مجال الإعلام، ولم تذهب بعد لساقية الصاوي..<br />حتى جاءت اللحظة، فقد أعتذر أحد زملائي عن حضور مهرجان السينما المستقلة الذي أقيم بالساقية، وتم تكليفي بمهمة تغطية المهرجان صحفياً..<br />وعلى ما عكس ما كتب الزميل العزيز محمود الزاهي عن الانبهار بشكل ومدخل الساقية، لا أعلم لماذا انقبض قلبي عند الدخول، فعقلي رسم لي عنها صورة غير إيجابية قبل الدخول..<br />ولم تفت دقيقتان إلا وأصبح انقباض القلب، انقباض فكر وعقل وعين أيضاً.. فقد بدأ المهرجان بعرض فيلم لبناني - من خارج المهرجان والمسابقة ومن خارج مصر أيضاً- وقصة الفيلم عن مصور فوتوغرافي عجوز يحكي ذكرياته عن أستوديو كان متخصصا في التقاط الصور غير اللائقة والخارجة..<br />وظل الفيلم يعرض هذه الصور لمدة عشر دقائق تقريباً وبكل بجاحة أدت إلى سخط الجمهور.. وسخطي بالطبع، وحينها \"شغلت موتور نظرية المؤامرة\"، واستنتجت أن هدف وزارة الثقافة هو إشاعة الإباحية في كل مكان من شأنه أن يجذب الناس..<br />وعندها قررت : مش هاغطي المؤتمر.. ومش هاخش الساقية تاني.."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040712/http://www.20at.com:80/article.php?sid=581"

