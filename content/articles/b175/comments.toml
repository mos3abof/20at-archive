[[comments]]
order = 1
subject = "عام القتل ةالاعتداء"
author = "مروة"
posted = "2005-12-31"
text = "مع السلامه 2005 بقتل المصريين والسودانيين وده الخبر الظازة اللي يكمن مل لحقتيش تعرفيه يا دعاء وهو قتل اكثر من 30 من اخواننا السودانيين بامر من الوزير ابن ال...اللي قاعد على قلبنا في الوزارة الجديدة و عمل كده بعد الاعتداء على الصحفيات والقتل في الانتخابات والتزوير وكانه بيطلع لنا لسانه ويقول موتوا بغيظكم...وربنا ع الظالم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151105/http://www.20at.com/article2.php?sid=175"

