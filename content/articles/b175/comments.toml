author = "مسلم"
posted = "2006-01-01"
text = "بدلا من أن نتمنى الاحسن ، فلنصنع الاحسن ، واعلموا يا شباب الاسلام أن الشباب هم صناع الاحداث ، فلنصنع التاريخ بايدينا.<br />ولنبدأ بكسر حاجز الخوف من الظلمة ، والسعى لاجتثاثهم ، ثم اقامة دولة الشريعة التى يتفيأ ظلالها كل مسلم"
