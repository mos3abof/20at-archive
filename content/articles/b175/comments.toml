posted = "2006-01-05"
text = "يا رب السنه دى بقى تبقى اخف على قلبنا....<br />السنه الى فاتت دى كانت عصيييبه بجد<br />اهم حدث فيها بالنسبه ليا...انى حولت من كلية طب لكلية اعلام...<br />اهم و احلى حدث السنه الى فاتت دى.<br />يا رب السنه الى جايه دى بقى تكون احلى و ربنا يا رب ينولنى الى فى بالى"
archived = "2006-11-02"
