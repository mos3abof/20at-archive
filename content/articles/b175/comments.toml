[[comments]]
order = 8
subject = "هى كلمه و قالها الابنودى"
author = "نيفين"
posted = "2006-01-01"
text = "اولا يا هند بوصفى فتاه عربيه بقوللك bonne nouvelle annee<br />ثانيا اكيد يا خماعه كل سنه فيها الكويس و الوحش من الكويس طبعا ان الناس فعلا بقت مبتخفش و بتقول صوتها صحيح مفيش كتير بينغير بس دا ف حد زاته كويس و من الوحش ف 2005 ان مسلسل الصمت العربى ما زال يعرض كل يوم و يحقق نجاح منقطع النظير<br />و هى كلمه قالها الابنودى من زمان بتلخص الوضع السياسى<br />كدابه يا 48<br />كدابه يا 67<br />يا فلسطين يسقط كل الكذب العربى<br />خلونا نتمنى الاحسن ف 2006 و ياريت شويه تفاؤل يا جماعه و هعلى راى سعاد حسنى فبدال ما نطق يا وله لأ نضحك<br />كل سنه و انتو طيبين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151105/http://www.20at.com/article2.php?sid=175"

