[[comments]]
order = 5
subject = "عام جديد وعلى عملك شهيد"
author = "مصطفى مخلوف"
posted = "2005-12-31"
text = "السلام عليكم<br />بعد سويعات قليله سوف يمر عام بافراحه واحزانهبانجازاته وبنكساته ، واعتقد اننا يجب علينا أن نقف وقفة مع أنفسنا كل منا يحاسب نفسه ، هل حققنا ما نريد؟؟ هل حددنا أهدافامن الاساس ؟ كل تلك الاسئلة يجب ان نمر بها.<br />اصدقائى الاعزاء<br />هذا عام جديد وعلى عملكم شهيد<br />فيجب ان نحيا بطاعة الله .<br />فاقضيه فى حب الله<br />ثم حب الوطن<br />ثم حب والديك<br />ثم حب اسرتك<br />مصطفى مخلوف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151105/http://www.20at.com/article2.php?sid=175"

