text = "المومضوع بجد ممتاز جدا جدا يا عشرينات برافو عليكو ، بس فيه خبر مهم مش موجود هو حبس ايمن نور لان ده اكبر دليل على الحرية المزيفه اللي بينادي بيها ريسنا الي هايفضل راكب على طول ودلدل رجليه بس هو مين اللي عامل الاخراج؟ فعلا ده فنان"
archived = "2006-11-02"
