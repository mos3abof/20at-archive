posted = "2006-06-27"
text = "انتو مشواخدين بالكو ولا ايه كل حاجه بقت واضحه (البيت بيتك) و(نورت مصر ) وجيبين شويت ممثلات هما رمز الفساد فى الوطن العربى كله يعنى تعالى وهنمتعك حريم وخمره والى انت عايزه<br />الله يخدهم ويريحنا منهم ويزقنا بحاكم يتقى ربنا"
archived = "2006-06-28"
