[[comments]]
order = 0
subject = "الشئ لزوم الشئ"
author = "براحتي"
posted = "2006-06-25"
text = "سوسة المفروسة<br />معلش يعني معلش ..موضوع زيارة الاثار ده ممكن ترويجه للسياح الاجانب فقط ..اما السياح العرب فبييجوا مصر لاهداف تانيه خااااااااالص (يتهيالي مفهومه) ...حتى الحمله اللي قبل دي واللي كان اسمها ( ابتسامة مصر كالهاش مثيل)(بتاعة البنات بالميوهات البكيني) و اللي اعترض عليها الجميع كانت في راي ناس كتير جدا اصدق حمله و مناسبه للوضع الراهن حتى ان احد كتاب جريدة الاهرام الغراء(على راي عمرو اديب) كتب في عموده الاسبوعي (طب كنت كتبت العناوين مع الاغلان ماهو الشئ لزوم الشئ) ....انا ما بعممش عشان محدش يتشنج.<br />http://ghadaabdo.jeeran.com"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628195404/http://masr.20at.com:80/article.php?sid=567"

[[comments]]
order = 1
subject = "قبل الحملة الأعلانية"
author = "مواطن مصرى مقهور"
posted = "2006-06-26"
text = "لابد الأهتمام بالشوارع والطرق والمطاعم قبل الحملة الأعلانية وهنا سوف اضرب مثل بطريق هام جدا \" طريق سفاجا القاهرة \" طريق سيئ جدا ولاتوجد به خدمات مثل \" مطاعم - محطات بنزين - اسعاف - شرطةامن طرق - تليفون \" والطريق غير مطابق للمواصفات الدولية ويستخدمه كثير من العرب عن القدوم الى مصر بسياراتهم ولكنه للاسف الشديد سيئ جدا<br />وعندنا لايتم عمل شئ او الأهتمام بشئ الا اذا كانت هناك مصلحة من وراء ذلك للمسئول."
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628195404/http://masr.20at.com:80/article.php?sid=567"

[[comments]]
order = 2
subject = "لك الله يا مصر"
author = "مصرى دمه محروق"
posted = "2006-06-26"
text = "أولا ياشباب ياريت محدش يكتب كلام خارج علشان فى إخواتنا البنات بشوفو الموقع دا.<br />عموما خلينا فى موضوعنا.أنا بس عايز أقول معلومه صغيره تعرفوا أن فى قريه فى محافظه الشرقيه تابعه لمركز بلبيس إسمهاقريه سعوده القريه دا مشهوره بلإسم دا علشان الرجاله (ياريتهم كانوافعلا رجاله) بيجوزوا بناتهم للسعوديين وتكون فترة الجواز لا تتعدى شهر بعد ذلك تطلق وتاخد مبلغ محترم وطبعا العيله بتتظبط برده دا بيحصل فى الريف المصرى مابلكم من الى بيحصل فى المدينه و لعلم سيادتكم مصر سمعتها فى جميع الدول العربيه إنها بلد الزناه ولو واحد عربى عايز يتصرمح يروح لمصر هيلاقى الخير كتير وناس بتقوله نورت مصر. لك الله يامصر ياشباب ياريت نغير ما بأنفسنا لعل الله يرحمنا و يصلح حالنا"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628195404/http://masr.20at.com:80/article.php?sid=567"

