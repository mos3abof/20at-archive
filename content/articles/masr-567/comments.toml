[[comments]]
order = 4
subject = "إبراهيم عيسي .... شرف المصريين .... اللي جاي عليه الدور"
author = "محمد السيد"
posted = "2006-06-26"
text = "واستمرارا ..... لمهزلة التمديد ... والتوريث ... وعدم التعديل ......<br />الحكم بسجن إبراهيم عيسى رئيس تحرير صحيفة \"الدستور\" المصرية لمدة عام بتهمة سب الرئيس...<br />طيب .ماهو في 70 مليون مصري بيسبوا اللي اسمه إيه ؟؟؟ حيتسجنوا فين دول ؟؟؟<br />وعمار عليكي ... يا مصر ...<br />و برضه ... مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628195404/http://masr.20at.com:80/article.php?sid=567"

[[comments]]
order = 5
subject = "و لماذا نلعب دور القوّاد؟"
author = "زمان الوصل"
posted = "2006-06-26"
text = "مبدئيا لا اعتقد ان الترويج للسياحه ينبغى ان يكون مقادا driven by برغبات السائح بما فيها الغير مشروع منها !!<br />و كمثال على ذلك اعلان ماليزيا للترويج السياحى .. فهو اعلان -بالمقاييس التى نتخيلها للسائح العربى- غير جذّاب اطلاقا .. لكن هل تخسر ماليزيا من فقدان مثل هذه النوعيه من السياحه؟ لا اعتقد .. خاصة و انى اظن ان حتى هذه الفئه من السيّاح يمكن اجبارها على التكيّف مع ما يرضاه او لا يرضاه المجتمع الذى تزوره<br />حين يأتى \"ضيف\" الى منزلى من حقه ان يتوقّع ان اقدم له افضل ما عندى .. المهم يكون \"عندى\" .. لكن لا يحق له ان يتوقّع ان اشحت من الجيران ما ليس لى حتى يرضى و يتكرّم بالزياره !! و حتى مع التسليم جدلا ان السائح العربى يتوقّع شئ لا نحب ان نقدمه ما الذى يجبرنا ان نلعب دور القوّاد !!"
archived = "2006-06-28"
capture_url = "https://web.archive.org/web/20060628195404/http://masr.20at.com:80/article.php?sid=567"

