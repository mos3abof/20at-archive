[[comments]]
order = 1
subject = "بارك الله فيك شيخنا"
author = "المسلمة"
posted = "2007-01-25"
text = "أولا بارك الله فيك شيخنا الفاضل أبا اسلام<br />حقيقة لا أعلم ما الذي يجعل عقل هؤلاء البشر الذين يحاربون القناة هل تلك عقول أم شوربة خضار<br />كيف لأحد أن يكون عدوا لقناة تدافع عن النبي<br />بارك الله في القناة وجعلها زخرا للاسلام"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127114806/http://masr.20at.com:80/article.php?sid=1242"
