[[comments]]
order = 0
subject = "مستحيل"
author = "حلوة هي \"تحديد موعد متوسط للاذان\""
posted = "2006-10-12"
text = "غالبا من اول رمضان لاخر رمضان بتفرق بالمتوسط نص ساعة فكيف بدها تزبط معهم؟<br />و الله غريبة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124310/http://www.20at.com/article2.php?sid=1343"

[[comments]]
order = 1
subject = "اللهم إعفو عنا"
author = "و الله المسلمين غير العرب عانوا الامرين فى هذه الدنيا"
posted = "2006-10-12"
text = "و نحن العرب المسلمين سنسأل عنهم كما سيسألون عن أنفسهم<br />6 مساجد بس أمال راحت فين ملايين العرب و أنشطة الدعوة<br />علشان كدة مش غريبة تكون دول أفريقية فى ستينات القرن الماضى زات أغلبية مسلمة الان عدد النصارى بها يقارب 50% او اكثر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124310/http://www.20at.com/article2.php?sid=1343"
