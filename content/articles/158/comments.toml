[[comments]]
order = 4
subject = "من أشرف إلى سامي الفلسطيني"
text = "السلام عليكم و رحمة الله و بركاته<br />أخي بارك الله فيك وفي علمك,وزادك بسطة في العلم<br />بحق والله أن ردك يثلج الصدور على المنافق وائل.<br />ياسيد وائل لو المرجلة بالكلام بس لكنا إحتلينا أمريكا من زمان ولا إحتلينا العالم كله.<br />مرجلتك في العرب تايمز على غيرك من الناس و العلماء و الحكام,طبعا مش بعيد خالص عن قانون سيدك صاحب الموقع الهابط , و إن كان رب البيت بالدف ضارب ..........!<br />الكتاب الهايف اللي بتباع في الأتوبيسات ده لو كان كتبه شيخنا الشعراوي لكان من أعظم الكتب.<br />أنا لا أنقص بمقامة الشيخ الشعراوي أسكنه الله فسيح جناته.<br />لكن مين هوه الشعراوي؟؟؟ ممكن تسأل نفسك و تشغل مخك المصدي !!!<br />الشعراوي رجل آمن بالله و صدق برسالة سيدنا محمد و أتبع الأمر الذي أمرنا به الرسول عليه الصلاة و السلام.<br />وهوه متل بقية الشيوخ في العالم كان وهابي ولا غيره.<br />بس الناس المصدية المتصددة لتشويه الإسلام عاوزة ترفع من شأن عالم و تحبط من شأن آخر.<br />كأنه الدين أمر عادي ممكن أخذ الأصل و أزيدعليه و اديله شوية بهارات و خلاص بقه على كده. ده دين وهابي و ده شعراوي و ده دين أمريكاني ملتزم و ده دين وائلي مشلتت و ده عباسي مقفل و غيره.<br />الرسول عليه الصلاة والسلام منع المدح في شخصه الكريم. وقال بمعنى الحديث ( لاتطروني كما أطرت النصارى عيسى بن مريم)<br />وده رسول نهانا عن تعظيم الناس ومدحهم زيادة عن اللزوم. فلان كويس ..آه ده بتاع ربنا و ربنا يزيده , خلاص أما ماتتكلمش عن فلان ده حبيبي لأنه من بلدي و ده مش كويس لأنه مش من بلدي ولا حتى مش من حتتي.<br />إتقي الله في نفسك ولاتثير الفتنة و التفرقة بين الناس.<br />أسأل الله الكريم رب العرش العظيم الذي أمره بين الكاف والنون أن يهديك إلى الصراط المستقيم أو أن يكشف سترك أمام المسلمين و يكويك بنار جهنم يوم يبعثون.<br />آسف على الإطاله إخوتي<br />السلام عليكم و رحمة الله و بركاته<br />نوته صغنونة عالهامش :<br />أستغرب موقف الشباب من الأغاني , بصراحه أول مرة أسمع حاجه إسمها أغاني دينية و أغاني هادفه وأغاني ملتزمة.. ياعيني على الإلتزام. يا إخوان مهما إختلفت التسميات وحتى لو كان نية الواحد وهو بيسمع الغناء إنه هيخلص لله برضه ده إسمها أغاني. طيب سؤال للي بيسمعوا أغاني بالله عليكم تعرف تصلي من غير ماتردد بعض كلمات الأغاني في صلاتك, ماتقوليش إنك بتتحكم في نفسك ,أتحدى إنك تمنعها, ياعم مش ممكن يجتمع خبيث وطيب في قلب المؤمن... أنا بقول مؤمن والإيمان بالله و ملائكته و رسله و كتبه و باليوم الآخر وده من شروط الإيمان,, مش بس مسلم بالإسم و اللي تعريفه من سلم المسلمون من لسانه و يده بس. أما الإيمان فده بعيد عنه شوية.<br />الله يستر علينا و عليكم و يهدينا إلى صراطه المستقيم<br />معليش ده كانت نوته صغنطوطه أوي :)<br />سبحان الله و بحمده... سبحان الله العظيم<br />كفارة المجلس:<br />سبحانك اللهم و بحمدك.. أشهد أن لا إله إلا أنت .. أستغفرك و أتوب إليك"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018091759/http://www.20at.com:80/article.php?sid=528"

