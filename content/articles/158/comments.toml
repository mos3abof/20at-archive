[[comments]]
order = 0
subject = "يارب"
text = "عاوزر أموت لما يكون في الموت خير ليا..و دي حاجة انا معرفهاش...يعني الموضوع كبير قوي ..و الواحد مش ضامن ولا حاجة...يعني...الاخلاص والتقوى والحسابات صعبة وفوق تفكيرنا..واحنا ما بين العدل والرحمة و المغفرة..مستحيل نحسبها<br />..ربنا يستر علينا ويمد في عمرنا لو كان في ده خير لينا..ويردنا إليه لو كان ده هو الخير.<br />اللهم ارحمنا جميعا...و ارزقنا فعل كل ما يرضيك عنا و يقربنا منك."
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813201452/http://www.20at.com:80/article.php?sid=528"

[[comments]]
order = 1
subject = "ابن موت"
text = "كل يوم بالليل قبل ما أنام أحس أني هموت<br />بقوم أتوضأ وأصلي الوتر وأقول سيد الاستغفار(اللهم أنت ربي) أكلم ربنا شوية أني معلهش اني قصرت في حقك وانك كريم يا رب وهتغفر لي وأني واثق في كدة ومش قلقان وأسلم على رسول الله صلي الله عليه وسلم ...<br />والصبح وانا رايح الشغل بسلم على مراتي وابني وأبوسه وابص عليه كأني آخر مرة هشوفه وانا بقفل باب البيت بحس اني آخر مرة هشوف المكان ده ... على طول بقول بسم الله توكلت على الله ولا حول ولا قوة إلا بالله اللهم إني أعوذ بك أن أضل أو أضل... وبتحرك في الدنيا .. والحمد لله مبسوط من الشعور ده لأني دايما لما الشيطان يوزني أعمل حاجة غلط بقول ايوة يا بطل ولو مت وانت في الموقف ده هتقول لربنا ايه؟ ... الحمد لله على كل حال..<br />اللهم إني أعوذ بك أن أغشى فجورا<br />أو ان أقول زورا<br />أو أن أكون بك مغرورا"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813201452/http://www.20at.com:80/article.php?sid=528"

