[[comments]]
order = 0
subject = "اقتراح عبيط"
author = "زعبلة السادس عشر"
posted = "2007-02-16"
text = "اقتراح عبيط جدا<br />اعفاء سيارات السادة موافقين وبتوع التصفيق الحار لعبدة خرابة من الجمارك دة بيحمل رائحة الرشوة علشان يصقفوا بحرارة اكتر ويوافقوا على المغمض<br />ثم انة فين المساواة بين المواطنين اللى بيتغنوا بيها<br />والا هو كلام مدهون بذبدة يطلع علية النهار يسيح<br />ياعم خليك فى جرايد الحزب الوطنى الهط زى مانت عايز وخلوها تخسر مليارات والكلام الخايب اللى بتكتبوة ماعدش حد بيقراة<br />وسيبنا فى حالنا<br />اللة يسترها معانا"
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222083243/http://masr.20at.com:80/article.php?sid=1597"

[[comments]]
order = 1
subject = "الله يرحم"
author = "ايمن امام"
posted = "2007-02-16"
text = "ياسيدى العزيز -هذا الحق ان كان حقا فهو لرؤساء تحرير الصحف فقط- والله يرحم صدام حسين لما عمل رشه جريئه على رؤساء تحرير الصحف القوميه الميه ميه - متهيألى انك ساعتها- كنت فى اخبار اليوم - قبل ان نأذن لك بالرحيل- مع اننا لم نأذن لك بالهبوط على الجريده لكى نأذن لك بالرحيل- فقد اعطيت من لايملك مالايملك= المهم فاكر الايام دى ولانسيتها يااستاذ الاساتيذ- ان كنت ناسى افكرك وياما فى الجراب يامحامى - فاكر الامتيازات التى كنت تحصل عليها = ياترى حجم ثروتك كام = وبماذا افدت مصر = فاكر كونك الصحفى الوحيد تقريبا الذى تخصص فى سب الحكام العرب وبالذات المرحوم يلسر عرفات= مع انى لاازكر اننى قرأت لك مقاله واحده تعتب فيها على شارون او امريكا = فاكر الدور الذى لعبته فى اضفاء الشرعيه على تشميع حزب العمل - ساعتها كتبت مقاله قيها شماته واستهزاء- بل ارفقت مع المقاله صوره رجل يكنس الشارع - فاكر المقاله دى ولانسيتها- فاكر الدور الذى لعبته وشاركك فيه الفنان الذى لم ينجح سوى فى عملين اثين طوال عمره = فيلم القاهره ثلاثين وفيلم القاهره الفين الخاص باغلاق حزب العمل= الغريب اننى ارى هذا الشىء يتمسح بالمؤتمرات والندوات ويدعى الوطنيه والفداء= ياعم ابراهيم كفايه عليك اللى عماته فينا عشرين سنه وياريت تفتكر ان زاكره الشعوب ليست كما تزعمون ضعيفه وتنسى بسرعه = فقريبا سيصدر كتاب باسم ( رجال اضاعوا مصر) وستكون انت من اوائل هؤلاء الرجال- انا لااستغل هذه المساحه فى الاعلان عن شىء ولكننى اتصور ان يصدر هذا الكتاب فى يوم من الايام على يد احد الرجال العظام الموجودين يالصحلفه المصريه- وان هذا الكتاب سيوضع فى كل بيت مصرى - ليراجع نسب كل من يتقدم للزواج من ابنائها -فما على ولى الامر سوى مراجه الاسم ليعرف اصل نطفه هذا المتقدم لخ<br />اقرأ بقية التعليق .."
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222083243/http://masr.20at.com:80/article.php?sid=1597"

[[comments]]
order = 2
subject = "يعني هيه ناقصه"
author = "اشرف"
posted = "2007-02-18"
text = "يعني يا ابراهيم ياسعده بذمتك الساده الاعضاء ناقصهم امتيازات اكتر من اللي همه واخدينها ولا الموضوع اطعم الفم تستحي العين<br />دا احنا بنشوفوا العجب في الانتحابات من الساده المرشحين الشتيمه وضرب النار وضرب الجذم كل ده ليه بذمتك عشان يخدموا الشعب ده ولا علشان يحصلواالحصانه وعلي<br />هذه الامتيازات ويركبوا ام الشعب<br />طيب الغوا اي امتيازات فيها فلوس ومصالح يمكن ان يحققهاالاعضاء وشوفوا كام واحد هيستني في مجلس الشعب والشوري ولا كام واحد هيترشح اصلا<br />ياعالم حرام عليكوا والله فيه ناس غلابه ماهي لاقيه تاكل وناس مريضه مامعاها حق الدواء<br />وواحد زيك لما يتعب شويه يطلعوه يتعالج بره ؟؟علي حساب مين<br />علي حساب دين ام الشعب ودم الغلابه<br />حسبي الله ونعم الوكيل"
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222083243/http://masr.20at.com:80/article.php?sid=1597"

[[comments]]
order = 3
subject = "الشنطه"
author = "سمير المصرى"
posted = "2007-02-18"
text = "يا استاذ سعده ..اللى احنا عرفينه تمام التمام ان المرشح _ مش من الانف _ لا المترشح على عينه وعين اهله لمجلس فتحى بيك غندور الا مش برضه فتحى بيك هو صاحب المجلس ولا ماجرة قانون جديد.. مش مشكله كلهم بيترشحوووو علشان الشنطه فقط لا غير<br />حد خبيث يسال ايه اللى فى الشنطه اقوله مش عارف اسال اللى شيلها لو تقدر"
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222083243/http://masr.20at.com:80/article.php?sid=1597"

[[comments]]
order = 4
subject = "سيارة النائب تخدم الشعب"
author = "سيارة النائب تخدم الشعب هذا هو السؤال؟"
posted = "2007-02-20"
text = "وسيارة الشعب تخدم صاحبها ؟<br />مع العلم ان النائب لن يرضى باى سياره يقودها اى فرد من الشعب والا لم يكن لوافق بهذا القرار<br />فالاعضاء وافقوا على هذا القرار لصمصلحتهم الشخصيه واين الشعب اللذى هم ممثلوه<br />مصالح شخصيه فهل النائب لو كان الشعب لم يختاره ما كان ليصل ليكون نائب ههههههههههههههههه هل لو كان من الشعب هل كان بيوافق على هذا القرار<br />الله يهديكم فلوسكم كده حرااااااااام<br />لعل الله يحرقها بكم جزاء لما تفعلوا بنا<br />حل يرضى جميع الاطراف"
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222083243/http://masr.20at.com:80/article.php?sid=1597"

