text = "هما يدوا كل نائب جزمتين .<br />بس مش جزمتين يلبسهم لا جزمتين على دماغه<br />الله يحرقك يا ابراهيم سعده انت والساده اعضاء المجلس دول مش اعضاء مجلس دول لمؤاخذه ( اعضاء تناسلية )"
