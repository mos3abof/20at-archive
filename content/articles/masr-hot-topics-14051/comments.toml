order = 14
subject = ""
author = "admiralvega"
posted = "2009-11-17"
text = "اولا لأن ربنا ميرضاش بالظلم ولا الكبرياء بتاع (المتفرنسين)<br />ثانيا لو اخدو بالكم لاعب الجزائر لموشيه مدعي الاصابه ف راسه هو السبب في خساره الجزائر!! اسألوني ليه .. لما طلع عرضيه عيد براسه مخدش باله ان دفاعه لعب على الاوفسيد تراب وطلعو كلهم قدام لما معوض جه يرفع الكوره ، وفضل واقف! فبوظ مصيده التسلل ومتعب ربنا يحفظوووو اخد باله ورجع وحط الكوره (زي الكتاب ما بيقول)<br />ثالثا حرام عليكم يا ناس حسن شحاته مش بيفكر؟ مش كان ف الشوط الاول بيلعب على الكور المتسقطة والشوط التاني نزل عيد وبقي يلعب عالاجناب اكتر؟؟ وهنا نفعت بدليل الجون والكوره اللي شالوها من على خط الجون ،، وهنا برضو نفع بدليل الهجمات الكتيييييييييير اللي عدو بيها معوض والمحمدي وعيد<br />رابعا السؤال عن اللياقه لا معنى له لأننا لأخر ثانيه بنجري وبنروح وبنيجي وهما محدش فيهم بيزيد في الهجمه غير اتنين بالكتير ومش بيلحقو يرجعو ، عشان كده ملهومش غير كوره واحده خطر طول المتش وبخطأ دفاعي ساذج مش من فكاكتهم<br />خامسا،، كفايا مجلكوش صداع منى؟؟"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073754/http://www.20at.com:80/masr/hot-topics/14051-2009-11-15-12-40-31.html"
