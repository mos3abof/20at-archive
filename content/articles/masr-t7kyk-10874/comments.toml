author = "محمد جمال الدين"
posted = "2009-01-17"
text = "أنا اول ا شفت اللوحات دى افتكرت حاجة واحدة بس<br />وهى الشعوذة و الدجل و السحر<br />وده علشان الحروف الى مش مفهومة الى حاولت كذا مرة انى اكون كلمة ما مهما كانت مالهاش لازمة لكن للاسف فشلت .. واحسن تعليق ممكن يتحط تحت الصورة … صباح الشعوذة<br />واللوحات دى من زمان فى دول الخليج كلها .. بس احنا جينا متأخرين شوية .. كالعادة<br />وعلى رأى بشار الاسد … نصل متأخرين خيراً من ألا نصل أبداً<br />ههههههههههههههه هههههههههه"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718134656/http://www.20at.com:80/masr/t7kyk/10874.html"

