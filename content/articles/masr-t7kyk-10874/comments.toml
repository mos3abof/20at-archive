posted = "2009-01-24"
text = "منتهى التخلف و الجهل و فراغ العقول<br />اذا كان عسكرى المرور جاهل و لا يعرف القرائة؟<br />فكيف تطلبون منة ان يقراء لوحة السيارة المخلفة يا حيوانات؟<br />كيف يميز هذا العسكرى الجاهل جندى المرور عديم التعليم بين حرف (ع) و حرف ال(غ)<br />و بين حرف ال(ف) و بين حرف ال(ق)<br />و ال(س) و ال(ش)<br />تحياتى للعباقرة بشوات مصر و ملوكها ضباط الشرطة اسياد البلد و حكامها الاصليين"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718134656/http://www.20at.com:80/masr/t7kyk/10874.html"

