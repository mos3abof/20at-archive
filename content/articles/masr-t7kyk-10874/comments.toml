posted = "2009-07-29"
text = "اعتقد ان التقدم فى سرعة انجاذ العمل مش فى جمع المال يارت مسئول يرخص سيارتة بنفسة علشاتن بعد كدة يعرف ميين التطور فى الادارة ولة فى الشكل فى النظام العقيم وله فى اللوحة وعلى كلا مش فرقة لانها مش ب100 جنية دى 150 جنية وعشرين جنية تركيب وان كان عجبك من بعد طبور تتعرف فيه على اعدائك وتحبهم<br />اقصد التطور العلمى والفكرى والاجائى افضل من الريحة على الهدوم"
