text = "من العادات الغريبة التى كنت أحرص عليها لما كنت فى مصر وحتى لما انزل أجازات هي قراءت الحكم والمواعظ المكتوبة على العربيات اللى فى الشارع من أول عربية الفول اللى فى الميدان الى النقل اللى بيحمل طوب وزلط ، ومنها :<br />1- العين صابتني ورب العرش نجاني.<br />2- سولار فى التنك ولا فلوس فى البنك.<br />3- طريق السلامه يا أبو أشرف ، ودى جملة قرأتها كتير جداً على الميكروباصات ومش عارف هو أى سواق بيطلع رخصة سوائقة ميكروباص لازم من الشروط والمتطلبات أنه يبقى أسمه أبو أشرف ؟ أرجو الأفادة من الأسطى شعنونة.<br />4- يا تعدي يا تهدي.<br />5- take care i'm from Upper egypt … يعنى فتوة أنت مثلاُ ولا أيه.<br />6- أما أطرف التعليقات واللى مت على نفسي من الضحك لما قرأتها … \" يا ناس سيبوني أسدد ديوني وبعدين أحسدوني \" وتخيلت منظر الحاسدين وهما رايحين للأسطى كل يوم يسألوه خلصت تسديد الديون ولا لسه ، خلص بأه عايزين نشتغل .<br />7- الحلوه دى جايبها بخلع الضرس.<br />8- دى عليها أقساط يا جدعان.<br />9- يا ناس يا شر كفاية قر.<br />10- don't kiss me ، ودى مش معناها اللى أحنا عارفينه ولكن يقصدوا بيها ماتلزقش فى عربيتي .<br />1- إن خلص الفول أنا مش مسئول .<br />2- إن خلصت البليلة ما باليد حيلة.<br />3- ما خطرتش على بالك يوم تفطر عندي ،،،،، الله يا ست.<br />وبالنسة لعربيات السمين ( ودى أكله كده من ضمنها الممبار والفشة والكلاوي .. وبصراحة منظرها وهى متعلقه على العربيات الخشب فى الشوارع والميادين يخلي الواحد يشعر بالغثيان … يعععععععععع )<br />1- كُل سمين زين واقرأ الفاتحة للحسين.<br />2- كُل سمين وأضرب التخين.<br />وكلنا عارفين محلات العصير وشعارها أيه :<br />\" وسقاهم ربهم شراباً طهورا \"<br />ماتبصش كده يا عبيط… ده جايه بالتقسيط<br />هي جت كده واللي عنده كلمة يلمها<br />كلمة الله آيه ولكل ظالم نهاية<br />يا ناس يا عسل أبو حنفي وصل (حمدلله ع السلامة)<br />طريق السلامة يا شربات<br />الحلوة الأمورة جاية من المنصورة<br />سوقوا بالراحة يا بهايم عشان سواق العربية نايم<br />تعمل حسابى اقدرك … تهزر معايا اعورك<br />ما تبحلقش كدة يالوح…دى جت بطلوع الروح<br />ماتبصش كدة يا عبيط الحلوة دى بالتقسيط<br />سولار فى البنك و لا دولار فى البنك<br />حلوة و متدلعة و على السكة متشخلعة<br />عدى و اجرى على اخرك و عند كمين الرادار حاقبلك<br />التنك وعمرناه و الموتور دورناه واللى بيجرى على رزقه ربك ما بينساه<br />أوعى تقرب ياعبيط … أصلي واكل قرنبيط<br />ماتحاسب ياطور … لاتفوت الماتور<br />الحق عليا اللي طاوعتك … ياندل<br />اجري جري الوحوش … مش هاتحصلني يابوش ( توقيع : بن لادن )<br />عايزين همة … ياعالم يارمة<br />اديها ميه … تديك طين<br />رشة جريئة … يعقبها الندم<br />ماتنقوش فيها يا عواطلية … دانا رايح أبيع العربية<br />فتح عينك … تاكل على قفاك<br />احترس … السائق … صعيدي<br />دى مش ورس… دى جايا بخلع الضرس<br />ماتبصليش بعين ردية… دول سبع سنين فى السعودية<br />\" أنا أشتريت الونيت .. لما رجعت من الكويت \" والونيت فى دول الخليج هو العربية الربع نقل.<br />\" ماتبحلقليش كده يا جبان دول 7 سنين فى سلطنة عمان \"<br />\" تسألني جايبها منين .. أصلي كنت فى البحرين \" مع تحيات أخونا حشيش<br />\" لا بأنجم ولا بشوف الأطر … ده أنا أتبهدلت فى قطر \"<br />إدلع يا رشيدى على وش المية<br />تراعينى قيراط أراعيك قيراطين<br />تتوه أنا عنيه بنظرتك ليه(مش عارفة إزاى يعنى؟بيحول؟)<br />جددت حبك ليه بعد الفؤاد ما ارتاح<br />على الصبر محناش قادرين ليه بتحسد الصابرين<br />كايدة العزال يا سكينة<br />ماخدش العجوز أنا<br />للصبر حدود و أنا صابر<br />ما زلت كايدة العزال<br />ما قدرش على كده و مقام السيدة<br />من فرحتى تهت مع الفرحة(خرج و لم يعد؟)<br />مين ينصر المظلوم و يحاسب الظالم<br />وصفوا لى الصبر لقيته خيال<br />يا بنت يااللى المولى أعطاكى الجمال وزعيه على إخواتك(عشان الضرايب؟؟؟؟؟<br />آخر طريقك فين<br />إدينى من وقتك ساعة<br />العب مع غيرى يا ظالم<br />المية زلال اشرب حلال آخر جمال<br />أنا اللى حلوة فيهم<br />أنت اللى فيهم يا أبو عزام<br />أهى جات كده و اللى معاه كلمة يلمها :twisted:<br />بص بعينك و ارحم بقلبك(ناقص يقول و امشى على رجلك)<br />بص شوف الفلوس بتعمل إيه<br />بطل تقل بقى<br />حرام عليك يا عبده سبنى فى حالى<br />حلوة يا حاجة<br />حمال الأسية<br />خطر على بالى<br />ربنا عاوز كده و أنا أعمل إيه<br />عينك فيك توريك شغل الزغاليل——-> :alien:<br />كفاية يا عين<br />مش بنام الليل يا ليلى<br />معلش يا زمن الهجرة غربتنا و الأيام علمتنا<br />متبصليش قوى لتحسدنى<br />و النبى حيجننونى :mrgreen:<br />و النبى لتتفرج<br />وبعضها يتضمن تحذيرات:<br />احذر خطأ الغير<br />النار بتجرى ورايا :aa:<br />إن خلص الفول أنا مش مسئول(سواق كارو الظاهر)<br />إن خلصت الكراسى أنا ماشى<br />أنا خايف عليكى يا نجوى<br />أنا شايفك يا حرامى<br />اوعى الهوى<br />اوعى من قدامى احسن أدوسك<br />evil:<br />حاسب عليه أنا غلبان<br />حاسب معنديش الا هيه<br />حاسب وراك وراك حاسب<br />حاسب وراك محاسب<br />خلى بالك منى<br />شوف قدامك بص وراك(دعوة صريحة للحوادث) :lookaround:<br />على مهلك يا أبو سريع<br />ممنوع البصق و اللصق :cool:<br />و بعضها أمثال شعبية:<br />البانى طالع و الفاحت نازل<br />العيشة منجهة والحياة أبهة<br />العين وسع الحلق بس النظر تعبان :shock: ايه يعمل الحاسد فى الرازق<br />دوس على المرايا دوس هى حكاية والا فلوس :mad:<br />صبرك يا قلبى على نفسى و لا صبر الناس عليك<br />و فيه نصايح كمان:<br />احترم العامل يحترمك<br />اشرب العصير المنعش(مقلش إسمه إيه) :cool:<br />اشرب زبيب وصفه الطبيب طه الحبيب<br />الرأفة بالحيوان واجب على كل انسان<br />لا تسرع و عد سالماً<br />لا تندم على ما فاتك<br />وفيه عبارات تتضمن تحيات:<br />صباح الخير يا حسنة<br />صباح الخير يا اولادى أيمن و محمد<br />صباحى فل و النبى<br />مكتوب على وجهك صباح الخير يا صفاء<br />و فيه أدعية و ابتهالات:<br />الحمد لله على نعمائه<br />الفاتحة لحضرة النبى<br />الله أكبر النصر للعرب :sat:<br />الله كريم –الله معانا –الله يرعاك<br />اللهم اعطينى خير الزاد و اكفينى شر العباد<br />تندب فى عينك رصاصة ياللى تبص<br />evil:<br />رضا يا بنتى العيش و رب العرش<br />روح منك لله<br />طريق السلامة يا أبو شريف_يا أبو على_يا أبو هشام<br />على بركة الله يا زمزم<br />فى حفظ الله يا نوسة<br />فى رعاية الله يا ريرى(ريرى إزاى وابوها عبد العال؟؟؟؟؟؟؟)<br />فى رعاية الله يا أبو نانا(نفس السؤال؟)<br />قاصد كريم فى سبيل لقمة العيش<br />قلباً شاكراً و لساناً ذاكراً و زوجة صالحة<br />كده رضا _محروسة بإذن الله<br />مدد يا أهل البيت-يا أم هاشم<br />مون بالسولار و صلى على المختار<br />نظرة يا أبو العباس<br />نظرة يا بدوى جاب اليسرى(؟؟؟؟؟؟)<br />و حياتك يا ظالم ما تمسك حاجة عليه<br />يا حامى السويس يا غريب<br />و فيه أقوال مأثورة:<br />إذا سفه السفيه فلا تجبه و خير الكلام السكوت<br />اغنى الغنى العقل<br />اكبر الفقر الحمق<br />الحسود لا يسود<br />الزمن أحسن معلم<br />الصبر طيب ولكن الأسى يضر<br />إله الرياسة سعة الصدر<br />جمال الدنيا بالمال و الآخرة بالأعمال<br />عاشق الأمل مغرور(يعنى الواحد يموت من الاكتئاب أحسن)<br />عامل الناس كما تحب أن يعاملوك<br />كيف أخشى الفقر و أنا عبد الغنى(حلوةةةةةة ةةةةةةةةةةةةة)<br />كيف أقول ملكى و الملك لله<br />لا تتعجب فإنها إرادة الله<br />و فيه شويه بقى مش ممكن:<br />(بيعتمدوا على الأسماء الموصوفة):<br />أبو السباع سيارات الوحش الجبار :twisted:<br />أبو حلاوة قاهر الدركسيون :twisted:<br />أسطول المنوفية(فيه قطعة منه لزقت فى مصر الجديدة)<br />بترول بلدنا<br />ترمس سنجام<br />جيلاتى أمل حياتى_جيلاتى نور الهدى و الحب كده<br />حسنية أخت كوثر<br />دليل الصحراء<br />زهرة البرنس<br />زهرة المنوفية(حتى فى الشعارات دى واكلها والعة؟؟؟؟؟؟ :twisted: )<br />شادية الصحراء-شيال الحمول يا متولى-عروسة المنصورة_عصير العطشان-فوال الحرية و بياع الطعمية-قاهر المانش-ليلى أخت طارق_مقطورة مستورة_ملاحات البحر المتوسط…<br />و شوية بقى فعلاً فظااااااااااااا اع:<br />إن كنت عايزنى قابلنى<br />انت اللى قتلت سكينة<br />انت جبان و الرب شاهد عليك<br />بص و بص و بص تسوا مليون ونص :cool:<br />بلاش تروح الكلية و كل جيلاتى و مهلبية :aa:<br />بلاش تنسانى مفيش لقلبى بديل ليك تانى<br />جايز و انت شاغلنى تشغل ناس تانيين :inlove:<br />روحى و روحك كده(؟؟؟؟؟؟)<br />سأصبر حتى ينظر الله فى أمرى<br />طلباتك يا حمادة<br />لما أشوفك بنسى نفسى<br />نزيه يا مرور بلدنا :baaa:<br />هنحارب و مش خايفين<br />و النبى أنا حلوة و عارفة انى حلوة<br />و حبيبى لما قاطعنى رحت له أنا برجليه(ناس معندهاش دم :shock: )"
