text = "ذكرتني هذه القصص بلقاءنا قبل سنتين مع سعادة الدكتور منصور الحواسي عندما حكى لنا كيف أنه في أحد جولاته على سكن الممرضات سأل المسئولين عن الأماكن والأسواق التي يتم أخذهن إليها فأفادوه بأنها أسواق البطحاء!!! وعندما أبدى استغرابه واندهاشه من ذلك رغم وجود العديد من الأسواق في الرياض بالإضافة إلى المولات الكبيرة، أخبروه بأن هناك تعميم ينص على ذلك! فقال لهم التعميم يقول خروج الممرضات يكون لأسواق البطحاء؟؟ قالوا نعم!فطلب التعميم. وبعد البحث والتحري أحضروه وإذا به تعميم من عهد الملك سعود أو شيء من هذا القبيل!!! فقال لهم التعاميم ليست قرآن منزل…من الممكن أن تتغير بتغير الزمان والظروف<br />وجدنا آباءنا كذلك يفعلون<br />فهد عامر الأحمدي<br />في عام 1802كان نابليون قد جهز جيشا كبيرا لغزو انجلترا. وترقبا لهذا الهجوم عين الجيش البريطاني خفيرا يراقب المضيق الفاصل بين انجلترا وفرنسا اتخذ موقعه على الساحل.. ورغم ان نابليون هزم في النهاية، ورغم ان الانجليز احتجزوه بأنفسهم في جزيرة هيلانة، الا ان نظام الخفارة هذا استمر (بحكم العادة) طوال 123عاما بعد وفاة نابليون واستمرت انجلترا بدفع رواتب الحراس حتى عام 1944م.<br />.. وهذا في الحقيقة مجرد نموذج لأوامر (نسيها الزمن) واستمرت بحكم العادة والألفة لفترة طويلة دون أن تثير تساؤل أحد!!<br />.. وطالما بدأنا بنابليون فيُذكر عن حفيده الامبراطور نابليون الثالث أنهكان محبا للحفلات واستقبال الضيوف. وفي عام 1852أصدر قرارا بأن تكون جميع الغرف في قصر فوتنيلو (وعددها ثلاثمائة) وجميع الشقق في قصر كومبيون (وعددها ثمانون) جاهزة على مدار الساعة. وهكذا تم توظيف جيش من العمال لتنظيف وترتيب الغرف يوميا (بما في ذلك تبديل اغطية وشراشف أربعمائة سرير كل يوم) وهو ماكلف خزينة الدولة اموالا طائلة.. العجيب أكثر ان هذا النظام استمر طوال اربعين عاما بعد خلع الامبراطور!!<br />.. وهذه الحماقة تذكرنا بالقصة الكلاسيكية العجيبة للسيدة البريطانية ماري باتن؛ ففي عام 1978تناقلت وسائل الاعلام قصة هذه العجوز الساذجة التي استلقت في فراشها لمدة أربعين عاما بناء على نصيحة الطبيب.. ففي الرابعة والثلاثين من عمرها أصيبت بانفلونزا حادة فزارها أحد الأطباء وأمرها بالاستلقاء في السرير حتى موعد زيارته القادمة. إلا أن طبيبها مات فجأة في حين ظلت هي مستلقية طوال هذه الفترة بانتظار الأوامر الجديدة! !<br />.. أيضا هناك قصة طريفة عن الجنرال بولانجيه الذي عين قائدا للجيوش الفرنسية في بداية الحرب العالمية الأولى.. فحين ذهب ليتفقد وزارة الدفاع لاحظ وجود جسر يربط بين مبنيين في الوزارة يقف أمامه حارس مدجج بالسلاح. وقد منعه الحارس من الدخول - رغم علمه بمنصبه الكبير - بحجة ان لديه أوامر مشددة بهذا الخصوص. وحين سأل من حوله عن سبب المنع لم يعرف أحد الجواب.. الشيء الوحيد الذي اتفق عليه الجميع انه منذ عملهم في هذا المبنى وهناك أوامر صارمة بعدم دخول الجسر. وبعد البحث في الأرشيف اتضح انه في عام 1839وفي عهد الجنرال سوليت طليت أرضية الجسر بدهان جديد واصدر الجنرال سوليت أمرا بعدم مرور أحد حتى يُصدر قرارا! بعكس ذلك. ولكن سوليت توفى فجأة بسكتة قلبية في حين نفذت أوامره طوال تلك الفترة (وبدون السؤال عن السبب) فتآكل الطلاء من فرط القدم!!<br />.. وفي الحقيقة هذه القصص لم تذكر لمجرد التسلية والترفيه؛ بل لشرح كيف يمكن لسيطرة العادة ورسوخ التقاليد أن يكتسبا قدسية بمرور الأيام.. والمتأمل لكثير من القرارات والقوانين في إداراتنا ووزاراتنا الحكومية يجد أنها وضعت قبل ستين أو سبعين عاما ولكنها اكتسبت رسوخا بحكم العادة وطول الزمن (وتحولت حاليا الى حجر عثرة دون أن يعرف أحد الحكمة من وجودها أصلا (!<br />.. وحتى نتخلص من فلسفة (وجدنا آباءنا كذلك يفعلون) يجب ان نملك الشجاعة لكسر الموروث وغربلة القديم وتوفيق الأنظمة مع الواقع (وليس العكس).. أما 'الحارس' فيجب إفهامه أن الطلاء لم يجف فقط، بل حان الوقت لاستقالته وترك الجسر مفتوحا للجميع!!"
