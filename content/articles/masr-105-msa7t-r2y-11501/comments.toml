author = "منقول وحياتك منقول"
posted = "2009-03-12"
text = "الواحد حاسس اننا مش زى زمان . كان زمان كده الواحد يسمع ان لو حد عاكس واحده فى الشارع ياخد علقه محترمه مخدهاش سجين سياسى فى معتقل ابو غريب والناس تتلم وكله يشارك وتحيا الوحده العربيه . والعنب العنب والحاجات دى<br />حتى واحنا زمان فى الجامعه كانت خناقه محترمه تحتوى على كل اللى قلبك يحبه من الاسلحه البيضا والسوده والسيوف ( لحد دلواتى مش عارف كانت بتدخل ازاى دى ) عشان واحد عاكس واحده فجابت قرايبها . ده بالنسبه للجامعات العاديه يعنى<br />اما بالنسبه للجامعات التانيه اللى عمرنا ما هنشوف شكلها فكانت الخناقه دايما بسبب ان الواد ميمى عاكس البت ثوثو حبيبه لولو فقام لولو جامع كل اصحابه اللى فى السيبر وفى صالات البلياردو واللى بيعلب على الجيتار على السلالم واللى بينظم رحله لشرم الشيخ وطلعو كلهم على شله الواد ميمى وخاصموهم جامد اوى يعنى . وحطو صابعهم الصغير فى صابع التانيين الصغير يعنى عملو بردو وقفه ورد فعل من اللى هو كدهو المهم انه رد فعل وخلاص<br />انما اليومين دول مش عارف ليه حاسس ان المساله انقرضت او على الاقل قلت يعنى .<br />بنات كتير بتتعاكس ومحدش بيتكلم ولا بيوقف اللى بيعاكس . ومحدش يقولى يا عم بص البنات لابسين وعاملين لان احيانا بتبقى البنت لابسه زى الفل وبرضه بتتعاكس<br />انا كنت راكب المترو ( زحمه جدا يا ناااااس ) كنت حاسس ان اللى بينزل فى محطه بيجى ومعاه قرايبه فى المحطه اللى بعدها المهم انا اتحشرت بين مجموعه من العظام والصدور ( الرجاليه طبعا ) وفضلت واقففى مكانى ولا حد حاسس بيا اساسا<br />المهم وانا واقف لقيت راس شاب كده ( ده اللى انا شايفه منه ) قدامى وهو بيلعب فى الموبايل بتاعه ابو كاميرا ( اللى نفسى فيه ) والواد شكله مؤدب وابن ناس وهادى قلت يا واد اتفرج جايز بيلعب او جايز بيشوف كليب الفنانه خالده الذكر روبى الجديد قربت منه وفجأه شفت العجب .. الواد طلع مشغل الكاميرا وجايب صوره بنت فى اخر العربيه وظبط الزوم لحد ما الصوره قربت جدا واستنى لما البنت كمان بتبص فين عشان الوش يبقى كامل وهوبااااا كليك لقط الصوره<br />الغريب فى الموضوع بقى ان الواد مابصش للبنت خالص ولا كانه بيعمل حاجه هو شغال فى الموبايل كانه بيلعب فعلا ومستحيل حد يتخيل انه بيصور انا شفت اللقطه دى واتجننت وكل الكلام اللى فوق ده انفجر فى دماغى . الشرف . العااار .. الكرااامه .. اخلاق ولاد البلد . اعتبر انها اختك .. خطيبتك . مراتك . ستك الله يرحمها . اى حد يعنى وعلى طريقه ادهم صبرى انفجرت الغده اللى مش عارف اسمها ايه وطلعت كميه زياده من الادريانين تكفى منتخب مصر علشان يفوز بكاس العالم<br />قلت لنفسى هى موته ولا اكتر انا اتجرا ومستحيل الناس يسبونى اكيد الحميه دى موجوده عندهم بس محتاجي اللى يوجهمم ويشجعهم<br />وبعدين انا على الاقل هاضرب واتضرب وحتى لو اتضربت بس فانا هنضرب وهما اكيد هيلحقو يحوشو ( اى حاجه بس مقبلش الكلام ده ) وبعدين من مات دون عرضه مات شهيد ويا سلام لو الواجد مات شهيد وقعدت اقنع فى نفسى لحد ما قول خلااااااص : انا هفرتكه<br />خبطت على دراع الشاب وخير اللهم اجعلو خير ايدى خبطت فى كميه عضلات ولا حديد الدخيله ومجموعه عروق اللهم صلى على النبى وشويه عضلات بقى متبعترين الجهه دى والجهه دى<br />كنت كل لما ايدى تقع على عضله كان سبب من الاسباب يروح فقعدت اقول هى اللى غلطاااااااانه ازاى تسمح لنفسها انها تقف فى مترو وهي لابسه محتشم كده وكمان كاشفه وشها ( يادى الكسوف اخيييه على بنات اليومين دول ال وانا اللى كنت بفكر ادافع عنها ) وبعدين دى مستحيل تبقى اختى عشان اختى لسه صغيره ولا هى ستى علشان ستى ماتت وبعدين دى مش عرضى علشان اموت علشانها يعنى انا كده مش هبقى شهيد وبعدين …<br />قاطعنى صوت بوابه قديمه بتفتح وهو صوت الشاب وبيقولى : فيه حاجه يا انسة؟<br />فقولتله : هو حضرتك نازل المحطه الجايه ؟<br />هـــــــو أ حــــنــــــا لــــيـــــه بـــقــــيــــن ـــــا كــــــد"
archived = "2009-04-21"
capture_url = "https://web.archive.org/web/20090421021918/http://www.20at.com:80/masr/105-msa7t-r2y/11501.html"

