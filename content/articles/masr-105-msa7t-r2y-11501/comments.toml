text = "كلنا شفنا السنة اللى فاتت شوية ميليشيا راكبة عربات نصف نقل وعليها شوية سودانيين حفاة يحملون رشاشات فوق السيارات المازدا نصف نقل تهاجم الخرطوم ولم تشعر بها الحكومة الا وهى فى وسط الخرطوم<br />رئيس متخلف ماسك خيرزانة وواقف فى وسط دروايش يقول لك المحكمة الدولية تحت حذائى<br />السودان ليس العراق<br />السودان ليس الصومال<br />دى شعب متدروش كسول جدا<br />وكتير علية عشرة الاف جندى يدخلوا الخرطوم وتنتهى القصة بتاع العسكر اللى حكموة من سنة 1956<br />والشعب الغلبان مش هيقاوم - هو عندة اية يقاوم بية<br />وهيطلع مولانا الميرغنى ومولانا المهدى يعملوا حلقات ذكر ويلموا النفحة من المريدين<br />وهيطلع النظام المصرى يقول ما احنا نصحناة وقلنا لة بس هو اللى مسمعش الكلام<br />تمام زى ما حدث مع صدام"
archived = "2009-04-21"
capture_url = "https://web.archive.org/web/20090421021918/http://www.20at.com:80/masr/105-msa7t-r2y/11501.html"

