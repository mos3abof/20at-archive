text = "طبعا كل رئيس امريكي جاي علشان خاطر ينفذ جدول الاعمال بتاعه (الادجندا)<br />في عهد الرئيس بوش غزا دولتين في 4 سنين واخد استراحة 4 سنين<br />الشغل حيبدا من جديد بالسودان<br />العراق كانت 3 دول شيعة وسنه واكراد<br />السودان 5 دول من ضمنهم دولة مسيحية<br />فطبعا السيناريو يبدأ بالقاء القبض على البشير وما يرضاش يسلم نفسه ويبدأ غزو السودان وطبعا امريكا حتنسحب من العراق بعد ما سلمتها للشيعة يتحكموا فيها كيف يشاءون<br />وحتجيب الجيش بتاع العراق يحتل السودان<br />وتوته توته فرغت الحدودة حلوه ولا ملتوته"
archived = "2009-04-21"
capture_url = "https://web.archive.org/web/20090421021918/http://www.20at.com:80/masr/105-msa7t-r2y/11501.html"

