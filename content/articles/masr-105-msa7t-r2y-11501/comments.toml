text = "عارف المثل اللي بيقول احنا دافنينه سوا<br />ما هو النظام الحالي ابن النظام السابق والنظام السابق نظام مجرمي 23 يوليو اخدوا الحكم عن طريق الاذاعة كتيبه راحت هجمت على الاذاعة بقيادة المجرم انور السادات واذاعوا بيان الانقلاب وخلصت المسالة<br />وضيعوا الراجل الطيب المحترم الملك فاروق اللي ايامه كانت مصر فوق الكل وبريطانيا ساعدت الحوش دول علشان خاطر يجيبوا مصر الارض<br />فالتحضر ما ينفعش مع شوية ضباط همج حوش حساله<br />وبعدين 9 الاف موظف امن ومليون جندي مركزي وايه يعني كله على حساب الشعب<br />الشعب هو اللي بيدفع فاتورة الامن من قوت يومه<br />واي موظف حكومة بياخد راتبه بعد خصم اجرة الامن يعني مثلا المفروض الموظف ياخد 2000 جنيه بيدولوا 400 جنيه والباقي راح للامن<br />سلام يا صاحبي"
archived = "2009-04-21"
capture_url = "https://web.archive.org/web/20090421021918/http://www.20at.com:80/masr/105-msa7t-r2y/11501.html"

