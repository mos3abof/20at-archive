text = "ابتسمت اكبر ابتسامة وانا اقرأ فى جريدة الاخبار<br />ان مبنى الاذاعة والتليفزيون فى شارع ماسبيرو - مبنى واحد فية او يعمل بة 43 الف موظف - تصور 43 الف موظف فى مبنى واحد - بينهم 9 الاف موظف امن بمعنى انة لكل 3 موظفين يراقبهم راجل امن<br />تخيل انة كل 3 موظفين واحد بيعد حركاتهم وتنفسهم وكلامهم داخل العمل<br />فية مكان فى العالم سواء الراقى او الهمجى فية رجل امن لكل 3 موظفين<br />وعايزين مصر تتقدم بينا<br />تتقدم ازاى<br />عرفتم لية الناس كلها فى مصر بتتفرج على قناة الجزيرة<br />على فكرة مبنى قناة الجزيرة فية 90 موظف بس<br />اة يا بلد محكوم ب البوليسى<br />نظام حكم بوليسى رائع"
archived = "2009-04-21"
capture_url = "https://web.archive.org/web/20090421021918/http://www.20at.com:80/masr/105-msa7t-r2y/11501.html"

