posted = "2009-03-11"
text = "واحد اغتصب السلطة بدبابتة وتربع على صدر الشعب السودانى عشرات السنين<br />وحارب فى الجنوب حرب خايبة انهزم فيها وحارب فى دارفور وشرد العباد وخرب البلاد<br />واصبح مجرما فى نظر المحكمة الدولية ومطلوب للعدالة وبكل صفاقة يريد ان يستمر للنهاية وكان السودان لم ينجب رجلا غيرة ولو غار فى ستين داهية السودانيين ستأكلهم التماسيح لانة حاميهم ومنقذهم ومبعوث العناية الالاهية<br />اولمرت فى اسرائيل وهو اكبر راس فى اسرائيل تستدعية الشرطة كل يوم للتحقيق وبيروح التحقيق وبيحققوا معاة ولم يقل لا<br />انما القاعد فوق قلب الشعب عندنا فلا يجوز حتى نذكر اسمة بغير التبجيل والاحترام الزائف لانة قادم من عند الة السماء يحكمنا<br />لماذا لا يعلن البشير عن انتخابات عامة يترك الشعب يختار رئيسا غيرة منتخب يحكم الناس بالعدل والقانون والدستور ويروح هو فى ستين داهية<br />لماذا بسببة يعرض بلدة والشعب للحصار والجوع وربما الغزو الخارجى ؟<br />نحن فى مصر نعلم ان الغزو القادم لنا سيأتى من الجنوب وعندما تسقط الخرطوم - بعدها بسنوات قليلة ستسقط القاهرة<br />ذلك ليس رجما بالغيب<br />فكل العساكر الجالسة على اريكة الحكم مصيرها اسود<br />ودول اوروبا وضعت لنا تونى بلير هنا فى الشرق الاوسط فى عمان او القاهرة او بيروت ليهندس عودة الاحتلال<br />وهو بالتأكيد قادم<br />لان الحكام العسكر قد خربوا كل شىء السياسة والاقتصاد والصحة والتعليم واصبحت الشعوب عريانة ولا تستطيع حتى المقاومة"
archived = "2009-04-21"
capture_url = "https://web.archive.org/web/20090421021918/http://www.20at.com:80/masr/105-msa7t-r2y/11501.html"

