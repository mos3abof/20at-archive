subject = ""
author = "زعبور"
posted = "2008-11-05"
text = "لاحظت انهم بيقدموا للبنات اللى بيحبوهم دبدوب صينى وورد احمر<br />وانا مش فاهم اية علاقة الدبدوب بالحب<br />ولية دبدوب بالذات<br />على العموم بعد افول وانهيار مملكة الحشيش فى مصر بعد ظهور الحبة الزرقاء وانتشارها على المستوى الوطنى وباسعار مدعمة — بقت العملية سهلة خالص امام بتوع الحب<br />المفروض بدل ما يشترى دبدوب يشترى حبتين زرق ويشتغل فى الازرق طول الليل<br />عيد حب ال<br />اة يا بلد"
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107112524/http://www.20at.com:80/masr/hot-topics/10421.html"

