subject = ""
author = "المفتش كرمبو"
posted = "2008-11-04"
text = "هى العملية بزرميط<br />واحد يعمل عيد للحب — واحد تانى يعمل عيد لعصير البدنجان — وواحد تالت يعمل عيد لصيد الكلاب الضالة<br />ورابع يعمل عيد للتحرش الجماعى<br />ما اللى عايز يتنيل على عين اهلة يحب يروح يحب لوحدة فى حتة ضلمة<br />اية اللى خلاة عيد<br />اعرف واحد عمل حفلة علشان حلق دقنة واستحم ولبس بد\\\\لة جديدة وقعد على القهوة<br />وطاهر المحروس ابنة<br />احنا يا ابنى عندنا العيد الكبير والعيد الصغير بعد رمضان<br />ولما نحب نتدلع بنروح مولد السيدة والحسين والسيد البدوى وسيدى الدسوقى<br />انما عيد للحب منعرفوش ومش بنحب فى يوم معين<br />احنا بنحب كل يوم والدليل الاطفال اللى مالية الشوارع"
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107112524/http://www.20at.com:80/masr/hot-topics/10421.html"

