posted = "2009-11-04"
text = "انا كنت بحب وحده زى القمر بس محصلش نصيب وتخطبة بس ربنا يوفقها واحسن شى فى الدنيا لما تحب بجد<br />هى اسمها ايمان بس انا بحبها اوى وهفضل احبها لاخر يوم فى الدنيا"
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107112524/http://www.20at.com:80/masr/hot-topics/10421.html"
