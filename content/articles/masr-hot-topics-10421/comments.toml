posted = "2008-11-05"
text = "الشعب المصرى لو عرف ان الغرب بيحتفلوا او بيعملو اى حاجه حتى لو كانت مش منسبانه هيقلدها زى الحمار المربوط ف الساقيه عمال يلف يلف ومش عارف رايح على فين لكن عل الاقل الحمار بيعمل حاجات مفيده اللى غايظنى بجد ان احنا مش بنقلد الغرب ف تقدمهم وشغلهم بنقلد الحاجات الخايبه"
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107112524/http://www.20at.com:80/masr/hot-topics/10421.html"

