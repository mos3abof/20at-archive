[[comments]]
order = 0
subject = "شكرا يا عم فيورى"
author = "مسلمه"
posted = "2006-04-28"
text = "شكرا يا عم فيورى على الوصفه الحلوه دى بس احنا يا عم لا قد امريكا ولا قد بتوع نزع الاسلحه والتفتيش<br />احنا خلينا ماشيين جنب الحيط او حتى على الحيط نفسه لو عرفنا<br />اللهم احسن خاتمتنا فى الامور كلها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125702/http://www.20at.com/article2.php?sid=743"

[[comments]]
order = 1
subject = "الفلاش رائع يا عشرينات"
author = "نيفين"
posted = "2006-04-29"
text = "امبارح سمعت ع الجزيره حوار مع كاتب ايرانى بعد ترك امريكا لطاوله المفاوضات<br />و انا مستغربه ان كاتب زى دا لسه مش فاهم اللعبه<br />نووى ايه<br />البترول يا جماعه<br />و على حد قوله فعلا اى هاوى صغير للنت يقدر يعرف طريقه تصنيع قنبله<br />المفارقه الغريبه انى قرات امبارح ف الاهرام ف مقال احمدبهجت ان انهارده ذكرى انفجار المفاعل تشيرنوبل<br />كل قنبله و انتو طيبين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125702/http://www.20at.com/article2.php?sid=743"
