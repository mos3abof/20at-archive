subject = "سلام ايه اللى ممكن ؟؟؟"
text = "سلام ايه اللى ممكن اللى بتتكلم عليه يا استاذ؟ و الغريب ان اسمك جلال الدين عز الدين ؟؟؟<br />احنا لسه بنقول سلام !! ادي دقنى اهيه كمان عشر سنين هانتكلم عن العودة لحدود 2003 كشرط للسلام و كلها كام سنة و ندور نولول في كل حتة لرفع الاحتلال الاسرائيلي عن ارض النيل و الفرات انا مش فاهم حضرتك متخصص ازاي في الصراع العربي الاسرائيلي !!!!!<br />كل ده و لسه مش فاهم ان مفيش حاجة اسمها سلام و ان المشكلة مشكلة \"وجود\" مش مشكلة \"حدود\" !!!!<br />تفتكر حد ممكن يتكلم عن السلام لو الهنود الحمر احتلوا فلوريدا مثلا و قالوا ارض الأجداد و احنا كنا هنا من 250 سنة بس ؟؟؟<br />بالله عليكم كفاية ركون للحلول السهلة زي السلام و التطبيع و الافلام الماسخة دي."
archived = "2004-04-22"
capture_url = "https://web.archive.org/web/20040422182921/http://www.20at.com:80/article.php?sid=45"
