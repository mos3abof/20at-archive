subject = "وجهة نظر أخرى"
text = "أولا مبروك على انطلاق الموقع. وأتمنى أن يقدم أي إضافة أو تجديدا للخطاب السائد المسئوم والمسموم.<br />ما يتعلق بالمقال لي ملاحظات كثيرة عليه:<br />· عبارة \"الشباب العربي واليهوديات\" أصلا عبارة مصابة بالشيزوفرينيا، فهناك يهوديات عربيات في مصر والمغرب واليمن... إلخ. ناهيك عن أنها عبارة صهيونية مائة في المائة تضع القومية العربية في مقابل اليهودية كقومية، وهذا تعريف الصهيونية لليهودية، في حين يفترض أن يعرفها المسلمون بأنها ديانة فقط.<br />· لماذا نعتبر اختلاف الفقهاء دائما نتيجة أن بعضهم حريص على المصلحة الوطنية والآخر عميل ضمنيا، ولا نعتبره اختلاف رحمة، كما درجت تقاليدنا الإسلامية؟<br />· الزواج مسألة شخصية ولا يجب أن تخضع للسياسة. تخيل أنك تريد أن تتزوج من فتاة ولا تستطيع ذلك لأن قوانين دولتك أو دولتها تمنعكما؟ لماذا نعيد إنتاج الاستبداد والقهر وتدخل الدولة في أخص شؤوننا؟<br />· مسألة العداوة والحرب والأمن القومي هي أمور من اختصاص الدولة، والدولة القوية المتمتعة بالكفاءة لا تمنع بالجملة، ولكنها تعرف كيف تحافظ على أمنها مع إتاحة حرية الحركة بأوسع ما يمكن، لأن هذه الحرية هي التي تطلق طاقات المواطنين وتدفع بالدولة كلها للتقدم. فإذا ترتب على زيجة معينة أضرار للأمن القومي فتعاقب المتسبب في الضرر وحده، ولا تعمم العقاب على الجميع.<br />· وكذلك من قال إن كل الإسرائيليات محاربات؟ هل تتخيلون أن كل امرأة إسرائيلية تتزوج مصريا هي تريد أن تجنده لخدمة الموساد؟ ولم لا نتصور العكس طالما أردنا الاستمرار في التعامل مع المسألة من منظور أمني سياسي؟ ولم لا نفكر أن بعض هؤلاء الشباب يستغلون الإسرائيليات للحصول على فرص حياة أفضل؟<br />· أخيرا، تصرفات الشباب المصري الذين يتزوجون من إسرائيليات والإسرائيليات اللائي يتزوجن من مصريين، يجب أن تلفت الانتباه إلى وجهة أخرى في النظر إلى الواقع: أن الناس تريد أن تعيش، وأن السلام ممكن، وأننا لسنا شياطين وملائكة في صراع أبدي.<br />دعونا نتوقف ونفكر ثم نحكم.<br />جلال الدين عز الدين – القاهرة."
archived = "2004-04-22"
capture_url = "https://web.archive.org/web/20040422182921/http://www.20at.com:80/article.php?sid=45"

[[comments]]
order = 2
subject = "استاذنا.. تحية"
text = "شكرا جزيلا علي مداخلتك استاذنا الكريم جلال عز الدين.<br />كانت اضافة هامة بالفعل و تناغماً مع قلت وكرامة للتفاعل سأصارحك بالمشاكل التي واجهتها وأنا ابحث في الموضوع.<br />* كم ضخم من المتزوجين من اسرائيليات هم في الحقيقة فلسطينيين يحملون الجنسية الإسرائيلية من عرب 48 ..وأذكر أن هؤلاء إلي وقت قريب كنا نتعامل معهم علي أنهم خونة أيضاً.<br />* للحق الصراع الإسلامي اليهودي صراع محير حقاً- هذه قناعتي-..فليس كل مايدرك يقال وليس كل مايقال مبني علي إدراك سليم..هي مشكلة قطعاً..أري أنها تتلخص في أن الصراع بكل تحديداته ما هو إلا تماهي - وتميع - بين فكرتين أخلاقيتين تذوب فيهما الكثير من المحددات الدينية والعرقية و اللغوية بل والنفسية بين البشر.. جميع البشر.<br />* بالطبع لم أرد علي نقطة واضحة من إستفساراتك ولكنني أصادقك القول أن هذا ماكنت أحلم به من هكذا موضوع..تفاعل ..تفاعل حقيقي بين الأفكار ورغبة صادقة في الوصول لفهم حقيقي لهذه المشكلة المعقدة.<br />اشكرك استاذنا وتمنياتنا بالتواصل.<br />*ملحوظة<br />الأستاذ جلال الدين عز الدين باحث متميز في مجال الصراع العربي الإسرائيلي..ونحن نثمن مشاركته هذه التي جاءت في وقت كنا نحتاجه خاصة مع بداية بث الموقع.<br />حمزة الخياط"
archived = "2004-04-22"
capture_url = "https://web.archive.org/web/20040422182921/http://www.20at.com:80/article.php?sid=45"

