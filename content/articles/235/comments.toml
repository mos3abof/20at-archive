[[comments]]
order = 0
subject = "بيرو"
text = "مبروك لعشرينات نقل السيرفر ويارب يباركلكم في السيرفرالجديد ويكبره ويخليه شرح وبرح وابن حلال ويهدي سركم ومتحصلش مشاكل ...<br />آمين<br />أما عن الموضوع فأنا بحب جدا موضوع العادات التي تسبق التي تحافظ بعض المجتمعات عليها أثناء الزواج وإن كنت أعترض علي بعض التجاوزات الشرعية التي تتسبب فيها هذه العادات ..!!<br />علي العموم أنا عايز أسكن في بلد يكون من عادتها إن العؤيس ميدفعش مهر وميجيبش شقة ولا عفش ولامؤخر وياسلام لو يكون المجتمع ده بيجوز بالاربعة مرة واحدة ..ساعتها ابقي اسعد واحد في الدنيا .."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926011147/http://www.20at.com:80/article.php?sid=630"

