[[comments]]
order = 19
subject = "this against the laws of copyrights"
author = "Hazem Wefy"
posted = "2006-08-03"
text = "لن أجزم بأنها سرقة مقصودة، ولن أقول أنها انتهاك صارخ لمجهود فنانين قاموا بابداع هذه الأعمال التي نشترتموها بدون اذن كتابي صريح من الفرقة أو حتى مؤلفو كلمات هذة الأغاني التي أعطيتم لأنفسكم الحق أن تنشروها بدون أي وجه حق، لمجرد أن القراء يقولون عنكم \"دايما مظبطينا\"<br />أنا حازم ويفي احد الشعراء الذين يكتبون لوسط البلد والذي سمحتم لأنفسكم بوضع أثنين من أغنياته بشكل فج وقبيح في \"لينك\" مجاني بدون أي اذن كتابي كما ينص ميثاق الشرف الصحفي والأدبي الذي من المفترض أن تكونوا تنتموا اليه<br />انا سوف أنقل فورا أعتراضي للفرقة، وبقية الشعراء زملائي، واطالبكم في الحال برفع هذة الأغاني من الموقع والا سأضطر آسفا لأتخاذ اي اجراء قانوني اراه مناسبا."
archived = "2006-11-16"
capture_url = "https://web.archive.org/web/20061116214139/http://masr.20at.com:80/article.php?sid=304&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

