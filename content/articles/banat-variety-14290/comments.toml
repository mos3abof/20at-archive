author = "فروتى"
posted = "2009-12-26"
text = "ياجماعه الموضوع معقد جداااا<br />مش بيتحل بالسهوله دى<br />انا مثلا جربت معظم الحاجات دى ومافيش فايده<br />وماقدرتش اكمل لان بحس ان ده بيجى على حسابى<br />خصوصا لو الام ليها سطوه على ابنها<br />بس انا اكتشفت ان من الامور المهمه تكون شخصية الراجل مع مامته لان هو اللى بيعرف يظبط الامور بين مامته وبين خطيبته<br />وهو اللى بيعمل لخطيبته مكانه بين اهله بالحب والاحترام<br />وهيا كمان نفس الحكايه كل واحد عارف اهله اكتر من التانى يعنى يعرف يتصرف معاهم احسن<br />وانا رأى من رأى بسنت يا سلمى لان مامته شكلها مفتريه من الاول<br />ثم لو كان كده يبقى سيبتم بعض من الاول ليه<br />وانت يانيجار اصبرى شويه بمجرد مايتم الزواج ان شاء الله اهلك هيعرفوا ان ده جوزك ومش هيبقى فى حاجه من دى بس انت حاولى ماتقوللهمش على حاجه بتحصل بينك وبين خطيبك حاولى وقتك فى البيت وانت قاعده معاهم يبقى تسأليهم عن احوالهم وتهتمى بيهم اكتر يعنى حاولى تضحكى عليهم شويه لان غيرتهم دى وقتيه وغيرة خوف لا اكتر"
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124153041/http://www.20at.com:80/banat/variety/14290-2009-12-07-13-05-21.html"

