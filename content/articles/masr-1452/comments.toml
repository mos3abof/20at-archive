[[comments]]
order = 1
subject = "مبروك ياسى اهلى"
author = "معرفشى كل ما اشوف اللعيبة المصريين احس ان عندهم فقر دم وانيميا حادة ومفيش فيهم نفس ولو قعدت كم مرة وقع فيها اللعيب على الارض تحس انة نازل الملعب علشان يقع"
posted = "2007-01-16"
text = "والمباراة عبارة عن شوط طويلة من الجون للجون واخر حلاوة<br />كرة اية وهباب اية<br />ماتلعبوا العاب قوى<br />رفع اثقال<br />جمباز<br />مصارعة وملاكمة<br />بلى لمسافات طويلة<br />استهبال عالمى"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118180937/http://masr.20at.com:80/article.php?sid=1452"

