[[comments]]
order = 9
subject = "احمد الدرينى اعظم كتاب مصر"
author = "مصرى بجد"
posted = "2006-07-19"
text = "انتا يا حقير ياللى ماضى بأسم مصراوى الحقير اللى زيك ماينسبش نفسه لمصر ماشى يا خنزير.. ولما انتا مش فاهم حاجه ايه اللى خلاك تتكلم يا تافه.. احمد الدرينى اعظم صحفى فى مصر واسلوبه فى منتهى الرقى ونقد الفيلم بشكل رائع اعتقد انه احلى من الفيلم والروايه نفسها فما تتكلمش على اسيادك يا فسل يا\"منخفض\"وانتا عارف معناها ايه باالعميه ..انتا شكلك كنت تايه.. ايه اللى جابك هنا يا شاطر روح العب بعيد خلى الكبار يتكلموا ماشى يا ذبابة يوليو ..هش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131833/http://www.20at.com/article2.php?sid=1085"

[[comments]]
order = 10
subject = "دة فيلم يا سادة"
author = "قلم جاف"
posted = "2006-07-20"
text = "أنا مذهول من تعليق الأخ اللي بينتقد نقد الفيلم من خلال الحديث عن عناصره الفنية.. طبعاً ما هو لا نقد إلا النقد المبني على استخفاف دم الصحفي للممثل ، طالما دم الممثل خفيف على قلب سيادته يبقى الفيلم ذهب مع الريح ، وطالما تقيل يبقى فيلم مقاولات ماركة خمسة شيكارة!<br />متى نتعامل مع الفيلم كعمل فني له مقوماته من صوت وموسيقى ومونتاج وتمثيل وتوجيه للممثل وسيناريو؟<br />كما أنني \"لم أستخف دم\" ملاحظة أن الفيلم مأخوذ عن الرواية في تعليق نفس المعلق .. هل أنا ملزم بنقد الرواية طالما أنا أتحدث عن فيلم؟ هل معنى أن مسلسل لن أعيش في جلباب أبي هابط أن النص الأصلي له هابط؟ وهل يجب علي أن أقرأ النص الأصلي أم أكتفي وأركز على الصورة التي أراها أمامي؟<br />عزيزي المعلق : أتمنى ألا يكون ما تكتبه تحريضاً للدريني ، ولأي شخص آخر ، على أن يمارس النقد على طريقة العبارات النقدية المتخلفة لمسلسلات رمضان ، ولتذهب كل مقومات الصورة السينمائية والتليفزيونية في ستين ألف داهية!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131833/http://www.20at.com/article2.php?sid=1085"

