[[comments]]
order = 12
subject = "أين لغة الحوار؟"
author = "هانى"
posted = "2006-07-20"
text = "وصلت الموقعة بالصدفة وفرحت لما لقيت شباب عايزين يعملوا حاجه كويسه وقريت نقد الدرينى اللى ممكن اتفق أو اختلف معاه فى فى بعض النقاط ، بس للأسف اتصدمت لما لقيت الكلام البذئ اللى كتبه بعض المعلقين ، ودا راجع لعدم تعلمهم لغة الحوار ولأنهم ميعرفوش الفرق بين النقد والسب!<br />يا جماعة عمرنا ما حنتقدم طول ما احنا مبنعرفش نتواصل مع الآخر حتى لو اختلفنا معاه...<br />الفيلم عمل فنى زيه زى أى عمل آخر له سلبياته وإيجابياته<br />وملحوظتى الأساسية لنقد الدرينى إنه مينفعش يقارن بين الرواية والفيلم لأنه مكتوب على أفيش الفيلم النص السينمائى: وحيد حامد ،ولأن الرواية عمل أدبى له أدواته المختلفة عن العمل السينمائى!<br />الفيلم فيه مساوئ كتير بس كمان له ميزة أساسية وهى الجرأة فى تناول موضوعات مسكوت عنها ومحظورة التدوال رغم وجودها ومعرفتنا بها (الفساد ،والإرهاب وظلاميته والشرطة وتعنتها فى مواجهته،والتحرشات الجنسية لبنات الفقراء والمعدومين ،التمييز الطبقى فى القبول بالكليات العسكرية،والشذوذ وجذوره النفسية)<br />مين بقى يقدر يثبت إن كل ده مش موجود فى مصر التسعينيات وما بعدها؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131833/http://www.20at.com/article2.php?sid=1085"

[[comments]]
