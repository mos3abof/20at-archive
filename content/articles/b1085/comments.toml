subject = "الحريه الديمقراطيه"
author = "محمد احمد"
posted = "2006-07-17"
text = "اذا كانت الحريه والديمقراطيه ستجعلنا نتخلى عن ديننا وقيمنا وعادتنا الاصيله فالتذهب بلا رجعه هذا لانى اٌقرأواتابع مشاكل هذا الفيلم الذى به مشاهد وتلميحات لا تليق ابدا بديننا وحياتنا وادخلوها علينا بدعوى الحريه والديمقراطيه الامريكيه القادمه للشرق الاوسط الرجاء كل الرجاء ان ترحمونا من هذه الافعال غير المسؤله وتخرج من ناس بلغوا من العمر عتيا اريد ان اقول للعجوز الذى قام بالبطوله ان الله عز وجل يكره ثلاثه وكره لثلاثه اشد منهم شيخ (عجوز)فاسق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131833/http://www.20at.com/article2.php?sid=1085"

