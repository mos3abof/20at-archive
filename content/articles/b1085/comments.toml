subject = "قلم الوان الطيف"
author = "خلاويص..... لسه"
posted = "2006-07-20"
text = "اولا يا ريت يعني الموقع ياخد باله من التعليقات المستفزه دي<br />اول ما يشوف حاجه زي كدا يشلها علي طول<br />وخدالي بالك يا ورك البلد<br />ولاه لاستعباط لاه لاستهبال للناس اللي ما بنشوف خلقتها غير مره في السنه وساعه لما تسمع كلمه قلم رصاص تيجي من اخر بلاد المسلمين كنتوا فين يعني لازم تظهروا بعد ام حذفوا قلم رصاص غيظه دي ولاه ايه<br />يا ريت تلمو نفسكوا شويه كتر خيره انه كتب وانا الصراحه كنت متغاظه موووت ان ماشفتش الفيلم ومعلقتش في اي حته غير هنا لان حسيسني اني شايفه بطلو بقي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131833/http://www.20at.com/article2.php?sid=1085"

