[[comments]]
order = 5
subject = "يعقوبيان ... فكرة جديدة"
author = "بحبك يا مصر"
posted = "2006-07-18"
text = "بداية احب ان اشيد بهذا الموقع المميز والرائع ...<br />اود ان اشيد بهذا الفيلم وبكل صراحة سواء من ناحية الاخراج او التمثيل او القصة مع تحفظي على بعض المشاهد وهي كالتالي :-<br />1 - افلاس عادل امام: لنرى وبعصف ذهني سريع لأفلام عادل امام الأخيرة نرى انه يعتمد على الكوميديا الجنسية ...!<br />لماذا هل طاقة عادل امام في الكوميديا استنزفت ... ام بسبب ظهور منافسين جدد من الشباب الكوميدي امثال: محمد هندي ومحمد سعد وهاني رمزي والمرحوم علاء ولي الدين ... وغيرهم الكثير ... ولو استعرضنا افلام هؤلاء الشباب سنجد ان افلامهم لا تعتمد على الايحاءات الجنسية وان وجدت فتكون بشكل قليل ... ولكن عندما يظهر فيلم لعادل امام نجده مليئ بالمشاهد والايحاءات الجنسية بداية بفيلم بخيت وعديله بجزايه والتجربة الدنمركيه والسفارة في العمارة ... الخ وهذه الأفلام على سبيل المثال لا الحصر وانا شخصيا ومن بعد تلك الأفلام قد اخذت عهدا على نفسي بان لا ادخل فيلم لعادل امام .<br />- وجود مشاهد غير لائقه في الفيلم والتي تجعلك في نص هدومك وانت تشاهد الفيلم .. ولا نقول انه الفيلم الوحيد الذي يظهر فيه مشاهد خارجه عن الحياء ولكن تم طرح بعض المواضيع بتصوير بعض المشاهد بصورة جريئة جدا .. جدا ، وانا لا انكر معالجة تلك المواضيع (الشذوذ الجنسي ...الخ) حيث انها موجودة في مجتمعاتناويجب التطرق اليها ولكن بشئ من التحفظ حول تصوير وعرض بعض المشاهد حيث بامكان التلميح لبعض الأمور من خلال الحوار او تصوير بعض اللقطات العادية لما يريد المخرج والكاتب توصيله للمشاهد ... ولأسترجع معكم معك قليلا فيلم (القاتلة) لفيفي عبده سنجد ان المخرج في بداية الفيلم قد اظهر السبب الرئيسي للحالة النفسية او العقدة النفسية التي تمر بها فيفي في الفيلم وذلك من خلال تصوير مشهد تعرضها لاغتصاب وهي طفلة من قبل حارس الجنينة ... هذا المشهد يوصل للمشاهد المعلومة المطلوبه ، وانا اتعجب في الواقع من بعض المخرجين هل يرون انا المشاهد غبي لدرجة انه لا يفهم فكرة بعض المشاهد او لايستطيع فهم الفكرة المراد توصيلها<br />انا ارى العكس تماما فمن واقع الأمور الحياتية الكثيرة التي نمر بها كل يوم من تناقل اخبار بين الناس عن جرائم معينة ترتكب او احوادث تقع في مدن ومناطق مختلفة تنشر في الصحف فيستطيع المشاهد فهم كل تلك الأمور بذكاء .<br />3- انا لم اقرا الرواية ولكن كان من واجب المخرج او المؤلف ان ياخذ التفاصيل الرئيسية باحداث الرواية وينقلها كما هي كعودة العلاقة بين عبدربه والصحفي او حتى عن مقتل الصحفي .<br />4 -كنت اشاهد مشهد قتل الضابط من قبل طه الشاذلي وقد كنت اتذكر بعض المشاهد من الأفلام الهندية ... حيث كان اخراج المشهد مبالغ فيه جدا ... فعند اطلاق الرصاص على صه الشاذلي نجده قد طرح ارضا ومن ثمه يقوم لينتقم وكذلك الضابط ... برايي المخرج لم يوفق بهذا المشهد .<br />اما عن رايي في الفيلم بشكل عام فاني اجده من الأفلام الجريئة في الطرح وفي تناول بعض الأمور (الفساد- الشذوذ ... الخ) ، كما اجد ان المخرج قد صاغ الفيلم بطريقة جدا مشوقه باستثناء بعض المشاهد التي ذكرتها سابقا ... والسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131833/http://www.20at.com/article2.php?sid=1085"

[[comments]]
order = 6
subject = "همسة الي ابن الكلاب وحيد حامد"
author = "محمد صابر"
posted = "2006-07-18"
text = "طبعا بعد شكر كاتب النص اللي صور الفيلم كاننا بنشوفه عاوز ابعت همسة عتاب رقيقة للكاتب وحيد حامد واقوله:<br />يا كلب يا ابن الكلاب ....طيب هو ذنب الكلاب ايه اننا نشبها بهذا القذر اللي اسمه وحيد حامد؟؟؟<br />نخليها يا جزمة يا ابن الجزم<br />برضو الجزم هتشتكي انها مش عاوزة تتشبه بيه<br />طيب قولولي علي وصف قذر اوصف بيه هذا النجس اللي اسمه وحيد حامد<br />الي متي يا نجس الانجاس سوف تستهزء بشعائر الاسلام ....<br />الي متي يا خنزير يا ابن الخنازير هتسكت<br />لو اطول رقبتك القزرة لقطعتها والقيتها وسط روث الخنازي ليزداد الروث قذارة ونجاسة<br />لعنك الله انت وابنك وكل من حمل اسمك وعلي شاكلتك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131833/http://www.20at.com/article2.php?sid=1085"

[[comments]]
