order = 16
subject = "لماذا نجاح يعقوبيان ؟"
author = "محمد حسن غنيم"
posted = "2006-08-05"
text = "محمد حسن غنيم<br />بإختصار و بدون الخوض في أعماق التفاصيل<br />ممكن ان يكون الفيلم ناجح لكل من لم يقرء الرواية و أو يتمعن شخصيتها<br />و في نفس الوقت ممكن ان يكون الفيلم راسب إذا كان المشاهد من المهتمين بالأدب و اطلع على الرواية و قرئها<br />و بطبيعةالشباب المصري شعب بيحب الفكاهه و الضحك و الإفيهات الجنسية و بنيجي في الهايفة و منقف أو نتصدر زي ما بيقولو<br />لم يهمنا قراءة الرواية ولكن كل ما يهم الشباب دخول الفيلم لمعرفة الإفيهات الجنسية و دا كان سبب من نجاح الفيلم<br />فأنا لم أكن أديبا أو شاعرا او مفكراً فأنا شاب مصري لا أكثر ولا أقل ولكن ما يميزني انني اطلعت على الرواية بتمعن<br />ومن هنا ممكن ان انقدها في نقاط لا تتعدى السطور<br />الأستاذ وحيد حامد و مروان وحيد حامد قدموا انجاز لم ينكرة احد<br />ولكن اذا انتهت احداث الرواية عام 1995 وهذا ما نفهمة من النص الاصلي للرواية اي قبل انتشار المحمول و فودافون في مصر صح<br />إذن كيف تكون هناك الإعلانات عن شركات المحمول في الشارع المصري قبل ظهور المحمول في مصر<br />ثانيا كيف و ان التمثال الاساسي في الفيلم هو عمارة يعقوبيان كيف و ان المخرج لم يظهر العمارة بل يظهر عمارة أخرى<br />و هناك الكثير و الكثير ولا أريد ان اغوص في النقد الأدبي لكونى لست اديبا او مفكراً او ناقدااو مخرجا محمد حسن غنيم"
archived = "2006-11-02"
