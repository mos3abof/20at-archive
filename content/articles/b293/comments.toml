[[comments]]
order = 9
subject = "من هو"
author = "حمدي"
posted = "2006-01-20"
text = "ابن لادن مجاهد أم مجرم<br />من المعلوم أن ابن لادن ينحدر من أسرة ثرية أصله يمني وحصل أباه على الجنسية السعودية في ظل حكم الملك فيصل رحمه الله وترعرع ابن لادن في كنف أمه السورية الأصل، نشأ ابن لادن على التزام بالصلاة والصيام وسلوك مسلك المسلم الصالح، غير أن ابن لادن في سن الشباب وهو سن تتغير فيه الأفكار من أقصى اليمين إلى أقصى اليسار وتتحرك فيه الثوابت بسهولة شديدة. قراء ابن لادن في كتب الفقه الإسلامي عن الجهاد وسمع عن جهاد السوفيت في أفغانستان فتاقت نفسه إلى تلكم الحياة الجديدة (الشديدة) المختلفة عن ما شاهده في بعض إخوانه غير الأشقاء من مظاهر الترف السلبي والبذخ المتلف للأخلاق وهادم لسلوكيات المسلم بشكل عام. فوجد ضالته في السفر إلى أفغانستان وبحكم ثروته وإنفاقه على المجاهدين من جميع الجنسيات هناك أصبحت له الكلمة العليا والطاعة الواجبة خاصة وأنه يشتهر بالحياء وهدوء الطبع وقدرة على إقناع الآخرين، وبانتهاء الحرب بخروج الروس من أفغانستان انتهى أيضاً دور ابن لادن ومن معه من غير الأفغان، ولكن وفي نفس الوقت تشبع ابن لادن بأفكار التكفير ومنهج الخوارج وإن كان يتأرجح بين هذه وتلك إلا أنه حينما أراد أن يصلح الدنيا بالدين لم يفقه دينه ولم يعرف أمور دنياه, فلم يتعلم منهج أهل السُنة والجماعة في مناصحة العلماء إذا أخطئوا مرة هنا وأخرى هناك. فضلاً عن مناصحة أولياء الأمور. هذا إن لم يكن هناك من يناصحهم من العلماء وأهل الدين. تأثر ابن لادن بالظواهري وأمثاله ممن يتبنون منهج الجهاد على غير منهج الإسلام ولا على هدي رسول الله، ووجد فرصته في تأسيس الدولة الإسلامية في ظل حكم طالبان على أرض الأفغان، ومن هناك انطلق لينابذ الدول الغربية صاحبة القوة والهيمنة والسلطان بتفجير سفارة في مجاهل أفريقيا أو تفجير بين المسلمين لقاعدة أمريكية في السعودية، جهلاً منه ـ ومن معه ـ أن المسلمين يمرون في هذا الزمان بأسوأ حالات التشرذم والفرقة والضعف ويغزو الطاغية منهم على الضعيف ( العراق والكويت) ومناوشات هنا وهناك (الجزائر والمغرب) وإعجاب كل زعيم ـ إلا من رحم الله وهداهم أجمعين ـ برأيه (وهذه حدث عنها ولا حرج) فضلاً عن مجتمعات الفيديو كليب، وإهدار طاقات الشباب المسلم في سعار الشهوات وغيبوبة الملذات. فما كان من ابن لادن إلا أن ناوش الدول الكبرى بقواتها النووية والذرية وطائراتها وقواتها الضخمة المدربة والمتفوقة عدداً وعدة بما لا قبل لدول كبرى مثل الصين أو الهند مثلاً من مناوشتها أو استعدائها، ونحن مطالبين بـ ( وأعدوا لهم من قوة ) ونهينا عن التسرع والهلاك والإهلاك (ولا تلقوا بأيديكم إلى التهلكة) فضلاً عن إهدار ما نملكه من مصادر قوة أو استعداء الغير عليها لينهبوها أو يستنزفوها. كما أنه ليس من العقل فضلاً عن الدين أن يناطح الأرنب أسداً فما بالك إن كانوا أسودا.أما من الناحية الشرعية فجهاد الأعداء لا يكون إلا من خلال فسطاطين أي فريقين - كما قال هو - فإذا كان فسطاط الكفر الآن بزعامة بوش. فمن هو صاحب راية الإسلام في زماننا؟ إن قال أحدهم هو بن لادن! أرد عليه متسائلاً: أي زعيم هذا الذي يعيش هارباً بين الجحور والثغور؟!!, فضلاً عن السؤال الكبير: من نصبه أو بايعه من جماعة المسلمين في ديار الإسلام. إماماً على المسلمين؟.ليتحمل مثل تلك المسئولية العظمى والنتائج التي تترتب على كل عمل من شأنه أن يضر المسلمين بعامة أو ينفعهم بعامة. إن إنكار المنكر إذا ترتب عليه منكر مثله أو أقل منه، لا يجوز أن تنكره لما يترتب عليه, فكيف بآلاف الأنفس المسلمة البريئة التي قتلت والأعراض التي انتهكت والأطفال الذين يتموا والفزع والهلع الذي يعيش فيه المسلم صباح مساء في العراق، واضطهاد المسلمين في أنحاء الأرض تحت ذريعة الإرهاب التي أعطى ابن لادن جميع مصوغاتها لبوش على طبق من ذهب مرصع بدماء المسلمين تحت دعوى الجهاد. أي جهاد هذا بغير ولي الأمر أو بإذنه وبغير أمير وتحت أي راية ومع أي جماعة؟. أي جهاد هذا الذي هو ذروة سنام الإسلام وكثير ممن يدعونه زوراً وبهتاناً لا يفقهون فقه الطهارة والصلاة فضلاً عن الجلوس للفتوى في دماء المسلمين وحكم من يُقتل منهم مع غيرهم من أهل الملل الأخرى. قبل أن نصل لذروة السنام, يجب أن نبدأ بالقواعد والأركان, يجب أن نهتم بالأسس والأساس. فما علمت بناءً تم بناءه من أعلى أبداً!. وما أظن قاله عاقل فضلاً عن عالم مسلم!.<br />أتمنى أن يعلم القاصي والداني أن ابن لادن إن كان قد أحسن تحديد الغاية ـ وما أحسبه أحسن شيئاً من هذا ـ فإنه أساء اتخاذ الوسيلة, وديننا الحنيف لا يبيح أي وسيلة لبلوغ الغاية حتى وإن كانت الغاية نبيلة وشريفة. فالغاية التي تبرر الوسيلة، قاعدة أرساها مكيافيللي ا بن أنطونيو. لا يمكن بناءها في شرع محمد بن عبد الله صلى الله عليه وسلم. فأين ابن لادن من فقه استئمان الكافر في بلاد المسلمين؟ أين ابن لادن من استحلال دمائهم وقد عصمها ولي أمر المسلمين في كل بلد بحسب؟ أين بن لادن من حرمة ترويع المسلمين فضلاً عن قتلهم واستباحة دماءهم. أين ابن لادن من طاعة ولاة الأمور الواجبة بنص وصية النبي عليه الصلاة والسلام. قد أجد في قلبي على ابن لادن الكثير ولكن ما كُسر الإسلام في زماننا هذا بمثل ما كان سببه أو بدعم ابن لادن.<br />ابن لادن خرج على إمام المسلمين في بلده واستحل سفك دماء المسلمين ما داموا يعيشون بين الكافرين أو يعيش الكافرون بينهم, فكم سفكت دماء مسلمين آمنين من أطفال ورجال ونساء في مجمعات سكنية في بلاد المسلمين تحت دعوى أنهم بين كافرين! شرع من هذا؟ ملة من تلك؟ إن ابن لادن هدم بجهله برجي نيويورك فاحتل أمام كل برج دولة كاملة ( أفغانستان، والعراق) وفرش ابن لادن الطريق ورداً أمام بوش لينشر(ديمقراطيته) على رقاب المسلمين قهراً وقسراً شاء من شاء وأبى من أبى, ويأبى الله إلا أن يتم نوره ولو كره الكافرون. فشرع ربنا القويم وسنة نبينا الكريم لازالت تنبض في عروق العلماء من خيار علماء المسلمين الذين نبهوا على ضلال بن لادن وخروجه على منهج أهل الإسلام وجماعتهم.<br />نصيحتي لشباب المسلمين وعمومهم: أقم شرع الله في نفسك وتعلم دينك وسنة نبيك وانشر دينك على بصيرة بالحكمة والموعظة الحسنة, والزم جماعة المسلمين, انصح فاجرهم وعاصيهم بابتسامة طيبة ولين في القول, وليس عليك هداهم والله يهدي من يشاء إنما أنت مُبلغ عن رسول الله. وتعلم من صالح المسلمين وعالمهم, وخالق الناس بخلق حسن, واتبع السيئة الحسنة تمحوها, والزم وصايا رسول الله صلى الله عليه. و إطع ولي أمر المسلمين في بلدك في المعروف فإن أمروا بمنكر! فلا تفعله وادعو الله لهم بالهداية والتوفيق لشرع الله وسنة نبيه وصلاح البطانة خيراً من أن تدعو عليهم فكما جاء في الحديث الشريف(أطيعوا أمراءكم مهما كان فإن أمروكم بشيء مما جئتكم به فإنهم يؤجرون عليه وتؤجرون عليه، ذلكم بأنكم إذا لقيتم ربكم قلتم: ربنا لا ظلم, فيقول: لا ظلم فيقولون: ربنا أرسلت إلينا رسلا فأطعناهم واستخلفت علينا خلفاء فأطعناهم وأمرت علينا أمراء فأطعناهم فيقول: صدقتم, هو عليهم وأنتم منه براء ) حديث صحيح: صححه الألباني في كتاب ظلال الجنة, أنصح إخواني وأخواتي أن يقرءوه. ولا يغرنكم كثرة المهرولين والمتشدقين. قال أحد التابعين ( لم أعجب من الذي هلك كيف هلك؟! ولكن عجبت ممن نجا كيف نجا؟) . فسبحان الله هذا كان قبل ما يزيد عن ألف سنة! فكيف حالنا اليوم.<br />بدعائي أختم كلامي، والسلام عليكم ورحمة الله وبركاته.<br />أخوكم<br />حمدي نوفل<br />HamdyNofal@hotmail.com"
archived = "2006-11-02"
