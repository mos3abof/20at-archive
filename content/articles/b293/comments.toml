text = "يجب أن لا ننخدع وراء الأوهام فبنلادن و الزرقاوي وغيرهما هم مجاهدون الا أن امريكا و من ورائها الغرب استحودو على عقولنافجعلونا نرى المجاهد و كأنه ارهابي بل أكتر من دلك جعلو المسلم يقتل أخاه المسلم فوفرو عليهم دماءهم و أموالهم فادا اردنا هزم أمريكا فيجب أن نهزم خلافاتنا أولا و اللتي هي الأنفاق الرئيسية اللتي تعتمد عليها أمريكالخلق التفرقة"
