subject = "الدنمارك"
author = "mourad"
posted = "2006-01-28"
text = "بسم الله الرحمن الرحيم والصلاة والسلام على أشرف خلق الله<br />أما بعد<br />فان خير الكلام كلام الله عز وجل وَلاَ يَزَالُونَ يُقَاتِلُونَكُمْ حَتَّىَ يَرُدُّوكُمْ عَن دِينِكُمْ إِنِ اسْتَطَاعُواْ } [البقرة:217]،ان ماحصل في الدنمارك لاجريمة لايجوز السكوت عنها فشفيع الامة سيدنا محمد صلى الله عليه وسلم يسب ويهان وتشوه صورته والعرب او بالاحرى حراس الدين الاسلامي من حكام.... واقفون يتفرجون على ما بفعل بالحبيب صلى الله عليه وسلم و لايحركون ساكنا ولا حاكم اسلامي قام بالتعرض لما فعلته الدنمارك ما هدا الخوف يالله الدي اصاب امة العزيز المصطفى صلىالله عليه وسلم<br />واني ياخي بن لادنلا ادعوك من هدا المنبر الحر ان تقوم بالصد لهده الاومور لانك انت العربي الوحيد الدي قال في وجه النصرانية لا لما تفعلونه نعم للاسلام"
