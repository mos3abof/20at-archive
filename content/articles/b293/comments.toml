author = "منى محمد"
posted = "2006-01-25"
text = "بن لادن على حق و انه مجاهد فى سبيل الله وليس ارهابى فماذا فعل كى يقال عنه ارهابى فهو يدافع عن حق المسلمون المسلوب فى العالم كله بل الرهابى هو بوش و شارون لانهم هم الذين يقتلون فى المسلمون دون ان يحاسبهم احد يقضون على الاطفال والنساء دون رقيب ولا عتيب ولكن الله هو الرقيب عليهم ولكن بن لادن يستطبع ان يهددهم لانه سبق ان اعلمهم بقوته وقدرته فى 11 سبتمبر والله يزيد عدد المجاهدين باذنه تعالى لانهم يضحون باموالهم وانفسهم فى سبيل الله لا يريدون الا الشهاده ولكن الامريكان يريدون الذهب الاسود و الاموال والجنود وخيرات البلاد قد يكون اسلوبى غير لائق فى الكلام لاننى فتاه فى الرابعة عشر من عمرى ولا املك سوى الكتابة ولكننى احس بمشكلات كبيره فى مصر وفى الوطن العربى وفى الاسلام بالخصوص"
