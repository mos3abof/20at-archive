[[comments]]
order = 29
subject = "التعليق على رسالة الشيخ اسامة بن لادن حفظه الله ونصره"
author = "المجاهد مع نفسه"
posted = "2006-06-09"
text = "بسم الله الرحمن الرحيم<br />الحمد لله والصلاة والسلام على رسول الله اما بعد:<br />أسأل الله بكل اسم له سمى به نفسه او انزله على احد من خلقه ان يثبت المجاهدين في جميع بقاع الارض وان ينصرهم على عدوهم ويعطيهم سؤلهم وينصر الشيخ المجاهد اسامة بن لادن واتباعه ويرحم الشهداء منهم ويجعل مثواهم الجنة جنات عدن جنات الفردوس<br />من خلال خطاب حبيبي وشيخي بن لادن تظهر كل الحكمة والذكاء الذي الهمه الله لهذا الرجل الذي ما زال يقارع العدو في جميع ارجاء المعمورة<br />فقد وجه خطابه الى الشعب الامريكي ليهزهم في قعر دارهم وهم يقاربون300 ملوين وهو انسان واحد يعيش في ارض مستوية لا في صوامع محصنة لكن بفضل الله ورعايته محفوظ في كل مكان تطأه قدماه<br />في نهاية تعليقي لا يسعني القول الا ان ادعو الله ان ينصر اخوتي المجاهدين في كل مكان في العراق وافغانستان وكشمير والشيشان وفلسطين ويرحم الشهداء الذين اعطاهم الله ما يريدون بعونه وفضله والصلاة والسلام على رسول الله محمد عليه افضل الصلاة والسلام والحمد لله رب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125904/http://www.20at.com/article2.php?sid=293"

