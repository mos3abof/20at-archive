text = "إن سبيل القاعدة هو السبيل الاوحد لنيل العزة والكرامة ، ومن ظن غير ذلك فانما هي مبررات يسوقها لتبرير عجزه وضعفه.<br />وبدلا من القدح في شيخ المجاهدين-حفظه ربي ونصره- ، فلنضع ايدينا بيده ونحارب معه الصلبيين واخوانهم من المنافقين -طواغيت العرب - حتى تنال الامة عزتها وكرامتها .<br />وأم الزعم أن أمريكا في أمان ، فهو زعم باطل ، فهاهي تنفق الاف الدولارات من أجل تحقيق الامن ، واجهزة أمنها تتوجس من كل شي يتحرك ، حتى لو كان هرة في برميل زبالة ، فالحمدلله الذي ابر بقسم عبده أسامة<br />اقرؤوا :\" أمْ حَسِبْتُمْ أَن تُتْرَكُواْ وَلَمَّا يَعْلَمِ اللّهُ الَّذِينَ جَاهَدُواْ مِنكُمْ وَلَمْ يَتَّخِذُواْ مِن دُونِ اللّهِ وَلاَ رَسُولِهِ وَلاَ الْمُؤْمِنِينَ وَلِيجَةً وَاللّهُ خَبِيرٌ بِمَا تَعْمَلُونَ \""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125904/http://www.20at.com/article2.php?sid=293"

