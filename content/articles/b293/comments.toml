subject = "عقلاني: اسامة مش عاجب حمدي ولا نيفين"
author = "أرجو من المعلقين الذين يبثون مقالات لكتاب امريكان أو كفرة ان يقولون لنا ماذا في خلاصة عقولهم بدلا من طرح عصارة عقول الغرب الزريبية.اذا كنتم مقتنعين بفكر كاتب.اكتب المقالة باسلوبك ولنناقشها بدلا من نشر جزء من كتاب لغربي.لا يهمة في النهاية الا تلميع امته ولا يفقة شيئا عن الاسلام."
posted = "2006-01-31"
text = "بالنسبة الي الأخ المشكك في وجود اسامة بن لادن.وتنظيم القاعدة.فلينم في سباته.وليقول لنفسه ياليتني لم اكن بهذا الغباء.الحرب علي افغانستان وعلي العراق ليست مزعومة وهي موجودة حتي من قبل القاعدة.وهل تهز امريكا م كرامتها لتصل الي ادني الدرجات من قبل المجاهدين.ان امريكا فقدت سيطرتها وهيمنتها بعدما اوسع المجاهدون ضربهم لها ولمصالحها.هل امريكا فعلا في حاجة لاختلاق عدو افتراضي وهمي.وهذا العدو يقتل من الامريكان الجنود الالاف!لا ترضي اي قوة الي الزل من اجل بعض المصالح. والادارة الامريكيه متغطرسة بطبعهافبالطبع لن تقبل بالهزيمة الاعلا مية التي تحظي بها الان.<br />الي الاخ حمدي :<br />قلي يا من تقول ان نسف برج التجارة العالمي حرام واستخدام سيئ للاسلام.الم يحرق الرسول من شجر يهود بني النضير حتي يتطعظو اثناء محاصرته لهم! لما لا تقول للرسول هذه هي الميكافيليه.الغاية تبرر الوسيلة.لماذا فعلت ذلك يا رسول الله!<br />قلي.الم تقم دولة امريكا علي انقاض الهنود الحمر.لقد قتلت امريكا ما يقارب من مليوني هندي احمر حتي تقيم دولة العدل .وعندما تشاهد افلام الغرب الامريكي تقول ما هذا الهندي الاحمر البشع الذي يهاجم الامريكان المسالمين وتكون في صف الامريكان وتقول في قلبك فلينتصر الامريكان في الفيلم علي الهنود الحمر البشعين.ولكن الهنود الحمر لم يكونوا الا يدافعون عن انفسهم فقط.امام الغزاه.<br />وقد قلت ايضا\" أي جهاد هذا بغير ولي الأمر أو بإذنه وبغير أمير وتحت أي راية ومع أي جماعة؟\"<br />هل تطلب من المجاهدين اخذ الاذن من ال سعود بمحاربة امريكا .هههههههه.اضحكتني يا هذا.هل تطلب من ال سعود موافقة المجاهدين علي ضرب القواعد الامريكية في السعودية! هيهات.ان نظام ال سعود قائم فقط علي تغطية امريكا لهم.وتذكية منهم.<br />فل لي.هل امريكا عدو! ستقول لي نعم انهم يحتلون ارضنا ويقتلون اطفالنا ويسبون نساءنا.طيب اين اولياء الامور من الأمراء.لم نسمعهم يقولون حي علي الجهاد.لسان حالهم كلسان حالك.ينطقون بلسان العدو .<br />لقد ذكرتني بأقول شيوخ البلاط السعوديين عندما سؤلوا بعدما تنادت اصوات بمقاطعة البضائع الامريكية.وبدأ العرب في تنفيذها \"هل مقاطة البضائع الامريكية حرام ام حلال؟ وكان ردهم.مقاطعة البضائع الامريكية بدون موافقة ولي الامر حرام وطبعا ولي الامر في السعوديه لم يوافق .ههههههه.شيوخ مثل هؤلاء وحكام مثل هؤلاء سيؤيدون الجهادّ!هيهات<br />اما من هو اميرهم.هذا لا شأن لك به لأنه امر اسلامي داخلي لا شِان للمتأمركين به.ولكني اقول لك.لا يهم ان تعرف اميرهم بقدر ما هم يعرفونه.<br />الي الأخ نيفين.لأني لا اعتقد انه بنت علي كل حال.الاجدر ان تدافعي عن مبدأك وهو ان اسامة بن لادن حفظة الله وسدد رماه علي خطأ بدلا من ان تطرحي السؤال كانك علي عدم دراية بأنة علي خطا او صواب ومن ثم تدافعين عن كونه علي خطأ.وتحاوري بجدية وبدليل.بدلا من الاستماع الي قناه العربية.وغيرها من القنوات الامريكية الصنع السعودية التمويل.<br />الي من يعتقدون ان اسامة علي خطأ.أقول لهم اذا تركتم المعصية ومشاهده افلام العري وقنوات الرقص .واذا تحاببتم.واصبحتم مسلمين حقين.يحق لكم في هذة الاثناء ان تقولو انه علي خطأ او صواب.ولكنهم تجلسون امام النت للشات والمواعدات الغرامية وتقولون ان اسامة هذا ارهابي.<br />بما انكم لا تطبقون الاسلام.لا يحق لكم ان تنقضو من يطبقة.<br />وسلامي علي من اتبع الهدي منكم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125904/http://www.20at.com/article2.php?sid=293"

