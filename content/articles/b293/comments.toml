[[comments]]
order = 3
subject = "ايه الحوار..؟؟"
author = "مصــegyـــري"
posted = "2006-01-19"
text = "مش عارف حاسس ان رسالة بن لادن الصوتية دي(حوار) لية<br />ايش ضمننا ان بن لادن هو صاحب الرسالة ؟؟<br />خاصة ان موضوع الهدنة دة طلع امريكا بدور البطل اللي هزم العدو و اجبره على طلب الهدنة ... في نفس الوقت كان رد البيت الابيض عنتري ( ولا للهدنة مع هؤلاء المهزومون )<br />برضو لو تلاحظوا ان البيت الابيض لم يرد على رسالة الظواهري المصورة اللي فاتت بتاعة امته المسلمة رغم انه هددهم برضو<br />في حاجة كمان ملاحظها<br />الجزيرة في كلتا الرسالتين اللي فاتو من الظواهري او من بن لادن .. مقالتش العبارة المعهودة ( لم يتسنى التأكد من صحة الرسالة )<br />يعني تأكدوا من الرسالتين ؟؟<br />مش عارف بس من ساعة الصحفي اليهودي الامريكي اللي استضافه احمد منصور ايام موضوع قصف الجزيرة و قعد يشيد بالجزيرة منبر الحرية ... و موضوع قصف الجزيرة ده نفسة .. خللوني افكر في حاجة<br />مش ممكن يكون الموضوع ده هدفه اعطاء الجزيرة مصداقية مطلقة امام المشاعد العربي و اظهارها بمظهر القناة الحرة اللتي تنشد الحرية حتى و ان هددت بالقصف<br />و ساعتها هنصدق اي حاجة تقولها الجزيرة حتى و ان كانت طلب بن لادن للهدنة مع امريكا !!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125904/http://www.20at.com/article2.php?sid=293"

