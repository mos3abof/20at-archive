[[comments]]
order = 5
subject = "حب أسامة فيصل بين الايمان والنفاق"
author = "مسلم"
posted = "2006-01-20"
text = "إذا كنت تحب أسامة ، فأيمانك في خير ، وإن كان غير ذلك ، فراجع ايمانك ، فلعلك نافقت وأنت لا تدري.<br />وأما خطابه الاخير وما قبل الاخير فهو اعذار للكافرين ، وخاصة الامريكان<br />فهو يقول لهم -حفظه ربي ونصره وسدد رميه - اخرجوا من ديار الاسلام وارفعوا وصايتكم عنا ، تسلموا ، والا ، فانتظروا ضربة كضربة الحادي عشر من سبتمر أو أشد.<br />فإن استجاب الامريكان الكفرة الى مطلب الشيخ ، وفى لهم بما وعد بعدم ضربهم والتعرض لهم ، والا فقد \"جنت على نفسها براقش\".<br />وأظن أن الامريكان لن يستجيبوا ، فقد خالفوه في الاولى عندما نصحهم بعم ترشيح بوش ، فأبوا الا أن يرشحوه ، وأظنهم لن يسمعوا له في الثانية ، ولسان حالهم يقول : أهذا المختفي في كهف من الكهوف يهددنا ، هيهات. أسأل الله أن يرغم أنف يوش واعون بوش من طواغيت العرب.<br />فأن ابى الشعب الامريكى هدنة الشيخ ، فلا ينعق ناعق بعدها -إذا ضربهم الشيخ - بأن هؤلاء ابرياء ، فهؤلاء -الشعب الامركي- مجرمون مع سبق الاصرار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125904/http://www.20at.com/article2.php?sid=293"

