[[comments]]
order = 15
subject = "حتى لا يقف السنة على الحياد في الصراع الاسلامي اليهودي"
author = "دولت ممدوح"
posted = "2006-01-24"
text = "لماذا القاعدة التي قتلت اكثر من مئة الف شيعي في العراق ولم تقتل اسرائيلياً واحداً؟<br />سحق الشيعة في عام 2010 م .. ( مايكل برانت )<br />اسم الكتاب: مؤامرة التفريق بين الأديان الإلهية.<br />اسم المؤلف: الدكتور مايكل برانت.<br />و قد أجريت معه مقابلة مطولة و كشف فيها عن برنامج مدروس لللإستخبارات الأمريكية (C.I.A.)و موجه ضد المذهب الشيعي و الشيعة.<br />و إليكم الآن خلاصة لما جاء في الكتاب المذكور:<br />ظلت البلاد الإسلامية لقرون تحت سيطرة الدول الغربية، ورغم أن أكثر الدول الإسلامية نالت استقلالها في القرن الاخير ، إلا أن أنظمتها السياسية و الاقتصادية و خصوصا الثقافة الاجتماعية ما زالت تحت السيطرة الغربية و تابعة لها.<br />أبان عام 1978 م. نجحت الثورة الإسلامية في إيران ، و سبب ذلك لأمريكا خسائر فادحة.<br />في بداية الأمر كنا نتصور أن الثورة جاءت تلبية لإرادة الشعب المتدين وأن قوادها استغلوا ذلك، واستفادوا من الأوضاع يومذاك، وأنه بزوال الشاه يمكننا الاستمرار في سياستنا عبر أفراد مناسبين لنا.<br />لكن بمرور الزمان و توسع ثقافة الثورة الإسلامية و مفاهيمها و سرايتها لدول المنطقة، بخصوص العراق و باكستان و لبنان و الكويت و دول أخرى ، عرفنا أننا مخطئون جدا في تحليلاتنا السابقة.<br />في إحدى جلسات الاستخبارات بحضور كبار مسئوليها و حضور ممثل للاستخبارات البريطانية (بسبب تجاربها الطويلة في الدول الإسلامية)، توصلنا إلى نتيجة حاصلها:<br />إن الثورة في إيران لم تنتصر بسبب فشل سياسة الشاه تجاهها فقط، بل هناك عوامل أخرى ، مثل قوة القائد الديني و هيبته و استغلال ثقافة (الشهادة)، التي ترجع جذورها إلى حفيد نبي الإسلام (الإمام الحسين ع)قبل 1400 عام، و تروج هذه الثقافة و تمتد في العمق كل عام أيام محرم عبر العزاء الحسيني.<br />كما توصلنا إلى هذه النتيجة أيضا : و هي أن الشيعة أكثر فعالية و أنشط من بقية أتباع المذاهب الإسلامية الأخرى.<br />في هذه الجلسة تقرر القيام بتحقيقات أوسع على المذهب الشيعي، ووضع خطط و برامج منظمة طبق تلك التحقيقات. و قد رصدنا لذلك (40) مليون دولار.<br />و قد تم ترتيب ذلك على مراحل ثلاث:<br />1.جمع المعلومات و الإحصائيات اللازمة.<br />2.تحديد أهداف على المدى القصير، مثل البرامج الإعلامية ضد الشيعة وإثارة الاختلافات بينهم و بين المذاهب الإسلامية الأخرى.<br />3.تحديد أهداف على المدى البعيد، تتكفل باجتثاث المذهب الشيعي من أصوله.<br />عملا بالمرحلة الأولى و تطبيقا لها أرسل محققون و خبراء لتتوفر لنا إجابات عن الأسئلة التالية:<br />أ. ماهي مناطق نفوذ الشيعة في العالم و أماكن تواجدهم؟<br />ب. كيف نثير بينهم الاختلافات الداخلية و نلقي بينهم الاختلاف الشيعي الشيعي؟<br />ج. كيف نثير الخلافات الشيعة السنية، وكيف نستفيد من ذلك لصالحنا؟<br />بعد جمع المعلومات من مختلف مناطق العالم ، و بعد البحث و أخذ و جهات النظر حصلنا على النتائج مهمة للغاية .<br />فقد عرفنا أن قدرة المذهب الشيعي و قوته في يد المراجع و علماء الدين ، و أنهم يتولون حفظ هذا المذهب و حراسته.<br />إن مراجع الشيعة لم يتابعوا و لم يتعاونوا طيلة التاريخ مع أي حاكم غير مسلم أو حاكم ظالم ،<br />*ففي إيران فشلت بريطانيا بفتوى آية الله الشيرازي،<br />*واقتلعت حكومة الشاه الموالي لامريكا من جذورها بيد آية الله الخميني،<br />*و في العراق لم يستطع صدام بكل قواه إجبار الحوزة العلمية في النجف الأشرف على الانقياد له، مما اضطره لتضييق الخناق عليها و محاصرتها سنين عديدة،<br />*وفي لبنان أجبر آية الله الامام موسى الصدر جيوش بريطانيا و فرنسا و اسرائيل على الفرار،<br />كما أن حزب الله لبنان أوجع جيش اسرائيل و ألحق به خسائر فادحة.<br />إن تحقيقاتنا في هذا المجال أوصلتنا إلى نتيجة :<br />و هي أنه لا يمكن بأي حال من الأحوال مواجهة المذهب الشيعي و محاربته بصورة مباشرة، وإن هزيمته أمر في غاية الصعوبة، وأنه لابد من العمل خلف الستار.<br />نحن نأخذ و نعمل طبق المثل القائل : (فرق و أبد) بدلا من المثل الانجليزي ( فرق تسد).<br />من أجل ذلك خططنا ووضعنا برامج دقيقة و شاملة للمدى البعيد، من ذلك رعاية الشخصيات المخالفة للشيعة ، و الترويج لمقولة كفر الشيعة بنحو يفتى بالجهاد ضدهم من قبل المذاهب الأخرى في الوقت المناسب.<br />ومن ذلك تشويه سمعة المراجع و علماء الدين عبر الشائعات و نحوها كي يفقدوا مكانتهم عند الناس و يزول تأثيرهم.<br />من المسائل التي يجب الاهتمام بها مسألة ثقافة عاشوراء و الاستشهاد في سبيل الله، حيث إن الشيعة تبقى هذه الثقافة مضيئة ووهاجة عن طريق مراسم عاشوراء السنوية.<br />لذا صممنا على تضعيف عقائد الشيعة و إفسادها ، و العبث بثقافة (الشهادة)و الاستشهاد، وأن نحرف المفاهيم بحيث يبدو للناظر أن الشيعة ليسوا سوى طائفة جاهلة تهوى الخرافات .<br />و هذا يكون عبر الدعم المالي لبعض الخطباء و المداحين و المؤسسين الرئيسيين لمجالس عاشوراء، فإن فيهم النفعيين و محبي الشهرة.<br />و في المرحلة الآتية يجب أن نجمع و نعد الشيء الكثير مما يسقط المراجع ، و نبث ذلك بلسان و قلم الكتاب النفعيين.<br />والأمل معقود على إضعاف المرجعية بحلول 2010م و من ثم سحق مراجع الشيعة بيد الشيعة أنفسهم و ببقية علماء المذاهب الأخرى، و في النهاية نطلق رصاصة الخلاص على هذا المذهب و ثقافته."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125904/http://www.20at.com/article2.php?sid=293"

