text = "بن لادن .. جدي يقرأك السلام ويقول لاتتهاون مع الصلبيين الكفره وعجل عليهم بضربات منك .. وليس بظربات الايلحه او الصواريخ عجل عليهم بدعاء افنيهم بدعاء وانته انسان حكيم وشيخ يخاف الله .. وجدي يقولك انته صحيح لم تفارق افغانستان ولا رميت رصاصه صوب امريكا لكن هذا دعاك ضد امريكا واليهود هم من يفعل ذالك وقصدهم تشويهك وتشويه سمعتك كمجاهد مخلص لربه .. ونحن نقول لك ومعك اننا ندعي بقلوب مؤمنه بقضاء الله واننا لسوف نحارب امريكا بدعائنا وقيام الله سهام لاتخطي"
