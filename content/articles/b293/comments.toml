text = "الله يعز الاسلام بأسد الامة ابا عبد الله اسامة قاضي مضاجع الاحتلال و أذنابه من روافض و مرتدين لا مكان لكم يا من تتهمون قادتنا في الارهاب يا متسكعين العصر<br />هنياا لكم اربابكم الامريكان و لعق سرامي الاحتلال هنياا لكم الدنيا و ما فيها من نعيم نحن تركنا الحضارة و الديمقراطيه لكم و ذهبنا الى الكهوف نعد اصابعنا<br />( لو كانت الحضارة في التعري فلقد سبقتنا البهائم )"
