text = "لكل من تمنا ان يموت شهيدا, اخلص الدعوات ان تنال ما تتمنأ,,,ولكل من تمنأ ان يكون في لفردوس الاعلى عسى الله ان يجعلك من من ينالوا ريحهاويحضوا بقرب النبي الكريم,,,<br />___ ولكن كل الاماني مجرداماني ___<br />___ ولكن هناك اماني تتحقق ولاكن بهمت اصحابه لذالك اسعى لكي تنل ما تمنيت__<br />(((( وامنيت ليست امنيه ولكن دعاء)))<br />اللهمااني اسالك الفردوس الاعلى,وان تتوفني مسلمن حنيفا وما انا من المشركين, ياكريم يارب ارزقني موتت الشهد, ولقاء الانبياء----- امين امين,, اخي اختي اذا ما دعوتم الله حسن الخاتمه فسأل الله لي معك و لا تحرمني من فضل دعاك..."
