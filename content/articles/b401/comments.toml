subject = "اموت موته رومانسيه"
author = "أرجوان"
posted = "2006-02-06"
text = "بجد ممكن تعتبروها هايفه اوى بس عندى حاجه نفسى فيها...نفسى اموت بعد ما يكون حد قريب منى اوى ظلمنى جدا زى مثلا زوجى او خطيبى...و اكون انا المظلومه فى الموضوع و بعدين اتعب اوى بسببه او تحصلى حادثه جامده و هو بعرف فيجى المستشفى و لكن متاخر فى الاواخر و الدكتور يقول انى كان وجهى مشرق اوى و مبتسمه ابتسامه ملائكيه و اموت بالراحه و من غير ازعاج و بعدها هو يحس بغلطته و يعرف قد ايه هو كان غلطان فى حقى و يعيط عليا جدا هو و اهلى...و فى الاخر اروح الجنه.<br />من الاخر موته زى موته الطفله ياسمين الى شافت الملايكه.<br />شكرا على الموضوع ده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113456/http://www.20at.com/article2.php?sid=401"

