[[comments]]
order = 10
subject = "انا بئة حاجة تانية"
author = "سارة سليمان-18-"
posted = "2006-02-09"
text = "انانفسى بجد اموت وارتاح من اللى فى الدنيا دى كل واحد فيها بيحب نفسة والناس لوحدهاالحلو فيهم عايز يربى ولادة صح فيعزلهم عن العالم فبيطلعوا للاسف جاهلين فبيبقوا ممكن متعلمين دينهم لكنهم منعزلين عن العالم مالهمش دور ولا لازمة واما الوحشين اللى بيكلوا فى بعضهم اكل -ربنا يحفظنا-ولذلك انا قبل ما اموت نفسى انى اكون ختمت قرانى وانى اكون عملت حاجة تفيد دينى وبلدى ويكون ليا رسالة مفيدة اقابل بيها رسولى وربى باذن اللة اما عند الموت فانى اتمنى انى اكون تائبة وانى القن الشهادة وربنا المستعان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113456/http://www.20at.com/article2.php?sid=401"

[[comments]]
order = 11
subject = "لا كدة مش صح"
author = "سارة سليمان -اداب لغة عربية-18"
posted = "2006-02-09"
text = "احنا بنحب رسولنا اة وبنحبة اكيدبس مش كدة الدعاء بيكون والمفروض اننا ندعيلهم بالهداية لانهم لللاسف جاهلين مش فاهمين جمال الاسلام وحلاوتة ولا رسولنا واخلاقة ونبينهلم بتصرفاتنا وتحضرنا احنا مين لانهم بيستحقرونا لاننا بجد ما فيش لينا اى نهضة ومافيناش غير كلام واحنا امة بنعمل قبل ما نتكلم احنا امة الرسول الحبيب فيلا بئة عشان نفوق ونوريلهم احنا مين ومتهيائلى لو الرسول موجود كان دو هيبئى راية -انتوا عارفين اهو احنا كدة بنحققلهم اللى هما ايزينة عشان هما عايزنا بالهمجية اللى اظاهرة حاليا من تخريب وحريق وانتوا فاهمين-عموما ربنا معانا اكيد وهو المستعان ومنة التوفيق وماتنسوش الاية اللى بتقول فيما معناها ان اللة لا يغير ما فى قوم حتى يغيروا ما بانفسم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113456/http://www.20at.com/article2.php?sid=401"

