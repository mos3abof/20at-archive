text = "انا بقة مش هقولك شهيدة ولا غيرة انا عايزة اموت على حسن خاتمة وتاهلنى لدخول الجنة بس ياريت قبل ما اموت اتمنى انى اشوف الاسلام فى عزة ورفعة والنبى محمد مكرم من الجميع ولواء الاسلام يرفرف فى كل مكان فى الارض وبعدها اموت كدة هكون مستريحة وبجد شكرا على سؤالك"
