[[comments]]
order = 6
subject = "نهاية كل حي..فماذا أعددت لها؟؟؟"
author = "شهيدة بإذن الله طال عمرها وحسن عملها..يا رب"
posted = "2006-02-07"
text = "وكأن بالداع يبكي عليه اقربوه<br />وكأن القوم قد قا موا فقالواأدركوه<br />سائلوه كلموه حرِِكُوه لقنوه<br />حرفوه وجهوه مددوه غمضوه<br />عجلوه لرحيل عجلوا لا تحبسوه<br />ارفعوه غسلوه كفنوه حنطوه<br />فإذامالف في الأ كفان قالوا فاحملوه<br />أخرجوه فوق أعو ادالمناياشيعوه<br />فإذا صلوا عليه قيل هاتوااقبروه<br />فإذامااستودعوه الأرض رهنا تركوه<br />خلفوه تحت رمس أوقروه أثقلوه<br />أبعدوه أسحقوه أوحدوه أفردوه<br />ودعوه فارقوه أسلموه خلفوه<br />انثنواعنه وخلوه كأن لم يعرفوه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113456/http://www.20at.com/article2.php?sid=401"

