text = "بفضل اموت فى الحج بعد الحج مباشره<br />ولكن شى فى نفسى يحدثنى انى افضل ان اموت بعد ان اعمل شى مفيد جدا للاسلام والمسلمين واتزوج وانجب اطفال يحملون الاسلام ورسالته العظيمه<br />وبعد هذا لا يهمنى كيفيه الوفاه ولكن الاهم هو ان اموت وربنا راضى عنى<br />ولكل من يقرأ تعليقى بالله عليك تدعيلى ان الله يهدينى ويتوفانى وهو راضى عنى وبعد ان اتم الرساله واتممها بالذريه الصالحه قولوا امين"
