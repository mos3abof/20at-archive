subject = "الشهاده طبعا"
author = "يا رب أموت شهيده شهيده من أجل أن تكون كلمة الله هي العليا و كلمة الذين كفروا السفلى .و طبعا لا أغسل و يا رب أدخل الفردوس الأعلى و أكون بجوار حبيبي المصطفي صلى الله عليه و سلم و ياخد ايدي و يوريني مكاني في الجنة و يقولى انتى فعلا كنتى بنت مسلمة كما يجب أن يكون المسلم."
posted = "2006-02-07"
text = "يارب أنت القادر على ذلك . اللهم أعني على ذكرك و شكرك و حسن عبادتك و هبني العمال الصالحة التي تدخلني بها الفردوس الأعلى يارب العالمين"
