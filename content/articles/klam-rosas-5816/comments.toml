posted = "2007-05-14"
text = "في بلد لا يحكم فيه القانون<br />لا يوجد مستقبل<br />في بلد يمضي فيه الناس إلي السجن بمحض الصدفه<br />لا يوجد مستقبل<br />في بلد يتمدد فيه الفقر كما يتمدد ثعبان في الرمل<br />لا يوجد مستقبل<br />في بلد تتعرى فيه المرأة حتى تآكل<br />لا يوجد مستقبل<br />( مقطع من مسرحية ليلي والمجنون- للراحل صلاح عبد الصبور"
