text = "على فكره يا بتوع عشرينات … كل يوم مصداقيتكم بتنهار قصاد عينينا … لإني فعلا … لاقيت موضوعات كتير عندكم … منقول ( أو ملطوشه بمعنى أصح ) … من عدة مواقع أخرى محترمه وبيكتب فيها كتاب تقال جداً …عيب عليكم قوي قوي … يا أصحاب التوجه الاسلامي انكوا تسرقوا جهد وأفكار الاخرين …هايبقي فيها ايه يعني لو أشرتم للمصدر الاصلي ولا هو عيب … او حتى تضيفوا عباره نقلاً عم موقع كذا او كتاب كذا<br />ولا أنتم ماسمعتوش عن حاجه اسمها حقوق الملكيه الفكريه … وصدر ليها قانون محترم هنا في مصر وممكن تتعرضوا بسبب هذه التعديات على حقوق الغير للمساءله القانونيه ولعقوبات ماديه وقضايا وكده يعني"
archived = "2009-05-09"
capture_url = "https://web.archive.org/web/20090509191057/http://www.20at.com:80/klam-rosas/5816.html"
