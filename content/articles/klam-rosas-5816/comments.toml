author = "نيفين نيفى نوفا"
posted = "2007-05-12"
text = "اولا لازم اوجه شكر ليك يا ندا على الموضوع الجميل و التعبير الاجمل و الاسلوب الرائع اللى يناسب صلاح عبد الصبور..مين فينا متاثرش بماساه الحلاج و معرفش منها صلاح عبد الصبور الحدوته المصريه الشهريه اللى فارقتنا قبل الاوان و اللى بتفكرنى بأمل دنقل الزهره الجنوبيه اللى قطفها الفقر و المرض<br />كمان امتاز بترجماته المميزه للكتير من الادب العالمى زى البناء العظيم لابسن و غيرها<br />و فعلا امتاز عبد الصبور بالالفاظ الخنجريه اللى بتلائم الحزن بجميع انواعه و اللى منه بتنبت كل التجارب الشعريه الناجحه<br />اه ليس هو الليل<br />لكنه الخوف<br />ينزف دما اسود<br />فى الصبح المقبل<br />هذا هو صلاح عبد الصبور"
archived = "2009-05-09"
capture_url = "https://web.archive.org/web/20090509191057/http://www.20at.com:80/klam-rosas/5816.html"

