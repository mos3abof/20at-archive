posted = "2007-05-22"
text = "مجرد استفسار يا أستاذ أحمد ندا ممكن؟<br />المقال ده مجرد تلخيص واقتباس صريح لمقال طويل وبديع للدكتور خالد منتصر في إيلاف عن الأستاذ صلاح<br />فيا ترى ليه كاتب اسمك فوق<br />واحد<br />لأنك مألف المقال ده وأنا بتبلى عليك؟<br />مظنش لأن اللينك أهو<br />http://cheikh-imam.net/Lu%20PourVous/SalahAbd%20Assabour.htm<br />اتنين<br />لأنك عاملها مسابقة وبتشوف مين اللي هيعرف مؤلفه الحقيقي وياخد جايزة؟<br />تلاتة<br />لأنك كاتب الاسم الحقيقي للمؤلف في النص وأنا مشوفتوش؟<br />أربعة<br />لأن إنت والدكتور خالد نفس الشخص بس ليه اسمين؟<br />خمسة<br />لأنك بتستسهل وبتتعامل مع القارئ كأنه حمار ومش هيدور وراك فتقوم جايب أي كلام حلو مكتوب من سنتين وتلخصه وتحط اسمك عليه؟<br />ستة<br />لأنها سرقة صريحة وطظ في القراء وفي المؤلف الحقيقي؟"
archived = "2009-05-09"
capture_url = "https://web.archive.org/web/20090509191057/http://www.20at.com:80/klam-rosas/5816.html"

