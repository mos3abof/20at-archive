posted = "2007-05-10"
text = "ياااااااااااااا اااه يأستاذ أحمد فتح الله عليك فعلاً … مقال رائع عن اقرب الشعراء إلي قلبي<br />صلاح عبد الصبور حالة خاصه جداً في تاريخ الشعر العربي ، هذا الشاعر كان له قاموسه الخاص ومفردات شعريه وتراكيب لغويه مذهله لم يمتلك أحد من قبله ولا من بعده.<br />ياااااااااااااا اااااه على مسرحه الشعري … تعيش معه في حاله من اللاوعي …\" ليلي والمجنون\" مأروعها شخصية \"سعيد\" وأجمل مقاطعها عندما كان البطل يروي قصيدته الشعريه على زملائه بعنوان ( يوميات نبي مهزوم ينتظر نبي يحمل سيفاً ) … ياااااااااااااا اااه على رائعته \" مأساة الحلاج\" التي أقرؤها كل فتره وأحس والله أني أقرؤها للمره الأولى ( تقتلني حوارات الحلاج مع رفيقه في السجن )<br />\"مسافر ليل\" ( مقطع محاكمة الراكب ) …وغيرها من الروائع \"الاميره تنتظر\" و \" بعد أن يموت الملك\"<br />يأ اخي ان لا افهم كيف لم تدرس لنا هذه الكنوز الشعريه في مراحل دراستنا الثانويه بدلاً من شعراء في نظري \" أقل منه قيمة بكثير\" ورغم ذلك يحتفى بهم ايما أحتفاء<br />أتمنى منك أن تتفرد مقاله او مقالات كامله عن \" مأساة الحلاج \" التي من وجهة نظري من اعظم المسرحيات الشعريه في العالم ولا تقل في قيمتها الفنيه عن أعمال وليم ش[ *** ]بير أسطورة المسرح .<br />حقاً أصبت فقد مات صلاح عبد الصبور قبل أن تحين ساعته ، و أكل لحمه ميتاً عندما لم تحتفي به الدوله الاحتفاء اللائق به ( عارف أحتفت بمين يا أستاذ أحمد برموز الفن في هذا الزمن سعد الصغير ، وعمده ، بعرور … وغيرهم )"
archived = "2009-05-09"
capture_url = "https://web.archive.org/web/20090509191057/http://www.20at.com:80/klam-rosas/5816.html"

