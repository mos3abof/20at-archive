author = "مسلمه تحب النبى صلى الله عليه"
posted = "2008-02-27"
text = "الامحمد رسول الله صلى الله عليه وسلم اللهم عليك بهم من انتم يا احقر المخلوقات حتى تسيؤا لخير البشر اقسم بربى ورب محمد صلى الله عليه وسلم لسوف ياتى اليوم الزى يعض فيه الظالم على يديه ويقول ياليتنى كنت ترابا فداك يا فداك يا خاتم الرسل كفوا عن الاساءة للرسول يا اعداء الله سحقا لكم ثم سحقاوبعدا اللهم احرقهم دمرهم والله لقد سبح الحصى فى يد الر سول صلى الله عليه وسلم فالحصى يعرف للرسول قدر ه اما انتم كالانعام بل اضل سبيل<br />اللهم صلى على سيدنا محمد وعلى ال سيدنا محمد افضل واتم التسليم لااله الاالله محمد رسول الله"
archived = "2009-06-12"
