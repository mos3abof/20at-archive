posted = "2007-05-24"
text = "محمد ممتاز -بيبو<br />المقال هايل فعلا و احلى حاجه فيه ان فعلا الصورة واضحة جدا جدا ..فعلا فى ناس كتير محتارة اذا كانت البنات هى المسئولة عن الفراق فى علاقات الحب و لا الاولاد ..بس مدام العلاقة مش مبنية على اسس سليم فهى متوقع انها تزول او تنتهى ..الموضوع هايل جدا و بجد ابتديت اتابع المواضيع بتاعتك يا مدام دعاء"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725043606/http://www.20at.com:80/masr/t7kyk/5994.html"

[[comments]]
order = 6
subject = ""
author = "نيفين نيفى نوفا"
posted = "2007-05-26"
text = "انا متضايقه انزلى حالا عايزه اقابللك..حاضر يا نيفى مقدرش اقول لا..عايزاكى يا نيفى علشان نفكر سوا بصوت عالى..اوكى يا … بس البسى الطقم الزيتى علشان نبقى زى بعض..يا …ايه رايك ف الفكره دى …نيفين باين عليكى بتخرفى انزلى قابلينى علشان شكللك عايزه تتربط كام صموله ف عقللك انهارده…ده جزء من حوارى مع انتيمتى و هى هتعرف نفسها لو قرات الكلام ده ..هى دى الصداقه..ايام نتقابل نتكلم و ايام نتقابل نضحك و نحضن الدنيا و ايام نتقابل نعيط سوا..و ناكل ايس كريم ف ديسمبر و نمشى تحت المطر او ف عز الشمس و يقول لنا كل اللى يقابلنا انتو اخوات و نرد نقوا اكتر..لان الواحد مبيختارش اخواته بس بيختار صديقه..هى الانسانه دى بالذات دلوقتى بالذات بحس انى عايزه اقولها كلا م بالذات ..وفيه كلمه دايما كنت بقولها لكل اصدقائى<br />(الحب رغم قسوته هو الاحلى و الصداقه رغم ندرتها هى الاغلى)<br />و الانجليز بيقولو friend in need ,is friend indeed<br />و العرب بيقولو الصديق وقت الضيق<br />و حكايه ان الصداقه مرتبطه بزمان او مكان او اسباب دى حاجات غلط..و ان انهاء الصداقه مرتبط بكون الشخص ولد او بنت ده برده غلط<br />هى شراره كده بتتولد بين اتنين و كيميا خاصه بتتوافق مع بعضها و مش مرتبطه بوقت بس انا بعتبر الصداقه زى عطر كل ما يمر عليه وقت تزداد قوته<br />ناس تانيه بتعتبر قوه الصداقه بعمقها و بالمواقف اللى بتاكدها حتى لو تعارف الشخصين مر عليه وقت قصير<br />و ده برده صح لان ياما صداقات استمرت سنين و انتهت فى لحظه و ياما صداقات بدات ف لحظه و استمرت سنين<br />و ف الحالتين مفيش تفسير الا ان هى دى النفس البشريه اللى تعتبر اعقد من اعقد تطور تكنولوجى ممكن يوصل اليه العقل البشرى<br />حاجه كده ملخبطه و مبفهمهاش الا اللى خلقها"
archived = "2009-11-18"
capture_url = "https://web.archive.org/web/20091118174632/http://www.20at.com:80/banat/variety/5989-2009-11-04-14-44-08.html"

[[comments]]
order = 7
subject = ""
author = "مش مهم/ اقدم اصدقاء موقع ولاد"
posted = "2007-05-28"
text = "معلش ما تزعليش من المعلق الاول بس تعليقه نزل قبل كده بنفس الكلام وكان اسمه زعبله السادس عشر انا فاكر كويس المهم كويس الموضوع ان الموضوع طلع عن الجواز علشان خاطر ابارك لحضرتك اصل انا على ما يبدو اعرفه بس مش متأكد اذا كان عنده مدونه اسمها وانا مالي يبقي هو<br />الف الف الف مبروك<br />انا طبعا خارج مصر ولو كنت جوا مصر كنت جيب اباركلهم"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725043606/http://www.20at.com:80/masr/t7kyk/5994.html"

