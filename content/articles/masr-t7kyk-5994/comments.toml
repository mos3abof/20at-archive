author = "دعاء الشامي"
posted = "2007-05-23"
text = "الى الاستاذ اسحق هارون، بصراحة تعليق حضرتك خلاني بجد اموووووووت من الضحك رغم انه يشتمل على سب وقذف وفقا للقانون المصري بس يلا هاعديها، بس حبيت ادخل اعلق لحضرتك لانك واضح انك متعرفش مين هي دعاء الشامي من الاصل ولا حتى بتقرأموضوعاتي واذا كنت بتقرأها مكنتش قلت الكلام اللي قلته بس عموما خلينا مع حضرتك لحد باب الدار على راي جدتي الله يرحمها…<br />مبدئيا انا ضد مواصفات البنت اللي حضرتك قلتها زي الماكياج وتسريحة الشعر واللبس والحاجات دي لاني ضدها تماما الحمد لله انا محجبة ومش باحط ماكياج وبالبس اللي يريحن بعيدا عن كونه موضه ولا مش موضه<br />ثانيا حضرتك انا متجوزة الحمد لله ، واذا لم اكن كذالك فلست انا من تبحث عن الزواج بهذه الطريقة الرخيصة<br />ثالثا اعتقد ان حضرتك تركت الموضوع الرئيسي وهو هل البنات اندال ولا لا وانجرفت الى موضوع شخصي لا يحق لك ان تتحدث فيه تحت اي ظرف من الظروف<br />في النهاية اشكرك على وقتك ومجهودك الذي افنيته في كتابة التعليق وارجو ان تعرف جيدا ما تكتب يدك لانك ستحاسب عليه والا ترمي الناس بالاتهامات والصفات"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725043606/http://www.20at.com:80/masr/t7kyk/5994.html"

