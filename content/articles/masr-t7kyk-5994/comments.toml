text = "يا دعاء اهتمى شوية بنفسك والبسى حاجات كدة على المودة وغيرى الاستيل بتاع تسريحة شعرك<br />وتقلى المكياج شوية<br />يمكن واحد ينطس فى نظرة ويكون ما بيشفوش الوان<br />ويفكر يتقدم ويخطبك<br />وتبطلى تكتبى مواضيع هايفة خالص ونفرح احنا ونرتاح وانت تغسلى الغسيل وتنضفى البيت<br />الهى تكون دعوة مستجابة"
