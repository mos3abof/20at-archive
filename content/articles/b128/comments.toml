[[comments]]
order = 0
subject = "محدش يعرف ابن رشد"
author = "ياء"
posted = "2005-12-21"
text = "كانت هذه احدى الجمل الضاحكه التى اطلقا الاستاذ عصام العريان فى بدايه الندوه عندما قال ان الناس لا يعرفون ابن رشد اما الجمله الثانيه عندما سؤل ( ماذا سيفعل الاخوان فى البرلمان ) قال كل خير .<br />الذى اعجبنى فى الندوه الحوار الهادى الذى يؤدى الى نتيجه بعكس ندوات التلفزيون المصرى وضيوفه الذى تشعر وانت تتابعه انه فهم الاخوان وحكم عليهم وينفذ الحكم فى الهجوم بدون ان يستمع الى اى شخص منهم او حتى يستضيف اى من الاخوان<br />شدنى ايضا ملاحظه الاستاذ عصام سلطان انه جاء الوقت على الاخوان ان يطلبوا من الاخر( المعارضين لهم ) ان يبينو موقفهم من الحريات بعد ان حاولوا اقصاء الاخوان وان يقولوا موقفهم من التعدديه الحزبيه<br />ولم اقتنع بان الاخوان المسلمين يقدمون مصلحتهم الخاصه على مصلحه الوطن كما قال القائل فكل الدلالات تشير الى ان الاخوان يقدمون المصلحه العامه والدليل تطبيق مقوله المشاركه لا المغالبه فهم لم يرشحوا 400 فرد للانتخابات مثلا بل رشحوا اقل من ثلث اعضاء المجلس واخلوا بعض الدوائر لرمز المعارضه.<br />لا ننسى الشكر لقناه الجزيره مباشر التى نقلت لنا هذه الندوه الجاده بعكس التلفزيون المصرى الذى لايستطيع ان ينقل الا ندوات من يختارهم ويختار ايضا كلامهم على هوى الحزب الفاسد الحاكم<br />yehia2784@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145023/http://www.20at.com/article2.php?sid=128"

[[comments]]
order = 1
subject = "الفهم الصحيح للإخوان"
author = "أعترف أنني كنت من الكثيرين الذين اتخذوا موقف عدائي للإخوان دون مبرر و ذلك للفكرة القديمة عنهم بأنهم يريدون السلطة فقط و أنهم سوف يقفون أمام حرية الآخرين بإسم الدين . و لكني عندما سمعت برامجهم الانتخابية و وجدت مواقفهم الشريفة مع الإحزاب الأخرى و التحليلات الموضوعيه للدكتور عصام العريان و مواقفهم من الفن الجيد و من حقوق الأقليات في مصر تغيرت أفكاري عنهم تماما و أصبحت أرى انهم هم المعارضة الحقيقية الموجودة الآن في مصر ."
posted = "2005-12-21"
text = "أدعوا الله أن يجدوا الفرصة لتحقيق برامجهم دون تحجيم من الحكومة خاصة و أن الانتخابات أثبتت بما لا يدعو مجالا للشك أنهم قوة لا يستهان بها في الشعب المصري و أن شعبيتهم في ازدياد.أتمني أن يكونوا بالفعل كظني فيهم و ألا يخيبوا ظن الشعب الذي وثق فيهم و أعطاهم صوته."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145023/http://www.20at.com/article2.php?sid=128"

[[comments]]
