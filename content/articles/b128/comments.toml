subject = "الله اكبر ولله الحمد"
author = "شباب الاخوان"
posted = "2005-12-21"
text = "نعم الله اكبر ولله الحمد نعم هى لله هى لله مش علشان منصب ولا جاه كل يوم يزيد حب الناس للاخوان ويزيد احتكاك الشارع بهم ويعرفون اهم ولله الحمد اطهر ايادى وانفع الناس للناس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145023/http://www.20at.com/article2.php?sid=128"

