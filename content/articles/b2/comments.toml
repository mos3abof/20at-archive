[[comments]]
order = 2
subject = "كلمت حب"
author = "ابراهيم المصرى"
posted = "2006-04-12"
text = "حـــبــيــبــتــي<br />لولاكي .. لما شعرت بأن الدنيا لها معنى اجمل<br />لولاكي .. لما استطعت انا اشعر بجمال الكون من حولي<br />ولولا .. حبك لما بقي في قلبي نبضة حياة<br />لو تعلمي فقط مقدار عشقي المجنون<br />لو تعلمي اني اعيش كتائه يبحث عن حبيبته الغائبه<br />يبحث عن أي شئ يحمل اسمك او حتى شذاك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114714/http://www.20at.com/article2.php?sid=2"

[[comments]]
order = 3
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-17"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114714/http://www.20at.com/article2.php?sid=2"
