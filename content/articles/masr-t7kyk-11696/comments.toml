text = "مين قاللكمإن الكنترول مجهز ومريح وبه وسائل الراحة وتكييفات دي إشاعات التكيفات لها ناسها والمراوح منتهية الصلاحية وأجهزة الكمبيوتر عدي عليها الزمن وولى ياناس لازم يون فيه صراحة<br />الكنترول عبارة عن سجن للمصححين تهذيب وإصلاح روحوا شوفوا بنفسكم واحكموا والمعاملة لاتليق بآدمي ووسائل الراحة ليس لها وجود بالمرة فيه"
