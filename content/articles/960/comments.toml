[[comments]]
order = 0
subject = "جميل"
author = "محمد صالح"
posted = "2006-01-03"
text = "السلام عليكم ورحمة الله وبركاته<br />التقرير بالفعل جميل ويشير الى ان المعاناة الفلسطينية ما زالت قائمة، والسب الاحتلال، الزوايات التي تناولها التقرير متنوعة، غير لا تعكس سوى الم الماساة التي يعيشها الفلسطينيون حقا، واسال الله عز وجل ان يذل اسرائيل."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125617/http://www.20at.com/article2.php?sid=186"

[[comments]]
order = 1
subject = "مالكم عنا"
author = "فلسطينى"
posted = "2006-01-03"
text = "انتو يالمصريين ماتحكو معنا او عنا<br />نحنا ما نحبكن نحنا كتير نكرهكن ليش بدكم الحكى عنا<br />المصريين خونة وما يحبو الفلسطينين ابدا وما بقفو بجانبهم وقفة جادة<br />اذن بعدو عنا يرحمكم اللة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125617/http://www.20at.com/article2.php?sid=186"

[[comments]]
order = 2
subject = "انا مصرى"
author = "مصرى"
posted = "2006-01-03"
text = "وانت مين قالك يلا انت انحنا بنحبكم<br />احنا لا بنحبك ولا عاوزين نعرفك يا فلسطينى انت<br />احنا المصريين انضف منك وانتو اللى تبعدو عنينا مش احنا انتو اللى لازقين فينا<br />ما تروحو بعيد يلا<br />قال نحبكم قال ؟؟؟ لية ناقصين مرار وكابة احنا ولا اية<br />وبعدين انتو مش مستوانا اصلا اننا نحبكم<br />اصحى وفوق يلا قبل ما تتكلم مع اسيادك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125617/http://www.20at.com/article2.php?sid=186"

[[comments]]
order = 3
subject = "مسلميييييين"
author = "اردنيه"
posted = "2006-01-03"
text = "اخص ..فعلا انه اللي بعتوا (مالكم عنا و انا مصري )عار على الفلسطينيين والمصريين لانه احنا قبل ما نكون اردنيّه اوفلسطينيّه او مصريّه احنا مسلميييييييييييييييييييييييييييييين<br />والله انكم على راسي من فوق وانا بحبكم كتتتتتتتتتتترما تزعلوا يا فلسطينيين يا حبابين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125617/http://www.20at.com/article2.php?sid=186"

[[comments]]
order = 4
subject = "صح يا مصرى"
author = "انا انا"
posted = "2006-01-03"
text = "واللهى يا اردنية ان مع المصرى<br />كل كلاامة صح هما قارفين عشتنا ومدايقينا وجايين بعدين يقولولنا مالكوم بينا<br />سبحان اللة<br />وبعدين انتى مالك يااردنية بتحبية اوى روحيلو يااختى يلاا روحيلو مانتى زية<br />واحنا ياستى متبريين من امثالك اوكى<br />جاتك نيلة انتى وهو وانتو شبة بعض"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125617/http://www.20at.com/article2.php?sid=186"

[[comments]]
order = 5
subject = "والله برافو عليكم"
author = "السلام عليكم"
posted = "2006-01-03"
text = "ابدا كلامى بسلامى اليكم جميعا<br />واعاتب اولاً المصرى لانى زيه مصريه كيف تجرو على ان تقول لفلسطينى انك تكرهه وهم يستحقون كل احترام وتقدير رغما عن انف الجميع ولو كنت عشت يوم واحد معاهم لكنت بكيت ودعيت وثورت وما استحملت انك تكون معاه كمان وتدافع عنه قبل منه<br />ويا فلسطينى ليه بتقول كده دى انتم فى قلوبنا بجد وكتيييييييييير من المصريين انت وبلدك شغلهم الكبير فى حياتهم ازاى ننساكم ازاى ننسى ارضكم ازاى ننسى مسجدنا ومسرانايا فلسطينى انا الشمس لما بتشرق عندى والله اتذكركم واقول كيف تشرق نفس الشمس هذه عندهم<br />ما تشمتوش فينا اعدائنا رغبة منهم بفرقتناوسياستهم معروفه فرق لتسد<br />وشكرا لكم جميعا واحبكم من كل قلبى<br />\"اللهم اشف صدور قوم مؤمنين\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125617/http://www.20at.com/article2.php?sid=186"

[[comments]]
order = 6
subject = "انا مع المصرى"
author = "مروة المصرية"
posted = "2006-01-03"
text = "لا انا مع المصرى بصراحة<br />لاان الفلسطينى هو اللى غلط فينا وموش عارفة لية؟؟؟؟<br />دا بدل مايشكرنا احنا المصريين على مواقفنا القوية مع بلادهم لا دا جاى وعمال يهبل فى الكلام<br />لا ليك حق يا مصرى لازم ندافع عن مصر مش واحد زى اخيينا دا يجى يشتمنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125617/http://www.20at.com/article2.php?sid=186"

[[comments]]
order = 7
subject = "وانا فلسطينى ايضا"
author = "وانا فلسطينى"
posted = "2006-01-04"
text = "انتو هيك يالمصريين<br />كلتكم هيك خونة والخيانة بدمكن<br />ليش ما بعرف ؟؟؟<br />انتو عار على العرب كلتهم ونحنا انضف منكن<br />كفانا فخرا اننا عم نحارب بايدينا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125617/http://www.20at.com/article2.php?sid=186"

[[comments]]
order = 8
subject = "مسلمين"
author = "اردنيه"
posted = "2006-01-17"
text = "انا يا (انا انا)ما بهمني اذا كنت بتتبرى منى او لأ ...وعلى كل حال كلك ذوق وشكرا على المسبات اللي بتعبر عن شخصيتك ...بعدين صحيح كيف الفلسطينيه قارفين عيشتكم يا بعدي !!فعلا اخص..... مع كل الحكي اللي حكيته هدا ما بخليني اكره المصريه لانه تعاملي مع واحد ما بيسمحلي انه احكم عالكل ....وبعدين انت بتحمي ليه بحب الفلسطينيه ...احكيلك ليه ..لانهم اولا مسلمين وتانيا حبابين وبينحبوا مش بس شوي كنييييييييييييييير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125617/http://www.20at.com/article2.php?sid=186"
