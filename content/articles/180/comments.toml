subject = "بيرو ...نقلا عن مايكل مورو"
text = "يعلم العالم كله أن بوش الابن يضع إصبعه على الزر الذي يمكن أن يفجر العالم كله، ونعلم أيضا أن أي قرار يتخذه يكون له تبعات واسعة وبعيدة المدى بالنسبة لاستقرار العالم.<br />لكل ذلك، ولأشياء أخرى غيرها أطالب (الرئيس) أن يرد بإجابات شافية عن الأسئلة الثلاثة الآتية:<br />السؤال الأول:<br />هل تستطيع يا جورج القراءة والكتابة كشخص حصل على أي مؤهل علمي؟<br />إنه لشيء مؤسف بالطبع ومحزن أيضا أن تكون أميا. وإن كان ذلك لا يعني أن يقتلك الشعور بالخزي، لأنك بذلك تكون مثلك مثل ملايين من الأمريكيين ممن لا يستطيعون القراءة والكتابة فوق مستوى الصف الرابع الابتدائي.<br />لكن ما دمت قد استطعت أن تجلس على مقعد الرئيس لأكثر دولة حرة في العالم، فدعني أسألك: إذا كنت تجد صعوبة في فهم الأوراق التي تصلك، فكيف يمكننا أن نمنحك الثقة، أو نثق في قرار لك، أو نأتمنك على أسرارنا النووية ونحن نعلم أنك غير مستعد لفهم ما يحتويه ملف يحذرك من كارثة؟<br />هناك أكثر من مؤشر يؤكد أميتك، أولها أنك حين سئلت عن كتابك المفضل في طفولتك البعيدة، أجبت بأنه كتاب \"دودة الخشب الجائعة\"، ولسوء حظك فإن هذا الكتاب لم يصدر إلا بعد أن أنهيت دراستك الجامعية إن كنت قد أنهيتها من الأساس، هذا هو المؤشر الثاني.<br />فشهاداتك الجامعية مشكوك فيها، كما أن انتسابك لجامعة ييل في العام 1964 كان لغزا، إذ إنك استطعت الانتساب لها فيما فشل متقدمون آخرون كانت درجاتهم تفوق درجاتك بكثير!<br />ومما يشكك في حصولك على أية شهادات جامعية، أنك حين طلبوا منك خلال حملتك الانتخابية أن تذكر بعض الكتب التي تقرؤها، ذكرت أسماء عدد من الكتب، ولكن عندما سألك أحدهم عن محتويات كتاب منها تلعثمت ولم تسطع أن تقول كلمة واحدة!<br />والأكثر من ذلك كله، هو أننا تأكدنا من متابعتنا لخطاباتك ومؤتمراتك وتصريحاتك أنك لا تستطيع أن تتحدث اللغة الإنجليزية بشكل يمكننا من فهم ما تريد قوله، إنك لا تستطيع أن تكوّن جملا نستطيع فهمها.<br />ونتذكر جميعا أنك بعدم قدرتك على الحديث باللغة الإنجليزية ألغيت في لقاء لك سياسة أمريكية مضى عليها عقد تجاه تايوان حين قلت: \"إننا نرغب في القيام بأي شيء دفاعا عن تايوان\"، بل ووصل بك الجهل حد اقتراحك إرسال قوات إلى هناك!<br />صديقي بوش، لقد تغير العالم قبل أن تعرفه، وإذا كنت ترغب في أن تكون قائدا عاما ينبغي أن تكون قادرا على نقل أوامرك، وتتخلص من زلات لسانك وتلعثمك وجهلك.<br />هناك أيضا مؤشر ثالث يؤكد أميتك هو قول مساعديك بأنك لا تقرأ ملخصات الصحف وأنك تطلب منهم أن يقرأوها لك!<br />عزيزي بوش، أرجو منك ألا تأخذ هذا الأمر بشكل شخصي، فليس الهدف من إثبات أميتك انتقادك شخصيا، بل انتقاد نظام التعليم في الولايات المتحدة، وربما يكون الأمر خارجا عن إرادتك كأن خلقت عاجزا عن التعلم، مثلك في ذلك مثل نحو 60 مليون أمريكي، وهو أمر لا يستدعي منك شعورا بالخزي، أو أن تقتل نفسك من الخجل، فقط أريد منك أن تقول الحقيقة وأنا على أتم استعداد للمجيء يوميا إلى البيت الأبيض لكي أقرأ لك.<br />السؤال الثاني:<br />هل أنت مدمن كحوليات؟<br />إذا كانت إجابتك بنعم، فهل يؤثر ذلك على منصبك كقائد عام للجيش وكرئيس للولايات المتحدة؟ إن إدمان الكحوليات مشكلة كبيرة يعاني منها ملايين المواطنين الأمريكيين.<br />لقد قلت لنا إنك لم تضع في فمك نقطة كحول منذ أن بلغت الأربعين، تهانينا، ولا نستطيع غير أن نهنئك على ذلك، لكنك في عام 1976 تم اعتقالك بتهمة قيادة سيارتك وأنت سكران، وتجاوزك حافة الطريق. ورغم إنكارك لتلك الواقعة، وتأكيدك أنك لم تمض دقيقة في السجن، إلا أن الشرطي الذي ألقى القبض عليك أبلغ مراسلا محلياً أنه وضع بنفسه الحديد في يديك ونقلك إلى مركز الشرطة وتم التحفظ عليك هناك، فهل يعقل أن تكون تلك الوقائع؟<br />على أنني أحمد الله لأنك تعلمت من الدرس وأعتقد أن ذلك أثر أيضا على زوجتك لورا فهي تعرف تماما مخاطر الجلوس خلف عجلة القيادة، فعندما كانت في السابعة عشرة، قتلت صديقها الطالب في المرحلة الثانوية عندما صدم إشارة للوقوف واصطدمت هي بسيارته، وأتمنى أن تلجأ إليها لتستفيد بنصائحها عندما تزيد عليك ضغوط العمل، الجأ إليها، لكن إياك أن تلجأ لـ ديك تشيني مهما كانت الضغوط، وحتى لو لم يكن أمامك غيره، لسبب غير بسيط وهو أنه اعتقل مرتين أثناء قيادته سيارته مخمورا قبل 25 عاما.<br />عزيزي بوش، لقد اختبأت خلف ابنتيك لتبرر عدم قولك الحقيقة، وقلت إنك كنت تشعر بالقلق من أن يجعلهما تاريخك الحافل بالشرب والسكر نموذجا سيئا، وقد جاء كذبك بنتائج لا أعتقد أنك راض عنها، عندما تم اعتقال ابنتيك التوأم مرات عدة العام الحالي بتهمة تناول مشروبات كحولية وهما تحت السن القانونية.<br />السؤال الثالث:<br />هل سبق اتهامك في قضايا مخلة بالشرف؟<br />سألوك عام 1999 عن اتهامك بالتعاطي والاتجار في الكوكايين، فأجبت بأنك لم ترتكب أية جناية طيلة الأعوام الخمسة والعشر<br />Read the rest of this comment..."
