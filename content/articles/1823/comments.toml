[[comments]]
order = 3
subject = "صلاة الفجر صلاة المحبين"
author = "نوال معزو"
posted = "2006-03-21"
text = "بسم الله الرحمان الرحيم والصلاة والسلام على حبيبنا وشفيعنا ومولانا محمد يا ايها الدين امنوا صلوا عليه وسلموا تسليما وبعد لقد اعجبني هدا الموضوع كثيرا فاشكركم كثيرا لانكم قد تطرقتم اليه اما بعد فالمحرومون هم الدين تفوتهم هده اللحظات الجميلة والتي يخلوا فيها العبد كي يناجي ربه تلك الساعات التي ليست كمثلها اي ساعة وتلك الرحمات التي تتنزل في دلك الوقت والتي تشمل العبد والتي تجعله يسبح في عالم الملكوت والرحموي تلك السويعات لا يشعر بها الا من ذاق حلاوة القرب من ربه جل وعلا اتمنى من جميع اخوتي في الله الذين بقرؤون رسالتي هده ان يجربوا التخلي عن الدفء والاستيقاظ لمناجات الله حتى يعرفوا حلاوة مناجات الله والسلام عليكم ورحمة الله وبركاته اختكم في الله نوال من المغرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153752/http://www.20at.com/article2.php?sid=568"

