subject = "مسلمه"
author = "انا كمان اخويا بيعمل كده بس لانه معندوش محمول بيستخدم محمول اختى"
posted = "2006-03-15"
text = "حقيقى حاجه جميله<br />وكمان لو فيه درس بيتصلو هو واصحابه ببعض<br />جميل الصحوبيه فى الله<br />اللهم ارزقنا حبك وحب من ينفعنا حبه مع حبك وحب نبيك"
