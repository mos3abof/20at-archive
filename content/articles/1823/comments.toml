[[comments]]
order = 6
subject = "جزاكي الله كل خير"
author = "؟"
posted = "2006-04-13"
text = "اشكرك على الموضوع الرائع واتمنى ان ارى الكثير من تلك المواضيع التي تذكر الإنسان بأهمية الصحبة الخيره الي تؤدي إلى عبادة الله<br />لذلك قيل في الحديث (الرجل على دين خليله فلينظر احدكم من يخالل )<br />و قال رسول الله صلى الله عليه و سلم : \" من سرّه أن يجد حلاوة الإيمان، فليحبّ المرء لا يحبه إلا لله\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153752/http://www.20at.com/article2.php?sid=568"
