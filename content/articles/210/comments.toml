[[comments]]
order = 0
subject = "أحد أجمل مقالات عشرينات"
text = "بوب مارلي هو جيفارا الموسيقى.. ثائر في صوته في أدائه.. يغني عن المرأة عن الحب .. تجد روحه الموسيقية مستشرية في كل من غنى الريجي من بعده ..<br />أحب له جداً أغنية no woman no cry بجميع توزيعاتها، فهي أشبه بدستور موسيقى الريجي<br />بوب مارلي أسلوب حياة.. موضة.. لا تشعر أنه يغني للمال أو للشهرة يغني لهدف.. رغم العقائد الغريبة التي آمن بها.. لكنه يغني لهدف روحي.. ليس كموسيقيي اليوم سواء في الوطن العربي أو الغربي على حد السواء.."
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903085913/http://www.20at.com:80/article.php?sid=513"

[[comments]]
order = 1
subject = "no woman no cry...no woman no cry..ha..ha ,,ha"
text = "No, woman, no cry,<br />No, woman, no cry,<br />No, woman, no cry,<br />No, woman, no cry.<br />Said - said - said:<br />I remember when we used to sit<br />In the government yard in Trenchtown,<br />Oba - observing the hypocrites<br />As they would mingle with the good people we meet.<br />Good friends we have, oh, good friends we've lost<br />Along the way.<br />In this great future, you can't forget your past,<br />So dry your tears, I seh.<br />No, woman, no cry,<br />No, woman, no cry.<br />Here, little darlin', don't shed no tears:<br />No, woman, no cry.<br />Said - said - said:<br />I remember when-a we used to sit<br />In the government yard in Trenchtown.<br />And then Georgie would make the fire lights,<br />As it was logwood burnin' through the nights.<br />Then we would cook cornmeal porridge,<br />Of which I'll share with you,<br />My feet is my only carriage,<br />So I've got to push on through.<br />But while I'm gone, I mean:<br />Everything's gonna be all right!<br />Everything's gonna be all right!<br />Everything's gonna be all right!<br />Everything's gonna be all right!<br />I said, everything's gonna be all right-a!<br />Everything's gonna be all right!<br />Everything's gonna be all right, now!<br />Everything's gonna be all right!<br />So, woman, no cry,<br />No - no, woman - woman, no cry.<br />Woman, little sister, don't shed no tears,<br />No, woman, no cry.<br />Guitar solo<br />I remember when we used to sit<br />In the government yard in Trenchtown.<br />And then Georgie would make the fire lights,<br />As it was logwood burnin' through the nights.<br />Then we would cook cornmeal porridge,<br />Of which I'll share with you,<br />My feet is my only carriage,<br />So I've got to push on through.<br />But while I'm gone:<br />No, woman, no cry,<br />No, woman, no cry.<br />Woman, little darlin', say don't shed no tears,<br />No, woman, no cry.<br />Eh!<br />(Little darlin', don't shed no tears!<br />No, woman, no cry.<br />Little sister, don't shed no tears!<br />No, woman, no cry.)"
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903085913/http://www.20at.com:80/article.php?sid=513"

