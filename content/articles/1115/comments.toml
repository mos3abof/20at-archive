author = "واللةانتم يا كلاب اكبر عملاء لليهود فى المنطقةفالقواعد العسكرية كانت تنقل منها الاسلحة من امريكا الى اسرائيل يا كلاب انتم اليهود الفجرة اللة اخسف بكم الارض وعلى راى المثل واللة ما خاب هالمثل"
