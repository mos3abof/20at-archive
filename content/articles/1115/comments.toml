text = "انا مواطن فلسطينى اعيش فى السعودية بقى لى 12سنة واعرف المجتمع السعودى عن قرب المجتمع السعودى يتميز بالتخلف الشديد والمواطن السعودى غبى الى درجة لاتصدق ويملكون ذعر شديد من السلطة لا احد يقدر يرفع راسة ولا قول لاحول و قوة الى باللة علية وانا لا اعرف ليش السعوديين يكرهون المصرينالى هذة الدرجةالبشعة لماذا هذة الكرة بين الاخوان العرب وانا بحكم عملى اقول ان المصرين لهم الفل على السعودين فهم المهندسين الذين يبنون المدن لهم وهم المعلمين الذين يعلمون اولدهم وهم الاطباء وهم كل شى فى هذة البلد لماذا لان الرجل السعودى يتميز بالكسل والغباء المهنى كما ان كل ماقالوة المصرين صحيح فان انتشار اللواط بين الرجل السعودين لدرجة لا يتخيلها اى احد وان لهذا الحين لااعرف لماذا هذا الولع من النساء السعوديات على الرجل المصرى وان اعرف الكثير من القصص لا داعى منها الان كما لا يغتر احد بالرجل الذى يعطية لبسة الوقار ولكن كل ما يشغل السعودى هو الجرى وراء النساء هيك لماذا لا ينظر السعودين الى الامام ويعرفون ان البترول اسوف ينضب بعد عشرات السنين ورغم هذا السراء الفاحش تضل فيهم تخلفهم انه الحقيقة انهم مجرد محدثين نعمةلا اكثر ولا اقل الا يعقلون ان المصرين هم سبب فخرنا نحن العرب فهم اصحاب حرب اكتوبر الذى رفع روؤسنا اسف على هذا الكلام الذى يعرفة السعودين حق المعرفة ولكنهم كالنعام يحبون ان يضعو روؤسهم فى الرمال انا اعرف المصرين حق المعرفة وارى انهم شعب ودود ومقدام يحب العمل مثلة مثل الشعب الفلسطينى المقدام واعرف ان المصرين يعشقون تراب السعودية ولا حدث لهذا البلد اى مكروة سيكنون اول من يهبون لدفاع عن هذا البلد فلماذا هذا الكر ة بين الاخوان نحن شعب واحد وقلبا واحد ودين واحد اللهم انزع الكرة والبغضاء بين امتناء واوطننا ااااااوالسلام عليكم ورحمة اللةاااااااااااانا لا اقول هذا الكلام من باب السخرية ولكنة ليعرف السعودين اخطائهم ويقمون بتصليحها اااااااااااااااامحمدرزق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

