[[comments]]
order = 22
subject = "كلمة حق"
author = "سليمان العمر"
posted = "2006-07-21"
text = "يحرم إنتاج هذه المسلسل وبيعه وترويجه وعرضه على المسلمين لأمور منها :<br />1- اشتماله على الاستهزاء ببعض أمور الدين والسخرية ممن يعمل بها . وهذا أمر في غاية الخطورة على من ينتجها ويخشى عليهم سوء عاقبتها الوخيمة .<br />2- اشتماله على ما يعارض الشرع المطهر ، وحمل الناس والخروج على أحكام دينهم وشريعة ربهم وذلك من خلال : ترسيخ العلاقات غير المشروعة بين النساء والرجال الأجانب ، وعيب الغيرة على المحارم ، والتهاون بالحجاب وغير ذلك .<br />3- اشتماله على الدعاية للبلاد التي تظهر فيها شعائر الكفر ، والبلاد التي اشتهرت بالفساد الأخلاقي .<br />4- اشتماله على ما يثير النعرات والعصبيات الجاهلية عن طريق السخرية بالعادات واللهجات وهذا ينافي مقاصد الشرع المطهر من الحث على المحبة والألفة والإخاء والصفاء بين المسلمين والبعد عن أسباب الشحناء والبغضاء قال الله تعالى ( إنما المؤمنون إخوة فأصلحوا بين أخويكم واتقوا الله لعلكم ترحمون . يا أيها الذين آمنوا لا يسخر قوم من قوم عسى أن يكونوا خير منهم ولا نساء من نساء عسى أن يكن خيراً منهن ولا تلمزوا أنفسكم ولا تنابزوا بالألقاب بئس الاسم الفسوق بعد الإيمان ومن لم يتب فأولئك هم الظالمون ) .<br />5- إفضاؤه إلى نشر الرذيلة ، وطمس معالم الفضيلة ، وإشاعة الفساد ، ومحبة المنكرات والاستئناس بها .<br />ثانياً : تحرم مشاهدة هذه المسلسلات والجلوس عندها لما فيها من المنكرات وتعدي حدود الله ، قال الله تعالى في وصف عباده المتقين : ( والذين لا يشهدون الزور ) أي : لا يحظرون القول والفعل المحرم وأعياد الكفار ، وقال سبحانه : ( وإذا رأيت الذين يخوضون في آياتنا فأعرض عنهم حتى يخوضوا في حديث غيره وإما ينسينك الشيطان فلا تقعد بعد الذكرى مع القوم الظالمين ) قال أهل العلم : المراد بالخوض في آيات الله : التكلم بما يخالف الحق : من تحسين المقالة الباطلة ، والدعوة إليها ، ومدح أهلها ، والإعراض عن الحق ، والقدح فيه وفي أهله . وفي الآية دليل على أن مجالسة أهل المنكر لا تحل . وقال الله جل وعلا : ( وقد نزل عليكم في الكتاب أن إذا سمعتم آيات الله يكفر بها ويستهزأ بها فلا تقعدوا معهم حتى يخوضوا في حديث غيره إنكم إذاً مثلهم ) قال أهل العلم : ويدخل في عموم الآية حضور مجالس المعاصي والفسوق التي يستهان فيها بأوامر الله ونواهيه .<br />ثالثاً : تحرم الدعاية لهذه المسلسلات وتشجيعها والإعلان عنها بأية وسيلة لأن ذلك من التعاون على الإثم والعدوان وقد نهى الله عن ذلك فقال جل وعلا : ( وتعاونوا على البر والتقوى ولا تعاونوا على الإثم والعدوان واتقوا الله إن الله شديد العقاب ) والواجب هو الإنكار على هؤلاء وبغضهم في الله حتى يتوبوا إلى الله تعالى ويقلعوا عن معصيته .<br />رابعاً : إن تخصيص الكلام في هذا المسلسل ( طاش ما طاش ) لا يعني سلامة غيره من المسلسلات بل الحكم يتعدى إلى كل مسلسل يشتمل على مخالفة للشرع المطهر ، وانتهاك لحرمات الله ، وإفساد للأخلاق ، وقتل للغيرة الدينية ، وتحطيم للمروءة الإنسانية ، ودعوة إلى الانحراف بشتى أنواعه .<br />خامساً : يجب على أهل الإسلام أن تكون حياتهم جداً لا هزلاً وأن يشتغلوا بما ينفعهم في دينهم ودنياهم ، وأن يجتنبوا كل ما فيه إضعاف لدينهم ، وتوهين لقوتهم ، وإهدار لأوقاتهم ، وحط لأقدارهم ، وتمكين لعدوهم منهم .. وإن الحياة لثمينة فليربأ أهل الإسلام عن عمارتها بالباطل وسفاسف الأمور ، وليقوموا بحق الله عليهم من التمسك بهذا الدين ، وحماية حرماته ، وتربية شبابه على الحق والفضيلة وإبعادهم عن العبث والفساد والرذيلة . والواجب على القائمين بإعداد هذه المسلسلات التوبة الى الله . ونسأل الله جل وعلا أن يصلح أحوال الجميع وأن يهدينا جميعاً الى سواء السبيل إنه سميع قريب مجيب وبالله التوفيق ..<br />وصلى الله على نبينا محمد وعلى آله وصحبه وسلم ..<br />اللجنة الدائمة للبحوث العلمية والإفتاء<br />الرئيس : عبد العزيز بن عبد الله آل الشيخ<br />عضو : عبد الله بن عبد الرحمن الغديان<br />عضو :صالح بن فوزان الفوزان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

