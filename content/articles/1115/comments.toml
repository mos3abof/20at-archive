[[comments]]
order = 63
subject = "الله يعز السعودية ويرفع راس اهلها اكثر واكثر"
author = "سعودية وبكل فخر وعزة نفس"
posted = "2006-10-22"
text = "يالبناني يا كلب ياحقير يوم طحت وصرت مثل الكلب تلهث بالتراب يوم ما جو اليهود ونسفوا اهاليكم قمتوا تبكوا وتتمسكنوا ويحنا كل الي عندنا اعطيناكم ياجيعانين ياحثالة والمصريين بعد انا ما اقول شي بس يالمصري يامعفن تعال وشوف بالأشهر الكريمة والعيد شووف السرقات منكم والتسول منكم والله محد وسخ بلادنا غير لبنان بلد الفساد ومصر بلد السرقات استحوا استحوا محد منظفكم غيرنا يامعفنين وجع لكن ما اقول غير حسبي الله عليكم والله دام هالكلام منكم استغفر الله ولا تعرفوا ربكم لأنه لو تعرفوا الله كان قلتوا وحطيتوا في بالكم وهل جزاء الإحسان إلا الأحساااااااان<br />ومن لم يشكر الناس لا يشكر الله<br />حسبي الله ونعم الوكيل فيكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

[[comments]]
order = 64
subject = "المنطق والعقل"
author = "المسلم اخو المسلم"
posted = "2006-10-22"
text = "بسم الله الرحمن الرحيم(يا أيها الذين آمنوا لا يسخر قوم من قوم عسى أن يكونوا خيرا منهم ولا نساء من نساء عسى أن يكن خيرا منهن ولا تلمزوا أنفسكم ولا تنابزوا بالألقاب بئس الاسم الفسوق بعد الإيمان ومن لم يتب فأولئك هم الظالمون) أخواني اخواتي هل يوجد ابلغ من هذا رد على مانحن فيه .لقد عرف سبحانه مدى ما سنصل اليه فاراد ان يؤدبنا باسلوب راقي في التأنيب وبدون تجريح . ويقول سبحانه (و هدوا إلى الطيب من القول و هدوا إلى صراط الحميد) .......أرجوكم ايها الاخوة والاخوات فلنعود الى انفسنا قليلا ونترك هذا الكلام الذي جرحنا بما فيه الكفاية ولنتجه الى الله العلي القدير عسى ان يرحمنا ربنا واعلموا انكم والله العظيم تؤذون الرسول الطيب الطاهر بما تفعلون والذي قال اني مباهي بكم الامم يوم القيامة فانظروا فيما نحن من تناحر وتباعد وبغض. ....تقبل الله صيامكم وقيامكم ....وقل اعملوا فسيرى الله عملكم والرسول ...تحياتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

