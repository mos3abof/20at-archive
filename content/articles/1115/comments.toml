order = 0
subject = "طاش ما طاش ذكاء المجرمين وغباء المجتمع \"السعودي\""
author = "إن هذا المسلسل \"طاش ماطاش\" لهو أكبر دليل على خبث ودهاء ال سعود ، وفي المقابل غباء وبلادة الشعب \"السعودي\"."
posted = "2006-05-20"
text = "فبالله عليكم ، هل رأيتم أحد قط يضحك من بلادته وهوانه واستكانته ؟<br />فهذا المسلس المفترض فيه أنه يصور ويعالج المظاهر السلبية في المجتمع \"السعودي\" وينقد الاداء الحكومي الضعيف تجاه أفراد المجتمع.<br />ورغما أن هذا المسلس قد أنطلق منذ سنين عديدة الا أن هذه المظاهر لا تزال موجودة ، وان المسلس لم يحرك فيها ساكنا.<br />أما المجرمون \"ال سعود \" فبدلا من أن يكون هذا المسلسل (المفترض به) ناقدا لادائهم الحكومي الضعيف ، وممارساتهم الادارية الفجة ، تحول الى أداة فاعلة بايديهم لبث سمومهم ، وأفكارهم المنحرفة.<br />ومتابعة الشعب \"السعودي\" لهذا المسلسل دليل سذاجة وقلة وعي بمكر هؤلاء المجرمين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

