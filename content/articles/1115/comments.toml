subject = "ردا على الحقير الجاهل عبد اللة ابراهيم"
author = "ايها الغبى انا لم اشتم السعودية لاننا نعرف انها اطهر ارض ولكنكم اوسخ واقذر شعب لعنكم اللة ولعن من لم يلعنكم لا تخلط الاورق ثانيا لم اسى اليكم لان هذة هى صفتكم ثالثا"
posted = "2006-11-02"
text = "انا اعرف ان سيدنا محمد كان يرعى الاغنام وانت لاتعرف ان القبائل كانت تقاس ثروتة بعدد الاغنام والابل كان هذا ايام الجاهلية والاسلام ولكننا الان فى القرن الواحد<br />والعشرين وانا اتعجب كيف خراف تسوق خراف<br />ومن صورتكم اخذ العالم اننا متخلفون يا كلاب<br />ثالثااذا كان على الثورة التى تستمدوة من البترول فهى مؤقتة لبعض السنين فانتم مجرد محدثين نعمة فقط لا غير<br />وصدق فيكم قول الشاعر<br />تموت الاسود فى الغبات جوعا<br />ولحم الضان تاكلة الكلاب<br />رابعا السعودية ليست مكان نزول سيدن ادم بل اثبتت الدرسات انها الهند يا كلب<br />كم ان ليس مرجع الخلق الى اردكم بل اض الميعاد هى فلسطين يا حقيريا واطى يا اوطى من الموس على الارض<br />خامسا افتخارك بالكعبة والحرم هى ليست ملك لسعودية وحدها بل هى ملك لكل مسلم على وجة الارض يا كلب<br />خامسا نحن لم نشتكى لكم يا كلاب على حكم مبارك نحن 80 مليون مصرى لا تكفى مواردنا لسد احتياجتنا ام انتم اكل ملوككم عليكم وشربوا ياكلب<br />ام عن الاصل فان عارف اناصلك واطى زيك فانتم احفاد ابو جهل وابو لهب لعنهم اللة ولعنكم<br />مصر هى ام الدنيا فيها ولد سيدنا موسى وعاش سيدنا عيس وكرمة اللة بالاسلاموالسيدة هاجر المصرية هى جدة العرب<br />اما عن موضوع محمد حسنى مبارك فهو ان كان عندكم اصل تبوسة جذمتة فايام حرب الخليج الاولى طلب منة صدام ان يحتل هو الكويت ومصر تحتل السعودية فرفض يا كلاب وقال ان دخلتم هذة الارض فسندخل العراق يا واطى<br />ام عن موضوع الجنس هوفى كل بلاد العرب واذا كان الجنس فى بعض الشقق لدينا فهو فى بيتوكم كلة وانا استعير الكلمة التى قالة فهد الاماراتىنحن ملائكة بالنسبة لكم يا واطى وصحيح انا نسيت هو انتو ليكم فى الجنس انتو ليكم فى ان يلاط فيكم يا كلب والشاهد الفلسطينى الذى عايش بنكم<br />ويا صاحب الاصل المحترم تشير الاحصائيات ان الاغلبي المترددة على القنوات الجنسية هى من السعودية<br />اما موضوع كتبتك لاميلك فشرف ليك يا شرموط انى اكلمك مهما اغتنيم فستضلون خراف كلاب اوساخ<br />ام ستضل الكلاب تنبح فالكلاب هم انتم انتم انتم والقافلة هى<br />مصر مصر ام الدنيا<br />والشجرة العالية تقذف من كلب مثلك<br />وحاول تستخبة يا حبيبى الايام دية احسن عربية الكلاب المصرية<br />بتلم اى واحد شكلك<br />لو سائلتك انتا مصرى تقول لى اية انا مصرى وابن مصرى وكل مصرى اللة علية<br />ملوك الجدعنة ودى حاجة فى طبعهم<br />يا شارط تاكد من معلوماتك قبل ان تكتب<br />وان اسف انى برد على كلب زيك"
