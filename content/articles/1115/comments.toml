text = "انا اقولكمم يالمسصريين واللبنانيين احسلكم فكروا كيف تسحبون السعوديين اسيادكم واعمامكم وتخلونهم ينيكوا اهلكم بدل كلامكم الي ماله داعي<br />لاننا احنا ياسعوديين الي عزيناكم ورفعناكم وخليناكم في ترتفعون شوي فوق مقداركم لاكن راح ندعس عليكم ونرجعكم الى مكان انزل من مستواكم<br />واحنا اللي ساعدناكم في اللي صاركم<br />واحننا اللي بننينا لكم لبنان وعمرناها<br />واحنا اللي نصررررررف على مصر"
