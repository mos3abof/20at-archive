[[comments]]
order = 36
subject = "رد على المتخلفين"
author = "حساوي cool"
posted = "2006-09-13"
text = "عليق بواسطة : اياد اللبنانى<br />اوافق ان احقر اهل الارض هم السعودين ونظرتى ونضرة كل اللبنانين هم اوساخ العرب سياتى اليوم الذى سينتهى فية بترولهم ويعودون كلاب واللة خسارة اوصفهمبالكلاب الى الجحيم لكم يا اولاد الخراف والماعز يا انجاس<br />أرسل هذا التعليق بواسطة : s<br />بالمصرى ياخذوا فى الطيز<br />(هذا كفوك يالخايس طيز ما طيز)<br />سعودى بدون بترول حمار<br />(طيب ودامه حمار ليه تاخذ لك ذنوب وتسب حمير !!!)<br />هذا الحال ويرجعن كلاب اوساخ احقر خلق اللة<br />(اجل احقر خلق الله ها..انت لو تعرف الله ما قلت هالكلام ..الله مكرمنا دام الحرمين عندنا ولا احنا جيناك وقلنالك تكفا حبنا)<br />واللة لولا البترول الحقير ما كنا لنرهم هكذا لكنى تراهم يرعون الاغنام فى الصحراءهم<br />(طيب قل لي الحين فيها شي لو رعينا اغنام!!! الرسول اللهم صلي عليه واله وسلم رعا غنم ..ابوك يالتخلف)<br />انا يوجد دول عربية يوجد فيها قواعد عسكرية امريكية وامريكن يدنسون اريهم ويستحيون نسائهم ويستعبدون رجالهم<br />(اقول تكفااا بس يعني انت الحين الي ما تحب الامريكان هاا..لوفيك خير ما احتفلت بأعيادهم ولا قلدتهم وجعلتهم قدوتك..وحنا مسلمين رغم عن انف من جابك ولاحد يستعبدنا يا متخلف)<br />السعودين بياتوا مصر بيضربوا على<br />قفاهم ويتاحد فلوسهم واذا كان على الجنس فى كل العالم وبعدين المصرين اشرف ناس فى العرب<br />(واضح انهم اشرف ناس من اخلاقهم العاليه ولباقة لسانهم وانهم محترمين بالرد .. اقول انثبر بس)<br />وبعدين اذا كان بعض المصرين بيعملوا عندكم هذا ليس عيبا<br />(اجل العيب ان نرعا الغنم صح...؟)<br />احنا ناتى بلادكم ناخذ فلوسكم وننيك نسوانكم<br />(لا والله احلف واصدقك يا وصخ)<br />انتم اصلا ما لكوش لذمة فى الدنيا دية<br />(والي له ذمه يقول الي تقوله.؟؟؟ بالله عليك اسألك وابي جواب .. تعرف وش معنا ذمة..؟)<br />سادسا احنا المصرين حضارة 7 الاف سنة<br />(طيب وبعدين)<br />الاهرامات النيل الازهر نصر اكتوبر الشيخ الشعراوى 4جوائز نوبل احنا الماضى والحاضر والمستقبل<br />(طيب هل كل ذا الي مستانس لي فيه جاك شي منه..؟؟؟ وبعدين هل بينفعونك بآخرتك يوم الحساب...؟)<br />اوسخ شعب على اطهر ارض<br />(اطهر ارض اجل الحين انا خلصت منك بس بسألك سؤال وابي جواب صريح..ليش بالصيف عندكم بالباصات الريحه كريهه سؤال يطرح نفسه..؟)<br />أرسل هذا التعليق بواسطة : احمد<br />اشترى شرفك وشرف عائلتك بفلوسى<br />(الحين هالفلوس هالي فرحان فيها انت ووجهك بتاخذها معاك على قبرك لي متت ...؟؟؟ بتشفعلك يوم القيامه..؟)<br />أرسل هذا التعليق بواسطة : محمد<br />واللة السعودين عمرهم احقر العرب السعودين هم ذبالة العرب<br />((خلينا الشرف لك ))<br />أرسل هذا التعليق بواسطة : حماده<br />عشان هما ديما بيغلطوا فى المصرين مش عارف ليه كل ما ادخل النت الاقى واحد سعودى بيغلط فى المصرين وسب وقلة ادب<br />(اصابعك ماهي سوا قلبوو وتأكد انك لوما غلطت على احد ماراح احد يغلط عليك..تشاااوو)<br />وبالنهايه اسف عالاطاله وبخصوص طاش انا اقول لازم تسمعون من الطرفين<br />سلالالالالالالالالالالالالالالالالالالالالام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

