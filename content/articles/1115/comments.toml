text = "اقول يامصري ياكلب انت وياه السعوديه واهلها اشرف منكم ياحيوانات لو فيكم خير عقلوا خواتكم اللي ننيكهم كل صيف<br />تفوووووو عليكم وعلى الكلب حسني مبارك<br />ومااقول الا غالله يحفظ السعوديه من كل مكروه لان السعوديه لوصار لها شي اول من يتضرر انتم ياشحاذين<br />بدل السب هنا رح ياكلب يامصري اعمللي اسيادك السعوديين فول وجب اختك تمص لنا."
