[[comments]]
order = 42
subject = "ليييييه كذا كل هذا حقد"
author = "na9er"
posted = "2006-09-27"
text = "اقول لكل اخوه اللي يتطاولون على السعوديه الشجر المثمر يرمى بالجاره<br />للاسف ان كل شخص يسمح للسانه بالتمادي والغلط بدون ما يفكر قليلا من المستفيد من هذه الخلافات.<br />انا اترك للمحايدين الحكم من هم الاغبياء هل هم العقلاء ام اللذين يطلقون العنان لالسنتهم ليشمت اعدائنا فينا<br />لو اردنا نشر فضائح قوم لاخذ منا وقت حتى ننجز ذلك لان كل بلد وفيها مقبره<br />اذا كان الشاتمون هم مسلمون اصلا فليتذكروا ان الله مطلع وان هنا يوم ستشهد السنتهم ايديهم وارجلهم بما اقترفوه من ذنب<br />كنت اتمنى اللا تخرج التعليقات عن صلب الموضوع لكن يبدو لي ان هناك يد او ايادي خفيه تريد تفكيك الترابط العربي اللذي نتمناه<br />نعم نكن لاخوتنا في مصر وفي كل بلدان العالم العربي الاحترام ونقدر لهم وقوفهم معنا في بناء نهضتنا وتعليم ابنائنا ولكن هذا لا يمنعنا من الدفاع عن وطننا بارواحنا<br />اخيرا اقول للجميع تذكروا انكم لا تمثلون شعوبكم واوطانكم انما تمثلون انفسكم وفيكم من لا يتشرف اهله بانتمائه لهم وقد اكون انا واحد منكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

