[[comments]]
order = 56
subject = "الله يهدي الجميع ويغفر لنا ولايغضب علينا"
author = "أرسل هذا التعليق بواسطة :"
posted = "2006-10-14"
text = "يارب أسألك في هاليوم المبارك انك توفق ناصر القصبي وعبدالله السدحان لكل مافيه خيررر للسعودية..<br />اللي يكره طاش وينتقده معناها انه انسان متخلف وماقدر يكمل دراسته الجامعية<br />14/10/2006<br />الله من التخلف يالبرفسور واضح انك قروي ماصدق يدخل الجامعة تحسبك وصلت القمر الله يخلف على أمك وأبوك ويرزقهم خير منك اللي كرهوا طاش كرههوها لله وتعديهم حدود الله وخوفنا من العقوبة بسببهم وكلهم علماء ورثة الأنبياء ودكاترة واساتذة وارداهم اللي معه ثانوي وحتى اللي موجامعي يكفي دينه وعلمه وشيخنا ابن باز رحمه الله موجامعي لكنه لوحده يعادل جامعات كاملة ومحمد بن عبد الوهاب اللي كان سبب في عزناوارجاع مجدنا وقبلهم الرسول صلى الله عليه وسلم وصحابته يالمتخلف كلهم لو عرضت عليهم طاش حرموها وكرهوها لله وهذا شرع الله ولااعتراض عليه وهم موجامعيين يالفاهم(حفت الجنة بالمكاره وحفت النار بالشهوات)رح يالجامعي لأحد من أهل الدين والعلم ومو لازم جامعي عشان يشرح لك العبارة بين القوسين والله يخلف على ايام (حمود ومحيميد) كانوا نظيفين وكويسين وماحد يكرههم لكن يوم تعدوا خلاص مانبي تمثيلهم وأسأل الله لنا ولهم الهداية ولجميع المسلمين وان يحفظ بلادنا وامنناوجميع بلاد المسلمين والله يرجع عز المسلين ويجمع كلمتهم على الحق...آآآآآآآآآآآمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

[[comments]]
order = 57
subject = "ياربي عاللقافة اوف"
author = "اولا يامتخلف انا بنت والحمدلله ماني رجل متخلف زيك ثانيا الشيخ بن باز الله يرحمه في سنه لم تفتح الجامعات بالسعودية وانا ابوي الله يرحمه كان مثقف ويتكلم انجليزي بطلاقة وهو ماعنده غير الابتدائي وفي سنه كان الابتدائي اعلى شهادة يحصل عليها اللي في سنه ويتوظف فيها بعد .. يعني لاتتكلم عن ناس كبار في السن وماضي قديم"
posted = "2006-10-14"
text = "احنا نتكلم عن الحاضر واصلن انا مجبت طاري الجامعة الا لان البكالوريوس شي صار عادي جدا وانا اول من يقول هالشيء وعشان كذا اللي مادرس جامعه ينحرق دمه ليش انه ماتخرج اللهم لاشماته بسسس<br />وبعدين تعال انت وش حرك هاه؟؟<br />شكلك فاشل بالدراسه هههههههاي<br />ومره ثانية لاتقول قروي لان هالكلمة تضحكني ههههههههههههههههه شكلك خضيري انا من نجد وافتخر يالخضيري .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

[[comments]]
order = 58
subject = "وش حارق دمك انتي يامعقده؟؟"
author = "اول جامعة تأسست بالمملكة هي جامعة الملك سعود عام 1377 هـ"
posted = "2006-10-15"
text = "وبعدين ابوي توفى وعمره 80 سنه وهذا الكلام من 5 سنوات يعني اكبر من ابوك ب 15 سنه....<br />شكلك ماتدرين وين الله قاطك فيه وشكلك اصلن مش عايشه بالبلد..<br />ضحكتيني على سالفة النسب هاهاها No comment<br />مووتي حررة هأأهأأهأأ<br />اللي تقولين عليه متخلف يا( ) ولا تدرين؟ ماتستاهلين اقولك كلمة تناسبك واخذ عليها ذنب كفايه الذنوب اللي اخذتها بسببك<br />تدرين؟ انا فكرتك رجال لان جرأتك الغير طبيعية كانت تثبت هذا الشيء وغير كذا شكلك شينة بعد الله يعينك والله وترى كل كلامك اللي قلتيه نفاق<br />انا من شفتك تشتمين رجال ميت غسلت ايدي منك.. ترى انتي كلك على بعضك كذا ماتسوين ظفر ابوي وهو ميت !!<br />ومع ذلك ماراح اشتم في ابوك مو عشانك انتي؟ بس عشان لو فقديته يوم من الايام لا قدر الله راح تفهمين قصدي!!<br />قسم بالله ان حومتي كبدي عشان كذا بقفل هالصفحة نهائيا وماراح اقراها عشان جد جبتي طاري ابوي حسبي الله عليك دنيا واخره قولي امين واذا تبين تردين وتبردين خاطرك ردي بس ماراح اقرا ردك يعني نبحي زي الكلاب بكيفك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

