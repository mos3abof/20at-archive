text = "يا مصري لما تجي السعودية تشحت وكمان تسرق من بيت الله الحرام انت كذا عندك ضمير ؟؟؟؟؟؟؟<br />ولاتنسى كمان لما نجي عندكم اش نسوي فيكم روح استر نفسك واهلك وإذا عندك بنات حافظ عليهم عشان لايجي سعودي ينيكك وينيك اهلك بفلوسة ياكلب<br />لاتنسو فضل السعودية قصدي افضال السعودية عليكم<br />لولا الله ثم السعودية ولا كنتو (؟؟؟؟؟؟؟)<br />وانا (عز) السعودية وافتخر"
