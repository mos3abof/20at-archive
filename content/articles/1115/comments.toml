text = "حطة حية وسعودى فى كيس طلعت الحية تستغيس<br />ان كان صبعك سعودى اقطعة<br />السعودى الاصيل زى الجذمة التفصيل<br />ان مر عليك كلب فوتة وان مر عليك سعودى موتة<br />واللة ان ما تمنعون الكلام لنمنع عنكم ابشارنا وما تلقون احد يلوط فيكم يا كلاب<br />يا اولالالالالالالالالالالالالالالاد<br />الكلاب"
