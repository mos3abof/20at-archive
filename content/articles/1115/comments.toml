text = "وحاب اقول للمصريين( المتطاوليين )لانوا منهم بعض المحتميين<br />انتوا زعلانيين ليش من بترول السعوديه (يرزق منة يشاء بغير حساب ) وبعدين انتوا عندكم زي البترول 1 قناة السويس 2الغاز الطبيعي 3الزرعة 4القطن وغيره<br />بس عشان انتو المصريين حرمييه ببانش فيكم<br />1 ان سلم عليك الصري عد صوابعك ورا<br />2 لو طلع للكلب صوف يتمر في المصري معروف<br />من العروف تجارت الدعاره اول ماطلعت الا في مصر ومصر هي الي صدرت الفسادللعالم وغيره<br />وفق كل ده في خمسه مليون مصري بيشحدوا في السعوديه ؟؟؟اذا كان مش عاجبكوا السعوديه روحوا لبلدكم بلد الفقر والسرقه والحرميه والكذب والغش للعلم انا روحت مصر وشوفت القرف الي فيها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

