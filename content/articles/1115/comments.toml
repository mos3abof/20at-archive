[[comments]]
order = 53
subject = "رساله للخوان المصريين واللبناني والفلسطيني"
author = "اولا المصريين انتم جرارين وهذا تخصصكم من حسني مبارك الى اصغر مصري والاخ الي يقول اشتريك بفلوسي اقول له من وين لك فلوس اكيد جرار كبير على اخواتك وامك وغيرهم وهذاوضعكم الطبيعي واما اذا جينا للبهايم فوالله انكم اكبر بهايم على وجه الارض والسبب معروف الفول الله يعينكم وبعدين مسوين نفسكم عارفين كل شي وانتم مستحيل تتعدون السوريين الي هم تعليميا اسيادكمواذا على الوساخه فوالله العضيم اوسخ شعب على وجه الارض المصريين والله لايوريك ريحتهم......."
posted = "2006-10-14"
text = "عموما يامصري ياوسخ لو سنه وحده ماسافروا السعوديين لكم راح تاكلوا بعضكم يانصابين والقحبات عندكم راح يموتون لان اضعف شعب جنسيا هم المصريين والغرز والبانجوا تشهد على كلامي فصارت مصيبه حريم شراميط قحاب ورجال ضعاف جنسيا.<br />اما حضارتكم ياعيني على ماضيكم بس وين حاضركم ايه صح من اكبر الدول في عالم الجراره ياجرارين<br />اما الفلسطيني فمعروف يهودي وعميل ولو فيه خير هو من على شاكلتهم ماكان اغتيل الشيخ احمد ياسين والرنتيسي وغيرهم<br />اما اللبناني جرار درجه ثانيه بعد المصرين كل اللبنانين يجون السعوديه موضف استقبال وسنه وحده وهو يركب bmwبعدمايجيب امه واخته وحرمته واكيد جراره ومن عرق كسهم يوصل فوق وبعد اقول له غير السعوديين السوريين كانوا شغالين فيكم نيك الين قطعوكم وبعدين ماعمر لكم لبنان الا احنا ياجرار ياحمار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

[[comments]]
