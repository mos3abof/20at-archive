[[comments]]
order = 30
subject = "اعرف معنا حقيقة السعودين"
author = "s"
posted = "2006-08-10"
text = "الحقيقة انا كل السعودين اغبياءوهذة هى الحقيقة وراى وراى كل المصرين ان سعودى بدون بترول حمار من غير اذن وان سعودى ببترول خروف من غير ذيل واثبتت الاحصا ئيات ان معضم السعودين هجين من ذب مصرى اصيل ومن كس سعودى حقير واثبتت الااحصائيات ان اغبى اهل الارض السعودين واللة لولا البترول الحقير ما كنا لنرهم هكذا لكنى تراهم يرعون الاغنام فى الصحراءهم واولادهم وابائهم واجددهم واللة لن يستمر حال البترول على<br />هذا الحال ويرجعن كلاب اوساخ احقر خلق اللة<br />واللة خسارة فيهم هذة الاقاب وهذا القب والكنية الان هم لا هم لهم الان الا الاكل والنوم ثالثاانا اعرف وكل العالم ان الرجل السعودى يحبون ان يلا ط فيهم اى بالمصرى ياخذوا فى الطيز وهذا ما حدث فى كاس العالم 98 وفضيحتهم الكبرى<br />رابعا انا لن اقول اكثر ممن قالة الرئيس<br />الليبى القذافى فى احدى القمم العربية<br />انا يوجد دول عربية يوجد فيها قواعد عسكرية امريكية وامريكن يدنسون اريهم ويستحيون نسائهم ويستعبدون رجالهم<br />فرد علية كلب السعودية الاول الكس عبد اللة احنا ما احد يستعبدنا لية رد علية عشان الى على راسة بطحة<br />خامسا النكتة المصرية بتقول اية مسكة واحد مصرى بيربى واحد سعودى فو البيت<br />ههههههههههههههههههههههههههههههههههه<br />خامسا ان السعودين بياتوا مصر بيضربوا على<br />قفاهم ويتاحد فلوسهم واذا كان على الجنس فى كل العالم وبعدين المصرين اشرف ناس فى العرب كلهم وهذة الفنادق فى كل الوطن العربى وليس مصر والافلام المصرية لا تعكس الحياة المصرية بتاتا يا اوساخ<br />وبعدين اذا كان بعض المصرين بيعملوا عندكم هذا ليس عيبا ولكن العيب عليكم انتم قاعدين فى بيوتكم ذى النسوان ولية ذى انتم اصلا نسوان احنا ناتى بلادكم ناخذ فلوسكم وننيك نسوانكم من غير فلوس ايو من غير فلوس اما العالم الى فى مصر فى الكبريهات شغلتهم اخد فلوسكم ما انتم اصلا ما لكوش لذمة فى الدنيا دية<br />سادسا احنا المصرين حضارة 7 الاف سنة احنا الاهرامات النيل الازهر نصر اكتوبر الشيخ الشعراوى 4جوائز نوبل احنا الماضى والحاضر والمستقبل<br />لو سالتك انت مصرى تقول لى اية انا مصرى وابويا مصرى وكل مصرى اللة علية<br />سعودى+بترول =خروف بدون ذيل<br />سعودى -بترول=حمار من غير ودان<br />واخيرا على راى الكلام اوسخ شعب على اطهر ارض<br />انا اسف على هذا الكلام ولكن هذة هى الحقيقة كاملة ليعرف السعودين حقيقتهم<br />كاااااااااااااااااااااااملة<br />باااااااااااااااااااااااااااااااااااى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

