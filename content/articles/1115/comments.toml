text = "اولا عيب ده احنا فى شهر كريم مينفعش نقول فيه كلام زى ده ................بس لازم تعترفوا يا سعوديين انكم بهايم بردو يعنى مفيش مانع انكم تكونوا ديمقراطيين وتعترفوا ايوه تعترفوا اللى انتوا شعب جاهل انا مش باشتمكوا لا سمح الله بس هى دى الحقيقه يا ولاد يا سعوديين يا وحشين .......انا مش بحب السعوديين بس بحب ارض الحجاز اللى انتوا عايشين عليها للاسف يعنى بس ممكن يكون فيه سعوديين محترمين وعائلين انا اتمنى ذلك بصراحه ...............وايه حكايه النياكه دى هو انتوا بتعرفوا تنيكوا زى البشر لا بجد بتعرفوا و لا......اصل الفلسطينى بيقول انكم ما بتعرفواتنيكوا الا بعض لواط يعنى حقه ده بجد انتوا بتلوطوا فى بعض بااااااااااااااااااااااااااااااااااااى مصرى صميم>......."
