text = "حقيقة ما كان لي ان اتفضل بالرد على التعليقات المحترمة لكثير من المشاركين برأيهم حول المسلسل طاش ما طاش سوى التعليق الغير محترم من المدعوا info اعزكم الله : اولاً : لتعلم info وهوالذي يعلمة الجيمع .<br />ما اريد ان يكون سبب خلافنا هو مسلسل قد أكون مؤيدا ومصدقاً ما يعرض فيه أو لا أكون مؤيد ومصدقاً لما يعرض فيه فليس كل ما يعرض على أي شاشة ومن انتاج اي دولة سواء السعودية أو مصر أو غيرها من الدول هو حقيقة في الواقع فإن كان كذلك فالواقع في المسلسلات المصرية وما يعرض فيها واقعاً يعيشة اخواننا المصريين فهذه مصيبة كبرى تحل بالامة المصرية من انحطاط المجتمع والعيش في عالم الرذيلة وإن كان ليس كذلك فهذا دليل على أن كل ما يعرض في المسلسلات لا يمثل الواقع الحقيقي لأي مجتمع فقناعتك بما قلت سابقاً يجبرك على الاقتناع بأن مايعرض في المسلسل طاش ما طاش من محاكات للمجتمع السعودى لا يمثل الواقع الذي انت تتكلم عنه للجتمع السعودي فالتفرقة بين الاثنين خطاً<br />ثانياً الذي لا تعلمة ويعلمة الجميع عن حقيقة شعبنا عندما ذكرت بأن يعرف السعوديين اصلهم وكيف جاءوا وأنهم من اصل مصري فعلم ان البشرية جمعاء اصلها ومنشأها هو ارضنا المباركة التي فيها خلق ابونا آدم وأنت بحقارتك ترجع إلى ترابنا الطاهر أعزه الله منك ومن على شاكلتك .<br />ثالثا: البترول وما أدراك ما البترول الذي جعلك وأمثالك تكنون الحقد الدفين على اهل هذه البلاد الطاهره فالله يهب لمن يشاء ما يشاء فالاسف ثم الاسف لا اذهب الى بلدان عربية فقيره الا وهمهم وشغلهم الشاغل هو بترول السعودية ( قل موتو بغيضكم ) فالله وهب هذه البلاد نعم لا تعد ولا تحصى فهي مهبط الوحي وموطن النبي محمد صلى الله عليه وسلم وموطن الكثير من الانبياء وهي بلاد الحرمين فيها انزل القرآن ومنها انطلقت الرسالة ومنها نشرنا دين الاسلام الذي انت من اتباعه ومن بلدي وموطني انطلقنا لنشر الاسلام حتى افتتحنا بلدكم ( مصر ) الذي كان مرثعاً لعبادة غير الله والشرك والكفر بقيادة عمرو ابن العاص رضي الله عنه وغيرها من البلاد العربية . وكذلك في بلدنا يا من تفتخر في اهراماتك الفرعونية الكعبة المشرفة أول بناء بني على الأرض التي لها تتوجه في كل يوم خمس مرات .<br />وفي بلدنا الحضارة الإسلامية وفي بلدنا وفي بلدنا وفي بلدنا .... ( قل موتو بغيضكم ) فالله اختار رسالته لمن احب وفي الأرض التى احبها الا وهي بلدي حرسها الله<br />رابعاً ملكنا ادام الله عزه واطال بعمره فنحمدك يارب ان رزقتنا من يحكم فينا شرعك ويطبق حدودك وينصر دينك ويعلى كلمتك وينصرك بالحق وينصر الحق بك .<br />فالتعلم اننا في بلدنا نعيش في عز ورغد عيش ونعمة لا يعلمها الا الله فملكنا رعاه الله ما تنام عينة ومواطن سعودي لا يملك منزلاً ليس كما انتم( شقه) ولا تغفوا عين ملكنا ومواطن سعودي لم يتوظف وظيفة محترمه تكسبه رغد العيش فنحمد الله على هذه النعمة فنحن نحب ملكنا عبدالله بل نعشقه عشقا وبجنون فلك يارب الحمد والنعمة .<br />فأتسائل وأقول بالله عليك اذكر لي احدا من بلدكم يثني على من يرئسكم (حسني) طبعا<br />غير من بجواره لانهم شركاء في سرقتكم وأموالكم<br />قل لي ما ذنبنا نحن عندما يدوس رئيسكم وابنائه وحاشيته وظباطكم على بطونكم وهذا هو سبب حقدكم على السعودية وأهلها لانهم يعيشون في نعيم ورفاهية<br />فلتعلم وأعلم انك تعلم عندما يخطى في بلدنا أي مسؤول من وزراء وظباط على اصغر احد من افراد الشعب فإن حقه لا يضيع فسوف يحاسب الظابط وسوف يحاسب الوزير لماذأ ؟؟؟ لان في بلدنا كل مواطن له العيش الكريم ولا يهان ولا يداس على بطنه كما في بلدكم والظباط في مصر خير دليل وانت تعرف ذلك وقصص الضباط كثيره وإن اردت مقطع في الجوال فأنا في انتظارك على البريد qqq232@hotmail.com<br />واعلم اننا نفتخر في اننا رعاة للغنام وعشاق للصحراء فالاغنام هي من رعاها الانبياء جمعا دون استثى فهذا شرف لنا بأن نرعى الأغنام كما رعاها الانبياء<br />ونعيش في الصحراء تلك الرمال الجميلة التى منها خلق ابونا آدم فلا تجد سعودياً الا ويعش الصحراء لان الصحراء هي تحمل في بطنها مصدر رزقنا وعيشنا فلك الحمد يارب ان وهبتنا هذه الصحراء<br />وأعلم اننا نفتخر بأننا ننتمي لهذا البلد لماذا؟ لاننا نحن ابناء صحابة رسول الله اليس لنا الحق بالفخر يا ابناء رمسيس الثاني (فرعون) طاغية الارض<br />اختصاراً للموضوع لان التعب انهكني بسبب الكتابة والرد على انساااااان حقير لا يستحق هذا الوقت الثمين أقول<br />. ستظل السعودية شامخة كالجبال لا تهتز من الرياح<br />. ستظل بلدي السعودية البلد الذي يتمنى كل من على الأرض زيارتها<br />. ستظل الكلاب تنبح والقافلة تسير<br />. ستظل بلدي السعودية تتزعم البلاد العربية<br />. سأظل اكرر وأقول ( موتو بغيظكم )<br />عموما انا اردت ان اتحاشى الكلام البذيى كما فعل الحقير info<br />وعلى فكره نسيت ان ارد على قوله ( بأن السعوديين يأتون مصر عشان احنا ناخذ فلوسهم) بالله عليك اهذه مفخره لك وتعلم انت شخصيا لاي سبب تأخذون الفلوس من السعوديين واذهب لشقق المهندسين وشارع الهرم وشار فيصل<br />بالقاهره وسألهم عن ماذا تأخذون الفلوس من السعوديين ستجد الاجابه عندهم وإن كنت انت شخصيااخذت فلوس من السعوديين فعليك العار والعار والعار لانك تعلم على ماذا يدفع السعوديين فنتبه لا تفظح نفسك واستر عليها.<br />ودمتم"
