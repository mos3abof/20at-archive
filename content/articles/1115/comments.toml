[[comments]]
order = 48
subject = "حسبنا الله ونعم الوكيل"
author = "مصرية مسلمة وأفتخر بإسلامي"
posted = "2006-10-06"
text = "حسبنا الله ونعم الوكيل في كل من سمحت له نفسه بالتطازل على أعراض المسلمين والمسلمات السعوديين والمصريين....يا ناس حرام عليكم....ده قذف للمحصنات...اتقوا الله...سعودي ايه ومصري ايه؟؟؟ما كلنا فينا عيوب..مش معقولة كل أما نكتب موضوع عن أي دولة افاجأ بكم السباب والقذف...يا سيدي كل بلد فيها الناس المحترمة واللي مش محترمة..ومفيش داعي للكلام القذر..راعوا ان في بنات اخواتكم بيقرأوا الموضوع...والله أشعر أني ارتكبت ذنب بقراءة تلك التعليقات التي أقل ما يقال عنها قذرة...اللي بيكتب التعليقات دي..يقدر يقولها بصوت عالي؟؟طبعا لأ عشان الناس هتقرف منها وهتستهجنها...طيب ما بالك برب العاليمن اللي شايفك وانت بتكتب...اتقوا الله يااا ناس..واتقوا الله في اخواتكم المسلمات...ومتضحكوش الغرب علينا....لا حول ولا قوة الا بالله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

[[comments]]
order = 49
subject = "انا مصري وابويا مصري ههههههههههههههههههههههه"
author = "الحين انا ابي افهم شي واحد؟"
posted = "2006-10-08"
text = "الموضوع بين السعوديين والمصريين ليه ياكلب يافلسطيني يايهودي ياحقير تتدخل؟؟<br />طبعا هذه عادتكم الغدر والاصطياد في الموية العكرة.. ترى احنا مانسينا وقفتكم ياخاينين انتو وابو براطم ياسر كفرات ضد الكويت وعذبتو الكوييتيين كل هذا بسبب حقدكم يايهود والمقوله هذه صحيحه ميه بالميه ( من عاشر القوم صار منهم) وانتو عاشرتو اليهود بما فيه الكفاية ... بصراحه انا مستحيل انزل نفسي وامشي مع فلسطينية يهودية واللي انتو فيه هذا عذاب من الله ماراح يخلص الا لما تنقرضون انتو واليههود اللي منجسين بيت المقدس<br />اقسم بالله العظيم ان مهما قيل ضد السعوديه فهذا اكبر دليل على الحقد والغيرة ,, والله سبحانه وتعالى عشان كذا كرمنا عليكم لسبب بسيط وهو ان احنا مانحقد على احد..<br />وبعدين انتو يامصريين اخر من يتكلم والله ماانسى يوم كنت صغيرة جاني واحد نقيب ومد يده عشان اعطيه بقشيش انتو مستحيل تسوون شي ببلاش انتو اعظم من الامريكان لان انتووو تبيعون نفسكم عشان الريال السعودي ههههههههههه<br />يالله الله يشفيكم انشاءلله من حقدكم ومن غباءكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

