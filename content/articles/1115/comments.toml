subject = "عن مسلسل طاش ما طاش"
author = "فهد ناصر القصبي ولد ناصر القصبي"
posted = "2006-10-14"
text = "طاش ماطاش ناااااااااااجه وبعدين يامصري ترا سعودي كفيلك :<br />واسكت تفهم وخلونا في موضوع طاش طاش حكا عن المجتمع السعودي وبعدين في شيوخ حرمو طاش ما طاش ليش وش شايفين طاش وفي شيوخ اتهمو طاش انهم اسائو للدين والله كل هذا حقد من شيوخ على طاش لان فضحوهم ابوي ناصر وصديق ابوي عبدالله السدحان<br />وارجو من الي تابعو طاش انه يفهمون الحلقه مو يسمع مطوع قال اسائوي يصدق انتم تفهمون الحلقه انا الي مقهرني انهم قالو اساء بدين عشان حلقت ارهاب اكدمي وارجو في استمرار طاش ما طاش لانه مسلسل ناجه وافضل مسلسل عربي كوميديا ناقد الحين هذا الهواش ليش مابين مصر وسعوديه والله بعد يبون يوحدون العرب مدرو ان العرب مايحبون بعض"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132450/http://www.20at.com/article2.php?sid=826"

