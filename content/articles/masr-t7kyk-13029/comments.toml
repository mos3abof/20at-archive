author = "ابومحسن غربة 28 سنه"
posted = "2009-08-23"
text = "من غير النبي محمد ما ينفعش من غير منهج النبي محمد صلى الله عليه وسلم ما ينفعش من غير شمولية المنهج ما ينفعش<br />اذا كانت الامة المصرية تريد ان تنهض لا بد من الحل الشامل<br />لا بد من دراسة الجزيرة العربية في هذه المراحل الثلاث<br />1) قبل البعثة المحمدية وكيف كان يعيش سكان الجزيرة العربية<br />2) اثناء البعثة المحمدية وكيف علمهم سيدنا محمد المنهج الرباني<br />3) بعد انتهاء البعثة المحمدية وبداية تطبيق منهج النبي صلى الله عليه وسلم بعد وفاته وكيف انطلق المسلمون لفتح الشرق والغرب وفي اقل من 100 سنه كانت الدولة العربية من اسبانيا الى الهند<br />هو دا الكلام الصحيح اذا كانت الدولة عايزه تنهض<br />لازم يبقى فيه وقفة مصرية للحكام والمحكومين<br />ولازم يختاروا منهج النبي<br />بفهم اهل السنه والجماعة<br />وليس بفهم الشيعة والخوارج"
archived = "2009-08-27"
capture_url = "https://web.archive.org/web/20090827110500/http://www.20at.com:80/masr/t7kyk/13029--q-q.html"

