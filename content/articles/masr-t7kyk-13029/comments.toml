author = "منى ذكي واحمد حلمي"
posted = "2009-08-24"
text = "انا منى ذكي باخد في الفيلم كام مليون جنيه<br />وانا احمد حلمي باخد في الفيلم برضه كام مليون جنيه<br />واصدقائنا الفنانين اللي بيمثلوا برضه كل واحد فيهم بيرزع كام مليون جنيه في الفيلم او في التمثيلية ودا كله على حساب الشغب<br />تبرعات ايه وبتاع ايه وعمرو الليثي ايه ورحمة ونور ايه<br />انت عايزين تخربوا علينا السوق<br />عايزين الناس تعقل وتروح تودي فلوسها للعيانات والمرضى واللي معندهمش سكن<br />ايه الكلام الفارغ دا<br />الناس لازم تخش سينما ومسرح وتتفرج على المسلسلات وتتفرج على ماتشات الكوره وتدفع تذاكر<br />علشان خاطر احنا نبقى اغنياء ونسكن في الزمالك ونركب عربيات<br />سيبوكم بأه من الحركات دي<br />بلا عمروا الليثي بلا بخيخ<br />ما يروح يشوفلوا شغلانه عمرو الليثي دا<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2009-08-27"
capture_url = "https://web.archive.org/web/20090827110500/http://www.20at.com:80/masr/t7kyk/13029--q-q.html"

