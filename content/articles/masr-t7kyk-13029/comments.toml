text = "سبحان الله<br />ينبغى علينا الوقوف بجوار هذه الفئه الضعيفه فى المجتمع لانهم من حقهم ان يعيشوا حياه كريمة و لو بسيطة فجميعنا لا نطيق ان نجلس فى هذه الاماكن مده طويله عند زيارتها فكيف الحال بهم<br />عن أبي الدرداء رضي الله عنه قال: سمعت رسول الله صلى الله عليه وسلم يقول: { ابغوني في ضعفائكم، فإنما ترزقون وتنصرون بضعفائكم } [رواه أبو داود والترمذي وصححه الألباني<br />فاذا ارادنا العزة فعلينا بالضعفاء"
archived = "2009-08-27"
