subject = "خطأ غير مقصود"
author = "حمدي"
posted = "2006-04-03"
text = "معلش انا اسف التعليق اللي فات كان مفروض انه يتحط في موضوع تاني<br />يبدو اني هاكون من المرشحين!!!!!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133440/http://www.20at.com/article2.php?sid=649"

