subject = "سبسطية"
author = "سانيه ابو عمشة"
posted = "2006-06-02"
text = "السلام عليكم صحيح هذه القريه حلوه و فيها اثار حلوه كتير انا من مواليد هذه القريه الرائعه لكن للاسف انا الان متغربه ..و ان شاء الله بيجي يوم وارجع لبلدي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133440/http://www.20at.com/article2.php?sid=649"

