[[comments]]
order = 0
subject = "الجمال بعينه"
author = "وعد"
posted = "2006-04-03"
text = "السلام عليكم<br />الجمال الفلسطيني بالطبع لا ينسى ولا يحدد بمكان او بآخر، وانما الذي لا بد ان نعرفه هو جمال المكان باهله الفلسطينيين، فلسطين جميلة باهلها وسكانها، وان كمان التاريخ ايضا يروي عطش المحب..شكرا شكرا لكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133440/http://www.20at.com/article2.php?sid=649"

[[comments]]
order = 1
subject = "اشتاق"
author = "عزالدين"
posted = "2006-04-03"
text = "بقدر ما ترتسم البسمة على محياي وانا أقرأ هذا الوصف بقدر ما تختلط الغصة بالبسمة ..<br />فاللاجئ مثلي كالطفل بين يدي جدته يستمع إلى حكايا الاساطير ويتمنى أنها احد شخوصها<br />تحاتي لك اخي عاطف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133440/http://www.20at.com/article2.php?sid=649"

[[comments]]
order = 2
subject = "ايه رايكم"
author = "حمدي"
posted = "2006-04-03"
text = "ايه رايكم نعمل مسابقه احنا كمان من نفس النوع ونرشح اكثر الناس حمقا في العالم العربي<br />وكل واحد يشوف مثلا مين اكتر تلات شخصيات حمقا هذا العام<br />واظن مش هنغلب في اننا نلاقي حمقي في العالم العربي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133440/http://www.20at.com/article2.php?sid=649"

