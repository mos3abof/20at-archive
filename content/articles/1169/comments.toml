subject = "روعة"
author = "أنور أبوغليون"
posted = "2006-07-03"
text = "ياللعظمة والروعة بالصدفة عرفت أن هناك مدينة رائعة اسمها سبسطية في \" فلسطين ماوراء الحق والحقيقة \" عندما كنت ابحث عن معلومات تتحدث عن بلدتي الحبيبة الموقر في عمان / الأردن . شكرا لكم"
archived = "2006-11-02"
