text = "و الله يا جماعه اكتر حاجه منكده على الواحد فرحته بالمونديال بعد عدم التواجد المصرى للعام ال500 على التوالى و التوازى مع بعض هو افتقادنا للمعلقين المصريين زى ميمى الشربينى و مدحت شلبى و حتى غتاته شوبير وحشانا<br />على الاقل هيرحمنا من المعلقين اللى بينطقو انجلتر ا انجليترا<br />المهم ماتش انجلترا(قصدى انجليترا) و البارجواى كان ف الجووووووون<br />يا ترى عملت ايه يا عبد الله<br />الوصله جابتللك ال art , gh gh"
