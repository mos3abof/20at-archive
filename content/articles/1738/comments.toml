subject = "عرس للديمقراطيه"
author = "حمدي"
posted = "2005-12-16"
text = "الانتخابات العراقيه مفبهاش بلطجيه ولا شرطه بتمنع الناس من الادلاء بصوتهم واعتداءت علي المشرفين علي الانتخابات<br />مش ملاجظين معايا ان الدولتين العربيتين الوحيديين اللي الانتخابات فيهم نزيهه يخضعون لاحتلال!!!!<br />ياتري ليـــه حد عنه اجابه ؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152351/http://www.20at.com/article2.php?sid=90"

[[comments]]
order = 1
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-10-01"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152351/http://www.20at.com/article2.php?sid=90"
