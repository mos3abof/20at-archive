subject = "انا مليش دعوة ياعم"
author = "عهدى"
posted = "2006-09-15"
text = "انا مش عاوز نروح اى بلد عربى علشان نعمل مباحثات احنا عوزين عقود عمل الواحد بيكح تراب وبعدين السودان هنرحها ليه دا هما الى بيجلنا هما الى رفعين معنوياتى لما باشفهم فى الاسواق باقول الحمد الله اخيرا شفت حد ااقل منى وعظيم الشكر والتقدير للسيد الرئيس الزعيم كينج العرب وكبرنا كلنا ربنا يديه الصحه ويديه كل الى نفسه فيه والى بيتمنها وبعدين انا عاوز اعرف هى المواقع دى معمولا ليه واحنا عرفين حاجه اصلا خلينا فى الهم الى احنا فيه وسلام بقى يا رجالا علشان انا لسا جى من شغل ورايح شغل تانى والله عاوز ادفع الجمعيعه وادفع الايجار واجيب لبس المعهد علشان الدراسه بكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125318/http://www.20at.com/article2.php?sid=331"

[[comments]]
order = 13
subject = "استغاثة"
author = "dodo"
posted = "2006-09-19"
text = "السيد الرئيس محمد حسنى مبارك<br />المبارك دائما وابدا ان شاء الله العلى القدير<br />بعد التحية<br />مقدمة لسيادتكم سكان شارع حسنى المتفرع من شارع رمضان الزقازيق البحرى<br />نستغيث بسيادتكم من بعض البلطجيه وتجار البانجو والحبوب المهلوسة الذين<br />يتخزون من الشارع وكرا لهم بصفة دائمه ومستمرة<br />حيث انهم من عائلة واحدة وهم يقيمون بمنزل ام زكى وهم احفادها من ابنتها<br />التى تدعى /أمل<br />فهم عبارة عن اربعة ابناء<br />عملهم الوحيد هو السرقه من الجيران والأتجار فى المواد المخدرة على مرئي<br />ومسمع من سكان الشارع وفرض اتاوات على المحلات والسرقة منهم ومن يتعرض لهم<br />يكون جزائه السرقه والتحرش به بالمطاوى ولأسلحه البيضاء<br />وقد تقدمنا بعدة بلاغات للجهات الأمنيه إلا انهم لايستجيبون لأستغاثاتنا<br />بهم<br />لذا نرجوا من سيادتكم وانت الأب الكريم لشعبك ورعيتك<br />العمل على التحقيق فى الأمر<br />حيث انهم يقومون بنصب طربيظة بلياردوا امام منزلهم وتجميع بعض اللصوص على<br />شاكلتهم واللعب بها بالقمار مما يترتب عليه وقوع مشاجرات تستعمل فيها<br />الأسلحة البيضاء بكافة صورها والألفاظ النابية بكافة اشكالها مما يعرضنا نحن<br />وابنائنا للكثير من الضيق والحرج لذلك نهيب بسيادتكم التكرم بتحويل شكوانا<br />إلى السيد / المستشار / المحافظ<br />وكذلك<br />السيد الواء /وزير الداخلية<br />الذى نعلم ما لجدة وحزمه من تأثير على تخليصنا من هؤلاء الشرزمه من<br />البلطجيه واللصوص وتجار البانجو والمواد المخدرة وجعل البلاد بلاد امن وامان<br />كما يحب ان تكون عليه سيادة الرئيس / محمد حسنى مبارك<br />جعلة الله زخرا لنا ولمصر وللعالم اجمع<br />مقدمة لسيادتكم/<br />سكان شارع حسنى من شارع رمضان الزقازيق البحري<br />مدينة الزقازيق<br />محافظة الشرقية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125318/http://www.20at.com/article2.php?sid=331"
