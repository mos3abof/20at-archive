[[comments]]
order = 4
subject = "استغاثة دم الشهيد"
author = "يوسف خميس ابراهيم"
posted = "2006-04-08"
text = "بسم الله الرحمن الرحيم<br />اسثتغاثه دم الشهيد يوسف<br />يوسف خميس ابرهيم السيد الفضالي 19 سنه والحاصل على دبلوم الدنبوسكو وعنوانه امام 370 ش مصطفى كامل امام مسجد ابو العنين ويعيش مع اسرته المكونه من والده ووالدته واخواته الثلاث بنفس العقار ويعمل معهم فى مجال تصنيع الاخشاب وبيعها بالمعرض بنفس المكان .<br />وهو شاب جميل ووسيم وهو يصلى مع باقى الاسرة فى المسجد وإمام المسجد يشهد بذلك مع باقى المصلين انه لا يترك فرد ربه مهما كانت الظروف .<br />كان يبدأ يومه من التاسعة صباحا فى العمل بـ ورشة النجارة التى يمتكلها هو وأخوته حتى العاشرة مساءا وكان بعد يوم العمل يخرج يرفه عن نفسه مع اصحابه .<br />وفى يوم الجمعه 24/3 الساعه 11 مساء كان على موعد مع صديقه ايهاب الذى يسكن بشارع ممتاز باشا وهو يمتلك محل لبيع براويز آيات قرآنية امام معرض يوسف للخروج واثناء وصوله لصديقه صدف بهم اثناء مرور ضابط مباحث قسم المنتزة رأى بعض الشباب موجودين على ناصيه الشارع وكان بصحبتهم كلب ولف ففروا منهم خوفا وتركوا الكلب ثم اخذ يوسف الكلب ثم آتى الظابط وامين الشرطة الى يوسف الذى كان واقف امام منزل صديقه فقام بتفتيش يوسف ومن معه وضربهم اثناء التفتيش ولم يجد معهم شيئ فطلب الظابط بتركه للكلب قال له( لا) فقال له اتركه وإلا اطلقت عليك وعليه النار فرد يوسف قائلا لم تطلق على النار ولم تجد معى شيئ وانا لم افعل شيئ فزداد الظابط ومن معه فى السب والاهانه له وانهال عليه بالضرب واخرج الضابط مسدسه وهدده ووجه المسدس لـ دماغه ولم يتردد واطلق عليه الرصاص فى دماغه وهرب الكلب بمجرد اطلاق النار فسقط يوسف على الارض فظل يضربه مررا وتكررا نظر ايهاب الى يوسف فألقى بنفسه فوق يوسف وقال للظابط اضربنى انا كمان فقاموا بضرب ايهاب واخذوه الى القسم وظل يوسف ملقي ارضا ولم يسعفه احد وكل من يقترب اليه يهددوه بالضرب حتى أتى اخواته إبراهيم 24سنه واحمد 15 سنه ورأو يوسف ملقى ارضا فأسرعوا عليه مزهلين فقام الظابط ومن معه بضربهم واصطحبهم الى القسم وأتت الاسعاف واخذو يوسف بعد مرور ساعة وذهبوا به الى المستشفى الاميرى<br />وفى الحقيقة<br />ان يوسف وصل الى المستشفى وهو متوفى وهذا بشهاده شهود من داخل المستشفي ومنع ضباط المباحث أهل يوسف وأقاربه من رأيته بحجه أنه فى غرفه العمليات حتى تمكنوا من وضع أنبوب داخل يوسف وأخرجه إلينا فى الخامسة صباحا وقمنا بوضع يوسف فى سيارة اسعاف تابعة للشرطة وذهبنا الى مستشفى الثغر وتم رفض الحاله بحجه عدم وجود جهاز تنفس وطبيب متخصص ومثلها مستشفى السلام وفيكتوريا واتضح لنا ان الجهات المسؤله قامت بالاتصال بهذه المستشفيات لرفض الحاله فى هذا الوقت تمكن ضباط المباحث بعمل محضر ليوسف ومن معه بوضع كمية كبيرة من المخدرات لتبرير الخطاء الفاضح الذى فعلوا وهو ضحيه الظلم وضحيه ضابط لم يرحم شاب 19سنه متعلم ولم يسبق له اى سابقه فى القسم . ومن منا يقبل ما حدث لـ أخ له<br />· هل معامله الناس هكذا ؟ هل حياة الانسان رخيصه ؟ وهل يستحق هذا ؟<br />· هل ثمن حياة الانسان بـ رصاصة ضابط ؟وما هو الخطأ الذى فعله يوسف لكى يلقى بقتله ؟<br />وبعد ان توفى يوسف لم يكتفوا ضباط المباحث من ذلك ولكن اخذوا اثنين من الشباب وهم فى عمر الزهور وقاموا بوضع المخدرات لهم جميعا بما فيهم الشهيد يوسف وهؤلاء الاثنين هم الشهود الاول ( ايهاب زكى محمد ) والثانى ( عبد الله محمد رسلان ) فـهل يدفعون هؤلاء الاثنين ثمن غياب ضميرضابط شرطة وأخيرا وليس آخرا نناشد المواطنين الشرفاء من بيدهم توصيل صوتنا للمسؤليين وسرعة التحرك قبل ضياع حق يوسف وضياع مستقبل الشابان .<br />· هل من العداله ان يقتل الضابط يوسف وفى نفس الوقت يشوه سمعته بعد ان يقتله<br />· هل من حق الضابط بضرب النار على الناس بدون وجه حق<br />وكل ما لدينا هو ( حسبنا الله ونعم الوكيل )<br />ونقسم بـــ الله ان هذه هى الحقيقة التى رواها سكان المنطقة التى وقع فيها الحادث<br />للشهيد الفاتحه والدعاء له بالرحمه<br />نرجوا من سيادتكم النظر فى هذا الامر لكى لا يحدث لنا من الحكومة الظلمة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125318/http://www.20at.com/article2.php?sid=331"

