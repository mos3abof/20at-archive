subject = "والله منَا عقدة"
author = "واحد مخنوق"
posted = "2006-02-02"
text = "يا جماعة بصوا حواليكم, بصوا و فوقوا بقى التمثيلية لسة ماخلصتش , لأ دى لسة فى بدايتها, والله هما الخبراء اختلفوا فى موضوع عدم حضور الريس اجتماع القمه الأفريقيه و فى اكتر من سبب:<br />1- جماعة بتقول ان الريس ماحضرش القمه الأفريقيه لأن الريس و مصر عامة ماعدتش سمعتها حلوه عند اخواتنا السودانيين أولا بسبب علافات مصر مع السودان طبعا مش العلاقات اللى بنشوفها و بنقراها فى تليفزيون الحكومه إنما انا اقصد العلاقاتاللى مصر بتلعب فيها دور الوسيط بين أمريكا و دول النطقه كلها و هنا مصر ممكن نسميها.......و لا بلاش عشان الرقابة..هاها..السبب التانى بقى شكل و فضيحة مصر فى موضوع اللجئين السودانيين و مش هقول بقى ايه اللى حصل...بقول ايه انا لازم ماشى أكملكم الكلام بعدين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125318/http://www.20at.com/article2.php?sid=331"

