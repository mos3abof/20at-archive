subject = "صح النوم (ميزو)"
text = "بصراحة اسلوب جميل ومشوق ولكن فى مشكلة وحدةاخاف ان تتكرر معى كلما قرأت قصصك<br />على فكرة انا اول من قراء هذة القصة ولكنى تاخرت فى التعليق<br />فانا نمت وانا بقرأها من شدة جمالهاحيث زكرتنى بقصص جدتى<br />ولسة صاحى حالا هوا انهردة كام فى الشهر؟<br />بس الى فكرة انى نايم و مفيش ولا تعليق على الرسالةعموما انتظر باقى كتاباتك<br />بس ربا يستر ومنمش تانى الى القاء"
