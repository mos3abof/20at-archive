[[comments]]
order = 20
subject = "أشكركم من الأعماق"
text = "السلام عليكم<br />إخواني واخواتي ...في البداية أود ان اعرفكم بنفسي\"رغداء بندق\" محررة باحد المواقع و بموقع عشرينات وأقوم بدور صابرين بطلة \"مذكرات بنوته مفروسة\".<br />في الحقيقة سعدت كثيرا بتعليقاتكم وسعدت أكثر بتواصلي مع البعض منكم ووجدتها فرصة جيدة أن أوجه لكم الشكر الجزيل وأن أوضح وجه نظري بالمرة.<br />أنا ليس لي اعتراض على الـ500 جنية إياهم وعارفة كويس إن أقل من المبلغ ده بيعيش عيلة كاملة، لكن الفكرة مش في المبلغ ولا الاعتراض كان ع المرتب بس ( والغريب ان الاعتراض على الفلوس كان من الشباب بس وكاني بشاور على كل واحد فيهم وبقوله انت ده) لكن القصة لو راجعتوها شوية هتلاقي الاعتراض كان على اللبس وعلى انعدام الطموح أو الهدف في العريس وآخر حاجة كانت الفلوس. ...يعني صابرين(البطله) مظلمتش الراجل.<br />أما عن أهدافي لعرض مسلسل مذكرات بنوتة مفروسة فكان لكذا سبب بصراحة:<br />1- إني أعيش الشباب تحديدا في مشاكلنا.<br />2- اني انقل اللي بيحصل في البيوت لما بيجي عريس لصفحات الويب.<br />3- يمكن عرضي دة يكون فيه سبب او مبرر للسؤال التقليدي (فلانة ما اتخطبتش لية لغاية دلوقت؟).<br />4- وهو اهم سبب بالنسبة لي...اني نفسي اسمع من شاب لية هوه كمان بيرفض فلانة ويطلع القطط الفاطسة في علانة!!!...فقلت يمكن بالحواديت دي استفزززز حد فيهم بل وانتهز الفرصة وادعو الشباب لطرح مذاكرته ويعرض الواقع بحياد يمكن القصص دي تلفت نظر الشباب لنقطة مش واخد باله منها أو ممكن تؤثر فيه تأثير ايجابي أوأو أو...وكمان العكس صحيح بالطبع.<br />أكرر شكري العميق لكل من شارك بتعليقه على المذكرات وانتظروني في الحلقات القادمة.<br />رغداء بندق"
archived = "2004-04-26"
capture_url = "https://web.archive.org/web/20040426084804/http://www.20at.com:80/article.php?sid=94"

[[comments]]
order = 21
subject = "نصيحة من اخوكى ......الشمحطجى shamahtagi@hotmail"
text = "يا ست الحاجة انا سبق و قلت ليكى الحقى و اتجوزى الواد ده<br />طالما هو واد طيب و ابن حلال و بخصوص المرتب و الحاجات دى كلها بتيجى بعدين او ماتجيش مش مهم و على رأى المثل \" ضل راجل و لا ضل حيطه\"<br />اما بخصوص ان اهلك عايزين يفرحو بيكى انا ماأظنش الموضوع موضوع فرحة<br />هما عايزين يخلصو و السلام اصل قعدت البت فى البيت وحشة و اهى جوازة و اقلب \" و جوازة تفوت و لا حد يموت<br />اتجوزيه و اشربى وراه كوبيتين ميه ساقعة.<br />على فكرة يا رغد الموضوع جميل جداً<br />( كلهم قالو كده) و باين عليه طالع من القلب<br />و ربنا يستر بنتنا كلهم<br />قولى آمين"
archived = "2004-04-26"
capture_url = "https://web.archive.org/web/20040426084804/http://www.20at.com:80/article.php?sid=94"

[[comments]]
order = 22
subject = "هشام_مصر"
text = "السلام عليكم ورحمة الله .<br />والله للأسف الشديد .. هذا الشاب الذى يتقاضى 500 يعتبر لقطه فى هذا الزمان .<br />الا اذا كنتى تبحثين عن واحد مرتشى أو حرامى او وارث على الجاهز .<br />وحتى لو فرضنا ان فيه شباب ناجح وبياخد مرتبات عاليه ، فمن غير المقبول أن يكون طموح الفتاة هو المادة وفقط ..<br />أعتقد أن هذاالمقال ييارك ما تفعله الفتيات من مبالغة فى الطلبات ، وعلى أى حال همه اللى خسرانين<br />خليكوا قاعدين معنسين كده<br />أما بخصوص انه غير متفتح ، وليس له طموح فأنا اتفق تماما معك بهذا الشأن<br />اما بخصوص الهوايات ، فالناس خلاص نسيت يعنى ايه هوايات ، وربنا يخليلنا الحكومة .. فيه ناس بقت هوايتها انها تقف فى طابور العيش ، او انه يقعد يحسب طول الشهر ازاى المرتب يقضى المصاريف ..<br />وشكرا"
archived = "2004-04-26"
capture_url = "https://web.archive.org/web/20040426084804/http://www.20at.com:80/article.php?sid=94"

[[comments]]
order = 23
subject = "مريــــــــــــم"
text = "اسلوب ظريف ... والفكرة دمها خفيف ...<br />ناقشت الكاتبة مشكلة واقعية جدا ..<br />وهي اختلاف الآراء بين الفتاة وعائلتها في اختيار العريس ...<br />فهم يفكرون من منظور الستر والاطمئنان على البنت في ظل اي ظروف ((( معقولة ))<br />وكأنهم يحرمونها من الحق في أن تحلم ...<br />وتختار بحسب المستوى الذي تريده لها ولأطفالها في المستقبل ....<br />ولكن ... الحلم قد يقودنا الى طريق المالانهاية ...<br />فلنحكم العقل والمنطق ...<br />وليكون الواقع هو الأرضية الصلبة التي نقف عليها ...<br />لا التي نقع عليها بعد وقوف مطول على ارض الأحلام الهشة ...<br />كما تفضل الاخوة الراتب لا يمثل مشكلة .... لأن اي شاب في بداية حياته سيكون في مثل هذه الظروف ...<br />ولكن اشارك الكاتبة في اعتراضها على حالة الرضا بالواقع دون التفكير في الارتقاء بدافع الطموح الذي يقود اصحابه الى القمة ...<br />تحياتي العطرة للكاتبة المبدعة ...."
archived = "2004-04-26"
capture_url = "https://web.archive.org/web/20040426084804/http://www.20at.com:80/article.php?sid=94"
