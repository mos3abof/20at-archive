[[comments]]
order = 4
subject = "املك سلاح قبل ما يملكوك"
author = "عقلاني"
posted = "2006-02-17"
text = "طبعا لما لاسلام قال لنا اعدوا لعدوكم ما ساتطعتم من قوة ومن رباط الخيل.وكان زمان رباط الخيل بمعني العتاد العسكريةوالان بمعني الدبابات والطائرات والاسلحة المتقدمة عموما.ليه كل دا ! ..لترهبون به عدو الله وعدوكم.<br />يعني ايه الكلام دا !<br />اذا دولة عربيه عندها سلاح رادع.كانت هتقرب علينااسرائيل ولا هتتطاول علينا أمريكا الأم!<br />اذا مصر تمتلك سلاح رادع غير شوية جنود منهوكين وكل واحد فيهم بيفكر يا تري هعمل ايه في حياتي ولا في امي الغلبانة ولا اخواتي المساكين.كانت امريكا هتتطاول عليها بالشكل الواضح دا.الشكل اللي مخلي مصر زي الخاتم في اصبع ماما امريكا.روح هنا يا رئيس.نروح هنا.اترزع هنا.اترزعنا.اوعي تتكلم في موضوع الدين.الدين كوخخة.مش هنتكلم. اذذكر ان الرئيس راح يزور امريكا عام 2003 واترزع ثلاثة ايام عبال ما قابلة جورج بوش.3 ايام يا جماعة.أكيد كان بيباشر أعمال أهم زي انه يمشي كلبة المدلل في الحديقة.أو ياخد درس بيانو.<br />لكن لو رئيس دولة محترم وليه شخصية زي شارون.بوتين.شيراك. كان هيسيب اللي في ايدة ويقابلة في المطار.<br />أن ما يعجبني في رئيس ايران.انه قوي.وعنده وضوح في كلامة والجماعة الأعداء بيخافو من الواضح.قالها.اذا ايران مسها حاجة اسرائيل هتمحي من الوجود.ولن تشعر باستقرار.يقدر حد من العرب يقول كدة.حاشا وكلا.<br />مع ان الايرانيين شيعة لكنهم عندهم عزة نفس.ليست عن العرب.مع ان الفرس كانو العكس بالامس ولكنهم اعزاء اليوم.<br />الغريبة ان الهند عملت قنبلة نووية ومحدش اتكلم بعدها باسبوع واحد فقط كانت باكستان عاملة قنبلة وجربتها لتفاجئ العالم بانها دولة قوية.<br />طلعولي دولة عربية قوية.غير واحدة كانت قريبة من تصنيع القنبلة النووية قبل ما يخونها رئيسها ويكشف ما تحت النقاب من غني.الا وهي ليبيا.مع انها محاصرة سياسيا واقتصاديا لكن كانت علي بعد شهور من القنبلة النووية.طيب واحنا فين من دا كلة اللي معليناش حظر اقتصادي.<br />ان التكنولوجيا النووية ليست خطيرة اذا ما تم استخدامها في الغرض السلمي مثل توليد الكهرباء.<br />اذا توفرت الطاقة النووية لتوليد الكهرباء هنستغني عن البترول .اذ ان السيارات تمشي بالكهرباء أيضا.نطبخ حتي علي الكهرباء.لكن نعمل ليه مفاعل سلمي مع اننا بنقدر ناخد كهرباء من السد العالي.<br />أبدا يا جماعة مش هنقدر نواجة اسرائيل لأنه قالها الرئيس بالمفتشر بعد انتفاضة الاقصي سنة 2000. قال\"مش هنقدر نحارب\".اتخيلو لما تقولو لأعداءكم لو انتو احتلتونا مش هنقدر نحاربكم!<br />.فليبارك الله في ايران رافعة عزة الاسلام وان كانو علي خطأ في مذهبهم الشيعي. ولكنهم من رافعين علم عزة الاسلام.<br />وليخسأ العرب ورؤساءهم زو الرؤووس النعامية المتطأطأة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125609/http://www.20at.com/article2.php?sid=453"

