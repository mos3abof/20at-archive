[[comments]]
order = 9
subject = "وجنت ايرااان على نفسهاااا"
author = "احمد شكري"
posted = "2006-03-30"
text = "مقال جميل بصراحه بس عايز اقول حاجه....كل ده مالوش اي فايده بصرف النظر عن من مع او من مع ضد..ايراان بتتكلم وخلااص ماتعرفش تعمل حاجه...لو افتكرنا مع بعض ورجعنا شويه وشوفنا العراق او كوريا الشماليه او غيرها من الدول ..اي دوله من دوول وقفت قدام امريكا شوفنا حالها ايه دلوقتي..امريكا ما بتدخلش اي صراع حتى لو شفهي الا وهيه متأكده انها هاتكسبه ...زي ما احنا ملاحظيين وزي ما احمد قال دول اوروبا او غيرها من الدول اللي بترفض امتلاك ايران لسلاح نووي دي دول عارفه مصلحتها كويس اللي هيه مع اميركا القطب الاوحد..زعلى النقيض الدول التانيه روسيا والصين شايفين مصلحتهم فعلا مع ايراان لكن صدقوني ساعت الجد هنلاقي العكس خالص روسيا هتكون اول المدعمين لاميركا والصين هيشيلوا ايديهم بمعنى اصح من اللموضوووع كله لانهم ببساطه مش حمل امريكا ..شيء تاني مهم لو افتكرنا مع بعض في الغزو العراقي لما فرنسا فكرت في الاول انها تعاند امريكا اعتمادا عل المقاومه العراقيه في الوقت ده ولكن بعد ما تم غزو العرااق شوفنا امريكا عملت فيها ايه وضوفنا فرنسا اتحولت 360 درجه على النقييض<br />وحاليا زي ما شوفنا فرنسا على غير عادتها لاقينها مع امريكا ده ليه؟ عشان عرفت مصلحتها كويس<br />...ايران مهما عملت يا جماعه لو امريكا فكرت هتمسحها مسح ..زي ما قال الاخ محمد القناوي بالظبط ايراان تعبانه جدا جدا ..ايران صحيح كانت في فتره عندها قوه عظيمه جدا وكان جيشها بيعد سادس جيش على مستوى العالم بس طبعا امريكا ما سكتتش ولبست الدولتين في بعض العراق وايران وخربت الدنيا على كده وخسرت كتير من قوتها<br />ايران حاليا لا تقوى على شيء ايران للاسف زي ما بنقوول بالعاميه كده بتتسخن وخلاااص ..من مين بقى من روسيا طبعا روسيا عايزه تظهر على المجتمع الدولي من تاني وعايزه تبيع وخلاص لكن ساعت الجد وخلااص<br />زيما عملت معانا روسيا زماان وقالتلنا خشوا الحرب واحنا معاكوا وفي الاخر باعونا<br />هيه دي روسيا كل دوله بتدور على مصلحتها وبس<br />من الاخر عشاان ما اطولش عليكوا بصرف النظر عن اتجاهااات اي دوله من مع من ضد ..ده مش هيفرق مع امريكا لانها دوله عارفه بتعمل ايه كويس لما بتعوذ اي حاجه بتوصلها غصب عن انف الجمييع وعشان كده موقف ايراان ضعيف جدا جدا وكل اللي بتعمله كلاام فارغ وهيه اللي بتجن على نفسها<br />وهنرجع نقوول في الاخر<br />وجنت ايران على نفسها<br />شكرا ليكوا واسف ان كنت طولت<br />احمد شكري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125609/http://www.20at.com/article2.php?sid=453"

