text = "ارجو لفت نظر الساده القراء الى حقيقه قد تكون غائبه عنكم<br />ايران هى الدوله الوحيده فى العالم اللى اسمها الاسلاميه<br />islamic republic of Iran<br />حتى السعوديه اسمها المملكه العربيه<br />بالله عليك يا اخى ياللى خاءف من قنبله ايران كي تفكر<br />على فكره انا سنى ازهرى كمان<br />لكن الشيعى اخى<br />ربما تفكيره علط شوي لكن اخى"
