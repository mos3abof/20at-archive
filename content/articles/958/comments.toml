author = "فتى الاسلام"
posted = "2006-04-22"
text = "استمري استمري يا من علقت اسرائيل تحت طيات الرحيل ... نعم نعم يا ايران كم اتمنى ان تحذو الدول الاسلاميه والعربيه مثل ما فعلت ... فانت اسد في الشرق ... اقصفيهم فان الله معك ... دميرهم فان العرب والمسلمين معك ... كم من حقدآه آه آه قد ضاق بصدري وبصدر كل فتى عربي مسلم ضد بوش وارهابه ضد شارون الذي قد قضى الله عليه وسوف يقضي على من ياتي بعده ان شاء الله ... العزة لله ولرسوله وللمسلمين ... سوف نقضي عليك يا غرب يا اميركا يا اسرلئيل سوف تجدين الويلات والويلات في الدنيا وفي الاخره ... وهذه البدايه ... استمري يا جنود الله فان الله ناصرك ... استمري يا ايران فان كل عربي ومسلم جنبك ... استمري فان خالق الانس والجن معك ... وفقك الله وفقك الله ونصرك على اعدائك ... انا عماني وانت جارتي وسوف اكون جنبك باذن المولى القدير ... وداعا ايها الكلب سوف ترحل بغيضك .. وسوف يرحل من معك ..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125609/http://www.20at.com/article2.php?sid=453"

