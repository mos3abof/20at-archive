order = 1
subject = "نووي ابران لا يسرني"
author = "مسلم"
posted = "2006-02-16"
text = "إن ايران هذه دولة عنصرية متعصبة ، ولو كانت صادقة لاعطت الحرية لشعبوها المضطهدة كالعرب والاكراد والبلوش ، وغيرهم .<br />وبدلا من انفاق الاموال في السلاح الباهض التكاليف كالنووي وغيره ، وعلى العملاء في كل مكان ، كان عليها أن تنفق ذلك في رفع مستوى معيشة مواطنيها وتحسين احوالهم ، فالشعب الايراني من افقر شعوب الخليج رغما عن هذه الثروات التى تزخر بها ايران.<br />خلاصة الكلام، لا تفرحوا بننوي ايران ، فنظام ايران لايمكن الوثوق به."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125609/http://www.20at.com/article2.php?sid=453"

[[comments]]
order = 2
subject = "ايران"
author = "sweet_princess"
posted = "2006-02-17"
text = "ايران ممكن تكون ايران هي الدوله الاسلاميه الوحيده اللي ممكن تقف في وش الغول اللي اسمه امريكا مع اني اشك في كده وطبعا عشان دوله اسلاميه زي ايران لازم تتحارب عشان بتقول لا اله الا الله محمد رسول الله اما دوله زي كوريا الشماليه لما امريكا قالت دي بتعمل نشاط نووي واحنا لازم نفتشها زي ما عملو في العراق وعاوزين يعملو في سوريا بعدين ليبيا ومن وراها مصر (ما تخافوش الدور جاي علينا)بس لما اخينا بس يثبت رجولته ويتمرد ولو مره في تاريخ حكمه لينا (وطبعا دا من رابع المستحيلات)المهم لما امريكا قالت لازم نفتش كوريا كوريا ردت انها عندها فعلا نشاط نووي ولو امريكا خدت اي خطوه هتضربها بقنبله زي بتاعة هيروشيما وناجازاكي في اليابان فامريكا الجبانه قدمت اعتزار عالمي وفوري وان كوريا دوله صديقه احنا للاسف بقينا في عصر الكيل بمكيالين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125609/http://www.20at.com/article2.php?sid=453"

