subject = "الىالاخ فا هم جدا وال شكري"
author = "بكر العويس"
posted = "2006-04-26"
text = "الى الخ فاهم جدا ااااااانت غبي جدا<br />والى الاخ شكري امريكا شوف شو عملت لها كوريا الشماليه<br />دلتها وخلت راسها بلتراب<br />نتمنى للدوله الايرانيه النصرررررر<br />كل من يدل امريكا فهو حبيبي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125609/http://www.20at.com/article2.php?sid=453"

[[comments]]
order = 13
subject = "يامصريين فتحو"
author = "بلاد الحرمين"
posted = "2006-04-30"
text = "بسم الله.. حنا الخلجين اكثر الناس معرفه بايران وخطرها ياما سوت التفجيرات وياما دعمت الارهابين لزعزعه الامن الداخلي وياما حرضت الشيعه للثوره على حكام السنه وطالبتهم بالانفصال عن دولهم يعني عشمنا بمصر والسنه والعرب اكبر من كذا يعني يالمني تاايد بعض المصريين لايران يعني .. يدتضرب اخيها.. وخطر ايران كبير ياجماعه اسالو انفسكو ليش حربالعراق على ايران فالثمانينات وهي تهدد كل يوم بالسيطره على العالم العربي وعمل هلال شيعي يعني ياجماعه فتحووووو ارجوكم احنا بحاجه لتكاتف فيمثل هالوقت ..ومصر كما هو معروف الحليف الاسترتيجي الاكبر للسعوديه .. لاتخيبون ضننا فيكم ياجماعه .. لاننسا اسرائيل اكيد ولاكن لاناتي بعدو اخر ... وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125609/http://www.20at.com/article2.php?sid=453"

