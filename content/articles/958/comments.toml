[[comments]]
order = 7
subject = "السلاح النووي العربي الحلم الضائع"
author = "معمر يس"
posted = "2006-03-18"
text = "من الجيد ان تمتلك بلد مثل أيران تقنية نووية ولو سلمية فالعالم يتجه الأن للبحث عن بدائل للبترول المهدد بالنضوب في بحر عقود ومن ضمن البدائل الرئيسية محطات أنتاج الطاقة بالأنشطار المحكوم للوقود النووي الذي يتعين أن يكون تركيز اليورانيوم القابل للأنشطارفيه عاليا جدا, وهذا الوقود نفسه يمكن أن يتحول ألي مادة الأنفجار خارج المفاعل المحكوم بدورات تبريد واقطاب التهدئة المعروفة وسبب الخوف الغربي ليس فقط مسألة الوقود لكن أمتلاك أيران لتقنيات صاروخية ممتازة قادرة علي أرسال ونقل مادة الأنفجار هذه بدقة لأهداف أسرائيلية,ولا حاجة للقول بأن التقنية النووية لم تعد ترفا لأن البترول يستهللك بمعدلات خرافية وسيزول فريبا ويستبدل بالهدروجين في الغالب وتجري أبحاث بكثافة في أوروبا وأسيا منذ زمن قصير تعول علي الأنابيب الكربونية النانوية(بالغة الضيق)شديدة التحمل والتي يمكن لها أن تكثف كميات هائلة من الهدروجين في حجم مناسب لوسائل النقل ولكن طبعا لن تطبق نتائج هذه الأبحاث قبل استنفاذ بترول العالم المتخلف وتحصيل أكبر عائد من الاستثمار في البترول الرخيص وبعدها لن يظلم الغرب كما يتصور البعض البديل عندهم ما يكفي من المحطات النووية ثم تقنيات حمل الهدروجين الشالفة الذكر وأما التحجج بأن لدي أيران مشكلات مع سكانها من العرب والكرد أو أن لها أطماع سيطرة فالعرب لم يجربو اي شكل من اشكال التواصل والتفاهم مع ايران من قبل ومن الممكن التوصل لتسويات سلمية للأرث العدائي بين العرب وبينها,كما أن كون النظام السياسي الأيراني قمعي أو متشدد ففي النهاية بناء قوة أيرانية مصلحة وطنية للأيرانيين في ظل حكم الفقيه أو بدونه يعني في النهاية أنجاز حضاري للبلد بصرف النظر عن نظامه<br />ووجود ثقل تقني في المنطقة لأيران أو غيرها يتحول مع الوقت ألي مصدر تقني للجيران العرب مسألة مهمة للجميع فهي تقريب ولو جغرافي للتكنولوجيا التي ضيعناها من زمن وعدم وجود تناقض رئيسي يمس وجودنا مع ايران سوف يسهل أنتقال عادل للتقنية بعيدا عن شروط الغرب المعجزة وربما تخلق في النهاية منظومة تقانية خاصة بكتلة العالم الثالث تتعزز وتنمو في أحضانه متخففة من القيد الأوروبي الذي يفرض أعطائنا تقنيات بالغة التعقيد مستحيل التعامل معها بعيدا عن وصايته ومتابعته وبالتالي ربط كل ما ننتجه بمستويات ومعايير تناسبه أكثر مما تناسبنا وطموحاتنا لينتهي الأمر بالتعثر في التصدير والعجز التجاري المزمن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125609/http://www.20at.com/article2.php?sid=453"

