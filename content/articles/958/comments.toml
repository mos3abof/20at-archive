posted = "2006-02-17"
text = "على فكرة يا جماعة احنا بنتكلم عن بلاد من غير ما نقرا ونعرف عنها كويس.. احمدى نجاد ده اسمه فى ايران من معظم الناس مرشد مرشد الثورة ..يعنى المخبر بالبلدى .. ايران مش حتعمل سلاح نووى . والراجل ده كل مهمته انه يضرب حركة الاصلاح الشبابية المتنورة قى بلاده ..على فكرة احاسيس الشباب الأيرانى اتجاه نظام الحكم فى بلاده متفرقش كتير عن احاسيس الغم اللى عندنا."
archived = "2006-11-02"
