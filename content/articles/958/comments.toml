subject = "ياريت امسك الحكم"
author = "محمد"
posted = "2006-02-22"
text = "بصراحة ياجماعةانا مع كلام الاخ عقلانى مفيش حاجة اكتر هوة من اللى قالة انى نظام الحكم عندنا فاشل ولابد من تصلحية ونبطل الجبن اللى عندنا دة وى اول بلد مسلمة وقفت فو وش امريا وفعلا لو فكرت امريكا تخطى خطوة فى ضرب ايران اسرئيل هتولع بما فية القواعد الامريكية فى الخليج والخاين القذافى فين ياولد قذافى الاسلحة اللى عندك النووية عندك اهة ياباشا شكرا قذافى العفو ياباشا انت تأمر بقى دة ونبقى رئيس دول قربت على تمتلك قنبلة نووية وياريت كان يبقى السادات عايش كان رحمنا من اللى احنا فى دة كان وقفلهوم اللة يرحمك ياسادات انت اللى حربت وحررتنا ومش بعيد ممكن اسرئيل تدخل بكرة مصر ولو عايزة تخش هتدخل بمساعدة الامريكان الخونة وصح زاى ماقال الاخ الى الامام يااايران الى الامام يوضع سرة فى اضعف خلقة وممكن الرد على كلمى وشكرا"
archived = "2006-11-02"
