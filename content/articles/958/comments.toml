posted = "2006-08-08"
text = "سؤال من يضمن ان هذا النووى لن يشتخدم يوم من الأيام ضد العرب؟ اليهود والغرب لاتفرق بيننا كلنا مسلمين أما أيران فتقول نحن شيعه وأنتم سنه ولاتبالى بالقضاء علينامن خلال تاريخ الطائفه الدموى فى الثورات على الخلافات على مر العصور منهاعلى سبيل المثال لا الحصر القرمطى ومافعله بحجاج مكه من قتلهم ورميهم فى زمزم ومنع الناس الحج عشر سنين وسرقه الحجر الأسود.وشكرا"
