author = "zahramoslama"
posted = "2009-12-30"
text = "لا تقولي: \"أنا سعيدة لأنكما انفصلتما، فأنا لم أحببه يوما\".<br />لماذا: ستتعجب من محبتك الوهمية التي كنت تظهرينها له عندما كانت علي علاقة به.<br />البديل: \"أنا متأكدة انك ستجدين الشخص المناسب الذي سيمنحك ما تحتاجينه\"، فهذه العبارة تركز علي المستقبل ولا تجعلها تفكر بالعلاقة السابقة.<br />أنا شخصيا حصل الموقف دا معايا بعد الانفصال وبعدها فقدت الثقة فر أراء الأشخاص دول نهائيا"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131032238/http://www.20at.com:80/banat/self-development/14603-2009-12-27-12-35-48.html"

