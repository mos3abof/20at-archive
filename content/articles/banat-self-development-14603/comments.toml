order = 12
subject = ""
author = "نون"
posted = "2010-01-01"
text = "لا تقولي: \"كيف لشخص مثلك أن يظل غير مرتبط حتى الآن\".<br />لماذا: تعبير مثل ذلك يعتبر سيء جدا وبعيد عن اللياقة والذوق، كأنك تقولين \"ما العيب بك\".<br />البديل: \"هل ترين أو تعرفين أحد\"، إذا التزمت الصمت عن علاقتها العاطفية فانتقلي إلي موضوع أخر.<br />يعني مقولش لبنت ازاي واحدة زي الفل زيك مترتبطش لغاية دلوقت ؟ وأقولها أخبارك ايه دلوقت فيه حد كده ولا كده ..أو ماشية مع حد !!<br />ايه الغباء ده ..لأ طبعا السؤالين مينفعوش أصلا ..و العلاقات العاطفية السؤال عنها أكبر غباء .لو فيه ارتباط أكيد هتعلنه ولو مش عايزة تعلنه دي حرية شخصية ..الناس بتحشر نفسها ليه بس"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131032238/http://www.20at.com:80/banat/self-development/14603-2009-12-27-12-35-48.html"

