subject = "مبروك التجديدات ودايما يارب"
author = "مارك"
posted = "2006-08-03"
text = "اولا :مبروك التجديدات وانشاء الله دايما .<br />ثانيا : نخش فى الموضوع<br />1- الصورة اللى انتم حطينها دى ماتبشرش بخير ابداالراجل والست ياحول الله محتاجين الى مجمع بحوث طبيه كامل وعلى رأسه مجموعه من الأستشاريين النفسيين والأخصائيين الأجتماعيين مع طلب عاجل لشكوكو واسماعيل ياسين لمحاولة اخراجهم من الأكتئاب والمعاناه الصعبه الباديه على وجوههم دا غير الأنهاك والحيره<br />2-حتي البنت الصغيره رمز الأشراق والمستقبل بص تانيه رجلهاوكان لم يعد لها مكان على الأرض .<br />ياريت تغيروا الصوره دى ...اما اذا كنتم مصممين عليها يبقى تغيروا العنوان( من كل عام والأسره العربيه بخير ) الى ........شوفوا انتم بقى عايزين تقولوا ايه........................<br />مارك"
