[[comments]]
order = 2
subject = "اليكم عني!!"
author = "شهاب"
posted = "2006-05-20"
text = "هَبَّت تَلومُ وَلَيسَتْ ساعَةَ اللاحي *** هَلّا انتَظَرتِ بِهَذا اللَومُ إِصباحي<br />قاتَلَها اللَهُ تَلحاني وَقَد عَلِمَت *** أَنَّ لِنَفسِيَ إِفسادي وَإِصلاحي<br />كانَ الشَبابُ يُلَهّينا وَيُعجِبُنا *** فَما وَهَبنا وَلا بِعنا بِأَرباحِ<br />إِن أَشرَبِ الخَمرَ أَو أُرزَأَ لَها ثَمَنًا *** فَلا مَحالَةَ يَومًا أَنَّني صاحي<br />وَلا مَحالَةَ مِن قَبرٍ بِمَحنِيَةٍ *** وَكَفَنٍ كَسَراةِ الثَورِ وَضّاحِ<br />يا مَن لِبَرقٍ أَبيتُ اللَيلَ أَرقُبُهُ<br />*** مِن عارِضٍ كَبَياضِ الصُبحِ لَمّاحِ<br />قد بنت عني وبات البرق يسهرني *** كما إستضاء يهودي بمصباح<br />دانٍ مُسِفٍّ فُوَيقَ الأَرضِ هَيدَبُهُ *** يَكادُ يَدفَعُهُ مَن قامَ بِالراحِ<br />يَنزَعُ جِلدَ الحَصى أَجَشُّ مُبتَرِكٌ *** كَأَنَّهُ فاحِصٌ أَو لاعِبٌ داحِ<br />كَأَنَّ ريقته لَمّا عَلا شَطِبًا *** أَقرابُ أَبلَقَ يَنفي الخَيلَ رَمّاحِ<br />فَالتَجَّ أَعلاهُ ثُمَّ ارتَجَّ أَسفَلُهُ *** وَضاقَ ذَرعًا بِحَملِ الماءِ مُنصاحِ<br />كَأَنَّما بَينَ أَعلاهُ وَأَسفَلِهِ *** رَيطٌ مُنَشَّرَةٌ أَو ضَوءُ مِصباحِ<br />كَأَنَّ فيهِ عِشارًا جِلَّةً شُرُفًا *** شُعثًا لَهاميمَ قَد هَمَّت بِإِرشاحِ<br />بُحًّا حَناجِرُها هُدلًا مَشافِرُها *** تُسيمُ أَولادَها في قَرقَرٍ ضاحِ<br />هَبَّت جَنوبٌ بِأولاهُ وَمالَ بِهِ *** أَعجازُ مُزنٍ يَسُحُّ الماءَ دَلّاحِ<br />فَمَن بِنَجوَتِهِ كَمَن بِمَحفِلِهِ *** وَالمُستَكِنُّ كَمَن يَمشي بِقِرواحِ<br />فَأَصبَحَ الرَوضُ وَالقيعانُ مُمرِعَةً *** مِن بَينِ مُرتَفِقٍ فيهِ وَمِن طاحِ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134236/http://www.20at.com/article2.php?sid=819"

[[comments]]
order = 3
subject = "نعما وكرامة!"
author = "نجم الدين"
posted = "2006-05-20"
text = "يا صاحِ مَهلًا أَقِلَّ العَذلَ يا صاحِ *** وَلا تَكونَنَّ لي بِاللائِمِ اللاحي<br />حَلَفتُ بِاللهِ إِنَّ اللهَ ذو نِعَمٍ *** لِمَن يَشاءُ وَذو عَفوٍ وَتَصفاحِ<br />ما الطَرفُ مِنّي إِلى ما لَستُ أَملِكُهُ *** مِمّا بَدا لي بِباغي اللَحظِ طَمّاحِ<br />وَلا أُجالِسُ صُبّاحًا أُحادِثُهُ *** حَديثَ لَغوٍ فَما جِدّي بِصُبّاحِ<br />إِذا اتَّكَوا فَأَدارَتها أَكُفُّهُمُ *** صِرفًا تُدارُ بِأَكواسٍ وَأَقداحِ<br />إِنّي لَأَخشى الجَهولَ الشَكسَ شيمَتُهُ *** وَأَتَّقي ذا التُقى وَالحِلمِ بِالراحِ<br />وَلا يُفارِقُني ما عِشتُ ذو حَقَبٍ *** نَهدُ القَذالِ جَوادٌ غَيرُ مِلواحِ<br />أَو مُهرَةٌ مِن عِتاقِ الخَيلِ سابِحَةٌ *** كَأَنَّها سَحقُ بُردٍ بَينَ أَرماحِ<br />وَمَهمَهٍ مُقفِرِ الأَعلامِ مُنجَرِدٍ *** نائي المَناهِلِ جَدبِ القاعِ مُنْساحِ<br />أَجَزتُهُ بِعَلَنداةٍ مُذَكَّرَةٍ *** كَالعَيرِ مَوّارَةِ الضَبعَينِ مِمراحِ<br />وَقَد تَبَطَّنتُ مِثلَ الرِئمِ آنِسَةً *** رُؤدَ الشَبابِ كَعابًا ذاتَ أَوضاحِ<br />تُدفي الضَجيعَ إِذا يَشتو وَتُخصِرُهُ *** في الصَيفِ حينَ يَطيبُ البَردُ لِلصاحي<br />تَخالُ ريقَ ثَناياها إِذا ابتَسَمَتْ *** كَمِزجِ شُهدٍ بِأُترُجٍّ وَتُفّاحِ<br />كَأَنَّ سُنَّتَها في كُلِّ داجِيَةٍ *** حينَ الظَلامُ بَهيمٌ ضَوءُ مِصباحِ<br />إِنّي وَجَدِّكَ لَو أَصلَحتُ ما بِيَدي *** لَم يَحمَدِ الناسُ بَعدَ المَوتِ إِصلاحي<br />أَشري التِلادَ بِحَمدِ الجارِ أَبذُلُهُ *** حَتّى أَصيرَ رَميمًا تَحتَ أَلواحِ<br />بَعدَ انتقالٍ إِذا وُسِّدتُ حَثحَثَةً *** في قَعرِ مُظلِمَةِ الأَرجاءِ مِكلاحِ<br />أَو صِرتُ ذا بومَةٍ في رَأسِ رابِيَةٍ *** أَو في قَرارٍ مِنَ الأَرضينَ قِرواحِ<br />كَم مِن فَتىً مِثلِ غُصنِ البانِ في كَرَمٍ *** مَحضِ الضَريبَةِ صَلتِ الخَدِّ وَضّاحِ<br />فارَقتُهُ غَيرَ قالٍ لي وَلَستُ لَهُ *** بِالقالِ أَصبَحَ في مَلحودَةٍ ناحِ<br />هَل نَحنُ إِلّا كَأَجسادٍ تَمُرُّ بِها *** تَحتَ التُرابِ وَأَرواحٍ كَأَرواحِ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134236/http://www.20at.com/article2.php?sid=819"

