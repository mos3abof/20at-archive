text = "يرب تكون كل دول العربية بخير بسى يجماعة يرت كل اسرة تحول تربى اولدها على حب وصقة بالنفسى وتدين مهما كانت دينتهم ويحول زرع حب وخير وحب اللة فى اولدهم يرب يسعد كل ناس اهم حاجة فى دنيا دحكة حلوة عشان انسان يعيش وزكر ربنة فى كل شى قبل عمل اى شى فى حياة اخوكم من مصر"
