[[comments]]
order = 1
subject = "يا عم دول مش بيحسو"
author = "كوكو الضعيف بس اقوى من الزمالك"
posted = "2006-12-22"
text = "يا عم سيبك بص<br />مجمد عبد المنصف بيتفرج على الكورة زى المشاهدين اللة يكون فى عونو هو بصراحة متجوز واحدة كويس انو لسة فى حيل يقف على رجلو<br />تامر عبد الوهاب اعتقد ممدوح فرج منتظرك فى حلقات المصارعة للغباء فقط بيضرب فى اى مكان ومن غير سبب<br />القبانى : دة مش موجود دة نايم بركبو دى دا عايز حقنة لحمة وبطىء جداا<br />ابو العلا : احسن واحد يضيع الكورة معرف بطىء نيك<br />علاء عبد الغنى صاحب اسواء تمريرة فى العالم يعمل احسن مجهود عشان يجيب الكورة ولما يجيبها بيمررها ليهم تانى ؟<br />طارق السيد فراغ مش موجود هههه روح الاهلى والنبى<br />يوسف حمدى انت المفروض تخس كتيررر عشان تعرف تلعب وشد حيلك وضيع اجوان فى التمرين<br />حازم امام اول مرة اشوف واحد بيتعب وهو على الدكة احتياطى وبعدين هو بس اللى بيفهم والناس كلها حمير اللى عندو بس ان الناس هما اللى غلط وهو اصلا مش عارف يمشى فى الملعب مش يجرى انت متنفعش تكون كابتن فرقة اتفرج على العميد حسام حسن<br />عبد الخليم عالى احسن واحد يضرب الكورة بالشلوط كفايا حرام<br />مصطفى جعفر حاول تلعب عشلن انت لسة كويس<br />جونيور خس يا عجل انت بتاكل اية الزمالك بيجيب العيبة ياكلهم ولااية<br />احمد حسام : روح والنبى<br />محمود محمود ههههههه انت جسم من غيرعقل جسم على الفاضى ابويا بيلعب احسن منك اى ماتش بتنزل فية القهوة كلها بتضحك عليك العيب اللى انت ماسكو بيكون نجم وانت انذرات على طرد ههه<br />فى النهاية شهادة تقدير للنجم عمرو ذكى وعمرو الصفتى بس من غيرانذارات والنبى وتامر عبد الحميد وعلا ء عبد الغنى : جمال حمزة ياريت تعمل تدريبات تقوبة وملكش دعوة باى مشكلة ركز فى اللعب مدى عطوة سيبك من النسوان والمخدرات وهتكون نجم ( بالنسبة ل<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102807/http://masr.20at.com:80/article.php?sid=1341"

[[comments]]
order = 2
subject = "كفانا غفلة"
author = "وائل جلال الدين"
posted = "2006-12-22"
text = "كفانا غفلة زمالك - أهلي - دوري - كاس - بطولة أفريقية - عربية - كاس عالم كلها لهو وعبث فماذا يستفيد المواطن المصري من هذا العبث؟ فلا هو مارس الرياضة ولا انتفع بالأموال الطائلة التي تدفع في هذه اللعبة عديمة الفائدة كثيرة الإصابات سواء للاعبين أو المتفرجين أو من يدير الفريق وكأنها جاهلية جديدة لتفريق الشعب إلى أهلاويين وزملكاويين إلى آخر هذه التفاهات. أما كان من الأجدر توفير هذه الأموال للجوعى والفقراء في مصر على كثرتهم؟ أو قضاء وقت المتفرجين في شيء آخر مفيد للأمة؟ أما والله إنها لغفلة آمل أن تنتهي بإلغاء اتحاد هذه اللعبة عديمة الفائدة."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102807/http://masr.20at.com:80/article.php?sid=1341"

[[comments]]
order = 3
subject = "شعب لا يلعب اى رياضة"
author = "لااحد يلعب رياضة فى مصر ولا حتى الاولاد الشعب وكل الاهلى والزمالك ليلعبوا رياضة"
posted = "2006-12-22"
text = "نيابة عن الشعب المصرى والاهل يطلبون من الاولاد ان يحفظوا الكتب ويجيبوا 99% ولا يمارسون اى رياضة<br />كلام مش صح<br />ودى بوادر شعب عندة اكتئاب<br />او مقدمة للاكتئاب<br />ياناس لازم انتم شخصيا لازم تلعبوا رياضة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102807/http://masr.20at.com:80/article.php?sid=1341"

[[comments]]
order = 4
subject = "اللعب مع المرضي افضل"
author = "مشفق علي الشعب"
posted = "2006-12-22"
text = "هل زار أحد اي مستشفي علي مستوي الجمهوري هل وجد مرضي تحتاج الي عميلة مجانية هل تبرع أحد بأجر ولو نصف عملية هل رجل اعمال تبرع بعربيه الي لاعب كرة مسح دمعة مريض بفشل او باي شيئ اخرهل شاهدت لاعب كرة اياكان زمهلاوي اوغيرة يزور مستشفي ولكن اين تذهب الملايين ياعم الي شارع من شوارع القاهر المشهورةعافانا منها الله حرااااااااامارحموا من في الارض يرحمكم من في السماء زمالك ايه وأهلي اليه كل واحد له ني يصلي عليه يرحمناويرحمكم الله"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102807/http://masr.20at.com:80/article.php?sid=1341"

[[comments]]
order = 5
subject = "كورة إيه بس .. هي ناقصه ؟؟؟؟؟؟؟"
author = "إبن بهيه"
posted = "2006-12-22"
text = "فيه إيه يا عشرينات ؟؟؟<br />ما تفضوها سيره بقى من أهلي وزمالك وبلا أزرق .. الناس مش لاقيه تاكل وتقولي زمالك وبطيخ ؟؟؟<br />يا عم بلا كوره بلا نيله .. الكوره بره يعني فلوس وعندنا تيوس ومسخره وضحك على الدقون عشان نشغل شريحه كبيره من الشباب ويتلهوا على عينهم ولا يعرفوش راسهم من رجليهم<br />أنا بصراحه ضد الكوره وأخبار الكوره والعك الفارغ ده حتى إشعار آخر تكون البلد قد تحررت من الطاغية الواطي مبارك وعصاباته وأظن كثير من الناس هنا معايا<br />دي أول مره أعلق على موضوع كورة وهيافه زي كده عشان بس أقولكم كده ,, ويا ريت تعملوا استطلاع رأي ونشوف النتيجه .. نذيع خبار كوره ولا لأ ؟؟؟ لو وجدتم 20% عايزين كوره ابقوا حطولهم كل ثلاثة أشهر موضوع على قد نسبتهم في التصويت<br />تحياتي<br />إبن بهيه<br />http://ibnbahya.blogspot.com<br />إبن بهيه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102807/http://masr.20at.com:80/article.php?sid=1341"

