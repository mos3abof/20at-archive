text = "زى ما موتوا حاجات كتير فى مصر<br />قضوا على زراعة القطن<br />وقضوا على الصناعة فى مصر<br />وقضوا على زراعة القمح وجارى تمويت زراعة الارز<br />وقضوا على الانتماء للبلد<br />يبقى لازم يقضوا على صناعة الفيلم المصرى"
