author = "هو اقول"
posted = "2009-03-05"
text = "مع احترامى الشديد للاستاذ ارار فى حبه الى مالناش دخل بيه بس اعتقد ان لو سندود دى بتفهم هاتسيبه بعد المصيبه الى عملها وانه جرسها كدة.<br />دا بالنسبه للانسه سندود اما بقىب النسبه للازاز ارار<br />اعتقد انه لو استعملناه كسلاح سرى ضد اسرائيل بمعنى يعمل اغانى موجهه لاسرائيل ممكن تتحل المشكله لانهم اكيد اكيد هايفسطو على روحهم من الضحك وفى الحاله ده نقدر ننتصر عليهم ويبقى الازاز ارار غلب شعبولا<br />تصدقو بالله انا قرفان<br />صحيح انا مغترب من 8 سنين دلوقتى بس لما سبت مصر كان لسه فيها رجاله الحقيقه بس ان الوضع يوصل لكدة<br />اتنيلو على خيبتكو احسن<br />اتفو"
archived = "2009-08-19"
capture_url = "https://web.archive.org/web/20090819140953/http://www.20at.com:80/masr/t7kyk/11492.html"

