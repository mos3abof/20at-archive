[[comments]]
order = 12
subject = ""
author = "واحد منفوووووووخ"
posted = "2009-12-07"
text = "بجد أنا مش عارف أقول إيه … بطلت الشتايم القبيحة من زمااااااااااااا ن … بس الواضح إني كنت غلطان … لأني محتاجها جداً جداً دلوقتي… وحتى لو شتمت … مفتكرش في شتيمة في الدنيا تناسب الحيوان ده…<br />أنا منفوخ لدرجة رهيبة … وسقط في سلسلة من الضحك الهيستيري لما افتركت السؤال بتاع سيد أبو حفيظة اللي بيقول فيه<br />على ما يتغذى مخلوق السندود ؟؟<br />1. على السندودتشات<br />2. الفئران البرية<br />3. مخلفات حيوان القرقر … ودي بصراحة شكلها الإجابة الصحيحة اللي موتتني من الضحك<br />وبجد الكائن الغريب ده لازم يتشاف له حل<br />يا إما مستشفى الأمراض العقلية … بس كده نبقى بنئذي البني آدميين اللي هناك<br />يا إما جنينة الحيوانات … وكده نبقى برضو بنئذي الحيوانات …<br />مش عارف بصراحة … بس لازم نبعده عن الأطفال ومرضى السكر وكبار السن … الموضوع خطير يا جماعة<br />دا الفرجة عليه بتجيب كل أنواع القرف اللي ممكن يتطور إلى شلل نصفي أو رباعي"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107114145/http://www.20at.com:80/masr/hot-topics/11492.html"
