text = "انا حاليا بعمل في مجال الاعمال الالكترونية ..<br />والمجال ده مش محتاج اكتر من كمبيوتر وخط انترنت<br />يعني ممكن يتعمل من البيت<br />بس علي فكرة النماذج اللي جبتوها دي ناش بتشتغل عند اخرين ..<br />لكن لو اشتغل حر ممكن يكسب كتير مالا يقل عن 5000 جنية شهريا<br />واسال عن الناس اللي عالة شغل علي الانترنت<br />طبعا الشغل من البيت ممل فعلا وبيقتل الروح الاجتماعية ..الواحد بيشتغل في البيت وفي التكييف ولا مواصلات ولا قرف<br />و الانسان ممكن يكيف نفسه علي كدة<br />انا عملت لي مكتب منفصل في البيت زي المحامين<br />والعصر بروح الجيم وبالليل اقابل اصحابي"
