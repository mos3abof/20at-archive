subject = "حمام الهنا"
author = "معجبببببببب"
posted = "2006-06-01"
text = "السلام عليكم ورحمة الله<br />بصراحة أنا رايت تقارير كثيرة ، لكن التقرير ده لفت انتباهي مش عارفة ازاي، اصل في شيء حلو، التراث ، المعلومات، سلاسة الافكار...<br />كمان وكمان ياعشرينات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131827/http://www.20at.com/article2.php?sid=884"

[[comments]]
order = 1
subject = "روعة"
author = "رائع"
posted = "2006-06-03"
text = "السلام عليكم ورحمة الله وبركاته<br />ياه انا بالفعل بحاجة لمزيد الاستحمام في الحمامات ديت، اصلي بحبها قوييييييييييي، والموضوع ده جميل، ربنا يكرمكم يا عشريناتية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131827/http://www.20at.com/article2.php?sid=884"
