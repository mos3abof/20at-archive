text = "طبعا الواحد لازم يفخر بالنوعية دي من الشباب اللي مش بتستسلم ولا بتمل علشان توصل للي في دماغها بعيدا عن الوظيفة الميري اللي أصبحت من الأحلام أو حتي القعدة علي القهاوي<br />لازم الواحد لما يكون ليه رسالة بيؤمن بيها يحارب علشانها لحد ما يحققها أو حتي علي الأقل ياخد شرف المحاولة<br />و نتمني انها تكون محاولة جادة لإكتشاف فن هادف بعيد عن القرف اللي مالي الوسط الفني الفترة ديه"
