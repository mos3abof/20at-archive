subject = "جميل"
author = "الزيني بركات"
posted = "2006-07-26"
text = "الموضوع الجميل و الأسلوب جميل<br />بس بيتهيأ لى ان جايز يكون فيه سخرية شوية فى المقال من الفتوى و لا جايز انا بيتهيألى<br />و يا ريت كانت مع المقال اصوات لعدد من فيلات فيها الاذان باصوات مختلفة كانت حتضيف للموضوع كتير قوى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123930/http://www.20at.com/article2.php?sid=1098"

[[comments]]
order = 1
subject = "مجرد رأي"
author = "انا جنبي جامع بس اجارك الله من صوت المؤذن اللي فيه...بشششششششششع"
posted = "2006-07-26"
text = "صوته سيء جدا و لازم يحشرج و يحاش صوته في وسط الاذا<br />ويأوح و يكمل برضه ..تحس انه بيتخانق معانا ..الله يسامحه بقى ..لكن و الله كنت معدي من جنب مسجد تاني سمعت صوت الراجل اللي فيه ..الله على صوته ..و الله شجعني على الصلاة في المسجد<br />طبعا مش المقصود ان الصوت هوه اللي بيخليك تروح المشجد ولا لأ..بس على الاقل الصوت السيء بيسيب اثر وحش في نفسك ..و بيضايقك و ينفرك جدا منه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123930/http://www.20at.com/article2.php?sid=1098"

[[comments]]
order = 2
subject = "رمادي , وعلكيم السلام"
author = "هوووووووبه"
posted = "2006-07-26"
text = "بصي يادودو انا افتكرت ان انتو شيلتو قلم رصاص والحاجات دي محدش يزعل يا جدعان لو خبطت في الحلل<br />شوفي يا حاجه انا امنيه حياتي اني اسمع اذان<br />والله العظيم بقالي 3 سنين مسمعتش ادان<br />ومتزعليش يادودو قلمك طول عمره رصاص<br />وعمره ما حيتقصف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123930/http://www.20at.com/article2.php?sid=1098"

