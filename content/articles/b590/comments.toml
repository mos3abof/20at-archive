[[comments]]
order = 5
subject = "السكند هاند"
author = "أحمد المصري"
posted = "2006-06-16"
text = "السكند هاند في مصر أحلي من الأصل<br />مصر بتاخد اللوت الرابع من الفرز الرابع علي مستوي العالم في أي شيء سواء ملابس واجهزة وسيارات واي معدات فمن الملاحظ انك لو اشتريت كمبيوتر وارد الخارج ومستعمل وبينتيوم 3 احسن من الفور الجديد واي اجهزة منزلية نفس النظام وبالتالي الملابس الجديدة كلها مصرية ومضروب عليها ماركة عالمية لكن المستعمل او السكند هاند الاصلي 100 في 100 ومجرب وروح بنفسك ومش هتندم ولا تقولي جديد ولا دياوله خد من جيبك وناوله وهات القديم هيعيش القديم بتاعهم زيه مفيش ، إحنا القديم بتاعنا بنشحته بعد مايكون طلع غيمانه ومبقاش ينفع لأي حاجة لكن هناك الملابس لكل حاجة اللبس الخاص بيها يعني المشي او الجري يعني الرياضة عموما لبس معين والتنس لبس معين والكورة لبس معين والخروج لبس معين والنوم بالملابس الداخلية فقط يعني الملابس مبتتبهدلش لكن احنا كمصريين او عرب عموما اللي بناكل بيه بنخرج بيه بنلعب بيه وساعات بنام بيه يعني بنطلع عين امه من الأخر سلاااااااااااااام ,اسف علي الأزعاااج"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112648/http://www.20at.com/article2.php?sid=590"

