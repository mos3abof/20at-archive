subject = "الغربه صعبه"
author = "مهندس ديكور"
posted = "2006-03-08"
text = "السلام عليكم كم هذا الموضيع جميل وشيق لان المصريين فى الغربة الحاجات دى ولو انها بسيطه بتفرق معاهم قوى وتحسسهم انهم فى بلدهم وياريت يكون فيه منفوحه فى جده وغيرها من الاماكن فى المملكه لكل المصريين وعلى فكرة انا اخى يعمل فى جده ويسكن فى شقه ايجارها غالى يصل الى 18000 ريال فى السنه فى منطقه اسمها الفيصلية هل هذه المنطقة غالية الايجار فعلا وهل توج مناطق اسعار الايجار فيها اقل افيدونى لو سمحتم وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102104948/http://www.20at.com/article2.php?sid=546"

