subject = "لماذا العجب"
author = "وحيد الرياض"
posted = "2006-04-23"
text = "لماذا كل هذا العجب ولاستغراب فمنفوحه ليست مستعمره مصريه بل السعوديه هي البلد الثاني لاخواننا العرب من اي مكان هي وطن الجميع بكرم اهلها وسماحتهم حسن تعاملهم مع كل اخوانهم العرب والمسلمين فوالله اني لاتمنى اليوم اللي تكون فيه العرب دوله واحده مترابطه بلا حدود ولا جمارك دوله واحده لها هيبتها وقوتهاومكانتهايسودها الامن والتكاتف والتعاون باسم الدين الاسلامي والعروبه الصادقه ملينا من التفرقه والشتات والله يحقق لنا الوحده والنصر على الاعداء:امين"
