[[comments]]
order = 8
subject = "غريب انا"
author = "هبهبوب"
posted = "2006-03-09"
text = "حفقعواغريبٌ أنا ! أم زماني غريبُ؟!<br />وحيّرَ فكري السؤالُ العجيبُ!<br />غريبٌ ! وكيفَ وكلُّ شعـاعٍ<br />سرى في السماء لعيني قريبُ؟!<br />غريبٌ! وكيف وكلّ جمـالٍ<br />بهذا الوجـودِ لقلبي حبيبُ؟!<br />وكيف أكون غريباً وحولي<br />حبورٌ ونورٌ ولحنٌ وطيـبُ؟!<br />وعندي رجاءٌ ..وفوقي سماءٌ<br />تظلُّ، وشعرٌ ،وفكرٌ خصيب؟!<br />وكيف أكون غريباً وشمسي<br />أقامت بطول المدى لا تغيبُ؟!<br />وكلُّ البرايا معي ساجـداتٌ<br />لِـربّي نُلبـّي ...له نستجيبُ<br />فذرّاتُ هـذا الوجـودِ تلبّي<br />وأسمعُـها لو تَشِـفُّ الغيوبُ!<br />تسبّحُ سـرّاً بغير ذنـوبٍ!<br />أسبِّح جهراً وكُلّي ذنـوبُ!!<br />غريبٌ أنا! أم زماني غريبُ؟!<br />يحيّرني ذا السـؤالُ العجيـبُ!<br />غريبٌ! وكيف وهذي سبيلي<br />وغيري هوى،ضيَّعَتْهُ الدروبُ؟!<br />وكيف ودربي ابتداهُ الرسولُ<br />يقود القلوبَ،فتحيا القلوبُ؟!<br />أنا إنْ سجدتُ أناجـي إلهي<br />فؤادي يطيبُ ، وروحي تذوبُ<br />أعيش بظلِّ النجـاوى سعيداً<br />فأدعو ،وأدعو ،وربّي يُجيـبُ<br />وربي قريبٌ، قريبٌ، قريبُ<br />فكيف يُقـال: بأني غريـبُ؟!<br />واحده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102104948/http://www.20at.com/article2.php?sid=546"

