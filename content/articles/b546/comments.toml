author = "أمالي سودة"
posted = "2006-09-13"
text = "السلام عليكم<br />تعليقي علي كلام الاخوة المتعصبين يعني ايه مصري ويعني ايه السعودية كانت تحت حكم مصر ويعني ايه امريكا اقصد السعوديه يااخواننا عيب احب اذكركم ان الكلام ده يدل علي جهل قائله وانا لا اجرح في شخص بعينه ولكن انا اصف الواقع فعلا موضوعك يستحق الاهتمام المصري في السعوديه هو المصري في السعوديه الكفيل مش هو خادم الحرمين ولا العامل المصري هو حسني مبارك وكامن الاخ اللي بيقول فضجتونا يااخي شوف اكل الناس في تايلاند بياكلو خنافس وصراصير وفي كوريا بياكلو الكلاب وفرنسا الضفادع ليه عقده الدونيه دي انت لازم تكون فخور بالملوخيه بالارانب والفلافل والمسقعه احنا كمان بناكل الاكل السعودي او الخليجي بصفه عامه ايه المشكله يااخي كلنا مسلمون وغير المسلم عربي ايضا مثلنا وشكرا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102104948/http://www.20at.com/article2.php?sid=546"

