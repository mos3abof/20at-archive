text = "الغربه شعور دائم و لا الواحد مسيره هيتعود و الغربة ان الواحد يعيش بعيد عن اهله و لا الواحد يعيش في بلد مش بلده و هل ممكن الواحد يحس بغربه و هو عايش في وسط اهله و في وسط البلد ( او في المؤسسه مش مهم )<br />اما عن هبهوب فاقولك شدي حيلك الطعمية غاليه عندكوا قوي<br />كان عندي واحد صحبي بيدرس في فرنسا و كان بيشتغل في مطعم كان بيبيع قرص الطعمية ب 50 فرنك و النكته كان بيجيلوا ناس يقولوا no oil"
