posted = "2006-03-11"
text = "انا بقا اللي مشغوله الكام يوم اللي جاين لاسف الشديد<br />الي ما شفت سويت ولا الايميل وحتي لو شفته الجهاز خربان مبشفش العربي يا جدعااااان الله يسمحه بقي , دا حتي \" عبد العززززززيز\" مسمعتش تعليقه علي المذكرات اللي عفنت .<br />ونفين \" اللي لسه ما عملتش الايميل بس احب اقولك حاجه هو وصلني بس كان \" طلاسم \"<br />القصيده مش عارفه مصدرها بالزبط بس انا كنت حافظها عندي من مده .<br />وانت اكتررررررررر يا جميل \"وحشني\""
