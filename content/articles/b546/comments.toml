subject = "هممم"
author = "حلم"
posted = "2006-04-24"
text = "انا كمان عشت فترة في الرياض في حي الورود لو تعرفوه/ سمعت عن المنفوحة بس مزرتهاش.. رحت مكان اسمه \"البطحا\" بردو فيه مصريين<br />وعموما هناك في حدائق عامة تعال يوم خميس وجمعة كدة وانت تلاقي جمهورية مصر العربية كلها مشرفة<br />بالاختصار صح ان في تجمع مصريين في منفوحة بس مش كل المصريين يقدرو يعيشو هناك<br />لكن على كل حال المصريين الي في الرياض أحسن حالا من المصريين الي في أي مدينة تانية في المملكة<br />هناك يمكن عشان العاصمة فامهتمين بيهم كتير جدا حتى السفارة بتعمللهم انشطة وحجات يتحسدوا عليها بصراحة<br />ربنا يرجع كل مصري \"عايز يرجع\" لبلده<br />وأنا أولهم يااااااااارب أرجع يارب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102104948/http://www.20at.com/article2.php?sid=546"

