text = "انا محمد من مصر ممكن يا عم الحاح تعمل فيا صواب وترسل ليا عقد عمل فى امريكا لالا فى السعوديه انا غلطت ممكن انتا ما انتا عارف ان السعوديه ديت فى الاصل كانت ملك المصرين ولا اقولك ذاكر تاريخ كويس وانتا تعرف يلا ومتنساش ترسل ليا العقد وياريت يكون فى نيويورك لا لا قصدى فى الرياض وكفايه عليك لحد كدا الراسل محمد من مصر"
