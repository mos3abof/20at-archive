posted = "2006-03-08"
text = "اتخطفت بدري بدري يا غاليه . معلش يا بطه نعمل ايه بقي<br />هي كدا بلاد الافرنجه ولا مش افرنجه حتي .<br />يلا الكلام دا حقيفه وكل حته تلاقي فيها مصرين تلاقي شيشه وفلافل.<br />والغربه جاتله يا بوي والسلام لابن عم اكرم اللي مسافر يا حبت قلبي من يومين نصيحه سمعه اسماعيل البلبيسي وهش الدبان من علي \" وشه \""
