text = "ليس عيباان تأكل من خيرات الله ماتريد بعرقك وتعبك لكن العيب ان تسرق اوتنهب اوتخطف جوال.... ثم ان في المنفوحه اللي مش عجباكم مهندسين ومحاسبين وفنيين على مستوى عالي ثم تعالى لنرى المنفوحه رغم كثافة المصريين السكان بهاإلا أن اقل مشاكل من مناطق كثيرة ولاحظ ان معظم المشاكل بالمنفوحه ليست بسبب المصريين وأخير العيب ليس في الفول والطعمية لكن العيب في قلة التربية.؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102104948/http://www.20at.com/article2.php?sid=546"

