order = 25
subject = "هو انتوا اساسا تطولوا"
author = "هو انتوا اساسا تطولوا يا سعوديين يكون عندكم مصريين مخترعين الفن يابتوع طاش ماطاش والكبسة"
posted = "2006-10-31"
text = "طاش ما طاش هههههههههههههههههههههههههههه<br />على فكرة كل المصريين بيتبضنوا اوى اوى من طاش ماطاش دى<br />يابن بص يابنى على اللى مخلى السعودية دى وشوف مين اساسا اللى عمل السعودية بتاعتكم دى<br />كفايا ان معندكمش مدرسين وبتيجوا تاخدوا من عندنا<br />وكفايا ان معندكمش مهندسين وبرضوا بتيجوا تاخدوا من عندنا<br />اية دا بيتأمروا على اية يا خويا دول<br />اللى شايفنى نفسهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102104948/http://www.20at.com/article2.php?sid=546"

