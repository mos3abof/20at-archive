text = "انا من الناس اللي عاشوا في المنفوحه 17 سنه وفعلا انا بعتبرها من افضل الاحياء في المملكة مش عشان كل الكلام اللي فات ده لا بالعكس عشان قدرت انها تكون وسط الرياض فرضت على الجميع بما فيهم السعوديين انفسهم انهم يرحوا لهناك وانهم يكلوا اكلنا وانهم يتعلموا لغتنا فرضنا عليهم ثقافتنا ولبسنا بس الصراحه انا خلال ال 17 سنه اللي قاضيتهم هناك مشوفتش لا قهاوي ولا شيش خالص جايز خلال ال5 سنين اللي رجعت فيها لمصر اتغيرت بس مش عارف انا مصدقش ان هيئة الامر بالمعروف حتسيب قهوه هناك مفتوحه كده وفيها شيشه ......؟"
