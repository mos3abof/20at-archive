subject = "انا معكن ولكن"
author = "اللجين"
posted = "2006-07-05"
text = "حياكن الله اخواتي الباسلات في السعودية سواء كنتي من نجد او الحجاز او من هبايب الجنوب او كنتي من الشمال فحياك الله اينما كنتي اقولها وبصوت عالي انا معكن ولكن لا تنسي ان تكوني سفيرة لبلادك ليكن همك اولا نشر الدين وثم الا هتمام بما بعثتي من اجلة كوني كالنحلة نشيطة فوقت للجد والعلم و وقت للبيت و وقت للابحاث والباقي فيما يفيدك ولتكن الا شارة اليك بقولهم تللك الفتاة السعودية وبكل فخر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134520/http://www.20at.com/article2.php?sid=1028"

