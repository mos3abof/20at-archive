subject = "موضوع صعب"
author = "عبدالله مفتاح"
posted = "2006-07-04"
text = "بصراحه انا لو اب هفكر اكتر من مرة قبل ما بنتي تسافر<br />لان في ذاكرتي البنات المغتربات اللي بيتلموا على بعض ونتيجه الثقافه الجديده بيحصلهمculture shock او الصدمه الثقافيه وبينتج عنها عادة اما ناتج سلبي او ايجابي بيتوقف على الصحبه والشخصيه و عوامل تانيه كتير<br />وبما اني مقتنع تمام الاقتناع ان الاب والام مش بس هما اللي بيربوا ده المجتمع كمان بيربي<br />لازم اخاف وافكر وافكر وافكر قبل ما اسيب بنتي تسافر ولازم اصلا السفر يكون بمحرم<br />وبس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134520/http://www.20at.com/article2.php?sid=1028"

[[comments]]
order = 1
subject = "مجرد رأي"
author = "فاطمة"
posted = "2006-07-05"
text = "انا فعلا باكره التعميمات المطلقة ، باكره الكلام المرسل ، يعني ايه كل البنات عاوزة تسافر ولا انهم مش عاوزين يتعلموا .<br />يا استاذ عبد الله يا تري لو كان اللي مسافر دة ابنك مش بنتك كنت قلقت القلق دة كله . انا شايفة ان البنت لو متربية علي الاعتماد علي النفس السفر مش ها يشكل لها مشكلة ، الصعاب موجودة في اي مكان ، بالعكس انا شايفة ان السفر فرصة للاستقلال و اكتساب مهارات جديدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134520/http://www.20at.com/article2.php?sid=1028"

[[comments]]
order = 2
subject = "معاكي يابطه..."
author = "هووووووبهa"
posted = "2006-07-05"
text = "خلينا نقول الاول انها مش بتتفسح ...<br />السفر بيشد العضم...<br />بتشوف بشر مشفتهمش قبل كدا, الاحتكاك, الصدمهالثقافيه والله افتح روتنا, ميلودي مفيش فرق ..<br />السفر علي قد مرمطته بيعلم كتيييير ..<br />الاعتماد علي النفس اولا..<br />الوقت..<br />البشر وانواعها...<br />واانا اهو لما قعدت سنه رجعت الكل بيقولي في<br />حاجه اتغيرت . ..\" سنه مرمطه\" في ناس حتعترض علي الكلمه \" بس مش<br />مشكله بالنسبه لي , عشر سنين في الوطن ان صح التعبير<br />السفر مش لعب وفسحه السفر لهدف ,<br />وفي النهايه الله يكرمكو بلاش سياسيه التعميم..<br />Today is anew day to learn something new"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134520/http://www.20at.com/article2.php?sid=1028"

