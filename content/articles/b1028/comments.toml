[[comments]]
order = 11
subject = "أمر نسبي"
author = "dodo lph"
posted = "2006-07-17"
text = "المشكلة هي مش البنت بتحب التعليم أو لا المشكلة هي عدم موافقة الأهل علي عدم سفر البنت إذا كانت عايزه تكمل فعلا دراستها وهي مختلفة من بيت لآخر بالتالي داعي لكل الإختلاف حول إذاكانت البنت عايزه تتعلم أولا بالتالي إذاكان هناك مشكلة هي مشكلة البنت التي تريد أن تسافر المفروض أن نحاول إقناع الأهل [مدى جدية القتاه في هذا الطلب وإنها فعلا تريد هذا التعلبم وإنها ذهاب لتحقيق هذا الهدف ولماذامازال هذاالمجتمع بهذا التفكير نحن في القرن الثامن عشر ولا أيه البنت التي تريد الخطأتسطيع فعل الخطأفي وسط أهلها بدون أي مشكلة وليست محتاجة أنتغادر البلد والبنت المحترمة لاتفعل أي خطأ لأنها لأاتريد غير هدفها وهو تعليمها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134520/http://www.20at.com/article2.php?sid=1028"

[[comments]]
order = 12
subject = "الحياه والنساء"
author = "اسلام"
posted = "2006-07-17"
text = "ممالا شكه فيه ان النساء هم الطف الكائنات ومن مميزات المره غير الجمال واهم من الجمال هي الرقه مع مع مرعات عدم المثيل ....وانا اقول الي نساء الخليج لبد ان تعلمو انكم راعات اكيد مش الكل ولكن كل امراه تحترم دينها علنا ان نحترمها ونقدم لها كل الولاء وانا علي فكره من مصر واكيد حبي لبلدي مش بيتوصف<br />لكن احنا عندنا مرض في مصر للنساء هو التقليد للغرب لا بكل صرحه اجنا بنحب نسا الغرب لانهم يجيدو فن التعامل ولكن لما نجي نرتبط نتزوج من النساء العرب واحنا عرفين ليه يا نسا الخليج لا رفعو نقابكم ولهي تبقون في نظر الناس ملكات جمال ...واكيد موضوع انا البنت تسافر ده اكيد مفهو نقاش رفض مطلق اكيد من غير تفكير ****"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134520/http://www.20at.com/article2.php?sid=1028"

