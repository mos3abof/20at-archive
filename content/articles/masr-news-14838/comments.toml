subject = ""
author = "جورجيت اسلمت"
posted = "2010-01-12"
text = "يا ست جورجيت انتى مسيحية ومحافظ قنا مسيحى والمسيحية ليس فيها جنة ولا نار<br />—— الجنة والنار بتاع المسلمين بس انما انتم هتبقوا مع المخلص ياسوع ذلك افضل جدا<br />وحياة ابوكى يا جورجيت ما تتكلميش على اللى ملكش دعوة بية"
archived = "2010-01-13"
capture_url = "https://web.archive.org/web/20100113205214/http://www.20at.com:80/masr/news/14838-2010-01-12-12-04-47.html"

