text = "مفيش احد بيضرب احد كدة من الباب للطاق<br />لازم عملوا حاجة<br />وعلى نفسها جنت براقش"
archived = "2010-01-13"
capture_url = "https://web.archive.org/web/20100113205214/http://www.20at.com:80/masr/news/14838-2010-01-12-12-04-47.html"

[[comments]]
order = 4
subject = ""
author = "الى ابو محسن"
posted = "2010-01-13"
text = "يا عم خليك فى غربتك - ظلم اية اللى بتتكلم علية = دول واخدين حقهم فى البلد تالت ومتلت<br />يا ابو محسن يا غريب الدار<br />الكنيسة مفتوحة اربعة وعشرون ساعة فى اليوم - ندوات دينية - تكوين اسر دينية - معسكرات كشافة للشواطىء شبة عسكرية - رحلات تثقيف دينى مكثف فى باصات خاصة للاديرة والكنائس لغسيل مخ الشباب - دروس خصوصية مجانية - علاج ببلاش وادوية ببلاش داخل الكنيسة<br />بينما على الجانب الاخر<br />المسجد بيفتح خمس دقائق للصلاة ويغلق واى شاب بيقف حتى فى الشارع جنب الجامع بيقبض امن الدولة علية ويستجوب - والمسجد شبة مغلق فى جميع البلاد المصرية ويفتح ويغلق برقابة امن الدولة<br />ما تتكلمش عن حاجة انت مش عارفها"
archived = "2010-01-13"
capture_url = "https://web.archive.org/web/20100113205214/http://www.20at.com:80/masr/news/14838-2010-01-12-12-04-47.html"

