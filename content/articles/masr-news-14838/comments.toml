author = "جورجيت الشنودية"
posted = "2010-01-12"
text = "جورجيت متعصبة على مذهب شنودة فهى شنودية متعصبة وكفرت المحافظ وهددتة بانة هيروح النار - وهددت المجلس وقالت بكرة هتشوفوا<br />انا مش عارف هنشوف اية من جورجيت - دة حتى شكلة باين علية معفن - واللى هيشوفة هيموت بالسكتة القلبية"
archived = "2010-01-13"
capture_url = "https://web.archive.org/web/20100113205214/http://www.20at.com:80/masr/news/14838-2010-01-12-12-04-47.html"

[[comments]]
