posted = "2010-01-13"
text = "ربنا سبحانه وتعالى وضع في الدنيا دليل يقيني على الاخرة وعلى اليوم الاخر ويوم القيامه<br />يعني بالمعنى البلدي كده دليل ما يخرش الميه الا وهو ظلم الناس بعضهم لبعضا<br />ولذلك جورجيت لما حست بالظلم نطقت بكلمة الحق الا وهو جزاء الظالم في الاخره<br />ظلم الناس بعضهم لبعض دليل يقيني على اليوم الاخر وعلى يوم الحساب"
archived = "2010-01-13"
capture_url = "https://web.archive.org/web/20100113205214/http://www.20at.com:80/masr/news/14838-2010-01-12-12-04-47.html"
