subject = "هوا فيه ايه بالضبط"
author = "ايمن امام"
posted = "2007-01-31"
text = "يوميات قارىء للموقع/ استيقظت لكى اقراء واتصفح عده مواقع على النت - قرأت مقاله - بعنوان يوميات الوحشه-لم افهم ماذا يريد ان يقول لى كاتبها - وخاصه مشكله امتلاء المثانه- ثم الاغانى والاخبار- بجد انا اعتقد ان مشكله الكثيرين منا انهم فى لحظه بارانويا يظنون انفسهم - يكتبون يوميات نائب فى الارياف ويتقمصون الشخصيه- يعتقدون ان مسأله دخولهم للحمام هى موضوع كبير ينتظره القراء بشغف- مالنا ومال مثانه حضرتك ومالنا ومال مشكله سعادتك انك مش عارف تكش فى عيالك ولو عندهم حق اغانى ايه ياراجل اللى عاوز تسمعهالهم- العيال عاوزه تسمع الاخبار وانتا عاوز تسمعهم الاغانى- متهيألى ابنك ممكن يكتب هوا كمان يوميات ابن صحفى مثانته مليانه- جاتكو القرف مليتوا البلد- ايمن امام"
archived = "2007-01-31"
