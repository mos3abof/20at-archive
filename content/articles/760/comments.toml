subject = "موضوع جميل"
author = "Dabdoob"
posted = "2006-02-09"
text = "موضوع ظريف فعلا ومكتوب بشكل جميل وكنت اتمني ان يكون اكبر بمعني ان يتناول النعي في مصر والوطن العربي في احد اجزائه ثم يتناول النعي في مناطق العالم الاخري في اجزاء اخري .<br />اما بالنسبة لموضوع كتاب صور مقلوبة فهو بالفعل واحد من اجمل الكتب التي قراتها في حياتي واكثرها طرافة وهو اجمل ما قرات عن موضوع النعي<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115347/http://www.20at.com/article2.php?sid=387"

