subject = "كوهين ينعي ولده و يصلح راديوهات"
author = "أكرم"
posted = "2006-02-05"
text = "الموضوع رائع و مالهوش حل و راجعين تاني يا عشرينات ان شاء الله<br />بس احب اقول ان اجمل نعي شوفته هو نعي رسام الكاريكاتير المناضل ناجي العلي<br />اما عن اجمل كتاب قريته بيسخر من موضوع النعي و مواضيع تانية كتير هو كتاب صور مقلوبه لاحمد رجب الكاتب المسخرة ( مش ساخر و بس ) يا ريت تشتروه هو رخيص و مش هتندموا هتفطسوا من الضحك و انا الضامن اللي يشتريه و ميعجبوش مستعد ادفعله تمنوا و ايميله اهو عشان اللي عايز نعي ناجي العلي او لو معجبوش الكتاب و عايز فلوسه<br />hurry_day@yahoo.com<br />hurry_day@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115347/http://www.20at.com/article2.php?sid=387"

