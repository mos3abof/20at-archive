posted = "2006-02-07"
text = "مقال ظريف احب اذكر من اشد ما سمعت في هذا الموضوع ما قاله سيدنا عمر بن الخطاب عندما سمع رجل ينعي موت احدهم وينادي لصلاه الجنازه قال عمر رضي الله عنه مات فلان ومات فلان وغدا تقولون مات عمر وفعلا مرت الايام ومات عمر فرحم الله موتي المسلمين وحشرنا في ذمره الصالحين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115347/http://www.20at.com/article2.php?sid=387"

