posted = "2009-10-09"
text = "التوريث ماشي في البلاد الاسلامية من اول معاوية ابو سفيان لحد الملك فاروق<br />وصدق رسول الله صلى الله عليه وسلم عندما قال الخلافة الراشدية ثلاثون وينقلب الحكم الى ملكا عضوضا<br />وما تخدش في بالك الحركة القرعة اللي عملها جمال عبدالناصر فدول كذابين لان التوريث ممكن يكون في غير الاولاد فعندما جاب جمال عبدالناصر السادات وعمله نائب رئيس جمهورية كان يقصد ان يورثه الحكم وكذلك السادات جاب حسني مبارك نائب رئيس جمهورية وولي عهد<br />هي هي<br />ما فرقتش كتير"
