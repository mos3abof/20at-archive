subject = ""
author = "وقرن في بيوتكن"
posted = "2009-10-08"
text = "الاخوات المنقبات العفيفات الشريفات طالما هما مصرين على لبس النقاب<br />فلبس النقاب له شرط ان تكون من فريق وقرن في بيوتكن<br />يعني تتنقب بالمنزل وتستر نفسها في منزلها<br />اما اللي بيلبسوا النقاب ودايرين في الشوارع والاتوبيسات واماكن العمل كل هذا نقاب لا معنى له<br />لانها لم تمتثل لامر الله وقرن في بيوتكن فنقابها مردود عليها<br />ربنا قال وقرن في بيوتكن ولا تبرجن تبرج الجاهلية الاولى<br />يعني الخروج من المنزل بدون محرم تبرج الجاهلية الاولى<br />فهمتوها ولا لسه ما فهمتوهاش<br />اخر زمن<br />منقبات يزاحمن الرجال في المواصلات واماكن العمل<br />عشنا وشفنا<br />،،،،،،،،،،،،،،، ،،،،،،،،،،،،،،، ،،،،،،،،،،،،،،، ،،،،<br />مش احمد الهواري ولا عبدالله الطحاوي"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170650/http://www.20at.com:80/masr/t7kyk/13661-2009-10-08-12-40-26.html"

[[comments]]
