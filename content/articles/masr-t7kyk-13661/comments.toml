subject = ""
author = "تغطية الوجه"
posted = "2009-10-08"
text = "على حسب ما فهمته من الايات ان الله امر زوجات النبي بتغطية الوجه حتى لا يعرفن<br />يعني الغرض من النقاب عدم كشف الشخصية<br />والان كل واحدة ست في جيبها بطاقة وكرنيه رخصة وفيه امن في البلد ممكن اي واحد يوقفها ليتأكد من شخصيتها<br />اذن الغرض من النقاب المفروض على زوجات النبي الذي هو عدم كشف الشخصية زال<br />واصبح الان اي امرأة مأموره بان تكشف عن شخصيتها وذلك في صورة البطاقات الشخصية وخلافه<br />فهمتوها ولا لسه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170650/http://www.20at.com:80/masr/t7kyk/13661-2009-10-08-12-40-26.html"

