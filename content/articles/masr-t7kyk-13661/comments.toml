[[comments]]
order = 12
subject = ""
author = "شاء الازهر او ابى"
posted = "2009-10-09"
text = "سينتشر النقاب بين الفتيات والسيدات شاء الازهر ام ابى<br />الموضوع هو انسحاب من الحياة - سحابة من الدخان الاسود تلف حياة المصريين بالفقر والياس والزهد فى الدنيا وكراهية المعيشة<br />هناك شعور ياس كثيف بين الفقراء والشعار الداخلى ان كنا خسرنا الدنيا فلا يجب ان نخسر الاخرة هكذا فهمهم<br />هل تعرف لبس الهيبز والخنافس فى اوروبا بعد الحرب العالمية التانية تمردا على نوع الحياة وخلق عالم خاص بهم<br />فى اوروبا الهيبز والخنافس تمردوا على وضع اقتصادى وسياسى معين وهنا فى مصر ظهر النقاب تمردا على وضع اقتصادى وسياسى ومحاكم عسكرية للمدنيين وبطالة وفقر متفشى<br />سينتشر النقاب وربما بعدة موجة ارهاب كما تنبأ تقرير امريكى نشر حديثا<br />والمستقبل مظلم<br />والمجتمع انشق - اقلية منة تسهر فى صخب ترقص وتغنى فى شواطىء الساحل الشمالى وهم شبة عراة واغلبية الشعب تقف فى طوابير الخبز ويغلبهم الياس ويخفون من شدة فقرهم وجهوههم بالنقاب<br />الموضوع موضوع فقر وياس"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170650/http://www.20at.com:80/masr/t7kyk/13661-2009-10-08-12-40-26.html"

[[comments]]
order = 13
subject = ""
author = "النقاب لماذا ؟"
posted = "2009-10-09"
text = "زمان كنت مجند فى الجيش فى منطقة صحراوية بعيدة<br />وفى الشتاء كانت تهب علينا العواصف الرملية<br />ما معنى عاصفة رملية ؟<br />هواء بارد شديد السرعة يحمل حبات رمال تصطدم بوجة الانسان فيشعر بوخز الابر<br />نعم كنت اشعر كان ابر تنغرز فى جلد ولحم الوجة من شدة اصطدام حبات الرمال بالوجة<br />وكنا نعالج ذلك بان نلبس الفوطة او نربطها على وجوهنا فيما يشبة النقاب او الخمار التى ترتدية السيدات فكان يحمى جلدنا<br />وكذلك كان يقينا حروق الشمس المبهرة لجلد الوجة<br />اذن الخمار او النقاب صالح للمناطق الصحراوية المكشوفة او المفتوحة لحماية جلد الانسان وهو ضرورة<br />ولكن فى المدن وداخل البيوت لا داعى للتشدد والصاق كل شىء بالدين<br />نعم هو كان لبس العرب وليس لبس العرب مفروض دينيا ولا هو من الشريعة<br />الموضوع محتاج جدل بالحسنى<br />نعم بالحسنى"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170650/http://www.20at.com:80/masr/t7kyk/13661-2009-10-08-12-40-26.html"

[[comments]]
order = 14
subject = ""
author = "من حق الشيخ"
posted = "2009-10-09"
text = "من حق الشيخ ان يفتى ما يشاء<br />ذلك حقة الوظيفى او مقابل ما تعطية الدولة من اجر<br />ولكن<br />ليس من حقة ابدا كانسان ان يهين انسان اخر ويجرح كرامتة وخصوصا وهو رجل كبير فى السن<br />ان يقول للبنت الصغيرة انا افهم فى الدين احسن من اللى خلفوكى - لية جاب سيرة اللى خلفوها<br />وبعد ان اجبر البنت الصغيرة على رفع النقاب شتمها وامتهن كرامتها قائلا - امال لو كنتى حلوة شوية كنت عملتى اية<br />ابسط تعليق على الالفاظ التى قيلت بعيدا عن وظيفتة الدينية ان قائلها جلمف معدوم اللياقة وجاى من وراء الحمار من بلدهم ليجلس على كرسى الازهر<br />فشيخ الازهر يجب ان يكون صدرة متسع وشفوق على البنات الصغار ويعظ الناس بالمودة والرحمة اما اسلوب الجليطة والجلمفات فلا يليق<br />هناك اناس سيقولون لا تشتم شيخ الازهر واقول لهم ليس عندنا قداسة الكهنوت انما هو رجل من المسلمين وليست لة اى قداسة<br />اليس فى المشايخ من هو اجدر منة واكثر انسانية وتحضرا وثقافة<br />ام ان الازهر وضعوا على راسة قردا ليشوة الدين"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170650/http://www.20at.com:80/masr/t7kyk/13661-2009-10-08-12-40-26.html"

