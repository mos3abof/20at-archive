posted = "2009-10-09"
text = "واللة لا عالم دين ولا حاجة دى راجل شخشيخة فى ايد الحزب الوطنى<br />الحزب يقول لة سلم على شمعون بريز يروح يسلم على بريز<br />اشتم شوية فى الجماعات يشتم اشتم بتوع الحجاب يشتم<br />رجل ليس لة مواقف ثابتة<br />عندة علم نعم والحديث الشريف يقول ولا تعلموا اولاد السفهة العلم<br />شتم البنت وشتم اهلها وعمل فتنة بين المسلمين"
