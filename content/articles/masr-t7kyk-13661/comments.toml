subject = ""
author = "صحة الصلاه بدون نقاب"
posted = "2009-10-08"
text = "الى الاخوات المنقبات<br />الصلاة عمود الدين من اقامها اقام الدين ومن هدمها هدم الدين<br />ومن شروط صحة الصلاة للمراة كشف الوجه<br />اذن لبس المرأة للنقاب لا علاقة له بالدين<br />فهمتوها ولا لسه فيه ناس فاضيه وعايزه تضيع وقتها في قضايا تافهه<br />وفيه حاجه كمان الحج ما ينفعش مع تغطية الوجه<br />يعني لازم تكشف وجهها في الحج<br />فيه حاجه كمان<br />وفيه 12 حديث في البخاري ما معناه ان النبي محمد صلى الله عليه وسلم ان المرأة لما تبلغ الحيض تستر جسمها كله الا الوجه والكفين<br />فيه حاجه كمان<br />وكشف الوجه من الاعجاز المستقبلي للاسلام<br />لان فيه حاجه اسمها بطاقات شخصية واثبات شخصية لازم المرأة تطلعنها عند اللزوم<br />والى الاخوات المنقبات بطلوا رزاله<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــــت تت<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170650/http://www.20at.com:80/masr/t7kyk/13661-2009-10-08-12-40-26.html"

[[comments]]
order = 6
subject = ""
author = "محمد سيد طنطاوي"
posted = "2009-10-09"
text = "محمد سيد طنطاوي شيخ الجامع الأزهر الحالي. يلقب ب\"الإمام الأكبر شيخ الجامع الأزهر\" .<br />ولد في 28 أكتوبر 1928 بقرية سليم الشرقية في محافظة سوهاج. تعلم وحفظ القرآن الكريم في الأسكندرية.[1]<br />حصل على الدكتوراة في الحديث والتفسير العام 1966 بتقدير ممتاز.<br />عمل كمدرس في كلية أصول الدين، ثم انتدب للتدريس في ليبيا لمدة 4 سنوات.<br />عمل في المدينة المنورة كعميد لكلية الدراسات العليا بالجامعة الإسلامية.<br />عين مفتيا للديار المصرية في 28 أكتوبر 1986.<br />عين شيخا للأزهر في العام 1996.[2]"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170650/http://www.20at.com:80/masr/t7kyk/13661-2009-10-08-12-40-26.html"

