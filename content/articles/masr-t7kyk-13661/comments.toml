author = "النقاب مصرى اصيل"
posted = "2009-10-10"
text = "بعض الجهلة يقولون ان النقاب مستورد من الخليج او السعودية<br />كلا<br />النقاب مصرى ابن مصرى لبستة جداتنا حتى وقت قريب وحتى الافلام القديمة تصور السيدات وهن يرتدينة فى الاحياء الشعبية وكان يسمى باليشمك<br />النقاب المصرى كان يلبس مع الملاية اللف واليشمك المشبك قبل ان تكون هناك دول اسمها دول الخليج<br />وانا واثق ومتاكد ان جدة الطنطاوى وجدة زقزوق وهلال كانت تلبس النقاب اللى هو اليشمك<br />وحدث ان بعض السيدات ابان ثورة 19 والسيدة ام المصريين صفية زغلول وبعض المتحررات واتباع قاسم امين قاموا بخلع اليشمك والنقاب ومشين سافرات فى المظاهرات بحجة التحرر<br />النقاب مصرى ابن مصرى<br />وارتدتة جداتنا منذ زمن طويل<br />وكل شىء يعود الى اصلة"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170650/http://www.20at.com:80/masr/t7kyk/13661-2009-10-08-12-40-26.html"

