author = "التوريث والبدنجان"
posted = "2009-10-10"
text = "اللى بيتابع اخبار التليفزيون ويسمع اخبار الحوثيين فى اليمن واية اللى بيجرى هناك يعرف ان فساد الشعوب العربية والاسلامية جاية من التوريث<br />اللى ركب على كرسى الحكم فى اليمن شاويش متطوع رقى نفسة بعد ذلك الى عقيد<br />ما يعرفشى اى حاجة فى اى حاجة<br />جاب ابنة المحروس ورقاة عقيد وسمة قيادة قوات الحرس الجمهورى<br />وجاب اخوة علشان يراضى امة وسلمة قيادة القوات الامن المركزى<br />مفيش لا تنمية ولا تطوير ولا اى حاجة خالص<br />القبائل قالت توريث بتوريث يبقى يرجع الامام الاصلى صاحب البلد اولاد الامام احمد والامام البدر اللى ثورة اليمن بقيادة السلال شالتهم<br />والبلد ولعت نار<br />7 الوية للجيش بتحارب شوية ناس متمردين راكبين الجبال<br />وجنوب اليمن هينفصل<br />يبقى التوريث بيودى فى ستين داهية<br />لية ما نرجعش للاصل<br />ازاى اختار عمر وعثمان وابو بكر<br />اختيار الصالح واجماع الامة علية<br />انما البلاد مش عشة فراخ ولا زريبة بهايم كل واحد هيورثها لابنة<br />لا<br />مش عايزين جهل<br />لهذا اليمن وافغانستان والصومال وغيرها زى العصور الوسطى ومتحف تاريخى حى للتخلف"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170650/http://www.20at.com:80/masr/t7kyk/13661-2009-10-08-12-40-26.html"
