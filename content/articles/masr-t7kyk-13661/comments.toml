subject = ""
author = "الطنطاوى والخمينى"
posted = "2009-10-10"
text = "اولا انا لست شيعى ولا احبهم ولكنى سنى حنفى على مذهب ابى خليفة النعمان<br />ولكننى اتابع ما يجرى فى دول المسلمين وماذا يحدث فيها ؟<br />هل يتصور احد انة ولمدة الف سنة لم تقم صلاة الجمعة فى ايران<br />هل يتصور احد انة ولمدة الف سنة لم تقم اى صلاة جماعة فى اى مسجد فى ايران - الناس يدخلون المساجد ويصلون فرادى ويخرجون ولا صلاة جمعة بل يصلون كل واحد فرض الظهر لوحدة ويذهب الى بيتة وظل الحال على هذا الوضع لمدة الف سنة<br />لماذا ؟ لان الامام غائب او اخر امام عندهم دخل سردابا ولم يخرج منة وينتظرون عودتة ويدعون حتى الان ان يعجل اللة عودة الامام المنتظر ليقيم الصلاة الجامعة<br />الى ان جاء الخمينى<br />الخمينى اعاد صلاة الجمعة الجامعة وخالف اسلافة لمدة الف سنة<br />الخمينى اعاد صلاة الجماعة فى الفجر والظهر والعصر والمغرب والعشاء<br />الرجل مجدد فى الدين<br />يقول الحق وحتى لو خالف الاجماع لانة يقول كلمة اللة<br />اما الطنطاوى<br />فصحيح انة يحمل الشهادات والعلم ولكنة رجل يشتغل بالريموت كنترول<br />يقول راى غيرة فى وقت معين<br />المفتى وهلال وزقزوق كلهم صاحوا مرة واحد النقاب النقاب<br />الحاج هريدى"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170650/http://www.20at.com:80/masr/t7kyk/13661-2009-10-08-12-40-26.html"

