order = 0
subject = ""
author = "ابومحسن غربة 28 سنه"
posted = "2009-10-08"
text = "بحكم عملي مدقق لغوي في المحاكم فاريد ان اوضح لكم جميعا<br />على سبيل المثال<br />القاضي لما بيقول حكمت المحكمة على فلان الفلاني بالحبس شهر<br />او<br />حكمت المحكمة على فلان الفلاني بغرامة 100 درهم<br />لازم يكتب حاجه اسمها اسباب وحيثيات الحكم<br />وقبل كده قلت لما القاضي حكم على السكري وطلعت مصطفى بالاعدام<br />كتب 225 ورقة اسمهم اسباب وحيثيات الحكم<br />والان ننتقل الى مشكلة العالم الاسلامي المترامي الاطراف<br />الفتاوي دي يا اخوانا عامله زي احكام القضاه بالضبط<br />اولا لازم يكون لها جهة واحدة للفتوى في كل بلد تماما زي المحاكم<br />ثانيا لازم يكون هناك لجنة فتوى مشكلة من ثلاثة اعضاء على الاقل<br />ثالثا الفتوى لا بد ان يكون لها اسباب وحيثيات تحمل الفتوى<br />ثالثا لابد ان يكون هناك درجات في الافتاء كما في المحاكم<br />ابتدائي واستئناف ونقض<br />لابد ان يكون كذلك في الفتاوي<br />يعني اللي معترض على الفتوى يقدم اعتراضه للجنة فتوى اعلى منها تنظر اعتراضه<br />ما ينفعش كده تبقى الفتاوي في سوق الخضرة وسوق السمك<br />كل اللي عايز يفتي يفتي وكل اللي عايز يقول حرام عليك واتق الله وهو جاهل ولا يفقه شيء في العلم ويتبع الرؤوس الجهاله<br />والموضوع يطول شرحه"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170650/http://www.20at.com:80/masr/t7kyk/13661-2009-10-08-12-40-26.html"

[[comments]]
order = 1
subject = ""
author = "انتهت كل مشاكلنا"
posted = "2009-10-08"
text = "خلاص انتهت كل مشاكلنا ووقفت على النقاب<br />الشباب اتوظفوا ومياة الشرب بقت نظيفة والزبالة انشالت من الشوارع ومفيش سحابة سوداء وبتوع الفيروس بى وسى اتعالجوا خلاص<br />خلاص بقينا بتوع عمليات تعمية بالدخان مرة بنشر الفزع بين الشعب من انفلونزا الخنازير ومرة تانية من النقاب علشان الناس تنسى الفقر وطوابير العيش وغلو الاسعار والمعيشة الضنك بتاع الناس<br />كل الكلام عن النقاب وانفلونزا الخنازير مبالغ فية جدا وكلام بلوتيكا<br />وطبعا الناس بتسمعة وتقول زى ما قال الكبير لفاروق حسنى<br />ارمى ورا ضهرك"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170650/http://www.20at.com:80/masr/t7kyk/13661-2009-10-08-12-40-26.html"

[[comments]]
order = 2
subject = ""
author = "منصور"
posted = "2009-10-08"
text = "اين الحرية الشخصية ؟<br />هل الحرية الشخصية ان ترتدى المراة مايوة بكينى فقط وليس من الحرية الشخصية ان تستتر ؟<br />اسف خلونا بعيد عن الدين اليس من الحرية الشخصية ان ارتدى ما اريدة طالما لا اجرح مشاعر الاخرين<br />وبعدين اذا كان هذا تشددا انتم كنتم فين<br />فية اربعة مليون مصرى فى السعودية ودول الخليج ومعهم اسرهم ويرسلون بناتهم هناك للتعلم فى المدارس ويرتدوت النقاب منذ صغرهم وتعودوا علية وحينما يعودون للوطن للدراسة يحتفظون بلبسهم<br />لماذا لا توفروا وظائف لشعبكم حتى لا يخرج ويتغرب ويعود بثقافة الاخرين<br />انا اتكلم بعيد عن الدين<br />وصدق عضو مجلس الشعب حينما قال لشيخ الازهر او الجالس على كرسى شيخ الازهر اذا كنت لا تريد رؤية الخمار فاذهب الى المراقص والبارات والملاهى الليلية اما اماكن تعلم الدين فلها احترامها<br />الا ترتدى الراهبة الحجاب داخل الدير مع ان كل من فى الدير سيدات ولا يوجد رجال<br />نخطىء حينما نخلط الدين بالسياسةونتخذ مواقف لتاييد مواقف اوروبا ضد النقاب<br />وبعدين يا مولانا ما رايك مما يحدث فى الاقصى<br />والا عندك تعليمات ما تفتحش بقك"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170650/http://www.20at.com:80/masr/t7kyk/13661-2009-10-08-12-40-26.html"

[[comments]]
