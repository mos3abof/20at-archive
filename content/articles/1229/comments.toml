text = "انا من رأى ان مفيش حاجه اسمها جواو على النت ولا حب برده لأن الواحد مايضمنش صدق اللكلام اللى بيقولوا اللى انا بكلمه<br />انما تفرق انى اكون عارفه شخص فى حياتى ويبقى كلامنا على النت كا مجرد وسيله اتصال بنا<br />انما انى اعرف واحد واحبه على النت دى مش داخله دماغى علشان انا مبصدقش الكلام اللى بيقولوا الطرف التانى مش يمكن بيكدب زى اللى قال انه فى كندا وطلع فى مصر"
