subject = "استنوووونى بقى"
author = "انا مش شايفه ان الموضوع سيئ اطلاقا"
posted = "2006-01-24"
text = "هو احنا من كتر ما اتعودنا اننا ندارى على مصايبنا بقينا نخاف من اعلانها<br />ليه ما نعتبرش ان الموضوع دا بيعرف كل شا وكل فتاه ايه الخطر الى ممكن يقعوا فيه<br />ثانيا بقى :الاخ حنفى الاقرع الى علق وقال انهالموضوع فيه طابع جنسى<br />من وجهه نظرى الموضوع لم يخرج عن لادب والاحترام<br />ثالثا والاهم<br />ان نجاح اى علاقه ارتباط سواء عن طريق الانترنت او المريخ هى فى الاول والاساس نابع من الشخصين<br />مش الوسيلة<br />يعنى لو توافرت الثقة والمصدقية فى الطرفين فى رايى ان العلاقه هتكون ناجحه جدا<br />ودا رأيى نابع من تجربة شخصية جدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134557/http://www.20at.com/article2.php?sid=190"

