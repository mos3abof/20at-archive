[[comments]]
order = 37
subject = "الزوج عبر انت"
author = "فيصل"
posted = "2006-08-03"
text = "الزوج عبر الانتر نت هو غلط ليش لانهو فاشل فشل ذريع لان الواقع غير وعبر انت غير قصه حصلت نسرد لكم الهامش منها فقط شخصين تعارفا علا انت واستمرت علاقتهما فترة من الاشهر وطبعن هي تعرفهو وهو يعرفها وكلن من الاخر يعرف الثاني واستمر الحال حاولي 6اشهر بعدها انسحبت هذ حبيبتهو ليش لانها ابوها وقف ضدهاوفعلان اتصلت في حبيبها وهي تبكي من ابوها وترجو من حبيبها ان يتركها ولا يتصل بها علا الاطلاق المسكين سحب حاله واعاد ادرجهو حزين وتغيرت اوضعهو مؤسويه لذالك انصح اخواني انهو ما بني علا باطل يصبح باطل الطريق عبر انت خط ليش لانهو بعد حين يكتش الاغلط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134557/http://www.20at.com/article2.php?sid=190"

[[comments]]
order = 38
subject = "اتقي الله يا هباري ام خليفة"
author = "وفاء محمد"
posted = "2006-10-20"
text = "لاتستغربوا من تعليقي ربما هو يختلف عن ماتنتظرونه كلكم لكنني من فرط حزني لم اجد سوى هدا المنبر لاقول للسيدة هباري ام خليفة اتقي الله سوف تسئلون من هي هباري ام خليفة انها فتاة جزائرية منذ 5شهور وهي تطارد زوجي للزواج بها رغم انها تعلم انه متزوج من ثلاث وهمها الوحيد هو المجيء لمصر للعيش فيها. انها منتهى الانانية ان تدوس على ثلاث قلوب لهدف العيش في مصر. وافظع من ذلك انها تقول على من تريد الارتباط به انه عجوز لايصلح للزواج ان كان كذلك فلمادا تطاردينه ليلا ونهارا.<br />اناشدكم الله ان تبلغوا هباري ام خليفة ان تبتعد عن الرجل الدي ياوي ثلاث اسر لا معيل لهم سواه فوجودها سيدمر ثلاث اسر قولوا اتقي الله عنوانها هو- هباري ام خليفة ص-ب رقم 17 تنيرة سيدي بلعباس 22000 الجزائر ورقم هاتفها هو 0021378929406<br />ساعدوا الزوجات الثلاث من فضلكم قولوا لها حرام ما تفعلينه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134557/http://www.20at.com/article2.php?sid=190"
