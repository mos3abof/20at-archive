[[comments]]
order = 31
subject = "كبت أدى إلى انفجار"
author = "peasful girl"
posted = "2006-07-02"
text = "أولا : السلام عليكم و رحمة الله و بركاته<br />إن الموضوع كما يبدو له إيجابيات و سلبيات و لكن الإيجابيات أتت من استخدامه بالطريقة الصحيحة ... أما القصص الخرى من صور عالية و مواضيع عن العلاقة الحميمية بين الرجل و المرأة منبعها الأساسي الكبت الذي يعيشه الشباب ذكورا و إناثا... الكبت قد يكون عاطفيا او اقتصاديا او اجتماعيا أو سياسيا و من الواضح أن هذه النواع متوفرة بكثرة الآن و اكثرها الكبت العاطفي و التقاليد المتخلفة التي تمنع الجنسين من فهم الآخر فالعيب يطاردنا مع انه من الممكن أن يكون مصدر المعلومات علميا و دينيا و لكن العادات الكتخلفة هي التي منعت الشباب من معرفة أشياء يجب عليهم معرفتها كاعضاء في المجتمع البشري مما اتاح الفرصة للشيطان متجسدا بعدة صور من الدخول و إدخال المعلومات التي يريدها ... ما يجب أن نفعله لنحل هذه المشكلة هو خلق توافق بين الفكر و الجسد فهما معا دائما و الجسد أداة الروح فإذا كانت الروح صالحة فستستخدم الجسد و العقل لفعل الصالح و الصحيح دائما ... ما يبحث عنه هؤلاء الشباب و الشابات ليس الشريك الروحي بل يبحثون عن السر الذي منعتهم التقاليد من معرفته ... فبدل من البحث في الكتب قرروا الدخول إلى التجربة العملية مباشرة باختبار مشاعر لم يقدروا أثرها قبل وقوعها ... الكبت دائما يولد الانفجار ... و الله المستعان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134557/http://www.20at.com/article2.php?sid=190"

