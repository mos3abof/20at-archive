subject = "اوافق بشروط"
author = "أرجوان"
posted = "2006-01-05"
text = "الزواج عن طريق الانترنت سواء اكان فى مواضيع البحث عن شريك او كونه تعارف اثناء عمل معين على الانترنت كلاهما لا ضير منه ابدا....و لكن هناك حدود و ضوابط تقيد هذا التعارف...اولا يجب ان يكون الكلام بينهما غايه فى الاحترام و لا يخرج عن حدود الشرع و الدين<br />ثم يكون التلميح او التصريح من قبل الراغب فى الزواج...كان الفتى ام الفتاه عندها هذا موضوع اخر..<br />و اذا وجد القبول يكون التقدم الرسمى من الباب غير ذلك...لا يجوز<br />الزواج عبر الانترنت يجب ان يتممه الالتقاء على الارض و بمعرفة الاهل و الا ما كان ليتم فى مجره الصحيح<br />و مافيش حاجه اسمها الزواج على النت.<br />فى فرق بين من على و على بس<br />و الله اعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134557/http://www.20at.com/article2.php?sid=190"

