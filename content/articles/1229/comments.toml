author = "المهندس/ محمد عبدالله"
posted = "2006-01-08"
text = "ليس كل ماتراه حقيقى ولا كل ماتسمع<br />أحب اوضح شىء مهم الى كل الشباب<br />من لا يتعلم من تجارب الأخرين فى الحياه ليس له الحق أن يعيش بمعنى أنه يجب على كل شاب وفتاه التفكير جيدًا ًقبل الدخول فى المسائل المتعلقة بالحياه الزوجيه لان ببساطه الزواج شىء مهم ومقدس ويجب علينا جميعا أن نحترم هذا الأرتباط المقدس<br />والزواج عن طريق الانترنت ليس بشىء بجديد على العصر الذى نعيشه فيجب علينا أن نوظف التكنولوجيا الحديثه فيما هو يوفيد الفرد ولا يضره ويجب أيضا التمسك بالقواعد الدينيه التى نص عليها كل دين فالزواج شىء مقدس فى كل الاديان السماويه وبالنسبه للأسلام بشكل خاص فقد فرض الله سبحانه وتعالى لنا قوانين وقواعديجب ان نلتزم بها ومن هنا اوضح انه يجب على كل شاب وفتاه او سيده ورجل اذا ارادو الزواج عن طريق الانترنت فيجب تحكيم ضمائرهم وعقلهم ولا ينسوا انهم مرقبون من الله سبحانه وتعالى والكل يعلم انه لا احد يراك ولكن الله يراك دائما فالغش والتضليل شىء اعتاده الانسان ان يراه على الانترنت<br />وفى الختام ارجو من الله أن يوفقكم جميعا الى مايحب ويرضى<br />المهندس/ محمد عبدالله القاهره مصر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134557/http://www.20at.com/article2.php?sid=190"

