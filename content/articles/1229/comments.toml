order = 0
subject = "هبهوب"
author = "هبهوب"
posted = "2006-01-03"
text = "تصدقوا بالله انا كنت تحسه ان دا حيبقي موضوع عشرنات الجي احساس بقي المهم انا مش مع ومش ضد بمعني ان يكون في طرف تالت مش الهبل اللي فوق دا انا عن نفسي اتعرفت علي شاب من خلال النت برده وحصلت تعارف وكدا بس مشفش صورتي وكان بعلم امي وكدا وابويا كمان بعد فتره اتقدم وكدا وحصل قبول الحمد لله واتخطبت ودا استثناء يعني بس المهم ان الواحد مانجرفش مع عواطفه وكل حاجه تبقي علي الواقع مش مجرد اوهام علي الشات ثانيا محدش بيتجوز مرات غيره ثالثا والله اعلم كدا انا شفت الصوره اللي فوق دي في موقع اسلام اون لاين عن الخيانه الاكترونيه تقريبا سلامي ودعواتكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134557/http://www.20at.com/article2.php?sid=190"

[[comments]]
order = 1
subject = "ايه المسخرة دي"
author = "بالذمه ايه المسخرة دي . يعني مالقتوش غير واحده (.....)تسألوها عن زواج الانترنت لأ و هي بمنتهى التبلد تحكيلكوا عن المصايب اللي هي عملتها مع ذلك الشيطان . اللهم اهدي شباب المسلمين و احفظ فروجهم"
posted = "2006-01-04"
text = "يا جماعة الزواج هو الزواج لابد أن يكون في النور أما غير ذلك فيكون مصدر تعاسة للطرفين باقي حياتهم كفاية ان البنت دي هتقول لولادها بعد كده أنا عرفت باباكو عن طريق النت و كنت بدور على عريس فلقيته قدامي . لازم البنت ماترخصش نفسها لهذه الدرجة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134557/http://www.20at.com/article2.php?sid=190"

[[comments]]
order = 2
subject = "عالم ***"
author = "الشمحطجى"
posted = "2006-01-04"
text = "مش عارف حسيت لامؤخزة انى عايز اطرش بعد ما قريت البتاع الى فوق ده ..<br />زائد كمان الحالات دى حالات قليلة و متستهلش ان حد يكتب عنها ولا أنتو خلاص فلستو ومعندكوش غير لامؤخزة المواضيع الــ*** دى ..<br />و الاسامى الى انتو كاتبنها ده ...على فكرة انا أعرف واحدة اسمها رضوى سمير ...يعنى لو كنت واحد لاسمح الله بطال كنت ظنيت فيها ظن مش ولابد...بلاش اسامى وخلوها حروف...<br />والشاب ولا الشابة الى اسمه هبهوب ولا مش عارف هباب ده ...إيه ( كده ) دى إلى معلق عليها فى كلامك ... شكلك كده شاب \"ولامؤخزة \",,,<br />حاجة نيلة الله يخرب بيتوكو هتجبولى دوالى !!<br />*** تم تعديلها من قبل إدارة الموقع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134557/http://www.20at.com/article2.php?sid=190"

