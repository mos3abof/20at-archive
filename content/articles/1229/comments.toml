[[comments]]
order = 35
subject = "مشاركه عن الزواج عن طريق النت"
author = "المهاجر"
posted = "2006-07-19"
text = "المشكله ياقلبو مو بطريقه الزواج عن طريق النت مو اهني المشكله في عقليتنا-العقل الخليجي اللي ينظر الي انه ماكو زواج ناجح يتم عن طريق النت والك ياقلبو مو مهم تحكم علي تجارب غيرك من الناس اللي فشلو طبعا لان اهدافهم من اول مو هو الزواج<br />-كان هدفهم التسلي وبس التعرف علي علاقات<br />-اكو ناس نجحو في الزواج عن طريق النت<br />-اغلب الناس والكثير بعد الزواج شو ينطرهم طبعا الزوج راح يشك في زوجته لانه تعرف عليها عن طريق النت<br />وهو بداخله يقول يمكن زوجته تتعرف علي نااااااس واااااااااايد<br />هذي عقليه المواطن العربي<br />وانا اشوف انها مو ناجحه<br />مثل مايتم عن طريق التعارف المباشر الي راح يكون مصيره هو الزواج الناجح اللي يتم عنهالمعرفه بالطرفين<br />وعساااااااااااكم علي القوه<br />المهاجر-السعوديه<br />هلااااااااااااااااااااا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134557/http://www.20at.com/article2.php?sid=190"

