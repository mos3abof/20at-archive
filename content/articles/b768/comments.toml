subject = "؟؟؟؟"
author = "مغربية"
posted = "2006-05-04"
text = "نحنا بنتعرض بالفعل لازمات بالذاف<br />ولكن مالذى يفرق بيننا وبينكن<br />هذا هو الفرق<br />وهو اننا بنصير اقوى<br />علاش ؟ لاننا بنعرف كيف نستغل كل شىء<br />وعنا حرية بالذاف نالنا تعقيدات قهرية نمارسها متلكن<br />لان تعقيداتكن هى التى ادت بكم للارهاب<br />واصبح العالم يتعجب عن ابناء مصر هم نفسهم اصحاب التفجيرات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134609/http://www.20at.com/article2.php?sid=768"

[[comments]]
order = 1
subject = "نعم"
author = "وانا فلسطينى"
posted = "2006-05-04"
text = "نعم انا فلسطينى ولكنى عم باؤكد كلام المغربية<br />لاننا كتير عنا بطالة<br />لكن عنا عقل وعنا دين مانحوز عنة ما متلكن<br />لاننا كلما ذادت البطالة شو بنعمل ؟اى شى<br />لكننا لاااااا نصبح ارهابيين امثالكم وما فعلتموة يااللة ببلادكن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134609/http://www.20at.com/article2.php?sid=768"

