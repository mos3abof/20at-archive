[[comments]]
order = 9
subject = "لييييييييييييييه؟؟؟؟؟؟؟؟؟؟؟"
author = "نيفين"
posted = "2006-05-06"
text = "اقولها بكل حزن<br />التعليقات تنرفززززززززززززز<br />ليه كل واحد بيحب يشتم ف بلد غيره<br />يا ريت نعلق ف صميم الموضوع و ما ناخدهاش فرصه للشتيمه<br />بالنسبه للموضوع جيد و انا شايفه ان السبب ف البطاله على الاقل ف مصر بالدرجه الاولى الكثافه السكانيه حيث الخريجين بالعدد الهائل و عدم استيعاب سوق العمل للعدد<br />كمان رغبه كل شخص العمل فى مجاله<br />كمان النظره الاجتماعيه من المجتمع للخريجين من حمله الشهادات العليا حين يعملون بمهن اقل قدرا(دا غير البطاله المقنعه اللى كلنا عارفينها)<br />الاسباب كتييير<br />تعددت الاسباب و البطاله واحده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134609/http://www.20at.com/article2.php?sid=768"

[[comments]]
order = 10
subject = "الله الموفق"
author = "مواطن عربي"
posted = "2006-05-06"
text = "إخواني إننا في العالم العربي لا نعاني من البطالة فحسب فحتى صمعتنا في العالم أصبحت دون مستوى ونسينا أن ما صنع مجدنا وأمتنا هم أناس كانو يعيشون في أدنى مستويات الحياة (لأن كانت نفسهم غنية وعقلهم راجح, ما دفعني للكتابة هو ما رأيته من تعليقات, كل شخص يطبق مثال : من رأى بلوة غيره هانت عليه بلوته.<br />يا إخواني إن الرسول عليه الصلاة والسلام أشرف المخلوقين عايش أشد الظروف لكنه كان يستخدم عقله ويفوز بعقله.<br />أما نحن اليوم (العرب) فإننا لسنا بمسلمين لأننا لا نصبر أي لا نصبر على الأمر بالمعروف والنهي عن المنكر. نعم هذه هي صورتنا أو مكانتنا السلبية أمام أنفسنا وأمام الآخرين. متى سنصرخ لنغير ؟ متى سنطبق ما نقول ؟<br />قد أصبح حرفي في مهنة صغيرة وغريبة عني ولكن أين هي أخلاقي. \"إنما بعث لأتمم مكارم الأخلاق\"<br />لكل إنسان يعتقد نفسه بعيد عن مجال عمله (بسبب الديموقراطية المغشوشة أو السياسة الفاشلة للدولة) فمن الأفضل محاربة الرشوة والفساد بأن أكون مثال لنفسي (أن أحفظ نفسي أولا من هذه الأمراض الإجتماعية) على الأقل أن أضمن واحدا صالحا ألا وهو نفسي.<br />يا إخواني لا تغفلوا في صلاتكم وادعوا لصلاح هذه الأمة وكونوا مثالا لما تقولون, ولا تخسروا الدنيا بالتألم على الواقع الحاضر فسيتغير الموقف يوما ما ولكن هل سنكون مستعدين حينها؟ فيجب علينا أن نتخلق ونضبط سلوكنا ومعاملتنا رغم كل ما يحدث لأننا نحب الحياة ولا نسعا لتدميرها بارتكاب أنواع الفساد.<br />والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134609/http://www.20at.com/article2.php?sid=768"

