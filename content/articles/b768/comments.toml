subject = "ملاحظة ليست في محلها"
author = "هشام من المغرب"
posted = "2006-05-04"
text = "السلام عليكم<br />و أنا أقرأ تعليقات زوار الموقع يحضرني المثل المغربي الدارج :\"المذبوحة كتضحك على المسلوخة\" في إشارة إلى بعض الزوار الذين يدعون أن بلدانهم أحسن حالا من بعض الدول العربية, و الواقع أن العكس هو الصحيح ... السائد في كل وطننا العربي و الإسلامي هو البطالة و القهر و الظلم الإجتماعي و الكذب السياسي و و ..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134609/http://www.20at.com/article2.php?sid=768"

[[comments]]
order = 4
subject = "لا تلاوموا"
author = "مسلم"
posted = "2006-05-05"
text = "يا شباب أمة محمد -صلى الله عليه وسلم - بدلا من أن يلوم بعضكم بعضا ، ويفخر بعضكم على بعض في مستوى الذل ، والمهانة<br />بدلا من ذلك ، فليسقط كل بلد طاغوته ، ولنقم دولة الشريعة التي يتفيأ ظلالها كل مسلم ، من الخليج الى المحيط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134609/http://www.20at.com/article2.php?sid=768"

[[comments]]
order = 5
subject = "تصحيح"
author = "سالمة"
posted = "2006-05-05"
text = "لا واللة ياشبابا المغرب<br />انا مغربية اعيش بالمغرب<br />واعرف بالذاف مقدار حريتنا اذا ماقورنت بالعرب الاخرين نحنا بالذاف اكتر حرية وديمقراطية عن اولائك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134609/http://www.20at.com/article2.php?sid=768"

[[comments]]
order = 6
subject = "\"ديموقراطيات\" تحت الصفر"
author = "مرحبا من جديد"
posted = "2006-05-05"
text = "قد يكون هناك تباين بين مستويات الإستبداد من بلد عربي لآخر لكن الثابت هو انها جميعها تمثيليات ل\"ديموقراطيات\" تحت الصفر<br />ملاحظة: يمكن للأخت سالمة أن تتحدث الدارجة المغربية إذا تعذر عليها الحديث باللغة العربية الفصحى بدلا من تلك الاشياء الركيكة التي تتفوه بها فإخواننا في المشرق العربي لم يعد لديهم مشكل مع الدارجة المغربية<br />شكرا لكم جميعا<br />هشام من الدارالبيضاء<br />المغرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134609/http://www.20at.com/article2.php?sid=768"

[[comments]]
order = 7
subject = "فكرة المقال جميلة"
author = "عبد الله"
posted = "2006-05-06"
text = "السلام عليكم.<br />هذه التعليقات الكثيرة حول مقال الاستاذ حسن السوسي من المغرب اكثرها يتحدث عن تفريعات تعليق الاخت المغربية..ولكن يجب التذكبذير ان الموضوع فعلا جميل يستحق كل هذا الكلام وهذه التعليقات..الصياغة جيدة والافكار جميلة والواقع هو ماحكاه الاخ الحبيب من المغرب..فلا نستغرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134609/http://www.20at.com/article2.php?sid=768"

