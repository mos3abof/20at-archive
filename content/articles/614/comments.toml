[[comments]]
order = 0
subject = "اصدقائي في الكفاح"
author = "أكرم بس"
posted = "2006-01-22"
text = "انا بعتبر دول اصدقائي في الكفاح لأني ساعات كنت ايام الدراسه بحلم ان اسمة بن لادن يقوم بعملية جامدة و يضرب مبنى التشييد بكلية الهندسة ( كليتي سابقا ) و يبقى ريحنا شوية من الضغط العصبي و النفسي<br />و يبقى الواحد يعوضهم و يعمل عشرة ضغط<br />بس بصراحه كنت بحلم بس و عمري ما فكرت أكون ايجابي زي اصحابنا دول<br />الواحد مش عارف يودي وشوا فين من الناس<br />سلبية كده في كل حاجة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112923/http://www.20at.com/article2.php?sid=310"

[[comments]]
order = 1
subject = "لا اله الا الله"
author = "عمر"
posted = "2006-01-23"
text = "والله العظيم دى كارثة فظيعة<br />لما المعلم يقف فى الفصل ولا يأمن على نفسه , يبقى ازاى هيقدر يربى هذه الاجيال ؟؟؟احنا بقه عندنا تلاقى بيت الشعر بقه \" قم للمعلم ووفه التلطيشا .... كاد المعلم ان يكون شاويشا .\" للاسف الشديد<br />لن تكون هناك نهضة طالما ان المدارس بهذا الشكل ...<br />ماليزيا عندما يبدأت مشوار النهضة بدأه مهاتير محمد من المدارس وكانت اكبر موازنة هى تلك التى تخصص للمدارس وليس لامن الدولة<br />انتوا عارفين الفساد المستشرى فى البلد ده ؟؟؟<br />فى مثل ظريف بيقول ايه<br />لما فريق الكورة واحد فيه مبيعرفش يلعب او مستواه قل ... يتغير صح ؟؟؟<br />انما لو الفريق كله مستواه قل .. ايه الى يحصل ؟؟؟ المدير الفنى يتغير على طول<br />وكذلك الحال فى بلدى<br />ودمتم سالمين باذن الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112923/http://www.20at.com/article2.php?sid=310"

[[comments]]
order = 2
subject = "برافو"
author = "هذا الحادث ينم عن ايجابيات كثيرة فى اطفال اليوم انهم بكل بساطة رفضوا الظلم وهذا تصرف يحسب لهم لا عليهم واتمنى ان يكون لدينا فى مصر اجيال بهذا الوعى وهذا القدر من الاحساس بالكرامة"
posted = "2006-01-23"
text = "وكفاكم ترديد تلك العبارات البلهاء التى لامعنى لها<br />فمنذ متى ويوجد \"تعليم\" فى المدارس لكى يحترم الاطفال هذا الشخص الاهطل المسمى مجازا\"المعلم\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112923/http://www.20at.com/article2.php?sid=310"

[[comments]]
order = 3
subject = "مش عارف ابدأ منين"
author = "معلم بيخاف على اولاده الطلاب"
posted = "2006-01-23"
text = "أكيد أن هؤلاء الطلاب دخلوا الى المدرسة بالخطأ وكان لازم يروحوا مكان ثاني .<br />مش معقول نبرر ليهم الفعل ده انهم يمكن مظلومين ولا الأستاذ معاملته ليهم مش كويسة على كذه مش حيبقى مبنى حكومي ولا جامعة ولا مدرسةولا مستشفى كلها حتتفجر او تتهدم والسبب طالب لو مراجع لو مريض مستاء من المعاملة.<br />ارجوكم يااخوانا ما تبرروش الهمجية والعدوانية على انها شئ طيب وجرأة وشجاعة ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112923/http://www.20at.com/article2.php?sid=310"

[[comments]]
order = 4
subject = "المربى الفاضل"
author = "أٍكرم بس"
posted = "2006-01-23"
text = "و الله يا أستاذ\" معلم \" المشكلة ان المعلم مش معلم في هذا الزمن<br />أحنا عايزين مظمة متكاملة للتعليم<br />لو سيادتك شفت فيلم 6 دقايق اللي فاز بالجايزة الاولى في مهرجان الجزيرة كنت عرفت احنا وصلنا فين و على العموم الفيلم عندي للي عايز يتعرف على حال الوطن العربي الكبير من المحيط الى الخليج<br />يا جماعه على رأي عمنا أمل دنقل<br />أيها الساده لم يبق اختيار<br />سقط المهر من الاعياء و انحلت سيور العربه<br />ضاقت الدائرة السوداء حول الرقبه<br />صدرنا يلمسه السيف و في الخلف الجدار<br />أيها السادة لم يبق انتظار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112923/http://www.20at.com/article2.php?sid=310"

[[comments]]
order = 5
subject = "مين أمل دنقل ده ؟؟"
author = "أكرم بس"
posted = "2006-01-23"
text = "انا مش عايز حد يحرق دمي و يقولي مين أمل دنقل ده ؟؟<br />على العموم هو اللي قال<br />قلت لكم مرارا<br />إن الطوابير التي تمر<br />في استعراض عيد الفطر و الجلاء<br />( فتهتف النساء في النوافذ انبهارا )<br />لا تصنع انتصارا<br />ان المدافع التي تصطف في الحدود في الصحاري<br />لا تطلق النيران الا حين تستدير للوراء<br />ان الرصاصة التي ندفع فيها ثمن الكسرة و الدواء<br />لا تقتل الاعداء<br />لكنها تقتلنا اذا رفعنا صوتنا جهارا<br />تقتلنا و تقتل الصغارا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112923/http://www.20at.com/article2.php?sid=310"

[[comments]]
order = 6
subject = "ليه يا اكرم بس"
author = "نيفين"
posted = "2006-01-24"
text = "ليه بتفتح الجروح و تفكرنا بامل دنقل<br />امل دتقل يا جماعه اللى لخص القضيه ف كمه و قال لا تصالح<br />و قاسم الشابى قال برده<br />اذا ااشعب يوما اراد الحياه فلابد ان يستجيب القدر<br />و لابد ليل ان ينجلى و لابد للقيد ان ينكسر<br />و اهم الاطفال بدأو و عملو اللى كبار كتير معملوهوش بصرف النظر غلط و لا صح<br />اوعو حد يقوللى ميت ابو القاسم الشابى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112923/http://www.20at.com/article2.php?sid=310"
