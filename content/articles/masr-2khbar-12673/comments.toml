[[comments]]
order = 3
subject = ""
author = "المزز الحلوة دى"
posted = "2009-07-17"
text = "المزز الحلوة دى ترشح نفسها فى مجلس النسوان ( الشعب سابقا ) ويطالبوا بتغيير القوانين دى ويحطوا استجواب لوزير السياحة ويرفعوا توصية انة يسمح للمنقبات بدخول حمامات السباحة بشرط ان تكون المياة طاهرة ويمنع بتوع البكينى اللى بيعملوها على نفسهم فى المية وينجسوها<br />كما يجب ان لا يسمح للمستحمة بدخول الحمام الا ومعها صابونة نابولسى بتزحلق جامد"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718175032/http://www.20at.com:80/masr/2khbar/12673-2009-07-16-09-14-38.html"

[[comments]]
order = 4
subject = ""
author = "بنت مصرية ف الإمارات"
posted = "2009-07-17"
text = "يا جماعة يعني مش آخر الدنيا إن مصر تكون منعت لبس الحجاب في المسابح<br />ممكن يكون اللي وضع القانون مسيحي أصلا<br />أو ممكن يكون جاهل وده بيحصل كتير<br />الحل المظبوط إن السفير يتفاهم في الموضوع<br />والمفروض يتم حماية الحرية الشخصية للمواطنين قبل الناس الوافدين<br />لازم يكبروا الشعب قدام الأجانب لأن أصلا الأجانب بيجروا عالبلاد اللي شعبها في هدوء وراحة لأن فكرهم أكيد ما دام الشعب مرتاح يبقى أكيد هما كمان هيرتاحو<br />أسهل القوانين تبقى مصر قوانين واحدة متتغيرش ومتتبدلش على حسب النوع والملة<br />بس هنقول إيه بقا<br />ربنا يهديهم أولياء الأمور"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718175032/http://www.20at.com:80/masr/2khbar/12673-2009-07-16-09-14-38.html"

