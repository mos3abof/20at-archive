author = "فنادق للدعارة فقط"
posted = "2009-07-16"
text = "محجبة رايحة الفندق لية<br />السياحة المصرية بتعطى ترخيص لبتوع البكينى والدعارة للروسيات والاكرونيات والاسرائيليات<br />هى دى اصول السياحة<br />وفن السياحة<br />حاجة كدة مبنية على النجاسة والوساخة والقرف مهما حاولوا يجملوها<br />يا بنتى روحى شوفى شاطىء شعبى واستحمى فية بهدومك وابعدى عن الشراميط"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718175032/http://www.20at.com:80/masr/2khbar/12673-2009-07-16-09-14-38.html"

