subject = ""
author = "الى كاتب الخبر"
posted = "2009-07-18"
text = "الى كاتب الخبر<br />فى ذمتك فية سباحة شرعية وسباحة غير شرعية ما هى كلها سباحة<br />ولكن فية واحدة بتسبح بلبس محتشم وبتحترم كرامتها وفية واحدة** بتستحم عريانة ملط وبتفرج الناس على مفاتنها ان كان لها مفاتن<br />ابقوا دققوا شوية فى الالفاظ<br />جتكم نيلة عالم هم"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718175032/http://www.20at.com:80/masr/2khbar/12673-2009-07-16-09-14-38.html"
