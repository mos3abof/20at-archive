subject = "حكيت مع أحفاد أحفادهم"
author = "S Libya"
posted = "2006-10-08"
text = "أحب اشكره على هذا الموضوع الجيد<br />كان في فيلم يحكي على مأستهم على أعتقد<br />يسمى الجدور<br />أنا في ليبيا وجد العديد منهم هنا في ليبيا<br />أقصد أحفاد نيجيريا ... زي ما مجموعات كبيرة منهم تأتي إلى ليبيا من أجل العبور إلى أوربل للوصول إلى إيطاليا<br />لأن ليبيا ساحلها طويل وصعب السيطرة الكاملة عليها<br />ما أطول عليك<br />أحكي مرات مع هؤلاء الافارقة .. لما يحكوا على اوروبا يحكوا عليها كأنها الجنة<br />يعني ما عندهمش مشكلة يرموا في روحم في البحر ومرات تكون رحلة اللااااااااا عودة<br />يعني مخهم مغسول بتايدا أكستر<br />قوي على الدماغ<br />وما يعمل أوجاع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132954/http://www.20at.com/article2.php?sid=1318"
