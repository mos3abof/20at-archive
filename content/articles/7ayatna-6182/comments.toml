posted = "2008-07-30"
text = "\"أخي محمد…<br />وصفكـ عن علاقتكـ بوسااآآادتكـ… جعلني ألتفت إلى وساداآاتي ~ الأربعة ~ …<br />لأقول:<br />عذراً وساداآاتي…عندما يطول منامي على إحداكم ثم أرمي بها لألتقط الأخرى حتى أنعم ببرودتها …<br />لكل من خشي على أسراره التي أفشاها قبل منامه…<br />لا تخف من بوح وسادتك…!<br />فهي لن تبوح…"
