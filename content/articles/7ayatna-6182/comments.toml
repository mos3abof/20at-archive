posted = "2007-06-14"
text = "عندك حق يا ديمه(ازيك وفينك وحشانى) و اسمحلى يا استاذ عجم اضيف على يخرب بيت الجمال يخرب بيت الافكار اللى ممكن تعمل من شىء عادى عمل ابداعى غير عادى<br />يا سلام على المخده<br />فعلا صديقه و رفيقه<br />مكانتش فيروز قالت :و هديتنى ورده<br />فرجيتا لصحابى<br />خبيتا بكتابى<br />زرعتا عا لمخده"
archived = "2009-05-02"
