posted = "2009-12-21"
text = "اولا استنتاجك عن محفوظ والعلم مغلوط وخاطىء لان نجيب محفوظ دارس فلسفة ولا يعرف شيئا عن العلم<br />ثانيا قصة اولاد حارتنا ضعيفة جدا فنيا وفقيرة وكان الكاتب فى حالة جدب وفقر خيالى فلجأ الى سرقة القصص الدينية بدون ان يقصد المعنى لاسقاطها على اولاد الحارة وكانة اتى بجديد او كتب رواية وهو حرامى غير الاسماء فقط<br />وبعدين القصة خايبة وهايفة جدا ولكن التاويلات هى التى شهرتها<br />وهى ليست عمل فنى راقى او خلاق بل عمل سردى ممل يشعر القارىء انة يعرف تلك القصة من قبل<br />ثم ما فائدة تلك القصص اصلا وهى ليست بلاغة ولا اخلاق ولا تطعم جائع ولا تنتج خبزا<br />وارى ان الذى يقرا تلك الروايات واحد فاضى بيضيع وقتة فيما لا فائدة منة"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223142101/http://www.20at.com:80/masr/egyptian-blogs/14497-2009-12-21-13-52-16.html"

