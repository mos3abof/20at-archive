author = "ممدوح زكى زخارى جرجس"
posted = "2009-12-26"
text = "اقتباس زخارى محامى ارزقى:<br />يا جماعة انتم عاملين اعتبار لحتة محامى ارزقى فارش ترابيزة على الرصيف قدام محمكة المنشية وبيلقط رزقة من كتابة عرضحال وبيع ورق دمغة وبيسرح مراتة بالليل على الكورنيش على شاطىء كيلوباترة حمامات - طيب يا زخارى لية العذرا ما ظهرتش فى كنايس اسكندرية فى كيلوباترة والا الابراهيمية<br />يا جماعة الموضوع دة كان معمول لغرض انة يغطى على مرض ابونا شنودة<br />اللى صحيح يا زخارى هى العدرا ما بتعالج شنودة لية بدل كل شوية ما بيجرى على امريكا - خللى العدرا تظهر فى كتدرائية العباسية وتملس على شنودة يقوم يخف بسرعة<br />مرحبا بسماحة الاسلام اللى بيسمح لكم بسب اهل الكتاب؟<br />موش رسولك قال\"من سب زمى فقد سبنى\"؟<br />أعملوا بكلام رسولكم يا \"متأسلمين\"؟"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127082116/http://www.20at.com:80/masr/105-msa7t-r2y/14497-2009-12-21-13-52-16.html"

