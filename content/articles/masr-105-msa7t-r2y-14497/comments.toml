text = "اقتباس حمرا يا زخاري:<br />لم نقتل<br />و لم نسرق<br />و لم نزور<br />و لم نسرق اموال البنوك<br />و لم نسرق اراضى مصر<br />و لم نصدر البترول الى اسرائيل<br />و لم و لم و لم<br />ولم نقتل رئيس الجمهورية<br />و لم نقوم باعمال ارهابية<br />و هذا شرف لى و أفتخر بة<br />لكن بتحبوا اليهود وبتساعدوهم اللي قالوا ان مريم زنت وخلفت المسيح<br />والقران برءها من ذلك<br />مع أحترامى لكم؟<br />هل القران هو محكمة نقض؟<br />و اللة أسرائيل رغم عنصريتها الا أنهم لديهم من الاخلاقيات اللى أنتم فعلا ناقصاكم؟<br />و على كل حال بصراحة انا احترم اليهود أكثر مما أنا أحترمكم؟<br />لانكم أمة تفتقدون الى الاخلاق ؟"
