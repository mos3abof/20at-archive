subject = ""
author = "زخارى محامى ارزقى"
posted = "2009-12-25"
text = "يا جماعة انتم عاملين اعتبار لحتة محامى ارزقى فارش ترابيزة على الرصيف قدام محمكة المنشية وبيلقط رزقة من كتابة عرضحال وبيع ورق دمغة وبيسرح مراتة بالليل على الكورنيش على شاطىء كيلوباترة حمامات - طيب يا زخارى لية العذرا ما ظهرتش فى كنايس اسكندرية فى كيلوباترة والا الابراهيمية<br />يا جماعة الموضوع دة كان معمول لغرض انة يغطى على مرض ابونا شنودة<br />اللى صحيح يا زخارى هى العدرا ما بتعالج شنودة لية بدل كل شوية ما بيجرى على امريكا - خللى العدرا تظهر فى كتدرائية العباسية وتملس على شنودة يقوم يخف بسرعة"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127082116/http://www.20at.com:80/masr/105-msa7t-r2y/14497-2009-12-21-13-52-16.html"

[[comments]]
order = 12
subject = ""
author = "حمرا يا زخاري"
posted = "2009-12-25"
text = "لم نقتل<br />و لم نسرق<br />و لم نزور<br />و لم نسرق اموال البنوك<br />و لم نسرق اراضى مصر<br />و لم نصدر البترول الى اسرائيل<br />و لم و لم و لم<br />ولم نقتل رئيس الجمهورية<br />و لم نقوم باعمال ارهابية<br />و هذا شرف لى و أفتخر بة<br />لكن بتحبوا اليهود وبتساعدوهم اللي قالوا ان مريم زنت وخلفت المسيح<br />والقران برءها من ذلك"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127082116/http://www.20at.com:80/masr/105-msa7t-r2y/14497-2009-12-21-13-52-16.html"

