[[comments]]
order = 9
subject = ""
author = "حذار من تضييع الوقت"
posted = "2009-12-24"
text = "كثرة القراءة فى امور الفلسفة ودراستها لا جدوى منها<br />القراءة فى امور تنفع الناس<br />انا راييى الشخصى انك لو قرات كتاب مثلا عن كيف تعمل الثلاجة المنزلية او كيف يعمل التليفزيون ستستفيد الف مرة من قراءة شوية تخيلات لكاتب بيضيع وقت الناس<br />ماذا ستستفيد من اولاد حارتنا او اولاد جزمتنا ؟<br />لا شىء<br />اقرا كتاب كيف تصبغ جدران منزلك والبويات والالوان<br />اقرا كيف تصنع صندل لطفلك الصغير<br />اقرا عن البوتاجاز او الطباخة المنزلية وكيف تنظف الفنية وتصلح الحنفية وتغير الجلدة<br />المهارات الفنية التى كانت تدرس فى المدارس وتم الغائها مع ما دعى تطوير التعليم<br />اقرأوا عن تحلية مياة البحر واستخدام الطاقة الشمسية<br />نجيب محفوظ اية<br />وبدنجان اية<br />اقرأوا العلم النافع للناس<br />اقراوا احكام الميراث فى الاسلام واعرف كيف توزع الورثة بين الابناء<br />اقراوا شخصيات الاسلام عمر بن الخطاب وعلى بن طالب وخالد بن الوليد<br />اقراوا تاريخ مصر<br />كيف تم بناء الازهر<br />وكيف تم بناء الهرم<br />كيف نحج الى بيت اللة وما هى الشعائر<br />نجيب زفت محفوظ اية واولاد حارتنا اية<br />اخية<br />الحاج هريدى الصعيدى"
archived = "2009-12-25"
capture_url = "https://web.archive.org/web/20091225135719/http://www.20at.com:80/masr/105-msa7t-r2y/14497-2009-12-21-13-52-16.html"

[[comments]]
order = 10
subject = ""
author = "كثرة القراءه"
posted = "2009-12-24"
text = "كثرة القراءة بتخلي المخ يفك<br />على سبيل المثال جمال البنا اخو حسن البنا عنده افكار غريبة بسبب كثرة القراءة<br />عبدالصبور شاهين مرة طلع وقال ان سيدنا ادم ابن البشر وليس ابو البشر<br />ودا برضه بسبب القراءة الطويله والعميقه<br />ومصطفى محمود من كتر القراءة الحد بس الحمد لله رجع تاني<br />ونجيب محفوظ من كتر القراءة مخه فك"
archived = "2009-12-25"
capture_url = "https://web.archive.org/web/20091225135719/http://www.20at.com:80/masr/105-msa7t-r2y/14497-2009-12-21-13-52-16.html"

[[comments]]
