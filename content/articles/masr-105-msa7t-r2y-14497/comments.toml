subject = ""
author = "فى شبرا والوراق"
posted = "2009-12-27"
text = "يا زخارى فية حاجة مش مقبولة ولا مفهومة لطفل فى ابتدائى<br />انا شفت الالاف واقفين فى الوراق قدام الكنيسة بيشوفوا العدرا<br />وفى نفس الوقت كان فية الاف تانية بتشوف العدرا فى كنيسة شبرا<br />هو فية كام عدرا علشان تظهر فى وقت واحد وفى اكثر من مكان<br />يعنى ممكن العدرا تظهر فى الوراق وفى نفس الوقت تظهر فى شبرا - ازاى بقى يا زخارى<br />العملية تبقى تهيؤات بقى لانة فى الاصل يوجد عدرا واحدة ممكن تظهر فى مكان واحد فى وقت واحد انما مكانين فهذة مش مبلوعة ابدا يا متر"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127082116/http://www.20at.com:80/masr/105-msa7t-r2y/14497-2009-12-21-13-52-16.html"

