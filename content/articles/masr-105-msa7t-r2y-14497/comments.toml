text = "معذرة للاخ عبد الرحمن مجدى الكاتب فى ان التعليقات انحرفت الى الغيبيات ومشاهدة الاشباح والتهيؤات واللى بيشوف ابو رجل مسلوخة واللى بيشوف السلعوة وابو سحتوت ولكن لقصة اولاد حارتنا علاقة برضة<br />ففية حاجات كتير غير قابلة للتصديق والامر التبس عند نجيب محفوظ زى المعجزات فعلق عليها بطريقتة زى ما احنا بنعلق على موضوع ظهور العذراء دلوقتى"
