subject = ""
author = "اعترافات زخاري"
posted = "2009-12-23"
text = "الاسم: ممدوح زكى زخارى<br />العنوان: حقا انه رجل محترم أما انأ فخطير على الأمن القومي المصري كما تدعى على كذبا وزارة داخلية مصر<br />ليتنى كنت ممدوح اسماعيل و ليس ممدوح زكى زخارى المصرى الذى منعت من السفر خارج مصر من 11 مايو 1992 و حتى و قتنا هذا انتقاما منى بسبب زيارتى الى دولة إسرائيل لغرض العلاج الطبى الغير متوفر فى مصر و كل الدول العربية و أيضا قيامي بأداء مراسم التقديس بالقدس لكوني مسيحي مصري؟ يشرفنى حقا ان يكون لى شرف التعرف بالشخصية الهامة التى ساعدت على اخراج السيد ممدوح اسماعيل خارج مصر من صالة كبار الزوار ليخرجنى انا كمان؟ مستعد لدفع مليون دولار امريكى لاى شخص يساعدنى على الخروج خارج مصر و ليعتبرنى ممدوح اسماعيل ولست ممدوح زكى زخارى جرجس المصرى المسيحى القبطى الشريف و لست القاتل؟"
archived = "2009-12-25"
capture_url = "https://web.archive.org/web/20091225135719/http://www.20at.com:80/masr/105-msa7t-r2y/14497-2009-12-21-13-52-16.html"

