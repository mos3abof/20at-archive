text = "اقتباس زخارى محامى ارزقى:<br />يا جماعة انتم عاملين اعتبار لحتة محامى ارزقى فارش ترابيزة على الرصيف قدام محمكة المنشية وبيلقط رزقة من كتابة عرضحال وبيع ورق دمغة وبيسرح مراتة بالليل على الكورنيش على شاطىء كيلوباترة حمامات - طيب يا زخارى لية العذرا ما ظهرتش فى كنايس اسكندرية فى كيلوباترة والا الابراهيمية<br />يا جماعة الموضوع دة كان معمول لغرض انة يغطى على مرض ابونا شنودة<br />اللى صحيح يا زخارى هى العدرا ما بتعالج شنودة لية بدل كل شوية ما بيجرى على امريكا - خللى العدرا تظهر فى كتدرائية العباسية وتملس على شنودة يقوم يخف بسرعة<br />يأبو جهل؟<br />أنا اولا لست بمحام يا روح ننوس عين امك [ *** ] فى مواخير شقق الطلبة المفروشة؟<br />ثانيا العذراء لا و لن تلوث أيديها الا بالتمليس على رأس امك [ *** ] لتشفيها من مرض \"السودة\" اللى ربنا لعنكم بية؟<br />ثالثا حقا أسرائيل و أمريكا لهم كل الحق فى أزلالكم فى فلسطين و العراق؟<br />ما أحط أخلاقكم المنحطة؟<br />و أحترس من \"الثعبان الاقرع اللى زارع شعر فى طيز أمك المنكوحة بورقة تواليت عرفية ب 25 قرش؟<br />و لا أكثر اللة من الخنازير أمثالكم"
