author = "رد على the خاري"
posted = "2009-12-27"
text = "زخاري قال<br />و على كل حال بصراحة انا احترم اليهود أكثر مما أنا أحترمكم؟<br />لانكم أمة تفتقدون الى الاخلاق ؟<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـ<br />شوف يا زخاري في قضيتين اثبتت ان الدناية المسيحية دي ديانه باطله وليس لها اي اساس من الصحة واسمع كويس الكلمتين اللي حأقولهملك ولكل مسيحي<br />هما نقطتين فقط<br />النقطة الاولى تسليم بريطانيا ارض فلسطين لليهود مع انها مهد الديانه التي جاء بها سيدنا المسيح<br />النقطة الثانية حب المسيحيين لليهود مع انهم اعداء المسيح وثابت عندكم انهم صلبوه وقتلوه وقالوا انه ابن زنا<br />النقطتين دول تدلان دلالة قاطعة ان الديانة المسيحية دي ديانه لا قيمة لها ولا ون لها<br />ويستحسن تشوفلك دين تاني وانت شخصيا لا تؤمن بها وتعليقاتك تدل على ذلك على انك لست في سلام مع نفسك<br />(لطفا يرجى مراجعت تعليقاتك المسيئة للديانة المسيحية والتي تخالف موعظة المسيح على الجبل<br />سلام يا زخاري واتغطى كويس وانت نايم"
