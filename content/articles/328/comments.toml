[[comments]]
order = 1
subject = "بلاد الدنيا"
text = "يا جمال خبر واسع ومبهبط عليك كثير شوفلك كذبه نصدقها *قال حبسوه بس سنتين بتهمة الانتماء الى حركه فتح * هههههههههههههه ليش عندك واسطه قويه مع الشين بيت او الموساد ( غصبالك على ها الكذبه اسى فهمت كيف وصلت للكنيست ههههههههه"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926234608/http://www.20at.com:80/article.php?sid=212"
