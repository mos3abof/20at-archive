subject = "رنين الحب"
text = "بسم الله الرحمن الرحيم<br />بصراحه يا جماعه شىء يشرف هو فعلا عنده حق يارب يكون الكلام ده صادق ومن القلب فعلا حاجه تبقى تفرح بجد<br />رنين"
