[[comments]]
order = 2
subject = "اتعرف يا عم"
author = "الزينى بركات"
posted = "2006-05-07"
text = "حدثنا الشهاب الأعظم زكريا ابن راضى بحسب راوية جمال الغيطانى الزينى بركات بأنه .....<br />شوف يا سيدى اللى انا اعرفه من الوزراء بتعنا كالآتى :-<br />منصور للمواصلات بتاع شيفورليه و مترو مش مترو الانفاق مترو الهايبرماركت<br />الجبلي للصحة و بتاع مستشفى الفؤاد 6 اكتوبر<br />المغربى للأسكان بتاع بنك كاليون و ليه ضلع جامد فى شركات السياحة<br />رشيد للصناعة بتاع شاي ليبتون و رجل اعمال يعجبك جدا<br />و اخيرا لو حد عنده حاجه يقول مايضرش<br />و ملحوظة مهمة يا شباب يا ريت لو حد لاحظ اي اخطاء فى السطور اللى فاتت ينبهنى لو سمحتم<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151522/http://www.20at.com/article2.php?sid=771"

[[comments]]
order = 3
subject = "الي الزيني"
author = "ربيع"
posted = "2006-05-07"
text = "عرفين يا عم ان الحكومه بتضم مجموعه محترمه من رجال الاعمال احنا عايزين صوره ونبذه عنهم<br />لا برضه في دكاتره جامعه وفي رجال شرطه وجيش<br />وغير كده لوانت ماشي علي الصيف وخبطت في واحد وزير وانت متعرفوش او لوانت متشعبط في الاتوبيس او مزنوق في المترو ممكن تكون دايس علي رجل وزير وانت مش واخد بالك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151522/http://www.20at.com/article2.php?sid=771"
