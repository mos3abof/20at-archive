subject = "ممكن"
author = "ربيع"
posted = "2006-05-05"
text = "ممكن لو سمحتم تعرفونا علي وزرائنا<br />بصراحه انا معرفش نص وزراء مصر<br />اعتقد اني مش لوحدي في الموضوع ده<br />ايه رايكم يا شباب"
