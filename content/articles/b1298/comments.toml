subject = "الله علي الحريرة الله"
author = "حليمة"
posted = "2006-10-01"
text = "والله الحريرة المغربيى احلي شيء برمضان ولا ننسي الكسكس لديدوالبريوات والشباكية والدجاج المحمر صراحة الطبخ المغربي سيد المطابخ كلها وانا بحب المغرب واكل المغرب والله يديم علينا النعم يا رب"
