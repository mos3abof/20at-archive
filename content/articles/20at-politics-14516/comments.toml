text = "هما فين بقى اللى وخداهم الحمية والحماس بتوع الكورة<br />ده أحنا لو قلنا مصر هتلعب مع إسرائيل ماتش كرة قدم هيقولوا لأ وإزاى والدنيا تقوم وتقعد<br />ويحصل جدل .<br />لكن أيه يعنى علم إسرائيل على أسوار الأثصي .. هى يعنى أسوار الإستاد ولا أسوار الإستاد<br />دى قلة أدب … من كل المسلمين المخروسين"
