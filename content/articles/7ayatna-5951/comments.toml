text = "الموضوع ده قديم أوي ايه العك ده يا عشرينات ويعنى ايه خبراء الاجتماع اكدوا ؟ فين المصداقية فى كده يعنى فين أسمائهم ولا تخصصاتهم ولا هما اصلا بيشتغلوا فين يعنى دكاترة جامعه ولا فى المركز القومي ولا في خدمه اجتماعيه ؟ انا مش فاهم حاجه بصراحه من الموضوع ده ويعنى ايه واحده هتقول على نفسها ان خطيب صاحبتها بيبصلها طبعا الكلام واضح جدا انه مفبرك وكمان اللى وضح كده انه كاتب اسمها بالكلامل وسنها يعنى حتى ماكتبش اسمها هى بس لا واسم ابوها كمان يا سلام على الفبركه ايه الخنقة دى بصراحه انا بحب الموقع ده اوى بس يا ريت ينضف من الكتابات اللى مالهاش لازمه دى حتى لا تهد عشرينات ما بنته على مدار ثلاثه سنوات . بس خلاص"
archived = "2009-05-02"
capture_url = "https://web.archive.org/web/20090502135622/http://www.20at.com:80/7ayatna/5951.html"
