text = "جمال الموضوع ده يا جماعه فى اهميته لانه بيتكرر كتير اليومين دول<br />مش بس كده ده بيتكرر بالع[ *** ] بمعنى انه كثيرا ما تسعى الصديقه لسرقه خطيب او حبيب صاحبتها بدعوى انه لم تستطيع جعله يحبها<br />و نلاقى الكل بيغنى حبيبى و صاحبتى<br />و الاسم واحد ف جميع الحالات سواء الخطيب ذئب او مل وديع افترسته الصديقه المزيفه و الاسم هو خيانه<br />و العجيب ف الموضوع ان الناس بتعمل ده بشكل طبيعى جدا<br />ف القاهره اليوم من فتره ف فقره اسالو رجاء طرح عمرو فكره تاخدى حبيب صاحبتك لو حاسه انه مش بيحبها<br />طبعا كتير منا هيقول الناس طبعا هترفض و لكن العجيب و البديع ان الناس كلها تقول و انا مالى هى اللى معرفتش تحافظ عليه و انا هاخده منها فورا ةطبعا<br />شفتو العبث الاخلاقى"
archived = "2009-05-02"
capture_url = "https://web.archive.org/web/20090502135622/http://www.20at.com:80/7ayatna/5951.html"

