text = "السلام عليكم..الموضوع جميل ورائع بس خلاص طالما ان الوحدة بقت تخطف حبيب او خطيب وزوج صحبتها يبقى لازم تلغي صحبتها من الاساس انا مش بقتنع ان هو يتعرف على صحابي، عشان بخاف عليه ومش حقدر أستنى اللحظة اللي الاقي الخيانة دي ..بس تعرفوا انا في اعتقادي حاجة وبؤمن بيها جداااا هي ان الوحدة هي الي تقدر تحافظ على حبيبها او خطيبها او زوجها فلو هي مقصرة في واجباتها معاه ومقصرة في جمالها وأناقتها واهتمامها بيه وخوفها عليه وحاجات تانيةكتيييييير اوييي لازم حيبص برة لأنو بيبقى عايز حبيبتو او مراتو او خطيبتو أجمل وحدة ولو مش حس انها جميلة في اي حاجة لازم حيبص برة ،وبعدين ليه أصلا اعرف صحابي البنات عليه اذا كنت واثقة في طرف واحد فانا مش واثقة في الطرف التاني فمن الاساس غلط غلط غلط ان تبقى فيه صداقة بين صديقة الوحدة والانسان اللي الوحدة دي مرتبطة بيه..ودلوقتي البنات هما اللي عايزين يتجوزوا مش الصبيان فالاية انع[ *** ]ت دلوقتي البنت هي اللي بتعا[ *** ] الولد فطالما وصلنا للمرحلة دي يبقى مش غريب انها تلعب دور الخطافة اللي كنا بنشوفها في الافلام بس على فكرة انا لو حصل معايا كدة او انو خان ممكن أموت فيها لأن الخيانة طعمها وحش جدااااااااااااا ااااااااااااااا ااااااااااااااا اااااا يارب محدش يتعرض للقضية اللي كتبها الاستاذ خالد واتمنى مع انها امنية صعبة انها تصبح مجرد حبر على ورق في يوم من الايام"
archived = "2009-05-02"
