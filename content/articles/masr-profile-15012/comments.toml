author = "يا ترى حد حيتصل 4"
posted = "2010-01-21"
text = "نسبة المطلوبة للنجاح لاجتياز الاختبار التحريري<br />يسمح لمن يحصل علي نسبة النجاح المقررة في الامتحان التحريري بالتقدم لاختبارات القدرات والحاسب الآلي والشفوي<br />المرحلة الثانية امتحان القــدرات والحاسب الآلي والشفوي<br />يحــدد موعدها ومكـان عقدهـا فيما بعد حيث يخطر الناجحون في الامتحان التحريري بذلك<br />رابعا كتب ومراجع استرشادية للإعداد لاجتياز اختبارات القبول في وظائف السلك الدبلوماسي والقنصلي<br />مجلة السياسة الدولية وخاصة الأعداد الحديثة منها<br />أحد المراجع التي تستخدم في التدريس بالجامعات المصرية بالنسبة للقانون الدولي العام والمنظمات الدولية<br />أحد المراجع التي تستخدم في تدريس العلاقات الاقتصادية الدولية في الجامعات المصرية<br />مرجع في تاريخ مصر الحديث<br />ويفضل الاستعانة بالطبعات الحديثة كلما أمكن ذلك ، بالإضافة إلى المقالات في المجلات الدولية المتخصصة في مجال السياسة الدولية بمختلف اللغات الحية<br />مع أطيب التمنيات بالتوفيق ،،،"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123100505/http://www.20at.com:80/masr/news/15012-2010-01-21-19-40-37.html"

[[comments]]
order = 1
subject = ""
author = "يا ترى حد حيتصل 3"
posted = "2010-01-21"
text = "ملحوظة<br />بالنسبة لموظفي الحكومة أو القطاع العام يمكن التقديم ببيانات معتمدة من جهة العمل بتوافر أي من هذه المستندات بملف خدمة المتقدم ، مع استيفاء باقي المستندات المطلوبة إذا كانت غير موجودة بملفه ، كمــا تستبدل الاستمارة 167ع ح بطلب كتابي من المتقدم مشفوعا بموافقة جهة العمل<br />وبالنسبة لضباط القوات المسلحة أو الشرطة يشترط موافقة الإدارة العامة لشئون الضباط بالجهات التابعين لها قبل التقدم بطلباتهم للوزارة<br />قبول المستندات<br />يتسلم الطالب الذي يقبل طلبه بطاقة الدخول للامتحـــــان<br />على الطالب أداء رسم دخول الامتحان يعلن عن قيمته في حينه الذي يتراوح بين مائة ومائة خمسون جنيه مصري لخزينة الوزارة ويعتبر الرسم حقا للوزارة حتى ولو عدل عن دخول المسابقة وأيا كان قرار الوزارة بشأن الطالب<br />يكون حضور الطالب لتأديــــة الامتحــــان أو لتقديم طلبه على نفقتــه الخاصة<br />لن يلتفت إلى الطلبات التي تقدم بعد انتهاء الموعد المحدد أو إذا لم تستوف الشروط المنصوص عليها<br />يوقع كشف لياقة طبية خاص على الناجحين قبل التعيين بواسطة اللجنة الطبية العامـــة"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123100505/http://www.20at.com:80/masr/news/15012-2010-01-21-19-40-37.html"

[[comments]]
order = 2
subject = ""
author = "يا ترى حد حيتصل 2"
posted = "2010-01-21"
text = "المستندات المطلوبة<br />شهادة الميلاد أو مستخرج رسمي منها و صورة ضوئية منها<br />شهادة المؤهل الدراسي العالي الحاصل عليه وصورة ضوئية منه<br />صحيفة الحالة الجـنــائية<br />عدد 8 صور مقاس 4× 6 موقع عليها من الخلف باسم صاحبها<br />البطاقة الشخصية أو العائلية أو بطاقة الرقم القومي وصورة ضوئية منها<br />إقرارات كتابية يوقعها الطالب ومعتمدة من جهة رسمية ومستوفاة رسم الدمغة وهى على الوجه التالى<br />إقرار بأن المتقدم مصري الجنسية ومن أبوين مصريين وبأنه متمتع بالأهلية المدنية الكاملة<br />إقرار بأنه غير متزوج من أجنبية<br />إقرار بأن والدي الزوجة مصريين في حالة الزواج<br />إقرار بأنه محمود السيرة وحسن السمعة وبأنه لم يصدر ضده حكم من المحاكم أو من المجالس التأديبية في جريمة مخلة بالشرف والأمانة ، ولم يسبق فصله بقرار أو بحكم تأديبى<br />شهادة من وزارة التعليم العالي بالنسبة للحاصلين على مؤهلات عليا من الخارج أو من الجامعات الخاصة في مصر بــأن المؤهل الحاصل المتقدم عليه معادل قانونا للدرجات العلمـــية التي تمنحها الكليات التابـعة للجامعات الحكومية المصرية"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123100505/http://www.20at.com:80/masr/news/15012-2010-01-21-19-40-37.html"

[[comments]]
order = 3
subject = ""
author = "يا ترى حد حيتصل"
posted = "2010-01-21"
text = "أولا شروط التقدم لامتحــان المسابقة للتعيين في وظيفة ملحق بالسلك الدبلوماسي والقنصلي بوزارة الخارجية<br />طبقا للقانون رقم 45 لسـنة 1982<br />أن يكون مصري الجنسـية<br />أن يكون من أبوين مصريين<br />أن يكون متمتعا بالأهلية المدنية الكاملة<br />ألا يكون متزوجا من غير مصري الجنسية أو ممن هم من أبوين أحدهما أو كلاهما غير مصرى<br />أن يكون محمــود السـيرة حسـن السمعة<br />ألا يكون قد حكم عليه بعقوبة جنائية ولو كان قــد رد إليه اعتباره ، وآلا يكون قد سبق فصله بحكم أو قرار تأديبي<br />ألا يكون قــد حكم عليه من المحاكم أو من المجالس التأديبية في جريمة مخلة بالشرف والأمانة<br />أن يكون حاصلا على مؤهل عـال من إحدى الجامعات المصرية<br />لا يقل سنه عن 21 سـنـة ميلادية وآلا يزيـد عــن 27 ســنة ميلادية في التاريخ المعلن عن بـدء امتحـــــان المسابقة"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123100505/http://www.20at.com:80/masr/news/15012-2010-01-21-19-40-37.html"

[[comments]]
