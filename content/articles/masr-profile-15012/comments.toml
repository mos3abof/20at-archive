author = "محدش حيتصل يا محمد"
posted = "2010-01-22"
text = "محدش يا حيتصل يا محمد جلال لانك خريج اعلام وخريج كلية الاعلام اصلا<br />مالوش قيمه لان مهنة الاعلامي اي واحد بيشتغلها اي خريج كلية ممكن يشتغل<br />اعلامي وحتى لو مش خريج كلية بدون شهاة ممكن تشتغل اعلامي<br />الدكتور بيشتغل اعلامي<br />المهندس بيشتشغل اعلامي<br />المدرس بيشتغل اعلامي<br />المحامي بيشتغل اعلامي<br />الترزي بيشتغل اعلامي<br />محدش حيتصل يا محمد يا جلال<br />سلام"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123100505/http://www.20at.com:80/masr/news/15012-2010-01-21-19-40-37.html"

