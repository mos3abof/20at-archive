author = "انت ابوك سفير"
posted = "2010-01-22"
text = "لو ابوك سفير<br />او وزير<br />بلاش<br />عضو لجنة سياسات<br />قيادة امنية كبيرة<br />يبقى هيبعتوا لك يا محمد ايا كان مؤهلك ان شاء اللة تكون خريج مدرسة الكتاب العسكريين<br />انما لو ابوك موظف فى دواوين الحكومة او مهنى او اعمال حرة يبقى محدش هيعبرك<br />ويمكن يعملوا تحريات عنك ويطلعوك قريب تاجر مخدرات<br />والا اقول لك<br />استنى طلوع المشمش"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123100505/http://www.20at.com:80/masr/news/15012-2010-01-21-19-40-37.html"

