subject = ""
author = "هاهاها هاها هاها"
posted = "2010-01-21"
text = "انت يا ابنى ساذج والا اهبل والا بتريل<br />السفير يا حبيبى بيكون لواء اركان حرب الدولة عايزة تكافئة على خدماتة وولائة او حتى عايزة تتخلص منة بابعادة الى دولة بعيدة زى ما عملوا مع الشاذلى او غيرة<br />انما اللى بيمتحنوهم دول بيبقوا موظفين فى القنصليات والسفارات برة وكل شغلهم انهم بيقعدوا فى شبابيك القنصلية يستلموا طلبات من الجمهور اللى عايز يجدد جواز سفرة واللى عايز يضيف ابنة على الجواز واللى عايز شهادة ميلاد لابنة المولود فى تلك الدولة<br />يعنى موظف ادارى عادى فى السفارة بيشتغل شؤون ادارية وليس لة علاقة بالدبلوماسية<br />تماما زى الموظفين الموجودين فى مجمع التحرير<br />انما السفير مش بيمتحن ويختاروة مش عارف من اى لجنة - دى كان زمان ايام عبد الناصر اللة يرحمة"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123100505/http://www.20at.com:80/masr/news/15012-2010-01-21-19-40-37.html"

[[comments]]
