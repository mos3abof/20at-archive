subject = ""
author = "اذا سرق فيكم الضعيف"
posted = "2009-09-24"
text = "هل يقدم المسئولين الكبار ورئيس الدولة اقرار الذمة المالية زى اى موظف فى الدولة ويكتب فية ممتلكاتة ؟<br />ويقدمة لمين<br />اذا كان يفعل ذلك فلا داعى لحركة كفاية ان تحاسب احد<br />فهناك اجهزة رقابية فى الدولة تقوم بتلك الوظيفة<br />وعندما مات عبد الناصر فتحوا الخزنة الخاصة بة فوجدوا سبعة جنيهات وفتشت امريكا على اى حسابات سرية فى بنوك سويسرا فلم تجد شيئا<br />صحيح ان اولادة فى عصر السادات والانفتاح اصبحوا مليونيرات ولكن ايامة كانوا ناس لا يملكون شيئا<br />التاريخ يسجل اقل همسة"
archived = "2009-09-27"
capture_url = "https://web.archive.org/web/20090927025318/http://www.20at.com:80/masr/2khbar/13510-2009-09-24-11-00-44.html"

[[comments]]
order = 1
subject = ""
author = "تشوية الشرفاء"
posted = "2009-09-24"
text = "على فكرة 750 مليون دولار يطلعوا كام<br />وبعدين الراجل كان بيحوش مصروفة<br />والفلوس دى كلها حلال لانها من عرق جبيننا"
archived = "2009-09-27"
capture_url = "https://web.archive.org/web/20090927025318/http://www.20at.com:80/masr/2khbar/13510-2009-09-24-11-00-44.html"

[[comments]]
order = 2
subject = ""
author = "المحاسب ربنا"
posted = "2009-09-24"
text = "دة كلة كلام مجرد كلام بيقولة واحد بياع كلام واول الشمس ما تطلع علية هيقول مش انا<br />انما حاليا ونحن فى فترة الياس الكامل من اى اصلاح او تقدم فى البلد دى<br />بنرمى حمولنا على اللة<br />واللة عزيز ذو انتقام<br />وعزرائيل موجود"
archived = "2009-09-27"
capture_url = "https://web.archive.org/web/20090927025318/http://www.20at.com:80/masr/2khbar/13510-2009-09-24-11-00-44.html"

[[comments]]
