author = "التخريب"
posted = "2009-09-26"
text = "علشان شوية فلوس هتحسابوة<br />طيب وخراب بلد بالكامل والفساد<br />وسياسة ولا يهمك ارمى ورا ضهرك اللى قالها ابوة لما فاروق حسنى فشل فى الانتخابات<br />ارمى ورا ضهرك<br />حساب اية وانجليزى اية - ارمى ورا ضهرك"
archived = "2009-09-27"
capture_url = "https://web.archive.org/web/20090927025318/http://www.20at.com:80/masr/2khbar/13510-2009-09-24-11-00-44.html"
