text = "جميل ان الواحد يكون هدفه واضح فداامه وبكون مقتنع ومتمسك بحلمه ويبقى عارف انو مفيش حاجه مستحيله وان كنا ممكن نتصور العكس في عض احلامنا اللي نشوفها بعيده عن الواقع وصعبة التحقيق واظن ده شعور خاطئ هيه كل المشكله انو لسه موصلناش لحل للمستحيل ده واكييد هوه ساعتها مش هيكون مستحيل بالعكس هوا اصبح واقع<br />وكل اللي محتاجينه اننا نحدد رسالتنا في الحياة اللي جينا الدنيا عشانها وبدايه التحديد من الحوار اللي قرأته دلوقتي<br />ربنا يوفقك يااستاذ حمزه وكل احلامك تكون حقيقه<br />حوار موفق ياهبه"
archived = "2009-09-15"
capture_url = "https://web.archive.org/web/20090915174308/http://www.20at.com:80/20at/7ayatna/13433-2009-09-13-11-00-51.html"

