text = "لكن مش عارفة بس لما تبقى مسدودة في وشك كل حاجة في بلدك مش محتاج مكان جديد<br />قصدي أرض جديدة تزرع فيها حلم جديد دايمااااااااا كتير من الأحلام بتتحقق بره ؟<br />و بيبان المصري عبقري بره<br />انا معاك انه في شيء من الهروب و عدم القدرة على تغيير الواقع<br />بس إذا كان الواقع قدامه كتييييييير عشان يتغير أكيد مش انا بس اللي هغيره<br />والله مش عارفة الصح فين !!!"
