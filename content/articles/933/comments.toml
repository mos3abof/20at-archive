text = ";;;;;كلنا عرب ومسلمين وانامصري تعلمت واعمل بهالكويت واي مصري شريف محب لعروبته يحب الكويت لانهم اخواتنا واحزر من ان هنماك من يتحدث باسم مصر كل اهل مصر يحبون الكويت وهم شعب مسالم واعتقدان هناك دائما حاقدين علي علاقتهم فلتحيا الكويت القويه واميرها باسم 70مليون مصري محب للايمان والخير"
