posted = "2006-01-23"
text = "أنا عاوز أفهم انت مالك ياأحمد ياهواري بالصباح وبالسالم وبالجابر<br />لو احنا كوايته فمااعتقدش انك جبت جديد ، ولو احنا مش كوايته وده اللي حاصل وانت عارف فاحنا مال اهالينا بالتفصيلات المملة دي .<br />أنا بصراحه اتشتت من نصف المقال يمكن لاني مش كويتي ، ياترى أيها الزائر العزيز انت تهت لما وصلت فين في هذا المقال ؟"
