text = "أتمنى على الله العلى القدير أن يزيل هذا الركام ويقيم دولة الشريعة التي يتفيأ ظلالها كل مسلم ، فتختار الامه حكامها من أصحاب الكفاءات والقدرات ، لا بسبب أنهم ينتمون لتلك العائلة أو ذلك الحزب"
