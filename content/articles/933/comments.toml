order = 0
subject = "آخر التطورات"
author = "نقلاً عن الجزيرة.نت"
posted = "2006-01-22"
text = "نقلاً عن الجزيرة.نت.. صباح الاثنين..<br />يعقد مجلس الأمة الكويتي (البرلمان) جلسة استثنائية يوم غد الثلاثاء ليؤدي الشيخ سعد العبد الله الصباح القسم الدستوري، ويتولى بذلك مسؤولية إدارة شؤون الإمارة بصفة رسمية.<br />جاء ذلك بعد أن التقى الأمير الجديد رئيس المجلس جاسم الخرافي، وتم الاتفاق على أداء اليمين رغم الخلاف الدائر داخل الأسرة الحاكمة بشأن ما إن كانت حالة الأمير الجديد الصحية تسمح له بإدارة دفة الحكم بالبلاد. وقد تولى الشيخ سعد (76 عاما) إمارة الكويت في 15 يناير/كانون الثاني خلفا لابن عمه الراحل الشيخ جابر الأحمد الصباح الذي توفي عن عمر يناهز الـ78 عاما.<br />وبالرغم من أن الحكومة الكويتية تخطط لإرسال فريق طبي يفحص الشيخ سعد ويقدم تقريرا إلى البرلمان بشأن مدى قدرته على الاضطلاع بالحكم, فإن الأمير الجديد طلب من البرلمان السماح له بأداء القسم. ويتطلب أي تحرك لعزل الأمير موافقة أغلبية ثلثي أعضاء البرلمان.<br />ويقضي الدستور بأن يؤدي الأمير قسَماً من سطرين أمام جلسة خاصة للبرلمان قبل أن يتمكن من القيام بمسؤولياته رسميا كحاكم للبلاد. والحالة الصحية للأمير لا تسمح له بأداء القسم, لذا أثير الكثير من الاقتراحات بشأن تسهيل أداء القسم, أثارت بدورها الكثير من التساؤلات بشأن دستوريتها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125249/http://www.20at.com/article2.php?sid=306"

