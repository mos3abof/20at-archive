subject = "مالنا و نص"
author = "مصــegyــري"
posted = "2006-01-24"
text = "اقتباس : الاخ التايه<br />\"أنا عاوز أفهم انت مالك ياأحمد ياهواري بالصباح وبالسالم وبالجابر<br />لو احنا كوايته فمااعتقدش انك جبت جديد ، ولو احنا مش كوايته وده اللي حاصل وانت عارف فاحنا مال اهالينا بالتفصيلات المملة دي .\"<br />مش عارف بس بحس ان اي مشكلة بتحصل في العالم العربي .. هيكون لينا كمصريين دور فيها<br />مش احنا اللي دايما بنتدبس في اي تدخل عربي لحل اي مشكلة<br />خلاص .. يبقى لازم نكون متابعين الليلة دي من اولها<br />عشان لما الفاس تقع في الراس و حكومتنا تتدخل في اي حوار<br />نبقى عارفين ( كشعب ) الحكومة رايحة بينا فين<br />و افتكر كده ايام تدخل الجيوش المصرية لتحرير الكويت .. كانت الناس مش عارفة ده صح ولا غلط ... لأن مكانش في حد بيتكلم غير القناة التانية و اخبار 9 مساء<br />في رأيي ان الموضوع رائع و عرفنا كتير عن ظروف الكويت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125249/http://www.20at.com/article2.php?sid=306"

