[[comments]]
order = 13
subject = "انتم بالقلوب يا مصر"
author = "عبدالله شداد"
posted = "2006-02-23"
text = "وجهة نظر احمد الهوارى بان الكويت هى صر و مصر هى الكويت ليه الغلابه العاطلين يشوفوا الكويت غير الكويت هى نبض العرب<br />المصريين اللى بالكويت هم عارفين الكويت بان اذا حصل للكويت حاجه مثل الاخ اللى عاوز التورته ان مصر اول من تتاثر افهموا<br />يا مصاروه وبلاش كلام فارغ الموقع حلو ان يكون مثقفين عقليا لقبول الموضيع بحس غيرهم ولا استثنى السعودين الحاقدين حتى على النعمة اللى هم فيها خليهم يشوفون افريقيا شو فيها من الماسى والاحزان لقمة عيش ما يحصلوا لكن وين اللى له عقل و يقول الحمدالله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125249/http://www.20at.com/article2.php?sid=306"

[[comments]]
order = 14
subject = "أحزنني وأبكاني دما مناوشات العرب!"
author = "كويتية غيورة على العرب"
posted = "2006-03-01"
text = "انا قرأت الموضوع وقرأت التعليقات وبكل صراحة صدمت وبكيت من هذا الكم الهائل من السطحية واستهتار العرب، متى سنعرف ان ما يحدث في السعوية أو سوريا أو العراق أو الكويت او فلسطين أو ليبيا او المغرب في أخر المحيط يهمنا بالدرجة الأولى!<br />قضيتك أيها العربي ما يحدث في كل بلاد المسلمين أين دولة العروبة ..أين جمال عبدالناصر؟<br />أين صلاح الدين الأيوبي عندما حرر أرض المقدس الطاهرة من اللأوربيين،أين نحن من الرسول صلى الله عليه وسلم عندمات قال (لا فرق بين عربي أو أعجمي الا بالتقوى)..<br />الأجدر بنا أن نكون على قلب واحد لأن فلسطين محتلة و أخوانكم هناك يعذبون ويقتلون بسلاح اليهودي ونحن وهنا نقول الكويت ومصر والكويتيين...الخ و سوريا تهدد والعراق أطفال شردوا بالشوارع أرامل وتسببت الحرب بعاهات دائمة لشعب ليس له ذنب بالحروب التي دخلها الا دكتاتورية رئيسه صدام حسين،صحيح العراق غزت الكويت لكن الشعب برئ ليس له ذنب من كل ما يحدث له هاهم يدفعون الثمن لجريمة لم ينتكهوها..وليس لدي وقت لأني أطلت عليكم لأتكلم عن مأساة كل شعب من الخليج الى المحيط.. لكن نصيحة لنكن على قلب واحد فاسرائيل تنوي تحقيق حلمهالتمتد دولتهم من من الفرات الى النيل!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125249/http://www.20at.com/article2.php?sid=306"

