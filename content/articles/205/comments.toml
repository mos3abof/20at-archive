[[comments]]
order = 2
subject = "حالم بمستقبل مشرق"
text = "موضوع رائع جدا... وأنا استفدت منه... وحقيقة دمعت عيني... تاثرا لما نحن عليه وما هي عليه، فهل لنا كمسلمين (أصلا) أن نفعل مثل فعلها:<br />1- أن نهتم بمعالي الأمور... ونترك سفاسفها مثل الانغماس في الشهوات (جنس - مال - ملبوسات - مأكولات...) ونجعل أهم شيء يشغل بالنا هو لقاء الله والوقوف بين يديه...<br />2- فهي بعد أن أسلمت بـ 36 يوم أسلم زوجها...<br />3- الوقوف مع نفسي وقفة للمراجعة، هل ما أنا عليه صواب أم خطأ..<br />4- كم شخص حدثته عن الله سبحانه وتعالى...<br />وأخيرا تحية عطرة إلى أ/هاني رمضان، لموقع عشرينات ألف تحية...."
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022145721/http://www.20at.com:80/article.php?sid=582"
