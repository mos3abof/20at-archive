[[comments]]
order = 0
subject = "Taka-Taka"
text = "الموضوع رائع ,وفعلآ الواحد لو تأمل شويه النعم اللى ربنا انعم علينا بيها هنتكسف من نفسنا و من اننا مش بنطبق اغلب التعاليم الدينية البسيطه اللى ربنا قالها لنا,انا بطلب من كل واحد يقرأ الموضوع ده انه يراجع تصرفاته ألف مره , عشان احنا مش هانعيش غير مره واحده!!<br />بارك الله لها وهداها,وجزاك الله خيرا"
archived = "2004-09-02"
capture_url = "https://web.archive.org/web/20040902111012/http://www.20at.com:80/article.php?sid=582"

