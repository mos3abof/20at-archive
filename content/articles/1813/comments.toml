[[comments]]
order = 1
subject = "ساعدوني ..تكفون"
author = "ام محمد"
posted = "2006-10-03"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم ورحمة الله وبركاته..<br />قال تعالى (فاما اليتيمفلا تقهر )<br />انا ارملة وام لابناء وانا في امس الحاجة لمساعدة ذوي الايدي البيضاء تكفون دلوني على اي عنوان او ايميل اصل من خلاله لمؤسسة الامير الوليد الخيرية جعل الله ذلك في موازين حسناتكم فان الله قد اشار الى عظم اجر كافل اليتيم ومعاونته في ايات واحاديث عدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153611/http://www.20at.com/article2.php?sid=1305"

