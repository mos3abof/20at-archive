[[comments]]
order = 2
subject = "قمر البلد دى عيون ليلها"
author = "نيفين..نيفى..نوفا"
posted = "2006-03-28"
text = "لا اقوللك انا يا هبهوب<br />انا من زمان الحكايات اللى عن القمر و الشمس ة الفضاء ة الاعفاريت ة اى حاجه مش بنشوفها بتستهةينى جدا<br />بس مش عارفه ليه لما بسمع كلمه القمر بييجى على بالى الشعر<br />يمكن علشان القمر بيونس الشعراء ة العشاق اللى بيسهرو<br />و دلوقتى لما قريت الموضوع و بمناسبه ذكرى العندليب افتكرت اغنيه خلى القلب<br />و لعمروافتكرت ضحكه عيون حبيبى<br />و لمنير افتكرت<br />كيق ما القمر واحد<br />يااااااااااااااه<br />كفايه افتكر جاره القمر فيروز<br />انتى القمر بيفكرك بايه يا هبهوب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132930/http://www.20at.com/article2.php?sid=624"

