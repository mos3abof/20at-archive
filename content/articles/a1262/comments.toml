text = "لم أسمع عن دويدار من قبل. اكتشفته لتوي بفضل \"عشرينات\". وأعجبني مساره ومثابرته.<br />لكن ما حزَّ في نفسي: هذه الصورة مع أقذر مجرم عرفته البشرية، أعني جورج بوش. ياحبذا لو تحذف. فلو وقف بوش قرب جرذ وأخذت لهما صورة، لكانت إهانة للجرذ ونقطة سوداء في حياته. فكيف ورجل في وزن أحمد دويدار؟"
