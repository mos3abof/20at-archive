subject = "ونحن مثله"
text = "زمان كنا اذا اردنا ان ندعو الي الاسلام في الغرب كان يجب ان نسافر الي ديار الغرب اما الان فقد انعم الله علينا بشبكه المعلومات الدوليه ومن خلالها نستطيع ان نتحدث الي اهل الغرب وندعوهم الي سماحه الاسلام علي الاقل يعرف ما هو الاسلام وعن تجربه فقد تغير فكر اناس كثيرين عن الاسلام بعد ان حدثتهم عنه واصبح لي دور انا ايضا في حمل رساله الاسلام فانا ادعو الي كل من يزور ذلك الموقع ان نؤسس حمله صغيره عبر الموقع للدعوه عبر الانترنت وممكن ان اضع خبرتي كلها اليكم ليستفاد منها الجميع هنا فقد ان الاوان لكي يكون لنا نصيب في حمل رساله الاسلام واحب ابشركم ان هناك شخص ممن دعوتهم دخلو الاسلام بفضل الله وعلمته ايضا الصلاه عبر الشبكه الدوليه وهو بحق انسان رائع انا لا اتحدث لكي اتفاخر او اتكبر فقد انتهي عصر التكبر والتفاخر وابتدا عصر العمل وحب الاسلام فهل يستطيع كل واحد منكم ان يكون له دور ولو بسيط"
archived = "2005-07-22"
capture_url = "https://web.archive.org/web/20050722083434/http://www.20at.com:80/article.php?sid=1262"

