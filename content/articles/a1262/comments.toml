subject = "Dreaming for a better life"
text = "البرنامج تنفيذه و اخراجه جميل و لكن هل دي فعلا احلام معظم البنات ان هما يتجوزا و خلاص و هل دي اهدافهم في الحياة؟؟؟ لو فعلا ده حقيقي يبقا ربنا يستر علينا..يعني انا بنت و حلمي اني اتميز في مجالي و اساعد و افيد اللي حواليا بيه على قد ما اقدر و في نفس الوقت ارفع راية الاسلام لان طبعا في البلاد الاجنبية بيكرهونا و بيخافوا منا يوم بعد التاني..بس انا عايزة اقول حاجة انا ما انكرش ان الارتباط من احلامي لان ده حلم من احلام اي بنت و اي شاب و يكاد يكون امر طبيعي بيحصل في الحياة و مش حلم حتى بس فين الاحلام اللي بتميز كل شخص عن التاني!!!!!"
archived = "2005-07-22"
capture_url = "https://web.archive.org/web/20050722083434/http://www.20at.com:80/article.php?sid=1262"

