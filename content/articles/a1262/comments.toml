[[comments]]
order = 8
subject = "الرد على القس الخنزير( زكريا بطرس)القيم بامريكا"
text = "الذى اسس غرفة من على البالتوك لسب المسلمين والرسول الكريم . اتمنا من الله ان يرينا فية يوم اسود ، ارجو من السيخ (محمد الرد فى مناظرة فى امريكا وتذاع على الملا كمثل الشيخ (احمد دايت)اللهم يتغمده ربه برحمته<br />الرجاء من يعرف عنوانةاو ايميل الشيخ يبلغه على هذا الكلب<br />العز للاسلام وعودة الخلا فة الاسلامية وليس ببعيد على من نراه مثل الكلب ده وزعماء العالم الغربى وحاكم العالم العربى من غزى وعار على احفاد الرسول الحق والصاحبة الكرام"
archived = "2005-07-22"
capture_url = "https://web.archive.org/web/20050722083434/http://www.20at.com:80/article.php?sid=1262"
