text = "انا قريت عزازيل تحفة الصراحة<br />بس ظل الافاعي دي انا اما قريتها عبارة عن فيلم جنس بالظبط ولا بيبرز اهمية للمرأة ولا حاجه عبارة عن قصة ام مشفتش بنتها من كام سنة وعمالة تحرضها انها تسيب جوزها وتسفرلها امريكا ونص القصة الاولاني عبارة عن محاولات جنسية للزوج مع الزوجة وخلاص قصة بصراحه في منتهي الانحطاط"
archived = "2009-12-29"
