author = "عزازيل"
posted = "2009-07-05"
text = "يوسف زيدان كتب رواية حقيقية اسمها عزازيل موجود اصولها فى الوثائق التاريخية<br />تقول القصة الحقيقية انة عندما حكم المسيحيون الاسكندرية وكان غالبيتها من اتباع الديانة الفرعونية القديمة واقلية مسيحية تحكم المدينة تحت الحكم الرومانى قبيل الفتح العربى بقليل<br />هاجم اسقف الاسكندرية عالمة رياضيات مصرية تتبع الديانة الفرعونية وخطب فى الكنيسة احرقوا الوثنيين الكفرة فخرج اتباع الكنيسة يقذفون العالمة المصرية بالطوب ورجموها وربطوا قدميها بالحبال وجروها مسحولة فى شوارع الاسكندرية وهم يصرخون اقتلوا الوثنيين<br />ثم اشعلوا النيران فى جسد العالمة المصرية<br />وهاجت الكنيسة ضد الرواية المذكورة فى كتب التاريخ<br />وهكذا كان انتشار المسيحية المحدود فى مصر بالحرق والسحل والقتل للوثنيين الكفرة"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043021/http://www.20at.com:80/masr/review/12555-2009-07-04-09-35-31.html"

