[[comments]]
order = 1
subject = "البعد عن الاسلام وروحه السبب الرئيسي"
author = "ان البعيد عن دينه اولا لا يعرف جيدا ان الانتحار حرام شرعا وثانيا معايشة القران والسنة تهدأ النفس وتطمئن القلب \"الذين اذا ذكر الله وجلت قلوبهم\""
text = "\"وتطمئن قلوبهم بذكر الله الا بذكر الله تطمئن القلوب\"<br />صدق الله العظيم<br />اما موضوع المرض النفسي بعد ان يحصل فلابد ان يتقدم صاحبه او اسرته الي الاطباء حتى يعالجوه وايضا الاقبال على الله سبحانه وكتابه وفرائضة بالتوازي سوف ياخذ بيد المريض الي بر الامان ان شاء الله والشفاء<br />نسال الله ان يهدي اخواننا واخواتنا في الاردن وفي كل قطر اسلامي لما فيه الخير وان يجنب الامة فقدخيرة زهورها وشبابها لانه عماد الامة نسأل السلامة لنا ولهم والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152202/http://www.20at.com/article.php?sid=1594"
