subject = "دا حرامي صغنن"
author = "sweet_princess"
posted = "2006-03-07"
text = "اللي بتتكلموا عليه دا( ميني حرامي ) لسه في اولى حضانه(kg1).<br />فيها ايه يعني لما( بسلامته ولافخامته )يشتري عربيه( بربع ارنب )بحاله(( يا ناس يا شر كفايه قر)).<br />ييجي ايه دا جنب (فرقه الجوع الكافر) اللي كلت اقتصاد البلد البلد وملوا بيه كروشهم.<br />ييجي ايه دا جنب الناس اللي عماله تبيع في شركات القطاع العام لما خلاص قربنا نبقى (يامولايا كما خلقتني) وشردوا ملايين العمال واسرؤهم.<br />واهم لسه عارضين عمر افندي للبيع اهه ومن وراها بن زايون (لمن لايعلم بن زايون معناها الاصلي ...ابن صهيون ) اللي اسسها هما اليهود هي وصيدناوي وشيكوريل وهانو كلها اصحابها الاصليين يهود لكن اتاخدت منهم واتاممت ...وما حدش عارف مصير العمال اللي فيهم ايه دلوقتي بعد مايتباعم .<br />يا جماعه لازم ناخد بالنا ان اللي في مصر دا شغل كبير قوي ماشي من تحت الترابيزه.<br />اهو دا الموضوع اللي يستاهل العياط بجد ...اقله الواحد يعيط بنفس .<br />الااااااااهي ربنا ينتقم منك يا مبارك انت وحاشيتك الحراميه وخصوصا وزير الاقتصاد اللي قرعته معقداه...و كل ما يتسال عن الموارد الاقتصاديه..يقول(غزاره في الانتاج وسوء في التوزيع).<br />وحرق اعصابنا بالكلام عن السلم الوظيفي واولويات التعيين وانه في اكتفاء ومش محتاجين تعيينات جديده.<br />يعني ولحد زي خطيبي دا وملايين غيره لما يخلصوا يورحوا فين ....... يسرحوا ببطاطا .. ولا يطفشوا ويسيبوا البلد؟....<br />ال سلم وظيفي اااااااااال (ربنا ينقم منه زي ما كسر السلم ... لملم .. لملم).<br />معلش من غيظي نسيت ودخلت ع المسرحيه.<br />اعمل ايه... بدال ما اخش الخانكه بدري.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141652/http://www.20at.com/article2.php?sid=534"

[[comments]]
order = 1
subject = "great scap......!!!"
author = "sweet_princess"
posted = "2006-03-07"
text = "اولا ايه اللي جاب تعليقي اللي فوق دا هنا ......!!!<br />انا كنت كاتباه في موضزع( فخامته بيشتري عربيه بربع مليون ).<br />لكن ياللا ماعلينا .... زيادة الخير خيرين.<br />اما بالنسبه لتعليقي ع الموضزع دا...(الهروب الكبير... فيلم الفساد المعتاد)انا قلت الحق اكتبه قبل ما يغير اقامته ويروح حته تانيه.<br />بالنسبه لهروب الحرامي صاحب العباره فدا شيئ متوقع وانا مش مستغربه انه يحصل (بل كنت بستعجب هو اتاخر ليه )... ااااه ما هو تلاقيهم كانو بيظبطوله اوراقه عشان يعرف(يفلسع).<br />ودا شيئ مش مستبعد ابدا عن حكومتنا المصونه ((اللي اقسمت براس جدهاالكبير (((سلطح بابا ))) انها بعون الله وتوفيقه هتخربها وتقعد على تلها .<br />اه يا حراميه يانور ...(انتوا كلكوا حلينا ولا اييييييه)."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141652/http://www.20at.com/article2.php?sid=534"

