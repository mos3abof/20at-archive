[[comments]]
order = 4
subject = "دبدوب ... انت عقدتني ... وهعيط"
author = "sweet_princess"
posted = "2006-03-08"
text = "ياناس يا عالم كفايه احباط بقى .<br />ما هو دا اللي جايبنا ورا ....<br />لو كل الشباب زيك كده يا دبدوب نبقى خلاص في الباي باي وعلى راي بتوع الخليج(الله بالخير )وبالعجليزي (gone with the wind).<br />الله يخليك اديها سنة تفاؤل عشان تعرف تعيش .<br />واخيرا لشلتنا اللي لسه مش لاقيين لها اسم:<br />حد يكلم الكابتن دا ويعقله شويه .<br />اكرم :<br />افقعه قصيدة يمكن تفوقه من الاحباط دا.<br />هبهوب :<br />بركاتك يا حاجه (سمعينا صوتك يا ختي ).<br />خللوا الكابتن دا يبطل احباط قبل ما اعيط .((كفايه خطيبي )).<br />واخيرا سلامي( لعمو بقى مش خالو) اللي قاعد في دبي من 3 سنين وحالف( براس جدي )ماهو راجع (نظام احباط برده )الا لما اللي قاعدين على تلها ينكشحم.<br />وحشتني يا عمو ارجع بقى .... اهئ..هئ هئ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141652/http://www.20at.com/article2.php?sid=534"

[[comments]]
order = 5
subject = "متعوده دايما"
author = "مواطن مقهور"
posted = "2006-03-08"
text = "ياجماعه دا شىء احنا اتعودنا علية الشعب المصرى مالوش تمن عند الناس دى العبارة القطر البنوك اى حاجة خلاص احنا اتسرقنا من زمان . ضحايا العبارة كلهم عمال رايحين يشتغلو عند ناس احنا احسن منهم مليون مرة بس عشان بلدهم مش موفرة ليهم شغل راحو يشتغلو عشان كل واحد جواه امل بسيط انو يبنى بيت ويتجوز ابسط الحقوق لاى شخص دا قهر وظلم . وعلى فكرة انا سمعت انهم قالو ان سبب الغرق ان العبارة مصابة بفصام فى الشخصية مجنونة يعنى زى جريمة بنى مزار ههههههههههههههههههههه بجد حكومتنا ممتازة بتعرف تخلص نفسها بسرعه بس على مين . وعموما قالها سعد زغلول مفييييييييييييييييييييييييش فايده . سعد سعد يحيا سعد. طولت عليكم معلش انا هروح انام بقة زى اخواتى المصريين اصل احنا معندناش غير الكلام . لو حصل حاجة تانية ياريت حد يبقى يصحينى اتكلم وارجع انام تانى ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141652/http://www.20at.com/article2.php?sid=534"

[[comments]]
order = 6
subject = "ثوره تانى يااكرم..طيب خدو الجديد"
author = "نيفين"
posted = "2006-03-08"
text = "بس بقى يا اكرم<br />قلتلنا قبل كده على الثوره و قلنا اخنا معاك و طلع الكلام على فشوش<br />بس و لا يهمط عيش نمله تاكل سكر<br />المهم<br />لاكرم و لكل العشريناتيه<br />و اللى مشافش القاهره اليوم امبارح<br />شركه سياحه محترمه مطلعه ورق بتوزعه على الناس عن عمره المولد النبوى على عبارات السلام<br />هما فاكريننا ايه<br />مين المجنون اللى ممكن يطلع فى عبارات السلام يعنى مهم لايبقى مجنون لا مجنون<br />و الله على راى عمرو اديب دا بيفكرنا بنكته الغبى اللى سال عن الريان قالوله دا ف السجن فراح حط الفلوس معاه ف السجن<br />صحيح اللى اختشو ماتو<br />و لا على راى استاذنا احمد رجب صاحب الفهامه لازم كلنا كمصريين نلبس طراطير<br />بس اكتر من كدا يا ربى<br />الرحمه يا ناس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141652/http://www.20at.com/article2.php?sid=534"

[[comments]]
order = 7
subject = "الخازوق"
author = "إسلام"
posted = "2006-03-08"
text = "عزيزى المواطن ..إسترخى وخد راحتك على الآخر واستعد للخازوق القادم من شلة الفساد التى تحكم مصر .. فى هذا الوقت كل مواطن مؤهل لأنه يكون واحد من ضحايا الفساد العائم على وجه الوطن .. فساد أبطاله هم المواطنين المسفوح دمهم على هذه الغابة المسماة (مصر) أما مخرج هذا الفيلم الكبير فهو واحد أحنا عارفينه كويس .. مشم هم أسامى مساعدى المخرج لأنهم من فيلم لآخر بيتغيروا حسب الحاجة ليهم ، يعنى اللى يفكر انه يعدل على السيد المخرج ، يا حسرة أمه عليه هيركب الصاروخ . المهم عشان ماأطولش عليكم الفيلم ده بقاله 25 سنة شغال وممكن يفضل 25 سنة كمان، طبعاً الوجوه هتتغير بس اللى مش هيتغير طبعاً هو المخرج الكبير اللى الدنيا كلها ماشية حسب توجيهات سيادته.. أسيبك بقى عزيزى المواطن تتفرج على الفيلم الكبير واللى هيكسر الدنياالفيلم اللى المخرج بتاعه حاصل على جوائز الدنيا كلها فى تعذيب أبطاله وتكسير عظامهم ... اسيبك بقى تعيش مع فسلم (( الخازووووووووووووق ))<br />تحذير : هذا الفيلم واقعى جداً لذا عزيزى المشاهد ما تستغربش لما تحس فى نهاية كل مشهد أن فى حد بيظرفك على قفاك و بوخزة فى مؤخرة حضرتك .... آآآآآآآآآآآآآآآآآه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141652/http://www.20at.com/article2.php?sid=534"
