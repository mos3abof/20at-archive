subject = ""
author = "كلهم فى النار"
posted = "2009-11-12"
text = "لانهم كلهم كذابون<br />منافقون<br />يتكلمون مجرد كلام ولا يفعلون شيئا<br />وكل يوم الاسعار بتزيد<br />وكل يوم بتزداد معاناة الفقراء وهم الاغلبية فى شعبنا<br />اللحمة زادت اربعة جنيهات فى الكيلو هذا الشهر والسكر زاد بنسبة 30 %<br />والارز زاد خمسين قرش فى الكيلو<br />يبقى ازاى هيرفعوا معاناة الفقير<br />كلة كلام فى كلام فى كلام ليقنعوا انفسهم بة<br />ولكن الشعب شايف ويعانى والحكومة كانها تخاطب شعب اخر"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114092640/http://www.20at.com:80/masr/news/14015-2009-11-12-08-01-02.html"

[[comments]]
order = 1
subject = ""
author = "نقطة غيرت المعنى"
posted = "2009-11-12"
text = "مكتوب<br />زكريا عزمي زعيما للمعارضة<br />وضعت النقطة خطأ على الصاد في الكلمة الاخيرة<br />فغيرت المعنى من المعارصة الى المعارضة"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114092640/http://www.20at.com:80/masr/news/14015-2009-11-12-08-01-02.html"

[[comments]]
order = 2
subject = ""
author = "الوجوة القذرة"
posted = "2009-11-13"
text = "مش هو دة بتاع الاتحاد الاشتراكى سابقا<br />وبتاع الوطنى فى بدايتة ايام السادات<br />ودلوقتى بتاع الوطنى ومجلس البرطمان<br />الناس دى الصدأ واكلها<br />والبارومة ضاربة فيهم<br />مش معقول العقول الغبية دى تعيش الفترة دى كلها وكان مصر عقمت ومفيش احد غيرهم<br />مش معقول نصحى وننام 30 سنة وانت تطالع وجوة تطفح بالغباء والجهل<br />مش معقول يارب<br />تعبنا"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114092640/http://www.20at.com:80/masr/news/14015-2009-11-12-08-01-02.html"
