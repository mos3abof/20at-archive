posted = "2009-06-04"
text = "بعد زيارة كلينتون واوباما لمسجد السلطان حسن - كل اطفال الاسر والستات بيتكلموا مع ازواجهم على زيارة الجامع دة<br />اعتقد ان الجامع هيواجة زحيم شديد فى الايام القادمة<br />والسلطان حسن ابن السلطان قلاوون هو من اكبر المقاتلين للامارات الصليبية فى ساحل الشام<br />فالسلطان قلاوون انجب ثلاثة سلاطين<br />محمد بن قلاوون<br />حسن بن قلاوون<br />اشرف بن قلاوون<br />والسلطان اشرف بن قلاوون اخو السلطان حسن هو من انهى اخر وجود وقضى على اخر امارة صليبية متبقية فى فلسطين وشحن الصليبيين منها وكانوا يسمون بفرسان المعبد الى جزيرة مالطة<br />تحية للسلطان قلاوون وابنائة الذين تولوا الحكم والجهاد من بعدة السلطان محمد والسلطان حسن والسلطان اشرف<br />وكثيرا من المصريين يحبون اسماء اشرف وحسن"
archived = "2009-06-07"
capture_url = "https://web.archive.org/web/20090607073458/http://www.20at.com:80/t7kyk/12281-2009-06-04-13-05-22.html"

