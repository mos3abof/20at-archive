text = "السيد اوباما راح المانيا وقال كلام ع[ *** ] اللى قالة<br />قال جملة واحدة<br />على العرب تقديم تنازلات جوهرية لاسرائيل<br />مش فاهم يعنى اية تنازلات<br />نتنازل عن القاهرة وعمان ودمشق لاسرائيل مثلا علشان يرضى اوباما واسرائيل<br />يظهر ان اللى قالة عبد الناصر صح<br />ما اخذ بالقوة لا يسترد بغير القوة<br />وان كل السياسات التى تجرى حولنا علشان تنيمنا لغاية ما يخلصوا على الارض بالاستيطان"
