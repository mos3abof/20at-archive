posted = "2009-06-06"
text = "الى كاتب التعليق رقم(<br />الاخ (بباوى) باشا<br />سي<br />دى الفاضل اوباما موش محتاج يوجهة خطاب للعالم المسيحى من اى مكان؟!!!<br />العالم المسيحى غير محتاج خطب و مواعظ و تلميحات من الحاج(اوباما)<br />اما موضوع ان القدس أسرائيلية فهذ ا ليس كلام يهود و صهاينة؟<br />(اليهود) دول بشر ذى المسحيين و ذى المسلمين (اليهودية)ديانة<br />اما(الصهيونية)ف هذة نزعة سياسية؟!!!!<br />اما ان تقول ان القدس عربية و سوف ترجع عربية؟<br />معلش الواقع دائما ما يكون أكثر الما من الخيال؟<br />أبقى( قابلنى)لو رجعت اى حتة من القدس للعرب!!!<br />الاول نحن العرب علينا الاتفاق و من ثم الاتفاق و من ثم اخيرا الاتفاق على شئى و احد و هو (الاتفاق)على الا (نتفق)<br />هاهاهاهاهاهاهاه اهاهاها<br />و سلملى على العرب"
archived = "2009-06-07"
capture_url = "https://web.archive.org/web/20090607073458/http://www.20at.com:80/t7kyk/12281-2009-06-04-13-05-22.html"

