posted = "2009-06-06"
text = "العالم المسيحى مش عايز خطب<br />العالم المسيحى بيحرق ويقتل ويعذب فى ابو غريب وجوانتمالا ويقتل ويحاصر الالاف فى العراق وفلسطين وافغانستان<br />العالم المسيحى حرق 6 مليون يهودى فى محارق النازية فى المانيا<br />العالم المسيحى قتل اربعين مليون فى الحرب العالمية فى اوروبا وروسيا<br />العالم المسيحى الوحشى مش محتاج توجيهات ولا خطابات لانة عارف هو بيعمل اية<br />انما وحياة راس ابوك القدس عربية وهترجع عربية واسأل ريتشارد قلب الاسد قائد الحملة الصليبية قبل كدة<br />القدس عربية وستظل عربية وستعود عربية"
