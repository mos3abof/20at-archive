text = "اعتدال خطاب الرئيس الامريكي للعالم الاسلامي سببه ضرب بوش بالحذاء<br />فاوباما لا يريد ان يكون مصيره نفس مصير بوش<br />وبوش انضرب بحذاء رجالي<br />ويخشى اوباما ان يكون مصيره الضرب بالشباشب النسائية العربية<br />والعاقل من اتعظ بغيره<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2009-06-07"
capture_url = "https://web.archive.org/web/20090607073458/http://www.20at.com:80/t7kyk/12281-2009-06-04-13-05-22.html"
