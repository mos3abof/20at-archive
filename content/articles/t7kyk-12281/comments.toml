author = "الى the خاري"
posted = "2009-06-06"
text = "اقرأ التاريخ الاسلامي كويس يا زخاري<br />النبي محمد صلى الله عليه وسلم قال في الحديث ان المسلمين سيفتحون القسطنطينية<br />وعاش المسلمون على هذا الحكم طويلا الامويين والعباسيين ولم تتحقق هذه النبوءه<br />ثم بعد ذلك جم المغول والتتار وقضوا على الدولة الاسلامية من اساسها واصبح المسلمون لا دولة لهم<br />فاين نبوءة النبي محمد صلى الله عليه وسلم<br />بعد 500 سنه يا زخاري من انهيار الدولة العباسية<br />فتحت القسطنطينية يا زخاري<br />اقرا التاريخ الاسلامي كويس يا زخاري<br />االيهود هنا يا زخاري بنبوءة قرانية النبوءة بتقول ايه<br />حتى اذا كان وعد الاخرة جئنا بكم لفيفا<br />فوجود اليهود في فلسطين دليل على صدق القران<br />النبوة الثانية بتقول<br />ليسوءوا وجوهم وليدخلوا المسجد كما دخلوه اول مرة<br />واخد بالك يا زخاري<br />القسطنطينية فتحها المسلمون بعد 500 سنه من غزو التتار<br />سلام يا زخاري"
