text = "الزيارة كانت ناجحة بكل المقاييس - كلينتون خلعت حذائها هى واوباما قبل الدخول للمسجد مع ان المرافقين لبسوا الخف فوق الاحذية لاظهار شدة احترامهم للاسلام<br />فى الهرم اصر اوباما على دخول الهرم والوصول الى غرفة الدفن مع حواس<br />تجول حول تمثال ابو الهول برشاقة غزال<br />تقريبا اخذ انطباع جيد جدا عن مصر<br />موقع العربية ذكر انة بعد استقبالة الرسمى بالخيول تناول اوباما افطارا مكون من الفطير المشلتت والعسل الابيض والعسل الاسود والفول والفلافل مع سيادة الرئيس حسنى<br />المهم ربنا يحسن ختام موتى المسلمين"
