[[comments]]
order = 5
subject = "رمضان للعبادة"
author = "ريم00000 السعودية"
posted = "2006-10-09"
text = "والله يا اخ اظن ان خادم الحرمين الشريفين الملك عبد الله ماعطانا اجازة للسنة كلها علشان تقول خمول وكسل وتعطيل ============ انما فقط للعشر الاواخر والنبي صلى الله عليه وسلم اجود مايكون في رمضان وا ذا اتت العشر شد مئزرة وايقض اهله واعتكف ---------- واقول مرة اخرى ليس تعطيل فرمضان ليس كل السنة اعني من سيضمن انه سيعيش للعام المقبل حتى يؤدي عبادة رمضان لاكمل وجه وما اشد تقصيرنا فعسانا ان نلحق باقي رمضان ------------------- ثانيا -------- لم يعطينا الملك عبد الله حفظه الله الايجازه هكذا انما من طلب والحاح من المواطنين وهو يدل على حرصه حفظه الله لراحة المواطنين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123713/http://www.20at.com/article2.php?sid=1323"

[[comments]]
order = 6
subject = "يا ليت الدول العربية تحذو حذو المملكة"
author = "والله فكرة ممتازة فعلا... فعليا الإنتاج يقل في رمضان وساعات العمل تتقلص إلى أدنى حد... فلما لا نأخذ العشر الأواخر إجازة على أن يتم تعويض ذلم في شهور لاحقة حتى لا يتأثر الإنتاج."
posted = "2006-10-09"
text = "ياريت كل الدول العربية والإسلامية تحذو حذو المملكة حتى نتفرغ للعبادة أيضا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123713/http://www.20at.com/article2.php?sid=1323"

[[comments]]
order = 7
subject = "يا جماعة الخير"
author = "بنت حميدو"
posted = "2006-10-09"
text = "السلام علي من اتبع الهدي<br />يا جماعة الخير, رمضان كريم و كل عام و انتم بخير, و لا داعي لكي نختلف, فمادامت النية خير و لله فلندعو الله ان يتقبل منا و منهم , لا داعي لكي تحلل و نفصل القرار علي انه تشجيع للكسل و التراخي, والا فلماذا لا نفصل الاجازة بسبب اعياد رأس السنة و غيرها من البدع بهذا التفسير, ايضا انا اري ان 17 يوم اجازة كثيرة بعض الشيء, فقد كانت في ما مضي 5 ايام فقط الاخيرة من شهر رمضان, و لكن انا لا اعترض بصراحة علي هذا القرار ما دام النية و القصد لله سبحانه و تعالي.<br />و كل عام و انتم و كل الامة العربية الغالية بخير و سعادة ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123713/http://www.20at.com/article2.php?sid=1323"

[[comments]]
order = 8
subject = "العمل عبادة"
author = "فارس"
posted = "2006-10-09"
text = "الاخ صاحب ها التعليق \" فعليا الإنتاج يقل في رمضان وساعات العمل تتقلص إلى أدنى حد \" هذ ليس بكلام صحيح فان الرسول صلى الله عليه وسلم كانت غزواته وفتوحاته فى رمضان والتى هى اشد ضراوة مما نحن فيه هذه الايام ... رمضان شهر عمل ايضا ولكن من مفهومنا الخاطئ للصيام و لرمضان جعلناه اقل انتاجيةواقل فى العمل .. عموما خير ان شاء الله واتمنى ان كل الدول العربية تعمل كده بس فعلا يكونبغرض العبادة ..!!!!!<br />ورمضان كريم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123713/http://www.20at.com/article2.php?sid=1323"

[[comments]]
order = 9
subject = "شكرا"
author = "ريم من----- السعودية"
posted = "2006-10-09"
text = "صحيح مثل ماقالت اختي بنت حميدو -------- ان الاعياد والبدع وخرافات راس السنة التي مانزل الله بها من سلطان تعطى فيها اجازة فلماذ ا اليس تعطيل للاعمال والعباد وتعطيل للدين !!!!!!!!! فاولى ان تكون برمضان ولمن قال الرسول صلى الله عليه وسلم كان يغزو فنحن نقول الغزو شيئ والعمل شيئ اخر فالغزو لابد منه والا سبب الكثير من الهجوم على المصالح وامن الدولة وكان صلى الله عليه وسلم في صدر الاسلام لابد من الجهاد ليبلغ الرسالة =================== ومن جهة اخرى النبي صلى الله عليه وسلم اجود مايكون في رمضان وخصوص بالعشر الاواخر فهو كالريح المرسلة وهو قد غفر الله له ماتقدم من ذنبه ورغب في الاكثار من الطاعات في الشهر الفضيل حيث قال----- عمرة في رمضان تعدل حجة او حجة معي ------ وعسى ان اكون اصبت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123713/http://www.20at.com/article2.php?sid=1323"

