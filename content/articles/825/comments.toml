[[comments]]
order = 2
subject = "عبث وتخدير"
author = "معاذ محمود عامر"
posted = "2006-10-09"
text = "الحقيقة أن هذا القرار يمثل نوعا من العبث والجهل والتلاعب بالدين<br />فهل يعقل أن تتعطل المدارس والمصالح الحكوميةالتي تخدم الناس بحجة العبادة<br />هل التعلم وخدمة الناس وتأدية مصالحهم أقل أجرا من القيام مثلا<br />ان كان القيام سنة<br />فتلك فروض كفاية<br />ان هذا استهتار ونوع من تخدير الناس<br />فنحن نعلم أن الانسان العربي(في كل الأقطار العربية عشان محدش يفهمني غلط) يعاني من الخمول والكسل وعدم الرغبة في العمل والانجاز لذلك استغل عبدالله بن عبد العزيز هذا الوقت لارضاء كسل الناس وتخديرهم<br />ياللانسان العربي يتناسى عقودا من فساد الحكم والعمالة للأمريكان من أجل أجازة أسبوعين(انا برضه بتكلم عن كل العرب عشان الاخوة المتنشنين)<br />ان الأخ الذي قال (ومن جهته يرى \"م.س\" أن كل هذه الإجازة تعطي إيحاء بأن العمل يلهي عن العبادة، وهذا غير صحيح، ويؤدي إلى ضياع كثير من الوقت هباء، والرسول صلى الله عليه وسلم جاهد وحارب في رمضان\".)<br />الأخ ده انسان بيفهم والله<br />هل الاسلام يبدي الاعتكاف والقيام عن العمل والتعلم واقامة ضرورات الحياة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123713/http://www.20at.com/article2.php?sid=1323"

[[comments]]
order = 3
subject = "كلمة كمان"
author = "معاذ محمود عامر"
posted = "2006-10-09"
text = "تذكرت موقفا للعلامة المرحوم الشيخ الغزالي رضي الله عنه وأرضاه<br />كان فضيلته في أحد المصالح الحكومية يقضي أمرا ما<br />واذا بالموظف المسؤل هناك يترك الناس ويهم للقيام<br />فسأله الشيخ : لم تترك الناس وتقوم<br />فأجابه الرجل: أود أن اصلي الضحى قبل دخول وقت الظهر<br />فقال له الشيخ مقولة رائعة: (ليس ما تقوم له بأهون مما تقوم عنه)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123713/http://www.20at.com/article2.php?sid=1323"

