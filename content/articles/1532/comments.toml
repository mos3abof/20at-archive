[[comments]]
order = 0
subject = "مسلمه"
author = "مسلمه"
posted = "2006-04-23"
text = "اللهم حرر العراق من الامريكان<br />اللهم حرر الاقصى من يد اليهود وارزفنا فيه صلاه قبل الممات<br />اللهم انصر المسلمين فى مشلرق الارض ومغاربها<br />اللهم وفق ولاة امورنا وولاة امور المسلمين الى ما تحبه وترضاه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145253/http://www.20at.com/article2.php?sid=724"

[[comments]]
order = 1
subject = "دعاء مستجاب إن شاء الله"
author = "أحمد محمد أبو الليل"
posted = "2006-04-24"
text = "اللهم طهر العراق وكل بلاد المسلمين من الاعداءالنجسين* اللهم انصر الاسلام والمسلمين واعلن بفضلك وكرمك كلمتي الحق والدين *اللهم انصر المسلمين في العراق وفلسطين وانصر المسلمين في مشارق الارض ومغاربها*اللهم اهلك الامركان وشتت شملهم واقلل عددهم واجعل الدائرة عليهم (امين يا رب العالمين)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145253/http://www.20at.com/article2.php?sid=724"

[[comments]]
order = 2
subject = "سيبوهم"
author = "مجدي"
posted = "2006-04-26"
text = "يا ناس خلو العراقين بحالهم يشوفو مستقبلهم ما لنا وما لهم<br />ليه كدا ايام الملعون صدام الكل ساكت واليوم عندما تحررو منه انقلبنا ضد شعبه<br />احنا العرب تعصبنا للاسف اعمى<br />يختارومن يشائون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145253/http://www.20at.com/article2.php?sid=724"

[[comments]]
order = 3
subject = "الله همه سدد خطاهم"
author = "صادق عبدالله"
posted = "2006-04-29"
text = "الله يسدد خطهم لما فيهي خيرالشعب العراقي ونصرهم على من عاداهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145253/http://www.20at.com/article2.php?sid=724"

[[comments]]
order = 4
subject = "جلال الطلباني"
author = "العبيدي"
posted = "2006-08-08"
text = "العراق ليس بحاجه الى شخص يعمل لمصلحة الكردتحت غطاء رئيس العراق انه يفتن العرب انه فتنهارجومن العرب الانتباه اليه كونه اذاحدث كذب اته يريد كركوك وينفصل عن العراق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145253/http://www.20at.com/article2.php?sid=724"
