[[comments]]
order = 1
subject = "شكراً لكم موقع عشرينات !!!"
text = "أرسل هذا التعليق بواسطة : محمد نواف الحمدالله ..<br />موقع عشرينات أنتم موقع لاتراعون حرية التعبير عن الرأي بكل شفافية ومصداقية ونزاهة .. فهنيئاً لكم عاركم !!!<br />موقع عشرينات أنتم من قائمة المواقع المسماة ب \" المواقع الغبية .. وبلا حدود \" .. فهنيئاً لكم عاركم !!!<br />موقع عشرينات أنتم أناس مسيسون ومستحكمون من قبل أناس هم أغبى من أنفسهم قبل أن يكونوا أغبى منكم .. فهنيئاً لكم عاركم !!!<br />موقع عشرينات أنتم تفتقرون لمعايير ومقاييس الأخلاق والإحترام والآداب .. فلا عجب بأن تقوموا بحذف التعليقات التي هي صحيحة بلا شك .. لأنكم موقع يخاف على نفسه كثيراً .. فهنيئاً لكم عاركم !!!<br />موقع عشرينات أنتم أتفه وأحقر موقعه رأته مقلتي، لا لأنكم مسحتم تعليقي وتعليقات الناس \" لا \" .. لأنكم لاتريدون بأن يظهر الحق ويزهق الباطل \" خسئتم أنتم ومن معكم ومن يسير على شاكلتكم وأمثالكم \" .. فهنيئاً لكم عاركم !!!<br />موقع عشرينات لقد أصبحتم في الحضيض أو على وشك أن تصبحوا .. وهذا أمر طبيعي لأنكم لاتعرفون شيئاً ثمين بالحياة الأ وهو \" الحرية \" .. فهنيئاُ لكم عاركم !!!<br />موقع عشرينات أنتم .. أنتم .. أنتم .. فعلاً، سأمشي على شعاري وفلسفتي بالحياة :<br />\" لانجد دائماً مانريد .. ولكن !!! .. أن نبذل مانستطيع .. !!! \" :::::::::::::::: فهنياً لكم عاركم المجيد !!! ::::::::::::::::"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052628/http://doha2006.20at.com:80/article.php?sid=4548"

[[comments]]
order = 2
subject = "للللللللل"
text = "أرسل هذا التعليق بواسطة : بيييي<br />القطيفي يا اخو الزانيه يا ولد المنبوذه يا خنيث كسس امك محد غيرك يبوس رجل السني وعيري فيك وبأشرف شييعي على عيري ولاتنسى السعوديين والسنه تاج على راك وراس اكبر شيعي معاك ختفووووووووووووووووووووووووو على قض امك البالوعه قضها بالوعه من كثر ماينفتح من الشيعه"
archived = "2008-12-23"
capture_url = "https://web.archive.org/web/20081223052628/http://doha2006.20at.com:80/article.php?sid=4548"
