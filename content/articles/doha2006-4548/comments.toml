subject = "هاهاههه"
text = "أرسل هذا التعليق بواسطة : يا ابا الفضل العباس<br />اي مالله يتمنيكوا بعدين يجو يبوسو رجايلنا احنا القطيفين ونخرق قضوضهم<br />ويرتاحوا وبعدين يتخنفوا يا بعضهم خخخخخخخخخ تفو على السنه"
