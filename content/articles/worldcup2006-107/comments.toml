[[comments]]
order = 5
subject = "الازورى الرائع"
author = "مجدى الجبالى"
posted = "2006-07-06"
text = "بكل فنون الكوره امتعونا الايطاليين بمهارة الفن الكروى الرائع وبقوة الاراده وهزموا الماكينات الالمانيه فى عقر دارهم ولا اصف سعادتى وسعادة عدد غيرمن المصريين اصدقائى فى ايطاليا بفرحتهم بفوز ايطاليا ومقابلتهم الديوك الفرنسيه فى النهائى وسيفوزوا ايضا على فرنسا وسيعيدون امجاد ايطاليا 82 الثلاثى المرعب باولوا روسى وتاردللى والتوبيلى<br />الف الف مبروك للمنتخب الايطالى الرائع"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074753/http://worldcup2006.20at.com:80/article.php?sid=107"

