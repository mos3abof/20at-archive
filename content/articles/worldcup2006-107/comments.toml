[[comments]]
order = 2
subject = "حمص"
author = "جهاد"
posted = "2006-07-05"
text = "مبروك للطليان باالفوز ولكن اللعب كن للالمان وتحية مني الى الى المان ولعبهم الرائع والجميل ولا يهم المونديال القادم سوف يكون من نصيب المان ان شاء الله واما الطليان فسوف يخرجون من الونديال في الدور الاول كما حدث في مونديال كوريا واليابان واتمنى من الله ان نحصل على المركز الثاني وبا التفوق واطلب من المشجعين المان ان لا يزعلو بل يفرحو با الفوز با الرغم من الانتقلدات الكثيرة لهم والسلام مع التوفيق ونيل المركز الثالث والسلام جهاد eagle"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074753/http://worldcup2006.20at.com:80/article.php?sid=107"

