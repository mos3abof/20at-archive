author = "محمد الششتاوي"
posted = "2010-01-06"
text = "لو بتتكلم كادارة فده حقها بغض النظر؟<br />لانه في شركات بتحصل على منح مقابل تشغيل الستات وده يندرج في الادارة الحديثة تحت اطار social responsibility بصراحة لو كنت مدير هابقى مضطر اعمل كده اني اركزهم في مهام ادارية لانهم مش هايفدوني زي الراجل في المهام البدنية قد العقلية.<br />خد عندك مثلا نسبتهم في الشركات المصرية 18% يتركزوا باكثر من 40% في الادارات ورغم كده لو لقيت انهم يمثلوا 2% من اهم منصبين رئيس مجلس ادارة او مدير تنفيذي يبقى لك عندي حق عرب يمكن نسبهم اعلى في وظائف السكرتارية ..<br />وبغض النظر مش هاقلك اني مع ان الست تبقى مديرة هي ممكن تتظلم في حالات كثيرة بسبب ده بس اقيمها بكفائتها للاسف مافيش برده عدل في التعامل مع النقطة دي واذا في واحدة في مصر احنا كرجالة بنتعامل معاها بنفعية فلوس جاية من وراها.<br />وبعدين ده يعتمد على الخلفية الي انت عايزها من المدير اذا انت عايز منه البعد المالي الدراسات الاحصائية في الHR بتقولك ان الست بتهتم بالبعد ده عن الراجل اما اذا عايز واحد يراعي الادارة بابعادها المتداخلة ممكن تدي افضلية للراجل."
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107091545/http://www.20at.com:80/20at/lifestyle/14766-2010-01-05-16-21-46.html"

