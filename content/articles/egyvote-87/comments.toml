[[comments]]
order = 14
subject = "ماذا تنقمون من عمرو خالد"
author = "زائر"
posted = "2005-12-08"
text = "عليقات المعترضين على المقال والرد عليها بعض تعليقات المؤيدين للمقال<br />ماذا تنقمون من عمرو خالد<br />الحمد لله والصلاة والسلام على رسول الله<br />أما بعد<br />فلقد سارت الركبان بأخبار عمرو خالد وامتلأت أسماع الدنيا من أشرطته ولقاءاته وتنافست وسائل الإعلام على نشر حواراته وتسارعت الدول والمؤسسات والهيئات إلى استضافاته وزخرت رفوف المكتبات من كتيباته وغدا له في كل حدب وصوب ما الله به عليم من معجبيه ومعجباته .<br />ثم ظهر مع ذلك مجموعة من أهل العلم الشرعي وطلابه يسلقونه بألسنة حداد لم يدخروا وسعا في بيان زلاته وهناته ، ويطعنون فيه وفي نشاطاته ...<br />وفي هذا المقال نقول لهؤلاء وبمسمع من عشاق ومريدي عمرو خالد الداعية المشهور :<br />ماذا تنقمون من عمرو خالد ؟؟؟<br />هل تحسدونه على شهرته التي طبقت الآفاق ؟؟ أم غرتم من كثرة أتباعه ومحبيه ؟؟ أم أن السبب ما فتح عليه من أموال يجنيها من الفضائيات والمنشورات السمعية والمرئية والمقروءة ؟؟؟ أم السبب قربه من المسئولين والطبقة العليا من أصحاب النفوذ في شتى بلاد المسلمين بل في بلاد الكافرين أيضا ؟؟ أم ماذا ؟؟<br />حسدوا الفتى إذ لم ينالوا سعيه فالقوم أعداء له وخصوم<br />وهل لم يبق من تنكرون عليه في هذا الزمن المليء بالفتن إلا عمرو خالد الذي كان سببا في هداية الكثيرين وإخراجهم من الضياع ؟؟<br />أقلوا عليهم لا أبا لأبيكمو من اللوم أو سدوا المكان الذي سدوا<br />وجواب هؤلاء ومن وافقهم على الإنكار على عمرو خالد مع تفاوت درجات هذا الإنكار هو :<br />لا والله ما أنكرنا عليه لشيء من ذلك وما نقمنا منه شيئا لأجل ذلك بل نشكر له جهوده ونظن به خيرا ولا نغالي مثل من اتهمه بالعمالة والدجل والتمثيل على الناس لأغراض خفية ونحمد الله أن انتفع به طائفة من الناس كادوا ينس<br />اقرأ بقية التعليق .."
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102031820/http://egyvote.20at.com:80/article.php?sid=87"

