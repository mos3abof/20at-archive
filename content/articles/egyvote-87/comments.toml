subject = "إخواني لكم الله"
author = "أخوكم إبن القدس المحتلة"
posted = "2005-11-30"
text = "خواني أحبائي لكم الله , قلبي يعتصره الألم عندما أرى مثل هذه الممارسات ضد من قالوا ربنا الله , ليحاولوا ان يحجبوا الشمس بالغربال.<br />لك الله يا مصر كما لك الله يا قدس , لك الله يابغداد كما لك الله يا دمشق فكلنا في الهم شرق.<br />وأسأل : هل دمنا يكون زكياومطلوبافقط عندما تنتهك الحرمات كما في بغداد اليوم,أو عندما يراد لنا أن نكون \"مجاهدين\" حسب الطلب الأمريكي كما كنا هناك مجاهدين في أفغانستان إبان اغزو الروسي .......... وبعد ذلك إذ أتضح للقاصي والداني أن أولئك إرهابيون بعد أن استقر الخال وولى الروس وسادت أمريكى.<br />لأكم الله ولنا جميعا ........."
