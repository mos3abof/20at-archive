text = "ع احترامي الكبير والكامل لمراسلكم عبد المنعم محمود وان كنت شخصيا لست من قراءه وليس ممن يشدوني في الموقع ، إلا أنه واضح انه ماكانش في المكان الصح ، ذلك لأن الدخيلة شهدت ماهو أفظع وأشد وأسوأ من هذا الفيلم بمراحل كبيرة جدا<br />لكن هي الصحافة كده اللي تحصل عليه تضخم فيه وخلاص<br />نصيحة لمحرري الموقع الأفلام اللي بجد اللي بيها أحداث أفظع ممكن تحصلوا عليها ممن كانت وظيفتهم يوم الدخيلة هي التصوير وليست ممن كانت وظيفتهم نقل الخبر والواقع<br />والظاهر كده انه اللي حصل في الدخيلة من الواضح انه عمره ماحتشوفه العين<br />سلااااااااااااااام"
