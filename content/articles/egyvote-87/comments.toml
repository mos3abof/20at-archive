[[comments]]
order = 17
subject = "مريم فى تل أبيب"
author = "مريم أحمد مصطفى"
posted = "2005-12-12"
text = "لسلام عليكم و رحمه الله و بركاته<br />أولا بالنسبه \"أسوشيتدبرس‏:‏ التصويت في المرحلة الثالثة جري دون تدخل من الأمن\" أنا شاهد عيان لما حدث في الأعادة يوم السبت الماضى 26/11 فى دائزة الدخيلة<br />ملحوظه أنا لم أشارك في أى أنتخابات لا مجال لمناقشة ذلك الأن و لكنى كان لى نصيب أن أتواجد هناك في ذلك اليوم المشمس ... اليكم التلى<br />كنت في طريقى الي المنزل _ أنا ساكنه فى العجمى البيطاش _ من المعتاد أن نمر على هذه المنطقه فهى على مسارالمينى باص من محطة الرمل للبيطاش المهم أنا كنت راكبه فى أمان الله و عند وصلنا الي مسرح الأحداث (الدخيله) كانت الساعه الخامسه بعد صلاة المغرب مباشرتا عند عند مسجد ناجى بالتحديد (مسجد مشهور بالدخيلة) وجدنا حشد من الناس يسد المسار الطبيعى للمينى باص اللى كنت راكباه و طلب ضابط الأمن المركزى من السائق أن يغير مساره الى طريق جانبى وكان الباص بتعنا من الرواد بعد دخولنا فى الطريق مسافه لا تتعدى 10 متر وجدنا أكثر من 50 شخص (بلطجى) بيجروا ورانا مسكين سيوف و خناجر و... ده غير ؟أن منظرهم أصلا مرعب المهم حاول السائق الهروب بالباص الا أنهم ألقوا بالحجارة علي الزجاج فسقط كل زجاج الباص المثير للدهشه أن الأمن المركزى أسعفنا بألقاء قنبلة غازيه مسيله للدموع داخل العربيه<br />مازال السائق جزاه الله خيرا يحاول لأنقذنا فجئنا بأطلاق الرصاص علي عجل العربيه أضطرنا النزول بعد أستنشاق كل هذا السم - حسبنا الله و نعم الوكيل - بعد النزول وجدنا الأمن المركزى و البلطجيه منهم لله ربنا ينتقم منهم جميعا بيجروا ورانا و معاهم اللى ذكرته أعلى . تخيلوا وجود سيده عجوزه معانا في الباص لم أراها الا و قد سقطت من ذلك الغاز اللعين و طفله عندها ربو وجدت أمامى بوابة عمارة فلم أجد حلا الا الدخول فيها فسمعت أص<br />اقرأ بقية التعليق .."
archived = "2008-01-02"
capture_url = "https://web.archive.org/web/20080102031820/http://egyvote.20at.com:80/article.php?sid=87"

