text = "لحقيقة .... صعبت عليا ... يا تري إنت فين دلوئتي يابني ؟؟؟؟<br />بس ده مكنش عندك بس .... أنا يومها كنت في البحيرة كانت بهدلة ... وباليل رجعت اسكندرية كان ضرب نار في دائرة غربال ..<br />اللي برضه الإخوان منزلين فيها مرشح ...<br />وعلي الرغم ان نفس الكلام حصل فيها ... ضرب نار وقنابل ... وتقفيل لجان ... وبلطجة .. وقبض علي كل المندوبين و الوكلاء بتوع مرشح الإخوان أسامة جادو ...<br />بس ربك لما يريد ... رغم كل ده ... ربنا كتب له الفوز ... ويكتسح المرشح الجميل بتاع الوطني ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
