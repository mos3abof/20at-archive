author = "مدخن شره"
posted = "2010-01-26"
text = "انا من عشاق التدخين ولم أعر انتباها للحملة السابقة لأن ما فيها كان عاديا ومتداولا ( سرطان - أمراض القلب والشرايين - إلخ )ولكن هذه الحملة الجديدة اقولها لكم وبكل صدق قوية جدا جدا جدا لما لها من تأثير على الرجال من المدخنين وهو بالطبع الأغلبية<br />فأكثر ما يؤثر بنفسية الرجل هو التشكيك برجولته او الشك فى انها ستصبح فى خطر<br />وعليه الحمد لله انا بطلت تدخين من يومين واتمنى ان استمر فى إصرارى<br />وزى ما قال المثل ( الضنى غالى )"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091346/http://www.20at.com:80/masr/hot-topics/15048-2010-01-25-18-32-35.html"

[[comments]]
order = 1
subject = ""
author = "نيفين نيفى نوفا"
posted = "2010-01-26"
text = "هاى يا عشريناتيه<br />معلش بغيب ف التعليقات اصلى ماشيه على مبدا عمرو دياب اغيب اغيب و اسال عليه<br />عجبنى جدا التعليق السابق<br />يا رب الصوره الجديده تاثر على اخواننا المدخنين بس انا حاسه اننا بندن ف مالطه لان لو مفيش اراده داخليه محدش هيبطل حتى لو رسمو لكل مدخن صورته هو و هو بيموت"
archived = "2010-01-29"
capture_url = "https://web.archive.org/web/20100129091346/http://www.20at.com:80/masr/hot-topics/15048-2010-01-25-18-32-35.html"

