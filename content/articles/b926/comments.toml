subject = "عصابه"
author = "ايه"
posted = "2006-06-13"
text = "انا حاسه من الموضوع ان الاستاذه هبه بتتكلم عن عصابه مش بتتكلم عن دوله اسلاميه لان باختصار محتاجين نكتب تاريخنا كله مره اخري لفهم كل شيء مش عثمان نفيب ابو ذر ايه يا ستي ده هو احنا في عصابه مش كفايه كتب المدرسه اللي بتشوه التاريخ الاسلامي وكمان انتي تاتي وتخليه كفته<br />حرام عليكم الواحده تاهت خالص هو احنا في حرب ولا ايه ولا هي فعلا عصابه واحنا مش عارفين حاجه غريبه يا جدع"
