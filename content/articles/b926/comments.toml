[[comments]]
order = 8
subject = "مسكين يا ابا ذر ..."
author = "ABDALLAH ETTOUNSSI"
posted = "2006-06-12"
text = "شهدت الدولة الإسلامية الفتوحات والأموال وزاد الترف، وليزداد الأغنياء غنا والفقراء فقرا،.......<br />'' فَهَلْ عَسَيْتُمْ إِن تَوَلَّيْتُمْ أَن تُفْسِدُوا فِي الْأَرْضِ وَتُقَطِّعُوا أَرْحَامَكُمْ''<br />فرفع أبو ذر العصي، فدفعا بها في صدر كعب، وقال: يا بن اليهودي ما أجراك علي القول في ديننا؟<br />اكثرالاحاديث المكذوبة على رسول الله من هذا المنافق....<br />\"\"\"فقال عثمان: ما أكثر أذاك لي!! غيب وجهك عني فقد أذيتنا\"\"\"<br />اخلاق الخليفة الثالث ...<br />\"\"\"فعمل عثمان علي نفيه إلي الربذة، \"\"\"<br />لاحول و لا قوة إلا بالله ينفى ابو ذر و يولى معاوية إبن هند أكلة كبد حمزة على الشام ...<br />\"\"\"إلاّ علي بن أبي طالب وعقيلاًَ أخاه، وحسناً وحسيناً عليهما السلام، وعمّاراً بن ياسر\"\"\"<br />رِجَالٌ صَدَقُوا مَا عَاهَدُوا اللَّهَ عَلَيْهِ فَمِنْهُم مَّن قَضَى نَحْبَهُ وَمِنْهُم مَّن يَنتَظِرُ وَمَا بَدَّلُوا تَبْدِيلًا ...<br />وودع علي أبا ذر قائلاً له: \"إنك غضبت لله، فارج من غضبت له، إن القوم خافوك على دنياهم، وخفتهم على دينك، فاترك في أيديهم ما خافوك عليه،<br />علي مع الحق و الحق مع علي يدور معه حيث دار.....<br />\"رحمكم الله يا أهل بيت الرحمة، إذا رأيتكم ذكرت بكم رسول الله(ص)، ما لي بالمدينة سكن ولا شجن غيركم،"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123540/http://www.20at.com/article2.php?sid=926"

[[comments]]
order = 9
subject = "اخطات سيدتي"
author = "ابو شامل"
posted = "2006-06-13"
text = "ابو ذر ليس ثائرا للفقراء فقد اعترض بعض العلماء علي هذا المسمي فكيف نسميه ثائرا للفقرا فيكون ذلك في مجتمع يظلم الفقراء وياخذ حقهم وهذا ما تنافي مع ما انزله الاسلام من عدل فهل كان مدافعا للفقراء في عهد الرسول اذا اسانا للرسول وهل كان مدافعا في عهد ابي بكر اذا ابا بكر لم يعدل ام هل دافع عنهم في عهد عمر الفاروق العادل ام في عهد ذو النورين عثمان بن عفان سيدتي سيدنا ابا ذر كان فكرا جميلا في الزهد لكنه لا يمثل فكرا لمجتمع باكمله فمثلنا نحن كل مننا له منهج في الحياه المهم ان الاسلام يحكمنا وقد اتسم ابو ذر بالزهد ولكن عند طلب الاماره من النبي قال لهم النبي انها ثقيله اي تحتاج لرجال يفهمون طبائع البشر ويعدلون وانا لا اعيب علي سيدنا ابا ذر رضي الله عنه بل فقط اقول قد كان فكرا وهذه هي جماليات الاسلام ان كل الافكار فيه الفقراء سيدتي لم يظلمو قد في عهد الدوله الاسلاميه ولما لما ياتي بعده بسنوات عهد عمر بن عبد العزيز عهد الرخاء الذي لم يشهد له التاريخ فهل ظلمو الفقراء سيدتي في عهد الاسلام ان تلك تهمه دون ان ندري نحتاج لان نراجعها فكيف يكون هنا ثوره للفقراء في عصر الاسلام الذهبي وافضله وهل هي ثورات بحق ام شيء اخر ولماذا لم نقرا في التاريخ الاسلامي عن تلك الثورات كلها<br />ابا ذر ليس ثائرا للفقراء فلم يكن هناك عصر ظلم لهم في ذلك الوقت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123540/http://www.20at.com/article2.php?sid=926"

