[[comments]]
order = 12
subject = "واحد"
author = "انا مش عارف بعض الناس مخهم ضيق قوي و هيضيقوا خلقنا معاهم"
posted = "2006-06-13"
text = "انا مش فاهم ايه اللي مش عاجبكم يعني في المقال<br />المقال لا يعقد مقارنات بين سيدنا عثمان وسيدنا ابا ذر ولا يسيء الي احد منهم وانما هو سرد تاريخي لاحداث معروفه<br />وصحيح ان فترة الخلاف الراشدة هي كانت افضل فترات التاريخ الاسلامي لكن هذا لا يعني انهم كانوا ملائكة تمشي علي الارض<br />فهو كاي مجتمع صحيح كانت توجد به صراعات وتباين في وجهات النظر<br />والفتنه لم تكن بعيده عن عصر سيدنا عثمان<br />فنحن نتكلم عن بشر في النهايه وليس ملائكه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123540/http://www.20at.com/article2.php?sid=926"

[[comments]]
order = 13
subject = "أنا شامم ريحو وحشة"
author = "صلاح الدين"
posted = "2006-06-26"
text = "اقتباس(1)<br />فعمل عثمان علي نفيه إلي الربذة، وجاء في شرح النهج عن ابن عباس، قال: \"لما أخرج أبو ذر إلى الربذة، أمر عثمان، فنودي في الناس، ألاّ يكلم أحد أبا ذر، ولا يشيّعه، وأمر مروان بن الحكم أن يخرج به، فخرج به وتحاماه الناس، إلاّ علي بن أبي طالب وعقيلاًَ أخاه، وحسناً وحسيناً عليهما السلام، وعمّاراً بن ياسر.<br />الرابح غدًا<br />وودع علي أبا ذر قائلاً له: \"إنك غضبت لله، فارج من غضبت له، إن القوم خافوك على دنياهم، وخفتهم على دينك، فاترك في أيديهم ما خافوك عليه، واهرب منهم بما خفتهم عليه، فما أحوجهم إلى ما منعتهم، وأغناك عمّا منعوك، وستعلم من الرابح غداً، والأكثر حُسّداً، ولو أن السماوات والأرضيين كانت على عبدٍ رتقاً ثم اتقى الله، لجعل الله له منهما مخرجاً.<br />لا يؤنسنّك إلاّ الحق، ولا يوحشنّك إلاّ الباطل، فلو قبلت دنياهم لأحبّوك، ولو قرضت منها لأمّنوك\".<br />ثم تكلم عقيل، والحسن، والحسين، وعّمار بن ياسر، بكلمات تعبر عن صوابية موقف أبي ذر، وتدعوه إلى الصبر على الشدائد، فبكى أبو ذر، وكان شيخاً كبيراً، وقال: \"رحمكم الله يا أهل بيت الرحمة، إذا رأيتكم ذكرت بكم رسول الله(ص)، ما لي بالمدينة سكن ولا شجن غيركم، إني ثقلت على عثمان بالحجاز، كما ثقلت على معاوية بالشام، وكره أن أجاور أخاه وابن خاله بالمصرين، فأفسد الناس عليهما، سيّرني إلى بلد ليس لي به ناصر ولا دافع إلاّ الله، والله ما أريد إلاّ الله صاحباً، وما أخشى مع الله وحشة<br />اقتباس (2)<br />اخلاق الخليفة الثالث ...<br />\"\"\"فعمل عثمان علي نفيه إلي الربذة، \"\"\"<br />لاحول و لا قوة إلا بالله ينفى ابو ذر و يولى معاوية إبن هند أكلة كبد حمزة على الشام ...<br />عاجبك الكلام ده يا سي مفتاح؛ ده ترديد لاتهامات غلاة التشيع لسيدنا عثمان رضى الله عنه بدليل تخصيص الحسن والحسين رضى الله عنهم بكلمه عليهم السلام.<br />ياسادة سيدنا على كان من أغير المسلمين على عديله عثمان؛ بدليل أنه خلف الحسن والحسين على باب سيدنا عثمان أثناء الفتنة وعنفهم ومحمد بن طلحة بن عبيدالله عندما استطاع القتله الرعاع النفاذ إليه<br />كما ان كعب الأحبار كان صحابي جليل حسن إسلامه؛ ولم يرد في سيرته ما يشوبها.<br />أما صاحبنا(واحد) المتضايق فأقول له : هذا هو سرد المدلسين والمغرضين بانتقاء كل ضعيف ومضطرب من كتب التاريخ؛ وليتكم تقارعون بدون أقنعة يا تلامذة ابن العلقمي و أحفاده؛ من باعوا بغداد الأمس واليوم.<br />اخيرا اشكر ريهام وايه وابو شامل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123540/http://www.20at.com/article2.php?sid=926"

