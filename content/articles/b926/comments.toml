[[comments]]
order = 15
subject = "يارب ارحمنا برحمتك"
author = "واحد"
posted = "2006-07-10"
text = "ايه يا عم صلاح الدين فيه ايه يا قلبي<br />ايه اللي دخل ابن العلقمي في الموضوع<br />يا حبيبي انا مسلم سني يعني كل الصحابه علي راسنا من فوق يا سيدي ولا يحتاجون شهادتي او شهادتك<br />لكن في اي مجتمع متحضر يتناول التاريخ بالنقد والتمحيص ليس من اجل الاساءه الي احد ولكن من اجل التعلم والتدبر وتجنب تكرار الاخطاء<br />ورغم كده هو انا قلت حاجه تمس اي حد<br />ولا انت الطائفيه جعلتك غير موضوعي وتضع علي لسان الناس ما لم يقولوه<br />رحمتك يا رب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123540/http://www.20at.com/article2.php?sid=926"

