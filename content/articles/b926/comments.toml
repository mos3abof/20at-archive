subject = "جزاك الله خيرا كثيرا"
author = "احمد حميد"
posted = "2006-06-11"
text = "جزاك الله خيرا يا اختنا الفاضلة على هذا المقال الجميل .الموضوع في مجملة رائع ولقد اعجبني كثيرا موقف سيدنا ابو ذر من الاغنياء ووقوفه بجانب الفقراء حيث ان زكاة المال لم تكن تكفي لسد حاجة الفقراء<br />نأمل أن يعي الاغنياء هذا الدرس جيدا<br />وهذا يحثنا على الانفاق في وجوه الخير ولا سيما الفقير والمحتاج في مصر وفلسطين<br />نسأل الله ان يفك اسر المسجد الاقصى وان ينصر اخواننا في حماس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123540/http://www.20at.com/article2.php?sid=926"

