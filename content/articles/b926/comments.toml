[[comments]]
order = 6
subject = "exile"
author = "The story of such a great guy is a dilemma for the advocates of the Islamic state who claims that everything can be done as el sahabah did it according to divine regulation. Here we see el sahabah differing about a central point in any state"
posted = "2006-06-12"
text = ": أولهما: خاص بما علي الإنسان في ماله.. هل عليه الزكاة فقط؟ أم ما هو أكثر من ذلك؟؟<br />ثانيا: مدي حرية الخليفة والسلطة الحاكمة في التصرف في أموال الدولة بالأخذ والعطاء؟؟<br />The fact they had opposite points of view means that there is no clear guidance in el Quran and a secular approach must be used to decide.<br />Another important thing in this story is how the Islamic state handles the opposition even when it comes from the most sincere people, they are sent to forced exile and prevented form communicating their ideas to anybody."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123540/http://www.20at.com/article2.php?sid=926"

