[[comments]]
order = 1
subject = "اتقوا الله"
author = "شعبان عبد الرحيم"
posted = "2006-03-21"
text = "الأمير تشالرلز لم يدخل المسجد وتجول في أروقة الجامعه فقط... فلنتقي الله ولا نفتري لمجرد حب الإفتراء والأمير له مواقف طيبه تجاه الإسلام كان أولى ان تسلطوا الضوء عليها بدل أن تألبوا كل العالم ضدنا وتساوو بين المتشدد والمعتدل<br />ملاحظه:<br />أعلم أن اغلب من يترددون على هذا الموقع من الشباب المراهق الصغير في السن والخبره بالحياة ولذا أتمنى من الكبار أن يمارسوا دورهم التربوي والتوعوي."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124759/http://www.20at.com/article2.php?sid=600"

[[comments]]
order = 2
subject = "وانا معك"
author = "بيبرس"
posted = "2006-03-22"
text = "يعني تركنا يا كاتبه المقال كل شيء وتحدثنا عن الحذاء ولو راجعتي الارء الفقهيه في ذلك لعلمتي اشياء اكثر عن الحذاء والصلاه وراجعي التاريخ جيدا ثم ان ذلك الرجل من اكثر رجال اوربا احتراما للدين الاسلامي براي الكثير من العلماء ولها اشياء كثيره للاسلام فهل نجازيه بمقالات تافهه بسبب شباب مراهق صغير ليتكم تحدثتم عن خطبته الشهيره في عام 1993 ودعو المسائل الفقهييه والعلميه لاصحابها وتزكرو كيف كان اليهودي يدخل المسجد ايام النبي وتزكرو احترام النبي للاخر وكفانا غبائنا بهذه الدرجه ولنرجع لرشدنا مره اخري ولنفعل شيء حقيقي للاسلام لان ان نظل ننقد حتي نموت من النقد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124759/http://www.20at.com/article2.php?sid=600"

[[comments]]
order = 3
subject = "الأمير تشارلز"
author = "عابر القارات"
posted = "2006-03-22"
text = "و الله يا إخوانى أنا من المعجبين بالأمير تشارلز و فعلا بأكنله كل إحترام بغض النظر على موضوع علاقته اللى أستمرت حوالى 30 سنة مع زوجته الحاليه كاميلا و عموما طالما أتجوزها و صلح غلطته يبقى خلاص و طبعا ده سلو بلدهم بل حتى أنى أزعم أنه مسلم بس فى السر علشان يحافظ على برستيج العائلة المالكة لحسن الشعب يكرشه من قصر باكينجهام هو و أمه و جدته و يروح فين بأولاده ويليام و تامر ... أسف أصلى مش فاكر أسم الواد التانى إيه ... المهم الراجل ما شوفناش منه غير كل خير و إحترام و السلام ختام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124759/http://www.20at.com/article2.php?sid=600"

[[comments]]
order = 4
subject = "علي فكره"
author = "ربيع"
posted = "2006-03-22"
text = "علي فكره يا شباب مفيش اي مشكله ان الانسان يدخل المسجد او يصلي بالحذاء انما المشكله مهما كان ما قاله الامير تشارلز وهما كان ما يعتقده فلا ينبغي ان يمنح الدكتوراه الفخريه للازهر ده برضه مهما كان مش مسلم<br />عموما مش غريبه من الحاج/ محمد سيد طنطاوي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124759/http://www.20at.com/article2.php?sid=600"

[[comments]]
order = 5
subject = "يووووووووووووووووووووه"
author = "بيبرس"
posted = "2006-03-22"
text = "فيها ايه لما حتي واحد يهودي ياخد دكتوراه من الازهر هل يكون عن علم ام عن ملته سبحان الله الازهر موسسه تعليميه اسلاميه يعطي شهادات فخريه لمن خدمو الاسلام سواء مسلم او يهودي او مسيحي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124759/http://www.20at.com/article2.php?sid=600"

[[comments]]
order = 6
subject = "اتقوا اللة"
author = "من المرحظ ان الموقع يريد ان يثير اي بلبلة علي الفاضية والمليانة اريد ان اقول لكاتب المقال اتقي اللة فهناك صورة منشورة في الاخبار لتشارلز وهو يخلع حذاءة قبل دخول المسجد و تقف بجانبة كاميلا وهي مرتدية طرحة علي راسها وبلبس محتشم"
posted = "2006-03-22"
text = "لماذا احس ان هذا الموقع يريد ان يثير الفتنة بين الشباب بتركيزة علي الامور التافهة ويكبرها ويقدمها في اسوأ صورة حتي يثير غضب الشباب<br />لماذا لم يركز من كتب المقال علي اهمية هذة الزيارو وما قالة تشارلز عن الاسلام واكيد هذا الكلام سيكتب في صحف عالمية وذلك في ظل الحرب التي يواجها الاسلام حاليا في الغرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124759/http://www.20at.com/article2.php?sid=600"

[[comments]]
order = 7
subject = "بلا خيبه"
author = "ناصر"
posted = "2006-03-27"
text = "انتوا بتتكلموا على دخوله الازهر بالجزمه مع انه ما عملهاش على ما اعلم و ناسيين جامع زى جامع محمد على فى القلعه اللى بيحلوه كل يوم بالجزم و لابسين جيبات تحت الوسط و لا مش لابسين خالص<br />بلا هم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124759/http://www.20at.com/article2.php?sid=600"

