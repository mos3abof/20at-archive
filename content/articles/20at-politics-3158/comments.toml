text = "مكتوب على الفلسطيني ان يعيش مقهورا سواء كان يعيش في بلده المحتل او خارجه.<br />للاسف بعض الشعوب العربية واقول البعض تعاير فلسطينيو الشتات بأنهم اهل خيام وكثيرا ما يمنون عليهم بأنهم اسكنوهم بلادهم وارضهم وبانهم اصحاب فضل وخير عليهم فإن حدث واعترض هذا الفلسطيني على وضعه فإنهم يسارعون بالقول انظروا الى هؤلاء الفلسطينيين كم هم ناكروا الجميل.<br />اسال الله ان يحرر ارضنا عما قريب اللهم امين"
