text = "انامن اشد المعجبين بيه طلعت السادات بيدافع عن حقوقنا وعن مصالحناوانا من رايى ان الحكومة كلها تتغير وخصوصا محافظ الاسكندريةالجديد الناس مش عايزه بتكره وفعلا مفتقدين المحجوب بجد هما عايز الشباب تسرق وتبيع مخدرات وبعدكده يقولوا احنا عندنا ارهاب وانا عايزة اطلعت السادات يدافع عننا دايما واحنا معاه فى كل حاجه يعملهاعشانهو امين بيكلم على كل حاجه"
