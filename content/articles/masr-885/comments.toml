[[comments]]
order = 7
subject = "نشر اليوم فى الوفد"
author = "غيبوبه"
posted = "2006-09-07"
text = "أخيراً أسدل الستار علي قضية بني مزار التي شغلت الرأي العام لعدة شهور قضت محكمة جنايات المنيا ببراءة محمد علي أحمد عبداللطيف المتهم بارتكاب مذبحة قرية شمس الدين في بني مزار، كما قضت برفض الدعوي وإلزام رافعيها بالمصروفات أصدر الحكم التاريخي المستشار محمد عبدالرحيم اسماعيل رئيس المحكمة وعضوية المستشارين محمد علي السيد وأمجد وطني مهران. قالت المحكمة في حيثيات البراءة ان الجريمة حار فيها جهابذة الطب الشرعي وتضاربت التقارير الطبية الشرعية،<br />كما حار فيها جهابذة الطب النفسي وتضاربت التقارير النفسية وأن الجناية بذلت فيها ادارات البحث الجنائي جهداً علي أعلي مستوي وبذلت فيها ادارة الادلة الجنائية جهداً ملموساً مستخدمة أحدث التقنيات وأحدث الاجهزة الفنية العالمية لجمع الادلة لكن طبقاً للقاعدة الشرعية فالثابت انه خير للإمام أن يخطئ في العفو من أن يخطئ في العقوبة وطبقاً لنص المادة »304« و»309« من قانون الاجراءات الجنائية قضت المحكم ببراءة المتهم. وعقب صدور الحكم تعالت صيحات التكبير وألقت قوات الامن القبض علي شقيق المتهم البريءواقتادته لمكان غير معلوم"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910073215/http://masr.20at.com:80/article.php?sid=885"

[[comments]]
order = 8
subject = "حسبنا الله ونعم الوكيل وما ربكا بظلامن للعبيد"
author = "لسان الحق"
posted = "2006-09-07"
text = "يا شباب مصر يا شباب العرب انتو زعلانين ليه مهو احنا اتعودنا علي كده واحنا كلانا عرفين كويس جدا اني الضعيف والغلابان في البلد دي لازم ميكونش ليه حد يسنده لكن الحكومه عارفه كويس اني الغلبان ده سنده في الدنيا هو ربنا ومفيش غيره لانه هو القادر علي كل شيء ذي مهو كان قادر اني يخلي امراءه العزيز تعترف علي خطائها بالابتلاء الاتهام بالظلم والبهتان المبين لنبي الله يوسف وانا علي فكره من بلد المتهم بس احب اعرفكم حاجه ازي يا شباب اني محمد يعمل جريمه زي دي مع العلم بان في ناس من الاي اتقتلو كان ليهم اهلم معاهم في البيت بالاضافه اني الجريمه حصله بدون صدور اي اصوات من المجني عليهم دي يدل علي اني المجني عليهم قتلو وهم مخدرين بالاضافه اني البلد دي محدش يقدر يعمل فيها الكلام ده الاي ناس اصحاب خبره بالبلد دي لان البلد دي تعتبر في اطراف بني مزار واني الطريق بتاعه معروف وهي بلد مغلقه واني البيوت فيها علي الطريق الوحيد للبلد القضيه اكبرمن اني شخص واحد يقوم بيهابالاضافه الي اني الجسس وجدت وهي مقطعه باسلوب لايقوم بيهي الاي محترفين في الجراحه العامه(اي دكتور ذو خبره عاليه)ويارت يكون واحدبس دي جريمه اقيمت بواسطه اكثر من دكتور وكان فيهم ناس ليه الخبره في كيفيه اجراء الجريمه بدون الكشف عن البصمات لاي احد من القائمين بالجريمه وكل الاي نقدر نقوله ونحن في قمه الاسف والالام ان لله وانا اليه راجعون وانا اليه لمنقلبون وان حسبناالله ونعم الوكيل وهو القادر علي كشف كل ما هو مسطور انا بئئويد الاستاذ العظيم طلعت السادات وده شي عمره مكان غريب علي عائله السادات اني يكون هو بيدافع عن الحق احنا نقول اني هو وحش يعني ديما ومنذكرش في البني ادم الاي عيوبه الاشياء الجميله ليه منذكرهاش انا كنت اتمنااني الاستاذ طلعت يكو<br />اقرأ بقية التعليق .."
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910073215/http://masr.20at.com:80/article.php?sid=885"

[[comments]]
order = 9
subject = "ربنا يوفقك"
author = "مصرى"
posted = "2006-09-07"
text = "ربنا يوفقك يا طلعت ياسادات أظهرت الحق ورحمت إنسان بريء من حبل المشنقة ليظل إنسان قذر جالس فى مكانه فى الوزارة ويدارى خبته القوية فى الفساد<br />وبعد أن أنتهت القضية سأقول لك أنت وبتوفيق من الله محيى جهاد الزعيم مصطفى كامل والزعيم محمد فريد فى قضية مصر ضد الفساد والشعب كله معك فأنا أراك وأنت تتكلم عن فسادهم بمنتهى الشجاعة والقوة ونتمنى أن تقود مصر وبمنتهى الشجاعة والقوة للقضاء على فساد اللامبارك وحثالته والشعب كله معك"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910073215/http://masr.20at.com:80/article.php?sid=885"
