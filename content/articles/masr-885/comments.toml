[[comments]]
order = 2
subject = "..& هى دى حكومتنا .. هنتوه عنها يعنى؟ ! &.."
author = "..& هيكل الأزهرى &.."
posted = "2006-09-05"
text = "والله يا جماعه انا مش مستغرب ولا حاجه هى دى حكومتنا تخصصها فى الكدب والخداع وقلة الحيلة هقولكم على حاجه محزنة امبارح اما روحت ولأنى محروم من مشاهدة الفضائيات لأن الدش عقبال عندكم مرة واحدة وقف المهم روحت اتفرج على قناة النيل للأخبار واشوف اخبار القطر ايه المهم روحت هناك وبفتح لاقيت طبعا اول اخبار عن سيداة الريس ربنا يريحه مننا قريب يارب قولوا آمين .. وبعدين لاقيت الكدابين بيقولوا إن المصابين 28 مصاب وكلهم هيطلعوا فى غضون ساعات طيب يا كدااااابين ساعات ازاى واللى اتقال منكم برضه إن فى واحدة مصابة حامل حصل لها كسور ونزيف كمان هل دى كمان هتخرج فى غضون ساعة ؟ , ادى حكومتنا وطلعت السادات انا بحبه لانه مش بيحب يتجمل وبيتكلم بلغته وفعلا حاسس بالغلابة لكن اعرف عنه شوية اخبار مش تمام محبش اقولها لانه احسن من كتير جدا جدا غيره موجودين يالله ربنا يهدينا جميعا ويخرب بيت حكومتنا قريب قولوا آمين ."
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910073215/http://masr.20at.com:80/article.php?sid=885"

