subject = "فعلاً طلعت السادات معاه حق"
author = "احمد خميس"
posted = "2006-09-06"
text = "بجد أنا سعات لما بسمع طلعت السادات وهو بيتكلم عن فساد الحكومة ببقى متمنية أنه يحكم مصر علشان هوه ده إللى يقدر يقود الشعب للقضاء على مبارك وحثالته القذره ولكنى أقول له لو قدت الشعب فى مرحلة العصيان المدنى للقضاء على مبارك فالشعب سيرشحك لرئاسة مصر عن كفاءة وتقدير"
archived = "2006-09-10"
