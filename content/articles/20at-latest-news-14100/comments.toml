text = "اول مره اشوف سكينه فى ماتش والاخ الاردنى يخرص لانه يعتبر منهم بس دول الكلاب الجزائريين الحيوانات اولاد الحيوانات والايام جايه وبكره هنشوفمو هتعملوا ايه بعد ما صعدتم وبطوله افريقيا جايه ويارب تيجوا فى مجموعه مصر وتشوفوا بقى اللى هيحصلكوا يا كلاب"
