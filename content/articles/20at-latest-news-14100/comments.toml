posted = "2009-11-20"
text = "يا إخواني كفاكم شتما للجزائريين<br />الفيديو الأول مصور لنادي جزائري كان في الدور الثاني وصعد إلى الدور الأول إسمه نادي اتحاد الحراش، تم تصوير الفيديو قبل مباراة يونيو بكثييييير<br />الأولى بالاتهام هم من بدأوا برشق الحجارة على اللاعبين الجزائريين أثناء طريقهم إلى الفندق في القاهرة ما أدى إلى جرح ثلاثة منهم، أقول لاعبين وليس مناصرين"
