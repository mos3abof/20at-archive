[[comments]]
order = 33
subject = "كلنا عرب ومسلمون"
author = "عبد الله المسلم"
posted = "2006-07-16"
text = "سبحان الله<br />ينااااس...انحن اخوان عرب ومسلمين ليش نسب بعض....ترى الكفار ومن عاونهم يحبون مثل هذه المواضيع التي تثير الفتن بين المسلمين ..<br />يانااااس ....يامسلمين..لاتقعدون تسبون بعض واليهود يتفرجون عليكم<br />لازم نقف صف واحد كما وقفنا صف واحد في وجهه الدنمرك..<br />أمركم عجيب ... والكلام موجه للجميع ... لماذا هذا الحقد على السعودية.<br />ألهذا لأنها أرض الرسالة النبوية ولأنها أرض الخير ولأنها من دخل بها أصبح آمناً وناعماً في الرزق.<br />يا ناس ما يجوز اللي يسب في الدين و البلد هذا ...<br />اللي مو معجبه شيء في السعودية فيا أخوان مو مجبورين أنكم تشتغلون فيها أو تسكنون فيها.<br />هذا نحن يالعرب ... جيدنا نسب في بعض...<br />ما أقول إلا : لاحول ولا قوة إلا بالله العلي العظيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115030/http://www.20at.com/article2.php?sid=271"

