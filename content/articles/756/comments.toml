[[comments]]
order = 3
subject = "ليس خطأ.. و ليست السعودية فقط"
author = "السلام عليكم"
posted = "2006-01-17"
text = "اولا انا لست من السعودية بل من الامارات<br />و ثانيا انا مع حجب المواقع وفقا لشروط و اسباب متفق عليها<br />و مثل ما قلت انا من الامارات ، و عندنا واحدة من افضل شركات الاتصالات في الشرق الاوسط ان لم تكن الافضل فعلا ، وعندنا نفس الموضوع ن يتم حجب بعض المواقع ، و ايضا في استمارات يمكن من خلالها طلب فتح موقع مغلق او العكس ، و ايضا احيانا مواقع مافيها اي مخالفات لا شرعية و لا سياسية و لا اي شئ و يتم حجبها ن الخطأ في كل مكان .. يعني انا كنت اتابع موقع للكمبوتر من اروع ما يكون و ليس به اي مخالفات و لكن في الامارات الموقع محجوب ، ممكن بالخطأ او ممكن نظام الحجب يعمل بطريقة معينة ...<br />بس الحجب الحمد لله افادنا كثيرا ، يعني على الرغم من انه لا يمكن حجب كل المواقع الفاسدة الا انه بالحجب كميتها تقل و ابناءنا يكونون في مامن بعض الشئ من سهولة الوصول للمواقع الفاسدة المشهورة<br />و انا مع حجب المواقع الفاسدة سياسيا ايضا ، مثلا في مواقع ليست فقط لمعارضة الحكومات و انما للتحريض بشكل فاسد جدا ممكن يؤدي الى انه يطلع بسببها شباب ينتهج منهج التفجير و القتل و تدمير البلد .<br />و في مواقع تلعم كيفية صنع الاسلحة و القنابل بشكل صريح ، فهل الافضل ان تحجب هذه المواقع او نتركها للناس و بعد ذلك نولول على المصائب و التفجيرات !!!<br />احترم جدا انظمة الحجب في شركات الاتصال اي كانت ، و اذا كان فيه بعض الاخطاء في تنفيذ الفكرة فاتمنى ان تؤخذ بعين الاعتبار ليتم لااستفادة من تقنية الحجب بشكل مفيد لنا<br />سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115030/http://www.20at.com/article2.php?sid=271"

