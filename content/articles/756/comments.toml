subject = "السعودى المتخلف"
author = "عربى قرفان"
posted = "2006-01-19"
text = "اذا انتا السعودى فرحان قوى ان العرب عموما بيشتغلوا عندك وشايف نفسك عليهم فانتا فعلا متخلف لان بيعملوا الشغل اللى انتا المفروض تشتغلوة فى بلدك لكن علشان انتا تنبل وغاوى نسوان وفاضى بس للرد السافل .......... انتا سعودى<br />وبعدين ترفع راسك على اية جاتك خيبة عندك مخترع ولا ابتكار ولا صنعتم حاجة<br />انا اللى بعرفة عن السعودية اعلان سيارة لو مينا السيارة الامريكية للعائلة السعودية ......... يمكن يكون دة مصدر فخرك<br />كفاية عليك كدة جايز تبقى بنى ادم وتحترم نفسك وتعرف ان العرب والمسلمين كلهم زى بعض والرسول علية الصلاة والسلام قال خيركم اتقاكم"
