subject = "ياسلامي عليكم يالسعوديه بس..."
author = "القحــــــ505ـــاني"
posted = "2006-09-02"
text = "سياسة الحجب في المملكة مافيها تدقيق ولا شيء المفروض الحجب للمواقع المخلة بالآداب بس ليش حجب المواقع الإسلامية الأخرى هل لأنها تخالف المذهب إذا كان كذلك فهذا الفعل قد يؤدي في النهاية إلى فتنة طائفية وهنا مواقع تثير الفتن ولكنها لاتحجب أتعرفون لماذا ؟؟ لأنها توافق رأي هذه السياسة السيئة السمعة بين السعوديين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115030/http://www.20at.com/article2.php?sid=271"

