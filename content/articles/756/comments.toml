subject = "سياسة إسلامية الأصل..!!"
author = "محمد-القاهرة"
posted = "2006-01-17"
text = "الحجب يا أخوة هو سياسة إسلامية الأصل....أى ربانية المنبع...و لك أن تطلق العنان فى التفكير فى هذا الأمر....<br />لقد أمر الله سبحانه و تعالى بالحجاب للمرأة و سطر هذا الأمر فى القران الكريم..و النقاب سنة و محبب...فهل يا سيدى الفاضل من تمكنت منه إرادة الشر و عزم على إتيان الفاحشة سيمنعه شىء؟ بالطبع لا-سوى إرادة الله وحده-و لكن هذا لا يقلل إطلاقا من أهمية الحجاب العظيمة و من دوره الهام فى تقليل الفواحش؟....أم أنك ستنتقد أمر الله عز و جل؟ و هو الأعلم بالنفس البشرية؟<br />و هكذا...تأمل فى الشريعة الإسلامية..أليست الحدود هى صورة للمنع و الحجب؟<br />أنا من مصر و لا أعلم ما يحدث فى المملكة السعودية بالضبط..و لكن كونهم يتحكمون فى مواقع أخرى لمجرد إنها على غير هواهم أو لأسباب سياسية أو ثقافية فهذا أمر اخر و هو بالطبع لا يتوافق مع شريعة الإسلام و التى تقضى بالحرية و التنوير."
