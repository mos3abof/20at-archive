author = "سعودي وبس==="
posted = "2006-08-22"
text = "الي يتكلم عن الكعبة هذا جاهل وحقير لمذا لا ينظر لنفسه أولا والله انها فتن كما قال عنها الرسول صلى الله عليه وسلم كيف تجرأأيها الحقير على ان تتكلم في بلاد الحرمين التي انبعث منها نور الاسلام وهي مهبط الوحي ويلك ثم ويلك من الله وش دخل بلاد الحرمين في الصفحات المحجوبة ليش ما تسأل نفسك ياحيوان؟"
