author = "عربى قرفان"
posted = "2006-01-25"
text = "بتتكلم عن بلاد الحرمين ؟<br />هيا الدمام بلاد حرمين ولا الطائف ولاجدة<br />يابهايم السعودية انتم دولة زى اى دولة ولعبة بلاد الحرمين دى العبها على حد تانى الحرمين هما مدينتى مكة والمدينة ........ اما انتا فسعودى اى من دولة السعودية وانتا يامتخلف مبتخوفنيش من كلمة اللعنة اللى حتزل عليا لما افوق حمار سعودى واعرفة الحقيقة<br />اما مسالة العقد النفسية فواضح مين فينا اللى عندة عقد<br />جاتكم القرف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115030/http://www.20at.com/article2.php?sid=271"

[[comments]]
order = 17
subject = "ال سعود فوق كل الصغائر"
author = "سعودي محظوظ جدا"
posted = "2006-01-27"
text = "للكلب اللي يشتم ال سعودالكرام :<br />يا متخلف جيب لي دوله بالعالم كله تنفق على بيت مقدس ما تنفقه السعوديه في العام للكعبه المشرفه ! ال سعود اسيادك و اسياد اسيادك بعد ..<br />عطني دوله عربيه طبق القصاص على امير فيها ! ال سعود اللي خلو العدل ياخذ مجراه و اقامو دوله اسلاميه و تمسكو بالشريعه ، لمعلومتك يا جاهل مافي دوله بالعالم ترضى على امرائها لكن السعوديه و ال سعود ابو الا ان يقام الحد حتى على الامير فيهم .. ولكنك جاهل احمق .. اكيد انك انسان معقد سافل غبي حقير معدم فقير ماعندك غير افكار هادمه و نفس خسيسه مهما اكرمت تمردت .. ماتدري ان عصيان ولي الامر او ايقاظ فتنه حرام !قاتل الله الجهل..قاتل الله الجهل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115030/http://www.20at.com/article2.php?sid=271"

