subject = "أيها الحاقدون صه ."
author = "فواز من بلاد الحرمين (السعودية)"
posted = "2006-01-20"
text = "سبحان الله<br />أمركم عجيب ... والكلام موجه للجميع ... لماذا هذا الحقد على السعودية.<br />ألهذا لأنها أرض الرسالة النبوية ولأنها أرض الخير ولأنها من دخل بها أصبح آمناً وناعماً في الرزق.<br />يا ناس ما يجوز اللي يسب في الحكومة أو البلد هذا ...<br />اللي مو معجبه شيء في السعودية فيا أخوان مو مجبورين أنكم تشتغلون فيها أو تسكنون فيها.<br />هذا نحن يالعرب ... جيدنا نسب في بعض...<br />ما أقول إلا : لاحول ولا قوة إلا بالله العلي العظيم<br />أخوكم في الإسلام<br />فواز العصيمي"
