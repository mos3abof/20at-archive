[[comments]]
order = 5
subject = "نفس الشخص اللي فوق"
author = "أخي الفاضل واحد معدي"
posted = "2006-01-17"
text = "لو تسمحلي ارد على النقاط اللي طرحتها حضرتك<br />ثانيا : بالنسبة للمواقع الإباحية ، فإنها نفسها تحرص على ألا يراها من لا يجدر بهم ذلك ، فتجدهم دائما يؤكدون على الزائر انه فوق السن المسموح ، و غيره من الإجراءات ، بالإضافة لــ\"إن اللي عاوز يجيب حاجة مش هيفرق معاه حجب\"!!<br />و ردي : ما شاء الله الحرص عندهم عالي جدا !! يعني يضعون المواضيع الاباحية عيني عينك للناس و يطلبوا من الناس \" انه يكون عندهم ضمير \" فاللي اقل من العمر المطلوب من نفسه لازم ما يدخلش الموقع !!!<br />و صح اللي عايز حاجة هيجيبها مثل ما قلت بس هل هذا معناه انه خلاص مادام كده ارفع ايدي و اترك الفلوس للحرامي في الشارع<br />اعتقد انه الامور لا تترك ابدا للذمة و الضمير فقط يا اخي ، و الا لماكان فيه لزمة للعقوبات التي وضعها الاسلام ، يعني هل من المنطقي اني اترك الامر لضمير الانسان و بعدين ااتي لاعاقبه<br />ضمير الانسان و دينه هو الوازع الاقوى و لكن ايضا على الحكومات ان تضع ما يساعد الانسان على ضبط نفسه لانه مش كلنا بفس الوازع الديني<br />و ان كنت انت الحمد لله واثق من نفسك و لا تحتاج لاي حد يملي عليك ما يجب ان تشاهد و تفعل ، فانا لا اخجل بان اعترف انني لست بهذا الوازع الديني القوي و اخاف على نفسي من نفسي ، و الحمد لله امور مثل الحجب هذه قد تساعدن و لا تضرني فازعل ليه ؟<br />ثالثا : في مواقع دولية لحجب أو الاحتجاج على أي موقع أيا كان ، او جهة ترسل بريدا أيا كان مثل abuse.net ..<br />و ردي هو : و ايضا لا مانع انه يكون فيه مواع محلية لكل بلد ، لانه ببساطة قناعات الجهة الدولية لا تتضمن القناعات الخاصة بالبلدان و معتقداتها ، و ليس فقط الاسلام، بل حتى في جهات مسيحية تقوم بطلب منع بعض الكتب اذا كان فيها مخالفات لدينهم او عقيدتهم، انا كمواطن مسلم عربي لي معتقدات خاصة ، و يجب ان اهتم بها شخصيا كدولة عربية و ليس ان اعتمد على التشريعات الدولية و انتسب اليها بدون ما يكون لي شخصيتي الخاصة<br />رابعا : كان في تجربة ناجحة في مصر ، حيث قامت بعض الشركات الموفرة لخدمات الانترنت بتوفير خطوط انترنت خالية من المواقع الإباحية (أكرر الإباحية فقط) ، أي نعم كانت أغلى شوية بس مثل هذه التقنية لابد أن تتبع ، لا ما تفعله المملكة الآن<br />و ردي هو : الحمد لله في هذه النقطة ان مع الحجب ، فما الفرق اذا بين الخدمة اللي تقدمها السعودية و ين خدمة مصر هذه ؟؟؟ لا ارى اي فرق<br />اذا كان الفرق في انه اسس الحجب تختلف في الحالتين و نوع المواقع يختلف الا انه في النهاية حجب أليس كذلك ؟؟<br />خامسا : لو ظهرت لي مثل تلك العبارة \"هذه الصفحة غير مسموح بها\" ، فانا سأشعر بإهانة بالغة ، حيث سمح آخرون لأنفسهم أن يحددوا ما علي أن أراه و ما لا يجب أن أراه ، و هي نقطة تحذر منها كل الشركات المصنعة للتقنية في العالم ، و بسببها رفعت بعض القضايا ضد مواقع شهيرة مثل جوجل !!<br />و ردي هو : انني قد اتضايق فقط عندما اكون مية بالمية متأكدة انه الموقع ليس فيه ما يخل او يخالف الدين ، لاني سأزعل انهم اخطأوا في حجب موقع مفيد ، اما المواقع الفاسدة فأشكرهم عليها و اشكرهم على انهم يعينوني على نفسي كما قلت سابقا<br />أخيرا : احنا ثقافتنا الإسلامية أقوى و أكثر تماسكا من أي ثقافة أخرى ، يبقى مش احنا اللي مفروض نخاف من الثقافات الأخرى بل هي اللي تحذر منا ، و لكن الذي يحدث هو العكس تماما!!<br />و ردي هو : الحمد لله انه \"ثقافتنا \" فعلا اقوى ، و لكننا يا اخي لسنا الاقوى في هذا الزمن ، و ثقافة القوي هي التي تعمم و هي التي يحصل لها \"عولمة \" و بالتالي فحاجة ما تزعلش اننا نخاف على ثقافتناو على انفسنا من هذا الهجوم ، لانه ما نراه في الجرايد و التلفاز و الانترنت و جهات الاعلام ليس \"ثقافة اسلامية \" كما ارى و الا لما كنا خفنا منها ... نحن نحب ثقافتنا لذلك نخاف عليها<br />و نحب ابناءنا و اخواننا لذلك نخاف عليهم من الثقافة الاخرى المعولمة<br />و الى ان تصبح ثقافتنا هي الاقوى و في المقدمة نمليها على الاخرين و لا يملون علينا ثقافاتهم فانه يجب علينا ان نطبقها على نطاقنا المحلي<br />هذا فقط رايي و اتمنى اني ما اكون ضايقتك<br />و لكن اللي خلاني ارد انه كلامك ذكرني ببيت شعر يقول :<br />ألقاه في اليم مكتوفا و قال له ... اياك اياك ان تبتل بالماء<br />بالفعل حرام اننا نجيب البلاء لابناءنا و اهلنا ثم نلومهم على انهم فعلوا الخطأ ، لو هو ده الحل و الصح يبقى كان مش مهم نهدم الاصنام في زمن النبي صلي الله عليه و سلم و نخليها و نطلب من الناس انهم يكونوا مؤمنين جدعان و ما يعبدوج الاصنام<br />و كان كفاية جدا على الصحابة انهم لما يأتي امر منع شرب الخمر كان كفاية عليهم انهم يخلوا زجاجات الخمر في البيت و في المخزن و عشان دينهم قوي مش هيشربوها حتى لو كانت قدامهم ، كان كفاية قوي و ما كنش في داعي انهم يكسروها في الشوارع حتى تصبح كالنهر الجاري ...<br />اللهم اهدنا فيمن هديت ، و اهدي حكوماتنا لما تحبه و ترضاه يا كريم<br />و السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115030/http://www.20at.com/article2.php?sid=271"

