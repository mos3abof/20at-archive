author = "عربى قرفان"
posted = "2006-01-20"
text = "ياعم السعودى بدل الحقد وكلام التخلف بتاعكم ياسعوديين الموضوع زى مانتا شايف بيتكلم عن حاجة مش موجودة فى الدنيا هيا ان بعض صفحات النت عندكم محجوبة .... المقال بصراحة كان محايد بيطرح ظاهرة وبس لامع ولا ضد يطلع واحد سعودى زيك يتكلم على تاج الراس والكلام السعودى الفارغ يبقى مين الغلطان ؟؟؟؟؟؟؟؟؟؟؟<br />وبصراحة انتم ياسعوديين حاجة تقرف عايشين فى الوهم اما حكاية اللى موووووو عاجبة الشغل فى السعودية اقوللك ياحبيبى انتا بتيغى غصب عنك ( الجزمة فوق رقبتك ) تضحك على العرب وترميلهم ملاليم وتمص دمهم اقصد ان العرب ياعينى مش قاعدين على باب السعودية مستنيين الحسنة الحكاية استغلال جامد جدا منكم وانا عندى واحد صاحبى بيحلفلى انة بيشتغل اكتر من 12 ساعة فى اليوم والمرتب 2000 ريال بيروح نصهم فى السكن والرسوم العالية جدا فبلاش تعيشوا فى الوهم جاتكم القرف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115030/http://www.20at.com/article2.php?sid=271"

[[comments]]
order = 13
subject = "اليمن"
author = "صالح الأديمي"
posted = "2006-01-21"
text = "حسبي الله ونعم الوكيل... الله يهديكم يا جماعه هل وصلنا لهذه الدرجة كل واحد جالس يسب ويلعن في الثاني أنتم مسلمون<br />أما بخصوص تعليق واحد معدي فإني أقر رد الأخ الذي بعنوان نفس الشخص اللي فوق بكل ما قاله وكماجاء في قوله تعالى: ( وَلْتَكُنْ مِنْكُمْ أُمَّةٌ يَدْعُونَ إِلَى الْخَيْرِ وَيَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنْ الْمُنْكَرِ وَأُوْلَئِكَ هُمْ الْمُفْلِحُونَ )[آل عمران: 104], وقوله تعالى: ( كنتم خير أمة أخرجت للناس تأمرون بالمعروف وتنهون عن المنكر وتؤمنون بالله ولو آمن أهل الكتاب لكان خيرا لهم منهم المؤمنون وأكثرهم الفاسقون )[آل عمران: 110], لذا فأنا أشيد بجهود جميع الأخوة والجهات التي تساهم في صد هذا الغزو الفكري وتساهم في حجب الموافق الإباحية المحرمة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115030/http://www.20at.com/article2.php?sid=271"

[[comments]]
