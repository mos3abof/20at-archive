subject = "انت سعودي ,,, تاج فوق راسي"
author = "سعودي عز"
posted = "2006-10-08"
text = "وش عليكم عاجبنا كذا سياسة ال سعود ونعم بهم ياحبيلهم واحد واحد ان شاء الله يحجبون العالم كله عنا يعجبنا كل شيئ منهم [[[[[[ تاج العرب السعودية وتاج كل سعودي مسلم على وجه الأرض]]]]]] وبعدين ياكلاب لا أحد يتكلم في السعودية ياملاقيف احنا عاجبتنا<br />السعودية كذا وش دخلكم .<br />اما اللي يقوله بعض الكلاب بنرجع نرعى غنم<br />ما هو عيب لان الرسول كان يرعى الغنم<br />وأصلا قالها الملك فيصل رحمه الله لأمريكا ان<br />السعوديين يكفيهم التمر واللبن والماء<br />وبعدين اللي يقول ان الرياض وجدة ليست بلاد الحرمين . اقوله كل تبن السعودية بلاد الحرمين من جازان في الجنوب إلى تبوك في<br />الشمال ومن الدمام في الشرق إلى جدة في<br />الغرب وبعدين شوف ملكنا وشوف رؤساءكم<br />ياثور وبعدين شوف حتى الكلبة كوندليزا<br />رايس ما تجي السعودية إلا وهي لابسة لباس<br />ساتر ماهو زي عندكم حتى البنات في الشوارع<br />ينتاكوا لا حسيب ولا رقيب .<br />الحمد لله والشكر اني سعودي وبعدين شوفوا<br />أصلنا الرسول محمد كان بمكة وانتم من<br />اصلكم فرعون يادافع البلا الحمد لله على كل<br />حال .<br />اللهم يارب تخرس لسان كل من يتكلم في<br />السعودية وآل سعود<br />الله يحفط خادم الحرمين الشريفين الملك<br />عبدالله بن عبدالعزيز آل سعود<br />وأتحدى ان في دولة تطبق الشريعة الاسلامية<br />زي السعودية ونفتخر بالشيء هذا ,,,<br />أمر من الله لعباده في سورة التوبة آية28<br />و آية 29 وفكروا فيها وتفهمون قصدي<br />بارك الله في هذه الدولة وأبقاها على عزهاوحفظ لها قادتها<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
