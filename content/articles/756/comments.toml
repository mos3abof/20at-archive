author = "فواز العصيمي"
posted = "2006-01-21"
text = "عربى قرفان يبدو بأنك تعاني من مرض نفسي الدليل على أختيارك لهذا الاسم ( عربي قرفان) صه ثم صه ... فلا تنجس بلاد الحرمين بلسانك الوسخ ... كف عن هذا وإلا أتتك جائحة وعقوبة من الله .<br />اللهم من أرد الإسلام وأهله وبلاد الحرمين بسوء فأشغله في نفسه وأجعل تدبيره تدميره ياشديد العقاب.<br />والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115030/http://www.20at.com/article2.php?sid=271"

