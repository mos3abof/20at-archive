[[comments]]
order = 0
subject = "ضد سياسة الحجب!"
author = "واحد معدي"
posted = "2006-01-16"
text = "اولا : تقوم المملكة بمثل هذا الحجب لمنع مواقع \"ترى\" هي انها مضرة ، فمثلا تم حجب موقع الأستاذ عمروخالد و معظم مواقع الأناشيد الإسلامية على طريقة \"سياسة تجفيف المنابع\"<br />ثانيا : بالنسبة للمواقع الإباحية ، فإنها نفسها تحرص على ألا يراها من لا يجدر بهم ذلك ، فتجدهم دائما يؤكدون على الزائر انه فوق السن المسموح ، و غيره من الإجراءات ، بالإضافة لــ\"إن اللي عاوز يجيب حاجة مش هيفرق معاه حجب\"!!<br />ثالثا : في مواقع دولية لحجب أو الاحتجاج على أي موقع أيا كان ، او جهة ترسل بريدا أيا كان مثل abuse.net ..<br />رابعا : كان في تجربة ناجحة في مصر ، حيث قامت بعض الشركات الموفرة لخدمات الانترنت بتوفير خطوط انترنت خالية من المواقع الإباحية (أكرر الإباحية فقط) ، أي نعم كانت أغلى شوية بس مثل هذه التقنية لابد أن تتبع ، لا ما تفعله المملكة الآن<br />خامسا : لو ظهرت لي مثل تلك العبارة \"هذه الصفحة غير مسموح بها\" ، فانا سأشعر بإهانة بالغة ، حيث سمح آخرون لأنفسهم أن يحددوا ما علي أن أراه و ما لا يجب أن أراه ، و هي نقطة تحذر منها كل الشركات المصنعة للتقنية في العالم ، و بسببها رفعت بعض القضايا ضد مواقع شهيرة مثل جوجل !!<br />أخيرا : احنا ثقافتنا الإسلامية أقوى و أكثر تماسكا من أي ثقافة أخرى ، يبقى مش احنا اللي مفروض نخاف من الثقافات الأخرى بل هي اللي تحذر منا ، و لكن الذي يحدث هو العكس تماما!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115030/http://www.20at.com/article2.php?sid=271"

