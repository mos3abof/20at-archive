text = "السلام عليكم<br />بصراحة ماادري ليش معظم الناس ضد السعودية وضد حكومتها؟؟؟؟؟<br />مرررة تعجبت من ردود بعضكم؟؟<br />__________________________<br />عاشت السعودية وحكومتها الله يعزها ويديمها<br />ومادامها تمشي على شرع ربها لن يصيبها شي بإذن واحد أحد<br />وكل دقيقة أقصد كل ثانية أحمد ربي إني سعودي<br />واللي يتكلمون هذا الكلام البذئ محا يضروننا بشي إلا إنهم يعطون صورة سيئة عن أنفسهم وبس!!!!!!!<br />ولاتنسون خير الناس أتقى الناس!!!"
