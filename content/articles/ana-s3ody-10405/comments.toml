text = "أحدث صيحات الدعارة في مصر.. توصيل فتيات الليل للمنازل<br />اشار موقع المصريون الاخباري الى ظهور صيحة جديدة في عالم الدعارة تشهدها الشوارع الكبرى بالقاهرة والجيزة المعروفة بانتشار فتيات الليل بها وعلى رأسها شارع الهرم.تتمثل الصيحة الجديدة ووفقا للموقع المقرب من التيار الاسلامي في تخصيص عدة سيارات ملاكي من نوع فيات 128 وعدد من سيارات التاكسي لتوصيل بائعات الهوى لمنازل الزبائن راغبي المتعة وذلك مقابل أجر يبلغ 300 جنيها.. فقط.. لا غير"
