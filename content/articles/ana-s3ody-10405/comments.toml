text = "مستشفى مخالف يتسبب في وفاة سعودية بمصر<br />القاهرة - نور الدين محسن<br />تسبب طاقم طبي وتمريضي في إحدى المستشفيات الخاصة بمصر في وفاة مريضة سعودية بعد أن هربوا وتركوا المرضى. وتوفيت المريضة السعودية (دليلة إبراهيم عبدالمجيد) 57 سنة متأثرة بهبوط حاد في الدورة الدموية بسبب جلطة في الرئة، وقد تم العثور على ثلاثة سعوديين أجروا عمليات زراعة كلى بنفس المستشفى المخالف للقوانين في مصر، وذلك بعد أن داهمت لجنة من وزارة الصحة المصرية المستشفى بعد ورود معلومات عن قيامه بزرع كلى والاتجار في أعضاء البشر.<br />وقد بدأت النيابة المصرية التحقيق في الحادثة<br />هل الحادثة رد على جلد الطبيبين المصريين ؟؟؟؟؟؟؟؟"
