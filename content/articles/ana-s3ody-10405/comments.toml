text = "الاخ الذى طلب العنوان البريدى اشكرك لاهتمامك<br />وبريدى الالكترونى هو<br />d.sameer_1961<br />yahoo.com<br />واهلا وسهلا بمن يريد التواصل معى<br />والى الذى اسمى نفسه المحامى اقول لك لن ادخل فى مهاترات مع امثالك لانك انسان بذئ<br />اتضحت الامور للجميع انت احضرت اسم احد الفتايات من صحيفة عندما اظهروا نتيجتها ما المشكلة؟<br />فتاة كانت بالجامعة واخطأت وجاءتنى مع اهلها لعمل عملية ترقيع.<br />اقول لك اذهب الى الجحيم انا لا اخاف شيئا فلدى المستندات والاقرارات. لا يهمنى سفارة السفهاء<br />لان الموضوع الان تم نشره موثقا على عدة مواقع اجنبية وتم نشره على موقع سى ان ان تحت موضوع<br />كبير عن اهمية غشاء البكارة فى السعودية وقريبا سيناقشوننى على قناة سى ان ان وسترى كم سيكون<br />صدى هذا اللقاء على القناة فى العالم العربى.<br />اما السفيه سليمان فلا تعليق او حوار لى مع الاطفال.<br />تقبلوا تحياتى."
archived = "2009-04-29"
capture_url = "https://web.archive.org/web/20090429033609/http://www.20at.com:80/ana-s3ody/10405.html"

