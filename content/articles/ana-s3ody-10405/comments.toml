text = "اولا -انا مصرى مقيم بالسعودية منذ 8سنوات وهنا واللة احس اننى فى بلدى واشعر بالا مان والحمد للة تانيا -من منا خالى من العيوب سواء كنا بمصر او بالسعودية او باى بلد تالتا -هذا طبع العرب ياخذون من الاحداث زريعة للسب والاهانة فيما بينهم ونسوا انهم فى النهاية اخوة دين واحد ولغة واحدة واخيرا الى من يسب الامام السديس والشريم اكيد انت لست بمسلم وبالتالى لا تستحق الرد كلنا اخوة وسنظل اخوة على الرغم من المحاولات الفاشلة من امثالك"
