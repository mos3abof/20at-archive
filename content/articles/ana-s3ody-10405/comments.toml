text = "خسئِت, والله لا أريد أن أضيّع وقتي معك ومع أشكالك المتأرجحة أيها الفارغ !!<br />أجل ترقيع بكارة لبعض السعوديات, ههههههه ضحكت على كلامك وكشفك الكريم \\\" سعووودي \\\"<br />من خلال الرابط الذي وضعه وهن طالبات في إحدى الكليات بمدينة حائل شمال المملكة , وهالحركات<br />التافههة ما تمشي علينا نحن ( الأذكياء ) حركة طفولية غبية تنم عن جهل صاحبها , يحاول أن يسيء<br />و يُخيِّل للقراء هنا أنه طبيب وجاءته سعوديات ومن هذا الكلام , يالله, تبيّن لي من كلام إحدى الاخوات المصريات<br />الكريمات - من عقلاء مصر - أنك شيعي ولا تمت للإسلام بصلة , تحاول تشويه صورة السعوديات والسعوديين<br />وهم الوهابيين من خلال مشاركاتك بأسماء من موقع سعودي لطالبات أشرف منك خلقاً وعلماً .<br />إلى سمير أجل دخلت على أقرب موقع لك وجمعت لك أسماء طالبات وتبي توهم القرّاء أنه كذا وكذا<br />ههههههههههههههه هههه … بجد تبيّن لي أنك حاقد ومسكين وكل ما هو مرتبط بالأسؤ متصف بك.<br />حبايبي السعوديين والمصريين شوفوا مدونته _ إذا كانت بالفعل تستحق مسمى مدونة - لا يوجد بها سوى<br />موضوع واحد وهو عن ترقيع فض بكارة بعض السعوديات وهو ليس بجرّاح ولا يحزنون, أجل جرّاح ههه حلوة<br />الجرّاحين عُرف عنهم الأحترام والتقدير, والعقل والذكاء, ومدوناتهم تمتلأ بالعقلانية, و بالكتابات عميقة وليست<br />سطحية كما هي في ( دونة سميروووه ههه ) الجرّاح الغــــفــــلة .<br />شكراً للمحترمين العقلاء .<br />في آمان الله وحفظه ."
archived = "2009-04-29"
capture_url = "https://web.archive.org/web/20090429033609/http://www.20at.com:80/ana-s3ody/10405.html"

