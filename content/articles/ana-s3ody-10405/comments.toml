text = "أنت آخر من يحكم علي, وآخر السُذج يقذفون بي فهمت, ومسألة كلامك المُضٍحك السائق وما إلى ذلك<br />هههه لا نعترف ولله الحمد بالسائقين فلدي ولدى أخوتي سيارات, ولا يحتاج منّا سائق خاص لنا وللعائلة .<br />أما أننا ( شعب ) لوطي وزنا .. أعوذ بالله, التعميم لغة الحمقى والجاهل الذي يهذي بما لا يعقل هل تفهم !!<br />تبيّن لي أنك رجل مريض نفسي, ولا تربط بالإسلام بصلة ما دام هذا كلامك وهذه أخلاقك المنحطة .<br />الإمامان السديس والشريم أشرف منك أيها النجس, ولن أتكلم معك بعد ذلك لأنك حاقد على المسلمين<br />وعلى خيرات البلد, ويبدو أن السعوديين مرةً قد ( قاسوا عليك وأدبوك تأديباً ) لأي سبباً كان فلا أستغرب<br />أن سبيتهم أو شتمتهم فهذه فرصتك والمساحة واسعة لك فسب وأشتم إلى يُريح عقلك ( الغير سليم ) .<br />المرة القادمة أذهب إلى أقرب معهد أو مركز لتطوير عقليتك, و بالأخص ( مهاراتك اللغوية في الكتابة )<br />فأخطاء كثيرة شاهدتها في كلامك, وهذا دليل على أن الشخص يفتقد إلى مزايا كثيرة وإيجابيات<br />و بالعامية السعودية ( الله يعين على نفسك ) ههههه .<br />لن أعود, أهرج كثيراً وكثيراً فلن تُسمع .<br />أستاذك / سليمان ."
archived = "2009-04-29"
