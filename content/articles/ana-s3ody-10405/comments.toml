text = "اقولها للجميع جميع البشر فى العالم<br />السعوديين مخنثين<br />من اول اسرتهم الحاكمة التى تسوقهم كما تساق الابقار<br />من اول عبدالله المخنث خائن الحرمين<br />الى اصغر فراش بمكتب قاض قذر نجس مخنث<br />مرورا بشيوخهم المخنثين<br />ومنهم المخنث الكبير عبد الرحمن السديس وسمى سديس لانه يمارس به اللواط ستة<br />مرات بالاسبوع<br />وايضا الشريم وسمى بذلك لانهم شرموا فتحة شرجه وهم يفعلون به اللواط"
