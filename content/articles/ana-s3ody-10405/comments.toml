text = "فعلا العرب اتفقوا على شىء واحد هو ان لا يتفقوا وبعدين الاخوه اللى بيغلطوا فى السعوديين هم كده مبسوطين بحالهم مالناش دخل فى حياتهم مين احنا عشان نحكم عليهم كل اناء ينضح بما فيه يعنى كل واحد فاسد بيمثل نفسه والاخوه السعوديين اللى بيغلطوا فى مصر عيب مصر زكرت فى القرءان خمس مرات والرسول صلى الله عليه وسلم قال اوصيكم باهل مص خيرا والحمد لله الدكاتره المصريين اللى مش عاجبينكم زى مافى دكاتره فاشلين فى دكاتره من اشهر الدكاتره على مستوى العالم وكل الناس عارفه كده كويس وزى ماقلت كل واحد بيمثل نفسه وللاسف انا ملاحظ ان اى موضوع بينزل ع النت لازم الاقى تعليقات عربيه متخلفه سواء مصريين او خليج او اى بلد عربى دايما مختلفين ومتخلفين مش هاقول الا ربنا يرحمنا جميعا وقبل ماتحاسب الناس ياريت نحاسب نفسنا الاول وزى مابقول قبل مانفكر نقيم دوله الاسلام على ارضنا لازم تقوم اولا فى قلوبنا سلام قول من رب رحيم"
archived = "2009-04-29"
