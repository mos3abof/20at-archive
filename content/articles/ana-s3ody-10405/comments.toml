text = "طلبت سيدة سعودية الطلاق من زوجها، لأنه كشف برقعها خلال نومها لرؤية وجهها لأول مرة منذ 30 عاماً من زواجهما.<br />فمنذ ارتباط الزوجين، الذين تجاوزا سن الخمسين، لم ير الزوج وجه زوجته، عملاً بالتقاليد المحلية المعمول بها في إحدى قرى جنوب بادية خميس مشيط السعودية.<br />وأدى الغضب بالزوجة إلى مغادرة المنزل، ملقية باللوم على الزوج الذي، \"بعد هذا العمر، يحاول ارتكاب خطأ كبيرا\"، يتوجب عليه تحمل تبعاته، وفق ما نقلت صحيفة \"الرياض\" السعودية الأحد 7-10-2007.<br />وبالفعل، تحمل الزوج وزر \"خطأه\"، ووجه اعتذارات متكررة لزوجته وأم أولاده، مع وعود بعد التجرؤ على محاولة رؤية وجه زوجته الخمسينية مرة ثانية.<br />وسبق أن نشرت \"العربية.نت\" عن حالات مختلفة لسعوديين وسعوديات لم ير أزواجهن وجوههن، رغم مرور سنوات، وحتى عقود، على زواجهم.<br />مثال ذلك حالة محمد، الذي لم يتمكن من رؤية وجه زوجته رغم مرور 40 عاماً على زواجهما، وإنجابهما 3 أولاد. وفي اللحظة التي شاهد وجهها طالبته بالطلاق، معدة ذلك تجاوزا للعادات والتقاليد التي اعتادت وتربت عليها.<br />أما علي القحطاني أكد أنه رغم مرور عشر سنوات على زواجه لم يتمكن لو مرة واحدة أن يرى وجه زوجته فالبرقع لا يفارق وجهها، وأشار إلى أنه ذات مرة هم أن ينزع برقعها عن وجهها فهددته بترك المنزل والعودة لبيت أهلها إن فكر بذلك، ولم يثنيها عن قرارها ذلك إلا بعد أن أقسم بأغلظ الأيمان بعدم التفكير مرة أخرى في فعل ذلك. أما حسن العتيبي فقد حاول الضغط على زوجته الملثمة من خلال تهديدها بالزواج من أخرى إذا لم تكشف له وجهها، إلا أنها فضلت أن يكون لها \"ضرة\" ولم تكتف بذلك بل رشحت إحدى صديقاتها التي لاتتمسك بهذه العادة الصارمة.<br />وتقول أم ربيع الجحدري البالغة من العمر سبعين عاما، وهي أم لشابين لم يرا هما وزوجها وجهها ولو مرة واحدة، إنها اعتادت على ارتداء البرقع منذ أن كنت طفلة معتبرة أن خلعه عيبا كبيرا وخاصة عند عائلتها فقد آلفت أن ترى أخواتها الإناث ووالدتها يرتدنه منذ نعومة أظفارها، مشيرة إلى أن زوجها لم يطلب منها أن تنزعه لأنه يعلم أن ذلك من العادات التي يجب المحافظة عليها، وعن إنجابها دون أن يرى زوجها وجهها أشارت الجحدري إلى أن ذلك لا يعد مهما فقد اعتاد ألا يرى وجه والدته وأخواته الإناث مؤكدة أن الألفة والمودة هما أساس العلاقة الزوجية وليس الوجه.<br />في حين أكدت نوره زوجة ابنها، وهي أم لسبعه أبناء أن من العادات التي ورثتها عن عائلتها ارتداء البرقع حتى في منزلها ومع عائلتها وزوجها، وقد طلب زوجها منها مرارا أن تنزع البرقع داخل المنزل لكنها امتنعت عن ذلك مبينه أنها تنام واضعة البرقع على وجهها مما سبب ضيق لزوجها، والذي حسب حديثها اعتاد على رؤية وجه أمه مرتدية بالبرقع.<br />والله قمة التخلف صرآحهـ .. مسكت على الوجهـ بس ههههههههههههههه ههه<br />يالله المستعاااان .."
