text = "هذه عينه مما تصدره مصر للعرب والاسلام<br />المخرجة إيناس الدغيدي تطالب بترخيص الدعارة في مصر 8/6/2008 4:49:00 PM<br />ايناس الدغيدي<br />القاهرة - محرر مصراوي - اشتكت المخرجة المصرية إيناس الدغيدي من حملة قالت انها تشن ضدها مؤخرا في مصر بعد دعوتها الجديدة لترخيص مهنة الدعارة في البلاد.<br />وأكدت المخرجة في حديث لموقع العربية.نت أنها متمسكة بطلبها على أن تجدد الرخصة سنويا، من أجل حماية المجتمع، على حد زعمها.<br />واستغربت الدغيدي الحملة التي قالت انها تشن ضدها، قائلة \"أنا لا أدعو لقلة الأدب\"، وأكدت أنها تسعى لحماية المجتمع من وراء المطالبة بترخيص الدعارة.<br />وقالت:\"من المستغرب أن تقوم ضدي حملة هجوم من خلال بعض المقتطفات الصغيرة التي صرحت بها في برنامج (ضد التيار) على قناة روتانا موسيقى، والتي كلها تتمحور حول الجنس ومنها هذا التصريح، على الرغم من أن الحلقة كان بها العديد من الأمور الهامة الأخرى التي تتعلق بحرية المرأة ونظرة المجتمع لها \".<br />وأضافت: \"كنت اقصد حماية المجتمع وحماية من يمتهن هذه المهنة ايضا في الوقت ذاته، فمهنة الدعارة موجودة في كل مكان في العالم، وفي مصر قبل الثورة كانت مهنة معترف بها ولها أحياء معروفة تماما، لكن اليوم أصبح الأمر يتم في الخفاء في الوقت الذي قد تكون فيه هؤلاء الفتيات حاملات لأمراض خطيرة من الممكن أن تنتقل بسهولة للطرف الآخر \".<br />وتابعت: \"أعرف تماما أن هذا الطلب قد يرفض على المستوى الديني والاجتماعي، وأنا لا أتكلم باسم الدين أبدا لأني لست متبحرة فيه، ولكني أتكلم باسم المنطق والعقل والواقع الذي يشير إلى ضرورة حماية المجتمع\".<br />واضافت: \"حينما طالبت بترخيص مهنة الدعارة في مصر وتجديد التراخيص سنويا، فأنا لا أوجه الاتهام لشريحة كبيرة من البنات أنهن يعملن في هذه المهنة، لكن في الوقت ذاته العدد ليس بصغير، ولكن علينا مواجهة الواقع بدلا من الهروب منه، وأول هذه الخطوات حماية المجتمع بغض النظر عن حالة الرضى أو عدم الرضى من وجود هذه المهنة\".<br />وأكدت الدغيدي على إنها إذا كانت تدعو إلى الحرية، فهي في الوقت ذاته لا تدعو لـ\"قلة الأدب\"، على حد تعبيرها، وذلك تعقيبا على رفضها لإقامة شواطئ للعراة في العالم العربي.<br />وقالت: حينما رفضت هذه الفكرة فهي ايضا حماية للمجتمع ونحن لسنا في حاجة إليها، ومنطق الرفض هنا أنه لن يضيف لنا شيئا، وأتحدى أي سائح عربي يذهب إلى أوروبا ولا يتوق للمشاهدة والجلوس على هذه الشواطئ، ولكن مجتمعاتنا لا تزال مريضة بعقدة الجنس.<br />وردا على دعوة ايناس الدغيدي لترخيص الدعارة، قال الشيخ الدكتور محمد المختار المهدي، الأستاذ بجامعة الأزهر و رئيس الجمعيات الشرعية وعضو مجمع البحوث الإسلامية، إنها تنشر\" كلاما فاحشا وغير منطقي وضد كل الديانات السماوية وعلى رأسها الإسلام\".<br />واشار إلى أن ما تقوله الدغيدي ما هو إلا دعوة علمانية ضد الديانات السماوية التي بها 5 ثوابت لا حياد عنها وهي الحفاظ على النفس والدين والعرض والمال والعقل \".<br />وأضاف: لا شأن لها بالمجتمع إذا كانت هذه هي نظرتها لطريقة إصلاحه والتي تدعو فيها إلى الهبوط بمرتبة الإنسان إلى مرتبة الحيوان.<br />واتهم المهدي المخرجة الدغيدي بأنها \"تدعو إلى تغريب المجتمع العربي و الإسلامي وأن دعواها تعمل على هدم المجتمع \"<br />وأضاف: \"فلتترك إيناس أمور الدين لأهلها ولا شأن لها بالمجتمع إذا كانت هذه هي نظرتها لطريقة إصلاحه والتي تدعو فيها إلى الهبوط بمرتبة الإنسان إلى مرتبة الحيوان الذي يرضي شهوته ضاربا عرض الحائط بالثوابت الدينية والمجتمعية\".<br />واختتم حديثه قائلا: \"إذا كان القرآن قد عاب على الجاهلية أنها كانت تمارس البغاء كالبهائم، فهل نمجده نحن اليوم بدعاوى غريبة ونبيحه لدعاوى قبيحة؟ وهل أصبح وضع مصر ما قبل الثورة هو الذي نقيم عليه تقييمنا لأمور ديننا ودنيانا، وهل بات إصلاح المجتمع اليوم بالترخيص للدعارة؟\"."
archived = "2009-04-29"
capture_url = "https://web.archive.org/web/20090429033609/http://www.20at.com:80/ana-s3ody/10405.html"

