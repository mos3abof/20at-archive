text = "في حقيقة الأمر لا أدري من هو المجرم .. الجلادين أم المجلودين .. ولكن هنيئا لكم جنة الله في الأرض<br />جلد عسكري برتبة ملازم أول<br />المحكمة الجزئية بتبوك أصدرت حكماً بجلد عسكري برتبة ملازم أول 60 جلدة، لدى قيامه باستخدام الحبوب المنشطة الكبتاجون، والتي عثر عليها في سيارته من قبل إحدى دوريات أمن الطرق على الطريق السريع, وعدد الحبوب التي عثرت معه 9 حبات منشطة<br />2000 جلدة على سعودية<br />حكمت محكمة شرعية سعودية بالسجن 4 سنوات و2000 جلدة على سعودية بعد اتهامها بممارسة الدعارة وترويج المسكرات وكانت الفتاة السعودية 20 عاما قامت بالقفز من الدور الرابع فى احدى العمارات التى ضبطت فيها حديث المجالس والانترنت حيث جرى تصويرها بالبلتوتوث وقالت المصادر ان الحكم الذى اصدرتة المحكمة بجدة تضمن حكما مماثلا على رفيقها وهو من جنسية عربية اضافة الى مصادرة سيارتها واموال ضبطت بحوزتها وجهازى جوال وذلك اثر ادانتها باعمال الدعارة والقوادة وقالت الفتاة انها لم يسبق لها الزواج<br />تقرير الجمعية الوطنية لحقوق الإنسان في السعودية<br />بينت الجمعية أنها خاطبت وزارة الداخلية حول 47 سجينا انتهت مدة سجنهم فيما لا يزال الإبقاء عليهم مستمرا، إضافة إلى أن البعض منهم اجبر على الاعتراف تحت الإكراه في حين جزء منهم سجن لمجرد الاشتباه به.<br />وأشار التقرير إلى أن أبرز ما تم رصده في السجون السعودية أن الوافدين \\\"العمال غير السعوديين\\\" يتم الإبقاء عليهم في السجن لفترات طويلة تصل إلى 9 أشهر وذلك بسبب رفض الكفلاء شراء تذاكر سفر لترحيل العامل أو بسبب عدم العثور على الكفيل.<br />ومن الملاحظات التي اوردتها الجمعية احتجاز الأفراد لمدد طويلة دون الاحالة إلى المحاكمة الأمر الذي عدته مخالفة صريحة للنظام الذي يمنع الاستمرار في التوقيف لاكثر من 6 أشهر والافراج عن الموقوف إذا لم يحال إلى القضاء<br />إصدار محكمة حائل الجزئية حكماً على أحد أئمة المساجد بالسجن لمدة سبعة أشهر والجلد 150جلدة (صحيفة الوطن-السعودية؛ خضير الشريهي، 9 ديسمبر 2007م)<br />جلد مواطن 50 جلدة لرفضه الامتناع عن التدخين<br />أصدر قاضي المحكمة الجزئية في المنطقة الشرقية حكما بجلد مواطن 50 جلدة لرفضه الامتناع عن التدخين على متن رحلة للخطوط الجوية السعودية من الدمام إلى الرياض. وكان المواطن أصر على التدخين رغم تنبيهه من قبل الطاقم مما أدى لانطلاق صافرة الإنذار بعد انبعاث دخان السيجارة التي كان يدخنها. وتم تسليمه إلى رجال الأمن عند وصول الطائرة إلى مطار الرياض<br />فتاة القطيف<br />ادانت هيلاري كلينتون، مرشحة الحزب الديمقراطي للانتخابات الرئاسية الامريكية، الحكم الصادر على فتاة سعودية والقاضي بجلدها 200 جلدة بعد تعرضها مع رجل اخر كان معها في السيارة لعملية اغتصاب على يد مجموعة من السعوديين.<br />ووصفت هيلاري كلينتون الحكم بانه مثير للاشمئزاز وطالبت الرئيس بوش بالضغط على الملك عبد الله لالغاء الحكم<br />وكانت الفتاة التي اطلق عليها اسم \\\"فتاة القطيف\\\" نسبة الى منطقة القطيف السعودية ذات الغالبية الشيعية، تركب السيارة الى جانب احد معارفها العام الماضي عندما هاجمهما سبعة رجال سعوديين واعتدوا عليهما واغتصبوهما.<br />وقد حكمت احدى المحاكم السعودية على اربعة من المهاجمين بالاختطاف بينما حكمت على الفتاة وزمليها في السيارة بالجلد 90 جلدة بسبب تواجدهما سوية في السيارة.<br />ولدى استئناف الحكم من قبل الفتاة ضاعفت محكمة الاستئناف الحكم ورفعت عدد الجلدات الى 200 جلدة والسجن ستة اشهر.<br />كما الغت المحكمة ترخيص مزاولة مهنة المحاماة لمحامي الدفاع عنها ومنعته من الترافع عنها<br />جلد عريس سعودى دخل صالة النساء مع عروسه ليلة الزفاف<br />قدم عريس طعنا ضد قرار محكمة قضى بسجنه مدة شهر وجلده عشرين جلدة على خلفية دعوى اقامتها ضده سيدة بسبب دخوله وعروسه الى صالة النساء في يوم فرحه .<br />كانت الشرطة قد استدعت العريس ويدعى \\\"فهد . ح . ع\\\" في اليوم التالي لزفافه بعد الدعوى التي اقامتها احدى حاضرات العرس ادعت فيها أن المدعى عليه دخل الى صالة النساء بلا سابق انذار .<br />وقال العريس انه شارك عروسه في الزفة وكان يهم بالخروج من صالة النساء الى عش الزوجية حين تقدمت سيدة بشكوى هاتفية الى هيئة الأمر بالمعروف والنهي عن المنكر بحقه. وأحيلت القضية الى محكمة بقعاء التى اصدرت حكمها السابق<br />جلد طبيب مصري معروف في السعودية لانه وقف مع مريضته امام البيت<br />الفضيحة كما يقول مراسل عرب تايمز نشرتها الصحف المصرية وطالبت من الحكومة التدخل بعد تكرار الحادثة خاصة وان السعوديين ومنهم امراء – مثل تركي – يقيمون في مصر ويسكرون ويعربدون ويغتصبون وتنهش كلابهم المواطنين دون عقاب او حساب بينما يتم جلد الاطباء المصريين في قضايا ملفقة وتافهة كهذه<br />واصل الحكاية كما رواها الطبيب احمد زكي عبد الحافظ انه وخلال عمله في مستشفى الزلفى العام بمدينة الزلفى اصبح يعالج سيدة سعودية كبيرة في السن في بيتها وعندما يشتد المرض على الام تقوم ابنتها بزيارة الدكتور في المستشفى او في منزله اما لاخذ الادوية او لاستشارته<br />وفي احد الايام وجد الدكتور جماعة من الامر بالمعروف على باب بيته وطلبوا منه مرافقتهم وتبين انهم اعتقلوا الفتاة في الشارع لانها تسير من غير محرم فاخبرتهم انها توجهت لمنزل الدكتور لاخذ ادوية لامها المريضة فتم اعتقال الدكتور بتهمة الخلوة غير الشرعية وتم جلده<br />جلدُ باحثٍ سعودي لمطالبته بإصلاح المناهج التعليمية<br />قال الإعلامي السعودي حسين شبكشي إن أحد الباحثين السعوديِّين تعرّض للجلد لأنه طالب بإحداث إصلاحات في المناهج التعليمية في المملكة لمواكبة العصر ودعا أيضاً إلى اعتماد الوسائل الفلكية لتحديد رؤية الهلال في نهاية شهر شعبان.<br />وأكد أن الإصلاح التعليمي في السعودية لا يمكن أن يتحقق طالما أن هناك وكيلاً حصرياً يحدِّد توجهات التعليم وفق مقاييس غير علمية.<br />ولفت إلى وجود أصوات متشدِّدة لا هَمَّ لها سوى عرقلة الإصلاح المنشود في المناهج التعليمية من خلال إيهام الرأي العام بأن أي تطوير في هذا السياق يندرج في إطار الغزو الثقافي للمملكة.<br />وبعدما دعا إلى اعتماد خيارات ووسائل جديدة لإخراج التعليم في السعودية من حالته المتردية باعتماد الحوار الداخلي على كافة المستويات، طالب شبكشي بفتح فروع للمؤسسات التعليمية العربية والإسلامية في المملكة للاستفادة من تجاربها وإرساء مبدأ المنافسة بين القطاعات التعليمية لتخريج طلاب يواكبون التحولات الجارية في العالم وتحرير القطاع التعليمي من الوصاية باسم الدين الإسلامي.<br />جلد سعودية لتعذيبها خادمتها<br />قضت محكمة سعودية بسجن امرأة وجلدها مئتي جلدة لتعذيب خادمتها الاندونيسية الى درجة دفعت بالخادمة الى الانتحار. وقالت صحيفة الاقتصادية السعودية ان تقريرا لطبيب شرعي أظهر ان الخادمة أصيبت بجروح في كامل أطراف جسمها مما يشير الى أنها تعرضت لضرب مبرح بشكل متواصل. وقد عثر على الخادمة ميتة في بيت صاحب العمل في تبوك شمالي السعودية بعد أن شنقت نفسها بسلك كهربائي.<br />وتفيد تقديرات بأن اربعمئة الف امرأة معظمهن من اندونيسيا وسري لانكا والفلبين -يشتغلن خادمات في البيوت السعودية ويلجأ الالاف منهن سنويا الى الهروب نتيجة سوء المعاملة حسب زعمهن.<br />شهدت مدرسة أجنبية في مدينة الخبر جلد فلبينية 10 جلدات، بعد سجنها لمدة 5 أيام، إثر اعتدائها على طالبة في المدرسة بقذفها بحذاء في وجهها. وكانت مشادة حصلت بين الفليبينية لوسيا، وهي موظفة في المدرسة، وبين والد الطالبة زينة زين مارتن (14 عاماً) في المدرسة . فقامت لوسيا بالتلفظ على الأب بألفاظ قاسية ثم أخذت حذاءها لتقذفه به، ولكنها أصابت ابنته وحاول الأب أن ينهي الموقف باعتذار من المعتدية، ولكنها رفضت بقوة وحين أصرت لجأ إلى المحكمة ا لتي حكمت بعد 11 شهراً، بتعزير المعتدية لوسيا بالسجن 5 أيام والجلد 10 جلدات وأن يكون التنفيذ داخل المدرسة في المكان الذي وقع فيه الحادث<br />جلد سعودية وضعت فلفلاً حاراً في فم طفلة<br />- وكالات - أصدرت المحكمة الشرعية في جدة غرب السعودية، حكما يقضي بجلد سيدة سعودية 50 جلدة لإدانتها بوضع فلفل أحمر حار في فم ابنة زوجها بحجة أنها فعلت ذلك لتربيتها وتهذيبها.<br />وكانت والدة الطفلة قد رفعت دعوى قضائية ضد زوجة طليقها تتهمها بإساءة معاملة ابنتها التي تبلغ من العمر خمس سنوات ما سبب لها آلاما نفسية.<br />وقالت صحيفة “عكاظ” أنه تجرى حاليا مفاوضات لإقناع والدة الطفلة بالتنازل عن تنفيذ الحكم كونه صدر في الحق الخاص<br />جلد أستاذ جامعي وطالبة أقاما [علاقة هاتفية]<br />أكدت محكمة استئناف سعودية ، حكماً بجلد وسجن باحث في الكيمياء الحيوية وطالبة كان يشرف على رسالتها، بعد اعتبار علاقتهما البحثية \\\"ستاراً لعلاقة على الهاتف\\\" أدت الى طلاقها من زوجها.<br />وقال الباحث خالد الزهراني اليوم إنه علم من مسؤولين بالمحكمة ان 3 قضاة ايدوا الحكم.<br />وكان قد حكم عليه بالسجن 8 أشهر، والجلد 600 جلدة وحكم على الطالبة بالسجن 4 أشهر والجلد 350 جلدة لاقامة علاقة عبر الهاتف، قالت المحكمة انها أدت الى طلاقها من زوجها.<br />وقال الرجل ان الملجأ الوحيد الباقي له هو مجلس القضاء الاعلى السعودي، معرباً عن أمله بتدخل الجمعية الوطنية لحقوق الانسان في السعودية.<br />ولم يتسن التحقق من تأكيد محكمة الاستئناف للحكم ولم يتسن الاتصال بمتحدث باسم الجمعية للتعليق.<br />وكان المستشفى الذي يعمل به الباحث، ويقع في الباحة جنوب غرب المملكة، قد كلفه بالاشراف على رسالة الطالبة التي تعدها في جامعة الملك عبد العزيز في جدة في عام 2002.<br />وحصلت السيدة على الطلاق بعد 7 اشهر من زواجها في عام 2004. ورفع زوجها دعوى قضائية يقول فيها ان اتصالاتها مع المشرف على رسالتها هي التي أدت الى الطلاق<br />جلد سعودي سب رجل مرور<br />تلقى سعودي شاب الدفعة الأولى من الجلدات تنفيذا لحكم صدر بحقه جراء شتم رجل مرور أثناء تأدية الواجب. ونفذت الجهات المختصة في بلجرشي في غرب السعودية الحكم الصادر من المحكمة الشرعية ضد شاب سعودي (24 عاما) بشتم رجل امن أثناء تأدية الواجب حيث تم جلده 70 سوطا على دفعات. وتم تنفيذ الدفعة الأولى على مرأى من المواطنين. ونقل عن ناطق أمني “إن الحكم الصادر هو الأول من نوعه في مثل هذه القضية في منطقة الباحة<br />جلد سعودي وزوجته بتهمة تعذيب طفلتهما<br />اصدرت المحكمة الجزئية بجدة حكما يقضي بسجن زوجين وجلد زوجين بتهمة تعذيب ابنتهما (4سنوات) بعد مداولات وجلسات استمرت حوالي عامين حيث ادانت الام بممارسة الضرب والاب بالتستر والاهمال واللامبالاة تجاه ابنته اثناء تعرضها للضرب وقضى الحكم بسجن الام (33عاما) لمدة 6اشهر وجلدها 180 جلدة متفرقة على دفعات كل منها 60سوطا بين الفترة والاخرى 10 ايام وسجن الاب (43عاما)3اشهر وجلد 120 جلدة على دفعتين كل دفعة 60 سوطا بين الفترة والاخرى اسبوع مع التوصية بابعاد من مهنة التدريس ونقله الى وظيفة ادارية نقلا عن تقرير صحافي نشرته صحيفة الوطن السعودية<br />أفاد تقرير إخباري الخميس 13-12-2007 أن محكمة سعودية<br />،حكمت على رجل سعودي بالسجن لمدة 13 عاما و1160 جلدة بعدما أدين بابتزاز امرأة بصورة قديمة. وذكرت صحيفة عكاظ أن محكمة رياض الخبراء بمنطقة القصيم شمال الرياض أصدرت الحكم على السعودي لأنه ابتز امرأة بصورة فوتوغرافية أخذت لها قبل ثماني سنوات. وكانت المحكمة نفسها قد أصدرت على المتهم حكماً بالسجن 10 سنوات و400 جلدة، إلا أنه اعترض على الحكم فقضت بعد ذلك بتشديد العقوبة عليه، وتعود تفاصيل الواقعة إلى الصيف الماضي عندما أبلغت المرأة الجهات الأمنية بتعرضها لابتزاز من رجل يلاحقها بصورتها الفوتوغرافية وقامت الشرطة بوضع كمين محكم للمتهم وألقي القبض عليه.<br />وصدر الحكم في قضية لثلاثة عشر رجلا في نوفمبر/تشرين الثاني 2004.<br />وكان هؤلاء بين مئات من الأشخاص اعتقلوا في جدة في سبتمبر/أيلول 2002 أثناء شجار أدى إلى وفاة رجل شرطة. ورُحِّل جميع الآخرين بعد ذلك، بينما قضى بعضهم أحكاماً بالسجن وأُخضعوا لعقوبات جسدية.<br />وقد زيدت الأحكام الصادرة بحق الرجال الاثني عشر ، من السجن لمدة خمس سنوات و500 جلدة، إلى السجن سبع سنوات و700 جلدة ، وذلك في محكمة مغلقة. ويمكن أن تنفَّذ الأحكام بالجلد في أي وقت. ويظل الرجل الثالث عشر معرضاً لخطر الإعدام.<br />وحُكم على الرجال الثلاثة عشر ضمن إجراءات لم تف بالمعايير الدولية الدنيا للمحاكمة العادلة. ولم يتمكن هؤلاء من الاتصال بممثلين قانونيين أو قنصليين، أو تُقدم لهم تسهيلات كافية للترجمة طوال فترة إجراءات المحاكمة<br />جلد المتخلفين عن حضور جلسات المحاكمة دون عذر في السعودية<br />يجري في السعودية الاستعداد لسن حزمة من التعديلات لإجبار المتخاصمين على حضور الجلسات دون تأخير، وذلك بإعطاء القضاة الحق في الحكم على المتخلفين \\\"تعزيريا\\\" بالسجن والجلد في حال كان تخلفهم دون أعذار مقبولة."
