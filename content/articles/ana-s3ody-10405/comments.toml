text = "انت يا سليمان يا وقح انت تعرف انكم شعب زانى ولوطى وانت متاكد من نفسك انك بنجالى او باكستانى او هندى شوف السائق الموجود عندكم اذا لم يكن رحل ستجد نفسك شبه او اسال امك الزانية لو عندها ذرة ضمير ستخبرك الحقيقة او اذهب انت ومن تظن انه اباك واعمل تحليل د ن أ . ستتاكد من ذلك يا ابن الحرام.<br />سواء كان السديس او الشريم فهما لوطيان لا يجوز لاحد ان يصلى خلفهما انهم من القوم المجرمون.<br />كفاكم تسترا بالدين وانتم ابعد ما يكون عنه.<br />سياتى اليوم الذى تسحب منكم السيطرة على الحرم وتخليصه من هؤلاء الانجاس اللوطيين."
