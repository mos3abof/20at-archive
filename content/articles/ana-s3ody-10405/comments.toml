text = "انا دكتور جامعى مصرى متدين اعمل بالمدينة المنورة وكم تمنيت ان اعمل بالسعودية وبخاصة فى المدينة المنورة لاكون بجانب الحرم النبوى الذى يتطلع اى واحد فى مصر الى زيارته.<br />ويوم قدمت الى هذا البلد كنت اظن اننى ساجد هنا احفاد الصحابة من اهل المدينة الصحابة الذين نصروا رسول الله وآزروه.<br />ولكننى وجدت بشرا غير البشر انهم يشبهوننا احيانا فى اشكالنا وفى كلامنا ولكنهم يختلفون عنا كاختلاف الليل والنهار.<br />اناس يتربصون بنا بدون ذنب او عداوة مسبقة يكرهون جميع البشر مما جعلنى ابتعد تماما عن مخالطة اى منهم ولكنى احس دائما انهم كلذئاب الجياع الى فريستهم.<br />يتكالبون على الغريب بالباطل, كل هذا ويحدث فى مدينة رسول الله فما بال باقى المدن. تحدث لى مضايقات فى عملى واستغلال وعدم ضمير.<br />اتحاشى دائما التعامل مع النساء ولكنى لا اسلم منهم حين اتقابل بالصدفة حين دخولى او خروجى من المنزل زوجات يغيب عنهم ازواجهم فلا يحفظون غيبتهم.<br />اسال الله السلامة وان ينهى ايامنا هنا على خير."
archived = "2009-04-29"
capture_url = "https://web.archive.org/web/20090429033609/http://www.20at.com:80/ana-s3ody/10405.html"

