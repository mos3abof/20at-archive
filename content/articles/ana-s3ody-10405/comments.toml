text = "وجدت تعليقا فيها قمة في السخرية والابتزاز باشرف الرجل المسلم والنساء المسلمات مثل الذين يدعون الشرف ويقومون برمي الزنا على نساء شريفات محترمات وهن ليس لهم أي علاقه بما إتهمو فيه سوى أنهم طالبات يدرسون ثانويه عامه فقام بعض الفجار بقص أسماءهم من الانترنت ووضعهم هنا فهذا غاية الاحترام والعكس صحيح وأيضاً قذف شرفاء بلد الحرمين الشرفين بالزناء واللواط والعياذ بالله<br />ووجدت ردوداً فيها إنتصار للكرامة بالادب والاحترام كألاخ مسلم ينتصر لعرضه …<br />وأيضاً الاخ الذي كتب العنوان كذاب أشر فهم إنتصرو بقمة ألادب وأظهرو الحق ولم يستطيع الذين إفترو أن يرد عليهم لأنهم أتو بالحجة الواضحه وألادله فخرج الفجار الذين بهتو رجال ونساء المسلمين الشرفاء من البلدين ولم يستطيعو الرد عليهم فهذا بسب أدبهم وإحترامهم وسعيهم لإظهار الحقيقة فكات الله معهم وأقول لمن يطعن في بعض ألاحكام الخارجه من ((القضاه))<br />في المملكه فأقول والله أنه في كل بلد هناك قضاه ظالمين ليس للمجتمعنا علاقه به وهناك عدل كثير في كثير من الاحكام التي عدل فيها كثير من القضاه ونرجو أن لايحملو المسلمين عواقب هذه القضيه ومن أن أراد أن يحتج يذهب إلى ألسفارة السعودية ويقدم لها شكواه ورفضه للحكم القاضي في القضيه دون سب نساء ورجال المسلمين<br />…شكراً…"
