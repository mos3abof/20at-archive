text = "القضية لا تحتاج إلى ضجة وصخب إعلامي من شعب مصر, معروف أن القضاء في المملكة يختلف عن جميع<br />القضاء في الدول الأخرى بحكم أن القضاء في المملكة يحتكم على الأدلة والقوانين الشرعية وهذا ما يُحدث هنا,<br />على العكس في ( بعض ) الدول العربية, ولا أنسى فـ للقاضي أن يُعْمل عقله في الأمور التي ليس فيها نص من القرآن أو السنة أو القياس أو اجتهاد من له حق الاجتهاد، فعندئذٍ يجتهد القاضي برأيه، وله أجر الاجتهاد، قال عليه الصلاة :\\\" إن حكم الحاكم فأجتهد ثم أصاب؛ فله أجران، وإذا حكم فأجتهد ثم أخطئ؛ فله أجر\\\" [الجماعة].<br />إذا كان ابناء وشباب المملكة يعاقبون, ويحكمون القضاة عليهم بأحكام من ( سجن, جلد , القتل ) طبعاً على حسب كل<br />الأخطاء التي يقعون فيها دون إدخال منطق العاطفة أي أنهم يتعاطفون ويخففّوا الحكم لأنهم سعودين كما يتصور بعض السُذج<br />هنا وهذا مستحيل عند قضاتنا الكرام من خلال ما أرى عن قُرب, فما بالك بـ مصريان لهما صلة بالمخدرات, ويحاولا إغتصاب<br />امرأة وغيرها مما ورد في الأخبار المتعلقة بهذه القضية وغير ذلك خانا الأمانة في مهنتهم كـ طبيبان , أقولها للأسف !!<br />عُرف عن بعض من أفراد المجتمع المصري بـ (( العاطفة الجياشة )) التي تحكمّهم وتسيّرهم في غالب الأفعال والأقوال<br />وهذا ما أتضح لي في كثير من المواقف السياسية _ أحياناً - والأجتماعية والرياضية , يتعاطفون كثير مع أي قضية دون إن يُدخلوا منطق العقل , فالعاطفة لديهم تغلب العقل, وهذا غلط , أي أمر لازم العقل والعاطفة يكون لهما نصيب من أي شيء<br />إذا كان البعض يتعاطف مع والدي الطبيبان في توسلاتهم الأخيرة فالسؤال هنا إلى عقلاء مصر ؟!<br />ما ذنب تلك النسوة في ذاك المستشفى أو المستوصف الذي يُشرف عليهما الطبيبان أن ينتهكا عرضهنّ ؟<br />هل من المعقول مثلاُ حينما يُخطيء على أختِ طبيب أن أسامحه أو أطالب بتخفيف العقوية , أبداً والله<br />من أخطأ يجب أن ينال عقاه خصوصاً إذا في مجال طبي ومجالات لها وقع على المجتمع .<br />أتمنى ما تتعاطفون في قضايا تخص أفرادكم فنحن نتألأم لِما حصل لتلك النساء في مملكتنا !!<br />وعجبي لأُناس يتكلمون ولا يتعّقلون في أحاديثهم, أشبه بالأعراب , غريب أمرهم .<br />إلى أحمد رؤوف _ شفاه الله وعافاه _<br />سأكون شاهداً عليك يوم القيامة بإذن الله , سب وأشتم ما تراه في نفسك<br />النساء والرجال في المملكة أشرف منك أيها المسكين, فأنت لم تقف عند السب<br />والشتم بل وصل الأمر إلى القذف في مسلمات السعودية وهل ما لا نرضاه علينا<br />وعلى جميع المسلمات, وبالنسبة لكلامك عن إمام الحرم المكي الشيخ السديس<br />فوالله لا عجب من شخص أحنف , والله ما تجي ولا ربع من ظفر السديس يا .. !<br />لأول مرة أرى مصري _ إن كان مصري _ يسب ويشتم الإمام للحرم المكي السديس .<br />ههههه , غريب أمرك, أتمنى لو أواجهك وجهاً لوجه لأسكتك وأسقطك<br />رغم أني عمري لم يتجاوز العشرين سنة يا أبن مصر ههه مُضحك أمره وأشد على لغته وأسلوبه الهش .<br />شكراً لكم .<br />سليمان ."
archived = "2009-04-29"
