text = "الى المدعو ابو النجا الي بيته من زجاج لايحذف الناس بالطوب الدعارة اساسها مصر للاسف الشديد فما انتشر البغاء والكباريهات والخمور الى عن طريق مصر ولم تصدر لنا مصر الى 2 مليون فنان وفنانة وراقص وراقصة نشرو العري والتفسخ في المجتمعات العربية فلانضحك على بعضنا البعض فالعاهرات والمومسات في مصر اكبر نسبة في الدول العربية الدول الخليجية ومنها السعودية لها الفظل بعد الله على مصر اقتصاديا واجتماعيا ولم ننكر فظل مصر على الدول الخليجية فهذا من باب العدل والانصاف ولكن في هذه القضية بالتحديد كان الاطباء المصريين من افشل الاطباء الموردين لدول الخليج ومنها السعودية بالذات وقد عانينا الهوايل منهم ومن اضمحلال ثقافتهم الطبية وتزوير شهاداتهم وهناك قضايا كثيرة جدا تم كشفها من تمرجية تحولو بقدرة قادر الى دكاترة واستشاريين يعملون على تشريح البشر .<br />القوانين في السعودية قوانين صارمة تطبق على الجميع وليتكم تستردون جثث جنودكم من اسرائيل ودفنها بمايليق بكرامة القتلى رحمهم الله وليتكم تبحثون مع امريكا عن سبب اسقاط الطائرة المصرية<br />دول الخليج ضمنت اعمال شريفة للمصريين اما دول اوروبا التي تتغنون بها فقد اهدت لكم غسيل الصحون في الفنادق والشحاتة على ابواب السفارات ."
archived = "2009-04-29"
capture_url = "https://web.archive.org/web/20090429033609/http://www.20at.com:80/ana-s3ody/10405.html"

[[comments]]
order = 21
subject = ""
author = "اسماعيل ابو النجا"
posted = "2008-11-22"
text = "انت يامن تدعى المحامى انت انسان احمق لا تعرف شيئا جاهل كعادة شعبك<br />انتم ايها السعوديون الانجاس قوانينكم عرجاء بلا عكاز<br />ما تسمونه بالشريعة يطبق بدرجات متفاوته على الناس<br />يطبق على العرب والهنود والباكستانيين والبنجلاديشين بنسبة 300 فى المائة<br />ويطبق على السعوديين غير الاصليين بنسبة 100 فى المائة<br />ويطبق على السعوديين الاصليين بنسبة 50 فى المائة<br />ويطبق على الامراء اولاد واحفاد الملك سعود بنسبة 25 فى المائة<br />ولا يطبق نهائيا على الامراء من اولاد واحفاد عبدالعزيز من غير اولاد الملك سعود<br />ولا يطبق نهائيا على الاجانب من الامريكيين والبريطانيين والاوروبيين<br />لان الامريكيين والاوروبيين اسيادكم وانتم عبيد لهم ولو فكر احد وحكم على اى منهم<br />لاستدعى السفير ملككم عبدالله الى مقر السفارة وضربه على وجهه بالحذاء<br />ايها المحامى ان سفارتكم فى القاهرة لا تساوى اكثر من حذاء قديم لا يصلح حتى ان يلبسه<br />شخص فى قدمه والسفير هشام ناظر مخنث لا حول له ولا قوة<br />انا مع معالى الدكتور سمير لنشر فضيحتكم الكبرى فى المواقع وعلى جميع الايميلات ستصل لكل فرد<br />واذهب انت وشعبك الى الجحيم.<br />لو سفارتك لها سلطة ما كانت اميراتكم العاهرات تاتى لممارسة الدعارة فى فنادق شرم الشيخ<br />والغردقة والقاهرة<br />انظر الى العاهرة سماهر بنت تركى حفيدة الامام عبدالعزيز قبح الله وجهه ماذا تفعل هنا<br />انظر الى الاميرات ثريا وعهود وحصة وغيرهم ممن يواظبن على الحضور الى مصر<br />باستمرار ماذا يفعلون هنا.<br />اين شريعتكم واين قوانينكم ايها السفهاء خسئتم ايها القرود يا حسالة العالم."
archived = "2009-04-29"
