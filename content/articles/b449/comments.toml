text = "بعض مخرجي ومنتجي الأعمال السينمائية الساقطة و\"الخلاعية\" إذا صح التعبير ، تجدهم يستأسدون على \"مشايخ\" الأزهر ! ونسمعهم في الندوات وهم يصرخون : نتحدى \"المصادرة\" ونواجه \"الظلامية\" وندافع عن حرية الرأي ضد ديكتاتورية رجال الدين الرجعيين!<br />كلما قرأت مثل هذا الصراخ أو سمعته .. اضحك ساخرا .. وكما يقولون شر البلية ما يضحك !<br />إذ لا نسمع من هؤلاء إلا تحديهم لـ\"مشايخ\" مساكين .. أو دفاعهم عن \"حرية البذاءة\" وفي أحيان كثيرة \"قلة الأدب\" أو عن \"حرية التعري\" واثارة الغرائز !<br />لماذا لاينتج هؤلاء افلاما أو مسلسلات تتكلم عن الفساد في وزراة الزراعة مثلا و\"تتحدى\" رجل النظام القوي \"يوسف والي\" الذي سرطنت سياساته طعام المصريين على مدى 25 عاما ، وحصدت أرواح الألاف من خيرة شباب مصر ؟!<br />لماذا لم ينتج هؤلاء اعمالا تتناول مسألة حقوق الإنسان المصري وقانون الطوارئ والتعذيب في السجون والمعتقلات ومقار الشرطة .<br />لماذا لم يتحد \"اشاوس\" الفن والسينما المصرية ، ظلم وظلمات السياسات الأمنية ،والتي تبقي في سجون النظام أكثر من 25 ألف معتقل سياسي بدون محاكمات ؟!<br />لماذا لم ينتج هؤلاء \"العنتريون\" وعلى رأسهم المخرج الركن المهيب \"خالد يوسف\" افلاما تندد وتنتقد تزوير الانتخابات والاعتداء على المتظاهرين ؟!<br />لماذا لم ينتج \"رامبو\" واحد ممن فلقوا ادمغتنا بـ\"حرية الرأي\" و\"الابداع\" فيلما واحدا يوحد ربه يدافع عن المستشارة نهى الزيني واربعة من زملائها ، تطاردهم ملاحقات رسمية للتنكيل بهم عقابا لهم على تحديهم لإرادة التزوير المسنود بجبروت السلطة وأجهزة الدولة العاتية ؟!<br />لماذا لم نسمع واحدا منهم يعد بأنه \" يتحدى\" الظلامية الرسمية والرجعية الممهورة بخاتم الدولة وينتج فيلما يعيد لأحكام القضاء هيبتها وحجيتها ويحميها من عبث المستهترين والفاسدين من الذين يريدون دولة لاقانون لها ولاقضاء تحمي وتشرع للصوصية والتزوير وتزييف ارداة الأمة ؟!<br />لماذا لايستعرض واحد منهم \"عضلاته\" ويعد المتعبين والمعذبين ومن ضيعهتم ودمرتهم سياسات أمنية لاتكترث بآدمية المواطنين .. بأنه بصدد انتاج فيلم أو مسلسسل تليفزيوني يتحدث عن مأساة زوجات وأمهات المعتقلين اللاتي افترشن أرض نقابتي المحامين والمهندسين أكثر من شهر وهن ينتظرن من يرق قلبه لحالهن ولمأساتهن ،ويساندهن في محنتهن التي صنعتها الدولة ويتلذذ قادتها وسدنتها بتعذيبهن ؟!<br />لم نسمع من اباضيات السينما الذين يستأسدون فقط على \"مشايخ\" غلابة لاسند لهم ولاظهير وليس لهم لا في العير ولا في النفير ويزج بهم في معارك لم يصنعوها ولم يكونوا يوما ما طرفا فيها .. لم نسمع من هؤلاء الاباضيات وعدا بعمل فني يجسد مذبحة مصطفى محمود ويخلد مأساة العشرات من السودانيين الذين زهقت أرواحهم ثمن استئساد رسمي على \"مساكين\" لو كانوا من ذوي البشرة البيضاء و العيون الزرقاء ما داس التخين في مصر لهم على طرف ؟!<br />أتمنى من رامبوات السينما المصرية والمدافعين باستماتة عن \"حاحا وتفاحة\" أن يفتونا فيما سألناه فيما تقدم .. نفع الله بهم وثبتهم على الدفاع عن \"الحرية\" في مصر ."
