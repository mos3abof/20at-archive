text = "كلام سوسه كله حكم وكلام كله مظبوط<br />والله قالت كلام جميل<br />وكفايه انها استخرجت كلام مينا المتناقض وبينت اد ايه هو نيته سيئه<br />وكفايه انها ايدتني<br />مشكور جدا يا سوسه"
