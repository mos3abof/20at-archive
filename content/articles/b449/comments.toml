subject = "حاجة تزعل"
author = "أحمد"
posted = "2006-02-24"
text = "فانفرض ان الاخوان المحترمين غير متفقين مع الفيلم ،،، لازم نخلى وحيد حامد فرصة اعطاء رأية طالما مافيش اساءة للدين،،، افرض ان فية لقطة فى احد افلامة لفتاة ترتدى النقاب حتى تدخل شقة شاب ،،، طيب ما هو بيحصل فى ارض الواقع ومعنى عرضة ليس التشجع علية،،، ربما لنقده ،،، فى النهاية ارجو عدم اعتبار اى معارض للاسلاميين او للاخوان ،،معارض للدين الاسلامى والا تحولنا الى طالبان كما ذكر الاخ من المغرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

