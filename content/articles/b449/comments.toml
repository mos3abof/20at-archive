[[comments]]
order = 22
subject = "الاخوان والفن عن تجربة"
author = "ايمن الضبع"
posted = "2006-02-24"
text = "كثيرا ما يخلط الاستاذ وحيد حامد بين جماعة الاخوان المسلمون وجماعات التكفير والجهاد ولا اعرف هل هذا عن عمد ام عن جهل من الاستاذ السيناريست الذى جند نفسه وقلمه من اجل محاربة جماعة الاخوان المسلمون والتى اكدت ليس فقط من خلال زيارة الاستاذ ابو الفتوح الى الكاتب الكبير نجيب محفوظ بعد فوز الاخوان الساحق فى انتخابات مجلس الشعب والذى اظن ان الاستاذ وحيد لم يعلم به او يشعر به وهو فوز وان دل على شئ فاْنما يدل على مدى تعاطف واشتياق المجتمع المصرى الى من يعبر عن الاسلام ويدعو بصدق وبمنهج سليم الى مجتمع اسلامى شامل ومتكامل بمعنى ان يشمل كل او جميع نواحى الحياة المختلفة والتى منها ةلا شك الجانب الثقافى والفنى بما يحتوية من ادب ومسرح وسبنما بل وموسيقى ايضا فالاصل هو ان تحتوى هذة الجوانب على هدف ومعنى يقوم المجتمع ولا يهدمه كما يحاول الاستاذ وحيد ان يصور- فى افلامة السينمائية والتى اخرها فيلم \"دم الغزال\" حيث ان جماعةاسلامية تقتل وتدبح كل من يعارضها او يختلف معهاوان الاخوان هم جماعة من الشيوخ ذوات اللحى -او من غير- يسرقون الحب من المجتمع بل انهم هم اصل الارهاب والخوف فى هذا المجتمع المصرى .<br />اؤكدلك يا استاذى العزيز ان جماعة الاخوان والتى لا تعرفة عنهم هم جماعة تهتم وبشكل كبير بالفن حيث هو اسرع واسهل طريقة لوصول الفكر الى الجماهير الذين هم من المجتمع المصرى ولا اكثر على ذلك من دليل لو تعلم ان مسرح الاخوان المسلمون ظهر تول ما ظهر فى بدايات ظهور جماعة الاخوان المسلمون فى اوئل الثلاثينات وفى عهد امام الجماعة حسن البنا نفسه حيث كانت تقام المسرحيات التاريخية بل والرومانسية ايضا على مسرح الازبكية الكبير كما انشئ فى اوائل الثمانينات فرق مسرحية للاخوان المسلمون على مسرح رمسيس بنقابة المهندسين والتى اغلقته السلطات المصرية بينما فتحت لك يا استاذى الابواب فى اعمالك الفنية لتهاجم وتحارب جماعة اسلامية معاصرة مثل جماعة الاخوان المسلمون والتى تشرفت فى وقت من الاوقات باْلاْنتماء اليهابل ومشاركتهم فى بعض اعمالهم الفنىة واتابع محاولاتهم فى الظهور الفنى عن قرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
