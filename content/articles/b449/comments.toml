subject = "موحد قطر واحد لاسف"
author = "هبهوب"
posted = "2006-03-23"
text = "المسيحيين مش متخلفين المسيحيين اصحاب حضارة وتاريخ وماضى مشرف ووحاضر متقدم ومستقبل واعد<br />المسيحيين همن اوروبا اللى متقدمة المتحضرة اللى بترسل ( للاسف ) معونات غذائية للجعانيين فى مصر امثالك ولا تاخد منك الا الشتيمة و قلة الادب وقلة الدين وقلة التربية وقلة الذوق وقلة الاخلاق<br />المسيحيين همن امريكا الشمالية المتقدمة المتحضرة اللى ( للاسف بتتحكم فيك )) وانتا مش عارف تحرر نفسك وفاضى تشتم المسيحيين وبس<br />انا بقي عشت واتعملت مع مسيحين اكتر من مسلمين<br />بس مش زيك كدا انضف منك اكيد بصرف النظر عن ملتك انت عربي الظاهر كدا برده<br />يعني اللي في وشك في وشنا كلنا<br />وارجع واقول راجع الاندلس اللي ضاعت وراجع..... وراجع ........ اقول ايه ولا ايه بس الغلط انها ليست اندلسا واخده فلكم ضيعنا اندلسا<br />اهدي يا كابتن وبلاش صراع الاديان دااااااا<br />اضف الي معلوتاتك اني ليه اصحاب افباط كتير واصل اقباط يعني \"مصري\" بس بيحبوا البلد اوي اللي هي مصر وبيتكلموا عنجليزي لبلب برده وعايزين يربوا عيلهم في الشرق والله الكلام دا من واحد اعرفه معايا في الكليه<br />يا كابتن ابعد خالص عن المله عشان المشكله مش مله المشكله احترام \"انسان\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

