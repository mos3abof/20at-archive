subject = "وبعدين يا هبهوب"
author = "عبدالله مفتاح"
posted = "2006-03-28"
text = "انا مقلتش لمينا انت حمار مع الاعتذار<br />انا قلتله كلامك بينضح جهل مع الاعتذار<br />ودي حقيقه من الواضح ان قراءاته لناس معينين ومش خارج بر الاطار ده يعني مثلا لم يقراكلمه التاريخ الاسلامي ولكن قرا نقد التاريخ الاسلامي من ناس وطبعا بكده مينفعش اناقشه لانه مش مستوعب اللي انا بقوله<br />وبس"
