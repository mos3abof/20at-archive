subject = "لازم نصنف الفن"
author = "عبدالله مفتاح"
posted = "2006-02-17"
text = "لازم نصنف الفن ولازم نقول في سينما كويسه وفي سينما مش محترمه واحنا مش هنكون اوصياء على حد بس من حقنا ان اللي يعمل حاجه نوضح هوه يقصد ايه بالظبط<br />انا نفسي في حاجه من بداية السينما المصريه متعملتش واحده منقبه حسنة الخلق لازم تطلع يا حراميه يا مش محترمه يا اما مش كويسه مع ان الاصل في المنقبه انها حسنة الخلق<br />شوفو بقا كام رقاصه كانت شريفه وعفيفه وصاحبة مبدا<br />مع احترامي<br />والسينما الايرانيه لا يعلى عليها وهو ده الفن الحقيقي اللي احنا عايزنه لكن اللي عايز غير كده يبقى عايز فساااااااااااااااد<br />وربنا يهديه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
