text = "بص يا مينا من الواضح انك انت بقا اللي ثقافتك ضحله لان اي حوار محترم اي واحد بيذكر فيه حقيقه بيقول مصدرها لان مش كل واحد عايز يقول حاجه يقولها وبعدين يقول انا مش هسمح لحد انه يكذبني قول المعلومه ومصدرها وانا احترم المعلومه لو المصدر محترم لكن انت تقول معلومه منعرفلهاش اب(زي الولد في اوروبا) وتقول مش هسمح لحد يكذبني يبقى ده كلام فارغ<br />ثانيا لم تتحفنا بردك ولم تخبرنا عن مصادرك يا ريت تقول مصدر الحاجات الغريبه اللي انت قلتها دي<br />ثالثا:اوروبا اللي انت فرحان بيها وعايزنا نبقى زيها اهملت ليه الرد على الولد اللي مش عارف ابوه رد يلا عايزنا نبقى زيهم<br />عايز الولد يجوز ولد والبنت تجوز بنت<br />والراجل يجوز بنت وتخلفله بعد 5 شهور وتقله هوه ده ابنك وان كان عجبك والراجل ميعرفش ان كان ابنه ولا ابن الجيران<br />والشواذ يدوروا يطالبوا بحقوقهم هنا وهنا<br />ايه رايك متبص لاوروبا وامريكا الاول قبل ما تتفلسف وتهاجم العروبه متشوف العلمانيه اللي انت عايزها عملت ايه؟<br />ولا انت بتبص لسلبيات السعوديه وناسي كوارث ومصايب اوروربا وامريكا<br />ولا ثقافة قطيع الاغنام سيطرت على فكرك وبقيت مسير وراء كل ماهو اوروبي ؟<br />رد يا ...<br />يا استاذ مينا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 45
subject = "كلامك بينضح جهل يا مينا مع الاعتذار"
author = "عبدالله مفتاح"
posted = "2006-03-24"
text = "بتقول لا يوجد دولة دينيه على مر العصور ناجحه ؟<br />ده قمة الكلام الفارغ امال دولة النبي صلى الله عليه وسلم مش كانت دولة دينيه ومنتهى النجاح؟<br />دولة سيدنا ابو بكر الصديق الم تكن في منتهى النجاح؟<br />وبعدين تعتبر ان قتل الخليفه معناه عدم رضا من المحكومين؟ مين اللي قال الكلام ده؟<br />ايه مفيش اعداء؟ هو اللي قتلوا سيدنا عمر وعثمان وعلى كان نتيجة احساسهم بالظلم؟<br />انت بتتكلم وخلاص ولا انت مش عارف ؟ ولا مش فاهم ولا ايه حكايتك؟<br />نا مش عارف احاورك بجد لان كلامك مبتور جدا وبينم عن ضعف شديد في الاطلاع<br />وبعدين لما تسمع حجه عن هارون الرشيد تصدقها ازاي؟<br />المعروف عن هارون الرشيد انه كان صالح ولا انت بتبني ثقافتك من السماع ودي مصيبه تانيه<br />انت لو كنت قرات عن هارون الرشيد مكنتش قلت كده؟ لكن لانك بتستسهل وتعتمد على السمع دي فكرتك عن هارون الرشيد<br />انت اعتبرت ان المؤرخين بالغوا في وصف دوله عمر بن عبدالعزيز؟<br />لا بقا الحقيقه بتقول ان لم يكن هناك فقراء والشباب كانو بيتجوزا وكان كل حاجه تمام<br />واهي دولة دينيه ناجحه<br />على فكرة لما عمر بن العزيز كان ناوي يطبق نموذج سيدنا عمر بن الخطاب في الحكم بردو لقا (نعيق بوم) بيقولوله ليس زمانك كزمان عمرو ...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 46
subject = "من مينا الى الجميع"
author = "مينا"
posted = "2006-03-24"
text = "الكلام اللى اتقال لى<br />(((( يا مينا<br />ماذا لو قلت لك انت حمار<br />هل ستغضب ))))<br />((( المتخلف اللي اسمه مينا يحول الامر الي متاهات لا تنسى يا حيوان أن الكذب وعدم النظافة هما سمتان أستسيين فيكم وان تخلفكم العلمى ))))<br />((( قال يا متخلف بتروح لشنودة يضحك عليك ويستعبدك لحسابه روح روح )))<br />لاحظوا يا عقلاء ان الاهانة ليست مقتصرة على فقط بل ممتدة الى اكبر رمز دينى مسيحى فى مصر<br />اللى انا قلته<br />((((انا والله العظيم تلاتة قرفان ارد عليك لانى ساعتها هبقى زيك مختل نفسيا ومشوش وجاهل و متخلف ومتعصب ومعمم ومعتم عليك )))<br />((( صدقنى انا بستجمع قواى بالعافية عشان ارد عليك لانى من غير هذار او مبالغة قرفان اخر قرف وحاسس انى بتكلم فى الشارع او على قهوة بلدى او فى اى حتة قذرة مش نظيفة تجمعنى بيك يا جاهل<br />((( قلة الادب وقلة الدين وقلة التربية وقلة الذوق وقلة الاخلاق )))<br />((((ولولا انى اعرف الاسلام حق معرفة لكنت عندما شاهدت تعليق الهمجى ده كنت اخذت فكرة غلط عن الاسلام العظيم<br />ولكن فعلا فعلا ( لا يعيب الاسلام سوى المسلمين ))<br />يا ريت تدخل سريع من الاخوة و الاخوات المسلمين و المسلمات لوقف هذا الهمجى صدقونى على الاقل لحماية دينكم من التشويه )))<br />لاحظ يا عبد الفتاح الفرق الشاسع فى الالفاظ<br />لاحظ يا منصف انى لم اتفوه بكلمة تسىء الى الاسلام او الى اى رمز دينى اسلامى كبير او صغير<br />المصدر اللى انا بستقى معلوماتى و ارقامى منه عن الاخوان المسلمين هو<br />((( كتاب<br />(حسن البنا القائد والشهيد ) للكاتب الاخونجى سابقا والعلمانى حاليا المغمور ( رفعت طه ) بيحكى تجربته مع الاخوان كاخونجى لمدة 7 سنين لم يلقى فيها مع الاخوان سوى الجهلة و الفشلة والغير متعلمين )))<br />تقدر يا --- ولا بلاش تقدر تجيب الكتاب القيم ده من اى مكتبة محترمة كبيرة من انتا لا تدخلها<br />بالنسبة<br />1 السعودية اكبر سوق للفياجرا فى اسيا<br />2 ةالسعودية + الخليج اكبر سوق للفياجرا فى العالم<br />الاحصائيات دى مكتوبة بالملى فى بعض الاحصائيات الطريفة لجريدة الاخبار عن عام 2005 المنصرف<br />وطبعا جريدة الاخبار جريدة قومية منتشرة محترمة لا تروج اشاعات<br />3 اعلى الكتب مبيعات فى السعودية هى الكتب الجنسية<br />4 ثانى اعلى كتب مبيعات فى السعودية هى كتب الطهى<br />المعلومتين السابقتين اتقالوا بالنص فى برنامج (( من اول السطر )) على قناة دريم 2 والقناة و البرنامج محترم لا يروج اشاعات<br />5 السعودية ثانى اعلى نسبة ارتياد للمواقع الجنسية فى العالم<br />المعلومة اتذكرت على موقع رسمى محترم لا يروج للاشاعات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

