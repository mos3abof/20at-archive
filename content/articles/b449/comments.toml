[[comments]]
order = 51
subject = "احنا جايين نهدي النفوس"
author = "كرميلينو"
posted = "2006-03-25"
text = "اولا احب ان اسجل احترامي لاسلوب الاخ مينا و الاخت سمر على تحضرهم في الحوار و اتحفظ على رأي الاخوة المطهرطقين اللي كلامهم لا يجاوز حناجرهم فقط ( محصلة فعلهم = صفر ) ( ممكن يكون عامل اسد و فاكر ان بيدافع عن الدين و هو مبيركعهاش اساسا ) و الناس دي مش هذكر اسمها مستشهدا بقول الشاعر<br />و لو ان كل كلب عوا القمته حجرا<br />لكان مثقال كل حجر بدينار<br />و الشاعر الاخر اللي قال :<br />اللي على راسوا بطحة يحسس عليها<br />و اعترض ايضا على اسلوب عبد الله مفتاح اللي جه يكحلها عماها<br />و اشكر هبهوب و نيفين بمناسبة عيد الام<br />و بعد كل هذا الفاصل الطويل اللي قطع نفسي و هيقطع انفاسكوا احب اقول ان الازمة تتلخص في بعض النقاط الاساسية الرئيسية المحورية :<br />1- مشكلة التطرف في الدين بيقابلها من الناحية الاخرى تطرف في الحياة<br />و لنضرب مثال بالفيلم الذي ذكره الاخ مينا و اخطأ موقع الاخوان في تلزيقه لوحيد حامد و و فيلم الارهابي لعادل امام و قصة لينن الرملي<br />الطرف الاول في الفيلم الارهابي عادل امام المتطرف و الارهابي اللي بيقتل من غير تفكير ( لا تناقش و لا تجادل يا اخ علي )<br />و الطرف التاني صلاح ذو الفقار و عيلته مينا قال انهم مسلمون معتدلون ؟؟!!!<br />مش عارف ااقولك ايه ؟؟؟<br />هما كمان للاسف متطرفين في الحرية<br />البنت بتشتغل في الاعلانات و فاتحاها على البحري ( هو شرف البنت زي عود الكبريت ) و هي محافظه على شرفها و محترمه بس الناس المحترمين بتوع اروبا مبيعملوش كده لانهم متحضرين و معندهمش موضوع الشرف ده بتيتا<br />و للاسف لينن مجابش اصورة كامله عشان الناس تتعاطف معاها و تقول البنت كويسة و مبتعملش اي حاجة غلط<br />نيجي للابن المهندس اليساري في مشهد الحفلة و و بيشرب الخمرة ( اعتدال ايه اللي انت جاي تقول عليه ؟؟؟ !!! )<br />يا ريت تكون الفكرة وصلت<br />2- كفايه عليكوا كده<br />و الى لقاء اخر ان شاء الله<br />و خلي بالكوا احنا بنهدي النفوس بس<br />و لو عايزين نتكلم ممكن نعمل مؤتمر على الياهو في الوقت اللي نتفق عليه و نتنقاش على الهوا وجها لوجه<br />face to face<br />و الهبلاء يمتنعون<br />hurry_day@yahoo.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

