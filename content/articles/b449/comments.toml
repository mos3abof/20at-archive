text = "السلام عليكم ورحمة الله وبركاته انت بتقول انك اتهانت وعايزتعمل ضجه وهيصه علشان تشكك المسلمين فى الاسلام علىفكره المسلمين دول واثقين من دينهم كويس جدا دا عن ثقه يابنىمش معنىان فى مسلم خالف دينه او قال كلام مش مضبوط ان حد مسلم فاهم هيصدقه اوحتى لو انت قولت من هنا لما تموت كلام تشكك فيه المسلمين فىدينهم لان المسلم يعلم قوله تعالى(يا ايهاالزين امنواازء جاكم فاسقا بنبا فتبينوا ان تصيبوا قوما بجهاله فتصبحواعلى مافعلتم نادمين)صدق الله العظيم .اناهقولك كلمة المسلمين متحاطين برحمه من الله عزوجل بس اللى هم فيه ده ابتلاء من الله لان الله ازءاحب ابتلى وازاء ابتلى رحم وازء رحم احل الرضوان وازء احل الرضوان ادخل الجنه. والله الزى لااله الا هومامن مسلم الا وسيدخل الجنه ويتنعم فيها لان رسول الله صلى الله عليه وسلم بشرنا بالجنه فوالله انى احزرك من غضب الله عليك الا تعلم ان الله قادر الم تسمع عن المسخ والخسف اللزان يحلان على من يخطط للمسلمين بسوء وفي الختام اسال الله ان يهديك للاسلام وان يشرح صدرك للاسلام وازاءاردت ان تعرف الاسلام من اهله اتصل بى واعلم ان ما نزل علي عيسى وموسى والانبياءالسابقين عليهم السلام الا الاسلام ديناان الدين عند الله الاسلام اما الكتب السماويه فهى الاختلاف فهزا القران وهزا الانجيل وهزا التوراءوهزا الزابور<br />والسلام عليكم ورحمة الله وبركاته"
