subject = "بلاش عبط والله"
author = "وليد الباز"
posted = "2006-03-18"
text = "يا مينا<br />ماذا لو قلت لك انت حمار<br />هل ستغضب<br />انت تسب الدوله الاسلاميه ماذا تريد ان اقول لك<br />سأقول لك شئ :<br />هناك فارق ضخم بين الاسلام والنصرانيه<br />الاسلام دين ودوله يعني فيه شريعه وقوانين تنظم شئون الحياة<br />فيه اقتصاد وسياسه واجتماع وأدب وفن و..........<br />لكن دينك ليس فيه من ذلك شئ بل هو يدعو الي التخلف وان نقول ان الارض مربعه وان العلم هو الذي اخرج ادم من الجنه وكنائس العصور الوسطي كانت تحرق العلماء وما الي هذا<br />عكس الاسلام الذي يدعو الي العلم والتقدم<br />ثم تأتي بنسب عجيبه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

