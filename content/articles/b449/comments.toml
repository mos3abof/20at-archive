author = "عبدالله مفتاح"
posted = "2006-03-25"
text = "اول حاجه انا عايز اعرف انا عميتها ازاي؟انا مشمتمتش لحسن حد يكون فكرني شتمت. كل ما فيها ان ردي كان حاد شويه.وده طبيعي لاني مش اول مرة اكلم مينا وبعدين مين اللي قال اني زعلان منه انا مشفق عليه فعلا لان هو قرا لبعض الكتاب العلمانيين وعبر عن آراؤهم ومقدرش يكمل دفاع عن معتقداتهم<br />يا اكرم ويا نيفين انا عيزكم كده تطلعولي الجمل اللي انا قلتلها ومكنش المفروض اقلها. عرفوني انا غلطت في ايه؟<br />اسلوبي كان حاد طبيعي لان مش اي واحد ييجي يناقشنا في ثوابتنا وانا كنت بدافع عن ثوابت ومينا بيناقشنا في ثوابتنا وبيستدل بالكاتبه سناء المصري اللي بتعدل على النبي صلى الله عليه وسلم في كتاباتها.<br />وبعدين عمال يقول انا لم اتطاول على رمز اسلامي كبير او صغير امال العروبه دي رمز ايه؟ العروبه والاسلام ايه ملهمش علاقه ببعض؟<br />على العموم انا بعتذر للجميع ان كنت زعلتكوا بس انا راعيت اني لا اسئ للمسلمين<br />وبعدين كل الهيصه دي عشان اتشتم عمال يلف في الموقع يقول روحو بيحصل ايه؟<br />ايه اللي حصل يعني واحد شتمه ايه؟<br />في حياته متمشتم.؟ هو حد قطع ايده في الصفحة دي عشان عمال يكتب في كل صفحه روحوا شوفوا بيحصل ايه؟<br />وييجي في الاخر يروح قايل تخلقوا باخلاق النبي.عشان واحد شتمه خلاص خلانا كلنا وحشيين ومش متخلقين باخلاق النبي صلى الله عليه وسلم<br />وتيجي في الاخر يا اكرم ويا نيفين تقولو اني جيت اكحلها عميتها؟<br />الله يسامحكوا بس يا ريت توضحوالي انا عمتها ازاي؟<br />ومش فاهم كلامك يا نيفين فهميني ايميلي اهو ابعتيلي وفهميني<br />wantedkey2@yahoo.com<br />والايميل التاني ابقي خديه منه وفهميني لاني بجد مش فاهم انا عميتها ازاي ؟<br />كل اللي قلته كلامك بينضح جهل وده حقيقي انا مش لاقي اثر لكلامه في تاريخ او علم .<br />الاعتذار للجميع لاني باين عليا زعلت ناس كتير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 54
subject = "فادي"
author = "يا منيا احنا جينا لنجدتك بس كسفتنا يا اخي شوف الحوار كان ماشي تمام بين مؤيد ومعرض الى ان دخلت انت و ابتديت بالغلط .. متخليق موضوعي شوية زهقنا من اسلوبك دا تنزل تجربح في الدين الاسلامي العظيم كما تسميه بعد كل اهانة و بعد كدة تيجي تدوشنا بصراخك في كل مكان بجد بجد يا اما انت فاكر نفسك فعلا على صواب ودي مصيبة ياما بتستهبل علينا .. واختم بقولي ضربني و بكى سبقني و اشتكى ... مش دا كلامك ودا الحوار الي عيزنا نقتدي بيه ..فكيف لمجموعة من الجهلة الفاشلين فى حياتهم الخاصة و العامة العلمية و العملية ان يقودوا بلد بحجم مصر"
posted = "2006-03-25"
text = "ثم توالت الدويلات التوارثية المتخلفة مثل ( وليست على الترتيب التاريخى )<br />1 الدولة الفاطمية<br />2 الدولة الايوبية<br />3 الدولة الطولونية<br />4 الدولة الاخشيدية<br />5 دولة المماليك<br />6 الدولة العثمانية والتى عاشت تحت حكمها جميع الدول الاسلامية فقيرة جاهلة مريضة متعصبة باستثناء تركيا .... وغيروا وغيروا ... الهمجية و الجهل صاروا عندك مرادفات للمسلمين اسمح لي اقلك كل الي بيحصلك من شر اعمالك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

