text = "انا اسف انا نسيت شوية حاجات<br />1 دور الفنان ( احمد راتب ) لم يكن فى فيلم ( الارهاب والكباب ) بل كان فى فيلم ( طيور الظلام )<br />2 اذا كنتم تحبون السينما الاسلامية فاكيد بتحبون دور الفنانة ( ياسمين عبد العزيز ) فى فيلم ( صايع بحر ) لانها محجبة ودى السينما اللى بيرجوها الاخوان المسلمين بس يا ترى ايه رايكم فى مستوى الفيلم الاهبل ده ؟؟؟؟<br />3 و كلمة اخيرة بقولها دايما وابدا ( الغبى هو الللى بيقع فى نفس الغلطة مرتين )<br />كل واى حكم دينى فى العالم او التاريخ فشل<br />من اول دولة اخناتون اللى نادى بتوحيد الاله فى صورة قرص الشمس وبدا يخلط الدين بالسياسة فضاعت دولته الى الابد<br />مرورا بالحملات الصليبية فى القرون الوسطى ( عصور الظلمة لاروبا ) وضاعت كل تلك الممالك والامبراطوريات والسلاطين و و الملوك الاوروبية الى الابد<br />ومرورا ايضا بالحكم الاسلامى المتقلب على نفسه ولنرى معا<br />1-قتل ( عمر بن الخطاب ) ثانى الخلفاء الراشدين ( ولا يدل قتل الحاكم الا على عدم رضى المحكومين عنه )<br />2-قتل ( عثمان بن عفان ) ثالث الخلفاء الراشدين<br />3-وكذلك قتل ( على بن ابى طالب ) رابع واخر الخلفاء الراشدين<br />ثم جاءت الدولة الاموية التوارثية المتخلفة التى حكرت الحكم عليها هى و نسلها وانتهت نهاية ماسوية دموية<br />ثم جاءت الدولة العباسية التوارثية ايضا والمتخلفة ايضا وانتهجت نهج سابقتها ( الولة الاموية يعنى ) وحكرت الحكم عليها هى و نسلها وايضا انتهت نهاية ماسوية دموية قاسية تتناسب مع ما فعلته تلك الدولة بالمحكوميين<br />ثم توالت الدويلات التوارثية المتخلفة مثل ( وليست على الترتيب التاريخى )<br />1 الدولة الفاطمية<br />2 الدولة الايوبية<br />3 الدولة الطولونية<br />4 الدولة الاخشيدية<br />5 دولة المماليك<br />6 الدولة العثمانية والتى عاشت تحت حكمها جميع الدول الاسلامية فقيرة جاهلة مريضة متعصبة باستثناء تركيا<br />وجميع الدول الاسلامية السابقة ابتدات بداية ماسوية دموية على انقاض الدولة التى قبلها وانتهت ايضا نهاية ماسوية دموية و على انقاضها ولدت الدولة التى بعضها<br />وكل تلك الدول فشلت وذاق الشعب العربى سواء كان شعب مسلم او مسيحى ذاق الامرين والاهانة و التعذيب والتخريب و الفقر و الجهل والجوع والتعصب و التخبط و الارهاب والموت<br />وهذا ما ترجوه جماعة الاخوان المسلمين تصل الى الحكم عبر العبارات الملتبسة المزيفة والتى لا تقيد الاخوان المسلمين باى صورة ولا تمط بصلة اساسا اليهم<br />وبمجرد ان تصل الى الحكم تستبدل الرئاسة بالخلافة والوزارات بالدواويين والدستور بالشريعة الاسلامية لتفتح للتاريخ فرصة ليعيد نفسه ويكرر الاحداث الدموية التى راها الشعب العربى تحت الحكم الدينى ولكن فى نسخة مطورة<br />واخيرا نصل الى الامثلة المعاصرة للحكم الدينى الفاشل<br />1 عندما خلط الهنود ( الهنديين ) عندما خلطوا الدين بالسياسة اقتطعوا جزءا من الهند واستقلوا به عن الهند ( الدولة الام ) واسسوا دولة دينية اصبحت الان ارهابية تسمى بباكستان وكلنا نرى ما يحدث فيها من حكم ارهابى بوليسى<br />2 ويريدون بعض الهنود الجدد تكرير نفس الواقعة فى مثلث اقليم كشمير و كل هذا ناتج عن خلط الدين بالسياسة<br />3 ونظام طالبان الارهابى فى افغانستان<br />4 والحكم الارهابى البوليسى فى ايران<br />5 والحكم الوراثى المتخلف الهمجى فى معظم الدول العربية التى تطبق الحكم الدينى<br />هل رايتم لا توجد دولة دينية واحدة فى الواقع ولا فى سجلات التاريخ كتب لها النجاح فكيف تنتظرون نجاح فى دولة مصرية اسلامية<br />ولا يستطيع الاخوان المسلمين و لاغيرهم من توفير عوامل نجاح اكثر من تلك التى كانت موجودة ايام الخلفاء الراشدين مثلا او الدولة العباسية<br />اى ان فرصة بقاء تلك الدولة الدينية الان اقل من فرصة بقاءها زمان مع العلم انها فشلت زمان فما الدليل عل نجاحها الان"
