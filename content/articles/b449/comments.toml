subject = "تعقيبا على مصرى"
author = "سمر عبدالله"
posted = "2006-03-03"
text = "و لماذا يا أخ مصرى لا ترى الموضوع من زاوية أخرى؟؟؟فبالمثل,أين هم شيوخ الازهر مما يحدث<br />للمصريين من تعذيب و اهانة و ظلم,نشاهدهم فى جميع القنوات ليل نهار,يتحدثون فى كل شىء و أى شىء<br />حتى العلاقة بين الرجل و زوجته,لا يتذكرون أن الاسلام له علاقة بالسياسة و أن من حقهم أن يدلوا بدلوهم الا<br />عندما يقوم شخص تافه بالاساءة للرسول-عليه الصلاة و السلام-,تقوم قيامتهم و يدفعون الناس للانتصار فى<br />موقعة الدانمارك المجيدة,لكن أن يقولوا كلمة حق فى وجه سلطان جائر,فطبعا لا و ألف لا.<br />أنا لا أدافع عن الفنانين,بالعكس,أنا أوافقك الرأى فيما قلته,فأمثال حسين فهمى و يوسف شعبان رائعين جدا<br />فى التحدث عن ظلم عبدالناصر,لكن أن يقولوا نص كلمة عن فساد حسنى مبارك و عصابته,فلا يجرؤون<br />طبعا.<br />لكن لنكن واقعيين,أيهم أكثر تأثيرا؟؟؟؟؟مهما بلغ تأثير الفنانين على الناس فهو لا يصل بأى حال من الأحوال<br />الى قوة الشيوخ الذين يتحدثون باسم الله و الرسول ,الشيوخ يلعبون على وتر التدين لدى الكثيرين,و هو ما يدفع<br />الناس للأخذ بكل ما يقولوه,أو على الاقل الايمان به,لذا فعليهم العبء الأكبر فى توعية الناس و تحفيزهم لرفض<br />الظلم و عدم السكوت عليه,لكن لا حياة لمن تنادى,فهم \"يستأسدون\" على الفنانين و الادباء الذى لا يراهم أو<br />يسمع عنهم غير عدد محدود من الناس لا يبلغ بأى حال من الأحوال عدد من يسمع لهؤلاء الشيوخ.<br />رجاء,دعوا من يتكلم يتكلم,لا نريد رقابة من أحد,تكفينا رقابة النظام اللى بيعد علينا النفس اللى بنتنفسه.<br />السلام عليكم."
