posted = "2006-03-16"
text = "اولا انا وبجد انا فى منتهى الاندهاش من الناس اللى بتكفر وحيد حامد والبعض الاخر اللى بيصفه بقليل الوعى وشوية شوية هتهدروا دمه<br />وحيد حامد من المؤلفين المحترمين ودايما الشجرة اللى بيترمى عليها طوب هى الشجرة المثمرة فقط<br />والدليل ان فيلمه الاخير (دم الغزال ) دعوة حقيقة للفكر والحوار الدليل هو ما احنا عليه الان من حالة حوار ونقاش وتفكير فشل فيلم زى ( صايع بحر ) فى دفعنا نحو الحوار و النقاش ولم يهتم الموقع اساسا بنقده<br />فشلت كل افلام الارجوزات والضحك فى دفعنا نحو الحوار و النقاش والتفكير<br />ثانيا بالنسبة لبعض الاخوة اللى بيقولوا ان وحيد حامد متحامل فى كل افلامه على الاسلام والمسلمين وانه دايما بصور المسلمين بالارهابيين<br />فانا بقوله ودور الفنان ( صلاح ذو الفقار ) فى فيلم ( الارهابى ) بيجسد شخصية واحد مسلم ارهابى ؟؟؟؟؟؟؟؟؟؟<br />ام بيجسد شخصية واحد مسلم متحضر و معتدل وفاهم دينه الاسلامى العظيم صح؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />ودور الفنان ( احمد راتب ) فى فيلم ( الارهاب والكباب ) بيمثل شخصية مسلم ارهابى مسلح ؟؟؟؟؟؟؟؟؟<br />ام بيمثل شخصية مسلم معتدل على الرغم من فقره رفض يتاجر بدينه ؟؟؟؟؟؟؟<br />وشخصية الفنان ( محمود مرسى ) وعائلته فى مسلسل( العائلة ) كان بيمثل شخصية اسلامية ارهابية ؟؟؟؟؟؟؟؟؟<br />ام شخصية اسلامية محترمة<br />اذا كنتم لم تروا هذه الاعمال الفنية القيمة فاذهبوا وشاهدوها<br />وان كنتم رايتموها فعليكم ان تعلموا ان وحيد حامد كان منصف و عادل فى ابراز و اظهار الشخصيات الاسلامية ما بين معتدل ومتشدد ومتحضر وهمجى ومتعلم و جاهل<br />انه التنوع سنة الكون زى ما التغير سنة الحياة<br />اما بقى انتم على شاكلة المؤرخين العرب اللى دائما وابدا بيبرزوا و يظهروا فقط الجانب المضىء المشرف للتاريخ الاسلامى اما كل ما هو مظلم ومخجل فيتناسوه فى بحر النسيان<br />ان كنتم كدا فانا بقولكم ان اول خطوات علاج المرض هو الاعتراف اساسا بوجود المرض<br />بمعنى انا عندى مثلا انفلونزا فليس كتمان المرض و السكوت عليه هو الذى سيشفينى من المرض بل الاعتراف بالمرض و الذهاب الى الطبيب والعلاج وبالتالى الشفاء<br />لكن مصر بتعانى دائما من المرض لانها مش عايزة تخطو الخطوة الاولى فى علاج المرض و هو الاعتراف بوجود المرض<br />فتلك الجماعات الاسلامية الارهابية المسلحة موجودة وتنهش فى جسد مصر الواحد ( مسيحى ومسلم ) بل و نجحت فى الكثير من اغراضها ولكن بمجرد ان تمسك الحكم سنتحول الى ( طالبان غى افغنستان الجزء 2 ) ثم تدخل امريكا مصر باى تلكيكة ونتحول الى ( العراق الجزء 2 ) من فضلكم حبوا بلدكم بحكمة وايجابية و علم<br />ويكفى انى اقولكم ان 68 % من كل جماعة الاخوان المسلمين المحظورة لم يكمل تعليمه<br />وان اكثر من 20 % منها لا يعرف اساسا القراءة و الكتابة<br />فكيف لمجموعة من الجهلة الفاشلين فى حياتهم الخاصة و العامة العلمية و العملية ان يقودوا بلد بحجم مصر"
