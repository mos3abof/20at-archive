text = "انا قلتها مرة واحدة على النت ولكنى مضطر اقولها مرة تانية<br />انا والله العظيم تلاتة قرفان ارد عليك لانى ساعتها هبقى زيك مختل نفسيا ومشوش وجاهل و متخلف ومتعصب ومعمم ومعتم عليك<br />صدقنى انا بستجمع قواى بالعافية عشان ارد عليك لانى من غير هذار او مبالغة قرفان اخر قرف وحاسس انى بتكلم فى الشارع او على قهوة بلدى او فى اى حتة قذرة مش نظيفة تجمعنى بيك يا جاهل<br />المسيحيين مش متخلفين المسيحيين اصحاب حضارة وتاريخ وماضى مشرف ووحاضر متقدم ومستقبل واعد<br />المسيحيين همن اوروبا اللى متقدمة المتحضرة اللى بترسل ( للاسف ) معونات غذائية للجعانيين فى مصر امثالك ولا تاخد منك الا الشتيمة و قلة الادب وقلة الدين وقلة التربية وقلة الذوق وقلة الاخلاق<br />المسيحيين همن امريكا الشمالية المتقدمة المتحضرة اللى ( للاسف بتتحكم فيك )) وانتا مش عارف تحرر نفسك وفاضى تشتم المسيحيين وبس<br />السعودية المسلمة<br />1 اكبر سوق للفياجرا فى اسيا<br />2 السعودية + الخليج اكبر سوق للفياجرا فى العالم<br />3 اكثر الكتب مبيعات فى السعودية كتب الجنس<br />4 ثانى اكثر الكتب مبيعات فى السعودية هى كتب الطهى<br />5ثانى اكبر نسبة ارتياد للمواقع الجنسية فى العالم على الانترنت من نصيب السعودية<br />انا متاكد وومتيقن انك مش فاهم ولا كلمة واحدة من اللى انا قلتها لانك بجد باين عليك فاشل فى حياتك الدراسية والعملية وقاعد عاطل على سيبر تكلم البنات وتشتم فى المسيحيين شكرا جزيلا انتا اعطيت صورة نموذجية للمسلم القويم ؟؟؟؟؟؟؟؟؟<br />يا ر يت يا اخوة و اخوات المسلمين المستنيرين التدخل لانى فعلا قرفان من التكلم مع واحد بالمستوى البذىء ده<br />وياريت حد يتدخل ويعرف الجاهل المتخلف العاطل الفاشل ده انه للاسف للاسف يعطى انطباع عن الاسلام ولولا انى اعرف الاسلام حق معرفة لكنت عندما شاهدت تعليق الهمجى ده كنت اخذت فكرة غلط عن الاسلام العظيم<br />ولكن فعلا فعلا ( لا يعيب الاسلام سوى المسلمين ))<br />يا ريت تدخل سريع من الاخوة و الاخوات المسلمين و المسلمات لوقف هذا الهمجى صدقونى على الاقل لحماية دينكم من التشويه<br />وانا متاكد انه مش فاهم و لا كلمة من اللى انا قلتها ومش هيتاثر الاخ ده مغيب<br />شنودة؟؟؟؟؟؟؟؟ ده انا لما بتكلم على شيخ الازهر بقول شيخ الازهر ومش بناديه باسمه وكانه معايا فى الحارة لكن انتا هتسمع الفاظ نظيفة فين لان العينة بينة واضح جدا جدا انك انك لا تسمع على الاطلاق سوى الالفاظ النابية القذرة الحقيرة المتدنية اللى انتا بتقولها"
