subject = "بلاش عبط والله2"
author = "وليد الباز"
posted = "2006-03-18"
text = "ثم تأتي بنسب عجيبه عن التعليم والذين لا يعرفون القراءة والكتابه في الاخوان<br />كأنك في مركز الاحصاء<br />وما قلته اتحداك ان تأتي بمصدره لأنه لم يخرج الا من ذهنك المريض ربنا يشفيك<br />اي شخص يعلم جيدا ان معظم الاخوان علي مستوي البلاد هم من الشباب وكثير منهم تعرفوا علي الاخوان في الجامعات<br />والكبار من الاخوان كذلك تعرفوا علي دعوة الاخوان في الجامعات<br />وكثير من الاخوان اساتذة جامعات واطباء ومهندسين<br />ولعلك لا تدري شيئا عن النقابات المختلفة وتفوق الاخوان الساحق<br />وأخير اقول لك انت كنصراني لن تعيش في سعادة وتحت مظلة العدل الا بحكم الاسلام<br />والتاريخ الصحيح خير شاهد علي ذلك<br />وللحديث بقية ان شاء الله"
archived = "2006-11-02"
