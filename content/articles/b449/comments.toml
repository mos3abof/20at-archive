text = "الخلاصه ان وحيد حامد أحد الاستثناءات القليله النى كان يسمح لها بكسر بعض التابوهات والمحظورات السياسيه والدينييه والجنسيه بدعم من النظام من قبيل (ورده فى الجاكته) فى مقابل ضريبه يدفعها للنظام فى شكل اعلانات مدفوعة الأجر ضد بعض القوى المهمشه والمضطهده مثل الاخوان المسلمين"
