subject = "الفكر اليساري مسيطر"
author = "محمد الرحيب"
posted = "2006-02-16"
text = "قبل قرأتي للموضوع بموقع أخوان اون لاين كنت افكر في فيلم عمارة يعقوبيان الذي كتب له السيناريو و الحوار المؤلف وحيد حامد وفكرت في كم التحامل الواضح من قبل المؤلف علاء الأسواني و السيناريست و الممثلين ايضا. رأيت ذلك من خلال الندوة التي عقدت علي غرار هذا الفيلم فعادل إمام و يسرا وغيرهم كثير من الفنانين لم و لن يستطيعوا تكوين رأي منصف في الإخوان لأنه و للأسف الشديد الكثير من فنانين مصر ليس لديهم وعي سياسي . أمالمجموعة الأراء التي نسمعها من هؤلاء فما هي إلا أراء النظام الحاكم الذي يعترض بالطبع علي أي وجود للإخوان و لو كان بيده لشنق عموم الإخوان علي مرأى و مسمع من العالم كله لأنه وجد فيهم المنافس القوي و الحقيقي.<br />أريد أن أقول بأنني أتشرف بإنتمائي للإخوان و حاليا أدرس المسرح بشكل أكاديمي و أتعلم السولفيج لأنني بفضل الله أمتلك موهبتي الغناء والتمثيل وقد شجعني الإخوان في الحي علي ذلك ليس بغرض ان نقول بأن في الإخوان من يدرس الفنون علي يد متخصصبن و لكن هذه هي طبيعة الإخوان يفهمون الإسلام علي أنه دين شامل يتناول مظاهر الحياة جميعا و الفن مظهر من مظاهر الحياة . و لكن الغريب أنه أثناء دراستي قال لي رئيس القسم بأن اليساريين و العلمانيين مسيطرين علي الفنون في مصر ثم ضحك و قال (يعني إللي حيعمل محترم مش حياكل عيش)فوحيدحامدوغيره من المتحاملين علي الإخوان يعلمون أن نقاء و طهر الإخوان سوف يقضي ليس علي تلك النفوس الخبيثة و لكن سيقضي علي الخبث الذي علق بها لأزمنة مديدة<br />لذلك أرجو من عموم الناس ألأ ينظروا للإخوان بأنهم أعداء للفن و ذلك لأن الإخوان قبل تفكيرهم في خوض العمل السياسي أستخدموا الفن النظيف في توصيل الفكرة و ذلك من خلال مسرح الإخوان في ثلاثينيات القرن الماضي و كان يضم المسرح مجموعة من الشباب الواعد أمثال الفنان محمود المليجي و الفنان عبد المنعم مدبولي و من العناصر النسائية الفنانة فاطمة رشدي و الفنانة عزيزة أمير<br />. أرجو عدم التحامل علي الإخوان لأنهم يحملون الخير لمصر<br />و سلام الله عليكم و رجمته و بركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 15
subject = "سينما اسلامية ازاي يعني!!!"
author = "Dabdoob"
posted = "2006-02-16"
text = "الاول انا دبدوب وليس دودو<br />وعايز اقول للاخ (اكرم من كده مفيش ) ان السينما الايرانية مع احترامي الشديد تعاني من عشرات وعشرات الموانع والمحاذير ولذا فهي تميل لانتاج الافلام التي تتحدث عن الافكار الفلسفية المجردة في الغالب للتغلب علي عدم امكانية التعامل مع نماذج كثيرة في المجتمع كما ان الدور النسائي فيها محدود بشكل واضح خاصة اذا علمت ان الممثل لا يقترب من الممثلة اكثر من مترين . وكلامي لا يعني اني ضد السينما الايرانية او الاسلامية ولكني اقصد انها سينما غير مكتملة تماما وتلجا كثيرا للانتاج خارج اراضيها للتحايل علي الرقابة الايرانية والفيلم اللي انت شفته علي الفيوتشر هو نموذج من الافلام دي. بالمناسبة الرقابة الايرانية اعترضت علي ان البنت اليهودية كان شعرها مكشوف وترتدي جيب يكشف عن نصف ساقيها.<br />اما بالنسبة لفيلم الشيماء فانا معاك انه مش فيلم اسلامي بل هو فيلم يتكلم عن الاسلام (واعتقد ان ده يؤيد وجهة نظري) لان به مشاهد كثيرة محذورة دينيا مثل المشاهد العاطفية بين الشيماء وزوجها ومشاهد الراقصات والخمور.<br />اخيرا اظن ان اقرب فيلم للنموذج الاسلامي (كما يطلقون عليه) هو فيلم من عينة عمر المختار . وحتي هذا الفيلم به بعض المشاكل الدينية وان كانت قليلة بالفعل.<br />اخيرا بالنسبة للاخ الاخواني الذي يتحدث عن سيطرة اليسار فاقول له ان الناس عموما والاسلاميين خصوصا يخلطون بين الليبراليين واليساريين فيطلقون علي كل من يعارضهم (او بالاصح يعارض افكارهم الدينية) لقب اليساريين وهذا غير صحيح. ولكنني اتفق معه ان معظم الفنانين معارضين للافكار الدينية وهذا طبيعي بالنسبة لهم.<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 16
subject = "الدراما والاسلاميين"
author = "أحمد شوشه"
posted = "2006-02-17"
text = "دعونا نتأمل بنظرة أخرى للموضوع وهى نظرة السينما للاسلاميين ودعونا نتذكر نظرة السينما لأصحاب اللحى او اصحاب الفكر الاسلامى سواء الارهابى أو طيور الظلام او العائلة او مسلسل امرأة من زمن الحب .... الى آخر تلك الاعمال التى تعرضت لاشخاص تسيطر الأفكار المستوحاة من الاسلام عليهم سواءآ كان مظهرهم او جوهرهم .<br />ستجدان النظرة دائمآ سلبية لكل ما له علاقة بالاسلام ودائمآ ما كان البديل هو المصرى بسماته التى رسمتها لناالدراماوالتى تقدم دائمآ شخص بديل رائع معتدل يخطىء احيانآ الا انه فى النهاية شخص ابيض السريرة وشرط ان يكون بعيد تمامآ عن التدين.<br />ودائمآ يكون التدين ملازمآ للتطرف والذهاب الى المسجد مقرونآ بحمل السلاح والاسلاميين ليسوا فقط ارهابيين بل حمقى و الشر بيفط من عينيهم وبيتكلموا زى رؤساء العصابات فى الافلام العربى القديمة ده غير ان شكلهم وحش وبيستحلم الحرمات.<br />وكثيرآ من الشباب صدم عندما تعامل مع اسلاميين نشطين سواء من ارتضوا المدنية والحياة كالاخوان أومن تمسكوا بالعنف كالجماعة الاسلامية والتكفير والهجرة فدائمآ هناك مشروع فكرى وحلم سياسى ولكل اسبابه كما ان كثيرآ من الاعمال التى واجهت الاسلاميين بها تجاوزات كمشاهد العرى التى لا يقبلها المواطن العربى بفطرته وان قبلها لا يحترمها وهنا يبدو ان هؤلاء المنحلين يريدون تشويه صورة الاسلام الرافض للانحلال وان لم يشهد العمل تجاوزات فالتجاوزات موجوده فى اعمال اخرى من غالبية فريق العمل.<br />هنا اتذكر رؤية المخرج العالمى سبيلبرج عندما سأل عن سبب غضب اليهود منه وهو للعلم يهودى ايضآ فقال ان الفلسطينين الذين قاموا بقتل اعضاء البعثة الاسرائيلية فى الاولمبياد لهم ايضآ افكارهم واسبابهم وان عالجنا القضية فيجب سماع الجميع.<br />وهو ما لم يحدث فى معالجة السينما للموضوع.<br />اما بالنسبة للموضوع الاصلى فوحيد حامد فهو لا يحب اى شىء له علاقة بالاسلام فعلآ ولا أظن ان أحدآ لم تصله هذه الفكرة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 17
subject = "أنا متفقة مع DABDOOB"
author = "Samar Abd-Allah"
posted = "2006-02-17"
text = "بلاش نصنف الفن بالنظيف و الهادف لان دى كلها حاجات هنختلف فيها أكتر ماهنتفق,من حق أى حد انه ينتقد أى حد ,لكن مش من حق أى حد انه يحجر على رأى أى حد و يطالب برقابه,<br />اللى مش عاجبه ببساطة ما يتفرجش لكن مايعملش وصى على الاخرين.<br />بالنسبة لوحيد حامد,أنا كمان مابحبش أسلوب طرحه لأفكاره,بحس انها سطحيه و نمطيه جدا,لكن ده مش معناه<br />اننا نتهمه بمعاداة الاسلام,ده كلها افتراضات و دخول فى النيات و ربنا وحده هو العالم بالنوايا<br />بالنسبه للاخوان,أنا بالعكس متحمسلهم جدا و شايفه انه لسه بدرى اننا نحكم عليهم,كل حاجة هتبان من خلال<br />أداءهم فى البرلمان,هيبان اذا كانوا هيطبقوا اللى بيقولوه و لا لأ.<br />و يهمنى جدا انه الناس تعرف انه الاخوان مش هما الاسلام , و مش معنى انه حد بينتقد الاخوان انه بالتالى بينتقد<br />الاسلام,الاخوان نفسهم أكدوا انهم بيقدموا الاسلام بمفهومهم لأنه الاسلام أكبر بكتير من أن تمثله فئة و تحتكرة<br />لنفسها<br />بالنسبة ل\"عمارة يعقوبيان\" ياريت بلاش حد يحكم سماعى من غير ما يكون شاف الفيلم أو قرأ الرواية, اللى قرأ الرواية حيعرف انه شخصية الاسلامى اتقدمت بطريقة انسانية جدا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
