subject = "اتقى الله"
author = "خالد الهوارى"
posted = "2006-02-22"
text = "قال تعالى ( وماخلقتُُ الانس و الجن إلا ليعبدون )<br />يااخى اعلم ان الفن وسيلة مساعدة لخدمة الدين كل شيىء مسخر لخدمة الدين وما يتعارض مع الدين فهو مرفوض جملة وتفصيلا<br />فنحن لم نخلق من اجل السنما ولكن السينما<br />قد تساعد فى فهم الدين وقد تهدم<br />فاقول لك اتقى الله وسوف تحاسب على ما تقول"
