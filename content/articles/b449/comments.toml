[[comments]]
order = 49
subject = "رد علي كلامي"
author = "عبدالله مفتاح"
posted = "2006-03-24"
text = "ايه يا مينا مترد على كلامي مش بترد ليه؟<br />ايه مش عندك رد؟<br />مش اوروبا اللي انت عايزنا نبقى زيها هيه اللي فيها فوضه جنسيه واختلاط انساب وزواج المثلين مش هوة ده النموذج اللي انت عايزنا نقتدي بيه<br />يعني منتهى املنا اننا نكون عندنا انساب مختلطه والشواذ ياخدوا راحتهم ويتزوجوا بعض؟<br />ايه يا مينا مترد عليا انا هكتبهالك كام مرة؟<br />مش هوة ده النموذج اللي انت طالع بيه السماء ؟<br />وعمال تتريق على السعوديه وناسي او بتتناسى اللي في اوروبا<br />هي السعوديه نبص على اي حاجه فيها على انها سلبيه ؟<br />ونغض بصرنا متعمدين عن اللي في اوروبا؟<br />مترد عايزنا احنا كمان يكون عندنا حرية جنسيه؟<br />هي دي المجتمعات اللي عايزنا نخليها مثلنا الاعلى؟<br />ايه الخيبه دي<br />والكاتبه المحترمه سناء المصري معروفه انها علمانيه ( المراه عندما يطالبونها بإخفاء جسدها العورة ويسبونها بأقذع الشتائم وأبشع الصفات .. يغازلون لديها – في نفس الوقت – المثيرات الحسية ويطالبونها بأن تكون عاهرة للزوج في مواضع أخرى ...)ده جزء من كلام المحترمه سناء المصري وعلى فكرة سناء المصري المحترمه كتير بتذكر احاديث للنبي صلى الله عليه وسلم وتعلق عليها بسلبيه زي ميكون النبي المفروض مكنش يقول كده .<br />يعني للاسف يا مينا انت مسلم عقلك لكام واحد وواحده العلامنيه مسيطرة عليهم وعمال تتكلم بلسانهم ولسانك انت لم ينطق بشيء يعني من الاخر اللي بيقولوله بتقولو .<br />ومستني ردك على المجتمع الاوروبي اللي عايزنا ناخده مثل اعلى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

