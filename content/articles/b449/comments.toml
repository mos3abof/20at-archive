text = "المتخلف اللي اسمه مينا يحول الامر الي متاهات لا تنسى يا حيوان أن الكذب وعدم النظافة هما سمتان أستسيين فيكم وان تخلفكم العلمى وليس الحضاري سيبتوه لما رميتوه التجسيد وغيره من الكلام الفارغ في الزبالة وأصبح العلم هو الكل في الكل قال المسيح النبي عبد الله اله قال يا متخلف بتروح لشنودة يضحك عليك ويستعبدك لحسابه روح روح"
