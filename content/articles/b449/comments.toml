subject = "سينما الاطفال"
author = "أكرم"
posted = "2006-02-18"
text = "انا مع دبدوب ان السنما الايرانية ضعيفة نسبيا و تشبه لحد كبير سينما الاطفال و لكني قصدت انها سينما اسلامية بالمعنى المقهوم و المراد من هذا التعبير<br />أما عن تسطيح الشخصيات اي جعلها ثنائية الابعاد فالشرير شرير على طول الخط و الطيب ساذج و مسالم على طول الخط فدي مشطلة كبرى من مشكلات السينما و المجتمع<br />و الدليل ان لما تعددت اراء الموقع في فيلم دم الغزال سألت اختنا هبهوب هو الفيلم حلو و لا وحش ؟؟؟<br />بكل بساطة كده مافيش حاجة حلوة بيور ( نقية ) و لا حاجة فاسدة لبور ( نقية برضه )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

