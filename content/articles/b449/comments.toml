order = 42
subject = "من مينا الى الجميع"
author = "مينا"
posted = "2006-03-24"
text = "انا مش هقول زى كل مرة اشكر<br />فلان على ادبه واشكر علان على اخلاقه<br />واعتب على الاخ بسبب قلة اخلاقه<br />واعتب على الاخت بسبب عدم الموضوعية<br />لان الظاهر ان بعض الناس بتحب تخالف<br />القاعدة وخلاص بمعنى انه لو فى<br />قاعدة ان الكل مؤدب و متربى و<br />مهذب تلاقى واحد يحب يخالف القاعدة<br />لمجرد الخلاف والاختلاف<br />اولا احب الفت نظركم جميعا الى<br />فى منتهى منتهى الغرابة وهى انه<br />( ولا واحد ولا واحدة علق على الاخ<br />الغير مهذب الغير متربى اللى انا<br />معرفش اسمه و مش عايز اعرف اسمه )<br />وبتكلموننى وكاننى انا اللى بدات<br />وانا اللى شتمت وانا اللى افتريت<br />مع ان واقع الاحداث بيقول ان الحوار<br />كان ماشى فى اطار سليم و مهذب<br />وتقريبا اوشك على النهاية باتفاق<br />فى الاراء لولا ظهور الاخ الغير مهذب<br />ممكن قبل وكل شىء حدو يفسر لى<br />الحاجة الغريبة دى ( حاجة انكم لم تعلقوا سوى على كلامى )<br />وبعدين انا اللى استنجدت بيكم وانا اللى ناديتكم عشان تشوفوا مين اللى بيقلب مائدة الحوار و مين بخش على الناس اللى بتتكلم ويولع فى الدنيا<br />كانت المفاجاة انكم بتتهموننى انا بالتهكم على الدين الاسلامى<br />واحب اؤكد لكم بعض الحقائق وربنا وحده يعلم بصحتها<br />1 انا بحب بلدى بصورة جنونية وشايف فى رايى المتواضع ان العدو الاول والاخطر والرئيسى للبلد ددى هو التعصب<br />2 انى بحترم الدين الاسلامى احترام كبير وارجعوا واقراؤا كل تعليقاتى على مختلف الصفحات على الموقع ده تعرفوا و تتيقنوا انى اكن كل الاحترام للدين الاسلامى وانى بلزق التخلف والتعصب و الهمجية والجهل والجنس فى العرب وليس الاسلام شوفوا واقراؤا كويس<br />واحد او واحدة فيكم سالت سؤال وردت على نفسها فى نفس السطر<br />قالت تقريبا ما معناهه ان بشتم السعودية وعيب على لما اشتم الدين الاسلامى طيب ما انتى جاوبتى على نفسك وقلتى بشتم السعودية يبقى فين الاهانة للاسلام<br />انا حبيت اجيب للاخ الغير مهذب مثال من الدلو المسيحية و مثال من الدول الاسلامية فقط فقط للمقارنة<br />3 والاهم على الاطلاق والله العظيم تلاتة انا عمرى ما قلت معلومة على اى صفحة على اى موقع وكانت المعلومة دى غلط او حتى ناقصة<br />واللى مش من الاصول بجد بجد انكم تكذبوننى وتدعو انى بكذب و معندكمش اى دليل<br />عمركم شفتم البوليس بيحبس الناس من غير وجود جسم الجريمة<br />انتم بالظبط كدا بالظبط انتم معندكمش ما يكذبنى او حتى ينتقص من صحة معلوماتى ومع ذلك بتكذبونى دى اصول حوار ده عدل<br />الاصول والصح هو انكم تسالونى من فين انا جبت المعلومات والارقام دى ولو معرفتش ارد يبقى انا بفبرك الارقام عليكم<br />وانا مع كامل احترامى ليكم مش هسمح لكل من هب ودب انه يكذبنى فى معلوماتى اقرا يا عم و اتثقف و اعرف وتعالى كلمنى لكن متكنش على جهل وتكذبنى<br />وانا كنت و مازالت و ساظل على اتم استعداد لاعطائم المصادر و المراجع التى استقى منها معلوماتى وارقامى ولو فى رقم او معلومة او حتى حرف واحد بس غلط انا مش هتكلم تانى على النت<br />ده بس الللى ليكم عندى غير كدا مش هسمح لاى حد على الاطلاق يكون قاعد فى بيته لا بيقرا و لا بيكتب و لا بيتثقف يطلق الاتهامات على النت على الفاضى<br />4 وتانى وتانى وتانى يا محترمون يا اساتذة يا مثقفون يا مبدعون انتم ليه بتخلطم الاصل بالعقيدة انا بهاجم فى كل تعليقاتى الاصل العربى و بتهمه ودى حقيقة بالارهاب والتخلف و الجهل و الفقر و الجوع والمكابرة و الاستكبار و العيش على امجاد الماضى لكنى لم اهاجم فى تعليق واحد فقط من تعليقاتى الاسلام سامع يا اخ عبد الفتاح يا ذكى انا مش بهاجم الاسلام انا مش بهاجم الاسلام ومع كل ده انا متاكد ان بكرا هيجى واحد جاهل وعامل ذكى و يقول لى ساخرا انتا ليه بتهاجم الاسلام ؟؟؟؟؟؟؟؟<br />انا مش بهاجم الاسلام يا اخت هبة ومن فضلك بلاش فلسفة مفيش حاجة اسمها شتيمة من فوق الحزام و شتيمة من تحت الحزام الشتيمة شتيمة و المدح مدح تقدروا ترجعوا لكل تعليقاتى و تشوفوا الحقيقة<br />انتى بتقولى يا هبة ((اعرف مسيحيين انضف منك))شكرا جزيلا على اللفظ يا مهذبة<br />يا محترمون بالنسبة للاخ عبد الفتاح انا لا اسقط سلوك السعوديين على الاسلام سامع الاهم انك تكون فاهم<br />انا اخذت مثال لدولة عربية مش للاسلام لان فى دول عربية كويسة زى<br />1 سوريا 2 لبنان 3 الامارات 4 الاردن 5 الكويت 6 قطر<br />فاهمين يا ناصحين انا بهاجم العروبة مش الاسلام<br />لاخر مرة انا يا هبد الفتاح انا لا اخترع و لا اصتنع ولا ابتكر ولا افبرك رقم واحد فقط من ارقامى او معلوماتى ومش هسمح ليك بعد كدا تهددنى و انتا لا تقرا و لا تتثقف و قاعد فى بيتكم عندك كلام غير اللى انا بقوله اتفضل قوله و معاه المصدر غير كدا ملكش حاجة عندى غير انى اقولك مصدر معلوماتى هى دى الاصول مش كل من هب و دب والكلام مش جاى على مذاجه يكدب فى الناس عندك يا اخ عبد الفتاح معلومات غير اللى عندى اتفضل قول غير كدا تسكت وتسمع و تستفيد اظن ده مش عيب<br />اكتر واحدة موضوعية و مؤدبة و مهذبة و محترمة فينا كلنا هى الاخت نفين<br />يا ريت محدش يستذكى ويقول مينا بيمتدح نفين عشان هى اقل واحدة شتمته<br />لا يا محترمون لان تعليقاها موضوع و تناولت بشكل صغير تعليق الاخ الغير مهذب<br />1 ممكن يا محترمون تطلعوا لى لفظ واحد خادش لحياء انا قلته فى حق الاخ الغير مهذب اكيد مش هتلاقوا مع ان ده حقى انى اشتمه و اقوله الفاظ خارجة لان طبيعيا ( لكل فعل رد فعل مساوى له فى المقدار ومضاد له فى الاتجاه )<br />وانا مش ملاك انا انسان طبيعى وطبيعى استجيب للمؤثرات الخارجية يا ريت نلتمس العذر<br />واخيرا للاخ عبد الفتاح انى برفض الدولة الدينية حتى ولو كانت دولة دينية مسيحية مش زى ما انتا اتفلسفت و خطبت انى مشوش ومش مقتنع بادين<br />لا ياناصح لا يا ذكى لا يا دارس ان برفض الدلوة الدينية حتى و لو دولة دينية مسيحية<br />لان فعلا فعلا الدين لله والوطن للجميع<br />بمعنى الدين هو علاقتك بربنا ما الوطن فههو للجميع<br />وانا مش هشرح تانى الامثلة الفاشلة للدول الدينية والمسيحية والاسلامية وحتى الوثنية تقدر ترجع لاول ثلاث تعليقات لى وهتعرف ان مفيش فى التاريخ ولا العالم دولة دينية واحدة ناجحة<br />انا برفض الدول الدينية بانواعها حتى و لو كانت دولة مسيحية<br />واخيرا ربنا وحده هو الللى يعلم انى على قدر استطاعتى بحاول نشر الحب و الالفة و السلام و الامان والمفقودون بين المسيحيين والمسلمين<br />ومتاكد تمام التاكيد ان لو 12 مليون قبطى ماتوا فى مصر هيموتوا باقى المسلمون معاهم و العكس صحيح<br />يا جماعة يا محترمون يا مسلمون لازم نعرف اننا مربوطون ببعض و انا متاكد تمام التاكيد من تلك الحقيقة"
