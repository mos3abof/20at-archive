posted = "2006-02-16"
text = "يا جماعه الموضوع دا ناقشناه قبل كده لما كتب عنه البراء<br />و بعدين قلنا ان الراجل دا افلس فنيا من زمان<br />من ايام لا تجادل و لا تناقش يا اخ على<br />و لذا توقعو منه اى حاجه<br />بس يا جماعه يا ريت منقللش من قدر لينين الرملى و اللى مش بيحب لينين كفايه يشوف مسرحيه بالعربى الفصيح<br />يا جماعه دى تتدرس و الله"
