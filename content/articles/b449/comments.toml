[[comments]]
order = 0
subject = "هذا ما اقصده"
author = "محمد"
posted = "2006-02-15"
text = "انا قصدى ان المحرر مقراش موقع الاخوان من نفسه لا قرأ ايلاف الاول حتى جريدة الجمهورية خدت الفكرة وعملت عليها تحقيق بس بردو من غير ما يقولوا اننا عرفنا من ايلاف لا كل واحد عاوز يعمل شاطر ويقول انه خد باله لوحده ان الاخوان بيهاجموا وحيد حامد، مع العلم ان المقال منشور عند الاخوان بتاريخ 3 فبراير يعنى حتى ايلاف نزلته متأخر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 1
subject = "والله معاهم حق"
author = "عبدالله مفتاح"
posted = "2006-02-15"
text = "والله انا شايف ان الفكر العلماني مسيطر على وحيد حامد تماما اظن والله اعلم انه ليه ميول ماركسيه<br />واظن كمان ان هوه ميقصدش الاسلاميين هو يقصد الدين نفسه الاسلام نفسه<br />لينين الرملي اللي كرس حياته عشان يستهزا بكل ما يمت للاسلام بصله وسخريته الدائمه من المنقبات<br />او وحيد حامد اللي ميطلعش واحد مطلق لحيته الا ويكون سيء<br />والتلميذ النجيب خالد يوسف اللي مطلعلي منه شلبي لابسه نقاب ورايحه لواحد بيته عشان .........<br />وفي الاخر ايه يقولوك رساله ؟؟؟ رساله ايه دي ولو حد قال رقابة مجمع البحوث الاسلاميه يبقى نهاره اسود ويتهموه بالتخلف والرجعيه وحاجات تانيه غريبه<br />انا عايز اعرف حاجه لما الواحد بيعمل رساله وهادفه وبناءه،ليه يخاف من رقابة مجمع البحوث الاسلاميه الا اذا كانت نيته سيئه وجندي نجيب من جنود ابليس<br />ربنا يهدي الجميع ويصبر الاخوان بيستحملوا كتير والله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 2
subject = "الي هبهوب"
author = "Dabdoob"
posted = "2006-02-16"
text = "الفيلم يا هبة (اي فيلم) لا يتم التعامل معه علي انك معه او ضده لانه ببساطة قد يكون سيئا في احد جوانبه وممتازا في جوانب اخري شانه في هذا شان اي عمل جماعي.<br />علي سبيل المثال فيلم البرئ لعاطف الطيب قدم بسيناريو متواضع نسبيا لانه ركز علي شخصية الجندي الجاهل بشكل كبير دون ان يعطي الاهتمام الكافي لباقي عناصر المثلث (الحكومة (محمود عبد العزيز) والمثقف (ممدوح عبد العليم). بينما من جانب اخر فان الاداء التمثيلي الراقي جدا وجدا لاحمد زكي والقصة الجريئة للغاية رفعا كثيرا من مستوي الفيلم.<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 3
subject = "الي هبهوب تاني"
author = "Dabdoob"
posted = "2006-02-16"
text = "sorry Habhoob<br />نسيت ان ارد علي الجزء الاخر الخاص بنجيب محفوظ<br />الاسلاميين عموما والاخوان بشكل خاص يعتبرون الفن(الموسيقي والرقص والغناء والتمثيل و...) حرام لاسباب واضحة بالطبع كما يعتبرون جزءا كبيرا من الادب محرما واقصد بهذا الجزء معظم انواع الشعر (لما فيها من تجاوزات كثيرة خاصة بالنساء والتعامل مع الدين) - كما اقصد معظم القصص والروايات (لاسباب مشابهة ).<br />من الملاحظ هنا بشكل خاص ان الاخوان يخاطبون الناس في الشارع بخطاب مختلف تماما عن ما يعلنونه صباح مساء علي الملأ. وبالتالي فانهم امام الناس يعلنون تقديرهم للفنون المحترمة كما يسمونها وللاداب الجادة كما يسمونها ايضا ولكن خطابهم الحقيقي مع الناس يعمد الي تحريم كل هذا.<br />وفي النهاية ارجو ان اكون قد استطعت نقل افكاري<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 4
subject = "ما فبش حياديه"
author = "بنت الاخوان"
posted = "2006-02-16"
text = "اولا واضح جدا ان فى انحياز فى الموضوع و مافيش مناقشه من كل الجوانب دى حاجه.<br />ثانيا الفيلم فعلا لا يقدم الا الدعاره و الرذيله و لا يعتبر فنا اصلا...لان الفن كل ما هو نبيل يوصل رساله محترمه للناس بهدف الافاده مش بهدف الترويج للفاحشه و خلافه..انا الحمد لله عنيا ما اتلوثتش بمثل هذه اللقطات (الزباله) عذرا فى اللفظ<br />و لكن هذا لا يعنى ابدا ان الاخوان متزمتون و لا يشخعون الفن...لا طبعا و الاخ الى بيقول ان الاخوان بيقولوا كلام قدام الناس و للملا و لكن فى مع ناس تانيه بيقولوا الفن حرام...احنا من جوانا اه متيقنين تمام اليقين ان كل فن قبيح يخرج عن ايطار الشرع فهو حرام..افلام او اغانى او كتابات ادبيه ايا كان<br />و احنا مش منافقين ...و ما بنقولش حاجه نتكسف منها...قناعتنا فى ايطار الشرع بنقولها للكل و هى دى الصح..<br />معلش يعنى لما يجبولنا واحد عمال يبوس فى واحده او حتى ماسك اديها ده مش شرعى ابدا و لا يعتبر فن محترم نظيف<br />ليه ما بتتفرجوش على المسرحيات و الافلام و الاناشيد و الاغانى الى بيملها الاخوان<br />و لا احنا انطبع علينا و على وجهنا الانحياز و محاربة كل ما يمت للدين و للاخوان بصله؟<br />ارجوا ان احنا ندى لعقولنا مساحه للتفكير...الفن النظيف الهادف عمره ما كان حرام و لا يقدر الاحوان و لا غير الاخوان يقولوا غير كده..<br />لكن الافلام الساقطه و المسلسلات الخليعه...ابتداء من مؤلفها لحد الممثلين...تقدم دعوه صريحه للفساد و الخلاعه و قلة الادب.<br />و اذا كان وحيد حامد او غيره...فهؤلاء لا يقدمون اى رساله هادفه تعتبر فنا ابدا و كل ما يسعون اليه اثارة الغرائز للتكسب.<br />قاتل الله الفجار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 5
subject = "عقدة الزانية الشريفة"
author = "إسلام لطفي شلبي"
posted = "2006-02-16"
text = "أنا فيه شيء لفت انتباهي . . معظم أفلام وحيد حامد اللي بتتكلم عن إسلاميين او حتى دايماً الشخصية النسائية فيها فتاة ليل تحمل كل الصفات النبيلة وخلونا نراجع أفلامه كده.<br />بالنسبة لفيلم دم الغزال لحد دلوقتي انا مش قادر افهم القصد منه كان ايه؟؟<br />لو قصد المؤلف ابراز الجماعات المسلحة انها نتاج ظروف شخصية وفقر بس يبقى لا مؤاخذة جاهل<br />لو قاصد يقدم نموذج الشيخ جابر الطبال بتاع امبابة طب ما هو قدم النموذج ده ييجي 60 مرة قبل كده!!<br />ثم خلونا نتكلم في الكدبة الكبيرة اللي اطلقها السيد وحيد حامد بخصوص انه عامل فيلم \"فكري مش فيلم شباك\" . . ياجماعة ممكن حد بجح يفسر لي ايه المغزى الفكري من وجود عايدة رياض في الفيلم<br />وايه مغزى الكلام الجنسي الفج في حواراته مع نور الشريف اللي هو نموذج للمواطن الواعي لما يدور حوله - رغم انه نصاب - وكان ايه لازمة ان عايدة ونور يستحموا مع بعض؟؟<br />انا معاكم ان وحيد حامد كاتب متمكن وان شيطان الكتابة لما بيلبسه ما بيسيبوش بس خلينا نقول كاتب متمكن وخلي كبير دي على جنب إلا لو كان قصدنا كبير في السن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

