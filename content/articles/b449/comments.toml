text = "الى الاخ وليد<br />بجد وبامانة لو انتا قولتلى (\"انتا حمار \")<br />انا مش هغضب لكنى هضحك هضحك على تناقضك و تضاربك و تخبطك فى سطر واحد من تعليقك<br />انتا بتقول الاسلام حضارة الاسلام تاريخ الاسلام مستقبل و الكلام ده صحيح لكن<br />هل ده اسلوب واحد متحضر معتنق دين متحضر؟؟؟<br />هل ده اسلوب متمدن لانسان متمدن بيعتنق دين متحضر؟؟<br />هل ده اسلوب كلام حتى على القهوة او فى الشارع ؟؟؟<br />انتا حمار وربنا يشفيك كل دى الفاظ ناس انا اسف لا تجيد القراءة والكتابة وليس لها اى سابقة فى اى حوار محترم و مهذب و متحضر<br />وانا قبل اى نقاش معك فى الموضوع اطلب منك تلزم حدودك وتعرف تتكلم بادب و احترام و تهذيب على الاقل للمرة الاولى<br />اولا<br />انا لم اسب الدولة الاسلامية وراجع التعليق ان كونت لا ترى فانا قلت حاجات معترف بها حتى فى كتاب التاريخ المزور بتاع المدرسة<br />ومتفق عليها من اغلبية عظمى من المؤرخين الاسلاميين الامناء على التاريخ<br />تقدر ترجع للمراجع الاتية لو مش متاكد ومن فضلك بلاش معمعة وكلام ملوش معنى لو عايز تتاكد بجد ارجع للمراجع البسيطة دى المتوفرة فى المكتبات اللى انتا اكيد لا تدخلها<br />1- كتاب ( هوامش الفتح العربى لمصر ) للكاتبة المسلمة المحترمة سناء المصرى<br />2-كتاب (واسلاماه ) للكاتب احمد باكثير<br />3 كتاب(يوم القدس) للكاتب عبد السلام العشرى<br />4-كتاب التاريخ اولى ثانوى<br />5-كتاب (عبقرية محمد) للكاتب العظيم محمود عباس العقاد<br />لو انتا وده اكيد لم تقرا صفحة فى حياتك جرب و هتكتشف الحقيقة المرة اللى بيتقول لا توجد على الاطلاق دولة دينية ناجحة<br />لكن انتا واضحة فيك النزعة الاخوانجية ( جهل وافتخار بالجهل وشتيمة )<br />ثانيا<br />انتا بتتهم المسيحية بالتخلف<br />انا هسالك سؤال ومش هقول اجابته لان اجابته معروفة ولو انتا لا تعرفها تبقى جاهل جدا جدا<br />كم دولة مسيحية فى العالم الان متخلفة او جاهلة ؟؟؟<br />كم دولة اسلامية فى العالم الان متخلفة او جاهلة ؟؟؟<br />لو انتا جاوبت على السؤالين دول بصراحة و بثقافة هتعرف الدين المسيحى العظيم الراقى<br />وانا مش زيك بقول كلام حافظه لكن مش فاهمه يا ابنى الشعارات القديمة دى بطلت حتى الاخوان انفسهم بطلوها ولجاءوا الى حيل اقوى تنطلى على الشعب المصرى الفقير الجائع قليل الوعى<br />عشان يستغلوه<br />انا بقولك كلام من قراءة فى الواقع مش كلامك واحد محفظنى زيك<br />ثالثا<br />اما بالنسبة ان الكنيسة كانت بتقتل العلماء زمان<br />فان ده صحيح وكان نتيجة لاختلاط الدين بالسياسة ولو حصل ده مع الاسلام هينتج عنه نفس الشىء<br />لكن لما فصلنا ما بين الدين و السياسة العلم تقدم والدين ارتقى والحياة اصبحت احسن<br />رابعا والاهم<br />انا اخ وليد لا اكذب فى الحوار الجاد وتقدر تراجع كل تعليقاتى على الموقع ده على الصفحات التانية<br />1 ازمة بسبب بناء كنيسة فى الصعيد<br />2 شيخ مختل عقليا يحلل الزنا<br />3 ماسينجر السعوديين جنس واحد<br />تقدر تجيب كل الصفحات دى من ارشيف الموقع وتعرف ان كنت بكذب و بنافق و بكذا وش ولا صادق وبتكلم بنفس الاسلوب و المصداقية فى كل الاحوال وتحت اى ظروف<br />ومع ذلك انا لا ادعوك انك تصدقنى وخلاص زى ما الاخوان بيعملوا<br />انا مع ذلك هحترم تفكيرك المصدر يا اخ وليد<br />1 ندوات مرشح حزب الوطنى عن دائرتنا<br />وياريت لا نستغبى ونقول اصل ده وطنى وهيجى دايما على الاخوان<br />شوف انتا بنفسك يا اخ وليد<br />اكثر قواعد الاخوان كثافة بتبقى فى معاهد الخدمة الاجتماعية ( انا اسف يعنى اماكن الفشلة )<br />واقلية قليلة منهم بتبقى فى كليات الوسط( تجارة - اداب- حقوق)<br />واقلية شبه معدومة فى كليات القمة<br />(الطب و الهندسة والصيلة و الحاسبات )<br />يبقى لما ناخذ المحصلة هتلاقى المتعلمين القلائل من الاخوان تعليمهم هابط و تحت المتوسط<br />فئة زى دى ازاى تقود مصر يا محترم<br />عارف يا اخ وليد انتا عامل زى ايه زى المؤمن اللى متاكد ان الاخوان هينقذوا البلد لكن مش عارف هينقذوها ازاى<br />1 لمجرد انك مسلم<br />2 ولمجرد ان الاخوان مسلمين<br />3 ولمجرد ان الدولة اسلامية<br />4 ولمجرد انك بتعتقد ( ودى غلط ) ان الدولة الاسلامية الدينية ناجحة وهتحافظ عل حقوق الاقليات اللى فى البلد<br />لكنك مش عارف اى حاجة عن البرنامج الاصلاحى الاهبل ذو الافكار المتعفنة للاخوان اللى هيوزوا به البلد<br />1 عايزين يستبدلوا الرئيس بالخليفة<br />2 عايزيم يستبدلوا الوزارت بالدوواين<br />3 عايزين يهجروا المسحيين من بلدهم اما يقتلوهم<br />4 عايزين يحكموا البلد بالحديد والنار والسيف و الكرباج زى ايران والسعودية منة قبلهم افغنستان<br />عايزين دولة ارهابية<br />لكن انتا وبكل جهد بتدافع على ناس مريضة فى عقولها و نفوسها وعندها هستريا الدين<br />انا جتلى فى الكلية ورقة من الاخوان بالغلط بتقول والله العظيم بتقول<br />1 الاستحمام بالصابون والليفة حرام لانهما لم يكونا موجودان ايام الرسول<br />2 استخدام العطور و منظفات حرام لانهام غير موجودان ايام الرسول<br />قيس على كدا انتا بقى<br />1 الكمبيوتر و النت و التلفزيون حرام لانهما غير موجودان ايام الرسول<br />ازاى يا محترم يا عاقل تسلم بلدك للناس هبلة زى دى<br />ازاى اساسا تعتقد ولو للحظة ان الحل فى ايدين ناس جهلة و متخلفة ومتعصبة زى دول<br />مصر ربنا هيسالك عنها فى يوم القيامة و يقولك انتا عملت ايه لوطنك هتقوله سلمت مصر للاخوان المسلمين<br />هيقولك وانتا استفسرت واستقصيت عن الاخوان المسلمين وهل همن هيفيدوا البلد ولا يضيعوها<br />يا ترى هتقوله ايه<br />هتقوله اصلهم مسلمين وقلت الاقربون اولى بالمعروف<br />يا ريت لا تسلم عقلك لاحد غيرك وتشغل دماغك و تحب وطنك بايجابية و بحكمة وانا منتظر الرد<br />اما بالنسبة لحياة النصرانى فى ظل دولة اسلامية كفاية انى اقولك ان كل البطاركة ( زى البابا شنودة دلوقتى ) استشهدوا وماتوا واتقتلوا على ايدى الحاكم المسلمين<br />باعتراف المؤرخة المسلمة المحترمة سناء المصرى فى كتاب هوامش الفتح العربى لمصر<br />يا ريت لا نحفظ كلام<br />واخيرا واهم حاجة الرد بادب وتهذيب واحترام والا لا ترد احسن"
archived = "2006-11-02"
