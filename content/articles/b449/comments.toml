subject = "ملاحظة على الملاحة"
author = "أحمد الضبع"
posted = "2006-04-01"
text = "جميل جداً موضوعك يا أيمن ولكن لى ملاحظة وهى أن وحيد حامد ليس إلا أحد زراعى عادل امام التى يضرب بها بقوة على ظهر أصحاب اللحى والجلابيب وهذا ما جعل الأمر يختلط على من ظن أن فيلم الإرهابى من تأليف وحيد حامد وأن التار ما زال قائماً بين عادل امام بأزرعه المتعددة وبين الإخوان وفى رأيى لن ينتهى هذا التار إلا إذا قدم هؤلاء الفنانين مايعرفونه فقط ولا يقتربون مما لا يفهمون فيه شيئاًأوعلى الأقل لا يقدمون النماذج بشكل شديد السطحية حتى لا يوهمون الجمهور بأن تلك هى حقيقتهم"
archived = "2006-11-02"
