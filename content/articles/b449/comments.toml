text = "احقاقا للحق<br />ولاجل ان ياخذ كل ذى حق حقه<br />ومن باب السرد الصادق للتاريخ<br />يجب ان نستثنى ونستقطع من تاريخ هذه الدول الدينية الفاشلة فترتان قصيرتان مزدهرتان استنشق فيهما الشعب العربى بعض نسائم الازدهار والغنى فقط ولم يستنشق فيهما الحرية<br />المهم الفترتان هما<br />1- فترة الخليفة ( عمرو بن عبد العزيز)الذى يلقبه بعض المؤرخون بلقب خامس الخلفاء الراشدين وبالغ و غالى البعض الاخر من المؤرخين الذين يقولون انه لم يوجد فقير او جائع واحد فى فترة حكم هذا الخليفة الحكيم والتى اتسمت فترته بالهدوء و الاستقرار و التوجه والانصراف نحو العلم و العلماء والبناء والتعمير وازدهار الاقتصاد ونموه وقوته ومع كل تلك الايجابيات والتى اتفق مع معظمها فانه وباعتراف نفس المؤرخين قالوا انه كان سىء التعامل مع الاقباط الذين يقطنون بعض اقطار وولايات خلافته الواسعة المترامية الاطراف وكان لا يعطيهم حق المنافسة على المراكز السياسية الكبيرة بل انه كان يخاف ان يعطيهم مراكز عسكرية وكاءن المسيحيين خونة مع ان التجربة اثبتت ان اعظم صفات المسيحيين هى الوفاء و الولاء<br />2 وفترة خلافة الخليفة الاسطورة هارون الرشيد واذا سمع اى شخص عادى ذلك الاسم ( اسم هارون الرشيد يعنى ) اول شىء سيتبادر لذهنه هو النساء و الجنس فان هذا الخليفة اشتهر عربيا بانه شغوف النساء المحب لهم والمكثر منهم وسجل اعلى الارقام القياسية فى تعدد الزوجات وابتدع بدعة جديدة نجح من خلالها فى تخليد اسمه تاريخيا وهى حفلات الطرب او بمعنى اصح ( حفلات الجنس ) والتى كان ينفرد فيها لوحده مع عدد مهول من النساء ما بين زوجاته وعبيداته وملكة يمينه يرقص ويغنى ثم 0000000 والباقى اكيد معروف<br />الاهم من حياته الشخصية هو انه اعتنى عناء جيد بشئون الدولة واعتلى بها نسبيا وحقق رخاء ملحوظ و محسوس فى الاقتصاد<br />وله مقولة شهيرة<br />حينما كان يجلس فى الشرفة الخاصة به وكان معه وقتئذ مساعده<br />فقال مساعده (ان فى السماء سحابة كبيرة )<br />فرد الخليفة هارون الرشيد ( اينما وقعت تلك السحابة وتحولت لامطار ومياه فسوف استطيع ان استفيد بمياه تلك السحابة )<br />ولكنه وعلى غرار سابقيه كان يرى الاقباط مرض يصيب امبراطوريته فوظف ايضا كسابقيه اليات الدولة لاهانة واذلال وتعذيب المسيحيين واخراب وتدمير وحرق بيوتهم و ديار عبادتهم<br />ولكننا كما قلنا ان هاتين الفترتين استنشق فيهما الشعب العربى نسيم الرخاء و الغنى فقط ولم يستنشق رحيق الحرية<br />ومدة هاتين الفترتين القصيرتين مجتمعتين حوالى 40 سنة تقريبا<br />ولكننى اغفلت ان نستعرض الدول التى دستورها علمانى مدنى مثل جميع الدول الاوروبية الان ودول امريكا الشمالية هذا بالاضافة الى<br />1 دولة جنوب افريقيا التى فى قارة افريقيا فبعد سنيين من الحكم العنصرى على اساس اللون وبعد المعاناة بين(سكان البلد البيض والسود)<br />طبقت جنوب افريقيا ولاول مرة الدستور المدنى العلمانى وذاقت لاول مرة طعم التقدم و النجاح و الازدهار و التسامح والحب و المساواة والعدل والحرية والايخاء وكان من نتائج ذلك<br />1 ستنظم جنوب افريقيا كاس العالم سنة 2010<br />2 حصلت افلام جنوب افريقية كثيرة على جوائز الاوسكار كان اخرها فى هذا الموسم<br />3 تجارة وزراعة وصناعة جنوب افريقيا اصبحت لها محبين وعملاء فى جميع الاسواق العالمية<br />2 اليابان التى كانت مثلنا تعيش فقط على امجاد و انجازات الماضى نتفاخر بتاريخنا ونعيش حاضرنا ونامل فى مستقبلنا ولكن بعض القنبلة الذرية اعادت اليابان حساباتها واوراقها وطبقت الدستور المدنى العلمانى لاول مرة والذى لا يميز بين المواطنين على اساس او اساس اللون او اساس اللغة او اساس الاصل وكانت النتيجة اصبحت اليابان من الدول الصناعية السبع الكبرى الان<br />3-والصين بعدما تخطت مرحلة الاشتراكية والشيوعية والفساد وطبقت الدستور المدنى العلمانى اصبحت لها مقعد دائم فى مجلس الامن<br />بعدما راينا ان كل الدول الدينية فى الواقع وفى التاريخ فاشلة بنسبة 100%<br />وراينا كل الدول المدنية العلمانية ناجحة فى الواقع وفى التاريخ بنسبة 100 %<br />بجد وبامانة ومن غير مبالغة نبقى اغبياء ولا نستاهل طعم الحرية اذا بايدينا اخترنا الدول الدينية ولم نختار الدول العلمانية المدنية المتحضرة<br />وتذكروا قول الرسول ( انتم اعلم بامور دنياكم )<br />والغبى الذى يقع فى نفس الغلطة مرتين<br />فما بالكم بالذى يقع نفس الغلطة الاف المرات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

