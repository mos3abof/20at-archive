[[comments]]
order = 7
subject = "هايل يا بني"
author = "Dabdoob"
posted = "2006-02-16"
text = "الي الاخ اسلام لطفي كلامك فعلا هايل وانا متفق معاك تماما في كل ما قلته فانا ايضا لا تعجبني طريقته في عرض افكاره بمعني ان في افلامه تجد ان الاسلامي هو ارهابي متطرف حقود شرير و و و و دون ان يشرح لماذا هو كذلك وكأن مجرد اتجاهه للدين هو سبب كاف لكي يكون شريرا متعصبا . علي العكس فان في معظم افلامه تكون شخصية الساقطة بريئة مظلومة ومهمشة اجتماعيا وفي الغالب موضوعة في اطار مثير للتعاطف .<br />ربما يكون وحيد حامد متاثرا بصورة الخطيب المتطرف الذي يصرخ طوال الوقت مطالبا بالقتل والجهاد طوال الوقت ولكنه (وحيد حامد) لا يحاول البحث عن خلفية هذا الخطيب وما سر تطرفه في فهم الدين.<br />اخيرا انصحك بانتظار فيلمه القادم (عمارة يعقوبيان) لان الاخبار تتوارد بانه سيكون كسابقيه مليئا بالجنس بل والالفاظ النابية والعداء التام للاسلاميين وبث الكراهية لهم .<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 8
subject = "كلام كبير"
author = "Dabdoob"
posted = "2006-02-16"
text = "الي الاخت بنت الاخوان<br />اولا : لم ذكر في كل ما قلت أي كلمة عن اعجابي او تاييدي لوحيد حامد بل قلت ان الافلام لا تنقد بطريقة مع او ضد (وكنت اظن ان كلامي واضح) .<br />ثانيا: اختلف معك في تعريف الفن فالفن لا يقاس بمدي نبله او اخلاقيته (لانها اشياء مجردة يختلف قياسها من شخص لاخر) بل الفن هو مناقشة بليغة لنماذج مجتمعية او افكار مختلفة او تكوينات جمالية.<br />لم اقل ايضا ان السينما حلال بل علي العكس فانني اري انه لا يوجد شيئ يمكن ان يسمي بالسينما الاسلامية او ما شابه لسبب بسيط هو ان سينما بهذا الشكل لن تستطيع ان تقدم نماذج كثيرة في المجتمع وهي ببساطة كل النماذج السيئة .<br />ثالثا: الاخوان بالفعل يختلف خطابهم الرسمي والمعلن عن خطابهم الشعبي فهم يحرصون في كل مناسبة علي اطلاق تصريحات عن حرية الراي واخوة المواطنة مع الاقباط واحترام الفن والادب وحرية المراة , ولكنني اشك في انهم يستطيعون تطبيق هذا فعليا لاختلافه مع القواعد الاسلامية في بعض الامور (اكرر بعض الامور).<br />رابعا: فانني لم اقصد ان اندد بالاخوان في أي موضع ولكنني اصف امرا واقعا كما انني لم اقصد ان اؤيد كاتب المقال فهو بالفعل متحامل كثيرا . وبالمناسبة لم ار أي اعمال فنية من انتاج الاخوان لاحكم عليها وان كنت شاهدت اعمالا اسلامية (كما يسمونها) في بعض القنوات الاسلامية وكانت في رايي (واسف جدا لهذا) سخيفة ووعظية للغاية .<br />اخيرا ارجو ان نتواصل بشكل اهدأ.<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

