[[comments]]
order = 12
subject = "مين طفا النور ؟؟؟"
author = "أكرم من كده مفيش"
posted = "2006-02-16"
text = "1- ( يريدون ان يطفئوا نور الله بأفواههم )<br />2- ( الله متم نوره و لو كره الكافرون )<br />3- مين قال ان مفيش فلم اسلامي ( طب و السينما الايرانية بتعمل ايه ؟؟ )<br />4- فيلم ايراني سوري اردني لبناني مشترك شفتوا على قناة الفيوتشر بعد مارجعوا للافلام بعد وفاة الحريري مأخوذ عن رواية عائد الى حيفا لغسان كنفاني ( مش عارف اسم الفيلم ) بس فيلم اسلامي طحن<br />5- فيلم الشيماء مش فيلم اسلامي لانه كان جايب الشيطان معفي اللحية ( اللي هي السنة اصلا ) و المؤمنين عاملين سكسوكة<br />6- الفن و الابداع مش حرام بس اللي بيحصل حاليا هو اللي حرام<br />7- انا مشفتش فيلم دم الغزال ( و كنت ناوي اشوفه ) بس وحيد حامد معروف انه بيمشي مع الموجه بدأ مع افلام مراكز القوة الشهيرة و بعدين وصل لافلام الارهاب مرورا بافلام الانفتاح ( و سلملي ع الشباك )<br />8- ميمنعش ان وحيد حامد سنارست متميز بغض النظر عن افكاره فمش معنى ان امل دنقل قال كفر في قصيدة كلمات سبارتكوس الاخيرة انه كافر و لا معنى اغلب كفر نزار في شعره انه في جهنم و بئس المصير ( احنا جايين نهدي النفوس )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

