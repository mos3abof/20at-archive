subject = "صلوا علي النبي ....."
author = "هبهوب"
posted = "2006-03-27"
text = "اوولا ايه يا عبد الله انت جاي تقول للراجل انت حمار بس معلش , لا مرتين انت خمار بس مع الاعتدار برده .<br />ايه يا عم حمدي ايه يا نينه انت يا راجل مانشوفكش غير في صراع الاديان دا<br />يا كرمله سبتلك البزازه جنب المكتب تقول ايه قلب الام بقي .<br />ايه يا نفي نفضتيهم كلهم وجات علينا انا يعني تنحتي علي الحته دي<br />اخيرا الكابتن موحد الاقطار كلها<br />مكنش عشره \" كنيسه و\" مسجد\" يا راجل<br />\" احيرا كتبت اخر تعليق واو\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 57
subject = "هبهوب انا مش فهمه"
author = "نيفين..نيفى..نوفا"
posted = "2006-03-27"
text = "كالعاده يا هبه مش فهمه قصدك<br />المجستير طير عقلى يختى<br />انتى عرفه اختك ساعات الغباء بيشتغل معايا قوضحيلى تقصدى ايه<br />ولما ابعتللك هبقى اقوللك على موضوع كدا<br />بس اصبرى لما افضى<br />سلام يا جميل<br />انا كدا اخر تعليق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

