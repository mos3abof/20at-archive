text = "فتحى وهيب,هو ده اللى احنا بنقوله,لازم يبقى فى حرية عشان كل واحد<br />يقول رأيه,و احنا كمشاهدين كمان من حقنا نشوف كل وجهات النظر<br />الاخ وليد,هو التقليل من قيمة دين أخر بيعلى من قيمة دينك؟؟؟؟؟أنا مش<br />فاهمه ليه احنا بنقلد الرسول فى اطلاق اللحية و استخدام السواك و لا نقلده فى<br />تعامله مع المختلفين معاه سواء فى الدين أو فى الرأى؟؟؟؟؟؟<br />كلنا عارفين قصص كتير من سيرة الرسول عن كيفية تعامله مع الاخرين,و<br />بنستشهد بيها دائما كدليل على سماحة الاسلام و لكن و ياللعجب مابنطبقهاش<br />أنا طبعا مختلفة معاك يا مينا فى نقط,بالنسبة لوحيد حامد,انا شايفه ان<br />مشكلته انه بيقسم الناس لقوالب,تلاقى مثلا المتدين المعتدل يبقى شكل محمود<br />مرسى,و المتدين المتشدد يبقى بدقن و جلابيه قصيرة و بيتكلم لغة عربية و<br />هكذا,و ده مش منطقى ,خاصة فى وقتنا ده,أنا بعتبر ان ده نوع من<br />السطحية,بس ده طبعا مينفيش كونه كاتب مهم ,خاصة فيلمه \"طيور<br />الظلام\" اللى بعتبره أفضل أعماله<br />بالنسبه للاخوان,أنا لسه عند رأيى انه لسه بدرى اننا نحكم عليهم,قدامنا 5<br />سنين نشوف اذا كانوا هينفذوا اللى بيقولوه و لا,أنا ماقدرش أحكم عليهم من<br />تاريخهم لانهم غيروا كتير من أفكارهم و متهيألى انهم قادرين يعملوا تجربة<br />شديدة الخصوصية صالحة للمصريين.<br />ويكفى انى اقولكم ان 68 % من كل جماعة الاخوان المسلمين\"<br />المحظورة لم يكمل تعليمه<br />وان اكثر من 20 % منها لا يعرف اساسا القراءة و الكتابة\"<br />منين جبت الاحصائيه ده يا مينا؟؟؟؟؟أنا مش مقتنعه بيها,بالعكس,انا<br />شايفه انهم موجودين فى معظم الكليات و بيزداد عددهم فى كليات القمة خاصة<br />هندسة.أقليه شبه معدومه!!!!!!لأ خالص,تعالى شوف فى هندسة<br />القاهرة عددهم و تأثيرهم أد ايه<br />\"لو انتا جاوبت على السؤالين دول بصراحة و بثقافة هتعرف الدين المسيحى<br />العظيم الراقى\"<br />يا مينا الدول المتقدمة وصلت للى هى فيه عشان عندهم حرية و مش عشان<br />هم دول مسيحية,ده بيدعم وجهة نظرك انه الدولة الدينية مش هى اللى هتحل<br />مشاكلنا,ولا انت قصدك على دولة اسلامية بس؟؟؟؟خللى بالك انه الدين<br />الاسلامى-زى الدين المسيحى-بيدعو للحرية و أولها حرية العقيدة,خلينا<br />نتفق انه المشكله فى تطبيق الناس لدينهم-خاصة اللى فى موقع السلطة و<br />عايزين يدوا لظلمهم شرعية-لكن ده مش معناه انه الدين نفسه بيقول كده.<br />بالنسبة لمثالية التاريخ الاسلامى,طبعا مش مثالى,و عايزه أعرف ممن<br />يدافعوا عن مثاليته عن رأيهم فى نكبة كربلاء التى قتل فيها حفيد الرسول من<br />قبل يزيد بن معاوية-من مؤسسى الدولة الاموية-حتى يستولى على الحكم<br />؟؟؟؟؟<br />طبعا ده لا يؤكد انه القران بيقول كده,بل على العكس تماما,اللى يشوف<br />موقف الحسين بن على-رضى الله عنه-يعرف انه الاسلام يرفض الظلم,<br />دى أهم قيمة لازم نتعلمها دلوقتى.<br />أخيرا,ياريت تبصوا على المدونة دى,مميزه جدا ,صاحبها كان مع<br />الاخوان لمدة 17 سنة و سابهم,مازالت مرجعيته اسلامية,لكن هو له رأى<br />جدير بالقراءة<br />http://justice4every1.blogspot.com/<br />فى النهاية,اختلاف الرأى لا يفسد للود قضية."
archived = "2006-11-02"
