text = "انا مش حرد عليك با الحاجات الكتير زي اللي فوق دي بس ولو فيها حاجات صح وانا اتفق معها بس متعممش كل الناس زي بعض<br />وخاصه المجتمع \" السعودي \" لو اتكلمت عليه برده مش حخلص بس ايه يا بني كلوه<br />كدا مفيش حته حلوه في الاسلام خالص<br />ايه يا بشر براحه براحه<br />انا مش حتكلم في عقدتك لان سبق واتكلمنا عن الموضوع دا كتتتتر في \" مسنجر من جنس واحد \"<br />واللي كان بيرد عليك \" حمدي\" فينك يا بني<br />اخيرا احب اقولك انت ليه كل تعليقاتك عن الاسلام والدين والشتيمه فيه متقوليش انا شتمت لا ياباشا شمتمت بس من تحت الحزام \"<br />اخيرا اختلاف الاراء لا يفسد للقضيه \" مله \"<br />واخوان سلفيه عفريت ازرق .... كلنا \"مش انت \" مسلمين يعني لا اله الا الله محمد رسول الله ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

