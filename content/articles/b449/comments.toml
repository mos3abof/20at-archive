subject = "ركز معايا يا مينا"
author = "عبدالله مفتاح"
posted = "2006-03-23"
text = "مينا يا قلبي انت بردو كنت عملت حاجه زي كده في موضوع(مسنجر السعوديه جنس واحد) ويوميها الجمتك لكن يظهر انك عايز كل مرة ارد عليك واسدلك كل ثغرة عايز تنفذ منها<br />وانت بتسقط سلوك السعوديه على المسلمين وده جهل كبير جدا لانه لا يجوز اسقاط سلوك السعوديه على الاسلام<br />لاننا لو بنفس المبدا اسقطنا سلوك اوروبااللي بتاكلنا لاننا جعانين(على حد قولك) او امريكااللي بتتحكم فينا(بردو على حد قولك)<br />تعالا بقا نتحاسب<br />الولد في اوروبا وامريكا(المسيحيينالعلمانيين )بيتولد مش عارف مين ابوه يعني عندهم اختلاط انساب ومحدش بيغير على اخته ولا امه ايه رايك؟<br />تحب عندنا يكون في حرية زي عندهم ونتحضر؟<br />ده موقف واحد بقلك عليه ياللي عايزنا نبقا زيهم<br />حاجه تانيه انت جايب حاجات مش موثقه يعني كلام وخلاص محدش سمع عنه غيرك وغالبا هيكون من ابداع خيالك<br />حاجه تالته انت قلت عايز دولة علمانيه وده كلام فارغ جدا ويدل على انك مش مقتنع بدينك لانك لو كنت مقتنع بيه كنت قلت نحكم بدين الله بالنسبالك طبعا<br />لكن انك تنحي الدين اللي انت مؤمن بيه يبقى كده انت مش واثق ان دينك من عند الله لانه لو كان من عند الله يبقى اكيد هيكون احسن من اي حاجه تانيه بشر يعملها لكن انت اصلا شكلك بثق في المخلوق اكتر من الخالق وده سبب كافي لانك تكون مشوش<br />وهفضل ارد عليك كل ما الاقيك بتكتب كلام مالوش لازمه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 41
subject = "مينا.. انت لك و عليك"
author = "نيفين..نيفى..نوفا"
posted = "2006-03-23"
text = "اوكى يا عم مينا رجعتنا نكتب ف الموضوع دا تانى مع انى زهقت من موضوع وحيد حامد دا..<br />بص يا سيدى انت ليك و عليك<br />اللى ليك ان فعلا اللى زى وليد دول من حقك ترد عليهم لان الاسلوب غير المحترم مرفوض بتاتا<br />ليك اعترف ان اسلوبك كويس<br />ليك ان واضح انك انسان مثقف<br />تمام كدا<br />اللى عليك بقى يا بطل ان اساللك انت جبت منين حكايه ان مش عارفه كام من الاخوان مش متعلمين و كام مكملوش تعليمهم دى<br />دى حاجه<br />كمان ليه نربط بين تخلف اى دوله و ديانتها و حكايه فصل الدين عن الدوله فتلت بحثا فمش هنتكلم فيها<br />برده موضوع الاستحمام بالصابون و الكلام دا فمعلش دى حاجات عقائديه تيجى نتفق منتكلمش فيها<br />مينا صدقنى انت انسان واضح ان مخك كبير و علشان كدا مش هقوللك الدين لله و الوطن للجميع و احنا اخوات لان انت مقتنع بدا بالفعل<br />و تانى عايزه اسجل احترامى لاسلوبك انك لما اتشتمت رديت برده كويس<br />بس نبعد عن الدين<br />و ف النهايه زى ما فالت هبهوب اختلاف الراى لا يفسد للود قضيه...<br />مش كده و لا ايه(على رأى عمنا فؤاد المهندس)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

