[[comments]]
order = 60
subject = "الله يفرسكوا"
author = "سوسة المفروسة"
posted = "2006-04-02"
text = "والله بجد فرستوني اكتر مانا مفروسة....ايه اللي انا قريته ده و خصوصا من اكرم و نيفين..الاخ مينا ده اصلا بيناقض نفسه في كل كلامه ...<br />1- انل مصري و بحب بلدي بجنون.....الدول المسيحيه اللي (بتاكلكوا في مصر) يل جعانين<br />2- الخليفة هارون الرشيد كان عصره فيه ازدهار......كان بيعمل حفلات جنس جماعي!!!<br />3-عمر بن عبد العزيز كان من افضل الخلفاء.......كان بيظلم الاقباط و بيسيئ معاملتهم<br />سيبك من الاستهبال بتاع :عمر بن الخطاب اتقتل عشان الناس كانت بتكرهه...و الناس اللي بتلبس جلباب في صلاة الجمعه( وانت مالك مايلبسوا اللي هما عايزينه)...و الدول المسيحية المزدهرة (الله يلعن ده ازدهار يا اخي بتاع الشواذ و سفاح القربي و استحلال اعراض و اراضي و دماء الناس)<br />لكن اكبر استهباله بقه هو في اهانة كل الرموز الدينيه الاسلاميه و الكلام اللي ملوش اي اثبات عن الاخوان وغيرهم و الاسلام اللي بيلعنوه في كنايسهم(و اسالوا اللي كانوا مسيحيين و اسلموا).....و بعد كل ده....الحقوني يا مسلمين يا مثقفين .اخوتكوا الوحشين بيشتموني..انا مقهور..انا مضطهد..دافعوا عني..انصروني<br />والاخوة من قلبهم الطيب و من كتر ماسمعوا ( تبقى انت اكيد اكيد في مصر) يجوا و يسلكوا و يقولوا ياجماعه احنا اخوات و فيه وحده وطنيه و مش عارفه ايه<br />يا اخ مينا مع احترامي الشديد ليك و لكل الاقباط اللي ليا منهم اصحاب كتير...انت بتفكرني بمفيد فوزي لما بيتكلم عن عمرو خالد و عن الحجاب<br />حاجه ماتخصكش باي حال من الاحوال<br />خليكوا في حالكم وماتدخلوش في اللي مالكوش فيه<br />و للاخوة المدافعين دائما...ماتتسرعوش كده و افهموا اللعبه<br />و للاخ عبدالله مفتاح كحل و اعمي و لا يهمك ...لا فض الله فوك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

[[comments]]
order = 61
subject = "معلش ماكنتش واخده بالي"
author = "سوسة المفروسة"
posted = "2006-04-02"
text = "معلش انا كنت كتبت الرد اللي فوق قبل نا اقرا الموضوع بتاع ماسينجر السعودية و اللي لاحظت فيه زي ما لاحظت هنا برضه ان الاخ مينا بيتبع اسلوب المنصرين ..بيدخل نت اي موضوع فيه ريحه دينيه علي كيل الاتهامات و التشكيك في الاسلام من جميع النواحي ..و موضوع المعلومات و الكتب اللي بيكتب انه قراها و اللي كلها بتتكلم فقط عن السلبيات اللي موجوده عند (بعض) المسلمين في (بعض) العصور دليل على كلامي....و ده اللي لاحظته من تعليقاته اللي مساحتها اكبر من الموضوع نفسه و معظمها خارج الموضوع تماما<br />و برضه برجع اقول ياريت يخليه في حاله و ما يتدخلش في اللي مالوش فيه....وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133428/http://www.20at.com/article2.php?sid=449"

