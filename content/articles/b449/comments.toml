subject = "\"الاحتواء هو الحل\""
author = "فتحي وهيب"
posted = "2006-03-06"
text = "نعم ان ما يفعلة وحيد حامد قد يكون حرية ابداعية....ولكن حين يبلغ هذا الحد السافر من الهجوم الذي يصل الي حد السي والتشهير فانه يجب ان تكون لنا وقفه, وان كان وحيد حامد يتمسك بحقة المزعوم في التعبير عن رأيه, فاني من هذا المنطلق ادعي بحق الجمعات الاسلامية في عرض اراءها مهما بلغت من تشدد و علي المواطن ان يفاضل بين كل الاتجاهات, فتسقط حجج الاطراف المتنازعه سواء ذات الفكر الثيوقراطي او الفكر اليبرالي."
