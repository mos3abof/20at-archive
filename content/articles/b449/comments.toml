text = "هههههههههههههههههههههههههههههههه<br />عجبني اسلوب مينامش لأنه مؤدب زي ما بيقول أصلا كلامه كله شتيمة غير مباشرة بس عجبني لأنه قدر يحول محور النقاش على الموضوع اللي هو عايزه ويطلع في صورة المظلوم من غير ماتخدو بالكم........ لأ عفارم عليك يا مينا بس يا سيد مينا لو عاوز تتناقش بجدفي موضوع تطور الحضارات على مر العصور حديلك رقم تلفوني ونتقابل في أي مكان انت عاوزه أما البلبله اللي أنت عاملهاعلى النت وقاصدها عمدابس بأسلوب لذيذ شوية ما تخيلش عليا مع تحياتي لك يا بني<br />أتمنى انك تستخدم ذكاءك في حاجة تنفعك وتنفع مصر اللي بتقول انك بتحبها بدل ما انت قاعد توقع الناس في بعض"
