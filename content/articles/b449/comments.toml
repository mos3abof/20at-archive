subject = "ايه يا عبد الله"
author = "نيفين"
posted = "2006-03-25"
text = "مش فاهمه تقصد ايه يا عبد الله..و مهما كان ممكن تفتحوا انت و مينا صفحه جديده و لو حتى تتكلمو لوحدكو ف وقت تتفقو عليه بعيد عن الموقع و الصلح خير..(بس يا عبد الله معلش و انا عرفه ان مخك كبير انت فعلا زى ما قال اكرم انت جيت تكحلها عميتها)<br />بص يا عبد الله مش كل وقت ينفع نفحم الدين و يا رب تكون فهمت علشان مينفعش اوضح اكتر من كده(فاهمنى انت يا اكرم اكيد)<br />العفو يا اكرم بس شكرا على ايه<br />و بالمناسبه عايزه اقول يا ريت فعلا نتعلم من اكرم الحوار يبقى ازاى<br />اكرم يا ريت لو فيه ميعاد نتكلم فيه كلنا حد يعرفنى انت او هبهوب مثلا<br />اه هبهوب<br />ايه يا هبهانتى هتعميها انتى كمان<br />هبه خفى شويه مش عايزين مشاكل<br />انتى وحشانى موت و لما ابعتللك هوضحللك اقصد ايه<br />بالنسبه لمينا اشكرك اكيد و صدقنى مهما كان الحوار بيبقى صعب ده برده بينم على ان فيه عقل شغال و ان اختلفنا و على راى اكرم انا اعلق اذن انا موجود"
