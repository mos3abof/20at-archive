subject = "من مينا الى سمر"
author = "مينا"
posted = "2006-03-19"
text = "اولا بجد يا اخت سمر انا بشكرك على<br />1 ادبك و اخلاقك وتهذبك فى الرد مما نفتقده اثناء الحديث مع كثيريين<br />2 موضوعيتك وثقافتك لانك لم تتناولى الموضوع مثل كثيريين بتعصب او جهل<br />3 على عدم تعصبك<br />4 على هدوئك<br />5 على صراحتك<br />ثانيا<br />بالنسبة لوحيد حامد انه بيمثل المسلم المعتدل بصورة عادية وطبيعية وبيمثل المسلم المتشدد بصورة رجل بدقن وجلبية و بيتكلم عربى<br />فللاسف يا سمر ده حقيقى او على الاقل قريب من الحقيقى بنسبة كبيرة اوى اوى<br />واذا كان فى الامر سطحية تبقى مش من وحيد حامد تبقى من المسلمين المتشددين اللى فعلا بيتمثلوا بالرسول فى المظهريات ولا يقلدوه نهائيا فى الجوهريات<br />وده طبعا مش ذنب وحيد حامد<br />بمعنى اذا كان المسلم المتشدد مصر ومصمم انه يكون بدقن و بجلباب ليميز نفسه عن المجتمع يبقى وحيد حامد ميقدرش يصوره الا بالصورة السطحية اللى اخترها المسلم المتشدد لنفسه<br />يعنى وحيد حامد ليس سطحى فى تصوير المسلم المتشدد بتلك الصورة ولكنه واقعى<br />فهمتى ولا لا ء؟؟؟؟؟؟؟؟؟؟؟؟<br />واطلعى الشارع فى وقت الصلاة فى يوم الجمعة واقفى امام اى مسجد ضخم وهتلاقى نسبة كبيرة جدا جدا جدا من المصلين كفروا القمصان والتشيرتات واستبدلوها بالجلباب الابيض او الجلباب البيج القصير ومن تحته السروال الابيض متدلى بغرابة و بطريقة ملفتة للنظر وكانه بيقول للى حوليه انا الوحيد المؤمن فيكم يا كفرة بالاضافة للذقن وطربوش افغانستان<br />يعنى وحيد حامد كان فى منتهى الواقعية فى تصوير المسلم المتشدد بتلك الصورة اللى اخترها المسلم المتشدد لنفسه لتكون صورته<br />وعلى فكرة لو انتى بتعدى على<br />1 مسجد الفتح فى رمسيس<br />2 مسجد رابعة العدوية فى مدينة نصر<br />3 مسجد اكتوبر<br />3 زوايا وصلايات منطقة الازهر<br />صدقينى هتلاقى عشرات العشرات من تلك النماذج صدقينى دى حتى مش مبالغة من وحيد حامد<br />بالنسبة للتجربة السياسية للاخوان<br />التجربة قديمة ومعروفة لكن مش مفضوحة بسبب التعتيم الاعلامى على اضطهاد الاقباط فى مصر<br />انا عارف ومتاكد انك هتتفاجىء بالمعلومات والارقام الجاية لكن للاسف دى الحقيقة<br />1 التجربة الاولى مع الاخوان كانت يوم 4 يناير سنة 1952 فى مدينة السويس وقتل 15 قبطى فى تلك المدينة والتمثيل بجثثهم ( للعلم الواقعة موجودة ومثبتة فى ارشيف المحاضر )<br />2 التجربة الثانية للاخوان كانت فى احداث الزاوية الحمراء المؤسفة سنة 1972 وقتل 200 قبطى و25 مسلم لدرجة ان الرئيس السادات كلف الدكتور العوطيفى بعمل ملف لدراسة مشاكل و ماسى الاقباط فى مصر و فعلا اتعمل الملف ده لكن السادات لما راى جدية وشفافية وصدق الملف حطه فى الدرج لانه كان فاكر ان الدكتور العوطيفى المحترم هيفهم ان الرئيس السادات كلفه بعمل ملف لتهدئة الاقباط وليس لاصلاح الاوضاع<br />القصة اللى فاتت دى مش بس مثبتة ومعروفة لا دى كمان معروفة لدى الكثير و الكثير من المسلمين<br />3التجربة الثالثة مع الاخوان كانت يوم الاحد 2 يناير سنة 2000 وقتل 21 فلاح مسيحى فى قرية الكشح وتخيلى المحاكم الموقرة براءت المتهمون لعدم ثبوت الادلة ؟؟؟<br />4 التجربة الرابعة مع الاخوان كانت فى الانتخابات البرلمانية السابقة وشوفى قدر البلطجة والارهاب والمطاوى والجنزير اتفرجى على الجزيرة و انتى تعرفى<br />اتفرجى فى الشوارع وانتى تعرفى<br />ارهاب بكل ما تحويه اللفظ من معنى<br />على الرغم من انى متاكد ان الحزب الوطنى بيزور الانتخابات<br />لكنى متاكد اكتر واكتر ان اعمال الشغب اتعملت بايد الاخوان<br />عايزة اكتر من كدا تجارب ايه يا سمر دول بيقولوا للحمار افهم ( انا بجد لا اقصدك )<br />وفكر و اعتقاد واتجاهات الاخوان لم ولن تتغير دول متزمتين و متشددين يعنى بمعنى اصح بيرفضوا التغير فما بالك بالتغير فى افكارهم<br />وكل الوقائع و الاحداث اللى انا قلتها واثق بصدقها بنسبة 100% ومستعد اناقش اى فرد ممكن يكدبنى<br />الوقائع و الاحداث دى مثبتة ومدونة ومعروفة عند اقلية من المسلمين المستنيريين<br />وانا لا الزق الوقائع دى فى الاخوان لانهم بالفعل مرتكبى كل الوقائع دى بشهادة الوثائق و المحاضر<br />انتى عايزة تسلمى البلد لمجموعة بلطجية يا سمر<br />بالنسبة لحقيقة الارقام اللى انا قلتها عن الاخوان<br />68 % منهم لم يكملوا تعليمهم العالى<br />20 % منهم اميين<br />فبجانب ان الارقام دى زى ما انا قلت قالها مرشح الوطنى عن دائرتنا كنوع للترويج لنفسه و الاقلال من شان الخصم ( الاخوان)<br />الا انها مطابقة بالظبط وبالدقة مع الارقام المذكورة فى كتاب<br />(حسن البنا القائد والشهيد ) للكاتب الاخونجى سابقا والعلمانى حاليا المغمور ( رفعت طه ) بيحكى تجربته مع الاخوان كاخونجى لمدة 7 سنين لم يلقى فيها مع الاخوان سوى الجهلة و الفشلة والغير متعلمين<br />انا لم اقول اسم هذا الكتاب فى المرة السابقة لانى بجد وبامانة كنت نسيت اسم الكاتب وانا لا احب ان اقول معلومة منقوصة<br />اما بالنسبة لانتسابهم لكليات القمة والقاع انا هقولك مثالين<br />1 انا فى اولى حاسبات ومعلومات لم القى الى الان سوى اثنين اخوانجية واحد سنة اولى مثلى وواحد سنة 3<br />2 ابن خالى هندسة عين شمس اعدادى عندهم لم يرى اخوانجية سوى مجموعة من 5 افراد واعدادى هندسة عين شمس حوالى 2000 فرد<br />انا اسمع ولكنى لم اشاهد ان الاخوان المسلمين تجمعات ضخمة فى معاهد الخدمة الاجتماعية<br />اخيرا<br />بالنسبة لدول المسيحية المتقدمة فان دستورها لا يمط الى المسيحية بصلة فكيف يمط مثلا دستور الولايات المتحدة وهى دولة مسيحية متقدمة كيف يمط بصلة الى المسيحية وهو يحلل زواج الشواذ<br />انا قصدى ارد على المندفع المتهور الللى بيقول كلام وهو مش عارف معناه لكنه حفظه الاخ المحترم وليد اللى بيقول ان المسيحية دين يدعو الى التخلف<br />حبيت اثبتله ان الناس فى اوروربا وامريكا لما طبقت قواعد الدين المتخلف ده اصبحت متحضرة لكن هذا ليس بالضرورة معناها ان الدستور مسيحى فهمتى ؟؟؟؟؟؟؟<br />بمعنى الناس فى حياتها العادية البسيطة بتطبق قواعد الدين المسيحى كعادات وتقاليد فى حين و فى ظل ان الدستور مدنى وليس مسيحى<br />وصدقينى انا اؤكد لكى ان لو الدستور مسيحى برضه الدولة هتفشل<br />زى ما كان فى اوروربا فى عصور الظلمة العصور الوسطى<br />لا بديل ولاغنى ولا مفر من الدستور المدنى العلمانى اللى بيميز الانسان اذا كان مصرى ولا مش مصرى<br />مش زى الدستور الدينى اللى بيميز الانسان اذا كان مسيحى ولا مسلم<br />وشكرا مرة تانية على ذوقك و ادبك و اخلاقك و هدؤك وعد تعصبك و ثقافتك ويا رب لا يتدنى الحوار ابدا عن هذا المستوى وياريت يتعظ الجميع بااااااااااى"
