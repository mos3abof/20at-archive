[[comments]]
order = 8
subject = ""
author = "أحمد بدر"
posted = "2009-07-30"
text = "ممممممممممممممم ممم… انا احمد بدر مصمم غلاف الكتاب<br />فى البداية طبعا بشكر الموقع على اهتمامه بالكتاب شكر خاص جدا لكنى اختلف معه قليلا فى اختياره العنوان فأبطال (في بلد الولاد ) مثليين ليسو شواذا و هذا المعنى يختلف كثيرا الشذوذ هذا يمكن ان نلحقه بالرجل الذى تتحرك مشاعره دوما للمرأة أى انه شخص عادى فى نظر المجتمع غيري فى نظر العلم و فجأة يشذ عن قاعدته ليجرب .. أكررها ثانية ليجرب !! ليس لأن مشاعره هي التى تحركه هذا هوا الشذوذ بعينه فى رأيي<br />أرجو من ادارة الموقع تغير كلمة شواذ بمثليين حتى نعطى تلك الكلمة الفرصة فى ان تنال نصيبها من فكر وثقافة عقولنا"
archived = "2009-07-31"
capture_url = "https://web.archive.org/web/20090731112347/http://www.20at.com:80/masr/review/12775-2009-07-28-12-41-20.html"

[[comments]]
