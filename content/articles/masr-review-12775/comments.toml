text = "اهلا بيكم<br />انا عندي تعليق على كلام برضو صعيدي انا عايز اعرف مين الي قلك ان مقيش الكلام ده عندكم على فكرة في الكلام ده في كل مكان وده مرض وفعلا له علاج وانا بقول الكلام ده على لاني سمعت دكاترة متخصصين بيقولو الكلام ده وبعدين بعد اذنك لو فيهحاجة مش عجباك نقدها باسلوب كويس او حاول عالجها لو تقدر مش تهاجم وتقول كلام فيه هجوووم وتقول نفضحهم ربنا بيقول اذا بليتم فستتروو او قال لو لاقيت حد بيعمل حاجة غلط متفضحوش تقوم تخالف كلام ربنا وتقول نفضحهم مش صحيح الي انتا باقوولوو<br />وشكرااااااااااا اااااااااااااا"
