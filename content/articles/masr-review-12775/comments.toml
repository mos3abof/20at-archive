posted = "2009-07-28"
text = "هما المصريين كدة بيحبو دايمآ يدفنو راسهم فى التراب زى النعام ولما واحد يتكلم عن حاجه موجودة فعلآ يقولك يعني هو مالقاش غير مش عارف مين ويتكلم عنهم !!<br />ايوة ياسيدي هو مالقاش غيرنا يتكلم عنهم عشان احنا نستحق ان الناس تعرفنا وتشوفنا لاننا بشر زينا زيكم .. ممكن اخوك أو اختك أو جارك أو صاحبك الانتيم أو قريبك يكون مثلي جنسيآ وانت مش عارف !! وممكن ابنك فى المستقبل كمان !!!<br />اعرف اكتر عننا عشان تعرف تبقي اب قادر انه يخلف رجاله يشيله اسمك !!!!!!!!"
