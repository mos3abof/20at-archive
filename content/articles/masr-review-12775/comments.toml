posted = "2009-07-31"
text = "إلى أحمد بدر .. مصمم غلاف كتاب اللامؤاخذة<br />الشــواذ شـــواذ … إيــه مثليين دي<br />يا عم أحمد .. إسمه شـــاذ لأنه شــذ عن خلق الله له<br />تطلب من ادارة الموقع تغير كلمة شواذ بمثليين \"حتى نعطى تلك الكلمة الفرصة فى ان تنال نصيبها من فكر وثقافة عقولنا\" .. أستعملوا الأشياء بمسمياتها:<br />الخمر ..خمر .. وليست مشروبات روحية ..<br />الزنا .. زنا .. وليست علاقات .."
