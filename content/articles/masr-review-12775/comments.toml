text = "من حقك تكره اللى تكره و تحب اللى تحبه انا مش هقول لاى واحد كاتب تعليق هنا انه يغير رايه بس انا عايز اقولك ان الموضوع كبير اكبر من قصة ممكن تلاقى فى عيلتك واحد او حد من ولادك هتعمل ايه ساعتها لازم تعرف ايه الاسباب الاول انا من الناس اتعرضت لاغتصاب وانا عندى 8 سنين من واحد قريبى و بنى ادم اتحرش بيا فى السوير ماركت وانا 11 سنة كل ما بحتلم بحلم انى بمارس مع رجال ايه رايك<br />انا كاره ده بس انا حاولت اغير نفسى و حاليا ماعنديش ميول لاى ولد و لا حتى بنت"
