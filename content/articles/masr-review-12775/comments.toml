author = "انا عاشرت الشواذ"
posted = "2009-11-05"
text = "ال Bottom بيقولو عليه كوديانا فى البلاد المصرية<br />و قنينة فى البلاد العربية مثل لبنان وكده سلام<br />اعرفكو بنفسى سافو بيتر 19 سنة بيروت وف مصر كتيرر ولهجتى لهجة لبنانية<br />وبقلد لهجة المصرية وكلمهم كأنى مصرى<br />اللى حبيتو ف المصريين بجد الديانة الأسلامية الشريفة قعدت فى مصر سنة وأسلمت<br />وقلت لأهلى قلولى انت حر عزب الله فيك<br />بس واثبت ع الديانة الأسلامة<br />السلام عليكم ورحمتة الله وبركاتة"
