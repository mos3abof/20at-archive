posted = "2009-07-28"
text = "وتفتكر ان الشخص الشاذ دة ينفع فى المجتمع ويبقى راجل يفتح بيت ويتزوج ويمسك بندقية ويبقى عسكرى فى جيش فى مصر على الحدود<br />اية رايك لو مديرك فى الشغل شاذ الشغل هيمشى ازاى<br />واية رايك لو بنتك وقع نصيبها المنيل فى واحد شاذ<br />الفئة دى عايزة العزل عن المجتمع والتجريس والفضيحة ثم قتلهم لان دة عار ونقص فى الرجولة وضياع للكرامة والاعتزاز بالشخصية<br />اوعى تقول لى دة مرض ولة علاج<br />دة علاجة الموت<br />والحمد للة انة مش معروف لا فى الصعيد ولا بحرى ويمكن موجود فى طبقة اولاد رجال الاعمال الجدد"
archived = "2009-07-31"
capture_url = "https://web.archive.org/web/20090731112347/http://www.20at.com:80/masr/review/12775-2009-07-28-12-41-20.html"

