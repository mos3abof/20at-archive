[[comments]]
order = 17
subject = ""
author = "انا عاشرت الشواذ"
posted = "2009-11-05"
text = "يا جماعة الشواذ دول مشكلتهم مش تربية الشواذ اللى انا عرفتهم ابناء وزراء ووكلاء نيابة وحجات كبيرة اوى مشكلتهم هيه نقص حنان من بيتهم انا عشرتهم وكانت سبب معرفتى بيهم هلنن اللى فى بورسعيد هما حبو يتعرفوا عليه وخرجت معاهم وكان معاهم حراسة لأن ابناء ناس كبيرة فى البلد هم مش بيلافو الحنان مع اهلهم ولكن بيلقو فى ممارسة الجنس<br />مع الطرف الأخر<br />هسألنى تقولى وليه ميجبش بنات مداد هو حاجه كبيرة واى بنت عاهره تتمناه؟<br />هقولك<br />! لأن هو اول ما لقى الحنان اتلاقه مع صديقو<br />ومعلومة : اللى يبقى عنده تهيج على راجل او مارس الجنس مع راجل عمره ما يبقى<br />هائج على بنت ويقرف كمان<br />هتقولى العلاج ايه هقولك اسمع الأول الحكاية دى<br />انا شخصياً حبيت واحد ماصداقة طبعا واحد بجد صاحب صحبه قعدة سنه ونص او سنتين تقريبا اصلح فيه بكل الطرق وأهله حبونى اوى اوى المهم عرفتة على ناس كويسة خليتو<br />بتأثيرى كاصديق انو يقطع علقاتة بالشواذ تمام وبكل الناس وبداءت اخلية يتعرف على اصحابى العادين وبقى كويس فمرة شفتو بيسلم على واحد صحبة شاذ قبلو واحنه مشيين باعربية اشكلت معاه سبتو بالظبط يوميين وبعدين ببص لقيتو رجع تانى واوسخ<br />بس"
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124022107/http://www.20at.com:80/masr/review/12775-2009-07-28-12-41-20.html"

