author = "عاشرتهم عن قرب .."
posted = "2009-12-03"
text = "في بورسعيد الموضوع مبقاش مسالة ان عددهم كتر لدرجة تفوق الوصف …<br />المشكلة اني وعلى علاقة خاصة بكثير من المثليين في بورسعيد اكتشف ان الموضوع بيبتدي بالحاجة للحنان والحب وبينتهي بالاستغلال والجشع والبحث عن المال مقابل المتعة فيما يعرف بين عالم الجايز ب(الاوردرات) … ودي معناها ان راجل توب بيدور على كوديانا للمتعة مقابل مال وبيتعملهم بارتيهات واشهرها في راس البر … بلاش نبصلهم نظرة احتقار انا كنت على علاقة بيهم لاحظت ان اغلب كلامهم ملئ بالخوف والتوتر وبيكدبوا على بعض لانهم خايفين من بعض .. حياتهم كلها غموض وقلق وضعف وكتير منهم بيوطاردوا وناس بترفع عليهم السلاح … وبينهم وبين بعضهم بيلعنوا اليوم اللي بقوا فيه كدا ودا كلام انا واثق منه لاني قعدت معاهم وعاشرتهم … ياريت نصلحهم ونعالجهم عشان يبقوا شباب صالحين بدل ماحنا بنطاردهم ونعورهم ونشتمهم وندخلهم السجون …<br />بجد الكتاب دا صرخة لتغيير معتقدات في المجتع لازم تتغير …"
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124022107/http://www.20at.com:80/masr/review/12775-2009-07-28-12-41-20.html"

