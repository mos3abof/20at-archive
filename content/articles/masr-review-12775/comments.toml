[[comments]]
order = 10
subject = ""
author = "لأ المثلي شاذ طبعا"
posted = "2009-08-02"
text = "لكل مثلي شااااااذ<br />المعنى اللغوي لكلمة إنسان طبيعي جنسيا<br />يعني اتولد طبيعي زي ما أساس ما خلق الله سبحانه آدم و حواء و خلق بينهم هذه العلاقة فهنا تكون طبيعية<br />أما غير ذلك لا يكون طبيعيا مثال على ذلك مجرد مثال لتفهم المعني اللغوي و النفسي و الاجتماعي و الديني و المنهجي و الفلسفي و المنطقي و العلمي لكلمة طبيعي"
archived = "2009-09-01"
capture_url = "https://web.archive.org/web/20090901012915/http://www.20at.com:80/masr/review/12775-2009-07-28-12-41-20.html"

[[comments]]
order = 11
subject = ""
author = "لأ المثلي شاذ طبعا"
posted = "2009-08-02"
text = "الطبيعي هو كل ما خلق على أساسه الله الإنسان و الغير الطبيعي هو كل ما شذ عن أساس ما خلق الله<br />يعني الأم التي تحب و ترعي أولادها فهي أم طبيعية<br />أما التي تكره و تترك أولادها فهي غير طبيعية<br />فطبيعي أن تولد بأذن و الغير الطبيعي لا<br />إذن الذي لديه أذن فهو طبيعي و الذي لا لديه هو ليس طبيعي<br />لأن الطبيعي له أذن<br />التي تلد وليدها بعمليه سيزرين يقول عنها الطب ولادة غير طبيعية أما التي تلد الولادة التي فطرها الله عليها يقول عنها الطب ولادة طبيعية"
archived = "2009-09-01"
capture_url = "https://web.archive.org/web/20090901012915/http://www.20at.com:80/masr/review/12775-2009-07-28-12-41-20.html"

[[comments]]
order = 12
subject = ""
author = "لأ المثلي شاذ طبعا"
posted = "2009-08-02"
text = "الرجل الذي يميل للرجل! كيف يكون طبيعي فلا تقول طبيعي على هذه الحالة<br />فالإنسان مفطور من الله عز و جل على تقبل كل ما هو طبيعي و رفض كل ما هو غير طبيعي تقبل آدم و حواء و علاقتهم سوا هي أساس و منهج البشرية الطبيعية التي خلقها الله عز و جل<br />فكان بقدرته عز و جل أن يخلق آدم و له رجل آخر<br />أو حواء و لها أنثى أخرى<br />فلا تسمع لمن يحاولون إيحاء ليك بأنك طبيعي لأنك هكذا منذ طفولتك<br />إذن فهكذا أنت منذ طفولتك و لا ذنب ليك في هذا وأنت طبيعي بالنسبة لنفسك و لنفسك لأنك لم تشعر غير ذلك جائز و مقبول كلامك لحد هنا<br />لكن تقنع نفسك و تقنعنا انك طبيعي طبيعة البشرية مش هتلاقي حد يصدقك غير المثليين و أسفه جدا كان نفسي اقدر أساعدك تتخلص من حالة العذاب اللي عندك<br />لكن مش بيد أي مخلوق يساعدك تتخلص منها غير نفسك أنت و بس<br />فلك الحرية أن تكون مثلما تحب و تفعل ما تريد<br />و لكن لا يحق إلا الحق<br />و لا يصح إلا الصحيح"
archived = "2009-09-01"
capture_url = "https://web.archive.org/web/20090901012915/http://www.20at.com:80/masr/review/12775-2009-07-28-12-41-20.html"

