text = "ممكن بعد ازنكم تسعدونى انا بعمل بحث ومحتاج لاى موقع معلومات ثقافى غير جنسى<br />لاضافته على البحث ضرورى ممكن البحث ده يعمل تغير فى حياه المثلين او الشواذ<br />تغير هيغير مجره حيتهم اكيد سعدونى ارجوكم<br />اخوكم د/ عبد العزيز فى علم النفسى<br />والسلام عليكم ورحمت الله وبركته"
