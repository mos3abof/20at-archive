posted = "2009-11-05"
text = "ااحر معلومة بقى علشان امشى لو عايز صاحب ليك ولل العمر يبقى معاك ويدافع عنك بروحو ويرمى نفسو فى النار علشانك هو الشاذ Bottom ولازم تكون انت استريت يعنى راجل طبيعى لو شاذ ملهاش لازمة وتخليه يبقى كويس وتصلحة وهيبقى ليك ولزمن بس عملة كويس ياريت اكتر من اخوك عمرة ما يخونك ولا يسرقك طبعا ولا اى حاجه حجتك هيا حجتو ده لو ملكش صحاب و مشاكل مع اهلك ومش طايق حد وعايز حد يبقى ليك<br />بس طبعا مفيش حاجه اسمها ممارسة جنس بنكو انت تصلحو مش تبوظو وبعدين نقى شخص منظرة راجل متصحبش اللى ضيعين خالص وفعلا شكلهم نسوان<br />سلام بقى اديا وجعتنى من الكتابة يلا يا جماعة سلام"
