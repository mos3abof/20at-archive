subject = "بيرو"
text = "بمناسبة الكلام عن الإنسحاب أحادي الجانب ( الذي هو لا أحادي ولا حاجة) طالعت منذ يومين رأي علي أحد المندتيات السياسية علي الإنترنت يشير إلي تورط \"الزعيم الفلسطيني\" عرفات في التخطيط لعملية اغتيال الشيخ ياسين القذرة ومن بعدها العملية الأكثر قذارة والتي أستهدفت الدكتور الرنتيسي .....<br />يقولون انهم لما قالوا له سنترك لك غزة قال في حدة ( لا أنزل غزة وياسين فيها)<br />موش عارف حجم صدق الكلام دخ الا انه في نظري باين انه منطقي شوية ...والمراجع لتاريخ \"العلمين\"ياسين الأبي وعرفات المحاصر يجد الكثير من مواقف التحفظ والغضب والتي يبديها عرفات دائما من شيخ الشهداء أحمد ياسين<br />يقولون ان عرفات لازال يحلم بالدولة الفلسطينية<br />نسي أن الحداية لا ترمي كتاكيت !!!!!!!!!!!!!!!!!!!!"
archived = "2004-09-26"
