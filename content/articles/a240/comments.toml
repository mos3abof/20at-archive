[[comments]]
order = 1
subject = "عن الخزي والعار وملاك الموت .. وصور أخرى"
text = "ما الذي يمكن أن تشعر به غير الحسرة والانكسار وأنت ترى ألف صورة من اللواط والاعتداء الجنسي على الرجال الرجال .. الذين يمرغون وجه أمريكا الأمرد بوش في الوحل ... وهو المطلوب أن تشعر في قرارة نفسك أيها العربي بأنك مسلوب الرجولة .. مسلوب الشرف فلا تستسلم<br />أما سيف الزرقاوي فليس سوى ملاك الموت الذي ينبعث من دخان الجحيم العراقي .. مسرور السياف ليس هو الحل بالطبع .. إنما ارجع مرة أخرى لصور الفلوجة .. والنجف حيث المقاومة تحمل سيف الحق الذي لا تستعيره من قصص القرون الوسطى وظلامها إنما من نور العدل والسعي نحو الحرية ... فادخل في أتون النور ... وقاوم<br />صور أخرى : بئس حال النائمين الذين يمصمصون شفاهم وهم يشاهدون اللف صورة وصورة وصورة أخرى للنصر .. ثم لا يجدون حرجا في استمرار الحياة ."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926224531/http://www.20at.com:80/article.php?sid=240"

[[comments]]
order = 2
subject = "جنود ورق"
text = "أمريكا اضطرت إلي تحريك 4 ألاف جندي من كوريا الجنوبية إلي العراق بسبب نزيف الخسائر المستمر..الأخطر كما قال أحمد منصورفي ندوة له في نقابة الصحفيين المصرية الأمس - 17 مايو -أن إصرار الأمريكيين على نقل السلطة قبل 30 من يونيو يرجع على أن من 40 – 50 ألف جندي من الجنود الأمريكيين مرتزقة ينتهي تعاقدهم مع الجيش في هذا التاريخ، وأن هؤلاء المرتزقة رفضوا عروض وزارة الدفاع الأمريكية برفع رواتبهم الهزيلة (1000- 1500 دولار في الشهر) وقرروا ترك الجيش."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926224531/http://www.20at.com:80/article.php?sid=240"

[[comments]]
order = 3
subject = "القبنجي"
text = "الشيخ القبنجي أحد مساعدي عبد العزيز الحكيم ومن أهم الوجوه في مجلس الثورة الإسلامية بالعراق..والرجل كان له موقف مطابق لموقف قوات الإحتلال الأمريكي بشأن خروج مقتدي الصدر من النجف وتسليم نفسه لقوات الإحتلال ولذلك آثرنا إضافة حرف الضاد في وسط إسمه ليتسق معناه.<br />كفانا الله شر الخيانة والخونة"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926224531/http://www.20at.com:80/article.php?sid=240"

[[comments]]
order = 4
subject = "غاندي البلد"
text = "من قال أن مسرور السياف هذا هو مصعب الزرقاوي .. ومن قال أنه قتل أمريكياً .. ومن قال أن الشريط او الصورة حقيقية ..<br />إنها لعبة حارويني يا كيكا الشهيرة التي لعبها أجدادانا الفراعنة ..<br />وعلى رأي اسمه إيه ده<br />إخص إخص إخص"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926224531/http://www.20at.com:80/article.php?sid=240"

[[comments]]
order = 5
subject = "بين يدى مرآة الكف"
text = "بداية شكرا عزيزى الكاتب على هذا المقال وعلى محاولتك لإلتقاط مرآة الكف و إعادة توازن مفقود من<br />خلال انى أتفق معك ان ما فعله الإعلام الأمريكى و البريطانى بعيدا عن اى تفسير تآمرى ما هو الا اتباع لسياسة قديمة وهى سياسة ادارة مرآة الكف بمعنى تحويل الأنظار و الأهتمام من مكان ساخن وموجع الى موقع سهل تحجيمه و السيطرة على نتائجه ..........<br />تماما كما يفعل ماسك المرآة بالمحدقين فيها<br />و لكن يتبقى السؤال الملح دائما الى متى نحدق مشدوهين فى مرآة زائفة؟!!!!!!!!!<br />النبيـــــــــل"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926224531/http://www.20at.com:80/article.php?sid=240"

