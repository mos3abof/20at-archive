text = "تقصد مين بالنتن و الأنتن؟؟؟!!!<br />استغفر الله العظيم يا رب...وكاتبلي فوق لا حول ولا قوة إلا بالله، هو أي واحد يحب يقول جملة حتى لو كانت هزار أو عايز يقول رأيه و السلام بيتهاجم و يتشتم ولا إيه؟؟؟!!<br />هي دي أخلاق المسلمين؟!!<br />اتقي الله يا أخ!!!"
