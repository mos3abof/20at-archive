text = "السلام وعليكم ورحمة اللة وبركتة اسعيدة جدا بمعرفة بمنشد مسلم كسامي يوسف وذلك لنشرة السلام على الارض واللة لو لم يظهر سامي يوسف لانتشر الفساد وذلك فقد لسماعهم للاغاني التي تجذب الشواطين وامور محرمة كالبس الغير محتشم ...وغيرها انا احمد اللة على ظهور منشد مسلم وارجوا من اللة ان يوفقة ويظئ طريقة ويكون الدين نور قلبة . احترم المسلم سامي يوسف احتراما لا يعرفة الى اللة . وشكرا"
