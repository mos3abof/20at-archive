[[comments]]
order = 64
subject = "كلمة حق أبتغي بها وجه الله الكـــريم basm_v@hotm"
text = "الحمدُ لله والصلاةُ والسلام على رسول الله وخاتم النبيين محمد صلي الله عليه وسلم \" معلم المعلمين \" ـ جزاك الله كُل خير يا أخونا فى الله سامي يُوسف ، وأسأل الله عزّ وجلّ باسمائه الحُسني أن يحميك ويحفظك ويُزوّجك ويجعلك من أهل نُصرة الإسلام والمُسلمين فأنت بصوتك \" ماشاء الله لا قوة إلا بالله \" جعلك الله تصل إلى قلوب المسلمين والمُسلمات فى مشارق الأرض ومغاربها مثلك مثل الداعية الأستاذ عمرو خالد ، لكن حسبُنا الله ونعم الوكيل فيمن يتهموك بالخلاعة أو بأي شىء يريدون به تشويه صورتك ـ وعموماً نحن نفعل ما يُوفقنا به الله عزّ وجلّ من كتاب ربنا وسُنة رسوله مُحمد صلى الله عليه وسلم بفهم الصحابة الكرام ـ وفى خلاف فى تحريم الموسيقي وهل هذه الموسيقي تُؤدي إلى الغرام والعشق فى الحرام ؟ وهل هذه الموسيقي موسيقي تجعلني أرقص وأغني مع الداعرات ؟؟؟ وهل هذه الموسيقي تجعلني أمارس شهوتي فى الحرام ؟؟؟ فأقول للذين يسُبوا فى الإخوان المسلمين اتقوا الله ـ والله العظيم ما هينفعنا إلا تقوي الله بحق بأن نحترم الدين الذي منَّ اللهُ به عليه ـ وما سامي يُوسف إلا أخ ذكرنا بصفات رسولنا الكريم باسلوب أنشودة ـ على العكس من هؤلاء المغنيين والمُغنيات والعُري والإختلاط والقذارة والأحضان والقبلات ـ فاتقوا الله يا من انتسبتوا للإسلام اتقوا الله بقول كلمة الحق ولو على أنفسكم ... قال الخلاق العليم : واتقوا يوماً ترجعون فيه إلى الله ثمّ توفّي كُلُ نفسٍ ما كسبت وهم لا يُظلمون \" سورة البقرة . وصلي اللهمّ وسلم وبارك على رسولك الني الأمي محمد إلى ما شئت أن يكون يا الله وآخرُ دعوانا أن الحمدُ لله رب العالمين"
archived = "2005-03-24"
capture_url = "https://web.archive.org/web/20050324091417/http://www.20at.com:80/article.php?sid=769&mode=&order=0"

