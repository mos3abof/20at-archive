[[comments]]
order = 4
subject = "الأخ المفقوع"
text = "أولا احب أهنيك على فقعتك وبعودة الفقعات<br />ثانيا يا أخي انت أمرك عجيب كل اللي عشرينات بتنشره ده عن العراق والسياسة وفلسطين ومش عاجبك<br />ثالثا يا عم يعني هو حلال على عمرو دياب ونانسي عجرم وحرام على الراجل الغلبان ده؟<br />كل شوية يقولوا لنا عمرو صباعه واجعه إليسا بتعمل عملية في ضفر رجلها<br />ومش عايز الشباب يهتم بظاهرة ملفتة زي سامي<br />بقولك<br />ربنا يشفيك"
archived = "2005-03-24"
capture_url = "https://web.archive.org/web/20050324091417/http://www.20at.com:80/article.php?sid=769&mode=&order=0"

[[comments]]
order = 5
subject = "زهور"
text = "بالنسبة لموضوع استعمال المعازف فهو فيه اختلاف كبير جدا وكتبت(بضم الكاف) فيه عدة كتب لعدة علماء عظماء وأفاضل<br />(ولان اختلاف العلماء رحمه )<br />فان مجال النقاش في هذا الموضوع يجب أن يكون محدود حتى لا نشغل أنفسنا بأشياء اكبر منا وننسى المهم<br />لكن اعتقد أن أناشيد المنشد سامي يوسف وغيره من المنشدين جعلت فئة كبيرة من الشباب تحب الأناشيد وتجعلها بديل سامي راقي عن الأغاني الهابطة<br />واعتقد انه لا مشكله من كتابة ثلاث مواضيع عن المنشد سامي لان لازم اغلب الناس يسمعوا لأنو ممكن يغيروا رأيهم في الأناشيد ويسمعوها<br />واعتقد انو موقع عشرينات نزلوا عدة مواضيع عن العراق او حتى ما يخص العراق"
archived = "2005-03-24"
capture_url = "https://web.archive.org/web/20050324091417/http://www.20at.com:80/article.php?sid=769&mode=&order=0"

