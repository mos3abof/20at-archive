[[comments]]
order = 15
subject = "حرام وما البديل"
text = "إلى الزميل الذي يدعي أن الغناء (الإسلامي) حرام هو مدعي علم لا يعلمه وأقول أسهل شئ إنك تقول للناس حرام حرام حرام وأصعب شئ إنك تجد بديل راقي لشئ قد عمى فيه البلوى الأن يعني يا حبيب معظم الشباب حتى المتدين لم بنجو من الأغاني ا لهابطة إما في الشارع في الميكروباص في البيت في التلفزيون وإذا تجرك أحد لعمل شئ مفيدة وهي تجربة ندعو الله أن تنجح جاء البعض بكل بساطة وقال إن هذا حرام<br />يا أخي العزيز أياكم الأمام بن تيمية عندما كان يرى جنود التتار يشربون الخمر كان يمنع أتباعه ان يقوموا بنهيهم عن شرب الخمر لأنهم إذا فاقوا قتلوا المسلمين ويوجد قاعدة (ارتكاب أخف الضررين) في أسوأ الظروف<br />وماذا تقول في الحديث (عن الجاريتين اللتان كانتا تغنيان عند رسول الله وقال لأبي بكر دعهما يا أبا بكر لإنهما في يوم عيد) وأسأل العملماء حتى تعلم الأدلة"
archived = "2005-03-24"
capture_url = "https://web.archive.org/web/20050324091417/http://www.20at.com:80/article.php?sid=769&mode=&order=0"

