subject = "أيلة من مدينة سطيف الجزائر"
author = "رفعوا راية الإسلام يا إخوة اعرب وكونوا دائما أوفياء في نشر الدعوة الاسلامية فصوت الحق هو الأاس دافعوا عن دينكم ولو بالكلمة الطيبة ولا تتأثروا بكلام اليهود و النصارى فهدفهم هو دحر الدين و ازالة مبادئه ووفقك الله وسدد خطاك يا أخي في الله لما يحبه و يرضاه و بارك الله فيك"
