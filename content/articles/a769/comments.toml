subject = "سامي الفلسطيني الى المتالقة زهور"
text = "اولا احي الاستاذ سامي يوسف<br />وادمه الله ذخراا للامة<br />وارجو منه ان ينشد لفلسطين والاقصى<br />وسيكون له اثر في ابناء شعبنا<br />واعجبني الراي المتعقل للفتاة المتالقة<br />الجميلة الرائعة<br />وكل تحياتي لاسرة عشرينات"
archived = "2005-03-24"
capture_url = "https://web.archive.org/web/20050324091417/http://www.20at.com:80/article.php?sid=769&mode=&order=0"

[[comments]]
order = 8
subject = "لا حول ولا قوة الا بالله"
text = "أتعجب من بعض التعليقات التى قيلت عن هذا لمقال وأتعجب من التشدد والصد عن كل شئ جديد وهادف فهذه هى نفس الأقلام التى لا تنفك تكتب ان الداعيه الاسلامى عمرو خالد ما هو الا صوره خاطئه للتدين وللدعوه وهو الذى هدى الله على يديه المئات بل الألاف من الشباب,<br />لا أعرف ما أقول لهؤلاء الا أن يتقوا الله ويتركوا الفرصه للشباب للتجديد الهادف الذى ليس فىه افراط أو تفريط<br />أخيرا تحية حب واجلال لكل من سامى يوسف وعمرو خالد وكل الدعاة الذين على شاكلتهم"
archived = "2005-03-24"
capture_url = "https://web.archive.org/web/20050324091417/http://www.20at.com:80/article.php?sid=769&mode=&order=0"

[[comments]]
