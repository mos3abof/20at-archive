[[comments]]
order = 11
subject = "زهور"
text = "الله يفتح على كاتب التعليق السابق<br />هو دا الكلام المتعقل فعلا<br />انا ما رضيت اذكر كتاب القرضاوي حتى لا أثير تحسسات البعض من المعلقين في الموقع<br />بس مش مشكله جزيتم خيرا على هذا التوضيح الرائع<br />و يارب الأغلب بقراء التعليق والروابط لأنو كان هناك عدة تساؤلات عن حكم الموسيقى في عدة مواضيع أخرى في الموقع<br />واشكر كاتب أو كاتبة التعليق جزيل الشكر"
archived = "2005-03-24"
capture_url = "https://web.archive.org/web/20050324091417/http://www.20at.com:80/article.php?sid=769&mode=&order=0"

[[comments]]
order = 12
subject = "شيء لم يعجبني !!!"
text = "السلام عليكم ورحمة الله وبركاته ...<br />احيي المنشد الاسلامي الكبير سامي يوسف الذي ترك اثرا طيبا في النشيد الاسلامي واخذ به الى التطور ليصل الى اذان الجميع بغير استثناء واسال الله له التوفيق لما يحبه ويرضاه وسدد الله خطاه .<br />بدايه احب ان انوه على شيء ، فانااول مره ازور هذا الموقع وقد لفت انتباهي بعض التعليقات التي لم تعجبني من بعض الأخوة .. فمثلا اقول لمن كتب (( واحد نتن والتاني انتن )) اقول له :: ما الداعي لهذا الكلام الغير مهذب ؟؟ فاذا كان الموضوع لا يعجبك فلا داعي لأن ترد على الموضوع بهذه الطريقه الغير لائقه وبهذا الرد تكون قد عكست صوره غير لائقه عن نفسك اولا وعن الدين الذي تنتمي له ثانيا .. هداك الله<br />واشكر جميع الأخوة واسال الله لكم التوفيق<br />والسلام عليكم"
archived = "2005-03-24"
capture_url = "https://web.archive.org/web/20050324091417/http://www.20at.com:80/article.php?sid=769&mode=&order=0"

[[comments]]
order = 13
subject = "اللهم انصر دينك بعبادك"
text = "السلام عليكم اخوانى<br />انا بحب كتير جدا جدا المنشد الشاب سامى يوسف وربنا يوفقه يارب<br />واتمنى ان ينشد لفلسطين وكل الامة العربية<br />لما فى صوته من احساس قوى وحبه للاسلام ولرسول الله<br />والله لكلما سمعت اغنية يا معلم الا وزاد حبى لرسول الله<br />فيارب اجعل هذا فى ميزان حسناته اخونا الفاضل والله لكنت اود ان اراه رويا العين فى القاهرة لكن هذا قدر الله<br />ربنا يوفقه يارب"
archived = "2005-03-24"
capture_url = "https://web.archive.org/web/20050324091417/http://www.20at.com:80/article.php?sid=769&mode=&order=0"

