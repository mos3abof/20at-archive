[[comments]]
order = 55
subject = "إنسانة"
text = "والله أناشايفة إن سامي أجمل طريقة ندعوا بها للإسلام ، وال؟أهم من كده إننا نظهر إن عندنا فن راقي وهادف غير آخصمك آه أسيبك لا وغير حبيبي بح وحط النقط على الحروف وللي معارضينه أقولهم هوا أحسن بطكثير ومافي مقارنة بينه وبين العاهات والمجانين اللي بنشوفهم على التلفزيون ، وأنا أعتقد إنه إستخدم آلات مافيها أي تحريم وحتى إذا في إعتراض على الموسيقى فأنا متأكده إن اللي قالوا حرام وماحرام ماسمعوا أغاني محمد منير واللي واحدة فيهم إسمها صلاة الله ولحنها يشبه لحن أغنية لراغب علامة وأغنية صلاة في سري وصلي ياواهب الصفا أتمنى إنكم تدخلوا موقع الطرب وتسمعوها لأني ماقدرت أنزلها، يعني اللي عاوزة أقوله إنه إنسان رائع لأنه حرام أقول أفضل من غيره كأنه ماشي في طريقهم غير اللهم يغني كلمات أحسن شوي من آخصمك وأسيبك وأجيبك ، وبعدين للي يسبوا في الصوفية والشيعة أقولهم عيب لما نكون أبناء دين واحد وكذا أسلوبنا وإحنا مش الله علشان نحاسب ده ونكفر ده ، ولو في إعتراض على سامي حطولنا بديل مع إني شايفة إنه مافي بديل لهذا الشاب الرائع اللي بيوصل بمواهبه وبأحاسيسه ثقافة لاإله إلا الله غير عن اللي أعطاهم ربي الموهبة وبيستغلوها في نشر ثقافة الهشك بشك وهز الوسط .................. تحياتي"
archived = "2005-03-24"
capture_url = "https://web.archive.org/web/20050324091417/http://www.20at.com:80/article.php?sid=769&mode=&order=0"

