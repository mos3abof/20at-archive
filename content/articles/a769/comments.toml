text = "يا شباب هناك أمران مهمان لابد أن نعرفهما :<br />أولا: حكم استخدام الالات الموسيقية حرام حرام حرام شرعاولا خلاف على ذلك سوى من بعض ضعاف العلم الشرعي او من في انفسهم غرض الله اعلم به<br />ثانيا : سامي يوسف لم يأتي بجديد فكل أغانيه ألحانها مقتبسة (ولا أريد أن أقول مسروقة) من منشدين اخرين (أغنية (الله)من أنشودة عرفتك(أنشدها قبله ريحان والعجيل و جل الله في علاه مسروقة من تتر المسلسل المصري المعروف,وغيرها....<br />فرجاء لا تعطوا الناس حجما أكبر من حجمهم"
archived = "2005-03-24"
capture_url = "https://web.archive.org/web/20050324091417/http://www.20at.com:80/article.php?sid=769&mode=&order=0"

