text = "بارك الله في امثالك يا ابن يوسف بس في حاجة مش عجباني فيك علشان نكون صرحاء مع بعض سوالفك مش مقصوصة كويس وشعرك طويل انت مطوله عشان البنات ولا ايه ما احنا شباب زي بعض وبس خلاص عشان انا اتخنقت منك"
