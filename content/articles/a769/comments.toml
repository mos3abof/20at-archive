text = "والله شفو<br />الموضوع في الصح وفي الغلط<br />اممممممممممم<br />احنا نقول الاعمال بالنيات<br />والله اعلم بنيت الجميع<br />والله الهادي الى سواء السبيل<br />واعتقد سامي ماعلي اي اشكال<br />بس كان المفروض يحطها بدون دق<br />بس سيبو الرجال على كيفو<br />محد بضربو على ايدو<br />وبصراحه جذبني لنشيد اكتر من زمان<br />والله ولي التوفيق<br />اتحدى احد فهمني"
