text = "السلام عليكم ورحمة الله وبركاتة اولا اهنئ المسلم سامي يوسف عاى الدعوة من خلال الانشيد لقد انهدى الكثير عند سماعها,جزاك الله الف خيرا . واقول لجمع الذين كتبوا امور لا جدوا منها عن سامي يوسف هداكم الله ,انظروا الى افسكم قبل غيركم.واقول بالنسبة ان الموسيقى حرام ارد علية واقول له كما عرفت من شيخ بان ليس كل انواع الوسيقى حرام .اقول لكم انة ظهر شخص مسلم الذي بانشيدة عرف الشعب الشرقي والغربي ما هو الدين السلامي من هو النبي محمد صلى الله وعلية وسلم .صدقوني يا اخوة لا يوجد منفعة من الاغاني مثل نانسي وروبي ...وغيرها جميعهن وجميعهم في النار ولا يجلبن الا الفضائح والكابه والشيطين .الحمد لله لانه ظهر مسلم حقيقي وشكرا"
