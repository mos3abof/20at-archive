subject = "المهم ايه اللي بيتقال"
text = "سلام عليكم,انا بس حبيت اقول انه كتير من اللي اتكلمو كانو بيهاجمو سامي يوسف لأنه استخدم موسيقى في اغنيته و حاجات كتير أوي , بس من رأيي انه لو ماكانش عمل كده مكنش حد هيسمع الأغنيه أو الأنشوده بتاعته , فكرو بقه ليه هو حب انه يلفت نظركو للأغنيه بتاعتو , انا هقول لأنه احنا معظمنا بنتفرج على حاجات و بنسمع حاجات مش بتفدنا , بالعكس دي بتضرنا , و قلييييل جدا من الشباب اللي بيشتروا شرايط اناشيد (ولا انا غلطانه في ده؟) , انتو لو ماكنش عمل اغنيته فيديو كليب او عمل كوووول اللي انتو بتقولو عليه كان حد سمعه , و بعدين الأغاني اللي لازم نقول عليها حرام هي اللي كلامها مش محترم او مبتفدش في حاجه , و انا شايفه ان اغنية سامي يوسف فعلا مفيدة و هادفه , و ماعتقدش انها حرام ولا غلط اننا نسمعها و نفهم أهدافها . و انا اسفه اذا كنت طولت"
archived = "2005-03-24"
capture_url = "https://web.archive.org/web/20050324091417/http://www.20at.com:80/article.php?sid=769&mode=&order=0"

