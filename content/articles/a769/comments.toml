subject = "سخنين"
text = "وللة كل واحد بيعرف شو معنى سامي يوسف و مقامو اسا عند الرسول بعرف شو هو الاسلام مش زي بعض جماعة الي بقولو انو بدور على عروس فهذا مش من مقام سامي يوسف هذا من مقام الي كتبو عن سامي واللة بعرف شو طريق كل واحد من الي بكتب عن سامي وأنا من الي بتمنو يكونو من ربع مقام سامي عند الرسول فأكتب لك يا سامي بان تكمل طريقك في نفس الاتجاه ولا تقلل من قيمتك مثل بعض جماعة ان طريقك الأصح فلا تخطئ كلنا معاك الله معاك الرسول معاك كل رجل وامرأة طفل وطفلة معاك"
archived = "2005-03-24"
