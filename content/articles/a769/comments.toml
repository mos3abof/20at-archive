subject = "فتاة من فلسطين"
text = "بصراحة، ظهور هذا الشاب جذب انظار الجميع من شباب وشابات، وانا من ضمن هؤلاء حيث انني معجبة جدا بسامي يوسف ولي طموح كبير، انا فتاة ابلغ ال18 من العمر الحمدلله اقوم بجميع واجباتي اتجاه ربي بالرغم من ذلك اشعر باني مقصرة.<br />انني اسأل الله عز وجل ان يوفققك يا سامي يوسف وان يسعدك في كلا الداريين (الدنيا والاخرة) وان يسعد كل امة محمد صلى الله عليه وسلم.<br />والسلاو عليكم ورحمة الله وبركاته"
