text = "بسم الله<br />أستاذة دعاء . . آسف الكلام لإقبال بركة و ليس لفتحية العسال ، الكارثة أن الكاتبتين الكبيرتين قالتا نفس الكلام ، كلتاهماهاجمت الحجاب و أيدت الوزير .<br />آسف مرة أخري و أرجو أن تتقبلى احترامى"
archived = "2006-11-21"
