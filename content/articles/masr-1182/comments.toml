text = "هذا الوزير هو وزير الوراء دائما كل تصريحاتة وكلامة للوراء لماذا ؟ هل هو انسان شاذ جنسيا كما يقول الناس ولماذا لم يتزوج الى الان ولماذا طقم الاستقبال وكل مكتبة من الشباب الفارع الطول وقوي البنية لماذا ؟"
