[[comments]]
order = 1
subject = "في موريتانيا (فــال) حلو خالص"
author = "إبن بهية"
posted = "2006-11-19"
text = "إبن بهية<br />أستغرب من قلة التغطية الإعلامية لموضوع الانتخابات البلدية الموريتانية رغم خطورة الموضوع .. فهو ربما يكون حلقة (بايلوت) في مسلسل التغيير العربي والإسلامي .. بروفة يعني .. آه لو نجحت تجربة إخواننا الموريتانيين وأتت بحكم ديموقراطي محترم سيكون بكل تأكيد (فال كويس أوي أوي) .. أقصد الإثنين كويسين طبعاً رئيس الحركة العسكرية (المباركة حتى اليوم) العقيد علي ولد محمد فال ، وبرضه فال كويس أوي أوي (من باب الفأل الحسن) لينا في مصر لو أكرمنا ربنا بحفنة عسكر تسري في عروقهم دماء حارة وانتزعوا البلد من براثن النظام الحاكم بأمر مش عارف مين .. تعلمنا قديماً أن الانقلابات والحركات العسكرية في أي بلد في العالم تأتي كنتيجة منطقية لجملة من الأسباب .. تتوفر كل هذه الأسباب في بلدنا الحبيب مصر منذ أكثر من ثلاثين عاماً ويزداد تركيزها كل يوم حتى باتت معتقة جداً لدرجة شديدة المرارة وشديدة العطن والعفن ..<br />لقد أعياني البحث كثيراً في سر عدم قيام أي حركة عسكرية انقلابية في مصر حتى الآن برغم كل ما تعانيه من آلام ومشكلات داخلية وخارجية بسبب ذلك النظام البغيض ؟؟؟ مليارات المليارات تنهب كل يوم وأهل مصر تقطعت بهم السبل في شتى بقاع الأرض طلباً للقمة العيش التي قلما يجدوها ويلعقون كرامتهم اتقاء عضة الجوع التي لا ترحم .. وفي المقابل تجد القطط السمان تزداد تخمة ورفاهية تصل إلى أبعد حدود السفه التي يمكن معها أن يصل مصروف قطيط صغير (قطقوط صغنن) إلى ما يوازي مصروف حي كامل من أحياء القاهرة الفقيرة .. دماء المصريين باتت مهدرة بعد أن أهدرت كرامته وأمسى لا قيمة له ولا ثمن يذكر ..<br />يموت المصريون يومياً في البر والبحر والجو بلا ثمن ولا مسائلة حتى من باب تكريم الإنسان .. يموتون على الإسفلت من جراء سرقة ونهب مليا<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085620/http://masr.20at.com:80/article.php?sid=1182"

