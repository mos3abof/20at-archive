[[comments]]
order = 7
subject = "وذكر بالقران من يخاف وعيد"
author = "يقول اللة عز و جل:"
posted = "2006-11-20"
text = "\"وَقُل لِّلْمُؤْمِنَاتِ يَغْضُضْنَ مِنْ أَبْصَارِهِنَّ وَيَحْفَظْنَ فُرُوجَهُنَّ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا مَا ظَهَرَ مِنْهَا وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَى جُيُوبِهِنَّ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا لِبُعُولَتِهِنَّ أَوْ آبَائِهِنَّ أَوْ آبَاء بُعُولَتِهِنَّ أَوْ أَبْنَائِهِنَّ أَوْ أَبْنَاء بُعُولَتِهِنَّ أَوْ إِخْوَانِهِنَّ أَوْ بَنِي إِخْوَانِهِنَّ أَوْ بَنِي أَخَوَاتِهِنَّ أَوْ نِسَائِهِنَّ أَوْ مَا مَلَكَتْ أَيْمَانُهُنَّ أَوِ التَّابِعِينَ غَيْرِ أُوْلِي الْإِرْبَةِ مِنَ الرِّجَالِ أَوِ الطِّفْلِ الَّذِينَ لَمْ يَظْهَرُوا عَلَى عَوْرَاتِ النِّسَاء وَلَا يَضْرِبْنَ بِأَرْجُلِهِنَّ لِيُعْلَمَ مَا يُخْفِينَ مِن زِينَتِهِنَّ وَتُوبُوا إِلَى اللَّهِ جَمِيعًا أَيُّهَا الْمُؤْمِنُونَ لَعَلَّكُمْ تُفْلِحُون\"َ سورة النور.<br />اللهم ارفع مقتك و غضبك عنا و لا تؤاخذنا بما فعل السفهاء منا."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085620/http://masr.20at.com:80/article.php?sid=1182"

[[comments]]
order = 8
subject = "الاسباب الحقيقية للتخلف"
author = "الاسباب الحقيقية للتخلف هي الفساد الاداري والدكتاتورية وليس الحجاب إلي هو لا يعدو عند كونه أمر ديني اسلامي وكمان هو قطعة قماش متر x متر مش اكتر."
posted = "2006-11-20"
text = "في امر تاني مهم وهو تضخيم رد فعل الاخوان وتصويرهم وكأنهم المدافع الاول عن الاسلام في حين ان أغلب ردود الافعال كانت من ناس ملهاش علاقة بالاخوان زي نواب من الحزب الوطني وكمان مصطفى بكري ورجب هلال حميده.<br />وبصراحة النظان الوسخ هيستغل لموضوع ومتوقع ان مبارك يقيل فاروق حسني ويظهر امام الناس في صورة المدافع والغيران على الدين<br />امر اخير مهم ...وهو ان وسائل الاعلام ضخمت الموضوع زيادة عن اللزوم"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085620/http://masr.20at.com:80/article.php?sid=1182"

[[comments]]
order = 9
subject = "الى الاستاذ عماد"
author = "دعاء"
posted = "2006-11-20"
text = "الاستاذ عماد ابو العز اشكرك على وقتك الثمين الذي قضيته لتقرا الموضوع وكذالك كتابة تعليق حول الموضوع لكن يبدو انك كنت مشغول او مشتت التركيز لان المووضع لايحمل وجهة نظري بقدر ما يحمل عرض للردود الفعل والجدل الذي دار حول تصريحات الوزير<br />ولكن لي عندك سؤوال هل مجرلاد عرضي لكلام الكاتبة اقبال بركة وعدم تسميتها السفرة هو الذي يدخلني النار ويعرضني لغضب الله ؟<br />وهل الحرية من وجهة نظرك ان نطلق الاحكام على الناس ونحاسبهم ونسميهم بالسافرة والكافرة وغيرها من المسميات؟؟"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085620/http://masr.20at.com:80/article.php?sid=1182"

[[comments]]
order = 10
subject = "استكمال موضوع الحصبة الليبراليزمية بتاعة سي فاروق"
author = "إبن بهية"
posted = "2006-11-20"
text = "ما رأيكم يا كرام أن نكمل موضوعنا عن الليبراليزم الموله بها سي فاروق أبو خازوق .. وبسببها وعشقها تلاقي الليبراليين عمال يخبطوا تخبيط في أهلهم اللي هو إحنا ودي مصيبة عبيطة مش عارفين يبطلوها ولا يغيروها وهي صدامهم الدائم مع ثوابت الوطن التي تقدس العفة (مسلمين وغير مسلمين .. يعني ما أتصورش صديقي الحبيب الدكتور حشمت المسيحي ممكن يسمح لكائن من كان بالمساس بعرضه .. والله كان يدبحه وأنا واثق من كده لأننا شبه عايشين مع بعض وعراف بيتهم كويس) المهم الليبراليين ومنهم طبعا العلمانيين مش قادرين يتخلصوا مما لديهم من إشكالات عويصة أهمها موالاتهم الكاملة تقريبا للغرب وولههم به إلى أبعد مدى ولا يفرقون بين كونهم من هنا مش من هناك وأن هنا مسلوب ومنهوب ومطارد ومستعمر من هناك .. تيجي تحبلي هناك (الغرب) وهم عاملين فينا كل ده ؟؟؟<br />لأ اسمحلي انته حمار أو عميل ، وعميل هنا يعني مش فاتحلك جهاز لاسلكي وعمال تعد العساكر اللي ماشيين وتبلغهم .. العمالة تطورت أوي . يعني لما تعملك مركز زي ابن خلدون وكل يومين يفقعلك تقرير على مراكز أبحاث البيت الأسود المسماه للتمويه منظمات الحرنكش ومش عارف إيه تبقى عميل حتى ولو كان معاك ألف حق ومبارك الواطي يستحق الحرق .. لكن ده ما يعطيكش الحق أبدا تتلصص على أولاد بلدك باسم حرية الإنسان وحقوق الحيوان وتعطيهم معلومات تساعدهم على اختراق الوطن .. هييجي اللي يقولك اختراق إيه وهو فيه حاجة مستخبية ؟؟؟ طبعا يا اسطى .. هم لو عارفين يحصلوا على المعلومات دي لوحدهم من غير ما يمولوا مراكز إبن خلدون دي وغيرها ما كانوش دفعوا قرش لأي منظمة أو مكتب أو كشك حقوق الإنسان والفراخ اللي عندنا .. المهم زي ما هم قالوا وكرروا مليون مرة يا تكون معانا أو علينا .. بشبوش الأهبل قالها ألف مرة يا تكون معا<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085620/http://masr.20at.com:80/article.php?sid=1182"

[[comments]]
order = 11
subject = "كلمة أخيرة ..."
author = "إبن بهية"
posted = "2006-11-20"
text = "كلمة أخيرة بس للناس اللي بتقول إنه من حقه يعبر عن رأيه .. الكلام ده حلو وجميل لو كان في بيتهم مش بيشغل منصب وزير في بلدنا يا كتكت .. يعني لما تتكلم بصفتك الشخصية وانته في بيتكم شيء ولما تكون شاغل منصب عام ووزاري كمان شيء آخر يا أفندية .. كما وضحنا قبل كده تناقضه في موضوع حرية التعبير .. يعني هو حر يبعبر براحته ومراته لو كان متجوز ممنوع عليها كذا وكذا زي ما هو قال ؟؟؟ مش ده تناقض ولا إيه ؟؟؟<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085620/http://masr.20at.com:80/article.php?sid=1182"

[[comments]]
order = 12
subject = "مع ابن بهيه و الموضوع جميل يا دعاء"
author = "نيفين نيفى نوفا"
posted = "2006-11-20"
text = "اولا عايزه اقول ان الموضوع جميل يا دعاء ووجهه نظرك وصلت تمام<br />و انا حبيت اقول انى بايد ابن بهيه لان الراجل دا مش مواطن عادى علشان يتكلم و ميحملش كلامه صدى لدى الناس دا (للاسف)وزير وزوزير الثقافه كمان<br />اما تعليقى عن الحكايه كلها فهو فى موضوع يا بخت الفنان اللى الوزير منصبه<br />لو تحبى تقريه يا دعاء"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085620/http://masr.20at.com:80/article.php?sid=1182"

