[[comments]]
order = 16
subject = "تعطوه اكثر من حجمه الطبيعى بعيدا عن النفخ"
author = "عبد المنعم المصرى مقيم بالمهجر والحمد لله"
posted = "2006-11-20"
text = "لم انزعج كثيرا ولم انفعل لتصريحات الو زير الفتان فاروق معرفش باقى اسمه ممكن تسالوا اللى مشغلينه عندهم وبيدفعولوا الحساب ؟<br />يقول المثل اذا كان رب البيت بالدف ضاربا فشيمة اهل البيت كلهم الرقص .. والان اتضح بما لا يقبل اى مجال للشك عمالة النظام باكمله ويعنى يطلع ايه الو زير الفتان ؟؟ لما رئيسه فى جلسة افتتاح مجلس اللاشعب ولا شورى قال كلمة لا يمارسها سمعته يقول بمدى اخلاصه للوطن مادام فى صدره قلب ينبض وانه يمتلك رئتين يتنفس بهما او ما معناه هذا فتعجبت من اين له هذا القلب والرعية التى يتحكم فيها تتضور جوعا ؟؟ ثم يقول كلمة ولا يفعلها وهى انه صاحب قراره وانه لا ينحنى لغير الله فمن اين له معرفة بالله ؟؟ انا اشاهده عندما يتوجه للصلاة فى المناسبات وارى انه لا يعرف كيف يجلس او يركع او يسجد كما تعلمنا واتحداه ان يقول ماذا يعرف عن الله وعدالته ورحمته ليعمى بصره وبصيرته عن مصالح من ولدتهم امهاتهم احرارا فاستعبدهم بحاشيته وبجمع الافاقين خلفه .. وعجبت انه يتحدث عن الدين وعن الله وعن الارادة الحرة ولم يذكر ما ذكره الو زير الفتان فاروق مش عارف ايه .. وبكل بجاحة يطالب فتياتنا واخواتنا بنزع الحجاب ومن يدرى ماذا سيفعل بعد ذلك ؟؟ ربما يطالب بنزع الثياب عشان يورينا اننا متقدمون جدا وسباقون للفضيلة على طريقته .. ومالنا ومال امه ان كانت راحت الجامعة من غير حجاب او من غير ثياب دى مشكلته هو وبلاش يقرفونا بافكارهم الهدامة اللى اخرتنا من يوم ما قلنا انت وبس اللى رءيسنا ومعاك عصابة تحرسنا<br />.. سيبكم من هذا الو زير واختاروا بينكم وبين بعض اى زير غيره مش مهم يعترف بيه رءيسكم بس بلاش ان هذا الو زير ياخد اكتر من حجمه لان عمره الافتراضى انتهى متل<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085620/http://masr.20at.com:80/article.php?sid=1182"

[[comments]]
order = 17
subject = "شعرك ياحسنى بيجنن"
author = "حسنى الصح"
posted = "2006-11-20"
text = "الحجاب ما تعرفوش ونعذرك<br />لانك وزير فى عصور التخلف<br />ولا بذمتك احلامك اقصى حد توقف عنده ؟؟؟؟؟؟؟؟ههههههههه<br />عرفتها يافنان<br />ممكن احلامك تصغر وتتوقع تاخذ نوبل<br />مثل الوسيم الى زيك نجيب محفوظ<br />لكن لا تحلم يا هوسنى فاروك تكون مثل<br />احمد زويل...بعد الثرا عن الثريا<br />على شنبك ياحسنى<br />تحياتى لشنبك.....ياشنبو<br />الله يرحم الفنان قؤاد المهندس"
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085620/http://masr.20at.com:80/article.php?sid=1182"

