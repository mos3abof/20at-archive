[[comments]]
order = 19
subject = "إلي الأستاذة دعاء الشامي"
author = "عماد أبو عز"
posted = "2006-11-21"
text = "بسم الله الرحمن الرحيم<br />أستاذة دعاء . . احترامى لك رغم سخريتك الواضحة من كلامى<br />أرجو مراجعة ما كتبته . . فقد قلت إنك قدمت للموضوع لطريقة توحى بالتأييد ، و قصدى بهذا أن رأس الموضوع التى جذبتنا لقراءته كانت من كلام السافرة فتحية العسال دون ذكر المصدر ، ثم علمنا م الموضوع نفسه أنه ليس رأيك بل رأيها . . أنظري رأس الموضوع \"فاروق حسني رأي ولا تصريح!<br />أخيرا ظهر شخص لديه الشجاعة الكافية لمواجهة التخلف في المجتمع المصري، أن وزير الثقافة محق تماما في وصفه للحجاب بأنه عودة للوراء فهو ردة للجاهلية \"<br />يالله عليك ماذا يوحى لمن يقرأه . . سأترك لك الإجابة .<br />أما أن تصفينها بالسافرة . . فأنت حرة فى ذلك أماأنا فأصفها و أصف كل من علي شاكلتها بالسفور و أنا أيضا حر فى ذلك .<br />مرة أخري احترامى لك . . و أرجو ألا تقرأى كلامى بعصبية كالمرة الأولي بل الأجدى أن تركزى فيما تكتبين ."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085620/http://masr.20at.com:80/article.php?sid=1182"

