[[comments]]
order = 2
subject = "وائل عباس"
text = "المسلسل من الناحية الفنية ضعيف<br />فهو يعامل المشاهد على انه في الحضانة لسه وبيعلموه الف باء تاريخ وسياسة ودين من اول وجديد<br />ولكن انا ضد منع عرض المسلسل رضوخا لاي تهديدات<br />الى متى يفرض البعض وصايتهم على الشعوب المسلمة !!!<br />ومن الحلقات اللي شفتها اقول ان المسلسل تعرض بشكل محايد لموضوع افغانستان وان كان انحى باللائمة زيادة عن اللزوم على باكستان ... ولكن التبسيط الزائد عن حده للحوار والسرد لا يحترم ذكاء المشاهد ..."
archived = "2004-10-28"
capture_url = "https://web.archive.org/web/20041028171750/http://www.20at.com:80/article.php?sid=697"

[[comments]]
order = 3
subject = "رمانة رمضان كريم"
text = "و مين قال إن الحوار و السرد لازم يكون معقد و بيتعامل مع ناس أساسا فاهمين القضية الأفغانية؟؟؟!!، أنا شايفة إن بساطة الحوار أجمل حاجة في المسلسل، فهو سهل الفهم و مش لازم نتكلم في دين أو سياسة بطريقة متحذلقة، بساطة المسلسل ليست ضحلة و إنما تحمل ورائها أفكار عميقة أو على الأقل جيدة من مفهومي الشخصي، فالكاتب أراد أن يصل إلى الجمهور العادي اللي ممكن يكون لا ليه لا في الدين و لا في السياسة، و علشان كده كان المسلسل محتل حتى آخر حلقة مذاعة (أعلى نسبة مشاهدة) و مهما كانت الأسباب اللي منعت عرض المسلسل فليس لدينا إلا أن نقول.....حسبي و الله و نعم الوكيل في اللي في بالي."
archived = "2004-10-28"
capture_url = "https://web.archive.org/web/20041028171750/http://www.20at.com:80/article.php?sid=697"

[[comments]]
order = 4
subject = "الرجولة تعنى اسامة .."
text = "يكفى المسلسل فخرا انه تعرض لسيرة الشيخ القائد اسامة بن لادن بالخير بعد ان اصبحت سيرته ملطشة للى يسوى واللى ما يسواش ..<br />لقد شاهدت ثلاثة حلقات فقط واسمح لى يا استاذ وائل انت عايز ايه احترام اكتر من كده للمشاهد وللاعلام ورسالته..لأ اراهنك انك ماشفتش من المسلسل ولا مشهد !!<br />حوار سطحى ..بالمقارنة بايه ؟؟<br />طيب وضح اللى بيعجبك من حوار المسلسلات العميقة ..<br />نادية الجندى ولا فيفى عبده ..<br />هناك مبدأ ..لو كان المسلسل هايف ..ماكانوش وقفوه<br />مش عايزة نباهة يا رجالة .."
archived = "2004-10-28"
capture_url = "https://web.archive.org/web/20041028171750/http://www.20at.com:80/article.php?sid=697"

[[comments]]
order = 5
subject = "وائل عباس"
text = "يا عم يا بتاع الرجولة اسامة انت<br />ربنا يحرمنا من اسامة بتاعك ده قادر يا كريم<br />انت ليه تابع كده وغير مفكر وغير خلاق ؟؟؟<br />ما عندكشي تعليق تقوله على الموضوع خليك في حالك<br />مالك بتعليقات الناس بقى يا اخي !!!<br />حتى مانتاش فاهم التعليق اساسا وبترد<br />اللهم ارحنا من اسامة بن داجن بن لادين<br />وارحنا من المخدوعين بهبله<br />أمين"
archived = "2004-10-28"
capture_url = "https://web.archive.org/web/20041028171750/http://www.20at.com:80/article.php?sid=697"

[[comments]]
order = 6
subject = "حب الارهاب"
text = "العجيب في كل الاعمال التي تتعرض للأسلامين و تصفهم بالأرهاب تتنتهي الي حب المشاهد لهذا الارهابي أنظر فيلم الأرهابي لعادل امام طول الفلم أحنا مع عادل امام و بنحبه و يبدو أن هذا سبب مهم يجعلهم يتعاونو علي منع الطريق الي كابول حتي لا تنفتح عليهم طرق أخري ثم أن العمل يمس بشدة جهات و شخصيات و جروح و أزمات لم تزل قائمه و أحداث متشابكة لم تنتهى بعد -<br />سامي عفصه"
archived = "2004-10-28"
capture_url = "https://web.archive.org/web/20041028171750/http://www.20at.com:80/article.php?sid=697"

[[comments]]
order = 7
subject = "عباس وائل"
text = "اخ وائل يحموك فى كانكة<br />وبالش تكلم على واحد لو ضربوك فى مية مش هتجيب<br />نصه<br />على الاقل هو ساعد فى تخريج الروس من افغانستان<br />بتمويل خارجى<br />اتشطر انت بتحريج الصراصير من مطبخ بيتكو حتى لو<br />بتمويل من الامم المتحدة وماما امريكا<br />والسلام ختام وسلملى على المترو"
archived = "2004-10-28"
capture_url = "https://web.archive.org/web/20041028171750/http://www.20at.com:80/article.php?sid=697"

[[comments]]
order = 8
subject = "وائل عباس"
text = "اسامة بن داجن<br />خرج الروس من افغانستان<br />هاهاها<br />ودخل بدالهم الامريكان<br />اسامة بن لا دين<br />خرج الروس من افغانستان<br />ودخل الامريكان افغانستان والعراق<br />واليهود غزة<br />وخلى اليهود ضربوا دمشق<br />والقذافي عاوز يعمل اسراطين<br />الى الامام يابن ال ... لادن ..."
archived = "2004-10-28"
capture_url = "https://web.archive.org/web/20041028171750/http://www.20at.com:80/article.php?sid=697"

[[comments]]
order = 9
subject = "الحدق"
text = "ياوائل عباس اخ منك ..بس لو تقلب اسمك<br />انت زى الى قال فية الشاعر..<br />عباس وراء المتراس،<br />يقظ منتبه حساس،<br />منذ سنين الفتح يلمع سيفه،<br />ويلمع شاربه أيضا، منتظرا محتضنا دفه،<br />بلع السارق ضفة،<br />قلب عباس القرطاس،<br />ضرب الأخماس بأسداس،<br />(بقيت ضفة)<br />لملم عباس ذخيرته والمتراس،<br />ومضى يصقل سيفه،<br />عبر اللص إليه، وحل ببيته،<br />(أصبح ضيفه)<br />قدم عباس له القهوة، ومضى يصقل سيفه؛<br />صرخت زوجة عباس\" :أبناؤك قتلى، عباس،<br />ضيفك راودني، عباس،<br />قم أنقذني يا عباس\"،<br />عباس - اليقظ الحساس - منتبه لم يسمع شيئا،<br />(زوجته تغتاب الناس)<br />صرخت زوجته \" :عباس، الضيف سيسرق نعجتنا\"،<br />قلب عباس القرطاس، ضرب الأخماس بأسداس،<br />أرسل برقية تهديد،<br />فلمن تصقل سيفك يا عباس؟<br />(لوقت الشدة)<br />.إذن، اصقل سيفك يا عباس!!"
archived = "2004-10-28"
capture_url = "https://web.archive.org/web/20041028171750/http://www.20at.com:80/article.php?sid=697"

[[comments]]
order = 10
subject = "وائل عباس"
text = "للاسف يا جماعة كنت فاكر الشياطين بتتسلسل في رمضان<br />لكن طلعت فعلا بتتسلسل<br />اما ابن ادم ونفسه الامارة بالسوء على اخوه ...<br />فدي للاسف مين يسلسلها ؟؟؟<br />لا حول ولا قوة الا بالله ...<br />اللهم اني صائم"
archived = "2004-10-28"
capture_url = "https://web.archive.org/web/20041028171750/http://www.20at.com:80/article.php?sid=697"

[[comments]]
order = 11
subject = "الحدق"
text = "الى الاخ وائل ..والله العضيم انا مصدق انك مش انت الى كتبت المقال عن المامااعتماد(ولاتزعل ياشيخ)<br />بس ده مش موضوعنا<br />وبعدين القصيده الى انا بعتها انا بعتهاالى كل متخاذل و لكل من يتكلم عن الابطال والاشراف بالباطل.<br />ومش عارف ان كنت انت منهم والا لا<br />سلام الى كل المجاهدين الابطال فى كل الديار."
archived = "2004-10-28"
capture_url = "https://web.archive.org/web/20041028171750/http://www.20at.com:80/article.php?sid=697"

