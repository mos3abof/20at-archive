author = "العارف والمتاكد"
posted = "2009-02-21"
text = "ان من عارضك على طرحك السوال<br />كان يريد ان يرسل اشاره لك بانه طاهر وشريف وراجل<br />لكن اقطع يدي ان ما كانت لهذا النوع تجربه سابقه في الكابريهات<br />هذا الكلام من تجربه بما ان مجتمعنا يحب يظهر الفرد نفسه انه ولا فيه زيه"
archived = "2009-08-11"
