[[comments]]
order = 1
subject = "طعام الفقير و حلوى الغنى...."
author = "نيفين نيفى نوفا"
posted = "2006-10-12"
text = "الموضوع بيفكرنى بالبيت الشهير عن التمر<br />طعام الفقير و حلوى الغنى و زاد المسافر و المغترب<br />مش عارفه البيت لمين متهيألى شوقى<br />عموما الموضوع كالعاده جميل يا عجم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113013/http://www.20at.com/article2.php?sid=1345"

