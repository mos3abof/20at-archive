[[comments]]
order = 5
subject = "بيرو"
text = "مره واحد أمريكي نزل القاهره وركب تاكسي<br />كانت فيه اشارة حمراء وقطعها سائق التاكسي بعد خروجه من المطار<br />... قال له الإمريكي هيه انتبه انت مجنون اشارة حمراء وتقطعها<br />قال له سائق التاكسي ... ماتخافشي ياخواجه انا بروفيشينال - حريف -<br />الإشارة الثانية كانت حمراء وقطعها صاحب التاكسي<br />قال الإمريكي ... اكيد انت مجنون ماتخاف على نفسك وعلى اللي معاك<br />قال له سائق التاكسي ماتخافشي ياخواجه... انا بروفيشينال<br />الإشارة الثالثة كانت خضراء<br />وقف صاحب التاكسي عند الإشارة<br />اتجنن الإمريكي من هذا التصرف<br />وقال الإمريكي ... اكيد انت مجنون كيف إشارة خضراء وانت واقف<br />قال له صاحب التاكسي ... متبقاش مجنون ياخواجه<br />يمكن حد بروفيشنال جاي من هنا وإلا هنا!!!!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033857/http://www.20at.com:80/article.php?sid=522"

[[comments]]
order = 6
subject = "مصـ( الخير )ـعب"
text = "في البداية أنا قررت ماكتبش تعليق<br />اول مالموضوع نزل أصله في الـ\"عجلة\" الندامة<br />بس دلوقتي يا \"ياسمين\" بهنيكي المقال حلو<br />, و أنا من زمان بـ\"لف\" في المواقع<br />و بـ\"دوّر\" على موضوع \"متين\" زي ده<br />بس لقيت كل الكتاب التانيين \"سايقين\" العوج<br />و معظمهم بيكتب من غير\"ترخيص\"<br />و بصورة \"مخالفة\" لعادات وتقاليد المجتمع ...<br />لدرجة إني فكرت أجيب كاتب<br />أديله \"أجرة\" ويكتب مقال حلو<br />و لو عجبني أوي كنت هاديله \"بقشيش\" كمان<br />لكن في خلال \"رحلـ\"ـتي عبر الانترنت<br />تصادف \"المرور\" على هذا المقال<br />فعجبني جدا<br />وأنا في \"انتظار\" المزيد<br />من موقعنا عشرينات<br />ترقبوا البيان التأسيسي للحلف الالكتروني الفظيع!!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033857/http://www.20at.com:80/article.php?sid=522"

