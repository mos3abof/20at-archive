subject = "من هو ليفي زفت؟ أشك"
author = "شهيد"
posted = "2006-09-06"
text = "اخواني أنا أصلا اشك في من يكتب باسم (ليفي مع الزير) لو دققتم القراءة فهو يكتب بالعامية المصرية حتى النخاع بالضافة أنه يستعين ببعض الامثال الشعبية المصرية تماما و كما نعلم أن حتى الاسرائيلين عندما يكتبون العربية تطغى عليها اللكنه الشامية فنرجو التحقق قبل أن ننساق وراء شخص عبيط في جدل بلا جدوى و ان كان فعلا اسرائيلي أود ان اقول له من كل قلبي طظ فيك يالفي انت و كل ليفي"
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914183154/http://masr.20at.com:80/article.php?sid=886"

