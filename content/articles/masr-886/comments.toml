posted = "2006-09-05"
text = "ايه يا ليفى يا عرس احنا هنتريق ولا شمتان احنا باين علينا كده فعلا مش بنعرف نسوق قطارات بس نعرف نسؤكم زى الخرفان قدامنه وبعدين انت بتتكلم من البيت ولا لسه فى الخندق وبعدين كده هنزعل ونضطر ننزلكم الخنادق تانى الله يجازيه خير الشيخ حسن نصر الله كان مخليكم زى الفئران المره الجايه مش هيكون نصر الله وبس هيكون مسلمين كتير معاه ودول كتير معاه وساعتها مش هتلاقى اساسا خندق تنزل فيه وبعدين حاسب بقا علشان انا شايف صاروخ جاى من بعيد"
