[[comments]]
order = 5
subject = "الى مبارك"
author = "الى نظيف"
posted = "2006-09-05"
text = "إحترامي للحرامي!!<br />عبدالرحمن بن مساعد<br />إحترامي .. للحرامي ii!!<br />صاحب المجد العصامي ..<br />صبر مع حنكة وحيطة ..<br />وابتدا بسرقة بسيطة ..<br />وبعدها سرقة بسيطة ii..<br />وبعدها تَعدى محيطه ..<br />وصار في الصف الأمامي .. !<br />احترامي .. للحرامي .. ii!!<br />احترامي .. للحرامي ..<br />صاحب المجد العصامي ..<br />صاحب النفس العفيفة ii..<br />صاحب اليد النظيفة ..<br />جاب هالثروة المخيفة ii..<br />من معاشه في الوظيفة ii..<br />وصار في الصف الأمامي ..<br />احترامي .. للحرامي .. ii!!<br />احترامي .. للحرامي ..<br />صاحب المجد العصامي..<br />يولي تطبيق النظام ..<br />أولوية واهتمام ..<br />ما يقرب للحرام ii..<br />إلا في جنح الظلام ..<br />صار في الصف iiالأمامي<br />احترامي .. للحرامي .. ii!!<br />احترامي .. للحرامي ..<br />صاحب المجد العصامي ..<br />يسرق بهمة دؤوبة ..<br />يكدح ويملي جيوبه ii..<br />يعرق ويرجي المثوبة ..<br />ما يخاف من العقوبة ii..<br />صار في الصف الأمامي ii..<br />احترامي .. للحرامي .. ii!!<br />احترامي .. للحرامي ..<br />صاحب المجد العصامي ..<br />صار يحكي في الفضا ii..<br />عن نزاهة ما مضى ..<br />وكيف آمن بالقضا ..<br />وغير حقه ما ارتضى ..<br />صار في الصف الأمامي ii..<br />احترامي .. للحرامي ..<br />احترامي للنكوص ..<br />عن قوانين ونصوص ii..<br />احترامي للفساد ii..<br />وأكل أموال العباد ii..<br />والجشع والازدياد ii..<br />والتحول في البلاد ..<br />من عمومي للخصوص ..<br />احترامي للصوص .."
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914183154/http://masr.20at.com:80/article.php?sid=886"

[[comments]]
order = 6
subject = "اقتراح من تل ابيب"
author = "ليفى معازيير"
posted = "2006-09-05"
text = "اقترح ان تجيبوا سواقين للقطارت من بنغلاديش او الهند بعد ثبوت عدم قدرة الشعب المصرى على سواقة القطارات ومش عيب ان مصر تستعين بخبرات البنغلاديشين والهنود حفاظا على ارواح الشعب وبعدين ايه حكايتكم مع السواقه .. مصرى يسوق باخره يحرقها ومصرى يسوق معدايه يغرقها ومصرى يسوق اتوبيس يرميه بالترعه بالناس اللى فيه .. ومصرى يسوق طياره يرميها بالمحيط .. انا اقترح بما انكم شعب لايعرف يسوق المواصلات الحديثه انكم تمشوا على رجليكم اهو منها رياضه ومنها ترحموا البشر من الهلاك ..مع انى خايف انكم لما تمشوا تخبطوا ابعض لانكم شعب ماشى عالبركه!!!!"
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914183154/http://masr.20at.com:80/article.php?sid=886"

