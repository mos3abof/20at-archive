subject = "من القائد"
author = "من القائد"
posted = "2006-09-05"
text = "علشان خاطر نعرف معنى القيادة يا جماعة لازم ندرس حال الجزيرة العربية قبل الاسلام وحال الجزيرة العربية بعد الاسلام وكيف استطاع النبي محمد صلى الله عليه وسلم يقود شعب الجزيرة العربية ويحولهم من مجموعة من قطاع الطرق لا ماضي لهم ولا حاضر ولا مستقبل الى خير امة اخرجت للناس وفي اقل من مائة سنه كانت هذه الامة تحكم من اسبانيا الى الهند.<br />فلازم حكام المسلمين الان يتعلموا فن القيادة من النبي محمد صلى الله عليه وسلم"
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914183154/http://masr.20at.com:80/article.php?sid=886"

