[[comments]]
order = 8
subject = "الموسومون على آعناقهم لا يبنون حضارات"
author = "زنوبه"
posted = "2006-09-05"
text = "السلام على من إتبع الهدى<br />كويس إنك تكتب بإسمك الحقيقى يا ليفى<br />بداية : آحتاج منك إلى دليل واضح وقوى آنكم آرقى وآعرق شعوب العالم؟!! (تابع لمقالتك فى موضوع الحنش)<br />المثبت تاريخيا منذ الخروج وطردكم من مصر آنكم فئه مشتته ومنبوذه من كل آجناس الارض<br />حتى آن الاسكندر الاكبر كان يعتبركم طابور خامس وكان يستبعدكم من الاختلاط بالمصريين فجعل مسكنكم بجوار منطقة الزباله بالاسكندريه الى آن قام \"آرقى\" آجناس الارض كما تدعون على آنفسكم بخيانة الاسكندر الاكبر والتآمر ضده مع بطليموس الخامس<br />مشهور عن اليهود آنهم \"العمش\" كما كانو ينادون فى الاوساط الشعبيه آيان وجودهم فى مصر<br />فى عهد الفراعنه كام العمش موسومون على قفاهم ـ يعنى الفراعنه كانو يختمون قفاهم يختم مثل المواشى حنى لا يختلطوا بباقى المصريين فتصبح لديهم علامه يستحيل إزالتها الا بإزالة القفا آى قطع الرقبه, سؤالى هنا من آين آتيت بملهاة آنكم شاركتمونا بناء الحضارة المصريه فى حين آن آجدادك كان مختوم على قفاهم<br />(إقراء الطبعه الفرنسيه :رمسيس الثالث قاهر جيوش البحر<br />الاسكندريه ملكة الحضارات<br />هذه الكتب شارك بها آكبر علماء المصريات فى العالم)<br />ليفى ، يبدوا آنك تستقى معلوماتك من مجلة ميكى الطبعه العبريه<br />باالمناسبه إنت عندك كام سنه<br />بمناسبة الازاحه من السلطة بعد الحرب<br />متى ستزيحون آلمرت وحالوتس من السلطه<br />وإيه يا راجل حكاية الفضيحه الجنسيه اللى عندكم دى الحكايه ماليه الدنيا، لكن قوللى يعنى إيه حالوتس آرجو آنه ما يكونش المعنى اللى فى بالى آصل الشق الاول من الاسم بيفكرنى ب لا مؤاخذه الحلوف"
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914183154/http://masr.20at.com:80/article.php?sid=886"

