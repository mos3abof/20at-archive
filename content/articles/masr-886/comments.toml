posted = "2006-09-05"
text = "هى دى اخلاقكم ياعرب واحد يشتم امى والتانى عايز يضربنا بالجزمه وكله كوم واللى يتباهى بحسن نصر الله .. فكرتونى بالقرعه اللى تتباهى بشعر بنت عمتها..حسن مين ياعم دحنا طربقناها على دماغه وخليناه يهرب من الجنوب ومحيناه من الوجود وعلمناه درس بالعسكريه الصحيحه واخر كلمه قالها انه لو كان يعرف بللى حيحصل له مادخل الحرب..."
