text = "والله الواحد مش عارف يقول ايه بس هو اهمال اكيد والبنى ادم عندنا فى بلدنا مالوش ثمن وحياته رخيصه خاصا لما يكون من اهل مصر الغلابه وما يكونش من بشواتها يعنى من الناس اللى تركب العبارات والقطار و....الخ الناس دى اكيدحياتها رخيصه للدرجه دى ليه مش عارف حسبنا الله ونعم الوكيل ..حسبنا الله ونعم الوكيل"
