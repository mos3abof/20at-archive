[[comments]]
order = 1
subject = "متفكرونيش يا عشرينات"
author = "نيفين نيفى نوفا"
posted = "2006-08-10"
text = "مش هسمعه تانى<br />سمعته ف القاهره اليوم و بكيت بما فيه الكفايه و يا ريتنى ما كنت سمعته<br />فعلا انك<br />تقرا عن موت حد غير ما تسمع صوت استغاثته و هو بيموت<br />و تصرف القبطان غير مبرر بالمره ..ليه عمنل كدا<br />اعتقد ان الراجل دا كان متلقى اوامر من حد اعلى منه<br />ربما انا مش عايزه اقول عليه حاجه لانه و رغم كل اللى حصل ف ذمه الله<br />الله اعلم<br />اللى غاظنى اكتر ان ساعتها كان مع عمرو اديب ف الاسستوديوممدوح اسماعيل و ابنه و متاثروش بالمره و رفضو حتى يعترفو بالاهمال مش قتل 1033 شخص<br />حسبنا الله و نعم الوكيل بعدد كل من قتل ف العباره"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050453/http://masr.20at.com:80/article.php?sid=783"

