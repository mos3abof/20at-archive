[[comments]]
order = 5
subject = "ويا ليتنا نتعلم من اخطائنا"
author = "الباشا مصري"
posted = "2006-08-13"
text = "وللمرة المليون يتركون ممدوح اسماعيل يعبث بأمن وسلامة المواطن المصري فقد عادت العبارة «سارة ٣» التابعة لشركة السلام للملاحة، إلي ميناء سفاجا ظهر أمس، وعلي متنها ٨٥٥ راكباً و٧ سيارات، بعد سماح السلطات البحرية السعودية بميناء ضبا للعبارة بالمغادرة، إثر الاطمئنان علي سلامتها بعد نشوب حريق بها قبيل مغادرتها الميناء .<br />حيث أن حريق شب بمركبة بإحدي غرف العبارة، نتيجة عقب سيجارة تركه أحد الركاب، ولكن تمكن طاقم السفينة من السيطرة علي الحريق، بينما استدعت السلطات السعودية سيارات الإطفاء.<br />يذكر أن العبارة «سارة ٣» هي ذاتها العبارة «سانت كاترين»، إذ قامت شركة السلام للملاحة بتغيير اسمها في أعقاب غرق العبارة «السلام ٩٨».<br />وما بعد ،،،،،،،،،،،،"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050453/http://masr.20at.com:80/article.php?sid=783"

