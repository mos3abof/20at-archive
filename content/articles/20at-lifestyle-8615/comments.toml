posted = "2008-05-21"
text = "بكل صدق…لقد كانت قناة طيور الجنة مشروع مفتقد …والان هي صرعة باذن المولى لن يأتي يوم تنتهي فيه هذه الصرعة..<br />كما أن القناة هادفة بطريقة ذكية جدا…فنحن الكبار يمضي الوقت بنا دونما ملل ومن غير أن نشعر به…فما بالكم بصغار؟؟؟؟<br />وأخيرا أشكر جميع العاملين بالقناة وأتمنى لهم دوام التقدم…كما اسمحوا لي أن أوجه أنقى وأرقى باقات الورد والياسمين الى حبيبتي وصديقتي وزهرة حياتي…الى أجمل ما أنبتت الأرض…تسنيم مخيمر…"
