text = "الى كل العاملين في قناة طيور الجنة الأعزاء تحية طيبة ،<br />هناك قاعدة معروفة لدى الجميع (مشوار الألف ميل يبدأ بخطوة) وهاأنتم بدأتم بشيئ رائع وكبير رغم كل الصعوبات والتحديات التي واجهتموها في بداية هذا الطريق فأنه انجاز رائع للغاية بأن نربي ابناءنا على القيم والأخلاق الحميدة منذ نعومة أظفارهم بأسلوب راقي ومميز"
