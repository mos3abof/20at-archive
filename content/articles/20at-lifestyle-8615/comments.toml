text = "ممكن احكي للاخت اميمه انوا انت لما تحكي انك بتحبي الكنترول مش<br />هدا الاشي راح تحاسبي عليه امام الله<br />كيف سوف تقفين امام الله وانت تقولي انك تحبين الكنترول<br />اختي الغاليه انا احبك وارجوك ان تفكري بالذي قلته لكي لان هذا الشيئ يغضب الله جل جلاله<br />جمعني الله واياك في الجنه ان شاء الله تعالى<br />اختكم في الله عاشقه الجنه من الاردن"
