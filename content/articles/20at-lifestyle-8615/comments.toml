text = "يا سلام عليكم..والله قناة واااااااايد حلوة…لفت نظري تميز فريق العمل كله شباب بالعشرين عمر نبيل ومجاهد هشام وسعد وربيع واللي فاجأني اكثر تسنيم مخيمر<br />فعلا بنت رائعة قدرت تتجاوز كل صعوبات العمل والدراسة وكونها صبية صغيرة بالعمر …نصيحتها بمحلها يا ريت نقدر نشوفها عالقناة..<br />كنترول كيف بقدر اتواصل معها؟؟"
