subject = "كسب الدنيا وخسر الاخرة"
author = "ابو سمية"
posted = "2006-12-25"
text = "لان هذه المناصب ليست بالانتخاب ولايراعي فيها اختيار الانسب او الاصلح وانما يراعي فيهاالولاء المطلق للاسرة المالكة والطاعة العمياء للظالمين فمن الطبيعي ان تجد علي راس المؤسسات الدينية لاسيما الاسلامية امثال الطيب وزقزوق وطنطاوي حتي يرضوا امريكاواسرائيل حتي وان كان ذلك في غضب الله"
archived = "2007-01-28"
