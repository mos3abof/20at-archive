[[comments]]
order = 25
subject = "احنا جيل تعبان"
author = "المواطن المطحون"
posted = "2006-12-22"
text = "نجحت الحكومة بتقدير امتياز مع مرتبة القرف في الهاء الشعب بمواضيع هايفة لكي يتسني لهم القضاء علي الشعب في غفله منه, فمن موضوع انفلونزا الطيور الي كاس الامم الافريقية الي قضية الحجاب الي قضية ملابس الاخوان واخيرا التوربيني وغيرها من القضايا التي ياتي وضعها وتضخيمها لكي يلهي الشعب فيها وتترك قضايا اخطيرة مثل تعديل الدستور والقضايا الاقتصادية من غلاء مستمر وبطالة متصاعدة وامراض تفتك بالشعب والمتسبب فيها طبعا قتلة الحزن الوطني الواطي, يا جماعة حرام عليكم الكلام في المواضيع غير الهادفة, ليه ما فيش حد جاب سيرة قانون الوظيفة العامة الذي يضعه الان جهابزة الحزن الوطني وطبعا وزير التنمية الادارية احمد درويش (عدو الشباب) , ويهدف هذا القانون الي تصفية موظفي الدولة والاستغناء عن المتعاقدين الحاليين, واخراج الموظفيين الدائميين بالحكومة عن طريق المعاش المبكر, نعم هذا هو فكر دولة الحزن الوطني الواطي الجديد.<br />ولم يجيب احد سيرة قانون التامينات الجديد الذي يطبخ الان بواسطة حرامية الفكر الجديد بالحزن الوطني الواطي وعلي راسهم سارق المعاشات بطرس غالي , ويهدف القانون الجديد الي عدم توريث المعاش بعد وفاة صاحبه, اما من يدخل في الوظائف من الشباب الان فلا معاش له , شوفتوا الفكر الجديد, لقد تظاهر الشباب في فرنسا في سنة 2005 ضد قانون العمل لانه كان ضد مصلحتهم ونجحوا , اماانتم يا شباب فمشغلون بقضية الحجاب الشرعي وغير الشرعي وهل يجوز او لا يجوز وبملابس الاخوان وللاسف نجح النظام في الهاء الشعب."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

[[comments]]
order = 26
subject = "واأسفاه على زمن مضى"
author = "3 طب بشرى جامعة الازهر"
posted = "2006-12-22"
text = "اتساءل ..........<br />اين كان ضميرك اذن عندما حرم الطلية من حقهم فى انتخابات اتحاد الطلبة ؟ اين كان لسانك ؟<br />هل يستحق ان يكون رئيسا لجامعة ذلك الذى يرى ابناءه - او كما يدعى - يراهم يسحبون _ وهم طلبة العلم_ يسحبون للأعتقال والقمع ؟<br />هلى لا تستطيع جاااااااامعة بكل كوادرها ان تحل ازمة طلبة مسالمين بعيدا عن امن الدولة ؟<br />هل قدمتم لهم بديل ؟ هل اشركتموهم فى اى نشاط ؟ هل هل هل \" قبل امن الدولة والتدخل القمعى \" ؟<br />عن ماذا اتساءل ؟ احكى لكم موقفا رايتة امام عينى كنت مشاركا فى اسبوع شباب الجامعات منذ عامين بجامعة المنصورة وكان حفل الافتتاح باول يوم فى استاد الجامعة ويحضره محمد حسنى مبارك وكان حفلا مشيدا والامن على ابواب الاستاد لاحصر له . كنت مازلت على الباب لم ادخل بعد ثم اتى احمد الطيب بجوارى يتقدم لدخول الاستاد وما ان راه الامن الواقف على الاستاد حتى منعوه لماذا ؟ لأنة لا يرتدى الكارنيه الذى يعلق على الصدر الذى يسمى بألـ \" آى دى \" فظل صاحبنا يتكلم ولكن لم يبال به احد حتى سئم ومشى يبحث عن بوابة اخرى يستطيع الولوج منها .<br />ساعتها اسفت على زمن كان فيه رئيس جامعة الازهر بمثابة وزير وكانت جامعة الازهر حصنا لا يجرؤ احد ان يمسها بكلمة واحده<br />الان تدافعت عليها الصحف من كل اتجاه كالذئاب وكان الضحايا طلابا ساذجين والسبب هو رئيس فاشل _ باعترافه _ فشل فى حل المسالة وكذلك فشل فى الذب عن طلبة الجامعة التى هو رئيسا لها كما تقول الالقاب . باب الجامعة مفتوح على مصرعية ولن يرحب بك احد فيها بعد الان بعد ان اقتحم امن الدولة الجامعة ولم يعد يأمن طالبا فيها على نفسه وفى جامعته .<br />ورحم الله رؤساءا دافعو عن الازهر امثال جاد الحق واحمد عمر هاشم ومن سبقوهم ."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

[[comments]]
order = 27
subject = "الطيب...... لاطيب ولاحاجة ؟؟؟؟"
author = "امل ضائع"
posted = "2006-12-22"
text = "والله يا طيب انت مش طيب يا راجل حرام عليك<br />انت بتزيد الطين بله. بدل ما تشوف الخطاء فين وتصححه بتبيض نفسك اما الحكومة . يا عم راجع ضميرك يا عالم الدين يا استاذا.. يا دكتور<br />والله عيب تعمل العمله وبعدين تزيد النار بنزين .. شوف لو ان ابنك او اخوك من الشباب ده كنت حتقول ايه.<br />هو احنا ما تنعلمش الدروس الا على مستقبل شبابنا.. شوف الدول التانية بتعمل ايه للشباب يا راجل اتق الله .<br />يعنى تحرموا الشباب من حرية الراي فى الاول وبعدين حرمان من الامتحان واي حد يتكلم يضرب بالجزمة من الحكومة .. حكومة سكسونيا( وظائف عليا بالوزارة للبيع)<br />يا راجل انت عامل زي بيايع السكسونيا حتبدل مكان فى الجامعة بمكان احسن مع الحكومة بس البدل هناعلي حساب شبابنا خلي عندى(؟؟؟؟؟) والحدق يفهم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

