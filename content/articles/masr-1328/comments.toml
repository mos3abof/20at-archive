subject = "طلاب الآزهر ياحسرة عليهم"
author = "صلاح شنان"
posted = "2006-12-23"
text = "طلاب الازهر الذين ينتمون الى الاخوان المسلمين والتيار لاسلامى هم بحق شرف الازهر وهامته التى ينبغى ان يفخر بها لتفوقهم الواضح جدا ولفهم لدورهم ورسالتهم التى ينبغى ان يقوموا بها -ويحاول لمعينين من عمداء الكليات ورؤساء الجامعات والذين تم اختيارهم لهذه المناصب ليس لكفائتهم العلمية وانما لرضى الامن عنهممع ان فى جامعة الازهر من هم افضل منهم-يحاول هؤلاء تحجيم هذا الدور وتخريج جيلا من شباب الازهر جاهلا بكل مايدور حوله سلبيا لايبحث عن حقوقه ولا عن حقوق امته الضائعة ونحن نرى نماذج منهم فى المساجد والمعاهد لايحسنون حتى قراءة القرءان واللغة العربية لن نتحدث عنها لانهم لايتكلمون جملة واحدة صحيحة وهذه العلل موجودة فى كل مكان اما هؤلاء الطلاب الذين يصفهم رئيس الجامعة وشيخها المعينين فهم شرف الارهر وهامته التى بنبغى ان ترفع ويفخر بها اما الباقى فيا حسرة عليهم الا من رحم ربى"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

