[[comments]]
order = 11
subject = "رجل معتدل وشعب ارهابى"
author = "ايمن امام"
posted = "2006-12-20"
text = "رأى الرجل ياجماعه ينبع من فكره - هذا الرجل حصل على الدكتوراه فى باريس- وكان فى ضيافه عائله فرنسيه اقام عندهم مده خمس سنوات وحسب ما صرح به فور تعيينه مفتيا - ان هذه العائله كانت تراعى مشاعره الاسلاميه - فهو رجل معتدل وهؤلاء شباب منحرف رفع رايه العصيان للمدنيه والديمقراطيه - الملاحظ فى مصر انه دائما ما يعاقب المجنى عليه على رد فعله - اما اساس المظلمه فلا حديث ولاحل - والحمد لله ان مصر فى طليعه الدول التى تمكنت من نعيين مخبرين فى مناصب عليا - ولكن شاء الله ان يفضحهم - رب زله لسان تكشف مكنون القلب - اكيد دلوقتى حمدوف رزقوف مبسوط وفرحان - ياريت الست ايناس تعملنا فيلم عن الارهاب فى الازهر عشان نتنور ونفهم - واللى يكتب القصه المؤلف الكبير قوى فى الوزن بالكيلو جرامات الاستاذ اسامه انور عكاشه - ويشاركه فى تنقيح ( حلوه كلمه تنقيح دى) السيده / نوال السعداوى بتاعه مقوله الحج عاده وثنيه والرجاله لازم تبطل الختان لانه مخالف للطبيعه- وياريت الست اقبال بركه - تشارك فى تنقيح الماده العلميه لانها خبيره كبيره قوى فى تفسير القرأن - وممكن يستعينو بصديق - يعنى مثلا الاستاذ رفعت السعيد - والاستاذ صلاح عيسى والاستاذ / احمد عبد المعطى حجازى - والدكتور ابو زيد - اللى هولندا انقذته من الشعب المتخلف دا واهدت اليه الجنسيه الهولنديه - حمايه لفكره المتحرر من الشعب المتخلف - وياريت تجيبو لنا فتوى من اى سوبر ماركت انه يجب تغيير المناهج فى الازهر عشان التنوير زيدرسوا فى الازهر فن الباليه عشان /احمد عبد المعطى حجازى ما يزعلش وممكن مدام دينا بتاعت العنب - تكون البطله فى الفيلم- وتبينو انها تعرضت للتضليل نتيجه ضغوط اجتماعيه ادت بها الى لبس الحجاب مما سبب لها تخلف عقلى - ولكن الله اراد بمصر خيرا فعادت الى رشدها و<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

[[comments]]
order = 12
subject = "جاتك ستين نيله عليك وعلى اللي حطوك في الكرسي الواسع عليك أوي أوي"
author = "إبن بهيه"
posted = "2006-12-20"
text = "لو كانوا إرهابيين يبقى حضرتك واللي عينك في الموقع ده إيه بقى ؟؟؟ طيب يا طيب تعرف بعني إيه إرهاب ؟؟؟ أراهن بحياتي لو كنت تعرف يعني إيه إرهاب يا بطيخه قرعا انته يا بتاع الحكومه ..<br />لو فيك فايده أصلا .. ولا لك لازمه من الأساس وفيك الرجا ما كانش كل ده حصل من الأساس ولو هو استهبال وبس ؟؟؟<br />هو حضرتك فاكر نفسك رئيس جامعه بجد يا طيب ؟؟؟ طيب ممكن تقولنا يعني إيه رئيس جامعه ؟؟؟ وإيه هي مهامه بالضبط ؟؟؟<br />مش برضه حضرتك مجرد شرابة خرج بتنفذ اللي يأمروك بيه وبس ولا احنا غلطانين؟؟؟<br />لأ والواد عامل صعيدي ؟؟؟ جاتك ستين نيله عريت الصعايده .. ده لو كنت فعلاً صعيدي بجد ولك عيله من الأعراب أو الهواره ((عرب وهواره هم فقط أصل الصعايده كما نعلم)) وغيرهم مجرد طرش بحر جاي ما حدش يعرف قرعه أبوه منين<br />يعني لو مش عربي ولا هواره يبقى اطلع من الصعيد والصعدنه اللي انته متمسك بيها دي .. ويا ريت لو التعبان ده ليه أصل في الصعيد يعرفنا عليه ..<br />طبعا أنا مش ضد أي إنسان يكون من أي حته بس العجيب في الصعيد أنه لا وسطية .. يعني يا إما صعيدي بجد ويحمل صفات الصعايده الأصيله اللي كلنا عارفينها ودول عرب وهواره وبس .. يا إما من اللي كان أجدادهم بيدوروا في الصعيد يبيعوا عسليه وحاجات تانيه الصعايده عارفينها كويس .. أولها الشرف<br />يا ترى انته مين فيهم؟؟؟<br />مش ممكن تكون عرباوي أو هواري .. لأنهم كانوا اتبرأوا منك ..<br />طبعا كلامي هنا بعيد خالص عن الموضوع وهوز بسبب بعدهم هم أيضاً عن الموضوع وبدال ما يتكلم عن خيبته التقيله ووكسته في اللي حصل وكونه سايب الجامعه مستباحه لبلطجية الأمن راح يتهم أبناء الجامعه بالإرهاب .. وحتى لو كانوا كده فهي برضه غلطتك يا خفيف لأنك فاشل ومش عارف تعالج الأمر ده<br />وبعدك عن جوهر الموضو<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

[[comments]]
order = 13
subject = "وماذا تنتظرون ؟"
author = "ابو صياح"
posted = "2006-12-20"
text = "شيخ ذهب الى باريس عاصمة الفجور ليتعلم الاسلام- هل هذا يعقل ؟ هل اخطا فى البوصلة وبدلا من ان يذهب مكة شرقا حيث النبع الصافى للاسلام ذهب غربا وتفرج على البكينى وعاين فتيات الحى الاتينى وجال وصال فى بلاد الحرية<br />ثم عاد احدهم يشتم فى القران والشعر الجاهلى وقصص القران<br />ماذا دهانا ؟ هل اصبح عندنا عمى الوان ؟<br />ثم لماذا هؤلاء خريجى اسلام باريس يتولون المناصب الدينية ؟<br />ياازهر ياالذى كنت شريفا رحماك رحماك<br />اللهم لا نسالك رد القضاء ولكن نسالك اللطف فية"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

