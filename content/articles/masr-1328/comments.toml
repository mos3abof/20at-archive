[[comments]]
order = 3
subject = "المنافق و الإرهابيون"
author = "طالب مصري"
posted = "2006-12-20"
text = "الدكتور الطيب<br />هم بالفعل إرهابيون, و لكنك أيضا منافق<br />ذلك الإسلام الذي سرقتموه, جعلته أنت إسلام سلطة, و جعلوه هم إسلام تغييبي, و الإسلام منكما براء<br />تركتم لهم الجامعات ليفعلوا بها ما يشاؤون و حرمتم بقية التيارات التنويرية حتى من حق الوجود, حتى عند تعاملكم معهم بغباء كانوا يظهرون للجميع و كأنهم الحمل الوديع المظلوم المضطهد فيكسبون بذلك تعاطفا أكثر<br />و الآن ها هم زملائنا يمثلون امتدادا للجهاز الخاص لجماعة الإخوان, زملائنا الطلاب شكل البعض بهم ميليشيات<br />لأنكم حبستم الأفكار, و قاومتم الفكر بالقوة, فاتجهوا جميعهم إلى من يتفاوض مع النظام و مع السلطة و الثمن دائما يكون زملائنا أبناء فقراء الوطن, أما هم ففي عليين<br />و لي سؤال<br />إذا كنتم متأكدين أن زملائنا الطلاب إرهابيين, فلماذا لا تقبضون على قياداتهم و مقر مكتب الإرشاد معروف لديكم تمام المعرفة, أم أنه كتب علينا أن نكون وقودا حتى يزدادون هم و أنتم بريقا و لمعانا.<br />أنت تتحدث باسم الدين<br />و هم أيضا يتحدثون باسم الدين<br />و غيركم عشرات الجماعات تتحدث باسم الدين<br />قولوا لنا بالله عليكم إذا كان ديننا واحد فلماذا تفرقتم فيه و فرقتمونا معكم ؟!!!!<br />فولوا لنا بالله عليكم أي كهنوتية في الاسلام تلك التي تدفع بالبعض ان يقول نحن ابناء البنا و اخرون يقولون نحن ابناء سيد قطب و غيرهم ابناء محمد بن عبد الوهاب و غيرهم و غيرهم<br />و نحن ... أبناء من ؟!!!<br />و ختاما<br />حسبنا الله و نعم الوكيل"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

[[comments]]
order = 4
subject = "الاخوان امل الامة"
author = "قسامى"
posted = "2006-12-20"
text = "انا لن اوجه كلامى الى ذلك الذى ليس بطيب ولكنى اوجهه الى ابناء الاسلام ابناء هذا البلد الطيبين .متى كان الاخوان مصدر ارهاب .ومتى كانوا من طلاب السلطة .الله ان الاخوان ليعملون للناس من اجل الله اكثر مما يعملون لانفسهم .ولكى تتاكدوا من ذلك اسالوا المعتقلات واعواد المشانق لتعلموا من هم الاخوان"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

[[comments]]
order = 5
subject = "تذكر كلمتك هذه وانت واقف بين يدي الله يا منافق"
author = "علي - واحٍٍٍٍٍٍـــد مـــن الٍٍٍٍــــنـــــاس"
posted = "2006-12-20"
text = "تذكر كلمتك هذه يا منافق<br />عندما تحاٍٍٍٍسب على تضييع مسـقبل هؤلاء الطبيية<br />تذكر يا منافق انك دسـت على ضميرك - ان كان لك ضمير -<br />وتذكر انك خنت امانة الازهر التي وضعت بين يديك<br />تذكر انك يا منافق زورت انتخابات اتحاد الطلبة<br />ويا منافق تذكر ان عٍٍٍساكر الامن تحرشو بفتيات الازهر لاول مرة في التاريخ باوامرك<br />تذكر انك اضعت الازهر وجامعته وجعلته ذيلا للنظام الحاكم الفاٍسد الخائن<br />تذكر هذا يا منافق<br />وتذكر انك فعلت ذلك لمنصب زائل<br />سيزول حتما<br />سيزول المنصب<br />ومن وضعك فيه<br />يا منافق"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

[[comments]]
order = 6
subject = "نصيحة لعالم جليل"
author = "نرجو من العالم الجليل الدكتور الطيب ان يراجع نفسه فى موقفه من هؤلاء الطلبة ولا يجعل موقفا سياسيا يجعله يحيد عن الحق او الموضوعية .. وليتذكر أن امرأة دخلت النار فى هرة لأنها حبستها .. فما بالنا بأكثر من مائة نفس تحبس ظلما وعدوانا .. قد يكون الطلبة على خطأ وهم اعترفوا بذلك فعلا .. لكن ليتدبر الدكتور الطيب أمره ويفكر فيما يريده الامن بهؤلاء الطلبة"
posted = "2006-12-20"
text = "وأين كان فضيلته عندما زورت إرادة الطلبة فى الانتخابات ز. ارجو أن تراجع نفسك يا فضيلة الدكتور ويعلم الله انى انصح فضيلتكم مخلصا لوجه الله الكريم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

[[comments]]
order = 7
subject = "ليس طيبا بل درويشا"
author = "متابع محايد"
posted = "2006-12-20"
text = "اذا كان طلاب الاخوان قد اخطاوا فقد اعتذروا رغم أن المتابع للحركة الطلابية في مصر قد يجد لهم مندوحة بعد ان اعلنوا أنهم اجتهدوا واقدموا على هذا السلوك لتوصيل قضيتهم الى المعنيين بعد أن ضاقت بهم كل السبل وأهدرت حقوقم الطلابية .<br />أما أن يصل الدكتور احمد الطيب رئيس جامعة الأزهر في حواراته الصحفية والمتلفزة الى هذا المستوى من الاسفاف فتلك هى الكارثة ، فكان ينبغي أن يكون حكيما ويحتضن أبناءه ويبحث مشكلاتهم لا ان يرتمي في أحضان الأمن والسلطان ويردد نفس المقولات الأمنية التى سوف تحسب عليه ، اسمح لي يا شيخ أحمد أن أقول لك أن المناصب زائلة ولن ينفعك الا عملك فاتق الله واقرأ هذه الواقعة بعين محايدة وموضوعية لا بعين أمنية زائفة لا تعكس الا الخداع والأوهام ."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

[[comments]]
order = 8
subject = "طيب يا صبر طيب"
author = "رئيس تحرير"
posted = "2006-12-20"
text = "نجحت الحكومة فى ذبح الاخوان بعد ان تهيأللناس انهم الشوكة التى تسنطيع ان تؤرق الحكومة واهدى الطلاب بعدم خبرتهم ودرايتهم بقراءة الاحداث السياسية السكين الى الحكومة كى تذبح الاخوان ولكن كبش الفداء هم الطلاب والاعتقالات التى تمت كان مرتب لها ووسائل الاعلام التى دخلت تصور تم تكليفها بهذا من جهة الحكومة القضية انتهت والحكم اصدر واغلق الملف ولكن يبقى سؤال يراودنا جميعا ولا اعلم عند من اجابته ومـــــاذا بعد ؟ ايه ممكن يحصل تانى بعد الازهر منارة الاسلام الشرطة كلنا نعلم ماذا جرى لهذا الجهاز الامنى القضاة الكرة مازالت بعيدة عنهم وتم تجميداللعبه<br />معهم لحين اشعار آخر الاخوان تك كسر شوكتهم نهائيا طلعت السادات تم حبسه<br />فاضل مين هه حد يرد ولا اقولكم بلاش حد يرد لحسن يجراله زى الناس اللى انا قلت عليهم وحسبى الله ونعم الوكيل<br />mego_mego.blogspot .com<br />رئيس تحرير"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

