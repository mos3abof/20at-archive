[[comments]]
order = 0
subject = "مبروك عليك الوزارة يا عم ال\"طيب\""
author = "ياسر ابو عمار"
posted = "2006-12-19"
text = "الف مبروك للطيب مشيخة الازهر او وزارة الاوقاف،وهذا مقابل متواضع لخدماته الهائلة لامن الدولة وخيانته الهائلة -برضه- لابنائه الطلاب ،يا ميت خسارة عليك يا شيخ ،الواحد كان واخد فيك مقلب كبييييييييييير .افرح بيها بس خليك فاكر ان محدش بيهرب من الموت ولا سؤال الملكين ولا سؤال الله تعالى ،المنصب زائل ولن يبقى الا احترام الشخص لذاته ولدينه وامانته ."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

[[comments]]
order = 1
subject = "الطيب والوطن"
author = "احمد"
posted = "2006-12-19"
text = "الكتور احمد الطيب ارجوا منك ان تترك موقعك فورا لانك كما قلت فى برنامج العاشرة مساءا انا فشلت فى احتواء هؤلاء الطلاب فانت كما نعلم اتربيت فى البيت الفرنسى واللى بيفشل فى موضوع وكمان مسؤال لابد وان يقدم استقالته فورا ولا خلاص انت شربت من ماء النيل وماء الحكومه واللى بيشرب منهم مش ممكن يتركهم ابداولا نقول لك مبروك عليك تمديد الرئاسه لك ولا انت ناوى تبقى شيخ الازهر واماموم الاكبر ااقصد الامام الاكبر والسلام على اهل السلام"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102326/http://masr.20at.com:80/article.php?sid=1328"

