posted = "2006-12-21"
text = "والله ياأخوانى هذا الجل انسان غير مهذب وغير محترم انسان فاشل بكل المقايس لايعرف غير معاملة الساحات كان فاشلا فى ادارة كلية اقليةية باسوان قوم يدير جامعةفى حجم جامعة الأزهر والله عريت الصعايدة لايسلم من لسانه احد بيضحك عليه المشبوه عبد الدايم نائبه الهمام الذى عقمت النساء ان تلد مثله الطيب هذا يتفنن فى قطع رقاب اعضاء هيئة تدريس الجامعةبينما الجامعات الاخري تتفننفى الرقى باعضائهاهو جاهل فى كل شئ لم يقدم للاسلام شيئا ولاللجامعةيبيع كتب التراث لصالحه ولصالح عبد الدايم وعبد الفضيل القصوي الذى لايعفر من امور الرقى والتقدم والنهوض بالجامعة اي شيئ... فهل ياساده يأتى اليم الذى تنقشع فيه اثقل غمة جثمت على صدر جامعة الأزهر الله يرحم ايامك يا دكتور احمد عمر هاشم.."
