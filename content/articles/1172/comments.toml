text = "في البداية حاب اتشكر الشباب الي بعبرو عن صدق المشاعر والاحساس بالعروبة متل نصر مهند ماسة مكسيم وغيرهم من الشباب وبقول الاردن ارض العروبة واي شعب عربي بمر بظروف صعبة اول شعب وارض بيلاقي الاردن دايما الاردن هي اليد والصدر الحنون بس حسبي الله على الي بخرب بس العرب عم بعرفو من الشهم بالنهاية اسألو الفلسطينين واللبنانين والعراقيين والمصريين والسوريين والخليج عن الاردن وعن كرم شعب الاردن واي بلد عربي اخر مرح يوصل لمكارم الاردنين فحاب اوصل رسالة انو انتو يلي بتسبو شوفو حالكو اول بعدين احكو والاردن اولا والاردن اولا والاردن اولا الاررررررررررررررررررررررررردن اووووووولا"
