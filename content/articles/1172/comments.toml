[[comments]]
order = 0
subject = "لعنة الله عليكم"
author = "معتصم بالله"
posted = "2006-09-21"
text = "يا عيني و ياعيني , الاردن يا مرحب و يا مرحب بتشويه صورة الاسلام و المسلمين لا و علي يد مين مسلمين , هاي عن جد نكتة , بس نكتة بايخة و لا الها طعم و لا لون بس الها ريحة نتنا , خلص احنا صرنا رمز الارهاب , المسلمين هما ارهابيين العالم هلئيت يا مرحب , و الامريكان و الصهاينة و الاورةبيين ملايكة , ولو ما هما اللي مأكلينا و مشربينا و عايشين علي قفاهم .<br />خيبة خيبة و لا خيبة , خيبة علي الاردن و خيبة علي مصر و خيبة علي سوريا و خيبة عليكم كلكم يا عرب , خيبة نخيب اجيال و اجيال من المسلمين شوهوا صورتهم بايديهم و ضيعوا كرامتهم بأيديهم , خيبة علي شعب اكت , خيبة علي امة نايمة , خيبة علي ممثلين ولا بيفكروا ايش بيعملوا ولا اش بيسوا , فكروا شوية شوفوا اش النتيجة من ورا اعمالم , فكروا شوية شوفوا مصيركم لما تتحطوا في سلة الزبالة مع كل الجهلة اللي قبلكم .<br />خيبة زعلانين علي كلام البابا و الصحيفة الدينماركية و اليهود اللي بيشتموا نيكم , ما انتم شتمتوا قبلهم بجهلكم و غبائكم و هطلكم , خلص صارت اللحية و الجلباب الابيض و البانطلون الي علي الكعب لبس الارهابيين القتلة اللي سفكوا الدم و دمروا الامة , و الله العظيم ما في غيركم دمرها , ماهي غيركم اساء للاسلام و المسلمين , نسيتوا ارهاب الامريكان و الصهاينة اللي قتلوا اولادكم و سرقوا ارضكم و اغتصبوا ولايلكم , نسيتوا؟؟ و لا ما نسيتوش انتة اتناسيتو . شكلكم نسيتوا اللي قتل الفلسطينية و المصريين و العرب و العراقيين , خلص صار المسلمين هلئيت هما الارهابين و القتلة و ناشري الدمار .<br />الحقيقة انا تعبت من الكلام اصلوا الغباء و الجهل مكتوب عالعرب , مكتوب علي المسلمين بس برده لأأأأأأأأأأأأأأأ انتة قلة قليلة مندسة , الاسلام برئ منكم ياللي شوهتوا صورتة و ضيعتوا كرامته , الاسلام هو دين السلام و الحرية و الجلباب الابيض هو رمز السلام , اما انته يا عرب يا اصحاب البدل و الكرافاتات و الجزم انته اكبر جزمة و اوسخ جزمة , انته اندل ناس , اتنكرتوا لدينكم و رسولكم و مش همكم غير تشويه الاسلام و المسلمين .<br />الله ياخدكم و ياخد امثالكم<br />تعالوا شوفوا الكلام الصح مش الارهاب الفكري تبعكم يا ارهابيين يا عملاء :<br />www.moatassem.blogspot.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133517/http://www.20at.com/article2.php?sid=1247"

