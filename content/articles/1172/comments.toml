subject = "ليش هالهجوم يا جماعة"
author = "ماسة"
posted = "2006-10-19"
text = "والله انا بشكر الفنانين الاردنين على هالثقة وهم بصراحة أد الثقة وبشكرهم كتير كتير على المسلسل وبأول يعطيكو الف عافية وبأول لو كمان في مسلسلات من النوع هادا وبحب أأقول ان الفن الاردني اصل الفن واحلى فن وكل حدا عم بيحكي عن الفن الاردني هو حاسد واخيرا بأقول ان الاردن اولا وسيبقى اولا وغير هيك ما في كلام مرسي كتير"
