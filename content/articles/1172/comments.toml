[[comments]]
order = 3
subject = "بالعربي قرفتونا"
author = "فلسطين"
posted = "2006-09-27"
text = "يعني ما كان مكفينا المسلسلات والافلام المصرية الي ما بتعرف كيف ومن غامض علمو بدخلو فيها قضية ما يسمى بالارهاب بطريقة سطحية ومملة ومبالغة كمان عم بقرفونا برمضان .. لا ومين الدراما الاردنية الفاشلة.. ينتقدون التكفيريين وهم انفسهم يكفرونهم وعنوان المسلسل دلالة واضحة على ذلك... لا والحقارة تكمن في انهم يزجون باحداث لا تمت للواقع بصلة الهدف منها المبالغة وتشويه صورة الشباب الذي يندفعون للقيام بردة فعل على ما يحدث من قمع وظلم من جهة الانظمة العربية ومن جهة امريكا... واللافت هو ان هذه المسلسلات التي تدعي معالجة قضية الارهاب تلمع صورة اجهزة الامن العربية وكانهم ملائكة الرحمن الذين يحاربون الشر .. اذا فعلا بدكم تعالجو الي بتسموه ارهاب عالجو الاسباااب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133517/http://www.20at.com/article2.php?sid=1247"

[[comments]]
order = 4
subject = "سؤالات"
author = "قلم جاف"
posted = "2006-10-07"
text = "مع احترامي للدراما الأردنية والسورية والخليجية ..<br />ليه \"الشبط\" في النتيجة وترك الأسباب؟<br />هل جرؤ صناع الدراما في إنتاج مسلسل عن الأحباش وهم تكفيريين بالمناسبة؟ لأ..<br />هل جرؤ صناع الدراما هناك بالاشتراك مع المنتجين الخليجيين على فضح قيام بعض رؤوس الأموال الخليجية بدور المحلل للاحتلال الأمريكي في العراق وما سببه من ازدياد لحدة التطرف السلفي والشيعي وما أسفرا عنه من إرهاب داخل العراق وخارجه؟ لا..<br />هل جرؤ هؤلاء - وهم ممتازون في الأعمال التاريخية بشهادة كثيرين - على تتبع تاريخ التطرف والإرهاب؟ لماذا لم نرَ مسلسلاً عن القرامطة أو عن الحشاشين ، الذين لم يشر إليهم أصلاً إلا مرة واحدة على يد متواضع الموهبة أبو العلا السلاموني في مسلسل نسر الشرق الذي أخرجه الراحل حسام الدين مصطفى قبل سنوات؟<br />شاهدت لقطة من مسلسل دعاة على أبواب جهنم ومقدرتش أكمل .. الظاهر إن الدراما الأردنية والسورية حتتجه لمنافستنا كمان في الضحك على الذقون والهبل الدرامي..وزغرطي ياللي ما نتيش غرمانة!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133517/http://www.20at.com/article2.php?sid=1247"

[[comments]]
