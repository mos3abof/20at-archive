subject = "متهيألى"
author = "نيفين نيفى نوفا"
posted = "2006-09-21"
text = "متهيألى كدا ان شركه الانتاج هى نجه انزور<br />و متهيألى ان المخرج نجده انزور<br />ومتهيالى ان الصوره اللى فوق دى من مسلسل الحورالعين<br />ومتهيالى ان مسلسل الحور العين كان مسلسل رائع<br />متهيألى لو كل تهيؤاتى طلعت ف محلها يبقى المسلسل دا هيبقى كويس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133517/http://www.20at.com/article2.php?sid=1247"

