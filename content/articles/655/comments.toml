text = "أتمني المزيد من التفوق والريادة في عقود التحولات والمعلوماتية الحديثة في ظل ثورة الحداثة المتأخرة......... آسف افتكرت نفسي<br />وأنا بتكلم وزير الإعلاموالثقافة ومنظر القرن القادم وكلام كتيير أوي وكبير<br />المعلوماتية .... والثورة ... والحداثة ..<br />تفتكروا ان الريادة في الصحافة والإعلام محتاجة كلام جريئ ولا حرية ولا ....إيه بالظبط<br />أتمني لكم مرة أخري التوفيق ولو سمحتم إسمعوا رأي القراء ورغباتهم...<br />aroundu_4<br />أتمني المشاركة علي :<br />http://groups.yahoo.com/group/aroundu_4/"
