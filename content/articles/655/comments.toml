[[comments]]
order = 8
subject = "فاكر إيه تاني يا محمد ..فاكر إيه؟"
author = "محمد السيد"
posted = "2006-04-06"
text = "صحيح ... نسيت نشرة \" تسعي \" ... والتجارب الفيليمة اللي كنتم بتجربوها فينا ...<br />فاكرين الأسطي مجاهد ؟؟؟ فاكرين محمد صيام .... الله يرحمه ... ممكن أكتب قبل اسمه كلمة أستاذ ؟؟ أستاذ محمد صيام<br />الحقيقة من الناس اللي أثروا فيا ...<br />وأنا جاي من القاهرة مرة قابلت واحد صدفة في القطر كان من دمنهور والكلام أخدنا ... وسألني تعرف موقع عشرينات ...قلت له أيوة .. قال لي<br />:سمعت عن الأستاذ محمد صيام ؟ قلت له :أيوة الله يرحمه ... حكي لي عنه وإزاي إنه كان إنسان أكثر من رائع وإزاي إنه دخل في المجال ده بنفسه<br />وبحبه ليه ... وإزاي إنه كان كتلة نشاط وحماس ... وكان محبوب من أي حد يقابله ... أكيد دلوئتي هو فرحان باللي إنتو وصلتوا له ...<br />الله يرحمه<br />إيه ده ؟؟؟ كفاية حزن كده ... ده احنا حتي في مناسبة سعيدة ..<br />فاكرين نشرة المراقبة الصحفية ؟؟؟ هي فين صحيح ؟؟ عجبتني أوي وقتها وكمان لقيت تفاعل كويس جدا مننا ... من الجمهور يعني ...<br />ولا أنس باشا محمود .... وقعت في القلب ده مرة \" أظن موضوع واحد زيك \"... لكن البراء \"ربنا يكرمه يارب \" قال لي إني هو نفسه أنس باشا محمود ...<br />إشمعني انس يعني ؟؟ ... مش عارف<br />صحيح !! قبل ما أنسي !! .... وسام كمال ...كتبت أكثر من موضوع في عشرينات ودلوئتي في إسلام أون لاين ..لكن بجد الشخصية<br />دي أنا اتعلمت منها بجد ... ربنا يوفقها يارب ..<br />والدكتور عمرو مجدي ...تعليقاته كلها عاقلة جدا وآراءوه دائما بألاقي فيها رزانة واتزان ... يمكن يكون أفضل شخصية يستاهل فعلا إنه يكتب لكم في يوم ميلادكم ... وواضح جدا الكلام ده في \" عشرينات في زمن التحولا ت \"..<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />ياجماعة غيرووووووه ...<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113726/http://www.20at.com/article2.php?sid=663"

[[comments]]
order = 9
subject = "ها ؟؟في حد تاني ؟أكيد بس مش فاكر .دي ذكريات كتيرة أوي ..كنت لسة صغير"
author = "محمد السيد"
posted = "2006-04-06"
text = "يجي بقي للحاجات الغلسة ... طلباتنا ... يمكن إحنا الجمهور القديم ... وبرضه الجديد<br />الحقيقة فكرة نشرة المراقب كانت خطيرة بجد ... فكرة جديدة ..بتسمح بالتفاعل بين الموقع ومحررينه وكمان بتعمل جو من المنافسة الجميل ...<br />ياريت ترجعوها ..وجربوا مش حتخسروا حاجة ...<br />ثانيا ... ده بعد إذنكم يعني ؟؟؟ رتم موقع ولاد البلد ..المواضيع بتتغير بسرعة رهيبة لدرجة إن الغالبية مش عارفة تتابع المواضيع كلها ....<br />بالراحة علينا شوية ... لاحظوا إننا عندنا كليات ودراسة ومواقع تانية وحاااااجات كتير ...ما إحنا مهمين برضه<br />في اقتراح أتمني تعملوه ... لو ممكن تعملوا جروب لينا علي الياهو ... تسمح للمجموعة \" إحنا وإنتم - ولو إن ساعات مبعرفش أفرق بينكم<br />وبينا \" بالتعارف والتداخل أكثر .<br />مش ممكن ييجي يوم .... تكونوا أول موقع علي النت يحول العلاقة دي \" علاقة النت \" لعلاقة حقيقية ... مش بعيد تتطور الفكرة ونتجمع ولو<br />مرة في الشهر .... في أي نادي أو أي مكان ... يكون لكل العشريناتية ... يعني الموقع يحول علاقة الكيبورد والماوس ...لعلاقة حقيقية<br />تجمع بينا كلنا ....<br />فكروا بجد في حاجة زي دي ...سواء الجروب او إننا نتقابل ...<br />الحقيقة إحنا هنا بنعمل حاجة ربما تكون جديدة في عالم مواقع الانترنت وخصوصا المواقع الشبابية ... إحنا بنجمع بين علاقات محترمة ومواضيع بجد<br />هادفة في إطار من الحب والود اللي ميسمحش بأي خطأ من حد في حق أي حد تاني ...أو بدون تجاوز للشرع والحدود ..<br />إيه ده ؟؟؟ أنا من غير ما أقصد والله لقتني بأتكلم بصيغة المتكلم ...رغم إني المفروش أتكلم عنكم إنتم .... صحاب الموقع وكتابه ..<br />اقول لكم ...تيجي نرزل علي البراء ونعزم نفسنا عنده بمناسبة خطوبة سلامته ؟؟<br />ولاالبنات يحلوا ضيوف علي دعاء ...إنتو متعرفوش ؟؟ مش هي كمان اتخطبت .... شفتوا الصدف ...<br />الحقيقة أنا مكنتش عايز أكتب كلام كتير كده ... أو كلام كبير .... لكن أهه اللي حصل ... شكل التعليق طويل وحيتقص لكن أهه ...أنا حبيت احكي لكم عن عشرينات وعم ذكرياتي معاه في الشهور اللي فاتت ... وعقبال مائة عام ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />ياجماعة غيرووووووه ...<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113726/http://www.20at.com/article2.php?sid=663"

