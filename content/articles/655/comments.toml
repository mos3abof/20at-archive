[[comments]]
order = 6
subject = "هي مرت بسرعة كده ليه؟"
author = "محمد السيد"
posted = "2006-04-05"
text = "أول موضوع كان مرتب رئيس الجمهورية؟؟مممم<br />مش عارف ... لكن أظن إني قريت المقال ده بعد الموقع ما اشتغل ... أو يمكن أنا بدأت أقرا في الموقع من أول ما بدأ ...يمكن ....<br />ياااااااااه ... الأيام عدت بسرعة ...مش فاكر أنا وصلت للموقع إزاي ؟؟؟ لكن فاكر إن واحد قال لي عليه بعدها وقال لي انه تبع إسلام أون لاين ومن ساعتها وانا متابعه ...<br />أنا فاكر في الأول .. كان مقال البراء بتاع عمارة الفوال في قنا...أظن ده من البدايات ...من بعدها تابعت الموفع ...<br />فاكرين ... البدايات ... وائل عباس ونونا المجنونة و .... مريم وشيرين وعلي وقطب ومحمد المعتصم ... كمان محمد الدسوقي اللي راح الدستور ...<br />كمان مني بعدما سافرت الكويت ... وعم خيري ... كان مقلب حكايه ..ههه<br />الحقيقة الواحد معاه ذكريات كتيرة أو معاكم ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />مش قلت لكم عايز أغيره ؟؟؟<br />mohamdmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113726/http://www.20at.com/article2.php?sid=663"

