text = "السلام عليكم ورحمة الله<br />اتوجه اليكم با اخوة الاسلام بان ترشدوني لمن بساعدني اسرة كاملة مهددة بالانهيار وان ترمى بالشوارع<br />اجوروني عملت كل ما بوسعي<br />قالوا لي انكم باستطاعتكم ايصلي لامير يدعي الامير طلال بن الوليد<br />ahmed_mmm_33@hotmail.com<br />ahmed333_1@yahoo.com"
