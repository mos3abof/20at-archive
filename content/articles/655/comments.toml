subject = "بص يا يحيي يا ابني"
author = "محمد السيد"
posted = "2006-04-07"
text = "يحيي ... الشهير بياء ...<br />في الصورة تقدر تلاقي نااااااااااس كتيرة .....<br />البراء ... عشان اللي ميعرفهوش موجود ......<br />ومصعب ... برضه ..<br />والباقيين معروفين .... مش محتاجة .... أنا قلت أكتب أعرفكم باللي مش مشهورين يعني ...<br />وبعدين يا يحيي ... في حد في الدنيا يخترع اسم ... ويعجبه ... وكمان يقول انه حيسمي بنته بيه ...<br />ياء ...<br />الاسم ده من اختراعه وعجبه ....<br />وعجبي<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />ارحموني ..... غيروه<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113726/http://www.20at.com/article2.php?sid=663"

