[[comments]]
order = 29
subject = "عقبال 100 سنة و شكرا لعبد الله مفتاح"
author = "سوسة المفروسة"
posted = "2006-04-07"
text = "كل سنة و انت طيبة يا عشرينات ...الموقع ده شكل اضافة مهمة لحياتي اليومية..على الاقل خلاني افضفض شوية عن بعض الحاجات اللي انا (مفروســــــة) منها من زمان...بس انا مش قادرة افهم ازاي اصدقائنا البعدا ما لموناش كلنا في بيت العيلة من زمان؟؟؟ يمكن بقه فيه ديمقراطية بجد ؟؟...انا لسه ما صحيتش من النوم والا ايه...خير اللهم اجعله خير...يجعل كلامنا خفيف عليهم<br />في الموقع ده انا اتعرفت على ناس محترمه كتير (عبدالله مفتاح-هبهوب-نفين-اكرم-سويت برنسيس-عابر القارات- اسلام عبد السلام- دبدوب..و غيرهم) صحيح لسه مابقيناش اصحاب بس انا بقرالكم كلكم و باحترم اراءكم جدا و نقاشاتكم بتبقى في منتهى الجمال و بحب دايما اشارك..انا لسه اعتبر جديده في الموقع الى حد ما بس باتمنى اننا نبقى اصحاب<br />بالنسبة ليك ياعبدالله انا دايما باقرا ردودك و باحس انك في اوقات كتير بتقول اللي انا عايزة اقوله بالظبط و كفاية انك بتفتكرني شكرا ليك ربنا يوفقك و تاني (لا فض الله فوك)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113726/http://www.20at.com/article2.php?sid=663"

