text = "الف مليون مبروك<br />فعلا عشرينات قدر يثبت نفسه رغم صغر سنة علي الشبكة العنكوبيتية بالمقارنة بالمواقع الشبابية التانية<br />ربنا يوفقكم والي الامام دائما<br />بس ياريت ماننساش واحنا بنحتفل بالسنة التانية لعشرينات بالكاتب / عبد المنعم محمود وهو خلف القضبان بدون تهمة ربنا يفك اسره<br />انا عارف انه مش كاتب اساسي بس برده كان ليه مواضيع كويسة<br />عموما الي الامام دائما"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113726/http://www.20at.com/article2.php?sid=663"

