[[comments]]
order = 23
subject = "الموقع ناقصه شوية ملح و يبقى كله تمام"
author = "مناضل أنترنتى قديم"
posted = "2006-04-06"
text = "السلام عليكم و رحمة الله و بركاته<br />نبتدى منين الحكايه<br />تعرفوا ياجماعه أنا مع تعليق الأخت<br />مسلمه أن الأحتفال بعيد الميلاد بدعه و لكن من الله على بفكره أنفذها من سنتين أو ثلاث على نفسى و الفكره ببساطه<br />أنى فى ليلة عيد ميلادى أجلس مع نفسى جلسة محاسبه أتذكر فيها أهم الأحداث فى حياتى و التى حدثت فى السنه المنصرمه و أسأل نفسى بعض الأسئله<br />هل رضى الله عنك هل نصرت الأسلام هل بغلت عن الحبيب صلى الله عليه و على اله و صحبه و سلم بأيه كما أمرنا بذلك هل حافظت على سنته هل تحب لقاء الله هل عملت ليوم الحساب هل استعددت ليوم الرحيل هل أديت الأمانات كم من الناس أغتبت كم من الناس ظلمت و بهت كم من الحرمات انتهكت كم من الذنوب فعلت كم من الصلوات ضيعت كم من الأوقات أهدرت كم من الحسنات أستصغرت كم من الذنوب أستحقرت و ماذا ستقول لمنكر ونكير فى القبر و ماذا ستفعل فى ظلمة القبر ......... أجدنى محاصربكل هذه الأسئله و غيرها الكثير و أريدكم أن تسألوها لأنفسكم قبل أن يأتى الموت و قتها لن يفيد السؤال و لن يفيد الكلام إلا من أتى الله بقلب سليم<br />قد يقول البعض ايه يا عم النكد ده و لكن هذه حقائق سوف نسأل عنها و أريد كل شباب الموقع محررين و زوار أن يسألوها لأنفسهم ثم تسأل أدارة الموقع نفسها كأداره هذه الأسئله و تضيف عليها سؤال أخر هل ما ننشره لنا أم علينا أمام الله عز وجل<br />انا لن أخفى عليكم سر فلقد أستطاع الموقع أن يستحوذ على جزء من تفكيرى و وقتى بروح شباب الموقع زوار و محررين و شبابية الأفكار و غزارة معلوماتها وروح السخريه اللاذعه الجميله التى تسيطر على بعض المقالات ولكن.......<br />و هنا نريد ان نتوقف وقفه طويله قليلا وسوف أوجه بعض الأنتقادات إلى أسلوب إدارة الموقع و انا لا أقصد النقد الهدام أو النقد لمجردالنقد و لكن أقصد نقداً بناءً يساهم فى تطوير شكل أداء الموقع فلاحظت فى بعص الفترات تدنى مستوى بعض الموضوعات و تنافيها مع أطار الشرع و السلوكيات العامه<br />فمثلا موضوع مثل خمسين صلاة في اليوم! http://www.20at.com/article2.php?sid=635<br />يحتوى على اخطاء شرعيه كثيره و أنا لست أهل علم و لكن الفطره تنفر بطبعها من كل شاذ و بعض المواضيع الأخرى أنا لا أذكرها ولا أرغب فى تذكرها لأنى اشعر بارتباط غريب بينى و بين الموقع فالمثل الشعبى يقول حبيبك يبلعلك الزلط و عدوك يتمنالك الغلط<br />كذلك احبائى زوار الموقع أحيانا يخرجون على النص ويكتبون تعليقات لا تليق وبالطبع كل منا حر فى رأيه و لكن لا تؤذوا الأخرين بكلمات خارجه و سباب لن يفيد فى شىء لذلك أرجو من إدارة الموقع ان تقوم بعمل فلتره على المواضيع التى تحوى كلمات خارجه و حتى لا يفسر كلامى خطأ انا لا أقصد أن يتم حجب تعليقات دون أخرى و إلا يكون المو قع قد فقد رونقه رورحه و لكن التعليقات التى تحوى كلمات خارجه فقط<br />أعجبتنى بشده فكرة الأخ محمد السيد و هى لماذا لا نجعل يوم يلتقى فيه المحررين بالزوار و لنجعلها جلسه كجلسات الصالونات الثقافيه نتناقش فى المواضيع المختلفه و نضع أراء ومقترحات نحاول أن ننفذها على أرض الواقع<br />فالنقد و الكلمه وحدها لا تنفع بدون عمل وتخطيط و تنفيذ و أضيف أقتراح اخر لماذا لا ننشىء ركن و لنسميه مثلا ركن الهواه أو ركن القراء يلقى فيه كل عضو بأبداعاته فى الكتابه أو القصه القصيره أو الشعر و نختار أفضل المواضيع و نعرضها فى الموقع وهذا سوف يحدث تفاعل رهيب بين الجميع<br />فى كل الأحوال الموقع أكثر من رائع و أسلوب محرريه أكثر من رشيق و تعليقات معظم زوراه فى الجون و أتمنى للجميع بلا أستثناء التوفيق<br />و اشكر الله الذى من على بصداقة المبرمج العبقرى كما أطلقت عليه دعاء احمد مصعب و أتمنى أن تدوم هذه الصداقه<br />محبكم فى الله<br />مناضل أنترنتى قديم<br />hassan_gaer@hotmail.com"
