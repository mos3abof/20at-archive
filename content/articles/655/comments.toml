[[comments]]
order = 4
subject = "حسه اني عايزه اكتب كتتتتتتير"
author = "هبهوب ... هووووووبه ...هبابه"
posted = "2006-04-05"
text = "اولا انا عملت في الموقع دا اصحاب كتتتتتير زي العسل .<br />نفونتي اتقبلنافي ملف الموت \"هبهوب انتي ليكي مدكرات لما كنتي في امركا انا كمان بكتب \"<br />ومن هنا ابتديت . وبعديها ال\"النكته \" اللي لسه بتدور عليها \" لقيتها يا بت ولاه لسه .<br />\" كرمله, كرمينلو \" بردوه في ملف \" الموت \" ايه الغم دا \" انا مستني المدكرات بفراغ الصبر والسلون كمان ...اميلي اهوه اهوه اهوه ....\"<br />معلش يا \"ضانيا\" الماسمجر تعبني حبتين .بس انت ونج يمين يا باشا دا عشره مدكرات بردو.<br />\" دبدوب\" اللهي وانت جاهي يا دبدوب تهاجر وتروح فين بقي فين يا بت<br />البلد اللي انت بتعشقها \" السعوديه \" يلا هيص يا عم . \" اوعي الفتنه اديني قولتلك اهوه \".\" يلا تشيل شويه من الاحباط اللي عندك تحت او فوق الباط متفرقش مع الجدعان \"<br />\" عبد الله مفتاح\" .. \" هيا بنا نلعب في اعماقنا .\" اشمعني دي اللي مش هيتلعب فيها يا عوبد . يلا يا بني ليك مستقبل بالحق ينفع الصلاه وراه حليق ولاه لاه ؟؟<br />\" سويت \" مش عايزه اقولكوا كم الرسايل اوف لاين قد ايه مش عارفه لو كنت فتحت اون لاين كان ايه اللي ممكن يحصل . يلا<br />عايزه احضر فرحك يا بت .<br />اه من حلف الكواليس بقي<br />\" الكابتن مصعب \" اشكرك يا باشا \" بضرواه \" علي استضفتك في \" البلوج\" بتاعك .<br />وسلام يا بشششششششششر ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113726/http://www.20at.com/article2.php?sid=663"

