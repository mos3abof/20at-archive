text = "انا عرفت عشرينات من مجله كلمتنا ة من يومها هى بيتى لو طلبو من حد يتكلم عن بيته هيقول ايه<br />و انتو يا عشرينات بيتى اللى على النت<br />بقول لكل العشريناتيه ميرسى على كل بسمه ضيفتوهالنا و ميرسى اكتر على كل دمعه طلعتوها مننا و حسستنا و هو نازله اننا لسه بشر<br />بس مش مسامحاكو يا عشرينات على انقلاب عمال المواسير اللى فشل<br />اما الاصدقاء اللىقابلتهم هنا اقول ايه علشان اديهم حقهم<br />هبهوب البت المصريه الجدعه اللى ف امريكا و مونسانا بتعليقاتها الحلوه و اللى نفسى افضى و اتكلم معاها اونلاين بقى<br />اكرم الشاب المعتدل اللى عرفنى ازاى الحوار باعتدال و ازاى الوسطيهو اللى ياما ظبطنا بامل دنقلو اللى بقالهع فتره غايب انت فين يا اكرم<br />عبد الله مفتاح المتدين الجميل اللى كتير لما بنسرح بخيالنا بيرجعنا للواقع باسلوب جميل<br />يااااااااااه يا عشرينات<br />و الله انتو موقع عسل<br />اعسل موقع ع النت"
