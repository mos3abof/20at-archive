[[comments]]
order = 0
subject = "النقد قاسى"
author = "نا شايف ان النقد قاسى جدا على الفيلم"
text = "فرغم ان الفيلم عادى وقصته مكرره الا انه ليس بهذا السوء خاصة لو قارناه بالمعروض فى السوق<br />محمد صبحى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152705/http://www.20at.com/article.php?sid=1348"

[[comments]]
order = 1
subject = "أحمد الميت"
author = "نا شفت الفيلم وعجبنى فيه التمثيل جدا لأنهم فعلا أتقنوا الأدوار مع إستثناء ياسر فرج فلم يكن جديا بالمرة"
text = "أما اللى ماعجبنيش فى الفيلم وده رأيى ورأى الناس كلهم قصته لأنها تقريبا متكررة يجى خمستلاف مرة.<br />شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152705/http://www.20at.com/article.php?sid=1348"
