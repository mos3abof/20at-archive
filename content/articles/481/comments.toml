text = "موضوع جميل والى الامام يا عشرينات وانشاء الله الاخت اليمنية تتعرف على اليمن اكثر واكيد هي عارفه انه من النادر جداجدا جدا في المجتمع اليمني ان تجد امراءة بدون حجاب الله يعينها ويزيدها قرب للاسلام"
archived = "2005-04-14"
