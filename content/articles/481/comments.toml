subject = "DINA"
text = "جزاكي الله خير يا هبه عن جمال موضوعك اللي فعلا شاغل كتير من الناس وبجد كلامك جميل جدا انا واحده من الناس والله تعبت جدا مع ناس كتير عشان بكلمهم في امور الدين وبصراحه بتبقي نهايه تزعلني لانهم بيبعدو عني خالص المهم ربنا يوفقك يا رب"
archived = "2005-04-14"
