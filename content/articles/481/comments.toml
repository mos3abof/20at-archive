[[comments]]
order = 12
subject = "ففروا إلى الله"
text = "غريب هو الأخ عمرو وجدى...أو بلاش غريب لأن فى زيه كتير للأسف..<br />دكتور عمرو أرجو أن تبدأ و كل الأخوة الملتزمين فى قطع الشوط الثانى من الالتزام<br />و الأهم هو البعد عن الغناء مزمار الشيطان كما يقولون..من الممكن أن تقرأ كتاب ففروا إلى الله لتعرف ما لن تتخيله عن أضرار الغناء و تحريمه القاطع و رأى الأئمة الأربعة فيه..<br />كلامى مجرد دعوة خالصة لنا جميعا للتوجه لله بكل قوة<br />و محاولةمستميتة للتأثير فى الأصدقاْْء و الأصحاب و بدون خجل من أى أحد و لا خوف... و لما الخوف و نحن على الحق؟"
archived = "2005-04-14"
capture_url = "https://web.archive.org/web/20050414080456/http://www.20at.com:80/article.php?sid=1031&mode=&order=0"

[[comments]]
