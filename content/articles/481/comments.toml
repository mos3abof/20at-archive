[[comments]]
order = 8
subject = "نونا"
text = "اختيار الوقت و الطريقة اهم حاجة<br />ده غير ان مش كلنا عنده موهبة الوعظ<br />مرة خبطتني عربية<br />الالم كان شديد ومش عارفو اتنفس<br />طلعلي واحدة منقبة و ابوها<br />اولا اخدوا مني الورقة الي فيها نمرة العربية<br />و انا مفياش نفس اناهد او اتخانق<br />و دول بقي<br />اذكري الله<br />انا بفطس و مش عارفة اتنفس و مش عارفة اركز<br />و دي اذكري الله<br />طؤيقتها كانت هتخليني بجد اشتمها و اعك جامد بس مسكت اعصابي بالعافية و اصحابي جم لحقوني<br />اختيار الوقت المناسب مهم<br />طريقة البنت كانت هتجيب معايا بالعكس بجد و كنت هقولها شتايم وحشة"
archived = "2005-04-14"
capture_url = "https://web.archive.org/web/20050414080456/http://www.20at.com:80/article.php?sid=1031&mode=&order=0"

[[comments]]
order = 9
subject = "نصيحة عن تجربة"
text = "أولا: أحب أستوقف الاخ عمرو مجدى عندكلمة(ومازلت برضه عايش حياتى) واحاول ان أنصحك ألا تسرف فى مشاهدة واستماع الاغانى وما يحدث على القنوات الفضائية(وانت تعلم طبعا)ثانيا:-الاخت دينا لابد انك تعرفين شخصية اصدقائك كويس فعامليهم على هذا الاساس وكونى هادئة وصبورة وواثقة فى نفسك وتغيرى للاحسن وستجديهم يلتفون حولك واللى مافيش فادة منه سبيه وخليكى فى طريقك وهو اللى هايجيلك تانى (ولا تنسى انك على الصواب)ملحوظة :- كل ما قلته هذا عن تجربة حقيقية"
archived = "2005-04-14"
capture_url = "https://web.archive.org/web/20050414080456/http://www.20at.com:80/article.php?sid=1031&mode=&order=0"

