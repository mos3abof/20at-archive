subject = "sa7 kalamek"
text = "وحياتك انا كمان بعانى من نفس المشكله دى....المهم انو الكل فاكر ان معنى ان الواحد اتقرب من ربنا يبقى خلاص دة بقى متعصب جدا وبلاش نيجى نكلمه فى الدين بدل مايهب فينا...ونصايحك انا كنت بعملها بس والدات صاحباتى هى اللى بتأثر عليهم وبتبعدهم عن الدين...تخيلى؟!!!<br />جزاكى الله خيرا"
archived = "2005-04-14"
capture_url = "https://web.archive.org/web/20050414080456/http://www.20at.com:80/article.php?sid=1031&mode=&order=0"

[[comments]]
