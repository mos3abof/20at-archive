[[comments]]
order = 2
subject = "تجربة"
text = "بعدما ارتديت الحجاب ...اكتشفت اني اصبحت غريبة عن كل صديقاتي اللواتي يرفضن الحجاب تماما ويضغطن على لخلعه ، وشعرت في أوقات كثيرة باني وحيدة .. ومنعزلة وحاولت تشكيل صداقات جديدة مع فتيات ملتزمات .. لكن تكوين صداقة مسألة ليست سهلة .. ما علينا .. اعتقد إن على أن انجح في حياتي فهذا وحده الذي سيثبت للناس اني صح وإن حجاب وتديني ليس انعزالا قدر ما هو محاولة للسير في الطريق الصحيح ..<br />لكن أنا لم أحاول أن أدعو الأخريات للتدين .. حسيت أني هاكون زي الواعظ اللي بيدن في مالطا .. وحاولت تكون علاقتي باصدقائي شعارها لكم دينكم ولي ديني ومش عارفة ده صح ولا غلط .. لكن فعلا بحس ان فيه سور اصبح بيني وبينهم"
archived = "2005-04-14"
capture_url = "https://web.archive.org/web/20050414080456/http://www.20at.com:80/article.php?sid=1031&mode=&order=0"

[[comments]]
order = 3
subject = "منى أبوالحسن"
text = "المشكلة الرئيسية زي ما الأخت كاتبة التعليق السابق قالت، ان الكلام معاهم بيعتبروه نوع من الوعظ اللي بيسبب لهم حساسية وبالتالي بيتعاملوا معاه من موقف رفض ودفاع عن آرائهم..<br />اعتقد ان الحل هوه في اظهار سماحة الدين و جماله في التصرفات، ومشاركتهم في الأنشطة الطبيعية للسن البعيدة عن المحرمات طبعا، عشان يشوفو بعينيهم ان الالتزام هو اقبال على المباح، مش اعراض عن الدينا بشكل عام.. لكن النصيحة المباشرة والوعظ حيجيب نتيجة عكسية وبعض الناس بتعتبره نوع من أنواع الاحسان والمنّة .."
archived = "2005-04-14"
capture_url = "https://web.archive.org/web/20050414080456/http://www.20at.com:80/article.php?sid=1031&mode=&order=0"

[[comments]]
order = 4
subject = "...."
text = "حكت لي صديقة تحجبت منذ فترة قصيرة .. انها حضرت عيد ميلاد احد صديقاتها زهناك شعرت اها غريبة عن المكان والجو العام والبشر الذين كانوا يمثلون حياتها من قبل ... مواجهة لمحة من حياتك قبل التدين تصيبك باضطراب فعلا .. وخاصة إن اللذات تبزغ في وجهك كشيطان وتسأل نفسك أحيانا لماذا أحرم نفسي منها .. التجربة صعبة مش سهلةة فعلا .. واعتقد ان وجود أصدقاء جدد متدينون .. يساعد المرء على الصمود .. وكذلك تحجيم الاصدقاء القدامى إلى حين"
archived = "2005-04-14"
capture_url = "https://web.archive.org/web/20050414080456/http://www.20at.com:80/article.php?sid=1031&mode=&order=0"

[[comments]]
order = 5
subject = "ومن ترك شيئا لله . . تجربة شخصية ولله الحمد . ."
text = "في الثانوية كان لي جروب مش صايع أوي ومش ملتزم برضوه . . يعني لو صلى الخمس صلوات في آخر اليوم يبقى عمل اللي عليه !!<br />على طول شتيمة وألفاظ وإطلاق بصر والبنت دية لابسة إيه والمغنية دية عاملة إيه . . الخ<br />بس كنت على طول بشعر إني مش منسجم معاهم . . ومش بعرف أسماء المغنينين اللي على طول بيتابعوهم دول . .<br />المهم لما دخلت الجامعة تعرفت بفضل الله على ناس حسيت أول ما شفتهم إني أعرفهم من زمان أوي . . أوي . .<br />حسيت كما يقول رسول الله \" الأرواح جند مجندة \" وإني روحي محلقة معاهم<br />وحبيتهم جدا<br />وكان لهم أفضال عليّ كثير<br />وبفضل الله ، أصبحوا هم أصحابي . . وبرضوه مازلت عايش حياتي ومقضيها . .<br />مش الصلاة والصوم هما الحاجز أمام \" تقضية الحياة \" بالعكس والله . . أنا الآن متلذذ بكل حاجة بعملها وفي طاعة الله<br />بسمع أغاني . . وعندي دش ودي إس إل . .<br />وبتقرج على أفلام وبشوف مسرحيات<br />وكل حاجة . . لكن كله بدون ما أعصي ربنا<br />عمرو مجدي>>>> كلية الطب"
archived = "2005-04-14"
capture_url = "https://web.archive.org/web/20050414080456/http://www.20at.com:80/article.php?sid=1031&mode=&order=0"

