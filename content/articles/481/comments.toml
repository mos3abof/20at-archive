subject = "لبناني"
text = "و لو أخي لو بتتركو الله عجنب مش أحسن ؟<br />الله ما عندو غيركن يفكر في ....<br />حلو عنو يا خيي بس بدو شي منكن بياخدكن لعندو ........<br />شو هالعالم هي"
archived = "2005-04-14"
capture_url = "https://web.archive.org/web/20050414080456/http://www.20at.com:80/article.php?sid=1031&mode=&order=0"

[[comments]]
order = 14
subject = "فعلا والله غربة"
text = "قال الله تعالى ( فخلف من بعدهم خلف أضاعوا الصلاة واتبعوا الشهوات قسوف يلقون غيا ) وقال سبحانه ( فذرهم في غمرتهم حتى حين * أيحسبون أنما نمدهم به من مال وبنين * نسارع لهم في الخيرات بل لا يشعرون)<br />قال رسول الله صلى عليه وسلم ( بدأ الاسلام غريبا<br />وسيعود غريبا كما بدأ فطوبى للغرباء ) ...<br />وأخيرا أقول لأولئك الشباب المتميع دعوا الروشنة والخنا ينفعكم .. ومن كان يريد النجاه فليدرك نفسه قبل أن لا ينفع الندم"
archived = "2005-04-14"
capture_url = "https://web.archive.org/web/20050414080456/http://www.20at.com:80/article.php?sid=1031&mode=&order=0"

