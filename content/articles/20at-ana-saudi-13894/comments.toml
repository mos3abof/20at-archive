[[comments]]
order = 1
subject = ""
author = "رغد"
posted = "2009-11-02"
text = "هسة هو راجل مع العلم هو يعرف من البداية قبل الزواج هي ترتدي البنطلون بس بعد الزواج اتضحت امور من نظرته لان الرجل تتغير نظرتة للمراءة بعد الزواج بالبداية كان ينظر الى محاسنها وهو يتفاخر امام اصدقائه واهله بس بعد الزواج تغير لان هو ينظر بغير منظار لو اقنع زوجته بالمنظار الي ينظر فيه الها اتغير يمكن ما صار طلاق والا هذي مو رجولة لان الطلاق مو موضوع سهل بنوب واتمنى من الاخوان انو يتعقلون لان مو بس امهاتنا اتوصينا بالعقل هم لازم احد يوصيهم بالعقل لان العقل زينة تمام"
archived = "2009-11-05"
capture_url = "https://web.archive.org/web/20091105014548/http://www.20at.com:80/20at/ana-saudi/13894-2009-11-02-09-31-44.html"

