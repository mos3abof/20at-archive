[[comments]]
order = 3
subject = ""
author = "احسان حميدة"
posted = "2009-11-03"
text = "طبعا المفروض انه الخبر في السعودية وعن السعوديين يعني واضح انه العريس و العروس سعوديين.<br />المقدمة ضرورية لأنه الخبر غريب واصلا ما في اي وحده بتطلع بره بيتها بالسعوديه من غير العبايه سواء كانت سعوديه او عربيه او حتى اجنبيه، اقصى شي ممكن ينعمل انه العبايه تكون مفتوحه شوي من تحت ويا دوب يبين الي تحتها سواء بنطلون او غيرو، وعبايات السعوديات عادة والاغلب بتكون مغطيه تماما يعني ما بتفرق شو لابسه تحت العبايه لأنه اصلا ما بيكون ظاهر ولو ظهر يادوب شوي<br />على فكرة انا اردني وساكن في السعودية وشايف شو بلبسو هون"
archived = "2009-11-05"
capture_url = "https://web.archive.org/web/20091105014548/http://www.20at.com:80/20at/ana-saudi/13894-2009-11-02-09-31-44.html"

