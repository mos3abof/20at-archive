author = "اكل عيش"
posted = "2009-08-15"
text = "سكان القبور دي مسئولية الدولة مش مسئولية افراد ولا جمعيات<br />الدولة لازم تتحرك<br />الافراد بيتحركوا لمصلحة انفسهم<br />سلام يا صاحبي<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2009-08-26"
capture_url = "https://web.archive.org/web/20090826234437/http://www.20at.com:80/masr/t7kyk/12932-2009-08-13-13-00-59.html"

