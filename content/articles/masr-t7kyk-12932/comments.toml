author = "جيـــــــــمـي"
posted = "2009-08-15"
text = "وااااااو … فكرة جديدة فعلاً ولفئة بجد محتاجة<br />بس ياريت تكون الجمعية قادرة علي حصر المحتاجين بجد والى بيدعوا الحاجة<br />وانا شخصياً لو اتوفرت معايا فلوس هتبرع لأنهم ناس محتاجين بجد مش اى كلام … علي الأقل بأدوات مدرسية أو بالشنط القديمة الى عندي، او بأى وسيلة كانت .<br />واحنا لازم نساعدهم ومانقولش الحكومة … الحكومة مفقود الأمل فيها وده معروف من زمان<br />طب و الناس دي ذنبها ايه بقى ؟"
archived = "2009-08-26"
