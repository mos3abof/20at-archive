author = "لا تتبرعوا"
posted = "2009-08-13"
text = "هو احنا بندفع ضرايب علشان جيوش الامن المركزى<br />فين فلوس ضرايب المبيعات<br />واذا كنا بنشرب مياة مجارى<br />يبقى فلوسنا بتروح فين<br />فية دولة لها لواء فى كل حارة ولواء محافظ ولواء وزير ولواءرئيس مدينة<br />تقعدهم فى بيوتهم<br />وتصرف على سكان المقابر<br />واليوم فى موقع مصراوى لواء شرطة قبض علية وهو بيبيع ارض لليهود فى سينا بعد ترددة عدة مرات على تل ابيب<br />بيبيعوا سينا لليهود السادة اللواءات<br />محدش يتبرع بحاجة<br />بل ارسلوا الى منظمات الاغاثة الدولية تساعدهم"
archived = "2009-08-14"
capture_url = "https://web.archive.org/web/20090814235904/http://www.20at.com:80/masr/t7kyk/12932-2009-08-13-13-00-59.html"

