subject = "منهج واحد"
author = "باحث عن الحقيقة"
posted = "2006-01-29"
text = "يبدو أن الحكومات العميلةوالموالية لمريكا أصبحت تستخدم منهج واحد، يتم تلقينهم إياهم من قبل البيت الأبيض... ولكن هيهات هيهات ان تنال مثل هذه الحكومات من عزائمنا"
