[[comments]]
order = 1
subject = "الاخوان فين ( .... أهو )"
author = "أكرم بس"
posted = "2006-01-30"
text = "اولا : انا بكره الراجل اللي اسمه فتحي سرور ده فاكر انه في مدرسه و التلاميذ هما النواب ( و اللي مش عجبه المجلس يفوت جمل) و كلنا فاكرين الجلسه الشهيرة بتاعت رفع الحصانه عن أيمن نور ( ربنا يفك سجنه )<br />ثانيا : فين نواب الاخوان من قضية رسوم الكاريكاتير الدنماركيه المسيئة للاسلام و المسلمين ( مش انتوا اسمكوا الاخوان المسلمين برضوا )<br />يا ريت تعملوا زي البرلمان الكويتي و تقاطعوا الدنمارك رسمي و النرويج كمان لانها نشرت كاركاتير قبل كده<br />الواحد مش لاقيها منين و لا منين ( الوطني من امامكم و الاخوان من خلفكم )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142643/http://www.20at.com/article2.php?sid=350"

[[comments]]
order = 2
subject = "الاخوان اهم .... الباقي فين؟"
author = "محمد ابراهيم"
posted = "2006-01-30"
text = "ياعم اكرم بس كل المواقع الاخوانية اتكلكت عن الموضوع دة ونائب اخواني هو اللي قدم طلب احاطة علي هذه الاهانة ولكن السؤال اين المؤسسات والاجهزة الحكومية والاحزاب في كل الدول العربية ولا ايييية؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142643/http://www.20at.com/article2.php?sid=350"

[[comments]]
order = 3
subject = "شكرا محمد ابراهيم"
author = "أكرم بس"
posted = "2006-01-31"
text = "اولا شكرا لانتقادك نفسك يا سيدي قبل ان انقدك<br />انت تقول طلب احاطة و مواقع اخوانية و كلام من اللي الحكومة بتعمله على طريقة ( نشجب نندد نساند )<br />احنا كان املنا كبير في معارضة قوية مش معارضة تنسحب من المجلس<br />فين محاسبة الوزراء و المسئولين . و لو هتقولي الاخوان لسه داخلين المجلس من شهرين بس هقولك الاخوان ماكونش في المجلس و كانت الدنيا بتقوم و بتقعد في كل بر مصر و بحره لما اسرائيل تعمل غارة على فلسطين<br />يا أخي انا خايف ييجيلي احباط من الاخوان و المعارضة كلها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142643/http://www.20at.com/article2.php?sid=350"

[[comments]]
order = 4
subject = "كارت أحمر"
author = "هبة"
posted = "2006-01-31"
text = "بغض النظر عن اتفاقي أو اختلافي مع منهج المقارنةولاسيما بين طرفيها أي صدام والإخوان، إلا أنني أحييكم على الفكرة وعلى تحليلكم إياها، فيبدو أن كلا الموالين لأمريكا قد ضاقوا ذرعا بأي هامش للحرية أو التعبير عن وجهات نظر تخالف مصالحهم... وإن كانت طريقة الكارت الأحمر ليست جديدة عليهم ففي العراق كانت يتم استخدام التصفيات الجسدية، وفي مصر أيضا يحدث إما التهديد أو حتى اختفاء المعارضين في ظروف غامضة.. أما الطرد فهو كارت احمر ولكن بطريقة أكثر دبلوماسية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142643/http://www.20at.com/article2.php?sid=350"
