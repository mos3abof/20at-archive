[[comments]]
order = 0
subject = "مقال جميل"
author = "نونو"
posted = "2006-06-13"
text = "جميل جدا يا منى<br />المقال رائع و يبث في النفس شجونا حول كلمة واحدة هي العزة<br />فعلى الرغم من انها كلمة ، الا ان معانيها و دلالاتها كثيرة جدا ، شكرا على محاولة حصرها في هذا المقال الجميل<br />و اظن ان العزة هي شعور الانسان بانه قوي بالله ، و غني بالله، و عزيز بالله، يتوكل على الله في كل اموره و يثق بربه الكريم<br />اللهم من اعتز بك فلن يذل ، و من اهتدى بك فلن يضل<br />و من استكثر بك فلن يقل ، و من استقوى بك فلن يضعف<br />و من استغنى بك فلن يفتقر ، و من استنصر بك فلن يخذل ، و من استعان بك فلن يغلب<br />و من توكل عليك فلن يخيب ، و من جعلك ملاذه فلن يضيع<br />و من اعتصم بك فقد هدي الى صراط مستقيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124314/http://www.20at.com/article2.php?sid=938"

