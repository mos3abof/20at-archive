text = "لا جديد<br />مجتمع محاصر بالقواعد القبلية والقهر الديني والسياسي والاجتماعي لابد وان ينتهي بهذا الشكل<br />إما متطرفون في التغريب او متطرفون دينيا<br />حاجة تقرف<br />وسلام<br />Dabdoob"
