[[comments]]
order = 2
subject = "ماشي يا دبدوب"
author = "عبدالله مفتاح"
posted = "2006-03-14"
text = "ماشي يا دبدوب ان كان السعوديه مجتمع مقهور فاحنا مجتمع منحل<br />البنات دايرين على حل شعرهم<br />والولاد مبقاش عندهم غيرة على اخواتهم<br />والاب مشغول في الشغل<br />والام بتحقيق ذاتها<br />ادي المجتمع اللي مش مقهور واللي انت عايز السعوديه تبقى زيه<br />ولو عايز تعرف اكتر عن مجتمعنا روح الميري لاند او السينيمات او اركب الاتوبيس المكيف وشوف اللي بيحصل في الحاجات دي ولا اقلك روح بالليل عند سور حديقة حيوان الجيزة<br />هتشوف ان المجتمع مش مقهور ابدا والمجتمع اخر حلاوة لا في قهر ولا في حاجه بس للاسف فيه انحلال ولو عايز السعوديه تبقى زينا في الجهر بالمعاصي<br />السعوديين مش عايزين يكونوا مجتمع بيجهر بالمعصيه ويقولو على نفسهم متحررين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131535/http://www.20at.com/article2.php?sid=562"

