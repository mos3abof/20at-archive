[[comments]]
order = 4
subject = "دعونا نفكر أولا!!!"
author = "أحمد الجمال"
posted = "2006-08-03"
text = "يا جماعة السينما نوع من انواع الفنون يمكن استخدامها بشكل جيد وراق وممكن تكون بشكل مبتذل وهذا ينطبق على كل انواع الفنون الاخرى ولا احد ينكر ان السينما قدمت العديد من الافلام الرائعة مثل فيلم عمر المختار و غاندي وناصر 56 وايام السادات وكل الافلام التاريخية والحربية والتوثيقية المهمة واذا كان الغرب نجح في تصدير افكاره ومبادؤه لنا فلماذا لا نسعي نحن ايضا لانتاج سينما راقية تعبر عن افكار المسلمين في كل مكان في العالم وتصحح صورتهم المغلوطة لدي المواطن الغربي العادي المسألة سهة لكن مشوار الاف ميل بيبدا بخطوة والتوفيق من عند الله المهم النية الخالصة لله ومحاولة تقديم عمل مشرف عن قضايانا العربية والاسلامية نشارك به في المهرجانات الدوليةليري العلم ويعرف من هم العرب ومن هم المسلمون وكيف اننا اصحاب حضارة اساسها التسامح وليس الارهاب وعمادها الاخلاق وليس الطرف او العصبية اوالعنف وشكرا لكل الاراء التي عارضت وجود سينما بالسعودية ولكن يجب الا يعارضوا فقط لمجرد المعارضة بل عليهم ان يعملوا عقلهموأظن أنهم عقلاء.. أحمد الجمال(صحفي مصري بجريدة المدينة المنورة السعودية)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131535/http://www.20at.com/article2.php?sid=562"

[[comments]]
order = 5
subject = "الى السعودين الشحتين"
author = "واحدة وخلاص"
posted = "2006-08-30"
text = "كفا بقى جهل وتخلف السعودين دول مش اهل الايمان ذى ما احنا كنا فكرين طب دا دول اكثر ناس منحلين لان هذا الشعب من الكبت بينحل لدرجة لاتوصف والناس اللى فيهم بالذات اهل المدينة هم احسن ناس لكنالكعبةمنحلة ومش غريبة ان على ناس متخلفين ذى الناس دول اللى لسه بيعقبوا الناس بالكرباج انهم يتكلموا على السينما بالشكل ده واسالوا السعودين عن الملهى الليلى اللى نسوانهم بيرحوه فى البحرين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131535/http://www.20at.com/article2.php?sid=562"
