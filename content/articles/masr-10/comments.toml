[[comments]]
order = 0
subject = "ياريت تنقلوه يوميا..بس تستأذنوا الأول"
author = "محمد السيد"
posted = "2006-03-12"
text = "الحقيقة الفكرة رائعة ...<br />لو ممكن بجد تستأذنوا القدس العربي .. وتنقلوا عنها التقرير اليومي للصحف اللي بيكتبه الأستاذ حسنين كروم .... حأعتبركم أساتذة ...<br />اساتذة بجد ....<br />التقرير اليومي ده من أروع المتابعات اللي الواحد ممكن يقراها يوميا علي الصبح ...<br />بيقل أخبار اليوم كله في اسلوب اكتر من رائع ... وكمان باختصار لا يخل بالمضمون ...<br />والله حتكون خطيرة لو تنقلوا للناس اللي هنا التقرير ده .. شخصيا أنا باتابعه علي القدس العربي. لكن ياريت يكون متاح لكل العشريناتية علي موقعكم ...<br />وبعدين الاستاذ حسنين ... محايد إلي حد كبير في نقل الأخبار \" في النقل بس لكن لما يبدي رأيه أحيانا ينحاز \" لكن والله بجد شعور بالتخمة حيجيلك بعد قراة التقرير كله ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />عايز أغيره ـه ـه ـه<br />mohamdmat@hotmail.com"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015531/http://masr.20at.com:80/article.php?sid=10&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

