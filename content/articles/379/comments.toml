subject = "طيب ..... ومين قال بس أنه غير مسلم :)"
text = "قلت كان يمكن صياغته بطريقة أجمل ، وأكثر قربا للقارئ المسلم ، حتى يكون فيه غرس إيماني في النفس .<br />وبعدين في نقاط مثل العلاقات قصيرة المدى ، مع أنه تم التعليق عليها ، الأفضل لو أنه تم تجاوزها لأنها غير متناسبة معنا تماما .<br />لو كان المقال غير مسلم لما إكتفيت بالتحفظ :)<br />وفقكم الله"
archived = "2004-10-19"
