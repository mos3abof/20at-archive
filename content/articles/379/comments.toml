subject = "واحد يعرف غاندي البلد وسيادة المحافظ"
text = "الموضوع حلو جداً جداً يا أ.شيرين ..ولكن كان بودي أن تذكري أن من أولويات أية علاقة أن تكون قائمة من أجل الزواج وإرضاء لله تعالى .. فالله ييسر لكل من يتحرى الحلال .. أنا لا أعترض على الموضوع فهو ممتاز.. ولكني أؤكد على أن العلاقات يجب ألا تكون في الخفاء وألا تكون مستمرة مع العلم بأنها علاقة غير ناجحة كما ذكرتي ..وهكذا ...<br />فقط أركز على الجانب الشرعي من الموضوع حتى لا يتخيل من يقرأ الموضوع أننا نتحدث عن العلاقات العاطفية العابرة التي تقوم على اسس ونوايا واهية..<br />وسلامي الكبير لسيادة المحافظ .. ولحبيبي غاندي البلد"
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019010053/http://www.20at.com:80/article.php?sid=301"

