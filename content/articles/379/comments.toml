[[comments]]
order = 15
subject = "تيتو بجد"
text = "انا طلقت مراتى من اسبوعين تقريبا<br />اية المشكلة؟<br />المشكلة انها انسانة رائعة جدا ومتدينة ومحترمة وانا انسان ناجح ومتدين ومحترم<br />فى يوم اتنرفزت وضربتها 3 اقلام وبعدها ب 6 شهور ذهبت بهدوء الى منزل اهلها وصرحت لى انها تطلب الطلاق لانها لم تعد تنام منذ ضربها<br />فى الاول ظننت انها تحتاج الى راحة منى ولكن بعد سنتين جربت فيها كل شىء هدايا وتهديد وتوسل وبكاء لم يكن هناك مفر<br />احبها بجنون وتحبنى بجنون<br />ويوم الطلاق كنا كحبيبين حتى ان المحاميين بكوا فقد احتضتها واقسمت عليها ان تاخذ بالها من نفسها فالدنيا بها وحوش ولن اكون موجود لحمايتها وبكت تدعونى لالاهتمام بتفاصيل الحياة وقراءة الاذكار كل ليلة<br />وكان الوداع<br />تقول صاحبة المقالة كلاما نظريا جميلا<br />اما الحقيقة ان الطلاق شىء فظيييع<br />لم ولن استطيع نسيان ارق انسان فى الوجود ماذا افعل<br />اصلى كل يوم واقول اللهم اجرنى فى مصيبتى واخلف لى خيرا منها<br />مش عارف"
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019010053/http://www.20at.com:80/article.php?sid=301"
