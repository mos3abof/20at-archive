subject = "جزاها الله خيرا .. رغم تحفظي على المداخلة .."
text = "المشكلة في المداخلة أنها كانت ترجمة أونقل للأفكار من الدراسات الغربية التي تتناول واقع مختلف في عدة جوانب عنا ، ثم كتبت بأسلوب الكاتبة .<br />لو أنها بدأت من الأحاديث النبوية وقصص السيرة وآراء العلماء المسلمين لكانت أجمل .."
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019010053/http://www.20at.com:80/article.php?sid=301"

