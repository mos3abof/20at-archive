[[comments]]
order = 8
subject = "عصفور"
text = "الأخت شيرين مجدي<br />انا متشكر جدا على مجهودك الرائع بس يا ريت من يكون في الموقع قسم شرعي يشرف على الآراء والمقالات لتحديد ما إذا كان يهتم بثقافتنا الإسلامية ولا لأ ومش معنى كده ان احنا هانحدد إقامتكم لأ طبعا بس عاوزين الوشنة تكون إسلامية ومتخرجش عنها والمقال بصراحة لما قرأته فهمت إن العلاقة دي بين ولد وبنت مصاحبين بعض وعايشين قصة حب وبعد كده انفصلوا والعجيب انك بتحثينا على ان العلاقة تنقلب بعد كده إلى صداقة بريئة أظن دي روشنة خيالية ومتنفعش وممكن تقيسيها انتي هتلاقيها صعبة شويتين عشان احنا بشر والمقال بتاعك موضحش في العلاقة ماإذا كانت خطوبة ولا صحوبية مع الجو بتاعي واتفقنا ان نخليها صداقة بعد كده فيا ترى الشرع بيحثنا على ان يكون فيه صداقة من النوع ده وألف سلام وتحية لجند حماس"
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019010053/http://www.20at.com:80/article.php?sid=301"

[[comments]]
order = 9
subject = "ما نوع العلاقة؟ صداقة !! صاغرا ...ليس في ثقافتنا"
text = "هي إيه نوع العلاقة المذكورة في المقال؟أظن الإسلام لا يرفض أن يحب المرء أنثى والعكس ولكن الخطوة التالية تماما هي الزواج وليس الاستمرار في العلاقة والمقابلات والأحاديث كل هذا ليس في ثقافتنا الإسلاميةثانيا: إذا حدث الانفصال لابد أن لا تكون هناك أي علاقة، كما لابد ألا تكون هناك أي ضغائن أو مكائد أو حقد، أو تطاول، أو دسائس وهذا ما يمليه علينا إسلامنا.ثالثا: ذكرت لفظ صاغرا في حالة عودة أحد الطرفين إلى الآخر، وهذا أيضا ليس من أخلاص المسلم أو الإنسان السوي الذي تنشده كل الأمم، ففي حالة عودة الطرفين يجب أن يكون خفض الجناح والتواضع والحب والمودة والرحمة متوجين لهذه العودة التي قدرها الله، وليس أي شيء غير ذلك وإلا فهذه بداية سيئة للغاية."
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019010053/http://www.20at.com:80/article.php?sid=301"

[[comments]]
order = 10
subject = "أهلا بكم في كوكب الأرض"
text = "ايه يا جماعة! متهدوا اللعب شوية! أنا بس عاوز أعرف كم واحد منكم لم يمر بتجربة حب على الأقل قبل أن يقابل شريكة حياته؟ هو ايه كل الناس اتقلبت ملايكة فجأة كده. إذا كان الرسول نفسه قال \"لم ير للمتحابين مثل النكاح\" يعني الحب سابق على الزواج، ومعترف بيه."
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019010053/http://www.20at.com:80/article.php?sid=301"

[[comments]]
order = 11
subject = "مش تقرأ كويس قبل ما ترد يا أخ انت"
text = "مش تقرأ كويس التعليق قبل أن ترد أو تردي عليه مقدمة التعليق كانت كالتالي:<br />أظن الإسلام لا يرفض أن يحب المرء أنثى والعكس ولكن الخطوة التالية تماما هي الزواج وليس الاستمرار في العلاقة والمقابلات والأحاديث كل هذا ليس في ثقافتنا الإسلامية.<br />وأن يكون لي علاقة قبل الزواج فهذا أمر خاص بي وليس حجة لأحد أو على أحد. ولا مانع من قول النصيحة الحق حتى لو وقعت فيما وقع فيه الآخرين.<br />ولا إيه ياحاج.<br />ولكن الأصل في الأمور أن نحاول الحفاظ على دينا في زمن اخترع اليهود لهم دين من الهواء وبيحافظوا عليه."
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019010053/http://www.20at.com:80/article.php?sid=301"

[[comments]]
