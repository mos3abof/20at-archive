author = "اخر الاخبار"
posted = "2009-07-19"
text = "فى جريدة اليوم السابع<br />الامن تحفظ علية بعد الافراج عنة ولم يطلق سراحة حتى الان<br />والنصارى بتوع العظمة الزرقا عاملين مناحة علشان لسة مقبوض علية<br />اتمنى ان يصدر ضدة امر اعتقال زية زى الاخوان ويتلب 10 سنين فى ابو زعبل يغنى هناك ظلموة"
archived = "2009-07-20"
capture_url = "https://web.archive.org/web/20090720134046/http://www.20at.com:80/masr/2khbar/12692-2009-07-19-06-50-41.html"

[[comments]]
order = 1
subject = ""
author = "واين القاضى؟"
posted = "2009-07-19"
text = "يا ترى القاضى اللى حكم بالبراءة فين دلوقتى \"؟<br />المفتش كرومبو هيدور عنة<br />هيروح يصيف فى الصعيد الجوانى بمزاجة الشخصى وياخد حمام شمس معتبر جنوب داراو<br />او العربية بتاعتة هتقع فى ترعة الابراهيمية نتيجة عدم تركيزة فى السواقة<br />او هيتفرغ لتربية العيال ويطلع معاش مبكر بمزاجة برضة<br />كرومبو وسحس هيقولوا لنا"
archived = "2009-07-20"
capture_url = "https://web.archive.org/web/20090720134046/http://www.20at.com:80/masr/2khbar/12692-2009-07-19-06-50-41.html"

