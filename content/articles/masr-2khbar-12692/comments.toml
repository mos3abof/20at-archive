text = "يا ريت واحد يبلغ عن زخارى انة بيكتب زجل فية اهانة علشان يستضيفوة عند خالتة فى امن الدولة وخالتة تاكلة كسكى ناشف فى لاظوغلى"
archived = "2009-07-20"
