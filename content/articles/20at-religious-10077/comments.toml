author = "بنت الاسلام"
posted = "2008-09-16"
text = "سبحان الله يعنى انا بستغرب على الناس دى ، يعنى انا عايشة فى اوروبا والواحد بيدور على جو رمضان ده وما بيمنعاش عن صلاة التراويح الا بعد مسافة المسجد او بسبب ان الوقت بيكون متاخر لان الصلاة بتخلص الساعة 11 ونص بالليل<br />لكن الناس دى المسجد تحت بيته وصحتهم ما شاء الله ويتحججوا بالمسلسلات او بالقعدة الحلوة، ياترى يسرا هاتنفعهم يوم القيامة<br />بجد مش عارفة اقول ايه<br />ربنا يثبتنا"
archived = "2010-01-04"
capture_url = "https://web.archive.org/web/20100104121020/http://www.20at.com/20at/religious/10077-2009-08-21-19-58-04.html"

[[comments]]
order = 1
subject = ""
author = "مواظبة ولله الحمد والمنة"
posted = "2008-09-16"
text = "كل واحد بيتحج بالمسلسلات والذى منه حالنا فى الغالب قبل الأستمتاع بصلاة التراويح وندوق حلاوة طعمها بقينا بنستسهل حتى فى الوقوف لربنا<br />اللهم أرنا قلوبنا بحب القرب منك<br />آآآآآآآآآآآمين"
archived = "2010-01-04"
capture_url = "https://web.archive.org/web/20100104121020/http://www.20at.com/20at/religious/10077-2009-08-21-19-58-04.html"

[[comments]]
order = 2
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-09-21"
text = "انا عندي طفل رضيع مالنزول بيه صعب، ومع ذلك بحرص على أد ما أقدر أصلي التراويح في المسجد، ولو مقدرتش بصليها في البيت، وطبعا لو ابني مزاجه مش أد كده وحسيت انه حيعمل ازعاج للمصلين، برضه بصليها في البيت، بس انا بحرص على اني ارضعه واغيرله واعمل كل شي تمام قبل الصلاة علشان ميعيطش في الصلاة وينام نوم هادئ.<br />إلى كل البنات استغلوا فترة عدم الانشغال اللي انتوا فيها. روحوا صلوا في المسجد قبل ما تتجوزوا وتخلفوا عيال يخلوا الصلاة في المسجد صعبة عليكم"
archived = "2010-01-04"
capture_url = "https://web.archive.org/web/20100104121020/http://www.20at.com/20at/religious/10077-2009-08-21-19-58-04.html"

[[comments]]
order = 3
subject = ""
author = "ياسر"
posted = "2009-08-25"
text = "والله العظيم صلاة التراويح متعة يا جماعة ولو عرف اصحابنا دول ما فيها من فوائد للجسم والروح هايسبو الهبل ده بتاع يسرا وبتاع حفلات الهراوي ويروحوا يستمتعوا بالساعة ونص بتاعت التراويح في مسجد نظيف ومريح وخلف امام عذب الصوت..<br />دي فرص كل سنة مرة ويسرا محطزطة في التليفزيون طوللا السنة ..هي عزيمتنا اللي ضاعت خالص .."
archived = "2010-01-04"
capture_url = "https://web.archive.org/web/20100104121020/http://www.20at.com/20at/religious/10077-2009-08-21-19-58-04.html"
