[[comments]]
order = 2
subject = "احنا السبب"
author = "مسلمة من فلسطين"
posted = "2006-07-18"
text = "احنا السبب في كل الي بيحصل لنا, احنا المسلمين مشكلتنا اننا منكره بعض, في العراق مندبح بعض زي الحيوانات , حتى الحيوانات دبحها ارحم, دايما متفرقين, حكامنا خونة, بس شاطرين نعمل نفسنا الضحية, وكل الي بيحصل سببو اليهود والامريكان, السبب هو الفوضى الي احنا عايشينها , الجهل والظلم والضلال...<br />الله يهدينا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153852/http://www.20at.com/article2.php?sid=1086"

[[comments]]
order = 3
subject = "أسف"
author = "عباس الابيض"
posted = "2006-07-19"
text = "أسف يا أخت يا هوووبه بس و الله العظيم من غلبى الناس بتغلى و دول على قلبهم مراوح و مش عارفين إن بكره و ده جاى أكيد هيتعمل فينا كلنا اشد و أعظم من اللى بيحصل فى لبنان و ما حدش يفتكر إنه علشان بيطاطى فاليهود و الامريكان هيرحموه و خليهم يتعظوا من صدام اللى فى أخر أيامه كان ميطاطى و فتحلهم حتى غرف نومه على البحرى علشان يبحثوا على أسلحة دمار الشامل و برضه ده مرحموش و منع عنه اللى هوه و شعبه فيه دلوقتى .... أقول إيه و أعيد إيه بس ده أنا هأتشل و الله ... بلاء و الله العظيم بلاء من ربنا هنعمل إيه و المصيبة إنهم ما بيجرلهومش حاجه و إحنا اللى بنروح فى الرجلين و بنتقتل و بيتمص دمنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153852/http://www.20at.com/article2.php?sid=1086"

[[comments]]
order = 4
subject = "تسألون"
author = "وليد الباز"
posted = "2006-07-19"
text = "أناس يتحدون الحصار بأجسادهم وأطفالهم، وآخرين يقاومون ويطلقون آخر رصاصة في أيديهم ولا يركعون لمحتل غاشم.. والدور علينا، فماذا نحن فاعلون...<br />نائمون<br />نائمون<br />نائمون<br />وبالنعال علي الروس تضربون<br />صامتون<br />كصمت القبر<br />خائفون<br />كخوف الفأر<br />وعلي المقاعد جالسون<br />ثم تسألون ماذا تفعلون<br />لو تعرفون<br />طعم الذل تستمرقون<br />وفي الهوان تمرحون<br />يا ألف مليون<br />يا ليتكم تستيقظون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153852/http://www.20at.com/article2.php?sid=1086"
