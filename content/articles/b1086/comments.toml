[[comments]]
order = 0
subject = "إتحرك"
author = "عباس الابيض"
posted = "2006-07-18"
text = "مش عارف ليه حكامنا الأشاوس على رأى الاخ صدام ربنا يفك سجنه بإعدام إن شا ء الله ضاعت منهم أى أثر لمروءة أو شهامه أو حتى حتى إنسانية و بقم لا مؤاخذة و ما أقصدش أزعل النسوان مننا أقول لا مؤاخذه كل الحكام المفروض يلبسوا طرح و يستخدموا \"أولويز بالأجنحة\" يعنى من الأخر مفيهومش راجل أقسم بالله ان عندى ألبوم صور للمناظر اللى بتجرى للناس فى لبنان فتحته مره واحدة بص و مش قادر أفتحه تانى و أبص على المناظر دى و لو يحب أى حاكم عربى أبعتهوله على إيميله علشان يحس على دم اللى خلفوه شوية أنا مستعد و يا ريت يركز شوية فى صور الاطفال المتقطعين أو اللى طايره جته من دماغهم أو محروقين و ما بقاش منهم صباع حتى ده غير الرضع المرمين على السراير و غرقانين فى الدم بعد ما قطعوا النفس أقسم بالله لو شاف الحجر الالبوم ده لتحرك و عمل أى حاجه يا حكام يا ولاد المتــ ... يا اللى ما خلفكوش راجل اذا ما حركتناش مشاعرنا و عواطفنا و رحنا ننصر إخوانا فى الانسانية حتى مش هأقولكم فى الاسلام و لا فى العروبة يبقى إيه لزمة عيشتنا يعنى ناكل و نشرب و لا م}اخذة ندخل الحمام و تعيش زى البهايم و بكده نبقى عاقلين يا مخنث إنتا و هو يا اللى الامريكان و الاسرائيليين عملوا مؤاخراتكم أنفاق قول كلمة حق مرة فى حياتك و كل واحد فيكم أصلا رجله و القبر و أصغر واحد فيكم عنده 75 سنة غير العيال زى بتاع الاردن اللى دم الخيانة بيجرى فى عروقه و أدمن الخيانة زى عينيه و كان عازم الشرموط التانى اللى إسمه أولمرت قبل اللى حصل ده بحوالى أسبوعين و كان بيتغدى مع الخنزير اللى راح فى داهيه شارون فى مزرعة البغل شارون بياكلوا خرفان و معيز (كان عازمه على قرايبه) إصفوخ على خلقة اللى نفضك إنتا و هوه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153852/http://www.20at.com/article2.php?sid=1086"

