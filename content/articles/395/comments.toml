[[comments]]
order = 0
subject = "مصـ( الخير )ـعب"
text = "هذه رسالة وصلتني اليوم من احد أصدقائي :<br />\"أصلا أنت ما تستاهلش رسالة ولا رنة!!<br />تستاهل كف يترفع...<br />يترفع ....<br />يترفع...<br />و يدعيلك بالجنة!!"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024132505/http://www.20at.com:80/article.php?sid=684"

[[comments]]
order = 1
subject = "ها"
text = "هاهاهاهاهها... حلوة"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024132505/http://www.20at.com:80/article.php?sid=684"

[[comments]]
order = 2
subject = "والله"
text = "الحمد لله مبسوطين؟<br />بس يا جماعة مش برده كدة شركات الاتصالات هي اللي بتكسب من على قفانا؟<br />كل سنة وانتوا طيبين"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024132505/http://www.20at.com:80/article.php?sid=684"

[[comments]]
order = 3
subject = "مكسوفة"
text = "هو ليه يعني عشرينات مانعة نمر التلفون ؟؟<br />مش كانت تبقى لفتة لطيفة برضو لو بعت الموقع تهاني للأعضاء<br />(أصلا بعد الفصاحة دي أنا قافلة موبايلي)<br />طبعن هتسألوني ليه ؟؟ إحم إحم ، عشان ممكن ينفجر من كتر الرسايل اللي بتيجي (اللهم لاحسد)<br />لكن يعني ، فاتحة المجال في الإيميل أي حد نفسه يبعت لي إس إم إس على الميل مفيش أي مشاكل<br />(( وضعت مكسوفة إيميلها وحذفناه بالعند فيها مع تحيات بهزر معاكو))"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024132505/http://www.20at.com:80/article.php?sid=684"

[[comments]]
order = 4
subject = "القيصر"
text = "مرسي جدا يا مصعب الخير انك بتنشر الرسئل الي ببعتهالك على موقع عشرينات<br />قولهم الرساله الثانيه الي بعتهالك كانت بتقول ايه؟؟؟"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024132505/http://www.20at.com:80/article.php?sid=684"

[[comments]]
order = 5
subject = "مقدام"
text = "السلام عليكم<br />هذا موضوع رائع و شيق و ليس محرج<br />الملاحظ ان اليمين المتدين بدا يسيطر اكثر من الماضي فبدأ عدد الشباب المتدين بالازدياد و الحمد لله ، و اليسار بدأ بالإندحار .<br />اما التشات في رمضان مع البنات لا استطيع الفتوة فيه على العموم اللهم ارنا الحق حقا و الباطل باطلا<br />تحياتي"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024132505/http://www.20at.com:80/article.php?sid=684"

[[comments]]
order = 6
subject = "مصـ( الخير )ـعب"
text = "حاضر يا عم القيصر ...<br />الرسالة التانية بتقول:<br />\"فضحتني.....زماشي يا مصعب أشوف فيك رسالة تشقلبك(عشرينات)\"<br />بس عندي سؤال:<br />يعني ايه؟!!!!!!!<br />ملحوظة:<br />الرسالة مكتوبة كما جائتني , حتى عدد النقاط راعيت فيه الدقة.."
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024132505/http://www.20at.com:80/article.php?sid=684"

[[comments]]
order = 7
subject = "القيصر"
text = "ماشي يا عم مصعب الخير ابقى قابلني لو بعتلك رساله تانيه او حتى اديتك مسد...ولو راجل بقى قولهم اخر رساله كانت بتقول ايه"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024132505/http://www.20at.com:80/article.php?sid=684"
