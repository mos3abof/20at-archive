[[comments]]
order = 8
subject = "اميره المشد"
text = "شكرا جدا على الموضوع وهو فى الحقيقه مفيد جدا وانا عندى حل كويس لقشره الشعر وهى مزج بعض كميه من الخل مع عصير الليمون ووضعهم على الشعر قبل اغتسال الشعر وعلى فكره عايزه اقول حاجه لياسمين لو كل فتاه نفذت كل النصائح دى مش هايبقى عندها وقت انها تعتنى بشىء غير شعرها فقط فارجو من جميع الفتيات ان يهتموا بانفسهم ولو باشياء بسيطه ولا يحاولون استخدام كل هذه الخطوات بل يكفى خطوه واحده فقط او اثنين<br />وشكرا لقراءه ردى"
archived = "2004-06-18"
capture_url = "https://web.archive.org/web/20040618165035/http://www.20at.com:80/article.php?sid=161"

[[comments]]
order = 9
subject = "Dino"
text = "السلام عليكم اخوتى فى الله , و جزاكم الله خيرا على تعليقاتكم و انا اقرتح ايضا استخدام الزبادى ,اى حمام زبادى على الشعر فبل الاستحمام و يبقى على الشعر حتى يجف , و يسلام لو اضفتى عليه كام ثومة هتلاقى النتيجة راااااااااااائعة فهذه و صفة مجربة ..<br />ماسك التوم + الزبادى على الشعر لمدة نصف ساعة فى الاول بعد كده ممكن تحطيه لفترات اطول .و ستشعرى طبعا بحرقان فى الرأس من تأثير الثوم لنكن بعد غسل شعرك ستشعرى حتما بالفرق فى النعومة و سهولة التسريح .بس لازم يغسل الشعر جيدا حتى نزيل رائحة الثوم ,الرائحة تكون موجودة طول مالشعر مبلول فقط و نعد جفاف الشعر فلن تشعرى بالثوم خالص..و لوحد فروة شعره حساسه بلاش يستعمله .."
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803234636/http://www.20at.com:80/article.php?sid=161"

