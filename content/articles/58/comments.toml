subject = "نصيحةلعلاج لتساقط الشعر- مريم"
text = "عليك بتدليك فروة رأسك بين الحين والآخر (كل يوم أو يوم بعد يوم) وذلك بوضع الأصابع بإحكام علي فروة وتحريكها حركة دائرية مع ملاحظة استعمال أطراف الأصابع (دون الأظافر) ثم تنقل الأصابع من مكان إلي مكان حتي تضمني تدليك فروة الرأس كلها ثم قومي بتمشيط الشعر بالفرشاة وهذه العملية مفيدة جدا جدا لتنشيط الدورة الدموية في فروة الرأس وتنشيط بصيلات الشعر مما يؤدي إلي تقويته..."
