text = "لا بجد في ناس بتتفلسف اوي زيادة عن اللزوم و تعمل نفسها ياما هنا يا ما هناك و هما اصلا دماغهم فاضية و يبقى همهم الاساسي يحطوا اى نيك نيم عجيب علشان يخلوا الناس يكلموهم في معنى النيك نيم و ده ارخم انسان شفته فى حياتي اللى يعمل نفسه حاجة و يحاول يأخد اهتمام الناس بأي شكل من الاشكال حتى ل و كان النيك نيم<br />و يا سلام بقى لو سألته ايه معني اسمك النهاردة على الماسنجر و يفضل بقى يسنتح عليك و يعمل نفسه الواد الفاهم و هو فى البلالة"
