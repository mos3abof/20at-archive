text = "كله كوم والى غير خطة زمايله وبعد ما قعدوا فى المطعم الى هو قايل عليه قالهم أصلي مش هاكل ده كوم تانى لوحده …lol … ده رخم رخم يعنى مش أي كلام .<br />بس فيه نقطة .. أنت بتقول عدم الاتصال به على تليفونه الخاص امنحه فرصه كي يتعرف عليك أكثر و يطلب هو منك ذلك … طب مهو لو كل اتنين فكروا بالطريقة دى يبقى ماحدش هيتصل لا ده ولا ده .. لأن ده هيقول أستنى لما ده يتصل والعكس .<br />وعايز اعرف أيه علاقة الـ Nick name بالرخامة …<br />ممكن يكون رمز انت بتحبه او كلمة بتفكرك بحاجة .. أعتقد أن الأسم مالهوش علاقة بالموضوع ده نهائي .. وكمان ممكن واحد صاحبى يكلمنى فيه من باب الحج عشم<br />لكن يطلع يبصلى ويكلمنى من شباك الحاج امر أو التهجم .. فده مش مقبول .. ومادام الأسم أياً كان مش عيب .. يبقى ماله بقى ؟؟؟؟<br />بس الموضوع ده حلو بجد لأنه لامس الشباب"
