text = "اولا الحياه مليانه بالمتاعب والمفاجات اعتبرى كل موقف بيحصلك على انه شيىء افضل ربنا بعته ليكى صدقنى الحياه حلوه ولازم تكونى اقوى منها علشان تقدرى تحسى بالسعاده وتعيشها واكيد لازم يبقا فى شوية مجود منك علشان تكونى سعيده وحاولى بقدر الامكان انك تجددى حياتك اليوميه علشان مش تحسى بالممل<br />ربنا يسعد كل الناس ويحقق كل امنيتهم"
