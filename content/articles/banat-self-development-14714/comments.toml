author = "noor2000"
posted = "2010-01-03"
text = "اقتباس سوزي:<br />ولو كان الملل بسبب عدم الشغل والفراغ العاطفي ايه الحل ازاي انظر لدا بايجابية تطلعني من حالة الكآبة اللي انا فيها دلوقتي<br />علي فكرة انا زيك كده بالظبط وكنت مكتئبة جدا وكنت حاسة ان الدنيا والحياة صعبة اوي ومش قادرة اعيشها بس من فترة قريت حاجة زي مقالة كدهخلتني غيرت كل ده كانت بتقول انك متفكريش في الجانب المش كويس في حياتك لا فكري في اذاي تسعدي نفسك باي طريقة فكري في الناس اللي حوليكي اللي بتحبيم وبيحبوكي مش لازم يبقي في ارتباط عاطفي عشان تبقي سعيدية عيشي كل يوم وكانة اخر يوم في حياتك حبي الناس اللي حوليك وحاولي تسعديهم مش لازم تبقي بطلة في حياتك لا ممكن يكون ليكي دور مهم في حيات اصحابك او اهلك وصدقيني لما تحسي ان في حد محتاجلك في حياتة وميقدرش يستغني عن وجودك هتحسي انك سعديو الارتباط والحب مش هو بس اللي ممكن يخلي الانسان سعيد ومش هنكر اني نفسي احب واتحب بس خلي في بالك انك مرحلة وليها حلوها ومرها عيشي حياتك واخرجي واتبسطي ودوري علي شغل واكيد الحب هيجي في وقتة متستعجليش انا مؤمنة بكده وياب انتي كمان تعرفي تعملي كده . dode"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107114123/http://www.20at.com:80/banat/self-development/14714-2010-01-03-08-37-39.html"

