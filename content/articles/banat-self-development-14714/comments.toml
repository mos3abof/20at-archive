text = "كل دا كلام جميل بس السىء انك ما تقدرش تطبقة على نفسك فعلا الحياة مملة والايام شبة بعضها ولو خرجتى يوم مش هتخرجى التانى خصوصا لو مسئولة عن بيت وزوج وطفل والزوج للاسف مش بيقدر احتياجك للتغيير ما ينفعش نقول غير ربنا يرحمنا"
