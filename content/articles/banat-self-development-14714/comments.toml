author = "Meera Maaro"
posted = "2010-01-04"
text = "انا بجد كانت حياتى ايام الجامعه حلوة عشان خروجات وفسح وكل شىء بس بعد ما خلصت جتلى حالة زهق لان اصحابى اشتغلوا وبعدنا كلنا عن بعض عشان الحياة…وانا ناو بعمل دبلومة بس فى حالة زهقق وملل برضوا وانا من نفسى بعيدة عن كل الناس…مش عاوزة اشوف حد ولا اتكلم مع حد .وكمان ماليش اصحاب بنات دلوقتى لانهم اتجوزوا وعاشوا حياتهم بس اصحابى دلوقتى كلهم ولاد ودة اللى مضايقنى حقيقى لان صعب احكى وافضفض معاهم زى البنت…ونفسى اعمل تغيير فى حياتى واحس بتجديد وتغيير بس مش عارفه ازاى"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107114123/http://www.20at.com:80/banat/self-development/14714-2010-01-03-08-37-39.html"

