author = "ضربة حظ"
posted = "2009-06-19"
text = "اولا البطل الحقيقى فى تلك المباراة هو حارس المرمى الحضرى - فقد انقذ المرمى من عدة اهداف محققة واكيدة - ولة كل الشكر<br />ان لعب الفريق كان متواضعا وواضح من البداية ان الايطاليين كانوا يتوقعوا الخشونة فكان كل واحد بيخاف على نفسة من المصريين<br />ثالثا انة احيانا بتييجى مع العور طابات فلا داعى لكل تلك الفرحة الغير مبررة فمصر ومجد مصر وكرامة مصر ليس مرتبط اطلاقا بمبارة كرة قدم ي[ *** ]بها هذا الفريق او ذلك<br />المهم يا شباب الاستعداد لما هو ات"
archived = "2009-06-22"
capture_url = "https://web.archive.org/web/20090622032442/http://www.20at.com:80/masr/t7kyk/12408-2009-06-19-14-56-22.html"

[[comments]]
order = 2
subject = ""
author = "مصرى أبن مصرى"
posted = "2009-06-19"
text = "بسم الله الرحمن الرحيم<br />اللى حصل يا جماعه مش مجرد صدفة و لا حب و لا شطارة ده توفيق من ربنا كبير جدا جدا و مهارة المصرين الحمد الله هزموا ايطاليا و قبلها كانوا مهزومين من الرازيل بهدف ده انجاز لينا و حتى لو لا قدر الله طلعنا من البطوله يكفينا اننا علمنا على الناس اللى فاكرين اننا ضعاف و الحمد الله مصر كلها كانت بتدعي للناس دى مسلمين و مسيحين احنا الحمد الله كبار قوى قوى قوى بقوة ايمنا بالله و الآصرار و العزيمه احنا الحمد الله انتصرنا فى 73 و بنحقق نفس الآنتصار فى 2009 و برده على …<br />لو سألتك انت عربي تقلي ايه ؟<br />قولى عربي ابن عربي و ابن العروبه الله عليه<br />قولها باعلى صوت<br />و ارفع رأسك افوق<br />انا عربي و ابويا عربي<br />و سمارى و لونى عربي<br />و ابن مصر الله عليه<br />ابن مصر الله عليه"
archived = "2009-06-22"
capture_url = "https://web.archive.org/web/20090622032442/http://www.20at.com:80/masr/t7kyk/12408-2009-06-19-14-56-22.html"

