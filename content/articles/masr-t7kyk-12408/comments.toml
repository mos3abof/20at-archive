posted = "2009-06-19"
text = "هذا اهم انجاز من 35 سنة فاتت<br />غلبنا ايطاليا<br />اهم من حرب اكتوبر واهم من السد العالى واهم من اى ضربة جوية<br />غلبنا ايطاليا<br />هية هية هية<br />عرفتم تغلبوها قبل كدة - لم يحدث<br />غلبنا ايطاليا<br />طز فى السد العالى وطز فى حرب اكتوبر<br />هية غلبنا ايطاليا"
