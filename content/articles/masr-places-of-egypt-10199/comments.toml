text = "عند بيت جدى شجرة خضراء كبيرة فيها زهرة صفراء اوراق الزهرة رفيعة مثل الشعر ومجتمعة كانها شعر دقن ولها رائحة جميلة جدا<br />وكانت شجرة دقن الباشا تجعل حوش بيت جدى معطر وخصوصا فى وقت العصر<br />وقد ماتت تلك الشجرة من فترة<br />المصيبة ان لا احد يهتم بتلك الاشجار المصرية الاصيلة زى شجر الجميز ودقن الباشا والسرسوع وبيجيبوا شجرة مستوردة من برة خضراء يزرعوها على جوانتب الشوارع مش عارف اسمها اية مفيش فيها اى زهرة ولا اى ريحة ولا اى جمال"
