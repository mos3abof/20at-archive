[[comments]]
order = 5
subject = "مجانيين التكنولوجيا"
author = "محمد الشرقاوي"
posted = "2006-05-11"
text = "لم استغرب الفكرة الا انها جديدة فمن حق هذا اشليخ الديجيتا ان يقوم بتسجيلها براءة اختراع له<br />الا انني ااخذ عليه ان قام بعرضها باور بوينت على جموع المصلين بعد احضار شاشاة متخصصة لذلك - الا انني ارفض ان يتم ذلك فللصلاة قدسيتها الا انني اتوقع ان تكون هذه هي السمة خلال السنوات المقبلة بحيث يخرج المصلين كل منهم في يدة سي دي بموضوع الخطبة واللاصة معا .<br />او ان تجد احدهم ويشبه لي يحمل في جعبته فلاش ميموري يحمل عيله من اللاب توب موضوع الخطبة<br />وسلم لي ع الحكومة التكترومية .........وعجبي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123737/http://www.20at.com/article2.php?sid=790"

