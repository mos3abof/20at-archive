subject = "يا جماعة ركزوا فى الموضوع"
author = "شريف"
posted = "2006-05-13"
text = "يا جماعة مش كل واحد هايخرج عن النص هانخرج احنا كمان معاه و على رأى الشاعر : لو أن كل كلب عوى ...... و شكرا<br />أما بالنسبة للموضوع بتاعنا فإن هذا الأمر قريبا سوف يصير أمر عادى فإنى أذكر أن فى الجامعة كنا نستغرب الData Show فى البداية ثم أصبح شىء عادى و الأن الLabtop أصبح فى الجامعات شىء عادى حتى أنى أصبحت لا أحس بوجوده أما بالنسبة للخطبة نفسها فلا يوجد مانع شرعى من قراءتها سواء من ورقة أو Laptop.<br />و شكرا"
