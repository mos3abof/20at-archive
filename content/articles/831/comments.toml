author = "الجندي المجهول"
posted = "2006-06-29"
text = "قد جهزت عندنا نحن في المغرب جل المساجد باجهزة تلفاز وكدلك فيديوا التلفزة من حجم 21 بوصة وقد علقت على علو 03 امتار لا يمكن مشاهدة ما تبثه تماماعلما ان المساجد واسعة ولا تشغل الا بادن الوزارة المختصة ربما ان وزيرنا المحترم له فائض في الميزانية او هناك صفقة مع احد اقربائهاو ان الصينيين تصدقوا علينا بباخرة من الاليكترونيات"
