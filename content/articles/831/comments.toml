text = "2ـ لمحمد رمضان : وياسلام بقى لما الجهاز يهنج !<br />3ـ وليد : يا جماعة وليد مكتوب له ف الروشيته ( أكتب أنا وليد من مصر وسعيد ) 5 مرات ، على طريقة قول أنا مش صغير قزعة !<br />بس مش هنا يا وليديا بابا ... المفروض دي ف البلوج الخاص بيك ... اكتبها لبليل"
