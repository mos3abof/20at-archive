[[comments]]
order = 0
subject = "هههه شيخ ديجيتال"
author = "محمد رمضان"
posted = "2006-05-10"
text = "فعلا شيخ ديجيتال ... بس المضحك فعلا انك تلاقي نسخة الويندوز اللي شغال عليها ( مكركه ) او شغاله بسريال مضروب .. وده شيء أكيد ...<br />الا اذا كان شيخ محترف قوي ومنزل لينكس ...<br />والا ايه بقى ... عينك ما تشوف الا النور وهو بيشغل الجهاز و السيستم وقع ...<br />هتبقى مهزلة .. هههههههه<br />بصراحة الفكرة سخيفة لان اعتقد الواحد بيبقى اساسا متضايق من الشيخ اللي بيقرا من ورقه ما بالك باللي بيقرا من لاب توب ... سخيفة فعلا .. الحكاية دي ماشوفتهاش فعلا الا في السعودية .... شيوخ بيقرو من ورق ...بيبقى الخطبة دمها تقيل وحاسس انك عاوز تقوم تروح ...<br />بس تقول ايه .. ربنا يهديهم ...<br />قريب فعلا هتلاقي الخطيب داخل ومعاه بروجكتور و يقفل النور ويعرض الخطبة ... كنوع من توفير الوقت ..<br />ربنا يهدي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123737/http://www.20at.com/article2.php?sid=790"

