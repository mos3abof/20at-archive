[[comments]]
order = 10
subject = "ما احنا نيجى عند الشيوخ ونتصدر"
author = "oya funny"
posted = "2006-05-18"
text = "ما هو لازم يطلع المنبر بلاب توب او ورقه لان دلوقتى زمن مبقاش فيه شيخ ولا حد يعرف حاجه اقول للاخ غيور مشكله الارهاب مش فى خطبه الجمعه دى ركن اساسى من صلاه الجمعه المشكله فى الشيوخ نفسهم والمشكله كمان فى شيوخ الازهر بقى كل واحد يربى ذقنه وتانى يبنى جامع خلاص بقى شيخ ونعمله قديس ونسمع كلامه امال فى عقلنا والقران والحديث اللى المفروض احنا نفسنا نقراه عشان نتأكد وكمان فيها ايه لما نستخدم التكنولوجيا فى الجوامع هو جينا على الجوامع واتصدرنادا حتى لما يكون جامع متطور وفيه تكنولوجيا هيخلى الناس تنبهر وتحب اسلوب الدعوة الجديد مش بدل ما الشيخ يفضل نايم واحنا نايمين وراه وجاين تقولوا حرام ولا حلال على دى مش بقولقو بنيجى على الهايفه ونتصدر!!!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123737/http://www.20at.com/article2.php?sid=790"

