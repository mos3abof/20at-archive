subject = "بالجملة !!"
author = "1ـ المعلومات اللي عندي بتقول إنه طلع بجهاز محمول كمبيوتر مش لاب توب ... وأعتقد إن هذا ماحدث! ، عمومًا هوا بيستعبط"
