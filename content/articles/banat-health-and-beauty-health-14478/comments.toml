posted = "2009-12-24"
text = "انا برضه زهقت من الرجيم وبجد بجد شايفه انه مشروع فاشل احنا لو عملنا اللى مكتوب فوق هيبقى حاجه هايله بس نتبع السعرات الحراريه اكل 3 واجبات فى مواعيد منتظمه يوميا التعامل مع الجسم على انه مكينه لو ماتبعتش الكاتلوج هتبوظ والكتالوج بيقول ان الاكل يبقى صحى بدون سعرات حراريه كتير والاكل يوميا فى نفس الميعاد علىان يكون الفرق بين كل وجبه 5 ساعات و على ان تكون اخر وجبه الساعه السابعه كمان لو حسيت بالجوع ناكل تفاحه بس تكون قبل النوم بساعتين وكمان مننساش ان فى اسناك يعنى حاجه خفيفه بين الوجبات وده غالبا يكون تفاح او برتقال حاجه خفيفه مافيهاش سعرات حراريه كتير ومننساش ان الفرق بي الوجبه الخفيفه والوجبه الاساسيه يكون 2 ساعه ونصف تقريبا و طبعا مننساش شرب المياه علشان ده بينقص الوزن اوييي"
