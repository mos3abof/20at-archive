text = "المشي فعلا مفيد جدا للجسم انا متابعه مع دكتور تغذيه وقالى على شوية حجات هقولهالكم عشان كلنا نستفيد سوا<br />اولا قالى انو لازم كل يوم الصبح على الريق كوبايتين ميه وقبل كل وجبه كوباية مايه دى هتقلل من اكلنا شويه بلاش ميه وسط الاكل يا جماعه مفيد جدا موضوع الشرب قبل الاكل ده<br />كمان قالى على المشي والطريقه الصحيحه للمشي هيه المشي بخطوه سريعه مش براحه ولا اننا نقف نتفرج على المحلات لازم نمشي بخطوه سريعه<br />كمان عرفنى انو اول نص ساعه مشي دى تسخين للجسم فقط وحرق الدهون بيبتدى من اول النص ساعه التانيه يعنى المده الصحيحه للمشي يوميا ساعه على الاقل وفى اى وقت مش لازم الصبح يعنى الموقع جميل جدا شكرا ليكم بجد"
