text = "واحد من الناس قالنا أنتوا مباحث يا بية ...والتاني قال يمكن عرب وجايين يتفرجوا وقالوا بالمرة نصور والتالت قال أكيد دول بتوع المساحة وجايين يصوروا العتبة علشان يبيعوها في الخصخصة والاخير أول ما شافنا زعق بأعلي صوته وقال صحافة يا رجالة كله يجري ...<br />بيرو"
