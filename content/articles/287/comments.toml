subject = "لمبة محروقة"
text = "أنا بعتبر العمل دا يا بيرو مغامرة بجد<br />أنا لو مكانك أكيد هاكون منفعلة جدًا<br />بس عارف ..<br />أنا يمكن عشان مش حاسة في الدنيا<br />كل اللي فكرت فيه ؟؟ :(<br />الولد اللي معاه كوبيات بيبيع فيها عصير دي ( خمنت انه لموناتة ) ياترى غاسل الكوبيات كويس ولا لا وعامل العصير ازاي .. بعدين ياترى في ناس بتشرب منه ؟؟ ولا بيتقرفو مثلا ؟؟ ولا هو بيوزع من مطعم نظيف ؟؟<br />ومستنين مغامرتك الجاية<br />وكاميرا مصعب<br />تسلموووووووووووووو<br />وكمان سلام للي في بالي"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044036/http://www.20at.com:80/article.php?sid=600"

