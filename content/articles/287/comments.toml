subject = "موقع عشرينات"
text = "نشكر الأخ العزيز وائل عباس على تواصله الدائم معنا، وننوده إلى أننا سننشر الصور التي أرسلها في موضوع منفصل خلال هذا الأسبوع، ونعتذر عن إزالة الصور من هنا لما سببته من بطء في فتح صفحة الموضوع، ونحب أن ننوه إلى أننا نتلقى مشاركاتكم على البريد الإلكتروني:<br />contact20at@yahoo.com<br />ونرجو منكم أن تقبلوا اعتذراتنا عن كل من أرسل إلينا رسالة ولم نرد عليها؛ نظراً لعطل فني أصاب بريد الموقع الأسبوع الماضي ولم يمكننا من فتح الرسائل، ونعدكم بالرد سريعاً على كل رسائلكم."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044036/http://www.20at.com:80/article.php?sid=600"

