[[comments]]
order = 9
subject = "الاخلاق هو السول ليس الاهو"
author = "سارة سليمان"
posted = "2006-02-09"
text = "الاخلاق بتشم حاجات كتيرة اوى معظمها تعاملات ولذلك قدوتنا فى ذلك هو الرسول صلى اللة علية وسلم وعلى الة وصحبة ولذلك فان بعض الاخلاق توجد فى الفرد ذات نفسة يكتسبها من تربيتة ومن ثم لابد وان يسعى الفرد لمعرفة غيرها لاكتسابها من الغير ومن لان ليس بيننا اليوم من هو على اخلاق حقيقية ولذلك ارجع واقول اننا نرجع لسيرة الرسول واكتساب تلك الاخلاق منة واولا واخيرا كلة من فضل اللة وربنا معانا كلنا ويصلح شان المسلمين ويعزهم امين اللهم امين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113632/http://www.20at.com/article2.php?sid=379"
