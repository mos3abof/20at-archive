[[comments]]
order = 3
subject = "لم تعد هناك اخلاق الا من رحم ربي"
author = "معزو نوال"
posted = "2006-02-03"
text = "بسم الله الرحمان الرحيم والصلاة والسلام على اشرف المرسلين سيدنا محمد وعلى اله الطيبين الطاهرين اما بعد كيف لنا ان نتحدث عن الاخلاق ونحن من امة الحبيب المصطفى الدي كان خلقه القران ادا اردنا الاخلاق فعلينا اتباع نهجه وسنته والاقتداء به في كل صغيرة وكبيرة فادا اردنا الرقي والسمو باخلاقنا فعلينا ان نمضي على خطاه صلى الله عليه وسلم والسلام عليكم ورحمة الله وبركاته اختكم في الله نوال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113632/http://www.20at.com/article2.php?sid=379"

[[comments]]
order = 4
subject = "طيب انتوا عندكم أخلاق ؟؟؟"
author = "يعنى بجد أنا فى حالة سخط شديد وقرف ... لم أجد أى مقال يتحدث عما حدث من إساءة لرسولنا وحبيبنا (محمد) صلى الله عليه وسلم وكأن شيئآ لم يكن ، بجد انتوا بتهرجوا ؛ أمال الأخلاق اللى انتوا بتتكلموا عليها جيبتوها منين ؟؟؟"
posted = "2006-02-03"
text = "وتتكلموا ازاى عن الأخلاق بعد التخاذل الشديد ده .<br />بس معلش ربنا قال ( إلاتنصروه فقد نصره الله )<br />الله يسامحكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113632/http://www.20at.com/article2.php?sid=379"

[[comments]]
order = 5
subject = "لا تتخلق لا تتخلق بعد شويه الضحكة تعود و النار اللي في قلبك تغرق"
author = "أكرم بجد"
posted = "2006-02-03"
text = "لا اجد تعبيرا للاخلاق الا حديث النبي صلى الله عليه و سلم عندما سأل اصحابه : ما تعدون الصرعة فيكم ؟؟ قالوا الذي لا تصرعه الرجال فقال ( فدالك ابي و امي يا رسول الله ) : لي ذلك و انما الذي يمك نفسه عند الغضب<br />فياريت تكون الرسالة وصلت لاصدقائي المتعصبين ( اصدقائي بجد )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113632/http://www.20at.com/article2.php?sid=379"

