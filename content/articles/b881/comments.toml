subject = "حلو"
author = "لينا"
posted = "2006-05-30"
text = "بدون دعوة آلاف السعوديين تبنو الفكرة وبدينا فيها في المدارس طلبنا من التلاميذ اللي مش في حاجة مصروفه يخليه في صندوق التبرعات وفي نهاية الاسبوع توصلهم المديرة لحساب فلسطين في البنك........وهذا واجب علينا وعلى كل مسلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154259/http://www.20at.com/article2.php?sid=881"

[[comments]]
order = 3
subject = "حرام تضلم الناس يا فاعل"
author = "مغربي ابن ناس"
posted = "2006-05-31"
text = "ليس كل الفلسطنيين كما قلت واستغفر لذنبك يعني السعوديين لما بيسافرو لخارج السعودية مايعاكسو بنات؟؟<br />المهم ان المسلمين اخوة وحق المسلم على المسلم كل البلدان فيها الصالح والطالح والطيب والخبيث<br />والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154259/http://www.20at.com/article2.php?sid=881"

[[comments]]
order = 4
subject = "الجدية"
author = "حسين"
posted = "2006-05-31"
text = "فكرة ممتازة.. وبغض النظر عن بعض المشاركات السلبية.. الله يجزي مبتدعها خيرا<br />فقط: من يريد المساهمة فليفعل ومن يريد تثبيط الهمم فليتجاوز الخلافات ويستيقظ فأهل الباطل لا ينامون عن باطلهم فمالنا نتقاعس عن واجباتنا.<br />لا داعي للمداخلات بالسب والشتيمة فكلها ضرر لا نفع معه، وعلى إدارة الموقع ألا تتحفنا بالمعاصي والذنوب بحجة نشر كل الآراء بمنتهى الحيادية..<br />الأصل في الموضوع أنه جهاد بالمال لا تبرع فهي ليست منة أو تفضل بل واجب أصيل."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154259/http://www.20at.com/article2.php?sid=881"

