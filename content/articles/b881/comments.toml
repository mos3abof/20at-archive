[[comments]]
order = 6
subject = "يا سيدى كبر"
author = "سعودى"
posted = "2006-05-31"
text = "يا شباب الموضوع ما هو موضوع حمتاسة وفكرة.. الموضوع أن السعودية لو عايزة تتبرع كانت تبرعت بكل ما دفع العرب لفلسطين.. انتوا بتطلبوا منا التبرع بفارق البنزيت.. اديش لو تبرع الملك بواحد من قصوره ولا بلاها واحدة من ولايمه راح تغرق فلسطين بالمصارى ..<br />الشباب ما بده يعقل عن الأفكار الطايشة..<br />كل اللى يهم انتو يصير اول من يبتدع للفكرة..<br />والعرب لو بدهم يتبرعوا راح يتبرعوا ما هم مجتاجين لحد يذكرهم ويبكتهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154259/http://www.20at.com/article2.php?sid=881"

