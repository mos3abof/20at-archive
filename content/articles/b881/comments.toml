[[comments]]
order = 0
subject = "هل تضمن وصولها الى مستحيقيها في فلسطين؟"
author = "إذا ضمنت لى أن تبرعي سيصل الى المستحقين في أرض فلسطين المباركة ، فلن أتردد لحظة واحدة في التبرع ."
posted = "2006-05-30"
text = "ولا تقل لي \"اعمل خيرا ، وارجو ثوابه \"<br />فالمؤمن كيس فطن ، وليس من العقل أن أعطي مالي للمجرمين ، ونحن نعلم أن القائمين على أرض الحرمين ماهم الا مجموعة من اللصوص."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154259/http://www.20at.com/article2.php?sid=881"

[[comments]]
order = 1
subject = "لما قريت الموضوع"
author = "HopiZ"
posted = "2006-05-30"
text = "هى صراحة الفكرة خلوة قوى وفيها مفهمو الانسانى و التضامن الاجتماعى لأننا كلنا أخوة ومن اصل واحد.<br />بس هو فى نقطتين:<br />1- زى ما قال القارىء الى قبلى. الفلوس بتوصل ولا لاء. دى نقطة مهمه جدا لأن فى ناس كتير قوى بطلت تتبرع لفلسطين عشان النقطة دى بالذات ودايما المساعدات لفلسطين يا اما مابتوصلش اصلا يا اما بتوقف على الحدود و المعابر. فعايزين نطمن الناس و نضمن فى نفس الوقت وسيله اكيده نوصل بيها الخاجات لأصخابها.<br />2-طب السعوديين و عندهم البنزين بيرخص فممكن يتبرعوا بالباقى. طب احنا كمصريين كل حاجه بتغلا. ختى البنزين ان شاء الله هيغلى. نتبرع بايه احنا بقى؟<br />ربنايقوينا. ويرخصلنا حاجه عشان نتبرع بفلوسها... قولو أمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154259/http://www.20at.com/article2.php?sid=881"

