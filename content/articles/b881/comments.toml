[[comments]]
order = 9
subject = "انا فرد من فلسطين"
author = "محمد جابر دياب عويضه"
posted = "2006-06-15"
text = "انا محمد من غزه اسكون فى رفح عمرى 24 وانا لا اعمل لاان لا يوجدعمل فنا ارجو منكم ان تتبرعه لى قليل من المال حتى اتاجر بهم اطعم ءاسرتى التى تتكون من 7افردولااحديعمل بيننا واتشكركم ان سعتونى انا لتى رقم حساب فى بنك القاهره عمان وهو861181هدارقم الحساب عملته حته اسحب قرد واعيش ءاسرتى ولكن ابى قال ان سحبت قردسوف اغطب منك الى يوم الدين وانا ارجكوم وستحلفكم بلله ان تساعدونى بقرب فرسه ممكنه وان الله يعلم بهده الحال وشكرا لكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154259/http://www.20at.com/article2.php?sid=881"

[[comments]]
order = 10
subject = "بتوصل والله"
author = "إخوانجي"
posted = "2006-06-17"
text = "أموال التبرعات الشعبية طالما أعطيتها لثقة \" يعني لو عطيتها لأحد الإخوان مثلا \"بتوصل بإذن الله .<br />الحكومة دفعت ما دفعته من أجزاء الرواتب فقط من التبرعات الشعبية .<br />الزهار دخل فلسطين من يومين ومعاه 20 مليون دولار من التبرعات الشعبية .<br />وزير الإعلام دخل ومعاه 2 مليون دولار ، وسامي أبو زهري عضو المجلس التشريعي دخل بـ 900 ألف دولار .<br />أموال التبرعات الشعبية هي أضمن وسيلة ، وأضمن من التبرع في البنوك لأن البنوك لا تملك تحويل الأموال للحكومة حاليا .<br />نقابة الأطباء في مصر وسيلة ممتازة للتبرع .<br />واسألوا عن الإخوان المسلمين في كل الدنيا .. وهما ممكن يوصلو الأموال دي للحكومة .. بطريقتهم الخاصة ، زي حكاية إعطائها لمسئولين حماس خلال زياراتهم لدول العالم المختلفة .<br />لو احنا نشك في وصول هذه الأموال ، فهذا لا يعني أن نوقف التبرع ، بل يعني أن نستمر في البحث عن أضمن طريقة لوصول الأموال ... والطرق كثيرة والحمد لله .<br />الحكومة السعودية تبرعت بمبالغ معقولة للفلسطينيين ، ولكنها للأسف كغيرها من أموال التبرعات الحكومية لم تحول بعد لحساب الحكومة الفلسطينية نتيجة للضغوط الأمريكية ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154259/http://www.20at.com/article2.php?sid=881"
