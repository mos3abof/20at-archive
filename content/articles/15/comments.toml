subject = "ليه يار غدة:((((("
text = "ليه يا رغدة كده ده انت حبيبتي وصاحبتي<br />لازم تقلبي عليا المواجع يعني<br />وعموما يا ستي لو عايزة من ده كتير خدي عندك<br />ممكن انا وانت نالف كتاب فيه:))))<br />وقوليلي صحيح هو احنا اخوات ولا ايه؟؟ ده نفس الكلام اللي بيتردد عندنا برضه ، فولة واتقسمت:))"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417072402/http://www.20at.com:80/article.php?sid=61"

