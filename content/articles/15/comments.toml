[[comments]]
order = 6
subject = "الشمحطجى _ مصر المحروسة shamahtagi@hotmail.com"
text = "يا بنتى الحقى اتجوزى السوق نايم و ماحدش بيتجوز اليومين دول و الحالة مأشفرة و على رأى ستى عديلة ربنا يطول فى عمرها ( خدوهم فقره يغنيهم ربنا)<br />الوقت بيجرى و انتى لاموأخزة بنت يعنى كلها كام سنة و خلاص ( تفهمى بقة ماتفهميش انت حرة ) علشان ماتندميش زى يسرى و نبيلة عبيد فاتهم القطر و هم يا ولداه لا عيل و لا تيل<br />و لو عايزة اى استشارة او انى اسألك على الواد اللى اتقدم ليكى انا فى الخدمة اصل محسوبك يعرف طوب الارض فى كل المناتق الى فى مصر و الدول العربية الشكيكة و ابقى ابعتيلى على الميل ده<br />shamahtagi@hotmail.com"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417072402/http://www.20at.com:80/article.php?sid=61"

