subject = "لا أفهم"
author = "عبدالله"
posted = "2006-04-19"
text = "أنا لا أفهم ما هي علاقة آية الله الشيخ محمد علي التسخيري الأمين العام للمجمع العالمي للتقريب بين المذاهب الإسلامية بإيران عن البرنامج النووي الإيراني.<br />ولماذا إجراء حوار معه عن هذا البرنامج هل بصفته أم لأنه مجرد إيراني<br />أعتقد أنه كان بالإمكان إجراء حوار مع الرجل عن التقريب من المذاهب وجهودهم في هذا الصدد أم أن تجرون معه حوار لمجرد الحوار ... فلا أفهم ما هو الهدف؟!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125745/http://www.20at.com/article2.php?sid=712"

