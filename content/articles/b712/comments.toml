[[comments]]
order = 21
subject = "ايران و حزب الله المقاومة"
author = "مناضل حر عربي مسلم"
posted = "2006-09-06"
text = "من الواضح أن إيران الأن تتسيد الزعامة الإسلامية العالمية في ردع الأمريكان و الصهيونية العالمية لكن بعض الزعامات المنيوكة من الأمريكان يعملون على تغليف الأمر بقضية المذاهب التي أكل الدهر و شرب عليه حيث أن هؤلاء الحكام المعروفين ليس إلا عملاء أمريكان يعملون لحساب الإقتصاد و الخوف على الكرسي ألف حساب و يجهلون أن المال وحده لا يكفي لأنه لا يعيد طفل لبناني أو فلسطيني واحد الى الحياة فهبي يا شعوب المسلمين لمساندة إيران و تحيتها فلتحكمنا أيران و تتسيد علينا لأنها أحسن من الأمريكان و الصهاينة لأن قلب المسلم مهما يكن فيه رأفة على المسلم الآخر و الإختلاف المذهلي لا يفسد للمصلحة العامة و الود قضية اللهم إلا أن يكون هنالك حاجة في نفس يعقوب و طبعاً اليعقوبات كثيرة في الحكام العرب و المسلمين و أكبرهم حكام السعودية و حاكم باكستان صتحب النووي الأعرج المزيف الذي لا فائدة و لا طائل منه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125745/http://www.20at.com/article2.php?sid=712"

