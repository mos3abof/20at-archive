[[comments]]
order = 3
subject = "توضيح"
author = "موقع عشرينات"
posted = "2006-04-19"
text = "نشكر جميع المعلقين على تفاعلهم مع حوار عشرينات مع آية الله التسخيري.. ونود أن نوضح أن إجراء الحوار مع هذا الشيخ ليس فقط لكونه عالماً إيرانياً جليلاً، ولكن أيضاً لكونه شخصية إيرانية عامة، لها تأثيرها الديني على الشباب والمجتمع الإيراني، فضلاً عن احتكاكه بعالم السياسة الإيرانية بوصفه حامل لقب \"آية الله\"، وهو لقب لا يعطى إلا لكبار العلماء..<br />أي أن الأمر مثل إجراء حوار مع مفتي مصر أو شيخ الأزهر عن قضية سياسية شائكة، وهذا أمر طبيعي مهنياً وحرفياً، وقد نجحت الزميلتان إيمان وسارة في استغلال تواجد الشيخ التسخيري بالقاهرة واستطاعا الوصول إليه وإجراء هذا الحوار..<br />لهذا أردنا أن نوضح للمعلقين أهمية مثل هذا الحوار في هذا التوقيت الحساس الذي تعيشه الأمة الإسلامية.<br />ونرجو جميع المعلقين التعليق على (متن) الحوار لا التهجم على القائمين بإجرائه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125745/http://www.20at.com/article2.php?sid=712"

