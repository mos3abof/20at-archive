[[comments]]
order = 10
subject = "بنات"
author = "لك أن تخيليني جميلة في الرابعة والعشرين فوق تصورك شعري كشلال ليل ثائر ينزل حتى نصف ظهرى"
posted = "2006-05-20"
text = "جسد ملتف ممشوق وثدي ممتلئ ناضح كثمرة تريد من يقطفها<br />شهوتي الجنسية آنذاك لم تطلق من عقالها<br />فلم تكن لي أي من التجارب كنت خجولة وأخجل من نظرات الناس النهمة إلي التي ما أن تتخلص من أثر وجهي حتي تتسمر علي ثديي ومن ثم تستقر علي ذلك الموضع الخفي حيث كسي الذي حلم بمعاشرته ونيكه الكثيرون والكثيرات<br />طبعا الكثيرات فقد كنت في مجتمع محافظ وقد يصعب فيه الوصول إلي الشباب لكن الوصول إلي نيك الفتيات أسهل<br />كنت بعيدة عن كل هذا لم تكن لي صديقة مقربة سوي نوال وسبب إنطوائي هو تجربة زواج متعجلة أنتهت بالطلاق بعد شهرين لكن نوال أنستني كل هذا<br />كانت صديقتي في السادسة والعشرين غريبة كانت لا تخلو من الجمال وفتنة الجسد لكنها بعد ماتكون عن الأنوثة كانت خشنة الطباع وتحب الرياضة البدنية وتدمن تدخين السجاير<br />كانت تحبني كثيرا وتحميني من أي واحدة تحاول فرض نفسها علي<br />لم اعرف أن عشقها لي يتعدي النطاق الأخوي إلي الشبق والشهوة الجسدية<br />في ذاك اليوم كنت لديها بمنزل عائلتها الكبير ولمن يكن بالدار سوانا<br />ذلك اليوم كنا سويا نجلس متجاورتان علي سريرها<br />دون مقدمات نظرت إلي وجهي وقالت حبيبتي سوسن هناك شي علي جفنك أغمضي عيناك وسأمسحه لك<br />وعندما أغمضت شعرت بأنفاسها تلفح وجهي<br />وشفتيها تتحسس شفتي بهدوء قبل أن تلتحم بها في قبلة عنيفة حارة<br />ويدها كانت علي ثديي الذي وصلت إليه تحت ملابسي أخذت تضغطه في رفق وهي تتلمس حلمته ويدها الأخري إنزلقت تحت تنورتي لتذيح كلسوني الداخلي وتتلمس كسي في شوق عنيف<br />كنت مصدومة وفزعة حاولت التملص منها لكنها كانت اقوي وسمرتني بين يديها وتابعت تقبيلي وتحسس جسدي في شبق<br />وطرحتني علي سريرها وأعتلتني كانت يداها تسمر يداي بعيد استطاعت تثبيت ساقي بين ساقيها<br />وبصوت محموم قالت لي<br />حبيبتي سوسن خليني أحبك<br />حأدخلك عالم تتمني تعيشي فيه حأخليك سعيدة وحتنسي الكل<br />أسترخي مش حأذيك أنا أحبك وأنت عارفة<br />بس لو رفضت حنخسر بعض لأني أعشقك وما اقدر أعيش من غيرك<br />عندها خفت مقاومتي فأنا لا أريد خسارة نوال<br />وما المانع من فعل ما تريد لن يعرف أحد وأنا فعلا أحبها وأريدها لي وحدي<br />أحست نوال باستسلامي فمدت يدها لتخلع لي ملابسي<br />كادت تمزقها تمزيقا فقد كانت مثارة وهائجة<br />وأنا كطفلة بين يديها أخذت تنظر لي بعين وحش كاسر تتأملني بجوع شديد<br />تتحسسني بيدها ثم أخذت تلحسني بلسانها وتمص ثديي بشفتيها وانتصبت حلمتاي محمرتان من شدة إثارتي<br />وكنت أصرخ في تآوه فقدت أحسست بلذة لم اعرفها قبلا ووجدت نفسي أقرب جسدي منها أكثر وأكثر<br />وأخلع لها ملابسها بسرعة لأشعر بجسدها العاري علي جسدي ثم بدأت هي تحرك يديها على جسمي كله حتى توقفت يداها علي صدري وبدأت تحسس عليهما بكل رقة وهي تفرك الحلمات بين أصابعها كل حين وآخر، وكان ليديها ملمس واحساس لم أشعر به من قبل. وبدون مقدمات وجدتها تضع شفتيها على فمي وبدأت تقبلني بقوة وعنف وهي تلحس شفتاي بلسانها وتضغط به عليهما حتى أفتح لها فمي. فوجدت نفسي أتجاوب معها وأفتح فمي للسانها وأبادلها بأن أدخل لساني في فمها. وأحسست بالشهوة تشتعل داخلي مرة أخرى وأدركت وقتها أني كنت أرفض شيئاً آلا وهو نيك النسوان، وأدركت أيضاً أني لن أستطيع أن أعيش بدونه.<br />وظللنا على تلك الحالة، فهي تدفع بيديها إلي كسي الملتهب لتبعبصني ثم تسحب يدي ناحية كسها الذي كان مبللاً جداً وهي ترجوني في همس العاشقين أن أنيكها بأصابعي. وكنا نتمرغ على السرير وأنا مستمتعة لدرجة أني نسيت اسمي<br />استلقت حبيبتي نوال علي ظهرها<br />وباعدت بن ساقيها فرأيت كسها ملتهبا من شوقه وبزرها ينتصب بشعره الأشقر الخفيف<br />جذبتني ووضعت وجهي بين ساقيها وصرخت<br />نيكيني بلسانك يا سوسن<br />دخلي لسانك في كسي<br />سوسن حبيبتي<br />نيكيني علشان أجيبها وكالطفل الذي يفتح لعبة جديدة ويخاف عليها أن تنكسر، مددت طرف لساني لألحس لها شفايف كسها, وهي تصرخ وتقول: \"حرام عليكي يا سوسن أنا هايجة قوي، الحسي لي كسي. حطي لي لسانك في كسي ونيكيني بيه. أه يا سوسن، وحياتي عندك، طيب بس بوسي بزري. شايفاه واقف ازاى\" فحركت لساني لألمس بزرها الذي كان منتصباً كزبر الطفل الصغير وأحمر من شدة هياجها. وما أن لمس طرف لساني بزرها الملتهب الا ووجدتها تدفع بوجهي بين فخديها قائلة: \"نيكيني يا لبوة، مش قادرة أستحمل، حرام عليكي. الحسي كسي ونيكيني بلسانك\" وفعلاً بدأت الحس لها كسها وبزرها ثم أدخلت لساني داخل كسها الذي كان ساخناً من الداخل لدرجة غير عادية وتعجبت من الطعم الغريب لكسها ولكنه كان لذيذ أيضاً كأنه عسل فعلاً. ورحت أنيكها بلساني في كسها وأدعك لها بزرها بأصابع يدي وهي تتأوه من اللذة وتدفع برأسي أكثر بين فخذيها كأنها تريد إدخال رأسي كلها في كسها.<br />أمسكت بيدي ووضعتها في خرم طيزها وأمرتني قائلة<br />سوسو حياتي اه يا سوسو دخلي أصابعك في طيزي بعبصيني هنااااااااااااااك<br />اااااااااااااااااه اااااااااااااه سوسو يا لبوة حأجيبها سوسو<br />حأجيبها علي لسانك مني قادرة وأنجرت نوال وأنزلت عسلها اللذيذ وكنت قد بدأت أرتعش من الشبق والشهوة فبداخلي جوع بدأ يتنامي ووجدت نفسي أدخل أصابعي في كسي محاولة أن أجيبها أنا كمان<br />إستلقيت علي السرير بجوار نوار وكنت قد فرشخت ساقي وأعملت يدي في كسي كي أشبع رغبتي في النيك<br />نظرت لي نوال وقالت يالبوة لسة ماشبعت إنت لازم تتناكي مظبوط<br />سوسو أناحأغتصبك لاتخليني اوصل لك انا احب اغتصب حبايبي<br />سوسو حبيبي لو أستسلمتي مش حأنيكك طيب<br />وكوحش شرس قفزت علي جسدي وأنتفضت من هول المفاجأة فقد كانت تعني ماتقول وفعلا أحسست بلذة وهي تحاول الوصول لي بالقوة وأنا أبعد شفتي عنها لكنها أقوي وهذا معروف تمكنت من شفتاي ومصتها بعنف وأنتقلت لثديي وأخذت تمصه وكأنها تشارف علي أكله وكنت اصرخ بهيستيرية صراخ ألم وصراخ شهوة وصراخ من رغبتي بأن أجيبها جعلتني أشتعل رغبة وكنت احاول نيك نفسي بأصابعي لكنها سمرت يدي بيديها قائلة<br />لا ياسوسو لمن تستوي لمن تترجيني لمن تصرخي صراخ عمرك ماصرختيه<br />وتابعنا تقلبنا وتمرضغنا علي السرير بجسدينا العاريين الملتحمين وعندها لم أقدر التحمل صرخت فيها<br />نوال ياشرموطة نيكيني نوال ما اقدر استحمل نيكيني ااااااااااااااااااه يابنت الكلب نيكيني نوال نوال<br />وكأنها تنتظر الإشارة فنزلت بوجهها بين ساقي ? أمسكت فخذي بيديها وباعدتهما ? اخذت تقبل شفايف كسي وتمصه دون ان تدخل شيء فيه مما زاد من هياجي وفجأة أدخلت لسانها بسرعة شديدة فصرخت وكأن روحي تسحب مني وأخذت تنيكني بلسانها بقوة وإصرار وانا أصرخ من النشوة قائلة ااااااااااااااه نوااااااااال حبيبتي اااااااااااااااه يالبوة دخليه كمان وأستمرت تنيكني حتي جبتها وأفرغت ما بداخلي<br />وتابعنا التمتع ببعضنا حتي أعيانا التعب ووجدت نفسي أغفوا بين ذراعيها وشعرت بأمان وإشباع لم يتوفر لي قبلا حتي من زوجي السابق<br />اااااااااااااه حاسة بشهوة لازم أنيك وأتناك باي حبايبي أنا رايحة لنوال"
archived = "2006-11-02"
