subject = "راح زمن الرجولة"
author = "سفير الغرام"
posted = "2006-08-01"
text = "خلاص راح زمن الرجولة ومضى ومفيش غير الخسة هى الى ماشية.<br />فينكم يا حكام العرب خايفين مرعوبين<br />لاكن خلاص الدور عليكم واحد واحد<br />وكل واحد حيتفرج على اخوة وهو بيدبح<br />ويقول يا حول الله يارب<br />ربنا يفوقك يا ايران سواء كنت سنة او شيعة<br />المهم انها اول من وقف فى وش امريكا وغيرها من المسلمين<br />وربنا معاك يا نصر الله وينصرك على اليهود<br />السفير$"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125745/http://www.20at.com/article2.php?sid=712"

