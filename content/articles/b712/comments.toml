[[comments]]
order = 24
subject = "أبحث عن مجنونة جنس وشبق"
author = "أحمد"
posted = "2006-09-24"
text = "أنا أحمد من القاهرة 35 سنة .. أريد مجنونة تؤمن بطيزها وتعشق كسها وتفتح لي صدرها لأقيم فيها وأنيكه .. وتهبني طيزها أنيكها بكل جنون وتطرف وموسيقى ورومانسية وشبق وتطرف وتصوف وتعجرف وعشق وأذبح كسها بزبري وأقطع طيزها بجنونه وأسكب لبني في طيزها وصدرها وجسدها لتستحم بلبن زبري وريقي وقبلاتي ليل ونهار وتكون مجنونة نيك في كل وقت وخصوصاً من طيزها المجنونة والشبقة .. وهذا هو إيميلي :<br />prince_ofegypt2006@hotmail.com<br />أنتظر المجنونات العاشقات للنيك والرغبة والمتعة والتفرد والجنون يا جميلتي المجنونة لأرويكي بزبري وأقطع جسدك شوق ولذة وعشق .. بممارسات مجنونة ومفردات غير مسبوقة ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125745/http://www.20at.com/article2.php?sid=712"

[[comments]]
order = 25
subject = "حقيقة"
author = "غيور"
posted = "2006-10-31"
text = "مين قال إن تخصيب إيران فيه خير للمسلمين وردع للأمريكيين إن لإيران طموحات توسعية إقليمية وصداقات و محادثات سرية مع إسرائيل والظاهر لنا من تهديدات نجاد لإسرائيل كلها كذب و لو كانت حقيقة لكان اليهود (اسرائيل) ضربت إيران إن كثير من المسئولين الإيرانيين يجافون الحقيقة ومن أين الخير من عندهم ومن عندهم يخرج الدجال و يسبون الصحابة الكرام ويقولون القرآن الكريم محرف والله قال تعالى (إنا نحن نزلنا الذكر إنا له لحافظون)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125745/http://www.20at.com/article2.php?sid=712"
