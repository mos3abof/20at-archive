[[comments]]
order = 19
subject = "ممحون"
author = "رجل مترجل"
posted = "2006-09-04"
text = "أصلاً عندما كنت صغير في واحد اله لا يرحم والديه ناكني في طيزي لما جابت الدم يعني فتحني لكن لمن أتناك كتير في حياتي لكن أشعر بأن طيزي إتلاطت بذب ضخم مرعب رأيته منتصب ذو قائمة تجذب الإحترام و عدم المقاومة .. أعطيته ظهري و لم يحفظ أمنة الولد الصغير وراح يدخل رأس ذبه العريض في طيزي الوديعه الحمراء التي يحسدعليها آنذاك و إستمتع بي كالأسد الجوعان المزمجر و ترك أثره في حياتي كلها يا ليته من ذب وحشي .. و الآن أنا عاوز أمص ذب كبير لكن أتناك بذب يكون معقول شويه لأن الكبير يحرقني و يذكرني بدم النيكة الأولى و من هو مستعد أن يكتب لي هنا تعليق بعنوانه شريطة إلتزامه بالسرية لأنه إبتلاء ... مطلوب ذب كبير للمص حتى الإفراغ أو ذب متوسط لإدخال نصفه فقط أو ذب صغير لإدخاله كاملاً في فتحة طيزي الممحونة حتى أطير أنا لأني تعبان و الله أشفار طيزي ترفرف من زمن طويل و لا تجد من يسعفها في ها الذبوب الحلوة الموجودة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125745/http://www.20at.com/article2.php?sid=712"

