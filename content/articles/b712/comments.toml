[[comments]]
order = 6
subject = "حق ايران في السلاح النووي"
author = "مسلم"
posted = "2006-04-20"
text = "لا أحد يستطيع أن يلوم ايران في اجتهادها في الحصول على السلاح النووي ، وهذه الدول الكبرى تبيح لنفسها مالا تبيحه لغيرها ، فإذا كانت أمريكا وبريطانيا ، بل حتى باكستان والهند تمتلك السلاح النووي ، فلما لا تمتلكه ايران؟؟!!<br />وبدلا من لوم ايران ومنعها (وهل يستطيع أحد؟؟!!) من امتلاك السلاح النووي ، ينبغى أن نحصن نحن العرب أنفسنا من نووي ايران وغير ايران ، بالسعي لامتلاك السلاح النووي.<br />والذي ينبغي أن يعلمه شباب العرب والمسلمين ، أن نووي ايران لن يكون أبدا موجها ضد أعداء العرب والمسلمين كالصلبيين واليهود ، فهذه الدولة-ايران- دولة عنصرية بغيضة يريد القائمون عليها إعادة مجد فارس ، وإن لبسوا قميصا التشيع تمويها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125745/http://www.20at.com/article2.php?sid=712"

