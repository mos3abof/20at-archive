text = "الى كل هؤلاء الذين يترحمون على زمن الفن الجميل<br />ان ام كلثوم هى اول الطريق و روبى لن تكون اخرة<br />الست ثومة التى تقول بين ايديك /الاهات بل تقول فى اغنية اطفىء لظى القلب بشهد الرضاب اى لعاب القبلة<br />وعبد الوهاب فيك عشرة كوتشينة<br />وعبدالعزيز محمود يا شبشب الهنا<br />وخالد الذكر سيد درويش شفتى بتاكلنى"
