subject = "روبي . مروة . نانسي ........... جهنم زحمة مووووووو"
text = "الصراحة يا روبي<br />انت مكنتيش مدارية حاجة . عشان كده بتقوللي ليه بيداري كده ؟<br />و انت يا مروة .<br />صدقيني عليوة مش هيكلمك غير لما تبقي محترمة !<br />انما انت يا نانسي<br />. طلعتي محترمة و بنت ناس بس انا عارف انك هتنتقمي من الاتنين اللي فاتوا<br />و بتحضري فيلم مش<br />كليب<br />المهم عايزين حاجة<br />جديدة . غير عليوة و الجيم و القهاوي<br />HMH"
archived = "2004-06-17"
capture_url = "https://web.archive.org/web/20040617173247/http://www.20at.com:80/article.php?sid=24"

