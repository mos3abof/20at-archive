author = "ممدوح زكى زخارى جرجس-الاسكندري"
posted = "2009-03-24"
text = "يا ريت كمان لا يكون (رئيسا لمجلس الوزراء)كمان و كمان و كمان كمان<br />و سوف تكون كلها(نظيف و كورمبو) و يا قلبى لا تفرح<br />ورقصنى يا جدع على نظيف؟الكرومبووو ووووووووووووووو"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003609/http://www.20at.com:80/masr/t7atuf/11690.html"

[[comments]]
order = 1
subject = ""
author = "ممدح زكى زخارى جرجس-الاسكندرية"
posted = "2009-03-25"
text = "بحبك يا(حمار)<br />ياريت دة يتم تحقيقة<br />وعلى فكرة الجميع على ثقة من ان العادلى لة من الكفائة و القدرة على القيام بعمل (رئيس لمجلس الوزراء) مليون الف مليون مرة من اداء (أبو طويلة)النخلة الاهبل الهايف المغيب عن الواقع؟؟؟<br />(ابو طويلة)نظيف جدا كالماءءءءءءءءءء ءءءءءءءءءءءءءءء ءءءءءء!!!<br />لا لون و لا طعم و لا رائحة لة ؟<br />انة نظيف و نظيف جدا"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003609/http://www.20at.com:80/masr/t7atuf/11690.html"

[[comments]]
order = 2
subject = ""
author = "حمار"
posted = "2009-03-25"
text = "ان شاء الله يا زخاري تتحقق امنيتك ويعملوا حبيب العادلي رئيس الوزراء<br />وليه لأ<br />ما هو ممدوح سالم زمان كان وزير الداخلية وبقى رئيس وزراء كبير<br />ان شاء الله تتحقق امنيتك"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003609/http://www.20at.com:80/masr/t7atuf/11690.html"

[[comments]]
order = 3
subject = ""
author = "اكتب اسمك هنا"
posted = "2009-03-26"
text = "ودا كله ليه<br />لانه عنده قدرات خارجة<br />حيحل مشاكل بصر بطلعة امن مركزي<br />روح يا مقدس الله يخرب بيتك"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003609/http://www.20at.com:80/masr/t7atuf/11690.html"

