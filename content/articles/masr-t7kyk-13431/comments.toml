subject = ""
author = "تحقيق فاشل"
posted = "2009-09-13"
text = "يا اخ محمد السويدى المحترم<br />اية علاقة دكاترة الجيولوجيا بتوع كلية العلوم بهندسة التربة<br />فية دكاترة ومهندسين فى كليات الهندسة قسم الهندسة المدنية متخصصين فى ميكانيكا التربة وكل حاجة لها قوانينها وحساباتها وملهاش اى علاقة بالجيولوجيا<br />بمعنى ان تصميم البناء فوق ارض رملية او طينية او حتى صخرية بتختلف وتتوزع الاحمال بطرق مختلفة<br />انت ما شفتش المطارات التى تبنى وسط البحار ومنصات البترول العائمة<br />كل ارض ولها نظام بناء مختلف<br />وكل ارض بيتعمل حساب الاساسات والخوازيق والعملية مش بطاطس وجيولوجيا وملوخية"
archived = "2009-10-21"
capture_url = "https://web.archive.org/web/20091021182638/http://www.20at.com:80/masr/t7kyk/13431-2009-09-13-09-48-06.html"

