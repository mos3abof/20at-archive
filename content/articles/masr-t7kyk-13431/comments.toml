author = "عادل مصطفى"
posted = "2009-09-16"
text = "هذا خلق اللة فارونى ماذا خلقتم<br />لاحظ العلماء ان حيوان الجمل يسير فى ارض رملية مخلخلة ومع ذلك لا يغرز ارجل الجمل فى الرمال بل يسير فوق اشق ارض الرمال وعورة<br />قام العلماء المهندسون بوزن الجمل وقسموا هذا الوزن على مساحة تلامس الارجل الاربعة للجمل بالارض<br />ومن العجيب انة عند تصميم الدبابة التى تسير فى الطين والرمال حفظت نسبة الوزن على المساحة الملامسة للارض<br />وكذلك بناء البيوت يكون وزن البيت على مسطح قد اية<br />العملية كلها حسابات ومن الممكن البناء فوق اى ارض"
archived = "2009-10-21"
capture_url = "https://web.archive.org/web/20091021182638/http://www.20at.com:80/masr/t7kyk/13431-2009-09-13-09-48-06.html"
