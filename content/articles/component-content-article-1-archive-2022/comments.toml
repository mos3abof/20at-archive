order = 0
subject = "غاندي البلد في بلاد العجائب"
author = "غاندي البلد"
posted = "2006-04-16"
text = "أنا بقى من جهتي بخاف مووووووووووووووووت من ركوب الطيارة، وأول مرة ركبت فيها الطيارة الراجل اللي جنبي قعد يهدي فيا..<br />أووم إيه.. حبة برق ورعد في سماء البلد اللي إحنا فوقيها.. مر أدامي شريط حياتي.. لكن ربكم ستر ودقايق ولقيت نفسي ماشي على الأرض داخل المطار..<br />وفي تاني مرة طيران، سبحان الله.. ربكم نزل عليا سكينة عجيبة.. وكنت باهدي اللي جنبي من مطب هوا جامد في الهبوط!!<br />وفي تالت مرة طيران، كانت الرحلة 4 ساعات.. أوووم إيه.. الطيار بينادي: \"الرحلة تبقى لها 3 ساعات، نود أن نببه أننا سنواجه مطبات هوائية بعد نصف ساعة من الآن، حتى موعد هبوط الطائرة.. يعني ساعتين ونص مطبات هوا.. تخيلوا.. وأنا بخاف من أي هوا ييجي جنب الطيارة.. طبعاً كنت على أخري.. لكن ربنا سلم..<br />نفس الأمر تكرر في رحلة العودة!!..<br />ربنا يرفع عنا وعنكم مطبات الهوا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113757/http://www.20at.com/article2.php?sid=703"

