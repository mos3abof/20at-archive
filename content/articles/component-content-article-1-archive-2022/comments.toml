[[comments]]
order = 2
subject = "هبهوب علي الحدود"
author = "هبابه او هوبه او هبهوب"
posted = "2006-04-16"
text = "\"هتعملها سيبو يعتمد علي نفسه دا ابني وانا عارفه محدش يساعده ....\"<br />طبعاً دول الكلمتين اللي كان بيقولهم حسن حسني لعبود في فيلم عبود في الحدود نفس النص معايا مع اختلاف بسيط شيل عبود وحط هبهوب .<br />سيبها تروح الكليه لوحدها هي مش صغيره وخليها تتمرط شويه . قلت يا بت ما شي عديها النتجيه في الاخر كانت مفرحه بس مش في كل مره تسلم الجره , سيبها تسافر لوحدها حط خط تحت تسافر دي . اه سافرت لوحدي يا بشر<br />لما كنت بقول يامطار داريني , امنيته تحققت خلاص يا بويا اتمرمطط . البلد اللي فيها مكنش ينفع اروح مباشر لازم اعدي علي بلد كا ترانزيت دخول الطايره خطه بس ساعه الاقلاع والهبوط واحساس ان في مسمار في ودنك<br />بس , الحمد لله انا وصلت ساعتها بامان بس مش ناسيه اللي حصل . وكل الافلام اللي اتكلمت عن سقوط الطايرات والمضيفه وهي بتقول ارشادات الغرق وقراه المعودتين تكفي دا في الاول وفي اخر الرحله وبيكفي .<br />اخيراً انا عايزه جوااااااااااااب الكمسييييييييون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113757/http://www.20at.com/article2.php?sid=703"

