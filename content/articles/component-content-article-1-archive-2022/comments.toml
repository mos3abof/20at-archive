[[comments]]
order = 5
subject = "يا سيدي على اول مرة جو"
author = "واحد تاني"
posted = "2006-04-17"
text = "اول مرة فى الجو .... يمكن مش فاكر كل تفاصيل الحدث لاني كنت فى اغلب الرحلة شبه فاقد الوعى, قد ايه كان احساس رائع , خصوصا فى اللحظة الاولى, اول ما تبدا تتخلص من الارتباط بالارض والتحليق –نعم التحليق- لا يحملك سوى الهواء .... فاكرين الحلم اللى كتير مننا شافه وهو نايم وهو انك بتسقط (مش فى الامتحان) من مكان عالي .... دا بالظبط اللى حصل معايا بس وانا صاحي .<br />تفاصيل كتير مش مهمة هى اللى وصلتنى فى اليوم ده لرحلة السفاري فى احدى صحاري الدول العربية واللى كان جزء منها ركوب ال \"بيتش باجى\" ونظرا لاغراء الصحراء ومنظر جبالها (او تلالها مش دا المهم) الرمليه فى الليل والدنيا ضلمة اللى كان دافع لاننا نتسلق الجبال دى بال \"البيتش باجيز\" ومن غير ما اطول عليكم استمتعنا باحساس الصعود و النزول (اللى كان نزول لغاية اللحظة دى) من على الجبال ولفت نظري الجبل دا بالذات اللى كان ميله انسيابى من ناحية الصحرا ولكن من ناحية البحر (اصل كان فى بحر برضه) كان واقف بزاوية قائمة أم 90 درجة (بتاعة فيثاغورث تالتة اعدادي) .... وعنها, لقيت نفسى على قمته و في جزء من الثانية اخدت القرار بالنزول من الناحية القائمة الزاوية ( أم من غير انحدار) وهنا تحول مفهوم النزول الى هطول او بمعنى ادق الى نظرية السقوط الحر (فيزيا تالتة ثانوى- اصلى كنت علمي) بعد لحظات من السرعة اللارادية فى اتجاه الجاذبية بدأ جسمى ينفصل عن الكرة الارضية بما فيها ال\"بيتش باجى\" اللى كنت راكبه وبدأت رحلة الطيران واحساس أول مرة فى الجو .<br />فيلم وثائقى بيؤرخ للى فات من حياتي على هيئة صور من ذكريات واحداث منسية بيمر قدام عنيا المغمضين وانا مستمتع بان جسمي محمول بواسطة لاشئ سوى الهواء, اللى بيمر وبسرعة بارد جنب وشي فى لحظات حسيتها طويلة طول الزمن انتهت بالتقاء جسمي مرة تانية بالكوكب الأم .... الارض, واحتضانها ليا بمنتهى الشوق والعنف بعد غيبة مطولتش واللى نتج عن هذا اللقاء الحار كان مجرد كسر فى الكتف اللى سلم على الارض والرجل اللى سلم عليها ال\"بيتش باجى\" بعد ما وصل الارض هو كمان وارتجاج بسيط فى المخ (قال يعني هو كان ناقص) مع فقدان مؤقت للذاكرة خفيت منه والحمدلله بدليل انى بحكى القصه ولا كأن حاجة حصلت.<br />ودي كانت نهاية فرقة ( ارض – جو) المرصحية, ومن واقع التجربة بقول للى فاهم ان النسيان ده نعمة بقوله مش دايما يا صاحبي, مش دي القضية بس كان احساس جديد جدا عليااحساس (أول مرة جو ) ده نصوحة محدش يجربه.<br />كان نفسي احكي لكم عن اخر رحلة ليا لمصر فى العيد اللى فات واللى كان المفروض تاخد 4 ساعات لكن اخدت 18 ساعة بس مفيش وقت بقى معلش خيرها فى غيرها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113757/http://www.20at.com/article2.php?sid=703"

