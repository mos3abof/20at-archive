[[comments]]
order = 2
subject = "طبيب عيون حضرتك؟؟؟؟؟؟؟"
text = "يالثقافتك الرائعة يااحمد افندي ولا ادري من اين حصلت على معلوماتك عن العيون ووصفها كنت بتشتغل عند طبيب عيون من قبل ذلك<br />العين يا احمد منفذ الروح وتنعكس فيها حالة الانسان النفسية بشكل واضخ واثبت العلم الحديث انه التواصل بالعين له اثر بالغ في النفس<br />ولعل هذا ما جعل المتغزلين باحبابهم يفيضوا بوصفهم للعين لان العين والتواصل به شئ لا يقدر عليه الا اقرب الناس لبعضها البعض<br />وعقبال ما تجرب كدا"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926034641/http://www.20at.com:80/article.php?sid=473"

[[comments]]
order = 3
subject = "واحد رخم"
text = "واضح ان اخينا كاتب المقال بيعانى من عشى ليلى او عمى حيثى لانه عاوز حد يغنى للتراكوما مما يدل على ان تاريخه الطبى فى مجال العيون ملىء بالغماص خصوصا<br />اذا كان بيدور على حديكتب قصيدة فى الرمد الربيعى<br />وتعالوا نتخيل اغنية الرمد الربيعى مثلا هتكون \"<br />هات عينيك تسرح فى رمدتهم عنيا .. هات عينيك تمسح عماصتهم ايديا ..ياحبيبى كفاية ..يا حبيبى كفاية وتعالى بينا نكشف عند دكتور الاسبتاليا \" وطبعا هما هيكشفوا عند دكتور الاسبتاليا لانهم فقرا وكحيانيين والا ما كانش جالهم رمد ربيعى من كتر استخدامه لحتت المطبخ فى مسح عيونهم .<br />ونظرا لان كل هذه الامور تأتى من سلوكيات الدولة فانا اقترح رفع مشروع قرار لمجلس الامن يعاقب الدول التى لا تهتم بالمعمصين وتدفعهم لكتابة مثل هذه الاغانى المعبرة عن كمون وانشقاقات نفسية فى مجال العيون"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926034641/http://www.20at.com:80/article.php?sid=473"

