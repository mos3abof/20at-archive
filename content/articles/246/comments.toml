text = "انا مش شايفة في المقالة دي اى شيئ ممتع ، و مش ظريفة بالمرة<br />و مش فاهمة هو عايز يوصل لإيه و لا نازلة ليه من اساسة المقالة دي<br />هى دي الروشنه :s"
