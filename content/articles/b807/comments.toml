[[comments]]
order = 0
subject = "كلنا اسرى ف الوطن الكبير"
author = "نيفين"
posted = "2006-05-16"
text = "ة تتجدد الاحزان<br />هقوللك ايه يا عاطف ..ما انت قولتها خلاص<br />كلنا اسرى ف الوطن الكبير (الكبير اسما و مساحه..الضيق احتواءا لاهاتنا)<br />و ثق انك لست اللاجىء الوحيد<br />كلنا هذا اللاجىء<br />كلنا هذا الاسير فى الوطن<br />الكبييييييييييييييير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154035/http://www.20at.com/article2.php?sid=807"

