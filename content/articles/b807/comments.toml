text = "بص يادغلس \"ملكش اسم رباعي اوثلاثي تاني\"<br />بصراحه احاسيس جامده وعلي راي<br />نوفا \"كلنا هدا الشخص المبعد\" او \"الاسير\"<br />باختلاف مكان الاسر.."
