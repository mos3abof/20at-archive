[[comments]]
order = 3
subject = "مالي"
author = "فدائيه"
posted = "2006-07-18"
text = "مالي وقفت على المخيم متاملا اهو مكان مقرف ام هو مكان ليس مناسب للمعيشه والله الف سؤال يدور في بالنا فاناابنه مخيم وافخر في ذلك لان ذلك يبقى لنا جزء من امل العودة الى الوطن فوالله اني اشكر الله عز وجل اني فلسطينيه واني ايضا لاجئه لان الله لاينسى عبده<br />فلسطيني فلسطيني فلسطيني انا يا امي في شكلي وتكوني على دربي وفي دمي ساحفرها فلسطيني اخدت الفاء من فلاحة اخد تقاوم كل مغتصب واخدت اللام من لمسات عطر الوطن واخدت سين من سيف على صدري واخدت طاء من طول انتظاري وياء اخدتها من ياس الزمن والنون من لا نسيان ولا تناسي للوطن فهذا هو حال الفلسطيني يارب فرجك واحنا ما بدنا العرب نحن نناشد الله فقط ونساوم على الله ولا نساوم على العرب الله ينصر الفلسطينين في ساحة الحرب ولبنانين والعراقين والشيشان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154035/http://www.20at.com/article2.php?sid=807"
