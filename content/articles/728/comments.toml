[[comments]]
order = 3
subject = "تسلم أيدك يا دكتور"
author = "مناضل أنترنتى قديم"
posted = "2006-04-06"
text = "السلام عليكم و رحمة الله و بركاته<br />تسلم أيدك يا دكتور سعيد و إن صح التعبير يسلم كيبوردك يا دكتور الكلام ده لازم يكون هو الهدف الذى نتحرك جميعا من أجله لابد أن ننشغل جميعا بحلم و ليس أكبر من أن نحلم لأمتنا و أن نستعيد مجد الماضى<br />و انا على قناعه تامه و يقين ثابت بقولك ان الأنترنت و سيله أعلاميه رهيبه لو أحسنا أستغلالها قد تكون هو سلاح النصر سبحان الله أذكر أننى كنت أتناقش مع أخ لى عن دور الأنترنت فى حياتنا و بعد مداولا ت و مناقشات قال لى أن الله سخر الغرب ليكتشف لنا هذا السلاح الذى سوف يقلب الموازين فى صالح المسلمين<br />أرجو أن يتفهم كل صاحب موقع و تحديدا عشرينات كلمات الدكتور سعيد اللى فى الجون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114640/http://www.20at.com/article2.php?sid=664"

