[[comments]]
order = 0
subject = "أرجو الإستجابة"
author = "aroundu_4"
posted = "2006-04-06"
text = "أرجو نشر هذا الموضوع<br />أرجو الإتاحة للقراء نشر بعض الموضوعات والمقالات .....<br />طلبت ذلك مراراً وتكراراً...ولم يستجب أحد<br />وأرسلت هذا المقال لإدارة الموفع والمحررين ولم يرد عليَ أحد....<br />موضع الفكرة الواحدة.....<br />يقول قاضي قضاة الشام سليمان بن حمزة المقدسى وهو من ذرية إبن قدامة صاحب كتاب المغني ( لم أصل الفريضة قط منفردا إلا مرتين, وكأني لم أصلهما قط ).<br />هل تعلم كم كان عمر سليمان المقدسي حين قال هذا الكلام ؟؟<br />كان عمره تسعين عاما تقريبا ........<br />أكاد أنظر إلى وجوهنا ألآن وقد قلنا لأنفسنا بصوت منخفض من الخجل ' تسعون عاما ولم يترك الجماعة إلا مرتين , وأنا لازلت شابا صغيرا ولا يكاد يمر إسبوع واحد إلا وضاعت مني الجماعة على الأقل مرتين '.<br />وهنا يطرح التساؤل الآتي نفسه, وهو لماذا كان حرص السلف وصحابة النبى صلى الله عليه وسلم الشديد على صلاة الجماعة حتى يقول أحدهم حين يتركها مرتين [ وكأني لم أصلهما قط ] ؟<br />أتريد أن تستـقيم إلى الله .<br />فعليك أن تدلف من باب الاستـقامة إذن وبابها المحراب .<br />وهكذا ، فإن على الفرد المسلم في كل وقت أن يبدأ عمله من المسجد ، فيصلح العقيدة ، ويتعلم أدب التعامل الإسلامي ، وبذلك تسقط تـلقائياً كل المقاييس الأخرى في التـفاضل ، من جودة الكتابة ، و بلاغة اللسان ، و بهرج الشهادات الجامعية .وإنما جماع الخير في ارتياد المسجد ، وذخيرة المسجد نعم زاد الانطلاق . ولقد أحصاها الحسن بن علي بن أبي طالب رضي الله عنهما فقال :<br />\" من أدام الاختلاف إلى المسجد أصاب ثماني خصال :<br />آية محكمة<br />و أخاً مستفاداً<br />و علماً مستطرفاً<br />و رحمة منتظرة<br />وكلمة تدله على هدى ، أو تردعه عن ردى . وترك الذنوب حياء ، أو خشية \"<br />موضع الفكرة الواحدة.....<br />\" فالمسجد هو في حقيقته موضع الفكرة الواحدة الطاهرة المصححة لكل ما يزيغ به الاجتماع . هو فكر واحد لكل الرؤوس ، ومن ثم فهو حل واحد لكل المشاكل . وكما يشق النهر فتـقف الأرض عند شاطئيه لا تتقدم , يقام المسجد فتـقف الأرض بمعانيها الترابية خلف جدرانه لا تدخله \".<br />\" فما المسجد بناء ولا مكاناً كغيره من البناء والمكان ، بل هو تصحيح للعالم الذي يموج من حوله و يضطرب ، فإن الحياة أسباب الزيغ والباطل والمنافسة والعداوة والكيد ونحوها ، وهذه كلها يمحوها المسجد ، إذ يجمع الناس مراراً في كل يوم على سلامة الصدر ، وبراءة القلب و روحانية النفس ، ولا تدخله إنسانية الإنسان إلا طاهرة منزهة مسبغة على حدود جسمها من أعلاه و أسفله شعار الطهر الذي يسمى الوضوء ، كأنما يغسل الإنسان آثار الدنيا عن أعضائه قبل دخول المسجد ).<br />ولقد تـفاعل الموفقون مع هذه الأعطيات التي تمنحهم إياها مساجدهم ، فولعوا بها ، و شدوا إليها شداً أنطق الشاعر بالصدق فوصفهم بأنهم :<br />يمشون نحو بيوت الله إذ سمعوا **** ( الله أكبر ) في شوق وفي جذل<br />أرواحهم خشعت لله في أدب **** قلوبهم من جلال الله في وجل<br />ثم ما برح أئمة الموفقين يلحون في التوصية بذلك ، ابتداء بالصدر الأول ، كمثل عبد الله بن المبارك حين يقول :<br />اغتنم ركعتين زلفى إلى الله **** إذا كنت فارغاً مستريحاً<br />و إذا هممت بالنطق بالباطل **** فاجعل مكانه تسبيحاً<br />وآخر يقول ( حسن البنا ):<br />أمامك كل يوم لحظة بالغداة ، ولحظة بالعشيّ ، ولحظة في السحر ، تستطيع أن تسمو فيها كلها بروحك الطهور إلى الملأ ، فتظفر بخير الدنيا والآخرة . وأمامك يوم الجمعة وليلتها تستطيع أن تملأ فيها يديك و قلبك وروحك بالفيض الهاطل من رحمة الله على عباده ، وأمامك مواسم الطاعات وأيام العبادات وليالي القربات التي وجهك إليها كتابك الكريم ورسولك العظيم ، فاحرص على أن تكون فيها من الذاكرين لا من الغافلين ، ومن العاملين لا من الخاملين ، واغتـنم الوقت ، فالوقت كالسيف ، ودع التسويف فلا أضر منه \"<br />وكمثل الإمام بديع الزمان سعيد النورسي حين يخاطبك و يقول : \" رُكِّبتَ من القصور والفقر والعجز و الاحتياج ، لتـنظر بمرصاد قصورك إلى سرادقات كماله سبحانه ، وبمقياس فقرك إلى درجات غناه و رحمته ، و بميزان عجزك إلى قدرته و كبريائه ، ومن تـنوع احتياجك إلى أنواع نعمه و إحسانه .<br />•◘•◘•◘عندما تولد يا ابن ادم يؤذن في اذنك من غير صلاة وعندما تموت يصلى عليك من غير اذان وكأن حياتك في الدنيا ليست سوى الوقت الذي تقضيه بين الاذان والصلاة فلا تقضيها بما لا ينفع•◘•◘•◘<br />المصادر :<br />علو الهمة محمد أحمد المقدم<br />الرقائق محمد أحمد الراشد<br />راسلنا علي :<br />http://groups.yahoo.com/group/aroundu_4/"
archived = "2006-11-02"
