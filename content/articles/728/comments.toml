[[comments]]
order = 7
subject = "اللهم اني اسالك رضاك و الجنه"
author = "سميره"
posted = "2006-04-08"
text = "السلام عليكم و رحمه الله<br />ليس عندي الا تعليق بسيط بابيات من الشعر:<br />اتتني في سكون الليل اطياف لماضينا<br />و راحت تنثر الاشواق و الذكرى افانينا<br />اما كنا بجوف الليل رهبانا مصلينا<br />و فرسانا اذا ما قد دعا للموت داعينا<br />فمن للامه الغرقى اذا كنا الغريقينا<br />و من للغايه الكبرى اذا ضمرت امانينا<br />و من للحق يجلوه اذا كلت ايادينا<br />اسائلكم و نفسي هل اصاب القحط وادينا؟<br />و هل جفت ينابيع الهدى ام اشجبت فينا؟<br />فما المعنى بان نحيا فلا نحيي بنا الدينا؟<br />و ما المعنى بان نجتر مجدا ماضيا حينا؟<br />و حينانطلق الاهات ترويحا و تسكينا<br />اسائلكم اسائلكم..عسى يوما يوافينا<br />و نبرم فيه بلاقدام يرموكا و حطينا<br />فعذرا ان عزفت اليوم الحان الشجيينا<br />وان اسرفت في التبيان عما بات يدمينا<br />فان الكون مشتاق لكم شوق المحبين<br />بنا يعلو منار الحق في الدنيا و يعلينا<br />هذه الابيات من انشوده\"اتتني في سكون الليل\" من شريط لبيك و فداك روحي و انصح بسماعها فهي مؤثره جدا<br />اسال الله ان يجعل هذا الموقع في ميزان حسنات القائمين عليه<br />اما بالنسبه للاخ الذي يطلب مساعده لاسره المذكوره<br />فانا يا اخي لا املك لك الا الدعاء بان يرفع الله عنكم و ان يوفقك الى من تريد الوصول اليه و ان ييسر للاخوه في موقع عشرينات مساعدتكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114640/http://www.20at.com/article2.php?sid=664"
