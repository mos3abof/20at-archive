[[comments]]
order = 0
subject = "اللهم إن هذا منكر"
author = "مجهوووول"
posted = "2005-12-19"
text = "ليس بيدنا إلا أن نقول لقد بلغ السيل الزبى، ولاحول ولاقوة إلا بالله.<br />إقدام الناس على إحراق أنفسهم هو والله للوصول للباب المسدود..فماذا يرى حكامنا ورؤساؤناااااااااا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151007/http://www.20at.com/article2.php?sid=115"

[[comments]]
order = 1
subject = "ليس هذا ما نريد"
author = "مغربي"
posted = "2005-12-19"
text = "آلمني ما حدث ككل المغاربة الغيورين ، ولكني كنت أتمنى أن يكون النضال بشكل أرقى من هذا الانتحار الجماعي انا اعذرهم حتى لا تفهموني غلط..<br />ولكن من سيتمم المشوار إذا احرقنا كلنا أنفسنا؟؟؟<br />هذا ما يريدون ان نيياس ونفشل وننتحر، ولكننا ينبغي أن نترفع عن هذا المآل، ونواصل المسيرة بعزم وإصرار..<br />ولا يسعنا الا ان نقول اللهم إن هذا منكر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151007/http://www.20at.com/article2.php?sid=115"

[[comments]]
order = 2
subject = "لا حول ولا قوة الا بالله"
author = "حسناء"
posted = "2005-12-20"
text = "بسم الله الرحمان الرحيم<br />ليس شباب المغرب وحده الدي يعاني من البطالة فكل شباب العالم وخاصة شباب الدول العربيةيعانون من قلة فرص الشغل فليس الحل هو ان نقدم علي حرق انفسنااو ارتكاب معصية فاين ايماننا بالله فدعونا نفكر في حل اخر والله الموفق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151007/http://www.20at.com/article2.php?sid=115"

[[comments]]
order = 3
subject = "حريك هنا واخر هناك"
author = "مجهول"
posted = "2006-02-04"
text = "مادا يمكننا ان نقول حين نشاهد هده الماساة شباب يحرق نفسه في البحر واخر في البر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151007/http://www.20at.com/article2.php?sid=115"

[[comments]]
order = 4
subject = "من نكون نحن"
author = "مجهول"
posted = "2006-02-04"
text = "من نكون نحن اللدين وهبنا انفسنا لسلطان الموت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151007/http://www.20at.com/article2.php?sid=115"

[[comments]]
order = 5
subject = "من يكون المسؤول"
author = "محمد"
posted = "2006-02-04"
text = "حين نلاحض هده المشاهد نتساءل من المسؤول عن هدا وارجو ان يبقى هدا السؤال عند المهتمين كيف والى متى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151007/http://www.20at.com/article2.php?sid=115"
