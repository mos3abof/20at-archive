subject = "انظمة الجور"
author = "يا أخوان إن من يحاصر أهل فلسطين هم أنظمة الجور ، وعلى رأسهم ال سعود وحسني ونظام الاردن ونظام الاسد ، فلولا هذة الانظمه ، وخيانتها لله ورسوله ، ما عانى أهل فلسطين من هذا الحصار."
posted = "2006-06-06"
text = "يالله العجب !! ال سعود ومشايخ الخليج يتلاعبون باموال الامة وينفقونها يمنة ويسرة على شهواتهم التي لاتنتهي ، وأهل فلسطين لايجدون مايأكلون.<br />ولكن يحق لنا أن نسأل ، حتى متى اختلال الموازين هذا ، وحتى متى يتحكم الطغاة في مصير الامة؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟!!!!!!!!!"
