subject = "كراميلة"
text = "استنوا كده...<br />خلوني أفكر...<br />كلمة السر زرنيخ...ممم...والبضاعة في بطن الزير...<br />و بتتكلم من ليبيا....عرفتك...!!!<br />ده يا جماعة علي عبد المنعم صديق قديم للبرنامج...قصدي للموقع من ليبيا :)))<br />بس أنا رأيي يا أخ علي إن الموقع حيكون أجمل بموضوعات عن شيوخ القبائل و الذي منه :) !!"
archived = "2004-11-29"
capture_url = "https://web.archive.org/web/20041129063212/http://www.20at.com:80/article.php?sid=776"

