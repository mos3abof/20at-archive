[[comments]]
order = 2
subject = "المهم أن لا يكون ابن يهودية..."
author = "رؤوف القاضي"
posted = "2006-01-08"
text = "انكشف مقلب \"دتلف مليس\" حين عرفت حقيقة كونه ابن يهودية ألمانية. الأنكى أن أمه ماتت في حرب حزيران 67 ... في الجولان السوري تحديداً! والعرف اليهودي يقول: \"كل من ولده رحم يهودية، فهو يهودي\". فيا لمصداقية هذا \"القاضي\" النزيه جداً!<br />الآن يطل \"براميرتز\" بطلعته البهية. فلنتمن أن لا نكتشف أن أمه، زوجة النجار، يهودية، سراً أو علناً."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112610/http://www.20at.com/article2.php?sid=147"

[[comments]]
order = 3
subject = "إسترحام"
author = "محروم"
posted = "2006-01-13"
text = "انا شاب في مقتبل عمري 30 سنة/ محاط بديون<br />قد اثقلت كاهلي ولم استطع تسديدها واتمنى<br />الامير الانسان ان يتولاني بعد الله عز وجل<br />بعطفه الذي بلغ شساع الارض وانا قد غربت<br />عن اهلي بسبب هذه الديون الملعونة<br />واتمنى ان اعود الى اهلي في اقرب وقت<br />ولن يتم ذلك الى بعد سداد كامل المستحقات<br />المتراكمة علي وجعل الله ذلك ياأميرنا<br />الانسان في ميزان حسناتكم ........ ودمتم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112610/http://www.20at.com/article2.php?sid=147"

[[comments]]
order = 4
subject = "القاضي الننوس"
author = "أكرم بس ( الشجاع سابقا )"
posted = "2006-01-20"
text = "هما بيقولوا الانطباعات الاولى تدوم<br />انا أول ما شفت الراجل ده متديتوش اكتر من 35 سنة و قلت في عقل بالي يا واد يا أكرم هما جايبين واحد لسه صغير عشان يعرفوا يضغطوا عليه و يرشوه كويس بس رجعت قلت ان بعض الظن اثم<br />و الايام هتثبت يا بهية اني لسه عند الوعد<br />( لو سمحتوا محدش يسأل من بهيه دي )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112610/http://www.20at.com/article2.php?sid=147"
