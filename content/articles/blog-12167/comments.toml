author = "ممدوح زكى زخارى جرجس"
posted = "2009-05-30"
text = "الى (حنان كمال)<br />بصراحة انت تفتقدى كل صور من صور الحنان<br />و ايضا انت معدومة من كل صور الكمال؟<br />تخلصى من الحقد و تمسكى بالقيم و الاخلاق و الاعراف الطيبة<br />و تذكرى جيداانة(لا شماتة فى الموت)<br />الموت قادم لجميعنا و لا مفر منة<br />انها ارادة (اللة)و لا رد لقدر (اللة)<br />اتفوا عليكى يا عديمة الحنانو ومفتقرة كل صور الكنال<br />(الكمال للة وحدة)"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621065858/http://www.20at.com:80/masr/blog/12167-2009-05-24-12-29-14.html"

