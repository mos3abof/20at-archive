text = "والله يا جماعة انا شايف ان الست مغلطتش في شيء<br />يعني محدش اتحمق كده يوم ما مات 1000 من ركاب العباره<br />محدش اتحمق كده لما مات ركاب قطار الصعيد بسبب الاهمال او بسبب المرضي اللي بيموتو كل يوم بسبب المبيدات المسرطنه او اللي بيموتو كل يوم بسبب الاهمال في المستشفيات او زيادة نسبة المتسولين او حتي بسبب الست ام ابراهيم اللي في الفيدو بتاع انهارده<br />اللهم احينا ما دامت الحياه خير لنا وامتنا ما دام الموت خير لنا"
