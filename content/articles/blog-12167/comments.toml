posted = "2009-05-27"
text = "يتردد الصوت على سمعى [ *** ]ريان النار فى الهشيم اشوكة رنانة انتى ام مارد يطرق بلا رنين<br />تلك اقل ما يصف به كلامك ولا اظن انك غانية فالغانيات لها اخلاق وعلى الاقل اخلاق مهنتها ولكن هل تستطعين ان تقولى لى اى اخلاقك ذهبت<br />انا استنكر مقالك هذا واستنكرك انتى شخصيا كأنسانة وبالطبع لن اظلم الحيوان واصفك به<br />يكفى انك تلميذة مجتهده للشيطان واغلب الظن انك الشيطان ذاته<br />على كل انا لست مع السلطة ولا ضدها ولكن انا ضد من يستهين بالعرف والتقاليد"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530002128/http://www.20at.com:80/blog/12167-2009-05-24-12-29-14.html"

[[comments]]
