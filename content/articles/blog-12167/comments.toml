posted = "2009-09-03"
text = "استاذ ممحدوح ياريت ترد باسلوب احسن شويه انت بتقول للاستاذة حنان ان لم تستحى…انت حيائك فين وبعدين مين فى العالم مفكرش فى الموت كلنا بس مين فهم الغرض الرئيسى من الموت ..اعتقد انك تعمل حساب موتك انت كمان فكر انك ممكن تتحاسب حتى على التعليق السخيف اللى انت قولته ز<br />استاذة حنان …احساسك ببلدك ده شىء جميل بس الاهم ان احنا نكون احسن منهم ما نفكرش ان احنا ناذى حد علشان نعمل اللى احنا شايفينه صح لا ده صح مبنى على الغلط وعلى العموم ربنا يساعدنا ان احنا نقدر نصلح من نفسنا علشان نقدر نصلح البلد"
archived = "2010-01-05"
