author = "محمد السيد"
posted = "2009-06-28"
text = "في غيه يا عالم …<br />أنا شايفه مغلطتش في ولا حاجة … دي بالعكس<br />عبرت عن أحلام ملايين بصدق عايشين في البلد المنهوبة من سي مبارك وبنيه …<br />وعجيب جدا الناس اللي ردت دي بالألفاظ دي … ولخروجهم عن الأدب إنما يعبر عنهم وعن شخصياتهم وعن تربيتهم …<br />شكرا حنان … وأسفين إذا كان في ناس دخلت تعلق … ومش قادرة تستوعب إن ممكن حد يكون له راي وكلام محترم ممكن يقبلوه …"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105154126/http://20at.com/masr/egyptian-blogs/12167-2009-05-24-12-29-14.html"

