author = "علي عوض"
posted = "2009-06-07"
text = "فعلا كل المدونيين فرغت انيتهم وبيعيدوا ويكرروا مواضيع تافهه عن متى يموت الرئيس<br />لازم كلكم تقفوا بجانب الرئيس وتدعوا له بالصلاح .<br />التوريث يا حنان مش فكره وانما واقع في جميع الدول الديموقراطيه والاشتراكيه والليبراليه<br />ارجعي للتاريخ وتعرفي السبب.<br />وما دام في متخلفين زي حنان وممدوح رخاري مستحيل مصر تتقدم خطوه للامام وانما<br />الف خطوة للخلف . وشي حاه يا حنان وزخاري"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621065858/http://www.20at.com:80/masr/blog/12167-2009-05-24-12-29-14.html"

