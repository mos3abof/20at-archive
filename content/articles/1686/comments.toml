[[comments]]
order = 0
subject = "اة"
author = "المحترم"
posted = "2006-01-13"
text = "واللهى ايران دى بتستهبل اوى<br />هى واللى اسمة نجاد دا<br />عمال يتكلم كلاام هو مش ادة طب لية ؟<br />نفسى اعرف لية بيعمل كدا ؟<br />اصلو مش هيخوف مثلا امريكا ولا اسرائيل ولا غيرهم دا اقل حاجة عندهم يقومو حرب على ايران وهيكسبوها مهما حصل<br />طب لية لية المشاكل دى ؟<br />ياخى حرام عليك شعبك ارحمهم ياشيخ من لسانك دا اللى هيوديك انت وبلدك ورا الشمس ارحمهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151759/http://www.20at.com/article2.php?sid=245"

[[comments]]
order = 1
subject = "الاخ المحترم علي فكره نجاد راجل ممكن يكون محترم"
author = "عبده نصحي"
posted = "2006-01-13"
text = "الاخ محترم قرار الحرب مش قرار سهل زي ما انت متصور كدا يالا بينا نحارب وبتاع ثانيا ايران قوه لا يستهان بيها وزي ما قال نجاد من يملك الوقود النووي يملك قوه عسكريه واقتصاديه ولازم تعرف حاجه تانيه برده يا اخ محترم انه الراجل مش بس بكلمته الراجل برعيته لبيته واسرته والمصري هيفضل مصري الفول جواه والطعميه مموتاه وبتاع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151759/http://www.20at.com/article2.php?sid=245"

[[comments]]
order = 2
subject = "حمدي"
author = "يا سلام ياعم نصحي علي الاشعار"
posted = "2006-01-13"
text = "الراجل مش بس بكلمته الراجل برعيته لبيته واسرته والمصري هيفضل مصري الفول جواه والطعميه مموتاه وبتاع<br />بس ايه بقي ال بتاع اللي في اخر جمله ولا ده خطا مطبعي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151759/http://www.20at.com/article2.php?sid=245"

[[comments]]
order = 3
subject = "نعم"
author = "تامر"
posted = "2006-01-14"
text = "لا انا مع المحترم طبعا<br />فعلا هو غاوى مشاكل<br />وايوة قرار الحرب سهل عند بلد زى امريكا لما تتفق معاها اسرائيل<br />دا بالاضافة لان اصلا موقف ايرا يعارض مجلس الامن كلو اذن فكل الغرب ضدها هيكون زائد بعض العرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151759/http://www.20at.com/article2.php?sid=245"
