subject = "نصيحة غالية من أهل ثقة"
author = "إيهاب دسوقى"
posted = "2006-12-28"
text = "الموضوع فيه لفتة ذكية يا أستاذ براء, وعلى رأى الحكيم القديم اللى قال..دا المصرى وقت الشده.. بيحافظ جدا ع العده"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103134/http://masr.20at.com:80/article.php?sid=1372"

[[comments]]
order = 6
subject = "رجالة"
author = "الشاب ده لم ينكر الواقعة الا لما تعرض لضغوط من قبل الشرطة ..وتهديد بأنهم هيلفقوا له قضية اتجار في المخدرات ..وغيره وغيره...فخاف و سكت ..لكن لما اخوه اتاخد القسم بعدها..خاف وطلع يجري على بيت وزير الداخلية ..ونصحه أحدهم بأنه يصعد شكواه..وبالفعل اتفتح الموضوع تاني..و قال عماد الكبير على كل اللي تعرض له بالتفصيل..بالمناسبة الضابط وامين الشرطة بيتحقق معاهم دلوقت ..وتبين ثبوت واقعة الاعتداء على الشاب ده..."
posted = "2006-12-29"
text = "الظريف جدا ان الشاب ده لما كان بيتعرض للاعتداء الجنسي كانوا بيصوروه و بيقولوله .. علشان الدنيا كلها تعرف ان بولاق الدركور مفيهاش رجالة !!! لكن يوم ما ثبتت التهمة على الظابط اللي حاول التعدي على المحقق (كمان) و امين الشرطة ..بارك عمرو اديب لعماد الكبير...وقال له علشان يعرفوا ان بولاق الدكرور فيها رجالة بصحيح.......<br />المشكلة في الرجالة اللي انكسروا فعلا و مقدروش يتكلموا..ومحدش يعرف عن البلاوي اللي تعرضوا ليها عن طريق رجال الشرطة (الابرار)"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103134/http://masr.20at.com:80/article.php?sid=1372"

[[comments]]
order = 7
subject = "بدل من ان الشرطه فى خدمة الشعب الشرطه بتفسد الشعب"
author = "باسم محمد سالم حسن"
posted = "2006-12-29"
text = "الضرر يلى حدث فى قسم بولاق الدكرور يحدث مثله فى محافظة الاسكندرية لكن مع الفرق البسيط وهو يتم الاعتداء بالضرب وتلفيق المحاضر للبنات وحبس البنات بدون اى وجهه حق ويبقى ايه يلى فاضل يحدث كل شىء موباح فى القسم وكأناكل شىء رخيص بنسبه للشرطه هتك العرض مباح تزوير المحاضر ممكن تهديد الناس ممكن قتل نفس بدون اى ذنب ممكن وكل ذلك لم يتحرك احد سوء كلام مش اكثر"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103134/http://masr.20at.com:80/article.php?sid=1372"

