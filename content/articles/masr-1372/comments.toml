subject = "لفت نظر لبراء"
author = "مصراوي2"
posted = "2007-01-04"
text = "تحياتي لك على الموضوع<br />ولكن ألفت نظرك إلى أن التغيير بالموبايل هو تغيير باليد.<br />ولا يجوز يا أخي التعامل مع الحديث الشريف بهذه الصورة حتى ولو كان بحسن نية.<br />وفقكم الله<br />اللهم فك كرب المصريين"
