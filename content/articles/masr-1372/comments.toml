[[comments]]
order = 11
subject = "الشرطه تلفق للشعب"
author = "عبدالحميدمحمد"
posted = "2007-01-09"
text = "طول مافي شرطه في مصر بهذا الوضع في جمهوريه مصر العربيه فاقولها باعلي صوتي ان لله وان اليه راجعون قتل شقيقي بايدي ضابط الشرطه واعوانه بمركز شرطه وللان لم يتم البت في القضيه تم تزوير تقرير الطب الشرعي القضيه اكثر من ثلاث سنوات ولاكن التكاسل والتقاعص لكي تموت القضيه وتنتهي ولايسعني ان اقول تحيا مصر بحاميها حراميها وحسبنا الله ونعم الوكيل"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103134/http://masr.20at.com:80/article.php?sid=1372"
