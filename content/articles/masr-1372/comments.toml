[[comments]]
order = 3
subject = "امتهان كرامة الانسان"
author = "لا شىء فى الدنيا يعادل امتهان كرامة انسان"
posted = "2006-12-28"
text = "لو ان هذا حدث فى بلاد الواق واق لقامت الدنيا ولم تقعد<br />الم تكن ايام الاحتلال البريطانى اسعد حالا-<br />مصرى يضع يد مقشة فى طيز مصرى تانى وهو يصرخ - هل عادت ايام الهمجية من تانى<br />اين تعلم هذا الضابط ومن علمة<br />هل عدنا لنظام التعذيب على الخاذوق<br />هل هذا الضابط مصرى اشك<br />ماهو الاجراء الذى اتخذ<br />يا بؤس ايامكم القادمة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103134/http://masr.20at.com:80/article.php?sid=1372"

[[comments]]
order = 4
subject = "عذرا"
author = "البراء أشرف"
posted = "2006-12-28"
text = "اسف يا شباب.. تم تعديل الخطأ غير المقصود. الرجل اعترف فعلا في القاهرة اليوم.. لكنه عاد لينفي في برامج أخرى وفي جرائد قومية..<br />عموما الواقعة ليست هي المقصودة ولكن المفهوم نفسه<br />اشكركم، وعذرا مرة أخرى<br />براء"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103134/http://masr.20at.com:80/article.php?sid=1372"

[[comments]]
