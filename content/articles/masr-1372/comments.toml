subject = "خلي براء صاحي!!"
author = "طيب الله يبارك لك يا عم براء خلي دماغك برضه صاحي معانا .. الواد اللي اسمه عماد الكبير اعترف بكل حاجة حصلت له في القسم في برنامج القاهرة اليوم ..وقال الشتايم باللفظ ..والغريب ان عمرو اديب موقفوش ..وسابه يقول قدام محاميه كل الالفاظ اللي اتشم بيها فعلا ..وهي شتايم بتبدأ بحروف (خ ...// ع// متــ..) ووصف بالظبط بالظبط فظاعة موضوع المقشة و قال الاوساخ الشواذ الكلاب بتوع الشرطة كانوا بيقولو ا له ايه ساعة ما كانوا بيعتدوا عليه ..."
posted = "2006-12-28"
text = "ما تصحى يا عم براء و متاخدش الكلام عن لسان حد.."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103134/http://masr.20at.com:80/article.php?sid=1372"

