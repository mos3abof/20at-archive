text = "أرجوا أن تكون هذه الجريمة بداية نوبة فوقان للشعب المصرى ضد تعسف و جبروت رجال الشرطة الفاسدين المفسدين المرتشين الجائعين الجاهلين الحاصلين على تخرجهم بالفلوس و الرشوة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103134/http://masr.20at.com:80/article.php?sid=1372"

