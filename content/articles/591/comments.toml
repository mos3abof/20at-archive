[[comments]]
order = 13
subject = "عباد الله الكلاب"
author = "عبد من عباد الله"
posted = "2006-02-06"
text = "أحد الإخوة علق وفي نهاية تعليقه قال \"فاحذروا _ عباد الله - الكلاب والمقصود من كلمة عباد الله هنا جملة اعتراضيةوالمعنى فاحذروا الكلاب يا عباد الله ولكن الصياغة لم تكن موفقة فأوحت بمعنى آخر وهو أن عباد الله كلاب وهو غير مقصود طبعا لكنه ينبهنا إلى مراعاة علم البلاغة... معلش أصل أنا أزهري ... ودا بيفكرني بموقف طريف حصل مع سيدنا أبو بكر خدناه في 3 أو 4 ثانوي في مادة البلاغة وهو مشابه جدا لذلك حيث ذهب سيدنا أبو بكر إلى السوق ليشتري ثوبا وسأل أحد التجار هل تبيع هذا فقال لا يرحمك الله وهو يقصد أن يقول لا أبيعه ثم يدعو لسيدنا أبو بكر بالرحمة ( التي تجوز على الحي والميت طبعا ) فقال له سيدنا أبو بكر قل لا ويرحمك الله لأن المعنى على العبارة الأولى أنه يدعو على سيدنا أبي بكر بعدم الرحمة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112633/http://www.20at.com/article2.php?sid=380"

