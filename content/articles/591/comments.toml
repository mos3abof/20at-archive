[[comments]]
order = 7
subject = "المسلم لا يقتني كلبا"
author = "نهي النبي -صلى الله عليه وسلم - أن يقتني المسلم كلبا غير كلب صيد وحراسة ."
posted = "2006-02-04"
text = "فقد جاء عنه -قوله -صلى الله عليه وسلم : من امسك كلبا غير كلب صيد وحراسة ، نقص من عمله كل يوم قيراطان.<br />كما جاء عنه -صلى الله عليه وسلم - أن الملائكة لا تدخل بيتا فيه كلب وصورة .<br />وقد اثنى الله على المؤمنين ، بأن الملائكة تدخل عليهم من كل باب.<br />فمن أمسك كلبا فقد حرم نفسه بركة دخول الملائكة بيته ، كما اته عرض عمله للنقصان ، زد على ذلك مافيه من التشبه بالكافرين ، وقد نهينا عن التشبه بهم.<br />فاحذروا - عباد الله - الكلاب ، فهي منقصة لاجوركم مذهبة لبركتكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112633/http://www.20at.com/article2.php?sid=380"

