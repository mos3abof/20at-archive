[[comments]]
order = 17
subject = "أنا جديد عليكم"
author = "حمادة الكبير"
posted = "2006-05-07"
text = "مش عارف أبدأ منين ... أنا بدأت فعلا,<br />طب أقول ايه ... الكلام كتير بشكل يتناسب معه قول القائل \"تتدافع العبارات في ذهني متزاحمة ولا أدري بأيها أبدأ\" ما أجمل اللغة العربية.<br />نتكلم سياسة .... يخرب بيت كل من يفكر في نفسه علي حساب غيره ... ولا بلاش يخرب بيته لآن الكثيرين يفعلون ذلك جهلا ... آه تيجو نتكلم عن الجهل وعدم الوعي وأثرهم علي المجتمع...<br />آآآآآسف نسيت أنكو بتتكلموا عن القطط والكلاب ... القطط جميلة رقيقة عيبها الوحيد مسألة الأمراض التي أساءت الي سمعتها أخيرا ... الكلاب ممتعه ورشيقة لكنها نجسه كما قال علماء الدين - الذين أحمل لهم كل الحب والاحترام - .<br />كان الأجانب - الألمان بالذات - يشجعون علي اقتناء هذه الحيوانات ثم بدأوا يحذروا منها بسبب الأمراض....<br />أقوللكم ... يللا حصل خير ...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112633/http://www.20at.com/article2.php?sid=380"

