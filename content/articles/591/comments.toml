subject = "القطة الخاينه"
author = "أكرم بجد"
posted = "2006-02-03"
text = "القطة الخاينة و انا صغير عضتني و نا باكلها اللحمة (انا مبقولش كده عشان تعرفوا اننا من عيلة ارستقراطية بتاكل اللحمه ) بس انا حبيتهم جدا<br />حاجة كده ناعمة بفرو و وش طفولي بريء و بتنونو كمان تبقى ايه ؟؟<br />كائن لطيف ظريف بيحبك لما بيكون ليه مصلحة و بينفضلك لما تبقى عايز تلعب معاه بس<br />ندل و جبان و خاين و بتاع مصلحته على رأي احمد يوسف<br />بس برضوا هأكلها لبن و سمك و لحمه كمان<br />بحبها بجد حد ليه مانع ؟؟<br />بلدي رومي سيامي اي نوع<br />دي رحمه يا ناس حتى لو جابتلي التهاب سحائي مش مهم ( ده الحب في القلب زي عضة الكلب )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112633/http://www.20at.com/article2.php?sid=380"

