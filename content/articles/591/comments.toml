text = "هاى ياجماعة<br />بصو بقى انا معايا اجمل قطة فى مصر<br />اة فعلا اللة عليها حلوة اوى اوى وهى كمان بتحبنى وبتقعد معايا<br />وانا بحبهااا اوى<br />بس معنديش كلب لانى بخاف منو بحس انو ممكن يعضنى كدا على غفلة<br />وانا بحذركم اوعو حد يكون بيضرب قطط دا تحذير"
