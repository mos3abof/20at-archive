[[comments]]
order = 10
subject = "بحب بجد"
author = "أرجوان"
posted = "2006-02-04"
text = "هامووووووووووووت و يكون عندى قطه ...او كلب لولو...بجد...باحس انهم بزيدوا الرومانسيه و الحنان عند الواحد.<br />و بصراحه الواحد فعلا نفسه ياخد قطه كده فى حضنه و يلعب فى شعرها الجميل ...النظيف طبعا.... موش هاقول موش بحب العصافير او السمك...لا بحبهم بس ما بحسش انهم هيدونى ولا هيخدوا منى نفس الحنان الى هاده لقطه.<br />اما الكلاب انا فعلا نفسى يبقى عندى كلب لولو او كلب بوليسى...لكن فى الحالتين موش نافع و لا فى امل اصلا...الكلب الولو دلوع و موش هيستحمل يقعد بره البيت و لا انا هيجيلى قلب اصلا...و لكن حرام يدخل البيت عشان المايكه فى بيتنا اهم من وجود كلب...و طبعا لا مقارنه.<br />اما لو كلب بوليسى فرضه موش نافع...عشان ده هيقعد بره البيت اه بس موش هاقدر احضه فى حضنى و لا هاحس انو يستاهل حنان اوى...يعنى لانه حمش كده و شرس..و كمان موش هاعرف اجرى معاه فى جنينه و لا بتاع عشان قدام الناس ما ينفعشى<br />ده علاوه عن ان ماميتو بيبيتو موش راضين اصلا لا بقطه ولا كلب و لا حتى فراشه<br />هابقى بقى اجيبهم من فلوسى<br />على فكره الموضوع جميل اوى و كان نفسى اتكلم فيه من زمان بس موش هاطول اكتر من كده انا رخمت اوى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112633/http://www.20at.com/article2.php?sid=380"

