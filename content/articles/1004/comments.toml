text = "أنا بصراحة لما أثير موضوع الأرمن والأتراك ده حاولت أقرأ شوية في الموضوع وأعرف شوية معلومات عنه<br />أنا متفق أن الأتراك ارتكبوا هذه المذابح في حق الأرمن<br />ولكن ما استفزني أن يصير ذلك قانونا فهذا ضد حرية الرأي تماما<br />انهم هكذا يمنعون حرية البحث في التاريخ وأي مؤرخ عندما يقرر أن يخوض في هذا الموضوع سوف يصطدم بهذا القانون الجائر<br />من المؤسف صدور هذا القرار عن فرنسا العلمانية الديمقراطية"
