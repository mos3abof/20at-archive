[[comments]]
order = 4
subject = "رد على تعليق \"رد على احمد بلال\" ل طيف بدر"
author = "أحمد بلال"
posted = "2006-10-20"
text = "أولا شكرا مرة أخرى على الرد<br />بالنسبة الى ان اتاتورك كان القائد الاعلى للقوات العثمانية ابان مذابح الارمن و هو المسئول عن الجرائم<br />عذرا فهذا الكلام خطأ تماما اثناء مذابح الارمن كان عمر اتاتورك 34 عاما و كان في هذه الفترة يحارب قوات الحلفاء في جبهة الدردنيل<br />و لم يترقى اتاتورك الى رتبة جنرال فقط و ليس حتى قائد اعلى الا في عام 1916 بعد الانتصارات التي حققها على الحلفاء<br />و لم يترقى اتاتورك الى رتبة رئيس الاركان الا في اغسطس 1922 اي بعد انتهاء المذابح و لم يشغله وقته سوى حرب الاستقلال التي شنها ضد السلطان العثماني<br />اما بالنسبة للينكات التي ارسلتها<br />بالنسبة للينك الاول لا ينفي كلامي حيث ان ما جاء فيه هو<br />ولهذا لم تتوع السلطات التركية في استخدام أكثر الوسائل بشاعة وأشدها رعبا بغية تطبيقه, ولم يكن الأرمن وحدهم ضمن هذا المشروع, بل الاكراد أيضا الذين كانوا ينتظرون دورهم في المذابح بعد حين. فما أن اندلعت ثورة الشيخ سعيد عام 1925 حتى راح مصطفى كمال أتاتورك يعد العدة لضرب الأكراد<br />التاريخ هنا 1925 اي بعد ثورة اتاتورك و ليس 1915 و هو تاريخ مذابح الارمن قبل ثورة اتاتورك<br />بالنسبة للينك الثاني<br />لم اجد فيه الا ما يؤكد كلامي و لا يوجد فيه سطر واحد يقول ان اتاتورك هو المسئول<br />و هذه مقتطفات منه تتحدث عن مذابح اخرى للدولة العثمانية ضد الارمن حتى قبل ظهور اتاتورك ( و الحمد لله انك الذي ارسلت اللينكات \"<br />تقول فقرة<br />وتشير الوقائع التاريخية الى رفض السلطان عبد الحميد الثاني (1876-1909) منح الأرمن وبقية الشعوب الرازحة تحت نير الاستعمار والطغيان العثماني حقوقهم الوطنية، ورفض حتى تطبيق الإصلاحات الشكلية المنصوص عليها في معاهدة برلين التي وافق عليها والخاصة بالولايات والمناطق الأرمنية، مستغلاً عدم جدية الدول العظمى في تطبيق هذه الإصلاحات وسعيها وراء تحقيق مصالحها الذاتية فقط، وذبح أكثر من 300 ألف أرمني من مواطني الدولة العثمانية خلال الأعوام من 1894-1896، فأطلق عليه الرأي العام الأوروبي لقب (السلطان الأحمر) و (السفاك الكبير) . وبعد الانقلاب العثماني عام 1908 بقيادة (حزب الاتحاد والترقي)، ارتكبت بحق الأرمن مجزرة في (اضانة) عام 1909 راح ضحيتها أكثر من 30 ألف أرمني. بيد أن كل تلك المذابح –على الرغم من شدتها ووحشيتها- كانت أقل (تنظيما وقسوة ووحشية) من مذابح الأرمن العظمى التي جرت عام 1915 والتي أزهقت فيها نفوس مليون ونصف المليون شخص<br />و تقول اخرى<br />قامت الحكومة العثمانية بعزل الجنود الأرمن المجندين في الجيش العثماني وتجريدهم من السلاح وتشغيلهم بأعمال السخرة، حتى وصل الأمر إلى إجبارهم على حفر قبورهم الجماعية بأيديهم قبل قتلهم !!هذه العمليات الوحشية انتهت بمصرع 50-60 ألف جندي وضابط أرمني في الجيش العثماني تحت ظروف بشعة<br />و فقرى ثالثة تتحدث عن مذابح ضد العرب ايضا<br />انتهجت السلطات العثمانية سياسة التتريك تجاه هاتين القوميتين ( العربية و الارمنية ) لكبح جماح انطلاقتهما، والحد منها وإخمادها في النهاية. فأقدمت هذه السلطات على قتل القادة والزعماء الأرمن، وكما ذكرنا، اعتباراً من 24 نيسان-أبريل 1915، ثم اتبعتها بعد أسبوعين، وبالتحديد في 6 أيار-مايس 1915 بنصب المشانق للزعماء العرب في دمشق وبيروت،<br />جمال باشا الذين عُيّن قائداً للجيش الرابع العثماني المتمركز في سوريا وفلسطين، إلى جانب شنق الوطنيين العرب، عملية نفي 10 آلاف عائلة عربية (مشكوك في ولائها !)، وقتل آلاف الناس، وسلب الممتلكات، بضمنها الأماكن المقدسة الإسلامية في النجف وكربلاء\"<br />أما اللينك الثالث فلا يوجد فيه لا من قريب و لا من بعيد عن موضوعنا<br />و لك جزيل الشكر<br />و الى هنا يكفي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130343/http://www.20at.com/article2.php?sid=1370"

