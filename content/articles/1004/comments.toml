[[comments]]
order = 2
subject = "العزيز صاحب تعليق \"الموضوع فيه مغالطات تاريخية\" رجاء مراجعة التاريخ"
author = "أحمد بلال"
posted = "2006-10-20"
text = "العزيز صاحب تعليق \"الموضوع فيه مغالطات تاريخية خطيرة\" ..<br />شكرا جزيلا على تعليقك<br />و شكرا جزيلا على رأيك الشخصي في كتابتي<br />أولا يا سيدي العزيز أرجو منك مراجعة معلوماتك التاريخية و التي أعلم تماما أنه من ضخامتها غابت عنك معلومة بسيطة و هي أن تلك المذابح تمت خلال الحرب العالمية الأولى و التي انتهت في عام 1917، و كانت تركيا في تلك الفترة خاضعة للدولة العثمانية و التي كان يطلق عليها آنذاك ( رجل أوربا المريض )، أما الثورة الاتاتوركية فلم تتم الا في العام 1923 حين أعلن كمال اتاتورك قيام دولة تركيا الحديثة و الغاء الدولة العثمانية ثم قام بعد ذلك بانقلاباته الشهيرة.<br />ما أقصده أن تلك المذابح قامت قبل قيام نظام أتاتورك بحوالي 8 سنوات.<br />أما عن نصيحتك بعدم قراءة قصاصات من الورق ثم ننسخها بعد ذلك في موضوعات أؤكد لك تماما عدم صحة هذا الرأي لسبب بسيط جدا هو أن الدولة العثمانية و الدولة التركية الحديثة كانت موضوع دراستي لمدة 4 سنوات.<br />أكرر شكري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130343/http://www.20at.com/article2.php?sid=1370"

[[comments]]
