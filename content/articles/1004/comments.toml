subject = "الموضوع به مغالطة تاريخية خطيرة"
author = "ذكر الدكتور محمد سليم العوا ان زعيم طائفة الارمن في عام 1980 نفي تورط الدولة الاسلامية ( العثمانية ) من ابادة الارمن وذلك في مؤتمر بالامم المتحدة عام 80 والقي زعيم الارمن الاتهام علي دولة ونظام اتتاورك العلماني بانه المسئول الاول عن هذه الجرائم"
posted = "2006-10-20"
text = "فرجاءا يا عشرينات او يا بعض كتاب عشرينات الضعاف جدا جدا عدم الاكتفاء بقراءة قصصات الورق التي تقرأونها ثم تنسخوها في مواضيع وتشنفوا بها صفحات انترنت"
