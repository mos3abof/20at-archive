text = "المشكله يا أبو حميد أن الغرب المتشدق بالحريه لا ينادى بالحريه لكل الإنسان بل للإنسان الغربى فقط أما بقية الإنسان فدوره فى الحياة أنه موجود على أرض عربيه أو إفريقيه موجود عليها لكى يزرع للغرب وعلى الغرب أن يأتى لكى يستعمر ويأخذ هذه الثروات لكى يتطور ولا ننسى أن مناطق نفوز دول الغرب الإستعماريه لا زالت موجوده وفرنسا نفسهالازال لها نفوز فى مستعمراتها القديمه خرجت بجنودها ولكن لازال لها رجال يبعثون لها بخيرات هذه الدول وشكراً على الموضوع الجميل يا أحمد"
