subject = "الحق تصنعة القوة"
author = "عصام شعبان"
posted = "2006-10-20"
text = "مساء الفل<br />اولا شكرا يا احمد على مقاللك<br />بسيا عزيزى لا حق بلا قوة الارادة المستلبة طوعا وجبرا من حكامنا العرب ومن ما خلفوة من كوارث قتلت حتى الحلم فى ان يكونلنا موقف وعندما تكون عندك اراة الكل سوف يقدر ذللك فى تصرفاتة وكلامتة القوة تخلق وتشكل مواقف الاخرين اما نحن شعب رجعى خائف مقهور وصامت تحت حكم الاستباد الاقتصادى قبل السياسى ارغة الخبز العشرين يخشى \" غلابة\" بلدنا يصبحو عشرة<br />والقيادة اللى مش تاريخية بالمرة مش بتسال ولاة راح تسال اولاد العم عن الاسرى المصرين اللى تجاوزو 170 اسير فى السجون الاسرائيلة حتى الان .<br />خلاص دول سلمو"
archived = "2006-11-02"
