[[comments]]
order = 7
subject = "مذابح الفرنسيين ضد أهلنا في الجزائر"
author = "طيف بدر"
posted = "2006-10-21"
text = "· بقلم: أحمد منصور<br />«إن التعذيب لم يجد نفعا في ذلك اليوم لان المعتقل توفي من دون أن يتفوه بأي كلام ... لم أفكر في شيء، ولم يتمالكني أي شعور بالندم لموته، وإذا ندمت على شيء فعلى انه لم يبلغني شيئا قبل أن يموت».<br />هذا الاعتراف الهادئ الذي يخلو من أي شعور بالندم أو الذنب أدلى به الجنرال بول أوسيريس (83 عاما) أحد أبرز جنرالات فرنسا السابقين الذين عملوا في الجزائر خلال الخمسينيات، وذلك في كتاب صدر له يوم الخميس الماضي في فرنسا تحت عنوان «الأجهزة الخاصة» تحدث فيه باسهاب عن الجرائم التي قام بها جنرالات فرنسا في الجزائر خلال احتلالهم لها وخاصة خلال سنوات المقاومة في الخمسينيات. وفي هذه الفقرة كان الجنرال يتحدث عن أول مجاهد جزائري قتله تحت التعذيب حيث اعترف الجنرال بأنه قد قتل أربعة وعشرين جزائريا وحده تحت التعذيب حينما كان في جهاز المخابرات الفرنسي أثناء خدمته في الجزائر، وعلل قتله لهؤلاء «بكونهم كانوا أعضاء في جبهة التحرير الوطني الجزائرية وبالتالي فانهم كانوا يشكلون خطرا على القوات الفرنسية».<br />الاعتراف القنبلة وكانت هذه القضية قد تفجرت في شهر نوفمبر من العام الماضي في فرنسا حينما أقدم الجنرال جاك ماسو (94 عاما) رئيس جهاز المخابرات الفرنسية السابق في الجزائر يرافقه مساعده الجنرال بول أوسيريس على الاعتراف بما ارتكبه الفرنسيون من جرائم في حق الجزائريين ابان حرب التحرير التي قامت بين عامي أربعة وخمسين واثنين وستين، وكان اعتراف الجنرال ماسو بمثابة قنبلة ألقيت في قصر الأليزيه آنذاك إذ وقف أمام الصحافيين ووسائل الاعلام الفرنسية والعالمية قائلا: «لقد حان الوقت لكي تعترف فرنسا بما قامت به في الجزائر وتدينه، لقد كانت هناك عمليات تعذيب واعدامات سريعة كانت تمارس بطريقة روتينية خلال حرب الجزائر 1954 - 1962» وكانت أهمية وخطورة هذا الاعتراف انه أنهى براءة فرنسا من هذه الجرائم التي ظلت تنكرها طيلة أربعين عاما، وأربك حكومة ليونيل جوسبان بعدما طالب الحزب الشيوعي الفرنسي حينها بفتح ملفات تلك الحقبة.<br />وقد أكد الجنرال ماسو على ان الأوامر بالاعتقال والتعذيب كانت تصدر من مؤسستين عسكريتين هما «مركز التنسيق الداخلي لأسلحة الجيش الفرنسي»، و«الأجهزة العملانية للحماية». ورغم وجود نبرة للندم وعذاب الضمير في اعترافات الجنرال ماسو إلا ان مساعده الجنرال أوسيريس بدا غير نادم على شيء، بل انه اعترف بقتل أربعة وعشرين جزائريا تحت التعذيب. وأضاف بأن «هناك أكثر من ثلاثة آلاف جزائري فقدوا من أصل أربعة وعشرين ألفا كانو موضوعين في الاقامة الجبرية وان ما حصل لهؤلاء المفقودين في الواقع هو انهم كانوا يعدمون».<br />الملف الأسود اهتزت أركان الدولة الفرنسية آنذاك حينما خرجت هذه الاعترافات من الجنرالين في نوفمبر الماضي، وذلك لان فرنسا ظلت حريصة على أن يبقى هذا الملف طي الكتمان حتى يلف الموت كل من شاركوا فيه. ورغم ان الموت قد لف كثيرا منهم بالفعل إلا ان الجنرالين فجرا القنبلة قبل أن يلفهما الموت، ولم يقف الأمر عند هذا الحد بل ان الجنرال أوسيريس أقدم على اعداد كتابه الذي صدر في باريس يوم الخميس الماضي متضمنا اعترافات كاملة وتفاصيل مذهلة عما قام به وزملاؤه من الضباط الفرنسيين من جرائم بحق الجزائريين، وأكد أوسيريس في كتابه الذي نشرت الصحف الفرنسية مقتطفات منه على ان التعذيب والاعدامات السريعة وقتل المدنيين والتي كان تقديمها على انها أعمال انتحار كانت من الممارسات الشائعة لدى الأجهزة الفرنسية في الجزائر عند التحاقه بها عام 1955، كما دافع عن هذه الأساليب الاجرامية وقال: «انها كانت فعالة فبدافع الخوف كان ينهار المعتقلون ويبدأون بالكلام ثم ينتهي الأمر بعد ذلك بتصفيتهم».<br />كما انه دافع عن الاتهامات التي وجهت له من أركان الدولة الفرنسية الذين اهتزوا لهذه الاعترافات فور نشرها بدءا من الرئيس الفرنسي شيراك إلى رئيس الوزراء جوسبان إلى وزير الدفاع آلان ريشار وقال: «ان أركان الدولة الفرنسية كانوا راضين تماما عن هذه الأفعال». وكان رئيس الوزراء الفرنسي قال ان اعترافات الجنرال «تنطوي على انتهاكات رهيبة تستدعي ادانة أخلاقية تامة» أما وزير الدفاع فقد سعى للدفاع عن المؤسسة العسكرية الملوثة أيديها بالدماء طبقا لاعترافات الجنرال أوسيريس قائلا: «ان هناك أقوالا وأفعالا لا تدين سوى أصحابها». فاذا كان الجنرال قد ذكر بأن الأوامر قد صدرت عن مؤسسات عسكرية معروفة فان المؤسسة العسكرية كلها أصبحت الآن في دائرة الاتهام.<br />ورغم ان الجنرال بحكم قوانين العفو الفرنسية لا يمكن محاكمته الآن إلا في المناداة بادانته ادانة اخلاقية هي محاولة للهروب من فتح ذلك الملف الأسود لفرنسا في الجزائر، لان فتح الملف لن يقف دون شك عند حد جرائم الجنرال الذي وصفته الصحف الفرنسية بالجنرال «القبيح» أو المقيت أو المثير للاشمئزاز أو عند أربعة وعشرين جزائريا اعترف هو بقتلهم أو ثلاثة الاف أقر بأن الفرنسيين قد أعدموهم في معسكرات التعذيب، وانما سوف يفتح ملف جرائم فرنسا في الجزائر الذي بدأ عام ألف وثمنمائة وثلاثين ومازال كثير من الجزائريين يعتبرونه مفتوحا حتى الآن."
archived = "2006-11-02"
