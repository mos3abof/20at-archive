[[comments]]
order = 0
subject = "كلاب"
author = "احمد"
posted = "2005-12-20"
text = "هم الكلاب فبتأككيد هيستخدموا كلاب، بس هنقول ايه ربنا ياخدهم ويريحنا منهم، طيب فين الدول وجمعيات حقوق الانسان، والمنظمات الدولية، واللي هي عجبها اللي بصير، ربنا يخرب بيوت الحكام العرب قبلهم يارب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142955/http://www.20at.com/article2.php?sid=122"

[[comments]]
order = 1
subject = "اللهم انصر الضعفاء"
author = "الشيماء"
posted = "2006-08-27"
text = "ان القلب لينزف والعين لتدمع واللسان ليعجز عن الكلام امام هزا ولا اجد امامي سو اللجوء الي الله ولاستنصار به فهو يجيب المضطر ازا دعاه اللهم رد كيدهم عليهم وارنا فيهم نصرك الموعود وفي كل خاءن يعيش بدماء الاطفال الشهداء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142955/http://www.20at.com/article2.php?sid=122"
