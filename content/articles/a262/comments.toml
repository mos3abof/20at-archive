[[comments]]
order = 3
subject = "لماذا لا نقوم بتجربة عملية للديمقراطية؟"
text = "لماذا لا نقوم بتجربة عملية للديمقراطية؟<br />أدعو كاتب المقال إلى انتهاز أي فرصة وأضرب أي مسئول على قفاه وليس بالضرورة رئيس الجمهورية او رئيس الوزراء<br />ونرى ماذا يحدث؟ ووقتها نستطيع الحكم إذا كان يوجد ديمقراطية أم لا"
archived = "2004-07-04"
capture_url = "https://web.archive.org/web/20040704165015/http://www.20at.com:80/article.php?sid=262"

[[comments]]
order = 4
subject = "نبأ عاجل"
text = "جاءنا الان ان الحكام العرب اصدروا ملحقا لقرارات قمة تونس ردا على المواطن العربى ( الاكثر شغبا وتضليلا ) على عبد المنعم جاء فيه :<br />1- تصحيح التضليل بان شرودر لم يقل شىء بعد صفحه لانه بالتأكيد قال : آى<br />مع التأكيد على حرية كل مواطن عربى ان يصفع قائده ( الضرورة ) مع كفالة الا يقول الحاكم أى .<br />2- منع التعامل بكل انواع الاسبراى ذات اللون البنفسجى بل منع اللون البنفسجى نفسه<br />3- الزام جميع محلات الكباب بعدم بيع الكفتة ( السيخ ) مرة اخرى خوفا من العدوى ."
archived = "2004-07-04"
capture_url = "https://web.archive.org/web/20040704165015/http://www.20at.com:80/article.php?sid=262"

