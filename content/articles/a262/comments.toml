subject = "بودر ليلاه !!"
text = "اما انت غريب يا اخي...هوا حد كان سمع عن مواطن عربي ضرب رئيس الجمهورية بتاعوا و حصلوا حاجة...!!<br />بطلوا باة الخيالات المريضة بتاعتكوا..<br />ناس معندهاش دم"
