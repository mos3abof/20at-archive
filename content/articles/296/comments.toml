[[comments]]
order = 0
subject = "موضوع يستاهل المناقشة"
text = "السلام عليكم ورحمة الله وبركاته<br />الموضوع ده واقعي و بيحصل بجد<br />بس فيه مشكلة . ان حضرتك مكنتيش ايجابية في هذا الموقف . حاجة من اتنين . يا اما تقولي للسواق يعلي شوية و ياخد ثواب طوووول السكة . يا اما تسككتي و تنامي احسن .و الحل التاني سلبي منصحش بي.<br />طيب تخيللي ان الشريط اللي شغال اغاني و حلوة بس الصوت واطي. هتلاقي الف من يطلب من السواق انه يعلي شويتين مش شوية .<br />كده ادامكم حل من اتنين تحلوه<br />يا اما نكون ايجابيين<br />يا اما منشتكيش<br />و السلام عليكم<br />HMH"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044712/http://www.20at.com:80/article.php?sid=601"

[[comments]]
order = 1
subject = "بنت والسلام .."
text = "فكرتيني والله بموقف مضحك حصل لي قبل سنتين<br />كنت راجعة أنا وبنت خالتي من الساحل الشمالي وكان في واحد مش بقى قذايف هههههههههههههه لالا تقريبا حبيبتي هيا كان هيجيلها شلل .. الأول قلناله عيزين مية راح جاب لنا قزازة مفتوحة وشكله معبيها من الحفية اتخيلي .. رحنا طبعا قلناله راح جاب لنا وحدة مقفولة ونظيفة .. ورايح جاي يقول تذاكر تذاكر ويشوف التذاكر.. لما كنا هانطق منه .. وجايب علب شكولاته وبيقول عيزين شكولاته كل شوية لغاية مرة جايبها جنب بنت خالتي راح اتكعبل وكب العلبة كلها على دماغها .. ساعتها بقى وشها احمر وكان هاين عليها تقوم تخنقه .. بس صبرنا بقدرة قادر لغاية ما وصلنا ..<br />والله فعلا .. السفر دا كله مغامرات<br />خدي بالك من نفسك بقى<br />وتبقي تاخدي معاكي شريط حلو المرة الجاية<br />ولا ووكمان وتبعدي عن الدنيا<br />وما أجمل الاستماع إلى أي شريط مفيد مع اللعب بالأتاري<br />إنتي شوقتيني يا بنتي<br />أنا رايحة المصيف"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044712/http://www.20at.com:80/article.php?sid=601"

