text = "عشان كده البانجو سعره رافع و مش متوافر خالص<br />حسبي الله و نعم الوكيل<br />يا جدعان ده المحصول الرسمي للدماغ لازم يتوافر و الا الناس هتفوق و هتفهم الاوضاع و كده يحصل انقلاب وش<br />ياريت نحل المشكلة دي بسرعة<br />واحد متكيف<br />HMH"
