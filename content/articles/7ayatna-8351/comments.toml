author = "مازن"
posted = "2008-02-28"
text = "مرّ أسبوع كامل على إغلاق فضائية \"البركة\" التي تبث من القاهرة، بحجة عدم استيفاء أوراقها ومنها موافقة الأمن المصري، لتصبح أولى ضحايا وثيقة وزراء الإعلام العرب الجديدة.<br />فقد فوجيء مشاهدو قناة البركة الفضائية في الرابعة عصر الثلاثاء قبل الماضي بتوقف بث القناة دون تنويه، لكن المفاجأة كانت لكل العاملين بالقناة أيضا حيث لم تقم إدارة القمر الصناعي المصري النايل سات التي تبث القناة عبره بأي تنويه أو تحذير لهذه الخطوة.<br />وتعود ملكية القناة لعدد من رجال الدين الإسلاميين الذين أردوا بها أن تكون \"بمثابة خطوة في إطار منظومة متكاملة تهدف إلى الوصول إلى شرائح متنوعة ومتعددة من المشاهدين لبث الوعي بأبعاد الاقتصاد الإسلامي ومنظومته وقيمه\".<br />وتنتمي القناة للمجموعة التابعة لقناة \"الناس\" ضمن 5 قنوات للشركة المالكة السعودية. وبدأت بثها التجريبي في مارس 2007 ثم دشن بثها الرسمي في 21 يوليو من نفس العام باحتفال ضخم شهد حضور إسلامي مكثف.<br />والآن كيف يمكن بشكل عملي إعادة بث قناة البركة .. وإعادة الحياة للعشرات من العاملين في القناة؟"
archived = "2009-05-21"
capture_url = "https://web.archive.org/web/20090521175154/http://www.20at.com:80/7ayatna/8351.html"

