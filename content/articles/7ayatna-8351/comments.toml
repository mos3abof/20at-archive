text = "انه لشئ يسعد القلب ولكن هذا ليس بالجديد فمن المعروف ان من صفات الطفل المصرى الذكاء الغير عاددى وهذا حتى سن 6 سنوات ويتراجع بعد ذالك لعدم الاستغلال الامثل سواء من البيت اة المدرسه الا من رحم ربى مثل محمود واقول له وفقك الله لكى تستخدم هذا الذكاء لس لمصر وحدها بل لنصرة الاسلام والمسلمين"
