posted = "2008-02-28"
text = "يا عم مازن إنت أحول ولا حاجة ؟؟<br />أنا بس عاوز أعرف مال أم قناة البركة دى بأم الموضوع اللى مكتوب فوق ؟؟<br />و بعدين مش قناة الناس دى اللى طلعت نصابة و فصلت العاملين عندها من غير ما تديهم حقوقهم ؟؟<br />جايين يفتحوا قناة تانية كمان من فلوس الناس ؟؟؟<br />برافو على الأمن المصرى و على شركة النايل سات إنها وقفت بث القناة دى"
archived = "2009-05-21"
capture_url = "https://web.archive.org/web/20090521175154/http://www.20at.com:80/7ayatna/8351.html"

[[comments]]
order = 1
