text = "ن هوس التميز بالفعل أمر اصبح يجتاح المجتمع السعودي، ولكن للأسف مايأتي البحث عن التميز بأشكال تافهة وممارسات خاطئة، وقس على نما ذج لوحات السيارات الكثير من بينهاأرقام الجوالات المميزة.. وكل شئ يمكن ان تبيعه داخل السعودية طالما الصقت به كلمة مميزة... وقريبا ستجد إعلانات عن حمامات مميزة"
