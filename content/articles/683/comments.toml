[[comments]]
order = 7
subject = "معلومه غلط وحبيت اقول الصح مع انها هايفه"
author = "واحد معدي"
posted = "2005-12-08"
text = "سيارة الامير الوليد بن طلال مش زي الأمور ما قال انها اهم 001 ، لاني شفتها اكتر من مره واقفه عند البرج الخاص به ( برج المملكه ) في شارع العليا العام لاني كنت ساكن في نفس الشارع وشفته وهوا نازل منها وطالع مكتبه وجت برضه صورة السياره علي روتانا سينما ايام ما كان الواد بتاع جده اللي فاز بستار اكاديمي لما كان بيزور الوليد بن طلال في قصره في الرياض وكانوا رايحين لمزرعة الوليد بسيارته الخاصه وكان هوا اللي سايقها وكانت اللوحه أأأ 111 ، وعلي العموم هيا حاجه هيفا ، وبرضه للمعلومه ان سيارة اهم 001 مش سيارة الوليد لكنها سيارة واحد اعرفه صديقي وكان معايا في المدرسه الي كنت بدرس فيها بالرياض وهوا دلوقتي عايش في المانيا بيدرس الطب ومعاه هناك عربيه فيراري وعربيته بلوحتها مع اخوه دلوقتي اللي هوا في 1 ثانوي .<br />شكرا لييييييييييكم بس موشوع جميل...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114028/http://www.20at.com/article2.php?sid=34"

