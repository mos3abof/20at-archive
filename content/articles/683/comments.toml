subject = "الشباب مظلوم"
author = "القحطاني"
posted = "2005-12-07"
text = "ي كل بلديوجدالغث والسمين، الصالح والطالح، العاقل والدلخ... فلا يعني أن هذه الظاهرة منتشرة بين الشباب السعودي، ان كل الشباب السعودي هكذا.. فكثير من الشباب ناقمون على مثل هذه الظواهر، ولكن كما قال كاتب الموضوع -حفظه الله-\"كل هذا يهون، إذا ما كان جهاز المرور، وهو الجهة المنوط بها إدارة الطرق والحفاظ على أرواح الناس قد أقر هذا الهوس، ووضع له تشريعا ينظمه، بل ويشجع عليه من خلال المزادات التي ينظمها\""
