[[comments]]
order = 10
subject = "اقتراح بشأن اللوحات المرورية"
author = "مساعد عثمان ابراهيم المدلج"
posted = "2005-12-18"
text = "من الملاحظ في الآونة الأخيرة وصول ترتيب أحرف اللوحات المرورية (الخصوصي) إلى الابتداء بحرف الهاء مما يعني أنه لم يبق سوى حرفي الواو والياء أو الألف المقصورة.<br />أود هنا أن أضيف اقتراحا إلى الاقتراحات السابقة بشأن أرقام لوحات السيارات، حيث اطلعنا على بعض الاقتراحات بهذا الخصوص وهذا إن دل على شيء فإنما يدل على اهتمام شعب هذا البلد على الرقي بخدمات بلدنا الغالي لمصاف الدول المتقدمة.<br />وعلى ذكر الدول المتقدمة فإن اقتراحي بشأن أرقام لوحات السيارات، مأخوذ من بعض الدول التي سبقتنا في التطور والحداثة، وما العيب في أن ننظر إلى تجارب الدول الأوروبية والأمريكية وغيرها من الدول المتقدمة في شتى المجالات والعمل بآخر ما وصلوا إليه من تقنية وأنظمة حديثة بما لا يتنافى وتعاليم ديننا الإسلامي وعاداتنا وتقاليدنا العربية. والمقصود هنا في جميع التعاملات المعمول بها في حياتنا اليومية، أما بخصوص اللوحات المرورية فإني اقترح:<br />1- أن تكون اللوحات من (4إلى 6) خانات وتجمع ما بين الأحرف والأرقام بدون تحديد أماكنها وعلى سبيل المثال: (ل4ن ح)، (و36س9)، (ن2ق87 د)، وبهذه الطريقة نستطيع أن نكون من نفس الأرقام والأحرف مجموعة من اللوحات مثل: (س وق046) نكون منها:<br />(046 س وق)، (س 6و4ق 0)، (6س و 04ق) وهكذا.<br />2- أن يتاح المجال لصاحب السيارة باختيار أرقام لوحة سيارته بنفسه كأن يختار أحرفا وأرقاما تتناسب مع اسمه أو ما شابه، وعلى سبيل المثال:<br />أ- لوحة من أربع خانات: (ب ن د ر)، (ع م ر1)، (3 ح م د).<br />ب- لوحة من خمس خانات: (م س ا ع د)، (ن ا ص ر9)، (4أ ن س4).<br />ج- لوحة من ست خانات: (س ع د س ع د)، (س ل ط ا ن7)، (8 أ ح م د 8).<br />مع العمل بمثل ما هو معمول به حالياً في تمييز لوحات النقل العام والنقل الخصوصي والحافلة العام والحافلة الخصوصي والأجرة بالألوان.<br />3- أن يعلن عن اللوحات المميزة بالأرقام والأحرف المتشابهة في مزاد علني، وعلى سبيل المثال:<br />(أ أ أ أ)، (22222)، (ع ع ع ع ع ع).<br />4- الإبقاء على اللوحات السابقة بحكم تسجيلها في الحاسب الآلي لأن تغييرها- كما حصل في السابق- سوف يستنفد نسبة كبيرة من عدد اللوحات الجديدة، فما المانع بالعمل بها خاصة إذا كانت نوعية خط طباعة الأحرف والأرقام واحدة. مع العلم أن لوحات النقل والحافلة والأجرة لم تصل بعد إلى ما وصلت إليه اللوحات الخصوصي.<br />آمل أن يلقى هذا الاقتراح القبول لدى المسئولين والقراء.<br />جريدة الرياض 13-12-2005"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114028/http://www.20at.com/article2.php?sid=34"

