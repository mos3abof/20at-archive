author = "اكتب اسمك هنا"
posted = "2009-03-19"
text = "إن لم تستحي فإفعل ما شئت والقابض على دينه كالقابض على جمرة من النار ومن لم يحكم بما أنزله الله فهؤلاء هم الكافرون ومن لم يحكم بما أنزله الله فهؤلاء هم الظالمون ومن لم يحكم بما أنزله الله فهؤلاء هم الفاسقون والفسق أشد من الكفر وأشد من الظلم فبشرى لحكامنا البعيدون عن حكم الله والدين وأوصلونا الي هده الحالة المترديه في كل مناحل الحياة وبشري لكل ولي أمر رجل كان أو إمرأة ساعد هؤلاء الفاسقين إما بالمشاركة أو بالصمت والسكوت على هده النار الدي نعيش فيه بسبب أولي الأمر"
archived = "2009-05-22"
