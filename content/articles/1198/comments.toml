order = 0
subject = "حول قانون جيهان"
author = "السيده ميم"
posted = "2006-06-21"
text = "لا أدرى لماذا يغضب البعض من ان ينص \"قانون جيهان\" حول حق الزوجه الاولى فى العلم بزواج زوجها من زوجه ثانيه !! خاصة اذا كان علمها بهذا الامر يسقط حقها فى طلب الطلاق خلال عام من تاريخه باعتبارها موافقه ضمنيا !! فكان لزاما ان تبلّّغ الزوجه الاولى بزواج زوجها حتى تتخذ قرارها بشأن حياتها معه فى ضوء هذا الموقف و الا تعتبر موافقه على امر هى لم تعلم به من الاساس !!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134109/http://www.20at.com/article2.php?sid=972"

