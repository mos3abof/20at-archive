subject = "محمد"
text = "طيب يا عم علي<br />رأيك ان الشواذ ميطلعوش في الأفلام؟<br />ولا مش عايز يتم تقديمهم بصورة سرية ، و يتم تقديمهم بصورة اوضح باعتبارهم موجودين فعلا؟<br />يعني الادب العربي من ايام زمااااان قوي لحد النهاردة و هو فيه شخصية الانسان الغير سوي... ليه ده ما يثيرش اعتراض زي السينما؟<br />ولا انت بتشكك انهم موجودين... و بكثرة؟؟؟؟<br />و بعدين مانتا ذات نفسك بتلمح و مش بتصرح في كلامك عن المخرج المشاع عنه انه بيحب الممثلين الحلوين و حاطط جنب الكلام صورة يوسف شاهين..."
