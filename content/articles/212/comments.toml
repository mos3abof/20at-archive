text = "لو كانت صاحبة هذه الصورة طفلة فلسطينية لقامت الدنيا ولم تقعد وهي تتحدث عن وحشية الفلسطينيين والعرب والمسلمين الذين يعلمون أطفالهم القتل وسفك الدماء.. لكنها - يا سادة- لطفلة إسرائيلية دعاها جيش الاحتلال الصهيوني لتكتب رسالتها لأطفال فلسطين ولبنان على صاروخ سيمزق أشلاءهم.. وهذه الدعوة لا تدل إلا على ذروة الإنسانية.. إنسانية الغرب التي تنظر للعرب على أنهم أدنى بكثير من الحيوان<br />مرحى لأطفال (الدولة الديمقراطية) الوحيدة بالمنطقة مثلما فلق رؤوسنا الغرب بوصفها. وهي الدولة الوديعة التي تعيش بين كومة من الوحوش والإرهابيين..<br />نحن الإرهابيون - ربما لأننا نقتل بصمت...<br />نحن الإرهابيون.. ربما لأننا نترك أشلاءنا مباحة أمام الكاميرات والعالم.. ولا ندفن أنفسنا أحياء<br />وصلت الرسالة.. لكن هذه الطفلة لم تقرأ رسالة الأطفال الإسرائيليين من على الصاروخ الذي مزق جسدها.. ولم يقرأها أحد.. لم يأبه أحد بهذا الجسد الطري الممزق.. انشغل المحللون من على شاشات الفضائيات بقضايا أخرى، وضاقت أنفس القادة العرب بشعوبهم غير المسؤولة التي تعشق الموت والمغامرة.. والأمم الغربية أمم أميركا وبريطانيا، شربت نخب الديمقراطية..<br />وصلت الرسالة... ونام جسد الصغيرة نومة أراحته من هذا العهر الذي نعيشه"
