subject = "زائـ الفجر ـر"
text = "بسم الله الرحمن الرحيم<br />الحياة الجنسية<br />هي رحلة محتومة ستمر بها كأنسان رضيت ام ابيت والشذوذ الجنسي هو مرحلة من مراحل الحياة الجنسية التي يجب ان يتخطاها الانسان بالفهم الجيد والميول الطبيعي للجنس المخالف ...<br />والسؤال عن الشذوذ في السينما المصرية في بعض الاحيان يجب ان نسأل انفسنا هل هناك حقا شذوذ في مصر ؟؟<br />الأجابة طبعا نعم وإلا سأكون كاذب لقد رأينا العديد من القضايا في الجرائد تتحدث عن الشذوذ واسباب الشذوذ ترجع لاسباب التنشئة الخاطئة..<br />يمكن الاستفاضة في الموضوع اذا قرأت عنه في الكتب من الناحية العلمية<br />ولكن اجد ان ذكر الشذوذ في السينما هو ذات المنظر لللزنى بين الممثلين وقال تمثيل شفايف بلاستيك بقة<br />ما دافع السيئين في شرب الخمور والسجائر والمخدارت الا انه يرى بطله المحبوب وشجيع السيما امامه يتناولهم ترى عادل امام يدخن ويشرب الحشيش ( انا شربت حشيش يا سعاد )<br />تجد ان العلاقة بين الرجل والمراة بقت عادي وبقى القبل حلال والزنى بس يعني حرام مش متأكد نص نص<br />ربنا يستر<br />الشذوذ في السينما هو ادخالات ومدخلات حقيقي واحدة واحدة هتبقى واقع<br />واذا فسدت الاخلاق قول يا رحمان يارحيم"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018213051/http://www.20at.com:80/article.php?sid=559"

