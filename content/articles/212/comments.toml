[[comments]]
order = 10
subject = "نونا المجنونة"
text = "بعيدا عن اي خلافات شخصية يا وائل<br />المقال و التعليق جميل<br />لان الفساد فعلا هو كان موجود لكن الفرق ان دلوقتي بقي ببجاحة<br />و تقدروا تشوفوا الكلام ده في كتاب طوق الحمامة للامام ابن حزم و تغزل رجل برجل مثله في فجاجة و بجاحة غير طبيعية شيء مثير للغثيان فعلا و في رأي ده الي ضيع مننا الاندلس تركوا الدين و اتجهوا للفجور<br />الفساد موجود لكن الفرق ان بدل ما كانوا بيتكسفوا من نفسهم بقوا لهم وش و بيدوروا علي حقوقهم<br />ربنا يرحمنا برحمته<br />و يا عم علي بدل ما تبص للنص الفاضي من الكباية بص للنص المليان عايزيين نماذج ايجابية حاجة تشجعنا علي الصح مش تكرهنا في عيشتنا"
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903090947/http://www.20at.com:80/article.php?sid=559"

