[[comments]]
order = 19
subject = "مكنتش مصدق كل الكلام ده ربما تكون صدفة"
text = "لغاية لما قابلت احد الممثلين في هذا الوسط العفن وبدأ يتكلم معايا في الشغل في السينما وان طبعا البنات طريقها سهل بتتعرف على المخرج ويعجب بها ويا سلاام بقى لو عجبت المنتج ما هو اللي بيدفع على طول تجدها على غلاف وبطلة وهي لا تفقه في التمثيل شيء<br />اما الشباب فحالته صعبة إلا اذا كان ابن فلان وقريب علان ...هو بيقول قلت اجرب حظي مع المخرجات يمكن اعجب واحدة فيهم فلقيت فلانة (مشتهرة بافلامها اللي بيقولوا عليها جرئية شاذة ) فاعمل ايه بقى علشان اخد فرصة ....<br />وأخد يكمل كلامه ويقول بقيت مثلا اسهر مع المخرج الفلاني ( غير مشهور) في بيته وطبعا في خمرة وخلافه حتى في وجود مراته عادي يا ريس خليك اسبور ...<br />فعلا عالم عفن يمتلأ بكل خسيس ووضيع بل إن الكلمات اقل بكثير مما عليه هذا الوسط<br />بجد أجدت يا علي وخلاص يا ريس هابطل اقول كلمة ابقى سلم لي على جوزك يا اسماعيل بيه مع انها كانت في مسرحية العيال كبرت وقالها سعيد صالح الابن لابوه لما كان بيكلم الجو :)<br />قشطة عليك (((( اوعى تكون كلمة لها معنى تاني وانا لا اعرفها تبقى مصيبة ..."
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903090947/http://www.20at.com:80/article.php?sid=559"

