[[comments]]
order = 8
subject = "وائل عباس"
text = "انحراف سبايس بيبي<br />هو الموضوع قد يبدو هايف ولكن خطير في الحد ذاته<br />موضوع فيديو كليب للاطفال بطولة اطفال وموجه للاطفال<br />يبقى ليه مافيهوش اي حاجة من اللي بيعملها الاطفال ؟؟؟<br />بيلعبوا كوره مثلا !بيلعبوا بالعرايس ! بيطيروا طيارة ورق ! بيضربوا بعض بمسدسات المية ... الخ<br />عالم الاطفال لا تنتهي منه الافكار يعني ...<br />لكن يظهر مخرجي الكليب متعودين على اللحمة والهشكات والاوكشات<br />ازاي يعملوا فيديو كليب من غير لحمة ؟؟؟ ويبيع ويبقى له زبون ازاي !<br />واللحمة الصغيرة دي برضه للاسف ليها زبونها<br />ليها ناس بنسميهم بتوع العيال بدون احراج<br />ودي ظاهرة موجودة ولا يمكن انكارها !!!<br />معلشي ممكن الكلام ده يكون شاذ على بعض الناس الاسوياء<br />اللي ما يتخيلون ان الدنيا فيها قرف زي كده<br />وده مرض نفسي وله اسم كمان وهو : البيدوفيليا - اي اشتهاء الاطفال جنسيا دون الكبار<br />والمرض ده منتشر جدا في دول الخليج المصونة<br />واقرب واشهر حادثة للاذهان حادثة ابن الدكتور اللي المخابرات المصرية هربته بره السعودية<br />بعد ما اخذ بالثار من مغتصب ابنه !!! ابنه الذكر !!! وليس ابنته الانثى !!!<br />ده غير رحلات الخليجيون الى تايلاند بالتحديد حيث تتوفر دعارة الاطفال بلا ضابط ولا رابط<br />ولو اني سمعت ان المغرب كمان فيها نفس النظام ولا حول ولا قوة الا بالله<br />والبنات والاولاد اللي في الفيديو كليب اصلا مش هما نفسهم اللي بيغنوا باصواتهم<br />الاولاد اللي بتغني اولاد شكلهم عادي جدا وولاد ناس غلابة وموهوبين موسيقيا فعلا<br />لكن اللي جابوهم في الفيديو كليب دول اولاد شياطين<br />عيال مولودة قدام كاميرا ومولودين بارتي انيمالز زاي المصطلح الامريكي<br />والبنات طبعا لبسوهم حاجات مش بتاعة سنهم وشعر وماكياج وباديهات ومحزق وملزق ومعري<br />حاجات كده زي اللي شفتها في فيلم تسجيلي عن مافيا الدعارة الروسية للاطفال<br />كانت عاملاه البي بي سي وازاي بيجهزوهم للزباين !<br />والصبيان كمان جايبين لنا شوية اطفال اهاليهم مخنثاهم<br />وعاملين شعرهم ماعرفشي ايه ولابسين سلاسل ودلايات ومناظر تقرف<br />اطفال مصطنعة مقززة مفتقدة للبراءة<br />اطفال بلاستيك عايشه الدور من بدري<br />حتى لما بيجيبوا حوارات معاهم في التليفزيون الواحد بيبقى قرفان<br />طفل ولكنه عامل زي ما يكون مخلوق غريب<br />افسده التدليل الزائد والاضواء والشهرة والفلوس<br />وبالتاكيد معروف مصير كل الاطفال دي من دلوقتي !<br />اذا الفيديو كليب ده يا جماعة مقصود وليس غلطة<br />ومعروف زبونه ومعروف مقصود بيه مين !<br />زي بالضبط مسرحيات الموسم الصيفي<br />اللي بتلاقي الحضور فيها ما شاء الله<br />كله لابس الغترة والعقال والماعرفشي ايه اللي بيلبسوها دي<br />لاحظوا كده معايا<br />هل فيه مسرحية من المسرحيات الحديثة اللي شفتوها على مدى السنين القليلة الماضية<br />هل خلت مسرحية من دول من راجل لابس واحدة ست !!!<br />ملحوظة غريبة جدا وخطيرة ولكنها للاسف صحيحة !!!<br />محمد هنيدي<br />احمد أدم<br />سمير غانم<br />احمد بدير<br />شريف منير<br />والقائمة طويلة ...<br />طب ليه ؟؟؟ مع ان مناظرهم بتبقى مقززة ومقرفة لينا كاسوياء !<br />لكن تخيلوا الحاجات دي عليها الطلب وبتجيب فلوس وليها زبونها !!!<br />زبونها الخليجي ممن يشتهون الرجال عوضا عن النساء<br />ولو ان المسرحيات بتبقى ملغمة من جميع انواع اللحمة الحريمي لكن برضه !<br />الشذوذ له اولوية !<br />وبتبقى عاملة زي الفريك شو !<br />لعن الله المتشبهين من الرجال بالنساء !<br />ده الكلام ده بقى علم بره دلوقتي وله ناسه<br />يعني انا اتكلمت مرة مع واحد مصمم رقصات استرالي<br />كان من اللي اشتغلوا في حفلة لجانيت جاكسون<br />بيقوللي الحفلات دي بتبقى مصممة بحيث يكون فيها كل العناصر ومنها الاثارة الجنسية للحضور<br />وليها اسم : ايفوكاتيف كونسرت<br />يعني مثلا جانيت تاخد واحد من المتفرجين معاها على المسرح وتبهدله وتشعلل الحفلة !<br />ومرة كمان شفت ستينج في احدى الحلقات التليفزيونية<br />كان بيتكلم ان ازاي حفلاته بيبقى فيها ارضاء لكل الاذواق<br />اثارة جنسية للفتيات بالحركات اللي هو بيعملها ورقصاته وحركات جسمه<br />واضاف كمان مشكورا ان احيانا تصميم الحركات بيضع في الاعتبار الشواذ جنسيا !!!<br />يعني يثير الرجاله كمان !!! اسفوخس على ده فن !!!<br />هوا لما قال كده باقي الابطال المشاركين في الحوار هما كمان صدموا من الحقيقة دي !!!<br />الله يرحمه الحاج الفيس بريسلي هو اول من ابدع في هذه المسائل<br />واولياء الامور كانوا فاهمين وكانوا بيمنعوا اولادهم يشوفوه او يسمعوه وبيعتبروه فساد للاجيال الجديدة !!!<br />والكلام ده فين ! في امريكا ! من خمسين سنة بس ! مش خمسميت سنه !<br />وخلفه البيتلز حيث كان يرد في<br />Read the rest of this comment..."
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903090947/http://www.20at.com:80/article.php?sid=559"

