text = "ايه ده؟!<br />علي عامل موضوع مثير للجدل يا جدعان؟!؟! خير اللهم اجعله خير :P<br />الموضوع حلو جدا، و التعليقات كمان.. ولو ان الكلام يصدم !<br />أنا شخصيا كان كتير من المشاهد دي بتعدي عليه لكن ما شوفتش فيها المعنى الي بتتكلموا عنه!<br />حتى فيلم تيتو، مخدتش بالي من المشهد الي علي بيقول عليه غير بعد مناقشة الفيلم مع أحد الزملاء... احنا برئاء زياده عن اللزوم ولا ايه؟<br />ولا تكونوش انتوا الي حساسين زياده عن اللزوم؟"
