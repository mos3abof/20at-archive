[[comments]]
order = 0
subject = "برافو .. عشرينات!"
author = "عمرو مجدي"
posted = "2006-05-08"
text = "لست أبغي التعليق على هذا الموضوع \"معلش يا عاطف باشا\" .. بقدر ما أريد أن أقول \"برافو عشرينات\"..<br />هذه أول مرة أفتح عشرينات منذ عدة شهور لكي تجذبني تقريباً معظم المواضيع التي فيها، كي أضغط على الفأرة وأفتح كل المواضيع.<br />\"الروزمانة - فرويد - الأبراج - أول انتخابات طلابية بالسعودية - حمامات سباحة النمسا ...الخ\"<br />أخيراً أشعر أن عشرينات بدأ يستعيد رونقه<br />وبالمناسبة.. مبروك أيضاً أخير تقدم جيد على ترتيب أليكسا بعد أسابيع من التراجع<br />برافو.. عشرينات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133254/http://www.20at.com/article2.php?sid=780"

