[[comments]]
order = 0
subject = "فلا اقسم بالخنس"
author = "هبابه او هوبه او هبهوب"
posted = "2006-03-23"
text = "ـ الثقوب السوداء هي نجوم ثقيلة وشديدة الاختفاء فلا تمكن رؤيتها أبداً.<br />2ـ هذه المخلوقات تسير بسرعات كبيرة جداً تبلغ آلاف الكيلومترات في الثانية الواحدة.<br />3ـ الثقوب السوداء تجذب وتبتلع وتكنس كل ما تجده في طريقها كنساً.<br />القران اتكلم عليها يا بشر<br />فلا اقسم بالخنس الجوار الكنس \"\"<br />فـ (الخُنّس): هي الأشياء التي لا تُرى أبداً. وهذه الكلمة من فعل (خَنَسَ) أي اختفى ولذلك سُمِّي الشيطان بـ (الخنَّاس) أي الذي لا يُرى. و(الجوارِ): أي التي تجري وتسير، وهذه من كلمة (يجري) بحركة محددة. و(الكُنّس): من فعل (كَنَسَ) أي جَذَبَ إليه أي شيء قريب منه وضمَّه إليه بشدة، وهذا ما يحدث فعلاً في الثقب الأسود<br />، وهذا ما تحدث عنه القرلذلك فإن كلمة (الخُنَّسْ) هي الكلمة المعبِّرة تعبيراً دقيقاً عن حقيقة هذه المخلوقات. وكلمة (الكُنَّس) التي عبَّر بها القرآن قبل أربعة عشر قرناً عن حقيقة هذه النجوم، نجدها في آخر المقالات العلمية عن هذه المخلوقات! حتى إن العلماء يقولون عنها: (إنها تكنُسُ صفحة السماء<br />ودلوقتي بقي اسبكم عشان ادور علي الثقوب \"البيضاء\"<br />المقال نقلا عن احد المواقع اللي بتحب تعرف الفضاء .<br />\" اخيرا عرفت نبيل فاروق يقصد ايه \"دوختني يا راجل ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123129/http://www.20at.com/article2.php?sid=611"

[[comments]]
order = 1
subject = "الله اعلم فعلا"
author = "نيفين..نيفى..نوفا"
posted = "2006-03-23"
text = "و الله يا جماعه بما انى بحب الراجل اللى اسمه اتيس منصور دا جدا فانا بميل انى اصدق كل كلامه الا موضوع التطبيع<br />ممكن ليه لا<br />ممكن يكون فيه ناس غيرنا<br />يمكن احلى<br />يمكن اوحش(سواء شكلا او خلقا)<br />الله اعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123129/http://www.20at.com/article2.php?sid=611"

[[comments]]
order = 2
subject = "هبهوب و الله ما خدت بالى"
author = "نيفين..نيفى..نوفا"
posted = "2006-03-23"
text = "هبه انتى هنا<br />و الله عارفه زمانك بتقوللى البت دى كدابه تقول هبعت ز تنفض لكن و الله يا هبه مش فاضيه خالص معلش هبعتللك قريب<br />سلام يا جميل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123129/http://www.20at.com/article2.php?sid=611"

[[comments]]
order = 3
subject = "عجبي"
author = "واحد تاني"
posted = "2006-03-23"
text = "انسان ايا انسان ما اجهلك<br />ما اتفهك فى الكون وما اضالك<br />شمس وقمر وسدوم و ملايين نجوم<br />وفاكرها يا موهوم مخلوفة لك<br />حقرا وفوق كوكب حقير محتقر<br />فى الكون تكون دنياكو ايه يا(غجر)<br />رملايه من صحرا؟.. لكين ايش تقول<br />والكون بحاله جوه عقل البشر<br />على بعد مليون ميل من ارضنا<br />من الفراغ الكوني بصيت انا<br />لا شفت فرق ما بين جبال او بحور<br />ولا شفت فرق ما بين عذاب او هنا<br />و عجبي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123129/http://www.20at.com/article2.php?sid=611"

[[comments]]
order = 4
subject = "رسالة مهمة"
author = "رسالة مهمة"
posted = "2006-03-23"
text = "من فضلكم يا جماعة و بجد و من غير هذار و للاهمية القصوى ومن غير مبالغة<br />روحوا شوفوا اللى بيحصل على صفحة (الاخوان x وحيد حامد = تار بايت ) هاتوا الصفحة دى من الارشيف بسرعة من فضلكم واقراؤا الموضوع والتعليقات و بالاخص اخر تعليقين<br />يا ريت التفاعل والتعليق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123129/http://www.20at.com/article2.php?sid=611"

[[comments]]
