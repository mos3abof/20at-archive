subject = "منى محمد"
author = "سبحان الله"
posted = "2006-03-24"
text = "على كل الكون الى اكتر من ضخم الى احنا لسه مش عارفين فيه اكتر من حاجات بسيطة جدا والله اعلم عن الباقى وسبحان الله على اللى يكون وراء الظلام بس ده كله يدل على قدرة الله سبحانة وتعالى وان احنا مقصرين فى عبادتة"
archived = "2006-11-02"
