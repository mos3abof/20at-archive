text = "لية اسرائيل ليس فيها انفولونزا الطيور - ولية لبنان ليس فية انفلونزا الطيور - وكذلك ليبيا ولا السودان<br />لية المرض بيستطعم دم الشعب المصرى<br />الطيور بريئة من عدوى انفلونزا الطيور — الطيور ضحية فقر الشعب المصرى<br />اذهب الى اى مدرسة ابتدائى فى ريف والاحياء الشعبية فى بر مصر — ستصعق من نسبة الاصابة بفقر الدم<br />يا حكومة رجال الاعمال الشعب المصرى فية نسبة عالية من الانيميا وفقر الدم والناس ليس عندها مناعة من اى مرض<br />ارحموا الطيور<br />الناس تعانى من انفلونزا الفقر نتيجة اكل الفول فى الوجبات الثلاث<br />فكونا من الكلام عن الطيور وكلمونا عن انيميا الفول<br />مات 70 من انفلونزا الطيور واية يعنى سبعين جنب الالاف اللى بتموت من انيميا فقر الدم"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527102713/http://www.egyvote.20at.com:80/2khbar/12066--70-.html"
