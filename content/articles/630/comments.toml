subject = "هو ده اللي أنا عاملة حسابه"
author = "قل \"اللهم أجرني في مصيبتي واخلفني خيرا منها\""
posted = "2006-04-13"
text = "انا بصراحة خايفة من اليوم ده خوف لم ولن أعهده في أي شيء آخر<br />اقتربت من هذه التجربة عدة مرات<br />مرات عند وفاة من أعرفهم وأشاهد وقع الخبر على الابناء والاهل<br />ومرة حين أصيب أبي بذبحة نجاه الله منها والحمد لله<br />وتجربتك هذه يا أخ محمد-منحك الله الصبر-<br />ولكن لي تعليق:<br />أتمنى أن يموت من أحب قبلي حتى لا يشعر بهذا الاحساس الذي لا أحتمل ان يشعروا بذلك الالم الرهيب<br />فأنا مستعدة لتحمله عنهم إن كان هناك من يجب ان يتحمله فسيكون أنا<br />أعرف انني سأكون مثل أختك الصغيرة لأنني شديدة التعلق بوالدي-أطال الله في عمره إن كان خيرا له-ولكني ارجو ان اكون في مثل تماسكك<br />وتذكر انك إن حفظت القرآن أتى والداك يوم القيامة وعلى اأسيهما تاج مثل الشمس في نوره<br />اوصيكم ونفسي بتقوى الله<br />والسلام ختام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113125/http://www.20at.com/article2.php?sid=394"
