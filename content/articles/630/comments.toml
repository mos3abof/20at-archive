subject = "جميل وقاسي"
author = "لؤي"
posted = "2006-03-30"
text = "جميل هذا المقال بل فاعتقادي انه رائع لكن ...<br />شعرت به وشعرت بكل لكمة حيث ان ابي متوقى وانا فى اولى ثانوي<br />ولكن الفرق انه توفي على يدي واكنت اقبله واقول له ( لا يابابا مش دلوقتي انا محتاجلك ....)<br />لكني اشعر بنوع من جلد الذات الشديدة نم صاحب المقال على نفسة<br />وفى الحقيقة انت لم تكن جبان ولم تهرب فانت كنت فى طلب العلم وطالب العلم فى جهاد ومهمة مقدسة لو تعلمها<br />وفراقك عن والدك لم يكن باختيارك بل هو قدر عليك<br />ولخحظ فى مجمل الكلمات غضب وضيق شديد ( وعدم صبر ) وكنت اتمني ان يكون صاحب المقال اكثر صبراوتحملا لقضاء الله<br />اسال الله العظيم ان يلهمه الصبر<br />وان يتغمد الفقيد فى جناته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113125/http://www.20at.com/article2.php?sid=394"

