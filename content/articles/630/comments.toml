text = "بجد اسلوب جميل جداً فى الكتابة وواضح ان محمد الدسوقى ده فعلا كاتب يحمل جميع علامات الموهبة<br />متهيألى باين من الكلام انه حصل بجد مش مجرد<br />تقمص شخصية وكتابة مقال<br />بس هل فعلا ان الروح اللى موجودة جوه الواحد ما بتخرجش تعبر عن نفسها الا لما تيجى حاجة تهزها زى اللى حصل مع محمد مثلا<br />المفروض انه فى ظروف مش كويسة رغم ذلك تغلب على كبته وحزنه بقلمه فنعم الرجل أنت..."
