subject = "نصيحة"
author = "عبد الرحمن"
posted = "2006-03-16"
text = "الى كل من كان والده او والدته على قيد الحياة<br />استغلوا هذه الفرصة<br />احتاج الى خمس دقائق لاقول شيئا لوالدي رحمه الله<br />و لكني لن احصل عليها ابدا.<br />فقولوها انت لاهلكم عني<br />* اخبروهم ان نصائحهم اللتي نراها خارج الزمن يعد فترة سنجد انها صحيحة تماما و كانت ستوفر الوقت و المشاكل لو اتبعناها<br />*اخبروهم اننا نسمعهم جيدا و ليس كما يضنون<br />و اننا نفكر في كلامهم و حتى ان لم يبدو علينا ذلك<br />* اخبروهم انكم اسفين عن كل لحظة فقدتم فيها اعصابكم معهم لسبب سوف تجدون انه سخيف جدا و سوف تبقون تتذكرون تفاهة المشكلة و لكن لن تجدوهم لتعتذروا عن ذلك<br />* اخبروهم اننا نحبهم و نحترم كل جهودهم اللتي بذلوها لنصل الى ما نحن عليه و ان هذه الجهود لم تذهب سدى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113125/http://www.20at.com/article2.php?sid=394"

