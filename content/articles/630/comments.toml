text = "الى اخى فى الله عبد الرحمن ,<br />جزاك الله خيرا على هذه النصائح ولا تحزن على عدم استطاعتك اخبار فقيدك اما او ابا فسوف يصلهم ذلك باذن الله الرحيم وعند لقائك لهم فى جنة الفردوس ان شاء الله سوف تخبرهم بذلك وسوف يفرحوا بك كثيرا المهم ان تكون مع الله دائما حتى تلحق بفقيدك فى جنة عدن اللهم ارحم موتانا وموتا المسلمين ."
