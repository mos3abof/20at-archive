subject = "اخيرا اغلقنا ورشنا"
author = "ايمن علي"
posted = "2006-06-23"
text = "نحن صناع الموزين فى مصر.فى ظل ارتفاع الاسعاروالمعادناستوردت الحكومه المصريه موازين من الصين رقميها اقل سعرا من الميزان المصرى مما ادى لاقبال.عليه لانه ارخص وترك الصناعه اليدويه.ونحن لامصدر لنا وقد اغلقنا محلاتنا.نريد ان يسمع صوتنا احد من يرفع عنا الظلم؟؟؟؟؟؟؟نرجوا اى عمل؟؟يارب ارحمنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133821/http://www.20at.com/article2.php?sid=184"
