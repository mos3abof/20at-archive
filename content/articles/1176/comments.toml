[[comments]]
order = 2
subject = "اخواننا السودانيين"
author = "صايع وقديم"
posted = "2006-01-02"
text = "انا كنت بشوف الاخوة السودانيين في ميدان مصطفي محمود و حالتهم اخر بهدلة بس الحقيقة مش فاهم هو اية بالظبط سبب المشكلة و لية الحكومة فضلت حالقالهم شهور و بعدبن فجاة عاملوهم بالعنف ......<br />لو حد فاهم التيتة يفهمني ..... هو فية اية ..... بيقولوا انهم ودوهم مساكن في 6 اكتوبر.........."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133821/http://www.20at.com/article2.php?sid=184"

[[comments]]
order = 3
subject = "رد"
author = "ريم"
posted = "2006-06-08"
text = "يا اخي الفاضل ان ما حصل للاخوه اللاجئين السودانيين لهو وجه واحد للسياسات التعسفيه التي يتعرض لها المواطن العربي كل يوم سواء من حكومته او من حكومات عربيه اخرى كما حصل مع هؤلاء,ان ماحمل هؤلاء لمغادره بلادهم هو شظف العيش الاقتصادي والسياسي والنفسي على حد سواء والحلم بتحقق كل الرغبات بمجرد الهجره وكأن اوروبا ستنتظرهم فاتحه لهم اذرعها ولكن تبددت الاحلام والحصل انو الامم المتحده حلقت لهم زي مابتقول انت,ثم جاءت معاهدات السلام ماحملهم على الاعتصام في ميدان مصطفى محمود للفت انتباه منظمه حقوق الانسان واضربوا عن الطعام...وما فعلته الحكومه المصريه من محادثات بشأن ارجاعهم للوطن وهو الجحيم الذي هربو منه فاقم المشكله...وطناش الحكومه السودانيه الموقره وحقوق الانسان على حد سواء زاد الطين بله.....ما دعى الحكومه المصريه لاستعمال العنف..وتسفير البعض عنوه....وهو شئ ليس بغريب ولا جديد على حكوماتنا العربيه...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133821/http://www.20at.com/article2.php?sid=184"

[[comments]]
