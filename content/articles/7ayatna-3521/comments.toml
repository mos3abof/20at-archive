subject = ""
author = "شاب مصري ....جاهل"
posted = "2007-04-04"
text = "الصحفي والكاتب المشهور ياسر التعلبي مش عارف انت طبقي ليه مش بتتكلم غير على العربيات الغالية المحترمة مع ان الكياسة والفطامة بتقول انك تكتب عن انواع السيارات العامة ليه مقولتش عن سبب تسمية سيارة رمسيس بهذا الاسم مثلا او موتوسيكل الجاوا ليه اسمة جاوا ولماذا سميت الترامكو بهذا الاسم .<br />لازم تعيش مع الشعب هو احنا عمرنا شفنا لابورجيني في مصر …اعتز انك مصري واتكلم عن التوك توك"
archived = "2009-05-06"
capture_url = "https://web.archive.org/web/20090506201358/http://www.20at.com:80/7ayatna/3521.html"

