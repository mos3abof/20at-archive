posted = "2007-04-04"
text = "انا عن نفسي اتمنى لما ربنا يسهل اني اركب جولف … و لما اكون اول مليون بإذن الله هجيب بي ام … و لما المليون يبئو عشرة هشتري بورش و ممكن مكلرن …<br />بس طول ما احنا عايشين هنا مش هنركب حتى عجلة … آخرنا ميكروباص او المترو … و لما الدنيا بتكون رايقة بنركب تا[ *** ]ي … و يا ريت عاجب … لما الواحد بيوقف التا[ *** ]ي من دول لازم يسأل الأول رايح فين ؟؟؟!! طب مش هو سواق التا[ *** ]ي طالع يشتغل … يعني المفروض اني اركب و بعدين يسأل .. مش كده ولا ايه ؟؟؟؟؟؟؟؟؟؟؟"
archived = "2009-05-06"
capture_url = "https://web.archive.org/web/20090506201358/http://www.20at.com:80/7ayatna/3521.html"

