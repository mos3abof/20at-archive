posted = "2007-04-04"
text = "السلام عليكم<br />الحقيقة أنا عجبني الموضوع، يمكن لأني أصلا من أنصار أن لا يفعل المرء شيئا هباء، او بلا فكر، على سبيل المثال كان مره قريبي حاطط صورة سلوجن ألفا روميو، فقلت له انت عارف ان ده صليب، قالي ممكن بس انا ما ليش عوه ، شكلها ولونها حلو. وعلى الجانب الاخر مرسيدس سوقها ضعيف في الخليج لانهم بيشوفوها زي الصليب… الشركات بتعرف نفسها بالسلوجن، وبتعرف الناس بموقفها ومين هي، وهذا هو الحال على مستوى الافراد، وعشان كده انا بكره فرساتشي"
archived = "2009-05-06"
capture_url = "https://web.archive.org/web/20090506201358/http://www.20at.com:80/7ayatna/3521.html"

[[comments]]
