[[comments]]
order = 10
subject = ""
author = "واحد فضله تعليق و يتشل"
posted = "2007-04-10"
text = "أنا ميش عارف ليه في فئة من الناس اللي بتعلق هنا بتتهم اللي بيكتبوا المواضيع بغير وجه حق ولا إثيات إنهم حراميه وسارقين الفكرة و الموضوع ويمكن التعليقات من ناس تانيه وده ميش المواضيع المعلوماتيه اللي زي الموضوع ده يعني علي سبيل المثال الباشمهندس اللي بقول إنه المعلومات بتاعت الموضوع ده كانت في أخبار السيارات يعني هو الراجل اللي كتب في أخبار السيارات إخترع المعلومات اللي جت فيه و سجلها براءة إختراع وحرم علي أي حد إنه يكتب عن نفس الموضوع ويجيب المعلومات من أي مصدر ومن ضمنها ميش عيب إنك تلاقي بتاع الأخبار.<br />النقطة اللي عايز أوضحها إن الموضوع ما دام ما اتنشرش في الموقع قبل كده يبقي ميش عيب إنه يقرأ لأن عشرينات كيان والأخبار كيان والشرق الأوسط كيان مستقل لازم يكون شامل.<br />وسألة إنك قريته قبل كده ما أنت لو فتحت التلفزيون إنبارح أو من 10 أو 15 سنة هتلاقي برنامج أكيد إتكلم عن الموضوع ده قبل بتاع الأخ بتاع الأخبار و الأخ بتاع عشرينات و الأخ بتاع النييوز وييك.<br />إرحمو دماغكوا شوية دا إنتوا بقيتوا بتشكوا و بتعلنوها صراحة في تعليقاتكم علي الناس اللي بتكتب مواضيع فكرية خالصة مبتكرة من أول حرف إلي آخر نقطة.<br />أنا في حاجة لسه عايز أوضحها إن الموضوع ده في نظري تقليدي بس التعليق بتاع الأخ الأخير فرسني."
archived = "2009-05-06"
capture_url = "https://web.archive.org/web/20090506201358/http://www.20at.com:80/7ayatna/3521.html"
