[[comments]]
order = 0
subject = "حيا الله الشباب المثابر الفاعل"
text = "اولا السلام عليكم ورحمة الله وبركاته<br />ماشاء الله من القليل بجانب القليل تبنى نفسك وتبنى امتك وانا عندما مررت بقصة عمل الاخ خريج العلوم فى المساحيق الفسيل قلت فى نفسى لو اكثر الله من امثاله لاستغنى شباب كثير واستغنينا عن غيرنا فى هذا المجال ولاصبحت اليد الامينة الخارجة من رحم هذه الامة هى التى تبنيها واى شيئ اشرف من ان دراستك هى مصدر رزقك شيئ جميل جدا وكل الشباب الذى بدأ بنفسه وعمل بجانب دراسته شيئ جميل جدا ولكن ايها الاحباب كل العالم يتجه الى التكتل فاى سيضيرك اذا اقنعت غيرك بفكرتك من الشباب المتحمص ويعم الخير عليك وعليهم ارجوا ان يكون تفكيرنا هكذا ايها الشباب<br />ومشروعات الخضروات مربحة نقلها من القرية للمدينة<br />وياريت لو مجموعة تتبنى هذا المشروع بحيث يزرع لهم شباب قروى متعلم اوغير متعلم الخضراوات التى يحتاجانوها وتكون ليس بها كيماويات كثيرة وتباع هذه اغلى من غيرها وخطوة خطوة تكون شركة مثلا للاستهلاك النظيف<br />او مجموعة تكون فى برمجيات الكمبيوتر يدرسوه والمنتج سيكون المبرمجين انفسهم ويكون بأسعار رخيصة منها يكسب المعلم المبرمج ويكثر السوق فتصدر الخبرة الى بلاد غيرك حيث يروج هذه الاحتياجات فى الدول العربية والاجنبية<br />المشروعات الصغيرة لربات البيوت الان اصبح بها تدهور مثل تربية الطيور والارانب والرومى"
archived = "2004-06-25"
capture_url = "https://web.archive.org/web/20040625071809/http://www.20at.com:80/article.php?sid=288"

[[comments]]
order = 1
subject = "واحد من الشعب"
text = "اذا تخرج الشاب من الكلية او حتى تعليم متوسط ولم يجد عمل وكانت ظروفه الاسرية ضعيفه مما يجعله لا يجد اب او ام او خالا او اخ اكبر يساعده ببداية مشروع صغير ماذا يفعل هذا الشاب فى مثل هذه الظروف"
archived = "2004-06-25"
capture_url = "https://web.archive.org/web/20040625071809/http://www.20at.com:80/article.php?sid=288"
