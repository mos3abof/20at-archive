[[comments]]
order = 8
subject = "أرجوك أصمت أنت"
author = "مصراوي بلا حدود"
posted = "2006-08-08"
text = "لما الضرب في عاكِف حرام وهو الذي لديه كل هذا التعاطُّف والحب والانتماء إلى وطنه ويبذل الكثير بما لديه ما إمكانيات لرفعة الوطن دون التفريق بين سنة وشيعة وبين مسلم ومسيحي .. أليست هذه الأوطان أوطاننا أليست هذه الأرض أرضنا ألسنا نتكلم لغة عربية واحدة .. أقولها لك يا سيد حمدي أن مهدي عاكِف أكثر فصاحة منك ومن غيرك ممن لا يستطيعوا أن يكملوا جملة واحدة مفيدة وأكثر منك انتماءاً وأكثر منك قرباً إلى الله .. بل أنت وأمثالك ممن يدسون السم في العسل والمحسوبين علينا كمصريين بجانِب هذا الرجل الفاضِل نكرة .. اتقوا الله وقولوا كلمة حق .. هل ما يقوله وما يفعله المرشد العام الأستاذ مهدي عاكِف يتساوى أو يتعادل مع مواقِف الخزي والعار لحكومتك وممن هم على شاكلتك .. وأخيراً قل الحق ولو على نفسك ولا ترضي رؤساءك لتفوز بجزء من الكعكة .. واستمع لقول رسولنا الكريم (( من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت )) .. ولهم حق اليهود أن يفعلوا بنا ما يفعلونه طالما أن في بلادنا أمثالك الذين لا يقدرون ولا يحترمون الكبار الأفاضِل حتى وإن أخطأوا ولا يوجهوا أقلامهم المسمومة في وجه أصحاب القيم والمبادئ بثمن بخس قليل دنيوي .. فإذا لم تستحِ ففعل ما شئت"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 9
subject = "قديمة يا حمدى العب غيرها"
author = "ابو سمية"
posted = "2006-08-08"
text = "قديمة يا عم حمدى ،والنبى العب غيرها .مين قالك بقى يا عبقرى زمانك ان الاخوان عاوزين يخلعوا عاكف ،وانهم مش طايقينه زى سعادتك ما بتقول ،اتحداك تقول اسم اخوانى واحد من اللى بتقول عليهم لدرجة ان اللى يقرا الموضوع يتخيل ان الاخوان بيجهزوا يعملوا فى عاكف زى ما عبد الناصر عمل فى محمد نجيب ،بالعكس والله .الاخوان بيقدروا مرشدهم بشكل لا تتخيله لانهم عارفين قدره وجهاده وادبه الجم ووطنيته الجارفة ،سيبك بقى من الافتكاسات العبيطة اللى لازم تطلعها بعد كل تصريح ،لان الاخوان عمرهم ما هيتاثروا بكلامك اللى ماحدش بيصدقه اصلا حتى من الناس العادية ،ولا اوعى تكون نسيت اقبال الناس على الاخوان ومرشحيهم فى الانتخابات .اعتقد ان مصر كلها مش هبلة وسعادتك الوحيد اللى بيفهم .على فكرة الدورى بدا ممكن تكتب عنه وتشغل نفسك بيه شوية علشان ترحم الناس من كلامك الفارغ.واحب اسال الموقع ليه متجيبوش حد عدل بدل حمدى ،هو فيه ان ولا حاجة ،ولا هو مفروض علينا فى المصرى اليوم وعندكم كمان .ربنا يهديك يا حمدى ."
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 10
subject = "مين الي يستحق الضرب"
author = "الغالبية الصامتة"
posted = "2006-08-08"
text = "ولو ان مش اخوانيه لكن تصريحات مهدي عاكف عن الطظ او العشرة الاف اخواني مدرب ومجهز عسكريا والخ 000 كلها مفهومه وفي سياق الموضوع لكن تيجي ايه قدام التصريح التاريخي ان الحرب خسارة علي اسرائيل والبتاع ده000 هي دي التصريحات والا بلاش والكوميديا ان في نفس توقيت انطلاق هذا التصريح السياسي العميق هناك في الركن الثائر لبلد صغير المساحةو الكثافة السكانية خرج علينا صاحب العمامة السوداء السيد نصر الله ليقول اذا قصفتم بيروت سوف نقصف تل ابيب 0 سيادة اللواء الصحفي حمدي رزق ودوتنا في داهية بسطحية مقالاتكم"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 11
subject = "النصح فىحمدى حرام"
author = "صحفىمش امنى"
posted = "2006-08-08"
text = "حمدى بية انت طبعا نسيت لما كنت صحفى ملكش لازمة حبيت توصل باى طريقة فخدمت النظام ياعبدالنظام فوصلت وبقيت ضمن اللجنة الاعلامية بتاعة الريس وريس تحرير الاذاعة والتلفزيون ومعشم طبعاتبقى ريس تحرير اخباراليومااوالاخبار طبعا ياعم نفخك فىالنظام جة بفايدة ولسةفعلشان كدةهجومك فى بعض الصحف ضد الاخوان هى اواوامر من النضام لكن ياحمدى بية ياعبقرى كل باكا فسيبكى وكل ناعا فسينعى وكل مدخورا سيفنى وكل مذكر سينسى ليس غير اللة يبقى من على فاللة اعلى وربنا يهديك وان لم تنهدى ربنا ينتقم منك واعلم ياحمدى بية ان ايام هذا النظام محدودة جداجدا فمتعولش عليهم يا عبقرى وشفلك حد تانى امدح فية يامتطفل ياعصفور الامن"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 12
subject = "بلاش قلة أدب يا \\\" رزق \\\""
author = "محمد السيد - حماسنا"
posted = "2006-08-08"
text = "الكاتب \" الساخر \" حمدى رزق , كنت اتمنى ان اقرأ بين كلماتك عبارات موضوعية او مصطلحات صادقة تخرج من قلم \" حر \" لكن حقيقة بعد هذه الكلمات اكتشفت انك لست حراً , الاكثر إثارة فى كلامك هو التضارب بين افكارك الرافضة للإخوان كجماعة شعبية و قبولك للتفاعل الإدارى و التربوي داخل الإخوان .. كيف ترفض وجود كيان الإخوان فى المجتمع , و فى نفس الوقت انت مبسوط بأوهام تقول انها \" حقيقة فعليه داخل الإخوان \" ... أريد ان اقول لك فى النهاية ان كلامك لا يؤخذ و يرد فقط , اعتقد انه يؤخذ ثم يداس عليه بأحذية الأمن المركزي التى تجرى خلف شباب فى الإخوان فى كل تظاهرة من أجل الإصلاح .. انت يا اخ حمدى رزق عبارة عن \" بوق \" لكنه بوق حديث شوية , بوق لديه معلومات عن الاخوان و أسر الإخوان \" مثل ضباط أمن الدولة بالضبط \" لكن الفرق بينك و بينهم , أن اسمهم أمن الدولة , أما انت ( مجرد صحفى مرشد ) !"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

