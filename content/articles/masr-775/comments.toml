subject = "الي ابو محسن المصري"
author = "مصراوي"
posted = "2006-08-07"
text = "يا اخي اتقي الله وراجع معلوماتك الشيعه مسلمين مؤمنين والزهر من ايام الشيخ محمود شلتوت شيخ الازهر قال ان مذهبهم يصح التعبد به انت اللي هاتيجي تكفرهم ومش عايز حد ولا الاخوان يساندهم ده لو كان مسيحيين لبنان هما اللي بيحاربوا اسرائيل يجب نساندهم ونساعدهم للدرجه دي المفاهيم والامور عندك وعند غيرك المتاثرين بالفكر الوهابي المتعفن الي ابتلينا به من ال سعود المتحالفين مع الصهاينه والامريكان ضد الامه امثالك هم الطابور الخامس للصهاينه"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 6
subject = "لما تعرف تتكلم انت ابقى اتحفنا بسكاتك"
author = "ابو عبيده"
posted = "2006-08-07"
text = "يا عم حمدى لما تعرف تتكلم انت ابقى تعالى اتحفنا بسكاتكوعلى راى المثل اللى بيته من زجاج قال ايه انت اللى امله قوى ولا نقول عادتك ولا حا تشتريهاما انت لو معملتش كده مش حتبقى حمدى رزق بس نصيحة من اخ يريدلك المصلحةصدقنى انت بتخسر كتير اوىبموقفك دهانت يا حبيبى نكره جدا جدافى عالم الاخوانونصيحه كمانبلا ش تتكلم بلسان الاخوان علشان سوءتك ما تبانش اكتر من كده وفضيحتك ما تبقاش بجلاجلمين اللى قالك ان الاخوان متخبطين فى امر الرجل ومين اللى قالك انالمرشد الحقيقى هو المهندس خيرت الشاطرمين يا حبيبى ضحك عليك وقالك كده احب انك تعرف ان الاخوان على قلب رجل واحد مجمعين على القياده الحاليهبل فخورين جدا بهذا الرجل العظيم وكمان الشعب اكتره لا يكن للرجل واخوانه الا كل احترم وتقدير وياريت يا حبيب البى تعرف حجمك كويس وما تنفخش نفسك اوى اصل ترفقعوبعين تبقى كارثة قوميه فى المنوفيه وشوف حجمك وشوف حجمك اد ايه فى اوساطك بس مش فى الشعب فضلا عن المثقفين واللى بيقرولك ان كان حد بيقرالك وهو مقتنع بكلامكوبعدين برده اتكلم على ادك"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

