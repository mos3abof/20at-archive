author = "مصرى متغرب"
posted = "2006-08-09"
text = "فعلا احنا شعب حلال الى يحصلة علشان خلاص سيبنا الفساد الى فى البلد وقاعدين نهاجم الاخوان وعلى فكرة انا مش متفق معاهم فى اى أرائهم بس الى بيحصل فى مصر حرام والله مسكتم فى تصريحات الراجل علشان قال جزمة وطظ بجد طظ فينا لو مش عارفين نقف مع حزب الله ولا مع اسرائيل طظ فينا لو لسة بنفكر ان الاخوان هما الخطر الاعظم فى مصر طظ فينا علشان لسة بنختلف البيضة الاول ولا الفرخة<br />شعب مصر الودود المتعاون من فضلكم اصحو وافيقواما ان الاوان للجثث ان تتحرك عموما فقد قلتها سابقا واقولا ثانية<br />مافيش فايدة مافيش امل<br />بالله عليكم السيد كاتب المقال هل قرأتم مقالة لة تنتقد عاطف عبيد عندما باع البلد والى فيها هل قرأتم مقالة تنتقد جمال بية وافعالة هل قرأتم مقالة لة تنتقد استقبالنا لاولمرت وهو لسة قاتل عساكر مصريين امبارح هل لة مقال ينتقد احمد عز وملياراتة مجهولة المصدر هل لة مقالة تنتقد ابراهيم نافع وفسادة هل لة مقالة تنتقد ماحدث للعبارة وقبلها عبارات اخرى وقطار الصعيد وطائرات مصر للطيران وغيرها بؤر الفساد كثير لو ذكرتها جميعا لاحتجت على الاقل عشر صفحات ارجوكم اسمعو لرأى القرضاوى مفتى الامة بخصوص الشيعة حيث قال انهم كفار ولكن كفرهم اقل من كفر اليهود الملاعين ويجب ان ندعمهم لان القرءان يقول ( لتجدن اشد الناس عداوة للذين امنو اليهود ...)"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 15
subject = "لعنة الله على المنايفة الأوغاد"
author = "كيمو العجلاتي"
posted = "2006-08-09"
text = "لا يستغرب هذا التهجم السليط على شخص مرشد الإخوان المسلمين من حقير مثل هذا الكاتب 'حمدي مناخيم رزق' الذي أفصح سهوا عن منوفيته وبالتالي عن يهوديته ومجوسيته فلا فرق بين الإثنين فالمنوفي يهودي مجوسي بالميلاد..وقتله واجب، ولقد جربتم للآن منهم خنزيرين ضيعا البلاد والعباد ووطنا للكفر في كل بلاد الإسلام.<br />هذا الحقير لايعنيه حقيقة شخص المرشد بل موقفه من العدوان على لبنان وفلسطين..ولو أن المرشد قال بمقولة سيد كاتب المقال المنوفي الخنزير اللامبارك..لقام به صاحبنا وقعد وأخذ بضبعه لعنان السماء..قاتل الله أهل المنوفية ومحقهم لا يتركون حقدهم وكراهيتهم للإسلام لا سرا ولا علنا.<br />وللمدعو \"مصرى متغرب\" إتق الله ولا تضع بفم الشيخ القرضاوي مالم يقله، وإن كنت صادقا فقل لنا متى ذكر الشيخ الجليل ' انهم كفار ولكن كفرهم اقل من كفر اليهود الملاعين' هذا كلام تحاسب عليه وتسأل وسيتعلق الشيخ بعنقك يوم القيامة ويقول 'تقول علي يارب بما لم أقل'. وإن كنت منوفيا والعياذ بالله جاز لك ذلك من باب 'أنا الغريق فما خوفي من البلل!\"."
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 16
subject = "الى كيمو العجلاتى"
author = "مصرى متغرب"
posted = "2006-08-09"
text = "الاخ كيمو العجلاتى الشيخ القرضاوى قال هذا الكلام على قناة الجزيرة برنامج مباشر حينما سألة المذيع هل هو مع حزب الله ام لا فأجاب انة معة لعدة اسباب هى على ما اذكر<br />1- انهم مسلمون حتى ولو اختلفنا فى ذلك واليهود ليسو كذلك ثم استشهد بهزيمة الروم وحزن الرسول لذلك لأنهم اصحاب دين<br />2- يجب ان نساند حزب الله من مبدأ ان اسرائيل هى عدوتنا الاولى والمثل يقول انا واخويا على ابن عمى وانا وابن عمى على الغريب ( قالها بالنص)<br />3- ان الذى يحارب هو المقاومة اللبنانية وهم عرب ولهم حق العروبة علينا<br />4- من منطلق التقييم المنطقى للامور من الظالم والمظلوم وننصر المظلوم ( لبنان )<br />ثم ختم حديثة عندما سألة مصرى فى مكالمة هاتفية عن الشيعة قال الاثنان كفار ( الشيعة وحزب الله ) ولكن الشيعة أقل كفرا<br />اخى الفاضل انا مسئول عما اقولة وليس عندى مشكلة فى تحمل عاقبة ما اقول<br />اما واسمح لى ان اخالفك فاذا كان الملعون من المنوفية فهل معنى ذلك ان كل المنوفية مثلما تقول يا اخى اتقى الله فيما تقول يامن تحدثنى عن تقوى الله واعلم ان فى المنوفية انا شرفاء مثلما فى كل مكان من ارض مصر اما الشخص المنحل فهو ليس نتاج بلد انما نتاج تربية ومنزل<br />وشكرا لاهتمامك بردى"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 17
subject = "الى مصرى متغرب"
author = "كيمو العجلاتي"
posted = "2006-08-09"
text = "ولدنا مصري متغرب رد الله غربتك غانما في دينك ودنياك وبعد..القرضاوي أعرفه شخصيا ولا أعرفك..وسبق لي أن ناقشته شخصيا في موضوع الشيعة..وهو قالها أكثر من مرة الفروق بين الشيعة الإمامية والسنة تتعلق بفروع لا أصول..وفي الشيعة كما في السنة غلاة جدا، وهم أقلية وهي ترفع الإمام علي لمقام أعلى من كل بشر (لما يقارب الألوهية) وليس هؤلاء القوم هم سواد الشيعة الأعظم.<br />ولو تأملت -هداك- الله ما ذكرته في بندك الأول وحاشية البند الرابع ما يتعلق بالمحادثة الهاتفية فمن المؤكد أن الأمور إلتبست عليك وأخطأت الفهم، فهذا يناقض تماما \"انهم مسلمون حتى ولو اختلفنا\". وعموما تلك الحلقة من برنامج \"الشريعة والحياة\" متاحة على صحفة الجزيرة العنكبوتية..فراجعها لعلك تتبين مقصد الشيخ القرضاوي، لأنه لايعقل أن يقول \"الاثنان كفار ( الشيعة وحزب الله ) ولكن الشيعة أقل كفرا \" كما ذكرت.<br />وأما عن فجور ومروق أهل المنوفية من الإسلام والمرءوة والشرف والأمانة فلا يوجد عالم واحد يخشى الله في هذة البلد سألته وقال بعكس هذا، ولعل بين ظهرانيهم رجل أو رجلين يتمسكون بأهداب الإسلام إما حقا أو مراءة، ولكن الإستثناء لا يصنع القاعدة. وألسنة الخلق أقلام الحق، والعامة هنا تقول\" المنوفي لا يلوفي ولو أكلته لحم الكتوفي!\". وما رأيته من خلق السادات وتابعه مبارك وما سمعته من شهود العدل التقاة يؤكد عندي أن هؤلاء القوم أرذل من على ظهرها وأخبثهم عنصرا وطوية وكيدا وكراهية للإسلام والمسلمين..وهم أحب الناس لليهود وأقربهم لحمة بهم. وإن كانت أصولك تنتمي اليهم فلا أجد غضاضة البته أن أتهمك..إلا أن تكون تبرأت منهم ومن معتقدهم الخبيث..وأعتنقت الإسلام وتعلمته أو مبادئه الحنيفة من غيرهم. هذا والله أعلم بك ولعله يهديك ويشرح صدرك."
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 18
subject = "اتقي الله"
author = "ابن النيل"
posted = "2006-08-09"
text = "الي مصري مغترب انت بتكتب وانت نايم ولا مش مركز اصحي شويه في اول مقالك بتقول ان الشيخ القرضاوي قال علي الشيعه انهم مسلمين وهذا ما نعرفه عن رأي الشيخفي الشيعه وحزب الله ثم تاتي بعد ذلك وتقول انه في نفس البرنامج سالول الشيخ عن الشيعه وحزب الله فقال انهم كفار يااخي حرام عليك احترم عقولنا شوية احنا عارفين الشيخ القرضاوي ودقته في الكلام لكن سبحان الله انت بنفسك اظهرت كذبك وسيحاسبك الله علي هذا يوم القيامة"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 19
subject = "فنزويلا ترجح قطع علاقاتها بإسرائيل بعد تبادل سحب السفراء"
author = "الجزيرة"
posted = "2006-08-09"
text = "رجح الرئيس الفنزويلي هوغو شافيز أن تقطع بلاده العلاقات مع إسرائيل بعد أن تبادل البلدان سحب السفراء, بسبب الحرب في لبنان.<br />وقال شافيز أثناء خطاب في كراكاس إنه \"من المرجح أن تكون خطوتنا القادمة هي قطع العلاقات الدبلوماسية\".<br />وأضاف شافيز أن بلاده \"ليست مهتمة بإبقاء علاقات دبلوماسية أو الاحتفاظ بمكاتب أو أعمال أو أي شيء مع دولة كإسرائيل\".<br />هولوكست جديد<br />وكان شافيز انتقد بشدة العدوان الإسرائيلي على لبنان ووصفه بـ\"هولوكوست جديد\", تقوده نخبة \"إسرائيلية\" تعمل على \"قتل الأبرياء بطائرات أميركية, وبقدرتها العسكرية العالية بدعم أميركي\", قبل أن يقرر سحب سفير كراكاس في تل أبيب قبل خمسة أيام.<br />ومباشرة بعد الخطوة الفنزويلية قررت إسرائيل سحب سفيرها من كراكاس, ووصفت خارجيتها شافيز بأنه \"تحالف مع الرئيس الإيراني الذي يدعو إلى تدمير إسرائيل\".<br />كما هاجم اتحاد الجمعيات الإسرائيلية في فنزويلا ما وصفه بـ\"التصريحات المعادية للسامية\" في وسائل الإعلام التي تدعمها الحكومة و\"الانحياز المتعمد لممثلي الحكومة إلى أحد طرفي الصراع\"."
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 20
subject = "الى كيمو العجلاتى وابن النيل"
author = "مصرى متغرب"
posted = "2006-08-10"
text = "اولا اعتذر عن الخطأء الكتابى الذى وقعت فية حيث قلت ان الاثنان كفار وكنت اقصد اليهود والشيعة وانا اقسم بالله أن القرضاوى قالها بنفسة وتستطيع ياكيمو ان كنت تعرفة شخصيا ان تسألة اما بخصوص المنوفية فانا لست منها انا من الدقهلية ثانيا كما قلت لك لو حكمنا على الناس جميعا بتصرفات شخص او حتى مائة شخص لاصبحنا ظالمين ان بعض الظن اثم ولا تنسو اننا لو بحثنا لوجدنا فى كل مكان فى ارض مصر الطيب والغير طيب والصالح والفاسد فهذو حكمة الله ان يوضعوا معا حتى يكون الطيبون مثالا للاخرين علهم يهتدو ان شاء الله وحتى يكون الفاسدون اختبار وبلاء من الله للطيبين حتى يقوا ايمانهم<br />اما الاخ ابن النيل<br />اخى الفاضل هذا الكلام موجود بالنص فى الحلقة وهذا ما اثار استغرابى مثلك تماما ولكنى لا اقدر على تحمل وزر ان اقول كلاما على لسان مفتى الامة دون ان يكون قد قالة<br />وجزاكم الله خيرا"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"
