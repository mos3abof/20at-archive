[[comments]]
order = 0
subject = "محمد مهدي عاكف والشيعة"
author = "ابومحسن المصري"
posted = "2006-08-07"
text = "اول ما بدأت الحرب على لبنان فوجئنا بموقع الاخوان المسلمين يبرز اخبار حزب الله الشيعي وزعيمه نصر الله على اساس انهم ابطال فبعثنا رسالة الى المرشد العام نقول له يا حضرة المرشد هؤلاء شيعة والشيعة اعداء لاهل السنه فلا داعي ان تبرز اخبارهم وتصنع منهم ابطال وتكلم على القضية اللبنانية بشكل عام كشعب لبناني عربي فقط واستشهدنا بما يحدث في العراق من ذبح لاهل السنه كمجزرة الفلوحة مثلا ولم نجد واحد شيعي ذرف دمعة واحدة لا السيستاني ولا نصر الله ولا غيره.<br />فرد علينا فضيلة المرشد بأن لا فائدة بالتفرقة بين الشيعة والسنة لان قرأننا واحد.<br />فكيف يقول المرشد العام للاخوان المسلمين هذا الكلام وعلى عجالة احب ارد على السيد المرشد ان فيه اية في سورة البقرة تقول (ان الله يأمركم ان تذبحوا بقره) تعرف يا فضيلة المرشد من هي البقرة البقرة عند الشيعة هي السيدة عائشة ام المؤمنين وفيه اية فيها كلمتي (الجبت والطاغوت) الجبت والطاغوت عند الشيعة هما ابو بكر وعمر وهذه ايتان فقط فكيف يا فضيلة المرشد انك مرشد ولا تعرف هذا الكلام ان الشيعة يلعنون ابو بكر وعمر وعائشة وبقية الصحابة ويكفرون اهل السنه ويعتبرونهم نجس ونحن نقول هذا الكلام عن علم وبصيره ومجازر اهل السنه في العراق وعلى رأسهم الفلوجة تتم على مرئى ومسمع من السيستاني وغيره.<br />فيا فضيلة المرشد انت بحاجه الى مرشد<br />وقبل ذلك يا فضيلة المرشد مسكو عليك غلطة كبيرة وانت تقول (طز في مصر واللي في مصر) وهذه غلطة فادحة فارجوك استقيل بسرعة قبل ان يستفحل امرك"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 1
subject = "والله ياحمدي رزق باشا... الضرب في البلد حرام"
author = "واحد مصري"
posted = "2006-08-07"
text = "يعني ياحمدي بيه تذكرت بسرعة قوى الجزمه والطظ والخمورجيه وبتاع النسوان ، أظن أن الذباب لا يسقط إلا على الجروح ... وفاهم كلامي طبعاً بقى ياراجل تتريق على الراجل كده وهو محروق على لبنان بهذا الشكل ويعد بأن هناك من الأبطال في مصر من يصلحون للدفاع عن لبنان ألم تخرج المظاهرات في أنحاء مصر المحروسة تدعو للجهاد وإلغاء كافة الإتفاقيات مع العدو ,وكل واحد يقول أنا فداء لبنان والعرب والمسلمين بدل ماتقف مع المقاومة وتحيى شجاعة الراجل تتريق عليه ... ربنا يأخذك ياأخي<br />وبالنسبة للباشا أبو محسن المصري يعني ده وقته الكلام في هذا الموضوع الشيعة في لبنان بتقاتل إسرائيل أم تقتل في المسلمين ألم تعلم أن حزب الله لم يطلق رصاصة واحدة في صدر مسلم لبناني ياأخي وحدوا صفوفكم خلف المقاومة واستعينو بالله ...<br />والله حرام عليكم الكلام في هذه المواضيع في هذه الأيام أم ترى أن متفجرات اليهود تفرق بين سني وشيعي ومسيحي"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 2
subject = "من يخافون الاخوان"
author = "بسمه"
posted = "2006-08-07"
text = "الاستاذ حمدى برغم انني لست من انصار فكر الاخوان ولكن هذا ليس معناه وهم قوة في بلدنا ان نهاجمهم عمال علي بطال وطبعا حضرتك كتبت كتير عنهم ولكن مع احترامي لا الاخوان غيروا فكرهم ولا قلة شعبيتهم وكان لحضرتك في حالة حوار مع عبد السميع و محمد كمال حرب عاصفة علي المرشد و عموما الاخوان المسلمون قوة وممكن يكونوا مدربين و ممكن يكون عندهم اكثر مما تتصورون لانه تنظيم بجد مش زي اسمه النبي حرصه الحزب الوطني بتاع لجنة عدم السياسات وليه لا ما يكونش عندهم سلاح عموما في ظل الدول المستبدة لا تسبتبعد اى شيء وكل شيء ما سمعناش رايك في موقف الدولة الي كان لغاية وقت ليس ببعيد اسمها مصر"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

[[comments]]
order = 3
subject = "حمدي رزق ...... ملقتوش الا ده"
author = "المصري"
posted = "2006-08-07"
text = "يعني موقع عشرينات ساب كل الكتاب المحترميين و النص محترمين ... وجاب مقال لحمدي رزق ؟؟؟ ياجماعة انا متابع جيد لجريدة المصري اليوم .. ومن يم ما الحرب بدأت و حمدي رزق شغال في كتابات مالهاش دعو بالموضوع ؟؟ لدرجة ان بعد مجزرة قانا كتب مقال بيتكلم فيه عن المعكسات اللي بتحصل للبنات في مصر و ان 3/4 الشباب المصري بيعكس معاكسة كلامية و 20% بيعاكس معاكسة فاضحة و 5% بيعكس بإيده ؟؟؟؟ ياريت ادارة الموقع تختار كتاب أحسن من كده"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830231209/http://masr.20at.com:80/article.php?sid=775"

