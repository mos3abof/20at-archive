text = "معاذ محمود عامر هوه أبو عبيدة والله العظيم أقسم بالله العلي العظيم الجليل الجبار ان أبو عبيدة هوه معاذ محمود عامر وعزة وجلال ربنا همه الاتنين واحد وانتوا عارفين طبعا ان معاذ ده مصري يعني كان بيسخن الدنيا عالفاضي ورحمة أمي الاتـنين واحد وولا حد هيرد منهم لأن الاتنين واحد وده ايميل معاذ mizo_bns2011@yahoo.com ملحوظة أبو عبيدة اللي فوق ده غير أبو عبيدة الخليجي اللي أنا قصدي عليه الل كفر محمد فتحي وقال ان ستات مصر عاهرات"
archived = "2006-08-30"
