text = "النوبة مسلمون بنسبة 100 %<br />واللهجة النوبية انقرضت الا مع قليل من العجائز ولكن الجيل الجديد كلة مسلم عربى ينطق اللهجة المصرية كاى مصرى<br />والذى يلعب على هذا الوتر هم اقباط المهجر والموساد الاسرائيلى<br />ولكنهم سيفشلون<br />وبل وفشلوا فعلا فشلا زريعا"
