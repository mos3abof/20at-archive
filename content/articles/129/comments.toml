[[comments]]
order = 0
subject = "بنات الاصول"
text = "انا بابا مكنش له أي طلبات...بس الحمد لله جالي أكتر من ما كان ممكن يطلب... أهل جوزي كانوا فرحنين بينا أوي..ومش مصدقين نفسهم...فصمموا يعملوا كل حلجة أكتر حتى من المستوى الطبيعي...وجوزي شايل لأهلي الجميل دا لحد دلوقتي وبعد سنوات!"
archived = "2004-07-11"
capture_url = "https://web.archive.org/web/20040711060436/http://www.20at.com:80/article.php?sid=431"

[[comments]]
order = 1
subject = "قرد يسليني..ولا غزال شارد"
text = "الاهل مبقوش كدة أوي اليومين دول..يعني هماابتدوا يحسوا ازاي ان المغالاة في طلباتهم بتكون سبب من أسباب تأخر سن جواز بناتهم..و اللي بيأثر على نفسيتهم..فبقوا يعني متفهمين..و بيرضوا بقليلهم \" ماديا\" مدام العريس متدين وابن ناس طيبين وطموح.<br />و اللي لسة بيفكر زي الموضوع ما بيقول في الغالب بناتهم مش بيتجوزا..لأن حتى الشاب الغني مش بيحب يحس انه شوال فلوس..و انهم طمعانيين فيه..دا جواز يعني و \" يا واخد القرد على ماله....\""
archived = "2004-07-11"
capture_url = "https://web.archive.org/web/20040711060436/http://www.20at.com:80/article.php?sid=431"
