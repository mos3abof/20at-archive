[[comments]]
order = 1
subject = ""
author = "لينا عبود"
posted = "2008-03-17"
text = "لم يأتي في القرآن ولا في السنه دليلاً قاطعا على تحريم قيادة المرأة للسيارة .. وان لم تكن موجوده في عهد الرسول عليه السلام ولكن كان هناك الجمال والخيول وغيرها من الدواب التي تستخدم كوسيلة مواصلات .. لو ان تحريم قيادة السيارة على المرأة امر صحيح كان حرياً بنا ان نسمع عن منع النساء من ركوب الدواب …<br />منتهى التناقض .. كيف لا يسمح للمرأة ان تقود سيارتها لوحدها في حين يسمح لها بالاختلاء مع سائق من غير المحارم وما اكثر حالات الاختطاف والقتل والاغتصاب التي كانت نتيجة لترك المرأة في عهدة سائق ..<br />للمنادين بتحريم القيادة للمرأة : اذا كنتم تحرمون قيادة المرأة للسيارة وتعتبرونها قد اتت فعلة نكراء فهل هذا يعني تتهمون بقية نساء المسلمين في باقي الدول العربيه والمسلمه بارتكاب امر محرم وهو قيادة السيارة ؟<br />الدين يسر وليس عسر .."
archived = "2009-04-25"
capture_url = "https://web.archive.org/web/20090425134955/http://www.20at.com:80/ana-s3ody/8510.html"

