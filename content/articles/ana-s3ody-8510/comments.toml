author = "والله ... لينا"
posted = "2009-01-19"
text = "لينا خلي الدين في حاله عسا ربي ينساك في نار جهنم في حالك والله مب منك من الوسع إلي بين رجليك<br />أخر زمن كم قحبه 126 قحبه يبون يدورن بنات السعوديه والله تخسون وربي قسم بالله إنا العزابيه ملتحين بشوارع<br />زكل واحد عيره يجره وراه وربي يفجرونكم فجر انتم يلي تبون سوقون فهمتي يبقره المزاع تفوووووووووو عليك يالينا<br />الخرااااااااااا ااااااااااااااا ااا"
archived = "2009-04-25"
capture_url = "https://web.archive.org/web/20090425134955/http://www.20at.com:80/ana-s3ody/8510.html"

