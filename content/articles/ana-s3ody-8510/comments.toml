text = "شنو الكلام هذا يالينا دعي الدين على جنب انكان متعرفي تكلمي فية من وين اتيتونا بلفكلا البطل أولا عليكي الالتزام بصمت أو التكلم بالحقيق والالتزام بالاخلق الاسلامية الرزينة وحنا سوف انشالله نواجة المشكله هذا هرااااااااااااا اااااااااء بس تبين الفلة على حساب البنات الثنيات"
