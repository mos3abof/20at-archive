[[comments]]
order = 3
subject = ""
author = "هُمام عبدالله"
posted = "2009-05-11"
text = "موضوع جديد يا مروة وربنا يوفقك وبالنسبة للاخ عبد السلام المنياوى انا متفق معاك انه مش الزى هو الفيصل فى موضوع العلم لكن انا شايف ان الزىقيمتة فى انك تقدر تميز ان ده عالم من علماء الازهر او قس من القساوسة فبالتالى يتعاملوا بالاحترام اللى يتناسب مع موقعهم كعلماء فى دينهم مش بس داخل الوطن الاهم لما علمائنا يسافرو فى الدولة الغربية وافتكر الواقعة بتاعت مطار هيثرو فى انجلترا عموما يا مروة اتمنى انك توضحى اهمية الزى الازهرى او المسيحى ويبقى فيه نبذات تاريخية عنه وبالتوفيق ان شاء الله"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530002312/http://www.20at.com:80/t7kyk/11930-2009-05-02-10-04-48.html"
