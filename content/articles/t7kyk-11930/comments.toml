author = "عبد السلام المنياوى"
posted = "2009-05-02"
text = "يعنى اية لبس المشايخ ؟ هل هناك فى الشرع او فى السنة لبس خاص للعلماء - ابدا<br />انما الموجود حاليا من جبة وكاكولا او قفطان فهذا من الميراث العثمانى حينما كانت مصر ولاية عثمانية تتبع الباب العالى ورجال الدين العثمانيون كانوا بيرتدوا هذا الزى<br />- والمشايخ او رجال الدين فى الخليج بيلبس الجلابية العادية وفوقها عباءة وفى ايران والعراق لهم زى خاص اشبة بالزى الازهرى ما عدا العمامة - والسودانيون لا يرتدون زى الازهر وكذلك المغاربة<br />وعلى العموم موضوع اللبس دة مش قضية راى عام ولا المشايخ دى لها شعبية بل مجرد موظفين حكومة وربنا يسترها على عبيدة"
archived = "2009-05-03"
capture_url = "https://web.archive.org/web/20090503080415/http://www.20at.com:80/t7kyk/11930-2009-05-02-10-04-48.html"

