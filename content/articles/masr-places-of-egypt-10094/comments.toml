author = "سحلوب"
posted = "2008-09-17"
text = "طيب فين الانتاج المصرى - الكشكول المصرى وعلبة الالوان المصرية والجزمة المصرية فين رجال الاعمال - فاضيين بس للسمسرة فى العقارات - ياخدوا ارض الدولة بملاليم وييعوها بمليارات - ويتفرغوا لمعاكسة الفنانات<br />فين الصناعة دى<br />الكشاكيل والكراريس وعلبة الالوان مش محتاجة تكنولوجيا معقدة ولا ماكينات ضخمة<br />انما الاصلاح الاقتصادى بيحذر التصنيع ويشجع الاستيراد<br />اخرتكم سوداء ان شاء اللة"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105141539/http://20at.com/masr/places-of-egypt/10094-2009-06-10-18-17-56.html"

