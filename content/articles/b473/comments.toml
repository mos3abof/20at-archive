posted = "2006-02-22"
text = "يا جماعة ده وعظ بالاجبار<br />ايام الجامعة كان الاخوان بيدخلوا قبل الدكتور واثناء break ليخطبوا ويقدموا المواعظ وكنت دائما باعترض علي كده لاني ماببقاش ناقص اسمع محاضرات تانية في الوقت ده بس الاخوان لما كنت باقولهم كده كانوا بيقولوا لي اخرج بره لو تعبان ويتهموني بضعف الدين والعقيدة !!!<br />يا سلام !!!!<br />انا اللي اخرج وده الclass بتاعي انا<br />انا ضعيف العقيدة وفي قلبي مرض<br />بجد حاجة تقرف ليه يجبروني اني اسمع وانا مش مستعد اني اسمع حاجة في الوقت ده لا دين ولا غيره<br />وسلام<br />Dabdoob"
