subject = "كفاية"
author = "مصري"
posted = "2006-03-08"
text = "أمتي هانقهم أن مش أي حد حفظ كلمتين بقي واعظ؟!<br />أمتي هانفهم أن لأنت حر تعمل أللي عايزة بدون ما تعتدي علي حريتي؟!<br />أمتى هانفهم أن لكل مقام مقال؟!<br />أمتى هنفهم أن أنت مش لوحدك في بلدك لكن حواليك ناس مختلفين عنك و مش لازم تعملهم زيك؟!<br />أمتى هنفهم أن الدين لله و الوطن للجميع؟!<br />حاجات كتير صعب علينا نستوعبها لأننا عايشين بمنطق الأنانية حتى في الدين هل يقبل أحدهن أن يقوم في الوسط شخص مسيحي و يفعل هذا؟؟؟!!!<br />يقولون عامل الناس بما تحب أن يعاملوك به"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123211/http://www.20at.com/article2.php?sid=473"
