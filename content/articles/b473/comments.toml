author = "أكرم"
posted = "2006-02-21"
text = "حصلتلي الحكاية دي مرة في الميكروباص و كنت ساعتها متدين اكتر من دلوقتي بس الموضوع ما كانش مستساغ نظرا لاني كنت لسه راجع من الجامعه و مش ناقص حد يديني محاضرة تانية<br />اما اذا كان في حل و كنت عايز اوعظ سكان المكروباص كنت بجيب شريط ديني او قرآن و اديه للسواق بس كنت بحطه في علبة شريط اليسا ( عشان ميقوليش ان الكاسيت بايظ )<br />اما بقا المترو فالمشكلة ان الكاسيت بتاعه بايظ على طول"
