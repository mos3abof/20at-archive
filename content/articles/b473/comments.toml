[[comments]]
order = 2
subject = "من أفتى بغير علم"
author = "لو الموضوع مقتصر على التذكير بدعاء الركوب فهذا شئ جميل . فأنا مثلا و الحمد لله أتذكر دعاء الركوب كلما ركبت أي مواصلة و أحيانا تأتي واحدة لتذكر النساء به فأردد معهن مع أني أكون قد قلته مرة قبل ذلك و لكن ذلك يكون لعل الله يرى هؤلاء المسلمات على طاعة فيغفر لكل من قالت الدعاء فأكون واحدة منهن ."
posted = "2006-02-21"
text = "أما موضوع الافتاء فهذا غير مقبول بالمرة ، أنا مرة سمعت واحدة بتنصح واحة بالصلاة فقالت لها أصلى مابلاقيش مكان أصلى فيه و أنا في الشغل قالتلها خلاص ابقى اجمعي الصلوات بالليل و التانية صدقتها و أخذت بفتواها للأسف . تخيلوا المهازل اللى بتحصل بقى ...<br />ربنا يعافينا جميعا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123211/http://www.20at.com/article2.php?sid=473"

[[comments]]
order = 3
subject = "لا ما هيا مش سلطه"
author = "sweet_princess"
posted = "2006-02-21"
text = "مش اي حد يبان عليه التقوى والصلاح كدا نجري عليه ونساله لانك ممكن تسال واحد عن معلومه ويكون عارفها وقدر يجاوبك يبقى خلاص بقى مفتى (معنى كده بقى اني اول ما اركب المترو الصبح اجري على اي واحده بتقراء في القرءان او بتذكر ربنا شويه واقولها افتيني )لا طبعا دا غلط كده بقى هيختلط الحابل بالنابل وما حدش هيبقى عارف يروح لمين وياخد منه الاجابه الصحيحه على سؤاله امال الازهر الشريف بيعمل ايه ودار الافتاء كمان وهي دي مشكلة المشاكل بالنسبه لينا نسيب اهل العلم ونجري ورا اي حد ودا طبعا مش تشكيك في كل الناس (في مثلا عمرو خالد) من القلائل اللي برتاح لهم وبثق في كلامهم وفي الخر الحكايه مش سلطه اي حد يقول اي حاجه ومافيش اي مشاكل ولا حد بقولله على اساس ايه انت عامل فيها مفتي<br />طبعا الكلام دا كله للي بيفتي اما اللي بيطلب من الناس ذكر الله او بيفكرهم بشئ في الدين فدا شئ مش غلط ونشكرهم عليه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123211/http://www.20at.com/article2.php?sid=473"

