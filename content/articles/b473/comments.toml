[[comments]]
order = 13
subject = "طريق الثواب"
author = "هاجر عبد الرحمن"
posted = "2006-02-22"
text = "طريق الثواب فى اى مواصله هو الطريق الصحيح فكيف ناخذه .اذا كنا فى مواصلة فهل تريد ان تكسب ثواب ؟اكيد طبعا حاول و انت تركب اى مواصلة منجذب انتباه الناس حولك ببشاشه وجهك وصدقتك بالابتسامة للجميع بل تكلم مع احد من الراكبين ثم قل له دعاء الركوب وذكره به ثم قم بكل ثقة وقل يا جماعة اللى ما قالش دعاء الركوب ياريت يقوله وتقلهم عليه ويرددوه وراءك واذا كان عندك الثقة بنفسك لتقول درس بسيط وممتاكد منه قل ولا تترددفهناك الكثيرين المحتاجين لهذه المعلومات . اما بالنسبه للذين لا يثقون بهذا الكلام استمع اليه ثم اسال احد تعرفه وتثق فى به فى امور الدين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123211/http://www.20at.com/article2.php?sid=473"

