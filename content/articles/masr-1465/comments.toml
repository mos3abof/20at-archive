posted = "2007-01-19"
text = "بسم الله الرحمن الرحيم معلش يا اخونا انا هتكلم برة الموضوع بعد اذان حضرتكم بلا ش الا لفاظ الخا جة عن نطاق الا دب مهما كان المو ضصوع لانى من يتقى الله يجعل لهو مخرجا وجادلهم با لتى هى احسن لانى ملا حظ فية الفاظ مش حلوة ودة خوار واحنا بنطلع الى جونا بس فى حدود الا دب الا سلامىوشكرا واسف مش هعلق على المو ضوع لا نى كارة هذا الرجل وحسبى ربى"
