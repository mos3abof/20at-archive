[[comments]]
order = 6
subject = "الرئيس راجل محترم"
author = "احمد خلاف"
posted = "2007-01-19"
text = "ارجو الا تتضايقوا من رايي<br />الرئيس راجل محترم وكفاية انه صاحب الضربة الجوية على اسرائيل<br />وكل ماالرئيس كبر في العمر بتزداد خبرته اكثر وكله لمصلحة مصر وان شاء الله بعد عمر طويل ياتي ابنه جمال وهو مكتسب خبرة والده التي لم يعط سرها إلا لابنه<br />وكفاية ابتسامة الريس وحنان ماما سوزان<br />وصدقوني مافي احسن منهم لان مفييش في مصر امثال هؤلاء الناس وشكرا لهم على قبول حكم مصر"
archived = "2007-01-21"
capture_url = "https://web.archive.org/web/20070121231306/http://masr.20at.com:80/article.php?sid=1465"

[[comments]]
order = 7
subject = "الحمد للة"
author = "خلف خلاف"
posted = "2007-01-20"
text = "الخير مالى الدنيا فى بر مصر<br />ومن كتر الفلوس - الناس مش عارفة تصرفها فين وازاى<br />وكل واحد عندة شغل والخزينة مستفة فلوس والحكومة الرشيدة محتارة تودى الفلوس دى فين لدرجة ان البنك المركزى رفض ياخد فلوس تانى لانة معندوش حتة يحطهم فيها<br />الحمد للة الوجوة مبتسمة<br />والاشية معدن<br />والحكومة بتفرق فلوس على الناس وبتوزع عليهم فراخ مشوية وببلاش<br />عايزين اية تانى<br />دة يبقى كفر بالنعمة<br />ياامة ضحكت من جهلها الامم"
archived = "2007-01-21"
capture_url = "https://web.archive.org/web/20070121231306/http://masr.20at.com:80/article.php?sid=1465"

[[comments]]
order = 8
subject = "شيلوا الصورة الوسخة دى"
author = "أولاً الرئيس ده غير شرعى يعنى محدش يقول عليه رئيس لإنه مزور الإنتخابات وجاء للحكم بدون ترشيح من الشعب يبقى سقط عنه لقب الرئيس وحيث كده يبقى وجوده غير شرعى يعنى إزعاجة مش واجب وبس ده طرده هو الواجب الحقيقى لتطهير مصر من فساده"
posted = "2007-01-20"
text = "راجل عنده 82 سنة ونهب وباع مصر ويزور ويحمى الفاسدين المحنطين مثلة يبقى ده رئيس<br />راجل يعتقل كل يوم من الأخوان ومن كفاءات شباب مصر بالعشرات يبقى ده راجل قلبة على الشعب<br />راجل نهب مصر شوفوا رصيده يوم لما مسك الحكم كان كام ورصيده دلوقتى كام<br />جاب إبنه موظف البنك الكحيان علشان يخليه رئيس للجنة السياسات وعايز يورثه الحكم هو فاكر نفسه بيحكم زريبة دى بلد كان ليها قياده بين الدول خلاها فى الوحل<br />الراجل ده وجوده أصبح خطر على مصر ولا بد من الحجر عليه بعد تصريحاته التى تسبب لينا الغثيان من قرفها<br />إحنا مستنيين إيه يمكن فاكرين ها يجيبوا لينا شعب يحارب لنا ويطرد العميل ده بره لازم الشعب كله يخرج ويرفض ويعتصم الوضع فى مصر أصبح لا يطاق ولا يحتمل الصبر أكثر من كده<br />الزرع وسرطنوه والهواء وملوه غبار ذرى من تجارب ذرية وبيقولو سحابة سودا<br />البلد ونهبوها وباعو مصانعها وشركاتها وطردوا العمال فاضل إيه فى مصر بعد كده<br />طرد مبارك واجب على كل مصرى يخاب على عرضه وشرفه"
archived = "2007-01-21"
capture_url = "https://web.archive.org/web/20070121231306/http://masr.20at.com:80/article.php?sid=1465"

[[comments]]
order = 9
subject = "لا للفقر..لاللبطالة..لا لقانون الوظيفة العامة الجديد"
author = "بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-01-20"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو السيلة الوحيدة للتوظيف<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />من الاخر ياناس ده قانون ظالم وسيهدم اركان المجتمع الذي يقوم علي الاستقرار الي مجتمع يقوم علي التعاقد المؤقت, والسكن المؤقت,والطعام المؤقت ثم الي الشارع انت واسرتك ايه الموظف المسكين."
archived = "2007-01-21"
capture_url = "https://web.archive.org/web/20070121231306/http://masr.20at.com:80/article.php?sid=1465"
