subject = "مجرد سؤاال برىء"
author = "احمدابوصالح_صحفى معارض"
posted = "2007-01-19"
text = "نسفى اسائل سؤاال هو مين الوصل مصر للاحنا فية الان من بطالة وسؤء اوضاع معيشية ومرتبات لاتغنى ولا تثمن من جوع ومن رشاوى فى كل مكان على عينك يا تاجر ومين ومين ومين ياريت حد يجوبنى<br />واقول للصاحب الموضوع الاول (بدون تعليق) مش لما قيدتنا تحترمنا الاول نبقى احنا كمان نحترمها وبطلوا جهل بقا<br />وحسبنا اللة ونعم الوكيل"
archived = "2007-01-21"
capture_url = "https://web.archive.org/web/20070121231306/http://masr.20at.com:80/article.php?sid=1465"

