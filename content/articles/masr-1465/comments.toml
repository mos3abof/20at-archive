[[comments]]
order = 1
subject = "الماركسيون والديمقراطيه"
author = "ايمن امام"
posted = "2007-01-18"
text = "الى الرفيق/ عبدلوف<br />لااعتقد ان اصحاب الفكر الماركسى لهم مجرد الحق ان يناقشوا - هذا الموضوع لانهم لايؤمنون بها- كذلك لانهم قله تعد على اصابع اليد الواحده - فرضها النظام الحاكم علينا- وفرضتها سياسه وزاره الثقافه فى شروط غير مكتوبه للتعيين والارتزاق من الوظيفه الحكوميه- من انت - انتم لستم منا ولا تشكلوا شيئا فى وجدان بلد الازهر الشريف- نعم الاسلام هو الحل- واذا كنتم انتم وغيركم ترفضون هذا الشعار- فلتلزموا المملكه العربيه السعوديه - بتغيير علمها - ولتلزموا النرويج والسويد وغيرها بتغيير شعار العلم - ولتلزموا اسرائيل بتغيير شعار العلم- لاتحاول ان تدعى انك تحترم الصعود السياسى للاخوان - فهذا وضع طبيعى - وانا لااراه صعودا بل تقريرا لحقيقه غيبت بفعل فاعل- وبالقمع والسجون- يكفيهم فخرا الان - وهم اهله- الوساطه بين حماس وحركه فتح- لو اردتم خيرا بهذا البلد حقا لانتهجتم نهجها- اذا ما كنت تريد ان تقول للقراء انك تحترم السيطره الكاسحه للاخوان على الحياه السياسيه فى مصر لانهم يستمدون شرعيتهم من الشعب المصرى0000 فلتقل لنا ولتفسر لنا مقفكم المخزى من الاخوان عندما حاولوا ان يشكلوا تجمعا للقوه الوطنيه - وجاملوكم واعتبروكم من هذه القوى- ايمن امام"
archived = "2007-01-21"
capture_url = "https://web.archive.org/web/20070121231306/http://masr.20at.com:80/article.php?sid=1465"

