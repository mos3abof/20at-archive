author = "dr mony"
posted = "2008-06-22"
text = "و الله حراااااااااااام عليكم<br />انتم بتظلموا اطباء الاسنان …<br />أنا طالبة ف الفرقة التانية … كليتنا كلية دمار شامل حقيقى<br />عندنا كم الامتحانات العملى و النظرى … تقييم سئ<br />عدم احترام من استاذتنا …<br />بعد 6 سنين شقا<br />نطلع عشان نبدأ بقى نكون نفسنا كاسم و عياده<br />صدقونى دكااااترة الاسنان غلاااابه"
archived = "2009-09-14"
capture_url = "https://web.archive.org/web/20090914150351/http://www.20at.com:80/masr/t7kyk/9326.html"

