author = "واحد"
posted = "2008-06-14"
text = "الا ما رحم ربى<br />مين اللى بيراقب العيادات دى - كلة على الورق جميل - هل يلتزم الاطباء بتعقيم الادوات ؟<br />قلة منهم ملتزمة<br />والباقى كلة عايز يعلى بالعمارة<br />الطالب بيدخل الطب علشان يحقق 7 حاجات تبدأ بحرف العين<br />عيادة<br />عربية<br />عروسة<br />عمارة<br />عزبة والباقى مش فاكرة واسألوا اى طالب فى اولى طب<br />الطب عندنا تجارة وبيزنس وجمع فلوس وليس مهنة انسانية<br />علشان كدة سمعة اطبائنا فى الدول العربية فى الحضيض<br />وعالميا فى امريكا غير معترف ببكالوريوس الطب المصرى ولازم يعمل امتحان معادلة"
archived = "2009-09-14"
capture_url = "https://web.archive.org/web/20090914150351/http://www.20at.com:80/masr/t7kyk/9326.html"

[[comments]]
