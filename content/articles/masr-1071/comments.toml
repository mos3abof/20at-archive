[[comments]]
order = 3
subject = "حمدوف متغاظ ليه"
author = "ايمن امام"
posted = "2006-10-19"
text = "تانى انتا برضه ياحمدوف مالك ومال هذا الشيخ الذى لم اشرف بالاستماع اليه - اليس هذا المزاد مثل المزاد الذى تمارسونه انت ومن هم على شاكلتك - اليس هذا المزاد قصد به خيرا - ماذا نفعل مع رجل يصاب بالحكه كلما رأى اى مظهر ينمى الشعور بالتضامن مع الشعوب الاسلاميه المقهوره - هل تريد ياحمدوف ان يتم اعتقال هذا الشيخ وارساله الى جوانتانامو - وتكون انت بذلك قد ارشدت اسيادك عن شخص يساعد الاخوه فى فلسطين ويتحدى الحصار المفروض عليهم - ياعم طهر قلبك واغسل خطاياك وابعد عن كل الرموز الدينيه فى البلد وممكن تنتقض مثلا ليلى علوى فى مسلسل تكون يسرا موصياك تنتقضه - او تنتقض رقصه لفيفى عبده او اغنيه لشعبان عبد الرحيم - - دا كبيرك ياحمدوف وان شاء الله اشوف فيك يوم انت وامثالك - جاتكو القرف مليتوا البلد بعوائكم رغم قلتكم ولكن لانكم تملكون الاعلام - وربنا يكرمك كده ذى ما كرم روك هادسون عارفه طبعا ياحمدوف وكفايه كده احنا فى رمضان - ولا ما تفرقش معاك انتا كده كده فاطر لعذر شرعى -/ ايمن امام"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

[[comments]]
order = 4
subject = "الى أيمن امام"
author = "معاذ محمود عامر"
posted = "2006-10-20"
text = "بصراحة نفسي أبقى متحضر وألتزم بآداب الحوار في الرد عليك بس بصراحة مش قادر أوقف شهوة السخرية عندي ناحيتك انت بالذات<br />مش عارف انت واخد موقف ليه من الأستاذ حمدي رزق<br />نفترض انك غير متفق معاه بس أسلوبك لا يصح ونقدك غير موضوعي<br />كمان الكلام اللي هو كتبه لا يختلف اثنان على انها مسخرة أن يحدث مزاد على جلابية الشيخ وطاقيته<br />بس في نقطة كمان عشان مش عارف أمسك نفسي عن التريقة<br />لما سيادتك تبقى عارف كلمة نقد بتتكتب ازاي ابقى تعال انقد الأستاذ حمدي رزق<br />لكن طول ما انت بتكتبها بالضاد يعني نقض يبقى تقعد في بيتكو أحسن<br />اسمه نقد بالدال<br />نقد ينقد نقدا فهو ناقد وهي ناقدة<br />ومنها أيضا<br />انتقد ينتقد انتقادا فهو منتقد وهي منتقدة<br />اتفقنا يا حبيبي"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

[[comments]]
order = 5
subject = "انة محفوظ عجب 2006"
author = "ذكى الدبور"
posted = "2006-10-20"
text = "حتى لو خلع حمدى رزق ملابسة قطعة قطعة فالن يكون رئيس تحرير (المصور) فى يوم من الايام.<br />وحقدة على نجاح محمود سعد مصر كلها عارفاة ,حمدى فاكر بكلامة دة جمال مبارك هاياخد بالة منة و يكرر غلطتة فى عبداللة كمال.<br />مين يصدق انة حمدى رزق مابيعرفش انجليزى نهائيا.<br />طب ياسى حمدى لما دماغك وقلمك على هذا المستوى لبة مجلتك افشل مجلة فى التوزيع فى مصر قبل مكرم وبعد مكرم.<br />وكمان انت لا تخجل من سبوبتك فى التليفزيون (هو فية اية),يااخى عيب عليك هاتقول ابنك اية لما يكبر (ابوك محصلش حتى محفوظ عجب)"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

