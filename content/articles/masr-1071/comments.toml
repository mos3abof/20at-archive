order = 0
subject = "شئ مستفز"
author = "معاذ"
posted = "2006-10-19"
text = "طبعا حاجة كويسة ان الراجل يجمع تبرعات لفلسطين وللخير عموما بغض النظر عن اننا منعرفش هتروح ازاي ولا هتروح اساسا ولا لأ وأنا أرى أن جمع التبرعات في المسجد حاجة عادية وكويسة كمان<br />بس المسخرة الحقيقية ان فضيلة مولانا الشيخ رضي الله عنه وأرضاه يعمل مزاد على جلابيته المبروكة وطاقيته السحرية المعجونة بمية الايمان<br />دي بقى المسخرة الحقيقية وفي لفظ خارج بيعبر عنها بس طبعا مش هقدر أقوله<br />سؤال خارج الموضوع ليه حاطين صورة أحمد رجب؟"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

[[comments]]
order = 1
subject = "يا عميل"
author = "العميل اللى كاتب المقال ده عايز يعادي الاسلام بأى صورة ومش عارف ووضحت أوى أوى لما شبه الشيخ ببهلوان..وهنا نسأله..انت سبق لك ورحت صلاة تراويح أصلا يا أستاذ عميل؟سبق لك ركعتها أساسا او دخلت مسجد أصلا؟يعني لو جمعنا تبرعات من بعض وبعتناها فلسطين يبقى غلط..ولو ما جمعناش تبرعات برضة غلطة..لو جمعنا يقولك تمويل..ولو مجمعناش يقولك الدعوة الاسلامية فشلت فى مصر لان الناس لسة بخيلة ومش عايزة تتصدق..يعني الناس تعمل اية؟عموما الغلط اصلا فى كلمة نعمل اية..احنا نعمل اللى القران والسنة قالوا عليه ولو كره المجرمون..والاسلام قادم قادم ولو كره الكافرون...والمسلمون قادمون قادمون ولو كره كل العملاء والخونة والجبناء."
posted = "2006-10-19"
text = "والحمد لله رب العالمين"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

