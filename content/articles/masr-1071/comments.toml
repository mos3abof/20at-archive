[[comments]]
order = 12
subject = "اتقوا الله"
author = "مهتمه"
posted = "2006-10-21"
text = "المقصود من بيع الجلابية انها مسألة رمزية للتشجيع على دفع التبرعات والذي اشتراها لم يشتريها لانها بركة او اي حاجة من الكلام الفارغ ده انما اغلب ظني انه سيحتفظ بها للذكرى ، اما الشيخ رجب فجزاه الله خيرا انه يحاول ان يبذل جهده في حدود الامكانيات المتاحة له لمساعدة اخواننا المحاصرون في فلسطين ولا يصح ان يكون جزاؤه الهجوم والاساءة<br />اما كاتب المقال فلا يستحق التعليق عليه واتمنى ان تكون النية وراء نشر مقاله هو اعطاء الفرصة للمخلصين انهم \"يهزأوه\" ، وغير كده لا يستحق ان يُقرأ له حرف ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

[[comments]]
order = 13
subject = "تلك دعوى كبيرة يا معاذ!"
author = "كاره الكذابين"
posted = "2006-10-21"
text = "ثكلتك أمك معاذ ما يصدق لك حديث الدهر كله، أعجمي لاتحسن مخارج الحروف العربية وتدعي مع ذلك أنك من صميم العرب، متوفق متبحر بلسانهم ولغتهم وآدابهم. خسأت وذللت، وإني لموضح للقراء كذبك وبهتانك ببرهان ساطع وميزان لايختل. فإن كنت تحسن شيئا من لغة الضاد، فسرت لنا هذة الأبيات:<br />دان مسف فويق الأرض هيدبه *** يكاد يدفعه من قام بالراح<br />ينزع جلد الحصى أجش مبترك *** كأنه فاحص أو لاعب داح<br />كأن ريقه لما علا شطبا *** أقراب أبلق ينفي الخيل رماح<br />فالتج أعلاه ثم ارتج أسفله *** وضاق ذرعا بحمل الماء منصاح<br />كأنما بين أعلاه وأسفله *** ريط منشرة أو ضوء مصباح<br />كأن فيه عشارا جلة شرفا *** شعثا لهاميم قد همت بإرشاح<br />بحا حناجرها هدلا مشافرها *** تسيم أولادها في قرقر ضاح<br />هبت جنوب بأولاه ومال به *** أعجاز مزن يسح الماء دلاح<br />فمن بنجوته كمن بمحفله *** والمستكن كمن يمشي بقرواح<br />فأصبح الروض والقيعان ممرعة *** من بين مرتفق فيه ومن طاح<br />ماذا يصف الشاعر هنا؟ هلا أخبرتنا يابن البوادي والقفار وسليل بيوت العرب؟"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

[[comments]]
order = 14
subject = "الى الشئ المسمى كاره الكذابين"
author = "معاذ محمود عامر"
posted = "2006-10-21"
text = "أيها الصديق الغير عزيز أنا لم أدع العلم ببواطن اللغة ولم أدع سبر أغوارها العميقة القاع وكل ما قلته للأخ امام:<br />(اسمه نقد بالدال<br />نقد ينقد نقدا فهو ناقد وهي ناقدة<br />ومنها أيضا<br />انتقد ينتقد انتقادا فهو منتقد وهي منتقدة)<br />لم أدع العلم وأي سطحي في اللغة العربية يعرف أن نقد بالدال وليست بالضاد<br />أما عن الأبيات التي أرسلتها فلا أدعي أني أفهمها وأتقن فهمها ولكن اللعب باللغة العربية سهل على كل من يفتح كتب العرب القدامى<br />واليك على سبيل المثال لا الحصر<br />أزج زلوج هزرفي زفازف<br />هزف يبذ الناجيات الصوافنا<br />ارتحت يا حبيبي<br />وملكش دعوة بيا وسيبني في حالي محدش طلب منك تعلمني اللغة يا امرأ القيس"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

[[comments]]
order = 15
subject = "حنانيك معاذ ولا تغضب"
author = "إبن العرب"
posted = "2006-10-22"
text = "يا سيد معاذ الراجل يداعبك مداعبة الإخوان، ولا أظنه يتعمد الإساءة اليك، وأمرؤ القيس تكتب هكذا، فلا يكن صدرك حرجا هكذا، حبذا لو إرتقى الحوار لمناقشة ومدارسة لغة العرب التي أكرمها الله سبحانه بأن أنزل فرقانه بلسانها.<br />وللأستاذ كاره أبياتك تصف السحاب الكثيف ذا المزن المنهمر، وهي مختلف عليها إن كانت لعبيد الله بن الأبرص أو لإمرؤ القيس:<br />ودع لميس وداع الصارم اللاحي *** إذ فنكت في فساد بعد إصلاح<br />إذ تستبيك بمصقول عوارضه *** حمش اللثات عذاب غير مملاح<br />وقد لهوت بمثل الرئم آنسة *** تصبي الحليم عروب غير مكلاح<br />كأن ريقتها بعد الكرى اغتبقت *** من ماء أصهب في الحانوت نضاح<br />أو من معتقة ورهاء نشوتها *** أو من أنابيب رمان وتفاح<br />هبت تلوم وليست ساعة اللاحي *** هلا انتظرت بهذا اللوم إصباحي<br />قاتلها الله تلحاني وقد علمت *** أني لنفسي إفسادي وإصلاحي<br />إن أشرب الخمر أو أرزأ لها ثمنا *** فلا محالة يوما أنني صاحي<br />ولا محالة من قبر بمحنية *** وكفن كسراة الثور وضاح<br />دع العجوزين لا تسمع لقيلهما *** واعمد إلى سيد في الحي جحجاح<br />كان الشباب يلهينا ويعجبنا *** فما وهبنا ولا بعنا بأرباح<br />إني أرقت ولم تأرق معي صاحي *** لمستكف بعيد النوم لواح<br />قد نمت عني وبات البرق يسهرني *** كما استضاء يهودي بمصباح<br />يا من لبرق أبيت الليل أرقبه *** في عارض كمضيء الصبح لماح<br />دان مسف فويق الأرض هيدبه *** يكاد يدفعه من قام بالراح<br />كأن ريقته لما علا شطبا<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

