text = "الاخ معاز محمود عامر -- انت مبدئك فى الحياه (خالف تعرف) مره تدافع باستماته عن المخرف المدعو جمال البنا وفتواه العبيطه باباحة التدخين فى نهار رمضان ومره تؤيد فتواه بعدم فرضية الحجاب فى الاسلام -- ودلوقت بتتريق على راجل اخذته الحميه على دينه ورد على كاتب سافل اراد ان يجعل من احد ائمة المساجد مثارا لسخرية القراء ؟ سبحان الله ؟ بدل ماترد على واحد استهزء بما فعله المصلون وامامهم لنصرة اخوانهم المستضعفين-- تاعب نفسك وبترد على راجل اخطا فى كتابة حرف -- واضح انك رايق"
