text = "مش عارف انا مين قليل الادب اللي كتب المقالة دي ..<br />بقى كل التريقة ووساخة اللسان دي ..وبعدين تيجي تقول انا اللي يهمني مدى شرعية لم التبرعات في المسجد ؟؟<br />طاب ما هي شرعية التريقة على الشيوخ ..؟؟<br />طاقية مسحورة ايه يا عبيط منك له ..<br />الشيخ رجب قليل ذات اليد .. و اللي بيحبوه كتير ..<br />فحب يوجه هذا الحب لله ..<br />حب يستغل حب الناس لمساعدة الفلسطينيين ..<br />ايه الضرر ؟؟<br />ايه الجريمة ..<br />ولا هي قلة ادب وخلاص ..<br />http://eldeebs.blogspot.com"
