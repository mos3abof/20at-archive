[[comments]]
order = 18
subject = "فعلا يا أخ أيمن عندك حق بخصوص المعزة دي"
author = "المعلم جلعص الدنانيري"
posted = "2006-10-23"
text = "الثابت بإجماع فقهاء وفتوات الجمالية وخان الخليلي والدرب الأحمر إن أم المعزة الملقبة روحها بمعاذ يهودية بلانة غسالة دلالة وبتشتغل خاطبة وفاتحة مندل وودع، والمعلم فشة الجزار بيحلف بشرف الغالية أمه إنها ما تشتري منه غير السقط ولحمة الراس والكوارع يوم السبت بس، والأسطى فشلة البرادعي يؤكد إنه موصية على بردعين سواريه جداد نوفي للأبعد معزة معاذ للإحتفال بعيد الغفران.<br />فعايز حضرتك إيه يا أستاذ ايمن امام من معزة يهودية لا تحسن غير الضراط والمأمأة؟ سيب البهيم يهاتي ويجعر ويبعر."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

[[comments]]
order = 19
subject = "الإسلام دين إجبار وإجرام"
author = "ميمون مسعود عمرام- معاذ محمود عامر سابقا"
posted = "2006-10-23"
text = "تعبت منكم ومن قباحتكم ووعظكم وحقارتكم وجهلكم وغباوتكم يا مسلمين. ليه يارب ما خلقتنيش يهودي في غير بلاد العرب الجرب؟ مش كنت دلوقتي أدي أجعص جعيص في البلد الوسخة دي بالشلوط ولايهمني؟<br />غلطة أهلي أنا حأصلحها ومن النهارده أعلن إني يهودي بالعند فيكم يا ولاد الجزم."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

[[comments]]
order = 20
subject = "نبع واطى"
author = "نبوخذ نصر"
posted = "2006-10-24"
text = "ياميمون يابن الكلب ياخنزير انا عارف انك مش معاز لان معاز رغم اختلافنا معاه عارفين انه مسلم وانا عارف ان ده اول تعليق ليك علشان تولعها ياخسيس وفر على نفسك مش هننخدع ونشتم ونسب فى الراجل وانت قاعد تضحك فخليها تكلك ياكسمك يابن المغضوب عليهم يابن الضالين اولاد الافاعى احفاد القرده والخنازير"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

[[comments]]
order = 21
subject = "إبن المرة الوسخة معاز معزة ( نبوخذ نصراليهودي)"
author = "بقلظ حنفي الحذق"
posted = "2006-10-24"
text = "جهل أهلك بني إسرائيل أشهر من أن ينكره حد، ده حتى في كتابكم التوراة اللي بقالكم قرون بتحروفها على مزاج كس أمكم مذكور جهلكم وكذبكم وإنكاركم للحق وبهتانكم وقتلكم أنبياء الله ورميهم بأحط التهم وأقلها الزنا ببناتهم وأمهاتهم..كل ده معروف ولذلك إنكارك المتأخر لإعلانك الفاضح عن يهوديتك..من باب جبنكم وكذبكم المشهور.<br />لكن إن جهل كس أمك يتعدى لدرجة إنتحال شخص بتدعو إنه ظلمكم وساقكم عبيد للعراق وهدم معبدكم وحرق التوراة وقتل كل كهنة إسرائيل الليفيين، وما خلصكم منه السبي إلا كس إستير عشيقة الفارسي كورش، ده لايمكن أغفره لكس أمك معزة الضراطة الكبيرة..إنت جبان ووسخ ومنتحل يابن الجزمة والنعل يا معاز يابو طياز."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

[[comments]]
order = 22
subject = "ركز شويه يابقلظ"
author = "نبوخز نصر"
posted = "2006-10-24"
text = "ياعم بقلظ انت احول ولاايه اسم (نبوخز نصر ) انا استخدمته نكايه فى الملعون اللى اسمه ميمون وانتحل اسم معاز ابقى ركز شويه ياعم بقلظ الله يخليك لانى عارفك كويس من ايام ماكنت عجلاتى وحافظ اسلوبك فى التعبير (اليهودى اسمه ميمون مسعود عمرام"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"

[[comments]]
order = 23
subject = "متزعلش يا أخ نبوخز نصر"
author = "بقلظ حنفي الحذق"
posted = "2006-10-25"
text = "حقك عليا يا نبوخز نصر كنت فاكرك الملعون إياه وبتتريق على المسلمين. ميمون؟ ده منحوس ملعون نسل خنازير، معاز يقول اللي يعجبه يا بن الحمارة إحنا نخلص معاه، إطلع منها إنته واللي زيك وهي تعمر.<br />ويا أخ نبوخز نصر لا عمري كنت عجلاتي ولا إشتغلت الصنعة دي أصلا ولاحتى إقتنيت عجلة، موتورسبكل هارلي آه، تحياتي ليك وكل سنة وإنت طيب والأمة الإسلامية كلها."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061932/http://masr.20at.com:80/article.php?sid=1071"
