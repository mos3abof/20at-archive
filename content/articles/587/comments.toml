[[comments]]
order = 0
subject = "متكولش سمك و بيض"
author = "أكرم"
posted = "2006-02-08"
text = "ايه حكاية الاكل حد هيبقالوا نفس ياكل لما يعرف انه هيموت لو هيروح الجنة ان شاء الله هيبقا قرفان من اكل الدنيا النتنة و لو هيروح النار هيبقى يفكر في الزقوم و الذي منه و السلطات الجهنمية و ده هيسد نفسه طبعا<br />أنا عن نفسي مش هاكل و مش هعتكف برضوا<br />احكيلكوا موقف في مرة واحد صاحبي مبشوفوش كتير عدا عليا في الجامعه ايام شريط عمرو دياب انا عايش و مش عايش و قعد يكلمني عن رايوا في الكليب و بعدين عدا على صحابوا واحد واحد و قعد معاهم و اتكلم عن حاجات كتير بعدها بيومين مات موته ربنا ( الله يرحمه ) زي ما يكون عارف انه هيموت و عذرا للاطالة و النكد و مش عارف هي طلبت معايا بعياط ليه و السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112606/http://www.20at.com/article2.php?sid=408"

[[comments]]
order = 1
subject = "اللهم اوهبني الشهاده"
author = "احمد مامون"
posted = "2006-02-08"
text = "كل نفس زائقه الموت وما تدري نفس ماذا تكسب غدا وما تدري نفس بأي ارض تموت.<br />اللهم اني اسألك ان تجعل خاتمتي علي سجاده صلاه او علي محصف اقرء فيه .<br />اللهم امين .<br />بالله عليكم اسألكم الدعاء لي بالتثبيت وبحسن الخاتمه.<br />وجزاكم الله خير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112606/http://www.20at.com/article2.php?sid=408"

[[comments]]
order = 2
subject = "السلام عليكم"
author = "ثلاتينية متطفلة"
posted = "2006-02-17"
text = "من فضل الله علينا أننا لا نعرف ساعة الموت ولا يمكنني أن أتخيل ما يمكنني عمله فعلا. نسأل الله لنا ولأحبتنا حسن الخاتمة اللهم اجعل خير أعمالنا آخرها وخير أيامنا خواتيمهاوخير أيامنا وأسعدها يوم نلقاك فيه اللهم ارزقنا الثبات اللهم ارزقني شهادة في سبيلك آمين يا رب العالمين.<br />اللهم ارق أخانا أحمد مأمون الثبات وحسن الخاتمة آمين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112606/http://www.20at.com/article2.php?sid=408"

[[comments]]
order = 3
subject = "التعريف الصحيح"
author = "رندة"
posted = "2006-02-21"
text = "السلام عليكم ورحمة الله تعالى وبركاته .مرحبا بكم إخواني وأخواتي أنا فتاة من الجزائر عمري20 سنة قرأت كل ما كتبتوه عن الموت .وأريد أن ألفت إنتباهكم إلى شيئ مهم هو أن الله لم يخلقنا في هذه الدنيا عبثا نأكل ونشرب وننام ونلهو بالدنيا وننسى الشيء الحقيقي الذي خلقنا من أجله وهو العبادة التي إذا نظرنا إلى أنفسنانرىأننا بعيدون عن ذلك .وأرجو أن نفيق من الغيبوبة قبل فوات الأوان وبعد ذلك لن يفيدنا شيء وارجوا أن تتمعنو في كل شيء قلته."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112606/http://www.20at.com/article2.php?sid=408"

[[comments]]
order = 4
subject = "ياريت"
author = "هاسدد جميع ديون واطلب من كل شخص اسأت اليه انه يسامحنى وبالطبع هسامح كل الناس اللى غلطوا فيا وصلى كتير واتوب واستغفر ربنا واطلب من كل احبابى يدعو لى على طول واعمل صدقه جاريه"
posted = "2006-03-01"
text = "وياريت الوتحد يعرف هيموت امتى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112606/http://www.20at.com/article2.php?sid=408"

[[comments]]
order = 5
subject = "كـــــل نفس ذائــــقـة المـــوت"
author = "مهندس ديكور"
posted = "2006-03-03"
text = "الموت هو الحقيقه الوحيده فى الدنيا ولو انى تخيلت انى هموت بعد 24 ساعه اسدد ديونى واخرج كل ما معى من اموال للفقراء واتبرع بكل هدومى حتى اللى لابسها واستلف هدوم اخويا واصل الرحم مع كل اقاربى واصدقائى ومعافى واظل اصلى واستغفر الله على ذنوبى واردد الشهاده حتى الموت<br />الرجـــــاء الدعاء للمسلمين كلهم احياء واموات بالرحمه من عذاب القبر والثبات عند السؤال فى القبر وان يدخلنا الله الجنه نحن وسائر المسلمين ....<br />أمين أمين يا رب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112606/http://www.20at.com/article2.php?sid=408"

