subject = "هاذم اللذات"
author = "رفيقة الدرب"
posted = "2006-06-18"
text = "مرحبا انا من السعودية باقول: لو اي واحد سألني وقالي:::كيف تبغي يكون اخر يوم بحياتك؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />حجاوبو:::::اني بإذن الله حخليه كلو طاعة..<br />أما اكل وشرب واشياء مالأمها داعي ...<br />لأ وألف لا...ليش؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />لأني والله أقضي حتى اخر عمري كدة ليش؟؟؟؟؟؟<br />بسراحة غبي اللي بيقول كدة...........ويلا تصبحوا على خير.................."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112606/http://www.20at.com/article2.php?sid=408"

[[comments]]
order = 8
subject = "المشكله انك نسيت المشكله"
author = "احمد سويدان"
posted = "2006-06-18"
text = "قول الحمد لله اني حخلص من اول جريمه ما اخترتهاش بنفسي وهي اني مصري الجنسيه عايش في وسط وطن محتاج انه يتباع في المزاد العلني و الغريبه ان لو حد اشتراه حيلاقي فيه اللي احنا مش لقينه في وطنا ده<br />تاني حاجه حطلب ان حد يشتري مني الجنسيه المصريه و ان شاء الله ابيعا بربع جنيه و اتبرع بيه لاقرب شحات الاقيه قدامي<br />للاسف هو ده اخر امنيه ليا قبل ما اموت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112606/http://www.20at.com/article2.php?sid=408"

[[comments]]
order = 9
subject = "هل سأدرك أنه آخر يوم؟؟"
author = "لميس"
posted = "2006-10-21"
text = "لكل إخوتي و أخواتي الذين شاركوا بطرح أجوبتهم وآرائهم حول آخر يوم،أود أن أقول لهم لن يدرك أي منا حينها أن هذا آخر يوم له،سيعيش كل منا حياته بالصورة التي إعتادها،فكيف نحب أن يختم لنا؟تذكروا دائما أن الله معنا حيثما كنا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112606/http://www.20at.com/article2.php?sid=408"
