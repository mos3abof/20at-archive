subject = "عاشقة الجنان"
text = "كل من سيال عن ستار أكادمي سيقول<br />هم مجرد عيال ولاكن هذه البرامج (( ستار أكادمي , سوبر ستار ، بنات أكروكورديم )) كلها داعية إلي ماحرم الله والفواحش<br />والدنيا ماهي ناقصة مصايب<br />كفاية الظاهر والا لسا ما نعرفوا<br />والله يهدي من خلق<br />ويالله مع بعض نحمي امة محمد صلى الله عليه وسلم"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024125023/http://www.20at.com:80/article.php?sid=227"
