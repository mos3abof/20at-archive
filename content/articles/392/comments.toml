subject = "روح اجري من هنا يا بتاع أخطاء الاستاذ عمرو"
text = "كلامك كله مردرد عليك يا حبيبي<br />وأستاذنا عمرو خالد<br />على عكس ماانت بتقول<br />روح شوف صناع الحياة وبطل الفشر بتاعك ده<br />وعلى فكرة دي احد الطرق المؤدية للشهرة<br />أنك تعارض راحد مشهور<br />ربنا يهديك يا حبيبي<br />ويعقلك<br />يارب<br />يارب"
