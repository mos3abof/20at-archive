[[comments]]
order = 4
subject = "لماذا؟"
text = "لماذا السخرية من كاتب المقال؟<br />ولماذا اعتدنا التسفيه من شأن كل من يحاول أن يفهم؟<br />وبالفعل أرى فيما كتبه ما يستحق الالتفات، في محاولة لتوصيف أو رسم صورة لما نرله في المجتمع المصري الذي يواصل منذ أعوام مفاجآته المتمثلة في ظواهر ترتكز على تقنيات جديدة: المحمول، الانترنت رداً على قهر السلطة للجميع.<br />أرجوكم بدلأ من قهر بعضنا البعض بالسخرية والتعليقات غير المحسوبة التي تعكس عدواناً مكبوتاً، اشكروا الراصد لظواهر المجتمع ودعونا نفكر إلى أين يمضي بنا الزمن..<br />التي تخجل من كتابة اسمها<br />آمال"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024125023/http://www.20at.com:80/article.php?sid=227"

