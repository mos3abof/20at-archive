author = "بيتفرج على الماتش"
posted = "2009-09-06"
text = "سيادتة كان بيتفرج على الماتش والصخرة بتفعص الناس تحتها<br />وفية جثث لا زالت تحت الانقاض حتى يومنا هذا<br />ومصر كانت مشغولة بمشكلة العسكرى شاليط واللعيب ابو تريكة والناس بتتفعص تحت الصخرة زى الديدان<br />تاريخ اسود وايام اكثر سوادا<br />مصر لبست اللون الاسود حدادا على اربعة فلاحين اتشنقوا فى دنشواى<br />ومصر كانت بتتفرج على ابو تريكة ومشكلة شاليط لما غرق 1500 مصرى فى العبارة ووقعت صخرة الدويقة"
