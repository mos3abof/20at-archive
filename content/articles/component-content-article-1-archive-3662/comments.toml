subject = "عمرو خالد .. انا أحبه"
author = "shortcut"
posted = "2006-03-20"
text = "رب الكيبورد و الماوس ..<br />عمرو خالد شخص عزيز عليّ جدا ،<br />و كنت بأحضر له في مسجد الحصري لكن أنا مع رأي الدكتور فهمي هويدي ،<br />بس في نفس الوقت شعبية عمرو خالد ما قلتش خالص عندي ..<br />اللي زعلان عليه فعلا انقسام الناس كده (جبهة علماء و جبهة دعاة) على رأي أعز أصدقائي .."
