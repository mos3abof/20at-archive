text = "يعاني فلسطيني سورية من صعوبة السفر للعمل أو للدراسة كونهم يحملون وثائق سفر غير معترف بها من أغلب دول العالم ، كما أنهم لايتمتعون بشمولهم بإتفاقيات سورية مع دول أخرى حول إلغاء التأشيرة كما حدث مؤخرا بين تركيا وسورية من إلغاء تأشيرة الدخول بينهما ، كان من المفروض أن تشملهم هذه الإتفاقية كونهم حسب القانون السوري في حكم السوريين ، ولهذا فهم يرون أنفسهم مهمشين في موضوع تسهيلات السفر"
