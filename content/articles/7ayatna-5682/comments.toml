posted = "2007-05-01"
text = "حلو و جميل وجرئ .. وفي شفل صحافه كويس و وواضح ان فيه لمسه محترفين …<br />ده الكلام اللى بقولهولك كل مره … بس مع موضوع زى ده حرام على انى اقولك على حاجه زى ديه حلوه بس كده .. يبقى حرام علي .. لا ياعم الموضوع دع يستاهل انى اقول عليه<br />- مركز جدا جدا .. يعنى المعلومه .. التفاصيل .. التعليق النفسى .. راى الدين .. الموضوع خلص .. يعنى بجد انا اول مره الاقى نفسى اتسرقت كده \" الموضوع خلص من غير ما احس خالص<br />- الاسلوب بجد تحفه .. و ووضح قوى انك لم تتدخل فى كلام المصادر اللى جربت العروسه ديه يعنى حسيت ان كل واحد فعلا عرف يعبر عن نفسه<br />- اخيرا و ليس آخراً .. احنا هانفضل نتعلم منك الكتابه لامتى يا استاذ .. ربنا يباركلك ودايما كده تشدنا لقلمك"
