[[comments]]
order = 22
subject = ""
author = "الشيخ / عبد الرحمن بن محمد اله"
posted = "2009-03-12"
text = "الحمد لله والصلاة والسلام على رسول الله وعلى آله وصحبه، أما بعـد:<br />فاعلم أيها الأخ الكريم أن أي استمتاع جنسي بغير الاتصال المشروع بالزوجة أو الأمة الموطوءة بملك اليمين محرم شرعاً بأي وسيلة كان، وهو تعد لما أحل الله تعالى، واعتداء لقول الله تعالى: وَالَّذِينَ هُمْ لِفُرُوجِهِمْ حَافِظُونَ* إِلَّا عَلَى أَزْوَاجِهِمْ أوْ مَا مَلَكَتْ أَيْمَانُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ* فَمَنِ ابْتَغَى وَرَاء ذَلِكَ فَأُوْلَئِكَ هُمُ الْعَادُونَ {المؤمنون:5-6-7}.<br />وعليه؛ فهذه الدمى التي وصفتها بأنها جنسية، وأنها تقارب المرأة الحقيقية في الحجم والوزن والشعر والعين وجميع الأماكن والمواصفات المتعلقة بالمتعة الجنسية، لا يجوز اتخاذها لأي أحد سواء كان قادراً على الزواج أو غير قادر عليه، ولا يصح قياس شرائها على شراء الإماء في عصور الإسلام الأولى أو أي عصر آخر، لأنه قياس مع وجود الفارق.<br />وذلك لأن الأمة إنسان كامل له جسمه ودمه وروحه وعقله وعواطفه وسائر أوصاف الإنسانية، وهذه الدمى هي أجسام مطاطية، ومعلوم ما بينها وبين الإنسان الحقيقي من المنافاة.<br />والله أعلم.<br />a_alharfi@hotma il.com الشيخ / عبد الرحمن بن محمد الهرفي"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100522/http://www.20at.com:80/7ayatna/5682.html"
