subject = "زهور"
text = "رائع<br />نحن معكم يا عشرينات<br />الفكرة جديدة ورائعة<br />اللهم بارك لنا فيما تبقى من شعبان وبلغنا رمضان<br />وأعنا يا رب على ذكرك وشكرك وحسن عبادتك<br />في رمضان وفي غير رمضان"
