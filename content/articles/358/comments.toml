[[comments]]
order = 3
subject = "ابو اسكندر"
text = "والله زمان يارمضان .. هلت روايحه .. وقطايفه . .اتمنى ان نكثر فيه من الحلويات<br />والشربات .. لانه شهر اللذة والحلاوة كلها .. عارفين انا نفسي تبقى ايامنا كلها قطايف .. اقصد حلويات ..<br />اما الحلاوة اللي نفسي ندقها كلنا.. هية بجد .. حلاوة الطاعة ..<br />ايه رايكم لو خلينا رمضان من شهر نغرق فيه في صواني الحلويات ايه رايكم نخليه كله حلاوة لكنها معنوية نحسها في لذة وحلاوة وجمال القرب من الله"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018163302/http://www.20at.com:80/article.php?sid=645"

