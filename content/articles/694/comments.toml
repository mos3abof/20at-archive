text = "باالسعوديه تنظلم وتشوف الظلم باشد انواعه وذا بغيت تشكي خصمك وكان له منصب<br />يوصي عليك كل الدوائر بحكم منصبه كمسؤل<br />وثق فيه من قبل حكومة السعوديه والله ليتعب الواحد ونسمع فاتحين ابوابهم للي<br />يجيهم والله تعبنا ونظلمنا وكلنا تبن وماحنا قادرين نجي اي واحد فيهم ولا هم بمفكرين هاذا المواطن مظلوم ...اذا جت الطعه قالو حنا فاتحين ابوابنا بسي باالكلام ..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114141/http://www.20at.com/article2.php?sid=796"

