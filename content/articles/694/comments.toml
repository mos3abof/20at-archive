subject = "حتى لا تكون الواسطة (داء) يضر بالمجتمع!"
author = "د. عبداللّه بن برجس الدوسري"
posted = "2006-05-13"
text = "الواسطة أو المحسوبية وتسمى الشفاعة في المصطلح الشرعي، وهي: طلب العون من الغير لجلب منفعة أو دفع مضرة، والناس فيها طرفان ووسط، فصنف يمقتها ويرفضها جملة وتفصيلاً ويعتبرها من جملة الفساد الإداري الذي يجب أن يعاقب عليه القانون.<br />وصنف يقبل الواسطة في كل شيء بعجرها وبجرها، فهو يَشفع ويُشفع في كل ما يطلب منه ولو كان على حساب المصلحة العامة أو الخاصة، ولو أدى تطبيقها إلى ضرر خاص أو عام، وكلا طرفي قصد الأمور ذميم، فالصنف الأول مع مقته لها لم يسلم من استعمالها شعر أو لم يشعر، حتى ولو رفضها ومقتها في حال أو زمان معينين، بل إن كثيراً من هؤلاء هم أول من يستعملها إذا استدعى الأمر، ولسان حالهم:<br />وإن لم يكن إلا الأسنة مركباً<br />فما حيلة المضطر إلا ركوبها<br />وأما الصنف الآخرفمخطئ بلا شك لأنه ضرب بالأنظمة عرض الحائط، وأضر بالآخرين وهضم حقوقهم، بل ربما توسع فيها إلى درجة التكسب من ورائها كسباً مالياً أو معنوياً، وحينئذ يقع فيما هو أكبر وأشنع وهي الرشوة، إضافة إلى الشفاعة السيئة.<br />وهذا الصنف هو الذي سود صورة الواسطة ودنس سمعتها وجعل الناس يتذمرون من المحسوبيات ويكيلون التهم على الواسطة والوسطاء.<br />إن أصل الشفاعة الحسنة والواسطة المقبولة هي جلب مصلحة للمشفوع له أودفع ضرر عنه: تساعد محتاجاً أو تعرف به وتزكيه وتدعم طلبه عند من يعرفك ويقدرك ولا يعرفه، تفرج كربة مكروب وترفع الضرر أو الظلم عنه، وهي بهذا المعنى لا يشك عاقل أنها من قبيل الشفاعة الحسنة التي يثاب فاعلها ويجازى من يسعى فيها، إذا صلحت نيته وصفت سريرته وكان يرجو ما عند اللّه - عزّ وجل - ولكن بشروط وضوابط سيأتي بيانها.<br />ويشهد لما ذكرته آنفا جملة من النصوص الصحيحة الصريحة كقوله تعالى {من يشفع شفاعة حسنة يكن له نصيب منها، ومن يشفع شفاعة سيئة يكن له كفل منها وكان اللّه على كل شيء مقيتا}.<br />وعن أبي موسى - رضي اللّه عنه - عن النبي صلى اللّه عليه وسلم - أنه كان إذا أتاه السائل أو صاحب حاجة قال «اشفعوا فلتؤجروا ويقضي اللّه على لسان رسوله ما شاء» متفق عليه، وعن ابن عمر - رضي اللّه عنهما - أن رسول اللّه صلى اللّه عليه وسلم قال «ولأن أمشي في حاجة أخي حتى أثبتها أحب إلي من أن أعتكف في هذا المسجد شهراً» (يعني مسجد المدينة) أخرجه الطبراني وغيره وصححه الألباني.<br />ولما ذكر بن القيم - رحمه اللّه - أقسام الجود والكرم ذكر: جود الرجل بجاهه، والعرب تقول: أبخل الناس من بخل بجاهه.<br />قال الشاعر:<br />وأحسن الناس بين الورى رجل<br />تقضى على يده للناس حاجات<br />وكي تكون الشفاعة من هذا النوع فلا بد لها من شروط وضوابط تجب مراعاتها واعتبارها:<br />الشرط الأول: أن يكون المشفوع له أهلاً للشفاعة، بمعنى أن يكون كفواً لما شفع له فيه، وهذا يكون في كل شيء بحسبه، فمجال التعليم يختلف عن الطب عن الفتيا وهكذا، والمنصب الكبير يختلف عن الوظيفة العادية التي ربما يصلح لها كل أحد، وقد جاء في الحديث الصحيح عن رسول اللّه صلى اللّه عليه وسلم أنه قال «من ولي من أمر المسلمين شيئاً فولى رجلاً وهو يجد من هو أصلح للمسلمين منه فقد خان اللّه ورسوله»<br />وفي رواية «فقد خان اللّه ورسوله وخان المؤمنين» رواه الحاكم وصححه، وعليه فلا يزوغ شرع فضلاً عن العرف والأخلاق أن يعين شخص في منصب وفي الأمة من هو خير منه، وإذا حصل ذلك فهو خيانة للّه ولرسوله وللأمة جمعاء.<br />ومع هذا فإن تولية الأصلح فالأصلح خاضع للاجتهاد البشري، يقول شيخ الإسلام ابن تيمية - رحمه اللّه - (فإذا فعل ذلك بعد الاجتهاد التام فقد أدى الأمانة وقام بالواجب، وصار في هذا الموضع من أئمة العدل والمقسطين عند اللّه تعالى، قال - عزّ وجل - {فاتقوا اللّه ما استطعتم}وقال رسول اللّه صلى اللّه عليه وسلم «إذا أمرتكم بأمر فأتوا منه ما استطعتم» اخرجاه في الصحيحين أ.ه من كتاب السياسة الشرعية.<br />الشرط الثاني: أن تكون الشفاعة في شيء مباح، والمباح لا حصر له، بل الأصل في الأشياء الإباحة كما في القاعدة الفقهية، أما إذا كانت في محرم يترتب عليها ظلم لأحد أو بخس أو ضياع حق فهذا لاشك في حرمته، ومثل ذلك كذلك الشفاعة عند بلوغ الحدود السلطان فيشفع لأناس وجب عليهم الحد أن لا يقام عليهم فهذا من الضلال المبين وصاحبه مأزور غير مأجور، بل هو مستحق للعنة والمقت على لسان رسول اللّه صلى اللّه عليه وسلم قال تعالى {وتعاونوا على البر والتقوى ولا تعاونوا على الإثم والعدوان} وفي الحديث عن عائشة أم المؤمنين - رضي اللّه عنها - «أن قريشاً أهمهم شأن المرأة المخزومية التي سرقت فقالوا من يكلم رسول اللّه صلى اللّه عليه وسلم؟ فقالوا: من يجترئ عليه إلا أسامة بن زيد حب رسول اللّه صلى اللّه عليه وسلم - فكلمه أسامة فقال له الرسول صلى اللّه عليه وسلم: (أتشفع في حد من حدود اللّه)؟ثم قام رسول اللّه صلى اللّه عليه وسلم فاختطب فقال: (يا أيها الناس إنما أهلك الذين من قبلكم أنهم كانوا إذا سرق فيهم الشريف تركوه وإذا سرق فيهم الضعيف أقاموا عليه الحد، وأيم اللّه لو أن فاطمة بنت محمد سرقت لقطعت يدها) رواه البخاري ومسلم.<br />وعن صفوان بن أمية أنه كان نائماً، قال فجاء سارق فأخذ ثوبي من تحت رأسي فأدركته فأتيت به النبي صلى اللّه عليه وسلم فقلت إن هذا سرق ثوبي فأمر به أن يقطع فقلت يا رسول اللّه ليس هذا أردت هو عليه صدقة فقال (هلا قبل أن تأتيني به) رواه النسائي وأحمد وغيرهما وصححه الألباني.<br />ومثل السلطان نواب السلطان وهم امراء المناطق والمحافظات والمراكز فهؤلاء لا يجوز لهم أن يشفعوا في الحدود وهي التي نص فيها على تقدير العقوبة كالخمر والسرقة والفاحشة (الزنا)، وأما ما سوى الحدود كالقصاص والاعتداء على مادون النفس فتجوز الشفاعة فيه بضوابط معينة ومنها:<br />1) الشفاعة والتوسط لشخص من أهل السوابق ممن تأصل الإجرام في نفسه، وقد سمعنا عن حالات شفع فيها لشخص محكوم عليه بالقصاص فلما خرج من سجنه اعتدى على آخر فقتله، وللأسف أن هذا يقع فيه بعض أمراء القبائل والأعيان والوجهاء والتجار بل وبعض طلبة العلم والمشايخ، وفي هذا كما لا يخفى معاونة على الإثم والعدوان وتعريض للأرواح البريئة للخطر من أناس تأصل الإجرام في نفوسهم أو أشربت قلوبهم بسموم المخدرات والمسكرات، ولا شك أن الجسم إذا تعرض بعض أعضائه للتلف وقرر الأطباء بترذلك العضو للمصلحة فإن السلامة تكون في بتره مع احتمال وجود مصلحة في بقائه، وكذلك هنا لأن «درء المفاسد مقدم على جلب المصالح «كما هي القاعدة الفقهية» وإذا اجتمعت مفسدتان وجب ارتكاب أخفهما ضرراً كما في القاعدة الأخرى.<br />2) طلب أموال باهضة عند الصلح على الدماء تصل إلى حد الملايين في كثير من الأحيان، وهذا فيه إجحاف بأصحاب الحق، وقد يلجؤهم إلى سؤال الناس وسفح ماء الوجه والمهانة.<br />3) قبول الشفاعة والرضوخ للمطالب تحت وطأة الضغوط النفسية والحرج الشديد، فقد يتعرض عند عدم قبول شفاعة الشافعين (الجاهية) إلى الهجر والقطيعة وربما التهديد الحسي والمعنوي.<br />4) إهانة النفس وإذلالها من قبل الشفعاء (الجاهية) في بعض الأحيان، كعقل الأرجل وتكبيل الأيدي والزحف على الأرض وغيرها مما لا يخفى.<br />5) اختصاص الرجال أو الولي بمال الصلح وحرمان بقية أصحاب الحق وخاصة النساء وهذا من عمل الجاهلية الأولى.<br />6) الإسراف والتبذير خلال مراسم الشفاعة، إلى غير ذلك مما يطول بيانه.<br />ومما يستوجب التنبيه ما يقع فيه بعض الإخوة الساعين في الصلح بالشفاعة لمنتهكي الأعراض (الزنا واللواط والاغتصاب) وغيرها من صور الفساد في الأرض، وهذا جهل منهم، فإن أصحاب تلك الجرائم يجب أن ينالوا جزاءهم الدنيوي تاماً غير منقوص - ولا كرامة - وأما في الآخرة فأمرهم إلى اللّه.<br />الشرط الثالث: ألا يترتب على الشفاعة حرمان المستحق من حقه أو تقديم المفضول على الفاضل، فإن كانت كذلك فهي من قبيل الشفاعة السيئة التي جاء النص القرآني بمقتها {ومن يشفع شفاعة سيئة يكن له كفل منها وكان اللّه على كل شيء مقيتا}.<br />وللأسف فإن أكثر ما يحدث في مجتمعنا يكون من هذا القبيل، وهو نتاج محسوبيات قائمة على أساس طائفي أو مذهبي أو قبلي أو نحو ذلك.<br />وأخيراً: فينبغي للمشفوع له أن يتعلق قلبه باللّه، وأن يفوض أمره إليه، وأن يتوكل عليه في جميع شؤونه، فإن من توكل عليه كفاه {ومن يتوكل على اللّه فهو حسبه}.<br />والبشر إنما هم أسباب يتوصل بهم، ومع هذا «فلو اجتمعوا على أن ينفعوك بشيء لم ينفعوك إلا بشيء قد كتبه اللّه لك، ولو اجتمعوا على أن يضروك بشيء لم يضروك إلا بشيء قد كتبه اللّه عليك.<br />ومن جميل شعر الموفق بن قدامة صاحب المغني قوله:<br />لا تجلسن بباب من<br />يأبى عليك دخول داره<br />وتقول حاجتي اليه<br />يعوقها إن لم أداره<br />واتركه واقصد ربها<br />تقضي ورب الدار كاره<br />وللحديث بقية .."
archived = "2006-11-02"
