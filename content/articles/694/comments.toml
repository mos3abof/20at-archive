subject = "البطاقه السحريه لخرق قوانين السعوديه"
author = "منير عمر"
posted = "2006-08-12"
text = "اخى كل بلد فيه الخير والشر يعنى اذا وجهة مشكله فى السعوديه تفكر انا كل السعودين سوء ولكن انا حصل لى مشكله مع سعودى وحله لى سعودى لاعرفه بس عرف المشكله حله وقال لى ليس اصابع اليد سوء اتمنى عدم تعميم كل شى تكفى انو السعوديه بلد الحرمين والحق يقال انا اى شخص ياتى الى السعوديه زائر يحس كرم الضيافه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114141/http://www.20at.com/article2.php?sid=796"
