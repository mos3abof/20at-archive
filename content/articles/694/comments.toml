[[comments]]
order = 12
subject = "اتمنى ثلاثاً فقط"
author = "معاً نحو صحافة خالية من النفاق"
posted = "2006-06-05"
text = "أتمنى أن تتحقق ثلاث أمور فقط، ليست عسيرة ولكنها قد تكون مستحيلة التحقيق :<br />أولاً : أتمنى أن يكون الكاتب قد وثق تحقيقه الجرئ ـ حسب وجهة نظري ـ لعدة أمور سيفهمها فيما بعد حينما يتعمق في الإعلام بشكل أكثر، وأن يتابع القضية التي أثارها وانعكاساتهاوفقاً للعرف الإعلامي المتمرس الذي أكتوينا بناره مراراً، هذه مجردنصيحة وأمل لكاتبنا ومنه.<br />ثانياً : أتمنى من إدارة الموقع الذي أزوره على الويب سايت لأول مرة بعد أن كان لي شرف زيارتهم في مكتبهم بالقاهرة، أن يعيدوا حساباتهم جيداً تجاه ما يكتب من مواضيع وردود، إتباعاً للعرف الإنساني وحتى لا يكون هذا الموقع الرائع والجميل ساحة ومنبراً لأصحاب الألسنة الهجومية، وأصحاب الفكر المضمحل.<br />ثالثاً : أتمنى أن نكون جريئين وواقعيين في طرحناسواء في المواضيع أو من خلال التعليق عليها، كجرأة معظم الصحفيين في هذا الموقع، وأن نبعد قليلاً عن التطرف العرقي والمذهبي والذي كان وسيظل واحداً من أبرز العوامل التي أثرت تراثنا السئ بالكثير من الحقارات والتفاهة.<br />فمعاً نعمل لنحقق ما يجب أن يكون لا ما نحن عايشين عليه اليوم. شكراً وأعتذر على الإطالة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114141/http://www.20at.com/article2.php?sid=796"

