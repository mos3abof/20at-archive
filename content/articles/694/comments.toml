text = "احمدوا الله يااخوان على النعايم اللي عايشين فيها ما شفتوا العالم كيف عايش في الخارج وحنا كفايه انك تخرج وتسافر وانت متطمن عل اهلك من خلفك والله ثم والله ثم والله انكم ماتحسون باالنعمه الا بعد زوالها"
archived = "2006-11-02"
