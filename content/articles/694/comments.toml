subject = "تاج راسك آل سعود"
author = "شاهر السيف"
posted = "2006-05-16"
text = "اولا لست هنا للرد على الموضوع لانه وبكل أسف الموقع والمكان وبعض اصحاب الردود والاداره غير جديرين بالأحترام وأنهم ادنى من ان اشارك معهم بأنتقاد هادف يستفاد منه<br />أما ثانيا فأني استغرب من بعض الردود والتعليقات التي كتب عن موضوع البطاقه<br />مع العلم ان 90% ممن سجلو ردودهم غير سعوديين ولا يعلمون الحقيقة الكامله للبطاقه<br />وأخص بالذكر من ابتدع نفسه أمامٍ صالحا ليدعو الله على ولي امره من غير علم<br />والمؤسف جدا ان ادراة الموقع تركت المجال مفتوح للردود من دون رقابه ولا مراجعه مسبقه<br />ولكن يبقى العذر انه وكما ذكرت سابقا اكثركم لا يتم للمملكه العربيه السعوديه بأي صله غير انه لربما قد أتانا وافدا فأكرمناه وأغنيناه بعد مشيئة الله<br />ولكن ستبقى المملكه العربيه السعوديه شامخه بدينها ومليكها وشعبها رغم انف الحاقدين<br />وداريت كل الناس لاكن حاسدي<br />مداراتهُ عزّة وعـزّ منااالهـا!!!<br />وكيف يُداري المرؤُ..حاسد نعمة ٍ<br />إذا كان لا يرضيه إلا زوااالها؟؟؟"
