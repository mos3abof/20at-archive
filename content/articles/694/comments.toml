[[comments]]
order = 17
subject = "الإخوة في السعودية... لا داعي للحزازية"
author = "فارس بلا جواد"
posted = "2006-07-12"
text = "أيها الإخوة السعوديون .. نحن نكن لكم كل حب وتقدير، ولايعني أبدا قيام بعض أصحاب التعليقات السخيفة بأن يقومواباستفرزاكم، اما عن التعرض للموضوع في حد ذاته فأعتقد أنه امر محمود للموقع التعرض لمثل هذه الموضوعات الشائكة بدافع الإصلاح للتجريح - وأحسب القائمين على الموقع كذلك- وهذه الأمثلة تمتلئ بها بلداننا العربية فلا داعي للحزازية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114141/http://www.20at.com/article2.php?sid=796"

