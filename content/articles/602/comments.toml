subject = "نفسي"
author = "واحدة وخلاص.او.مصرية جدا.او.بنت اسكندرانية"
posted = "2006-05-01"
text = "نفسي اكون صديقة لكم ونفسي اشارك معاكم بأي حاجة ونفسي آخد رأيكم في كتباتي البسيطة المتواضعة وتقولولي رأيكم بصراحة<br />ونفسي في حاجات كتير اعملها معاكم لأني بمنتها الصراحة بحبكم جدا جدا جدا....<br />التوقيع<br />واحدة وخلاص ......مصرية جدا .....بنت اسكندرانية .....واحدة اسكندرانية<br />أختلفت الأسماء والشخص واحد .. بصراحة اصلي لسة ما قررتش استخدم مين فيهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112746/http://www.20at.com/article2.php?sid=668"

