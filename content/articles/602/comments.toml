[[comments]]
order = 12
subject = ".. ! ولو إنها متأخرة شويتين >> ;كل سنة وكل عشريناتى بكل خير"
author = "..& هيكل الأزهرى &.."
posted = "2006-08-24"
text = "انا اسف لتأخير التهنئة لكن والله لسه شايف المقالة دلوقتى الف مبروك على كل تقدم ورقى بتقدموه وكل سنة وكل عشريناتى بكل خير وبجد انتوا فعلا واجهه مشرفة لشباب مصر الجادين اللى نفسهم فعلا يبينوا الوجه الحقيقى لشباب مصر الأوفياء ربنا يحميكم جميعا واحب اقول للمديرة اللى ناسى اسمها ^معذرة ^ انا لما شوفتك وشوفت تواضعك وثقافتك على قناة عين تحديدا فى اعادة الحلقة على الساعه 2 ونص بالليل كدا فعلا نويت انى اشوف ايه عشرينات دا ومن الوقت دا وانا عضو فعال معاكم وبتابع كل جديد ربنا يوفقكم يارب ويكرمكم جميعا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112746/http://www.20at.com/article2.php?sid=668"

[[comments]]
order = 13
subject = "التبرج والتعري حرام"
author = "اسماعي"
posted = "2006-09-22"
text = "يا نانسي عجرم الا تخافين من الله وعداب القبر وسؤال منكر ونكير اتريدين ان تعدبي في القبر وتدخلي جهنم يوم الفيامة يوم تندمين علي يوم لا ينفع الندم فيه ضعي الحجاب كي لاتبتعدي عن ربكي فينساك في الاخرة كما نسيتيه في الدنيا هده نصيحة فقط فالرسول صلي الله عليه وسلم لا خير في قوملم ينصحوا ولا خير في قوم لم يقبلوا النصيحةالسلام عليكم ورحمة الله وبركاته اسماعيل من العيون بالمغرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112746/http://www.20at.com/article2.php?sid=668"
