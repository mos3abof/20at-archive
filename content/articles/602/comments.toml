subject = "انتم فين يا عمال المواسير"
author = "مناضل أنترنتى قديم"
posted = "2006-04-06"
text = "السلام عليكم و رحمة الله وبركاته<br />أنتم بسم الله ماشاء الله شباب زى الورد و ربنا يؤلف بين قلوبكم<br />الا صحيح أخبار عمال المواسير أيه لماذا تم أجهاض الثوره<br />مصعب ما تقلقش أنا معاك و ربنا يقويكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112746/http://www.20at.com/article2.php?sid=668"

[[comments]]
order = 1
subject = "وحشتوني"
author = "علياء ماضي"
posted = "2006-04-06"
text = "السلام عليكم<br />الحقيقة انا ماكنتش عارفة عيد ميلاد عشرينات امتي بلظبط بس كل اللي اقدر اقوله كل سنة وكل عشريناتي طيب<br />وحشتوني جدا وسلامي لشيرين وياسمين وهبة ومريم ومروة وايمان ودعاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112746/http://www.20at.com/article2.php?sid=668"

[[comments]]
order = 2
subject = "كل عا م و أنت فى تقدم"
author = "صاحبتكم بس من وراء الكواليس"
posted = "2006-04-06"
text = "أحب أهنيكم بعيد الميلاد و أتمنى لكم أن يوفقكم الله لما فيه الخير و أن تكونوا فى تقدم أسفة أنا عارفة إن اللغة رسمية شوية ولكن أنا أحب كل فريق عشرينات لأن أنا تقريبا عايشة معاكم بس من بعيد لكن أن بحب كل فرد فيكم وعندى إحساس إنكم إخواتى و يارب يوفقكم فى حياتكم و ما تنسوش بعد فترة سواء قلت أو كثرت إبنكم البكر عشرينات وحقه عليكم مش كده ولا إيه وجزاكم الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112746/http://www.20at.com/article2.php?sid=668"

[[comments]]
order = 3
subject = "نداء اغاثة"
author = "احمد مهدي"
posted = "2006-04-07"
text = "إلي الامير طلال بن وليد<br />السلام عليكم ورحمة الله وبركاته<br />اتوجه اليك بنداء استغاثة واتمني من الله العلي القدير ان تقف بجانبي قعلا<br />انا شاب من فلسطين اعيش ظروف مادية قاهرة تحملت الكثير الكثير ودقيت كل الابواب ولكن دون جدوه لا عمل ولا قدرة على تسديد ديون متراكمة بسبب عدم وجود معيل لاسرتي ببسب ، علما بانني اسكن بمنزل بالايجار ولا معيل لدينا ومهدد يالطرد انا واسرتي ان لم ندفع ثمن الايجار<br />وابلغك علما بانني كنت مرتبط بفتاة ولكن الظروف التي وضعنا فيها اجبرتني على تركها<br />اجرني واغثني حفظك الله<br />ابنكم من فلسطين احمد مهدي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112746/http://www.20at.com/article2.php?sid=668"

