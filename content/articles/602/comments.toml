[[comments]]
order = 5
subject = "يا عشريناتيه"
author = "نيفين"
posted = "2006-04-09"
text = "واضح الجو الحلو الللة بينكم و اللى يمكن حاساه اوى لان انا كمان ليا مجموعه بنتقابل على طول لان بيننا مشروعات خيريه كدا على ادنا بنعملها و مقدره اد ايه دا بيدى جو حلو<br />لادام على طول يا اجمل عشريناتيه ف الدنيا<br />بس برده لسه زعلانه على فشل انقلاب عمال المواسير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112746/http://www.20at.com/article2.php?sid=668"

[[comments]]
order = 6
subject = "العشريناتية أهمه حيوية وعزم وهمة ...جيل بعد جيل متحسنين"
author = "محمد السيد"
posted = "2006-04-09"
text = "تعرفو إيه أحلي حاجة في عشرينات ؟؟<br />هي الروح بتاعتكم ... الروح اللي بين الكتاب والمحررين وبين الجمهور \" اللي هم إحنا يعني بس أنا عايز أكتب كلام كبير\"<br />وكمان حكاية التعليقات دي بجد حاجة خطيرة<br />أحين بكتير من لوكان منتدي وايم مستخدم وكلمة مرور والحاجات دي ...<br />الواحد ساعات بيفكر نفسه واحد من أهل البيت ده ..<br />وعموما أهلا بكل العشريناتية الجداد والقدامي ... وأهلا بتيتا وجدو .. وخالتو سهير وعمو محمد و... إيه ده؟؟ إحنا فين هنا؟<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />مش تكملوا جمايلكم وتغيروه لي ؟<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112746/http://www.20at.com/article2.php?sid=668"

