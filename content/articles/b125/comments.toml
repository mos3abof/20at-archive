author = "أحمد السيد"
posted = "2006-07-23"
text = "أولا بعد قراءة الموضوع و رأي الشباب شايف بجد ان الراجل عمره ما عايز يتغير ابدا يحب يضحك عليه و بس ، ايه المشكلة ان البنت عندها ماضي انت معاها من زمان و لا احسب بس علاقتك بيها من وقت معرفتك، ما احنا الشباب نعرف و نخرج و نعيش حياتنا و هما يعنى البنات ايه حجارة ... جول لحم و دم و احساس زينا بالظبط<br />عشان كده بجد الرحمة يا شباب و عاملوا الناس زى ما تحبوا يعاملوكم و بلاش بجد نظام سي السيد الفاشل ده قبل الجواز و التحكم ع الفاضي لما تبقى خطيبطك رسمي و تعمل حاجة غلط ساعتها حاسبها"
