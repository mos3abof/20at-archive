text = "ليه حرام ان يكون للبنت ماضى فى حين انه حلال للولد والمفروض ان البنت تقبل الماضى ده حتى لو كان ماضى منيل بنيله هتقولى وليه تقبل بشاب عنده ماضى زباله هقولك لازدياد نسبه العنوسه وعشان مفيش بنت عايزه يفوتها قطار الزواج او عشان المشاكل اللى بتحصل بين الاباء فتجوز غشان تهرب من القرف اللى عايشه فيه وحتى لو هيه موافقتش اهلها هيوافقوا عشان البنت متعنسش او لانها من العادات والتقاليد كما يحدث فى بعض محافظات صعيد مصر حتى الان ان تتزوج الفتاه بغير رضاها والله حرام اللى بيعملوه اهالينا"
