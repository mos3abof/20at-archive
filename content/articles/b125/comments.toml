subject = "حق للزوج"
author = "محمود"
posted = "2006-02-02"
text = "اولا مع احترامى لكل الاراء التى تقول انه ليس من حق الزوج معرفةماضى زوجته لو كان ماضى عادى<br />طيب الاول ايه يعنى ماضى عادى ما فيش حاجه فى الاسلام اسمها ماضى عادى وماضى مش عادى دى علاقه محرمه مادامت فى الخفاء ودا مرفوض تماما اما لو كان يقصد بيه انه كان خطيب لها امام الناس وانه لايراها الا فى حضور ابويها من الاخر لا يختلى بها ممكن نعديها عند بعض الناس اما انا شخصيا لا اقبل الزواج بفتاه كانت حتى مخطوبه السلام عليكم"
