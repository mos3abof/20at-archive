author = "sh_trabeh"
posted = "2006-03-16"
text = "انا احترم جدا كلام الاخ(اسقا).فل الزوج او الخطيب محاسبه خطبته على مايمتكلكاة سويا وهي فتره خوطوبتهم وايضا يمتلك ماحسبتها بعد مايجوزها .لكن ماضيها شئ تمتلكه هي فقط كما ان ماضيه يمتلكه وحده.وبعدين نفكر شويه كده لما نسبها (البنت اللي عندها ماضي) ونبعد عنهامش كده احنا بنظلمها وبنطرها للغلط ربنلا بيسامح ويغفر ليه احنا مانسمحش وبعدين هتفرق في ايه.لو عندهااو ماعندهاش ماش ماضي كلنا بشر وكلنا خطائون وخير الخطائين التوابين"
