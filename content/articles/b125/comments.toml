author = "sheka"
posted = "2006-05-31"
text = "انا بقول ان الماضي من حق صاحبة يعني مثلا او انا اتعرفت علي بنت المفروض اعتبر ماضيها دة من حقها ومسألهاش علية لأنة ممكن يسبب لها احراج او اي حاجة طب وعلي اية وهو انا لو عرفت يعني هقدم او هأخر حاجة اكييييد لأ....<br />فنا بقول ان احنا نعتبر بداية معرفتنك بيها وعلاقتك معاها عمر جديد او بداية جديدة وانسي ماضيها.....وانساني"
