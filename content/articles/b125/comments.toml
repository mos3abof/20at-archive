[[comments]]
order = 17
subject = "الله أكبر"
author = "محمد"
posted = "2006-07-03"
text = "أنا أعتقد أن البنت التى لها ماضى وللأسف لا يمكن أن تصدق فى علاقه جديه,لأنها غير متربيه تربيه صحيحه ,ودائما فى مثل هذه الأحوال تكون الأم هى السبب لأن الأم هى الى ماسكه البيت وليس الزوج فالمرأه لا تصلح أن تكون الحلقه الأقوى فى البيت حيث أنها تعالج المشاكل والأمور بعاطفتها وليس بعقلها , وسامحونى يا بنات فأنا لا أقصد التجريح ولكن هذا الواقع, وأسأل الله الهدايه لى ولكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134009/http://www.20at.com/article2.php?sid=125"

[[comments]]
order = 18
subject = "لا أرفض انها تتحدث عن ماضيها"
author = "خالد إبراهيم عيسى"
posted = "2006-07-13"
text = "قرأت ما كتبة السابقون عن هذا الموضوع فضحكت كثيرا\" منه لأنة حصل معي وكنت أحب خطيبتي جدا\" فوق الوصف لكنني طلبت منها أن تقول لي على ماضيها وأنا كأنسان من النوع العصبي جدا\" والغيور إيضا\" فقالت لي عن ماضيها بأكمله والنتيجة ما قدرت امتلك أعصابي وحسيت بإهانة بالغة وقمت بإبلاغ أهلها عن ما فعلتة وأخيرا\" وصلنا إلى فسخ الخطوبة والمشاكل بس أنا محتار هذا اللي فعلتة كان صحيحا\" أم كنت لا اطلب منها أن تقول ساعات بقول أحسن أنها قالت لكي لا أقع في الفخ وليه أورط نفسي في جوازة زي دي في بنات كثير محترمات وولاد ناس طيبة نصيحة من أخوكم بلاش تفتح معاها هذة السيرة وسيبها على الله لو ليك نصيب فيها كان بها ملكش نصيب أدي الله وأدي حكمتة بس أهم شيئ أنك تحس إنها مهتمة بيك وبتحبك وتخلصلك يبقى كدة كفاية وبلاش تفتح في الماضي لأنها بنت ممكن تقولك عن ماضيها بدافع إنها بتحبك جدا\" ومأتمناك على أسرارها وممكن عشان لو عرفت شيئ من برة متبقاش مخجلة منك وتظهر قدامك بإنها تكذب عليك المهم إنت لا تسألها نصيحة أخوكم / خالد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134009/http://www.20at.com/article2.php?sid=125"

[[comments]]
order = 19
