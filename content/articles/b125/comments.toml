subject = "المهم الوفاء والإخلاص"
author = "محمد السقا"
posted = "2006-01-12"
text = "ماضي البنت قبل الزواج خاص فيها ما يهمني هو ما بعد بداية علاقتي فيها ومدى إخلاصها وصدقها معي وهو الشيئ الذي أتأكد منه بنفسي<br />وبصراحة أنا شاب عندي ماضي عاطفي لا أخجل منه والبنت بشر متلنا من لحم ودم وممكن تحب<br />لكن الفرق بيننا بالمجتمعات العربية إنو ماضي الشب مجرد طيش وبكرة بيعقل<br />أما ماضي البنت فهو فجور وعهر وقلت أدب لا تغفر أين العدالة يا شباب ؟؟؟؟؟؟؟؟؟<br />أنا أخيرا بقول إني ممكن أتجوز من كافرة ملحدة وعندها ماضي بيخزي بس يكون عندها إستعداد تنسى الماضي وتفتح صفحة جديدة معي وتحبني وتخلصلي وبس إزا الله بسامح كل الناس وبسامحها إزا إستغفرته ليش إحنا ما بنغفر لبعضنا ؟؟؟؟؟؟ (((للأسف لأننا شرقيين))))"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134009/http://www.20at.com/article2.php?sid=125"

