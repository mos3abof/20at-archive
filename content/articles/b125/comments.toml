subject = "الظلم حراااام"
author = "أم شهد"
posted = "2006-04-16"
text = "ياجماعة اسمحولى اتكلم ..يعنى اذا كان ربنا بيغفر وبيسمح يبقى البشر وطبعا مفيش اى مقارنة مش هنسامح؟ده ظلم..<br />بعدين اذا كانت البنت ليها ماضى حتى لو كان اسود ومنيل بنيلة ..وارتبطت بواحد واتعدلت وبأة انسانة ملتزمة وبتعرف ربنا وقفلت الصفحة السودة دى..ليه احن نحاربها ونجيب لها احباط وندفعها للرزيلة مرة تانية؟كمان ليه دايما بنتعامل كأنو فى فرق شاسع بين الولد والبنت يعنى اذا غلط الولد عادى..طيش شباب ولما يتجوز هيعقل لكن اذ غلطت البنت او حتى حبت او ارتبطت تبقى مش محترمة ونبص لها بصة مش كويسة هى البنت دى مش بشر؟مش بتحس؟كيد هيطلع واحد يرد ويقول احنا شرقين ودمنا حامى ياانسة ..مش كده؟بس لو دى طبعاع الشرقين انهم يكون ظلمة يبقى انا هتخلى عن شرقيتى فورا لانو ده غباء وجهل..وظلم..حرام ياجماعة احناخليفة الله فى الارض وخليفة محمد رسولنا وقدوتنا مفروض نكون عادلين..عمر التزمت ماكان تدين ابدا..والله يهدينا ويهدى الجميع.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134009/http://www.20at.com/article2.php?sid=125"

