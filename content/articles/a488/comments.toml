[[comments]]
order = 1
subject = "مصـ( الخير )ـعب"
text = "السلام عليكم ورحمة الله وبركاته<br />فعلا موضوع رائع , ليس لأسلوب كتابته فقط<br />و إنما لأنه يتناول قضية مهمة جدا للغاية !!<br />و للأخ \"ياه\" أقول :<br />يا أخي إذا كان الموضوع \"قديما جدا \"<br />كما تقول ؛<br />لماذا أضعتم وقت حضرتكم الثمين<br />و كتبت عليه تعليقا؟!!<br />أخي لا يجوز أن نطلق هذه التعبيرات على قضية<br />هي قضية أمة كاملة ,<br />لو راجعنا تاريخها لاكتشفنا كم نحن مقصرون في حقهم.<br />و طالما الموضوع قديم<br />هل ندرك جميعا واجبنا تجاه هذه القضية؟!!!<br />ترقبوا البيان التأسيسي للحلف الالكتروني الفظيع !!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035811/http://www.20at.com:80/article.php?sid=488"
