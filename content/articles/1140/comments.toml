order = 1
subject = "ان الله لايهمل"
author = "ابومدين"
posted = "2006-07-27"
text = "إن الله يمهل ولا يهمل فاما عن الطفلة فهي ماتت وهي تكابد من اجل الجوع ولكن في موتها عبرة لانها عرفت بان كيفن ليس منِِ الذين يحسنون لغيرهم بالرغم من ان الدين المسيحي دين سماح وعطف وهي تعتنق تلك الديانة، ولكن دارت عليك دائرة السوء وفعلت فعلتك التي نكاءت لها نفسك فابتلاك فاطر السماوات بنار الاكتئاب واججها في داخلك وجعل تلززك برؤية الاخرين يموتون وهم في امس الحوجة للمساعدة هاانت اليوم تموت ميتة الكلاب الضالة المسعورة بل هي افضل لانها تموت بداء ولكن انت ياكيفين جنت يداك علي نفسك ما اقبح ذلك ان تقتلك يداك اللاتي اطعماك بالامس وانت تتلزز بموت تلك البريئةوانت تمسك بالكاميراولا تعلم بان مصيرك عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133103/http://www.20at.com/article2.php?sid=1101"
