[[comments]]
order = 0
subject = "حلو قوي"
author = "بلال"
posted = "2006-03-23"
text = "حلوة قوي فكرة الحوارات دي ياريت يا جماعة تعملوا حوار مع صافيناز كاظم لانها صحفية محترمة جدا، وشكرا على الموضوع الجميل والثري بالمعلومات والى الامام عشرينات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131320/http://www.20at.com/article2.php?sid=606"

[[comments]]
order = 1
subject = "الدلوعة"
author = "الدلوعة"
posted = "2006-03-23"
text = "هااااااى وحشتونى اوىاوى<br />انا بقى زعلانة اوى تعرفو لية ؟؟<br />علشان فادى بقى ممكن يطلع مع خليفة<br />بليز بليز ارجوكم رشحو فادى حبيبى<br />بليز ؟<br />اوكى ياااااارب فادى ينجح وخليفة يطلع يارب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131320/http://www.20at.com/article2.php?sid=606"

[[comments]]
order = 2
subject = "شكرا عشرينات"
author = "كرميلينو"
posted = "2006-03-23"
text = "شكرا بجد يا عشرينات على اهتمامكم بالشعر و الشعراء و المشعرين و الى الامام دائما و بجد الشعر الفلسطيني هو الشعر الوحيد الصادق و المعبر في وطنا المليان بالجروح<br />مين مبيحبش احمد مطر و لا محمود درويش<br />و كلمة اخيرة :<br />اهتموا بالاداب التانية ( الاخرى ) زي الروايه و القصه القصيرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131320/http://www.20at.com/article2.php?sid=606"

[[comments]]
order = 3
subject = "الشعر هو قبله السماء على جبين الارض"
author = "نيفين..نيفى..نوفا"
posted = "2006-03-23"
text = "يا قدس يا مدينتى<br />يا قدس يا حبيبتى<br />غدا سيزهر الليمون<br />و تضحك العيون<br />و ترجع الحمائم المهاجره<br />الى السقوف الطاهره<br />و يرجع الاطفال يلعبون<br />على رباك الزاهره<br />يا بلدى..يا بلد السلام و الزيتون<br />من قصيده القدس<br />نزار قبانى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131320/http://www.20at.com/article2.php?sid=606"

[[comments]]
order = 4
subject = "رائع"
author = "رائع حمدي"
posted = "2006-03-24"
text = "السلام عليكم ورحمة الله<br />انا اشكر عشرينات اولا لانها حطت هذه الاشكال. الرسوم التي في الاعلى<br />وثانيا انا اريد ان توجه بالكشر لعشرينات لانها اخذت تهتم بالشعر شوية.<br />وللامام ان شاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131320/http://www.20at.com/article2.php?sid=606"

[[comments]]
order = 5
subject = "انا بمووووووووووووووووووووووووووت بالشعر"
author = "يزن"
posted = "2006-05-22"
text = "انا بموووت بالشعر الماما ابتحكيله اكتير شعر شاطره اكتير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131320/http://www.20at.com/article2.php?sid=606"

[[comments]]
order = 6
subject = "رائع لطفي زغلول"
author = "معجبة"
posted = "2006-06-16"
text = "رائع لطفي زغلول كما عهدناه في كل مرة .<br />ان شاعلار الحب والوطن ..<br />شاعر جبل النار .. شاعر فلسطين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131320/http://www.20at.com/article2.php?sid=606"

[[comments]]
order = 7
subject = "شاعر الحب والوطن"
author = "طلبة الجامعة"
posted = "2006-06-16"
text = "لطفي زغلول<br />هذا الاسم الكوكب في سماء الشعر<br />انه شاعرنا الكبير<br />شاعر الحب والمرأة والوطن<br />شاعر الجرح الفلسطيني<br />شاعر القضية الفلسطينية في زمن ضاعت فيه القضية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131320/http://www.20at.com/article2.php?sid=606"

[[comments]]
order = 8
subject = "الايحاء"
author = "شهد"
posted = "2006-09-20"
text = "هل في قصيدته صباح الخير يا وطني هل كان كل استحائك من الطبيعة ورسمت صورة للربيع والجبال صراحة انتتتتتتتتتت شاعر وطني منتمي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131320/http://www.20at.com/article2.php?sid=606"
