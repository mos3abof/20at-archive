text = "قبل منقول فتنة كل واحد فية عقل يفكر قبل منفتن الفكرة مش فكرة صحيفو يهودية الفكرة فكرة مبدا واخلاق والدليل عل كدة انة مفيش اعتذار واحد جرج من اي جزائري ودة يدل عل ان النية مبيتة وحتي ان الجزائرين معندهمش ثقافة الاعتذار والاعتلراف بالخطا ولا الشجاعة لانهم اعتدو عل نساء واطفال لالالا الصحيفة دة حجة واهية ومش دول اخوانا المسلمين ال ندعي بتوحيد صفونا معاهم لان دول زي الصديق الغادر والاهم اننا مش هنبطل نقول حسبنا اللة ونعم الوكيل"
archived = "2010-01-06"
