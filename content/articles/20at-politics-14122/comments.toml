text = "اللهم وحد صف المسلمين واجمع فرقتهم وقو شوكتهم ولا تجعل للخائنين علينا سبيلا .<br />لا تنسوا ان اول من اشعل هذه الفتنة صحيفة يهودية ابرزت صور قديمة منذ الثمانينات بها جزائريا يحرق علم مصري . ومصري يحرق علم الجزائر."
