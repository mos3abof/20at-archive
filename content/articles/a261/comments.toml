subject = "عاشقة لبنان"
text = "السلام عليكم<br />اولا اود ان اقول انني ممن من اهتدين بفضل الله اولا والاستاذ عمرو خالد ثانيا وانا كفتاة مسلمه افخر بوجود شاب عربي قريب باسلوبه من الشباب والحمد لله انا من اللذين قدران ياثر فيهم بشكل كبير وارتديت الحجاب وتوقفت عن معاصي كثيره المهم انه لفت نظري من الاخوات اللتي قالت ان التدين صعب وانا معها نحن غرباء هذا الزمن ولكن هي تعيش في دوله اسلاميه يشجع فيها الحجاب بحسب فكرتي عنها فما بالك بلبس الحجاب في بلد غير اسلامي او بمعنى اصح يرفض شيء اسمه اسلام<br />وعذرا على لهجتي بس اللتي تفاخر بالبوي فرند دون ان تستحي وتؤثر رضاه على رضا رب العالمين فلا يسعني الا القول حسبي الله ونعم الوكيل في شباب باع دينه حتى يرضي من يجره الى الحرام .ان نكون مسلمين في عصرنا هذا شيء غير سهل بس كمان مش مستحيل ولو نحن لم نقم بالدعوه الى هذا الدين وتحمل المصاعب في سبيله فمن المخجل ان يكون امثالنا احفاد اشرف البشر وحتى لو تحملنا فعذابنا لا شيء مقارنة مع الوحشيه اللتي اتحملها الرسول صلعم وصحبه.سبحان الله كيف ان شبابنا يصبرون على المشقات في سبيل ارتكاب المعاصي ويستكثرون تضحيه بسيطه للدين في سبيل ارضاء الناس.اخوتي ارجوكم لا تظلموا عمرو خالد فلقد ضحى بالكثير من اجل المسلمين"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235713/http://www.20at.com:80/article.php?sid=261"

[[comments]]
order = 22
subject = "لماذا نهاجم المتميزين"
text = "استاذ عمرو خالد رجل غيور علي دينه<br />داعيه مستنير و اي سخص بسيط التفكير يدرك ذلك فلا داعي ان نتكلم في قضيه لا يختلف عليها عاقل<br />اما الحجاب فهو يعطي البنت جمال فوق جمالها<br />ولو اتك تري البحر يوميا فانك تالفه<br />ولو انك اكلت يوميا شهدا فانك تزهده<br />ولو انك تري الاجانب بشرم الشيخ عراه لقرفت منهم<br />لذ فالله يعلم الصالح لنا"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235713/http://www.20at.com:80/article.php?sid=261"

[[comments]]
order = 23
subject = "الى الشباب الاسلامي"
text = "تتحدثون عت الحجاب وكانة ظاهرة حديثة وكاننا لسنا مسلمين واننا ولدنا في بلاد غربية و وجدنا اباءنا يعتنقون دينا اخر غير الاسلام عندما اقرا عن الشاب الذي يكره الحجاب واخر يكرة عمرو خالد وغيرة اقف مندهشة وكاننا نتبرئ من اصلنا . عندما تسال هذا الشاب الذى يكرة صديقتة على ترك حجابها ما هي ديانتك يقول وبسرعة انا مسلم فهذا مسلم بالاسم فقط الظاهر حاليا هو ان التصرفات الطبيعية اصبحت غير طبيعية فعمرو خالد عندما يقول لنة مسلم ويطبق الاسلام يكون في نظر البعض شي عجيب وعندما يقول اخر انا مسلم ولا يلتزم بة يكون شي عادي"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235713/http://www.20at.com:80/article.php?sid=261"

[[comments]]
order = 24
subject = "غريب امر هذه الامة"
text = "لم اكن انتظران يقابل اجتهاد عالم بهذا الجحود وتنسب اليه هذه التهمة\" حجاب عمرو خالد\" فالحجاب فرضه الله في كتابه ولاداعي ان نذكر كل غافل بها المسلمة ومادروس عمرو خالد الا اسهام في ايقاظ هذه الامة باسلوب مرن في عصر اصبح فيه الحليم حيران. وعوض ان ناخد في للهو الحديث والجدل العقيم والذي سنسأل عليه يوم القيامة علينا كل من مركزه ان يكون له اسهام حسب استطاعته في بناء الامة. اما اخواتي اصحاب \"البوي الفرند\" فاسال لهم الهدايةواقوللهم انهم لن ينفعوهم يوم العرض الاكبر يوم لاينفع لامال ولا بنون الا من اتى الله بقلب سليم محجبة منذ فترة طويلة وجاءت دروس عمرو خالد لتحيي في الامل وتججد لي امر ديني فجزاه الله خير الجزاء"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235713/http://www.20at.com:80/article.php?sid=261"

