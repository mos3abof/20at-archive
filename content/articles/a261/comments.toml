[[comments]]
order = 16
subject = "فاما اللذين امنوا فيعلمون انه الحق من ربهم"
text = "ياختى يامن تقولين ان البوى فرندلا يحب ان يراك بالحجاب فاعلمى انه غير امين عليكى ولا تفرحى به لانه سيكون سبب فى دخولك النار انك لا تستشعرى عظمة خلق الله لكى تاملى وجهك وما به من ملامح فشكرك لله يكون بارتدائك الحجاب متبعة شروط الحجاب وهى الزى الواسع ليس بالشرط ان يكون عبايه ولكن ممكن ان يكون جيب وبلوزة شيك وحجابك عليها ويجب ان يغطى منطقة الصدر ولا تقولى لا لاى امر من اوامر الله لانهافرض ولان لا هذه من الشيطان"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235713/http://www.20at.com:80/article.php?sid=261"

[[comments]]
order = 17
subject = "gms2004@islamonline.net"
text = "بسم الله الرحمان الرحيم.<br />في نظري أن الحجاب أمر من أوامر الله، لا تختلف صيغة الأمر فيه عنها في الأوامر الأخرى التي بغيرها لا يكون المرء مسلما، ففي هذا الشأن لا مكان للحديث عن القناعات و لا عن الحريات..فالفتاة التي تؤمن بالآيات القرآنية الكريمة لابد أن تؤمن بها كلها و بالتالي أن تطبقها كلها،و ليس لها أن تنحني لدسيسة الحريات و القناعات التي يتشدق بها من في قلبه مرض. \"أتومنون ببعض الكتاب و تكفرون ببعض\"...هذا من جهة<br />من جهة ثانية..أظن أن الحجاب جاء ليقي الأمة من فساد شبابها، و ذلك بكف بعضهم عن بعض، فكيف يكف الشاب الذي صعب عليه الزواج و صعب عليه طريق الله عن فتاة صعب عليها أن تستسر مفاتنها. و بالتالي فالحجاب الذي لا يهدف إلى تجسيد هذه الحكمة البالغة على أرض الواقع ليس حجابا و لكنه تشويه للحجاب.<br />أما أن ننسب أنواعا من الحجاب إلىداعية كعمر خالد فإن كان هذا مفيدا فيشيء فلنكتبه على قماش الحجاب و لنذكره بكرة و عشيا، و إن لم يكن في هذا نفع فهو لغو لا وزن له، و نقول للقائلين به \"سلام عليكم لا نبتغي الجاهلين\""
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235713/http://www.20at.com:80/article.php?sid=261"

[[comments]]
order = 18
subject = "لا طاعة لمخلوق فى معصية الخالق"
text = "انا هنا برد على الانسة نيرمين حيث انها قالت ان اصحابها فركشوها لما لبست الحجاب و هى طبعا راحت خلعه الحجاب .هى المفروض متكونش مصاحبه الاولاد دول طبقا للاية الكريمة (و لا متخذا ت اخدان)صدق الله العظيم.و تانى حاجة ان هى اول ما بعد عنها اصحابها دول على طول قلعته مع انها المفروض كانت تتمسك بقرارها اتجاه الحجاب و تصاحب اصدقاء يساعدوها على قرارها و تحاول تغير فكرة هؤلاء الشباب."
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235713/http://www.20at.com:80/article.php?sid=261"

