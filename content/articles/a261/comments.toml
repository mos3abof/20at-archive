text = "انا لم اسمع مصطلح حجاب عمرو خالد ولكن الذى اسمعوة واراة بعينى وانا طالبة جامعية هو انة قد ساهم بشكل كبير فى تدين و اصلاح كثير من الشباب لدرجة انة فى كليتى على الاقل لم تعد هناك الا القلائل اللاتى لا يرتدين الحجاب وبدل ما ندخل فى مهترات لا فائدة منا دعنا نشاركة فى مشروع النهضة فى برنامجة صناع الحياة الذى يعرض على قناة اقرأ الثلاثاء الساعة 9 بتوقيت القاهرة<br />لا اله الا الله انى كنت من الظالمين"
