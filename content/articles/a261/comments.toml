subject = "فعلا ظلم"
text = "اولا دى اول مره اسمع نعبير حجاب عمرو خالد ده و ان كنتم تعتقدون ان هذا ظلم فلا تنشروه عنهم؛انا شخصيا بدأت اسمعه و انا محجبه وساعدنى بفضل الله على الحجاب الصحيح . هو فقط يساعد على المرحليه و التدرج ولا ذنب له فيمن اخطأ الفهم عنه أو توقف فى التدرج معه"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616104326/http://www.20at.com:80/article.php?sid=261"

