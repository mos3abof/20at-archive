text = "صحيح الدين يسر فى العمل بشرائعه ولكن بالتاكيد للهوى دور غظيم فى الصد عنه و عما فيه من يسر . فليبشر كل من اتر هوى الله عن هواه (وأما من خاف مقام ربه ونهى النفس عن الهوى فإنّ الجنّة هي المأوى)<br />و الجنه تحتاج منا هذا البذل . ألا من مشمر للجنه"
