archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616104326/http://www.20at.com:80/article.php?sid=261"

[[comments]]
order = 7
subject = "اخى محمد"
text = "اخى محمد مسلم انا معك فى رايك بانها ساقطة و ان كل من تسول لها نفسها ان يكون لها ( البوى فريند ) بل و تتبجح باشهار ذلك على الشبكه تستحق ان يقال عنها ذلك و الا ماذا يقال عن اخت فى الاسلام تستحق ان يقال عنها ذلك و هذا لالتزامها بدينها و هذا الاتزام عناء بحد ذاته لان اصعب جهاد هوا جهاد النفس و انا مع دعوه من دعا رد على كلام بهدايتها فادعو الله لها و لى من قبلها بهذه الهدايه عسى ان يقيمنا الله و اياها من بعد السقطه و الهدايه من عند الله ليست من عند الشيخ عمرو خالد كما يعتقد البعض و ليرحما الرحمن الرحيم"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616104326/http://www.20at.com:80/article.php?sid=261"

[[comments]]
order = 8
subject = "بالراحة يا شباب"
text = "السلام عليكم<br />بالراحة يا شباب ...المسلم من سلم الناس من لسانه .. بلاش اتهامات ملهاش لازمة لأي حد ...بجد بجد الواحد زهق من الكلام عن الاستاذ الفاضل عمرو خالد والناس مش عارفة تتهمه بايه والا ايه !! مرة كاجوال ومرة مش عارفة ايه ومرة ....حراااااااااااام انا اهو سيدة زي مامتكم واعترف ان الاستاذ عمرو ليه فضل عليا وربنا يجازيه ألف خير على ما يفعله للإسلام والمسلمين في كل انحاء العالم وأرجوكم يا بشر في كل الدنيا اتركوا الاستاذ عمرو يقول ويهدي عسى يفلح فيما افسده الدهر والبعد عن الدين والله سبحانه وتعالى قادر على هداية البشرية كلها في طرفة عين ويأتي بمن يذكرنا ما نحن غافلون عنه مثل الاستاذ الفاضل عمرو خالد وغيره من الأخوه الأفاضل جزاهم الله ألف خير عنا وارجوكم استمروا في هداية الناس وصلوا وتحجبوا وقربوا من الله عز وجل والله ما نحن فيه من ابتلاءات من بعدنا عن الله ..ألا بذكر الله تطمئن القلوب؟ اللهم اني اسالك الهداية لي ولأمة حبيبك محمد صلى الله عليه وسلم وشبابنا يا رب يا رب ارحمهم واف عنهم واهدهم وأنر لهم الطريق يا رب العالمين..."
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616104326/http://www.20at.com:80/article.php?sid=261"

[[comments]]
order = 9
subject = "هدانا الله واياكم"
text = "اللهم اهدي بنات المسلمين<br />حقيقه لا ادري هل وصلت الجراه بالفتاه المسلمه ان تقول تركت الحجاب لاجل فلان تركت طاعتك يا رب الارباب لاجل فلان (( بوي فريند ))<br />الاخ عمرو خالد جزاءه الله خير الجزاء وثبته الله واعانه ونوره بنوره جل جلاله وسدده للحق والصواب<br />اخيتي يا من تتركين الحجاب او لم تتستري به<br />لا تستري نفسك<br />ولا تتحجبي<br />ولا تلبسي ما يغطيك<br />بل لو استطعتي انزلي كما خلقك ربك وامشي على رجليك<br />ولكن ... ان كنتي تؤمنين بالله ورسوله صلي الله عليه وسلم وبالقدر خير وشره وبيوم القيامه<br />فلماذا الاسلام اصبح كلمه على لسانك فقط لا تصل الى قلبك.....<br />اخيتي لا اخشى عليك نقد الناقدين ولا كلام العلماء ولا القديم ولا الجديد وانما والله انني اخشى عليك<br />نار وقودها الناس والحجاره<br />سقر وما ادرائك ما سقر لواحه للبشر لا تبقي ولا تذر<br />اخاف والله عليكن وعلى نفسي والمسلمين منها<br />احب الصالحين ولست منهم ......<br />يا رب يا مالك الارض والسماء التجي بك يا ربي ان تغفر لنا وتهدينا جميعا للطريق المستقيم......"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616104326/http://www.20at.com:80/article.php?sid=261"

[[comments]]
order = 10
subject = "الحجاب المتبرج!!!"
text = "السلام عليكم ورحمه الله وبركاته<br />اولا هذا الحجاب ليس بحجاب لانه حجاب متبرج!!! فما الفرق بين من ترتدى ججاب متبرج مثل هذا وترتدى ملابس ضيقه ونصف شعرها ظاهر للاسف هؤلاء لا ينتموا لفئه الملتزمين<br />وعمرو خالد لم يدعوا لهذا الحجاب بل يدعوا الى الحجاب الصحيح بشروطه وعليكم الرجوع الى درس الحجاب!!<br />والى كل من تقول ان ربنا سيهدينا او تقول صاحبى قالى انك شكلك احلى من غير الحجاب ومثل هذه الامور نقول لهم<br />الله قال تحجبى اذن فلتحجبى !!<br />وانركى صحابك وهواكى<br />لانك فى يوم من الايام ستكونى وحدك فى القبر!!<br />والسلام عليكم ورحمه الله وبركاته"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235713/http://www.20at.com:80/article.php?sid=261"

[[comments]]
order = 11
subject = "مسلم يريد الخير للمسلمات"
text = "أن مشوار الميل يبداء بخطوة وسواء كان الهدف من لبس الحجاب في الفترة الاولى للزينة أو للتفاخر أو لغيرة فلابد أن ياتي يوماً وتقتنع فيه الفتاة أن هذا هو الوضع الصحيح وأن المجتمع بداء يتقبلها هكذا ، ثم بعد ذلك تبداء الخطوة الثانية والثالثة حتي يدخل الايمان الكامل بالحجاب في قلب الفتاة فيصبح اتباع للنهج القراني وليس زينة كما كان من قبل ، بس يا بنات جربوه وانتو تعرفو النتيجة ."
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235713/http://www.20at.com:80/article.php?sid=261"

