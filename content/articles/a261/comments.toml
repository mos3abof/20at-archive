subject = "العمل لله وليس لعمرو"
text = "كل من عمل عملا يجازى بالنيه<br />فاذا كانت بعض الفتيات ارتدين الحجاب لاجل عمرو خال فذنبها تحمله ولا تزر وازرة وزر اخرى<br />لا داعي لان ناكل في لحم اخينا بالله الاستاذ عمرو خالد<br />لاجلكم اخوتي احسنوا الظن ولا تحملوا انفسكم ذنوبا لا تدرون بها دعوا الاخرين وشأنهم.....<br />لا اله الا أنت سبحانك إني كنت من الظالمين<br />لا حول ولا قوة الا بالله"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235713/http://www.20at.com:80/article.php?sid=261"

