subject = "جمهورية مصر العربية - مدينة قنا - مركز قوص"
text = "انا عدنان محمد عبد المقصود<br />انا اخ الاصغر لعدنان اسمى مصطفى<br />(( عدنان )) انا اريد ان اكون لاعب كرة الحقيقة<br />لااعرف ان العب لكن اننى احلم معكم عندى 12 سنة<br />انى اريد ان اركب معكم الطائرة<br />(( مصطفى ))<br />انا نفسى ان اكون فلوس واعطها للفقراء<br />انا عندى 10 سنين اتمنى ان الحلم يتحقق<br />وانا ايضا اريد ان اركب معك يااخى الطائرة ومعكم<br />انتووووا (( صناع الحياة ))<br />ارجو ان تقول اننا فى الحلقة الا خرى اتصلنا بك ايها<br />قائد الطائرة"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831235713/http://www.20at.com:80/article.php?sid=261"

[[comments]]
