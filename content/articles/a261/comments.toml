subject = "عمرى ما سمعت كلمة حجاب عمرو خالد"
text = "اولا الاستاذ الفاضل عمرو خالد لم يقل ان هذا هو الحجاب ولا ادرى من اين جئتم بهذا الكلام ولكن كل ما انا واثقة منه هو ان هذه الفتيات لم يسمعن عمرو خالد من قبل ومن يقول هذا الكلام عليه فقد ظلمه واساء فى حقه وارجو ان لا يكون احد مصدق لهذا الكلام وانا شخصيااحب عمرو خالد فى الله و اسمع حلقاته وباستفيد منها كثيييييير!!!!!!!!!!!!<br />اسماء 13 سنة"
