[[comments]]
order = 0
subject = "مسلم يحب ربه ونبيه ودينه"
text = "تقول نيرمين أنا بصراحة كنت أرتدي الحجاب ولكن خلعته لأسباب كثيرة، أهمها إني قابلت \"ولاد كتير\" وكلهم قالوا لي إني أجمل بدونه. وربنا عارف إن الالتزام صعب، وان شاء الله يهدينا جميعاً<br />قال رسولنا الكريم ان الدين يسروانتى تقولين عكس ما قاله الرسول... ولا استطيع ان اقول حكم من يخالف الرسول الكل يعرف ولا احد يحتاج الى تزكير....<br />أما صديقتها دينا فقد خلعته لأن صاحبها (الذي كان يطلق عليه في الماضي بوي فريند)، لم يتقبلها وهي محتشمة. \" أنا صاحبي مبيحبش المحجبين ولما اتحجبت فركش معايا وسابني. وأنا بحبه جداً ومقدرش أسيبه. وهي دي مشكلة حياتي مش عارفة أعمل إيه.<br />الحقيقة الحجاب محتاج واحدة عندها قوة إرادة إيمان وشجاعة<br />قالت الثانية انها تحب صاحبها جدل متقدرش تسيبه<br />وقال رسولنا الكريم لايؤمن احدكم حتى يكون الله ورسوله احب اليه مما سواهما\" احب الى المؤمن من كل الدنيا بما فيها<br />ثم قالت الحجاب يحتاج الى قوة ارادة وايمان وشجاعة مع العلم ان الحجاب لايحتاج الا الى ايمان بالله وبالرسوله<br />ولن ازيد غير انى اقول لاى فتاة اتقو الله فى انفسكم يوم لا تنفع نفس شى هل ستقولن لرب العزة رب السموات والارض فعلنا ذلك من اجل حب واولاد لن يغنو عنكم من الله شى اتقوا الله فى انفسكم ويجب على اهليكم ان يتقو الله فيكم ويخافو من يوم الحساب"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616104326/http://www.20at.com:80/article.php?sid=261"

[[comments]]
