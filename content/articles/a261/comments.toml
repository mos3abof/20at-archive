[[comments]]
order = 5
subject = "محمد مصرى مسلم"
text = "انا افخر بأن من مصر عمرو خالد داعية مثقف فاهم واعى عصرى غير متطرف بافكاره يدعو شباب المسلمين فى العالم كله وليست دعوة للانهزامية لكنه دوما متفائل وبشوش يدعو للامل بعيد عن السياسة والتعصب محاور جيد اتركوه لله وللاسلام ولا تلصقوا به شئ ليس به<br />لله وللاسلام اتركوه يعمل بدون اتهامات<br />من ترى ان بوى فريند تركها لاجل الحجاب فلتتركه هى لله ولعرضها ولكرامتها<br />لاتسألوا الساقطات عن رايهن فى عمرو او الحجاب فلو انها على خلق ما سمحت لنفسها ان يكون لها بوى فريند وليست هذه حجة على المصريين او على المسلمين ومن تتبرأ من حجابها وعفتها فهى اهون ممن ان نتبرأ منها"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616104326/http://www.20at.com:80/article.php?sid=261"

