subject = "الحجاب وامور العائلة"
text = "انا لم اتحجب إلالما كنت نقراء إلا في الاعدادي وامي هي هدتني الي الطريق الله عز وجل وبعد ذلك عمرو خالد ربي يحفط كل واحد ساهم في تحجيبي<br />أما بخصوص العائلة نحب اتعامل معاكم على ان افعل خير ولكن عند اخ مابيحبش البنات إلاتخرج يقول البنات ماتخرجج اني نعرف هيك يقول واتمني ان توضح لهم ان تقه في النفس هي اهم شيئ في الدنيا وانشاء الله حساهم حتى ولو كان اموت في سبيل الله<br />اتمني ان اكون عند حسن الضن<br />اريد اعلق الفتيات إلاهم تحجبو وتخلو على التحجب بسبب لامعنه لهو شو الاولاد بعدين حينفعوهم يوم توقف الروح على النبض اقول لها ارجعي الى الله سبحانه وتعالى ارجوكم مش حينفعكم احد انصضوالى عمرو خالد"
archived = "2004-08-31"
