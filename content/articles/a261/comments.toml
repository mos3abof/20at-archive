text = "السلام عليكم ورحمة الله وبركاته<br />ليس هناك ما يدعى بحجاب عمرو خالد كما قال إخواني الذين سبقوني إنما الحجاب فرض من الله ليستر به المرأة المسلمة وإني لآرى تلك الفتاه التي نزعت الحجاب لأجل صديقها إنها قد خدعت وأن ذلك الشاب لم يردها إلا لجسدها وأن المحبة الحقيقية من يحب لله فيرشد إلي الصواب ويرضى بالصواب وأقول لها لا طاعة لمخلوق في معصية الخالق وأما تعليقي على الأستاذ عمرو خالد فإنه رجل قوي الشخصية استطاع بكلامة وأسلوبة الشيق أن يهدي الكثيرين وإني لأرجو أن يخرج من بين الشعوب الكثير من أمثالة من الرجال دون تعصب بل بالكلمة الطيبة فإني لي تجربة في ذلك وهي أن لي أخوان احداهم متعصب والآخر يأتيني بالكلمة الطيبة وإني والله لأزيد عنادي عند المتعصب وألين للذي يأتيني بالكلمة الطيبة وهكذا هو حال الأستاذ عمرو خالد فإنه يأتي بالعبرة والكلام الحسن والكلمة الطيبة وإني لأرى أن ذلك هو سر نجاحه<br />والله أعلم<br />وأدع الله أن يرحم والداي والمسلمين ويدخلنا أجميعن جنات النعيم"
