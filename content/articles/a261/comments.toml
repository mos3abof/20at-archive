order = 44
subject = "النواري - ليبيا"
text = "بسم الله الرحمن الرحيم<br />و الصلاة و السلام علي خير المرسلين<br />السلام عليكم و رحمة الله و بركاته<br />اما بعدفان الحجاب فرض علي كل مسلمة عند ما تبلغ لعموم الادلة ف يالقران في سورتي النور و الاحزاب و الاحاديات النبوية الصحيحة ، و من يتعرض علي ذلك فقد ضل ضللاً بعيدا ، الحجاب ليس غطء الراس فقط بل الجسم كله عليه ان يكون ساتر لكل الجسم و ان يكون فضافض و غير شفاف ، و اما بخصوص عمر خالد فهو كما يبدو لا يسير وفق منهج السلف وهناك المشايخ الافضل لاخد منهم الفتوي و ما الي ذلك كمشاخنا ألالباني و بن باز و العثيمين رحمة الله و ما الذين موجدين حاليا مثل الشيخ ربيع المدخلي و الشيخ صالح ال الشيخ ، فتقوا الله و علموا ان راس المال هو الدين .<br />ز من قال ان الحجاب لا يعجب صحابه او حتي عائلته فقد طاع مخلوق و لم يطع الخالق فاتقوا الله في بنتكم و كافة اختلاط و سفور و الله ولي التوفيق.<br />اخوكم علي من ليبيا"
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019003742/http://www.20at.com:80/article.php?sid=261"

[[comments]]
order = 45
subject = "اتقوا الله"
text = "لماذا تتهمون الاستاذ عمرو خالد فيمن اخطأت في فهم معنى الحجاب و انا قد سمعت تعبير محجبات عمرو خالد ولكن لم اسمع انه اطلق على fashionable محجبات و المفروض ان نشكر الاستاذ عمرو خالد لمل يبذله من جهد لامتنا و ليس ان نهاجمه و اصبروا على هؤلاء الفتيات و لا تبعدونهم بهذا الاسلوب عن طريق الله عسى ان تكون هدايتهم قريبة"
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019003742/http://www.20at.com:80/article.php?sid=261"

