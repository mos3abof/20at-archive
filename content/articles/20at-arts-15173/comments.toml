text = "لا حول ولا قوة إلا بالله العلى العظيم …حالهم فعلا يضايق وحسببى الله ونعم الوكيل فى إسرائيل اللى مالهاش كبير …والله بالأرقام اللى مكتوبة دى والا بتتصرف فى اليوم الواحد على التكية وإطعام الفقراء يبقى ربنا يعينهم ويقدرهم ويجعلة فى ميزان حسناتهم …وياااااا ااارب يرفع عنهم معاناتهم"
