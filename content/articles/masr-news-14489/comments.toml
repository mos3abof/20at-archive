subject = ""
author = "مصطفى خليل"
posted = "2009-12-22"
text = "كلام سليم جدا<br />يا ريت يا جماعة نعرف ان مصر بتعانى من مشكلة سوء الادارة والرجل ده عنده العلم والخبرة . وفى شىء مهم جدا لازم ندركه ان مجرد ترشح البرادعى ونجاحة دى هتكون الخطوة الاولى من اجل التغير وتثبيت مبدا تداول السلطة فى ازهان الناس وان اللى يشتغل ويعطى للبلد هو اللى يستنى"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223181407/http://www.20at.com:80/masr/news/14489-2009-12-21-09-46-43.html"

