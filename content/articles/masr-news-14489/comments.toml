author = "ممدوح زكى زخارى جرجس"
posted = "2009-12-22"
text = "انت مين يا برادعى؟<br />انت ما الا موظف عادى و طلعوك على المعاش؟<br />أصحى بقى و بلاش تخاريف!!!<br />قرفتنا بغبائك و ارحمنا و خلينا نشوف مصالح الحياة<br />قال برادعى قال؟<br />انت و اللة العظيم من وجهة نظرى لا تساوى ثمن حمار فى سوق النخاسة؟"
archived = "2009-12-23"
