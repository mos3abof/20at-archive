author = "دستور تاني"
posted = "2009-12-21"
text = "يا برادعي<br />الدستور ما يهمناش في شيء<br />الاخوان ما يهموناش في شيء<br />اللي يهمنا هو الشباب ازاي حيشتغل وازاي حيتجوز يا برادعي<br />هي دي المشكلة الرئيسية يا برد<br />ازاي حتحل مشكلة الشباب اللي بتتفاقم يوم بعد يوم<br />ينعل ابو الدستور على ابو الاحزاب على ابو الزفت والنيله<br />ازاي الناس حتعيش يا برادعي<br />ازاي الناس حتتعالج يا برادعي<br />يا برادعي زفت 60% من الشعب دخله لا يتناسب مع الاسعار<br />هناك هوه كبيره بين الدخول والاسعار يا برادعي<br />لسه حتغيروا الدستور تاني يا ولاد الكلب<br />_______________ _______________ _<br />مش رضوى حسن ولا مروى صلاح"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223181407/http://www.20at.com:80/masr/news/14489-2009-12-21-09-46-43.html"

[[comments]]
