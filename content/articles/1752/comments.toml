[[comments]]
order = 0
subject = "لا اوافق"
author = "نيفين"
posted = "2006-04-20"
text = "يا جماعه ساعات كتير الاعدام بيبقى ضروره<br />مثلا ف قضايا القتل دا بيبقى قصاص<br />فى قضايا الاغتصاب دا بيبقى ضروره و يا ريت يتطبق<br />اللى نفسى فعلا يتلغى حكم الحبس مدى الحياه لان دا بيبقى اشد من الاعدام بكتير<br />انا لو سالونى اتعدم و لا اتسجن مدى الحياه هقول اتعدم طبعاااااااااااا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152537/http://www.20at.com/article2.php?sid=716"

[[comments]]
order = 1
subject = "احاله اوراق المتهم الى المفتى"
author = "مسلمه"
posted = "2006-04-20"
text = "الحقيقه انا لا اؤيد ابدا فكرة الغاء حكم الاعدام لانه عقوبه رادعه لمن يقتل نفسا متعمدا<br />قال الله تعالى\"ولكم فى القصاص حياة يا أولى الالباب\"<br />حقيقى لو القاتل لم يقتل سيكون ذلك مدعاة له على التمادى فى ذلك وربما ظهور فئه من السفاحين والقتله<br />ولذلك ليس علينا ان نعدل على القوانين السماويه فمن نظن نفسنا لنفعل ذلك<br />اللهم احينا على الاسلام وامتنا على الاسلام وادخلنا الجنة دار السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152537/http://www.20at.com/article2.php?sid=716"

[[comments]]
order = 2
subject = "معلش"
author = "مسلمه"
posted = "2006-04-20"
text = "معلش يا جماعه انا كتبا قوانين سماويه هو اللفظ ده صح ولا غلط ياريت تردو عليا<br />اللهم لا تؤاخذنا ان نسينا او اخطانا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152537/http://www.20at.com/article2.php?sid=716"

[[comments]]
order = 3
subject = "كلام فارغ"
author = "نور الدين"
posted = "2006-04-21"
text = "اذا كان من يعدم لجرم اقترفه كالسرقه والمخدرات و القتل و التجسس فهذا امر فيه وجهه نظر لكن هناك من يعدم على اسمه وعلى معتقده واذا لم تصدقوا اسالوا اي عراقى؟؟؟؟؟؟ملاحظة في يوم واحد فقط اعدموا لهذا السبب48 انسان----ولكم التعليق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152537/http://www.20at.com/article2.php?sid=716"

[[comments]]
order = 4
subject = "موضوع عقوبة الاعدام"
author = "محمد حسن محمد (سند)"
posted = "2006-04-21"
text = "يقول المولي عزوجل (ولكم في القصاص حياة يااؤلوا الالباب...)الايةومن ناحية تعزيرية نجد انه يردع اي مجرم من اتيان هذا الجرم الذي ينتهك ابسط حقوق البشر(حق الحياة) فكان لابد ان يكون الجزاء من جنس العمل\u001a"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152537/http://www.20at.com/article2.php?sid=716"

[[comments]]
order = 5
subject = "الشروط"
author = "اشرف"
posted = "2006-04-21"
text = "أوافق بشده على الاعدام فى جرائم القتل العمد فقط وان تكون هناك شروط جازمه لأعتبار القتل عمدا. أما عن حقوق الانسان فأنا( والعياذ بالله من أنا)أسأل أناس حقوق الانسان عن حق الانسان الذى قتل أليس له حق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152537/http://www.20at.com/article2.php?sid=716"

[[comments]]
order = 6
subject = "موافقة"
author = "محمد"
posted = "2006-04-21"
text = "هذا حكم دين وشرع أوافق ولا أوافق مش قصدى الإعدام فقط أى حكم نرجع إلى الشريعة وهى اللى تحكم مش بنعرض الأمر للإستفتاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152537/http://www.20at.com/article2.php?sid=716"

[[comments]]
order = 7
subject = "العقل زينه لمن يريد"
author = "اشرف"
posted = "2006-04-22"
text = "الاخ محمد لاأعتراض على حكم الدين والشرع وانا موافق لاتعنى انه استفتاء بل تعنى قناعتى بما جاءت به الشريعه رجاء حاول تقرأ كلامى للاخر وتفهمه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152537/http://www.20at.com/article2.php?sid=716"

[[comments]]
order = 8
subject = "الاعدام سردولة"
author = "جلال الدين حسن"
posted = "2006-04-23"
text = "انا بفتكر ان المسائل المتعلقة بالشرع لا يكثر فيها الجدال خاصة ان الاعدام في الدولة يخضع لضوابط قانونية بحتة والقانون نفسة يستنبط من الشرع الزى وضع كلمة الفصل فى ذلك وهوماجاء فى الآية الكريمة{ولكم فى القصاص حياة يا اولى الالباب}صدق العظيم..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152537/http://www.20at.com/article2.php?sid=716"

[[comments]]
order = 9
subject = "كلمة الله هي العليه"
author = "أحمد محمد أبو الليل"
posted = "2006-04-24"
text = "في الحقيقه انا مؤيد لفكرة الاخت مسلمه وذالك لان المفروض والصحيح تطبيق شريعة الله عز وجل قبل كل شيء. إذا الغي قانون القصاص سوف يتجريء كل مجرم علي جريمة القتل ومن ثم يفسد المجتمع ويتفكك ومن جهه اخري يضيع حق من حقوق الاسلام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152537/http://www.20at.com/article2.php?sid=716"

[[comments]]
order = 10
subject = "كلمة الله هي العليه"
author = "أحمد محمد أبو الليل"
posted = "2006-04-24"
text = "فانا يا جماعة موافق بكل شدة علي قانون الاعدام فالقرآن الكريم (كتاب الله عز وجل)فرض القصاص وفي النهايه اود انا اقول *كلمة الله هي العليه*."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152537/http://www.20at.com/article2.php?sid=716"

[[comments]]
order = 11
subject = "لالالا (( للحكم البشري))"
author = "ADMEN"
posted = "2006-05-21"
text = "لا يمكن ان يكون منطلق مثل هذه العقوبه الكبري بيد انسان ليحكم بها علي انسان مثله دون ان نتاكد من هل هذا النسان من فصيله الملاكه ام هو انسان مثلا يحتمل ان تكون نفسه عباره عن خليطاو مزيج من اهداف ماليه اوماديه او اته يحمل الكرهيه والحقد كمثل معظم الناس وشــــكـرا ADMEN"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152537/http://www.20at.com/article2.php?sid=716"
