[[comments]]
order = 2
subject = "شيرين"
text = "السلام عليكم أخي الكريم. رداً على تساؤلك، فإن السيدة فاطمة هي أصغر بنات رسول الله وليست أكبرهن. فقد سبقتها زينب، ورقية، وأم كلثوم. أما فاطمة فقد أنجبها الرسول عليه الصلاة والسلام قبل بعثته بخمس سنوات فقط."
archived = "2004-06-25"
capture_url = "https://web.archive.org/web/20040625072302/http://www.20at.com:80/article.php?sid=368"
