[[comments]]
order = 1
subject = "عن الوجه الأسود للست حلاوتهم"
text = "رغم أن الوجه الأسود ليس تهمة إلا أن الست حلاوتهم .. ليست أمورة ولا يحزنون .. فهي واحدة من نساء امريكا القبيحات اللاتي يتلذذن بالقتل الامبراطوري .. (لا دخل في قبحهن للون أو الوزن على طريقة مادلين اولبرايت .. انما القبح هو في الروح .. الأمريكية المتغطرسة)<br />كوندي (حسب اسم الدلع الذي اختارته كاتبة الموضوع ) هي قاتلة ذات دم بارد .. يوم استشهاد احمد ياسين ما كان منها إلا أن قالت : عادي ، ده ارهابي .. وبررت وحشية اسرائيل ..<br />الكاتبة دافعت طويلا عن كوندي .. باعتبارها احد رموز التحرر العنصري واعتقد ان هذا ليس صحيحا فليس كل اسمر هو محرر عنصري فهي ليست سوى .. قاتلة فاتقوا الله فيما تكتبون"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506054654/http://www.20at.com:80/article.php?sid=115"
