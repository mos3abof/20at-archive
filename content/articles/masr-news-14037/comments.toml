author = "منصور"
posted = "2009-11-15"
text = "ما خلاص يا عم خضيرى<br />الرجالة اللى كانت فى وشها شنبات ماتت فى حرب 73<br />و دلوقتى فية رجالة مدجنة عاملة زى الفراخ البيضاء بتاع المزارع لا بتهش ولا بتنش<br />اقصى حاجة عندهم انهم يقعدوا على القهوة يشتموا شوية ويرجعوا البيت على حسب الوصف ( فذهب الى اهلة يتمتطى ) ثم يتناسل وينام ليصحوا مبكرا للوقوف فى طابور الخبز<br />رجالة من غير شنبات"
archived = "2009-11-18"
capture_url = "https://web.archive.org/web/20091118173640/http://www.20at.com:80/masr/news/14037-2009-11-15-08-30-11.html"

[[comments]]
order = 1
subject = ""
author = "الرجالة موجودين"
posted = "2009-11-15"
text = "الرجالة موجودين<br />وكانوا امبارح ماليين الشوارع والحارات وفى الاستاد و كل واحد شايل علم زى الاهبل وبيشجع كورة<br />الرجالة موجودين بيرقصوا فى الاستاد والا انت مش شايفهم<br />الرجالة موجودين امام السفارات وكلهم عايزين يهربوا من البلد<br />وكل واحد خايف على نفسة ولو اتكلم هيمسكوة والتهمة جاهزة - مشترك فى تنظيم ارهابى جهادى ولقوة داخل موقع جهادى على النت وكمان بيحاول يصنع قنبلة ذرية فى المطبخ بتاع الشقة بتاعتة<br />واللة تهم بالشكل دة<br />يعنى ممكن يتهم بانة بيصنع صواريخ وطيارات وقنابل ذرية وبيتعاون مع حماس وحزب اللة ويروح امام محكمة امن الدولة<br />دة مش نكتة<br />ولكن اللى بنقراة كل يوم كدة<br />علشان كدة الرجالة لبست طرح وقعدت فى البيت والنسوان هى اللى بتشتغل<br />سيدى المستشار عيش حياتك وانسى"
archived = "2009-11-18"
capture_url = "https://web.archive.org/web/20091118173640/http://www.20at.com:80/masr/news/14037-2009-11-15-08-30-11.html"

