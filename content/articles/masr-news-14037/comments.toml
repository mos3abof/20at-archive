author = "ممدوح زكى زخارى جرجس"
posted = "2009-11-16"
text = "و انت يا خضيرى ماذا تكون؟<br />ألست رجلا؟ ام ماذا نقول يا سيدة /الخضيرى<br />باردون يا مدام /خضيرى يا مرة و يا غير راجل؟!!!<br />أخص على الالفاظ؟<br />دى الفاظ الصيع و ليست الفاظرجال القانون الشرفاء !!!<br />أتفو عليكى مرة قليلة الادب!!!؟"
archived = "2009-11-18"
capture_url = "https://web.archive.org/web/20091118173640/http://www.20at.com:80/masr/news/14037-2009-11-15-08-30-11.html"

