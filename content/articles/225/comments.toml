[[comments]]
order = 1
subject = "لا طبعا"
text = "السلام عليكم<br />أنا ضد التفجيرات التي حدثت في البرجين لان هناك مسلمون ماتوا في التفجيرات اللي حصلت 11/9وغير كدة إن اللي كانوا في البرج لم يحملوا علينا سلاح فتخيل كده نفسك واحد امريكي اتولدت و عشت في أمريكاو ملكش دعوة بالسياسة و لا ليك في أي حاجة و رايح تقضي مصالحك حد موتك و كمان مات فيها سيدات لا يجوز قتلهم<br />هذا هو رأي"
archived = "2004-09-12"
capture_url = "https://web.archive.org/web/20040912172436/http://www.20at.com:80/article.php?sid=602"

[[comments]]
order = 2
subject = "فكرة"
text = "طبعا أنا مع تكرار 11-سبتمبر ...يعنوا انتوا عايزين السنة الجاية تيجي من غير 11سبتمبر ...يعني يجي يوم 10 وبعده 12 علي طول ...<br />نوقع اليوم ده من<br />حساباتنا<br />نرميه في اقرب باسكيت ...نقوله بمنتهي البساطة لامؤاخذة احنا لغينا 11 سبتمبر وهنعمل يوم تاني نسميه محمود ...<br />اللي انا عايز اقوله ان اخطر من 11 سبتمبر نفسه البعبع اللي اليوم ده سابه جوانا وخلانا نبقي موش عارفين نتعامل مع اليوم ده علي انه يوم عاوي<br />الف شكر<br />فكرة ..!!"
archived = "2004-09-12"
capture_url = "https://web.archive.org/web/20040912172436/http://www.20at.com:80/article.php?sid=602"

[[comments]]
order = 3
subject = "سنفور الزعلان"
text = "ايه ياجماعة ... ماتحسوا على دمكم شوية , هو علشان اناكاتم فى قلبى وساكت تؤم توصل للدرجة دى ؟ , ماحدش بعت هدايا وقلت الظروف الاقتصادية واكيد هاتتحسن مع البشمهندس اللى هاينضف الوزارة , معدش رفع سماعة الهاتف ولا بعت برقية تعزية يقولى كل سنة وانت طيب وقلت اكيد المواصلات برده , والناس لما بينت فرحتهم بيا صوروهم وقالوا ارهابين فرحنين فى الناس اللى ماتوا فى برج مش عارف ايه , لكن توصل انهم هايلغوا 11 سبتمبر من اول السنة الدراسية اللى جاييه لأ بأه .. اييييه .. هى سنة ستة.<br />منك لله ياابن بادن انت وبوش ... كان مالى انا ومال 11 سبتمبر , ماكنت اتولدت فى العيد الكبير احسنلى."
archived = "2004-09-12"
capture_url = "https://web.archive.org/web/20040912172436/http://www.20at.com:80/article.php?sid=602"

[[comments]]
order = 4
subject = "لا يفل الظلم الا الظلم طبعا معاه"
text = "انا مع كل عمل يدمر غطرسة امريكا وكل الشعوب التي تضطهد الاسلام والمسلمين في كل مكان ولو حدث كل يوم انهيار او انفجار في برج او مطار او مدرسة فهذا هو الذي نتمناه الم تنظروا الي الذي يحدث في العراق وفلسطين هل هم بشر ونحن من حجارة يا عالم افيقوا من ثباتكم العمييييييييق وسيبوووكم من الرومانسية الكدابة<br />واحد مفروس من الغرب كلة"
archived = "2004-09-12"
capture_url = "https://web.archive.org/web/20040912172436/http://www.20at.com:80/article.php?sid=602"
