subject = "و ما الجديد يا مى"
author = "نيفين..نيفى..نوفا"
posted = "2006-11-12"
text = "جهدك ف الموضوع واضح و الموضوع جميل يل مى بس بيقلب المواجع<br />هى كلمه مصطفى بكرى للمرم المليون<br />قيم تتفسخ<br />وطن تذروه الرياح<br />سفينه تتجه نحو الغرق<br />هى دى مصر دلوقتى<br />للاسف الشدييييييد"
archived = "2006-11-23"
