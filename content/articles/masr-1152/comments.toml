subject = "رد على رقعه"
author = "مفقوع برضه"
posted = "2006-11-13"
text = "هو انا صاحب التعليق الي قبل منه برضه<br />انا برد على رقعه ان الافلام دي نوع من الارهاب للشعب<br />عشان ما يعملش كخ يقوم عمو ي............<br />وبمعرفه عمو الكبيييييييييير اوي اوي"
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123202037/http://masr.20at.com:80/article.php?sid=1152"

[[comments]]
order = 7
subject = "وجهه نظر(الى صاحب تعليق دا وا..... وتعليق لا مؤاخذه)"
author = "نيفين نيفى نوفا"
posted = "2006-11-16"
text = "بص انا هقوللك حاجه<br />اولا فعلا انا قصدت اقتباس الكلمه بس لان كان قالها ف القاهره اليوم ايام موضوع العباره و مننكرش انها صح و فى الجون و فعلا فى مكانها و بتلخص اوضاع كتير<br />و فعلا مصطفى بكرى ف الاونه الاخيرع بتحيط بيه علامات استفهام كتير اخرها اصطحاب الرئيس ليه ف رحلته الفاشله الاخيره<br />و علامات الباستفهام دى واجهتخ بيها منى الحسينى ف برنامجها ناسف للازعاج<br />بس سيب كل دا<br />انا ليا وجهه نظر معينه و هى اعطاء كل ذى حق حقه<br />بمعنى<br />الراجل دا برده ليه مواقف معينه و كتابات من نوع خاص فعل بتمس الواقع<br />و دا ظهر اوى ايام غزو العراق و سقوط بغداد<br />و برده مننكرش انه كتير تصدى بحملات واسعه للفساد<br />المهم اللى اقصده خد الكويس بتاعه و سيب الوحش<br />و ارجع اقوللك انا بس قصدت اقتباس الكلمه و ليس الانتماء لمصطفى بكرى"
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123202037/http://masr.20at.com:80/article.php?sid=1152"

[[comments]]
order = 8
subject = "ملعون أبو بلد حاكمها منوفي جعر"
author = "مهاجر"
posted = "2006-11-18"
text = "تعرفوا إيه قررت بعد الإستخارة أطلق البلد دي بالتلاتة وأعمل هجرة لكندا. بلا فلقه منك له ياخويا.<br />والله الإستاذ بكري مهما تواسخ يبقى من اللي لسه فيهم ريحة وطنية وخير، وجزمته أشرف من كلب المنوفية الأهتم اللي ضابعكم كلكم شوية عساكر أمن مركزي بيخافوا من خيالهم ووكلاهم البلهارسيا.<br />وإلا مش قادرين على الجحش المنوفي المكلبظ؟"
archived = "2006-11-23"
capture_url = "https://web.archive.org/web/20061123202037/http://masr.20at.com:80/article.php?sid=1152"
