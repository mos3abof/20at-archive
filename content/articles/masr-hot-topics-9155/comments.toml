text = "خروب كلية الطب الاصلى بتاع واحد اسمه الحج يوس وولاده من بعده انا شغال فى المحل ده وعلى فكره هو اسمه خروب كلية الطب علشان اول فرع اتفتح عند كلية الطب فى ميدان الخرطوم والعربية لسه موجوده لحد دلوقت وفى ناس بتجلنا الفرع بتاع السيوف بيقولولنا ان هما كانو بيشربو عند الحج يوس من حوالى 50 سنه انما الكلام اللى مكتوب ده مش مظبوط ده رقمى لو عايز تتأكد 0172763260"
