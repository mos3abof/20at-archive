[[comments]]
order = 2
subject = "مصيبه"
author = "عبدالله مفتاح"
posted = "2006-07-12"
text = "المشكله ان الاتنين مخطئين ان كان عمرو خالد ولا وجدي غنيم<br />وجدي غنيم اخطا لما نشر رسالته على الملا<br />عمرو خالد اخطا بعدم سماعه للنصيحه وبصراحه عمرو خالد مش بيسمع للنصائح حتى وان كان على خطا<br />والحل؟؟؟؟؟؟<br />الحل ان علماء الامه يقعدوا مع بعض في حضور كل الاطراف ويتوصلوا لحل<br />لان فعلا القعده دي لازم تتعمل لتصفيه الجو المتوتر<br />لاننا كده شكلنا وحش جدا<br />والعلمانيين بينفخوا في الرماد بيخلوه نار<br />يا اهل العلم ويا اهل الصلاح لطفا بنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142456/http://www.20at.com/article2.php?sid=1067"

[[comments]]
order = 3
subject = "تعليق على موضوع عمر خالد"
author = "راوية"
posted = "2006-07-13"
text = "اقسم بالله انا شعب حرام انعيش اذا اجا استاذ مثل عمر خالد ودعانا وحبنا والتم اليه الشباب وكثير من شباب الغرب اسلموا على يده نقول انه شيخ عصري يمشي حسب مود الشباب على عكس ما هو يدعو له فهو يعلم نقاط الضعف عند الشباب فلا يضغط علينا كثيرا بل يسهل لنافهم ديننا فالاسلام يسر وليس عسر فحسبي الله ونعم الوكيل واقول الى الذين يهاجمو كل من عمر خالد وسامي يوسف بدلا من هذا الجدال انظر لما يحدث في فلسطين والعراق بدلا من ان تنظر الا ان تقع الاخرين في اخطاء وتعايرهم وتضيع وقتك في هذا كله فانتباه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142456/http://www.20at.com/article2.php?sid=1067"

[[comments]]
order = 4
subject = "لمن أراد الحق"
author = "ايمن وفيق"
posted = "2006-07-13"
text = "إن ولائنا إلى الله ورسوله صلى الله عليه و سلم لا لشيخ و لا لشخص معين فمن وافق الله و رسوله نواليه ومن خالفهما نرده و إذا لم ينتصح نكرر النصيحه له مرات و مرات فإن أصر و لم ينتصح (وكان من الذين يؤثرون في جموع المسلمين) فإذاً نحذر مما يقول و نبرأ إلى الله تعالى و هذا ما فعله الشيخ/وجدي غنيم حفظه الله فجزاه الله (عما قال و نصح و أرشد و بين و وضح)خير الجزاء و السلام عليكم و رحمة الله و بركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142456/http://www.20at.com/article2.php?sid=1067"

