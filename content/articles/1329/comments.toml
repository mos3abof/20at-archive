[[comments]]
order = 14
subject = "حاجة تلخبط"
author = "لور دكاش"
posted = "2006-07-13"
text = "لو كان الشيخ وجدي غنيم أرسل بهذه الرسائل حقا، فمن الصعب علينا أن نصدق أنها نصيحة في الله ! لأنها إذا كانت كذلك فعلى الأقل كان على الشيخ وجدي أن يحتفظ بها سرا.. وحتى إذا أراد تحذير الشباب من اتباع عمرو فهناك الكثير من الطرق أفضل من إثارة الفرقة بين شباب المسلمين والطعن في واحد من أهم دعاتهم.<br />هذه ملاحظة حول الشكل وطريقة التعامل مع الأزمة.. أما بالنسبة لمضمون الانتقادات التي وجهها الشيخ وجدي إلى عمرو خالد فعليها العديد من الملاحظات...<br />صحيح أنني لست أهلا لتفنيد خطاب أي من علمائنا الأجلاء، لكنني كمسلمة مثل الكثيرين ممن يعيشون الحياة دون أن يشعروا بأن إسلامهم قيد على حريتهم في التفكير، لا أستسيغ أن يكون جوهر الهجوم على عمرو خالد هو احترامه للفن والفنانين، وإصراره على التأكيد أنه لا ينتمي للإخوان المسلمين، فكل هذا من حقه على ما أعتقد، خصوصا وأنه لا يقدم نفسه على أنه يمثل الإسلام، على عكس كثيرين غيره ممن يعتقدون في أنفسهم أنهم شيوخ الإسلام الذين لا يخطئون..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142456/http://www.20at.com/article2.php?sid=1067"

[[comments]]
order = 15
subject = "واااااااااااااسلاماااااااااااااة"
author = "ابو يوسف"
posted = "2006-07-30"
text = "السلام عليكم ورحمة الله وبركاتة<br />اما بعد فبالنسبة لتدخل الشيخ وجدى غنيم فيما يقوم بة الاستاذ/عمرو خالد هوة من الضروريات لانة بالفعل يوجد اكثر من ذلك من الاخطاء لعمرو فهو بالفعل فتن بالكاميرات والشهرة ولن اطيل<br />اما بالنسبة للمصلة لمن فلو كنتم لاتعلمون الا لغة المصالح فان لله وان الية راجعون فالدين برىء منكم وبرىء بكل من تكلم فى الدين لاجل مصلحة فيجب ان يكون العمل خالص لله وهذا ماقام بة الدكتور وجدى غنيم حيث تناصح مع عمرو وعمرو رفض فاشعلت الجرائد الحرب ولا عجب فى ذلك فقد استغل الصحف والجرائد لغة الفرقعة الصحفية مثل المباريات تماما واقول ايضا تب اللى الله ياعمرو واذكرة ونفسى بتقوى الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142456/http://www.20at.com/article2.php?sid=1067"

[[comments]]
order = 16
subject = "الظلم ظامات يوم القيامة"
author = "امة الله"
posted = "2006-08-25"
text = "اخوانى حرام عليكم كل هذا الهجوم على شيخنا الفاضل الذى نسممعه اكثر من ثلاثين عامالانه كعادته يقول الحق ولا يخشى فالله لومة لائم واحب اقول لكم ان الشيخ وجدى اتصل بعمرو خالد مرارا وتكرارا وارجعو فى هذا الىموقع الشيخ وجدى لكى يراجعه فيما يقول ولكن لم يرد وعندما وصل الامر للعقيدة بقول عمرو ان الشيطان عاصى ولم يكفر وغيره فكان لزاما على الشخ الفاضل ان يرجعه فارسل له الخطاب ولكن هذه الرسالة وصلت للاعلام الله اعلم كبف وانما انا اؤمن انه خير ولكن للاسف هو الحب الاعمى للاشخاص وليس من اجل رفعة ديننافهذا عمرو اللذين تتحدثون عنه وكأنه نبى استغفر الله هو تلميذ الشيخ الحبيب وجدى فكان لزاما على الاستاذ مراجعة تلميذه ولكنه لم يلتفت لانه فتن ولبعاذ بالله اللهم ثبتنا على قول الحق الى ان نلقاك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142456/http://www.20at.com/article2.php?sid=1067"

