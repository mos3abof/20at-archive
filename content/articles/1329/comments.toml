[[comments]]
order = 7
subject = "من اين لك هذا؟"
author = "hadia amr"
posted = "2006-07-13"
text = "السلام عليكم و رحمة الله و بركاته<br />لقد أغضبنى بشدة ما قرأته من هجوم لاذع و سباب من الشيخ وجدى على أستاذنا و قدوة كل الشباب فى مصر والعالم العربى الاستاذ عمرو خالد وأود أن أقول للشيخ وجدى من أين لك هذا ايها الشيخ ان كان لك دليل اعرضه لنا على الملأ و ان كان استاذنا يريد أن يضل الشباب فكيف ارتدت مئات البنات الحجاب و جعله الله سببا لهداية الكثير من الشباب وأنا واحدة من هؤلاء فلم نجد أحدا من الشيوخ قبله أو بعد ظهوره يفهم مشاكلناوىناقشنا فيهابهذه المنطقية والعبقرية فى الوصول الى صميم قلوبنا و عقولنا(ارجوكم اتركوا الاستاذ عمرو فى حاله)لاننا لن نتخلى عنه أبدا.أود الاشارة السريعة الى ان الشيخ لم يترك أحدا الا وكان له نصيب من هجومه حتى مفتى الجمهورية والشيخ طنطاوى الذ وصفه ب(سىء).وفى النهاية أطلب من ادارة الموقع أن تقول لنا مصادرهاعن صحة خطاب الشيخ وجدى.وبارك الله لنا فى الاستاذعمرو وفى(صناع الحياة)!!!!<br />بسم الله الرحمن الرحيم (وادعوالى سبيل ربك بالحكمة و الموعظة الحسنة)ـ ابناء عمرو خالد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142456/http://www.20at.com/article2.php?sid=1067"

[[comments]]
order = 8
subject = "بس خلاص"
author = "يااااااااااااااااه الموضوع ده قديم أووووي يا ربنا انتو المفروض بتحطوا موضوعات جديدة في عشرينات لكن موضوع الشيخ وجدي وعمرو ده قديم طحن"
posted = "2006-07-13"
text = "بالنسبةلرابطة محبي عمور و ابناء عمرو خالد ..يا بنتي ارحمي نفسك شوية الراجل جه و اقل البوئين و مشي.. والله لوتتعاملوا مع عمروخالد مباشرة مش هتطيقوا تبصوا في وشه<br />بالمناسبة مئات البنات اللي اتحجبوا على ايد عمرو بعضهم ارتد و خلعوا الحجاب و بعضهم لبسوا حجاب ملوش لازمة و ملتزموش خالص..يعني ارتدوا بشكل آخر ,,لكن فيه ناس ثبتت لأن ربنا هداها مش عمرو و اللي لبسوا الحجاب لبسوه علشان ربنا مش عمرو انما اللي لبسوه علشان عمروقلعوه فورا بعد ما عمرو نسي انه داعية وبقى سياسي او مصلح اجتماعي او راجل كده جنتل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142456/http://www.20at.com/article2.php?sid=1067"

[[comments]]
order = 9
subject = "الجنازة حارة ؟؟؟؟؟؟؟"
author = "واحد فاهم"
posted = "2006-07-13"
text = "ماشاء اللة<br />الاستاذ وجدى غنيم بعت رسالة الى الاستاذ عمرو خالد ولما عمرو مردش علية اضطر ينشر الرسالة فى الجرايد ؟؟؟<br />اية الهبل دة هوا ماسك علية ذلة ولاحاجة ؟<br />وبعدين الهبلة اللى بتقول ابناء عمرو خالد وببتكلمى بالفصحى<br />الدين للة والنوايا ربنا علم بيها<br />امتى تفوقى يامصر لحسن انتى عجزت قوى على الهبل دة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142456/http://www.20at.com/article2.php?sid=1067"

[[comments]]
order = 10
subject = "الموضوع كبير"
author = "المواطن المطحون"
posted = "2006-07-13"
text = "في الاول عايز اقول ان انا بحترم الاتنين عمرو خالد و الشيخ وجدي<br />تاني حاجه انا شايف ان التعليقات اتقسمت بين فريقين محبي عمرو خالد و المقتنعين بفكره و الفريق التاني محبي وجدي غنيم و اعداء عمرو خالد يعني من الاخر محدش اتكلم بشكل موضوعي كله هجوم او دفاع بدون اي كلام مفيد<br />و معلش يا عشرينات الموضوع ده اثر في الناس بالسلب اما انهم كرهوا عمرو خالد او الشيخ وجدي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142456/http://www.20at.com/article2.php?sid=1067"

[[comments]]
order = 11
subject = "كفانا سطحية"
author = "هانى محمد"
posted = "2006-07-13"
text = "هناك من المشكلات التى تفوق هذه المهاترات، فالسيد وجدى غنيم واحد ممن رسخوا السطحية والسخرية من كل شىء والتطاول واستخدام ألفاظ لا تليق، والسيد عمرو خالد أيضا واحد ممن رسخوا السطحية أيضا على مستوى الخطاب الدينى، وكلاهما يشترك فى أنه يفتقد الى المرجعية وعدم تلقى العلم بشكل ممنهج سواء على يد شيخ أو مؤسسة علمية،فالوطن(مصر) لديه كثير من المشكلات التى تعلو على هؤلاء ومن الممكن أن يتم توجيه الشباب لها ولكنها السطحية يا سيدى."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142456/http://www.20at.com/article2.php?sid=1067"

