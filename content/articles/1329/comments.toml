subject = "عمرو مبيسمعش الكلام"
author = "يعني هي المشكلة في نشر الرسايل؟ طيب وايه يعني لو نشرهافي الاعلام المشكلة انه عمرو خالد بقت سمعته سيئة اقصد انه فعلا مبقاش يسمع كلام حد غير نفسه و الشلة اللي حواليه وده بقى شيء مقرف جدا انه يتفرض علينا"
