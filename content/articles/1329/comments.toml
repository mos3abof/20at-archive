text = "عندما يقول عمرو خالد \"عيد ميلاد علي ابني\", ويشكر بقوة في سامي يوسف مع ان الموسيقي (حرام),و يقول لمن يقول \"السلام عليكم\" في الصباح مثلا..قل \"صباح الخير\"<br />ثم ماذا عن اللحية؟؟ أم لأنه اخوان؟ وطبعا كله عند الاخوان (صابون)؟!!"
