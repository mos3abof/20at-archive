subject = "دبدوب"
author = "ريم بنت السعودية"
posted = "2006-07-12"
text = "لطفا اخواني في الموقع دخلت عرض لكن انبه الي اسمه دبدوب من ان يمس بلدي بكلمة واحدة فقد اطلعت على مسخراتك ومن بينها في منوعات بعنوان دموع الفضائيات وغيرها كثير مالك ومال السعودية غاير من خيرها اترك بلدي وشانها وانتم ياموقع عشرينات احذركم من المساس باي كلمة تجريح سواء عن بلدي او الاسرة الحاكمة دعوكم في مصر فهي اولى بلكلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142456/http://www.20at.com/article2.php?sid=1067"

