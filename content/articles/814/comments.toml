[[comments]]
order = 4
subject = "إلى الأخت الفاضلة / مسلمة صاحبة أول تعليق"
author = "شريف الديب"
posted = "2006-06-10"
text = "أختى الكريمة / مسلمة<br />قلتى \"مع ان كوره القدم كلعبه فيها اقاويل\"<br />واسمحى لى أن أتخطى حدودى فى الكلام وأسألك سؤال \" إن لم يكن مقلولة حضرتك هذه *تنطع* ، فبالله عليكى ما هو التنطع؟\"<br />الإسراف فى التحريم أسوأ من الإسراف فى التحليل ، وأعتقد أننا اكتفينا من الذين يتجادلون فى سفاسف الأمور ، وكنت أسأل الله ألا نكون منهم .<br />نرجو أن نشغل بالنا بما هو أهم ، أختى الكريمة ، المسلمون الآن نحو خمس العالم، فكيف يعرضون دينهم على سائر الناس؟ بإخبارهم \"أن الكورة كلعبة فيها كلام؟!!!\"<br />ليهتموا قبل أي شيء بأركان دينهم وعزائمه وغاياته العظمى! أما ما سكت الإسلام عنه فليس لهم أن يلزموا الناس فيه بشيء.<br />أعتب على حضرتك مجرد ذكر شئ مماثل.<br />مع إحترامى لشخصكم الكريم.<br />فى أمان الله."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123613/http://www.20at.com/article2.php?sid=918"

