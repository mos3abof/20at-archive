order = 0
subject = "الدعوه الى الله"
author = "مسلمه"
posted = "2006-06-08"
text = "والله جميل ان فتره تواجد اللا عبين المسلمين فى المونديال تبقى فتره دعوه الى الله<br />مع ان كوره القدم كلعبه فيها اقاويل<br />بس على العموم لو قدرو يحققو الاهداف دى ويدعوا الى الله بهذه الطريقه يبقى بارك الله فيهم واكثر من امثالهم<br />اللهم ارنا الحق حقا وارزقنا اتباعه وارنا الباطل باطلا وارزقنا اجتنابه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123613/http://www.20at.com/article2.php?sid=918"

