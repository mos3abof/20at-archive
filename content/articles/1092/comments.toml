[[comments]]
order = 0
subject = "إن هذا لكثيررررررر"
author = "هووووووووبه"
posted = "2006-08-07"
text = "ايه يا جدعان دا كل ما اتمناه القاه<br />لالالالالا<br />وبشر جديده بس قويه<br />بس بردو حضيف حاجه ابنه كان شاعر \"امين حداد\"<br />وفي رائعه ضمته هو وجاهين وفؤاد حداد<br />عن مصر<br />جيتو علي الوتر الحساس بردو<br />حداد<br />انتو عالم سكره"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132122/http://www.20at.com/article2.php?sid=1124"

[[comments]]
order = 1
subject = "تصحيح"
author = "هوووووبه"
posted = "2006-08-07"
text = "رائعه ضمته هو وجاهين وفؤاد نجم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132122/http://www.20at.com/article2.php?sid=1124"

[[comments]]
order = 2
subject = "؟؟؟؟"
author = "هانى"
posted = "2006-08-07"
text = "الحقوووو<br />خبر عاجل جدا لسة طازة<br />تامر حسنى ؟؟؟؟؟ حاول الانتحااااااار<br />فعلا فعلا حاول الانتحار وانقذوة فى اخر لحظة وموجود بالعناية المركزة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132122/http://www.20at.com/article2.php?sid=1124"

[[comments]]
order = 3
subject = "haraaam"
author = "الرومانسية"
posted = "2006-08-07"
text = "بعد الشر عليك ياتامر ياحبيبى لية تعمل كدا فى نفسك<br />حرام عليك نفسك معلش ربنا يساعدك<br />اوعى تفكرفى كدا تانى ابدا ابدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132122/http://www.20at.com/article2.php?sid=1124"

[[comments]]
order = 4
subject = "اة"
author = "توتا"
posted = "2006-08-07"
text = "لا<br />لا<br />لا<br />لو حبيت تنتحر يبقى لازم تقولى علشان انتحر معاك<br />احنا منقدرش نعيش من غير اغانيك اللى بتدوبنا<br />انا بمووووت فيك ياتامر حسنى واتمنى اعيش معاك حتى ولو فى السجن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132122/http://www.20at.com/article2.php?sid=1124"

[[comments]]
order = 5
subject = "ارحموونا"
author = "ده بيخالينا نعرف إن الحياةمافيهاش غيرك يا تموور يا حبيبى"
posted = "2006-08-08"
text = "يعم ما تغوور ولا تروح فى ستيين داهيه إحنا فييقين لحركات العيال دى<br />ياجدعان ارحمونا بتعلقيتكم دى الموضوع عن فلسطين ومقاومة وإحتلال سيبووكم من شغل العيال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132122/http://www.20at.com/article2.php?sid=1124"

[[comments]]
order = 6
subject = "تافه وهايف وسافل ومش راجل"
author = "ابن مصر الطيبة"
posted = "2006-08-08"
text = "يا جماعة احنا مش عايشين في الواقع ليه اليهود احتلوا فلسطين والان لبنان والامريكان في افغانستان والعراق والعالم العربي بيتمزق وغليان وايام الغضب بدات منذ شهر واكتر وعندنا في مصر الهيافه علي مستوي عالي الله ياخدكم اخذ عزيز مقتدر انت واللي الهايفين مثلك واللي المجانين معاك حرام عليكم قرفتونا في عيشتنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132122/http://www.20at.com/article2.php?sid=1124"
