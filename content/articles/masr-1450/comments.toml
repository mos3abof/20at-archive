posted = "2007-01-17"
text = "نيفين ونيفى ومش عارف اية انتا خفة يابت<br />تلاقيكى تخينة وشعر دقنك باين ومحدش بيبصلك<br />تعالى يابنت الشرموطة انيكك واريحك من الوهم اللى فى دماغك ولا اقولك ممكن نجيب وليد 68 دا خول بيتناك من طيزةونلاعبكم قدام بعض<br />انتبهى يانفين انتا ووليد ممكن نقرا صوركم فى نعذيب الشرطة بكرة<br />ولا اية يالذيذ يارايق"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042307/http://masr.20at.com:80/article.php?sid=1450"

