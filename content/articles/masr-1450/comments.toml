posted = "2007-01-16"
text = "هي ناقصة اهلك يا سيادة الخابور الاقتصادي , مش كفاية خوابير الحكومة الذكية الالكترونية الفضائية علشان تطلع سيادتك علينا تعلمنا الاقتصاد, واقتصاد حر ايه الي انتا جي تقول عليه انت عارف معنا الاقتصاد الحر ايه.<br />هو اصلا في اقتصاد في مصر علشان تقول احنا عايزينه حر او اشتراكي؟؟؟؟؟؟<br />شوف الصين ام الاشتراكية وشوف حالها يا حمار يا سيادة الخابور الاقتصادي."
