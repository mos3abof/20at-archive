text = "ماتزعليش من الردود دى أو ماترديش عليها دة واضح أنة داخل يهرج وهو مالوش علاقة بأى حاجة دة تلاقية كان بيلعب لعبة فى سايبر وقال يتسلة على النت شوية فياريت ماحدش يرد على حد بيتكلم باسلوب فية شتايم عشان انتو كدة بتحسسوة بالاهمية وشكراً"
archived = "2007-01-31"
