subject = "الاتحاد قوة"
author = "احمد قمر"
posted = "2007-01-23"
text = "اذا كانت دي هي الطريقة اللي هيتفاهم بيها شباب مصر والامل المنتظر ان شاء الله نبقي نقول علي شوية الامل الباقي يا الله السلام يا جماعة كل واحد ممكن يعرض وجهة نظره من غير قلة ادب وصدقوني طول ما احنا المقهورين بنعامل بعض كده يبقي من حق اللي فوقينا انه يعمل اكتر من انه يغلي رغيف عيش"
archived = "2007-01-31"
