[[comments]]
order = 19
subject = "الخابور المغرى"
author = "waleed68"
posted = "2007-01-17"
text = "لك ايها الخابور الذى شاء قدرنا ان نقابله على النت وواضح انك لا خابور ولا حتى بربور..ياراجل يا خابور اترك النت 24 ساعة اجى القيك عامل هيصة تؤكد انك لا بتفهم فى الاقتصاد ولا حتى زرت امريكا.<br />1- هو دخولى النت والحديث عن البسطاءومعانتهم معناه انى ماأردش على أمثالك من المدعيين<br />2- نفسى اعرف انت ليه مش عاجبك طموح الناس فى التعليم أنا ابتديت اِشك فيك وحيرتنى بغبائك انت عاوز طموح فردى ولا لا<br />3- جلوس الناس على المقاهى دليل بطالة لا يوجد لها حل من الحكومة يا أيها الخبير الاقتصادى ( ماتعرفش البطالة ) ولا دى كمان مسئولية الشعوب )<br />4- ثم ايها الخابور هو انا محتاج أسأل واحد سايح فى 2007 فى عصر الانترنت عن سعر اللحم أو الحليب فى امريكا أنا بقولك ان سعر الحليب واللحم فى أمريكا أقل من مصر يا أحمق.<br />5- ثم انا مش فهم انت بتدافع عن الحكومة فى تعليقك الاخير ليه ؟؟؟؟؟<br />يلا يا ابنى روح قول للى باعتينك تولعها يفهموك كويس حال الشعب المصرى.<br />وأفهم يا حمار الموضوع عن رغيف العيش مش عن الباتون سالى.<br />وللمرة الثالثة جميل يا هوارى<br />وحل عن سمانا ايها الخابور المغرى"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042307/http://masr.20at.com:80/article.php?sid=1450"

