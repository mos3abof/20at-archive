[[comments]]
order = 9
subject = "كلام خبرا"
author = "waleed68"
posted = "2007-01-16"
text = "مقال جميل يا هوارى ...<br />وكلامى للسيد الذى يدعى انه خبير أقتصاد فى أمريكا....يا محترم ويا ايها الخبير الاقتصادى تتنبأ بأن هذا هو قانون السوق الحر وتدافع عن ذلك بل تتنبأ بأن هناك زيادات متوقعة وتريد أن تفهمنا أن ده شى عادى جدا !!!...وان أحنا الى مش عارفيين نستوعب ...عموما هذا لا دخل له بالرأسمالية ولا الاهلى والزمالك....لانه وببساطة أصبح رغيف الخبز هو الشى الوحيد الباقى لعامة الشعب..ولو الحكومة لغت الدعم فمعناه مجاعة بلا شك...لان هناك ملايين من الشعب المصرى لا يأكلون سواه ملحوسا بغراء فول.<br />يا عم الخبير عندك فى أمريكا كيلو اللحمة ولتر الحليب أرخص كثيرا من مصر ...لا لشى الا ان الحكومة تقدم دعم للمزارعين والمربيين مع ان أمريكا أكبر دولة تستخدم نظام السوق الرأسمالى.<br />مرة ثانية جميل يا هوارى ..والبلد مش ناقصة خبرا"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042307/http://masr.20at.com:80/article.php?sid=1450"

[[comments]]
order = 10
subject = "مصيبتنا"
author = "حسنى مبارك رئيس سياسى ومصيبتنا فى دكاترة الاقتصاد بتوع الكتب النظرى اللى مسكوا رياسة الوزراء وحطوا للبلد نظام اقتصادى صالح جدا لامريكا ولا يصلح لمصر اطلاقا"
posted = "2007-01-16"
text = "النظام الحر واقتصاد السوق رائع جدا فى المجتمعات اللى عندها وفرة مالية ضخمة جدا<br />انما شعب من المعدمين اقتصادة مبنى على التسول وريع قناة السويس وشوية الغاز اللى بنبيعهم كل دة هيعمل اقتصاد حر<br />ياخى قحة<br />ويا دكاترة الاقتصاد عايزين ناكل بتاو<br />وشوية خبيزة وننام بدون مشاكل ولا اعتقالات"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042307/http://masr.20at.com:80/article.php?sid=1450"

[[comments]]
order = 11
subject = "لكل من هو ناقم على خبراء الاقتصاد"
author = "خبير اقتصادى مصرى عايش بامريكا"
posted = "2007-01-16"
text = "لكل الاخوة الزعلانين من كلامى ولكل الاخوة المتهكمين على كلامى ولكل الناس اللى مش عاجبهم بتوع الاقتصاد عاوز اقولهم البلد بتاعتنا موقعتش من بتوع الاقتصاد البلد وقعت لان الراى فيها راى شخص واحد من قديم الزمان من ياخد من النظرية الشيوعية ومرة ياخد من النظرية الراسمالية والنظريات فى جميع الحالات ملهاش دخل وخلينى اسال هو الاسلام فية قطاع عام مش لما الراجل راح يسال الرسول حسنة اعطاة علشان يحتطب واحنا فى مواقع النت بقينا نشحت مع العلم<br />1- عندنا غابة من الساتيلايت على كل اسطح العمارات<br />2- ناس داخلة النت تشتكى ؟ طب ماتوفر تمن النت علشان العيش اللى بتتكلم علية<br />3- تعلق كل الناس بالتعليم الجامعى ومصاريفة مع العلم ان اغلب الخريجيين مبيشتغلوش بيها ؟ مش دة انفاق خارج عن مواردنا<br />4- القهوة ومصاريفها وكم واحد قاعد عليها ليل نهار<br />4- طيب كام واحد فينا قعد مع نفسة وفكر بجد ازاى ممكن يطور نفسة<br />مشكلتنا فى مصر مش النظرية مشكلتنا اننا كلنا فلاسفة محدش عاوز يتحرك زى الاستاد وليد اللى بيتكلم على امريكا ومعرفشى جاب المعلمومات القيمة دى منين ؟؟<br />بتتكلم عن امريكا تعرف انتا كام واحد سنويا بيموت فى مريكا من الجوع والفقر ؟؟؟؟؟<br />تعرف حضرتك كان سعر كيلو اللحمة واسعار الاكل عموما فى امريكا ؟؟؟؟؟؟؟؟؟؟؟؟<br />اكيد لا انتا نموذج مكرر للفهلوة المصرية المعتادة انتا مش عارف وعاوز تبين انك عارف بالعافية اسال اى واحد سائح امريكى اسعار الاكل فى بلادكم كام وتعالى اتكلم<br />وعلى فكرة انا مش بدعى انى خبير اقتصادى انا بشتغل فى مركز فيرمونت الاقتصادى العالمى لدعم الخدملت الاستشارية البنكية ومسالة انك عاوز خبراء فى بلدك ولا لا اعتقد انك مش عارف ؟<br />ومش عيب<br />وشكرا"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042307/http://masr.20at.com:80/article.php?sid=1450"

[[comments]]
order = 12
