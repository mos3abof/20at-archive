author = "كل بلاوى البلد من ادعياء انهم خبراء اقتصاد يا محترم احنا معندناش اقتصاد احنا عايشين على الاعانات"
posted = "2007-01-16"
text = "صدرنا السنة اللى فاتت بكام<br />ال 70 مليون انتاجهم اقل من عشر انتاج اسرائيل<br />اتنيلوا على نظرياتكم الهبلة بتاع الكتب<br />النظام ليس لة علاقة<br />الصين شيوعية وانتاجها مغرق العالم<br />ومصر راسمالية وبتشحت<br />انكسفوا"
