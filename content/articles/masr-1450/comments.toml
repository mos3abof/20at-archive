[[comments]]
order = 30
subject = "الى مصرى مقهور"
author = "نيفين نيفى نوفا"
posted = "2007-01-23"
text = "انا اشكرك و اشكر اللى دافعو عنى و اللى بينادو ان عشرينات تشيل التعليق<br />بس احب ااكدلكم اان عشرينات اكيد هيشيلوه<br />بس مش دى المشكله<br />المشكله يا جماعه مش الموضوع دا و لا اللى بعديه<br />عشرينات ممكن تشيل التعليق و انتو ممكن تدافعو عنى بس دا هيتكرر ف مواضيع تانيه و مع ناس تانيين<br />عارفين ليه علشان يا جماعه مستوى الحوار انخفض و كتير من الشبابشل يفين ان بالشتيمه و بالاسلوب الحقير دا هتتحل المشاكل و يتاكد الراى<br />احنا يا جماعه مشكلتنا اننا معدناش بنقدر نسمع بعض بهدوء و لا باحترام<br />ومع كل اقدم شكرى للمحترمين على الموقع و بقول للجماعه اللى بيشتمو اسفه جدا انى مش هقدر ارد عليهم لان الرد لازم يكون بالمثل و انا اربأبنفسى عن النزول للمستوى دا<br />ملحوظه:انما لما قلت بسكويت اردت مواجهه الواقع الاسود الكئيب بالسخريه<br />و هذا للعلم و لمن لا يعلم و لمن ينوى الشتيمه"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042307/http://masr.20at.com:80/article.php?sid=1450"

[[comments]]
order = 31
subject = "يا ناسي وتاج راسي"
author = "جمعة الدمرداش"
posted = "2007-01-23"
text = "إحنا في مركب بتغرق في أعمق المحيطات وبدل مانشوف طريقة تجينا لأ نازلين في بعض ضرب وسب ولعن بدون خطوط حمراء..ليه ده؟<br />والله أعرف إن الشتيمة ممكن تؤدي لشئ في إصلاح لأخليها صلاتي اليومية، اللي بيسب الأم والأخت وبيرمي أمهات الآخرين بالدعارة والزنا الخ؟ هداك الله يا أخي قد كده سعادتك حريص على إطالة قائمة السيئات عندك؟ مانيش لا مدروش ولا شيخ ولا يمكن ملتزم بشكل خاص، لكن أعرف أحترم نفسي وأجنب مسبة أهلي بإني ما أسب حد.<br />بلد زي مصر لا يمكن تحل أزمة العيش إلا إذا تعلمت إنها تنتج ما يكفيها من القمح..أو معظم حاجتها مع أضعف الإيمان...إخونا خبراء الزراعة مكن يفيدونا في هذا المجال...وإلا إيه فايدة كليات الزراعة؟<br />منطق السوق الحر ماهواش سئ في ظل وجود سوق مشتركة..وإحنا عمقنا الوطن العربي مش يوناتيد ستيتز أوف أمريكا ولا ستيت أوف إسرائيل، بعد بذل قصارى الجهد في إنتاج القمح المصري، نبقى نقعد ونفكر هل إنتاجه أرخص ولا إستيراده من السوق العربية المشتركة بإذن واحد أحد. يا أخونا السعودية لافيها نيل ولا فرات ولا دجلة وبتصدر قمح..طب نعمل زيهم مش عايز أقول على بلد راقي.<br />وما ينطبق على القمح ينطبق على كل المجالات اللي إحنا خايبين فيها.<br />المشكلة إن ده عايز قيادة واعية شرعية منتخبة وناس عايزه تغير ومش بالكلام والشتايم.<br />وتحياتي للجميع ويجعل كلامنا خفيف."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042307/http://masr.20at.com:80/article.php?sid=1450"

