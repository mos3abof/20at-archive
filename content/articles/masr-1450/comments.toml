[[comments]]
order = 33
subject = "الى حسام المصرى"
author = "نيفين نيفى نوفا"
posted = "2007-01-27"
text = "اولا اشكرك يا حسام بس صدقنى انا مرديتش علشان اوضح موقفى و لا اعطى للى اتكلم اهميه بس انا رديت علشان فعلا انا حاسه ان فيه حاله من الحجر الفكرى انتشرت بين الشباب و يا ريت بتقف عند ان حد ميسمعش راى حد لا دى بتوصل للشتايم سواء من المعلقين للكاتب او من المعلقين لبعض<br />و انا عارفه ان فيه ناس كانت ممكن ترد بالنيابه عنى بس انا متاكده انهم مدخلوش علشان ميدوش للى اتكلم اهميه<br />بس تعرف يا حسام انك لفت نظرى لحاجه انا قلت ايه لكل دا<br />كل اللى قلته دا من قبيل السخريه اللى اتعلمناها من كتابات انيس منصور و عبقريه احمد رجب<br />انا مش بنت حد من المسئولين علشان اقول ناكل بسكويت<br />مش فاهمه الناس دى بتفكر ازاى"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042307/http://masr.20at.com:80/article.php?sid=1450"
