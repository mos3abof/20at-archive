[[comments]]
order = 7
subject = "واللة الموفق"
author = "حبير اقتصادى مصرى بامريكا"
posted = "2007-01-16"
text = "الحقيقة انا مش عاوز احبط الشباب الصغير اللى زى كاتب المقال بس لو سمحتولى انا عندى ملاحظات<br />1- واضح ان كاتب المقال عاوز يشتكى من الغلاء فى المعيشة وضيق ذات اليد والحقيقة دى شكوة عامة لمعظم الناس بس عاوز اقول ان قبل مانتكلم فى الاقتصاد لازم نعرف احنا بنتكلم فى اية اقصد لية الاسعار غالية بدون الدخول فى تعقيد توجة الحكومة الحالى نحو الاقتصاد الحر ودة فيها نظريتين اما الصدمة الواحدة يعنى حرر التجارة والغى القطاع العام او الخطوات المدروسة يعنى شوية شوية والحكومة اختارت الاتجاة التانى زى روسيا ودة معناة اننا فى مصر حنشوف غلاء اكتر حيفضل يتصاعد لغاية اما يتحول السوق بالكامل لعرض وطلب بس يعنى مافيش قطاع عام دور الحكومة جيكون مراقبة الاسعار ومحاولات الاغراق<br />2- لازم نتعلم ان كل واحد فينا يختار اقصد احنا تعودنا من زمان على المجانى جة ماتش للزمالك اشوفة للاهلى اشوفة حفلة لمين ماشى طالما مجانى هات عاوزين بقى تبقى نفقاتنا فى حدود اللى احنا عاوزينة فعلا ولازم الشباب يتعلم انة يقاتل على لقمة العيش زى الدنيا كلها مابتعمل<br />3- يعنى اية بلد مافيهاش راجل معجبنيش التحريض دة وعلى فكرة كل عنف بيواجة بعنف اشد منة وندخل فى حلقة مفرغىة<br />مع الشكر"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042307/http://masr.20at.com:80/article.php?sid=1450"

