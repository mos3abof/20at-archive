subject = "تستاهلوا"
author = "عرفتوا ليه انتوا في عز"
posted = "2007-01-18"
text = "عشان طول ما انتوا بتفكروا كده و حتي مش عرفيين تحترموا نفسكوا حتفضلوا تخدوا فوق دماغكوا<br />ولسه اللي جاي اكتر لحد ما تعرفوا ان الله حق<br />و ان دماغكوا اللي انتوا مش عارفيين قيمتها ليها فايدة تانية غير الغباوة<br />انا عارف ان احنا بتمص دمنا و عارف كل القرف تااي احنا فيه<br />أظن ده اولي ان احنا نتعدل باه"
archived = "2007-01-31"
