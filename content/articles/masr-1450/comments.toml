author = "المواطن الغلبان"
posted = "2007-01-17"
text = "انا اسف ياجماعة دة مش ممكن يكون اخوانى ابدا<br />دة واحد قليل التربية<br />بس فية اية ياادارة الموقع ممكن تبطلوا سياسة شوية وتلغوا التعليقات الفاجرة دى ؟؟؟؟<br />عرفنا ياجماعة انهم من بتوع الحزب الوطنى وانهم سفلة لية بقى سايبين التعليقات ظ<br />ولا تكونوا انتم اللى ورا الكلام دة"
