subject = "في الرقابة يا عشرينات علي هؤلاء الاوساخ"
author = "المواطن المطحون"
posted = "2007-01-17"
text = "فين الرقابة يا عشرينات علي هؤلاء القذورات والنفايات التي افرزها الحزب الوطني<br />واعتذاري لكل من طالتهم هذه الاوساخ من (بحب الاخوان) باين عليه ولا اخواني ولا حاجة وكمان القذر الذي يدل علي بيئته اللامحترمة .<br />ارجو من عشرينات تشديد الرقابة علي هؤلاء الفاسدين والمفسدين وشكرا."
archived = "2007-01-31"
