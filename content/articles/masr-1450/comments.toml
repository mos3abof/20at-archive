text = "جرى يابن المتناكة عاوز تتهزق على المسا ماتلم نفسك يامعرص<br />انا اخوانى بس صريح لابعد الحدود واللى بيتعمل فى الموقع هنا غلط مافيش حاجة اسمها ديمقراطية<br />وكل واحد داخل يتفلسف طيب يامطحون بكرة اطحن امك بس اصبر عليا"
