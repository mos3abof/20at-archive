[[comments]]
order = 0
subject = "من أرض الله"
text = "لا حول ولا قوة إلا بالله ............<br />والكارثة أنه ، يبدو ـ أن التلفزيون المصري سينقاد بسهولة لهذه اللعبة الهزلية ، وخاصة بعد فوز ذلك الشخص ، الذي تعتبره ( الكارثة ) عميدة كلية الإعلام واجهة مشرفة لمصر !!!!!!!!!!!!!!!!!<br />يا ويلتي !!!!<br />كيف يكون هذا ............؟؟؟؟؟؟"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417201017/http://www.20at.com:80/article.php?sid=72"

[[comments]]
order = 1
subject = "وأنا كمان مع حماس"
text = "أنا مستني حماس هتعمل إيه<br />وربنا ينفخ في صورتهم<br />ويحفظهم من العملاء الفلسطينين<br />يارب كن في عون حماس وأهل حماس<br />يعني خالد مشعل والرنتيسي والزهار وهنيه<br />يارب يارب يارب يارب<br />الليلة نسمع حاجة كويسة تفرحنا"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417201017/http://www.20at.com:80/article.php?sid=72"
