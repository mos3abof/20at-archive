author = "كافور عبد مخصى"
posted = "2009-09-27"
text = "كافور اللى بتتكلم عنة كان عبد مخصى علشان بيخدم الحريم وبعدين سيدة بعتة يحكم مصر نيابة عنة لانة مش فاضى فى بغداد وبعدين المخصى دة عمل حاجات كويسة للبلد وخربت البلد بعد ان تولى ابنة الحكم وكان اسمة خماروية - ابنة دة جوز بنتة قطر الندى للخليفة العباسى وخربت الخزينة على ايدية وانهارت البلد وطار خماروية ومسك مملوك تانى<br />اما عمر افندى وكارفور وسيطرة المراكز التجارية الاجنبية على اسواق البلد فدة مش جديد<br />فشركة كارفور هى شركة فرنسية كان اسمها سيتى سنتر وغيرتة لكارفور وطبعا بتبيع الحاجات بسعر كويس للناس المرتاحين<br />اما احنا الشعب الغلبان فبندور على مجمعات النيل وبقالة عمى احمد طبالة"
archived = "2009-09-29"
