subject = "أختي في الله شيرين"
text = "أختي في الله شيرين .. جعل الله ما تنقلين في ميزان حسناتك ، ولكن هل يغضب رسول الله ( ص ) لحلال أحله الشرع ؟<br />الزواج من امرأة ثانية مباح فلم يغضب رسول الله ( ص ) مما أباحه الله وقد جاء في السنة أن الزواج من سنته بل وفي بعض الروايات ما يرغب في الزواج من أكثر من واحدة ؟<br />وابنة أبي لهب كانت مؤمنة ولا تزر وزر والدها فلم يغضب رسول الله ( ص ) ؟<br />أم أن رسول الله ( ص ) عاطفي تجاه ما جاء به يطبقه على الناس ولا يرضاه لنفسه حاشاه عن ذلك صلوات الله عليه ؟<br />يا أختي لقد سن معاوية لعن علي ( ع ) على المنابر ، واستمر اللعن ثمانين عاماً حتى ألغاه عمر بن عبدالعزيز ، وفي الصحيح عن سهل بن سعد أن معاوية أمره بلعن علي بن أبي طالب ( ع ) ، فلا نستبعد أن يكون هذا الحديث موضوعاً فيه ."
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803033115/http://www.20at.com:80/article.php?sid=160"

