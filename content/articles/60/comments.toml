order = 1
subject = "الشمحطجى... يتكلم !!!"
text = "على كده الواحد يتجوز اربع نسوان و يقعد هو زى ديك البرابر فى البيت ..يلم الايراد!!<br />لأ يا ست الحاجة الموضوع ما يتبصلوش بالشكل ده<br />الكلام ده ايام ستى و ستك ... الله يرحم الجميع<br />انما دلوقت الست من دول عبال ما تروح الشغل و تفطر و تشرب الشاى و تعرف اخبار زميليتها فلانة و ترغى مع علانة و تحل مشكلة ترتانة يكون اليوم خلص و تعطلت مصالح الناس!!<br />زائد كمان الستات فى بلادنا العربية الشكيكة ..<br />لامؤخزة فى الكلمة يعنى احجامهم كبيرة شوية( فاملى سايز ) يعنى بهدلة فى المواصلات ..و فلان ممكن يغلس بكلمة .. و علان ممكن يبص بصه<br />احسن ليكو ...الست تقعد فى البيت تراعى جوزها و تربى عيلها احسن من البهدلة و الشحططة<br />زائد كمان هما الرجالة اشتغلو اصلاً علشان الستات يجو يزحموهم فى فرص الشغل الى هى اصلاً قليلة<br />ارحمو بأه خلى ربنا يرحمكم..!<br />على فكرة نسوان جمع نسوة لأحسن حد من اخوانا بتوع الموقع يفتكرها كلمة ابيحه و لا حاجة<br />shamahtagi@hotmail.com"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050257/http://www.20at.com:80/article.php?sid=160"

[[comments]]
