text = "ياسيدة شيرين ، ألم يبقى أحد أمامك من البشر الذين خلقهم الله ، حتى يكون موضع حديث يناقش في هذا الموقع ، لأنه ومع الأسف لا يوجد أحد فقيه أو حتى متعلم كتب تعليقاً على هذا الموضوع ، هذا من الناحية الدينية إن كنت مسلمة ، أما إذا كنت غير ذلك فالأولى أن تستشهدي بمن هو قدوتكم ، لا بمن هو ليس فقط خاصتنا وسيدنا بل ومعلم البشرية جمعاء"
