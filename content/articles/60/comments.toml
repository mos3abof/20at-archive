subject = "انت بتقول ايه يا ابني؟"
text = "هو أسهل حاجة عند كل واحد مدعي انه بيفهم في كل حاجة انه يلاقي حجج علشان النساء تلزم بيوتها. وهل سيادتك أتقى من رسول الله وآل بيته؟؟<br />وبعدين بصراحة كده، وأنا راضية ذمتك، لو كان الرجالة اللي قاعدين في البيوت دول بيتقنوا حاجة، ولا عندهم مهارة كانوا هيفضلوا عاطلين ليه؟؟ واضح ان ثقافة المسلسلات لسة مسيطرة علينا، في حين ان الواقع بيقول ان صاحب الكفاءة أياً كان جنسه لازم هيلاقي فرصته.."
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050257/http://www.20at.com:80/article.php?sid=160"

[[comments]]
order = 3
subject = "راسكولينكوف"
text = "عندي سؤال هل تناول الموضوعات من زاوية دينية صدفة وال سياسة الموقع وال موقف شخصي يهدف لتوضيح المفاهيم الخاطئة عندالناس؟ اذا كان الهدف الخير هو الصحيح فحظ سعيد لان الاسلام بقى مشوه عند الناس بدرجة تخلينا حتى مش قادرين نتعرف عليه ومفاهمي كثيرة منسوبة للدين افتراءا في حين ان الدين ارحب واكثر حرية من اللي الناس فاكره يمكن يكون رايي تقليدي يعني ما جبتش جديد لكن ده رايي<br />بخلاف ذلك فالموضوع حلو قوي انا شخصيا كنت متاكدة من كل القيم اللي بيقولهاالموضوع لانها متماشية مع المنطق والفطرة ولان الاسلام مش ممكن يكون متخلف زي ما الناس بتصوره لكن ما كنتش اعرف ادلة فقهية او مواقف حقيقة تدعم رايي ده وكثير من الاشياء اللي في الموضوع اول مرة اعرفها"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050257/http://www.20at.com:80/article.php?sid=160"

[[comments]]
