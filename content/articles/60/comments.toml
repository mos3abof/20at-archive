[[comments]]
order = 0
subject = "ماشاء الله"
text = "استاذة شيرين مجدى<br />سلام الله عليك ورحمته وبركاته<br />جزاك الله كل خير على هذا الموضوع الراااااااااائع، فكم نحن بحاجة إلى هذه النماذج، أولا حتى تقتدى بها أخواتنا المسلمات، بدلا من استمرار النظر إلى الآخريات غير المسلمات و اتخاذهن قدوة لنا<br />و ثانيا، حتى نقول لمن يتهم إسلامنا الجميل بانه ضد عمل المرآة و انه بذلك يقيدها، فهؤلاء نقول لهم باعلى صوت، طوبة فى عين اللى ما يشوف هذا الدين على حقيقته<br />و سوف اقول لكم صراحة، أننى مقبلة على الزواج إن شاء الله، و كنت اقرأ فى كتاب اسمه الفقه الواضح عن الزواج، و قد رايت العجب فيه، فكم هذا الدين الرائع يصون كرامتك أختى المسلمة، بدء من بطلان العقد إذا تم بدون رضاء المرأة، و ايضا حثه دائما على أن يلتزم الرجل بسد احتياجات المرأة الروحية و الجسدية، حتى أننى قرأت ان احد الرجال كان يصوم و يعمل نهارا و يقوم الليل، فعندما ذهبت تشكو أنها لا تستطيع أن تمنعه عن عمل يرضي به الله و لكنه أيضا لا يوفي بحقها عليه، فحكم عليه القاضي، أن يقوم الليل ثلاث ليال و يجعل الليلة الرابعة لزوجها، حيث أن المرأة تستطيع أن تصبر على زوجها اربع ليال، باعتبار ان الله قد اباح للرجل أن يتزوج اربعة، و هذه المرأة التى سمعها عمر بن الخطاب ذات مرة أثناء تفقده المدينة، فسمعها تشكو غياب زوجها، فعلم ان زوجها مسافرا فى سبيل الله، فاصدر أمرا بألا يغيب الرجل عن زوجته أكثر من 6 شهور<br />هذا بالاضافة إلى اعتبار المهر و النفقة و تاسيس البيت من شروط العقد، حفظا للمرأة و صيانة لها<br />ما اجملك يا اسلام، وما احرصك على نفسنا و ديننا و روحنا<br />أدام الله نعمة الاسلام علينا جميعا<br />و السلام عليكم"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050257/http://www.20at.com:80/article.php?sid=160"

