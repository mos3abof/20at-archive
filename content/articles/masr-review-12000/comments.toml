subject = ""
author = "سمارة"
posted = "2009-05-08"
text = "من غير كتب ووجع راس<br />اللى قبلنا قالوا لنا<br />ان كنتى وحشة خليكى نغشة<br />عارفة كلمة نغشة معناها اية يا ابلة<br />اسالى مامتك"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100447/http://www.20at.com:80/t7kyk/12000-2009-05-07-11-43-29.html"

