author = "نبيفين نيفى نوفا"
posted = "2009-05-08"
text = "مع احترامى التام لراى الاخت الفاضله باكيجنهام قصدى سماره<br />انا رايى ف الموضوع ده منذ الازل و الى الابد واضح و لا يتغير<br />الحب اولا<br />و الحب ثانيا و الحب ثالثا"
