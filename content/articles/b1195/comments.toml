text = "للدرجة الناسر فاهمة الدين غلط وكمان فاهمة معنى الحجاب غلط الحجاب معناه الحفاظ ع المراة وعفتها الناس نفسها تلتزم بس الاغراءات كتير ربنا يقوى المسلمات ويبعد التفانين اللى بتهبل الناس واتقوا الله شوية وبلاش المتاجرة بالدين للكسب خافوا الاخرة واشتروها ابقى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124232/http://www.20at.com/article2.php?sid=1195"

