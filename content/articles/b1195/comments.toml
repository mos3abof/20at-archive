[[comments]]
order = 3
subject = "لا حول ولا قوة إلا بالله"
author = "فرى بيرد"
posted = "2006-09-06"
text = "لا حول ولا قوة إلا بالله،<br />يصنع التجار الأعاجيب دوما لإلباس الباطل ثوب الحق<br />وفى نفس الوقت يتفنن الإنسان فى خداع نفسه لإيهام نفسه بأنه يتبع الدين<br />فإذا وجد التاجر أن الناس تميل الى التدين فيلبس العرى اسما يتماشى مع الدين ليتبعه الكثير من ضعاف الدين والنفس ويقتنعون تماما أنهم هكذا متبعون لسنة الله ورسوله والدين منهم براء<br />ولا حول ولا قوة إلا بالله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124232/http://www.20at.com/article2.php?sid=1195"

[[comments]]
order = 4
subject = "الرد بانصاف"
author = "mr : disgner"
posted = "2006-09-06"
text = "و الله لا يجوز لأحد ان يبت الرأي في ذلك الموضوع الا بعد ان يري كيف هي تلك المايوهات فاذا وجدناها ملائمة و فعلا لا تظهر مفاتن الجسد و واسعة و غير شفافة و لا تلتصق بالجسد عند ابتلالها بالماء فلا مانع من ان ترتيدها النساء و ينزلن بها البحر او حمامات السباحة فلم يحرم الاسلام علي المرأة ان تتمتع بحياتها طالما انها لم تتسبب في فتنة من حولها و الله المستعان اما انا فقد رايت بالفعل هذه الملابس و انا لا اجد فيها ما يشين اي امرأة و شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124232/http://www.20at.com/article2.php?sid=1195"

[[comments]]
order = 5
subject = "لالالالا"
author = "مش هقول"
posted = "2006-09-10"
text = "السلام عليكم اصلا اصلا مهما كان اللبس واسع وفضفاض ام ضيق وهيتقطع لو واحده نزلت البحر بيكونوا متساوين لان المياه بتخلى الملابس تلتصق بالجسم وكان الفتاه سورى عريانه<br />واشمئز انا لذلك وانصحكم نصيحه لله مينفعش العوم الا فى شىء مغلق اوى بقى الواحده تسيب لله ذلك والله سوف يعوضها بخير منه اكيد فى الدنيا والاخره ان شاء الله فاصبرى يا اختاه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124232/http://www.20at.com/article2.php?sid=1195"

[[comments]]
order = 6
subject = "اشي فاخر على الاخر"
author = "واحد تعب من الهبل"
posted = "2006-09-12"
text = "اشي فاخر بس لو انو جلباب مش احسن<br />عيب على صنعه انا بسال سؤال واحد بس للي صنع هذا الميوه الذي يعتقد انه محتشم<br />برضى انو اخته او مرته او امه يلبسن هذا الميوه انا اعتقد انو ما برضاش هذا الحكي لخواته<br />اتق الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124232/http://www.20at.com/article2.php?sid=1195"

