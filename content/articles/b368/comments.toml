[[comments]]
order = 0
subject = "في سيارتنا ...بلوى"
author = "المسلمه"
posted = "2006-02-01"
text = "السلام عليكم,,<br />اشكركم على هذا الموضوع الذي اثرتموه<br />وهو التلفاز الصغير الذي يقتنى داخل السياره<br />كما ذكرت انه سبب في كثير من الحوادث,وبه يختم للمرء اذا كان يشاهد لقطه محرم عليه مشاهدتها ؟ فااقول لاخواني الشباب بيدكم خاتمتكم اذا اردتم النجاة من سوء الخاتمه فراقب الله وكن من المحسنين ((فاعبد الله كانك تراه فان لم تكن تراه فانه يراك))<br />وختاما ((لا تجعل,,الله,, اهون الناظرين اليك))<br />استميحكم عذرا على الاطاله<br />^^اللهم بلغت,, اللهم اشهد^^"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114427/http://www.20at.com/article2.php?sid=368"

[[comments]]
order = 1
subject = "اشكرك"
author = "خالد معتوق الهاجري"
posted = "2006-02-02"
text = "بسمالله الرحمن الريحم<br />فعلا اخي الكريم هاذه مشكله ملموسه في<br />حياتنا اليوميه ..<br />وهذه من جراء استعمار الغرب على مجتمعنا<br />العربي وتأثيره علي ابنائنا و شبابنا<br />..... وتقول الابحاث الطبيه في جامعه هارفرد ان شاشه التلفاز تبعث اشعه مضره بالعين والدماغ حيث تؤدي الى الامراض وما الى ذلك .. ونحن الشعب المستهلك لا نستطيع ان نستغني عن الاشياء التي نحبها وان كانت مضره بالصحه سواء كانت جسمانيه او عقلانيه .... شاكراً لك اخي الكريم .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114427/http://www.20at.com/article2.php?sid=368"
