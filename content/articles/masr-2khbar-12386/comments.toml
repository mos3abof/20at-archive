author = "التطفيش"
posted = "2009-06-17"
text = "التطفيش للطلبة هى سياسة وزارة التربية والتعليم<br />زمان فى المدرسة الثانوية<br />كان غية 10 فصول علمى وفصلين ادبى - يعنى 80 % فى العلمى و20 % فى القسم الادبى<br />دلوقتى 90 % من طلبة جمهورية مصر العربية ادبى وبيدرسوا جغرافيا وانجليزى وفرنساوى ومواد بعيدا عن العلوم والكيمياء والرياضيات وكل علوم العصر الحديث<br />وكل ذلك بسياسة متعمدة لارهاب الطلبة بتنزيل امحانات صعبة جدا فى الرياضيات<br />ما فائدة التعليم فى القسم الادبى<br />لا شىء<br />زى التعليم فى الكتاب<br />شخص يجيد القراءة والكتابة فقط<br />وبعيدا عن علوم العصر من رياضيات وكيمياء وفيزياء وكمبيوتر ولا يعرف حتى ان يغير لمبة احترقت فى بيتة<br />اسفى على سياسة تطفيش طلاب العلمى وجعلهم يندفعون الى الادبى ليدرسوا الفلسفة"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620090952/http://www.20at.com:80/masr/2khbar/12386-2009-06-17-07-58-27.html"
