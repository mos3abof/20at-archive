author = "مش رضوى حسن ولا مروى"
posted = "2009-06-17"
text = "على ما يبدو ان ثورة 23 هباب<br />اوصلت الشعب المصري لطريق مسدود<br />مسدود مسدود يا ولدي<br />تتصوروا ان اللي بيحط اسئلة امتحانات الثانوية اساتذة جامعات<br />ولا حول ولا قوة الا بالله العلي العظيم"
