text = "أنا شايف ان البنت اللى شايفة ان مظهرها ما ينفعش حد يصورها فيه لضهور وجهها مثلا زى الأخ اللى فوق ما بيقول يبقى الغلط عندها هى اللى خرجت بالشكل ده ولو ما فيش مشكله ان حد يشوفها وهى كاشفه وجهها يبقى هتفرق ايه بين لما واحد يشوفها فى الشارع وواحد تانى بيشوف صورتها طالما انهى فى الاتنين بنفس المظهر اللى هى اختارته بمحض ارادتها وخرجت بيه للشارع<br />ولا أنا غلطان؟"
