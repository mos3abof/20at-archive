[[comments]]
order = 3
subject = "ليس فقط السعودية"
author = "كاتبة"
posted = "2006-02-28"
text = "السلام عليكم ورحمة الله وبركاته<br />بسم الله الرحمن الرحيم<br />ليس فقط السعودةي التي تنتشر بها فضائح كاميرات الجوال بل الكويت ايضاً احد اكثر الدول التي ينتشرب ها هذه الظاهرة المرعبة.<br />وللأسف الفتيات وحدهن هن الضحايا<br />وأحياناً بدون أي سبب يذكر<br />الأن وصلت أنني لا أرسل صورتي حتى لأقاربي وأحاول تجميع صوري من اي مكان ممكن ان تكون به خوفاً من وصلها ليد أي من العابثين ويقوم بدبلجتها بالأساليب التكنولوجيا المؤذية.<br />أخيراً الله المستعان وهو الحارس للفتيات."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113540/http://www.20at.com/article2.php?sid=504"

