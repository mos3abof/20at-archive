[[comments]]
order = 6
subject = "السعودية كمان وكمان"
author = "Dabdoob"
posted = "2006-03-01"
text = "من جديد انشر هذا التعليق لان احدا لم يرد علي فهل اطمع في اجابة منطقية هذه المرة<br />لقد سالت عن السبب في هذا الوضع الذي نري عليه المجتمع السعودي ؟<br />وقلت اني اظن ان السبب هو ببساطة :<br />1. اجبار الناس علي ارتداء عباءة الدين رغما عنهم ويتمثل هذا في الكثير من الامور وان كان اهمها النفوذ الرهيب للسلطة الدينية في السعودية ومنها هيئة الامر بالمعروف والنهي عن المنكر.<br />2. قهر الافكار المخالفة باسم الدين ويتمثل هذا في حالات الاعتقال والمحاكمات الكثيرة للمعارضين السعوديين تحت ستار مخالفة ولي الامر!!!!!<br />3. اطلاق الفتاوي المضادة للحداثة والعصرية والمعادية للغرب ويبدو هذا جليا في الفتاوي الخاصة بالتليفزيون والكاميرات عموما والبورصة والتليفونات المحمولة ومقاهي الانترنت وقيادة السيارات بالنسبة للمراة والصحافة و.........<br />4. الكيل بمكيالين فيما يتعلق بالدين حينما يتعلق الامر بالسلطة الحاكمة فنري الشيوخ السعوديين يحرمون مقاهي الانترنت بكل سهولة ولكنهم حين يتعلق الامر بتجاوزات الامراء او دخول القوات الاجنبية الي داخل البلاد لمحاربة المسلمين فان هذا حـــــــــــــــــــــــــلال!!!!!!!!!!!<br />5. طبيعة المجتمع السعودي من حيث كونه مجتمع قبلي بحت تحكمه التقاليد بشكل خانق ويتجلي هذا في موضوع ظهور وجه النساء ومعاملة المراة بشكل فيه تفرقة واضحة .<br />6. تراجع قيم الحريات (حرية التعبير حرية الصحافة حرية الاجتماع حرية العقيدة حرية الفكر.....الخ) داخل المجتمع السعودي وتصوير هذه الحريات علي انها مفسدة من مفاسد الغرب المادي المتعفن ( علي حد قول احد شيوخهم) وهذا التصوير كان بالطبع بايعاز ومباركة الاسرة الحاكمة .<br />اخيرا فانني لم اقصد ان اجرح او ان اهين احدا ولكني رغبت في مناقشة الامر للمنفعة العامة وايميلي منشور لمن يرغب في مناقشتي<br />kokorah@maktoob.com<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113540/http://www.20at.com/article2.php?sid=504"

