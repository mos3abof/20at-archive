[[comments]]
order = 8
subject = "إلى دبدوب"
author = "عبدالله"
posted = "2006-03-01"
text = "بداية ياعم دبدوب أو ضح لك أن الخوف من تصوير البنات لايعني بالضرورة تصويرهن في أوضاع مخلة...لأنه لو كان حدث هذا فهم يستحقون ما سيجرى لهم في أي مجتمع بخلاف السعودية.<br />أما الإشكالية الأكبر أن النات قد يعاقبون على امور قد يكون ليس لهم دخل فيهامثل التقاط صورة لها داخل الجامعة وهي كاشفة الوجه، او التقاط صور لها وهي في أحد الأفراح علما بأن القاعة للنساء فقط... هذه هي الإشكالية الحقيقية.<br />أما عن أسباب ذلك فأقول لك ببساطة أن هناك كمية كبيرة من المتناقضات داخل المجتمع السعودي بعضها يتعلق بعادات وتقاليد اختلطت بأمور دينية على ظروف قبلية وتم صهرها جميع في ظل أوضاع وظروف سياسية معينة، وبرزت بشكل أكبر بعد انفتاح السعودية على العالم وظهور الفضائيات والإنترنت.<br />وفي كل الأحوال إن فهم وتحليل المجتمع السعودي ليس بالأمر الهين لقد يتم الإجابة عليه في سؤال... المسألة تحتاج بالدرجة الأولى ان تعيش في هذا المجتمع ولو لفترة وجيزة حتى تفهمه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113540/http://www.20at.com/article2.php?sid=504"

