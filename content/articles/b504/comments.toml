[[comments]]
order = 11
subject = "اعصابكم"
author = "بسم الله الرحمن الرحيم..من تكلم في مالايعنيه سميعامالايرضيه"
posted = "2006-05-14"
text = "1-السعوديات ماصدروكم لدفاع عنهم أوالتحامي لهم ولي جالس ينعق ويتكلم بي أمور لاتعنيه كاسب المشائخ والعلماء اليعلم بأنهوعلى أمراًخطير ومحرم فقد نهاالرسول صلى الله عليه وسلم عن ذلك في مامعنى الحديث(إن الله يورثه ميتت القلب قبل موته)وأموركثيرةغيرذلك.فاهؤلأهم ورثة ألأنبياء وهم يعلمون مالاتعلمون ويعلمون في المصالح أكثرمن غيرهم فهم يعلمون مايفتون به وحكمه ومايترتب عليه من أمورومصالح فهم يتورعون في الفتياويتقون الله فيمايقولون ويخشونه فهم يعلمون بقول الرسول صلى الله عليه وسلم(أجرئكم على الفتوأجرئم على النار)فاكيف تريد أن تكون فتياهم إذ أنك تقول أنهم مخاليفين للحاداثة والعصرية نحن لسنا ضد الحداثة أو العصرية بل ضد ماهو محرم وما يتناف مع الشرع فنحن نأخذ منه مايتماشا مع الدين الحنيف فالعلماء يرفضون ويحرمون ماينفيه<br />وأل سعودهم خيرمن غيرهم من السلطات وولات الأمر في الدول ألأخرافهم من طبق الشريعةوعملت على إعانت شعبها ووصل ذلك أيضًًًٍاالي الدول الموجاوره والدول الفقيرة والدول المنكوبة فهم أهل الخير والعطاء بعد الله .والسعودية لم تجبر أحد على الدين فهم يعملون بقوله تعالى(لا إكراه في الدين...)البقرة(256)<br />فلوكانت تكره أحد على الدين لاأكرهة من يئتي إليها من الجاليات على الأسلام وفرضته فرضًاقبل الدخول إليها بأنلا يدخلاإلا المسليمين وأهل الدين خاصة<br />وكذالك رجال هيئةألأمر بالمعروف ونهي عن المنكرفلم يجبرو أحد على ارتداء عباءة الدين بل يعملون بالنصح والتوجيه والأرشادوألأخذبيد السفيه والضال والمنحرف برفق وألين إلى جادة الصواب والحق ويعملون بقوله تعالى(ولتكن منكم أمة يدعون إلى الخير ويأمرون بالمعروف وينهون عن المنكر وأولئك هم المفلحون)<br />ال عمران(104)<br />وكيف تقول أن هناك تفريق في معاملة المرأةبشكل واضح فاوالله إنهامكرمةومعزازة<br />أكثرمن النساء في الدول ألأخرا<br />فاأنتم تدعونهم إلى التبرج والسفور وكشف الوجه فاهذا ماتوريدون أن تكون عليه المرأة السعودية لترضون عنهم وتكون متقدمة وعصرية في أعينكم وتقولون أنتغطيتهاليوجههاوارتداإيهالحيجابهامن التقاليد بل والله إنه منأمرالله ورسولة كماقال تعالى (يأيها النبي قل لأزواجك وبناتك ونساء المؤمينين يدنين عليهن من جلبيبهن ذلك أدنى أن يعرفن فلا يؤذين..)(29)الأحزاب<br />وكذالك تأتي وتتصدر في ممبرأخر وتتكلم وتقول ترجع قيم الحريات...بماذاتراجعت نحن منحنا الحرية في ما قلت جميعه ولكن يكون ألأنسان حر بي حدودوما يتماشا مع الدين.نعم الحرية التي تزعم أنت وأمثالك أتت من الغرب فماذا أتا لم يأتيإلا الفساد وأدمار بي أسم هذه الحرية المزعومة الا ترا ماذا فعلو بي شخصيةالرسول صلى الله علية وسلم من رسمن وتشوية بي زعمهم أنها حرية أرأيت ماهي الحرية!!!وماالذي تريده من مناقشة الأمور وما الذي يعنيك وما هي هذه المناقشة فكي تخوض في أمور لاتعنيك أنت وغيرك في السياسة والدين فأنتم لستم مفوضون ولا موكلون بذلك......<br />ومن قال بأن الشعب السعودي شعب بائس فليماهوبائس هل أشتكا لك من بوئسه وتعبة فاوالله بأنه ليس بي بائس فهومتنعم بالخير الكثير والراحة وألأمن وطمئنينة<br />فوالله لايوجد بوئساء سواكم...<br />وأنت يامن أسميت نفسك بي عاقل ليتك كنت أعقل من ذلك؟؟!!... كيف تصف السعوديات بأنهن يعشن في القرن 18وأنت لاتعلم عنهن شئ أرأيتهن ذلك لأنهن يرتدين الحجاب الشرعي وتقول بي أن السعودية جميعها متخلف الماذ؟؟!! لأنها تمشي على منهج الله وسنة رسوله صلى الله عليه وسلم وأنهالم تكن كباقي الدول المتقدمة نعم إنها متقدمة وكذلك السافرات الكاشفات للوجة متقدمات ...ولكن إلى ماذا متقدمات؟؟؟إنهن متقدمات إلى النارإن شاء الواحد الجبار فأنتم جميعكم تسبون السعودية والسعوديون ولكن لا أقول إلا كما قال الشاعر...<br />إذا أتتك مسبتًًاًلي من ناقصاً<br />فاتلك شهدتاًلبأني كاملون<br />ومن قال بأنا امريكا ماما فهي أمنله ليست لنا...<br />وأخيراًأقول ماألذي توريدونه من تشويه صورة العلماء والمشائخ وولات لأمر ودعوة المرأة الى التحرير والسفور ومسوتها بالرجل فوالله إنكم مخطيؤن وتوريدون أثارت المشاكل والفتن والتمرد والفسادإخواني أتقوالله فيماتكتبون وماتقولون وما سطرتوه فوالله إنكم مسئولون أمام الله وموقوفون..<br />الا تكونون مشتغلين في إصلاح أنفسكم ومجتمعاتكم خيراًلكم فوالله إنه ليوجد بها من الفساد والبلاء العظيم مايلهيكم عن غيركم من المسكرات والخمور والمراقص...<br />فوالله إنه ليشيب الرأس من المنكرات نسأل الله النا ولكم الهدية وصلاح والرشاد والتوفيق والسداد وان يثبتنا على القول الثابت في الحياة الدنيا والأخرة إنه ولي ذلك والقادرعلية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113540/http://www.20at.com/article2.php?sid=504"
