order = 0
subject = "الكاميرا الخفية"
author = "عبدالله"
posted = "2006-02-27"
text = "بداية نشكر عشرينات للتعرض لمثل هذا الموضوع الذي يؤرق مضاجع كثيرا من الفتيات السعوديات.<br />ولكني أعتقد أن الفتاة تتحمل قدر كبير من المسئولية عما قد يحدث لها إذا تعرضت للتصوير... فلن يحاول أحدا التقاط ضورة لفتاة إلا إذا ما قد فعلت ما يسترعي انتباهه.<br />ثانيا : الفتاة أصبحت تدرك واقع المجتمع بإيجابياته وسلبياته فلا داعي لانتقاده لأن ذلك لن يقدم أو يؤخر شئ فكل منها تحافظ على هذه القيم ولاتضع نفسها موقع شبهات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113540/http://www.20at.com/article2.php?sid=504"

[[comments]]
order = 1
subject = "الموضوع اكبر من حجمه"
author = "عمر"
posted = "2006-02-28"
text = "السلام عليكم بداية<br />يعنى انا شايف ان الموضوع واخد اكبر من حجمه بمراحل<br />1- لو حاولت السلطات السعودية والعالم كله مصادرة هذه الهواتف سيزيد الاقبال الشديد عليها وستزيد الامور التى يخافون منها<br />2- اعتقد ان المشكلة ( لا ادرى لماذا توجد فى السعودية فقط دون غيرها !! ) هى مشكلة اجتماعية بحته .. وهى فى الاساس مشكلة من لا مشكلة ... العادات والقيم فى المجتمع السعودى هي التى اختلقت هذه المشكلة التى لا وجود لها اساسا .. فعلى سبيل المثال فى مصر هناك ما هو اكثر مما هو فى المجتمع السعودى ولم نجد مثل هذه المشاكل<br />3- ليس الحل فى المنع والتدخل بالقوة للمنع .. الحل ان لم يأتى من داخل هؤلاء الشباب ومن انفسهم ومن اقتناعهم الكامل بان تصوير البنات غير المحرمات , حراما وان لا يجوز وخاصة اذا كانت للتشهير وغيره ... ان لم يرجع هؤلاء الشباب الى الفهم الصحيح والمعتدل للاسلام .. وان هناك يوما سيحاسب فيه كل شخس عما فعل وجنى .. ان لم يكن ذلك هو الدافع لمنعهم فلا دافع اخر سيردعهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113540/http://www.20at.com/article2.php?sid=504"

