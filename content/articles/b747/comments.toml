text = "السلام عليكم<br />الانتخابات في الجامعات هي عملية ديمقراطية من حق الطلبة كلهم، لكن الاصل في المجالس الطلابية ان تعمل لخدمة الطبة نفسهم، وليس لترسيخ اهدافهم احزابهم بها الدنيوية وما يتعارض منها مع الدين والاخلاق."
