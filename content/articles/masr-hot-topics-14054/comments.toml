text = "انا روحت الاستاد انا و3 اصحابي وكنا في تالتة يمين وطبعا كنت هناك من 10 الصبح ودخلت الساعة 3 بعد ما كنا بنموت واحنا داخلين من الزحام الشديد و مكنش في تفتيش<br />ودخلنا وقعدنا نشتم في الجزائرين وخصوصا ان احنا كنا جنبهم وشجعنا ودعينا وعملنا كل حاجة باعلي صوت عندنا لحد ما صوتي رااااااح …واول ما الماتش بدأ والجون المفاجئ الغير متوقع وهيستريا الجنون التي اصابت المدرجات بأكملها وتوقعنا ان يدخل بعده عدة اهداف وهذا لم يحدث … واحبط الجميع في اخر 5 دقائق ولكن لم نهدأ وكنا ندعوا ونشجع وكان عندنا امل في الله … وفعلا حدث ما لم يكن متوقع وانا لا استطيع ان اوصف ما حدث بعد هذا الهدف' فانه الصدمة الكهربية التي اعادت لنا دقااات قلوبنا'"
