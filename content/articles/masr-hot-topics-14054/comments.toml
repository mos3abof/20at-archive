posted = "2009-11-17"
text = "بسم الله الرحمن الرحيم<br />انا من السويس مكنش ليا نصيب اني احضر الماتطش في الاستاد مع ان اصدقائي في القاهره كان معاهم تذاكر ليا بس ظروف شغلي منعتني<br />فقررت اني اتفرج عليه مع اصدقائي في السويس في مكان بجوار استاد السويس في مجموعه كافياهات كتير<br />قولت اكيد هنلاقي مكان اقسم لبيكم بالله من الساعه 3 الضهر وانا بدور علي مكان في اي كافية ما لاقي<br />ده الكلام قبل الماطش بي 4 ساعات<br />المهم في الاخر لقيت ليكم تتخيليو ان كل المنطقة بكل الكافياهات الي فيها في وقت واحد بتقول كلمة واحدة من اول دقيقة لي اخر دقيقة<br />يــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــا رب<br />في وقت واحد طول الماطش<br />كلمة ليها سر عظيم<br />واتحققت علي ايد اولادنا وانشاء الله هتتحقق تاني بكرة<br />بكرة يوم بيتوحد فية 85 مليون واحد في وقت واحد يا رب<br />نفسي اسمعها مع بداية صفارة الحكم مصر كلها بتقولها بي اقوي ما عندها<br />يــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــا رب<br />اشوفكم بكرة بعد الماطش وانشاء الله فايزين"
