text = "انا يا جماعة روحت الاستاد وكنت اعد فى الدرجه الثالثه شمال وانا جتلى تذكرة 2 بس بصراحه انا مختهاش لانى من مشجعى الدرجه الثالثه شمال وبصراحه هو التشجيع والاغانى كان قبل المبارة وكان فى الشوط التانى ومافيش حد فينا اعد خالص حتى حصلت خناقه بسبب الوقوف بس بعد ما جيه الجون الاول لقيت حاجة غيربه جدا الاتنين الى كانو بيتخنقو لقيتهم بيحضنو بعض فعرفت كويس جدا انها مش مجرد كورة ولعيبه دى حاجه بتجمع الشعب على قلب واحد وحب واحد واخيرا انا بعتزر ان ماكنش فى تشجيع كتير لان الخوف ان الماتش يضيع مننا وكنا مش بنقول غير يا رب وانا قولت يا رب ماتنيمش البلد دى حزينه"
