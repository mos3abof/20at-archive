author = "المايسترو"
posted = "2009-11-16"
text = "حقيقه انا من الناس اللي راحوا الاستاد احنا مشكلتنا بس كانت في اجراءات الامن كانت مشددة جدا وفي نفس الوقت كان المطلوب مننا كمان اننا منتعصبش ولا تنرفز وجمهور الجزائر الصراحة جمهور كان مستفز مووت يعني حرقوا العلم بتاع مصر في المدرجات قبل الماتش وكمان بعد الماتش كانوا بيشتموا<br />ومع ذلك احنا ككماهير مصريه معملناش اي حاجه ليهم شجعنا وبس والحمد لله ربنا كافأنا وفزنا في ماتش بعتبره عصيب مووت<br />انا بس من ملاحظاتي ان البنات اللي كانوا في الاستاد كان في منهم بنات رايحه عشان تتصور بس ومكنش في دماغها خالص طول الوقت بتدور على الكميرات<br />بس عمتا رغم البهدله في الدخول والخروج من الاستاد لكن كل دا بيتنسي مع الفرحة بالفوز"
archived = "2009-11-17"
capture_url = "https://web.archive.org/web/20091117020715/http://www.20at.com:80/masr/hot-topics/14054-2009-11-15-16-06-48.html"

