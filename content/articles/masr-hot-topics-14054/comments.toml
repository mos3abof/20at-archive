author = "محمد عزوز"
posted = "2009-11-16"
text = "انا رحت الاستاد وكان يوم بجد جميل طبعا عشان الامل تجدد لمصر وكان الشعب المصري في قمة الرقي والروعة انا كان المفروض ادخل درجة أولي يمين فجأة لقيت نفسي في المقصورة مش عارف ازاي المهم ان احلي لحظات المباراة عند الدقيقة 45 جمهور مصر انتفض و قال كلمة هزت الملعب واللعيبة هي كلمة كأس عالم كانت كفيلة بتحريك الروح في اللعيبة وكانت الفرحة التي لن ولا انساها مادمت حيا بحبك يا مصر"
archived = "2009-11-17"
capture_url = "https://web.archive.org/web/20091117020715/http://www.20at.com:80/masr/hot-topics/14054-2009-11-15-16-06-48.html"

