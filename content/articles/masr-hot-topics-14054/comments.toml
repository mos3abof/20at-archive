text = "عندى ملاحظة ان البوابات فتحت من الساعة 11 مش 1<br />و الصراحة مشفتش حد بيحرق علم مصر مع العلم انا كنت ف 3 شمال , و كان فى 5 شماريخ ف 3 شمال لوحدها<br />ريعو الكابو بتاع ألتراس أهلاوى , كان موجود ف 3 شمال و قام بوظيفته و ساعد الجماهير فى تنظيم التشجيع , و طلع وقف على السماعات و الأمن كان هينزله بس كل الجمهور ف صوت واحد \" سيبة سيبة \" و لحظة الهدف التانى بجد لقيت نفسى واقف ف صف تانى و فعلا بحضن ناس معرفهاش<br />الحمد لله على كل شئ و البقية تأتى فى السودان"
