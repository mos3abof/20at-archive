[[comments]]
order = 0
subject = "المسئلة مش Bouns"
author = "على"
posted = "2005-12-06"
text = "راءة القرآن الكريم و تعلم أحكامه و ترتيله و طلب العلم فيه و فى غيره من فروع الدين فرض على كل مسلم ... المقصر فيه أثم قلبه<br />مسئلة طلب العلم دى خطيرة جداًُ ... لأن خطأ بسيط ممكن يتسبب فى شركك بالله و أخراجك عن الملة ... لو الخطأ ده حدث أثناء طلبك العلم الله سوف يغفره لك أن شاء ... لكن لو حدث و أنت مقصر عن طلب العلم .... ربنا ما يوريك النار يا حلو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103049/http://www.20at.com/article2.php?sid=9"

[[comments]]
order = 1
subject = "قرآن ربي !"
author = "أختكم"
posted = "2005-12-11"
text = "أولا ..<br />مقال متميز، جزى الله من أعدته عنا خيرا ..!<br />ولعلي أذكركم فقط بتلك الوصفة الرائعة التي قدمها لنا رسول الله صلى الله عليه وسلم .. حين قال فيما يعني قوله: \" من أراد الدنيا فعليه القرآن .. ومن أراد الآخرة فعليه بالقرآن .. ومن أرادهما معًا، فعليه بالقرآن !! \"<br />فأعاننا الله وإياكم على التمسك بهذا الكتاب العظيم الكريم .. وأن يصل قلوبنا به دوما !<br />اللهم آمين .. اللهم آمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103049/http://www.20at.com/article2.php?sid=9"

[[comments]]
order = 2
subject = "فضل الاستغفار"
author = "ايمى"
posted = "2006-01-18"
text = "عن ابى هريرة رضى الله عنة قال(رسول الله صلى الله علية وسلم من قال حين يصبح وحين يمسى ( استغفر الله العظيم الذى لا الة الا هو الحى القيوم واتوب الية)مائة مرة غفر الله لة وجعل لة من كل ضيق مخرجا )<br />صدق رسول الله صلى الله علية وسلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103049/http://www.20at.com/article2.php?sid=9"

[[comments]]
order = 3
subject = "القران منهج"
author = "هاجر عبد الرحمن"
posted = "2006-02-22"
text = "القران منهج لابد ان يلتزم به المسلمون الغرب تبدا من عندهم الامراض لانهم لا يسيرون على منهج محدد لماذا؟ لانهم يضرون للتفكير فى كل شئ عندما يفعلونه لانهم لا يملكون النص الجاهز الذى يسيرون عليه نحن عندنا النص الجاهز لنعمل به فلماذا لا ناخذ به انه ات على طبق من ذهب فلنجعل لنا ورد كل يوم نقراه 5 ايات فقط حتى لا تكون بيوتناو قلوبنا كالبيت الخرب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103049/http://www.20at.com/article2.php?sid=9"

[[comments]]
order = 4
subject = "رضى الله"
author = "مريم"
posted = "2006-03-08"
text = "قال رسول الله صلى الله عليه كلمتان خفيفتان على اللسان حبيبتان الى الرحمن ثقيلتان في الميزان سبحان الله وبحمده سبحان الله العظيم مائة مرة... ثم صلو على رسول الله واسالكم ان لا تحرموني من دعائكم وجزاكم الله خيرا احتكم في الله مريم ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103049/http://www.20at.com/article2.php?sid=9"

[[comments]]
order = 5
subject = "اتعلم من الرسول"
author = "عبد الرحمن و اسامه"
posted = "2006-05-21"
text = "اتعلم من رسول الله فينا * رسول الله خير المرسلين رسول الله قره كل عين * وخير الخلق صدقا اجمعينا نبى حبه ملء القلوب * نبى رحمة للعالمينا نبى نفتديه بكل شىء * وفرض حبه شرعا ودينا فانكنتم مكرتم فاستفيقوا * فمكرالله فوق الماكرينا نشرتم زات يوم مانشرتم * فوحدتم جميع المؤمنينا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103049/http://www.20at.com/article2.php?sid=9"

[[comments]]
order = 6
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-18"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103049/http://www.20at.com/article2.php?sid=9"
