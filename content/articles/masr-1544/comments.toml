subject = "الرد جاهز عند الحكومة"
author = "مصري حر"
posted = "2007-02-06"
text = "أؤكد لكم أن الحكومة ستخرج علينا عن طريق مخبرين أمن الدولة في الصحف القومية وعلي رأسهم مخبر صفحة الحوادث الحاج أحمد موسي في الاهرام وسيقولون ان الخوان المسلمين هم السبب في الاضراب في شركات مصر ولا تستغرب علشان قالوا قبل ذلك انهم ياعيني وراء السفاح....الهذه الدرجة تستخفون بعقولناياحكومة الحزن الوطني"
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208234612/http://masr.20at.com:80/article.php?sid=1544"
