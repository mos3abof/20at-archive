[[comments]]
order = 3
subject = "هما يعنى هما لوحدهم"
author = "هما عمال الغزل لوحدهم إللى إتنهبت حقوقهم مهو كل عمال مصر وفلاحيها ومثقفيها حقوقهم منهوبة"
posted = "2007-02-06"
text = "ليه نترك عمال الغزل لوحدهم ليه ميخرجش الشعب كله علشان يرفض الفساد ونطهر مصر<br />يا مصرى أنت صاحب البلد وحقوقك تهدر وتهان إلى متى الخنوع والضعف هل تخاف على رزقك الذى حفظه الله لك بعيداً عن الذل والمهانة أم تخاف من حرامى جبان سرقك وحرم عليك الحرية أم تخاف من رب العالمين الذى سيستقبلك شهيداً ويكرمك فى جناته<br />أخرج يا مصرى ساند المظلومين الذين أنت واحداً منهم المهدرة حقوقهم والمنهوبة والمكممة أفواهمم إلى متى يا مصرى يا حفيد مصطفى كامل وأحمد عرابى وسعد زغلول إلى متى يا مصرى يا صاحب الحق فى بلدك ترضى الذل لنفسك وكرامتك"
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208234612/http://masr.20at.com:80/article.php?sid=1544"

[[comments]]
order = 4
subject = "الاخوان هم السبب"
author = "ايمن امام"
posted = "2007-02-06"
text = "انفراد صحفى - هذا هو عنوان المقال الذى سيسعى اليه- كتبه السلطه- علم كاتب هذه المقاله من مصدر امنى رفيع المستوى- ان اجهزه الامن قد القت القبض على مجموعه من هؤلاء المضربين وانهم اعترفوا بأنهم تلقوا اموال مغسوله من الاخوان المسلمين- لزعزه الامن واثاره الفوضى- والاضرار بالامن القومى للبلاد- وقد اعترفوا تفصيليا بختطهم - هذا وقد تم ضبط مصحف وسواك مع احدهم- وبتحليل الحامض النووى للسواك تبين انه زرع فى افغانستان- فى مزارع مملوكه لابن لادن-كما تم ضبط اسلحه فى منزل احدهم عباره عن<br />مدفع كلاشينكوف- طياره اف 16- عبوات ناسفه عباره عن الغام سرقت منذ الحرب العالميه قبل التاريخ- وعشرين دولار- وحصيره بلاستيك تستخدم للصلاه - وبمواجهتهم- اعترفوا تفصيليا- وقد صدر قرار - بالتحفظ على اموالهم- هنا القاهره-<br />ثم يخرج علينا احد محللى البول والبراز ليحلل لنا اسباب هذا الاضراب - وينعى على خطباء المساجد اسلوب ومضمون خطبه الجمعه وانها السبب الرئيسى لما حدث<br />ثم يخرج علينا احد المنورين او المستنيرين- ليقول لنا ان الاخوان المسلمين يقومون بغسل ملابسهم فى غساله فول اتوماتيك - وعليه يجب مصادره الغساله<br />اه يابلد/ ايمن امام"
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208234612/http://masr.20at.com:80/article.php?sid=1544"

[[comments]]
order = 5
subject = "البرنامج الانتحاري للرئيس مبارك"
author = "عدد العاطلين وصل الحد لله الي 10 مليون عاطل من الشباب."
posted = "2007-02-06"
text = "وقد تبادل سمو الوالي المقدس حسني مبارك ..<br />التهاني مع سمو الخليفة جيمي مبارك باشا التهاني بهذا الرقم العظيم .<br />وقد اعرب معالي الوزير احمدنظيف الخفيف سعادته بهذا الرقم مع تمنياته الكبيرة بزيادة هذا الرقم ليصبح 15 مليون في الخطة الخمسية القادمة.<br />وقد اعلن معالي الوزير نظيف في الصحف الحكومية المباركية انه من اهم انجازات عهد العارف بالله المقدس حسني ,, انه اذا وقف العاطلين بجوار بعضهم البعض في طابور فسوف يصل الطابور من الاسكندرية الي اسوان, وتهدف الخطة الخمسية النظيفية القادمة وصول طابور العاطلين من الاسكندرية الي دولة جنوب افريقيا بهدف دعم العلاقات المصرية الجنوب افريقية, وتشجيع الاستثمارات والخصخصة والمصمصة."
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208234612/http://masr.20at.com:80/article.php?sid=1544"

