text = "شدي حيلك يا بلد<br />شدي حيلك يا بلد<br />شدي حيلك يا بلد<br />وما نيل المطالب بالتمني .:. ولكن تؤخذ الدنيا غلابا<br />وما استعصى على قوم منال .:. إذا الإقدام كان لهم ركاباً<br />شدي حيلك يا بلد<br />شدي حيلك يا بلد<br />شدي حيلك يا بلد"
