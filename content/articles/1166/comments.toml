[[comments]]
order = 9
subject = "نعم لقد صعد البشر الى القمر"
author = "محمد عبدالقادر"
posted = "2006-07-29"
text = "ما طرحتيه يا اخت نجوان هو ما نشاهده في عالمنا العربي بشكل عام من معاملة تكاد تخلو من الاحترام في القطاع العمومي بشكل خاص والسؤال الذي يطرح نفسه هل هنالك اتفاقية عربية حول كون الموظفين بهذا الاستايل ؟ من عبس ونكد وإحباط ومعاملة لاتليق مع الحيوانات .<br />والسؤال الاخر نسمع كثيراً جدا عن الحكومة الالكترونية والتعامل الالكتروني ولكن ما نشاهده على ارض الوقع هو ان الطوابير بتطول اكثر واكثر فهل ما يعملونه لتنظيم الحكومة الاكترونية ام لتنظيم الطابور الالكتروني من إضافات حواجز اضافية وما شابه .<br />هل سياتي يوم لن نشاهد فيه الطوابير وهل سياتي يوم لانعرف ماهو الزحام .<br />في الخارج صعدو القمر واخترعو الانترنت ونحن لازلنا نقبع في الطوابير ويضيع العمر بين طابور طويل وبين جهل مقيم .<br />تحياتي للجميع وخصوصاً لكي يانجوان اتحفتينا بكلامك الرائع واعجبني فيكي تسلسل افكارك واستمري والى الامام والله يوفق الجميع .<br />تحياتي ،،،،<br />محمد عبدالقادر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133418/http://www.20at.com/article2.php?sid=315"
