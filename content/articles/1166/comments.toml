[[comments]]
order = 0
subject = "ارحموا من في الارض"
author = "El-Basha ( M.G )s"
posted = "2006-01-24"
text = "السلام عليكم و رحمة الله و بركاته<br />موضوع جميل جدا\" و مهم للتعرف على موظفين الحكومة و متشكرين جداًً\" على الموضوع دا بس زي ما انتي حكيتي على مواقف الموظف الحكومي في التعامل مع الجمهور احكي كمان على مواقف رجل الشارع في التعامل مع الموظف الحكومي.<br />فلو سمحتم يا جماعة محدش يتكلم عن الموظف الحكومي لانه اوقات كتيرة بيكون تحت ضغط عصبي شديد جدا\" بيجبره على اتباع السلوك دا الناس.<br />و يارب تتعيني و تكوني موظفة في الحكومة و بعد كدا نشوفك حتكتبي عليهم ازاي."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133418/http://www.20at.com/article2.php?sid=315"

[[comments]]
order = 1
subject = "شكرا"
author = "محمد أحمد"
posted = "2006-01-24"
text = "موظف الشباك بتاع الاتوبيس...رحت الصبح اقوله ..سلام عليكم...مردش..سلام عليكم...مردش ...كذا المرة ...المهم تفضل عليافيالنهاية بانه بص لي من تحت النضارة \"المقعرة \" اللي انتي كاتبة عليها ..بص لي بقرف وقال لي الاتوبيس هيتاخر ساعة ...ولما حبيت اسأل سؤال تاني ...اداني ضهره و نفض لي ...<br />شكرا لموظف الشباك الذي لا يقوم بدوره ...ونترك حسابه لله تعالى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133418/http://www.20at.com/article2.php?sid=315"

[[comments]]
order = 2
subject = "ااااااااااااااه يا نجوان"
author = "نيفين"
posted = "2006-01-25"
text = "بتسألى يا نجوان اتعرضتا ليهم و لا لا<br />طيب دا احنا ربنا خلقتا علشان نقف ف طوابير و نتعامل مع موظفين الشباك<br />و هما طبعا اساتذه تنفيض و الشاطر اللى يصبر<br />بصراحه كنت كتير بترحم منهم بالكوسه<br />و هنروح بعيد ايه ما البرنامج العام بيصبح على كل مصر الصبح ف برنامج همسه عتاب بالعباره التى تملا المواطن الكادح بالامل و هو نازل شغله و كله امل و هى عباره فوت علينا بكره يا سيد<br />و سيد الغلبان يفوت و يفوت و يفوت<br />و مصر كلها سيد<br />بس اسلوبك حلو يا نجوان و الوصف بتاعك فيه شويه من اسلوب يوسف ادريس<br />لى حبه من الافلام العربى اللى صورت موظف الشباك الى ان قتل وصفا<br />هنقول ايه<br />ايام و بنعيشهاعلى راى عمرو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133418/http://www.20at.com/article2.php?sid=315"

[[comments]]
order = 3
subject = "يوميات مواطن وموظف"
author = "محمد كمال"
posted = "2006-01-25"
text = "انا في الماضي كنت فاكر ان الأفلام بتزودها شويه بالنسبه لمشكلة الروتين وموظفين الحكومه لغايت امبارح لما رحت الشهر العقاري . علشان افسخ عقد شركه اعدت جنبه ساعه وبعد ساعه قالي انت ورقك ناقص ....مع كل الي عمله فيه صعب عليه الصراحه تخيلوا واحد شغال بلا توقف امامه طابور لا ينتهي من الناس وقاعد على مكتب متهالك وفي بيئة عمل سيئه ..اكيد مش حاننتظر منه انه يقابل الناس بأبتسامه لأنه بيحقد عليهم ...الحل بدل ما الحكومه توظف ناس في شركات القطاع العام الخسرناه ومابيعملوش حاجه وبيكونوا عماله زائده توظفهم في المصالح الحكوميه لكي يخف الضغط على الموظفين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133418/http://www.20at.com/article2.php?sid=315"

