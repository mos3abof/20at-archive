[[comments]]
order = 5
subject = "هما ما يستاهلوش غير كده"
author = "سوسة المفروسة"
posted = "2006-01-25"
text = "انا ليا تجربة بس مش كمواطنه \"\"\"لكن كموظفة<br />ربنا من عليا و بقيت صيدلانية و ابت الحكومة الا ان تضمني لجموع الموظفين لا والادهى اني واقفة على شبالك زي اللي انتم بتوصفوة بصرف للناس علاج طول النهار --و عشان Hنا وزميلاتي كلنا بنات و كلنا من سن بعض و ماعناش راجل---بنتعرض كل يوم لسخافات المرضى رجال و نساء<br />ا--لو حد فيكم جرب التعامل مع الجمهور هيفاجا بحجم الجهل و الغباء و الرخامة و قلة الذوق و الاستعباط وساعات قلة الادب بتاع الجمهور المصري--حاجة تقرف---والله انا بابقى واقفة قدامهم مش طايقاهم و لاطايقة غباهم<br />ولا ينفع تبتسم في و شهم و لا تقولهم كلمة حلوة<br />دول زي اليهود\"تديلهم صباع ياكلوا دراع\"<br />امضاء : موظفة مقروفة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133418/http://www.20at.com/article2.php?sid=315"

