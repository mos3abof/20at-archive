[[comments]]
order = 0
subject = "نعم"
author = "طاهرة"
posted = "2006-03-31"
text = "مرحبا<br />انا معجبة بها الموضوع ولكنى كتير مشغولة عم تعرفو ليش ؟؟؟<br />لان اليوم استار اكاديمى ويوجد احتمال لخروج الفلسطينى فادى ؟فهل هدا عدل ؟<br />هذا ما عدل واللة كتير يعتبر ها البرنامج ظالم لو خرج فادى<br />لذا ادعو كل محبى فادى ومحبى فلسطين ولبنان ان يعطو صوتهم اليوم لفادى<br />شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123934/http://www.20at.com/article2.php?sid=639"

[[comments]]
order = 1
subject = "بطلو بقي"
author = "محمد"
posted = "2006-03-31"
text = "انتي يا اخت طاهره<br />هي الاغاني حرام ولا حلال عشان تشغلي نفسك بستار اكاديمي واحنا هنا في القسم الديني مش معقول كده نفضل نقول المغني ده والمغنيه دي<br />مش عارف الدنيا جري فيها ايه<br />الاغاني حرام يا جماعه<br />بطلو بقي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123934/http://www.20at.com/article2.php?sid=639"

[[comments]]
order = 2
subject = "تصحيح"
author = "طاهرة"
posted = "2006-03-31"
text = "لا محمد الاغانى مو حرام عنا<br />يمكن لانكم مصريين متعصبين اذا بتصير حرام عنكم لكن عنا مو حرام<br />وبدى شوية تعقلو هيك ؟؟؟؟وتصيرو متحضرين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123934/http://www.20at.com/article2.php?sid=639"

[[comments]]
order = 3
subject = "السلام على من اتبع الهده"
author = "ام الخير"
posted = "2006-04-01"
text = "الى كل اخ او اخت اوصيكم ونفسي ان نقراء القران كل يومعلى الاقل اخر ايتين من سورة البقره قال الرسول الكريم من قراء اخر ايتين من سورة البقره في ليلتو كفتاه اي حفظته<br />اما الاخت الطاهره اقول لها الله المستعان لما انتي مشغوله ليه تكتبي اصلا اسال الله ان يهديكي ويشغلك بما ينفعك انا وجميع المسلمين السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123934/http://www.20at.com/article2.php?sid=639"

[[comments]]
order = 4
subject = "نعم"
author = "فلسطينى"
posted = "2006-04-01"
text = "انا ارى ان الاخت طاهرة على حق بكل كلمة تقولها<br />لان الاغانى مو حرام وصوت المراة ماهو عورة<br />وهيدا بالفعل يدل متل ما خبرتكم ان المصريين متعصبين مو فى الاغانى<br />لا<br />اقصد ايضا اشياء كتير كتيرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123934/http://www.20at.com/article2.php?sid=639"
