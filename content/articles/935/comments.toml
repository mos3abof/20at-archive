subject = "اشمعني دا اللي مش حيتحرق"
author = "هووووووووبه"
posted = "2006-06-19"
text = "انا اول مره اتعرفت علي الصومال كانت فزوره بتقول ايه البلد اللي اولها الف ولام واخرها الف ولام وفي النص ركن من اركان الاسلام يلا مش لاقيه حاجه اقولها غير حسبي الله ونعم الوكيل"
