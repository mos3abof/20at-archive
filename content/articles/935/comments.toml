[[comments]]
order = 2
subject = "الاضواء ، الآن لماذا؟"
author = "قد تلحظون -اخوتي- أن الصومال نسي لفترة وخاصة بعد خروج الامريكان -أظن ذلك في بداية التسيعينات - وظل الصومال مسرحا للاعتراك الداخلى طيلة هذه السنين ، ولم يحظى الصومال بهذا الاهتمام الا الان والسبب في ذلك هو انتصار قوات المحاكم الشرعية وبسط نفوذها على العاصمة وما حولها."
posted = "2006-06-20"
text = "فالغرب لا يهتم لما يحصل للمسلمين -ولو أفنى بعضهم بعضا أو أفناهم عدوهم ، ولكنه يبدي اهتمامه المفاجئ عندما يشم نجاح أي فصيل اسلامي صادق في السيطرة على الامور او استلام الحكم ، وقد رأيتم كيف ظل العالم يتفرج على ذبح اخواننا في البوسنة والهرسك على يد الصرب المجرمين ، ولم يتدخل حتى بدأ المجاهدون في البوسنة احراز انتصارات على الصرب.<br />وهكذا نسيت الصومال دهرا ؛ حتى قامت القوات التابعة للمحاكم الشرعية بمباشرة الامر. الان ستتدخل كل القوى الاجنبية بل حتى العربية ، والشعار هو الحفاظ على الشرعية في الصومال وحفظ الامن ، وأما الحقيقة فهي تنحية الاسلاميين الصادقين عن الحكم ، أينكم قبل ذلك؟؟!!!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125259/http://www.20at.com/article2.php?sid=968"

[[comments]]
order = 3
subject = "القضاء على الا(سلام)رهاب"
author = "رائد بغدادي"
posted = "2006-06-22"
text = "انا أؤيد الاخ صاحب تعليق...الاضواء ,الان لماذا؟... فهذا بالضبط مايحصل .<br />ان مفهوم الغرب للارهاب هو ان الاسلام دين الارهاب وان المسلمين هم الارهابيون ..أذلهم الله ونصر الله الاسلام والمسلمين وكما رأيتم وسمعتم على مواقع الانترنيت كيف يدرسون اطفالهم في المدارس ان الاسلام يعني الارهاب واليوم نرى المحتلين في العراق يخلقون الفتن بين الشعب الواحد حتى يتقاتل المسلمون فيمابينهم ويتركون قتال المحتل كما هو الحال في فلسطين جعلوا اطياف المقاومة تلتفت عن مقاومة الاحتلال الاسرائيلي لبلدهم للقتال فيمابينهم على السلطة ... ولما العجب فالصومال ليس اول ولا اخر بلد مسلم تطأه الفتنه .ولكن تأكدوا ان الاسلام هو صاحب السر الالهي الذي كلما زاده الاعداء خناقا كلما زاده الله بحكمته قوة وعزة ولذا فهي بشارة للمسلمين فلاتخافوا ولاتحزنوا ودليل ذلك انكم تجدون كلما زادو توحشا على الاسلام كلما ظهر لهم جند من جنود الله يبطش بهم ويزيدهم رعبا وذلا ... شخص واحد بسيط لكن فيه من الايمان مايقهر أمة الكفر والظلال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125259/http://www.20at.com/article2.php?sid=968"
