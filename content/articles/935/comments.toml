subject = "حاجة كويسة"
author = "ليلى"
posted = "2006-06-20"
text = "يعنى انا كان نفسى افهم ايه اللى بيحصل وانت قلت والله بس واضح ان الدنيا فعلا ملعبكة سواء عناك او فى السودان او اى مكان عربى، لكن انا مبسوطة من فكرة الموضوعات المجمعة او الملف عن حدث معين، برافو باعشرينات"
archived = "2006-11-02"
