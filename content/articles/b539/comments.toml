subject = "انتو ايه اللي مزعلكو؟"
author = "ميرو"
posted = "2006-08-13"
text = "انا واحد من الناس اللي بعمل الموضة اللي انتو بتستهزاوا بيها وبعدين انتو مالكو لما تشوفوا واحد ولا واحدة عامل اي حاجة دي حرية شخصية قلبتوها خلاص لموضوع ؟ والله واللي بيتكلم ده تلاقيه نفسه يقلد اللي عامل الموضة بس ميقدرش لان معندوش الجراة او معندوش الحرية ولا يملك غير تحويل الموضة لموضوع ده يبقي عقلة تعبان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114513/http://www.20at.com/article2.php?sid=539"
