[[comments]]
order = 6
subject = "موضات الجامعة"
author = "سمير محمد علي"
posted = "2006-06-07"
text = "موضوع الموضة مش بس لبس غريب احنا بنلبسة في الجامعة ده كمان في تسريحات الشعر والسلاسل واللذي منه يعني تلاقي مثلا واحد منكوش خالص وشعره كبير تلاقي غيره شايل ع الزيرو وواحد الجيل اشتكي من شعره وشعره اشتكي من جيله وغير كدة كتير لازم كلنا نجاري اللي بيحصل في الجامعة وانا شايف ان ده الصح ومش غلط لكن نظرة المجتمع خارج الجامعة هي اللي بتكون نظرة راجعية لان مش معقول الناس اللي خارج الجامعة دي هتفهم عن طلاب الجامعة اصحاب المؤهلات العليا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114513/http://www.20at.com/article2.php?sid=539"

