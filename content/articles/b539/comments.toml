posted = "2006-07-13"
text = "عندك حق يا أحمد في التعليق اللي انت قلته لكن عنوان التعليق هو اللي غلط،مظنش يعني انه ينفع نشوف ظاهرة منتشرة ومنحاولش نتكلم عنها وكل واحد يقول رأيه ولا مشكله ومنحاولش نحلها،يعني مينفعش يكون كل واحد في حاله."
