[[comments]]
order = 4
subject = "مش هايف ولا حاجة"
author = "رنا"
posted = "2006-03-28"
text = "الموضوع مش هايف ،فعلا الجامعة مليانة موضات وتقاليع منها المعقول ومنها اللى يقرف ،يعنى لما تلاقى واحدة لابسة 14 لون مرة واحدة مالهمش علاقة ببعض مع بدى وحزام وجينز ضيق ....وفى الاخر بقي لزوم التدين يعنى طرحة!موضة انتشرت بسرعة الصاروخ السنة دى وبقت البنات كلها نسخ من بعض ، بالنسبة للبس ....نصيحة الكلاسيك أشيك وبينفع لمدة طويلة!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114513/http://www.20at.com/article2.php?sid=539"

