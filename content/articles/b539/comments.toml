[[comments]]
order = 2
subject = "لا يا عم احمد ..... (‘عييييييييب)"
author = "sweet_princess"
posted = "2006-03-08"
text = "اقول تعليقي الاول وبعدين نبقى نتكلم .<br />اولا بالنسبه للمهرجانات اللي بنشوفها كل يوم فدا شيئ انا اعتادته ..... لكن اللي بيقرفني قوييي ... كم الالوان اللي بلاقي شخص واحد لابسه (احمر على بني على برتقاني )والحكايه بقت( زحاليق خالص).. المشكله دلوقتي بقت في انعدام الزوق ... المفروض اشيك انسان في الدنيا الوان هدومه مش لازم تزيد عن 3 لكني بلاقي 30 لون وما فيش اي تناسق فيهم ..<br />دا غير لبس الصبيان اللي بقى بناتي ولبس البنات اللي بقى رجالي اففف دي بقت حاجه تقرف والزوق اتعدم من عند الناس حتى في لبسهم... ودا موضوع محتاج نظره .<br />اما الكابتن احمد : هبهوب ما غلطتش كلامها صحيح .<br />والموقع ما نشرش الموضوع ليك لوحدك ولو ما عجبكش ممكن جدا انه يعجب غيرك.<br />و لما تضايق قوي كده ما تعلقش وبلاش ترمي كلام تقيل ع الناس ومالوش لازمه والا دا يبقى (استعراض ومنظره ع الفاضي )..وارجو انك تتقبل كلامي بصدر رحب وما تتضايقش ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114513/http://www.20at.com/article2.php?sid=539"

