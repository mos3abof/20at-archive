[[comments]]
order = 8
subject = ""
author = "من الانترنيت"
posted = "2008-02-03"
text = "اِتهم الكاتب الإنجليزي الأصل ديفيد مكاير اليهودي الديانة، اليهود بالتنكر لمصر رغم ما قدمته لهم، وما وفرته لهم من أجواء لممارسة شعائرهم، والتعبير عن آرائهم في إصدارات صحفية سمحت الحكومة لهم بإصدارها.<br />وروى في تقرير مطول بعنوان: \"يهود مصر\" نشرته صحيفة \"التقرير\" الجنوب أفريقية كيف اِستقبل الشعب المصري 14 ألف يهودي نزحوا إلى مصر أثناء الحرب العالمية الأولى، وشاركوهم العيش في أمان وطمأنينة وسلام، وكانوا يعاملون معاملة أهل البلد، لكن مع الشعور بخطر الحركة الصهيونية، تم ترحيل خمسة آلاف يهودي إلى فلسطين وبلاد الشام.<br />وأوضح أن الحكومة المصرية، وأثناء عملية نزوح اليهود إلى مصر أرسلت مندوبًا من وزارة الداخلية لدراسة أحوال اليهود اللاجئين واحتياجاتهم، وقابل إدجار ساويرس رئيس الطائفة اليهودية بالإسكندرية السلطان حسين كامل الذي تعاطف مع اللاجئين، وأمر بفتح مناطق القباري والبلدية ومبنى الحجر الصحي والمحافظة ومحطة الورديان بالإسكندرية لهم. كما أمر بصرف إعانة يومية وإقامه مدارس كان يدرس فيها الأطفال باللغة العبرية.<br />وأضاف أن اليهود حظوا بنفس الرعاية في عهد الملك فؤاد، حيث تولى وزارة المالية في مصر يوسف قطاوي باشا، وهو يهودي لاجئ ولم تقف مصر حائلا للطموح المالي لليهود المقيمين فيها، فظهرت أسماء رأسمالية تحكمت في الاقتصاد المصري مثل شيكوريل الذي أسس متاجر شيكوريل، وريكو الذي ساهم في تأسيس بنك مصر مع طلعت حرب باشا، وكذلك موسى قطاوي الذي أسس خط سكة حديد أسوان وشرق الدلتا وشركة ترام وسط الدلتا.<br />وأكد الكاتب أن اليهود كانوا يمارسون طقوسهم الدينية بحرية تامة إلى الحد الذي وافقت فيه السلطات المصرية على إنشاء أكثر من 80 معبدا لهم، 29 بالقاهرة، و20 بالإسكندرية، والباقي موزع على مختلف أنحاء البلاد، كما أصدر اليهود صحفا تعبر عن أفكارهم ومصالحهم منها مجلة \"إسرائيل\" التي صدرت بثلاث لغات ومجلة \"إسرائيل مصر\" التي صدرت بالفرنسية.<br />ورغم ما قدمته مصر لهم، يشير الكاتب إلى تنكرهم إلى مصر، ويدلل على ذلك بأعمالهم التخريبية في بداية العهد الجمهوري لمصر بعد الإطاحة بالملكية، مشيرًا إلى فضيحة \"لافون\" التي كانت تهدف وقتذاك إلى إحراج الحكم الثوري، وعرقلة أي اتفاق مصري بريطاني للجلاء عن مصر.<br />وأشار إلى قيام اليهود بسلسلة تفجيرات عام 1954، حيث نسفوا مبنى البريد بالإسكندرية ووكالة الاستعلامات الأمريكية والمركز الثقافي الأمريكي بالقاهرة.<br />ولفت إلى أن إسرائيل زرعت عشرات الجواسيس في مصر بهدف خلخلة أمنها ورصد الأوضاع الداخلية، ومن هؤلاء إيلي كوهين، باروخ مزراحي، شاكر فاخوري، فؤاد حمودة، خميس بيومي، زكي حبيب، توماس المصري، رجب عبد المعطي، يعقوب جاسم، سمير باسيلي انشراح موسى عزام عزام.<br />وذكر الكاتب أنه كان هناك عشرات الفنانين اليهود في مصر، منهم على سبيل المثال، ليلى مراد ونجمة إبراهيم وراقية إبراهيم وتوجو مزراحي وميمو رمسيس وكيتي، وأشار إلى \"خيانة\" راقية إبراهيم لمصر، بعد أن هاجرت إلى الولايات المتحدة، حيث عملت بقسم الاتصال والإعلام الخاص بالوفد الإسرائيلي بالأمم المتحده.<br />وتعليق عابــــــــــر: وعلى الدرب يسير مايسمى اقباط المهجر المبرشمين يرددون الاكاذيب بمنهج صهيونى<br />http://tarkalwzer1.maktoobblog.com/"
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719120750/http://www.20at.com:80/masr/t7kyk/8161.html"

