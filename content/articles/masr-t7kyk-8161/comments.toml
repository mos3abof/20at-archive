text = "اولا احب اوضح موقفى ان بفرق بين اليهوديه كديانه و بين الصهيونيه كمنحى فكرى و عقيده و قضيه يرعاها اللوبى الصهيونى<br />و اعتقد كما يعتقد البعض انه ليس بالضروره ان كل يهودى صهيونى<br />لكن كمسلمه انا بكره اليهود اللى اذو سيدنا محمد و اللى قتلو انبياءهم و اللى ملهمش عهدو كعربيه بكره الصهيونيه من اول بوتوكولات حكماء صهيون لحد اللحظه دى<br />و موضوع كون ان مصرى يهودى يغادر البلد للهجره لاسرائيل و يكون ولاؤه لمصر دى فكره مش قادره اتقبلها بصراحه<br />سواء عب الناصر او غيره خرجهم مجرد تواجدهم ف اسرائيل بيضع حد و حاجز نفسى عارفينه كلنا بيننا و بينهم"
