text = "الموضوع تافه ومبتذل ولا جديد فيه المطلوب إن أول قيمة للعمل الصحفي في كل العالم هي الجدة والسؤال للمؤلف الموقر ما هو الجديد فيما كتبت أيها الخ العزيز نقول له بهدوء وإخلاص يا أخي اتق الله وكن أميناص مع نفسك ومجتمعك ووظيفتك إن هذا الكتاب وأمثاله ليس إلا بضاعة مغشوشة تستغل هياج المشاعر وأحزان الجمهور العرب الضعيف المستضعف وإذا سألنا المؤلف الموقر ما هو الهدف من إصدار مثل هذا الكتاب في مثل هذا الوقت بالذات إنك أيها الجاهل تزرع بذرة لكوارث يمكن أن تحل بمجتمعاتنا جراء مثل هذه الكتابات إنها غلطات لم يقم بها الشعب ولم يخترها بل فعلها الحكام بجهالاتهم وانعدام معرفتهم بالدنيا والدين وكان الولى بك [ *** ]حفي عربي مسلم في هذا الوقت أن تراهن على قضيتك و أن تخرج إلى موقع الحدث إنها مهمتك التي لن ينوب أحد عنك في أدائها وهي فرض عين عليك يسألك الله عنه يوم القيامة فاعلم إن لم تكن تعلم ما قيمة الصحفي إذا قنع بأن يندس في غرفة الارشيف لاستخراج كلام فارغ تافه لا قيمة له ، متى كانت مصر عدوة لليهود ومتى كان الإسلام يقوم على التفرقة على أي أساس انظروا إلى الدولة الإسلامية في عهود ازدهارها عندما يكون في قمتها رجال مرفوعوا الرأس ففي مثل هذه الدول العزيزة عاش اليهود أفضل وضع لهم على تاريخهم الطويل ، والتاريخ يشهد وقرطبة خير مثال .<br />مشكلة اليهود تكمن لا في ذواتهم المفردة وإنما في العقل الجمعي المسوس الذي كان وسيظل إلى الابد سر اللعنة النازلة على رؤوس العامة منهم فمشكلتهم منهم وفيهم لا في المجتمعات أو الجماعات الاسلامية ،لقد عاتب الله المسلمون مرة بقوله \"ها أنتم أولاء تحبونهم ولا يحبونكم وتؤمنون بالكتاب كله وإذا لقوكم قالوا آمنا وإذا خلوا عضُّوا عليكم الأنامل من الغيظ قل موتوا بغيظكم إن الله عليم بذات الصدور \" هذه هي طبيعة النفس المؤمنة أنها صديقة وعطوفة ويتملكها ميل دائم إلى المشاعر الايجابية كالرحمة والحب.<br />علينا بهذه المناسبة ان نعترف كمسلمين وكمجتمعات مسلمة أننا وقعنا في خطأ كبير بطريقتنا التي تعاملنا بها مع بني جلدتنا من أهل الكتاب ، فعندما أباح الاسلام للمسلم الزواج من الكتابية إنما أراد أن يحتوي ما تبقى في مجتمعات المسلمين من جيوب للديانات السابقة إحتواءً اجتماعياً ولكن وللأسف ظل المنهج السائد في الحياة الاجتماعية للمسلمين هو منهج الجاهلية الأولى ومذهبها القائم على العرقية وتوهم النقاء ، وبتضييعنا لهذا المبدأ دفعنا ثمنا فادحاً ولا زال هذا الثمن يتضاعف يوما بعد يوم ."
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719120750/http://www.20at.com:80/masr/t7kyk/8161.html"

