[[comments]]
order = 15
subject = ""
author = "د. أحمد عزب"
posted = "2008-03-06"
text = "اليهود المصريين كانوا مواطنين مصريين مثلهم مثل باقي المصريين وكان رفيق نضال سعد زغلول هو حاييم ناحوم افندي وهو عضو البرلمان والحاخام الأكبر لليهود في مصر. بدأت الأحتكاكات بقيام الأخوان المسلمين بحرق محال اليهود في الأربعينات ثم حريق القاهرة الذي دمر معظم ممتلكات اليهود في مصر بدون اي ذنب. قيام المخربين اليهود بحرق سينما ريالتو بالأسكندرية والمركزين الأميريكي والأنجليزي اتخذ زريعة لأضطهاد يهود مصر بشكل عام مما يعطي اميركا مثلا الحق في اضطهاد كل المسلمين بسبب تفجيرات مركز التجارة العالمي. عبد الناصر سجن جميع الذكور اليهود الباقيين في مصر بعد 1967 وقامت سفارة اسبانيا بإصدار جوازات اسبانية لهم للسماح لهم بترك مصر، وكان من هؤلاء ابناء مصريين عظام مثل داوود حسني وعبده الحامولي. وعلى فكرة هجرة اليهود الي مصر في"
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719120750/http://www.20at.com:80/masr/t7kyk/8161.html"

