[[comments]]
order = 13
subject = ""
author = "د. أحمد عزب"
posted = "2008-02-25"
text = "لم يذكر المقال اعلاه المساهمات في الحركة الوطنية من قبل اليهود المصريين مثل حاييم ناحوم افندي والذي كان عضو البرلمان عن كوم امبو وصديق سعد زغلول واحد المساهمين في الحركة الوطنية المصرية، كما لم يذكر ان اليهود المصريين اضافوا الكثير الي مصر مثل يوسف قطاوي الذي اسس مدرسة الفنون الجميلة التي اصبحت كلية الفنون الجميلة، كما ان عائلة سوارس اليهودية هي التي خططت وطورت حي المعادي الذي نفخر به جميعاً!! هجرة اليهود الغربيين من اضطهاد اوروبا لهم الي مصر ف، اسست لثورة صناعية وتجارية في مصر فمعظم المحال الراقية اقيمت بأموال المهاجرين اليهود الغربيين مثل عمر أفندي، شيكوريل، بنزايون، الخ… اليهود المصريين في معظمهم كان انتمائهم الأول لمصر حتى بعد عام 1948، ولكن تأجيج المشاعر ضدهم من جماعة الأخوان المسلمين، حرق المحال اليهودية، حريق القاهرة، الحد على كراهية اليهود الذي تزايد في مصر بعد 1948، دعا بعضهم الي ترك مصر، ولكن الهجرة القسرية كانت بعد اعتقال جميع الذكور اليهود من قبل عبد الناصر بعد حرب 1967 ومنهم حفيد داوود حسني وعلاء الحامولي (القائمة موجودة على الأنترنت) وقامت السفارة الأسبانية بإثبات مواطنة معظمهم لها لكي يتم الأفراج عنهم ويتركوا مصر محسورين. اليهود ليسوا اعدائنا ولكن الصهاينة الذين اغتصبوا فلسطين؛ الجهلة منا حولوا الغضب والكراهية الي اليهود وسقطوا في فخ الحرب الدينية التي كانت تسعى اليه اسرائيل لتحويل الحرب من كونها حرب على ارض الي حرب مقدسة، وبطبيعة الحال فانها كانت ترغب في ذلك حتى تحصل على تأييد الغرب المسيحي الذي يستخدم نفس المرجع الديني والتفسير للأحداث (التوراة)."
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719120750/http://www.20at.com:80/masr/t7kyk/8161.html"

