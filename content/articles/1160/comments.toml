[[comments]]
order = 0
subject = "الوريث"
author = "مقال جميل"
posted = "2006-07-12"
text = "ولكن لي تعليقين<br />الاول ان الكلمة اسمها نوستلجيا .. مش نوستولوجيا وكأننا بننطقها نستولوبيا!!<br />شكرا دعاء على الموضوع ولكن خارج اسلوبك في رأيي ان ابن احمد زكي ممثل غير جيد و لكن جات له الفرصة على حس ابوه و خلاص<br />اما أنه موهبة و اكتشوفوها -سبحان الله- مرة واحدة فده حرام ..لأن الشاب فعلا نسخة طبق الأصل من احمد زكي ..لكن ملوش علاقة بحليم من قريب ولا من بعيدز.<br />عبد الحليم مكنش بيبربش بعنيه لدرجة مزعجة بالشكل ده<br />ولا عبد الحليم كان بيتسهوك بالطريقة المفتعلة دي .<br />الواد عامل زي اللي بيمثلوا على المسرح المدرسي ..و ايديه بتعلب دور رئيسي في الهبل اللي بيقدمه<br />لكن المشكلة ان ابناء الممثلين هما الصفوة و المختارين و اتولدوا بالموهبة ..و الفن موهبة مش وراثةعلى رأيهم !1لكن على الرغم من كده فأولاد الممثلين بيثبتوا فشلهم كل يوم<br />و بيثبت المنتجين و المخرجين و النقاد-أصحاب المصالح- أنهم بيجروا وراء لقمة العيش بعيد خاااالص عن الفن و مصلحته<br />وطالما كل حاجة في مصر بالراثة ..يبقى كارهين ليه ان جيمي يورثكوا<br />حاجة غريبة اوي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133344/http://www.20at.com/article2.php?sid=1064"

[[comments]]
order = 1
subject = "مجرد تعليق"
author = "نيللي"
posted = "2006-07-12"
text = "على فكرة هو فعلا ابن احمد زكي مالوش دعوة بالتمثيل لا من قريب ولا من بعيد شكلو فعلا بيمثل والممثل الحقيقي لازم يوصل الشعور والاحساس للمشاهد انو كل حاجة بيعملها حقيقي ومش تمثيل ممكن لو كان تم تدريبه بشكل افضل وادولو وقت اكتر يمكن كان قدم حاجة احسن الله واعلم بس احمد زكي مفيش اتنين بيختلفو عليه ممثل بكل معنى الكلمة وفيلم حليم كان اخر حاجة وضع فيها بصمتو كممثل موهوب وقدير فعلا .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133344/http://www.20at.com/article2.php?sid=1064"

[[comments]]
order = 2
subject = "مش خلاص يا احمد"
author = "ديمة"
posted = "2006-07-13"
text = "بعد وفاة احمد زكى صاحب احلى احساس على الشاشة العربية كتبت سناء البيسى عنوان كجلتها قائلة \"خلاص يااحمد\"، وساعتها اول ما شفت العنوان عيطت جامد وحسيت ان ف حد فى بيتى مات فعلا واختى ردت عل بما ان البيت كله من انصار افلامه وقالت بالعكس المفروض نقول مش خلاص يااحمد لأن احنا كان لينا فيه افلامه وبنحبه عشانها وهى لسه موجودة، فبجد الله يرحمك ويغفر لك يااحمد اذا كنت فى حياتك الدنيا ترتضى رضاه.<br />ويارب ابنك يكون موهوب بجد وله حق عشان يدخل المجال الممل ده ويكمل ويعمل حاجة كويسة .. والا ينسحب ويخلى صورتك الجميلة على الشاشة زى ما هى . . مع انه فعلا هيفضل فى ازمة وصعب يخرج عن جلبلا ابيه لأنه ليس شبه فقط لكن حتى يشبهه فى نظرة العين المميزة لكن فى حاجة ناقصة .. وانا هادخل اشوف الفيلم وبعدين ارجع اعلق تانى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133344/http://www.20at.com/article2.php?sid=1064"

