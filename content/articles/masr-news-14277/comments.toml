author = "عجوز يموت بقى"
posted = "2009-12-06"
text = "هو مكرم المكحكح مش يرتاح بقى<br />مش كفاية علية قزازة دواء الكحة وينام يتغطى بعد صلاة العشاء ويقرا شوية قران ينفعوة فى الاخرة<br />هو ماسك فيها كانها عزبة ابوة زى ابن — الكبير اللى بيفتتح المشروعات وهو على النقالة بالفيديو كونفرانس<br />هو مش فية سن تقاعد<br />وان العالم دى كل واحد يشوف لة تربة او يبنى قبر يتاوية<br />ويسيبوا الشباب تشتغل وتتحرك"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105204936/http://20at.com/masr/news/14277-2009-12-06-19-00-54.html"

