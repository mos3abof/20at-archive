subject = "ما أجمل الشتاء"
author = "بنت فلسطين"
posted = "2005-12-29"
text = "صراح انا اعشق الشتاء لأن المناظر الطبيعية في مدينتي الخليل تصبح جذابة اكثر ورائعة.<br />أما بالنسبة للبس فأنا بلبس بنطلونين وتلات بلايز صوف وبنطلونين وجكيت ولفحة وكفوف اليدين<br />وفي البيت بلبس بيجامة اكثر الاحيان ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114412/http://www.20at.com/article2.php?sid=165"

