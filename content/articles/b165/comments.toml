[[comments]]
order = 3
subject = "ميدو مشاكل"
author = "والله يا نجوان انا بتمني ارجع البس الكستور ده بتاع زمان , كانت أمي بتودينا لواحدة خياطة تعمل لنا بيجمات رائعة وكانت بتدفي جدا وبتعمل روح من الجو الدافئ ( جو عائلي ) لان البيت كله شبه بعضه لكن نعمل ايه في الزمن المنيل ده معدش فيه وقت الواحد يقعد في البيت ولا يفكر في الموضوعات دي"
posted = "2005-12-29"
text = "الواحد منا بيروح البيت ميت من التعب<br />والله كلام بجد من كتر التعب ممكن انام بهدومي زي منا ان شاءالله تكون بدلة<br />ربنا يرجعها ايام الكستور دي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114412/http://www.20at.com/article2.php?sid=165"

[[comments]]
order = 4
subject = "ايس كريم ف ديسمبر ايس كريم ف جليم"
author = "نيفين"
posted = "2005-12-30"
text = "و الله يا نجوات اتا اكيد زى كل الناس الطبيعيه ف الشتاء الا فى حاجه واحده و هى انى بموت فى الايس كريم طول السنه و بالزات ف الشتاء و بالزات اكتر فى الايام اللى بيبقى فيها الجو تللللللللللج<br />و بنصح كل التاس يجربو الموضوع دا و اكيد هيدعو عليا<br />و على راى عمرو دياب ايس كريم ف ديسمبر ايس كريم ف جليم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114412/http://www.20at.com/article2.php?sid=165"

[[comments]]
order = 5
subject = "الصيف والشتاء واحد"
author = "منى الجهني"
posted = "2006-01-16"
text = "والله انا عاااااااااادي بلبس لبس الصيف لاني مابحب البي شي تقيل احس نفسي راح انخنق يمكن لاالجوعندنا اغلب السنه صيف نستمتع بالبروده خاصه اني اشغل المكيف وبصراحه مااعمل الزيطه دي البس ملابس مريحه وبس داخل البيت وخارجه ماتفرق عندي واتحمم يوميا اخواني بيقولوا ان بطانيتي بطاميت الشتاء والصيف وبموت بالايسكريم بيجنن بالشتاء والحمدالله مابتعب الصحه حديد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114412/http://www.20at.com/article2.php?sid=165"
