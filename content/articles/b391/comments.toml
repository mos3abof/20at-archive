[[comments]]
order = 4
subject = "السلبيات"
author = "ساره"
posted = "2006-02-08"
text = "اولا ليست تلك فقط هى السلبيات التى يتمع بها مجتمعنا العريق فمن سلبياتنات ايضا التمجيد فى انتصارات ماضينا الخالد والاستهزاء بكل ماهو جدير بالتعليق عليه كما فعل احد المعلقين على الموضوع وايضا عن الاهانات التى تعرض لها سيد الخلق النبى محمد صلى الله عليه وسلم والموقف الغريب لدولتنا العزيزه وعدم اتخاذ موقف ايجابى الى الان الا فض المظاهرات والسيطره على الشعب الثائر ولكم اعزائى التفكير فى اتخاذ موقف ايجابى وليس سلبى ولكم جزيل الشكر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132607/http://www.20at.com/article2.php?sid=391"

[[comments]]
order = 5
subject = "تناقض سعودي"
author = "Dabdoob"
posted = "2006-02-09"
text = "اريد ان اذكر ايضا بما حدث عندما مات ملك السعودية الملك فهد (خـــــــــــادم الحــــــــــــرمين الشريفين) كما يحبون في السعودية ان ينافقوه (بلقب اسلامي كالعادة ) . فعند موته لم استطع ان اشاهد التليفزيون لمدة 4 ايام تقريبا وهذا ان دل علي شيء فانه يدل علي السيطرة الرهيبة والكاسحة لراس المال السعودي علي الاعلام الفضائي .<br />الاغرب في الموضوع ان السعودية تحرم الفن والفنانين وتحاربهم وتحارب الاغاني والموسيقي والكليبات بل وتناضل من اجل منعها (وهذا في حد ذاته لا اعتراض لي عليه) ولكنها في نفس الوقت تحتفظ باكبر عدد من القنوات تحت سيطرتهاوهي قنوات تقوم علي الفن والسينما والرقص والمنوعات الاجنبية بكل فئاتهاوتجاوزاتهااحيانا . الادهي ان راس المال السعودي هو المسئول والمالك الاوحد لمعظم الافلام العربية وعدد خرافي من الكليبات والالبومات الغنائية .<br />الا يعتبر هذا تناقضا كوميديا؟؟؟<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132607/http://www.20at.com/article2.php?sid=391"

