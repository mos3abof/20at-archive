subject = "الى الحيوان دبدوب"
author = "ريم بنت السعودية"
posted = "2006-07-12"
text = "حتى اسمك مقرف للغاية قبل ان ابدا سؤال وجيه من اي حديقة حيوانات انت حتى نخبر الامم المتحدة بل حقوق الحيوانات ان هنا في موقع عشرينات وبحمد الله عثرنا على[[[[[ دب ]]]]]]] منقرض ومن فصيله ناااااااادرة لانه يتكلم ويكتب على النت ياللهول واسمه دبدوب لا وش رايك عندنا حديقة حيوانات بالرياض كبيرة تجمع الحيوانات النادرة خلاص موافق ابعث لك تذكرة سفر بس وش الاكل الي تاكله اصلك متعود على اكل الفول والفلافل حتى صرت دب واحنا ماعندنا الا شي راقي ماينفع لك يووووووووووه خسارة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132607/http://www.20at.com/article2.php?sid=391"
