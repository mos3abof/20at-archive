subject = "انا معاكى"
author = "هبة"
posted = "2006-02-08"
text = "انا معاكى ي ااخت هايدى كلامك سليم بس احب ازود على كلامك ان قناة روتانا بتعمل حاجة لطيفة اوى بجد بتضحكنى وفى نفس الوقت بتبكينى اقولك ازاى تبقى المطربة قلعة هدومها وبتغنى طبعا وبتقدم لينا رسالة زى مابقولو وقرفنة تلاقى اية بقة تقطع القناه البث عشان تنقل الاذان من السعودية بذمتكو اية رايكم ها مش شىء يضحك ويبكى كمان بجد ربنا معانا"
