[[comments]]
order = 8
subject = "ماذا لو"
author = "عبد الخميس جمعة سبت وشركاؤه"
posted = "2006-05-10"
text = "ان التزام المسلمة بالحجاب هو تعبير لاالتزامها بمثل ام المؤمنين عائشة زوجة رسول الله صلوات الله عليه.لكن بالله عليكم هل سمعتم ان عائشة ذهبت الى مسابح النمساولبست المايوه وقفزت من القفاز .اذن شو بدكم في بلاد الكفار يامحجبات ماذا لو يقدم النمساويات الى السعودية ويطالبن بيوم سباحة خاص لهن .اذن الاحرى بكن ان تتركن بلاد المشركين للمشركين وبلاش عبط او اسبحن بالتي هي احسن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144607/http://www.20at.com/article2.php?sid=773"

