text = "قال الله تعالى قد بدت البغضاء من افواهم وما تخفى صدروهم اكبر<br />فنتبه يا مفتون لعدائك<br />أشهدكم انى احب الاستاذ عمرو خالد والشبخ محمد حسان والشيخ وجدى غنيم والشيخ ابو اسحاق الحوينى"
