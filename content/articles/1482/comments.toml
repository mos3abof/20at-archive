[[comments]]
order = 5
subject = "ناس فاضية"
author = "أوشو"
posted = "2006-05-09"
text = "والله ناس فاضية<br />من جعل الاخرة همه كفاه الهل ما اهمه<br />المسلمات ف يالعراق يغتصبن وفي افريقيا يمتن جوعا ...وفي الشيشان يقتلن ...وفي فلسطين محاصرات ,,,ودول في عالن تاني خالص ...يعني مثلا واحده عامله قلبان وتعترض وتمضي وتشجب وتمضي ويجنعوا امضاءلت وكل ده عشان تسبح في جمام سباحه اولادها اللي هيطلعوا يشوفوها بالله عليكم هيبئوا من جيل التمكين ...هيكون صلاح الدين هيمشوا على خطى الصحابه ....حاجه غريبه ياناس ماعندهم البانيو..او يروحو يقفوا تحت الدش ...ايه الجرب ده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144607/http://www.20at.com/article2.php?sid=773"

