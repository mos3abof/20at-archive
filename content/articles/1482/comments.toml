[[comments]]
order = 11
subject = "تعليق على التعليقات"
author = "عبدالله"
posted = "2006-05-20"
text = "انه لاتعارض بين الإسلام وممارسة النساء للسباحه واولى بنا ان نشجع المسلمات الائى يردن ممارسه الترويح المباح وفقا لضوابط الشرع كما ان احزن على ما يحدث للمسلمين ومساعدتهم لا يعنى التوقف عن ممارسة الحياه الطبيعيه<br />وايضا فان التربيه الصحيحه للأبناء تعنى تعليمهم شمولية الإسلام وليس الكبت والتزمت الذى يتعارض مع الشرع<br />وهل يعقل ان نطلب منكل مسلمه نمساوية الجنسيه ان تترك بلدها ام نعينها على حقها ..فاتقوا الله فى ردودكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144607/http://www.20at.com/article2.php?sid=773"

