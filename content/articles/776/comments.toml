posted = "2006-08-10"
text = "شكرا لك ياصديقنا المحترم طه على تزكيرك لنا بأحد عظماء هذه الامه ونرجو من الله العلي القدير ان يعيد الامه الاسلاميه الى سابق عهدهامن التقدم والرقي وان يرزقنا من هم في مثل قدر الخليفه العادل عمر بن عبد العزيز (بجد شكرا وجزاك الله عنا خيرا)"
