[[comments]]
order = 3
subject = ""
author = "أحمد"
posted = "2007-06-26"
text = "بخصوص منحه لقب \"فارس\"، فالموضوع ببساطة هو بصقة من بريطانيا في وجه كل مسلم، ولو لم تكن بريطانيا على ثقة بأن حكامنا لن يتخذوا اي موقف ضدها، لما اقدمت على هذا الفعل.<br />ولي ملاحظة: لماذا قلتم عنه \"الكاتب البريطاني المسلم\"، كيف يكون مسلما بعد كل هذا؟ كيف يكون مسلما وهو يعتبر القرآن مجرد وثيقة تاريخية؟ كيف يكون مسلما من يشتك الرسول عليى الصلاة والسلام؟<br />يا جماعة عندما تحررون الأخبار، لا تغلقوا عقولكم بحجة \"تقديم الرأي والرأي الآخر\"، فالرأي والرأي الآخر في الأمور التي تحتمل رأيين، اما في الأمور الواضحة كعين الشمس، فمن الحماقة إستخدام هذا الأسلوب.<br />وانا لا اقصد كاتب المقال، ولكني اتكلم من كــ\"فكرة\"."
archived = "2009-05-14"
capture_url = "https://web.archive.org/web/20090514053614/http://www.20at.com:80/klam-rosas/6446.html"

[[comments]]
