posted = "2007-06-26"
text = "هدا المخلوق ماتت فطرتة وضاع حيائه وصورته القبيحة ماهى الا سخط رب العالمين عليه انظروا الى وجهه المظلم كم هو قبيح ودميم انه من تلاميذ ابا الحكم واميه بن خلف وابو لهب انه ليس بفارس بل انه ابا جهل زاه الله قبحا ودمامه فلا رحمه الله ولا رقدة بارض من اراضى المسلمين لن يضر المسلمين بشيىء من اقواله المنحطة الوضيعه فهو مثل الحشرة التى لاتضر ولاتنفع"
archived = "2009-05-14"
capture_url = "https://web.archive.org/web/20090514053614/http://www.20at.com:80/klam-rosas/6446.html"

