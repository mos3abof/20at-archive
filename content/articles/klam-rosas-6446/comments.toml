posted = "2007-06-27"
text = "يا جماعة ده واحد كافر وملحد ومشرك و … و … ولكننا عرفناه فلا نخشاه<br />أما فى وسطنا فكم من سلمان … اسألوا شيخ الأزهر واسألوا زقزوق واسألوا حتى المفتى .. اسألووهم كم سلمان بيننا ولا نعرفهم .. اسألوا عن هدم المساجد فى 6 أكتوبر واسألوا عن منع المأذن فى المساجد الجديدة واسألوا عن حرمانية ختان الاناث … اسالوا الثلاثة .. وحسبنا الله ونعم الوكيل .."
