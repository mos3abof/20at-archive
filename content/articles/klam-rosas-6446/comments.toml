text = "دعنا اعمال هذا الشخص من منطلق ادبى فانت ذكرت انها ليست بالكثيره ليكرم عنها وايضا هى ليست بالقيمه ولا بالعبقريه<br />اذا التكريم ليس له علاقه هنا بالناحيه الادبيه لنعود لنقطه مواقفه المؤيد لكل الاساءات التى وجهت للدين وايضا مواقفه هو التى بدأها"
