capture_url = "https://web.archive.org/web/20090514053614/http://www.20at.com:80/klam-rosas/6446.html"

[[comments]]
order = 7
subject = ""
author = "نيفين نيفى نوفا"
posted = "2007-06-29"
text = "اكيد منتهى العبث نحس بيه لما دوله تكرم كاتب لانه يسىء لدين ما و لكن العجب يختفى اذا علمنا ان الدوله هى بريطانيا و ان الدين هو الاسلام<br />و العجب كل العجب ان روايات هذا السلمان رشدى يؤكد كل النقاد انها لا تحوى اى ابداع ادبى اللهم الا روايه اطفال منتصف الليل و ان شهره الروايات ترجع الى ما اثارته من مشاعر المسلمين<br />و زى ما اشار البعض ان مثلا واحد زى نجيب محفوظ ياخد نوبل عن ولاد حارتنا و يتمنع منها يوسف ادريس اللى كان يستحقها ..ده زى لما فاروق حسنى يستقبل فى مهرجان بالتصفيق الحاد و الاعجاب بعد ما ادلى بتصريخاته المتخلفه عن الحجاب ..كل ده عبث<br />بس يمكن عزاءنا فى قول الرسول بدا الاسلام غريبا و يعود غريبا"
archived = "2009-05-14"
capture_url = "https://web.archive.org/web/20090514053614/http://www.20at.com:80/klam-rosas/6446.html"

