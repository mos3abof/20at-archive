posted = "2007-06-26"
text = "أتفق معكم في مضمون هذا الموضوع ولكن لي تحفظ<br />صورة الموضوع على الصفحة الرئيسية بها تهكم واضح على الشخص، وهو ما لا أتفق معه، أنا أنتقد شخصا أو أتعارض معه لا يتساوى أبدا مع أن أسخر من شخصه أو أتهكم عليه، مهما كان هذا الشخص مسيئا"
archived = "2009-05-14"
capture_url = "https://web.archive.org/web/20090514053614/http://www.20at.com:80/klam-rosas/6446.html"

