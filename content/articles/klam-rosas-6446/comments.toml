text = "كما حصل نجيب محفوظ على نوبل عن رواية ولاد حارتنا وأهدر دمه ونفذت محاولة اغتيال له و ده ايضا كان بسبب تطاوله على سيد الخلق وتشخيصة بصورة العامة هو والانبياء , وجود الخلل لا ينفي الاصل بل يثبته لأنك ببساطه تدرك الخلل"
