subject = ""
author = "مسلم"
posted = "2008-07-13"
text = "الى الاخ WALEED يا استاز أنت لا تعرف ما هو الاسلام بل أنت مثل بعض الغربيين الكارهين للاسلام كل ما تقوله خطأ فالرسول لم يقتل الالاف الشخاص بل ه}لاء الشخاص أرادوا قتاله وبالنسبة للسيدة ماريا فقد كانت ملك يمينه لا جرم فى اتيانها بالنسبة لشريعة الاسلام والرسول تزوج من السيدة بنت ابى بكر وهى فى الثانية عشرة من عمرها وتلك كانت شى طبيعى عند العرب منز أكثر من 14 قرن والرسول كان قانونه فى الحرب ألا تقتلوا نساء ولااطفال ولا شيوخا ع[ *** ] ما يحدث الان فى العراق وفى فلسطين وأنا أدعوك الى ان تنظر فى فضايحة الكنيسة بشأن اغتصاب اطفال فى امريكا وأن تنظر الى تاريخ الكنيسة الاسود فى زبح المسلمين أثناء الحروب الصليبية والزى حدث فى البوسنة وكوسوفو على يد المسيحيين وأريد أن أختم بأننا نحكم على الناس من سلوكهم فلا حرج فى تكفير سلمان رشدى فانتم تكفرون يهوزا الزى خان المسيح"
archived = "2009-05-14"
capture_url = "https://web.archive.org/web/20090514053614/http://www.20at.com:80/klam-rosas/6446.html"

