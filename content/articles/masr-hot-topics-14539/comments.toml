[[comments]]
order = 7
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-12-28"
text = "اقتباس أنا أبوك يا مسلم و:<br />اقتباس المصري:<br />ايه ياابن زكي جرجس … بلاش غلط وخليكوا في حالكوا …وكفايه عليكوا البابا شنوده اللي متبت عالكرسي من ايام السلدات<br />أطال اللة فى عمر \"مرشدكم\" الخرف؟<br />و أكثر اللة من \"الاغبياء\" امثالك؟!!!<br />هىء هىء هىء هىء هىء<br />لو لم أكن \"شيطانا\"؟ لوددت أن أكون (مرشدا للاخوان)؟!!!<br />و أعوز باللة من الشيطان الرجيم<br />و أطيعوا اللة و أطيعوا الرسول و أولى الامر منكم؟<br />اى أطيعوا لحكم(السلطة و الشرعية و النظام)؟"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107115420/http://www.20at.com:80/masr/profile/14539-2009-12-23-12-50-27.html"

[[comments]]
