text = "بصراحه احنا لا عايزين اخوان ولا وهابية<br />احنا هنا بلد الازهر<br />1000 عام ازهر<br />الشيخ الشعراوي الشيخ احمد عمر هاشم<br />شيوخ ميه ميه<br />من غير معتقلات وامن دولة ومن غير سخافة الوهابية ورزالتهم<br />عايزين نرجع ازهر وبس لا وهابية ولا اخوان<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـ<br />مش شريف الدواخلي ولا البراء اشرف"
