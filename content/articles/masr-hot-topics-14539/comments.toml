author = "بطاقتة الشخصية"
posted = "2009-12-23"
text = "كفاية تقرأ بطاقتة الشخصية<br />من اعظم العقول والشخصيات فى مصر وفى العالم كلة<br />انا لم اسمع عنة من قبل<br />ولكن عندما قرات بيانات بطاقتة الشخصية انبهرت<br />وافتخر اننا فى مصر عندنا شخصيات بهذا الثقل والحجم<br />كونة فى الاخوان فهذا موضوع تانى"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227041013/http://www.20at.com:80/masr/hot-topics/14539-2009-12-23-12-50-27.html"

[[comments]]
order = 4
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-12-25"
text = "[quote name=\"المصري\"]ايه ياابن زكي جرجس … بلاش غلط وخليكوا في حالكوا …وكفايه عليكوا البابا شنوده اللي متبت عالكرسي من ايام السلدات<br />هاهاهاهاهاهاها<br />خوفتنى يا\"مصرى\"؟<br />أشتات أشتوت من هذا المصرى (الكتكوت)؟!!!<br />ومبروك\"المرشد\" ابوطاقية و جابية و سكينة!!!؟<br />مرشد \"االعصابة الارهابية\" و \"الجماعة المحظورة\" اللى أسمها (الاخوان المسلمين)؟<br />سلمولى على مصر و \"المصرى\" أفندى"
