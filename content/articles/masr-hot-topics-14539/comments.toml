posted = "2009-12-26"
text = "اقتباس ممدوح زكى زخارى جرجس:<br />طبعا أعرفة<br />لدية ملف ب\"امن الدولة\"المصرى؟<br />صاحب ملف أسود زى أيامة السوداء؟<br />أنت آخر واحد يتكلم عن الإخوان … وإحترم نفسك يا إبن زكي يا إبن زخاري يا إبن جرجس يا إبن الـــــــــــــ ـــــــــــــ ؟؟؟"
