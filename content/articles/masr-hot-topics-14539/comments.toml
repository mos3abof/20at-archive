[[comments]]
order = 18
subject = ""
author = "اهم حاجه السجن"
posted = "2010-01-18"
text = "وكانت القضية العسكرية الأولى سنة 1965 مع الأستاذ سيد قطب والإخوان، وحُكم عليه بخمسة عشر عامًا، قَضى منها 9 سنوات، وخرج في 1974، وعاد لعمله بجامعة أسيوط، ثم نُقل إلى جامعة الزقازيق، وسافر بعدها لليمن، وعاد بعدها إلى جامعة بني سويف.<br />والقضية الثانية السجن لمدة 75 يومًا في قضية جمعية الدعوة الإسلامية ببني سويف عام 1998، حيث كان يشغل منصب رئيس مجلس إدارة جمعية الدعوة ببني سويف بعد اعتقال الحاج حسن جودة.<br />أما القضية الثالثة فكانت قضية النقابيين سنة 1999م، حيث حكمت عليه المحكمة العسكرية بالسجن خمس سنوات، قضى منها ثلاث سنوات وثلاثة أرباع السنة وخرج بأول حكم بثلاثة أرباع المدة سنة 2003."
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127082713/http://www.20at.com:80/masr/hot-topics/14539-2009-12-23-12-50-27.html"
