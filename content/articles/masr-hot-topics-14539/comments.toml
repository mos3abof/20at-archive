posted = "2009-12-28"
text = "اقتباس أنا أبوك يا مسلم و:<br />اقتباس مسلم وأفتخر:<br />اقتباس ممدوح زكى زخارى جرجس:<br />طبعا أعرفة<br />لدية ملف ب\"امن الدولة\"المصرى؟<br />صاحب ملف أسود زى أيامة السوداء؟<br />أنت آخر واحد يتكلم عن الإخوان … وإحترم نفسك يا إبن زكي يا إبن زخاري يا إبن جرجس يا إبن الـــــــــــــ ـــــــــــــ ؟؟؟<br />أختشى يا قليل الادب؟<br />انت موش عارفنى انى انا \"أبوك\"؟!!!<br />طيب روح أسال \"أمك\" و هى هتقولك مين هو \"أبوك\"الحقيقى!!!<br />أخوان أية و كلام فارغ أية؟<br />روح أرضع من \"بز\" أمك و أنت تنبسط و تفرح و تتمزج؟<br />وبوسى ماما يا ننوس عين \"ماما\"؟<br />و (من الذى لا يحي أمك)؟!!!<br />و خاصة أنا \"ابوك\" الغير شرعى يأبن\"المحترفة بغاء<br />بوسهالى بوسا مستبوسا شديدا؟!!!"
