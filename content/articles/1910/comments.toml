subject = "موقع ضعيف أمنيا!!"
author = "واحد مبرمج!"
posted = "2006-01-07"
text = "لو كان الموقع الأردني للإعلام بيسمح برؤية كلمة السر فده معناه إنه موقع ضعيف أمنيا ، لسبب بسيط إن المفروض الكلمة بتتشفر قبل ما تتحفظ في قاعدة البيانات ، و اللي يسبها زي ما هي يبقى بيسهل على أي هاكر خطوة في اختراق الموقع..<br />و أنا مش شايف إن الشخص ده عمل أزمة يعني ، و مش عارف لازمتها ايه محاكمته؟!!<br />كل اللي عمله إنه داخل يهرج ( من وجهة نظري ) ، و مش شايف أي حاجة توحي بالجدية في كلامه ، \"واحد عايش اللحظة يعني\"!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154738/http://www.20at.com/article2.php?sid=222"
