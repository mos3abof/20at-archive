subject = "رأي شخصي"
author = "يزن"
posted = "2006-10-18"
text = "مع التحية والتقدير لكاتب المقال<br />مع التحية والتقدير لأصحاب الردود<br />- أعتقد أن لكل منا رأي ويجب علينا جميعاً أن نحترم الأراء الشخصية ،،، كما يجب يجب علينا أن نتعلم لغة الحوار ونترك جانباً لغة التهجم والتهمك تلك التي أعتدنا أن نراها دائماً .<br />- يجب أن نحترم الرأي الأخر ولو أردنا المجادلة فعلينا أن نجادل بالتي هي أحسن وأفضل .<br />والذكي يفهم<br />احتراماتي ...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131515/http://www.20at.com/article2.php?sid=1222"

