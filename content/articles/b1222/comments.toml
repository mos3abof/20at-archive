text = "متهيالى لما الست تقعد فى البيت تربى ولادها زى زمان هتكون الاخلاقيات احسن من كده ومتهيالى الست بتنزل الشغل عشان تتبهدل وتشترى شوية جزم وشنط وتدي الباقى للشغاله ويمكن توفر للشاب الغلبان الى مش لاقى شغل فرصه عمل بدل ماتقعد تشتغل تريكو وتقرف الخلق"
