[[comments]]
order = 0
subject = "واحد"
author = "أنت رأيك أن المرأة مكانها ليس البيت"
posted = "2006-09-14"
text = "ده صحيح في رأيك علشان كدة أنا منتظر مرات سيادتك علشان نتفرج عليهاكل يوم الصبح و هي رايحها الشغل و جاية من الشغل<br />آسف لأن اسلوبي و حش لكن للأسف دي الطريقة اللي ممكن ننبه بيها أمثالك لكارثة عمل المرأة<br />و المشكلة أن بعض الناس فاكريين لما تقعدج المرأة في البيت هتبقي مش بتشتغل<br />بالعكس بتشتغل و يمكن أكثر من الراجل برضة<br />عارف لية لأنها هتربي الولاد و تعلمهم فمش هيحتاجوا درس خصوصي و ممكن تخيطلهم هدومهم و فنظف البيت و تعمل حياتك جنة فمش هتبقي عايز تهرب مع الاصحاب علب القهوة<br />ربنا يهديكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131515/http://www.20at.com/article2.php?sid=1222"

