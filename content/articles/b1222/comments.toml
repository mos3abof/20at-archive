[[comments]]
order = 2
subject = "كاتب المقال ماله قرفان من العرب"
author = "عربى"
posted = "2006-09-15"
text = "كاتب المقال ماله قرفان من العرب<br />فية اية يا عم مالك ما تدوس فرامل يا برنس و لا terbo power زغلل عنيك<br />بخصوص المرأة<br />بلاش حكاية النص والتلت و الربع بتاعة المجتمع ..... فيبقى من حق اى راجل انة يشتغل فى المحلات مش تبقى كلها حريم او 95% زى ما انتا بتقول<br />و هما بيقولوا الراجلو الست زى بعض الاتنين بنى ادمين .... خلاص يبقى مفيش فرق فى الشغل يبقى لية الراجل شغلة فى المصنع و مش فى المحل و لية يكون عدد الرجاله فى المصنع اكتر من الستات<br />اصل حكاية المراة دى عملالنا حساسية شوية<br />افتح اى جرنال و اتفرج على اعلانات الشغل ..... لية سكرتيرة مش سكرتير... موظفه اسقبال ..... الخ<br />خلاص انا مع حق المرآة فى كل شىء<br />و علشان كدة انا عايزها<br />تشتغل نجار و سباك و نقاش و خياط و بتاعه عجل كمان .....<br />و عايزها تتجند و تدخل الجيش و تفرز كمان مرتين فى السنة .... بس مش تدخل الجيش تطبخ و تعد على المكاتب<br />و عايزهم يشتغلوا بتوع دش و dsl و فى محطات البنزين<br />و بدام احنا زى بعض مفيش حاجة اسمها الشقة على العريس و لو ايجار يبقى بالنص و الفرش عليا و عليها<br />خلاص و لما ده يحصل هتقولوا يلعن ابو المساواة دى احنا كنا مدلعيين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131515/http://www.20at.com/article2.php?sid=1222"

[[comments]]
order = 3
subject = "بص يا كاتب المقال"
author = "احمد"
posted = "2006-09-16"
text = "العرب هم احسن شعوب الارض<br />دي نقطة<br />النقطة التانية اللي عايزك تركز فيها<br />المرأة مكانها البيت شئتم ام أبيتم<br />النقطة التالتة<br />الصيني اللي انت فرحان بيه ده اما يخلص كل الحوارات بتاعته في المصانع والاختراعات ومش عارف ايه<br />بيرجع بيته وزي الحمار يقوم يسجد لبوذا ولا مش عارف كونفوشيوس<br />عشان كده هم اغبى شعوب الارض<br />دول اغبى من اليهود<br />يا ريت ترد عليا عشان اناقشك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131515/http://www.20at.com/article2.php?sid=1222"

[[comments]]
order = 4
subject = "سجل أنا عربي"
author = "أحمد بلال"
posted = "2006-09-16"
text = "أولا شكر لكل من علق على موضوعي<br />يمكن دي اول مرة ارد على تعليقات بس عشان انت طلبت الرد لازم ارد<br />أولا أنا معتز جدا بعروبتي و قد يكون ايماني بعروبتي يفوق خيالك<br />ثانيا مش معنى اني مؤمن بعروبتي و بحبها اني اتعالى على العالم و اقول ان العرب هم أحسن شعوب الارض زي ما انت بتقول مع اني شايف ان العرب شعب واحد مش شعوب<br />بس لو زي ما انت بتقول يبقى احنا ما فرقناش عن اليهود اللي قالوا انهم شعب الله المختار و لا هتلر اللي قال المانيا فوق الجميع<br />انا لما كتبت مكتبتش قصيدة شعر في واحدة بحبها انا كتبت عن حقائق شفتها بعينيا فلو كانت الحقائق دي كويسة يبقى يارب نوصل للمرحلة دي<br />بالنسبة للمرأة فخروجها للعمل أساسا لا يتعارض مع الاسلام و انما يتعارض مع طبيعتنا كمجتمع ذكوري و ده عيب فينا احنا لا هو في الاسلام و لا هو في الصينيين<br />بالنسبة للصيني اللي انت شبهته بالحمار مش هناقشك في المسألة لأن اسلوبك في النقطة دي بالذات كان هابط قوي<br />ياريت ننتقد من غير شتائم<br />الصين يا استاذي فيها 50 مليون مسلم فيها جوامع و كنايس<br />أنا شفت واحد فلسطيني بيصلي في السوق في الشارع كل الناس وسعت له الطريق و محدش حتى بص له بصه غريبة<br />و عامة شكرا على تعليقك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131515/http://www.20at.com/article2.php?sid=1222"

[[comments]]
order = 5
subject = "نحتاج ان نكتشف الاخر"
author = "sandy"
posted = "2006-09-16"
text = "اشكرك قوى على الموضوع الرائع دة قد ايه احنا محتاجين اننا نتجة للاخر نتعلم منة نكتشفة نكتشف عيوبة ومميزاتة مش شرط ابدا اننا نتقولب فية المهم اننا نكتسب الاشياء الصحيحة اللى بتميزة عن غيرة نتعلم منها من تجربتة ونحترم انة قدر يوصل بنفسة من غير...نصائح او مساعدات دولية ووصايا الاخر لاننا نقدر نكون الافضل لو سلكنا طريق العلم والعقل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131515/http://www.20at.com/article2.php?sid=1222"

[[comments]]
order = 6
subject = "الباشا المثأف كاتب المقال"
author = "و انتا ماتعرفش ان ال 50 مليون مسلم اللى فى الصين دول متعرضين لاضهاد الحكومة المركزية فى الصين"
posted = "2006-09-16"
text = "و بيكافحوا من أجل نيل الاستقلال و الحزب الشيوعى متمسك بنظرية صين واحدة<br />و انهم فى فترة من الفترات كان ليهم دولة مستقلة حتى قيام الدولة الشيوعية و اعلنوا الضم القصرى لهذا الاقليم المسلم فى شمال غرب الصين ذو الاغلبية المسلمة المطلقة<br />و مستنى ردك على الكلام ده كمان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131515/http://www.20at.com/article2.php?sid=1222"

[[comments]]
order = 7
subject = "واحد"
author = "مجتمع ذكوريس دي قديمة قوي يا بلال بلاش الكلام المحفوظ ده"
posted = "2006-09-17"
text = "بالمناسبة لو أنت فعلا بتقول أن عمل المرأة لا يتعارض مع الاسلام طيب السلسة اللي أنت لابسها في رقبتك بتتعارض معاه و لا لأ<br />و متقولش دي رية بقي و بتاع من ده<br />طالما هتتكلم عن الاسلام خليك شكل الاسلام الأول<br />و بالنسبة للأخت اللي ردت عليان أنا الحمد لله لا ببص علي ستتات محترمة و لا غير محترمة<br />بس هي علي فكرة فيين الستتات المحترمة دي<br />(ربنا يبارك في القليلات المحترمات)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131515/http://www.20at.com/article2.php?sid=1222"

[[comments]]
order = 8
subject = "الاسلام فى كل حاجة"
author = "كوثر الادهم"
posted = "2006-09-21"
text = "السلام عليكم الاول<br />يا جماعة احنا مسلمين صح ؟ لازم اسلوب الكلام يكون ارقى من كدة شوية فى الاسلوب وطريقة الكتابة .<br />الحاجة التانية : الصين ولا غيرها ليه مش ناخد الكويس من النا ومش ندخل الموضيع فى بعضها يعنى بيعملوا المسلمين ازى دى مش حورنا الان احنا بنتكلم عن احترامهم للعمل اللى المفروض احنا اولى الناس به ويتعلمة الناس منا<br />خروج المراه للعمل كذلك له اصولة وشرعيته اللى المفروض تطبق علشان الموضوع يكون مقبول شكلا وموضوعا والاستاذ اللى بيقول ان المراه مكانها البيت وزوجتك لما تمرض هتوديها لدكتور ؟؟؟؟ فى شغل يناسب المراه وشغل لا ؟<br />السيدة رفيدة بنت كعب اول ممرضة فى الاسلام كان االرسول ( ص) ياخذها معه فى كل الغزوات وكان لها كتيبه خاصة بها للتمريض السيدة صفية دافعت عن المدينة فى غزوة الخندق تقريبا بقتلها لليهودى و تهرب حسان بن ثابت ( لانه ليس له فى القتال) .<br />يجب الفصل والتركيز فى المواضيع وعدم الخروج عن الموضوع ولا اداب الكلام اللى احنا اولى بها كمسلمين من اى حد تانى<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131515/http://www.20at.com/article2.php?sid=1222"

[[comments]]
order = 9
subject = "لما تحكو احكو عم معرفة"
author = "ريما"
posted = "2006-09-24"
text = "التعليقات بجد مستواها متدني و تاركين لب الموضوع ماسكين بعمل المراة هاد كل الي همكم من الموضوع؟<br />و للاخ الي بيحكي ان المسلمين مطهدين انا والدي بيشتغل مع الصينيين من اكتر من 30 سنة و مرت عليه اكتر من شركة صينية تعامل معها و ما كانت تمر سنة بدون ما يكون الهم عزومة عنا بالبيت و في مرة عزمنا صيني مسلم كان جاي بزيارة للاردن لاغراض دينية و سالنا عن الاسلام هناك و اكدلنا انهم الهم استثناءات كبيرة من الحكومة و ابرزها انهم ما عندهم تحديد نسل زي باقي الصينيين لان الاسلام بيمنع تحديد النسل بس ما من منطلق حرصهم على الكيان الصيني ما بحاولو ينجبو كتير لتفهمهم لمشكلة السكان بالصين<br />و الهم حرية العبادة و ما حكالنا انو زي ما تفضلت حضرتك ان بدهم يستقلو و بعدين لو هالحكي صحيح اكيد من حق الحكومة الصينية تعترض مين بحب يقسم بلادو؟<br />تانيا الشعب الصيني جدا بسيط و ما عندهم مقامات و لا تكلفة لما كانو يشرفونا بزيارة كنت تلاقي نائب السفير قاعد جنب الطباخ بيحكو زي الاخوة ما عندهم عقد<br />فمعلش الي بيعلق يا يكون عندو معرفة يا يختصر و يضل ساكت بلا مهاترات ما الها معنى<br />و عيب لما الواحد فيكم يحكي بتفرج على مرتو و هي رايحة الشغل طب وحدة ما بتشتغل و رايحة على بيت اهلها زيارة مش برضه رح تمشي بالشارع و برضه اذا انت تفكيرك متدنى حتطلع عليها؟ الاولى نحترم كل ست بالشارع و نعاملها زي ما بنحب تتعامل خواتنا هيك ما بضل مشكلة اشتغلت و لا قعدت ببيتها و الله يهدي الجميع و رمضان كريم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131515/http://www.20at.com/article2.php?sid=1222"

