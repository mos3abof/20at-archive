[[comments]]
order = 1
subject = "مجلس موافقون"
author = "زمان قوى طلعت نكتة اظن فى الستينات ايام كان الرئيس السادات رحمة اللة رئيسا للمجلس -كان كل عضو جديد يقسم قسم الولاء واظن ان احد الخبثاء قد حرف هذا القسم"
posted = "2006-12-20"
text = "القسم المحرف هو<br />اقسم باللة العظيم وبكتابة الكريم ان اكون يازعيمنا كما عودتنا رجلا طرطورا وان اجعل من مصر ارضا بورا وان احارب خزعبلات غزو القمر والمريخ وان اوقف صناعة الصواريخ وان لا يكون لى فى الطور ولا فى الطحين حتى احافظ على الخمسة والسبعين<br />وطبعا كان مرتب عضو المجلس 75 جنية فى ذلك الزمان الجميل<br />دلوقتى كام اللة اعلم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102041/http://masr.20at.com:80/article.php?sid=1322"

[[comments]]
order = 2
subject = "لماذا يتصيدون الأخطاء"
author = "ABOSHEHAB"
posted = "2006-12-20"
text = "لماذا لا ننظر إلى ما تا تفعله الحكومة بالشعب (الفقر،البطالة...) وإلى ما تمارسه هذه الحكومة في حق هذه الجماعة من (اعتقالات،شطب انتخابات،فصل من الجامعة ...)، وفي الآخر نريد منهم أن يكمموا أفواههم ، أطالب بالعدالة بين جميع فئات الشعب ثم المحاسبة."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102041/http://masr.20at.com:80/article.php?sid=1322"

[[comments]]
order = 3
subject = "اه يا بلدي"
author = "نورالدين محمود"
posted = "2006-12-21"
text = "اخدتم بال حضراتكم من الحتة دي\"وقيام هؤلاء الطلاب باختراق مجتمع الطالبات ومحاولة الاحتكاك بالامن وتحريك الطالبات عن طريق المحمول. \"<br />ابقوا سلمولي والنبي علي الشيخ احمد الطيب...والشيخ مفيد شهاب ربنا يكرمه علي قد نيته"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102041/http://masr.20at.com:80/article.php?sid=1322"

[[comments]]
order = 4
subject = "بقي مش مكسوفين من نفسكم"
author = "الاستاذ"
posted = "2006-12-21"
text = "يانواب الحزن الواطي مش هييجي اليوم اللي تهتموافيه بقضايا الوطن الحقيقية بدل ما تقراوا ورق يتوزع عليكم قبل الجلسة من امن الدولةتتهمون فيه ميليشيا الطلبة وانتم لاتعرفون معني كلمة (ميليشيا)ولا يعني ايه كلمة (طلبة)!!!!"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102041/http://masr.20at.com:80/article.php?sid=1322"

