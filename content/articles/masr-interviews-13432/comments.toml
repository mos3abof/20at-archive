[[comments]]
order = 2
subject = ""
author = "عبدالفتاح النادى"
posted = "2009-10-06"
text = "بسم الله الرحمن الرحيم<br />تعد الاعلاميه لميس الحديدى من أقوى مذيعين اليوم نظرالبرامجها الممتازة وحوارتها الجريئه وكشفها للحقيقة مهما كان الضيف الذى تحواره وساعدت كثيرا فى فى ان تكشف الفساد الذى يحيط بنا هذا الزمن …ولا شك فيه ان كل انسان علم طريق النجاح وصار على دربه لأحاطه المشاكل والأشعات ولزياده النجاح هذا…لصرت فى طريقى كما انا واحارها بكل قوة..ولو نظرنا للاعلاميه لميس الحديدى لوجدناها ناجحة مستبسله جريئه فى الحق التى هى من اهله…ربنا معاكى يأستاذه ويخليليك ابنك الجميل نور الدين وزوجك المثالى الاستاذ عمرو وثبتك على النجاح والتقدم وسلامى للاعلاميه هاله الحديدى ورحمة الله على الاستاذ عبدالحميد الحديدى…<br />ملحوظة****<br />تربطنى صله قرابه عن بعيد بالاعلاميه الناجحه لميس وهاله الحديدى"
archived = "2009-11-22"
capture_url = "https://web.archive.org/web/20091122170919/http://www.20at.com:80/masr/interviews/13432-2009-09-13-10-35-19.html"

[[comments]]
order = 3
subject = ""
author = "نانسي"
posted = "2009-11-17"
text = "الأستاذة لميس أشكرِك على إجتهاداتك فى عمل برامج كمذيعة ، وإن كان لى رأى لكِ أنكِ يجب أن تنتقى الأشخاص الذين تحاورينهم لأن كل انسان له طاقة محددة وقدرة على الإستيعاب، لأن الذى يريد الصعود إلى مستوى أعلى منه بكثير(فى التخاطب الفكرى ) قد يصعد ولكنه أخيراً لابد و أن يسقط ، فحوارك مع شخص فى قمة الذكاء والحنكة والحكمة مثل قداسة البابا شنوده الثالث قد كشف عن شخصيتك كإعلامية تريد إشهار نفسها فتصنع لقاءاً مع المشاهير ،هنا وأريد أن أسأل اين فن البروتوكول فى الكلام وأين آداب الحديث فى الكثير من المواقف فمثلا عندما تقولين لقداسته عبارة (أنت)و (بماذا ترد) وليس (تردون) لأن من اللائق التحدث بصيغة الجمع ، وماذا أيضا عن مقاطعتِك للكلام بسؤال وقد تبدو الإجابة لك من الطرف الآخر أنها مفحمة ،ثم لماذا تتكلمين بلسان الدولة فى أنك تريدين حل مشاكل الكنيسة ولا يعجبك ترك المشاكل لله هو الذى يحلها ،ناهيك عن الفهم البطيء الذى لاحظه أغلب المشاهدين ،وماذا أقول أيضاً لأن لى كثير لأكتب …ولكن على أية الحالات أتمنى أن يكون نقدى هذا نقداً بناءاً لكِ ولزوجِك أيضاً شكراً"
archived = "2009-11-22"
capture_url = "https://web.archive.org/web/20091122170919/http://www.20at.com:80/masr/interviews/13432-2009-09-13-10-35-19.html"

