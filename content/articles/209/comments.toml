subject = "مصـ( الخير )أعب"
text = "يا سلام عليك يا معلم \"بيرو\"<br />و تضامنًا مع الحملة الإعلانية الخاصة<br />بجبنة \" فيتا جرينلاند \"<br />اللي بيقودها المعلم بيرو<br />( طبعا كلنا عارفين الإعلان إياه<br />اللي البنت بتنسى فيه كل حاجة<br />ما عدا اسم الجبنة ... طبعاً)<br />أنا بعلن<br />إن فكرة المقال ده \"جديدة \"<br />و إنه بيمثل الصحافة \"البيضا\"<br />و أنه خال من \"الدسم\"<br />يعني مقال خفيف و\"لذيذ\"<br />و من مميزات الموضوع<br />أنه لا يحمل أي انتماءات<br />لأي حزب \"رومي\" أو حتى \"اسطنبولي\"<br />بيني وبينكو<br />أهم حاجة في الموضوع<br />انه نبه على حاجة<br />مهمة جدا في الc.v<br />اللي هيا إن احنا<br />لازم \"نستو\"في البيانات بدقة ...!!!<br />ترقبوا البيان التأسيسي للحلف الالكتروني الفظيع!!!"
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903084137/http://www.20at.com:80/article.php?sid=511"

