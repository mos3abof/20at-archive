subject = "الشغل عندنا بالوسايط"
text = "الحمد لله الشغل عندنا بالوسايط والسي في والشهادات بس مجرد منظر لا غير<br />وبالمناسبة تم تعيين موظف وبعد ذلك تم عمل إعلان واستقبال السي في وكان ناقص يعملوا مقابلات كمان مع المتقدمين والموظف كان قد تم تعيينه<br />وبسؤال رئيس القسم عن ذلك قال \"مجرد إجراءات\" روتين يعنى لا أكثر<br />ولكن على كل الحال المحاولة والسعى مطلوب وشكرا لكاتب الموضوع"
