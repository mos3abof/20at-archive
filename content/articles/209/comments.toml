text = "فعلا علي رأي الاخ انا مثلا عمارة نزلوني تنفيذ و مفيش حد يعلمني بقعد تحت شجرة توت مانجة او كافور حسب المتاح في كل موقع انزلة و اعمل الحصر و لما بفوق اقوم اخرب للمقاول كل الي عامله عشان كل المقاولين حرامية .... محدش بص في السي في بتاعتي برغم من انها شركة كبيرة موت فيها 6000 موظف لكن انا الوحيدة الي بصيت في السي في بتاعتي و يوم ما كنت هتنقل مكتب فني مديري قل له لو سمحت عايزة job description قال صغيرة في السن متنفعش و الموظفين اصلا سمعوها الشاي اندلق و هاتي يا ضحك زي ما اكون قلت نكته جديدة"
