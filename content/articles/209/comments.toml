[[comments]]
order = 9
subject = "cv وائل عباس"
text = "الاسم: وائل عباس<br />المؤهل الجامعي : ماجستير لغات حية<br />الخبرات : جرافيكس - شبكات - ويب ديزاين<br />الهواية :صحفي الكتروني<br />الانتماء السياسي : تبع رفعت السعيد<br />المثل الأعلى : اعتماد خورشيد<br />المهنة الحالية : عاطل<br />افضل وصف : ما كتبه أحد الأعداء فالفضل ما شهدت به الأعداء حيث يقول عني:<br />السفيه يبول فى زمزم<br />بقلم : على عبدالعال<br />يحكى أن أحد الأعراب المغمورين وجدوه يتبول فى بئر زمزم، فتعجب الناس من فعلته، وقالوا مه ما حملك على ذلك ؟ فقال والله ليس تحقيراً من شأنها ولا تقليلاً من قدرها.. ولكنى أردت أن يذكرنى الناس ويقولون أنى تبولت فى ماء زمزم وكفى بها .<br />وبطل قصتنا هذه المرة شاب عاطل ليس له شاغل إلا كيل السباب والشتائم فى حق علماء الإسلام (الشيخ عبدالعزيز بن باز رحمه الله ، والشيخ يوسف القرضاوى ، والدكتور زغلول النجار ، والأستاذ عمرو خالد ، والأستاذ مجدى حسين ، إلى جانب ماناله حزب العمل ومكتب إرشاد الإخوان المسلمين من سفه) أمن من سفهه الصهاينة والأمريكان ولم يأمن علماء الإسلام ودعاته .. وهذا السفيه كحال صاحبه ليس له دافع إلا اجتلاب الشهرة حيث كانت .<br />وهذا هو تعليقى على ما نشره المدعو (وائل عباس) فى صحيفة (عرب تايمز) تعليقاً على رسائل الردود التى وصلته تنهاه عن الخوض فى أعراض العلماء .<br />والله ما كنت أحب أن أقر عين المذكور فى حملة دعائية يقودها أملاً فى الشهرة .. إلا أن الإنسان يضطر أحياناً إلى ما لا منه بد .. خاصة وأننى أعلم جيداً أن الرد يأتى كخطوة فى طريق شهرته .<br />المدعو جاء فيما نشره بكثير من الشتائم والبذاءات على الردود التى وجهت إليه بعد رسالة الشتائم التى كالها للشيخ الدكتور زغلول النجار، ونحى فيها على الشيخ عبدالعزيز بن باز طيب الله ثراه وغيره من علماء الأمة الكرماء .. والمدعو يحسن توليف السيئات فى هيئة ألفاظ ثم يلقى بها من شاء متى شاء دون رادع<br />فأقول أننى لن أخوض فيما يريد الخوض فيه وانزه نفسى عن أوحاله .<br />ولكن .. حينما رددت على كيل الشتائم فى حق علماء توقرهم قلوب الأمة لم يكن ردى إلا لأنبه هذا الشخص إلى ما فى نفسه من سفه، وأردت أن يفرق بين السباب والشتائم ومقارعة الحجة بالحجة ... فرق شاسع بين ألفاظ الهمج فى الشوارع وبين الكتابة للصحف، ووالله ما أدرى أألومه أم ألوم من أجاز لنفسه أن ينشر هذا السفه .<br />فأنا لم أنكر ما قد يطرحه أى إنسان من فكرة أو مسألة علمية تحتمل الخطأ والصواب، وإنما أنكرت تقديم الفكرة بين أطباق الشتائم والتجريحات والإتهامات وجمع ما يتيسر من أبشع الألفاظ ثم يُلقى بها فى وجه عالم لا نعلم عنه إلا كل خير ولم يتهمه أحد فى نزاهته ودينه حتى يأتى شاب عاطل فى سن أحفاده ثم يرميه بكل هذه الشتائم دون سند من علم أو خبرة أو دراية .. وهذه إحدى سوءات البطالة فى مصرنا الحبيبة .<br />وقلت أن من يبغى الشهرة، ليقال عنه أنه يحسن الكتابة، وانه يستطيع أن يخطأ هذا وذاك، وأن كتاباته تجد من يهتم بها ويرد عليها، فليبتغى الشهرة فى مظانها، وكفى ما نال الأمة من ركوب شهرة التهجم على الإسلام وعلماءه .. لكن وللأسف عشاق ركوب الأمواج كثير ولم يكن المدعو أولهم ولن يكون آخرهم .<br />كتب يصف الردود التى جاءته بأنها : (إنتقاد ودفاع عاطفي عن المدلس زغلول النجار) وتسآل (لا اعرف بالضبط اي امة هذه التي توقر زغلول النجار كما تدعي يا علي ؟؟؟ امة الجهل والندامة التي تنتمي انت اليها ؟؟؟) ... ثم قال : (واتحداه ان يرفع دعوى قضائية ضدي بالسب والقذف) .. وأقول له أنت أقل من ذلك بكثير، والدكتور زغلول النجار أعقل من أن يتسبب فى شهرة أخرق .<br />وبعد أن انتهى من سيل القذارة الذى وجهه لى فى الرد يسألنى (عرفت بقى أنا ممكن أكون وقح وسافل وبذيء إلى أي درجة ؟؟؟) .. فمن ناحيتى أنا ما ألمحه من وقاحة فى طيات نفسك أشد من ذلك بكثير .. وكنت أود لو تعلم أن الفرق شاسع بين عرض الأفكار واستعراض الحجج.. وبين أساليب (العوالم) فى الردح والشردحة .<br />ورأيت أن آتى للقارىء ببعض الألفاظ التى أوردها وائل عباس فى رده<br />يقول فى تناوله للدكتور زغلول النجار : (الرجل قال ان الله قد شق القمر ثم لم يقدر على ارجاعه الى صورته الاولى او انه تركه مشروخا لكي يصعد الامريكان ويكتشفون هذا ويقولون سبحان الله ونخرج لهم نحن السنتنا ونقول لهم مش قلنالكم انه مشروخ)<br />... (نرجع تاني لسيرة الزغلول والتي مهما حوت من مناصب كلها سابقة ومنتهية فلن تنافس سيرة هندريك شون اللي حلقوله مثلا ومافيش كبير على العلم) ... ثم يقول : (ولك عندي زيارة الى سوق الجمعة لنشتري سويا الزغاليل الملونة عندما تشرفنا بالزيارة ... لكن للاسف الزغاليل الملونة المزورة المزيفة لا تعمر طويلا لانها تتسمم من الوان ريشها ... والحدق يفهم )<br />ثم يعرج وائل عباس على الشيخ الدكتور يوسف القرضاوى ويقول<br />: (ليست المرة الاولى للقرضاوي ان يقول كلاما في ا<br />Read the rest of this comment..."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018083007/http://www.20at.com:80/article.php?sid=511"

