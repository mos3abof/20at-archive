[[comments]]
order = 0
subject = "احسنت"
author = "بنت حميدو"
posted = "2006-10-12"
text = "السلام علي من اتبع الهدى<br />ما اروع و اجمل و اصدق مما كتبت يا استاذ ايهاب علي, و الله صدقت فى كل كلمة , فعلا لقد اختفر رمضان الجميل البسيط الروحاني الاسلامى المهدئ للنفس و المرتقي بها, رمضان الذي كان اذا جاء ولت الهموم و الاحزان و حل الهدوء النفسي و الصفاء, لا ادري اذا كانت مقصودة ام لا و لكنهم اصطنعوا لنا رمضان غريب , مظاهر لم اعتاد اليها ابدا, كل المظاهر التي سبق و تفضلت حضرتك بذكرها, و يكفى الخيام الرمضانية كما يتلقون عليها, و رمضان برئ منها و مما يحدث فيها الي يوم الدين, لا ادري ما علاقتها برمضان, و لا ادري لماذا يقترن اسمعا باسم رمضان و خاصة انها لا تقدم اي شيء يخص رمضان اللهم الا كل مبتذل و رخيص و مسف و هابط و منحل, و لم يكتفوا بذلك و لكن لمن لم يستطيع الذهاب الي الخيام, فقد صوروها و نقلوها مباشرة علي الهواء للناس, يعنى محاولة للتغييب و لفت الانتباه عن رمضان بكل قوة و تفنن, يا سيدي يكفيي ان تشاهد حلقة واحدة من البرنامج الذي يذاع علي قناة دريم2 (وهى القناة التي تذيع ايضا اجمل و اقوى البرامج الدينية !! ), هذا البرنامج الذي ينقل الاحداث مباشرة من الخيمة الغير رمضانية, ما هذا الاسفاف و عدم احترام الشهر الجليل, الا يتذكرون ان رمضان بعد ان ينتهي سيصعد الي المولي عز و جل و يحكي كيف استقبله كل فرض من امة محمد (صلي الله عليه و سلم),الم يتخيلوا ماذا سيحكي عنهم رمضان, الا يشعرون بالحرج و الاشمئزاز و القرف من استضافة شخصية مثل شخصية سعد الصغير, والله والله والله و بدون اية مبالغة, لقد كنت علي وشك الاتيان بكل ما فى معدتى حين شاهدت هذا المسخ, الذي لا هو محسوب علي الرجال و لا علي النساء و لا علي الجنس الثالث حتي, من الذي سمح له يالظهور و القيام بمثل هذه الحركات التي لا اجد لها وصف , ه<br />اقرأ بقية التعليق .."
archived = "2006-12-03"
capture_url = "https://web.archive.org/web/20061203012456/http://masr.20at.com:80/article.php?sid=1040"

[[comments]]
order = 1
subject = "الى المدعو/ ايهاب"
author = "واحد وخلاص"
posted = "2006-10-12"
text = "الكلام اللي حضرتك كاتبه ده ايضا يمثل صورة رمضان بعد التشويه يعني خيالك عن رمضان هذا تشويه رمضان ثم جاء بعد ذلك التشويه تشويه آخر.<br />يا اخي عيب عليكم<br />نبدأ من الاول نجيب رمضان في القرأن (شهر رمضان الذي انزل فيه القرأن هدى للناس وبينات من الهدى والفرقان)<br />نشوف الكلام دا نزل على مين<br />نزل على النبي محمد عليه الصلاة والسلام والصحابة رضوان الله عليهم (مهاجرين وانصار)<br />نفتح الكتب ونشوف النبي عليه الصلاة والسلام والصحابة رضوان الله عليهم عملوا ايه في رمضان الرسول صلى الله عليه وسلم حضر (9) رمضانات نفتح الكتب ونشوفوا عمل فيهم ايه.<br />وبعدين عيب واحد استاذ كبير زي حضرتك يكتب السخافات دي اللي جابتنا ورا"
archived = "2006-12-03"
capture_url = "https://web.archive.org/web/20061203012456/http://masr.20at.com:80/article.php?sid=1040"

