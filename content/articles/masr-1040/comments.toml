subject = "الى الأستاذ اللى فوق .."
author = "أيهاب على"
posted = "2006-10-12"
text = "أنا قلت فى أول المقال انى مش بتكلن على الجانب الدينى والعبادات<br />أنا بتكلم على شعورى الشخصى .. إحساسى برمضان<br />\"نبدأ من الاول نجيب رمضان في القرأن (شهر رمضان الذي انزل فيه القرأن هدى للناس وبينات من الهدى والفرقان)\"<br />أنا مش بكتب موضوع تعبير عن رمضان مع أحترمى لرأى حضرتك"
archived = "2006-12-03"
capture_url = "https://web.archive.org/web/20061203012456/http://masr.20at.com:80/article.php?sid=1040"

