text = "أتمنى أن أرى ياأختي العزيزة أدلة على ماذكرته<br />فلم نسمع من قبل أن الإمام علي أراد الزواج بأخرى<br />في حياة فاطمة بل كان ذلك بعد وفاتها وبوصية منها<br />سلام الله عليها.<br />فهل لك أن تأتينا بدليل على ماذكرت ؟؟"
