subject = "رنين الحب"
text = "بسم الله الرحمن الرحيم<br />الى الاخت العزيزه شيرين .انه حقا لاروع من رائع واجمل من جميل .شيرين تسمحيلى ابعث لكى بكل الحب فعلا انا استفد من الموضوع ده وحاسه فعلا انى جوايا حاجه اتغيرت وخصوصا بذكر سيره الرسول عليه الصلاه والسلام ابعث لكى بكل الشكر الموجود فى الحياه واقول لكى انا وكل اللى استفاد من الموضوع ده بارك الله فيكى.<br />رنين الحب"
archived = "2004-06-20"
capture_url = "https://web.archive.org/web/20040620062632/http://www.20at.com:80/article.php?sid=338"

