[[comments]]
order = 3
subject = "شيرين"
text = "أخي الفاضل أبو جنين، ورد الحديث المتعلق بحادثة رغبة علي بن ابي طالب في الزواج بأخرى في أكثر من صحيح. ففي البخاري: حدثنا قتيبة: حدثنا الليث، عن ابن أبي مليكة، عن المسور بن مخرمة قال: سمعت رسول الله صلى الله عليه وسلم يقول وهو على المنبر: (أن بني هشام بن المغيرة استأذنوا في أن ينكحوا ابنتهم علي بن أبي طالب، فلا آذن، ثم لا آذن، ثم لا آذن، إلا أن يريد ابن أبي طالب أن يطلق ابنتي وينكح ابنتهم، فأنما هي بضعة مني، يريبني ما أرابها، ويؤذيني ما أذاها). وفي سنن بن داود: حدثنا أحمد بن يونس وقتيبة بن سعيد، المعنى قال أحمد: ثنا الليث، قال: حدثني عبد الله بن عبيد الله بن أبي مليكة القرشي التيمي، أن المسور بن مخرمة حدثه:<br />أنه سمع رسول الله -صلى الله عليه وسلم- على المنبر يقول: \"إنَّ بني هشام بن المغيرة استأذنوني أن ينكحوا ابنتهم من عليِّ بن أبي طالبٍ فلا آذن، ثم لا آذن ثم لا آذن، إلا أن يريد ابن أبي طالبٍ أن يطلق ابنتي وينكح ابنتهم، فإِنما ابنتي بضعةٌ منِّي، يريبني ما أرابها، ويؤذيني ما آذاها\"."
archived = "2004-06-20"
capture_url = "https://web.archive.org/web/20040620062632/http://www.20at.com:80/article.php?sid=338"

[[comments]]
