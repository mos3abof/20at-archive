text = "خلي كده بقه رئيس دوله مسلمه يقول مافيش كنايس هاتتبني و ما فيش صليب وثني هايترفع علي ارض مسلمه … شوف اللي هايحصل ؟؟<br />التشدد بس هو حكر علي الاسلام …<br />الاسلام لما بيتمكن من دوله بملاها نور و عدل و علم و فضيله .. اما التانيين .. ف سلم لي ع المحبة .. يا بتوع الله محبه"
