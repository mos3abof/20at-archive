author = "انت عبيط يا ابني ؟؟"
posted = "2009-12-30"
text = "اقتباس احمد:<br />خلي كده بقه رئيس دوله مسلمه يقول مافيش كنايس هاتتبني و ما فيش صليب وثني هايترفع علي ارض مسلمه … شوف اللي هايحصل ؟؟<br />التشدد بس هو حكر علي الاسلام …<br />الاسلام لما بيتمكن من دوله بملاها نور و عدل و علم و فضيله .. اما التانيين .. ف سلم لي ع المحبة .. يا بتوع الله محبه<br />انت بتتكلم بجد ؟؟ مفيش كنايس تاني على ارض مسلمه .. هاهاهاهاهاها و مين قالك انه فيه كنايس اصلا على ارض مسلمه ؟ ثانياً انت بتقول على الصليب \" وثني\" ؟؟؟ انت قريت اي كتاب في حياتك ؟؟ بيتهألي انك ساقط من 5 ابتدائي … و بعدين الاسلام ليه يتمكن اصلا من اي دوله .. هو الدين هدفه انه يعمل دول و ممالك هنا في الارض ولا المفروض انه ينظم علاقتنا بربنا ؟ و مش عارف ليه بتتريق على الله محبه … اومال انت فاكره ايه ؟؟؟"
archived = "2010-01-15"
capture_url = "https://web.archive.org/web/20100115065653/http://www.20at.com:80/20at/religious/14233-2009-12-03-11-00-20.html"
