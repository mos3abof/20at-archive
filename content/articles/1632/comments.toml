[[comments]]
order = 32
subject = "شيخ مختل عقليا يحلل الزنا"
author = "عمرو عبدالحفيظ"
posted = "2006-10-07"
text = "بسم الله الرحمن لرحيم<br />والصلاة والسلام على أشرف الخلق والمرسلين سيدنا محمد النبي الامى وعلى اله وصحبه أجمعين بالطبع هذا شئ مؤسف للغاية ان نجعل أصابعنا في اذاننا ولا نسمح لنا ان نسمع الذي يقولة المجانين والشيوخ الفاسقين والادهى من ذلك اننا عندما نسمع نصمت ولا نتكلم ولا حتى نعارض فهذا الشيخ ليس معتوه ولا مختل عقليا انما هو شيخ حائن يريد ان يشعل نار الفتنة والشهوات واباحة المحرمات وانا اعتقد اننا لن نستطيع فعل شئ وان الله وحده هو الذي سوف ينتقم منه لانها حدود الله عز وجل<br />والسلام عليكم ورحمة الله وركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151137/http://www.20at.com/article2.php?sid=548"

