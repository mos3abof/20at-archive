text = "جميل يا محمود الموضوع وفكرته غريبة بس انت مش شايف معايا نسبيا ان نشر الموضوع ده بيدعو الى انك تزيد الاقاويل؟؟ يعني لما نلاقي واحد اهبل بيقول كلام اهبل بالكتير اوى نعمل نفسنا مش سامعين حاجة واذا كانت جريدة غلطت وعملت معاه حوار يبقى انا مقولش ان فيه حوار اتعمل مع اهبل .. مهو اصل الهبل كتير .. بس عامة لو كان الغرض الحقيقي من النشر هو اخذ الاحتياطات لفتاوي ابو فتوى السكرة ده .. فالله اعلم بالنيات"
