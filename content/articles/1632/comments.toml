[[comments]]
order = 30
subject = "لابد من التغيرر"
author = "انسان بيحب مصر"
posted = "2006-09-11"
text = "حسبنا الله ونعم الوكيلفي كل شئ في مصر<br />انا لو فتحت في الكلام لا يسعني ان اكتب العديد والعديد من الكتب ولكن اكتفي بان اقول<br />الي متي سيظل شعبنا ساكت<br />بل افضل ان اقول ( نائم - اخرص )<br />انعدمنا دينينااصبحنا اكتر من بيروت في فضائحنا<br />العرب يجعلون من مصر منتجع من نوع خوص<br />اسمية منتجعا حنسيا يفرغون رغباتهم لجنسية في بناتنا باموالهم وبعلم واضح لجكومتنا كتر الله خيرهم بيقومو باللي عليهم وبيوفراهم جو ممتع<br />اكتفي بكدة<br />لاني زى ما قلت الكلام كتيييييييير<br />وربنا يطولنا في اعمار وزرائنا وحكوتمنا<br />قولو امين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151137/http://www.20at.com/article2.php?sid=548"

