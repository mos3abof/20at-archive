[[comments]]
order = 23
subject = "عدم فهم"
author = "ميرجوان"
posted = "2006-03-28"
text = "بتوقع انو الشيخ ماخد وجهة نضره عن شهوه وانو شيء جميل وطبيعي انو الولد يكون ماشي مع بنت ومفكرها تحضر لكنه ما بعرف انو شيء قبيح تطلع البنت من بيتها عذراء وترجع زانيه وتطلع شريفه وترجع غير شريفه مبن بقبل هاده الحكي لاخته او لامه اول لقريبته ما بعرف انو التحضر الحقيقي(مش التحضر الغربي)انو المجتمع يكون خالي من الامراض التي تنتج عن الزنى زي الايدز ما بعرف انو التحضر الحقيقي بالاخلاق الحسنه وخلو المجتمع من الفساد.وفي بلد اجنبي 50% من شعبه اولاد زنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151137/http://www.20at.com/article2.php?sid=548"

[[comments]]
order = 24
subject = "دا مش شيخ يا جماعة"
author = "Elz3aim For Ever"
posted = "2006-04-02"
text = "يا جماعة انا بس عندى تعليق مهم جدا<br />المفروض مانقولشى شيخ دا لاهو شيخ ولا اى حاجة دا اذا كان الموضوع دا اساسا صح لان المفروض دى جريدة صفراء و بس مش كده و وسخة كمان يعنى كل اللى بيقراها بيدور على حاجتين على حسب ما سمعت<br />1- الفضايح<br />2- الاخبار الهابطة<br />يعنى لما نحب نقرأ للأسف بنختار حاجات و سخة ياريت نقاطع الجريدة دى سواء مسلمين أو مسيحيين علشان الجريدة دى جابت اخبار عن قسيس قبل كده و ده برضو مايصحش و ادى النهاردة عن شيخ و الله اعلم بكرة على مين<br />يا ريت فعلا نبقى حريصين فى اخبارنا و فى كلامنا و فى اختيارنا علشان ده هو الصح<br />و حسبى الله و نعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151137/http://www.20at.com/article2.php?sid=548"

