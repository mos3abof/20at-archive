posted = "2006-03-13"
text = "دي ثوابت دينية يا جماعه مش لعبه و اللي بيقرا النبأ دي يبقا واحد بيركب ميكروباص او اتوبيس او قطر بدل ما يشتري لب و اجرنال ده معروف انه جرنال قذر ( مش اصفر ) و انا مع مينا ان نظية المؤامرة في خيالنا بس<br />و للعلم ممدوح مهران مات من زمان و شبع موت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151137/http://www.20at.com/article2.php?sid=548"

