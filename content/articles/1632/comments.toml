posted = "2006-10-07"
text = "معلشى بقى العيب مش على الاسمه شيخ العيب على البلد إلى مسكنهاشوية مشايخ منصر بيشجعوا الفساد لو بلدنا بلد مسلمة مش هيجرأ أى سفيه يتكلم فى كلام الله الذى نهى عن المحارم والكبائر<br />ولا حول ولا قوة الا بالله<br />وربنا لا تؤاخذنا بما فعل السفاء منا"
