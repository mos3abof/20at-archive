subject = "رااااااابنا يشفي...!!!! (اهي دي اللي تليق عليه )"
author = "sweet_princess"
posted = "2006-03-09"
text = "واضح جدا انه فيه اختلال عقلي اصيب بيه حضرة الشيخ ... بناء على جرثوووومه متناهية الصغر انتقلت له من ( بقره هبله)..<br />انا بس ليا تعقيب على الشيخ ..ال شيخ ااال (اياك تشخشخ ركبك يا اخي ).<br />بفى فوفا (فردة البلغه القديمه ).. (اي الحذاء)..مرسله من قبل الله عز وجل .. معقوله دي يا اسطى (مش واسعه دي عليك انت وهيا )..<br />هيا صحيح اول من ايتدع نظرية ان العمل عباده..اذن الرقص عباده .. وخرجت علينا بتصريح في منتهى العقل والحكمه لما قالت ان العمل عباده اذن الرقص عباده وانا (هي يعني)لما برقص ببقى في حالة ذكر لله.. واهي من ساعتها نازله عباده .. عباده ..عباده لحد ما وسطها اتخلع..<br />اهي دي فعلا اللي بينطبق عليها مقولة ...(رقاصه وبترقص)..<br />اعوذ بالله من دي بني ادمه (دي حيوانه لا عنها دين ولا اخلاق )..<br />واخيرا عم الشيخ ... راااااااابنا يشفي ."
