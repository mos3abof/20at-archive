[[comments]]
order = 18
subject = "مينا"
author = "مينا"
posted = "2006-03-12"
text = "اولا<br />دلوقتى بس عرفتوا ان الجريدة دى هابطة و قذرة وصفراء وتعتبر من صحافة بئر السلم<br />لكن لما ظهر موضوع الراهب ( قبل كدا) الملفق قلتم لا الجريدة دى رائدة الجريدة دى جريئة الجريدة دى حرة<br />ليه دايما يا اخونا نكيل بمكيالين احنا ( مسيحيين ومسلمين )<br />اخوات فى الوطن ولو انجرح اى طرف فى عقيدته اكيد هينجرح الطرف التانى كمان<br />الجريدة دى من قبل موضوع الشيخ المختل عقليا ده وموضوع الراهب الملفق ده معروفة بانها جريدة صفراء قذرة جنسية<br />لما تيجى تتكلم الجريدة دى عن السياسة بتتكلم عن فضائح السياسين الجنسية<br />ولما تيجى تتكلم عن الفن بتتكلم عن فضائح الممثلين الجنسية<br />ولما تيجى تتكلم عن الرياضة تتكلم عن فضائح اللاعيبه الجنسية<br />فطبيعى جدا لما تيجى تتكلم عن الدين تتكلم عن فضائح رجال الدين مع اضافة بعض اللمسات لاضفاء بعض الاثارة فى الموضوع<br />يا اخوتى المسلمين ياريت اللى لا نرضاها لانفسنا لا نرضاها لغيرنا ايضا هذا هو العدل والانصاف<br />وزى ما انا شفت فى بعض التعليقات الجميلة على الصفحة دى اللى بتقول ما معناها ( بديهيا جدا جدا ان الموضوع كذب اما الراجل ده مختل عقليا ) لان مستحيل دين عظيم ذو قيم وفضائل زى الاسلام يحلل الزنا<br />يبقى ياريت وده حقيقى نتبع نفس المعيار فى موضوع الراهب الملفق<br />ونتاكد انه تلفيق لان مستحيل الزنا تحصل فى بيت من بيوت الله زى ( دير درنكة ) ومن راهب وباسم دين عظيم وراقى زى الدين المسيحى<br />يا جماعة على الاقل ربنا مش هيسمح ان ده يحصل باسمه<br />اما بالنسبة لرائى المتواضع فى الشيخ فاكيد اما الموضوع كله كذب و تلفيق وفبركة من الجريدة<br />اما الموضوع فعلا حقيقى لكن الشيخ اكيد اكيد مختل عقليا<br />وبالنسبة لبعض التعليقات الغريبة على الصفحة دى اللى بتقول ان ( الشيخ ده مدسوس فى مصر من قبل اليهود والامريكان عشان يخرب مصر )<br />فانا بقوله هو مفيش حاجة ورا اليهود والامريكان غير اخراب العرب<br />واليهود والامريكان نايميين صاحيين صاحيين نايميين يدبروا مكائد ومصائب للعرب عشان خايفيين منهم<br />يا اخ او يا اخت ( انا مش فاكر كاتب التعليق) احنا كعرب فقدنا اهميتنا واعتباراتنا و كرامتنا عند الغرب من زمان اوى اوى اوى<br />والغرب بدا يوفر فلوسه اللى كان بيصرفها عشان يخرب مصر والعرب<br />لان العرب و مصر بغبائها وتعصبها و جهلها والفتنة عمالة تخرب فى نفسها بصورة اقوى واسرع مما كان عايزه الامريكان واليهود<br />ونبطل تشميع اخطائنا وفشلنا على الامريكان واليهود صدقونى يا جماعة والله العظيم احنا مش فى حسابات الامريكان و اليهود بالمرة<br />دلوقتى الامريكان و اليهود عندهم اخطار اقوى و اهم مننا دول تانية متعلمة و متسامحة و متماسكة عننا<br />زى ايران والهند والصين وكوريا الشمالية واليابان هى دى الدول اللى يتعملها حساب و يتخاف منها<br />اما احنا كفاية علينا غبائنا و جهلنا وتعصبنا عشان نمزق بعضنا البعض بدون ادنى مجهود من الامريكان و اليهود<br />واخيرا<br />1 موضوع الراهب المسيحى ملفق والشريط القذر اتصور فى شقة فى شبرا والراهب مرفوض من الدير من 1992 باعتراف الجريدة نفسها<br />2 موضوع الشيخ اما ملفق ومن خيال الجريدة الواسع القذر اما الراجل ده مختل عقليا اما اى حاجة غير انه يكون حقيقة<br />3 اى موضوع وكل موضوع بيتنشر فى الجريدة الهبلة دى صاحبة القراء الهبل زيها كذب واثارة وارتداد حضارى سريع وتدنى بالمستوى الصحفى فى مصر بل تشنيع و تشهير وتقبيح لمصر كلها<br />4 يكفى انى اقولكم ان فى 18 شخصية عامة مشهورة ما بين فنانين ولاعبيين ودبلوماسيين رافعين قضايا على الجريدة المتخلفة القذرة دى بيتهموها بالسب و التشهير و الكذب<br />تخيلوا 18 شخصية عامة ب 18 موضوع كاذب<br />يبقى فعلا فعلا فعلا احنا هبل لو صدقنا كلمة من الجريدة دى تانى<br />زكفاية ان رئيس تحرير الجريدة القذرة دى ( ممدوح مهران ) اتسجن اكتر من مرا يعنى رئيس تحريرها رد سجون<br />وشكرا و ياريت يا جماعة احنا كمسلمين ومسيحيين ناخى ونحب بعض تانى زى زمان<br />وشكرا و بااااااااى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151137/http://www.20at.com/article2.php?sid=548"

