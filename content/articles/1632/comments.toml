subject = "رسالة مهمة من مينا"
author = "مينا"
posted = "2006-03-23"
text = "من فضلكم يا جماعة و بجد و من غير هذار و للاهمية القصوى ومن غير مبالغة<br />روحوا شوفوا اللى بيحصل على صفحة (الاخوان x وحيد حامد = تار بايت ) هاتوا الصفحة دى من الارشيف بسرعة من فضلكم واقراؤا الموضوع والتعليقات و بالاخص اخر تعليقين"
archived = "2006-11-02"
