text = "فعلا الحمد لله ان في شباب زي اللي علقوا علي الموضوع ده في الموقع الجميل ده لان ده بيأكد ان الشباب لسه والحمد لله فيهم خير كتير من الجنسين فالحمد لله والحمد لله ان الراجل ده ( ال يعني الشيخ المهووس ) خلا الشباب فعلا يعلن رفضة وفطنته للألعيب دي ولولا الخطأ ما عرفنا الصواب وأنا طبعا مع اللي بيقول لازم مش ندي الموضوع اكبر من حجمة فالحمد لله ده واحد أهبل في جريدة اهبل منه لقراء اكثر هبلا وهبلا فلازم نعلي عن الصغائر دي ونتناقش في حاجة اكبر وافيد ولازم لو كانت دي يعني علي سبيل الموعظة يبقي نمر عليها سريعا لان مش هنفضل علي طول قدامها<br />وانا مع اللي طرح سؤال إزاي ده موجود في وظيفته -طالما انه مجنون - ده طبعاحاجة محزنة<br />إسلام"
