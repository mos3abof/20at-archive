text = "كلام فيرس صحيح وانا معاه ميه فى المية لأن ترويجنا للأخبار الهابطة دى هو اللى بيديلها صوت ويخلى الناس تسمع عنها<br />ثم ان جريدة النبأ دى معروفه ان هى هابطة وكل أخبارها هبله واللى بيشتريها هو اللى بيشجعهم انهم يستمروا فى هذا الطريق الخاطئ ودورنا ان احنا ندى ضهرنا للأحبار اللى من النوعية دى ونترك الججهات المختصة تتعامل معهم ثم الدور الأهم اننا ندعو لمقاطعة هذه الجريدة الفاحشة<br />على فكرة جريدة النبأ دى النقابة قفلتها قبل كدة أكتر من مرة وبتفح تانى إزاى وبتجيب ترخيص منين معرفش وآخر مرة غيروا الأسم قال يعنى جريدة تانية وسموها الأنباء تقريبا"
