text = "والله على ما يبدو ان الاقامة في جده افضل<br />حتمشي في المظاهرات ولا الاضرابات ولا الاعتصامات<br />ولا حتقف في طوابير الخبز<br />خليها في جده احسن على الاقل جنب الحرم<br />على الاقل مفيش امن مركزي"
