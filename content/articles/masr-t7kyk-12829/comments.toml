text = "سلمى حبيبتي انا بقول ابوها لما يمنعها ترجع لوحدها بعد ماسابها تتعلم في الجامعة لوحدها 6 سنوات من كلامها هي هو أدرى فيه أيه وهو عارف بنته كويس هي اللي كلامها مش مظبوط في الفيديو بتقول انه اخواني وبالكلام الانجليزي ياريت تقروه مع موضوعها في الفيس بوك بتقول انه وهابي هي اللي كلامها في شئ مش صح<br />وبعدين سايبة الناس تسب في السعوديين ليه واللي يقول بر الوالدين تحذف رده وتهينه وده حصل معايا وسيبت الجروب لكده وحذفت ردودي هناك"
