text = "هبة بجد انا شوفت الفيديو في المصري اليوم والحقيقة زود من تأكدي انه معندكيش قضية<br />يعني لو كل واحد اختلف مع ابوه شوية يسيبه ويمشي يبقى محدش جيستنى مع اهله الموضوع كله اللي باين فيه لخبطة منك انتي كتير بكلامك الانجليزي اللي نازل مع الموضوع بتقولي ابوكي وهابي يعني سلفي يعني مسلم متدين ومنهم كتير في مصر ومش ماسكين سكاكين لولادهم ولا شئ ولاحتى ستات السعودية متشرحين المهم وبكلامك في الفيديو ومدونتك بتقولي انه ابوكي اخوان فين بالظبط الصح مجرد تعارض كلامك يبقى فيه غموض وعدم مصداقية منك"
