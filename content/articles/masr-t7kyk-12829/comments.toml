text = "iunknown الأخ أنت صح وعندك حق احنا مش ناقصين قضايا ومشاكل ولا مش لاقيني شئ يشغلنا الدنيا كلها قضايا وبجد ومصر فيها اللي مكغيها دي انسانة عاقة ومشكلة اسرية عايزة تتشهر وتق ابوها رد الفعل بتاع الناس غريب قضية حقوق انسان ايه بس وجهات اجنبية هي مصر ناقصة ولا الحرب ع الاسلام ناقصها وفين اللي متحمسين كده وقضية مررة الشربيني ولا عشان ننساها وهي دي اللي تستحق كنا نشد من عزمنا عشانها"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

