posted = "2009-08-04"
text = "ما عنها مارجعت<br />اولا مين المتشدد ده اللي سايبها تروح القنصلية ,والامارة وتتصل بطوب الأرض وتكتب على الفيس بوك المدونات و…<br />وبعدين جدة ايه اللي متشددة<br />هي راحت الرياض ولا القصيم ؟؟؟<br />الموضوع غالبا فرقعة اعلامية تلقفتها ايدي من يتربصون بأي حاجة تقول شفت السعودية عاملة ازاتي<br />شفت المسلمين عاملين ازاي<br />الحرية انك تلتزم بقانون الدولة اللي انت فيها<br />كون أبوها غاصبها دي مشكلة اسرية لا تزيد عن هذا<br />وبعدين هو اخوان ولا سلفي ولا ايه بالظبط<br />لو متخانقة مع ابوكي حلوا مشاكلكم جو البيت<br />جتكوا القرف"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

