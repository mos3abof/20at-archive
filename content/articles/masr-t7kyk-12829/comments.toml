[[comments]]
order = 2
subject = ""
author = "سمر الدالي"
posted = "2009-08-04"
text = "مش لازم اقولك قصة حياتي لكن انا حصلي نوع من الظلم من راي من ابويا وبحبه ومش بخرج عن طوعه وبتحمله وبقول ده قدري وبرضى لله وبدعيله وبقول هو لازم يقصد مصلحتي بس شافها من وجهة نظره لا يكن اعاملة بندية في رحمة لمن كان سبب وجودي مع انه اتظلمت فعلا وقوي لكن اين الرضا لله واين الاحتساب يارب عوضني وفعلا ربنا بيكرمني ويعوضني بس برضا ابويا عني ورحمتي عليه هو ده اللي اتعلمناه وعليه دينا وقيم مجتمعنا من زمان مش النهاردة بس اليوم بقى كله باهت وقيم عجيبة"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 3
subject = ""
author = "سمر الدالي"
posted = "2009-08-04"
text = "الشخص اللي بتتكلم عنه ده أب أنت عارف اب يعني أيه نغمة ولغة جديدة بنسمعها إنه الشرع والدين في موضوع البر مالوش لازمة ونعامل الاب اللي خلف وربى وتعب زي رئيس العمل مثلا الاب سبب وجودي وانا بقولك ازاي ينزلها مصر تتعلم لوحدها 6 سنوات ولما ترجع ياخد باسبورها فيه نقطة مشواضحة هنا الاب الديكتاتور ده اولا ازاي سابها تقعد وتتعلم في مصر وحدها في شئ مش من حقك ولا اي حد يحكم على الاب زي ما بتدافع عنها بدافع عن حق الغائب هنا القيم اختلت عشان الاب يبقى مالوش لازمة ونقوله ماتلزمناش وعيشتك مش عاجبانا لما نكبر مش نبر الاب ونرحمه في كبره"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 4
subject = ""
author = "عبد الله صادق"
posted = "2009-08-04"
text = "هل حضرتك ترضين أن يقوم شخص بحبسك في بلد غصب عنك رغم أنك لم تفعلي له شيئا خاطئا ويخفي عنك بطاقتك وهويتك ويقول لك أنك مرتدة ؟<br />ولما تيجي تشتكي نقول لك : تستاهلي ؟<br />أو نقول لك : كلامك ملوش اي لازمة قبل ما نسمع الطرف التاني؟<br />والطرف التاني مطنش ومش بيتكلم ؟<br />هل السكوت هو الوضع الممتاز الذي نريد أن نخلص إليه في هذه الحالة؟"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 5
subject = ""
author = "عبد الله صادق"
posted = "2009-08-04"
text = "والله طالما هي محجبة ومسلمة ده معناه انها اكيد عارفة حتنزل مصر تقعد عند مين<br />مش من حقي احاكمها واقعد استجوبها<br />فيه شكوى ضد حق منتهك والموضوع واضح زي الشمس<br />لا بد من التحقيق في هذه الشكوى ومعرفة مدى صحتها وما إذا كان هناك جريمة حبس<br />إنسان في بلد رغماً عنه ام لا<br />التطنيش بدعوى ان الآباء \"غالبا\" ما يكونون محبين للأبناء هو دفن للرؤوس في الرمال<br />ولا يقول به عاقل<br />لكن التحقيق في الموضوع هو الصح<br />طالما الجهات السعودية لم تعط الشكوى حقها يبقى لا بد من تدخل السلطات المصرية رسميا<br />للفصل في المشكلة<br />ده حق أي بني آدم انه يتقدم بشكوى ضد من ينتهك إنسانيته بإخفاء هويته الشخصية عنه<br />أما بالنسبة لهي خرجت ازاي فهناك مليون سيناريو وسيناريو يمكن من خلالها تفسير كيفية خروج البنت الى السفارات.<br />وحتى لو خرجت بعلم الأب وكان الأب منتهكا لحق واحد من حقوقها فهذا لا يعني إعفاءه من المساءلة عن موضوع الشكوى أمام جهة رسمية عادلة<br />الحبس لا يعني أن يحبسها في غرفة ويغلق عليها بالمفتاح<br />والله هي دي اللي ناقصة كمان<br />الحبس الذي نتحدث عنه في هذه الحالة هو حبسها عن ترك السعودية والعودة إلى مصر إلى الأبد"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 6
subject = ""
author = "سمر الدالي"
posted = "2009-08-04"
text = "وهي بتتحرك في جدة عادي وجدة بلد مفتوح ووصلت لكل الناس دي عادي فين الحبس مشكلة عادية بين بنت واب من حقه يشوف مصلحتها له حق عليها ولا لو رجعت ووقعت في مصيبة سيادتك حتتبناها وتسعفها وتفضل زي الان واقف جنبها مش موضوع قوة رجل على بنت لارجل ده اللي خلفها الموضوع كلنا بنحتاج بعض ومحدش يستغنى عن ابوه إلا جاحد"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 7
subject = ""
author = "سمر الدالي"
posted = "2009-08-04"
text = "انا ماقلتش معاه حق يحبسها بالعكس قلت مش باين انها محبوسة محبوسة فين وهي بتعمل بحرية كاملة كل ده قلت دي مشكلة عائلية وابوها ادرى بيها لو حابسها ازاي نزلها تتعلم في الجامعة في مصر لوحدها 6 سنين وبعد اول ما ترجع يسحب باسبورها قلت ماسمعناهوش عشان نعرف ليه هو ادرى والحبس يعني بين اربع جدران"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 8
subject = ""
author = "عبد الله صادق"
posted = "2009-08-04"
text = "مهو اللي بنقوله<br />أن يتم استجواب الأب أمام جهة رسمية لمعرفة الحقيقة<br />مش تيجي تقولي معاه حق يحبسها<br />انت دخلتي قلتي معاه حق يحبسها دون أن تسمعي أيضا الطرف الآخر<br />فعلى أي أساس حكمتي ؟<br />لما يتم استجواب الطرفين وعمل تحقيق فيما إذا كان هناك انتهاك فعلاً من عدمه<br />نبقى نحكم<br />وحتى نحكم لا بد من جهة تحقق العدالة وتفصح عن الجاني والمجني عليه<br />وهذه الجهة لم تتحرك حتى الآن<br />يبقى مانجيش نقول معاه حق وله الجنة<br />ولا بتوزعي الجنة والنار على النت بالمزاج<br />ومن دون سماع الطرف الآخر ايضا ؟<br />اشعرفك هي خرجت ازاي ولفت على القنصليات ازاي علشان تحكمي وتقولي انها واخدة حريتها؟<br />انتي سألتيها ؟<br />ولا بس بتطالبي الناس تسمع رد الآخرين قبل الحكم وانت تحكمين دون سؤال صاحبة الشأن وسماع ردها عن كيفية وصولها وخروجها ؟"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 9
subject = ""
author = "سمر الدالي"
posted = "2009-08-04"
text = "الستاذ عبد الله تقولش انه ربنا لو قلناها عار مثلا حد سمع الاب بالعكس كونها قدرت تلف على القنصليات وتعمل ده براحتها على النت وتتكم وتصور فيديو من هناك يبقى حابسها ازاي لازم يتم سمع الاب والاب حد عارف ظروفة ايه وبعدين تقول لو كاريكاتور نعيط مين يعني قصدك المسلمين لو انت مش منهم يبقى فعلا انت مالك ومال ربنا والبر ولكن انا اللي بقول مروة الشربيني كمصرية مش كمسلمة حق دمها اللي تم هدره فين وابنها اللي اتيتم فين يابشوات حقوق الانسان"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 10
subject = ""
author = "عبد الله صادق"
posted = "2009-08-04"
text = "إضافة : الرجل يعلم ان ابنته كتبت مدونة واشتكته وكل ما فعله هو ان استمر في تكميم فمها<br />لو هو عارف ان معه حق واحد في المائة لتكلم منذ زمن طويل وانبرى للدفاع عن نفسه<br />ولكن لغة التشدد هي التكميم فقط وليس الحديث<br />عندما يخالف شخص مباديء حقوق الانسان فهو المعرض للتهمة وعليه ان يدافع عن نفسه<br />وهو لم يفعل هذا ولكنه فقط استمر في انتهاك حقها في العودة ولم يتم مساءلته حتى الآن<br />لما يكون الحق واضح زي الشمس ويأتي ناس يدافعون عن الانتهاك وكمان باسم الله فهذه مصيبة وعيب"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 11
subject = ""
author = "عبد الله صادق"
posted = "2009-08-04"
text = "السيدة سمر<br />هل ربنا قال للرجل يترك مصر علشان المجتمع كافر ويحبس بنته طول عمرها بالعافية في بلد آخر ؟<br />حقوق الانسان بتبقى حلوة قوي لما تيجوا تعيطوا علشان رسم كاريكاتيري لكن لما بني آدم يتهان باسم التطرف والتشدد حقوق الانسان بتبقى ملهاش لازمة ومخالفة لحقوق الله<br />ليس له الحق ان يحبسها ولا يمنعها من السفر ولا يزوجها من شخص لا تريده<br />لو عايزين العالم يحترم حقوقكم احترموا حقوق انفسكم اولا"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 12
subject = ""
author = "سمر الدالي"
posted = "2009-08-04"
text = "الاستاذ عبد الله حلو قوي حقوق الإنسان دي ده الاسنان للانسان وحقوق ربنا بقى علي عليها حقوق الانسان قانون ربنا ولا القانون العالمي دي مشكلة بين بنت وابوها خليتوها قضية قومية<br />ولا حد يقول ربنا ماله في الموضوع ده لانه ده اللي مش ممكن يكون مقبول اللي بيقول ده مفكرش انه من العدالة في اي قضية قبل ما تحكم تسمع الطرف الاخر وصوت الاب لم يظهر ولا اي حد يقول ابويا طالمني يبقى كلامة منزل بلا دليل ،أيها الأب المسكين لك الجنة بكل ما أتهمت به حتى لو صدقا فهي غيبة ياناس"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 13
subject = ""
author = "أحمد"
posted = "2009-08-04"
text = "قانونا البنت من حقها ترجع والحكومة السعودية قانونها ملوش سيادة عليها لأنها غير سعودية، والقنصلية اللي بتستعبط دي لازم تعرف شغلها كويس، كاية بقى وساخة والمصريين في السعودية بيتبهدلوا من المعاملة القذرة من لمتخلفين دول<br />لكن مراعاة لحقوق الأب عليها، البنت لو عندها دم تستحمل أبوها وتقعد، أو تراضيه بالعقل عشان يقتنع"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 14
subject = ""
author = "أحمد"
posted = "2009-08-04"
text = "البنت لازم ترجع<br />لكن برضه لازم برضا أبوها، وإلا يبقى عقوق<br />الصبر فإن الله مع الصابرين"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 15
subject = ""
author = "سمر الدالي"
posted = "2009-08-04"
text = "ياجماعة الموضوع كبر من غير لزوم سؤال للجميع مين فيكم معندوش مشاكل في بيته من ولاده من مراته ولا لو ست من جوزها وولادها هل ده معناه نعمل مشاكلنا ببيوتنا قضايا قومية نجيب فيها السفارة الامريكية والراجل يهجر بيته لانه ولاده ومراته مغلبينه والعكس صحيح يعني الفقرا اللي بمصر وامة السكن والجواز والغلب اللي الناس فيه فاضيين للست هبة<br />كمان فعلا زي الاخ اللي قال فين التشدد داخلة النت ومبهدلة ابوها كام يوم ومتكلمة موبايل باتصال سكاي بي ده ايه ده براحتها قوي قوي قوي"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 16
subject = ""
author = "قال تشدد قال"
posted = "2009-08-04"
text = "انا عاوز اتكلم في الحتة بتاعة تشدد الأب<br />اولا اخواني غير سلفي غير غير<br />و اللي ميعرفش ا جماعة يسكت<br />لكن المهم ازاي هي بتخش علي النت و حطت صصورتها و و راحت الامارة و شئون اللاجئين و القنصلية و الحتت دي كلها<br />يعني ابوها لو متشدد ازاي خرجت في كل الحتت دي و لوحدها<br />و هل تشدد ابوها يعني هو السبب بس و لا في اسباب تانية<br />طيب ابوها متشدد امها فين<br />بالنسبة لظروف اللي بيعيش في السعودية بيلاقي لبنتة جوازة سريع جدا و في الغالب بيبقي شاب شغال برضة هناك و عاوز جوازة ساهلة من ناحية انة مش هيعملها استقدام لأنة هينقل كفالة من ابوها لية علي طول و مش هيكلف كثر لأنة في الغالب بيجهز جهاز بسيط لبسساطة الحياة في السعودية كمغترب<br />فين أمها فين اخوات<br />طيب هي لو نزلت مصر هتعيش ازاي<br />هتشتغل يعني؟<br />طيب هتسكن فيها"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 17
subject = ""
author = "سمر الدالي"
posted = "2009-08-04"
text = "الموضوع خد أكبر من حجمة والناس بتجري وارى اي كلام يتقال مشاكل ايه دي ليها اب بيصرف عليها وغيرها هنا بمصر مش لاقيين حتى يشتغلوا والبنات هنا طالع عينها من الغلب على الشغل والكفاح ده تمرد على نعمة ربنا ودعوة خطيرة للعقوق بتنشرها واللي بيهللوا ليها عايزين امريكا في ايه ياناس اتقوا الله هي مصر ناقصة هي بنفسها قالت واسمعوا الفيديو نفسي ارجع بس الف في الشوارع والله ابوها هو الادرى ببنته تلف في الشوارع وتصيع يعني<br />لاحول ولاقوة إلا بالله"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 18
subject = ""
author = "عايزة تجرى على حل شع"
posted = "2009-08-04"
text = "البنت عايزة ترجع لوحدها<br />تخرج الصبح وترجع وش الفجر وتتزوج عرفى وترجع لابوها شايلة عيل على كتفها<br />هى دى الحرية<br />الحرية انها تجرى على حل شعرها بدون حسيب او رقيب<br />الحياة السبهللة والسهر فى الشقق<br />اتلمى يا بنت واقعدى جنب ابوكى<br />والبنت لو كسرت لها ضلع يطلع لها غيرة انما كلة الا العار<br />الحاج هريدى الصعيدى - فرشوط"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 19
subject = ""
author = "iunknown"
posted = "2009-08-04"
text = "اقتباس ترجع طبعا:<br />الناس بس الي واخدة الموضوع على صدرها كدة<br />الله لا يوريكم يعني إيه قهر<br />نموذج تقديس البشر دا هو الي مضيعها<br />هل معنى إنه -أب- إنه يكون صالح؟؟ وهل في أب طبيعي يبهدل بنته البهدلة دي؟؟<br />أبوها إخوان من المتأثرين بالتيار السلفي وكان مسافر زمان باكستان أيام الحرب وأخد أطفاله معاه زي ماقالت في مدونتها وأثر ذلك السلبي عليها وعلى اخواتها<br />الجروب بيزيد كل دقيقة من المتضامنين بالمئات وربنا ينصر هبة دي وكل هبة تانية مقهورة وصوتها مش واصل<br />الأاستاذ الفاضل<br />بص على تعليقات الناس تحت وانت تعرف انا باتكلم على ايه<br />واحدة عندها مشكلة مع أبوها ؛ ايه دخل القنصلية ووكالة شئون اللاجئين والامارة ووزارة الداخلية ومجلس الجيداي الأعلى<br />كلام متناقض جدا<br />منين اخوان ومنين سلفي ومنين في باكستان<br />حضرتك تعرف الجماعات دي وتوجه كل جماعة. أكاد أقول انها جماعات مختلفة تماما أيديولوجيا<br />كون بقة الجروب بيزيد فده ليه تفسيرات تانية أهمها الفراغ والانسياق وهرمونات المراهقة الدافعة الى معرضة الأهل وخلاص بعدم الفهم"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

