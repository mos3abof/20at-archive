posted = "2009-08-04"
text = "الكل بيفكر بمنطق البنت<br />محدش بيفكر بمنطق الاب<br />الموضوع مشكلة اسرية مش اكثر و لا لية اي لازمة كل الدوشة دي<br />و علشاننعرف ان احنا شعب تافه و فاضي و مش لقاي اي حاجة يعملها و اكثر المدونين كدة للأسف<br />هو فين التشدد لما هي عندها انترنيت و بتكتب علي الفيس بوك و صورتها انشترت الانتشار دي<br />ثم ازاي عندها 27 سنة و متجوزتش و المفروض يعني ابوها في الاسعودية يعني هتتلطش لطش<br />كل ده كلام فارغ و دي بنت صايعة مش اكثر<br />ولا عمرها هتلاقي راحتها بعيد عن اهلها<br />ياتكم نيلة مليتو البلد"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

