text = "الناس بس الي واخدة الموضوع على صدرها كدة<br />الله لا يوريكم يعني إيه قهر<br />نموذج تقديس البشر دا هو الي مضيعها<br />هل معنى إنه -أب- إنه يكون صالح؟؟ وهل في أب طبيعي يبهدل بنته البهدلة دي؟؟<br />أبوها إخوان من المتأثرين بالتيار السلفي وكان مسافر زمان باكستان أيام الحرب وأخد أطفاله معاه زي ماقالت في مدونتها وأثر ذلك السلبي عليها وعلى اخواتها<br />وبغض النظر عن دينها أو توجهها أو نوعها من حقها الشرعي إنها تاخد الي عايزاه من غير تبرير، إذا كان ربنا قال ياناس \"فمن شاء فليؤمن ومن شاء فليكفر\"<br />ومفروض إن الإسلام كرم المرأة؟؟؟ أي تكريم في أب بيتكلم باسم الدين بما انه قيادي كبير في الجماعة المحظورة ويعمل في بنته كدة<br />الله ينتقم من كل ظالم- مهما كان أب ولا أم ولا عفريت ازرق المهم ان ربنا حرم الظلم على نفسه وحرمه بين العباد<br />ارحموا من في الأرض يرحمكم من في السماء<br />الجروب بيزيد كل دقيقة من المتضامنين بالمئات وربنا ينصر هبة دي وكل هبة تانية مقهورة وصوتها مش واصل"
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804225737/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

