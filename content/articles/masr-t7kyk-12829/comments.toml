text = "واللي عنده عقل وبيتقي ربنا بجد مايلاقيش في كلامك اي شئ يتعاطف معاكي فيه<br />عايزة ترجعي تعيشي فين وحتعملي ايه لوحدك حتلفي في الشوارع ياسلام وربي ابوكي عنده جق يمنعك هو ادرى ببنته<br />وعارف سابك في مصر تدرسي شوفي عملتي ايه فيها يمنعك ترجعي لوحدك<br />انتي عايزة تبقي مشهورة وبطلة وبس ابوكي سايبك ع النت تبهدليه وتتكلمي موبايل وتكملي مسيرة عقوقك ويبقى متشدد ولا قاسي<br />متشدد كلمة مطاطية<br />تعني ايه<br />ربنا يصبر الاب المسكين ده"
