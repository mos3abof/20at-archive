posted = "2009-08-04"
text = "البنت عايزة تجرى على حل شعرها بدون رقيب او حسيب تخرج الصبح ترجع فى الفجر وتتلم على شوية صايعيين وهى دى الحرية اللى بيقولوا عليها<br />فية بيوت محترمة واى خروج على تقاليها يبقى فيها دم<br />عايزة تتنيل تتزوج عرفى وتجيب العار وترجع لابوها شايلة عيل على كتفها<br />اية البلاوى دى"
