author = "iunknown"
posted = "2009-08-05"
text = "الأخ متسائل<br />هجيب لحضرتك نص حاول تركز فيه شوية<br />حديث شريف<br />عن عمر بن الخطاب وابن عباس رضي الله عنهم أن رسول الله صلى الله عليه وسلم قال: \"لا يقتل والد بولده\"<br />رواه ابن ماجة<br />الاسلام شدد على القتل العمد وجعل جزاؤهالقصاص أي القتل<br />ايه رأيك في الحديث اللي فوق<br />لو والد حضرتك قتلك متعمد، لا يقتص منه بالقتل<br />نيجي بقة لموضوع ابن اشتكى ابوه<br />اللي بيحصل - للحفاظ على العائلة- هو توسيط أهل العقل زي ما الامير في السعودية عمل<br />وسط بينهم من يصلح وهي ماعجبهاش"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 35
subject = ""
author = "متسائل"
posted = "2009-08-05"
text = "لا<br />السؤال واضح جدا : ابن أو بنت ذهب أو ذهبت إلى الحاكم لتشتكي أحد والديها أو كلاهما.<br />وانتي جاية تقولي ده غلط انتي مخالفة لشرع ربنا.<br />دليلك من القرآن والسنة على كلامك فين؟<br />تفضلي هاتي الدليل<br />في انتظار أن تثبتي من كلام الله أو سنة نبيه صلى الله عليه وسلم أن ربع الكلام اللي عمالة تبعتريه على الناس اللي رايحة واللي جاية صح."
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 36
subject = ""
author = "سمر الدالي"
posted = "2009-08-05"
text = "وليه يعني اجيبلك دليل من غيره انت حتغير الددين فجاة وتقول انه طاعة الاب مش وارده في الشرع بعد سن البلوغ انت ايه اللي مزعلك هو في مانع اشارك في اي موقع يعجبني هات انت الدليل لانك انت اللي بتخالف كل الدين انه في نص يقول انه الابن يعادي ابوه بلا دليل علنا<br />وكفاية بجد انت خصوصا كلم نفسك من اولها حولت الكلام لتحدي وانت راجل ياراجل بلاش تقعد هنا وروح حررها وانا برضة حرة"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 37
subject = ""
author = "متسائل"
posted = "2009-08-05"
text = "ما رديتيش على سؤالي<br />هل هناك نص شرعي في القرآن او السنة يحرم على الإبن أو الإبنة من التظلم إلى الحاكم من أحد والديه أو كلاهما وأن ينظر الحاكم في المظلمة ويحكم بينهما لمن له الحق ويجازي الجاني؟<br />وفي حالة وجود ذلك النص فتفضلي بكتابته أكن لك من الشاكرين<br />واضح انك مش شايلة منها ومش حالفة لتقفي ضدها وده من تواجدك ورباطك هنا 24 ساعة<br />ههههههههه"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 38
subject = ""
author = "سمر الدالي"
posted = "2009-08-05"
text = "ههههههههههههههه هههه وبرضة عادي دور انت عالسر ياناصح اصلي في سرك انت عميل مندس ولا خائن يامحررين الحرية ادي اللي انتم فالحين فيه"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 39
subject = ""
author = "سمر الدالي"
posted = "2009-08-05"
text = "معه ولا قول اللي من بين كلامك تريد تقوله ولا انتم التهم عندكم عادي بلا دليل<br />ولا اكون مثلا ابوها ولا حد من طرفة مثلا ومتنكر حقيقي في الفيسبوك كتير قالوا كلامي كل الحكاية اني رديت ع اللي رد عليا وبس وانا حرة ولا عندك راي تاني ولا انتم عاملين شرط للي يشارك يوافقكم ويكون وياها والا في فروض ارهاب ما قول نعرف برضة مين اللي ساندكم كده"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 40
subject = ""
author = "سمر الدالي"
posted = "2009-08-05"
text = "ههههههههههه بجد ضحكتني ايه كراهية ايه وغيره انا برد مافي حد ماكان موافقني الا واحد بس وبهدوء سبحان الله اعاديها ليه وانا لابعرفها ولا شئ ما بيني وبينها الا حق الله وبس وكله مع البنت حسيت بالاب وتعاطفت معه"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 41
subject = ""
author = "متسائل"
posted = "2009-08-05"
text = "الأخت سمر<br />هاتيلي نص واحد في الإسلام يقول بأن الأب أو الأم لو قام أحدهما بالإعتداء على حق من حقوق الأولاد فإن القرآن أو السنة تمنعهم من تقديم شكوى ضدهما لدى الحاكم والحصول على الإنصاف<br />نص واحد فقط يقول بأنه لا حق للإبن أو الإبنة أن يشتكي أحد أبويه أو كلاهما لدى حاكم البلد<br />وأكون لك من الشاكرين<br />وسؤال آخر لماذا أنت مجندة نفسك للعمل ضد حرية هبة منذ أن بدأ هذا الموضوع ؟<br />فالكل جاء ووضع تعليقه وذهب ماخلاكِ أنت التي تركت كل شيء وجلستِ هنا لتصدي الناس عن الوقوف إلى جانبها<br />ترى ما هو السر الذي تخفينه ولماذا كل هذه الكراهية ضد هبة ؟"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 42
subject = ""
author = "سمر الدالي"
posted = "2009-08-05"
text = "الأستاذ اللي كتب احاديث بر الوالدين تسلم يااخي وبر لاوالدين من اللاساسيات في الدين اللي مش محتاجة نقاش بس يبدو كانه فيه قيم جديدة دخلت حياة الناس وتخالف الشرع الموضوع ده كله مش طبيعي شكله كانه هناك من يدعمها لده كله والا يعني المحبوسة دي فين اللي حابسها وهي هايصة ع النت كده … الموضوع بقى بايخ والناس خليها وانا بتمنى ترجع وتبقى تقابلني لو حد من دول عبرها لو عازت شئ بعدها"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 43
subject = ""
author = "يا جحش"
posted = "2009-08-06"
text = "البهيم اللي بيقول دي قصة مختلقة<br />يا ابن العبيطة يا فاشل شوف فيديو معاها على موقع المصري اليوم<br />ويا ابن العميا شوف فيديو معاها على قناة المحور<br />فتح عين أمك يا جحش"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 44
subject = ""
author = "قال تشدد قال"
posted = "2009-08-06"
text = "يا جماعة اصحوا بقي<br />الموضوع كلة فشنك و قصة اختلقها واحد علشان يسلينا مش اكثر<br />و دي صورة بنت من ع النت و لو دورت علي الصورة دي بجوجل هتعرفوا كلامي صح<br />و الموضوع كلو حدوتة اساسا محصلتش<br />و مصيبة المدونين ان اي حاجة هتتعلق بالمتشددين بهيصوا فيها زي طبالين الزفة بالضبط<br />و ياسلام بقي كمان لو جابت السعودية في الرجلين<br />و علي فطكرة الأخ متسائل اللي بيستدل مستدلش بمنتديات يعني بموقع شيح محترم مش بكلام مكتوب في منتدى محدش عارف مين كاتبة و مكتوب ازاي و امتة"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 45
subject = ""
author = "أمة الله"
posted = "2009-08-08"
text = "سمر بصراحة أسلوبك في النقاش غير مقبول وغير معقول ايضا !!<br />وتقريبا زي ما انت قلتي ان والدك حكم عليك بحاجة اتظلمتي فيها وبدل ما تتحركي في رفع الظلم عن نفسك ( مع مراعاة عدم العقوق طبعا ) قعدتي تقنعي نفسك ان هو ده الصح !وبالتالي عشان نفسك ترضى بالصح لازم تشوفي المجتمع كله من حولك عايش نفس هذا الصح ولذلك مش متقبلة ـ وبدون قصد ولا عمد منك ـ إن حد تاني يتحرك ويكون عنده حل أفضل من حلك يحسسك بإنك مظلومة ، بمعنى إنك لما تشوفي كل الي حولك زيك بترضى نفسك مادام الدنيا كده<br />أدعوك لمحاولة رفع الظلم الواقع عليك مع الاحسان لوالدك والعفو عنه ورحمته في كبره وبالاستعانة بالله ايضا<br />واعلمي أن رفع الظلم أولى بكثير من الصبر عليه والرضى به<br />ربنا يعينك ويرفع عنك<br />وشكرا"
archived = "2009-09-07"
capture_url = "https://web.archive.org/web/20090907080021/http://20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 46
subject = ""
author = "أحمد كٌريِّم"
posted = "2009-08-10"
text = "اقتباس متنيل بستين نيلة:<br />سبحان الله<br />البنت هبة دي مش هتورد على جنة<br />لاسباب كتيرة<br />اهمها عقوق ابوها المتدين واللي كل الناس قالو عليه متشدد للعلم ابوها راجل محترم وخايف على شرف بيته وعشان كده منعها من النزول لمصر<br />الانسة اللي مش هتورد على جنة عايزة تنزل مصر عشان تروح الاوبرا وتصيع براحتها وابوها مش عايز كده عايز يستر عرضه<br />شوفوا عقوق الابناء انتوا عارفين لو بنت سعودية عملت مع ابوها كده وقتلها ما بيتسجنش<br />بيروح يجيب الشرطة ويأدبوها وممكن يسجنوا البنت لحد ماتقول حقي برقبتي<br />انا لو ليا بنت وعملت كده كنت قتلتها<br />والاخوة المطالبين بحقوقها يتقوا الله في نفسهم كما تدين تدان<br />هو أنا معك يا أخي ان عقوق الوالدين خطأ، لكن الذهاب للأوبرا مش صياعة و قلة أدب.. هو يا إما حلال حلال والرجل ده كويس يا إما كله حرام حرام؟؟"
archived = "2009-09-07"
capture_url = "https://web.archive.org/web/20090907080021/http://20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

