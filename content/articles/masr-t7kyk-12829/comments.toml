text = "ماهو العم متسائل هو بقى اللي قاعد هنا وهو راجل ماوراهوش شغلة ولا مشغلة وبس عشان يصد اي حد يقول اي كلمة حق طيب ياراجل ياجامد قوي روح حرر ماما هبة الكبيرة العالقة الرشيد واعمل لها تمثال نحطة في ميدان رمسيس ز تمثال الحرية بتاع امريكا واهو تتشهر وياها لما هي ترجع وتعمل الكليب بتاعها مش الشهرة دي فايدتها ولا ايه برضة شئ مفيد ليك وليها وتبوقا فعلا عملتوا حاجة لمصر"
