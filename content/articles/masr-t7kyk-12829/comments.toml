text = "الاخت سمر<br />تحياتي وشكرا لتعليقك.<br />نحن لانبغي الا طاعة الله عز وجل , واستخلص من تعليقك ماهو تذكير للاخت العزيزة (كما تدين تدان)<br />والله يا اخت هبة (بركة دعاء الوالدين ) لا تدانيها نعمة في الكون الا نعمة الاسلام."
archived = "2009-08-04"
