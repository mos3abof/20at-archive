subject = ""
author = "www.cit4pc.com"
posted = "2009-08-04"
text = "أحاديث صحيحه فى بر الوالدين<br />ألا أنبئكم بأكبر الكبائر . ثلاثا ،قالوا : بلى يا رسول الله ، قال : الإشراك بالله ، وعقوق الوالدين - وجلس وكان متكئا ، فقال - ألا وقول الزور . قال : فما زال يكررها حتى قلنا : ليته يسكت( البخارى )<br />أن رجلا سأل النبي : أي الأعمال أفضل ؟ قال : ( الصلاة لوقتها ، وبر الوالدين ، ثم الجهاد في سبيل الله )<br />( البخارى )<br />عن عبدالله بن مسعود أنه قال (سألت رسول الله ، قلت : يا رسول الله ،أي العمل أفضل ؟ قال : ( الصلاة على ميقاتها ) قلت : ثم أي ؟ قال : ( ثم برالوالدين ) قلت : ثم أي ؟ قال : ( الجهاد في سبيل الله ) . فسكت عن رسول الله صلى الله عليه وسلم ، ولو استزدته لزادني . ( البخارى )<br />قدمت علي أمي وهي مشركة ، في عهد رسول الله ، فاستفتيت رسول الله ، قلت : إن أمي قدمت وهي راغبة ، أفأصل أمي ؟ قال : ( نعم ، صلي أمك ) ( البخارى )<br />جاء رجل إلى رسول الله فقال : يا رسول الله ، منأحق الناس بحسن صحابتي ؟ قال : ( أمك ) قال : ثم من ؟ قال : ( ثم أمك ) قال : ثم من ؟ قال : ( ثم أمك ) قال : ثم من ؟ قال : ( ثم أبوك )<br />( البخارى )"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 30
subject = ""
author = "متسائل"
posted = "2009-08-05"
text = "والله يا سمر انا قلت اقعد معاكي شوية اونسك بدل ما انتي قاعدة لوحدك تكلمي الحيطان على النت بقالك كم يوم<br />انا بصد عن كلمة الحق؟ ليه ؟<br />وكلمة الحق اللي انا كتبتهالك من قول علماء المسلمين وحطيتلك الرد عليها كلمة كلمة مش عاجباكي؟<br />ولا كلمة الحق دي المقصود بيها اللي يمشي على مزاجك ويجي على هواكي؟<br />جبنالك الدليل على ضعف الحديث وعدم حجيته وانه لا يعتد به في الفقه والرد على الحجج العقلية من قول علماء المسلمين عايزة ايه تاني؟<br />لسه مش قادرة تردي على سؤالي وعلشان كده داخلة تكملي وصلة الكراهية التي لا تحمل اي فكر ولا تزن جناح بعوضة في ميزان الحق<br />كل كلامك شخصنة ولم تجيبي عن سؤالي الذي سيبقى شوكة في حلقك إلى الأبد لأنك تعلمين أن وقوفك هنا سببه مرض نفسي وليس طلب الحق والعدل<br />والله انتي اللي عايزة تعملي كليب تكملي فيه وصلة الردح اللي شغالة بيها دي"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

