subject = ""
author = "متسائل"
posted = "2009-08-05"
text = "وقال بعض أهل العلم: هذا ليس بشرط، وأنه يقتل الوالد بالولد إذا علمنا أنه قتله عمداً، واستدلوا بعموم الحديث: \"النَّفْسُ بالنَّفسِ\"[119] وعموم قوله تعالى: (وَكَتَبْنَا عَلَيْهِمْ فِيهَا أَنَّ النَّفْسَ بِالنَّفْسِ)(ال مائدة: من الآية45) .<br />وأجابوا عن أدلة الآخرين فقالوا: الحديث ضعيف، ولايمكن أن يقاوم النصوص المحكمة الدّالة على قتل النفس بالنفس.<br />وأما التعليل فالتعليل عليل، وجه ذلك: أن الوالد إذا قتل الولد ثم قتِلَ به فليس الولد هو السبب في إعدامه، بل السبب في إعدامه فعل الوالد القاتل، فهو الذي جنى علىنفسه، وهذا القول هو الراجح لقوة دليله بالعمومات التي ذكرناها، ولأن هذا من أشدّ قطيعة الرحم، فكيف نعامل هذا القاطع الظالم المعتدي بالرّفق واللين، ونقول: لا قصاص عليه.<br />فالصواب: أن الوالد يقتل بولده سواء بالذكر كالأب، أو الأنثى كالأم.<br />http://vb.islam2all.com/showthread.php?t=44962<br />حكاية بقى اللي بيحصل للحفاظ على العائلة والأمير ومش عارف ايه<br />كل ده لم تأت عليها بسند واحد يؤيد كلامك من كتاب الله ولا سنة رسوله<br />لم تأت بسند واحد يقول أن شكوى الإبن أو الإبنة للأب أو الأم حرام"
archived = "2009-08-07"
capture_url = "https://web.archive.org/web/20090807101353/http://www.20at.com:80/masr/t7kyk/12829-2009-08-03-11-04-48.html"

[[comments]]
order = 33
subject = ""
author = "متسائل"
posted = "2009-08-05"
text = "الأخ iunknown<br />ركزت معاك في الحديث<br />يا ريت بقى تركز انت معايا في الرد اللي حكتبهولك ده<br />قال الزيلعي: \"- وأما حديث ابن عباس: فأخرجه الترمذي، وابن ماجه أيضاً (2) عن إسماعيل بن مسلم عن عمرو بن دينار عن طاوس عن ابن عباس أن النبي صلى اللّه عليه وسلم قال: \"لا تقام الحدود في المساجد، ولا = يقتل الوالد بالولد\"، انتهى. قال الترمذي: حديث لا نعرفه بهذا الإسناد، إلا من حديث إسماعيل بن مسلم، = وقد تكلم فيه بعض أهل العلم من قبل حفظه، انتهى. وأعله ابن القطان بإسماعيل بن مسلم وقال إنه ضعيف<br />قال بعض أهل العلم إنه يشترط أن لايكون القاتل من أصول المقتول والأصول هم: الأب والأم والجد والجدة وما أشبه ذلك، وقالوا: لا يقتل والد بولده واستدلّوا بحديث: \"لايُقتَلُ الوَالِدُ بوَلَدِهِ\"[118]، وبتعليل قالوا: لأن الوالد هو الأصل في وجود الولد فلا يليق أن يكون الولد سبباً في إعدامه."
