author = "فضاله السليطي"
posted = "2008-10-01"
text = "للتصحيح فقط الرهش ـ وهو الحلاوة الطحينية لا يقدم للاطفال كعيدية العيدية في قطر تعطى للاطفال على شكل نقود من فئة الريال فما قوق ، كما انني لم اسمع ابدا عن شراء لذهب والمجوهرات واهدائها للزوجة او غيرها بمناسبة العيد هذه ليست من عادات العيد في قطر الذي يتسم بالبساطة الشديدة يجب ان يكون مراسلكم اكثر دقة في المستقبل نتمنى ذلك"
archived = "2009-11-29"
capture_url = "https://web.archive.org/web/20091129013416/http://www.20at.com:80/20at/lifestyle/10182-2009-11-25-10-33-53.html"

