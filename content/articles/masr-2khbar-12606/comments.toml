author = "ايمان"
posted = "2009-07-09"
text = "ازاي يضربها 18 طعنة وفي المحكمة واضح انها خطة مدبرة فالغرب كلهم عتصرين ومش بيحب المسلمين ودم مروة مش رخيص وحسبنا الله ونعم الوكيل"
archived = "2009-07-11"
capture_url = "https://web.archive.org/web/20090711211840/http://www.20at.com:80/masr/2khbar/12606-2009-07-09-11-22-53.html"

