author = "حزينة"
posted = "2009-07-10"
text = "هناك غموض يكتنف الموضوع ونستغرب موثف الخارجية المصرية ورد فعل الحكومة الالمانية لكنه للاسف اصبح دماء المسلمين مباح فى كل مكان لطالما الحكومات الاسلامية تقف متفرجة فالان يستباح دماء المسلمين فى الصين والجميع يقف متفرج حسبنا الله هو نعم الوكيل.<br />الله يصبر اهلها"
archived = "2009-07-11"
capture_url = "https://web.archive.org/web/20090711211840/http://www.20at.com:80/masr/2khbar/12606-2009-07-09-11-22-53.html"

[[comments]]
order = 5
subject = ""
author = "التار ولا العار"
posted = "2009-07-11"
text = "قلنا ارجعوا لتاريخ الاجداد<br />التار<br />اى واحد يضربك قلم اضربة اربعة واى واحد يجرحك شرحة بالمطوة واى واحد يقتل لك قريب اضربة بالنار فى عز الضهر وحتى لو شنقوك<br />ما تسيبش تارك ابدا حتى ولو كان عند الكبير<br />هينصلح حالنا بالتار<br />نارنا هتبرد وعدونا هيخاف منا وهيعرف اننا مش شوية غنم ولا معيز وان دمنا غالى قوى<br />هريدى الصعيدى من فرشوط"
archived = "2009-07-11"
capture_url = "https://web.archive.org/web/20090711211840/http://www.20at.com:80/masr/2khbar/12606-2009-07-09-11-22-53.html"
