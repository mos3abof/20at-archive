[[comments]]
order = 16
subject = "احنا بتوع الكوكو واوا"
author = "بـــــــــــــــــــــــدر"
posted = "2006-08-03"
text = "عبود بيفكرنى بانور وجدى فى فلم امير الانتقام لما اتسجن وحاول يهرب من السجن الى حطة فية الحاكم الظالم مع الاختلاف فى مين الى اتسجن ظلم منهم . بس انا بقول لعبود لو عايز تطلع من السجن امل نفسك ميت ولم الجسة فى شوال واهرب وبالنسبة للشوال فهى مالة البلد وما فيش اكتر منها . اما بالنسبة لبعض التعليقات عن الجماعات الاسلامية فمتخدوش شباب الكوكو واوا فى الحسبان لان دول همة فلة النظام المباركى والعادلى والجمالى المصرى وهمة دول سبب نهضة الامة والتطور الطبيعى للحاجة السأعة اوى يعنى البسى كولا .... والسلام على الكوكو مع انة بأة غالى فى السوق والبيض غالى ووووو..... ولا بلاش ...."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

