subject = "الي بلبل ولهان و(أخوانه)"
author = "mahmoud"
posted = "2006-08-07"
text = "خلاص شباب مصر كلهم أصبحوا شباب الكوكو واوا وانتوا بس اللي بتعرفوا سياسه<br />خلاص انور السادات بقي عميل وعبود الزمر أصبح بطلا قومي<br />وبالمره أسامه بن لادن والظواهري والزرقاوي<br />أصحوا بقي من اللي بيحفظوه لكم<br />ده<br />طبعامبارك ديكتاتور وهيودينا في داهيه<br />بس أنتوا مثله ويمكن أكتر<br />اللي يخليكوا تدخلوا في الراجل شمال كده<br />وتصفوه بالجهل يخليكواتحبسوا وتعذبوا الشعب كله لو أختلف معاكم"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

[[comments]]
order = 22
subject = "وله يا مخمود إتلم يا خيوان"
author = "سيكو الميكانيكي"
posted = "2006-08-07"
text = "وله يا نيلة يا مخمود قطران<br />علي الطلاق من القبيحة أمك إنك حيوان قليل الأدب أمي جاهل، بأة يابن الجحش لما السادات مش خاين ودمر مش بس مصر بل البلاد العربية كلها بسياسته العوجة ولوغوصته وقلة شرفة ذمته وطولة إيده ونظام النهيبة وكبار اللصوص الذي إستحدثه.<br />ماحدش فرق الأمة العربية غير هو يا حيوان..والحيوان سيدك مبارك بتمم اللي عملة سيدك الكلب السادات..روح شوف تربه تلمك..ملعون أبو اللي نفضك صهيوني عميل جبان."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

[[comments]]
order = 23
subject = "أبدأ بنفسي"
author = "تامر أبوبكر"
posted = "2006-08-07"
text = "انا بأختلف جدا مع عبود الزمر بس ده مش سبب في اننا نبخس حقه في الخروج من المعتقل بعد ما أدى فترة حبسه. وحبسه أو أعتقاله ده دليل قاطع على ضعف الاجهزة الامنيه المصرية ورعبها الشديد من مواجهة هؤلاء الناس . وبصراحه كده مصر دي مش هيتصلح حاله الا بع ماكلنا نتغير من أنفسنا الاول صدقوني ، يلا نبدأ بأنفسنا"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

[[comments]]
order = 24
subject = "سبحان الله"
author = "مش لازم"
posted = "2006-08-07"
text = "سبحان الله فعلا<br />انا اولا مش مع الاخوان ولا كمان مع الحزب الوطنى<br />اولا الاخوان ...ملهومش مبدأ ..لآن اللى منهم وخلفهم مع السلامه ما بيشوفش الدنيا تانى ودى حقيقه وكلنا عرفنها ..واعتقد ان الاخوان هما اللى حميين عمنا حسنى ..<br />علشان كده بيتكلم بقلب جامد<br />وادينا شفنا ...اكتسحوا كراسى مجلس الشعب وعلى عينك يا تاجر ...كفايه بظرميط بقى<br />العم حسنى ده راجل دماغه عليا قدر انه يشغلنا بالمشاغل الداخليه ..ونخبط فى بعض اخوان على غد على حوارات مش مفهومه<br />وها بخلع ...ومعاه اعوانه..العدلى والجمالى والاخوانى ..دى حقيقه يا اخوانا<br />اللى يرد يرد ...واللى يشتم يشتم ..<br />والاخ اللى بيشتم ده ..وواخد الساحه لنفسه وعامل بطل قومى ...مش فاهم اى حاجه فى اى حاجه<br />واعتقد انه من الاخوان ...علشان كده بلاش نعتب عليه ...سيبوا يتكلم ويرد<br />بسم الله الرحمن الرحيم<br />ولا تقتلوا النفس التى حرمها الله الآ بالحق<br />صدق الله العظيم<br />وسلملى على الاخوان"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

