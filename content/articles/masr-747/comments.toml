[[comments]]
order = 10
subject = "مصري جدا"
author = "بحبك يا مصر"
posted = "2006-08-02"
text = "أخوتي الغاليين و بلدياتي المصراوية اللي زي العسل ، اللي بأفتخر بيهم في أي حتة بأروحها في بلاد الفرنجة ، اللي أنا بأكتب لكم منها دولئتي و حأفضل أقول أنا مصري علشان الكلمة طعمها حلو جدا. و حأفضل أردد دايما مع عمنا الفنان أحمد منيب \" أنا مصري جدا \"<br />و بصراحة أنا بأقرأ الكلام المكتوب و معجب بنضافة دماغكم بس لي بعض التعليقات:<br />1- لازم نتفق يا جماعة علي أن التغيير يبدأ من الداخل يعني يا جماعة الكلام المكتوب كله \"فلة ، وردة ، عسل\" بس محتاج تنفيذ عملي ، يعني خلينا رجالة و نشمر دراعاتنا و نبدأ بنفسنا.<br />- نبدأ بأنفسنا يعني نخللي عندينا ضمير في الشغل.<br />- بلاش رشوة و تزييف في الكلمة و الخبر و المشاعر.<br />- نحذف من قاموسنا كلمة واسطة و خلينا رجالة و تكون واسطتنا هي ربنا.<br />- نخللي قلبنا علي بعض و كله يبقي واحد بدون فرق بتاتا بتاتا.<br />2- نركز علي الشباب و نعطي له وقت كفاية و نساعده يشتغل و يلاقي وظايف و أخوكم أنا تعبت علي الأخر نفسيا بسبب أني كنت حاسس أني لا أستطيع أن أنجز الكثير و أنا بداخل مصر ( و تعبت حتي أجد طريقي للخارج) علشان المجتهد (بدون واسطة) بيلاقي طريقه بصعوبة و علشان كده نبقي رجالة بجد لو حاربنا الواسطة بفاعلية و ساعدنا الشباب أنه يشتغل و يحقق أحلامه.<br />3- أجمل حاجة يا جدعان لما تقدر تحقق أحلامك و تشعر أنك تقدر تنال اللي عايزه بأجتهادك و تدوق ثمرة تعبك بتوفيق من الله سبحانه و تعالي أولا و أجتهادك ثانيا.<br />بحبكم يا مصريين خليكم رجالة و يد واحدة انتبهوا لمصر و سلمولي علي وسط البلد<br />(بموت في وسط البلد موت موت لدرجة الأدمان)."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

[[comments]]
order = 11
subject = "موافق ومعترض"
author = "رامى"
posted = "2006-08-03"
text = "انا مع الحكومة والحركات الاقتصادية الحديثة من صعوبة تغير النظام فى مصر من دولة علمانية الى دولة اسلامية بحتة بالعكس انا من اهم المؤيدين للتطور التشريعى والنيابى فى مصر.مبسوط ان الاخوان فى مجلس الشعب وحزين ان فى كتير منهم واخدين الدين ساتر وان كتير من اخواننا الملتزمين دكتاتورين زى اخونا الله يرحمو وبدون ذكر اسمو اللى كان امير جماعة التكفير والهجرة وكن دكتاتور وكلامة قراءن واليعارض يتقتل.المهم انى موش مبسوط بالمعاملة الغير ادمية للمعتقلين ولشعب بحالو وان الداخلية بئت بلطجية ونفسى يفتكرا ان الشعب المصرى غلابة وان احنا بنادمين بردة ومبسوط من الردود الفاتت واسف للتطويل"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

[[comments]]
order = 12
subject = "الكلب الى اسمة محمد حسنى مبارك"
author = "الله"
posted = "2006-08-03"
text = "الشيخ عبود راجل من غير اى نقاش<br />اما الذى اريد ان اقولة<br />هو عن العميل لإسرائيل وأمريكا<br />الكلب حسنى مبارك<br />وانى قصدت ان لااقول محمد لأن خسارة فيه كلمة محمد<br />والكلمة التى اقولها حسبيا الله ونعم الوكيل فى هذا الكلب<br />وانشاء الله مصيرة هيكون مثل مصير السادات<br />وعلى يدى انشاء الله<br />والسلام عليكم ورحمت الله وبركاتة"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

