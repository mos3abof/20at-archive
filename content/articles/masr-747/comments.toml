[[comments]]
order = 32
subject = "كن كما تريد ولكن كن محترم"
author = "محمود فوزى عطا"
posted = "2006-08-25"
text = "أن تختلف مع النظام الحاكم فهذا حقك الذى كفله لك الدستور والقانون وكافة المواثيق الدولية ولكن قد يعترضك قانون الطوارئ وتدخل السجن وما الى ذلك والخلاف مع النظام أمر طبيعى وانا ايضا اختلف معه كثيرا ولكن الأحطر الخلاف مع التيارات الظلامية المتشددة فالخلاف معهم معناه انك مرتد وكافر وعاص وما الى ذلك وعقابك قد يكون الرجم او الجلد او القتل أو اشياء ابشع من ذلك .كما اننى من حقى ان انتقد الاخر فالأخر من حقه ان احترمه ولا اصفه بما لايليق بانسانيته .يجب ان يكون الاحترام هو الاساس فى الخلاف لأننا لانتصارع على امور شخصية بل كلنا مهمومين بانسانيتنا وبلدنا وامتنا .هل ستغضب عندما يسبك الاخر؟"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"
