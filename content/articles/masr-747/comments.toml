[[comments]]
order = 1
subject = "المصري؟"
author = "بلبل ولهان"
posted = "2006-08-01"
text = "نسيت إسم الرجل الأمريكي اللي أبو مصعب الزرقاوي ذبح إبنه على الشريط، إنما فاكر تعليقة كويس على إستشهاد الزرقاوي..\"قال أشعر بالحزن لأن أبو مصعب إنسان وروح ولايملك إلا الرب أخذ روح إنسان\". مش عايز أعيب في أهلك يمكن يكونوا غير طينتك ديه..إنما لما أقارن بينك وبين الراجل الأمريكي ده..ألاحظ الفرق فلكي لصالحه وأترحم أنا على إبنه..وأتمنى لو كنت إنت وأمثالك مكان إبنه تحت السكين يا معزة.<br />إش عرفك معنى الإرهاب؟ تقدر تقول إرهاب يعني إيه؟ كام برئ قتل عبود الزمر؟ تعرف حد؟ إيه تعريفك للتطرف وللإعتدال؟ وإيه معلوماتك عن خبراء التعذيب الإسرائيلين من الموساد اللي بيستعين بيهم النظام؟<br />مين اللي أصر على إعدام الشهيد الإسلامبولي؟ تعرف يا نونو؟ طب سليمان خاطر كان راخر تنظيم إسلامي؟ أكيد عمرك ما سمعت عنه..إسأل..مين اللي إغتاله في السجن الحربي؟ خبراء الموساد اللي شغالين هناك وإلا يمكن إنت؟<br />تعلموا الكلام والأدب..ولما تكون ضد الإرهاب الحقيقي تبقى ليك حق تتكلم."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

