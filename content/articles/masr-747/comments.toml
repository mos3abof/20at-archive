[[comments]]
order = 27
subject = "داخلي وسري! الحلوف مبارك عامل حداد"
author = "كيمو العجلاتي"
posted = "2006-08-09"
text = "العهدة على عم سعد الله الجنانيني المشرف على حدائق قصر القبة وقصر الجمهورية إن اللي ميسماش الحلوف المنوفي اللامبارك مصاب بحالة إكتئاب شديد جدا وتشنجات عصبية وحالة إسهال لا إرادي سببها خيبة أمله بهزيمة حزب الله أمام آلة حرب حلفاءه الصهاينة.<br />\"أهه طول الوقت لابس العباية السودة المقصلة من جلد الخنزير البري اللي ورثها عن سلفه المنوفي الحلوف السادات، ودي عباية الشريفات اللي يتفائل بيها، ومطلع التوراة ولابس قبعة اليهود وعمال يقرا ' شماع يسرائيل ادوناي الوهيم ادوناي آخاد' وكل شوية يضرب تيلفون لأولمرت ويسأل عن الأخبار ويعيط ويقول 'قلبي عندك يا أولمرت ياخويا، مستعملتموش البيولوجي والنووي لية؟\" يؤكد عم سعد الله، ويضيف قائلا\" حتى أولمرت إنزعج لحالة حليفه المنوفي المتردية وقرر فورا إرسال الدكتور بيطري \"مناخيم شاريت\" مدير حديقة تل أبيب للحيوان لمتابعة حالة الرئيس المصري.<br />خاب فألك يا منوفي وربنا يخزيك إنت وأهلك الصهاينة ويعز المسلمين."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

[[comments]]
order = 28
subject = "سقطه من عشرينيات ------ هتزورو التاريخ"
author = "ابن البلد"
posted = "2006-08-09"
text = "ليه الضجه الكبيره لعبود المجرم من المفروض المحكمة حكمة بالقصاص اي قتل عبودالقاتل.ماذا فعل الرئيس السادات؟؟السادات استلم مصر منكوبه صفر في الاقتصاد. حد يقتل رئيسه. هو التغيير لازم يكون بالقوه والقتل والارهاب. الاسلام بريء منكم يا اوغاد انتم شوهتمالاسلام حسبي الله ونعم الوكيل.السادات كان سبب في النصر والنصر من عند الله. المصريين اتوا بالنصر للعرب علي طبق من ذهب لما جاب الارض وكاد ان ينهي اسرائيل لولا تدخل الشيطان الاكبر امريكا. كل من اتهم مصر والسادات بالخيانة عميل للغرب الملحد الذي لا يريد الارض ولكن يريد محو الاسلام و يابي الله الا ان يتم دينه.هذه حرب عقديه يطلبون منا تنحية الدين جانبا وهم يعاملونا باناجيلهم و توراتهم المزيفة هم لا يريدو الاسلام .وانا والله اعلم اتوقع ان يغزو الاسلام العالم من الغرب هذه المرة . نحن مضطهضون في البوسنه و الهرسك افغانستان والعراق والشيشان ولبنان وفلسطين والصومال والسودان وفي كل مكان من العالم. حسبي الله ونعم الوكيل في كل الخونة والعملاء والمقصرين في حق الامةالاسلامية. اللهم عجل بالخلافة الراشدة اللهم عجل بالمهدي .!!!<br />مرسله من مسلم عربي مصري"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

[[comments]]
order = 29
subject = "لا يستحق السادات منا هذا..و تحيه الى مصرى جدا"
author = "نيفين نيفى نوفا"
posted = "2006-08-10"
text = "اولا احب احيى مصرى جدا على الكلام الصح جدا اللى قاله فيما يخص مصر<br />كلامنك فكرنى بالكلام اللى بقوله دايما لاى حد يشكك ف دور مصر او يقدم عليها هى دوله عربيه تانيه<br />و بالنسبه للموضوع و بغض النظر عن التعذيب او كون عبود صح او غلط فيه نقطتين<br />الاولى ان ربنا حخرم قتل النفس و لو هنحل مشاكلنا بالقتل يبقى نستاهل اللى بيحصل لنا<br />و ثانيا ارجعو للتاريخ يا جماعه<br />الرئيس الراحل انور السادات ميستاهلش منا كدا ابدا<br />على الاقل ميستاهلش اننا نتعاطف مع من قتله<br />و عموما لكل واحد رايه الذى احترمه"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

[[comments]]
order = 30
subject = "رد على الكلام الخايب"
author = "الرماح"
posted = "2006-08-10"
text = "مش عارف مين الشاب الطرب اللى بيتكلم على ان عبود الذمر راجل تمام عمل ايه لينا عبود ولا غيره حارب اسرائيل موت اى حد من جيش اسرائيل لا خالد لما موت السادات ايه اللى استفدناه ولا حاجة جه مبارك انيل من اى حد وبعدين احنا عرفين ان البلد دى عشان تتعدل لازم نكون رجالة نحترم بعض ونحترم الحرية مش نقول ان الاخوان احسن ناس ولا الحكومة اشرف حكومة لالا لازمنعرف ان العمل والقانون هو اللى حيخلينا احسن مش واحد يقول قال الله وقال الرسول ويشتم ويحلو ويسرق ويقتل عيب العمل والاحترام الاهم"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

