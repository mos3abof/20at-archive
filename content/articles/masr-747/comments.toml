[[comments]]
order = 14
subject = "مصر هي الأصل حتي لو أنكر المزايدين"
author = "مصري جدا"
posted = "2006-08-03"
text = "لكل المزايدين علي دور مصر أحب يا جماعة أفكركم بالنقاط التالية:<br />1- مصر هي أم الجميع و مفيش دولة عربية لها دور ريادي زي مصر يعني حتي السعودية نفسها كانت بتاخد معونة من مصر أيام ما كانت مصر ملكية.<br />عارفين حكاية ثنية الجلابية السعودية اللي طلع بيها مرسوم ملكي في السعودية ، عموما أقولهالكم: \" في الفترة التي كانت مصر فيها ملكية كانت تقوم بتقديم الدعم للجماعة السعوديين و ذلك قبل أكتشاف البترول بها و قبل ما يعرفوا حتي الصابون بتاع الأستحمام و قبل برضه ما يعرفوا الأستحمام . المهم كان من ضمن ما تقدمه مصر من معونات للسعودية شحنات من الجلاليب و كانوا يقومون بحياكتها (خياطتها يعني) بطريقة ثني الكم ، يعني يعملوا الكم كبير علشان لو واحد دراعه كبير يلبسها سقوم يفك الثنية التي تم خياطتها. ببساطة كده الجلابية كانت تناسب كل الأعمار (فاميلي سايز). المهم كانت باقي الجنسيات تعاير السعوديين (بثنية الكم بتاع الجلابية) فما كان من الملك إلا أن أصدر مرسوم ملكي يلغي فيه ثنية الكم بتاع الجلابية ، يعني علشان محدش يعايرهم ( و يزفوهم في الشارع). المهم السعودية ربنا فتح عليها بقرشين و عملوا فيها بتوع بيزنس، بسبب البترول اللي هو ثروة طبيعية يعني ما تعبوش فيها بتفكيرهم و أجتهادهم ، بدليل أنهم كانوا بياخدوا المدرسين من عندينا علشان يعلموا عيالهم اللي مش فالحة.<br />2- مصر الدولة الوحيدة بالمنطقة و بأفريقيا التي لها حضارة 5 الاف سنة. طبعا لا ننكر أننا بتخاذلنا و تواكلنا أهدرنا ذلك لكن هذه الحضارة حقيقة تاريخية و محدش يقدر ينزعها عنا.<br />3- في الوقت الذي كان فيه القدماء المصريين علماء يجرون عمليات دقيقة بالمخ و يشيدون الأهرامات كانت كل قبائل أفريقا و الجزيرة العربية رعاة ليس لديهم أي حضارة ، و طبعا ما حدش ينكر أن هذه<br />اقرأ بقية التعليق .."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

