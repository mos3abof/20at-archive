text = "\"وله يا نيلة يا مخمود قطران<br />علي الطلاق من القبيحة أمك إنك حيوان قليل الأدب أمي جاهل، بأة يابن الجحش \"<br />هل هذا هو حواركم ,أسلوبكم ,كلامكم<br />عفوا<br />أنا مش ها رد علي جهله متخلفيين<br />أذا أستهل انسان كلامه بالمطلع ده في مكان عام زي ده يبقي انا أقرف أكلمه<br />ألي المسؤل هنا برجاء أرحمونا من أكوام الزباله ديه"
