[[comments]]
order = 7
subject = "الي مشرف الموقع"
author = "عوني"
posted = "2006-08-02"
text = "إلي الأخ مشرف الموقع يعني أنت شغال تنضف في صفحات الموقع و بتعطي محاضرة في الأخلاق للجماعة \"الوحشين\" قليلي الذوق وسايب اللي يشتم علي الريس مما يعطي فرصة لباقي العرب الكتيانين الذين يزورون الموقع فرصة التندر و السخرية من الرئيس مبارك.<br />بلاش الكيل بمكيالين و الأزدواجة في المعايير و حياة أبوك و نظف الموقع من كل ما يقال ضد الرئيس و علي فكرة أنا مش مصري و مش عايش في مصر حالياو عيب أوي تشتموا علي الريس بالشكل ده و أنا رأيي أنه مش وحش بالشكل اللي انتو بتحاولوا تصوروه بيه. ثم كمان موقعكم بينشر مقالات أو قل أشباه مقالات للسب و الشتيمة في شخص الرئيس مبارك.<br />ثم يا أخ لما أنتو أرفانين منه أوي كده ما قلتوش كده ليه يوم ما رحتوا أنتخبتوه و لا خفتوا لا يكون فيه عفريت في صندوق الأنتخابات يعض أيديكم لو حطيتوا علامة صح قدام أي أسم تاني. عيب كده و أكبروا و خليكم علي مستوي المسئولية عيب أنتوا مش عيال صغنانين.<br />ملحوظة أخيرة : عمر مصر ما حتتقدم و أحنا شغالين ننقد علي الفاضي و المليان ، خليكم موضوعيين شوية و بلاش لعب عيال"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

[[comments]]
order = 8
subject = "يا اهلا بالمصايب"
author = "صبـــــــــــــــــــــارة"
posted = "2006-08-02"
text = "سلام يا منطقه اولا, ابتدي من الاخر الاخ عوني حرد عليك في كلميتن انت مش مصري , الموضوع الاصلي بقي انا فهمت دلوقتي حكايه الشريط الفيديو , مش دا بتاع امي مسافره<br />ما علينا ..<br />شوف يا باشا محسوبتك ارهابيه من صغرها,<br />العمو بتاع انا الله يمسيه بالخير كان سلفي \" الدعوة\" غير الجماعه , وكان بيصلي خلف حليق تخيل , المهم لما كان بيدخل المعتقل لاسباب امنيه متعددة مكنش يهمني ايه اللي حصل جوه غير انهم حلقوله لحيته , عشان كنت بلعب فيها ليل نهار , افتكر اول مره شوفته لما خرج عيطت جدا وقعدت اصرخ فيه انت قتلت عمو عمو بلحيه انت مش عمو , بعد كدا جتتي نحست ,لما كبرت دخلت مدارس الاخوان قالو عليها ارهابيه ليه عشان النشيد الوطني واحنا دخلين الفصول \" الي الكريم نقصد وللعظيم نسجد في سرنا وجهرنا نشيدنا التشهد ليلنا ونهارنا قلوبنا توحد \" بدل بلادي بلادي , غير ان البنات او المدرسات لما حد يجي موجه او حاجه البنات تستخبي في الحمامات او تخلع النقاب لو لابسه مع انها كانت خاصه , هه ارهابيه ...<br />حاليا متنبلي اني اخش جوانتانامو وعلي راي عمك مصطفي محمود ان الصراع الحقيقي صراع قيم ومصالح وحكايه الارهاب تلبيس وتدليس لتغير وجه القضيه ..\"<br />وسلااااااااااامي ..............."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831123325/http://masr.20at.com:80/article.php?sid=747"

