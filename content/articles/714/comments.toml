subject = "آه منها الأيـــــــــــــــــــــــــــــام"
author = "..& هيكل الأزهرى &.."
posted = "2006-08-22"
text = "دى حاجه فعلا جميلة والله الشرود يعنى او السرح انا عن نفسى بتحصلى كتير لكن فى اوقات معينه يعنى مخبيش عليكم لما بكون فى الحمام خاصة وفى موقف طريف هنا اوى كنت مرة قاعد وسرحان كدا المهم فجأة لقيت طوبة اتحدفت على شباك الحمام والله ساعتها اتنفضت من مكانى وكنت هقع اصلا ههههه لكن حقيقة موضوع السرح دا او الشرود فعلا بيحصل لكل واحد فينا لكن فى اوقات معينه اهم شىء اننا نستفيد من صغائر الأشياء يعنى الشرود نستخدمه فى التفكر فى خلق الله مثلا او التفكير فى اى شىء معين يكون ليه هدف اهم شىء فى الكون انك تخترع من الهيافه نجاح ومن الوقت الضائع وقت مستفاد منه ولكم جزيل الشكر ومعلش طولت انا رغااااااااااااااى من غير ما تقولوا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114433/http://www.20at.com/article2.php?sid=1142"

