subject = ""
author = "اترضاه لامك"
posted = "2009-08-29"
text = "اي حاجه بالنسبة للمرأة يجب ان تقاس على السؤال الموجود في العنوان<br />اترضاه لأمك<br />اترضاه لاختك<br />يا معشر الرجال<br />اي اجراء تتخذونه ضد المرأة لابد ان تسأل نفسك هذين السؤالين<br />اترضاه لامك؟ اترضاه لاختك؟<br />عايز تغتصب بنت… اترضاه لامك اترضاه لاختك<br />عايز تخطف بنك… اترضاه لامك اترضاه لاختك<br />عايز تتحرش ببنت … اترضاه لامك اترضاه لاختك<br />عايز تتجوز واحدة على مراتك … اترضاه لامك اترضاه لاختك<br />علما بان تعدد الزوجات خير وبركه ونماء تماما كما علمنا النبي محمد صلى الله عليه وسلم<br />اما مفهوم التعدد في وقتنا الحاضر ما ينفعش اللي عايز يعدد يبقى لازم يكون عنده اهداف النبي محمد صلى الله عليه وسلم في التعدد"
archived = "2010-01-01"
capture_url = "https://web.archive.org/web/20100101080936/http://www.20at.com:80/masr/news/13093-2009-08-29-07-52-00.html"

