text = "هو الشباب عارف يتجوز واحدة وعارف يفتح بيت لما تتكلموا عن ظاهرة كانت موجودة ايام العز ايام الملك<br />المشكلة ان المسلسلات كتير ومش لاقيين مواضيع"
