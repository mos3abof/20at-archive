text = "كم أحسست بالفخر بهؤلاء<br />أتمنى تسطير سير هؤلاء العظام الذين عشقوا بلادهم وآمنوا بالحق وتشربوا الكرامة وحب التراب<br />أتمنى من كل عربي أن يربى أولاده على حب الأرض والكرامة وأتمنى أن تدرس سير الأبطال لأبنائنا ونسلط عليهم الضوء والله يرحم شهدائنا برحمته"
