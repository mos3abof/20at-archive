[[comments]]
order = 2
subject = "يالا قول ورايا ... يلعن سنسفيل جدود حسني مبارك الواطي ......"
author = "إبن بهية"
posted = "2006-08-22"
text = "كالعادة أتابع تعليقات وكلمات أولاد البلد ... وجدت تعليقات كثيرة في أغلبها ناقمة على حسني مبارك الواطي .. لكن بينها واحد فقط شاذ على القاعدة .. لا أدري لماذا ؟ هل لأنه من المستريحين اللي مش حاسين بوكسة البلد ولا إيه ؟ الأفندي جاي يقول ما تشتموش مبارك .. ليه يا روش ؟؟؟ بأمارة إيه ما نشتموش ؟؟؟ طيب ادينا أي إشارة ولا أي حاجه عملها صح في حياته لنا عشان نكن لحظة ما نلعنش سنسفيل اللي جابوه للدنيا عشان يقرفنا في عيشتنا وينهبنا ؟؟؟<br />مبارك يا حضرة المحترم عميل صهيوني عينته أمريكا بافاكس الشهير الذي حوله من رئيس وزراء إلى نائب للسادات في عشر ساعات فقط (حادثة مشهورة ومعروفة) أمريكا عينته عشان يخلف السادات وتكمل الخيبة ... مبارك الواطي يا أستاذ هو اللي قال يوم ما وصل للحكم وأقسم بكل الأيمان إنه مش قاعد غير فترة واحده وطلعنا أغبياء وصدقناه .. بس طويلة أوي .. كان بيقصد بيها فترة حياته كلها ... حسني مبارك الواطي يا أستاذ هو اللي باع البلد وحقك وحقي وحق الكلاب .. باعها شركات ومصانع وأراضي للصهاينة وقبض التمن والعمولة كمان ... العالم دي ما بتقراش جرايد ليه ؟؟؟ يا شباب زمان كان الاطلاع على الصحف الأجنبية صعب شوية ويمكن مستحيل على البعض .. لكن دلوقتي أهي موجودة قدامك .. ادخل على مواقع الصحف الأجنبية وشوف ريسك بيعمل إيه فينا وفي البلد ... حسني مبارك الواطي هو اللي بيموت في حكمه كل يوم عشرات على طرق غير ممهدة لسير السيارات .. أقسم لي واحد من إياهم الكبار أن طريقا بين مدينتين بطول 95 كم تم رصفه على الورق .. أكرر على الورق عشر مرات في عشر سنين واتصرفت الفلوس في جيوب الباشوات .. هتقولي حسني ماله ومال الفساد ده ؟؟؟ يا محترم هو أبو الفساد لولا أنه رئيس فاسد ما كانش ينتشر الفساد بهذا الشكل ... هو إنسان فاسد ورئيس ولو الرئيس سرق مليون يبقى لازم العصابة تسرق ألف مليون قصاده .. المشكلة هنا يا كابتن ... حسني الواطي اللي في حكمه حصل وبيحصل للمصرين مئات الكوارث أرضاً وبحراً وجواً ... طبعا إهمال لأن الباشوات مش فاضيين من النهب والسلب والسرقة .. شوف الغلا والكوى اللي الناس فيه مش لاقيين اللقمة .. والله فيه كتير ناس في بلدنا بقت بتبات من غير عشا ... مش بيقولوا ما فيش حد بيبات من غير عشا ؟؟؟ طيب أهو حصل عندنا في مصر وبقت ملايين بتبات من غير اللقمة .. بلاش علاج .. بلاش مواصلات .. طيب اللقمة ؟؟؟ هو ده مباركك اللي مش عايزنا نشتمه ونلعنه وندعي عليه في كل ثانية .. هو ده مبارك الواطي القذر اللي حضرتك بتدافع عنه .. إيه رأيك ؟؟؟ مش تشتم معانا بقى ولا لسه عندك شك ؟؟؟ يا لا قول معانا .. يلعن سنسفيل جدود مبارك الواطي إبن الواطيين ... يلعن سنسفيل حكومته القذرة الوسخة .. يلعن أبو خاش أي كلب فيها بينهب دم الغلابة الشقيانين ... ربنا ينتقم منهم كلهم يا رب ...<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
