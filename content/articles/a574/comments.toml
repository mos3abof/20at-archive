[[comments]]
order = 3
subject = "أقولك"
text = "فيه ناس جبناء..أسهل طريقة عندهم للتقرب من المظهر الإسلامي الإبتعاد عن كل مظاهر المدنية والمخاطرة في خدمة الدين..فترفض الفن لأن سوق الفن ردئ..ونهجر العلم لأن علماء يوظفون العلم في خدمة أهداف سيئة..حتي وصلنا إلي مزبلة التاريخ..يصورونا وصنعون بنا تاريخ كاذب ووجهنا ملئ بالقاذورات ويعلونا الذباب..لأننا لا نحاول أن نفعل أشياء جميلة ترضي الله عز وجل وتعمر الكون وتجعله أكثر جمالا وأكثر قيمة.<br />هاقول إيه<br />حسبي الله ونعم الوكيل"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024152413/http://www.20at.com:80/article.php?sid=574"

[[comments]]
order = 4
subject = "يا جماعة"
text = "الأخ \"أقولك\" عايز أقولك انت ليه محموق قوي على الأخ عبد الجبار يا أخي متسيب الفن خالص والسينما ...<br />سيب يوسف شاهين يدخل ملايين فيلمه وانت خليك في الجامع تزعق من على المنبر ويوم ما يسمعك يكونوا 200 واحد نصهم نايمين<br />اللي يحب إسلامه يشمر ويخش بإيديه في كل حاجة قلبه تمام .. نيته سليمة .. عزيمته تهد جبل ... مش يقعد يقول لأ والنبي بخاف الفتنة .. كان فيه واحد في غزوة ما رضيش يجاهد قال ايه عشان هما هيغزوا الروم وهو خايف على نفسه من بنات بني الأصفر فالقرآن نزل فضحه وفضح عينته من المتخاذلين ... كقوله تعالى : ومنهم من يقول ائذن لي ولا تفتني [ التوبة 49 ] ، يقوله الجد بن قيس ، لما ندبه رسول الله صلى الله عليه وسلم إلى تبوك ، يقول ائذن لي في القعود ولا تفتني بتعرضي لبنات بني الأصفر فإني لا أصبر عنهن قال تعالى : ألا في الفتنة سقطوا [ التوبة 49 ] أي وقعوا في فتنة النفاق وفروا إليها من فتنة بنات الأصفر"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024152413/http://www.20at.com:80/article.php?sid=574"

