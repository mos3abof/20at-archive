[[comments]]
order = 1
subject = "وأين الأحزاب الأخرى ؟"
author = "إبن بهيه"
posted = "2007-01-25"
text = "وأين الأحزاب الأخرى ؟ أليس هذا دليلاً قاطعا على عدم وجود أحزاب معارضة في مصر ؟<br />أليس هذا دليلاً قاطعاً على صفقة الريس النونو أو الجرو الصغنن بتاع لجنة الوكوسات مع حزبي الوفد والعمل لشرائهما وضمهما إلى مقتنياته الخاصة بجوار ورق التواليت في حمامه الرئاسي ؟<br />كنت أتمنى من الحضور الكرام أن يوجهوا حديثهم إلى الشباب المغرر به في الوفد والتجمع كي يناقضوا قيادتهم المتواطئة مع ذلك النظام العميل لتقف وحيدة وتبيع ما لا تملك أصلا .. هي مجرد أحزاب صورية لا حول لها ولا طول وهذا ما يزيد الطينة بلة<br />هذا من باب توحيد الجهود الذي أدعوا إليه دوماً ، لكن التوحيد والتعاضد لابد أن يستثني الخونة وبياعين الوطن وسماسرة السياسة .. لا نريد هؤلاء بيننا ..<br />لتتوحد كل القوى الوطنية المخلصة لهذا البلد في مواجهة ذلك الحلف الحقير بين الوفد والتجمع الجرو الصغنن بتاع لجنة الوكوسات<br />ورحم الله مصر<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131103440/http://masr.20at.com:80/article.php?sid=1491"

[[comments]]
order = 2
subject = "دي بلد آخر جدعنة"
author = "جيفارا الشرق"
posted = "2007-01-25"
text = "ممكن تكون دي بلدنا فعلا بس لازم نتكلم عنها بشوية احترام<br />إيه الدستور العجيب ده أنا مش فاهم فيه إيه<br />الواضح إن البلد اتباعت بس يا ترى مين اللي اشترى<br />ممكن يكون جيمي ابن الحاج مبارك<br />ممكن يكون اصحاب رأس المال الاحتكاري القذر<br />ممكن يكون حد من بره<br />يا ريت الكل يفوقوا<br />ما تقعوش في الفخ اللي البياعين نصبوه ووضبوه<br />إحنا مش عايزين دستور ولا قوانين احنا الشعب اللي مش فاهم أي حاجة<br />احنا عايزين ناس يحسوا بينا بجد وينادوا بحقوقنا ويكون مننا<br />مش من الناس اللي اتربعوا علي عروش السياسية وبياعة الكلام<br />فوقوا<br />وسلامي للجدعان<br />جيفارا الشرق"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131103440/http://masr.20at.com:80/article.php?sid=1491"

[[comments]]
order = 3
subject = "دستور ومخلل"
author = "ابن عنتر"
posted = "2007-01-25"
text = "دستوركم يااسيادى<br />عفركوش ابن فركتوش متلبس جسم البنية<br />ومحتاج دم عصفور يتيم<br />ومنقار ديك مدخلش دنيا<br />وعرف فرخة عذراء<br />دستوركم يا اسيادى<br />العفركوش بيقول كلام مزوق وكلام محذق<br />لابيأكل جوعان ولا بيلبس عريان<br />نعمل زار والا نكنس السيدة<br />انا بحب العفاريت<br />لان العفريت ما بيضربش على قفاة وينضحك علية بمعسول الكلام<br />كلام ومكتوب على الورق وايش نعمل بية<br />يا عفركوش سكت الكلام"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131103440/http://masr.20at.com:80/article.php?sid=1491"

[[comments]]
order = 4
subject = "لا للفقر..لاللبطالة..لا لقانون الوظيفة العامة الجديد"
author = "بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-01-25"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو الوسيلة الوحيدة للتوظيف<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />من الاخر ياناس ده قانون ظالم وسيهدم اركان المجتمع الذي يقوم علي الاستقرار الي مجتمع يقوم علي التعاقد المؤقت ثم الي الشارع انت واسرتك ايه الموظف المسكين."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131103440/http://masr.20at.com:80/article.php?sid=1491"

[[comments]]
order = 5
subject = "الخطة الخمسية وطابور العواطلية"
author = "احمد نظيف ابو دم خفيف"
posted = "2007-01-27"
text = "اعلنت جريدة الاهرام عدد العاطلين وصل الحد لله الي 9 مليون عاطل من الشباب.<br />وقد تبادل سمو الوالي المقدس حسني مبارك المعرص<br />التهاني مع سمو الخليفة جيمي مبارك باشا التهاني بهذا الرقم العظيم .<br />وقد اعرب معالي الوزير احمدنظيف الخفيف سعادته بهذا الرقم مع تمنياته الكبيرة بزيادة هذا الرقم ليصبح 15 مليون في الخطة الخمسية القادمة.<br />وقد اعلن معالي الوزير نظيف في الصحف الحكومية المباركية انه من اهم انجازات عهد العارف بالله المقدس حسني المعرص انه اذا وقف العاطلين بجوار بعضهم البعض في طابور فسوف يصل الطابور من الاسكندرية الي اسوان, وتهدف الخطة الخمسية النظيفية القادمة وصول طابور العاطلين من الاسكندرية الي دولة جنوب افريقيا بهدف دعم العلاقات المصرية الجنوب افريقية, وتشجيع الاستثمارات والخصخصة والمصمصة"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131103440/http://masr.20at.com:80/article.php?sid=1491"

[[comments]]
order = 6
subject = "مبايعة أبدية"
author = "مواطن بسيط ومش عبيط"
posted = "2007-01-27"
text = "الله أكبر<br />الله أكبر كل وقت وكل أوان<br />الله أكبر ياللى بتعبد الامريكان<br />الله أكبر باقولها ولو تودينى الليمان<br />الله أكبر تقولها الدنيا جيل ورا جيل<br />الله أكبر ياللى بتسجد لأسرائيل<br />الله أكبر كل وقت وكل أوان<br />ها تعرفها معناها<br />بعد ما يفوت الأوان<br />رد يا خنزير<br />يا معيش شعبك ع الأوهام<br />بعتنا لليهود بكام<br />وأزاى بعد جرايمك ف حق العوام<br />بتعرف يا عديم الدين تنام<br />صدق اللى قال خنزير<br />وما فيش منك كتير<br />عشان كدة أسيادك حابينك<br />ورغم جرايمك سايبينك<br />يا خنزير يا أبن الكلب<br />خليت كرامتنا مطية<br />لكل من هب ودب<br />أرحل عنا وكفاية<br />دة الظلم له نهاية<br />أصل أكتر م اللى عملته<br />هاتعمل فينا أيه<br />ده شارون لو كان رئيسنا<br />كنا صعبنا عليه<br />أقول أيه<br />خنزير<br />وما فيش منك كتير<br />وأحنا اللى نستاهل<br />لأننا شعب حمير<br />مبايعة<br />بنبايعك للأبد<br />وهانعملك تمثال من بكرة يتعبد<br />خليت حياتنا نور<br />ما هو انت شمسنا<br />ونمشى وراك بالبخور<br />يا ساكن قلبنا<br />نتحدى الدنيا بيك يا حمانا ودرعنا<br />منعتنا الكلام<br />عشان مالوهش فايدة<br />حرمتنا الابتسام<br />البسمة دى حاجة زايدة<br />ياللى قلوبنا ف أيدك<br />وفلوسنا ف أيدك<br />ومهما عملت فينا هانفضل عبيدك<br />ونبايعك للأبد<br />وهانعملك تمثال من بكرة يتعبد<br />ياللى حياتنا بعدك مالهاش أى لازمة<br />والشعب من بعدك ما يسوى نعل جزمة<br />محو الهوية<br />إعلان كبير مكتوب<br />على ناصية حوارينا<br />حكومتنا الرشيدة<br />هاتغير أسامينا<br />محمد يبقى مارسيلو<br />وفاطمة هاتبقى جورجينا<br />قرينا الأعلان ومشينا<br />وضحكنا بعد ما بكينا<br />بعد الأسم أيه فاضل<br />من ذكرى أهالينا<br />ده مهما عملتى يا حكومة<br />مش هانغير أسامينا<br />وهانحافظ على الذكرى<br />مهما كبرنا و<br />اقرأ بقية التعليق .."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131103440/http://masr.20at.com:80/article.php?sid=1491"
