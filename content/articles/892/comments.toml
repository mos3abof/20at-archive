text = "المقال ممتاز وحقاً يعجبني كيف تم طريقة بحثه.<br />هناك خطأ أو أعتقده خطأً<br />في -وهى أضحك- المفروض أن تكتب الكلمة إضحك أو اضحك كهمزة الوصل.<br />ولكم الشكر دائناً<br />متمنياً لكم الخير دوماً<br />أبا محمد"
