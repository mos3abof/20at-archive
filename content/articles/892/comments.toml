[[comments]]
order = 4
subject = "ما تبوس يا تداس ..."
author = "هوووووووووبه"
posted = "2006-05-25"
text = "لديد الموضوع , الجامدة واللي بحبها بتاعت ثقافه الشعوب دي, في اليابان ولاه كوريا باين \"الناس اللي عيونهامسحوبه دي\" ماكنوش بيقبلو التقبيل لولا ارتباطهم بالحضاره الغربيه. في الصين\" بردو عيونهم مسحوبه\" بردوكان فعل كخه سواء في السر او العلن . وبعدين النظريه اتغيرت مع ارتباطهم بالغرب بردو , الهند بقي هما اللي بدعوا في معني القبله وارتباطها بالمعني الرومانسي \"ناري نارين<br />ناري من جماله\" . ومصر المحروسه\"قديما طبعا\" مكنش فيه<br />ورق بردي كتير عن الحكايه دي اللهم ام .اب بيقبل ابنه ,دا حتي ستك كليبوترا متكتبش انها قبلت عمك يوليوس وعدم تقبيله في الثقافه اليونانيه حاجه مش كويسه ,<br />والثقافه الامريكاني بقي تختلف من الزنوج ضرب باليد كدا زي هيب هاب وحضن , والبيض كمان ساعات ساعات<br />وغالبا قبله واحده بس علي الخد .<br />واحده صحبيتي كل اما تشوفني تهريني بوس الواحد بيغرق<br />بيتغرق بعديها وحجتها لازززززم تلاته والله بتبوس عوشرومت مره يلاما علينا ,<br />حته بقي في الفن صور اتباعت بالملايييين للرسام بابو كاسو \" مش فاكره كام مليون' وغيره من الرسامين.<br />الشعر بقي عمك \" نزار قباني\" في قصيده القبله الاولي.<br />عندي بس مش منزلها \" غتاته\"<br />امثال بقي \" كنس بيتك ما بتعرف مين بيدوسه، وغسل وجك ما بتعرف مين بيبوسه\" للنظافه \" بكره المثل دا\"<br />يللي بفرق ولد عن ولد بوسة إله بجهنم دوسه. \" للعدليعني. واخيرا 'هاتي بوسه\"يابينتي."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124724/http://www.20at.com/article2.php?sid=857"

