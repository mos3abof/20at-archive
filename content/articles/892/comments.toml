[[comments]]
order = 9
subject = "طيب و علشان خاطرى يا هوبه"
author = "نيفين نيفى نوفا"
posted = "2006-05-27"
text = "بجد رائع يا منى<br />الاسلوب و المحتوى و التناول<br />كله رائع<br />اه يا بلد<br />كام يد تقبل و لا تستحق شيئا<br />على راى الشاعر<br />يا وطنى كم من هرم مجدته<br />لم يكن يحمل طهر الصنم<br />بس يرده اكيد فى ناس محترمه كتير لكن لماذا التقبيل<br />فيه مليون طريقه تانيه للتعبير عن الاحترام و التقدير مش كده و لا ايه<br />على راى عمنا فؤاد المهندس<br />هوبه انا قرات ايميللك و قلبى عندك و الله<br />و بدعيللك يا هوبه<br />ادعيلى انتى كمان و النبى يا هوبه<br />هبقى ابعتللك واحكيللك<br />و بعدين تعالى هنا انتى مش عايزه ليه تبعتى قصيده نزار<br />لو مش عايزه على الموقع ابعتيهالى على الايميل سلام يا<br />يختى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124724/http://www.20at.com/article2.php?sid=857"

