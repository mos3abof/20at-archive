text = "المقال نموذج للموضوع المتميز<br />لمحة لطيفة جدا واشتغلتي عليها تاريخيا كويس قوي وفيه ما أسميه الخفة العميقة<br />الله يفتح عليكي<br />يبقى أمران اولا واحدة مصرية ليست اشتراكية أبدا أنا أعرفها جيدا، وكان نفسي أشوف صور على الأقل لقبلة المستشار البسطويسي"
