text = "المفروض ان تشكل لجنة على مستوى الجمهورية لتغيير الاسماء الغبية الى اسماء معقولة اذ كان بعض الاسماء القديمة لاولاد اسم خيشة والشحات والحيوان والجحش<br />باللة عليكم<br />فية بلد اسمها زفتى - لية ما تتغيرش الى اسم لائق بدلا من تقول انا من زفتى<br />واسم مكان اصبح من ضواحى القاهرة اسمة شق الثعبان — يعنى اية شق الثعبان<br />والاف الاسماء تستحق التغيير زى ابوطشت مركز ابو طشت سابقا<br />ثم ما معنى ابو حنس<br />يعنى واحد يقول انا من دير ابو حنس<br />خلوا النصارى يقولوا زى ماهم عايزين لكن الاهالى هيطلقوا على بلدهم وادى النعناع"
archived = "2009-06-20"
