posted = "2009-07-26"
text = "عشان قرف منك يامنى .. ريحتك بصل ، وواكله بصل ، والمطبخ والصالة وأوضة النوم يمكن فيها بصل .. والله دة جمل اللي عاش معاكي لحد دلوقتي .. كان حقه يموت من زمان"
