[[comments]]
order = 8
subject = ""
author = "جيـــــــــمـي"
posted = "2009-07-27"
text = "أيه يا جماعة<br />عاملين حوار ليه … البنت وبتلبس الى هي عايزاه وبتقول حرية و الولد عينيه بتزوغ ودى برده حرية …<br />هو انتوا ماقريتوش الدستور ولا ايه الى بيكفل حرية العبادة و العقيدة و الرأي و التعبير بس الى كتبه مات قبل ما يكتب وحرية اللبس و زوغان العين وحرية تدخين المخدرات وحرية بناء أمبراطويات الفساد وحرية ألأتجار بالبشر .<br />ما تفتكروش ان الحاجات دى كلها بعيدة ومالهاش دعوة بزوغان العين … كلها عوامل تؤدي للأحباط زى ما الست فاطمة الشناوي قالت و الأحباط بيؤدي للقهر و الأكتئاب و الفراغ ."
archived = "2009-07-29"
capture_url = "https://web.archive.org/web/20090729020951/http://www.20at.com:80/masr/t7kyk/12753-2009-07-26-12-22-58.html"
