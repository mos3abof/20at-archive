[[comments]]
order = 3
subject = ""
author = "منى"
posted = "2009-07-26"
text = "المصرى اجدع واحد بتاع كلام ويتفرج ويشوف<br />انما بقى وقت العمل مفيش ودايما على لسانة انا تعبان النهاردة سيبينى انام انا مجهد على الاخر<br />يعنى لا عينة زايغة ولا حاجة لانة مش قادر يكفى بيتة وبيهرب من مسؤلياتة وبيتكلم كتير على الفاضى<br />وقاعدين ناكل فية جمبرى وسمك ونديلة فوسفور وفى الاخر يدينا ظهرة وينام يشخر طول الليل"
archived = "2009-07-29"
capture_url = "https://web.archive.org/web/20090729020951/http://www.20at.com:80/masr/t7kyk/12753-2009-07-26-12-22-58.html"

