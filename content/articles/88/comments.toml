text = "انا فاكر في مرة قررت اني انزل اشتري لبس ,وخصوصا بنطلونات المهم دورت في كل اصحابي علي حد فاضي ...مفيش ,اخويا موش جايلة مزاج .المهم قررت اخوض المعركة وحدي وانزل اشتري بنفسي ,,, موش هطول عليكوا خدتهامن طلعت حرب للمهندسين ومنها للزمالك للعتبة وحتي الازهر نهايته بعد لف 6ساعات متواصلة روحت بيتنا وانا معايا الغنيمة الكبري بعد طول بحث وعناء 3شربات ضيقة اخدهم اخويا الصغير حتي قبل ما البسهم ..!!!"
archived = "2004-06-18"
capture_url = "https://web.archive.org/web/20040618210611/http://www.20at.com:80/article.php?sid=181"

