text = "أعترف أنا ايضاً مهووسة، ولكن بشراء الكتب. لا أعلم لماذا أعشق اقتنائهالهذ الدرجة. وكل عام لابد ان أنفق تحويشة العمر في معرض الكتاب،والطريف أنني في كثير من الأحيان لا أقرأ ما اشتريه على الفور، وتجذبني كتب جديدة اشتريها لأقرأها اولاً!!!"
