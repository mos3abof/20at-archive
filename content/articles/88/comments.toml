text = "نصيحة للبنات اللي من نوع \" i like it like that\"<br />يفضل انك تكفي على الخبر مجور لما يجيلك عريس، علشان الراجل مهما كان كريم..ميحبش يتجوز واحدة تضيعله فلوسه يمين و شمال...و هي مبسوطه و بتغني..خليها في سرك لحد ما تتجوزي يا اختي.."
