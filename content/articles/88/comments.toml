[[comments]]
order = 17
subject = "نظرة ثاقبة"
text = "السلام عليكم<br />مرحبا بالجميع .... في الحقيقة اعجبني الموضوع كثيرا ولا اراه تافها كما يظن البعض بل لو تدرون حجم المشاكل التي يسببها مرض الهوس بالتسوق فهي كثيرة وربما تكون مجودة فينا دون ان ندرك هذه السلوكيات السلبية و كما ذكروا في الموضوع ليس بالضرورة ان تكون غنيالتنفق وهناك حالات جدا غريبة في هوسهم لاقتناء الاشياء ودفع كل ما يملكون في سبيل الشراء فماذا تسمى شخصا هوايته شراء موبايلات كل فترة حتى اصبح يملك اكثر من مئة موبايل بل و الجدير بالذكر هنا انه يريد ان يبيع آخر ما يملك من قطعة ارض ليستكمل شراء ما يحب انه وسواس قهري و المشكلة هنا انه مستمتع بهذا الوسواس.. بالعموم انا حاليا بصدد كتابة موضوع بحث يتعلق بهوس الشراء واريد ان اضع استبيان لمجموع من الاسئلة لكلا الجنسين تتعلق في الموضوع نفسه ..ودائما البدايات صعبة فهل لكم بمساعدتي اووضع مجموعه اقتراحات :) وفي الاخير شاكرين لكم اتاحة الفرصة لابداء تعليق"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018221852/http://www.20at.com:80/article.php?sid=181"
