[[comments]]
order = 12
subject = "المواجهة..!!"
text = "انا كنت زيكم بالظبط، لحد ما جاتلي فكرة عبقرية..<br />انا اقدر اجزم ان أغلب المصابين بهوس الشراء من الناس اللي مستحيل تسألهم معاكم كام دلوقتي حالا و يكونوا عارفين.. ودايما مش عارفين فلوسهم اتصرفت في اية!!<br />و الحل العبقري هو \"أكسيل شيت \" يعملوا اكسيل شيت شهري بكل فلوسهم..كان معاهم كام و اتصرف في اية..حاجة زي ..إيرادات و مصروفات كدة...في الاول هيتصدموا شوية..مئات و يمكن الوف بتتصرف في الهوا للأسف...بس بعد كدة هيخدوا بالهم كويش قوي..علشان ميتكسفوش من نفسهم يوم الميزانية...!"
archived = "2004-06-18"
capture_url = "https://web.archive.org/web/20040618210611/http://www.20at.com:80/article.php?sid=181"

