subject = "الله يعين"
text = "انا راح اتكلم عن نفسي بصراحه انا فيني المرض هذا<br />وودي اني اتخلص منه بس مااقدر ما اقاوم الشراء<br />الله يعيني انا من النوع اذا عجبني شي تلقاني اكثر منه خاصه بالسفر وربي لما كنت مسافرة شريت ولا 20 حذاء لي تقول هذي البنت بتسوي بضاعه وللعلم ما لبست الا 5 او 6 احذيه منهم والباقي ادري ما راح البسهم وزعتهم لخواتي شريتهم بس بعزأه وطبعا غير الاقمشه اللي بالهبل وغير الشنط اللي يشوف الاغراض يقول انه ديرتنا فاضيه مع انه كل خير فيها<br />الله يجيرنا من الشين"
archived = "2004-06-18"
capture_url = "https://web.archive.org/web/20040618210611/http://www.20at.com:80/article.php?sid=181"

