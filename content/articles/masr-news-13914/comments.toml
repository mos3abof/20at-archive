text = "اقسم باللة ان فية اناس فى مصر بتنام من غير عشاء<br />ناس كانت مستورة وفى الايام السوداء دى جاعت<br />بيفطروا الصبح عادى عيش وفول وطعمية<br />وبيطبخوا كل يومين او تلاتة او مرتين فى الاسبوع ويتم الغداء الساعة 5 مساءا ليوفروا وجبة العشاء<br />يبقى حب اية وعيد حب اية<br />الناس غلابة جدا<br />والفقر بقى رهيب جدا"
