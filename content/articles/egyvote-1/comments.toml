subject = "jتجربة"
author = "زائر"
posted = "2005-11-28"
text = "شف أحمد كامل ياسين نقيب الأشراف أن من ينتسبون للرسول صلى الله عليه وسلم وآل بيته ليس من الممنوع عليهم أن يكونوا أعضاءً بأي برلمان في أي دولة، وأن خوضهم للانتخابات هو حق لهم مثل غيرهم.<br />وأشار ياسين إلى أن الشريف ـ الذي ينتهي نسبه إلى الرسول ـ هو جدير لأن يكون شخصية بارزة في المجتمع، وأن أكبر دليل على ذلك هو أن من أشهر الذين نجحوا في دورة الانتخابات الأخيرة للبرلمان المصري في المرحلة الأولى شخصيات معروفة بوزنها السياسي منها: كمال الشاذلي وزير الدولة لشئون مجلس الشعب المصري، ومحمد إبراهيم سليمان وزير الإسكان المصري، واحمد عز أمين العضوية بالحزب الوطني.<br />وأضاف أنه ليس من المستغرب أن يكون الشريف عضو مجلس شعب، بل إن أكبر عدد من أعضاء مجلس الشعب كانوا من الأشراف خاصة في دوائر الصعيد حيث أن معظم العائلات هناك شريفة، موضحا أن مجلس نقابة الأشراف القديم كان به 20 من أعضاء مجلس الشعب.<br />وأعرب نقيب الأشراف عن موافقته للترشيح للانتخابات البرلمانية إذا ما أتيحت الفرصة لذلك، إلا أنه أوضح أن منصبه كنقيب أشراف يجعله محملا بأعباء جماعية نبيلة، وهي رعاية مصالح الأشراف في العالم أجمع، مؤكدا أنه لا يمكن أن يتم تقييد حرية أي شريف ومنعه من المشاركة في حقه للترشيح لمجلس الشعب أو جهة برلمانية شعبية."
archived = "2007-08-15"
capture_url = "https://web.archive.org/web/20070815120810/http://egyvote.20at.com:80/article.php?sid=1"

