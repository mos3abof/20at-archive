[[comments]]
order = 2
subject = "اللي نبات فيه نصبح فيه"
author = "محمود يسن طالب حقوق القاهره"
posted = "2006-04-27"
text = "تعرفوا يا شباب احنا بنسطح الدين الاسلامي جدا وبنختزله في ان الحجاب فريضه ولا عاده اجتماعيه المسأله سهله وبسيطه انا اعتقد ان كل مايصون جسد المرأه فهو فرض وعلي فكره البنت في الحجاب اجمل بكتير من غيره صدقونى دا عن تجربه شخصيه والنبي اخر مره نتكلم في جاجات احنا كلنا مقتنعين بيه وتعالوا نتكلم في احوال البلد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123517/http://www.20at.com/article2.php?sid=736"

[[comments]]
order = 3
subject = "سبعة يظلهمالله بظله يوم القيامة"
author = "شذى"
posted = "2006-04-27"
text = "السلام عليكم ورحمة الله<br />انا افضل ان يعود(بتشديد الواو) الاباء ابناءهم على الالتزام منذ الصغر لان هذا امر الله فكلكم راع وكلكم مسؤول عن رعيته والله تعالى يقول :يا ايها الذين امنوا قووا انفسكم واهليكم نارا وقودها الناس والحجارة\".من هنا نفهم انه واجب على الاباء ان يربوا ابناءهم تربية اسلامية منذ الصغر. حتى ينشأ الطفل شاربا الطاعة ويكبر ليصبح شابا نشأ على طاعة الله. وكلنا نعرف الحديث الشريف : سبعة يظلهم الله في ظله يوم القيامة يوم لا ظل الا ظله ومنهم شاب نشأ في طاعة الله. فحقا هنيئا له من التزم منذ الصغر.<br />على انه يجب ان يشعر الابناء بحلاوة الايمان والالتزام وصحيح ان التعود قد يحرم هذه الحلاوة لذلك اذكر مرة ذكر الشيخ محمد هداية حل لهذا وهو ان على الاباء عندما يبلغ ابناءهم ويصلوا الى مرحلة المراهقة ان يلقونهم شهادة ان لا اله الا الله محمد رسول الله ...هنا سيشعر الشاب والشابة بحلاوة الايمان وانه يفعل كل هذه الطاعات من اجل الله تعالى ويشكر الله تعالى على نعمة اهله الملتزمين ثم يشكر اهله على تربيتهم له على الطاعة والالتزام.<br />ارجو من ادارة الموقع تصحيح الايةالكريمة ان كان بها خطأ والسللام عليكم ورحمة الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123517/http://www.20at.com/article2.php?sid=736"

[[comments]]
order = 4
subject = "حب الله"
author = "نور الله"
posted = "2006-04-27"
text = "الحمد لله أن سبب التزامي كان نابعا من قرارة نفسي دون تدخل من الأهل..<br />زهئت من الدنيا لأن الحب فيها يا بيصيب يا بيخيب لكن مع ربنا دايما بيصيب<br />لئيت مع ربنا الحب الحقيقي اللي ياما سمعت عنه في الأغاني والأفلام لكن في الواقع مش موجود ..<br />مع ربنا حسيت بالحب دا أوي يمكن أكتر كمان من اللي كنت بسمعه..<br />الحب في الدنيا بييجي عليه وقت ويتطفي سواء بغدر أو بموت أو بسفر..لكن حب الله لا يموت أبدا بل هو في زياده دائمه(ما شاء الله)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123517/http://www.20at.com/article2.php?sid=736"

