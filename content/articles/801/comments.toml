[[comments]]
order = 0
subject = "فين الملل ده؟"
author = "Strawberry"
posted = "2006-04-26"
text = "أنا مش عارفة فين الملل ده؟<br />الموضوع ده لم يتم مناقشته من قبل على حد علمي بالموقع وموضوعاته ومتابعتي له من يوم ما طلع...<br />الموضوع حلو جداً يا هبة وجديد... هو بس صيغة كلمة الملتزم خلت الناس يفتكروا إنه مكرر الظاهر...<br />وبعدين بجد عيب أوي لما الواحد يتعب في موضوع يقدمه للناس ويجي حد بمنتهى البساطة يشتم ويعيب فيه من غير ما حتى يضيف وجهة نظر جديدة للقاريء أو الكاتب.<br />أرجوكم اكتبوا تعليقات ليها لازمة بقى."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123517/http://www.20at.com/article2.php?sid=736"

