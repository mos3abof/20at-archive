subject = "انا كنت فين"
author = "مسلمه"
posted = "2006-04-30"
text = "مش عارفه انا ليه مشوفتش الموضوع ده قبل كده<br />المهم انا عايزه ان الالتزام عمره ما ييجى بالغصب وده بيكون من الانسان نفسه<br />لو الانسان عايز يلتزم وحزاليه شياطين بعون الله هيلتزم"
archived = "2006-11-02"
