text = "هل تعرف ان القاهرة حازت على انظف مدينة فى العالم سنة 1925<br />وان حى مصر الجديدة حاز على لقب اهدأ وانظف حى فى العالم ايام الملك<br />هذا منشور فى مقال فى جريدة الاهرام اليوم للكاتب عبدة مباشر<br />شفتم حكم العسكر واللواءات عمل اية فى البلد<br />شفتم نتائج تولى لواء اركان حرب رئاسة حى ومحافظ"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019191923/http://www.20at.com:80/masr/7eta-mn-baladi/13750--qq-.html"

