posted = "2008-12-17"
text = "اعتقد كان على جلالة الملكة المعظمة بدل من ان تتابع المسلسلات الامريكية وتكترث لاراء العمريكان ان تهتم بكرامة قيمة الانسان الاردني فما الفائدة ان يعرف العالم الاردن من خلال جلالتها والمواطن الاردي في الواقع مهان ومضطهد الامريكان احقر شعب في تاريخ البشرية ورضاهم غاية لاتدرك فدعوهم الى جهنم"
archived = "2009-08-13"
capture_url = "https://web.archive.org/web/20090813093457/http://www.20at.com:80/20at/eshtbak/10584.html"

[[comments]]
order = 13
subject = ""
author = "كويتى يعيش بأمريكا"
posted = "2009-01-12"
text = "الشعب الأمريكى يا عزيزى من أكثر شعوب الأرض فى التحضر و النظام و التطور و ما تشاهده عنه فى المسلسلات الأجنبية التى تعرض على شاشات التلفزة معظمه غير حقيقى بالمرة فهو شعب ودود جدا و متعاون إلى أقصى حد و يحب بلده بجنون و الأهم أنه شعب يعترف بأخطائه و يتعلم منها ولا يعيش فى الماضى مثل كل العرب و هو بالتأكيد شعب قادر على التغيير فأتى بأسود كان يمكن أن يباع و يشترى كعبد من 100 عاما إلى البيت الأبيض اليوم ولم ينظر أبدا إلى ديانة والده ( الإسلام ) كحجر عثرة فى الطريق إلى البيت الأبيض فهل يستطيع كل العرب اليوم - بإستثناء لبنان - أن يولوا أمورهم لمسيحى أو لبهائى أو لشيعى ؟؟<br />نحن العرب تعودنا دائما أننا خير أمة أخرجت للناس و نسينا أننا كنا خير أمة أحرجت للناس و أما الآن فنحن لسنا كذلك على الإطلاق و المصيبة أننا لا نريد أن نتفهم هذه الحقيقة و نتقبلها و نعترف بخطئنا و جهلنا لكى نتعداه و إنما نتمسك بالماضى السحيق و ننسى أننا لا نملك من حاضرنا ولا حتى التراب و لكننا أمة كلام فقط و ليست أمة عمل للأسف .. و للأسف لا نعترف بذلك أيضا"
archived = "2009-08-13"
capture_url = "https://web.archive.org/web/20090813093457/http://www.20at.com:80/20at/eshtbak/10584.html"

