posted = "2008-11-25"
text = "انا شايف انه كلام عادى مافيهوش حاجه تدعو للسخريه بالعكس يمكن يحمل فى طياته معانى لو فعلا تقصدها يبقى فعلا هى عايشه معنا قضايانا ,, لكن الغريب فى التعليقات وخصوصا تعليق ( ممدوح زكى زخارى جرجس_الاسكندرية -مصر ) اللى بيضحك وباين انه معتبر نفسه مش من ضمن العرب بيسمو بنفسه بأضحكتمونى ياعرب حتى الفاظه تنم عن شئ دفين للعرب , ياريت نحاول نكون ايد واحده واللى شايف انه اسمى مننا يسيبنا ويرحل ولن نأسف عليه ."
