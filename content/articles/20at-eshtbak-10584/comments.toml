posted = "2008-12-13"
text = "انا اوافق من قالوا : يكفي انها تحركت وفعلت ما كانت تستطيع فعله<br />و المدهش انها اعتمدت طريقة طريفة يسهل على الغربيين ومتصفحي الموثع من غير العرب فهمها<br />ومعرفة المغزى منها… وهذا ان كان يدعو الى شيء فإنما يدعو العرب الباقين الى تغيير ماينشرون على الانترنت<br />في المواقع الاجنبية الى ما يعكس الصورة الحقيقية للعرب الحقيقيين<br />وشكرا"
