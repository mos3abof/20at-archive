text = "مش فاهمة بصراحة أقول رايي في ايه<br />يعنى هى ايه الغلط اللى عملته عشان اقول رايي فيه بالايجاب أوالسلب<br />الست بدل ما تطلع تقول اننا ناس كويسة بشكل مباشر<br />طلعت قالت نفس المعنى بشكل ظريف ويوصل للعقول والقلوب بسهولة<br />وبعدين دى بتتكلم على اليوتيوب يعني لازم تكون شبابية وظريفة<br />ياريتنا الناس اللى بتتريق تعرف تعمل عشر اللى هى عملته"
