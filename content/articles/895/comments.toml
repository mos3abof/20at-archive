[[comments]]
order = 11
subject = "لمحمد بية ماهر"
author = "عربى قرفان"
posted = "2006-01-19"
text = "بلاش واللة الكلام الكبير دة مشكلة الاسلاميين انهم عاوزين يبقوا الزعماء واحنا زى الخرفان تابعين ليهم ياريت لو تتكلم عن نفسك انا مش عاوز احارب وحماس بتاعتك دى تحطها فى ...........<br />وبلاش واللة كلام ان حماس حتولع الدنيا مش هما قالوا برضة الكلام دة لما اغتيل الشيخ احمد ياسين . اللة مش هما برضة قالوا الكلام دة لما اغتيل الرنتيس<br />عرفت لية كلام كبير ومافيش افعال<br />لو معلافتش بكرة اقوللك<br />وفى النهاية المصرى هوا اللى حيخلصكم بس بعدين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124743/http://www.20at.com/article2.php?sid=278"

[[comments]]
order = 12
subject = "عمو العربي القرفان"
author = "مصــegyـــري"
posted = "2006-01-19"
text = "عمو عمو عمو ... انت قرفان ليه<br />ايه يا عم عربي<br />مش عايز تحارب .. انت حر<br />سيب اللي يحارب يحارب .. بس متحاربوش انت بأه<br />انت عارف ان حماس نشأت قبل حولالي 50 سنة كمنظمة خيرية تابعة للإخوان<br />مكانش ليها اي دور جهادي<br />لأن حسب نظريتهم ساعتها مكانش شعبهم مؤهل للجهاد او للحرب<br />و بعد 40 سنة كاملة من التربية .. نشأت كتائب القسام .. الجناح العسكري لحماس<br />تضم شبابا صغيرا و جيلا جديدا مؤهل لخوض حرب<br />فعلا انت معاك حق .. احنا ماينفعش نحارب و مش بتوع حرب<br />بس في رأيي ان الاخوان في مصر بيعملوا زي ما حماس عملت قبل كده<br />بيربو ناس تقدر تشيل راية<br />انا فعلا متفق معاك .. المصري هو اللي هيخلص العالم ... بس بعدين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124743/http://www.20at.com/article2.php?sid=278"

