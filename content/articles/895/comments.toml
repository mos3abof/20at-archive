subject = "صراحة منفسنة"
author = "نورا الفوال"
posted = "2006-01-21"
text = "يبدو ان الاخ الصريح اللي فات محروق من الاخ المحاور<br />بس في شئ خارج عن نطاق الحوار والعمل المكتوب والذي ضرب مثال به بالعكس وجدت أن الحوار به جديد خلافا للخبر<br />المهم ارجو من الاخ الصريح ان يكون صريح في شكواه من الكاتب لانه يبدو انهم يعرفوا بعض كويس اوي<br />وياريت عم الصريح يخرج مشاكله النفسية مع المحاور خارج صفحات الموقع<br />امضاء واحدة صريحة جدااااااااااااا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124743/http://www.20at.com/article2.php?sid=278"

