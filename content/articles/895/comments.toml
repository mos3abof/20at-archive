subject = "حماس"
author = "محمد ماهر"
posted = "2006-01-18"
text = "الأخ اللى بيقول العرب كلام بدون أفعال ..<br />أعتقد أنه كان بيكلم على حكومات العرب أمثال الحزب الوطني .....<br />يمكن هو مش واخد باله ان دول حماس اللي على خط النار مع عدوناالأبدي اللي بيضحوا بروحهم كل ساعة علشان اللي زييي و زيك يقدروا يقولوا ان لسه فيه أمل و لسه فيه ناس مرابطين ضحوا بالنفيس و الغالي لرفع كلمة الله عاليا...<br />و سلملي على اتفاقية الكويز"
