subject = "بلاش نكذب الكذبه ونصدقها"
author = "سامي"
posted = "2006-05-04"
text = "على أي أساس بدنا ندمر اسرائيل من الأكتفاء الذاتي اللي عندنا ولا من الجوع اللي بنعيشه ولا من أكل الزيت والزعتر ولا من الفلتان الأمني اللي إحنا جزء كبير منه الكذب خيبه وكما قال رسول الله صلى الله عليه وسلم الساكت عن الحق شيطان أخرس ويا ابو زهري مكنت مندوب عند الوقائي ومكيف وعلى أي اساس بتتذكر اشتغلت مندوب عند الوقائي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124743/http://www.20at.com/article2.php?sid=278"
