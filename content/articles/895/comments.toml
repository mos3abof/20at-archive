[[comments]]
order = 3
subject = "مهرجان القرارة"
author = "على صعيدٍ متصلٍ أكد يحيى موسى- المرشح على قائمة التغيير والإصلاح النسبية، خلال مهرجان انتخابي حاشد في بلدة القرارة بعد عصر الأحد الماضي- أن الانتخابات ستَجري في موعدها المحدد في الخامس والعشرين من الجاري، مشدِّدًا على أن التفاف الجماهير ورغبتها في عملية التغيير ستفشل أي محاولة لتخريب الانتخابات أو تعطيلها."
posted = "2006-01-18"
text = "ودعا جميع المواطنين إلى المشاركة المكثفة في الانتخابات بهدف اختيار ممثليهم للمجلس التشريعي التي ستناط به مسئولياتٌ جسامٌ في المرحلة المقبلة لتحديد مسار وتوجه شعبنا وإنقاذه من حالة الفساد والترهل.<br />وقال إنَّ قائمته لن تعمل على إقصاء الآخرين بل ستحرص على تجميع كل الطاقات من أجل استكمال مشروع التحرير والشروع في عملية البناء والتطوير، مشدِّدًا على أنَّ تحريرَ الأرض الفلسطينية يتطلب العمل المشترك، على جميع الصعد الفلسطينية والعربية والدولية.<br />وشدَّد على تمسك حركته بالثوابت بما فيها الالتزام بهدف دحر الاحتلال وإقامة الدولة الفلسطينية وعاصمتها القدس، وحماية الشعب الفلسطيني بكافة الوسائل الممكنة.<br />وأكد أن ملف الأسرى يمثل أولويةً بالنسبة لحركته ولن تتوانى عن سلوك كل السبل من أجل ضمان الإفراج عنهم بما في ذلك اختطاف جنود صهاينة.<br />كما تطرَّق الشيخ سليمان الفرا في كلمةٍ له إلى تمسك القائمة بالمرجعية الإسلامية وإسلامية فلسطين التاريخية على رأس الثوابت، مشددًا على أنَّ مشاركة الحركة إنما تأتي بالدرجة الأولى شعورًا بالمسئولية تجاه شعبنا وقضيته المقدسة العادلة، وانطلاقًا من الواجب في الإسهام في إصلاح الواقع الفلسطيني بما يخفِّف معاناة شعبنا الباسل ويعزز صموده ويحميه من الفساد، وأملاً في تعزيز الوحدة الوطنية وتمتين الصف الداخلي الفلسطيني."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124743/http://www.20at.com/article2.php?sid=278"

