[[comments]]
order = 5
subject = "هنية: نحن امتداد للإخوان وشعارنا \"الإسلام هو الحل\""
author = "من أهمِ أولويات حركة حماس في هذه المرحلةِ \"التمسك بشعار (الإسلام هو الحل) وتطبيقه على واقعِ الحياة\" مضيفًا: \"أنَّ الإخوان المسلمين في مصر الذين رفعوا هذا الشعار في انتخاباتهم الأخيرة حصدوا ما يُقارب من 90 مقعدًا، ونحن هنا امتداد لهذه الحركة، وسنعمل على تطبيقِ هذا الشعار تدريجيًّا؛ لأنه آنَ الأوان أن يُرفع شعار الإسلام في كلِّ الميادين\"."
posted = "2006-01-18"
text = "وأكد القيادي في حماس أنَّ الحركةَ ستعمل على حمايةِ الحقوقِ الفلسطينية والثوابت الوطنية والإسلامية، وشدد على أنَّ الحركة لن تعترفَ إلا بفلسطين التاريخية من البحرِ إلى النهرِ قائلاً: \"هذه فلسطين التي تربينا عليها وعلى تاريخها أمجادها- وتابع هنية- أن \"نقيم دولة في أراضي عام 67 شيء جميل ولكننا سنتمسك بأمرين ثابتين أولهما لا تنازل عن شبرٍ واحدٍ من أرض فلسطين، والثاني لا اعترافَ بالكيانِ الصهيوني على أرض فلسطين\"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124743/http://www.20at.com/article2.php?sid=278"

[[comments]]
order = 6
subject = "الأزهر: توحد حماس وفتح واجب شرعا"
author = "دعا علماء بالأزهر الشريف \" الثلاثاء 17-1-2006 الفصائل الفلسطينية، خاصة حركتي المقاومة الإسلامية \"حماس\" وفتح، لتوحيد صفوفها كواجب شرعي يفرضه عليهم موقعهم في طليعة المتصدين للاحتلال الإسرائيلي."
posted = "2006-01-18"
text = "وتأتي هذه الدعوة بعد ساعات من تبادل حماس وفتح الاتهامات مع بدء العد التنازلي للانتخابات التشريعية المقررة في 25 يناير الحالي، وتهديد كتائب شهداء الأقصى المحسوبة على فتح بمنع إجراء الانتخابات، وبقتل الناخبين الذي سيتوجهون لصناديق الاقتراع."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124743/http://www.20at.com/article2.php?sid=278"

[[comments]]
order = 7
subject = "حماس موفقة جدا"
author = "اعتبر المحلل والكاتب السياسي الفلسطيني مؤمن بسيسو أن \"حماس كانت موفقة بعدم تضمين برنامجها الانتخابي عبارات صريحة تدعو لإنهاء إسرائيل وتدميرها\"."
posted = "2006-01-18"
text = "وأوضح قائلا: إن \"الرؤى والإستراتجيات التي تتحقق على المدى البعيد لا تُدرج في البرامج الانتخابية التي تخاطب فقط مرحلة زمنية محددة\".<br />واعتبر أنه لا تناقض بين ميثاق حماس وبرنامجها، وقال إن: \"بعض وسائل الإعلام تسعى لتشويه صورة الحركة؛ لخفض أسهمها بين الجماهير\".<br />وحول احتمال تعديل أو تغيير ميثاق حماس أجاب بسيسو بأن \"ميثاق الحركة ليس قرآنا حتى لا يتبدل أو يتغير، وأنا أرى أنه يوما ما قد يتغير أو يتبدل على أن يكون ذاك وفق الرؤية التي تحددها حماس، وبهدف تحقيق مصلحة وطنية للشعب الفلسطيني\"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124743/http://www.20at.com/article2.php?sid=278"

