text = "لماذا لا تدعوا السيدة جيهان سيدة مصر الاولى سابقا الدول العربية الى عقد قمة للرؤساء والملوك واصحاب السمو العرب لعقد قمة فى الم[ *** ]يك فى مستشفى حميات هناك لمناقشة موضوع انفلونزا الخنازير وتأثيرة على الدول العربية ؟<br />اظنة سيكون مؤتمرا ناجحا<br />ولكن بعض الرؤساء سيمتنع عن الذهاب بحجة انة تم توجية دعوة لايران - او ان مندوب حماس وحزب اللة سوف يحضر<br />اعتقد ان هذة القمة ضرورية للشعوب العربية"
