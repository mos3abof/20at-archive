[[comments]]
order = 2
subject = "لو مش عارفة الوقفة ( قعدوها )ا"
author = "Blue Sea"
posted = "2006-01-09"
text = "السلام عليكم<br />أصلا مين قال ان يوم عرفة في شهر ذي الحجة<br />هو في شهر ذي العمرة .. ( طبعا بتريق )<br />لاني بجد اتصدمت .. لو كان السؤال دا لطفل ومعرفش كانت تبقي مقبولة<br />لكن دول شباب .. ولاد وبنات ...<br />يوم وقفة عرفة .. يعني معقول محدش غلط قدامة مرة وقال انة يوم 9 ذي الحجة<br />مش كدة ولا انا مطلخبط ... هو يوم 9 يا جماعة مش كدة<br />اصل بصراحة بعد إللي انا سمعتة مبقتش اصدق اي حاجة تتقال خلاص<br />علشان كدة حروح أتأكد هو يوم اية بالظبط وأرجعلكوا<br />تكونوا انتوا أكلتوا الكحك و انبسطوا ... هو مش العيد دا عيد كحك برضو<br />وبعدين انا سامع انهم حيضموا شهر رمضان وشوال ( علشان بيفكروا يعملوا المسلسلات 60 حلقة )<br />وحيسموة ( تامر ) علي قول مش عارف مين في مسرحية اية<br />ما علينا .. اطمنوا وتأكدوا اي حاجة بتحصل فهي في مصلحة المواطنين<br />وعيد مبارك و عيد سعيد و عيد محمد .. وعيد عبد السلام .. واي حد اسمة عيد<br />يقولنا اسمة بالكامل علشان نحطة المرة الجاية ضمن الأعياد ( ونعملة وقفة هو كمان )<br />وبعدين معلومة اخيرة للناس إللي مش بتتفرج علي الأخبار<br />بعد ما عرفات مات .. مبقتش وقفة عرفات<br />سموها وقفة ابو مازن ... بس لسة محددوش حتبقي انهي يوم في السنة<br />ويفضل انها تبقي في الشهور الميلادية ( علشان منطلخبطش بعد كدة )<br />وكل سنة وانتوا بخير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113702/http://www.20at.com/article2.php?sid=227"

[[comments]]
order = 3
subject = "مدام رانده الابنده"
author = "محمد"
posted = "2006-01-13"
text = "اولا انا مش عارف ان كنت مدام و لا انسه لامؤاخذه الحاجات ديه مش مضمونه اليومين دول و خصوصا من واحده زيك ده تفكيرها و ده ردها ما علينا يا مدام رانده انا شاب قليل الادب جدا بس و الله العظيم بخاف ربنا و نفسى اعمل اى حاجه تقربنى من ربنت سبحانه و تعالى و مش هلاقى اكتر من الحاجات اللى انت بتتريقى عليها لانها بالفعل اهم حاجه فى حياتنا يا انسه يوم عرفه و رمضان العشر الاوائل بحاول اتحرى ليله القدر .اعتكف اخر عشر ايام من رمضان لعل الله يغفر لنا و يتقبل منا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113702/http://www.20at.com/article2.php?sid=227"
