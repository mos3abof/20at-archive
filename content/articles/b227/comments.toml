subject = "لا حول و لا قوة إلا بالله"
author = "واحد معدي"
posted = "2006-01-08"
text = "كويس إنكم حطيتم الملفين الصوتيين في موضوع واحد علشان التاني ينسينا الكارثة اللي في الأولاني..<br />بقى معقولة في ناس مش عارفة يوم عرقة ده يطلع يوم ايه في أيام ربنا؟!!!<br />إنا لله و إنا إليه راجعون..<br />اللهم إني أسألك حبك ، و حب من أحبك ، و حب كل عمل يقربني إلى حبك<br />اللهم ما أعطيتني مما أحب فاجعله طاقة و عونا لي على ما تحب ،<br />و ما زويت عني مما أحب فاجعله فراغا لي فيما تحب.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113702/http://www.20at.com/article2.php?sid=227"

