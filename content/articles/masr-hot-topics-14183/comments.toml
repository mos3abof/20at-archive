text = "لقد اعجبني ما كتبت يا صديقي وايقنت ان مصر ما زالت تنبع بالعطاء مصر ما زالت منبع للفكر والاتزان نعم يا صديقي كثير من الكتاب اهانو مصر وكثير من الفنانين الذين ذكرتهم وان كان لي الحق ان ازيد بدون ذكر اسماء يا صديقي قد يكون لديك بئر من الماء النقي وياتي جاهل احمق تافه يضع فيه نقطة سم لا شك ان البئر يتسمم اعان الله الفلاح المصري اعان الله الشعب المصري على القله السخيفه الحمقى المقدره عليهم"
