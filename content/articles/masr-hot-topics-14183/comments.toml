text = "يا شعب يا جاهل فوق أصحى بتنضرب على قفاك وبرضه مش عاوز تفوق ،دى مسرحية متخطط ليها والسيناريو مكتوب بيد عباقرة الحزب الوطنى علشان يطلع في نهاية المسرحية الابطال يولوحون بأيديهم للجمهور الجاهل الاهبل من أجل الاستيلاء على عواطفهم . فوق ياشعب لم يجدوا إلا الهيافة ( الكورة) كمدخل للشعب الهايف بعد ان إستنفذوا كل أراقهم، الجزائريين غلبونا وربنا نصرهم علشان إحنا إفترينا عليهم كذبا ومبروك على فريق الساجدين المشجعين من الراقصين والراقصات العاهرين منهم والعاهرات ( وكل الاعلام المصرى مأجور) إلا اشرفاء وانا مصرى((((((((((( ((((((((((((((ي ا شعب)))))))))))) )))))))))))"
