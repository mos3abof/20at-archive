author = "عبد الحق- جزائري -"
posted = "2009-11-29"
text = "تحية خاصة لصوت العقلاء و صوت الشعب المصري الذي فيه خير<br />تحية عطرة من الجزائر إليك يارضوه حسن و عيدكم مبارك<br />ولله أعجبني كثيرا مقالك ليس كوني جزائري و لكن من باب الحياد<br />فأنت أضهرت الحقيقة كاملتا و بكل دقة متناهية في سرد الأحداث<br />فهاذا هو الذي يراه كل مواطن عربي بخصوص الاعلام في كلا الطرفين …هذه ال90 ذقيقة يجب أن لاتفرق بين القلوب البيضاء في الجانبين فالجزائر لمصر ومصر للجزائر…<br />لدي كلمة أقولها فقط نحن نعتذر لما بدر من بعض أنصارنا لكن يا أخي هذا شيئ طبيعي لاداعي لتضخيمه ولاداعي للإكتراث بالصحف لأن الصحف إذا عادت المياه إلى مجاريها سوف تتكلم إلا على ذلك الحدث فهي تتماشى إلا مع الأحداث لاغير…<br />فجمهورنا ولاعبينا تعرضوا لترهيب في القاهرة و جمهوركم تعرض لظلم كذلك في السودان …شيئ طبيعي<br />يجب أن ننسى هذا ونوسع قلوبنا لتوحيد الأمة لاللتفرق بينها…<br />أخوكم عبد الحق من الجزائر و هذا إيميلي للتواصل مع أي أخ مصري :hakou0723<br />yahoo.fr<br />وشكرا…"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130043929/http://www.20at.com:80/masr/hot-topics/14183-2009-11-25-18-24-45.html"

