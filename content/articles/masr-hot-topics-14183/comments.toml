capture_url = "https://web.archive.org/web/20100106151533/http://www.20at.com:80/masr/hot-topics/14183-2009-11-25-18-24-45.html?"

[[comments]]
order = 35
subject = ""
author = "المصريين عمماكوا"
posted = "2009-12-07"
text = "اقتباس انا مصرى بس:<br />انا اعتقد ان السفالة بدات من اوباش المصريين لما حدفوا الاتوبيس الجزائرى بالطوب ووكالة الانباء الفرنسية كانت وراء الاوتبيس وصورتة<br />وزادت السفالة لما مسئول مصرى من الامن قال ان الجزائرين هم الذين كسروا الاتوبيس وكان الجزائريون نزلوا من الطيارة وكل واحد معاة شوال طوب<br />انا عشت فى الخارج كتير واتفرجت على الجاليات المصرية فى الخليج وغيرها - بصراحة فية انهيار فى اخلاق المصريين وطباعهم - معروف عند العرب فى الخليج وغيرها ان المصرى يكذب او المصرى كذاب والمصرى منافق وبيقرع كتير وفهلوى ومش بتاع شغل وبيزوغ من الشغل وحرامى كمان<br />ولا اى حاجة<br />اذا كان بتقول المصريين اتضربوا علي قفاهم يابن الفاجرة فانت ليه مستخبي كده وبتقول ان انت مصري<br />مكسوف تقول انك جزائري ولا عشان بلدكوا عراكوا في كل حته<br />ولا عشان اول تحذير لاي حد مسافر برة انه يحذر من البنات العاهرات الجزائريات لانهم بيبيسرقوك بعد ما تظبطهم<br />ولا انت بتقول شعب الجزائر محترم عشان امك منهم<br />من عاهرات اوربا"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106151533/http://www.20at.com:80/masr/hot-topics/14183-2009-11-25-18-24-45.html?"

[[comments]]
order = 36
subject = ""
author = "المصريين عمماكوا"
posted = "2009-12-07"
text = "الواضح ان اللي كاتب المقال ده يا اما جزائري يا اما ابن [ *** ]ه<br />وده واضح وصريح<br />وبما ان الجزائري ابن [ *** ]ه<br />فمش هتفرق ابدأ بقي كلامي<br />اولا العالم [ *** ]ه اللي بتتكلم وبيقولوا مصر محتله يجروا يشوفوا اللي فاشخينهم في بلادهم<br />كل واحد من العرب احنا اللي عملناه من ساسه لراسه<br />وجزمتنا فوق دماغهم كلهم<br />ومش كلام تهييس واذا نسيوا افضالنا عليهم او انكروها لانهم كلاب فممكن نفكرهم بيها تاني<br />وده سهل اوي ومش وقته<br />اما الدسيسه اللي داخله علي انها بتتكلم بصوت وعقل وبتقول الرسول قالكذا وكذا<br />مقالتش ليه ان الرسول قال ان المؤمنين ميرفعوش علي بعض سلاح<br />وان الكلاب دول رفعوا علينا السلاح وبهدلوا اهلنا ورموزنا فالسودان وبالخيانه من غير منكون مدينهم خوانه<br />ولو كنا عاملين حساب الخوانه ومسمعناش كلام ال[ *** ]ين وفاكرين نفسهم عاقلين زيك<br />كنا زمانا فاشخينهم علي ارض السودان<br />وجبناهم مصر<br />وعلمنا عليهم في الجزائر نفسها<br />يادوله كلها عاهرات<br />دوله المليون [ *** ]ه"
