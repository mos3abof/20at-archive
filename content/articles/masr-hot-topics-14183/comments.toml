[[comments]]
order = 5
subject = ""
author = "القومية العربية"
posted = "2009-11-26"
text = "لا يوجد شعب يتلزق فى القومية العربية ويتمسح بها غير المصريين<br />الخليج يقول انا خليجى والمغربى والسودانى<br />الا مصر<br />من الذى اخترع حكاية القومية العربية ؟<br />الذى اخترع حكاية القومية هم مسيحى او المسيحيون فى الشام وقالوا ان ثقافتنا عربية ونتكلم العربية وهذا ضد القومية الاسلامية التى كانت تحكم بها تركيا العرب والعجم<br />وظهر فلاسفة العروبة النصارى ضد القومية الاسلامية ابتداءا من ميخائيل نعيمة وانتهاءا بمشيل عفلق امين العروبة والبعث العربى<br />اذن حكاية حزب البعث العربى القومى هى فكرة نصرانية مسيحية اولا ايدتها بريطانيا وعملت الجامعة العربية فى مقابل الجامعة الاسلامية التى دعى اليها الافغانى والشيخ محمد عبدة<br />والمصريون فقط هم الذين يتمسحون بالعروبة والقومية فى حين انة لا يوجد عربى واحد يؤمن بها<br />المصريون يعيشون على اوهام النصارى بتوع الشام فى مقاومة الاسلام بتبنى العروبة واحلامها<br />فعلى المصريين ان يتخلوا عن اوهام الزعامة والشقيقة الكبرى وكل الكلام الفارغ ويتركوا الكلام للدول الاسلامية الكبرى كتركيا وايران<br />لا تتمسحوا بالقومية العربية فقد ماتت<br />تركيا كانت فى ليبيا الاسبوع الماضى"
archived = "2009-11-27"
capture_url = "https://web.archive.org/web/20091127223622/http://www.20at.com:80/masr/hot-topics/14183-2009-11-25-18-24-45.html"

[[comments]]
order = 6
subject = ""
author = "انا مصرى بس"
posted = "2009-11-26"
text = "انا اعتقد ان السفالة بدات من اوباش المصريين لما حدفوا الاتوبيس الجزائرى بالطوب ووكالة الانباء الفرنسية كانت وراء الاوتبيس وصورتة<br />وزادت السفالة لما مسئول مصرى من الامن قال ان الجزائرين هم الذين كسروا الاتوبيس وكان الجزائريون نزلوا من الطيارة وكل واحد معاة شوال طوب<br />انا عشت فى الخارج كتير واتفرجت على الجاليات المصرية فى الخليج وغيرها - بصراحة فية انهيار فى اخلاق المصريين وطباعهم - معروف عند العرب فى الخليج وغيرها ان المصرى يكذب او المصرى كذاب والمصرى منافق وبيقرع كتير وفهلوى ومش بتاع شغل وبيزوغ من الشغل وحرامى كمان<br />انا طبعا لا اتكلم عن جيل الاوائل من الاطباء والمهندسين والمصريين اللى شرفونا زمان هناك باخلاقهم وادبهم وعلموا الناس هناك ولكن اتكلم عن الجيل القذر الحالى الذى تربى فى عصر القهر والامن المركزى والوصولية<br />الشعب الجزائرى شعب محترم<br />واوساخ المصريين الزبالة اللى راحوا يشجعوا فى الجزائر وانضربوا على قفاهم يستاهلوا لانهم ولاد كلب بتوع الوطنى بتوع معسكرات شباب الحزب الوطنى بتوع المصايف<br />هيعمل اية المصريين للجزائريين بعد كل تلك الهيصة<br />ولا اى حاجة"
archived = "2009-11-27"
capture_url = "https://web.archive.org/web/20091127223622/http://www.20at.com:80/masr/hot-topics/14183-2009-11-25-18-24-45.html"

