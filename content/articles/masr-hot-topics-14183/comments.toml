[[comments]]
order = 10
subject = ""
author = "جيمي"
posted = "2009-11-26"
text = "طب وفي الآخر ده كله في مصلحة مين<br />في مصلحة القنوات الفضائية وزيادة شعبيتها ولا في مصلحة الغرب لتفكيك الدور العربي أكتر ما هو متفكك ولا في مصلحة الحكومتين المصرية والجزائرية علشان تغييب شعوبهم .. بصراحة أنا مش قادر أحدد هو ده فى مصلحة مين بالظبط .. ولا يمكن في مصلحة كلوااااا .<br />الأغرب بقي .. أننا نلاقي ناس المفروض أنهم مثقفين زي يوسف زيدان و الأسواني وغيرهم كاتبين مقالات زفت الزفت .. أنا أقرف أساويها بأو** شوز .<br />للأسف .. انا شخصياً اتخدعت فيهم كمتقفين .. وطلعوا ناس مش بتفهم وناس سطحية تماماً ومن النوع اللى بيمشى مع الموجة علشان يسلك<br />في المترو قالوا أن البصق على الأرض بينقل الأمراض .. فهل الوضع هيختلف لو علي أشخاص ."
archived = "2009-11-27"
capture_url = "https://web.archive.org/web/20091127223622/http://www.20at.com:80/masr/hot-topics/14183-2009-11-25-18-24-45.html"

