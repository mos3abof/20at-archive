text = "اسم الله عليك يا اخينا انت جئت بالمفيد وتضارب الاراء يوحى بالوعي ضمن التعليقات - المعنى ان الناس واعية باللي يدور حوليها - الكرة سيست- والاعلام اصبح عود كبريت لاشعال الغضب الجماهيري -وسؤالي هل لو كانت مصر قد واجهت منتخب عربي اخر بدل الجزائري لكانت الهيصة مماثلة-في رايي<br />المصريون لم يعترفوا بالهزيمة-"
