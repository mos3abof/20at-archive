[[comments]]
order = 33
subject = ""
author = "مواطنة مصرية"
posted = "2009-12-05"
text = "اقتباس محمود:<br />حضرتك ليه مجبتش حاجة من الاعلام الجزائري …<br />الحقيقة الي انا شايفه ان ده رد فعال طبيعي للي بيحصل من اهانة للمصرين من قبل الاعلام الجزائري …عندي سؤال هو الاستاذ مصري ولا مالي<br />واضح انك مقرتش حتى المقال, المقال مش بيتكلم عن الجزائر اصلا, مش مهم يكون الي حصل ده الجزائر ولا تونس و لا حتى الصومال, مصر الي عندها حضارة ثقافية و علمية و دينية مينفعش يكون ردها على شوية همج من اي دولة ان البلد كلها تتحول لهمج, هو انك ترد الشتيمة ب20 زيها هو ده الي يجبلك حقك؟؟ بالعكس احنا ضيعنا حقنا و خلينا شكلنا وحش جدا. قال النبي صلى الله عليه وسلم : ليس المؤمن بالطعان ، ولا اللعان ، ولا الفاحش ، ولا البذيء, لو الرسول ص كان معانا دلوقتي كان وافقنا على الشتيمة دي؟ و لا الصح انه فورا الناس المسئولة الي هنا تحقق في الموضوع و تخاطب الناس المسئولة هناك بالادلة؟ على الاقل كان العالم احترمنا و احنا احترمنا نفسنا… حسبي الله و نعم الوكيل"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106151533/http://www.20at.com:80/masr/hot-topics/14183-2009-11-25-18-24-45.html?"

[[comments]]
