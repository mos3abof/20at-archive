text = "تماما مثل ما حدث مع حزب اللة<br />بعد فترة سيتم القبض على بعض الجزائريون والفلسطينيين وسيعلن ان هناك تنظيما ارهابيا جزائريا يعمل ارهاب ويريد ان يفجر اهداف اسرائيلية على ارض مصر<br />اراهنكم<br />كلها كم اسبوع<br />الموضوع ان خميس فجلة بيكتب السيناريو الان والمخرج بيستعد ولا بد من شد الانتباة"
