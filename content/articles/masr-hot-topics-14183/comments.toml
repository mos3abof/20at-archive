subject = ""
author = "محمد علوان"
posted = "2009-11-27"
text = "اعلامنا هو اكبر اساءة لمصر<br />معظمهم جهلة ولا يفقهوا اصول الاعلام , كلها سبوبة والسلام<br />الجزائر الرسمية هى من اهان مصر والمصريين- مع سبق الاصرار والترصد - ويجب ان يكون الرد على المستوى الرسمى باجراءات واضحة تعيد كرامتنا التى انتهكت<br />قناة الجزيرة لم اعد اشاهدها بعد تغطيتها المتحيزة ضدنا<br />لقد كنت اشد المدافعين عنها وسط اهلى واصدقائى , اما الان ان اعتذر لهم<br />وكل سنة وانتم طيبيين"
