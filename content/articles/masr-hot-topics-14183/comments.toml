text = "الاعلام دا مصري زيه زي اي واحد مصري اتحرق من جواه للي حصلنا … بيغلط احيانا و بيقول كلام صح احيانا<br />بعدين احنا اصلا كرامتنا متهانا في كل حتهبره وجوه الفقير فينا والغني فدي كانت القشه التي قسمت ظهر البعير<br />لكن في سؤال بقى<br />هيا عشرينات بدات تهبل ليه<br />بعدين الي كاتب او كاتبه الموضوع دا هوا الاستاذ منين وهل هوا راضي عن الي حصل …"
