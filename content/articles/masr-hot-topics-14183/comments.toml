subject = ""
author = "اعتذار مصرى"
posted = "2009-11-26"
text = "سينتهى الامر بعناتيل الكلام فى محطات تليفزيونات رجال الاعمال اعضاء لجنة السياسات سينتهى الامر بان ترسل مصر وفدا للجزائر للاعتذار وتبادل العتاب من عينة - عيب كدة تضربونا يا وحشين - الضرب حرام - هو احنا كنا عملنا فيكم حاجة - ربنا على المفترى - واللة العظيم لا نكنس عليكم السيدة زينب - طيب هى شركة اورسكوم عملت لكم اية - ما تسيبوها - البورصة نزلت - احنا زعلنا خالص بس الحزن بتاعنا كان نبيل ومكتوم -<br />طيب نلم الموضوع ونتصالح قبل القمة العربية القادمة فى مارس 2010 فى ليبيا - ويا قذافى تدخل والنبى صالحنا عليهم - وانت يا عم بشير هى الموقعة مش حصلت فى ام درمان - ما تتدخل وتحل المشكلة وتصالحنا على الجزاير<br />كلام كتير<br />اصل احنا بقينا ملطشة وهم<br />ويا جزائريون بطلوا تقولوا اننا بنساعد اليهود فى محاصرة غزة<br />واية رايكم نفتح صفحة جديدة<br />الاسطى بيومى العجلاتى"
archived = "2009-11-27"
capture_url = "https://web.archive.org/web/20091127223622/http://www.20at.com:80/masr/hot-topics/14183-2009-11-25-18-24-45.html"

