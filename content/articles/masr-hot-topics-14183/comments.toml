posted = "2009-12-08"
text = "اقتباس المصريين عمماكوا:<br />الواضح ان اللي كاتب المقال ده يا اما جزائري يا اما ابن [ *** ]ه<br />وده واضح وصريح<br />وبما ان الجزائري ابن [ *** ]ه<br />فمش هتفرق ابدأ بقي كلامي<br />دوله المليون [ *** ]ه<br />اولا في حاجة اسمها لغة حوار متحضر, محدش هنا شتم انت ليه بتشتم؟ ثانيا احترم انه الي كتب المقال بنت و ان في بنات هنا و اختار الفاظك, انت مش واقف في شارع بتتخانق مع بلطجية!<br />ثالثا انصحك تقرا المقال ده و تحاول تشغل مخك شوية : http://dostor.org/ar/index.php?option=com_content&task=view&id=39425&Itemid=1<br />رابعا و دي الاهم, الرسول ص قال ليس المؤمن بالطعان ، ولا اللعان ، ولا الفاحش ، ولا البذيء, رد الشتيمة مش انك ترد بشتيمة اقذر منها لانه ده بيدل على ضعف و انت حتشيل ذنب زيك زيه. الانسان القوي الي يعرف بجيب حقه باحترام لنفسه و غيره, الجزائر غلطت و المفروض انه لينا حق عندها, لكن عمر ما الحق ده يرجع باننا نشتم و بس! الحق يرجع لما نفكر ازاي البلد دي تبقى فعلا قوية و يتعملها الف حساب… و ربنا يهدي الجميع"
