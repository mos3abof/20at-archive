subject = ""
author = "القيادة والعلوقية"
posted = "2009-11-25"
text = "انتم عارفين الديب العلق<br />ايهى القيادة السياسية زية بالضبط<br />يطلع ولادة يهيجوا الناس ويقولوا حقنا وكرامة مصر وحق البلد ويسخنوا الموضوع ويعملوا هيجان وبعدين يلفوا حوالين بعض ويرجعوا يشموا فى خراهم ويتراجعوا ويصمتوا صمت القبور ويطلع ما يقال العقلاء ينادوا بالصلح خير وان دى حتة مباراة وعلاقة الشعبين وكل كلام المسخرة اللى بيقولوة دلوقتى<br />بيتراجعوا دلوقتى وبيبردوا فى الموضوع والجزائر بتشد عليهم<br />اللى يقول كلام جامد وعنترى وبعدين يرج فية يبقى خسيس وابن كلب<br />لا القيادة فى الجزائر اعتذرت ولا ناوية تعتذر وكلام ابن ابلة نعيمة يروح يلحسة<br />وكلة شوية عيال فضحونا فى العالم وضحكوا علينا العرب والعجم<br />وابقى زغرطى يا ست سوسو لانك خلفتى رجالة كل قفا فيهم طولة شبرين"
archived = "2009-11-27"
capture_url = "https://web.archive.org/web/20091127223622/http://www.20at.com:80/masr/hot-topics/14183-2009-11-25-18-24-45.html"

