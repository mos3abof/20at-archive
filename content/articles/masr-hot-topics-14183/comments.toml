[[comments]]
order = 32
subject = ""
author = "سراج"
posted = "2009-12-03"
text = "السلام عليكم<br />الله عليك وعلى هذه الحكم<br />لكن أهم نقطة يجب الإنتباه إليها هي أن الصهاينة قد إحتفلو بالنصر العظيم و هو التفريق بين المسلمين ومحاصرة فلسطين باختها<br />وفي إعتقادي أن مصر الن هي تحت الإستعمار الصهوني مثل فلسطين أو أسوء لأن فلسطين تقاوم أما مصر…<br />وهو مصير كل العالم الإسلامي كل العالم الإسلامي<br />لاحول ولا قوة إلا بالله<br />ومشكور ة ياصاحب المقال"
