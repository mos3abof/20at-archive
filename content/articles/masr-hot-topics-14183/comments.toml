author = "مواطنة مصرية"
posted = "2009-12-05"
text = "اقتباس احمد:<br />مقال متحيز للجزائر بصراحة لية ما علقتش على الاكتبتة الصحف الجزائرية ضد مصر وشعبها ووصفهم باحقر الكلام<br />عيب عليكم كدة كفاية اهانة للمصريين والا كاتب نفسة مصرى وبس عيب عليك الكلام ا لا كتبتة دة مال لو كنت من بلد تانى كنت كتبت اية<br />حيبى الله وتعم الوكيل<br />وهتفضل مصر فوق الجميع<br />واضح انك مقرتش حتى المقال, المقال مش بيتكلم عن الجزائر اصلا, مش مهم يكون الي حصل ده الجزائر ولا تونس و لا حتى الصومال, مصر الي عندها حضارة ثقافية و علمية و دينية مينفعش يكون ردها على شوية همج من اي دولة ان البلد كلها تتحول لهمج, هو انك ترد الشتيمة ب20 زيها هو ده الي يجبلك حقك؟؟ بالعكس احنا ضيعنا حقنا و خلينا شكلنا وحش جدا. قال النبي صلى الله عليه وسلم : ليس المؤمن بالطعان ، ولا اللعان ، ولا الفاحش ، ولا البذيء, لو الرسول ص كان معانا دلوقتي كان وافقنا على الشتيمة دي؟ و لا الصح انه فورا الناس المسئولة الي هنا تحقق في الموضوع و تخاطب الناس المسئولة هناك بالادلة؟ على الاقل كان العالم احترمنا و احنا احترمنا نفسنا… حسبي الله و نعم الوكيل"
