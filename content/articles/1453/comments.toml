[[comments]]
order = 0
subject = "نعم أذكر"
author = "BATISTUTA"
posted = "2006-09-20"
text = "اذكر ذلك اليوم ولكن التفاصيل قليلة ف<br />13 عاما ليست بالفترة الهينة .<br />كنت فى 1/1 ادخلونا حجرة ضيقة وشاهدت اول مدرسة لى فى حياتى وكانت جارتى وقبل دخول الفصل رأيت والدى لأخر مرة فى المدرسة فلم أراه طيلة حياتى المدرسية يأتى لى .<br />بعد ذلك نقلونا الى فصل اخر اوسع وبدأت رحلة الدراسة لا اذكر ماذا اخذنا فى ذلك اليوم ولا ماذا حدث فالايام بعيدة جدا والذاكرة عصية ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144016/http://www.20at.com/article2.php?sid=1243"

[[comments]]
order = 1
subject = "ايام ياريتها ترجع"
author = "بسبس"
posted = "2006-10-30"
text = "كان الموضوع سهل شويه بالنسبه لى لان ماما كانت بدرس فى نفس المدرسه بتاعتىبس بردوا اول يوم كنت عامله ذى التايهه او المخضوضه<br />طول الحصص وانا متنحه رغم ان زميلات ماما كانوا بيهزروا معايا علشان افك التكشيره<br />بس ع مين؟<br />مفيش فايده<br />دلوقتى اقول ايام كويس انها عدت بس لما روحت اجيب بنت اخويا من المدرسه الابتدائى بتاعتها شيلت شنطتها قال علشان اريحها<br />بس الحقيقه كان نفسى ترجع بيا الايام واروح المدرسه تانى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144016/http://www.20at.com/article2.php?sid=1243"
