subject = ""
author = "من الحزب الوطنى الديمقراطى"
posted = "2009-02-21"
text = "انتم فاكرين الضربة الجوية اللى كسحت اسرائيل<br />جلعاد بيتهم القيادة المصرية البطلة باتهامات باطلة<br />يعيش الحزب الوطنى البطل وعاشت رايتة خفاقة عالية<br />كلنا ورائك يا مبارك"
archived = "2009-12-07"
capture_url = "https://web.archive.org/web/20091207040256/http://www.20at.com:80/masr/hot-topics/11366.html"

[[comments]]
order = 1
subject = ""
author = "مش احمد الهواري ولا عبدالله ال"
posted = "2009-02-21"
text = "يعني نقدر نقول كده بالمفتشر انه المرشد العام لجماعة اللقطه الواحدة<br />يعني اسمك وسنك ومهنتك<br />وايه اللي تعرفه عن جماعة اللقطه الواحدة<br />ما هي علاقتك بجماعة اللقطه الواحدة<br />هل سبق لك ان انضممت في جماعة اللقطة الواحدة<br />خدوا يا عسكري على الحجز"
archived = "2009-12-07"
capture_url = "https://web.archive.org/web/20091207040256/http://www.20at.com:80/masr/hot-topics/11366.html"

[[comments]]
