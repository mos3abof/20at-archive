subject = ""
author = "مش حمار"
posted = "2009-02-22"
text = "ايه كلنا وراءك يا مبارك دي<br />عيب با ابني الكلام دا<br />هو احنا في اتوبيس ولا ايه<br />ما يصحش تقول على الريس الكلام الابييييح دا لحسن يعتقلك"
archived = "2009-12-07"
capture_url = "https://web.archive.org/web/20091207040256/http://www.20at.com:80/masr/hot-topics/11366.html"
