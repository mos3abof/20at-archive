[[comments]]
order = 0
subject = "عندى مشكلة وأريد الرد عليها"
text = "أنا من إحدى الشباب البالغ عمرهم 22 سنة . أنا ولله الحمد أصوم وأتقرب الى الله بكب الوسائل الممكنة ولكن الشىء الوحيد الذى يقلقنى ألا وهو ::: أنى بعد الإفطار أتثاقل جدا جدا جدا جدا وفى بعض الأحيان لا أقوم بآداء صلاة القيام وبالطبع رمضان بدون قيام ليس له طعم<br />وسبب ذلك الأمر إنى أعمل نهارا كمدرس فى احدى المدارس الحكومية وأما ليلا أعمل فى احدى مقاهى الانترنت<br />فيا أصحاب الرأى الجليل تفضلوا على بالحل البديل لهذه المشكلة لأنى احزن جدا لفوتى هذه الصلاة<br />من الممكن ارسال أى تعليق على بريدى الالكترونى التالى wael_hussein_1@hotmail.com أو wael318i@yahoo.com"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024131235/http://www.20at.com:80/article.php?sid=682"

[[comments]]
order = 1
subject = "من آرض فلسطين المحتله آختكم هدهد"
text = "لا آنكر آني آحضر مسلسلات عربيه ومنها ما يعرضونه على قناة الإم بي سي وهي الطريق إلى كابل الذي قاطعته لآني رآيتهم بدآوا بتشويه سمعة المجاهدين والمسلسل الثاني الذي كثيراً لا آحضره لآنه في وقت متآخر بالنسبة لي وهو التغريبيه الفلسطينية ...<br />ولكن هل حضوري لمثل هذا المسلسل فيه مضيعه للوقت آحيانا آتحير . ... من ناحية آق ول آن مثل هذه المسلسلات تسعد النفس لآن اهتمام العالم بالقضية الفلسطينية حتى ولو على نطاق مسلسل يجلي النفس ويزكيها من الغضب العارم على العرب كافه"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024131235/http://www.20at.com:80/article.php?sid=682"
