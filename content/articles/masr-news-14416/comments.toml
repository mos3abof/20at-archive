author = "الحل ايه"
posted = "2009-12-15"
text = "المشكلة والحل<br />المشكلة ان ما فيش حاجه اسمها جواز في مصر<br />خلاص الموضوع على ما يبدو انه انتهى خلاص وخلص الموضوع<br />شباب بلا وظايف وبلا شقق وبلا مستقبل وبلا هدف<br />الحل ايه<br />فيه شهوه الان كامنه في نفوس الشباب ولا مؤاخذه شهوه جنسية<br />حد يقدر ينكر ذلك<br />الشباب حيصرفها ازاي<br />افتينا يا نظيف"
archived = "2009-12-20"
capture_url = "https://web.archive.org/web/20091220044120/http://www.20at.com:80/masr/news/14416-2009-12-15-14-50-37.html"

