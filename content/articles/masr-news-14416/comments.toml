author = "كلاب الثورة"
posted = "2009-12-15"
text = "الفضل يعود الى كلاب ثورة 23 يوليو<br />الذين قضوا على الاقطاع<br />و<br />الزواج في مصر<br />ايام الملك فاروق كان كل الشباب بيتزوج والزواج ميسر جدا<br />جم الكلاب فقضوا على الزواج في مصر<br />جزاهم الله بما يستحقون<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-12-20"
capture_url = "https://web.archive.org/web/20091220044120/http://www.20at.com:80/masr/news/14416-2009-12-15-14-50-37.html"
