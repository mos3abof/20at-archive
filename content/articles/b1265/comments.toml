subject = "الله وحده اعلم"
author = "يا جماعة الحديث ليه تكملة و هى بما معناه.. صوموا لرؤيته و افطروا لرؤيته.. فنحن قوم لا نفقه فى الحساب.."
posted = "2006-09-25"
text = "يعنى بالفلك الدنيا تمشى.. و الله و حده اعلى و اعلم.."
archived = "2006-11-02"
