[[comments]]
order = 0
subject = "توحيد المطالع"
author = "معاذ محمود عامر"
posted = "2006-09-24"
text = "لابد أن نتفق على يوم موحد للبداية في رمضان<br />أصل بالمنطق كده<br />مين اللي بدأ رمضان صح<br />أكيد في حد بدا غلط فينا<br />يبقى لازم نعتمد كليا على الحسابات الفلكية لاهنا أدق من الرؤية العادية<br />فالرؤية العادية قد تحتمل الخطأ<br />أما الحسابات الفلكية فنسبة الخطأ فيها ضئيلة للغاية<br />أما الحديث الشريف فلا يعني بالضرورة الرؤية بالعين فهذا تفسير متعنت للنص<br />ولا يغوص الى عمقه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124419/http://www.20at.com/article2.php?sid=1265"

[[comments]]
