[[comments]]
order = 2
subject = "لنكن صرحاء"
author = "قلم جاف"
posted = "2006-09-25"
text = "أولاً : لا يشترط أن توجد علاقة من أي نوع بين وحدة الهلال ووحدة المسلمين.. كما أن فكرة السير حسب دولة معينة في رؤية الهلال أصبحت سخيفة ومستهلكة للغاية ، فالاعتماد على الرؤية البصرية فقط وهو الأساس المعتمد في السعودية صار غير كاف وغير دقيق.. وظهر ذلك جلياً في فضيحة العام قبل الماضي عندما قرر السعوديون التراجع عن هلال ذي الحجة الصحيح بعد عدة أيام من بدء الشهر ليبدأ الثلاثاء بدلاً من الأربعاء في خطوة غير مفهومة تزعزع الثقة في فكرة وحدة المطالع..<br />ثانياً : الشيء الذي يقبل توحيده هنا يا سادة هو أساس رؤية الهلال وليس رؤية الهلال.. وأعتقد أنه من السخف المبين أن نطالب دولة مثل المغرب تبعد آلاف الكيلومترات عن السعودية أن تصوم وتفطر وتحتفل بعيد الأضحى مع السعودية..<br />ثالثاً : ليبيا تعتمد نظرية معينة في الحساب الفلكي دون الرؤية البصرية بالمرة!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124419/http://www.20at.com/article2.php?sid=1265"

