[[comments]]
order = 0
subject = "صدق الله العظيم"
text = "بسم الله الرحمن الرحيم:<br />\"يَا أَيُّهَا الَّذِينَ آمَنُوا اصْبِرُوا وَصَابِرُوا وَرَابِطُوا وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ\".<br />صدق الله العظيم<br />على فكرة أحلى برومو في قناة الجزيرة لما عرفات بصوته وبيوصف الفلسطينيين وهم يسجدون: \"وهم في رابط.. إلي يوم الدين\".. فعلاً جسدي يرتجف.. وبحس ساعتها بقول الله تعالى: \"ألا إن نصر الله قريب\""
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022020330/http://www.20at.com:80/article.php?sid=517"

[[comments]]
order = 1
subject = "البورمو"
text = "هو البورمو حلو جدا فعلا ...بس ليه سيرة عرفات في الموضوع...موش طالبة نكد هيا ...!!!!"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022020330/http://www.20at.com:80/article.php?sid=517"

[[comments]]
order = 2
subject = "السفاح"
text = "ما كنتش أ؛لى من بتاعة الشيخ أحمد ياسين وهو بيقول \"أملى أن يرضى الله عنى\"<br />أنا كل لما كنت أشوفها بعيط"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022020330/http://www.20at.com:80/article.php?sid=517"

[[comments]]
order = 3
subject = "موضوع حلو جدا"
text = "المعركة لها رجالها فعلا وهؤلاء رجال على باب الجنة ... افضل مائة مرة من رجال حول عرفات أو بصراحة هم دول الرجال فعلا"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022020330/http://www.20at.com:80/article.php?sid=517"

[[comments]]
order = 4
subject = "اسد العقيدة"
text = "بسم الله الرحمن الرحيم<br />ان جنود القسام هم جنود عقيدة اسلامية يقاتلون في سبيل الله ورسوله وباذن الله ساكون منهم<br />ليس كجنود عرفات الخائنين وباذن الله سيكون الرد بداية قاسي لامثال عرفات والصهاينة"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022020330/http://www.20at.com:80/article.php?sid=517"

[[comments]]
order = 5
subject = "امنية"
text = "اتمنى من كل قلبي ان تفوز حماس في الانتخابات<br />كتائب القسام هم الاسود,كيف لا وهم ابنا الياسين والرنتيسي والريان وغيرهم من القادة النصر بادن الله علي اديكم يا جنود القسام ويل كل المجاهدين في الشيشان وافغانستان والعراق"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022020330/http://www.20at.com:80/article.php?sid=517"
