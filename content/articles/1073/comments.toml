order = 0
subject = "جانب"
author = "فلسطينية"
posted = "2006-06-11"
text = "الموضوع فعلا موضوع رااائع بكل ما للكلمة من معنى،ولكن لنسلط الضوء أكتر على تركيا يجب ان ندرس ما يوجد في مناهجها الدراسية<br />فهي التي ربت الاولاد على الاوروبية وعلى النهج الاوروبي فلا عجب من تطبعها بطابع الغرب<br />بالنسبة للموضوع فإنه راائع فنحن لم نفكر بتركيا من قبل وتسليط الضوء عليها غير من الوضع الحرج الحالي الى وضع أكثر حرجاً منه<br />مشكككورريييييييييين<br />فلسطينية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131807/http://www.20at.com/article2.php?sid=927"

