text = "العصا الامريكية اذا قديمة جدا ويبدو لي ان الجميع يخشى منها واقصى طموحاتنا الان هو الهروب من العصا الامريكية اما الجذر فه ناسه، موضوع هايل بالفعل وارجو ان نتعلم من التاريخ"
