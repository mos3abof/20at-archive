[[comments]]
order = 2
subject = "طزززززززززززز"
author = "هوووووووووووووبه"
posted = "2006-06-11"
text = "بصو يا بشر انا فيا عرق تركي امي عندها امل لما اكبر اسافر اجبلها الكنز بتاع جدها باشا, تركيا دي بلد محير فعلا لاهي مسلمه ولاهي غربيه , وعلي راي الللي قال مصر قلب الاسلام وتركيا يداه , واكل الاتراك لحم الفرس اكتسبو الشراسه , والمشكله اللي مبتنتهيش الحجاب وعلمانيه الدوله بين الشرق والغرب<br />, وتركيا والعراق , وتركيا والاتحاد الاوروبي , والطززززززززز الشهيره يعني\" ملح \"بالتركي اللي هزت البلد بتاعت الاخوان,\"تشكرات\"علي الموضوع يا كابتن \" بمناسبه المونديال \" والموضوع كبيييير وعايزله قهوة \" تركي \"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131807/http://www.20at.com/article2.php?sid=927"

[[comments]]
order = 3
subject = "مسلمة لحد كبير"
author = "قذائف الحق"
posted = "2006-06-12"
text = "السلام عليكم<br />أنا رحت تركيا قبل كدة<br />أول مرة رحت بلد اسمها أزمير مكنتش حاسس انها بلد مسلمين من بره<br />بس لما مشيت في المناطق الشعبية حاسيت انهم مسلمين وشهم و دمهم و الجوامع في كل مكتن<br />أول ما خلصت شغل في أزمير طرت على اسطنبول في اسطنبول تحس أكيد انك في بلد مسلمة كانوا 24 ساعة بس أخدتهم في الفرجة على البلد ,و الطيارة كانت هاتفوتني<br />تاني مرة كان اسبوع في اسطنبول<br />جوامع جميلة في كل مكان \"الجامع الازرق - الفاتح - السليمانية - أيوب-...\"<br />أيوب ده جامع معمول على اسم الصحابي أبو أيوب الانصاري رضي الله عنه, عندهم زي الحسين عندنا<br />أهم من شكل البلد الناس بيحبوا المصريين<br />مرة رحت أكلت في مطعم قاللي الشاي \"إكرام\" يعني جدعنه من غير حساب<br />و مرة في مطعم تاني واحد قالى إن أخوه حافظ القرأن و جه مصر عشان يتكرم<br />والناس على كل شكل من غير دقن - دقن قصيرة - دقن طويلة- إيشارب -طرحة -نقاب -من غير هدوم<br />أنا رايي غن الناس متفرقش كتير عن مصر بس متحضرين عنناو عندهم نظام<br />اذا أي حد راح اسطنبول لازم يروح التوبكابي ده كان قصر السلاطين<br />سلام<br />أخوكم قذائف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131807/http://www.20at.com/article2.php?sid=927"

