subject = "نحمد الله ان فيها اسلام"
author = "محمد العراقي"
posted = "2006-07-28"
text = "اقول ان موقع تركيا الذي يربطها من الشرق بالدول الاسلاميه و من الغرب بالدول الغربيه جعل عليهاعدة تاثيرات للتغيير من الثقافه و لكن اقول انها احدثت ثورة صناعية لم يشهدها اي بلد نضرا لامكاناتها المحدوده حيث لا تمتلك النفط مثلا و اعتمدت على السياحة التي شكلت عمود الاقتصاد التركي"
archived = "2006-11-02"
