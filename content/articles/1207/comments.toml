[[comments]]
order = 73
subject = "نايك خوات الأردنية"
author = "ديانا كرزون"
posted = "2006-06-29"
text = "الى كل من :-<br />أحمد أبو زيد/وربيع الخلايلة/أبو صخر/رائد عبابنة/حسام العبادي/عدوانيحر/أردني/أردني وبس/العجرمية/باجس الحراحشة/المومني/نايك خوات الفلسطينية/البلاونة/readوكل منيك أردني قرن أخو كحبة أخو شرموطة<br />انتوا يا خوات الشرموطات بتقودواعلى خواتكوا في دول الخليج وفي سوريا وباقي دول العالم فضحتونا يا شراميط ياإولاد الشراميط يا خوات الكحبات<br />بعدينش أنا بنفسي نكت وحدة أردنية بنت عشيرة من المفرق أسمها فلحة وقعتها على زبي شوي شوي وجبت عليها 12 ظهر لما فلختها<br />ولعبت ببزازها لما مصمصتهم وفقعتهم وشلخت كسها وفتحت طيزها هيت وأخوها فارس نكته كمان<br />إحنانيكين خواتكوا وين مكان وكاسرين عينيكوا في أي زمان<br />بكفي الكتلة اللي أكلتوها في الجامعة الأردنية وجامعة الزرقاء الأهلية ولكول كسرناكوا بالعصي وخبطنا على روسكوا مثل الخرفان<br />ولونكوا زلام اكتبو ا عناوينكوا وأرقامكوا على الإنترنت يا خوات الشرموطة<br />إحنا زلام البلد وإاحنا عمرناها<br />وأحلى أبو مصعب الزرقاوي<br />هاهاهااااااااااااااأأأأأأأأأأأأأأأأأأأأاه<br />تفواأأأأأأأأأأأأأأأأأأأأأأأأ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 74
subject = "فلسطيني خاوة"
author = "ابو عبدو"
posted = "2006-07-01"
text = "اولا<br />90 % منكم من اصول فلسطينية واللي بتخلا عن اصلو بيكون بنتاك.<br />ثانيا<br />كل المشاكل بتصير من تحت راسكم وبسببكم اثبت للجميع (( انتو هون بالمنتدى با اردنية دقيتو ببعض بتعرف ليش لانكو منايك و عندكم الشعور بالنقص بدكم تثبتوا وجودكم وما في اشي فالحين فيه بس الطوش )) عمركو سمعتوا بطوشة بين الفلسطينية بالجامعات خليلي ونابلسية<br />ثالثا<br />لو انو في واحد فيكم زلمة كان بتوقفوا بالطوش زي الزلام بس الكل بعرف اول ما تكبر الطوشة يا بهربو يا بضربو غدر<br />رابعا<br />الكل شايف خواتكم و هن بشرمطن بالجامعات<br />يا خوات النايمة يا طراقيع<br />لو انو في واحد فيكم زلمة يا خوات الشرموطة كان بتوقفوا<br />خامسا<br />انتو بتكرهوا بعض<br />بتكرهوا حالكم اهلكم بكرهوكم<br />ليش بتعرفوا السبب<br />لانكم لسى بعقلية العصور الوسطى<br />و غزوات القبائل<br />وعلى الاقل المفروض من طلاب الجامعة الاردنيين اكونوا اكثر تطور اشوى بس المشكلة انكو عدو ( والعدو قبل البدو بالف سنة ) وبضلكم ((((((((((( طراقيع لبن ))))))))))))))"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

