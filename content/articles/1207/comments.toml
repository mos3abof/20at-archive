[[comments]]
order = 60
subject = "إيش في يا إخوان"
author = "بنت عشاير"
posted = "2006-06-18"
text = "يا إخوان مالكم إيش في والله إني بنت عشاير<br />ويمكن مش هالحب للفلسطينية لأنه عمرنا ما رح نحب بعض بس مش هيك ، ليش هالحكي خلي كل واحد بحالو وزي ما حكا السيد خالد إنه كلها عشان البنات طب إذا البنت مش خايفه على سمعتها وأهلها إحنا ليش بندافع عنها يأخواني والله والله ما في بنت مسكينة هاي الأيام كلهم قد حالهم وما في ولا وحده بنضحك عليها، عشان هيك إذا بتكره الفلسطيني إحكيله إنك أردني وهاي بلدك وإنت الأصل بهاي البلد والأردن موجوده من أيام معاوية بن أبي سفيان ومذكورة بالكتب التاريخية وإقرأ عن الأردن كويس وإتحداهم بالحكي الي بجرح أكثر من العصي ، أنا أردنية وما أعاني منه وجود بعض الناكرين للجميل من الفلسطينين الناكرين لدور الأردن الذي فتح لهم أيديهم وأبوابه في حين كان الأردن وضعه الإقتصادي سيء ولكن ملوكنا على توالي العصور حفظهم الله كانوا وما زالوا يشدون على أيدي الفلسطينين ومساعدتهم وفتح المجال أمامهم وتسهيل جميع الأمور هذا ما أردت قوله للأردني حبيب قلبي \"كلنا الأردن\" والفلسطينين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

