[[comments]]
order = 125
subject = "**********"
author = "يعني ايش احكي .. ايش اساوي .. الط عحاكي.. وحياة ربي لولا شوي كنت جاي بدي ابكي .. مقدرتش اكمَّل قراءة كل التعليقات .. زهقت كلو بعيد على بعضو .. اشي بسب واشي بهدِّّي .. واللي كان يهدِّي الوضع فاع وصار يسب ... غصبن عن الدنيا راح نضلنا منحطين .. مش راح نتقدم بحياتنا .. اذا منبقى هيك راح تكبر الامور اكتر ..واكيد اسم الإسلام راح يرتبط بالإرهاب .. انا مش عارفة كيف راضيين عن حالكو هيك.. كيف بتنجرحش كرامتكوا لما حد يقول عنكو ارهابية"
posted = "2006-08-19"
text = "انو جامعة هاي اللي عارفة انو في عنصرية بين طلابها ومش معالجتها.. اذا انتو الجيل الصاعد هيك.. شو ولادكو ... مصيبه اذا بتربو على ايديكو,العالم كلّوا بنهار.<br />الموقع مشبوه في وانتو دابكين تخانقوا بعض , عيب عليكو, تقلبوش حالكو مسخرة قدام العالم..<br />اليهود اخوان الاردنية؟ من وينتا ؟ شو نسيتو مصر وفلسطين وسوريا ولبنان؟ نسيتوا المجازر اللي عملوها فينا .. انسيتو كفر قاسم ودير ياسين؟ نسيتوا صبرا وشتيلا وقانا ؟ نسيتوا النكبة والنكسة وحرب اكتوبر وحرب لبنان والإنتفاضة وغيرها وغيراتها؟ ولكم مجرد انو شخص عربي انجرح لازم الكل يوقف حدو .. مش مهم شو هو فلسطيني والّا اردني والّا سوري والّا لبناني والّا كويتي الخ... مش مهم شو ديانتو مسلم ( شيعي , سني او درزي) , واللا مسيحي .. المهم انو عربي وبس .. اصلن هدف الدول أعدائنا انو يعملوا فينا هيك .. انو يعملوا حرب اهلية بناتنا .. وانتو ولا هون .. فش عندكو حس وطني .. تفرغوش كل طاقاتكو ببعض ,, فرغوها على اعدائكوا .. يا جماعة للي قال انو اليهود اخوانا :<br />اليهود الصهاينة شعب طمّاع .. هاي اخدوا قسم من فلسطين وناوين على كلها ,, وبدهن لبنان ,, واخدو الجولان من سوريا وسيناء من مصر كانت بايديها بيوم من الأيام بس المصريين استرجعوها ... شو باقي بعد؟ بكرا بتقلب الشغلة على الأردن .. اه تستغربوش .. افهموا انو اليهود شعب طمّاااااااااااااااااااااااع بهموش حدا.. وسيعتها عنجد بكونوا اخوانكو اليهود !!!<br />اصحوا يا عرب<br />طبعا اسا اللي بقرأ التعليق .. هاي اذا حد قرأه! اما راح يسب .. او راح يحكي كلام لا اخلاقي بالجنس ,, عادي متوقع هيك نتيجة , اصلن هاد اللي احنا فالحين فيه<br />انا مش فلسطيني , ولا اردني , ولا كويتي , ولا سوري , ولا مصري ..., انا انسان عربي وبس !!<br />إنسان عربي وبس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

