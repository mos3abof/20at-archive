[[comments]]
order = 134
subject = "كلنا الاردن"
author = "العبادي - دبي"
posted = "2006-08-29"
text = "اخواني الاردنيين والفلسطينيين ، لا فرق بين اردني او فلسطيني ، اصبحنا رغم عن كل ما يقال اصبحنا نسايب واهل واعمام واخوال ، واقارب ولكن هناك بعض الاشخاص يدخلون باسماء اردنيه او فلسطينيه وانا اعرف منهم صديق لي من غزه في دبي يدخل باسم فلسطيني اردني يريد ان يوقع بين هؤلاء الاخوه الاردني من اصل فلسطيني ويشعل نار الفتنه بينهم بعد ما اصبح العلاقه اقرب الى الدم وصله الرحم ، انا اردني ومن اصل اردني ، لو عرض علي فتياة العالم وعرضت علي فتاة فلسطينيه اقبل الفلسطينيه بلا شك ، لانني في داخلي اعرف تماما انها قريبه لي ، ولكن اقول لاصحاب الضمائر المريضه ابتعدو عن الاردن ومن يحمل جواز اردني فهو اردني واتركونا نعيش بسلام ، واقول للاردنيين ومن يحمل جواز اردني اعتزوا فقط بجوازكم الاردن وبانكم اردنيين رغم عن اي شي وستجدوا الشعب الاردن العشائري اول من يرحب بكم ويفتخر بكم ، ولكنكم تقولون نحن لسنا اردنيه وهذا سبب المشاكل في الجامعات وغيرها واقول لكم توحدوا وكلنا الاردن ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

