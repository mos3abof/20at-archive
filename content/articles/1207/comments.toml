[[comments]]
order = 19
subject = "ابوعدوان"
author = "عدواني حر"
posted = "2006-05-16"
text = "انا عايد العدوان واقول احنا الاردنية لبعض وكلنا واحد وما لازم نخلي الكلاب يشمتو فينا لهيك اقول ما قصرتو يا بني حسن ويا بني صخر والله شيوخ الاردن انتم ولو نتحد لنغزيهم ونرحلهم من الاردن كلها واللي مش عاجبه هو وملوخياته عالجسر<br />والعدوان والصخور وبني حسن رح يلعنو شرف الواطيين هظول<br />ديانا انتي وحدة عاهرة واذا انك صح زي ما قلتي اعطيني انا اسمك والله غير اخليكي تحملي بتوم<br />وسلامي للاردن والاردن اولا والاردنية شعب الله المختار واليهود اخوانا والفلسطينيه كلابنا دقو على بوابنا مثل الشحادين....<br />وتشااااااااااااااااااو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

