posted = "2006-10-27"
text = "وانااا اقول خوات شرموطة ليش عنيهم قويت لنو زمان ما نكت فلسطينه بس يا ولا د شرطومة هاد اصلكم<br />1: فلسطينه الاردن خون هجرو بلادهم واجو ينتاكو في الاردن اول ما اشتغلو اشتغلو خدم للاردن كانو عبيد يمصون زباب الاردنين<br />2: بنااات الفلسطينين كنت انام مع كل يوم مع وحدة كنت انكه واخر شئ ارمي عليه 5 دنانير وكانت تفرح لزوبي وللمصاري<br />3:ليكم المنايك بخونو بعض بيبعو اختهم للهود خوواتهم بشتغلو عند اليهوود في المستعمارت يعني شرمطة رسمي<br />4: كسمكم على عدد الجنود في العراق وعلى عدد الهنود في دبي<br />5: الي بحب ينتاك يجي على الاميل هاذ والله لنيك امو<br />6: نفسي انيك اخو مع اختو بس المهم اصلكم خوانة<br />7: احناا اوله من اليهوود في خواتكم<br />صٌـــــــٌقـــــــر الاردن"
