[[comments]]
order = 76
subject = "يا عيب العيب"
author = "بنت عشاير"
posted = "2006-07-03"
text = "إلى كل من أخطأ بحق أردني ،،،<br />ما تروحوا على بلدكوا تدافعو عنها بدل ما إنتوا هربانين منها وقاعدين بتتزلمنوا على النت روحوا تزلمنو ببلادكو يا محترمين والله عيب على لحيتكوا كلكو ما عندي ذرة حزن على فلسطيني جوات الأردن وبحترم كل واحد ظل قاعد ببيتو وواجه اليهود بس مات بإحترامه مش مات لأنه كان بفعفط وإنكتل بقنوه ولا موس<br />عيب عليكو إنت لحم كتافكوا من خير هاي البلد والي ما بعرف أصل هاي البلد يروح يقرأ عنها وبرعف شو أصلها بعرف إنه من أيام معاوية كانوا يجمعوا منها خراج\"ضرائب\" للي ما بعرف لغة عربية فصحى وكانت مذكورة بالإسم بلاد الشام كان إلها ديوان والأردن إلها ديوان وكان إلها والي لحالها يا أهل التاريخ يلي بتحكوا عن التاريخ إقرأوا بتمعن منيح منيح بتعرفوا أصل بلادكو وبلادنا وهذا الحكي مذكور في مقدمة إبن خلدون والي حاب يتنور أكتر يحكي نص كلمه عشان أكمله تاريخ المملكة الأردنية الهاشمية .<br />تعلموا وإحكوا لأمثالكم شو تاريخ الأردن يلي بتغلطوا عليه والي بتكاكوا من خيره ولكم روحوا شوفوا الفلسطينةالي مش صاحلهم الهوية الأردنية شو صاير فيهم وإحمدوا ربكم إنكم معكم هويات هادا إذا كان معكم هويات تعطيكم شخصية ملموسة قثدام الناس لأنه لولا إسم الأردن إنرفع فوق روسكو وإنكتب فوق إسم كل فلسطيني بهالبلد كان زمان متشعتلين ونتوا عارفين كيف بتكونوا متشعتلين لأنهشايفين غيركوا شو صاير فيهم عشان هيك كل واحد يحترم حاله ويحمد ربه على النعمه الي هو فيها ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 77
subject = "ولي يا بنت العشاير يا شرموطة"
author = "ديانا كرزون"
posted = "2006-07-03"
text = "ولك يا كجبة يا شرموطة يا منتاكة يا مشلطة يلي بتنامي كل يوم مع واحد وبنجاب عليك 12 ظهر كل يوم وبتنامي نع الفلسطينية بين أحضانهم وعلى زبابهم<br />إحنا لوإنولدنا في فلسطين يا شرموطة كان جاهدنا فيها حتى متنا على أرضها وإحنا زلام مش على النت وبس ووين مكان وإفتحولنا الحدود بنروج بنجاهد في فلسطين ما بنظل هون ولا دقيقة<br />و90% من سكان الأردن من أصول فلسطينية<br />وإحنا اللي عمرنا الأردن بذراعاتنا وتعبنا وشقانا<br />فهمت يا شرموطة بدي أنيكك أعطيني رقمك الخلوي<br />أو ناديلي أخوك علشان أنيكو كمان<br />ترى مزبرتة معي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 78
subject = "ديانا يا واطية"
author = "ابن الزواهرة"
posted = "2006-07-03"
text = "يا ديانا اذا كنتي بنت او شب مخنث لانكم كلكم زي هيك<br />انتم صحيح شغل حكي عالنت ولك البنت بتحكي معك بالزوق ليش الغلط<br />وبعدين مين قال ان الحدود مسكرة الحدود فاتحه بس انتو الجبناء اللي فليتو وتركتو اهلكم غاد وبعتو اراضيكو لليهود انتم ما بتروحو غاد الا مشان تقبضو حق ارض او تدل على قرابتك ويذبحوه اليهود<br />جاوبني مين دل على نص مجاهدين فلسطين غيركم انتم واخذتم الثمن اولهم يحيى عياش ابن خالته اعطاه الخلوي الملغوم اللي فجر راسه والشيخ احمد ياسين مين حطله المجس بكرسيه المتحرك وخلا المروحية(الاباتشي) تضربه وهو طالع من صلاة الفجر بدك كمان طيب اخر واحد مات محمد ابو سمهدانه مين اللي دل عالمكان اللي هو فيه وفجروه اليهود مهو واحد منكم من جيرانه يا حرام كان امأمن له<br />عيب الحكي بعدين مين اللي بحكي انكم عمرتوا الاردن ؟ طيب ليش بنشوف فلسطين كلها وسخ ولا فيها ولا عمارة زي عمارات الاردن؟ ليش بتعمرولنا عمروا خراباتكم اولا وبعدين عمرولنا<br />طيب ما اقتنعتوا ؟ ليش المخيمات شكلها زي هيك؟ فيهاش اي اردني كلها كلاب منكم شوفوها يا اخوان كلها ريحتها طالعه ومجاري فايضه ودعره علني بالشوارع اول ما بنطو عبعض!!!<br />ليش ما تعمروها بعدين عمرولنا ههههههههههههه طبعا مش طبيعي الحكي ولا حكي ناس بفهموا<br />اخ ديانا لاني بعرف انك شب اذا كنت مش زلمة فعفطة(لانكم زلم عالنت) اعطيني تيليفونك وعيب علي اذا ما طلتك وبنشوف الزلمه فيكم<br />وتحيا الاردن قيادة وشعبا والاردن اولا<br />تحياتي الــــزواهـــرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 79
subject = "اتينشين بليز"
author = "احمد المومني"
posted = "2006-07-04"
text = "السلام عليكم جميعا<br />اول شي الله لا يمسي كاتب الموضوع بخير لانه ساس البلا هوه .. وبعدين بطلب من اخواني ولاد العشاير والحمايل الاحرار الاردنين ما يشمتوا حدا غريب فينا وما في داعي ننشر غسيلنا قدام حد غريب.<br />الحكي الكثير ما راح يجيب نتيجه..خليهم ينبحوا للصبح ,هذول اللي تكلموا من الفلسطينين ما بمثلوا غير حالهم وطريقة حكيهم بتدل على انهم ولاد شوارع فعلا,ومافي داعي نغلط على كل الفلسطينين عشانهم.. واحنا مش ولاد شوارع لذلك ما في داعي نجاريهم بالسقاطه,اذا في حد منهم عنده استعداد يكون بني آدم وحاب يناقشني مناقشة بالحجج والمنطق ويفرجيني ليش هم احسن منا وشو عملوا للاردن وكيف هم بفهموا اكتر منا وكيف احنا حمير ما بنفهم يحكي معي بعد كم يوم بس ارجع من الاجازه على رقمي وانا عندي استعداد اروحلوا وين ما بحب وهاد رقمي يحكي معي بعد تاريخ 8/7 ..\"0799871042\" .. انا مابهدد ولا بحكي راح اعمل واسوي بس يا اخي بدي افهم كيف عمرولنا بلادنا وشو السر انهم بفهموا وحنا لا! على الله نصير نفهم متلهم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 80
subject = "يا إبن الزاهرة يا أخو الشرموطة"
author = "ديانا كرزون"
posted = "2006-07-04"
text = "يا إبن الزواهرة يا قرن يا مخنث يلي بتنتاك من الفلسطينية كل يوم ونفسي أنيكك لو أشوفك يا إبن الكحبة يلي بتقود على خواتك في دول الخليج<br />إحنا زلام وين مكان وفي كل زمان وكاسرين عينكم إنتو واليهود ، بكفي عملنا اللي ما قدرتوا تعملوا من عمليات فدائية جهادية<br />وبرجع بقلك الحدود مسكرة وصعب نروح للضفة لأنه جنسيتنا أردنية مش فلسطينية<br />وإحنا اللي عمرنا البلد ونورناها يا أخو الشرموطة والدليل على ذلك شركة فاست لينك<br />وموبايلكم وإكسبرس والمطاعم السياحية وفنادق الرويال والراديسون والديز إن ومكاتب السياحة وغيره وغيراته حتى الوزرا معظمهم فلسطينية في هالبلد<br />وبعدين ما بنكر إنه في منا خونة لليهود الي دلوا على يحيى عياش وأحمد ياسين والرنتيسي وعلي مصطفى<br />بس لو أعرفهم هذول الخونة لأنيك عرضهم<br />عرفت يا راعي الغنم يا بدوي يا مقطع يلي بتنام وبتخرى في الصحرا وريحتكم بتكتل لما الواحد يحكي معكم ريحتكم صنة حتى لما نزوركم في بيوتكم إشي بخزي<br />الله يخلف على الفلسطينية اللى علموكم كيف تعيشوا وكيف تتنجروا وكيف تحكوا<br />فهمت يا خرا إنت وصاحبك المعوق أحمد المومني اللي مش فاهم شو بيحكي<br />وأنا زلمة وين مكان وهذا رقمي الخلوي<br />0777344970 واي بدو يشوفني في أي مكان يحكي معي وبجيلوا لو كان في حضن أمه<br />يا خوات الشرموطة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 81
subject = "لا للعنصريه"
author = "العرب"
posted = "2006-07-04"
text = "بصراحه نلاحظ ان العنصريه قد تفشت في مجتمعنا والتي تؤدي الى خلق الزعزعه في وطننا الغالي ومن مظاهر الزعزعه ما يحصل في جامعاتنا من الهوشات بين الطلاب وبين الطالبات لكن لنكن على علم انا الاردن اولا يا همل ويا حوش ما في حدا عاقل لأنه تحت كل مشكله كمشة بنات ما بتستاهل و انت يا ديانا كرزون المخنث اذا وصدف لمحتك راح امسح فيك اوسخ مخيم في الاردن عشان تعرف انه البلجيكيه هم قذاره اقذر من الكندره الي رميتها من 18 سنه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

