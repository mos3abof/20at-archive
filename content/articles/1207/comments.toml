text = "يوم الخميس إتصلت مسؤولة في نهر الأردن مع محمد الوكيل وطلبت منه مساعدات مادية وعينية ومعنوية من الأفراد والمؤسسات عشن شعبنا في لبنان وغزه ،،، ما بعرف إذا لازم أحكي إني إتطوعت وإني ناويه أتبرع إنشالله ولو بمبلغ بسيط عشان الناس الي هناك الطريقه سهلة كتير إتصلوا بنهر الأردن وإحجزوا عشان تقدروا تشاركوا معهم بالحملة إشي كتير حلو تخيل إنك عم تحجز عشان تقدر تتطوع ... تخيل قديش شب وصبية موجودين في نهر الأردن بساعدوا موظفين نهر الأردن عشان عمل خير...<br />توكلوا على الله ..."
