[[comments]]
order = 105
subject = "يا خساره"
author = "رعد/ بني صخر"
posted = "2006-07-24"
text = "اولا السلام عليكم ورحمه الله وبركاته<br />صدقا انه انا اتفاجات بالردودالي قراتهامن مسبات وتعليقات شوف خلينا نحكي الصح والاصول انا اردني والي الفخر ومن القبائل المعروفه بالاردن وانا ما احكي هيك حكي حتى امدح قبيلتي لا بس الواحد يعتز باصله.الموضوع انه في عنصريه كثيره بين الاردنيين والفلسطنيين ويا ريت انه اذا في وجه مقارنه بين هالشعبين تكون بغير المسبات وعدم الاخلاقيات والي من الاخوه الفلسطنيين يعيب العشائرنقول له انه لما يصير مع احد منكم اي مشكله تستدعي الامور حلها تذهبون الى شيوخ العشائر من اجل حلها هذا على سبيل المثال وايضا لا ننكر انه انتم متعلمين وايضا عندكم اموال وهي ليس مقياس كبير ولكن كل هذا اتجاكم على حساب اشياء كثيره المهم الكل يعرف ان الاردن بلد الخير باهله النشامى ويكفي انه انكم تنامون مرتاحين البال والي يقوم بالسب والشتم على البنات والشباب بالفاظ قذره هذا لا يعبر بالرجوله بشيء واتمنى من ابناء العشائر الاردنيه عدم السب لانه هذا الكلام ليس لنا ابدا ولا حتى نعرفه وهو كبير على لسانناان نقوم يالشتائم السيئه واخيرا اتمنى من كل شخص عنده الكبرياء والكرامه بعدم الشتم على العشائر وعلى الكل لانه كل شخص في هذا البلد يعرف قيمته وان المسبات لا تقلل ولا تزيد من قيمه الشخص<br />هذا ايميلي raad_002002@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 106
subject = "للأخ واحد"
author = "بنت عشاير"
posted = "2006-07-24"
text = "بس بدي تركز بالحكي الي بحكيه انا العجرمية وركز ونتا بتقرأ أوك ركز كويس شوف يا ترا في وحده فينا غلطت أو وسخت بالحكي أو حتى سبت على حدا فلسطيني أو عربي وخصوصاً أنا ويا سيدي ولو بدر أي كلمة ما عجبت حدا بالقراء أنا بعتذر عنها بس أنا متاكده إني ما غلطت بحد على السايت ولا غير السايت. وفي كل الأحوال حبيت أحكيلك إني بعتز إني طالعة من ورا الغنم زي ما بتقول لأنه لولا هيك ما كنا عرفنا قيمة الحياة هسا وتمنيت لوني أعيش بالصحرا ولو أسبوع واحد تخيل لوين انا قاعده بتمنى يعني لو كنت عايشه بهداك الوقت الي كان عايش ابوي فيه ورعيت غنم كان احسنلي بكثير من إني أعيش بعمان أسمع حكي طالع نازل مع العلم إني من الأردن مش من بلد تاني وبتمنن على الناس الي من البلد إني عايش فيها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 107
subject = "السلام عليكم ورحمة الله وبركاته الله يهديكو"
author = "فلسطيني من خان يونس"
posted = "2006-07-25"
text = "احيني يا اولاد الستة وستين شرموطة ،،، ياللي امك مبغية وبتنتاك في اليوم تلات مرات قبل الاكل وبعده.<br />ولكو لولانا يا الاردنية كان زمان اسرائيل حاطة زبارها في طياز خواتكو فردة فردة<br />ملعون ربو ملك الاردن تبعكو ،، ولكو ابو عمار كان بنيكو كل ما يزور الاردن<br />وانا زرت الاردن يا شراميط ،، اكبرها قحبة من عندكو كنت انيكها بدينارين وتشتريلي منهن علبة دخان وجزازة بيرة<br />يلعن ربكو من شعب هامل<br />واخر كلامي ان الحمد لله رب العالمين اللي ما خلقني اردني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 108
subject = "الشعب الهامل بياع بلادو"
author = "عبادي الاردني"
posted = "2006-07-27"
text = "الله يفظع عرظ كل واحد فلسطيني و خصوصا الي من خان يونس<br />ولك هو انت مكيف على ابو حمار تبعكو يا اخو الشرموطة انت و احسن فلسطيني<br />ولك مهو كل قحبات البلد من اصلكو يا عديمين الاصل و الشرف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 109
subject = "الاردنيه هههههه اسم مضحك"
author = "ساكتب على مشنقتي يكفيني اني فلسطيني"
posted = "2006-07-29"
text = "اول شي بحب اذكرو انو الاردنيه الي قاعدين بغلطو على الفلسطينيه ما ينسو حالهم ويطلع كل واحد على اصلو<br />والي مش عارف اصلو انا رح اشرح شوي على اصل الاردنيه بدون زعل<br />اصل الاردنيه هم البدو ومعروف ان البدو ولاد شرموطه<br />والاردنيه عباره عن صحراء قاحله ولولا زباب الفلسطينيه كان لسا زي ماهي<br />بعدين عندك الشباب الي بالاردن انا كنت من فتره بعمان وتفاجات بشخله انو الشباب صارو ينتاكو اكتر من البنات هدول الي بحكو عن حالهم زلام وهما بنتاكو ورجوني شو بتعملو يا ولاد الشرموطات العاهرات الداعرات يا ابناء القحبه ولكم نازلي تغلطو على الفلسطينيه كس اخت احس واحد اردني اخو منيوكه اصلا انتو شو لولا زب الفلسطيميه روحو طلعو على بناتكم بالجامعه كيف كل وحده كسها مفتوح اكتر من التانيه<br />انتو ليش مقهورين من الفلسطينيه لانهم ما بوطو راسهم لحد ومش قابلين يردو على دولتكم ونازلين نياكه بنسوانكم<br />ولك هاتولي واحد اردني بسترجي يرفع راسو ادام فلسطيني طبعا بسترجيش لانكم بتخافو ان شاء الله بدي انيك كل بنات الاردن بعد ما ارد اطلع على الاردن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

