subject = "وين الاخلاق الاسلامية"
author = "ناصر الدين الاسلامي"
posted = "2006-09-16"
text = "السلام عليكم ورحمة الله وبركاته<br />قال الرسول الكريم محمد(ص)ألا أدلكم على شيءفعلتمه تحاببتم في مابينكم//افشوا السلام بينكم//صدقت يارسول الله .كلكم عرب والعدو لايفرق بينكم من اين تكونوا.فلسطيني او أردني اوسوري -ان هذه الخلافات صنعها العدو بينكم ويجب تجاوزها.اخيرا اهديكم سلامي لكل عربي يجري في دمه حب الاسلام وغيرته على الاسلام<br />اخوكم من سورية خااااااااااالد"
