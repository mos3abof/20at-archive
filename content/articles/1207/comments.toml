subject = "لازم الحل"
author = "شيرين"
posted = "2006-09-04"
text = "انا بدي احكي هالقصة أنا شيرين طالبة في جامعة اليرموك بصراحة انا الي قرابقه كثيرة في الجامعة اللي صار معي كان في شب بينظر الي بشكل مستمر وبيوم حكالي انو بدو يشوفني بعد المحاضرة الاولى ولما طلعت حكالي ممكن نجلس لوحدنا وما حد يشوفنا (في حرم الجامعة ) جلسنا في مكان بعيدعن الانظار وانا جالسة معاه علة العشب والا بمد ايده على ثديي وبطحني على الارض وحكالي بدي جنس منك بعدين مسك سحاب البنطلون وفتحه وحط يده على فرجي وصار يدعكلي فيه وبعدها انا كنت بحاجة جنسية لانو اي بني بتحتاج ذلك لكن بالحلال وبعدين شلحني البلوزة وشال الصدرية وصار يمارس الجني معي حتي فقدت شرفي مع قدوم شب من عيلتي ضربه وثاني يوم التمو عليه وضربوه باختصار كل المشاكل من ورا الجامعات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

