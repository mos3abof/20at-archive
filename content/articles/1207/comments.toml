text = "يعني ممكن أسالك ليش المسبات 100% حكيك صح بس ليش تسب يعني ولو بده حدا يقرأ الحكي ببطل بده يكمل القراءة أو يسمع وجة نظرك من الحكي السيء الكلمة الحلوة طالعه والعاطله طالعه طب إحكي كلمة منيحه ونتا أردني يعني كل كلمة محسوبه عليك وعليناومش حلوة بحقنا لما نعطيهم مجال يستفزونا بكلام قذر<br />والله بعز علي ولاد بلدي يوصلوا لهاي المرحلة . وبس"
