subject = "ياعيب الزلم"
author = "عربي"
posted = "2006-07-20"
text = "بالله عليكم مابتستحو على حالكم ولكم عيب استحو انا فلسطيني ومرتي اردنيه ابني بيحكي الي يبابا ولاامه يماما ولكم صرنا انساب واصهار ولكم ظبو حالكم عشان هيك ربنا ماحي البركه من حياتنا شو يعني اردني وشو يعني فلسطيني ولكم صار دمنا واحد وعرضنا واحد ولكم بنتي لما تكبر عمامها فلسطينيه وخوالها اردنيه لو حد تعرضلها بيدافعو عنها اعمامها واخوالها يعني الفلسطينيه والاردنيه اتقو الله وعيشو بادب واحترام كلنا ولاد ادم وحوا والله لايبارك في الي فاتح هالموقع"
