text = "انت يا وقح يا حقير يا اللي اسمك ربيع الخلايلة أو بالأحرى ربيع الخرايريه<br />لازم يا معتوه تحترم حالك أحسنلك يا الله شو مقهورة منك . يعني مش عيب عليك يا قليل الأصل تحكي عنا احنا حثالة يا مجاري انت.. ولك احنا اللي بندعس على راسك وعلى راس اللي خلفوك .. ريته وجع يخلع راسك .. وحبك البرص قال بتحبلي شارون يا عرص... روح الاهي يصيبك داء متل داء شارون ما تشفى منه يا بعيد.. اخ لو أطولك والله لكنت عضيتك بسناني... بتحب توسخ اسم عيلتك : ليك الواوا ليك.روح انضب في بتك وبيض"
