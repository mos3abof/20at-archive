text = "ولا انته وهوااااا اسمعوووو اتطلعووو من وين انتو صرتو زلام من وراة زبابنة يا منايك وربي كل سهرة بسهرة بفت على خواتكم راتب الشهر بس ابي اسمع كل ابن شرموطة فلطيني راح احط رقمي واتحداةةة ازعلم فلسطيني منيك يقول انا بحب انتاك من ابو شوبك<br />يا ابن القحبة لمة ندخل مخيم ونطخ طلقة ولا ابن شرموطة من طنطات يظلي واقف في الشارع<br />ندخل نيك احلا شرموطة فلسطينية واشرفهن اذ كان هنااااااااااك شريفاااااااات وانا اقول كس ام ازعم فلسطيني على زوووووووبي مناجة<br />وشرفي وشرفي وشرفي لنيك رب الزعيم<br />0777442276 وهاذ رقمي والي يحب يلتعن تعريص خواتوووو يتفضل يدق على الرقم<br />بس ابي احط معلومة على الكل اذ كنت اردني افتخر واذ كنت منيك فلسطيني انتحر لزوبي وكس امك يا فلسطيني<br />مع تحياااات صٌـــــــقــــر الاردن<br />جمعة الشووووابكةةةة"
