[[comments]]
order = 103
subject = "شباب مثقف"
author = "واحد"
posted = "2006-07-22"
text = "صرت زلام هسه سباتو ونيكتو ولعنتو شاطرين!!!<br />اصلا احنا ماوصلنا لهذا التخلف الا من ور هيك جيل متخلف<br />فرحان الواحد فيه انو من قبيله كبيره وثلث ترباع القبيله حوش ومتخلفين<br />مفكرين انكم مشبعين الفلسطينيه ولكم لولاهم لكانت الاردن بدو ورعاة غنم في الصحره هم الي جابولم مصاري وعمروها وبعدين صرتم تسبوهم وبدكم تطلعوهم بره الاردن<br />اليوم فهمت بعد هذا النقاش معنا القوميه والعربيه والاخوه صرتم ببساطه زي النازيين وهم احسن منكم<br />يا ريت هتلر خرق العرب بدل اليهود لانهم طلعه امثالكم جيل شاطر يسب ويلع ومفكر حاله شغله<br />اصلا يا كلاب الواحد فيكم شاطر بالحكي والتباهي بالقبيله<br />اصلا انتم سبب مجيئ الفلسطينيه للأردن باعت الثوره العربيهالكبرى فلسطين عغشان تحصل على الاردن (الله اعلم مين قائدها) مفكرين انه تم قتال من العرب عشان فلسطين هاي لعبه ساذجه والكل بنفسه عارفها<br />ومعركة الكرامه الي من اول ابتدائي وحن بنقرا بسالة الجيش فيها كانت بمساعة الفدائين وعلى ايده جاء النصر ايد بايد مع الجيش شايفين الاخوه شو نتائجها<br />حرام تروح ثورة الشباب على شئ فاضي<br />كلنا ولاد ادم وما حد احسن من الثاني<br />شاطر الواحد فينا يحكي ان ابن فلان من العشيره الفلانيه وما بعرف ان قيمة النسان مننفسه مش من عشيرته<br />صح الواحد بفتخر باصله بس مش هيك<br />احنا لازم نكون اكبر من هيك وارجو ان يكون هنالك لباقه في الكلام في بنات اردنيات في النقاش زي ما في بنات فلسطينيات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

