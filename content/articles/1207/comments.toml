[[comments]]
order = 71
subject = "يا ابو شمر"
author = "سلطان المبروك"
posted = "2006-06-27"
text = "اخوي ابو شمر مين انت حتى تقسم العشاير الاردنية<br />1من قلك ان بني حسن من القدس اول شي احنا طول عمرنا من بدو الاردن واللغه والشكل والاختلاف بين بني حسن والقدس واضح<br />2 العبيد هم اللي انضمو لاهل شمر اللي ما يتجاوز عددهم الاصلي 2000 شخص والدليل انكم عبيد سود اصلكم من الحبشه واثيوبيا وافريقيا<br />3عشاير الاردن كلها شيوخ وما حدا منهم اصله فلسطيني والحمد لله كلنا نفخر بذلك<br />4 بني حسن عددهم 5000الف نسمة اي نص مليون مش معقول يكونو كلهم مش من اصل واحد ولا ما يكونو اكبر عشائر الاردن<br />5 اخوي لا تقول عن حالك فهمان مع عدم احترامي لشخصيتك القبيله هي تجمع فخذ من افخاذ العشيرة في مكان واحد وهو مصطلح لحياة البادية اللي شكلك ما عرفتها بيوم يا كلب<br />6 من متى السعوديين يفهموا والدليل انك دارس 5 سنوات مع ان دراسة الجامعه 4 سنوات بس انت معذور اخذتها بخمسة لانك حمار (سعودي)هيك نسميكم بالجامعه<br />7 اصل عشائر او بدو او رعيان السعوديه بقايا حجاج وكل الخليج ييقنو بذلك ونصمك يعترف<br />8 انت شكلك ابن السايق الهندي اللي بوصل الوالدة او الحجة كان يوصلها ايام العز وبالزبط على طريق الملك فهد انت تعرفه وانا اعرفه نصمك اولاد هنود او اولاد الي بيشتغلو هناك من مصاروة ولبنانيين واردنيه<br />9 احترامي للاردن وزقيادته وشعبه وعشائره ولا تخلو كلب راعي عبد خليجي يحكي ويخرب بن الاردنيه الاخوان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

