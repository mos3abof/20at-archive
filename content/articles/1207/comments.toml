subject = "اسمعوا"
author = "ابن الزواهرة"
posted = "2006-06-25"
text = "يا اخوان السلام عليكم ورحمة الله وبركاته:<br />ليش المسبات كل واحد صاحب وجهة نظر لكن الراي الاخر يحترم ولا يؤخذ به<br />وانت يا اخي مين قالك تشتري الاردن وترمونا شو احنا بنمثل فلم هندي ولا بنحكي على دلم ارض عيب الحكي وكلنا بنعرف بعض ويوم تقع حرب الفدائية مرة ثانية تجيك علومها ويكفيك شرها<br />توكل على الله واستغفره وفالتقل خيرا او لتصمت<br />هذا جزا اللي يوقف معكوا؟ ليش انتم دون العرب تقابلوا الاحساتن بالاساءة واذا واحد حزن عليكو وباعكو قطعة ارض بتحكو عليه؟؟؟<br />عيب عيب وحبايبي الاردنيه المنتدى مش لله بينزل مسبات للفتنه ديرو بالكو من مشرفين اخر زمن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 69
subject = "شمري و عقالي مايل"
author = "ابو شمر"
posted = "2006-06-27"
text = "اول شي انا لا اردني و فلسطيني انا درست بالاردن 5 سنوات وعرفتها ... وهذا انطباعي ....<br />1-القول ان العشائر الاردنية بدو ولها اصول فهذا كلام مغلووووووووووط<br />خلنا نمسكها عشيرة عشيرة (وعند البدو بقولو قبيلة وليس عشيرة دقق لانو عشيرة عدد افراها من 100الى 1000 نفر اما القبيلة عدد افرادها فوق 1000 نفر وهذا العدد موجود في قبايل فلسطين )<br />2-* عشاير الشمال اربد كلهم قروييين من خلاهم بدو موي عارف<br />3-ابني حسن من المعروف انهم من القدس بل من شيوخ القدس ولكن الموجودين حاليا هم من النور او العبيد انضموا الي بني حسن لتكثير عدد العشيرة وتشمل مناطق المفرق وما حولها .<br />4-عمان : كلها ابو فلس هم اللي عمروها وبنوها ولا احد ينكر ذللك .<br />5-العبدي والعجارمه هوذله كلهم قرويييين<br />5- بني صخر : بدو اقحاح من نجد هربو من الجزيرة لانو قبايل الحويطات طردهم ثم استقروا في جنوب عمان و اجزاء من مداخل مادبا<br />الكرك : من اولها الي اخرها ابو فلس من الخليل<br />معان :ممزوجة من مخلتف الاصول و كذللك العقبة<br />وداي موسى ابناء بادية<br />ويفيك ان الفلسطيينون لا ينكرووون اصلهم لانهم معروفين<br />للعلم<br />كانت الاردن تسمى بر فلسطين يمتد من حوارة جنوب سوريا الي الشرارت عند تبوك ومعان ولكن من سخرية الاقدار صارت دوله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

