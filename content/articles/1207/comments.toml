author = "مسلم مؤمن من المومنيه"
posted = "2006-06-12"
text = "بسم الله الرحمن الرحيم<br />يا حيف على الرجال .. هيك يا اخوان! كلنا مسلمين وعرب وبنعبد رب واحد وكنا خير أمة اخرجت للناس! هاد مستوانا صار؟ هوش وطوش ومواس وسكاكين على بعض؟؟<br />اسدعليّ وفي الحروب نعامة؟؟ يعني بدأتوها طوش ومشاكل عامه وبعدين صارت شركسي سلطي وبعدين اردني فلسطيني؟ وبعدين عشيرة فلان وعشيرة علنتان وفي الاخر بتصفي الاخوة في البيت الواحد بينهم وبين بعض! وانا والله ما خلاني احكي غير الهامل اللي مسمي حالو مومني هاد يعني اسقط منك ما شفت .. بتفاخر بالزنى يا مجرم؟ ومكيف عاحالك؟ فضحتنا بين العربان وسودت وجهنا .. والثاني بني حسن .. إذا ولدنا ساقط انت بتصير اسقط منه؟ عيب عليكوا الجوز والفستق كمان يا همل .. الواحد بفاخر بعلمه وبعمله وبطاعته لربه وفي بره بوالديه وحسن خلقه مش بهالترهات هادي الي ان دلت على شيء دلت على تفاهت عقولكم .. والشباب الفلسطينيه مادامكوا شاطرين بالدعس على الروس وحمل المواس والسكاكين .. روحوا اشوف جاهدوا في الضفة ولا في العراق ولا في افغانستان ولا الشيشان .. كلوا جهاد في سبيل الله بدل منتوا قاعدين عشان تدعسوا على روسنا .. والحكي للكل كمان مش الكوا بس .. بما انكوا كلكوا رجال وقد حالكوأ والهامل فيكوا بكتل عشرة عل فطور .. اشوف روحوا جاهدوا بدل ما تموت فطيس انت وياه داعسك باص ولا واقع من فوق سنسله ولا كابس منسف على نفسك ونفس اللي خلفك وطلع السر الإلهى .. حسبنا الله ونعم الوكيل بهيك أمة لا ترى ابعد من انفها. وانا والله العظيم مش جاي اعلم على حد والحمدلله نية الجهاد عندي موجودة ومافي شي مانعني غير اني مابدي اكسر قلب والدتي بعد ما توفى والدي وماضل الها بعد الله غيري .. اسال الله لي ولكم الهداية والتوفيق وان يعزنا بالاسلام ويعز الاسلام بنا .. وآخر دعوانا ان الحمد لله رب العالمين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 52
subject = "ليش بتصير المشاكل"
author = "ابن الأصل"
posted = "2006-06-12"
text = "أول شي أنا دخلت بالغلط ع هالموقع الخرائي إللي لم أشكال زيكو... بس عادي شايفين أمثالكوا كثير في الجامعات الخرائية عنا في الأردن ( بقصدالأردنيين)<br />ليش بتصير الهوش من قبل العشائر الأردنية ...<br />1- بيغاروا من الفلسطينينة عشانهم ناس متعلمة و فهمانة و معهم مصاري بعلمهم و تجارتهم , بدليل مدينة عمان إلي صارت جنة بسبب الفلسطينية ولا لو وقفت على بني قشل و بني خرة ما بتكون أحسن من المفرق ... هاي شغلة .<br />2- شغلة ثانية إنه العشائر الأردنية بتفكر حالها عنجد عشائر, ناسيين إنه نصهم من فلسطين و ناسيين إنه فلسطين فيها عشائرالوحدة قد نص الأردن.<br />3- الحق مش عليهم الحق ع اللي بيدخلهم الجامعات , بيدخلوهاش غير بامكرمة الجيش و مكرمة الأقل حظاًو مكرمة أبناء العشائر و مكرمة الديوان و غير الواسطات و القائمة تطول ... و طبعاكلهم تخصصات فاشلة عربي و علم نفس و تربوية وما بعرف شو ... و مش بس هيك يا ريت بينجحو قبل ما يخلص الواحد منهم بيقعدلو في الجامعة ست سبع سنين ليتخرج مقبول و بمية واسطة واسطة إذا تخرج أصلاً .<br />4- حاقدين ع الفلسطينية من باب الغيرة , بيفكرونا ماكلين أكلهم و لك هو إنتو عندكو أكل أصلاً ؟!!!! , بس لا تخافو قاعدين ع قلوبكو و بس نرجع ع بلادنا بتعرفو قيمتنا و الله غير تشحدو الخبز منا شحدة , وقتها راح نحكيلكو روحو ع شارون حبيبكو خليه ينفعكو.<br />5- كل هذا التخلف عندهم ولد شعور بالنقص و عقدة النقص عندهم , لذلك بتلاقيهم بيفرغوا عقدهم في المشاكل , طبعامش بس مع الفلسطينية و بين بعضهم كمان , كل عشيرة بتفكر حالها أحسن من الثانية زي ما إنت شايفين فوق كيف دقوا في بعض .<br />6- الحكي و المشاركات إللي مكتوبة فوق بيعطي إنطباع صادق و دقيق لكل العرب عن العشائر الأردنية , و عن سبب المشاكل في الجامعات .<br />طبعا هذا الحكي ما بيصدر من إنسان مثلي لكن لما شفت التخلف و الكذب ما قدرت أسكت .<br />و نصيحتي لكل الفلسطينية هون ... معلش كما تعودنا دائما بنظل أحسن منهم , خليهم يعبرو عن أصلهم و كرم أخلاقهم و عقدهم بالطريقة تبعتهم ... أخريتهم ينفلقوا زود ما هم مفلوقين .<br />و سلامتكو... و الله لا يسلم المشرفيين ع هالموقع إللي سمحوا بهيك مهازل ... و زي ما حكى أحد الشباب فوق الموقع أكيد مشبوه ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 53
subject = "اولاد القحبة انتم لا استثني منكم احدا!"
author = "نايك خوات الفلسطينيه"
posted = "2006-06-13"
text = "على اساس انك يا اخو الشرموطه الفهمان هيك؟ عموما انا ما راح ارد عليك بحكي فاضي بس بما انك فهمان ومتعلم وابن اصل وما بتهينك هاينه احكيلي اسمك او وين اقابلك وساعتها بنشوف وين الرجولة هاد الحكي لو انك زلمه من ظهر ابوك ولكن انا اشك انك ابن حلال .. وإذا ما حكيت مين انت بيكفنا انكوا مدعوس على روسكوا وما بطلعلكوا لسان غير من ورا الشاشات يااخو الممحونه البلجيكيه المتحده ذات مسؤلية محدوده."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 54
subject = "رد بكامل الصراحه والشفافيه"
author = "اردنيه وكل شهامه وافتخر"
posted = "2006-06-13"
text = "الصراحه اخواني يجب ان تقال ان صراحة طول عمري عايشه بالكرك ولما خلصت توجيهي دخلت الجامعة وهناك تغيرت حياتي اتفاجئت ان الرجال مش زي الاردنيين الي عندنا بالكرك وسخين وسكيره وريحتهم نتنه وسمر ومقرفين اتفاجئت بشباب فلسطين الورد وبصراحه مارست الجنس(السكس) مع اكثر من 13 فلسطيني ولسه بقول هل من مزيد لانهم رجال وبقدروا المره وكمان نظاف وانقيين وزوق مش بقر زي اهلنا الله يطورهم ويحظرهم وانا معي بكلية الصيدلة بالجامعة الاردنيه اكثر من 50 بنت شغلين هيك وعندي استعداد اتعرف على اي شب فلسطيني يراسلني<br />على ايميلي الخاص ويبعث صورته<br />reeme1984@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 55
subject = "بشرفك!"
author = "نايك خوات الفلسطينيه"
posted = "2006-06-13"
text = "طبعا مافي داعي اني احكيلكوا انو هاد شب فلسطيني اخو ممحونه.. وكلنا عارفين انهم بحبوا يتقمصوا شخصيات بنات عشانهم شاذين والرجوله عندهم شيء مجهول وطبعا هاد واضح بنظرات الذل اللي في عيونهم .. والله ما حطيت عيني بعين فلسطيني إلا كسرتها لإنهم بدون كرامه وشرف ولله الحمد .. يعني تخيلوا فلسطيني بكرامه وشرف؟؟ يا حبيبي فوق ما همه بفعفطوا على ولا اشي شو بيعملوا اذا عندهم شويه! عموما العرض قائم لحد الان بدي اخو شرموطه فلسطيني يصير رجل مره وحده بحياته ويحكيلي وين اشوفوا او شو اسم اخته .. ولكن هي اشياء لا تشترى! وفي الختام لا يسعني إلا اني اتنخع واتف على شرف هيك شعب وسخ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 56
subject = "لا حول ولاقوه الا بالله"
author = "انسان مسلم"
posted = "2006-06-14"
text = "لا اعرف من اين ابدأ لاكن المني والله حال هؤلاء الشباب والتعليقات الغريبه وقذف المحصنات هنا وهناك واثارت الفتنه واقول لهم وخاصة صاحب اخر تعليق حديث للرسول الكريم<br />قال رسول الله (ص) اتدرون من المفلس ........ المفلس من امتي من يأتي يوم القيامه وقد صام وصله وزكاه فيأتي قد ضرب هذا واكل مال هذا وسب هذا فيأخذ هذا من حسناته وهذا من حسناته فاذا نفذت حسناته يأخذ من خطاياهم وتطرح عليه ثم يطرح بالنار) يأخي النار والعياز بالله بالله عليكم وانتم تتبادلون السباب والعان ارضيتم من ارضيتم عدو الرحمن الشيطان وكنتم تبعا له واغضبتم جل في علاه الرحمان . واخير والله والله يأخوتي اني اعمل محلل انظمه ولي اكثر من 9 شهادات من ميكرو سفت في الحماية وحاصل على شهادتCEH وتتبعت الدومين ادرس لهذا الموقع وجدته والله والله والله والله والله يبث من تل ابيب بالضبط من منطقة تل أبيب في اسرائيل والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 57
subject = "امة محمد هكذا"
author = "الدكتور طارق سويدان"
posted = "2006-06-14"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم<br />ياشباب ياشباب الحق همتكم تسموا بكم عن دروب الطيش والصخب احبكم ياشباب الحق محتسبا اجري عند رب لايضيع اجر محتسبي<br />بالبداية والله اني ارسل لي اكثر من60 ايميل الكتروني كي ادخل هذا الموقع اعان الله القائمين عليه امام الله وفوجئت بما رأيت من المصائب والعجائب وقد خابرني الدكتور : صادق نايف الاحمد من جامعة عجمان لارى هذا الموقع واكتب نصيحه لهؤلاء الشباب الذين غرقوا في هذا السبات والظلام واقول لهم بصدق والله اننا هنا بجامعاتنا ومحضراتنا اتدرون كيف نشبه الشعب الفلسطيني والشعب الاردني اتدرون بمن والله نشبههم بحال المهاجرين والانصار اخوتي اكتب هذه العبارات والله والعبرات تسح من مدامعي اتدرون من المهاجرين شعب عظيم هو الشعب الفلسطيني شعب الجهاد هجروا وتحملوا في سبيل الله واخرجوا من ديارهم ونهبت اموالهم ليس من ضعف او خوان لا هذا ماكتبه الرحمن ان لاتقوم الساعة حتى نقاتل اليهود غربي النهر اي في فلسطين والرباط سيكون شرقي النهر عند الشعب الاردني الكريم وهم بأذن الله شعب الانصار هنيئن لهم ناصروا المهاجرين بأرضهم ومالهم وأولادهم فهذا النسيج العظيم والحصن المنيع لا لا تضيعوه في افكار سيسها لكم زمره من الحاقدين والغائرين منكم من هذا التلاحم العظيم وبما فيهم هذا الموقع .<br />واخيرا اوصيكم بتقوى الله ياشعب المهاجرين والانصار.............."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

