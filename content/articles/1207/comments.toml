text = "هاي.انا من الاردن وفي جامعه الهاشميه.والله لما قرأت الكتوب استغربت.يعني كيف بتسمحوا لحالكم هيك تكتبوا .!!!!!!!!! والله عيب عيب عيب ...يعني احترموا حالكم...والعرب عرب لو مهما كانوا فلسطينيه او اردنيه او عراقيه اواواواواو...المهم الي بدي اوصله انوا انا استغربت كتير انوا في ناس هيك بالاردن لسه بتفكر هيك...الله اكبر...وكل واحد يحترم حاله بس..<br />اختكم ديمه"
