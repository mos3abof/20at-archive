text = "كنت أعمل مدرسا في إحدى الجامعات الخاصة التي أدخل الطلبة إليها لعمل الهوشة مسدسات وكلاشينكوف مما يشير إلى تخلق هؤلاء الطلاب...مما جعلني أترك الجامعة لأنني ما عدت أطيق جوها المشحون بالكراهية والعداء..<br />على نقيض ذلك تجد أن نفس الطالب الذي يدخل الطوشة عندما يراك في مناسبة أخرى ويكون حامل بيده سيجارة فإنه يخفيها خجلا منك.<br />هذان النقيضان موجودان مما يعني حاجة ماسة إلى توعيتهم وتقوية الجوانب الإيجابية وإضعاف الجوانب السلبية. هداهم الله..."
