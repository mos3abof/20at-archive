[[comments]]
order = 160
subject = "اذا ما بدوك اينا بنطلع بس مين بده يصرف عليكوا يا اولاد المنيوكة"
author = "فلسطيني نايك كل الأردنين واحد واحد"
posted = "2006-10-22"
text = "يا شعب النفاق والسحدة يا بدوان يا مغتصبي الأغنام كل هعام وأنتم بخير، أولا سبب الطو شالجامعية انه البدوي الردني بيشوف الفلسطيني معه سيارة غير شكل ومتفوق في الجامعة ومزبط اتخن بنت بما في ذلك الشرموطات من بنتات العشاير، وبيشوف كيف الفلسطيني اجى على الاردن ولا شيء ورغم ذلك الفلسطيني الان بيملك الأردن ، احنا اصحاب المال أصحاب الأراضي وأصحاب المناصب المهمة، الليه يطول عمر جلالة الملك وجلالة الملكة رانيا العبدالله، في حين انه مغتصبي الأغنام من البدو يعيشون على إغتصاب أموال الدولة والشحدة والترجي، يا قوادين يا بدو صاحوا وإفهموها... الأردن راح يتغير وخلال عشر سنين سيصبح للأردني من أصل فلسطيني كافة الإمتايزرات مثله مثلك وبجوز أحسن منك، بعدين يا أولاد المنيوكة ايش بدكم، إحنا بندف ع الضرايب وانتو عايشين على صندوق المعونة الوزطنية او ضغالين في الدولة؟، يدوك نطلع بنطلع بس مين راح يصرفوا عليكم يا بقر..... الاردن من دون الهاشميين والفلسطينين صحراء راح ترجعوا فيها تنيكوا غنم، بس بدي افهمكم يا متايك، لو طلعنا ما بيصير في اردن، والحكومات الغربية بيتوقف مساعداتها لل{دن وبترجعو تنيكموا غنم، وتبيعوا لبن بعيدن بالمناسبة الخولاتن اللي ما بيعملوا طوضة الا يجيبوا كل عشيرتهم هم الأردنية مش الفلسطينينة، وبذكركم انه كل عشائركم على زبي الاإقتصاد معنا، وجلالة الملكة منا، والبقي اسمه كس امكم بلدكم صارت النا وقريبا ما راح يصير الكم اي اشي في هذي البلد، لبشركم امريكا بدها هيك.... والدليل سيدي ابو حسين غيرها قال (كلنا الأردن) مشان السفلة اللي زيكزا يسكوتوا، بالمناسبة ايش علوم الحسن بن طلال تبعكوا؟؟؟ كس اختك يا عالة يا حثالة يا عايشين علينا، انتوا عايشين على الشحدة واسلرقة والكل بيعرف انكم جبناء وخزات وسفلة ومنايك واكثر من طوشة اخرها طوشة كلية التمريض في الأردنية اكلتوا فيها خرى، اصلا احنا الفلسطينينة 92% من الشعب يعني اي طوشة بتلاقي منيك اردني كمقابل عشرة فلسطينين، وتذكر يا اردجني يا بدوي يا ابن المنيكوة..... الفلسطينني يملك بلدك كلها.. تفوه على كس اخت كل اردني وكل عام وانتم بخير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 161
subject = "لو طلعوا الفلسطينين مين راح يصرف عليكو يا كلاب البدوان المنايك"
author = "نايك كل اردني بدوي خول"
posted = "2006-10-22"
text = "يا شعب النفاق والشحدة يا بدوان يا مغتصبي الأغنام كل عام وأنتم بخير، أولا سبب الطو ش الجامعية انه البدوي الأردني بيشوف الفلسطيني معه سيارة غير شكل ومتفوق في الجامعة ومزبط اتخن بنت بما في ذلك الشرموطات من بنات العشاير، وبيشوف كيف الفلسطيني اجى على الاردن ولا شيء ورغم ذلك الفلسطيني الان بيملك الأردن ، احنا اصحاب المال أصحاب الأراضي وأصحاب المناصب المهمة، الله يطول عمر جلالة الملك وجلالة الملكة رانيا العبدالله، في حين انه مغتصبي الأغنام من البدو يعيشون على إغتصاب أموال الدولة والشحدة والترجي، يا قوادين يا بدو اصحوا وإفهموها... الأردن راح يتغير وخلال عشر سنين سيصبح للأردني من أصل فلسطيني كافة الإمتيازات مثله مثلك وبجوز أحسن منك، بعدين يا أولاد المنيوكة ايش بدكم، إحنا بندفع الضرايب وانتو عايشين على صندوق المعونة الوطنية او شغالين في الدولة؟، بدكوا نطلع بنطلع بس مين راح يصرفوا عليكم يا بقر..... الاردن من دون الهاشميين والفلسطينين صحراء راح ترجعوا فيها تنيكوا غنم، بس بدي افهمكم يا منايك، لو طلعنا ما بيصير في اردن، والحكومات الغربية بيتوقف مساعداتها للأردن وبترجعو تنيكوا غنم، وتبيعوا لبن بعدين بالمناسبة الخولات اللي ما بيعملوا طوشة الا يجيبوا كل عشيرتهم هم الأردنية مش الفلسطينينة لأنه الفلسطيني بطبيعته زلمه والأردني خول، مره اجاني واحد من الخرابشة قال يخوفني، نطته وكسرته، راح جابلي كل عشيرته، اتخبيت واتصلت بالخلوي، باصين من مخيم الحسين اجو، تخيلوا 40 شب فلسطيني ناكوا ما يزيد عن 60 شب اردني، البدوان جبناء ومنايك وهيك طبعهم، اصلا اللي جاي هون يسب على الفلسطينين، اصلا يا ابن المنيوكة، جلالة الملكة رانيا العبدالله فلسطينينة، كنك زلمه سب عليها يا منيك يا بدوي يا نايك الغنم!!! ما بتسب غير على الإنترنت، وبذكركم انه كل عشائركم على زبي الاإقتصاد معنا، وجلالة الملكة منا، والبقي اسمه كس امكم بلدكم صارت النا وقريبا ما راح يصير الكم اي اشي في هذي البلد، نبشركم امريكا بدها هيك.... سيدي ابو حسينا قال (كلنا الأردن) مشان السفلة اللي زيكوا يسكتوا، بالمناسبة ايش علوم الحسن بن طلال تبعكوا؟؟؟ كس اختكم يا عالة يا حثالة يا عايشين علينا، انتوا عايشين على الشحدة والسرقة والكل بيعرف انكم جبناء وخزات وسفلة ومنايك واكثر من طوشة اخرها طوشة كلية التمريض في الأردنية اكلتوا فيها خرى، اصلا احنا الفلسطينينة 92% من الشعب يعني اي طوشة بتلاقي منيك اردني مقابل عشرة فلسطينين، وتذكر يا اردني يا بدوي يا ابن المنيكوة..... الفلسطينني يملك بلدك كلها.. تفوه على كس اخت كل اردني وكل عام وانتم بخير"
archived = "2006-11-02"
