subject = "اردني وافتخر"
author = "خالد الزواهرة"
posted = "2006-07-12"
text = "بـــــــــــــــــاك انا رجعت لعيون الاردن وبس شفت الردود بعدي وري الاردنيه النشامى ما قصروا والنشميات بعد<br />عاش الاردن شامخا للابد قيادة وشعبا<br />لا حد يحكي عن الاردن طول عمرنا لحالنا مافي حد اخوان معنا<br />خليكو اخوان (كلنا اخوان بالرضاعه ورضعنا حليب نيدو سوا)<br />وسلامتكوا اي مساعده انا حاضر وسلامي للاردن عجرميه بتن اصل وربي ما قصرتي<br />حنا الاسود ان كان دنيك غابه.....وغير الاسود افطن ترى مالنا اسياد<br />واقول للي ما يثمن جوابه..... كم اردني بالقاف جيناك رداد<br />بدو ولنا بين القبايل مهابه.... بسيوفنا نلنا المفاخر والامجاد<br />وبـــــــــــــــــــــاي حبايبي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

