text = "بحب اقولك ايش ياابو الشباب..........انا فلسطيني وبفتخر بهظا الايش.......لاني من اب فلسطيني وام فلسطينيه وكل عيلتي فلسطينيه....يعني(((فلسطيني اباٍعن جد)))........وبحب اقولك ايش ثاني انو انتو يالاردنيه مشكلتكم الوحيده في الحياه انكم مش قابلين تصدقو انكم فلسطينين الصل.....يلي بتعرفوا الاصل(هههههههههههه)..........مهو من سلوكم مبين كلو مسبات ووسخنه وقلة ادب .....الخ.......وعلى فكره لو...(وانتبه كثير على كلمة لو)...لو انكم زلام ونشامى زي مابتسمو حالكم ....كنت ما بتسبو عالنت (من ورا الكمبيوتر)....وهاظاان دل على ايش فانه بدل عاى انكم اخنث شعب في العالم....وانت عارف البقيه فش داعي اكمل......................................؟؟؟؟؟؟؟؟!!!!!!! وفي موضوع حساس بدي احكي فيه.......(الاردن حضاره وتاريخ).....اي حضاره وتاريخ بتتكلمو عنها.......انا بحكيلك حضارتكم....حضارة الزباله والقرف والوسخ والشرمطه والمنيكه والتخلف (من زمن اجدادكم هاظا اذا كان عنكم اجداد!!!ههههههههههههههههههههههههههههههههههه)........وبتسبوا على ابو عمار.....انتو شايفين تبعكم (القرد)................................انت عارف..............ولسه الحبل عالجرار...مثل مابقولوولا.لأ.......خليني ساكت احسنلي....وبدي احكيلك عن ايش .هسه انا في ثالث سنه جامعه...وبتذكر كان عنا استاذاردني(ريحة ثمه طالعه وخازكه منخيري)....هاظاالحكي بالصف التاسع(يعني ايام المدرسه)....(يعني قبل 6سنوات).وكل اللي كتبته بين القواس للتفهيم فقط لاغير....لانكم انتو معروفين بطيئيين استيعاب .هههههههههههههههههههههههه...ياسيدي ماعلينا خلينا نكمل...فهاظا الاردني الجرب المكلعط .وكثثير عليه لقب زبال مش (استاذ)....انتبه!!!....كان يدرسنا عربي (شو جاب طز ل مرحبا .... الله اعلم.المهممن اول يو دراس فات علينا.... شيبنالو راصو(الي كان كلواسود)...كنو نرمي عليه ورق ومحايات ونتهبل علي ونسويه ملطشه الطلاب وكنا نحط العلكه في الكرسي قبل مايقعد وتلزق فطيزو وكان بعض الطلاب يضربوه وكنا نغش في الامتحان(وهوه على الله تعود) فاتح ثمه وراخي بيظاته...يعني بالمختصر المفيد(اهبل)..........,آخر السنه كسرناله كزاز (زجاج) سيارته(اللي بتساويش نقله).ونفسناله العجال والحاله حاله... وبعدو عايش ياسبحان الله شعب صامد(من ورا)...وشو اتذكرلك تااتذكرلك......ايام ......ايام وبعد مامرقت سنه لقيناه مروح على بلده(ههههههههههههههه).....ولسه بتقلي زلام ونشامى .........................................(روح انتحر احسنلك)ّّ!!!...لانو واحد مثلك ومثل اشكالك حراااااااام يعيشو ....(((الى القاء في الحلقه القادمه))) ....يتبع......زوسلاااااااااام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 136
subject = "يااااااااااااااااااااااااااحرام"
author = "الحر الاصيل"
posted = "2006-09-02"
text = "يعني انتوا يا شباب نسيتوا الموضوع الاساسي(مشاكل الجامعات)وصرتوابموضوع ثاني نهائيا(العنصريه)ودامكوا دخلتوا بهالموضوع المفروض مني كاردني صخري منتمي ووفي كل الوفى لبلدي اني اعلق على هالموضوع..............<br />اذا حكينا بصراحه احنا الادنيه لنا كل الحق بالعنصريه بانكوا يا فلسطينيه يا كلاب فوق مالميناكوا من الشارع وسكناكوا ووفرنا الكوا كل ما يلزم الحياه الكريمه قاعدين تعملولنا مشاكل وكانها البلد بلدكوا.......وبصراحه اكثر اكثر المشاكل الجامعيه من ورا البنات الفلسطينيات لانه اصلا شرف ما عندوا.............صح الي بحكيه والا لا؟؟؟؟؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

