text = "اليهود اخوانا؟؟؟؟<br />ولك يا نذل مين حكالك انو اليهود اخوانا... صحيح انكم جيل تافه و منحط وعديم الوطنية.... انا اردني و من شيوخ الارد و ما عندي خوان يهود"
archived = "2006-11-02"
