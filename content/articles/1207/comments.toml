[[comments]]
order = 98
subject = "كلنا سواا"
author = "MissS Toty"
posted = "2006-07-20"
text = "مرحبا<br />في البداية<br />المسلمين والعرب من كل الجنسيات اخوة وما لازم يسير بينكم هادا النقاش الحاد وفرد العضلاات... يعني بفلسطين وبالاردن وبسوريا وباثيوبيا وافغانستان وكل مكان بالعالم في ناس قوية<br />وعمرها القوة ماكانت بالخناق ومين الي ضرب اكتر<br />القوة بالشخص الي بيعرف كيف يكون حليم وحكيم<br />والعصبية القبلية هادي(انا اردني ابن أو انا فلسطيني ابن) بطلت حتى في اميركا ساروا يحترموااا ويحبوا السود<br />على العموم لازم المسلمين ينتصروا ولاازم نعيش بمجتمع نحب كل الي فيه ونحترمهم<br />تخيلوا لو واحد يهودي فتح الصفحات هادي وقراء حكيكم والله ليفرح ويقول المسلمين كلهم هيك منفوخين من برا ومن جوااا فاضيين<br />ارجووكم اخواني تألفوا مو ضروري تحبوا بعض بس احترمو بعض<br />(إن أكرمكم عند الله أتقاكم)<br />(يعرض هذا ويعرض هذا وخيركما الذي يبدأ بالسلام)<br />** أحرص على حفظ القلوب من الأذى فرجوعها بعد التنافر يصعب إن القلوب إذا تنافر ودها مثل الزجاجة كسرها لايشعب**<br />والسلاام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

