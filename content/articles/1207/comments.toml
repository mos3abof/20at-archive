author = "نايكين الأردنية في الأمارات وفي كل مكان وزمان"
posted = "2006-10-30"
text = "ولكم يفضح عرضكوا يابقر ولكوا كوس خواتك صغير قبل الكبير والي ممدده على الحصيره<br />ولكواماء راديتر كوس خواتك فقع من كثر مالفلسطينية نيكين خواتك لأنهم دعسيين على روؤسكوا ولك شرف ماكوا على قول اخوانا العراقية ولكوا هو في أردن أصلا ولكم طول الزمن نعرف الأردن من جهة فلسطين بر فلسطين يعني حجركوا سود وناسكوا قروود<br />ولكوا كنتوا تعرفوا الأكل ولكم ماأنتو ناور هي كانت رح أتقوم دولة عندكوا أصلا من دون الفلسطينة وشوية الناور ماانتوااكبر خوان ومنايك ولكم أنتو تعرفوا تلبسوا والله ماكنتوا تعرفوا شي الفلسطيني يعرف كل شي في دنيا الفلسطيني بنيك الأردنية شر نيكة<br />بدك تسترجلوا سيرو مخيمات الفلسطينة الي في الا ردن وفي سوريا ولبنان يالله فرجونا مراجلكم نسمع بس إذا في واحد اردني بقدر أيسوي هذا شيء... خواتكوايالأردنية.... الفلسطيني أرض الأحرار والمجهديين مش زي الأمريكان قعدين بأرض الفرووخ والقواديين والليل النهار نيك بالأردنيات مستلمين<br />خخخخخخخخخخخخخخخخخخخخخخخخخ"
archived = "2006-11-02"
