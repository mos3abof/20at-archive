[[comments]]
order = 122
subject = "لا للعنصرية"
author = "عاشق الاسلام"
posted = "2006-08-08"
text = "مرحبا ايها الاخوة،،<br />اعرفكم بنفسي ،، انا اخوكم بالله احمد،، لا استطيع ان اخفي مدى قلقي من مستقبل الاسلام والمسلمين بعدما دخلت على هذا الموقع ورأيت ما لا يبشر بخير لمستقبل هذا البلد الامن..<br />والله لقد كان من اسباب انهيار الامم الا وهي العنصرية والقبلية،، انا اريد رجوكم بكلمة من القلب الى القلب من اخ لكم بالله ،، ان ما يعصف بهذه الامة الاسلامية من تيارات ومصائب وفتن ، الا والله لهوة من فعل اليهود احفاد القردة والخنازير ، وان ما يحدث في الاردن الغالي ليس الا جزء من اشلاء الامة الاسلامية التي تتمزق وتتداعى امام اعيننا ونحن لانفعل شيئا سوى تمزيقها اربا اكثر فاكثر ،، والله لقد بكيت عندما دخلت هنا ورأيت ما رأيت،، والله انه يعز علي ان ارى اخوة لي بالله يتقاتلون ويشتمون بعضهم بعضا ، يشمتون اليهود واتباعهم الكفرة بنا نحن المسلمون..<br />نحن كلنا تحت راية الاسلام الحنيف ، نحن احفاد الصحابة الكرام البررة ، هؤلاء الذين ضحوا بانفسهم ليقدموا لنا الاسلام على طبق من ذهب ، ولكن للاسف ان المرء اذا رأى هذا ، تراه يتعجب من تخلي المسلمين عن رايتهم ، وتراهم يشمتون بنا اعداء الله..<br />اخوتي بالله انا لا اريد ان اطيل عليكم ، ولكني والله اخاف عليكم من يوم لا بيع فيه وشراء ، من يوم ، تشيب فيه الاطفال ، وتذهل كل مرضعة عما ارضعت ، وتضع كل ذات حمل حملها ، وترى الناس سكارى وما هم بسكارى ولكن عذاب ربك لشديد...<br />قال رسولنا الكريم - عليه افضل الصلوات- : (( اتركوها فانها منتنة )) وقد قصد بها العنصرية ..<br />اخوتي ،، ان الاولى لكل مسلم ان تكون تبعيته ووفاءه ومرجعيته للاسلام،، الاسلام أولى ، الاسلام ديننا والرسول قدوتنا والله غايتنا،، احبتي في الله ،، انها لغصة في القلب ان ارى شباب الاسلام يتداعون وراء بعضهم بسبب العنصرية..<br />هناك حرب على الاسلام، هناك حرب على ديننا وعقيدتنا وامننا كل كياننا.<br />ارجوكم رجاء من اخ لكم محب ، ان لا تلتفتوا لما وراء ذلك ، فان ذلك والله ما يفت في عذد اساس بناء الاسلامية...<br />انا احب ان اناقش اخوتي بالله في اي موضوع ، بصراحة انو لمن المشرف لي ان اناقش اي اخ عزيز يريد مناقشتي في اي موضوع ، ويشرفني ان اقدم اي معلومة ان كان في هذا الموضوع او غيره..<br />اخوكم بالله ،،،<br />احمد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

