posted = "2006-10-12"
text = "يا فلسطينيين: الأردني الأصل هو الفلسطيني وهم يشكلوا 90% من سكان الأردن وهم الذين سكنوها عبر التاريخ وفي سنة 1948 هاجر إليها اللاجئون وعمروها لانها بلدهم وأما ال 10% الآخرين فمنهم السوري أو البدوي أو الفلسطيني أو الشيشاني.... وليعلم الجميع أن هذه حقيقة تاريخية وأن على كل أردني خاصة أو فلسطيني عامة أن يعمل على تحرير الجزء المغتصب من أرضه"
