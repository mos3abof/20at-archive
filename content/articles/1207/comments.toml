text = "بالله عليكم انتو زلام سواء كنتو اردنيين ولا فلسطنيين ولكم يا متخلفين أصابع أديكم الخمسة مش نفس الأشي مش كل الفلسطنيين كويسين ولا كل الأردنيين كويسين بعدين بشرفكو أكيد كل واح منكم عندو صاحب من الجنسية اللي بكرها بليييييييييييييز كبرو عقلكو"
