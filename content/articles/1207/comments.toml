text = "مين المنيك من الزواهره اللي بالهاشميه<br />اذا انت رجل<br />\"بعرف انك مش هيك\"<br />قول اسمك ولقي عن راسك<br />وانت وغيرك من كثار الحكي يعرف مين الطفايله وايش بسوو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 112
subject = "طفيلي يا منيك"
author = "الزواهرة"
posted = "2006-07-29"
text = "انا اسمي يونس الزواهرة وانا دايما بالغربي اذا انك زلمة وتعال قول الحكي هاض هناك وكل الجامعه بتعرفني ولك انا ملك الغربي الزلمة يلاقيني غاد<br />قول مين انت واتفلقى عن راسم محنا شلخناكم بالجامعه<br />احنا من سنه متحمظين عليكم يا همل ولكو عيطناكم لو فيكو الخير مش كل البلد بحكو عنكم نكت من متى وانتم تفهمو وبتخشو جامعات يا هبايل<br />مرة طفيلي هههههههههههههههههههههههه<br />االاسم كافي يرحم ايام صنفحة وانت وانا بندري شو صار هناك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 113
subject = "الى الاخت العجرمية"
author = "واحد"
posted = "2006-07-30"
text = "ان اسف على اي تعليق صدر مني دون وعي<br />صدمني الحكي المكتوب في الموقع من الجانبين الفلسطيني والاردني احنا اخوان وانا زيك من اسره فقيره جدي كان فلاح مش قادر يطعم حاله ومع هيك درس ابوي هندسه وعاش بعرق جبينه انا بفتخر فيه وفيكي<br />اسف اذا حكيت شئ بزعل<br />يا ريت بدل ما كل واحد وره الكمبيوتر متخبي بكتب كلام طالع نازل وبنسب حاله لناس وعشائر انه احنا الشباب نتحاور ونزيل اي حزازيه بين بعض بالحكي والمنطق<br />ومره ثانيه انك تسب وتلعن من وره شاشة الكمبيوتر مش عمل زلام ولا ولاد ناس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 114
subject = "وحدوا الله"
author = "خ الزواهرة"
posted = "2006-07-30"
text = "السلام عليكم اخواني الحكي لا بقدم ولا بإخر الكلمة الحلوة طالعه والعطله طالعه عيب اللي تعملوه انتم شباب مثقف الغلط عيب والمسبات والقذف<br />يا اخوان كل واحد بعرف حاله ومو ضروري يفت مراجل عالنت كل شعب فيه العاطل وفيه المليح وما بتحكم على مليون واحد كلهن نفس الشي<br />ربنا خلقنا متفاضلين لهذا الغرض<br />عيب الغلط واللي مش عاجبه الاردن مش ضروري يحكي فالتقل خيرا او لتصمت<br />عن جد اللي ما بتعجبه هالبلد وقيادتها الباب يطلع جمل الله معه ما بهمنا ننقص واحد بالعكس بابنا مفتوح لكل العرب<br />شوف شو بيصير بالدول حواليك واحمد ربك على نعمة الامان والاستقرار الدول الثانية ما بتقدر تمشي ولا بتامن على حريمك حتى بالبيت<br />الحمد لله وكل هذا من خلال قيادتنا الرشيدة اللي وجودهم هو نعمة للبلد<br />والرجاء الحار ما يدخل حد باسمي اوكي<br />خالد الزواهرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 115
subject = "عيب عليكم"
author = "بني آدم"
posted = "2006-07-31"
text = "والله عيب عليكم المسبات هاي<br />يعني كل واحد متخبي ورا جهازه وبسب على جنب وطرف<br />ما بتعرفوا انه هاد اللي بتحكوه بدخل في دائرة القذف وهو من الكبائر وأعظم الذنوب<br />حرام عليكم هاد الحكي واستحو شوي<br />ما حدا فرض عليكم تحبوا بعض بس ما تشوهوا سمعة بلادكم انتو الطرفين وبلاش مسبات عاطلة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 116
subject = "عييييييييب"
author = "الزعيم_فلسطين بلدي الحبيبة"
posted = "2006-08-01"
text = "اسمع انتا ويا ولك الواحد فيكم مافي عندو خوات يخاف عليهوم عيييب شو يعني هذا الحكي شو فلسطيني شو اردني ولك اصلانا انتو زبالة الشعبين عرفتو علي لونكم زلام ما بتغلطوا على بعضكوم ولك اتفه او اتفوووو على شكلك انا ويا(وبديش اشوف ولا اخو منيوكا بحكي على الشعبين !!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

