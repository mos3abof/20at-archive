author = "عبادي الاردني"
posted = "2006-07-22"
text = "معلش اول اشي بقول الله يمسيكم بالخير<br />بعدين بقول لولاد الحمايل و العشاير الي فعليا بخزو انو استحو عحالكو و لا تشوفو حالكو عبعظكو كلنا ولاد البلد وكلنا ولاد حمايل وعشاير و كلنا بنعرف بعظنا ومين الزلم وبقول لبنات البلد والنشميات<br />بما انو احنا شباب هالبلد بنشم الهوا لا تخافن ما بقدر حدا يدعس عطرف الاردن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

