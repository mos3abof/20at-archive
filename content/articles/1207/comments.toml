[[comments]]
order = 27
subject = "الأردن أولاً"
author = "هاني الزهير"
posted = "2006-05-27"
text = "بسم الله الرحمن الرحيم<br />الحمـد لله والصلاة والسلام على رسول الله ..<br />يعني هسآ انت وياه مبسوطين على الهوش والضرب والطق اللي يصير ..<br />وأنت يا أخي الكريمـ استغفر ربك بس ما عندنا شي اسمــها اليهود اخواننا ..<br />اللي تعلمته من ابوي وشيخي واهلي انه اي مسلم هو اخوى دامه ما تعدى على حقوقي<br />عمـآن الأردن .. وعمآن العرب .. وعمآن العروبـة .. احنا هنا نستضيف اي واحد ونرحب فيه .. ما يهم .. فلسطيني .. مصري .. سوري .. إن شالله اثيوبي ..<br />اهم شي ان هو يلتزم باحترامه وأدبه وتعامله الحسن مع جميـع المواطنين والمقيمين ..<br />ثاني شي ..<br />بالنسبة للهوشات اللي تصير بالجامعـات ..<br />صراحة صراحـة ..<br />الهوشة من وجهة نظري ما تستاهل إلا من ناحيتين ..<br />التعدي على الدين الحنيف ديننا الإسلامي ..<br />وثآني شي الغلط على الشرف والمبآدئ والوطـن الغالي ..<br />عاش الأردن الغالي .. وعآش الوطن العربي ..<br />باقي شي أخير ودي أأكد عليــه :<br />وهــو أن تصرف شخص ينتمي لقبيلة او دولة او نآس معينين لا يعكس اسلوب ولا تربية ولا مبآدئ هذي الدولة ولا العشيرة ولا الأهــل<br />ودمتم بألف خيــر ..<br />وعقبآل ما نصلي بالأقصى قولو آمــين ..<br />أخوكم : هآني الزهير بني صخر .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 28
subject = "لله في خلقه شؤون"
author = "مالك"
posted = "2006-05-27"
text = "بسم الله الرحمن الرحيم<br />أولا نحن العرب أصبحنا أخصائيي كلام نجيد الحديث ولا نحسن العمل المسالة ببساطة تحتاج الى ضبط النفس سواء اثناء الشجارات وثانيا اثناء الحديث ولن يكون هناك مشكلة للحديث ولكن بالنسبة للمسألة كظاهرة فهي ليست في الاردن بل في شتى بقاع العالم الا أن العرب خصوصا يمتازون \"بالدم الحامي\" من ناحية ومن ناحية أخرى يفتقد الكثير منهم للجبن وأنا أجدها خصائص جيدة ولكن أرجو من الأعزاء أن يختاروا السبب المناسب في الوقت المناسب ليس الا أما الأسباب التافهه فهي \"\"\"\" تااااااااااافهه\"\"\"\"\"<br />والسلام عليكم ورحمة الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 29
subject = "يانايف الخزاعلة"
author = "حسام المناصير العبادي"
posted = "2006-05-27"
text = "اسمع يا خزاعله انت تقول الزلمة يتكلم وانت ما بتعرف زلم الاردن بعدك انا شاك انك فلسطيني داخل باسم بني حسن ولك بني حسن شيوخ وما يحكو زي هيك<br />وانت يا اخي الكريم من متى صارو اليهود مش اخوانا؟؟ اللي ينيك فلسطينيه اكيد اخوي واللي يقتل فلسطيني اكيد اخوي واللي يهدم المسجد الاقصى اكيد اخوي واللي يدنس القدس اكيد اخوي والله يا منايك لانذلكو بالاردن اكثر من فلسطين<br />حسام العبادي اليهودي هههههههههههههه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 30
subject = "الزواهرة وصل"
author = "kالزواهرة"
posted = "2006-05-27"
text = "وسع وسع وسع وصل ابو الزواهرة من الجامعه الهاشميه<br />شو اللي سمعته صايرلكو لسان وبتسبو عالزواهرة الزلمه يجي عالهاشميه وييحكي هييـــــــــــــــــك رح اطخه والله<br />صح لسان كل واحد اشاد وبالخص العبادي وانتو اهلها يا عبابيد اخوي الزهير بني صخر اقول خلك بدبي وانتاك هناك وانت شيخ طبيخ منت من شيوخ الارد\\ن يا خويفه وسلااااااااااااااااااااااااااااامي ابو عنود"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

