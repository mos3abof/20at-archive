posted = "2006-10-07"
text = "انا طالب في جامعه اردنيه في الجنوب بشوف بعض الطلاب يتعرضو الى نزعات عنصريه من طلاب في تلك الجامعه من اهل المنطقة ما بعرف شو الحل في هاذي الشغله لماذا هاذي العنصريه اهلنا وجدادنا ما كان عندهم مثل كذى ولماذا عندنا هاكذا الواحد منا ناوي دراسه وجد بنيه صادقه بس لما يشوف الوضع مثل هيك بيبطل له نفس وبيصير يفكر في تصرفاته اول شي ليش ما نكون طلاب وما لنا خص في هاذي الشغله احنا ما لنا خص فيي هاذي الشغله هاي الشغلات من عندهم واذا عتندهم استعداد يختصرو احنا بنختفر"
