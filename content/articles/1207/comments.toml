[[comments]]
order = 2
subject = "أنا جامعي من الأردن"
author = "معاذ سويد"
posted = "2006-01-15"
text = "انا طالب أردني تخرجت من الجامعة في 1/3/2005 ودرست في كلية الإقتصاد والعلوم الأدارية اللي حابب أحكي إنه ظاهرة الطوشة صارت روتينية مش بس في جامعات الأردن بل أيضا في كثير من جامعات الدول العربية وانا شخصيا ًكنت أعمل طوش في الجامعة مع طلاب ومع دكاترة أيضاً لكن مش يشكل شللية في الجامعة يعني كنت أتهاوش مع أي طالب راس براس بدون ماأخلي أي حدا من إصحابي يدخل أو من إصحابه وتنتهي الطوشة بالجامعة عادي لكن الأدهى من هيك إنه صار عنا بالأردن طوش بنات ببعض مثل ما صار بجامعة الهاشمية اللي انتشرت هذه السنة بنتين اتهاوشن وظربن بعض وحدة انفصلت من الجامعة ووحدة في المستشفى ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

