subject = "الرقم مش إله ما تردوا عليه"
author = "بنت عشاير"
posted = "2006-07-05"
text = "والله والله لولا معزت الزلمة الي إنت حاطط رقم تلفونه كان تجرجرتوا مع بعض للمخابرات بس أقسم بالله إنك مش زلمة ولا قد الكلمة الي إنت بتحكيها ولونك ربع زلمة ما بتحط رقم شخص محترم ومعروف بالبلد عشان تأذييه ونا متأكده من هاد الموضوع يا جبان.......... وليش إنت حتجيبه من بعيد منتا حثاله وحرام ينحكا عنك فلسطيني لأنه الفلسطينية عندهم دم ومحترمين ...<br />ونا نبهت الشخص إنك حاطط إسمه عالنت<br />يلي بتتحامى بأردني وبدك تأذيه عيب عليك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

