[[comments]]
order = 145
subject = "ابن الضفه الغربيه"
author = "نابلس-جبل النار"
posted = "2006-09-09"
text = "انا طالب من الضفه الغربيه بدرس بمدينه نابلس الصمود ودخلت الموقع بالغلط والله وبعد ما قرأت الي قرأتو اكتشفت انو انجس شعوب الارض هي الي موجوده بالاردن بغض<br />النظر عن اصولها فلسطينيه ولا اردنيه (الله يلعن دينكم ازا عندكم دين ) يا يهود الي مسميلي حالو شارون الله يبلك بمرض زيو يا ابن العاهره والي بفتخر بأشي مش موجود<br />الي بدي احكي انو انا اطلعت على الاردن 3 مرات بحياتي وشوفت الماعمله الي كانو الاخوان الاردنين يعاملونا فيها<br />الي منسميها بين قوسين (الماعامله الخره ) وشوفت وساخه الشعب الموجود هناك بغض النظر عن اصله وبدي احكي كلمه انو اقل من 10% بالميه<br />من الشعب الفلسطيني الموجود بالاردن بمثلنا احنا كضفاويين والباقي ان شاء الله عمرو ما برجع مع احترامي كل الاحترام والتقدير لكل فلسطيني<br />غيور على بلدو عن حق وحقيق وفي كمان اخوه اردنيه الهم مواقف حلوه مع الشعب الفلسطيني وبتمني تنتهي المشكله مع انها ما راح تنتهي<br />او تبقي المشكله بين الاردنين والفلسطينين الموجودين بالاردن وما تتتسرب لاهل الضفه الغبربيه وما حد يغلط على القائد الشهيد ابو عمار او شهدائنا<br />الابرار او اسرانا الخاضعين خلف قضبان الاحتلال والتحيه بل كل التحيه للقضيه الفلسطينييه وكل من ساهم بحلها اه صحيح بدي احكي للاخ الي<br />كان عم يحكي روحو حررو فلسطين بحب احكيلو انو الحدود للضفه الغربيه مغلقه تماما ووالله والله والله انو الحياه بفلسطين او بالضفه الغربيه تختلف اختلاف<br />كبير عن الحياه بالاردن وبحب احكي انو ما زلنا خاضعين للاحتلال الاسلاائيلي ومازلنا شعوب محتله وما في شعب عربي اخو شرموطه حاسس فينا<br />وانا متاكد انو الموقع هاد خرج من نصف تل ابيب اقسم بالله انكم فااااااااااااااااااااااااااااااااااااااااااااااااااااااضين اشغال عيب عليكم<br />يا ريتني ما كتبت هالتعليق اتأخرت على الجامعه والحواجز الاسرائيليه زي العمه ادعونا<br />وبالاخر بحكي لا بد للقيد ان ينكسر وللفجر ان ينجلي ومعا لتحرير ارض مغتصبه<br />سواعد حركه التحرير الوطنيه الفلسطينيه - فتح -<br />والله يهديكم قولو امين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 146
subject = "ضحكتوني"
author = "فلسطيني مزهزه"
posted = "2006-09-13"
text = "هههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههه<br />هههههههههههههههههههههههههههههههههههههههههه<br />هههههههههههههههههههههههههههههههههههههههههه<br />هههههههههههههههههههههههههههههههههههههههههه<br />هههههههههههههههههههههههههههههههههههههههههه<br />يعني انا راح اتبع نصيحه ابن الاصل وما راح ارد عليهم يعني من ناحيتي والحمد لله ارتحت لما شفت حكي شباب الاردن يعني الحمد لله راح تعليقاتهعم طمنتني على بقاء تخلفهم وزي ما حكو احنا ماكلين خير البلد وعلى الي شفتو من التخلف الي موتني ضحك بدنا كمان الف سنه واحنا نوكل خيرهم وشرفي متت ضحك واكثر من هيك ارتحت على مستقبل الفلسطينيه الي صارووو وين وين وهم عارفين وين هم هههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههههه<br />هههههههههههههههههههههههههههههههههههههههههه<br />هههههههههههههههههههههههههههههههههههههههههه<br />وشكرا لصاحب الموقع الي طمنا على تخلفهم"
