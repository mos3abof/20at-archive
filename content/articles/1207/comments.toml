[[comments]]
order = 36
subject = "تشوهون سمعة الأردن ونشاماها"
author = "يا جماعة الخير....والله عيب عليكم"
posted = "2006-05-30"
text = "انا إماراتي...ومالي خص بالاردن ولا عمري زرتها....لكن أقول لكم عيب والله عيب ...يعني أنتو تراكم قاعدين تعطون صورة وايد بشعة عن الأردن..بلد النشامى...ولما تقولون أن الهوشة تصير بالجامعة انا وايد مستغرب بصراحة؟؟؟<br />يعني إحنا اللي تقولون علينا بدو وما نفهم عمرها ماصارت بجامعاتنا هوشة مع إننا كلنا قبايل وعشاير ..لكن عمره ماصارت مشاكل..لانه جامعاتنا فيها قانون..وشبابنا يحترمون القانون...<br />عيب يا جماعة والله عيب اللي قاعد يصير..الأردن بلد النشامى وبلدالعشاير الأصيلة والبدوان الأوفياء...<br />أتمنى انكم تدركون معناة أنه واحد إماراتي ماله خص بالأردن ويتدخل عشان يفك نزاعكم...أتمنى أنكم تدركون!!!؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

