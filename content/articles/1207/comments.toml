[[comments]]
order = 13
subject = "فزعة"
author = "خالد الزواهرة (بني حسن)"
posted = "2006-04-23"
text = "انا حاب اردعلى شاهد عيان واقول انت ما تعرف الاردنيه احنا مش مثلكم وما بنخاف لا من يهودي ولا من حدا<br />انا ابن اكبر عشيرة بالاردن واقول ان المشاكل او الهوش الجامعيه كلها سببها الفلسطينيه لانهم هم اللي بيفتنو بين العشاير الاردنيه من قهرهم والحمد لله ما دخلو بني حسن بهوشه الا وفازو واخرها هوشتنا مع الفلسطينيه بالجامعه الاردنيه بالتحديد بكلية التمريض واللي يسأل يتاكد وسلامي لشاهد عين المنافق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 14
subject = "تصحيح"
author = "شارون الخزاعله"
posted = "2006-04-23"
text = "صح لسانك يا خالد البلى منهم لعنهم الله<br />انا من الاردنيه وكنت مشارك بذيك المشكله ودخلنى منهم 3 بالمستشفى منهم شب عقرباوي صابه ارتجاج بالمخ<br />الله لا يردهم واحنا الها واللي مش عاجبه يجي عالجامعه ويسال واحلى بني حسن _شعب الله المختار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 15
subject = "يا خالد الزواهرة وشارون الخزاعلة"
author = "ديانا كرزون"
posted = "2006-05-08"
text = "يا خالد الزواهرة وشارون الخزاعلة<br />أول اشي اللي صار في الجامعة الأردنية في كلية التمريض إنه الفلسطينية خبطوا على رووس العشاير الأردنية ونزلوا فيهم كتل بالعصي والسكاكين لما انشل عرضهم عالمزبوط وانا نفسي ضربت واحد اردني من بني حسن ودعست عليه لما اغمى عليه وراح عالمستشفى هو و15 واحد اردني من عشيرة الخزاعلة والزواهرة<br />علشان تعرفوا انه الفلسطينية كاسرين عينكم وين ما تروحواوداعسين على روسكوا في أي مكان وفي كل زمان<br />فهمت يا خالد يا كلب يا كندرة يا عنصري<br />وانت يا شارون الخزاعلة يا حقير يا واطي أوطى من كندرتي لو عندك شرف ما بتسمي حالك شارون اللي عمل المجازر بإخوانك من فلسطين بس انت واحد كندرة نذل صرماي ما في عندك شرف لا انت ولا عشيرتك<br />ولازم تعرفوا عالشغلة الفلسطينية ما بيعملوا لا فتنة ولا عنصرية مع العشاير<br />فهمت ولا انت وإياه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 16
subject = "يا ديانا كلسون"
author = "ربيع الخلايلة"
posted = "2006-05-14"
text = "يا ديانا انا من الجامعه الاردنية واحنا بني حسن كاسرين عيون الفلسطينيات وبجوز تكوني محدة من ضحيات بني حسن لهيك حاقدة عليهم وبجوز تكوني ام ابني هههههههههه<br />انا من الاردنيه واللي صار بكلية التمريض زي ما قال الزواهرة واذا حاب يتكرر اعطيني اسمك الرباعي ورح افتحك باب التمريض<br />وسلميلي على العصي اللي اكلتوها وعصاة اللحم اللي راح توكليها<br />حبيبي شارون اسمك كثير حلو واله مستقبل وشارون الله يشفيه ويرجع يدعس على حثالة الارض الخونه بياعين بلادهم اللي بيبلغو لليهود عن بعض بس الحق علينا اللي ضابينكو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 17
subject = "الاردن اولا"
author = "احمد ابو زيد"
posted = "2006-05-14"
text = "انا احمد ابو زيد اردني واللي سمعته من ديانا اشي كثير كبير احناا مكسورة عيونا من الفلسطينية؟ظحكتيني ولك اللي صار بالتمريض كل الجامعه بتشهد فيه انا مش من بني حسن بس والله ما قصرو هظلوكم وكتلوكم كتله شهدت الجامعه فيها وما سمعنا عن شرمووووطه ضربت حد من بني حسن والمشكله صارت لانه شب زواهرة فتح بنت عقرباويه وحملت منه واهلها طلبو تتزوج الشب والشب ما رضي واللي يسأل ما رح يخيب ظنه<br />اخوي خالد شارون ورببيع لا تهتمو بني حسن طول عمرهم شيوخ وانا متكد ان ديانا هي اللي حملت منكم وصارت المشكله عليها والا ما بتحقد لما انكسرت عينها وعين قرايبها الخون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

