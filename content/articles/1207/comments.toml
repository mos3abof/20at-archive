text = "لماذا نحن العرب هاكذا نحن شاطرين دعست على راسه ضربته ضربني اكبر عشيره بتعرفو يا شباب ان كل ولاد البلد الهم عشائر بتعرفو بدون مشاكل ليه ما نتشاطر على الياهود بتعرفو ان الدوله الياهوديه حطة حدودها وقالة ان حدها في غور الاردن خلينا اخوان خلينا نسايب بدون غلط على بعض بعدين بني حسن شيوخ الاردن ما اضن ان التصرفات هاذه تطلع منهم بعدين بدنا الموقع بدون مسبات"
