subject = "السبب"
author = "محمد العبادي"
posted = "2006-02-16"
text = "في الحقيفة لقد بحثت عن السبب الحقيقي لتلك (الهوشات )وبالتحديد بين أبناء عشيرتي فوجدت أن السبب لا يقتصر على فرد من عشيرة ولا من عشيرة كجزء من مجتمع ،ان السبب ينحصر بعدم وجود سبب أصلا فتصدر تلك المشاكل من لافائف العشائر (لفوفه) ليبن أنه ينتمي لهذه العشيرة لذا أقول لهذة الأشكال أنتم لا تشرفون أنفسكم فكيف تقبل هذه النفس أن تشرفكم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 6
subject = "أسباب تافهة"
author = "نذير ( جامعي أردني)"
posted = "2006-02-20"
text = "لو بدنا نرجع لكل مشكلة رح نلاقي إنه كل وحدة قائمة على أسباب تافهة، إشي عشان واحد شاف صاحبته مع شب ثاني ، وممكن أسباب طائفية وعنصرية سيئة ،وغيرها ، و كثير من الناس الواعيين ما بخلولها أي إعتبار لكن الجهل وعدم الوعي عند البعض ،هو اللي بسبب هاي الهوشات وعفكرة ، المشكلات اللي بتصير مش بس عنا بالأردن يعني ما لازم يكون في مجال لأغلوطة التعميم المتسرع على انه المشكلة هاي بس بالأردن والله يهديهم ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 7
subject = "الطالب الاردنى"
author = "شاهد عيان"
posted = "2006-03-06"
text = "هل يستطيع الطالب الاردنى الذى يتحرش<br />فى الطلبة العرب بسبب او دون سبب او<br />القاء كل الشتايم<br />على طالب اسرائلى يدرس فى الاردن او ان<br />يعمل اى حركة او الاقتراب منة او من<br />سيارتة اوينطق بكلمة او طالب من عرب 48<br />يحمل الجنسية الاسرائلية لانة يعرف بعدها<br />اين يكون ويتمنا ان امة لم تلدة<br />العمل الاول لااحديهتم فية ولان العرب ليس<br />احترام عندهم ولايعاقب علية القانون<br />اما العمل الثانى فهو يخل فى امن البلاد<br />ويعكر العلاقات بين البلادين وسوف يقف لة<br />جهاز الامن بلمرصاد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

[[comments]]
order = 8
subject = "هزمتنا الردة"
author = "الدوايمة"
posted = "2006-04-15"
text = "تخلينا عن بعضناوأصبح منا القوي ينهش من لحم الضعيف تفرقنا وابتعدنا عن كل المبادىء والقيم الإسلامية والعرف العالمي ، أصبحنا نتبع عالم الغاب<br />،في جامعاتنا الأخ يبغض اخيه ذبحتنا الحمية العصبية اللتي لا تقوم لا على مبدأ ولا على دين .أصبحن نهتم بمن له الأحقية في البقاء في الوطن كأن الوطن لقمة سهلة يتناولها فك الإنسان الهمجي ، لا فالوطن ليس أرض فقط هو روح تسير في أفئدة أبنائه الشرفاء فهو لا يباع ولا يشترى.<br />ي}سفني أن أضرب مثلا من الغرب ولكن أثارني أن usa متحدة على الرغم أنها من ألف منبت وعرق ودين فالأميركي يفتخر بأمريكيته وقد يكون عربي وله نفس الحقوق ونفس التعامل ،<br />أما نحن فقد قتلتنا الردة انا أردني الأصل وانا فلسطيني الأصل وأنا من السعوديين وأناشركسي .......الخ وانا أقول أنا عربي موطني الأردن ... والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

