text = "ولك ياحسام يا اخو الشرميط نسيت لمانكنا خواتك قدام عينيك وانت صغير ماتعرف شو يعني اجي عندك عالبيت؟ ياقرن وهسا جاي تعمل زلم عالفلسطينيه سيبك من الزلوميه مش الك الها رجاله بكره برجعوا الفلسطينيه وبتعيش عخيرهم وبحمو طيزك من اليهود اخوانك وبخلو بلدك خرابة ومين قلك انه الفلسطينيه مذللولين بالاردن بالعكس عايشين احسن عيشه عظهر الاردنيه وبكره بشتروا اراضيكو وبسوها وطن بديل وبكبوكوا بره وبتصيروا تطالبو بحق العودة هيك اليهود محتلين فلسطين وهمة محتلين الاردن اعرفك عحالي انا اردني بس امي فلسطينيه مابدي اخبي عليك ابوي مغلبنا بس صابرين عليه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134218/http://www.20at.com/article2.php?sid=96"

