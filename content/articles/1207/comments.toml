text = "تعمدت اقول ولد لأنك ولد ولما رنيت على رقمك طلعلي شوت زلمة للأسف بس صوت ...<br />بس عيب علي إذا رقمك ما يوصل للمخابرات ...<br />بس عشان تعرف إن الله حق أصبر على حالك شوي"
