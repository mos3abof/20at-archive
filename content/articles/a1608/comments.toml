subject = "الاستاذ الي حيطق من جنابه"
author = "نت يا اخ انت ما تتلم وتخليك في حالك صورتهم وهم احرار فيها افرض انهم نشروا صورتهم في اي مجلة يعني اتنين متجوزين وفرحانين الي مضايقك يعني والعروس مظهرها محتشم وشرعي فخلاص ملكش حاجة عندهم!!"
text = "جاتك القرف في نكدك"
archived = "2006-11-02"
