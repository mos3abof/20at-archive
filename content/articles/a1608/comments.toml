[[comments]]
order = 6
subject = "كالعادة"
author = "يه يا جماعة دايما نسيب أصل الموضوع ونمسك فى الفروع ونتخانق عليها"
text = "هل الغرب كده؟ ولا احنا لوحدنا ؟ الموضوع فعلا مفيد لأن الفرح حاجة بتمس كل الناس بدون استثناء<br />يا رب نبقى موضوعيين فى تفكيرنا يااا رب<br />شكرا يا سارة....ماشاء الله صورتك مشرفة وأتمنى كل البنات يكونوا زيك يوم فرحهم,,محتشمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144830/http://www.20at.com/article.php?sid=1608"

