[[comments]]
order = 4
subject = "سقطة لمصطفى محمود"
author = "الفرق بين فريقي \"فريق الوعد\" وفرق زمان هو طريقة التفكير، فنحن نتعامل مع الفرح على أنه فرح ل(مظاهرة (!))"
text = "احترم الاخ مصطفى محمود وما يقدمه من لون مختلف بعض الشيء عن الفرق الاخرى ..لكن ليس معنى نجاحك ان تضفي على الاخرين صفة ليست فيهم ... من قال لك ان الفرق الاخرى (زمان ) كانت تعمل مظاهرة وليست فرح أنت اول ما بدأت عملت مع فرقة النور الاسلامية وقبلها كانت فرق الندى والفتح والشروق وغيرها من الفرق التي لها السبق في المجال الفن الاسلامي والتي كانت تقدم الكلمة واللحن المتماشي مع وقتها وجاء التطوير الذي لابد ان يلحق بأي فن كي يتواكب مع المجتمع ومجريات التطور العام الذي يسود المجتمع فخرجت لنا فرقا جديدة منها فرقتك وفرقة الهدى وبسمة الاندلس وغيرها من الفرق التي ألحظ فيها تشابها يكاد يكون بالكربون بينهم جميعا<br />اخي الكريم اربأ بك أن تدع لنفسك ما ليس صحيحا<br />مجاهد أحمد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144830/http://www.20at.com/article.php?sid=1608"

