[[comments]]
order = 0
subject = "إنتو ليه حطين صورة إسلام و مراته ...ميصحش يا جدعان"
author = "شيلو صورة اسلام و مراته ...."
text = "بجد ميصحش علشان مهنياً الصور الى بتظهر فى وسائل الاعلام نوعين<br />1- صور مهنية و الى بيكون متصورها موديل او شخصية عامة ( ممثل - سياسى - لعيب كورة )<br />2- صور خاصة ودى لازم تكون بموافقة صاحب الصورة او يكون فى كلام اساساً عنه فى التحقيق او المقال<br />و يتهيألى والله اعلم ان اسلام لا هو شخصية عامة ( مش جمال مبارك مثلاً ) ولا الموضوع انتو خدتو رأيه فيه !!!<br />فشيلوها احسن بطلو تهريج"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144830/http://www.20at.com/article.php?sid=1608"

[[comments]]
