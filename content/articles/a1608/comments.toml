subject = "مفاجأأأأأأة"
author = "سلام و مراته..."
text = "مراته اسمها \" سارة جماااااااااال\" ..و هي اللي كاتبه المقال...يبقى تفتكر اخدوا رأيها ولا لأ؟؟!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144830/http://www.20at.com/article.php?sid=1608"

[[comments]]
order = 2
subject = "تهرييييييييج ...باييييييييييييييييخ...مالوش لازمة"
author = "يا جدعان شيلوها ولو برضك ...يعنى إيه تنحط صورة واحد و مراته على موقع الكترونى حتى ولو كات كاتبة المقال هى صاحبة الصورة....!"
text = "المواضيع فيها شوية خصوصية ...و انا ايه الى يخلينى اشوف مرات واحد صاحبى ...<br />انت يا عم اسلام ....قولهم يشلو الصورة دى ...<br />الامور دى خاصة \" المفترض عند الناس الى بيدعو انهم ملتزمين \" و واجعو دماغنه بالالتزام و التدين.......<br />سيليها يا ست سارة ربنا يهديكى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144830/http://www.20at.com/article.php?sid=1608"

[[comments]]
