text = "عندما تمتلئ (المقاهي) بالشباب … وتشكوا المساجد والمكتبات من<br />الغياب..<br />ابتسم …أنت في دولة عربية<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ ـــــــــــــــ ــــــــ<br />عندما يستضيفون (راقصة) لتتحدث عن (تحرير) فلسطين …<br />ابتسم …أنت في دولة عربية<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ ـــــــــــــــ ــــــــــــــ<br />عندما تدرس الابتدائي 6 سنوات .. والإعدادي 3 سنوات ومثلها المرحلة الثانوية .. وأربع سنين في الجامعة أو خمسة .. لتعمل بعدها في سوق الخضار ..<br />ابتسم …أنت في دولة عربية<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ ـــــــــــــــ ــــــــــــــ<br />عندما يكون هناك ستة ملايين (عامل) أجنبي .. وثلاثة ملايين (عاطل)ا .<br />ابتسم …أنت في دولة عربية<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ ـــــــــــــــ ــــــــــــــ<br />عندما تقوم من النوم لتجد في هاتفك المحمول رسائل ليس لها أي معنى …<br />ابتسم …أنت في دولة عربية<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ ـــــــــــــــ ــــــــــــــ<br />عندما تكون هناك (خمسة عشرة) مجلة تهتم بـ (الشعر الشعبي( ولاتكون هناك مجلة واحدة أو (نشرة) تهتم بالأمور العلمية …<br />ابتسم …أنت في دولة عربية<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ ـــــــــــــــ ــــــــــــــ<br />عندما تذهب إلى تلك المنطقة في بلدك .. فلا تجد منهم من يتحدث العربية وتظن أنك تعديت الحدود حتى وصلت إلى (دكا)…لا تستغرب … أنت في أسواق إحدى دول الخليج حيث كل البائعين أجانب<br />ابتسم …أنت في دولة عربية<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ ـــــــــــــــ ــــــــــــــ<br />عندما (تضحك(عليك شركة الاتصالات في بلدك و(تشفط) كل اللي في جيوبك .."
