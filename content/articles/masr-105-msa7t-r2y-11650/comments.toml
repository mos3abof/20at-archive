posted = "2009-03-24"
text = "أرسل هذا التعليق بواسطة : شريف الدواخلى<br />الموضوع بجد عجبنى جدا يا استاذ بلال لدرجة انى قريته أكتر من مره \" تصور ديه \" وده لان الموضوع معمول فيه شغل صحافة محترفين من اول كلمة لنهاية الموضوع وناخد حاجة حاجة<br />1- توافر عنصر السرعة فى تغطيه الحدث<br />2- المعالجة المتكاملة لكل جوانب الازمة<br />3- التزام الموضوعيه بشكل رائع فى الموضوع<br />4- الاسلوب كان دسم جدا بس واضح قوى<br />وعلى فكره يا بلال انتا من احسن الناس اللى بكتب فى الموقع من وجهه نظرى المتواضعة"
archived = "2009-04-20"
