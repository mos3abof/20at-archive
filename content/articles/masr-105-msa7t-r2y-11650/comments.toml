text = "بعد الاطلاع على الأوراق وسماع المرافعة والمداولة<br />وحيث ان النيابة العامة أقامت الدعوى رقم 9446 لسنة 2008 جنايات<br />ضد المتهم<br />(؟؟؟؟؟؟؟؟؟؟؟)<br />لأنه بتاريخ 2342008 بدائرة مركز شرطة ؟؟؟؟<br />أولا: خطف وحجز بغير وجه قانوني المجني عليها (؟؟؟؟؟؟؟؟؟؟؟) بأن اعترض طريقها ووضع سكين عند خاصرتها وأخذها الى مقر سكنه وحجزها فيه وكان ذلك مصحوبا باستعمال القوة والأذى الجسيم على جسدها.<br />ثانيا: احدث عمدا بالمجني عليها عاهة مستديمة نسبتها 3% على نحو ما جاء بتقرير الطب الشرعي.<br />ثالثا: اعتدى على سلامة جسم المجني عليها والحق بها الإصابات الواردة بتقرير الطب الشرعي والتي أعجزتها عن القيام بأعمالها الشخصية مدة تزيد على عشرين يوما."
archived = "2009-04-20"
capture_url = "https://web.archive.org/web/20090420043544/http://www.20at.com:80/masr/105-msa7t-r2y/11650.html"
