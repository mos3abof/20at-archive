text = "الأم .. وما أدراك ما الأم .. إنها إحساس ظريف .. وهمس لطيف .. وشعور نازف بدمع جارف ..<br />الأم .. جمال وإبداع .. وخيال وإمتاع .. وجوهره مصونة ولؤلؤه مكنونه ..<br />الأم .. كنز مفقود لأصحاب العقوق .. وكنز موجود لأهل البر والودود ..<br />الأم .. تبقي كما هي .. في حياتها وبعد موتها .. وفي صغرها وكبرها .. فهي عطر يفوح شذاه .. وعبير يسمو في علاه .. وزهر يشم رائحته الأبناء .. وأريج يتلألأ في وجوه الآباء.. ودفء وحنان .. وجمال وأمان .. ومحبه ومودة .. ورحمه وألفه .. وأعجوبه ومدرسه .. وشخصيه ذات قيم ومبادئ .. وعلو وهمم .. وهي المربية الحقيقية لتلك الأجيال الناشئة :<br />الأم .. مدرسه إذا أعددتها أعددت شعبا طيب الأعراق<br />الأم .. هي قسيمه الحياة .. وموطن الشكوى .. وعماد الأمر .. وعتاد البيت .. ومهبط النجاة .. وهي آية الله ومنته ورحمته لقوم يتفكرون ..<br />الأم .. صفاء القلب ونقاء السريرة .. ووفاء وولاء .. وحنان وإحسان .. وتسليه وتأسيه .. وغياث المكروب ونجده المنكوب .. وعاطفة الرجال ومدار الوجدان .. وسر الحياة .. ومهاج الغضب .. ومقعد ألألفه .. ومجتلى القريحة .. ومطلع القصيدة .. وموطن الغناه .. ومصدر الهناء ومشرق السعادة ..<br />الأم .. أشد أمم الأرض بأسا .. واسماها نفسا .. وأدقها حسا .. وأرسخها في المكرمات أقداما .. وارفعها في الحادثات أعلاما .. واقرها في المشكلات أحلاما .. وأمدها في الكرم باعا وأرحبها في المجد ذراعا ..<br />الأم .. كوكب مضي ء بذاته .. ويسمو في صورته وسماته .. وأجمل بلسما في صفاته ولها منظرا أحلى من نبراته .. ونفس زكيه طاهرة بصلاته .. وجسما غريباً يبهر في حجابه .. وعيوناً تذرف الحب بزكاته .. جدها عبرة .. ومزحها نزهة .. نخلة عذبة .. وشجرة طيبة .. ومخزن الودائع .. ومنبع الصنائع ..<br />الأم .. نعم الجليس .. وخير الأنيس .. ونعم القرين في دار الغربة .. ونعم الحنين في ساعة القربة"
archived = "2009-04-20"
capture_url = "https://web.archive.org/web/20090420043544/http://www.20at.com:80/masr/105-msa7t-r2y/11650.html"

