text = "الام المصرية تختلف عن اى ام<br />بمرتب زوجها الضئيل جدا بتخللى بيتها نظيف ومرتب وكل يوم فية كفاح واصرار انها تاكل عيالها احسن اكل<br />لما تلاقى ام فاتحة بيت فية اطفال بمرتب الزوج 250 جنية وبيتها مرتب وبتاكل عيالها وتعلمهم - لما تشوف دة على الواقع تحس مدى عظمة الست المصرية البسيطة الصابرة<br />وطبعا لا ننسى امنا الكبيرة مصر - ام الصابرين - وربنا يبدل كربها وصبرها خير ويرفعها من المصيبة اللى هى فيها"
