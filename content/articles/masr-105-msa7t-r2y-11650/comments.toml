posted = "2009-03-24"
text = "عتقد أن كل انسان له تجربة فريدة من نوعها مع أمه .. ترددت كثيرً في كتابة هذه التجربة وذلك خوفاً مني في ألا أستطيع تسجيل كل المشاعر الجميلة التي أكنها لها في نفسي .. وعندما اتحدث عن هذه السيدة العظيمة فأنا أتحدث عن نموذج يستحق التأمل والتفكير في الصيغة التي صيغت بها هذه الشخصية القوية..الصلبة..الحيوية ..الغنية بكل معاني الأمومة والعطاء بلا حدود واعتقد كما قال لي استاذي الفاضل سليمان مدرس الفيزياء (رحمه الله) عندما كنت طالباً في الثانوية العامة معلقاً علي نتيجة الأم المثالية \" إن أم كل منا هي الأم المثالية الأولي لعائلتها وللمجتمع وللدنيا كلها \" وذلك كان تعليقاً علي مسابقة وزارة الشئون الاجتماعية لاختيار الام المثالية.<br />ولكن اخيراً قررت الكتابة عن ست الحبايب وأم الإرادة والتحدي والنجاح.. فأمي يا سادة يا كرام حاصلة علي دبلوم المعلمات دفعة &—1633;&—1641;&—1637;&—1639; من مدينة السويس وعملت في التربية والتعليم طوال &—1635;&—1639; عاماً من العطاء المتواصل في مجال التربية والتعليم والحمد لله لم يلوث مالها بأموال الدروس الخصوصية ولم تلجأ إليها في أشد الظروف قسوة وذلك رغم وفاة الوالد رحمه الله في سن مبكرة ( من &—1634;&—1640; سنة ) والاحتياج الشديد للأموال ولذلك بارك الله لها في أموالها وأولادها وصحتها ووهبها الكثير من حب الناس ولم تجعلها الظروف الصعبة التي مرت بها تتنازل عن المباديء والقيم التي اخترتها لنفسها في زمن تجد فيه الكثير من الرجال قبل النساء يسقط في مستنقعات الحرام مع أول اختبار حقيقي من الله.<br />عندما تفقد المرأة زوجها في سن مبكرة وتجد نفسها وحيدة و ولديها ثلاثة صغار ولا يوجد لها سند أخر في الحياة ولا تلجأ الي ما يغضب الله من دروس خصوصية أو فرض اتاوات علي المدرسين بحكم منصبها في المدرسة لكي تستطيع تربيتهم احسن تربية وتعطيهم افضل تعليم وافضل رعاية نفسية وصحية وتزرع فينا القيم والاخلاق فانت امام نموذج فريد يستحق الشكر والتقدير.<br />طالما تساءلت ما هي القوة النفسية التي وهبها الله لهذه السيدة العظيمة وجعل الكثير من الايام الصعبة تمر علينا وهي صامدة وحدها تصارع ظروف الحياة فاذا بالاجابة تأتي علي لسانها عندما كنا نجلس سوياً مع زوجاتنا واولادنا ( احفادها) ونسترجع تلك الذكريات الصعبة فاذا بها تفاجئنا بانها كانت تسهر الليل تناجي الله عز وجل وتصلي له ان يجعل هذه الايام تمر وننجو منها ومن اثارها السيئة علينا فاذا بها تمر وسخر لنا الله من يقف معنا ويساعدنا ويجعلها أياماً خفيفة علينا بل نتحاكي اليوم بها ونتمني يوماً منها كي نستعيد معه المشاعر الجميلة التي جمعت بيننا كأسرة واحدة مترابطة متماسكة تنتظر اليوم الذي نصل فيه الي بر الأمان والحمد لله وصلنا اليه سالمين غانمين .. ولكن تبقي حقيقة واحدة وهي أن أمي لم تقرأ أو تسمع يوماً من أحد يحثها علي قيام الليل ولكنه الطريق الذى أرشدها الله إليه ليكون لها عوناً ونجدة ويحفظها ويحفظنا من كل سوء.<br />الكثير منا يعمل وله الكثير من الطموحات في أن يرتقي أعلي المناصب في مجال عمله ولكنني رأيت أمي تعرض عليها الترقيات في مجال عملها ورأيتها تتنازل عن كل ذلك بدون أي تردد وذلك كي تستطيع ان تركز في أمراً واحداً وهو حسن رعايتنا فالمناصب تعني وقتاً أطول بعيداً عن البيت ومشغوليات أكبر وذلك يعني حدوث تقصير في الرعاية والتربية .. لذلك كلمة \"لا\" كانت دائماً من نصيب الترقيات والمناصب فاذا بالله عز وجل يأتي لها بهذه الترقيات جميعاً دفعة واحدة قبل بلوغ سن المعاش وبعد أن أدت رسالتها كاملة نحوها .. ليقول لها الله عز وجل في رسالة واضحة \"ما جزاء الاحسان الا الاحسان\" .. كم انت عظيمة يا أمي.<br />اختلف مع أمي في كثير من الأراء ووجهات النظر الحياتية ولكني أكن لها كل الحب والتقدير والامتنان ولا اعتقد أني قد أوفيتها بهذا الكلام حقها أو القليل من مواقفها ومأثرها الجميلة نحوي وأخوتي وقد بلغت هذا العام الثانية والسبعين من عمرها وأراها كما عودتنا دائما مازالت تعطي نصائحها وعواطفها ومشاعرها لنا ولأولادنا ولزوجاتنا ولجيرانها ولأهلها ولكل من حولها فهي تساعد كل من يحتاج منها المساعدة فتعين الفقير والمسكين والمريض وذو الحاجة وتفعل الكثير من الخيرات التي لا نعرفها فعندما رزقها الله من حيث لا تحتسب فلم تأخذ من هذا الرزق الا ما يكفي قوتها واحتياجها العادي من الحياة واكتفت بما اعطاها الله من ذلك أما ما يتبقي منها وهو كثير فلا نعرف عنه شيئا فلا يوجد في بيتها ولا حسابها البنكي الذي لا يوجد من الاساس أي مبالغ نقدية صغيرة أو كبيرة وهي تفعل ذلك لانها تبتغي ماعند الله في الدار الآخرة وما عند الله خيراً وأبقي .. أقول بكل فخر .. هذه المرأة هي .. أمي.<br />تري هل ذكرت كل شيء عن أمي .. لا أعتقد ذلك .. ولكن هذه الشخصية لم تعرف ما نطلق عليه اليوم التنمية البشرية ولم تتلقي دورات ادارية أو تقنية أو علم البرمجة العصبية ولكن عقلها يوجد فيه كلمة واحدة تصر عليها دوماً .. النجاح.. فقط النجاح. لها ولمن حولها.. شخصية جادة جداً .. مرحة جداً .. مبتكرة جداً .. نشيطة جداً .. منظمة جداً.. تفعل الكثير بأقل مجهود ممكن .. اجتماعية جداً.. صريحة جداً.. تصر علي الحياة الفعالة حتي أخر يوم من عمرها.. وأطال الله في عمرها.. هذه هي أمي.<br />أمي .. اكتب هذه الكلمات وانظر اليكي في داخلي فأجد كل الإعجاب لهذه الشخصية القديرة .. العملاقة .. المؤثرة .. فلكي مني كل الشكر والحب والعرفان بالجميل.<br />ابنك<br />أحمد ع"
