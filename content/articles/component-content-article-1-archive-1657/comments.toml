text = "السلام عليكم ورحمة الله وبركاته ..<br />يا أمة محمــــــد بن عبدالله ...<br />رسول الله يبتســـــم .... يبتسم لنــــــــا ... وهو راض عنـــــــا ..<br />بأبي أنت وأمي يا رسول الله .. ابتسامتك تغنينا عن الدنيا وما فيهـــا ...<br />أخوتي ...<br />هي رؤيـــا رآهـــا اثنين من المشائخ في السعودية ( تركي الزيد , أحمد الحواش ) .<br />رأوا الحبيب بكـــامل صفاته التي ذكرها عنه الصحـــابة ...<br />يبتسم و أخبرهم أنه راض عن أمته ... ( راضٍ عنـــــــا .. ؟ نعـــم . )<br />يا أمة محمد .. المصدر مؤكد مئة بالمئة ... ولقد انتشر هذا الخبر في السعودية ...<br />وعلى رؤيـــا اثنان من المشائخ الأجــــــلاء ...<br />يارسول الله .. نحورنا دون نحرك ..<br />أحقـــاً رسمنا الإبتســــامة - أخيراً- على محيـــــاه ..!<br />يبتســــم ..مع أن في أمتـــه من هو لاهٍ في الدنيـــا غافل عن يوم الحساب ..<br />يبتســــم .. ونحن مقصرون في ديننــــــا ..مقصرون في الاقتداء به ..صلى الله عليه<br />وسلم<br />جـــاهد .. وأخرجنا من الضلال إلى النــــور ..كنا على شفا حفرة من النار فأنقذنا منها ..<br />أوذيت في الله لم تهزم ولم تهــــن..<br />..حتى غدت أمة الإسلام في النجم<br />ثـــم ننســـى -نحن- كـــل ذلك ... وننسى سنتــــه ... بل سيرته ..<br />فتنتشر رسومـــات السخرية علنــــاً عليـــه -صلى الله عليه وسلم - ..!<br />فلنتحـــرك .. بــ مقــــاطعــــة ...!!<br />فــ يبتســــم ..!!<br />صلى الله عليــــه وسلــــم ..<br />يا أمـــة محمد...<br />رسول الله ..يبتســــــــم .. وهو راض عنـــــــــكم ..راض عنــــــــكم"
