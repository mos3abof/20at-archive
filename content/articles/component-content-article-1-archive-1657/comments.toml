[[comments]]
order = 44
subject = "الرد على الدنارك"
author = "عبد المجيد قدورة"
posted = "2006-02-07"
text = "يا عرب صابتكم شتيمة<br />ولا تزالو في خمول<br />بالغرب ابقار سمينة<br />شتمت محمد الرسول<br />فلتسمع الدنمارك مني<br />فاني اعرف ما اقول<br />بلد الخنازير الحقيرة<br />ومليكها كلب خجول<br />وازا تحدث فيها شخص<br />تحسبه من فمه يبول<br />دنمارككم هي كالحظيرة<br />وشعبكم فيها يجول<br />والصحف فيها للمواشي<br />ومثقفيها كالمغول<br />فرسولنا خير البريا<br />شفتاه اخرجت الفضيلة<br />وعلمتنا ما نقول<br />ومن رسالته فهمنا<br />تمييز خطا من صواب<br />وحديثكم خير الدليل<br />بانكم صرتم كلاب<br />لا لن اشبهكم بعضو<br />فالعضو يعرف انتصاب<br />ولن اشبهكم بثور<br />فالثور يحدث انقلاب<br />خجولة منكم ضفادع<br />وبريئة منكم دواب<br />اشكالكم عنوان شؤم<br />فقتم بها ما للغراب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

[[comments]]
order = 45
subject = "هل يستحقون ذلك"
author = "ايمن الضمور"
posted = "2006-02-09"
text = "هل تستحق الرسومات كل ردود الفعل الاعلامي والمقاطعة ؟ الكاتب ايمن الضمور<br />باعتقادنا انها تستحق اكثر من ذلك بكثير , لان الواقعة ليست بالامر الهين والتي من الممكن السكوت عنها , فالرسوم هي سخرية وانتهاك لحرياتنا كمسلمين وهي تستهدف حامل الرسالة والدين الاسلامي النبي محمد صلى الله علية وسلم , فاذا تم استهداف النبي وهو رمز مصداقية الاسلام فسيصبح جميع مانؤمن به هو بالتالي محل استنكار واستهداف ,وبالتالي وستنتقل الفكرة بالتدريج الى المعتقدات وسنتخلى عنها او سنخجل من اتباعها فان نبينا وهو حامل رسالتها اصبح محل استنكار وسخرية العالم ,<br />وحالنا معروف الان فان بعضنا في بعض البلدان اصبح يخجل ويجد حرجا في الاشارة الى انتمائه الديني ( بطبيعة الحال هذه الفئة هي من ضعاف النفس والعقيدة ) وذلك لما قد يتسبب بة لهم من مشاكل وصعوبات في التعايش ( هذا الامر هو احصل فعلا ) كل ذلك بسب تحامل المعادين للاسلام على ديننا وتشوية سمعته بكل الوسائل التي يتمكنون منها<br />اليست هذه باسباب اكثر من كافية لمن يتسائل هذة الايام عن احقية استحقاق الرسوم ردود الفعل التي تعتبر حتى الان متواضعة<br />هناك امر اخر , ان سكتنا هذه المرة فلن تكون هناك مرات قادمة , فيسيعلم العالم اننا اعمالنا هي فقاعات لاتلبث ان تزول , وعندها لن يردعهم رادع<br />لمن لايزال يتسائل !<br />هل رأيت او سمعت يوما ان احدا تجرأ على الديانه اليهودية كما يتجرأون على الاسلام ؟<br />هل رأيت او سمعت يوما ان احدا تجرأ على الديانة المسيحية كما يتجرأون على الاسلام ؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

[[comments]]
order = 46
subject = "الدفاع عن حبيبنا"
author = "مني"
posted = "2006-02-13"
text = "ان ما تنشرهالصحف الدينماركية والنرويجيةمناهانات لحبيبنا محمد يعتبر اكبر اهانة لللاسلام والمسلمين هم يهدفون الي تشويه صورة رسولنا وديننا ولكن المسلمين لن يسمحو لهذه الدول بتحقيق هدفها بل سيعملون علي فناء وطمس هذا الهدف لان الامة الاسلامية ما زالت بخير ولكي نثبت للغرب ان الامة الاسلامية ما زالت بخير يجب علي المسلمين ان يقفوا وقفة رجل واحد يقاطعوا السلع الاوربية عامة والدينماركية والنرويجية خاصة ويجب طرد كل شخص يحمل جنسية نرويجية او دينماركية من كل دولة اسلامية ويجب علي الاعلام ان يركز علي هذا الموضوع اكثر من كل المواضيع لان الاعلام هو من اكثر وسائل تفعيل اي موضوع ونشره ويجب ان تقوم المظاهرات في كل الشوارع الاسلامية والعربية تندد بهذه التشويهات لرسولنا يجب عليكم ايها الحكام ان تفيقوا كفاكم تخاذلا ام انكم اخذتم منوم الي الابد اليس رسولنا اليس هو من اخرج الناس من الظلمات الي النور اليس هو من تحمل مشاق الدعوة الاسلامية من اجل ان يقينم الدولة الاسلامية الم ياتي باالقران الذي هو شفيع قلوبنا الم يحثنا علي المحبة والخير والسلام والحرية والساواة الا يستحق ان ندافع عنه بلي ويستحق ان نموت من اجل بقاء صورته وصورة الاسلام نقية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

