[[comments]]
order = 11
subject = "السود في أميريكا قاطعوا الباصات لأنهم اعتدوا علي أميريكية سوداء"
author = "عبدالله"
posted = "2006-01-27"
text = "السود في أميريكا قاطعوا الباصات في أميريكا وأصبحوا لا يستخدموها لأن البيض الأميريكان أهانوا إمرأة سوداء وأصبح السود يستخدمون العجلة بدلا من الباصات مما أحدث خسائر كبيرة في شركات النقل في أميريكا مما اضطر المسئولين عن الباصات للإعتذار للمرأة السوداء وللسود في أميريكا وغيروا القانون من أجل السود... فلماذا ونحن أمة محمد صلي الله عليه وسلم لا نقاطع منتجات الدنمارك والنرويج دفاعا عن خير البرية حبيبنا ورسولنا محمد صلي الله عليه وسلم ونحدث خسائر بالمليارات لهذه الدول لكي يعلموا بأن الرسول محمد قد مات وخلف بعده رجالا ونساءا أقوياء بطاعة الله ورسوله ؟ نعم لازم نقاطع منتجات الدنمارك والنرويج وأي بلد يعتدي علي مقدساتنا ومعتقداتنا وكفايانا هوان وذل وقلة حيلة. وانظروا إلي فضائيات الرقص والأفلام وأغاني الفيديو كليب العربية ولا كأن الرسول قد تم الهجوم عليه ... عارفين ليه؟ لأن هذه الفضائيات إنما وجدت لكي تشغلنا عن ديننا وعن إسلامنا ... ومقاطعة هذه البضائع رد بسيط ولكنه فعّال لردع من تسول له نفسه التعدي علي معتقداتنا ... والدنمارك الآن بدأت تخاف جدا من هذه المقاطعة وأصبح سفيرها في السعودية يترجي من السعوديين أن يتفهموا الأمر ولكن الحمد لله السعوديين طنشوه واحنا كمان لازم نقاطعهم والنرويج كمان فالرسول محمد رسولنا كلنا ورسول العالم كافة ويجب أن ننتصر له."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

