[[comments]]
order = 4
subject = "المقاطعة ليست الحل"
author = "يا شباب الاسلام -لست ضد المقاطعة - ولكن ليست هي الحل."
posted = "2006-01-26"
text = "الحل - يا شباب الاسلام - هي أن تكون قويا مهابا ، تهابك الامم فلا تتجرأ على ثوابتك.<br />وحتى ننال هذه القوة لابد من اقامة دولة الشريهة -التي يتفيأ ظللاها كل مسلم - ولن تكون هذه الدولة الا باسقاط الطواغيت.<br />فإن كنت تزعم حب محمد -صلى الله عليه وسلم - فاعمل ما تستطيع لتخليص الامة من طواغيتها ، فهم -والله - الحجر الكؤود أمام وحدتها وعزتها.<br />عندئذ تهابك الامم فلا تتجرأ على رموزك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

