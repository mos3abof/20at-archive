text = "السلام عليكم و رحمة الله و بركاته<br />صحف أوربية تعيد نشر الرسوم المسيئة للنبي عليه الصلاة والسلام<br />أعادت عدة صحف أوربية الأربعاء 1-2-2006 نشر الرسوم الكاريكاتيرية المسيئة للرسول صلى الله عليه وسلم، والتي كانت صحيفة \"جيلاندز بوستن\" الدانمركية نشرتها لأول مرة متسببة في موجة غضب عارم لدى المسلمين في أرجاء العالم.<br />ففي باريس، أعادت جريدة \"فرانس سوار\" الفرنسية في عددها الصادر الأربعاء نشر الرسوم الاثني عشر المسيئة، وقالت: إنها اختارت نشرها لأن بعضها \"طريف\".<br />وعلى صدر صفحتها الرئيسية قالت الصحيفة تحت أحد هذه الرسوم: \"نعم لنا الحق في رسم رسوم كاريكاتيرية لله\"، معلنة أن موقفها هذا يأتي \"دفاعا عن حرية التعبير\".<br />كما اعتبرت \"فرانس سوار\" أن الرسوم الكاريكاتيرية المنشورة لا توجد بها أي من \"الإحالات العنصرية أو مس بشرف أي معتنق لدين\".<br />\"أقل نفاقا\"<br />وفي ألمانيا، أعادت صحيفة \"دي فيلت\" اليومية نشر 4 من الرسوم المسيئة، إحداها على صدر صفحتها الأولى، أما الصور المتبقية فعلى صفحاتها الداخلية.<br />وقالت الصحيفة في مقالها الافتتاحي: إن \"احتجاج المسلمين كان يمكن أن يؤخذ على محمل أكثر جدية لو كانوا هم أقل نفاقا\".<br />وأوضحت قائلة: \"عندما عرض التلفزيون السوري -خلال وقت ذروة المشاهدة- أفلاما درامية وثائقية تصور حاخامات يهود على أنهم من آكلي لحوم البشر، فإن الأئمة التزموا الصمت\".<br />وفي إيطاليا نشرت صحيفة \"لا ستامبا\" الإيطالية هذه الرسوم المسيئة للنبي في عددها الصادر اليوم، بينما نشرتها صحيفة \"كوريرا ديلا سيرا\" الإثنين الماضي مصحوبة بتعليق للكاتب المسلم مجدي علام.<br />ورغم وصف علام لهذه الصور بأنها \"بالتأكيد مثيرة للجدل\" فإنه اعتبر في تعليقه أنه \"من واجب الغرب أن يدافع عن حرية التعبير\".<br />وأردف أنه من حق الغرب أيضا \"ألا يدفن رأسه في الرمال كالنعامة في مواجهة النقد حتى لا يسقط (ثيو فان جوخ) آخر بالعاصمة الدانمركية كوبنهاجن\".<br />وذلك في إشارة إلى المخرج الهولندي ثيو فان جوخ الذي قتله شاب هولندي من أصل مغربي بعد إخراجه لفيلم مسيء للإسلام.<br />تصادم ثقافات<br />وفي سويسرا، نشرت صحيفة \"بليك\" رسمين من الرسوم المسيئة أمس الثلاثاء، فيما قالت صحيفة \"تريبيون دي جينيف\": إنها ستنشر الرسوم في عددها المقرر صدوره غدا الخميس 2-2-2006.<br />وقال دومينيك فون بيرج رئيس تحرير التريبيون: \"إن هذا النزاع بمثابة إيضاح للتصادم بين ثقافة علمانية بدرجة كبيرة كالتي نعيشها وثقافة أخرى الدين محورها\".<br />وأردف: \"يمكنك أن تتفهم مشاعر المسلمين، ولكننا في دولة تعددية، حيث نملك الحق في أن ننشر ذلك\".<br />وفي هولندا، قال آري الشوت نائب رئيس تحرير صحيفة \"فولكسكرانك\" اليومية: إن صحيفته نشرت هذه الرسوم في نوفمبر 2005، ثم نشرتها ثانية اليوم الأربعاء.<br />وشدد على أن النشر يأتي بهدف \"توضيح\" الجدل المثار، لافتا إلى عدم وجود رد فعل \"سلبي\" على ما نشرته صحيفته.<br />ووصفت \"فولكسكرانك\" في افتتاحيتها أمس الثلاثاء الاحتجاجات التي شنها المسلمون في أنحاء العالم بأنها \"مسألة خسيسة تنعكس بشكل سيئ على الدول التي لم تؤيد الدانمرك\".<br />وكانت صحيفة \"جيلاندز بوستن\" الدانمركية نشرت في سبتمبر الماضي 12 رسما كاريكاتيريا مسيئة للرسول صلى الله عليه وسلم، ثم أعادت صحيفة نرويجية الشهر الماضي نشر هذه الرسوم.<br />وتسبب نشر الرسوم المسيئة في إطلاق حملات مقاطعة متصاعدة في الدول العربية والإسلامية للبضائع الدانمركية ردا على رفض السلطات الدانمركية التحقيق مع الصحيفة بدعوى أن ما نشر يندرج تحت بنود حرية الرأي التي يكفلها الدستور.<br />واعتذرت \"جيلاندز بوستن\" الإثنين الماضي عن نشرها هذه الرسوم. وقال كارستن جاست رئيس تحرير الصحيفة في بيان نشرته وكالات الأنباء: إن \"هذه الرسوم لا تنتهك التشريعات الدانمركية، لكنها أهانت بشكل لا يقبل الجدل مشاعر الكثير من المسلمين، ونحن نعتذر عن ذلك\".<br />وسبق لجاست توجيه رسالة اعتذار باللغة العربية لمواطني السعودية التي بدأت حملة مقاطعة واسعة ضد المنتجات الدانمركية كما سحبت سفيرها من كوبنهاجن.<br />وأعرب رئيس الوزراء الدانمركي عن ترحيبه باعتذار الصحيفة، قائلا: إنه يدين شخصيا نشر رسوم كاريكاتيرية تتناول النبي محمد في الصحيفة الدانمركية.<br />باريس- وكالات- إسلام أون لاين.نت/ 1-2-2006<br />منقول من موقع الاتحاد الوطني لطلبة المغرب<br />www.unem.net"
