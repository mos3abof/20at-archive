author = "اعتبر مراقبون لتطورات الأحداث في جريمة الاعتداء على حرمة النبي محمد صلى الله عليه وسلم في بعض الصحف الأوربية أن اتساع دائرة النشر يرتبط بجهود استخباراتية مكثفة في بعض عواصم الاتحاد الأوربي لتخفيف الضغط عن الدنمارك ، بعد أن اعترفت مفوضية الاتحاد بعجزها عن وقف موجة المقاطعة أو التورط في الأزمة بشكل مباشر وعلني ، في حين اعتبرت أوساط ثقافية أن هذه الأزمة قد تمثل تحولا خطيرا في البنية الثقافية للمجتمع الغربي ، لأنها تفتح على نطاق واسع أبواب الجدل حول المحرمات في الإعلام الغربي ، لأن بعض الأصوات الغربية بدأت تطرح الآن تساؤلات حول النفاق الأوربي فيما يتعلق بقضية حرية التعبير ، لأن هناك محرمات حقيقية لا يستطيع الإعلام الغربي انتهاكها أو الاقتراب منها ، فهل ستستمر قضايا من مثل الهولوكوست والشخصية اليهودية على سبيل المثال محرمة على الاستهزاء والسخرية في الإعلام الأوربي أم أن العبارة التي نشرتها صحيفة \" دي فيلت \" الألمانية \" لا أحد فوق النقد والسخرية في أوربا \" سوف تشمل هذه المحرمات ، وأكدت ذات المصادر أن الثقافة الأوربية مقبلة على تحول تاريخي بفعل هذه الحادثة ، فيما يتعلق بقضية حرية التعبير وحدودها ."
posted = "2006-02-03"
text = "مصادر ديبلوماسية استطلعت المصريون رأيها أشارت إلى أن الخطة التى تحتاج إلى إمكانيات أكبر بكثير مما تملكه الدانمارك انطلقت منذ الثلاثاء الماضى عبر صحف تصدر فى عدة دول أوروبية، تبنت الخطاب نفسه، وسارت على منهج موحد، ما يدل على التنسيق بين الصحف الموزعة على عدة دول، ويشير إلى أصابع أجهزة الاستخبارات التى تقود هذا التنسيق بهدف تخفيف المقاطعة التى بدأت المصانع الدانماركية تعانى بسببها، وذلك بتوريط عدة دول أوربية فى قضية الإساءة، ما يجعل العالم الإسلامى يقف عاجزاً عن مقاطعة كل هذه الدول دفعة واحدة، وفى الوقت نفسه يصبح لا معنى لاستمرار مقاطعة الدانمارك وحدها. هذا فى المدى القريب، أما فى المدى البعيد فإن افتعال ما يشبه \"إجماعا أوربياً\" على الإساءة لرسول الله صلى الله عليه وسلم بقدر ما يكسر شوكة الوجود الإسلامي في أوربا بقدر ما يشكل حاجز صد يحول دون مزيد من التمدد العقائدي الإسلامي بين المواطنين في أوربا والذي بدأ يثير قلق الكثير من دوائر الأمن القومي دون قدرة على وقفه .<br />من جانبه كان الرئيس الأمريكى السابق \"بيل كلينتون\" قد أشار إلى قريب من هذا المعنى وذلك المخطط فى كلمته التى ألقاها أمام ندوة الثقافات والحضارات فى العاصمة القطرية الدوحة، حبث قال إن الغرب يستبدل معاداة الإسلام بمعاداة السامية، وفى إطار الخطة نشرت صحف اوربية الرسوم الكاريكاتيرية التي نشرتها فى الأصل صحيفة \"يلاندس بوستن\" الدنماركية واثارت موجة استنكار وغضب عارمة في العالم الاسلامي احتجاجا على إساءتها إلى النبي محمد صلى الله عليه وسلم.<br />وفي فرنسا تفردت صحيفة \"فرانس سوار\" الشعبية باعادة نشر الرسوم الكاريكاتورية ال12 معنونة صفحتها الاولى \"نعم لنا الحق في رسم كاريكاتير عن الله\".<br />ودافعت الصحيفة عن حق الصحافة في التندر على اي معتقدات دينية مؤكدة انه \"ليس في الرسوم المعنية اي نية عنصرية او ارادة في الحط من اعتبار مجموعة بصفتها هذه\".<br />وتساءلت الصحيفة \"هل يمكن تصور مجتمع تجمع فيه كل محظورات مختلف الديانات؟ ماذا يبقى عندئذ من حرية التفكير والتعبير وحتى التحرك؟\". وهو تساؤل يميط اللثام عن الذهنية العنصرية التى تحكم الموضوع كله، فالصحيفة تشير إلى أن الغرب ـ الذى يحترم كل ما ينتمى لليهود حتى الخرافات والأكاذيب إلى حد التقديس ـ لن يحترم مقدسات باقى الديانات، ومنها الإسلام، لأن احترام مقدسات كل الأديان ـ كما قالت الصحيفة ـ أمر لا يمكن تصوره، ولا ندرى لماذا؟!<br />جدير بالذكر أن مالك \"فرانس سوار\" هو رجل الاعمال المصري رامى لكح، وقد اقال رئيس ومدير الصحيفة جاك لوفران على اثر اعادة نشر الرسوم.<br />وفي اسبانيا اعيد نشر الرسوم الكاريكاتيرية في صحيفة \"آ بي ثي\" اليمينية وصحيفة \"ايل بيريوديكو\" الكاتالانية اليسارية.<br />وارفقت \"ايل بيريوديكو\" الرسوم بتعليق كتبت فيه \"من المنطقي ان تثير الرسوم الكاريكاتيرية استياء بعض المسلمين. لكن من غير المنطقي ان نسعى باسم قراءة حرفية ولاانسانية للقرآن للقضاء على الانتقادات في الخارج ايضا او نهدد الذين يمتهنون التهكم\". وهو تعليق يعنى الإصرار على المضى فى التهكم على رموزنا الدينية، وعلينا أن \"نضرب رأسنا فى الحائط\"!<br />أما الصحافة البريطانية فقد امتنعت عن اعادة نشر الرسوم.<br />وفي ايطاليا اختارت صحيفة \"لا ستامبا\" نشر الكاريكاتير الذى اثارت اكبر قدر من الاستياء في العالم الاسلامي.<br />وقد ارفقته بمقالة اخبارية عن الموضوع بدون ذكر حرية التعبير فيما اكتفت صحيفة \"ايل ميساجيرو\" بمقالة بدون اعادة نشر اي رسم.<br />غير ان صحيفة \"ايل كوريري ديلا سيرا\" الاكثر انتشارا بين الصحف الايطالية نشرت الاثنين رسمين مع مقالة طويلة للمحرر المسلم مجدي علام اعتبر فيها الرسوم الكاريكاتيرية \"تنم عن ذوق مريب بالطبع\"، غير انه دافع عن حرية التعبير وتساءل\"ماذا ينتظر الغرب للتدخل؟ هل سيعتمد سياسة النعامة الى ان يقتل ثيو فان جوخ آخر في كوبنهاجن او اوسلو؟\" في اشارة الى اغتيال المصور الهولندي في نوفمبر 2004 على يد اسلامي هولندي من اصل مغربي، وهكذا أباح هذا (المسلم) التهكم على نبيه، وربط الإسلام بالإرهاب فى عبارة واحدة.. ولعل من دفعوا له ثمن ما كتب يقدرون جهوده!<br />وفي سويسرا نشرت صحيفة \"بليك\" الثلاثاء اثنين من الرسوم موضع الخلاف.<br />وقال دومينيك فون بورج ان \"هذه القضية تصور الصدام بين ثقافة شديدة العلمانية مثل ثقافتنا وثقافة اخرى محورها الديانة\" مضيفا \"يمكننا تفهم مشاعر المسلمين لكننا في دولة تعددية ومن حقنا ان نفعل ما نفعله\". لكن \"بورج\" لم يقل لنا: لماذا لم يدافع عن مواطنه \"د. روبير فورسون\" أستاذ التاريخ الذى أمضى ثلاث سنوات فى السجن لأنه كتب مقالاً أثبت فيه بالبراهين التاريخية أن محرقة اليهود مجرد أكذوبة؟ إن صدور وتنفيذ مثل هذا الحكم ينسف أكذوبة \"الثقافة العلمانية\" التى تتبناها أوربا، ويجعلنا فى مواجهة بين ثقافة إسلامية تحترم المقدسات، وقوى صهيونية تسعى إلى هدم مقدسات غير اليهود، بغية ألا يبقى على الأرض معبد غير معبدهم.<br />وفي هولندا نشرت \"دي فولكسكرانت\" التقدمية و\"دي تلغراف\" الشعبية و\"ان ار سي هاندلسبلاد\" رسما او اكثر او اعادت نشر صفحة \"يلاندس بوستن\" المعنية بالمسألة.<br />واختارت الصحف الاخرى نشر صور لمتظاهرين امام السفارات الدنماركية او رسوما كاريكاتورية لرساميها حول الموضوع.<br />وفي براغ نشرت صحيفة \"دنيس\" مقالة حول الموضوع الى جانب صورة صغيرة عن الرسوم الكاريكاتورية.<br />واختارت الصحف المجرية أن تتطرق الى الموضوع بدون نشر صور.<br />وفي فرنسا صرح وزير الخارجية فيليب دوست بلازي ان بلاده لا يمكنها المساس بحرية الصحافة لكنه دعا الى ممارسة هذه الحرية \"بعقلية تقبل الاخر\".<br />وتابع ان \"مبدأ حرية الصحافة الذي تدافع عنه السلطات الفرنسية في كل انحاء العالم لا يمكن المساس به لكن ينبغي ممارسته بذهنية تقبل الاخر وباحترام المعتقدات والديانات الذي يشكل اساس مبدأ العلمانية المعتمد في بلادنا\".<br />وفي المانيا عبر هندريك تسورنر المتحدث باسم نقابة الصحافيين الالمان عن معارضته نشر الرسوم. وذكر بان آداب الصحافة الالمانية تحظر المقالات او الصور التي من شأنها الاساءة الى \"المشاعر الدينية او الاخلاقية لمجموعة من الاشخاص\".<br />وكانت صحيفة \"دي فيلت\" المحافظة الصحيفة الكبرى الوحيدة التي نشرت في صفحتها الاولى احد الرسوم فيما اوردت اربعة رسوم اخرى في صفحاتها الداخلية.<br />وفضحت الصحيفة في افتتاحيتها ميولها الصهيونية الواضحة، إذ قالت \"كنا سننظر بمزيد من الجدية الى الاحتجاجات الاسلامية لو كانت اقل نفاقا. فحين بث التلفزيون السوري في ساعة تشهد إقبالا كبيرا برنامجا ظهر فيها حاخامات على شكل أكلة لحوم البشر لزم الأئمة الصمت\"."
