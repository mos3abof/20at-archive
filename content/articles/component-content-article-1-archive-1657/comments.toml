[[comments]]
order = 27
subject = "الجرائد الفرنسية وغيرها تحاول تشتيت جهودنا فلا تهتموا بهم أبدا"
author = "عبدالله"
posted = "2006-02-01"
text = "قرأت منذ فترة قصيرة أن إحدي الجرائد الفرنسية أعادت نشر الصور الكراكتورية التي نشرتها جريدة الدنمارك. وأنا أقول إن الجريدة الفرنسية هذه تحاول عمل دعاية كبيرة لها كما أنها تحاول تشتيت جهودنا في مقاطعة الدنمارك. فلا تشتتوا جهودكم وركزوا علي الدنمارك لأنها أول من سن هذه السن السيئة وأما غيرها من الدول الأوربية والتي تنشر هذه الصور لكي تتفرق إهانة الرسول بينهم فلا ندري علي من نركز فلا تعيروهم اهتماما ( مؤقتا علي الأقل) لأنهم يحاولون تشتيت تركيزنا واستفزازنا فلا تعطوهم هذه الفرصة ولنركز علي الدنمارك لأنها أول من سن هذه السنة السيئة ... أما فرنسا وغيرها فلهم يوم بعد الدنمارك... المقاطعة قد أحدثت صدمة كبيرة في الإقتصاد الدنماركي ولله الحمد فلنستمر بهذه المقاطعة لنقطع دابرهم بإذن الله تعالي ... فالتركيز التركيز علي مقاطعة الدنمارك فلا يجب أن نشتت جهودنا بين الدول والجرائد التي تحاول أن تعمل دعاية لجرائدهم علي حسابنا... وبعد أن نكسر ظهر الدنمارك بإذن الله تعالي سيأتي الدور علي غيرها بالترتيب وبالنظام وخطوة خطوة ... والأمر كله لله تعالي . اللهم أقر عيوننا برؤية رسولك الكريم الشفيع محمد بن عبدالله ..... آمين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

