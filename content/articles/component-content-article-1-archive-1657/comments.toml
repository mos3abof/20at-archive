text = "بابي انت وامي يارسول الله بابي انت وامي ياخليل الله كم كنت رحمة تمشي بين ربوع المدينة وشيعاب مكة تهدي الظال الى طريق الله وتاخي بين عباد الله ولا يهمك اذا ماعيرت او ضربت الا ان تنتهك حرمات الله كم كنت رؤوف بالمريض والاعمى وكل خلق الله الم تكن تجاور اليهود وكم من يهودي ويهودية اسلموا حينما عرفوا اخلاقك والله الم يسلم الشجر والحجر عليك يا رسول الله الم تظلك الغمامة اعجازا من الله شبابنا احبائنا تكتلوا لنصرة رسولنا الكريم ودفع الدعاة المستعلين على حرمات العلي القدير الاول كان القدس والتاني كان القران والان رسولنا الكريم وبعده مكة هيهات هيهات لاتنتظرون ان لم يجتمع كبارائنا فسنكون نحن خالدا وصلاحا ومعاذا والوليد ان خسرتم تجارتكم اليوم فستخسرون انفسكم ولن نهيبكم شبابنا تواصلوامع الشباب لكي لا نعيد ما فعله العراق والكويت شبابنا تحابوا وتواضعوا وتهادوا وكونوا خلفاء الله وحاكمين بامر الله ودافعوا عن حرمات الله اختكم تسئلكم الدعاء ان تحشر مع الحبيب المصطفى عليه سلام الله"
