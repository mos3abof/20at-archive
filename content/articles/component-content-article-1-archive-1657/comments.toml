[[comments]]
order = 50
subject = "من مواطنة مغربية"
author = "سعاد عطار"
posted = "2006-02-18"
text = "بسم الله الرحمان الرحيم<br />إن تنصروا الله ينصركم يثبت أقدامكم<br />من مواطنة مغربية<br />لا أخاطب من أ ساء إلى الرسول صلى الله عليه و سلم بل أخاطب من لا يعرفونه<br />وألوم أنفسنا لأننا قصرنا في حمل رسالته إلى الناس أجمعين و إن الله يقول في كتابه العزيز((وما أرسلناك إلا رحمتا للعالمين)) هو رحمة الإنسان الحيوان و النبات...أنتم لا تعرفون أنه في الحرب أمر ألا يتعرضوا لشيخ أو امرأة أو طفل<br />حتى الأشجار و النخيل و الزرع و أنتم لا تعرفون أنه حول طريق الجيش من أ جل كلبة تلد حتى لا يجعزها أحد انتم لا<br />تعرفون أنه استأدنه طفلا كان بيمينه أن يسقي أبا ابكر قبله لمكانة هدا الرجل فرفض الطفل أن يتنازل عن حقه واحترمه<br />رسول(ص) أنتم لا تعرفون أنه أبطأ الجيش في السير من أجل امرأة حين عودته حتى تتهيأ لزوجها لما علم من اعبا‘ها<br />أما عمر بن الخطاب وهو أمير المؤمنين وهو يحكم دولة جلس أمام القاضي مع واحد من الرعية في الحكم لأنه تربا على<br />يدا هدا النبي الكريم .<br />إنكم شعب متقف ودكي إبحثوا في كتب سيرة النبي وستجدون ما يبهركم و ستعرفون أن هدا النبي بعت للبشرية جمعاء<br />إنه دين واحد من أدم و نوح و إبراهيم و موسى و عيسى .<br />و ختمه الله بمحمد عليه جميعا السلام.<br />الناس عنده سواسية لا فرقة بينهم إلا بتقوى الله حتى أعداه شهد و له بالصدق و الأمانة لم يسب في حياته أحد و لم يضرب<br />أحدا كان رجل أو امرأة أو طفل قط.<br />سامحنا يا حبيبنا يا رسول الله نحن الدين ضيعنا رسالتك هده الإساءة ليست لك إنها لنا أما أنت فحبيب الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

