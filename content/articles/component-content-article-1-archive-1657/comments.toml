[[comments]]
order = 0
subject = "لبيك رسول الله"
author = "SLAMAMUSLM"
posted = "2006-01-26"
text = "الحمد لله وصلاة وسلاما على رسول الله وصحبه ومن والاه<br />اللهم من آذى رسولك فآذه وعليك به فانه لا يعجزك<br />ايها الاخوة نحن معكم قلبا وقالبا بالتشهير باعداء رسولنا الكريم واعداء ديننا الحنيف وفعلا هؤلاء هم اعداءنا الذين قال الله تعالى لنبيه عنهم \"ولو نشاء لأريناكهم فلعرفتهم بسيماهم ولتعرفنهم في لحن القول\" سورة محمد صلى الله عليه وآله وصحبه وسلم<br />ايها الاحباب ما تامرون به ننفذه بقدر استطاعتنا دفاعا وذودا عن حبيبنا ونور قلوبنا رسول الله فسمعا وطاعة<br />وان شاء الله ننشر هذه المنتجات ونعرف بها حتى يقاطعها المسلمون ونحن اولهم ولكن مدونا بالجديد من منتجاتهم حتى نكون دائما على بينة والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

[[comments]]
order = 1
subject = "الدين الحق"
author = "محمد عثمان"
posted = "2006-01-26"
text = "السلام عليكم و رحمه الله<br />يا جماعه الموضوع محتاج مننا فعلا وقفه الموضوع مش بسيط لان لو سبنا الغرب يتكلم كيفما يشاء سيصبح نبيينا (ص) لعبه في السنتهم واعتقد انه من الصعب ان يشفع في قوم تركوا التمسك بالدين و الدفاع عنه و عن نبيهم محمد (ص) و لذلك فاني اشجع المقاطعه و اناشد المسلمين بتكرار ارسال رسالات للسفارات و القنصليات النرويجيه و الدنماركيه لكي نرد اعتبار رسولنا الكريم والله يوفقنا لما يحب و يرضي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

