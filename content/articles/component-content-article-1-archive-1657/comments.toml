text = "يا جماعه حاولوا تنصروا الاسلام بطريقه تانيه<br />انا دخلت قبل كده علي البالتوك فوجئت بالآتي<br />ان في غرف بيدخل فيها ناس مسيحيين ويبدأوا في الاساءه للاسلام والاساءة للقران وسيدنا محمد عليه افضل الصلاة والسلام<br />ياجماعه همه بيدخلوا يتناقشوا في الاسلام مع ناس مسلمين وكمان بيفسروا ايات من القران علي كيفهم قال رسول الله عليه افضل الصلاة والسلام(من راي منكم منكرا فليغيره.....)الي اخر الحديث<br />ياريت تدخلوا كلكوا لان الناس دي ممكن تنصر اي انسان مسلم انا هكتب اسم الغرفه وانتوا يااااااااريت تبحثوا عنها وتدخلوا فيها<br />الغرفه اسمها:<br />egyption copts are asking about Islam<br />اتمني انكم تدخلوا<br />وجزاكم الله خير<br />Islam is the best"
