text = "الرحمة على نفسك شوية يارحمة لحسن يطءلك عرق ولا حاجة<br />واللهى العظيم انتو فعلا عاوزين جنازة وتشبعو فيها لطم<br />عارفين ان الدنمرك غلطانة والباقى كمان غلطان والوزير هناك اعتذر<br />يبقى خلاص خلصنا<br />خلصت الحكاية<br />انتو اية يابشر انتو اية ؟<br />سيبو الموضوع دا للة وهو هيتصرف معاهم ويرد عليهم"
