subject = "لا نمت اعين الكفار"
author = "مازن بن محمد"
posted = "2006-01-30"
text = "يا ايه المسلمين لانمت اعين المشركين الانذال الذي يستهزاون بل اسلام وبرسول الكريم000000ليس الحال المقاطعه لل منتجات ولا التوقيعات..... بل الحال ان نقوم كلانا لنصرت الدين ورسوله الكريم وردع المشركين ومحربتهم.<br />ودعو كل ابطال الاسلام ان يقوم ببعض التفجيرات وقتل المسائولين علا هذة الفعله الشنيعة.<br />ونريد منكم الرد علا هاذ الفعله وتعون معناء لرفع كرمت الاسلام وعزت الرسول الكريم"
