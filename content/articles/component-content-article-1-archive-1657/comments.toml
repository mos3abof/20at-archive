subject = "مايجب ان يكون"
author = "سعيد"
posted = "2006-01-26"
text = "يجب ان يكون الفعل الحقيقي ان تضغط الشعوب المسلمه في كافة الدول المسلمه علي حكوماتها لاتخاذ موقف .. بسحب السفراء من الدنمارك .. وطرد اي عدد من سفرات الدانمارك ان لم يكن طرد السفير الدانماركي نفسه ... والدول التي بها منتجات دانماركيه يتم التركيز عليها مثل دول الخليج ... والكتابه في الصحف المقرؤه مقالات تعلم حب النبي صلي الله عليه واله وسلم ... وكذلك .. تذكير خطباء المساجد بالتركيز علي تعليم المسلمين حب نبيهم الحب الحقيقي... بمعرفة سنته .. وخلقه والحثعليها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

