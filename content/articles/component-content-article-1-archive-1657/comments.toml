[[comments]]
order = 17
subject = "حبيبي يارسول الله"
author = "بسيمة المعمري"
posted = "2006-01-29"
text = "مهما سكت المسلمين وإلى اي حد لكن الى حد سب وشتم الحبيب المصطفى الغالي الذي ارسله الله رحمه الينا وبه عزنا ونصرنا وقوتنا فمهما تألم حبيبي رسول الله قبل الاسلام وبعد الاسلام من اجلنا فيما تألم ونحن لانحس بمدى الالم الذي عاناه الا من رحم ربي لكنه رغم اخطائنا قال اللهم اغفر لقومي فإنهم لايعلمون آه كم نحبك يارسول الله لكنا لانستطيع ان نعمل شئ سوى هذة الكلمات البسيطة ومقاطعة المنتجات الدنماركية لكني اشهدك بأني احبك من كل قلبي وهذا عني وعن اهلي وعن كل من يعمل في مدرسة الريادة الاهلية باليمن صنعاء وعن كل من اعرفهم. لكن يجب عمل شئ خصوصاً عبر وزارة الإعلام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

[[comments]]
order = 18
subject = "متى نغير من أنفسنا؟"
author = "بسم الله الرحمن الرحيم"
posted = "2006-01-29"
text = "ِإنَّ اللّهَ لاَ يُغَيِّرُ مَا بِقَوْمٍ حَتَّى يُغَيِّرُواْ مَا بِأَنْفُسِهِمْ<br />بالطبع كل مسلم غيور على دينه بل كل عاقل منصف لا يبخس الناس حقوقهم غضب على ما بدا من أبقار أوروبا في حق نبينا محمد ( صلى الله عليه و آله و سلم ) – و لكن ماذا جنت هذه الأبقار من نطح الجبال الرواسي؟- عاد كفار قريش يقولون مذمما و هو محمدا و لكن لم يعود أبو بكر أو عمر أو عثمان أو علي أو خالد أو أسامة أو جعفر فكان حقا علينا أن نكون أذل أمم الأرض و أحقرها<br />و الحل الطبيعي الذي لجانا إليه هو الشجب و الإستنكار و الرفض و الرسائل الإلكترونية و نداءات المقاطعة – مع إقتناعي الكامل بقوة المقاطعة و أثرها و يكفي أن وزارة المالية الدنماركية أعلنت أن خسائر الشركات الدنماركية نتيجة المقاطعة في المملكة العربية السعودية وحدها قد تصل إلى 40 مليار دولار خلال 6 أشهر- و لكن هل ما نفعله كفيل بردع هؤلاء الأنجاس الشواذ؟<br />أتدهشون إن قلت لكم أن النبي يسب في بلاد المسلمين يوميا أكثر من بلاد الكافرين بل و أحيانا ممن ترتدي الحجاب أو المواظب على الصلاة؟<br />نعم منا من يسب النبي ( صلى الله عليه و آله و سلم ) عندما يطيع من يقول \" مش حتقدر تغمض عينيك\" و لا يلتفت إلى قوله تعالى : {قُل لِّلْمُؤْمِنِينَ يَغُضُّوا مِنْ أَبْصَارِهِمْ وَيَحْفَظُوا فُرُوجَهُمْ ذَلِكَ أَزْكَى لَهُمْ إِنَّ اللَّهَ خَبِيرٌ بِمَا يَصْنَعُونَ }النور30<br />{وَقُل لِّلْمُؤْمِنَاتِ يَغْضُضْنَ مِنْ أَبْصَارِهِنَّ وَيَحْفَظْنَ فُرُوجَهُنَّ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا مَا ظَهَرَ مِنْهَا وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَى جُيُوبِهِنَّ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا لِبُعُولَتِهِنَّ أَوْ آبَائِهِنَّ أَوْ آبَاء بُعُولَتِهِنَّ أَوْ أَبْنَائِهِنَّ أَوْ أَبْنَاء بُعُولَتِهِنَّ أَوْ إِخْوَانِهِنَّ أَوْ بَنِي إِخْوَانِهِنَّ أَوْ بَنِي أَخَوَاتِهِنَّ أَوْ نِسَائِهِنَّ أَوْ مَا مَلَكَتْ أَيْمَانُهُنَّ أَوِ التَّابِعِينَ غَيْرِ أُوْلِي الْإِرْبَةِ مِنَ الرِّجَالِ أَوِ الطِّفْلِ الَّذِينَ لَمْ يَظْهَرُوا عَلَى عَوْرَاتِ النِّسَاء وَلَا يَضْرِبْنَ بِأَرْجُلِهِنَّ لِيُعْلَمَ مَا يُخْفِينَ مِن زِينَتِهِنَّ وَتُوبُوا إِلَى اللَّهِ جَمِيعاً أَيُّهَا الْمُؤْمِنُونَ لَعَلَّكُمْ تُفْلِحُونَ }النور31<br />نحن فتحنا الباب لغيرنا كي يتطاول على سيد الخلق عندما وجدنا أنفسنا عاجزين عن التصدي لمحلات الخمور التي بدأت تغزو شوارعنا و وصلنا إلى حالات الهيام إلى درجة الخبال بممثلين و ممثلات يحتسون الخمور علنا في أعمالهم الشيطانية ( و المهم أن أعمالهم متخلفة دراميا و فنيا و من لا يصدقني فلينظر إلى الدراما السورية أو الإيرانية و التطور الذي بلغته و الأهداف التي ترمي إليها ) و يمارسون الفحشاء على مرأى الأعين فكافأناهم بالتصفيق و تعليق صورهم في حجراتنا ( ربما لطرد الحشرات ) و الذهاب على دور السينما كي نعينهم على الإثم و العدوان و لا أظنني أتجنى عليهم إن قلت إنهم يكنون للإسلام عداء أشد مما يكنه أبقار أوروبا ... فما معنى السخرية من المسلمين و علمائهم و علومهم و اللحية و الحجاب و الإفتراء على الإسلام في الكثير من أعمالهم – و بصراحة أقصد عادل إمام و وحيد حامد خصوصا<br />نحن جعلنا أنفسنا أضعف أمم الأرض بتكاسلنا الذي يصل إلى حد \"التنبلة\" عندما ملكنا أخصب أرض فاستوردنا الطعام من الخارج و أكبر ثروة حيوانية فاستوردنا اللحوم و الألبان من الخارج و أكبر ثروة بشرية فصدرناها للخارج و كبتنا من تبقى منهم بيننا و أكبر تراث حضاري و تشريعي فألقيناه وراء ظهورنا و فوق كل هذا دينا يجمع بين خيري الدنيا و الآخرة فلم نوفه قدره... باختصار منحنا الله كل شيء و لكن نحن \" مش وش نعمة\"<br />{وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ وَلَا تَنسَ نَصِيبَكَ مِنَ الدُّنْيَا وَأَحْسِن كَمَا أَحْسَنَ اللَّهُ إِلَيْكَ وَلَا تَبْغِ الْفَسَادَ فِي الْأَرْضِ إِنَّ اللَّهَ لَا يُحِبُّ الْمُفْسِدِينَ }القصص77<br />كلمة أخيرة<br />عندما كانت المرجعية هي الإسلام تحركت جيوش المسلمين لنجدة امرأة سرق الروم قطعة من أرضها و لكن الآن مع أصبحنا كهباء منثورا لا نستطيع الدفاع عن نبينا ( صلى الله عليه و آله و سلم )<br />إِلاَّ تَنصُرُوهُ فَقَدْ نَصَرَهُ اللّهُ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

