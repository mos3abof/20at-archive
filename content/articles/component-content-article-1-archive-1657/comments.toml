posted = "2006-02-04"
text = "إصبروا يا أمة محمد فموعدنا هناك عند الحوض<br />فمن سيشرب ومن يظل عطشانا؟<br />اللهم إن الدين دينك والكتاب كتابك والنبي نبيك , فوضنا أمرنا لله سبحانه وتعالي ليرينا فيهم آيه من آياته<br />ولا تعقيب علي كلمات الله<br />قال تعالي<br />أعوذ بالله من الشيطان الرجيم<br />بسم الله الرحمن الرحيم<br />\"ولقد استهزئ برسل من قبلك فحاق بالذين سخروا منهم ما كانوا به يستهزئون\"<br />الأنبياء - 41"
