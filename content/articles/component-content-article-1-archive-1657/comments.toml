capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

[[comments]]
order = 40
subject = "الاسلام قادم"
author = "منى محمد شحاتة"
posted = "2006-02-05"
text = "الاسلام عليكم اولا<br />ان بعد ما مثلو بصور سيدنا عيسى عليه السلام وسكت المنسحيين واعترض المسلمين على هذه الفلعة ولكن الاعتراض لم يكن كافى ظن الغرب انهم اذا اسائوا الى الرسول سوف يعدى الامر مثل كل مره زى محصل فى سجن ابو غريب من اهانة للمصحف الشريف و غير ذالك من الامور التى لم يعترض عنها المسلمون ولكن هذه المره افاق المسلمون و شرفوا دين الاسلام فهذا والله نجاح للاسلام وفوز عظيم فسيوف يبحث العالم كله من هذا اللرسول الذى وقف المسلمين هذه القفه للمسيئة اليه وقد يكون سبب فى هدايتهم اشاء الله واكن لا يحزننى غير سكوت محمد حسنى مبارك على هذه الاسائة وكلام الطنطاوى السنا بلد اسلامى؟mona_mohamad@yahoo.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

