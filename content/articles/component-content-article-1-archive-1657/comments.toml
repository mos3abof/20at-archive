subject = "من أروع ما قرأت عن المقاطعة"
author = "من أروع ما قرأت عن المقاطعة"
posted = "2006-02-03"
text = "*إلقاء الشيخ/ إبراهيم الفارس بعد مغرب يوم الجمعة 27/12/1426هـ كلمة حول قضية الساعة سب الصحيفة الدنمركية لرسول الله صلى الله علية وسلم وواجبنا نحو ذلك ويليه موجز عن المحاضرة:<br />* خلفيات القضية:<br />-قضية ليست رسومات استهزاء فقط ولكن هناك أمور أخرى لم نطلع عليها وهي:<br />1- ملكة الدنمارك \"مارقريت\" الفت كتاب عن الحضارة الأوربية وذمت الإسلام والمسلمين والرسول صلى الله علية. (ولم يتحرك احد).<br />2-رئيس وزراء الدنمارك أشار ثلاث مرات منذ أحداث سبتمبر إلى أن أهل الإسلام حثالة الشعوب. (ولم يتحرك احد).<br />3- عدد من الصحف الدنمركية نشرت مقالات تنتقد فيها الإسلام ورسول الإسلام. (ولم يتحرك احد).<br />4- ثم ختمت القضية بالرسومات التي أثارت الناس.<br />- فان الموضوع أوسع من توجه صحيفة واحدة فهو على مستوى الدولة كاملة.<br />* تحرك الشعوب:<br />-بدأت الشعوب الإسلامية بالتحرك في نطاق ما يستطيعوا وطبقت قاعدة طبقتها الدنمرك عندما طولبت من قبل الجمعيات الإسلامية بالاعتذار وقالت الدنمارك هذه حرية رأي، فقالت الشعوب ولنا حرية الاختيار وبيدنا سلاح الاقتصاد الذي سوف نستخدمه، فنستطيع أن نقوم بالمقاطعة.<br />-شعب الدنمارك 5 ملايين يعتمد على الزراعة وتربية الأبقار وما ينتج منهما وأشارت جريدة الحياة بتقرير لها أن نصف الإنتاج الزراعي والحيواني يصدر للسعودية فماذا سيكون لو توقف الاستيراد سينهار نصف الاقتصاد الدنمركي الزراعي والحيواني.<br />* ردود فعل المقاطعة:<br />1- كان الموضوع الأساسي في صحف وقناة الدنمارك الرئيسية يوم الخميس مقاطعة السعودية للمنتجات الدنمركية وتم مناقشة القضية بالأرقام والخسائر المتوقعة.<br />2- احد أصحاب المصانع الكبرى وهو \"لارا هود\" قال لو استمرت المقاطعة عدة أشهر سنخسر المليارات وسنسرح من العمال والموظفين 30 ألف موظف وعامل.<br />3-بدأت الصحيفة تناقش أثار نشر الرسومات عليها فقد قامت شركة لارا اكبر شركة مصدرة للمنتجات الغذائية برفع دعوى ضرر على الصحيفة في المحاكم الدنمركية.<br />4- وزير الزراعة الدنمركي اجتمع من نقابة المزارعين لمناقشة القضية وتقرر إرسال رسالة اعتذار إلى جميع وزراء الزراعة في الدول الإسلامية.<br />* واجبنا نحو مقاطعة الدنمارك:<br />1- قضية المقاطعة تحتاج لتفعيل ومواصلة عمل بشكل مستمر فان هذا لو نجح فأنة سيؤتي ثمار ليست باليسيرة علينا أن تستمر هذه المقاطعة حتى لو اعتذرت الصحيفة أو اعتذرت الحكومة الدنماركية رسميا وذلك لان الاعتذار ليس لذات الاعتذار ولكن لقوة الصدمة والخسارة الناتجة وهم يريدون إعادة الصفقات التجارية التي خسروها.<br />2- يجب أن ننتقل من المقاطعة الذاتية إلى حث الآخرين ودعمهم في جلساتنا ومع الأصدقاء والزملاء والأهل والجميع من نعرف حتى تتوسع دائرة المقاطعة.<br />3- إذا نجحت هذه المقاطعة سيكون هذا رادعا للدول الأخرى عن القيام بأي شي يسئ للإسلام.<br />* أخيرا:<br />-ما فعلته دولة الدنمارك اشد وأشنع مما فعلته أمريكا بالمسلمين وذلك لسببين:<br />1- تتبجح بمحاربة الرسول والسخرية منه من أعلى رأس إلى اقل شخص.<br />2- أن الدنمارك طلب منها الاعتذار في البداية ولكنها رفضت على لسان سفيرها في الرياض وأننا لان نعتذر مما فعلته الصحيفة وهو نوع من التبجح الذي يحتاج إلى وقفة صارمة وقوية حتى يؤتي هذا العمل ثماره.<br />ارجوا نشر البريد لكل من تعرف لكي تتسع دائرة المقاطعة كما قال الشيخ ."
