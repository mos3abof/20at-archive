[[comments]]
order = 21
subject = "و هل يكفي اعتذار؟"
author = "نعم ، هل ننتظر رسالة اعتذار لا تساوي الحبر الذي طبعت به من أبقار الدنمارك ؟ هل تلك الوقاحة تنتهي ببضع كلمات سخيفة و كأننا أطفال صغار ؟ بالأمس استضافت الجزيرة أحد المحررين العاملين في هذه المخربة الدنماركية و سؤل :\" هل تستطيع أن تتكلم عن (الهولوكوسة) ؟\" فكان جواب هذا الأقذر من روث بقر و جاموس الدنمارك بعد طول صمت:\" نحن في الدنمارك هنا يوجد ديموقراطية !!\" فسأله مذيع النشرة :\" و هل ديمقراطيتك تتيح لك تفنيد الهولوكوست أو التشكيك في شرعية إسرائيل؟\" فأجابه الأحمق :\" لقد كنا بصدد قبل اشتعال الأزمة رسم كاريكاتير ينتقد سياسة شارون مع الفلسطينيين...!!\" ... أيها الزنيم العنين أجعلت نبينا ( صلوات الله و سلامه عليه و آله و صحبه ) كشارون ؟"
posted = "2006-01-30"
text = "أرى أن الاعتذار الحقيقي الذي يجب أن نراه هو أن تقوم الصحيفة بنشر تراجم معاني القرآن الكريم باللغة الدنماركية على نفقتها الخاصة و سيرة المصطفى ( صلى الله عليه و آله و سلم ) و ذلك تحت إشراف المؤسسات الإسلامية الرسمية كمنظمة المؤتمر الإسلامي و الأزهر الشريف و توزيع هذه التراجم القرآنية والسير مع الصحيفة مجانا فمن أفسد شيئا فعليه إصلاحه و من حق المواطن الدنماركي الذي تكونت في عقله صورة مكذوبة عن رسول الرحمة أن يرى الصورة الحقيقية – و أظن أن هذا يدخل في نطاق حرية النشر و التعبير و \" الديمقراطية\" و إذا التزمت الصحيفة بذلك يمكن إعادة النظر في المقاطعة لألبان أبقار الدنمارك و إنقاذهم من أزمة حقيقية.<br />إني أتمنى من كل من تصله هذه المقالة أن ينضم إلى حملة إسلامية عالمية لتوصيل الفكرة إلى المسئولين في البلاد الإسلامية و إلى الجالية الإسلامية في الدنمارك فمتى نشعر و لو لمرة بالقدرة على التغيير و الإصلاح؟<br />إِلاَّ تَنصُرُوهُ فَقَدْ نَصَرَهُ اللّهُ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123443/http://www.20at.com/article2.php?sid=333"

