[[comments]]
order = 0
subject = "الله ينور بجد"
text = "برافو يا حنان، موضوع مثير، اسلوب راااائع، وعنوان صايع! يا ريت متحرميش عشرينات من ابداعاتك."
archived = "2004-06-10"
capture_url = "https://web.archive.org/web/20040610041835/http://www.20at.com:80/article.php?sid=337"

[[comments]]
order = 1
subject = "موضوع مميز"
text = "موضوع مميز نشكر عليه الكاتبة .. وأظن أن الحكومة المصرية تلام قبل الأمريكية .. ولا أقولك نلوم الإدارة الأمريكية أحسن .. عشان الحكومة المصرية مفيش منها رجا م الأول"
archived = "2004-06-10"
capture_url = "https://web.archive.org/web/20040610041835/http://www.20at.com:80/article.php?sid=337"

[[comments]]
order = 2
subject = "نونا المجنونة"
text = "اه يا بلد...... احنا نسيب التعليم و نغني و نرقص عشان يرفعونا فوق الراس<br />ادي عالم مصري اول مرة اسمع عنه<br />لكن عطعطوطي بتاع ستار اكاديمي عملين له حفلة و استقبال في المطار<br />اه يا بلد رجلها مكان راسها"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803034709/http://www.20at.com:80/article.php?sid=337"

[[comments]]
order = 3
subject = "دموع انهالت..... وانتهت"
text = "إن كان الأمر عالم مصرى ومات.. فحالنا دموع انهالت وانتهت سمعنا قصته تأثرنا ربما بكى قلبنا بكاء صامتا ثم نسنا وإلى غيرها من الحوادث والآلام"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803034709/http://www.20at.com:80/article.php?sid=337"

[[comments]]
order = 4
subject = "حاجه تحزن بجد"
text = "بجد أيه القرف داه<br />علماءنا يموتوا ولا حس ولا خبر<br />و بتووع الاسمه ايه داه الغني و الذي منه يبقوا فووق و نعرف أكلوا أيه و شربوا أيه<br />متي يأتي الوقت الذي نستيقظ منه من غفلتنا<br />فوقواااااااااااااا يا مصريين و يا عرب"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803034709/http://www.20at.com:80/article.php?sid=337"
