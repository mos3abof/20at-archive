[[comments]]
order = 0
subject = "الحزب التوربيني الديموقراطي"
author = "المواطن المطحون"
posted = "2007-01-10"
text = "اقترح بمناسبة التعديلات الدستورية والمحشية والمهلبية ان نعدل ايضا اسماء الاحزاب المكروها من الشعب المصري خاصة الحزب الوطني برئاسة جمال برايز الي الحزب التوربيني الديموقراطي واعتقد ان هذا الاسم هو الانسب لحزب مبارك وولديه (رضي بوش عنهما)"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127220153/http://masr.20at.com:80/article.php?sid=1406"

[[comments]]
order = 1
subject = "بندن ف مالطه"
author = "نيفين نيفى نوفا"
posted = "2007-01-11"
text = "كلنا بندن ف مالطه<br />زى ما الغزالى حرب بيدن كدا<br />الديمقراطيه ف مصر ما هى الا تمثيليه بتلعبها الحكومه على الشب بقالها كتيييير<br />و التمثيليه بوخت و مش باين لها نهايه<br />حريه الصحافه<br />اه و ماله<br />المدونات اوكى<br />اكتبو يا حبايبى<br />بس ف الاخر ايه اللى بيحصل<br />هى كلمه<br />من حقك تختار اللى انت عايزه و من حقى ارفض اختيارك<br />و قد كان و يكون و سيكون<br />سلمللى على الديمقراطيه"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127220153/http://masr.20at.com:80/article.php?sid=1406"

[[comments]]
order = 2
subject = "حزب الشيطان"
author = "هالو شلبى"
posted = "2007-01-12"
text = "الجماعة دول بيعملوا احزاب لانة وعلى حسب قوانين الاحزاب فور الموافقة على الحزب بيتخصص للحزب مبلغ مساعدة معلوم كل سنة هذا المبلغ يقتطع من دافعى الضرائب والمكوس واموال الفقراء والمساكين والمعدمين والارامل<br />يقوم السادة منظمى الحزب يلهطوا القرشين<br />وتبقى سبوبة للرزق والعيش الكريم بالاضافة الى الى الوجاهة ومقابلة المسئولين وتطنيشهم عندما يستولون على قطعة ارض صحراوية او رخصة تجارية لاستوراد سموم يقتلون بها الناس<br />احزاب اية وهم اية<br />عايزين ناس بسطاء يكونون حزب حقيقى غير مدعوم من الدولة"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127220153/http://masr.20at.com:80/article.php?sid=1406"

[[comments]]
order = 3
subject = "تابلوه"
author = "نيفين نيفى نوفا"
posted = "2007-01-13"
text = "احزاب ايه<br />الاحزاب ماهى الاتابلوه جميل مزيف علشان يتقال ان مصر فيها ديمقراطيه<br />و لما واحد حاول يعمل حزب حقيقى و يطلع بيه<br />الحزب خده و نزل<br />و المعارضه نفسها داخله ف التابلوه<br />و الاخوان داخلين<br />و كل وسائل الاعلام داخله و كل اللى بيتقال ة و بيتقرى و بيتسمع ليه سقف الحكومه محدده ارتفاعه<br />و الناس مخدوعه<br />و تقولولى احزاب<br />سلامات يا احزاب"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127220153/http://masr.20at.com:80/article.php?sid=1406"

[[comments]]
order = 4
subject = "من سيسمع بهؤلاء"
author = "السيد نوفل رئيس المحكمة ورئيس مجلس الدولة بعضوية المستشارين عصام عبدالعزيز ومصطفي حنفي وعبدالحليم القاضي وأحمد عبود والدكتور محمد كمال ومحمد محمود، نواب رئيس المجلس، و٥ من الشخصيات العامة بحضور المستشار عبدالقادر قنديل مفوض الدولة بالمحكمة وأمانة سر كمال نجيب ومحمد إبراهيم"
posted = "2007-01-13"
text = "من سيسمع بتلك الاسماء الا فى مزبلة التاريخ وياريت حتى مزبلة التاريخ تقبل باستضافتهم"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127220153/http://masr.20at.com:80/article.php?sid=1406"
