[[comments]]
order = 0
subject = "لعلهم يتعلمون"
author = "ياء"
posted = "2006-07-02"
text = "ياريت حكامنا العرب يعرفون كبف يمارسون السياسه مع امريكا مثلما تفعل ايران وكوريا<br />على فكره كوريا تعانى من نقص فى المواد الغذائه منذ حوالى 3 سنوات اى انها دوله فقيره<br />ايران يعرض عليها الان مساعدات مقابل ان تتوقف عن تخصيب اليورانيوم وللازالت تفكر<br />ادهى العرب فى السياسه<br />سئل سيدنا معاويه سيدنا عمر بن العاص عن السياسه فقال له هى اشبه ببيت تدخل منه فتاخذ ما تريد دون ان تخسر شيئا فقال له السياسه هى ان تبنى انت البيت الذى تنوى ان تدخله<br />yehia2784@hotmail.com<br />www.yehia2784.blogspot.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130548/http://www.20at.com/article2.php?sid=1016"

[[comments]]
order = 1
subject = "الارادة"
author = "لينا"
posted = "2006-07-03"
text = "بصراحة المقال وفرت علي متابعة الكثير من الاخبار وتوقع البعض الاخر منها<br />عدا ان صاحب الصوره يجعلك تسرح في خيالك قائلا: أي فخ ينصبه للعالم الآن<br />اما عن حكامنا وحكوماتنا فلنغسل ايدينا منهم لانهم ببساطه ممزوجين بالخوف من شبح لا وجود له ومتمسكين بكراسيهم حتى النهايه<br />ولكن اظن ان ارادة الشعوب وتصميمها على تغيرالواقع السياسي لامتنا هو الحل الوحيد<br />وان كنت ارى اننا حاليا نحن الشعوب نعيش مرحلة قمع ولكني لا اظنها دائمه<br />سوف نستفيق يوما ونكسر ذلك القيد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130548/http://www.20at.com/article2.php?sid=1016"

[[comments]]
order = 2
subject = "امريكا شيكا بيكا"
author = "نيفين نيفى نوفا"
posted = "2006-07-03"
text = "و هتفضل كوريا دايما شوكه فى ضهر امريكا<br />النظريه يا جماعه مش نظريه فقر او غنى و العالم العربى فيه علماء كلنا عارفين بيعملو ايه لما بيطلعو بره<br />النظريه خوف و جبن ساكن فى العقليه العربيه اللى عاكلتها امريكا بمبدا اضرب المربوط يخاف السايب<br />كل الحكام العرب ف عيونهم و عقولهم اللى حصل للعراق و اللى هيحصل لسوريا<br />الكل خايف و الكل بيمشى جنب الحيط و مش عارف ان ممكن الحيط دا يقع عليه ف اى لحظه<br />يا رب تكون الرساله واضحه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130548/http://www.20at.com/article2.php?sid=1016"

[[comments]]
order = 3
subject = "القوة تحتاج الى الحق"
author = "عربى"
posted = "2006-07-03"
text = "تحتاج اى قوة بالعالم الى نوع من الحق تستند اليه ولكن لان حكامنا بعيدون عن الحق والحقيقه لا يستطيعون اغضاب اسيادهم القابعين بالبيت الابيض حفاظا على كراسيهم<br />اما اذا ارادو تغيير الاوضاع فبمنتهى السهوله<br />مجرد اعلان لدعم المقازمه بالعراق وفلسطين وتنتهى الاسطورة<br />نعم سيواجهون بعض التحديات<br />ولكن النصر سيكون حليفهم<br />مجرد امنيات<br />مجرد احلام<br />فمتا تتحقق الاحلام والامنيات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130548/http://www.20at.com/article2.php?sid=1016"

