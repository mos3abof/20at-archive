subject = "القيصر"
text = "انا راي ان احنانهدم المساجد دي احسن عشان دي اهدار للمال العام دي بتستهلك اشي كهربه واشي مياه واشي صيانه وغيره .....تصوروا يا جماعه لماالصلاه تاذن كام واحد بيتوضوا في مصر في سبعين مليون واحد لو قلنا ان ثلاثين مليون بس اليتوضوا وغير كده مش مره واحده في اليوم دي خمس مرات......يا جماعه العلماء بيتوقعوا ان الحرب في القرن القادم هتكون على الماء واحنا بنهدره اول باول ...وغير كده المساجد واخده مساحات كبيره جدا والناس مش لاقيه مكان تعيش فيها .....فيها ايه لو كل واحد صلى في بيته ورايحنا.....وبعدين عندنا في القران مكتوب (ويل للمصلين)...يعني انت داخل جهنم ما تحولش...وغير كده الواحد لما يكون نايم مره واحده يلاقي اذان خمسين مسجد بيرن في ودانه...........فكروا فيها واحسبوها صح"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018154849/http://www.20at.com:80/article.php?sid=639"

