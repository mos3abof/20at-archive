[[comments]]
order = 8
subject = "مع التوحيد..ولكن بشروط!"
text = "أنا شخصيًا مع فكرة توحيد الأذان ولكن مع بعض التعديلات.<br />أنا أرى أنه فعلاً ما يحدث في الكثير من مساجدنا يمثل<br />مهزلة كبيرة لا يجب السكوت عنها.<br />فهناك من يؤذن بعد 15 دقيقة من وقت الأذان الأصلي لأن المؤذن كان نايم مثلا (لاحظوها في صلاة الفجر كتير).<br />والأذان يخرج من كل جامع وزاوية في المنطقة وأنتم تعلمون أن دلوقتي كل واحد عايز يعمل خير يقوم يعمل زاوية صغيرة ما تاخودش عشرة مصليين ويقوم حاطت ثلاث أربع مكبرات صوت فوق العمارات وهو مش عارف إنه كده بيفرق جموع المسلمين عن الذهاب إلى المسجد الجامع.<br />واللي زاد وغطى إنه يجي واحد صوته مزعج جدًا يؤذن وينفّر الناس بصوته ويخطئ في التشكيل والنطق والتفخيم والترقيق، وهذه مهزلة كبيرة لا يجب السكوت عنها لأن الأذان من شعائر الإسلام الظاهرة ولها أهمية كبيرة في التأثير في قلوب المسلمين ولو سمع الواحد مننا صوت منفر لأصابه الاستياء حتى ولو كان صوت الأذان، فما بالك لما كمان غير المسلمين يسمعوا هذا الصوت المنفر ويقولوا هو ده الإسلام؟<br />لذلك أنا لا أرى مانع من توحيد الأذان بصراحة ولكن بشروط، فأنا مع الاستاذ مسعود صبري أن يكون من يؤذن شخص حي وليس بصوت مسجل حتى لا نمنع ثواب تلك الشعيرة عن الناس وحتى تكون أكثر تأثيرًا فيهم.<br />واقتراحي أن يكون توحيد الأذان على مستوى المنطقة، بحيث ترشح وزارة الأوقاف مثلاً مسجدًا رئيسا في كل منطقة يبث منه الأذان، وترشح أيضًا مجموعة من المؤذنين المعروفين بعذوبة صوتهم وسلامة لغتهم ونطقهم لرفع الأذان، على أن يتم هذا الأمر بالتبادل بين المؤذنين المرشحين (كل واحد يوم مثلاً أو أسبوع) حتى لا نحرم الناس المؤهلة من ثواب هذه الشعيرة ، وبكده أيضًا نكون أضفنا نوع من التنويع في صوت الأذان وأثرنا في قلوب الناس بصوت حي.<br />لكن أن يستمر الحال كما هو عليه الآن من سماع 20 أذان ورا بعض (مش في نفس الوقت خالص) للإعلان عن نفس الصلاة خصوصًا إن المساجد أصبحت قريبة جدًا من بعضها في أيامنا، وأن نسمع من الأصوات ما نستنكر ومن النطق ما نعيب، فهذا ما لا يمكن السكوت عليه؟ ده حتى \"إن أنكر الأصوات لصوت الحمير\".<br />وعلى العموم، لو لم يتم تطبيق فكرة توحيد الأذان، لا بد من عمل شئ ما تجاه تلك المهازل ووضع رقابة قوية على أي شخص يرفع صوته في مذياع بما في ذلك بتوع الروبابكيا والباعة الجائلين.<br />واعتقد إن ده من حقوق الناس الأساسية، والقاعدة بتقول \"لا ضرر ولا ضرار\". والإسلام لا يرضى بالتأكيد تنفير الناس، والهدف من الأذان هو \"التبليغ\" وليس \"التنفير\" والفرق ما بينهم أكيد كبير.<br />ودمتم سالمين"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018154849/http://www.20at.com:80/article.php?sid=639"

[[comments]]
order = 9
subject = "من ساحة حوار اسلام اون لاين"
text = "أود لفت نظر السادة الراغبين فى توحيد الآذان بمصرالتنبه لشيئين<br />1- ان حجة توحيد الآذان بزعم عدم ازعاج الناس فى بيوتهم<br />وبخاصة اذا كان الصوت مزعجا لهو سبب يدعو للاستغراب<br />فمنذ متى كان الآذان علامة على مكوث المسلمين بمنازلهم<br />والصلاة بداخلها مثل الكتاكيت ياسيدى ان الآذان دعوة<br />للخروج لاداء الصلاة وتذكر ياخى ما فعله رسول الله مع الضرير<br />الذى طلب رخصة للصلاة ببيته ورد عليه رسول الله متسائلا بمدى<br />وصول الصوت اليه من عدمه فالاصل المطالبة بالصلاة بالمساجد<br />وليس تخفيض صوت الآذان بحجة ايذاء المتكاسل عن اداء الصلاة<br />بالمسجد وياسيدى اذا كان صاحب الصوت غير جميل فلتغيره بآخر<br />ولا تعطل شعيرة وتبتدع فى دين الله ما ليس فيه 0<br />2- الآن تريدون توحيد الآذان وغدا ستريدون توحيد خطبة الجمعة<br />فهل تظنون اننا بلهاء بهذا الشكل لكى يملى علينا من<br />الامريكان ما نعمله فى علاقتنا بربنا فسحقا والف سحقا لمن<br />يخنع لاعداء الله ولا يخنع لامر الله ائنكم تريدون ان تضحكوا<br />علينا ام تريدون ان تضحكوا على الله ومتى كان الخوف من<br />امريكا وأعوانها أعظم عندكم من الخوف من الله الم تعلموا ان<br />الله أكبر 0<br />3- اعلموا ان معظم النار من مستصغر الشرر 0<br />4- ام تريدون ان تضيفوا شىء آخر لاثبات حسن ولائكم لهم مثلما<br />قرر سابقا الاحتفال بأعيادهم واعتباره اجازة حتى لانتهم<br />بالتشدد وغيره<br />5- لماذا هذا الهوان فى تعاملنا مع دينناوتذكر ان الله أكبر<br />ولا مكابرة مع الله ولا منطق تتشدق به للتبرير ان الله<br />سيحاسبكم على تفريطكم فى القليل قبل الكثير لانكم المسئولون<br />ولان رسول الله قال ( كلكم راع وكلكم مسئول عن رعيته )<br />فلتتركوا مواقعكم ان كنتم لاتستطيعوا الثبات على الحق<br />او قولوا الحق وتشبثوابه واعلموا ان الله معكم ومطلع عليكم<br />وبيده عذابكم او نصركم وبيده حياتكم ومماتكم فهل من منتصر<br />لله ام هل لم تعلموا نداء (و اســلا مــاه) الذى يستصرخ فيكم<br />روح الجهاد والفداء لدين الله<br />ان رسول الله عندما أوذى فى الله لم يتخلى عن دعوته ولكنه تمسك<br />بها واستمر صابرا محتسبا ثابتا على الحق لا يلين فهل لكم فى<br />رسول الله اسوة حسنة ام تخافون ضرب السياط وتذكر ان لربك سوط<br />عذاب 0<br />6- ان دفاعى عن دين الله بالحماسة السابقة ينبع من احساسى مما<br />يكاد للاسلام من الكافرين وممن تعرفهم فى لحن القول ولاننى على<br />ثقة فى ان المسئولين ليسوا من هؤلاء ولا من هؤلاء لذا وجب على<br />التنبيه والتحذير مما يكاد للمسلمين وحتى فيما يعتبره البعض<br />من صغائر الامور وتفاصيلها فالشيطان يكمن فى التفاصيل0<br />هذا رأيى وادعو من له صله بمن يتخذ القرار ان ينصحه بالحسنى<br />مبينا وموضحا وضاغطا وأدعوكم جميعا للتعبير عن رأيكم ولاحجر<br />عليكم وأخيرا أدعو الله تعالى ان يفتح بيننا وبين قومنا انه<br />خير الفاتحين 0 ولا حول ولا قوة الا بالله"
archived = "2004-10-18"
