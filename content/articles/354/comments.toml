text = "أيها المؤمنون إنتبهوا 0القضاء علينا هو الهدف الاسمى لهم(اعداء الإسلام)0لوتركناهم يفعلون ما يريدون<br />فلنشاركهم افضل فى ذلك0<br />رسالة للقائمين على شئون الدولة:- انتم بذلك السبب الرئيسى فى تواجد الإرهاب باعمالكم المتسلطة0<br />ولتسئلوا انفسكم لماذا لا تضعون قيودا على اجراس الكنائس0لعله ابسط دليل على اننا تحكمنا قوى خارجية هى فقط التى تتولى تحديد مصيرنا ورسم مستقبلنا0باللة عليكم من يرضى بهذا الذل والهوان فى بلادنا0<br />ياسادة نحن نعيش فترة إحتلال نعم إحتلال فكرىوإدارى وسياسى وهواخطر من احتلال الارض0"
