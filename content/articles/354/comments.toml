subject = "علي جمعة"
text = "أصدر الشيخ علي جمعة فتوي، نشرتها وكالة أنباء الشرق الأوسط المصرية (مينا) يقول فيها: \"اتفق الفقهاء الأربعة (مالك وأبو حنيفة وابن حنبل والشافعي) على أنه يمكن أن يكون الأذان واحدا في البلدة كلها وأنه يكفيها الأذان الواحد لأن الأصل في الأذان هو الإعلام.\"<br />وأضاف جمعة أن توحيد النداء للصلاة مطلوب \"خاصة إذا كان ذلك من أجل استيفاء شروط الأذان وآدابه وشروط المؤذن وصفاته.\""
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018154849/http://www.20at.com:80/article.php?sid=639"

