text = "انا شايفة ان دا قرار منطقي جدا بدل ما كل واحد صوته غبي يطلع يدحك الناس عليه بدل ما يركزوا في الادان .. دا غير اللي بيشرأ و اللي بيشكل الحروف غلط و مهازل بتحصل ... و بعدين تفرق ايه اللي بيدن واحد و لا الف ... المهم حدث الاذان في حد ذاته ... و بلاش نضيع وقتنا في المظاهر و المشاكل الفرعية و ياريت نركز في القضايا المهمة"
