[[comments]]
order = 98
subject = "رغييييييييي"
author = "معاذ"
posted = "2006-10-16"
text = "الصديق مسلم لا أعرف ماذا تقصد بأني خرجت عن الموضوع؟<br />ولكن عموما أوضح لك أنني قصدت النقاب ولم أخرج عن اطار الموضوع لحظة<br />ان النظرة الدونية للمرأة والتي لا ترى منها الا الجسد وفتنته هي التي تبرز ظاهرة مثل ظاهرة النقاب والبرقعة<br />وأنا ان كنت استطردت أكثر فهذا لم يكن على سبيل خلط الحقائق وانما لأوضح رأيي كاملا حتى لا أضطر الى أي توضيح آخر ولذكر الجوانب الأخرى من النقاب التي تجعلني أراه ظاهرة غير متحضرة فهو يساوي كل ما ذكرته مجتمعا ويعبر عنه يعبر بصراحة عن كون المرأة جسدا يجب مداراته دون النظر الى انسانيتها<br />أعتقد أن د. أشرف حمدي التقط ما قصدته واقتبس منه حتى أوضح أكثر ما قصدت:<br />(هل تريدون معرفة علاقة النقاب بالحضارة ؟<br />النقاب بكل بساطة يعتبر الرجل ذئب والمرأة قطعة لحم . وكأننا نعيش في غابة . النقاب يلغى كل نوع من الانسانية والتحضر ويعتبر البشر حيوانات لابد من تكميم افواهها كي لا تعض . انا بمجرد رؤية منقبة اشعر بالاهانة . اهانتها لي ولنفسها كبشر متحضر قادر علي ضبط نفسه وغرائزه الحيوانية.<br />المسلم اللي بجد يا أخ نادر هو اللي لو اتحط وسط شاطيء عراه يعرف كويس قوي يحافظ علي نفسه وعلي دينه بغض البصر وجهاد النفس . والا كان كل واحد مسلم سافر أوروبا انحرف وقعد طول الليل والنهار ينهش في الستات هناك ويجري وراهم في الشوارع واللعاب يسيل من شدقيه)<br />الى حمدي: تصدق أنا فرحان فيك أخيرا شفتك متعصب ومتحمس وخرجت عن هدوئك ده أنا كنت هنسى يا راجل انك بشري زينا وعموما انا مبحسدش يا عم ولو مصمم انها حسد انا هبعتلك بكرة على الميل بتاعك حجاب يحميك من عيون الحاقدين أمثالي"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 99
subject = "الى المنقبات سيروا على بركة الله واتركوا الكلاب تنبح"
author = "مطلوب فوري"
posted = "2006-10-16"
text = "{ يَا أَيُّهَا النَّبِيُّ قُلْ لأزْوَاجِكَ إِنْ كُنْتُنَّ تُرِدْنَ الْحَيَاةَ الدُّنْيَا وَزِينَتَهَا فَتَعَالَيْنَ أُمَتِّعْكُنَّ وَأُسَرِّحْكُنَّ سَرَاحًا جَمِيلاً ، وَإِنْ كُنْتُنَّ تُرِدْنَ اللَّهَ وَرَسُولَهُ وَالدَّارَ الآخِرَةَ فَإِنَّ اللَّهَ أَعَدَّ لِلْمُحْسِنَاتِ مِنْكُنَّ أَجْرًا عَظِيمًا ، يَا نِسَاءَ النَّبِيِّ مَنْ يَأْتِ مِنْكُنَّ بِفَاحِشَةٍ مُبَيِّنَةٍ يُضَاعَفْ لَهَا الْعَذَابُ ضِعْفَيْنِ وَكَانَ ذَلِكَ عَلَى اللَّهِ يَسِيرًا ، وَمَنْ يَقْنُتْ مِنْكُنَّ لِلَّهِ وَرَسُولِهِ وَتَعْمَلْ صَالِحًا نُؤْتِهَا أَجْرَهَا مَرَّتَيْنِ وَأَعْتَدْنَا لَهَا رِزْقًا كَرِيمًا ، يَا نِسَاءَ النَّبِيِّ لَسْتُنَّ كَأَحَدٍ مِنْ النِّسَاءِ إِنْ اتَّقَيْتُنَّ فَلاَ تَخْضَعْنَ بِالْقَوْلِ فَيَطْمَعَ الَّذِي فِي قَلْبِهِ مَرَضٌ وَقُلْنَ قَوْلاً مَعْرُوفًا ، وَقَرْنَ فِي بُيُوتِكُنَّ وَلا تَبَرَّجْنَ تَبَرُّجَ الْجَاهِلِيَّةِ الأُولَى وَأَقِمْنَ الصَّلَاةَ وَآتِينَ الزَّكَاةَ وَأَطِعْنَ اللَّهَ وَرَسُولَهُ إِنَّمَا يُرِيدُ اللَّهُ لِيُذْهِبَ عَنْكُمْ الرِّجْسَ أَهْلَ الْبَيْتِ وَيُطَهِّرَكُمْ تَطْهِيرًا ، وَاذْكُرْنَ مَا يُتْلَى فِي بُيُوتِكُنَّ مِنْ آيَاتِ اللَّهِ وَالْحِكْمَةِ إِنَّ اللَّهَ كَانَ لَطِيفًا خَبِيرًا }(الأحزاب/ 28-34)"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

