text = "عبدالله مفتاح : يارب تكون استريحت<br />د.أشرف حمدي: ربنا يخليك<br />فاطمة: عيب ومش منطقي انك تحكمي على فكرة من منطلق رؤيتك لعدة حالات شاذة<br />حمدي : كالعادة متزن وهادئ<br />مسلم : انا مقصدتش كده خالص وأظن فهمت قصدي من التعليق الأخير<br />نيفين : لازم نختلف ولا منبقاش بشر أسوياء وعموما أنا وضحت وجهة نظري وأكيد استوعبتي رأيي خلاص<br />نادر : اما أنت تعاكس واحدة وتتحرش بيهاعشان قال ايه متبرجة يبقى انت اللي انسان شاذ _اعذرني_ ومش محترم ومش متدين وبعدين شكلك كده متعرفش يعني ايه علماني"
archived = "2006-11-28"
