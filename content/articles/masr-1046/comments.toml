[[comments]]
order = 71
subject = "النقاب بدعة"
author = "فاطمة"
posted = "2006-10-15"
text = "اخواني انا اتكلمت قبل كدة في نقطة ان النقاب بدعة و سقت الادلة علي كدة في تعليق سابق و عندي المزيد من الادلة لكن اسمحولي ني اكتفي باللي قلته لاني كنت عايزة اثير الفكرة فقط و النقطة التانية اللي عايزة اتكلم فيها ان كل واحد حر يلبس اللي هو عايزه و من هنا يبقي المنقبة حرة تلبس النقاب حتي لو احنا مش مقتنعين بالنقاب ... اسمحوا لي اختلف معاكم في النقطة دي للاسباب الاتية:<br />1-فعلا كل واحد حر يلبس اللي هو عايزه لكن في حدود الاطار العام اللي حدده الله سبحانه و تعالي يعني متجيش واحدة لابسة لبس خليع تقول انا حرة<br />2- اختلفنا علي اذا كان النقاب فرض ام فضيلة ام بدعة و عشان كدة السلطة في الدولة من حقها تاخد بأي رأي فيهم و السلطة أخدت برأي ان النقاب مش فرض و شافت ان النقاب يمثل تهديد للامن و انه اصبح وسيلة للتخفي و من حقها تمنعه و انا فاكرة كويس ايام هوجة الارهاب كان المتطرفين بيتخفوا في النقاب و مازال الوضع قائم و كمان في حرامية بيستخدموا النقاب وسيلة للتخفي<br />3- دي نقطة ملهاش علاقة بالموضوع بس عندي تساؤلات ... الفتاة اللي تضررت من منع النقاب في المدينة الجامعية و سابت التعليم كان قدامها اراء كثيرة بتقول لنه مش فرض و قدامها كمان فتاوي ان الضرورات تبيح المحظورات و انه حتي لو فرض ممكن تقلعه و هي داخلة المدينة الجامعية فقط و تلبسه أول ما تخرج ... اعتقد ان الفتاة دي لو كان العلم فارق معاها جدا كانت اخدت بأي من تلك الاراء الا لو هي لا تقبل المزايدة علي مبادئها فلتصبر و تحتسب لكن متجيبش الذنب علي حد و لا تلومن الا نفسها ... سؤال اخر للمنقبات انتوا من جواكم مش نفسكم تيجي حكومة اسلامية زي السعودية تفرض النقاب بالقوة علي النساء زي السعودية؟ طب فين الحرية هنا؟ و ليه احنا نتضامن معكم و لم تتضامنوا معنا؟<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
