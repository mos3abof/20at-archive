text = "اشرف ومعاذ لعدم قردتكم للرد تركتم الموضوع كله الا انا كتبة وركزتو في موضوع التحرش..شكلكم ضاربين فوووووووول<br />اقرأو الموضوع كويس وبعدين ردو ياهمج..<br />يعني الاصل في الموضوع النقاب لو انتا عاوز اختك تتبرج وتطلع بمافتنها بجنز وصدر وعاوز الشباب المصري يسكت ويقول عيب..مالعيب الي هي بتعملة دا اصلا..<br />ركز على جوهر الموضوع ياحبيبي انت وهو..<br />مضوع التحرش دا من شبب عدم احتشام النساااااااااااء..<br />وربنا يخلي لمصر شارع الهرم.."
