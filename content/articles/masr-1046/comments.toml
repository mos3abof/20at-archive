posted = "2006-10-14"
text = "و الله اللي انا افتكره ان لما النساء كانت بتتنقب قبل دعوة قاسم أمين كانت مصر محتلة من الانجليز و لما حصلت ثورة يوليو و انتصرت مصر علي الاستعمار مكانتش النساء منقبات<br />مش عارفة بقي وقت سقوط الاندلس كان ايه النظام ... متهيألي كانت النساء منقبات"
