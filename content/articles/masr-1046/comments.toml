text = "اقتباس:(ثقافة قطيع الاغنام يا معاذ<br />أرسل هذا التعليق بواسطة : عبدالله مفتاح<br />مرة اخرى يصركثير من الشعب المصري على انه من اكثر شعوب الارض ابداعا في الاتباع الاعمى الذي يلغي العقل؟ وهو ما يسمى بثقافة قطيع الاغنام<br />كتب معاذ فقال( النقاب بكل بساطة يعتبر الرجل ذئب والمرأة قطعة لحم . وكأننا نعيش في غابة . النقاب يلغى كل نوع من الانسانية والتحضر ويعتبر البشر حيوانات لابد من تكميم افواهها كي لا تعض . انا بمجرد رؤية منقبة اشعر بالاهانة . اهانتها لي ولنفسها كبشر متحضر قادر علي ضبط نفسه وغرائزه الحيوانية. \"\"\")<br />على فكرة يغني الكلام مش أنا اللي باعته<br />ركز شوية والنبي"
