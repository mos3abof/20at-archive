[[comments]]
order = 28
subject = "جريدة الغد وملف الصحابة (1)"
author = "مزمز أو موزة nashwah.blogspot.com"
posted = "2006-10-13"
text = "من مدونة( كهف للنشوة)<br />((((العدد الأخير من جريدة الغد أثار مشكلة معروفة, بسبب أنه أصدر ملفا عن (أسوأ عشر شخصيات في الاسلام)<br />الكل تابع هذه المشكلة, وقرأ الملف الذي أصدر, أو حتى سمع عن الموضوع من بعيد, ولا أعرف ان كان الترويج لهذه المشكلة مقصودا أم أنه كان طبيعيا, و لكن بما أني بطبعي لا تروق لي نظرية المؤامرة(الشماعة), فقد رأيت أن ردود الفعل كانت عفوية.<br />اليوم فقط علمت أن فضيحة الامام الأقذر محمد سيد زفتاوي شخ الأزعر(لا توجد أخطاء املائية هنا) قدم بلاغا للنائب العام ضد الجريدة,<br />قرأت الخبر وتعجبت, ثم ابتسمت وقد بدأت أتصور الموضوع, مولانا الفقيه الامام قاللك أجامل السادة الحبايب وأهه يبقى اسمي بدافع عن الاسلام, أصل بصراحة عدد الجريدة الأخير ده كان خطر موووووووووت على الاسلام, والدكتور قال لازم نضحي بالجريدة والحزب عشان الاسلام يعيش, ومولانا مكدبش خبر, قاللك كله الا الاسلام, الكفار دول عايزين يقطعوا رزقنا وينغصوا علينا في أكل عيشنا, وهكذا قام مولانا متشمللا بتقديم البلاغ (لا أعرف التهمة طبعا ولكن ممكن تكون ان الجريدة تبع حزب الغد وحزب الغد بتاع أيمن نور وأيمن نور معارض للنظام والفرخة عايزة قمحة والقمحة عند الفلاح)....)))))<br />nashwah.blogspot.com<br />مدونة كهف للنشوة"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

