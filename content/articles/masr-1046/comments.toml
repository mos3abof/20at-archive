text = "و انت عارف يا معاذ انى بحب كل اراءك و بتفق معاك فى كتير منها بس المره دى جت اوت<br />بالنسبه لفاطمه انتى بقى حكايه<br />انا مش عارفه انتى قصدك توصلى ايه من خلال كلامك على المنقبات بشكل وحش كدا<br />اولا انا مش منقبه و النقاب مش فى خططى المستقبليه حتى بس مش معنى ان واحده عايزه تتقرب لربنا اننا نقول عليها كدا<br />زى ما المحجبه افضل من غير المحجبه(اقصد ف الالتزام بتعاليم الدين علشان متفهمش غلط)\"فصدقينى ان المنقبه افضل من غير المنقبه لان كفايه انها بتقتدى بامهات المؤمنين حتى لو و بكرر لو النقاب مكانش فرض مع انى حاسه انه فرض فعلا و الله<br />عموما موقف جامعه حلوان غلط و انا مع سوسه انهم يعينو ناس علشان المنقبات و يبقى الموضوع انتهى<br />و لو روضه اللى معلقه فوق روضه عبد الحميد بقولها انا علقت تانى ف موضوع صيام النصارى و بقوللك انا عايزه الرابط اللى قولتيلى عليه"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

