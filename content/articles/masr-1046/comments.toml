capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 82
subject = "الأخ معاذ مرة أخرى ؟؟؟؟؟؟"
author = "مسلم"
posted = "2006-10-15"
text = "معاذ يقول :::<br />النقاب مهوش فرض ولا سنة وانما اقتداء بزوجات النبي (أو هكذا تحسب المنقبة)<br />وفي الحقيقة أنا بعتبره مظهر غير حضاري ومتخلف<br />بس مش معنى كده انه بدعة<br />اللي يقول كده يبقى واضح ان عمره ما قرأ في الدين<br />لأن العلماء يا اما كانوا بيعتبروا فرض يا اما اقتداء بأمهات المؤمنين<br />لكن بصراحة ماحصلش ان في عالم محترم قال انه بدعة<br />معنى كلامك النقاب ليس فرض و ليس سنة و ليس بدعة ..<br />طيب النقاب حكمه ايه يا أخ معاذ إذا لم يكن واحد مما سبق ؟؟؟؟؟؟؟؟<br />إذا كان اقتداء بامهات المؤمين كما تقول<br />و أيضا مظهر غير حضاري إذا أمهات المؤمنين رضي الله تعالى عنهم .......؟؟؟!!!؟؟؟؟<br />ممكن تكمل الكلام لأني أخشى تكملته ؟"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 83
subject = "ملاحظات شخصية"
author = "معاذ"
posted = "2006-10-15"
text = "أولا أحب أن أؤكد أنني ضد منع النقاب وضد المنع مطلقا لأي شئ كان<br />لانه من الازدواجية أن نشتكي من استبداد الأزهر في بعض الأحيان بمنع الكتب والروايات ثم نوافق على منع المنقبات من ارتداء النقاب ليست هذه ليبرالية أبدا<br />أما بالنسبة لموضوع النقاب ولماذا أراه مظهرا غير حضاري فسأوضح رأيي ولكن أحب أن أؤكد أه رأي شخصي ولا أحتكر الحقيقة المطلقة لأني لست دوجماتيا أبدا<br />لقد بعث أحد المعلقين يقول أن الغرب يمتهن المرأة لأنه يتعامل معها على أنها جسد يتمتع به وكل مهمتها أن تكون مثيرة جنسيا<br />أقول أنا أن نظرتنا للمرأة لا تختلف كثيرا عن نظرة الغرب<br />هم ينظرون لجسد المرأة وحده ونحن أيضا لا ننظر الا لجسد المرأة باعتباره فضيحة يجب تغطيتها بالبراقع نحن نراها شيئا يحيا في هذه الحياة كعامل مساعد للرجل وهذا مرفوض عقلانيا ومنطقيا<br />فليس من المتصور أن يكون الله عز وجل قد خلق المرأة لتكون شيئا يخدم الرجل في حياته مثلها مثل الأنعام التي منها ركوبنا ومنها نأكل<br />أما بالنسبة لموضوع الاقتداء بزوجات النبي ص<br />فان الله عز وجل لم يأمر النساء بفعل كل ما فعلته أمهات المؤمنين قال تعالى ( يا نساء النبي لستن كأحد من النساء)<br />وقد اختصهن المولى بجملة من الواجبات خاصة بهن كنساء للنبي كقوله عز وجل (وقرن في بيوتكن) وكان التخصيص هذا تنزيها لهن عن كل دنية فهن زوجات أشرف الخلق ص.<br />أنا لا أريد أن تتعرى المرأة وتخرج للشوارع فهذا لا يختلف عن تنقيبها وحبسها في بيتها<br />ولكني أريد التعامل مع المرأة على اعتبار أنها انسان له عقل وروح وقلب وارادة وأسلوب حياة تتمناه وترسمه<br />أريد المرأة المبدعة الفنانة المثقفة المتعلمة العاملة الخلاقة المتدينة التي تحتم انسانيتها ونفسها<br />ولكل هذا أعتبر أن تغطية المرأة بالنقاب باعتبار أنه لا يجوز لأحد<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

