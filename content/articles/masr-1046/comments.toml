[[comments]]
order = 128
subject = "لا لكل أفاك أثيم"
author = "طالب علم سلفي"
posted = "2006-11-16"
text = "قبل كل شئ النقاب فرض عين على كل فتاة وإمرأة مسلمة ليس مقصور على ألاخوان فقط<br />-------------------ولكن----------------<br />هذا الكلب رئيس الجامعة لا يخشي إلا الأمن ونسي الله ولكن رسلتى لبست له ولا لغيره من الرجال أصحاب القلوب المريضة بل للفتيات الصالحات<br />إلى كل فتاة مسلمة منقبة لا تخلعى نقابك والى كل محجبة تنقبي والى كل متبرجة تنقبي أقتدي بنساء النبي التشبه بالصالحين خير الكلام يطول لكن لا تكونى كلسفيها سعاد صالح أو الحقيرة أمنة نصير أو غيرهم من النساء الغافلات الذين يستدله بحديث أسماء الضعيف وكيف تكون السيدة أسماء تلبس شفاف وتمشى فى الشارع كما يقوله السفهاء والغباء المحكم فى عقولهم لو كان النقاب فرض لماذا قال الله غضه أبصاركم هكذا يقوله السفهاء لأن الله قد أراد بهم سوء رغم علمهم بأمور الدين ولكن حينما يوصل للسياسة حكمه بقانون الدولة وليس الشرع هكذا يفعله كأمثال الحقيرات سعاد وأمنه وغيرهم أما الرجال طنطاوى ووزير الوقاف وغيرهم من الذين يخافه على منصبهم والكرسي الملعون يا فتاة النقب فرض والله ولكن لا مكان هنه لكي أنشر لكي كل الدلائل ولكن يجب أن لا تخلعي نقابك فهذا دليل جديد على فرضه فى هذا الزمن هو يتكلم عنه عامة الناس بل السفهاء من الناس والكفرة ولكن البعض يقول هناك علماء يقوله هؤلاء أشتره الدنيا وباعه الأخرة من أجل كرسي لعنة الله عليهم ولكن لا مجال للغة العربية أن أتكلم بها الأن أو أيات أو أحاديث ولكن يجب أن تعلمى أنتى على حق ولكل رجل أتقه الله فى نفسك وفى أهلك النقاب عفة وكرامة وطهارة ويجب أن تتغير هذه الحكومة فورا نريد حاكم يخاف علينا ياخذ أوامره من الله ورسوله لا من بوش وأعوانه حسبي الله ونعم الوكيل"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 129
subject = "الحقيرة الجاهلة فاطمة"
author = "واحد بيلعن أهلك"
posted = "2006-11-16"
text = "يا فاطمة يا أحقر خلق الله إلا تتقى الله فى كلامك<br />كيف تتجرئي على أسيادك أنتى تلومي الأخ المصرى عشان ما شاف تجارب وعشها هو الراجل محترم ما بيحب يروح شقق الدعارة إلى حضرتك منها ولازم تعرفي يا عاهرة أن الفتاة التى ترتدي النقاب وتزنى وتفعل كل حرام هى ليست منقبة إلا لذلك يعنى هى مش عايزة تتوب قامت لبست النقاب والنقاب هو الذى أفسدهاوأفسد أخلاقها لا العاهرات أمثالك حينما يحبه أن يفجوره أكثر يريده التستر فى بعض المناطق التى يتردد عليها معارفهايعنى للتستر فقط هكذا ما قلته لي زانية منقبة ترتدي للتستر فقط ومن الممكن أن أكون أعرفك أصل بشم رائحة العاهرات من على بعد يمكن أكون عملت معاكي يا عاهرة أولا أنا لست متدين ولا أعرف شئ غير الزنا مع أمثالك العاهرات ولكن أعرف أن النقاب لا تلبسه إلا المرأة الصالحة ولكن حينما رأيت فاجرة مثلك ترتدي هذا الزى أستغربت وسألتها قالت عشان ناس معينة مش عايزهم يعرفونى يعنى مش كل وحدة منقبة عاهرة زيك مش هنخلى الصالحات تخلع نقبها عشان وحدة بتعمل زيك وحست أنها هتتفضح لبسته للتستر فقط يبقى نخلى الشرطة تغير لبسها حضرتك عشان فى ناس بتلبس لبس الشرطة وبتنصب أنت حضرتك لبسه حجاب طيب فى عاهرات لبسه حجاب وفى عاهرات متبرجات تمشي الست عريانة بقة حضرتك ولا أيه أنتى عايزة وشك مكشوف ويقف علية الذباب مالك أنتى ومال الصالحات صحيح فاجرة وقدرة أتفووووووووووووووووووووووووووو على أهلك ما عرفه يربه عاهرة بنت ديوث"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

