text = "انا بعد الى حصل من هجوم على النقاب انا ان شاء الله حلبس النقاب كفضيله وليس كفرض وحدافع عنه بهذه الصفه.وانا اسمعت عن رؤيا راها احد الاشخاص فى منامه واتاه الرسول يغطى وجهه فساله الشخص هل هذا هو الحجاب فقال له النبى فى المنام نعم هذا هو الحجاب."
