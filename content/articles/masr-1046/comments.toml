[[comments]]
order = 120
subject = "كفايه خلاف"
author = "مش مهم فرض ولا سنة ولا بدعه..الفقهاء الاربعه اصحاب المذاهب نفسهم اختلفوا في هذا الموضوع وافضل شيء ان مافيش حد منهم اتهم الاخر بالكفر او الفسق او الزندقة لان كل واحد فيهم قام بتطبيق الاسلام بما يتناسب مع بيئتة وظروفه وبعضهم غير مذهبه بنفسه عندما انتقل لمكان اخروبلد اخري لها عادات مختلفه\"بس المهم انه مايخرجش عن الدين ويلغي الحجاب كفرض\".واحنا ما شاء الله علينا ماحدش فينا عارف واحد بالمائة من اللي كان الفقهاء دول عارفينه ومع ذلك كل واحد فينا بيتهم الاخر بالفسق والردة والفاظ اخري قراتها للاسف هنا وللاسف اكتر من احد المدافعين عن النقاب.مع ان حسن الخلقماحدش اختلف عليه انه فرض."
posted = "2006-10-25"
text = "وانا مش مع قانون منع النقاب لان المنتقبه لم تقم بشيءضد الدين ولا العرف ولا يشيء يخدش الحياء العام\"روحو اتشطرو علي اللي لابسين..........\"<br />لكن عليها ان تكشف وجهها امام الحرس عند الدخول الي اماكن معينه مثل المدينه قياسا علي جواز كشف وجهها عند الشهاده القضائية.ويبقي القائمين يعينوا موظفات غير منتفبات علي الابواب للتاكد من شخصيتهن.<br />عايزة اقول ان الاختلاف في الراي وارد ومطلوب ولا يفسد للود قضيه وبلاش نسيب كل المتفق عليه في ديننا ونخسر بعض علشان المختلف فيه."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

