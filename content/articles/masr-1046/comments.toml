[[comments]]
order = 111
subject = "الى مسلم"
author = "نيفين نيفى نوفا"
posted = "2006-10-18"
text = "اولا احب ارد تحيتك الجميله يا اخ مسلم<br />بالنسبه لموضوع انى قلت مش فى خططى المستقبليه فانا اردت بذللك المستقبل القريب و لكنى اتمنى طبعا ان اتشرف باءرتداء النقاب بل و ادعو الله انه يوقفنى لذللك لان مفيش طبعا حد يكره انه يقتدى بامهات المؤمنين<br />و مين عارف مش يمكن يكون ربنا كاتب انى ارتدى النقاب قريبا<br />اليست القلوب بين اصبعين من اصابع الرحمن<br />عموما تحيه طيبه و شكرا على مداخلتك الجميله"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

