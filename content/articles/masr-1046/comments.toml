text = "السلام عليكم ورحة الله تعالى وبركاته<br />كل ده ليه ما الحرية الشخصية تضل موجودة الي حابة تتحجب تتحجب والي حابة تحط نقاب تحط انتو شو دخلكم بعدين ليش كل التهجم دا على المحجبات ليش مفيش هجوم على غير المحجبات عيب يا عرب عيب يا مسلمين يكفيكم تهميش لذات ارفع رؤسكم ولو لمرة وحدة وقولو كلمة الحق النقاب افضل بكثير من التبرج عشان كدا انا اقول ربنا يهدينا وينصرنا على اعداء الدين بدنا دعاكم اخواتي انا نسير على خطاكم و نتنقب على الاقل نكون شخصيتنا الصح الاسلامية متل ما قالت أسيا."
