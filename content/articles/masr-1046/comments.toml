[[comments]]
order = 6
subject = "وجعلناكم امة وسطا"
author = "مطلوب فوري"
posted = "2006-10-13"
text = "يا جماعة في اقدس مكان في العالم وهو الكعبة بتكشف المرأة الوجه والكفين<br />وفيه واحدة بنت كانت منقبه وجاءها عريس يطلب الزواج منها واشترط ان تكشف وجهها فذهبت هذه البنك الى عامل دين وقال لها يا اختي انا عندي 12 حديث في صحيح البخاري يجيز للمرأة ان تكشف الوجه والكفين.<br />وزي ما الاستاذ حمدي اللي فوق قال المسالة مسالة امنية لابد عند دخول مكان عام لا بد من كشف الوجه حتى يتم التحقق من الشخصية.<br />وانا هنا بتكلم من بلد خليجية الشرطة بتعاني من هذا الموضوع وهو ان هناك رجال يلبسون ملابس النساء ويدخلون افراح النساء وذلك للتلصص على النساء.<br />فالاخت الفاضلة التي تريد ان تتعلم لا بد ان تكشف وجهها والا اذا كان الامر غير ذلك.<br />يبقى مفيش غير<br />وقرن في بيوتكن"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 7
subject = "وقرن في بيوتكم"
author = "مطلوب فوري/ منقول"
posted = "2006-10-13"
text = "وقرن في بيوتكن<br />بـسم الله الرحمن الرحيم<br />لقد اهتم الإسلام بالبيت المسلم واصلاحه اهتماما بالغا فأمر المرأة أولا بالقرار فيه<br />فقال : {وقرن في بيوتكن ولا تبرجن تبرج الجاهلية الأولي }.أي اقررن واسكن فيها لانه أسلم لكن واحفظ . (ولا تبرجن ...) أي لا تكثرن الخروج متجملات متطيبات كعادة أهل الجاهلية الأولى الذين لا علم عندهم ولا دين فكل هذا دفع للشر واسبابه .<br />وأمرها وأمر زوجها بعدم خروجها من بيتها حتي ولو طلقت فقال : ( لا تخرجوهن من بيوتهن ولا يخرجن ).ويشاركها الرسول – صلي الله عليه وسلم – في المسؤولية مع الرجل فيقول : \" والمرأة راعية في بيت زوجها ومسؤولة عن رعيتها \" إذ \" لا يصلح أخر هذه الأمه إلا بما صلح به أولها \" كما قال الإمام مالك رحمه الله<br />قال تعالى:{وقرن في بيوتكن ولا تبرجن تبرج الجاهلية الأولى وأقمن الصلاة وآتين الزكاة وأطعن الله ورسوله إنما يريد الله ليذهب عنكم الرجس أهل البيت ويطهركم تطهيرا}.<br />هذه آداب أمر الله تعالى بها نساء النبي صلى الله عليه وسلم ونساء الأمة تبع لهن في ذلك, فقال تعالى مخاطباً لنساء النبي صلى الله عليه وسلم بأنهن إذا اتقين الله عز وجل كما أمرهن, فإنه لا يشبههن أحد من النساء ولا يلحقهن في الفضيلة والمنزلة, ثم قال تعالى: \"فلا تخضعن بالقول\" قال السدي وغيره: يعني بذلك ترقيق الكلام إذا خاطبن الرجال, ولهذا قال تعالى: \"فيطمع الذي في قلبه مرض\" أي دغل \"وقلن قولاً معروفاً\"<br />قال ابن زيد : قولاً حسناً جميلاً معروفاً في الخير, ومعنى هذا أنها تخاطب الأجانب بكلام ليس فيه ترخيم, أي لاتخاطب المرأة الأجانب كما تخاطب زوجها.<br />وقوله تعالى: \"وقرن في بيوتكن\" أي الزمن ف<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 8
subject = "النقاب مش فرض"
author = "فاطمة"
posted = "2006-10-13"
text = "النقاب مش فرض و مدام مش فرض يبقي بدعة و كل بدعة ضلالة و كل ضلالة في النار و كفاية الاساءات اللي سببتها الجماعات المتطرفة للاسلام و كل من هب و دب بيتكلم علي تخلفنا و غباءنا ... طبعا عندهم حق اذا كانت الواحدة من دول بتتعامل مع نفسها زي الشوال<br />و بعدين المنقبات دول بيتعلموا ليه ... حنستفيد ايه من علمهم ميخلوهم في بيوتهم احسن و يفضولنا مكان في الجامعة بدل الزحمة و القرف<br />و لعلمكم بقي و دي قصة حقيقية انا شفتها بنفسي انا اعرف منقبة بتقعد في بيتها بالملابس الداخلية و كل الجيران بيتفرجوا عليها و هي عارفة كدة و جوزها دقنه 2 متر و اعرف 3 بنات منقبات اخوات كانو بيروحوا شقق مفروشة و لابسين نقاب عشان محدش يعرفهم .. انا مش بقول ان كل المنقبات كدة بس النقاب مش هو الحل ... التمسك بالاخلاق و الدين الصحيح هو الحل و كفايانا مظاهر بقي قرفتونا"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 9
subject = "الشيخة فاطمة"
author = "علي"
posted = "2006-10-13"
text = "يا حاجة فاطمة ...انا على الرغم اني مش مؤيد للنقاب اساسا<br />بس بجد انتي بتتكلمي بلهجة مستفزة ..بتدل على سطحية شديدة في التفكير<br />منقبات ايه اللي ملابس داخلية وشقق مفروشة<br />متفكونا بقا من حكاوي القهاوي والهجايص اللي بتقعدو تنموهالبعض<br />عايزة تنتقدي ...انتقدي بواقعية وعقلانية<br />لكن اقول ايه ..انا دلوقتي بكلم واحدة ..فاكرة ان عبد الحي عبيد خايف اوي على الاسلام من المتشددين المتطرفين الكخة الوحشين ...فعشان كده رفض دخول الطالبات المنتقبات ....متعرفش ان ده مش السبب ...بالعكس ....السبب هو الحرب على اي مظهر اسلامي...فهوا طبعا شخص منافق موالس مشتاق لوزارة التربية والتعليم ....فضيق الخناق على الاخوان المسلمين ..وعلى السلفيين ...وهاتك يا فصل ....<br />بس اقول ايه في حقارته<br />على العموم<br />حقارته مش هتيجي قد حقارة اللي معينه ...واللي معين اللي معينه ..."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 10
subject = "ايه الهبل ده"
author = "مسلم مصرى ومن جامعة حلوان"
posted = "2006-10-13"
text = "السلام عليكم ورمضان كريم انا عايز ارد على الهبل اللى قالته الاخت فاطمة اللى مش فاهمة اى حاجة وببتكلم وخلاص دى( مين اللى قال ان اى حاجة مش فرض تبقة بدعة)هو هبل وخلاص النقاب سنة واقرها الرسول صلى الله عليه وسلم لان نشائه كانوا بيلبسوا النقاب وبعدين اللى بيتكلم فى الدين يقول الله اعلم مش يقول بدعة وفى حديث بيقول فى ما معناه( من افتى بدون علم فل يتبوء مقعده من النار)بلاش بقة فتاوى وتقولى بدعة ولا مش بدعة وتنكرى سنة اقرها رسول الله ارحمونا شوية مش هتبقوا انتم واللى برة كمان انصرى دينك يافاطمة وانصرى اخواتك المسلمات الملتزمات بالسنة وبالحياء وده اجمل شئ ان يكون الانسان ملتزم بدل المهازل الى بتحصل واللى بنشوفها واقسم بالله انى كنت نازل امباراح الجامعة لاول مرة وشوفت بنات لبسة لبس زبالة وشباب قاعدة مع بنات قاعدة منيلة ومختلين بيهم ولا اكن فى رمضان ولا حاجة وندمت بصراحة انى روحت الجامعة وانا صايم وبقول للادرارة الكريمة اللى فى الجامعة يريد توفر امن من النساء على البوابة لحل مشكلة البنات الملتزمات المتعففات اقصد المنتقبات ويريد ننصر دينا."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

