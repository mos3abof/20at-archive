subject = "يا بلدنا يا عجيبة"
author = "معاذ محمود عامر"
posted = "2006-10-13"
text = "مصر أم العجايب والله العطيم<br />أنا مش هتكلم عن النقاب وقرار منعه<br />فبرغم رفضي للنقاب كمظهر غير حضاري<br />الا أن من حق أي انسان أن يفعل ما تمليه عليه أفكاره<br />لكن النقطة اللي غايظاني أوي هي المظاهرات الجامدة دي 3000 واحد لو كل جامعة نزل تظاهر فيها 3000 واحد في نفس اليوم كنا قدرنا نغير نظام مبارك الفاشي الديكتاتور من زمان<br />بس والله حاجة تجنن<br />مفيش لا أولويات ولا نظم ولا قواعد<br />كله تخبيط وجنان وهلفطة في هلفطة وكلام ملوش أي معنى<br />أنا بجد قربت أتجنن أو أنتحر"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

