[[comments]]
order = 12
subject = "انتوا كلكوا مجانيين او عالم جهله"
author = "أرابيسك"
posted = "2006-10-13"
text = "النقاب فرض ولا صفة مستحبه للمرأة<br />مش مهم هوا اية المهم<br />ان كل انسن حر فى تصرفاتة و مش من اى حد يتعدى عليها<br />البنت اللى مشيا عريانة \" body و بندكور , مينى جيب حرة \"<br />و ما سمعتش على قانون يمنعهم من دخول الجامعه<br />يبقى هنا فى تمييز عنصرى و عدم مساولة فى الحقوق بناء على نص الدستور المصرى<br />صح و لا لأ يا اخوانا يا بتوع القانون و حقوق الانسان<br />قرار فى تعدى على حرية الفرد<br />امال لية ما سمعناش امكوا سوزان بتاعة المراه بتدافع عن حق المنقبات<br />و لا المجلس القومى للمراه للمتبرجات فقط<br />خلاص بنفس النظرية اللى الكل مقيدها<br />ممكن اقول مفيش بنت هاتدخل الجامعه الا و هى محجبة...... مهو الحجاب فرض ....و مش ممنوع لدواعى امنية ....و الدستور بيقول ان مصر دولة مسلمة<br />و ممكن نعمل شرطه للقبض على المتبرجات فى الشوارع<br />من الاخر سيبوها كل واحد حر فى تصرفاتة بدل ما نكون اسوأ مما نحن فية<br />الولى نغطى البنات العريانة مش نكشف البنات المتغطية زياده عن اللزوم<br />و حكاية دواعى الامن دى .....فدى مسؤلية الجامعه يكون فى حراسة من الحريم يكشفوا وش البنات و يتاكدوا انهم من المدينة مش غرب او رجالة<br />مش مشكله البنت المنقبة"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
