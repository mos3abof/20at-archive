subject = "هجص إيه يا...خ...لات؟"
author = "عادل"
posted = "2006-10-13"
text = "جاتكم وكسة متخلفين هو في أحلى من البنات بالشورت المحزق وإلا ياريت توبلس كمان، تملي نقلد في العرب الجرب اللي بيجرونا لورا. وبعدين إيه لزمة سكنة المدينة الجامعية من أصله، كل واحدة تدور لها على صاحب ويعيشوا مع بعض زي البلاد المتقدمة وإسرائيل، جاتكم نيلة متعروفش صالحكم فين. ياريت السادات عايش لسه كنا تقدمنا ياتيران."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

