subject = "مع المصرى و روضه ووقفه مع معاذ و عبد الله و فاطمه"
author = "نيفين نيفى نوفا"
posted = "2006-10-15"
text = "اولا انا مع مصرى فى حكايه اللى عايزه تلبس النقاب تلبس و اللى عايزه تقلعه هى حره لكن اننا نفتى و او نهلفط زى ما قال امصرى و نفتى النقاب فرض و لا سنه و لا بدعه فدا كله مرفوض<br />و انا مش فى مكان يسمحلى انى افتى لان فيه حديث عن الرسول بيقول اجراكم على الفتوى اجراكم على النار و انا بخاف<br />بالنسبه لمعاذ انا بصراحه استغربت جدا من رايك فى النقاب انه مظهر غير حضارى لان صدقنى يا معاذ حتى لو انت مقتنع بكدا مينفعش تعلن راى زى دا علانيه على الموقع<br />اول مره بختلف معاك يا معاذ لان حتى لو و بقول لو النقاب مش فرض ميبقاش مظهر غير حضارى صدقنى الكلمه كانت صعبه شويه و دا مش معناه ان عبد الله قصد يهينك بس يمكن التعبير خانه شويه(مش قلنا نهدى اسلوبنا شويه يا عبد الله و على فكره الشغل واخدك مننا جداو للحديث بقيه يا عبد الله)<br />و مع ذللك عجبتنى جدا يا معاذ لما قلت ان النقاب مش بدعه و"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 73
subject = "حقيقة المشخصاتى عادل إمام"
author = "من جهة أخرى، تحدث جمعةالشوان(أحمد الهوان) بحزن عن الفنان عادل أمام الذي جسد شخصيته في مسلسل \"دموع في عيون وقحة\"، بعد أن قال إنه أهانه في أول مقابلة بينهما في عام 1988م، عندما قدم نفسه له، فما كان منه إلا أن ضحك بسخرية، قائلاً: \"أنا اللي جمعة الشوان...أنا اللي عرفت الناس بيك....أنت لاشيء.. .أنا السبب في شهرتك\"، فأخبرته أني قدمت عيني وقدمي للوطن، فماذا قدمت أنت؟."
posted = "2006-10-15"
text = "وقال إنها كانت المرة الأولى والأخيرة التي قابل فيها عادل إمام، وأشار إلى أنه عرف منذ تلك اللحظة أن \"المشخصاتي\" لابد أن يضع له دور يظهر به أمام معجبيه. وفي ختام الحوار، قال الشوان إنه يقوم حاليًا بتدوين هذه الأسرار التي لم يفصح عنها من قبل لبيعها لإحدى القنوات الفضائية بعد أن رفضها التلفزيون المصري."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

