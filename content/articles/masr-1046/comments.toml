[[comments]]
order = 66
subject = "أنتم والدنمارك مرةاخرى"
author = "احمد يقول انته صايم"
posted = "2006-10-15"
text = "زعلت من كلامي على منال وهي البادئة (بشم الروائح)<br />أنتم كالبهائم تمشي وراء بعضها البعض<br />تقول فاطمة:<br />(فعلا ما اجمل الفتاه المنقبة الساترة لجسمها التي تأتي الفاحشة سرا و تلبس النقاب رياءا<br />وما أعفن الفتاة المتبرجة التي تتقي الله حق تقاته سرا و جهرا )<br />حلوة دي(تتقي الله... وتتبرج)..لو كانت تتقي الله فكيف تتبرج ...<br />(أتؤمنون ببعض الكتاب وتكفرون ببعض)<br />يذكرني كلامك ومن هم مثلك بمالك ابن نويرة<br />ألنقاب موجود غصباً عنكم وعن اللي يتشدد لكم<br />اقول للاخوات المنقبات ..أصبروا<br />طريق الجنة محفوف بالمكاره<br />وطريق النار مزين بالشهوات"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 67
subject = "الي كاتب تعليق انتم و الدنمارك"
author = "فاطمة"
posted = "2006-10-15"
text = "أخي الا تعلم ان رسول الله - صلى الله عليه وسلم - قال \"الصيام جنة فلا يرفث ولا يجهل وإن امرؤ قاتله أو شاتمه فليقل إني صائم مرتين والذي نفسي بيده لخلوف فم الصائم أطيب عند الله تعالى من ريح المسك يترك طعامه وشرابه وشهوته من أجلي الصيام لي وأنا أجزي به والحسنة بعشر أمثالها \" رواه البخاري ومسلم عن أبي هريرة - رضي الله عنه - البخاري برقم 1894، ومسلم 1151<br />اتؤمن ببعض سنة نبيك و تكفر ببعضها؟ يعني حتي لو حد بدأ بالاساءة و انت صائم متدخلش معاه في خناقة و لا تقوله الفاظ لا تليق بمسلم و حتي لو مش صايم اقتدي بخلق نبيك عليه الصلاة و السلام و رد الاساءة باحسان و دعاء بالهداية و او توضيح هادئ و نقد بناء<br />كتبت ايضا في تعليقك \"حلوة دي(تتقي الله... وتتبرج)..لو كانت تتقي الله فكيف تتبرج\" طب و المنقبة اللي بتزق الناس في المسجد اللي كتبت عنها في تعليق سابق الا تؤمن ببعض الكتاب و تكفر ببعضه؟ اليس الايثار جزء من الايمان ؟ اليست النظافة من الايمان ؟ فكيف تقبل المسلمة علي نفسها انها تنزل من بيتها بدون نظافة ... الخلاصة محدش كامل كلنا فينا عيوب و الايمان مش بالمظهر و نسأل الله الهداية<br />كتبت أيضا \"ألنقاب موجود غصباً عنكم وعن اللي يتشدد لكم\" لا اعتقد ان الرسول عليه الصلاة و السلام بدأ دعوته بان الاسلام موجود غصب عن اي حد و عن اللي يتشدد له بل بدأ دعوته بالتسامح و الخلق الحسن و انصحك انك تقتدي به و ان تستغفر الله عما صدر منك من اساءات و عسي الله ان يغفر لك و انا عن نفسي سامحت اي حد صدرت منه اي اساءة لشخصي و استغفرت الله ايضا علي اول تعليق مستفز بعته و عشان كدة حتلاقي كل تعليقاتي اللي بعده مفهاش اساءة لاي شخص هنا فيها فقط دلائل علي وجهة نظري<br />و اتمني من اي حد بيكتب تعليق انه ميكتبهوش و هو غاضب أو مستفز<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 68
subject = "اللهم إرفع مقتك و غطبك عنا"
author = "تونس (رويترز) - احتدم الجدل في تونس في الآونة الاخيرة بشكل لا يسبقه مثيل حول ظاهرة عودة الحجاب بقوة الى الشارع التونسي بعد تأكيدات حكومية على رفض هذا اللباس \"لانه ينال من المكاسب التي تحققت للمرأة التونسية\"."
posted = "2006-10-15"
text = "وانضمت صحف تونسية من بينها من هي مملوكة للخواص اليوم الجمعة الى الحكومة في اعلانها رفضها ارتداء الحجاب ووصفته بأنه لباس طائفي دخيل.<br />وفي الشق المقابل شن حقوقيون تونسيون هجوما كاسحا على الحكومة بسبب ملاحقة الطالبات المحجبات في الجامعات واجبارهن على خلعه.<br />وكان الامين العام للحزب الحاكم الهادي مهني عبر في وقت سابق عن رفضه ارتداء الحجاب ووصفه بأنه ظاهرة دخيلة على مجتمعاتنا محذرا من أنه سيدفع المرأة في تونس للقبول بأن تكون مهمتها الاعمال المنزلية والانجاب فحسب.<br />كما وصف الرئيس التونسي زين العابدين بن علي منذ يومين الحجاب بأنه لباس طائفي دخيل وقال ان اللباس التقليدي التونسي كفيل بضمان قيم الحياء والاحتشام.<br />تأتي هذه الحملة بعد أن عادت ظاهرة ارتداء الحجاب بشكل ملفت الى الشارع التونسي وخصوصا في الجامعات التونسية.<br />وقالت صحيفة الصباح \"اللباس الطائفي.. الخمار والنقاب والحجاب مظاهر لاتمت لمجتمعنا بصلة وفيها خطر على كياننا الاجتماعي\".<br />وشبهت نفس الصحيفة المتحجبات والرجال أصحاب اللحي \"بأصحاب الكهف الذين استفاقوا من سباتهم بعد قرون طويلة\".<br />وارتفعت في الاونة الاخيرة أصوات منظمات حقوقية تونسية ومعارضون نددوا بمنع الحكومة طالبات تونسيات من متابعة الدروس الا بعد خلع الحجاب وتوقيع اقرار بخلعه.<br />غير ان صحيفة الصحافة الحكومية رأت \"ان الدعوة الى ارتداء الحجاب في بلد لم يكن هذا الزي من تقاليده في أي وقت من الاوقات هي دعوة مالها الفشل بفضل الوعي المتنامي بما تبطنه من مارب سي<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

