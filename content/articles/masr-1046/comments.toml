[[comments]]
order = 113
subject = "نصبر... الدنيا مش لونها بمبي"
author = "على باب الله"
posted = "2006-10-23"
text = "أولا السلام عليكم ورحمة الله وبركاته... وتقب الله طاعتكم في رمضان... وعيد سعيد مبارك علينا وعلى الأمة الإسلامية كلها... في كل مكان.. من العالم.. أحبابنا وإخواننا وأخواتنا...<br />ممكن نهدا شوية ... ونصلي ع النبي...<br />الحبيب الشفيع صلى الله عليه وسلم..<br />مهو مش كل حاجة نجري ونختلف مع بعض وحنا مسلمين..<br />نفكر بهدوء شوية...الإسلام ديننا والحمد لله.. طب في موقف زي ده الإسلام بيأمرنا بإيه.. التحاكم لكتاب الله سبحانه وتعالى وسنة رسوله صلى الله عليه وسلم... طيب حلو أوي<br />الصلاة فرض حد اختلف.. طبعا لأ.. الخمر حرام.. مفيش خلاف... آه فهمتوني.. يعني في معلوم من الدين بالضرورة.. وفي كمان حاجة اسمها نصوص محكمة لا خلاف عليها.. يعني إيه لا خلاف عليها؟ طبعا بين الفقهاء اللي فاهمين أكتر مننا.. وفي حاجة اسمها الجمهور.. طبعا مش جمهور الكورة مع احترامي وحبي للكورة... ولكن قصدي جمهور العلماء..<br />م الآخر النقاب أمر مختلف عليه.. حتى من قال إنه فرض أخذا بمذهب الشافعي رضي الله عنه والذي أعلنه المفتي بصراحة.. لن يخرج النقاب عن كونه مختلف عليه... والشاهد ما قاله الإمام مالك رضي الله عنهم أجمعين...<br />إذن الأدلة ظنية.. وهنا يأتي الحكم الإلهي<br />وأولي الأمر منكم.. الحمد لله إننا مسلمين وأولوا الأمر العلماء.. واجتهدوا وقالوا الأفضل الآن ألا ترتدي النقاب في مصر.. حتى لو كان الحكام.. مالم يأمروا بمعصية.. مفيش غير الصبر.. مأمورين ومحكومين بديينا إن ارتضيناه.. طيب واللي شايفة إنو فرض ومصممة.. ترى أين مصلحتها الشخصية.. وكل أدرى بمصلحته الشيخصية.. الشخصية.......... ! والله يتولانايارب"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

