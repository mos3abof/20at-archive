subject = "الأخ معاذ مرة أخرى بعد المرة الأخرى"
author = "مسلم"
posted = "2006-10-15"
text = "نص كلام الأخ معاذ :::<br />هم ينظرون لجسد المرأة وحده ونحن أيضا لا ننظر الا لجسد المرأة باعتباره فضيحة يجب تغطيتها بالبراقع نحن نراها شيئا يحيا في هذه الحياة كعامل مساعد للرجل وهذا مرفوض عقلانيا ومنطقيا<br />فليس من المتصور أن يكون الله عز وجل قد خلق المرأة لتكون شيئا يخدم الرجل في حياته مثلها مثل الأنعام التي منها ركوبنا ومنها نأكل<br />أما بالنسبة لموضوع الاقتداء بزوجات النبي ص<br />فان الله عز وجل لم يأمر النساء بفعل كل ما فعلته أمهات المؤمنين قال تعالى ( يا نساء النبي لستن كأحد من النساء)<br />وقد اختصهن المولى بجملة من الواجبات خاصة بهن كنساء للنبي كقوله عز وجل (وقرن في بيوتكن) وكان التخصيص هذا تنزيها لهن عن كل دنية فهن زوجات أشرف الخلق ص.<br />أنا لا أريد أن تتعرى المرأة وتخرج للشوارع فهذا لا يختلف عن تنقيبها وحبسها في بيتها<br />ولكني أريد التعامل مع المرأة على اعتبار أنها انسان له عقل وروح وقلب وارادة وأسلوب حياة تتمناه وترسمه<br />أريد المرأة المبدعة الفنانة المثقفة المتعلمة العاملة الخلاقة المتدينة التي تحتم انسانيتها ونفسها::<br />انتهى كلام الخ معاذ ::<br />يا أخ معاذ أكرمك الله مازلت لم توضح لنا ما هو الرابط بين النقاب و الحضارة ::<br />أنت تقول لا نريد أن نتعامل مع المراة كجسد .. فعلا هي ليست جسد و في نفس الوقت هناك أوامر و نواهي شرعية لابد من الرجوع إليها و عدم تخطيها أما موضوع أنها خادمة للرجل و تابعة له و أنها مسلوبة الإرادة<br />هذه الأوصاف يمكن أن تنطبق على كل النساء المنتقبة و غير المنتقبة .. فلماذا نلصقها بالنقاب .. ما زلت لا أدري.. إذا كانت المراة ترتدي النقاب و أنها ترتديه عن اقتناع فما يمنعها من الإبداع و الثقافة و حرية التعبير .. و أن تكون عنصر فعال له قيمته .. مازلت أخي معاذ تربط علاقات مت<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
