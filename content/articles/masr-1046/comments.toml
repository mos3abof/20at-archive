subject = "يا خسارة"
author = "عبدالله مفتاح"
posted = "2006-10-13"
text = "معاذ عيب عليك تقول النقاب مظهر مش حضاري؟<br />مين اللي لعب في دماغك وفهمك ان التحضر بيتعرض مع النقاب<br />مفهومك للتحضر خاطئ جدا<br />والبنت اللي عايزة تقتدي بزوجات النبي هي الاكثر تحضرا يا معاذ<br />البنت اللي بتعاني من جهل مطبق وتقول ما مدام النقاب مش فرض يبقى بدعه<br />مش ممكن الجهل ده كله<br />هو يا فرض يا بدعه؟<br />ربنا يهدي"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
