text = "كلامك يدل على الشيوخ الذين تسمع لهم حيث ان الفتنة و البلاء و الشيطان المتحرك على الارض هم النساء<br />واكثر ما يحزننى فى هذا التيار هو تبرير ما يقوم به الشباب المنحرف بداية من المعاكاسات الكلامية الى التحرش الى الاغتصاب والسبب بسيط \"هى اللى مش لابسة صح\" لا افهم كيف يبرر بعض الدعاه هذه الحوادث بما تلبسه الفتيات واين المسئولية الفردية ؟ وان كل انسان يتحمل نتيجة افعاله<br />وهل الرسول صلى الله عليه و سلم والصحابة يتحرشو باصحاب الريات الحمر؟"
