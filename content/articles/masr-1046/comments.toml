[[comments]]
order = 46
subject = "الي الاخ مصري"
author = "فاطمة"
posted = "2006-10-14"
text = "شكرا علي نصيحتك لية اني ابطل ابص علي شبابيك الجيران فعلا انا المفروض اغض البصر و مش المفروض لما اشوف واحدة واقفة علي السلم بملابسها الداخلية اني اقولها استري نفسك عشان كل واحد حر في سلم عمارتهم .. و عملا بهذه النصيحة انا بنصح كل شاب يشوف واحدة لابسة لبس غير لائق انه يغمض عنيه بنصحهم كمان يسيبوا اخواتهم يلبسوا اللي يعجبهم و اللي مش عاجبوا يغمض عينه زي ما عمل الشيخ ابو دقن زوج السيدة براحتها"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 47
subject = "مخنوق"
author = "يا جدعان ياعالم يا ناس يا قووووووم"
posted = "2006-10-14"
text = "طول عمرى اسمع عن هذه المشكله الرهيبه المستعصيه على الحل و على الفهم:<br />هو الحجاب فرض ولا لا والحجاب احسن و لا النقاب<br />يعنى هم المسلمين طوااال هذه القرون مازالوا غير قادرين حتى الان على البت فى هذا الموضوع."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 48
subject = "المسألة مش محتاجة تعقيد"
author = "معاذ محمود عامر"
posted = "2006-10-14"
text = "يا جماعة المسألة بسيطة جدا جدا<br />النقاب مهوش فرض ولا سنة وانما اقتداء بزوجات النبي (أو هكذا تحسب المنقبة)<br />وفي الحقيقة أنا بعتبره مظهر غير حضاري ومتخلف<br />بس مش معنى كده انه بدعة<br />اللي يقول كده يبقى واضح ان عمره ما قرأ في الدين<br />لأن العلماء يا اما كانوا بيعتبروا فرض يا اما اقتداء بأمهات المؤمنين<br />لكن بصراحة ماحصلش ان في عالم محترم قال انه بدعة<br />وكمان مش معنى اننا واحد رافض النقاب اقوم اقول المنقبات دول بنات مش محترمة<br />لانه هو كده ابقى بفتقر لأبسط قواعد المنطق والاحترام لأنه طبيعي انك ممكن تقابل واحدة منقبة بالعافية فمتبقاش قد نقابها لكن ده مش معناه ان المنقبات سيئات الخلق<br />على العكس تماما<br />بس كمان المنع كما هو معروف سياسة بربرية وغير محترمة بالمرة انها سياسة المستبدين الأغبياء ومن حق الانسان ارتداء ما يشاء من اللباس فهذا شئ يخصه هو فقط<br />كمان من الجهل والمزايدة في الدين ان واحد يقول ان سبب هزيمة المسلمين دلوقتي هو ان النساء مش لابسين نقاب<br />طب ده يتقاللوا ايه والنبي<br />مفيش رد"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 49
subject = "رحمة الله عليك يا شيخ شعراوي"
author = "غريب الدار"
posted = "2006-10-14"
text = "رحمة الله عليك مولانا الشيخ محمد متولي الشعراوي فبعده انتشر العاة في الفضائيات هذا يفتي وهذا يكذب وذاك يعتزل التمثيل ويربي الذقن ويعمل داعيا وناهيك عن اشرطة الارصفة والكتيبات التي تلقى بما تحمله من كلام الله على ارجل الجالسين بوسائل المواصلات والله وحده يعلم من كاتبها واي علم اتى له .<br />ياوزير الاعلام رأفة بنا من الدعاة الموضة ومن اعتقدوا ان الفتوة نوع من التمثيل الدرامي . اعملوا مسح لارصفة شوارع مصر وحرزوا كل الاشرطة وحاربوا مروجوها فكلكم راعى ومسئول عن راعيته. وأخر دعوانا أن الحمد لله رب العالمين"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 50
subject = "الحرام والحلال"
author = "اية"
posted = "2006-10-14"
text = "النقاب مش عيب ولا حرام بس الله سبحانه وتعالي قال إنه بس الوجه والكفين الي بصح الكشف عنهم والحجاب ضروري والنقاب حرية لراي البنات هم احرار ما بصير حدا يغصب التاني"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 51
subject = "أمة ضحكت من جهلها الأمم"
author = "طالب أزهرى"
posted = "2006-10-14"
text = "أنا كنت عاوز أرد على القرار لقيتى نفسى جوه دوامه من الردود اللتى تنم عن عصبيه لرأى بدون أى دليل لا من الدين ولا حتى من ما يدعى الحريه أولا مش هقدر أفصل الدين عن كلامى بس هكلم اللى بيخدعوا نفسهم و يقولوا النقاب تخلف و أسألهم يعنى ما معنى الحريه لو فرضنا ان من الحريه لبس اللى على مزاجك يبقه من حق البنت تلبس اللى عاوزاه من غير هدوم ولا نقاب بمزاجها مع ان ده أصلا مش صحيح ده كلام غربى فى الدين الأوامر و النواهى يعنى انت مش حر فى كل حاجه الحجاب واجب يبقه مفيش حريه فى لبس التبرج انما النقاب اختلفوا واجب ولا سنه ولا عاده يبق من العادى ان البنت تلبسه حتى لو كان عاده دى حريه لا يوجد ما يمنعها من واجب و حرام ما أظنش ان فى حد يرجوا الصواب هيخالفنى الرأى أما من لا يريد الحق و يريد اثبات أن رأيه هو الصح فلنتقابل يوم لا ينفع مال ولا بنون و السلام عليكم و رحمة الله"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 52
subject = "روضه"
author = "طيب يافاطمه"
posted = "2006-10-14"
text = "المنتقبات وحشينواشرار وداعرات صح<br />بس خدنى بالك ان امهات المؤمنين كنا منتقبات<br />الحاجة التانيه ان التى تنتقب بتبقى عايزة تتشبه بامهات المؤمنين<br />يعنى عايزة تلبس عشان تعمل سنه عن امهات المؤمنين<br />وانا اقسم بالله لى اصدقاء منتقبات كنسمه الهواء العليل فى الرقه والادب والذوق والتدين<br />منم من اذا احتجت الدعاء لانى فى كرب من اتصل بها لتدعوا لى لانى اتوسم فيها الاخلاص والقرب من الله(احسبها كذلك ولا ازكى على الله احد والله حسيبى)<br />(طبعا مش فاهمه الجمله الماضيه مش مهم<br />المهم انا اعرف بقى مش محجبات وزباااااله فى سلوكهم<br />هل يبقى كل المش محجبات حثاله؟<br />لا طبعا<br />هل كل اللى مبيصلوش غير امناء ومحتالين لانك صدمتى بواحد؟<br />هل كل اساتذتك معندهمش ضمير لان عندك 3 من 5 حتى كدة<br />السيئه تخص والحسنه تعم<br />وليس العكس<br />وتذكروا وانتم تتحدثون عن النقاب<br />انكم تتحدثون عن فتيات<br />اردن ان يكونّ اطهر الطاهرات<br />فحجبنا نفسهن داخل خيمه شديدة الحر ولكن؛تقربا لله لينالن ثواب الفضيله<br />الاخت اللى بتقول ريحتهم وحشه<br />اختى<br />من ادراك انها لم تكن تسعى على عمل رزقها من الصباح الباكر حتى امطرت عرقا وجهدا؛<br />هل تعرفين شىء عن ظروفها ؟؟<br />يعنى ايه اللى هيتعلموا منهم هيعملوا ايه يعنى؟<br />خيرا اخوانى هل تفضل ان تربى ابنائك فتاة غير متعلمه ام متعلمه؟<br />الاجابه بتلقائيه متعلمه<br />مساله ان يعملن او لا يعملن مساله شخصيه بحته<br />اهم شىىىىىىىء للى بيدعوا ان النقاب حجب للعقول<br />سيزا نبراوى كانت زميله هدى شعراوى ومازالت حيه وفى برنامج من قريب قالت لو اعرف ان بخلعنا النقاب ومطالبتنا لحريه المراة كنا سنصل لتلك الدرجة ما كنت عاونتها ابداواقسم بالله ان امى رات هذا الكلام بعينيها<br />النقطه الاخيرة<br />لماذا حتى عندم<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 53
subject = "النقاب بدعة"
author = "فاطمة"
posted = "2006-10-14"
text = "الاخ مصري مش حنزل بمستوايا لاحاديث و اتهامات شخصية و مش حستخدم لغتك التي لا تتناسب مع الاسلام اطلاقا في الحوار مع فتاة لا تعرفها حتي لو كنت بتختلف معها لكن عموما شكرا علي فكرة الجزء التاني من عمارة يعقوبيان لاني فعلا ممكن اكتب 10 اجزاء عن فساد المجتمع المسلم من الحاجات اللي شفتها بعيني بس و اذا كانت تجربتك محدودة فارجو انك تطلع علي تجارب الاخرين حتي تكتسب خبرة تعينك في الحكم علي الامور<br />و الي الاخت روضة شكرا علي تعليقك الهاديء و ارجو ان تراجعي تعليقاتي مرة اخري حتلاقي اني كاتبةفيها \"انا عارفة ان مش كل المنقبات كدة\" لكن انا حبيت اجيب الامثلة دي فقط عشان اثبت ان الدين مش بالمظاهر و عشان اكسر التابو فقط مش اكثر"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 54
subject = "الى فاطمه ؛من روضه"
author = "طيب يابطوطه مادمتى معترفه ان مشكلهم كدة يبقى لازم تكونى محايدة فى عرضك للنماذج وتعرضى سالب وموجب عشان متبقيش متحيزة"
posted = "2006-10-14"
text = "ربنا يكرمك ويرزقنا جميعا صلاح الدين والدنيا ورؤيه الحق حق واتباعه والباطل باطل واجتنابه؛ويارب ارزقنا جميعا دعوات مستجابه فى ليله القدر<br />ولا تنسوا الدعاء الذى اوصى به الرسول احب النساء اليه \"امنا عائشه\" فى ليله القدر ان تدعوا\"اللهم إنك عفوا كريم تحب العفو فأعفو عنى\""
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 55
subject = "الي الاخت فاطمه"
author = "حمدي"
posted = "2006-10-14"
text = "شوفي يااخت فاطمه<br />انت من حقك ترفضي النقاب فيما يخص شخصك بمعني انك من حقك تقولي ان شايفه ان النقاب ليس واجب علي المراه المسلمه لان فيه اراء فقهيه لعلماء محترمين بتقول كده<br />لكن مش من حقك ان تحاولي انك تلزمي الاخرين بارائك من خلال التجريح فيهم لان زي مانت عارفه ان فيه اراء فقهيه اخري لعلماء محترمين تري وجوب النقاب<br />والخلاف ده غالبا سيظل موجود<br />**اما حكاية تصرفات بعض المنقبات الي انت حكيت عنها حتي لو صحت مش دليل علي صحة كلامك او عدمه لان التشريع ناخده من اراء العلماء وليس بناء علي تصرفات الناس<br />وانا متاكد انك عارفه في ضميرك ان فيه الالاف النماذج المشرفه لمنقبات ملتزمات ومثال للرقي والادب في تصرفاتهم<br />** اما حكاية الريحه فالمنطق والعقل بيقولوا ان البنت اللي بتتنقب حريصه الي درجة التشدد ان جاز القول علي طاعة ربها فمن الطبيعي ان تكون علي وضوء في معظم الاوقات و تحافظ علي نظافتها اكتر من مثيلاتها.... لان ده جزء من تدينها ... انا مش بقول ان كل المنقبات بالشكل ده واكيد في نماذج من اللي انت حكيتي عنها لكن المنطق والعقل والواقع المعاش بيقول ان الغالبيه العظمي من المنقبات هم من النوع الاول الملتزم والمحترم والذي يكون حريص علي ان يتسق سلوكه العام بما يناسب تدينه<br />واذا كان قابلك بعض النماذج السيئه فاكيد ان فيه نماذج جيده موجوده لكن لم تحتكي بيهم ربما لانطباعك المسبق عنهم<br />... الخلاصه اللي عايز اقولهاان نتصيد الاخطاء لبعضناعلشان نثبت صحة موقفناخطا<br />والاختلاف رحمه مادام بادب وباسلوب متحضر<br />وانتي طبعا توقعتي بعد كل الكلام ده ان اؤيد فرضية النقاب.. لكن الحقيقه انا مع الراي الذي يري حواز ظهور الوجه والكفين لكن ان مختلف معاكي علي طريقتك في عرض وجهة نظرك<br />وسلام"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 56
subject = "ربنا يهدي"
author = "عبدالله مفتاح"
posted = "2006-10-14"
text = "اولا معاذ: يا ريت تقولي انت ليه شايفه مظهر مش حضاري وايه هو مفهوم التحضر عندك رد عليا كده عشان انا عايز افهم وجهة نظرك<br />فاطمة:حديث اهو عشان اللي بيقول زوجات النبي صلى الله عليه وسلم لم تكن منتقبات عن عائشه قالت(كان الركبان يمرون بنا ونحن مع رسول الله -صلى الله عليه وسلم - محرمات فاذا حاذوا بنا اسدلت احدانا جلبابها من راسها على وجهها فاذا جاوزونا كشفناه)*<br />اخرجه احمد وابو داوود وابن الجارود والبيهقي في (الحج) وسنده حسن في الشواهد<br />ويقول فضيله الشيخ الدكتور /يوسف القرضاوي في كتابه الحلال والحرام (ومع هذا فالاكمل للمراه المسلمه ان تجتهد في اخفاء زينتها حتى الوجه نفسه ما استطاعت وذلك لانتشار الفساد وكثرة الفسوق في عصرنا ويتاكد ذلك اذا كانت جميله تخشى الافتتان بها .....)<br />ربنا يهدي"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 57
subject = "انا ضد النقاب"
author = "د. أشرف حمدي"
posted = "2006-10-14"
text = "الأخ معاذ محمود عامر<br />أحييك بشدة علي رأيك . انت فعلا بتفكر صح وحاجة تفرس حقيقي اننا ننزل في مظاهرات عشان قال ايه النقاب وسايبين النظام يقطع فينا كل يوم والتاني . سايبين المرضى بيموتوا قدام باب المستشفيات الحكومية بالآلاف وانا دكتور وعارف كويس اللي بيحصل . سايبين خطة التوريث ماشية آخر حلاوة وجمااااال . سايبين تزوير الانتخابات وهتك عرض الصحفيات قدام باب النقابة . وقال ايه : النقاب والحرب علي الاسلام . هو الاسلام قال اننا ناخد علي قفانا ونعيش زي الحيوانات لا تطالب بحقوقها ؟؟؟ حاجة تفرس صحيح"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 58
subject = "يا دكتور"
author = "عبدالله مفتاح"
posted = "2006-10-14"
text = "لا مدام انت دكتور يبقى اكيد معاك حق يعني دكتور وهيكون غلطان ازاي وليه وليه بقا<br />ههههههههههههه<br />ايه اللي جاب سيرة الفساد حد قال اننا مع الفساد ؟<br />لما نتكلم في الفساد نبقى نتكلم في الفساد ولما نتكلم عن النقاب يبقى نتكلم على النقاب ولا هندخل المواضيع في بعضها عشان الحق يضيع في النص؟<br />ربنا يهدي"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 59
subject = "هل الله ظلم المراه"
author = "عباس"
posted = "2006-10-15"
text = "اعتقد ان ربنا مخلقش المراه علشان تكون كلها عوره ازاى هو ربنا مش عادل يا جماعه معقول ان المراه تكون كده مش من حقها ان تظهر تكون فى قوقعه<br />تفتكر ربنا خلقها علشان تكون كدا بشكل ده<br />ربنا يرحمنا و يدينا عقل نفكر فى ان كل واحد فينا انسان ربنا خلقه علشان بيحبه اكيد ازاى يخلقه و يظلمه كدا ان تكون المراه كلها عوره ازاى"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 60
subject = "النقاب هو الحل"
author = "د. أشرف حمدي"
posted = "2006-10-15"
text = "الأخ عبدالله مفتاح<br />حبيبي مين قاللك ان الدكاترة مابتغلطش ؟<br />انا بقول وجهة نظري . ولا أخلط الأمور ببعضها لأنني أعتبر النقاب في حد ذاته أحد أوجه الفساد. وتحاملكم علي الأخت فاطمة الي حد سبها في بعض التعليقات ماهو الا هروب من الواقع ودفن الرؤوس في الرمال . هذا الشعب لا يحب مواجهة مشاكله فضلا عن الاعتراف بها أصلا . قل لي هل يجرؤ من خرجوا في مظاهرات النقاب ان يطالبوا بأبسط حقوقهم الانسانية فيما يخص آدميتهم تحت ظل هذا النظام ؟ احنا كده مانجيش غير في الهايفة . وانا غلطان يا سيدي . يارب كل بنات مصر تتنقب . هو انا حايشهم ؟ :) يمكن النقاب يغير النظام ويشغل العاطلين ويحسن الاقتصاد المصري ويرجع حقوق الناس اللي بتموت كل يوم من الجوع والقهر . ويعمّر الصحرا كمان ويوصلنا للمريخ ! ياريت يكون ده حل كل المشاكل والله ماكنش حد وجع قلبه .<br />http://caricatooz.blogspot.com/"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 61
subject = "تذكرة ذهاب بلا عودة لابو زعبل"
author = "تحيا مصــــر و يسقط مبارك"
posted = "2006-10-15"
text = "التعليق ده يا جماعة احتمال كبير يكون تذكرة مجانية لكاتبه الى ابوزعبل!<br />حد سمع عن اللى حصل فى احد ملاعب الكرة من اشتباكات عنيفة بين مشجعى الاتحاد السكندرى و قوات الامن؟<br />انا شفت الاحداث على قناة دريم و استغربت جداااااا<br />الشعب المصرى جاب الشجاعة دى كلها منين؟؟؟<br />و بعدين قلت فى عقل بالى يبئا يا واد لسه فى امل ان المصريين يثوروا على الظلم و القمع و ينتفضواااااا<br />و بدات مزيكة مسلسل رافت الهجان تزن فى دماغى و ده معناه ان فى فكرة كارثية خطرت على بالى!<br />ماذا لو خرج السبعين الف متفرج بتوع ماتشات الاهلى و الزمالك و قرروا يعملوا عصيان مدنى و يقلبوا نظام الحكم؟؟؟!!<br />اما لو حصل ده و الله لو جابوا قوات الامن المركزى بتاع التلاتين محافظة ما هيقدروا يعملوا حاجة<br />السؤال مين مستعد ينفذ الفكرة دى؟؟؟؟!!!<br />جاوب تكسب تذكرة ذهاب بلا عودة لابوزعبل"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 62
subject = "سارة ذات الـ 14 عاما تدخل في الإسلام"
author = "نادر"
posted = "2006-10-15"
text = "إذاعة طريق الإسلام :<br />الأخت الكريمة .. السلام عليكم ورحمة الله وبركاته .. بداية أحب تهنئتك على دخولك الإسلام ..<br />سارة :<br />وعليكم السلام ورحمة الله وبركاته ، شكرا لك ..<br />إذاعة طريق الإسلام :<br />هل يمكنك إعطاء زوارنا نبذة عنك ؟<br />سارة :<br />اسمي سارة وأبلغ من العمر 14 عاما .. وأدرس بمدرسة ثانوية بالولايات المتحدة الأمريكية.<br />إذاعة طريق الإسلام :<br />مرحبا بك أختي سارة .. وحقيقة أود أن أعبر عن شديد إعجابي ودهشتي لرؤية فتاة مثلك في هذا العمر تبحث عن الحق .. هل يمكنك أن تخبرينا كيف تعرفت على الإسلام لأول مرة في حياتك ؟<br />سارة :<br />أول مرة أتعرف فيها على الإسلام منذ 3 سنوات مضت .. كنت دائما ما أبحث عن الدين الحق .. وأردت أن أتعرف على الأديان الموجودة وأقرأ الكتب المختلفة .. وقد قرأت بعض الكتب عن الإسلام وأعجبت ساعتها بالإسلام إعجابا كبيرا ..<br />إذاعة طريق الإسلام :<br />أليس هذا من المستغرب .. طفلة تبلغ من العمر 11 عاما .. وتقرأ في الكتب الدينية للبحث عن الحق ؟ هل كان هناك شيء خاص يميزك عن باقي الأطفال في ذلك الوقت ؟<br />سارة -وهي تبتسم-:<br />نعم .. أوافق على اعتراضك .. فقد كان أصدقائي يستغربون بشدة من رغبتي في التعرف على الله .. ولكن أنا نشأت في أسرة نصرانية تعطي الدين أولوية في حياتها لذلك كان من الطبيعي أن أهتم بالدين .. مع اعتقادي أيضا أنني لابد من البحث عن الحق واعتناقي له بغض النظر عن الآخرين.<br />إذاعة طريق الإسلام :<br />هل كنت وقتها تقرأين القرآن ؟<br />سارة :<br />لا .. في ذلك الوقت لم أكن أقرأ سوى بعض الكتب الدينية عن الإسلام فقط.<br />إذاعة طريق الإسلام :<br />\"المرأة المسلمة تعاني من اضطهاد بسبب تعاليم دينها .. وينبغي عليها أن تتحرر مثل نساء الغرب\" .. ما رأيك في هذه المقولة ؟<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 63
subject = "الرد"
author = "نادر"
posted = "2006-10-15"
text = "اقراؤ بقية التعليق..<br />المهم الهدف هو رد البنت الاتي:<br />سارة :<br />لا .. المرأة في الغرب مضطهدة .. وهذه حقيقة يتجاهلها الكثير. المرأة في الغرب ليست إلا رمزا للجنس والشهوة .. أغلب النساء يرتدين الملابس الضيقة التي تستر أقل القليل من الجسد .. ويستخدمن أجسادهن للفت الانتباه وجذب الشهوات .. ووسائل الإعلام تزيد الضغط في هذه الموجة .. فالمرأة عندهم هي ذات الجسد الجميل .. ويجب على جميع النساء أن يحاولن الوصول إلى هذه الدرجة وأيضا يجب عليهن أن يحاولن تحقيق كل ما تطلبه وسائل الإعلام .. دون وجود أدنى اعتبار لاحترام الله سبحانه وتعالى أو على أقل تقدير احترام الذات.<br />إذاعة طريق الإسلام :<br />وهل ارتديت الحجاب ؟<br />سارة :<br />لا لم أرتديه بعد .. ولكنني أريد ذلك وأحب الحجاب جدا .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 64
subject = "المهم"
author = "نادر"
posted = "2006-10-15"
text = "الى العلمانيين الذين يعارضون النقاب ..<br />يالله ياكريم في هذا الشهر الكريم وفي العشر الاواخر..انكم تنحشرون يوم القيامة مع المتبرجات السافرات..<br />اذا كنتم تفضلون المتبرجات..<br />روحو شوفو معاهد الايتام عن عدد اطفال الزنافي مصر..<br />شوفو السبب ليه؟؟!!<br />راجعو اوراقكم حتلاقون انه اكثرها من الاختلاط في المدارس والجامعات التبرج قدام الشباب وعدم النقاب..<br />والا ايه اكثر جرائم الاغتصاب في مصر سببها التبرج واللبس الي الله لايوريكم في الشارع قدام الشباب؟؟<br />اما المنقبات الي يستغلون حجابهم ودينهم في غضب الله ودخولهم للاماكن المشبوهة..لاتحسبن ان الله غافلا عنكم.؟<br />فهذا مايخلينا نجمع الامه المسلمة على افعال بعض الاشخاص..<br />واصابع ادينا مش زي بعض؟؟<br />هل انت تفضل مجتمعك مجتمع تحضر على قولتكم..وتشوفون البنات الي ملابسها تحت الركبة والي لابسه جنز ضيق..وانواع الفواحش والزنا..<br />انا شخصيا شاب عمري 24<br />لاشفت وحده لابسه غلط تبدا تتحرك عندي الغرائز الجنسية وابدا اتحرش فيها زي كثير من الرجال..<br />لاكن والله ثم والله لاشفت وحده محتشمة ومنقبة في لبسها نااتعرضلها في شي بل بالعكس احترمها..<br />فهل ترضى اختك امك زوجتك تكون محترمة والشباب يحترمونها..<br />او ترضى انها تكون وحده يتحرشون فيها الشباب ويغازلونها ويتعرضون لها بالاذية؟؟"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

