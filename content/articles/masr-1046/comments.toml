posted = "2006-10-13"
text = "والله عيب عليك انت يا سيد عبد الله انك تقوللي ان فيه حد لعب في دماغي ده أسلوب غير متحضر يا سيد المتحضرين<br />ومفهوم التحضر ده مفهومي الشخصي ومش انت اللي هتعلمني اختار افكاري ومطلبتش منك تقتنع بيها بس لازم تحترمها<br />وبصراحة مش هرد على كلامك وزلا هدافع عن نفسي ولا هاشرحلك مفهومي للتحضر لأني هبقى بأذن في مالطة زي مبيقولوا"
