subject = "النقاب على المخ"
author = "زكريا"
posted = "2006-10-13"
text = "مشكلة النقاب مش إنه بيغطي الوجه فقط .. ده بيغطي المخ والعقل كمان .. وبيحط البنت من دول تحت غطاء كثيف من التخلف والغباء .. بالذمة عايزين يمشوا في الشوارع زي العفاريت .. ويدخلوا المدينة الجامعية والجامعة وخما زي العفاريت ليه .. ما هو شئ طبيعي جدا ضرورة التأكد من شخصية كل واحدة داخلة الجامعة والمدينة .. إنما اللي عايزين يمشوا في الشوارع زي العفاريت دول خليهم في البيت أحسن لحد ما ربنا يشفيهم"
