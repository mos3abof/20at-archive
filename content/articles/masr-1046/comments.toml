subject = "خبر منقول"
author = "تعيش الداعية الإسلامية الدكتورة سعاد صالح في ترقب وحذر شديد بعدما أهدروا دمها بأحد المساجد المصرية وذلك على إثر إفتائها بأن النقاب ليس فرضا"
posted = "2006-10-15"
text = "الدكتورة سعاد صالح وهي استاذة وعميدة سابقة بجامعة الأزهر اشتهرت في مجال الدعوة بـ مفتية النساء كانت قد أفتت الأسبوع الماضي في برنامج عم يتساءلون الذي يذاع على قناة دريم الفضائية بأن النقاب ليس فرضا على المرأة المسلمة واستدلت بأحاديث وأسانيد من الشرع غير أن فتواها أثارت حنق البعض ممن يعارضون توجهها لكن أكثر من آلمها وأزعجها ان يتجاوز الغضب مرحلة إهدار دمها على الملأ والدعوة لقتلها من أحد المساجد المصرية<br />ومن اللافت أن الدكتورة سعاد صالح، لم تكن وحدها في حلقة البرنامج التليفزيوني اذ كانت الى جوارها في البرنامج الدكتورة آمنة نصير أستاذة العقيدة والفلسفة بجامعة الأزهر، لكن دعوة اهدار"
