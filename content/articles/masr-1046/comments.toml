[[comments]]
order = 80
subject = "عتاب للأخ معاذ -- تحية لنيفين ---سؤال لفاطمة"
author = "مسلم"
posted = "2006-10-15"
text = "الأخ معاذ<br />أظن أن حضرتك ترد على المشاركات حسب مزاجك و اتمنى أن أكون مخطئ<br />أولا أنت لم تجب على السؤال كيف يكون النقاب مضاد للحضارة<br />و ما هو مفهوم الحضارة<br />ثانيا : لي مشاركة معك في موضوع جريدة الغد -- الغد هل تعتذر ---- باسم مسلم<br />و كنت أتمنى أن ترد علي و لكنك لم تفعل فهل تتابعها و ترد عليها<br />الأخت نيفين تحية و سلاما -- مصري - أبو هشام<br />الأخت فاطمة : هناك فرق بين فساد السلوك و فساد المنهج<br />هل سلوك المنتقبات الذي ذكرتيه يعتبر فساد سلوك شخصي ام فساد منهج<br />بمعنى هل هن سيئات لانهن يرتدين النقاب أم أن العيب في النقاب أم أن العيب في السلوك الشخصي<br />بمعنى آخر هل نمنع الناس من قيادة السيارات لان الحوادث مستمرة<br />ثالثا و هو الأهم ::<br />كلنا نتناقش بأسلوب سمك لبن تمر هندي<br />بمعنى كل واحد يناقش النقاب من و جهة نظر مختلفة و بالتالي لن نصل لنتيجة<br />المفروض أن نتفق على محاور المناقشة مثلا<br />نناقش النقاب من الوجهة الشرعية هل هو فرض أم سنة أم بدعة<br />و بناءا على النتيجة تكون الخطوة الثانية<br />هل يدخل النقاب ضمن الحقوق الشخصية إذا قلنا انه سنه و ليس فرض<br />ثم نناقش هل سلوكيات أفراد معدودين تعد طريقة سليمة للحكم على الباقين<br />و نناقش بعدها الأبعاد الاجتماعية للنقاب<br />أما طريقة كل اللي عنده كلمه يقولها فلن توصل لنتيجة<br />تحية للجميع ::<br />أما الأخ الليبرالي اللي بيكتب انجليزي<br />أرجوك أكتب عربي علشان نعرف نرد عليك .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 81
subject = "انتم والدنمارك-عنوان"
author = "سبْحانَك اللَّهُمّ وبحَمْدكَ أشْهدُ أنْ لا إله إلا أنْت أسْتغْفِركَ وَأتَوبُ إليْك"
posted = "2006-10-15"
text = "كل واحد سوف يحاسب على تصرفاته وأفعاله<br />وكل نفس بما كسبت رهينة<br />من يدعو للسفور والتبرج سيحاسب<br />ومن يدعو للحشمة والستر سيحاسب<br />والفرق يوم الحساب كبير<br />يوم تبيض وجوه وتسود وجوه<br />مرجعنا نحن المسلمين هو الكتاب والسنة<br />{فإن تنازعتم في شيء فردّوه إلى الله والرسول}<br />سبْحانَك اللَّهُمّ وبحَمْدكَ أشْهدُ أنْ لا إله إلا أنْت أسْتغْفِركَ وَأتَوبُ إليْك"
