subject = "متشرد بس بيحترم النقاب اوى وميقدرش يبص لوحده منتقابه"
author = "احمد كريم"
posted = "2006-10-24"
text = "انا عاوز ارد على ابن المرة الشرموطه زكريا وبنت المتنكه فاطمه ياولاد المتنكه النقاب ده حاجه غاليه اوى للبنات الغاليه لمه تكون عندك حاجه غاليه اكيد بتحافظ عليه اكتر وتبحب تكون فى امان ام الا قاله زكريا اولا زكريا العرص ده مش مسلم ده واحد امه جيبه من زنقات اتوبيس وفاطمه دى عاوزه تتنك بس مكسوفه"
archived = "2006-11-28"
