[[comments]]
order = 104
subject = "الأخ مدحت و الأخ معاذ و الأخت نيفين و الأخت فاطمة"
author = "مسلم"
posted = "2006-10-16"
text = "الأخ معاذ و الأخ مدحت<br />تحية طيبة و بعد ::<br />ذكرتم في كلامكم المتوافق الآتي \"\"\" النقاب بكل بساطة يعتبر الرجل ذئب والمرأة قطعة لحم . وكأننا نعيش في غابة . النقاب يلغى كل نوع من الانسانية والتحضر ويعتبر البشر حيوانات لابد من تكميم افواهها كي لا تعض . انا بمجرد رؤية منقبة اشعر بالاهانة . اهانتها لي ولنفسها كبشر متحضر قادر علي ضبط نفسه وغرائزه الحيوانية. \"\"\"<br />يا أستاذ مدحت أنا لا أوافقك في هذه النقطة أنت و معاذ لماذا تصر على أن النقاب هو اعتبار الرجل ذئب و المرأة قطعة لحم \"\" من أين أتيت بذلك التصور<br />اسمح لي هذا التصور في شيئ من المبالغة و التجني على الحقائق<br />أولا يا أخ مدحت انت و معاذ من الفطرة التي فطر الله الناس عليها هي انجذاب الرجال للنساء و ميل كل طرف للآخر و أتحدى أي شخص في العالم غير الشواذ طبعا يقول غير ذلك .. تقدر تنكر و جود فطرة تجاذب و ميل بين الرجال و النساء .. أظن إن هذا امر بديهي يا أستاذ مدحت ..<br />حسنا لو سلمنا بوجود علاقة فطرية بين كل ذكر و أنثى في هذا الكون و الأمر لا يتعلق بالبشر فقط و لكنه فطرة كل كائن حي<br />و ذلك لحكمة الحفاظ على النسل و الذرية فبدون تلاقي الذكر و الأنثي لا بقاء للانواع الحية<br />حسنا إذا سلمت معي بوجود هذه العلاقة الفطرية بين الذكر و الانثى كان لا بد أن يكون هناك تشريعات تنظم تلك العلاقة سواء قبل التلاقي أو بعده : لذلك قال تعالى قل للمؤمنين يغضوا من أبصارهم :: و قال تعالى وقل للمؤمنات يغضضن من أبصارهن ::<br />فهل كان الله تعالى يعاملهم على أنهم حيوانات تعالى الله عن ذلك و لكنهم بشر لهم فطرة و الله تعالى أعلم بها لذلك شرع لنا ما يحفظ لناحياتنا و ذواتنا \"\"<br />الله تعالى خلقنا و هو أعلم بنا لذلك شرع لنا شرعه الحكيم لنهتدي به و يكون لنا سياجا يحمينا و ل<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 105
subject = "الي الاخ مسلم"
author = "حمدي"
posted = "2006-10-16"
text = "انا اقعدت ادور في التعليقات كلها علي حد اسمه مدحت انت بترد عليه ولم اجده فياتري انت تقصدني بكلامك ...لكن علي العموم اسمح لي ارد علي مضمون كلامك بغض النظر انت موجهه لمين<br />**تعليقك الاخير يثبت بما لايدع مجالا للشك ماقلته انا في تعليقي السابق ان المشكله ليست في النقاب او الحجاب ولكن المشكله في تصور بعض الناس انهم يحتكرون الفهم الصحيح لدين الله<br />**لقد وضعتني انا ومعاذ وفاطمه في سله واحده...علي الرغم من التفاوت الشاسع بين ارائنا ..... لمجرد اننا اعتبرنا ان النقاب ليس واجبا علي المراه المسلمه<br />** يااخ ياسر لو قرات تعليقي في الرد علي فاطمه لوجدته كله دفاعا عن المنقبات وعن حقهم في ارتداء مايرونه زيا شرعيا<br />**انا ليست لدي مشكله مع النقاب ولكن المشكله بصراحه عندكم انتم عندما تروون ان كل مالايؤمن بفكركم اي بالنقاب لا يتبع شرع الله<br />ودعني اسالك سؤالا واضحا اريد له اجابه واضحه اذا تكرمت ؟؟؟<br />لقد دافعت انا ومعاذ عن حق المراه المسلمه في ارتداء النقاب رغم عدم قناعتنا بانه فرض علي المراه المسلمه فهل تستطيع انت ان تفعل مثل ما فعلنا بمعني هل تستطيع ان تدافع عن حق المحجبات الذين يكتفون بالخمار مثلا او يظهرون الوجه والكفين .. هل تستطيع ان تدافع عن حقهم في ارتداء مايرونه زيا شرعيا حتي لو لم تراه انت زيا شرعيا؟؟؟<br />**ثم من قال لك اننا ننكر الفطره الانسانيه في الانجذاب بين الرجل والمراه..لكن السؤال المطروح هل يمنع النقاب هذا الانجذاب للمراه<br />هل فقد الشباب السعودي مثلا انجذابه للمراه لانها ترتدي النقاب.. فاصبحت السعوديه خاليه من المعاكسات والتحرشات الجنسيه<br />***ثم اسمح ان اسالك انت وما تمثله من تيار ... الا يعتبر كلامكم عن ان كل من لا تلبس النقاب لا تتبع شرع الله اهانه لملايين النساء التي ت<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 106
subject = "بقية التعليق السابق"
author = "حمدي"
posted = "2006-10-16"
text = "ثم اسمح ان اسالك انت وما تمثله من تيار ... الا يعتبر كلامكم عن ان كل من لا تلبس النقاب لا تتبع شرع الله اهانه لملايين النساء التي تكتفي باظهار الوجه والكفين مثلا<br />*** يااخ مسلم انا ليس لدي مشكله في ان تؤمن باي منهج كان طالما انك لاتمنع الاخرين من المخالفين لك من ان يمارسوا في حياتهم ما يعتقدون انه الصواب وطالماانك لاتدعي انك تحتكر الحق والصواب"
