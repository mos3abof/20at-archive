text = "يا سادتي الأعزاء الإسلام بيحارب ككل وبيحارب في قواعده وأصوله مين يوم ما ظهر، الجديد في الأمر إنه منذ القرن الماضي تولى المهمة في بلاد المسلمين أشخاص محسوبين على الإسلام، من حكام ومشايخ السلطان ومفكريه ومبطليه ومزمريه..الخ الجوقة..<br />المدهش مثلا إنك تلاقي السيخ في أمريكا وأوروبا بيعفوا لوحدهم من لبس الخوذة أثناء قيادة الموتورسيكل، مع إن دي هناك فرض وقانون، إنما لما تيجي للإسلام فكله ممنوع، طب وإيه اللي طمعهم فينا؟ مش كونا في بلادنا بنحارب الإسلام زيهم؟ اللهم عفوك ورضاك ونصرك!"
