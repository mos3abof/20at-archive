[[comments]]
order = 115
subject = "الصبر مر.. فعلا مرررررررررر"
author = "على باب الله"
posted = "2006-10-23"
text = "سترون أثرة وأمور تنكرونها فاصبروا حتى تلقوني على الحوض..<br />عليهم ما حملوا وعليكم ما حملتم..<br />ليه... عشان ميكونش في ضرر أكبر..<br />مالم يأمروا بمعصية..<br />والعارية ادعيها وادعيلها.. أن يشرح الله صدرها وتعرف أن الحجاب كرامة أكرمها الله بها.. وكل ما افترض هو كرامة لها.. ورفعة من خالقها وباريهاوبين يوم وليلة بيكون قرار الحجاب فضل من الله..<br />لكن.. ياعبد الرحمن الصبر مر.. مررررررررر يا عبد الرحمن"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 116
subject = "أنا راح آخذكم معايا خطوة خطوة"
author = "عبدالرحمن"
posted = "2006-10-23"
text = "1- تقول أخت بأن لبس النقاب بدعة ومش فرض ... وعلي فرض صدق كلامها( وهو مش صحيح): فهل يجوز أن نجبر البنات في مصر علي خلعه ؟ طيب : الحجاب فرض فلماذا لا نجبر البنات في مصر علي لبسه ... وخاصة بأن اللبس العاري يثير شهوة الشباب وبشغلهم عن دينهم... وإلا بس خلع النقاب هو المطلوب وخلاص ..<br />2- يقول المسئول في الجامعة بأنه خايف علي البنات علشان كده منع لبس النقاب , طيب ما تخاف برضو وتمنع الاختلاط في الجامعة اللي مسبب الجوازات العرفية والتحرش ؟ وما تخاف علي البنات وتمنع الكبريهات والفيديو كليبات وتمنع شارع الهرم بأكمله ؟<br />3- يقول لك أحد الشباب بأن لبس النقاب تخلف ولبس غير حضاري والبنت السافرة لا نقاب ولا حجاب هي البنت المتحضرة ... بعدين بيقوم الشاب ده ويتحرش جنسيا بأحدي البنات السافرات ولما تيجي الشرطة تحاسبه بيصرخ ويقول لك \" وأنا ذنبي إيه هي اللي بتغريني بلبسها المحزق والملزق ده ... هي لو كانت ساترة جسمها ده ما حدش اتحرش بيها\" ... يا سلام علي أبوستين وش ده.<br />4- أنتو مش بتنادوا بالحرية الشخصية للبنت وعدم فرض شئ عليها ؟ طيب البنت اختارت تتنقب ... خلاص ما هي دي حرية شخصية ليها برضو .. وإلا بس الحرية الشخصية في التعري وخلاص .<br />5- تقول أخت هنا بأنها تعرف بعض المنقبات غير ملتزمات ومتبرجات ملتزمات ... وأحنا بنقول للبنت المتبرجة الملتزمة : بارك الله فيكي علي أخلاقكي الكويسة وزيدي من إيمانك وألبسي الحجاب بشروطه الشرعية ... ونقول للمنقبة غير الملتزمة : بارك الله فيكي علي لبسك النقاب وزيدي من إيمانك وحسني أخلاقك ... فلا نقول للمتبرجة أتركي أخلاقك الكويسة لأنك غير محجبة ولا نقول للمنقبة أتركي نقابك لأنك غير ملتزمة أخلاقيا وإنما نؤكد الكويس في كل واحدة منهن ونصلح الخطأ عند كل واحدة منهن ..<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 117
subject = "عيب يا دكتوره انتي مقرفه جدا"
author = "محمد"
posted = "2006-10-24"
text = "الاستاذه الدكتوره الفاضله والاستاذ المذيع في برنامج عم يتسائلون كيف رضيتي علي نفسك ان تثبتي بالدليل القاطع انكي متخلفه ثقافيا ليس فقط في تخصصك ولكن في المعلومات الدينيه البسيطه الله سوف يقتص منكي ومن الذي اهدي لكي شهاده البكالوريوس مش الدكتوراهمنه لله الله يخرب بيتك ليه ولمصلحة مين تعملي كده وتقولي كده حسبي الله ونعم الوكيل يا حجه المطلوب بعد كده تجيزي الشورت و السونتيان في الجامعه والله انتي لا تصلحي الا للغسيل فقط وكمان لن تصلحي لذلك تصدقي انا لست ملتزم ولكن بقيت اقرف منك عيب ياشيخه عليكي"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

