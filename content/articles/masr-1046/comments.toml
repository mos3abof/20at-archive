[[comments]]
order = 17
subject = "نقاب المتخلفين"
author = "محمد عباس"
posted = "2006-10-13"
text = "قال إيه .. عايزين يعملوا في حرس الجامعة وحدة خاصة بالمنقبات علشان يتأكدوا من شخصية المنقبات اللي داخلين .. طيب ولما يكون فيه داخل وحدة المنقبات دي بنتين ثلاثة يلبسوا النقاب برضه .. ساعتها حيبقى أمام الجامعة أحد حلين .. يا إما تمنعهم من إرتداء النقاب وبكده تبقى برضه بتحارب حرية اللبس .. يا إما تعمل وحدة داخل الوحدة مهمتها التأكد من شخصية الستات اللي داخل الوحدة .. وهكذا .. إلى ما لا نهاية .. مع إن الحل بسيط وواضح وصريح وهو منع نقاب التخلف ده داخل الجامعة .. وخصوصا إنه مسألة ليس لها علاقة بحرية العقيدة .. لأنه ليس من فروض الإسلام في شئ"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 18
subject = "الي الاستاذ ممتاز"
author = "زيزو"
posted = "2006-10-13"
text = "الي الاستاذ ممتاز اللي مبسوط اوي من القرار .. اظن انك من حقك انك تقول رأيك بس مش من حقك انك تفرض علي الناس يعملوا حاجه ... ثانيا<br />وبعدين ايهما افضل النقاب ام البنات اللي شبه مش لابسه حاجه وبيهيجوا مشاعر الشباب وبيعذبوهم .. مش الاولي اننا ننصحهم ونمنعهم من اللبس المسخره ده ولا بس احنا مش فالحين غير اننا نتنطط غير علي الناس اللي بتحاول تعمل الصح<br />يا خساره والله علينا مش فاحين غير اننا ننتقد وخلاص النقاب مش تخلف وغباء .. لكن التبرج ده اللي ضياع<br />وربنا يهدينا"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 19
subject = "فين الحرية الشحصية"
author = "ياسر ابو عمار"
posted = "2006-10-13"
text = "اموت واعرف لماذا تختفى دعاوى الحرية الشخصية حين يتعلق الامر بالمتدينين او ما يتعلق بالدين من قريب او بعيد ؟يا جماعة النقاب حرية شحصية يعنى من حق البنت ان تنتقب ولا يملك اى شخص ان يجبرها على خلع النقاب ،والله العظيم دى فضيحة ان يتواكب منع رئيس جامعة حلوان للنقاب مع دعوة \"سترو \"مش مكسوف من نفسك يا اخى ،على فكرة عداء عبيد للاسلاميين معروف من زمان ولكن الواحد عمره ما توقع ان تصل البجاحة الى هذا الحد ،وفعلا اذا لم تستح فافعل ما شئت ،نفسى اقول للمعلقين الفرحانين بقرار رئيس الجامعة: انتم غير منصفين .ازاى توافقوا على قهر اخواتكم علشان يلبسوا لبس هما مش راضيين عنه ،والله انا مش مصدق ان مصر يحصل فيها كده ،هل هى بداية لظهور اتاتورك فى شكل جديد .واخر سؤال لعبيد بيه ،لماذا لا تشترط على المرتديات المينى والميكرو جيب بالاحتشام طالما انك حريص قوى على التقاليد الجامعية ،منك لله وربنا كبير"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 20
subject = "الواقع غلب الطبيعة"
author = "مصطفى احمد دحروج"
posted = "2006-10-13"
text = "والله انا فهمت الكلام الى اتقاعل من هذا العنوان والرئى الراجح هوا ان ممكن يوكن النظر فية على خوف من حساسية المواقف الملتهبة فمثلا من الممكن ان الحجاب من الممكن ان يلبسةالرجال وعلى زلك تظهر الفاحشة فى الجامعة وهوا المكان الذى يطلق علية المدينة.<br />فمن الراجح انة عمل لا يعاتب علية هذا الرجل ولا ضرر ولا ضرار."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 21
subject = "بصراحة بخوفو"
author = "ريما"
posted = "2006-10-13"
text = "انا بصراحة مع الحرية الشخصية و هما حرين بلي بيبسو بس اا عني كنت اخاف منهم اكتير ايام الجامعة و ما اشوف وحدة منهم داخلة الحمام اجلكم الله و انا في اطلع بسرعة.. مهو انا مش شايفة وجهاا و سمعنا كتير قصص عم شباب بتخفو بنقاب.. و مكنتش بحكي معهم ابدا مهو صعب تتواصل مع شي اسود مش مبين منو شي<br />يعني كنت بحس بتقوى و ايمان البنت المحجبة المجلببة الي كاشفة وجها .. فعلا زي ما بقولو سماتهم في وجوههم<br />و بعدين النفاب نزل بس لامهات المؤمنين زوجات الرسول ..و بيحكو كمان المراة شديدة الجمال اذا خافت تكون فتنة ممكن تتنقب بس بصراحة عمري ما شفت منقبة جمالها صارخ كتير عاديات.. فليش كل هالغلبة؟ و بصراحة القرار الو اسباب امنية مقنعة.. يعني مكان للبنات و يدخلو مين ما كان بدون ما يعرفو هويته؟"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

