[[comments]]
order = 92
subject = "تعتبرون انفسكم بهائم"
author = "د. أشرف حمدي"
posted = "2006-10-15"
text = "الأخ نادر<br />أسمح لي أن أقول انك مثل كل الذين يدّعون الاسلام تعتبرون أنفسكم حيوانات . الله خلقكم بشر وانتم مصرّون انكم حيوانات اذا رأت قطعة من اللحم فسوف تنبش فيها مخالبها وأنيابها علي الفور . تقول بالحرف الواحد :<br />\" انا شخصيا شاب عمري 24 .. لوشفت وحده لابسه غلط تبدا تتحرك عندي الغرائز الجنسية وابدا اتحرش فيها زي كثير من الرجال.. \"<br />هذا معناه انك فقدت انسانيتك وأصبحت عبارة عن مجموعة من الغرائز الحيوانية . هل هذا هو ما تعلمته من الاسلام ؟ هل هذا كلام شخص متدين يعرف دينه ويخاف الله ؟<br />لقد اهتممت بالرد عليك لأنك تمثل شريحة كبيرة جدا من المسلمين بل والشيوخ ايضا أساءوا الي الاسلام كثيرا بتأكيدهم في كل مناسبة أن المسلم حيوان . الاغتصاب سببه التبرج والوقوع في الرزيلة سببه الاختلاط . هذا معناه بكل بساطة ان المسلمين يقفزون علي بعضهم البعض في الشوارع كالبهائم . وبالتالي لابد علي الفتاة ان تتنقب وتحمي نفسها من المسلمين المتوحشين الذين سينهشونها بمخالبهم وانيابهم بمجرد أن يروا وجهها أو شعرها .<br />ولا كأن عند الناس نخوة أو انسانية أو تحضر .<br />هل تريدون معرفة علاقة النقاب بالحضارة ؟<br />النقاب بكل بساطة يعتبر الرجل ذئب والمرأة قطعة لحم . وكأننا نعيش في غابة . النقاب يلغى كل نوع من الانسانية والتحضر ويعتبر البشر حيوانات لابد من تكميم افواهها كي لا تعض . انا بمجرد رؤية منقبة اشعر بالاهانة . اهانتها لي ولنفسها كبشر متحضر قادر علي ضبط نفسه وغرائزه الحيوانية.<br />المسلم اللي بجد يا أخ نادر هو اللي لو اتحط وسط شاطيء عراه يعرف كويس قوي يحافظ علي نفسه وعلي دينه بغض البصر وجهاد النفس . والا كان كل واحد مسلم سافر أوروبا انحرف وقعد طول الليل والنهار ينهش في الستات هناك ويجري وراهم في الشوارع واللعاب يسيل من شد<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 93
subject = "عنوان"
author = "عصام رشدى"
posted = "2006-10-15"
text = "الكرد ومزاعم العلاقة مع الموساد<br />فاروق حجي مصطفى<br />منذ سبعينيات القرن المنصرم لم تنقطع حديث علاقة الكرد مع إسرائيل،بين فترة وأخرى يثير الإعلام هذه المزاعم. بيد إن الكرد وبالرغم انزعاجهم من إثارة مثل هكذا الموضوع إلا أنهم كانوا دائما يقيمونها (إثارة حديث علاقة الأكراد مع إسرائيل) على أنها \"زوبعة في فنجان\". والحق لم يكن العرب هم الطرف الوحيد الذي يتحدث عن هذا الموضوع ولا هم من أثاروا هذه \"الزوبعة\". فالغرب وكذلك كتاب وباحثون إسرائيليون وغيرهم تحدثوا وكتبوا عنها جهاراً. والكثير من المراقبين اهتموا بهذه \"الزوبعة» جل اهتمام. من المعروف لكل جهة لها مصلحة في التحدث عن مثل هذه العلاقة، وربما إثارة مثل هذه العلاقة تخدم مصلحتهم، وكان آخر من تحدث عن هذه العلاقة هم الإسرائيليون أنفسهم وتحديداً ضباط إسرائيليون لا نعرف عن قصد أو غير قصد. في المرة قبل الأخيرة(قبل أسابيع ) كتب ضابط يهودي مذكراته عن موضوع علاقة الكرد بإسرائيل في صحيفة روسية قرأناه بالعربية في موقع \"إيلاف\"،وفي المرة الأخيرة قرأنا تقريراً عن الموضوع نفسه من موقع (bbc). لكن والحق يقال ليس شرطاً إن طرح مثل هكذا الموضوع كله مدفوع الثمن، وعن قصد، وربما خلفية طرح الموضوع جزافية،أو من موقع اللا مبالاة.وقد لا يهم من يثير الموضوع أي تداعياته وانعكاساته على الكرد الذين تعذبوا كثيراً من حالة الاغتراب والاضطهادية،وحالة التشكيك بهم في كل مواقعهم وعلاقاتهم مع الآخرين .<br />ذنب الصحافة والإعلام العربي يكمن من إنها ومجرد طرح مثل هكذا موضوع تتلهف لتصطاد الموضوع وتتعامل معه بمنطق اللا مسؤولية مع إنها تعرف مدى تأثيره على ذهنية المتلقي وعلى العلاقة المجتمعية بين العرب والكرد.<br />في الحقيقة إن الصحافة الغربية هي سباقة في إثارة علاقة \"الكرد ب<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 94
subject = "عشرينات كمان وكمان"
author = "مش فارقه"
posted = "2006-10-15"
text = "اثبت لي عشرينات انه سيت للفتنه .. انا في الاول قولت ان الموظفين مش بيقروا التعليقات لكن لما انتقدت عشرينات التعليق بتاعي اتشال ... فالحين بس تسيبوا الناس تشتم في بعض وتبوظ سمعة المنقبات سوري في اللفظ جتكوا خيبه ...<br />للأسف زي ما قال سعد باشا ( مفيش فايده )<br />خليكوا كده اعملوا فتنه بين الناس واتفرجوا وهما بيولعوا في بعض<br />ان شاء الله هعملكم هاك علي السيت وهوقعه ويا انا يا انتم يا عشرينات يا فشله"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 95
subject = "دفاع الاغبياء والحمقي"
author = "حمدي"
posted = "2006-10-15"
text = "بعض الاخوه الذين يدافعون عن النقاب في التعليقات ناس محترمين لا تملك الا ان تحترمهم حتي لو اختلفت معهم .. وعلي سبيل المثال وليس الحصر الاخ مسلم والاخ عبدالله مفتاح والاخت روضه<br />ولكن للاسف هناك البعض الذي يدخل شاهرا لسانه بالسباب والشتائم واحيانا بالتكفير ويحاول ان يشكك في دين كل من خالفه الراي واصفا اياه بالعلمانيه وهو لايعرف شيء عن العلمانيه ... ثم تارة يصفهم بالجهل ونقص الدين ... وكاننا لن نكون مسلمين ومؤمنين حتي يمنحنا هو وشيوخه صكوك الايمان<br />والبعض يخرح علينا عقده النفسيه متصورا اننا كلنا معقدين مثله واننا ذئاب بشريه لن يعصمها من الخطا الا نقاب النساء والا انتشر الفجور وذهبت العقول لرؤيه غير المنقبات<br />** والحقيقه انها لو كانت مشكلة بعض الافراد لكان الامر هينا .. ولكنها مشكلة تيار ديني لا اريد ان اسميه بالاسم حتي لااثير حساسيات لدي البعض..يتصور ان يحتكر الحق في النطق باسم الاسلام .. وان كل من ليس علي منهجهم فانه مسلم ناقص الايمان .. هذا ان اعتبروه مسلما في الاساس<br />وكان الاسلام اصبح حقا حصريا لهم مثل مباريات كرة القدم علي القنوات المشفره .. فلكي يكون اسلامك صحيحا لابد ان يمنحوك هذه الموافقه والاعتماد والا فقد خسرت خسرانا مبينا .. ولا عجب ان احدي القنوات الدينيه التابعه لهم اتخذت شعارها ... قناة...طريقك الي الجنه .. فحذاري ان تسللك طريقا اخر .. ورغم ان مالك هذه القناه هو نفسه مالك قناة الخليجيه التي اقل ماتوصف به انها قناه فاضحه ... وكان الرجل ارادنا ان لانحتار كثيرا ... فطريق الجنه عنده وكذلك طريق النار.. وعليك ان تكون فطنا في الاختيار<br />ولا عجب ان تصدر فتوي اهدار دم الدكتوره سعاد صالح عن هذا التيار الديني لانه ببساطه قد جعل كل من يخالفه في خانة الضال او المبتدع او ا<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 96
subject = "بقية التعليق السابق"
author = "حمدي"
posted = "2006-10-15"
text = "لانه ببساطه قد جعل كل من يخالفه في خانة الضال او المبتدع او الفاسق او الكافر<br />ولكن العجيب والمضحك انهم احيانا يتكلمون عن حرية الانسان والحريات العامه وعن الديمقراطيه وعن الفساد والطغيان في البلاد<br />وهو ياصلون في تشريعاتهم لحكم الطاغيه ويرونه مقبولاا اذا ما اقتضت الظروف ذلك .. وينظرون للديمقراطيه علي انها بدعة غربي لايجوز اتباعها والا اصبحنا مبتدعين وتركنا نهج السلف الصالح من وجهة نظرهم .. وهم يعرفون والكل يعرف ان اول مايفعلوه في البلاد التي يحكموها هو الانقضاض علي الديمقراطيه والاسئثار بالسلطه ومنع كل راي اومنهج يخالف فكرهم ومنهجهم<br />ورغم اني دافعت في البدايه عن حق المنقبات في ارتداء مايرونه زيا شرعيا .. الا انني لا استطيع ان اتحمل التعالي والغلووالعدائيه التي يتحدث به البعض متصورا ان الجهبذ العلامه والحبر الفهامه وشيخ الاسلام الذي لا يرد له كلام<br />قليل من التواضع والرفق في كلامكم يااخوانا والا الرد سيكون بالمثل<br />... يبدو ان معاذ حسدني فقد خرجت عن هدوئي<br />ربنا يسامحك يا معاذ"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

