subject = "يا رجل بلا عقل-مفيش مشكله اصلا"
author = "الباشمهندس محمد"
posted = "2006-10-15"
text = "اولا موضوع الامان فى حاجه اسمها بطاقه وكارنيه المدينه للتاكد - وكده تبقى المشكله اللى بيتحججوابيها مش موجوده اصلا .<br />اما بقى موضوع النقاب دا موضوع كبير وعاوز كلام كتير والنقاب حلال رغم انف المنافقين والكافرين .<br />وياريت اللى معندوش معلومات كفايه يتجنن ويسيب مواقع الاغانى شويه ويدخل على اى موقع اسلامى يقرا موضوع عن النقاب اويسمع له خطبه لاى شيخ يعجبه .<br />اللهم اعزنا بالاسلام وازلهم بالاسلام"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

