subject = "شعب مصر شعب عظيم"
author = "خالد الدايل"
posted = "2006-10-15"
text = "السلام عليكم<br />النقاب اختلف فيه العلماء والخلاف رحمهلكن اجمعو على ان المراءه اذا كانت جميله لحد القتنه فيجب عليها التنقب هذا اولا اما ثانيا فنحن فى السعوديه لا نعانى من لبس الرجال النقاب والدخول على النساء لان الدخول لاى مكان مثل قصور الافراح فبعد الخول بتخلع النقاب لانه لايوج بالمكان سوى نساء وايضا بالجامعات والمدارس النقاب فى الاماكن التى تكون مختلطه بالرجال والنساء مثل الاسواق<br />وتقبل الله منا ومنكم صالح الاعمال"
