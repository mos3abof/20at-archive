order = 130
subject = "دلائل فرض النقاب من القرأن والسنة"
author = "طالب علم سلفي"
posted = "2006-11-16"
text = "الرد على كل من ينكر فرض النقاب ولا يعترف به<br />ملحوظه هامة<br />المقصود بالحجاب هو الحجاب الكامل بالوجه<br />المعروف فى زماننا هذا بتغطية الوجه هو النقاب وهناك بعض الناس من تفرق بين النقاب والحجاب أنا لا أرى فيه أختلاف إلا مكان نقب العين أى فتحت العين ولذلك سمي نقاب ولا نخص أو نفرض على المرأة ان تلبس النقاب لأنه ليس فرض أو سنة لأنه يوجد فيه فتحتين للعين وهذا خطأ أم تغطية الوجه فهو فرض من الله بأى شئ ولم يخص النقاب بعينه ولكن يستدل بالخمار على وجهها للتغطية الكاملة للوجة أو اى شئ والسؤال الذى يدور فى عقلك الأن كيف ترا أقول لك يوجود فى النقاب الشرعى المعروف الذي لم تمتد إلية اليد الخبيثة وأسمه نقاب لكي تعرفه فقط يوجد فيه قطعة صغيرة شفافة للرأية ترا منها المرأة ولم ترها أم بالنسبة لمن يفرق بين النقاب والحجاب أليس مقصود الحجاب هو حجب شئ عن شئ أى لا يرا شئ من خلف الحجاب فمقصود الحجاب هو الحجاب الكامل المغطى للوجه وأنما عرف بالنقاب لنا لأنه تم له عملية تغير من الأعداء بنقب العين حتى يتجمع جمالها فى عينها وتفتن أكثر فهذا غير شرعى أما الشرعى فهو الحجاب الذي يغطى الوجه كله من غير فتحتين فى الحجاب ولكننا ندافع عنه بأسمه المعروف لدي كثير من الناس النقاب ولكننا نقول للمنقبة منقبة العين اتقى الله ولا تظهرى عينك ولكم الدليل<br />هل النقاب فريضه ام سنه ؟؟؟؟<br />هناك ادله من القرأن والسنة على فرضه عامة وفى عصر الفتن خاصة<br />]\"اعلم أيها المسلم أن احتجاب المرأة عن الرجال الأجانب وتغطية وجهها أمر واجب دلَّ على وجوبه كتاب ربك تعالى وسنة نبيك محمد صلى الله عليه وسلم ، والاعتبار الصحيح والقياس المطرد .<br />أولاً : أدلة القران .<br />الدليل الأول /<br />قال الله تعالى : \" وَقُلْ لِلْمُؤْمِنَاتِ يَغْض<br />اقرأ بقية التعليق .."
