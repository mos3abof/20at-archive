[[comments]]
order = 0
subject = "ايامهم الاخيره"
author = "ايمن امام"
posted = "2006-10-12"
text = "اعتقد ان النظام يشعر بتغلغل التيار الدينى فى كل نواحى الحياه فى مصر لذلك فأنه يتخبط وقد فقد وعيه واصبح يتصرف تصرفات لاتمت للانظمه بأى صله - الغريب انه تزامن هذا مع تونس ولكن البجاحه هناك على واسع وتزامن ذلك مع تصريحات سترو وتزامن ذلك مع ما قاله شيراك وتزامن ذلك مع ماقاله بنديكت فهل يريدون ان يشغلونا بشىء اخر غير ينديكت ام يريدون الهتئنا عما يحدث فى فلسطين هذه الايام من استعداد عملاء اسرائيل للانقضاض على الحكومه المنتخبه من الشعب ام يريدون الهائنا عن تقسيم العراق ام يريدون الهائنا عن مشروع تقسيم السودان اعتقد ان الاحنده واحده ولكل دور فيها - في شباب مصر المسلم تحصن بدينك فأن الازمه قاربت ان تنفرج ان شأء الله وسيأتى يوما اعتقد انه قد اصبح قريبا سيأتى يوما يشفى صدور المؤمنين ولاتنسوا ما حدث فى غزوه حنين وغزوه احد - انه تمحيص لما فى القلوب - احسبتم ان تقولوا امنا ولم تتعرضوا للفتن والابنلاء - انه اختبار لمدى اسلامكم فصابروا وجاهدوا وانتم الاعلون ان شاء الله - ايمن امام"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 1
subject = "لا للمنتقبات .. فهل لا أيضا لعاريات الصدور والخصور"
author = "غير منقب"
posted = "2006-10-12"
text = "سيادة رئيس الجامعة ، لماذا يزعجك أن تسكن المنتقبات في المدينة الجامعية ؟ وهل يزعجك بنفس القدر الفتيات عاريات الصدور والخصور؟ سيدي أنا رجل مسلم ليس لي أخت أو أم أو رزجه منتقبه، وعندما حاولت أختى منذ سنوات أن ترتدي النقاب كنت غير مرتاح لذلك في تلك الفترة من عمرها-حيث كانت تمر بفترة المراهقة- وبالفعل لم ترتديه ، حتى بعد مرور 15 سنه وما زالت ترتدي الايشارب كعادت معظم فتياتنا، ولكن أن يصل الأمر إلى فرض إستبعاد لشريحة من بناتنا فقط لاختيارهن إرتداء زي معين ، فهذا أمر ليس سيئا فحسب لكنه أيضا خطير، لن اقول أن خطورته من منطلق ديني فهو أمر معروف، لكنه خطير لما يتشدق به رجال الجكومه ليل نهار من زمن الحريات والديمقراطية، فهل الحريات فقط لمن أخترن التعري ، أم أن الحريه للجميع، سيدي العزيز أعرف أن الأمر قد يكون مفروضا عليك، لكنك ألا تري ويرى معك الأخرون - اللهم إجعل كلامنا خفيف عليهم- أن الشارع لم يعد يتحمل المزيد من الضغط، فقد بلغ الضيق بالناس ايما مبلغ، ولا أري أن ذلك في صالح اي حكومه أو مسئول تكريس كل هذا الاستفزاز لرجل الشارع العادي الذي سيتعاطف حتما مع هؤلاء الفتيات المستبعدات"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 2
subject = "هبوا لنصرة الاسلام"
author = "سمير المصرى"
posted = "2006-10-13"
text = "يا استاذى الفاضل يا من تطمع فى منصب او فى رشوه من افندينا الكبير واللى حيبقى كبير قوى قوى ..بعد ما ينهب منصب رئيس مصر زى ما نهب هو وابوة واللى جابوة البلد ..وزى ما باعوها لليهود واجاروها للامريكان ..علشان ستنا الغوله متزعلش ام اويء ...كل ده بيحصل لسبب بصيط جدا ان مصر اساسا لا يوجد بها نا او شعب فاهى دوله فضيا لا حس ولا خبر عن نسها او طلبها او جاميعتها ..كله نائم فى البلاص ..شويه بهائم عيشين فى زريبه اكيد الحمار الكبير اللى فيهم هو اللى سوف يفوز غصب عن جميع بهائم الزريبه ..واخيرا قالو لفراعون ابن الكلب ايش فرعنك وفرعن ابوك واللى جابوك قال ملقتش واحد راجل فى الدوله يقول اف او اح او اوووو...الشعب اهو نيكوه"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

