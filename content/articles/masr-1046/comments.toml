text = "\"شمي ريحتك أنتي اولاً بعدين علقي على الناس\" بذمتك انت صايم!!!!!!!!!<br />هل بتعتبر نفسك مؤمن أصلا. لو كنت بتعتبر نفسك مؤمن لازم تعرف ان سلوكك دا ابعد ما يكون عن كتاب الله و سنة رسوله صلي الله عليه و سلم اللي راح زار جاره المريض في بيته بعد ما كان بيرمي فضلاته امام بيت الرسول عليه افضل الصلاة و السلام"
