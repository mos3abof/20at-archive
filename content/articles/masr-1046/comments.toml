subject = "الي الاخ ياسر ابو عمار"
author = "حمدي"
posted = "2006-10-13"
text = "يااخ ياسر .. حدود حريتك تنتهي عندما تتعدي الي المساس بحقوق اناس اخرين<br />بمعني انه المهم الحفاظ علي الامن داخل المدن الجامعيه للبنات ومعرفة اللي داخل واللي طالع وده شيئ صعب جدا مع وجود المنقبات... بغض النظر عن نوايا من اصدر القرار<br />اما حكاية انهم بيتساهلوا مع غير الملتزمين فذلك صحيح للاسف .. لكن الخطالا يبرر خطا من نوع اخر .. والحفاظ علي امن اخواتنا وبناتنا شيء مهم جدا<br />وسيبك من توني بلير انت رايح بعيد ليه اذا كان ممنوع علي المراه التي تضع غطاء للراس في تونس من الالتحاق باي عمل حكومي<br />لما نحل مشاكلنا مع حكامنا نبقي نشوف بلير"
