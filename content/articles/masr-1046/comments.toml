[[comments]]
order = 122
subject = "الله اكبر"
author = "عمرو صالح"
posted = "2006-10-27"
text = "بسم الله الرحمن الرحيم<br />الله اكبر ياللفضيحه وكنا نستغيث بولاه امرنا للدفاع عن الرسول وجدنا العكس حرب من ولاه الامر على الرسو وسننه فالملتزمين محاربين ممن شهدوا بوحدانيه الله اعداء الاسلام نجحوا فى الوصل الى ماعملوا عليه بتجنيد ولاه الامر جاسوسا خاصا لهم ولن اتكلم على واجوب او سنيه الحجاب مع ان ادله وجوبه موجوده بل سأتكلم ماالافضل لامه تعانى من المرض الذى فتن به شباب الامه به لقد فتنوا باشد فتنه بعد الرسول عليهم وهى النساء فكيف لشبابنا الفلاح والنجاح وسط هذه البوطقه المليئه بالشهوات ولله در القائل\"القاه فى اليم مكتوفا وقال له ايك اياك ان تبتل بالماء\"ايه الخت الكريمه اثبتى على حجابك ولو وصل الامر الى ترك جامعتك او التعليم كله فلا تخسر اخرتك من اجل دنياك ايه الاخت انت اكبر من هذا واعز فى الاسلام من هذا والله اكبر والله موجود وسألناه الدفاع"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

