[[comments]]
order = 30
subject = "النقاب مش فرض و بدعة"
author = "فاطمة"
posted = "2006-10-14"
text = "يا أخ علي أنا مسمعتش الكلام دا علي القهاوي و اقسم بالله العلي العظيم ان السيدة المنقبة دي فعلا بتقعد بالملابس الداخلية و كل الناس بتشوفها و ان ال 3 بنات دول اعرفهم شخصيا و بيروحوا شقق مفروشة ... و عارف ايه كمان ... اول يوم في رمضان كنت بصلي التراويح في المسجد و كنت في أول الصف و كان في كولدير مغرق الارض مية متلجة و جات واحدة منقبة تقف جنبي في اول الصف لقت المكان مليان مية راحت وقفت في اخر الصف و زاحت الناس كلها لحد ما انا و اللي جنبي وقفنا في المية المتلجة بدالها .. و قصة كمان مسلية اكتر جارتي المنقبة و جوزها اللي دقنه مترين برضه استولوا علي جراج العمارة و بنوه شقة و بيأجروها لحسابهم كمان!!!! عايز تسمع حاجات تاني و لا كفاية كدة؟؟ عموما مرة تانية انا بقول ان مش كل المنقبات كدة بس كمان النقاب مش هو الحل و بالنسبة لرأي ان النقاب بدعة دا مش رأيي دا رأي شيوخ و حتي لو مش رأي شيوخ من حقي أقوله من غير ماحد يتهمني بالجهل من غير ما يعرف انا قريت ايه و جبت الرأي دا ازاي<br />يقول الله تعالى : \" ياأيها الذين آمنوا لايسخر قوم من قوم عسى أن يكونوا خيراً منهم ولانساءٌ من نساءٍ عسى أن يكن خيراً منهن\"<br />و بالنسبة للفتيات اللي لبسوا النقاب تضامنا مع المنقبات عايزة اسألهم هل في واحدة منقبة كانت حتشيل النقاب تضامنا مع واحدة محجبةأو غير محجبة لو جات حكومة فرضت النقاب جبرا في مصر مثلا؟؟!!!!!<br />النقاب بدعة النقاب بدعة النقاب بدعة النقاب بدعة النقاب بدعة النقاب بدعة النقاب بدعة النقاب بدعة النقاب بدعة النقاب بدعة النقاب بدعة النقاب بدعة"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 31
subject = "التعليق"
author = "مرسى"
posted = "2006-10-14"
text = "اولا لم اسمع ان النقاب (وليس الحجاب) فريضه على المراه فى الاسلام.<br />انما هو حب المزايده فى كل شىء<br />وهل المنقبات وصلن الى قمه التدين فى هذه الحاله ، بل على العكس تجد بعضهم(عديد منهم) لا يراعون الاداب والسلوكيات العامه سواء فى المواصلات والاسواق وغيره<br />وكان النقاب يكفل لهم حريه فعل ما يريدون<br />بالله عليكم انظروا الى الصوره الاولى فى موضوعكم هذا ، الى تلك المفترض انها فتاه ممسكه بالورقه ، هل ترون فى هذا ((العفريت))، نعم العفريت ، الصوره المثاليه للفتاه المسلمه؟؟؟؟؟؟؟؟<br />ثانيا فى فرنسا قامت الحكومه بمنع الرموز الدينيه (((عموما))) وليس الحجاب فقط ولم يعترض الا المسلمون ، وياليته اعتراض مهذب حضارى ، بل على العكس وكانهم يؤكدون ما يوصم بهم من تشدد وارهاب."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 32
subject = "الحل ابسط مما تتصوروا"
author = "طوبى للحمقى فهم سعداء"
posted = "2006-10-14"
text = "يا جماعة الحل ابسط مما تتصوروا، اذا كان الغرض من منع المنقبات من دخول المدينة الجامعية لان وجههم غير مكشوف للقائمين على امن المدينة<br />ليه ما يلبسوهمش نقاب شفاف؟؟؟؟<br />ده طبعا هيكون اجبارى<br />اما الترتر و الكماليات التانية هيكون حاجة اختيارية للطالبة<br />دعما لمبدا احترام الحريات الشخصية الذى تحرص عليه القيادة الحكيمة و جميع مؤسسات الدولة و عم دهب و رئاسة مدينة البط،<br />حل اخر!!!<br />الطالبة المنتقبة تحط صورة فوتوغرافية ليها و هيا لابسة النقاب فى كارنيه المدينة<br />و بكده يتاكد رجل الامن حاد الذكاء من شخصيتها اول ما يشوف الصورة<br />مصر بحاجة الى مثل هذه الافكار الغير تقليدية لحل مشاكل الامة<br />و اخيرا<br />طوبى للحمقى فهم سعداء<br />و من كل قلبى متضامن مع حق اى فتاة مسلمة فى ارتداء النقاب فى اى مكان"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 33
subject = "مستعجب"
author = "عبد الله"
posted = "2006-10-14"
text = "يوما بعد يوم يزداد الجهل و التخلف و الرجعية في مصر. انا مع الاخت فاطمة و فعلا لم اجد انسانة منقبه او واحد مربيلي دقنه و مقصر الجلبيه بتاعته الا و اجد فيه كل العبر. ياخذون من الدين مظهر فقط. و لكنهم مملوئين بكل الشر من الداخل. تجد فيهم كل قلة زوق و عنجهية و تمثيل و ادعاء بالتقوي"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 34
subject = "الى الاخت فاطمه"
author = "مطلوب فوري"
posted = "2006-10-14"
text = "اولا احب ان ابدأ معاكي باسمك فانتي اسمك على بنت النبي صلى الله عليه وسلم وانا مرة سمعتالشيخ الشعراوي في التفسير بيقول ان الاب عندما يسمي اولاده بيكون هناك رغبة ان يقتدي الابن بهذا الاسم يعني والدك سماك فاطمه علشان خاطر تبقي مثل فاطمه بنت النبي هذا اولا فاحنا عايزين حضرتك تكوني بارة بوالدك الذي سماك فاطمه وتجيبي كتب عن فاطمه بنت النبي وتبقي زيها.<br />اما الست المنقبة واللي جوزها دقنه طولها مترين دي مش القضية<br />يعني مثلا لو ضبطوا واحد حرامي لابس بدلة ضابط شرطة يبقى كل ضباط الشرطة حرامية لا طبعا فالنقاب حق وفي الشرع وامر الله سبحانه وتعالى به امهات المؤمنين وكل امرأة ممكن ان تقتضي بامهات المؤمنين ولكن في الظروف الوسخة اللي احنا عايشينها فيها دي بلاش نقاب وزي ما انا قلت فوق هناك 12 حديث في البخاري يوصي بكشف الوجه والكفين واللي مصره على النقاب يبقى وقرن في بيوتكن واذا خرجت من البيت تخرج بمحرم"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 35
subject = "الى الاخ علي"
author = "مطلوب فوري"
posted = "2006-10-14"
text = "صباح الخير يا علوه البؤئين اللي انا قلتهم لفاطمه فوق عايز اقولهملك فانت اسمك علي ابوك سماك علي على اسم سيدنا علي ابن عم الرسول وزوج فاطمه الزهراء ورابع الخلفاء الراشدين يعني كان عايزك تبقى زي سيدنا علي فانا عايزك تجيب كتاب عن سيدنا علي بن ابي طالب وان شاء الله تحاول تبقى زيه.<br />اما كون النقاب تخلف وغباء والله ايام ما كانت النسوان بتتنقب كانت الامة منتصره وكانت بتحكم من اسبانيا الى الهند ولما النسوان خلعت النقاب الامه الاسلامية اتنيلت بنيبه واتبهدلت وشوية يهود زباله مغلبينها واخد بالك يا عم علي فانا عايزك تبقى زي سيدنا علي ابن ابي طالب خليفة المسلمين ما تبقاش زي ناس تانيه (مش حذكرهم علشان احنا في رمضان)"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 36
subject = "منال"
author = "منال"
posted = "2006-10-14"
text = "اختي فاطمه. كلامك صحيح. كل واحده لابسه نقاب تدخل المترو تعملنا فيها واعظه و تبقي ريحتها تنفر منها الناس. و اكثر ناس عندهم انانيه واضحة حتي في حجز كراسي المترو لما واحده تقوم منهم تقعد مكانها واحدة منقبة. كأنهم جنس اخر غير المحجبات.<br />النقاب بدعة لم يأمرنا الدين سوي بالحجاب. اما البمالغة و اخذ الدين بالرياء فقط خمار و جلاليب قصيرة و ذقن طويله و خلاص"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 37
subject = "انتم والدنمارك"
author = "فاطمة , علي , عبد الله ,زكريا ومن هم على شاكلتهم ..اقول لكم ...حسبي الله ونعم الوكيل فيكم.."
posted = "2006-10-14"
text = "منال : المنقبات يجلسن على الكراسي في المترو لكي لا يحتكين بالرجال<br />فهمتي والا ..لا<br />وبتقولي ريحتهابتنفر ...شمي ريحتك أنتي اولاً بعدين علقي على الناس...عيب ..عيب<br />كل ده حرب على النقاب ...والا غيرة<br />ما اجمل الفتاه المنقبة الساترة لجسممها<br />وما أعفن الفتاة المتبرجة العارضة جسمها برخيص"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

