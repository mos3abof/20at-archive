[[comments]]
order = 131
subject = "فاطمة الحانو"
author = "رجل يعرف حقيقتك"
posted = "2006-11-17"
text = "ويارت البنت التى تقول أصل من الممكن الراجل يلبس النقاب ويدخل على البنات هيعمل أية يا حلوة غير الفرجة عليكم أيده هتطول صوتى خلع النقاب وشوفتى راجل صوتى وأجرى ولا ده دعوه للرجالة أصحاب الشهوة أنهم يعمله كده عشان يركبه حضرتك حجة غير مقبولة من فتاة متخلفة بجد قل أى راجل يلبس النقاب ويدخل عى البنات ي هبلة أخره النظر وأنتى لو محترمة أتنقبي مش يعرف يشوف حاجة وكمان لو فى شباب معاكم مش هيقدر يعمل حاجة ولو لوحدكم بنات فى بعض ومعاكم راجل منقب ومفكرينى بنت من المفروض يخلع النقاب وتشوفى انته بنات وبعدين لو مش يقلع من المفروض يتكلم والصوت بيان صح ولا مش صح ولا قصدك أية أنكار وحجج فارغة وخلاص منكم لله يا بقر"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

[[comments]]
order = 132
subject = "المتخلفة فاطمة باقي الرسالة يا حانو"
author = "واحد عارف حقيقتك"
posted = "2006-11-17"
text = "أما فاطمة<br />بتقولى النقاب مش فرض وبدعه<br />ههههههههههههههههههههههههههههه<br />ماشي نخدك على قد عقلك الذى لم يتجاوز العشر شهور<br />بالله عليكي يا علمة الدين يا وقحة<br />ألم تتعطرى فى طريقك<br />وقال رسول الله أيما امرأة استعطرت ثم خرجت فمرت على قوم ليجدوا ريحها فهي زانية،<br />ألم تفعلى النمص والوشم<br />ألم تسمعى الغناء<br />كل ذلك ليس بدعة لا بل حرام وكفر بالله ولعن من الله ورسوله من أنتى يا متبرجة لكي تتحدثى عن النقاب وكمان شكلك مش محترمة فى وحد%C"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"
