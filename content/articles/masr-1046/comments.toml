[[comments]]
order = 107
subject = "ثقافة قطيع الاغنام يا معاذ"
author = "عبدالله مفتاح"
posted = "2006-10-16"
text = "مرة اخرى يصركثير من الشعب المصري على انه من اكثر شعوب الارض ابداعا في الاتباع الاعمى الذي يلغي العقل؟ وهو ما يسمى بثقافة قطيع الاغنام<br />كتب معاذ فقال( النقاب بكل بساطة يعتبر الرجل ذئب والمرأة قطعة لحم . وكأننا نعيش في غابة . النقاب يلغى كل نوع من الانسانية والتحضر ويعتبر البشر حيوانات لابد من تكميم افواهها كي لا تعض . انا بمجرد رؤية منقبة اشعر بالاهانة . اهانتها لي ولنفسها كبشر متحضر قادر علي ضبط نفسه وغرائزه الحيوانية. \"\"\"<br />هذا الكلام لم يكن في ثقافتنا العربية مطلقا وبعد ان تم حشره في عقول بعض ضعاف الايمان وجدنا الكثرين يرددونه دون ان يمنحوا لعقولهم الفرصه للتفكير بالرغم من انهم كثيرا ما يتغنون بانهم الاكثر اعمالا لعقولهم<br />علمنا النبي صلى الله عليه وسلم ان نتجنب الشبهات والقاعده الفقهيه تقول درء المفاسد مقدم على جلب المصالح وهكذا نجد الحقائق قلبت راسا على عقب<br />فهل اعتبر النبي صلى الله عليه وسلم زوجاته معاذ الله ...... كما قال معاذ<br />وهل كان الصحابه ...... كما قال معاذ؟<br />هل رايتم ما الذي يحدث عندما نردد كلاما لا نفهم معناه؟<br />اي اهانه هذه التي توجه لزوجات النبي وصحابته منك يا معاذ؟<br />اخي معاذ عليك بالحذر<br />فرب كلمة يلقيها قائلها لا يلقي لها بالا تهوي به في النار سبعين خريفا"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

