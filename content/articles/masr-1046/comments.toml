subject = "الى الاخ حمدى"
author = "ياسر ابو عمار"
posted = "2006-10-14"
text = "يا عم حمدى انا مش شايف انه النقاب فيه اى مساس بحريتك او حريتى الشخصية ،اطلاقا يا عمنا ،الحرية الشخصية تتجسد فى ان كل واحد يلبس ما يراه طالما لا يؤذى الاخرين ،وهى دى حدود الحرية الشخصية التى اراها .<br />وبعدين فين الصعوبة يا عمى فى التعرف على المنتقبات عن طريق سيدات تفتش عليهن ،وهما على فكرة موجودات بالفعل ،وفيه حاجة اهم انه لا يصح اطلاقا ان تعاقب الفتيات بعدم دخول المدينة الجامعية بسبب ارتداء النقاب ،وانا عارف مدى ازمة عدم الاقامة بالمدينة بالنسبة للطلاب -لانى مجرب الاستبعاد-فما بالك بالفتيات ؟والله العظيم حرام ،"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128213922/http://masr.20at.com:80/article.php?sid=1046"

