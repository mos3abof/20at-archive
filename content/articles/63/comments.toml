[[comments]]
order = 0
subject = "نستم أهم شيء"
text = "نسيت أهم شيء وهو أن مارادونا الآن يصارع الموت وقلبه مش مستحمل جسمه التخين بس شكرا على بعض المعلومات الجديدة ونرجو المزيد من الاهتمام بالرياضة"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529053516/http://www.20at.com:80/article.php?sid=153"

[[comments]]
order = 1
subject = "بيكام"
text = "الآن في هذه الأوقات بيكام سيد الضربات الحرة"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529053516/http://www.20at.com:80/article.php?sid=153"

[[comments]]
order = 2
subject = "انتو ببيعو ايه ؟"
text = "هو اه ده إللى بكام ؟؟؟"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529053516/http://www.20at.com:80/article.php?sid=153"

[[comments]]
order = 3
subject = "اليمن-الحديدة"
text = "مهما كان من اكر مارادونافما زال كل الرياضيين يعشقون فنه الكروي ويتلذذون في رؤية لعب مارادونا"
archived = "2004-06-05"
capture_url = "https://web.archive.org/web/20040605142831/http://www.20at.com:80/article.php?sid=153"

[[comments]]
order = 4
subject = "اليمن / الوسام"
text = "من منا لا يعرف اسطورة القرن مارادونا فهو معجزة الملاعب كما ان هنالك لاعبين لكن غير مستوى مارادونا أمثال تييري هنري وزيدان ورونالدوا البرتغالي"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926034433/http://www.20at.com:80/article.php?sid=153"

[[comments]]
order = 5
subject = "منيا القمح-الشرقية-مصر"
text = "هعيش طول العمرلم ارى و لن ارى اى لاعب مثل حبيبى مارادونا روح قلبى و عمرى ادعوا اللة ان يشفية"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926034433/http://www.20at.com:80/article.php?sid=153"

[[comments]]
order = 6
subject = "(محمد صلاح) -منيا القمح-الشرقية-مصر"
text = "مارادونا حلم كل شاب فىان يصبح واحد من عشرة من مهارة الاعب الذى لم ياتى مثلة مرة اخرى ادعوا اللة ان يشفى حبيب قلبى مارادونا"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926034433/http://www.20at.com:80/article.php?sid=153"

[[comments]]
order = 7
subject = "(محمد سامى)-منيا القمح-الشرقية-مصر"
text = "محمد سامى رونالدو الكرة المصرية<br />ريال مدريد طلبت تتعاقد معة بدلا من فيجوولكنة رفض بشدة علشان نادية القديم العجيزى"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926034433/http://www.20at.com:80/article.php?sid=153"
