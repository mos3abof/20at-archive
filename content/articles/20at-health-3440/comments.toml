author = "عالم البورصة"
posted = "2007-04-21"
text = "بسم الله الرحمن الرحيم<br />نحن في عالم البورصة وبحكم قربنا من صناع القرار, وكبار المستثمرين قمنا بوضع اشتراك رمزي لمن يريد الدخول معنا في عالم البورصة لاننا نعلم ان السوق السعودي هو (سوق المعلومة) فمن يملكها يستيع ان يربح باذن الله اشترككم معنا يضمن<br />ربحكم باذن الله<br />www.sharesworld.net"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105211633/http://20at.com/20at/health/3440.html"

