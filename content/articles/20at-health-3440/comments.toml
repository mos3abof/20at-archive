author = "حمدي شديد"
posted = "2007-03-17"
text = "الطمع يقل ما جمع هكذا تعلمنا و معظم الداخلين في تجاره البورصه يتجاهلون او يتناسون ذللك فعندما تسمع كلمه بورصه لا يمكن ان يأتي في خيالك سوي المكاسب الرهيبه و القصور الشاهقه والاحلام الخياليه ولكن سريعا ما تصطدم بالواقع عند دخولك لهذا العالم فتجد ان الخساره بخراب الديار و ارجو ان يعلم الانسان المجال الذي سوف يدخله لان سوء الخبرة ينقلب علي صاحبه في النهايه و اللهم ارزقنا الحلال و اطعمنا الحلال"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105211633/http://20at.com/20at/health/3440.html"

