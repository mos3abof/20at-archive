subject = "متواضع"
text = "4 - نظرتك لنفسك في المرآة......هذا السؤال الاختيار الأول له المفترض أنه الأمثل يربي في الشخص النرجسية، وكذلك وكأنه ليس على الكون اجمل وأرق منه وهذا أمر مرفوض لأنه كل إنسان يرى ذلك مصاب بالغرور، وقد قالها أبليس من قبل، \"أنا خير منه\"..."
