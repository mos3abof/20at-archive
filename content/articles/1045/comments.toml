subject = "فعلا شىء يحرق الدم"
author = "بلال عبده"
posted = "2006-08-02"
text = "أنا بصراحة مع الأستاذة نهى السيد وبحييها على كلامها , ومع الأستاذ محمد عامر واللى قاله فعلا هو ده اللى بيحصل وبصراحة خاصة فى أفلام عادل إمام .. أنا الحقيقة كنت منتظر الفيلم من بدرى بس للأسف نزل وماكنتش متخيل ان الناس اللى كنت بحترمهم وبقدرهم جدا يعملوا مشاهد زى دى وعلى رأسهم نور الشريف , بجد نظرتى اتغيرت فيه جدا بعد الفيلم وتاكدت ان هارون الرشيد وعمرو بن العاص والأعمال الجميلة اللى قدمها دى كلها تمثيل فى تمثيل , متأسف على الغطالة بس الحق يتقال بصراحة نجومنا كل مابيكبروا بيخرفوا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131452/http://www.20at.com/article2.php?sid=975"

