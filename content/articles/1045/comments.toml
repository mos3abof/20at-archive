[[comments]]
order = 7
subject = "أعظم فيلم مصري"
author = "أتعجب بالفعل على من يرسلوا التعليقات تارة بأن عادل امام مكروة و أخرى بأن الفنانين لا يضربون المثل الصالح في الحياة و ليوعظوا نفسهم أولا ، و أخيرا بالاعتراض على تناول الشذوذ الجنسي في مصر ، و أيضا قول هية دي مصر؟ مش معقول ؟"
posted = "2006-07-03"
text = "أتعجب فعلا ، فنحن يبدوا اننا مجتمع منافق و متعصب في آن واحد ... فاذا كنتم تكرهون عادل امام الى هذا الحد ، فمن الذي يدفع الملايين التى تدرها أفلامه ، مش انتوا برضه؟ و اذا كنت حتقرون الفنانين لهذه الدرجة فمن الذي يدفع الملايين في شباك التذاكر ؟ لابد أن الفنانين يجمعوا بعض و يظلوا يدخلون السينما كل يوم لانفاق على شباك التذاكر !<br />أما عن مشاكل مصر و تناول الشذوذ الجنسي ، فهل كنتم ترحبون بفيلم سطحي لا يتعمق في أي شئ ؟ ألا يحسب لهذا الفيلم أننا شاهدنا من خلالة هذا العالم الغريب عنا بتفاصيلة ، ولا تقول تفاصيلة المقززة ، فلم يحتوى الفيلم على مشهد جنسي شاذ ، و انما رأينا معه من هو الشاذ بعيدا عن النموذج النمطي المحفوظ ( مثل سكة السلامة) و هو الشاذ الذي يتقصع وما أن تراه حتى تقول هذا شاذ و خلاص ، بل أرانا نمذج نعرفها في المجتمع ، فخالد الصاوي في الفيلم شخص ناجح و يشغل وظيفة مرموقة هذا أولا ، و تصرفاته العادية لا توحي بالشذوذ ، هو فقط لطيف أو مهذب زيادة شوية ، بس ... و رأينا كيف يصطاد ضحيته و كيف تنشأ العلاقة الشاذة و تتحرك درجة درجة ، ثم أخيرا و هو الأهم رأينا بدايته و كيف صار شاذا .. الا يحسب لهذا الفيلم أنه عرفنا بعالم منتشر في كل الدنيا و نحن نغمض أعيننا عنه كالنعام ، ده حتى أفكارهم و تبريرهم لما يفعلون بل و تبريرهم الديني عرض علينا في هذا الفيلم .. أنا أرى أنه اضافة كبيرة للسينما المصرية في هذا الموضوع الذي لم يطرق أبدا .<br />مشاكل مصر ؟ مشاكل ايه ؟ هو لا يتكلم عن المشاكل و الأهم فالمهم، بل يتكلم عن التغيير الداخلي أو النفسي في المجتمع المصري من الرقي الى السوقية ، من النظافة الى الوضاعة ، تاجر المخدرات مساح الجزم صار غنيا و محترما ثم نائبا برلمانيا و صديقا عزيزا للحكومة ، أما الشاب النظيف المثالي رفضته الحكومة فبدلا من أن يصبح ظابطا مشرفاانخرط في صفوف الجماعات الاسلامية ، ثم ظلمته مرة أخرى بتعذيبة ثم اغتصابة و هو أصعب شئ على أي شاب فحولته عمدا الى ارهابي ، أي مساح الجزم صار من أعظم الناس و الشاب لشريف صار ارهابيا يعتقل و يعذب و يموت مقتولا ، أم ابن الباشاالذي تعلم في أوروبافقد صار أضحوكةو صار اسلوب حياته لأوروبي الذي لم يعرف غيره مرفوضا و مستهجناو يمتهن تارة من القواد في البار و تارة من شقيقته و أخرى من ضباط الشرطة الشباب ، و حتى الترزي الحقير طمع فيه، أليس هذه هي مصر ؟ لا أقول مصر بمعنى مشكلات رجل الشارع و لكن أقول مصر بصفة عامة و باتساع ، مصر التى انحدرت على يد ضباط الجيش و حكومات الثورة ثم فهلوية الانفتاح (مثل العمارة) من بلد راقي الى بلد .... لا أستطيع نطقها ، لكن فعلا تظلم أبنائها فتحترم الحقير تاجر المخدرات و تحتقر الرجل الراقي من داخله و تظلم و تفحش في ظلم الشاب الفقير و الفتاة الفقيرة التى تتمرمط من أجل لقمة العيش ، و تظلم أيضا من مات زوجها في العراق فتضطر لزواج رجل عجوز تشمز منه اذا مارس معها الجنس<br />أخيرا ان لم تكن هذه المشاعر قد صادفتكم عند مشاهدة الفيلم ، فلا أعتقد أن تعليقي سيضيف جديد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131452/http://www.20at.com/article2.php?sid=975"

