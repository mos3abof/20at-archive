author = "اعلن اللواء"
posted = "2009-08-10"
text = "اعلن اللواء احمد هانى سكرتير المحافظ هكذا جاء فى بداية المقال<br />اية الحكاية<br />هما بيجيبوا اللواءات دى من اين<br />السيد المحافظ لواء<br />السيد سكرتير المحافظ لواء<br />السيد مدير مكتب المحافظ لواء<br />السيد الوزير لواء والسيد مدير مكتب الوزير لواء<br />وقناة السويس يديرها لواء بحرى<br />ومصر للطيران يديرها لواء طيار<br />وشركات المياة على مستوى الدولة يديرها لواءات<br />انا عايز اعرف اللواءات دى كلها كانت فين وهيعملوا اية للبلد<br />انا مش فاهم حاجة"
archived = "2009-08-12"
capture_url = "https://web.archive.org/web/20090812110719/http://www.20at.com:80/masr/2khbar/12892-2009-08-10-07-26-10.html"
