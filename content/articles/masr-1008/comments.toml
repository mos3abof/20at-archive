text = "هو انت من البداية كنت مصدقه وعود الراجل ده ولاايه ؟ فاتت سنة !!!! دى فاتت 25سنة والحال هو نفس الحال !!! ومش هتتغير حاجه طول ما الشئ ده لسه فى الحكم او من ورثته او من عصابته !! لازم البلد تتطهر الاول من النجاسة اللى فيها وبعدين تسالى بقى عدت سنة او اتنين ... حسبي الله ونعم الوكيل .. على راى ابن بهية .. صورة الراجل ده وشكله وسيرته من المفطرات فى رمضان ..<br />اللهم انى صائم"
