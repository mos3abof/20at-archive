[[comments]]
order = 4
subject = "يعيش يعيش يعيش"
author = "بنت حميدو"
posted = "2006-10-03"
text = "يعيش حسنى مبارك, يعيش حبيب الملايين (يعني بيحب الملايين و الملايين بتحوا, الدولارات طبعا), يعيش الرجل المخلص لعائلته و اولاده و البار بأقاربه, يعيش الرجل الحر الذي يحب الحرية,فلا يحب ان يقيم بمكان واحد و لكن له مئات القصور, يعيش الرجل الذي يسعي في الارض طلبا للرزق, فيتنقل من بلد لاخري بسبب المعونات و السلف, يعيش الرجل الذي اضاع عمره في سبيل شعبه فبقي 25 سنة في الحكم, عايزين ايه تاني يا شعب مصر, المفروض تحمدوا ربنا علي النعمة دي اللي انتوا مش حاسيين بيها, يا سلام علي الرييس و جمال الرييس و حلاوة الرييس, يا ريسنا يا حابيبنا .<br />امضاء : واحدة بتحب الريس"
archived = "2006-12-01"
capture_url = "https://web.archive.org/web/20061201080717/http://masr.20at.com:80/article.php?sid=1008"

[[comments]]
order = 5
subject = "اجازة"
author = "مغترب"
posted = "2006-10-03"
text = "انا شايف ان الريس تعب من قلة الاجازات ومن الافضل له ان يستريح انتوا عارفين ان الشعب المصري ده المفروض كل يوم الصبح يبوس الريس علشان الانجازات الهائلة التي لا تحصي ولا تعد والتي منها علي سبيل المثال لا الحصر<br />** رغد العيش الذي يعيشه المصريين الان وارتفاع مستوي المعيشة واانخفاض الاسعار .<br />** حل لنا مشاكل العبارات والمراكب والمعتمر والحاج الان يذهب الي الاراضي المقدسة وكأنه في رحلة بحرية .<br />** حل لنا مشاكل التنقل في القطارات واصبحت القطارات جميعها مكيفة وكل واحد بيلاقي كرسي ومشروب امامه في القطار.<br />** كل الكفاءات رجعت الي البلد والان لم يعد هناك مصريين مغتربين ولا متبهدلين في بلاد الله .<br />** البرنامج النووي المصري يعمل علي قدم وساق ولاكن مش لازم نحكي عن التطورات علشان الحسد .<br />** كل شاب قبل ما يتخرج من الجامعة بيلاقي التعيين والشقة جاهزة فاضل العروسة بس .<br />** المصري اصبح له كرامة خارج بلده واي واحد تحصل معاه مشكلة السفارة تقف معاه وتجيب له حقه اذا كان عايش .<br />** الحرية والديمقراطية في جميع المجالات وبدون اي قيود علي الرأي .<br />** يتم اختيار كل القيادات بناء علي الكفاءات ومدي القدرة علي الابداع والتطوير.<br />** المدن الجديدة في كل مكان وعلي احدث طراز واصبحنا ننافس دبي في الابراج السكنية .<br />** المستشفيات خمس نجوم وكل واحد لديه تأمين صحي ويلاقي العناية علي انه مواطن من الدرجة الاولي مش مسألة برشمتين وخلاص .<br />أسف كان بودي ان يكون كل الذي قلته صحيح ولكن للاسف دي تخاريف صيام .<br />اللهم ابرم لهذه الامة امر رشد يعز فيه اهل طاعتك ويزل فيه اهل معصيتك ويأمر فيه بمعروف وينهي فيه عن المنكر .<br />اللهم ولي علينا خيارنا ولا تولي علينا شرارنا .<br />آمين آمين آمين"
archived = "2006-12-01"
capture_url = "https://web.archive.org/web/20061201080717/http://masr.20at.com:80/article.php?sid=1008"

