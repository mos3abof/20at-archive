[[comments]]
order = 7
subject = "يأخذ ولا يعطي"
author = "مصري مخنوووق"
posted = "2006-10-03"
text = "الريس طول عمره بياخد ولا يعطي<br />أخذ منا ثرواتنا وقطاعنا العام<br />أخذ منا أحلامنا كشباب في حياة كريمة<br />أخذ منا مكانتنا وريادتنا<br />أخذ منا كرامتنا وعزتنا<br />أخذ منا تعليمنا وصحتنا<br />أخذ منا كـــــــل شيئ<br />فلماذا لا (يأخذ) أجـــــازة طويلة ويرحمنا؟؟؟<br />وبمناسبة الرحمة ... ارحمونا من أم الصورة اللي فوق دي ؟؟ دي حاجة تفطر يا نااااس ،،"
archived = "2006-12-01"
capture_url = "https://web.archive.org/web/20061201080717/http://masr.20at.com:80/article.php?sid=1008"

