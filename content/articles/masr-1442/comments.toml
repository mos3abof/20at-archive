subject = "مبروك"
author = "شمعى اسعد"
posted = "2007-01-15"
text = "مبروك يا انجى<br />يعنى انتى تزعلى من البث المباشر من الماسنجر<br />وانتى هنا شغالة بث على كبير<br />ماشى<br />وانا عموما ورا البنطلون ده ومعايا مقص"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"

[[comments]]
order = 17
subject = "والله عدينا ياسمرا واشتهرنا"
author = "gamal"
posted = "2007-01-17"
text = "من أول يوم قرأت لكى وانا من المعجبين بكتاباتك وتنبأت لكى بالتفوق وكنتى فعلا<br />عند توقعات الكثيرين وقدعلقت من قبل على هذا الموضوع فى مدونتك<br />الى الأمام دائما ياسمراء<br />لكى تحياتى"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"

[[comments]]
order = 18
subject = "عسسسسسسسل"
author = "محمد صبري"
posted = "2007-01-21"
text = "جميلة جدا !<br />مش عارف اقول ايه<br />بس لما الواحد يلاقى حاجة جميلة جدا<br />ضرورى هيقول : جميلة جدا<br />حسستينى بأيام ماقبل ثورة يوليو والستات المنقبات نقاب ابيض ف اسود وريحة البخور يوم الجمعة والجرايد اللى فيها كاركايتير فاضح والطربوش !! آآآآه<br />على فكرة : فى عالم امريكى شغال على آلة زمن وناوى يخلصها كمان 4 سنين تقريبا. ربنا يوفقه وياريت ميطلعش بنطلونه هو كمان فردة وفردة"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"

[[comments]]
order = 19
subject = "الشاعر أحمد مطر"
author = "ما عندنا خبز ولا وقود."
posted = "2007-01-22"
text = "ما عندنا ماء.. ولا سدود<br />ما عندنا لحم.. ولا جلود<br />ما عندنا نقود<br />كيف تعيشون إذن؟!<br />نعيش في حب الوطن!<br />الوطن الماضي الذي يحتله اليهود<br />والوطن الباقي الذي<br />يحتله اليهود!<br />أين تعيشون إذن؟<br />نعيش خارج الزمن!<br />الزمن الماضي الذي راح<br />ولن يعود<br />والزمن الآتي الذي<br />ليس له وجود!<br />فيم بقاؤكم إذن؟<br />بقاؤنا من أجل أن نعطي التصدي حقنة،<br />وننعش الصمود لكي يظلا شوكة<br />في مقلة الحسود"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"
