[[comments]]
order = 8
subject = "جميل جداا"
author = "كوكو الضعيف"
posted = "2007-01-14"
text = "سمراءيا سمراء يا حبى انا<br />يلى بأشارة بتوة كام سنة<br />تعالى حبيبتى نعيش الهنا ونبنى بحروفنا طريق المنى<br />تملى يا عمرى عنيكى فى سمايا و شعرك يدفى حنينى وهوايا<br />ولمسة ايديكى دى حلمى ومنايا وقلبك ليلاتى وشوقك معايا<br />دوايا وهوايا فى عمرك كتبتة وشوقى وحنينى فى حبك رسمتة<br />وقلبك ناد يتة وردك حسبتة بحبك يا روحى وقلبك اخدتة<br />يا اجمل جميلة فى بستان ورود هكونلك فراشة رحيقها الخدود<br />ولو مرة غبتى وصبنى الشرود عينيا تقولى فى قلبى موجود (حاجة صغيرة منى ليكى )جميل اللى انتى كتباة جدااا اتمنى نكون اصدقاء"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"

[[comments]]
order = 9
subject = "ايه يا عم الكلام الجامد دة"
author = "smraa alnil"
posted = "2007-01-14"
text = "لالالالالالالا<br />دة انا بقالي معجبين كمان<br />انا كدة عديت بقي<br />بس ما تيجي تكتب بدالي احسن يا كوكو<br />بس المشكلة اني مش اعرفك<br />عامة والله اتبسط بكلامك دة ولو انك هتخلي الناس تفهم غلط ههههههههه"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"

[[comments]]
order = 10
subject = "جميل قوي"
author = "أحمد رحال"
posted = "2007-01-14"
text = "احساسك الشعري عالي فعلا .. بغض النظر عن الوزن و التفعيلات فإن موسيقي المعنى تطغى على كلماتك و تكسبها روحا خاصة بها ..<br />و مبروك على النشر يا إنجي :)"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"

