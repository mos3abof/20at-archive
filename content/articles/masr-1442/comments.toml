[[comments]]
order = 14
subject = "شكرا بجد"
author = "smraa alnil"
posted = "2007-01-15"
text = "شكرا يا احمد علي مشركتك<br />غلبنان<br />ماهما لو كان معاهم فلوس كانوا اشتروا بنطلون غيروا<br />بس تقول ايه بقي للفقر الله يقطعوا<br />القهوجي<br />ربنا يخليك يارب<br />بس انت دقق كدة هتلاقيه بنطلون بس الموضوع اختلف معاك شوية<br />ههههههه<br />لزعيمة<br />ربنا يخليكي يارب<br />يارافعه من معنوايتي علي طول"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"

[[comments]]
order = 15
subject = "برافو"
author = "ريما"
posted = "2007-01-15"
text = "بجدكتير حلو... اسلوبك رائع يا سمراء<br />بس مش تكتفي فيها و منرجعش نقرالك اشي تاني<br />مستنين جديدك<br />مبروك"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"

[[comments]]
