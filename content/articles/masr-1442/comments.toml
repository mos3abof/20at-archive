text = "الله الله يا سمرا الله ماشاء الله صيتيك وصل اهو عقبالنا بالتوفيق يارب و طبعا مش هقدر اقول اي حاجه علي الموضوع ده اكتر من الي انتي قلتيه كلاميك ملوش حل"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"

