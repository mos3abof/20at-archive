[[comments]]
order = 0
subject = "أنا أول واحد برضه"
author = "مزمز صاحب الكهف المظلم"
posted = "2007-01-14"
text = "طبعا مفيش مزمز غيري وحبيت أكون أول واحد يعلق يا سمرا عشان لما تيجي تقري الموضوع تعرفي إن في وراكي رجالة<br />ههههه<br />بس طبعا النص جميييييييل<br />وانا معلقلك عليه زمااااااان لما نشرتيه<br />مبروووك<br />اتشهرتي يا جميييل<br />عقبالنا يارب"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"

[[comments]]
order = 1
subject = "شكرا"
author = "smraa alnil"
posted = "2007-01-14"
text = "طب والله انا فرحانه اوي بجد شكرا<br />وشكرا ليك يا مزمز دلوقتي عرفت ان انا ورايا رجالة<br />عشان احنا هنعيش عيشة رجالة ووقفنا وقفة رجالة<br />ومش تخاف لما اتشهر مش هنساك<br />هههههههههه"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"

[[comments]]
order = 2
subject = "مبروك يا سمرا"
author = "طارق"
posted = "2007-01-14"
text = "مبروك يا سمرا تستهلى الخير كله و دايما كلامك ملئ بالشجن على الوضع الحالى و ما يرتبط به<br />أهل اسكندرية كلهم بيهنوكى"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"

