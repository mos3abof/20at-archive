[[comments]]
order = 5
subject = "طبعا ليها علاقة"
author = "smraa alnil"
posted = "2007-01-14"
text = "انت مش واخد بالك ان هي حاطة رجل علي رجل<br />وبعدين دي الصورة اللي لقيتها يوميها<br />اعترض بقي<br />هههههههه<br />اعترض كدة وقولي<br />بس انت دقق فيها كدة هتلاقيها حلوة<br />ولا انت معترض<br />طارق بجد شكرا ليك<br />واهل القاهرة بيحبوا اهل اسكندرية"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127182622/http://masr.20at.com:80/article.php?sid=1442"

