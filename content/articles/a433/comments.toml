[[comments]]
order = 2
subject = "بيرو"
text = "زمان كنت بقول لأبويا :مادام موش عارف مين بتاع كتاب الفلسفة بيقول إن الشك يؤدي الي اليقين فأنا اوعدك ان اي حاجة هتشك اني بعملها وانا في الاصل مابعلهاش هعملها بس علشان خاطرك وعلشان شكك يتحول ليقين وتستريح....<br />طبعا ممكن حد يلومني ويقولي دي قلة أدب وفلسلسفة فارغة مع الاب ...<br />أرد وأقولكم إن أبويا هو أول أب يرفع شعارات ..<br />أنا أشك إذن أنا أب موجود<br />الشك في الأبناء....من أجل حياة أفضل"
archived = "2004-07-11"
capture_url = "https://web.archive.org/web/20040711063210/http://www.20at.com:80/article.php?sid=433"

