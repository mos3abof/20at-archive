[[comments]]
order = 0
subject = "بابا حبيبي"
text = "ماما دايما هي اللي بتشك..و بابا دايما هوا اللي بيدافع عني...\" ربنا يخليه ليا\"..<br />ماما طيبة اوي بس شكاكه و فاكره كل حاجة حركات و دلع بنات..بابا متفاهم جدا..و فاهم ظروف سني..و في نفس الوقت من غير تسيب..بس مرخي الحبل شوية..ولو حصل و ساعات أستغليت دا بندم أوي و بحاول أصلح و اظبط.."
archived = "2004-07-11"
capture_url = "https://web.archive.org/web/20040711063210/http://www.20at.com:80/article.php?sid=433"

