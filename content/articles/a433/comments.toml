[[comments]]
order = 4
subject = "بيرو كمان وكمان_قصة_"
text = "أعرف واحد صاحبي ليه مع ابوه حكايات غريبة...<br />كل يوم ابوه يصحيه من النوم يقوله ...<br />أنا عرفت إنك عملت المصيبة الفلانية أمبارح....<br />وكذبت عليا أول امبارح<br />واتخانقت في الشارع مع اصحابك<br />يقعد صاحبي يفكر في طريقة واحدة محتمل ان المعلومات وصلت لابوه عن طريقها ...<br />أبدا...<br />صاحبي بيتغل ساعات الصفا مع ابوه وبيسأله...عرفت ازاي يا بابا اني عملت كدة...؟؟؟<br />يرد ابوه ....حلمت ياحبيبي اني شايفك وانت بتعمل المصايب دي فقولت اقولك.....!!!<br />حكاية غريبة صح ...والاغرب انها بتكرر مع صاحبي باستمرار...<br />الموضوع خلي صاحبي يبدأ \"يشك \"في ابوه...<br />خصوصا مع ما صحاه اول امبارح من النوم وهو بيقوله<br />بقي ناوي تروح السينما وتشوف فيلم روبي مع اصحابك بعد بكرة..\"اللي هوه النهاردة\"<br />طيب الاول كان بيحلم بالحاجات اللي حصلت...<br />دلوقتي الموضوع تطور وبقي بيتنبأ...<br />طيب وبعدين...<br />كانت النتيجة أن صاحبي ماراحش الفيلم...<br />وأبوه طول اليوم نايم \"بيحلم\"في البيت<br />وبقينا احنا كلنا بنشك في والد صاحبي.....!!!!!"
archived = "2004-07-11"
capture_url = "https://web.archive.org/web/20040711063210/http://www.20at.com:80/article.php?sid=433"

