text = "اولا انا عايز اشكرك واحييك على حاجه زى كده عشان تساعدنا وتساعد غيرنا ميبقوش زيينا وربنا يكرمك ويحميك.<br />الحقيقه انا كنت شاذ لفتره من الزمن قبل كده بس مش شاذ اوى يعنى انا مش معقد نفسيا لأ بس كنت ببقى مهتاج اوى ومش عارف اعمل ايه فلجأت لكده انما الحمد لله دلوقتى وبقالى كتير حتى مش بمارس العاده السريه بس المشكله بدنيه مش نفسيه يعنى انا فاضلى انشاء الله سنه واتخرج وهخش الجييش ومشعارف هعمل ايه فى الكشف الطبى لما يكشفو عليا ويلاقونى كده انا بجد نفسى فى حل لفتحة الشرج يعنى انا اعرف واحد كانت عنده فتحتة الشرج ضيقه اوى فبيعانى منها كل ما بيدخل الحمام فوسعوهالو فى المستشفى فانا اتمنى لو فى اقدر اعمل حاجه زى كده عشان يكون تهتك الفتحه عندى قانونى او عادى او اى حل تانى ومافيش قدامى غيرك يا دكتور لأنى طبعا محرج جدا جدا ومشعارف فعلا اعمل ايه والموضوع ده هو اللى كل ما افرح اقول لنفسى فرحان ليه وناسى الفضيحه وهتعمل ايه؟؟؟؟؟؟؟؟؟؟؟<br />شكرا ومعلش طولت"
