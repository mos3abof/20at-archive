posted = "2008-01-18"
text = "يسيئني أنك سميتي نفسك \"سحاقية\". ربما تمارسين السحاق لكنه ليس هويتك. هويتك إمرأة سوية. لكنك ربما تحتاجين للعثور على المرأة السوية بداخلك. ربما تعرضت لجروح شديدة نفسية أو جنسية أو الاثنين معاً. ربما وجدت أن مثل هذه الممارسات تخدر لك الألم بعض الشيء أو تشعرك بلحظات من الحب والاهتمام والسعادة. أنت مثلنا جميعاً. كلنا نخدر أنفسنا بأشياء لكي لا نشعر ولا نواجه أنفسنا الحقيقية ولا الحياة كما هي. بعضنا يتخدر بالجنس أو بالأكل، بعضنا بالمال أو بالشهرة أو بالنجاح أو بالعمل أو حتى بالتدين والتعصب الديني كما تلاحظين من التعليقات على هذا الموضوع أو في أي موضوع أو على أي موقع عربي على الانترنت. من المسيحيين والمسلمين على حد سواء.<br />كلنا يبحث عن شيء ليشعر أنه \"على ما يرام\" أو ربما \" أفضل\" من غيره. كلنا يبحث عما يشعره أنه \"محبوب\" أو \"مرغوب\" أو هناك من يهتم به. كلنا يبحث عن الحب!"
