text = "أحيى بالطبع أي جهد لعلاج المثليين , و يؤسفنى هذا التسطيح الذى علق به البعض , و هو ما سوضح كيف انهارت ثقافتنا إلى الحضيض أما عن الأخ جبنة , فيا ترى هو عايز إيه بالظبط ؟ و ليه مسمي نفسه جبنة ؟ اللى يعرف يقول إن ده اسم ذا إيحاء بإنه … و ازاي بقى واحد كده يتطاول و يهين في المسيحية ؟ و مش ممكن ان كل المواضيع تنتهى فى الآخر إلى خناقات و تشليق يزج بالأديان فى كلام فارغ … الراجل طبيب نفسي و له حيثية علمية , ياريت اللى يعرف حد عنده مشكلة من هذا النوع يرسله له , يمكن يقدر يساعده , أما الأخ اللى أفاض و أطال فى الحديث عن حمدي رزق ؛ مين حمدى رزق ده ؟ و إيه علاقة تصفية حسابات بين صحفيين بموضوع ذو خلفية اجتماعية علمية ؟"
