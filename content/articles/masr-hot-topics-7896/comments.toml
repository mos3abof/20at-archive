text = "بشجاعة واقتدار يحسد عليهما يلعب الزميل حمدي رزق الآن دور عمرة في بلاط صاحبة الجلالة ،بعدما لم يعد لدية مايخسرة أو حتى يكسبة أو على الأقل يراهن بة مثلما عاش يفعل طوال مسيرتة في بلاط صاحبة الجلالة ،فقد سقطت كل أدوارة التي لعبها باقتدار على مسرح صاحبة الجلالة سقوطا مدويا وذريعا رغم اتقانة كل منها ،فمأساة حمدي رزق انة اعظم من مثل واتقن الدور ولكن النجاح و التكريم كان يذهب لاخرون لايقل عنهم حمدي ذكاء أو موهبة فهما جميعا ممثلين محترفين، إلا أن ادوار حمدي رزق في مسرح صاحبة الجلالة كان ينقصها شي ما، ومع كل فشل لدور من أدوارة كان ضميرة يستيقظ فجاءة صارخا \" نشتنت يافالح \" ليبداء حمدي مرة أخرى من جديد بدور تمثيلي أصعب ولكن يتكرر نفس الأمر حيث يجيد حمدي اتقان دورة على خير وجة ينافس به عظماء السينما المصرية و العالمية إلا سقوطة ونجاح آخرين كانت هي المحصلة .<br />أبدع حمدي رزق في دور\" محجوب عبد الدايم\" أمام العملاق مكرم محمد احمد فكافوا عبداللة كمال برئاسة تحرير روز اليوسف ، وأجاد حمدي دور محفوظ عجب فجاء عبد القادر شهيب رئيسا لمجلس إدارة و تحرير المصور ، وتفوق حمدي رزق في دور رؤف علوان فجاء مجدي الدقاق رئيسا لتحرير المصور ، وتفوق حمدي رزق في دور المخبر فجاء محمود سعد للكواكب وخلفة فوزي إبراهيم ، وتجلى حمدي دور \" على طائرة الرئاسة \" فخرج من برنامج \" البيت بيتك\" دون رجعة ، و تألق حمدي رزق في أدوار المحلل و البلياتشو و الناضورجى و البرمجى ،و السنيد ،و كبير الحواريين ، و… و …و…و…الخ<br />إلا انة سقط فيها جميعا بامتياز ،حتى حينما لعب دور عميل المخابرات العامة المصرية في ادوارة الصحفية مع القائد السوداني المتمرد \"جون جار نج \" لم يقنع بة أحد من المتفرجين على المسرح السياسي وخرج صفر اليدين.<br />منذ أن خطا حمدي رزق بقدمية خطواتة الأولى في بلاط صاحبة الجلالة وهو يتحين الفرصة تلو الأخرى للصعود على المسرح حتى ولو على جثث وأشلاء الآلاف من اصدقائة ورفاقة وكل من قدم لة يد المساعدة او مد لة يد العون ، فمنذ اللحظة التي شاهد فيها حمدي فيلم ( القاهرة 30 )وهو صبى لم يحبو بعد، شعر أن كاتب السيناريو قد صاغ طريق حمدي رزق الى المجد عبر مسرح الحياة فى سنواتة القادمة ،وحينما أطلق موسى صبري رائعتة \" دموع صاحبة الجلالة \" كانت بداية الانقلاب في حياة حمدي رزق فكان يلتهم بعينية الحلقات المسلسلة من الرواية و التي كانت تنشر تباعا في \" أخبار اليوم \" صباح كل سبت في نهاية الثمانينات ،كان حمدي يصرخ من النشوة مع نهاية كل حلقة صائحا فى داخلة و ضاربا الأرض بقدمية \" وجدتها وجدتها \" ، فأعاش حمدي داخل محفوظ عجب و عاش محفوظ بداخل حمدى ، ورغم ذلك فشل حمدي رزق أن يخرج مواهب محفوظ عجب و عبقرية محجوب عبد الدايم \" مع عادل حمودة في روز اليوسف حتى منتصف التسعينيات فكان ان غادر إلى المصور حيث مكرم محمد احمد مدرسة الاحتراف فى فن البقاء على المسرح و التى تشبع غرور حمدى رزق ، وجائت الفرصة لة على طبق من ذهب ليخرج مواهب محفوظ عجب و عبقرية محجوب عبد الدايم وكل اوهام القوة و النصر التى يحيا عليها ، وعلى مدار 15 عاما لم يخجل حمدي رزق من أن يفعل اى شي أو أن يلعب اى دور ، فلم يخجل من أن يدبر مكيدة بين مكرم و يوسف القعيد خرج منها يوسف طريدا من دار الهلال غير مأسوفا علية بعد أن شعر حمدي أن يوسف قد يكون بديل لة بعد أن استشعر فى يوسف روح محفوظ عجب واقنع مكرم بذلك ،ولم يخشى حمدي أن توجة لة أصابع الاتهام بانة هو الذي حمل نسخة من رواية نجيب محفوظ الخالدة \" أولاد حارتنا \" من مطابع دار الهلال إلى مبنى مباحث امن الدولة في لاظوغلى ليقدم ببلاغ من مرشد قديم وعميل امين للمباحث فى الصحافة المصرية لسنوات مضت ضد مجدي الدقاق لانة بصدد طبع الرواية و توزيعها باسم روايات الهلال لتمنع الرواية من الصدور فى مصر من دار الهلال على يد مجدي الدقاق الذي يكرهة حمدي بكل جوارحة ومن كل اعماقة ،ولم يراعى حمدي صداقة السنين وهو يوشى إلى مكرم بمحمود سعد رئيس تحرير الكواكب الذي يحقد علية حمدي حقدا اسود مغموس فى بحور من الكراهية لانة اعتقد أن سعد يجلس على مقعد كان حمدي أحق بة إلا أن النصيب.<br />\" إياك ان تكون أو تحاول أن تكون أذكى من مديرك يوما ما \" حكمة خالدة لايحفظها حمدي رزق عن ظهر قلب فقط ولكن يعشقها لحد العبادة ويعمل عليها وبها كا قران كريم ،لذلك لم يحاول حمدي يوما أن يسال نفسة لماذا يصمت مكرم على بيزنس صفاء لويس من الاراضى و العقارات و المقاولات حتى صارت ثروتها تقدر بالملايين ؟ ولماذا يغض مكرم النظر عن غالى محمد وهو يقود اكبر عملية ابتزاز لشركات قطاع الأعمال العام بعلاقتة بأحمد عبد الرحمن رئيس هيئة الرقابة الإدارية الأسبق، او وهو يحصل على 30 ألف جنيه مقابل اى فرصة توظيف في قطاع البترول الذي ورثة غالى من بابة بضوء اخضر من مكرم ، ولم يستفسر حمدي عن سر تجاهل مكرم لأعمال عزت بدوى البنكية المشبوهة وحصولة على عمولات من رجال أعمال مقابل تسيل حصولهم على قروض بنكية ،ولم يسال حمدى نفسة يوما لماذا تنهار اصدارات الدار توزيعا و مستوى صحفي وكفاءة مهنية حتى مجلة المصور التي يديرها استاذة مكرم، وكان الدرس الأول لحمدي \" آن القضية ليست قضية توزيع مجلة و لكن رضاء الرجل الكبير عن مكرم \" الذى لم يحاول يوما ما ان يكون أذكى من الرجل الكبير الذي عمل مكرم لة منظرا و مرشدا و محللا لأفكار الرجل الكبير وفارضا على ارض الواقع كل ما يحلم بة الرجل الكبير ،وهنا قرر حمدي آن ينسخ الأدوار فعاش دور مكرم وجعل من مكرم الرجل الكبير و انطلق حمدي يعدو فى كل الفضائيات و الإذاعات و القنوات التليفزيونية لدرجة انة كان يذهب للفضائيات أكثر مما يذهب لمكتبة فى دار الهلال حتى انفطر قلبة و اعلنت شراينة الاعتصام ،وكان دائما مكرم يفتخر فى دار الهلال بان حمدى ((… بيقراء افكارى و ينفذها أحسن منى )) وانطلق حمدي يعمل مخبرا من الطراز الاول ، على زملائة لمكرم حتى نجح فى طرد يوسف القعيد من دار الهلال وتدمير العلاقة بين رجاء النقاش و مكرم و الدسائس لمكرم ضد سناء السعيد و الوشاية لمكرم ضد الدكتورة سلوى ابو سعدة و زرع الاحقاد لدى مكرم تجاة مجدى الدقاق و اطلاق الشكوك فى عقل مكرم تجاة عبد القادر شهيب و غرس الفتنة فى علاقة محمود سعد بمكرم محمد احمد ،و…،و…الخ<br />طالما حاول حمدي طوال سنواتة في بلاط صاحبة الجلالة أن يثبت ان كلية الأعلام بجامعة القاهرة يمكن ان تخرج ممثلين من قسم الصحافة بكفاءة و اجادة تتفوق على خريجي معهد السينما ومعهد الفنون المسرحية ،إلا أن الحظ لم يكن يلعب دائما مع حمدي رزق بل كان الحظ ضدة في أوقات كثيرة ، وكثيرا ما حاول حمدي ان يؤسس مدرسة جديدة في الصحافة تقوم على \" اللعب على كل الأطراف \" و \"استغلال الفرص و الهروب من المركب قبل الغرق و فن الوصولية وكان دائما و لايزال يكرر ماثورة شهيرة \" الى تغلبة ألعبة \" لذلك سعى الى صهر عبقرية محجوب عبد الدايم و ذكاء محفوظ عجب مع خلاصة رحلته و ملخص كل دور من ادوارة في بلاط صاحبة الجلالة بما تحمل هذة الرحلات و الادوار من كل السقطات و الأخطاء و الأحقاد و الدسائس ولكن كان دائما ما يصدم بحمدي بسو ء التقدير فلا كل من اقترب منهم حمدي هم محجوب عبد الدايم ولا هم محفوظ عجب فقد كان و لايزال هناك شرفاء على المسرح وفى البلاط لم يتلوثوا طوال مشوارهم لذلك جاء عبد اللة كمال رغم كل مساوءة ولم ياتى حمدي رزق رغم ان كليهما شخص واحد بل كان عبداللة تربية حمدي رزق صحفيا بكل ما تحمل هذة التربية من …!!!!!<br />بخروج مكرم محمد احمد من دار الهلال دون رجعة، انتهى عصر حمدي رزق إلى الأبد وسقط من أعلى قمة جبل الموالسين و الأفاقين و الحواريين ليترك القمة لاخرين ، على الأقل من ناحية طموحة فى رئاسة تحرير المصور ، ويعلم جيدا ذلك كل العاملين في الوسط الصحفي الا شخص واحد فقط هو حمدي رزق نفسة ، فلا ظهورة في الفضائيات صبحا و مساء و على مدار 24 ساعة متحدثا في كل ألوان السياسة و مغازلا كل الأسياد حول مبارك وجمال مبارك قد حنن قلب أحد علية ، ألا أن حمدي لايزال يصر على ان الأمل باقى وكل من يقراء عمودة فى \"المصري اليوم \" لا يسعة إلا القهقهة فا للعبة انتهت و الدومينو أغلقت، ولم يعد هناك أولاد في الكوتشينة بل اكثر من شايب لا حاجة لة ،والستارة نزلت، و كل الممثلين غادروا المسرح إلى أعمالهم الجديدة مكافاءة لهم على ادائهم ،إلا حمدي رزق لايزال مندمجا فى دورة على المسرح و مؤديا لة حتى رغم انصراف الجمهور من كراسي المتفرجين باستثناء مشاهد واحد يجلس معجبا و مصفقا ومشيدا بأداء حمدي رزق ورغم ان هذا المشاهد لم يعد لاحول لة ولا قوة هو الاخر ويعيش ايامة الاخيرة ، الا انة رهان حمدي الأخير فاهذا المشاهد هو العملاق مكرم محمد احمد الذى طالما الهم حمدي كيف يلعب اعظم ادوار فى الصحافة المصرية وهاهو حمدي يبدع الان آخر ادوارة أمام العملاق الا وهو دور \" السفرجى \" فهو اخر الأدوار التي يجيدها حمدي رزق بعد ان سقطت كل الأدوار الأخرى ، ولكن يصمم حمدى رزق على التنشين الخطاء و المقامرة على ميراث الريح، فحتى العملاق مكرم أصبح هو الأخر عملاق فى متحف الزمان لا حول لة ولا قوة بعد ان اصبح عبا على خشبة المسرح نفسها التى نخرها السوس ، ولكن حمدى يصر على مواصلة دور \" السفرجى \" امام العملاق مكرم محمد احمد فى مسرح خالى من المشاهدين و الممثلين وحتى السعاة ، فلا شي يهم لدى حمدي الا العملاق مكرم ، ولا شى يهم مكرم الان الا حمدى فهو آخر المؤمنين بة بعد ان ارتد عنة الجميع وكفر بة تلاميذة وحوارية ولم يعد سواة وحمدي يسيران بخطى ثابتة الى مصير بكار بعد ما سبقهم الية سمير رجب و ابراهيم سعدة و ابراهيم نافع و…الخ"
