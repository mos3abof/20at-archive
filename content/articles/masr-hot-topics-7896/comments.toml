text = "أكثر (300) قسيس يواجهون تهمة التحرش بالاطفال جنسياً!<br />- مجلة \"التايم\" : بات كثير من النصارى يشككون في الدين نفسه وليس فقط في معتقد من معتقداته.<br />الفضائح الجنسية المخجلة التي ارتكبها القساوسة في أكثر من بلد غربي على رأسها الولايات المتحدة الأمريكية ، أصبحت خطراً حقيقياً يهدد الكنيسة الكاثوليكية ،وأصبح بابا الفاتيكان يوحنا بولس الثاني في مأزق فما يحاول أن يعالجه من انحراف فطري استمر لعقود طويلة حين حرَّمت الكنيسة الزواج على رجالها ، فلم يجد القساوسة و الرهبان إلا ممارسة الشذوذ الجنسي ، و لو مع الأطفال كوسيلة لاستعادة التوازن الفطري المفقود.<br />واضطر البابا إلى أن يجمع الكرادلة ويبحث معهم موقف الكنيسة من تغيير عهد العزوف عن الزواج، الذي يقطعه القساوسة الكاثوليك على أنفسهم، برغم المعارضة القوية من البابا نفسه للمساس بهذا العهد، إلا أنه مضطر لاحتواء جنوح الكرادلة نحو الشذوذ الجنسي.<br />وقد كشفت دراسة أمريكية عن أن 167 قسًا كاثوليكيًا أمريكيًا نقلوا من مواقعهم الكنسية منذ تفجر فضيحة الاعتداءات الجنسية على الأطفال، التي ضربت الكنيسة الكاثوليكية في الولايات المتحدة.<br />وقد أجري مسح اتضح منه أن عدد القساوسة الذين أوقفوا عن ممارسة واجباتهم الدينية ربما يكون أكبر من ذلك ؛ لأن كثيراً من الأبرشيات ترفض الكشف عن الأعداد الحقيقية.<br />وقد جاءت هذه النتائج في الوقت الذي كشف فيه استطلاع للرأي أجري في الولايات المتحدة عن تراجع ثقة الأمريكيين في الكنيسة، حيث أشار الاستطلاع إلى أن نصف الأمريكيين –فقط- لديهم انطباعًا إيجابيًا عنها.<br />وأشار المسح إلى أن عدد القساوسة الذين سلمت أوراقهم إلى الشرطة قد ارتفع إلى 260 قسًا منذ تكشف أبعاد الفضيحة قبل أربعة أشهر.<br />ويشير المسح إلى أن 550 شخصًا قد قدموا شكاوى ضد رجال دين النصارى في ولايتي( ماسوشيستس ومين) فقط.<br />ويواجه نحو ثلاثة آلاف من القساوسة اتهامات التحرش الجنسي بالأطفال.<br />وقد كلَّفت هذه الفضائح الكنيسة مبالغ طائلة وصلت إلى مليار دولار، حيث اضطرت لعقد تسوية خارج المحكمة في عدد من القضايا، وذكر أن عددًا من الأبرشيات قد أفلست تمامًا بسبب الفضائح."
