text = "بسم الله والصلاة واتلسلام على رسول الله محمد بن عبد الله النبي الامي خاتم الرسل الذي ارسله الله عز وجل ليكون للعالمين بشيرا ونزيرا وليس للعرب فقط بل للعالمين اي لجميع البشر .<br />الحمد لله الذي عافاني مما ابتلى به غيري وكرمني عن كثير من خلقه<br />ونرجع لايام سيدنا لوط عليه السلام وقومه القصة التى جلنا نعرفها وهي قصة قوم لوط وكيف انهم عصوا اوامر الله عز وجل وفعلوا فاحشة لم يسبقهم اليها احد من العالمين اتخذوا الرجال دون النساء وكيف كانت عاقبتهم اما بقا تقولي نتعاطف معاهم ومش عارف ايه يا عم الحج ده واحد بيعمل كبيرة من الكبائر وبالنسبة لرايي الشخصي ان اهم وسيلة للعلاج هي مخافة الله عز وجل ان يعاقبنا بما عاقب به قوم لوط عليهم من الله ما يستحقون واول وسيلة للعلاجة هي دعاء الله عز وجل وثانيا الزواج بالنسبة للشباب الاعزب ولان الفرة السليمة تأبى عن قبول هذه الافعال الشاذة بالنسبة للسيدات او اللواط بالنسبة للرجال حفظنا الله وجميع المسلمين من هذه الامراض الخبيثة"
