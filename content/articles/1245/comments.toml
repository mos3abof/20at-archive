[[comments]]
order = 1
subject = "ضد كل الأديان"
author = "سمير سميح"
posted = "2006-05-20"
text = "أحبائى .... هذه الروايه للأسف تسئ الى كل الأديان وليس للمسيحية فقط ويجب ان يقاطعهاكل مؤمنى الأديان حيث أن كاتبها يقول من خلال احداثها أن العبادة الحقيقية هى ممارسة الجنس وينادى بأن العلاقه الروحية بالآلهة لا تتم الا من خلال ممارسة الجنس والشذوذ كما كان فى العبادات الوثنية القديمةوينادى أيضا بعدم جدوىذهاب أصحاب الأديان المختلفة الى دور العبادة أى أن كل فكر هذة الروايه هو فكر اللحادى واضح .فهل يرضى هذا الفكر أى منا سواء كنا مسيحيين أو مسلميين ؟لا أعتقد هذا..لذلك يجب علينا جميعا مقاطعة هذه الروايه وهذا الفكر الدخيل على عقائدنا وعاداتنا وأخلاقنا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141330/http://www.20at.com/article2.php?sid=822"

