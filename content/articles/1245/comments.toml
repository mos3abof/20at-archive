subject = "دافنشي كود والديانة اليهودية"
author = "تسنيم حسون"
posted = "2006-05-21"
text = "الرواية ومن خلال قرائتي لها تدعو بطريق غير مباشر إلى اليهودية، وترغمك على التعاطف مع جمعية سيون والتعجب من الظلم الواقع عليهم وترsيخ قيمهم العادلةK (جمعية صهيون)والتي تعتبر جمعية يهودية بحتة تحاول التشكيك بالديانةالمسيحية من أجل نشر الديانة اليهودية. وتبقى الديانة المسيحية أفضل من الديانة اليهودية بكثير."
archived = "2006-11-02"
