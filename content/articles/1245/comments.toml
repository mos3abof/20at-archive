subject = "ولكن ما الهدف!!"
author = "فهد"
posted = "2006-06-16"
text = "السلام عليكم..<br />لقد قرأت الروايه واعجبني سرد الأحداث فيها وطرح حقائق ووقائع فليس لنا أن نقول أن جميع الأسماء اللتي ذكرت والمواقع الألكترونية محض خيال!!<br />ولكن الغريب أن ارى الكاتب (دان براون)<br />أراد أن يضع نفسه داخل دائرة الإتهام من قبل المسيحين ولا أعرف لماذا ..<br />لا أظن لأجل الشهره فدان مؤلف مشهور<br />وغني عن التعريف قد قرأت من مؤلفاته مايكفي للحكم عليه بأنه رجل براعته في التصوير هائلة مثل (الحصن الرقمي,حقيقة الخديعة,ملائكةوشياطين)<br />و كتبه هي الاكثر مبيعا في العالم !!<br />اذن هو هنا لايبحث عن الشهره ولكن له هدف آخر اتمنى معرفته.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141330/http://www.20at.com/article2.php?sid=822"

