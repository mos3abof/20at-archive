text = "سمعت على أن الفراغ الذى ترك بين المسيح يسوع والذى بجانبه هو على شكل رقم 7 وهذا الشكل يرمز فى اليونانية على أن المرموز إليه إمرأة ولكن سؤال لمن يوافق على شفرة دافنشى أين يوحنا الحبيب فى الصورة وأين هو خاتم الزواج .. فإذاً الجالس عن يمين يسوع المسيح هو يوحنا الحبيب"
