[[comments]]
order = 4
subject = "مختصر موجز لكود دافنشي بدون تعليق!"
author = "نجم الدين"
posted = "2006-05-21"
text = "عمتم صباحا أيها السادة/<br />ليلة الأمس أمضيتها بمشاهدة الفيلم المذكور، وحقيقة يطرح قضايا تمس جوهر العقيدة المسيحية كما نعرفها اليوم، وأعني بالذات طبيعة السيد المسيح عليه السلام، حيث يذكر صراحة على لسان البروفيسور بأن الطائفة المسيحية الأولى التي تجمعت حول المسيح لم تر فيه غير نبي مرسل، مثله كمثل من أرسل قبله من النبيين، وأن فكرة تأليه المسيح جاءت بعد قرار الإمبراطور الروماني قسطنطين، إعتماد المسيحية كدين رسمي للدولة، لدوافع سياسية محضة لأن روما كانت منقسمة على نفسها، بين المحافظين على الثرات الوثني وأتباع المذهب الجديد المثمثل بالمسيحية المعدلة بإستحداثات بولس. وبولس هذا زاوج بين معتقدات الرومان الوثنية وبين المسيحية كديانة توحيدية، فخرج منها مزيجا هو جوهر المسيحية التي نعرفها اليوم، من الثليث وكون يسوع إبن الله وما إليه من المستحدثات الأخرى. أخطر نقطة في الفيلم تشير الى أن السيد المسيح عليه السلام كان على علاقة جنسية بمارية المجدلية، علاقة أثمرت جنينا، وأن لوحة العشاء الأخير لدافنشي تصور مارية هذه كالحواري الجالس الى يمين السيد المسيح، ويتسائل البروفيسور:\"هل ترون فى اللوحة أي كأس مقدس؟\". ولمن لايعرف فالنبيذ الكنسي يقدم في الكنائس على أنه دم السيد المسيح الذي سفح تكفيرا عن خطايا البشر، و قطع من الخبز رمز لجسده، بمعنى أن المؤمن المسيحي يجعل المسيح جسدا ودما كجزء منه. لن أعلق هنا على هذا بشئ ولن أشير الي مصدر هذا بأساطير اليونان والرومان الوثنية.<br />الفيلم يخلص الى أن الكأس المقدسة رمز للأنوثة، وهي تقابل هرما مقلوبا يمثل رمز الذكورة عند الرجال. وأذكي ما ذكر في هذا الفيلم أن صورة هذا الكأس يحدها خطان أحدهما مطابق لوضع السيد المسيح وجلسته في تلك اللوحة، وهو مائل لليمين، والآخر لمارية المجدلية وهو مائل لليسار، ويتلاقى الخطان بنقطة ما خارج حدود اللوحة من الآسفل. وأيضا يداعب المخرج خيال المشاهد الذي يعلم ولع دافنشي وإسلوبه فى قلب الأشياء، ويدخل في تبديلة رياضية، بحيث يجعل مارية على يسار المسيح، فإذا هي متكئة برأسها على كتفه، صورة ولا أشد العشاق هياما، معاذ الله أن يلصق هذا برسول كريم.<br />المهم أن الكنيسة حسب الفيلم إحتفظت بسر الكأس المقدس، الذي هو مارية المجدلية، وأزاحت من طريقها كل من عرف بالسر، حتى فرسان المعبد الأولى أحضروا رفاتها من فلسطين إبان الحروب الصليبية، وأعجب ما في هذا الفيلم خاتمته التي تجعل من \"اودري تاتو\" الفرنسية من سلالة وأحفاد المسيح وزوجته مارية المجدلية!<br />هذا يا سادة مختصر مفيد لهذا الفيلم!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141330/http://www.20at.com/article2.php?sid=822"

