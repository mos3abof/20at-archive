[[comments]]
order = 2
subject = "خلي شركات الصهاينة تشتغل يا مبارك يا واطي ..."
author = "إبن بهية"
posted = "2006-11-25"
text = "النظام القذر وحكومة مبارك الواطي كل يوم بيخيطوا في كفنهم .. كل يوم بيجهزوا في الكفن اللي ما لوش لازمه لأنهم راح يتحرقوا حرق بإذن الله .. مش عشان هندوس ولا سيخ .. لأ ولكن لأنهم لصوص .. خونة .. عارفين قصة الصيادلة دي إيه يا أفندية ؟؟؟ نظام مبارك الواطي عايز يمهد الطريق للشركات الصهيونية بتاعة الدوا تخش وتملا البلد .. اسألوا عن شركات الدواء متعددة الجنسيات ((كلها صهاينه)) وجيمي وعيال الأعمال اللي معاه قابضين التمن وكله ألسطه .. طيب يعملوا إبه والنقابة مش راح توافق ؟؟؟ ازاي يكيدوا للصيادلة ويخربوا بيتهم ؟؟؟ راحوا جايبين كام مخبر عدمان وكام ظابط معفن وهات يا تلطيش وبهدلة وتخريب في الصيدليات بلا أي مبرر .. طيب المخبر ده اللي ما يعرفش العمى منين هيعرف الأدوية ويفتش صيدلية ؟؟؟ مبارك الواطي ونظامه القذر بيتعاملوا مع البلد كأنها عزبة أبوهم .. يعني نجيبلك الدوا اللي احنا عايزينه ونطفحهولك غصب عن عين أهلك .. ونجيب الشركة اللي تبيعهولك غصب عن عين أهلك .. تقدر تتكلم ؟؟؟ والله مش عارف أقول إيه لكن سيبونا يومين نجمع معلومات كفاية عن شركاتهم القذرة اللي عايزيننها تقش البلد .. ناقص الدوا كمان يخربوه للغلابة ..<br />يا ناس الموضوع فلت وكبر أوي .. وشكل الواطي الكلب مبارك ونظامه الوسخ مطمئنين خالص إننا شعب جربان عدمان وراكنين على حبيبهم العادلي بوبي جيمي سوزان وكل البوبيهات من أمن الدولة القذر اللي بيحموهم وفاكرين إننا متنا خالص وما عادش فينا فايده .. والجيش خلاص راح في أبو نيكله وما عادش ينفع يعمل فرقة فنون شعبية مش فرق حربية ممكن تقوم بحركات انقلابية زي الفال الحلو بتاع موريتانيا .. بس الأباعد الكلاب نسيوا إننا راح نفوق في يوم قريب جدا وينضربوا بالصرمة القديمة ويتحرقوا في ميدان التحرير .<br />إبن بهية<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128154327/http://masr.20at.com:80/article.php?sid=1209"

[[comments]]
order = 3
subject = "حسبى الله ونعم الوكيل"
author = "منى"
posted = "2006-11-26"
text = "عاوزة اعرف حاجة واحدة ... هو مبارك فين من كل ده ؟ وليه ماادخلش خالص هو ناسى انه هايقف عريان قدام رب كريم يوم القيامة ويحاسبه على اللى عمله فى القضاه والصحفيين والمحامين والاطباء والمدرسين والشباب العاطل والسفور اللى فى الشارع ومهزلة السخرية من النقاب وبعده الحجاب ... وبالمناسبة يا ولاد البلد \" نغظيتكوا للموضوع ده كانت بجد من ظريفة خالص ... كنتوا ضد الاخوان لمجرد الاختلاف .. اما الريس فقال يا واد طنش خالص<br />حسيى الله ونعم الوكيل"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128154327/http://masr.20at.com:80/article.php?sid=1209"

[[comments]]
order = 4
subject = "بعد ما بعتوا المصانع !!!!هل سوف تبيعوا صحة الناس الغلابه الفقراء ؟؟؟"
author = "حودة"
posted = "2006-11-26"
text = "كفايه حرام ربنا حيحاسبكم<br />بعد بيع المصانع اصبح المصريين ليس في يديهم اي ثروة<br />البترول يستخرج من كل مواقع مصر ولا نعرف اين الدخل من البترول<br />الغاز الطبيعي يستخرج من ارض وبحر مصر ولا نعرف اين تذهب النقود الخاصة بها<br />اليهود يحصلوا علي الغاز في منازلهم ومنازل المصريين لا تحصل علي الغاز ولسه<br />الناس بتولع بالجازولين وبالحطب والفحم<br />وصحة الناس في النازل<br />استخدمت وزارة الزراعة الكيماويات في المقاومة الزراعية واصابة الناس بالسلطان والسكر والضغط<br />تركت الدولة الترع والناس تغسل فيها الملابس ويشرب الناس من الترع فاصيبوا بالبلهارسيا وامراض الكبد فرس a b c<br />وهذه الايام عايزين تبيعوا صحة الناس<br />الناس الغلابه بيشتروا ادوية من الصيدليات علي قدر حالهم<br />لو اشترك الاجانب في امتلاك الصيدليات من اين سيشتري الغلابه الدواء<br />سيدخل الدواء الامريكي ولن يستطيع المواطن المسكين ان يشتري حبه اسبرين<br />ربنا يأخذ المفترين<br />كيكون فيه يوم تشوفوا فيه الذل<br />في الدنيا<br />وفي الاخرة يوم يفر المرء من اخيه وامه وابيه لكل امرء منهم شئ يغنيه<br />والله سوف تروا ايام سوداء اسود من 1967<br />يا عالم خافوا من ربنا وابعدوا عن الشعب<br />الغلبان المسكين<br />ربنا يورينا فيكم يوم ويوري كل المفترين<br />وحسبنا الله ونعم الوكيل نعم المولي ونعم النصير"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128154327/http://masr.20at.com:80/article.php?sid=1209"

[[comments]]
order = 5
subject = "ولاد الكلب"
author = "مهدي"
posted = "2006-11-28"
text = "كلهم ولاد كلب من اللي حاكمينا للمسيحيين ولاد النجسه شوفتوا ابن الشرموطه الناس فوقه قاعدين بيتكلموا عن ادويه وسموم هتخش جسمنا بسبب القائد المفدي حسني مبارك وابنه يحضر المسيحي اللي امه بتصرف عليه من عرق وراكها يشتم في ديننا ونشتم دينه وتبقي هيصه بالمناسبه اللي وزع صور عبدالحليم قنديل برضه واحد مسيحي كلهم ولاد كلب وخونه وكان في واحد غير ماكسيموس كان عاوز يكون بابا زي شنوده كده اسمه قابيل تقريبا نجيب جبرائيل اتهمه انه كان بيبيع خمره طلع الاشا كان شغال مع المباحث بموافقه الكنيسه يسكر المسجلين خطر والصياع علشان يعرف اخبار المتدينين اللي في الشارع ادي ولاد الكلب ولاد دين الكلب"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128154327/http://masr.20at.com:80/article.php?sid=1209"

