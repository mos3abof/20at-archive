posted = "2006-06-25"
text = "رونالدو دا حكايه..فعلا على راى عمرو اديب لعيب نجم بكرش..<br />سمعت انه دخل المونديال وزنه 96 و دلوقتى نزل ل 90<br />و بحسابات الكره رونالدو فعلا ظاهره ملهاش تفسير<br />وزن بالشكل دا و اداء كويس و هداف بطولات و مقدره على قطع مسافات للمرمى<br />هى دى البرازيل يا جماعه"
archived = "2007-12-08"
