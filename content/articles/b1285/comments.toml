[[comments]]
order = 0
subject = "جمال البنا والاساءات"
author = "معاذ محمود عامر"
posted = "2006-09-28"
text = "أعتقد يا عشرينات انه كان يجب عليكم من باب الدقة والامانة أن تنشروا آخر مقالين كتبهماالمفكر الاسلامي الأستاذ جمال البنا الأربعاء السابق واربعاء الأمس...<br />فبما أنكم قررتم ان تنشروا مقاله المثير للجدل عن التدخين والصيام, كان يجب أن تكملوا السلسلة المتعلقة بهذا الموضوع...<br />وأعتقد أنه تعرض لكثير من الاهانات على لسان بعض العصبيين أو المتشددين....<br />وأظن أن مقاله الذي كتبه الاربعاء قبل السابق كان جديرا بأن يدفع عنه كثيرا من هذه الاهانات السفيهة التي لا يحكم أصحابها عقولهم قبل أن يطلقوها في وجه رجل جليل ومفكر كبير وصاحب مشروع فكري جيد جدا,<br />وان لم يكن كل ذلك فعلى الأقل هو كبير في السن بدرجة تجعل اهانته من الفحش والسب الذي نهى عنه الرسول صلى الله عليه وسلم,<br />لذا أرجو منكم رجاء حارا جدا جدا أن تنشروا مقالتيه المؤرختين27_9<br />و20_9<br />ولكم الشكر العظيم والاحترام الجم ان فعلتم..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123528/http://www.20at.com/article2.php?sid=1285"

[[comments]]
order = 1
subject = "موضوع محكم عن شخصية رائعة"
author = "معاذ محمود عامر"
posted = "2006-09-28"
text = "حمزة يوسف رجل فذ.......<br />لا أقول فذا في أقكاره واجتهاداته مثلا ...<br />وانما هو فذ في المزيج الرائع الذي يكون شخصيته وأسلوبه....<br />عالم هو......<br />ومتعمق في الفقه والعقائد ولب الدين,<br />وهو أيضا مثقف ومطلع على العلوم الانسانية والحضارات المختلفة....<br />كل تلك المقومات كانت كفيلة بان تجعله فذا.....<br />ولكنه أبى الا أن يضفي عليها من..<br />روحانيته...<br />ورقته....<br />وعذوبة أسلوبه....<br />وكاريزما المحاضر التي تملأه.......<br />باختصار جدا....<br />هو حمزة يوسف...............<br />كانت أول معرفتي به منذ سنتين عندما جذبني أسلوبه جدا في أحد البرامج...<br />ثم تابعته بعدها...<br />فأحببته حبا كبيرا وصرت من مريديه ومسحوريه....<br />سحرني فيه ثراء حياته...<br />وبساطة وعمق وصراحة كلماته....<br />(أتمنى دائما أن أمنح فرصة التجول الرائعة التي حظي بها خصوصا أنه بدأها في مثل سني......)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123528/http://www.20at.com/article2.php?sid=1285"

[[comments]]
order = 2
subject = "شكرا للكاتب"
author = "معاذ محمود عامر"
posted = "2006-09-28"
text = "كان اسلوب الكاتب رائعا وأعجتني جدا هذه الجزئية التي يقول فيها\"( نهاية الكلام)<br />سيدندن لك أغنية غربية تدعو للحب والأمل.. أو يشرح لك نظرية فلسفية..<br />سيداعبك بطرفة .. أو يحكي لك عن أصل كلمة في اللغة..<br />ستدمع عيناه وهو يتحدث عن النبي محمد – ص - أو يحلل لك قضية فقهية بمنتهى الجدية ..<br />لكنني أتصور أنه ككل الكبار سيترك فيك أثرًا ..\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123528/http://www.20at.com/article2.php?sid=1285"

