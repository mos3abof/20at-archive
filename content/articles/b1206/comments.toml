subject = "فليبلرك الله لهما00"
author = "جوووووووووود"
posted = "2006-09-10"
text = "يالها من تجربة جميلة ورائعة حقا نتمنى من جميع الاسر التي يمرون بهذه الظروف ان يحذو حذوهم فهم بما قاموا به ابتعدوا عن مذلةسؤال الناس وحققوا ذاتهم وامنوا لقمة عيشهم كما ان عملهم سيزيد من الفتهم وترابطهم كزوجين خصوصا عندما يذوقان طعم النجاح معافليبارك الله لهماجهودهما وليرزقهما من واسع فضله0"
archived = "2006-11-02"
