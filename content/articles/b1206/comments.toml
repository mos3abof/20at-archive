[[comments]]
order = 1
subject = "عشرينات بازار"
author = "باحث عن الحقيقة"
posted = "2006-09-10"
text = "بداية أهنئكم أن هذا هو أول موضوع أقرأه بلا أخطاء لغوية أو نحوية تقريبا.<br />ثانيا: أهنئ السيدة أمينة عباس وزوجها السيد نادر الحمد على نجاح تجربتهما الرائعة، وبحق نحن كنا بحاجة لعرض مثل هذه التجاري وخاصة في هذه الظروف، والشكر موموصول لعشرينات على عرض التجربة.<br />ثالثا: فكرة عرض تجارب الشباب الذي أعلنتم عنه في نهاية الموضوع فكرة رائعة، ولكن اتمنى أن تتخيروا التجارب التي تستحق النشر، وربما يتطور الأمر إلى إنشاء (عشرينات بازار)<br />ahmed-editor@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133909/http://www.20at.com/article2.php?sid=1206"

[[comments]]
order = 2
subject = "البداية بـ 26 دولار... وليست 3 دولار"
author = "باحث عن الحقيقة"
posted = "2006-09-10"
text = "من منطلق علمني الهيافة ياأبه... قال له تعالى في الهايفة واتصدر أقول لكم:<br />العنوان الفرعي يقول البداية بأقل من 3 دولار، في حين أنهم بدأوا بـ 10 دنانير والدينار البحريني = 2.65 دولار، إذ كان معاهم 26.5 دولار."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133909/http://www.20at.com/article2.php?sid=1206"

