posted = "2010-02-28"
text = "ما وجه الشبه بين عبدالرجمن يوسف و محمد علي كلاي ؟.<br />وجه الشبه : أنه بالضربة القاضية من أول جولة في أول الجولة نال من جهاد عودة ممثل المستقبل البائد الذي لن يكون انشاء الله .<br />ان هذا الشاعر بحق انسان مثقف وواعي ومتزن .قل مثله في زمن صناعة مبارك.<br />لكن لدي هاجس يحيرني ! انشاء الله عندما يكون البرادعي رئيساً لمصر بإذن الله , ماحال شعر شاعرنا سيكون ؟ والشعر ابن المحنة!!! .<br />أسأل الله له التوفيق .<br />كنت أتمنى أن يكون معنا في هذه اللحظات المتأججة بالحراك الغير طبيعي على الساحة المصرية.<br />العضيم الدكتور / عبدالوهاب المسيري عليه رحمة الله تعالى وأسكنه فسيح جناته."
archived = "2010-03-06"
capture_url = "https://web.archive.org/web/20100306003927/http://www.20at.com:80/masr/interviews/15476-2010-02-24-17-14-47.html"

