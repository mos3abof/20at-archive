posted = "2010-02-26"
text = "الحملة الشعبية لاستقبال البرادعي<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ<br />اريد ان اقول هنا نقطتين<br />النقطة الاولى ان الحكومة المصرية هي التي ستجري الانتخابات ولن تسمح باحد ان يفوز في الانتخابات الا مرشح الحزب الوطني سواء كان حسني او ابنه<br />ثانيا<br />احنا لما نطلب التغيير نطلبه صح ما نطلبوش غلط<br />برادعي ايه اللي انتو عايزينه يا شعب يا جاهل يا غبي<br />المرة الماضية كنتو عايزين ايمن نور<br />ودلوقتي عايزين البرادعي دون ان تعرفوا عنه شيء<br />انا اقولهم مين البرادعي من الصورة اللي قاعد فيها مع عمرو موسى<br />في موضوع اخر هما الاثنين قاعدين مجعوصين ورجل على رجل<br />من خلال هذه الصورة اؤكد انهم لن يكونوا افضل كثير من جمال مبارك<br />يا شعب مصر لما تطلب التغيير تطلبه صح<br />عمرو خالد هو الاصلح لحكم مصر<br />لان عينه على الارمله واليتيم والمسكين والعاطل والمريض<br />هي دي الشخصية اللي تنفعنا<br />هي دي الشخصية اللي نطالب انها تحكمنا سواء كان فيه انتخابات او ما فيش<br />عمرو خالد هو اصلح الناس لحكم مصر<br />سلام ياشعب"
archived = "2010-03-06"
capture_url = "https://web.archive.org/web/20100306003927/http://www.20at.com:80/masr/interviews/15476-2010-02-24-17-14-47.html"

