posted = "2010-02-25"
text = "الشاعر عبدالرحمن يوسف له قصيده مشهوره اسمها<br />عاش الرئيس للابد<br />ومطلعها بتقول<br />يحيا الرئيس للأبد يحيا هو الفرد الصمد<br />لـه صفـات ربنا لكـنه لـه ولــد!<br />مكتمل وكـامل لذاك ليـس يُنتقـد!<br />الصالحون حوله وليس فيهم من فسد!<br />دومًا يصون مالنا وصـادق إذا وعد!"
archived = "2010-03-06"
capture_url = "https://web.archive.org/web/20100306003927/http://www.20at.com:80/masr/interviews/15476-2010-02-24-17-14-47.html"

[[comments]]
order = 1
subject = ""
author = "دعاء..."
posted = "2010-02-26"
text = "قصيدة يحيا الرئيس إلى الأبد هى قصيدة ساخرة تسخر من الرئيس<br />و حين أقتبست جزء منها أخللت بالمعنى و أظهرته زوراً كأنه يمدح الرئيس عكس الحقيقه طبعاً و ستظهر لك معانى القصيدة إذا رأيت الشاعر وهو يلقيها كامله فيديو<br />فالشاعر معروف عنه معرضته للنظام و لديه فى ذلك الكثير و الكثير من القصائد و التى لا تعارض فقط النظام المصرى و لكنها تعارض كل ظالم و مستبد و من قصائده<br />الـهاتك بأمر الله<br />يا من لعرضى هتك فقدت شرعيتك<br />من ربع قرن كئيب لعنتها طلعتك<br />أموالنا لك حل فأملأ بها جعبتك<br />خلف الحراسة دوماً مستعرضاً قوتك<br />تبدى مظاهر عز تخفى بها ذلتك<br />سلاح جيشك درعاً تحمى به عصبتك<br />مع العدو كليل لكن بشعبى فتك<br />سواد قلبك باد فاصبغ به شيبتك<br />يأتيك دعم عدوى فاصلب به قامتك<br />سجدت للغرب دوماً مستبدلاً قبلتك<br />بأدمعى و دمائى كتبتها قصتك<br />وكل أبناء شعبى قد شاهدت قسوتك<br />خذلت كل شريف حتى غدت لذتك<br />و كم منحت لصوصاً يا قاسياً رحمتك<br />تعطى لنسلك أرضى ممارساً سلطتك<br />كأن أرض جدودى قد أصبحت ضيعتك<br />لا شك موتك يأتى مستأصلا شأفتك<br />يوم الحساب قريب ترى به خيبتك<br />يوم المنصة حق فخذ به عبرتك<br />هذى الجموع يقيناً ما جددت بيعتك"
archived = "2010-03-06"
capture_url = "https://web.archive.org/web/20100306003927/http://www.20at.com:80/masr/interviews/15476-2010-02-24-17-14-47.html"

