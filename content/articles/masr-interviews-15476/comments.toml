text = "دا كلام الخوارج يا دعاء مش كلام اهل السنه والجماعة<br />الكلام دا كان بيتقال لعثوان وعلي<br />هو دا الكلام اللي ودانا في داهيه<br />وخلا اسرائيل تعلا وتعلا"
