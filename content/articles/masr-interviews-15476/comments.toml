posted = "2010-03-02"
text = "انا عايزك انت يا شاعر اترض على سؤالى امانه عليك تن خايف على مصر ولا كلام عشان تشهر وبس<br />يعنى انت لو شايف مصلحة مصر مع البرادعى حاطيط اميلك فيه قوى يا خوى ما يمكن يخربها ويقعد على تلها ولا ايه .<br />يعنى هو البرادعى معشش فى مصر ولا شافها كيه قايله يبقى ازاى هيحكم بالعدل .<br />ماشى انا معاك انى مبارك وعيله مزودينه شويه بس على الاقل احنا فى امان ولا ايه يا عم الشاعر انا من اكتر الناس الى بسمعلك بس انت زوتها بردو لما جيت وقفت مع البرادعى<br />انت لما كنت مع نفسك ضد مبارك وعياله .مقولكش انت كونت ىايه فى نظرى بس يعنى عايز تجيب واحد غريب يحط رجله فوق رقبتنا لالا يعنى لالا<br />احنا امبارك وعرفينا لكن ده انت تعرفه منين انه هيحكم بالعدل .وانت واقف معاه وبسانده واعمل حسبك انى فى ناس بتحبك انت شخصيا يا شاعر ولما بيشوفو الى بيحبو بيايد واحد اكيد هايدوه منغير معيرفو حاجه عليه .<br />ولو كلامى غلط ابعتلى وقولى انت غلط . فى مثل مصرى بيقول اى نعرفوه احسن من واحد غريب منعرفوهش ونمسكوه رقبتنا ولا ايه"
archived = "2010-03-06"
capture_url = "https://web.archive.org/web/20100306003927/http://www.20at.com:80/masr/interviews/15476-2010-02-24-17-14-47.html"
