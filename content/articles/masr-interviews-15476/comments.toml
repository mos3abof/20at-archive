author = "أحمد عبدالوهاب"
posted = "2010-02-28"
text = "استـــدراك:<br />معذرة هذا التعليق ارتبط معي بحلقة اللسبت27/2/2010. في برنامج العاشرة مساءً وكان الشاعر عبدالرحمن يوسف والمناضل العظيم الدكتور جورج . و منتظر مع المنتظرين حالة التغيير(رئيس حزب الوفد الدكتور محمود أباظة). وواحد تاني اللي كل شوية وجع رأسنا أنا أستاذ علوم سياسية أنا بكلمك كأستاذ علوم سياسية أنا دكتور في السياسة…المغلول بأنه لن يكون له مكان تحت الشمس ويبحث عن أي طريق أو مبرر من النجاة لكن هيهات سبق السيف العدل يا جوجو , وسواء جاهد أو لم يجاهد فإلى مزبلة التاريخ, ولن تعود يــــــــــــــ ا جـــ هـــــ ا د عــ و د ة.<br />ورسالة له شخصيا : خلي حزبك ينفعك . صعبان علي والله , زمانه في هذا الوقت داخل على بابا بتاعه جيمي وحيسمع ما يكره و حاجات تانية يعيني . أصله لما بيتكلم كل مايحب يكحلها يعميها بعد الضربة القاضية اللي خذها من أول لحظة و ما عرفشي يجمع بعدها كلمتين , الله يعينه على اللي حيحصله من باباته. جيمي"
archived = "2010-03-06"
capture_url = "https://web.archive.org/web/20100306003927/http://www.20at.com:80/masr/interviews/15476-2010-02-24-17-14-47.html"

[[comments]]
