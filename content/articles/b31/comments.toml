[[comments]]
order = 12
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-19"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134725/http://www.20at.com/article2.php?sid=31"

[[comments]]
order = 13
subject = "تجاهل...لا ضرب"
author = "عقل"
posted = "2006-10-23"
text = "بالنسبة للفتيات المصريات ، الضرب ماينفعش معاهم ، لنك لو ضربتها هايحصل حاجة من التلاتة ، ياهتروح فيها السجن ، يا واحد من أهلها هايروح فيك السجن ، ياهى نفسها هاتروح فيك السجن...ومافيش حاجة هاتتحل...<br />أحسن حاجة انك تتجاهلها تماما ، تحسسها انها مش موجودة أصلا لما تضايق منها ، هى حاجة صعبة جدا ، يعنى عشان الواحد يسيطر على أعصابه ، بس نتيجتها فعالة بشكل جامد طحن...تجاهلها تماما ، رد عليها ردود بايخة ، انزل قابل صحابك و اسهر معاهم و ماتردش على موبايلك لو كلمتك ، كأنك لسة عازب ، افترض تماما انك عايش لوحدك...<br />هما كام يوم..وهاتلقى النتيجة برضه حاجة من التلاتة ، ياإما انهيار عصبى ، يا إما ثورة عارمة تقابلها بالمزيد من التجاهل ، ياإما اعتذار عاقل و محاولة للصلح..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134725/http://www.20at.com/article2.php?sid=31"
