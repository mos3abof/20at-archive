[[comments]]
order = 9
subject = "كل البنات عم يكذبوا"
author = "ليندا"
posted = "2006-06-12"
text = "لما بتكون البنت متأكة أنو الشب بموت فيها و هي ما بتستغني عنو بصير ضرب الحبيب زبيب وأنا لما بيضربني خطيبي يلي كان يضربني حتى قبل الخطبه ,كنت ضل عم اعتذر منو ليسامحني لأني بعرف انو بيضربني لأن بحبني و ما بزعل منو و صرت هلأبخاف من زعله أكتر. بس ولا مرة ضربني قدام حدا.<br />و على فكرة كل البنات بحبو يضربهم حبيبهم بس بيخجلوا يقولوا.<br />بس لمل بيضربني خطيبي اذا شافني مع حدا مانعني سلم عليه مو أحسن ما يتركني؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134725/http://www.20at.com/article2.php?sid=31"

[[comments]]
