subject = "ضرب يعني عدم احترام"
author = "bobaa"
posted = "2006-07-25"
text = "اعتقد ان الشخص الذي يستطيع ان يرفع يده على من يحب سواء كان هذا الشخص هو الحبيب او الحبيبة يكون قد فقد احترامه وحبه له فالضرب وان كان على سبيل المزاح لا يعبر سوى عن قلة احترام الاخر لك وهذا ما يجب الا يرضى به اي شخص وان يضع الحدود من البداية هذا رأيي وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134725/http://www.20at.com/article2.php?sid=31"

