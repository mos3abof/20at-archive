subject = "الضرب"
author = "لي لي"
posted = "2006-03-09"
text = "لو علمتم ماهيه الحب لعرفتم ان الحب يسوي الخلافات واي احساس بلغضب ليتني استطيع ان اصف ما يكون او ما هو كل ما استطيع ان اقول هو ان الحب شعور يمتلك الروح حتي لا تستطيع الا ان تتنفسه يملا الروح بلسكينه والشعور بلامان فلو لم يقوم الحب علي الاحترام المتبادل فلا يمكن ان يكون هذاحب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134725/http://www.20at.com/article2.php?sid=31"

[[comments]]
order = 6
subject = "لا"
author = "dark angel"
posted = "2006-03-25"
text = "انا بحى الاستاذة رغده على الموضوع هو النت طرحتى موضوع مهم جدا بس فى ردود ناس كتير غبيه طبعا دى حريه شخصية وكمان ايه اللى دخل عمرو خالد فى الموضوع والمنتقد واللى مش منتقد صراحة دى حاجة تخنق<br />وكمان انا عن نفسى فى موضوع الضرب ده لو فكر انه يضربنى بس هايلاقى نفسه فى مستشفى ومش قادر يقوم كمان<br />انا برفض الرفض التام الكرامه جزء من الحب بس لما توصل الموضوع للضرب لا يترمى فى الزبالة هو بس كرماتى اهم حاجة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134725/http://www.20at.com/article2.php?sid=31"

