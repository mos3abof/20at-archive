[[comments]]
order = 15
subject = "حتي موضع الفكرة الواحدة..... بيقفله"
author = "aroundu_4)Towards Light("
posted = "2006-04-07"
text = "فعليك أن تدلف من باب الاستـقامة إذن وبابها المحراب .<br />كلما قرأت تلك الجملة زدت عشقا للمسجد وترابه<br />الحقيقة ونحن في عصر الميمونة في بلد المحروسة تقفل المساجد كما تقفل صناديق الإنتخابات..<br />وكأن المساجد وما فيها من دروس ومواعظ لا تفرز إلا التطرف<br />والإرهاب والجماعات المختلفة ...<br />أتمني أن يفكر كل مسئول ولو للحظة يتدبر فيها الآية:<br />{ ومن أظلم ممن منع مساجد الله أن يذكر فيها اسمه وسعى في خرابها أولئك ما كان لهم أن يدخلوها إلا خائفين لهم في الدنيا خزيٌ ولهم في الآخرة عذاب عظيم } (البقرة:114) .<br />وأذكر لكم ما قاله الحسن بن علي بن أبي طالب رضي الله عنهما فقال :<br />\" من أدام الاختلاف إلى المسجد أصاب ثماني خصال :<br />آية محكمة<br />و أخاً مستفاداً<br />و علماً مستطرفاً<br />و رحمة منتظرة<br />وكلمة تدله على هدى ، أو تردعه عن ردى . وترك الذنوب حياء ، أو خشية \"<br />فأين نحن من هذا .........<br />راسلنا علي :<br />http://groups.yahoo.com/group/aroundu_4"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145454/http://www.20at.com/article2.php?sid=665"

[[comments]]
order = 16
subject = "اللي يتخض..نجيبله طاسة الخضه"
author = "سوسة المفروسة"
posted = "2006-04-07"
text = "لا اله الا الله يا اخ انت و هو خضة ايه اللي بتتخضها لما بتسمع الادان؟؟ده انت لو بتتخض صحيح يبقى ربنا بيحبك و عايزك تقوم تصلي فرض ربنا الدور والباقي ع اللي بيفضل نايم و مابيقومش و لا بيسمع الادان حتى و دول هما الغالبية العظمى..يا بخت اللي بيتخضوا و يقوموا يصلوا لان ربنا لو بيحب بني ادم بيهيالوا الظروف عشلن يؤدي طاعته<br />و بعدين المرضى و كبار السن اللي انت بتقول عليهم دول ربنا اداهم رخصة يصلوا في مكانهم او حتى بعنيهم لكن ربنا مارفعش من عليهم فرض الصلاة في وقتها..الفجر ده احد الفروض الخمسة اللي لازم يتصلى في معاده يعني قبل الشروق..و اللي بيستنوا لما بيصحوا الصبح و يصلوه بيبقى قضاء و بكده بيضيعوا احد الفروض<br />و بعدين المرضى اولى انهم يحافظوا ع الصلوات عل الله يشفيهم...و كبار السن اولى واولى ماحدش عايز يقابل ربنا و هو مضيع فروضه<br />اما بالنسبة للمسؤلين اللي عايزين يغلقوا المساجد و يمنعوا الدروس و الدان فربنا رد عليهم من فوق سبع سماوات<br />{ ومن أظلم ممن منع مساجد الله أن يذكر فيها اسمه وسعى في خرابها أولئك ما كان لهم أن يدخلوها إلا خائفين لهم في الدنيا خزيٌ ولهم في الآخرة عذاب عظيم } (البقرة:114) ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145454/http://www.20at.com/article2.php?sid=665"

