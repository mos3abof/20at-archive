text = "واللة انا مع توحيد الاذان<br />وهذا هو الفرق الكتير كبير بيننا نحنا الفلسطينيون وبينكن المصريون<br />كل شى عنكم بيصير من ناحية التعصب فقط<br />تنظرو لكل الامور بناحية التعصب فقط لكن لما هيك ؟<br />لما مايصير معكم عقل تفهمو فية وتعقلو الامور جيدا<br />ايش عم يحدث لو تم توحيد الاذان سيصبح هناك نظام كتير كبير"
