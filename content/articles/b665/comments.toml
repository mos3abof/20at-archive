text = "الكاتبة مسطولة لأن الدكتور محمد حبش هو من قاوم هذه الظاهرة وليس من أمر بها<br />الدكتور محمد حبش ليس وزيراً للأوقاف ولا مديراً لها بل هو عضو في البرلمان وهو يطالب بتطبيق الإسلام وليس العكس"
