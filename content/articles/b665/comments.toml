[[comments]]
order = 4
subject = "مجرد رأي"
author = "أنا مش مصدقة نفسي!!معقول مسلمين اللي بيقولوا كده"
posted = "2006-04-06"
text = "تحضر ايه ده اللي بتتكلموا عليه..معقول أذان الفجر بقى ضد التحضر..بقى اذان الفجر اللي مبيقعدش دقيقة ..و بيقول الله اكبر ده ينافي التحضر..و الدي جي اللي شغال للصبح بيقول كلام سافل ..ده تحضر؟!<br />والله اللي اعرفه ان ربنا مأمرناش بشيء غلط أو ضار ..فالجميع مطلوب منهم بمجرد سماعهم للآذان انهم يقوموا يصلواالفجر ولو هيزحفوا ..لكن معلشاصلنا نمنا على صوت نانسي و على صورة هيفاء ..فبقى صوت الاذان صعب علينا<br />لو هتكلم يبقى نطلب بس اختيار ناس معينة صوتها غير منفر علشان يأذنوا ..سواءفيالفجر أو غيره ..لكن الله يكرمكم بلاش المصيبة تيجي منكم<br />لو مش عايزين تصلوا الفجر متصلوش -ربنا يهديكم- لكن متعجزوش اللي حواليكم ونيموهم معاكو بحجة التحضر<br />نااااااااااموا في التحضر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145454/http://www.20at.com/article2.php?sid=665"

[[comments]]
order = 5
subject = "الخيبة التقيله"
author = "عبدالله مفتاح"
posted = "2006-04-06"
text = "تتمثل الخيبه التقيله اعزائي في ان يقول شخص كلام اقل ما يوصف بانه فارغ ويكون متقمصا دور الناصح<br />الناس بتقوم مخضوضه؟ لماذا بتتخض الناس؟<br />اظن ان المريض وكبير السن سيسعدون بسماع الاذان ولن (يتخضوا)<br />يتخضوا مرة واحده ليه؟ ده اذان<br />والناس فضلت لمدة قرن مخضوضه وساكته؟<br />ومرة واحده كده بقا الاذان تقيل والناس كبرت والناس مرضت ولازم منزعجهمش بالاذان؟<br />ده حتى عيب اننا نقول ان الاذان مصدر ازعاج ايا كان المؤذن<br />فعلا خيبتهم سوبر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145454/http://www.20at.com/article2.php?sid=665"

[[comments]]
order = 6
subject = "تحضر؟؟؟؟؟؟؟"
author = "فارس النيل"
posted = "2006-04-06"
text = "وامصيبتاااااااااااااه<br />هل اصبح فى عرفكم اخراس صوت الحق تحضر؟؟؟<br />هل اصبح فى عرفكم حى على الصلاه تخلف؟؟<br />هل وصل بكم الحال يا ابناء امه محمد ان تنفروا من نداء الصلاه؟<br />بالله عليكم ماذا تنتظرون؟؟؟؟؟؟<br />والله انها لطامه كبرى<br />وامصيبتااااااااااه<br />وا اسفااااااااااه<br />فليذهب تحضركم الا الجحيم<br />فلم يبقى لنا الا ديننا نغيره بدعوى التحضر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145454/http://www.20at.com/article2.php?sid=665"

[[comments]]
order = 7
subject = "وقت الفجر بداية الحيوية ونشاظ الجسم"
author = "ام محمد"
posted = "2006-04-06"
text = "ان لله وان اليه راجعون ياجماعة المسلمين الله يهديكم بقى علماء الصحه في الغرب يدعون الناس لنوم مبكرالكي يستيقظوا مبكرا في توقيت الفجر حيث اثبتت الابحاث العلميه ان جسم الانسان تبدأحيويته ونشاطه ويبدأيوم جديد ابتدا من وقت الفجر وايضا الساعه البيلوجية للانسان يبدا النهار فيها من الفجرونروح احنا بعد ده كلو نمنع الاذان اللي والله صحةجسمنا مرتبطه بها سواء شاب او طفل اوعجوز والله هذا من الجنون بل ان الاذان بمثابة منبه صحي مجاني للجميع ويكفي انه ذكر الله \"الا بذكر الله تطمئن القلوب\" والاكثر من كده ان وقت الفجر مهم لصحة النفسية التي يعاني منها الكثير.والمصيبة ان البعض بيقول كفاية تخلف هو فغلا تخلف ولكن بسبب ترك الاذان.وكفى بالله حسيبا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145454/http://www.20at.com/article2.php?sid=665"

