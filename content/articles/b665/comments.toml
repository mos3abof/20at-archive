text = "ليس لتوحيد الآذان بمصر في الوقت الحاضر ضرورةخصوصا أن ذلك الأمر سيتكلف آلاف الجنيهات بينما يعيش معظم الشعب المصري تحت خط الفقر ويعاني من أعباء زيادة أسعار السلع والخدمات وعم قدرة الكثيرين من الحصول على الضروريات وكان أجدر بالمسؤلين توجيه تلك الأموال في التخفيف عن غير القادرين"
