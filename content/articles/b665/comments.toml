text = "بعد الحاله اللى ال اليها الدين على يد بعض الدعاه اللى بدأوا يبيحو ما لا يباح زى مساله نسب ابن الزنا للاب مش هستغرب لما يطلع شيخ جليل يقول لا للاذان عبر مكبر الصوت و لا يقول اغلاق المسجد بعد الصلاه<br />و الله يا جماعه دا فكرنى بمره فوجئنا بحد فى شا رعنا كان اشتكى المسجد لان المايك صوته بيبقى عالى الفجر<br />و اتجهت الشكوك كلها لواحد جارنا مسيحى و اتضح ان احد المسلمين هو اللى عملها<br />بقول للدعاه بلاش تيجى منكو<br />حراام"
