subject = "ربنا يحمي الإسلام"
author = "هاني ضوَّه"
posted = "2006-04-08"
text = "سبحان الله، أمر عجيب فعلاً لكن يا جماعة مش لازم نعتبر إن الراجل ده متحدث باسم الحكومة السورية وده باين في كلامة، أنا فاكر لحد سنة فاتت كنت بسمع الآذان في جميع أوقاتة وكانوا في دمشق وحلب بعد آذان الفجر يصلون على سيدنا النبي صلَّى الله عليه وآله وسلم في مكبرات الصوت حتي الإقامة، وأظن أن هذا الأمر مستمر حتي الآن، لكن لو حدث المنع فعلاً تبقي كارثة.<br />أما بالنسبة لمصر، فحكاية منع الآذان دي ش موجودة الآن يرفع في جميع الأوقات في مكبرات الصوت، لكن فعلاً في السنوات الأخيرة بدأو يغلقوا بعض - وليس كل - المساجد بعص الصلوات خاصة بعد صلاة العشاء وبعد صلاة الفجر وذلك لأسباب أمنية طبعاً كلكم تعرفوها لأن بعض المساجد كان بيستغلهاالجماعات المتطرفة لعقد اجماعتهم فيها.<br />أما مسألة توحيد الآذان فأنا أقتنعت مؤخراً بضرورة مناقشتها خاصة بعد أن سمعت الكثير من الأصوات -الغير جميلة- أثناء رفع آذانها عبر مكبرات الصوت سبحان الله أصوات لا توصف.<br />ربنا يحفظ مصر وبلاد المسلمين من كل سوء ومن كل فكر مغلوط، ويهدي شيوخ السلطة ويحفنا من فتاويهم.<br />هاني ضوَّه<br />صحفي مصري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145454/http://www.20at.com/article2.php?sid=665"

[[comments]]
order = 21
subject = "إنا لله و إنا إليه راجعون"
author = "مناضل أنترنتى قديم"
posted = "2006-04-08"
text = "السلام عليكم و رحمة الله و بركاته<br />لا حول و لا قوة إلا بالله<br />اللهم أهد كل عاص و ضال و أنا أولهم يارب<br />ماهذا الكلام أأصبح الاذان مزعج و منفر ده احنا عايزين الناس تصحى على الأذان علشان تصلى الفجر هذه الحقيقه الذى وعاها أعدائنا وغفلناها نحن<br />نحن دين مخالفة رغبات النفس فى كل عباداتنا نقول للنفس لا نستيقظ من عز نومنا لنصف أقدامنا بين يدى ربنا ليباهى بنا ملائكته<br />فى عز الحر نمتنع عن الطعام و الشراب أرضاء لله<br />ندفع من اموالنا التى جمعناها بفضل الله وحده بعد عناء ومجهود لنغنى الفقراء<br />من لا يفهم هذا الكلام يحتاج لوقفه مع نفسه<br />أأصبح نداء أرحنا بها يا بلال يزعج الناس كان حبيبنا رسو ل الله صلى الله عليه و على أله و صحبه و سلم إذا جاء وقت الصلاه يقول لبلال بن رباح رضى الله عنه أرحنا بها يا بلال أى أذن يا بلال للصلاه<br />أذكر أن جولدا مائير رئيسة وزراء الكيان الصهيونى سئلت فى مؤتمر صحفى و قيل لها أن المسلمين يزعمون أنهم سوف ينتصرون على اليهود و أن الحجر و الشجر سوف ينطقان يا مسلم ورائى يهودى تعالى فاقتله<br />فردت وقالت نعم هذا سوف يحدث ولكن حينما يكون عدد المصلين فى صلاة الفجر مثل عدد المصلين فى صلاة الجمعه<br />هذه حقائق أدركها أعدائناونحن بجهلنا غالبا و أحيانا بغبائنا ونادرا بتخطيطهم سهلنا لهم الأمور<br />و إلى دعاة ان المساجد أصبحت بؤر للأرهاب نعم هذا حدث والحكومات هى السبب حينما جعلت الدعاه يتخلون عن دورهم الأصلاحى و أصبحت المساجد خاليه من الدعاه<br />و أصبحت الأوضاع مقلوبه و أصبح كل من أراد ان يقول شىء يقوله و من هنا الكارثه أن يوكل الأمر إلى غير أهله<br />أذكر قصة الأذان وكانت رؤيا رأها صاحبى لاتسعفنى الذاكره بأسمه رأى فى المنام صيغة الأذان فقصها على النبى صلى الله عليه و على أله و صحبه وسلم فقال له النبى صلى الله<br />عليه و على اله و صحبه و سلم مر بها بلال فانه اندى منك صوت فلا حجة لكم الأن مروا بالأذان من هو أندى صوت و لا تتحجوا بأن الأصوات منفره<br />و إلى حكوماتنا الرشيده أذكر كلمات للداعيه الواعى أستاذ عمرو خالد فى برنامجه الرمضانى الرائع على خطى الحبيب و قال فيهافى معناه<br />أن تجفيف المنابع و يقصد هنا اغلاق المساجد لن يحل المشكله بل سيزيد التطرف بل ينبغى على الحكومات أن تعد الدعاه جيدا لكى يقوموا بدورهم فى المساجد<br />أما أنت يا من أختارك ربى لصلاة الفجر فطوبى لك و هنيئا لك فاعلم انك ممن أصطفاهم الله فلولا انك مخلص لله عزوجل لما أختارك الله والله وددت ان يصرخ احدهم ببوق فى أذنى فيوقظنى وقت أذان الفجر لكى أصلى قبل أن ينفخ أسرافيل فى البوق ووقتها لن ينفع إلا من أتى الله بقلب سليم<br />اتقوا الله عباد الله ودعوا عنكم الكسل و الضعف و الوهن وانت يا من تحب النوم اعلم انك لم تأتى الدنيا لتنام و انما جئت لتجد فيها و تعبد ربك فلا راحة فى الدنياو فىالقبر سوف تنام حتى يملأ التراب فاهك<br />أخى الكريم يا من كتبت تعليق لا يرضى الله و لا ورسوله أخلع عنك هذا الرداء فهو لا يليق بمسلم و تب إلى الله ان الله يغفر الذنوب جميعا أنه هو الغفور الرحيم<br />أستغفر الله العظيم و أتوب إليه عدد خلقه و زنة عرشه و رضاء نفسه ومداد كلماته<br />وجزاكم الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145454/http://www.20at.com/article2.php?sid=665"

