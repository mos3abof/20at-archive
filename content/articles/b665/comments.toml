[[comments]]
order = 19
subject = "ربنا يحمي الإسلام"
author = "هاني ضوَّه"
posted = "2006-04-08"
text = "بسم الله الرحم الرحيم<br />سبحان الله، أمر عجيب فعلاً لكن يا جماعة مش لازم نعتبر إن الراجل ده متحدث باسم الحكومة السورية وده باين في كلامة، أنا فاكل لحد سنة فاتت كنت بسمع الآذان في جميع أوقاتة وكانوا في دمشق وحلب بعد آذان الفجر يصلون على سيدنا النبي صلَّى الله عليخ وآله وسلم في مكبرات الصوت حتي الإقامة، وأظن أن هذا الأمر مستمر حتي الآن، لكن لو حدث المنع فعلاً تبقي كارثة.<br />أما بالنسبة لمصر، فحكاية منع الآذان دي ش موجودة الآان يرفع في جميع الأوقات في مكبرات الصوت، لم فعلاً في السنوات الأخيرة بدأو يغلقوا بعض - وليس كل - المساجد بعص الصلوات خاصة بعد صلاة العشاء وبعد صلاة الفجر وذلك لأسباب أمنية طبعاً كلكم تعرفوها لأن بعض المساجد كان بيستغلهاالجماعات المتطرفة لعقد اجماعتهم فيها.<br />أما مسألة توحيد الآذان فأنا أقتنعت مؤخراً بضرورة مناقشتها خاصة بعد أن سمعت الكثير من الأصوات -الغير جميلة- أثناء رفع آذانها عبر مكبرات الصوت سبحان الله أصوات لا توصف.<br />ربنا يحفظ مصر وبلاد المسلمين من كل سوء ومن كل فكر مغلوط، ويهدي شيوخ السلطة ويحفنا من فتاويهم.<br />هاني ضوَّه<br />صحفي مصري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145454/http://www.20at.com/article2.php?sid=665"

[[comments]]
