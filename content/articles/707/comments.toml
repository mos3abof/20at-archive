text = "مين مبيحبش الكورة؟؟<br />وحتى اللي مبيحبهاش أكيد بيموت في حاجة اسمها كاس العالم... أنا بفكر أجيب ART في بيتنا وأقلبه كافيه أكيد حكسب ذهب... بس على شرط أخلي كل الناس تشجع البرازيل وممكن أوزع عليهم الأعلام هدية... وحظ سعيد للفرق...<br />بالمناسبة.. حلوة حكاية البث المباشر دي.. أكيد حتابعها."
