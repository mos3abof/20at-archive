subject = "النجم حسسسسسسسسام"
author = "زملكااااوي يا ابو تريكة"
posted = "2006-08-05"
text = "بعد ان تردد داخل اروقة الزمالك عن نية بعض اعضاء المجلس التعاقد مع حسام حسن للعودة لصفوف الزمالك حدث انقسام كبير داخل مجلس ادارة النادى و بين الاعضاء العاملين بالنادي وجماهير القافلة البيضاء الجميع اتفقوا على ان حسام لاعب اسطورى وحقق مالم يحققه اي نجم اخر ولكن يرى البعض ان حسام الذي تجاوز الاربعين لن يقدم جديد باستمراره لموسم اخر فى الملاعب ثم اذا انتقل حسام حسن للزمالك و لعب كرأس حربة هل سيقبل ان يجلس بديلا ويلعب لدقائق معدودة كبديل لمصطفى جعفر او عبد الحليم على او وليد صلاح عبد اللطيف او عمرو ذكى او جمال حمزة وهل سيضمن ان يحجز لنفسة مكان اساسي فى التشكيلة كما يرى البعض ان الفريق لا يحتاج الى مهاجم بل يحتاج و بشكل ضروري الى مساك و لاعب وسط مدافع او حارس مرمى و الاماكن المتبقية محدودة لذا فهم يتحفظون اما الفريق الاخر فيرى فى ان وجود حسام ضمن قائمة الزمالك اكبر تكريم لة و لتاريخه .<br />كل الاخبار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114354/http://www.20at.com/article2.php?sid=896"

