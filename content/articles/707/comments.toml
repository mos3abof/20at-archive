subject = "جاي لك يا كاس العالم"
author = "دي صبري"
posted = "2006-06-04"
text = "بجد خلاص أنا حتجنن ويوم الجمعة ده يجي، أنا مرتب لكل مباراة مع صحابي يا إما نشوفها في الكافيه أو القهوة أو في بيت واحد من اللي عندهم الإيه آر تيه... وحنديها بقى تشجيع للصبح وأكل وحلويات ولب وسوداني... وعلى العموم أنا عن نفسي حشجع الأرجنتين وسلم لي على توجو... مبروك الصفحة... ومستنيكم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114354/http://www.20at.com/article2.php?sid=896"

