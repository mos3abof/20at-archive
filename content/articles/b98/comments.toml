text = "انا بحب الشغل لانة بيبنى وجود وكيان لانسان وبينهى على الغرور والتفاخر لانى كول وقتك تكون عاوز تثبت لنفسك ولكل انسان انك قد عملك واتمنا انى اكون رجل اعمل لانى احب مسعدة الناس واتمنا انى اشتغل واكون مبلغ واشغل ناس كتير معاية بجد انا نفسى اكون حاجة كبير فى المجتمع"
