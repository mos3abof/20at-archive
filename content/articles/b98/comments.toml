[[comments]]
order = 3
subject = "ايوة لازم Break"
author = "هشام حمزة"
posted = "2005-12-19"
text = "انا مع اللي بيقول انه لازم يبقى فيه Break. بس يا ترى نعمل ايه في ال break ؟ ناكل او نشرب قهوة او نتمشى شوية ؟؟؟<br />ممكن لو حد غاوي مزيكا يشغلها . او لو حد بيحب يقرأ الجرايد شوف ايه الاخبار؟<br />او ممكن الواحد يعمل تليفونات ويطمن على صحابه وحبايبه.<br />مش ده اللي بيحصل.<br />اللي عايزكم تعرفوه ان الواحد ممكن يتعلم اكتر لما يحتك بكذا حياة. ومهارات الحياة واالتعامل مع الناس اهم حاجة دلوقتي . دي اللي ممكن ترفع من شأنك كأنسان قبل ما تكون ماكينة شغل اصلاً ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113032/http://www.20at.com/article2.php?sid=98"

[[comments]]
order = 4
subject = "موضوع مهم . . . بس"
author = "طارق مراد"
posted = "2005-12-24"
text = "الموضوع مهم جدا ، طبعا بالنسبة للناس اللي حياتهم مشغولة بالعمل على حساب حياتهم الشخصية ، بس أعتقد كان عايز مساحة أكتر للتعمق في الموضوع ، مع بيان للأمثلة لناس عندهم شغل كتير و إزاي قدروا يصلوا للتوازن المنشود ، لكن الموضوع بصفة عامة مهم جدا و محتاج أكتر من مقال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113032/http://www.20at.com/article2.php?sid=98"

[[comments]]
order = 5
subject = "تقديس العمل"
author = "محمصة"
posted = "2005-12-25"
text = "انا انظر الى العمل نظرة مختلفة فالانسان سوف يعيش عمر قصير و نحن كما تعرفون من الشعوب المتاخرة لذلك علينا العمل بجد و بشكل مفيد لكي نحاول الحاق بالركب و انا من خلال عملي ارى ان معظم الشباب لا يحب العمل و يميل الى الكسل بحجة عدم توفر العمل او عدم قدوم الفرصة المناسبة<br />نصيحة ارى بان يبدا الانسان باي عمل يتوفر له و يعمل بجد فسوف ييسر له الله الفرصة و العمل الكثير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113032/http://www.20at.com/article2.php?sid=98"

