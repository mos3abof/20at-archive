[[comments]]
order = 0
subject = "مستحيل بس ليه لا ياريت والله"
author = "محمود الفنان ( لقب )"
posted = "2005-12-15"
text = "اقتباس هيا.. ماذا تنتظر... اترك ما أنجزته في مكتبك فوراً وامنح نفسك فسحة من الوقت للخروج والترفيه..<br />فالحياة مليئة بأشياء مختلفة يمكنك أن تقوم أكثر من مجرد العمل<br />انا لو تركت مكتبى دلوقتى هاتحصل حاجات مش كويسة لانى شغال فى سيبر نت والسيبر مفتوح 24 ساعة 7 ايام فى الاسبوع مفيش اجازات فى العيد يعنى لو سيبت المكتب دلوقتى واتفرغت لمدة 4 ساعات على الاقل تانى يوم هابقى مرفود بالصلاتوا على النبى<br />هى عملية الراحة والاسترخاء على حسب العمل اللى الانسان يعمله يعنى ممكن شغل ممكن فى اى وقت يأخذ اجازة اربع ايام للاسترخاء<br />وفعلا فى مصر بسبب قلة العمل (البطالة) فالواحد بيحاول يسبت نفسه بكل جدية ( هارد واركير ) يعنى الواحد ما بيصدق يشم رائحة الشغل عايزين تريحه ده ( انت اكيد فى مصر ) ياراجل المهم الموقع ده بحبه اوووووووووى وشكرا على طرح الموضوع واكيد كل واحد ها يبقى ليه رأى ويتوافق مع ارئكم فى حل هذه المشكلة بس خلاص"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113032/http://www.20at.com/article2.php?sid=98"

