[[comments]]
order = 7
subject = "سمسمة"
author = "سارة"
posted = "2006-02-11"
text = "انا شايفة ان الكلام صح بس فعلا وحقيقى انا وقتى ضايع وحسة بفراغ زى اى شابة وشاب فى مصر وعشان كدة بيوجهوا فراغهم دة ويشغلوة بطريقة مش صح يعنى من الطرق المشهورة ليهم الحب وتشغيل عواطفهم مع انى شايفة انهم ممكن يشغلوها صح بحبهم للخلق البارىء بس نعمل اية للجهل وانا شايفة فعلا ان الحل المناسب بالفعل هو ان الواحد يوازن نفسة بين شغلة او دراستة وما بين حياتة الاجتماعية وانة يهتم فى نفس الوقت بالروحانيات ودة بيكون بحفظ القران وحضور المجالس والدروس الدينية ودة فى كل مكان واللى حجتة انة ما بيبعرفش مكان دروس ايها موجودة فى الدش فى كل وقت -وماشاء اللة على القنوات الجديدة اللى ظهرت زى قناة الرسالة وسمارت والناس والخير والفجر والمجد واقراء طبعا وكتير جداا وكلها برامج بنائة ربنا يكرمهم-وفى نفس الوقت لازم الانسان يكون لية خد<br />ف فى حياتة ويكون متعلق بالنهضة عشان كفاية بئة نوم وربنا المستعان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113032/http://www.20at.com/article2.php?sid=98"

