author = "دستور 1923"
posted = "2009-12-20"
text = "يا دكتور برادعى - احسن دستور وضع لمصر هو الدستور الذى كتب ووافق علية الشعب بعد ثورة 19 ايام سعد زغلول هو دستور سنة 1923 واى دستور بعدة باطل وكلام فارغ بتوع تفصيل المواد لتناسب المسخ الحاكم العسكرى اللى قاعد على دكة الحكم يلهط فيها هو واولادة ومراتة<br />رجعوا دستور سعد باشا زغلول ايام 1923<br />امريكا فيها دستور لا يتغير مع كل حاكم او رئيس<br />امريكا فيها دستور من 200 سنة والكل ملتزم بية"
archived = "2009-12-21"
