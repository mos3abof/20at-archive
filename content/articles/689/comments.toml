[[comments]]
order = 10
subject = "حرام"
author = "مسلم عربي"
posted = "2006-03-21"
text = "السلام عليكم<br />أولا أنا مغربي و الذي دفعني للكتابة هو تعليقين و أستطيع القول أنهما سخيفين للمغربيين اللذان قالا ان المغرب أكثر تحضر و كذا هذا هراء لنكن واقعيين جميع العرب في الهوا سوا حى الخليجيين الاغنياء معنا و السبب لا زلنا نعتمد على الاخر ان يطعمنا أخي أنا مغربي و جامعي ,اعرف مايحدث للشباب المغربي همه الوحيد في الهجرة الى الخارج (الحريك) ولو كانت غير شرعية فأين هو التقدم حبيبي ولازلنا نتقاتل في ما بيننا على الكرة (أن راجوي و أنت ويدادي وهذاك فاروي)المشكل كما قال الاخوة في تفكير المقيد و التبعية وكما قال سيدنا عمر بن الخطاب نحن قوم أعزنا الله بالاسلام فإذا ابتغينا العزة بغيره أذلنا الله وماجاء هذا الدين الا ليجعلنا اخوة و ينزع مناالعنصرة والتفرقة (أنا مغربي و أنت مصري أو أنا داخلي و أنت ريفي) و يا صاحب الحرية أتعتقد الحرية في الزنا والسكر والانحلال والفساد لا والله ولكنها باتقاء الله و اتباع سنة نبيه(لا شيوخ ولا جماعات متطرفة) و سنة الخلافاء الراشدين و العمل الجاد. وو تفكير فحلول منطقية و اتباع الغرب في عملهم و خطيطهم و علمهم وليس في انحلالهم الاخلاقي. كما قال الاحد الاشخاص: نحن نتبع الغرب من السادسة مساءا فما فوق و ايام العطل ولانتبعهم في عملهم الجاد. وفي الختام أرجوا أننزع منا هذه النبرة الكاذبة تبعية القبلية و التفاف للحصول على حلول عملية و اتباع السنة وكتاب الله و ليس مجموعة من الجماعات.<br />والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114114/http://www.20at.com/article2.php?sid=522"

