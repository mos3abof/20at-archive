posted = "2006-03-05"
text = "حاب حكى ان المغرب افضل دولة عربية وبامثل فانها تحوى افضل جامعة عربية اطلاقا<br />وما فى واجب ان تكن مقارننة من الاصل<br />علاش ؟ لان ما بتكن منكن فينا مقارنة<br />نحن افضل نحن اكثر تحضرا نحن مانميل اليكن بل نميل للعالم الغربى المتحضر<br />لكن شكرا"
