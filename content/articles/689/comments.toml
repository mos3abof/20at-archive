author = "جمال من خنيفرة بالمغرب"
posted = "2006-05-10"
text = "نعم الحصاد...كلنا يجني ما زرعه فمنا الرابح ومنا الخاسر ... كفانا كلاما وتعاليق معلقة في فضاء بلا أوكسجين ..لن يتغير شيء لا من داخل الساحات الجامعية ولا من خارجها ولا حتى أدنا شيء إن لم نغير هممنا وتصوراتنا ونغير أيضا نفوسنا..لا يهمنا الأن أي نوع من المواضيع يتناول طلبة المغرب هنا..بل المهم كيف نغير وماهو الحل إزاء الظلم المفضوح . ظلم السكن ..ظلم المنحة التي أصبحت محنة لدا الطلبة..ظلم البطالة ...ظلم......<br />\"لا يغير الله ما بقوم حتى يغيروا ما بأنفسهم\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114114/http://www.20at.com/article2.php?sid=522"

