subject = "مسلمه"
author = "هكذا حال طلبه الجامعات فى مصر ايضا فانا خريجه جديده من كليه التجاره والحقيقه انى لم اجد فى احاديث البنات الا الحديث عن الموضه والحب والجمال والشباب والجنس\"فى الاحاديث السريه\""
posted = "2006-03-05"
text = "فقد اصبح فكر البنات معظم منحصرا فى هذه الاشياء وذلك فى جميع المستويات سواء الطبقات الغنيه \"بالمال طبعاوكذلك التعليم\"او المتوسطه او الفقيره والكادحه<br />فهذا هو حصاد الغزو الثقافى الذى اراه قد جنى افضل ثماره الان"
