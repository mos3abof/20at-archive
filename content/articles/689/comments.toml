author = "نصر الله"
posted = "2006-05-12"
text = "يا عرب يا مسلمين ا تؤمنون بالغيب فالله قد بعث برؤا الى عباده المخلصين يخبرهم فيها ان 2006 سنة فتح للمسلمين انطلاقا من المغرب ان شاء الله فاتحدوا يا عرب لكن اولا يجب ان نتربى تربية دينية على المنهاج النبوي الدي ربى به الصحابة رضوان الله عليهم. فبشرى لنا بجماعة العدل و الاحسان التي تتبع هدا النهج في تربية الشعب فانضموا الينا و لكن قبل دلك تعرفوا علينا هدا موقعناwww.aljamaa.com"
archived = "2006-11-02"
