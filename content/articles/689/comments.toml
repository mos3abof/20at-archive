text = "السلام عليكم ورحمة الله وبركاته<br />حقا ما دكره الاخ الكريم في مقالته نتمنى فعلا عودة ايام النضال من اجل الحق مرة اخرى لا من اجل مزاح و التهريج كما يحدث اليوم مثلا في الساحلت الجامعية من مصخرة ولا مسؤولية<br />والسلام عليكم"
