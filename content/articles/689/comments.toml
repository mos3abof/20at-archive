subject = "(للاخ اللى فوق ) واضح التحضر"
author = "بستانى"
posted = "2006-03-05"
text = "واضح انك شايف ان قمة التحضر ف العالم الغربى<br />وبتتكلم( احنا اكتر منكم تحضر)كان العرب ناس تانين موش منهم المغربة طيب ليه بتوجهلنا الكلام<br />وبعدين بتتكلم كان العروبة وصمةعار<br />دا غير ان الكلام اللى ف المقال حقيقى<br />وبعدين بص ع الاتحاد الاوروبىلما انت عايز تعمل زى الغرب ياللى عايز تطلع من الاتحاد العربى<br />دا غير ان الكلام اللى ف المقال حاصل فعلا<br />وبتتكلم (احنا اكثر منكم تحضر)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114114/http://www.20at.com/article2.php?sid=522"

[[comments]]
order = 4
subject = "جيل الديكتاتورية والقمعية"
author = "مسلم"
posted = "2006-03-05"
text = "هذا الجيل ولد وترعرع في عهد الديكتاتوربة والقمعية ، فلم يتنسم نسائم الحرية ، فنشأ هزيلا ضعيفا ، لايتحمل مسؤولية ، ولا يعرف جدية.<br />وليت شعري ذلك فحسب ، بل زيادة على غياب الحريات وجو القمع ، شغل بسفاسف الامور من كرة وغناء ورقص ، فماذا تتوقع من هذا الجيل؟<br />يا من تدعون الى الاصلاح ، صلاح الامر في الحرية ، ولا تكون حرية الا بازالةالطواغيت (فليكن شعارنا زوال الطواغيت) ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114114/http://www.20at.com/article2.php?sid=522"

[[comments]]
order = 5
subject = "تقريبا الكل"
author = "انا طالبة في الجامعة الاسلامية بغزة وبما أن الجامعة بس بنات يعني تقريبا بناخد حريتنا في الكلام والضحك والمسخرة 00"
posted = "2006-03-05"
text = "هذا لا يمنع ان يكون هناك بعض النقاشات ولكن أغلبها تكون عن نظام الامتحانات وموعدها ومشاكلنا مع الاساتذة لانهم متشددين نوعا ما في اعطاء الدرجات 0<br />اما الموضة فللأمانة ما بنجيب سيرتها في الجامعة ولو فكرنا نحكي بمواضيع تانية بنحكي عن الاوضاع السياسيةلانها الاهم في الوضع الحالي بالنسبة النا وخصوصا في غزة .<br />واخيرا انا اوافق الاخ او الاخت الذي لمح الى وجود الكبت وهذا ما يجعل التفريغ في امور بعيدة عن شخصيات الشباب نوعا ما<br />لكم التحية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114114/http://www.20at.com/article2.php?sid=522"

[[comments]]
order = 6
subject = "التعليم شمال و يمين"
author = "أكرم"
posted = "2006-03-05"
text = "لا يهمني ما يحدث بداخل الجامعات من تفاصيل بقدر ما يهمني ما تفرزه هذه الجامعات للمجتمع من جيوش من العاطلين و الطلاب غير المؤهلين للعمل في الواقع الذي تفرضه سوق العمل فنحن في مصر عندنا الخريجين الجدد ( العشرة بقرش ) مما يؤدي الى لجوء اصحاب اعمال لعمل مناقصة للخريجين في مرتباتهم و كلنا نعلم انه الشاعر بيقول<br />و من يهن يهن الهوان عليه<br />ما لجرح بميت ايلام<br />و نرجع نتكلم عن التقدم و التأخر يا اخي المغربي كلنا في التخلف سواء و كلنا في الهم عراق<br />اما عن التحضر اللي بتدعيه فقولي سيادتك ليه حاملي الشهادات في المغرب بيلجأوا للانتحار الجماعي و ليه حلم الشباب العربي المغاربي ( من ليبيا الى المغرب ) الهجرة الى اوربا<br />و ليه حلم الشباب المصري انه يعمل بالخليج"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114114/http://www.20at.com/article2.php?sid=522"

[[comments]]
order = 7
subject = "انارة"
author = "يحيى الصحراوي"
posted = "2006-03-05"
text = "اول ما يلفت انتباه القارى الملم باوضاع الصراع السياسي و الاجتماعي بالمغرب عموما؛ و ما تعيشه الحركة الطلابية بهدا البلد خصوصا، هو المغالطة التي عمل صاحب المقال على تمريرها، حيث حاول الباس الحركة الطلابية عباءة التيارات الاصولية الغريبة عن الجامعة والتي دفعت دفعا الى المعترك الطلابي خدمة لاهداف قوى /عصابات متطرفة و فاشستية ارتكبت اشنع الجرائم في حق الظلبة والمناضلين و اقترفت ولا تازال الخيانات تلو الخيانات ضد اوطم و مناضليها، لقد حاول كاتب المقال ان يختصر مجمل تاريخ اوطم او على الاقل ان يبداه من حيث بدا دخول قوى الظلام والرجعية الى الجامعة هده القوى التي عمقت من ازمة الحركة الطلابية، بترويجها للفكر الخرافي و الانتهازي في اوساط الطلاب لتمنعهم بدلك من وعي طبيعة الصراع، و تقيله الى السماء حيث حاربت كل ما هو علمي و عقلاني و ديموقراطي و استبدلته بادبيات شيوخها, كما انها لا تزال وفية لنهج العنف و الترهيب ، اذ انها حملت على عاتقها مسؤولية اجثتاث اليسار الماركسي ون الجامعة و هو الجور الدي رسم لها بعناية، كما لا يجب نسيان اسايب العنف و الترهيب التي واكبت دخول هده العصابات الى الجامعة خصوصا طلبة ما يسمى ب العدل والاحسان، و تاريخهم ملىء بالجرائم ومن يجهل ذلك فليسال عن ضحاياهم من الشهداء و الجرحى داخل مواقع عديدة من : وجدة الى فاس و مكناس الة مراكش و اكادير و غيرها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114114/http://www.20at.com/article2.php?sid=522"

