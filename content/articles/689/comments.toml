[[comments]]
order = 25
subject = "مغربي من العاصمة الاقتصادية*الدار البيضاء"
author = "جمال اسلام.......المغرب"
posted = "2006-05-31"
text = "السلام عليكم<br />في الصراحة اخذني النقاش الذي كان عبارة عن تعليقات انا مغربي عربي وانا قوي ان كنت انتمي الى اخوتي العرب الشرقيين لاني مسلم والمسلم وجب عليه ان ينحاز الى المسلمين لكي تقوى شوكتنا بتجمعنا وحبنا لبعض فالمغربي هو عربي مثل مصري او سوري او فلسطيني او خليجي المهم والاهم اننا عرب فلانترك فراغا ليكون مساحة غنيمةجاهزة لليهود ليستغلو هذا الفراغ ليطرحو فيه الكره وهو كره بين العرب المسلمين وهذا ما يطمح له اليهود ان قرء احدهم هذه التعليقات التي يسيئ مسلم لاخيه المسلم سيقول اليهود واعداء الاسلام نلنا من القوم....!!!!<br />اخوتي في الله فالنقاش يجب ان يكون متحضر وهو ترجمان لحضارة الشخص فلسانك هودليل لشخصك.............<br />نحن المغاربة حقيقة متاثرين بالغرب والسبب في هجرة اغلب المغاربة بطيرقة غير شرعية هو ان المسافة بين المغرب واوروبا14كيلو متر يعني يمكنك ان تمشيها راجلا هي مسافة مغرية لكل انسان يعيش قرب بلد مثل المغرب....والهجرة هي غريزة في الخلق اجمع كل من على الارض يحب ان يهاجر لانه يسمى حب الاستطلاع<br />ومن ميزة المغاربة انهم عندما يهاجرون لاوروبا وعند رجوعهم لبلدهم المغرب فوالله اغلبهم يقولون جملة وهم متفقين عليها بغير تواطئ يقولون بان المغرب افضل بكثير من اغلب البلدان<br />وللاسف فالشباب المغربي يعيش في نعمة لايشعر بها الا بعد ان يترك بلده حينها يستبين له الفرق....هذه مجرد نبدة لاخواني العرب<br />المهم والاهم هو اننا عرب والاهم هو اننا مسلمين والاسلام لا يفرق بين عربي ولا عجمي الا بالايمان والايمان هو ميزان المسلم<br />دعو كل المقالات الكاذبة والاكاذيب التي تطرح الشحناء بين المسلمين واتبعو كلام رسول الله الذي قال عليه الصلاة والسلام(الخير في وفي امتي الى ان تقوم الساعة)الحديث<br />واقول لكم اخوتي المسلمين..في امان الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114114/http://www.20at.com/article2.php?sid=522"
