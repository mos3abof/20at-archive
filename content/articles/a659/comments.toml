[[comments]]
order = 28
subject = "هو ده رايى"
author = "حب الأول اننا نقرا الفاتحة على روح الراجل اللى يعتبر مات شهيد حتى ولو فى سريره"
text = "تانى حاجة عايز تعرف رأيى ارجع لموضوع المجند اللى شايف ان الجيش مالهوش لزوم وانت تعرف ان الشهيد عبد العاطى مات وشبع موت من زماااااااااااااان من ساعة ما احترفنا شرب الكوكا<br />كان امر الله لنا ان نعد لعدونا ما استطعنا من قوة ومن رباط الخيل لنرهبهم كان امرا عاديا موجها لناس آخرين<br />ربنا يلطف بينا<br />حزنتنا يا اخى والله على ايامنا اللى ما يعلم بيها الا ربنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145521/http://www.20at.com/article.php?sid=659"
