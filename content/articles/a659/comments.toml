subject = "وائل عباس"
text = "ماذا قال قتلة السادات:<br />- قال زعيم الجماعة الاسلامية في مصر عنه بعد ندم الجماعة على قتله : شهيداً مات في قتال الفتنة<br />- قال كرم زهدي احد من شاركوا في الاغتيال : نحسبه عند الله شهيدا<br />وقالت جيهان السادات: السلام اللي عمله لو ما كانش عمله كان زمان سيناء نضفها محتل إلى يومنا هذا بمستوطنات كثيرة جداً، وصعب إنك تشيلها، ما كانش أنور السادات استلم مصر محتلة أرضها، أنور السادات حرر مصر، ورجع ارضها<br />طبعا انتم فاهمين مين اللي بيعاني من المستوطنات دلوقتي !!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018182718/http://www.20at.com:80/article.php?sid=659"

