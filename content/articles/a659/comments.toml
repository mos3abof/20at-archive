[[comments]]
order = 27
subject = "وائل عباس"
text = "اعتماد خورشيد الله اعلم بيها<br />انا شخصيا ما قابلتهاش ولا شفتهاش<br />بس اكيد انت ادرى بما انك كتبت المقال باسمي !!!<br />كمان ها تجيب سيرة الناس في رمضان ؟؟؟<br />اللهم اني صائم ..."
archived = "2004-10-18"
