subject = "وائل عباس"
text = "قاتل السادات هو البطل ؟؟؟<br />يا مضحوك عليك من دول قزمة ارادت ان تقفز على الزعامة فكان امثالك بجهلهم لها مطية<br />هل قرأت عن صلح الحديبية ؟؟؟<br />هل قرأت عن صلاح الدين وريتشارد قلب الاسد ؟؟<br />هل قرأت عن قمة بغداد وبعدها قمة فاس<br />انت بتردد كلام بيقوله اسيادك زي الببغاء بدون وعي ***<br />ورحم الله السادات<br />الفاتحة يا كل من يقرأ هذا ...<br />*** تم حذف الكلمات التي وضع مكانها هذه العلامة لخروجها عن الآداب العامة"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018182718/http://www.20at.com:80/article.php?sid=659"

