posted = "2008-06-05"
text = "انا واحد من المعجبين بالكابتن زيزو ابن بلد المليون ونصف المليون شهيد . على كل حال اشكرك كباقي المحبين لك على الطريقة التي انهيت بها مشوارك الكروي لانك رجل والرجال مثلك قليلون."
