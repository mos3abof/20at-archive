subject = "الرياضه فى الجزئر وطموح الرياضيان وسياسة الدوله"
author = "العباسى"
posted = "2006-07-25"
text = "نحن نعلم ان الجزائر ام الرياضه فى الوطن العربى ولها نتائج عالميه وعربيه وافريقيه مشرفه فى الرياضه ولها تاريخ عريق ولااكن مايلفت الانتباه لمادا او ما سبب اغلااق الاحترف فى الانديه الاوربيه نحن من مشجعى نادى البليده الدى يلعب فيه الااعب النجم ابابكر ربيح نجم صغير له طموح كبير استدعاه نادى كان الفرنسى لكى يدخل مجموعة الاختبارات التى يتمنا كل لااعب قدم طوح ان يدخلها فجئه نجد هدا النجم تعرقله ايدى خفيه ماهو السبب نرجو الرد او التعليق عن هده القضيه"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011100058/http://worldcup2006.20at.com:80/article.php?sid=123"

