text = "انك يا زيدان موهبة نادرة وامثالك قليلون وتملك ضربات لا تصد ولا ترد ومشوارك حاقل بالانجازات وكنت رجل مقابلة -فرنسا. انجلترا- 2004 .ولن ينساك التاريخ ابدا........."
archived = "2008-10-11"
