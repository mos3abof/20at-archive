text = "نيك أختك ونيك أمك ياعبد العليم عبد الاحد الجندلي,امبين عليك إنك مالك رجال ياكلب ياحيوان وياحاسد,يدك فوق زب زيدان وفوق زب كل جزائري ياكلب ياحيوان,زيدان إبن الجزائر وهوا فخور بأصلوا والعالم كلوا شاف كيف دافع الأسطورة زيزوا على بلدوا وعلى عاياتوا ياإبن الشرموطة المنتاكة,زيدان أحسن لاعب بالعالم ياعطاي,لو اطيح بإيدي,ابدخلك زبي بالدبر بتاعك لغاية الخصيتين وإزا بأدر ابدخلك خصيتي كمان فالدبر بتاعك يامنتاك يامحلول ياكلب ياحيوان ياواطي,القافلة تمر والكلاب تنبح,وأنا لبناني 100/100 وعندي كتير صحاب جزاءريين هون بلبنان وكلهم بيرفعوا الراس من ناحية الرجولة والشهامة والعالم كلوا بيعرف هاالشي,إزابدك روح اسأل فرنساراح بتألك شوا عملوا فيها أبناء بلد المليون ونصف مليون شهيد ياكلب ياشرموط ياواطي ياإبن المنتاكة وياأخوا الشرموطة المنتاكةههههههههههههههههه"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011100058/http://worldcup2006.20at.com:80/article.php?sid=123"

[[comments]]
order = 44
subject = "روح نيك أمك ونيك أختك ياعبد الله الخرة ياكلب ياوطي"
posted = "2008-04-21"
text = "روح نيك أمك ونيك أختك ياعبد الله الخرة ياكلب ياواطي ياملول الدبر أعطيني أحكلك زبي بالمكاوي انتاعك ياعطاي,زيدان أشرف منك ومن أبوك وبصقة زيدان أحسن منك ياواطي,كيما قالها الأسطورة العالمي أيضاوإبن الجزائرأيضاالشاب خالد-اللي غاروا منا ايديروا كيفنا- ياواطي ياعبد الله الخرة يا كلب ياإبن القحبة المنتاكة المحلولة ياإبن الشرموطة ههههههههههههههههههههههههههههه<br />مهدي التونسي عاشق إبن الجزائر والأسطورة (زين الدين زيدان)"
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011100058/http://worldcup2006.20at.com:80/article.php?sid=123"

