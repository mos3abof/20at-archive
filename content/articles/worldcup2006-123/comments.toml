[[comments]]
order = 49
subject = "زيدان.....اسطورة الزمان......التي حكى عليها الناس من كل مكان."
author = "دعدوش بوزيد"
posted = "2008-06-10"
text = "زين الدين زيدان هو واحد من عمالقة الكرة العالمية . استطاع ان يكتب اسمه على صفحة دهبية بفضل الانجازات الضخمة التى قام بهاطوال مشواره الكروي الدي وضع له خاتمة في مونديال المانيا2006 بضربة قويةزعزعت اضلاع < ماتيرازي > دفاعا عن حرمته و حرمة دينه ووطنه لانه لايتسامح مع من اثار غضبه ولو في المحافل الكبرى."
archived = "2008-10-11"
capture_url = "https://web.archive.org/web/20081011100058/http://worldcup2006.20at.com:80/article.php?sid=123"

