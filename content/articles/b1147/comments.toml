[[comments]]
order = 0
subject = "..& ما اروعك ايتها الرحلة العظيمة &.."
author = "..& هيكل الأزهرى &.."
posted = "2006-08-23"
text = "ما اروعك أيتها الرحلة العظيمة , حقا والله إنها لرحلة يحتذى بها صدقا لقد سمعت عنها الكثير والكثير والكثير والكثير ولا امل السماع عنها ثانية من الجميل ان تسمع الشىء ذاته مرة ثانية لكن الاجمل ان تضع لنفسك أمرا لابد من تنفيذه الا وهو الإستفادة فى كل مرة تسمعها فيها وتفكر بتعمق فى مدى جدواها وفائدتها على كل الأصعدة اعادها الله علينا بالخير واليمن والبركات ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130339/http://www.20at.com/article2.php?sid=1147"

