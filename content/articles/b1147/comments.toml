text = "اين انتم يا عرب، اين انتم يا مسلمين، والله لتسئلن يوم الموقف العظيم عن تقصيركم هذا، شعوبا وحكاما، صغير وكبير، والله لتسئلن عما تخاذلتم وتناذلتم. اصحوا وصحوا ضمائركم...."
