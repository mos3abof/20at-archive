text = "قصدى سبب التجاء الاطباء للشعر<br />المششتير يا هوبه مخلاش عقلى معايا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132437/http://www.20at.com/article2.php?sid=855"

