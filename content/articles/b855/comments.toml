[[comments]]
order = 4
subject = "شارلوك هولمز"
author = "كونان"
posted = "2006-07-19"
text = "سلام كتير الموضوع عجبني وانا بحب اقرأ للسير أرثر كونان دويل وانا كتير معجبة بشخصية المتحري شارلوك هولمز وبتمنالكم التقدم والى الأمام اما بالنسبة لانو ليش الطب بيدخلوا علادب فلانهن بيعرفو بالسموم الاكثر فتكا و باعضاء الجسد ونفسية المريض اكثر من اي شخص اخر و الى يدرس الطب مجال الادب في تخصصه قليل فبيحتاج الى انو ايعبر على الى اتعلمو فبيدخل بلادب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132437/http://www.20at.com/article2.php?sid=855"
