[[comments]]
order = 0
subject = "زملهو....\" كلام ملخبط بقي تقول ايه \""
author = "هوووووبه مش شغلك وهبهوب سابقا"
posted = "2006-05-24"
text = "هو ليه كل البشر اللي بتدرس طب بتخش ادب ليه , زي ناجي والعالم دي والكابتن هولمز ليه ها ها ؟<br />ماعلينا ,حلوه قصصه بتفتح دماغ الواحد وراي انا رواياته احسن من اجاثا كريسي مع انهم الاتين رائعين بس الاول احسن , اللي عنده قصه يلزقها مش معقوله يعني اكتب الروايه كلها يلا ملاس \" الحدق يفهم \""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132437/http://www.20at.com/article2.php?sid=855"

[[comments]]
order = 1
subject = "دا رايى يا هبهوب"
author = "نيفين"
posted = "2006-05-25"
text = "بصى با هوبه انا حاسه ان سبب التجاء الشعراء للشعر اغراق الدراسه الطبيه ليهم بامور الجسد فعلشان كدا بيحصل نقص ف الرحانيات عندهم بيعوضوه بالشعر اللى هو الروح ف اعلى مراحل سموها<br />بالنسبه للموضوع كويس بس الصورسكالعاده تحفه يا عشرينات<br />رجعتونا لورا<br />ايام ما كانت الحياه احلى بكتير<br />فهمانى يا هبهوب<br />تقوللى ايه<br />سكارليت بقى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132437/http://www.20at.com/article2.php?sid=855"

