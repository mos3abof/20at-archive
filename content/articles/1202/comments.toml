subject = "فيه ناس بتقرى"
author = "مارك"
posted = "2006-07-16"
text = "ان موضوع الفرق بين الأسرة العربية والأسرة الأوربية لهو موضوع شيق وكنت اتمنى ان يكتب بحرية وبلا محاولة للتجمييل والتلطيف وانا لا ادعى اننى خبير بالأسرة الأوربية اوحتى العربيه فالعمليه عندنااحنا كلنا عارفين ماشيه بالبركه عيال بتيجى وعيال بتروح واغلبيه بالعيال يغلبك بالمال.. وعلم الركه اللى احنا عارفينه.... ولاكن ما اراه فى الأفلام الأوربية التى تتعرض لهذه النوعيه فهى تظهرمدى احترام الأباء لأبنائهم وكم من اطفال صغار يتحدثون فى جرأة ولباقه محروم منها الطفل العربى بل ويأتون من ضروب الفكر والشجاعه ما يفوق التصور .. ولا تقول لى انه شغل سينما.. فما السينما الا واقع الحياه.. ولى عتاب على المقال فى هذا التضارب المتمثل فى<br />1- فى بداية المقال وبالحرف الواحد .....<br />لا تجــد فى الأســرة الغربيــة الترابط الكبير الذى يوجد فى الأســرة العربيه.........كلام المقال<br />2 - تحت عنوان الفقر سبب الطلاق<br />مكتوب اكثر مشكله تتعرض لها الأسرة<br />( العربيه طبعا ) لأن الكلام عن الأسرة العربية....غياب الديمقراطيه داخل الأسرة وبالتالى ..كثرة الخلافات بين الزوجين وبين افراد الأسره جميعها..ناهيك عن الخلافات العائلية وتدخل اهل الزوج واهل الزوجه فى حياتهما كذلك المشاكل الجنسيه والعجز الجنسى فد تعتبر من اهم اسباب الطلاق فى الأسر العربيه ...... كفايه كده<br />.. غياب ديمقراطيه...كثرة خلافات...تدخل الأهل..خلافات عائليه..مشاكل جنسيه وعجز جنسى......قول انت بقى.....<br />خلووووا بالكم فيه لسه ناس بتحب تقرى<br />مارك"
