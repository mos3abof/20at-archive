subject = "زعيم الوطنية"
author = "نور الغد"
posted = "2006-07-12"
text = "كان الحلم الكبير يكون ايمن نور هو الرئيس لكن منهم للة تخلصة منة على طريقة محمد على مع المماليك احناء وداولادك يامصر بنقول للعالم كلة احناء مع سجين الحرية وابن مصر ايمن نور بنحبك يا ايمن خليك صامد فرج اللة قريب ودولة الظلم ساعة ويعيش ايمن نور ==== الحرية ل ايمن نور -- الصبر مفتاح الفرج اللة معاك يا ايمن نور بنحبك يا ايمن كل الحرار والشرفاء بتحبك ايمن نور= ايمن نور -ايمن نور = ايمن نور- ايمن نور = ايمن نور \\= ايمن نور =ايمن نور -ايمن نور"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131247/http://masr.20at.com:80/article.php?sid=638"

[[comments]]
order = 8
subject = "يخليك لينا ياريس علشان خاطر اليسار"
author = "القاضي"
posted = "2006-07-13"
text = "ريحتك حمرا خالص يادريني مع انك واد جامد وبحب اقرالك ومتابعك في الدستور بس الدكتور الفاضل(ابن بهية)فضحك وفضح دعاوى الامريكان واليسار فيمحاربة النظام الاسلامي الذي سيسود باذن الله عاجلا او آجلا بس يابوحميد ماينفعش الحكم على النظام الاسلامي -الذي سيطبقه الاخوان باذن الله-من الناحية الاقتصاديةفقط لانه ليس نظاما ماديا وانما هو نظام شامل ترتبط كافة نواحيه ببعضها البعض ارتباطا وثيقا فلا يمكن ان ننظر للجانب الاقتصادي دون النظر لبقية المنظومة الاسمية التى تعضده عموما فكك من الكلام الكبير ده وخلينا في الريس ياراجل الريس يموت طيب ده انا ماتخيلش الحياه من غيره ده انا ماعيشتش يوم في عمري من غيره اتولدت وهو موجود واتعلمت وهو موجود وكبرت وهو موجود واعتقلت وهو موجود وبعدين دخلوني الحرس بتاعه وقالولي انت تنعم-والله قلولي تنعم- بحراسة سياديته واولاد سيادته بس لما عرفتهم اني ابن عاق لسيادته كرشوني من النعيم بقى الريس يموت جديدة دي دنياغريبة سبحان من له الدوام"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131247/http://masr.20at.com:80/article.php?sid=638"

[[comments]]
order = 9
subject = "المشكلة كانت في الغلاف"
author = "د. محمد"
posted = "2006-07-13"
text = "غلاف المجلة حمل صورة مش مناسبةظهر فيها إن الريس بطقم علشان كده صادروا العدد من غير مايقولوا له<br />طب قولوله الحقيقة هيشتري الأعداد كلها من الدول اللي جنبنا ويوزعها على أعضاء الحزب علشان يرسموا سياسة ما بعد مبارك<br />أصلهم مايعرفوش ولازم الأجانب همه اللي يقولوله"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131247/http://masr.20at.com:80/article.php?sid=638"

[[comments]]
order = 10
subject = "كده الرجولة وإلا بلاش ياست ضبة مفتاح"
author = "عمرو بن ود"
posted = "2006-07-13"
text = "جمد قلبك يامفتاح متبقاش معلوج كده إيه يابن الناس أقد كده مفزوع من حلوف منوفي أهتم مركب طقم؟ أمال لو جربت غيره كنت أكيد مليت سراويلك كل ماشفت صورته.<br />يا ريت الإخوان يكون عندهم برنامج وتصورات لحل مشكلات البلد الكبري زي الديون الخارجية (800مليار دولار) والتبعية العسكرية والأمنية لإسرائيل وأمريكا، ومعاهدة كامب هباب اللي بيها بدا إحتلال وهدم مصر إقتصاديا وعسكريا وسياسيا وأخلاقيا وتعليميا، وكمان ياريت يعرفوا إزاي يسترجعوا الثروات اللي نهبها حيثان النهب من محاسيب الحلوفين سادات-لامبارك وأسرهم.<br />ياسلام على الرجولة يامفتاح ده أنت تحفه والنبي لأعفيك من الخدمة العسكرية."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131247/http://masr.20at.com:80/article.php?sid=638"

[[comments]]
order = 11
subject = "عبدالله جبان منفاخ"
author = "NoNo"
posted = "2006-07-13"
text = "كلامك غبي خالص<br />ياريت تمسحه أحسن لوينفع لأنه يدل علي أنك مش بس أهبل وبرياله بس ولكن جبان وبتشخ على روحك في الظلمة<br />طيب والمتخلف عقليا زيك حد يحاسبه مهما قال وسوى عجبي جرستنا الله يجرسك بين أربع مفارق يا جبان."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131247/http://masr.20at.com:80/article.php?sid=638"

[[comments]]
order = 12
subject = "جايه اوقف المهزله"
author = "هووووووووبه"
posted = "2006-07-14"
text = "الموضوع ببساطه اني خلطت الاسماء المفروض<br />علاء عبد الفتاح واضح تشابه الاسماء<br />يا اخ عبد الله ركز في التعليق<br />وكلمه اخيره منهجي اكيلي تشور دو اظن فاهم<br />وتحذير اخير لكل البشر اهو والا والله ما دخله الموقع دا"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131247/http://masr.20at.com:80/article.php?sid=638"

