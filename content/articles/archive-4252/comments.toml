[[comments]]
order = 5
subject = "شقاوة شعب يا ريس"
author = "هووووووووووبه"
posted = "2006-07-12"
text = "ازيك ياض يا دريني لسه معقه وجايبه في سيرتك, حقول حاجه واقفه في زوي الصراحه<br />ممكن تكون سخيفه , السنه اللي فاتت علي الي بي سي كانو جايبين دجال مشهور مش فاكره اسمه بجد\" مع ايماني بكذب المنجمون ولو صدقوا\" , المهم الجدع دا قال ان<br />\"مبارك شعب مصر\" حيموت السنه الجايه , وحتحصل قفله جامده بعديه وخناقه بين الاخوان والوطني زي اللي قاله مفتاح<br />علي العموم كذبوا صدقوا فاضل علي الحلو زقه"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131247/http://masr.20at.com:80/article.php?sid=638"

[[comments]]
order = 6
subject = "انا منجم؟"
author = "عبدالله مفتاح"
posted = "2006-07-12"
text = "هو مفتاح قال ايه يا هوووبه؟<br />انا في حالي متوديناش في داهيه<br />اظن ان الريس في حالة ما اذا انتقل للرفيق الاعلى اظن والله اعلم ان جمال مبارك هو الاقرب لتولي الحكم وان كانت المعارضه في مقدمتهم الاخوان هيكون ليها دور جامد جدا في عدم القبول بهذا الوضع يعني باختصار هيكون في حاله من الفوضى بعد الريس ربنا يمد لنا في عمره"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131247/http://masr.20at.com:80/article.php?sid=638"

[[comments]]
