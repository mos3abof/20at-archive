text = "طب لما إنتي والشوية اللي بيفهموا تمشي مين يفضل هنا سي منفاخ ترباس ده؟ إعقلي يابنت الناس والله تعليقاتك مميزة وطريفة وذكية متسبيناش والنبي. قولتي إيه علشان خاطري!"
