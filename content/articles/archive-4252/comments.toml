[[comments]]
order = 1
subject = "نفسى افهم"
author = "محمد"
posted = "2006-07-11"
text = "نفسى افهم انتم عاوزين اية العالم كلة بيكلم عن المستقبل ككيان لهم واحنا بنبعد او بنحاول نبعد عن كيانا احنا اكيد هوة الكيان الاسلامى انتم عاوزين دولة حلوة و جميلة و بتحقق لكم الحرية و الديمقراطية والسلام و معرفش اية ولكن اعلموا ان احنا عمرنا ما حنتقدم او حتى نشم رحتة الا عن طريق رجوعنا الى كتاب الله وسنة رسولة صلى الله علية وسلم<br />واطنططوا و اعملوا مظاهرات ونادوا كويس بحقوق المرأة لكن ابقوا قابلونى لو فلحتم<br />اكيد ان كلكم اخدتم عنى انطباع انى متطرف وارهابى و برجوازى و مش فاهم حاجة ولا الى بيحصل حولى لكن اعلموا ان اى حاكم ظالم او غيرة فهو بلاء من الله غليناو حيفضل كاتم على نفسنا وارفنا فى عشتنا لحد ما نرجع الى صوابنا"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131247/http://masr.20at.com:80/article.php?sid=638"

[[comments]]
order = 2
subject = "الخلاصه"
author = "جيفارا"
posted = "2006-07-11"
text = "الواحد برضه لما يتصور ان مبارك هيموت هيزعا برضه الراجل عشرة عمر .<br />بس بالنسبه لجيمى باشا هوة عمرة ما هيمسك الحكم الا فى وجود والدة غير كدة يروح<br />الجيش مش هيسيبه<br />وانا من وجهه نظرى شايف ان الرئيس اللى جاى هيبقى عسكرى برضه بس بشويه اصلاحات كدة سنتين تلاته وبعد كدة النفخ هيشتغل"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131247/http://masr.20at.com:80/article.php?sid=638"

[[comments]]
order = 3
subject = "مقال يخلط الأمور خلطاً عجيباً .."
author = "إبن بهية .."
posted = "2006-07-12"
text = "لا أدري لماذا لا يعجب الأخ الكاتب صعود الإخوان إلى الحكم ؟؟؟!!! والغريب أنه بكل بساطة يخلط بين الأمور بطريقة تنم للأسف عن جهل كبير .. نحن يمكن أن نتقبل الجاهل الذي يريد أن يتعلم لكننا لا يمكن أن نتقبل أبداً الجاهل الذي يريد أن يعلمنا الجهل .. يا أخي الطيب إن الاقتصاد الإسلامي الذي خلطت بينه وبين الإخوان شيء والصعود السياسي للإخوان شيء آخر مختلف وأدعوك إلى قراءة أي كتاب صغير عن الاقتصاد الإسلامي ومتى بدأ أول بنك إسلامي في العصر الحديث وكم عدد المؤسسات المالية الإسلامية اليوم في العالم وكم تدير من الأموال وكيف تزداد بشكل رهيب كل يوم .. وكيف أنه وفق كل توقعات خبراء الاقتصاد في العالم سيسود الاقتصاد الإسلامي حتماً لما يتمتع به من قوة داخلية نابعة من استناده إلى شريعة الله وليس البشر لذا سأزيدك معلومة تنفعك بإذن الله .. فقد استحدث البيت الأبيض منذ سنوات أقساماً وإدارات ومستشارين في الاقتصاد الإسلامي وهمت كل دول أوروبا بإنشاء بنوك إسلامية بها ليقينهم من أنه اقتصاد المستقبل يا طيب .. تيجي نتفزلك شوية وأقولك أسماء أجنبية ؟ يقول الاقتصادي العالمي الكبير موريس آليه الحائز على جائزة نوبل في الاقتصاد وهو فرنس غربي ولا يمت للإسلام ولا العروبة بصلة لا من قريب أو من بعيد .. يقول بالحرف الواحد في جريدة اللوموند الفرنسية سنة 1989م بعد عشرات الأبحاث في الاقتصاد عموماً : إن النظام البنكي الغربي سبب أضراراً فادحةً بالاقتصاد العالمي تتلخَّص في1 - إيجاد مرض خطير يتجذر في الاقتصاد العالمي ويهدِّده بالانهيار أو بمواجهة أزمات اقتصادية حادَّة إذ أصبح الاقتصاد العالمي بفضل النظام البنكي الحالي عبارة عن أهرامات من الديون يتمركز بعضُها على بعض على أساس ضعيف. 2 - استعمل المال في غير وظيفته الطبيعية، إذ ي<br />اقرأ بقية التعليق .."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131247/http://masr.20at.com:80/article.php?sid=638"

