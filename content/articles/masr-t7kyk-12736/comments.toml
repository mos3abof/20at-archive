author = "انتظوا الجنرال شتاء"
posted = "2009-07-23"
text = "دلوقتى درجة الحرارة 40 درجة مئوية والحرارة بتضعف او بتموت الفيروس والناس لا تصاب بالبرد<br />وحينما يحل موسم الشتاء والتقلبات الجوية وانتشار موجات البرد وانتشار موجات اصابة الانفلونزا ابقوا تعالوا قابلونى<br />هينتشر الوباء زى انتشار الحريق فى مجلس الشورى سابقا<br />وهتبقى مردغانة<br />والناس هتفرفر فى الشوارع وهتموت على محطات القطارات والمترو وهنبقى اضحوكة العالم لان المستشفيات مفيش فيها حاجة خالص واللى بيتعور بيقولوا لة روح اشترى قطن وشاش على حسابك من برة<br />اصلهم جايبين وزير صحة راسمالى صاحب سلسلة مستشقيات خاصة علشان يعالج الكبار بس اما الغلابة فليس لهم مكان فى اجندتة<br />رجل يؤمن بان اللى معاة يتعالج واللى مش معاة يموت ودة نصيبة<br />البلاوى بتتحدف<br />وانتظروا الشتاء<br />انتظروا الشتاء<br />اما اذا كنت غنى مثلى ومرتاح قوى فلا تخاف فهنروح مستشفى دار الفؤاد ملك سيادة معالى الوزير وهنتعالج بادوية مستوردة من برة"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725133628/http://www.20at.com:80/masr/t7kyk/12736-2009-07-22-14-45-18.html"
