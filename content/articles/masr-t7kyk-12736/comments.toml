author = "رعب غير مبرر"
posted = "2009-07-22"
text = "كم واحد مات من انفلونزا الخنازير ؟<br />فى كل الهيصة دى واحدة ست توفاها اللة رغم تشكيك زوجها بالمرض رحمها اللة وجعل مثواها الجنة<br />اذن المرض ليس خطيرا<br />وبيعدى زى اى دور برد<br />انما المؤذى والمهين للنفس ان يمرض الانسان بمرض حيوان كرية جدا اسمة الخنزير 95 % من الشعب المصري لم يشاهدة الا فى التليفزيون<br />لماذا لا يمرض بة فقط الذين ياكلونة والذين يتعاملون معة ؟<br />والخوف الاكبر من حجز الحكومة للمصابين فى اماكن حجز يردد الشعب بينة وبين بعضة ان الحكومة تقتل المصابين بحقنة هواء وتتخلص منهم ولا تعالجهم وتدفنهم فى مقابر مجهولة<br />من هنا يخاف الناس من ابلاغ الحكومة عن اصابات انفلونزا الطيور والخنازير واى مرض معدى وبيذهبوا الى عيادات للعلاج بعيدا عن اعين الحكومة"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725133628/http://www.20at.com:80/masr/t7kyk/12736-2009-07-22-14-45-18.html"

