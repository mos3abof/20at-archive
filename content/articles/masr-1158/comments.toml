text = "انا شاب من مدينة الاسكندرية اتمنى شغل زي ده الشغل مش عيب بس تخالي بالك لى نفسك وحاولي تروحي كل يوم منزلك وخالي ايمانك بربنا كبير وتوكلي على الله على الاقل لما يجي ابن الحلال تقدري تساعدي معاه والله احنا علينا مسؤولية صعبة جدا المهم ايمانا بربنا والحمد الله على كل شيء ولو تقدري تشوفيلي معاكي شغل ياريت تكلميني عالايميل بتاعي bassem_amar1@yahoo.com"
