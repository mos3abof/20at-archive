text = "بس انا اصحابى مرة عملوا المشروع دة لبعض عشان الامهات لابيعرفوا يروحوا مساجد ولا مشاوير ولاغيرة؛فاتفقوا ان كل واحدة تقعد بالعيال يوم وبمقابل ولكن دول بردوا ولاد اصحاب بعض ؛يعنى مش وظيفه<br />مش قادرة احدد"
