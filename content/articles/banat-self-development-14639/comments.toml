text = "السلام عليكم ورحمة الله وبركاته<br />أنا كمان عاملة حاجة زي كده<br />بس كشكول مسمياه ( كشكول السنة )<br />بلزق فيه كل الذكريات . . أو بعمل فيه ذكريات :) وبقعد احكي عن الخروجات بتاعتي مع صحباتي أو يوم مميز في حياتي<br />بلزق عليه نصايح صحباتي ليا . . حاجات كتير<br />والحمد لله أنا عندي مواهب كتير بسعي لتنميتها وبمارسها في أوقات فراغي . . لدرجة أني نفسي في وقت عشان بشتاق للحاجات دي<br />الفكرة حلوة . . بس صعبة بالنسبة لي . . ممكن اعملها بس مش في الوقت الحالي خالص<br />أنا فكرت في كده قبل كده . . عشان بحب أوي الإعلانات وبحس إني هحتاجها فيما بعض . . ربنا يقوينا<br />ربنا يجازينا وإياكم أعلي الجنة عند الحبيب المصطفي صلي الله عليه وسلم"
