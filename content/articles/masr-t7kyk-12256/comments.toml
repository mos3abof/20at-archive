author = "البنت المراهقة"
posted = "2009-06-07"
text = "البنت المراهقة بتاع الاعدادية اللى جنبنا بتركب عجلة وتلعب بها ساعات فى الحوش بتاع بيتهم وبتبقى منسجمة قوى وهى بتسوق وسارحة خالص فى دنيا تانية<br />العجل لعبة البنات المفضلة - لكن شفت ام بتشخط فى بنتها الصغيرة لما ارادت ركوب العجلة"
archived = "2009-06-09"
capture_url = "https://web.archive.org/web/20090609025326/http://www.20at.com:80/masr/t7kyk/12256-2009-06-02-11-00-50.html"

