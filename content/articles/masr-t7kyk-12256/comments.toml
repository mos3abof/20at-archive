subject = ""
author = "قبل عصر الحمار"
posted = "2009-06-11"
text = "زمان كانت المدارس تنظم سباق للدراجات بين طلبة المدارس الثانوية - وكان الطلبة الذين يملكون دراجات يبداون السباق عصر يوم الجمعة من المدرسة تحت اشراف مدرس الالعاب الى اقرب قرية وكانت تعطى جوائز للفائز<br />وكان سباق فية منافسة ورياضة وعلاقات صحية وكانت ادارات المدارس منضبطة وتجعل الطالب يمارس كل الانشطة<br />واذكر وانا طالب ان مدرس الثانوى كان بيقول لازم تطلع من الثانوية وانت تجيد لعبة سواء جماعية او فردية او من العاب القوى<br />وكان الطالب الذى لا يمارس لعبة يقولوا علية جربوع<br />اما حينما انهار التعليم واتوا بمن يقود العملية التعليمية الحمار والحصان والجمل باظت كل حاجة<br />فركوب الدراجات رياضة<br />والتجديف فى النيل رياضة"
archived = "2009-06-26"
capture_url = "https://web.archive.org/web/20090626084856/http://www.20at.com:80/masr/t7kyk/12256-2009-06-02-11-00-50.html"
