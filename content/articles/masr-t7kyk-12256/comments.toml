subject = ""
author = "حاجة غريبة"
posted = "2009-06-02"
text = "انا شخصيا مستغرب جدا<br />فانا اقود جميع انواع السيارات بمهارة فائقة بل فى خدمتى العسكرية كانت سواق دبابة<br />والمصيبة ابدا اننى حاولت ان اتزن فى ركوب الدراجة ولسنوات ولكن ابدا لم اتمكن من قيادتها<br />حاجتين فشلت فيهم تماما رغم المحاولات المستميتة<br />ركوب الدرجات ولعبة تنس الطاولة او البنج بونج<br />هل جهازى العصبى فية شىء<br />لا ادرى<br />ولكن هذ الذى حدثا"
archived = "2009-06-09"
capture_url = "https://web.archive.org/web/20090609025326/http://www.20at.com:80/masr/t7kyk/12256-2009-06-02-11-00-50.html"

