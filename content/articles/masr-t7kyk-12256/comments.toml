posted = "2009-06-08"
text = "يطلق عليها اهل الخليج السيكل<br />وفى ريف وصعيد مصر يسمون العجلة الحمار الحديد وكانوا بيقولوا البوسطجى راكب الحمار الحديد يعنى راكب العجلة<br />وجرت محاولات لصناعة العجلة فى مصر بل وتم تصنيعها فعلا ايام المرحوم عزيز صدقى وزير صناعة عبد الناصر ولكن يتم استيرادها من الصين والهند<br />وتصوروا اننا فى مصر لا نصنع العجلة<br />اظن حاجة ت[ *** ]ف قوى<br />قال اية وبيقول لك حضارة 7 الاف سنة<br />اللى اختشوا ماتوا"
