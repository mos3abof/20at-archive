text = "اولا : قصة الخمس وعشرين بالمئه هذه كذبه مفضوحه وحتى يمرر الكذبه ذكر انه مصدر شبه رسمي واتحدى من ذكر هذا الرقم ان يثبته لاننا في داخل السعوديه ونعرف انها كذبه..<br />ثانياً : كل رب اسره فقيره ودخله بسيط يحق لرب الاسره الف ريال شهريا ولباقي اسرته يصرف لكل فرد سبمعمائة ريال شهريا على ان لايتجاوز المبلغ والذي يصرف لكافة افراد الاسره العشرة الاف ريال وتنزل له شهرياً في حسابه مثل رواتب الموظفين وياخذها عن طريق الصراف الالي خلال دقائق معدوده بدون طوابير وتواقيع ويتم مساعدته بترميم منزله وايضا يساعد في الايجار اذا كان لايملك منزلا ويساعدونه حتى في تسديد الفاتوره<br />ثالثاً : بعضهم لايعمل ويريد ان يكتفي بما تصرفه له الدوله من اعانه وفوق هذا يريد ان يعيش مثل الميسورين والاغنياء وام المصائب كلها ان بعضهم يكون مدمناً للمخدرات والخمور وهذا هو سبب فقر حالات كثيره لان امواله تذهب على السم الذي يبتلعه ثم تجده يلوم ويشتم<br />حفظ الله ارض الحرمين وسائر بلاد المسلمين"
