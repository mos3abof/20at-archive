[[comments]]
order = 3
subject = ""
author = "مستر لي"
posted = "2009-02-23"
text = "ممتاز يا شباب أنا فعلا سمعت عنكم وتابعت صوركم وفيديوهات تدريباتكم وتطبيقاتكم الخارجيه وبجد بجد<br />انتم رمز للشاب المصري اللي بيعرف يوصل لهدفه ويتعامل معاه بالطريقه الصحيحه<br />وانتم فعا تدعو أي حد رياضي او مش رياضي انه يفتخر بإنه مصري<br />وأنا بجد بإذن الله هنضم للفريق في أقرب وقت ممكن<br />بالتوفيق ان شاء الله وللأمام دايما يا شباب مصر<br />مستر لي"
archived = "2009-04-30"
capture_url = "https://web.archive.org/web/20090430062431/http://www.20at.com:80/masr/masr/t7kyk/11365.html"

