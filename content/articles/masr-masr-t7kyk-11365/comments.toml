text = "ماشاء الله بجد شكرا ليكى يا هبه على الكلام الجميل ده<br />وبالنسبه للى بيسأل يطلع ايه الباركور ده مافيش مشكله أجهل على جوجل أو يوتيوب واعمل سيرش على باركور إيجيبت<br />وشكرا مره تانيه للموقع وكل أدراة موقع عشرينات وانتى كمان يا هبه"
archived = "2009-04-30"
