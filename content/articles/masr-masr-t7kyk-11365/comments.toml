author = "مش شريف الدواخلي ولا البراء اش"
posted = "2009-02-21"
text = "والله يا اختي الحكومة علمت الشعب المصري كله يلعب باركور<br />شوفي الموظفين ومحدودي الدخل كلهم بيلعبوا باركور بتاع حضرتك دا علشان خاطر يعرفوا يخلصوا الشهر"
