[[comments]]
order = 3
subject = "شعب فى خطر"
author = "كنت فى زيارة لاحد الدول العربية وهناك شاهدت مدى الانحدار الذى وصلنا الية ولم تكن لى اهتمامات اقتصادية لااشتراكية ولا راسمالية ولكنى بعد تلك الزيارة اصبحت اشنراكيا تماما وجدت المتسولين بهم نسبة كبيرة من المصريين وكذلك الساقطات ومن يبع كرامتهم بطريقة مهينة للشرف وغيرة الكثير والحقير وقلة الكرامة"
posted = "2007-01-09"
text = "اى حكومة تفقر شعبها وتجعلة يعيش فى مهانة حكومةفاشلة<br />اى شعب كلة من المعدمين وتفترسة البطالة ويختار نظاما راسماليا فجا ويسرقون اموال الفقراء من البنوك ويهربونها الى الخارج هى حكومة لبست نظيفة ابدا<br />الصين الشيوعية انتاجها فى العالم كلة<br />ونحن فى انتظار المثتثمرين الذين لن ياتوا ابدا<br />وموت ياحمار على ما يجليك العليق<br />زمان كنت تفنخر انك مصرى<br />ولكنى شاهدت مصريين الان ينكرون انهم مصريين<br />اللهم اننى ابث حزنى الى اللة"
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111152448/http://masr.20at.com:80/article.php?sid=1418"

