subject = "حسبنا الله ونعم الوكيل"
author = "مواطن"
posted = "2007-01-09"
text = "يلعن مبارك العميل اللي عامل كل الهوجه دي .. بصراحه مش قادر أعرف ازاي الانسان ممكن يتمسك بالكرسي كده ولغاية امته<br />الراجل ده مش عارف انه بيودي البلد في ستين داهي<br />الهي الفين داهيه تاخده ونخلص<br />حسبنا الله ونعم الوكيل"
