[[comments]]
order = 5
subject = "بس الغريب بصراحه أمر الجيش .."
author = "إبن بهيه"
posted = "2007-01-09"
text = "بصراحة لا أدري ماذا يريد ذلك الطاغية .. لأ وإيه .. واطي كمان .. يعني يا ريته كان حاجه محترمه .. يعني ملك إبن ملوك مثلا وحاسس إننا شعبه وملك يمينه .. لكن الأبعد واطي وبص لقى نفسه مختار من الأمريكان ليكون رأس الدولة .. طبعا لا شعب يهم ولا مصالح ليها لازمه .. اللي جابوه وحطوه على الكرسي راضيين عنه .. يبقى طظ في مصر وشعب مصر ..<br />لما يسدها كده من كل ناحيه .. طيب الناس المحترمه اللي عايزين يلعبوها بالسياسه والذوق والأدب والحوار والانتخاب يعملوا إيه ؟؟؟<br />ما حدش يلومهم بقى لو كل مجموعه عملت تنظيم سري .. وكل تنظيم وعلامه بقى .. وافرحي يا بهيه ..<br />أحيانا الطاغيه لما بيزيد عنده الجبروت والصلف والغطرسه بينسى أو يتناسى أنه مجرد بني آدم لا يساوي شيء .. بيتصور إنه خلاص متخبي ورا كلاب الحراسه وممكن يسلطهم على أي حد يتكلم يجيبوا كرشه .. طيب يا سيادة الحصاوي ما تعرفش إن ده له نهايه؟<br />يعني الناس لما توصل لطرق كلها مسدوده .. تعمل إيه بقى ؟ تسكت وتستنى ثلاثين سنه تانيه مثلا ؟؟؟ طبعا ده بعيد عن عين أهله وعين الننوس الصغنن بتاع لجنة الوكوسات ..<br />بس الغريب بصراحه أمر الجيش .. يعني معقوله وصل بيهم الاستهبال لغاية كده ؟؟؟ شايفينه واخد البلد على جهنم وساكتين ؟؟؟<br />بصراحه اللي محيرني في الموضوع كله الجيش .. الجيش في أي بلد هو صمام الأمان .. ومهما قلنا أن مبارك الواطي أفسد الجيش كما أفسد كل شيء في مصر .. لا يمكن يكون أفسده كله .. أكيد لسه فيه كام ضابط من ولاد بهيه بجد ولسه ما باعوش شرفهم ولا شرف مصر .. طيب مستنيين إيه ؟؟؟<br />مش قلتلكم من شهرين .. على فال موريتانيا إنه فال حلو (أقصد محمد فال) الراجل عمل انتخابات بلدية وبرلمان ولا أنزه من كده .. وقريبا ستكون انتخابات رئاسية وبرضه متوقع تكون نزيه<br />اقرأ بقية التعليق .."
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111152448/http://masr.20at.com:80/article.php?sid=1418"

