[[comments]]
order = 0
subject = "تصويب"
author = "سمية"
posted = "2005-12-31"
text = "السلام عليكم<br />قرأت المقال وأعجبني لأنني ممن لسعتهم البطالة وأحبطهم صمت الحكومة المغربية وكانها تريد أن تقول للمعطلين انطحوا الصخر برؤوسكم إلا أن لدي ملاحظة فالذين لجأووا إلى الكنيسة ليسوا أطباء بله من الحاصلين على شهاداة الدكتواره من تخصصات مختلفة انتظموا داخل مجموعة تسمى مجموعة الأملوالتي تأسست منذ ما يزيد عن ثلاث سنوان وخاضت مجموعة من المعارك النضالية أهمها معركة عيد الأضحى في العام الماضي."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113604/http://www.20at.com/article2.php?sid=174"

