subject = "مصطفى من الجزائر"
author = "ختي العزيزة"
text = "لك مني كل التقدير و الإحترام و أكثر الله من أمثالك.<br />أدامك الله قدوة للمرأة العربية و جعلك إن شاء الله من أهل الجنة.<br />بارك الله فيك و في أسرتك و أطال عمرك في الإيمان.<br />أخوك<br />مصطفى بوكوشة من الجزائر<br />mustapha87@hotmail.com"
archived = "2006-11-02"
