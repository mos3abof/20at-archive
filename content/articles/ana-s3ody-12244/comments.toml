posted = "2009-07-12"
text = "اعتقد والله اعلم ان هروب الفتيات في السعودية لايحتاج لدراسات لان السبب واضح جدا وهو عدم وجود هدف سامي لحياة هؤلاء البنات لان مجتمعهن ادخل في عقولهن ان الله خلقهن متاعا للرجال وانها ليس لها دور او طموح في الحياة اكثر من ان تكون زوجة تنجب وعليها الموافقة علي كل ما يقوم به الزوج حتي لو تزوج عليها و ان اعترضت فهي تغضب الله .ولحل هذه المشكلة نطالب الاخوة السعوديين بتطبيق الشريعة الاسلامية الحقيقية و ليس تغليب العادات و التقاليد البدوية التي تحط من قدر المراة فتجعلها حيوانا يوضع في قفص جميل و ليس له ان يطلب اكثر من ذلك"
archived = "2010-01-05"
