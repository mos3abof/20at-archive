text = "السلام عليكم<br />الموضوع جدا رائع …<br />اما عن سر الهرب او الاختفاء فا اكيد الضغط الاسرى بأنواعه يولد الانفجار يوما ما<br />ياريت لو كل الاهالى يراعوا كل الابناء ما يحاولوا الضغط عليهم لانهم بعدين سوف يواجهون رده فعل غير مرضيه حيت حنها لن ينفعهم البكاء على الاطلال<br />اكيد هناك عدة اسباب اخرى للهرب ولكن هدا احد الاسباب الاقوى ..<br />لك جزيل شكرى"
