[[comments]]
order = 1
subject = "و بيقولوا مصر مافيهاش حريه ؟؟؟"
author = "أكرم"
posted = "2006-02-12"
text = "يا جماعه مصر و الله فيها حرية بس احنا اللي خايفين و الله ؟؟<br />بتبدأ ازاي اسطورة الخوف دي<br />1- خايف من العو يا مامي ؟؟؟ ( يا حبيبي يا بني نام احسن العو جاي )<br />2- انا خايف من الشيخ يمدني على رجلي او يعبطني<br />3- انا خايف من المستر اصلي نسيت اعمل الواجب و اتفرجت على مازنجر<br />4- خايف مجيبش مجموع يدخلني كلية خدمة اجتماعية<br />5- انا خايف ليرفدونا من الكلية او يسقطوني<br />6- انا خايف على لقمة عيشي يا بيه<br />7- انا خايف العيال ينزلوا الشارع يخبطهم عربية نقل او لوري او مكروباص 14 راكب<br />8- انا خايف للواد بقلظ ابني مباحث امن الدولة تقبض عليه ( قال ايه عاملي سكسوكة زي عمرو دياب ابقى خليه ينفعك سلومة الاقرع ميعرفش ابوه )<br />9- انا خايف ابني ميدخلش كلية طب<br />10 - انا خايف البت تقعد جنبي و تبور ( قال ايه عايزه تلبس النقاب و تقعد جنبي و تبور انا رأيي ان البودي هو الحل )<br />1455 - انا خايف اموت قلبي قلبي<br />و في النهاية البقية في حياتك<br />فلا نامت اعين الجبناء ( عمرو بن العاص )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131822/http://www.20at.com/article2.php?sid=417"
