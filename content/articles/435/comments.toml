[[comments]]
order = 190
subject = "رد الى الاخت نهى علي"
author = "لسلام عليكم جميعا"
text = "اما ردي الى الاخت فهو ان سامي يوسف يمكنك ان تقولي عنه داع مسلم ولكل مسلم طريقته في الدعاء، فهو جزاه الله خيرا، ولكن المشكلة تقع عندكم في مصر اذ ان سامي يوسف هو داع الى الله ليس الا، وما ذنبه إن كن بنات مصر (اقصد البعض- من قامت بالتمايل وغيره من التصرفات) فانها ولاسفي عليهن فهن لسن ممن جاء الحفل للهدف الاسلامي وانما كان الهدف التمتع ولا اشك بغير ذلك وكل على النيه يحاسب، والخلل يقع في طريقة النظر الى هذا الامر، فمن نظر الى الحفل بالصورة المسلية والغايةالخبيثة فان اثمها والله اعلم كبير، لانها لم تقصد وجه الله ومن قصد الحفل وهو يعلم او يشعر ان شحنته الايمانية ستقوي فجزاه الله خيرا وزاد في ايمانه، ولا حول ولا قوة الا بالله، كيف حال البنات الذي وصل المسلمون اليه منالازدراء والعمل القبيح، وان هذا الامر لمخجل عندما تظهر البنات في مثل هذه الاماكن بتلك الصور والتصرفات. هدى الله بنات المسلمين<br />انا طالبة فلسطينيه(القدس)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144754/http://www.20at.com/article.php?sid=740"

