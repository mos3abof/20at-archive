order = 48
subject = "الى الاخت نهى(osama)"
text = "الأخت(نهى) أكرمك الله –تعالى- وبارك فيك على هذا الحب للإسلام وعلى هذه الإيجابية وقبل هذا أشكر الموقع الذى يعرض كل الآراء وبعد ذلك أشكر الأخت ( منال) صاحبة التعليق الأول والأفضل حتى الآن<br />أختى الكريمة: أرجوا أن يتسع صدرك لما يلى<br />أولاً:أراك تأثرت كثيراً بالمسميات الغبية التى تتردد كثيراً هذه الأيام فى وسائل الإعلام المختلفة مثل ,حجاب آخر زمن..حجاب ع الموضة....أو حجاب على أحدث موضة وأضيقها (كما وصفتِ) و أقول: الحجاب لا يقصد به غطاء الرأس حتى إذا إقترن بملابس ضيقة أسمينا ذلك حجاب ع الموضة ولكن الحجاب فى الشرع يقصد به الملبس بأكمله وله شروط ومواصفات حددها الفقهاء إذا إختل منها شرط لا يصبح هذا اللباس حجاباً أصلاً ولا يسمى حجاباً ...أما من موضوع (كدة أحسن ولا مفيش أحسن )<br />فالمظهرين سيئين ولكن بالطبع والتأكيد ومما لا شك فيه إن كدة أحسن من مفيش لأن مافيش دة سىء جداً بصراحة<br />ثانياً:وعلى غرار ما قالت الأخت منال..... يا أخت نهى المنتج الأجنبي حطم إقتصاد بلادنا وألقى به إلى الهاوية فإذا خرجت صناعة محلية وجب علينا أن نشجعها ونتحمل ما بها من عيوب حتى تقوم على قدميها فإذا قامت وإسترحنا من المستورد إتجهنا جميعاً إلى تعديلها و توجيهها (هل وصلت المعلومة؟؟)<br />والدعوة بالتدرج واستمعى لثالثاً لمزيد من التوضيح<br />ثالثاً: تقولين فى المقال(لا أنكر الموسيقى بعيدا عن الكلام رائعة و عالية جدا) ثم تقولين(ولا أنكر أيضاً لا أنكر أن جزء من الأغاني جيد جداً و مؤثر و مبذول فيه جهد) ...أليس كذلك؟<br />فإذا كانت الموسيقى كذلك والأغانى كذلك فعلام النقد إذن ؟؟<br />لعلك الان تقولين النقد على التمايل والرقص كما قلت فى المقال(و لكن هل نتمايل و نحن نذكر الله،) ..أليس كذلك ؟<br />إذن وجب أن يكون عنوان المقال (بنات سمك لبن تمر هندى) أو حتى (حفل سمك لبن تمر هندى) وليس (سامى يوسف سمك لبن تمر هندى)<br />لأنك بهذا الشكل جعلتِ (المقال سمك لبن تمر هندى)<br />رابعاً: مطرب أقزع يرتدى فانلة ضيقة وسلسلة فى رقبته ويتغنى بكلام قبيح وتستمع له فتيات يرتدين (مافيش خالص) وقد تصعد إحداهن إلى المسرح لمعانقته وتقبيله –كما يحدث-بالإضافة إلى فرقة المتبرجات التى تصاحبه إذا شبهته بمنشد يقول كلاماً دينياً ويرتدى ملابس محترمة يبتغى وجه الله تعالى بما يقول.. لمجرد أن الأخير حضرت لحفله بنات غير محجبات وغير متبرجات يكون هذا تطرفاً فى القول ونقداً هداما لا يرضى الله تعالى ...اليس كذلك؟؟<br />وإذا كانت الأغنية كلها قائمة على لفظ الجلالة فلا أعتقد أن هذا يضايقكِ إلى حد كبير وإذا كان هذا يضايقك فقد غنى كما تقولين أكثر من أغنية<br />خامساً:أنا معك بشدة فى موضوع البوسترات هذا وأرى أنه لا يصح مطلقاً لأنه يناقض الهدف الذى أقيم الحفل لأجله مثله مثل الملابس الضيق<br />osaamaaa@yahoo"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 49
subject = "osamaردود على بعض التعليقات"
text = "ردود على بعض التعليقات (واحد) لا أعرف كيف لا تثير غير المحجبة غرائزك وأدعوك لكشف طبى ..وليست هذه دنيه..وليس هناك شيء أسمة حجاب عمرو خالد...(وأنا آسف)(مصر) التعليق الأول........ اوافقك جداً(مصر) التعليق الثانى .....اوافقك ولكن هذا عمل طيب كما أن الصدقة عمل طيب أيضاً(سامى عمران ) مثل حلقة الزار..؟؟ إسمعى با أختك نهى إسمعى (وائل عباس) من الطبيعى أن تتفق مع سامى عمران !!!(عاشقة...) ربما كانت كلمة ( مؤيدة سامى يوسف أفضل)(محصلش) الصوفية ليسوا جميعاً سيئين ومنهم ناس معتدلة..(صاحب الرد على محبة المعلم). يا أخى . لماذا تأخرنا عن صناعة القنبلة النووية ؟؟لأن الشباب منشغل بالفن الهابط والراقصات والمواقع الإباحية أليس كذلك ..؟أعتقد أن الفن إذا إعتدل وسما عما فيه من الوحل والتدنى وبدأ فى توصيل رسالته المطلوبة نحو الشباب عندها أعتقد أننا سنصل الى النصر سريعاً وأعتقد أن سامى يوسف خطوة نحو النصر ولا أقول نحو القنبلة النووية فربما يكون النصر فى غيرها يا صديقى نحن تأخرنا عندما إتجه الشباب ال..... إلى الرقص وإتجه الشباب الصالح إلى التناحر والتقاتل فيما بينهم ..!!و أدعوك إلى الدخول إلى غرفة (المسيح هو الله )فى الياهو لترى إجتماع أصحابها على معاداة الإسلام ثم أدعوك بعدها للإنتقال إلى غرفة(محمد رسول الله)لترى تقاتل أصحابها على التصوف والإبتداع وأى الأمور يكون بدعة وأيها ليس ببدعة .........ولا حول ولا قوة إلا بالله(اسماعيل باشا) مش بإتفاق العلماء فيه علماء على انها حلال(حجاب عمرو خالد) شكرا بارك الله فيك فى النهاية أرجوا الا يغضب أحد منى وأنتظر تعليقاتكم وكنت اتمنى ان أسمع تعليقاواحداً من الاخت ياسمين شكرى صاحبة المقال (سامى يوسف مكسر الدنيا لنرى رأيها فيما قالته أختها نهى وخصوصاً أنها سمعت الحفل وهى الأولى بالرد من غيرها)osaamaaa@yahoo.com"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

