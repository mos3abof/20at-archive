subject = "الصوفية على حق ورب الكعبة"
text = "اولا السلام عليكم ورحمة الله وبركته<br />فيا اخوتى فى الله ارجوا ان نكف عن ذلك الهراء والعبث<br />فى امور تافهة وتتضيع الوقت فى اللغو والضيغنة هيا بنا نعود الى الاسلام الحق انا هنا اقف موقف المنصف الدافع عن المسلمين وعن اهل الله وعلماء الاسلام بعد ان اصبح الاعداء ينهشون فيها ولا تجد من يدافع عنها<br />لكن اذكرم بقول الرسول الكريم صلى الله عليه وسلم:لاتزال فريق من امتى منصرون الى يوم القيامة<br />اللهم اجعلنا منهم واياكم<br />الصوفية ياخوتى على حق لكن للاسف يهجم عليه الكفارة والمنفقين وللاسف بعض الجهلة من المسلمين وبعض الذين غرر بهم فى دينيهم فحسبنا الله ونعم الوكيل<br />لكن باشباب يجب ان نستغل الموقف لصالح الاسلام والمسلمين كيف هناك قد يكون بعض من سمو انفسهم بالصوفية والصوفية منهم برائة وهناك ايضامتشددون جهلة لايعلمون ماذا يقولون سوا الشتم والتكفير والقول بالبدعة وانا الصوفية فرقة من الفرق73 اى مثل الشيعة المنحرفة والعياذ بالله فحسبنا الله ونعم الوكيل فيا شباب الاسلام هيا نعيد لنكون الشمل شمل المسلمين من جديدحتىلو فرضنا ان بعض الصوفية اخطوا هذا ليس معناه ان الصوفية ككل خطا ولكم المثال فالننظر الى المسلمين اليوم هل هذا ان نترك الاسلام والعياذ بالله لكن للاسف بعض العلماء اخذوا الموضوع من باب الندية وبدء العراك هنا وهناك واتباع الشيخ فلان بقولون كذا فيرد هذا فيرد عليه الاخروهكذا تبدء الفتنة بيننا لذلك اقول نحن معش الشباب يجب ان نستغل الموقف لتهدئة الموقف ونفكر ونتكلم بالمنطق الاسلامى والذى اساسه الكتاب والسنة ونرد الحق الى اصحابه ونعلم المخطى خطاه وبذلك نتكامل ياشباب لولا تقصيرنا الوجب اننا الان ندعو الكفرة والمشركين الى دين الله الواحد الاحد وسنة رسوله فدعكم من هذا الهراء<br />فالاسلام فى اشد الحاجة لنا الان فاللهم فرج عن المة وانصر الاسلام والمسلمين هذا مااردت قوله لكم يا اخوتى فى الله وارجوا منكم ان تسمحونى ان قصرت فالله غفور رحيم فياشباب الاسلام هبوا فالعدو يترابص بكم الدوئر فاللهم انا نجعلك فى نحوره<br />اخوكم المعترب من ساحل العاج طالب بكلية اصول الدين<br />nad my Eamil: lamine-savane@hotmail.com<br />solo_dodo2000@yahoo.comو والسلام عليكم ورحمة الله وبركته"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

