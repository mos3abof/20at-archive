subject = "سنفورة مسنفرة"
author = "ول شئ الغناء حرام ,مادام فيه معازف .."
text = "عبد الله بن مسعود رضي الله عنه كان يفسر الآية الكريمة(ومن الناس من يشتري لهو الحديث ليضل عن سبيل الله بغير علم ويتخذها هزوا..) بقوله:والله الذي لا اله الا اهو هو الغناء.<br />وفي حديث للنبي صلى الله عليه وسلم انه قال من اشراط الساعة كثرة المعازف والغناء,والله المستعان.<br />أما يطلع لي شخص ويقول لي انما الاعمال بالنيات وان سامي يوسف كان قصده نشر الاسلام بطريقة حسنة فهذا قول احمق.<br />سبحانك اللهم وبحمدك اشهد ان لا اله الا انت استغفرك واتوب اليك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144754/http://www.20at.com/article.php?sid=740"

[[comments]]
order = 226
subject = "najeeb_60@hotmail .com"
author = "لسلام عليكم ورحمة الله وبركاته اما بعد انتم تقولن انا سامي يوسف الداعي الاسلامي"
text = "سوف يصبح مثل عمرو ادياب هل سالتم انفسكم قبل ان تقولو انه قد يصبح مثله هل انتم تشبهون الدعوة للاسلام بغناء عمر دياب الهابط المنحط البزيء طيب هل كنت انت في الفندق حتى حكمت عليه وشاهت طيب مازنبه في ان تكون البنات متحجبات و...... هل هو يعرف بان في الفندق بما وصفت هل اتى من قبله دعاة ولقو اهتماما مثله لا يا اخي ان المجتمع اليوم لايوجد به ايمان وان غنائه يعيد الامل للشعوب يا اخي انه يقول حسبي ربي الا الله الله الله لا الله الا الله هل يوجد اجمل من هزا الكلام يا اخي ارجز منك عدم الشك ان اغانيه تثير العواطف في المسلم تجاه الله والحمد لله رب العا لمين والسلام عليكم ورحمة الله وبر كاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144754/http://www.20at.com/article.php?sid=740"

