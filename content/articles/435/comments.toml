subject = "والله إني أحبه في الله"
text = "جزاه الله خير الجزاء ، وبارك الله فيه ، وجعل رحلته التي استفدنا منها كثيرا في ميزان حسناته ... آمين<br />أتمنى له التوفيق والسداد في حياته الدينية والدنيوية ، وأحلم أن أراه في الحقيقة هو وغيره من أحبابنا في الله كعمرو خالد وطارق سويدان وسامي يوسف ويوسف إسلام وغيرهم الكثير ، وإن لم نلتق بهم في دنيا فانية ، فيا أرحم الراحمين يا الله أجمعنا بهم في جنة قطوفها دانية ... قولوا آمــــــــين<br />الريـــــــان"
