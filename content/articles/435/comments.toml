[[comments]]
order = 133
subject = "nuz.ts@adia.ae"
text = "أخوكم من سوريا<br />إن الساعات التي يمضيها كل منا في المهاترات وشتم بعضنا البعض هي أغلى من أن تهدر بهذه الطريقة ...<br />وإليكم هذه القصة: مر القاضي إياس بن معاوية برجل يسب الحجاج سباً شديداً، فقال له: هون عليك يا أخي فوالله إن أصغر ذنوبك أشد عليك عند الله من أعظم جرم ارتكبه الحجاج.<br />فليشتغل كل منا بنفسه، لأن الزمن مطية سريعة تسير بنا نحو المصير المحتوم \"الموت\" أما من يتجرأ على عباد الله بالاتهام بالكفر والابتداع ويسب الصوفية فنعذره لأنه كما يقول الشاعر:<br />قد تنكر العين ضوء الشمس من رمدٍ وينكر الفم طعم الماء من سقم<br />وليهيأ نفسه للعرض على الله ليتحاج مع من اتهمهم بالكفر والابتداع: من أمثال الإمام الغزالي والإمام النووي والإمام الجنيد وغيرهم الآلاف من علماء هذه الأمة ، فوالله لا يحسد على موفقه أمام الله سبحانه وتعالى من كان هؤلاء خصومه.<br />\"ثكلتك أمك يا معاذ !!! وهل يكب الناس على مناخرهم في النار إلا حصائد ألسنتهم\" أو كما قال صلى الله عليه وسلم.<br />أما الهجوم على المصريين فما أراه إلا من إنسان تائه سيئ الخلق، فوالله عاشرت المصريين في الإمارات \"حيث أقيم\" ورأيت منهم صفات لا توجد في غيرهم مثل التواضع والطيبة ومحبة الناس وحسن الجوار وكثير من الأخلاق الحميدة.<br />وسلامي للجميع ،،،، والله الموفق"
archived = "2005-03-07"
capture_url = "https://web.archive.org/web/20050307092859/http://www.20at.com:80/article.php?sid=740&amp"

