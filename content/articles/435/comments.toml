subject = "عييييييييييييب"
text = "عييب أوي يامسلم يا ملتزم يا فاهم تشتم أخوك أو ترد عليه بالطريقة دي عييييييييييييييييييييب أوي<br />ده حتى سامي يوسف (الوحش الإف كما وضحت حضرتك)بيكلم الناس أحسن منك.<br />فعلا أخي كنت خير ممثل للمسلم الصح بهنيك على طريقتك وبدعو كل المسلمين يشتموا زيك.<br />قال رسول الله صلى الله عليه وسلم:\"إنما بعثت لأتمم مكارم الأخلاق \""
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

