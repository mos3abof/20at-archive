[[comments]]
order = 81
subject = "ام محمد من العراق"
text = "اريد ان اقول فقط ، لماذا نحن المسلمين ننظر الى الجانب السيء من الامور فقط ، ننظر الى النصف الفارغ من الكاس دائماً . لماذا الاتهام والتفسير الخاطئ والحكم على الامور من الناحيه السلبيه ، هذا ليس من اخلاق الاسلام على الاطلاق ، انا شخصياًافرح كثيراعندمااسمع ان اجنبيااستسلم واعتبره انتصاراً وادعوا من الله ان يدخله فسيح جناته فكيف عندما نراه وهو الاجنبي يدعوا الى الاسلام ، في حين نحن نخشى التحدث عن الاسلام ، في الحقيقه نحن المنافقين وهو الصادق وانا اشعر انه اثر عليه وعلى الكثيرين من السملمين فقد جعلنا ننتبه الى ذكر الله في اوقات الفرح ايضاًوليس الحزن فقط واشعر عندما اراه بانه صادق في كل مايقوله وهو بغنائه لايثير الغرائز والافكار الرخيصه ونحن الامهات بالذات نحتاج الى هذا النوع من الاغاني وشكراً."
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

