[[comments]]
order = 85
subject = "السلام عليكم ورحمة الله وبركاته"
text = "لي بعض التعليقات على مقالتك يا اخت نهى :<br />1- يا اخت نهى انت لا تري انه بدل ان تنتقدي الحفل انه يجب ان تشجعيه اولا لانه بتعليقك بصورة سلبية تفدين اعداء الدين بان يقولوا انظروا حتى الذي يصبح منهم مسلم لا يقدروه ويذموه ولم يخترعوا بعد وسيلة لكشف من هو\\هي الملتزمة الحقيقية اي اذا رايت محجبات ويتصرفن عكس ذلك فلا داعي ان تشوهي صورة المحجبات فانا متأكدة ان كل من يقرا هذه المقالة سيأخذ فكرة سيئة عن المحجبات.والاولى ان تنتقدي عمرو ذياب وباقي والمطربين الخلعاء والذين اغانيهم بلا معنى وليس تنتقدي شخص يصلح المجتمع<br />والسلام عليكم من فلسطين تحب الاسلام ومصلحة المسلمين."
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 86
subject = "السلام عليكم ورحمة الله وبركاته"
text = "اولا رد على سؤالك ما الفرق فأنا اعلم انك تعلميه علم اليقين ولكن تحاولي تجاهله ومع ذلك سأجيبك اولا هو ان الفرق شاسع وكبير وهو ان المنشد سامي يوسف يصلح المجتمع ويساعد في بناء جيل ممتاز اما عمرو ذياب فعكس ذلك يهدم المجتمع ويفسد الشباب وان سامي يقدم رسالة محترمة وياعد في بناء المجتمع وبناء واجيال نافعة فكل يوصل الدعوة بطريقته وعمرويخرب اجيال ويضيع وقت وفي النهاية اشكرسامي لالتزامه بتصرفات الشاب المسلم الملتزمووفقك الله وثبت خطواتك وجعل كل ما تفعله في ميزان حسناتك واكثر من امثالك. بنت تحب مصلحة الاسلام والمسلمين من فلسطين<br />عرب ال48"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 87
subject = "مصريه"
text = "السلام عليكم ورحمته الله وبركاته.<br />ردى على الاخت من عرب 48 هل المنطقى اننا نقول ان عمرو دياب هو السبب فى تدمير الشباب والمجتمع ولا اننا نقول ان السطحيه والتفاها وعدم الثقافه هم من ضمن اسباب ضياع الشباب وتدمير المجتمع لان اكيدفى اسباب كتير هى اللى بتضيعنا ولا المفروض اننا نعلق اخطانا على شماعه الغير يا أختى العزيزه مش عمرو دياب هو السبب لوحده فى اسباب كتير وكلنا عارفينها. عمرو دياب وعمرو خالد وسامى يوسف وحتى الشيخ الشعرواى رحمه الله كلهم بنى ادام وكل ابن ادم خطا ومفيش حد كامل غير الله عز وجل ولا احد يعلم من منهم افضل عند الله سبحانه وتعالى ."
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 88
subject = "السلام عليكم ورحمة الله وبركاته"
text = "الى الاخت مصرية انا لم اتعمد عمرو ذياب او غيره ولكن كان ردي لانها اشارت لعمرو ذياب وانا مصرة على راي فعمرو ذياب كباقي مطربين هذا العصر يفسدون اكثر مما يبنون فلا نبقى نهتم بسفاسف الامور كل ما فهمت من كلامي عمرو ذياب او غيره المهم المضمون وليس من يكون عمرو ذياب وانا لم اقل ان عمرو هو الوحيد الذي دمر الشباب ولكن جاء تعقبي على الحدث وعلى الموضوع انت تتحدثي بشكل عام فلو اردت ان اعد لك اسباب دمار الشباب لما انتهيت ارجوا ان تفهمني وانا لم اقل لك انهم لا يخطأوا فجل من لا يخطأ ولكن عندما تري الاستاذ عمرو خالد ورسالته تحترمية ومستحيل ان يكون هذا الشخص عكس ما يقدم لانه لا يعقل ان يدعوا الناس بهذه الطريقة وهو نفسه عكس ذلك فلا تخطأي حكمك على الاشخاص والفرق واحد فكيف تحكمي على شخص انه شاطر في المدرسة الا عندما تريه في الصف يشارك وتري في النهاية ان علاماته كانت متوقعة فانه مجتهد فلا يعقل ان يسقط الا لظرف فارجو ان تفمني.( المعادلة شخص محترم =رسالة محترمة)<br />والسلام عليكم<br />من فلسطين تحب مصلحة الاسلام والمسلمين عرب ال48."
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
