subject = "بنت الكويت"
text = "السلام عليكم ورحمة الله وبركاتة احب اقولكم في البداية انا اول مرة في حياتي اكتب او اشارك في منتدى.وبخصوص موضوع سامي اليوسف انا اشوف ان الي يقول عنة شلون ينشد باللغتين احب اوضحلة ان هدف سامي هو توصيل الرسالة باللغة القران ولغة العرب واللغة الثانية هي لغة العصرولغة الوقت الحالي وبالعكس لما ينشد بالانجليز الامريكان واو اي دولة اخرى اجنبية لما تسمعة يفهمون اللغة او الكلام الي يقولة بس اذا تكلم باللغة العربيه فقط الي راح يسمعة بس العرب والي يفهمون لغة العربيةوانا كنت اسمع اناشيد دينية بس سامي خلاني اسمع مع موسيقى يمكن هذا عيبة بس انه ينشد مع موسيقى والي يروحون لحفلاتة ويرقصون اقولهم شنو خليتو الفرق لما تروحون لحفلة سامي وحفلى اي مطرب وانت قاعد ترقص اذا تبي تروح لحفلتة اسمع اناشيدة وتعمق ي كليماتة اتمنى اني ما طولت عليكم واحب اسمع رايكم في تعليقي على الموضوع؟؟؟؟"
