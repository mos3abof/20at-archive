[[comments]]
order = 75
subject = "فارجو النظر للجوهر و ليس للمظهر-- بنت فلسطين"
text = "اعتقد اننا جميعا متفقون بالرفض التام لكل مظاهر الرقص و التهييص التي تحدث في حفلات سامي يوسف... و انا مع الراي القائل ان هذه البدايه و فيما بعد سوف يكتشف الشباب ان ليس هذا الاسلوب المناسب لسماع الاغاني الدينيه و لكن المسأله مسألة وقت مش اكثر.. لكن الملفت للانتباه هنا ان اول من اظهر هذا المنشد هو الداعيه العبقري عمر خالد... الصراحه انا لم اكن اعلم هذه المعلومه من قبل و سمعتنا الان من حديث بعض الاخوه.. و اللافت للنظر هو ذكاء هذا الداعي الغيور على الاسلام و الدؤوب و المصر على محاربة كل مظاهر الفساد في مجتمعنا الحالي... عمر خالد لاحظ ان الغرب يحاول تشويه صورة المسلمين و اظهار اي داعيه او ملتحي بمظهر ارهابي فظهر هو بحله جديده تخاطب عقل كل طبقات المجتمع سواء العربي او الغربي, فعمر لايختلف في المظهر عن اي واحد من المهاجمين للاسلام لكنه يختلف بالجوهر كليا و يعرض لكل العالم صوره رائعة مشرفه للمسلم المتمسك بتعاليم دينه و بنفس الوقت بشكله المعاصر.... و الان لاحظ الهجوم الغير عادي على الشباب من خلال الاغاني الاباحيه بحيث ان القنوات الفضائيه الخاصه فرضت علينا هذا الشكل من المغنيين مشوهه كل صوره للغناء العربي و حاثه الشباب العربي على الانحراف من خلال الاجساد العاريه التي نراها كل يوم على هذه القنوات خاصه قناة ميلودي التي تعرض كل يوم مغني اسوأ من الذي يسبقه بمشاهد اباحيه تسيء للمجتمع العربي كله ضاربه بعرض الحائط كل مبادئنا و تقاليدنا و عاداتنا بحيث انه يصعب علينا عند رؤية الاغنيه للوهله الاولى معرفة اذا كانت عربيه ام اجنبيه... و في ظل كل هذا الفساد الاعلامي ظهر عمر خالد ثانية يعرض علينا منشد مهذب خلوق باغاني ذات كلمات هادفه و معاني رائعه عن الاسلام ليحارب فساد المجتمع بنفس اسلوبه كما فعل سابقا.. فالهدف من ظهور هذا المنشد ليش عمل حفلات و عرض كلمات اسلاميه على الحان مثل ما يظهر لنا و لكن هو ابعد من ذلك بكثير فهدفه هو مواجهه هذا الطوفان الذي يغزو شبابنا و محطاتنا الفضائه و عرض صوره مختلفه للمسلم غير التي تحاول اظهارها مثل هذه القنوات بحيث يرى الجيل الحالي ان هناك شكل مختلف للمسلمين ليس الشكل الراقص العاري الذي يظهر لنا حاليا.... فانا احيي عمر خالد على ذكاءه و ابصم له بالعشره انه يفاجئنا في كل وقت بطريقه جديده لمحاربة غزو الفكر الغربي على مجتمعنا... و اهنئ نفسي و اهنئ الاسلام بوجود مثل هذا الداعي المتمسك بدينه و بنفس الوقت مواجه كل الاساليب الحديثه لتشوييه هذا الدين... فانا الصراحه كل ماشوف هذا الرجل اقول فعلا لسه الدنيا بخير..<br />فارجو يا اخواني النظر لجوهر الموضوع و ليس للمظهر.. فظهور مثل هذا المنشد فكره عبقريه لا محال لان ليس كل الناس تذهب للمساجد و تسمع البرامج الدينيه و لكن الاغلبيه حاليا تابع قنوات الاغاني خاصه الجيل الصغير من الشباب فظهور مثل هذه الاناشيد هو مكسب للاسلام و مكسب لنا جميعا..."
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

