[[comments]]
order = 156
subject = "فلسطيني"
text = "مرحبا انا فلسطيني<br />اول شي عيب نحكي عن بنات مصر او انو احنا احسن منهن هادا رد على بنت عرب اسرئيلي<br />تاني شي هوا مزبوط عايش بمجتمع غربي بس هو عندو دين اكتر من اي واحد عايش في مجتمع اسلامي لانو ما نولد مسلم هوا عاش مسلم يعني مو فطرة ابوي مسلم انا بدي اكون مسلم لاء هوا مش مسلم بس صار مسلم كيف لانو شايف شو في بالاسلام وشايف شو في بالديانات الاخرى علشان هيك هوا صار مسلم يعني مو فطرة عندو الاسلام<br />تالت شي في شي منكم حكى انو كان لازم ينهي الحفل لاء هادا اكبر ينهي الحفل لانو ما كان ئاصد انو البنات يرئصو او يعملو اي شي هوا كان ئاصد حفلة تكون ومنها يكون في دعوة يعني ما نلومو نلوم يلي رئصو ازا في عندهم دين بعدين عمرو ما كان الحجاب بدل على الاسلام في كتير محجبات انا بنظري هنا مو مسلمات بس هنا بحكن عن حالهن مسلمات هوا الحجاب بس غطي شعرك طيب والبائي وين راح لما نلبس محزئ وهيك اشية وعلى فكرة انا مسلم بس ما بصلي يعني فيكم تحكو اني مش مشلم مو هيك بس انا راضي عن حالي ولما الله بدو يهديني بصلي وكمان بطلع على البنات انا ازا البنت مش ضابة حالها ما بئدر اغض البصر لانو غريزة هادا كيف بدي اغض البصر ازا غضيتو مرة المرة التانية ما بئدر نصلح حالنا بعدين نحكي عن غيرنا مو هيك جماعة والسلام ختام اي استفسار ارسلو مسج على هادا الايميل<br />bat_man_love_3@hotmail.com"
archived = "2005-03-07"
capture_url = "https://web.archive.org/web/20050307092859/http://www.20at.com:80/article.php?sid=740&amp"

