subject = "مصر"
text = "ليس العيب في سامي يوسف بل العيب فيمن يحضرون الي الحفل ويحتفلون كانهم ينافسون حفلات عمرو دياب انا اقول ان العيب ايضا ليس في الصلاه بل العيب فيمن يصلي فلو ان من صلي سرق فهل العيب في الصلاه ام في الشخص نفسه رساله الي كل الفتيات والفتيان ما اريده ان اقوله لكم هو الفهم افهمو دينكم جيدا وعلي العموم هذا تطور طبيعي للصحوه الاسلامي فهي يجب ان تمر بمراحل عده حتي يظهر الجيل الذي ننشده نعم نريد ان تتكرر تلك الحفلات لكن نريد من الشباب الاسلوب الراقي الذي علمنا اياه الاسلام<br />فنحن امه التميز والحضاره والحب والخير والالتزام بكل شيء نحن امه الاسلام"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 8
subject = "أنا نهى"
text = "أود أن أشكر من نشر المقال لكن هناك أشياء ذكرتها تم حذفها لذا سأعرض ما تم حذفة و ءأسف للموقع على هذا و لكن محتاجة الناس ترى و تشاهد معي هذة اللقطات<br />أعرف أني سأثير غضب الكثير بما سأقول ، و لكن هذا رأيي و هكذا شاهدت ما يحدث فكل واحد له وجهة نظر ، في البداية عند وصولي مكان الحفل بملحق فندق من فنادق مصر الكبيرة ، كان المكان من الخارج يكتظ بالسيارات ، و في الدخل عند باب القاعة يكتظ بالناس و معظمهم من البنات ثم الشباب و قليل من كبار السن دخلنا القاعة و انتظرنا الحفل و لكن تأخر لسوء التنظيم<br />قام بتقديم سامي يوسف الإعلامي عماد أديب بأنه شاب بشوش الوجه ، خلوق ، ينتهج المنهج الصوفي ظهر سامي يوسف على المسرح وسط تصفيق الحضور و حماسهم و هتافهم ، ألقى التحية و شكر أ/ عماد أديب و أوضح انه لا ينتهج أي نهج في غنائه و لكن هو يراه دعوه في سبيل الله لعل الله ينفع به<br />المهم بدأ الحفل ، لا أنكر الموسيقى بعيدا عن الكلام رائعة و عالية جدا فهو دارس بأكاديمية الموسيقى بلندن ، أما عن الكلام فلم استوعب فكرة أن تقوم أغنية كاملة على لفظ الجلالة \"الله\" و كأننا في حلقة ذكر كالتي تقام في الموالد و لكن الذاكر أجنبي ، سأل الحضور هل تحبون أن يكون الغناء هادئ أم تحبون التصفيق و التهيص ، صرخ الحضور تهيص تهيص و بدأ التصفيق و تمايل البنات في الصالة و بنات أخرى تحمل لافتات باسمه و يعبرون عن حبهم على أنغام الموسيقى و الذكر، فكلامات الأغنية كانت تقوم على الشهادة \"لا إله إلا الله محمد رسول الله\" ، لست ضد التهيص و الاستمتاع و الفرفشة و لكن هل نتمايل و نحن نذكر الله (يعني نقول الشهادة و نحن نرقص و نصفق) لم أفهم هذا الوضع ، لا أنكر أن جزء من الأغاني جيد جداً و مؤثر و مبذول فيه جهد لكن الجزء الأخر إما مقتبس مع توزيع مختلف و إدخال كلام انجليزي و الجزء الأخر كأننا في المولد و لكن يبقى جمال الموسيقى و محاولته الجادة لعمل شيئ مختلف ، و لكن أرجو احترام ذكر الله ،أشياء أخرى سأمر عليها مر الكرام و هو البوسترات التي توزع له حتى يقوم بشرائها الشباب و البنات ( المتدينين) و تعليقها بغرفهم ، أثار فضولي نقول نريد شيئا مختلف و لكن ما أراه هو اختلاف في الكلمات و لكن لا اختلاف في التصرفات خااااااااااالص ما يحدث مع عمرو دياب هو ما يحدث مع سامي يوسف أين الفرق !!؟<br />البنات و ملابسهم الغالبية كثير منهن محجبات على أحدث موضة و أضيقها و كمان مفرفشة و مدندشة زي الأغاني بالضبط فظهر تساؤل عندي ليس له إجابة إلى الآن هو كدا أحسن من مافيش خالص و لا مافيش خالص أحسن يعنى هل هن محجبات أم لا ؟<br />أما عن الراعيين الرسميين للحفلة شركات مختلفة بتوجهات مختلفة و لكنهم اجتمعوا على المكسب (اللى تكسب به العب به) عايزيين دين أدّيها دين عايزين غيره أدّيها بردوا كله شغّال."
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

