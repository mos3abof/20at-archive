text = "سامى يوسف بهذه الطريقه يعتبر دعايه اسلاميه عربيا قبل انيكون غربيا لان الاغانى الاسلاميه فى البلدان العربيه لايهتم بهاالا الشباب الملتزم المسلم فقط وايضا عالميا فهذه خطوه كبيره لكى يفهمنا الغرب اننا غير متشددين وانامنا الملتزم من يغزنى اسلامى اخوكم فى الله / أكرم البكرى وارجومن الاخو ان ترسلو لى اغانى النشد الاسلامى سامى يوسف على البريد الخاص بى وهو akrambk2002@yahoo.com"
