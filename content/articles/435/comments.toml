[[comments]]
order = 90
subject = "هذا قولك يا نهى (فلنرى راي واحد نصراني)"
text = "الأخت نهى قالت رأيها حسب ما أستقبلت و ألقت بالأخطاء على التجربة، تعالوا نشوف تعليق واحد مسيحي قال الأتي: قالي انا سمعت اغنية لواحد مسلم و بكيت فيها ، هو معقول فيه واحد بيحب حد بالمنظر ده، و بدأت سيل أسئلة عن مين محمد (صلى الله عليه و سلم)<br />انا والدتي بكت لما قولتها معاني النشيد،<br />اختي عيب لما يكون ده رد فعل نصراني و احنا المسلمين يكون رد فعلنا ده، اما اي اخطاء حدثت ففاعلوها هما المسئلون عنها ليه ننسبها لواحد عمل حاجة كويسة و ننقده احنا و احنا و الله لسه ماسالناش لحد دلوقت ايه اللي عملناه في حياتنا فايدة للأسلام<br />الله اجمعني مع نبيك محمد ، اللهم اجمعني معاك يا حبيبي يا محمد"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

