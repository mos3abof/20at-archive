text = "السلام عليكم ورحمة الله جزي الله عنا الاخت نهي خيرا ونلتمس لها حسن النية ولكن احب ان اعلق علي الذين ليس ورائهم الا النقد والذم والشتم وهما ما بيعملوش اي حاجة في الدنيا غير كده ياخي مش عاجبك اعمل انت حاجة احسن من الاسلوب الذي اطلق عليه في رايي \"المتخلف \" وربنا يرحمنا من اللي فاكرين نفسهم متديينين \"بالشكل \" بس طبعا مفهوم. سيبوا سامي يعمل حاجة للاسلام وخليكم قاعدين في بيوتكم لحد ما تموتوا وربنا يرحمنا ويرحمكم"
