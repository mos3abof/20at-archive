text = "لا يوجد في الاسلام التصوف وهو مصطلح للناس الرقاصة<br />اما التصوف الديني لا يوجد فيه موسيقى وانما هو الزهد والعباده<br />اما الموسيقى فهي حارم باتفاق العلماء<br />والله من وراء القصد<br />بعض العرب ودك على الكبد ياطاه<br />وبعض العرب ودك على الكبد تاطاه<br />عــ اسماعيل ــربي مســ باشا ــلم"
