[[comments]]
order = 55
subject = "التفكير قبل الاندفاع"
text = "السلام عليكم ورحمة الله وبركاته<br />اولا كلامك عن الاخ سامى يوسف بهذه الطريقه هو اندفاع وقليل من عدم الاحترام لاننا وللاسف نحكم على الاشخاص من ثقب ضيق فى نافذة الحياه ونريد ان نشتهر وان يتكلم عنا الناس عندما نعارض شخص بدأ فى اول طريق الشهرة فما العيب عندما قدم الاخ سامى على انه شاب بشوش الوجه وخلوق فهل رايتى غير هذا هل ظهر فى وجهه العبس ام انك عرفتى بان اخلاقه ليست حميده فانا اطلق عليه كلمة اخ لاننى اعرفه وتعاملت معه كتبت عنه موضوع وقمت بعمل حوار حى معه ولم اجد منه الا كل الخلق فكان ينادينى بالاخت وهذه الكلمه التى لا تعرفيها انت بكلامك مع غيرك من المسلمات والملاحظ من اسلوبك فى الكتابه هذا الاخ الكريم الذى تنتقضى فيه انه انجليزى فقد علماه والديه وربياه فى هذه الحياه الغربيه والتى تقتظ بالمغريات والفتن على الاسلام والاحترام والذى اعتقد انه قل فى كثير ممن ينطقون العربيه فلم يتمايل سامى ويتراقص وهو يغنى وليس عليه ان يطلب من كل فتاه كانت تفعل مثل ذلك ان تذهب وتطلب من والديها ان يعيدا تربيتها مرة اخرى ولست بمن اعطاهم دار الافتاء الاحقيه فى ان تحرمى وتحللى ان يكون لفظ الجلاله فى الاغنيه ولا عيب فى ان تكون بالاغنيه كلمات بالانجليزيه لانها لغته ولم يقتبسها أما تقييمك بان جزء كبير من الاغانى بأنه جيد جدا فنصيحتى ان تذهبى وتتعلمى اللغه الانجليزيه حتى تعلمى ان اختيار الاخ سامى لكلمات اغانيه هى من ارقى التعبيرات اللغويه فى اللغه الانجليزيه ومما يظهر ضعف الافتراء على سامى فى كتابه موضوعك هو عدم التحدث عن الموسيقى لانها درست فى لندن .أما مرار الكرام والذى ذكرتيه فى موضوعك وهو البوستر فهذا جزء من الدعايه ويعرفه من قام بدراسة فن الدعايه والاعلان وهولم يكتب على البوستر من فضلكم يابنات ضعونى فى حجراتكن ولكن على كل ام واب ان يحكموا بناتهما وكيف لك ان تضعى الاخ سامى وعمرو دياب فى كفتى ميزان واحده فهل شققتى صدره وكشفتى عن ما بداخل قلبه وعرفتى ايمانه حتى تقولى عليه هذا الكلام هذا الشاب الذى لم يتجاوز الخامسة والعشرين من عمره ترك اهله وذهب الى مصر ليتعلم اللغه العربيه والتى هى فرض على كل من ينطق بغيرها ان يتعلمها فهذا هو جهاده فهل جاهدت مثله هل عرفتى انه استخدم صوته للدعوه فى سبيل الله فقد تتساءلى كيف وسأوفر عليكى السؤال وسأقول لك مثال صغير وهو ابنى فى السابعه من عمرة ويذهب الى المدرسة هنا فى لندن ويتعلم الغناء باللغه الانجليزيه وعلى كأم ان اجد له البديل قبل ان اطلب منه عدم القيام بالغناء ووجدت أغانى الاخ سامى جزاه الله عنا كل خير ووجدت ان أولادى جميعا انجذبوا اليها وبدأوا فى التغنى بها وتعليمها لاصدقاءهم الغير مسلمين فهل رأيتى كيف افادنى هذا الشاب بصوته وموهبته التى وهبها الله اياها .<br />فها نحن ليس لدينا شئ سوى التعليق والكلام الذى لا يفيد ونسينا أهم شئ أننا أخوة فى الله وعلينا أن نبدل الهدم بالبناء لاعلاء كلمة الله ولنشر دينه فالقلم الذى كتب به هذا الكلام ضد الاخ سامى كان ولابد ان يكتب له ولشكرة والدعاء له بالنجاح .<br />وأخيرا أقول سبحانك اللهم وبحمدك أشهد أن لا اله الا انت أستغفرك وأتوب إليك .<br />سها السمان<br />صاحبة مدارس بالمملكة المتحده"
archived = "2004-12-07"
