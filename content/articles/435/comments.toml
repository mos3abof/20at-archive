[[comments]]
order = 13
subject = "kokbi_asmr17@hotmail.com"
text = "اكرمك الله يا سامي اليوسف على ما بذلته من جهد من أجل ايصال بعض المعاني المهمة لنشر الدين الاسلامي وايصالها للشباب. فيا ايها الذين تعلقون على المقال سامي اليوسف لم يقم بتقديم هذه الانشودة فقط من اجلكم بل ايضا\" من اجل جميع الشباب وهنالك شباب بعيدة عن طاعة ربنا ولن يأتي اليوم الذي سوف يقرأ به سورة من القرآن لذلك كانت هذه طريقة مختلفة لايصال المضمون.. والى متى سوف تنظرون ايها الشعب العربي الى الموضوع من الناحية السلبية يا ريتني بقدر اصل للبلاد العربية لاخبرهم بما تعمل الشعب الفلسطيني من ظروف معيشته... ليست الديانة بتحجب فقط يا بنات وليست الديانة فقط بالصلاة يا شباب اتقوا الله في اعمالكم ونياتكم.. صدقوني مهما يكون انا متاكد سامي اليوسف كانت نيته من وراء الانشودة هي نشر الدعوة الاسلامية وليست تعليقاتكم التي من خلالها نستطيع أن نستنتج ان الخطأ بكم ايها الجمهور وليست بالداعية... جزاكم الله خيرا\" اخوكم محمد من فلسطين لمراسلتي الايميل في اعلى الصفحة. وشكرا\""
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

