subject = "هناك فرق"
author = "لسلام عليكم ورحمة الله وبركاته"
text = "أخي هناك فرق يجب أن نبينه بين عمرو دياب وسامي يوسف ،،سامي يوسف ينشد بلا إله إلا الله على العكس الآخر ،، سامي يوسف يذكر الرسول -صلى الله عليه وسلم-وليس يذكر .............<br />لكن لي وجهة نظر في المتحجبات التي تمايلن على أنا شيده ،، هنا يكمن الخطا ولذلك يجب ان نوضح انه ليس من الصواب نحمل سامي يوسف خطأهن ، لذا انا معك في ناحية وضدك من ناحية أخرى<br />جزى الله \"سامي يوسف\" على الخير الذي قدم من الاناشيد حول محمد عليه الصلاة و السلام - أحسبه والله حسيبه أراد ذلك وكانه هذا هو هدفه<br />ولكم جزيل الشكر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144754/http://www.20at.com/article.php?sid=740"

