[[comments]]
order = 31
subject = "سامي البوسف؟"
text = "الى الاخت نهى السلام علبكم ورحمة الله وبركاته<br />في البداية احب ان اقول انى والحمد لله محجبة واعجبت جدا جدا بكلمات الاغاني التي غناها سامى اليوسف وقلت يا ريت لو كل الاغاني تكون هكذا ولم اشعر للحظة عند سماع الكلمات والالحان باي رغبة في التمايل او الرقص عليها وعندما رايته في احدى المقابلات التلفزيونية وسمعت وجهات نظره احنرمته وانا متعجبة جدا مما وصفته عن حفلاته وكنت اتوقع منه ايقاف الحفل عند رؤيته للبنات المحجبات ترقصن لان هذا ليس ما وصفه كهدف واتمنى ان تكون هذه الحقلة بمثابة محطة ايقاظ له ويستخلص منهاالعبر<br />وشكرا<br />رولا"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 32
subject = "لحظه من فضلك"
text = "لاحظواياجماعه ان سامي يوسف عاش في مجتمع غير مجتمعنا بعيد جدا عن الدين يعني كويس قوي انه فكر ينشر الدين في مجتمع بيهاجم ويضطهد المسلمين ومع ذلك علا صوته دون خوف وانتشر ودخل صوته القلوب وتحدثه في اغانيه بالانجليزيه كان علشان الغرب يسمعوها زي العرب بالضبط وده عين العقل وكونه سال الشباب في اول الحفل بيحبوا الهيصه ولا لا فقصده كان اختياره للحن اللي بيفضلوه صاخب ام هادي وهو لم يقل لهم صقفوا وهيصوا معاياوهما مسؤلين عما حدث وبعدين بالنسبه لمجتمعه الاصلي كان مجتمعا اكثر احتراما اما عن لبس البنات ياريت تبداي بنفسك وتنصحي المقربين منك وتقدمي النصيحه بلطف اكتر من كده وتدعي بالهدايه للضالين والسلام عليكم ورحمه الله وبركاته"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 33
subject = "المحبة للمعلم"
text = "السلام عليكم ورحمة الله وبركاته:<br />صراحة انا مستغربة من بعض التعليقات،يعني بدل ما انو بعضكم بعلق على سامي يوسف ليش ما حضراتكم تتفضلوا وتسمعونا اناشيدكم الدينية،يعني صراحة حيانة فينا واحد مسلم متل سامي بدل ما انا نشكر الله خمسميت مرة كمان مش عاجبنا.<br />كمان بحب احكي للي مش عاجبهم انو يغني بالاجنبي هو اصلا بدو يضل في مصر لمدة شنة عشان يتعلم اللغة العربية فبتمنى انو بدل ما احنا بنعلق على اناشيد سامي الي جاول فيهم انوا يوصل فكرة الاسلام عن طريقهم روحو علقوا على بقية المغنيين والمغنيات الي بعملوا على خراب دينا مش تاركين هدول ومبلشين في سامي .<br />وبتمنى انوا الاقي كتيييير متل سامي ."
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

