subject = "انا من فلسطين (من عرب اسرائيل)"
text = "كنت مفكره انه سامي يوسف بغني لكل الناس لاكن تبين لي انه بغني بس اللاغنياء والمتوسطين من حاله ماديه لاكن انا اذا بدي احضر حفله لسامي يوسف مع اني ولا عمري حضرة حفله مش دينيه لانه انا متحجبه واهلي متدينين جدا لو كان ثمن التذكره للحفلة سامي يوسف 1000 يوره بحذره لانه ابي واللحمد لله يملك المال الكافي لانه ولا عمره اخذ مال حرام الله دايمه عله لاكن بتبرع فيهن لئهل الضفه وللفقراء احسن وشكرا"
