subject = "lamine_savane@hotmail.com"
text = "الذين يشتمون الصوفية هولاء من الملسلمين ام من اين<br />دعوة للنظر* واذا كونوا مسلمين هل هذه هى شيم المسلمين لا ورب الكعبة ماهذا الذى علمنا الرسول اياه فارد على الذى يقول (ان الصوفية حششين) ادعوك لتنظر لنفسك قليلا هل هذا يجوز ام ماذا ولنفرض ان الصوفية على خطا هل انت دعوتهم الى الحق لا بل لقد ذممتهم بما لا يليق بهم فحسبنا الله ونعم الوكيل هكذا علمنا مشيخينا ان نر االاساءة بالاحسان فهداك الله يااخى يا ابن الاسلام ان كنت كذلك<br />وعلى فكرة انا لست صوفيا بل محب لكل من يحب الله ورسوله وهذا مارايت فى الصوفية وما الاخرين لم اجد سوا الشتم والقذف واللعن وهذا ليس من الاسلام فى بل هذا يوشوش صورة الاسلام والمسلمين<br />وارجوا ان تعذرونى فى اى تقير منى والله الموفق وشكر للسادة المقمين على اداراة الموقع على اتاحة الفرصة للنقاش الحر السلامى الهادف ان شاء الله<br />اخوكم المغترب من ساحل العاج المسلموابلغ من العمر 20 عاما<br />طالب بكلية اصول الدين<br />والسلام عليكم ورحمة الله وبركته"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

