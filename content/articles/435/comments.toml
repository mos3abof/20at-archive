[[comments]]
order = 58
subject = "لا يااختى"
text = "السلام عليكم ورحمة الله وبركته<br />ام بعد ف ا انا معك ان كلامك صحيح فى ان بعض الاخوات المسلمات تمايلان اثناء عرض الكلماتالجملية والتى تجعل الشاب يترك ويبتعد عن تلك الاغنيات الحمقاء وآسف على هذا الكلمة لانها ليست من طبعى ولامن طباع المسلمين الاتقياء لكن الله يهدى اليه من يشاء وما اردته هو ان اتلك الاناشيد تسعدنا على الطاعة والرجوع للهاوية الدينية لكن انحصكى ان تكون طريقتك الى الدعوة خير من ذلك لانه غير ملائم<br />بل هو هدام ومشوش وفيه بعض الاشياء الغير مفهومة وما اعارف ايش المقصود من تلك الرسالة وما المضمون<br />الصراحة ارجوا ان توضيحى بدون غيوم وانا اسف ان كان كلامى فيه بعض التقصير لنى شاب مسلم مغترب من ساحل العاج وانا فى مصر لادرس الدين وانا حاليا فى كلية اصول الدين ادعوا لى بالتوفيق<br />واشكر السادة المشرفين<br />والسلام عليكم ورحمة الله وبركته"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

