[[comments]]
order = 184
subject = "صدق"
author = "سم الله الرحمن الرحيم"
text = "سامي يوسف مطرب \"شباب\" أي بما معناه أن أغنياته مخصصة لكي يسمعها الشباب لكن إذا ما تعدى الأمر حد احترام الأغنية كلماتها ومغازيها فعليه يجب ألا تبث أو تسمع في جو صاخب. نسبة للشباب والشابات وخاصة الشابات المتحجبات لكن المتبرجات أو بمعنى أصح المقنعات فهؤلاء حسابهن عند ربهم ولا علاقة لسامي بها. أما عن التصفيق والاستمتاع فانا أظن أن سامي ينظر إلى الدين بنظرة غربية بعض الشيء نظرا إلى كونه أعجمي الأصل وبالتالي أملت عليه مفاهيمه المذوتة أكثر منه مفهوم الدين ذلك ولا غرابة فيما يقال وبالتالي الحري به انتهاج الصحيح من الشريعة والسنة إن كان راغبا في الإسلام والحمد لله على كل حال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144754/http://www.20at.com/article.php?sid=740"

