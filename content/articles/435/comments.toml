[[comments]]
order = 232
subject = "bloody rose"
author = "لسلام عليكم ورحمة الله..."
text = "يا جماعة انتوا قاعدين تتكلموا عن انسان كسب محمة الجميع..<br />انا ما اقول انو الغناء حلال ..وكمان بوجهة نظري ..انوالحكم على الاغاني والاناشيد يكون بمعناها..يعني ممكن أحد يغني عن الهيام والحب بس بدف ..اسالكم بالله ..حترضوا تسمعوا-للي ما يسمع أغاني-..<br />شي تاني ..انتوا مادخلتوا قلبوا وعرفتوا ايش فيه يمكن هادي البداية بعدين يصلحها..<br />شي تالت..انوايمكن هوا ما عمل هادي الاناشيد للمسلمين..<br />يمكن قصدوا يدعي الناس-الكفار-للاسلام مو شي تاني..وبالنسبة لروحتو مصر وغناؤو هناك..ترا في نسبة من مصر هما أصلا نصارى..<br />وبعدين هوا ما استخدم الغناء فقط في دعوتو ..هوا استخدم طيبتو حتى يجذب الناس..<br />تراني ما اقول كدا عشاني معجبة بأغاني ولا شي..لأني أصلا ما أسمع اغاني..بس زميلاتي هما اللي يسمعوا ..<br />ما بدي أطول عليكم ..بس أقول انتوا تتكلموا على واحد غلط..عندكم كتير من المغنين..دحين قمتوا على المسلم..وسيبتوا نانسي هادي في حالها..ليش ما قمتوا عليها لمن استهزأت بالله..هيا والمذيع التاني..لا وبكل ثقة تقول انها تتمنى انو ربي يقولها (آه ونص)ومع ذلك ..أشوف كتير من شبابنا وبناتنا ساكتين..صحيح انها نصرانية..بس انا اقول عليكم انتوا ليش ما بطلتوا تسمعوا أغانتيها؟؟..ليش التهكم على واحد يقل(ربي الله)..رجاء انكم ما تتكلموا عن انسان شريف بهادي الطريقة...<br />وأنا اقول لسامي يوسف....thank u for ever<br />بلييز للي عندوا ايميل سامي يوسف يكتبو...<br />لأني محتاجتو ضروري..<br />من السعودية..الله يهدي شباب وشابات المسلمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144754/http://www.20at.com/article.php?sid=740"
