[[comments]]
order = 213
subject = "ساره من السعوديه"
author = "لسلام عليكم ورحمة الله وبركاته"
text = "أعلم أن رأيي قد يغضب الأغلبيه لكن الساكت عن الحق شيطان أخرس<br />مع إحترامي لجميع الأراء<br />أود أن أقول أنا أحترم الأخ سامي يوسف لإسلامه<br />وأرا أن كلماته رائعه ومعبره<br />ولكن ذلك لاينفي أن الموسيقى حرااااااااااام<br />ماذا تقول لو ترا شيخ يلقي محاضره على أنغام الموسيقى؟<br />لايجتمع الذكر ومعازف الشيطان أبدا<br />ومن وجهة نظري أرى أن أكثر المعجبات به إنما أعجبن بجماله وغض البصر واجب على الرجل والمرأة على السواء وقد رأيت في بعض الردود مايوضح أن الإعجاب إنما بالشكل كألأخت التي تقول عاشقة سامي<br />إتقي الله ياأختي في نفسك<br />أما بالنسبه لمن يقول لماذا لاننتقد المغنين والمغنيات فأنامعكم في هذا ولكني أرى أن أغاني سامي يوسف قد تكون أخطر<br />لاني لأعتقد بوجود مسلم عنده شك بحرمة تلك الأغاني<br />أما أغاني سامي يوسف قد يرى بعض الجهله جواز الموسيقى فيهاوذلك قد يقود لشئ عظيم<br />وهذا شئ خطير لأن الموسيقى حرام<br />والله العظيم حرااااااااااااام<br />وأتمنى من كل قلبي أن الله يهدي سامي يوسف للطريق الصحيح ويترك الموسيقى<br />وأخيرا<br />سبحانك اللهم وبحمدك أشهد أن لاإله أنت أستغفرك وأتوب إليك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144754/http://www.20at.com/article.php?sid=740"

