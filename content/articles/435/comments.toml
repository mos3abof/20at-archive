subject = "منال أدريس"
text = "أنت معك حق يا نهى فى أن الاستماع لأغانى سامى يوسف يجب أن يكون بطريقة مختلفة لأن كلمات الاغانى فيها ذكر لله و لكن ما ذنب سامى يوسف فى هذا . على العموم أنا رأى ان صعب جدا أن نغير ما تعود علية الشباب منذ سنين فى طريقة تلقيهم لأى أغنية فهم لا يسمعوا الكلمات ولا حتى اللحن وأنما يتراقصون و يتمايلون دون سابق معرفة بالغنوة و علينا أن نصبر عليهم حتى يتعودوا على التلقى الصحيح للغنوة و هذا سيحدث أن شاء الله مع أستمرار تقديم الفن الراقى لهم"
