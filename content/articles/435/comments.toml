text = "السلام عليكم ورحمة الله,,,<br />بجد بجد المقال جميل يا نهى وربنا يكرمك يا رب ...<br />بس بجد أنا اسفة جدا إني كنت معترضه جدا أصلاً اني اروح ادفع 100 جنية او اكثر علشان اتفرج على واحد بيغني ...طب مش احسن اشوف حد محتاج الفلوس دي واقعد اشوفه في البيت ؟؟ مع كباية شاي حلوة كده بنعناع؟؟ ارجوكم الناس فعلاً محتاجة اوي أكل وكسوة وحاجات كتير اوي والله أعلم ريع الحفلات دي بيروح فين ....معلش يا جماعة والله انا بحب الغناء جداً بس الحالة برضه صعب والناس الفقراء محتاجين جدا أكثر وربنا يجعل بيوت المحسنين عمار.....واحدة مأشفرة في العيد"
