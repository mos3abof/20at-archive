subject = "سامي يوسف :حاجة شبابية"
text = "أعتقد أن ظاهرة سامي يوسف لا تعدوا ان تكون إلا استجابة لحاجة الشباب الملتزم الى اغنية تلبي تطلعاتهالفنية بعد ان مل من اهازيج القبور والحديث عن أهوالالموت في اناشيد ترث الكأبة والملل وتضيق لها الرواح والنفوس و اعتقد ان أغاني سامي يوسف تلبي رغبة لطالما رفقتنا وهي ان نستمع لانشودة جميلة وملتزمة فهل تححققت حاجتنا مع سامي يوسف.....عبد العالي المتقي . المغرب moutaki21@maktoob.com"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 51
subject = "النتائج هي المهمة"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم<br />كتعليق بسيط اضيفه الى تعليقاتكم التي و ان اختلفت فهي تبين مدى حرصكم على الاسلام و حبكم له.<br />مسالة اناشيد سامي يوسف و الصوفيه فارى ان يستمع الشخص الى اناشيد الصوفية كخطوة اولى افضل من الاستماع الى المهرجين في القنوات الفضائية و قد يكون هذا الاستماع خطوة اولى نحو التحول الكامل من حياة العبث الى عالم الاسلام.<br />اما بالنسبة للشركات اللتي تقوم بالاعلان و التوزيع فنحن نعلم ان هدفها الربح المادي و ايضا لا توجد مشكله في ذلك المهم كيفية الاستفادة من النتائج<br />اذا كان من الممكن الاستفادة من اي شيئ في سبيل الاسلام فلا توجد مشكلة ان تقبل ببعض الامور على ان لا تقرب حدود الله.<br />اما ما يحدث في الحفلات فتعليق احد الاخوة اعجبني<br />عندما قال اذا كان المصلي غير جيد فليس معناه ان الصلاة غير جيدة او المشكلة فيها.<br />من الممكن ان تحدث هذه المشاكل في البداية على ان يتم العمل على عدم حدوثها في المرات القادمة ويمكن ايصال ذلك الى المنشد نفسه اما عن طريق موقعه او عن طريق موقع عمرو خالد<br />و شكرا لرحابة صدركم و قراءة تعليقي"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 52
subject = "انا من فلسطين (من عرب اسرائيل)"
text = "بسم الله الرحمن الرحيم انا بدي القول تعليق على المقال التي قالته نهى انا لا استغرب من هذا الشيء الذي حصل في حفل سامي يوسف لانه بنات الشعب المصري وليس كلها لا نستغرب من هذه الشئ الذي حصل في الحفل واذا انقال على البنات الذي يعشن في مصر كلام مش امئدب يقول الكثيييييييييييير من الناس هذا صحيح لانه نحن بنات عرب اسرائيل ال عايشين بين اليهود متدينين وحشرين اكثر من المتدينين من مصر وانا لو محل سامي يوسف واشوف هذا الشء في الحفل بقول ولا واحد يرقص ولا يسحج لانه احنى مش كزنه لاكن مع احرامي الشديد للمطرب سامي يوسف يمكن هو بده هكانا عمري 17 سنه وبتعلم في المدرسه مع بنات واولاد وبسمحش لحلي اني اعمل هذا العمل واروح على حفلة سامي يوسف بلبس مغري للنظر ومكياج على وجه بس على شان يطلم علي واحد مثل سامي يوسف واني اعجبه مع احترامي الشديد لسامي يوسفرنه يغني( للرسول الله )انا الاء وشكرا"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

