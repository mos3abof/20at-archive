[[comments]]
order = 18
subject = "الإعلام هو السبب!!"
text = "السلام عليكم ورحمة الله<br />في البداية لي تعليق وهو لفظ الأغنية الدينية<br />اعترض علية لانه لا صله للأغاني بالدين<br />اما ما يقوم بة سامي يوسف الآن هو انشاد ديني بغض النظر عن اللغة... ودا مش شئ جديد<br />يعني الانشاد الديني من زمان سواء انجليزي او عربي<br />بس هي للعبة لعبة إعلام ...<br />عملوا له خبطة إعلامية جامدة<br />خاصا في اشهر قناة راديو بيتابعها كل الشباب<br />علشان كدة بقت موضة اسمها ( جبت شريط سامي يوسف الجديد)<br />انا من رأيي نخلي الاغاني لأصحابها و الأناشيد لاصحابها<br />يعني مكنش في داعي للبالو إللي اتعمل دا<br />وإللي كان عايز يسمع سامي يوسف كان حيسمعة<br />زي ما في منشدين كتير محدش يعرفهم بس في ناس بتسمع لهم<br />وفي النهاية يا ريت كل واحد فينا يراجع نفسة<br />واسف علي الإطالة والسلام عليكم"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

