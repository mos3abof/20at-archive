subject = "السلام عليكم ورحمة الله وبركاته"
text = "الى هذا قولك يا نهى(فلنرى راي احد نصراني) ان تعليقك جميل جدا بل تعجز الكلمات عن الوصف مع ان التعليق بسيط ولكن الحدث عظيم وله تأثير كبير في القلب فنشكرك عليه وبارك الله فيك.<br />وايضا الى ارحمنا تعليقك جميل فبارك الله فيك وفي امثالكم ممن يعلقون بجدية ومنطقية.<br />بنت تحب مصلحة الاسلام والمسلمين<br />من فلسطين عرب ال48.<br />والسلام عليكم ورحمة الله وبركاته."
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

