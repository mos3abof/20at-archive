subject = "اتقوا الله"
author = "ا جماعة يجب علينا التفكير فى الأهم وأن نتناقش فيما يهم على الأقل الأخ سامى لا يمتلك السلطة لمنع هؤلاء البنات من التمايل فيجب علينا بدلا من توجيه اللوم له أن نوجه اللوم لهؤلاء الفتيات وننصحهم لا نضيع وقتنا فى قول مثل هذه الكلمات الغير مناسبة وكما قال البعض من قبل ما ذنب أخونا سامى فيما حدث."
text = "أرجوكم اخوانى اتقوا الله فيما تكتبون لأنكم بذلك تشوهوا سمعة أخ لكم فى الله كل قصده إرضاء الله.<br />وشكرا لكم."
