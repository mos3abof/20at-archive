author = "سم الله الرحمن الرحيم"
text = "تعليقا على ما قيل على الاخ سامي يوسف والغناء والتمايل واندراج اغانى الاخ سامي يوسف تحت الدعوة الى الله اعتقد ان هذا مرفوض<br />فما يفعله الاخ سامي يوسف لايقل ذنبا عما يفعله عمرو دياب فى حفلاته وحتى مايفعله ريكي مارتن الغرب<br />(فادعو الي سبيل ربك بالحكمة والموعظة الحسنة ) وإلا قاله ادعو الي سبيل ربك بالجيتار وبأكادمية الغناء<br />فيجب ان نفصل بين الدعوة في سبيل الله وبين الغناء والفرفشة<br />والله المستعان<br />والسلام عليكم ورحمه الله وبركاته"
