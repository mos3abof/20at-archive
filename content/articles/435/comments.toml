text = "السلام عليكم:<br />اختي التي ردت على محبة المعلم والله انا بتمنى انو نقدر نعمل قنابل واكتر من هيك بكتييير بس يعني الي ما بقدر يعمل قنابل في كتير طرق غيرها بتعمل على صحوة مشاعر المسلمين ومنها الاناشيد، كمان بدي احكيلك انو انا حكيت اناشيد دينية مش اغاني للرقص وبتمنى انك ما تفهميني غلط ولكل واحد رأيه وشكرا على رايك"
