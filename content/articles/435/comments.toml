text = "السلام عليكم :أن بصراحة كبيرة بحب أناشيد الرائع سامي يوسف ودائما غلى اطلاع على اخر اخبارة بس مش المقصود انو نرقص عليهم او حاجة من هاي الاشياء احنا الهدف من سماعها الاعتبار والانتباه لاحكام ممكن كانت غايبة عنا وكمان ان شاء الله بنسير نساوي قنابل بس الاهم انو الانسان يصلح نفسه وذاته ,ومع هيك أنا كتير بحب أغانيه وبصراحه عنا بفلسطين صار حديث اكتر البنات وبنفوت المحلات والمكاتب بنلاقيهم حاين سامي يوسف .والله يهدي الجميع يارب.<br />اختكم المحبة لكم"
