[[comments]]
order = 104
subject = "samara-damas"
text = "شوفي ياحبيبتي نهى لماذا نضع اللوم على سامي يوسف ذلك الشاب الذي ترك مفاخر الحياة والتجأ الى دين الحق مادخل سامي بما تلبسه الفتيات هنا وهناك ماقدمه ذلك الشاب غاب عن كثير من الشباب العربي الذي يقدم اسخف واردا الاغاني والتراهات وشغل بها معظم شبابنا العربي والاسلامي خاصة وكيف ليس هناك في اغانيه اي موضوع المواضيع كثيرة وغنية ولكن علينا ان نفتح عقولنا ونستوعب الفكرة والمضمون ولماذا لا يكون هناك زخرفة في اغانيه فالضرورة تقتضي ذلك بما ان شبابنا لا يلتفت الا لتلك الامور فوضع كل القوالب التي تلفت انظار الشباب ضمن قالب ديني محبب ولطيف يكفي ان اطفالنا اليوم اينما اتجهت اسمعهم يذكرون نبينا ويدندنون بهذه الاغنية التي تصف لنا بعض من الصفات الكثيرة التي جبل عليها حبيبنا ورسولنا وبعض من الرسائل التي خلق من اجلها<br />لماذا كل مظهر انسان يحمل دعوة دينية باي طريقة نحاول اخفاقه ووضع العراقيل وانتقادات لا حدود لها بينما نرى ان معظم الفنانين الان يظهرون باشكال واعمال سيئة ولا احد يلتفت لهم بل العكس يتسابقون في محاولة تقليدهم وعمل التسريحة نفسها ولبس مايلبسونه كفانا كفانا هذا التخاذل والتراجع سامي يوسف ليس الا انسان احب ان يلفت انتباهنا الى ديننا الحنيف بطريقة جذابة ولطيفة تحمل نفس الاسلوب الذي يحمله الاطراف الاخرى التي تودي بنا الى طريق الهاوية واصلا الله سبحانه وتعالى لا يقول لنا تقشفوا ولا تلبسوا ولا تعيشوا بالنعم بالعكس تماما الاسلام يريدنا منمقين وانيقين لتظهر علينا نعم الله تعالى فاتركوا التراهات واستفيقوا لما هو اعظم<br />اسفة لان اقول لك ياانسة نهى انك على خطأ واثرت قضية لا داعي لاثارتها وستتحملين مسؤلية ذلك الكلام اتمنى ان توجهي انتقادك لمن هم فعلا ستحقون النقض والاستهزاء وجهي انتقادك لهؤلاء الهابطين والمنحطات وكفاك ثرثرة ياريت تفهموا بشكل صحيح ماهي الموسيقى المحرمة وافرضي باي حال من الاحوال انها كذلك لماذا لا تهاجمون الموسيقى المسخرة لاحباط معنويات الشباب العربي وجعلهم يغرقون في بحار الظلام والهاوية والدمار هل فاقت بك النخوة على تحريم الموسيقى الان باغنية لطيفة سحرت حتى اناس من اخواننا النصارى اين انت ياخت نهى ؟ يبدو ان عالمك مختلف تماما؟؟؟!!!!!!!!دعي عنك هذا واتركيه لاهله"
archived = "2005-03-07"
capture_url = "https://web.archive.org/web/20050307092859/http://www.20at.com:80/article.php?sid=740&amp"

