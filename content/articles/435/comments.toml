[[comments]]
order = 66
subject = "نداء من اختكم في الاردن"
text = "اخواني واخواتي في مصر الحبيبه السلام عليكم و رحمة الله و بركاته اما بعد .<br />هنالك سؤال يطرح دائما في مثل هذه المواقف وهو على من يا ترى الخطأ(نعم و انا هنا اقصد الخطأبحد عينه لا تقولوا لي ان تمايل فتيات سافرات و متبرجات على كلمات عظيمه مثل لا اله الا الله و المصطفى وومن الحبيب وغار حراء و التأمل والمعلم و الله تتمايل كانها والعياذ بالله افعى تتلوى لا تقولوا لي ان هذا حلال وجائز و غيرها من التبريرات السخيفه التي لا تغني من الحق شيئا )ناتي اولا الى هذه الشاب والذي -والحق يقال -اعجبني ودخل قلبي منذ ان سمعت اول نشيده له وهي المعلم انا ابلغ من العمر 18سنه واملك من الدين ما لا يسمح لي بالنظر الى اي شاب و بالتالي لم يدخل قلبي اي شخص منذ ان كنت صغيره و لكن عندما رايت هذا الشاب دخل قلبي بسرعه و احببته لدرجه اني احفظ جميع اناشيده واقتني البؤمه المعلم كنت اعلم انه لم يدخل قلبي بسبب جماله فهناك من هم اجمل منه في بيئتي ولا بسبب ماله فانا لا اعلم عنه شيْ ان كان غني او فقير وانما دخل قلبي بسبب ذلك النور الذي يخرج من وجهه وكلامه الرائع اود ان اقول ان هذا الشاب لايوجد عليه اي خطا(لاني وبصراحه اعرف ما يريده هذا الشاب من الشباب المسلم هو ان يعودوا الى دينهم و لكن بطريقته الخاصه ) فسامي جاء من بلاد غربيه لا يعلم حتى اي شى من اللغه العربيه الا التي يرددها في اناشيده فهو ربما لا يعلم يا اخوتي ان الرقص للفتيات حرام او ان النظر الى هولاء الفتيات حرام فهو قام بالعديد من الحفلات ولكن في العالم الغربي وكما تعلمون فانهم لا يرقصون -ما شاء الله- مثلناويجب علينا ان نوجه اولا له الشكر على الذي يود ان يفعله في الشباب المسلم ولكن يجب ايضا ان ننصحه-بالرغم من ان هذا يجرح قلبي جدا ان اقول لكم -انه يجب ان يوقف الانشاد في العالم العربي وليس في العالم الاسلامي ليس لان انشاده سيئ لا والله -وانا اؤكد لكم اني احب سماعه - لكن الشباب العربي نعم العربي وليس المسلم لان هناك اشخاص غير مسلمين حضرؤا حفله الاول لان هذه الفئه التي حضرت حفلته الاولى شوهت صوره الشباب المسلم امام هذا المنشدفانا واثقه انه عندما كان متوجه الى العالم العربي كان في مخيلته ذلك الشباب المتديين والفتيات المحجبات الملتزمات ولم يكن يعلم انه سوف يرى فتيات محجبات ويا له من حجاب -هو وقلته سواء-والمكياج والجينز والضم ولا اجد شيئا يصفهن الا قول المعلم -صلى الله عليه وسلم -كاسيات عاريات يتسابقن ايهن تفتن الشباب اكثر والله اعلم ما هي الصورة التي تكونت في عقل سامي عن الشباب المسلم من سبب هذه الفئه من الشباب وانا متاكده ان اكثر من نصف هذه الفئه لايعلمون ما يقول في كلامه الغير عربي والدليل على ذلك انهم كانوا يكتبون على شريط قناة ميلودي -بليز كنترول اغنيه سامي يؤسف بالترجمه انا واثقه انهم حضروا الحفله من اجل الحانها ويا لها منمصيبه اذن رساله سامي ترجمت بطريقه عكس 180 درجه عند الشباب العربي<br />لذلك ادعوكم اخواني واخواتي ان لا تسمحوا لمثل هؤلاء الشباب بأن يشوهوا صورتنا امام هذا الشاب الذي ما زال كالصفحه البيضاء التي نحن نخط عليةه ما نشاء<br />وبما انكم في مصر الغاليه قريبون من موقع الحفل الذي سوف يقيمه عما قريب فأني ادعو كل من عنده ذره من دين ان يشارك في منع هذه الحفله من ان تقام -والله والله والله اني لا اقصد طرد هذا الملاك من ارضنا ولكن اذا كان الملاك بين شياطين اصبح مثلهم وانا ادعوكم لذلك بسبب خوفي على سامي(ان نظرتم معي الى اسعار التذاكر العاليه)وان تنطبع صوره بشعه عنا في ذاكرته -شاركوا في منعها عن طريق التظاهرات والاعلانات<br />انا انتظر ان اسمعخبر منعها من ان تقام وان شاء الله من اراد ان يحاؤرني في الموضوع سوف ابعث عنواني فيما بعد<br />والسلام عليكم ورخمه الله وبركاته<br />اختكم"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

