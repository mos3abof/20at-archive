subject = "سعودي"
text = "السلام عليكم<br />أغاني إسلامية !!!<br />قال الرسول صلى الله عليه وسلم<br />( بدأ الإسلام غريبا وسيعود غريبا )<br />لكن لم تحدث غربة الى الان .. فالموسيقى دخلت على الاسلام واصبحت كالمسيحية والله قادر على تغيير الحال .<br />مقولة:-<br />(( تورع) بعمرو دياب ونانسي و(تهاون) بسامي يوسف ))<br />لا فرق بينهما الا بكلمات الاغاني ..<br />سبحان الله وتعالى جلاله عن ذكر لفظه بالموسيقى.<br />شكرا لكم"
archived = "2005-03-07"
