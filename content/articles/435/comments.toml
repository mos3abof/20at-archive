text = "اسمع لسامي يوسف افضل من ما اسمع لغيره وكثير من بنات مصر رائعات ومش مثل ما بيحاولو يصوروهن بالتلفزيون اللي بظهر في التلفزيون هو مثال مضلل عن مصر شبابها وبناتها.<br />انا من عرب اسرائيل وانا اعرف انو مصر بيمثلهاش الافلام التافهة والساقطة اللي في التلفزيون.<br />سامي يوسف افضل من غيره وحلو عنه.<br />واللي احكوا عن العرب غلطانين كثير بس مشكلتنا انا بتوخذنا الحمية وبنرد بسرعة."
