text = "الحياة جميلة ولكن لا نعرف كيف نعيشها بشكل اسلامي وديني ومعرفة كاملة وواعية عن الدين الاسلامي وبالرغم من ان سامي يوسف شاب عاش في بريطانيا الا انه واعي تماما على هذا الدين غير ان العديد من الشباب الذي يعيشون في الوطن العربي لا يعلمون عنه شيء. والذي حدث في الحفلة لا يعبر عن الشباب المتدينين والذين يسمعون لسامي يوسف وفي النهاية نتمنى لسامي يوسف التوفيق والاستمرارعلى نهج الدين الاسلامي"
