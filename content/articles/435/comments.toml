[[comments]]
order = 120
subject = "مخافة الله"
text = "للأسف أحنا في مصر فرحانين بأجنبي يغني للإسلام ويغني بالعربي وده كله مجرد فرح لذلك لكن نسينا أهم شيء هو أننا نوجه الشخص هذا الإتجاه الصحيح للإسلام الحقيقي لأنه بذلك مظلوم قد يقول في نفسة الإسلام يباح فيه اللبس الضيق والرقص على ذكر الله سبحانه وتعالى يا جماعة أرجوكم فين أحترامنا لربنا للخالق معقولة الكلام ده وبعدين أزاي بنغني لربنا ونتراقص فيه مش بس كده وكمان بفلوس طيب ليه ماكنش الحفلة للرعاية الأيتام أو لمرضى السرطان أو لأي شيء ينفع ويأخذ عليه الثواب والناس اللي رايحة تتفرج على سامي يوسف ولا للعبادة ولسماع الكلام الحلو ممكن حد يجاوب على سؤالي ده ليه الناس رايحة وبتفع 100 جنيه علشان تتفرج على سامي يوسف لحد أمتى بس مانعرفش دينا بقى وصدقوني قريباً جدا حتلاقوا سامي يوسف أنشق لما هو في الآن لأن لم يلقى الدين الصحيح الغير موجود للأسف في بلادنا الله يرحمنا ويغفر لنا وربنا معاك يا سامي يوسف ويحفظك الله من أيدي الغير عالمين بدينهم أحب أقولك حاجة مهمة يا جماعة وعن تجربة بجد في بلادنا نسيين دينا بالفعل حتى في مدارسنا يبقى أزاي واحد زي سامي يوسف يتعلم الدين أكثر أنا لما بأجي مصر يمكن مش بصلي كل الفروض في وقتها يمكن بأخرها لأن الدنيا في مصر متاهه لكن لما بأجي السعودية حتى لو فيها بلاوي زرقة لكن في الخفاء وأنا اللي يهمني أني ألاقي مسجد في كل حته ومجرد الأذان بدأ كل شيء في البلد تتوقف من أجل الصلاة الله يرحمنا برحمته والله أنا خايف عليك يا سامي يا يوسق أصل ماتلقيش الناس اللي تعرفك دينا صح والخوف عليك من الصوفية وأين ذهب سنة رسول الله علشان يبقى عندنا صوفية التي تراعي الناحية السياسية لبلادنا أرجوكم تفهموا كلامي وشكراً لكل من قرأ مقالتي هذه"
archived = "2005-03-07"
capture_url = "https://web.archive.org/web/20050307092859/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 121
subject = "السلام عليكم ورحمة الله وبركاته"
text = "يااخوتي<br />يوسف سامي الله يسعده<br />اعطاه الله جمال الخلقه وحسن الخلق<br />والله يااخوتي انه احسن من كثير من شبابنا العربي<br />اللي اهم شي عنده معاكسه البنات<br />سامي يوسف احسن من الكم الهائل من هؤلاء المطربين<br />اللي اغانيهم كلها تعري وغزل وكلام فاضي<br />بينما هذا الشاب البريطاني المسلم<br />قال كلمات جميله يترنم فيها الصغير والكبير<br />هذه الكلمات كلها صلاة على النبي صلى الله عليه وسلم<br />ووللتنبيه سامي يوسف ليس متصوف<br />وانا الحين ابغى اكتب لكم نص اللقاء اللي اجري معه<br />وهو كاالتالي بس ابغاكم تدعون معي لهذا الشاب ان الله<br />يثبته على الهديه ويعمق الايمان في قلبه<br />الله يسعده<br />واليكم نص اللقاء الذي اجري مع سامي يوسف<br />لي عوده باذن الله اكتب نص اللقاء<br />وعلى فكره في واحد بريطاني اسلم لما سمع سامي يوسف<br />ينشد عن رسول الله صلى الله عليه وسلم<br />اختكم بنت المدينة المنورة"
archived = "2005-03-07"
capture_url = "https://web.archive.org/web/20050307092859/http://www.20at.com:80/article.php?sid=740&amp"

