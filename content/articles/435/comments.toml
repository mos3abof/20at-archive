[[comments]]
order = 168
subject = "البركان الاخضر"
text = "كل ما خالف تعاليم الشرع الحنيف يبقى خارج دائرة الاسلام وياريت نبقى مسلمين بجد وما نحاولش نسلك طريق خطاء بدعوى اننا بنخدم الدين على العكس كده احنا بنغضب ربنا وبنجيب كلام اعداء الاسلام على روحنا<br />وياريت نتفهم انه سامي يوسف اذا كان استخدم الموسيقى<br />فده حرام ومخالفة شرعيه<br />والدعوة الى الله لا تكون بشي حرام<br />حتى في العلاج الرسول نهى عن التداوي في اي شيء حرام<br />وعندي سوال لمن يخاف الله منكم على اي راي فقهي اعتمد سامي يوسف في استخدام الموسيقى في اغانيه<br />وانا بحكي شيء انه بيتحمل جزء من النب في اللي حصل<br />لانه سبب اجتماع الفتيات والشباب في مكان واحد مختلط<br />ومتبرجات ورقصو ولا هيفاء ولا نانسي عجرم<br />هو وجود سامني يوسف وبدونه مكنش حيجتمعو<br />واذا اجزنا لسامي يوسف بكده وطبعا ده على راي اللي بيحكو انه قدجم للدين<br />فبكده بكرة يطلع علينا حد يقول انه ممكن يقراء القران في خمارة او في ملهى ليلي<br />ارجو انه كل واحد يحكم شرع ربنا قبل ما يكتب شي او يحكم بشيء<br />والله من وراء القصد"
archived = "2005-03-07"
capture_url = "https://web.archive.org/web/20050307092859/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 169
subject = "من المغرب العربي الى المشرق العربي"
text = "السلام عليكم و رحمة الله تعالى و بركاته<br />الأخت الكريمة طرحت مشكلا لا علاقة له بسامي يوسف الطرح كان هو الجمهور المصري الذي تعود أكثر من غيره [ ولا اغبطه على هذا] على المهرجانات و السهرات و من جميع الأنواع و الأصقاع و عليه فلم يستطع أن يعيش الاستثناء و لم يقدر على التكيف مع الاتجاه الذي وجه إليه، و أظن أن سامي يوسف كان أكثر من ذكي في طرح سؤاله و سيتكرر هذا السؤال في دولة أو دولتين لكن ليس في المسارح التي لم تستقبل قط لا عمرو و لا نانسي و لا راغب و لا إيهاب و لا...<br />نستقبل منشدين من سوريا و العراق و مصر و غيرها من البلدان لكن الجمهور يدرك تماما انه سيقضي ليلة في ذكر الله فيتأهب لذلك مظهرا و روحا.<br />تمعني أختي في هذا الحدث: مسلم يصدح بذكر الله و مدح الرسول في قنوات الشرق و ما أدراك ما قنوات الشرق غير مقيد لا بمكان و لا بزمان، انه شيء أكثر من رائع. و أ كثر من كاف ليجعلنا نلجم ألسنتنا عن أخ تغلب على الكفر في بلاد الكفر و الادهى تغلب على المسلم في بلاد الإسلام.<br />وفقك الله أخي يوسف لما فيه فخرنا و نصرنا<br />هاجر"
archived = "2005-03-07"
capture_url = "https://web.archive.org/web/20050307092859/http://www.20at.com:80/article.php?sid=740&amp"

