[[comments]]
order = 196
subject = "حنان"
author = "لسلام عليكم"
text = "اولا يجب ان تحمد الله على وجود سامي يوسف الذي يشجع الشباب والفتيات على الاسلام .<br />ثانيا ليس ذنب سامي يوسف ان عقل تلك الفتيات خفيف ولم يفهمن قصد سامي يوسف من اناشيده .<br />ادعوا لشباب وفتيات الامه بالاصلاح والهدى وفهم الدين والسنه بالشكل الصحيح .<br />ليس ذنب سامي يوسف في تخلف فتيات وشباب هذا العصر .<br />اللهم اني أسألك ان تبارك وتحمي سامي يوسف وتكثر من امثاله اللهم امين<br />الحمد لله والصلاة والسلام على رسول الله<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144754/http://www.20at.com/article.php?sid=740"

[[comments]]
order = 197
subject = "ahmednabil24@hotmail.com"
author = "سم الله الرحمن الرحيم"
text = "أولا:<br />كل واحد حر في رأيه بس لازم يكون الرأي ده من غير تجريح طبعا في اي واحد المهم ان الأخت اللي قالت ان سامي يوسف مفيش فرق بينة وبين عمر دياب<br />طبعا الكلام ده غلط لأن سامي يوسف لم يأتي بعاهرات في الفديو كليب مثل الأستاذ عمر دياب<br />ثانيا : سامي يوسف لما سئل الناس علي المسرح بيحبوا الغناء الهادي والعالي كان قصده يكسب سمعهم وبصرهم وكل حواسهم وده افتكر انه ذكاء والحمد لله انه بيتمتع بده<br />ثالثا : بقي وده الأهم ان سامي يوسف انسان مسلم قدر انه يوصل لقلوب الناس بسرعة من خلال اغانية الحلوة والأجميلةالأسلامية وافتكر انه فيرد من نوعة في هذا النوع من الغناء<br />رابعا : بدل من تهدو الحاجة الحلوة أرجوكوا حاولوا تبني كفاية الروح التي تساعد علي الهدم مش البناء<br />خامسا : سامي يوسف مقلش للبنات تيجي الحفلة بتاعتة بالمحزق والملزق يا ستي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144754/http://www.20at.com/article.php?sid=740"

