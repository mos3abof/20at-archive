text = "السلام عليكم ورحمة الله وبراكاته اريد ان ابدء بالذين انتقدوا اناشيد سامي يوسف .اناشيد سامي يوسف افضل من اي اغنية تعرض وفيها الفتيات كاسيات عاريات والمغني يترقص بجانبهم والكل مندمج فيها لسوء الاخلاق فالانشودة التي تعرض لسامي يوسف هادفة الى الخير وليس الى الفسق واتمنى ان تتعضوا هذا الشيىء لانه من مصلحتكم لانه يهدي الى ترك المعاصي وحب الله والقصد من هذه الانشودة ان تنتشر لتوقض الناس من الضلمات التي عاشوها في سماع الاغاني واتمنى ان تعرض كل اناشيد سامي يوسف في التلفاز وتمحى الغاني التافهة وبنسبة الى الذين لم ينتقدوا جزاهم الله خيرا وشكرا......."
