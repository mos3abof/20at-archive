text = "وما هو ذنب هذا البرئ اذا تمايلن الفتيات<br />واظن ان هؤلاء الفتيات المايعات مصريااااااااااااات مثلك يا نهى واظن لوكانت المايعة الي بدها تفسد شبابنا وبناتنانانسي عجرم أوهيفاء الي هدفهم واحد... لماكتبتي عايهم تعايق سخيف<br />والي يهين حبيبنا سامي احنا راح نهينو بكل جوارحنا"
