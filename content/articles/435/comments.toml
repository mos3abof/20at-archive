text = "ارجو انكم تحبوو<br />3 بيضات<br />1 كوب حليب<br />1 كوب زيت<br />2 كوب سكر<br />3 كوب طحين<br />2 ملعة صغيرة من البيكان باودر<br />قشري قشور 3 برتقالات<br />قبل ان تبدئي افتحي الفرن<br />ضعي البيضات زاخلطي ثم الحليب و اخلطي ثم الزيت واخلطي ثم السكر واخلطي ثم الطحين و اخلطي ثم البيكان باودر واخلطي و اخيرا قشور البرتقال و الخلطي و اذا كانت الخليط ثخينا اعصري برتقالة و ضعي قليلا واخلطي اذا احتاج كثير ضعيها .<br />ادهني القالب ثم ضعي الخليط فيها ثم للفرن.<br />كعكا لذيذا انشاء الله<br />هنيئا لكم"
