subject = "لى الأخت نهى"
text = "أنا قرأت تعليقك و معك حق في كل الي قلتيه<br />بس كمان الحق ما بيكون على المغني بس الحق على الي جاب الفكرة يعني الحق على المقدم الي قلتي عليه بالموضوع يعني لو انه ما سأل إذا بدهم تهييص أو هدوء و اذا قلتي لي انو اذا غنى بدهم يتمايلوا فالحق على الي مربي ولاده مو على المغني و بصراحة من رؤيتي الو بانشادة المعلم في الفيديو مبين انو متدين و مو شغل الحاجات دي الي حكيتي عنها و بصراحة انا حابة انصحك انو ما بيصير تحطي بذمتك لأنو بصراحة اعجبت بأدبك وأخلاقك الرفيعة و العالية<br />و الشكر<br />ملاحظة: ارجو اننا نصير اصدقاء (أنا فتاة و لست شابا) و هذا ايميلي:m_latayfe@hotmail.com"
archived = "2005-03-07"
capture_url = "https://web.archive.org/web/20050307092859/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 136
subject = "لى الأخت نهى"
text = "انا اسفة جدا على ارسالي مرتين بس ما قرأتش الي كتبتيه تاني مرة(الأشياء التي حذفت) و أنا بصراحة تامة أقول أنو البنات دول ما الهم علاقة بالدين دول مش جايين مشان يسمعوا لاغله الا الله و لا غيرو من التكبير دول جايين مشان يشوفوا سامي يوسف و خلاص و بصراحة انا بقول انو البنات دول بيفكروا انو بلبسهم ده يحبب سامي يوسف ليهم و أنا بقول العكس<br />اللبس ده بيخلي سامي يوسف بيحتقر كل و حدة منهم و مش كدة بس دول بيجلو ياخد فكرة سئة عن دين الإسلام عند امة محمد (العرب) يعني انا حضرت الو حفلة في المانيا و كان الجمهور شئ عرب و شئ المان و كانوا غاية في التهذيب و غاية في اللطف يعني بصراحة البنات دول خلو سامي يوسف يهج و يبعد من البلاد العربية و ده مش منيح خالص<br />و الشكر<br />بتقدري تسميني for islam"
archived = "2005-03-07"
capture_url = "https://web.archive.org/web/20050307092859/http://www.20at.com:80/article.php?sid=740&amp"

