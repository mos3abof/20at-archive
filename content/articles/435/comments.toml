subject = "مروة(ماله عمرو و ماله سامي)"
text = "السلام عليكم<br />يا شباب علشان خاطر ربنا بلاش التعصب ده<br />ماله عمرو خالد<br />على فكرة أنا كنت بعيدة أوي عن ديني ومن فضل ربنا<br />سمعت عمرو خالد<br />ده فعلا انسان كويس جدا على الأقل حقق هدفه وأثر تاثير ايجابي جدا في ناس كتير<br />يا شباب بصوا لأصول الدين وأهدافه علشان نبقى صح<br />القضية مش قضية سامي ولا غيره<br />القضية هي أمة بتنهار<br />بالله عليكم انقذوها<br />وعلى فكرة سامي انسان كويس جدا<br />الفرق انه عمل حاجة جديدة"
archived = "2005-03-07"
capture_url = "https://web.archive.org/web/20050307092859/http://www.20at.com:80/article.php?sid=740&amp"

