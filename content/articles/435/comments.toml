text = "السلام عليكم ورحمة الله<br />يعني سايبين اللي زي حط النقط والذيمنة وجايين علي الراجل الطيب دة وتطلعوا فية القطط الفاطسةوفيها اية لما يكون صوفي مش فاهم يعني لما انتي متضايقة من كلمة الله اللي في الاغنية يعني مش متايقة من اغنية العالم الله مثلا واللي بيترقص عليها من بنات عريانين وطبعا دة مثال واحد حضرني بس شوفي واتفرجي وبعدين لو مشينا علي رايك نقول للراجل دة روح اقعد في بيتكم انت راجل وحش بتعصي ربنا ونتفرج علي التانيين احسن ياعالم كفاية بقي افكار تودي لورا وكفاية بقي نبص لتحت رجلينا بس وهو يعني اللي بقالة 100 سنة حيتغيرفلحظة"
