text = "أنا كنت عاوز أرد على الأخت نهى على ما قالت فيه وذلك يعبر عن الشخصية ذاتها لكن الي ماقدروش العرب الأصول يحققوه جاؤو به مسلمين غير عرب فلا غرابة .<br />الأخت نهى مسلمة بالفطرة لكن بعض المسلمين عمرهم الأسلامي لا يقل عن سنة أو سنتين أ, حتى ثلاث لكن قدموا ما هو أكثر أرجو أن يكون الموضوع قد استوعب من ناحية الفكرة والمضمون لأن الناس الدعاة لديها هدف سامي أي نبيل ولا تنظر إلى الأشكال أ،صحك الأخوة القراء أن يدخلوا في سيرة الأمام حسن البنا"
