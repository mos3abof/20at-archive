text = "انا شايفة ان احنا عندنا عقد نفسية المهم ان ننتقد وخلاص ...والله انا سامى يوسف شخصية محترمة وكفاية انه جعل الناس تردد اغانية حتى لو الحان وهو غير مضمونها بكلمات فيها ذكر الله....وبعدين حتى لو انتوا مش شيفين سامى يوسف عمل اى جديد او شى فذ كفاية ان جعلن نردد اغانى فيها ذكر الله ...وكفاية انك حتى لو ذكرت الله مع اغنية حتاخذ ثواب انك ذكرت الله ونطقت باسم سيد المرسلين حتى لو فى اغنية...كفاية يا مصريين ويا عرب عقد نفسية وحولو تذكروا الجوانب الايجابية ...واعتقد ان سامى يوسف ايجابيتة اكثر من سلبياتهوكفاية انه اجنبى ووصل لدرجة ايمان عالية وعمل اللى بينتقدوة مش عارفين يعملوه واكيد هياخد ثواب بالناس اللى بتردد وراه اسم ربنا واسم سيد المرسلين"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 73
subject = "أخواني مهلا ارجوكم"
text = "قبل الحديث عن اي شئ اود ان اشكر كل اخ واخت اهتم بهذا الامر المهم رجاء خاص مع كامل احترامي وتقديري لأختنا نهى لكن ايه اللي وداكي اصلا انتي رحتي تتفرجي ولا تنتقدي وكنتي متوقعة تشوفي ايه غير كدة المهم رجاء خاص من كل اخوتنا تذكروا \" كذلك كنتم من قبل فمن الله عليكم \" ان هذا التميع في كل شئ لن يختفي في لحظات ارجوكم التمهل على كل انسان انا شخصيا عندما كنت في بداية التزامي لم اكن اعلم في وسط هذا الكم من التبديل والتحريف الذي لحق ديننا اي اسلام انتهجة لذا لا تلوموا على احد بهذة السرعة بالله عليكم الهجوم العنيف على كل ما هو ممكن نقول شبة اسلامي ليس الحل لماذا لا نضع كل شئ في ميزان الشرع هذا يجوز ةهذا لا يجوز ونفهم المخطئ خطأه بالحكمة والموعظة الحسنة مش ندمره سامي يوسف صوت غير عادي اللهم بارك ولكن هناك من ضحك عليه وفهمة ان الحكاية عشان تنجح لازم تبقى شاكيرا وللعلم اخواني الشريط اعيد صياغتة بالنسبة للايقاع في مصر حتى يكون مواكب للايقاعات الحديثة وربي شهيد على قولي ولكن لا اعفي سامي من المسئولية انه مسئول عما سمعنا فلماذا لا يتبرع احد المهاجمين بتوضيح الطريق لسامي اذاي لابد ان ندمرة وبعد ذلك نفهمة ارجوكم تمهلوا"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

