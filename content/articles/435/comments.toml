subject = "ساجده ( الأراضي المحتله) فلسطين"
text = "السلام عليكم<br />سامي يوسف يعتبر نهضه غنائية جديدة جاءت كهدية من عند الله لارسال او لنشر الدين بطريقة مميزة والتي تجذب ليس فقط المسلمين للاستماع الى هذا الصوت الملائكي وهذا الكلام العذب بل مختلف الديانات والأعراق.<br />ربما كان كلام نهى صحيحا ولكن للأسف أن اسمع باذني عن ما حصل في تلك الحفله(يتمايلن) اسفه ولكن ليس القصد في ذلك أن أجرح شعور أحد فأنا احب الاسلام وأغار عليه وبودي لو كانت أجواء الحفله أجواء استماع الى صوت رائع, مميز,وأنيق والتمعن بكلمات روحانية جميله بدون تلك التصرفات التي لا تليق بنا كحضارة اسلامية لها حدودها,<br />هذا رأيي الذي أود أن يتقبله قارؤه والسلام عليكم.<br />ايميلي هو : Van_cokh@hotmail.com"
archived = "2005-03-07"
capture_url = "https://web.archive.org/web/20050307092859/http://www.20at.com:80/article.php?sid=740&amp"

