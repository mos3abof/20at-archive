[[comments]]
order = 20
subject = "......."
text = "السلام عليكم و رحمة الله و بركاته ..<br />كما قال الأخ مصر ..العيب في الحضور و ليس في سامي يوسف ..فلو كان الحضور محترم حاله ..لما كانت الفتيات رقصن على ذكر الإله..و لما اضطرت كاتبة الموضوع لتشبيهه بحفل عمرو دياب!و قبل ان يبدأ بالغناء طلب من الجمهور التصفيق و التهييص و ليس الرقص..هناك فرق!<br />و لعلمكم فسامي يوسف عند بداياته أقام حفلات في بريطانيا ..و لم تكن الفتيات تتمايل على انغام ذكر الله ..<br />ما يقوله سامي يوسف ليس غناءا ماجنا أو إنشادا و إنما غناء ملتزم..و ما حدث من سلبيات رأتها الكاتبة يمكن تفاديها في الحفلات القادمة..و عموما في نظري ..الإيجابيات أكثر بكثير من السلبيات..<br />أنا أجيبك أختي نهى \" كدا أحسن من مافيش خالص!\"..و إلا لو تركنا الساحة لهيفا و نانسي ,فقولي على شباب الإسلام السلام..سامي يوسف هو خطوة على الطريق ..و مقدمة لجيل من الشباب المسلم الذي جعل حب الله و الإسلام نصب عينيه..<br />و رسالته لجميع الشباب المسلم و التي ينادي بها الأستاذ عمرو خالد ..\" اخدم دينك باستعمال مواهبك و قدراتك التي وهبك الله إياها \"..<br />سامي يوسف , باعتباره نشأ في بريطايا كان من الممكن ان يصبح شابا ضائعا تافها مثله مثل أي شاب انجليزي آخر مع اختلاف أن اسمه \"مسلم\" ..لكنه عرف طريق الصواب و التدين و اتبعه..<br />سامي يوسف لم يختر الطب لأنه من كليات القمة التي تؤمن له دخلا وفيرا في المستقبل و يطلق عليه لقب \" دكتور\"..و لم يختر الغناء ليصبح مثل انريكيه و امينيم..بل اختار أن يسخر الموهبة التي وهبه الله إياها و هي الصوت الجميل في خدمة الإسلام و المسلمين ..هنا مربط الفرس يا أحبائي ..<br />هناك الكثير لنتعلم من حياة يوسف اخوتي الكرام ..و تحتاج تجربته إلى نظرة أعمق و تأمل..و لا تجعلوا نظرتكم السطحية تؤدي بكم إلى احكام غير دقيقة تظلموا بها صاحب التجربة المميزة سامي يوسف..<br />رجاءا إخوتي الكرام ..لا تجعلونا نخسر شخصا بمثل إخلاصه و تفانيه..<br />و السلام عليكم و رحمة الله و بركاته.."
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
