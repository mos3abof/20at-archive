author = "لسلام عليكم ورحمت الله وبركاته"
text = "يسرني جدا أن نتناقش في متل هذه المواضيع الشئ الذي يذل على غيرتنا على ديننا وخوفنا على انحرافه صحيح أنه من الصعب اليوم أن تجد منشدا بدون مسيقى ولكن الأمر يختلف بالنسبة لإنسان عاش وسط الحضارة والترف فنحمد الله على أن إختار هذا الطريق وفضل الغناء يهذا الشكل فعلينا أن نشجعه ونشذ على يديه (ما لانا سواه كبديل حتى يفرج الله عنا)فعسى أن ينشد بلا موسيقى بعد أن يمتلك قلوب الشباب والله المعين على الحق والهادي إليه"
