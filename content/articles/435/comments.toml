text = "سامي يوسف احسن على الاقل من هيف الي لبس من غير هدوم وننسي وعلى الاقل اننا نحس فيه امل ان واحد غربي اسلم واصبح من الامتدينين مش حلو دحنا لازم نحمد ربنا على النعمة دهبدل مقعدين بنشتم ونهزء ومش عجبنا سامي انت فعلا فضية وعوز تتسلي روح اعملي<br />حاجة تفيدك في حياتكوربنا سبوه في حال<br />وانا متحجبة ولما بسمع اغنيه مبرقص خالص اانت عوز تشوه صمعت الراجلالطيب ده وانا اتمنى اني اشوف ويا رب"
archived = "2005-03-07"
