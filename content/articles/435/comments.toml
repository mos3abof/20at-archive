subject = "la elah ela allah"
text = "السلام عليكم ورحمة الله وبركاته<br />تعليقى على المقال هو لأختى نهى على ,,,<br />يا اختى الكريمة عندما حرمت الخمره لم تحرم مرة واحده بل حرمت على مراحل حتى يتقبلها المجتمع الذى كان يعتبرها شئ اساسى كالماء..اما انت فتريدي ان يتحول المجتمع 180 درجة مرة واحده وهذا بكل المقاييس لا يمكن .يكفى ان اذننا نكرت الابتذال الذى كنا نسمعه كل يوم برضا نا او رغما عنا .ونكرت اعيننا الابتذال الذى يتمثل فى اجساد رخيصه تعرض لنا يوميا باسم رسالة الفن الذتى لا ادرى من اين اتوا بها .فبالله عليك عندما نجد عكس كل ذلك معانى راقيه ايمانيه ومشاهد تذكرنا بقدرة الله نقول ,,,,الصوت كان عالى والتصفيق كان غير لائق .يا اختى صعود السلم ياتى درجه درجه وليس دور دور.أليس كذلك؟والله انى لادعو لسامى يوسف ان يسر له الله ان يهذب اسماعنا ويمتع ابصارنا بما حرمنا من يوم ما بدأ كاظم الساهر يجيب دباديبه معاه .ومن يوم ما نسيت نانسى عجرم ملابسها فى تصويرها لكل اغانيها وفى حفلاتها .<br />يا اختى يكفى انا نذكر الله عند سماعه,بارك الله فيه وعليه وجمع بيننا وبينه وجميع المسلمين فى جنة الفردوس .اللهم امين...."
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 64
subject = "لا حول ولا قوة الا بالله"
text = "بسم الله الرحمن الرحيم<br />والله لا اعرف ماذا اقول فالمفروض ان اختلاف الاراء لا تؤدى الى تبادل الاهانات بهذا الشكل المحزن والمخزى فى نفس الوقت وفى هذا الوقت من الزمن الذى يتحد فيه اعدائنا ضدنا ونحن نساعدهم بفرقتنا.وارد على الاخ الذى يذم الصوفيه بقولى له استغفر الله لنفسك ولهم فلقد اغتبتهم والله يا اخى .ولاختى من فلسطين التى تقول هؤلاء بنات الشعب المصرى يا اختى ان مصريه واكثر ما اكرهه ان ارد عليك رد غير لائق ولكن يكفى ان اقول لك ان دماء المصريين التى اهدرت لاجل اعلاء شان الاسلام سواء على فلسطين او غيرها لن تذهب هباء حتى لو لم يعجب عرب اسرائيل .ويكفى ان الرسول صلى الله عليه وسلم انه قال اننا خير اجناد الارض .واننا اذا كنا نبكى فلسطين فنحن نبكى المسجد الاقصى الذى نشتاق للصلاة فيه.ونشتاق لتحرير ارضنا التى سبق وحررها صلاح الدين.ام هل تراك لم تدرسى ذلك بعد يا بنت ال17 عاما التى تخجل ان تفعل ما تفعله بنات الشعب المصرى .غفر الله لنا ولهم ولجميع المسلمين.<br />اما الاخ الذى يقول (حجاب عمرو خالد)يا اخى يكفى انه هدى الكثيرة ات والكثيرين من بنات وشباب المسلمين بهداياية الخالق سبحانه .حتى ولو كان قد دلهم على اول الطريق فلقد اخذ ثوابهم.اما حضرتك فمن الواضح انك لم تسمع حلقه واحده من حلقات عمرو خالد بقلبك حقا.سامحك الله وايانا.<br />اما انك تحترم غير المحجبه المحتشمه ولا تحترم المحجبه غير المحتشمه فكلاهما على خطأ هدى الله المسلمين جميعا ولكن ما هى معايير حكمك على كلاهما.أرجو ان تراجع نفسك جيدا بالله عليك.<br />واؤكد لك اننا لو انشغلنا بانفسنا لاحتجنا اعمارا فوق اعمارنا لنصلح انفسنا .هدانا الله واياكم والمسلمين جميعا.<br />اسفه على الاطاله .والسلام عليكم ورحمة الله وبركاته."
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

