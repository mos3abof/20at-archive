[[comments]]
order = 26
subject = "للعنوان محصلش"
text = "من فضلك أخي أنا لن أناقش سامي يوسف أو حفلته.فأنا لم أحضرهاولا تعنيني. لكني متاكدة أن سامي يوسف لو كان بعث مشاركة كان هيتكلم بأدب شوية .الإسلام مش عايزنا ندافع عنه بهذه الطريقة الفظة يعني من الاخر بناقص اللي هيدافع عن الدين كده.وإذا كنت بتبعت عشان تنصر دينك أو تصحح مفهوم يبقى مش كده وإذا كنت بتبعت عشان حاجه تانيه يبقى تراجع نيتك أو ما تبعتش خالص.وكفايانا بأه تنفير في الناس وتشويه لسمعة ديننا بطريقتناال(..)في الكلام.وتذكر أخي إن أول ٌقاعدة في الكلام إنك ما تسفهش رأى حد ده غير إنك بتعلق وتتريأ على حاجات ملهاش دعوة بالموضوع أصلا...............وشكرا"
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
order = 27
subject = "فين البديل..........."
text = "أنا لست مع الحفلةولكن أوجدوا بديل.سامي يوسف عمل دعوة في انجلترا(بل و الدول العربية أحيانا) أكتر من ناس كتييير ملتزمين هناك.بس مش صورة جيدة للإسلام وأديكو شفتو الشباب بيكلمو بعض إزاى.المطلوب منا إيجاد جيل من الشباب عارف دينه(( صح)) ويقدر يتكلم صح ويدي واجهة كويسه للإسلام وبعد كده نقول (سامي يوسف وحش)ولما نعرف نكلم بعض كويس الأول نبقى نقول لسامي يوسف بطل واحنا هنتكلم."
archived = "2004-12-07"
capture_url = "https://web.archive.org/web/20041207140645/http://www.20at.com:80/article.php?sid=740&amp"

[[comments]]
