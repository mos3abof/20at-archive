subject = "حجاب عمرو خالد"
text = "الى الأخ أو الأخت اللى علق و قال \"قالولنا نرضى بحجاب عمرو خالدو نرضى بالدنية فى ديننا\"....فيه ايه يا عم؟؟ هو فيه حجاب دلوقتى اسمه حجاب عمرو خالد؟؟ و هو لو كان فيه بنات كانوا بيحضروا دروس عمرو خالد و لابسين حجاب مش مظبوط, تبقى غلطة و ذنب عمرو خالد؟؟ طب ايه الصح فى رأيك؟ انهم كانوا يقعدوا فى بيوتهم و بلاش يروحو هذه الدروس؟؟<br />يا عم ارحمونا بقى و كفاية غل و حقد على الراجل...هو كل واحد قاعدلى فى بيتهم يفضل بس ينتقد فى الناس من غير ما يكون هو نفسه قدم للدين ربع اللى الناس اللى بينتقدهم دول قدموه؟؟<br />ارحمونا بقى, كفاية....العملية مش ناقصة"
