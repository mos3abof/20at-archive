[[comments]]
order = 179
subject = "حرام الافتراء ده"
author = "لسلام عليكم ورحمة الله وبركاته"
text = "اولا انا عايزة افهم شئ ليه يعنى الهجوم الشديد ده على اخ لينا فى الاسلام معملش شئ الا انه خرج يقول اتقوا الله فى الفن الى مش فن فن مبتذل كله رقص وخلاعة وبدأ يعطى روح جديدة للفن ويجذب الشباب اليه من خلال الفن ليعرفوا كيفية حب الله وحب رسول الله صلى الله عليه وسلم هو ده يكون جزاءه ان احنا نحط مقال لايوصف الا انه افتراء هو يعنى كان كويس لليغنى عن الرسول ويغنى اغانى ساقطة ده نهللوه ونقول الله ومنطلعش ولا مقالة واخونا سامى الانسان المحترم الذى لايرضى الا ان يكون فنه رساله لاحترام دينه امام الناس كلها اجانب وعرب وغيرهم نطلع عليه مقالات ومقالات مشينة وافتراء وكذب اتقوا الله اتقوا الله لو تعرفون الناس التى تحترمه واسلمت باغنيته المعلم لما كنتم قلتم كذلك بالله عليكم افعلوا ولو واحد على مليون من الى بيعمله وبعدين تعالوا اتكلموا ياما تسكوتوا وللابد نفسى اشوف صاحب المقال ده عمل ايه لدينه بيصلى وبيصوم وبس طيب الاسلام مهان عملت ايه للاسلام طلعت مفتخرا بدينك وتقول للعالم انا من امة محمد صلى الله عليه وسلم زى اخونا سامى ولا بس شاطر تكتب مقالات تعيب فيه اتقى الله اتقى الله اتقى الله ولو انك تشعر بهذه الكلمة لتمسح هذه امقالة التى كلها كذب وافتراء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144754/http://www.20at.com/article.php?sid=740"

[[comments]]
order = 180
subject = "معقووله"
author = "يب اش راح يسوي"
text = "ليش لازم هو يتحمل خطا مب هو اللي مسوي<br />يعني اذا البنات تمايلو او رقصو ذنب سامي شو<br />اللي ساوا سامي شي محد سوا قبله<br />الكل لاهي بنفسه<br />والشباب عم تطيش واكثرهم يسمعون اغاني وما بعرف ايش<br />بس والله والله انا وحده من اللي نهديت على يد سامي<br />كنت يوم كل عاده قاعده اقلب بالقنوات طبعا ابحث عن قناة فيها اغناي<br />بس ما اععرف كيف وضغطت على القناة اقرا<br />وكانت فيها اغنيه لسامي<br />طبعا انا كنت متصوره انها اغنيه عاديه مثل بقيه الاغاني<br />حتى اني استغربت كيف يعني اقرا قناة ما فيها اغاني وشي من هذا القبيل<br />بس المهم<br />بعدين لما بدا يغني وافتهمت شو مضمون الاغنيه<br />والله اني تميت ما اعرف شو اقول<br />بس المهم الاغنيه جذبتني كثيير<br />وفي اخر الاغنيه كان موجود اسم الموقع وعلى طول<br />بعد ما خلصت الاغنيه دخلت على النت<br />ويااااااااااااااه شو لقيت احلى اغاني بعمري سمعتها<br />ومن يومها انا لحد الان ما سمعت اي اغنيه<br />حتى رفيقاتي بالمدرسه عطيتهم الموقع ونصحتهم بان يسمعوها احسن من الاغناي<br />والحمد لله والشكر<br />الواحد حسب نيته اذا كانت صافيه او لا<br />لان طبعا في بعض رفيجاتي لما شافو<br />قاللوووو ياي هذا حلو كثير ومن هالكلام<br />بس المهم الكلمـــــــــــات اللي يقولها هو<br />ومبين انها نابعه من اعمـــاااق القلب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144754/http://www.20at.com/article.php?sid=740"

[[comments]]
