text = "طبعا اللي يحاول يسوي خير لازم يتعرض<br />للتوبيخ من ناس حساد<br />وهذا اصلا عنوان ووسام للمنشد نفسه<br />لان طالما هناك نقاد , وحساد , إذا<br />هناك نجاح .<br />اتمنى انه الله يهدي عن طريقة البشر إلى<br />دين الحق , وكفايه اننا نشوف فيه بريق<br />للإسلام في البلدان الإجنبيه<br />ومع السلامة واقول للحساد تر انتوا<br />قاعدين تخلون الحسد يآكل حسناتكم"
