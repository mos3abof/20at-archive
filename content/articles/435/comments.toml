[[comments]]
order = 123
subject = "السلام عليكم"
text = "من هدفنا تشجيع هذا اللون الجديد من الغناء الهادف حتى ولم يكن في غاية الكمال لان كل شيء في بدايته ناقص بالتاكيد ولم يولد شيء جديد الاويلاقي الاستغراب من البعض وايضا يمر بعدت مراحل ينتهي بعدها بالنضوج والكمال لذلك لا نؤاخذه على بعض الاخطاء في سبيل تحقيق الهدف الاسمى من تلك الاخطاء وهو انشاء فيديو كليب نظييف وبذرة هذا العمل تبدا من هنا فتلك ليست الا البداية التي لانها خالصة لوجه الله ونظيفة فقد دخلت قلوب الناس سريعا وشجعوها ووجدوا فيها بديلا لما نراه اليوم نعم البديل النظيف والمعاني التي تتدخل النفوس لهذا علينا ان نشجع هذه المعني , اما بالنسبة للصور والبوستارات هذا ليس خطاسامي يوسف او خطا اغانيه انه الخطا الذي نشا في عقول الشعب الصورة التي تربت في اذهانهم عن استغلال اي نجاح باي وسيلة بان يبيعوا صوره فيقبل على شراءها البنات المراهقات الاتي لم يفهم مغزى الاغنية واتخذوا طريقا اخر وهذا ماتعودوا عليه من المغنيين السابقيين من يعجبوا به يعلقون صوره وليس خطا سامي يوسف انه ظهر بمظهر لائق ونظيف ومحترم فاعجبت به الفتيات ولكنه كان يجب ان يظهر بهذا المظهر ليقدم صورة مهمة عن المسلم الكامل<br />والحق يقال لم يخطا في شيء ولكنه خطا تعود الناس على الفيديو كليب الاخر<br />وشكرا"
archived = "2005-03-07"
capture_url = "https://web.archive.org/web/20050307092859/http://www.20at.com:80/article.php?sid=740&amp"

