[[comments]]
order = 3
subject = "حرام عليكم"
author = "ميادة"
posted = "2006-02-14"
text = "انتوا موقع غريب جدا .. بقى تعطوا أهمية لعيد الحب وتعملوا له مخصوص ملف كامل وكأنه حاجة مهمة قوى فى حياتنا . ومكلفتوش خاطركم تعطواأهميهلما حدث للرسول من إهانة ، أو موضوع العبارة المصرية ، أو حتى لو مش عايزين أعملوا حاجة عن فوز مصر فى المباريات الأفريقية . انتوا فعلا مش لاقيين كبير ينظم عقولكم والعمل عنكم واضح انه كوسة جدا .<br />اللى نفسكم تعملوه بتعملوه ، واللى ما يمشيش على هواكم تتطنشوه!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113908/http://www.20at.com/article2.php?sid=438"

[[comments]]
order = 4
subject = "من حق كل انسان يقول رايه"
author = "sweet_princess"
posted = "2006-02-14"
text = "يا جماعه من حق كل انسان يقول رايه وماحدش بيعتدي على حق اي حد في انه يقول رايه وانا مش شايفه حد من اللي اتكلمو غلطان حتى اللي اعترضو على الموضوع بس احنا مشكلتنا اننا بنقول دايما اننا بنقلد الغرب ودا غلط لو تفتكرو الغرب اصلا اساس حضارته مننا احنا كمسلمين اما فكرة الاحتفال بعيد الحب فدا تعبير عن حبك مشللي بتحبه وبس لكن لكل اللي حواليك<br />وبعدين احنا عندنا هنا في مصر بنحتفل بعيد الحب المفروض يعني يوم 4نوفمر اما بالنسبه للي بيحصل وحكاية الكاركاتير الللي اتعمل عن الرسول الكريم عليه الصلاة والسلام فهو كان عارف كده بدليل انه قال<br />(يوشك ان تداعى عليكم الامم كما تتداعى الاكلة الى قصعتها)واحنا للاسف بنعيش الزمن دا دلوقتي والحل الوحيد هو اننا نتحد كلنا كدول عربيه وعمرنا ما هننتصر او تعلو كلمة الاسلام الا بكده ولو قلنا اي شئ تاني نبقى بنضحك على بعض دا رايي المتواضع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113908/http://www.20at.com/article2.php?sid=438"

[[comments]]
order = 5
subject = "الله يسامحك"
author = "عبدالله مفتاح"
posted = "2006-02-14"
text = "يا ريت يا اللي انتقدتني نقدك يكون هادي شويه انا مش عارف انت زعلان مني كده ليه وعلى العموم حقك عليا انا مقصدتش ادايقك بخصوص بقا اني متعقد من البنات بالعكس انا بقدر البنات جدا واما ان عمري ما حبيت انا بعترف ان عمري محبيت الحب بتاع الافلام العربي وليا الشرف لاني مصمم ان حب الافلام العربي ده مش حب وبردو مصمم على ان الحب انبل من ان يدخل فيه افعال الافلام العربي<br />اما بقا بخصوص وجهي اللي بتقول عليه قبيح ولله الحمد والحمد لله انا وجهي مش قبيح ولله الحمد بردو بشهادة الجميع وان كنت عايز تشوف صورتي ممكن اوريهالك عشان تعرف ان انا لو حبيت اقلد الافلام العربي مش هغلب ابدا<br />بس يا ريت تبقى تكتب اسمك عشان اكلمك بيه<br />وربنا يهديني ويهديك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113908/http://www.20at.com/article2.php?sid=438"

[[comments]]
order = 6
subject = "أتذكر النبي؟!"
author = "محمد علي"
posted = "2006-02-14"
text = "والنبي يا عم عبدالله مفتاح بلاش فلسفة علشان باين عليك متعقد من البنات او عمرك ماحبيت او وجههك قبيح ..<br />الاحسن تقرا وانت ساكت يا عبدالله قفل .. وارحمني علشان انا بتشل من تعليقاتك السخيفة<br />و حضرتك بتقول\" و النبي\"؟<br />بالله عليك لو كان النبي (ص) بينناهل رضي بما يسمى بتلك الآثام و المعاصي التي تحدث باسم الحب؟<br />الحب في بين الجنسين في الإسلام ليس له إلا غاية واحدة و هي الزواج على سنة الله و رسوله<br />و اتقوا الله في ديننا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113908/http://www.20at.com/article2.php?sid=438"

[[comments]]
order = 7
subject = "عيد وثنى"
author = "امين الشيخ"
posted = "2006-02-14"
text = "(مع حبي) !! بهذه العبارة و قَّع (القس فالنتاين) – قبيل إعدامه- الرسالة التي كتبها لابنة الإمبراطور ( كلاديوس الثاني) – الذي كان قد حرم الزواج على جنوده حتى يتفرغوا للحرب و القتال !! و وفقاً لإحدى الروايات الثلاث التى توردها الموسوعة الكاثوليكية حول قصة الإحتفال بـفالنتاين، فإن القس فالنتاين الذى كان يخرق الأمر الإمبراطوري، فيقوم بعقد الزيجات للجنود – سراً- تم إعدامه في يوم الرابع عشر من شباط/ فبراير 270م الذي يوافق ليلة العيد الوثني الروماني(لوبركيليا)، الذي تم ربطه فيما بعد بذكرى أعدام فالنتاين .<br />و في العصر الفكتوري تحول العيد إلى مناسبة عامة، عندما طبعت لأول مرة بطاقات تهنئة بهذا اليوم، و كانت الملكة فكتوريا ترسل مائات البطاقات المعطرة بهذه المناسبة أفراد و أصدقاء الأسرة الملكية في برطانيا، و صارت تتنوع طقوس هذه المناسبة؛ من تبادل للورود الحمراء، إلى بطاقات التهنئة، إلى صور (كيوبيد) – إله الحب عند الرومان القدماء- ...إلخ .<br />فإذا كان مبرراً في حضارة الغرب التي جعلت (بلازما) دمها، و ماء حياتها من عصارة الوثنيات القديمة للرومان و اليونان، تلك الوثنيات التي تجعل من كل شيئ عيدا و قداسا.. و تجعل لكل شيئ إلهاً و رباً! فللزرع إله ويوم .. و للخصب إله ويوم .. كما للجمال إله ويوم .. و للحب إله ويوم أيضاً!!.. و على دربها مضت الحضارة الغربية العصرية .. فللعمال عيد و طقوس .. و للأشجار عيد و طقوس .. و للأم عيد و طقوس .. و للحب عيد و طقوس!!.<br />فإذا كان ذلك مبرراً لدى الغربيين لأسباب خاصة تتعلق بطبيعة فهمهم للدين و الحياة، فما هو تبرير جود هذا اليوم في أمة الإسلام، تلك الأمة التي سما بها دينها عن كل ترهات الأيام و الأعياد و الأوثان .. فلم تعرف من الأعياد إلا أطهرها و أجلَّها: (العيدان؛ الأضحى و الفطر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113908/http://www.20at.com/article2.php?sid=438"

[[comments]]
order = 8
subject = "لا تعليق"
author = "لن اعلق على ما يسمى بعيد الحب"
posted = "2006-02-14"
text = "تعليقي سيكون على موقع عشرينات<br />أحد الاخوة الافاضل لما تضايق من طلب القراء المتزايد بخصوص قضية النبي صلى الله عليه و سلم .. أوجد حجة لعشرينات انه الموضوع موجودعلى كل المواقع و في كل مكان و مافيش داعي انه عشرينات تكرر و تعيد نفس الموضوع ..<br />لم يرد اي احد على الاخ الفاضل لانه ذلك كان رايه الشخصي و انا بحترمه 0... و لكن الرد جاءه من عشرينات انفسهم .. واضيع اللي اسنه عيد حب و فالانتاين هو ايضا موضوع الساعة \"الغير مهم طبعا \" و كل الجرايد و كل المواقع تتحدث عنه سواء معارض او مخالف فلماذا اذا عشينات تركب الوجه نفسها و تعيد نفس المواضيع المكررة ؟؟؟؟؟<br />طبعا هذا ليس سؤالي و لا اريد له جوابا .. هو فقط عشان اوضح سقوط الحجة اياها عن موقف عشرينات<br />و تحياتي لكم ..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113908/http://www.20at.com/article2.php?sid=438"

