subject = "من الاخر"
author = "عبدالله مفتاح"
posted = "2006-02-13"
text = "اظن ان بعد اليوم ده لما بقابل اصثحابي كان كل واحد فيهم يقول انا طلعت بمسكة ايد واللي يقول انا طلعت بخروجه واللي يقول انا طلعت ب......<br />ادي الحب وادي اللي بيحتفلو بعيد الحب<br />طبعا غلطانين لانهم بيرتكبوا قله .... باسم الحب لكن طبعا الحب اكثر نبل من انه يدخل في الحاجات السيئه دي<br />وربنا يستر"
archived = "2006-11-02"
