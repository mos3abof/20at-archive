subject = "الحب نعم والكره كلا والف كلا"
author = "اول شي بدي قوم في هو القاء التحيه وبدي اسا ناقش معكون بموضوع كثير مهم وهو \"الحب\" الحب كثير سامعين عنوو كلنا ويمكن كلنا حبينا انو نجربوو بس هل نستطيع ان نختار الانسان الصح؟"
posted = "2006-06-09"
text = "لا والف كلمه لا لانو اني عايشي بعصر وشايفي قدامي كل شي وبيخوذ من حيلي انو اني ما بعرف اختار الانسان الصحيح هلي لازم حبو وهو بيحبني علشان هيك هلي عابكتبو بس نصيحه للبنات وللشباب ونشالله تتقبلوها ..."
