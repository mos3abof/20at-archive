[[comments]]
order = 1
subject = "من تشبه بقوم صار منهم"
author = "يكفي أن نعلم أن قصة عيد الحب هذه كانت لقس مسيحي يسمى فالنتين و كان يحب واحدة من العائلة المالكة فقتله الحاكم فبذلك سمي يوم موته عيد الفالنتين. أى ان القصة كلها ليست منا نحن العرب و ليس لنا بها أي صلة ، و إذا بناندخل وراء من يعادونا و يقتلونا في كل مكان و يظهروا لنا العداء ، إذا بنا نسحب ورائهم و إذا دخلوا جحر ضب دخلنا ورائهم ."
posted = "2006-02-14"
text = "كلمتى الأخيرة لمن يحيي ذلك اليوم قول النبي صلى الله عليه و سلم فيما معناه من تشبه بقوم صار منهم<br />اللهم ارحمنا و لا تؤاخذنا بما فعل السفهاء منا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113908/http://www.20at.com/article2.php?sid=438"

