[[comments]]
order = 3
subject = ""
author = "ابو شرف الفلسطيني"
posted = "2007-12-13"
text = "انا ادعى ابو شرف اسكن في مدينة رفح على الشريط الحدودي جنوب قطاع غزة اعرف ريشل والله يا اخوة لم اشعر يوما بانها امريكية ، كانت تلاعاب الاطفال وتلحوا معهم وكأنها مولودة في هذة المدينة كانت تقف امام الجرافة الاسرائيلية دون خوف هي ومعها بعض اصدقائها زي انيو كولا وتوم جون ما بعرف البقين بس انا رايت ايضا صديقها انيو كولا بام عيني يقف اما الجرافة الاسرائيلية دون خوف والله يا خوة احنا الفلسطينية كنا نخاف من نحاول الي ان نصل الي تلك الجرافات الاسرائيلة وهي تهدم البيوت ولكن ريشل وزملائها من نشطاء السلام كانوا لايخافون من ذلك في يوم مات ناشط سلام يدى توم في نفس المدينة اصيب بطلق ناري في الراس من قبل الجنود الاسرائيلين المتمركزة على الشريط الحدود في المدينة بقرب من عمارة العاصي المهم حدث اطلاق نار على اطفال صغار لا يتعدون 12سنة حين رائ توم اطلاق النار على الاطفال ذهب مسرعا لانقاظ طفل صغير من عائلة برهوم كان يلعب في المنطة المهم اصيب بطلق نار في الراس اذكر انه كان لابس قبعة حينما جاءت الرصاصة فيه والله يا اخوة القبعة طارت عن راسه .<br />المهم هؤلاء نشطاء السلام يستحقوا منا كل الفخر لهنم تركوا اجمل بلدان العالم وتركوا العز يدافعوا عن بيوتنا<br />وعلى رائ ابونا الختيار هذة شهيدة رحما الله ورحم ابانا الرمز القائد الخالد فيقلوبنا ابا عمار وجميع شهدا فلسطين"
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715125926/http://www.20at.com:80/20at/eshtbak/3441.html"
