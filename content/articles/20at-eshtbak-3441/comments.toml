author = "مصري"
posted = "2007-03-17"
text = "كانت إنسانة، لا أحسب الكثيرين يستحقون هذا الوصف. خرجت من أسر الصمت وضيق الأفهام ووحشة التعصب لتموت على ارض غريبة عنها، ولكن دمها الذي سال على هذه الأرض لم يسل غريبًا. كان دم إنسان اكتشف إنسانيته وعاد إلى أرض الله، بشرًا فحسب، محبة فحسب، وحياة ذهبت ولكن يظل بيننا عبيرها، وصورة لإنسان نبيل.<br />سمعت البعض يرفض الترحم على روحها بدعوى أنها غير مسلمة، أحمد الله أنها لم تكن مثلهم، وليتنا نكون مثلها.<br />رحمها الله."
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715125926/http://www.20at.com:80/20at/eshtbak/3441.html"

