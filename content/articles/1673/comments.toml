author = "ى نقاط :-"
text = "* سلام على الجمع الكريم<br />*يا عمنا قلوهم اسمك و ريحهم<br />*انا زعلت جدا على التعليقات<br />*شكرا لاستجابتكم بخصوص الفيديو الخاص بايمن نور (رجع يشتغل تانى)<br />*الموقع نسطتيع ان نقول انه حصل على نفس تقدير الاسبوع الماضى (لم يقل)<br />*اخيرا الاخ المراقب مش محايد و انا احترت فيه و بسبب اسلوبه دا انا قررت مكتبش رأيي تانى فى هذه الزاوية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151619/http://www.20at.com/article.php?sid=1561"

