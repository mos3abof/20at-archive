subject = "ragel mashy mashy mashy"
author = "100. Rabbi hab lee mina alssaliheena"
posted = "2006-01-30"
text = "100. \"O my Lord! Grant me a righteous (son)!\"<br />101. Fabashsharnahu bighulamin haleemin<br />101. So We gave him the good news of a boy ready to suffer and forbear.<br />102. Falamma balagha maAAahu alssaAAya qala ya bunayya innee ara fee almanami annee athbahuka faonthur matha tara qala ya abati ifAAal ma tu/maru satajidunee in shaa Allahu mina alssabireena<br />102. Then, when (the son) reached (the age of) (serious) work with him, he said: \"O my son! I see in vision that I offer thee in sacrifice: Now see what is thy view!\" (The son) said: \"O my father! Do as thou art commanded: thou will find me, if Allah so wills one practising Patience and Constancy!\"<br />103. Falamma aslama watallahu liljabeeni<br />103. So when they had both submitted their wills (to Allah., and he had laid him prostrate on his forehead (for sacrifice),<br />104. Wanadaynahu an ya ibraheemu<br />104. We called out to him \"O Abraham!<br />105. Qad saddaqta alrru/ya inna kathalika najzee almuhsineena<br />105. \"Thou hast already fulfilled the vision!\" - thus indeed do We reward those who do right.<br />106. Inna hatha lahuwa albalao almubeenu<br />106. For this was obviously a trial-<br />107. Wafadaynahu bithibhin AAatheemin<br />107. And We ransomed him with a momentous sacrifice:<br />108. Watarakna AAalayhi fee al-akhireena<br />108. And We left (this blessing) for him among generations (to come) in later times:<br />109. Salamun AAala ibraheema<br />109. \"Peace and salutation to Abraham!\"<br />110. Kathalika najzee almuhsineena<br />110. Thus indeed do We reward those who do right.<br />111. Innahu min AAibadina almu/mineena<br />111. For he was one of our believing Servants."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112700/http://www.20at.com/article2.php?sid=235"

