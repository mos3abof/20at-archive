[[comments]]
order = 22
subject = "logical or not"
author = "If you want to objectively judge or refute a thought, you do not do this by just calling it an idiocy. A general way to do this is to examine it for inconsistencies either with itself or with agreed upon facts. OK."
posted = "2006-01-19"
text = "For me, the idea that Allah ordered human sacrifice contradicts the essence of his teaching that human life is sacred and the explanation that this order was a test of Ibrahim’s loyalty means that Allah does not trust his prophet which is unimaginable. That is why I rejected this interpretation of the story and started to look for another understanding to the events narrated in the holy Quran. When I went back to the story I found that Ibrahim says that he dreamt about slaughtering his son. He did not say that Allah order him to do so, and in one of the taffaser (Altabry) it is said that he swore the sacrifice of his first son even before having a son وَكَانَ فِيمَا ذُكِرَ أَنَّ إِبْرَاهِيم نَذَرَ حِين بَشَّرَتْهُ الْمَلَائِكَة بِإِسْحَاق وَلَدًا أَنْ يَجْعَلهُ إِذَا وَلَدَتْهُ سَارَة لِلَّهِ ذَبِيحًا. Something similar to the story of Abdel motaleb who swore to sacrifice his 10th son.<br />So I though of the possibility that Ibrahim was motivated by his devotion to Allah and wanted to show his acknowledgement to Allah by sacrificing the most precious thing he had, that is hi son. And not by a direct order from Allah. Now having come to this idea I subjected it to criticism because it clearly become invalid if in any part of the story Ibrahim says that allah ordered him to slaughter his son. When I read again the story I found that the word order was Isameal’s ,or Isaac’s , conclusion. Ibrahim never said that it was a revelation (wahy) or a divine order to cut the throat of an innocent human being.<br />The other thing that can make this idea invalid is if the dreams of the prophets were equivalent to revelations. I looked up The Hadith that all the prophets’ dreams are revelations; it is not in el Bokhary or Muslim’s sahihs. The idea that everything the prophets see or say is directly revealed or ordered by God means that the prophets are very close to being personifications of Allah, as the Christians see Jesus, which contradicts the essence of Muslim beliefs that prophets are humans who can make mistakes.<br />So far, I have not seen any fact that contradicts this interpretation I proposed. While the one I was taught as a child, which is one that you repeated, has two contradictions as explained earlier and therefore illogical. No offenses are meant. Please, do not wear the warriors gear of obscenities in your reply, we are not fighting any battle here; we are just exchanging ideas.<br />The analogy you draw between scholars and physicians has two serious flaws in it.<br />1- The success of any idea in medicine can be tested. When a scholar tells you that if you do this or that Allah will be pleased, there is absolutely no way to know for sure that Allah is pleased with your act. On the other hand when a Dr tells you take this medicine and you will recover, you can see, and in some illnesses measure, the success or failure of his opinions.<br />2- A Dr’s medical ideas interferes in the life of a limited section of the population, his patients and their families, and for a limited time, till they recover or die, and in limited aspects, only the aspects related to their illness. On the other hand scholars effects peoples beliefs which in turn affects everything in their lives for all the time.<br />For these two reasons I think that every person should use his/her mind in understanding the religion and not become a passive consumer or a fervent defender of scholars’ interpretations."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112700/http://www.20at.com/article2.php?sid=235"

