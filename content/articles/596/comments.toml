posted = "2006-01-20"
text = "I will give a silly example. If you and your colleague at work share the same work car and he asks you to use the car over the weekend then you conclude that he must have received orders from company directive and say to him \"I agree, take it and fulfil the duties assigned to you \". Can a third person who hear you exchanging these two sentences say for sure that all what your colleague is going to do with the car tomorrow are explicit orders of the company directive? Could not it be that your colleague is trying to excel in extra duties that was not assigned explicitly to him Or that he will use the car in personal affairs?<br />Remmebers that profits are human beings in all the aspects unless in revelations ( inma ana basharon methlakom youha ilai) so it is not a blasphemy to say that Ibrahims dream was not an order from God especially that ,again, neither him nor God said so. Ít is not also a blasphemy to assume that a person in influenced by his environment.<br />As explained earlier, the story, as you say it, is not supported by El Quran. Ibrahim, the would be killer, yes someone who takes the life of an innocent human is nothing but a killer in all the religions and laws, has not said that God commanded (2mr) or revealed (awha) to him this horrible act. I believe that human sacrifice is a despicable pagan ritual that was not and can never be asked by Allah.<br />Unfortunately, the sour tongue did not reveal a critical mind that can objectively refute an idea.<br />Salam<br />The Egyptian"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112700/http://www.20at.com/article2.php?sid=235"

