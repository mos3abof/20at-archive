text = "والله الاستاذ شعبان راجل محترم , عبر عن اللى شافه بطريقته هوه , وبعدين هوه غلط فى ايه .. قال بتوع عجول , والله صح فعلا هما بيصدرولنا لحوم .. قال اكبر ما فيهم غبى .. ودى الحقيقه علشان يفكروا يعملوا حاجه زى دى , والله الحاج شعبولا استعمل معاهم الرأفه فى الفاظه .. وفقكم الله يا حلوين ياللى بتهاجموا اللى بيدافع عن رسولنا .. وانا احساسى 100% ان البهوات اللى هاجموا شعبان بشراهه مش حاملين الديانه المصريه"
