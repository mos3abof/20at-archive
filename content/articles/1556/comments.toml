subject = "منع اغنية تسيء للدانمارك"
author = "محمد خليفة"
posted = "2006-03-14"
text = "انا مش عارف ليه التحامل كده على شعبان عبد الرحيم يكفي انه له صوت وصل للناس اما نحن فأين صوتنا؟؟؟؟؟ وبعدين ما تخدوا شعبان قدوة بذاته ،، لكن انظروا الى اغانيه لو فيها عيب ابقوا اكلموا ، وبعدين شعبان ولا غيره ،، بقينا ناكل في بعض وسبنا الاهم من كده وهية الاساءة لرسولنا الكريم ،،، شعبان صوته وصل ،، واغنيته وصلت ،،، لكن هل صوتك انت وصل ؟؟؟؟"
