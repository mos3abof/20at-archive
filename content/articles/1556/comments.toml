posted = "2006-02-18"
text = "قال العرب قديما عدو عاقل خير من صديق جاهل.<br />ما فعلته صحافة الدانمارك والصحافة الغربية من هجوم على الاسلام لا يجب ان نواجهه بالجهل والتخلف والسب<br />بل ارى ان النصرة الحقة هى المقاطعة والاهم الالتزام بنهج الرسول صلى الله عليه وسلم واتباع سنته<br />وفقنا الله الى ما يحبه ويرضاه<br />وهدانا الى الخير"
