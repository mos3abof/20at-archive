[[comments]]
order = 13
subject = "الى محمد على"
author = "واحد بيعشق فلسطين"
posted = "2005-12-23"
text = "انا مو بنت يا محترم هذا اولا<br />المهم انا لم اذكر الا الحقائق وهي معروفة في الشارع الفلسطيني<br />وبما انك لا تعيش في فلسطين فانت تاخذ وتيمع وتشاهد الجانب الوردي لهذه التنظيمات<br />اتحدى اي واحد من حماس الداخل ينكر كلامي وانا مستعد لمانقشته<br />اما عن سبك لي فالله يسامحك<br />انا من حقي ان انتقد اي تنظيم انا لم اسب او اتهجم على اي شخص بعينه وتعليقي موجود بامكانك مراجعته انا انتقد التنظيم كاداء وممارسة وليس كاشخاص<br />افهمت يا محمد ولا اعيد تاني<br />اما نانسي فهو للمويه ولفت الانتباه لان الامة وللاسف الشديد تعيش ثقافة نانسي وغيرها<br />افهمت<br />تحياتي للجميع<br />nancy_love_you@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

[[comments]]
order = 14
subject = "الي نانسي ..أنت مخطئ"
author = "الاخ الكريم الذي اطلق علي نفسه نانسي ويثول هي ثقافة االامة في البداية في فلسطين يعيشون ثقافة البنقدية والمقامة والحياة الجهادية في فلسطين تركت المجال مفتوح للجميع لينكلم ..ومن حقك أن تدلي برأيك"
posted = "2005-12-23"
text = "لكن لست محقا في تحليلك فأول مرة اسمع مثل هذا الرأي ففتخ الخصم السياسي لحماس لم اسمع منها هذا الرأي<br />بل علي العكس من يعيش ذلك هو فتح وقيادتها المتخبطة والتي ترعي فسادا في حمي الامريكان واكبر دليلعلي ذلك الوثيش المشينة التي تدين نبيل عمرو عضو التشريعي أن ان تراجع تحليك فخماش تخسر كوادر بشرية ولا تغنم شئ لاشخاصها الذين هم غير مجبرين علي الاستمرار في الحركة من الاصل الا حب فلسطين<br />فماذا يجعلهم اذن يصمتون ازاء قيادات أو غيره<br />هود لصوابك ل( نانسي )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

[[comments]]
order = 15
subject = "جيد أن نتكلم ولكن بشرط ان نقرا اولا"
author = "بشر"
posted = "2005-12-23"
text = "الساده الكرام الافاضل اصحاب التعليقات - اذكر نفسي واياكم بمقوله احد سياسي اسرائيل الدوله السفاحه من ان العرب لا يقرؤن وان قراو لابفمهمون-( او ما معناه من بعد النظره التحليليه الصادقه للامور)<br />من الواضح انه اذا علمنا القضيه الاساسيه وما البعد التاريخي للحركات وما الهدف وما الواقع والتحالفات والمكر الئيم التي تحيط بالمسلمين ككل ويبدو لي ان كل المحاورين من المتأثرين بهذا الوقع المزري اذن لكان هناك مساحات اوسع تحتوي الجميع وتوجه الجميع نحو الكليات الحرجه وعدم تضييع الوقت في الهجوم الجانبي علي من هم معك في نفس الخندق ولكم كل الحب والسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

[[comments]]
order = 16
subject = "الى محمد علي باشا"
author = "وديع شقيق نانسي"
posted = "2005-12-24"
text = "يا اخي ان انتقد حماس في ادئها السياسي انا لم اتهجم على اشخاص<br />ولم لتنكر لتاريخ حماس العسكري<br />انا انتقد الطريقة التي تعالج بها الامور وانتقد علاقاتها مع بعض الدول افهمتني يا محترم<br />واذا اول مرة بتسمع ما تحدثت عنه فهذا لا يعني انه غير موجود افهمت يا استاذ<br />واذا لم تعلم فهذه مشكلتك انت لانك تعيش خارح فلسطين وربما لا تعرف مدن في بلد مصر ولكن نحن الشعب الفل بحكم خبرتنا وثقافتنا الواسعة وتشردنا وقضبيتنا العادلة نعرف كل تفاصيل الدول العربية جغرافيا ةاقتصاديا وسياسيا اكثر من اهلها التي يعيشوا فيها<br />انا ما بدي ادخل معاك في جل<br />النظرية تقول اذا انت لاتعرف عن امر ما فهذا لا يعني انه غير موجود<br />مع تحاتي للجميع<br />اخوكم وديع شقيق نانسي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

