posted = "2005-12-23"
text = "يا جماعه انا بب الراجل ده فى الله<br />بيعرف يلعب سياسه ذى ما رونالدو بيعرف يلعب كوره<br />الاخوان المسلمين عندهم احتراف<br />الله يعزك يا حماس<br />رفعه رسنا مابين الناس<br />قالوا القوه جوه سلاح<br />قلتى وقلنا( الدين للدنيا اساس )<br />دولتنا من النهر الى البحر باذن الله<br />الاسلام هو الحل<br />yehia2784@hotmail.com"
