author = "عبدالرحمن الصعيدى"
posted = "2005-12-24"
text = "اولاً احى القائمين على هذا الحوار الناجح وهذا الجهد المشكور<br />وإلى كل متشكك ومتخوف فى مواقف حماس وكلام الإخوان نقول لقد جربت امتنا كل انواع التجارب الشرقية والغربية ولله الحمد كلهم خدعونا وسرقونا وافسدوا وضيعوا بقصد او من غير قصد ...<br />ولم يبقى سوى هذا الباب لنطرقه فأعطوهم فرصة ونؤكد لكم اننا لن نخذلكم ..ثقوا بنا وضعوا يدكم معنا لنبنى سوياً<br />ثانياً..أظن أن خالد مشعل وهو من هو أغنى الناس عن الكذب والمراوغه فهو فى موقف القوة والنتائج تشهد له بذلك ...أما الكذب فهو سبيل الخاسرين والضعفاء من أمثال فتح و الحزب الوطنى وغيرهم كثيــ<br />ـر."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

[[comments]]
order = 19
subject = "الي عايز يهج يهج"
author = "اللي مش عاجبة حماس ولا الخوان يهج زي ماهو عايز اللي باعوا الوطن بالفلوس في البنوك اليهودية دحلان والرجوب وامثالهم الشعب الفلسطيني عارف كويس مين الخاين وعارف مين اللي بيكافح ويضحي عشان البلدومين بيكافح علشان الفلوس"
posted = "2005-12-24"
text = "واللي اسمة وسام<br />عايز مين يحكمنا جرجس ومرقص ولا اية بالظبط<br />مش عارف اية المشكلة الاخوان وحماس والاسلام هو الحل والاسلام ولا 10% بيتكلموا كانهم اصحاب البلد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

