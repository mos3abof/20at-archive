text = "طبيعي ان تكون حماس في صف ايران طبيعي ان يجتمع التخلف و أيديولوجية الدمار أنهم المتلاعبون على العقول و المستبدون بشعوبهم قبل عدوهم نريد فقط ان نسألهم مادا حققتم ومادا ستحققون"
