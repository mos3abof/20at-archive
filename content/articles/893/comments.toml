[[comments]]
order = 26
subject = "فليعلم الجميع أن الله معنا"
author = "فتاة فلسطينية"
posted = "2006-02-23"
text = "\"بسم الله الرحمن الرحيم \"<br />فليعلم كل من يسير في عروقه حب الله والرسول والوطن كل من يريد الكرامة أن مصلحتنا تكون فقط مع حركة حماس وأنا متأكدة من ذللك فأنا فلسطينية وأعام ما لا يعلمه الجميع .<br />وأقول أن وجود هذا الشخص الذي حباه الله بصفات القائد الشجاع الرزين قوي الايمان هو فخر وعزة لنل فلتلم ياعمو خالد أنك موجود في أعماق قلبي فحب الله لك جعل الجميع يحبوك فيا أبتي أو يا أستاذ خالد فل تختار اللقب الذي تحبه أدعوك دعةة أتمنى أن تصل لك أقول لك ، مهما حصل ومهما قدموا من مبادرات للسلام فنحن لا نريد لانريد سلام نحن نريد استرجاع أرضنا وحقوقنا دون تنازلات ودون أن نضع آيادينا الشريفة الشريفة الطاهلرة بأيادي ملطخة بدمائنا وأدعوا الله أن يكون ملتقانا في المسجد الأقصى المارك الذي حرمك هذا العدو من الوصول له ولكن أنا كلما ذهبت للأقصى أدعوا أن لايموت أي فلسطيني أخرج قصري من الأرض أن يصلي فيه وطبعا نحن لن نيأس من رحمة الله فان نصر الله قريب .<br />والسلام عليكم ورحمة الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

[[comments]]
order = 27
subject = "المزايدات علي اخونا خالد مشعل"
author = "هاني"
posted = "2006-03-01"
text = "البزايدو علي الاخ خالد مشعل انتو لاتعرفوا الاخ خالد الاخ خالد مناضل وشريف والاخ خالد مبعد من غزة لنضاله من اجل شعبه وهو ما ببيع شعبه علشان تشريعي ولا غير تشريعي ووخالد مشعل الله يوفقه لشعبه ولامته العربيه والاسلاميه ومن حقه يدافع عن سوريا وايران وانتو البتزودو كلام مش من حققكم اتزاودو علي الاخ خالد طيب انتو البتزاودو الكلام روحو دافعو عن علي البسير في ابلادكم شوفو ايش بسير عندكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

[[comments]]
order = 28
subject = "مشاركه"
author = "هاني من غزة"
posted = "2006-03-01"
text = "انا بطلب من الاخوة البزايدو علي الاخ خالد مشعل ان يقرؤا تاريخ وماضي الاخ خالد او ان تسالو عنو احسن ما تقروا وجهاد الاخ خالد والاخوة في حماس انتو بكرة ابتعرفوا مين اليوقفوقفه راجل اما العدو ومن حق الاخوة في حماس ان لا يعترفوا بدوله االمغضوب عليه اسرائيل مش في بعض من من الوزرة السابقيين كانو يبيعوا الاسمنت للجدار والعازل واحنا انروح انقاوم واحنا مش طالبيين تيجوا اتدافعو عنا بس اول ايش دافع عن حاللك وعن بلدك بعدها ابتحكي عن حماسواعرف الفساد الفي بلدك وبعدها ابتحكي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

[[comments]]
order = 29
subject = "كلام جميل"
author = "ابو عبد الوهاب"
posted = "2006-03-26"
text = "اللي ايده في النار مش زي اللي ايده في الميه ، لكل من يتكلم عن حال الفلسطيين سواء عن حماس او عن غيرها فنحن ابناء بلد واحد .<br />وغدا كل من اخطئ سوف يعاقب باذن الله وان لم يكن من العبد سيكون من الله في الدينا قبل الاخرة .<br />واسال الله لحركة حماس التوفيق في الحكومة الجديدة , واسال الله لحركة فتح ان يهديهم الله الي ما فيه الخير وان يبين لهم الصواب .<br />اخوكم ابو عبد الوهاب<br />فلسطين ـ غزة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

