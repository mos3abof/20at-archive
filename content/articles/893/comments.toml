[[comments]]
order = 22
subject = "حركة أمل الشيعية"
author = "أبو عبد الله المجاهد السلفي المصري"
posted = "2006-01-15"
text = "السلام عليكم ورحمة الله وبركاته<br />إخواني ما أسرع نسيان الحقائق في خضم الأحداث المتلاحقة<br />هل نسيناأمل الشيعية وما فعلته في إخونناالفلسطينين في المخيمات<br />هل ننسى جراحات السنة في إيران<br />لا يوجد مسجد سني واحد في طهران<br />إرجعوا إلى كتاب \"وجاء دور المجوس\" لتعلموا المآسي التى حلت بالسنة في عهد الثورة المزيفة<br />قاتل الله السياسة التي لا دين لها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

[[comments]]
order = 23
subject = "الغاية تبرر الوسيلة"
author = "زهقان"
posted = "2006-01-24"
text = "بالنسبة لحماس فانها مستعدة ان تتحالف مع الشيطان علشان تدخل في السلطة زي ما حصل في مصر<br />وسؤالي الى من هو في حماس حرمتم التصويت في الانتخابات للعلمانية فما هو وجهة نظركم في التصويت للمسيحي والتصويب للمرأة اذا في واحد في حماس او الاخوان المسلمين يجاوبني اجابة صريحة في هذا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

