[[comments]]
order = 9
subject = "حيرني امرك يا حماس افندي"
author = "الباحث عن العدالة"
posted = "2005-12-23"
text = "حركة حماس عنوان للعنصرية<br />ترفع شعار من ليس في حماس فهو في النار<br />تلقن افرادها ان قادتها انبياء لا يخطئون<br />اتحدى اي عنصر حمساوي ان ينتقد قياداته فهم منزلون ولا يمكن لهم الخطا او حتى السهو<br />في بداياتها كفرت ايران وقالت عنهم شيعة لسببين الاول ارضاء حبيبتها السعودية والثاني لتشوية حركة الجهاد الفلسطينية التي تنافسها في الشارع حتى يتم شطبها وتبقى حماس هي التنظيم الاسلامي الوحيد في فلسطين<br />حماس ترفع شعار مصلحة الدعوة ومناجل هذا الشعار تغتال وتسرق وتقتل وتنهب وتشوهخ وتكفر وتخون وترفع من تشاء وتخفض من تشاء<br />حماس الاى الان تلقن افرادها بان الجهاد شيعة مع العلم ان قائد حماس خالد مشعل لا يستطيع ان يستطيع ان يخطب اي كلنة في هذا العالم الا في طهران او في الضاحية الجنوبية تحت حراسة سيوف حسن نصر الله<br />اتحدى حماس ان تخرج بمسيرة للتضامن مع سوريا<br />لا تستطيع ان تغضب حبيبتها السعودية التي تربطها بها علاقة استرتيجية هي اشبه بالزواج الكاثوليكي ليس فيها طلاق ابدا<br />وهذه حقائق لا يستطيع احد في حماس ان ينكرها<br />عند اقرب مفترق تبيع حماس سوريا والجميع وكل هذا من اجل مصلحة الدعوة<br />اي دعوة هذه انها دعوة المنتفعين في الارض<br />انها دعوة المنافقين والكذابين في الارض<br />هذه مجرد حقائق احببت ان يعرفها القارىء الكريم عن حركة حماس<br />وانتظر ردودكم على اميل nancy_love_you@hotmail.com<br />مع تحياتي للجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

[[comments]]
order = 10
subject = "محدش بيحبك يا نانسي"
author = "محمد علي"
posted = "2005-12-23"
text = "أكيد اسمك نانسي بيريز أو نانسي عجرم<br />هات دليل واحد يؤيد كلامك و بلاش تفاهة إنتي و غيرك من العلمانيين السلوليين و مجرد كلام فقاعي في الهواء أشبه بكلام اليهودي الذي أرادها فتنة بين اﻷوس و الخزرج لبث الفرق بين المسلمين<br />خليكي يا نانسي قاعدة في التكييف بتاعك تتفرجي على روتانا و سيبي المجاهدين يشوفوا شغلهم<br />على فكرة...كام ولد لغاية دلوقتي ضافك على المسنجر يا نانسي؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

