text = "و الله يا جماعه كله عادى و انا اصلا مبقتش بصدق كل اللى بقراه او اسمعه<br />و بالنسبه لعبد المنعم سلامتك من بعد موضوع الدخيله و الضرب للجدعان يا سيدى"
archived = "2006-11-02"
