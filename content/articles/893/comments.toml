[[comments]]
order = 4
subject = "إلى وسام"
author = "محمد علي"
posted = "2005-12-23"
text = "لا أحد ينكر أن حماس هي الذراع الفلسطيني لحركة الإخوان المسلمين المباركة بإذن الله و لا أحد ينكر جهادها ضد المجرمين الصهاينة إلا منافق حاقد يكن عداء خفيا ضد أمة محمد ( صلى الله عليه و آله و صحبه و سلم ) و على رأي المثل نقول تور يقول احلبوه... إنت يا وسام عايز المسلمين إرهابيين و قتلة بالعافية<br />و اسمع يا وسام... حسن معاملة أهل الأديان الأخرى من صميم ديننا الحنيف دون الحاجة للتظاهر بالسماحة و الإنفتاح دون الحاجة لوسام من وسام و لا غيره... يقول الله عز و جل : {لَا يَنْهَاكُمُ اللَّهُ عَنِ الَّذِينَ لَمْ يُقَاتِلُوكُمْ فِي الدِّينِ وَلَمْ يُخْرِجُوكُم مِّن دِيَارِكُمْ أَن تَبَرُّوهُمْ وَتُقْسِطُوا إِلَيْهِمْ إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطِينَ }الممتحنة8<br />{إِنَّمَا يَنْهَاكُمُ اللَّهُ عَنِ الَّذِينَ قَاتَلُوكُمْ فِي الدِّينِ وَأَخْرَجُوكُم مِّن دِيَارِكُمْ وَظَاهَرُوا عَلَى إِخْرَاجِكُمْ أَن تَوَلَّوْهُمْ وَمَن يَتَوَلَّهُمْ فَأُوْلَئِكَ هُمُ الظَّالِمُونَ }الممتحنة9<br />{وَقَاتِلُواْ فِي سَبِيلِ اللّهِ الَّذِينَ يُقَاتِلُونَكُمْ وَلاَ تَعْتَدُواْ إِنَّ اللّهَ لاَ يُحِبِّ الْمُعْتَدِينَ }البقرة190<br />كفى حقدا و كراهية عمياء ضد كل ما هو مسلم و قبل التطاول على المجاهدين في حماس سل نفسك ماذا فعلت أنت ؟<br />قارن نفسك ببشر بأحمد ياسين و الرنتيسي و عياش و القسام ثم فكر في الكلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

[[comments]]
order = 5
subject = "النصر قادم"
author = "سالي مصطفي"
posted = "2005-12-23"
text = "إنَّ الله الذي اختار الشعب الفلسطيني ليكون رأس الحربة في مقارعة أعداء الله من اليهود والأمريكان ومن لفَّ لفهم، لقادر بإذن الله أن يمنحه القوة وأن يرزقه من حيث لا يحتسب رغم الكيد والمكر والمؤامرات التي تُحاك ليلَ نهارَ وصباح مساء.. ﴿إِنَّهُمْ يَكِيدُونَ كَيْدًا (15) وَأَكِيدُ كَيْدًا (16) فَمَهِّلْ الْكَافِرِينَ أَمْهِلْهُمْ رُوَيْدًا (17)﴾ (الطارق)."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

[[comments]]
order = 6
subject = "افهموا ولو سمحتم يا عرب"
author = "أعتقد أن تطورًا طرأ على الفكر السياسي لحركة حماس، منذ تأسيسها وحتى الآن وأنها باتت أكثر نضجًا وذكاءً في التعامل مع القضايا السياسية، لا سيما بعد قرارها بخوض معركة التنافس على مقاعد المجلس التشريعي، لكن حماس تنفي ذلك وتقول إنها تتعامل مع كل مرحلة بأدواتها ووسائلها."
posted = "2005-12-23"
text = "وفي ظني ان حماس بعدما تبنت الخط الاصلاحي اضافة لمشروع البندقية فنحن أمام حركة لها ابعاد وافكار استراتيجية واسعة<br />ولكنها تحتاج للعون من الدول العربية المختلفة ( المتخلفة ) تحتاج عون سياسي من هؤلاء حتي لا تجد نفسها تضرب منهم<br />وفي منظوري ان هذه الدول المتخلفة العربية ( النظم و الحكام ) لو تبت افكار واستراتيجيات حماس وعاملت بها امريكا واسرائيل لما استطاع كلب منهم أن يعوي علينا ابدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

[[comments]]
order = 7
subject = "د. أحمد محمد بحر*"
author = "إنَّ التحريضَ على المقاومةِ وعلى رأسها حركة حماس واستعمال سياسة التجويع وقطع الأرزاق والتلويح بقطع الأموال عن السلطة إذا دخلت حماس الانتخابات هو تدخل سافر في الشئون الفلسطينية وهو تحريض يُراد منه إثارة الفتنة بين أبناءِ الشعب الفلسطيني؛ الأمر الذي لا يخفى حتى على أطفال الانتفاضة، وهذه خطة الجبناء اللئام الخبثاء الذين لا يفكرون في الحياة إلا من منظورٍ مادي كما يتصورون، وقد اقترح من قبلهم شمعون بيريز مثل هذا الاقتراح حين فازت حماس في الانتخابات البلدية في المرحلة الأولى والثانية فقال: علينا أن نُعطي أبناء الشعب الفلسطيني من غير حماس كل واحد مائة دولار حتى ينفض الناس عن حماس ويا ليته فعل!! فالشعب الفلسطيني يُدرك أين تكمن المصلحة فسوف يأخذ المائة دولار وينتخب حماس."
posted = "2005-12-23"
text = "* عضو المكتب السياسي لحماس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124731/http://www.20at.com/article2.php?sid=144"

