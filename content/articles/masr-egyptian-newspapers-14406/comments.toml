text = "طب وهو اية علاقة شجر الكرسماس بالمسحيين دى عادة اوربية بيزينو بيها بيوتهم زى ماحنا بنزين شوارعنا فى رمضان . عمر حد فى فرنسا او امريكا او لندن جه فى اول الشهر الكريم و قال يالا نزين شارعنا !!!!!!! ولا حد بيوزع كحك فى العيد!!!!!!! معتقدش انه حرام بس برده لازم نعمل قيمة لاعيدنا مش نظيط فى الظيطة و السلام"
