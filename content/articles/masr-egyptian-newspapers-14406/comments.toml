text = "قال محمد الدسوقي : ثم أين هو الخطأ الدينى إذا ابتسم مسلم أو شارك إخوانه المسيحيين فى احتفالات أعياد الميلاد طالما أنه لم يرتكب إثما يغضب الله؟ أين هو الخطأ الدينى فى أن يشترى مسلم زينة مبهجة أو شجرة طويلة طالما أنه لن يشترى خمرا أو يمنح صديقته قبلة منتصف الليل؟ ألم يكن أولى يا شيخنا أن تتحدث عن حفلات رأس السنة التى تملأ العواصم العربية وترقص بها دينا ولوسى بدون ملابس تقريبا؟ أليس الأولى أن تخاطب هؤلاء وتحذرهم، بدلا من أولئك الذين يبحثون بزينة أعياد الميلاد وشجرة الكريسماس على فرحة مضافة إلى أيام تعبهم؟<br />هل هذا الدسوقي يضحك على نفسه ام على من لاأدري اتنكر ان المسلمين استدرجو في هذا العيد الملعون وشربو وزنو وفعلو مافعلو اتنكر فتن هذه الاعياد ايها الدسوقي اترضاها لبناتك واولادك ايها الدسوقي اماكان ينقصنا الا انت لتأتي وتنتقض هذا الدين ودفاعنا عن الاسلام والمسلمين واعراضنا بارك الله في شيخنا القرضاوي ولعن الله امثال هذا السوقي الذي ينبح بآرائه"
archived = "2009-12-28"
capture_url = "https://web.archive.org/web/20091228090944/http://www.20at.com:80/masr/egyptian-newspapers/14406-2009-12-15-09-22-49.html"
