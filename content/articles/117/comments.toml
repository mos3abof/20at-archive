subject = "بيرو"
text = "ساعات كتيرة لما يعجز اللسان عن الكلام والقلم عن الكتابة والعين علي الابصار ...لما بتغيب الحقايق وتطمس الصور... ساعتها بنكون محتاجين لمعجزة تفهمنا ايه اللي بيحصل... اهو الفيلم ده هوه المعجزة ...بس الغريبة ان معجزات الايام دي لازم تيجي من بره...وستظل معجزتنا الابدية ..زالصمت ..للابد وبلا حدوووووووووووووود"
archived = "2004-09-26"
