author = "المدير الهندى"
posted = "2009-09-21"
text = "فى شركة فى الخليج مديرها هندى كان فية اتنين مصريين بيشتغلوا فيها<br />واحد مصرى شتم التانى وقالة بالعامية ما معناة فرج امك<br />فذهب المصرى الى المدير الهندى يشتكية غاضبا قائلا انة شتمة شتيمة قبيحة جدا فسالة الهندى ماذا قال لك ؟<br />فقال لة الشتيمة اياها بالانجليزى<br />فكرر الهندى فرج امك فرج امك هذة ليست شتيمة هو يذكر حقيقة امك لها فرج وامة لها فرج وامى ايضا لها فرج وكل امراة لها فرج<br />وتسائل الهندى<br />هى الشتيمة عندكم هايفة كدة لية"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019193106/http://www.20at.com:80/masr/t7kyk/13458-2009-09-15-11-43-30.html"

