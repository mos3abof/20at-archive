text = "ههههههههههههههه ههههههههههههههه ههههههه<br />شوية متخلفين … يعني الواد بيكلمكم عن الكتب و الأسعار وان ماحدش عرف بالمعرض<br />وأنتوا بقدرة قادر قلبتوا الموضوع ناحية عمرو خالد<br />أنا كنت أتمني أن عشرينات تحذف التعليقات الى ملهاش دعوة بالموضوع خالص .. علشان دول ناس فاضية<br />هما الناس الهبلة الى زييهم كدة ما بيدخلوش المواقع الحكومية ليه زي الأهرام والأخبار … علي الأقل كان زمان الجريدتين دول قفلوا من وشكم<br />جتكم الـ***"
