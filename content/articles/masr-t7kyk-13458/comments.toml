posted = "2009-09-25"
text = "الاساتلذ فرج فرجانى صاحب الثوب الاحمر دايما سخن وحار وعصبى وبيشتم لاتفة الاسباب وبيتف فى وش اللى يقرب منة<br />وفرج عامل زى عصارة الطماطم بيعصر كويس قوى واة لو واحد افندى بطربوش احمر دخل عندة بيلخبط عيشتة ويطلعة مدلدل الراس مطاطى ومريل على نفسة<br />وقانا اللة شر فرج الذى تتطاير الشظايا من بين شفتية"
