subject = ""
author = "الرؤوس الجهاله"
posted = "2009-09-19"
text = "طالما الكلام عن عمر خالد فنحن نشهد ان عمر خالد راجل محترم اوي ومحب للدين ولكن للاسف لم يدرس العلم الشرعي فوقع ويقع في اخطاء وانتقده كثير من العلماء وعلى رأسهم يوسف القرضاوي وصدق رسول الله صلى الله عليه وسلم حينما قال<br />عن عبد الله بن عمر رضي الله عنهما قال سمعت رسول الله صلى الله عليه و سلم يقول(ان الله لا يقبض العلم انتزاعا ينتزعه من العباد<br />ولكن يقبض العلم بقبض العلماء حتى لا يبقى عالما اتخذ الناس رؤسا جهالا فاافتو بغير علم فضلو و اضلو) صدق رسول الله صلى الله عليه وسلم<br />فيا جماعة لما تيجو تسمعوا دروس دينية انتبوا ان الذي يعطي درس لابد ان يكون متعلم تعليم شرعي"
