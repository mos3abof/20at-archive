text = "يا عم فار اية<br />فية انابيب بها مادة لاصقة زى معجون الاسنان كدة بتحط منها شوية فوق كرتونة وتضع الكرتونة فى مسار الفار واول ما يمشى عليها بيلزق على طول ويصرخ<br />تروح تموتة<br />هى دى فكاكة<br />وعلى فكرة الانابيب دى صناعة ايطالية ومتوفرة فى السوق"
