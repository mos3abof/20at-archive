author = "فرج ام المعلق السابق"
posted = "2009-09-22"
text = "مش لازم يا اخي يبقى كلمة الفرج يعني العضو التناسلي<br />الفرج يعني الفرج من الضيق<br />يعني واحد عنده ازمة مالية وبعدين جاله الفرج واتحلت ازمته المالية<br />واحدة عانس وبعدين جالها الفرج وجالها عريس<br />وهكذا<br />وفرج امك يعني ان امك حيجلها الفرج من عند الله ان شاء الله<br />وربنا يفرجها علينا جميعا<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019193106/http://www.20at.com:80/masr/t7kyk/13458-2009-09-15-11-43-30.html"

