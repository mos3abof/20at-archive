[[comments]]
order = 7
subject = ""
author = "حكاية موسى"
posted = "2009-09-18"
text = "حكاية موسى وبنى اسرائيل او العبرانيون معظمها قصص وهمية من تاليف احبار اليهود<br />فموسى تربى كا امير مصرى فى قصر فرعون وتعلم ما يتعلمة الامراء المصريون فى المعابد ومن الكهنة<br />وحينما قتل المصرى وهرب ودخل ارض سيناء وتعلم العلمعلى يد معلم فى الصحراء<br />وعنما كلف بالرسالة وخرج باليهود من مصر لم يكن اليهود يتجاوزون بضع مئات<br />القران يقول عنهم انهم شرذمة قليلة<br />وحكاية تاصيل ان فلسطين هى ارث يهودى كلام فارغ وموسى نفسة ليس يهودى ولكنة مصرى كان من الموحدين من اتباع اخناتون<br />وما يحاول ان يقولة عمرو خالد كلام فارغ<br />ففلسطين كانت تابعة لمصر ايام موسى ولو دخل موسى فلسطين وظهر امام الوالى المصرى هناك لقبض علية وارسلة الى مصر<br />ولذلك ظل فى التية او الصحراء متخفى اربعين سنة<br />ولا يعرف لموسى مكان قبر حتى الان<br />ولا احد يعرف اين دفن موسى"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019193106/http://www.20at.com:80/masr/t7kyk/13458-2009-09-15-11-43-30.html"

[[comments]]
order = 8
subject = ""
author = "احذروا عمرو خالد"
posted = "2009-09-18"
text = "يا جماعة احذروا عمرو خالد<br />اثناء سماعي لقصة بني اسرائيل على قناة ابوظبي الفضائية<br />كان بيشدد على حب سيدنا موسى<br />وبيقول للناس اوعو تكونوا بتكرهوا سيدنا موسى<br />اثناء مشاهدتي للقصة<br />تذكرت زيارة السادات للقدس وفي كلمة مناحم بيجن في استقبال السادات<br />قال مناحم بيجن اثناء الخطبه وبالعربي<br />ادخلوا الارض المقدسة التي كتب الله لهم ولا ترتدوا<br />هذه الاية قالها مناحم بيجم في خطابه في الكنيست لما السادات راح اسرائيل<br />يا عمر خالد الكلام دا اتنسخ برحلة الاسراء والمعراج<br />ومفيش حاجه اسمها سيدنا موسى وسيدنا عيسى<br />النبي محمد نسخ كل الاديان وكل الشرائع<br />ولو سيدنا موسى رجع دلوقتي حيبقى واحد من امة محمد فقد<br />يا جماعة احذروا عمر خالد<br />عمرو خالد بيحطلكم السم في العسل<br />عمرو خالد على مدار 30 حلقة في تلفزيون ابوظبي بيأيد نظرية حق اسرائيل في فلسطين<br />وتقدروا تتابعوا القصه<br />النبي محمد اسري به الى القدس<br />والصحابة وعلى رأسهم ابو عبيدة ابن الجراح راحو فتحوا فلسطين وضموها لممتلكات العالم الاسلامي<br />وسيدنا عمر سافر القدس<br />خلاص القدس وفلسطين ما لهمش دعوة ببني اسرائيل<br />وعمرو خالد دا ضلالي والله اعلم بنواياه"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019193106/http://www.20at.com:80/masr/t7kyk/13458-2009-09-15-11-43-30.html"

[[comments]]
order = 9
subject = ""
author = "الجاهل عمر خالد"
posted = "2009-09-18"
text = "عمرو خالد اتحفنا هذا الشهر الفضيل بتلاتين حلقه عن قسة سيدنا موسى وبنو اسرائيل<br />المهم انه كان بيروح يحكي القصه في الاماكن اللي حصلت فيها<br />وراح حته اسمها جبل نبو المكان اللي عاش فيه بني اسرائيل قبل ما يدخلوا القدس وسيدنا موسى مات هناك<br />المهم ان الحمار بيشرح الفكره الاسرائيلية اللي خلت اليهود رجعوا تاني لفلسطين وبيأكد بهذه القصة حق بني اسرائيل اللي هما اليهود في فلسطين<br />ما يعرفش الحمار ان النبي محمد صلى الله عليه وسلم اسري به الى القدس وتم مصادرة فلسطين والقدس واصبحت دولة اسرائيلة والقدس اصبحت اسلامية والنبي محمد صلى بكل الانبياء هناك والصحابة راحوا فتحوا فلسطين<br />فاللي يعرف عمر خالد يقوله يا حمار عرضك للقسه بهذه الصورة تأييد لنظرية اسرائيل في احقيتها بفلسطين<br />خلاص يا عمر خالد سيدنا موسى وبني اسرائيل اتنسخوا خلاص وجه مكانهم النبي محمد صلى الله عليه وسلم وبني اسماعيل<br />وانا بتفرج على القصه اتهيأتي انه واخد فلوس من اليهود لعرض القصه بهذه الصورة<br />ـــــــــــــــ ـــــــــــــــ ــــــــــ<br />يا عمر خالد خليك في الحسابات احسنلك واحنا لا غيرانين منك ولا زعلانيك على انك اصبحت مشهور احنا زعلانين عليك"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019193106/http://www.20at.com:80/masr/t7kyk/13458-2009-09-15-11-43-30.html"

[[comments]]
order = 10
subject = ""
author = "الفار وعمرو خالد"
posted = "2009-09-18"
text = "اخر حلاوة<br />كدة من الاخر<br />كل واحد بيجرى على رزقة الفار بيجرى فى المطبخ ياكل رزقة ويحصل علية بالسرقة او الاغتصاب او هو يعتبرة حقة المشروع ولازم يعيش ومهما يكون<br />كذلك الاستاذ عمرو خالد<br />انة ليس عالم دين ولا متخصص ولكنة رجل حكواتى يجيد القاء القصص ويجذب انتباة الشباب بقصصة وحكاوية ولة جمهور مستمعين كبير من الشباب ويختار قصص من انبياء بنى اسرائيل او العبرانيين المرتبطين بفرعون مصر ليعمل اسقاطات سياسية فالرجل لا احد ينسى ان جدة كان احد رؤساء وزارة فى برمصر لما كانت معمورة<br />فدعوة يقوم بالمهمة لان الازهر الذى كان شريفا قد استنوق وتفرغ رجالة للبحث فى ارضاع الكبير وافطار لاعبى كرة القدم فى شهر رمضان ومقابلة الحاخامات فى المؤتمرات العالمية<br />دعوا الرجل يشتغل<br />لان الازهر مش فاضى وابعد رجالة الاقوياء واصبح يحتوى على غثاء المشايخ<br />دعوا الرجل يرتزق<br />فاخر اخبارة انة كسب من محطة تليفزيونية 2 مليون دولار العام الماضى<br />ارزاق<br />اما الفار الملعون فقد اكل ضفيرة اسلاك كهرباء الغسالة من الخلف<br />وانا حاليا فى ورطة<br />لعن اللة هذا الفار<br />واليوم صلاة الجمعة اليتيمة وسادعو علية"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019193106/http://www.20at.com:80/masr/t7kyk/13458-2009-09-15-11-43-30.html"

