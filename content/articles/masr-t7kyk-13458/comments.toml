posted = "2009-09-26"
text = "فية كتاب اسمة بنوك وباشوات كتبة واحد مفكر مصرى اسمة عبد العظيم انيس<br />الكتاب بيحكى كيف تم بيع مصر فى النصف الاول من القرن العشرين وسيطر الخواجات واليهود على الاقتصاد وعلى تجارة القطن ىوتملك الارض الزراعية<br />اعمل لنا ملخص عن الكتا يا استاذ محمد جمال<br />وخلينا نشوف ازاى باعوا مصر بعد الاحتلال الانجليزى ونفس اللى بيحصل الان<br />السناريو مكرر<br />بيع مصر<br />اقراو كتاب بنوك وباشوات للراحل العظيم عبد العظيم انيس<br />_______________ _______________ ________<br />الحاج هريدى الصعيدى - فرشوط"
