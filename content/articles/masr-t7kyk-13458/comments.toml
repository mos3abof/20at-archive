posted = "2009-09-16"
text = "الى نصيحة زميلى المعلق السابق<br />ابن عمتى مجند فى الامن المركزى ويتمتع بغباء كاسح واستعنت بة فحضر وتناول قدرة فول فى احد السحور ووقف ساعتين مسلحا بخيرزانة الامن المركزى وبعض المقشات ولكن الفار الملعون يشعر باى انسان غريب فى المطبخ ولا يتحرك ابدا<br />ونصحنى احد خبراء الامن بشراء جهاز الكترونى تمنة 200 جنية يصدر اصواتا وذبذبات تخرق اذن الفار وتجعلة يهرب من المكان<br />وبحثت عنة فى العتبة وشارع الازهر ولم اجدة<br />وساوصى باحضارة مع احد الاقارب لاحضارة من دبى<br />شكرا على نصيحتك"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019193106/http://www.20at.com:80/masr/t7kyk/13458-2009-09-15-11-43-30.html"

[[comments]]
order = 5
subject = ""
author = "نصيحة لعمر خالد"
posted = "2009-09-17"
text = "عمر خالد كان عامل للتلفزيون قصة سيدنا موسى على مدار تلاتين حلقه واتفرجت عليها في ابوظبي<br />يا عمر خالد انت راجل محاسب وما حدش ينفع يشتغل محاسب الا خريج كلية التجارة<br />الدعوه يا عمر خالد ليها كليات وفيه منهج لازم الواحد يدرسه الاول<br />على سبيل المثال اصول الدين والفقه<br />يا عمر خالد انت ليه اخطاء لانك مش دارس يا عمر خالد<br />وقفت مكان الدعاه الكبار وانت مش دارس علشان كده بتقع في اخطاء قاتله<br />والعلماء نصحوك اتهمتهم بانهم غيرانين منك يا عمر خالد وانهم لا يعملون لله<br />يا عمر خالد غلط كده يا حبيبي<br />لازم بعد ما تسجل الحلقة يتفرج عليها واحد عالم دين فقيه ويقر بنشرها<br />الا هل بلغت اللهم فاشهد"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019193106/http://www.20at.com:80/masr/t7kyk/13458-2009-09-15-11-43-30.html"

