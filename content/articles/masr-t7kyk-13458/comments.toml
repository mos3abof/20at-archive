text = "شوف يا سيدي لازم نتبع الاجراءات الامنية في القاء القبض على ذلك الفار<br />اول شيء هو تحديد مكان اختباء الفار لانه بعد تحديد مكانه سيتم حصاره وعمل كمين له بمجرد خروجه من ذلك المكان<br />ولتحديد مكان الفار لابد من الاستعانة برجال مباحث الصراصير المنزلية<br />وفي حالة معرفة مكانه يتم الاستعانة بمقشه بواب العماره لان هذه المقشه هي التي ستقضي عليه قضاء مبرما وستمنع د[ *** ] اي فار اخر الى هذا المكان<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــ<br />خبير امن سابق بوزارة الداخلية"
