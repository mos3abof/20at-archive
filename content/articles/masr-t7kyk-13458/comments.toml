[[comments]]
order = 12
subject = ""
author = "البكاء على المسكوب"
posted = "2009-09-19"
text = "فى هذة الايام تجد 50 قناة فضائية وعشرات الدعاة من اصحاب البدل والحلل الباريسية والكرافتة الشيك واحيانا البابيونة الانيقة وكانهم قسس الكنيسة الانجيلية ضاربين بالزى الازهرى عرض الحائط وكاننا شعب بلا هوية دينية او ثقافة حضارية<br />وكلهم يتكلمون فى الدين وكان الدين اصبح شغلة كل من يريد ان يشتهر فمنهم من يتكلم عن حق ومنهم من يجارى الوضع<br />واحد الكلاب اسمة القمنى او سيد القمنى يتقيا قاذورات تنشرها لة مواقع خنازير المهجر فتعطية وزارة فاروق حسنى جائزة الدولة<br />كلهم يتكلمون فى الدين<br />ولا احد يتكلم عن مستقبل مصر<br />ولا عن وضع البلد الماسوى الذى يشبة سفينة تسير بلا توجية او قيادة تشيلها موجة فساد وتحطها موجة فساد<br />وربما تغرق اذا ارتطمت باحد الصخور<br />الحاج هريدى الصعيدى - فرشوط"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019193106/http://www.20at.com:80/masr/t7kyk/13458-2009-09-15-11-43-30.html"

