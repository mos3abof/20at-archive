subject = ""
author = "alsalafway"
posted = "1999-11-30"
text = "الغريب ان الفتوى الاخيرة للشيخ على جمعه صحيحة تماما باجماع اهل العلم المعتبرين من سلف الامة الصالح والعلماء المتأخرين فالمعلوم ان التماثيل ليس عليها خلاف فى انها اصنام لا يجوز وجودها فى ارض مسلمة وليس ادل على ذلك من فعل رسول الله صلى الله عليه وسلم حينما فتح مكة وهدم كل الاصنام الموجودة بالكعبة وكذا فعل سيدنا ابراهيم .. الغريب ان كاتبة الموضوع تتطرق الى ردود افعال من تسميهم مثقفين مصريين وطبعا رميتها فى الاخر ومعلقتش عليها كعادة كل الصحفيين الكارهين للاسلام تشعر وكان لا دين لهم استغفر الله وقبحها الله من ثقافة تعارض دين الله… ولا حول ولا قوة الا بالله"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422180420/http://www.20at.com:80/salamo-3lakom/2988.html"

