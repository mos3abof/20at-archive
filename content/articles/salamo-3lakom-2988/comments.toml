text = "هذه الفتاوى لم تكن اكثر من فتاوى مثيره للجدل ولشغل عقول المواطنين بها والهاءهم عن بقية الاحداث الجاريه سواء فى مصر او فى اى بلد عربى آخر وليت المواطنين يفهمون ذلك. والمقال جميل يا هبه واستمرى فى الكتابه"
