[[comments]]
order = 4
subject = ""
author = "مصري بيحب بلدة"
posted = "2007-01-25"
text = "ياعم سلفاوي جبتلنا الضغط والمرض ربنا يخدكم هو انتم مابقتوش فاضيين غير لكدة ال محيرني انتوا بتشتغلوا ايه يخرب بيوتكم قاعدين ذي المقاطيع ربنا اصابكوا بالتخمة من الاكل وكل واحد علية طيز بالجلبية ذي الخياطين بتوع زمان ال كانوا بيقعدو علي الارض انتي بتشتغل ايه افدت مجتمعك باية ياعمي الاسلام عايز العالم والمخترع الناس بيوصلوا للكواكب والنجوم واحنا لسة بنتكلم في الاصنام والكفار دا شيئ خلاص معروف والاسلام من علينا بنعمة الايمان بالله الواحد ومش محتاجة فهم لما يكون فية امثال في بيت مسلم مش ممكن حيعبدة من دون الله استغفرة واتوب الية ارحمونا وارحموا الاسلام لان مشكلة الاسلام انتي ومن علي شاكلتك شوهتوة ولوثتوة حسبنا اللله ونعم الوكيل فيكم ياتجار الدين"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422180420/http://www.20at.com:80/salamo-3lakom/2988.html"

[[comments]]
order = 5
subject = ""
author = "امام عادل"
posted = "2007-10-24"
text = "الى الترابى وامثاله من الائمه المضلين كيف تجيز ما حرم الله من زواج المسلمه عاليه القدر من الكافر يا ابله يا بائع لدينك انه زمن الغربه غربه الدين وكيف تؤم المرأه الرجل وتتقدمه فى الصف انه دين جديد حسبنا الله ونعم الوكيل والاخر الذى يجيز للنساء ان يسبحن فى اللبن كما انا اتعجب كيف حصلوا هؤلاء على شهادات او وصلوا الى اعلى المناصب والدرجات واختم بالهالك الذى يجيز للمسلمه ان تخلع حجابها فى بلاد الكفر الا يعتقدون هؤلاء انهم سيسألون يوما ما امام ربهم انا لله وانا اليه راجعون…"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422180420/http://www.20at.com:80/salamo-3lakom/2988.html"

[[comments]]
order = 6
subject = ""
author = "توام سلفاوى"
posted = "2007-10-24"
text = "جاء الاسلام ليهدم ليس الاصنام فحسب ولكن ليهدم القوميات ونعرات الجاهليه فكلنا مسلمون ليس فينا مصريا ولا تركيا ولا عراقيا فيامن تحب مصر نحن نحب ديننا دين الاسلام ونحفظ معانيه وقيمه من تحريف امثالكم فالان نحن فى عصر عبد فيه بعض الناس الشيطان واخرون من غلاه الصوفيه المحترقون عبدوا الاولياء من دون الله وتأتى انت لتصحح مفاهيم الدين فليكسر الله قلمك وليخرس الله لسانك كما اعمى الله قلبك فلم ترى او تسمع شيئا عن الحق الذى سيظل باقيا خفاقا رغم انف المعاندين ورغم انف الجهله المحاربين والحمد لله على نعمه الاسلام السلفى"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422180420/http://www.20at.com:80/salamo-3lakom/2988.html"

[[comments]]
order = 7
subject = ""
author = "مصحح"
posted = "2007-10-24"
text = "تصحيحا لبعض الجهله من العلمانين والاذناب الذين لا يعرفون شيئا عن دينهم وربما لا يعرفون كيف يطهرون انفسهم من الغائط اقول نصرك الله يا سلفاوى فقد اصبت عين الحق فى ان رسول الله حرم تشييد التماثيل وامر بكسرها حتى ولو لم تكن تعبد حتى يحمى الامه من الشرك واذا اردتم الاسلام فهذا هو الاسلام واذا اردتم الهوى فأبواب الهوى نوافذها مفتوحه والله تعالى ناصرا لدينه"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422180420/http://www.20at.com:80/salamo-3lakom/2988.html"
