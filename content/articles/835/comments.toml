[[comments]]
order = 0
subject = "عنوان غير مناسب"
author = "بالفعل الموضوع جميل يا عماد و ربنا يوفقك"
posted = "2006-01-07"
text = "لكن المشكلة فعلا هوه عدم حسن اختيار العنوان المناسب لقيمة و جلال و مكانة ما تكتب عنه<br />أرجو من الاخوة فيادارة عشرينات يرحمونا من عندهم مع القراء و يغيروا العنوان لعنوان مناسب ..وبلاش يبرروا كالعادة و يقولوا لنا ده ذكاء من المحرر و حريةابداع و رأي و الكلام ده ..ولكم منا كل الاحترام و التقدير<br />وكل سنة وانتم طيبين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123807/http://www.20at.com/article2.php?sid=216"

