[[comments]]
order = 4
subject = "لا يجوز"
author = "السيد ثابت"
posted = "2006-01-07"
text = "الكعبه المشرفه زادها الله تعظيما هى بيت الله الحراااام ولا يجوز ان يقال عن الكسوه فستان والله اعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123807/http://www.20at.com/article2.php?sid=216"

[[comments]]
order = 5
subject = "انتو غلطانين"
author = "انتو غلطانين"
posted = "2006-01-08"
text = "عيب ليه مدام عشرينات شايف ان مفيبهاش حاجه يبقى كلنا جهله وهما العلماء والحق ليمكن يكون معانا اكيد طبعا معاهم .<br />احنا دايما اللي غلطانين وهما دايما اللي على صواب.<br />وطول ما القرد بيلاقي امه تحامي عنه هيفضل يتشاقى<br />انصحهم انهم يكونوا رابطه الرد على القراء ووضعهم في موضع المخطئين دائما<br />ربنا يهيدهم ويبعد عنهم الشياطين لانها اتمكنت منهم تماما"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123807/http://www.20at.com/article2.php?sid=216"

[[comments]]
order = 6
subject = "حاجة تقرف"
author = "عشرينات بقى موضع كريه فعلا ..وبقى يمشي عكس الجميع .."
posted = "2006-01-08"
text = "ده مش تميز ولا تفوق منكم يا عشرينات ..ده قرف..وجهل<br />إما انتو مصرين على اسم و عنوان غبي للموضوع أو انكم مهملين لدرجة ان مفيش حد بيتابع الردود على المواضيع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123807/http://www.20at.com/article2.php?sid=216"

[[comments]]
order = 7
subject = "بهدوء"
author = "يا جماعه عايزين النقد يكون باسلوب احسن من كده"
posted = "2006-01-08"
text = "انا لا اوافق على هذا الاسم و حتى لو ماكنش فيه خطأ شرعى ...و أطلب من عشرينات تغيره احترامالمشاعر القراء و رغباتهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123807/http://www.20at.com/article2.php?sid=216"

[[comments]]
order = 8
subject = "ده اسم لا يليق"
author = "مسلمة"
posted = "2006-01-16"
text = "لا يليق بنا كمسلمين استخدام لقب فستان مع بيت الله الحرام وكمان لغة المقال لابد وان تكون اكثر احترامامن ذلك خاصة ونحن نتحدث عن الكعبة الشريفة<br />واتقوا يوما ترجعون فيه الى الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123807/http://www.20at.com/article2.php?sid=216"

