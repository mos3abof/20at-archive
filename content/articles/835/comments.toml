[[comments]]
order = 10
subject = "اتقوا الله"
author = "سماح محمد"
posted = "2006-07-23"
text = "اتقوا الله فيما تكتبون عن أعظم البيوت وأشرفها على الأرض ، ستسألون عن بيت الله الذي تريدون التقليل من شأنه ، لا رفع الله لكم منزلة في الدنيا لو كان هذا مقصدكم ، نحارب دول العالم الغربيه كلها بسبب استهزائهم بديننا ونأتي نحن لنقول فستان الكعبه ، اتقوا الله يا من تقومون على هذا الموقع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123807/http://www.20at.com/article2.php?sid=216"
