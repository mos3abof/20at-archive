author = "أُختكم في الله"
posted = "2010-02-28"
text = "السلام عليكم و رحمة الله و بركاته<br />عجبني تعليق \" jumanji ju \" وش ولا حواجب<br />قال رسول الله صلى الله عليه و سلم .. لعن الله النامصــة و المتنمصــة .. و الأصــل في المـرأة الزينـــة فإذا جاء اللعن من الله للمرأة النامصة و هي الفاعــل أي التي ترقق الحواجب و المتنمصــة هي المفعول بهــا .. و اللعن في اللغة هو البعــد و الطرد و في الشرع اللعن هو الطــرد من رحمــة الله .. فرغم أن المــرأة جُبلت على الزينـة و التزيـن إلا أن الله لعن النامصة و المتنمصة على لسان رسوله صلى الله عليه و سلم ..فما بالكوا بالرجل النامص و المتنمص !!! فالنهــي للرجل يكون أشـــد من المــرأة<br />الله المستعـــان . . .<br />و على رأي أختي \" مصرية و بس \" معدش في رجاله في البلد"
archived = "2010-02-28"
capture_url = "https://web.archive.org/web/20100228164638/http://www.20at.com:80/banat/variety/15491-2010-02-25-15-19-46.html"
