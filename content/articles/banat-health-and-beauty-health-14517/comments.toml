text = "اقتباس سها:<br />يجب علي الامهات توعيت بناتهم من اضرار العاده السريه<br />اولا دى حاجة ممتعة جدا للولد وللبنت وفى بنات بتعمل اكتر من كدة فى التليفون مع الولد ممكن يستثيروا بعض ويعملوا كل حاجة لدرجة يوصلوا فيها قمة النشوةوناس بتمارسها يوميا تقريبا<br />مش لاقى حل فى لحظة بنضعف ونعملها<br />اتمنى ان يتوب الله على الجميع وشكرا"
