text = "كان النبي عليه الصلاة والسلام إذا اغتسل غسل الجنابة :<br />- يبدأ بغسل الفرج موضع الجنابة<br />- ثم يتوضأ وضوءه للصلاة ويترك قدميه<br />- ثم يفيض الماء على رأسه ثلاث مرات<br />- ثم يغسل سائر البدن . يبدأ بالشق الأيمن ثم بالشق الأيسر - ثم ينتقل قليلاً من موضعه الذي هو فيه ويغسل قدميه .<br />هكذا كان النبي صلى الله عليه وعلى آله وسلم يغتسل من الجنابة وهذه سنته وطريقته كما روته عائشة وأم سلمة أزواجه رضي الله تعالى عنهن ."
archived = "2009-12-24"
