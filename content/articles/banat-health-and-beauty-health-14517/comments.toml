text = "اقتباس بنت حقيرة:<br />بجد انا بحس انى حقيرة اوى و كل ما استغفر ربنا ببئا مش ادرا و عايزة اعمل كدة عشان بستريح و بكون عايزة اهرش بلائى نفسى عملت كدة او و انا نايمة مش حسة بلائنى عملت كدة بجر انا بتكسف من كل الولاد و الرجالة و بحس ان اي حد عايز يختصبني و كمان خايفة اكون مش عزراء مامتي مش ارايبة مني و انا بصلي و بصوم الحمد لله بس بعمل كدة من 3 سنين و مش عارفة ابطل و خايفة من عقاب ربنا و فكرت كتير انى اروح لدكتور من ورا مامتي بس اكيد مش حعرف اروح لطبيب نفسى ولا نساء لو سمحتم ممكن تساعدوني علي الشفاء يا رب اشفي كل اللي زيي يا رب<br />حبيبتى لو انتى فاكرة ان في يوم من الايام وانتى بتعملى كده نزل دم يبقى انتى مش عزراء<br />وحاولى اول ماتحسى انك عايزة تعملى كده قومى اتوضى"
archived = "2009-12-25"
capture_url = "https://web.archive.org/web/20091225135637/http://www.20at.com:80/banat/health-and-beauty/health/14517-2009-12-22-14-35-16.html"

