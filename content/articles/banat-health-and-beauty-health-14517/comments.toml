text = "ياااه بجد .. انا كنت عارفه ان دى مشكله منتشره بس ماكنتش متوقعه انها بالانتشار دا ..<br />انا للاسف واحده من اللى بتعمل كدا بس بيبقى غصبعنى .. تقريبا زى ما مكتوب فى العنوان \"ادماان \"<br />بعملها و من و انا صغيره و ماكنتش اعرف يعنى ايه اللى بعمله دا .. و ما كبرت و عرفت حاولت كتييييييييييييي ر ابطلها .. و كنت بخوف نفسى انى مش هعرف اخلف بعد كدا بس بردو كنت برجع تانى ..<br />و كان بيجيلى وقت كبير ابطل و بعدين اضعف و اقول لنفسى مرة مش هيحصل حاجه دا انا بقالى كتير و المرة بتجر مرااات ..<br />انا فعلا بجد تعبت و لما قريت كلامكو دا شاجعنى اووى .. بس خوفت اكتر و خايفه اكون هبطل متاخر و انا يكون عندى مرض منها .. انا خايفه اووى و فى نفس الوقت خايفه اروح لدكتورة و اتصدم ان فيا حاجه وماعرفش اكمل حياتى ..<br />يارب بجد نفسى ماعملهاش تانى"
