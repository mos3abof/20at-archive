text = "اقتباس حنونه:<br />اقتباس بنت حقيرة:<br />بجد انا بحس انى حقيرة اوى و كل ما استغفر ربنا ببئا مش ادرا و عايزة اعمل كدة عشان بستريح و بكون عايزة اهرش بلائى نفسى عملت كدة او و انا نايمة مش حسة بلائنى عملت كدة بجر انا بتكسف من كل الولاد و الرجالة و بحس ان اي حد عايز يختصبني و كمان خايفة اكون مش عزراء مامتي مش ارايبة مني و انا بصلي و بصوم الحمد لله بس بعمل كدة من 3 سنين و مش عارفة ابطل و خايفة من عقاب ربنا و فكرت كتير انى اروح لدكتور من ورا مامتي بس اكيد مش حعرف اروح لطبيب نفسى ولا نساء لو سمحتم ممكن تساعدوني علي الشفاء يا رب اشفي كل اللي زيي يا رب<br />حبيبتى لو انتى فاكرة ان في يوم من الايام وانتى بتعملى كده نزل دم يبقى انتى مش عزراء<br />وحاولى اول ماتحسى انك عايزة تعملى كده قومى اتوضى<br />لا لا عفوا مش فقدتى عذريتك ولا حاجة ماتخفيش هو طبعا دى حاجة محتملة بس فى احتمال تانى انك تكونى عورتى نفسك ودة الاحتمال الاكبر لان الوصول اللى غشاء البكارة مش سهل اوى كمان بيكون فى الم ناتج عن ذلك لكن فى كل الاحوال لو نزل دم يبقى لازم تستشيرى الطبيب"
