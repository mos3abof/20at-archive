text = "انا الحمد لله عمرى مامارست العادة دى وماكنتش اعرف هيا ايه لحد وقت قريب وعرفتها بصدف من الشات اللى كنت بعملو وعمرى ماكانت فى نيتى انى اعرف حاجة زى دى … بس الحمد لله حتى بعد ماعرفتها عمرى مافكرت انى اعملها … انا كنت مرتبطة بى واحد بس ماكناش مخطوبين كنا بنحب بعض وكان دائما يقعد يكلمنى فى حاجات من النوع دا كانت بتنزل منى افرازات كتير قوى وكنت بقرف من نفسى قوى بس كنت على طول اقوم واغتسل وارجع اصلى انا صلاتى مش منتظمة قوى بس ماكنتش بكسل اقوم اغتسل عشان ارجع اصلى وماسبتش الحكايه دى تقصر عليا ابد وبرغم من كدا مافكرتش ابدا انى امارس الحاجة دى وبتمنى ان ربنا يبعدنى عنها ويشفى كل البنات اللى وقعت ويغفرلى ويغفر لكم يارب وانا من ساعه مابعدت عن الشخص دا مابتنزلش منى اى افرازات والحمد لله مابحتاجش اغتسل الا للبيروت … ربنا يفى كل الناس اللى وقعت فى العادة دى بجد ربنا معاكو وبجد بدعيلكو … انا قريت الموضوع من بدرى بس كنت مكسوفه اعلق عليه"
