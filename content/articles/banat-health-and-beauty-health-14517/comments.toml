text = "الى الأخت louka :هل أى افراز شهوة نغتسل له؟؟ الاجابة:<br />الإفرازات المتعلقة بالشهوة نوعان:1-المذى: و هو ما ينزل عند الإحساس بإثارة و هذا يوجب ثلاثة أشياء:-الوضوء لأن خروجه ناقض للوضوء،-تطهير الثياب منه لأنه نجس و التطهير يكون برش الماء فقط و ليس الغسل الكامل،-غسل الفرج منه…النوع الثانى2-منى المرأة:وهو الذى ينزل عند الوصول الى النشوة سواء بممارسة العادة السرية أو بالإحتلام أو طبعا بالجماع الطبيعى..ونزوله يوجب الإغتسال..أما الإحتلام(وهو ما يحدث أثناء النوم) يوجب الإغتسال إذا رأيت المنى في ثيابك فقد سئل الرسول- صلى الله عليه و سلم -هل على المرأة غسل إذا إحتلمت؟ قال نعم إذا رأت الماء(و هو المنى)"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123081016/http://www.20at.com:80/banat/health-and-beauty/health/14517-2009-12-22-14-35-16.html"

