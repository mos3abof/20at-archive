text = "حتى الدكاترة مختلفين فى موضوع العادة فى بيقول انها بتنشط الجسم والعقل وفى بيقول عكس ده انا كنت فى ثانوى وكان فى استاذ عندنا واتكلم عن العادة وقال ان العادة قبل الزواج بتخلى الانسان بعد الزواج عنده برود وفى ناس بتقول بتعمل سرعة قزف انا رايى ان العادة مثل السجاير ادمان ومش ادمان تقدر تبطله ومتقدرش تستغنا عنه بس الا اعرفه ان العادة والسجاير مجتمعين فى حاجة وهى انهم بيضروا الفتيات اكتر"
