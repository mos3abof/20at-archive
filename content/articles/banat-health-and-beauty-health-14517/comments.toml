text = "يا بنويت لو حد عايز يعرف اى حاجة خاصة بالموضوع ده او اى موضوع متعلق بيكم ممكن اساعده من خلال خبرتى البسيطة وقراتى فى الموضوعات دى وياريت تكلمنى على الايميل goosebumps_niso @yahoo.com<br />وخصوصا البنات الصغنتتين اللى معندهمش خبرة او ثقافة شوية لانى بلوم الاهل فى الموضوع ده لانى اما كنت صغيرة برضة مكنتش اعى لحجات كتير اوى ممكن لو كنت عملتها فى ساعتها كانت تضرنى فعلا بس الحمد لله<br />عمتا انا مش كبيرة اوى انا 19 سنة بس ممكن افيد اى بنوتة صغيره ممكن اكون كاخت ليها كبيرة واعرفها بعض الحجات المهمة لو اى حد عايز يكلمنى يفضل على الايميل"
