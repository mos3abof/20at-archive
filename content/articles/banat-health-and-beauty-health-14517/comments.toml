text = "اقتباس حنونه:<br />انا عايزة اسال حاجه<br />هو فيه عاده سريه بين ولد وبنت<br />وعايزة اسال كمان<br />هو البوس والاحضان بين الولد والبنت من غير تعرى زنا؟؟<br />ياريت حد يجاوبنى بسرعه بليز<br />العين تزنى وزناها النظر والفرج يكذب ذلك او يصدقه<br />يعنى مع الوقت هيتحول المووضوع لزنى واقعى لان الولد مش هيكتفى بمجرد القبلات<br />وحتى مجرد القبلات حرااااااااااااا ام<br />حتى ان فى شيوخ حرمو السلام باليد فما بال القبلات والاحضان"
