posted = "2009-12-25"
text = "اقتباس sunder:<br />السلام عليكم يابنات انا كمان عندي نفس المشكلة بس والله انا ما كنتش اعرف ان هي دي العاده بس انا كل اللي بعملة اني بستثير البظر فقط وبحس براحة كبيرة وكنت دايما بعمل كده بعد تالت يوم من الدوره الشهرية لان عندي بعد اليوم التالت بينزل دم في رابع يوم بس في اخره وانا ببقى عايزه استحمى عشان اصلي فلما بستثير البظر كان ينزل الدم الباقي بس عمري ما قربت من غشاء البكاره مع العلم اني عارفة كل شيء عنه وعن انواعة بس اكيد مش معنى امه مزل دم اني فقدت عزريتي لاني بعمل كده اصلا عشان انزل الدم اللي ياقي من الدوره وانا بقالي حوالي 8 شهور بعمل كده بس من ساعة ماعرفت اخطار المشكلة دي منكم بطلت والحمد لله بس ارجوكم حد يطمني ان انا كده ماشية صح شكرا لكم ربنا يجازيكم خير<br />ياريت مش تعملى كده تانى لان انتى هتاخدى على الاستثارة بايدك فى الموضوع ده واما تتجوزى مش هتحسى بالاثارة غير لو لمستى المكان ده لذلك ياريت ماتعمليش الموضوع ده وربنا يهدينا جميعا"
archived = "2009-12-25"
capture_url = "https://web.archive.org/web/20091225135637/http://www.20at.com:80/banat/health-and-beauty/health/14517-2009-12-22-14-35-16.html"

