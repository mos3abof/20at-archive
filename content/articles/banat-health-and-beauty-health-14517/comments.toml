text = "اقتباس لعقم:<br />سوري يا جماعة علي هقولة بس بجد انا هتاكيد بس انا اول مرة مرة دخلت صباعي جبت دم روحت لدكتورة قلتلي مفيش اي مشاكل بس مش تعملي كدة تانى و بعدها بشهرين دخلت حاجة طولها 15 cm<br />انا اسفة بجد بس عيزة حد يأكدلي مش كدة الدكتورة تكون كشفت غلط انا عندى 20 سنة و اول مرة اعملها كانت من 3 شهور و عملتها يجي 12 مرة سوري كمان مرة<br />بصي .. غشاء البكارة بيبعد عن فتحة المهبل من 2 الى 2.5 سم .. انا مش باقولك كدة عشان أخوفك .. انتي ممكن تكوني جرحتي نفسك عشان كدة جابت دم وان شاء الله ماتكونيش سببتي ضرر .. وماتخوفيش نفسك الدكتورة فعلا كلامها صح مادام كشفت عليكي .. دة غير ان في أنواع من الغشاء مابتتقطعش ولا حتى بالمعاشرة الزوجية ويلزم لها عملية جراحية بسيطة .. الانواع دي محدش يقدر يحددها غير دكتورة نسا و كمان ليها كشف معين عشان ماتازيش البنت ..<br />نصيحتي ليكي اوعي تجربي تدخلي حاجة تاني .. وحاولي تمسكي نفسك و خوديها بالتدريج و ان شاء الله ربنا يعينك<br />وافتكري دايما ان مش كل مرة تسلم الجرة ..<br />وربنا معاكي ومع الجميع"
