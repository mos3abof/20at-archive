author = "طماطم العسولة"
posted = "2009-12-24"
text = "السلام عليكم يابنات<br />احب ان اوضح اليكم بعض النقاط الهامة<br />العادة السرية هي الوصول إلى الرعشة الجنسية بدون الوصال الزوجي وذلك عن طريق اليد وتسمى الإستمناء أو نكاح اليد لدى الشباب واثارة البظر لدى الفتيات.<br />العادة السرية ليست مضرة بحد ذاتها ولكن هناك أفراد يمارسون العادة السرية بكثرة لدرجة ترهق الجهاز العصبي والتناسلي.<br />لا تصل العادة السرية بالشخص الذي يمارسها إلي إشباع جنسي حقيقي حيث تبقى لذتها في حدود التصورات والتخيلات .<br />كما أنها تخلق في ذات الشخص ميلا إلى الانطواء<br />العادة السرية تعود الألياف العصبية على الهياج اليدوي مما يصعب ارواءها بالهياج العادي خلال عملية الجماع بين الرجل والمرأة في حالة الإفراط .<br />سبب العادة السرية الغضب والحزن فهو بعد انتهاء من الممارسة ينتابه شعور بالذنب وأنه من الممكن أن تسبب له الأمراض .<br />وهذا الشعور يؤدي بصاحبه إلى الإحساس بالخوف من المجهول وكثرة الأسئلة التي تراوده في نفسه .<br />ممارسة العادة السرية عند الفتاة أشد خطورة وذلك لأن الفتاة قد تلجأ لاستعمال أدوات أو أشياء لحك الأعضاء التناسلية في طلب النشوة مما قد يصل لمحاولة إدخال إصبعها بالمهبل مما يهدد عذريتها"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224100644/http://www.20at.com:80/banat/health-and-beauty/health/14517-2009-12-22-14-35-16.html"

