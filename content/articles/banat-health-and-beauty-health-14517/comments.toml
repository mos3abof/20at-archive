subject = ""
author = "حالمة بالامل"
posted = "2009-12-24"
text = "ملحوظة نسيت اقولها<br />انا زعلت قوي من البنات اللي قالوا انا بحتقر كده او هو فيه بنات بتعمل كده فعلا<br />كون انك متعرضتيش للمشكلة دي يبقى متهونيش من قدرها<br />انا سمعت راي قبل كده و الله اعلم<br />انك لو بعدت لفترة طويلة متصلة عن العادة دي هتنسيها فعلا و متاثرش عليكي بعد الزواج<br />مش معنى كده اني بقلل من خطورتها بالعكس الالتهابات اللي العادة بتسببها في الحوض ممكن تسبب التصاقات في الحوض و دي بتعمل بعد كده مشاكل في الحياة الزوجية او القدرة على الانجاب<br />بس زي ما قلت كل الحاجات دي ممكن ترجع طبيعي لو البنت بطلتها<br />* نصيحة للمتزوجين و بيعانوا من مشاكل توجهي لطبيب متخصص ده مش عيب و لاغلط انك تعرفي ايه المشكلة"
archived = "2009-12-25"
capture_url = "https://web.archive.org/web/20091225135637/http://www.20at.com:80/banat/health-and-beauty/health/14517-2009-12-22-14-35-16.html"

[[comments]]
order = 41
subject = ""
author = "حالمة بالامل"
posted = "2009-12-24"
text = "انا معجبة جدا بالبنت اللي كتبت الموضوع ده لانه بجد موضوع جرئ و جامد<br />بس انا ليا شوية ملحوظات:<br />1- لازم اي بنت بتمارسها تعترف انها مرض و لازمن تتخلص منه حاجة مش طبيعية<br />2-مش غريب ان الابنات تتعرض ليها احنا معظمنا اتم العشرين او اكتر من غير جواز بالاضافة لان كل حاجة حوالينا بتعبر عن الجنس و غصب عنك هتشوفيها<br />3-أنا رايي ان البنت الاول تفكر ان مفيش حاجة اسمها متقدرش<br />لازم تفكري بايجابية انا اقدر اتخلص منها<br />اول ما يجيلك التفكير فيالعادة قومي من السرير و خدي دش بارد شوية عن جسمك<br />منتصف شهر الدورة شئ طبيعي ان البنت تحس بزيادة الرغبة تجنبي فعلا اي شئ يثيرك في الفترة دي<br />ممارسة الرياضة بتفرز مواد طبيعية من الجسم ليها تاثير المورفين يعني تخليكي تحسي بانك سعيدة من غير الحاجة للعادة<br />4- احب اقول لاي بنت عايزة تتخلص منها اول حاجة لازم تثقي في نفسك احنا في زمن صعب كل اللي فيه بيزود الاثارة عندج البنت و الولد<br />اللي عندك مش عيب فيك<br />ابداي بكده و الاحاجات اللي قالوا عليها اخواتنا البنات قبل كده الرياضة و الصلاة و الاستغفار<br />أنا عايزة اسمع كلام ان بنات قدروا فعلا يبطلوها و نجحوا في كده"
archived = "2009-12-25"
capture_url = "https://web.archive.org/web/20091225135637/http://www.20at.com:80/banat/health-and-beauty/health/14517-2009-12-22-14-35-16.html"

