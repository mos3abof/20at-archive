author = "طماطم العسولة!!"
posted = "2010-01-08"
text = "اقتباس جيمس:<br />انا بقول وجهة نظر بالنسبة لاى راجل ولو انا غلطان قولولى انى غلطان انا بقول ان اى راجل فى العالم لو بيعاشر بنت لاول مرة هيعرف ازاى انها مش بنت بنوت طبعا مش هيلاقى غشاء البكارة فطبعا هو مش دكتور طب شرعى علشان يعرف ان البنت ماكانتش فى حالة معاشرة مع رجل وانه من حاجة تانية وبقول للدكتورة ممكن توجهى احسن من كدة لو انتى دكتورة وبتكلمى صح مش تقولى الزوج مش هيعرف ان غشاء البكارة مش موجود يابنات انا رجل وبقولكم الرجل اول حاجة بيدور عليها هى الدم ومالقاش الدم بتبقا فيه مشكلة ولو كان عنده صبر بياخدها ويروح لدكتورة تكشف عليها لانه بيقول ممكن الدم يكون هربان منها علشان مثلا خايفةوالدكتورة هى بقا وحسب مايحس ضميرها ياتفضح البنت ياتستر عليها لو كلامى غلط ياجماعة قولو<br />فعلا كلامك منطقى وخصوصاان الناس دلوقتى لسه بتعيش فى جهل وكل اللى بيهم الرجل ليلةالزفاف هو الدم<br />حتى لوكان متعلم وعلى قدرعالى من الثقافة المجتمع دخل فى دماغةانه لو مالقاش دم يبقى البنت دى مكنتش كويسة<br />حتى لو كان الغشاء بتاعها من النوع اللى مش بيتمزق بسهولة ومش بينزل منه دم<br />ثقافة المجتمع هى اللى دمرت عقول الناس"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123081016/http://www.20at.com:80/banat/health-and-beauty/health/14517-2009-12-22-14-35-16.html"

