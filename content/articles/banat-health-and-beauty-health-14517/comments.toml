text = "يا بنات العادةالسريةدى عبارةعن محاولةلاثارة الجسم عن طريق العبث فى المناطق الحساسةبجسمك او بالاعضاء التناسليةودى يقال عنها انها حرام واسترجع بعض العلماء ذلك استناداالى قول الله تعالى:(وَالَّذِ ينَ هُمْ لِفُرُوجِهِمْ حَافِظُونَ* إِلَّا عَلَى أَزْوَاجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَانُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ* فَمَنِ ابْتَغَى وَرَاءَ ذَلِكَ فَأُولَئِكَ هُمُ الْعَادُونَ )<br />لكن فريق اخر من العلماء احل العادةالسريةفى حالةان الولد او البنت وصلة بيه الشهوةالجنسيةال ى حد عالى اوى خاف منهاانه يرتكب معصية<br />لكن احنا عمتا نحاول اننا نجتنب الشبهات لانها تظل محرمةاو يقال عنهاكذلك استنادا الى قول الله تعالى<br />بس اناعايزة اوضح نقطةهااااااااام ةجدا جدا جدا وخصوصا ان فى بنات كتير اوى على جهل بالموضوع ده ان البديل الطبيعى والحلال للعادة السرية هو الاحتلام وده هبقى اتكلم عنه فى تعليق اخر ان شاء الله ولكن بس احب اوضح نقطة اخرى ان يجب الاغتسال بعد العادة السرية او الاحتلام لان من لم يغتسل بعد ذلك تعتبر صلاته باطلة ويجب عليه ان يغتسل ويعيد صلاته مرة اخرى<br />كمان للاغتسال احكام<br />goosebumps_niso @yahoo.com"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224100644/http://www.20at.com:80/banat/health-and-beauty/health/14517-2009-12-22-14-35-16.html"

