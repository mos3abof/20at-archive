text = "دكتوره لوسمحتى انا فى مره حصلى حاجه غريبه انا اولا اسفه فى الى هقوله ده . انا بمارس العاده بس بمايه الشطاف ومفيش حاجه دخلتفيا انا اسفه جدا للى بقوله بس فى يوم نزل عليا دم بعد تقريبا البريود باسبوعين واكتر بس فى الدم ه نزل حاجه غريبه كده زى حته جلد شفافه او زى كيس بلاستك كده هل كده انا فقد عذريتى ولا لا ربنا يكرمك يا دكتوره طمنينى واروح لدكتور اطمن ولا لا؟"
