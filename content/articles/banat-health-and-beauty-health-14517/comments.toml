text = "انا دكتورة نسا يا بنات بخصوص استفساركم عذرية البنت مش الغشاء بس يا آنسة بمعنى ادق انت عذراء حتى و انت تعرضتي لقطع الغشاء ، الحالة الوحيدة التي تصبح البنت فيها غير عذراء هي حالة الاتصال الجنسي تمام يا بنات ، بمعنى أدق أن حتى الزوج لن يدرك تمزق الغشاء لانه مش لازم يشوفة انما بيبقى باين الي مارسة الجنس قبل كدا فحتى لو مفيش غشاء و اتجوزت اي بنت هتبقى في ليله الدخلة زي اي بنت عذراااااااااااا اء مفهوم كلامي يا بنات و انا هحاول اساعدكوا ديما و لو حد عندة استفسار يسألني و انا تحت أمركو انتوا زي بناتي، فحبوا و اتجوزوا و متخافوش الحالة الوحيدة الي تخافوا فيها هي ان يكون حدث بينك و بين اي رجل ايلاج تام مفهوم ستر ربنا عظيم مينفعش ربنا يسترنا و احنا نفضح نفسينا يا حبيبي لا تروحوا لدكتور و لا اي حاجة عيشوا طبيعي انتوا آنسات تمام يا حبيبي اسألوني انا زي ماما و كمان دكتورة و اوعي ثم اوعي تصرحي شب بحاجة زي دي علشان اي و لد عرف كدا هتنقصي في نظرو يا حببتي دا ان مرجعش و زلك بالمعلومة دي"
