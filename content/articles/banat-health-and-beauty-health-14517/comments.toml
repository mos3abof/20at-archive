posted = "2009-12-23"
text = "اقتباس التائبة:<br />اقتباس ماهيتاب:<br />أنا بحس بحاجات من دي كتير وساعات بغلط وأمارس العادة وانا خايفة قوي وحاولت انشغل بحاجات كتير وفي الاخر بعمل كدة ومش قادرة أرتاح غير كدة<br />ماهيتاب قبل الدخول للتواليت دايما قولى<br />اللهم إنى اعوذ بك من الخبث و الخباث<br />و إنتى خرجة قولى اللهم غفرانك<br />و لو حصل و حسيتى برغبة شديدة فى إنك تعملى كدة<br />اغتسلى كويس جدا جدا و جففى نفسك كويس و<br />أعملى حاجة انا مجرباها<br />قولى كل ما هعمل كدة هستغفر 100 قصدها<br />هتشوفى إن الشيطان مش هيفكرك بيها اساسااااااااااا ا<br />لانه هيخاف من تسبيحك و أستغفارك :)<br />فعلا الطريقة جربتها ونفعت معايا جدا فى موضوع العادة وانتهيت منها الحمدلله !!!!!!!!<br />وايه بقيت استخدمها فى حاجات كتير تانية .. يعنى مثلا حبيت حد والتفكير فيه معطلنى عن حياتى مثلا وعارفة ان التفكير فيه حرام فبقوم اسبح 100 مرة مثلا او استغفر 100 مرة<br />ومع الوقت تحول التسبيح لصلاة ركعتين مع اى ذنب<br />الطريقة دى ناجحة جدا بتخلى الشيطان يبعد عنك نهااائى<br />بس عاوزة عزيمة لانك ممكن تكسلى وتقولى هسبح 100 مرة ؟؟<br />لازم اصرار.."
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224100644/http://www.20at.com:80/banat/health-and-beauty/health/14517-2009-12-22-14-35-16.html"

