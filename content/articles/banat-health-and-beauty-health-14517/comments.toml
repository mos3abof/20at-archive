text = "مش فاهمة ليه فيه ناس كتير عمالة تفتى فى الموضوع من غير علم…<br />أول حاجة كاتبة المقال لم تسرد لنا ما هي مصادرها العلمية على الكلام اللى هى كاتباه؟؟ فين المراجع العلمية اللى ممكن توثق المعلومات اللى إنت ذكرتيها فى المقال فيما يخص أضرار العادة.<br />تاني حاجة البنات اللى عاملين نفسهم مفتيات فى الأزهر و عمالين يحللو و يحرمو على مزاجهم من غير أي دليل ديني على التحريم القاطع<br />و فيه بنات عملو حالة من الهلع للبنات التانية..لدرجة إن فيه واحدة بتقول (هينفع نرجع طبيعين بعد الجواز) و كأن مثلا ممارسة العادة هى مرض نفسي أو عقلى؟!<br />ليه كل هم بنات مصر (أنا عذراء و لا لأة)..خليكي واثقة من نفسك, إنت مش جسد و غشاء بس, إنت بني آدم, إنت عقل و تفكير و متستسلميش لأي حد بيحاول يفهمك أنك مجرد وعاء جنسي للراجل و إن مهمتك الرئيسية فى هذه الدنيا إنك تطلعى عذراء ليلة الدخلة<br />أنا مش مع العادة و لا ضد ممارستها لأنها تعتبر المتنفس الوحيد الآمن للشهوة فى حالة عدم الجواز و كتير مواقع و كتب بتقول إن ممارستها فيها فوايد كتيرةwww.maganin.com<br />أخيرا بأة..واحدة بتقل إنها بتمارس العادة يوميا!!!!!!!…يخرب عقلك :)"
