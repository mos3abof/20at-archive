text = "اقتباس mayoraa:<br />ياجماعه ..آنا كنت بمارس العاده دي كتير اوووي<br />وغصب عني ..<br />بتشد ليها ..<br />بس لما اتجوزت وبقالي شهور اهوو ..<br />مع ان زوجي بيعملي كل حاجه ..<br />ممكن تحسس البنت بآنوثتها ..<br />بس مش بحس او مش بوصل للشهوة<br />يعني طول ما بنمارس سوا .. مش بحس او مش بعرف اني اوصل للذروة.. حتى لو طال الامر لعدة مرات .. او حتى لساعه متواصله..<br />بالرغم اني لا اعاني .. من برود جنسي ..على العكس ..<br />انا خايفه اووي من المووضوع دا ..<br />يارين حد يرد عليااا<br />انا بسمع ان العاده دى هى اللى بتسبب كده"
