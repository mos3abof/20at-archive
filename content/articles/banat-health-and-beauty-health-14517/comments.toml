text = "عارفين يا جماعة<br />بجد المشكلة في البداية<br />لما بتيجي تبتدي دايت او ريجيم غذائي<br />لو استمريتي عليه اسبوع على الاقل<br />وجيتي تلخبطي فيه<br />بتصعب عليكي نفسك الفترة اللي استحملتي فيها تضيع هدر<br />ومع الوقت بتتعودي ومابتحسيش بصعوبة زي الاول<br />جربوا نفس الفكرة وصدقوني هتقدروا وهتنسوا الحكاية دي خالص<br />ومش هتفكروا فيها<br />او حاجة تانية ممكن تعملوها<br />هي انكوا تاخدوها بالتدريج<br />وتبعدوا عنها بالتدريج<br />يعني بدل ما تبقى كل يوم خلوها يوم ويوم<br />اي محاولة هتجيب نتيجة<br />المهم تفضل عندكوا الارادة<br />كل ما تيجي تفكري في حاجة زي دي<br />افتكري الكلام والتعليقات اللي قريتيها هنا<br />وافتكري انك مش لوحدك<br />ادخلي واكتبي اكيد ده هيساعدك"
