text = "السلام عليكم ورحمه الله وبركاته<br />بجد هو الموضوع حلو<br />بس الردود اللى اتقالت بجد وحشه قوى<br />ثم انا عاوز كل واحدة تراجع نفسها من الاول<br />لو البنت ماشيه بما يرضى الله ورسوله<br />يعنى لا بتسمع افلام جنسيه<br />ولا بتقرأ قصص مثيرة<br />ولا بتكلم اى واد وبتحس معاة بالاثارة<br />هل كان دة هيحصل<br />قال صلى الله عليه وسلم<br />تركت فيكم ما انت تمسكتم به لن تضلوا بعدى ابدا<br />كتاب الله وستنى . صدق رسول الله صلى الله عليه وسلم<br />ربنا يستر على بنات المسلمات كلهم<br />ويدهديهم ويصلح بالهم<br />تقبلوا خالص احترامى وتقديرى<br />اسف ان كنت طولت عليكوا"
