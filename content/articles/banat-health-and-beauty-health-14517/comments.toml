text = "اقتباس dero -dody:<br />السلام عليكم<br />انا كتبت قبل كدا هنا وطلبت ان حد يرد ع سؤالي ياريت حد يفيدني<br />لو فعلا انا بطلت العاده دي وكل البنات اللي زيي نرجع طبيعين تاني ولو اتجوزت هحس بالاحاسيس الطبيعيه ولا لا برضه وطبعا صعب جدا اني اقول لوالدتي او اروح لدكتوره<br />يارب حد يرد عليا<br />وع فكره انا فعلا لما لقيت الموضوع ده وع الرغم اني قريت الموضوع ده بره اكتر م مره بس المره دي والحمد لله قررت اني ما اعملش كدا تاني وبحاول ابعد عن اي حاجه تخليني عاوزه اعمل العاده السيئه جدا جدا والله يسامح الللي كانوا السبب ف تعليمي<br />شكرا ليكوا ويارب يا بنات حد يفيدني<br />انا اعرف ان خطورة العاده السريه فى انك تعمليها باستمرار لانها بتخلى الامتاع بعد الجواز قليل لكن لما ربنا يكرمك وتبطليها اكيد هترجعى طبيعيه واكيد ربنا هيوفقك فى الجواز<br />بس قولى يارب"
