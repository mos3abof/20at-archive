text = "على فكرة الموضوع بجد جامد موت … واحب اقدم احترامى لكل بنت عندها شجاعة تدخل وتتكلم بمنتهى الصراحة فى الموضوع ده .<br />بس بجد يا ريت يكون الكلام اكتر اضاحة علشان الكل يستفاد . يعنى مثلا ايه السن اللى بتبدأ البنت تشعر فيه بالرغبة لممارسة هذه العادة<br />وزى ما اتكلمنا عن المخاطر اللى ممكن تتعرضلها البنت بعد ممارسة العادة السرية .. يا ترى ايه وسائل العلاج من تلك المخاطر . بمعنى هل للبرود الجنسى مثلا علاج ؟ وما هو ؟<br />ربنا يسعد كل بناتنا ويبعد عنهم الوسواس الخناس من الجنة والناس ."
