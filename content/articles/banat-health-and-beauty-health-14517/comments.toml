text = "يا جماعة أنا فهماكوا قوي<br />وقريت كل كلامكم و للاسف وقعت ضحية الموضوع دة من فترة قريبة ..<br />والله من كتر ما أنا حاسة بيكم بقيت بدعيلكم كلكم وانا بصلي ان ربنا يقويكم ويقويني معاكم<br />يا جماعة والله وعن تجربة لو عايزة فعلا تبطليها خلي عندك اصرار جامد و حطي دايما في بالك انك كارهة نفسك كدة وانك ممكن في أي لحظة تاذي نفسك<br />تاني حاجة حاولي تبطليها بالتدريج يعني بدل ماهي كل يوم خليها كل يومين ممكن تيجي بعد اليومين وتحسي انك مش قادرة وعايزة تكرريها وممكن فعلا تعمليها تاني بس عادي مش مشكلة لازم تيجي واحدة واحدة بعدها زودي يوم و بعدها يوم و هكذا ولو فشلتي جربي تزودي عدد الأيام تاني بالتدريج أو تقللي عدد المرات اللي بتعمليها وصدقيني والله لو عدا ان شاء الله عليكي اسبوعين كاملين من غير ماتعمليها هتحسي انك نستيها أو عالاقل حسيتي انك عادي أهو عايشة من غيرها دة غير ان لو لا قدر الله الشيطان دخلك بعدها و يقولك مرة مش هتخسر امسكي نفسك وقولي أنا مش معقول هضيع الانجاز اللي وصلتله اني اقعد اسبوعين كاملين من غيرها وارجع أدخل نفسي في الدوامة دي من جديد<br />تالت حاجة اوعي تقعدي فاضية ..لازم تشغلي نفسك ..<br />ربنا معانا"
