subject = "ماذا او لقبك(سامى يوسف)"
text = "(سامى يوسف)انه فى اقل فترة ممكنة سرق قلوب وعقول العالم اجمع هل هذا لاندهاشهم لانه اجنبى ام لقدرته على السيطرة على الاحساس 000 ماذا اولقبه ملاك الخير ام صوت الاسلام ام براءة الاسلام مايكفى ولكن هو حقا (خليفة الله فى الارض) وانا احبه واحب حبه لله ورسوله واتمنى من الله له التوفيق النجاح ورضاه عليه وعلى امة المسلمين, ولو استطعت لكتبت عن حبى واحترامى لهذا النموذج الاسلامى فى كل الدنيا وعلى قلب كل مسلم يحب الله ورسوله, وعودة قادمة ان شاء الله0 نهى"
archived = "2004-10-18"
