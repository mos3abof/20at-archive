[[comments]]
order = 12
subject = "ابا اسلام"
text = "الله المستعان<br />اخواني هل تظنون ان نصرة الدين والنصر والتمكين ياتي بالغناء... كيف ينصر هذا الدين وهو يقوم بشيئ اجمع اغلب الفقهاء عليى حرمته ..<br />هذا كمن يصنع الخمر المحرم ويقول هذا خمر اسلامي ولا حول ولا قوة الا بالله<br />في نونية ابن القيم الجوزية بيت يقول<br />حب الكتاب وحب الحان الغنى في قلب عبد ليس يجتمعان<br />ولله تعالى قال { ومن الناس من يشتري لهو الحديث ليضل عن سبيل الله بغير علم ويتخذها هزواً أولئك لهم عذاب مهين } قال أكثر المفسرين : معنى ( لهو الحديث ) في الآية الغناء . وقال جماعة آخرون : كل صوت من أصوات الملاهي فهو داخل في ذلك كالمزمار والربابة والعود والكمان وما أشبه ذلك وهذا كله يصد عن سبيل الله ويسبب الضلال والإضلال . وثبت عن ابن مسعود رضي الله عنه الصحابي الجليل أحد علماء الصحابة رضي الله عنهم أنه قال في تفسير الآية : إنه والله الغناء . وقال : إنه ينبت النفاق في القلب كما ينبت الماء البقل . وجاء في المعنى أحاديث كثيرة كلها تدل على تحريم الغناء وآلات اللهو والطرب وأنها وسيلة إلى شرور كثيرة وعواقب وخيمة ، وقد بسط العلامة ابن القيم رحمه الله في كتابه : ( إغاثة اللهفان ) الكلام في حكم الأغاني وآلات اللهو .<br />والثابت عن النبي صلى الله عليه وسلم أنه رخص للنساء خاصة فيما بينهن بضرب الدف والإنشاد المجرد من التطريب وذكر العشق والغرام والموسيقى وآلات اللهو مما تشمل عليه الأغاني الماجنة المعروفة الآن ، وإنما رخص بالإنشاد المجرد عن هذه الأوصاف القبيحة مع ضرب الدف خاصة دون الطبول وآلات المعازف لإعلان النكاح بل صح في الحديث عنه صلى الله عليه وسلم كما في صحيح البخاري أنه حرم المعازف بجميع أنواعها وتوعد عليها بأشد الوعيد ، كما في صحيح البخاري وغيره من كتب الحديث عن النبي صلى الله عليه وسلم أنه قال : ( ليكونن من أمتي أقوام يستحلون الحر والحرير والخمر والمعازف ، ولينزلن أقوام إلى جنب علم يروح عليهم بسارحة ـ يأتيهم ـ يعني الفقير لحاجة فيقولن : ارجع إلينا غدا فيبيتهم الله ويضع العلم ويمسخ آخرين قردة وخنازير إلى يوم القيامة ) والمعازف الغناء وجميع آلاته . فذم رسول الله صلى الله عليه وسلم عليه وسلم من يستحلون الحر وهو الزنا ويستحلون لبس الحرير للرجال وشرب الخمور ويستمعون الغناء وآت اللهو . وقرن ذلك مع الزنا والخمر ولبس الرجال للحرير مما يدل على شدة تحريم الغناء وتحريم آلات اللهو .<br />اخواني .. ان الاسلام جد ليس بالهزل ....فمن اراد ان ينصر الاسلام ويقوم على هذا الدين .. فالطريق ليس كما تظنونه بغناء وطرب وما الى ذلك<br />هذا الدين يحتاج لرجال ليقوم .. يحتاج لصبر وعزيمة وبأس<br />وليس تمت ما يقال ولا حول ولا قوة الا بالله"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018212529/http://www.20at.com:80/article.php?sid=530"

