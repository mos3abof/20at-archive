[[comments]]
order = 38
subject = "لماذا نعقد الأمور"
author = "غيداء"
posted = "2006-05-26"
text = "أنا مع فكرة أن يكون هناك موديل محجبة و لكن بشروط:<br />1. يجب أن تكون الملابس للمحجبات فعلاً و ليس للعب.<br />2. أن تكون أنيقة بلا تكلف و لا بهرجة زائدة.<br />3. أن تمشي العارضة مشية تنمي عن الحياء لتقلدها كل البنات في مشيتها..<br />4. أن تعطي الملابس كل فئة عمرية من النساء حقها.<br />بالنسبة للأخ الذي قدم فتوىً حول أن تظهر الفتاة فقط أمام النساء، فنحن الآن في عصر الإعلام و الصورة، و نرجو أن ننقل صورة الفتاة المسلمة أمام الغرب بأحلى صورة، لكي نواجه كل دعاياتهم من أن المرأة المسلمة غير أنيقة و ريحتها واصلة للجار السابع، كيف نواجههم و نحن بهذه السلبية و بهذا التخلف الذي تبين لي من كثير مممن علقوا على الموضوع؟؟ ثم خبروني -أكرمكم الله- ماالضرر في ظهور المرأة المحجبة في فيديو كليب محترم وفق الشروط الإسلامية؟ أتعرفون ما مشكلتناياأمة محمد؟ إننا لا نتقبل الجديد و المبتكر بينما يتقبل ذلك أعداء أمتنا فيدمروننا بكل أسلحتهم الجديدة فلمَ لا نرد عليهم بأسلحتناالمضادة و التي من نفس جنس أسلحتهم تلك؟ أليست النار تطفأُ بالنار؟ كبروا لي عقولكم و لو قليلاً و فكروا بالموضوع، و أنا بالمناسبة فتاة عمري 18 سنة و محجبة، و لكن أتعرفون كيف أنظر للحجاب؟ هو وسيلة لإبعاد عيون الرجال عن الحرام و ستر المفاتن و العورة، و لكنني بنفس الوقت أهتم بأناقتي و تهذيب ملابسي لأنني أدرك للمسؤولية التي على عاتقي و هي الدعوة من خلال الملابس، نعم، إنني أمثل ديناً عظيماً يحب الجمال و النظافة و الأناقة و علي أن أظهر هذا الدين على أجمل صورة، و هذا بسبب كوني فتاة، أما الشاب أو الرجل المسلم فقد لا يبدو من خلال ملابسه إنه مسلم، لأنه لم يفرض الإسلام عليه الحجاب و لذلك فإنه يتحمل مسؤولية أقل في الدعوة من خلال الملابس، فياأختي المحجبة أنتِ داعية في أناقتكِ و جمالك الطاهر فاهتمي بهما و لا تسمعي كلام من يدعي التدين و الفهم بالدين و لا يتعب عقله قليلاً ليوزن الأمور بميزانها..<br />تقبلوا تحيات أختكم الصغيرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123227/http://www.20at.com/article2.php?sid=272"

