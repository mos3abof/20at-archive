posted = "2006-01-20"
text = "السلام عليكم ورحمة الله وبركات انا من فلسطين ارى ان ظهور الفتاة في أي مجال تلفزيوني ستكون موضع الشبه لانه تقريبا غير منتشرة فعندما نرى فتاة محجبة في فيديو كليب مثلا سوف نبدأ بالتعليق كيف ان هذه الفتاة تشارك في فيديو كليب وهي محجبة ماهو الداعي لذلك هل قلة المال ؟؟؟ ام ماذا ؟؟؟؟ ومع العلم ان الاغاني الهابطة حرام شرعا والموسيقى ايضا حرام شرعا حتى ولو في اناشيد اسلامية وشكرا على قراءةكم لتعليقي ولا تنسو انه مجرد تعليق ."
