[[comments]]
order = 40
subject = "السلفية"
author = "مصرية"
posted = "2006-06-04"
text = "حتى تكون سلفيا-عبدالحميد<br />الشرقية أون لاين - 5/14/2006 م<br />*إياك أن تراعي التدرج بالناس في الدعوة والتعليم بل مرهم من البداية أن يأخذوا الكتاب بقوة ، فلم يكن تدرج الله في تحريم الخمر إلا كلام نتعبد بتلاوته إلى يوم القيامة ولكن لا درس منه ولا عبرة؛ فإذا قرأت هذه الآيات فاقرأها بدون تدبر .<br />*إياك أن تقول لهم إن الصغائر تكفرها الصلوات الخمس، وصلاة الجمعة، وصيام رمضان وقيامه ، فالناس إذا سمعوا هذا الكلام تهاونوا .<br />*ولهذا أيضا لا تعلمهم قول الله عز وجل : \" إن الحسنات يذهبن السيئات\" [هود: 114]. ولا قوله تعالى \"إن تجتنبوا كبائر ما تنهون عنه نكفر عنكم سيئاتكم وندخلكم مدخلاً كريمًا\" [النساء: 31].<br />*عليك بالفظاظة والغلظة والخشونة في التعامل مع الناس، وإياك وحسن الخلق والرفق ولين الجانب وبشاشة الوجه ؛ فالرفق لا يكون في شيء إلا شانه ، والعنف لا يكون في شيء إلا زانه .<br />*لا تصفح بسهولةعمن هفا وزلت قدمه فـ ( عزيز عليه ما عنتم ، حريص عليكم بالمؤمنين رؤوف رحيم) من خصائص النبوة وليست من شأننا نحن.<br />*لا تهتم بحسن المظهر، في الصورة واللباس والسمت فإن هذا شأن المحبين للدنيا الغارقين فيها . وإياك أن تسمعهم قول الرسول \"إن الله جميل يحب الجمال( .<br />*قدِّم الإسلام للناس في صورة تقشعر من هولها الجلود، وترتعد من قساوتها الفرائص، وتوجل من ذكرها القلوب ، وإياك والتبشير ، وليكن شعارنا دائما : عسّروا ولا تيسروا ، نفّروا ولا تبشروا ، فهذا ما يصلح لهذا الزمان<br />*عليك بالاهتمام باللفظية\" في العقيدة فأقوال اللسان أهم كثيرا من إيمان القلوب .<br />*عليك بالاهتمام بالشكلية\" في العبادة ؛ فالمظهر أهم من الجوهر ، وأعمال الجوارح أهم كثيرا في هذا العصر من أعمال القلوب .<br />*عليك بالاهتمام بالسلبية\" في السلوك ؛ فالإسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123227/http://www.20at.com/article2.php?sid=272"

