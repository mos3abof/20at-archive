text = "والله يا جماعة كله محصل بعضه أنا أرى محجبات لابسين ثياب لا تكاد تستر عوراتهن الحجاب فقط للوجه يعني من الرقبة فما فوق ولكن باقي الجسم مصوّر تكاد ترى مشهد إباحي يمشي في الشارع أنا من مشجعي الحجاب ولكن الحجاب الإسلامي العفيف كما أمرنا رسول الله صلى الله عليه وسلم ولكم الشكر على هذا الموقع الهادف والمفيد لعل البعض يستفيد منه بشيء لدنياه وآخرته. والسلام عليكم"
