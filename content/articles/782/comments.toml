text = "وكمان يا ريت بلاش السمايليز بتاعة اليهود دي<br />إنتوا مش شايفين الطاقية اليهودي اللي تخرم عين الشمس<br />و الأخت اللي عايزة تبقى (موديلز!!مش موديل واحدة!) دي هي والباقيين ربنا يشفيكوا"
archived = "2006-11-02"
