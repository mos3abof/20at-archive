[[comments]]
order = 51
subject = "إرحموا من في الأرض"
author = "ميتو"
posted = "2006-07-28"
text = "الرحمة يا ناااااااااااااااااس<br />أنا مش محجبة و بالرغم من كده بقول إيه الهبل ده<br />الحجاب حجاب مش الغرض منه منفعة ولا إستعراض<br />ده لوجه الله تعالى و هبل شابات الأيام دي بقى لا يسر عدو ولا حبيب وعامل زي شغل اليهود<br />الرحمة يا هووووووووووووووووووووه<br />لأ وحلو قوي المحجبة المتحزمة دي مش ناقص غير إنها ترقص عشرة بلدي<br />بلا خيبة كده عليكوا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123227/http://www.20at.com/article2.php?sid=272"

