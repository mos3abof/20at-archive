[[comments]]
order = 18
subject = "الله يسعد كل من قراء تعليقي"
author = "محبكم"
posted = "2006-02-01"
text = "أحبتي والله لمأكتب الا لاني احبكم في الله ..<br />الحجاب مالغاية من الحجاب (الكتاب بين من عنوانة)<br />اي يكون بينك وبين الاخرين ستر وحشمة وعدم انجذابية<br />هذة هي الغاية من الحجاب كما قالت عائشة رضي اللة عنها ان الصحابيات اذا خرجن كانهن الغربان من السوادوالستر .. حيث ان الفتاة درة مكنوة وسط صدفة والا ما الفرق بين الرجل والمراءة<br />وأما النقاب في أيام الصحابيات :كان مختلفا جدا عن ايامنا هذة ...............<br />أحبتي ..أن الدين النصيحة<br />.......والدليل ان الوجة واجب التغطية<br />عن عائشة رضي الله عنها قالت:<br />كان الركبان يمرون بناونحن محرمات مع الرسول صلى الله عليه وسلم فإذا جاؤنا سدلت أحدانا جلبابها على وجهها من رأسها .فأذا جاوزونا كشفناه.رواة أحمد وأبو داود وابن ماجة.<br />ففي قولها ((فإذا حاذونا )) تعني الركبان ((سدلت إحدانا جلبابها على وجهها))دليل على وجوب ستر الوجه إذا كان بحضرة أجانب. و كشفه اذا لم يكن بحضرة أجانب والدليل على ذلك انها قالت ((فإذا جاوزونا كشفناه)) .<br />فدليل ذلك أنة واجب من تغطيتة إذا كان في حظرة أجانب وواجب من تغطيتة أذا لم يكن هناك أجانب فا الواجب لايعارضة الا الواجب<br />فلولا وجوب الأحتجاب وتغطية الوجة عند الأجانب ماساغ ترك ترك الواجب من كشفه حال الأحرام<br />وقد ثبت في الصحيحين وغيرهما :أن المرأه المحرمة تنهى عن القفازان والنقاب .قال شيخ الأسلام أبن تيمية :وهذا مما يدل على أن النقاب والقفازين كانا معروفين في النساء الاتي لم يحرمن وذلك يقتضي ستر وجوههن وأيديهن . منقول من كلا م الشيخ العلامة ابن عثيمين يرحمة الله ..وهناك أدله أكثر من ذلك من يريد يكتب لي إيميلة كي أرسل لة<br />والله على ما أقول شهيد<br />محبكم في الله.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123227/http://www.20at.com/article2.php?sid=272"

[[comments]]
order = 19
subject = "نقطة مهمة"
author = "عبدالله"
posted = "2006-02-02"
text = "أخوانى و أخواتى فالله, أنا أريد أن أنبه إلى شىء لم يأخذه أحد بعين الأعتبار و كل هذا الإختلاف كان بسببه, لقد ذكر فى الموضوع \"الفتوى أن يحضر النساء فقط عرض الأزياء\" أى أنه لا يوجد رجال فكل المختلفين حول أن البنت حتدلع و تتمختر, كلو قدام ستات مؤمنات أى لا حرج, لم أقل دلع جامد و لكن الطريقة فى عرض الزى لا يوجد حرج بها إن كانت مصحوبة ببعض التمايل أو الدلع, \"كلهم ستات مع بعض\" و لكن يجب الإلتزام أيضا بالحدود الشرعية أى عدم زيادة الدلع و خلافه و عدم أخذ المال الكثير و عدم الظهور أمام الرجال, و أهم شىء أن يكون الزى المعروض يتوافق مع الشرع أى يكون ساتر فضفاض و لا يكون به ألوان صارخة أو فاقعة أو أن يكون ملفت للنظر بشدة, مجرد مجموعة من الأزياء الشيك.<br />لأننا يا جماعة يجب أن تظهر بناتنا و أخواتنا و أمهاتنا أمام مجتمعات الغير محجبات و الغير مسلمات و الغربيات شيك, محافظات, غير ملفتات للنظر و هذا ما سيجذبهم للحجاب كلباس إسلامى و سيصلهم معنى الحجاب الصحيح حينذاك لأن إذا تمسكنا بشكل ملعبك للحجاب و ال\"نقاب\" لن يقول الغرب على نسائنا إلا لابسات للخيام و لن يتشجعوا للإقبال على هذا الدين الحنيف.<br />هذا رأيى و هو قابل للتغيير فى حالة وجدت رأى أفضل مع العلم أننى أحترم كل الآراء و أرجو عدم الرد على رأيي بأى شىء من الإستهزاء أو السخرية.<br />شكرا و السلام عليكم جميعا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123227/http://www.20at.com/article2.php?sid=272"

