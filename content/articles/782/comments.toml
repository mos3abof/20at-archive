text = "السلام عليكم انا من الاسكندرية ومن المحجبات الملتزمات انا احب ان تكون الفتاة المحجبة ملتزمة بزيها المتناسق حتى يعجب بها من يراها من غير المحجبين لتكون لهم دفعة لارتداء الحجاب ولكن اذا كان الزى ترتديه المحجبة لكى ترى الجنسين انا ارفض ذلك ولكن اذا كان بين النساء بعضهم بعضا هذا معقول ولكن اذا اخذ معنى الحجاب لالايكون مقيدا مثل الغير محجبين فهذا ارفضه."
