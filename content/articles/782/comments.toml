subject = "اختزال"
author = "ايه الفرق بين المحجبة وغيرها اذا اشتغلت موديل"
posted = "2006-01-17"
text = "الموضوع كله ان احنا اختزلنا المرأة في الجسد<br />وبعدين الموضوع بقى موضة<br />يعملوا ستار اكاديمي نعمل حج اكاديمي<br />يعملوا فيديو كليب فيه عري نعمل سامي يوسف<br />يعملوا ستار ميكر نعمل حجاب ميكر<br />واهو كل اللي بيجيب فلوس حلوة يبقى شغال<br />احنا اللي ظلمنا المرأة بوضعها في خانة ضيقة جدا وهي خانة الجسد<br />يعني هي اللي هتشتغل موديل محجبة الناس اللي بتتفرج عليها هيبصوا في وجهها وكفيها ولا هيعملوا مسح شامل لجسدها؟!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123227/http://www.20at.com/article2.php?sid=272"

