text = "كلام فاضى لو انها محجبة ما ابتعمل الاشاء الى زى هيك ممكن المحجبة تمشى على الموضة لانه طبعا هادا بعطى الجمال للحجاب اكتر من هيك ما اعلق بعرف لسة صغيرة لما اكبر بعلق اكتر انشا لله والبس الحجاب هههه شكرا ليكم على الموضوع<br />امونة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123227/http://www.20at.com/article2.php?sid=272"

