[[comments]]
order = 14
subject = "الحجاب يجب أن يستر المرأة لا أن يفضحها ويحولها لموديل"
author = "عبدالله"
posted = "2006-01-25"
text = "المرأة المسلمة يجب أن تلتزم بالحجاب الشرعي كما يجب علشان لما تروح عند ربها تروح وهي زي الفل ... لا مكياج ولا عطور ولا لبس ضيق ولا دلع وضحك ومشي متسكع... وإنما لازم يكون في حشمة وفي ستر وفيه التزام واحترام لنفسها ... وعموما هذه الصور للمحجبات وهن بيعرضوا الحجاب حرام ولكننا أصبحنا بنشوف كده لأن بناتنا أصبحوا بيلتزموا بلبس الحجاب وربنا يستر عليهم ويفرحهم في الدنيا والآخرة علي التزمهم ده ودي خطوة أولي والخطوة الثانية وهي الأسهل بإذن الله تعالي أن يكون الحجاب شرعي ومش للزينة ويكون لله تعالي اللي هنروح له في يوم من الأيام ... ونخلي ربنا يفرح بينا ويرضي عننا .... يا رب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123227/http://www.20at.com/article2.php?sid=272"

