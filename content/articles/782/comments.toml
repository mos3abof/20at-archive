text = "انامعاكم انوالمحجبة تلبس على الموضةلكن مش تغنى لان الاغانى كلامالشيطان والله حرمو فامش معقول انشوف محجبة يتغنىليش اصلا تغنى فا ترفع لحجاب اذا بدها"
