subject = "ركوب الموجه"
author = "أحمد النظيف و ليس \"نظيف\""
posted = "2006-01-17"
text = "يا أخوانا و أخواتنا ... الحجاب الذى أفهمه جاء لستر المرأه و حجب زينتها عن غير محارمها فأذا مشيت تتبخطر بما هو ملفت للانظار و كأنها تدعو من هنا و من هناك أن تعالوا أنظروا حلاوتى و شياكتى و بالطبع أنا لا أرغب فى أن تمشى المرأة و كأنها كومة تراب تمشى على الأرض و لكن أدعو الى التوازن و التمسك بالمعنى و الروح الحقيقية للحجاب و أن لا تعيش بعض الاخوات فى أزدواجية و أنفصام فى الشخصية فهى محجب لمجرد مجاراة الموجه و الموضة و فى نفس الوقت غير محجبة بلبسها الملفت .... أتقين الله يا أخواتى فى أنفسكن و فى شباب المسلمين"
