[[comments]]
order = 2
subject = "تصفية حسابات"
author = "حمادة المصري"
posted = "2006-09-16"
text = "أولا شكرا يا أستاذة منى<br />أنا بحيي شجعاتك بصراحة لإنه في الوقت الذي يحمل فيه نصرًا رمزًا للكرامة والانتصار<br />وفي أوج نصره وقفت لتضعي علامات استفهام ذكية ليست كهؤلاء الذين يريدون شق العصا وبذر الفتنة لتكون لهم الغلبة<br />سيدي خرجت منتصرًا وخرجت الجماهير العربية تهتف بك رمزًا والجميع في عيونها أصفارا<br />لكنه للأسف أخشى أن تغلب حسابتنا ومصالحنا مصالح الوطن لنبحث عن نصر فوق الركام وعلى أجساد شعبنا وليس في الميدان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130512/http://www.20at.com/article2.php?sid=1225"

