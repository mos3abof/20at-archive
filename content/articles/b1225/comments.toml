subject = "انتصرنا"
author = "دكتور عادل عبد الناصر حسين"
posted = "2006-09-23"
text = "اتقدم بالتهنئة الي شعب لبنان المسلم العربي علي هدا النصر الكبير من حزب اللة علي اليهود الجبنا وقد انكسرت ثقافة الهزيمة داخل المواطن العربي وظهرت ثقافة الانتصار الدي اخرجنا من الاكتئاب واللة والحمد اللة//دكتور عادل عبد الناصر حسين/شقيق الزعيم الراحل/القاهرة مدينة نصر"
archived = "2006-11-02"
