[[comments]]
order = 4
subject = "مناقشة للخواطر"
author = "سوري... دمشقي"
posted = "2006-09-19"
text = "سيدتي الكريمة:<br />السيد حسن ضاق ذرعاً بالحكومة اللبنانية فخرج عن صمته، وهو الذي قال بعد انتهاء الحرب مباشرة أنه (يرفض الخوض في أي سجال، والأولوية الآن هي لاعادة اعمار ما هدمه العدوان الاسرائيلي).. ليت خواطرك قادتك الى الأسئلة التالية:<br />1- لماذا تستقبل الحكومة اللبنانية وزيرة خارجية امريكا ورئيس وزراء بريطانيا ونحن كلنا نعلم ان الحرب الاسرائيلية على لبنان هي حرب أمريكية بدعم بريطاني أعمى وبأدوات اسرائيلية.<br />2- لماذا تصر الحكومة اللبنانية على نزع سلاح حزب الله وتقدمه على أنه مشكلة لبنان، بينما المشكلة هي في العدوان الاسرائيلي المستمر وفي احتلال الأراضي العربية. حزب الله يدافع عن سيادة لبنان ضد العدوان الاسرائيلي، بينما هم يتبنون وجهة النظر الاسرائيلية الأمريكية بضرورة نزع سلاحه.؟؟؟<br />3- لم يعد خافيا على أحد أن الثالوث العربي مصر - الأردن - السعودية كان مؤيدا لعملية القضاء على حزب الله.. ومن بديهيات القول أن الحكومة اللبنانية كانت شريكة في التأييد... وهذا ما فضحه علنا وزير خارجية قطر عندما صرح أن العملية كان مقررا لها أن تدوم أسبوعين فقط!!!!؟؟؟<br />4- عمليات الانزال للقبض على السيد حسن كانت تتم بناء على معلومات استخبارية تدل على موفعه... وذُكر أن (الجاسوس) مروان حمادة كان مصدرا لهذه المعلومات...<br />سيدتي، أعتقدأن الحقيقة واضحة بدون أي حاجة لأي اثبات... المؤامرة لتصفية حزب الله كانت لبنانية عربية اسرائيلية امريكية بدون أدنى شك. فلماذا نأخذ على الرجل بوحه بما ضاق به صدره بعد طول صبر.<br />أرجو منك استدراك خواطرك وتصويبها ان وجدت في كلامي منطقاً قابلا للنقاش."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130512/http://www.20at.com/article2.php?sid=1225"

