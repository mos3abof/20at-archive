[[comments]]
order = 7
subject = "شجاعة لبنان"
author = "د عادل عبد الناصر"
posted = "2006-09-23"
text = "شعر عادل عبد الناصر//في لبنان كانت المحبة والصدق والايمان/لكن اسرائيل بتحب الحرب وتكرة السلام//وكان جيش الامامبالمرصاد واخد تمام/وكانت علقة سخنة ومش اوهام/وفي الجنوب واشجار التفاح دارت معارك المسلمين الفتيان في وجود حسن نصر اللة ابن الكرام/ واليهود كانو في الحرب عصافير وكتاكيت وحمام/وكان جند اللة من المسلمين شجعان القلب وعارفين ربنا الرحمن/وياما قلنا نعم للسلام بس مش سلام الاوهام او سلام اليهودي القوي علي العربي الغلبان/وامهم في النهاية كان مسك الختام وانتصر شعب لبنان اما اليهودي اولمرت الجبان فهو في الخزي خيبة وكان اصلة عايش الاوهام وانتصار الجبان اللي بيهد الجامع ويقتل النسوان ولكن نقول عاش شعب لبنان الهمام واما اسرائيل فملهاش حل غير علقة يوماتي وكمان شد الودان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130512/http://www.20at.com/article2.php?sid=1225"

