posted = "2006-09-16"
text = "ممممممممممم ...<br />مش عارف أكنب إيه؟؟<br />كلامك وإسلوبك .... كلمة رائع شوية عليه ... ولو علي طول تكتبي بالمستوي وطريقة التفكير والنظرة الشاملة دي .... حقيقي ساعتها... يكون شوية عليكي عشرينات<br />ربنا يوفقك ... ويكرمك ... وينفع بيكي الإسلام والمسلمين<br />وبرضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري .<br />mohamedmat@hotmail.com"
