[[comments]]
order = 1
subject = "الكل بي خيب"
text = "الى كل عربي بدل ما تقاوم بتمرح و تضحك و اسرائيل بدمر الاراضي و انتم تتمتعون<br />عــــــــــــــــــــــــار علينــــــــا كــعربــــــــــــــــــــ"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417101712/http://www.20at.com:80/article.php?sid=83"

[[comments]]
order = 2
subject = "عرب ايه و خيبة ايه ؟"
text = "عرب ايه اللى انتم بتنادوا عليهم ؟؟؟؟؟<br />و الله ما فشلنا الا بقولة يا عرب<br />العرب طول عمرهم متفرقين و لا صوت لهم الا عندما اصبحوا مسلمين عند إذن اصبحوا قوة و صارت لهم حضارة و تلك واحدة من معجزات الاسلام فلما نسي العرب الدين رجعوا الى اياما جاهليتهم و رجع بأسهم بينهم شديد على سبيل المثال انظر ما يحدث في المباريات الرياضية تجد العربي ممكن يتهزم بفضيحة مجلجلة من اي أجنبي و لا انه يخسر من واحد عربي<br />اللهم أعزنا بالاسلام<br />و آخر دعوانا أن الحمد لله رب العالمين"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041742/http://www.20at.com:80/article.php?sid=83"
