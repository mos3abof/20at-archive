author = "بلا قومية بلا بتاع"
posted = "2009-12-02"
text = "انس الفقى بتاع الاعلام قال عن القومية العربية بلا قومية بلا ابتاع- هو فيية احد بيتكلم عن القومية من المحيط الى الخليج غيركم<br />يا عم ما تتلزقوش فى القومية والملوخية ما تخليوكوا فى خيبتكم وخيبة بلدكم<br />احنا عايزين انبوبة بوتاجاز ورغيف عيش ووظيفة فى قطاع خاص او قطاع يهودى المهم حاجة ناكل منها عيش<br />قومية اية اللى بتتلزقوا فيها<br />هى القومية منعتك تعلن الحرب على الجزائر والا تقطع العلاقات معاها لو كنت راجل<br />يا حلاوة القومية<br />شوية فاشلين ان كنتم اعلام او خارجية<br />مين فيكم اللى بيبوس الواوا ومين اللى بيمص - على فكرة فية واحد فيكم وشة اصفر من كتر المص يا حكومة هفأ يا معرصين"
archived = "2009-12-04"
capture_url = "https://web.archive.org/web/20091204005326/http://www.20at.com:80/masr/news/14210-2009-12-02-08-28-34.html"
