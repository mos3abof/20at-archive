posted = "2009-12-02"
text = "الاعلام في مصر في ايدي غير المتخصصين<br />وقبل كده قلنا عشرات المرات في هذا الموقع<br />خريج كلية الحقوق بيشتغل محامي<br />وخريج اي كلية ما ينفعش يشتغل محامي<br />المهندس خريج كلية الهندسة<br />وخريج اي كلية ما ينفعش يشتغل مهندس<br />وكذلك الدكتور<br />وكذلك المحاسب<br />اما بقا الصحافة والاعلام ليها كليات متخصصه<br />لكن يا خسارة اي خريج من اي كلية ممكن يشتغل صحفي ويقبلوه اسرع من خريج كلية الاعلام وحياتك ومن غير كلية ممكن يشتغل صحفي<br />المحامي يشتغل صحفي الطبيب يشتغل صحفي المحاسب يشتغل صحفي المدرس يشتغل صحفي المهندس يشتغل صحفي العاطل عن العمل يشتغل صحفي<br />الصحافة والاعلام مقلب زباله لكل العواطلية والشمامين واللي مش لاقيين شغل<br />فلازم تكون دي النتيجة<br />انه بسبب الاعلام الفاشل دولتين وقعوا في بعض وقعه سودا<br />ونوجه نداء الى السيد وزير الاعلام يرجى اقتصار الوظائف الاعلاميه على خريجي كليات الاعلام والصحافة<br />ارجوكم ارجوكم ارجوكم"
archived = "2009-12-04"
capture_url = "https://web.archive.org/web/20091204005326/http://www.20at.com:80/masr/news/14210-2009-12-02-08-28-34.html"

