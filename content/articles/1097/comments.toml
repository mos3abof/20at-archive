[[comments]]
order = 1
subject = "مقارنة مع غيره ..."
author = "ur tunisian brother"
posted = "2006-08-10"
text = "طبعا فهو قائد حقيقي مخلص يذكرنا بجده الإمام علي فهو ليس غيره من القادة الذين يعيشون وهم الزعامة و عند الضغوظات ينخون و يبكون مثل النسوان و ليس من الذين يدفعون بشعوبهم في لهب المعركة و اولادهم في الملاجئ محصنين منعمين و لكنه قدم ابنه البكر<br />( هادي 17سنة ) شهيدا و حتى عندما اخذ الإسرائيليون جثته الشريفة لم يقم حزب الله بمفاوضات خاصة للإفراج عن جثته و لكن تم الإفراج عنها في مفاوضات للشهداء بصفة عامة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132203/http://www.20at.com/article2.php?sid=1131"

[[comments]]
order = 2
subject = "مقارنة مع غيره ...."
author = "ur tuinisian brother"
posted = "2006-08-10"
text = "و هو قائد ذكي لا يخاطب الناس بلغة القرون الوسطى ( الصليبيون و الكفرة ... ) و لكن يضع في حساباته ان الإسرائيلي و اللبناني المسيحي و العلماني كلهم يستمعون له مع تمسكه بإسلاميته و هذا هو الصواب إذ من غير المعقول ان يؤلب ان الناس عليه و يكثر من الاعداء في وقت الاولوية فيه لمحاربة اليهود ..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132203/http://www.20at.com/article2.php?sid=1131"

[[comments]]
order = 3
subject = "محمد حسان والتكفير"
author = "محمد حسان والتكفير"
posted = "2006-08-10"
text = "انهال العشرات من المصريين بالضرب علي امام مسجد في محافظه بورسعيد شمالي البلاد لانتقاده حزب الله لبنان .<br />وقالت صحيفه \"المصري اليوم\" المصريه اليوم ان امام المجمع الاسلامي الكبير في مدينه بورفواد بمحافظه بورسعيد ويدعي الشيخ محمد حسان فوجي‌ء بعد انتهاء خطبه الجمعه امس بعشرات المصلين ينهالون عليه ضربا وركلا حتي نزف الدم منه وانه لم ينقذه من بين ايدي المصلين الا رجال الامن.<br />واوضحت ان الشيخ حسان \"انتقد حزب الله مروجا لفتوي لرجل دين سعودي عن حرمانيه نصرته الامر الذي اثار المصلين الذين هددوه بالقتل ان عاد للمسجد مره اخري\".<br />واشارت الصحيفه الي ان هذه الواقعه هي الثانيه خلال اسبوع واحد التي تحدث في مصر التي يتمتع فيها حزب الله لبنان وزعيمه حسن نصر الله بشعبيه كبيره."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132203/http://www.20at.com/article2.php?sid=1131"

[[comments]]
order = 4
subject = "..& فلتحيا الكرامة والعزة وليسقط كل من رضوا بالذل والهوان &.."
author = "..& هيكل الأزهرى &.."
posted = "2006-08-23"
text = "فلسطين حبى واعتزاز قلبى لكى من قلبى سلام ولحسن نصر الله سلام ايضا ولكن من نوع خاص والله يا نصر الله انت فعلا نصر للأمة ربنا يحميك ويكرمك اما بالنصر دائما وإما بالشهادة وبالنسبة لموضوع شيعى من غيره دا موضوع لا يمس بالإسلام بصلة الإسلام يعامل متبيعه معاملة واحدة والإختلافات المخلة هذه لا تأتى الا منا فعلا احنا اللى بنحط الخلافات دى بإيدنا ولازم احنا برضه اللى نشيلها بإيدنا برضه ربنا يكرمك يا حسن يا نصر الله والله رفعت راسنا كلنا بأمر الله وبفضله عز وجل كرمنا الله واياكم بالعزة والكرامة والنصر واذاق الله العذاب لكل من رضوا بالذل والمهانة والهوان ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132203/http://www.20at.com/article2.php?sid=1131"

[[comments]]
order = 5
subject = "اين دول المسلمة شكرا للمقاومة يلي رفعت راس الاسلام الىالامام شهداء"
author = "مسلمة"
posted = "2006-09-11"
text = "بسم الله الرحمن الرحيم<br />والله العظيم عجبتني كتير هذه الانشودة وانا كنت قرات عليها في الجريدة ان الاحتلال الصهيوني بيضربو كل من لقوا عنده هذا الشريط. وانا بحكي الكم شكرا كتير على هيك اناشيد وعيزين اكتر واكتر . انا من المغرب وبدي ان شاء الله توصل الاشرطة الى هذه المنطقة لان في كتير من ابنائها بتحب فلسطين ولبنان وبتحب المقاومة. وانا بشكركم كتير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132203/http://www.20at.com/article2.php?sid=1131"

