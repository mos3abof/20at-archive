subject = "لبيك يا نصر الله"
author = "إبن عيتا الشعب"
posted = "2006-10-17"
text = "بسم الله الرحمن الرحيم<br />كنا ولانزال رهن إشارتك يا أبا هادي<br />خض بنا حيث شئت فوالله لن تجد سوى رجال خبزهم القرآن الكريم وشربهم أدعية محمد وأل بيته صلى الله عليه وآله."
archived = "2006-11-02"
