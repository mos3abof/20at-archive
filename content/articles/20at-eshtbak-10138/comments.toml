author = "مرتضى الجبوري"
posted = "2009-05-06"
text = "ان هذا البرلمان هو خطوه هامه في بناء الشباب ومعرفة ميولهم وحاجاتهم وان مثل هذا البرلمان هو مفيد للشباب الذي يشكل الجزء الاكبر والفعال في المجتمع العراقي ونتمنى من القائمين على هذا البرلمان الشبابي تحقيق الاهداف كافه والالتفات بمعنى الكلمه الى الشباب واخراجه من دحور الظلمات والاضطهاد واخراجه الى نور الحياة ليكون مفيدا وعنصرا فعالا ولكم جزيل الشكر والتقدير وشكر خاص الى وزير الشباب على هذه المبادره الطيبه وشكرا مرتضى الجبوري من ديالى الوفاء"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908091014/http://20at.com:80/20at/eshtbak/10138.html"

[[comments]]
