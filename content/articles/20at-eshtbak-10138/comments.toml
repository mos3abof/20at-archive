posted = "2009-08-09"
text = "محمد فريد 20سنه احد اعضاء برلمان الشباب العراقي …<br />برلمان الشباب خطوة هامه ويعد هذا البرلمان خطوة جديده تخطو بها الدوله الى الامام كما هي تخطو الان عده خطوات نحو مستقبل زاهر لشباب العراق<br />فان اغلب مشاكل الدوله هي من صنع الشباب فكيف ان نغير هذه العبارة ونقول ان اغلب مشاكل الدولة قد حلها الشباب ..<br />فان الشباب هم عماد المستقبل وبايديهم يبنون بلدهم ويعمرونه ولهم الاحقيه في اتخاذ القرارات لانهم يمثلون الفئة العضمى من سكان البلاد بنسبه 65%<br />واتمنى ان يلاقي برلمان الشباب نجاح باهرا وتغييرا مناخيا جميلا من اجل عراق اجمل عراق محبه وموده وامان"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908091014/http://20at.com:80/20at/eshtbak/10138.html"

