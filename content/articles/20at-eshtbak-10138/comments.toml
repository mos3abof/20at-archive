[[comments]]
order = 10
subject = ""
author = "سلوان احمد الجاف"
posted = "2009-09-10"
text = "نشكر برلمان الشباب غير الحكومي ونشكر كل منظمة شبابية تساهم به ونشكر مجلس النواب لانه مد يد العون للشباب وهذه ستكون تجربة ناجحة في العراق بعيدا عن الاحزاب والوزارات وقريبة من مجلس النواب ونحن علمنا ان الوزارة تحاول ان تاسس نفس الفكرة لاكن على شكل قسم؟؟؟؟وهذا عمل غير صحيح بدل ان تأسس عليها ان تدعم برلمان الشباب غير الحكومي اليست هي وزارة للشباب لاتأخذ مشروع للشباب بنفس الاسم ولكم يا شباب العراق منا الف تحية وسلام."
archived = "2009-09-13"
capture_url = "https://web.archive.org/web/20090913122947/http://www.20at.com:80/20at/eshtbak/10138.html"

[[comments]]
order = 11
subject = ""
author = "محمد قاسم"
posted = "2009-09-10"
text = "موفقين بأذن الله لمشروعكم برلمان الشباب غير الحكومي ونحن شاهدناه من خلال التلفاز مع مجلس النواب العراقي ونحن مجموعة من الطلبة في الجامعة المستنصرية نؤيد البرلمان غير الحكومي مع المنظمات الشبابية والشباب ولانؤيد برلمان الوزارة لانه ليس من عملهم وعمل الوزارة يخالف الدستور العراقي والله الموفق."
archived = "2009-09-13"
capture_url = "https://web.archive.org/web/20090913122947/http://www.20at.com:80/20at/eshtbak/10138.html"

[[comments]]
order = 12
subject = ""
author = "سجاد حسين الموسوي"
posted = "2009-09-10"
text = "الان اصبحت الصورة واضحة عندي ان هنالك برلمانيين للشباب انا ايضا كنت اعلم ان البرلمان غير حكومي وتعمل علية المنظمات الشبابية منذ زمان وانا اعرف المسئول عنه الاستاذ امير كاظم الاان مشروع الوزارة حيرني اذا برلمان الشباب الغير حكومي ليس الوزارة ممتاز نحن كشباب معه لانه يقوينا ليس للدفاع عن الشباب فقط وانما لمراقبة الاداء الحكومي وانا كشاب احس بقوة عندما لا اكون متبط بالحكومة لاراقب عملها وامثل برلمان خارج الوزارة نشكر ونبارك جهودكم فهذا فعلا العراق الديمقراطي"
archived = "2009-09-13"
capture_url = "https://web.archive.org/web/20090913122947/http://www.20at.com:80/20at/eshtbak/10138.html"

[[comments]]
order = 13
subject = ""
author = "فراس عمار علي"
posted = "2009-09-10"
text = "نشكركم ونشد على اياديكم يامنظمات الشباب في مشروعكم برلمان الشباب غير الحكومي وسنعمل على دعم مشروعكم بكل الجهود فانا رجل محامي وقرات الدستور جيدا وتفاجئت بان الوزارة تريد تاسيس برلمان للشباب فهل الوزارة خالية من الخبرات لكي تقع في هذا الخطأ ؟ وليس من حق الوزارة لا قانونيا ولا دستوريا ان تأسس برلمان للشباب اومنظمة مجتمع مدني ..وانتم ايها الشباب المجتمع المدني عملكم دستوري وقانوني لانكم مع الدستور في مفرداته ومادمتم مع مجلس النواب السلطة التشريعية وبعيد عن الوزارة وانتم الاسبق في هذا العمل سيتقبلكم جميع الشباب في العراق وسنعمل كقانونيين وصحفيين على دعم مشروعكم وبارك الله في جهودكم التي تبذلونها من اجل العراق الجديد."
archived = "2009-09-13"
capture_url = "https://web.archive.org/web/20090913122947/http://www.20at.com:80/20at/eshtbak/10138.html"
