author = "مؤيد اكرم علي"
posted = "2009-05-18"
text = "السلام عليكم 29 سنة<br />الى متى وكيف وماذنب شبابنا ان يهمشون اليس لهم راي ام يتخوفون من جرئتهم واندفاعهم الى تطوير بلدهم وامكانياتهم الثقافية ليكونوا رجال المستقبل وقادتها وباسمي وباسم رابطة احياء مندلي الشبابي نطالب بتفعيل هذا التجمع الشبابي البرلماني<br />ويجب ان يكون انتقااهم منغ تحزبي او طائفي وان اختيارهم من خلال كفائتهم لكي يمثلوا سبابنا افضل تمثيل امام العالم والدول لكي يعرفوا ان شبابنا شبابا لايستهان بهم فها نحن رابطة شبابية واكبرهم سنا انا الذي ابلغ 29 سنة ولدينا صحيفتنا ونشراتنا الثقافية وفرقنا الرياضية والفنية ومعارضنا<br />شاكرين ادارة الموقع من نقل اصواتنا الى المسؤلين والشعب<br />مؤيد اكرم علي حسين | ديالى _ناحية مندلي"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908091014/http://20at.com:80/20at/eshtbak/10138.html"

