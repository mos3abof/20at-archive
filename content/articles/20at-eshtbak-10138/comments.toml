[[comments]]
order = 6
subject = ""
author = "مثنى عبدالاله الماضي"
posted = "2009-08-25"
text = "ان فكره البرلمان فكره نموذجيه ورائده ولاكن للأسف فهناك طبقه واعيه مثقفه من الشباب هي خارج اسوار البرلمان بسبب الحصص او التقصيم الحزبي الفاشل فمثلن انا من مدينه النجف قد تم اختيار اعضاء برلمان الشباب على حصص الاحزاب فتم تهميش طبقه واسعه من الشباب المثقف>>>ليس الشباب الحزبي الفاشل>>>>حيث تم اختيار شباب من المقرات الحزبيه ولاكن لله المشتكى فلقد تم اختيار ابناء المسؤلين لكي يلتهمون الجمل بما حمل لقد رئيت انا في حياتي سرقات مختلفه ولاكن سرقه الرئي والفكر والعقول فلم اراها حتى في المافيه الروسيه ولاكن رئيتها عند الاحزاب الاسلاميه ===هيا قومو ياشباب العراق لكي نؤسس برلمان لنا على الارصفه المضلمه لأن العراق ليس بلدنا على مايبدو فهو بلد الاسياسين انا متؤكد ان مهزله البرلمان سوف تفشل فأنا حسب تجربتي في هاذي الحياه رأيت ان حزب البعث ارحم لنا نحن الفقراء شباب العراق المسروق المحارب من كل النواحي"
archived = "2009-09-08"
capture_url = "https://web.archive.org/web/20090908091014/http://20at.com:80/20at/eshtbak/10138.html"

