text = "ما قصدته هو العلاقات العاطفية وهي موضوع المناقشة هنا<br />مش عارف الناس بقت مش بتفهم بسهولة ومع ذلك عندها حماسة للتسرع في الرد كده ليه<br />هل نلوم نظام التعليم ؟؟؟"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

