subject = "اللهو الخفي"
text = "طبعا تعليقات المنافقين من شلة الكاتبه..."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 14
subject = "واحد موش من الشلة..!!"
text = "أنا بس يا جماعة عندي كلمتين عايز أقولهم وأروح ..<br />أولا أنا موش من شلة شيرين ولا أعرفها<br />ثانيا الموضوع يمكن النظر إليه بزاوية أخري ..<br />شيرين تقر واقع ..الشاب الذي يعمل في اي شركة سواء كانت قطاع عام أو خاص أو حتي كشك سجاير ..وفي نفس مكان عمله تتواجد زميله له ..<br />شيء طبيعي إن يحدث بعد شهرين تلاتة من اللقاءات اليومية \"الأجبارية\" شيءا ما من الاستلطاف والذي قد يتطور لحب ...بفعل الزمن<br />إذن بما إنه كدة كدة بيحصل<br />وبما إن الموقع ده جريء وجامد وشبابي والمفروض انه بيتكلم عن القضايا اللي بتهم الشباب دون حرج ...\"هما بيقوله كدة \"<br />يبقي ايه المانع اننا نتناول قضية زي دي من غير ما ندفن راسنا في الرمل<br />بيرو"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 15
subject = "وائل عباس"
text = "معلشي يا بنات ما تزعلوش مني ولو اني عارف اصلا ان مافيش حد مش زعلان مني في عشرينات كلها<br />لكن انا ضد عمل المرأة وبالذات العمل المختلط<br />وبحكمي اكبركم واكثركم خبرة ربما ... وقاربت اني اخلص عشريناتي احب ابشركم ان كل علاقاتي بالجنس الاخر في نطاق العمل انا او من اعرفهم لم تنتهي بالزواج ... بل كانت احيانا غير اخلاقية ... بل احيانا وهو الانكي والاضل سبيلا ان العلاقات غير الاخلاقية كانت احيانا بين ناس متجوزة !!!<br />حاجة تقرف<br />ياريت يا بنات تخليكم في التدريس والطب ...<br />واجتنبوا مواطن الشبهات<br />اهو حتى تسيبوا مكان للشباب الصيع العواطلية اللي على القهواي علشان يفتحوا بيوت ويلموا فيها عوانس بلدنا اللي كتروا اوي اوي اوي بسبب ما يسمى بعمل المرأة !!!<br />وربنا ما يحكم على راجل يتقفل عليه باب مكتب مع واحدة متجوزة وهو لسه ياعيني ما دخلشي دنيا ...<br />وصدقوني المصيبة ممكن تبتدي بكلام هايف ودردشة فارغة تتطرق الى مواضيع خاصة بتسخن حبة حبة ...<br />ومش ضروري اكون باحكي تجربة شخصية<br />ممكن اكون باحكي تجارب اصدقاء اعرفهم كويس<br />علشان بس انا عارف فيه هنا ناس ما بتصدق تمسكلي غلطة ..."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 16
subject = "غريبة!"
text = "\" كل علاقاتي بالجنس الاخر في نطاق العمل انا او من اعرفهم لم تنتهي بالزواج \"<br />انت عاوز تتجوز بنات الشركة كلهم..وبعدين انتهاء علاقات الزماله بالجواز دا اللي مش طبيعي...:)"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

