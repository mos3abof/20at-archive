order = 12
subject = "اللهو الخفي"
text = "التعليقات كلها تافهه والموضوع بايخ مش شيرين اللي هتعلمنا ازاي نتجوز.........."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
