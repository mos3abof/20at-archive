[[comments]]
order = 0
subject = "بيرو"
text = "كله كوم وموضوع الرئيس في العمل ده كوم تاني ..<br />أعرف واحد قال لمديره في الشغل وأكتشف إن المدير ده حاطط عنيه علي البنت من فترة ...وأتجوزوا بعدها باسبوع<br />واحد تاني قال لمديره قاله الشركة دي شركة محترمة وموش ممكن اسمح فيها بالكلام الفارغ ده ...بره انتوا الاتنين ..!!<br />اما التالت من يوم ما عرف اصبح كل همه ازاي يقنع البنت ان الولد ده موش مناسب ليها ..!!<br />يخرب بيت كل مدير معقد ...!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 1
subject = "بدور"
text = "الموضوع ده جامد مووووووووووت<br />وخصوصا إنه بيمس حالتي قوي<br />انا بقي يا جماعة بحب واحد زميلي في الشغل ...وهو ابن خالتي في الوقت نفسه<br />بقالي سنتين بحاول ألمحله أفهمه ألفت نظره..<br />لكن أبدا ...البعيد معنوش دم<br />إنما علي مين ....<br />موش هتنازل عنه ابدا مهما يكون"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 2
subject = "نانا"
text = "تسلم ايدك يا شريين الموضوع حلو قوي<br />فكرني بالفيلم بتاع مراتي مدير عام وخصوصا دور عادل إمام وهو ماسك الكتاب وداخل علي شادية وبيشخط فيها<br />المشكلة في حظي الهباب ..كل اللي في المكتب معايا يا اما متجوزين يا اما تقرف منهم اول ما تيجي سيرتهم ..!!<br />محسسيني اني عانس ..مع اني لسه في الــ23<br />حد عنده عريس ..؟؟"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 3
subject = "واحد مثقف"
text = "فيه كتاب ليوسف أدريس أسمه العيب ..القصة كلها بتدور علي فكرة الحب في العمل<br />علي فكرة الكتاب أنا مستلفه من كاتبة المقال ..<br />وبصراحة الشيطان بيوزني اني مرجعهوش ..<br />ايه رايك يا شيرين..؟؟"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 4
subject = "شيرين راعية المثقفين"
text = "ولا يهمك يا أستاذ مثقف، خللي الكتاب عندك.. بس يعني لما تحب تعلق مش لاقي غير موقف من كتاب سالفه من الأمة الفقيرة إلى الله.. أمال دور نشر وكتب وسيديهات ايه يا عم؟؟"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 5
subject = "عنوان بديل"
text = "عندي عنوان بديل للموضوع ده<br />أنت وزميلتك ..حبوا بعض .!!<br />أو حتي ممكن تتجوزوابعض ...مفيش فرق كتير<br />كله محصل بعضه<br />توقيع<br />المأسوف علي شبابه ...<br />واحد متجوز من واحدة زميلته"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 6
subject = "حب!!"
text = "عفواً يا عشرينات..<br />العنوان يدعو إلى الحب الجهجهوني.. خلوه: اتجوز زميلتك من غير ما تترفد"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 7
subject = "احمد خان"
text = "انا يا جماعه عندي فكره حلوه اوي لموقع عشرينات<br />ايه رايكم لو نفتح دردشه في الموقع<br />اصل واضح اوي ان كل الزوار هنا بيحبوا يتكلموا مع بعض اكثر ما يعلقوا<br />وكل مقال يتكتب يطلع شويه زملاء للكاتب ينفقوه في مقالته شويه ولا تعليقات ولا اي شىء"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 8
subject = "طاهر سليم"
text = "الكاتب هنا بيتكلم كأن الاختلاط مش حرام<br />عمل المراه مع الرجل مش حرام يا صاحب المقال الختلاط بين الراجل والمراه حرام وله عواقب كثيره<br />زي ما في ااو ممكن علاقات تنتهي بالجواز في اكيد قدها مرتين بتنتهي بلرفد من العمل"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 9
subject = "لا أتفق معك"
text = "الأستاذة شيرين، تحية طيبة،<br />إني لا أتفق معك في الأن الزميلة إذا رفضت أن تخرج مع زميلها هذا يعتبر رفض له... لماذا لا نقول أنها على خلق حميد... فما الذي بينهما حتى يخرجا معا.<br />وأين قول المصطفى: (لا يخلون رجل من امرأة إلا وكان الشيطان ثالثهما).<br />....................................حالم بمستقبل مشرق"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 10
subject = "ذات دين"
text = "ثم إن أي شاب شرقي (مسلم) يبحث عن زوجه متدينة... لأنه يعلم أنها تخشى الله.. إن غاب عنها حفظته في ماله وعرضه... وإن كان معها سرته....<br />...............قصة مع جار لي..............<br />أعرف شاب يقضي أوقات مع فتيات من هنا وهناك.... وفي يوم إذا به يخبرني أنه قد خطب!!<br />فسألته من؟؟<br />قال لي: إنها بنت متدينة وتلبس النقاب؟!<br />هذا والله ما حدث.<br />فسألته مستغربا: ولماذا؟<br />قال: لي بالحرف الواحد...أنا عاوز واحدة أثق فيها. قلت له: طيب اللي أنت مشيت معاهم؟!<br />قال لي: دي يا عم تفاريح.. وبعدين أنا مش معقول ارضى أجوز واحدة مشت معايا.. هذا ما حدث.<br />.......................حالم بمسقبل مشرق"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

[[comments]]
order = 11
subject = "هل نلهث وراء الغرب"
text = "عذرا أرى أنك في تناول هذا الموضوع قد خالفك التوفيق، وأرى أنه مناسب للغربيين.. ولا يناسبنا نحن العرب المسلمين.. التي تحكمنا أعراف وتقاليد.. وقبله دين..<br />..............................حالم بمستقبل مشرق"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018181652/http://www.20at.com:80/article.php?sid=657"

