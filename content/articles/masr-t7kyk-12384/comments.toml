order = 1
subject = ""
author = "الحجاب والنقاب"
posted = "2009-06-16"
text = "صدقونى النقاب والحجاب افضل 100 مرة من الكمامة<br />يا جماعة الحجاب فوق الانف او النقاب بيمنع دخول ذرات التراب والكربون وعادم السيارات وكل بلاوى التلوث<br />انا اشتغل فى مكان صناعى كلة تلوث وكربون وغبار<br />والعمال بيربطوا منديل مبلول فوق انوفهم وصدقونى بيمنع بلاوى كتيرة<br />الموضوع مش تعصب ولا تدين ولكن الجو الصحراوى والملاصق للصحراء محتاج فلتر فوق الانف وكمامة مستمرة<br />والنقاب والحجاب يقوم بالمطلوب ويتم غسلة واستعمالة مرة ثانية بع[ *** ] الكمامة<br />وانا اعرف ان هذا المرض لن ينتشر بين المصريين لاننا لسنا من اكلة لحم الخنزير"
archived = "2009-06-22"
capture_url = "https://web.archive.org/web/20090622074409/http://www.20at.com:80/masr/t7kyk/12384-2009-06-16-12-22-22.html"

