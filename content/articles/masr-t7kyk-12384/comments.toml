posted = "2009-06-17"
text = "لازم يا جماعة تسألوا طبيب اولا هل الطريقة دي تمنع دخول الهواء للانف من ناحية العين او مادة المنديل والحجاب تعتبر فلتر يمنع الفيروس ويسمح بدخول الهواء للتنفس الطبيعي.ارجوكم يا شباب مش ده الوقت اللي حنهرج فيه دي حياة او موت ادرسوا الفرق بين الماسك و اي اختراعات اخري حتعرفوا ا نهم في البلاد المتقدمة علميا عارفين الفرق علشان كده لابسين الماسك"
archived = "2009-06-22"
