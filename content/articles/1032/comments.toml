text = "لا لا لا اوعو تصوتو لفادى ولا شيما<br />لان لادا صوت والتانية اوكى صوتها حلو بس فادى احلى<br />بليز ياشباب موقع عشرينات الجميل صوتو لفادى<br />دا مهما كان فلسطينى بردو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

[[comments]]
order = 4
subject = "بطلو بقي"
author = "محمد"
posted = "2006-03-31"
text = "السلام عليكم ورحمه الله وبركاته<br />الاسلام بيتهان والنبي بستهزأ بيه القرأن بيدنس والمسجد الاقصي يستغيث<br />واحنا نايمين نحلم بفادي واستار اكاديمي<br />والاسلام يتهان مايتهانشي واحنا مالنا<br />فوقو بقي بلاش الغفله دي<br />انتو ايه<br />سيبوكو بقي من الاغاني وبصو لدينكو شوفوه عاوز منكو ايه<br />هتلاقو انكم مقصرين اويس في حقه<br />http://eslamna.4t.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

[[comments]]
order = 5
subject = "؟؟؟؟"
author = "صايع"
posted = "2006-03-31"
text = "مالك ياعم محمد اهدى شوية كدا<br />البنات بتحب عمنا فادى دا خليهم يفضفضو ماتعملش فيها شيخ ودا حرام ولا حلال<br />فيها اية البنات كلها بتموت فى سى فادى بية يارب يطلع ويريحكم ويريحنا<br />دانا احلى منو يااخوانا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

[[comments]]
order = 6
subject = "جتكوا نيلة"
author = "مفروسة"
posted = "2006-04-01"
text = "هو فيه ايه الناس التافهة اللي فوق اللي عماله تتكلم على ستار اكاديمي ويتخانقوا على فادي وهاني وماعرفش ايه دول أكيد ما قروش الموضوع من الاساس وداخلين يهرجوا، عشرينات كاتبين موضوع عن شاعر عظيم ورائع والكلام عنه يقطع القلب ويخلي الناس تحس على دمها وتفكر في فلسطين والعراق وتكره كل حاجة جت من الغرب اصلا مش يفضلوا يحلموا بهاني وفادي، برافو عشرينات وياريت الاخوة اللي فوق يحسوا على دمهم شوية ويبأدوا ياخدو بالهم ان فيه حاجه اسمها تفكير واحساس بلا خيبة جتكو نيلة مليتوا البلد أنا معاك يااخ محمد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

[[comments]]
order = 7
subject = "ربنا يرحمنا"
author = "بلال"
posted = "2006-04-01"
text = "والله عندك حق يا مفروسة والناس دي خسارة فيها الشغل الجامد اللي عملينه في قلم رصاص والنماذج الجميلة اللي بيقدموها بس ولا يهمكم ياعشرينات الى الامام وسيبكم من الناس التافهة دي ربنا يرحمنا من ستار اكاديمي واخواتها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

[[comments]]
order = 8
subject = "نعم"
author = "فلسطينى"
posted = "2006-04-01"
text = "كتير الشكر لها الموضوع انكو عم تتكلمو عنا عن فلسطين<br />لكن ما تنسو ان فادى هدا فلسطينى<br />ونحنا الصبيان غير الفتيات كتير حزنا لخروجة من الاكاديمية<br />لانة واللة كتير صوتة حلو غير هانى المصرى لانة ما عنو صوت اصلا<br />كتير صوت هانى المصرى سىء جدا<br />وكان الواجب هو الذى يخرج<br />انا بعرف ان الفتيات يحبو كتير فادى لانة كتير وسيم لكنى اتحدت عنة لانة فلسطينى وتعرض لكتير ظلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

[[comments]]
order = 9
subject = "البحر دونك يا عراق"
author = "نيفين"
posted = "2006-04-02"
text = "من تانى بلاقينى بقول قصيد السياب لما بقرا كلمه عراق<br />كنت كتبت منها حنه قبل كده بس رايحه من بالى دلوقتى<br />و ايه الجديد الجرح قدييييييييييييييييم يا بغداد<br />عايزه اقول للحلوين الروشين اللى فوق ريحوا نفسكم فادى طلع<br />و يا ريت تختارو الموضوع اللى تقولو فيه كده او تريحونا من تعليقاتكم اصلا<br />صحيح هم يضحك و هم يبكى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

[[comments]]
order = 10
subject = "لماذا نستسلم للباطل"
author = "ساره"
posted = "2006-04-02"
text = "سلام عليكم ورحمة الله وبركاته<br />ليه كده ياشباب ليه قضيتنا كلها استار اكاديمى وهانى وفادى انا والله حزينه لان هناك مصريين يشاركوا فى هذا البرنامج, فى اول مره ظهر فيه هذا البرنامج كنت من متابعيه ولكن ليس بالطريقة هذه ايضا ولم اكن التزمت حينها, ولكن الحمد لله الان لا اطيع سماع هذا الفساد وادعوا لهؤلاء الشباب ان يفيقوا من هذه الغفلة, فتخيلوا مثلا لو توفى احد منهم فى هذه الاكاديمية الفاسده ماذا سيكون مصيره وماذا سيقول لرب العالمين فى يوم القيامه ,فهذه الاكاديميه لا تليق بعقيدتنا ولا حتى بتقاليدنا نحن العرب ,تخيلوا مثلا ان يجتمع شباب من دول العالم العربى ليعيشوا مع بعض بهذه الطريقة المستورده القبيحه التى لا يرضى عنها الله عزوجل ولا رسوله الكريم, او يجتموا لقضاء خامس ركن من اركان الاسلام بان يخرجوا لقضاء مناسك الحج كمان راينا صناع الحياه فى رمضان, فو الله انا حزينة كل الحزن على هؤلاء المشاركين فى هذا البرنامج فلقد ساهموا فى نشر الفساد بين الشباب, وارجوكم لا تشجعوهم على ما يفعلونه لان الله عزوجل سوف يحاسبكم على ذلك لانهم لو لم يجدوا تشجيعا فلن تستمر هذه الفاحشه وتزكروا ان هذه الدنيا زائله ولن نخلد فيها وكل نفس ذائقة الموت الذى لا مفر منه لذلك ادعوكم ان تفيقوا قبل فوات الاوان واعلموا ان كل ذرة عمل تقومون بها سوف تحاسبون عليها فاتقوا الله فى افعالكم واقوالكم فلقد عشت وفاة اقرباء لى وعندما اتذكرهم افكر انهم كانوا معى ولكن اين هم الان فى قبر اما ان يكون روضه من رياض الجنه او حفره من حفر النار فاللهم اجعلنا ممن كتبت لهم حسن الخاتمه واجعل قبورنا روضه من رياض الجنه واكتب لنا جنة الفردوس يارب العالمين<br />وجزاكم الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

[[comments]]
order = 11
subject = "السلام"
author = "فلسطينية مسلمة"
posted = "2006-04-03"
text = "السلام على الجميع<br />والله انا موافقة مع الاخت سارة<br />وارجوا من شباب و بنات المسلمين ان لا ينساقوا وراء هذه السخافات<br />من اختكم الفلسطينية (اللتي تعشق مصر و اهلها)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

[[comments]]
order = 12
subject = "انا فهمت"
author = "غيور"
posted = "2006-04-03"
text = "بت ياسارة<br />انتى يابت انتى ونيفين<br />اركنولكم على جنب والنبى<br />والنبى منك ليها لتبعدو عننا انتو سبب العقد والغباء فى الشرق الاوسط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

[[comments]]
order = 13
subject = "الله يسامحك يا غيور"
author = "ساره"
posted = "2006-04-05"
text = "الله يسامحك يا من اضفت مداخله باسم غيور انا بت وايه الاسلوب اللحضرتك بتتكلم بيه ده ايه اركنوا على جنب اسلوبك فى الحديث بيدل عليكى لو حضرتك مش عجبك كلامنا برحتك محدش بيجبرك على حاجه انا كده مبسوطه لما بقول كلام انا حساه وسدقنى انا طبعا معرفكش بس اسلوبك بيدل عليك انت والله الخسران انت والبقولوا ان الالتزام عباء وتخلف تعرف انا عرفت اجانب لما اسلموا استغربوا علينا احنا المسلمين جدا وقلولى انتوا مبتحبوش دينكم ومبتمثلوش دينكم ورسولكم ومبتحمدوش ربنا على نعمة الاسلام دول الاجانب ال احنا بنقتدى بيهم لما بيعرفوا دينا بيقولوا علينا كده كمان انت تعرفنى اناو الفاضله نفين عشان تقول احن سبب غباء شرق الاوسط والله والله كل البعيد عن ربنا ومنهج الاسلام هو السبب فى ضعف المسلمين فى الشرق الاوسط عيب تغلطوا فى حد كده ايه الاسلوب ده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

