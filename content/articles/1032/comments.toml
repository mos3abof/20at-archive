[[comments]]
order = 16
subject = "بارك الله بكم موضوع يستحق القراءة"
author = "أخوكم إبن القدس المحتلة"
posted = "2006-04-16"
text = "بارك الله بكم موضوع يستحق القراءة<br />من المواضيع القليلة في الفترة الأخيرة التي أرى أنها تستحق القراءة.<br />أمافيما يخص بعض التعليقات التي لا تمت بصلة للموضوع فهذا هو جزء من الصورة الكلية التي أدت بالشاعر الأديب أن يموت معوز على أحد أرصفة بغداد الحبيبة بعد أن شرع البعض منا من أبناء ثقافة ستار أكاديمي لماغول القرن الحادي والعشرين بإغتصاب بغداد , كما أستبيحت من قبل قبلة المسلمين الأولى.<br />\"لن يغير الله ما بقوم حتى يغيروا ما بأنفسهم\"<br />والقافلة تمشي والكلاب تنبح دائما, فهلا تقدمنا وتركنا النابحين حتى يصحوا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

[[comments]]
order = 17
subject = "حزني عاى"
author = "عدنان عزيز دفار"
posted = "2006-06-19"
text = "ان موت عقيل علي موت لجرئتنا وموت للصخب الغير مبرر الذي نمارسه بعد موت المبدع هذة الثقافة التي تهييأ لنفسها الانتشار احتفالا في الموث، ثقافة مرضى وندم لماذا اصبح المبدع عبقريا بعد موته لماذا كان مطاردا من الرصيف والاهل والاصدقاء . هل العقدة في نفسونا لاننا لانستطيع ان نعترف بعبقرية المبدع الا ميتا ، لابد ان نؤسس الى نوع من ثقافة جديده ثقافة حياة واحتفاء لا ثقافة رثاء ونعي بعد الموث لاننالا نجرأ ان نتحدث عن المبدع الا ميتا<br />انني اعيب تلك الثقافة ولاامضي في مسالكها فقد اسست وسعيت في تاسيس ثقافة الاحتفاء في المنتدى الذي اديره في مدينة الناصريه وسأقيم اول احتفال بمدع شاب علي السباعي على قاعة نقابة المعلمين يوم الجمعه القادم فادعوا الجميع الى مشاركتي الى التأسيس حتى نتخلص من عقد كانت تلازمنا لعقود"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"
