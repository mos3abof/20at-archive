subject = "ولا فائده"
author = "Dabdoob"
posted = "2006-03-31"
text = "رحل عقيل علي<br />كما رحل الكثيرون من قبله<br />لنفقد يوما بعد يوما شظايا الامل في اي شيئ ممكن<br />في اي حلم بارق<br />رحل عنا كما رحلت (لا) و(فلسطين) و(العراق) و(اللغة العربية)<br />للاسف يا سادة<br />مفيش فايدة<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

[[comments]]
order = 1
subject = "وداعا عقيل"
author = "بلال"
posted = "2006-03-31"
text = "عقيل علي رحل مع من رحلوا احتجاجا على هذه الحياة الميتة التي نعيشها نحن العرب، رحل بعد ان وجد صديق واحد وهو الرصيف وما اكثر من يعيشون حياتهم باكملها على الارصفة والطرقات دون ان يسال عنهم احد ولا يشعر بوجودهم احد، لن ننساه لانه منا ولن نتذكره لانه يذكرنا بماساتنا فوداعا عقيل علي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131314/http://www.20at.com/article2.php?sid=642"

