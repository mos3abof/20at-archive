[[comments]]
order = 0
subject = "ربنا يعينكم"
author = "كرة جميلة"
text = "وربنا يعينكم و يوفقكم<br />ورمضان كريم علي كل عشريني مننا<br />وكل سنه وانتم طيبين<br />سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142847/http://www.20at.com/article.php?sid=1635"

[[comments]]
order = 1
subject = "الصورة مفتوحة علي العالم"
author = "لاستعانة بعلماء في الفناوي"
text = "كبت التهريج وعدم اظهار الصور التي تفطر<br />عدم تحليل مسلسل تلفزيوني واظهار صورها في وضع غير سليم ويتم التعقيب علي .<br />اقصد اظهار المحاسن والبعد عن المفاسد للصوم<br />ترجمة هذا لجيع لغات العالم واللهجات<br />فحاليا هناك قواميس بالكمبيوتر لتصنيف الفقرة الي الاف اللغات واللهجات واذا لم تتوفر لديكم اطلبوها من شركات مايكروسوفت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142847/http://www.20at.com/article.php?sid=1635"

[[comments]]
order = 2
subject = "ننتظر موضوعات قوية"
author = "زاكم الله خيرا يا عشرينات على هذه الصفحة التي نأمل أن تكون قوية وفعالة"
text = "وننتظر منها المفيد والجديد . . وإن شاء الله الجمهور أيضا يكون متفاعل معها بشكل قوي ..<br />كل عام وأنتم بخير<br />عمرو مجدي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142847/http://www.20at.com/article.php?sid=1635"

[[comments]]
order = 3
subject = "ردا علي الروش طحن"
author = "ا كتبت في كلمات مختصره شدتني لارد عليك"
text = "يمكن ان تكون من المرفهين الفافي ولم تعيش داخل الشوارع .<br />لم تركب اتوبيسات الترحيل لثلاث محافظات استعداد للحرب وتوزيعها علي الدولة كلها وما واجهت من مشكلات<br />لم تنام داخل المستشفيات والمدارس لعدم وجود مساكن الايواء الثلاث محافظات.<br />لم تذوق الامرين وانت تستعد للمعركة لمواجهة العدو<br />لم تتجرع مرارة بحر البقر والاطفال يعومون في بحر الدم وليس بحر البقر.<br />لم تتجرع كاس الصلابة والسكون ورفع الراس في المواقع والجبال واستعدادات والتطور والاقتناع .<br />وبعد ان تجرعت النصر ورفع الراس يمكنك ان تسب وتلعن<br />وعنك حق لانك لم تذوق هذه المرارة.<br />واذا كان اصل الاهل واردين مما يحملون المراوح واجهزة التلفزيون من دولة اخري ويعملون خدم باعوا انفسهم واهلهم للمال واعتقد ان يسب الاخرين بمزاجه<br />واذا كان رئيسنا مش عاجبك ارحل وبلاد الله واسعة.<br />ستجد نفسك وحيدا وسط ذئاب المجتمع رجال ونساء<br />وتعود معتقدا انك جحامل اكياس من ذهب وانت تحمل الهم والغم وعدم راحة البال .<br />فارجوا منك ان تسب كمان وكمان لاشبع من قذف شعب يحب من كان جادا ومناضلا حبا لوطنه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142847/http://www.20at.com/article.php?sid=1635"

