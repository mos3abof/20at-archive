subject = ""
author = "يا ريت"
posted = "2010-02-02"
text = "يمكن نقدر نلحق باسرائيل هزيمة كرويه<br />ويا ريت يبقى منتخب عربي وليس مصري"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205154237/http://www.20at.com:80/masr/news/15175-2010-02-02-14-45-45.html"

[[comments]]
order = 1
subject = ""
author = "اسألوا جدو الكبير"
posted = "2010-02-02"
text = "رائع لو جدو وافق والمنتخب لعب فى اسرائيل مفيش ولا دولة عربية هتدخلة من مطارتها<br />- طبعا القيادة المصرية والقيادة الاسرائيلية سمن على عسل وكل يومين بينطوا فى الشرم ويتعزموا على الغداء - ولكن المنتخب اذكى من ان يوضع فى القائمة السوداء"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205154237/http://www.20at.com:80/masr/news/15175-2010-02-02-14-45-45.html"

[[comments]]
order = 2
subject = ""
author = "مش ححبك"
posted = "2010-02-02"
text = "المعلق السابق<br />لماذا رفضت اللعب مع اسرائيل<br />طالما ان الكره حقد وكراهيه<br />الاهلويه والزملكاوية بيكرهوا بعض وبينهم حقدا وكراهيه وثأر<br />مصر والجزائر بسبب الكره اصبحو دولتين عدوتين يكرهان بعضهما البعض<br />اذن فلماذا لا نلعب الكره مع اسرائيل طالما احنا بيننا وبين اسرائيل عداوة جاهزه<br />يمكن تفعل الكره ما لم نستطيع ان نفعله في الحروب<br />يعني نهزأ اسرائيل في الكره طالما مش عارفين نهزأها عسكريا"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205154237/http://www.20at.com:80/masr/news/15175-2010-02-02-14-45-45.html"

[[comments]]
