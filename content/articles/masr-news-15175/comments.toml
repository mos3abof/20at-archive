subject = ""
author = "جيمي"
posted = "2010-02-02"
text = "والله ليكون آخر يوم أشجع فيه المنتخب لو اتوافق علي الماتش ده"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205154237/http://www.20at.com:80/masr/news/15175-2010-02-02-14-45-45.html"

[[comments]]
order = 4
subject = ""
author = "إبراهيم"
posted = "2010-02-04"
text = "لماذا إسرائيل لقد أحقدتم العالم العربي علينا يا مصريين من أجل كرة قدم فقط وتجاهلنا المصير العربي المشترك بيننا وبينهم وتمسكنا بإسرائيل وفقدنا الجزائر وقطر وسوريا والسودان وليبيا وتونس والمغرب وغيرهم أين الحكمة أين العقل يا أحفاد عمر بن العاص وليس الفراعين والله ذا منكر"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205154237/http://www.20at.com:80/masr/news/15175-2010-02-02-14-45-45.html"
