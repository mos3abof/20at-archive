text = "انا برضه السوستة عملت معايا مقلب يوم الفرح وانا لسه عند الكوافير ومكنتش جربت الفستان من يوم ما اشتريته خلاص قبل الفرح والسوسته علق لا هيا راضيه تطلع ولا تنزل وحاول كل الناس الموجوده يجربوا بشمع وصابون وبالسياسه انهم يقفلوها مفيش فايدة لحد ما واحده مشكوره اتبرعت وقالت يااقفلها يا تتقطع ونخيطها وبالفعل شدتها علي فجأة وقفلت الحمد لله وكان تمام طول الفرح بس لما روحت البيت كان زوجي مضطر يفتحها برضه بصعوبه لحد ما اتقطعت عشان اتحرر من الفستان"
