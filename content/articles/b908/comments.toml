[[comments]]
order = 4
subject = "طريق مروك الى الخفاء والجهل والكدب والنفاق الى الابد هكدا تحبو"
author = "كمال المغربي"
posted = "2006-07-05"
text = "ياه كم الحياة رجعت تعيسة بالخهلاء اه يا حصرة مخرجين ومتقفون ورئساء تحرير لمجلات كبرى يقول هدا الكلام هنا اعترف بان الجهلاء لا زالو بالمغرب والدول العربية والاسلامية ليه مالو فيلم ماروك يقول متل مغربي // الي مالكش السفنجة تيكول عوجة // الله يرحم من قال اول مرة هده الحكمة الجميلة ربما لم تكن للمخرجيم مال كبير لكي يعملو متل هده الافلام الكبير في الفكر والصراحة والصرامة في الواقع العربي والاسلامي هل ليس موجود هدا الواقع وليس فلم لا يا اخواني موجود .واد كان هدا الفلم ليس له مكان ومسيء للامة الاسلامية والعربية على اي حال احسن من افلام نراه ليس لهالون او مداق او تقافة فتلك الافلام ليست حرام او باحرى لاصحاب العدالة وجريدة التجديد هل ليس تلك المقولة الدي نشرتم اهيا حلال ام حرام على تلك الزنزال لعمودي الدي ضرب اسياهل نحن ليس عندنا زنازيل اه يا صغار."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154427/http://www.20at.com/article2.php?sid=908"
