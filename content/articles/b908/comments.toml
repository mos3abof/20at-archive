[[comments]]
order = 0
subject = "بدلا أن نرفض فلننتج اللي أحسن منو"
author = "حرا طليقا"
posted = "2006-06-06"
text = "يا سادتي أنا شاهدت الفلم(كصحفي ناقد)<br />قمة الاباحة ..<br />ولكننا لن نجبر القوم على اعتناق أفكارنا<br />الناس أحرار حتى ولو اختلفنا معهم..<br />قضية أن الفلم لم تقبل نشره الا ميغاراما وهذا جاء في خبر سابق على موقعكم المقدر..فهذا غير صحيح العشرات من السينمات تنشره ..الحضور عادي ويمكن أن نقول أنه أكثر من العادي بقليل ..ليس لأن الفلم يستحق ولكن لأن الرافضين له عملو فيه خير وقامو له باشهار غير عادي..<br />نحن خلقنا للتدافع ليلي المراكشي مع من في صفها ضد المخرجين الذين يقفون على الشطر الاخر<br />فهذا يعرض أفلامه والاخر يعرض أفلامه<br />والحق للشعب في أن ينتقي ما تشاء.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154427/http://www.20at.com/article2.php?sid=908"

[[comments]]
order = 1
subject = "زمن االمسخ العالمي"
author = "متابع"
posted = "2006-06-06"
text = "اللهم هذا منكر هذه هي الكلمة التي عدنا نملك في زمن الخنا و الخنوع المسيس و الممنهج في الحقيقة الواقع المغربي الأخلاققي أكثر مما عبر عنه الفيلم لكن يبقى الفلم مجال للفرجة لا أقل و لاأكثر و يبن جرأة المغاربة على فعل القبيح و التباهي به كما هو شأن المخرجة التي خرج لها العقل و ممثلي الفلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154427/http://www.20at.com/article2.php?sid=908"

[[comments]]
order = 2
subject = "ياملائكة"
author = "مغربية"
posted = "2006-06-10"
text = "رضا على الاخ زمن المسخ العالمي الفلم مو لهدرجة من الاباحية وماحدافع عن المغرب لكنو مو الوحيد فلاداعي لتخفي تحت ستار العفة فانتم ادرى بمايحدث فالخفاء او في دول اجنبية وهناك ناس قمة في الاخلاق فلاداعي لمس كرامة اي بلد دون معرفة كلية وهناك ايضا افلام عربية بمستوى افضح من هدا فلا تفتح عين وتغمض الاخرى وكن شاملا بنظرتك ان اردت النقد اخي الفاضل."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154427/http://www.20at.com/article2.php?sid=908"

