[[comments]]
order = 2
subject = "المستثنى بـ \"ليس\" !!"
text = "المستثنى بـ \"ليس\" !!<br />فرقدٌ ذلك الرجل، جعل من السكون حركة، ومن المرض عافية، ومن العجز إرادة، ومن القهر شموخ، ومن الموت حياة..<br />سعى إليه الخلود، ودانت له الزعامة.<br />منحه الله رخصة، فحمد الله عليها، ووضعها في ركن بعيد، بعيد، بعيد..<br />خطفها \"الأصحاء\" وقالوا: نحن أحق بها منه.. فهل من مزيد؟<br />وفى بيان التبرير، قال فريق: نحن عميان، وقال آخر: نحن عرجان، وقال ثالث نحن مرضى<br />أما شيخنا، فلم يزل لسانه رطباً بذكر الله، الحمد لله، الحمد لله على نعمة العافية في الدين والدنيا والآخرة.<br />شيخي سبق الجميع، دون أن يبرح مكانه.<br />وهرول الجميع، فخسروا الدين والدنيا.<br />أما الآخرة.. فعلمها عند ربي..<br />ركبوا الخنزيرة، والحلوفة، والشبح، فداستهم الأقدام<br />وتكوم شيخي على كرسيّه، فكان تاجاً فوق الرؤوس.<br />قضى ليله يناجي ربه..<br />وقضوا ليلتهم، يحلمون بنظرة، من جرو البيت الأبيض.<br />ولما الصبح أسفر، كان السجين تحرر.<br />غادر الكرسي، وحلَّق، وحلَّق، وحلَّق..<br />وفي الملأ الأعلى، حفته الملائكة، وزفَّته الحور.<br />أخذ مكانه، في حوصلة طير أخضر، تحت العرش يُغرد.<br />والحبيب محمد، باسم الثغر، أسعد..<br />إيه يا أحمد..<br />طال بنا الانتظار، وكان اليوم.. في اللوح موعد.<br />استثناك ربُك إذ قال:<br />\"ليس\" على الأعمى حرج، ولا على الأعرج حرج، ولا على المريض حرج..<br />وكنت كلُّ ذلك<br />فأبيت<br />وأمرهم ربهم إذ قال:<br />انفروا خفافاً وثقالاً<br />فأبوا<br />فتباً لهم، سحقاً لهم..<br />أما أنت، فهنيئاً لك..<br />هنيئاً لك في صحبة الكرام..<br />بعيداً عن اللئام، والأقزام، ومايسمى بـ \"السلام\".<br />عدو بوش"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417201940/http://www.20at.com:80/article.php?sid=80"

