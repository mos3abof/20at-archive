subject = "البحث عن بدائل"
text = "الجانب الاخباري في الموضوع مهم جدا .. وفكرة التغيير في تكنيك عمل الجماعات القاعدية .. مسألة مهمة .. تحسب لكاتب المكقال ، لكن .. هل فعلا ستؤدي عمليات القاعدة لاسقاط النظم فعلا ؟ هل هي تملك بديل ؟ وما هو البديل ؟ وهل هو على طريقة افغانستان الطالبانية التي وصلت في جمودها الديني لدرجة مدمرة .. ؟ إذا كان الأمر هكذا الا يحفز هذا لأن يتحرك المهتمون لتقديم بدائل وتكنيكات عمل أكثر نضجا .. بدلا من ترك الساحة للقاعديون القدامى والجدد"
