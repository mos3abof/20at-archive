subject = "من الشمحطجى ابن برقوق الى اسامة بن لادن..ياعم حل ع"
text = "قريت البيان العجيب الى بعته اسامة بن لادن لدول اروبا<br />كلام كاروكاتيرى ومالوش اى لازمة<br />واذا كان عم اسامة بن لادن له قاعدته ... و هو حر فيها طبعاً<br />الا انه مش لازم يعنى يتكلم نيابة عن المليار مسلم الى خلقهم ربنا<br />لأن لامؤخزة كل واحد حر فى قعدته<br />وكفاية لحد كده والنبى يا عم اسامة... المشرحة مش ناقصة جثث!!!<br />و ببعتله وبقوله<br />من الشمحطجى ابن برقوق الى اسامة بن لادن..ياعم حل عن قعدتنا!!"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616051357/http://www.20at.com:80/article.php?sid=193"

