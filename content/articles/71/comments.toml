text = "المقصود بنشاط الجماعات الإسلامية..حركتها للوصول للسلطة..سواء الحركات التي تسعي للسلطة سياسيا او جهادياً..بغض النظر عن موقف الناس من هذه الجماعات.<br />...اما عن وجود دليل من السنة \"بلفظة\" الجماعات الإسلامية فلا أعرف ولكننا نتحدث عن \"المفهوم\" الثابت دائما في مطالبة من يرون الحق بتنفيذه..مع تغير المصطلحات عبر الأيام ولكن تظل المفاهيم اساسية"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616051357/http://www.20at.com:80/article.php?sid=193"

[[comments]]
order = 2
subject = "بيرو"
text = "أعتقد إن الموضوع يمكن تناوله بطريقة أخري وهي هل تري الولا يات المتحدة أي ضرر بمصالحها لو حدث وأثرت هذه العمليات الإرهابية سواء كانت للقاعدة أو غيرها من (القاعديون الجدد) علي العروش العربية , الإجابة هي ( لا )0أمريكا تريد القاعدة أن تمارس أرهابها في اوربا وباقي دول العالم -الا هي - لأن ذلك يكسبها حلفء جدد في حربها المزعومة ضد الإرهاب . أما عن الإضرار بالكراسي العربية ومن يجلسون عليها فهو هدف مشترك بين القاعدة وأمريكا . مع إختلاف الوسائل المستخدمة . أمريكا لن تقوم لإنقاذ الأنظمة العربية من أعدائها لأن عملية الإنقاذ في حد ذاتها لن تأتي بثمنها ولا ننسي أن سيطرة الإرهاب والقاعديون القدامي والجدد تعطي لأمريكا دوافع اكثر صدقا لضرب دول جديدة بحجة محاربة الإرهاب الذي سيكون سيطر وتحكم بالفعل وهذه المرة لن تجد من يعارضها مثل ما حدث في العراق ..."
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616051357/http://www.20at.com:80/article.php?sid=193"

