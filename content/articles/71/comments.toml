[[comments]]
order = 14
subject = "نحن المنتصرون ان شاء الله"
text = "بسم الله اللاحمن الرحيم<br />ان اسامة بن لادن رجل ومجاهد ومنتصر ان شاء الله على الصليبيون والصهاينة وانه انسان يدافع عن عرض المسلمون والمقدسات وهو الذي اراد هذا بنفسه فترك المال والحياة التي كان يعيشهافترك كل العز وجاء يدافع عن عن كل مسلم على وجه الارض وسينتصر هو واصحابه في كل بقعة في الارض فان العالم باسرة يبحث عنه ولكن لن يجدوه لان الله معه لانه على حق ولن يهداء له البال حتى يحرر فلسطين ويصلي في المسجد الاقصى هو ومن معه انشاء الله والله اكبر ولله الحمد والله اكبر على كل ظالم كافر على وجه الارض واريد ان احيي اهلي في فلسطين الابيه لصامدة امام الحتلال الصهيوني والله اكبر ولا ننسى يحيى عياش واحمد ياسين والاخوة المجاهدين في سبيل الله في كل مكان وكفاكم يا عرب الهزيمة في كل مكان لولا المجاهدون اين انتم وهل كنتم احياء ام تحت ا<br />الارض فان الزعماء العرب كلهم اجمعين ما عدا صدام خون لان من يقول لا لامريكا يضرب ولكن الرؤساء العرب دائما حاضر مقابل شرفنا وعرضنا لكي يهنأء الرؤساء ونموت نحن في كل مكان وزمان فالعنة والموت لامثال هؤلاء الخون مثل الرئيس المصري والسعودي والكويتي والاردني يبعون عرضهم مقابل المال والرئاسة فاليتعلمو من بن لادن والظواهري وعبد الله عزام ويحيى عياش واحمد ياسين وكل طفل في فلسطين وهو يلقي الحجارة على الصهاينة.<br />وتعلمومن المجاهدون في العراق وكل مكان في الارض ومن يقتل في سبيل اللهلن يموت لقوله تعالى \"ولا تحسبن الذين يقتلون في سبيل الله امواتا بل احياء عند ربهم يرزقون\""
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024155914/http://www.20at.com:80/article.php?sid=193"

[[comments]]
order = 15
subject = "من يقراء هذا الكلام سيموت لان حروب نووية قادمة"
text = "السلام على من تبع الهدى<br />يا أيه القارئ<br />لا تغتر بنفسك فان جميع من حولك يكرهونك ويتمنون<br />موتك ما عدا امك وابوك<br />حتى انت فانك تكره نفسك<br />ان الناس أنواع كثيرة نذكر منهااربع انواع<br />النوع الاول : يقاتل في سبيل الله<br />النوع الثاني : يقاتل في سبيل الطاقوت<br />النوع الثالث : ينتظر المنتصر لينظم اليه<br />النوع الرابع<br />ليس له دعوه حتى لواقتصبو امه<br />أو<br />قتلواأمه أمام عينيه<br />أو<br />داسو على امه بالنعال<br />أو<br />تفلو على وجه امه<br />لانهًًٌٌ طول عمره<br />جــــــبـــا ن<br />الكاتب : الموت قادم"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024155914/http://www.20at.com:80/article.php?sid=193"

