subject = "فارس الظهران"
text = "الله اكبر الله اكبر الله اكبر<br />على كل من عصى وتجبر<br />بامي انت وابي يا ابا هاجر والله ما بكيت على قريب ولا بعيد ولا حن قلبي الذي طمسته المعاصي الا بعد ان افتقدت صوتك الجهوري رحمك الله يا ابا هاجر<br />اللهم قاتل وشرد كل من ساهم في مقتله اللهم مزقهم كل ممزق وافضحهم بين الملاء هم واهاليهم اللهم عجل بنصرك<br />اللهم فك اسر ابناء عمومته عبدالله واخوانه<br />اللهم ياكريم"
