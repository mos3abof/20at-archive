subject = "نشاط الجماعات الإسلامية"
text = "ولكن يري المتابعون لنشاط الجماعات الإسلامية<br />لا يوجدعندى تعليق ةلكنه استفسار ما المقصود هنا بنشاط الجماعات الاسلامية وشكرا- مع العلم ان دين الله الحنيف وسنة سيد الخلق واشرف البشر لا يوجد بها اسم جماعة اسلامية واذا لديك دليل \" كاتب المقال\" ارجو ان تخبرنى به"
archived = "2004-06-16"
