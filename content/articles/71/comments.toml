text = "لماذا تنطوي أغلب التعليقات على موقف سلبي من اسامة بن لادن والقاعدة ؟ يا سادة افهموا أنه في ظل العجز العربي الشامل واليد المقطوعة للأنظمة العربية فإن القاعدة هي الجناح العسكري للمقهورين العرب ، مهما اختلفنا معها في توجهاتها السياسية والإسلامية ...وإلا فقدموا بديل يحررنا من ربقة الاستعباد والإهانة يرحمكم الله"
