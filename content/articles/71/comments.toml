[[comments]]
order = 9
subject = "رنين الحب"
text = "بسم الله الرحمن الرحيم<br />استاذ احمد احنا فعلا شاكرين فضلك لاثاره هذا الموضوع وفعلا القاعده بتنفى اى صله لها باى حدث مش على مزاجها وتتصدى لكل عمليه بتيجى على مزاجهاياجماعه احنا مابقيناش عارفين مين الارهابى مين الظالم وله المظلوم وله الاتنين معا. انا بس عايزه اعرف ايه اخره اللى احنافيه ده .استاذ احمد لو مستعد تروح تحارب انا هاجى معاك واللى عايز يجى ياجماعه الباب مفتوح بس هانوزع نفسينا مجموعه فى فلسطين ومجموعه فى العراق بس انا هاقف ع الحدود.<br />استاذ احمد انا اسفه ممكن يكون كلامى فيه من الهزار ما كثر ولكنى تائهه لااعرف ماهو اخر الحرب.<br />رنين الحب"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616051357/http://www.20at.com:80/article.php?sid=193"

[[comments]]
order = 10
subject = "اليمن"
text = "لو كان معسكر البتار موجود منذ القرن الماضي<br />لما وطئت أرضنا قدم أمريكي ولكان لنا هيبة واحترام<br />ولو كان جيل حماس موجود منذ أوائل القرن الماضي ماتجرأ يهودي علىالإقتراب من فلسطين ..<br />الحمدلله الذي حقق وعده \" وإن تتولوا يستبدل قوما غيركم ثم لا يكونوا أمثالكم \" فإني أرى سنة الإستبدال تجري<br />نشهد اليوم جيلا أخر لا يعرف من هي أمريكا أو قوتها أو ترسانتها العسكرية والأستخباراتية<br />جيل الحزام الناسف ، بارك الله هذا الجيل ..<br />جيل في سن العشرينيات تستوي الحياة لدية والموت<br />وفي أحايين كثير يحبون الموت أكثر من الحياة ..!"
archived = "2004-08-15"
capture_url = "https://web.archive.org/web/20040815062341/http://www.20at.com:80/article.php?sid=193"

[[comments]]
order = 11
subject = "المشكله"
text = "المشكله ان احنا عايزيين نعيش وبس مبنفكرش الا فى نفسناو متمسكين بالحياه ميهمناش اللى بيحصل فى فلسطين والعراق وافغنستان والشيشان محدش عايز يروح يحارب شويه الكلاب اللى بيقتلوا المسلمين لازم كلنا نروح نجاهد واكيد ربناهيكون معانا وينصرنا ان شاء الله لان سبب ابتلانا هو الامتناع عن الجهاد وبعدنا عن ربنا وعلشان كده ربنا بيعقبنا."
archived = "2004-08-15"
capture_url = "https://web.archive.org/web/20040815062341/http://www.20at.com:80/article.php?sid=193"

[[comments]]
order = 12
subject = "شباب العز والجهاد"
text = "وجودالقاعده دليل كبير على ان هذه الامه لن تقهر وان شبابهاالمؤمن لايخشى قوة الغرب العسكريه ومستعد لمواجهتها في كل ظرف حتى تترك ارضنا وديارنا وسيحل بها ماحل بفارس والرومان على يد المسلمينالمجاهدين فلماذا هؤلاءالمعتدون علينا وعلى ديننا لايتركوننا لحالنا وعندها ان فعلوا ذلك فلن يجدوا اذا منا اما اذااستمروا في عنجهيتهم وغطرستهم فسنواجههم بكل قوه فنحن لانخاف الا الله سبحاته وتعالى ولاتغرنا المظاهر الشكليه لأعداء امتنا وان جندوا عملاءكثر من ابناء امتنا والمنتمين اليها فالنصر قادم بأذن الله والعمل مطلوب منا كشباب متنور وغيور على دينه وأمته في مختلف المجالات وبشتى الوسائل المتاحه حتى نذيق اعداءنا الهزيمه والهوان ونجعل حياتهم رعب وقلق وخوف لايهنأون بها \"والله غالب على أمره ولكن اكثرالناس لا يعلمون \""
archived = "2004-08-15"
capture_url = "https://web.archive.org/web/20040815062341/http://www.20at.com:80/article.php?sid=193"

