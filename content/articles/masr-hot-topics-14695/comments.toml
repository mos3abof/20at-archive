author = "كل سنة وانت طيب يا"
posted = "2009-12-31"
text = "كل سنة وانت طيب يا سامح<br />وبما انك خواجة هنقول happy new year<br />يا عم سامح<br />كمصريين فى القرى نعرف الشهور الفرعونية علشان الزراعة كيهك وطوبة وامشير وبرمهات ومسرى وبشنس لاننا بنزرع على اساسها<br />والشهور العربية علشان المواسم والاعياد ورمضان وشهور الحج<br />انما يناير وفبراير وديسمبر فهذة بتاع الحكومة والخواجات اللى من اصل رومانى واغريقى واوروبى<br />كل سنة وانت طيب يا سيدى<br />بس احنا لا نحتفل بيها"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102103104/http://www.20at.com:80/masr/hot-topics/14695-2009-12-31-13-23-50.html"

