subject = "سبحان الله..محدش عاجبه حاله"
text = "اللي مش متجوزة عايزة تتجوز واللي متجوزة عايزة تخلف واللي عندها بنت عايزة ولد واللي...والحل الشيخ المبروك اللي سره باتع..عهد المعجزات انتهى بانتهاء عهد الانبياء...اهم شئ الرضا (الرضا بالمقسوم عبادة) او على راي ستي الله يرحمها(اللي ما يرضاش بقسمته عايب)"
