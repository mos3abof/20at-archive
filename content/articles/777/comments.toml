subject = "يا احلا رمضان بعمان"
author = "ريما"
posted = "2006-09-26"
text = "فتحتو علي المواجع ... فعلا احلا رمضان بعمان<br />ما في احلا من منظر البيوت المضوية بالاهلة و النجوم<br />هي اول سنة برمضن برة الاردن و بعيد عن اهلي.. و متمنية كتييييييييييييير لو اقضي هالشهر بعمان<br />عمان ما كنت بعرف اني بحبك لهدرجة<br />الله يحماكي و يتشوفي كل سنة رمضان احلى و احلى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123157/http://www.20at.com/article2.php?sid=1278"
