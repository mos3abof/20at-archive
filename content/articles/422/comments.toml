[[comments]]
order = 71
subject = "\"وإذا خاطبمهم الجاهلون قالوا سلاما\""
text = "أرجو من الإخوة المشتركين عدم الرد على كل من يحاول إثارة قضايا مفتعلة يضيع فيها الوقت بين المدح والذم وذلك لسببين:<br />1- أن الآية الكريمة تصف عباد الرحمن بأنهم \"وإذا خاطبهم الجاهلون قالوا سلاما\".<br />2- أن من يبنى لا يشغل نفسه بالهدامين، وكل ما عليه أن يفعله نحوهم هو الدعاء بالهداية.<br />3- أن من يقومون بذلك قد يكونون مدفوعين لفعل ذلك من جهات معينة تريد أن تربك الشباب وتحيرهم، وتسيء لكل نقطة ضوء تظهر فى الأفق.<br />فعفا الله عن الجميع وهدانا لما يحبه ويرضاه.<br />والسلام عليكم ورحمة الله وبركاته<br />محمد المهندس"
archived = "2004-12-06"
capture_url = "https://web.archive.org/web/20041206091929/http://www.20at.com:80/article.php?sid=714"

