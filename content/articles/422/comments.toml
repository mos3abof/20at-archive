subject = "الف الف الف الف سلامه على االداعيه الاسلامى"
text = "السلام عليكم ورحمه الله وبركاته<br />بعد التحيه:<br />الف الف الف سلامه عليك يا استاذ/ عمرو خالد<br />والله انا ماكنتيش اعرف انك حضرتك مريض وكان لازم اول ماعرفت انى ابعت لحضرتك السلام وانت والله احب الناس ليه وارجو منك ان حضرتك تتكلم مره عن الرياضه لان هى ديه الفرصه الوحيده انى كنت عاوز اقول لك كده لان انا بحب حاجه اسمها كوره<br />اخوك فى الله/ محمد النجار"
