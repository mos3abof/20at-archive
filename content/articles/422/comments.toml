text = "دعني اضحك قليلا علي من ينخرون مثل السوس في عصي سليمان حتي يثبتو انه مات طالعت يا اخي عمرو ما يريده اعداء الاسلام ان يفعلوه معك لكن لا تحزن ابدا فقد كان المنافقون ايام الرسول يتشبهون بالصحابه وهم كانو اخطر من الاعداء علي الاسلام ومثلما اقيمت الحرب من اجل الدعوه تقام الان الحرب ضدك فلا تركن ابدا مهما يكن والف سلامه عليك من كل شر اقولها لك ليس كداعيه لكن كفرد مسلم وانت اخي واريدك ان تضحك كثيرا علي من يحاربوك هم البلهاء وكما يقول الشاعر عن هولاء القوم قوم اذا صفعو بالنعال شكت النعال باي ذنب تضرب<br />محمد السيد سروه وخطيبته اسمهان عمر<br />شفاك الله"
