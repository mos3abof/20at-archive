subject = "الف سلامة يا استاذ عمرو"
text = "الف سلامة لك يااستاذ عمرو ربنا يشافيك ويعافيك ان شاء اللة<br />وجزاك الله كل خير عنا<br />وانا برضة اقول لوائل عباس وصاحبة اتقو االله هو اللي حيلبس باروكة ميش حيبقي باين علية انة لابس باروكة وبعدين انت عارف ان فية ممثلين كثيرون يلبسوا باروكة وتبقي ملاحظة قوي عليهم مهما حاولو اخفائه وبعدين الراجل عملكو اية عشان تقولو عنة كل دة<br />دة راجل بيجب دينة وعاوز يساهم في اعادة عزة الاسلام نقوم نعمل فية كدة ياريت في 100 واحد زية كان بيحب دينة كان فرق معانا كتير<br />الله هو الهادي"
archived = "2004-11-03"
capture_url = "https://web.archive.org/web/20041103003751/http://www.20at.com:80/article.php?sid=714"

