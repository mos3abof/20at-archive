[[comments]]
order = 57
subject = "لا حول و لا قوة إلا بالله العلي العظيم"
text = "الحمد لله على سلامتك أخي الكريم في الله الأستاذ عمرو خالد<br />و الحمد لله أنني استطعت حضور حلقتك بتاعة يوم الخميس و تمكنت من السلام عليك و الاطمئنان عليك...<br />و لا حول و لا قوة إلا بالله العلي العظيم....التواقيع دي بالكاد أخدت تطمن على صحتك و كل اللي يهمهم أنك حاطط باروكة و لا لأ...؟؟؟<br />أخواني في الله أحب أبشركم أن الأستاذ عمرو خالد لا تفوته هذه الأمور و لا يشعر بالخجل من شعره و لطالما حلقه أيام العمرة<br />اش معنى يحط الباروكة دلوقت...؟؟؟<br />و عشان تطمنوا أكتر و أكتر ...أنا مستعد أقسم ليكم أن الآستاذ عمرو خالد بريء من الباروكة دي...لأنني شفته و تصورت معه عن قرب...أكتر من كده عاوزين ايه...؟؟؟<br />قال باروكة قال.....ههه<br />عافاك الله استاذ عمرو و لا تؤاخذنا يا رب بما فعل السفهاء منا ...بالفعل أننا ما زلنا عرب و لا نستحق أن نكون صناع حياة...لأن ما يهمنا هذا الكشف الخطير...عمرو خالد و الباروكة...<br />لا حول و لا قوة إلا بالله العلي العظيم<br />و حسبنا الله و نعم الوكيل<br />أخوكم نوار بركات<br />nawarbarakat@hotmail.com"
archived = "2004-12-06"
capture_url = "https://web.archive.org/web/20041206091929/http://www.20at.com:80/article.php?sid=714"

