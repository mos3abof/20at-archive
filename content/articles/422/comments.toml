text = "الله اكبر و عاشت امتنا حرة عربية<br />عاش رجال الجهاد و المقاومة<br />فمريضا مريضا مريضا لم تعجبني يا عشرينات<br />لان عرفات مات بسم اسرائيلي<br />اذا<br />شهيدا شهيدا شهيدا<br />و هذا ما كان يتمناه حين يقول<br />اللهم اطعمني ان اكون احد الشهداء في سبيل القدس<br />و لمن لا يعلم ابو عمار قاد الانتفاضة من حصاره و ان لم يظهر هذا علنا...<br />فيوم استشهاد ابو عمار سيكون عيدا لا ننهار به<br />الله اكبر الله اكبر الله اكبر... لا اله إلا الله<br />الله اكبر الله اكبر الله اكبر ... و لله الحمد ..<br />الله اكبر كبيرا و الحمد لله كثيرا و سبحان الله بكرا و اصيلا ،،، لا اله إلا الله وحده ."
