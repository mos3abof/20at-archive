subject = "اخت من المغرب :حمدا لله على سلامتك اخي عمرو خالد."
text = "اخي الكريم عمرو خالد<br />باسمي و باسم الشعب المغربي كافة نقول لك:حمدا لله على سلامة ,و نبارك لك و لاسرتك الحبيبة عيد الفطر السعيد.<br />و الله انا بكيت اول ما شاهدت صورك بالمستشفى,لانك فعلا عزيز علي و على كل اسرتي.<br />كيف لا, و انت من كنت السبب في ارتدائي الحجاب,بعد مشاهدة برامجك الرمضانية بقناة اقرا الفضائية.<br />اطال الله في عمرك ,و نصرك ,و حفظ اسرتك.<br />احبك في الله."
archived = "2004-12-06"
capture_url = "https://web.archive.org/web/20041206091929/http://www.20at.com:80/article.php?sid=714"

