text = "انا عاوز اعرف هو *** صاحبك اسامة فوزي بتاع عربتايمز ازاي بيقول انه عمرو خالد بيلبس باروكة ! اهه الراجل في المستشفى يعني مش معقول هيحط الباروكة كمان في المستشفى و لا هتقولي عشانالتصوير!<br />عموما ربنا يشفي عمرو خالد من مشكلة المرارة ويشفيك يا وائل انت واسامة فوزي من مرارة المخ."
archived = "2004-11-03"
