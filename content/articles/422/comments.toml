[[comments]]
order = 80
subject = "عمرو خالد"
text = "جزاكم الله خيرا على سؤالكم عليا ودعاؤكم / أسأل الله أن يجعله في موازين حسناتكم بإذن الله<br />أنا بخير الآن وخرجت من المستشفى والحمد لله وسنواصل الدروس بإذن الله وكل سنة وانتو طيبين<br />ـــــــــــــــــــــــــــــــــــــــــــــ<br />هههههههههههههه<br />طبعن أنا مش عمرو خالد ولا حاجة بس حبيت أقول للناس اللي بيكتبو عبد السلام وخطيبته/ أم العربي / محمد الروش / ياريت تعمل برنامج عن الكفتة / هو انتو فاكرين ان دا ايميل عمرو خالد ولا ايه / دا مجرد خبر عنه / يا جماعة مش نفتح شوية :))))))<br />والله دحكتوني يا جماعة<br />وناس تانية بتتكلم عن الباروكة / باروكة ايه بس ياخوانا إذا كان الراجل شعره واقع / وإذا كان بيحلقه زيرو بعد العمره وبيطول قدام عنينا ولا كمان في باروكة صلعة :))))<br />وبعدين الراجل عامل عملية وعيان وتقولوا باروكة ؟؟؟؟<br />لاحول ولا قوة إلا بالله<br />شفاك الله وعفاك ياعمرو خالد / وجميع المسلمين ياارب / والله يهدي الناس اللي عقلها على قدها / آآآآآآآآآمين<br />لمبة محروقة"
archived = "2004-12-06"
capture_url = "https://web.archive.org/web/20041206091929/http://www.20at.com:80/article.php?sid=714"

