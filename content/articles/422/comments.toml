[[comments]]
order = 48
subject = "Paradise"
text = "أولا شفا الله أخي الأستاذ عمرو خالد وعافاه من كل سوء.. وجعل له بكل ألم رفع درجات وتكفير سيئات.. آمين<br />ثانيا يا جماعة الأستاذ عمرو خالد لم يدَّّعي انه فنان أو نجم سينما وطلب منكم انكم تحبوه عشان شكله أو شعره المسبسب!!!!<br />أظن اذا كان لابس بروكة أو الكلام دة افتراء عليه دة أمر ما يخصناش.. الكلام دة يخصنا لو احنا بنعبد عمرو خالد والعياذ بالله!!! لكن احنا ملناش عنده غير الكلام اللي بيقولهولنا.. والله شايفين انه كلام كويس اسمعوه واعملوا بيه طاعة وتقرب لله وحده.. لو مش عاجبكم يبقى كل واحد حر، ربنا مقالش اللي مش هيسمع عمرو خالد هيروح النار!!! متسمعوهوش وكفوا أذاكم عنه بالله عليكم... وحتى افتراضا انه لابس بروكة وان الموضوع دة حرام- مع اني لا أظن في أستاذي الفاضل أن يفوت عليه ذلك الأمر ان كان حراما- دي حاجة بينه وبين ربنا.. ومين فينا مالوش ذنوووووب بيعملها.. عمرو خالد يا جماعة مش رسول ولا نبي وأكيد ليه أخطاء وذنوب زينا ربنا أعلم بيها.. دة حتى الأنبياء - ماعدا رسول الله صلى الله عليه وسلم- كان لكل نبي فيهم خطأ وربنا بفضله وكرمه غفره له..<br />ياجماعة احنا في أيام عتق من النار ومن شروط اصطفاء الله لنا في ليلة القدر وعتقه لنا من النار اننا نكف عن الجدل (ولو كنا مُحقين) والنميمة والغيبة والخوض في الباطل والسخرية والاستهزاء وقول الكذب وقول الزور.. هل فينا حد مش محتاج لليلة القدر ومستغني عن فضلها؟؟ّّّ!!<br />أرجو من كل واحد قال حاجة وحشة في حق الأستاذ الفاضل عمرو خالد، وموضوع الحلال والحرام يهمه أوي لدرجة انه مش قادر يشوف الاستاذ عمرو خالد بيعمل حاجة حرام!! انه يقرأ الآيات القرآنية والأحاديث التالية عن الرسول صلى الله عليه وسلم ويحاسب نفسه قبل ما يحاسب الناس..<br />قال الله تعالى:<br />\"يَا أَيُّهَا الَّذِينَ آمَنُوا لَا يَسْخَرْ قَومٌ مِّن قَوْمٍ عَسَى أَن يَكُونُوا خَيْرًا مِّنْهُمْ\"<br />\"يَا أَيُّهَا الَّذِينَ آمَنُوا اجْتَنِبُوا كَثِيرًا مِّنَ الظَّنِّ إِنَّ بَعْضَ الظَّنِّ إِثْمٌ\" - \"وَلَا يَغْتَب بَّعْضُكُم بَعْضًا أَيُحِبُّ أَحَدُكُمْ أَن يَأْكُلَ لَحْمَ أَخِيهِ مَيْتًا فَكَرِهْتُمُوهُ وَاتَّقُوا اللَّهَ\"<br />\"مَا يَلْفِظُ مِن قَوْلٍ إِلاَّ لَدَيْهِ رَقِيبٌ عَتِيدٌ\"<br />وقال صلى الله عليه وسلم:<br />-\"كفى بالمرء اثما أن يحدِّث بكل ما سمع\"<br />-\"أعظم الناس خطايا يوم القيامة أكثرهم خوضاً في الباطل في الدنيا\"<br />-\"لا يدخل الجنة نمَّام\" النميمة هي نقل الكلام بين الناس.<br />-\"أتدرون ما الغيبة؟ ذكر أخاك بما يكره.... ان كان فيه ماتقول فقد اغتبته وان لم يكن فيه فقد بهته\"<br />-\"من علامات الساعة انتشار الكذب\"<br />-\"من كان يؤمن بالله واليوم الآخر فليقل خيرا أو ليصمت\"<br />-\"هل يكب الناس على وجوههم في النار إلا حصائد ألسنتهم\"<br />-\"ان الرجل ليقل الكلمة ليضحك جلساءه يهوي بها ما بين المشرق و المغرب\"<br />-\"أنا زعيمٌ بيتٍ في ربض الجنة لمن يترك الجدل وان كان محقا، وبيت في وسط الجنة لمن ترك الكذب وإن كان مازحا، وبيت في أعلى الجنة لمن حسن خلقه\"<br />ولا تنسوا: \"من حمى مؤمنا من منافق يغتابه بعث الله تعالى اليه ملكا يحمي لحمه يوم القيامة من نار جهنم\" و \"من نصر أخاه بظهر الغيب نصره الله في الدنيا والآخرة\"<br />فانصروه بدلاً من أن تغتابوه..<br />ومن كان منكم مؤمنا بالله واليوم الآخر \"فليقل خيراً أو ليصمت\"<br />أعتذر للاطالة..<br />أختكم في الله"
archived = "2004-12-06"
capture_url = "https://web.archive.org/web/20041206091929/http://www.20at.com:80/article.php?sid=714"

