text = "أولا أنا أول مرة أراسل الموقع وأنا سعيد جداً بالموقع الذى يعرف أصحابه جيدا كيف يخاطبون الطائفة الأكبر من شباب هذا العصر وكيف يعالجون قضايا الشباب بطريقة دينية شبابية معتدلة<br />وثانيا لن أقول ألف سلامة يا أستاذ عمرو لأن الأستاذ عمرو خالد مش أى شخص وإنما أقول مليار و200مليون سلامة يا أستاذ عمرو خالد بعدد كل المسلمين<br />وثالثا أنا مش أسامة فوزى المقصود فى التعليق الأول بالصفحة"
