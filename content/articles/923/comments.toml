subject = "صياغة دكية... و قارء جاهل"
author = "الحزنوي"
posted = "2006-07-03"
text = "kuki أدا كنت رافضي فذالك أمر يهمك و ستحاسب عليه . أما و تتحدث عن الرسول صلى الله عليه و سلم و تقول أنه سيقف الى جانب عباد الصليب فهدا مفظ الى الكفر المهم أود أن أشيد بالموضوع فالكاتب أو الكاتبة التزم بالحياد و أظهر إمكانيات رائعة و أدعوا له أو لها بالتوفيق و يا رب يخلي كل شباب المسلمين مبدعين كل واحد في المجال اللي يفيد به اخوانه<br />و السلام على من اتبع الهدى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125130/http://www.20at.com/article2.php?sid=987"

