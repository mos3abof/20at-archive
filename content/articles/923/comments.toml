[[comments]]
order = 6
subject = "لبنان"
author = "علي"
posted = "2006-06-27"
text = "اريد ان اقول ان اشرف شعب خلقه الله هم الشيعة لأنهم يحبون النبي محمد و ابنته و أحفاده من الامام علي (ع)<br />و من يقتل الشيعة مثل المجرم الزرقاوي الذي نال جزاءه هو في حضيض النار و سوف ينال مناله كل من هو في دربه<br />ان الشيعة في لبنان هم من قاوموا اسرائيل و استشهدوا خلال مقاومتهم اما القاعدة و صعاليقها فقد قتلت مسلمين و عراقيين اكثر من الامريكيين<br />ويل لهذه الجماعة من سخط الله و رسوله فهم في منزلة يزيد و معاوية و الشمر الذين قتلوا الحسين و خربوا الاسلام<br />اخيرا انا شيعي و افتخر بهذا و اردت ان ابدي رأيي كي يدرك الكثيرين مدى حماقة و كفر القاعدة و محاربتها لأنها أخطر من اسرائيل نفسها بغدرها و قساوة قلبها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125130/http://www.20at.com/article2.php?sid=987"

[[comments]]
order = 7
subject = "آمين"
author = "رائد بغدادي"
posted = "2006-07-02"
text = "بسم الله الرحمن الرحيم<br />الحمد الله رب العالمين .الرحمن<br />الرحيم.ملك يوم الدين.أياك نعبد وأياك نستعين . أهدنا الصراط المستقيم . صراط الذين أنعمت عليهم غير المغضوب عليهم ولا الضالين ))<br />صدق الله العظيم<br />على أرواح كل من قدم نفسه فداء لنصرة الله ورسوله تغمدهم الله فسيح جناته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125130/http://www.20at.com/article2.php?sid=987"

[[comments]]
order = 8
subject = "اخرون منسيون"
author = "عبد الله"
posted = "2006-07-03"
text = "بسم الله الرحمن الرحيم<br />الله اكبر الله اكبر<br />اللهم سدد الرمى وثبت الخطى<br />\"انهم فتيه امنوا بربهم فزدناهم هدى\"<br />اما بعد<br />فقد نسيتم نعى اسد الاسلام الشيخ اسامه بن لادن للامير محمد عطا والذى نعاه فى اكثر من موقع وهو الاخ الفاضل منفذ و مخطط لغزوه نيويورك و واشنطن \"غزوه منهاتن\"وهو المهندس الحائز على شهاده الدكتورام من المانيا حتى لا ينعته الحمقى بانه كان انسان جاهل<br />ونعى الشيخ المجاهد ابى مصعب الزرقاوى نحسبه عند الله شهيدا ولا نزكيه على الله للشيخ المجاهد ابو انس الشامى الذى استشهد اثناء ذهابه الى سجن ابو غريب لتحرير الاخوات الاسيرات فيه من الامريكان<br />ونعى الشيخ عمر حديد الذى نعاه الشيخ ابى مصعب الزرقاوى وهو القائد الذى دافع عن الفلوجه اثناء اقتحام القوات الامريكيه لها واستهد اثناء الدفاع عنها<br />ولكل هؤلاء نقول لهم من شعر الشيخ اسامه بن لادن<br />إني لأشهد أنهم من كل بتار أحدّ<br />يا طالما خاضوا الصعاب وطالما صالوا وشدوا<br />شتان، شتان بين الذين لربهم باعوا النفوسا<br />الباسمين إلى الردى والسيف يرمقهم عبوسا<br />الناصبين صدورهم من دون دعوتهم تروسا<br />إن أطبقت سدف الظلام وعضنا ناب أكول<br />وديارنا طفحت دما ومضى بها الباغي يصول<br />ومن الميادين اختفت لُمع الأسنة والخيول<br />وعلت على الأنات أنغام المعازف والطبول<br />هبت عواصفهم تدك صروحه وله تقول<br />لن نوقف الغارات حتى عن مرابعنا تزول<br />وان اخر دعوانا ان الحمد لله رب العامين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125130/http://www.20at.com/article2.php?sid=987"

