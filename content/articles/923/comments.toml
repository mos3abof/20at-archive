subject = "لعنة الله على القوم الظالمين"
author = "kuki"
posted = "2006-06-25"
text = "اي مجاهدون تتحدثون عنهم واي جهاد لو كان الرسول العظيم ( ص ) موجود كان اول من قاتله وحاربه هؤلاء الشرذمة المنتمين للأسلام لعنة الله عليهم وعلى من يؤيدهم ومن يواليهم قتلة الاطفال وسفاكو الدماء التي حرمها الله هؤلاء اول من يحاسب يوم القيامه على افعالهم الاجراميه والخداعة لبعض النفوس المريضة والقذرة اكرر لعنة الله على القوم الظالمين ( ويمكرون ويمكر الله والله خير الماكرين )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125130/http://www.20at.com/article2.php?sid=987"

