subject = "دخن برسيييييم"
text = "فيينا - خدمة قدس برس<br />بدلا من سجائر التبغ والنيكوتين الضارة بالصحة، ينصح الخبراء في الهند, بتدخين سجائر الأعشاب التي تقوي الذاكرة وتزيد الذكاء.<br />فقد وجد الباحثون المختصون في العلاج بتقنية \"آيورفيدا\" الهندية القديمة, أن الاستنشاق الدوري لسجائر الأعشاب ينشط الذاكرة ويرفع معدل الذكاء والاستيعاب والتركيز, ويحمي البصر, ويمنع الإصابة بالأمراض التنفسية, وخصوصا تلك التي تصيب الأنف والجيوب الهوائية.<br />وأوضح الباحثون أن تدخين سجائر النيكوتين ضار جدا بالقلب والشرايين ويزيد خطر تشكل الأورام السرطانية في الرئتين, بعكس سجائر الأعشاب الخالية من هذه المادة المؤذية، لأنها تحتوي على مكونات عشبية طبيعية كالقرنفل والبرسيم والقرفة والحبق أو الريحان وعرق السوس وأعشاب أخرى تملك خصائص وقائية فعالة كالكركم.<br />ونبه الخبراء إلى أن هذا النوع من السجائر الطبيعية يزيد الشهية ويفيد في تقليل التهاب القصبات والجيوب التنفسية, ويرفع المعنويات ويحسن المزاج وييزيد نشاط الجسم, كما يساعد في الإقلاع عن التدخين والتخلص من إدمان التبغ.<br />وحسب تقديرات منظمة الصحة العالمية، فان أكثر من 500 ألف شخص يموتون سنويا بسبب تدخين التبغ, ومن المتوقع أن يزداد هذا العدد إلى 10 مليون عام 2030 إذا ما بقي هذا التوجه قائما."
archived = "2004-08-04"
capture_url = "https://web.archive.org/web/20040804130619/http://www.20at.com:80/article.php?sid=487"

