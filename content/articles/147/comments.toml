subject = "بيرو"
text = "بنكتب شعر ليه يا تري ...؟؟؟<br />بنكتب شعر لأن القضية عندنا منتهية..<br />مؤمنين بيها<br />مبدأ من مبادئنا<br />بنكتب شعر لأن الموضوع بجانب أنه يعتمد بشكل أساسي علي الفتاوي .....<br />إلا أنه محتاج لقلب وعقل يوزنوا الموضوع ...<br />ده الكلام اللي أنا قلته في الأول ....ولا زلت مصر عليه...<br />يا جماعة أناكتبت القصيدة لأني موش عايز أرد(!!!)<br />او بمعني أصح ردي موش هيبقي موضوعي وهيزعل الناس مني (!!!!)<br />يا جماعة الموضوعية شيء جميل جدا<br />والديموقراطية شيء أحلي ...<br />ولما علموني أول درس في الديموقراطية كان أحترام الآخر ...<br />وأنا بأحترم الأخ فلسطيني جدا ...<br />واشعر أني أحبه(!!!!)<br />صاحب رأي مختلف وباحث قوي ولديه تدفق فكري هائل ....<br />حفظه الله ...<br />إلا أني أجد نفسي مغلقة تجاه الدخول في هذا الحوار ...<br />لا أدري لماذا....<br />قد يكون جهل مني ...أو إحساس بالنقص ...أو عدم قدرة علي جمع الأدلة..<br />السبب ليس مهما ...<br />المهم اني اعلن إنسحابي من هذه المناقشة لعدم قدرتي علي التحمل ...<br />اخ فلسطيني ...جزاك الله خيرا ...<br />نلقاك في حوارات أخري ....وسيواصل الأخ مصعب الخير الحديث معك بأسم الحلف الإليكتروني الفظيع ...<br />اما أنا فذاهب لبيتنا أنام ....(!!!!!!)"
archived = "2004-08-04"
capture_url = "https://web.archive.org/web/20040804130619/http://www.20at.com:80/article.php?sid=487"
