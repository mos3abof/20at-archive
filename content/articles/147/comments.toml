subject = "بيرو....نكتة موش بذيئة"
text = "صاحب شركة ملبورو...ومعاه صاحب شركة أل أم ....ومعاهم صاحب الشرقية للدخان....اتلاتة قاعدين سوا .....<br />بتاع ملبورو قال :....بصراحة يا جماعة انا هعترف ..... أحنا بنحط في السجاير بتاعتنا 90% تبغ والباقي نشارة خشب...(!)<br />بتاع ال أم رد : ..... أما احنا فبمنتهي الصراحة بنحط 80% تبغ والباقي نشارة (!!)<br />بص بتاع الشرقية للدخان يمين وشمال وقال بصوت واطي ....: لا مؤخاذة يا رجالة ....يعني ايه تبغ (!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!)"
archived = "2004-08-04"
