subject = "برنامج اسلامي عربي هادف"
author = "رائد"
posted = "2006-04-11"
text = "موضوع في وقته المطلوب ولا ارى سببا في هذا الهجوم الغريب على فكرة الموضوع فهو في النهاية واقع ولمن رات انها مخنوقة وزعلانة من الموقع بالله عليك اقراي التعليقات على الموضوعات الاخرى لتعرفي انها جميعا مرتبطة بالبرنامج، بالعكس انني ارى انه توقيت متميز بعد الانتهاء من الدورة وكل ما فيها<br />اما عن نوعية البرنامج الجيد المطلوب فلا مانع ان يهدف البرنامج الى اثراء الشباب بالفضائل والتسابق في الجوانب الايجابية بعيدا عن الاباحية المغرضة في البرنامج الحالي ولماذا لانجمل حياتنا ونجذب الشباب بطريقتهم المفضلة الى فضائل الاسلام وقيمه"
