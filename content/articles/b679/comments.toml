[[comments]]
order = 0
subject = "الله ربى"
author = "مسلمه"
posted = "2006-04-09"
text = "اعتقد ان الحق مش على الشباب لوحده انا اعرف \"ستات\" كبار كتييير بيموتو فى البرنامج ده<br />تخيل لما ام او اب يعمل كده امام اولاده طبيعى الشباب يتعلقوا اكتر بالبرامج دى<br />الحقيقه كتير من شبابنا افتقد القدوه فى المنزل اوحتى العيله<br />مره سالت واحده اتعرفت عليها انتى ليه بتكلمى شباب من ورا مامتك واحنا فى كليه البنات؟؟؟؟<br />جاوبتنى وقالتلى ايه يعنى مهى ماما عندها اصحاب وبتروح معاهم رحلات \"اصحاب ستات ورجاله\"<br />اين الام الواعيه والاب المرشد الحازم؟؟؟<br />اين الاسره والمجتمع المسلم؟؟؟؟<br />كله راح -ده كان زمان متعقديش الدنيا- خليكى فرى - ده اللى بيتقال دلوقتى<br />اللهم اهدى شباب المسلمين اللهم اهدى فتيات المسلمين<br />اللهم اهدى ولاة امور المسلمين<br />اللهم ردنا الى دينك مردا جميلا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

[[comments]]
order = 1
subject = "حسبنا الله ونعم الوكيل"
author = "أحمد"
posted = "2006-04-09"
text = "السلام عليكم<br />احب ان اقول لإخوانى ان نكثف الدعاء لجميع المسلمين لأن يهديهم الله سبحانه وتعالى<br />ويبعدهم عن مثل هذه البرامج المدمرة<br />وأن يردهم إلى دينه ردا حميدا<br />وجزاكم الله خيرا جميعا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

