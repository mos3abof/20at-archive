text = "انا بحب اوى اوى استار اكاديمى<br />بجد برنامج روعة روعة روعة من كل ناحية وانا بمووت فية وصحباتى كمان<br />هو برنامج لذيذ ووللهى العظيم مافية اى تجاوزات وفعلا احنا عايشين كدا حاليا<br />هو فية كل حاجة حلوة وبيعيشو سوا وكل تدريباتهم جميلة اوى"
