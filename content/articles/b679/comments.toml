[[comments]]
order = 13
subject = "تجديد في طريقة التقديم"
author = "virus"
posted = "2006-04-10"
text = "مبحبش القواعد المعممة يعني منطلقش قاعدة عامة ونتكلم على اساسها .. الشباب مش بينجذب غير للنوع ده م البرامج \"ده كلام غلط\" مهو الشباب انجذب لبرامج عمرو خالد وهو مش بيدعو للانحلال اكيد .. الفكرة ان اللى مش عاجبه البرنامج يفكر ازاي يستميل الشباب او الجمهور لبرنامج انجح واكثر جاذبية انا مش مع ستار اكاديمي فى حاجات بس نتكلم على صراحة؟؟ هو فعلا من انجح البرامج واللى عملوه تعبوا فيه .. لو تعبنا فى برنامج كويس اكيد هنلاقي مش نبقى بيج بق وخلاص .. ونجعجع ع الفاضي ..<br />وبالمناسبة بقى .. فكرة الموضوع حلوة يا عشرينات بس المعالجة مش حلوة .. زهقنا من المواضيع اللى فلان بيقول وعلان قال وانتهى الموضوع على كدة عايزين تجديد في طريقة التقديم<br />عايزين تجديد في طريقة التقديم<br />عايزين تجديد في طريقة التقديم<br />عايزين تجديد في طريقة التقديم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

