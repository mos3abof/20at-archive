subject = "في ايه ؟؟"
author = "هبابه او هوبه او هبهوب"
posted = "2006-04-10"
text = "ايه الديمقراطيه اللي حطت علي الموقع دا<br />بقي نطلب منكو شعر وقصص قصيره ترحوا تكتبوا علي شادي وفادي ؟؟؟؟؟ وكلنا عارفين اللي حتطلع تحب في شادي وفادي بتاعها دا ايه ياموقع ؟؟؟ لاه وجيبين التعليقات بالنص في اول سطرين انا اتنرفزت بصراحه .وعايزين برنامج ايه بقي ان شاء الله تاني اللي يجدب الجمهور ؟؟؟ الجمهور مش حينجدب غير للنوعيه دي من البرامج . بس عشان انا دلوقتي بقيت سوسه المفروسه بجد."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

[[comments]]
order = 11
subject = "ليه ديما بنبعد عن الواقع"
author = "مرزوق"
posted = "2006-04-10"
text = "السلام عليكم ورحمة الله وبركاته<br />اعتقد ان سبب نجاح البرنامج يكون نتيجة احباط كلى للشباب من المستقبل يعنى البنات الى بتتفرج على البرنامج اكيد شيفة ان واحد من شباب البرنامج ينفع يكون جوزها او ان الصوت الى بيدربوا عليه ينفعها او الرجيم كمان<br />بس ياترى ليه همه فى الاساس حطوا البرنامج فى دمغهم وتبعوه اعتقد ان السبب فى الفراغ التام و الاحباط اعتقد لو ان كل واحد من الى بيتفرجوا على البرنامج وبيتبعوه اعد مع نفسه فى اخر كل يوم يشوف هوه افاد نفسه بئيه او حتا عمل حسنة فى الدنيا تنفعه فى الاخرة اعتقد انه مش هيلقى .<br />انا مش جى انكد على حد ولكن جى اقول مهوا لما نيجى نقول الغرب متقدم علينا نقول مهوا طبعا لزم يتقدم مهوا لما احنا بنتفرج على برنامج ذى ده لا بيفيد حد بمعلومة وله بقيمة اخلاقية وله بمعلومة دينيه يبقى لزم الغرب يتقدم علينا<br />ولما نيجى ندور على شغل اكيد مش هنلاقى لئن معلومتنا لا تتعدى برامج التلفزيون<br />وله تخيلوا بقى ان الشباب الى بيتفرجوا على البرنامج ده حبوا يعملوا مشروع اكيد اخر حاجة يفكروا فيها نعمل شريط كست<br />او فيديوا كليب<br />ولو جينا من النحيه الدينيه هنلاقى ان ينهار ايه الى احنا بنشوفه ده الولد بيحضن البنت ولا كئنها مراته لا وكلهم مع بعض فى نفس البيت وبيكلوا وبيشربوا ويناموا مع بعض ولا كئن سيدنا محمد جه ولا كئن كان فيه اسلام ولا كان فيه انبياء تحرم الخلوة و الاختلاط .ومش عاوز اقول اكتر من كده عشان الرقابة<br />ياجماعة ياريت نصحا انفسنا ونشوف بطريقتنا ديه ان احنا نتبع كل موضه جديده واى حاجة مش هقول تفه ولكن اى حاجة متعدش علينا بنفع ياترى ممكن السكة ديه تودينا لفين هل لتقدم العرب و تماسك الوحدة العربية وان يكون لينا فعلا وجود فى العالم وله هتودينا الى سكت الهبوط فعلا بئقصى درجة الى درجات التخلف والبعد كل البعد عن العالم المتقدم واسلامنا ودينا<br />واسف على الاطالة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

