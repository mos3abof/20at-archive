posted = "2006-06-09"
text = "اناشابة وليس مع طرف ضدد طرف ولكن مين رأى ان نستفيد من كل حماس الشباب دة نشوف أى المواضيع التى تهم شبابناانا لست واصية أو معلمة أنا واحدة منكم أناوظيفتى معدة برامج تعلوا نتشارك ونصنع برنامج ثقافى يفيد الشباب بدل من أى برنامج تافهو فى نفس الوقت يكون برنامج متنوع يقدر يوصل لكل الشباب مهما كان تفكرهم أنا عرفة أنه صعب بس نحاول و من يستطيع المساعدة يرسل لى على ال mail marmar-83@hotmail.com اتمنى ان اكون ضيفة خفيفة"
