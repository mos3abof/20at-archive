subject = "نحترم التجديد"
author = "محمد الشامى."
posted = "2006-04-12"
text = "خلونا الأول نعترف ان البرنامج ناجح بكل المقاييس و لو ماكنش ناجح ماكانتش الأستاذه يسر كتبت عنه موضوع و الناس دي كلها كتبت تعليقات عليه... صح ولآ انا غلطان؟ فكرة البرنامج جديده و ده لازم نحترمه و كمان مدى الحريات اللى فى البرنامج و بالأخص بين الولاد و البنات برضه جديده علينا كعرب سواء مسلمين أو مسيحيين..ده مش معناه اننى حابب البرنامج!! لأ خالص بس أنا مع virus لما قال ان البرنامج في ناس تعبت عشان تعمله وتجدد في الأفكار. فكرة البرنامج حلوه بس لو اى حد فكر دقيقه واحده بس هو استفاد ايه لنفسه أو للأسلام او المسلمين من البرنامج... بخخخخخخ هوااااا مفيش اي استفاده خاااالص. ياريت نفكر في افكار برضه تكون جديده ونلاقى ناس تتعب فى أفكار و ناس تانيه تتعب فى تنفيذها و نبطل نقول ده حلو لأ لأ لأ ده وحش خالص من غير ماللى يقول حلو يقولنا قال حلو ليه و هو استفاد ايه أو اللى قال وحش يقولنا نعمل ازاى حاجه حلوه نفيد الناس بيها. بس فى ملحوظه مهمه جدا لازم ناخد بالنا منها وهى ان الفراغ و الفضا لو استمرو هايعملو فينا بلاوى اكتر من كدة بكتير, و على رأى المثل \"ادينى فالهايف و انا احبك يا فننسسس\""
