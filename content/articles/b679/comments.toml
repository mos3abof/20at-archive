subject = "إنت شايف حاجة أصلاً؟!"
author = "Apple"
posted = "2006-05-04"
text = "عاريات إيه يا عم؟؟؟<br />بذمتك ودينك إنت شايف حاجة؟؟؟!<br />إلا إذا كان نظر حضرتك وهمي زي سوبرمان كده وبتدقق في الحاجات دي.<br />وبالنسبة للصور في الموقع عامة فلو تلاحظ إن الصور بصراحة أكتر حاجة بياخدوا بالهم منها... يعني ميكونش في أي صورة فيها بنات لابسة نص كم حتى... وبصراحة إختيار الصور ده أحلى حاجة في الموقع...<br />أما عن البرنامج فأنا بصراحة مبحبش أتابعه طبعاً، لكن أنا عارفة إن في ناس كتير بيحبوه ودي بيخليني أفكر ليه منعرفش نجذبهم لبرامج هادفة وكويسة بنفس طريقة ستار أكاديمي...<br />أكيد لازم على الأقل نتعلم من الفكرة مش نبص في المضمون.<br />وشكراً ليسر على الموضوع... اللي كان مجرد عرض لصورة واقعية مؤسفة للإحنا وصلناله من هيافة وهبل."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

[[comments]]
order = 34
subject = "عشان كده"
author = "ابراهيم"
posted = "2006-05-06"
text = "عشان كده احنا شعب مركوب حكامه راكبينه واعدائه راكبينه ومعلش عشان شبابنا بيحب يتركب ... بص شوف تفاعل شبابنا مع برنامج ستار اكادمي وتفاعلهم مع قضايا بلدانهم اللى متمس حياتهم كلها من اولها لاخرها الطوارئ في مصر الفتنة في لبنان الدكتاتورية في سوريا و كل البلاد العربية الحصار في فلسطين<br />اتفرج على شباب العرب تعرف على طول احنا مركوبين ليه لان ده شباب عاوز يتركب<br />نحن شعوب يأنف منها العار ويخجل منها العيب ...<br />لا ذنب لنا ..<br />لا ذنب لنا ..<br />نحن الذنب .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

[[comments]]
order = 35
subject = "Oh Allah, guide us to the right path"
author = "Eslam"
posted = "2006-05-08"
text = "Dear Brothers and sisters,<br />commenting on that star academy issue, I won't deny that I used to watch the first episode of it, but just because of the free time which most of the youth all around the arab world are suffering from now, anyway; after being here in the U.S. I figured that life is measured by the breathes you take in your life time, we need to get the best use of our breath in order to catch up with other nations, imagine if we took all the millions and millions of money thet we waste on such a trash program like star academy and started using it to do good for our nation, I just can't believe a sane person to say such a thing like what I read in the previous comments, I was so shocked, please people look around you, open you holy book (Qur'an or even the bible) and see for yourselves what you should do.<br />May allah guide us all and protect,<br />I ask you guys to pray for me,<br />thanks"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

[[comments]]
order = 36
subject = "هل من بديل"
author = "علي أيمن"
posted = "2006-05-14"
text = "المطلوب بديل يجذب الشباب بدل النوح واللعنات ونظرية المؤامرة حول الأسلام<br />الحقيقية هي ان ما نراه في الشارع وفي المجتمع وفي مدراسنا واعمالنا وبيوتنا من ضغوط وروتين او تجاوزات قد قدم هذا البرنامج مخرج وهو وضهم في حلم \"جميل من ومهة نظرهم\" فيه كل الحواجز والقيود مرفوعه فلبرنامج يحاكي مجتمع غربي بألسن عربية او متعربة لكثرة تداخل الألسن في بين الضيوف والممثلين بالبرنامج. البرنامج بأختصار هروب من الواقع لواقع مفترض ولو آمنا بأنه غير صحيح او تمثيل فهو على الأقل حلم لذيذ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

[[comments]]
order = 37
subject = "امر مهم"
author = "سعيد الجزائري"
posted = "2006-05-20"
text = "بسم الله و الصلاة والسلام على افضل خلق الله<br />السلام عليكم و رحمة الله<br />اول سؤال بادرت بطرحه عند اكتشافي لهدا البرنامج هو كيف ترك كل هؤلاء ما وراءهم من واجبات و امورهم الخاصة حتى ...و يمكثون لمدة شهر على اقل تقدير داخل....<br />يكفينا النظر الى ما يحدث من باب الوقت لنقول لهؤلاء وهؤلاءُ؛ قال ابو هريرةرضي الله عنهًَ{الوقت انفس ما عنيت بحفضه و اراه اسهل ما عليك يضيعِِِّ) فاتقو الله في وقتكم فانتم مسؤولون عنه (...عن وقته ماداعمل فيه...) فحياة المسلم كل متكامل من عمل- عبادة- طلب علم - رياضة وترفيه لائق غيرمخل بالاخلاق و لا قاتل للهمم...<br />الله اسال لي ولكل المسلمين الهدى والتقى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

