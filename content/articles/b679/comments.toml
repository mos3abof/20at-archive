[[comments]]
order = 4
subject = "بحبوووووو"
author = "مروة"
posted = "2006-04-09"
text = "مساءالخير<br />مفيش احلى من برنامج استار اكاديمى فى كل الوطن العربى فعلا<br />لانة برنامج شبابى رائع لا اكتر من رائع كمان<br />عارفين بامانة حفلة واحدة من البرايم احسن 100 مرة من حفلات كبار المغنيين فى كل مكان<br />فعلا برنامج اكتر من رائع<br />انا كنت معجبة جدا بفادى انا وبنات كتير لانة امور اوى وجذاب مووت<br />لكن بعد ماخرج بقى املى فى جوزيف ( مع انى اصلا مصرية ) لكن انا معنديش حتة التعصب دى عشان كدا مش كنت بشجع هانى<br />بشجع زوووووووزووووووو<br />اى جوزيف لانة رااااائع<br />صوت الجبل فعلا هو اللى مخلى طعم للاكاديمية<br />واللهى لو كان هانى فاز ليبقى ظلم لان صوتة وحش فعلا<br />اما زوزو فصوتة اكتر من رائع<br />اخيرا مبروووووووك جوزيف لانك بتستحق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

[[comments]]
order = 5
subject = "ثقافة قطيع الاغنام مرة اخرى"
author = "عبدالله مفتاح"
posted = "2006-04-09"
text = "دي نتيجة لثقافة قطيع الاغنام اللي منتشرة في مجتمعنا اللي كنت كلمتكم عليها زمان وهي السير خلف كل ما هو اوروبي اما اعتقادا بانه مجتمع كله خير واما للجهل او التظاهر بالجهل بان بعض الامور لا تناسب مجتمعنا<br />ولكن في حاجه عايز اقولها كون ان ستار اكاديمي برنامج ناجح ده مش بسبب انه برنامج بناء او بيقدم فكرة كويسه<br />البرنامج هدام وبيقدم فكرة سيئه لا جدال في هذا<br />نجاح البرنامج في مجتمعنا دليل كبير جدا على سيطرة الهيافه على مجتمعنا لان لو المجتمع مش هايف كان سينظر الى البرنامج نظرة احتقار ولن يجد من يتابعه<br />وكل سنه واوروبا طيبه وهنيئا للقناة اللبنانيه الملايين المدفوعه من جيوب الهايفيين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

[[comments]]
order = 6
subject = "كلاكيت تاني مرة (لو كان النبي معنا)"
author = "محمد الشاذلي (المفروس)"
posted = "2006-04-09"
text = "المكان : الوطن العربي<br />الزمان : القرن العشرين<br />الحدث : استار اكاديمي<br />ضيوف الحدث : الرسول صلى الله عليه وسلم<br />وكبار الصحابة<br />النتيجة : فوز (اي حد) بمسابقة اهيف<br />شاب ويسلم الرسول صلى الله<br />عليه وسلم الجائزة للفائز<br />ويحث الخاسرين على الاجتهاد<br />العام القادم للفوز ويدعو<br />كل الشباب للتميز مثل هذا<br />الشاب .<br />هل تعتقدون ان لو كان الرسول بيننا هل سيحدث هذا ؟؟؟؟ اعتقد ....لا لا لا لا ... انا على يقين انه سيدعو لهم بالهدايه ان لم يدعو عليهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

[[comments]]
order = 7
subject = "حراام عليكو"
author = "ايمان"
posted = "2006-04-10"
text = "السلام يا جماعة...<br />للاسف الشديد هناك مجموعةكبيرة كتير من الشباب المسلم من شباب امة الاسلام من اتباع الرسوووول عليه الصلاة والسلام .... يتابعون هذه البرامج بشغف ولا يهمهم باللي بصير بالاسلام...<br />ولكن انا اجد انه يوجد امل لان هناك الكثيير من شباب وبنات الاسلام مهتمون بالاسلام و بللي بصير بالمسلمين...<br />فسيبقى الخير في امة محمد(ص) الى يوم القيامة...<br />يا شباب اللي داير على التفاهات والمسخرة ,... فيقوا ...د الرسول بكى لانه مشتاق لنا...لنا نحن الذين اامنا به ولم نره....حرااام عليكوا..هل اذا علم الرسول(ص) بللي بصير بالمسلمين...هل تعتقدون انه سيبكي شوق لنا!!!!!!<br />مذا ستقولون للرسول يوم القيامة..مذا ستقولون لله !!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

[[comments]]
order = 8
subject = "بالعكس"
author = "مصرى"
posted = "2006-04-10"
text = "مالكم فية اية ؟؟؟<br />ايوة برنامج جاى من اوروبا لكنة برنامج جميل وشبابى والدليل اغلب الشباب بتحبة وبتعشقة كمان<br />وهو مش بيتجاوز الحدود وبيناقش حاجات جميلة اوى فيها اية لما نحبة ؟؟؟<br />والنبى شوية المعقدين اللى فوق واللى عايشين من ايام القرن ال18 بلاش تعليقاتهم احسن<br />لانها زى قلتها فعلا<br />لكن هذا البرنامج لذيذ وفعلا خسارة انة خلص بس انشاءاللة يبتدى الجذء ال4 بسرعة<br />لاننا على نار<br />ومبروك ليك ياجوزيف يابطل الاكاديمية"
