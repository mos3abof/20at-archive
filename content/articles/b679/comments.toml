text = "بصراحة خسارة كتير لما نشوف كل هالاعجاب بهيك برنامج هابط مع كل الاحترام للجميع ... والسبب ببساطة هو حب فضول من كلا الجنسين ليشوف طبيعة حياة الجنس الاخر اليومية واتحدى لو في هذا البرنامج اي نوع من الثقافة والفن .. بل برأيي هو هدم لمعنى الفن والاخلاق والواقعية ... وسامحوني هذا كله مخطط اله ومش معمول عبث .. واتمنى تكونوا بتحبوا تلفزيون الواقع الفلسطيني والعراقي وتلفزيون الاسلام في كل مكان متل ما تحرصوا على ستار اكاديمي ... وربنا يهدي الجميع ويجنبنا الفواحش ما ظهر منها وما بطن"
