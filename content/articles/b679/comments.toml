author = "أدهم و جميلة"
posted = "2006-04-11"
text = "الدنيا فيها الحلو و الوحش , وبنى أدم ليه عقل بيفكر ويميز ويقرر ويعرف الصح من الغلط .<br />طبعا برنامج شيطان اكاديمى دة مش صح خالـــــص ,<br />علشان كلنا عارفين انه مش ناقص غير حاجة واحدة بس يصوروها بين الولاد والبنات.<br />سبحـــــان الله ... ومعظم المسلمين متبعين البرنامج كويس ومبهورين بيه (طبعا لما له من اهمية بالغة فى حياة الفرد والمجتمع) .<br />واحد صاحبى كان بيقولى ان والدتة متابعة البرنامج ومعجبة بيه , طبعا اكيد هيستناه ويتفرج عليه مع ماما وبابا , كدة بقى القدوة فين ؟؟؟؟؟ بصراحة لية حق الانتشار.<br />مش بعيد يكون كاتب الموضوع نفسة متابع البرنامج بل ومن اشد المعجبين بيه واتحدى!!!!!!!!!!!!!<br />ياريت نحاول نفكر ما هى اهمية هذا البرنامج بالنسبة لك ولاهل بيتك (يا مسلم) ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />وربنا يهدينا جميعا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

