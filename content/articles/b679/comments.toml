text = "اعشق استار اكاديمى اوى<br />وزعلانة جدا انة خلص<br />كان نفسى يبقى علىطول او يقعد فترة اكبر من كدا<br />مبروك ليك ياجوزيف مع انى مصرية بس انت تستاهل لانك احسن من هانى يووووة بكتير"
