author = "ما من بلية دهت الاسلام والمسلمين في تاريخنا الحديث الا كان وراءها ال سعود أو هم المحرك الرئيس من خلف الكواليس ، وأظنهم قرن الشيطان المعنى في حديث النبي -صلى الله عليه وسلم- في الحديث الذي دعافيه للشام واليمن ، وأبى أن يدعو لنجد."
posted = "2006-04-11"
text = "وهذا البرنامج -استار اكاديمي - انما ينتج باموال ال سعود -المسروقة من قوت شعب الحرمين المسكين- وفي قناة ال سعود -ال بي سي - والهدف منه الهاء الشباب فيما لايجدي ولا ينفع ، وصرفهم عن معالي الامور ؛ حتى يكون أمل الشاب أو الشابة أن يكون مغنيا أو مغنية ،يسلي أو تسلى المجرمين أمثال ال سعود."
