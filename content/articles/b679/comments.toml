[[comments]]
order = 26
subject = "أعتصام من أجل قضاة مصر"
author = "مصري"
posted = "2006-04-19"
text = "اليوم لا مجال لفرقة أو انقسام ولا تحزب وإدعاء بطولة ..<br />اليوم هو يوم قضاة كل مصر على أختلاف أطيافهم وانواعهم .<br />اعتصام من اجل القضاه , وأعتصام من أجل نصرة الوطن .<br />هو اعتصام من اجل المصريين فى حقهم فى حياة كريمة ومواطنة بلا تمييز وتفرقة.<br />بدلاً من ان يحاكم النظام المفسدين والمزورين, أحال القضاه الشرفاء الى لجنة الصلاحية, تمهيداً لاقصائهم عن مواقعهم الشريفه.<br />استقلال القضاة هو ضمان العدالة الوحيد فى المجتمع , وحفظ حقوق البسطاء المهمشين فى هذا الوطن .<br />معركة القضاه هى معركة مصر ضد الظلم والطغيان والفساد.<br />لا يوجد تكافؤ فرص من غير قضاءٍ مستقل.<br />وتسود شريعة الغاب اذا فقد القضاة هيبتهم, ويصير القانون الحاكم هو قانون البقاء للأقوى .<br />أمتهان كرامة القضاه هو انتهاك لعرض مصر , ولن يتخلف عن الدفاع عن العرض الا ديوث , والديوث هو من لا يغار على عرضه , ولا يوجد حر لا يغار على عرضه, حتى وان تعرض للأفساد.<br />القضاه دخلوا فى اعتصام مفتوح منذ مساء أمس الثلاثاء 18 ابريل بناديهم , ولا يجب ان نتخلف عنهم وعلينا الانضمام اليهم بإعتصام شعبى<br />مفتوح موازى لآعتصامهم ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131637/http://www.20at.com/article2.php?sid=679"

