subject = "اريد المراسلة"
author = "جمال قطب"
posted = "2006-10-30"
text = "الاخ الفاضل م/ نبيل<br />اولا جزاكم الله خيرا<br />حاولت الاتصال بك لكن الهاتف مغلق<br />1- هل هذا النوع هو الفرنسى \" المتعارف عليه فى السوق خارجى\"<br />2- انا مقيم فى جدة ومحتاج دراسة جدوى للانتاج بمصر<br />3- هل هناك فائدة اقتصادية من انشاء مشروع كبير<br />4- وهل مشاكل التسويق محلولة --اى ما المطلوب هل ننتج مايمكن تسويقه ام نسوق ما يمكن انتاجه<br />ارجو مراسلتى على الايميل ان امكن<br />وجزاكم الله كل خير jamalkotb@yahoo.com"
