subject = "كويس ولكن"
author = "ياسين من غزة-فلسطين"
posted = "2006-08-26"
text = "السلام عليكم..<br />موضوع كثير حلو ومهم.. لكن..<br />عايز أنوه إلى انه هناك الكثير الكثير من أنواع عيش الغراب سامة جداً...بل قاتلة..<br />وممكن تمييز النوع ان كان ساما أم لا بطريقة معينة..ابحثوا في الموضوع..<br />فمش كل ما تلاقي عيش غراب نابت في حديقة بيتكم تجرب تذوقه حتى لا تتسمم..<br />حتى الأجانب الهم طق كثيرة في طبخه..<br />لكني لم أذقه في حياتي ولن أذوقه..فنفسي تعافه..<br />مشكورين ع الموضوع وع الردود..<br />تحية من أهل فلسطين(المحتلة) لكل المسلمين.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114138/http://www.20at.com/article2.php?sid=1149"

[[comments]]
order = 6
subject = "تعلم زراعه عيش الغراب"
author = "م.نبيل فتح الله"
posted = "2006-09-03"
text = "عيش الغراب هومشروع مربح للغايه ومكسبه مضمون أكيد وقد اتجهت كليه علوم القاهره الى عمل دورات تدريبيه لتعليم زراعته حتى تشجع الناس على العمل ونتجنب البطاله وحتى نتجه الى التصدير للخارج لذلك فبعد نجاح الدورات السابقه المنقطع النظير فسوف تنظم دوره تدريبيه لمده 3 ايام من 9/9 الى 11/9 ومفاجأة هذه الدوره انه سيتم اضافه محاضر خاصه بتدوير مخلفات المزرعه كعلف<br />بالاضافه الى مساعدتك فى الانتاج والتسويق وسوف تمنح شهاده معتمده من الجامعه تسهل لك الحصول على قرض من وزاره البيئه<br />فعلى من يرغب فى الحضور ان يسارع بالحجز<br />فى سكرتاريه قسم نبات كليه العلوم جامعةالقاهره<br />025726989/025676671/0106016306"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114138/http://www.20at.com/article2.php?sid=1149"

[[comments]]
order = 7
subject = "جزاك الله خيرا ياعبقرينو"
