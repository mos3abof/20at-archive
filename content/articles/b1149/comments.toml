subject = "كلية العلوم جامعة القاهره"
author = "م.نبيل فتح الله"
posted = "2006-09-29"
text = "تعاقد مع كلية علوم القاهره حيث اننا مكان موثوق فيه ولن تتعرض للنصب<br />ونوفر لك مستلزمات الأنتاج ونتعاقد على التسويق<br />يمكنك حضور دوره رمضانيه مجانيه ينظمها مهندس نبيل فتح الله استشارى كليه علوم كل خميس فى رمضان الساعه 8<br />نرحب باتصالك بنا وبتشريفك دورتنا<br />025726989/0106016306"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114138/http://www.20at.com/article2.php?sid=1149"

[[comments]]
order = 9
subject = "بحمد الله نوفر المشروم للأسواق ......."
author = "نبيل الهوارى"
posted = "2006-09-30"
text = "يسر شركة أورفورما للمنتجات الزراعية وإنتاج عيش الغراب ... أن تعلن عن توافر كميات كبيرة لمنتجاتها من المشروم المحارى والأجاريكس ( المشروم العادى ) بمزارعها ... وذلك لتلبية حاجة السوق من محلات البقالة والسوبر ماركت والمطاعم والكوفى شوب والفنــادق ... وذلك باسعار تنافسية بالسوق ... مع ضمان التوريد بإنتظام إن شاء الله .. وكذلك إسترجاع للهالك أو إستبداله بمنتج طازج ..... فمن لديه الرغبة للتعاون برجاء إرسال إيميل على ( orforma@hotmail.com) وذلك للإتفاق وتوضيح الكمية المطلوبة للتوريد وكذلك فترات التوريد المناسبة ... والله الموفق .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114138/http://www.20at.com/article2.php?sid=1149"

[[comments]]
order = 10
subject = "اتمني ابدا في ويكون شرحة بطريقة مبسطة وعملية"
author = "ِAHMED NABIL SALAH"
posted = "2006-10-02"
text = "السلام عليكم<br />اولا احب اشكر الأستاذ عبقرينو علي الشرح<br />ثانيا انا راجل ان شاء الله كمان شهر شهرين بالكتير هابقي من خريجي الزراعة<br />فاتمني اولا لأني ما دخلتش في طريق الزراعة العملي كله مذكراة ونظري ودش وكلام كتير عايزين طريقة مبسطة لشرحة<br />وكنت عايز ابدأ فين ازاي وشكرا ليكم<br />مع العلم اني داخل القاهرة وطبعا معنديش اي خبرة في مجال الزراعة عموما شوفتوا<br />اه علي فكرة الأيميل ده شغال علي ماسنجر الهوتميل وشكرا ليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114138/http://www.20at.com/article2.php?sid=1149"

