posted = "2006-09-13"
text = "السلام عليكم موضوعكمميز وانا بفكر فيه من زمان ولكن العوائق كالتالي<br />1_ التعرض لعمليات النصب كما ذكرت<br />2_صعوبة النقل حيث اني اسكن في محافظة اسيوط<br />3_بيع المحصول كيف واين لانه هذا النوع منالمحاصيل ليس له متاجر اوزبائن في محافظتي ارجو الافاده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114138/http://www.20at.com/article2.php?sid=1149"

[[comments]]
