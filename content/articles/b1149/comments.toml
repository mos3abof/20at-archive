[[comments]]
order = 18
subject = "دوره تدريبيه مجانيه بالاضافه الى قروض لأبناء محافظه الغربيه"
author = "م.نبيل فتح الله"
posted = "2006-10-31"
text = "دورة تدريبيه مجانيه بالقروض لأبناء محافظة الغربيه<br />سوف يتم عقدها فى مبنى المحافظه<br />تعقد محافظه الغربيه يوم الاربعاء الموافق 1/11 فى تمام الساعه 9.30 صباحاً ورشة عمل تحت رعاية السيد الوزير ماجد جورج وزير البيئه والسيد محافظ الغربيه<br />الهدف منها:<br />1. تدوير القش وتحويله وتفعيله لمشروع اقتصادى<br />2. تدريب على انتاج عيش الغراب<br />3. شرح وتوضيح كيفيه مساعدة الشباب بقروض عن طريق وزارة البيئه بفائده بسيطه وكيفيه وشروط أخذ القرض وطريقة السداد<br />سيدير الندوه اللواء الدكتور مجدى لبيب نائب الوزير للشئون الزراعيه والعقيد هشام أمين الصندوق من الناحيه الماليه<br />وتستضيف الندوه السيد المهندس الاستشارى نبيل فتح الله استشارى انتاج وتسويق المشروم<br />ملحوظه:<br />وبذلك تكون ثانى محافظه تمنح فيها وزاره البيئه القروض للشباب محافظه الغربيه بعد الدقهليه والمحافظه القادمه القليوبيه<br />للأستعلام عن ورشة العمل :مبنى محافظه الغربيه جهاز شئون البيئه –اللواءمجدى لبيب,الاستشارى نبيل فتح الله<br />025726989/0106016306"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114138/http://www.20at.com/article2.php?sid=1149"

[[comments]]
order = 19
subject = "تغيير موعد دوره عيش الغراب"
author = "م.نبيل فتح الله"
posted = "2006-10-31"
text = "بناءً على رغبه الساده المتدربين<br />قرر أ.د.حمدى حسانين عميد كليه علوم القاهره<br />تأجيل دوره استزراع عيش الغراب الى 14/ 11بدلا من 11/11<br />وعلى من يرغب فى الحضور الحجز فى سكرتاريه كليه علوم قسم نبات جامعه القاهره<br />و يتم الحجز قبل الساعه 2 ظهرا و دفع رسوم الدوره<br />025726989<br />025676671<br />0106016306"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114138/http://www.20at.com/article2.php?sid=1149"
