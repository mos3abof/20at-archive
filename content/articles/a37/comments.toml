author = "نا كان نفسى انى اكون متخوز علشان اسمع من زوجتى التعليقات التى يمكنها ان تقولها لى"
text = "عمتا ارجو من اى زوجه قبل ان تنقد زوجها انت تبداء بنفسها اولاً حتى يمكنها مناقشة الزوج<br />عمتا انا لسه متزوجتش مش لانى مشعايز او معيش الامكانيات والله انا لسه بدور على وحده تناقشنى وتنقد<br />نقد بناء واعتقد ان فى يوم من الايام هلاقى بنت الحلال<br />انا لسه صغير<br />والسلام عليكم جميعا<br />محمد"
