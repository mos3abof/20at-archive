posted = "2008-07-18"
text = "اخوي سامح لا فض فوك وانت بلاشك في بلدك الثاني احيي اعتزازك وانتماءك لوطنك الام وكذلك افتخارك بالزي الخليجي فكلنا وطن واحد وان فرقتنا حدود ومسميات ،،"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105151054/http://20at.com/masr/egyptian-blogs/9602.html"

[[comments]]
