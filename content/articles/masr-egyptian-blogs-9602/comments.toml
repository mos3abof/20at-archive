subject = ""
author = "سامح البري"
posted = "2008-07-18"
text = "شكرا جزيلا للقائد والرحال أحمد موسى<br />أنا فعلا بحس إن الرحاله والكشافين أكتر ناس بيحسوا بكلامي<br />يعني … أصل حياة الكشافة ليها مذاقها وذكرياتها<br />ولإنك اسماعلاوي خليني أضيف<br />ولا حماسة الدراوش وليل الاسماعليه<br />ولا طعامة المانجا والخضرة والحنية"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105151054/http://20at.com/masr/egyptian-blogs/9602.html"

