subject = ""
author = "سالي مشالي"
posted = "2008-07-20"
text = "ما شاء الله، بتعرف تشوف في كل حاجة احلى ما فيها<br />ياريت نشوف من مصر حنية .. ومن الخلاجية اخوية.<br />ربنا يوفقك في اي مكان تروحه .. وتفضلك روحك دايما كده .. شايفة الحلو هنا وهناك.<br />انا عارفة انك هناك مش في غربة .. واننا هنا مش في وطن ..<br />لكن كلنا نسعى في ارض الله لعلنا نُقبض على ما يحبه ويرضاه … وبالتوفيق ان شاء الله."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105151054/http://20at.com/masr/egyptian-blogs/9602.html"

