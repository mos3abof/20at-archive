subject = ""
author = "ناهد إمام"
posted = "2008-07-14"
text = "لو أنى أعلم أن تعليقاتى تفجر مواهبك هكذا يا أخى العزيز لأكثرت منها .. وهى الحقيقة كانت \\\" خضة \\\" أصبت بها عندما رأيتك ترتدى الزى الخليجى .. وليس مرد الخضة لأن الصورة وحشة .. أبدا .. ولكنى لأنى فعلا بخاف الشباب من سحر المادة .. ولما كتبت يا سامح ما كتبته راحت الخضة الحمد لله .. لكن نفسي بجد يرجع لمصر وجهها الجميل الأصيل اللى اتكلمت عنه .. الشهامة وأخلاق الرجولة قلت أوى والقسوة زادت أوى أوى .. ربنا يلطف بيكى وبينا وبولادنا يا مصر .. ويزيد من أمثالك يا عزيزى .. وإلى الأمام ."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105151054/http://20at.com/masr/egyptian-blogs/9602.html"

