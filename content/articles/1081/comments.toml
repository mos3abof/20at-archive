[[comments]]
order = 1
subject = "ثمن السبوبة"
author = "solom"
posted = "2006-09-14"
text = "الاخ محمود سأل الاستاذ سمير على تفاصيل كثيرة فعلا رغم ان معظمها متاح منذ فترة دون سؤال ومنشور على مواقع كتيرة وصحف<br />مش مهم<br />الأهم كنت عايزه يسأله سؤال مغلبني<br />نصيبه في السبوبة بتاعة المهرجان ده كام؟؟<br />معلوماتي انه راجل بيقبض مبالغ كبيرة وإنه مربط ومظبط مع الاتحاد الأوربي وجمعيات أمريكاني كثير<br />يا ترى مين اللي بيصرف على المهرجان؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131923/http://www.20at.com/article2.php?sid=1221"
