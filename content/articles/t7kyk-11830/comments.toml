posted = "2009-04-22"
text = "اولا اميتاب بتشان هو اول واحد اتفرجت عاليه وافتكر اول فلم اتفرجت عليه فى حياتى كان فلم مرد وكان سعتها عندى 6 سنين وكمان مامتى واخواتى كلهم بيعشقه حاجه اسمها اميتاب بتشان و بدات اتفرج على كل افلام اميتاب بتشان وحفظهم اسم اسم من اول مرد لغايت God Tussi Great Ho وعمل اكتر من 177 فلم بجد انسان عظيم ربنا يديله طولت العمر والصحه يارب اما شاروك ده مشكله بجد انسان وممثل مشوفتش زايه بجد حاسس انه حد من اهلى وحاسس انى اعرفه كويس كل ما اتفرج عاليه وبجد انسان صادق فى تمثيله وبجد يا جماعه عمرى ما اتفرجت على فلم ليه ومابكتش بجد الهند نفسها انا حاسس انهم قريبن مننا وشبهنا فى كل حاجه حتى سمرهم حتى الناس الطيبن وافلمهم ليها معنا حتى الافلام الكوميدى اللى بيعملوها ليها قصا وشاروك مش بيعمل اقل من 4 او 5 افلام فى سنع وحده ماشاء الله لكن بجد السينما المصريه مش عجبانى نهائى كلها بات تجاريه لكن هناك اميتاب وشاروك فى افلم كتير بيطلعو دور 2 و 3 لكن هنا فى مصر كله يقولك لا التكلفه هتبقى عاليه وبتاع وكل ممثل يعمل فلم فى السنه ويبقى مبسوط انا اسف انى اتكلمت فى مواضيع تانيا غير شاروك بس بجد انا بعشقه ونفسى يجى مصر"
