[[comments]]
order = 2
subject = "الثورى"
text = "من الجميل روية المناضلين و المكافحين فى كل أنحاء العالم و كفاية أن فى بلدين اتنين بس هما اللى محتلين فى العالم كلة و الاتنين عرب للأسف ورغم كدة فى بلد اسمها الفلوجة وقفت فى وش الاحتلال الامريكى الغاشم بلد واحدة وقفت امام الترسانة الامريكية.<br />امابالنسبة للبايخ بتاع غريبة مش هارد علية"
archived = "2004-06-17"
capture_url = "https://web.archive.org/web/20040617184416/http://www.20at.com:80/article.php?sid=182"

[[comments]]
order = 3
subject = "حنقدر نموت"
text = "حنقدر نموت علشان الاسلام وقبل مانفكر نموت حنقدر نعيش علشان الاسلام<br />ولا لسه حنفضل نعيش علشان نعيش وبس!!!<br />جيفارا كان عنده هدف وهدفه نصرة المظلوم.<br />ياترى إحنا هدفنا إيه وعلشان مين الهدف ده ،<br />هدف زي بتاع جيفارا هدف مش بيموت<br />ولاهدف بيموت مع صاحبه<br />يعني هدف مالهوش لازمه زي صاحبه؟!"
archived = "2004-06-17"
capture_url = "https://web.archive.org/web/20040617184416/http://www.20at.com:80/article.php?sid=182"

[[comments]]
order = 4
subject = "حيا الله المنا ضلين"
text = "على بن ابي طالب قاتل مرة دفاعا عن ناس غير مسلمين ولما سالوه ليش قاتلت وهم غير مسلمين قال انوهم مظلومين<br />ويكفي في هذا الزمن الاغبر ان يكون جيفارا الصفعة اللي بتصحي كل مسلم ليكون ثائر على طريقة جيفارا وبافكار الاسلام<br />وبحب اقول لكل غير المعجبين بفكرتي انو الاسلام فكرة كل الاممة ونصر المظلومين والعدل والاخاء<br />محمد اديب -فلسطيتي من بغداد"
archived = "2004-06-17"
capture_url = "https://web.archive.org/web/20040617184416/http://www.20at.com:80/article.php?sid=182"

[[comments]]
order = 5
subject = "gevara20042001@yahoo.com"
text = "مرحبا اسمي زياد من العراق احييكم على هذا الموقع انني لا اعتبر جيفارا من البشر بل انه بطل اسطوري نحلم به ونضع صوره في بيوتنا لا كننا لن نراه ابدا انه الحلم وشكرا"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022131936/http://www.20at.com:80/article.php?sid=182"

[[comments]]
order = 6
subject = "الاقتداء بجيفارا"
text = "كفانا كلام فالنبدا تطبيق نظرية جيفارا وهي الثورة والنضال والكفاح المسلح ضد الطغى والظلام والمحتلين ونشر العدالة والحرية والاشتراكية<br />وانني اقول المحبة هي الخطوة الاولى للثورة<br />ويجب ان نقتدي بمثل قاله جيفارا<br />لا اعرف حدودا فالعالم باسره وطني"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022131936/http://www.20at.com:80/article.php?sid=182"

[[comments]]
order = 7
subject = "موقع إسلام أون لاين.نت"
text = "با اسم الله الرحن الرحيم لو كان جيفارا مسلام يا تراى هل يكون من ابطل العرب وهل سيخلد نسان كان زهدا فى الدنيا ياريت الحكم العرب يتعلمو من هدى الرجل لى صرنى اقوى امة فى العالم والله جيفارا ليبيا"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022131936/http://www.20at.com:80/article.php?sid=182"

