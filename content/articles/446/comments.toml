subject = "وسام كمال"
text = "أقترح على عشرينات ضمن التبويبات التى لا حصر لها على الصفحة الرئيسية اضافة تبويب يعنى بالمقالات والموضوعات اللأرشيفية التى تهم القراء ..<br />وشكرا على هذه الخدمة الجديدة التى أتمنى تطويرها..<br />wesamkamal@hotmail.com"
