[[comments]]
order = 0
subject = "بنت والسلام"
text = "يسلام على الرافعي ...<br />والله الواحد راح في خيال جميل أوي<br />فين زمان الأدب الأصيل دا<br />جزاكم الله خيرًا على النقل<br />ملحوظة :<br />إيه حكاية اللي عنده مقالات قديمة دي ؟؟؟؟؟<br />اللي أعرفه إن عشرينات نهر لاينضب ماشاء الله<br />شدو حيلكم<br />ربنا معاكم"
archived = "2004-11-17"
capture_url = "https://web.archive.org/web/20041117131222/http://www.20at.com:80/article.php?sid=754"

[[comments]]
