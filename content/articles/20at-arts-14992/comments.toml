text = "نفسي فعلا أروحهاااااااااا ااا<br />بجد بجد جامدة و تحفة<br />كان في حلقة عنها في برنامج خواطر 5 في رمضان اللي فات<br />كانت حلوة أوي<br />نفسي فعلاً نعمل حاجة زي دي لأولادنا إحنا<br />فايدها كبيرة أوي<br />أولادهم بجد متأسسين صح<br />و إحنا ليه لأ ؟؟؟"
