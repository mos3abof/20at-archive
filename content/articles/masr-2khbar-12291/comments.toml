author = "احمد حمدي"
posted = "2009-06-07"
text = "شباب الف مبروك على المجلة ويارب من تقدم لتقدم<br />مبروك يا شرين ومبروك يا على ويا كل شباب عشرينات<br />بس المقدمة غريبة شوية ومش فاهم ايه حكاية الجنس والسجاير وليه دايما المواضيع دى مرتبطه بكتابات ميديا انترناشونال كلها<br />عموما مش عايز اسبق الاحداث واحكم على المحتوى قبل ما اشوفه<br />ربنا يوفقكم لما فيه نفع للشباب<br />محبتي<br />احمد حمدي"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727212501/http://www.20at.com:80/masr/2khbar/12291-2009-06-07-10-23-07.html"

