author = "جيــــمــي"
posted = "2009-06-07"
text = "لألألأ .. ده اكيد تمويل روسي لدعم الأشتراكية ونشر الفكر الشيوعي بين الشباب المصريين<br />ولا يمكن تمويل من حسن نصر الله لنشر الفكر الشيعي وسط الشباب المصريين<br />ولا تمويل من الكنيسة ولا من الجامع ولا من المعبد<br />هو الأكيد الأكيد .. أن الدعم ده جاااى من الموساد وذلك لتدعيم وترسيخ فكرة شعب الله المختار و الأعتراف بإسرائيل وبأحقيتها فى القدس<br />ولا يكونش تمويل حكومي مصري أصيل ..<br />حكومي .. صح<br />يوووووووووووووو ووووووووووووووو و<br />كل حاجة بنبصلها بنظرية المؤامرة .. أوباما جه يتكلم معانا قلنا مؤامرة<br />حتى مجلة عشرينات الصغنتوتة الجميلة لم تسلم<br />ههههههههههههههه ههههههههههههههه هه"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727212501/http://www.20at.com:80/masr/2khbar/12291-2009-06-07-10-23-07.html"

