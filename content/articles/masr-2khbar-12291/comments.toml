author = "محمد السيد"
posted = "2009-06-27"
text = "لالالالالالالال الالالالالا .. تعالوا هنا ..<br />دي ناقصة جدا .. وناقصة خالص .. وناقص أوي كمان …<br />وفي المجان اللي فيها ده ؟؟<br />واحد اسكندراني زي حالاتي يجيبها منين …<br />؟<br />يعني ميكروباص \"مشروع باللغة السكندرية السواحلية\" للقاهرة بعشرين جنيه.. وراجع زيهم … وخمسة مواصلات هناك وهنا.. وغدا وعصير في الجو ده. .يعني أكتر من خمسين جنيه …<br />يعني المجلة واقعة بخمسين جنيه ..اه ع الافترا يا بني آدمين… إنتو حتلموا تمن النسخ كنها من الواحد ولا إيه؟"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727212501/http://www.20at.com:80/masr/2khbar/12291-2009-06-07-10-23-07.html"

