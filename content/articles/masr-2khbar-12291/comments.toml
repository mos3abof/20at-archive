text = "رااااااااائع كالعادة …<br />عام بعد عام .. وسنة بعد سنة .. دائما الجديد … والمبهر … والمختلف ..<br />تهنئة تقليدية …صح ؟؟؟ مممممم ..<br />يالا بقي ..مش مهم …<br />ياريت مانسكتش بس …<br />عشريناتي قدييييييييييم .. تقريبا قديم اوووووووووووووو ى"
