text = "النصيب اولا<br />النصيب ثانيا<br />النصيب ثالثا<br />لما جيت اتجوز شفت بنات كتير من اول وهله كنت بحس ان دي مش ليه<br />ولما قابلت زوجتي _ والكلام دا كان من 27 سنه - من اول نظره ووهله عرفت ان هي دي وعملت المستحيل علشان خاطر اتجوزها<br />صاحب النصيب بيحمل ويشيل على طول مش محتاج النصائح ال لي موجوده في اخر المقال دا يا دينا صلاح الدين"
