text = "موضوع حلو جداً…<br />شوية نصائح علي الماشي<br />1- أذا لاحظتي أن الشاب بيدور علي الشكل ومهتم بالمكياج والمظهر الخارجي، أنسيه … وأعرفي أن بكرة هيدور علي إلي أحلي منك!<br />2- حاولي تتأكدي من أنه متدين بجد ومتنخدعيش في مظاهر التدين السطحي.<br />3- الأسرة تاني أهم عامل في الجواز، حاولي تتعرفي عليها بأكبر شكل ممكن …<br />4- حاولي تفكري في شكل العلاقة بينكم بعد 5 سنين، 10 سنين، 25 سنة دا بيساعدك تشوفي قد أية ممكن يكون في توافق بينكم<br />5-أوعي تنسي صلاة الإستخارة … فالله أعلم بما فيه الخير"
