subject = ""
author = "sally"
posted = "2009-12-26"
text = "انا كان لسه متقدملى عريس من اسبوعين عن طريق الصالونات وغالبية مواصفاته حلوه اوى … مهندس فى شركة بترول ومتدين ومن عيله محترمه وأهله ناس كويسين وظروفهم مرتاحه أوى وهيعيشنى فى أحسن من مستوايا …بس مش عارفه انا مرتحتلوش ليه ؟ ده انا حته ما نطقتش بكلمه واحده طول القاعده..وتانى يوم من المقابله بعت وقال انه مرتاح اوى … بس مش عارفه مرتاح لايه ؟..المهم انى قولت أشوفه تانى… خفت اتبطر عالنعمه واستنى الأحسن منه واستنى كتيييييير … اه صحيح اللى معجبنيش فيه انه كان ابيضانى لدرجة انه بيحمر اوى لما بيتكسف … ولبسه ماكنش عاجبنى … بس ده ممكن اغيره بعد كده … بس والله ده مش دلع بنات … انا ما اتشدتلوش … حسيت ان فى حاجه عامله حاجز من ناحيته … مع انه على رأى أختى أحسن واحد فى اللى اتقدمولى من حيث الشكل والمستوى الاجتماعى والمادى … بس انا لو كنت وافقت كنت هبقى غاصبه على نفسى عشان ظروفه حلوه …مش عارفه بقى بس انا رفضت وحاسه بالندم… اهو نصيب بقى وخلاص"
archived = "2010-01-15"
capture_url = "https://web.archive.org/web/20100115064320/http://www.20at.com:80/banat/variety/14419-2009-12-16-07-55-48.html"

