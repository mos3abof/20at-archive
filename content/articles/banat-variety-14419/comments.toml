posted = "2009-12-16"
text = "السلام عليكم ورحمه الله وبركاته<br />حلو الموضوع كتير انا من راى ان كل ال[ *** ]ان اللى ذكروا فى الموضوع كلهم اشخاص غير جاديين وبيلعبوا هما لو كانوا فعلا اشخاص جاديين كانوا عملوا بسنه النبى الرسول عليه الصلاه والسلام (قال تنكح المراه لاربع لمالها وجمالها وحسبها ودينها فاظفر بذات الدين تربت يداك صدق رسول الله) لكن اللى بتتكلموا عنه ده مش جواز دا لعب عيال لو دا فعلا جواز كان زمان العريس سال عن العروس الاول وبعدين قابلها مش يقبلها ويتصدم ويصدمها هى كمان وبعدين يقول يلا فى غيرها المفروض يسال ويتاكد من اخلاقها من غير هى ما تحس عشان ما يسبب لها جرح لو شعر انها غير مناسبه"
