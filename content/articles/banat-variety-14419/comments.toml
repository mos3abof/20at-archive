text = "ياجماعة عاوز اقولكم حاجة ان الولد لما بيجى يخطب بنت اول حاجة بيدور عليها هى الجمال وجمال جسمها وانا بقول كده لانى خطبت مرتين واعرف راى الرجالة ايه انا بقول لاى بنت انها من المفروض انها اول حاجة بتعملها انها تبقا شيك ومرتبة وعلى طبيعتها خالص ومافيش اى تغير فى حياتها لان الا بيعمل المشاكل بين المخطوبين والمتجوزين هى ان كل واحد فى الاول مخبى طبيعته عن التانى وبيتجمل فكل شوية التانى يلاقى تغير فيه يقول لا دا هى كدا اغيرت وهى تقول لا دا هو كدا تغير فياريت كل واحد يبقا على طبيعته واهم حاجة بصراحة ان البنت تكون فرش كدا ومرحة وبتضحك وبلاش عقد"
