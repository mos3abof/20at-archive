text = "والله طب لو انتي عجبتيه وهو مش عجبك او يعني لحد ما مقبول<br />تقبلي علشان متعنسيش ولا ترفضي لحد لما يجي فارس الاحلام؟؟؟<br />هو ده السؤال الي دايما معايا<br />انا الحمد لله بعجب كل ال[ *** ]ان الي اتقدمولي بس هما مش منسبين ليا خالص اما بخيل او تفكيره عيالي او مادي اوي او مستوي تعليمه علي قده وفي فرق في التفكير او في فرق في الطول<br />اعمل ايه اقبل وخلاص علشان اتجوز والسلام؟؟؟؟؟"
