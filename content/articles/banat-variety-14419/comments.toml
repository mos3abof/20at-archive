text = "رائع جدا , صراحة أعجبني تعليق someone ففعلا كيف يمكن أن نحكم على أشخاص من أول مقابلة , ولكن السؤال الذي يطرح نفسه , كيف يمكننا الزواج والقبول بالعريس أو العروص والمسموح لنا فقط لقاء واحد بحكم العادات والتقاليد ؟ أجابة هذا السؤال بالسؤال عن الشخص سواء سؤال أصحابه أقربائه زملائه وحتى جيرانه , فهذا السؤال يكفي لمعرفة السلوك الشخصسي ولكن اللقاء أيضا له أنطباع خاص ولكن لا يعطي التقدير الكامل للشخص والحكم الكامل عليه , ,"
