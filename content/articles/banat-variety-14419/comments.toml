posted = "2009-12-26"
text = "و الله الموضوع جميل جدا<br />و انا رائي اننا نكون علي طبيعتنا احسن بس برضوا نهتم شويه بمظهرنا<br />و الاهم اننا قد ما نبرز احسن ما فينا نبقي نحاول نفهم دماغ الي بيتقدملنا و هل هو عريس مناسب و لا لاا<br />انا مريت بتجارب قري فاتحه و شوفت العذاب و الله<br />في الاتنين<br />عارفين<br />اتعلمت بعد كده اني متنزلش عن كرامتي عشان الانسان الي بحبه<br />لازم تحافظي علي كرامتك<br />و تبقي شخصيتك قويه بس متكونيش متصلطه<br />الدنيا دي عشان تتعلمي فيها لازم تتلسعي من تجاربها<br />و الحمد لله انا بقي تفكيري احسن و اقوي من الاول<br />و بقي عندي خبره ازاي اعرف الوحش من الكويس<br />و اتمنالكم يارب تلاقوا ال[ *** ]ان الصالحين و انا كمان بتمني الاقي الزوج الصالح المتعلم ده كل امالي في الدنيا و رضا ربي"
archived = "2010-01-15"
capture_url = "https://web.archive.org/web/20100115064320/http://www.20at.com:80/banat/variety/14419-2009-12-16-07-55-48.html"

