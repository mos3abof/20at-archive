posted = "2009-12-16"
text = "انا شيفا ان التفاهم شئ اساسي ولازم الطرف الاخر وهو العريس يكون عنده حس الاحتواء يعنى مش يفرض سيطره عليها والصوت ليه وبس يعنى لغه الحوار ومينفعش ابدا من اول لقاء يبنهم يطلب منها عدم الذهاب للعمل مع ان دا من الاساسيات ولازم يكون ليها دخل خاص بيها علشان بعد كدا مش يشتكى من طلبتها الكتير ويقولها كل( شوية هات هات ) مش دا اللى بيحصل …<br />وبعدين مافيش اجمل من البساطة فى المظهر والروح يعنى الجمال مصيرة للزوال اما الروح هى اللى يتعيش . يعنى مافيش مانع من الميك اب بس يكون بسييييييط ميضطغيش على جمال البنت نفسه<br />واللبس كل ما يكون بسيط بيبقه انيق وشيك .<br />اما بقه التفكير العنصري اللى عند الرجل هو اللى بيدفع البنت انها تقول حقوق المرأة والشعارات دى اللى مش بتتنفذ فى مجتمعنا الذكوري ,لكن لو جاب السيرة دى تتكلم معاه بحنكة وذكاءة بدل مايقول عليها هوائية وكلمة بتخليها تتنطط وتتعصب .<br />ولكل بنت اكتر حاجه بتشد الرجل فى البنت الغموض الغير مفتعل وكمان الرزانة والرقة وطبعا لا تتخلى عن انوثتك تحت اى ظرف ( عشان ميقولش ناقصها شنب) والذكاء فى المرأة من اكتر الاشياء بتهم الرجل وخصوصا الرجل المتحضر.. وبس"
archived = "2009-12-19"
capture_url = "https://web.archive.org/web/20091219153910/http://www.20at.com:80/banat/variety/14419-2009-12-16-07-55-48.html"

