text = "السلام عليكم ايه رايكم بالوسطية ياعني لما انشاء الله يتقدم العريس متجيش البنت مننا تحسسه انها مفتعلة سواء في لبسها او في كلامها<br />بالعكس شخصيتها دائما وابدا هي الي بتكلم عنها مش حد تاني وبالمناسبة في تصرفات ممكن تودي وراء الشمس<br />من البنت ذي مثلا تلاقيها مثلا مش فردة ظهرها ولا رافعة راسها يوم ميجي يتقدم وبرده من الوجاهة الاجتماعية انها تحتفظ بابتسامة بسيطة اثناءالحديث اول مرة كمان في حاجة لما يجي العريس اول مرة ياريت اهل البنت والبنت نفسها يعمله فرشة اجتماعية خالص بعيد عن الاستفسار عن المديات وحجيب ايه ومش حيجيب ايه ياعني جلسة يتعرفه علي بعض وكفاية اوي انه يتقي ربنا فيكي"
