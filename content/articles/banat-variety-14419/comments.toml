posted = "2009-12-27"
text = "يا بنات مالكم بس ملهوفين على الجواز اوي كده<br />انا مرتاح افندي مهيتي 45 جنيه في الشهر وموظف درجه سادسه في وزارة الشئون الاجتماعيه ومقدم على شقه اوده وصاله وحمام مشترك وهاستلمها سنة 2080 وبادفعلها 3 جنيه شهريه وعالعموم انا وزني 130 كيلو وطولي 150 سم و لوني اسمر وعندي شنب رفيع وارعه في نص راسي وبدله كستور بني وبدور على بنت الحلال اللي عايزه تعيش وتكافح معايا بس اهم حاجه تكون بتحب الجبنه والنشويات .<br />اه صحيح انا عندي اشتراك شهري في هيئة النقل وممكن اركب اي اتوبيس تذكرته اقل من 50 قرش ببلاش . الحمد الله متهيالي كده مش ناقصني حاجه وعريس لقطه والله . المهم انا اهم ما فيه التواضع والسماحه … اى نعم انا قوى الشخصيه وشكيم العزيمه وراجل بمليون راجل بس برده انا متواضع جدا الا اني محبوب جدا ولماح جدا وذكي جدا بس الحمد الله اهم ما فيه اني متواضع … طبعا انا عارف ان في بنات كتير هينبهروا بيه وهيتمنو يعرفوني ويكلموني و يفكروا في الارتباط بيه … وانا معنديش مانع يا حلوين وكمان ولاول مره هاعلن عن رقم تليفوني على الملاء 0110999001 يلا افرحوا وانبسطو يا بنات … بس انا ماليش في الرنات ولا الرسايل . يا سم"
archived = "2010-01-15"
capture_url = "https://web.archive.org/web/20100115064320/http://www.20at.com:80/banat/variety/14419-2009-12-16-07-55-48.html"

