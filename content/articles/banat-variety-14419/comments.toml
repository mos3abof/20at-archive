text = "انا بقا مشكلتى<br />ان اللى اى حد يجئ من برا ويعرف انى بعمل ماجستير ومصره انى اكمل دراسات عليا لان طبعا شغل البنت ودراستها هما اللى بيبقولها متقولوش بقا راجل وعيال وحجات كده لان ولا راجل بيقدر الست اللى بتعمله ولا عيل بيحترم امه ولا ابوه<br />انا مش ممانعه اكون ام ولا اتجوز بس امسك سلاح فى ايدى عشان متحوجش لحد<br />فكل اللى يعرف انى مصره على الماجستير<br />يسحب كلمته ويخلع رغم انهم اللى بيجوا<br />معاهم جامعات وشغلته كويسه<br />بس اقول ايه بقا"
