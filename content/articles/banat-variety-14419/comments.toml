[[comments]]
order = 26
subject = ""
author = "مرتاح افندي"
posted = "2009-12-27"
text = "[quote name=\"ايمان محمد\"]موضوع بجد لزيز لو تسمحولى اتكلم عن نفسىانا عندى22سنة مش كبيرة ومش صغيرة دة كلو صحيح بس المشكلة انى جربت كل الى عملوة اخواتى دة مرة ابقى شيك ومرةلبقة ومرةخجولة ومرة مرحة ومرة متكلمة لغاية مزهقت كل الى يجو يقول لا حلوة جدا بس متكلمة او هادية او عندية او شقية او حلوة بس منظمة زيادة عن الزوم قصدو محبكاها قوى اويقول عملة شيخةوالله مابكدب عليكو بس دة كل الى اتقالىفعلاوصلون ى لدرجة انى لما يجى اى عريس بقيت اقبلو عادى جدا وكانى خلاص عرفت انو حيجى وحيمشى وحيقول اى حاجة من التعليقات الى خلاص حفظطها وفعلا دة الى بيحصل والله صحيح الى رفضونى انا كمان كنت بعلق عليهم برضو ماهو ياجماعة هما مش مليكة برضو بس المهم وفقت على واحد بمعنى ادق جة واحد واتقدم اهلى انبهرو بكلامو فى الدين ولبقتو وادبو وصرحتو وشكلو وكل حاجة فية وف3 ايام والله كانت الدبلة فى ايدى بس كان شايف نفسو عليا والله كرهنى فى الرجالة كلهم وبعد 7 تيام بالظبط كانت الدبلة مش فى ايدى خلاص شكلى كدة زهقتكو بس والله انا اتفكيت معاكو والله دة<br />انا معاكي دوري عليه وهتلاقي نمرتي كلميني ضروري"
archived = "2010-01-15"
capture_url = "https://web.archive.org/web/20100115064320/http://www.20at.com:80/banat/variety/14419-2009-12-16-07-55-48.html"

