text = "صباح الخير ..ميرسي جدا على الموضوع الجامد ده بس بصراحه انا زهلت من ردود المشتركين,مفيش ولا واحده فيهم تقريبا ذكرت كلمه \"حب\" وكلهم بيفكرو في الشقه والاثاث والدكتور والمهندس والغريبه انهم بنات انا مش بقول ان دي حاجات مش اساسيه بس برضه الماديات مش كل حاجه وممكن تكوني مع انسان بسيط جدا بس بيعاملك زي الاميرات يا جماعه الحب مهم قوي وعلى فكره الحب موجود وكتير بس للي يقدره واللي فعلا بيحب شخص كله على بعضه مع سنه عقل وايمان مش عشان مستواه المادي ولا المهنه ولا عيونه الزرقا..بس مترجعوش تقولا مفيش حب طالما انتو بتفكرو بس بالطريقه دي ..من فضلكم محدش يزعل مني"
