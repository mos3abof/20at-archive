text = "اقتباس مونة:<br />كل دة الواحد بيعملة بس المشكلة في ان كل واحد عايز يتقدم عايز فيها كل حاجة بيضة وعيبنا زرقة وطويلة وتقدر تساعدة في الجوازة ومش مهم انهامؤدبة ولا الاخلاق ولااي حاجة وجوز الصالونات بقة فاشل هي كل واحدة تعرفلها واحد شوية بعد كدة يتجوزة<br />ده فعلا بيحصل ده حتى دلوقتى فى برنامج اسمه قسمه نصيب الشباب كلها هتموت على بنت بالموصفات دى مع انها لا تصلح زوجه خالص لابتعرف تتطبخ وعلى طول نايمه<br />اما بالنسبه لل[ *** ]ان انا جالى واحد من الخارج مناسب الاول قابلته بالميكياج بعد كده وانا مدبهدله لكن مهموش المظهر هو قالى انتى مناسبه ليا عشان بتعرفى تفكرى بس بعد كده بدأ يزهق من انى بحللل وبفهم هو اللى ايه قصده<br />كان باين انه متدين وطالع ولا متدين ولا حاجه ده حافظ كلمتين وبقولهم ده حتى طالع مش بيصالى<br />انا زهقانه منه اخر حاجه بس ماما قرفانى وكمان عندى ناس اعرفهم احلى منى بكتير لحد دلوقتى متجوزوش ابقى معاه وهى عيشه وسلام ولا اسيبه ويكون احتمال انى اعنس على فكره انا عندى 21 سنه"
archived = "2010-01-15"
capture_url = "https://web.archive.org/web/20100115064320/http://www.20at.com:80/banat/variety/14419-2009-12-16-07-55-48.html"

[[comments]]
