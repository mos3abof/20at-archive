text = "الموضوع صح<br />بس الاهم مش لازم نبهرج فى الميك اب والمكياج يعنى ممكن نروح المقابله زى اول يوم بنزل فيه الشغل او اول يوم بنروح فيه المدرسه مبنبقاش مبهرجين بس بنبقا شيك ولا ايه<br />والاهم انك تشترى منه عشان تفهمى طلباته لو معجبتكش طلباته ارفضى من غير ما هو يرفض او يعلق على طريقه كلامك انك بتتكلمى زى علماء الدين او رئيسه جمعيه<br />وبصراحه انا شيفه انى مبحبش جواز الصالونات ده ابدا لازم الى يتقدملى يكون عارفنى ومعجب بيه كده على بعضى بمحاسنى وعيبوبى"
