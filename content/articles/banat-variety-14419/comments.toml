text = "انا اتقدملى كذا واحد وكلهم رفضتهم من قبل ما قابلهم لأنهم كلهم مش نفس مستوايا العلمى انا ف كلية صيدله وعندى 20 سنه ودلوقتى متقدملى واحد هو متدين جدا ومستواه المادى قريب منى بس هو بكالوريوس دراسات اسلاميه ومش عارفه انا ولا بحبه ولا بكرهه انا كان نفسى ف حد بحبه ويحبنى زى قصص الأفلام كده 0 انتو عارفين هو لو كان حتى اقل منى وبحبه كنت وافقت علطوول مش عارفه اوافق ولا ارفض مش عارفه حاسه انه ممكن يجيلى حد احسن منه بس هو محترم اوى وكويس وقالى انه ناوى يكمل دكتوراه (هو بيعمل ماجيستير دلوقتى) وناوى يستننانى لحد ما اخلص دراسه"
