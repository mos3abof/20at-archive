author = "اكتب اسمك هنا"
posted = "2009-02-14"
text = "فية عيد او حتى موسم فى الاسلام اسمة زفت فالنتينو<br />احنا مالنا ومال اعياد الناس التانيين<br />انا عارف ان اقرب عيد جاى هو الاحتفال بذكرى مولد الرسول صلى اللة علية وسلم ومن الان نستعد بتزغيط ذكر البط وهنعمل كسكسى وشوربة وهتبقى ليلة مباركة وكلها حب"
archived = "2010-02-03"
