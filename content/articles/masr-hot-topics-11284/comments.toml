text = "لست ادرى من اين لى بالمال لاشترى حتى لفة فجل معفن اخضر لاشارك بة اسرتى حتى العشاء على رغيف عيش بلدى من العيش الغير ادمى اللى اسمة (العيش البلدى)<br />ما خلاص عمو (نظيف)نظفنا من كل شئى<br />لعنة اللة هذا (القذر)اللى اسمة (نظيف)[ *** ]"
