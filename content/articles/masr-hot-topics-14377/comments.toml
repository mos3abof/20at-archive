subject = ""
author = "جلال القران وهيبته"
posted = "2009-12-13"
text = "ورد في الفتوى جلال القران وهيبته<br />يتمثل في الامتثال لاوامره ونواهيه<br />يعني القران قال ولا تقربوا الزنا انه كان فاحشة<br />والبلد كلها زنا<br />القران قال ولا تشربوا الخمر<br />البلد كلها خمر<br />القران قال حاجات كتير اوي اوي اوي<br />هيبة القران اننا نمتثل لاوامره ونواهيه مش في رنة موبايل<br />على العكس تماما ممكن رنة الموبايل تكون دعوه الى الله<br />ممكن رنة الموبايل تكون رب اجعلني مقيم الصلاة ومن ذريتي ربنا وتقبل دعاء<br />اي واحد يسمع هذه الاية في الاتوبيس في المترو في الشارع ممكن يتعظ بها<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218065926/http://www.20at.com:80/masr/hot-topics/14377-2009-12-13-15-09-08.html"

[[comments]]
