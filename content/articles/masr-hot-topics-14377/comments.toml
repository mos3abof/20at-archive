[[comments]]
order = 7
subject = ""
author = "محمد"
posted = "2009-12-15"
text = "أنا آسف بس من نحن لينعدل على علماء مركز البحث الاسلامي … بارك الله في علماء هذا الدين ورزقهم الخلاص اللهُم أمين …<br />وبالنسبة للاخ اللي بيقول حرام تشغيل القرآن فالكاسيت فـأقوله لا بأس وبالنسبة للاية اللي بيستدل بيها فـهي كان ليها سبب نزل تاني خالص .. والقصد من انصتوا في الاية أي في الصلآه وطبعا الأخذ بعموم معنى الحديث والنساط مع القرآن في كل وقت وحين حتى لو كان شغال فلكاست فـأفضل واحواط والله تعالى أعلى وأعلم"
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218065926/http://www.20at.com:80/masr/hot-topics/14377-2009-12-13-15-09-08.html"

