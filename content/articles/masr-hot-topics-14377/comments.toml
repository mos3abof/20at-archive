posted = "2009-12-13"
text = "واحد نطع دخل الحمام يعمل بى بى وهو فى الحمام جاءت لة مكالمة يقوم التليفون يقرا قران او دعاء او ايات مقدسة - اية الخبل دة - التليفون تليفون والشركة عاملة رنات نبقى نستخدمها وللعبادة والدعاء اوقات ولها حرمتها نبقى ندعى ونقرا فيها<br />ربنا يشفى الجهلة يارب والمتنطعين بالدين"
