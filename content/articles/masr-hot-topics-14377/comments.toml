subject = ""
author = "محمد الديسطي"
posted = "2009-12-14"
text = "فعلا آيات القرآن ليس مكانها رنة الموبايل لكن لا بأس إن كان في رنة ممكن نعملها بحيث تكون كامة وبالتالى مانقطعش الآية بما قد يغير المعني .يعني أنا مع الرنة الدينية لأنها شيء جميل وذوقي بس لو دا هيغير في المعني او يؤدي لعدم اكتمال المعنى يبقى كدا ما حقق الفايدة منه وبالتالى ممكن نعتمد على الأناشيد والأغاني المحترمة<br />شكرا لهذه المساحة"
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218065926/http://www.20at.com:80/masr/hot-topics/14377-2009-12-13-15-09-08.html"

[[comments]]
order = 5
subject = ""
author = "هيبة القران"
posted = "2009-12-15"
text = "القران كلام الله<br />وهيبة القران هيبة لله عز وجل<br />وهيبة الله عز وجل اننا ننفذ اوامره ونواهيه الموجوده في القران<br />والموضوع يطول شرحه<br />سايبين الاصل<br />وبتدوروا على الفرع<br />القران ما ينفعش رنة موبايل<br />والقران ما ينفعش يتحط على الرف ونتفرج عليه<br />القران دستور شامل للحياه في الدنيا والاخرة<br />فهمتوها ولا لسه<br />وعلى الاخوة الذين يضعون ايات القران في رنة الموبايل تحري ان تكون الاية قصيره ولها معنى مفيد مثل<br />رب اجعلني مقيم الصلاه<br />يعني هناك ادعية قصيره في القران<br />ونكرر هيبة القران في تنفيذ تعاليمه التي امر الله بها"
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218065926/http://www.20at.com:80/masr/hot-topics/14377-2009-12-13-15-09-08.html"

