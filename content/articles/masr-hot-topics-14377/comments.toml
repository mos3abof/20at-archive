author = "Ibrahim"
posted = "2009-12-15"
text = "فعلا ايات القران لا تصلح كنغمات موبايل ..<br />القران له احترامه وما ينفعش يشتغل عند ايه ويقطع مرة واحدة .. الخ<br />وعلي فكرة كان زمان قوي فيه شيخ قال ان تشغيل القران في الكاسيت لا يجوز ..<br />لانه يشترط مع القران الانصات .. وما ينفعش يشتغل كدة للاستماع فقط ..<br />( واذا قرا القران فاستمعوا له وانصتوا لعلكم ترحمون )<br />احسن حاجة هي الادعية .."
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218065926/http://www.20at.com:80/masr/hot-topics/14377-2009-12-13-15-09-08.html"

[[comments]]
order = 9
subject = ""
author = "بنتك يا مصر"
posted = "2009-12-16"
text = "والله تعبت مع الناس من كتر ما قولتلهم (انا اشك ان القرآن لما يكون رنة ده حرام) مهو انا برده مش عايزة افتي<br />ولكن هكذا حدثني قلبي حين سألته<br />فالحمدلله عالله الناس تفهم وتاخد بالها<br />كان أساس اقتناعي من جانبين أساسيين<br />وهما اولا طبعا ان الآية بتقطع<br />تانيا كمان ان اي حد بيخش دورة المياه في أي حته بيروحها ومعاه موبيله طب ازاي آيه قرآنيه تكون رنة والشخص ده فالحمام<br />والله مش عارفه ما حدش فكر خالص او ما حدش حصلت معاه خالص<br />وبعدين هو لو الآية القرآنيه حرام خلاص يبقى البديل فورا هيفا اما غريبة<br />طب مهو الأناشيد الدينيه كتييييييييييييي يييير جدا اختار واحده وحطها<br />والبني آدم عمره ما كان رنة يبقى من الآخر اختار اي رنة من عالموبيل اصلا وحطها وريح دماغك وريحنا"
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218065926/http://www.20at.com:80/masr/hot-topics/14377-2009-12-13-15-09-08.html"
