subject = ""
author = "ابومحسن غربة 28 سنه"
posted = "2009-12-13"
text = "الفتوى زي حكم المحكمة<br />حكم المحكمة ليه اسباب وحيثيات<br />وعلى سبيل المثال لا الحصر القاضي اللي حكم على محسن السكري وزميله بالاعدام<br />منطوق الحكم كان سطر واحد<br />علشان خاطر يكتب السطر دا كان فيه 300 صفحة اسباب وحيثيات<br />لما جهة تقول ان رنة الموبايل حرام تبقى اية قرانية لازم توافينا باسباب وحيثيات هذا الحكم<br />من غير اسباب وحيثيات الفتاوي ما تنفعش"
archived = "2009-12-18"
capture_url = "https://web.archive.org/web/20091218065926/http://www.20at.com:80/masr/hot-topics/14377-2009-12-13-15-09-08.html"

