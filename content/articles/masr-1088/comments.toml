[[comments]]
order = 3
subject = "لا صخه لهذا الخير"
author = "م. سيف احمد"
posted = "2006-10-26"
text = "لا صحه للبر ده الداخليه عندها كهربا ومش بتدفع ولا هتدفه كل الي اتقطع عنهم الكهربا محافظه القاهره ومبني حي اسيده زينب ومصر القديمه وبولاق وعبدين وبعض المصالح الحكوميه التانيه<br />بس خلاص"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014907/http://masr.20at.com:80/article.php?sid=1088"

