[[comments]]
order = 0
subject = "اللهم ذيد وبارك"
author = "ايمن امام"
posted = "2006-10-23"
text = "الحمد لله وقعوا فى بعض - عمالين يشوو فينا اخيرا ها يخبطوا فى بعض بس حكايه قطع النور عن وزاره الداخليه دى مسأله صعبه جدا - لان الوزاره بكل بساطه ها تعتقل كل بتوع الكهرباء وتبقى حوسه - وتعلن انها اكتشفت تنظيم ارهابى يضم رئيس مجلس اداره الشركه القابضه لتوزيع الكهرباء واسمها كافى للاعتقال- قابضه - تحقيقات واستجوابات - قابضه من مين ياشركه - ومش بعيد يعلقوا اعضاء مجلس اداره الشركه ويروقوهم - ومش بعيد يودوهم جوانتانامو-بتهمه مساعده الارهاب هو قطع النور سهل عن وزاره الداخليه- والحل بسيط جدا - ها يتم تحميل الفاتوره على الشعب - بعنى دخول القسم باتنين جنيه - وعمل محضر بخمسه جنيه وعمل معاينه رسوم انتقال - والبيات فى غرفه خاصه خارج الحجز بعشرين جنيه والعرض على النيابه بدلا من ركوب سياره الترحيلات تركب سياره خاصه بخمسين جنيه - وبعد الافراج عنك من النيابه وكما هو متبع لابد من العرض على السيد رئيس المباحث تانى يوم بعد ماتروح المديريه وتبقى ليلتك سودا لو كان فى تشابه اسماء او حد مضايق منك فى القسم - بدلا من البيات والعرض والبهدله - رسم خمسين جنيه - وبطريقه بسيطه اتحلت المشكله ياكهرباء - بالاضافه الى فكره اخرىتقوم المباحث بكتابه خطاب تحريات الى النيابه العامه وطبعا من غير كلام هايصدر امر قبض واحضار لكل المحصلين بتوع الشركه او على الاقل بتوع الكمبيوتر فى شركه الكهرباءلانهم على صله بتنظيم لسرقه المال العام وها يعترفو ها يعترفو- والاعتراف سيد الادله- يقوم كمان بتوع الميه يقطعوا الميه عن الوزاره وتبقى حوسه لكن ليها حل - نفس الفكره اللى فاتت بس تعديل بسيط كل مواطن داخل القسم ياخد معاه جردل ميه لزوم الحمامات وزجاجتين مياه معدنيه للباشا وزجاجه للامناء وكده تتحل المشكله وكل عام وانتم مش بخير يااللى ف<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014907/http://masr.20at.com:80/article.php?sid=1088"

