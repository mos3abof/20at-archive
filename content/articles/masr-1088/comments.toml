subject = "تعليق"
author = "الدشم"
posted = "2006-10-25"
text = "بالعكس الحكايه دى ممتازه ، يعنى اما نشوف مثلا ان وزاره فى حجم الداخليه بتعامل معامله اى جهه اخرى ، فهذا شىء جيد وفى صالح الدوله وليس العكس.<br />نعم للتوريث ولاستكمال المسيره."
archived = "2006-11-27"
