[[comments]]
order = 9
subject = "في كل بلادنا نكبة"
author = "رائد"
posted = "2006-04-11"
text = "والله يا اخي كلما مررت على اي مكان في بلادنا العربية جميعا وليس الطريق الدائري فقط تفهم الازمة وتغرق فيها من طرفك الى اذنيك ولكنك في النهاية لا تجد بداخلك الا الاسى على مافات والخوف مما ياتي، فالله معنا جميعا وحماس قدوة حسنة بارك الله فيهم وبلغنا مكانهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130328/http://www.20at.com/article2.php?sid=676"

[[comments]]
order = 10
subject = "آخر الخدمة؟"
author = "يعني يا عشرينات آخر الأمور أنكم بتعتقدوا أن أبو مازن مش عميل؟"
posted = "2006-04-11"
text = "ايه عرفكم انتم عن الموضوع ده<br />انا عندي وثائق ضخمة جدا تثبت أن كل حكام العرب عملاء من أيام ناصر ومفاوضته لليهود وحتى أبو عباس والقذافي ومبارك<br />يا عشرينات<br />صباح الخير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130328/http://www.20at.com/article2.php?sid=676"

[[comments]]
order = 11
subject = "انت مجرم وعميل يا زين"
author = "إسلام لطفي"
posted = "2006-04-11"
text = "انت ازاي وتتجنن وتقول الكلام ده!! انا مستغرب ان واحد متفتح زيك يكفر بكل اللي اتربينا عليه.<br />انا طول عمري ماكنتش باصدق موضوع مهبط الطيارات ده بس مؤخراً بدأت اصدقه لأنه مكسر ومدغدغ وطلعان تلاتينه واكيد حكومتنا الوطنية عملته كده علشان يبوظ عربيات الأعداء زي ما بوظت عربيتي - على أساس اني من الأعداء برضه -<br />استغفر ربك وارجع عن الأفكار العلمانية اللي في دماغك دي . . قال الدائري كويس قال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130328/http://www.20at.com/article2.php?sid=676"

[[comments]]
order = 12
subject = "تصرفات عباس الأخيرة .. كيف نفهمها !"
author = "يلسيد أحمد زين"
posted = "2006-05-24"
text = "أنا لست ممن يتهمون بالعمالة جزافا.. ولا أحب ذلك.<br />بيد أن السؤال .. كيف يمكن أن نفسر تصرفات عباس الأخيرة .. من مثل \" وصف ( حقيرة ) للعمليات الاستشهادية ، تحريض دول الجوار لإسقاط الحكومة عبر تشديد الحصار ، سحب الصلاحيات ومحاولة نخر الحكومة من الداخل ، إعلانه في منتدى دافوس عن اتخابات تشريعية مبكرة ، أمره للمدعي العام بفتح تحقيق على الأموال التي دخل بها الناطق باسم حماس ، قوله عن الواية الأردنية المضحكة بأنها خطيرة وأنه مقتنع بما ورد فيها ... وأخيرا سكوته عن المشهراوي ودحلان والرجوب وهو يعلم أنهم وراء ما يحدث في غزة من قتل واظطراب .. هل يمكن أن تفسر لي .. آمل .<br />تحياتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130328/http://www.20at.com/article2.php?sid=676"
