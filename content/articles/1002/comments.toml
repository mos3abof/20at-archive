author = "طبعا أبو مازن عميل من غير كلام"
posted = "2006-04-10"
text = "والدليل اسمعوه من عرفات نفسه في أكتر من تصريح حين سمى هؤلاء جماعة إسرائيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130328/http://www.20at.com/article2.php?sid=676"

[[comments]]
order = 6
subject = "صعبان عليا"
author = "حماده"
posted = "2006-04-10"
text = "والله انا صعبان عليا حالنا ده انت كاتب عن حماس وفلسطين وابو مازن والبشوات اللى بيعلقوا كل اللى عارفينه<br />واااو جوزيف يروح هانى<br />لا هانى هوا اللى احسن جوزيف شكله دفع<br />ايه اللى احنا فيه ده<br />عم احمد يازين سيبك من فلسطين وحماس وياريت تجهزلهم موضوع عن السيرة الذاتيه للبطل الهمام جوزيف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130328/http://www.20at.com/article2.php?sid=676"

[[comments]]
order = 7
subject = "agent"
author = "كلنا يعلم من الذى نصب عباس رئيساً للوزراء فهو طُلب بالإسم لهذا المنصب ما نفهم من ذلك"
posted = "2006-04-10"
text = "أمريكا من طلبت تعينه لهذا المنصب نفهم من ذلك أن عمالة أبو مازن أمريكية بحتة ولن<br />ترضى أمريكا بأى شخص إن لم يكن عميلاً له وما سخطها على عرفات لأن ميوله كانت<br />أوروبية أكثر منها أمريكية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130328/http://www.20at.com/article2.php?sid=676"

[[comments]]
order = 8
