subject = "عاقل"
author = "عاقل"
posted = "2006-04-09"
text = "تكرم عيونك ياجوزيف<br />يابطل لبنان<br />تكرم عيونك يالبنان يابلدى الحبيب<br />تكرم عيونك يا جوزيف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130328/http://www.20at.com/article2.php?sid=676"

