subject = "عادى"
author = "جميلة"
posted = "2006-04-09"
text = "هاى عليكو<br />بجد بجد انا فرحانة اوى ان جوزف هو سوبر استار اكاديمى<br />واحب اقولو انك احلى سوبر استار ياعمرى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130328/http://www.20at.com/article2.php?sid=676"

[[comments]]
order = 1
subject = "احييك جدا"
author = "فلسطينى"
posted = "2006-04-09"
text = "نحنا كتير سعداء بفوز البطل<br />زوزو او جوزيف<br />لانة عن جد كتير بيستحق<br />اما المصرى هانى تبعكم صوتة كتير صعب ولا يطاق ابدا<br />ومابعرف ليش ضل بالاكاديمية حتى الان ؟؟ظ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130328/http://www.20at.com/article2.php?sid=676"

[[comments]]
order = 2
subject = "رفح"
author = "نادين"
posted = "2006-04-09"
text = "سمير المشهراوي هو نسخة من سمير جعجع لبنان ن فجعج لبنان له عصابة الان وسابقا وله جرائم ومجازر ارتكبها وصاحب ميليشيا شاركت في صبرا وشاتيلا<br />كذلك سمير غزة عنده مرتزقة وميليشيا يتقاضون اموال منه ومن السلطةسمير غزة كان احد احذية اسرائي في العهد الاولي للسلطة<br />سمير ومعه دحلان شاركا بقتل ابو عمار وتامرا عليه<br />سمير ودحلان حلمامعا ان يشكلا الوزارة لكن الله خيب امالهم<br />فلعنة الله على سمير جعع غزة اي سمير مشهراوي لبنان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130328/http://www.20at.com/article2.php?sid=676"

