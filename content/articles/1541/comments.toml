author = "ئ طريف كل هذه التحليلات عن شخصية جرندايزر ذو الوجهه البقري! لكنني حينما كنت صغيرة كنت اتابع حلقات الكرتون بشء من البراءة بالاحداث والصور والموسيقي التصويريةوالاكشن دون ملاحظة ما المقصود بهذا الكرتون ، لا اعتقد مثلا ان اليابانيين الصغار يدركون ذلك ولا حتي آبائهم، شكرا لجهد كاتب الموضوع"
