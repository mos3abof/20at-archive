subject = "مرحباااا"
author = "حيد من ليبيا"
text = "بصراحه شيئ مؤسف للغايه كلام هؤلاء البنات عن حالتهم هذه لا اعتقد أنه هذه هى السبب الرئيسى فى المشكله أعتقد فى أسباب عده لتفاقم هذه العنوسه ليس مما ذكروا الأخوات فقط مشكلات صعب جدا الواحد يشرحها فى كام كلمه ..لكن فى الحقيقه هو الواحد صعب فعلا يرتبط ببنت مستواه المادى أعلى بكثير منه يعنى تكون غنيه وهو مجرد شاب متوسط المعيشهلأنه حتى لو اتزوجا رح تستعبده هى واهلها وهيك أصبح هو لا يتمتع بصفات الرجوله وأهمها هى ضبط زوجتهحيت لايستطيع أن يبدى رأيه معاها أو حتى يقول لها أطبخى تلك الطبخه لانها بنت فلان وخاصة أذا هى مغروره وهمها الوحيد ان تتزوج ...طبعا ألا من رحم ربى لانه فى كثير من بنات ناس أغنيه محترمات وعلى خلق هى واهلها وحتى لو كانوا اهلها غير ذلك ...نسأل الله العافيه<br />بالنسبالى كل شيئ يعود للرجل بالنسبهلضبطه لزوجته حتى لو كانت أبنة رئيس وزراء المرأه تحترم زوجها وتقدره أذا كان هو فعلا يستحق الأحترام..لأنه الأحترام بيفرض نفسه من قبل شخصية المرأه<br />أنا شاب عمرى 23 اتمنى أنا أرتبط بفاتة متعلمه متدينه محترمه خلوقه أتمنى أذا فى بنت قرأت كلامى هذا أن تراسلنى على أيميلى هذااا<br />BAAN_TV@YAHOO.COM<br />نسأل الله العافيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145403/http://www.20at.com/article.php?sid=1513"

