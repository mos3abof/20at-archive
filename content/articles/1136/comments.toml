[[comments]]
order = 3
subject = "حقيقه ابرزها الفيلم"
author = "مريم"
posted = "2006-06-22"
text = "الفيلم اكتر من ممتاز في جميع النواحي الفنية والتمثيلية والاخراجية. الفيلم جريء جداااا ليسرد مثل هذة الحقائق عن مصر. كل ما سرده الفيلم حقائق نعلمها جيدا و لم تتاح الفرصه لتجميعا كلها في فيلم واحد يشارك فيه كل هؤلاء النجوم.<br />الجمله القويه جدا لعادل امام \"... يـبصوا علينا ليه؟.... يبصوا على البلد اللى باظت...البلد بقت مزابل من فوق ومن تحت المسخ... إحنا فى زمن المسخ...\" فعلا ده مضمون الفيلم. زمن المسخ هو الزمن الذي يجبر فية اولاده لبيع نفسهم من اجل المال. الارهاب ليسوا فقط خليقة ضعف او جهل انساني و لكن كما اوضح الفيلم فان الحكومة لها دور كبير في خلقهم.<br />تاثير الفيلم قوي جدا علي المشاهد. ولكن هل هو مجرد فيلم واقعي ام خطوه لشيء؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"

[[comments]]
order = 4
subject = "غالبا .......حأشوف الفيلم ده ...لو الكلام بالشكل ده"
author = "محمد السيد"
posted = "2006-06-23"
text = "مممممممممم ...<br />طبعا أنا مشفتهوش ... ويمكن أكون ناوي أشوفه ....<br />لكن علي الكلام اللي مكتوب ده يبقي الفيلم ده عظيم وحكاية ... لكن ....<br />حكاية المشاهد والحاجات دي ...؟؟ هو إحنا منعرفش نعمل فيلم من غير الحاجات دي أبدا.....؟<br />بمعني ... مينفعش أبدا فيلم يكون فيه قصة و فكرة وعمق و سينما بجد ..إلا ويطعموها بكام مشهد وكام منظر ؟؟؟؟<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"

[[comments]]
order = 5
subject = "فين المبدع الحقيقي؟مش كدابين الزفة اللىأخدوا الجوايز والجمهور وكل حاجة"
author = "محمد السيد"
posted = "2006-06-23"
text = "تاني حاجة ........... كل احتراماتنا وتحياتنا لصاحب الإبداع الأساسي ...<br />المبدع الكبير علاء الأسواني ....<br />حقيقي إنسان بجد .... وإن كان لازم يتحارب في البلد دي ...<br />لكن حييجي يوم وتاخد حقك يا أستاذ علاء ....<br />علي فكرة ....... في العرض الخاص للفيلم ....... تمت دعوة طوب الأرض ... اللي له فيها واللي ملوش ... اللي بيمثل ويرقص و يغني و يطبل ........ وكل حاجة .......<br />لكن صاحب الحفلة الحقيقي .... تم تغييبه ...<br />لم توجه إليعه الدعوة أساسا .... تخيلوا ؟؟؟<br />ولما طلب التفسير من المنظمين قالوا : إنه غير مرجب بيه أمنيا ..... وإن في شخصيات كان المفروض تحضر العرض ... لا ترغب في وجود شخصية مثله .........<br />بس ...<br />تخيلوا .........؟ ولما تعرفوا إن الشخصية دي هي سيادة فخامة جلالة حضرة سمو معالي ....السيد / جمال محمد حسني مبارك .....<br />أكيد يظهر السبب ... و يبان الدكتور علاء الأسواني ينتمي لأي معسكر ...<br />معسكرنا إحنا ......... المصريين .....الغلابة<br />وبيقول معانا<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"

[[comments]]
order = 6
subject = "معقوله هى دى مصر"
author = "الفيلم لا يستطيع احد ان ينكر تميزه خاصه فى ظل الافلام التافهه التى تعرض وجاء الجانب التمثيلى فيه عالى جدا خاصه عادل امام"
posted = "2006-06-23"
text = "لكن اول شعور ممكن تحسه هو الصدمه والتقزز معقوله هى دى مصر؟؟ ممكن تكون فعلا كده بس مش بس كده<br />الجزء الاول من الفيلم جعل جميع المشكلات لكل الابطال جنسيه بحته بشكل يثير الاشمئزاز<br />عادل امام رجل لا يهتم الابشهواته ومغامراته مع الساقطاتوعندما تعنفه اخته اسعاد يونس يرد عليها بان عدد من اقاموا علاقات معها اكتر من اعضاء حزب الوفد القديم والجديد<br />ونور الشريف رجل كبير السن لكنه لازال فى حاجه ملحه الاشباع رغبته الجنسيه الجامحه<br />وهند صبرى لا تستطيع الاستمرار فى اى عمل لتعرضها دائما لمحاولات جنسيه من اصحاب العمل حتى تقنعها صديقتها بان تمشى امورها وتقوم بذلك لكن من فوق الهدوم!!!<br />هذا كله بخلاف الخط الطويل المقزز بالفيلم وهو خط خالد الصاوى الصحفى الشاذ والذى استفاض الفيلم فى توضيح شذوذه<br />هذا كله كاننا فى مجتمح حيوانى جنسى بحت لايهمه سوى ارضاء هذا الجانب<br />بالرغم من وجود خطوط اخرى فى الفيلم عن الفساد السياسى اكثر اهميه مثل تعاطى جهاز امن الدوله مع المعتقلين<br />وايضا فساد الحكومه المتمثل فى شخصيه الوزير خالد صالح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"

