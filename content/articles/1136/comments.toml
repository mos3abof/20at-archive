text = "بجاحة المجتمع في عرض قضاياه غير محتملة ,انا عايز اسم فيلم واحد عرض مشكلة و حلها<br />كل المشاكل اللي اتعرضت زادت و استفحلت و الناس اتعودت عليها بدءاً من مشاكل الزواج العرفي و علاقة الشباب و الفتيات و الأختلاط و التدخين و الأدمان و و و و و نهاية بقذارة الجنس لعادل امام و فحش اللواط<br />ايه الفايدة من اعادة مشاهد الجنس<br />ايه الفايدة من تاكيد العلاقات الحرمة<br />مفيش فيلم اتعمل يرصد الفئات المستقيمة و الملتزمة فالمجتمع كلها افلام جنسية لأثارة الشهوات و استثارة الرغبات<br />العقل طالما تعود الخطأ الفه و حبه و ان انكره و كذلك العين , لذا فان هذه النوعية من الأفلام تهدم و لا تبني ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"

