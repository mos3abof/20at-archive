[[comments]]
order = 20
subject = "وجهة نظر"
author = "مصرية- - - - العمر 14 سنة"
posted = "2006-06-30"
text = "أولا أوجه اللوم الأخ محمد السيد على كتابة اسمه ألا تعلم أننا بلد تحب الهدوء و تتخلص ممن له صوت عندما تحب أن تكتب بهذه الجرأه لا تكتب اسمك و أحمد ربنا أن أنت لسه فى بيتك و رجاء حافظ على نفسك جيدا مصر تحتاج لمثل هذه الجراءة أماالأخ واحد مصرى فأنا أرجح أول حل أن يموت الريس بس أنت عارف و أنا عارفة ممكن أشباحة اللى فى كل حته تتطاردنا كمان ممكن يطلعوا قانون يعيدوا فيه الملكيه بالوراثة وندخل جحر الثعبان الأصغر بس فى النهايه أنا سعيدة أن فى فيلم زى دة اتعرض بعيد عن المشاهد الخارجة القليلة اللى فى الفيلم فهذه ليست عيب بل داء فى السينما المصرية ،الفيلم فى غاية الجرأة والشجاعة ولو قرأ أحد من الثعابين أى كتاب غير (النصب كيف يكون ؟) لعلموا (أن الله لا يغير ما بقوم حتى يغيروا ما بأنفسهم ) كيف يقولون أننا بلد ديموقراطى و هم أنفسهم اللذين سرقوا بل و نهبوا أمام أعيوننا كل شىء فيما عدا ألسنتنا لا يقدرون منعنا من الكلام رجاء كل من يرى أحد منهم أن يقول لهم أننا عندما نتعلم أن نقول كلمة حق ندرب على التعذيب في السجون والمعتقلات -------شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"

