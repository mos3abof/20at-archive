posted = "2006-06-24"
text = "ان هذا الفلم \"فى إعتقادى الشخصى\" هو خطو نحو شكل جديد للسنمة المصريه. وهناك نقطاتن اريد ان اذكرهم وهم :- رغم ان الفلم ناقش مواضيع فى خايه الحساسيه إلا أنه لم يكن إباحياً وكان منصفاً. وثانيا الإخراج كان جديد من نوعة او علا الأقل كن ذو نكه خاصة لم تدع لنا أختيار سوى إحترام المخرج"
