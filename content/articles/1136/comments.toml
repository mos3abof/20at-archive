text = "مش الزفت ده هو اللي حيكون قائدنا و نبينا و سيدنا لحا مشاكلنا<br />أنا لم أشاهد الفيلم و لن أشاهده<br />لإن باختصار واحد قواد و حرامي و بألف وجه زي عادل إمام هو أحد أسباب المشاكل التي تعاني منها مصر<br />و أقولها بكل صراحة و لا ينكرها إلا معاند<br />اللاعادل إمام المنافقين يكن عداء للإسلام أكثر مما كان يكنهابن أبي سلول و حيي بن أخطب للرسول (صلى الله عليه و آله و صحبه و سلم ) و الحجة جاهزة .. مكافحة الهرش ( قصدي الإرهاب )<br />أكرهك من كل قلبي أكثر من كراهيتي لبوش و أولمرت"
