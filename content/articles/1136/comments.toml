subject = "ده رأيى و بس"
author = "واحد مصرى"
posted = "2006-06-28"
text = "المشكلة مش مشكلة فيلم<br />القضية موجودة و لايمكن إنكارها سواء الأعمال الأباحية الموجودة بالمجتمع أو السلوك الأمنى السئ و القميئ فعلا , لكن السؤال ؟<br />الى متى هذا الفساد....<br />أما أنا فلا أعلم<br />و يمكن حد يعرف و يقولنا أمتى الفساد يخلص...<br />1- لما يموت الريس ( و لا يمكن يتقتل فى حادثة أنما الأمر الألهى هو الوحيد القادر علية )<br />2- لما أمريكا تخش مصر ( ده برده صعب طول ما الريس بيكسكس )( كلمة بيكسكس كلمة كروية تطلق على المدافعين عند التراجع )<br />3- لما نشوف حلمة ودننا<br />4- مش عارف"
