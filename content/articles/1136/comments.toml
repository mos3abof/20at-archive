text = "طيب ايه فائده عرض واقع مصر المزرى ؟؟؟<br />ما احنا كلنا عارفين<br />و جرائد المعارضه بقالها 100 سنة مش بتعمل حاجه غير عرض المصائب و الكوارث<br />ايه الإضافه ؟؟؟<br />من فعلا يضيف و يغير هو الذى يقترح حل و ينفذه و ليس من يمسك الجرس و يمشى يقول فيه مصيبه فيه كارثه"
