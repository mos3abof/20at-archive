subject = "الفيلم على عيني و راسي بس............"
author = "المجهول"
posted = "2006-09-08"
text = "السلام عليكم و رحمة اللة و بركاتة<br />يا جماعة مفيش حد ينكر ان الفيلم دة جميل جدا و في غاية الروعة و الجميل فية انة رصد جوانب الحياة المصرية المعاصرة بحبكة فنية درامية عالية الدقة<br />و انا اعارض كاتب التعليق باسم<br />علاء عبد اللطيف منصور ابو سمك لبن تمر هندي و اقول لة بصراحة الفيلم عالي الدقة سواء في التاليف او المونتاج او الاخراج او .........<br />و لكن يظهر انك دخلت الفيلم دة و كن متضايق شوية و بعد كدة انتة اية اللي عرفك ان الناس كلها كانت عايزة تسيب الفيلم و تمشي ...همة كانو بيعيطوا ولا حاجة ولا راحو عندك و اشتكولك<br />و متزعلش مني دة كان رايي<br />و بصراحة انا بشكر (المصرية....14) على جرائتهاو تعليقهااللي اثار دهشتي و بقول لها (خلي بالك من نفسك و يا ريت كان في زيك في البلد تمانين مليون ...كانت هتفرق كتير)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"
