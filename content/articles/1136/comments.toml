posted = "2006-06-24"
text = "بجد الفيلم مستواه متوسط<br />طول الفيلم متقدرش تحس ان فى مخرج بجد<br />وعلى فكرة السيناريو مقدرش فعلا يضيف اى حاجدة للرواية بالعكس السيناريو ضعيف وقماشة الرواية يطلع منها احسن منكده<br />الناس اللى انبهرت بالدعاية بتاعت الفيلم<br />لازم تعيد نظر بشوية تفكير<br />تحية للمبدع خالد الصاوى والرائع عادل امام<br />والجيد محمد عادل امام<br />ومش عارف هو مراون بقى مخرج ليه"
