subject = "عمارة الهاويه"
author = "علاء عبد اللطيف منصور"
posted = "2006-06-21"
text = "الفيلم كمثله من الافلام التى تعرض علينا صبح مساء ليس له قيمه لم يعالج قضيه واحدة من القضايا المطروحة فيه جاء فيه الكثير من المغاطات التى تسىء الى المجتمع الذى نعيش فيه الاساءة وصلت جميع فئات المجتمع العامل والمهندس وحتى الطلاب<br />لست ادرى كيف اوصف حالت الاشمئزاز من هذا الفيلم والسخط الذى اصابنى عند مشاهدتى له انا وجميع من كان فى دار العرض حتى ان الكثير كان يؤثر الخروج و عدم اكماله المهم انه كان سمك لبن تمر هندى والعوض على الله ان كان هذا هو حال الجميع كما يصورة الفيلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"

