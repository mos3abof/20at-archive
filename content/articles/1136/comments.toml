[[comments]]
order = 28
subject = "مع خالص احترامى"
author = "اللبنانى"
posted = "2006-07-10"
text = "اولا احب ان اقدم خالص الشكر الى كل العاملين فى هذا الفيلم,بس مع خالص احترامىوبعد ماشفت كل التعليقات اللى على الفيلم من الزملاء احب ان اثير نقطة وتساؤل.<br />1- الفيلم فعلا بيناقش قضية مهمة فى مصر ومش بعيد فى الوطن العربى كله,بس الرقابة سمحت لاجزاء من الفيلم بالعرض واتكتب على الافيش للكبار فقط<br />وعمرى ماشفت لادارة سينما تمنع الصغار من الدخول مع انهم زى مامعظمنا عارف مراهقين ودماغهم فاضية.<br />2- الحاجة اللى انا استغربتها وانا داخل السينما ان 90% من الموجودين من البنات ( غريبة صح )<br />3- الفيلم وضح المشكلة بجراءة تتقدر لصانعى الفيلم بس فين الحل,الشعب عارف المشكلة بس مش لاقى الحل ,ساعدوه علشان نستريح كلنا<br />واحب انى اقول الاختلاف فى وجهات النظر للفيلم ده ممتازة لانه بيوضح حاجات كتر ممكن تغيب عننا<br />الدنيا بتتغير لازم احنا كمان نتغير والا مش هايبقى لينا لازمة فى الحياة<br />اللبنانى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"

