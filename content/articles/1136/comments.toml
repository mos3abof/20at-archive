[[comments]]
order = 12
subject = "ثم أما بعد.."
author = "قلم جاف"
posted = "2006-06-25"
text = "فيه مدرستين ، مدرسة تشوف الفيلم قصة وتحاسبه عليها ، ومدرسة تشوف الفيلم مناظر (قصدي هنا الصناعة السينمائية وفنيات التصوير والمونتاج والصوت والموسيقى والتمثيل)..<br />بالتأكيد المدرسة التانية حترجح جودة الفيلم ، لأنه مصروف عليه , زي معظم أفلام شاهين ..<br />لكن لو عرضناه على المدرسة الأولى ، فيه كلام..<br />محمد هيكل كان محق لما قال إنه ما فيش جديد في العمارة .. نفس الكلام اللي بيتقال في صحف المعارضة بشكل زاعق وحتى في روزا اليوسف اللي بيكتب فيها سيادة الكاتب السيناريست الكبير.. زائد إنه جه بعد فترة قصيرة نسبياً من فيلمه دم الغزال واللي تناول فيه مشكلة التطرف والإرهاب.. برضه بنفس الشكل السطحي والكوميدي اللي ما تغيرش من ساعة مسلسله الشهير \"العائلة\" سنة 1994..<br />زائد إني مش معاك في مسألة إن مشهد \"زمن المسخ\" مش مفتعل .. مفتعل ونص .. وجايز صعب تصدقه من عادل إمام ، وإن كان يحسب له إن حاول إن الناس تضبطه متلبساً بالتمثيل!<br />ممكن أفلام كتيرة كويسة تناقش قضايا بشكل أقل زعيقاً وأهدى وأعمق وأكثر عقلانية ولا تتكلف كل تلك المبالغ الباهظة التي لا تشفع لأصحابها في المشاركة في المهرجانات الكبرى.. سواق الاتوبيس ماتكلفش ملايين ومع ذلك لسة عايشين عليه لحد دلوقت!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"

[[comments]]
order = 13
subject = "عماره بعقوبيان ..معنا ام علينا؟؟؟؟؟"
author = "نيفين نيفى نوفا"
posted = "2006-06-25"
text = "محدش يقدر ينكر ان الفيلم حكايه<br />لبرومو لوحده كفايه دا زائد التسويق الكبيييير للفيلم من قبل جود نيوز<br />و احساسى بيقوللى ان الفيلم كويس و شكله ميتنسيش بعد ما يتشاف<br />و لكن<br />هل الفيلم فى صالحنا ام ضدنا<br />بمعنى<br />هل مشرف لينا ان يتعرف ان دا واقع مصر<br />عرفه ان حد هيقوللى طيب ما القنوات و الجرائد على راسهم قناه الجزيره الغراء بتعرض و تشوه ليل نهار بس السينما سينما<br />السينما ليها بريق لا يقاوم<br />كام واحد يقرا روايه او يتابع نشره اخبار و كام واحد يحب يشوف فيلم؟<br />لكن ان كان علينا نتقهر نتحرق نولع دا العادى بس بلاش صورتنا ادام العالم تبقى كدا كمان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"

[[comments]]
order = 14
subject = "عمارة يعقوبيان"
author = "زمان الوصل"
posted = "2006-06-26"
text = "يبدو أنّها سمه عامه ان يكون الفيلم المقتبس عن روايه أقل منها فى المستوى و الموضوع ليس قاصرا على يعقوبيان !!<br />لكن المشكله فى الفيلم ليست فقط فى خيال القارئ الذى لا تحدّه ميزانيه او امكانيات ممثل .. المشكله ان الروايه طويله وبها كثير من التفاصيل و المسارات التى ربّما كان ينبغى إمّا اختيار بعضها فقط او التعامل معها بتركيز اكبر .. \"محدش يسألنى ازاى\"<br />على افيش الفيلم كتب اسم \"علاء الاسوانى\" بخط رفيع و صغير مقارنة باسم \"وحيد حامد\" الذى وصف بأنه كاتب النص السينمائى !! وهذا فى رايى ظلم كبير لعلاء لأن الروايه من الاساس كانت مليئه بالتفاصيل التى لا تحتاج سوى من ينفذها على الشاشه .. بل قد يضطر النص فى بعض الاحيان لانتهاج بعض الركاكه و التبذّل فى الاسلوب كى يتفق مع الاذواق و الخلفيات المختلفه لمشاهديه على عكس الروايه<br />برغم مدح الكثيرين فى اداء عادل امام الاّ ان هذا لم يكن ساريا على جميع مشاهده بالفيلم فبعضها كان جيد فعلا .. لكن مشاهده العنتريه بالفيلم لم تختلف كثيرا عن مشاهده فى اى من افلامه السابقه .. و استفاض الفيلم فى التركيز على قصته هذه على حساب قصص أخرى حرمت من تناول مستفيض مثل قصة طالب الجامعه الذى تحوّل الى ارهابى بعد ان انتهك رجال الامن عرضه ..<br />لم استطع ان اتصوّر ان \"زكى\" الذى يمثله عادل عاش فى فرنسا و درس بها و والده باشا !! ربّما لانه عادل امام ..<br />نور الشريف يبدو ان تواجده التليفزيونى المكثّف اضرّه اكثر ممّا افاده .. شعرت وانا اشاهده انى اشاهد احد ادواره التليفزيونيه الاخيره !! ولم يكلّق خاطره باختيار طريقه اقل حداثه لتصفيف شعره او حلاقة ذقنه و شاربه !! كانوا روشين اوى بالنسبه للحاج عزّام !! ناهينا عن طريقة تمثيله التى لا ادرى لماذا باتت معلّبه<br />مع الاسف الشديد .. خالد الصاوى و باسم السمره فى دورى الشاذ و صديقه ربّما يكونا بالفعل افضل من مثّل بالفيلم .. و اقول مع الاسف لان خالد استجلب بعضا من التعاطف الذى لا ينكر حين فوجئ برحيل صديقه الى بلده بعد وفاة ابنه الصغير .. هذا التعاطف الذى لازال الشعور بالاشمئزاز و الاستنكار من بشاعة الفعل نفسه يحول دون ثبوته ام تقبّله ..<br />وبالرغم من \"تخصص\" وحيد حامد فى الكتابة عن الارهاب .. لم يمنح قصّة الارهابى العمق الذى تستحقه .. بالقصه تشعر ان كثيرا من الظلم وقع على طه .. ورغم هذا فهو حين قرر الانتقام اختار ان ينتقم ممّن آذوه فقط وعلى وجه التحديد .. خاصة وكل ما ارتكبه من جرم هو المشاركه فى المظاهرات .. لكن اداء \"محمد عادل امام\" لدور طه ذكّرنى بعادل امام و هو شاب .. اداء به جمود يحتاج بعض الحيويه ربّما .. ولا افهم لماذا اختيار وجه جديد لاداء هذا الدور رغم عدم وجود سوابق تمثيليه تؤيد ترشيحه !!<br />ما علينا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"

[[comments]]
order = 15
subject = "اخراج جيد جدا نص وفكر يزداد انحدارا......الى المالانهية"
author = "انسان واعي"
posted = "2006-06-27"
text = "لا استطيع التعليق على مادة الفيلم فهي لا تحتاج للتعليق وان كان شكله ذا نقلة نوعية في عالم السينما المصرية، الغريب أني لم أر هؤلاء الفنانين!!! البارين لوطنهم الذين يعكسون مدى تردي الحياة و القيم والاخلاق ...يحاولون ولو محاولة واحدة ادخال البهجة الى قلوب الناس و اشعارهم بانسانية المجتمع وأن الحق باق وأن الخير لم يمت في قلوب الناس.......لالالا المجتمع منحط سافل كريه بلا اخلاق بلا قيم يفتقر الى معايير الحضارة فكل فرد هو مجرم ارهابي تافه عن سبق الصرار والترصد مذ ولدته امه............<br />أهذا هو الفن؟........<br />أهذه رسالتهم؟........سحقا لهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"

[[comments]]
order = 16
subject = "طيب يا سيدي انا حمار"
author = "خالد حجازي"
posted = "2006-06-27"
text = "شكراً يا أخ كريم علي تحليلك للفيلم بس انا عاوز اتكلم في حاجة تانية ... عاوز اعلق علي الأخوة و الأخوات اللي شايفيين أن الفيلم معالجش قضايا المجتمع.. مش فاهم ايه المقصود يعني؟؟ هوا من امتي وظيفة السنيما طرح حلول؟ و نفسي اعرف مين اللي علم الناس تتخيل أن ممكن فيلم مثلاً يغير المجتمع و معلهش هاقولها تاني علشان مجناني يعني ايه السنيما تلاقي حل للمشاكل؟؟ و النبي تقوللي مثل كده؟؟ زي ايه يعني؟؟<br />السنيما طول عمرها شغلنتها انها تقدم الواقع و تعكس مشاكله و ايوة اهم مهمة للفيلم انه يمسك جرس و يقول المشكلة موجوده اهه و مش فاهم الناس اللي كانو في العرض مع الأستاذ و سابوا الفيلم و خرجوا ما سابوش ليه البلد كمان و ميشيوا بالمرة ما دام الواقع مؤرف قوي كده<br />و ممكن تشوفوا أي فيلم من افلام اللأربعينات اللي كان البطل و البطلة بيتجوزوا في الأخر و يعيشوا في تبات و نبات و سعاده علشان يحسوا بالأمل بيحيط بهم و الف سلام لطائر النعامة بوضعه الشهير<br />و والنبي و النبي و النبي يقولوليي إيه هيا رسالة الفن علشان تعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133035/http://www.20at.com/article2.php?sid=976"

