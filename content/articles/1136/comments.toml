text = "يا شباب.. الفيلم مهم يتشاف، وحاولوا فعلا تشوفوه لانه سينما بجد بعيد عن الهرتلة اللي احنا بنشوفها..<br />على العموم انا لسه شايف الفيلم من دقايق، ومفيهوش مشاهد خارجة خالص، بالعكس، المشاهد اقل فجاجة من مشاهد موجودة في أفلام كثيرة موجودة.. شاهدوا الفيلم، واكتبوا رأيكم.. وبالتأكيد سيسعدنا في \"عشرينات\" أن ننشر هذا الرأي..<br />راسلونا على<br />contact20at@yahoo.com"
