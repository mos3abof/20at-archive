subject = "الموضوع جميل ومفهوم"
author = "Apple"
posted = "2006-04-19"
text = "أنا مش فاهمة الناس اللي بتشتم في الموضوع بتشتم ليه، الموضوع لطيف جداً وبمنتهى البساطة بيتكلم عن الناس اللي بتستخدم البلوج أو المدونات في التأثير على السلطة أو لوصول صوتها لجهات عليا... شكراً للكاتب من الرباط...<br />وكفاية شتيمة في موضوعات الخلق والناس اللي تعبت فيها وكتبتها..<br />لو مش عجبانا نقول ليه مش عجبانا علشان الكاتب يستفيد والقراء برضه مش أي عك وشتيمة وخلاص<br />سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114754/http://www.20at.com/article2.php?sid=711"

