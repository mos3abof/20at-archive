order = 0
subject = "المدونات ولماذا ؟"
author = "حسب اللة السادس عشر"
posted = "2007-02-18"
text = "المدونات هى رئة تنفس هواء طبيعى غير ملوث بكتابة المنشورات الحكومية فى الصحف الغير قومية التى تمجد الحاكم والتى لا تعنينا ان كان اتصل بفلان او قعد مع فلان وشربوا فنجانين قهوة واتكلموا فى امور لاتعنينا اطلاقا وهذة المنشورات يكتبها صحافيون مرتزقة يتمتعون بالسفر على طائرات الرئاسة وياكلون افخم الطعام<br />ويتناولون نسبة من دخل الاعلانات جزاءا وفاقا<br />نحن نكتب على السجية وننعى حظنا الهباب ونشكوا من البطالة وقلة الرزق والحيلة ونتكلم عن الفساد والسياسة باسلوب فج وجارح احيانا ونكشف قضايا التعذيب والسرقات<br />ونشتم من شاء لمجرد ان قلبنا يكرهة<br />اننا نتنفس هواء طبيعى"
archived = "2007-02-20"
capture_url = "https://web.archive.org/web/20070220151440/http://masr.20at.com:80/article.php?sid=1609"

[[comments]]
order = 1
subject = "اشهد ان لا الة الا الله وان سيدنا محمد رسول الله"
author = "مين غير كوكو كوكو"
posted = "2007-02-18"
text = "قبْــلِ مــا ْ .. نبدأ كلامنــا<br />فــِ الـدِّيانــة وسيــن وجيــم ..<br />كلِّنــا ْ..لازم نسمِّي ..<br />بسم ِ أمريكا العظيم<br />كلِّنــا ْ .. لا ّزم نقـدِّم للإلّهــة ــ<br />تحــتِ رجليهــا القويــة ..<br />واحنــا بنبــوس ِ الأيــادي ــ<br />قربــان ولاء<br />كلِّنــا ْ .. لازم نطـاطــي وْ .. نتقي شرّ الإلهـــة<br />كلِّنــا ْ .. نسجـــد لهـــا<br />( غيَّــرْ قِبْلِتــك للغـــرب ..<br />واحمــد واشكــر<br />سبِّــح .. سبِّــح )<br />بسم ِ أمريكا العظيم<br />درسنـــا اليــوم عن مبــادئ ..<br />الديــانــة الأمـريكيـــة<br />الديــانــة الأمـريكيـــة هيَّ إنِّ الربــة تطلــب ..<br />واحنــا كـلِّ ما علينــا بدون تـردد نبتسم ..<br />ونقـول لهـا \" أمـر ِك مُطـــاع<br />مانتـــوا عارفيــن \" أمـريكيــة \" ..<br />كلمــة مشتقــة أسـاســاً من لغتنــا ..<br />هيَّ \" أمـــر ِك \"<br />الديــانــة الأمـريكيـــة هيَّ إنِّ الربــة تقتــل ..<br />واحنــا ندفــن<br />هيَّ إنِّ الربــة تبنــي نار نيرانها فــِ العــراق<br />هيَّ إنِّ الربــة جنــة للي يسجــد<br />انتهــى الدرس ِ يا ســادة ..<br />ممكــن آخد كــام ســؤال<br />أيـــوة قـــول<br />ــ هــوَّ ليــه أمريكــا ربِّ مـشْ إيـران ؟<br />ــ مش إيــران أو غيــر إيــران ..<br />هيَّ أمريكــا لْـوَحِـدْهــا تمتلــك مليــون صفـــة ..<br />تعلــو بيهــا عن إيــران أو غيــر إيــران<br />هيَّ أمـريكــا القويــة ..<br />هيَّ أمـريكــا القـديــرة ..<br />هيَّ أمـريكــا العليمـــة والخبيـــرة والكبيـــرة ..<br />هيَّ أمـريكــا اللي شــاءت أنْ يكـــون ..<br />لازم يكـــون<br />ــ ميـــن رســولهـــا ؟<br />ــ مـش رســول لأ دُول رســل ..<br />اقرأ بقية التعليق .."
archived = "2007-02-20"
capture_url = "https://web.archive.org/web/20070220151440/http://masr.20at.com:80/article.php?sid=1609"

[[comments]]
order = 2
subject = "هو الجيش فين ؟"
author = "إبن بهيه"
posted = "2007-02-19"
text = "مش قارفين عيشتنا بقالكم ربع قرن وعايزين فخفخامة جلالة الواطي يلغي قانون الإرهاب .. طيب آدينا لغيناه أهو يبقى عايزين إيه تاني ؟<br />صحيح شعبنا شعب غريب ؟<br />فخفخامة جلالة الواطي مش مكسوف من نفسه ؟<br />هو البعيد ما عندهوش ريحة الدم خالص ؟<br />طيب الشماشرجية وعناصر العصابات التانيين برضه ما عندهمش دم كده خالص ؟<br />فيه بلد في الدنيا تتحكم خمسة وعشرين سنه بقوانين عرفية وطواريء؟<br />وفيه بلد يف الدنيا يتحشر في دستورها قانون طواريء ؟<br />طيب ده حتى من إسمه .. اسمه طواريء .. يعني لظرف طاريء ويعدي<br />نقوم نحطه في الدستور ؟<br />طبعا ما هو فخفخامة جلالة الواطي عايز يسيبها متظبطه للواطي الثاني وريث عرش الجمهورية عشان ما حدش يفتع بقه معاه ولا يطلب منه إلغاء الطواريْ<br />والله بجد حاجه تكسف<br />ما تعيشه مصر اليوم لم تعشه منذ قرون طويله .. والله في زمن حكم المماليك ما كانش كده غلب وعك<br />مصر يا فخفخامة جلالة الواطي التي لا تعرف قدرها ولا مقدارها لأنك واطي وآخر حدود بصرك الأعمى عقب جيب اللي جنبك (وتلاقي إيدك جواه كمان) كبيره .. كبيره أوي أوي يا واطي وما يصحش يتلعب في دستورها كده<br />دستور مصر .. مصر<br />يبقى كده ؟؟؟ لعبه في إيد أي عميل ماسوني واطي ؟<br />ما علهش يا مصر .. ياما دقت ع الراس طبول .. والفرج قريب والله .. كلما زاد العك والتخبط والجنون لدرجة دسترة الطواريء يبقى أبشري بالنصر يا مصر<br />بس يا رب ولادك يلحقوك قبل ما الصهاينه وعملائهم يرموكي في الجحيم<br />طيب هو الجيش فين من كل ده؟<br />أيوه مش هابطل أسأل السؤال ده لغاية ما ألاقي الإجابه ..<br />هو الجيش فين ؟<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-20"
capture_url = "https://web.archive.org/web/20070220151440/http://masr.20at.com:80/article.php?sid=1609"

[[comments]]
order = 3
subject = "أهو كله في الدستور برضه .."
author = "إبن بهيه"
posted = "2007-02-19"
text = "منذ اعتلى مبارك كرسي الرئاسة في 1981م وهو يوصم نفسه كذباً عبر وسائل إعلامه الممولة من قوت أبنائنا أنه رجل الإصلاح والتغيير والتطوير والإنجازات ، بعد أن قضى فترة رئاسته الأولى وتمرغ في قصور الرئاسة المخملية ، بدأ الإعلام المصري مرحلة جديدة فكان يؤرخ لكل شيء في مصر من العام 1981 ، في شتى المجالات كنا نسمع منهم أن إنتاج الكذا قبل عام 1981 أصبح إنتاجه اليوم كذا وكذا وكذا .. بعد إضافة صفر كل عام حتى لم يعد لدى شامشرجية النظام أية أصفار وهمية يضيفونها ويلطخزن بها صفحات جرائد مبارك الصفراء ، كنا نعي حين سمعنا التأريخ الجديد لمصر عبر إعلام مبارك أننا بحق مقبلون على عصر جديد ترزح مصر فيه تحت ويلات الأساليب الجديدة في النصب والدجل الحكومي والديكتاتورية الموديرن المزينة بالفيونكات الديموقراطية وآخر موضات الدعارة السياسية والإعلامية.<br />بيانات توظيف شباب فاقت كل الأمنيات حتى أنك لو أحصيت ما صرح به الطاغية مبارك ورؤساء عصاباته المتعاقبة منذ (لزق) في الكرسي لوجدت أنهم وظفوا كل الشعب المصري والشعوب المجاورة . بيانات نمو اقتصادي لو لملمتها خلفهم من جرائدهم الحكومية لاستغربت كيف أن الاقتصاد المصري قد فاق كل اقتصاديات الدول المتقدمة مجتمعة. خدمات ، مرافق ، تعليم ، صحه كله تمام التمام وفق بيانات العصابات .. حين كان الناس تفيقون على فترات متباعدة مستغربين ، كان يفاجئهم الطاغية بأداء دور مسرحي كوميدي هابط لممثل فاشل على مسرح البرلمان في عيد العمال مستنكراً عبر نكاته السمجة الزيادة السكانية التي تلتهم كل الأصفار الوهمية التي يسوقها إعلامه للناس من تطور وتقدم ، ويضحك الناس على شر البلية ..<br />ربع قرن .. خمسة وعشرون عاماً من النصب والدجل والدعارة السياسية تحت حماية قانون الطواريء الذي يكمم الأفواه<br />اقرأ بقية التعليق .."
archived = "2007-02-20"
capture_url = "https://web.archive.org/web/20070220151440/http://masr.20at.com:80/article.php?sid=1609"
