[[comments]]
order = 14
subject = "جبهة عمال يورك شاير ولانكشاير"
text = "اتحاد نقابات عمال يورك شاير ولانكشاير واتحاد طلاب جامعة يوركشاير وجبهة صيادلة يورك تؤيد وتبايع دوقة يورك ودوق لانكشاير ضد الهجمات المتصلفة والمتعنجهة لسيادة المحافظ وتطالب ذلكم المحافظ بالتنحي عن منصبه لمن هو أنفع للأمة وللمحافظة ... كما نؤيد ونبايع غاندي البلد على خطواته الحثيثة من أجل المحافظة ..وربنا يخلي لنا يورك شاير ودوق لانكشاير ضد أعداء الأمة<br />وعلى رأي غاندي البلد : إخص إخص إخص"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814232558/http://www.20at.com:80/article.php?sid=321"

[[comments]]
order = 15
subject = "دوقة يورك"
text = "عاجل إلي سيادة المحافظ:<br />مفيش حاجة اسمها يورك النيو..اسمها نيويورك.. ودي مدينة - حاجة كده زي محافظة- في بلد على شط المحيط - حاجة كده زي الحوض بس على كبير - ..اسمها الولايات المتحدة الأمريكية.."
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814232558/http://www.20at.com:80/article.php?sid=321"

[[comments]]
order = 16
subject = "غاندي البلد"
text = "بجد صعبان عليا يا سيادة المحافظ..<br />بص.. الأخوات لبعضيهم .. ولازم يقفوا جنب بعض في محنة زي دي .. أنا رقبتي سدادة..<br />تحب أتضامن معاك؟! ..<br />صدقني أنت محتاجني بشدة ..<br />أنت لوحدك يا برنس.. والغربة وحشة .. وخاصة لما تكون لوحدك أمام دوقة حتة واحدة وأنت يا دوب محافظ لا بتهش ولا بتنش..<br />فعلاً على رأيي: اخص إخص إخص يا دوقة يورك .. ماعندكيش أخوات ولاد؟؟؟؟؟؟؟"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814232558/http://www.20at.com:80/article.php?sid=321"

[[comments]]
order = 17
subject = "سيادة المحافظ"
text = "طيب<br />طيب<br />طيب<br />واحدة واحدة بس يا جماعة<br />والهدوء مطلوب في اللحظات الحرجة دي<br />أولا<br />انت ياد يا غاندي البلد<br />نصاب ومدعي<br />ليه؟<br />قلت لي ليه<br />لأنك يا بطل لطشت مني إخص<br />إخص<br />إخص<br />دي بتاعتي ماركة مسجلة وحقوق الملكية الفكرية محفوظة واسأل \"فكرية ديجيتال\"<br />تاني حاجة يا نصاب انا مش محتاج لأمثالك لتعزيز مواقفي خاصة إني مسنود في موقع المحافظة من الريس الكبير<br />وانت فاهم وانا فاهم<br />واخص<br />اخص<br />اخص<br />ع اللي يبيع أخوه بالرخيص"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814232558/http://www.20at.com:80/article.php?sid=321"

[[comments]]
order = 18
subject = "سيادة المحافظ"
text = "دوقة يورك يا أختي العزيزة<br />أنا علشان خاطر حضرتك بنت<br />وكمان ثقافة غربية أفلام الكاوبوي وكدة<br />وبالتالي انجليش لانجويش<br />ويا عالم تلاقيكي كمان م المدارس اللي هي بتاعت كي جي ون وبتاعت البريك وبتاعت عيل واحد في الديسك<br />والعيال التانية أصلا أصلا عندهم ديسك<br />خير بقى عايزة ايه إن شاء الله....<br />بصي بقى يا بنت الناس خليكي بعيد في يورك شاير<br />يورك المحطة<br />وسيبيني أنا وغاندي البلد متشعبطين في أتوبيس متين وستة بتاع الاميرية - ميدان الجيزة<br />يللا<br />سلام"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814232558/http://www.20at.com:80/article.php?sid=321"

