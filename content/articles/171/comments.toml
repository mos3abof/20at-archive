subject = "سيادة المحافظ"
text = "الأخت دوقة يورك<br />بالنسبة لحضرتك سؤال واحد<br />هو انتي في يورك أنهين؟<br />يورك شاير ولا يورك النملة ولا يورك النيو؟<br />وطبعا أحب أختم كلامي بختم النسر الخاص بتاعي<br />إخص<br />إخص<br />إخص"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814232558/http://www.20at.com:80/article.php?sid=321"

[[comments]]
order = 9
subject = "سيادة المحافظ"
text = "معلش عشان نسيت حاجة<br />الموقع ده اتغير قوي<br />أول ما جيته كان فيه عيال ولاد بلد ولونين<br />دلوقتي بقى فيه ناس كتير فريش فريش<br />وخايفين الهدوم تتكسر<br />وونظام الس تي ايه وكدة يعني<br />أل ايه دوقة يورك واشي باسكت باللر وكمان lefairepart<br />الله يرحم أيام الجدعان<br />الشمحطجي والباشمهندس عمير وسطوحي البواب"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814232558/http://www.20at.com:80/article.php?sid=321"

