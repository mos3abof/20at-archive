text = "بصي يا دوقة يورك<br />بالنسبة ليورك شاير طبعا انا فعلا معرفهاش<br />بس باين في كتاب المواد الاجتماعية بتاع تانية ثانوي سمعت كدة انها منطقة صناعية في بريطانيا<br />قلت يا سلام<br />بتفكرني بشبرا(واخدة بالك) وكمان بهتيم ومصانعها الرطبة بالإضافة إلى أبو زعبل والحوامدية<br />أدي الموضوع لكن إن جيتي للحق أنا لا ليا في يورك ولا في شاير"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814232558/http://www.20at.com:80/article.php?sid=321"

