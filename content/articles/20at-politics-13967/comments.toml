text = "بصراحة لو عرض علي الهجرة سأهجر لكن من اجل الدراسة فقط وأعود لخدمة بلدي<br />اقسم بالله انا مأتكلم بالمثاليات اتكلم واقعيا<br />أما لو عرض علي ان اتجند في الجيش الامريكي لو اعطوني الدنيا وكل مافيها لن اقبل<br />وجهه نظر"
