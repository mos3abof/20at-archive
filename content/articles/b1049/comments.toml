subject = "لغة الله تعالت وتجلت في كتبه"
author = "saari"
posted = "2006-07-10"
text = "بغض النظرعن هويت هذا العالم وديانته الا انني احترم فكره واجله ولا انسى ناقل هذا الطرح الجميل فالله دره 1<br />فلغت الله تعالى تسمع وتبصر وترأ وتنظر وتقرأ وتكتب لنا ايآته في السمأرزقناوفي الارض معادناوفي أنفسنا ما وعدنا2<br />وما كان ربك نسيا وإن من شيا الا يسبحه سبحانه وقد علم تسبيح كل شى والحمد لله الذي انزل الكتاب ولم يجعل له عوج هدى<br />ورحمه وانيس وشفا وبصيره يبصرها الاعمى والاصم ويفقهها العربي والاعجمي فيخر لله تعالى تسبيحً وتكبير3<br />واماالذي استوقد نار فلما اضات واضاء الله<br />لمن حوله بعلمه وحوله سبحانه هنا يكون الابتلا فما ان يكفر اوان يشكر كما قال سيدناالشكور سليمان عليه السلام وما كفر سليمان<br />ولكن الشياطين كفروا,وكل انسان نسب علمه<br />وعمله لحوله وعلمه يذهب الله بنوه ويتركه في الضلمات وهؤلا هم الصم العمي البكم الذين لا يفهون 4<br />والله اعلم 5"
