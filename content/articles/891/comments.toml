[[comments]]
order = 0
subject = "بل بالفردوس بإذن الله"
author = "محمد علي"
posted = "2006-06-29"
text = "شهداؤنا في الجنة و قتلاهم في النار<br />اللهم وفق المجاهدين لدحر المجرمين الصهاينة قتلة الأطفال و الضعفاء<br />اقتلوا رهائنهم إن ازدادوا بغيا فدماءهم ليست أغلى من دمائنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124719/http://www.20at.com/article2.php?sid=1003"

[[comments]]
order = 1
subject = "لو مكانهم"
author = "نيفين نيفى نوفا"
posted = "2006-06-29"
text = "من قرر موتى يجهل ان الموت حياه<br />مين ميحبش اسمه يقترن بلقب شهيد<br />فخر ف الدنيا ونعيم ف الاخره<br />يا ريت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124719/http://www.20at.com/article2.php?sid=1003"

[[comments]]
order = 2
subject = "بشرالعشره بمرافقة العشره"
author = "ساري"
posted = "2006-07-10"
text = "انشاء الله ان البشائراوشكت<br />فعندما تصل النمله الي عنفوان تطورها<br />ينبت الله تعالى لها اجنحه فتغتر بقوتها<br />لا تعلم انهااصرمت وحان قطافهاوتلك سنته<br />سبحانه ولن تجد لسنت الله تبديل<br />تكبير<br />تكبير<br />الله اكبر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124719/http://www.20at.com/article2.php?sid=1003"
