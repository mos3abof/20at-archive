[[comments]]
order = 5
subject = "k_k88@hotmail.com"
author = "bebeto bebeto bebeto bebeto bebeto"
posted = "2006-02-03"
text = "لسلام عليكم ورحمة الله وبركاته وبعـــــــــــــــــــــد<br />افضل تحية وجل احترام<br />هذه المقادير كما هو مبين في هذه االمشاركةوستصبح احسن ساحرمن الدرجه الاولى ولكن ليس السحر المعروف والعياذ بالله وانما هو السحر المحبوب وتقبلوا تحياااااااااااااتي<br />وبصراحه انا مشتااااااااااااااااااق كتير أن تطبق الأمور التالية<br />المقادير :<br />1- ابتسم في وجوه الآخرين .<br />2- ابد أ بالسلام عليهم .<br />3- أظهر الحفاوة والترحيب .<br />4- ادع لهم ولوالديهم عند الفراق .<br />5- احترم الكبير .<br />6- ارحم الصغير ، وقبل رأسه .<br />7- اقبل الإنتقادات بروح طيبة .<br />8- لاترفع صوتك في الحديث والمناقشات .<br />9- اعترف بالخطأ في حال الخطأ .<br />10- اعترف بالفضل لأهل الفضل .<br />11- تغاضى عن هفوات الإخوان وزلاتهم .<br />12- انصح المقصر بلباقة ولين وتلطف .<br />13- تصدق على الفقراء والمساكين .<br />14- اعفي عن من ظلمك .<br />15- أكرم صديقتك وجارك<br />16- صل رحمك .<br />17 - أعط كل ذي حق حقه .<br />18 - أغثيث الملهوف .<br />19 - أعين المكروب .<br />20 - قم على حوائج الناس .<br />النتيجة :<br />بما مضى وغيره ، سوف تسحر قلوب الناس , وتسبي ألبابهم ، وتستميلها نحوك ..<br />مع تحيااااااااااااااااااااات<br />bebeto bebeto bebeto bebeto bebeto"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112826/http://www.20at.com/article2.php?sid=29"

