posted = "2006-01-29"
text = "بسم الله الرحمن الرحيم<br />احيي كل انسان يطلع على تلك الحضارة العريقة واقول كلمة ليس بعدها كلمة: انا ابن سوريا البار وسأبقى كذلك ابدا ما حييت سأحيا واموت في قلب عمري وحبيبتي ومهجة عيني سوريا قلب العروبة النابض.. واخذى الله كل من يريد الشر بسوريا.. ودمتم جميع<br />التوقيع<br />زهير / سوري مغترب في إحدى دول الخليج"
