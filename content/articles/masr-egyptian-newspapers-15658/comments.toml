author = "عمرو خالد رئيس"
posted = "2010-03-09"
text = "الذي ينفع ان يكون رئيس الجمهورية هو عمرو خالد<br />لماذا<br />الان لما اي واحد يتقدم الى شغل وظيفة لازم يقدم الـ (سي في) بتاعته<br />يعني لما واحد يتقدم لوظيفة مهندس مدني لشركة لازم يثبت انه فاهم هذه الوظيفة كويس وعنده خبره كويسه في هذا المجال علشان خاطر يثبت ان الشركة حتستفيد منه<br />اللي عايز يبقى رئيس جمهورية<br />وهذه وظيفة عند الشعب يعني حيشتغل رئيس جمهورية الشعب<br />فالشعب لازم يختار واحد يخدمه ويستفيد منه<br />والشعب زي ما انتو عارفين الغالبية العظمة فيه<br />عوانس وارامل ومطلقات ومسرطنين وعاطلين ومسروقين ومحروقين ومرضى لا يجدون الدواء الخ الخ الخ الخ<br />هذا هو حال الشعب المصري<br />فاللي عايز يشتغل رئيس جمهورية لازم يثبت انه فاهم ازاي حينهض بهذا الشعب المنكوب<br />وانا شايف ان ما فيش حد عنده خبره عملية في ماسي الشعب المصري الا عمرو خالد<br />سلام يا صاحبي<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2010-03-10"
capture_url = "https://web.archive.org/web/20100310054603/http://www.20at.com:80/masr/egyptian-newspapers/15658-2010-03-08-14-34-38.html"
