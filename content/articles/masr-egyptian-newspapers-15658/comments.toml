author = "رسالة نظيف الحقيقية"
posted = "2010-03-09"
text = "تلقيت صباح 6 من مارس 2010 قرار سيادتكم بتكليفي بمهام رئاسة الجمهورية،<br />وفضلت اعيطت اعيطت يا فندم لان سيادتكم حتعمل عملية<br />وانا زعلان جدا يا فندم والعروسة بتاعتي زعلانه اوي<br />ويا فندم ما ينفعش واحد جربوع مثلي يقعدم مكان واحد راجل عظيم مثل حضرتكم<br />لكن يا فندم انا ححاول اكون عند حسن ظن حضرتكم<br />وتأكد يا فندم ان ان مصر كلها ما تساويش حاجه من غير فردة جزمة سعادك يا فندم<br />مصر كلها عايشه بيك يا فندم<br />انت الهوا اللي احنا بنتنفسه يا فندم انا وجمال بيه مبارك وعلاء باشا مبارك وسوزان هانم يا فندم<br />انتو يا فندم بتفكروني بسيدنا علي وستنا فاطمه والحسن والحسين<br />اي والله يا فندم<br />بتفكروني بال البيت يا فندم<br />روح يا فندم اعمل العملية وانت مطمئن وحندعيلك انك ترجعلنا بالسلامة يا فندم<br />سلام يا فندم<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2010-03-10"
capture_url = "https://web.archive.org/web/20100310054603/http://www.20at.com:80/masr/egyptian-newspapers/15658-2010-03-08-14-34-38.html"

