[[comments]]
order = 0
subject = "هيييييييييييييه هقتل"
author = "معاذ محمود عامر"
posted = "2006-11-01"
text = "لأ لأ أنا مش شايف القتل هو الحل الا في حالات خاصة ملهاش حل الا القتل<br />أكيد هقتل الرائد سيف الجارحي بتاع أمن الدولة اللي جه اعتقل والدي وقل أدبه عليه بس قبل ما اقتله هفقع عينيه بعد كده أقطع عضوه الذكري بعد كده أسيبه يعيش عشر أيام زي ما هو كده وبعدين أطخه<br />طبعا مش هقول مبارك لأن ساعتها مصر كلها هتتطوع بالمهمة الجليلة دي<br />بس كده انما مفيش حد تاني أيا كان خلافي معاه يستحق اني أسلب روحه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103242/http://www.20at.com/article2.php?sid=1398"

[[comments]]
order = 1
subject = "أقتل مين ؟؟ كتييير"
author = "ahmad hima"
posted = "2006-11-01"
text = "إذا كانت الحكاية جد وفيها قتل بقي وكلام من ده يبقي هتتعبوا معايا خدوا عندكم :-<br />1-وزير التعليم العالي : لاننا كطلبة كارهين الجامعة بوضعها الحالي وهو جه يكملها وبيقول إلغاء لمجانيةالتعليم<br />2-وزير التربية والتعليم : علشلن الثانوية العامة والخالة وإلى اخره<br />3- الراجل اللي بيبيع شرايط تحت بيتنا ك أصل بعيد عنكم مش ممكن تنام قبل الساعة 2 الصبح حتي لو أنت راجع مقتول من سفر أو غيره ( مش هتعرف تغمض عنييك بجد )<br />4- بتوع مجلس المدينة عندنا : علشان على طول ينفضوا ومشغلينها طناش على الراجل بتاع الشرايط .<br />القائمة طويلة بس كفاية دول وخلينا بعيد عن بتوع أمن الدولة لحسن باين عليا هروح فى داهية إن كملت .....<br />أحمد إبراهيم ( جيفارا )<br />حاسبات ومعلومات الزقازيق<br />الفرقة الأولي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103242/http://www.20at.com/article2.php?sid=1398"

