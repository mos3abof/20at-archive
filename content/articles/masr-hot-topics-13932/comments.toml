author = "احمد"
posted = "2009-11-09"
text = "بالنسبة لخطيب المسجد اللي قال ان البنات و اللعيبه داخلين النار احب اسأله من القران و اقوله \" ءأتخذت مع الله عهدا \" , ربنا وحده بيده الهداية و الضلاله و المفروض انك تدعيلهم بالهداية مش تدعي عليهم …<br />فضيلة الدكتور رجب : يا تري لو النبي صلي الله عليه و سلم كان قاعد جنبك و السائل بيسألك عن جواز ذهاب البنات للاستاد … يا تري كان هايبقي جوابك كده برضه ؟؟ و يا تري لو بنتك راحت و طلعت ف الكاميرا و الناس سألت \" مين دي يا ولاد ؟؟ \" الحقوا دي بنت الدكتور رجب .. هل الكلام ده يرضيك ؟؟ ..<br />يا شباب مصر ما تشغلوش نفسكم بأمر احنا فيه مصيرين و مكتوب علي اللعيبه انهم هايكسبوا و لا لأ … اينعم انا نفسي ان منتخب الجزاير ( يتلب ) 9 صفر و يرجعوا بلدهم قفاهم يقمر عيش … بس برضه ياريت نخلي للدين النصيب الاكبر من حياتنا …"
archived = "2009-11-12"
capture_url = "https://web.archive.org/web/20091112125034/http://20at.com:80/masr/hot-topics/13932--t-.html"

