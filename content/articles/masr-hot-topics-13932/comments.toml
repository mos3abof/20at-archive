text = "صاحب التعليق رقم 11<br />لو انت مسمعتش ان فيه حاله تحرش واحده يبقي العيب ف ( ودانك ) ..<br />اما بالنسبة لموضوع اننا ف سنه 2009 موش 1009 ف انت بتفكرني بالموجه الرياضيات اللي دخل علي مدرس بيقول للتلاميذ ان الزاوية القايمة 90 درجه فراح قايله \" 90 درجه دي كانت من زمان دلوقتي الزمن اتغير و بقة 560 درجه …<br />اتق الله يا اخ عماد …<br />اما شعب الاخلاق اللي انت بتتكلم عليه … فموش هارد عليك لاني عارف انك موش مقتنع باللي انت بتقوله و شوارعنا و كافيهاتنا و المولات و النوادي هي اللي هاتتكلم عني .. و ربنا يهدينا و اياك"
