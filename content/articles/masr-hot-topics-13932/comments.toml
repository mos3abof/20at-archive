text = "اهى الفتاوى دى اللى جايبانا ورا . احنا عمرنا مسمعنا ان حصلت حالة تحرش واحدة فاى استاد فيكى يا مصر .لية. لان ببساطة شعبنا وطنى ولما بيجتمع على شئ واحد ويكون لة هدف واحد بيحققة وبيلتزم بالاخلاق . الشيخ وامثالةو عاوزين البنات المحترمين اللى بيحبو بلدهم يقعدو فبيوتهم او يلبسو خيمة ميبانش منها غير كفهم ووشهم . صح النوم يا فضيلة الشيخ اجنا سنة 2009 مش سنة 1009 . سيبو الناس تشجع بلدها وسبونا نفرح . وخليك فاهل بيتك امنعهم زى منت عاوز وربنا يكون فعونهم."
