posted = "2009-11-10"
text = "من الاخر كدة لا سلام مع اللى شتونا وحرقوا تى شيرت بلدنا ولو انتوا معندكمش كرامة فاحنا عندنا كرامة ومن الاخر فى 500 شمروخ طالعين من الاسكندرية وهيكونوا<br />جاهزين قبل الماتش بيوم عند فندق الجزائر ولحسن الحظ اننا يوم الجمعة عندنا ماتش باسكت مع الجزيرة فى القاهرة يعنى هنبات قدام الفندق بعد الماتش ومعانا مكبرات الصوت والشماريخ<br />ولا عزاء لاصحاب القلوب الضعيفة اللى معندهمش كرامة<br />احنا سواحلية احنا نحكمهم"
