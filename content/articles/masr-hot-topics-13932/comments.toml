text = "هي ده المقالات ولا بلاش<br />المقال ممتاز جدا ..<br />بس تعالي بص بقي لكل الكلام اللي اتقال فوق مش بيطبق منه اي اي حاجة خالص<br />و اوله البنات اللي رايحين الماتش<br />كمية السلاح المهولة المجهزة للماتش من دلوقتي من الجماهير الهمجية المتخلفة ..<br />كمية الاضرار و الشغب المتوقع من دلوقتي ..<br />ثانيا الحماسة الزيادة الملهاش اي لازمة لمجرد ماتش هيدخلنا تصفيات كاس عالم<br />اظن ان احنا اخدنا كاس العالم في حاجات كتييرة"
