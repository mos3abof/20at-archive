author = "عمرو"
posted = "2009-11-11"
text = "أنا بوافق أحمد في رأيه أن الدكتور اللي قال الفتوة دي بينافق نفسو اودام الدنيا واودام ربنا ولازم يراعي ربنا ف اهل بيته قبل ما يراعيها في غيرو , مش موضوعنا ربنا اللي بيحاسب مش البشر , بس انا بحبذ لو الموضوع بقي فيه تشجيع محترم مش رايحين ديسكوهات احنا ولا رايحين كباريهات . وكمان الأخ التراس ده ايه نبرة الإحتقان اللي طالعه منك دي احنا طول عمرنا شعب الكرم والاخلاق وعمرنا ما كنا شعب همجي وكمان متاخدش ذنب ملايين أبرياء كل ذنبهم انهم يشوفوا بلدهم زي ما انت نفسك تشوف بلدك في المونديال , صحيح انت حلمك اقرب ليك منهم , بس اتقي الله ف اهلك يجعل لك مخرجا ً , وياريت كلنا ندعي بقلوب مخلصة ان ربنا ينصفنا ف اليوم ده عشان نقدر نجتاز الموقف ده علي خير , وربنا يوفق المنتخب المصري وأسف علي الإطاله ,"
archived = "2009-11-12"
capture_url = "https://web.archive.org/web/20091112125034/http://20at.com:80/masr/hot-topics/13932--t-.html"

