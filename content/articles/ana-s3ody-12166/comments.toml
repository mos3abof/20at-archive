text = "ليه مستغربين أن حال الولاد والبنات وصل لكده فى حين أن محدش دور ولا بص على السببب لانهم يلجأوا لهذا النوع من الزواج<br />انا من رأى ان فعلا دا هروب من الواقع ومجرد استمتاع بينتهى بغلق الكمبيوتر<br />لو كانوا فعلا لاقين اللى يشغلهم بتهيقلى مكنش وصل بينا الموضوع لدرجة الزواج الافتراضى مش مجرد شات عادى او ولد بيكلم بنت<br />اللهم أصلح حال شبابنا وبناتنا ووفقهم لما تحب وترضى<br />اللهم أ مــــــــــــــ ـــــــــــــــ ــــــــــبن"
archived = "2009-05-27"
