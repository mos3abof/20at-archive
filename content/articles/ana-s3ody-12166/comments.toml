text = "الخيال شئ ممتع جدا ومفيد لصحة الانسان<br />هل تتخيل أنك تستطيع الحياة بدون أن تحلم؟<br />يعني تخيل أنك متزوج نانسي عجرم أو هيفاء وهبي وعايش معاها لحظة بلحظة بالذمة دي مش حاجة جامدة؟<br />بس كل حاجة بحساب"
