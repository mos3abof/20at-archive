[[comments]]
order = 1
subject = ""
author = "محتاس"
posted = "2008-09-27"
text = "اه ممكن تعمل توكيل لمراتك او ابنك علشان يؤدى الصلاة بالنيابة عنك<br />لكن فى شروط لازم مراعاتها<br />1 - انك تكون رئيس جمهورية<br />2 - مراتك اسمها سوزان<br />3 - ورئيس وزرائك نظيف<br />4 - و ماتنساش النية<br />و اسال حتى شيخ الازهر ممكن يفيدك اكتر فى حكاية النية هوا خبرة 15 مع الريس فى الموضوع دة"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805112314/http://www.20at.com:80/masr/t7kyk/10159.html"

[[comments]]
order = 2
subject = ""
author = "عايز افهم"
posted = "2008-09-27"
text = "نشرت الجرائد القومية الثلاث الاهرام والاخبار والجمهورية ان الرئيس مبارك اطال اللة عمرة قد وكل السيد نظيف للقيام بصلاة الجمعة اليتيمة نيابة عنة<br />والسؤال للضالعين فى العلم والدين هل يجوز لى عمل توكيل لابنى او مراتى لتصلى بدلا عنى وتقيم الفروض بالوكالة عنى<br />افادكم اللة"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805112314/http://www.20at.com:80/masr/t7kyk/10159.html"

[[comments]]
order = 3
subject = ""
author = "مش كاتب"
posted = "2008-09-28"
text = "اذا كنتم مسلمين فالاستهزاء بالدين يخرج عن المله ويستلزم التوبة والغسل ونطق الشهادتين من جديد<br />واذا كنتوا مسيحيين فممكن تروحوا الكنيكه بتاعتكم وتشوفوا ايه اللي بيحصل فيها يعمي مثلا لما القسيس بيشرب خمرا لانها دم المسيح وبياكل فطيره لانها لحم المسيح ولا وهو بيغفر للناس وحجات كتيرة اوي اوي ممكن تشوفوها في الكنيسة<br />اما بخصوص السؤال ان البروتوكول بيقول ان الريس لازم يحضر صلاة الجمعة بصفته رئيس الجمهورية وبيعتذر عن ا لصلاة لاي سبب فوكل نظيف فيها في الحضور الى الصلاة نيابة عنه وهذا لا يسقط الصلاة على حسني مبارك فهو ملزم ان يصليها في بيته او في المسجد اللي جنب بيته<br />وبرضه حصلت مع المسيحيين فمره البابا شنوده لم يستطيع الحضور الى الصلاة الرسمية فوكل الانبا بيشوي للحضور نيابة عنه.<br />فعيب عليكم لما تتريقوا كده كيب عليكم انتو رجالة كبار ما يصحش تعملوا الحجات الصغيرة دي<br />اما بالنسبة للمعلقة ميرووووووووووو<br />اذا بليتم فاستترم<br />امال لو ما كناش في رمضان كنتي عملتي ايه"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805112314/http://www.20at.com:80/masr/t7kyk/10159.html"

