subject = "مسلمه"
author = "لسلام عليكم"
text = "انا الصراحه فرحت اوى فى امريكا الطاغيه الجباره وقلت من اعمالكم سلط عليكم<br />بس انا الصراحه رجعت قلت هو صح ان احنا نفرح فىهم ولا لا؟ وهل احنا المفروض نكره الامريكان كلهم ولا المقاتلين بس؟<br />انا الصراحه مش عارفه وعايزاكم تشاركونا فى الاراء<br />مستنيه ردكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151507/http://www.20at.com/article.php?sid=1567"

