[[comments]]
order = 5
subject = "جبروت أمريكا"
author = "لى الأخت مسلمة بالنسبة إلى هذا العذاب الذي أصاب أمريكا ولكنه في صورة لناس أمريكان منهم البرئ أقول أن الله يعاقب هؤلاء لأنهم رضوا بظلم بوش لغيرهم حنى لم يستنكرو والكثير منهم انتخبوه ونجح"
text = "فالعذاب من الله لهم لأن أمريكا بدأت تحارب الله وجبروتها بدأ ينكسر في العراق والله يبليهم ويهدي البرئ منهم<br />وفي النهاية و \"يشف صدور قوم مؤمنين\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151507/http://www.20at.com/article.php?sid=1567"

