order = 13
subject = "العقل نعمة يا ناس"
author = "ا ناس فقط قولوا الحمدلله وابعد الله عنا الكوارث ولا تتشمتوا بالغير فوالله اذا كانت امريكا ظالمة او تفعل الفواحش فعلى الاقل هي دولة مفتوحة لا يحكمها الدين بشكل عام اما في الشرق الاوسط والمفروض ان لديهم دين وهم اوسخ مافي الوجود."
text = "الله يستر علينا والدليل الحفلات والفيديو كليبات والملابس والحجاب (العصري).<br />شكرا...."
archived = "2006-11-02"
