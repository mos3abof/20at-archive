[[comments]]
order = 7
subject = "hanan_elbana@hotmail.com"
author = "يس لى تعليق سوى (( انا لله وانا اليه راجعون ))"
text = "(ويمكرون ويمكر الله والله خير الماكرين) صدق الله العظيم<br />وما يعلم جنود ربك الا هو<br />صور الدمـــــار لاعصار كاترينا في امريكا<br />بوش يستنجد و يناشد مواطنوه لتقديم المساعدة لمتضرري اعصار كاترينا<br />اكرر: الخسائر المتوقعة تفوق 25 مليار دولار<br />مناظر من جورجيا<br />ألاباما<br />المنازل بعد أن تحولت إلى حطام في الميسيسيبي<br />منظر علوي لمنازل محطمة في نيو أورليانز<br />أقوى دولة في العالم لم تستطع عمل شيء أمام أمر الله<br />(وَإِذَا أَرَدْنَا أَنْ نُهْلِكَ قَرْيَةً أَمَرْنَا مُتْرَفِيهَا فَفَسَقُوا فِيهَا فَحَقَّ عَلَيْهَا الْقَوْلُ فَدَمَّرْنَاهَا تَدْمِيرًا)<br />صورة توضح جزء آخر من نفس الجسر في مدينة بيلوكسي في المســسـيبي دمره إعصار كاترينا<br />(أَفَأَمِنَ أَهْلُ الْقُرَى أَنْ يَأْتِيَهُمْ بَأْسُنَا بَيَاتًا وَهُمْ نَائِمُونَ،أَوَأَمِنَ أَهْلُ الْقُرَى أَنْ يَأْتِيَهُمْ بَأْسُنَا ضُحًى وَهُمْ يَلْعَبُونَ، أَفَأَمِنُوا مَكْرَ اللَّهِ فَلا يَأْمَنُ مَكْرَ اللَّهِ إِلا الْقَوْمُ الْخَاسِرُونَ)<br />كان يوجد هنا منازل كثيرة، ولكن قدرة الله فوق كل شيء<br />(أَفَلَمْ يَسِيرُوا فِي الأَرْضِ فَيَنْظُرُوا كَيْفَ كَانَ عَاقِبَةُ الَّذِينَ مِنْ قَبْلِهِمْ دَمَّرَ اللَّهُ عَلَيْهِمْ<br />وَلِلْكَافِرِينَ أَمْثَالُهَا)<br />كانت منازل عامرة بالكفر والفسق والفساد،<br />(حَتَّى إِذَا أَخَذَتِ الأَرْضُ زُخْرُفَهَا وَازَّيَّنَتْ وَظَنَّ أَهْلُهَا أَنَّهُمْ قَادِرُونَ عَلَيْهَا أَتَاهَا أَمْرُنَا لَيْلا أَوْ نَهَارًا فَجَعَلْنَاهَا حَصِيدًا كَأَنْ لَمْ تَغْنَ بِالأَمْسِ كَذَلِكَ نُفَصِّلُ الآيَاتِ لِقَوْمٍ يَتَفَكَّرُونَ)<br />منظر علوي لمنازل مدمرة تماماً كانت في طريق الإعصار كاترينا<br />(وَتَرَكْنَا فِيهَا آيَةً لِلَّذِينَ يَخَافُونَ الْعَذَابَ الأَلِيمَ)<br />جسر بعد أن دمره إعصار كاترينا<br />هذه سيارات حقيقية وليست لعب، جرفها إعصار كاترينا يوم الإربعاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151507/http://www.20at.com/article.php?sid=1567"

[[comments]]
order = 8
subject = "هم دووول مش بني أدمين"
author = "داية. السلام عليكم ورحمة الله وبركاته."
text = "أنا أول ما قريت العنوان دخلت أشوف اللي مكتوب والصراحة انا كنت متأكد أني هلاقي الدنيا مولعة وكله فرحان في أمريكا.<br />على فكرة لو عرفنا عدد المسلمين اللي أتشردو واللي ماتو واللي واللي ... مش هنفرح نفس الفرح.<br />من ناحية تانية . انا شايف أن غضب الله مش على الكفرة بس ذي مانتو فاكرين. انما الغضب الحقيقي على الأمم المسلمة اللي مش فالحة غير في الفرجة والتصفيق والدش والهبل.<br />وكل ما يكون فيه واحد عايز يصلح ويعمل حاجات كويسة ويفيد ويكون نافع . سبحان الله ربنا يبتليه بالناس المحبطة وربما اللي مبيفهموش في شغلهم ويبدأوا يعرقلهوم ويحبطوا من عزيمتهم.<br />أنا راي ان كل واحد يعمل اللي عليه وباتقان وانا متأكد اننا نفوق الامريكان اللي انتم فاكرينهم كفرة بس هم متقدمين وسابيقنا بكتييييير. والسبق ده نتيجة جهد ونظام . بتهيألي ان السبق ده من حق أمة دينها الإسلام. أيه رايكم لا نفرح ولا نحزن. أنا عندي فكرة أحسن تعالوا نعتبر ونشتغل بجد.<br />ممكن اكون خرجت من الموضوع ورجعت له. مش مشكلة بس انا عايز اوصل لكم فكرة معينة.<br />HMH"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151507/http://www.20at.com/article.php?sid=1567"

