[[comments]]
order = 11
subject = "رعد"
author = "لسلام عليكم ورحمة الله وبركاته"
text = "للجميع<br />بصراحة انا مشاعري تبلدت<br />لا اشعر بأي شئ<br />كل ما اشعر به اننى اكره السياسات الامريكية<br />اتجاه دولنا العالم الثالث<br />اما ما يتعلق بالكوارث التي اصابتهم كلنا<br />نعلم علم اليقين ان ما يحدث في هذا الكون<br />من الله سبحانه وتعالى .<br />ولكن لا نستطيع ان نجزم انه عقاب مع ايماننا<br />الراسخ ان اوامره بين الكاف النون واذا<br />اراد شئ ان يقول له كن فيكون<br />ولعل هذه الاحداث تذكير لنا نحن المسلمين<br />اصحاب الايمانيات المتدنية يوما بعد يوم<br />جراء الفحش والفجور والملهيات تاره وبين<br />الغانيات والدشوش والفاجرات تارة أخرى<br />الا من رحم الله<br />لعل ما حدث تذكيرمن الله لاستنهاض<br />هممناالوضيعة وتسويفناالمستمر<br />وكأنه يرينا الله سبحانه وتعالى انه غير<br />محتاج لنالنصرة دينه او محاربة اعدائه واننا<br />نحن الفقراء اليه<br />يرينا الله سبحانه وتعالى بعض من قدراته وكأنه<br />يقول أماآن لكم الرجوع أما آن لكم التوبة<br />النصوح ...أرجعوووو لي والباقي بين كافي ونوني .<br />يا أحبابي<br />ارى اننا وللأسف الشديد ما زلنا امة<br />ضعفاء امام شهواتنا لذلك<br />هل نستحق النصر ؟ ؟ ؟<br />بالطبع لا نستحق النصر .<br />لا للنصر حتى ننصر الله ولن يتم الا<br />بالتغلب على شهواتنا.<br />وبعدهاابشروا بالنصر الموعود<br />وتذكروا ان الله سبحانه وتعالى<br />لا يغير مافي قوم حتي يغيروا ما في انفسهم .<br />هيا يا أخوان فلنبدأ بأنفسنا<br />وبمن حولناولنرى الله مناالصدق<br />بالقول والعمل حتى نفرح بنصر قريب<br />اللهم آآآآآآمين يارب العالمين<br />اللهم اهدى ضال المسلمين<br />وردنا اليك ردا جميلا<br />ولا حول ولا قوة الا بالله العلي العظيم<br />تقبلوا احترامي<br />ودمتم بخير<br />المعرفات للتواصل<br />النمرة غلط /منتدى هدوء المنتظر<br />النمرة غلط / شبكة نزف المشاعر<br />اعتب عليك / منتدى الحنون<br />رعد / مشرف بمنتدى النرجس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151507/http://www.20at.com/article.php?sid=1567"

[[comments]]
order = 12
subject = "MASHQ70@YAHOO.COM"
author = "سم الله الرحمن الرحيم"
text = "اسال الله ان يشدد وطأته عليهم ويحصهم عددا ويقتلهم بددا ولايغادر منهم احداولا يرفع لهم راية ولا يحقق لهم غاية ويجعلهم لمن خلفهم ايةامين اللهم ثم امين لان الامريكان يستاهلون اكثر من ذلك فلقد وصل بهم الغرور درجة ما وصله احد قبلهم الا قوم عادوصار لسان حالهم من اشد منا قوة وكانهم لايعلمون ان الله اشد منهم قوة وبطشا فهو الجبار المنتقم<br />ولهذا ارسل الله عليهم جندا من جنوده فاذا هم منها يركضون والحمد لله رب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151507/http://www.20at.com/article.php?sid=1567"

