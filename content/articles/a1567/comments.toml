[[comments]]
order = 2
subject = "abdalftah@hotmail.com"
author = "سم الله الحمن الرحيم"
text = "(قاتلوهم يعذبهم الله بايديكمالله بايديكم ويخزهم وينصركم عليهم ويشف صدور قوم مومنين)التوبة/14<br />ما حدث في امريكا مثلما نشر في البيان هوعذاب من الله لملة الكفر التي طغت وتحارب الاسلام والمسلمين واقتحمت ديار الاسلام بفضل خيانة ولاة عكا القرن الواحد والعشرين فانزل الله غضبة مثلما انزلة علي فرعون وعلي الطغاة المتجبرين فسلط الله عليهم جند من جندة وهو الريح والماء فزلزلت كيان الدولة الكافرة واصبحت عاجزة المارد التي تنفقها علي قتل المسلمون في العراق وافغانستان وضرب الاسلام في شتي مناحي الارض ونحن نري في ذلك شفاء لصدور قوم مؤمنين يجهاهدون ويقاتلون ويواجهون هذة الحملات الصليبية فعندما تنشر هذة المقالة تكون عظة للظالمين وشفاء صدور لقوم مؤمنين الذين يثقون بنصر الله<br />والله ولي التوفيق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151507/http://www.20at.com/article.php?sid=1567"

[[comments]]
