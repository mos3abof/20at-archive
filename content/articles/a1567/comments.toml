subject = "اللهم لا شماتة ، أحنا اللي لازم نفوء"
author = "حن لا نكره الأمريكان ، ولكننا نكره الحكومة الأمريكية المتغطرسة"
text = "الحل مش في إنهيار أمريكا الحل في أن يكون للمسلمين دولة عظمى تحميهم من من لا يعرف الرحمة، و إلا بعد أمريكا هتيجي الصين ، زي ما كان قبل أمريكا بريطانيا"
archived = "2006-11-02"
