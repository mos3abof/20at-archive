text = "اقتباس حاجة تكسف:<br />للاسف لقد وصلنا من التفاهة ان اشخاص تتعرض للاذى عشان متش كورة والمشكلة ان الغرب بيضحكوا علينا ومبسطين فينا لان ده بين مدى هشاشة العلاقات العربية التى اتفقت على الاتتفق منذ زمن بعيد فكم من القمم العربية التي عقدت ولم تتفق وهل فعلا الشعوب العربية وطنية الى هذه الدرجة ام هذا مجرد فعل جاهلي اين هذه الوطنية في حل المشاكلنا التي اصبحة مستعصية (لقد كان من اولى الدولتين ان يتنافسوا على افضل 500جامعة في العالم )عار علينا ان تكون جامعة عربية وحيدة ضمن الترتيب العالمي !!!!!!!ملاحظة انا احترم الكورة والرياضة واتمنى فوز بلدي مصر بس هناك اولويات فكم صرف ع هذه المباراة وكم سرق خرب باسم هذه المباراة"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105165556/http://20at.com/masr/egyptian-newspapers/14087-2009-11-18-07-53-27.html"

