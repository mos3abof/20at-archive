subject = "لقطة حلوة أقوي"
text = "لقطة حلوة يارغداء، ده اللي بسموه عين الصحفي اللي بتلقط الموضوعات ذات الخفة والدلالة<br />بجد روحي اشتغلي صحفية جولة"
archived = "2004-07-11"
