[[comments]]
order = 0
subject = "moslem75"
text = "اختلجتنى عدة مشاعر عند قراءة الموضوع :<br />1. صورة الفتى العراقى الذى يحمل الرشاش و كأنه يقول لى : انعم بحياتك و زوجتك و طفلك و نم نوماً عميقاً ففى العراق فتيان يستطيعون الدفاع عن أرض الإسلام .<br />2. فكرة المعرض رائعة و لكن للأسف لم تطبق إلا على الأطفال المظلومين فى العالم ... و بالطبع هم أطفال المسلمين ( كوسوفو ـ العراق )!!<br />3. رد الجندى الأمريكى رائع : \" نعم إذا سمح لنا العراقيون بذلك \" و أنا واثق أنهم لن يسمحوا له بذلك إن شاء الله .<br />شكراً للأستاذة رغداء على هذا التناول الجيد و فى انتظار المزيد ...."
archived = "2004-07-11"
capture_url = "https://web.archive.org/web/20040711055705/http://www.20at.com:80/article.php?sid=430"

