[[comments]]
order = 2
subject = "بيرو"
text = "ياريت والله نعمل مسابقة زي دي ونقدر نعمل فيها أقسام احلي وأجمل زي ......<br />صور أغبي رجل في العالم....مع الأعتذار للسيد بوش<br />صور أقذر رجل في العالم ..وأحترس من معاداة السامية<br />صور أي كرسي عربي له قيمة ...بعيدا عن كرسي حسن أرابسيك..."
archived = "2004-07-11"
capture_url = "https://web.archive.org/web/20040711055705/http://www.20at.com:80/article.php?sid=430"

[[comments]]
order = 3
subject = "بيرو"
text = "صوره تم التقاطها في العراق من 6 سنوات وهذه دعوة للبحث عنها..<br />الصورة نشرت في جريدة أخبار اليوم صباح أحد أيام ضرب العراق من قبل القوات الانجليزية والامريكية<br />كانت احد المدارس العراقية في بغداد قد ألحقها الضرر من جراء غارة ليلية<br />في الصباح ذهب الاطفال الي مدارسهم<br />احمد قلمه الرصاص يحتاج الي بري<br />لا توجد مبراة<br />فكر قليلا<br />نظر الي زجاج نافذة الفصل المكسورة بفعل الضرب الوحشي<br />وقف علي \"دكته\"<br />مسك قلمه ..ومد يده ليبريه بحد الزجاج المكسور<br />عيناه تحمل معاني مختلطة من الحزنوالغضب ..والامل...والحب..!!<br />كانت هذه هي مكونات الصورة التي كتب تحتها من قبل وكالة (أ ف ب)<br />\"يوما ما سيحكم هذا الطفل بلاد العراق ..وسيطرد أعداء بلاده.... بقلمه...!!!<br />أبحثوا عن الصورة ..ودققوا النظر في معانيها"
archived = "2004-07-11"
capture_url = "https://web.archive.org/web/20040711055705/http://www.20at.com:80/article.php?sid=430"

