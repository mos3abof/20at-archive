text = "قال علي بن أبي طالب -كرم الله وجهه-{لو كان الفقر رجلا لقاتلته}..الفقر وحده هو السبب في جعل الزواج هذاالميثاق الغليظ يكون بكل الوان الطيف،وباللون الأبيض،السؤال الذي يحيرني هو كيف تتخذ بعض الأشياء مثل الزواج، صفتها من الالوان نقول مثلا : كذبة بيضاء،ضحكة صفراء،باطل أحمر،ليالي حمراء،درهم أبيض ينفع في اليوم الأسود..وهو الدرهم الذي يدفع الكثيرات و الكثيرين للتفكير في اختيار ذلك اللون في ا لزواج..elhitmi1@hotmail.com"
