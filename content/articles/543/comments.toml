text = "كان لي شرف الائتناس بصداقة عدد من الطلاب المغاربة في مصر، ولاحظت طيبة قلوبهم وحبهم لمصر ولكل العرب وغيرتهم على دينهم .. وإحنا في مصر بنحب المغرب وبنشجع فريق الكورة المغربي رغم إنه بيهزمنا.<br />والأزمة الأخلاقية تشمل كل العرب للأسف وأسبابها اقتصادية في المقام الأول."
