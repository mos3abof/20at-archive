subject = "شكرا لكل الردود"
author = "بداية اتقدم بالشكر الجزيل لكل من رد وعقب على هذا الموضوع سواء باحترام او غيره لكن لابد من الاشارة ان الهدف من اتارة الموضوع ليس تشويه سمعة المغربيات فانا مغربية واعتز بمغربيتي وباسلامي ومايضر بنات بلدي يمسني بالدرجة الاولى فهذه حقيقة وهذا الموضوع من المظاهر والظواهر التي بدا يعرفها المغرب ان لم نقل كل الدول العربية فنسال الله العفو والعافية اتفق معكم ان كل بلد فيها صالح وطالح لكن اتارتنا للموضوع ليس سبا ولا قدفا للمغربيات ولكن تنبيه لما يقع في المجتمع المغربي"
posted = "2006-05-19"
text = "achourfa06@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
order = 22
subject = "الحمد لله"
author = "رباب المغربية"
posted = "2006-05-22"
text = "موضوع جيد اقول اختي فاطمة عاشور بانسبة هده ظاهرة ليست عامة في كل المغرب<br />انا مغربية في البيضاء احب بلدي المغرب ولي شرف انني مغربية<br />لكن هناك كتير ناس بظنو في المغرب ظن السوء<br />هدفي في الحياة هي ازالة صورة السيئة عن بلدي واظهر<br />شكرا جزيلا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
order = 23
subject = "الحمد لله"
author = "رباب المغربية"
posted = "2006-05-22"
text = "في بداية اود شكر شيخ دانيال على تعليقاته.<br />انا ودي ان اقول في كل بلد عربي فيه صالح وطالح<br />في المغرب عندنا مدهب المالكي<br />الحمد لله كلنا عيشين بخير في ظل جلالة الملك محمد السادس حفظه الله لنا ونصره<br />في كل دولة عربية بتلاقي فيها سلبيات وايجابيات<br />في بعض الدول لديهم ختان النساء لديهم الزواج العرفي الزواج الميسار<br />هده الاشياء لاتوجد في بلدي المغرب<br />موجود كتير اشياء انا اتحفظ عليهالان مع دكرها يظهر اسم دولة جليا<br />بنسبة لبعض المغربيات او تكون جنسية اخرى وتقول انها مغربية<br />هده فئة انا متأكدة انها غير مثقفة<br />وليست لهن كرامة لان الانسان الي خاف من ربو وبحب رسول محمد صلى الله عليه وسلم<br />لا يمكن له فعل محرامات المنهية عتها في الاسلام<br />مدى اقول...........................<br />الحمد لله على كل شيء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
order = 24
subject = "لماذا التحديد"
author = "رامي"
posted = "2006-05-22"
text = "هذا الكلام ليس في المغرب العربي فقط ولكن في جميع البلاد العربيه ولكن ما هي اسبابة ودوافعه<br />كما لا يقتصر هذا الموضوع على الفتيات فقط ولكن هناك من الشباب من يبيع عواطفه واحاسيسة ومشاعرهم واعرم من الناس الكثير الذي حصل لهم مثل هذا الشئ وخاصة في امريكامن اجل الحصول على الاقامة والجنسة<br />اشكرك اخت فاطمة عاشور على طرح مثل هذة المواضيع الجادة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
order = 25
subject = "اموت واحيا من اجل المغرب"
author = "رباب المغربية 1986/07/19"
posted = "2006-05-23"
text = "قال رسول الله صلى الله عليه وسلم *رحم الله عبدا شغلته عيوبه عن عيوب الناس*<br />الحمد لله اعتز ببلدي واتمنى من الله ان يحفظه وان يحميه من لاعداء<br />وان يحفظ كل دول المحبة لي بلدي<br />اشكر الله واحمده على كل شيء<br />احمده انني مغربية واحمل بين دمي المغرب<br />وفي قلبي الله سبحانه وتعالى ورسوله محمد صلى الله عليه وسلم<br />لا تنسو نحن عرب اصلنا شريف من بيت علي ابن ابي طالب *كرم الله وجهه* وهده اشياء موثق في التاريخ .<br />ارسل ارق تحية لكل مساند لي بلدي<br />بالخصوص الشيخ دانيال<br />اتمنى لك الصحة والعافية شكرا لك اخي<br />لن انسى الاخرين ارسل لهم ارق تحيات .<br />مغربية اصيلة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

