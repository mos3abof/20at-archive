[[comments]]
order = 19
subject = "شكر"
author = "الشيخ دانيال"
posted = "2006-05-17"
text = "بعد الحمد لله والصلاة والسلام على رسول الله .لا بد لي اشكرك الاخت العزيزة ام الياس واشكر كل مسلم ومسلمة غيور او غيورة على ابناء جلدتنا ودينناوامثالك وامثال الناس الطييبن تقبل لهم الايادي،وهذا قليل عليهم،لان في زمان خيمت فيه الظلمات،في زمان كثر فيه التكلاب على هذه الدنيا الزائلة،التي ما تبقى من وقتها الا حينما تكون الشمس في جهة الغرب وفد قاربت واوشكت على الغروب،نحن في زمن يصدقون الكاذب ويكذبون الصادق،يخونون الامين ويأمنون الخائن،هذا هو زمننا،الحمد لله انه ما زال طائفة من المؤمنين يدافعون عن الحق،ويدافعون عن المسلمين والمسلمات الى ان تقومالساعة،وقتئذ عند الله تلقى الخصوم.ا,هـ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

