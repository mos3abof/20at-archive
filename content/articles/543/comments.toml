posted = "2006-08-05"
text = "مرحبا بالجميع امابعد<br />الواقع ان هناك عدة مناطق معروفة بالفساد<br />داخل المغرب مثل تيفلت والحاجب والدليل الزبناء المحترمون من الخليج بل اصبح المغرب الاول لتصدير بنات الجنس في اوروبا او في الخليج بل يمكن القول - سوق- ولا ياتي احد ويقول لي الغيرة بل ليقول ايتها المسلمة المغربية اتقي الله واعملي بما امر الله عليكي بالحجاب .<br />فانا مغربي واتحسر الى ماوصلت عليه البنات وهيئتهن في الشوارع وخصوصا في المساء.وماخفي اعظم والسلام."
