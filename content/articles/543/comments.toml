posted = "2006-05-15"
text = "انا اولا وقبل كل شيء اشكر جميع الاخوان والاخوات اللي جاتهم غيرة على هذا الوطن وبناته ودافعوا عليه سواء مغاربة او من دول اخرى شقيقة ك الاخ اللبناني الشيخ دانيال جزاه الله عنا كل خير في الدنيا والاخرة وكثر الله من امثاله صراحة لم اجد ما اقوله امامه فهو قال ما فيه الكفاية."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
order = 18
subject = "غيرة على فتياتنا"
author = "ام ياسين"
posted = "2006-05-16"
text = "السلام على من اتبع الهدى<br />اما الكلام عن الفساد عن دولة معينة ومقصودة بالقذف لايدل على شىء وانما يدل على شىء ما في نفس يعقوب.<br />جزى الله بكل خير كل من به غيرة على المسلمات في جميع انحاء المعمور.<br />ام ياسين."
