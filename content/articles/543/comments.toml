order = 40
subject = "الجمل مش شايف حدبتو بس شايف حدبت صاحبو"
author = "مغربية"
posted = "2006-09-16"
text = "السلام عليكم فى الرد على لموضوع اقول للكاتب وبصفة خاصة ان كل من يقرء موضوعك يرى انه انتقام بطريقة غير مباشرة من لمغاربة لكن هده االاساليب اكل عليها الزمن والدنيا فيها الصالح والطالح ليس كل لمغربيات مدنسات وليست كلهن شريفات والقاعدة تنطبق على كل عربية اينما كانت وفى الاخير اقول رحم الله عبدا عرف قدر نفسه ورحم الله عمر بن الخطاب على هذا القول"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
order = 41
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-18"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
order = 42
subject = "ومن الزواج ما نجح"
author = "ع . ن . ح"
posted = "2006-09-25"
text = "لن نجزم بسوء الأغلبية ولن نقربحسن قليلها كل ما اود قوله أن هناك من يرغب بالفعل الزواج من مغربيات وأنا أحدهم وربما حدث هذا قريبا شرط أن يكون هناك توافق وأن أكون قادر على تحمل متطلبات الزوجة المغربية حتى وإن وجد هناك ما يسمى فوارق لا اقصد السن فقط ولكن اعتقد بأن الفكر يلعب دوراً هاما في نجاح الزواج ، هناك من ترغب الزواج من خليجي لكنها ترفض مغادرة المغرب وهناك من يسعى للخلاص من ظرفه ومكان عيشه ليجرب حياة جديدة ربما كانت الأفضل في تصورة وربما كانت عكس ما توقع ، ليس هناك ما يمنع من الزواج طالما كان غطاؤه الدين والسنة المحمدية ، الإختيار الأنسب يعود للطرفين فلا يلومن أحد بعد ذلك .<br />ع . ن . ح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
order = 43
subject = "نصيحه للي يريدها"
author = "وليد الاسمر مصري مغربي"
posted = "2006-10-31"
text = "السلام عليكم<br />النصيحه هي ان تتقوا الله في انفسكم وفي الناس العيب منا احنا مش من بناتنا<br />لولا الظلم والفقر بحجة الاقتصاد وغيره وغيره<br />لكان الشاب العربي تزوج 4 حلاله من بنات دينه وبدل ما تنظروا في عيوب المغرب وغيرها من البلاد العربيه انظروا لظروف المعيشه لديهم وكيف الغلاء والفقر والقوانين والبطاله والعنف في كل شئ او تساعدوهم في الخروج من ما هم فيه فأنا كمصري وعربي لو بيدي لتزوجت من 4 فتيات مغربيات واسمي ساهمت وانتم تعلمون علم اليقين انهو لولا الظروف اليي مجبرين عليها والطمع والجشع من اياهم لكنا اغنا الدول وكنا اعز الناس في العالم كله وياعرب وحدو الجمع توقفو البكاء وتفرقو تصبحو غساء ( غساء سيل لاضر منه ولا نفع )"
archived = "2006-11-02"
