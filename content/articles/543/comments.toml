posted = "2006-05-12"
text = "أقول للأخت فاطمه عاشور أنها لا تغار على بلدها بل تحاول أن تشوه صورة المغرب بأكثر ما يسمع عليه فأرجو من الأخت الكريمه إذا أرادت أن تفتح موضووع فرجاء التعميم فالموضوع المطروح لا يختصر على بلدنا الحبيب فقط بل في كل مكان وأتمنى أن تكون عندها ذرة مشاعر نحو بلدها وأخواتها كفايه ما نسمع ونقرأ عنهم ونحن في بلاد الغربه فلا تكوني أنت كذلك ضالمه لهم"
