text = "كلامكم كثر على المغربيات مع انو فيه عجائب كثير ة فى كثر من الدول ليش مثلا ما تكلمو عن زواج العرفى الى موجود فى دول كثيرة عربية ليش تكلمون عن الكغرب او بنات المغرب كانو مافيش بنات محترمات او انو الفساد موجود بس فى المغرب مع انو موجود بشكل كبير فى كل ادول العربية او اكثر من البمغرب بكثير فلو سمحتو كافية"
