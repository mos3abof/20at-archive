[[comments]]
order = 14
subject = "ما أحلى الموعظة الحسنة وما أجمل الدعوة الى الله بالرفق واللين"
author = "الشيخ دانيال"
posted = "2006-05-14"
text = "قال الله تعالى «ادع الى سبيل ربك بالحكمة والموعظة الحسنة<br />قال الله تعالى «{ادع الى سبيل ربك بالحكمة والموعظة الحسنة وجادلهم بالتي هي أحسن}<br />لأن هذا الإنسان يحب أن يحسن الناس الظن به ، فليفعل مثل ذلك بغيره من المسلمين<br />ما أحلى الموعظة الحسنة وما أجمل الدعوة الى الله بالرفق واللين ولا أحسن من الداعية القدوة في سلوكه ونبل تصرفه بعيداً عن الاثارة والغضب والمبالغة وما أطيب التسامح والعفو وطرد الشكوك والاوهام ونبذ اساءة الظن والحكم المتسرع على النوايا.. إن لنا في رسول الهدى قدوة حسنة ومثالاً يُحتدى ومناراً يُهتدى به.<br />لقد وصف ربنا رب العزة والجلال رسولنا ونبينا عليه أفضل الصلاة وأجل التسليم بقوله تبارك وتعالى {وإنك لعلى خلق عظيم} والاخلاق الحسنة صفة سامية يجب ان يتحلى بها المسلم ويتصف بها الداعية المخلص الحصين ويجب ان تسود في مجتمعنا فهي خلق الاسلام وبدون هذه الصفة المميزة يكون الانسان المسلم مجرداً من أهم سلاحه بل ويبعث النفور في من حوله. إن للأخلاق الفاضلة المفعول المباشر والتأثير المثمر في غرس النواة الطيبة في حياة وسلوك المسلم بحيث تكون حياته كلها عطاء واشراقاً وإيماناً واستبشاراً, وبالأخلاق وما تدعو إليه من فضائل يستطيع الداعية المسلم ان يصل مباشرة الى قلوب البشر عندما يعطي القدوة المثلى في تصرفه ومعالجته للأمور مهما صعبت وتشابكت. وللدعوة الى الله من منبع الأخلاق آداب وفضائل وصفات يجب أن يتحلّى بها الداعية. وليس كل موظف أو متخرج أو لديه نزر من التعليم يصلح لهذه المهمة السامية وليس كل من ارتدى مظاهر الدعاة أصبح داعية. فالدعوة على هدى وبصيرة رسالة الانبياء والرسل ويجب أن نختار لها ونصطفي للقيام برسالتها الصفوة المؤهلة القادرة على أداء هذا العمل الجليل. إن من آداب وواجبات الدعوة الى الله هو التأدّب بآداب القرآن الكريم وسيرة المصطفى عليه الصلاة والسلام والخلفاء من بعده رضوان الله عليهم. ومن معالم الدعوة وواجباتها ورسالتها ومؤهلاتها لدى الداعية المخلص المحتسب :"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
order = 15
subject = "الكلمة الطيبة"
author = "الشيخ دانيال"
posted = "2006-05-14"
text = "بسم الله الرحمن الرحيم وبه نستعين والصلاة والسلام على سيدنا حمد الامين<br />الكلمة الطيبة<br />وتشمل حسن الكلام وانتقاءه كما ينتقي التمر الطيب من بين التمور ! وقد أمر الله جل وعلا به فقال :\" وقولوا للناس حسنا \" وقال رسول الله صلى الله علية وسلم :\" الكلمة الطيبة صدقة \" .<br />ويدخل في الكلمة الطيبة والإصلاح بين الناس ، وذكرهم بالخير ، والصدق في الكلام والمعاملات ، والنصيحة ، والتناجي بالخير ، وإرشاد الضائع منهم بالرحمة واللين والرفق بحاله لا بفضحه وتشويه صورته امام الناس والمجتمعات ، وتعليم العلم النافع .<br />فهل قدمت النصيحة ل اخواتنا المغربيات المسلمات باللين والرفق والرحمة ومن غير تجريح وتشويه صيتهن<br />khaled717@hotmail.de"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
order = 16
subject = "لسانك جنتك او نارك"
author = "الشيخ دانيال"
posted = "2006-05-14"
text = "قذف المؤمنات المسلمات من أخطر الكبائر التي يعجل الله عليها العقوبة ، فقد قال تعالى : \" إن الذين يحبون أن تشيع الفاحشة في الذين آمنوا لهم عذاب أليم في الدنيا والآخرة والله يعلم وأنتم لا تعلمون \" ( النور : 19 ) ، فقوله سبحانه : \" لهم عذاب أليم في الدنيا والآخرة \" دليل على أن قذف المسلم واتهامه بما هو بريء منه ، أو إشاعة ما تاب منه من السيئات وكشفها ونشرها بين الناس من أسباب نزول العذاب المؤلم الغليظ العنيف . والعاقل الذي يطلب السلامة في الدنيا والنجاة في الآخرة هم من كف لسانه عن خلق الله ، فلا يتتبع عوراتهم ، ولا يجرؤ على اتهامهم بل يذود عن كل ما يسمع عنه من السوء بغير موجب ولا دليل ليرد عنه موطن بحب أن ينصر هو فيه كما أخبر بذلك النبي صلى الله عليه وسلم : \" من رد عرض أخيه رد الله عليه وجهه من النار يوم القيامة \" ( رواه الترمذي وحسنه ) .<br />ولطالما أوقع إبليس الكثير من الناس في الوقوع في أعراض المسلمين والنيل منهم في دينهم وعرضهم بل وحتى شكلهم وأحوال بيوتهم . وهذا لا يعجب منه من نوره الله بالفقه في دينه ، فإن عامة أهل النار إنما دخلوها بغفلتهم عن خطورة اللسان وآفات الكلام والبهتان .<br />ليكن عندكم رأفة ورحمة وحنان على اخواتنا المغربيات المسلمات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
