text = "حبيت بس اوضح لك شي<br />الزواج الابيض هو زواج بيكون شرعي في الاوراق و كل شي بس ما بتكون اي علاقة بين المتزوجين يعني زواج على الورق و بس و هدا اكيد زواج باطل<br />و المرة الجاية قبل ما تعلق على اي شي اتاكد الاول من صحة معلوماتك<br />و اللي عنده كلام يسم المغرب و بنات المغرب يحتفظ بيه لنفسه لانه مثل هدا الكلام بيجرحنا فوق ما تتصوروا"
