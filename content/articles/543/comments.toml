[[comments]]
order = 31
subject = "الشيخ دانيال"
author = "لنقل الحقيقة الكاملة"
posted = "2006-06-30"
text = "لنقل الحقيقة الكاملة وبقلب صادق وضمير صراحة لو تلف العالم كله لن ترى متل طيبة قلب المغربيات واحترامهن الشديد لازواجهن وطاعتهن لهم وحنية قلبهن، وانه لشرف لي انه لي اصدقاء و صديقات من الاخوة المغاربة في فرنسا والمانياانهم حقا طيبون ومثقفون،ولا نستطيع ان ننكر يوجد قسم قليل قلة لو اردت تقسيهم على الاغلب فهم قلة قليل،لا يلتزمون بالاخلاق الاسلامية لبعدهم عن تعاليم ديننا الحنيف الله يديهم الى سواء السبيل ويرجعهم الى رشدهم،لكن هذه الحالة تفشت في عالمنا العربي لكثرة الجهل والبعد عن الدين،ولابد ان نشكر اهل المغرب الطييبين على وقوفهم ومسنادتهم لشعب فلسطين الحبيبة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

