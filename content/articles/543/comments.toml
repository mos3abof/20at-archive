[[comments]]
order = 10
subject = "لاداعي لدكر اسماء"
author = "مسلمة غيورة"
posted = "2006-04-22"
text = "وجهان والعملة واحدة ليس المغرب الى دولة كباقي الدول العربيةولا افهم مدى هدا التركيز على الفتيات المغربيات بالضبط واريد ان اقول لصاحبة هدا المقال ان طرح المواضيع يكون بصفة عامة ان كان الهدف من دالك معالجتها وليس التشهير ببلد ما فلكل بلد عجائبه<br />مثلا فمصرمعروفة بالزواج العرفي ولا داعي لدكر اسماء البلدان<br />وتونس عندها ترخيص باكل رمضان ولاداعي لدكر اسماء البلدان<br />والبلدان الخليج منحلون اخلاقياولا داعي لدكر اسماء<br />وبما اننا عرب ومسلمون فيجب ان لا نعمم فمنا الصالح والطالح وندعو الله سبحانه وتعالى ان يردنا الى ديننا مردنا غير مخز ولا فاضح ويستر عورات المسلمين اجمعين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
order = 11
subject = "اتقوا الله في بنات المسلمات المغربيات"
author = "الشيخ دانيال اللبناني"
posted = "2006-05-03"
text = "اتقوا الله في المسلمات في المغرب لاتتكلموا بشكل خاص فهذا الامر منتشر في كل الجاليات وليس فقط في المغربيات فكل بلد فيه الصالحة وفيه الطالحة فيهالشريفة التي تخاف الله وتخاف يوم القيامة يوم الحساب هناك تكشف الفضائح وفيه الخانئة التى تبيع دينها وعرضها من ءاجل متاع زائل قليل<br />فاني ونست ان ما عند الله خير وابقى ونست ان الله هو الرزاق ونست قول الرسول عليه الصلاة والسلام من ترك شيئا مخافة الله عوضه الله خير منه<br />اللهم الطف وارحم واستر بنات المسلمين من كل اذى وقوي العفة في نفوسهن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
order = 12
subject = "لماذا فقط تذكروا اهل المغرب"
author = "الشيخ دانيال"
posted = "2006-05-03"
text = "لماذا لا تذكروا الامور الحسنة الطيبة عن المغرب،لماذا فقط السئ،وهل خلى من الطيبات ومن العفيفات،وقد تجد في مغرب عفيفات طاهرات النفس اكثرمن اي بلد اخر<br />الفساد اصبح منتشر في كل بلد حتى في بلد الحرمين ادخلوا على الشات وانظروا الى بعض السعوديات والخليجيات تروا العجائب وقلة الحياء ولا احد ينصح الا القليل<br />حتى لبنان فيها فساد الفساد كثر<br />لان بعض الناس تكالبوا على هذه الدنياالفانية ونسوا الموتقديأاتيهم فجاة وهم غافلون<br />khaled717@hotmail.de"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

[[comments]]
order = 13
subject = "لا حول ولا قوة إلا بالله"
