[[comments]]
order = 5
subject = "من الاحسن الزواج الابيضاو زواج الاسود"
author = "نورة"
posted = "2006-03-22"
text = "في السنوات الاخيرة اصبح الزواج شيء محال تحقيقه.. ربما ان هناك ازمة الرجال او ازمة النساء. وخصوحا ادا تحدثنا عن المجتمع المليئ بالمظاهر الغير الاخلاقية.. والملاحظ ان الفتاة المغاربية تعيش على اقاع.. ظهور مجموعة من القوانين التي تخول لها الحرية... اد نجدها نجن في كل مكان في المقاهي ا والصالونات والملاهي الليلة التي لا تعد ولا تحصى وفي المواقع عبر الانترنيت وضع نفسها كالبضاعة بالطول والعرض .... مما جعل العديد من الرجال لا يفكرن بثاثا في مسالة الزواج... فقط يكتفون بالزواج المتعة.. وانفاقي اليومي ... اما الزواج الشرعي اصبح في خبر كان.. ولما لا ان الفتاة الجامعات والمدرسي والنساء في الشوارع منحلين اخلاقيا.<br />اما عندما نتحدث عن زواج الابيض او زواج المصلحة او الخبز.. فهو الهروب من الواقع المزري ولو على حساب الديني والملة... فهنا لابد من مراجعة اخلاقنا في كل الاتجاهات ورد الاعتباء الى الانثى ووضعها في الطريق الصحيح."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103117/http://www.20at.com/article2.php?sid=17"

