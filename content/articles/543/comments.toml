text = "أشرف على أخذ القرار بالزواج من إحدى المغربيات وهي زميلة الدردشة في الانترنت، وأشكرك على هذه المقالة القيمة، إذ أنني ما سبق لي أن أقرأ ولا أسمع عن المغربيات. ولكن، هل كلهن هكذابدون استثناء؟ وما أريد إلا مد يد المساعدة لمن لا تجد شريك الحياة وقد بلغ عمرها الثلاثينات.<br />سيف الله كمالي (إندونيسي الجنسية، ساكن في جاكرتا)<br />skamalie@yahoo.com"
