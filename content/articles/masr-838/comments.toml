[[comments]]
order = 0
subject = "هو إشتراه بفلوسه"
author = "المصراوى"
posted = "2006-08-24"
text = "هو إشترى الميدان بفلوسه علشان ينسبة لنفسه وبأى وقاحه يسمى الميدان بإسمه ألم يكتفى بكل المشروعات التى نسبها لنفسه ونهبها فى حساباته. هذه أملاك الفراعنة التى بالتبعية وصلت للشعب المصرى الحالى وليست من أملاكه وكفاية بقى ده نهب آثار مصر كلها وباعها هوه ومراته فاكرين زوجة جاك شيراك لما سوزان مبارك أهدتها تمثال فرعونى وبعدين زوجة شيراك كشفت عن التمثال وعرفت أنه تقليد لأن سوزان أستخسرت فيها التمثال الفرعونى الأصلى وراحت باعته فى مزاد فى المانيا ب 2 مليون دولار وعملت واحد تقليد لزوجة شيراك وكانت فاكرهاهبلة ومش ها تعرف ولما زغلت راحت سوزان مبارك أهدتها كام تمثال فرعونى من إللى عليهم القيمة علشان تصلحها بيهم ومن يومها زوجة شيراك ما بتطقش حاجة إسمها سوزان مبارك وكمان علشان عارفة أصلها الواطى فى أنجلترا وأن امها تمرجية!!!! لكن يسمى الميدان بإسمه فالملوك والرؤساء لا يخلدوا بذكر أسماء الميادين بأسمائهم إلا بعد وفاتهم وأهى تبقى بشرة خير اللهم آمين"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

