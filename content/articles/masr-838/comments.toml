[[comments]]
order = 27
subject = "رحيل الفرعون الاخير"
author = "احمد حسانين"
posted = "2006-08-28"
text = "الفرعون على مر التاريخ رمز للتسلط والتجبر والقهر وهو رمز لكل الاشخاص الذين ولاهم الله امور الناس فشقوا عليهم واستعبدوهم واذلوهم وضحكت عليهم انفسهم وشياطين الانس والجن وصوروا لهم انفسهم انهم كل شيء وقد كتب شاعر مصرى مغمور قصيدة يتكلم فيها عن فرعون فكانت روعة التصوير وصدق الكلمه وسلاستها فى كلماته الاتيه أننى....................؟ لم أكن يوم من ماء مهين..؟ لم أكن من تراب أو طين...؟ خلقت من نار ............؟ ربما من نور............؟ مسخ أثيم بين الملائكه والشياطين..؟ لم أخلق من ماء وطين..؟ أننى .....كل شيء للعالمين..؟ أشفى الأعرج، والأبرص، والأعمى, والعنين..؟ أحيى عظام الميتين..؟ من خبائى يخرج نورالشمس ومعطفى يبعث ضوء القمر..؟ أرسل للناس ماء المطر...؟ أنبت الزرع وأثمر الشجر...؟ بشـــماليا مقـادير البشــر...؟ أجلدكم ألف جلدة.....؟...وذنبى لديكم مغتفر..؟ أصلبكم فوق جذوع الشجر...؟ أجبرتكم أنتعيشوا كاالبقر...؟..معاذالله ....وتموتوا دون البقر..؟ من منكم فتر...؟ من منكم كفر..؟ جميعكم شكر...؟ مفيش فيكم واد دكر........! أه. قر. ق. ر. قر..قر.قر. أضاحككم وأمازحكم فى عيد العاملين...؟ وارفع بيدى آآآآآآآلام الكادحين...؟ حققت لمصر احلام السنين...؟ مصر لى وأنتم تراب مصر منذ الاف السنين ...؟ اننى اعشــق مصر وترابها...؟ ومن نيلها اصنع الطين...؟ كل هذا من اجلكم يامصريين ...؟ اشكرونى فرادى ومجتمعين...؟ أشكرونى ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ وفرت لكم الحشيش والبانجو والكوكايين أشكرونى ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ على الضوضاء والتلوث والمرضى والعاطلين أشكرونى؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ لم يعد لكم بيت يأويكم أصبحتم مشردين ...؟ لاطعام ولاشراب مطاردين...؟ هكذا اتباع الانبياء والمرسلين...؟ أننى ................................ أ<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

