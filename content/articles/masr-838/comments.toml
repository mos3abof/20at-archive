subject = "هانت يا صناع الحضارة"
author = "نورهان عادل"
posted = "2006-08-26"
text = "شهامه و رجوله عندما يقول حكام بلد رمسيس عدم تسميه الميدان باسم الحاكم الدكتاتوري لاننا لم نكن نسكت ونتصرف بجنون كما قالت الست انما للصبر حدود انما للصبر حدود يااااااا حكام بلد الفراعنه واعتقد انتخبات 2010 لم تكن مثل 2005 لان بعد حرب لبنان التي جعلتنا ننر للموضوع نظره اخري هانت يا صناع الحضارة"
archived = "2006-09-03"
