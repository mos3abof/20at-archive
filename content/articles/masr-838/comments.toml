[[comments]]
order = 16
subject = "اصبرو اصبرو إن النصر آت آت"
author = ".. & هيكل الأزهرى &.."
posted = "2006-08-26"
text = "والله يا جماعه حرام فى كل شىء الحكومة تضحك على عقولنا والعيال المتخلفين اللى قعدوا يرقصوا ويسقفوا عشان خاطر من الفرحة على الشاشة العقيمة المصرية والأولى , لكن هقولهم انا اسف ل90 فى ال100 منكم اكيد العشرين جنيه اللى اخدتوها لكل واحد يعمل الشكل دا فعلا عملت شىء معاكم انا واحد من الناس وعارف يعنى ايه 20 جنيه فى وسط فقر فعلا لاذع ,تانى شىء ان الحكومة المبجلة تقول ان الشعب فرحان ومش عارف ايه دا مسمحش بيه انا وكل العقلاء لأن لما يقولوا انهم صرفوا 6 مليون بس والمبلغ الحقيقى اللى تناقلته وكالات الأنباء 75 مليون جنيه يبقى حرام حرام حرام واقدر اقول نقل رمسيس من ميدانه للمتحف الكبير باطل باطل باطل , احب اقولك يا دكتور محمود انت بتتكلم فى جزئية كويسة لكن مين يتبرع لمين ؟ احنا شوفنا ايه من عائد الأهرامات او حتى السياحة ككل اللى بيهرونا بالكلام عليها ؟ ولا اى شىء كمان نتبرع عشان نساعد الطغاة على حبس انفاسنا والله العظيم لو حتى هتبرع بربع جنيه خسارة فى اللى جابوهم وما هتبرع بيه ليهم دا اكبر من شرب الخمره كمان يا دكتور بس صدقنى وما غد لناظره بقريبن والفرح جاى جاى جاى واحب اقول لبنت تانى اسمها علا على موضوع انه يكون اسمه على اسم اسم النبى حارسه ريسنا بقولك دا مش هيحصل لان الريس مهما كان طاغى لكنه مش غبى شعان يعمل حاجه تثبت للكل مدى دكتاتوريته انا اتوقع انه يحصل فعلا لكن بعد حوالى 5 سنين او تحديدا لما ابنه المنيل على عينه يمسك الرئاسة عشان يقولوا ا تمجيد لتاريخه وممكن تحصل معجزة وربنا ياخد الواد وابوه ويريح العالم منهم ونتحكم من شخص نحبه من قلوبنا فعلا وفى شىء تانى فى بنت اسمها نورهان اسم تعليقها جميل بجد صناع الحضارة الله عليكى يا نورهان والله فعلا حسيت بمصريتى دلوقتى بالجملة دى لكن احب اقو<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

