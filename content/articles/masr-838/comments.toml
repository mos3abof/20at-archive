[[comments]]
order = 34
subject = "جت على رمسيس!!"
author = "عبده وحيد"
posted = "2006-08-29"
text = "إيه يا خوانا والله الواحد محتار يقول إيه..المنايفة باعوا البلد باللي بيها ..مستكثرين على الحلوف المنوفي الثاني يبيع رمسيس؟!!!<br />إيه يا أهل الحذاقة والمفهومية؟ ومش بس مصر..فلسطين والعراق والسودان وليبيا والدور على سوريا..هاممكم قوي تمثال رمسيس؟<br />سوري sorryيعني، إنا يعنيني قيمة الإنسان ..الإنسان العربي ككل..واللي حلوف المنوفية وأمثاله خلوا قيمته ولا تسوى...ده حتى في بلاد بره في أوروبا ولا أمريكا ولا في جنوب شرق آسيا حتى لما نعترض على إجحاف ولا تميز عنصري في المعاملة يتقال لينا بوقاحة\" ليه في بلدك بتتعامل أحسن من كده؟ روح بلدك طيب!\"، واللي يغيظ عندهم حق.<br />ساكتين ليه؟ مستنيين إيه؟ حتخسروا إيه أكثر؟ خايفين على إيه ومن إيه؟ أربعة مليون إنسان في قاهرة المعز من سكان المقابر، ويعلم ربنا كام مليون مش لاقين حتى تربة يناموا فيها..آه يا شعب الحضارات!"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

[[comments]]
order = 35
subject = "ميدان التفافه العام"
author = "سمير المصرى"
posted = "2006-08-29"
text = "مع احترامى لكل من كتب جمله وكتبتم كلكم بما فيه الكفايه ..ولكن انتم كتبتم غلط..انتم مش فهمين حاجه صغيرة تيها عنكم ..يا اخوانى ده حيحطوا تمثال للرئيس حسنى مبارك باشا ..ليه علشان كل واحد فى مصر وكل واحد قادم الى القاهرة يقدر يتف عليه وعلى دين امه وكمان يقدر يشخ عليه ويترتر على وش اللى جابوة ..ده نوع من الانتقام واشفى غليلى ..تتخيل ان البلاديه كل يوم بدل ماتشيل زباله سوف تستعين بسيارات الشفط علشان تقدر تشفط كميه التفافه اللى على وش كسم حسنى حق لنا ان نفرح انا واحد من الناس كل يوم وانا رايح الشغل مش حشخ فى المنزل ابدا انزل عند ابن الوسخه اشخ عليه وبعدين اروح الشغل وكذالك وانا جاى من الشغل"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

[[comments]]
order = 36
subject = "حرام عليك"
author = "د. عبلة حافظ"
posted = "2006-08-29"
text = "ليه يا وائل يا عباس تشتم في الجامع الازهر و عايزهم يحطو تمثال رمسيس جوه ؟<br />يا وائل مش معني إنك إرتديت عن الاسلام إنك تتريق و تشتم فيهم.<br />انا عارفه إنك دلوقتي كاثوليكي فايريت تتعلم من دينك الجديد الاحترام و الانسانيه.<br />انا عندي أصدقاء كاثوليك كتار و كويسين اوي.<br />و انا مع حرية العقيدة ، فلا يهمني دينتك او ملتك يا وائل يا عباس."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

[[comments]]
order = 37
subject = "هاتي طرحتك ابوسها"
author = "وائل عباس"
posted = "2006-08-29"
text = "معلهش يا حاجة يا لي اسمك عبلة ، انا حر اقول اللي انا نفسي فيه.<br />انا زهقت من التفكير البدوي المتصحر بتاع المسلمين دي.<br />و لو مش عجبك متدخليش علي النت ، و لا النت مش حرام دلوقتي ؟؟"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

[[comments]]
order = 38
subject = "المدعو وائل عباس"
author = "وليد"
posted = "2006-08-30"
text = "لماذا خرج المدعو وائل عباس عن اصل الموضوع اذا كان هو وائل عباس فعلاولماذاالتهجم على الاخوان فى الوقت الذى لايملكون لانفسهم ضرا ولانفعا ويقدمون الان تضحيات كثيرة من اجل التغيير هل اعتلى الاخوان الحكم ونهبوا الشعب المصرى واذلوه هل سرق الاخوان المصريين وهربوا اموالهم الىالخارج انت تثير نعرة طائفية بابياتك الغثة وياسيدى الفاضل الحكم بين الاخوان والشعب هو الشعب نفسة اليست هذة هى الديمقراطية فالكل يعرف العدو والصديق والقاصى والدانى انة لو اجريت انتخابات حقيقية فسيكون الاخوان علىكرسى الحكم فهل عندها سنلعن الشعب اذا اتتك مذمتى من ناقص فتلك شهادة بانى كامل"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

