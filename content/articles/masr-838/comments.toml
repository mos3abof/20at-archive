[[comments]]
order = 2
subject = "يارب يتفضحوا"
author = "زنوبه"
posted = "2006-08-24"
text = "إذا كان قلبهم مش على المصريين الغلابه اللى راحوا فى القطر يبقى حيكون ليهم قلب على تمثال مهما كانت قيمته<br />عليه العوض فى البلد<br />إنشاء الله يتفتفت تراب ويضفضحوا آكتر وآكتر<br />وبعدين مبلغ تكلفة نقل التمثال كان ممكن تتصرف فى آوجه خير كتير للشعب الغلبان ـ لكن نقول إيه النهارده بس آفتكروا يطلعوا فلوس لتجديد السكه الحديد لكن بعد مالناس راحت بانت المليارات.<br />الاكثر غباء آنهم تكلفو ملايين لآنشاء مدن جديده بدون خطوط مواصلات فآصبحت تلك المدن مدن آشباح ـ خد عندك مثلا فى آمريكا آول ما سرقوها من الهنود الحمر آبتدوا التعمير بآنشاء خط للسكه الحديد وبعدين بنوا على آطرافه المدن ـ مش العكس زى ما بيحصل هنا<br />آنا كل يوم بآذداد إقتناع إن الناس دى عارفين هما بيعملوا إيه وإزاى يتوهو الشعب ويكسروا شوكته<br />و... حزبنا الله ونعم الوكيل"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

[[comments]]
order = 3
subject = "عقبال كل فرعون جبار"
author = "لا للتوريث"
posted = "2006-08-24"
text = "أنا والله بحاول أفهم قولت يمكن أنا فهمي تقيل ولا حاجة ... بس فعلا ياخونا حد يفهمني له... له ..متحف لسه ما تبناش ولا أطحت فيه طوبة نقوم نحط فيه تمثال لمدة خمس سنوات في هنجر ... ومشروعات تطوير ميدان رمسيس بنسمع عنها سمع خير يجي من عشرين سنة وأكتر من أيام مترو الأنفاق .. يمكن وجب نقله بقرار كالعادة من الخارج ... يمكن ...على العموم موضوع القطار أهم من 1000 تمثال وربنا يورينا وجه المدعي العام الاشتراكي وهو بيفتخر أنه جاب تعويضات للناس إللي ماتت في القطار زي ما شوفناه وهو منور في ضحايا العبارة وكل كارثة قومية وأنتم بخير ...وماتنكوش ضحية"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

