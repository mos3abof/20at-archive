[[comments]]
order = 32
subject = "سبب نقل التمثال"
author = "زنوبه"
posted = "2006-08-29"
text = "كتب حسين عودة (المصريون) : بتاريخ 27 - 8 - 2006<br />تحدثت مصادر بالمجلس الأعلى للآثار عما اعتبرتها دوافع \"حقيقية\" وراء نقل تمثال رمسيس من الميدان المسمى باسمه في قلب القاهرة إلى موقعه الجديد بالهرم.<br />وقالت المصادر إن مؤسسة الآثار الإسرائيلية طلبت من هيئة الآثار المصرية في عام 1992م نقل تمثال رمسيس إلى موقع آخر بعيدًا عن قلب القاهرة معللة ذلك بأن التمثال يتعرض للإهلاك من عوادم السيارات المستمرة بالميدان والتلوث والبيئي، لكنها لم تستجب لتلك الدعوة آنذاك.<br />وعادت بعثة الآثار الأمريكية المتواجدة في القاهرة لتكرر الطلب ذاته بعد أن ساقت نفس المبررات، فضلاً عن تداعيت هزات مترو الأنفاق، لكن المجلس الأعلى للآثار رفض هذا الطلب أيضًا، على ما أفادت المصادر.<br />وأشارت المصادر ذاتها إلى أن الموقف المصري طرأ عليه تحول خلال العامين الأخيرين، عندما أعلنت إسرائيل في عام 2004م أن لديها بعض الآثار المصرية التي عثرت عليها في عام 1967م أبان احتلاها سيناء.<br />ودخل المجلس الأعلى للآثار منذ عام 2004م وحتى مايو 2006م في مفاوضات لإعادة الآثار المسروقة من إسرائيل، والتي تضم بعض التماثيل النادرة المصنوعة من الجرانيت لملوك من الأسر المصرية المختلفة، فضلاً عن توابيت وبعض الأواني الفخارية.<br />وأصرت إسرائيل في المقابل على مطلبها بنقل التمثال، وهو الأمر الذي أرجعته المصادر إلى اعتقاد اليهود بأن الملك رمسيس الثاني هو الذي حارب اليهود في مصر وقام بتفريق شملهم منذ ذلك الوقت.<br />وأشارت المصادر إلى أن تلك الدعوة جاءت نتيجة ممارسة ضغوط من الجماعات اليهودية المتطرفة على حكومتها لطمس أي معالم تذكرهم بماضيهم."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

