subject = "رحم اللة رمسيس"
author = "نور الغد"
posted = "2006-08-25"
text = "ميدان التحرير يصبح ميدان السادات وميدان رمسيس يصبح مبارك ولو اصبح الميدان كلة صور مبارك لن يقول الناس غير ميدان رمسيس والراجل بتاع المتحف العايز الشعب يتبرع علشان يبنى متحف يعم فاروق حرام عليكم كل شوية اتبرع عشان حريق قطار الصعيد اتبرع علشان العبارة اتبرع علشان قطار قليوب دحناء بلد كوارث بسبب حكومة النحس النحست الشعب ومعها ذهر الغلاء والبلاء وظلم العباد وسجن ابمن نور والعريان وتدمير الغدوالوفد والاحرار رحم اللة رمسيس والبقاء للة"
