subject = "فرعون مكان الفرعون"
author = "العربي المصري"
posted = "2006-08-26"
text = "ذهب الفرعون إلى الجبل .. وقالوا أن الفرعون المبارك أعطى أسمه المبارك للميدان...!!<br />ذهب الفرعون إلى الجبل على مضض .. فلقد جاؤا به من هناك بعد الثورة ..!! وهاهم يعودوا به بعد أن داسوا مافعلته الثورة بأحذيتهم.. فلاحاجة لهم بمن يذكرهم بشيء!<br />هل خافوا على الميدان أو الحجر لانعرف؟<br />هل أرادوا مزيدا من السرقة في عملية نظيفة حقا \" متحف الفرعون..\" أم أرادوا أن ينظفوا الميدان من دراويش الفرعون وكل من يعيش في كنف الفرعون ..<br />العجب أن المقارنة تفرض نفسها أمام حالة واحدة تتكرر في مصرنا الغريبة..<br />فرعون باب الحديد يعيش في حضرته كل أصناف البشرمن أصحاب السوابق والجرائم وينتمون إلى امبراطورية متكاملة هدفها المصري الفقير الذي يعبر الميدان لزيارة الحسين أو السيدة فيجردوه من كل شيء ويعود خائبا إلى قريته بعد أن يبكي على مصر...<br />فرعوننا هو الآخر يعيش في كنفه مجموعة من قاطعي الطريق على أهل مصر بحق.. ويتفننون في إذلال أولادنا وشبابنا فيصدرون القانون بعد القانون .. من أجل أن يظل الفرعون في مكانه ويظلون هم أيضا ونظل نحن كما نحن يلقى إلينا بالفتات...<br />ورغم ذلك لم ينطق قاضياً .. أصابهم الخرس جميعاً رغم أن منهم أولاد مصر بحق..<br />هذه العصابة قامت بتخريب كل شيء من أجل دراهم ينفقونها في كان ولوزان ومستشفيات أمريكا ..<br />مثال من التخريب هو التعليم الذين أفسدوه تماماً ، قاموا كالعظماء السبعة بداية من بهي الدين ولا أعلم الباقي ودمروا الثانوية العامة تدميراً<br />هل يعقل أن من يحصل على 96،50 لايدخل اي كلية من كليات القمة ..<br />ما المطلوب إذن من الطالب الفقير الذي عاش عمره وعاش أهله يحلمون بيوم ...<br />القضاة صامتون أصابهم الخرس وهم خط دفاعنا الأخير أمام الفرعون المبارك اوهكذا كنا نظن!!<br />لكن المبرر أن العصابة<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

[[comments]]
order = 20
subject = "لا ولسة"
author = "ياسر ابو سمية"
posted = "2006-08-26"
text = "لا ولسة انا قرات النهاردة ان الباشمهندس زاهى حواس خولى الاثار فى بر مصر بياكد انه هيبدا نقل اثار تانية لنفس المكان الصحرا اللى حطه فيه الغلبان رمسيس ،يعنى من الاخر كده كل كام يوم يقولك احنا خصصنا 6 مليون جنيه لنقل تمثال مش عارف ايه من مكانه فى عزبة النخل للمتحف الجديد واصرف يا سيدى ولا يهمك هى فلوس ابونا ،ماهى فلوس الغلابة اللى بيتخانقوا كل يوم 6 مليون مرة علشان البريزة والربع جنيه اللى السواقين مصرين انهم يزودوها على الميكروباص ،الف حسرة عليكى يا مصر ،امتى هنهتم بالبشر اللى عايشين زى ما بنهتم باللى راحوا .يعنى ينفع كل يوم يغادرنا 100 ولا 200 وممكن يوصلوا 1400 من ابناء البلد الغلابة واحنا قاعدين نفكر هننقل اى تمثال النهاردة .اففففففف"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

[[comments]]
order = 21
subject = "..& إن النصر آت آت &.."
author = "..& هيكل الأزهرى &.."
posted = "2006-08-27"
text = "بصى يا نورهان اغنية عاصى الحلانى لما بيقول بيروت قومى يا بيروت انا فعلا عينيا بتدمع اما اسمع المقطع دا وبقولك نفس الشىء اذا كان بيروت فيها دمار فمصر مليئة بالخراب والفساد لكن صدقينى انا متفائل واحنا مش بإيدنا الا ئىء واحد مهم جدا جدا جدا هو اصلاح المجتمع عشان لما ربنا يكرمنا ونتحرر من مبارك وامثاله بجد نكون فعلا قد المسؤولية وفعلا نعمل لوطننا مستقبل باهر وتغيير المجتمع دا يبدأ بإصلاح نفسنا احنا دا اهم شىء وعاوز اقولك يا نورهان اذا كنا احنا كمصريين فعلا حاسين بدا فالصبر اول مفاتيح النصر وان شاء الله هنفرح جميعا بتحرير بلدنا من الفساد واصحابه ربنا يوفقنا جميعا واحب اقولك ان النصر آت آت لا تحزنى يا نورهان لأنك بنت مصر الأصيلة اللى فعلا من احساسك وعزيمتنا احنا كشباب مصر بإذن الله هنحرر البلد دى من كل سوء وربنا يوفقنا جميعا فى تحرير نفسنا الأول ونبدأ جادين فى تحرير الوطن ."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

[[comments]]
order = 22
subject = "يا ولاد أرحموا بقي"
author = "محروق الدم مصاب بالغم"
posted = "2006-08-27"
text = "ايه مش عاجبكوا ... زي القطط بتاكل وتنكر<br />عايزين التمثال يتنقل نقلناه \" حسب رغبة الجماهير \"<br />عايزين حسني جبناه \" [اجماع لجماهير وقوي الشعب الهاربه\"<br />عايزين سلام \" أدينا في استسلام اقصد سلام \"<br />ولادكو حلوين ومبسوطين وصيعين احنا مريحينهم ومخلينهم صايعين<br />عايزين ايه تاني<br />اسمي الميدان زي ما انا عايز هو من امتي كان بتاعكوا<br />من امتي كان فيه حاجه بتاعتكوا اساسا<br />من امتي كنتوا في مصر<br />مصر بتاعته يا ولاد<br />بتعته وبتاعت عصابته يا ولاد<br />عواد باع ارضه من زمان وسكت عليه يا ولاد<br />يا عواد اصحي بقي يا عواد<br />لأمتي هتفضل ساكت<br />تعرفوا عواد لو حد قابله يقوله ارضه اتسرقت صحته خربت تعليم ولاده فاشل كبده فشل كليته فشل مع المدام فاشل وعايزينه يقول لأ عوااااااااااااااااااد باع أرضه يا ولاد<br />غنوا يا ولاد غنوا<br />ماهو ناح النواح والنواحه علي بقرة حاحا<br />ناح النواح والنواحه<br />على بقرة حاحا النطاحه<br />والبقره حلوب<br />تحلب قنطار<br />لكن مسلوب<br />من أهل الدار<br />والدار بصحاب<br />وحداشر باب<br />غير السراديب<br />وجحورالديب<br />وبيبان الدار<br />وف يوم معلوم<br />عملوها الروم<br />زقوا الترباس<br />هربوا الحراس<br />دخلوا الخواجات<br />شفطوا اللبنات<br />والبقره تنادي<br />وتقول ياولادي<br />وولاد الشوم<br />رايحين في النوم<br />البقره انقهرت<br />في القهر انصهرت<br />وقعت في البير<br />سألوا النواطير<br />طب وقعت ليه<br />وقعت من الخوف<br />والخوف ييجي من ايه<br />من عدم الشوف<br />وقعت من الجوع ومن الراحه<br />البقره السمرا النطاحه<br />ناحت مواويل النواحه<br />على حاحا<br />وعلى بقرة حاحا"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

