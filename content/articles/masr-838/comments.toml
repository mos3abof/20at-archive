text = "الوزير عاوز تبرعات لبناء المتحف وبعد كده تيجى السيده حرم السيد تتمنظر وتكتب الصحف انه تم بمجهودات السيدة وعبقريتها انا اقسمت بالله بعد موضوع تسديد ديون مصر قررت ان اى مبلغ لاى مشروع بتعملة الحكومة بالظبط زى ما يكون بشرب بيه خمرة والعياذ بالله بمعنى ان التبرع للحكومة كمثل شارب الخمر بالضبط انا حاسبها كده لان دى حكومة فاسدة فاسدة وحرام فيها اى قرش"
