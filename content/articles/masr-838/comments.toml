[[comments]]
order = 13
subject = "ال كل المصريين ال"
author = "محمد السعدنى"
posted = "2006-08-26"
text = "هم فين المصريين دول ، المصريين اتسرقوا واتنهبوا واتقتلوا فى القطارات وفى عرض البحر دون اى تحقيق وانتقام من الفاسدين المفسدين ، وكان البيه عايز يسمى الميدان باسمه يلعن ابو اهله دى البلد كلها بقت فى كرشه<br />ميدان رمسيس زمان كان فيه فسقية كبيرة زى حمام السباحة والتمثال وكانت منطقة جميلة الناس تحب تروح هناك ( الناس الغلابة ) ودلوقتى طالما ان مبقاش فى مصر مكان للغلابة يبقا طبيعى جدا يسرقوا مننا حتى الاحلام والذكريات الجميلة ، وبيقولوا تطوير الميدان اه يا خوفى من التطوير ده ، ربنا يستر ومش يبيعوه او يخصخصوه ، اه يا خوفى عليكى يا مصر اهلك نايمين وسعرهم بقا التراب وانتى رايحة على فين الله اعلم"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

[[comments]]
order = 14
subject = "تقدروا تزروه في بير سبع!!"
author = "الفرعون العاشق"
posted = "2006-08-26"
text = "أصله حلوف المنوفية باع رمسيس التاني ده لإسرائيل والكلام ده مش إي كلام يا سادة يا كرام..والثمتال حيتحط في قاعة خاصة مقابل للوحة سبي بابل اللي إهداها الأمريكان لإسرائيل لما إحتلوا العراق.<br />يابن الوسخة يا منوفي، ناوي تبيع إيه تاني؟ قال بقى يفهم في علم الآثار إبن البهيمة والحمار!!<br />ومتزعلوش يا جماعة حزني إشترط على سيده أولمرت والشرط نور وبضمانة بطرس غالي ومراتة إنه يسمح للسياح المصرين برؤية التمثال حين زيارتهم\" لبير السبع\" مجانا مع ساندوتش مورتدلا وزجاجة كولا، عايزين أكثر من كده؟<br />ياريت يبيع لهم الأهرامات وسقارة بالمرة..أكيد حيبقى فتة وكباب ومحمر ومشمر ومزة طازة وآخر مزاج، ياريت تحطو في عنيكم حصوة ملح وتبطلوا بطر وقر يا ناس يا شر.<br />تحيا إمبراطورية المنوفية..تحيا البطاطس والملوخية!!!"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062242/http://masr.20at.com:80/article.php?sid=838"

[[comments]]
