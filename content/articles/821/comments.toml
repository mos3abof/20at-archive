text = "ستوب من فضلكم رد على بعض بالاسلوب ده وشتايم وجبان وعقليه متخلفه ورجعيه مينفش كده خالص مضحكوش علينا الناس يا جماعه احنا مسلمين ومنظمين والرد يكون هدفه اني اصلح مش مبسوط برايي وفرحان بيه اسمع كده الامام الشافعي بيقول ايه<br />رايي حطا يحتمل الصواب ورايي غيري صواب يحتمل الخطا) كلنا عايزيين نعرف الصح وربنا يكرم ويستر طريقكم قادر يا كريم"
