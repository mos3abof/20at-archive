text = "بسم الله الرحمن الرحيم<br />بما إن احنا حلينا مشكلات المسلمين خلاص وحررنا القدس وطلعنا الأمريكان من العراق وبلدنا أصبحت ديمقراطية ومفيهاش فساد وكل الناس بتصلى فى المسجد يبقى مفيش مانع من إننا نناقش موضوع صلاة النساء فى المسجد خلف الرجال لأنه أصبح من أولويات الأمة.<br />الله أكبر ولله الحمد<br />الإسلام هو الحل"
