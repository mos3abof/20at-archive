[[comments]]
order = 7
subject = "stooooooooooooooooop"
author = "adhb_85"
posted = "2006-07-04"
text = "عامل مشاكل في كل حته ليه يا عبده بتضايق الناس ليه ياعبده معلش يا جماعه عبده ميقصودش احنا دلوقتي خلاص حلينا كل المشاكل والناس بدات تروح تصلي ما شاء الله مالين الجوامع وزياده والستات كمان وكله لبس الحجاب وكله متقن عمله وكله كويس والحمد لله يبقى لازم بقى نفكر في المشكله اللي فاضله في الدين كله وهي صلاة النساء خلف الرجال(الاختلاط في المسجد -الكلمه دي متنفعش يا نجم -) وهنحلها المشكله دي بكل بساطه اولا اول صف للرجال هيبدا من الخلف و طبعا هيكون كله شباب وكمان اول صف للستات هيكون كده وهيبقى تنافس فظيع على الصلاه في المسجد والخشوع بقى والبكاء طبعا ما هو ده اللي ناقصلنا في الدين كله بس في حاجه بسيطه اوي متستغربولهاش ان النبي صلى الله عليه وسلم كان بيسلم اول تسليمه النساء تسلم من الصلاه وتمشي الحاجه التانيه ان المسجد مكنش فيه نور علشان يشوفو بعض وكمان المسجد كان بدائي مش زي دلوقتي وكان في مكان لدخول وخروج النساء منفصل تماما عن الرجال والحديث بيقول ان (خير صفوف الرجال اولها وشرها اخرها وخير صفوف النساء اخرها وشرها اولها ) وكمان ان صاة المراه في بيتها خير من صلاتها في المسج وصلاتها في خدرها خير من بيتها الله يكرمك كفايه تاليف لو مش عارف قول مش عارف ونرجع لعلماءنا ويارب نفهم وربنا يسترها معاناااااااا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123642/http://www.20at.com/article2.php?sid=1021"

[[comments]]
order = 8
subject = "لا حول ولا قوة إلا بالله"
author = "لور دكاش"
posted = "2006-07-04"
text = "يا أخ عبد الله ربنا يهديك.. هو حد كلمك أصلا ؟!! مين اللي قال انك المقصود بالتعليق !!<br />على العموم ده رأيك، ولازم نحترمه.. زي ما انت لازم تحترم رأي غيرك، ولا تصفه بالاندفاع.. ده اولاً...<br />ثانيا أنا مش مضطرة أناقشك بالقرآن والسنة في حاجة الرأي الشرعي فيها واضح، وموجود كمان في الموضوع، ان الفكرة المطروحة جائزة شرعا بضوابط معينة، أنا بتكلم في موقف الرافضين لمجرد الخوف من الفتنة.. كما لو كان الجنسين معزولين ومش هيتقابلوا غير في صلاة الجماعة... يعني بتكلم في أسلوب تفكير مش في موقف شرعي...<br />على العموم شكرا.. وربنا يهدينا جميعاً"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123642/http://www.20at.com/article2.php?sid=1021"

