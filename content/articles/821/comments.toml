subject = "احطها ولاه اشيلها نغير السؤال"
author = "هوووووووبه"
posted = "2006-07-03"
text = "اممم شوف ياكابتن , لما تبص علي امريكا والدول المتقدمه<br />علي انهم قله بمعني \" المسجد\" مش مسجد بالمعني المتداول<br />يعني \" مركز اسلامي\" فيه لعب لاطفال<br />علي ستات علي رجاله \" في ستاره فاصل طبعا\"<br />, بس في ظروف بتعيق الستات<br />مش في كل المرااكز , في وفيه, مركز ستات علي رجاله وستار فاصل<br />او الرجاله تحت والستات فوق , ليه7 الاختلاط لسببين ي<br />اقليه زي ما قلت الستات بعيالها ومتقدرش تسبهم<br />بضطر تاخدهم معاها \" والرجاله ينداهو من ورا الستاره<br />هدووووووء\"<br />والستات تخنقو نعمل ايه في عيالنا...<br />خلااااااص الدو ر الاول االاطفال ...<br />والتاني للنساء \"مع الرجال\", ماشي الكلام ماشي ...<br />في نص الصلاه يااخت ابنك بيعيط تحت....<br />تنزل من فوق حااااااضر... حاااااضر...<br />\" ياماما ... يعععععععع\"<br />\"لماجالي كلوه...\"<br />يشيلو الستاره يحطوها اصلي وامشي يلا باي.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123642/http://www.20at.com/article2.php?sid=1021"

