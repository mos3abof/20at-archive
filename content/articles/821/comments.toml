[[comments]]
order = 10
subject = "ايه اللي انت فيه ده يا فوزي"
author = "عبدالله مفتاح"
posted = "2006-07-04"
text = "ملوخية ايه وباميه ايه وبطيخة ايه وواد كمان؟<br />مصيبه لو كنت مش عارف ان سيرة ابن هشام بتحكي السيرة النبويه<br />وانا قلت اظن لاني مش فاكر انا قرات حادثة التدافع على باب المسجد فين<br />بس واضح انك معندكش فكرة عن اي حاجه والا كنت تفضلت عليا وقلتلي انت غلطت في كذا والصح كذا<br />لكن ايه سوق الخضار اللي انت عملته ده<br />خليك انت على جنب<br />لور دكاش يعني الكلام المرة دي مش ليا؟<br />ماشي بس انا بحترم كل الاراء ولو قلت لحد انه غلطان بقله بشياكه<br />متنسيش انك في احد المواضيع السابقه اعتبرتيني من العقليات المتخلفه<br />وعلى العموم حصل خير<br />ياريت بقا اللي يلاقيني غلطت في حاجه يصححهالي بادب وانا مش هزعل اما االاخ فوزي واخوانه ده معندوش فكرة عن حاجه وربنا يهديه<br />تحياتي للجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123642/http://www.20at.com/article2.php?sid=1021"

[[comments]]
