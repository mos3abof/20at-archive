[[comments]]
order = 12
subject = "مفيش فايدة فيك جبان"
author = "نهي"
posted = "2006-07-04"
text = "بص يا بتاع فوزي انت .. كفاية انك جبان و مش بس جبان لا مخك علي قدك يعني عايز تشتم عبد الله داري نفسك لكن كل كلمة بتقولهل بتعرفنا انت مين... والله تعبان في عقلك .. للاسف انخدعت فيك سنيين و انت انسان لا تستحق اي احترام نهائي .. عشرينات انا منافقتهمش زيك في وشهم شتمتهم انما انت عشان مصلحتك ملزق نفسك لهم و صراحة هما كمان مع ان زمان كان يقولوا لا منتعاملش معاه عشان لسانه و بعدها بأسبوع الاقيك عندهم<br />عموما الطيور علي اشكالها تقع بس علي الاقل حاول تحترم غيرك عشان الناس تحترمك و بطل تكون جبان يا **** و تشتم بأسم غير اسمك المرة دي هعديها المرة الجاية هقول انت مين في كل حته تيجي تسخر فيها من حد من اصدقائي او مني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123642/http://www.20at.com/article2.php?sid=1021"

[[comments]]
order = 13
subject = "علينا ان نهتم بالجوهر وليس المظهر"
author = "واحدة وخلاص"
posted = "2006-07-04"
text = "بعد إذنكم عايزة اقول رأيي<br />1)مش كل حاجة كانت بتحصل زمان أيام الرسول (صلى الله عليه وسلم) لازم تحصل دلوقتي بنفس الشكل والأسلوب لان فيه حاجات كتير جدت مكنتش موجودة زمان -(بس المهم اننا منبعدش عن المضمون والهدف من الحاجة دي ).<br />2 ) يعني زمان الخرسانة مكنتش لسه اخترعت علشان يعملوا بيها جدار ومكنتش المساجد بالمساحات الكبيرة ومكنش فيه تكنولوجيا علشان تنقل الصوت زي دلوقت.<br />3) ورأيي الشخصي المتواضع - ان اهم حاجة يكون فيه مكان مخصص للسيدات - سواء كان يوجد فاصل أو لأ - وأنا شخصيا حستريح لو كان فيه فاصل بين مصلى الرجال والسيدات.<br />4) فيه حاجات اهم من هذة القشور لتناقش ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123642/http://www.20at.com/article2.php?sid=1021"

