[[comments]]
order = 3
subject = "ياه على الخلط"
author = "عبدالله مفتاح"
posted = "2006-07-03"
text = "بص يا سيدي ياللي عامل التحقيق<br />لما تقول ان المسجد ايام النبي صلى الله عليه وسلم كان مختلط كده يبقى انت غلطان غلط كبير (بحسن نية)<br />اولا لان المساجد زمان مش زي المساجد بتاعتنا20 متر<br />ثانيا كان الفراغ بين الرجال والنساء كبير وتقدر تتاكد من الكلام ده اظن من (سيرة ابن هشام)<br />ثالثا النبي صى الله عليه وسلم كان امر بعمل مدخل للنساء عشان حاله التدافع اللي حصلت<br />رابعا: مش معقوله نسيب كوووووووووووول الايجابيات اللي في عصر النبي صلى الله عليه وسلم<br />ونيجي عند الحاجه اللي كلنا عارفين انها هتعمل فتنه ونعلق عليها ونمسك فيها<br />المسجد ايام النبي صلى الله عليه وسلم مينفعش يتقال عليه مختلط<br />لان كلمة اختلاط اصلا كلمه مستحدثه واطلقت على المكان اللي بيجتمع فيه الرجال والنساء واظن ان معناها اللي كل الناس عارفينه ان المكان المختلط اللي الرجال والنساء بيتعاملوا فيه<br />الله يكرمك بلاش تعمل لبس عند الناس على موضوع ميستاهلش<br />الموضوع محسوم مينفعش يتعمل النظام ده دلوقتي لان شكل المسجد اتغير<br />الا لو في مصلى (زي مصلى العيد)يبقى معلش والمسافه بينهم تكون كبيرة ويخصص باب للنساء<br />يعني من الاخر الكلام في الموضوع ده مش هيؤدي الا الى فتنه ولبس<br />واصلا ان يكون في حاجز بينهم ده اريح للنساء وللرجال<br />ولا الراجل هيكون مرتاح ولا المراه هتكون مرتاحه<br />الحاجز اريح للجميع<br />وربنا يهدي الجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123642/http://www.20at.com/article2.php?sid=1021"

[[comments]]
order = 4
subject = "مستغربة قوي !!"
author = "لور دكاش"
posted = "2006-07-03"
text = "والله اللي بيحصل فينا ده حلال.. لما حكوماتنا تدينا بالجزمة وتقول مفيش ديمقراطية لأننا لسة في فترة المراهقة السياسية.. لأننا مش بس مراهقين سياسيا.. لأ وفكريا كمان<br />مش فاهمة ايه حالة الهلع من التعامل مع الجنس الآخر سواء من البنات أو الشباب.. كما لو كانت صلاة النساء خلف الرجال بدون ساتر هي اللي هتفسد أخلاقنا.. هو انت يا أخي هتشوف بقفاك.. ولا الستارة دي هي اللي هتمنعك من النظر.. طب ما هي الستات هتخرج معاك في نفس الوقت بعد الصلاة !!<br />أنا عن نفسي شايفاها فكرة محترمة جدا، وده بجد لأني بعاني في أي جماعة لو دخلت في وسط الصلاة.. ولا ببقى شايفة الإمام ولا عارفة ده بيسجد ولا بيقرأ.. ويا سلام بقى لو جت سجدة تلاوة، تبقى الصلاة ضاعت في التفكير والتخمين<br />يا ريت بجد النظام ده يطبق في الجوامع، وحتى الزوايا.. حتى لو كان في جدار بين مكان النساء والرجال، بس يكون قصير بحيث يسمح للنساء برؤية الإمام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123642/http://www.20at.com/article2.php?sid=1021"

[[comments]]
order = 5
subject = "الى لور دكاش"
author = "عبدالله مفتاح"
posted = "2006-07-03"
text = "المرة اللي فاتت طلعتيني عقليه متخلفة والمرة دي طلعتيني فكري مراهق بشوف بقفايا باين<br />كلام جميل جدا بس هي المشكله من الاول ان في المرتين محاولتيش تناقشي بالقران والسنه<br />اذا كنت انا عقلي متخلف وفكري مراهق بلاش تقولي كلام مرسل وقولي كلام علمي ارد عليه<br />انا مش لاقي في كلامك حاجه ارد عليها باستثناء سجدة التلاوة<br />والسؤال معقوله متعرفيش مواضع سجود التلاوة ومعقوله مفيش ولا واحده من اللي بيصلوا يعرفوا مواضع سجود التلاوة؟<br />طبعا انا مش لاقي كلام ارد عليه لانه كلام ملوش اي اصل في اي حته<br />بس لو عايزة تطبقي الموضوع ده طبقيه وشوفي الشباب هيصلي كل فرض اربع مرات<br />والمسجد مش هيبقى مكان للتعبد هيقلب مكان للتظبيط ولو قلتي لا يبقى بتضحكي على نفسك وبتخدعيها<br />بس لازم اقلك حديثين يمكن تبطلي حالة الاندفاع اللي انتي فيها<br />الحديث الاول :لم :\" لا تمنعوا إماء الله مساجد الله ، وبيوتهن خير لهن\"<br />الحديث الثاني:لأن تصلي المرأة في بيتها خير من أن تصلي في الدار؛ ولأن تصلي في الدار خير لها من أن تصلي في المسجد.<br />يا ريت بعد كده تحاولي تكوني هاديه شويه عشان الكلام ميطلعش بالشكل ده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123642/http://www.20at.com/article2.php?sid=1021"

[[comments]]
