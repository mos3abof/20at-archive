subject = "عبد الله مشكاح"
author = "علي فكره يا عبد الله مفتاح انت فعلا اكيد بتحب تعمل فتنه بالملوخيه وا عندك فعلا ضيق عقل ربنا يبعدنا عنه او دماغك في باميه مش عارف ليه انا حاسس كده من كل كتاباتك يا عم اعمل بدل ما تكتب جبت لي المغص في راسي وصداع في صباعي يا جماعه انا شاكك في الواد ده وشكله ليش في التثقيف اي شيء نهائي ةيقةل لي اظن سيره ابن هشام طيب يا خويه ظن ولما تتاكد تعالي اكتب وبالمصارده يا بطيخه"
posted = "2006-07-03"
