[[comments]]
order = 3
subject = "تكملة ل : كرسي بعجل....... (هاني رمضان)"
text = "الفجر الأكبر جاي<br />ومعاه الأمل<br />ومعاه أسود<br />طالبه تسود<br />جايه و في اديها الكفن<br />لجل الشهيد الحي<br />توصل كلمته<br />والكل يعرف<br />هي ايه قضيته<br />ليه يقتلوه<br />ليه يغتالوه<br />ليه من بعيد الغدر يبعت طلقته<br />يبعت صاروخ<br />ليه جاي قاصد سكته<br />ليه يغتالوه<br />ليه يقتلوه<br />ليه في ألوف<br />بالغدر عايزه تسكته<br />عايزه الأدان في القدس تسكن صرخته<br />عايزه ياسين من غير لسان<br />من غير كلام<br />عايزه القعيد الحر تسكت كلمته<br />والكرسي ينسي صحبته<br />الفجر نَور<br />لا بـيـبـتـعـد<br />ولا حتي بـيخاف الأجل<br />الفجر جاي ، أيوه بصحيح<br />وبيتولد فينا الأمل<br />يفتح طريق<br />لازم نسير<br />ولا احنا ها نخاف الأجل!!<br />يا فجر ياللي الشيخ ياسين جه ودعك<br />جاي بصحيح ؟<br />جايب سلاح؟<br />جايب أمل؟<br />جايب معاك بسمة شهيد؟<br />هات من جراح العمر<br />واحكم قبضتك<br />يا فجر يلا همتك<br />خلي الي داس علي الجرح<br />يعرف قسوته<br />خلي إلي سارق أرضنا<br />خلي إلي بايع حلمنا<br />بسلاحنا يعرف خسته<br />الفجر الأكبر جاي<br />ومعاه الأمل<br />جاي من بعيد<br />ومعاه دليل<br />ومعاه أمارة من الشهيد<br />جايب معاه ...... كرسي بعجل"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417080313/http://www.20at.com:80/article.php?sid=59"

