subject = "كراسينا بدون عجل"
text = "ما شاء الله ولا قوة الا بالله..القصيدة رائعة من حيث المعنى والبناء ..الوجيعة على قدر الفجيعة..المشكلة ان كراسينا كلها بدون عجل..متأكدة ان عبيد هيفهم قصدي..ربنا يعزك ويكرمك"
