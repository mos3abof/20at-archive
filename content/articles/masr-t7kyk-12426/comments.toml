author = "الدنيا حر موت"
posted = "2009-06-21"
text = "مناعة اية يا ناس يا طيبين<br />الدنيا حر موت<br />والفيروس مدروخ من الحر<br />وبعدين احنا شعب لا ياكل الخنزير اصلا ولا عمرنا شفناة فى المحافظات عندنا ابدا<br />الخنازير فى القاهرة بس"
