text = "اللي يقرا المقال يفتكر ان مفيش ولا مصري أصيب بالمرض<br />وده كلام غلط طبعا<br />لأن الصحافة أعلنت عن تأكيد إصابة أكتر 30 حالة اليومين اللي فاتوا<br />مصريين مقيمين"
