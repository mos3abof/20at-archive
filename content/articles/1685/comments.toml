author = "إسراء صالح بهلول"
posted = "2006-06-12"
text = "والله يااطفال انا من فلسطين ودايما بحب للأطفال كل خير وما بحب لواحد منهم انو ينصاب بشر لذلك انا بانصح الأطفال بعروسة فلة منذ الصغر لانها تربي الأطفال على الدين وتجعلهم ملتزمين به منذ الصغر وانا في رأيي انني أفضل عروسة فلة لانها محجبة ومؤدبة واجمل من باربي فانا انصحكم بان لا تشترو الشقراء باربي وفلة اجمل منها بكثير وانا افضلها فارجو ان يكون الكثير مثلي وانا اكثر حاجاتي واغراضي لفلة وعندي وفلة وصديقاتها ندى وياسمين فارجو ان تؤيدوني وتكونو مثل رأيي وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151737/http://www.20at.com/article2.php?sid=675"

