[[comments]]
order = 2
subject = "مافيش فرق"
author = "شرين"
posted = "2006-04-09"
text = "بصراحة مافيش فرق، بالعكس رغم انى باكره نموذج باربي، الا انى باحس انها افضل من فلة اللى جت مجرد تقليد مالوش لزمة، بس حطينا الحجاب و العباية ودي كمان مش عارفة ايه لزمته، ده دليل على سوء فهم لعقلية الأطفال و لعقلية التسويق الاقتصادي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151737/http://www.20at.com/article2.php?sid=675"

[[comments]]
order = 3
subject = "ياسر"
author = "ياسر"
posted = "2006-04-09"
text = "لا الموضوع لية لزمة<br />باربى تكسب طبعا<br />لان مفيش وجة مقارنة اصلا<br />احنا عاوزين نلاعب الاطفال مش نخوفهم<br />ههههههههههههه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151737/http://www.20at.com/article2.php?sid=675"

[[comments]]
order = 4
subject = "آه يا زمن"
author = "عبدالله مفتاح"
posted = "2006-04-09"
text = "لا فلة احسن ولما البنت الصغيرة تلعب بعروسه محجبه يمكن تحب الحجاب من العروسه<br />ويمكن لو لعبت بباربي تحب ان شعرها يبقى نازل زي باربي<br />المشكله ان في بعض الكتاب الجهلة لما الاخوان خدوا 88 مقعد قالوا عروسة باربي هتلغى من الاسواق شفتوا جهل اكتر من كده ؟<br />ناس دخلوا مجلس الشعب عشان يمنعوا باربي؟<br />الكتاب دول بالاضافه لانهم جهلة بيتجاهلوا كمان.<br />باختصار فلة احسن من باربي<br />وان كان تقليد يبقى تقليد كويس عدلناه خليناه يناسبنا<br />واللي مش عايز يشتري فلة يشتري باربي ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151737/http://www.20at.com/article2.php?sid=675"

[[comments]]
order = 5
subject = "مبيشربش من القله .."
author = "هبابه او هوبه او هبهوب"
posted = "2006-04-09"
text = "ايه مالها فله بنت عسوله ولديده ,وشيك ولديده ايه فيها ايه اللي عايز يشتري فله يشتري واللي عايز يشتري باربي يشتري شوفت الديمقراطيه واللي عايز يعمل زي ويعمل من المصليه عروسه يعمل عادي يعني<br />اخيرا بت يا نوفا الف لا باس عليكي يا ختي بطلي لعب كتير كدا تكسري ايدك<br />ما قلنا العبي بفله ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151737/http://www.20at.com/article2.php?sid=675"

[[comments]]
order = 6
subject = "مفيش مانع"
author = "دودو"
posted = "2006-04-10"
text = "الموضوع حلو جدا واكتر حاجة عجبتني فيه رأي الاطفال وانا شايفة انه مفيش مانع ان تكون في عروسة محجبة بالعكس دي هتبقي مختلفة عن اللي الموجود منذ زمن وبالفعل في اطفال دلوقتي في مصر محجبين والاكيد انهما هبملوا للعروسة المحجبة حتي ولو مش علي نفس مستوي باربي."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151737/http://www.20at.com/article2.php?sid=675"

[[comments]]
order = 7
subject = "والله كويس"
author = "عثمان"
posted = "2006-04-10"
text = "على فكرة كويس جداً انكم بتتطرقوا لمواضيع ذي دي وعلى فكرة انا لسه لم أقرأ الموضوع باكمله ولكن يا ريت تكون فيه احصائيات عن تلك الأشياء ونعرف نطور نفسنا بقى ويكون كل شيء من بلادنا ومن فكرنا وحسب تقاليدنا وعادتنا والله الموفق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151737/http://www.20at.com/article2.php?sid=675"

[[comments]]
order = 8
subject = "اللي فهمته"
author = "مشاكس"
posted = "2006-04-10"
text = "موضوع رائع والاسلوب اكثر من رائع<br />بس للاسف كان في تصوري ان البنات ح يحبو العروسة المحجبة لكن واضح ان فيه حاجة غلط .<br />معظم البنات عاوزين عروسة بشعر طويل وميني جيب ومش عارف ده لية<br />تقريباً لان البنت الحلوة في نظرهم هي اللي بتلبس كدة اما البنت المحجبة فهي وحشة خالص ومش شيك<br />وطبعاالبنات مش فاهمين والامهات مش فاضينن والاب مش هنا والاعلام بايظ ورجال الدين في واد والناس في واد .<br />واذا كان ده رايهم وهما صغيرين ح يعملوا اية لما يكبروا طبعا كل واحدة عايزة تبقي حلوة وذي القمر زي عروستها بتاعة الطفولة<br />اظن بقة مافيش داعي ان الشباب يسالوا هما البنات بيلبسوا ضيق ومفتوح وقصير لية .<br />وربنا يحفظنا<br />\"سامحني\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151737/http://www.20at.com/article2.php?sid=675"

[[comments]]
order = 9
subject = "المسألة خطيرة"
author = "ميرو"
posted = "2006-04-10"
text = "الفكرة جميلة وجديدة جداً، ولا بد ألا نستهين بلعب وأفلام الأطفال، لأنها أول من يزرع القيم في نفوسهم، في عصر كثر فيه ما يوجه سلوك وشخصية الإنسان العربي الصغير، وأرى أن الطفل العربي نفسه لا زال حائراً بين نسق القيم الغربي الذي يملأ حياته، والنسق الشرقي الذي يعيشه بتأثير أقل بالطبع، والقضية بالفعل مهمة وتحتاج لكلام أكثر من هذا التحقيق، ورغم الاستهتار بأهمية العروسة فهي واحدة من بين الأشياء التي تتخذها الطفلة قدوة لها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151737/http://www.20at.com/article2.php?sid=675"

