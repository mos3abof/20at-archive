[[comments]]
order = 80
subject = "المعارضة"
author = "كاتي الامورة"
posted = "2006-06-17"
text = "هاي انا كاتي وانا بعارض بشدة للي قالو معضم البنيت وانا ما بوافق عليه واناشايفه انواكتر البنيت بيحبو باربي<br />ليش ؟؟؟؟<br />(1) عشان باربي احلى من فلة<br />(2) لبس باربي انا شايفيتو كتير عادي<br />(3) انا بعجبني لبسها كتير ومش انا بس في كتير بنيت بحبو لبس باربي<br />(4) باربي كتير مشهورة وما بضن انو لعبة مثل فلة ممكن تهز عرش باربي<br />وانا بتمنى انو باربي تبقه ملكت عرش العاب العالم وانا متاكده انو باربي رح تضله الملكه وفي النهاي انا بقول ورح اضل اقول باربي الحسن الاجمل الاكتر شعبية وبحبوها الناس وانا برجو انو شركة يلي انتجت باربي تكون قرئت موضوعي ومعارضتي على فلة ومع زجيل الشكر لباربي ويلي صنعوا باربي وبلاخص المصمم يلي عمل باربي<br />وانا واثقة كل يلي بحبو فلة كانو اقبل بحبو باربي مع تحياتي ( كاتي الامورة)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151737/http://www.20at.com/article2.php?sid=675"

