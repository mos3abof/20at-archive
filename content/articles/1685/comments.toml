author = "حبيبة فلة"
posted = "2006-04-30"
text = "اناماعنديش فلة عندي اكثر من واحدة باربي من زمان و نفسي اجيب فلة وخليت كل الباربي اللي عندي عبابات و نقاب و انا فصلتهم و ماما فرحت قوي بالنقاب و عبايات الراس بتوعهم لاني لما اخرج بعروستي احبها تكون محجبة و لما تكون مع عرايس بنات زيها تخلع الحجاب يعني احبها تبقي عروسة مسلمة بتسمع كلام ربنا وفي نفس الوقت شيك و جميلة يعني انا حجبت باربي و خليتها تسلم و عندي صور لباربي و هي بالنقاب و انا نفسي فلة تنزلها الشركة بالنقاب و العباية و من تحت العباية الهدوم الحلوة جيبة قصيرة و بلوزة كت"
