posted = "2006-03-23"
text = "الحقيقة الفكرة دي رائعة وجديدة - تخلو الناس هى اللى تتكلم عن ماساتها و نشاركهم الامهم و نخفف عنهم<br />الجزيرة نقلت كلمات الامهات و الورود و الهدايا الى خدوها<br />كانت مؤثرة جدا<br />حتى دريم ذاعتها كدا مرة<br />كل سنه و كل ام شهيد طيبه"
