subject = "هو أمام فعلا"
author = "خالد"
posted = "2006-10-16"
text = "كان الأستاذ حسن البنا -رحمه الله- أحد اهم علماء الأسلام في عصره قد شهد له بذلك علماء كالأمام رشيد رضا والعلامه طنطاوي جوهري وغيرهم لذا فهو يستحق وبجدارة لقب أمام اما الحقيقة فهى أن ألاخوان فى عصره كانوا يطلقون عليه الأستاذ ولم يصفه أحدهم بالأمامة حديثا وليس هذا من دواعى الأختلاف وكل عام و أنتم بخير"
archived = "2006-11-02"
