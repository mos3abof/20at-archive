[[comments]]
order = 4
subject = "واحد من المستغلين"
author = "انسان"
posted = "2006-10-18"
text = "حسن البناالذي تسمونة الامام هو الذي بايع الملك فاروق الفاسد أميرا للمؤمنين<br />حسن البناالذي تسمونة الامامأأمر اتباعه بالهتاف \"الله مع الملك\" في مقابلة مظاهرات الحركة الوطنية التي كانت تهتف \"الشعب مع النحاس\" ضد الملك<br />حسن البناالذي تسمونة الامام هو الذي رفض مشاركة الاخوان في يوم الجلاء في فبراير 1946 و هو اليوم الذي حدثت فيه مذبحة كوبري عباس بحجة ان \"الاخوان غير جاهزين\"<br />حسن البناالذي تسمونة الامام هو الذي أمر اتباعه بالخروج بعد حادثة كوبري عباس للاحتفال بعيد ميلاد الملك الذي امر بعمل تلك المجزرة<br />حسن البناالذي تسمونة الامام هو الذي أخذ من شركة قناة السويس الاستعمارية انذاك تمويلا قدره 500 جنيه و لم يكن هذا المبلغ هينا انذاك<br />حسن البناالذي تسمونة الامام هو الذي قال لاتباعه حين اعترض البعض على التمويل \"من خرج عن حد الجماعة فاضربوه بحد السيف\"<br />حسن البناالذي تسمونة الامام هو الذي نزل مع الطاغية اسماعيل صدقي عدو الشعب في سيارته المكشوفة ليلف بها في شوارع القاهرة لتهدئة الجماهير بعد ثورتهم على اتفاقية صدقي-بيفن أسوأ الاتفاقيات في تاريخ مصر التي شبهها البنا ب \"صلح الحديبية\"<br />حسن البناالذي تسمونة الامام هو الذي امر مصطفى مؤمن مسئول طلاب الاخوان في الاربعينات بالنزول مع سليم زكي في سيارته لتهدئة الطلاب الثائرين على اتفاقية صدقي بيفن، و سليم زكي لمن لا يعرفه هو الذي اصدر الاوامر بفتح كوبري عباس على الطلبة و للعلم فان طلبة الاخوان هم الذين قتلوه بالرصاص سنة 1949 عندما بدأ في مهاجمة الاخوان<br />اسماعيل صدقي الطاغية عدو الشعب الذي وصفه مؤمن قائلا الاية القرانية \"واذكر في الكتاب اسماعيلا انه كان صادق الوعد و كان صديقا نبيا\"<br />الحقائق التي تكشف هؤلاء كثيرة و لكن لا مجال لسردها هنا<br />طلبي الوحيد ان يظل موضوع البنا في القسم السياسي لانه لم يكن رجل دين و انما رجل سياسة<br />اما لقب الامام فلا يطلق على سياسي و لذلك فالبنا لا يستحقه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125153/http://www.20at.com/article2.php?sid=1352"

[[comments]]
order = 5
subject = "شهيد ماذا ؟"
author = "الكل يعلم ان البنا قتل في خلاف سياسي"
posted = "2006-10-18"
text = "البنا الذي تحالف مع النقراشي ثم قتله<br />و بعد قتل النقراشي قرر ابراهيم عبد الهادي رئيس وزراء مصر تصفية الحسابات مع البنا و قتله<br />يعني لما اتنين بلطجية يتخانقوا و واحد يموت يبقى شهيد ؟<br />البنا هو الذي بدا التصفية الجسدية و بعدين كان فيه قصاص يعني قتل البنا كان رد فعل و من قتل يقتل و البادي اظلما"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125153/http://www.20at.com/article2.php?sid=1352"

[[comments]]
order = 6
subject = "حسن البنا الذى اعرفه"
author = "مواطن"
posted = "2006-10-19"
text = "حسن البنا الذى اعرفه هو الذى اجاب اجابة بسيطة توضح توجهه العام حين سأله احد \"الاخوة\" بعد صلاة عيد الاضحى حول ذبيحة المسلمين من خارج جماعة الاخوان المتأسلمين فأجاب \"الشيخ الشهيد\" فلتعتبروها ذبيحة اهل كتاب !!! فالمسلم خارج جماعة الاخوان المسلمين فى احسن احواله هو من اهل الكتاب ولا تعليق على الواقعة و اتركها للقارىء صاحب العقل و التدبر<br />من المعروف تاريخيا ان اللجوء الى تسيس الدين او تديين السياسة تلجأ لها الدول و الجماعات فى لحظات الانهيار الحادة و التراجع الثقافى و الاقتصادى اما تعزيزا لسلطة قائمة و تبرير تخلف او يلجأ اليها ضعاف العقول من العامة لعدم استطاعتهم مواكبة التغيرات السياسية و متطلبات اجتماعية و عدم المامهم بأسس الوصول الى متطلباتهم و ذلك بمحاولة استحضار نموذج سطحى عن السلف و تاريخه - ولا يقتصر ذلك على المسلمين بأى حال - دون النظر بتمعن الى الحقائق التاريخية و الموضوعية للحقب التاريخية السابقة التى يتشبث بها هؤلاء الحالمون من ضعاف البصر<br />و نأتى الى حسن البنا الذى لا نعلم تحديدا من دوره كقيادة لتنظيم بهذا الحجم الا ما ذكره المعلقان السابقان على تعليقى و يصبح من بعدها - بقدرة قادر - شيخا شهيدا لا يأتيه الباطل من يديه ولا من خلفه و يصبح من التابوهات التى لا يستطيع اى ناقد محايد المساس بها على الرغم من اخطائه التاريخية الفادحة المذكورة اعلاه<br />و يأتى قائل ليقول بدور الجماعة السياسى قبل الثورة و بعدها و الذى لا نرى فيه سوى الدسائس و الاغتيالات و المؤامرات القذرة التى انتهجتها الجماعة على مر عهودها و لا يخفى على احد اخر هذه المؤامرات التى تآمر فيها قيادات الاخوان المسلمين مع - الاب الروحى لشباب الاخوان المسلمين بحسب نص مهدى عاكف خليفة حسن البنا فى جريدة المصرى اليوم فى ابريل عام 2005 -<br />هذا الخط من التلاعب السياسى بمصائر الملايين من ابناء شعبنا و التلاعب الفكرى بالمنظومات الفكرية الاجتماعية يجب ان يقف عن حده<br />انا لا اقلل من وطنية اى عضو قاعدى فى جماعة الاخوان المسلمين و لكننى ارجو منه التبصر و التساؤل و التفكير العلمى خاصة اننى ارى الكثير من طلاب الكليات العلمية و قد انضووا تحت لوائهم<br />حقك كصاحب عقلية علمية ان تسأل الاسئلة العلمية الاساسية : كيف و متى و اين و لماذا و من<br />و انا واثق تماما من انك لن تخرج من هذا التساؤل البسيط الا مواطنا مصريا - خارجا عن حد الجماعة -<br />و لن اخوض فى تفاصيل الخلافات الداخلية و التنظيمية داخل الجماعة لعلمى بأن الشباب المتحمس المغيب لن تصل اليه اخبار هذه القاذورات<br />و لكن يكفينى ان اخبركم بأن من يملك مفاتيح الجنة يملك خزائن الارض<br />فرجل السياسة حين يتحدث فى الدين فهو باحث عن شرعية استبداد سياسى و رجل الدين حينما يتحدث فى السياسة فهو باحث عن سلطة استبداد سياسى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125153/http://www.20at.com/article2.php?sid=1352"

