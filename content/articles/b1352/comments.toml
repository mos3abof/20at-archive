order = 0
subject = "مجرد ملاحظة"
author = "معاذ"
posted = "2006-10-16"
text = "مع احترامي الكامل لحسن البنا كرجل من أهم الشخصيات في تاريخنا الحديث وكرجل سياسي كبير<br />الا أنني يحق لي أن أسال لماذا يقول الموضوع عنه \"الامام حسن البنا\" وعلى اي أساس هو امام<br />قد يسميه الاخوان اماما _ومن حقهم_ لأنه امامهم هم ومربيهم وأستاذهم,<br />ولكنه ليس لقبا له فهو لم ولن يكون اماما<br />وانما قد تعتبره سياسيا كبيرا ومفكرا ولكن كلمة امام هذه كلمة عظيمة تدل على شخص متفق عليه من جميع أبناء الأمة _والبنا كما يعرف الكل لم يكن متفقا عليه قط_ وتدل أيضا على عالم دين كبير ومجدد<br />أنا عارف انها ملاحظة دمها تقيل وتبان انها هايفة بس هي مهمة في الواقع لأن كلمة امام ليست مستباحة هكذا لأي شخص"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125153/http://www.20at.com/article2.php?sid=1352"

