[[comments]]
order = 12
subject = "فين الردود ؟"
author = "اميرة حسن"
posted = "2006-11-01"
text = "انا مستغربة جدا<br />الاساتذة مواطن و مسلم قالوا كلام و حقايق تاريخية و الشباب بتوع الاخوان بيخشوا و يقولوا هوا الامام و هوا المجدد و يقعدوا يدعوا على الناس اللى بتعترض و يقولوا عليهم كلام وحش ؟؟<br />طب فين ردودهم ولا هما اتعودوا على انهم يقولوا حصة المحفوظات كل يوم الصبح بدرى كده ؟؟<br />مش يردوا بشكل مقنع ؟ لأ هما بس عمالين يقولوا هوا مش عارفه ايه شهيد و امام و هوا المجدد و اللى عمل و اللى سوا<br />طيب ما يقولوا ردودهم بدل الكلام اللى ولا يودى ولا يجيب<br />انا نفسى الاقى حد منهم كان يرد رد واحد مقنع بدل ما يقولوا شوية الشعارات و المحفوظات .. ارحمونا بقى .. عايزين ناس تفكر شوية بدل ما بقينا راجعين لورا اكتر من عشر تلاف سنة كده - اميرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125153/http://www.20at.com/article2.php?sid=1352"

[[comments]]
order = 13
subject = "رد من مواطن"
author = "مواطن"
posted = "2006-11-01"
text = "الاستاذ اللى عايزنا نتقى الله ... و هل حين يتبع المؤمن الحق و يتحرى الحقيقة يكون غير متق لله و متبع لسنة رسوله ؟<br />ام ان من لا يهلل و يكبر للاخوان المتأسلمين يصبح فى وجهة نظرك غير متقى لله ؟<br />يا اخى ارجوك ان تراجع نفسك فى عقلك و ايمانك ولا تتهمنا اتهامات لا تراها الا فى مخيلتك .<br />الاستاذة اميرة يمكن كانت عصبية شوية فى ردها لكن فعلا انا عايزك تقللى انا لم اتق الله فى ايه بالظبط و ليه و ايه دليلك على كذب ما اقول ؟ يا اخى لقد هلك من قبلنا لأنهم انصاعوا و اتبعوا ما الفوا عليه ابائهم و اجدادهم بلا تمحيص ولا فحص .. و اذكرك بأن الحكمة ضالة المؤمن اينما وجدها فهو احق بها .. فبدلا من ان تتهم و تهرب بلا نقاش حقيقى يمكنك ان تفند ادعاءاتنا ان استطعت .. و حسن البنا هو رجل و نحن رجال و ليس بنبى ولا بمعصوم ولا يأتيه الوحى على حسب ما اعتقد .. فان كنا قد افترينا عليه فلتوضح لنا بالادلة ما وجه الفرية فى هذا و الا تسلم بصدقنا و صدق رواياتنا الموثقة فى التاريخ الخاص بالجماعة و من اوراقها<br />اخى .. ارجوك انت ان تتقى الله فى عقلك و دينك و وطنك ولا تخلط الاوراق حتى لا يختلط عليك الحق بالباطل<br />مع خالص محبتى الانسانية<br />مواطن<br />www.kotob.co.nr"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125153/http://www.20at.com/article2.php?sid=1352"
