text = "وبكس امك يازخارى المسلمين فتحوا مصر وحرروكم من الرومان والبيزنطيين ورجعوا اراضيهم من ايد الصليبين والرومان وخلوكم زى البهايم بتدفعوا الجزية مقابل حمايتكم وحرية معتقدكم ولما دخل عمروبن العاص مصر كان الانبا بنيامين مستخبى بقالو عشر سنين خايف من بطش وتنكيل دقلد يانوس ولما مات دقلديانوس وجة الفتح الاسلامى لمصر امن عمرو بن العاص الانبا بنيامين على مالة وحياتة وبكدة يازخارى ياكلب ياابن الكلب اعرف حجمك وقيمتك ياسافل"
