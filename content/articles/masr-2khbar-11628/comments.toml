text = "مش هو دة شعار الدول المسماة من امريكا دول الاعتدال وشعبيا اسمها دول الاعتلال العربى<br />اسرائيل بتعادى ايران - يبقى العرب المعتلين يعادوا ايران - لية ما تعرفش<br />اسرائيل بتحارب حماس وحزب اللة يبقى المعتلين يحاربوا حزب اللة وحماس والسبب جاهز لان حزب اللة شيعى وحماس اخوان وهم لا يعرفون الفرق بين السنة والشيعة<br />المرشد لا يقول شيئا جديدا فكل الناس عارفة<br />ومن الافضل للمرشد ان يسكت ولا يتكلم فى السياسة"
