text = "ابو جدو (مهدى عاكف)<br />حقثا انت فعلا محتاج ارشاد؟<br />أرشاد عقلى<br />و أرشاد لكبار السن الخرف<br />و الاهم أرشاد على (القفا) بواسطة وزارة الداخلية؟<br />انت فاهم لية انت محتاج أرشاد أيها الشيخ الصفيق معتل الآخر و العقل<br />ما تروح فى ستين خرارة و بلاعة صرف صحى"
