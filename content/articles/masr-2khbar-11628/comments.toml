text = "اذا كانت(مهدية عكوفة )من الرموز الاسلامية؟<br />تقدر تقول لى يبقى الصحابة اتباع الرسول مثل ابى بكر الصديق و عمر ابن الخطاب و خالد ابن الوليد و عثمان ابن عفان من اى رموز ؟تكون؟؟؟!!!!!<br />حرام عليك يا حيوان ان تساوى بين مهدى عاكف و ابى بكر الصدبق رحمة اللة؟او عمر بن الخطاب او عثمان ابن عفان او خالد ابن الوليد او السيدة خديجة او السيدة زينب؟<br />هاك فرق بين الرموز الاسلامية السامية و المدعين المتاسلمين امثال مهدية عكوفة؟"
