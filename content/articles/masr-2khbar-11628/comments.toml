text = "موش دة الارهابى (مهدى عاكف) اللى كان محكوم علية بلاعدامو ؟!!!<br />و بعدين الست المامى بتاعتة راحت تبوس ايد و رجلين و… السيد (خالد محى الدين)عضو مجلس الثورة اللى تكرم و اعفاة من الاعدام قبل د[ *** ]ة غرفة الاعدام بلحظات؟<br />تفتكرووووا كان الثمن ايهة!!!<br />(ربنا أمر بالستر)يا جماعة<br />هههها هههها هااا هااا"
