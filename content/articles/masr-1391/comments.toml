[[comments]]
order = 0
subject = "من يدير النايل سات"
author = "من يدير النايل سات بعد هذا الكم الهائل من قنوات الشيعة علية؟"
posted = "2007-01-02"
text = "هل هو ابن بنت النبى المرضى عنة الاستاذ عبدالعزيز الحكيم<br />ام ابن الحسين الاستاذ مقتضى الصدر<br />والا يمكن الخمينى<br />والا يمكن السيستانى والبستانى وابو رجل مسلوخة<br />اية القرف اللى على النايل سات<br />اية قنوات الهباب دى<br />ارحمونا مرارتنا انفجرت"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115548/http://masr.20at.com:80/article.php?sid=1391"

[[comments]]
order = 1
subject = "الدش"
author = "الطفشان"
posted = "2007-01-03"
text = "يامسلمين العالم اصحو الاسلام فى خطر الدش والقائمين عليه يريدون تحويل المسلمين الى شيعة بقى دا كلام برده"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115548/http://masr.20at.com:80/article.php?sid=1391"

[[comments]]
order = 2
subject = "الحياة المعكوسة"
author = "لما مبارك الحقير يعتقل خيار القوم من الأخوان المسلمين مثل الشاطر والعريان ويستنى هو وعيلته وحثالته فى الحكم."
posted = "2007-01-04"
text = "ولما تبقى قضية واحدة ويتحكم فيها مائة حكم زى مثلا السيد طلعت السادات لما قال إن الجيش لم يقم بواجبة فى حماية السادات عند قتله ويعتبروا ده سب للجيش إللى مبارك سبة يوم لما أتقتل العسكريين المصريين على الحدود وتانى يوم أستقبل رئيس وزرائهم بالحضن وأكنه بيهنيةعلى كده ولما ييجى المخنس يسب الحجاب ويتقال دى حرية رأى طيب مالثانية حرية رأى لواحد مجروح لإغتيال عمه والشعب كله عارف مين القاتل يبقى أحنا ماشيين صح ولا معكوس<br />إن الله لا يغير ما بقوم حتى يغيروا ما بأنفسهم"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115548/http://masr.20at.com:80/article.php?sid=1391"
