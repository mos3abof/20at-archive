author = "اكتب اسمك هنا"
posted = "2007-09-28"
text = "القصه شبيهه بفيلم لريتشارد غير .. عن شاب موسيقي اصيب بعقده بعد تخلي حبيبته عنه<br />لينقلونه بعد محاولته الانتحار لمستشفى نفسي ..فيقع في غرام طبيبته التي تحاول مقاومة اعجابها برجولته وانسانيته<br />وجنونه …لكنها في النهايه تستلم له ..وعندما تخبر زميلها بخطأها الفادح لانها خرقت القوانين بعشقها لمريضها ..<br />ينصحها زميلها بتركه ..ليزداد المجنون جنونا وتتفاقهم عقدته ليعيد محاولة الانتحار ..وفي النهايه تقدم الطبيبه استقالتها<br />لتعود لاحضان مجنونها فيعود له عقله الضائع .. فيلم رومانسي جميل ..كثيرااا ما اعادت ام بي سي تو عرضه واحب بدايته كثيرا ..شكرا لكم"
archived = "2010-02-14"
capture_url = "https://web.archive.org/web/20100214022815/http://www.20at.com:80/20at/arts/3401.html"
