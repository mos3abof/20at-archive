posted = "2007-03-12"
text = "العرض رائع ويبدو ان الروايه ذات مغزى انساني<br />كثيرا ما نهمل هذه النواحي من مفهوم الحب ونعلقه على انه فقط احساس في القلب ورغبه قاتله في الاحتفاظ بالاخر بعيدا عن كل نوايا الفراق او الخيانه<br />للحب معاني انسانيه اخرى اكبر واعمق بتنا نجهلها ونتناسها امام مادية حياتنا وسرعتها وتهافتنا على الوصول والتميز والتنافس بل حتى في صراعنا مع الوقت للانجاز والتكديس وتأمين العيش الرغيد<br />فأصبح الحب خيالا نتحسر عليه ..<br />تحياتي لك يامحمد .. فالعرض مشوق ويشد القارئ<br />لينا"
archived = "2010-02-14"
capture_url = "https://web.archive.org/web/20100214022815/http://www.20at.com:80/20at/arts/3401.html"

