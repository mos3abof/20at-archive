author = "اكتب اسمك هنا"
posted = "1999-11-30"
text = "خروف امن الدوله<br />ليه الخروف سيذبح فى العيد وكل عام والكل بخير وبيباى زوار الفجر بعد العيد<br />بس فيه زريبه مليانه من النصف ده يبقى مفيش غير اننا نستحمل نطح الخروف طوال العام<br />وندبحه يوم العيد ————- بكرهك ولاأقدر على بعدك ياسى خروف امن الدوله<br />هههههههههههههه وكل عام والكل بخير —- ويجعل كلامنا خفيف عليهم"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110082334/http://www.20at.com:80/20at/lifestyle/2986.html"

