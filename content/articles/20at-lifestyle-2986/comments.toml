posted = "1999-11-30"
text = "و الله ضحكتوني… من يومين احلى رايس هلا احلى خروف؟<br />بس الصور كتييييييير حلوة وعنجد بضحك<br />انا اكتر واحد عجبني الخروف فاشل رجيم… شكله تحشيش(و الي ما بعرف شو يعني تحشيش هي بالهجة الاردنية بضحك كتير)… كلبوظ و شكلو اهبل اشوي..واجاني شعور اني نفسي اقرصلو خدودو… عنجد لهلا عم بضحك<br />يسلمو عالموضوع"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110082334/http://www.20at.com:80/20at/lifestyle/2986.html"

