subject = "سلامي للجزائر الحبيبة"
author = "ناصر"
posted = "2006-06-27"
text = "و الله بعدما إجتازت الجزائر محنة أخذت معها الأخضر و اليابس و يا لهول الفاتورة التي دفعتها للخروج من هذه الأزمة مئة ألف من الضحايا أو يزيدون و المليارات من الدولارات ضاعت. لا عجب أن نجد بعض هذه المفارقات و التي أرجو أن لا تؤثر في مستقبل بلادي الغالية."
archived = "2006-11-02"
