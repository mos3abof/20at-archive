[[comments]]
order = 12
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-10-14"
text = "الصوفيه كلها بدع وخرافات وتوسل واللجوء الى الخلق في التوسل وترك الخالق<br />فيها عبادة القبور<br />يعتقد أبناء هذه الطائفة بأن الرسول (*) صلى الله عليه وسلم لديه قدرة يتحكم بها في الكون، يقول أمجد علي: \\\" إن النبي صلى الله عليه وسلم نائب مطلق لله سبحانه وتعالى، وإن العالم كله تحت تصرفاته، فيفعل ما يشاء، يعطي ما يشاء لمن يشاء، ويأخذ ما يشاء، وليس هناك أحد مصرّف لحكمه في العالمين، سيد الآدميين، ومن لم يجعله مالكاً له حرم من حلاوة السنة\\\".<br />لقد غالوا في نظرتهم إلى النبي صلى الله عليه وسلم حتى أوصلوه إلى قريب من مرتبة الألوهية - والعياذ بالله - يقول أحمد رضا خان في حدائق بخشش 2/104: \\\"أي يا محمد صلى الله عليه وسلم لا أستطيع أن أقول لك الله، ولا أستطيع أن أفرق بينكما، فأمرك إلى الله هو أعلم بحقيقتك\\\".<br />كما بالغوا في إضفاء الصفات التي تخالف الحقيقة على النبي صلى الله عليه وسلم حتى جعلوه عالماً للغيب، يقول أحمد رضا خان في كتابه خالص الاعتقاد ص 33: \\\" إن الله تبارك وتعالى أعطى صاحب القرآن سيدنا ومولانا محمد صلى الله عليه وسلم جميع ما في اللوح المحفوظ \\\".<br />لديهم عقيدة اسمها (عقيدة الشهود) حيث إن النبي صلى الله عليه وسلم في نظرهم حاضر وناظر لأفعال الخلق الآن في كل زمان ومكان، يقول أحمد يارخان في كتابه جاء الحق 1/160: \\\"المعنى الشرعي للحاضر والناظر هو أن صاحب القوة القدسية يستطيع أن يرى العالم مثل كفه من مكان وجوده، ويسمع الأصوات من قريب ومن بعيد، ويطوف حول العالم في لمحة واحدة ويعين المضطرين، ويجيب الداعين\\\".<br />• ينكرون بشرية النبي صلى الله عليه وسلم ويجعلونه نوراً من نور الله. يقول أحمد يارخان في كتابه مواعظ نعيمية ص 14: \\\"إن الرسول صلى الله عليه وسلم نور من نور الله، وكل الخلائق من نوره \\\"ويقول أحمد رضا خان في أشعاره \\\" ما قيمة هذا الطين والماء إذا لم يكن النور الإلهي حل في صورة البشر\\\".<br />****وماهو اللا عبد الله ورسوله (( وما محمد إلا رسول قد خلت من قبله الرسل ))<br />• يحثون أتباعهم على الاستغاثة بالأنبياء (*) والأولياء (*)، ومن يستنكر عليهم ذلك يرمونه بالإلحاد (*)، يقول أمجد علي في كتابه بهار شريعت 1/122: \\\" إن المنكرين للاستمداد بالأنبياء والأولياء وبقبورهم، ملحدون\\\".<br />• يشيدون القبور ويعمرونها ويجصصونها وينيرون فيها الشموع والقناديل وينذرون لها النذور، ويتبركون بها ويقيمون الاحتفالات لأجلها، ويضعون عليها الزهور والورود والأردية والستائر، ويدعون أتباعهم للطواف حول الضريح تبركاً به.<br />**كيف تعتبرون ذلك تصرف اسلامي ؟؟؟؟؟<br />• لديهم غلو (*) شديد في تقديس شخصية عبد القادر الجيلاني، ويعظمون باقي الأولياء من أئمة المتصوفة وينسبون إليهم أفعالاً خيالية خارقة للعادات متسمة بالنسيج الخرافي الأسطوري.<br />• أعظم أعيادهم هو ذكرى المولد النبوي الشريف إذ ينفقون فيه الأموال الطائلة، وهو يوم مقدس مشهور لديهم، ينشدون فيه الأناشيد التي تمجد الرسول صلى الله عليه وسلم من خلال القصص الخرافية ويقرءون فيه كتاب سرور القلوب في ذكر المولد المحبوب الذي ألفه أحمد رضا خان ملأه بالأساطير والخيالات.<br />• الأعراس: وهي تعني زيارة القبور والاجتماع عليها من مثل [ *** ] الشيخ الشاه وارث في بلدة ديوه و[ *** ] الخواجة معين الدين جشتي، حيث يجتمع له الملايين ويختلط فيه الرجال بالنساء وتحصل فيه بعض المفاسد المحرّمة شرعاً.<br />ـ إن من يترك الصوم والصلاة يجد له خلاصاً، أما الطامة الكبرى والمصيبة العظمى في نظرهم فإنما تقع على من يتخلف عن الاحتفال بالمولد أو الفاتحة أو ال[ *** ]. وهم يكفّرون المسلمين من غير البريلويين لأدنى سبب ولم يتركوا تجمعاً إسلاميًّا ولا شخصية إسلامية من وصف الكفر، وكثيراً ما يرد في كتبهم بعد تكفير (*) أي شخص عبارة \\\"ومن لم يكفره فهو كافر\\\"، وقد شمل تكفيرهم الديوبنديين وزعماء التعليم والإصلاح ومحرري الهند من الاستعمار (*). كما شمل الشيخ إسماعيل الدهلوي وهو من علماء الهند ممن حاربوا البدع والخرافات، ومحمد إقبال والرئيس الباكستاني الراحل ضياء الحق وعدداً من وزرائه.<br />ـ وهم يكفرون شيخ الإسلام ابن تيمية وينعتونه بأنه مختل وفاسد العقل (*) ويدرجون معه تلميذه ابن القيم.<br />ـ يكرهون الإمام محمد بن عبد الوهاب ويرمونه بأشنع التهم وأسوأ الألفاظ وما ذلك إلا لأنه وقف أمام الخرافات موقفاً حازماً داعياً إلى التوحيد الخالص.<br />يكفرون كل من لايتفق معهم ولا مع معتقداتهم الباطله<br />أخرجه البخاري ومسلم عن ابن عمر بلفظ: أيما رجل قال لأخيه: يا كافر، فقد باء بها أحدهما. وزاد مسلم في رواية: إن كان كما قال؛ وإلا رجعت عليه. وفي لفظ آخر عند مسلم: إذا كفر الرجل أخاه فقد باء بها أحدهما<br />نصيحتي لكم ببالتوبة النصوح والحذر من مكر الله تعالى، قال الله تعالى: يَا أَيُّهَا الَّذِينَ آمَنُواْ اسْتَجِيبُواْ لِلّهِ وَلِلرَّسُولِ إِذَا دَعَاكُم لِمَا يُحْيِيكُمْ وَاعْلَمُواْ أَنَّ اللّهَ يَحُولُ بَيْنَ الْمَرْءِ وَقَلْبِهِ وَأَنَّهُ إِلَيْهِ تُحْشَرُونَ {الأنفال:24}."
archived = "2009-09-12"
