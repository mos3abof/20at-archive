subject = ""
author = "حسين بن زين الموسوي - من نـــج"
posted = "2009-03-21"
text = "مما لا شك فيه أن الإمام المجدد ابن عبدالوهاب ينال ما يناله من أهل البدع والخرافات لا لشيء وانما لأنه نسف عقيدة الشرك والتوسل بالأضرحة وطالب بالعودة لمنهج الأئمة مالك والشافعي وأبي حنيفة وابن حنبل وآل البيت أجدادي رضي الله عنهم ورحمهم رحمة واسعة ، أما بخصوص التجسيم فالمتصوفة لديهم من الإعتقادات ما يوازي التجسيم قبحاً وكفراً بالله<br />وهناك فرق بين اثبات صفات الله ( بما ) يليق به سبحانه وتعالى وهو القائل ( ليس كمثلة شيء ) وبين التجسيم الذي ينقله الزنادقة والجهلة<br />رحم الله الشيخ رحمة واسعة وأثابه خيراً وحشرنا واياه مع الشهداء والصديقين وأنار الله قلوبنا بالإيمان<br />والسلام على من اتبع الهدى - الموسوي الكاظمي من الرياض"
archived = "2009-09-12"
capture_url = "https://web.archive.org/web/20090912050741/http://www.20at.com:80/20at/ana-s3ody/7442.html"

