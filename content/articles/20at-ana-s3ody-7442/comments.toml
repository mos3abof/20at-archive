subject = ""
author = "ذوالفقار علي"
posted = "2009-08-22"
text = "تخالف الناس بالتصوف جهلا فضنوه مشتقا من الصوف<br />ولست امنح هذا الاسم الا لفتى صاف فصوفي حتى سمي صوفي<br />ان التصوف هو اساس الدين لانه يعتمد على صفاء القلب وتطبيق الدين بروحانيه ولذه ومحبه واساس التصوف هو مجاهده النفس وترويضها لمحبه طاعه الله اما محبه الرسول والال والصحابه ورجال الدين الصالحين والاولياء فانه امر لازم شرعا وليس امر مبتدع كما يدعون وليعرف من ينتقد ذلك انما ينتقد دينه الحنيف والعياذ بالله ولا اريد اطيل الحديث بالادله فمن اراد ان يعرف عن مدى تطابقهم مع الشريعه الاسلاميه فليقراء كتاب (حقائق عن التصوف ) اما من اراد معرفتهم حقا فليعاشرهم ويصحبهم ويلتزم شيخا صالحا وبعدها انا اضمن له انه لن يلوم الصوفيه على مايفعلو ولن يرضى بغيرهم مذهبا<br />فقيها وصوفيا فكن ليس واحد فاني وحق الله اياك انصح<br />هذا قول الامام الشافعي الذي ارى في كثير من تعليقات الوهابيه في الاسفل يذكرونه فليتبعونه ان كانو كذلك وليقرؤ ماذا فعل اتباع محمد عبدالوهاب باستباحه دماء المسلمين وليقرا ماذا كان ابوه واخوه يحذرون منه ومن ضلاله"
archived = "2009-09-12"
capture_url = "https://web.archive.org/web/20090912050741/http://www.20at.com:80/20at/ana-s3ody/7442.html"
