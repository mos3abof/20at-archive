order = 0
subject = "لبنان-صيدا"
text = "السلام عليكم<br />هذه العمليات والمعارك تذكر اللبنابين والعالم العربي ب حرب لبنان ...<br />حيُث أن لبنان عاش نفس الوضع في ظل الاحتلال الإسرائيلي ..<br />ولكن ما لبث العدو ان واجه العمليات الفدائية والانتحرارية التي نشأت من كل لبنان التي بدات سنة (1982 إلى 2001) حتى تحرر لبنان..ومازالت<br />أخي العراقي أريد فقط أن أذكرك ب؟أن بعد العسر يسرا ومهما خيم عتم الليل لح يطلع النهار .<br />تفائل يا أخي ألا وإن النصر لقادم..<br />يا قلب بالصبر تجمل لليل ساعات ويرحل"
archived = "2004-05-05"
capture_url = "https://web.archive.org/web/20040505105321/http://www.20at.com:80/article.php?sid=100"

