[[comments]]
order = 3
subject = "البتوع فاهمنها غلط"
text = "جدع بتاع كده بعيون زرقا ودم بارد جه يبص على حريمنا.. ويولع بتاعة سيجارة مارلبورو أحمر، وفاكر أنه علشان معاه شوية بتوع بيضربوا نار وبتوع تانيين بيطيروا نبقى احنا ولامؤاخذة بتوع زيه.<br />افتكر اننا لامؤاخذة لما تراجعنا في وقت .. اننا تراجعنا يعني اتغلبنا .. والآهطل بن الهطلة جه هو والبتوع بتوعه فاكرين ان الحكاية سايبة، قولوا للبتاع الأهطل ده ان تراجعنا في لحظة مش معناه اتغلبنا، احنا بنرجع لورا علشان ننط نطة نجيب فيها دائه، وياما الأمة رجعت لورا .. بس كانت النطة بجون، وخللي الأهطل بعد كده يجيب البتاعة م الشبكة،<br />أصل يا جدعان دول بيحسبوا عمر الأمم بالأيام، والحكاية ع المفتشي كده، ان الفرح عندك شوية وعندي شوية .. بس الليلة الكبيرة بالصلاة ع النبي عندنا .. واللي يحبنا ما يضربش نار، علشان بتاعةواحدة ساعتها هيترد عليها ببتاعة كاملة، وتقوللي ساعتها ايه الإصة، أقولك أمر الله .. كاتب لنا نعيش سوا ونموت سوا ، أصل الأمة دي والنصر توأم ملتصق بس ساعات بيزعلوا من بعض، وفي النهاية ولا ميت مستشفى تفرقهم، والنهاردة، يا جدعان عليًًُ النعمة ما حد يقلق بكرة هتكون فل الفل، بس يمكن ساعتها كل واحد بيقرأ الكلام ده هيكون بيول ( واريني تحت التراب واريني ) واللي يحب النبي يزق زقة في الأمة، ويقوم برجولة ياخد بايديها شوية أصل لامؤاخذة البتاع اللي بيجري في عروقنا ده دم حر بن حر، وكل واحد فينا عارف لامؤاخذة مين ابوه ومين امه، وقوله لأبو عيون زرقا: مين أبوك يلا؟"
archived = "2004-05-05"
capture_url = "https://web.archive.org/web/20040505105321/http://www.20at.com:80/article.php?sid=100"

[[comments]]
order = 4
subject = "تحليل ديماجوجي للأمة"
text = "اعتقد ان الصراع حين ينطلق من مساحة الموائد المستديرة إلى مساحة الدبلوماسية الشعبية فإننا بذلك نكون قد دخلنا مرحلة جديدة وواعية ، التعليق السابق من أحد الشعبويين .. يدل على شبه وعي بقضايا الأمة، ولا ينقصه إلا أيديوجيا واضحة لتعميق هذه المفاهيم التي يتكلم فيها، والقضية ليست كما ذكر ( نطة وجون ) لكنها أعمق كثيرا أظن ان الكثيرين هنا لن يستفيدوا من شرحي لها وأنا أدعو الشباب جميعا من خلال هذا المنبر إلى التثقيف الذاتي لأنفسهم بدلاً من استخدام أدوات السب والقذف .. وعيب عليكم يا شباب"
archived = "2004-05-05"
capture_url = "https://web.archive.org/web/20040505105321/http://www.20at.com:80/article.php?sid=100"

[[comments]]
order = 5
subject = "هونوا عليكم"
text = "لا يزال الطريق طويلا، أرجوكم لا تسرفوا في التفاؤل حتى لا تصابوا بعد ذلك بإحباط أو خيبة أمل، فلا يزال الجهاد المطلوب هناك في العراق وفي فلسطين طويلا، ولا يزال الجهد المطلوب من الناس خارج العراق وفلسطين كبيرا، فلا يكفي أن نصفق طربا كالأطفال..هيييييه كسبنا، أظن أننا نحتاج لأن ننضج وتنضج مشاعرنا وأفعالنا"
archived = "2004-05-05"
capture_url = "https://web.archive.org/web/20040505105321/http://www.20at.com:80/article.php?sid=100"

[[comments]]
order = 6
subject = "و الله يا جدعان مش عارف اقول أيه ؟؟؟؟"
text = "New Page 1<br />بسم الله الرحمن<br />الرحيم<br />أنا مبعرفش أتكلم<br />في السياسة . بس دي مش سياسة . ده كلام عادي جداً من إنسان بسيط جداً<br />الأمريكان عايزين<br />راجل بجد . و للأسف أنهم مش شايفين راجل في المنطقة. و دايما ابويا كان يقوللي<br />الرجالة ماتت في 1973 و أنا كنت بضحك<br />لحد اللي حصل حصل<br />ووصلت المهازل إلى هذا الحد اللي أصبح لا يطاق<br />أنتوا عارفيين أحنا<br />عاملين زي مييييين .؟؟؟؟<br />زي الست اللي بتولد<br />و جيرانها عمالين يضربوها و كمان الناس الغريبة بيدمروها لحد مبتقرب تموت<br />الست دي هتولد<br />الراجل اللي هيظبط كل المواضيع و يلم الشمل و يبقى راجل بحق و حقيقي<br />بس للأسف لازال<br />الضرب مستمر و الغرب شغالين تمام<br />على العموم لازم<br />نبقى مؤمنين بالنصر و نتحرك في اتجاهه<br />و سيبك من القمم و<br />الأرف ده . و عايزين خطوة فعالة<br />و محدش يـــأ نتخ و<br />برده محدش يعمل فيها السبع رجالة . يعني نبقى عاقلين<br />معلش نحاول و ان<br />شاء الله هنوصل للي احنا عايزينه و نقدر نساعد الست دي على الولادة السليمة و<br />الصحية.<br />و هانت<br />ده كان رأي بسيط و<br />حسبي الله و نعم الوكيل في ....<br />HMH"
archived = "2004-05-05"
capture_url = "https://web.archive.org/web/20040505105321/http://www.20at.com:80/article.php?sid=100"

[[comments]]
order = 7
subject = "يا يا حبيبي يا صعيدي"
text = "يا حبيبي يا صعيدي يلي بتحكي ما في رجاله لا حبيبي بالعكس انتا غلطان ده كلام مش مزبووط ملان رجاله في الوئت ده بس الغلط مو فيهن الغلط بالحكام العرب يلي كلهن خووون<br />لسه الزلام موجودين ولسه في ناس وطنيين بسبنعدو ع الاصابع ولا مره كمان متل ما بتحكي امريكا بدها زلام لا حبيبي ملان زلام بس امريكا يلي بتشووفو زلمي بالهوئت بدمرووو واكبر دليل متل صدام حسن وابن لادن هدوول اشرف 2 في العرب وعم يمشوو صح شوف شو عملت فيهم امريكا حبيبي انا بحكي معك انا طالب للعلوم السياسيه وفي قلب احداث في السياسه من قلب فلسطين بتمنا تكون وصلت الفكره"
archived = "2004-05-05"
capture_url = "https://web.archive.org/web/20040505105321/http://www.20at.com:80/article.php?sid=100"

