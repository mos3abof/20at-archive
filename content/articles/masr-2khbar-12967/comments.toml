author = "تكملة التعليق السابق"
posted = "2009-08-18"
text = "اصل كان عندهم رئيس وزراء زي نظيف كده كان منشفها عليهم اوي<br />كان ممشيهم حافيين<br />واحنا هنا في مصر في عهد (مباركسيس) كلها وزارتين ولا حاجه والجذمه حتبقى رفاهيتة وحدودي الدخل مش حيلبسوا جذم<br />وبعد وزارتين كمان حيبقى الهدوم رفاهية وتبذير وحنعمل زي الفراعنه وحنلبس فوط على النص التحتاني<br />ربنا يستر<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-08-19"
capture_url = "https://web.archive.org/web/20090819141536/http://www.20at.com:80/masr/2khbar/12967--q-q.html"

[[comments]]
order = 1
subject = ""
author = "كانت حياتهم بؤس"
posted = "2009-08-18"
text = "طبعا الكل هيعمل من الفراعنة الهة يعرفون كل شىء<br />الحقيقة ان حياتهم كانت بائسة جدا<br />يكفى انهم كانوا حفاة وعراة وتوضح الرسوم على جدران المعابد وعلى التماثيل نفسها انهم عراة ويلفون خرقة من الثياب حول وسطهم كما كان تمثال رمسيس فى باب الحديد<br />ولم تكن هناك ادوية ولا مسكنات ولا علاجات<br />والتحنيط هو عبارة عن تخليل جثة المتوفى زى مخلل اللفت والسردين والفسيخ<br />ونظام قائسم على العبودية والذل"
archived = "2009-08-19"
capture_url = "https://web.archive.org/web/20090819141536/http://www.20at.com:80/masr/2khbar/12967--q-q.html"
