author = "صباح التفائل"
posted = "2009-12-08"
text = "امبارح صحيت من النوم<br />اتوضيت وصليت الصبح حاضر وعملت لنفسى كباية شاى وتصفحت الجرنان<br />وخرجت متوكلا على اللة متفائل جدا ومبتسم وتوجهت الى مقر الضرائب العقارية علشان اقدم الاقرار لان بطرس بية غالى قال ان اللى مش هيقدم الاقرار قبل نهاية الشهر هيتغرم 2000 جنية<br />التفائل الجميل وكل كلام التليفزيون اتبخر على الباب<br />زحام يوم الحشر<br />تخيل مركز كبير وتبعة 60 قرية وكفر وعزبة واقفين فى طرقة ضيقة وموظف واحد قاعد فى شباك بيتعامل مع كل الناس دى - زحام يوم الحشر<br />فكرنى فى اليوم اللى انفعصت فية وانا ارمى الجمرات فى الحج ايام زمان<br />موظف واحد يا بطرس يا غالى يقابل كل الناس دى والزحام والصريخ والضرب والصياح<br />هو احنا عندنا عجز فى الموظفين<br />مشيت داخل مقر الضريبة العقارية<br />كل اوضة فيها 10 موظفين مبيعملوش حاجة ومخصصين موظف واحد لمقابلة كل تلك الناس واستلام الطلبات من الناس ومراجعتها وكتابة ايصال استلام لة<br />سوء ادارة بكل جدارة<br />او فشل ادارى<br />الكلام فى التليفزيون يظهر ان الدولة دى حلوة قوى انما الواقع اليم ومر<br />وقفت ساعتين فى الزحمة احاول ان اقترب من الشباك ومفيش فايدة<br />ومشيت وانا متفائل ومبتسم"
