text = "فعلا كويس ان حد كتب عن الموضوع ده لأن مش فاهمة ايه قصة الستات اللى بياخدوا العيال 3-4 سنين المسجد<br />و دوشة و صريخ و حاجة اخر قلة أدب. اخر مرة واحدة زعقتلهم قالتلهم اللى معاها عيال تروح بيهم. لا احنا عارفين نركز و لا انتوا عارفين تركزوا و فى الاخر بتاخدوا سيئات.<br />كمان صلاة السيدات فى المسجد مش فرض يعنى و لو عاوزة تصلى يا تسيب العيال مع حد ي اما تصلى فى بيتها أكرملها"
