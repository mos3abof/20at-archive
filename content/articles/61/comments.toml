[[comments]]
order = 11
subject = "مصر"
text = "جزالك الف خير يااستاذ مجاهد وكنت اتمنى ان القى العلم على يد استاذ نابغ مثلك احنا عايزين زيك فى كل المجالات واحلى شىء قلتة ان الطامة الكبر ان الممثلة هى القدوة اى ان الداعرة هى القدوة والشاب الضاءع المستهزء بكل شىء هو الشاب الكول والاعلام العربى الامريكصهيونى هو المحتوى لذلك هذة موضوع الماجستير الذى العمل بة الان بصفتى فى مجال الاعلاموافقك اللة واخيرا رايت شىء اصقف من اجلة واللام عليكم ورحمة اللة وبركاتة"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018212213/http://www.20at.com:80/article.php?sid=89"

