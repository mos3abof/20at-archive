[[comments]]
order = 0
subject = "كيف يا بطنى تشبعى و فى فلسطين طفل جوعان"
author = "مناضل انترنتى قديم"
posted = "2006-05-19"
text = "السلام عليكم ورجمة الله و بركاته<br />اتعجب بشده لحالك يا بطنى فهل امرك دينك ان تشبعى و جارك جوعان كيف تشبعين و فى فلسطين طفل جوعان ....<br />وصلت الرساله<br />أين تبرعاتكم يا فقراء و أغنياء المسلمبن<br />دعوكم عن حكامكم فهم فى سباتهم نائمون<br />و انتم أيها الابطال أثبنوا تعلموا من نبيكم صلى الله عليه و على اله و صحبه وسلم وخذوا منه و من صحابته القدوه فى حصار شعب بن أبى طالب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154325/http://www.20at.com/article2.php?sid=823"

[[comments]]
order = 1
subject = "الأردن"
author = "رندة الحلبي"
posted = "2006-05-20"
text = "يا خسارة منهم واليهم وين الشعب الاسلامي وين عندما سئل احد العلماء المسلمين عن الناس الذين يعيشون في جنوب افريقيا ولم يصلهم الاسلام هل سيحاسبون يوم القيامة اجاب : انا لا افكر فيهم هل سيحاسبون ام لا بلافكر في نفسي والمسلمون هل سيحاسبنا الله على تقصيرنا بان لم نوصل لهم الدين : ربما تتسائل ايها القارئ ماعلاقة هذه القصة بالحصالات الفلسطينية؟؟؟؟ ليتك تجيب انت ؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154325/http://www.20at.com/article2.php?sid=823"
