subject = "تقولون نصف الحقيقة"
author = "صادقة و امينة"
posted = "2006-06-13"
text = "ظهر النائب ابو فارس على العربية الفضائية و قال بالحرف الواحد: من ماتوا بتفجيرات فنادق عمان ليسوا شهداء وهذا غير مقبول لانه لا يستطيع شخصيا ان يفتي بالشهادة لاحد لانه لا يعلم بها الا الله. ومن قتل مسلما بغير ذنب فهو مجرم و ليس شهيد"
