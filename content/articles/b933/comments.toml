[[comments]]
order = 6
subject = "العزاء لاهل الزرقاوي"
author = "ابو ابراهيم"
posted = "2006-06-14"
text = "العزاء لاهل الارهابي ابومصعب الزرقاوي لان العادات والتقاليد عند الاردنيون تحث على التعزية ولاكن هذا العزاء لاسم العائلة التي يحملهاولانها عشيرة كبيرة وتكن بل ولولاء لجلالةالملك عبدالله الثاني اطال بعمره ولاكن الخطاء الشنيع الذي ارتكبوه الن النواب الذين قدموا العزاء قدموه لاهل ابو مصعب هو كاداء واجب فقط....."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150852/http://www.20at.com/article2.php?sid=933"

[[comments]]
order = 7
subject = "الاردن لن يمنع التعزية"
author = "ابو ابراهيم"
posted = "2006-06-14"
text = "عزائي للشهداء الذين سقطواعلى ثراءالاردن و فلسطين بالحروب العربية 1967و1968و1948والاعتداءات التي وقعت بالفنادق 11/9/2005 رحمهمةالله وقاتلهم قد نال القصاص والحكم الشرعي ولكن لو المسلمين الذين قتلوا الارهابي ابو مصعب لكان العزاء مقبول لان المجرم الذي بنظر العدالة عندما ينفذون به حكم الاعدام يسارعون من ورائه بفتح بيت العزاء له ولذالك انا انظر بعين الرحمة للنواب الاربعة والصحافة الاردنية (ارحموا النواب الاربعة يرحمكم الله ودمت يامليكي المعظم عطوف كما انتم يا عميد بني هاشم ....................."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150852/http://www.20at.com/article2.php?sid=933"

[[comments]]
order = 8
subject = "إتقوا الله"
author = "محمد صالح العاتي"
posted = "2006-06-14"
text = "إتقوا الله مالكم كيف تحكمون؟ من هو الشهيد؟ الذي قتل الحرث والنسل؟ الذي قتل الشيخ والطفل الصغير؟ الذي عاث في الأرض فسادا؟ اسئلكم بالله إن كنتم موحدين ومؤمنين بالله. كم يتيم الآن في العراق بسبب الزرقاوي؟ وكم أرملة وكم ام ثكلى وكم اب مفجوع وكم اخ فقد اخاه بسبب مايدعيه الدعي الزرقاوي بالجهاد ؟ اي جهد واي دين هذا حاشا لله وحاشا الدين من هكذا زنادقة على شاكلة الزرقاوي .وإنا لله وإنا إليه راجعون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150852/http://www.20at.com/article2.php?sid=933"

