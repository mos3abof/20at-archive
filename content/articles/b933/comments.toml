[[comments]]
order = 12
subject = "رجل انت وشهيد يابومصعب"
author = "فيراس نور الاسلام@من الجزائر"
posted = "2006-06-18"
text = "فزتا بها نلة الجنة يا ابومصعب اللهم احفظ الشهيد عزته واستشهاده ولعنو ابناء الزنة اعداء الجهاد والمجاهدين ابومصعب بريئ منكم يوم القيامةيا ابناء الصهاينة ياابناء امريكا ويل لك ايها طاغية الرئيس الاردني ويل ل انت والحكام العربية من اهوال القيامةوعداب الله اللهم ارحم الشيخ ابو مصعب وخطاب وعزام والشهداء الاسلام والمسلمين من المجاهدين المؤمنين بالله والسلام عليكم ايها المؤمنون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150852/http://www.20at.com/article2.php?sid=933"

[[comments]]
order = 13
subject = "لعنة الله عليه وعلى روحه"
author = "ارشد ابن العراق"
posted = "2006-06-29"
text = "والله انى ارى اعلى مستويات النفاق والشقاق الذى وصل اليه مثل هؤلاء الزنادقه الذين يدعون الاسلام ...خافو الله بالله عليكم لو كنتم ممن قتل له اخ او اب او اخت بسبب (الجهاد)؟؟والقتل العشوائى كل يوم ماكان تلفظت السنتكم بكل هذا الكلام كانكم تعبرون عن كرهكم لاخوانكم بلعراق واسفاه عليكم ياعرب وا اسفاه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150852/http://www.20at.com/article2.php?sid=933"
