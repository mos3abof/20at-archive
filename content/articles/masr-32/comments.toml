text = "سؤال لكاتب الموضوع<br />لو انت مكان الحكم هتعمل ايه<br />هتتغاضى عن الصدفه اللى حصلت و هى حدوث الخطأ فى نهاية الشوط الاول و لا هتعمل ايه بالظبط<br />انا شايف انه عمل الصح"
