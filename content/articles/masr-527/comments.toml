[[comments]]
order = 3
subject = "التناقضات الشرقية"
author = "معاذ محمود عامر"
posted = "2006-06-15"
text = "انها مسألة محيرة, ماذا تفعل الفتاة في ظل المجتمع الذي ينظر لها على أنها عورة؟ ببساطة ومن غير تعقيد, اللي عايزة تتدين ومقتنعة بالحجاب كفرض, تريح نفسها وتقعد تحت الشمسية وتمسك كتاب لابن القيم وتذكر ربنا وتقول سبحان الله على جمال البحر, أما اللي شايفة ان الحجاب حجر على الحرية الشخصية للمرأة وانه عادة مش عبادة, فتنزل البحر والمبادئ لا تتجزأ, لانها ممكن تكون شايفة ان ده حقها (المساواة) وبكده نكون حسمنا الموضوع وبلاش لت وعجن عالفاضي....... للمراسلة:MIZO_BNS2011@YAHOO.COM"
archived = "2006-12-15"
