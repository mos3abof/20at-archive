[[comments]]
order = 13
subject = "محمد سيد شوف يا سيدي"
author = "مي كامل"
posted = "2006-06-16"
text = "محمد سيد .. صراحة انا شايفة اكتر من طريقة اولا ممكن تنزل فى معاد مخصص للسيدات فى نادى او فى مكان مقفول لان اى مكان مخصص للسيدات فى شط او قرية سياحية هيبقى برضه مفتوح وهتلاقي الناس معدية بتبص .. ثانيا لو مفيش امكانيات تنزل فى نادي ممكن تلبس مايوه بس ميكلفتهاش الكلفته السودة دي وتلبس عليه هدوم وتنزل برضه بس فى وقت مناسب الساعة 7 الصبح فى وقت متاثرش الشمس عليها حتى متسمرش وكمان ميكونش الناس كتير بيبصوا متبقاش فرجة ..<br />انما نيجي للمنقبة بقى .. دي باي حال م الاحوال بجد بتهين نقابها لما بتنزل بيه الميه .. والشكل مبيبقاش طبيعي."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 14
subject = "الى الاخت الحرة ولورد كاش"
author = "عبدالله مفتاح"
posted = "2006-06-16"
text = "عنصريه مرة واحده؟<br />هو انتي قريتي في تعليقي اني قلت البنت متنزلش البحر؟<br />انا سالت سؤال قلت هي البنت لازم تنزل البحر؟<br />كنتي رديتي على السؤال بدل متتهميني بالعنصريه يعني مثلا كنتي رديتي وقلتي: اه طبعا البنت لازم تنزل البحر لانها لو منزلتش ممكن يجيلها انهيار عصبي او ارتفاع في ضغط الدم او السكر ووارد كمان يجيلها انشكاح في البرياح واذا انشكح البرياح سيكون له مردود سيء عليها<br />بس وانا كنت قلتلك شكرا جزيلا على الرد وكنا خلصنا<br />ليه تقولي اني عنصري وفي الاخر تقوليلي انت مالك انت؟؟؟؟<br />لورد كاش بتقول ان المشكله في العقليات المتخلفه اللي بتتعامل مع المراه على انها عورة<br />اظن في حديث صحيح بيقول(المرأة عورة فإذا خرجت استشرفها الشيطان)<br />يعني العقليات مش متخلفه ولا حاجه<br />وبعدين متنتقد براحتك لازم تقول متخلفه؟"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

