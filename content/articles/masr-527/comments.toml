text = "هو فى ايه هو كان زمان فى سياره ولادش ولاتليفون محمول شرع ايه اللى بتقولوا عليه اللى عاوز حاجه لابد ان يعملها بفرح اذا تحجبت تحجبى منل اجل الفضيله لاللمنظرة جاتنى مره رحله من السعوديه على باخرتى وكان بها بنات بين 23و30 سنه لابسين شرطات وميوهات سالتهم هو انتوا بتلبسوا كده فى السعوديه قالوا لااحنا نفسنا منرجعش تانى مصر احلى بكتير التدين من الداخل وليس من الخارج لاللمنظره لاللتطرف لا ى فعل غير طبيعى"
