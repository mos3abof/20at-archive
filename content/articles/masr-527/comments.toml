[[comments]]
order = 44
subject = "المراة ليست مخلوقا جنسيا"
author = "jojy"
posted = "2006-06-30"
text = "قد يبدو عنوانا غريبا و (غير محترم) لي الكثيرين و لكن من خلال متابعتي للردود وجدت ان معظمها يحمل نظرة متدنية للمرأة نظرة علي انها مخلقا جنسيا متحرا اينما يسير فإنه يثير الفتن و الغرائز ..البحر لم يخلق للرجال فقط و ليس من حق اي رحل ان يقول ان المراة او الفتاة ليس من حقها الاستمتاع بنعم الله لمجرد انها امراة و انها يراها خليفة الشيطان مصدر الشرور<br />معظم بنات الشعب المصري بنزل البحر بملابس محتشمة و مفهوم المايوة الشرعي ليس بدعة و مش عيب لما نقول مايوة شرعي لا كلمة مايوة قليلة الادب ولا كلمة شرعي كلمة فضلى انها تعبير كمثل باقي التعبيرات كالانترنت و التليفزيون و غيره و لم يورد ذكرها لا في القرآن ولا السنة<br />انا لا اعلم لماذا نتعامل مع الموضوعات بسطحية لماذا المرأة دائما هي المذنبة؟؟ العيب في العقول و الاخوة اللي مش عاجبهم تامايوة الشرعي بيوصفوه انه لازق في الجسم و ده بينم ان العقليات دي بتبص و بتبحلق خليك في حال!!<br />كمان في اجانب بنزلوا البحر ببكيني و من غير حتي نعمل معاهم ايه دول؟؟<br />في ولد ظريف محترم قالي انه هو و عيلته لما بيصيفوا في شرم الشيخ عمرهم ما بصوا للاجانب كل واحد في حالة و الولد لم يصب برغبة جنسية مستفحلة لانه شاف امرأة ترتدي المايوه؟؟ و ده لان عقله محترم و ياريت كلنا نعمل كدة و نفكر بشكل مختلف بدلا من القاء التهم جزافا علي المرأة!! بجد الستات دول مطحونين في البلد دي و كل البلدان العربية !!<br />ولا عزاء للمرأة"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

