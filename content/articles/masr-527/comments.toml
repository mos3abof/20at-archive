[[comments]]
order = 28
subject = "هي كانت ناقصه يا 0000"
author = "الاستاذشيكو"
posted = "2006-06-21"
text = "ايه التفاهه دي والله انا مش فاهم واحد ولا واحده عمال يقولي قال ايه عنصريه وواحد تاني يقولي تخلف هو ايه الحكايه !!!!!!<br />واحد لامؤخذة نطع وجته ماشي مع مراته ولا اخته ولا حتي حبيبته وهى لابسه البكيني وهو مصدر العبيطه وعامل عبيط !!!!!<br />مع ان كل الرجاله عامالين ياكلوا جسمها من اوله الي ااااااااخرة وهو ولا هوة هنا<br />وبيقولوا رجاله !!!! بلا خيبه<br />ده بقه لما تيجي تعاكس مراته وهي لابسه المايوة البكيني تبص تلاقيه اتحمق اوى انا مش عارف ليه<br />لما انت محروق اوى كده لم لحمك يا عمنا وبلااااااش مسخرة وقله قيمه ولما تبقه محترمه في لبسها ابقه تكلم لو حد عاكسها<br />كدة تبقه كفائه وراجل بجد مش ماشي نطع ولطخ مع المدام وهي لابسه المايوة وفاشخ حنكك وعاملي ضبك كده وفرحان عشان الست عريانه وجسمها حلو<br />لو واحد لابسه المايوة وواحد قالها حسمك حلو كده واخوها ولا جوزها سمعه هايعملها ايه ولا هايعمله ايه!!!!!!!!<br />عايز واحد عاقل يجاوب بس خلاااااااااااااااص"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 29
subject = "اة المسخرة دى"
author = "سارة"
posted = "2006-06-22"
text = "قال مايوة شرعى قال هو كان فى فى الشرع مايوة علشان نقول شرعى ومادام البنت مسلمة يبقى لازم تسلم لاوامر ربناوتطيع اوامر الرسول من غير مناقشة او اعتراض<br />وانا اتفق مع الاستاد عبد اللة مفتاح ان فى تضاد بين مايوة وشرع والبنت مش لازم تنزل البحر مادام جسمهاحيتجسم ويبان وبعدين الحل فى ايدينا سواء كنا ستات او رجالة الست ان هيا تصون نفسها وماتنزلش البحر الا ادا كان الشاطىء فاضى ما فيهوش حد او ماتنزلش خالص مش لازم والرجالة يمنعوا بناتهم واخواتهم ان هما ينزلوا البحر ادا كان فى حد مش محرمهاوربنا يهدينا ويهديكم"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

