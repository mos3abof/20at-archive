[[comments]]
order = 7
subject = "هل نزول البحر ضروري ؟"
author = "هشام"
posted = "2006-06-15"
text = "بالنسبة لي أنا لست من مصر ولا علم لي بالمايوه الشرعي الذي أنتم تتحدثون عنه، ولكن بالنسبة للبحر أنا شاب قد منعت نفسي من الذهاب إليه منذ 6 سنوات، لماذا؟ لأن أي مكان به منكر وجب على المسلم اجتنابه من باب الوقاية من الفتنة، والمنكر.. أما الإخوان الذين يقولون لأن الشباب تذهب من أجل المتعة والنظر، فوالله ما هي إلا منتعة الحرام، أين نحن من متعة الحلال.. أما المرأة فأنصحها نصيحة الأخ للأخت بعدم الذهاب، لأنه مكان شر، أو بالأحرى نحن هذا الجيل جعلناه مكان منكر وفسق وتبرح وعري.. كأن الله تعالى لا يرى لا يسمع.. مع أن سبحانه وتعالى قادر على أن يمسخ كل هارية ومتعري ومتبرجة في المصيف أو الشواطئ،<br />هل البحر ظروري ؟ وما هي متعته؟ وهل المتعة تتجلى في المياة والغوص أم في التركيز على جسم جميل أو مفاتن تلهب الغريزة؟ أليس الرسول الكريم عليه الصلاة والسلام ركب البحر مرة واحدة ؟ ألم يعطي شروط الذهاب إليه ؟ بالله عليكم غذا كان الرسول الكريم صلى الله عليه وسلم معنا الآن هل سيرضى بهذا الكلام ؟"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "مممممم ..طيب وبعدين ؟؟"
author = "محمد السيد"
posted = "2006-06-15"
text = "طبعا أنا متفق تمام مع مي ... لكن ؟؟؟<br />فين الحل ؟؟؟ يعني انت رصدت المشكلة والموضوع والظاهرة و.... ؟؟ لكن مقدمتيش الحل ؟؟؟<br />أو إنت نفسك بتعملي إيه ؟ أو إخواتنا يعملوا إيه ؟<br />ثانيا ..بالنسبة لولاد البلد .؟؟ كان في مقال عن ممكن نصيف من غير ذنوب؟!<br />أظن كان لشيرين مجدي ؟؟<br />لو ممكن يتنشر هنا تاني ...أو حاجة بنفس الفكرة ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "طبعاً البنات نفسها تنزل البحر"
author = "أنا حرة"
posted = "2006-06-15"
text = "الأخ اللي فوق اللي كاتب يقول سؤال : هي البنت لازم تنزل البحر؟!!<br />ده إيه العنصرية الغريبة دي؟؟!!<br />آه يا أخي لو ليها مزاج ونفسها تعوم وتنزل البحر ما تنزل يا أخي، آه طبعاً لازم تنزل لو بتحب عوم البحر لكن بحدود طبعاً.<br />يعني مثلاً أنا بنت محجبة، لكن أولاً بختار الوقت اللي بنزل فيه المية ولازم يكون معايا بابيا أو أخواتي وبتكون مامتي مستنياني على الشط علشان تغطيني ببشكير كبير أول ما بطلع...<br />وبعدين في إختراع حلو أوي في الساحل اسمه شواطيء للسيدات فقط والمحجبات...<br />أنت مالك انت تنزل ولا ما متنزلش<br />شيء غرييييييييييب.<br />وأنا حرة."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

