author = "هو ليه اسلوب الحوار متدني كدة؟ يا جماعة احنا فى سايت مش فى الشارع متحجروش على راي حد .. الدين يابتوع الدين ياللى بتتكلمو بيه الدين بيقول وجادلهم بالحسنى .."
