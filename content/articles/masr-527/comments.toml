[[comments]]
order = 25
subject = "اختلاف الرأي ظاهره صحيه ولكن مش التطاول على الراي الاخر"
author = "صبرنى يارب"
posted = "2006-06-17"
text = "اما بالنسبه لقصة المايوه الشرعي فانا مش عارفه شرعى على اى اساس وهو لازق على الجسم من قبل ما تنزل الميه لكن اهو اى كلام<br />اما بالنسبه لنزول الميه يا جماعه فطبعا من حق كل واحده انها تعمل حاجه نفسها فيها واكيد مافيش بحر مغلق زى حمام السباحه لكن فى بلاد فيها شطوط مغلقه فعلا للنساء ودى فعلا حاجه حضاريه جداااااااااا<br />وانا شوفتها فى الامارات وفعلا جميله بس طبعا احنا مش هانعمل بلد على كيفنا لو كانوا مطالبين بحقوق المرأه ناس محترمه ويعرفوا ربنا كانوا طالبوا بشطوط مخصصه للنساء وعموما يعنى انا لما باحب انزل البحر زى ما تفضلت اخت وقالت فى لبس مش بيبقى لازم من الميه وكمان ممكن تنزل المغرب او بعد الفجر عشان بيكون الجو مافيش نور ومافيش ناس كمان غالبا<br />والى عايز بقى يتلصص ويتفرج على اخته وهى خارجه من الميه يمكن يبان منها حاجه يبقى يروح وهو حر<br />وللشباب كلهم الى بيقولوا خلونا نتفرج اين غض البصر يا شباب الاسلام<br />وعموما للناس كلها كلمة المرأه عوره مش عيب فى حق المرأه بالعكس ده حفظ لها ولكرامتها فىالمجتمع وكل ماالحاجه غلت لفتها تكون اكبر واشيك واثمن افتخرى اختى ان دينك بيحافظ عليكى وحافظي عليه مش عيب ابدااااااا ان الدين يقول للست حافظى على نفسك وما تبقيش مشاع لعيون قلوبها مريضه<br />اختكم فى الله تتمنىلكم الثبات على التقوى والرقى فى التعامل واختلاف الراي بينكم"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

