[[comments]]
order = 23
subject = "نوسو المفروض مردش"
author = "عبدالله مفتاح"
posted = "2006-06-17"
text = "فين كلام الدين اللي انا قلته يا حجة الاسلام<br />طلعلي كده الكلام اللي انا قلته غلط في الدين<br />كل اللي قلته حديث صحيح لو الحديث مش صحيح قول<br />ده لو كنت عارف ايه هو الحديث الصحيح اصلا<br />بتقولي بطل هبل وكمان بتقول على كلامي غبي<br />ليه الغلط بس؟ هو انا غلطت في حد في كلامي؟<br />يا حجة الاسلام انا متكلمتش في الدين خالص وحتى لو تكلمت واخطات صححلي<br />لكن عيب تتكلم بالاسلوب ده<br />ربنا يهديني ويهديك<br />ربنا يهديك ويهديني"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
