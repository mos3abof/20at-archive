[[comments]]
order = 20
subject = "واية كماااااان؟"
author = "مفقوع"
posted = "2006-06-16"
text = "يا جماعة.. خلصت مشاكلنا الاساسية لما ندروح ندور على مشكلة المايوة ؟<br />المفروض وحسب ما انا شايف ان الستات كلهم عورة ..صوت وصورة .. والفروض الاحسن يعنى تقعد فى البيت من اصلة وبلاش وجع الدماغ... بقى فى زى اسلامى وفرح اسلامى ومايوة اسلامى وعربية خاصة للسيدات فى المواصلات اللى هما اصلن مش بيلتزمو بيها وكمان فى شواطىء خاصة وشوية شوية هنلاقى بقالة خاصة للسيدات وطبيب خاص للسيدات .. وهكذا<br />يا ناااااااااس يا هوو الفضيلة فكر وعطية من ربنا وتربية مش لبس والله<br />وعندى سؤال صغير .زاذا كان الموجود دلوقتى هوة الصح؟ ماظهرش من زمان لية ؟<br />واية مصير الامهات والاخوات اللى ماتو من غير ما يعرفو الحجاب والنقاب وكانو بيركبو المواصلات عادى خالص ولابسين مينى جيب وميكرو جيب ؟؟؟ علما بان حوادث الاغتصاب ماسمعناش عنها فى الزمن دة<br />اتقو ربننا وارحمونا وريحونا وقعدوهم فى البيت"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

