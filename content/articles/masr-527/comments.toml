posted = "2006-06-16"
text = "المفروض إن يكون فيه شاطىء خاص للنساء آو آوقات مخصصه للنساء وبعدين زى ما بندى حق للبنت إنها تنزل بالبكينى آو المايوه العادى لازم نكون حقانيين ونديها الحق بالنزول بالمايو المتغطى هى حره إنشاالله حتى تنزل بخيمه دى حريه شخصيه هو يعنى حد جايب حاجه من جيب آبوه واللا يعنى مية البحر ملكيه خاصه ؟ ما تسيبوا الناس فى حالها ونتكلم فى حلجه مفيده آحسن"
