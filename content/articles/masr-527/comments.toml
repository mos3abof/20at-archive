[[comments]]
order = 34
subject = "انا جبت جاز ده على اساس ان انا عربية"
author = "Max"
posted = "2006-06-22"
text = "اناكنت انا النهاردة فى البلاج جاى اريح نفسى من هم الامتحانات المهم مش عايز اطول انا فكيت عن نفسى كتير النهاردة طبعا عارفين اقثد ايه بكينى وحفلة كمان والناس ولا همهم حاجة غير الرقص بنات شباب بصراحة مكنتش مركز مع غير مع الجنس المتوحش الى جيبنا ورا عارفين انا خرجت مخنوق جدا مع انى كنت مبسوط قوى بس حسيت انى بسطعبط ومكنش لازم ابقى عامل كده حسيت انى ضعيف قدام شهوتى الى انا بحاول اكسرها وابعد عنها ويناس ارجوكم ابعد عننا الانحطاط الاخلافى ده انا خلاص اتخنقت من البلد ديه مع انى كنت بحبها قوى بس معتدش قادر استحمل حد روحى بقت فى مناخيرى من الى بيحصل ولا احنا عارفين ازا كنا عرب ولا اجانب غربيين يعنى وطبعا انا مش كلب بجرى ورا شهوتى لكن ديه غريزة عند كل البشر رجعت من البلاج وانا طالع العمارة كنت خلاص هقرر انى انتحر كلها بنتات ولا حد فيهم حاسس هو بيعمل ايه ولا مدى تاثيره علينا اهدو شوية واركزو يا رب اهدينى وارحمنى وارحم مصر وارحم شباب مصر وعزرا لكل البنات بس حاولو تفهموا ان الواحد مش عايز يعمل حاجة تغضب ربناومش عايز ادخل النار لانى مش هقدر اتحمل"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 35
subject = "طبعا انا مقصدش"
author = "Max"
posted = "2006-06-22"
text = "انا مقصدش انى انتحر عشان البنات لكن بلد بيظة الظلم فى كل حتة الاسعار مولعة انا صرفت سبعين جنيه النهاردة فى ايه مش عارف ولا خرجت مع حد ولا حاجة وعايز ازكركم بحاجة انا كنت راكب باص من كام يوم المهم سرت المصيف جت وانتم عارفين الناس عايزة ترغى وانا بصراحة مبحبش اكسف حد الراجل الى جنبى حوالى 35 سنه وانا بقول كلمت مصيقف الراجل بص كده وقال مصيف كان حلمه انه يصيف انا بصراحة اضيقت جدا لان البيه الكبير خلى المصيف حلم للناس من الصعب تحقيقه على فئة معينة لان الى هو بيشتغل بيه بقاله سنتين هيصرفو فى اسبوع حوارت كتير الواحد بيشوفها وان كا شخص بكره الدنيا ومن الى عملته فيا وفى غيرى فلوس بنات مخدرات كل حاجة عشان كنت جت لبالى لحظة انى انهى حياتى لكن انا عارف لو موت نفسى ابقى كافر وانا محبش انى ابقى كافر اخر الحوار اللى ملوش دعوه بالموضوع ان الله لايغير ما بقوم حتى يغيرو ما بانفسهم وربنا يساعدنا بس احنا ننوى ونعمل ونتخلق بأخلاقنا الحقبقبقة مش المصطنعة وكفاية كده"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 36
subject = "فلنناقش بجدية"
author = "أحمد زكريا"
posted = "2006-06-23"
text = "طيب بما ان هذا الموضوع هام جدًا . وتتوقف عليه مصائر الأمه باسرها .. من مصر إلي الشام .. بل ومصير ال×وه العرب المغتربين كذلك .. لذا فإني اقترح التالي : ..<br />1- يتم عقد ( مؤتمر قمه ) محترم كده يجتمع فيه الساده الوزراء والساده المسؤولين ويناقشو فعهاليات المايوه الشرعي وكيف نحمي بناتنا وشبابنا من هذه الفتنه الهوجاء .. ويهخرجون من هذا الموضوع بتداعيات ممتازة وتوصيات فعالة .. ميتنفذش منها شيئ .. وبعدين تحدث مكالمات هاتفيه بين الرؤساء لمناقشه حل هذه القضية الخطيره بعد تفاقم الوضع .... ممكن برضه الطلبة والطالبات يخرجوا في مظاهرات جامعيه وينقسمو إلي قسمين قسم مؤيد للمايوه وقسم ( ضد المايوه رافعين شعارات وهاتفين هتافات رنانه ويتم تفقريق المتظاهرين بإستخدام قنابل الغاز وخراطيم المياه وما إلي ذلك . والخ الخ الخ بأه عشان انا زهقت من الكتابة ..<br />أحمد زكريا"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

