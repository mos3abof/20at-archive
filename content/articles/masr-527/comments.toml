[[comments]]
order = 5
subject = "إلى الأخ عبد الله مفتاح"
author = "لور دكاش"
posted = "2006-06-15"
text = "أيوا البنت لازم تنزل البحر.. يعني مش لأنها اختارت انها تكون ملتزمة يبقى تتحرم من حاجة زي دي ناس كتيييييييير بتعتبرها متعة من أهم متع الحياة. أما بقى المايوه الشرعي والكلام ده، فما هي إلا أسماء سميتموها.. البنت عادي جدا ممكن تنزل البحر بهدوم من قماش معين مبياخدش شكل الجسم.. وكل واحدة في الدنيا عندها في هدوها حاجة بالشكل اللي أنا بقول عليه..<br />المشكلة مش في اللبس.. المشكلة بجد في العقليات المتخلفة اللي بتتعامل مع المرأة على انها عورة، وان مجرد نزولها البحر هو اللي هيفسد شباب المسلمين.. بدل ما تتريقوا على البنات اللي بتنزل بهدومها، اتريقوا على الولاد اللي بتنزل بالمايوهات الضيقة الحمرا والصفرا اللي ملهاش أي علاقة بالشرع ولا حتى باحترام النفس..."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215115433/http://masr.20at.com:80/article.php?sid=527&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

