[[comments]]
order = 40
subject = "البحر بيضحك ليه"
author = "طارق حمدى"
posted = "2006-06-24"
text = "عارفين البحر بيضحك ليه ولا ما حدش عارف ليه اقولكم انا بيضحك على الفضايح اللى بتحصل عليه مسخرة واللهى من حق البنت تنزل البحر وتستمتع بس لازم تعرف ان فى عيون تندب فيها رصاصه متربسه ليها ان كان جوةه الميه ولا على الشاطئ لازم تعرف انها قبل ما تنزل الميه تتخيل شكلها ازاى وهى طالعه ودلوقتى فى رياضه شفط الكرش للرجال لما بيشوف وحده حلوة دا طبعا من ورء مراته وتمنياتى للجميع بقضاء صيف جميل"
archived = "2006-12-15"
