text = "عبد الله مفتاح<br />كلامك غبي خالص<br />ممكن تمسحوا أحسن لو ينفع علشان ده بيدل على إنك متعرفش ولا حاجة في أمور الدين<br />جرستنا الله يجرسك"
archived = "2006-12-15"
