order = 39
subject = "المشكلة فينا"
author = "ابو سهيله"
posted = "2006-06-24"
text = "المشكلة يا اخونا فينا بالأخص الرجالة اللي بيقول فينا تروح عشان هو يتفرج بينسي اته عنده اخت او ام او بنت ...الخ<br />الواحد فينا عاوز يعمل اللي يحلالو ويحرم علي غيره نفس الحق<br />وبالنسبة لأخواتنا البنات طبعا فيهم اللي عاوزة تبين جسمها عشان الناس تقول عليها بنت محصلتش وغيرها وغيرها ....<br />اما اللي بيحترم نفسه من دول او من دول عارف الدين بيأمره بإيه مفيش حد فينا ميعرفش الحلال من الحرام كلنا عارفين بس بنكابر .<br />اسأل الله لكم ولي العفو والعافية والستر وحسن الخاتمة"
