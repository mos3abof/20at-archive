subject = "مش كدة"
author = "لايص"
posted = "2006-11-02"
text = "أنا أوافق أغلب الإخوان اللذين خاضوا في هذا الموضوع. ماعدا اللذين ادعوا العفة، دول إيه اللي أخششهم وإيه اللي خلاهم يتابعوا مثل هذه المواضيع. اليس عيبا عليهم الاشتراك في هذه المنتديات؟ دول الأحرى أن يخوضوا في المنتديات الاسلامية. هذا المنتدى لا أحسبه إلا منتدى يبعد قليلا عن الجدية حيث يجد الشخص منفذا لتفريغ مشاعره. ألا يتفق معي الإخوا،؟"
