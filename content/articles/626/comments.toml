subject = "معلش افتكرت حاجه ,"
author = "هبهوب"
posted = "2006-02-20"
text = "كنت صغيراً على القهوة .<br />لكنْ ذات مرة .. ذقت فنجان أبي ..<br />قلت : أبي !<br />هذه القهوة مرة !<br />يا أبي بالله سكّر .. !<br />قال : دعها ..<br />لستَ مجبر !<br />قال جدي باسماً : ما زال طفلاً<br />وأخي الأكبر يرمي غمزة نحوي<br />ويسخر .. !<br />وأنا من خجلي ..<br />أصبحتُ ..<br />أَصغر .. !<br />كان فنجان أبي<br />في المنتصف ..<br />أخذ الفنجانَ هوناً<br />وارتشف<br />رشفة أولى<br />وأخرى ..<br />في شغف .. !<br />( ثم قال : )<br />يا بني ..<br />هذه القهوةُ<br />تدعى \" العربية \"<br />قد ورثناها ..<br />من التاريخ<br />سمراءَ<br />نقية ..<br />فتعلم كيف تصبرْ<br />كل مرة .. !<br />يا بني قهوة الأجداد ..<br />حرة .. !<br />أيُّ طعم<br />يتبقى ..<br />عندما لا تصبح<br />القهوة<br />مرة .. !"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113045/http://www.20at.com/article2.php?sid=238"

