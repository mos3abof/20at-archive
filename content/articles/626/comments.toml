order = 0
subject = "معك حق .. و لكن!!"
author = "واحد معدي"
posted = "2006-01-10"
text = "أولا : أحب أقول لك برافو بشدة على الموضوع<br />ثانيا : أنا معاك في كل اللي انت قلته على المثلث العجيب ده ،<br />و أنا لي إضافة صغيةر ، أو بمعنى أدق تبرير صغير ..<br />بالنسبة للقهوة ، \"هل تعلم\" انها تتكون من 800 مركب !!<br />الشاي على أقصى تقدير بيتكون من 7 مركبات و كذلك معظم المشروبات الأخرى لا تتجاوز الـ25 مركبا ..<br />ده بالإضافة لأن القهوة في نفس ذات الوقت ليها أنواع كتيييييييييييير!!(ده السبب في القهوة التركي و البرازيلي و الاسبريسو و غيرهم)<br />على ضوء المعلومتين الصغيرين دول حاول تحط نفسك مكان بتوع الدراسات \"القهوية\" ، الصراحة انا تعبت لهم<br />، بجد كتير عليهم 800 مركب يقعدوا يعملوا عليهم تحاليل ، و لو مركب واحد بس نسبته اختلفت أو غيرت نوع القهوة هيدويلك كل أبحاثك في الباي باي!!<br />موضوع بجد تحفة يا محمد يا فاروق ، و شد حيلك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113045/http://www.20at.com/article2.php?sid=238"

