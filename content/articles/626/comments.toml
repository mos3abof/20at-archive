subject = "القهوة اه"
author = "دودو"
posted = "2006-03-13"
text = "دائما عندما اكون بجانب مطحن للقهوه بقف شويه لانى بحب رائحتها جدا بس رغم كده لا اشرب قهوة الا نادرا وعلى فكرة عايزةاضيف معلومه وهى بما ان القهوه من المنبهات التى تحفز وتنشط مراكز الزاكرة بالمخ فهناك ما يقال ان من يمارس اى نشاط زهنى اثناء تناوله للمنبهات(القهوه) لاتستعيد الزاكره كامله الا بتناول المنبهات يعنى الى بيزاكر وهوه شارب قهوه مثلا ميعرفش يرجع كل الى زاكره الا لما يشرب قهوة وبالنسبة للشيكولاتة فبموت فيها بس بحاول اقلل منها علشان الرجيم وبرضه هناك ما يقال ان الشيكولاته بتخلى الاطفال عصبين وتزيد من نوبات الغضب عند الاطفال . اما المحمول فهو ضرورى جدا جدا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113045/http://www.20at.com/article2.php?sid=238"

