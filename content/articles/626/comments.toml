[[comments]]
order = 12
subject = "اول تجربه"
author = "أرجوان"
posted = "2006-02-04"
text = "فاكره اول يوم شربت فيه قهوه فى حياتى...كانت فهوه ساده بعيد عن السامعين قصدى القارين...كانت نفسيوتى فى الحضيض يومها..و كنت راجعه من الكليه تخيلوا عديت على كافتريا عمرى ما تخيلت انى اروح كفتريا...كان اخرى مطعم فول و طعميه بتاع البغل..<br />المهم طلبت قهوه و ساده...الراجل بصلى شظرا و قالى عندنا سكر و الله<br />قلتلوا بس انا عايزاها ساده..<br />و شربت من هنا و عينك ما تشوف الا النور..<br />الدنيا لفت و اخضرت و اصفرت...و فى الاخر اسودت خالص بقى<br />خلصت ربع الفنجان بالعافيه عشان احلل الفلوس الى اندفعت و روحت البيت..<br />و رحت اتخمد...ان عينى تقفل...مافيش..إنسى.<br />فضلت بالظبط 24 ساعه صحيان متواصل.<br />و بعدها بقى خلاص اتعودت و بقت ادمان ايام الامتحانات<br />و جالى هبوط منها و راح الحمد لله و دمى نشف بس عادى برضو<br />انا بقى بحب الناسكفيه و الكابتشينو اكتر من القهوه.<br />بس تعرفوا قهوة مصر تحويجتها موش حلوه....اشربوا قهوه اليمن و البرازيل.<br />بس الى بجد موش الى بتتعمل هنا فى مصر.<br />مش من هواة الشوكلاته انا و خصوصا كوفرتينا الخنقه..تحس انك بتاكل زبده موش شوكلاته...ياااااى.<br />المحمول بقى...عليه العوض و منو العوض...اتسرق قريب الحمد لله...و لسه ما جبتش واحد..و ماليش عين اطلب اصلا...الاولانى الله يرحمه ما كملش معايا شهر<br />يلا كله نصيب.<br />طولت...رخمت اه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113045/http://www.20at.com/article2.php?sid=238"

