subject = "انا كمان عايش فى الكويت الصفر الكبير ( مصطفى الصفر"
text = "اخى الفاضل اشكرك جدا على المقال الجميل<br />واعتقد انك ساعدت فى اضافه علم جديد يسمى السياسه المحاسبيه او السياسه الرياضيه واتمنى من الساده القائمين على التعليم فى مصر ان يقوموا بتدريسه للطلبه التى اكتظت عقولهم بالمعلومات التافهه التى تحاول الوزاره تثبيتها فى عقولهم والحمد لله نجحوا او بدلا من تعليم الطلبه كيفيه عمل الماكولات الشهيه وبدلا من تعليم البنات ماهو الجنس لكن بالطريقه الحديثه وليست العلميه انشاهد وزير التعليم الكبير<br />ووزير التعليم الصغير بالانتباه الى ذلك وفى النهايه وحشانى يامصر يااعظم صفر فى الوجود"
