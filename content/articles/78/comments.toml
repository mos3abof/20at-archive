text = "التاريخ كالحيطة المايلة..إذا استندت عليه \"فقط\" فلن تجد سوي سراب وأطلال تعبث فيها الرياح..فهذه النغمة التاريخية مشاكلها لا تحصي..يكفي تخدير الناس بأنك مطمئن وأنك آمن وقديم وصاحب خبرة..لأنك من زمان.. ووقت الجد إحنا ناس تعجبك أوي..فقط لمجرد أنك قديم وعندك رصيد طويييل – تقال دائماً بإضافة 3 ياء – من الأعمال العظيمة..وإذا قلت أن العظمة لله وحده..يقال أنك إرهابي..وإذا قلت أن دوام الحال من المحال..وأن الحياة تتغير والكبير بيصغر والصغير بيكبر يقولك أنته مين أنتي يا تافه.. أنته صفر علي الشمال..لا تسوي شئ.!!<br />ياحبيبتي ياصفر ياصفر"
