subject = "ٍسيادة المحافظ"
text = "بصراحة انتم حرقتوا دمي...<br />الأجيال الجديدة المزعجة<br />إلا مش انتوا برده يا جدعان اللي رحتوا حفلة منير؟<br />ومش انتوا برده يا اسطوات اللي لما بيجيبوكم في التليفزيون بتقولوا نشكر مدير الأمن؟<br />ومش انتوا اللي في الهيصة والزايطة؟ ....<br />ولا انتوا الناس التانيين ؟ ...<br />أنا مش عايز يبقى دمي تقيل عليكم ... لكن يا شباب بجد بجد بصوا في نفسكم ... كل واحد بيتفرج على نانسي بيشجعها وبيكون صفر.. كل واحد بيتصل باتصل الآن بيشجعهم وبيكون صفر كل واحد مقضيها وولا على باله بيكون صفر الصفر..<br />بقولكم ايه انا دمي بقى تقيل لكن يللا حكم السن بقى<br />في الآخر عايز أقول لكم كلمة واحدة<br />إخص إخص إخص<br />وربنا يستر"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616094226/http://www.20at.com:80/article.php?sid=239"

