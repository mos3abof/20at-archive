[[comments]]
order = 17
subject = "0000"
text = "الصفر المتين . ايقظ المصريين<br />كيف سخر البسطاء من \" خيبة \" تنظيم المونديال؟<br />محمود التميمي / انفض المولد .. وخرجت مصر منه بلا حمص .. او أي نوع اخر من انواع البقوليات .. فقط لا غير خرجت مصر ببعض من علقم الهزائم الذي بات ضيفا يوميا على موائد المصريين والذين رفعوا اعلام المونديال المأمول .. و رقصوا حول هرم من ورق اقامته وزارة \" المونديال\" كتتويج لجهود دعم \" الملف\" ..و لكن الملف .. \" لف .. لف\" ورجع لنا تاني .. و لم يقبل به احد و جائت نتيجتنا لتعبر عن خيبتنا.<br />. الصفر المتين انهى احلام المصريين .. ليستيقظوا على مشهد \" بلاتر\" وهو\" يخرج\" لنا .. البطاقه التي حملت اسم جنوب افريقيا من المظروف الانيق بعد ان \" فض \" الشمع \" الاحمر \" الذي يضمن عدم التلاعب بمحتوبات المظروف<br />ثم ليعلن بعد ذلك ان احدا لم يصوت لمصر .. حتى التونسي و القطري لم يصوتا لأم الدنيا .. صاحبة السبعة الاف سنه حضاره .. و لكن السبعة الاف سنه لم تفلح في الصمود سبعة دقائق امام جنوب افريقيا.. و اختلطت دموع الفرح الجنوب افريقيه بدموع الحسره المصريه .. و ضحك البعض الما و بكى البعض الاخر فرحا ..و باتت السخرية المره عنوان المشهد .. فقال احدهم : \" انتم عارفين الوزير أخد معاه العيل الصغير ليه؟ .. عشان يعيط و يشد بلاتر من رجل البنطلون .. و يقول له والنبي يا عم خلونا ننظم كاس العالم.. الهي امك تحج يا رب \" و كان سيقولها بالخمس لغات التي يجيدها طبعا ..<br />و اخر راح يرسم ملامح المشهد الهزلي في زيورخ متعجبا من عدم اعتراض أي من اعضاء الوفد المصري على النتيجه المزريه ..فلقد كان من الواجب على احد النابهين – والوفد كان كله نابهين والحمد لله - ان يفعل مثل محمد رضا في مسرحية \" السكرتير الفني \" حينما اعترض على نتيجة ابنه الذي حصل على\" صفرواحد بس \" طيب مش كانت الفيفا تراعي ربنا وتخليهم صفرين .. هو ايه مبقاش في خشا ولا حيا<br />و اخر من جماهير الشعب المطحون \" بس مثقف شويتين \" راح يؤكد ان في الامر ملعوب وان الملف المصري لا يدانيه ملف كما اكدت الحكومه .. و ان جنوب افريقيا فيها ايدز و عصابات وان المغرب فيها ارهاب .. و الحمد لله مصر لافيها ايدز ولا عصابات ولا ارهاب .. اذن لماذا لم يصوت لنا أي ابن حلال في اللجنه ؟! انها مؤامره على مصر قلب \" الشرق الاوسط النابض\" و صاحبة\" العلاقات المميزه\" مع الولايات المتحده الامريكيه .. وراعية\" الاعتدال\" في المنطقه .. و \" الوسيط النزيه بين \"الفلسطيننين \" و \" الاسرائيليين \" الذي لا يملك مصلحه مع أي من الاطراف المتحاربه ..او المتنازعه.. مصر الانجازات وتوشكى و \" ترعة السلام \" والنايل سات .. و الاهرام الورق والعشرين مليون رساله تأييد للـ\" الملف\".. و بعد كل ذلك لا نجد واحد يوحد ربه يحترم قدراتنا الخارقه و يصوت لمصر.. انها المؤامرات قاتلها الله تحاك ضد \" الملف \" حماه الله و لكن الحرب سجال .. وان كنا خسرنا معركه فالحرب مخلصتش .. و كلها تلاتين سنه ونعمل ملف اجدع من الملف الاولاني .. و سيبك يا مصر من مونديال 2010 .. و انشاء الله وزارة \" المونديال \" هتخليكي تنظمي سيد سيده .. بس انتي اتجدعني كده وخليكي على طريق الاعتدال والسير بجانب الحائط وعدم الطموح الى قيادة الاقليم او القاره او حتى التدخل لمنع ما يحاك لكي من مؤامرات ..<br />و لكن في الامر فوائد و ميزات .. فلقد اخذ المصريون عبره و عرفوا ان ليس كل ما يلمع ذهبا .. بدليل ما حدث .. وان التصريحات اياها تثبت كل يوم انها كعهدنا بها .. و كم كانت النكته لازعه حينما صرخ احدهم في ابنه طالب الثانويه العامه بعد اعلان نتيجه المونديال محذرا اياه من السهر حتى الصباح للمذاكره قائلا:\" كل يوم تسهر للصبح وتقولي بذاكر يا بابا .. حجيب مجموع يا بابا .. و انت تلاقيك زي ملف مصر لا ذاكرت ولا نيلت وفي الاخر هتجيب الصفر \"<br />انه احد اوجه الحصاد وليس في الامر لا مؤامره ولا من يحزنون .. حصاد مر .. لواقع منحط ..ان مصر التي تستطيع تنظيم المونديال يا ساده .. هي مصر التي تستطيع اطعام شعبها وحماية مستقبل ابنائها .. و الضرب على ايدي سراقها .. و التأثير في محيطها .. و تعليم الحضاره لجيرانها.. و مصر بهذه المواصفات ليست متوفره الان..لانها قد تكون مغلقه او خارج نطاق الخدمه ."
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616094226/http://www.20at.com:80/article.php?sid=239"

