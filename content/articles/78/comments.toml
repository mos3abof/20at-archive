text = "يعني يا أخ أنت شفت أبو حطب ومشفتش الأخ اللي جنبه؟<br />هو ايه عشان كتب له مقال هتقعدوا بقى تطلعوه السما وكدة...<br />المقال حلو مقلناش حاجة ... لكن برده الرحمة حلوة<br />عيب يا إخوانا ده احنا برده كنا جنبه وقاعدين بالصلاة ع النبي منورين في نفس البرنامج.. حتى كنا مطقمين بدلة زيتي إنما إيه...<br />وبعدين من مقالة يعمل كدة..<br />واحنا يا ولداه نازلين فحت وردم مقالات ولا حد عبرنا ولا قال مشيطنين ولا دياولو<br />على رأي الأخ الفاضل سيادة المحافظ<br />إخص إخص<br />إخص"
