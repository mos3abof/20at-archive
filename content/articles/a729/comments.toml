[[comments]]
order = 0
subject = "واحده شامه"
text = "دائما عشرينات مواضيعها سحابات ممطرة بالخير<br />بس المرة دي سحابه يا لطيف سوده"
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109043106/http://www.20at.com:80/article.php?sid=729"

[[comments]]
order = 1
subject = "طارق"
text = "بحبك يا عشرينات وبحب موضوعاتكم الجامدة<br />ربنا يكرمك جميعا"
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109043106/http://www.20at.com:80/article.php?sid=729"

[[comments]]
order = 2
subject = "الي عشرينات"
text = "فيه وجه تشابه بينكم يا عشرينات وبين السحابة السودا<br />انتم الاتنين فيكم كثافة وغزارة ويصعب مقاومتكم<br />كل الفرق انها سحابة سودا كريهة<br />وانتم سحابة اليكترونية ناصعة البياض<br />تستحق خالص التقدير والإحترام"
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109043106/http://www.20at.com:80/article.php?sid=729"

[[comments]]
order = 3
subject = "وسام كمال"
text = "أول مرة أعرف إن هناك علاقة<br />بين قوة حاسة الشم<br />وبين خفة الدم!"
archived = "2004-11-09"
capture_url = "https://web.archive.org/web/20041109043106/http://www.20at.com:80/article.php?sid=729"
