subject = "تعليق علي التعليقات"
author = "شيماء"
posted = "2006-11-19"
text = "السلام عليكم و رحمة الله و بركاتة<br />تعليق لابن بهية:-<br />دا بعدك ( دة رد الحكومة علي اقتراحك)<br />تعليق للاخ الي مذكرش اسمة:-<br />الكلام الي بتقولة دة لو مشينا علي منهج النبي لكن احنا حاليا ماشيين علي منج حوحو و سوزو و جومو و عولو و زوجاتهم و انجالهم الله يخرب بيتهم"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095500/http://masr.20at.com:80/article.php?sid=1176"

