subject = "بصو في الصورة"
author = "مستحيل اختيار الصورة يكون عشوائي وغير مدروس"
posted = "2006-11-20"
text = "القاهرة الاكثر فسادا واخذا للرشوه<br />وبعدين مجمع التحرير لانه به عدد كبير من الموظفين<br />والاهم من دا كله الجامع علشان نبين ان هناك صله بين الرشوه والدين الاسلامي يعني الدين الاسلامي هو سبب ان المسلمين بياخدوا رشاوي.<br />ملعوبة يا ولاد البلد قصدي يا ولاد الكلب"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095500/http://masr.20at.com:80/article.php?sid=1176"

