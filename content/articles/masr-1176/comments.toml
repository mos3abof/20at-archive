[[comments]]
order = 1
subject = "فساد في فساد"
author = "شيماء"
posted = "2006-11-18"
text = "السلام عليكم و رحمة الله و بركاتة<br />الاخت الفاضلة / هبة<br />نشكرك علي توضيح الحقيقة المرة التي نعلمه و لا نعلمها, فكلنا يعلم الفساد و كلنا ايضا يهرب من الفساد.<br />و اعتقد انهم لو شملوا محافظة البحيرة في التقرير لتضاعفت هذه الارقام اضعافا و اضعاف لما تشتهر به المحافظة من رشاوي و وساطة و فساد و يقول البعض ان انتقال اي مسئول كبير للعمل في محافظة البحيرة يعد اعارة داخلية.<br />الفساد هو اول و اخر و اهم مشكلات الشعب المصري و الفساد صار له اشكال متعددة ما بين فساد ديني و اخلاقي و سياسي و اعلامي و ثقافي و تعليمي و صحي و رياضي ....الخ و قد تداخلت دوائر الفساد حتي اصبحنا و كأننا في مغارة علي بابا و اطلت علينا فكرة من الاساس و من التابع البيضة ام الدجاجة من اتي اولا و من تلاه هل الفساد السياسي ادي الي باقي انواع الفساد ام الفساد الديني طيب ايهم يجب ان نتجه لحله اولا.<br />علي اي حال ما استطيع ان اقوله و انا واثقة جدا اننا نعيش اليوم ازمة يجب ان نوجد لها حل في اسرع وقت و الا فسيأتي يوم تأتي فيه خريطة العالم بحدود مرسومة لمصر و بداخل الحدود عبارة \" كان في هنا بلد\"<br />اما الازمة فهي<br />ازمــــــــــــــة ضميــــــــــــــر<br />و شكرا"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095500/http://masr.20at.com:80/article.php?sid=1176"

[[comments]]
order = 2
subject = "نفس التعليق يمشي هنا برضه"
author = "إبن بهية"
posted = "2006-11-18"
text = "يا خرابي .. يا لهوووي .. كل ده ؟؟؟ دي عبارات ممكن نسمعها من حبايبنا النايمين في العسل وبيقروا جرايد الحكومة وبيتفرجوا على تليفزيون عمو صفوت (أيوه مازال تليفزيونه حتى لو رحل .. وفاء منا يا أخي .. انته مالك؟) طبعاً قضية كل دقيقتين دي والخمسين مليار ده كله في الهجايص .. يعني ده اللي ظاهر للعيان والعميان وما خفي في بطن الحوت أفظع وأنكى .. طبعاً الحوت (حسونة بركوته) اللي بيصرح قال ويقولك سيحاسب ويعمل وينيل .. يا عم اتلهي حاسب نفسك انته الأول وقلنا المليارات اللي متربع بيها إنته وعيلتك دي في تصنيف أغنى أثرياء العالم جاتلك منين ؟؟؟ من المعاش اللي سابهولك عم مبارك كاتب المحكمة أبوك يا واطي ؟؟؟ وجدو يا جيمي .. أظن مش محتاج يا جيمي تعمل الحبتين بتوعك دول للناس عشان تحسسهم إنك واحد منهم .. يعني بلاها سواقة العربية في مصر الجديدة والوقوف في إشارات المرور زي الغلابة .. بلاش يا بني أحسن ولد من أولاد بهية يهفك عيار يجيب أجلك .. أنا مش خايف عليك طبعا حشا وكلا .. أنا بس خايف على الولد الغلبان اللي هيطخك أحسن يحسبوك عليه راجل .. قصده .. كفاية يا جيمي تعرف الناس بتاريخ جدك الطويل في النضال أمام المحاكم لكتابة عرض حال دمغة بقرش صاغ لأي واحدة عايزة نفقة ولا طلاق .. ولا أبوك الواطي ما بيجيبش سيرة جدو قدامك خالص ؟؟؟ طبيعي لأنه واطي وناسي أصله ..<br />بقى بذمة المسلمين والنصاري واليهود وحتى السيخ والهندوس وعبدة أبوالهول والهرم حد يصدق أن حسني الواطي إبن عم مبارك كاتب المحكمة العدمان الغلبان اللي كان بيكمل عشاه نوم يبقى معاه المليارات دي ؟؟؟ طيب منين ؟؟؟ من مرتبك يا واطي ؟؟؟ فهمنا منين .. لا عيلة ورثتها ولا شركة سابهالك الوالد ولا حتى كشك بيبيع خرده زي أحمد عز اللي عايز يفهمنا رغم أنف العالم أن مليارات<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095500/http://masr.20at.com:80/article.php?sid=1176"

[[comments]]
order = 3
subject = "حاجة تكسف"
author = "انسان"
posted = "2006-11-19"
text = "مصر من أكبر الدول في طلب الرشوة<br />بالذمة دي مش حاجة تكسف<br />كلو عاوز رشوة ..طب نجيب من فين<br />حتى عسكري المرور بيشحت وبيوقف لك عالوحده عشان تقولو خد ياعم وخلينا نميشي<br />لما ياخد المعلوم يقول لك نهارك اشطه<br />بجاحة وقلة حيا<br />ناقص أيه ياخونا.. يطلعونا في موسوعة الارقام القياسية..أكبر دولة فيها رشاوي"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095500/http://masr.20at.com:80/article.php?sid=1176"

[[comments]]
order = 4
subject = "يا هبه ربيع"
author = "يا هبه ربيع"
posted = "2006-11-19"
text = "يا هبه ربيع احنا مش قلنا قبل كده لما نكتب عن مشكلة ونعرض مشكلة لازم نقول حل المشكلةايه ما نعرضش المشكلة ونسيب الناس تشتم وتهوهو (هو يعني السب والشتم حيفيد بأيه)<br />وانا قلت قبل كده ان اللي بيحصل دا بسبب البعد عن منهج النبي محمد صلى الله عليه وسلم وللخلاص من هذا مفيش غير اتباع منهج النبي صلى الله عليه وسلم لان النبي محمد صلى الله عليه وسلم كان ليه بلد مثلنا تماما بلده اسمها جزيرة العرب<br />ويستلزم هنا قراءة حال جزيرة العرب قبل البعثة المحمدية<br />وبعدين بعث الله فيهم النبي محمد خاتم الانبياء والمرسلين<br />يستلزم هنا قراءة السيرة النبوية<br />وبعد انتهاء مهمة النبي محمد صلى الله عليه وسلم لازم نقرأ عن حال الجزيرة العربية وتاريخ الخلفاء بعد النبي محمد علشان خاطر نعرف كيف غير النبي محمد صلى الله عليه وسلم هؤلاء الهمج الذين لا ماضي لهم ولا حاضر ولا مستقبل الى خير امة اخرجت للناس.<br />واحنا برضه المصريين نفس الحكاية لو اتبعنا منهج النبي محمد صلى الله عليه وسلم حنرجع تاني خير امة اخرجت للناس واتحدى بس بشرط ان كل الامة المصرية تصوت لصالح منهج النبي وتمشي على منهج النبي.<br />قد اسمعت لو ناديت حيا"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095500/http://masr.20at.com:80/article.php?sid=1176"

[[comments]]
