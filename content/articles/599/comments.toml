[[comments]]
order = 6
subject = "حل ازمة التدريس"
author = "كيرلس"
posted = "2006-10-07"
text = "ايها الساده الأفاضل اتقدم اليكم بحل نهائى لأزمة التدريس وهو الحل الأمثل الذى سيوفر على الدولة مئات الألاف بل الملايين من المبالغ الطائله فى بناء المدارس ومرتبات المدرسين وخلافه، كما انه سيرحمنا نحن اولياء الأمور من مصايب وبلاوى انتقال الأولاد خلال السنه الدراسيه من انتقالات ومتابعات ودروس خصوصيه وخلافه كما سيخفف الضغط على حركة المرور ..ذلك الحل هو....................<br />(( الغــــــــاء المدارس))<br />خلوا بالكم بقول الغاء المدارس وليس الغاءالتعليم....وقبل ما حد يفكر يتهمنى بالجنان ..عايز اقول لحضراتكم ان فيه حاجه دلوقت اسمها نت...وفضائيات...ليه مايكونش التعليم عن طريقهم؟؟؟حتقولى اللى عنده خمس اولاد يعمل ايه..عادى جدا اللى بيتابع على الفضائييات يتابع ..واللى على النت يتابع..ومش حيكون كله طبعا فى وقت واحد...وحتى لو كان فى كل بيت اتنين كمبيوتر واتنين تليفزيون ارحم مليون مره من اللى احنا بنشوفه....على الأقل يكون دا لمرحلةاعدادى وثانوى اللى همه اخطر مراحل...وساعتها الطالب حيقدر يسجل الدرس وهوه بيسمع ويقدر يرجعله فى وقت لاحق...وبدل الكتب يبقى فيهcd لكل مرحله ساعتها مدرس واحد لكل ماده حيسجل للمرحله بحالها..بدل ازمة المدرسين اللى غايب علشان شغال على تاكس واللى عندها ساعه رضاعه واللى بتولد ..واللى موقف الألفه ع الفصل ومعرفش راح فين والعيال مطلوقه فى حوش المدرسه والا نطواالسور ان كان فيه سور وف السيبر اللى جنب المدرسه دا يعنى ابسط الأمور!!!!!!!اما حصص العملى ممكن يكون لها يوم فى الأسبوع ..دالو فرضنا ان فيه معدات وفيه عملى فعلا؟؟....صحيح المسئوليه كلها حتكون على اولياء الأمور فى متابعة اولادنا بس والله العظيم ارحم الف مره من اللى بنشوفه.......وخدو الحكمه من افواه المجانين....بس ارحمونا<br />كيرلس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112725/http://www.20at.com/article2.php?sid=1234"

[[comments]]
order = 7
subject = "الله يرخم مدرسين زمان"
author = "كيرلس"
posted = "2006-10-07"
text = "استكمالا لموضوع الغاء المدارس الموضوع دا حيرجعنا للمدرس بتاع زمان اللى مهتم بامكاناته وبمظهره وبدلته وكرفتته وحتخلى المدرس يحط منديل فى جيب الجاكت علشان حيظهر فى التلفزيون قدام الناس او حيكون فى بداية مقدمة ال cd مش جاى المدرسه على عجله ومشمر رجل بنطلون والتانيه غرقانه شحم وزيت او التاكس بتاعه عطل منه فى السكه وجاى يطلع غلبه فى الشوية الغلابه اللى قدامه..دا غير ما حيحضر الدرس كويس وحيبتسم ويلاطف اللى قاعدين قدامه لأنه حيكون على الهوا...مش حي يقول الكلمه قد كده!!!...طبعا معروف...كمان الحكايه دى حترحم المدرسين من تصحيح الكراسات وحتوقف الأحراج اللى كانوا بيتعرضوله والولد جاي بالكراسه كلها صح بالأحمر..ولأن اللى صحح الكراسه الأولاد الشطار الى فى الفصل او حد من الجيران.. تقرى وتشوف العجب العجاب ان كان فى العربى والا الحساب ..اما الأنجليزى دا بقى استغفر الله العظيم ما حدش يجيب سيرته خالص..والا نجيب هوه فيه حد عارف حاجه..<br />ياريت تعملوا بالحكايه دى ونشوف فى يوم من الأيام ولادنا قاعدين على مكتب نضيف نقدملهم سندوتش وكباية شاى والولد او البنت حاطط السماعات فى ودانه وماسك الماوس فى ايده..وبيخطط تحت الحاجات المهمه بالأحمر...وبيسجل لنفسه بالكاميرا على الشاشه ..علشان يبقى هوه المدرس والتلميذ فى وقت واحد...يالا...ماهو الجعان بيحلم بسوق العيش...وانا والله ميت من الجوع ...جوع الرغبه والأمانى انى اشوف بلدى وولاد بلدى والأجيال اللى طالعه دى بالصوره اللى يستحقوها...احنا احسن شعب ..واطيب شعب...واذكى شعب وانشاء الله يتحقق حلمنا..من عندنا طه حسين ..والعقاد..وقاسم امين وعلى امين..ونجيب محفوظ.....وزويل ...ونوابغ عظام...اتخرجو من على الطبليه واللمبه الجاز...ما بالك لما نوصل للمستوى دا...وحنوصل انشاء الله<br />كيرلس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112725/http://www.20at.com/article2.php?sid=1234"
