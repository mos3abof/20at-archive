text = "أول مرة أدخل سينما مع والدي وأخي الصغير وكان الفيلم هو فيلم المنسي كانت لدي فكرة مسبقة عن دور العرض ولكن بصراحة لم اشعر بإختلاف هائل بين القاعة والمنزل لكن مع أول فيلم أجنبي يحوي المؤثرات والمتفجرات حسيت بالفرق وأفضل الذهاب للسينما وحدي ولا أدري لماذا<br />شكرا لكم"
