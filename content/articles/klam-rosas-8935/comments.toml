author = "نا من عشاق نذار قباني لانه اعطي المراه بعضا من حقوقها التي ابتلعتها العقليه الشرقيه المتخلفه وانكرتها التقاليد المتهالكه الباليه لذا كانت المراه مهمشه و مرزله وحاول نذار الفنان ذو الحس المرهف ان يسد الدين تجاه هذا المخلوق الرائع الذي اظنه احدي هبات الاله للناس بل و اعظمها ونحن الان لا نعترف لا بحقيقة المراه ولا باحقيتها في الحياه ....ايتها المراه لا تخافي فان كان قد رحل نذار لكن تلاميذه لم يرحلوا بعد لذا اتمني ان ستكمل ما بداه نذار ولكل امراه في العالم لك كل الحب"
text = "ماركو صبري<br />مصر المنشاه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143004/http://www.20at.com/article.php?sid=1261"

