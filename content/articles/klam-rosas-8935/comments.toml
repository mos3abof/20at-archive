[[comments]]
order = 7
subject = ""
author = "نيفين نيفى نوفا"
posted = "2008-05-07"
text = "هكذا كنت اصف دائمااشعار نزار<br />انها الرسم بالكلمات<br />ان تشم رائحه الكلمه و تسمع صوتها وتراها تتحرك امامك و انت تقرا القصيده<br />لسه فاكره اليوم اللى سمعت فيه خبر وفاه نزار و كانه كان امبارح<br />لما اخبرنى احد اقاربى الخبر بصوره غريبه<br />لقيته بيقوللى حبيبك مات انهارده يا ستى عموما الله يرحمه<br />فقلت له تقصد مين فقاللى نزار قبانى و الله كان شاعر كويس<br />و ساعتها ضحكت و قلتله حضرتك جاى تقوللى كدبه ابريل مش فى ميعادها خالص<br />و بعد كلام كتير لقيتنى بقولله الله يخليك قوللى الحقيقه انت بتهزر و لا بتتكلم بجد<br />و كانت تاصاعقه و الباقى معروف لكل عشاق نزار<br />بكاء ثم بكاء ثم بكاء<br />رحم الله نزار و رحم الشعر العربى"
archived = "2009-05-09"
capture_url = "https://web.archive.org/web/20090509190931/http://www.20at.com:80/klam-rosas/8935.html"

[[comments]]
order = 8
subject = ""
author = "رائد بغدادي"
posted = "2008-05-22"
text = "يقول نزار قباني رحمه الله في مقدمة ديوان الاعمال السياسية الكاملة …<br />لأنني لاأمسح الغبار عن أحذية القياصرة<br />لأنني لاأقاوم الطاعون في مدينتي المحاصرة<br />لأن شعري كله ..<br />حرب على المغول .. والتتار .. والبرابرة<br />يشتمني الأقزام والسماسره..<br />أسألكم بالله وأليس هذا الشاعر هو الذي مرغ وجوه من باع هذه الأمة في الوحل علنا وفضح من باعها ايام الن[ *** ]ة وبكى على هوامشها زمردا حتى منع من دخول مصر ثم دخلها بأذن عبد الناصر ..أوليس هو من قال عن الوحدة العربية<br />لو أننا لم ندفن الوحدة في التراب<br />لو لم نمزق جسمها الطري بالحراب<br />لو بقيت في داخل العيون والاهداب<br />لما استباحت لحمنا الكلاب<br />وانظروا اليوم في حال الامة استباح دمها وهتك عرضها البارحة كانت القدس واليوم ضاعت بغداد ولاندي دور من غدا<br />على العموم العاقل يفهم بالاشارة ولا اريد ان اطيل في التعليق ولكن كما قلتها سابقا شكرا لدعاء الشامي فاليوم اشكر محمد المصطفى واقول له هيهات بين قارىء الامس وقارىء اليوم ."
archived = "2009-05-09"
capture_url = "https://web.archive.org/web/20090509190931/http://www.20at.com:80/klam-rosas/8935.html"
