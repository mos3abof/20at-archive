[[comments]]
order = 13
subject = "العماله فى الخليج"
author = "ادهم"
posted = "2006-07-15"
text = "للاستاذ اللى قال ان العماله فى الخليج بتعانى من نفس المشكله<br />يا استاذى العماله اللى فى الخليج هى اللى عملت الخليج من الستينيات<br />يعنى الخليج كان صحرا فالمصريين راح هناك اشتغلوا و طلع عينيهم و بقى الخليج زى مانت شايف دلوقتى<br />كمان المصريين اللى بيشتغلوا هناك يا محترم مرتباتهم لا تقارن باصغر موظف من اهل البلد<br />ناهيك عن التفرقه فى المعامله اللى بينالها المصرى من كل- الاخوه الاشقاء - العرب<br />انما المحاسب فى مصر لم بيتخرج مابياخدش 750 بتاعة الاخ السيريلانكى - صاحب الخبره فى مسح الحمامات -<br />و حسبنا الله و نعم الوكسل فى اللى رخص العماله المصريه فى الداخل و الخارج"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025213/http://masr.20at.com:80/article.php?sid=654"

