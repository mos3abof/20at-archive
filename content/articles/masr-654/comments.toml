[[comments]]
order = 27
subject = "شكرا لعادل"
author = "أبو عمرو"
posted = "2006-07-21"
text = "أولا : أعتذر للإطالة<br />ثانيا: إحنا معندناش بطالة إحنا عندنا حاجات ثانية كثير وكلامى مش نظرى كلامى عملى 100%<br />منذ سنوات و أنا بأعمل إعلانات أطلب عمال وشباب يتعلم حرفة ويأخذ 300 جنيه يتم زيادة راتبه بمجرد إتقانه للعمل .. وجدنا أن معظم الشباب لا يرغب فى التعليم ويفضل أن يكون فرد أمن مثلا يجلس بجوار الباب طول النهار أو الليل أو يفضل عمل على مكتب.<br />هذه مشكلة العاملين فى الصناعة فى بلدنا.<br />شبابنا مستعجل دون أى مؤهلات أو خبرة وبعد حصوله على العمل يبحث عن المبررات لعدم إجادته أو إضاعة الوقت .<br />النموذج المطروح أمامكم وهو (عادل) بالتأكيد لأصحاب العمل أرخص من العامل المصرى لأن التجربة المصرية تقول أن العامل المصرى أرخص لكن داخل مصر أدؤه أقل بلإضافة لإحتياجنا لملاحظ لكل عدد صغير من العمال ومشرف لكل مجموعة ملاحظين وكومنادة للمشرفين ورئيس وردية ........ كفاية كده .. الخلاصة إحنا عايزين شباب جاد وحاسس بالمسئولية وعارف أن تفريغ دماغ شبابنا هدف ومطلب غربى وبالتبعية أصبح مطلب قومى ...<br />الجاد فى العمل يترك وسيلة إتصال حتى أكون أول الجادين فى محاولة تفعيل دور هذا الموقع بوجود حللول للقضايا المثارة,"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025213/http://masr.20at.com:80/article.php?sid=654"

[[comments]]
