author = "د.عبدالله"
posted = "2006-07-21"
text = "لا عيب فيما حصل ولكن العيب فينا مين يرضى يعمل فى تنظيف الحمامات وكارفور ادارة فرنسية ومشهورة بالظبط والربط ولا مجال لمعلش فيها لذا فالاخوة الاسويين مشهورين بحاضر ونعم ونحن اولاد فرعون مشهورين بمعلش ولمؤخذة يا باشا . فلا وجه مقارنة لهذه الاعمال الهامشية ولكن بتانسبة للمعاش الشهرى تفتكر كام حياخذ هذا الاسيوى غير ذلك لانه يحسبها بالعملة بتاعته المهم لكى الله يا مصر مبارك ."
