[[comments]]
order = 16
subject = "بو الكراتين بلاع عيور الجراذين"
author = "أبو شعيب الكويتي"
posted = "2006-07-15"
text = "ماقلت المصري حمار بن بغل بن جاحد نعمة وخنزير؟ ترى ماقصرت بوشعيب عافاك! إسمع ود الكراتين ومادري شلون، حنا الأمريكان وغير الأمريكان نستأجرهم ونقولهم تعالوا يجون ركض ويقولون\"يس سير أني أوردز؟\". لما نستغنى عنهم ترى نفنشهم ونبعتهم ديارهم. لكن الأن محتاجين لوجودهم، لكن شنوا حاجتكم إنتوا للأمريكان ولإسرائيل؟ بلادكم ما كلها قواعد أمريكية إسرائيلية؟ همه يجرون وراكم وإلا إنتم ياخير أجناد الأرض؟ شايف حكومتكم تبوس بساطيلهم بكل ثانية، وحكومتكم أكبر حامي لحدود إسرائيل وهي معرص وقواد التطبيع مو الكويت. الكويت ملو سالفة مع العرب حنا لا نريد العرب وإن تبون وتريدون ولا الإسلام. مصري+تبجح=نفاق. حرروا بلدكم أولا من اليهود الحاكمينكم أبناء عاهرات مجوس."
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025213/http://masr.20at.com:80/article.php?sid=654"

