text = "أنت لما رديت على الأخ الكويتي وهو عبارة عن شخص واحدغير مهذب من ملايين الشعب الخليجي الي بحب مصر , بألفاض جارحة وعبارات مالهاش داعي , لو بس رديت علية وقلت له الله يسامحك وكل واحد يعرف مقدار نفسة كان أحسن ومحدش هيزعل ولاحجرح الشعب الخليجي البطل الذي عاش سنوات يصارع الطبيعة عشان يلاقي شىء يعيش به ."
