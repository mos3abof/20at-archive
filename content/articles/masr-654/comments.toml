[[comments]]
order = 35
subject = "حاجة تزود الهم والغم والحزن والقرف"
author = "المهتم بالامر"
posted = "2006-08-02"
text = "مش عارف أحنا ليه بنتشاتم الكويتى والمصرى والفلسطينى ولو دورنا على الحقائق حتلاقى أن الموقف الرسمى حاجة مختلفة تماما عن الموقف الشعبى والدليل المظاهرات اللى مالية البلد.<br />ياعم الاخ الكويتى مصر اللى بتتكلم عنها دى غير مصر الشعب الصامد الساكت المغلوب على أمره والمكبل بقانون الطوارىء،واكيد الكويت اللى بيتكلم عنها أخويا المصرى هى الكويت بس الجانب الرسمى الممثل فى الحكومة،وماتنساش أن كان فيه اخوة شرفاء فى الكويت هاجموا بعض الوحدات العسكرية الامريكية وكانوا لرافضين للوجود الاجنبى على ارض الكويت.<br />وفلسطين الحقيقية مش فلسطين أبو مازن ودحلان وشعث لا طبعا .<br />المهم بلاش ناكل فى بعض علشان الدنيا كلها نازلة فينا اكل فمش ناقصة كمان ناكل أحنا فى بعضنا.<br />ومتهيألى نفوق أحسن فى الاخر كلنا عرب والدائرة علينا علينا علينا"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025213/http://masr.20at.com:80/article.php?sid=654"

