[[comments]]
order = 29
subject = "ايه الغلب اللى فى الصورة دة"
author = "الجزار"
posted = "2006-07-21"
text = "العمل عبادة ومن الاخر كدة لو واحد مصرى مش هيرضى يشتغل الشغلانه دى احنا مش فالحين غير أننا نشتغل فى الزفت برة<br />وكمان الاخ عادل مهما كانت جنسيته فهومسلم وكمان سا شباب انا لما شفت الصورة عيطت<br />أنتوا مش حاسيين بمقدار الحزن اللى فى الصورة ولا ايه<br />متنسوس انه متغرب وبيمسح حمامات علشان ياكل عيش<br />ياجدعان ركزوا فى الحزن اللى عنيه وشوفوا مقاله زى دى ممكن تخرب بيته<br />الاخ اللى كاتب المقاله ميرضاش ان حد يشهر بواحد من أهله بالشكل دة<br />والايام دول"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025213/http://masr.20at.com:80/article.php?sid=654"

