subject = "صلوا على النبى"
author = "مصرية"
posted = "2006-07-27"
text = "لا بجد حاجة تفرح الله اكبر بجد مافيش فايدة قاعدين بتشتموا فى بعض لا حاجة تفرح يا جماعة لازم تعرفوا انى شعب مصر شعب اصيل وبعدين انتوا ليه تردوا على الاخ ابوشعيب وتركبوا نفسكوا ذنوب ليه يعنى لما واحد يتكلم قوله الله يسامحك لانى مصر اساسا مش محتاجة حد يتكلم عنها لانى مصر عندها تاريخ وحضارة ومصر الفن ومصرام الدنيا حتى لو كانت ضايعة دلوقتى لكن مصرهترجع بعدين محدش يغلط فى مصر لانها اكتر دولة ذكرت فى القران يعنى مصر ارض مباركة زى ارض فلسطين والسعوديةوكل الناس بتحب مصر والناس بتجيلنا من اخر الدنيا علشان يشوفوا الحضارة الفرعونية ومصر هى ارض الامن والامان وجنود مصر خير اجناد الارض يعنى مصر مش محتاجة حد يتكلم عنها لا نها معروفة جدا وبصراحة انا لو لم اكن مصرية لودت ان اكون مصرية على راى مصطفى كامل واناعايزة اعلق على الموضوع المدير بيقول عادل من الخبراء اسال سؤال هو مسح الحمام وتلميع الزجاج محتاج خبرة لا بجد حاجة تفرح"
