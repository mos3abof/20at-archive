[[comments]]
order = 8
subject = "زمار الحي لا يطرب"
author = "مخلص أمين"
posted = "2006-07-14"
text = "الأخ الفاضل كاتب المقال تحية طيبة و بعد . . .<br />أثار مقالك شجوني و حزني و أنا أثق أنه أثار العديد من علامات الأستفهام في ذهن القراء. طبعا لن نتحدث عن الطيور المهاجرة اللي هم المصريين من ذوي الكفائات الذين لم نعيرهم أي أهتمام عندما كانوا بمصر و سد أصحاب الضمائر التالفة الأبواب أمامهم في الحصول علي فرصة عمل شريفة تتناسب مع مؤهلاتهم و قدراتهم. لأنه كما يبدو أن الجماعة أصحاب الضمائر التالفة من أرباب الأعمال أو المسئولين عن توظيف أولادنا و أخوتنا بالحكومة و القطاع العام يرون أن أولادنا غير مؤهلين بالشكل الكافي و قد تسأل ماذا ينقص أولادنا المتعلمين حتي يتأهلوا لتولي الأعمال و سأقول لك أنه ينقصهم ان يفتحوا دماغهم و يهرشوا جيوبهم أو يبحثوا عن واسطة و هذه كلها مفاتيح الجنة المرتقبة التي قد تقودهم الي مرتب لا يتجاوز ثلاثمائة جنيه.<br />و بالطبع الأخ السريلانكي يحمل مؤهلات أعلي من أولادنا ، أعتقد أنه ربما يكون أحد القلائل الحاصلين علي دكتوراه تنظيف المراحيض من أحد الجامعات النظيفة<br />و مع كامل أحترامي له و للجماعة اللي مشغلينه أقول ، أننا نقتل الأمل بداخل أولادنا بأيدينا و حرام علينا أن نقوم بجلب أجانب لتنظيف المراحيض في حين أن أولادنا موجودين و حاصلين علي مؤهلات عليا و منهم الحاصلين علي دراسات عليا و يجلسون بالمنازل و علي المقاهي في أنتظار الفرج.<br />المثل الشعبي يقول \" الزيت إن إحتاجه البيت يحرم علي الجامع \" و ذلك للدلة علي أنتفاع أصحاب الشأن بما لهم طالما كانوا الأولي به و في هذا المقام هم أولادنا الذين يحرمون من العدالة في الحصول علي فرصة عمل بينما تتاح ذات الفرصة للأجانب بدون داعي.<br />ومن الغريب أن عقدة الخواجة توغلت بداخلنا لدرجة إحضار عامل لتنظيف المراحيض من دولة أخري.<br />لي صديق دكتور بالج<br />اقرأ بقية التعليق .."
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025213/http://masr.20at.com:80/article.php?sid=654"

[[comments]]
order = 9
subject = "ع المصطبة تصريحات بنج"
author = "عثمان أبوزيد"
posted = "2006-07-14"
text = "عقد مجلس برلمان المصطبة جلسته الأسبوعية لمناقشة طلب إحاطة من العضو الغلبان حول التصريحات الوردية بالمستقبل الباهر.<br />الرئيس: حضرات الأعضاء معروض علي حضراتكم طلب مناقشة التصريحات الأخيرة اللي بيطلقها المسئولون ابتداء من رئيس الحكومة وانتهاء برئيس القرية واللي كلها تدور حول تشغيل العاطلين حسب برنامج سيادة الرئيس الانتخابي.<br />العضو الفلفوس: حضرات الزملاء موضوع تشغيل العاطلين أصبح موضة اليومين دول وآخر قنبلة ألقاها في هذا المجال سيدي أمين أباظة وزير الزراعة اللي قال فيه:<br />إن الوزارة ستصلح مليون فدان وده حايوفر فرصة عمل لحوالي نص مليون مواطن حسب برنامج سيادة الرئيس الانتخابي، وفي الواقع الموضوع واسع قوي لأن سيدي أمين لم يحدد الوقت اللي حا يتم فيه استصلاح المليون فدان وعلي كل حال الراجل معذور لأن دي من الدعاية اللي بيقوم بيها حزب الحكومة ورجاله.<br />العضو زعيط: يا عالم كفاية ضحك علينا وخلاص فاض بينا الكيل وشبعنا وعود ابتداء من شد الحزام ومروراً بتكليفات سيادة الوزير وتوجيهات سيادة الوزير وأتباعه وهلم جرة.<br />العضو معيط: أنا عاوز أقول إن الناس اللي بتقول هذا الكلام يا إما ناس ساذجة أو فكرين إن إحنا ناس عبيطة وعاوز أقول للمرة المليون إن إحنا ناس بتفهم وما عدش الكلام ده يخش علي عقولنا وكفاية تهريج.<br />العضو النمرود: يا إخواني دي فلسفة إعلامية سياسية بمعني إنهم يفضلوا يكرروا الكلام ده لغاية ما الناس تصدقه ودي اسمها تصاريح حقن بنج والناس تفضل عايشة علي هذا الأمل.<br />العضو نطاط الحيط: يا زملائي إحنا في دولة التوجيهات والتكليفات وأخيراً برامج انتخابات وديل التعلب فات فات علي ديله سبع لفات.<br />الرئيس: يحال الموضوع إلي لجنة الوعود الوردية."
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025213/http://masr.20at.com:80/article.php?sid=654"

