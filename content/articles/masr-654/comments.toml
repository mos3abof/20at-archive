[[comments]]
order = 23
subject = "عندهم حق"
author = "احمد"
posted = "2006-07-16"
text = "بصراحة ادارة كارفور عندهم حق يا جماعة احنا فراعنة و مش بتوع شغل الا في الزنقة فقط يا جماعة عمرك ما تدخل محل وجبات سريعة و تلاقي الحمام نضيف 100% الا وقت الصبح و وقت تغيير الشفت فقط لان البية المسئول عن النظافة مشغول بالتهريج مع الكاشير او بمحاولة استجداء اي بقشيش شوفوا الشوارع في مصر بمنتهي القذارة لان البهوات الكناسين مصريين علي عدم العمل الاجنب العربيات اللي بتركن علشان ياخذوا اي بقشيش يا جماعة احنا عايزين نتربي علي حب الشغل للشغل فقط حتي البلد لما مسكها شوية عساكر لم يكن عندهم اصل او فصل خربوها لان كل همهم البقشيش من العرب و ماما امريكا.و اوعي حد يقولي شهادات عاليا او واطية لان احنا بجد عندنا بطالة مقننعة بسبب فساد نظام التعليم اللي وضعة اللي ما ينسمي"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025213/http://masr.20at.com:80/article.php?sid=654"

