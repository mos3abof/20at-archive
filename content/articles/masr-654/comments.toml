[[comments]]
order = 19
subject = "للفلسطيني"
author = "عاشق فلسطين"
posted = "2006-07-15"
text = "حبيب قلبي الفلسطيني؟ سيب الجعر ده يفضفض مين عارف كان راكبه إيه أو مين؟ مهو قال مش عايزين الإسلام يبقى إيه لزوم الكلام.<br />الكلام ليك إنت وللوطنيين المصرين: إنهي \"مصرودولة مصر الشقيقة ستظل قوة العرب !\" اللي بتقصدها حضرتك؟ مصر السادات-مبارك ولا مصر الشعب؟ مصر الرسمية أقولها لك لاتختلف عمالة وقذارة وتآمر عن الكويت..وكل ماذكره صاحبنا عن شرائهم لمبارك وعصمت عبد المجيد للأسف صحيح جدا، وأزيد كمان لولا تآمر وخيانة النظام المصري بالذات لما حدتث حروب الخليج ولا دمر العراق. ومصر الرسمية ضد الإنتفاضة وضد قيام دولة فلسطينية كاملة السيادة وإن كنت لغاية النهارده لاتعلم هذا فمشكلتك يعني.<br />للفلسطيني"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025213/http://masr.20at.com:80/article.php?sid=654"

[[comments]]
order = 20
subject = "لو سمحت لحظة مع النفس"
author = "الفرعون الصغير"
posted = "2006-07-15"
text = "بســــ الله ـــــم<br />اولا قبل ما اتكلم فى اي حاجه انا برفض الموقف دا ان ناس تانيه ملهاش حق فى البلد دي قدنا ويستفيدو بالخير بتاعها<br />بس ممكن اقول حاجه احنا عملنا ايه للبلد علشان ندور على شغل والاه نقول بطاله يا جماعه حرام عليكو قبل ما تقول الريس بيعمل والريس بيسوى شوف انتا بتعمل ايه اتحدى اي واحد فى مصر مش بينفض للفساد ولويقول لا للفساد بس لو شاف مصلحته فى الفساد مش حيقول لا دي الحقيقه والازم نحسبها كده اذا كان اللى من بلاد الهند والسند لاقى عمل هنا احنا يا ولاد البلد مش لاقينى يبقه العيب مش فى مبارك والاه العيب فى مصر العيب فينا احنا اننا دايما بندور على حقوقنا ونسين ان لينا واجبات لازم نعملها يا جماعه اتمنه ان كل واحد يقوم يتكلم مع نفسه يشوف ايه اللى عمله للبلد علشان تديله ايه نفكر شويه<br />وحكايه عادل دي خير دليل على ان البلد فيها شغل يعنى بالعقل اللى اخر الدنيا ييجى يشتغل هنا واللى فى البلد مش لاقى يا ريت نحسبها صح<br />واحب اقول انى مش مع عمل عادل بس مع ان الموضوع دا ميتكررشى مره ثانيه<br />بشكركم جدااا"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025213/http://masr.20at.com:80/article.php?sid=654"

