text = "في بلاد بره مايرضاش يتقاضى أجر زي ده في يوم، هو ما إيه اللي حدفه على مصر يعني؟ بلاد الخليج مفيهاش وسع خلاص؟ وبعدين يابراء الواد شغال شغلة شريفة يعني لابيبيع كيف ولامخدرات ولا شغال في أعوذ بالله دعارة ولا حرامي. خليه يترزق إن كان عاجبه هنا فيه كم واحد عاطل أو مش عاطل يقبل شغلة زي دي؟ مع إن كل العمل شريف عدا مايماسرة محاسيب الحكومة من الحزب الوطني من النهب العام والخيانة ونشر الرذيلة والموبقات."
