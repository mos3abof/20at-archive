text = "رغم الضيق الشديد من الامتحانات - فكلية الهندسة فيها امتحان كل يوم وكل اسبوع وحل شيتات وتقديم ريبورتات يعنى ضيق وقرف وحل مسائل وتمارين بدون نهاية<br />وكنا نتمنى الخلاص<br />ولكن بعد الخلاص<br />فعلا خلاص المرحلة الجميلة من العمر<br />تبدا مرحلة الخدمة العسكرية وشيل المخلة وقرف الصحراء ومعاملة الاوباش<br />الى رحلة البحث عن عمل<br />الى<br />الى<br />الى<br />يا ريت ايام الامحانات كانت دامت"
