posted = "2010-01-06"
text = "الرئيس حسنى مبارك سيدخل موسوعة جينز من اوسع ابوابها وهو الرئيس الوحيد فى العالم الذى<br />فى عهدة تم اختيار وعمل معة الاب<br />اللواء زكى بدر وزير للداخلية<br />ثم<br />ابنة احمد زكى بدر وزيرا للتربية والتعليم<br />ثم<br />بعد كم سنة وفى ايام حسنى ايضا<br />سيتولى هيثم احمد زكى بدر وزيرا للزبالة فى مصر"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107091259/http://www.20at.com:80/masr/profile/14626-2009-12-28-10-19-02.html"
