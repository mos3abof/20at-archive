[[comments]]
order = 2
subject = ""
author = "غزة هاشم المحاصرة"
posted = "2009-12-30"
text = "ما يعنينى فى موضوع غزة - هو الانسان الذى دمر بيتة بواسطة القذائف الاسرائيلية على مدى شهر من الحرب<br />الحصار منع دخول الاسمنت والحديد والخشب لمنعهم من بناء بيوتهم<br />كيف يبيت النساء والاطفال والمرضى والكبار والعجائز والمسنين وذوى الحاجة فى برد الشتاء القارص والامطار الغزيرة<br />كنت اتخيل الامطار التى تسقط خارج بيتى تسقط فوق اجسامهم فأدفع البطانية بعيد عن جسمى واقوم لاشرب سيجارة واقلق شوية واعاود النوم<br />ماذا صنع الانسان الغزاوى ؟<br />لم يركع للحصار ولا لحسابات القائمين بالحصار<br />رجع الى امة الارض - عجن الطين بالماء وصنع قوالب الطوب الطينية وجففها تحت الشمس<br />ثم اجتمعوا وبنوا جدرانا وغرفا وبيوتا من الطوب اللبن تماما كما كنا نفعل فى قرى مصر قبل عصر الاسمنت<br />رايت البيوت الدافئة المصنوعة من الطوب اللبن التى اوتهم وحمتهم من الصقيع والبرد<br />الانسان هو الانسان<br />يتصرف ليعيش<br />اما اصحاب الحصار فلهم عند ربهم عذاب شديد<br />يا ليت سكان القبور عندنا يخرجون من القبور الى الصحراء ليبنوا بيوتا من الطوب اللبن<br />موضوع انسانى بحت"
archived = "2009-12-31"
capture_url = "https://web.archive.org/web/20091231170820/http://www.20at.com:80/masr/egyptian-blogs/14626-2009-12-28-10-19-02.html"

