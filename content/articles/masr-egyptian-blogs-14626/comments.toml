text = "وبعدين يا اخويا جاى تقول لى امتحانات ونجاح وتطلع الاول وتطلع الاخير<br />خليك حلو<br />وخليك مع هرش العدة<br />هى دى الناس النجوم بتاع المجتمع<br />السكرى<br />الكومى<br />هشام طلعت<br />الواد بتاع هيفاء<br />والقائمة طويلة"
