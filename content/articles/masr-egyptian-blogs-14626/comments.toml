[[comments]]
order = 4
subject = ""
author = "17 يوم زواج"
posted = "2010-01-01"
text = "الى المعلق السابق<br />بطل القصة هو يحى الكومى رئيس نادى الاسماعيلية سابقا<br />تزوج مطلقة الامير الوليد بن طلال السيدة خلود العنزى زواجا عرفيا وجعل العصمة فى يدها حتى طلقتة بعد 17 يوم ومزقت ورقة الزواج العرفى<br />صرف عليها المحروس 150 مليون جنية فى 17 يوم - احسبها بقى انت تبقى الساعة معاها بكام<br />وبكدة يا حبايبى نبقى بندعم اواصر الصداقة بين السعودية ومصر<br />وعاشت القومية العربية<br />والنصر لنا"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107091259/http://www.20at.com:80/masr/profile/14626-2009-12-28-10-19-02.html"

[[comments]]
order = 5
subject = ""
author = "الكومى والعنزى"
posted = "2010-01-01"
text = "اسمها دراما سوداء<br />واحد من اثرياء العهد الميمون بتاع طويل العمر اسمة زفت الكومى لا احد يدرى ما هى مصدر ملايين الجنيهات التى يملكها ولا من اين اتى بكل تلك الثروة<br />هذا الكومى المصرى الهمام صرف على امراة سعودية كانت متزوجة قبل ذلك صرف عليها فى مدى شهر ونصف 150 مليون جنية<br />بالعربى مائة وخمسون مليون جنية<br />رجل سفية صرف على امراة 150 مليون جنية فى 45 يوم<br />هل هذا الرجل يدفع ضرائب عن تلك الاموال ؟<br />من اين اتى بتلك الاموال ؟<br />ولانة فى الحزب الوطنى الحاكم فهو فوق القانون وفوق الشبهات<br />اما لو كان مواطن مجرد ملتحى او بيروح يصلى فى الجامع صلاة الجمعة فيقبض علية بواسطة امن الدولة ويتهم بانة من المحظورة وتغلق شركاتة ويقفل مصنعة والتهمة الجاهزة غسيل الاموال<br />هل ينصلح حال بلد هذا وضعة ؟<br />150 مليون تصرف على امراة واحدة وهناك عشرات الملايين يعيشون فى المقابر ويدفعون ضرائب من مرتباتهم الهزيلة<br />ملهاة او كوميديا سوداء<br />لم نسمع عن باشا ايام الفساد ايام الملك فعل هذا السفة لانة تعب فى جمع اموالة<br />اعتقد ان هذا اسوأ عصر عاشتة مصر"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107091259/http://www.20at.com:80/masr/profile/14626-2009-12-28-10-19-02.html"

[[comments]]
order = 6
subject = ""
author = "مخ العجل"
posted = "2010-01-01"
text = "قافلة انسانية تحمل معونات وبين افرادها مسلمون ومسيحيون ويهود تريد ان تدخل غزة<br />فى الوضع الطبيعى عادى جدا<br />وممكن لضابط حرس حدود صغير ان يعطيهم التاشيرة ليدخلوا غزة ويعودوا مرة اخرى بلا ضجة ولا دوشة ويعودوا الى بلادهم<br />ولكن لان مخ العجل مزرجن<br />يبقى نخلق لهم متاعب وصعوبات ونمنعهم ونفرض مسار ونغيرة والصحافة العالمية والمراسلين شغالين وبيكتبوا والاجانب عملوا مظاهرة فى ميدان التحرير - والعالم كلة نسى اسرائيل سبب كل البلاوى وافتكر ان مصر هى صاحبة الحصار - بسبب مخ العجل<br />طيب لية مخ العجل مزرجن<br />علشان حماس ادخلت وسيط المانى فى الافراج عن العسكرى شاليط ولم تترك هذا النصر لمصر لترفع راسها امام امريكا واسرائيل وانها عملت حاجة<br />مخ العجل مزرجن لان حماس رفضت الصلح مع النظمة وطلبت تدخل دول اخرى لمنع مصر من كسب نقطة انها فضت الخلاف بين فتح وحماس امام الدول العربية<br />موقف حماس حمل شماتة قطر وسوريا وايران والسعودية ان مصر فشلت<br />مخ العجل زرجن<br />لانة اصبح بلا عمل فى المنطقة<br />يبقى نشتد فى الحصار على حماس<br />ولكن الف طز<br />فليست مصر وحماس وحدهما فى العالم"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107091259/http://www.20at.com:80/masr/profile/14626-2009-12-28-10-19-02.html"

[[comments]]
