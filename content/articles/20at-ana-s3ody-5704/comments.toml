author = "صديق (أحمد القطب)"
posted = "2007-05-08"
text = "سوف سديق.. انا زمان كان يعيش في سعودية وكان فيه نفر كتير هندي، كله كان ييجي من هند يدور سوغول، بعدين يلاقي يوغول براتب ما فيه كويس، بعدين بابا كفيل ياخد باسبور هندي ما يعرف روح ولا يعرف ييجي.. صديق ليس ما في معاملة إسلامية مع نفر هندي ؟"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718134551/http://www.20at.com:80/20at/ana-s3ody/5704.html"

