[[comments]]
order = 34
subject = "نقلا عن اسلام اون لاين .."
text = "طارق رمضان: رمضان شهر مناهضة العولمة<br />دعا المفكر السويسري المسلم طارق رمضان شباب الضواحي الفرنسية إلى استغلال شهر رمضان في التخلص من ثقافة الاستهلاك التي تفرضها ظاهرة العولمة.<br />وخلال ندوة نظمتها \"حركة عودة مدرسية بدون ملصقات إعلانية\" بالعاصمة الفرنسية باريس، اعتبر المفكر السويسري أن \"شهر رمضان فرصة أمام الشباب المسلم في الضواحي الفرنسية للتخلص من ثقافة الاستهلاك التي تعد أبرز ملامح المجتمع المعولم\".<br />ودعا رمضان شباب الضواحي الفرنسية المسلم إلى التحلي بـ\"ثقافة النقد\" إزاء ما تعرضه الملصقات الإعلانية التجارية من معلومات براقة حول السلع بهدف الترويج لها، و\"عدم الاكتفاء بالاستهلاك الأعمى\"، وقال: \"هذا الشهر هو شهر القطيعة مع العادات الاستهلاكية السيئة\".<br />وأضاف: \"بعيدا عن التطبيق الحرفي للشعائر الدينية في شهر رمضان ينبغي علينا أن نبحث عن أبعاد روحيات هذا الشهر التي تجعلنا نحترم أموالنا ونختار جيدا ما يجب شراءه\".<br />وتعد \"حركة عودة مدرسية بدون ملصقات إعلانية\" من الجمعيات الفرنسية المناهضة للعولمة، وتهدف إلى مقاومة ثقافة الملصقات الإعلانية التجارية في المدارس خاصة التي تعلن عن منتجات أمريكية.<br />وتعتبر الجمعية أن \"حيادية\" المدرسة يجب ألا تقتصر على منع الرموز الدينية، بل يجب أن تشمل أيضا كل الملصقات الإعلانية التجارية.<br />الضحية الأولى<br />الباحث الاجتماعي الفرنسي \"بول أريس\" اعتبر من جانبه أن \"شباب الضواحي الفرنسية من أصول مهاجرة هم الضحية الأولى للملصقات الإعلانية؛ لأنهم لا يملكون المال الذي يمكنهم من مجاراة زملائهم في شراء المنتجات التي تروج لها الإعلانات سواء أكانت هذه المنتجات ملابس أو مأكولات\".<br />وانتقد الباحث الاجتماعي الآراء التي تقول إن الملصقات الإعلانية التجارية تعطي الطفل فرصة لإثبات قدرته على الاختيار وتحمل المسئولية.<br />وعلى العكس من ذلك اعتبر أن الملصقات الإعلانية \"مدمرة لقيم المساواة والعدالة بين الأفراد؛ إذ إنها تزرع الكره والإحساس بالدونية بين التلاميذ بعضهم البعض، وذلك من منطلق أن بعضهم يستطيع شراء السلع والبعض الآخر عاجز عن شرائها\".<br />وأشار الباحث الاجتماعي الفرنسي إلى أن \"حركة عودة مدرسية بدون ملصقات إعلانية\" بدأت بحملة إعلامية كانت أبرز نتائجها توجيه عريضة لحوالي 150 نائبا برلمانيا فرنسيا من أجل المطالبة بمنع جميع الملصقات الإعلانية في المدارس.<br />ويعد انخراط طارق رمضان في العمل الأهلي الفرنسي والأوربي المناهض للعولمة - بحسب المراقبين- وجها جديدا سعى رمضان إلى إبرازه في تعامل المسلمين مع واقعهم.<br />وقد أحدثت مشاركته في المنتدى الاجتماعي الأوربي الذي عقد في العاصمة الفرنسية عام 2003 الكثير من الجدل على اعتباره أول محاولة تقريب بين المنظمات اليسارية المناهضة للعولمة والمنظمات المسلمة وعلى رأسها \"ائتلاف مسلمي فرنسا\" التي يعتبر طارق رمضان قائدها الفعلي.<br />ومن المقرر أن يشارك طارق رمضان في المنتدى الاجتماعي الأوربي الثاني الذي يعقد في العاصمة البريطانية لندن بداية من يوم 17-10-2004، والذي يشارك فيه آلاف الناشطين المناهضين للعولمة."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018161908/http://www.20at.com:80/article.php?sid=644"
