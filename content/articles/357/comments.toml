subject = "أختنا المناضلة زهور"
text = "تحية كبيرة للأخت المناضلة العظيمة زهور التي ضحت بسعادتها ووقتها وجهدها وفقدت ساقيها في سبيل الدعوة والإسلام وبالرغم من ذلك مازلنا نجد كلماتها يشع منها الأمل والنور والعزيمة القوية الصادقة التي تحفز الشباب وتدعمهم وموقع عشرينات يفخر بأن تشارك فيه مثل هذه الشخصية المؤمنة ونتمنى أن تشاركنا بالمقالات وتنشر لنا خبراتها وعلمها في الحياة وإنها لمثال صادق لقول الله تعالى (من المؤمنين رجال صدقوا ماعاهدوا الله عليه)<br />كتبت ذلك لأنوه على الأخوة بمقدار المناضلة زهور حتى يعرف قدرها ولا تهضم قيمتها ويرد عليها بكل تقدير واحترام و لا تجرح في مشاعرها<br />أخوكم في الله : مجدي شوقي"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018161908/http://www.20at.com:80/article.php?sid=644"

