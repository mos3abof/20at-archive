subject = "نونا"
text = "انا مش هقراءكل الوش و الزعيق ده<br />انا مستغربة احنا تركنا سيرة الرسول علية الصلاة و السلام و مسكين في سيرة يوسف اسلام و حمزة يوسف و سامي يوسف و حزقيل يوسف و عبده يوسف<br />ليه مفكرتوش تكتبوا عن موقف من مواقف الرسول مثلا في الغزوات او مثلا معاملته لغير المسلم او او او<br />ليه محدش فكر يكتب عن احد الانبياء زيسيدنا موسي عليه السلام كليم الله ليه مفيش ؟؟؟؟<br />ولا انتم شايفين ان دعاة الاسلام الغربيين افضل؟؟؟<br />و ليه لو هتكتبوا عن شخصيات عادية اثرت فينا<br />ليه متكتبوش عن سميرة موسي او مشرفة ولا لا كرامة لنبي في بلده؟؟؟؟؟"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018161908/http://www.20at.com:80/article.php?sid=644"

[[comments]]
