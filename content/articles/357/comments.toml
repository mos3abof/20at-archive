subject = "وائل عباس"
text = "الله ينور عليك يا عشريناتي<br />فعلا معاك حق<br />ولو يلاحظ الجميع ان النقاش دائر حول الموضوع والشخصية المتناولة فيه ولم يتطرق ابدا الى الاستاذ البراء كاتبه واللذي شخصيته مصونة<br />والحقيقة انا شخصيا اقرا الموضوع اولا قبل ان اقرأ اسم كاتبه<br />فما يهمنا هو الموضوع والفكرة وليس الشخص<br />لكن دأب بعض الطفيليون المأجورون والموتورون على التشهير بالمعلقين لاسباب في انفسهم تخلو من الموضوعية<br />شكرا مرة اخرى لعشريناتي ..."
