text = "الاخ عجبه<br />مش بقولك تعصب اعمى<br />يا عجبك يا ابني<br />هذا ما تظنه انت ... !!!<br />وان كان كذلك فهو يكفي ...<br />فيكفي ان تشاهد الثواني التي اصطدمت فيها الطائرات ببرجي مركز التجارة العالمي لتعرف ان كارثة ستنتج عن ذلك !!!<br />كذلك ان تشاهد هذا الشخص يتكلم لمدة ساعة عن الاسلام بدون ان يعطي اي انطباع جيد ولا يرد ويفند اي سؤال ... يكفي ذلك لتدرك انه كارثة وفضيحة متنقلة على قدمين وانه خير من يريده الغرب ان يمثل الاسلام امام شعوبهم ...<br />لقد كان رسول الله صلى الله عليه وسلم يتخير من يرسلهم من الرسل على ان يكونوا واثقين من انفسهم اقوياء الحجة وعلى درجة عالية من اللباقة ... بينما نحن نحتفي بالاشخاص لمجرد انهم من نسل فلان او علان او ترتان !!!"
