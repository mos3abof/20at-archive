subject = "وائل عباس"
text = "تذكرت شيئا ايضا<br />سأله المذيع عن قتل المدنيين في اسرائيل فقال ان قتل المدنيين محرم في الاسلام ... لكنني اتفهم ما تقوم به المقاومة الفلسطينية !!! اي نوع من الاجابات المائعة تلك !!! اليس هذا نفاقا؟؟؟ فهو لا يريد معاداة الغرب الاوروبي وفي نفس الوقت لو هاجم المقاومة الفلسطينية ها يتشرشح ويفقد الهالة المضروبة حوله من جماعة الاخوان المسلمين اللتي تؤيد تلك العمليات ... برغم ان هناك اراء فقهية اخرى تحرم تلك العمليات وتعتبر منفذيها منتحرين نهايتهم النار ... هل من الاسلام ان نظهر بعض القول ونخفي بعضه ؟؟؟ هل من الاسلام ان نتحيز لرأي ما ثم نستعر منه اما الغرب !!! هل هذا هو الثبات على المبدأ !!! هو الي بيزمر بيخبي على دقنه !!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018161908/http://www.20at.com:80/article.php?sid=644"

