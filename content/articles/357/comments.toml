[[comments]]
order = 26
subject = "بقلم وائل عباس: خاص بعرب تايمز"
text = "شاهدت برنامج هارد توك على محطة البي بي سي وكان ضيف الحلقة رجل يدعى الدكتور طارق رمضان وهو بروفيسور للدراسات الاسلامية في جامعة جنيف عاوز اقوله *** انت ايه اللي خلاك *** وتطلع في البي بي سي ما عندكشي حاجة تقولها وغير مقنع وغير مقتنع اصلا بما تقول انت شوهت صورتنا *** انت كنت خير مثال على ما يدعونه من ان المسلم كذاب ملتوي يتلاعب بالالفاظ انت فاكر نفسك بتحاور مين ؟؟؟<br />دول ما عندهومشي تكسب الجولة بالتلاعب بالالفاظ<br />الناس دي بتعتد بالمحصلة النهائية لما قلت !!!<br />انا لا استطيع لوم المذيع<br />او ان اقول انه تحامل على المسلمين<br />انا شخصيا لو باتحاور معاك كنت ها اتحامل *** والمذيع ذكي وانت كلامك كله ثغرات ولم تستطع الرد وانا لا الومه على الدخول من تلك الثغرات في كلامك ده انت *** الدين الاسلامي يا راجل !!!<br />كان يجب عليك ان تكون محايدا ولا تتحيز لقناعاتك الشخصية<br />انت تدافع عن الدين كله لذا وجب عليك طرح كل الاراء فعندما هاجم المذيع القرضاوي تكلمت وكان القرضاوي هو الاسلام وكان كل ردك عبارة عن تبرير لاقوال القرضاوي<br />هل عينك القرضاوي متحدثا شخصيا عنه ؟؟؟<br />هل انت هنا لتدافع عن القرضاوي ام الاسلام ؟؟؟<br />وفي النهاية الراجل زنقك<br />وقال لك القرضاوي قال كذا وكذا في احاديثه وموقعه على الانترنت ثم اتى الى انجلترا يقول كلاما مختلفا تماما وضرب لك مثلا عما قاله عن الشواذ ومثلا عن العمليات الانتحارية فاحرجت نفسك واحرجت القرضاوي واحرجت الاسلام واحرجتنا !!!<br />حقيقة كنت اشعر بالخجل وانا من يمثلني امام الراي العام الاوروبي والبريطاني شخص مثلك انت والقرضاوي سالك المذيع عن ضرب المرأة في الاسلام فقلت كلاما مائعا يوضح انك غير متخصص وسألك عن حد الرجم فقلت انه غير قابل للتطبيق انا شخصيا كنت لانتهز الفرصة لهجوم مضاد واتحدث عن الرجم في التوراة والانجيل ثم حرق الساحرات ومحاكم التفتيش وكثير من المهازل اللتي قام بها هؤلاء المتحضرون انتهاء بالفصل العنصري اللذي لم يتحكموا فيه الا منذ وقت قريب ...<br />ثم سالك عن العمليات الانتحارية فقلت ايضا كلاما عائما وغير محدد وكنت وكانك لا تدافع عن الاسلام بل تدافع عن شخصك فكان ردك مزيجا متناقضا من ان العنف ضد المدنيين مرفوض ولكن العمليات الانتحارية مبررة !!!<br />ما هذا التخريف وما هذه الخرابيط على رأي الكوايته !!!<br />كان لابد ان تكون موضوعيا وتسرد الاراء الفقهية المختلفة من الموضوع<br />الم يصلك ان هناك اراء فقهية تحرمها وتجرمها تماما ؟؟؟<br />كان ينبغي ان تكون محايدا وتسرد الراي الاخر لا ان تتحدث وكان قناعتك الشخصية هي الدين !!!<br />فتاتي اجابتك مشوهة لك ولنا وللاسلام<br />ثم الطامة الكبرى<br />عندما ادعيت ان ولاؤك للدين وللدولة اللتي توؤيك واقررت بانك تحترم القوانين والدساتير الاوروبية فقام المذيع زانقك وسالك هل الامر مختلف في المملكة العربية السعودية فاسقط في يدك وما عرفتش تقول اي حاجة مقنعة !!!<br />رجاء حار<br />اختفي<br />وائل عباس<br />*** تم حذف الكلمات الموضوع مكانها هذه العلامة لخروجها عن الآداب العامة"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018161908/http://www.20at.com:80/article.php?sid=644"

