subject = "زهور"
text = "صدقا فوجئت بهذه التعليقات والمناقشات الحادة<br />سلامة الأخ وائل من شلل الأطفال<br />وأيضا لم نقصد التعصب الاعمى ولا داخلين نهرج سامحك الله<br />ولكن هو ما قراناه عنه جعلني بعد ذلك استفسر وأقرا عن هذا لشخص بتوسع<br />واعتقد انه لو كان ما ذكرته عن طارق رمضان صحيح وانه فعلا اخفق في الرد على الأسئلة التي طرحت عليه فهذا لا يمنع أن نكون محايدين ولسنا مهاجمين بطريقه مثيرة تشمت أعداء الإسلام فينا<br />وأيضا لا يمنع من الإطلاع ومعرفة حياة أشخاص مسلمين عرب مجبرين على الغربة، (مغتربين )<br />الأخت نونا (معك حق في الاستغراب )<br />لكن ربنا يعين<br />واحيي مرة أخرى الأخ البراء على اختياره وطرحه"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018161908/http://www.20at.com:80/article.php?sid=644"

[[comments]]
order = 21
subject = "وائل عباس"
text = "الاخت زهور<br />تطلبين الحياد بينما الاخ كاتب المقال يفترض فينا اننا بندوب في دباديب الشخص ده وانه يتحط على الجرح يطيب !!!<br />وهو شيء مستفز الى اقصى درجة !!!<br />فانا متاكد ان لو كتب شخص ما وهو احتمال بعيد جدا ان وائل عباس ده مفكر عظيم وحتة سكرة ومافيش بعد افكاره اللي تودي في داهية سيثار عندك نفس الشعور بالاستفزاز والتقزز !!!<br />ثم لماذا يشمت فينا اعداء الاسلام ؟؟؟<br />لاننا ننقي اسلامنا من الشوائب والطفيليات والعلائق اللتي تعلقت باستاره في زمن رديء ؟؟؟<br />والجماعات اللتي تحتكر الاسلام ويجب ان نقول لها آمين واحنا عميانين ؟؟؟<br />اللي يشمت يتفلق ...<br />لكن يجب حماية صورة ديننا وهو الاصل مهما كانت معزة الاشخاص او عاطفتنا تجاههم!!!<br />فلم يضر الاسلام اكثر ممن يدعونه ويدعون الجهاد باسمه ثم يقتلون الابرياء بالطائرات المدنية ويحتجزون اطفال المدارس !!!<br />ثم نأتي ونحتفي بدعاية فارغة لشخص ثبت انه بالونة فارغة ومنافق للغرب لا يستطيع ان يرد على اتهامات باطلة وهو اسوأ دعاية لاسلام !!!<br />لقد قال هذا الشخص انه يحترم دساتير وقوانين البلاد الاوروبية ... فما رأيه في مشكلة الحجاب في فرنسا؟؟؟ وما رأيه في عدم احترام البعض لقوانين بلادهم العربية والاسلامية حتى !!! بما في ذلك ما قام به البعض في السعودية !!! ثم كيف يقول للمذيع ان حد الرجم غير ممكن التطبيق !!! انا لو مكانه لكنت انتهزت الفرصة لمهاجمة التراث الاوروبي من حرق للساحرات والعلماء بتهمة الهرطقة بل والهجوم على اليهودية واللتي ايضا بها حد الرجم للزناة ... ازاي هو ما كانشي عارف يرد كده !!! ده فضيحة متنقلة للاسلام !!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018161908/http://www.20at.com:80/article.php?sid=644"

