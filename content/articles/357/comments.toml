text = "كيف بالله عليكم يضيف شخص مثل هذا للامة وهو الذي لايستطيع ان يرد على اسئلة مذيع انجليزي عن الاسلام ولا يقدم ردود مقنعة للمجتمع الاوروبي<br />هل تعرفون عن الرجل اي شيء بالمرة ام هو التعصب الاعمى قاتله الله ؟؟؟<br />اتحدى كاتب المقال والمتحيزين له ان يكونوا رأوا او سمعوا اي شيء لهذا الشخص !!!<br />خير ممثل للمسلمين هو من يستطيع ان يرد على الهجوم على الدين بالتوضيح المناسب !!!<br />ساله المذيع عن القرضاوي<br />وساله عن الشواذ<br />وساله عن العمليات الانتحارية<br />وساله عن ضرب المرأة في الاسلام<br />وساله عن حد الرجم<br />وساله عن ولاؤه للدساتير والقوانين الاوروبية<br />ثم احرجه وساله عن الاحداث في السعودية<br />لم يجب اي اجابة مقنعة او محددة او حتى معبرة عن حقيقة الاسلام!!! لقد شوه هذا الرجل صورة الاسلام واحرجنا جميعا لان اجوبته كانت ملتوية وملتفة وغير محددة وغير مفيدة وغامضة !!! فهل هذا اسلامنا اللذي نفتخر به ؟؟؟ لماذا الالتفاف الا اذا كان في ديننا ما نستعر منه حاشا لله!!!<br />والنبي الاول ابقوا اعرفوا انتم بتتكلموا عن مين !!!<br />ده انا جالي شلل اطفال من الحلقة بتاعته على البي بي سي !!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018161908/http://www.20at.com:80/article.php?sid=644"

