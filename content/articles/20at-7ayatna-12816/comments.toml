text = "بصراحة كانت أمورة جدا وكنت بحبها اوييي<br />كنا بنبص على طول لبعض عنيا مش برفعها من عنيها<br />وطلبت ايدها من امها..قالتلي انت لسه عيل في الكلية لما تكبر ابقى تعالي<br />بس انا دلوقتي الحمد لله في حياتي ست ستها على رأي محمود العسيلي في اغنية (مش زي الافلام)"
