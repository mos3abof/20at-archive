text = "اقتباس pupa:<br />انا بقى معنديش ابن جيران اصلا<br />كل ولاد المنطقة اصغر منى بكتيييييييييييي ر اقلهم اصغر منى ب 3 سنين<br />حتى فى عيلة بابا انا اكبر حفيدة وكل الولاد الى فيها اصغر منى بكتير<br />اما فى عيلة ماما فانا اصغر حفيدة بنت فيها وكلهم كبار جدااااااااااااا اا ومتجوزين حتى الى من دورى لا يصلح<br />ماليش دعوة انا عايزة ابن جيران بقى<br />و الله انا برده اعرف واحده كانت عندها نفس المشكلة و هي بنت عمي كانت كبيرة و كل العيلة صغيريين بس انا كنت بحبها و مش هاممني السن المهم ان انا و هي بن حب بعض مع اني اصغر منها ربنا معاكي و لو عايزة اننا نكون صحاب ردي و قوليلي ال ياهوو بتاعك"
