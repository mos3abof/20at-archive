text = "مش لازم ابنالجيران يكون فى الشقة اللى قدامنا كان فى المحل اللى قدمنا و كنت بحبه اوي و فجأة ساب المحل و اختفى تماما لمدة 5 شهور اصلا مكنش بينا غير نظرات لكن كنت حاسة اننا بنحب بعض اوي و بعد 5 شهور ظهر فجأة و اتقدملي لكن بابا قاله اني اتخطبت مع اني مكنتش اتخطبت و لا حاجة و من ساعتها معرفش حاجة عنه"
