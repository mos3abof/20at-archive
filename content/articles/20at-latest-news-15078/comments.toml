text = "ليه دايماً نلوم علي الشباب .. وعلي طريقة تفكيرهم الإنحرافية<br />المشكلة .. ان السباقات اللى زي دى بتبقي عبارة عن طاقة مخزونة لدي الشباب .. وكل واحد بيطلع الطاقة دي علي حسب أهتماماته .. ودول بيحبوا السرعة و المغامرة فلماذا لا تنشأ الدول مضمارات للسباقات آمنة وتجعلها مجانية ولكن منظمة وبالطريقة دي تختفي سباقات الأندر جراوند ( الغير رسمية) .<br />لكن أحنا مالناش غير أننا نلقي اللوم علي الشباب وأنهم هما اللى غلطانين ."
