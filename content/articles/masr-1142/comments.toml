[[comments]]
order = 1
subject = "الحزب الواطي الديمقراطي"
author = "عبد الله"
posted = "2006-11-10"
text = "هذه ليست غلطة كتابية ولكنها حقيقة فهو حزب واطى فى شعبيته وتعاملة مع الاخر وممارسته للحريات حتى قلعة التشريع فى مصر وهى مجلس الشعب يمارس فيها التزوير ويكشفه نائب وفدي كمان ايه ريحة الاستبداد اللى عفنت وهاتموت الشعب المصري من ريحتها دي ؛ لكن ارجع واقول من شب على شيء شاب عليه فهذا النظام الاستبدادي لايستطيع ان يعيش بدون تزوير كالسمك الذى لايستطيع ان يعيش بدون ماء وحسبنا الله ونعم الوكيل"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015115/http://masr.20at.com:80/article.php?sid=1142"

[[comments]]
order = 2
subject = "المفروض"
author = "أبي الوطن"
posted = "2006-11-11"
text = "أمي الوطن<br />أنت يتيم أبشع اليتم إذن<br />أبي الوطن<br />أمي الوطن<br />لا أمك احتوتك بالحضن<br />ولا أبوك حن!<br />أبي الوطن<br />أمي الوطن<br />أبوك ملعون<br />وملعون أبو هذا الوطن!<br />نموت كي يحيا الوطن<br />يحيا لمن؟<br />لابن زنى<br />يهتكه.. ثم يقاضيه الثمن؟!<br />لمن؟<br />لاثنين وعشرين وباء مزمناً<br />لمن؟<br />لاثنين وعشرين لقيطاً<br />يتهمون الله بالكفر وإشعال الفتن<br />ويختمون بيته بالشمع<br />حتى يرعوي عن غيه<br />ويطلب الغفران من عند الوثن؟!<br />تف على هذا الوطن!<br />وألف تف مرة أخرى!<br />على هذا الوطن<br />من بعدنا يبقى التراب والعفن<br />نحن الوطن !<br />من بعدنا تبقى الدواب والدمن<br />نحن الوطن !<br />إن لم يكن بيتاً كريماً آمناً<br />ولم يكن محترماً<br />ولم يكن حُراً<br />فلا عشنا.. ولا عاش الوطن!"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015115/http://masr.20at.com:80/article.php?sid=1142"

[[comments]]
order = 3
subject = "صوت مصر"
author = "كــوارث مــصــر الــمــعــاصــرة"
posted = "2006-11-12"
text = "بعد كل هذه الكوارث متى تستيقظ مصر؟!<br />شخص واحد يحتكر 60% من الحديد<br />وشخص واحد يحتكر استيراد القمح<br />8 أشخاص يحتكرون سوق العقارات<br />و6شركات تحتكر البورصة<br />12 شخصا يحتكرون السكر<br />و30 شركة تسيطر على اجمالى السوق<br />16% من القروض متعثرة ,<br />343 شخصا حصلوا على 42% من القروض<br />سيارات الحكومة تلتهم ايرادات البترول وقناة السويس!!<br />الحكومة تستولى على 150 مليار من التأمينات ,<br />75% من أجهزة البحث العلمى غير صالحة<br />نستورد 70% من احتياجاتنا الغذائية<br />الصين دخلت عصر الفضاء والهند تصل الى القمر ونحن نستورد الفول!<br />حبس 27 مواطنا بتهمة التفكير فى الجهاد بالعراق<br />حكومة مصر تزود اسرائيل بالغاز الطبيعى<br />كم عددالمؤسسات والمشروعات المسماة باسم الأسرة الحاكمة؟!<br />سوزان تواصل الاشراف على مجلس الوزراء<br />نيوزويك: مبارك فقد التركيز فى اجتماعاته مع رؤساء الدول<br />المعلم الانجليزى لجمال مبارك: يهودى فاسد شاذ جنسيا!<br />استعادة الحق التاريخى للأمة فى اختيار حاكمها واجب شرعى ووطنى<br />مصر تواصل الغرق فى مستنقع من الأوحال , وأمواج متلاطمة من الخزى والعار و الاذلال, وكل يوم أسوأ من اليوم السابق له , هبطنا الى تحت الصفر , ولكن ذلك ليس هو نهاية المطاف , فهناك درجات لا نهائية تحت الصفر, ونحن نواصل الهبوط .. خارج اطار التاريخ ..<br />وليس هذا هو أخطر شئ .. الشئ الأكثر خطورة هو أن الأمة مستسلمة لهذه الحالة المخيفة التى لا مثيل لها منذ قرنين على الأقل , ولا توجد حالة من الاستنفار , أو الاحساس بالخطر , أو دق ناقوس الخطر , أو اعلان نفير الاستيقاظ فلا يمكن لفريق واحد أو فرد واحد أو مجموعة واحدة أن تقوم بذلك, لكن يتعين على كل القوى الحية<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015115/http://masr.20at.com:80/article.php?sid=1142"

