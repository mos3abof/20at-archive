text = "دحلاان كلنا يعرفه كما يعرفه ساويرس خائن من الدرجة الأولى و حماس الوحيده هي التي هددت العدو الصهيوني في عقر داره و لكن هكذا الدنيا وعجبي ."
archived = "2009-06-03"
