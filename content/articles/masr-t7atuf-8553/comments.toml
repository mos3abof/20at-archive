[[comments]]
order = 1
subject = ""
author = "كلوب باشا"
posted = "2008-03-22"
text = "نجيب ساويرس رجل اعمال ناجح فى البزنس وبس وياريت يلم الدور وبلاش تصاريح صحفية من نوعية الحجاب ودحلان ووطنيتة وحماس والعمالة لايران وسوريا انتو ملاحظين ان السيد ساويرس محور تصاريحة السياسية ايران ان كان فى الحجاب او حماس اللى عاوز اقولة ليك يانجيب باشا انك تركز فى شغلك وتسيبك من السياسة لانى لغاية دلوقتى مبكرهكش ومتخليناش نكرهك مع العلم انة احنا بنسمع انك انسان كويس وحقانى فى الشغل فمدخلش نفسك فى متاهات انتة فى غنى عنها علشان نحبك"
archived = "2009-06-03"
capture_url = "https://web.archive.org/web/20090603120156/http://20at.com:80/masr/t7atuf/8553.html"

[[comments]]
