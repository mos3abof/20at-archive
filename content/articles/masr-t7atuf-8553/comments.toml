posted = "2008-11-12"
text = "يا عم نجيب احنا بنحبك<br />ماتزعلناش منك كل العالم عارف دحلان بخسيته<br />الله يرحم لما كان بيهرب من منفذ رفح البضائع<br />دلوقت بقى مليونير من دم الشهداء<br />ارجوك لاتدافع عن كل الاغنياء"
archived = "2009-06-03"
capture_url = "https://web.archive.org/web/20090603120156/http://20at.com:80/masr/t7atuf/8553.html"
