author = "ابوصالح"
posted = "2008-03-22"
text = "هل يوجد نقص فى الافكار الصحفية ؟هى الموضعات الجامدة الحيوية راحت فيين نزلت ارشيف وخلاص اين الموضعات الصحفية الجامدة القوية العودنا علية موقع ولاد البلد وعشرينات هم السادة القائمين على الموقع اتغيرو ولا اية انا بصراحة مش عارف ونفسى اعرف … وشكرا"
archived = "2009-06-03"
capture_url = "https://web.archive.org/web/20090603120156/http://20at.com:80/masr/t7atuf/8553.html"

[[comments]]
order = 4
subject = ""
author = "محسن"
posted = "2008-03-27"
text = "لازلنا نمس في تعليقاتنا جوانب لا ترتبط بالموضوع من اساسه . من المؤكد ان لكل مواطن حق في الحياه والدفاع عن معتقداته وايضاحها للأخرين . لا ادري لما يتمرس البعض بالسيكولوجي للتأثير علي الاخرين من اجل تحقيق اهدافه من خلال تعليقاتهم الغير مفيده .<br />بعد القرأه .. ليس من أي أحد منع انسان من دخول مصر لتضيق الخناق عليه وليكن الحكم للبلد كما قال السيد جوده. مع الاسف لازلت لا استطيع الحسم علي دحلان ان كان وطني مخلص او عميل . ولكنه ان كان عميل فالاولي ان يبيع اسرار سياسة مصر وليس فقط فلسطين ..وان كان غير ذلك..فيحذف الاتهام الاول.<br />تعليق زائد علي كلوب باشا..\"انك تركز فى شغلك وتسيبك من السياسة لانى لغاية دلوقتى مبكرهكش ومتخليناش نكرهك مع العلم\"؟؟؟؟؟؟؟؟؟؟ ؟؟؟؟؟؟؟؟؟؟؟ انت لم تحسن التعليق بل تسيئه ."
archived = "2009-06-03"
capture_url = "https://web.archive.org/web/20090603120156/http://20at.com:80/masr/t7atuf/8553.html"

[[comments]]
order = 5
subject = ""
author = "أحمد الرنتيسي"
posted = "2008-04-07"
text = "وكما هو معروف أفضل صديق للانسان هو الكلب<br />ولكن دحلان الذي تقول عنه صديقك اسأله سؤال واحد (من أين له هذا بعد أن كان يسكن الزنكو في المخيم)<br />ومن هو الذي قتل الدكتور عبدالعزيز الرنتيسي<br />لن تأتي لنا يا ساويرس لتلمع صورة دحلان الذي يشهد اخوه على انه خائن"
archived = "2009-06-03"
capture_url = "https://web.archive.org/web/20090603120156/http://20at.com:80/masr/t7atuf/8553.html"

[[comments]]
