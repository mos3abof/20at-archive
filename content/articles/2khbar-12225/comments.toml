author = "سعد ابو مسعود"
posted = "2009-05-31"
text = "انا عايز اعرف<br />هو سعد الصغير دة مطرب والا رقاص<br />لانى بشوفة يرقص اكتر ما يغنى<br />وبعدين يروح اسرائيل ما يرحش اسرائيل هو ايش يكون<br />خلبوص طبل<br />مهرج<br />زمان كانوا بيطلقوا على النوعية دى اسم الخصيان"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602195742/http://www.20at.com:80/2khbar/12225-2009-05-31-08-39-52.html"

