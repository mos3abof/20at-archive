subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-06-01"
text = "و رحمة امى لاروح اسرائيل اذا سمحت لى السلطات المصرية<br />اما السلطات الاسرائيلية فانا واثق من انها سوف ترحب بى<br />وتحيا مصر<br />و سلمولى على اهل النفاق الوطنى و العربى<br />الف مليون اتفوا عليكم"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602195742/http://www.20at.com:80/2khbar/12225-2009-05-31-08-39-52.html"
