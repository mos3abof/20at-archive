text = "اول شي السلام عليكم ابختصر كلامي بجمله الي يقول ان كلمة التوحيد لاتحذف هل بيضمن ان هذي الكلمه لاتمتهن او تكون بذمتك كل من تمتهن انا مارضى حتى الفنانين والفنانات يلمسونه لانهم بلا قيم ولا عقيده \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\انا مع تواجد علم يحذف فيه كلمة التوحيد للمناسبات"
