text = "لا لالالالالا لالالالالالا تغيروا العلم هو أهم علم وأهم شعار لاإله إلا الله محمد رسول الله الله يحفظ العلم والملوك هي أمريكا هي لتخطط كذا والساقطات عليهم اللعنة عقابهم كبير إن شاء الله ربي يحفظ العلم الله الله الله"
