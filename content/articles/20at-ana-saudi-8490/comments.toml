text = "ياسبحان نحذف كلمة التوحيد التي من أجلها خلقنا الله ومن اجلها حاربنا لماذا لكي يحتفل الساقطون والساقطات بلف العلم على اجسادهم في البرامج الساقطه والمشكله بدل مانعاقب هولاء الحمقى نخلق لهم الأعذار ."
