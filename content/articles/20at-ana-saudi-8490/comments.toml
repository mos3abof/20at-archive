subject = ""
author = "أستغفر الله"
posted = "2008-03-13"
text = "أنا أقول عيب أن يحذفون كلمة التوحيد بل يجب عليهم أن يفرضوا عقوبه لمن يسيء للعلم و بالأخص لكلمة التوحيد الموجوده به وتكون عقوبه شديده لأن هذي رذيلة للمسلمين وبالأخص للأسلام أن ترفع كلمة التوحيد في برامج تافهه وهذي أكبر إهانه لرسول الله صلى الله عليه وسلم ومن المفروض علينا كمسلمين أن تكون عندنا غيره على دينه الأسلامي ونطالب بأن تفرض العقوبه هذا رأيي في الموضوع."
archived = "2009-09-29"
capture_url = "https://web.archive.org/web/20090929101100/http://www.20at.com:80/20at/ana-s3ody/8490.html"

