posted = "2008-09-22"
text = "ياأيها المسؤلين العلم السعودي يجب ان يحترم ويقدر لان فيه اسم الله جلى جلاله واسم رسوله صلى الله عليه وسلم<br />ومن اراد ان يعبر عن نفسه انه سعودي في مكان غير لائق باسم الله ورسوله ان يكتفي بعلم يوضع عليه (سيفين ونخله وكلمة المملكه العربيه السعوديه ) بدون كلمة ( لا اله الا الله محمد رسول الله ) . وجزاكم الله خير"
archived = "2009-09-29"
