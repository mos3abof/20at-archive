[[comments]]
order = 1
subject = ""
author = "ابو سماعين"
posted = "2007-10-25"
text = "التوريث مش لعبة ولا هو فدان ارض بيروثة الولد عن ابوة<br />اولا الشيوخ المشهورين دول اللى اصواتهم جميلة جدا لم يورثوها عن ابائهم ولا اجدادهم يبقى ازاى عيالهم عايزين يورثوهم بالعافية<br />انا شايف انها موضة او هوجة مالية البلد<br />مذيعة فى التلفزيون بتجيب بنتها تشتغل مذيعة وهى ما بتعرفش تنطق عربى ودمها يلطش ولدغة<br />ومخرج بيجيب ابنة يشغلة مساعد مخرج<br />وتربى او حانوتى بيشغل ابنة فى نفس الوظيفة حتى لو كان نجار طبالى<br />البلد بتحتضر والا اية<br />اية اللى بيحصل ؟نسأل مين ؟<br />يا اساتذة علم النفس هل هى حالة اكتئاب حاد اصابت شعبنا ؟ ربما"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923221300/http://www.20at.com:80/masr/t7kyk/7433.html"

[[comments]]
