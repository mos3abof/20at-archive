author = "د. مسعود الجابر"
posted = "2007-10-25"
text = "وأنت متغاظ لية أوى كدة فمن عاشر القوم40 يوم صار منهم ومن حق كل أنسان أن يحافظ على سيرة والدية وخاصة لو كانت سيرة طيبة مثل الشيوخ وقراءة القران وأنا مع الظاهرة بالاضافة الى أنها وسيلة طيبة للكسب وأفضل من أن يعمل الأنسان عمل غير شريف وأنا احيى الأستاذ الحناوى على القاؤة الضوء على هذا الموضوع . وشكرا وفقكم اللة الى مافية الخير لأمتنا"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923221300/http://www.20at.com:80/masr/t7kyk/7433.html"

