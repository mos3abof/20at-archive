author = "مش ناقص"
posted = "2009-01-27"
text = "لعنة الله على الحرامية وولاد [ *** ] بتوع ثورة 23 يوليو الحرامية ولاد الكلب<br />انا عايز اعرف عملوا ثورة على ايه<br />ايه اللي كان غلط في البلد وصلحوه<br />كان ايام الملك فاروق فيه حاجه اسمها (التكيات)<br />التكيات دي زي المطعم اللي مش لا قي ياكل يروح ياكل فيها ويشبع<br />وكان الواحد لما يدخل التكية دي يغطي وشه علشان خاطر ما حدش يعرفه<br />منهم لله ولاد الكلب بقيادة المجرم جمال عبدالناصر<br />دمروا البلد<br />والذين جاءوا من بعدهم خير خلف لخير سلف<br />دمروا البقةي الباقية<br />منهم لله جميعا"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923220152/http://www.20at.com:80/masr/t7kyk/11075.html"

[[comments]]
order = 3
subject = ""
author = "شفت"
posted = "2009-01-27"
text = "نحن فى شهر طوبة - قمة الليالى الباردة فى مصر<br />دخلت الى حوش المسجد من الباب الصغير - حيث يوجد خشبة دفن الموتى - النعش الخشبى - الذى وضعة احد المتصدقين ليدفن الناس فيهم موتاهم<br />سمعت صوت حركة داخل النعش واصوات خبط بداخلة<br />انتظرت خائفا حتى حضر احد المصلين فقلت لة اننى اسمع صوتا من داخل النعش<br />ضحك الرجل - الظلام اترك اثرة عليك يا الا ندخل نصلى<br />ولكن الحركة زادت حتى سمعها هو معى وقال اة فية حاجة<br />وتوجهنا الى النعش ورفعنا غطائة بحذر وخوف شديد جدا<br />كان طفلا عمرة 9 سنوات يرتجف من قسوة البرد ويحتمى منة بالنعش - فاخرجناة - للاسف كان من اطفال الشوارع - لا اب لا ام لا اسرة وضال فى الشوارع ياكل لقمة من هنا ولقمة من هناك وينام على قارعة الطريق او فى اى مكان يجدة<br />ما الذى حدث لمصر ؟<br />هناك احصائيات تقول ان عددهم يزيد 700 الف<br />ما الذى فعلناة فى الثلاثين سنة الماضية حتى ظهر هؤلاء الاطفال الى الشوارع ؟<br />لم تعرف مصر هذة الظاهرة من قبل على الاطلاق - حتى فى ايام المجاعات ايام المماليك<br />ما هو الشىء الغلط اللى عملناة حتى وصلنا الى هذا الوضع ؟<br />هل اتباعنا سياسة البنك الدولى المفروضة على الحكومة التعبانة والنظام الاكثر غباءا اوصلنا الى ما وصلت الية البرازيل وعملية اطلاق النار على الاطفال الضالة - وكانهم كلاب ضالة ؟<br />كيف وصلنا الى هذا الحال ؟<br />لا تكلمنى عن رجال الاعمال ولا التنمية ولا المثتثمر ولا تحقيق 7 % ولا حتى 100 % تنمية فما نراة يفوق الوصف<br />ايها السادة<br />كلنا مسئولين عما وصلنا الية<br />نعم<br />كلنا مسئولين عم وصلت الية الاحوال<br />ولا حول ولا قوة الا باللة<br />واللة المستعان"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923220152/http://www.20at.com:80/masr/t7kyk/11075.html"

