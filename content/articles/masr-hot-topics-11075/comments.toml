[[comments]]
order = 5
subject = ""
author = "مبروك يا مروى انتي ورضوى"
posted = "2009-01-28"
text = "الصحفية عرضت مشكلة انسانية بحته<br />اطفال يولدون ويعيشون ويموتون في الشوارع<br />المفروض بأه الكل يتحرك لانقاذ هؤلاء<br />او ايقاف هذه الظاهرة<br />او او او او<br />المفروض تكون التعليقات كلها من ذوي القلوب الرحيمه اللي عايزين يساهموا في حل مشكلة هؤلاء الاطفال<br />دا المفروض<br />ولكن يظهر ان البعض وجدها فرصة لتهنئة الصحفية بهذا السبق الصحفي الخطير وغير المسبوق<br />وكأنها رسالة دكتوراه<br />ونحص بالذكر علياء ابو شهبه<br />واللي بعديها ما كتبش اسمه<br />يا خونا الموضوع موضوع انساني عايز ناس تتحرك<br />مش انتكه صحفية حنهني ونبارك<br />ـــــــــــــــ ـــــــــــ<br />مبروك يا مروى انتي ورضوى<br />انا مستعد اساهم في حل المشكلة<br />نساهم ازاي ولا نروح فين ولا لمين"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923220152/http://www.20at.com:80/masr/t7kyk/11075.html"

[[comments]]
order = 6
subject = ""
author = "اكتب اسمك هنا"
posted = "2009-01-28"
text = "ألف مبروك ياست مروة ، موضوع مدهش فعلاً ، قريت كثير عن ظاهرة أطفال الشوارع ولكن أغلب \"الموضوعات\" كانت إما معلوماتية أكثر من اللازم أو إنسانية أكثر من اللازم ولكن هذا \"التحقيق\" ، تحقيق فعلاً ، فيه السرد الإنساني الجميل والمعلومات الناطقة ومزج جميل ومشوق بينهما؛ الهيبر لينك بتاع محمد كمال ممتع فعلا وفي وقته وميعاده رغم أننا يحق لنا أن تنشري باقي التحقيقات في لينك مستقل ، أعتقد أن دي مادة هامة ووثيقة مفيدة برضوه للباحثين المتميزين أمثالك ، شكرا يامروة علي التحقيق الرائع وبالتوفيق دائماً."
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923220152/http://www.20at.com:80/masr/t7kyk/11075.html"

