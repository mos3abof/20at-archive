text = "والله انتم ظالمين الراجل كتير د/نبيل اسلوبه كويس جدا وبعدين ان كان بيزودها شوية فى مدح ادهم صبرى وده اللى مش عاجبكم طب ماتشوفوا الامريكان بيعملوا فيكم ايه ... ولا هى عقدة الخواجة..."
