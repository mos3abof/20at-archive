[[comments]]
order = 15
subject = "كفانا يأس"
author = "ريم"
posted = "2006-07-10"
text = "أريد ان أعرف لماذا تعترضون على شخصية ادهم صبرى ولماذا لا يعجبكم ولمذا تريدون ان<br />يطلع على المعاش اتستغربوا انه يقفذ عبر خمسة أمتار مثلا الحل بسيط فكما ذكر المؤلف شضيا فى 61ملا ئكة الجحيم رجل المستحيل وكما لمح إلى ذلك فى كوكتيل 252000أوراق بطل بطريقة غير مباشرأن نشأته هى السبب فلقد تدرب منذ الصغر فى الخامسة تقريبا هذا إلى جانب مهاراته الخاصة كزكاؤه وجسده الممشوق والأفضل من هذا وذاك هى إرادته كمسلم وكعربى وكمصرى<br />ثم ان د نبيل دائما يذكر الجميع بأنه ادى صلاته كاملة دون تقصير حتى وهو بين براثن اليهودالعدد93أرض العدو وأوأكد أنه مهم وليس تفاهة وانه ليس هناك ما يمنع من قراته إلى جوار السيرة النبوية الشريفةوكتب الذكر ثم ماذا يحدث لو قرأنا تلك الروايات<br />استحدث كارثة مثلا ام انه من الافضل مشاهدة نانسى عجرم و روبى وأوأكد انها ليست خيال فارغ أو أكاذيب بلهاء لانها هى الرمز وفى حياتنا نحتاج دائما إلى الرمز الذى يساعدنا على المضى فى حياتنا ونحتاج قبله طبعا إلى الايمان القوى بنصر الله لنا( ألا ان نصر الله قريب)<br />أم ماذا؟؟؟؟؟؟ والحديث عن اسلوب الكاتب فأعتقد انا أن اسلوبه يناسب من هم فوق الثاثة عشر وليس ادناها كما يعتقد البعض وذلك يفسر عدم فهم الكثير للمعنى السامى الذى يختفى بين طيات هذه القصة البسيطة فإذا كنتم قد وصلتم مثلا للعشرين ولكن المعلومات المختزنة فى اعماقكم هى مثلا نتاج تفكير طفل فى العاشرة لذلك فمن الطبيعى وانتم تفكرون بها فى وضعكم الحالى ان تعتبروها تافهة وغير منطقية لذا أنا انصحكم ان تحاولوا بقدر الامكان أفراغ بعض وقتكم الثمين الذى تقضونه بين النت كافيه والتليفزيون والنادى وناصية الشارع لإعادة قراءة هذه التحفة التى لا تقدر بثمن بل هى كالهدية مجرد رمز لا أكثر<br />وعن نفسى انا افضل ملف ورجل عن اجمل الافلام وأتساءل كما تساءل البعض لماذا تستنكرون ذلك من كاتب عربى مسلم ك د نبيل فاروق الذى أعتقد أن أفكاره تناسب أفكار الفرسان ولم تستنكروا<br />فى نفس الوقت الكتاب الغربيين الذين يعيشون فى الدول العظمى ولما لا نحترم افكار غيرنا كما يحتمون أفكارنا الخلاصة ان ملف تلامس أوتار القلب والعقل ورجل المستحيل تلامس خيالك ونفسك واملك فى ان ما وعدنا به نحن المسلمين من نصر ذات يوم فالقلوب بلا امل تكون ميتةفحتى السمكة عندما تخرجها من الماء يبقى لديها امل فى ان تمطر السماء فتظل حية فهى تستطيع ان تعيش بلا ماء ولكنها لا تستطيع ان تعيش بلا ماء كذلك قلوبنا ونفوسنا<br />لا تختلف ولا تحيد عن ذلك النظام فانمر لا يحنو وإن ذاق الدماء والنسر لا يبكى وان حرم السماء<br />فى النهاية أرجو من كل من يقراذلك ان يرد عليه ويذكر رأيه بصراحة ويناقشنى كذلك فى رأيى thelegendofprodigy@yahoo.com ريم النبراوى جمهورية مصر العربية الغربية المحلة الكبرى 15 سنة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113052/http://www.20at.com/article2.php?sid=460"

