[[comments]]
order = 13
subject = "موقفنا من الخيال"
author = "زياد المصري"
posted = "2006-07-03"
text = "المشكلة هي في موقفنا من الخيال عموما في العالم العربي ، غارقين في همومنا و مشاكلنا و احباطاتنا و ليس لدينا استعداد للقراءة عن بطل خارق يهزم خمسة بيد واحدة و يتفوق على كل خصومه ، نريد أن نرى هذا البطل و هو يتفوق في ركوب المواصلات العامة و امتحان الثانوية العامة و الهروب من شبح البطالة و مغامرة البحث عن شقة للزواج ، الروايات الاجتماعية و الواقعية تلائم المزاج العربي أكثر لأنه مطحون في واقع أليم يحاصره و ليست لديه الرفاهية و لا السعة النفسية للقراءة عن الأساطير ، حتى في الأفلام نجد الأفلام الغالبة على الشاشة هي أفلام الكوميديا و الحب و المشاكل الاجتماعية (لم أسمع عن أفلام خيال علمي عربية تتعدى عدد أصابع اليد الواحدة). هل نحلم باعداد أطفالنا لينبهرو بالاختراعات و الاكتشافات ليحلوا مشاكل مجتمعاتهم أم ينبهروا بنموذج يعلمون مسبقا أنهم لن يصلوا اليه ؟<br />زياد المصري<br />مدير نظم معلومات<br />تورونتو - كندا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113052/http://www.20at.com/article2.php?sid=460"

