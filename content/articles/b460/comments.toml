order = 17
subject = "انهم لا يقرءون"
author = "زياد المصري"
posted = "2006-07-12"
text = "الأخت ريم<br />القصص مستواها الحرفي عالي جدا خصوصا في الأعداد الأخيرة و كذلك لا اعتراض لنا على الخيال لأن الخيال هوما ألهمنا أعظم الاختراعات التي كانت مجرد فكرة خيالية في أذهاننا، في الغرب كذلك يحبون الخيال العلمي و يعتبرونه جزء رئيسي من تكوينهم الفكري ، مشكلة العرب كما أوضحت سابقا أن مشاكلهم لم تتح لهم فرصة رفاهية قراءة الخيال ، هل تتخيلين أن روائع القصص الخيالية لجول فيرن و ستيفن كنج وهربرت جورج ويلز و غيرهم تقدم في الوطن العربي تحت مسميات الأدب العالمي للناشئة ؟!! كأن الكبار أكبر من أن يقرءون الخيال فيتركونه للأطفال ، في بلدان هذا موقفها من الروايات الخيالية لا تستغربي هذا الهجوم على روايات رجل المستحيل لأن العرب لم يتعودوا على روايات تتحدث عن بطل خارق ، يبدو الموضوع مبتذلا جدا في بلاد تكافح للتخلص من التخلف و الاستعمار و الحصول على المعونات ، لوتريدين رأيي ، روايات أدهم صبري لا تقل روعة و تشويقا عن أعظم روايات الخيال العالمية و أنا أستمتع بقراءتها كثيرا بين الحين و الأخر ، تابعي قراءاتك و لا تلتفتي لمهاجمي الخيال ، فانهم لا يقرءون<br />ملحوظة : دهشت من عمرك الصغير و كلامك الكبير الموزون ، تحية الى نبيل فاروق الذي صنع من صغارنا هذه العقلية<br />زياد المصري<br />مدير نظم معلومات<br />تورنتو ، كندا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113052/http://www.20at.com/article2.php?sid=460"

