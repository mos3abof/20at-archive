subject = ""
author = "محمد"
posted = "2009-08-29"
text = "والله مش الشاب لوحده هوا اللي غلطان<br />كمان البنات غلطانين<br />لان لو البنت لابسة محترم زي الناس مكنش الشاب هيبص عليها"
archived = "2009-08-30"
capture_url = "https://web.archive.org/web/20090830164911/http://www.20at.com:80/20at/7ayatna/13102-2009-08-29-11-45-29.html"

[[comments]]
order = 2
subject = ""
author = "جيـــــــــمـي"
posted = "2009-08-30"
text = "الموضوع ده لامس الشباب كلهم أكيد<br />بس انت ليه ماجبتش سيرة البنات وأنهم المفروض يحترموا نفسهم شوية في طريقة لبسهم ومشيتهم وكل حاجة .<br />وكمان الى مساهم في مشكلة المعاكسات وإنعدام غض البصر هو عدم قدرة الشباب على الزواج فبالتالي ممكن يعملوا أى حاجة .<br />ماينفعش يا جلال أشغل قناة بورنو وانا جنبي أطفالى قاعدين وأقولهم ما تتفرجوش مثلاً .<br />وماينفعش أجيب واحد بيمشي فى الشارع يبص يمين يلاقي موزة .. شمال هكذا قدامه ووراه برده نفس الكلام … للأسف أنا مش بحب اقول الكلام ده بس ده الحقيقي و الواقعي … من الآخر لو عايز فعلاً تغض بصرك 100% .. أقعد في البيت وأدعي أن جارتكم ال البلكونة بتطل عليها ما تكونش تبع نظام الحرية وبتاع"
archived = "2009-08-30"
capture_url = "https://web.archive.org/web/20090830164911/http://www.20at.com:80/20at/7ayatna/13102-2009-08-29-11-45-29.html"

