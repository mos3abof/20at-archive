author = "الشيخ الشكسي"
posted = "2009-08-29"
text = "عندما كنا شباباً كان واحدنا يمشي و عيناه بالأرض و كان غض البصر عادتنا .<br />أما الآن فيعاني شبابنا من غياب القدوة الصالحة .<br />فالشباب اليوم يقتدون بميكل جكسن و مردونا .<br />و هنا يأتي السؤال هل يغض ميكل جكسن بصره ؟ و هل تغض مردونا بصرها ؟<br />و الجواب طبعاً لا و سيظل لا حتى يجد شبابنا قدوة صالحة يقتدون بها .<br />و السلام عليكم و رحمة الله ."
archived = "2009-08-30"
capture_url = "https://web.archive.org/web/20090830164911/http://www.20at.com:80/20at/7ayatna/13102-2009-08-29-11-45-29.html"

[[comments]]
