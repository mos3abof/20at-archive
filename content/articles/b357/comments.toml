order = 1
subject = "وماذا الان"
author = "مواطن ليبى"
posted = "2006-10-26"
text = "السلام عليكم ورحمة الله وبركاته<br />والان وبعد حوالى 9 اشهر من هذا المقال هاهى القنوات الليبيه تظهر عبر الفضائيات فمثلاً قناة الليبيه الفضائيه وأعتبرها ناجحه بكل المقاييس ولا ترتبط بأى صله بالثوره او أى شىء وكذلك قناة الهدايه الليبيه وكذلك قناة النادى المنوعه وكذلك قناة ليبيا الرياضيه كلها قناة ولا أروع قنوات لها انفتاح فكرى رائع .<br />ولكن أخى كاتب الموضوع لماذا لم تفكر إلا فى ليبيا لماذا لم تفكر فى باقى الدول العربيه مثل تونس فإن كل صحفها لدوله ولها تدخل قوى من الدوله على هذه الصحف وهنا عندما أقول الدوله اعنى الحزب الحاكم .<br />ولماذا لم تتكلم عن المملكه السعوديه وقنواتها وإعلامها وتدخل السياسه فى الصحف وكذك القنوات التى أعتبرها عاهره والتى لا تعمل فى شىء سوا الاغانى والراقصات فإنى أستحلفك بالله أيهما أفضل ان تكون الصحف والقنوات سياسيه او كما يحلوا لك ان تسميها أن الحكم يسيطر عليها او تلك القنوات التى تخالف الدين والسنه فلماذا لم نشاهد مقالك يتكلم على تلك القنوات او تفضل السياسه على الدين .<br />فلماذا لا تتكلم على تلك الدول او الصحف التى تصدر فى تلك الدول العربيه وتصدر فيها الصحف باللغات الاخرى مثل الفرنسيه والانجليزيه وليس بداعى ان يقرأ الاجانب تلك الصحف بل لان شعوبها تفضل هذا الشىء لان ثقافتهم العربيه ولغتهم العربيه لا شىء بل ثقافتهم اجنبيه وللعلم فإن الدين الاسلامى نزل باللغه العربيه .<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143307/http://www.20at.com/article2.php?sid=357"
