text = "ولن ينصلح رغيف العيش حتى ولو رفعوا سعرة الى جنية<br />لان الجشع راكب اصحاب المخابز وعايزين ي[ *** ]بوا اكتر ويخلطوا نصف الدقيق ردة<br />ارغفة لا تصلح الا لاكل الفراخ والبط<br />اذا اردت ان تصلح الرغيف اصلح الانسان اولا<br />احيانا اصعد فوق سطح البيت فى الحى الشعبى الذى اسكنة - الاحظ ان السكان مرصصين الارغفة فى البلكونات والاسطح للتنشيف تحت الشمس ثم يدقونة ويصنوعونة علف للدجاج والبط<br />لانة حقيقة لا يصلح للاستخدام الادامى"
