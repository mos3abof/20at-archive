subject = "الى سعودى محظوظ جدا"
author = "روضة"
posted = "2006-04-13"
text = "الى الاخ السعودى المحظوظ جدا انا فعلا مؤمنة انك فعلا محظوظ جدا بس للا سف انت مسيىء للشعب السعودى انت وامثالك فى درجة تفكيرك انت فعلا محظوظ انت غبى غبى لدرجة الحظوظ اة ما انت محظوظوعيب انك تسيىء للدول الثانية وهذا خطا"
archived = "2006-11-02"
