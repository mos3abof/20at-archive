text = "لييه دايما المواضيع تكون فيهااشاره للسعودين بسلبيه !<br />ويين السوريين و المصريين و الاردنيين ..!ولا ذا بسبب الحقد و الحسد على السعوديه و اهلها..؟!<br />الى الجاهل اللي كتب الموضوع: لمعلوماتك يا حبيب قلبي هذا العام 1.5 مليووون حاج سعودي ادوو الفريضه ،، لا و بعد العنوان ( رافضون للحج)! رفضتك الجنه قل اميــن"
