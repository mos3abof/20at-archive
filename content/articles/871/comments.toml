[[comments]]
order = 6
subject = "طقوس"
author = "رافض للحج"
posted = "2006-06-22"
text = "الى متى سنبقى نطوف ونطوف ؟ ولماذا ؟ وماالحكمة من ذلك غير تضييع الوقت ؟ أي شيء آخر نفعله هو أحسن من هذه الطقوس التي ليس منها الا البلاء والنكد والزحام والتدفيش وتداخل الحابل بالنابل والرجال بالنساء ! أوليس غريبا ان يكون هذا التداخل بين الرجال والنساء مسمموحا في الحج ومحرما في الجامع ؟ بل اذا دخلت النسوة الى الجامع يجلسن في الصفوف الخلفية حتى لايرى المصلون الذكور قفاهن اثناء السجود وكأن لاشيء يشغل بال المصلين وهم في حضرة رب العالمين سوى قفاهن ! اذا كان الامر كذلك فعلا فياعيب الشوم , واذا لم يكن كذلك فليس لهذا معنى أصلا . اي امراة في اي بلد اسلامي لابد لها ان تسمع تعليقا او تلطيشا اثناء مرورها في اي شارع , وحتى في الحج فهي بحاجة الى محرم يرافقها حتى لاتتعرض لشيء من هذا , لانها اذا كانت وحدها فسيتم اغتصابها حتما حتى في بيت الله الحرام , أليس كذلك ؟ واحسرتاه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124236/http://www.20at.com/article2.php?sid=241"

