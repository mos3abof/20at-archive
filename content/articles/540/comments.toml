[[comments]]
order = 9
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-19"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102936/http://www.20at.com/article2.php?sid=64"

[[comments]]
order = 10
subject = "الللهم انصر الاسلام"
author = "شاب مسلم"
posted = "2006-10-14"
text = "السلام عليكم ورمضان كريم مش عارف بجد اقول ايه للاخت الكريمة اللى كتبت الموضوع اللى كلمة رائع او جميل قليلة اوى عليه وعايزة اقوله اللهم يثبت ايمانك وايماننا ويكثر من امثالك وبجد انا اللى فرحنى اوى بالموضوع انى بعشق موسم الشتاء جدا جدا فوق ما اى حد يتصور وبستناه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102936/http://www.20at.com/article2.php?sid=64"
