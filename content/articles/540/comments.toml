[[comments]]
order = 0
subject = "جزاكم الله خيرا"
author = "حبيبة محمد"
posted = "2005-12-13"
text = "بارك الله فيك يا أخت مروة ، أنا حقا كنت فلى أشد حاجة لسماع هذا الكلام الجميل . لقد ذكرتينى بالصيام وذكرتينى بقيام الليل الذى أفتقده وأشتقت الى الوقوف بين يدى الله عزوجل . ربنا يبارك لك ويعزك على هذا العلم الذى ما بخلتى به على الناس ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102936/http://www.20at.com/article2.php?sid=64"

[[comments]]
order = 1
subject = "لاتنسوا صيام ذو القعدة"
author = "الدال على الخير كفاعله"
posted = "2005-12-14"
text = "اليوم هجري ميلادي<br />الخميس 15 / 12 / 2005<br />الجمعة 16 /12 / 2005<br />السبت 17 / 12 / 2005<br />أبي هريرة رضي الله عنه قال : أوصاني خليلي بثلاث: بصيام ثلاثة أيام من كل شهر، و ركعتي الضحى، وأن أوتر قبل أن أنام - صحيح البخاري<br />عن عبدالله بن عمرو بن العاص رضي الله عنهما قال : قال رسول الله صلى الله عليه وسلم: \"صوم ثلاثة أيام من كل شهر .. صوم الدهر كله\" - متفق عليه<br />عن أبي ذر رضي الله عنه قال : قال رسول الله صلى الله عليه وسلم: \" إذا صمت من الشهر ثلاثا فصم ثلاث عشرة، و أربع عشرة، و خمس عشرة\" - رواه الترمذي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102936/http://www.20at.com/article2.php?sid=64"

[[comments]]
order = 2
subject = "إيه ده ؟؟؟؟"
author = "يعني الموضوع حلو قوي ،،، وجمييييييييل ،،، وكل حاجة بس إزاي يا عشرينات تكتبوا الرسول ( ص) ؟؟؟؟ وعمر ( ر) ؟؟؟ إيه مستخسرين تكتبوا الصلاة على رسول الله !!!!"
posted = "2005-12-23"
text = "الله صلى على محمد وعلى آله وصحبه وسلم<br />ربنا يهديكم ويسامحكم !!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102936/http://www.20at.com/article2.php?sid=64"

