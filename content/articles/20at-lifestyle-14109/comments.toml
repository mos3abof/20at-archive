author = "ابو حسين"
posted = "2009-11-20"
text = "حسبنا الله ونعم الوكيل فى كل خاين يا عرب<br />انا مواطن مصرى عايش فى السعودية والله اللى شفته فى السعودية انهم يحبون مصر ويكننون لها كل احترام شباب فى الشارع والله ما بعرفهم ممررت عليهم واذا بهم يقولون مصر ام الدنيا قلت نعم ادعو لنا واذا بهم يقولون انشاء الله فايزين وعلى كاس العالم علطول<br />موقف…<br />وغيرهم زعلانيين بعد الهزيمة تدرون ليش لان الاخلاق الحلوة انهزمت<br />وردود الافعال طيبة للغاية هنا فى السعودية<br />ولكن شويت الشمامين الجزائريين دول لازم يتربوا ازاى بمقاطعتهم رياضيا وصدقونى لو الرئيس مبارك بعت مع المصريين مجموعة من الصاعقة او الحرس الجمهورى لكان ساقوهم زى الكتاكيت<br />تصدقوا انى الآن عرفت قيمة الصياعة انت عارف عندنا فى شبرا والبطنية والجيزة والمقطم وغيرها شويت بلطجية اووووووووووف الجزائريين لا ينفع معهم غير دول<br />ياناس احنا باعتين الفنانين والمثقفين على النقيض باعتين الشمامين"
archived = "2009-11-23"
capture_url = "https://web.archive.org/web/20091123233723/http://20at.com:80/20at/lifestyle/14109-2009-11-19-14-39-19.html"

