text = "والله عيب اخواني الكرام على ما يجري من قصف إعلامي بعد المباراة، اتهامات بالإرهاب، مطالبة بغلق سفارة بلد، تجريح في الأشخاص والهيئات…<br />ما عساني إلا أن أقول كما قال النبي صلى الله عليه وسلم عندما استفاق من منامه وقد رأى قوم يأجوج ومأجوج، قال: \"ويل للعرب من شر قد اقترب..\""
