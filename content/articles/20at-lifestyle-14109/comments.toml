text = "اولا نحنا عرب ومسلمين اكبر عيب كل ما حصل من مصرى او جزائراى<br />نحنا مسلمين اولا وكل ما حصل هذ دسياسة وسوف تفضل مصر والجزائر امة واحدة<br />هل كل هذ علشان كرة عياب عيب جدآ اين الروح الرياضية<br />وارجو كل واحد ان يقول الحق ليس جزائرى او مصرى نحنا امة اسلامية<br />استغفر الله"
