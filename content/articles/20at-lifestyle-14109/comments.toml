subject = ""
author = "ريم المصراوية"
posted = "2009-12-22"
text = "على فكرة مش هينفع اللي الجزائر عملته يعني ضربونا و شتمونا و ليكو عين كمان تتكلمو حرام عليكم ده احنا خسرنا و عملتو فينا كدة امال لو كنا كسبنا كنت عملتو ايه انتو اساسا متغاظين من مصر و ربنا الحمدلله خلانا نخسر و انشاء الله هتخسروا في كاس العالم عشا تعرفو ان ربنا حق انا مش عارفة انتو ازاي عملتو كدة و مفكرتوش ان ربنا شايفكو و اللي عملتوه ده و لا الارهاب ايه الغباء ده احنا عرب و بعدين دي كورة يعني خسارة و فوز<br />مش عارفة ايه ده انا عن نفسي مستغربة الجزائريين بجد وقعو من نظرنا ده احنا كنا هنشجعكو عشان انتو عرب زيينا بس بعد اللي انتو عملتوووه احنا هنشجع اللي هيلعب ضدك اصلا انشاء الله ربنا هينصرنا و هتخسرو باذن الله و مش هتوصلو لكاس العالم و انت ياللي بتشتم مصر اساسا انت متغاظ و متضايق لان احنا شعب محترم سيبنا امرنا لله و حسبي الله و نعم الوكيل فيكو و برضو مصر ام الدنيا و انا مصرية انت ميييين ريم المصرااااوية"
archived = "2010-01-08"
capture_url = "https://web.archive.org/web/20100108105714/http://www.20at.com:80/20at/lifestyle/14109-2009-11-19-14-39-19.html"
