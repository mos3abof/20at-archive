subject = "الى ابن رشد........!!!!!!!!1"
text = "لقد اعجبني رايك المهذب جدا ويبدو انك ادمنت مخاطبة الرجال .. فامتلكت مفاتيح الكلمات ...<br />واصبحت ..تنتقي اطايبها .. !!<br />يبدو كذلك ان طريقتك المهذبه في الكلام .. ترسم للقاريء .. شخصية مليئة بالفكر والمهارة الصحفية التي تجعلهاقادرة على نقد الآخرين ..<br />اتمنى ان ارى لك قلمايليق بمن تنتسب الى اسمه يا \"ابن رشد\" .<br />وختاما .. اقول لك الى اللقاء .. يا معلم الرجال .. كيف يكون الكلام ...."
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022160917/http://www.20at.com:80/article.php?sid=614"

