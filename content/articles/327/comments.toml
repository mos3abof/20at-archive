[[comments]]
order = 6
subject = "موقع عشرينات"
text = "قراء عشرينات الأعزاء..<br />تحية طيبة وبعد،<br />نعتذر عن أي خطأ فني يحدث في الموقع منذ أمس، وهذا يرجع إلى قيامنا بتغيير السيرفر Server الذي يعمل عليه موقع عشرينات، على أن الموقع سيعود بإذن الله لهئيته الطبيعية خلال 48 ساعة على أقصى تقدير إن شاء الله، ونود أن نعتذر عن أي خطأ أو عطل فني سوف يحدث خلال تلك الفترة.<br />ونود أيضاً أن ننوه أن السيرفر الجديد سوف يوفر خدمات جديدة لم تكن متوفرة لسابقه، حيث سيتم بإذن الله خلال ثلاثين يوماً البدء بخدمتي البريد الإلكتروني وساحة الحوار، من أجل توفير خدمات أكثر لقراء عشرينات الأعزاء.<br />وأرجو أن تقبلوا كامل اعتذارنا عن أي عطل فني يصيب الموقع، ونطمئنكم أن الموقع بكامل موضوعاته سوف يعاود الظهور عقب عملية النقل ونرجو من قرائنا الكرام أن يراسلونا على contact20@yahoo.com في حالة ملاحظة أي عطل فني..<br />وشكراً لحسن تعاونكم والسلام عليكم ورحمة الله وبركاته"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022160917/http://www.20at.com:80/article.php?sid=614"

