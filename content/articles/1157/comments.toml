subject = "موضوع رائع يليق بموقع رائع"
author = "ali_nfn"
posted = "2006-09-03"
text = "موضوع رائع يا أستاذ أحمد يوسف يليق بمطربة رائعة كسعاد ماسي يليق بموقع رائع كموقع عشرينات<br />أرجو من شباب عشرينات ألا يلتفتوا إلى كل تكفيري يأتي إلينا<br />فمعظمهم يرى ان الموقع مربوط بجماعة الأخوان لربطه بموقع اسلام اون لاين<br />ولابد ان نثبت اننا قادرون على التميز والابداع ومحيين لكل مبدع عربي متميز يحترم فنه وجمهوره.<br />تحية من الفلب لشباب عشرينات المجتهد وللأستاذ احمد يوسف<br />علي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133324/http://www.20at.com/article2.php?sid=1129"

