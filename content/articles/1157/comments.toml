[[comments]]
order = 7
subject = "بس انت وهو"
author = "عبدالله مفتاح"
posted = "2006-08-09"
text = "بس يا غبي انت وهو يا متخلفين انتو ارهابيين ولا ايه؟<br />انتو اكيد بتنحدروا من سلاله متطرفين<br />فيها ايه لما الموقع نزل صورة بنت مش محجبة<br />مهو انت في الشارع بتشوف بنات كتير مش محجبات وبعدين هل من المعقول انك مش بتسمع اغاني اذاكان ده حقيقي يبقى معانا اكبر دليل على انك من جماعه التكفير والهجرة<br />اوعى يا حمدي تكون انت حمدي اللي انا اعرفه لان حمدي اللي انا اعرفه ليمكن يقول كلامك ده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133324/http://www.20at.com/article2.php?sid=1129"

[[comments]]
order = 8
subject = "انا جايه اهدى النفوس"
author = "نيفين نيفى نوفا"
posted = "2006-08-10"
text = "اولا انا شايفه ان الموضوع كاعاده ميستاهلش اننا كالعاده برده نشتم بعض<br />طيب خلو دا لحاجه مهمه او لموضوع ذو قيمه يا جماعه<br />و بصرف النظر البنت محجبه او صوتها حلو او متبرجه او او او انا شايفه ان مش من حقنا نحجر على راى الناس بمعنى<br />بلاش نقول على اللى بيسمع اغانى كافر و بلاش برده ندعو الناس بالعافيه انهم يسمعوا اغانى و الا يكونو متطرفين<br />كل واحد مسئول عن نفسه ادام نفسه و ادام ربنا<br />و كل انسان الزمناه طائره ف عنقه<br />يارب تكون الرساله واضحه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133324/http://www.20at.com/article2.php?sid=1129"

[[comments]]
order = 9
subject = "محمد حسان والتكفير"
author = "محمد حسان والتكفير"
posted = "2006-08-10"
text = "انهال العشرات من المصريين بالضرب علي امام مسجد في محافظه بورسعيد شمالي البلاد لانتقاده حزب الله لبنان .<br />وقالت صحيفه \"المصري اليوم\" المصريه اليوم ان امام المجمع الاسلامي الكبير في مدينه بورفواد بمحافظه بورسعيد ويدعي الشيخ محمد حسان فوجي‌ء بعد انتهاء خطبه الجمعه امس بعشرات المصلين ينهالون عليه ضربا وركلا حتي نزف الدم منه وانه لم ينقذه من بين ايدي المصلين الا رجال الامن.<br />واوضحت ان الشيخ حسان \"انتقد حزب الله مروجا لفتوي لرجل دين سعودي عن حرمانيه نصرته الامر الذي اثار المصلين الذين هددوه بالقتل ان عاد للمسجد مره اخري\".<br />واشارت الصحيفه الي ان هذه الواقعه هي الثانيه خلال اسبوع واحد التي تحدث في مصر التي يتمتع فيها حزب الله لبنان وزعيمه حسن نصر الله بشعبيه كبيره."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133324/http://www.20at.com/article2.php?sid=1129"

[[comments]]
order = 10
subject = "ههههههههه"
author = "واحد من بلاد النعمان"
posted = "2006-08-11"
text = "مساء الفل او صباح الخير علي توقيت جرينتش بقي ..انا دخلت علشان انزل اغاني سعاد ماسي لان صوتها من احلي الاصوات اللي مسعتها ..معرش ايه بقي حوار القفش اللي انتو فيه ده ..ديه مجرد مغنيه ..وكمان يا عم اللي بتعيش انتا وهوا بلاش حوارت كل واحد عارف نفسه ومقدرها كويس وانتو مش عارفين تعملو حاجه بره بتيجو تتشطرو علي النت لان مفيش حد شايفكم ولا عارفكم ..بس والله هيا مش بتيجي كده .الناس اللي عرفت تخش علي الموقع ده اكيد متعلمه وفاهمه الدنيا كويس ..يعني عايز تنفع حد روح انفع نفسك واللي جاب حديث وبيحطو علشان يثبت وجهة نظره بقولو صباح الفل بيرة وكحول ..الناس كلها عارفه الحرام من الغلط بس انتا والله اللي شاكلك مش عارف حاجه وحاول تعلم نفسك احترام الناس قبل ما تحترم نفسك ..وكمان يا عم الجامد انتا يا متدين يا محترم ياللي بتقول متبرجه ومش متبرجه ..ممكن اقولك اقرب حاجه ليك روح بص لوالدتك ولا لاختك ولازم تلاقي حته تبرج صغيره بس والله العظيم وحلفان اتحاسب عليه هتلاقي ..ههههههههه قالك متبرجه فال..ياعم اديك بعنف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133324/http://www.20at.com/article2.php?sid=1129"

