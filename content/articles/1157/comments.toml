subject = "سؤال بريئ"
author = "مصطفى"
posted = "2006-08-09"
text = "السلام عليكم<br />ما هو الانتماء السياسي لهذا الموقع، والذي دفعني الى طرح هذا السؤال تعليقات المبشرين بالجنة على موضوع سعاد ماسي،،<br />اريد من ادارة الموقع اجابة صريحة،، هل هذا الموقع امتداد للقسم الاعلامي في الجماعة الاسلامية او تنظيم القاعدة؟<br />وشكرا"
