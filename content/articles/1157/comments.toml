subject = "الاخ حمدى و الاخت سوسة"
author = "واحد مسلم"
posted = "2006-08-09"
text = "غفر الله لنا و لكم..........<br />هل تشكان أن هذا تبرج؟؟....<br />أم هل تشكان أن التبرج حرام أصلا؟؟....<br />و الى هذا الحد تندهشان أننا لا نسمع الأغانى؟؟....<br />نعم لا نسمع الاغانى...<br />و الأخ اللى بيقول \"تكفير و هجرة\"!!!<br />لا اله الا الله.......الحق اصبح تخلف و أمسى تكفيرا و هجرة"
archived = "2006-11-02"
