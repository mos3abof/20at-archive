subject = "ايه التخلف ده"
author = "سوسة"
posted = "2006-08-09"
text = "هو فيه ايه هو ربنا مش هايرحمنا من المتخلفين اللي بيبصوا على الحياة بطريقتهم الغبية دي بقى، وايه اللي متبرجه واغاني يعني انتوا عايزين تفهموني انكم ما بتسمعوش اغاني<br />ربنا يهديكم ويهدينا بس خليكوا طبيعين شوية الموضوع حلو قوي ياعشرينات ولا يهمكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133324/http://www.20at.com/article2.php?sid=1129"

[[comments]]
