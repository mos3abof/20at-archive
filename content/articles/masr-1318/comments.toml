[[comments]]
order = 7
subject = "موضوع متميز"
author = "محمد- صحفي"
posted = "2006-12-19"
text = "الموضوع جميل ومتميز وللاسففي ناس مش بتحب الا انها تسمع اشايء معينهعندهم الصحف الصفراء يبجوها هتعجبهم اوي سواء بتمدح الاخوان او بتلعن فيهم كدا كدا صفراء<br />الموضوع جميل جداً ومتاصل في الشعب المصري بشكل خاص وخصوصاً في الاقاليم بس مش بيكون باسم دلع انما بيكون اسم اخر<br />زي مثلاً هاشم تلاقي كل البيت بينده بايمن<br />محممود اسمعهم بيقلوله اشرف ودا بعيد عن الدلع خالص انما جرت العاده ان يكون ليه اسم غير المكتوب في شهادة الميلاد"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219115538/http://masr.20at.com:80/article.php?sid=1318"
