text = "اولاً انتي موضوعك لذيذ جدا و دمه خفيف<br />و ثانيا اسمحيلي ارد على اللي كاتب ان عرشينات في النازل..انا بصراحة مكنتش بقرا عشرينات زمان بس كل اللي اقدر اقوله انه ا عاجباني جدا دلوقتي..ثانيا انا مش قادره اصدق ان في حد بيقرالبراء ويبقى معترض عليه بجددد براء من اللي بقرالهم بعد احمد خالد توفيق وانا راشية عن العالم"
