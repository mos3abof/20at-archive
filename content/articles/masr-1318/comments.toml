order = 4
subject = "اسماء حركية"
author = "waleed68"
posted = "2006-12-18"
text = "موضوع متميز وشكرا للكاتبة<br />وارى ان هناك قسوة من بعض التعليقات... اتهامات لا معنى لها .<br />ويمكن ان اضيف ان هناك العديد من الدراسات تؤكد ان عادة الاسماء الغير حقيقية ترجع للفراعنة واعتقداهم الراسخ بضرورة وجود اسم اخر بديل للشخص لعدم استخدام اسمه الحقيقى لايذائهبالسحر.<br />اما الان فتستخدمه التنظيمات السياسية السرية كأسماء حركية لكى لا تتمكن اجهزة الامن من القبض عليهم .<br />وعلى فكرة هذا الموضوع يحتمل الكثير من النقاش الجاد والمحترم."
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219115538/http://masr.20at.com:80/article.php?sid=1318"

