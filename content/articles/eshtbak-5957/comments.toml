subject = ""
author = "فهد الاسلام"
posted = "2007-05-21"
text = "بسم الله الواحد الا حد الاستاذ عمرو خالد هو شخصية محترمة ويدعو الى الله بس عليه بعض السلبيات التى لا نعلم هل هو يعلمة او لا يعنى انا عندى تحفظ عليه فى مسالة غناء الفنانات والتمثيل فهو يقول عاوزين تمثيل هدف وغناء هدف وهذا ليس من الا سلام فى شى بعض الا حاديث التى يرويها به بعض الغلطات وهو يذكر عادل امام ورية هل عادل امام قدوة حتى يهتم با مرة ثانيا ان عمر الين ما ينفصل عن السياسة لانهم مكملين لبعض ولكن مع كل هذا نحن نحترم عمرو خالد لانه احسن من كثير غيرة من الدعاة الذين ارتمو فى حضن السلطة زى خالد الجندى وغيرة ويكفى على عمر و خالد انه داعية الشباب الا ول ويا ريت يلتقى بالشيخ محمد حسان ويكزن فية تعاون بينهم فاكل يعمل لصلح الدين وعمرو خالد يدعو للتعايش فيمكن ان الكل يتعايش ويا تى اليوم الذى نرى فية كل علماء الا مة يد واحدة وكلمة واحدة وفقكم الله الى الخير وجزا الله عمرو خالد خيراء"
archived = "2009-05-07"
capture_url = "https://web.archive.org/web/20090507180643/http://www.20at.com:80/eshtbak/5957.html"

