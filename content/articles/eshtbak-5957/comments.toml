posted = "2007-05-27"
text = "انا بحب عمرو خالد من اول ماشفت برنامج ونلقى الاحبة هو اول برنامج ليه واروع برنامج بجد روعة اخويا اللي كان عمره وقتها 5 سنين كان بيسيب قنوات الاطفال ويعد يتفرج زيينا باهتمام شديد وهو من معجبيه لغاية النهاردة بجد ربنا يجازيه خير وانادعيت له كتير اوي<br />بس انا مع ان رحلة الدنمارك دي كانتسبب التكريم زي ما هو بيقول الا انها نزلت شوية من اسهمه عندي لانها عملت تفرقة بين علماء مسلمين كانوا حاجة واحدة قبل كده وسمعت كلام اتقال عنه معجبنيش بس مش عايزة اقوله لاني ما اعرفش ان كان صحيح ولا لا<br />عموما وايا كان اللي اتقال ده مايقللش من احترامي الشديد ليه ودعاؤنا جميعا له ولابويه ولا سرته"
archived = "2009-05-07"
capture_url = "https://web.archive.org/web/20090507180643/http://www.20at.com:80/eshtbak/5957.html"

