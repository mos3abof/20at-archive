subject = ""
author = "مصري"
posted = "2007-05-22"
text = "انا حبيت عمرو خالد لما اتفرجت على برنامج \"على خطى الحبيب\" وحسيت أني لقيت كنز في البرنامج ده<br />لقيت حلول لكتير من مشاكل الحياة في سيرة الرسول عليه الصلاة والسلام ولقيت أن الدين مش تزمت ولا عصبية بالع[ *** ] رحمة وحب وتعاون واتحاد وقوة انا حبيت الصحابة جدا وابتديت اقرا عنهم وشفت إزاي كانوا مختلفين فيهم الغني وفيهم الفقير بس بيجمعه حب ربنا وبلادهم وإزاي كان في أخلاق في الجاهلية للأسف مفتقدينا انهارده في عز التقدم والمجنية<br />وزاد احترامي لعمرو خالد ولفكره اكتر واكتر مع برنامجه دعوة للتعايش وإزاى الامام ابو حنيفة والامام مالك والامام الشافعي والامام ابن حنبل كانوا بيختلفوا مع بعض لأني عانيييييت كتير من \"الفرقة\" بين المسلمين وبشوف ناس بيختلفوا مع بعض على اتفه الأمور وخايف فعلا لايوصل بينا الحال زي العراق ولبنان ولا حتى فلسطين والسودان<br />ربنا يوفقك يا عمرو خالد"
archived = "2009-05-07"
capture_url = "https://web.archive.org/web/20090507180643/http://www.20at.com:80/eshtbak/5957.html"

[[comments]]
order = 3
subject = ""
author = "Romantic Rose"
posted = "2007-05-22"
text = "الحمد لله وحده .. الحمد لله الذي لا ينبغي الحمد لغيره .. ربنا اعزك يا استاذ عمرو و علاك و رفع شأنك و نصرك علي كل مُغرض نال منك و شكك ف نيتك لما رُحت الدانمارك .. و ربنا وحده العالم بالنوايا و المُطلع علي ما ف القلوب .. و علي رأي كلمات تتر برنامج دعوة للتعايش .. المشكلة م البداية التفتيش ف النوايا .. لو كل واحد بس يخليه ف نفسه و يُحسن الظن بالناس و يلتمسلهم العذر أو ينظر للموضوع من نفس المنظور .. اكيد مشاكل كتير كانت اتحلت و مشاكل كتير مكنتش حصلت اصلا ..<br />بس ف النهاية لا يصح الا الصحيح .. و اللي يمشي وراء فطرته يعرف الصح م الغلط بالسليقه .. مش محتاجه تفكير و تحليل و منطقه .. اللي يتكل علي الله فهو حسبه و نعم الوكيل .. مبروك علي الجايزة شرفها بانك من حامليها<br />و مبروك علينا انك الشخصية المصرية و العربية الوحيدة اللي جريدة محترمة و صريحة زي التايمز شافت انه مؤثر ايجابا ف العالم العربي و الاسلامي .. للأمام دائما ان شاء الله"
archived = "2009-05-07"
capture_url = "https://web.archive.org/web/20090507180643/http://www.20at.com:80/eshtbak/5957.html"

