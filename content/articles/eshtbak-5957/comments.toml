posted = "2007-06-16"
text = "ربنا معاك يا عمرو و متسمعش لحد, و انا واحدة من الشباب و بقولك اننا محتاجينلك اد ما الاسلام محتاجك دلوقتى..<br />شبعنا من الضحك اللى بقى على نفسينا اكتر من انه يكون من قلبنا..<br />يا رب يوفقك و ينصرك.. و ينصر الاسلام اللى اتظلم بأدينا اكتر ما اتظلم بأيد اعداءه"
archived = "2009-05-07"
capture_url = "https://web.archive.org/web/20090507180643/http://www.20at.com:80/eshtbak/5957.html"
