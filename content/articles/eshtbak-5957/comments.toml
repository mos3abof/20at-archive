author = "نيفين نيفى نوفا"
posted = "2007-05-21"
text = "شفت مقاطع من اجولته و سمعت اجزاء من الكلمه الجميله اللى القاها ف لقائه مع مسلمى امريكا<br />و استطيع انى اقول ان اللى عمله عمرو خالد حتى الان شىء كويس جدا<br />وحتى لو التكريم ده جاله ضمن الاجنده الامريكيه زى ما بيدعى البعض فهذا يعنى انه مؤثر<br />و هذا يكفى"
archived = "2009-05-07"
