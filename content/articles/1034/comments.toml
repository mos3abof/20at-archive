[[comments]]
order = 3
subject = "المانيا يا اكسلانسات"
author = "المعرض المانيا وبس"
posted = "2006-01-25"
text = "طريقة عرض بسيطة مريحة للنفسية والنظر وكل حاجة<br />الناس دي بتفهم عارفين لية<br />لانهم مش جايين علشان يبييعوا كتب ولا ينقلوا ثقافة لا<br />جايين علشان يصدروا حضارة الموضوع كبير بالنسبة ليهم وهايف طبعا بالنسبة لينا بجد انا جالي ذهول من المنظر المحترم<br />وزير الخارجية جة المعرض وكان شخص في غاية الحضارة من غير ظيطة ولا ظمليطة<br />عايز تعرف المانيا اقرا لجوتة وعن جوتة بالذات الشخص دة روائي عالمي اختلف الكثيرين المان وغيرهم هل مات مسلما ام لا<br />الناس دي بتفكر وياريت نفكر زيهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131325/http://www.20at.com/article2.php?sid=326"

[[comments]]
order = 4
subject = "حب ووفاء"
author = "aroundu_4@yahoo.com"
posted = "2006-01-25"
text = "اتقدم لكم بخالص الشكر لما بادرتموه بحذف التعليق الأكثر بذاءة الذي ليس له مكان إلا الأوكار المغلقة بهدف الدعارة النجسة.<br />كما أتقدم لإدارة الموقع برجاء حار بحذف التعليقات الغير مرغوب فيها.فهذه ليست المرة الأولي فقد سبقت تعليقات أكثر بذاءة حول موضوع ( اغتصاب الضغيرات ) وقد تم حذفها بعدما مضي وقت كبير.<br />كما اتقدم بالعرفان لكل من اضاف تعليق حول تلك النقطة.<br />وأخيرا وليس آخرا اتقدم إليكم بإقتراح حول إتاحة مساحة لزوار الموقع لإضافة بعض أطروحاتهم وأفكارهم ليع الفائدة علي الجميع.<br />وللكل جزيل الشكر.<br />مخلص لعقيدته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131325/http://www.20at.com/article2.php?sid=326"

