subject = "بذاءة اللسان"
author = "aroundu_4"
posted = "2006-01-25"
text = "لا اتصور وانا أقرأ هذا المقال ان أقرأ تعليق بهذه الفجاجة ونجاسة النطق كما اني لا أتصور ان يكون المراقبين علي الموقع صد تلك الألفاظ النابية التي تعبير عن انسان خسيس يقصد اشباع جسده لا روحه وعقلبه بل حتي قلبه .<br />عذرا التعليق أثارني .<br />كما لا أستطيع حت الشكر علي هذا المقال ردا علي نشر ذلك التعليق......"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131325/http://www.20at.com/article2.php?sid=326"

