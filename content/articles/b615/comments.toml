subject = "ربنا ينتقم منهم"
author = "عامل"
posted = "2006-03-25"
text = "الله ينتقم منها اسرائيل اللي بتعمل في الناس هيك، ان شاء الله مرض الانفلونزا بقضي على اليهود واحدا تلو الاخر."
