subject = "ضاعت"
author = "طماطم"
posted = "2006-03-26"
text = "بصراحة اللى اقدر اقولة ان حاجة واحده بس وهية ان كرمتنا ضاعت خلالالالالالالالالالالاص بجد حسبى الله ونعم الوكيل فى العرب<br />هما السبب فى اللى احنا فية دا<br />ضاعت كرمتتتتتتتتتتتتتتتتتتنا"
archived = "2006-11-02"
