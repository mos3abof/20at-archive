text = "اولا لي تحفظ على كلمة ]] ] معرفة المستقبل [[[ لان المستقبل لايعلمه الا الله وحده لاشريك له ,,,,,,,, ثانيا كلامكم كله غير معترف به لانه اوضحت دراسة بريطانيه وقال علماء النفس وانتي بنفسك ياهايدي قلتي انهم يتخيلون ويكذبون هذا بعد شهر ليس لهم الا تخيلات ,,,,,,,,,, اما الفراسة فهذ ي معك حق لان الفراسة من قديم الازل فقد كان عمر بن الخطاب رضي الله عنة يشتهر بالفراسة ........... وعندنا في نجد يسمى المري وهو من بني مرة بضم الميم وتشديد الراء .......... وهم كثر فيعرف المري الشخصية من اثار القدم فيقول بانها انثى وهي حامل وفي الشهر الرابع وحامل ببنت .... وهذ ليست شعوذة ولا ادعاء علم غيب انما موهبة وهبها له الله ...."
