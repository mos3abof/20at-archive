subject = "ازيدكم من الشعر بيت"
author = "ali-zx350sa"
posted = "2006-09-11"
text = "انا مرة جلسة مع عجوز وهي حية لحد الان الله يخفظها-- صلوا على النبي<br />كانت مع زوجها تعلم الصلاة للصبيان والفتايات الصغار- الزوج متوفي من كم سنة<br />ومرة كنت اتكلم مع احد اصحابي شخبار \"الحجيه\" اعني العجوز لان عندنا كذا نسميها بلهجتنا معلينا من طول السالفة قال قريب العجوز انها تعرف من نظرة وحدة الى وجه الانسان اذا كان يؤدي الصلاة في وقتها والا يتاخر والا مايصلي الى هنا وانا ماصدقته قلت ليه كيف مومعقوله قال لي بكرة امر عليك ونروح نزورها وتشوف بنفسك وصحيح لمالما جاء عصر اليوم الثاني الا واحنا عند باب بيت الحجيه ودخل قريب الحجيه ودخلت معاه وسلمنا عليها وسئلت صاحبي عن احواله وسئلتني عن الاحوال والاهل وجلسنا نسولف وسئلتها صدق ياحجيه تعرفي الي يفوت صلاة من وجه وردت \"ايه يولدي\" نعم اعرف وهذي هبه من رب العالمين<br />مع العلم اني قمت ازورها مع صاحبي وكنت اسمع منها قصص كيف كانت قريتنا قديم وقصص المزارعين وسئلتها عن سر ها الذاكرة القويه قالت لي قراءة القران في بداية كل يوم تقي الانسان وتحفظه من كل شر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133914/http://www.20at.com/article2.php?sid=1210"

