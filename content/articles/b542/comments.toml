subject = "النشاطات"
author = "العنود عبدالله"
posted = "2006-03-27"
text = "أخي وأختي الكرام/ لننتبه معاً إلى أهمية الحركة والرياضة في حياتنا ولنجعلها شعارنا الدائم والمستمر لنحصل على صحة أفضل .<br />والرياضة هي الشيء الصحيح والسليم الذي يجب أداءه ولا توجد صحة حقيقية بدون حركة . إن التغيير في السلوك المعيشي اليوم نظراً للتطور السريع والتقدم والتقنية في جميع مجالات الحياة اليومية واعتمادنا الكلي على العديد من أجهزة التحكم والمصاعد والسلالم الكهربائية واستعمال وسائل المواصلات الحديثة,هذا بالإضافة ألي أن معظم الأعمال التي يشغلها العديد من الناس تتطلب الجلوس الطويل، أدى كل ذلك إلى اتباع سلوكيات خاطئة في أمور الحياة اليومية من قلة الحركة والنشاط( وليس فقط على الشخص نفسه بل امتد الأمر إلى أولاده و أسرته وهي اللبنة الأساسية في تكوين المجتمع ) وهذا بدوره سبب مشاكل صحية ونفسية كثيرة للفرد والأسرة والمجتمع.<br />ومن هذه المشاكل التي تسببها قلة الحركة هي كآلاتي:<br />· 1-الخمول والكسل والاتكال على الآخرين.<br />2- التعب لأقل مجهود وعدم الصبر والاحتمال والإرهاق السريع.<br />3- قلة الوعي الذهني وضعف الذاكرة والبلادة.<br />4- القلق والتوتر والأرق والطفش.<br />6- ظهور أمراض الرفاهية وفي سن مبكرة كالسكري وارتفاع الضغط وأمراض القلب والشرايين والسمنة ومضاعفاتها العديدة.<br />7- هشاشة العظام وتيبس المفاصل وآلامها المزمنة.<br />8- ظهور الشيخوخة المبكرة.<br />ومن فوائد الرياضة والحركة للجسم:<br />1- تساعد الحركة والرياضة على عمل القلب فتزيد كفاءته وقدرته وقوته. كما تساعد الأوعية الدموية أيضا على التخلص من الكلسترول والدهون المترسبة وتمنع تكوينها وتساعد على ارتفاع نسبة الكلسترول المفيد بالدم,التي قد تسبب جلطات القلب والدماغ.<br />2- تساعد على التنفس بعمق مما يزيد كمية الأكسجين الداخل للرئتين وبالتالي إلى زيادة كفاءة الرئتين .<br />3- تقوية العضلات وتحسين اللياقة البدنية: مما يزيد من مقاومتها وتحملها للإجهاد والتعب والتمزق والأمراض.<br />4- تنشط خلايا العظام وتقوي الأنسجة العظمية و تزيد كثافة العظام, كما تقوي الأوتار والأربطة بين المفاصل وتزيد مرونتها مما يسهل ثني وتحريك الجسم مرونة ودون ألم أو توتر, كما أن الحركة تساعد على زيادة المادة اللزجة في المفاصل مما يمنع اهتراء الغضاريف الموجودة بينها.<br />5- تساهم على هضم المواد الغذائية وامتصاصها من الأمعاء الدقيقة وهي من أهم علاجات الإمساك المزمن.<br />6- بالحركة والنشاط والرياضة تقل أعباء الجهاز العصبي الملقاة عليه من التوتر والقلق وذلك بصرف الطاقة المتراكمة عليه واطلاقها. كما تساعد على رفع الناحية المعنوية للإنسان وتدعم الثقة بالنفس واحترام الذات وتحسين المزاج والسلوك وتحسين نمط النوم.<br />7- تساعد على التخلص من السمنة. فهي تودي إلى عدد كبير من المشاكل الصحية مثل : أمراض القلب والشرايين والجلطات القلبية والدماغية والسكري وارتفاع ضغط الدم والدهون و آلام المفاصل و أمراض العظام والدوالي وحصوات المرارة وخلل في نظام الدورة الشهرية وبعض أنواع السرطانات مثل سرطان الثدي والرحم.<br />8- كما تقوي الرياضة من مناعة الإنسان وتزيد من مقاومته للأمراض.<br />واليكم بعض النصائح العامة لتحقيق افضل السلوكيات للحياة اليومية :<br />·1- إذا كنت ممن يعمل أي عمل يتطلب الجلوس الطويل فحاول أن تترك مقعدك وتتحرك بين فترة وأخرى وتمشي حتى ولو داخل الحجرة.<br />2- تعود أن تذهب إلى المسجد سيرا على الأقدام ففيها صحة واجر.<br />3- تعود أن توقف سيارتك عند التسوق أو عند الذهاب إلى النزهة في مكان بعيد حتى تعطي فرصة لقدميك بالحركة والمشي.<br />4- حاول إن تخصص وقتا ولو ثلاث مرات بالأسبوع على الأقل (والأفضل يوميا) لممارسة بعض التمارين الرياضية , وحاول أن تتدرج في ممارستها إلي أن تصل إلى عمل التمارين اليومية لمدة 30 دقيقة يومياًوحاول أن تمارسها في الهواء الطلق.<br />5- توجد تمارين وحركات لا تحتاج إلى أماكن ومعدات خاصة لأدائها، فمثلا المشي والجري رياضتان مفيدتان ومسليتان وخفيفتان لجميع الناس للرجال والنساء وحتى المصابين ببعض الأمراض المزمنة كالسكري وارتفاع الضغط والقلب(وباستشارة الطبيب)ويمكن مزاولتها في كل مكان في فناء البيت،وأماكن النزهة.<br />6- درب وعلم أولادك على اتباع أسلوب حياة صحية يومية وعودهم ونفسك على ذلك.وبين لهم أهمية الرياضة.<br />7- التقليل من استعمال أجهزة التحكم<br />9- التقليل من وقت الجلوس أمام التلفزيون والكمبيوتر والألعاب الإلكترونية لمدة لا تزيد عن ساعة يومياً، فقد أثبتت الدراسات انه كلما زادت فترة الجلوس أمام التلفزيون للأطفال تزيد نسبة الإصابة بالسمنة عندهم .<br />10 - حدد وقت لأداء بعض التمارين الرياضية يوميا مثل في الصباح أو فترة العصر (فهذه افضل الأوقات لأداء التمارين) وقم بأدائها يومياً حتى تصبح عادة يومية .<br />11- شجع الأولاد على اللعب مثل الجري أو ركوب الدراجة والسباحة وكرة القدم مثلا فهي افضل الرياضات، وحاول أن تلعب معهم واغرس في نفوسهم حب الحركة.<br />12- عدم الاعتماد على الخادم والخادمة في جميع الأمور فالقيام بأعمال المنزل من تنظيف أو ترتيب أو طبخ لربة البيت فيه من الحركة الكثير وأيضاً للرجل يمكنه القيام ببعض أعمال المنزل كتنظيم وحرث الزرع في الفناء أو تنظيف السيارة.<br />ما هي أنواع الرياضة:<br />يمكن تقسيم التمارين الرياضية إلى نوعين حسب توفر الأكسجين:<br />التمرينات الرياضية الهوائية: يعتمد هذا النوع من الرياضة على وجود الأكسجين لإطلاق الطاقة) مثل المشي والهرولة ,والجري والسباحة فهي تمرينات يستفيد منها الإنسان بالأكسجين الداخل من الهواء و تعمل على إمداد الجسم والخلايا بالأكسجين لكي تعمل بكفاءة . وهي افضل أنواع الرياضات فهي تحسن الدورة الدموية وتنشط القلب وتساعد على إنقاص الوزن.<br />التمرينات الرياضية اللاهوائية: وهذا النوع من التمارين يكون الأكسجين فيه غير متوفر بكمية كافية لإنجاز حركة العضلات بالطريقـــة الهوائية وبذلك يتم إنتاج الطاقــة بدون استخدام الهــواء بكفاية) . ومثال هذه التمرينات الرياضية : الأنشطة التي تتطلب بذل مجهود أقصى في فترة زمنية قصيرة جداً كحمل الأثقال والعدو لمسافات قصيرة مثل 100, 200, 400 متر, وهذه الرياضات تعمل على جعل العضلات اكثر قوة واكثر تحملا.<br />من يستطيع القيام بالرياضة<br />كل شخص يمكنه القيام بعمل التمارين الرياضية.. الأطفال والرجال والنساء وكبار السن.<br />ومن افضل أنواع الرياضة الخفيفة والعملية والتي لا تحتاج إلى معدات خاصة لناديتها ويستطيع أي فرد ممارستها هي المشي .<br />نصائح عامة عند القيام بالتمارين الرياضية:<br />·1- إذا كنت مصاباً بأمراض مزمنة عليك باستشارة الطبيب لأخذ الاحتياطات اللازمة ويحدد لك نوع الرياضة المناسبة لك . ·<br />2- اختيار حذاء مناسب للتقليل من إصابات القدم. ·<br />3- أوقات الصباح وفترة العصر هي افضل الأوقات لممارسة التمارين. ·<br />4- إذا كنت مبتدئاً فحاول أن تتدرج في عمل التمارين فأبدا بفترة قصيرة ثم تتدرج بالوقت إلى أن تصل إلى 30 دقيقة في كل مرة على الأقل لعمل التمارين.حاول أن تؤدي التمارين على الأقل ثلاث مرات بالأسبوع والأفضل يومياً. ·<br />5- عمل تمارين الإحماء والتهدئة قبل وبعد التمارين ولمدة 5 دقائق (مثل تمرين إطالة العضلات والقفز الموضعي), وإذا كانت التمارين خفيفة فلا تحتاج إلى ذلك. ·<br />6- عدم القيام بحركات فجائية أثناء أداء التمارين .<br />7- تجنب ممارسة الرياضة على ارض غير مستوية لتجنب خطر الإصابة. ·<br />8- حاول أن تكون التمارين ممتعة ومسلية. ·<br />9- الإكثار من تناول الماء عند تأدية التمارين. ·<br />10- لا تتوقع حدوث تغير سريع بعد أول ممارسة للرياضة ولكن الفائدة ستظهر مع الاستمرار بالرياضة والالتزام بها. ·<br />11- عند الشعور بالتعب المفاجئ أو ألم بالصدر توقف عن أداء التمارين فوراً وراجع الطبيب.<br />فوائد الحركة والتمارين الرياضية للجسم:<br />إن الحركة الجسدية والنشاط والرياضة من أهم الأسباب في تقوية البدن وتزكية النفس وتنشيط الدماغ, ويمكن أيجاز فوائدها الكثيرة للجسم كما يلي:<br />1- تنشيط القلب والدورة الدموية:<br />تساعد الحركة والرياضة عمل القلب فتزيد كفاءته وقدرته وقوته فيزيد ضخ القلب للدم المحمل بالأكسجين والعناصر الغذائية إلى جميع أعضاء الجسم والعضلات لاستمرار العمليات الحيوية اللازمة وانتاج الطاقة مما يؤدي إلى تغذية وتهوية افضل لهذه الأنسجة وبأقل جهد مبذول من القلب .<br />2- تساعد الحركة والرياضة على التنفس بعمق مما يزيد كمية الأكسجين الداخل للرئتين وبالتالي إلى زيادة كفاءة الرئتين مما يسمح بتبادل الهواء المحمل بالأكسجين مع غاز ثاني أكسيد الكربون الناتج من أكسدة بعض المواد الغذائية من خلال عمليتي الشهيق والزفير .<br />3- تقوية العضلات وتحسين اللياقة البدنية:<br />تزيد الحركة والنشاط الجسدي من حجم العضلات المخططة وقوتها وأيضا تصبح الأوعية الدموية فيها واسعة ومطاطية وكل هذا يؤدي إلى زيادة القوة العضلية وزيادة مقاومتها وتحملها للإجهاد والتعب والتمزق والأمراض ,بالإضافة إلى شعور الشخص بالرشاقة والخفة ويستطيع القيام بالأعمال اليومية دون الشعور بالتعب والإجهاد وبأقل مجهود.<br />4- دعم الجهاز الهيكلي :<br />تنشط خلايا العظام وتقوي الأنسجة العظمية و تزيد كثافة العظام بزيادة امتصاص الكالسيوم وتحقق التوازن بين الكالسيوم والفسفور, كما تقوي الأوتار والأربطة بين المفاصل وتزيد مرونتها مما يسهل ثني وتحريك الجسم مرونة ودون ألم أو توتر, كما أن الحركة تساعد على زيادة المادة اللزجة في المفاصل مما يمنع اهتراء الغضاريف الموجودة بينها. وبالتالي فان الحركة تقي الإنسان من الإصابة بالآم الظهر والمفاصل والروماتيزم وعرق النساء وهشاشة العظام.<br />5- تنظيم عملية الجهاز الهضمي :<br />كما تزيد الحركة من القابلية لتناول الطعام وفتح الشهية وتحسين الحالة الغذائية المناسبة (بالاختيار السليم للغذاء) والاستفادة من الغذاء بشكل امثل. وهي من أهم علاجات الإمساك المزمن وذلك بتحفيز حركة الأمعاء وتساعدها على طرح الفضلات.<br />6- تحفيز الجهاز العصبي ودعم الناحية النفسية:<br />بالحركة والنشاط والرياضة تقل أعباء الجهاز العصبي الملقاة عليه من التوتر والقلق (وخصوصاً في هذا العصر بسبب تراكم المسئوليات والمهام والضجيج والتفكير).<br />كما تساعد الحركة والرياضة على رفع الناحية المعنوية للإنسان وتدعم الثقة بالنفس واحترام الذات وتحسين المزاج والسلوك وتحسين نمط النوم مما يؤدي إلى تحسين الناحية النفسية للإنسان ويقلل من الاكتئاب والقلق والإجهاد النفسي.<br />7- تساعد الحركة والرياضة على التخلص من السمنة :<br />اذا فان الحركة والرياضة تساهم في تقليل احتمال الإصابة بالكثير من الأمراض مثل: ·<br />1- أمراض القلب والأوعية الدموية والجلطات . ·<br />2- ارتفاع ضغط الدم الشرياني وارتفاع الكلسترول. ·3- مرض السكري بسبب زيادة حساسية الأنسولين وخفض مستوى سكر الدم .<br />4- أمراض هشاشة العظام و أمراض المفاصل والروماتيزم و آلام الظهر المزمنة. ·<br />- كما تقوي الرياضة من مناعة الإنسان وتزيد من مقاومته للأمراض مثل أمراض البرد والأمراض المعدية الأخرى.<br />مع تمنياتي لكم بالصحه الدائمه [/grade]"
