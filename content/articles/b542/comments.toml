[[comments]]
order = 5
subject = "الحركة"
author = "العنود احمد"
posted = "2006-03-27"
text = "يوثق المؤلف والممثل المسرحي الشفاعمري، عفيف شليوط، للحركة المسرحية في شفاعمرو، في كتابه \"جذور الحركة المسرحية الفلسطينية في الجليل، الصادر عن مسرح الميدان ومؤسسة الأفق للثقافة والفنون في عام 2002.<br />ويشير الكاتب الى ان مدينة شفاعمرو شهدت نهضة مسرحية ملحوظة منذ الخمسينيات، حيث قدم مسرح الكشاف المسيحي الكاثوليكي، انذاك، مسرحية \"يوسيف بيك كرم\" والتي شارك بتمثيلها الياس داموني، فيليب بطرس، فريد سلباق، نعيم عبود وآخرون. كما قدم مسرحية \"فوق الانتقام\" بمشاركة يوسف نايف جروس، حنا برهوم، ريمون شيتي وآخرون. وقدمت الفرقة، ايضا، مسرحية \"كرسي الاعتراف\".<br />وفي العام 1954، أسست مجموعة من الشبان الشفاعمريين فرقة مسرحية قدمت \"في سبيل التاج\"، وجاء العرض لتجنيد التبرع لاقامة كشاف النهضة في المدينة، وشارك في التمثيل: شفيق الديك، كمال فريد مشيعل، كمال حنا مشيعل، فؤاد لحام، فيليب ارملي، باسم بحوث، كريم سلفيتي، راشد مشيعل واميل عبود.<br />وبعد مرور عام، تم عرض مسرحية اخرى بعنوان \"نخب العدو\". واستمرت الفرقة بالعمل حتى عام 1957.<br />وهناك من سبق هؤلاء في النشاط المسرحي، ومن ضمنهم حنا عموري الذي كان يقف على خشبة المسرح إلى جانب زوجته، ما يوضح مدى التطور الاجتماعي لدى الشفاعمريين في حينه، وادراكهم لاهمية ظهور الفتاة على خشبة المسرح."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151713/http://www.20at.com/article2.php?sid=542"

