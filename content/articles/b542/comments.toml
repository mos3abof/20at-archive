text = "إتفاقية بين حكومة المملكة العربية السعودية وحكومة الولايات المتحدة الأمريكية بشأن تبادل الإعفاء الضريبي بينهما على الدخل المتحقق من التشغيل الدولي للسفن أو الطائرات<br />إن حكومة المملكة العربية السعودية وحكومة الولايات المتحدة الأمريكية ، المشار إليهما فيما بعد بـ (( الطرفين المتعاقدين )) رغبة منهما في إبرام إتفاقية لتبادل الإعفاء الضريبي بينهما فيما يتعلق بالضرائب المفروضة على الدخل المتحقق من التشغيل الدولي للسفن والطائرات ، وقد اتفقتا على مايلي :<br />المادة"
