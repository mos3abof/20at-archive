author = "مروة"
posted = "2006-06-04"
text = "رغم أن التعليق ملوش دعوة بالموضوع ده هو عليق لأخ 000مبروك ليه للبنات رغم أن البنت لينا كانت صعبانه عليا أوى و و نفسى تلاقى أسمها الى أبوها بمنتهى الندالة كان ممصم يحرمها منه و كمان لأنى نفسى أن كذبه ينفضح و ينول جزائه لكن دى لا يمنع أن هند غلطانة و أكتر منه كمان و البنت المحترمة بجد و السوية فى علاقتها بأهلها و بيئتها متعملش الى عملته هند بدون مبرر أو سبب<br />مبورك للبنت الصغيرة أول المشوار لسه الى حتتعرض له كتير فى الدنيا ربنا معاه و مع الى زيها الى بيدفع تمن غلطة ناس بيتكبروا حتى أنهم يقولوا أنهم غلطوا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133812/http://www.20at.com/article2.php?sid=854"

