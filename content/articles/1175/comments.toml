[[comments]]
order = 32
subject = "والله حرام"
author = "معليش"
posted = "2006-08-27"
text = "ابغى اقول شي انا اعاني من اضطراب الهويه الجنسيه وحالتي صعبه من انا صغير لانو كان في واحد يتحرش فيا من صغري وكان يعتدي علي وما كنت اقدر اقول شي ولما كبرت وسار عمري 13 قدرت اوقف لاني كبرت وفهمت انو حرام وانو لازم اتصرف وانا كل الي عملتو اني كنت اتهرب منو والحمدلله بطل لانو حسب اني حكلم احد و حفضحو وهذا لسه ما قلتلكم كل شي فا ليش انتو تشوهو صوركم بنفسكم كلنا نعاني يعني حالك زي حالي بس انتو قاعدين تبو تتعرفو شباب وانتو عارفين هم ايش يبو وعاجبكم اوكي انا عارف الي فيكم انا زيكم حركاتي زي البنات وناعم مره وشكلي مره حلو وكمان زي البنات لكن ما عملت الي انتو قاعدين تعملوه انتو قاعدين توصلو للعالم اننا شواذ وهذا مو صح كيف تبو العالم يوقف معانا كيف تبو الناس يساعدونا كيف تبو الناس يحترمونا انا صح اني ناعمه زي البنات لكن ما سمحت لاحد يستهزء فيا واذا كنا نحس بدا الشي مو لازم تعملو كدا انكم تتعرفو على شباب وتعملو اشياء غلط بالعكس المفروض تتقربو اكثر لربكم والله انا فاهمتكم لكن الي ابي اقوله لا تخلو الناس يظلمونا خليهم يشوفونا على حقيقتنا زي انا انا ابغى اغير جنسي مو للرغبه بل للضروره لانوانا ما اقدر اعيش واكمل حياتي ولد كوني بنت فيه خير لديني ودنياي وانتو لا تحسبو اني مطوع بالعكس انا اسمع اغني وخاصه الاجنبيه واخرج واطلع واعمل مقالب واكلم اصحابي وارجع الساعه 2 الليل لكن ما اعمل شي غلط عشان ربنا يوفقني والحمدلله انا دحين بطريقي بالعلاج النفسي وبعد ما يتاكدو انو مافي فايده اني اكون ولد حيعملو لي العمليه والحمد لله انا دحين وصلت لنص العلاج فا احتمال يكون موعد العمليق اقرب وانا اقول للي قرا كلامي من الي يعانو اضطراب الهويه الجنسيه يحترمو نفسهم عشان ه الناس تحترمنا واقول للشواد لا تشوهو صورنا عيييييييييب وحرااااااااااام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133812/http://www.20at.com/article2.php?sid=854"

