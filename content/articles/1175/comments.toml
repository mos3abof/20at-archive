posted = "2006-06-05"
text = "هؤلاء يبحثون عن هوية لهم ولايستطيعون الحصول علي تلك الهوية اما نحن فالحمد لله الله عفي عناواعطنا هوية اوما ذكر او انثي ونحن نحاول ان نخالف طبيعتنافتجد الولد يرتدي سنسلة في رقبته ويطول شعره والبنت تلبس ملابس الاولاد ومثل هذا الكثير فبالله عليكم هل هذا يرضي الله<br />اتقوا واعلموا ان الله يلعن الرجل المتشبه بالنساء وكذلك المراة المتشبهة بالرجال ."
