text = "السلام عليكم حينما نتكلم نحن المسلمون عن الحب فيجب أن نربطه بالله نحن نحب في الله وأيضا نبغض في الله ديننا كله حب وأيامنا كلها حب وأحسن حب في نظري طبعا أن تعرف حب الله وحب رسوله وأن تحب والدتك جرب حب الوالدة ستحس براحة لامثيل لهل وأوصيكم بوالداتكم خيرا.<br />جميلة .المغرب"
archived = "2005-07-28"
