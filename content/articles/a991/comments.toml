subject = "فلسطيني ابو العبد"
text = "يعني انا اتمنى ان يكون لنا دوله وينتهى الاحتلال ويصبح هناك عيد زفت عنا<br />ولكن عيد الحب شيء تافه يعني يوم 14-2<br />لا يوجد به قتل او توغلات او اغتيلات؟<br />طبعا لأ<br />نسال الله السلامه"
