subject = "حنين ( ام العبد) - فلسطينية"
text = "السلام عليكم<br />الاخ الفاضل عاطف نحن ليس بحاجة لعيد للحب او يوم للحب لان ديننا الاسلامي حثنا على الحب في اي وقت وفي كل لحظة ونحن بحاجة الى يوم للعوده لله ليس للحب ."
