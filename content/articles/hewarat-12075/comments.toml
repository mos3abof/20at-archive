author = "تامر مصطفى"
posted = "2009-05-14"
text = "الرجل دة اكبر عميل لمباحث امن الدولة ومجند لخدمتها ————————— وبصفتة بيقابل المتهمين على انة المحامى بتاعهم بيروح ينقل لامن الدولة كل حاجة<br />يا عم الزيات احنا هنضحك على بعض - مين اللى شغلك الشغلة دى محامى الجاماعات الاسلامية ومش معنى انت بس اللى سايبينك تتصل بيهم وتعمل علاقات<br />اراهن انك اكبر مجند لامن الدولة<br />وانا لما اشوفك فى القنوات التليفزيونية واشوف فكرك المسطح اقتنع 100 % انك عصفور كبير للامن<br />للناس المتورطة فى العمليات دى ان تتخذ محامى غير الراجل دة<br />فية محامين كتير شطار وبيخدموا العدل من غير شعارات وليس لها صفة خبير الجماعات وكان الجماعات دى طماطم لها خبير فى الزراعة والقطف"
archived = "2009-05-17"
capture_url = "https://web.archive.org/web/20090517011857/http://www.20at.com:80/hewarat/12075-2009-05-14-11-16-42.html"

