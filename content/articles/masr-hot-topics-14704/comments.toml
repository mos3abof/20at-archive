posted = "2010-01-02"
text = "ان تشمل مواعيد الصلاة<br />اسماء الاعياد والمواسم والاجازات<br />ان تحتوى على الشهور العربية والافرنجية والفرعونية من اجل الزراعة<br />فيها عناوين وتليفونات البنوك والقنصليات<br />تفضل ان تحتوى على مواعيد قطارات السكك الحديدية<br />فيها عملات الدول المختلفة مقابلة بالدولار<br />فيها عناوين الاسعاف وشرطة النجدة وارقام التليفونات"
