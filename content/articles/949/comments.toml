subject = "TO BE REALISTIC"
author = "HASSAN MOHMMED"
posted = "2006-09-23"
text = "Frist of all RAMADAN KREEM for all you , seconed of all Somalia is a strongly Islamic country and many people support the courts.<br />During the years of warfare and anarchy, many Somalis have increasingly turned to their faith for some sort of stability.<br />Sheikh Aweys denies there are al-Qaeda training camps in Somalia<br />One visible sign is that before the civil war began in the 1980s, very few women wore headscarves in Mogadishu.<br />Now, almost every woman wears a headscarf and an increasing number are wearing veils covering their faces, with just narrow slits for the eyes.<br />Even those Mogadishu residents who are wary of Islamic extremism may welcome a single group being in control of the capital for the first time in 15 years, saying there will at least be some authority.<br />And most will prefer Islamic preachers to the warlords who have repeatedly fought over and in many cases systematically looted the city since 199l .After all islamic courts the peace and save to many out there , No matter what u heasring in the news and web site's such 20at .<br />peace out"
