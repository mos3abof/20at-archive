subject = "رأيي ..مش خبر"
author = "المشكلة في أحمد الهواري و براء و بعض العشريناتية غلب عليهم صفة واحدة و هي كرههم الشديد لأي مظهر أو مضمون اسلامي ..ويرجعوا يقولوا احنا نقلنا خبر ..مش رأي"
posted = "2006-09-24"
text = "لكن الحقيقة انهم بينتقوا \"الأخبار\" اللي من النوع ده ,يعني يتلككوا على اي سقطة للاخوان و مش لاقيين منهم أي خير..و مغرقين ولاد البلد بمقالات حمدي رزق الحقير تربية امن الدولة اللي عمره ما فوت سطر من كتاباته الا و شتم الاخوان ..النماذج كتير أخرها مقال الهواري اليوم..<br />يا ريت تراجعوا نفسكم في \"أخباركم\" .مش اراؤكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125430/http://www.20at.com/article2.php?sid=1259"

