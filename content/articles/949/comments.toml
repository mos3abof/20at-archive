[[comments]]
order = 3
subject = "فبركة وفرقعة .. وإخفاق عشريناتي كبير"
author = "عمرو مجدي"
posted = "2006-09-23"
text = "السلام عليكم<br />صديقي أحمد ، أنت ومن وافق على نشر هذا الـ (رأي) وليس الـ (الخبر) في عشرينات، أخطأتم جميعا يا أصدقائي<br />أولا: التقرير يدور حول قناة العربية، وهي القناة المعروفة بعدائها للإسلاميين متطرفيهم ومعتدليهم..<br />وأعتقد لا يفوت على متابع للاحداث مثلك، أن تبث قناة العربية هذا الخبر في الوقت الذي يظهر فيه الشيخ شريف أحمد على برنامج بلا حدود في قناة الجزيرة<br />ثانيا: في كل مرة يقترب الإسلامييون من الحكم في أي دولة، يتم استدعاء النموذج \"الطالباني\" المتخلف، الذي لا يفقه عن الإسلام إلا اسمه<br />ولا أدري هل هؤلاء الإعلاميون يعيشون حقاًً في عالمنا ويرون التجارب التركية والفلسطينية والماليزية وغيرها في وصول الإسلاميين إلى السلطة؟!<br />أم أنهم إعلاميون تحكمهم توجهاتهم وانتمائاتهم وعداءاتهم للتيار الإسلامي<br />أخطأت يا صديقي حينما قادك هواك إلى ماهو ليس بصحيح ، خاصة في مثل هذا الوقت الذي تدافع فيه المحاكم الإسلامية عن وطن الصومال .. قبل أن يتحول لعراق أخرى<br />فكروا قليلاً قبل أن تكتبوا أرجوكم .. وإذا كنتم تودون الإشارة إلى مثل هذا الموضوع، فكان يمكن أن يتم وضعه كلحقة نقاش في \"شاركنا برأيك\" حول النموذج الطالباني المتخلف في تحكيم الشريعة<br />هناك شيء يا صديقي اسمه التدرج في التشريع ، والكفار ظلوا يطوفون حول الكعبة عرايا بعد 8 سنوات من النبوة المحمدية، وعندما أمر رسولنا سيدنا علي بأن ينزل إلى الكعبة و \"لا يطوف اليوم بالبيت عريان\" لم يجد سيدنا علي أي شخص يطوف عارياً!!!<br />فقد تكفلت الفطرة الإنسانية والتوجيهات الربانية بإعادة الناس للجادة ، بدون إلزام ولا إجبار<br />هذا اسمه الفقه الإسلامي في التدرج في التشريع ..<br />خلاصة الأمر ، بلاش تنقلوا حاجة عن العربية مرة تاني ، وتابعوا مواقع تحترم عقولكم وعقولنا شوية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125430/http://www.20at.com/article2.php?sid=1259"

[[comments]]
order = 4
subject = "موضوع تافه"
author = "طيف بدر"
posted = "2006-09-23"
text = "الظريف اللي كاتب الموضوع الأهبل المتفبرك ده...مبتشوفش شيخ شريف أحمد ( الله يحفظه ) على الجزيرة؟ رجل عقلاني و قائد حقيقي لا تنعم بلدك و بلدي بظفره<br />من يومين قتل مجهولون راهبة إيطالية فاعتقلته المحاكم الإسلامية و هي تحقق معه الآن كذلك استنكرت المحاكم الإسلامية تفجيرات البرلمان \" المعروف مين اللي عملها\"<br />ثم إن الصومال في ظل لوردات الحرب التابعين لواشنطن كانت عبارة عن وكر لتعاطي المخدرات و تجربة الأدوية التي تنتجها الشركات الغربية تحت رعاية \" أرامل و أيتام واشنكن\" و محدش نطق و لا إكلم<br />جايين دلوقتي بعد ما مكن الله عز وجل الممحاكم الإسلامية من إعادة بناء الصومال تتكلم عن جلد زاني و زانية ضبطا متلبسين في غرفة النوم... ماشي يا حبيبي هم لا يستحقون الجلد و لكن بالتأكيد يستاهلوا ضرب الجزم و مش هما لوحدهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125430/http://www.20at.com/article2.php?sid=1259"

[[comments]]
order = 5
subject = "ما من قوم بعدوا عن الله الا زلوا"
author = "خالد"
posted = "2006-09-23"
text = "اتقوا الله ياريتنا نطبق الشريعهماكانش دي بقي حالنا ولا حال العرب<br />اتنين بيحبوا بعض في غرفه مغلقه هيكونوا كانو نويين يعملوا ايه؟بيتناقشوا في ازمه العراق مثلا ولا في حرب لبنانز<br />علي فكره انا اتشيديت للموقع بس المقال ده خلاني اتحفظ كتيير عليكوا يا جماعه اتقوا الله في دينكم .ميين يرضي لاخته مثلا انها تقعد مع شاب غريب حتي في موقع عام سواء مسلمه او مسيحيه ,اكيد كان شرب من دمها.<br />لوكنا بنطبق الشريعه وبنمشي علي السنه صح من غير اي تجاوزات كان الزنا والسرقه وكل الفواحش قلت من بلدنا وكنا بقينا حاجه تانيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125430/http://www.20at.com/article2.php?sid=1259"

