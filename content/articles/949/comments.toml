[[comments]]
order = 7
subject = "رجل معتدل الفكر"
author = "حمدي"
posted = "2006-09-23"
text = "الي الاخوه الذين انتقدوا احمد الهواري كاتب المقال.... انا شايف انه انتقاداتهم متسرعه .... لان هدف المقال علي حد فهمي هوابراز مخاوف البعض وهي مخاوف مشروعه من يتحول النموذج الصومالي الي نموذج طالبان... ويرتبط في اذهان الناس كل ماهواسلامي بالعنف والتشدد والتنطع في امور الدين .... ومثل ذلك يوجه اكبر ضربه لاي مشروع اسلامي ويكون السبب في ذلك بعض الاسلاميين<br />لكن انا بتفق مع الاخوه في نقطتين اتنين<br />اولا ان العربيه مصدر مشبوه الاخبار والحقيقه ان كل وسائل الاعلام المموله سعوديا زي الشرق الاوسط وايلاف والعربيه مصادر مشبوهه للااخبار<br />ثانيا : ان تصريحات زعيم االمحاكم الاسلاميه هي تصريحات لرجل معتدل الفكر وبعيد عن التشدد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125430/http://www.20at.com/article2.php?sid=1259"

