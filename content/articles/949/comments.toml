subject = "بص يا هواري و معلهش"
author = "طيف بدر"
posted = "2006-09-28"
text = "اليوم منعت المخاكم الإسلامية دخول القات إلى كسمايو و بدأت في حرق مزارع القات<br />هذا ما ينتظرنا من المخاكم الإسلامية المتشدة المتطرفة الرجعية المتخلفة الوحشة الباردة الغلثة (و الله لأقول لدادي)<br />اطمن يا هواري كسمايو في الصومال لكن مصر المحروسة لسة فيها خير كتير و مخزون وفير من الحشيش و البانجو و البيرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125430/http://www.20at.com/article2.php?sid=1259"

[[comments]]
order = 11
subject = "اللهم انصر الإسلام"
author = "أبو عمار"
posted = "2006-10-05"
text = "يقول الله \"الحق أحق أن يتبع \"<br />ويقول أيضا سبحانه \" الذين إن مكناهم في الأرض أقاموا الصلاة وآتوا الزكاة أمروا بالمعروف ونهوا عن المنكر ولله عاقبة الأمور\"<br />فاذا قامت أناس وقاموا بهذه الأمور فيجب علينا أن نؤيدهم ونقف بجوارهم وندعو لهم لا أن ننتقص من قدرهم<br />واعلموا جميعا أن النصر في النهاية للمؤمنين شئنا أم أبينا قال الله تعالى \" والعاقبة للمتقين\"<br />ولنا في السابقين عبرة فما كان لله أن يقص علينا قصص الهالكين الذين عصوا الرسل وكيف أهلكهم الله الا لأخذ العظة والعبرة منهم<br />ولي عليكم سؤال ماذا لو خرج رسول الله بيننا اليوم ورأى هؤلاء يتركون ما أمر الله به وينظرون الى عورات اللاعبين وما يتخلل ذلك من نغمات موسيقية ولهو او رآهم لا يكترثون بالصلاة وقد كان في عهده لا يتخلف عن صلاة الجماعة الا منافق معلوم النفاق<br />فاتقوا الله جميعا وارجعوا الى دينكم والتزموا بمنهج ربكم الذي انزله الله على رسوله والذي يطبقه هؤلاء القوم - طالبان والمحاكم - خير تطبيق<br />وأشهد الله تعالى أني أحبهم في الله وأرجو أن أحشر معهم في ظل عرش الله يوم لا ظل إلا ظله وأياكم آمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125430/http://www.20at.com/article2.php?sid=1259"

[[comments]]
order = 12
subject = "ماذا يريدون منا"
author = "عباس"
posted = "2006-10-21"
text = "هل يريدون من السكوت على المنكر من مراقص وغناء (لا)فنحن ننهي عن المنكر كما أراد الله عز وجل<br />هل يريدون منا السلبية (لا)فنحن نأمر بالمعروف وننهى عن المنكر كما أراد الله عز وجل<br />هل يريدون قراءة أكاذيب صفحكوتتصديقها (لا)فنحن أمة أقرأ أمة الصادق الأمين<br />هل يريدون أموالنا وأموال الفقرأء والمساكين(لا) فبنهبكم انتشر المحتاجين<br />هل يريدون منا ترك الاذكار (لا) فهي دروعنا الواقية<br />أولي الامر منكم هم من المؤمنين تولوا الأمر بصوررة شرعية بالأغلبية من المؤمنين وفق الله الجميع لكل خير المؤمنين وخذل الظالمين والمفسدين وشكرا لرجال عين شمس الذي أفتخر باني منهم(خريج حديث)<br />(قالوا كنا مستضعفين في الأرض)<br />(أن أخرج قٌومك)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125430/http://www.20at.com/article2.php?sid=1259"
