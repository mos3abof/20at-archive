order = 0
subject = "ذكر الله بخير من ذكرنا بخير"
author = "المندلاوية"
posted = "2006-08-02"
text = "السلام على من اتبع الهدى<br />الصلاة والسلام على اشرف المرسلين محمد وعلى اله واصحابه الغر الميامين<br />من اين ابدا كلماتي من الم الم بي منذ سنين من حزن يعزف الحان الاسى<br />انا عراقية الاصل والمنشا مررنا بكل المحن والصبر كان ثوبنا الحمد لله الذي كسانا هكذا ثياب معطرة باريج الفرج<br />اشكر كل من يذكرنا ولو حتى نمر على باله ولا نطلب منكم سوى ذكرنا والدعوة بتبريد النار التي التهبت ولم تنطفي الا بدعواكم ان شاء الله<br />وفي النهاية اقول ذكر الله بخير من ذكرنا بخير<br />السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123548/http://www.20at.com/article2.php?sid=1041"
