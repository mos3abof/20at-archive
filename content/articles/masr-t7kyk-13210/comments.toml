text = "كنت معزوم فعلآ على الفطار عند اختى والطريق كان زحمة خالص والاذان اذن عليا فى الطريق وناس كتيرة على طول الطريق وزعو عليما تمر هندي وبلح والصراحه الموقف كان جميل ولولا ظروف شغلي انا ماكنتش اترددت انى اعمل كدة .. بجد أجمل حاجه شوفتها فى حياتي ان الناس كلها بتسابق بعضها فى فعل الخير .. ربنا يتقب منا .. :)"
