posted = "2009-03-28"
text = "ما ينفعش يا فضيلة المرشد ان تترك منصبك لان انت امير الجماعة<br />وها هو عثمان بن عفان طالبوه بترك منصبه قال لهم<br />والله لا أخلع ثوباً ألبسني إياه الله ورسوله"
