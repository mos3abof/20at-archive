posted = "2009-03-27"
text = "لو صحيح الخبر تبقى خطوة مش غريبة ولا مستغربة من تنظيم مواكب للعصر يسعى للمصلحة العامة ومؤهل وعلى قدر كبير لادارة البلد"
archived = "2009-04-25"
capture_url = "https://web.archive.org/web/20090425202935/http://www.20at.com:80/masr/2khbar/11711.html"

