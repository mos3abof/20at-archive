author = "اكتب اسمك هنا"
posted = "2009-03-26"
text = "نامل ان يكون الكلام صحيحا وان يكون ذلك درسا كبيرا للحزن الوطنى وبقية الاحزاب -<br />يمكن<br />افلح الرجل ان صدق<br />نعم تلك الحكمة القديمة<br />افلح الرجل ان صدق"
archived = "2009-04-25"
capture_url = "https://web.archive.org/web/20090425202935/http://www.20at.com:80/masr/2khbar/11711.html"

