author = "رايق"
posted = "2009-03-26"
text = "هى فوضى - امن الدولة يسيبة يستقيل - مش ممكن - هما عارفين اللى جاى وراة هيعمل اية - وبعدين هم عرفوا لبة المرشد دة - لسة هييجى واحد جديد<br />وبعدين الجماعة هتظهر امام الامريكان انها ديمقراطية وفيها انتخابات وتغيير مش متجمدة زى الحزب الحاكم<br />اكيد الامن هيمنعة من الاستقالة<br />مستحيل يسيبوة يمشى كدة بمزاجة"
archived = "2009-04-25"
capture_url = "https://web.archive.org/web/20090425202935/http://www.20at.com:80/masr/2khbar/11711.html"

[[comments]]
