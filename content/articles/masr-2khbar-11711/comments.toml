text = "بقى يوجد انسان عاقل يصدق خراء و هراء ذلك المرشد الخرف(مهدى عاكف)<br />ان لم تستح فقل ما شئت؟!!!!<br />هاهاهاهاهاها<br />و رقصنى يا جدع؟"
