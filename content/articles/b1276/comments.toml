[[comments]]
order = 0
subject = "والله نقدر"
author = "لسه مبطل من اسبوع"
posted = "2006-09-26"
text = "اولا موضوع كويس جدا<br />ثانيا والاهم ان الواحد سبب انه مش قادر يبطل انه مش قادر يقنع نفسه ان السجاره دي حاجه خنقه وبتخلي الواحد نفسوا كده مش مظبوط وريحته معتقه سجاير بجد الجاير دي حقيره اوي بس مجرد اني وهمت نفسي انه مستحيل ابطلها يبقي عمري ما هبطلها بس عايز اقول لكل مدخن لما تيجي تبطل خللي نيتك لله انا عن نفسي الحمد لله قدرت ومن غير تعب بس عشان فكرت في ربنا وبقيت احط قلم فرنساوي في بقي كل ما افكر فيها بس بعدها الحمد لله بدأت انسي<br />بجد بتمني كل المسلمين يبطلوها وكل الكفره يدمنوها وكل سنه وانتم طيبين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133856/http://www.20at.com/article2.php?sid=1276"

[[comments]]
order = 1
subject = "حمدي"
author = "والله نفسي ابطلها وكل سنه اقول في رمضان ومتنفعش العمليه"
posted = "2006-09-26"
text = "اما نشوف السنه دي هنعمل ايه<br />مش لو يلغوا مصانع السجائر يبقي احسن علشان نبطل اجباري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133856/http://www.20at.com/article2.php?sid=1276"

[[comments]]
order = 2
subject = "تنبييييييييييه"
author = "سناء"
posted = "2006-09-27"
text = "بارك الله فيك أخت نورهان على إثارة هذا الموضوع. أودأن أنبهك لشيء ربما لم تلحظيه حين استخدمت عبارة أكثر المتضررين من شهر رمضان وكأن هناك متضررين كثرا من هذا الشهر الكريم والمدخنون الأكثر تضررا بينهم.إن هذا الشهر هدية من الله بها علينا لنطهر نفوسنا وأبداننا ونقوي عزائمنا ونشد من بنيان مجتمعاتنا بالتآزر والتزاور والتهادي والتصدق وغيرها من الأعمال التي تقرب الناس من الناس ومن رب الناس فهل في هذا ضرر؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133856/http://www.20at.com/article2.php?sid=1276"
