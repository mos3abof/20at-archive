author = "لحمد لله بدايتا"
text = "ان الانسان يهدر الوقت بالمشاهدة والنضر فى ما حرم الله من الافلام والافلام الكومدية وافلام الاكشن وغيرها لو ان الانسان المسلم او العاقل بدلا من ان نقول الانسان المسلم يدرى مدى خطور الافلام على حياة الناس والافلام الحديثة منها خاصة الاجنبية الساقطة لما فكر من البداية بمشاهدتها او متابعتها<br />فهي لها جوانب اجتماعية سلبية اكثر من اى شيئ اخر من قصص اجرام وقتل ونتهاك لحرمات البيوت وخيانة الاهل والاصدقاء وسوء معاملة الاهل والاقارب<br />حفظنا الله واياكم منها<br />اخوك ابراهيم من فلسطين"
archived = "2006-11-02"
