subject = "اللي راح راح يا انشراح"
author = "أكرم بشويش"
posted = "2006-02-05"
text = "يا جماعة ياريت الناس ترضى بالمصيبة و تصبر و الرضى ده هييجي لما الواحد ميحبش اصدقائه و حبايبه لدرجة العباده لدرجة انوا ميحسش انهم ممكن يمومتوا في اي وقت<br />و على فكرة الندب و اللطم ده مش من عادات المصريين بس<br />اللي شاف فيلم زوربا اليوناني هيعرف ان اليونانيين ليهم في الندب كمان<br />و عشان متفتكروش ان كلامي نظري انا مات اغلب حبايبي و هما في عز الشباب و مكنتش اتوقع انهم هيموتوا ولا كنت اتوقع اني هموت في اي وقت<br />و بعدين بقا هتخلوني اعيط ( يللا باي )"
archived = "2006-11-02"
