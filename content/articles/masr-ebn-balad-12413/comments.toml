text = "يا زخاري فيه مستوطنه في اسرائيل اسمها مستوطنة زخاريا<br />ما تروح تعيش معاهم هناك<br />اكيد دول جدودك لحسن التعليق بتاعك دا اسرائيلي خالص<br />عشان كده انت ممنوع من السفر يا زخاري<br />انت بتسافر اسرائيل تروح مستوطنة زخاريا<br />ايوه يا عم كلهم قرايبينك هناك<br />الله يسهلك<br />لكن على مين دا المباحث مفتحه عنيها كويس اوي اوي اوي"
