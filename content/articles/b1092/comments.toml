order = 25
subject = "انتبهوا"
author = "الحمد لله"
posted = "2006-08-27"
text = "أخوتى، اسمحوا لى أن أنبهكم الى أن الكلام فى الدين هو كلام عن رب العالمين، فاما أن يكون المتكلم متعلما يتحدث مما تعلم على يقين وبأدلة راسخة توافق قول علماء الأمة، واما أن يأتى بنقولات من أقوال العلماء ان أراد نشر الخير بين الناس.. أما أن يجتهد من عنده بغير علم فهذا ينزل منزل القول على الله بغير علم وهو من كبائر الذنوب، فانتبهوا<br />(قُلْ إِنَّمَا حَرَّمَ رَبِّيَ الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ وَالإِثْمَ وَالْبَغْيَ بِغَيْرِ الْحَقِّ وَأَن تُشْرِكُواْ بِاللّهِ مَا لَمْ يُنَزِّلْ بِهِ سُلْطَاناً وَأَن تَقُولُواْ عَلَى اللّهِ مَا لاَ تَعْلَمُونَ) [الأعراف : 33]<br />فالحذر كل الحذر من القول على الله بغير علم..<br />أمر أخر أردت التنبيه اليه، وهو أن هذا الموقع يتربص به أناس خبثاء يشنون حربا خبيثة على أهل السنة وعلى بلاد الحرمين بصفة خاصة. وهم لا يكادون يتركون موضوعا أيا كان الا ويدسون فيه سمومهم ويقلبون النقاش فيه الى كلام عن مآسر (المجاهدين) الشيعة فى مقابل مهازل حكام العرب، ويخرجون من ذلك بالطعن فى علمائنا، وكأنه ليس من بين أهل السنة مجاهد واحد فى أى مكان من الأرض، أو أن مواقف حكام العرب المخزية يرجع السبب فيها الى تأثير علماء أهل السنة، ولا حول ولا قوة الا بالله.<br />وللاشارة على سبيل المثال حتى لا تحسبوا أنى أتصور أوهاما، فما دخل الكلام عن أسرة أل سعود والفساد السياسى مثلا بموضوع عن المصيف وشواطئ البحر؟؟!!<br />انبتهوا أيها الكرام فهناك من يكيد لكم، والله المستعان على ما يصفون."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123309/http://www.20at.com/article2.php?sid=1092"
