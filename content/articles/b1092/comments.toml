subject = "مصايف الأغنياء و مصايف الفقراء !!!"
text = "الحقيقة أنا ميهمنيش الناس بتقول إيه و لا بتبص إزاي على أي واحدة محجبة نازلة البحر و لا بتتمشى على الرمل, المهم إني أمشي و راسي مرفوعة و أستمتع بكل لحظة و كل وقت بقضيه في المصيف و طوز في الباقي, و بعدين تفرق نظرة الناس من شاطئ لشاطئ يعني مثلاً لو واحدة نازلة البحر إن شالله بجلابية و شبشب زنوبة و رابطة دماغها بمنديل بأوية في جمصة و لا فايدولا راس البر ولا بعض الأماكن في الأسكندرية, حيبقى شكلها طبيعي جداً, أهو في زيها كتير, لكن لو مشهد زي ده حصل في مارينا و لا المعمورة و لا شارم أو الغردقة, حتبقى فرجة و تخلي إللي ما يشتري يتفرج, أمال يا جماعة راح فين البكيني و الجيت سكي و البيتش باجي ؟!"
archived = "2004-09-07"
capture_url = "https://web.archive.org/web/20040907020122/http://www.20at.com:80/article.php?sid=468"

