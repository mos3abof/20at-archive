text = "تخيلي منضرك بعد السباحة على قولكم المايوه الاسلامي او بالحجاب تخيلي الملابس كلها لازقه بجسمك انت مو لوحدك في المصيف فيه شباب انذال بجنبك وحاشه يبغو ينهشو في عرض المسلمات نيتك لوحدها ما تكفي يقول المثل الباب الي جيك من الريح سده واستريح والله اني سؤال يا اختي الكريمه اليس جسدك عوره والله من الفتن الي في المرآة جسدها فوضعكم وانتو طالعين من الماء صعب والله ما ودي يتشمتو فينا الأعداء انا رئيي يعملو مصيف خاص بالنساء للحفاظ عليكم من اعين الخبثاء وشكراً ارجو تقبل رئيي بصد رحب"
