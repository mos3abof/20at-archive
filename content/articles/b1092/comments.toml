text = "الموضوع بجد جميل جدااااا يا شرين عادى ايه المشكله لما نصيف و نلتزم بتعاليم دينا انا عن نفسى بروح الغردقه و شرم و بلبس المايو الاسلامى اناو قريبى و بنكون شاذين وسط الاجانب و مع ذلك بيحترمونا لاننا بنحترم دينا و بنصلىو فى نفس الوقت مش بنغضب ربنا.<br />موضوع ان حدد يؤم الناس على الشاطى للصلاه موجود طبعا فى مصر و خاصه فى اسكندريه عمرى ما انسى ايام زمان يوم الجمعه فى المنتزة لما الرجاله و الستات كلهم بيصلوا جماعه.سلام"
