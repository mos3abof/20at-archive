[[comments]]
order = 13
subject = "طب اسمعوا الحكاية دي و شوفوا إن كان كلام شيرين واقعي"
author = "محمد السيد"
posted = "2006-07-19"
text = "و أنا حأحكي لكم تجربة شخصية عملتها مع صحابي...<br />كنا في اسكندرية ... في البحر ... و جاء وقت صلاة العشاء ... واحد قام و أذن للصلاة بصوت عالي .... و بعدها بدقائق أقمنا الصلاة ... و تقدم واحد ليصلي إمام و كلنا وراه ....<br />الناس و الله كانت بتنظر لنا و هي مبهورة و نفسها تعمل زينا ... و أكتر من كده ... سيدة كبيرة في السن جاءت و وضعت كرسي و صلت عليه معانا ...<br />متتخيلوش بس تأثير الصلاة دي علي الناس أد إيه ..... و الله الناس كلها نفسها تعمل كده لكن عايزين اللي يبدأ أمامهم ...<br />لو كل واحد فينا يجرب يعمل كده و يشوف النتيجة علي الناس إيه ....<br />علي فكرة ... إحنا كده أخذنا ثواب اللي صلي معانا و أكيد أثرنا في اخرين و منعناهم من بعض المحرمات اللي اللي كان ممكن يعملوها في الوقت ده علي شاطئ البحر...<br />بعني فوائد من كل ناحية ... ليه نستخبي و إحنا بنصلي أو بنعمل حاجة كويسة ... واللي بيخرب الدنيا و يعمل كل المحرمات مش مكسوف منها و لا خايف ....<br />جربوا و مش حتخسروا حاجة .. و إن شاء الله ناخد إحنا ثواب اللي يعمل بالعمل ده ... أمين.<br />وبرضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123309/http://www.20at.com/article2.php?sid=1092"

