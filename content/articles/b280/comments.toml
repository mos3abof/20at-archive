[[comments]]
order = 7
subject = "فى دقيقة واحدة"
author = "محمد المصرى"
posted = "2006-01-24"
text = "ياجماعة اتكلمو كلام عاقلين امريكا لو عايزة تدمر ايران هدمرة فى دقيقة والاخ اللى بيتكلم على ايران اللى عندة وسائل دفاع تخشى منة امريكا هتجيب دولة زاى امريكا بتصنع اسلحة ووسائل دفاع وهتجيب ايران اللى بتشترى اسلحة من روسياهية اى نعم ممكن ايران تصد امريكا بس بردة فى الاخر هتتزم واسمع منى الكلام دة وهتقول المصرى قال وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125112/http://www.20at.com/article2.php?sid=280"

[[comments]]
order = 8
subject = "الحرب على ايران"
author = "مسلم.. عربي .. فلسطيني"
posted = "2006-02-24"
text = "اشتم في بعض التعليقات رائحة التخاذل والتآمر وحب الهيمنه الامريكيه .ان ارادة التحررمن التبعيه هي اقوى من نار الحديد الذي يلبسه الاستعمارلاخضاع الشعوب الحره..والشعب الايراني شعب ابي النفس باسلامه وهو جزء من الامه الاسلاميه التي ارى ان فجرها بدأ (وتلك الايام نداولها بين الناس)."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125112/http://www.20at.com/article2.php?sid=280"

[[comments]]
