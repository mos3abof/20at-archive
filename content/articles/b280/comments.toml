[[comments]]
order = 5
subject = "الحرب صعبة"
author = "مصري نبيه"
posted = "2006-01-20"
text = "امريكا واللي معاها من اوربيين واسرائيل وعرب عاجزين عن سن الحرب على ايران لاسباب كثيرة منها :<br />1- الضرر الاقتصادي عليهم قبل ايران.<br />2- الخوف من حرب تدمر المنطقة بكاملها ومنها العدو اللقيط اسرائيل .<br />3- ايران تملك من وسائل الدفاع والمواجهة التي تخشى منها امريكا .<br />4- عدم قدرة امريكا على المواجهة الطويلة بعيدا عن مصادر الدعم اذا ابعدنا الدول العربية عن المشاركة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125112/http://www.20at.com/article2.php?sid=280"

