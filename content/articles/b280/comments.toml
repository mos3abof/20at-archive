subject = "الاسلم بخير"
author = "السندباد"
posted = "2006-04-28"
text = "نحن من المسلمون ونفرح علشان دولة زى ايران بتكلم باسم الاسلام وبتكلم العالم والامريكان فى وقد العالم العربى بعد عن السياسى والتكنولوجى النووية واسراءيل تملك السلح النووى"
archived = "2006-11-02"
