[[comments]]
order = 10
subject = "الحرب على ايران"
author = "حسين الفلسطيني الجريح"
posted = "2006-05-17"
text = "سم الله الرحمن الرحيم<br />انا الغطرسة الأميركية الإسرائيلية الأوروبية المتمثلة بالتصهيون الملسيحي (البروتستانت) لن يتركوا ايران تعمل البرنامج النووي على راحتها وهيحاربوها والي جاء امريكا لمحاربة العراق وايران وسوريا ما هي الا ايمان امريكا بأن هذا الزمان هو زمان هرمجدون (الملحمة الكبرى) الي بإعتقادهم نزول عيسى عليه السلام<br />ولن تتخلى امريكا عن هذه الحرب مهما حصل وانها ستواجه ايران عسكريا وبعيداً عن مجلس الأمن لاكن روسيا والصين لن تقبل بهذا واني والله اعلم لأشك بأن يكون هناك تعاون عسكري روسي صيني مع ايران ضد امريكا وبريطانيا وفرنسا والمانيا وسيكون الإنتصار للإيرانين وستكون حرب فتاكة تؤتي أًكلها على التكنولوجيا جمعاء واعادة الناس الى العصور القديمة وستكون هذه المعركة الحاسمة وساحتها فلسطين (هرمجدون ) وهو سهل مجدو والله اعلم وتحيا ايران الي رفعت راس المسلمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125112/http://www.20at.com/article2.php?sid=280"
