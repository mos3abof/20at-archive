order = 0
subject = "لأنهم يحترمون انفسهم"
author = "ديمة"
posted = "2006-01-19"
text = "ملامح الصورة طبيعة وتخضع لقواعد المنطق الذى يقول ان الشعب والنظام الايرانى كيان يعتز بنفسه ويخلق مكانته بالفعل ولا يجد الا المواجهة والتحدى سبيل لكسر الغطرسة الامريكية الجامحة، اما الخضوع والذل فهى آامور لاتخص الا امصالنا ممن ارتضوا دائما ارتياد المقعد الاخير بعد ان كسر."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125112/http://www.20at.com/article2.php?sid=280"

[[comments]]
order = 1
subject = "واحنا فين من الكلام ده ؟"
author = "Hesham Hamza"
posted = "2006-01-19"
text = "دلوقتي ايران بتعمل ابحاث حول برنامجها النووي. تفتكروا ليه ؟<br />ممكن تكون عايزة تبقى قوة عظمى في المنطقة اللي مافيهاش راجل ؟<br />ممكن تكون بتطور برنامجها النووي عشان اغراض سلمية ؟<br />ممكن تكون بتأمن نفسها. عشان ميحصلش معاها ذي ماحصل مع جيرانها ؟<br />ممكن يكونوا بيفكروا لبعيد. حيث ان احطياطي النفط في ايران يخلص خلال 20 سنة. بالتالي هيبقوا محتاجين موارد للطاقة؟ هيجبوها منين؟ مافيش حاجة بتيجي بالساهل. هو ده المنطق. معاك سلاح نووي الكل يحترمك ويعمل لك الف حساب.<br />على فكرة مافيش دولة عربية واحدة عندها سلاح نووي. بس الحمد لله فيه مطاوي وسيوف.<br />كفاية كده النهاردة ونتقابل في الحرب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125112/http://www.20at.com/article2.php?sid=280"

[[comments]]
order = 2
subject = "عملناها مرتين"
author = "مصــegyـــري"
posted = "2006-01-19"
text = "الاستاذ بتاع( احنا فين من الكلام ده )<br />لامؤاخذة بأه<br />احنا عملناها مرتين<br />مرة في فيلم (الطريق الى ايلات)<br />و الاخيرة في فيلم ( ليلة سقوط بغداد )<br />قهرنا الاعداء و عملناها .. بس على نفسنا !!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125112/http://www.20at.com/article2.php?sid=280"

[[comments]]
order = 3
subject = "اة"
author = "مصرى"
posted = "2006-01-20"
text = "واللهى نجاد دا رئيس ايران غبى وعامل نفسو حاجة وهو ولا حاجة<br />وهيجيب المشاكل لبلدو هم فى كفاية عنها<br />طيب لية بيعمل كدا ؟<br />الغرب بيكرهو ايران مهما عمل<br />ولو عاوزين يدمروها هيقدرو<br />يبقى يحترم نفسو ويحط لسانو جوة بقو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125112/http://www.20at.com/article2.php?sid=280"

