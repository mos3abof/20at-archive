author = "مسلمات أبناء مسلمين"
posted = "2009-12-24"
text = "بسم الله الرحمن الرحيم<br />ما هو سبب حضور السيدة مريم والمسيح الى مصر<br />لان السيدة مريم خافت عليه من القتل فشارت عليها الروح القدس بالذهاب الى مصر<br />والكلام دا موجود في الانجيل<br />السيدة مريم خافت على المسيح من القتل<br />والالهه لا تقتل<br />اذن المسيح خافوا عليه من القتل<br />اذن هو بشر مثلنا مثله<br />هو دا المراد من هذه القضية<br />سبب هجرة المسيح الى مصر مع امه خوفا عليه من القتل من القتل من القتل<br />فهمتوها يا مسيحيين ولا لسه<br />الالهة لا تقتل يا اغبياء البشر بس هما اللي يقتلون<br />خلاص المسيح ليس اله والا ما كانوا خافوا عليه من القتل<br />بالعقيدة المسلمة لانؤمن إلا بما جاء ف القرأن الكريم مهما سحر أعيينا ومهما كان فعل من أفعال الشياطين من الأنس أو الجن.<br />أو لعبة الليزر جت غلط ع الكنيسة.<br />وما كان المسيح وأمه إلا عبادا لله وحده لاشريك له.<br />بسم الله الرحمن الرحيم{قل هو الله أحد{1} الله الصمد{2} لم يلد ولم يولد{3 }ولم يكن له كفوا أحد{4}"
archived = "2009-12-26"
capture_url = "https://web.archive.org/web/20091226210842/http://www.20at.com:80/masr/hot-topics/14570--qq-.html"

[[comments]]
