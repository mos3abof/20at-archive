capture_url = "https://web.archive.org/web/20091226210842/http://www.20at.com:80/masr/hot-topics/14570--qq-.html"

[[comments]]
order = 8
subject = ""
author = "عجبي!"
posted = "2009-12-25"
text = "كل مسلم أو مسيحي رد و فضلو يشتمو في تاريخ بعض و التعصب دى بيدل على حاجة واحدة انو الطرفين مش فاهم كتابو صح … لا إنجيل و لا قرآن .. و قبل ما اي حد يبدأ يهاجم الطرف التاني يكون عارف هوا بيتكلم عن ايه .. لأنو دا دين مش لعب عيال … و أنا مش بتفلسف بس ازاي مسلم ومسيحي بيشتمو في بعض و اكيييد لازم يدخلو الجنس و الالفاظ التانية … يعني دى اثبات انكو سطحيين .. ما هو اي مصري مش متأكد من اللي بيقولوا ومش عايز حد يهاجموا هيقعد يشتم في العرض و ألفاظ على أفا من يشيل …<br />انا تعاملت مع كتير مسيحين مصريين وغير … كانوا نايس<br />بس انو واحد جاهل و مش عارف هوا بيتكلم عن ايه و لا هوا البابا و لا ملتزم بديانة صح .. يجي و يشتم ويسب في أنبياء …<br />دى اسمو جهل … و بعدين لامتى هنفضل نقول عرب وما عرب و شوفو تاريخو وتاريخنا و امريكا … سيبو الحجج .. و التاريخ .. خليكو في دلوقتي و بلاش قعدة على القهوة .. و نقول كنا .. وأيام مش عارفة ايه … و بلا كتر تخبيص يا عالم"
archived = "2009-12-26"
capture_url = "https://web.archive.org/web/20091226210842/http://www.20at.com:80/masr/hot-topics/14570--qq-.html"

