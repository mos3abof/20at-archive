author = "شاهد ماشفش حاجة"
posted = "2009-12-24"
text = "رحت الوراق اشوف الكلام اللى بيقولوا علية<br />ما شفتش اى حاجة<br />واحد قهوجى بجانب الكنيسة قال لى يظهر ان فية ولد بيلعب بكشاف ليزر فوق صليب الكنيسة بعد نص الليل والهبل يصرخوا هوبا هوبا هوبا العدرا فوق القبة<br />طيب فوق القبة بتعمل اية<br />اية الهدف من زيارتها<br />معجزة اية<br />قالوا واحدة مسيحية كانت عمياء وشافت العدرا وشفيت ونظرها بقى ستة على ستة ولا زرقاء اليمامة<br />كلها تخاريف وكلام مالوش اى لزمة<br />وانا نفسى امسك الولد بتاع كشاف الليزر دة"
archived = "2009-12-26"
capture_url = "https://web.archive.org/web/20091226210842/http://www.20at.com:80/masr/hot-topics/14570--qq-.html"

[[comments]]
