posted = "2009-12-24"
text = "والله انا ليا وجهة نظر مختلفة عن ظهور السيدة مريم العذراء… انا متفرقش معايا اذا كانت ظهرت او لا… بس الانا ملاحظه ان لما ظهرت الملايين فرحت جدا .. و دي اهم حاجة .. و لو كان دة ممكن يفرح الناس و ينسيها همها يا رييت تظهر تاني و كل يووم لية لا؟؟؟… هو قد يكون هذا مخالف للعلم و صعب على عقل الانسان تصديقه… لكن في الأول و في الأخر رسمت الابتسامه على وجه انسان سواء مسلم او مسيحي… و هو دة الأهم"
