text = "اقتباس الشيخ الشكسي:<br />خسئت يا ابن الززانية . و الله لو رأيتك لقطعت رأسك فوراً .لقد تماديت و تطاولت على أشرف نساء الخلق يا ابن القردة و الخنزير . لقد سقطت في هاوية جهنم . و أخيراً ظهرتم على حقيقتكم فلن تجد مسلماً واحداً يتطاول على السيدة مريم . و لكن كما يقال ان لم تستحي فانك سافل لعين . و على فكرة أبو بكر صديق رغماً عن أنفك الممرغ بالتراب .<br />و السلام عليكم و رحمة الله .<br />ايه يا عم فيلم ملاكي قريش اللي انت فيه ده .. و بعدين انت تقطع راسه ليه انت مين اصلا عشان تعاقبوا .. لو غلط ربك يايعاقبوا .. واالا انت بقى بتساوي نفسك بربك ؟؟ لو ربك هو الوحيد اللي بيغفر .. يبقى هو الوحيد اللي يعاقب"
