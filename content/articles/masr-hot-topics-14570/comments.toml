subject = ""
author = "الامراض النفسية"
posted = "2009-12-24"
text = "العدرا ظهرت فى الوراق<br />العدرا ظهرت فى شبرا<br />العدرا ظهرت فى الزيتون<br />ناقص يقولوا لنا العدرا واقفة على باب الكنيسة وبتسلم على الداخلين<br />واضح ان فية حاجة نفسية تعبانة وبتخللى الجماعة يشوفوا تهيؤات وهلاوس<br />طيب العذراء لية لم تظهر فى مقر البابا فى كنيسة الفاتيكان ولا كتدرائية روما ولا متدرائية باريس او لندن<br />مش معنى الوراق بالذات<br />طبعا نحن نؤمن ان مريم سيدة نساء العالمين وان اللة طهرها واصطفاها على نساء العالمين<br />واجمل كلام نزل عن الست الطاهرة مريم نزل فى القران الكريم فى سورة مريم بل مجدت مريم فى القران اكثر مما مجدت فى الاناجيل<br />واضح ان الجماعة تعبانين نفسيا ومحتاجين طب نفسى"
archived = "2009-12-26"
capture_url = "https://web.archive.org/web/20091226210842/http://www.20at.com:80/masr/hot-topics/14570--qq-.html"

