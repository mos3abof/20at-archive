text = "مش عارف هما كانوا رايحين يشجعوا الفريق القومي لكرة القدم ولا ايه<br />ناس عمالة تزغرط وناس بتقولي بص شوف العذرا بتعمل ايه<br />هما هبل ولا ايه<br />مفيش انسان عاقل على وجه الارض سواء مسيحي او مسلم يصدق حاجة زي كده<br />والناس تقولك هما الغرب وامريكا بيضحكوا علينا ليه محنا زينا زيهم<br />لا محناش زينا زيهم احنا لسه متاخرين بنؤمن بحجات غبية زي العين والايد واخر حاجة جديدة طلت ظهور العذرا<br />طبعا كلام فاضي"
