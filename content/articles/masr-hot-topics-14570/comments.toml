text = "مريم والمسيح في مصر<br />ما هو سبب حضور السيدة مريم والمسيح الى مصر<br />لان السيدة مريم خافت عليه من القتل فشارت عليها الروح القدس بالذهاب الى مصر<br />والكلام دا موجود في الانجيل<br />السيدة مريم خافت على المسيح من القتل<br />والالهه لا تقتل<br />اذن المسيح خافوا عليه من القتل<br />اذن هو بشر مثلنا مثله<br />هو دا المراد من هذه القضية<br />سبب هجرة المسيح الى مصر مع امه خوفا عليه من القتل من القتل من القتل<br />فهمتوها يا مسيحيين ولا لسه<br />الالهة لا تقتل يا اغبياء البشر بس هما اللي يقتلون<br />خلاص المسيح ليس اله والا ما كانوا خافوا عليه من القتل"
