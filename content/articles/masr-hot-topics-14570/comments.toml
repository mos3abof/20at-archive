text = "اقتباس ضوء القمر والسحابة:<br />الموضوع ببساطة ان القمر بيظهر اخر الليل واشعتة بتضرب فى سحابة بتمر او واقفة فوق الكنيسة او المنطقة فالسحابة بتلمع وتظهر كانها ضوء يعنى ان السحابة بتعمل عمل المرايا وتعكس الضوء<br />وطبعا اخوانا بتوع هوبا هوبا العدرا فوق القبة<br />بيتلموا ويصرخوا هوبا هوبا العدرا فوق القبة<br />العدرا فى السماء عند ربها اللى خلقها وهتظهر تعمل اية<br />انت بتتكلم بجد ؟؟؟ انعكاس القمر على السحاب .. كذا يوم ؟؟؟ بين المنارتين ؟؟؟ تحت الصليب ؟؟ ب 3 الوان ؟؟؟ و هوبا هوبا دي .. تعبير عن الفرحه … بس انا فاهم انك مش واخد على المحبه بينك و بين اللي خلقك و مش بتوْمن بالقديسين برضه .. احب اقولك بقى ان العدرا كانت عارفه ان دي فرحه فمفيش مشكله انهم يعبروا عن فرحتهم باسلوبهم … عشان الله محبه .. سلام"
