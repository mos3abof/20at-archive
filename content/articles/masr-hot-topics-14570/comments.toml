text = "الموضوع ببساطة ان القمر بيظهر اخر الليل واشعتة بتضرب فى سحابة بتمر او واقفة فوق الكنيسة او المنطقة فالسحابة بتلمع وتظهر كانها ضوء يعنى ان السحابة بتعمل عمل المرايا وتعكس الضوء<br />وطبعا اخوانا بتوع هوبا هوبا العدرا فوق القبة<br />بيتلموا ويصرخوا هوبا هوبا العدرا فوق القبة<br />العدرا فى السماء عند ربها اللى خلقها وهتظهر تعمل اية"
