posted = "2009-12-25"
text = "((قال الطبرانى حدثنا عبد الله بن ناجيه حدثنا محمد بن سعد العوفى حدثنا ابى انبانا عمى الحسين حدثنا يونس بن نفيع عن سعد بن جنادة هو العوفى قال قال رسول الله:<br />ان الله زوجنى فى الجنه مريم بنت عمران وامراة فرعون واخت موسى وعن ابى داوود قال دخل رسول اله على خديجه وهى فى مرضها الذى توفيت فيه فقال لها بالكره منى ما ارى منك يا خديجه وقد يجعل الله فى الكره خيرا كثيرا اما علمت ان الله قد زوجنى معك فى الجنه مريم بنت عمران وكلثم اخت موسى واسيه امراة فرعون"
