author = "زكريا الدرديري"
posted = "2009-12-24"
text = "أرى أن العقيدة التي لا ترى لتوكيد مصداقيتها غير ملاذ الخوارق والكرامات والظواهر العجيبة هي عقيدة أضعف من أن يصدقها الناس بعقولهم ويقبلوها بقلوبهم.<br />نحن في زمن أدرك فيه الناس معنى العلم والفهم، ونبذوا كل إيمان يقوم على غير وعي ويقين.<br />إني لا أنكر أبداً ظهور العذراء.. لمن رآها… غير أني أتساءل لماذا لم تظهر العذراء في مناطق تسودها المستويات الاجتماعية والتعليمية الأرقى كالزمالك والمهندسين ومصر الجديدة ومدبنة نصر ؟"
