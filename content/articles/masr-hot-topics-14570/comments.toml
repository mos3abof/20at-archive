author = "مصطفى رمضان"
posted = "2009-12-24"
text = "الاقلية الصغيرة المنعزلة التى تعيش خلف سور من الاوهام والمخاوف والتخاريف تنتظر دايما لحاجات خارقة وتهيؤات غريبة<br />يعنى مثلا بيتخيلوا ان عددهم 12 مليون مع ان اكبر منظمة فى العالم للتعداد امريكية قالت انهم 4 مليون<br />وبيتخيلوا ان مصر هتبقى مسيحية تانى<br />وبيتخيلوا انهم هيتكلموا لغة لاتينية تانى اسمها القبطية<br />وبيتخيلوا ان مصر هتبقى زى الاندلس وهيرجعوا الناس بالقوة مسيحيين<br />وبيناموا مرعوبين واذا سقط فيهم واحد فى الامتحان يبقى اضطهاد للاقباط<br />واذا بنت مسيحية احبت ولد مسلم بيبقى خطف بنات الاقباط<br />واذا واحد قبطى اتقتل بيبقى اضطهاد الجالية القبطية<br />ومنتظرين مخلص من السماء<br />العدرا جاية تخلصهم من مخاوفهم الوهمية<br />ربنا يشفيهم<br />ويفك عقدهم<br />ويهديهم"
archived = "2009-12-26"
capture_url = "https://web.archive.org/web/20091226210842/http://www.20at.com:80/masr/hot-topics/14570--qq-.html"

