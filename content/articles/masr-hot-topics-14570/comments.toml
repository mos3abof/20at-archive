text = "خسئت يا ابن الززانية . و الله لو رأيتك لقطعت رأسك فوراً .لقد تماديت و تطاولت على أشرف نساء الخلق يا ابن القردة و الخنزير . لقد سقطت في هاوية جهنم . و أخيراً ظهرتم على حقيقتكم فلن تجد مسلماً واحداً يتطاول على السيدة مريم . و لكن كما يقال ان لم تستحي فانك سافل لعين . و على فكرة أبو بكر صديق رغماً عن أنفك الممرغ بالتراب .<br />و السلام عليكم و رحمة الله ."
