posted = "2009-12-29"
text = "و اخر حاجه كل الفيديوهات اللي بتتكلم عن الهولوجرام بيكون الهولوجرام فيها \"شفاف\" و حجمه \"صغير\" .. يا تري حد شاف حاجه من ورا العدرا ؟؟؟ و كانت حجمها ايه بالظبط ؟؟؟ ذي الفيديوهات بتاعت الهولوجرام ولا فحجم قبه الكنيسه ؟؟؟ و لو لاحظتوا هاتلاقوا ان الصليب طلع فوق الست العدرا ده هولوجرام تاني برضه ؟؟؟ لو كده نفسي اعرف العبقري اللي صمم الموضوع ده عشان ارشحه لجايزه نوبل انه عرف يعمل حاجه زي كده في بلد ذي بلدنا نص سكانها كل علاقتهم بالتكنولوجيا هي الفيس بوك .. و البنت المسيحيه دي غلطانه لان احنا ميهمناش مين يبقى مسيحي ولا مين يبقى مسلم لان دي لربنا و انا مش فارقه معايا لكن محدش يجي على معتقداتي"
