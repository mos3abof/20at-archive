[[comments]]
order = 6
subject = "الى سعد الفقه والى من فقد الابن والاهل والرفقه وال"
text = "اصبر واحتسب ان فرج الله لاقريب واقسم بالله اني ارى سقوط الاسره المستبده باذنهي تعالى وبدئو شباب هاذا الوطن الذي لم ياكل خيراتهو الى من طاطا رئسهو للطواغيت ولكن اوعد كل من لم ياكل من خيرات هاذا الوطن باكل لحم هائولاء الطواغيت المستبدين ولكن حلمكم على اخوووانكم المنتصرين ول يعرف عائلت ال سعود من هم بلفعل ليس بلكلام وازف لهم الخبر انتضرو وسوفا ترون من هم المنتصرون ،، الله اكبر ،،"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024125906/http://www.20at.com:80/article.php?sid=237"

[[comments]]
order = 7
subject = "assem111@yahoo.com."
text = "بسم الله الرحمن الرحيم<br />ان هذا كله كلام ولاكن اين الفعل وان احد ابنا هذا البلد الطاهر وارجوا من الله ان يجعل هذا البلد في امان وخير ويجعلنا في ستر دائم اما ما نراه من احداث في جميع الدول العربية فهذا والله من فعل العدو الصهيوني فهو المستفيد من هذا التفرق لكي يبني دولة التي كان يحلم بها من قديم العصور فالن اصبح الحلم اقرب من الخيال ولاكن لاينصر الله الا المومنين ."
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024125906/http://www.20at.com:80/article.php?sid=237"

[[comments]]
order = 8
subject = "الي من يسب ويشتم"
text = "لا حول ولاقوة الا بالله العظيم<br />هل انت مسلم؟؟<br />هل انت عندك احساس؟؟<br />هل عندك عرض واخوات؟؟؟<br />ياخي اتق الله في نفسك<br />ماهذا السب والشتم الشنيع<br />اي تقدم واي تطور وانت تسب وتشتم بالفاظ<br />لايرضاها الله ورسوله المصطفى صلي الله عليه وسلم<br />ولا يرضاها اي انسان عنده ذرة عقل وكرامه<br />مهما حصل من خلاف في وجهات النظر او التوجه السياسي<br />فلا يجوز السب والشتم"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024125906/http://www.20at.com:80/article.php?sid=237"

