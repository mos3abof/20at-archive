text = "نشكر الكاتب على ذكره رجال المقاومة الفلسطينيين وانا بدوري كأحد رجال المقاومة اريد توضيح نقطة نحن نرتدي القناع الاسود(اللثمة)ليس من القوات الإسرائيلية فحسب بل من العملاء الذين تدسهم الصهيونية والشاباك (المخابرات )في قلب الأراضي الفلسطينية والادهى والامر هي من قوات السلطة الفلسطينية حسبنا الله ونعم الوكيل<br />لظلم ذوي القربى ادهى من وقع السيف المهند"
