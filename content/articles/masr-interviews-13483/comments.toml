text = "يا ساتر على سماجة ام واحد دم امة يلطش بلد اسمة هنيدى<br />الولد دة ريحنا من رخامة امة<br />وفى وقت قصير بقى لة انتشار ونجح ابتداءا من اعلانات الشيبسى الى راجل وست ستات<br />ربنا يوفقك"
