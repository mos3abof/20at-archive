[[comments]]
order = 14
subject = "من ومن"
author = "احمد جواد"
posted = "2006-08-11"
text = "السلام عليكم..بس اريد اعرف ..ايران من تساند المقاومة الباسلة في فلسطين ليش ما احد استنكر على المقاومه الفلسطينيه..ليش بس حزب الله يسمونه صفوي ويسمونه عميل لأيران والى اخره؟؟؟ بعدين احنه المفروض شوكت ما تصير عدنه الجرأه ندعم المقاومه في فلسطين ولبنان مثل ما تفعل ايران ذاك الوقت خلي نحكي ..بس احنه ضامين روسنه ونهرج..منو من رؤسائنا وقف بكل شجاعه وقال:يجب ازالة اسرائيل من الوجود؟؟؟انه الايراني احمدي نجاد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123655/http://www.20at.com/article2.php?sid=1105"

