subject = "كفى سخافه"
author = "محمد"
posted = "2006-08-08"
text = "ماذا فعل الملك عبد الله السني و ملك الاردن المبجل ضد اليهود ماذا فعل السنة كلهم من اجل الاسلام و المسلمين ان الحقد الذي ربيتم عليه ايها السنة ولا اقول كل السنة لهو من تربية يهودية خالصه وعلمائكم الذين حرمو الجهاد خوفا على كراسي ملوكهم لهم اولى بان يكونو حاخامات ليس اكثر"
