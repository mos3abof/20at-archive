author = "لبيك يا نصرالله"
posted = "2006-10-07"
text = "سوال تافه والرد اتفه والله انتم قوم جهال والله يكون على الظالمين ان بعد الظن اثم<br />ياريت تكون اخلاقكم مثل اخلاق الخلافاء الراشدين وانتم اجهل قوم في الوجود انتم اجهل من قوم اليهود الصهاينه<br />وعليكم السلام ورحمه الله وبركاته"
