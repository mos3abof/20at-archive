subject = "حلمت بيك والله يا نصر الله"
author = "..& هيكل الأزهرى &.."
posted = "2006-08-22"
text = "والله يا جماعه انا من اكتر الناس اللى فعلا بتحب الراجل دا وفعلا بتقدره جدا جدا ولسه من يوم بالظبط حلمت بيه حتى فى الحلم قمة التواضع واللع ربنا يكرمك يارب يا نصر الله والله انت نصر للأمة بجد وعاوز اقول ان اللى بيقول سنى وشيعى ياريت يفكر بعقل وييقن ان الحساب من رب العباد مش مننا احنا لنفسنا حراااام عليكم متفسدوش فرحة الملايين بكلام وااااهمييييييييييييييييييين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123655/http://www.20at.com/article2.php?sid=1105"

[[comments]]
order = 17
subject = "كفى خراب"
author = "سعودية"
posted = "2006-09-01"
text = "اننى احترم كل من يحب او يكره حسن نصرالله ولكن هل نساند نصر الله علشان يزيد النصر ولاالخراب طبعا احنا عايزين ا لنصر لكن لماذا مش علشان نعيش فى امن وسلام طيب فكرنا كم طفل يموت كم دولة انهارت لغاية دلوقتى وكم طفل اسرائيلى اوعراقى اولبنانى اوغيره يموت ففى الاخر هم اطفال ينتمون الى الانسانيه التى هى رمز كل فرد منا فانا لا اشجع الدمار بل اشجع الاتحاد بين الدول العربية مش فى الدمار والخراب لا ولكن فى العمار ولاثبات للدول الغربية باننا دول راقية تتعامل بالقيم والحضارة لاعمارالكون ويصعب عليا الاطفال الذين يموتون فارجوا من اتلعرب الاتحاد فورا لوقف المجازر وشكرا......"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123655/http://www.20at.com/article2.php?sid=1105"

