[[comments]]
order = 12
subject = "الصهاينة الخنازير و العرب خوافون"
author = "محمدي يونس"
posted = "2006-08-06"
text = "إن الصهاينة الإسرائلييين لن ينجحوا في زحزحة لبنان و حزب الله و الله هو الحق المبين أنا سني لكن على نصرة حزب الله بغض النظر عن الطائفية و الله هذه الطائفية مصدرها اليهود و من يفتي على مقاطعة حزب الله فهو يهودي لا يريد للأمة الإسلامية إلا الذل ما نطلبه من العرب ليس التدخل العسكري بل يجب علييهم أن يقفوا مع لبنان كما قال نبيه بري و حسن نصر الله رمز الأمة الإسلامية و العربية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123655/http://www.20at.com/article2.php?sid=1105"

[[comments]]
