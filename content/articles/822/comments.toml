subject = "سنه وشيعه"
author = "ع"
posted = "2006-07-28"
text = "سلام عليكم انا مساله سنه وشيعه مساله مخجله امام العالم الغربي والعالم ككل العدو كل يوم يدخل بيت من بيوت اخوننا وكل يوم يقتل اخوننا في افغانستان والعراق وفلسطين واليوم في لبنان ونحن نقول هذا سني وهذا شيعي كم انتم اغبياء وحقراء يامسلمين هذا القرن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123655/http://www.20at.com/article2.php?sid=1105"

[[comments]]
order = 5
subject = "الرد على ابن جبرين"
author = "محمد بركات"
posted = "2006-07-29"
text = "لماذا يامفتي تفتي بماتؤمر به وليس بما انزل الله تحرم مساندة حزب الله المسلم وتدعمون الامريكان في العراق وتخرج طائراتهم من السعوديةلضرب اطفال العراق ولاشيخ خرج وقال حرام مساندة الامريكان على الشعب المسلم السني والشيعي في العراق اما عند حزب الله ظهر جبرين وشمر عن ذراعيه وقال حرام مساندة حزب الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123655/http://www.20at.com/article2.php?sid=1105"

[[comments]]
order = 6
subject = "والله عيب علينا"
author = "ربيع"
posted = "2006-07-29"
text = "لم يحقق العرب انتصارا واحدا ضد الصهاينة عبر التاريخ الا انتصارا واحدا وهو انتصار اخواننا الشيعة حزب الله على اسرائيل سنة 2000. لم نجد موقفا شجاعا ضد امريكا و اسرائيل من حكامنا العرب الجبناء الا الموقف العظيم لايران الشيعة المسلمة. يا اهل السنة، راجعوا حساباتكم فانتم في أعين العالم اغبى الاغبياء."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123655/http://www.20at.com/article2.php?sid=1105"

[[comments]]
order = 7
subject = "هبوا لنصرة حزب الله"
author = "a_m"
posted = "2006-07-29"
text = "ياناس ياعالم ياايها الراقدون تحت تراب الحكام الخونة ان حزب الله يدافع عن وطن الاتفهمون مامعنى وطن رحم الله عرابى وزغلول<br />الدفاع عن الوطن لايفرق بين سنى وشيعى ولابين مسلم ومسيحى<br />لقد اعلن جميع مسلمو العالم سنه وشيعة تكاتفهم مع السيد حسن نصر الله فاين انتم يامسيحيوا لبنان الم يحن الوقت للدفاع عن الوطن ولو بالهتاف فقط<br />ولا تخافووووا ان السيد حسن نصر الله لايطمع فى سلطة ويكفيه فخرا حمل راية الجهاد فى سبيل الله<br />نصرا نصرا نصرا قريبا باذن الله ياحزب الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123655/http://www.20at.com/article2.php?sid=1105"

[[comments]]
order = 8
subject = "لإصحاب العقول"
author = "عبد الحميد"
posted = "2006-07-30"
text = "لعل المصيبة الكبرى ليست دولة اليهود ولكن الجهل هو المصيبة والطامة ، هل وقف الشيعة مع السنة في حربهم ضد الروس في أفغانستان ؟ أم أنهم كانوا استخبارات دولة الالحاد ؟هل وقفوا معنا في حرب العراق أم أنهم كسروا ظهورنا ؟ هل ساعدوا في نشر الاسلام أم إنهم وقفوا مع التتار والزنادقة والقرامطة والاسماعيلية ؟<br />هل أهدافهم واضحة في حربهم مع اليهود ؟<br />هل الولاء والبراء في قطعة أرض أم في عقيدة ؟<br />قوم يسبون الصحابة في صلاتهم في التشهد \"اللهم العن الاول والثاني والثالث ...\" أبابكر وعمر وعثمان الكرام العظماء ، هل نتولاهم ؟؟<br />يتهمون أمنا عائشة الطاهرة بأنها زانية<br />يسبون جمهور الصحابة<br />عن نفسي أنا أمقت اليهود ولكن أنا أبغض الرافضة لأنهم سبوا بل لعنوا أصحاب الحبيب وأتهموا عرض الحبيب<br />إقرأوا الكتب والتاريخ ولاتكونوا أصحاب هوى ولاتكونوا حمقى<br />مايسمى زورا بحزب \"\"الله\"\" هم رافضة إمامية اثنا عشرية<br />رحم الله العلامة بن جبرين فقد قال عين الصواب ، بعد أن فقه الواقع وخاف على عقيدة أهل السنة والجماعة وعلم أن منهم طيبون وجاهلون سيركضون وراء شعارات جاهلية ، فنصح لله فجزاه الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123655/http://www.20at.com/article2.php?sid=1105"

