[[comments]]
order = 10
subject = "الى السيد حسن نصر الله"
author = "ابو ايوب"
posted = "2006-08-04"
text = "ااولا السلام على من قال وفعل ومن وعد وصدق السلام على من وضع روحة على كفة وهبها الى باريها وبعد******<br />الايحق لنا ان نطبق ماجاء به كتاب الله وسنة<br />رسوله الكريم<br />انهم الان يقتلون المدنيين لماذا لانرد عليهم بالمثل لن اقبل ان نعود الى ما تربينا علية قبل الان نحن لانضرب الابرياء امنهم الابرياء بربكم نريد ان نرى اشلاء المدنين كما نرى اشلاء شعبنا وابنئنا ان كنتم تحرصون على ما قال الاخ الامين العام نحن نتعامل بردات الفعل<br />اين ردات الفعل اين المدنين لايجبق ان تنحيد احد طلما انهم لايحيدون احد من عدوانهم<br />والسلام عليكم ورحمه الله وبركاتة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123655/http://www.20at.com/article2.php?sid=1105"

[[comments]]
order = 11
subject = "لا يجب ان ننسى"
author = "لا يجب أن ننسى أن الشيعة يقاومون الاحتلال في لبنان ويساندونه في العراق وافغانستان"
posted = "2006-08-04"
text = "ياربيع فاقرأ التاريخ جيدا ثم تكلم فخيانات الشيعة اكثر من بطولاتهم وهذا لا يقلل من قيمةانجاز حزب الله عام 2000.<br />واعلموا ايصا ان الخلاف بين السنة والشيعة في الأضول وليس في الفروع"
