order = 15
subject = "مش عايزين اعرف رأيك . ."
author = "منصور"
posted = "2006-08-20"
text = "مش عايزاعرف رأيك. .ايوة مش عايز اعرف رأيك .. لما يكون الموضوع بيختص بالدين وانت قاعد تفتي فيها .. يبقي مش عايز اعرف رايك .. اروح اسئل مختص في أمور الدين مش هو ده المنطق والعقل ..في حد بيروح يصلح عربيته عند بتاع البوابير.. روحوا اسئلوا الشيوخ العلماء رأيهم أيه في الشيعة وهل ينطبق عليهم قاعدة الولاء والبراء ....<br />وياريت تعرفوا رأي الشيعة فيكم ايه علشان تعرفوا تحكموا عليهم ..<br />السلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123655/http://www.20at.com/article2.php?sid=1105"

