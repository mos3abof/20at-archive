author = "شاب مصرى"
posted = "2009-11-26"
text = "يسلم قلمك بجد كل اللى جوه الواحد انتى قولتى<br />بس مشكلة الماتش زى مبينت الدول العربية اللى حتى معرفوش يصلحوا بين الاخوه ولاحتى فى عاقل يصلح من شأنه كمان بينت معظم الاعلام الرياضى المصرى وانه فعلآ ملهمش فيها كل واحد صحى الصبح لاقى نفسه اقدامه مايك وقاعد ادام كاميرا وفهم ان اهم حاجة الاعلانات حتى لو على اى موضوع علاقات عربيه مين هو فرقه عنده اه وكمان اتحاد كوره والللى حوليه اللى همهم بيع التذاكر والعلاقات الفنية والعلاقات باصحاب النفوز وطظ فى الجمهور والمتفرجين ومش عايز اقول الوطن لان هما اكيد مش فى بالهم اساسآ"
