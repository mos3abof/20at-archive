text = "فى قنوات كتير اوى مزوداها<br />الاوحد اتخنق من الحوار ده<br />مش لاقيين حاجه يتكلموا فيها غير حوار الجائر<br />عاوزين حد ياخد موقف و نخلص منه الحوار ده<br />بعد ما الريس طلع قال كلمته<br />ايه الى حصل ؟؟؟<br />ولا حاجه…"
