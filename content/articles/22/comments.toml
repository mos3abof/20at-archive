[[comments]]
order = 3
subject = "التجربة الفعلية"
text = "شرعا...لايجوز للمرأة إخبار الزوج عن ماضيهاقبل الزواج إن كان به ما يسئ إليها.....وكذلك الزوج.<br />والإنسان إذا ما ستره الله وقت المعصية فلا يحق له أن يجاهر بالمعصية لأي شخص...........وفي حديث النبّي (كل أمتي معافى إلا المجاهرين...) أي الذين سترهم الله ثم يقومون بهتك ذلك الستر.<br />والتجربة الفعلية أن أحد الأخوة المتزوجين حديثاطلب من زوجته أن تخبره بماضيها قبل الزواج وهل أحبت شخصا قبله أم لا؟؟؟!!!!!!..وألح الزوج فأخبرته العروسة أنه قدم تقدم لخطبتها رجل وقدأحبته و أحبها ولكن الله قدّر عدم إتمام الأمر وأنه لم يقع شيء في الحرام منهما وتم فسخ الخطبة..و أنتهى الأمر عند هذا الحد ....<br />فما كان من العريس إلا أنه دخل في دوامة من الحزن والاكتئاب وبدأ يبتعد عن العروسة نفسيا و جسديا بالتدريج حتى صار يبكي من شدة الحزن وصار الزواج كله على كف عفريت.......<br />أتقوا الله ولا تسألوا عن الماضي...<br />كم من شاب وفتاة قضوا ساعة من العمر في المعصية ثم تاب الله عليه..فما الذي سفيد في معرفة ما فات و أنقضى"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417200319/http://www.20at.com:80/article.php?sid=76"

