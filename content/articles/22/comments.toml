[[comments]]
order = 5
subject = "حسام غريب"
text = "ايه الناس اللي بتعلق دي ومش فاهمة حاجة<br />يعني شيرين ماجبتش حاجة من عندها<br />هذا راي الشرع ويعني اللي معترض ومش عاجبه دا هيفهم احسن من القرضاوي ولا عطية صقر<br />لا بجد ايه الناس دي؟؟؟"
archived = "2004-07-01"
capture_url = "https://web.archive.org/web/20040701041548/http://www.20at.com:80/article.php?sid=76"

[[comments]]
order = 6
subject = "hussam13407@hotmail.com"
text = "بسم الله الرحمان الرحيم والحمدلله رب العالمين والصلاة على خاتم الانبياء والمرسلين سيدنامحمد<br />من اسماء اله الحسنى *** الستار*** فهل يجوز لنا ان نفضح ما ستره الله ليلا في النهار وا ان نفضح ما ستره الله نهارا في الليل؟؟؟؟؟؟؟؟؟<br />سؤال... لماذا اصبح الحساب في مجتمعات المسلمين للفتاة فقط او ليس الشاب ممحاسبا امام الله كالانثى؟<br />واذا كان الدليل على عفة الفتاة وطهارتها هي البكارة<br />فما هو الدليل على عفة الشاب....<br />واعتقد بان البكارة في هذا العصر لم يعد دليلا على عفة الفتاة لانها ممكن ان تجري عملية لاعادة الغشاء......<br />والسلام عليكم"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041307/http://www.20at.com:80/article.php?sid=76"

[[comments]]
order = 7
subject = "ناس وللا بقر؟ الله اكبر"
text = "شو هو الدين كذب وللا شو؟ ما بيقوللك الشرع, والشرع ايش يعني؟<br />اش معنى انو دايما البنت البنت والشاب شو ع راسو ريشة يعني؟<br />ع كل ايش بيقول الشرع لازم نمشي وللا كان اللي مش عاجبو يطلع من الاسلام....<br />بعدين ما هاي فتوي وربنا ما خلقنا عشان يعجزنا وفش انسان معصوم عن الخطا وربنا بيحب العبد اللي بيستغفر وبيتوب.....<br />على الله انو نلاقي بس ناس تفهم"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041307/http://www.20at.com:80/article.php?sid=76"
