[[comments]]
order = 2
subject = "أنا على أتم إستعداد للمساعدة"
text = "السلام عليكم ورحمة الله وبركاته<br />الاخوة الكرام بارك الله فيكم جميعاً، أنا مع رأى الأخ الفاضل الذى اقترح أن ترسل رسولا من عندك اختك أو والدتك ، ولكن يصعب ذلك فى بعض الأحيان لأن بعض الشباب ليس لهن أخوات فتيات أو عدم إستعدادهن لعمل كهذا ، لذا فأنا مستعدة لأى مساعدة وبالفعل لقد يسر الله لى ذلك من قبل فكنت سببا فى زواج بن عمتى من اخت صديقة لى ، فأنا على معرفة وثيقة بكثير من الأخوات الفضليات وأدعو أن يرزقهن الله بزوج صالح مثلما من الله على به.<br />اختكم عمرية"
archived = "2005-02-17"
capture_url = "https://web.archive.org/web/20050217083938/http://www.20at.com:80/article.php?sid=853&mode=&order=0"

[[comments]]
