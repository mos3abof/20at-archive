subject = "1F U T|-|1/\\/k f*k 15"
text = "مفش احسن و اسرع طريقه من الجنس و الحب بدون زواج و ورق<br />لان الحب مش ورقه او حتى معامله لا ده رباط بين جسدين و روحين قلبيا<br />مش بورقه<br />و الورقه دى من اخر الحجات و اقصد بالورقه الزواج<br />و السبب اللى يخلينى اقول كده الجواز و مشاكله و تقاليده المتخلفه و نهاياته اما بالاطلاق او الزواج من اخرى<br />فا هم كانهم كتبوا عهده بنصيب من الفلوس و تالمكاسب و الخسائر و كل واحد يستغل سلتطته فى حاله المشاكل<br />و ديما الزواج المنتشر الايام دى يا اما باعجاب شكلى جنسى<br />او عشان مصلحه الفلوس او العيشه المرتاحه زى ما بيشوفوها<br />او لتقاليد متخلفه و هى ان البنت لازملها راجل<br />عشان يحميها<br />و ده مس اسباب مجتمعنا المتخلف<br />او طبعا العيال و ده يمكن من اهم تانواع الزواج<br />و ديما نلاقى بعد العيال مفيش حب او رباط بين الازواج لانهم خلصوا اللى عايزينه و اهتموا بالمكسب اللى كانوا مستينه<br />و للاسف كنت فاكر الزواج حب فا طلع مقسم اقسام اخرى غير الحب و منتشره<br />______________<br />عكس الدنيا"
archived = "2005-02-17"
capture_url = "https://web.archive.org/web/20050217083938/http://www.20at.com:80/article.php?sid=853&mode=&order=0"

