subject = "في محطة القطار"
text = "لاحظت ان واحد ينظر يمين وشمال قولت في نفسي يمكن مستني مسافر... ومشية الى مكان الانتظار لقطع التذكرة فاذا به ورائي وبيسئلني انت متجوزة او مخطوبة??? طبعا فهمت قصده وقولت له مخطوبة. اعتذر وراح.<br />ولا اظن اني سببت له احراج"
archived = "2005-02-17"
capture_url = "https://web.archive.org/web/20050217083938/http://www.20at.com:80/article.php?sid=853&mode=&order=0"

[[comments]]
order = 4
subject = "بقة كدة يا كوكووووووو"
text = "مش تقولو من الأول ان دي اشتغالات يا ناس حرام عليكو<br />انا كدة بقالي 9 شهور مدحوك عليا<br />ياريت حد ينورنا بقى في المشكلة دي<br />نعمل ايه بعد ما نتدبس في حاجة زي كدا والناس العبيطة اللي بتصدق زي حلاتي تروح تموت الوقتي بعد اللي جرى ولا تروح فين<br />ايه الحظ دا بس<br />الموضوع دا مش كان يجي بدري شوية<br />الله يجزيك يا كوكو"
archived = "2005-02-17"
capture_url = "https://web.archive.org/web/20050217083938/http://www.20at.com:80/article.php?sid=853&mode=&order=0"

