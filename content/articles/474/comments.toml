subject = "أيمن المصري"
text = "طبعا هيذي نتيجة الفشل الاجتماعي المؤسسي، ما فيش أوساط أو بيئات ممكن الشباب يتقابلوا فيها و يكون هناك نوع من التعارف (زي النادي بس المشكلة إنه رفاهية طبقية) - في كلمتين: عدم الاختلاط.<br />‘شان كده الحل العبقري (الاسرع والفعّال) هو اللي قالته الأخت أعلاه - في كلمتين: عودة الخاطبة!<br />الظاهر إنها بقت ضرورة إجتماعية لمجتمعنا"
archived = "2005-02-17"
capture_url = "https://web.archive.org/web/20050217083938/http://www.20at.com:80/article.php?sid=853&mode=&order=0"

