[[comments]]
order = 6
subject = "شكرا لشعوركم الطيب"
text = "اشكركم علي الرد ولكن تكمن المشكلة في ان انا ماليش اخوات بنات ولا ام هما بس جوز خالات كانوا احد اسباب الخطوبة الاولي وكانوا عارفين ان البنت مش عوزاني بس لان ام البنت صاحبتهم وجارتهم، وكانت ام العروسة شايفة اني عريس كويس فساعدها خالاتي في الضحك عليا وكانوا عايزين اني اكتب الكتاب من غير ما التفت لراي البنت لانها عيلة ومش عارفة مصلحتهاوطبعاانا رفضت وانسحبت بهدوء بعد ادراكي المتاخر للحقيقة.<br />والمشكلة التانية لاني كنت عامل مؤدب ايام الجامعة وماليش علاقات عاطفية ولا غير عاطفية بالبنات ، زمالة وبس فطبعا كان سهل ينضحك عليا من الجميع.<br />ولاني شاعر بعدم الثقة في اقربائي النساء فتم تنحيتهم علي الفور ورفض تام لكل العرايس الي جاية من ناحيتهم انا مش ناقص يجاملوا الناس بيا تاني.<br />علي ايه حال بعد الكثير من الدعاء ربنا كرمني ولسة النهاردة الصبح شايف اخت ملتزمة في مقر عملها ودخلت قلبي علي طول اول ما شوفتها بتقرا القرآن ودي بقي رشحها ليا ام واحد صحبي صعبت عليها واتبنتي في موضوع الجواز .<br />ادعوا لي وللكثير من اخوتكم الشباب بالهداية وبالزوجة الصالحة اصل الموضوع ده شاغل الكثير من الشباب اللذي يبحث عن الهداية والزوجة الصالحة.<br />اخوكم مشمش"
archived = "2005-02-17"
capture_url = "https://web.archive.org/web/20050217083938/http://www.20at.com:80/article.php?sid=853&mode=&order=0"

