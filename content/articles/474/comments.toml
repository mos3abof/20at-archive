[[comments]]
order = 0
subject = "طيب ايه الحل يا شباب"
text = "انا عن نفسي فكرت ميت مرة اعمل زي الشباب دول واخاطب اية فتاه تعجبني مظهرها وخصوصا من تلك الفتيات الائي يحضرن الدروس بالمساجد .<br />المشكلة اني شايف ان الموضوع ده غريب وممكن يسبب لي الاحراج من الفتاه برغم علمي بان تلك الطريقة نجحت مع بعض الشباب وتزوجوا من خلالها.<br />والمشكلة الاساسية التي يتعرض لها معظم الشباب وانا منهم عدم وجود طرق كافية للوصول للفتيات المحترمات فعادة الفتاه المحترمة تلازم المنزل ولا تخرج الا برفقة الاهل فلا توجد فرصة لرؤيتهن الا في الشارع .<br />وانا اهو قاعد متعقد ومتنيل بستين نيلة بعد خطبة استمرت عامين مستني الامورة لما تخلص دراستهاثم اكتشفت في آخرها ان البنت كانت شايلاني استبن لواحد تاني ولما الموضوع خش في الجد رفضت الاخت المحترمةالارتباط وباظت الجوازة وسني كبر ومش عارف اجيب عروسة منين بعد ما اتعقدت من جواز الصالونات وقرفه .<br />وبافكر في البحث عن طريق النت وله مخاطره او ارضي واتجوز اي واحدة من العيلة واهم بنات والسلام .<br />او ارضي باي عروسة من النوع ده الي بيقولوا عليه هي دي الي بتعيش يابني( جواز صالونات برضة بس كله بيعرض عليا العرايس الي صعبانين عليهم ومافيش اي تقارب شكلي او فكري).<br />او الجأ للطريقة الاخري وهي اختار واحدة تعجبني شكلا ويبدو عليها التدين من الشارع وطبعا زي ما الاخوات قالوا هخاف يتقال عليا كداب وبيعاكس.<br />عندكوش والنبي حل للموضوع ده<br />مشمش"
archived = "2005-02-17"
capture_url = "https://web.archive.org/web/20050217083938/http://www.20at.com:80/article.php?sid=853&mode=&order=0"

