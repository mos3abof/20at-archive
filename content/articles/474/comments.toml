subject = "أسأل"
text = "اللى تعجبك خلى اختك أو والدتك يذهبوا إلى نفس الدرس ويتعرفوا عليها من قريب ويشوفوا ويقولولك إذا كانت مناسبة لك ولا لأ وبعدين هيبقى سهل عليهم بعد كده يجيبولك عنوانها وتليفون أهلها لأن ممكن تكون متجوزة أصلاً<br />سمسم"
archived = "2005-02-17"
