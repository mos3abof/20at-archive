text = "جزاكم الله خيرا على الموضوع<br />بس عندي نقطة بخصوص الصور اللى انتو عارضينها<br />اعتقد انها مش مقبولة فى موقع خاص بناس محترمين و متدينين زيكم و بالذات انها بجوار صورة الامام الشهيد رضى الله عنه"
