text = "بسم الله الرحمن الرحيم<br />انا اردني ولست لبناني لاكن لا اعتبر نفسي اردني ولا لبناني<br />لاكن جميعانا اخوان في الوطن العربي وجميع المسليمين<br />وانا أؤيد السيد حسن نصره<br />والله ينصرو"
