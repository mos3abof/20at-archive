order = 0
subject = "شارك معنا"
author = "ريم بنت السعودية"
posted = "2006-07-24"
text = "j تنبيه الى كل السعوديين الى ان حكومة خادم الحرمين الشرفين تعاطفا مع شعب لبنان الشقيق سوف يتم جمع التبرعات يوم الاربعا ء القادم على شاشة القناة الاولى بالتلفزيون السعودي شارك معنا لنجمع العدد الاكبر لكي نوفي لبنان حقها وننقذ المجاعة وهي بذ لك اول دولة تجمع التبرعات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133044/http://www.20at.com/article2.php?sid=1096"

[[comments]]
order = 1
subject = "تبرع ايه"
author = "تبرع ايه اللي انت جاي تقول عليه هو كل ما بلد تنضرب نضحك علي نفسنا ونراضيهم بكم مليون دولار لبنان محتاجه قوتنا وجيوشنا ولا شو اسرائيل تدمر لنا البيوت وانتو سيادتكم تبنو لنا وتكون قمه الاخوه يا حلويين في لم التبرعات زهقنا خلاص منكم ومن تبرعاتكم ما بدنا هيك بدنا اخ يحمل السلاح بجوار اخوه لنحارب السبب في هدم بيوتنا وقتل اولادنا يا سيده ريم نتبرع بمليون دولار ونصرف مليار دولار اخرين علي تسليح اعدائنا وعجبت لك يا زمن"
posted = "2006-07-25"
text = "ما بدنا تبرعاتكم وامتنانكم علينا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133044/http://www.20at.com/article2.php?sid=1096"

