[[comments]]
order = 14
subject = "تحكم في الفا ظك"
author = "جهاد"
posted = "2006-07-26"
text = "بسم الله الرحمان الرحيم اما بعد يا ايها الاخ الدي ينادي بالفاظ دميمة حسبك من هدا الكلام نحتاج الى كلام دين فيه نجد حلولا للقضية كل من الفلسطينية والعراقية وهاهي لبنان اتية والله اعلم من الدولة التالية وهكدا سنجد ان كل الدول العربية اصبحت تحث سيطرة العدو الصهيوني ودولة الارهاب التي تدعي انها تساعد في حل المشاكل الا نسانية ومن غيرها هي امريكا التي تزود الاسرالين بالسلاح والدعم وكما يقول العديد من السياسين انها هي دولة الاسرالين بحد داتها وهي التي تعيد لنا التاريخ كما كان من قبل وعد بالفور المشؤوم السبيل الدي فتح الباب امام الاسرالين في بسط سيطرتهم على اراضيها والرسالة التي اريد ان اكتبها ليقراها كل من هو غيور على الدول العربية الاسلامية ليس فقط لبنان هي ان لاحول لنا ولاقوة امام الاطماع الصهيونية والامريكية واجيب عن سؤالي بان اليد الواحدة لاتصفق وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133044/http://www.20at.com/article2.php?sid=1096"

