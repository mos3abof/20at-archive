text = "كل فن مالم يثير الغرائز و يؤدي الى الفساد هو فن اسلامي وفن انساني شريف<br />و في زمن الحرب نحن بحاجة الى الأغاني المحمسة<br />وقناة المنار مثال على ذلك<br />وسبحان مغير الأحوال لبنان بلد الفساد أصيح الآن بلد الجهاد و المقاومة"
