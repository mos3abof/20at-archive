[[comments]]
order = 18
subject = "فزورة عسكرية .."
author = "http://ibnbahya.blogspot. com"
posted = "2006-07-28"
text = "لي سؤال واحد يتيم ... الجيش المصري فين ؟؟؟ مش عايزينكم تضربوا إسرائيل .. مش عايزينكم تحرروا القدس .. مش عايزينكم تعملوا حاجات صعبة إلا على الرجال .. عايزينكم فقط تخرجوا العميل الخائن من مصر .. انتم عارفين مكانه كويس .. هتلاقوه في أي خرابة من اللي انتم عارفينها كويس .. في مصر الجديدة أو عابدين أو شرم الشيخ حتى .. مش بعيد عن إيديكم .. مستنين إيه ؟؟؟؟ طيب يا باشا يا لوا انته وهو وهو وهو ... بتحلق ذقنك الصبح طبعاً ... يا ترى بتشوف نفسك في المراية ؟؟؟ عايز أسألك سؤال بسيط جداً .. يا ترى بتحس إنك راجل ؟؟؟ لأ لأ ما اقصدش شوارك ولا شنبك .. انته فهمتني غلط .. الشنب مش هو رمز الرجولة زي ما سعادتك عارف يا باشا الصرصار عنده شنب أطول منك .. لكن بجد بجد كده ومن غير لف ودوران ... بتحس إنك راجل ؟؟؟ حاسس إنك راجل فعلاً ؟؟؟ طيب ازاي ؟؟؟ بأمارة إيه يا باشا .. يا سيادة اللوا انه وهو ؟؟؟ شيل إيدك من تحت .. الصرصار برضه عنده زيك وأحسن منك .. بص لوشك في المراية كده ... شوف نفسك .. عارف أصلاً يعني إيه رجولة ؟؟؟ ولا تغيير المناهج كمان كان في الكليات العسكرية ؟؟؟ علموكم فيها إن الرجولة كده ؟؟؟ علموكم فيها إنك تسيب سينا فاضيه عشان تكون سهلة في إيد العدو لما يخش ؟؟؟ علموكم في الحربية إنكم تسيبوا العرص اللي انتم عارفينه يبيع البلد للصهاينة (إشي مصانع ، شركات ، أراضي وغيره وغيره ) وبكره ييجوا يعيشوا وسطنا غصب عن عين أهلنا ونقطع مصر حتت .. اليهود ياخدوا شبرا والمصريين ياخدوا اللي بالي بالك .. لسه حاسس إنك راجل يا باشا ؟؟؟؟ طيب سلملي على شوارك .. وقلوظ فيهم .. وحفهم (مش حواجبك .. شواربك يا باشا) وزوق نفسك كدهقدام المراية قبل ما ييجي العسكري طلبه يشيل جثة جنابك لمكتبك .. تقعد تنطر وتشتم في خلق الله عشان تحس إنك راجل .. برضه لأ ... الرجوله معروغة يا باشا ... اسأل عنها جدودك .. أكيد إنك جاي من ضهر راجل .. بس نسوك في عهد العمالة إنك تكون راجل ...<br />إبن بهية<br />http://ibnbahya.blogspot. com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133044/http://www.20at.com/article2.php?sid=1096"

