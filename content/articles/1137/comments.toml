[[comments]]
order = 4
subject = "مستني ايه"
author = "مصراوى"
posted = "2006-07-25"
text = "الأخ السوري اللي بيتكلم ومش عاجبه موضوع التبرعات, عايز اقوله انت مستني ايه خد بعضك واطلع علي الجبهة علي طول ولا تضيع وقت, للسوريون أمد يطالبون فبه بالحرب والثأر وارضكم محتلة وتقوموا بالتهكم علي الشعوب الاخري لعدم الخوض بالحرب, لو شفنا السوريون يجاهدون باموالهم وشبابهم ليس للقضية ولكن لإسترداد الجولان فقط, ولكن العكس ما يحدث اسوء جيش عربي هو الجيش السوري معدم من جميع النواحي, يمكن التبرعات تذهب الي من يستحقها وبذلك نشعر بأننا قدم بعض المساعدة ولكن الإكتفاء بالشعارات الرننانة بدون حركة فأقول لك كفانا شعارات."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133044/http://www.20at.com/article2.php?sid=1096"

[[comments]]
order = 5
subject = "للاخ المحموء"
author = "سالم"
posted = "2006-07-25"
text = "الاستاذ مصراوي انت متحمس للموضوع يعني اكثر مما يتحمس مدافع عن النظام السعودي هذا الاسلوب.... هو اللي خلى سلاطينا يتثبتون على عروشهم لسى كم مية سنة .. وكمان ياريت اذا عندك قصيدة مديح تأجلها لموضوع ثاني منكون شاكرين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133044/http://www.20at.com/article2.php?sid=1096"

[[comments]]
order = 6
subject = "لست متحمساً"
author = "مصراوى"
posted = "2006-07-25"
text = "انا لا اتحمس للنظام السعودي ولا اي أنظمة عربية, انا شايف ان ديه حركة شعبية وليست سياسية فالنظام السعودي مثله مثل جميع الأنظمة العربية العقيمة قراراتهم ليست بايديهم, بس انا بقول بلاش شعارات فقط لا غير يا عم سالم وبصراحة بنتقد السوريون لانهم دائماً يشعرونك بانهم وطنيون وعروبيون والخ ويقولوا ان المصريين خانونا في 73 طيب من ساعتها للان برده المصريين المشكلة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133044/http://www.20at.com/article2.php?sid=1096"

