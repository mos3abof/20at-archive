posted = "2006-07-26"
text = "بسم الله الرحمان الرحيم امابعد<br />ندائي هولجميع المسلمين يجب التعامل مع هده القضية بجدية اكتر ليس بالاشعارات والامتنانات الفارغة انه مشكل جوهري الصميم و الواجب التعامل معه باحكام تام وليس النقاش في ما لا نفع فيه والله ينصرنا على اعدائتا ولن يتم دالك الا بتعاون وتلاحم موحدين وكما قال الاخ جهاد اعلاه فاليد الواحدة لاتصفق وشكرااااااا"
archived = "2006-11-02"
