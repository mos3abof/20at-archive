[[comments]]
order = 12
subject = "تحذير"
author = "سالمة"
posted = "2006-07-26"
text = "وانا اقول اللة ما تنصرو وادعو كل يوم بقتلك يانصراللة كى تريحنا<br />يااااااعرب شو جرالكن وين عقلكن ويييين ؟<br />بدى حدا عاقل يجاوبنى ؟؟؟؟<br />لو عندكن بمصر متل ها الموقف هل تقبلو بتقسيم بلادكن ؟؟؟؟<br />ليش ها التعصب ليش ما تطالبو متل اى عاقل بان يكون السلاح للحكومة وان تكون لبنان ملك لرئيسها وحكومتها<br />وليس جذء منها ملك لحزب معين<br />نحنا بدنا بلدة واحدة متكاملة اسمها لبنان بشمالها وجنوبها يحكمها رئيس واحد وحكومة معروفة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133044/http://www.20at.com/article2.php?sid=1096"

