text = "بدل ما نلعن الظلام تعالوا ننور شمعة. واللي يقدر على حاجة إيجابية يعملها ولكن أرجوكم بلاش شتايم وسب وتبادل إتهامات خلي كلامكم مشكلة وحل ولكم جميعا التحية والسلام."
