subject = "اللى عاوز يحارب يروح يحارب"
author = "hakona"
posted = "2006-07-25"
text = "الواحد بيضحك عليكوا يا عرب<br />الاخت فرحانة بالتبرعات بتاع بلدها اللى هى اصلا رايحة فى جيب الحكومة<br />ولا الاخ اللى عاوز العرب يحاربوا<br />بصوا يا جماعه اللى يحرر الارض لازم يكون اصحابها<br />صدقونى اللبنانيين هم اللى حيحرروا ارضهم بنفسهم<br />ودعواتنا لكل مسلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133044/http://www.20at.com/article2.php?sid=1096"

[[comments]]
order = 9
subject = "تبرع ايه تاني"
author = "هههههههههه تبرع قال والاخت ريم بتقول ان السعوديه بتهدد بحرب شامله يا عم شامله مين دي ولا نسيتو تبرعاتكم لاميركا ولا وحياتك يا ريم وين فلوس الراجحي اللي اخدتها الاسره الحاكمه"
posted = "2006-07-26"
text = "وعلي فكره لبنان ليست ملك اللبنانين فقط بل ملك لكل المسلميين يحق لهم الدفاع عنها بكل ما يملكون<br />قال تبرع قال وبعدين بعد التبرع ايه الحاجه سوسو اسرائيل يعني تقوم وتدكها وتعلن المملكه مره اخري التبرع وسوسو تدمر تسمحي ااقول لكي ايه الخيبه دي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133044/http://www.20at.com/article2.php?sid=1096"

