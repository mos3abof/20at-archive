text = "حاجة غريبة كل واحد يعمل مصيبة وبعدين ييجى يقول انتم فين يامصريين اتفوا عليكم ياسيدى الفاضل المصرى راح الخليج اشتغل هناك خدام وزبال واتهان واتبهدل فى دول عربية سموة اجنبى واتهموة بالفهلوة والخيانةوفى الشام اتفقوا مع الخليج على السخرية من المصرى وان مصر موضة قديمة واحنا الاصل<br />المصرى متهان فى كل الدول العربية وبعدين وقت الجد عاوزين المصرى ييجى يدافع ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />يااخى اتكسفوا شوية على دمكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133044/http://www.20at.com/article2.php?sid=1096"

[[comments]]
order = 23
subject = "يا اااااا عرب"
author = "يا اخي ما عاش من يهين مصر"
posted = "2006-07-30"
text = "و ما عاش من يهين الخليج<br />و ما عاش من يهين الشام<br />و ما عاش من يهين بلاد المغرب العربي<br />و ما عاش من يهين الصومال و جيبوتي و جزر القمر<br />لا اعرف ماذا حل بالعرب بجد ؟؟<br />كل ما تطلع مصيبة اسهل شئ علينا اننا نسب في بعض و نلقي اللوم على بعض<br />يا اخي كل واحد بلا ما يسب في الشعوب ، الشعوب العربية لو سالتها كلها مع اخوانهم العرب في كل مكان ... و الحكام غلطانين يا سيدي و 600 غلطانين<br />بس احنا شو دورنا ..<br />يعني اللي يقدر يتبرع يتبرع ، مش هذا هو حل الشملكة الاصلية ،، لأ طبعا .. بس هذا حل لمشكلة فرعية و هي النازحين و نقص الطعام و الدواء و المنازل المهدمة ..<br />أم هل المطلوب منا ان نترك لبنان في دمار بحجة انه التبرعات لا تقدم و لا تأخر ؟؟<br />لا يا اخوان يا ريت نحكم عقلنا ،، اللي يستطيع ان يدخل لبنان و يحارب يتوكل على الله ..<br />و اللي يقدر على التبرعات يتوكل على الله ايضا ..<br />و اللي يقدر يخاطب الصحف ..<br />و اللي له مكان في وسائل الاعلام يفعل ..<br />و يا عرب خلاااص كفى<br />كلنا اخوان .. و اذا انسب اي واحد فينا ، المسبة تعم علينا<br />و اذا قتل حد فينا معناه انه جميعا قتلنا ..<br />اذا فرقتنا الحكومات<br />فأرجوكم ارجوكم ارجوكم ان توحدنا كلامتكم انتم الشعوب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133044/http://www.20at.com/article2.php?sid=1096"

