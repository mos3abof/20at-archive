text = "إننا نتعرض منذ عقود طويلة إلى حالة من غسيل الدماغ الممنهج بطريقة خبيثة ، فالصهاينة كعادتهم يستميلون إليهم عدداً من الكتاب والمحررين والإعلاميين والمثقفين بطرق شيطانية عبر مؤسساتهم المنتشرة حول العالم كنوادي الروتاري والليونز وما شابهها من مؤسسات تدعي أنها إنسانية ظاهرها الرحمة وباطنها العذاب من باب حقوق الإنسان وحرية الرأي وحرية ألأديان والتعايش السلمي وما إلى ذلك من مصطلحات لا نجد غضاضة في الجري خلفها بغلافها الصهيوني الجديد وكأنها ليست أصلا من عندنا ومتجزرة في عقيدتنا سواء مسلمين أو منصارى فكل الديانات خرجت من عندنا (ولا دي كمان فيها خلاف؟؟؟) ولكن شكلها الفضفاض الصهيوني الجديد المليء بالمغالطات جعل كثير منا يحتضنها كالأطفال ، كل ذلك وما شابه من منظمات عالمية ماسونية أسسها اليهود ، فإذا ما انخرط كتابنا ومثقفينا في تلك المنظمات والحركات ولو من باب الإعجاب بثوبها الخارجي المزركش راحوا يبثون في عقولنا الأكاذيب والدعاوى المبرمجة للسيطرة على عقول أبناء الأمة ورويداً رويداً يستميل حديثهم الناعم عدداً كبيراً وتسير فيما بعد بالدفع الذاتي دون تدخل من اليهود لأن المدافعين عن تلك الأفكار الهدامة لأمتنا هم من أبنائنا وإخواننا فيخيل إلى الملاحظ المتأخر للظاهرة أنها لا يمكن أن تكون مؤامرة .<br />هذا بالضبط ما فعلوه مع السيد المسيح عليه السلام وأخرجوا من تحت عبائته مناصرين له ومؤيدين ولكن لديهم تحفظات على بعض الأمور وما لبثت تلك التحفظات أن كبرت ونمت على مر السنين وباتت مناهج مختلفة تحمل في ثناياها ما هو عكس المسيحية الحقة التي جاء بها عليه السلام والشيء نفسه فعلوه مع المسلمين الأوائل وما نراه اليوم من فرقة وخلاف لا يرجع إلا لسبب وحيد وهو تلك الأكاذيب التي دسوها بين المسلمين وتبناها نفر غير قليل من المسلمين كان أولهم متآمراً ولكن آخرهم مغرراً به اتبع من ضحك على أجداده قبل قرون والجميع يعلم ملايين الإسرائيليات التي حشروها حشراً في القصص النبوي وفي الأحاديث النبوية الشريفة وليس أمام الأمة اليوم غير الرجوع إلى كتاب الله وحده وتخليص التراث الإسلامي من تلك الخزعبلات التي فرقت الأمة وساعد على انتشارها تجار السياسة على مر العصور ممن يتخذون من الدين عباءة لاتقاء لوم المعارضين أو لكسب التأييد من فئة على أخرى.<br />هذا النهج اليهودي العدواني على العالم ما يزال يمارس في شتى بقاع الأرض وكتب عنه آلاف الكتاب والمفكرين حول العالمين المسيحي والإسلامي ، فلا نختص نحن بنظرية المؤامرة ولكنا عرفناها متأخراً جداً ، حتى عندما عرفناها كانت قد امتزجت بجزء من صلبها وهو تكذيب وجودها بواسطة من يدعون العلم والمعرفة ويتلحفون ثوب السخط على الأمة التي تعلق كل إخفاقاتها على شماعة المؤامرة على حد تعبيرهم .<br />جل مفكري أوروبا العالميين كانت لهم مواقف وتحذيرات واضحة من مؤامرات اليهود لإفساد العالم قبل أن نعرف نحن عن ذلك ، فلا يجوز لإخواننا ممن تعرضوا لعمليات الحشو اليهودي المبرمج للعقول أن يتهمونا بأننا ضحايا نظرية المؤامرة لأنها في الأساس نظرية غربية وعالمية ولا نختص بها نحن بل العكس هو الصحيح كما ذكرت ، فنحن تأخرنا في إدراكها كثيراً وهو ما جعلنا نصل إلى ما نحن فيه اليوم من ضعف على مستوى القيادات والحكام وليس الشعوب ، فشعوبنا العربية والإسلامية أغلبها بسيط لا يقرأ حتى وهو يعتمد في بناء رؤيته على قلبه وبوصلته الإيمانية فيعرف اتجاهه وعدوه قبل المثقفين الذين يدعون أنهم أعرف ببواطن الأمور وهم بظهرها أجهل فكيف بباطنها؟!.<br />لقد وصلنا إلى ذروة المؤامرة التي حان قطاف ثمارها بأيديهم القذرة ولن يتمكنوا بإذن الله ، لا بسبب نباهة ويقظة مثقفي الأمة الشرفاء فقط ولكن بسبب بوصلة أهلنا الطيبين الفقراء التي لا تخطئ اتجاهها أبداً ، هؤلاء معاً سيقفون لذلك الغزو الصهيوني للعالم . يقول البعض لماذا نحن اليوم فقط من يقع تحت طائلة تلك المؤامرة دون غيرنا ؟ سأل أخي الأصغر هذا السؤال ... عندما نتحدث في السياسة أو في أي شأن وطني لابد من إحضار أو على الأقل استحضار شيئين أساسيين لا ينفع بدونهما أي حديث ، هذين الشيئين هما التاريخ والجغرافيا أو كما يقول دوماً أستاذنا الكبير هيكل هات الخريطة واقعد احكيلك.<br />يعني لازم نبص على الخريطة ونقرأ التاريخ ، لو فعلت هذا يا أخي الكريم ستتأكد تماماً أننا أمة مستهدفة منذ القدم .. ففي سنة 1012 تمت أول حملة صليبية على بلاد المسلمين وتلاها ثمانية حملات كبيرة متعاقبة .. طبعاً ناهيك عن عشرات ومئات الحملات الصغيرة والحروب التي شنتها الدول على بلادنا بخلاف التتار والمغول .. يعني طول عمرنا بلاد مستهدفة حسب التاريخ ولأسباب كثيرة أهمها أن بلادنا مهبط كل الديانات والأنبياء والرسل فهذا سبب عقائدي ، ثانياً أن بلادنا سقطت عليها لعنة الجغرافيا فنحن نقع في منطقة استراتيجية غير عادية (في سرة الأرض) من ناحية الطرق والعبور والإمدادات الحربية أو التجارة أو أي من هذا القبيل .<br />ثالثاً الثروات الغير موجودة في أي مكان في العالم فمصر وحدها كانت مستودعاً للغذاء للامبراطوريات المتعاقبة أخي الكريم وفي العصر الحديث لدينا جل بترول العالم تقريباً وهي ثروة لا تتوفر لغيرنا وهي عصب الحياة وبدونها لا يمكن لأي بلد أن يعيش حيث لا كهرباء ولا سيارات ولا طائرات ولا مدنية من أساسه .. هل تظن أن بلادنا بسيطة أو هينة أخي الكريم ؟ ثم هناك الحقد الموروث من مئات السنين نحن أمة لم تصل إلى مجدها أية أمة في التاريخ منذ بدء الخليقة لا في الاتساع الجغرافي ولا في العلوم التي سطعت على الدنيا بأسرها ولا ولا .. الكثير الكثير وهذا لا جدال عليه لأنه التاريخ المدون لديهم قبلنا أي بشهادتهم هم .<br />كل هذا يا أخي أسباب وجيهة لمؤامراتهم علينا وزرعهم ذلك الكيان السرطاني الصهيوني في بلادنا ويتآمرون إعلامياً علينا بتسخير أبواقنا الإعلامية لإرغامنا على الاقتناع والتسليم بالأمر الواقع مع مجافاة للمنطق والعقل على طول الخط ، إذ كيف بالله يريدون منا أن ننسى وطننا الذبيح المستعمر منذ سنوات ونسلم بالأمر الواقع ونوقع معاهدات سلام أو استسلام ؟ لماذا لا نقاوم يا أخي ؟ الفرنسيين استعمروا الجزائر مائة وثلاثين عاما وتحررت فلماذا نستسلم من أول ثلاثين سنة ؟ مصر استعمروها سبعين عاما وتحررت وكل بلاد العالم ، فلماذا يريدون إقناعنا بأن فلسطين لن تتحرر ؟! أليس في ذلك مؤامرة من حكوماتنا وإعلامنا ؟<br />دع فلسطين وتحريرها ، هل يتصور أحد أن الكيان الصهيوني مازال يعلق في الكنيست خارطة إسرائيل الكبرى التي فيها مصر وكل الشام وبعض الأجزاء من معظم البلاد العربية القريبة ؟؟؟ طيب إن لم يك هذا مؤامرة وخطط مدروسة يعملون على تحقيقها فماذا يكون إذن ؟؟؟ درس في الجغرافيا المستقبلية لنواب كنيسهم القميء ؟؟؟ أريد أن يرد علي عاقل يستخدم هذه النعمة وليس متبجحاً وحسب ؟؟؟ القضية يا سادة ليست فلسطين ولا لبنان والله .. ما هذه إلا البداية والقادم واضح جلي هم لا ينكرونه فكيف نغمض نحن أعيننا عنه ؟؟؟ أليس هذا جنون ؟؟؟ هل ركنا ونمنا واسترحنا لما يسمونه سلام أو استسلام ؟؟؟ هل صدقنا تلك الكذبة الكبيرة التي أشربتها مصر والأمة ورائها ؟؟؟ هل يتفضل ما نقول عنه رئيس مصر حالياً وهو عميل الصهاينة على بلادنا بالرد على التالي ؟<br />من يشتري مصانع وشركات وأراضي مصر يا ريس ؟؟؟ لن نسألك عن العمولات فهذه ربما أصدر لك زعيم مشخخة الأزهر فتوى تبيحها شرعاً على المذاهب الأربعين ، لكن نسألك سؤال بريء جداً من يشتري ؟؟؟ من يشترينا يا ريس ؟؟؟ بتبيعنا لمين ؟؟؟ هل تعلمون يا سادة أن فخفخامة جلالته وعصاباته يبيعون أراضي مصر ومصانعها وشركاتها فيما يسمونه الخصخصة أو الب..صه كما يسميها أستاذنا الدكتور ... الذي يعرف نفسه .. سننام عدة سنوات قليلة ونفاجأ بعد هلاك السيد جنابه بحفنتين من اليهود بيننا .. سوف لا نلاحظ هذا صدقوني .<br />ستعود إلى بيتك وتحكي لزوجتك تصوري يا أمل (مش عارف من حقنا نسمي أمل ولا لأ) تصوري يا أمل النهارده قابلت واحد يهودي في الشغل بيطلع ترخيص مش عارف إيه .. أنا افتكرته مصري لغاية ما شفت في أوراقه شايل معاه حاجات غريبه كده قلت أسأله طلع يهودي .. بيتكلم زينا .. بعد ذلك تفاجأ يا سي مواطن يا مصري إنك أمام ناس عايزه حقها ... هم أصحاب البلد .. شاريين المصانع والشركات والحقول .. لأ والأكاده رايحين يجيبولك عمال من بره .. يهود غلابه من أفريقيا والهند ومش مهم يهود المهم يعطونهم أجر ولقمة عيش ويقولوا يهود وشوية شوية .. تكبر الدولة اليهودية ... شايفين المصيبة يا مصريين ولا لسه ؟؟؟؟ شايف الوكسه اللي انته عارفها كويس يا بابا شنوده ولا لأ ؟؟؟ مش راح جمال مبارك واشنطن ورجعلك بماكسيموس الصهيوني الذي يريد منافسة الكنيسة الأرثوزوكسية في الشرق بكنيسة جديدة طالعة لسه طازه في أمريكا اسمها المسيحية اليهودية ... صلي على النبي بقى ... الموضوع والله العظيم مش لعب ولا لبنان ولا فلسطين وبس ... الموضوع أكبر بكتير أوي أوي أوي ... واسألوا راعي المحفل الماسوني في مصر .. اسألوا كبيرهم مبارك العميل ...<br />إبن بهية<br />http://ibnbahya.blogspot. com"
