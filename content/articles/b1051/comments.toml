subject = "أرحموا نخيل العراق من الاغتصاب والقتل"
author = "أسد بغداد"
posted = "2006-08-02"
text = "لا اله الا الله محمدا رسول الله ياخوان كفانا قبول بالمذله والهوان نحنوا ابناء وبنات العراق العظيم نحنوا ابطال بلاد الرافدين استفيقوا لحالكم يابطال العراق والله ناصركم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130224/http://www.20at.com/article2.php?sid=1051"

