[[comments]]
order = 1
subject = "عبير دمك لن يضيع"
author = "رائد بغدادي"
posted = "2006-07-19"
text = "نقسم بالله العظيم ان لن يضيع دمك هباء ياعبير ارقدي عروسا في الجنة وانضري ماذا يفعل اخوانك بأحفاد القردة والخنازير ساعة بساعة في العراق ..ياأبنة الرافدين ان اول ليلة لكي بجوار الرحمن كانت نارا وشرارا على الفرقة الامريكية التي اغتالت برائتك حتى انهم من يومها سفروا احد جنودهم الى خارج ارض الرافدين التي امست عليهم مقبرة لأشلاء الباقين منهم ((ويمكرون ويمكر الله والله خير الماكرين))الله اكبر والنصر للمجاهدين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130224/http://www.20at.com/article2.php?sid=1051"

[[comments]]
