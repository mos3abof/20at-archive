subject = "sorry"
author = "بسم الله الرحمن الرحيم"
posted = "2005-12-28"
text = "السلام عليكم ورحمة الله وبركاته<br />اما بعد..<br />فإنه قد ضفح الكيل مما نرى ..ومما نسمع.. ومما نقرأ كل شباب العرب ..بل كى لا احكم على الكل ظلما ..دعونى اقول معظم شباب العرب ...اصبحوا عديمى الرجولة ..اصبحوا عديمى الاحساس ..اتعرفون بمن هم عديمى الاحساس ???.<br />انهم عديمى الاحساس بتلك الام الفلسطينية ..وتلك الاخت العراقية ..وذلك الطفل الشيشانى ...وذلك الاب المسلم .وكل من فقد اهلة واحبته ..دفاعاً عن بلده وعرضة ..<br />الى متى يكون العرب ..<br />كلمة بلا معنى?? ..الى متى نكون كالكلاب التى تعوى فى الطرقات ولا يستجيب لها .سامع?? ..<br />الى متى نكون بلا وحدة ??..الى متى ...يكون هدف كل منا ان يصبح اقوى من الاخر ..<br />مع ان الله تعالى قال :\"انما المؤمنون اخوة فأصلحوا بين اخويكم \"<br />اين هى الاخوة التى ذكرت فى القرآن ؟؟..بل اين المؤمنون اصلا ..؟<br />بل لا اعرف ماذا اقول لكم...ماذااقول لكم ايها العرب..آلام القدس نسمعها فى بيوتنا ومنازلنا ...وفى انفسنا..<br />ولكن ...ولكن ...ولكن ...بماذا نجيب على نداء الجهاد..؟<br />اتعرفون بماذا نجيب ...<br />دعونى اقل لكم ..ما هى اجابتنا .??..<br />اجابتنا هى ..سماع الاغانى والفجور والفسق ..<br />اذا اعلن كل منا ايمانة وصلاته ..وتمسكه بالعقيدة اصبح ..مشتددا فى نظر الجميع ..بل ان البعض يقولون عليه ارهابيا..<br />اوهذا حق الايمان ؟؟؟؟..اوهذا حق الرحمن ؟؟؟..اوهذا حق الاسلام..؟؟؟؟<br />إلى متى يقال للإسلام دين الجاهلية والتخلف..<br />اصبح كل من اراد ان يدخل التاريخ هذه الايام ..يهاجم الاسلام والمسلمون ...اصبح كل من اراد ان تكون له مكانة فى الدنيا ..يهاجم الاسلام...<br />فمن الحروب التى تحدث فى بلاد الاسلام ...الى فلسطين ..الى العراق ..الى اندونسيا ...الى الشيشان..<br />الى الفرقان الحق..الى المرأة التى تأم الرجال فى الجمعة .....الخ<br />اليست كل هذه امور تحدث للمسلمون ..ومع هذا ..ومع هذا ..<br />ان تكلمنا وقلنا ..لا بعنف ..لاننا لا نطيقها ..قالوا علينا متخلفين همجيين...<br />وان تكلمنا بهدوء ..لن نرى الا الاهانة ورمى الكلام بعرض الحائط..<br />اليس هذا يا اخوة...??.<br />انا لا اعرف بأى اسلوب ..يريدونا ان نعبر عما بداخلنا ..<br />ايريدونا ان نعبر مثلهم بالبرود..ام الا يكون لنا أى تعبير ...<br />ان لا اعرف ماذا اقول ..لهذا الشاب السعودى ..الذى اضاع شبابه فى الموسيقى ..والترف الذى لم يفعل له شيئاً لدينه او حتى دنيا ..<br />وماذا اقول ...لهذا الشاب المصرى ..الذى اضاع شبابه فى مغازلة الفتيات ..<br />وذلك الشاب العربى ..الذى لا يهتم الا بالمال..<br />مالكم..مالكم ..مالكم كيف تحكمون ..??.<br />اليس منكم من يوحد الله بعلم او بفعل ..<br />ان سألت شابا منهم عن لاعبى الكره ..فمن المؤكد انه سوف يرصدهم جميعا على يديه ..<br />اما ان سألت احدهم عن صحابى من صحابة النبى ..لم يكد يعرفه ..<br />بل انه من الممكن ..بل من المؤكد ان يستمع الى الكره ولا يستمع الى العلم ..<br />اوهل نسيتم ..ما نصته احدى برتوكلات حكماء صهيون..<br />اتعرفون ..بعض المواد التى كانت تنص عليها هو الهاء شباب الاسلام والعالم بالكرة<br />وقد نجحوا نجاحا باهرا ..<br />اصبح الشاب من مصر والعرب ..يحزن لخسارة الفريق الذى يشجعه.اكثر من حزنه على موت الشيخ ياسين ..اكثر من حزنه على اخته المغتصبة فى العراق وتقول ادركونى<br />انا لا اعرف ماذا حدث لكم..<br />كنا قديما نقول ..ان الغرب هم كتلة من البرود ..حيث لا غيرة لهم على اهليهم.ولا على اعراضهم..<br />ثم نحن هاهنا فى هذا الوقت ..اصبحنا مثلهم ..<br />لا اعرف ماذا اقول لكم ..<br />فإنى ابعث برسالتى هذه<br />الى كل اخ واخت مسلمة ..بأن تعودوا الى دينكم عودة جميلة ..وان نبنى ديننا ..اتعروفن لماذا نحن من يبنى ديننا ؟<br />لاننا بنيان هذه الامة ..<br />ولكن اين بنيانها .اين قوتها ..؟<br />كنا قديما نملك زمام العالم..وكنا نحكمه بالعدل والقسط...<br />اما الان فالذى يحكم العالم دول الفجور والفسق ..دول الكفر<br />التى لا تخشى الله فينا ..وهذا مؤكد لانهم لا يؤمنون بالله ورسوله ..<br />بل انهم يقتلون الاسلام والمسلون ..من جهة ..ثم يقولون اننا ارهاب من جهة اخرى ..<br />..تأتى طائرة على ارض فلسطين وترمى قنابل ..من جهة ..ثم تاتى طائة بعدها ..لتقدم الطعام والشراب.........<br />اى عقل يتحمل هذا ..؟ بل اى دين يقول هذا ...؟<br />جائت لى رسالة وكان محتواها.. اخ مصرى يتعجب ..ولا يعلم لماذا كل هذا البرود ..والكسل والتخلف الذى وصلنا اليه ..<br />كل ما هو امانا الان ..ان نفتخر بماضينا المشرق..<br />ولكننا ..لم نفعل ما يقدر هذا الماضى ..<br />منذ..الخلقاء الرشدين ..فمر بن عبد العزيز...فصلاح الدين ....فبيبرس وقطز ..والخلافة الاسلامية ..التى وصل اليها المسلمون من تقدمى علمى.... وحضارى.... وثقافى ..<br />الى تلك الحضارة المزيفة ..التى وصلنا اليها ..ثم بعد ذلك نظهر فى المؤتمرات ..ونقول .اننا يد واحده..انه لن يفرقنا العداء..<br />انا لا اعرف ..ماذا اقول ..ان قلنا اننا يداً واحدة ....والله انى اكاد اضحك على هذه الكلمة ...والله ..<br />اى يدٍ هذه ..<br />اتعرفون ان العرب يكرهون بعضهم البعض ...<br />ثم يأتى قادتنا ويقولون اننا يد واحده..<br />والله انا لا اعرف ماذا اقول لكم..<br />انظروا الى سلفكم الصالح ..<br />انظروا الى ابن تيمية ..وابن القيم ..انظروا الى البخارى ومسلم .<br />اليسوا هم من حملوا الاسلام على اكتافهم..<br />بل انظروا الى قدوتنا..وقائدنا الاعلى ..هو النبى صلى الله عليه وسلم ..اليس هذا هو الذى بسببه انا وانت وانتى وانتم وكلنا الان مسلمون ..<br />انا لا ارعرف ماذا اقول لكم<br />غير انى اتنمى من الله تعالى ان يكون منكم من يريد حقا الاتحاد والقوة ..وليست قوة اسمية ..كما يقولون لنا ...<br />ياسادة ..اترك لكم التعليق...<br />وإن شاء الله موضوعنا القادم ..هو القمة العربية ..مع استمرار الموسوعة ان شاء الله<br />تحياتى<br />اخوكم الفقير لمولاه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114118/http://www.20at.com/article2.php?sid=161"

