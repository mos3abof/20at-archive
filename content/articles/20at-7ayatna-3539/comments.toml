posted = "2007-04-06"
text = "انا مش فاهم! ه الشذوذ حاجة صح يعني لمجرد وجودها؟ طب مفي شاذين جنسيا ضد الأطفال وحاجة موجودة وفي ازدياد، إيه حانحلل شخصيتهم ولا إيه؟ دول لازمهم إما علاج واللي مش هيشفى فليذهب إلى الجحيم ! هو كل واحد شاذ حيتمقلس علينا؟ يلا قولوا عليا متعصب! أيوة انا متعصب… وهم متحررين ومنفتحين وعصريين.. جاهم القرف!<br />ثم بيقولك: التاريخ الإسلامي ملئ هو الآخر بصور الشذوذ!لا مش مليء سبت كل مليارات البشر وجاي تقولي أبو نواس والوليد؟ في قد إيه ميات؟ مهو العالم مليارات! وبعدين يا دكتور قلتهم في العالم بيدل على شذوذهم.وشكرا"
archived = "2009-10-11"
capture_url = "https://web.archive.org/web/20091011000859/http://www.20at.com:80/20at/7ayatna/3539.html"

