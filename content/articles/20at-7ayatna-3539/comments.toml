text = "كنت اتمنى ان يتطرق المحرر الهمام او الدكتور خالد منتصر الى الشواذ الحاليين واصبح معروف عنهم دفعاهم عن الشواذ والخروج معهم فى مظاهرات الشواذ خارج مصر منهم وزير حالى مشهور ودايما يسبب ازمات حادة جداا بسبب اراءة السيئة طبعا ولحد الان لم يتزوج بالاضافة الى مخرج مشهور جداا اسضا معروف عنة ذلك فكنت اتمنى التطرق لاسئلة شائكة اكثر من ذلك بكتير ويكون صبق صحفى جامد … بالنسبة لكلام المعلقين على الموضوع انا مش شايف اى انتقادات لاذعة ولا غيرة صحفية كما ادعى الاخ محمود غنيم وبلاش تتهجم على الجمهور كدة لحسن يكرهوا الصحفيين… اة نسيت العنوان مش متناسب مع الموضوع اطلاقاااااااااا فعلا زى ما كلهم قالواااا"
