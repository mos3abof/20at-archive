[[comments]]
order = 11
subject = ""
author = "امتى هاتنعلم نعرف ننقد بقى !"
posted = "2007-04-04"
text = "اولا يا جماعة الموضوع إلى حد كبير مش عاجبى .. و هاقول ليه بس الاول لازم نفرق بين اراء الصحفيين المتمرسون و اراء الجمهور الذى عادة ما تاخده الحماسة لسب الصحفى ليكون تعليقه بارز .. او انهم لا يجيدوا فن التعبير بالكلمات فيحاولوا استخدام الفاظ خارجة لضعف حجتهم .. او السبب الاخير الذى لا يكتشف بسهوله وهو حقد زملاء الدواخلى عليه وعلى نجاحاته وموضوعاته المثيره.. و ده باين جدا من الصيغة المتشنجة فى التعليقات التى تستند على دوافع عدوانيه تخفى بين السطور اكثر مما تحمله السطور نفسها من معانى .<br />و النوع التالت ده باين جدا ضعف منطقه \" وعلى فكره انا مش بدافع عن المحرر اما بس موضوعى ورأيى الشخصى هاقوله فى الاخر \" يعنى البعض استخدم اسلوب ردح غير مقبول تماماً ايه بص شوف مين اللى كتب .. ما الاسم واضح يعنى .. وبالنسبه لموضوع النقل ده بقى لوحده نكته يعنى الدكتور خالد منتصر بيكتب فى ايلاف و الدنيا كلها عارفه وكتب فى الموضوع ده بالذات كتير و فى ظنى هذا سبب اختياره للحوار .. و طبيعى جدا جدا ان المعلومات اللى قالها فى الحوار يكون قال بعضها فى كتاباته .. انما التعليق يوحى بان الكلام على لسان الدواخلى و كأنه لم يقم بالحوار مع المصدر .. و الموضوع حوار يا جماعة مع خبير فى الشـأن يبقى ازاى حد يطلب اخد رأى عالم نفس . ده حوار مش تحقيق .<br />و بالنسبه لرأيى ..<br />اولا : انا اتفق تماماً مع الزملاء ان العنوان \" مبتذل جدا \" جدا و لا يعبر عن الموضوع اطلاقا وكذلك الصورة<br />وثانيا : الموضوع كان ممكن يكون فيه اثاره اكثر من ذلك و اضافة بعض الدراسات و الارقام الموثقه له<br />و على العموم انا قريتلك موضوع الجنس السابق و شايف انك ارتد مجال جديد محرم لحد كبير فى الصحافة المصريه وربنا معاك .. و ابقى سلملى على الانبا بيشوى !"
archived = "2009-10-11"
capture_url = "https://web.archive.org/web/20091011000859/http://www.20at.com:80/20at/7ayatna/3539.html"

