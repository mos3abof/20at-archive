text = "{{{{التاريخ الإسلامي ملئ هو الآخر بصور الشذوذ، ويكفى أن نذكر أن الشاعر الكبير \"أبو نواس\" رغم أنه في عصر الإمام \"ابن حنبل\" كان يعلن شذوذه دوما في أبيات شعره !}}}}}<br />بنظر كاتب الموضوع فإن أبو نواس كان شاذا!!! فعلا من أسخف ما قرأت في حياتي…يا عيوني إن لم تعلم أو تفهم ما كان يعنيه أبو نواس الشاعر العظيم بشعره فهذه ليست مشكلته، بل مشكلنك أنت…فعلاً هُزلت!"
