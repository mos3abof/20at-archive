text = "احنا عارفين يا عم بيبو ان الصحفى الجيد هو اللى بيعرف يثير الرأى العام فى موضوع ماس باحتياجاتهم .. مفيش خلاف على كده .. اوك<br />بس تناول موضوع الشذوذ بالطريقة ديه ..اممم مش عارفه حاسه ان الموضوع كان ممكن يكون اجرأ من كده كتير طالما انت قررت انك تكتب عنه وما تقوليش يا بتاعة جيفارا .. يا بتاعة الحريه .. لا الموضوع مش جيفارا ولا حاجة .. الفكره كلها انك حد متميز و شغلك لا خلاف علي قوته بشهادة كل الناس قبل شهادتى بس الموضوعات ديه مش حاسه ان واحد شيخ زيك ممكن يكتبها مش لسبب الا لأنك محافظ لدرجة \" فى رأيى \" زائدة .. بس بشكل عام الاسئلة حلوه جدا جدا و غطت الموضوع كله ."
