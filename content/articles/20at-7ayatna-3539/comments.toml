[[comments]]
order = 15
subject = ""
author = "dody"
posted = "2007-05-02"
text = "ميرسى ياجميل على الموضوع بس انا ليا بعد التعليقات :<br />1- انا كنت بأقرأشعر ابو نواس من خمس سنين بس بصراحة ايامها ماكنش شاذ ولا فى أى حاجة فى شعروا بتدل على كدا جايز يكون فى 2007 بقى شاذ . جايز ماكل حاجة جايزة فى البلد دى . وخد بالك أن البينة على من ادعى واحنا ماشفنالكش اى بينة .<br />2- تانى حاجة فى حاجات كتير فى الموضوع كان لازم تتعرضلها منها ان الموضوع اصبح بنشوفوا فى الشارع عادى وفى المواصلات وأحلف بالله والله والله والله أنى شوفت مجموعة من الشواذ فى الأسكندرية عند بير مسعود متجمعين وبيقبلوا بعض عادى فى الشارع أكتر من خمس شباب أمام الناس كلها رجالة وستات واللى يكسف ان الناس كانت بتتصور معاهوم<br />وكان فى امن عادى ولا كأن فى أى حاجة . والمواصلات دلوقتى بقوا منتشرين فيها فى المترو وفى التوبيسات ويسلام على الياهو اللى مايشترى يتفرج والمشكلة ان الناس دى فيها ناس متعلمة وفيها ولاد ناس بجد مهزلة لدرجة انى سمعت من واحد منهوم على لسانوا ان احنا لينا تنظيم وأماكن بيتقابلوا فيها هما عارفينها كويس . وكفاية كدا وربنا يستر علينا"
archived = "2009-10-11"
capture_url = "https://web.archive.org/web/20091011000859/http://www.20at.com:80/20at/7ayatna/3539.html"

