text = "عاي بس ارد على … محمود غنيم … على انك بتقول ان ده حوار مع خبير في الشأن … هو طبيب الأمراض لجلدية و التناسلية أصبح خبير في شئون الشواذ … ؟؟؟؟!!!!!! كلامك خاطئ كان الأولى أن يكون الحوار مع طبيب نفسي …<br />و بعدين عايز اوضح حاجة كمان … انت بتقول ان التعليقات توضح حقد زملاء الكاتب عليه …<br />انا قارئ لكني لم التمس في التتعليقات حقد … انما من الممكن أن تسمى تعليقات بناءة هادفة ،، و لكنها بحده …<br />و ان دل هذا على شئ فيدل على حب الذين علقوا على الموضوع للقارئ … يكفي اهتمامهم بأن يوضحو آرائهم له و أخطائه التي يرغبون أن يتجنبها في موضوعاته القادمه<br />و بالتوفيق عزيزي الكاتب"
