posted = "2007-04-04"
text = "مش عارف لية انا حاسس ان شريف مجبش الاضرار وده اهم حاجة هو جاب تاريخ الشذوذ والانواع يعني المطلوب مني الان اني اختار نوع ولا اية ؟<br />طيب عرفنا ان في العصر الاسلامي كان فية بس مفيش اي اشاره ان الاسلام حرم الموضوع وكان ابن حنبل وافق الشاعر الشاذ<br />كمان الصورة يعني بتقول يلا ابقو كدة شواذ<br />والعنوان مرة واحد شاذ مش حلو ولا حاجة وحش جدا"
