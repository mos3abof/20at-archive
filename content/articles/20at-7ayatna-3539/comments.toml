text = "بص يا جميل .. الموضوع فيه مشكلتين اساسيتين بدون مواربه \" الصورة لا تعبر عن اى شئ \" صوره هلاميه جدا توحى بان الموضوع يتحدث او يختص اللوطيين دون السحاقيات بالذكر \" والموضوع بيعالج الشذوذ بشكل عام ..<br />وثانيا بقى العنوان ساذج جدا \"سورى \" يعنى ايه مرة واحد شاذ .. العنوان يعطى ايحاء ان الموضوع خواطر او افيهات .. مش شكل شغلك خالص يا استاذ ! بس شغل المحاور لم يغب عنك فى الموضوع"
