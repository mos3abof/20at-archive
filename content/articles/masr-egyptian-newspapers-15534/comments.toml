text = "طبعا هذا لن يكون … والشعب لن يقبل ان ينسي قيمه الدينية<br />وخاصة الإخوان ولا تنسي انهم ليسوا فقط أكبر قوي المعارضة بل هم جزء كبير وحقيقي من الشعب ليسوا فقط الجماعة بل أفراد من المجتمع<br />ولما تضرب مثل بإيران ولا تضرب بتركيا<br />سبحان الله كل الأنظمة والطرق الرأسمالية والإشتراكية جربت حظها في الحكم وفشلت فلما لا ندع للإسلام الفرصة خاصة وأنه الدين الرسمي للدولة ودين الأغلبية من الشعب وذلك لا يهضم حق أي دين خر فلا شيء كالإسلام ينصفهم منذ أن فتحها عمرو بن العاص"
archived = "2010-03-03"
