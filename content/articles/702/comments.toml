subject = "جميل"
author = "إليكم أحد النماذج من شعر العرضة"
posted = "2006-02-10"
text = "* نحمد الله جت على ما تمنى<br />* من ولي العرش جزل الوهايب<br />* خبر اللي طامع في وطنا<br />* دونها نثني الى جت طلايب<br />* واجد اللي قبلكم قد تمنى<br />* حربنا لي راح عايف وتايب<br />* يا هبيل الراي وين انت وانا<br />* تحسب ان الحرب نهب القرايب<br />* لي مشى البيرق فزيزومه إنا<br />* حن هل العادات واهل الحرايب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114309/http://www.20at.com/article2.php?sid=411"

