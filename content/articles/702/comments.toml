posted = "2006-02-11"
text = "انا اعرف رقصة العارضة اللي بيرقصها عصام الحضري بعد ما المنتخب يكسب او الاهلي اما العرضه السعودي دي فخليها لاهلها و اهل مكه ادرى بشعابها"
