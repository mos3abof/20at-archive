[[comments]]
order = 4
subject = "مش فاهم"
author = "Dabdoob"
posted = "2006-02-12"
text = "انا مش فاهم الموضوع ده بصراحة<br />ايه العرضة دي وايه الرجولة فيهايعني !!!<br />ده غير اني مافهمتش الاخ اللي بيفرح لما بيشوف الملك بيرقص بيفرح ليه بالضبط!!!<br />برضه مافهمتش الابيات اللي مكتوبة مقصود بيها ايه!!!بالذات (لي مشى البيرق فزيزومه إنا) انجليزي ده يا مرسي!!!<br />بصراحة انا مش فاهم.<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114309/http://www.20at.com/article2.php?sid=411"

[[comments]]
order = 5
subject = "العبقرية"
author = "Dabdoob"
posted = "2006-02-13"
text = "ايه العبقرية دي ؟<br />انا مش فاهم لاني مش عايز افهم!!!!<br />تصدق فكرة برضه<br />وبالمناسبة السعيدة دي احب اهديكم شعر حماسي من تاليفي من النوع اللي منشور فوق واللي كنت فاكر اني مش فاهمه !<br />(دلماني شوجبل ددينا )<br />(شكرمنا فلع علي الزايب)<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114309/http://www.20at.com/article2.php?sid=411"

[[comments]]
order = 6
subject = "أبيات شعريه للملك عبد الله"
author = "محمد الصيرفي"
posted = "2006-03-25"
text = "أكثر من ريبة الفقراء ..<br />من ثري ٍ يجوب أشد شوارع المدينة فقرا<br />أكثر من حماقة الطغاة<br />إن هم صدّقوا كل المديح .. شعرا كان أم نثرا<br />أكثر من ظلم بعضهم .. عندما يغتال من قوت الحصار<br />لكي يبني قصرا<br />أكثر من دعاء بعضهم على بعضهم<br />فجرا كان ذلك ام عصرا<br />أكثر من انحناء هاماتهم إذا مر<br />وشتائمهم إذا أدبر<br />أكثر من فضول المتسكعين ..<br />إذا رأوا تجمهرا لاثنين أو أكثر<br />أكثر من نبل الملوك<br />وفضاضة العسكر<br />أكثر من نشوة الانتصار .. وقلق الهروب<br />وتلفت الخائفين<br />أكثر من صبر النساء .. وشماتة الأعداء<br />وهم الأغنياء .. ومن حقد الحاقدين في الأنحاء<br />والأرجاء<br />أكثر من استعمالنا لكلمة يقولون .. ومن تكيّف القانونوممن جعلوا الدين كالثياب<br />أكثر ممن يبيعون المنابر .. ويشترون ذمم الكتاب<br />أكثر من كذب الشعراء .. وعظام المقابر<br />أكثر من تنهد السجناء .. وغموض المشاعر<br />أكثر من أنبائنا المحلية<br />وافتراءات منظمة العفن الدولية<br />أكثر من كل المظلومين صبرا<br />أكثر من كل المحرومين قهرا<br />أكثر من كل اللئام .. وسذاجة الإعلام<br />أحبك يا بلادي .. طوعا كان ذلك أم قصرا<br />الله يحفضك أن شاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114309/http://www.20at.com/article2.php?sid=411"

[[comments]]
order = 7
subject = "هذي الرجوله"
author = "عاشقة الملك عبد الله"
posted = "2006-06-09"
text = "وربي الملك عبد الله ابوو الرجوووله<br />فديته انا ورقص العرضه رووعه واهو يرقصه<br />الله يخليه لنا ولاا يحرمناا منه يكفينا انه معيشنا بالعز والخير ومايخلينا نحتاج لأحد ياااربي يوووفقه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114309/http://www.20at.com/article2.php?sid=411"

