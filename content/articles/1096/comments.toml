subject = "جتكو القرف مليتو البلد"
author = "v"
posted = "2006-04-26"
text = "الذين عم بيصيرو متلكن<br />حرام يقرؤو سمير او غيرها<br />المصريين متلكم يقرؤو مجلة عن كيفية الانفجارات<br />او تصفح موقع عمل قنبلة<br />او طريقة عمل مزبحة لمسيحى مصر<br />هذا فقط الذى تقرؤة<br />انت متخلف يابني او يابنتي ولا شكلكوا كدة .. يعني لو واحد عربي فجر قنبلة فى مكان ما يبقى كل العرب ارهابيين؟؟ وبعدين موضوع سمير مش عاجبك متردش خالص ومتقراش مش تيجي فى اى حتة ترميلك ابلقين بتوعك دول .. وبعدين مدام المصريين والعرب مش عاجبينك بقى متقرالناش .. جتكو القرف مليتو البلد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132158/http://www.20at.com/article2.php?sid=733"

