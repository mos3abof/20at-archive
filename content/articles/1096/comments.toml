[[comments]]
order = 11
subject = "المجلة الرائعة"
author = "علي القباني"
posted = "2006-08-27"
text = "نحن كذلك أطفال في الخمسينات نحتفل مع (سميرنا) ونقدم أجمل التهاني لمناسبة<br />ميلاده السعيد وكل عام وسمير وأسرته الصحفية بألف خير.....<br />أنا في ال56 من عمري وألى ألأن أتوق ألى<br />قراءة مجلة سمير ولكن أنقطعت عنافي عام<br />1990 !! نسيت أن أقول لكم أني من العراق<br />وأتمنى أن تردوا على تعليقي هذا وتعتبروني صديقا غائبا عنكم وعاد من جديد<br />والسلام عليكم ورحمته وبركاته<br />صديقكم علي القباني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132158/http://www.20at.com/article2.php?sid=733"
