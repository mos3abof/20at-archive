text = "الذين عم بيصيرو متلكن<br />حرام يقرؤو سمير او غيرها<br />المصريين متلكم يقرؤو مجلة عن كيفية الانفجارات<br />او تصفح موقع عمل قنبلة<br />او طريقة عمل مزبحة لمسيحى مصر<br />هذا فقط الذى تقرؤة"
