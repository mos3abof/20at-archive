author = "عمرو أحمد"
posted = "2006-06-04"
text = "الذين عم بيصيرو متلكن<br />حرام يقرؤو سمير او غيرها<br />المصريين متلكم يقرؤو مجلة عن كيفية الانفجارات<br />او تصفح موقع عمل قنبلة<br />او طريقة عمل مزبحة لمسيحى مصر<br />هذا فقط الذى تقرؤة.<br />طبعا الكلام ده مش بتاعي بس ده بتاع واحد بعت الرد ده قبل مني و الله أعلم أنا أعتقد ان سمير لما كبر أصبح جوز أمه و يا ريت لو كلامي غلط يقول المره اللي جاية يغلط في سمير و بس , مش 72 مليون و يا رب ما يكونش منهم... و يجعله عامر!"
archived = "2006-11-02"
