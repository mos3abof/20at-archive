text = "مجنون أميرة..فكرة بمليون جنيه وسيناريو بتلاتة تعريفة!<br />مصراوي - خاص - عثرت المخرجة «إيناس الدغيدى» على فكرة بمليون جنيه حيث اختارت أن تكون حكاية تضخم الهواجس الدينية فى الشرق والغرب على حدٍ سواء محوراً لفيلمها «مجنون أميرة» المأخوذ عن قصة كتبها «أشرف شتيوى» وكتب لها السيناريو والحوار المخضرم «مصطفى محرم».<br />تبدو هذه الفكرة واضحة وقوية فى الجزء الثانى من الفيلم حيث تعود أميرة ويلز «ديانا» إلى مصر فى زيارة رسمية، وتلتقى مع عالم الدين «مدبولى العشراوى» الذى يرمز إلى الشيخ الشعراوى، وكذلك مع شيخ الأزهر، انها لا تريد تغيير دينها ولكنها تبحث عن التوبة.<br />صحصح يا مصطفى شحاته"
archived = "2009-12-21"
