text = "(مجنون أميرة) يثير جدلاً في الأوساط المسيحيةCET 00:00:00 - 18/09/2009<br />أخبار وتقارير من مراسلينا كتب: مايكل فارس – خاص الأقباط متحدون<br />سيُعرض خلال الأيام القادمة الفيلم الجديد للمخرجة إيناس الدغيدي \"مجنون أميرة\" والذي يتناول قصة حب فتاه مسيحية لشاب مسلم، الأمر الذي أعاد استياء مشاعر المسيحيين بسبب الطرح السينمائي للمسيحيين.<br />وقد صرّح كلاً من نبيل غبريال المحامي ورئيس مركز نور الشمس لحقوق الإنسان، ومنسق حركة شركاء من أجل الوطن لـ \"الأقباط متحدون\": إن الفيلم به ازدراء للديانة المسيحية وتخريب لعقول المسيحيين.<br />وضربا مثلاً بما جاء في الفيلم من قصة حب فتاة مسيحية لشاب مسلم وتناول قضية الطلاق بين المسيحيين، الأمر الذي يؤدي لضرب ثوابت المجتمع والوحدة الوطنية لسبب واحد فقط أنه لابد عند طرح الأقباط في السينما المصرية لأول مرة أن يتم طرحهم بشكل ايجابي حتى يتقبلهم المسلمون الذين طالما لم يروهم في أعمال سينمائية أو تليفزيونية."
archived = "2009-12-21"
