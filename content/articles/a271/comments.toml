[[comments]]
order = 0
subject = "مصر مع مين"
text = "الباشا رئيس المخابرات جري علي غزة عندما احتجزت المقاومة 6 جثث لليهود ولم يحرك ساكنا عندما تضرر 38 بيت في رفح المصرية - رفح المصرية (!!)- وكمان طلعوا محتجزين فلسطينيين في مصر ..دي مصيبة والله خاصة لما نعرف ان مصر مع كل اللي بيحصل بتوقع اتفاق تصدير الغاز لإسرائيل<br />فاضل ايه تاني"
archived = "2004-08-15"
capture_url = "https://web.archive.org/web/20040815222411/http://www.20at.com:80/article.php?sid=271"

[[comments]]
order = 1
subject = "مغترب مصرى فى الكويت"
text = "لاحول ولاقوه الا بالله<br />لا استطيع التعبير عما بداخلى من اسف وحزن على ما نحن فيه ولكن (( كما تدين تدان )) والله انا مؤمن بذلك وسياتى اليوم علينا لامحاله<br />وانتقم الله من كل ظالم ياساده الحكومه المصريه لاتمثل شعبها اتمنى ان يعلم الجميع ذلك وانتقم الله من تلك الحكومات الظالمه امين يارب"
archived = "2004-08-15"
capture_url = "https://web.archive.org/web/20040815222411/http://www.20at.com:80/article.php?sid=271"

[[comments]]
order = 2
subject = "شعر"
text = "اللي خانوا العهد بينا<br />واستباحوا كل حاجة<br />واستهانوا بالعروبة<br />واستكانوا للخواجة<br />مستحيل هايكونوا منا<br />همه حاجة.. واحنا حاجة<br />همه حاجة ..واحنا حاجة<br />همه حاجة ..واحنا حاجة<br />همه.................."
archived = "2004-08-15"
capture_url = "https://web.archive.org/web/20040815222411/http://www.20at.com:80/article.php?sid=271"

[[comments]]
order = 3
subject = "واحد من الشعب"
text = "اللي خانوا العهد بينا<br />واستباحوا كل حاجة<br />واستهانوا بالعروبة<br />واستكانوا للخواجة<br />مستحيل هايكونوا منا<br />همه حاجة.. واحنا حاجة<br />اذا كانو قد باعو دينهم ووطنهم وانفسهم فماذا تتوقع بعد ذلك"
archived = "2004-08-15"
