[[comments]]
order = 1
subject = "اللآجئ"
text = "وطني حقيبتي."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231833/http://www.20at.com:80/article.php?sid=375"

[[comments]]
order = 2
subject = "يقاوم"
text = "ما هو مفهومك للعلاقة بين الانسان ووطنه يا أخي ، وهل يمكن ان تعوضك أرض اللجوء عن وطنك .. اللاجئ يرجع ويقاوم حتى لو فجرها نار"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231833/http://www.20at.com:80/article.php?sid=375"

[[comments]]
order = 3
subject = "تقاوم تاني"
text = "يا أخي اللاجئ .. وطنك هو وطنك وليس حقيبتك التي دوما ما تخضع للتفتيش في مطارات العالم"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231833/http://www.20at.com:80/article.php?sid=375"

[[comments]]
order = 4
subject = "أنا مصري"
text = "مصري لكن بجد نفسي ألجأ لأي حتة<br />أقسم بالله كل أمنيتي<br />إن محدش يوقفني في الشارع يقول لي انت رايح فين وليه<br />كل أمنيتي إني فعلا متضربش قدام ابني وبنتي من أي أمين شرطة<br />بجد والله"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231833/http://www.20at.com:80/article.php?sid=375"

[[comments]]
order = 5
subject = "ويعني غيه كلمة وطن؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
text = "انا وطني رزقي واكل عيشي..اما مش عارف مين هيه أمي ومين نسايبي..ماليش فيه..ماليش فبه."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231833/http://www.20at.com:80/article.php?sid=375"

[[comments]]
order = 6
subject = "يا مصري"
text = "وليه تهاجر انت ، ما يهاجروا هم .. انت هتفضل طيب كده على طول .. طفش اللي بيطفشوك .. ولا ولع فيهم بجاز .. علشان مستقبل أولادك .. بلاش تقول لي أمين شرطة يضربك قلم قدام ابنك أو بنتك .. تخيل أمين الشرطة ده ولا الشاويش اللي حاكمنا هيعمل إيه في ابنك او بنتك بكرة .. لما تتصور ده هتاكله بسنانك .. يستاهل"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231833/http://www.20at.com:80/article.php?sid=375"

[[comments]]
order = 7
subject = "هيه فرخة"
text = "هيه فرخة هاكلها بسناني..دي بقرة ياجنتل غير حاجاتها التانية من<br />لحمة راس<br />وفشة<br />وكلاوي<br />ومنبار<br />ده غير الليه والفروة سياتك..الموضوع مش بالسنان وبس<br />..ممكن بالسنان واللبان واللي مابانش...هاهاهاهاهاهاهاهاهاهاها<br />غلسة<br />مع تحيات دسوقي أفندي<br />المصيف<br />تالت صف من علي البحر"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231833/http://www.20at.com:80/article.php?sid=375"

[[comments]]
order = 8
subject = "عيب بقى"
text = "عيب بقى بلاش طرطشة ولم ولادك يا أخ دسوقي<br />الرملة جت في ترمس الشاي وسندوتشات الجبنة اتبلت<br />عالم بيئة صحيح<br />مع تحيات<br />محمد أفندي محمد<br />مصيف شركة وولتكس - عمارة 5 شقى 12 يمين السلم- جمصة"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231833/http://www.20at.com:80/article.php?sid=375"

[[comments]]
order = 9
subject = "سخيف"
text = "اسخف ما في هذا الموقع..بعض التعليقات التي لاتأتي في محلها ولا وفي وقتها..وعندمايعلق الناس بصراحة وجدية يأتي من يسخف كل شئ<br />لاحول ولا قوة إلا بالله"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231833/http://www.20at.com:80/article.php?sid=375"

[[comments]]
order = 10
subject = "شوية تمييز"
text = "يا ريت على الأقل في موضوعات أ. أحمد نصر مايعملوش كده.. هو مفيش تمييز؟"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231833/http://www.20at.com:80/article.php?sid=375"

[[comments]]
order = 11
subject = "المبره"
text = "ياااا سخيف.. ارجع"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231833/http://www.20at.com:80/article.php?sid=375"

[[comments]]
order = 12
subject = "الحل"
text = "الحل في الجوء..امس شاهدت فيلم عن شباب الجزائر كل من تحدث من الشباب لم يجد وسيلة لما هو فيه غير اللجوء..هذه البلاد تكرهنا ولا يوجد حب من طرف واحد..اعان الله الشباب"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231833/http://www.20at.com:80/article.php?sid=375"

[[comments]]
order = 13
subject = "فركة كعب"
text = "يعني ايه البلد مش بتحبك .. هي العلاقة بينك وبين بلدك علاقة عاطفية .. العلاقة مع بلدك يا استاذ علاقة عقد اجتماعي زي ما قال المرحوم روسو .. ودي بتدار بالديموقراطية وهذه لا تمنح لكن تنتزع (أيوة بسنانك .. وبيسيح فيها دم كمان) .. إنما بقى احنا شعب كسلان جدا .. ويقولك فركة كعب على أوربا .. طب ما تديها فركة كعب وتصلح حياتك .. الله يكرمك"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926231833/http://www.20at.com:80/article.php?sid=375"
