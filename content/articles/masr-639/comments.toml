[[comments]]
order = 0
subject = "شيلوا صورة الكلب ده .."
author = "http://ibnbahya.blogspot.com/"
posted = "2006-07-11"
text = "عشرين مرة طلبت من حضراتكم تشيلوا صورة الزفت القطران المنيل على عين أهله ده .. مش كفاية بتخبطنا في وشنا في كل مكان بنروحه .. قسم بوليس .. مستشفى .. دائرة حكومية .. في الشارع .. يا ناس حرام .. كفاية .. شيلوا صورة البقف حسني مبارك ده من الموقع وكفاية تحطوا بداله رسم كاريكاتيري للحرامي المقنع واحنا حنفهم على طول .. صدقوني شعبنا واعي وحيفهم يا شباب .. خلاص قرفت من صورته اللي بتطلعلي حتى في الأحلام .. ده إيه الغلب ده بس يا جماعه ؟؟؟؟ مش معقوله كده ..<br />http://ibnbahya.blogspot.com/"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091208/http://masr.20at.com:80/article.php?sid=639"

[[comments]]
order = 1
subject = "بمناسبة برنامج الريس اتوفير فرص الهبل للشباب"
author = "مصري عاطل من ست سنوات"
posted = "2006-07-12"
text = "اغنية تنطبق عليك بالظبط يا مبارك<br />(الكداب بيروح النار وانت بتكدب ليل ونهار)<br />واهدي الاغنية لسيادة الريس مبارك واقول له روح يا شيخ ربنا يهدك ويجعل يومك قريب جدا لاننا خلاص جبنا اخر ومش مستحملين اكتر من كده كدب ونفاق من حزبك حزب المعرصين<br />الحزب اللاوطني واللاديموقراطي"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091208/http://masr.20at.com:80/article.php?sid=639"

[[comments]]
order = 2
subject = "يسقط حسنى مبارك"
author = "(الكداب بيروح النار وانت بتكدب ليل ونهار)"
posted = "2006-07-12"
text = "أحب أكمل لك الأغنية<br />وإنشاء الله رايح النار إنت وإبنك الدكتاتور إللى تحت التمرين والست أم منقار يارب الله آمين"
archived = "2006-07-21"
