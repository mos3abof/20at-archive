subject = ""
author = "لينا عبود"
posted = "2007-10-03"
text = "ليس المهم ان ننتقد الدراما المصريه او العربيه ان قدمت الضباط بصوره مغايره للواقع ولكن المهم هو ان نبحث خلف هذه السلوكيات العنيفه للضباط وان نحاول تغير هذه السلوكيات ولو انها في الحقيقه جزء من السياسات الداخليه لأوطاننا الحبيبه<br />لماذا نترك جذور المشكله ونبحث في اشباه الفروع<br />قبل كل شيء علينا ادراك المعنى الفعلي للأمن والحماية والسلام والعداله .. من ثم نغرس لدى القائمين على امننا كل القيم والاساليب الانسانيه الصحيحه ..<br />متى تخلو سجوننا من ضباط يقولون لقادتهم سمعاً وطاعة …<br />ومتى يبقى المتهم والمجرما متهما فقط ولا يتحول لاداة للسخرية والتعذيب…<br />لسنا في وضع نلوم فيه الدراما .. بل يجب ان نلوم السلطات والقيادات التي سمحت بتولي الضباط المرضى نفسيا هكذا مناصب وتركت مسؤولية امننا في اعناقهم<br />( ولأن لكل فعل رد فعل مساو له في المقدار ومعاكس في الاتجاه ، فأن قضايا التعذيب الاخيرة التي حصلت على يد الضباط في مصر وغيرها لم تردع المجرمين عن الجريمه بل زادت من الانحرافات السلوكيه واخرجت نوعا مهجنا من المجرمين فاصبحوا مجرم معرض للتعذيب وليس التهذيب )<br />والله المستعان"
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719234549/http://www.20at.com:80/masr/review/7249-2009-06-09-14-31-36.html"

