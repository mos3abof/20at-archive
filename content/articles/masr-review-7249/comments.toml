author = "مصري"
posted = "2007-10-04"
text = "مع تفهمي لكل المقصود من هذا المقال ياريت نتفهم لماذا يكون الأمن بهذا الشكل الحالي الذي نعاني منه، ضابط الشرطة من اللحظة التي يصحو فيها و حتى ينام (إنسان يعاني) و في نهاية الشهر (الراتب اياه)، ضابط الشرطة لا يرى امامه الا المجرمين و الانتهازيين و الرعاع، هل قراتم (نائب في الأرياف) أنها قصة تعبر عن الفلاح المصري بخبثه الفطري، و عن الأعيان بجبروتهم وأنتهازيتهم، و بين هؤلاء و هؤلاء الطيبون الصالحون الذين لا يظهرون في الشاشة، لأنهم اصبحو أدوار ثانوية يمكن أستخدامها كخلفية لقهوة أو إناس يعبرون الشارع. و شكرا"
archived = "2009-07-19"
