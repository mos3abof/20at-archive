author = "السيد المصري"
posted = "2007-10-04"
text = "فى عزبة الجحش كل شىء مباح وليس من سمع كمن رأى حينما يشتم الضابط اى انسان فى التحقيقات ب..واتكلم ياولة لخلى نهار … اسود حينما ينظر الى المواطن كانة حشرة يحق لة سحقها حينما يشعر انة فوق المحاسبة وفوق القانون حينما يعامل الناس بعجرفة وقلة ذوق تعرف ان المجتمع مريض وان دعاوى التقدم والتحضر واننا لم نغادر عصر المماليك والاغوات كل هذا يحدث فى بلاد الجحوش وهى على بعد ميلين من بلاد الواق واق اما فى بلدنا والحمد للة فالمسلسلات تقول الواقع"
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719234549/http://www.20at.com:80/masr/review/7249-2009-06-09-14-31-36.html"

