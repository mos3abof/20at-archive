[[comments]]
order = 22
subject = "واضح"
author = "زهرة الرمان"
posted = "2007-01-21"
text = "واضح جدا اننا فى مأزق<br />من سيحكم البلد<br />التوريث ومش نافع لان مصر مش سورية<br />ثم انة بالسياسات دى لا شرطة ولا جيش ولا امن مركزى هتقف قدام ثورة الجياع<br />لا حظوا فية ناس بتنام دلوقتى من غير عشاء<br />نتيجة فقر<br />اذن اللى هيحكم البلد دى واحد عسكرى لواء<br />من هو ؟<br />فيما تأتى بة المقادير<br />بتوع الاخوان ينسوا<br />واى حزب تانى ينسى<br />الفوضى قادمة<br />وربما بدفع امريكى<br />انتهى"
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091433/http://masr.20at.com:80/article.php?sid=1470"

[[comments]]
order = 23
subject = "الشعب الوحيد"
author = "سلة الاحزان"
posted = "2007-01-21"
text = "الشعب الوحيد اللى فى نشرات اخبار العالم<br />تتصدرة<br />ليس انجازات ولا افتتاح مدارس<br />والامنتج جديد<br />والا تطوير لدواء او علاج<br />الشعب الوحيد الذى تتصدر اخبارة اعتقالات<br />اعتقالات طلبة<br />ومعارضون يطلق عليهم اخوان<br />ومعتقلون خطر على الامن<br />ومعتقلون للاشتباة<br />ومعتقلون بقضايا مفتعلة زى ايمن نور وعصمت السادات<br />كل يوم اعتقالات<br />ملينا<br />ملينا<br />هل نحن فى عصر الاغوات والمماليك<br />شوفوا صورتكم على شاشات التلفزيونات العالمية<br />بقت قميئة ومقرفة وتجيب الغثيان"
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091433/http://masr.20at.com:80/article.php?sid=1470"

[[comments]]
order = 24
subject = "3 نكت امن دولة"
author = "(1)"
posted = "2007-01-21"
text = "عملوا مسابقة لرجال المباحث في العالم في امريكا جابوا من كل بلد ضابط مباحث وودوهم صحرا كبيره وقالوا لكل واحد فيهم انتشروا في الصحراء وكل واحد يجيب تعلب فكل الرجال ذهبوا وكل واحد فيهم جاب تعلب الا المصري مجاش فراحوا يدوروا عليه ولما لقوه وجدوه ماسك كلب وعمال يعذب فيه ويقول له اعترف قول انا تعلب<br />(2)<br />ظبطوا حمار عند الحدود الليبية<br />سألوة رايح فين<br />قال لهم هربان بيقبضوا على الثعالب جوة البلد<br />قالوا لة انت حمار مالك ومال الثعالب<br />قال لهم<br />حلينى بأة لما اثبت لهم انى حمار<br />(3)<br />عالم اثار بيفحت جنب الهرم -لقى تمثال جميل جدا بس للاسف معلهش اى كتابة ولا اى دليل على صاحبة<br />مر مسئول امن دولة وقال للرتبة اللى معاة<br />النهاردة المغرب يكون عندى اخبار التمثال دة<br />المغرب راح الرتبة قل لة<br />تمام يافندم المثال دة لنفر رع امون رع<br />ومات وعندة 30 سنة وكان خادم فى القصر<br />سألة القائد<br />وعرفتوا المعلومات دى منين<br />تمام يا افندى التمثال اعترف"
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091433/http://masr.20at.com:80/article.php?sid=1470"

