[[comments]]
order = 2
subject = "كل ناطق شهادتين اخواني وهابي متطرف"
author = "ان اعداء الاسلام هم الذين يقررون من هو الاخواني ومن هو الوهابي ومن هو غير ذلك ومن مطالعتي لمواقع الانترنت المعادية لكل ما هو مسلم تاكدت تماما من ان الاخوانجي او الوهابي هو ناطق الشهادتين يعني مثلا"
posted = "2007-01-20"
text = "حبيب العادلي<br />وهابي اخوانجي على حسب زعم المواقع المعادية للاسلام<br />لماذا<br />لان المواقع الحساسة في الشرطة ونخص بالذكر جهاز امن الدولة ممنوع ان يكون هناك غير مسلم في هذا المكان وبناء عليه حبيب العدلي وهابي متطرف<br />وقص على ذلك حسني مبارك لانه لا يقوم بتعيين مسيحيين في الجيش والاجهزة الحساسة في الجيش مثل المخابرات فهو اخواني وهابي متطرف.<br />وصدام حسني مع انه كان عنده معتقلات وسجون للاخوان وكان بيعدم الاخوان فوجىء بأنه من الاخوان المسلمين علشان خاطر كده واحه الاعدام وهذه المواقع تدين كل العرب والمسلمين بأنهم من الاخوان وعمروا موسى من الاخوان والوهابية يعني امام الكافر لا فرق بين واحد ملتحي وواحد حالق اللحية واحد بيصلي وواحد ما بيصليش طالما ناطق الشهادتين<br />كل المسلمين عايزين الدبح<br />واذكركم بمجاذر البوسنه والهرسك كل النساء المسلمان هناك معظمهم لم يكن محجبات على الاطلاق ومع ذلك واجهوا الاذلال لانهم ناطقين الشهادتين<br />ولذلك ادعو ان يفيق المسلمين ويعلموا ان ناطق الشهادتين مسلم وهابي سواء كان في امن الدولة او في الاخوان المسلمين سواء كان حسني مبارك او مهدي عاكف كلاهما اخوانجية وهابية<br />اعداء الاسلام بيقولوا كده<br />واشكر الاخوة اصحاب المواقع المعادية للاسلام انهم عرفونا هذه الحقائق"
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091433/http://masr.20at.com:80/article.php?sid=1470"

