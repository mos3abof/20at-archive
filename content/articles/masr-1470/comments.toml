author = "قل اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء تعز من تشاء وتزل من تشاء بيدك الخير."
posted = "2007-01-20"
text = "بالنسبة للاخوان لو كان ربنا عايزهم كان وفقهم من زمان ولكن كل شوية والامور بتتعقد اكتر<br />وبالنسبة لحركة كفاية على ما يبدو اننا لازم نرفع شعار كفاية معتقلات كفاية امن دولة كفاية ترويع امنين ونترك الحكم لله يأتيه لمن يشاء<br />وحسبنا في ذلك قول الله تعالى وما اريد الا الاصلاح ما استطعت وما توفيقي الا بالله<br />والنكتة بتاعتك حلوه يا زعبله حضيفها الى قاموس النكت بتاعي"
