author = "ملعوبة يا زعبله بس فيه غلطه كتاب الطبخ اسمه ابله نظيره مش ابله فضيله ابله فضيله دي بتاعة عيلة مرزوق افندي"
posted = "2007-01-20"
text = "معلش يظهر الكلام عن الاخوان خلاك ترتبك علشان خاطر كده حاقولك نكته:<br />عملوا مسابقة لرجال المباحث في العالم في امريكا جابوا من كل بلد ضابط مباحث وودوهم صحرا كبيره وقالوا لكل واحد فيهم انتشروا في الصحراء وكل واحد يجيب تعلب فكل الرجال ذهبوا وكل واحد فيهم جاب تعلب الا المصري مجاش فراحوا يدوروا عليه ولما لقوه وجدوه ماسك كلب وعمال يعذب فيه ويقول له اعترف قول انا تعلب<br />ها ها ها ها ها ها ها ها ها ها ها ها ها ها"
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091433/http://masr.20at.com:80/article.php?sid=1470"

