text = "يااميرة اهنمى بنفسك شوية<br />واعملى مكياج تقيل شوية<br />يمكن واحد يتهف فى مخة ويتجوزك<br />اكتبى عن الطبيخ وتربية العيال وكتاب ابلة فضيلة<br />مالك ومال السياسة والاخوان<br />دا ملك ومنظمة صاحبة<br />ابعدى عن المواضيع الشائكة دى<br />ولا اقول لك<br />اكتبى عن البخت<br />وياريت البخت الاسود"
