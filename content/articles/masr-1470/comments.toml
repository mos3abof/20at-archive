text = "بعد 36 تعليق , وكل ادلى بدلوه وراية فى هذا الموضوع اختلف الناس عن احقية الاخوان بالحكم هل هم من الطغاة البغاة ؟؟ ام من التقاه ؟؟<br />ذهب البعض الى حكم العسكر , اه من حكم العسكر اما ان الاوان ان ينتهى حكم العسكر ام ان هذا الشعب تعود على ذلك تعود على حكم الطغاة ؟؟؟<br />ماذا جنينامن حكم العسكر غير المذلة والهوان بين الناس ؟ حكموا عقولكم وقارنوا بين من يريد الاصلاح فعلا وبين من يريد الكرسي ؟؟<br />اخوان كفاية ناصري ,,,,, اى ملة ولكن كبداية غيرووا مبارك..<br />على كل حال اثرت الانتظار الى ان ارى اراء الناس فى الاخوان وغيرهم ,, ولله الحمد الكل متحد على التغيير ."
