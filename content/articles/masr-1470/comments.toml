[[comments]]
order = 20
subject = "مبارك اشترى الوفد والتجمع بكام كرسي .. طيب هم يملكوا إيه عشان يبيعوا؟؟"
author = "إبن بهيه"
posted = "2007-01-20"
text = "ليس هناك من شك نهائياً أن الإخوان المسلمين هم اليوم أقوى فصيل سياسي على الساحة في مصر وهم أقوى اللاعبين على الإطلاق .. أقوى من الحزب الوطني ذاته الذي هزموه شر هزيمة في انتخابات 2005 برغم ما يعانون من تضييق وتزوير وقرف وبلا أزرق ..<br />وكعادة نظام مبارك الواطي في تحطيم كل المنافسين وتدمير الحياة السياسية بالكامل هو يريد اليوم القضاء على الإخوان ولن ينجح .. لن ينجح .. فهو كناطح صخرة لوهنها فلم يوهها وأوهى قرنه الوعل .. فما بالك إذا كان تور وتور عجوز كمان .. خارت قواه وبقى بيخطرف ويهلضم بكلام غير مبرر بالمرة ..<br />قلتها قبل كده يا جماعه .. إكرام الميت دفنه .. ادفنوه وريحوا مصر بقى من هبلته وقرفه ..<br />نرجع مرجوعنا للإخوان المسلمين .. يراهن نظام مبارك الواطي العميل على ثلاثة أحزاب هي الوفد والتجمع والناصري .. سيبك من الناصري دلوقتي لغاية ما يخلص من اللي جواه .. النظام البائد قريباً بعون الله بيراهن على الوفد والتجمع .. وتقدروا تحسبوها من دلوقتي إذا فلحت اللعبه .. نظام مبارك الواطي وعد الوفد والتجمع بعشرين مقعد في البرلمان الجاي وزادوهم بيقولوا تلاتين وفي رواية أخرى خمسين وتضاربت الروايات ... المهم في النهاية مبارك وعدهم بشوية كراسي يترصصوا عليها في البرلمان عشان يقفوا جنبه في تمرير عيشة مصر بتمرير الشعوذات الدستورية ..<br />الحصاوي الواطي فاكر إنه مسنود على أحزاب وهو مش داري إنه خربها من زمان وما عادش فيه وفد ولا تجمع في الشارع .. يعني حيطه مايله يا واطي وراح تاخدك وتقع .. والإخوان ليسو بهذا الضعف الذي يتخيله عقل النظام الغبي وتقارير حبيبه العادلي الهبل وبوبيهات النظام بتوعه .. الإخوان في عز اضطهادهم والتضييق عليهم اكتسحوا الحزن الوطني في الانتخابات وهو اللي في يده مفاتيح كل شيء وال<br />اقرأ بقية التعليق .."
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091433/http://masr.20at.com:80/article.php?sid=1470"

