[[comments]]
order = 9
subject = "النظام بيلعب بالكل..ويقهرهم !!"
author = "البلد وصلت لحالة بالغة من السؤ..والاحزاب الرسمية لعبة في إيد الحكومة..لأن كلها احزاب على راسها بطحه..الناصري جواه حرب بين جناحيين أفضلهم \"ميت\" والتاني مخبر امن دولة \"سامح عاشور\" ..ومخبر صغير كمان...والتجمع اصبح حزب النظام اكتر من الحزب الوطني ..والوفد مش واضحه ليه شخصية..متعرفش هو جاي مع مين ...وبقية الاحزاب ..عد غنمك يا جحا.."
posted = "2007-01-20"
text = "والنظام بيلعب بيهم كلهم زي القط لما بيلعب بالفار قبل أكله..<br />ومحدش عارف البلد راحه فين..والشرفا متحجز عليهم سواء كانو تيارات ولا حتى مثقفين !!<br />والمستقلين عماليين ياكلو في بعض !!<br />في حالة من الاحباط والقرف ...والبلد وقعت وصدقوني مفيش رجا منها !!!<br />أحسن حاجة يعملها الاخوان إنهم يسبو البلد زي ما هي بدل وجع القلب والبهدله والسجن وشحططة اهاليهم ومحاربتهم بسلاح الجوع ..لأن لا الحكومة هترحمهم ولا المعارضة هتقدرهم وتعاونهم ولا الشعب هيساعدهم..يا جماعة الاخوان ..البلد ماتت متتعبوش روحكم..ومهما عملتم ..الناس كلها معارضة ومستقلين ..قريبين وبعيدين..النظام غاسل مخها من نحيتكم..متنحروش قلبكو على الفاضي !!"
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091433/http://masr.20at.com:80/article.php?sid=1470"

