subject = "خليك مع اللة احسن من اى شىء"
author = "احمدابوصالح_صحفى معارض"
posted = "2007-01-21"
text = "الحزب الوطنى فى مصلحتك والمستقبل ليك بكرة شباب مصر هيشتغلوا وبكرة تشوف بعنيك<br />اكيد سمعتوا الاغنية الى مبتاكش عيش دية هو دة ببساطة الحزب الوطنى مجرد اغنية مشروخةببرامجة باجتماعتة بنوادرة بحركاتة النص كم اما بالنسبة للخوان المسلمين فهما ناس طامعة فى الحكم بشتى الواسائل ولاغير الحكم اما الناس فابنسبالهم على الهامش هما بيحولو يظهروا انهم مسالمين لكنهم غير كدة بدليل كلمة المرشد العام الهى يختلف معايا هديلوا بالجزمة هما دول ببساطة الحزب الوطنى والاخوان فمن الاخر كدة خليك مع اللة احسن من كل هذاااااااااااا"
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091433/http://masr.20at.com:80/article.php?sid=1470"

