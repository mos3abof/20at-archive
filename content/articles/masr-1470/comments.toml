subject = "ده اكيد"
author = "لو مكنش مبارك وعيلته عارفين قدر الإخوان مكنوش أعتقلوا منهم كل يوم بالعشرات ومكنوش حربوهم الحرب دى كلها لكن هما عارفين أنهم قوة ليها وجود كبير قوى وتأييد عند المصريين لنزاهتهم وطهارتهم ولكن الحزب الواطى برئيسه ومراته وإبنه عايزين الشعب يبقى حبه عبيد علشان يورثوا الأهبل العبيط الحكم وفاكرين إن الشعب ها يسكت على كده ما يعرفوش إن الشعب كله قنبلة موقوته أمام كرسى الحكم ورافض المدمن الشاذ جمال ومهما حاولوا يعتقلوا من الإخوان مش ها يقدروا يقضوا عليهم وشوفوا إللى عمله فيهم مبارك وحزبة الوسخ فى الإنتخابات ورغم كده فازوا ب 88 مقعد نظيف بدون تزوير وفضايح الحزب الوطنى فى تزوير الإنتخابات كانت رائحتها عفنة نتنه ولكن إنظروا إلى مبارك الكذاب وهو يقول أنه يريد أن يرقى ويطور وهو يعتقل كفاءات من أندر الكفاءات من أساتذه الجامعات ومن طلبة متفوقين لو كان هذا الكذاب يريد الإصلاح لكان هؤلاء هم الذين سيقودون مصر للإصلاح ولكنه كذاب واليهودية مراته عمالة تكتب فى الموقع بأسماء مختلفة علشان تشوه الإخوان المسلمين وده أكبر دليل على نجاح الإخوان المسلمين والشارع وتأييد الشعب هو الفيصل والحكم وهو صاحب القرار"
posted = "2007-01-20"
text = "لا للتوريث لا لجمال مبارك لا لسوزان مبارك نعم للإخوان المسلمين"
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091433/http://masr.20at.com:80/article.php?sid=1470"

