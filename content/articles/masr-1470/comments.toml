[[comments]]
order = 12
subject = "لا للفقر..لاللبطالة..لا لقانون الوظيفة العامة الجديد"
author = "بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-01-20"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو السيلة الوحيدة للتوظيف<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده في مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />من الاخر ياناس ده قانون ظالم وسيهدم اركان المجتمع الذي يقوم علي الاستقرار الي مجتمع يقوم علي التعاقد المؤقت ثم الي الشارع انت واسرتك ايه الموظف المسكين."
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091433/http://masr.20at.com:80/article.php?sid=1470"

[[comments]]
order = 13
subject = "لاللحزن الاوطنى"
author = "فهد"
posted = "2007-01-20"
text = "مليون مرة هنقول لا للحزن الوطنى الى خلى عشتنا كلها حزن وقرف الواحد لحد دلوقتى مش عارف طريقة فين نفسى كدة الواحد يقا بل حسنى مبارك ويقولة كل الى جواة من كبت ومرارة ومن قرف منها ومن شلة الحرمية الى حولية عاوز اقولة كفاية وخلاص قرفنا منك ومن شكللك ومن كذبك حرام عليك اتقى الله فى الشعب الغلبان الناس ماتت من الجوع والله اعرف ناس مش لقيه تا كل حرام والغريب ان الحزن الوطى اى الحزب الوطنى كل حاجة ومصيبة لية مخر جا عندة نعم ومليون نعم للا خوان حتى لو الواحد مات ومهما دخاتونا معتقلات حتى تعذيب الشرطة فى الا قسام فبر كو ها فى بر نا مج البيت بيتك والله يا اخونا دى حكومة مستبدة طيب خلى واحد كدة يد خل قسم شرطة فى مشا كلة ويشوف الى هيحصلة دى الظابط حاسس نفسة انة نزل من السماء وان الناس عندة عبيد والله ما دايم غير ذكر الله وحسبنا الله ونعم الو كيل واخوانى من المهد حتى الممات لو كرة الحقدون"
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091433/http://masr.20at.com:80/article.php?sid=1470"

[[comments]]
order = 14
subject = "بالراحة ومن غير زعل"
author = "الفلاح المصرى"
posted = "2007-01-20"
text = "من يوم متولدت وانا بعرف الاخوان المسلمين والاخت اللى كاتبة المقال بتقول عليهم خطواتهم منظمة وانا واشهد الحق مشفتش ليهم اى خطوات على مدار 50 سنة هيا عمرى اللهم الا الانتخابات الاخيرة غير كدة شجب واعتراض وبس<br />وبالنسبة لشعبية الاخوان احنا منعرفش الاخوان قوى لكن فى الانتخابات الاخيرة كنا مستعدين نتحالف مع الشيطان ولا مرشح الوطنى يكسب اما بالنسبة لبرامج الاخوان المسلمين فانا اؤكد لكم انى وناس كتير جدا من انصار الوسطية يعنى نظام السعودية فى الحكم الاسلامى مينفعشى لية لاننا عشنا عمرنا على كدة ومش مستعدين نعمل غير كدة والحمد للة مبنغضبشى ربنا اصل مصر مش القاهرة وبس الخير كلة والادب كلة فى الريف"
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091433/http://masr.20at.com:80/article.php?sid=1470"

[[comments]]
order = 15
subject = "شعب واطي وميستهلش !!"
author = "مصري بالإجبار"
posted = "2007-01-20"
text = "في رأيي إن الشعب المصري شعب واطي ومعندوش استعداد إنه يقدم شئ لبلاده..هو بس عنده استعداد يضحي بالآخرين في سبيل لمة العيش..شعب خسيس..ذليل..ميستهلش أي تحرك من أي قوى سياسية سواء كانت إخوان ولا غيرهم..لأن أي حد بيحاول يغير ..كأنه بينفخ في قربة مخرومة..<br />والاخ إلي علق تحت عنوان الفلاح الفصيح ..أشك بنسبة 99% إنه من الاساس معندوش بطاقة انتخاب..فميهجص..ويرسم على قفانا !!<br />لأن من الاساس محدش راح ينتخب من المصريين..وإلي نجحو في الانتخابات نجحو بالحشد..وإلي راح انتخب الاخوان هما الاخوان ..والي انتخب الحزب الوطني هما الحزب الوطني أو المرتبطين معاهم بمصالح..زي العشرة جنية مثلاً ولا شنطة الرز والسكر والزيت...متقليش كلام فارغ عن كره المصريين في الحزب الوطني وكلام لامؤخزة ميدخلش على عيل صغير !!!"
archived = "2007-01-23"
capture_url = "https://web.archive.org/web/20070123091433/http://masr.20at.com:80/article.php?sid=1470"

