[[comments]]
order = 12
subject = "الرسالة"
author = "قذائف الحق"
posted = "2006-05-25"
text = "السلام عليكم<br />الرسالة أكثر من رائعة<br />-رغم بعض الملاحظات الفلسفية البسيطة حولها-<br />الرسالة من اخر ما كتب سيد قطب على ما أفهم و لكنها تعد حجة على كل من فهم كلام الاستاذ سيد -رحمة الله و تقبلة في الشهداء- بشكل خطئ<br />سيد قطب كان أديب و بعض الاشارات في كلامة لابد من فهمها في أطار فهم الادب<br />الرسالة كانت دار النشر و التوزيع الأسلامية قد طبعتها في كتيب صغير جميل<br />أظن ان الشعر ده كتبتة الاستاذة أمينة قطب لزوجها الشهيد كمال السنانيري رحمة الله و تقبلة في الشهداء<br />سلام<br />أخوكم قذائف الحق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123504/http://www.20at.com/article2.php?sid=849"

[[comments]]
order = 13
subject = "احيانا تتخفى العبوديه فى ثياب الحريه"
author = "نيفين..نيفى ..نوفا"
posted = "2006-05-25"
text = "لما يكون الكلا اكثر من رائع<br />من العبث انى ادور على كلام يوصفه<br />اللى اقدر اقوله ان الراجل دا فعلا يا جماعه راجل عقله مترتب صح<br />اسرتنى رؤيته العميقه للموت و تجاوزه حدودالجسد و العقل وصولا الى الروح<br />بالنسبه لعبد الله انت لسه فاكر<br />على فكره غير اسلوب هبهوب انت مش واخد باللك انى كنت بقعد اقولها ف كل تعليق واخدالى باللك يا مش شغللك<br />مين ع الموقع اقوله كدا الا هوبه<br />البت اللى قدرت توصل لاعمق حته فى نيفين و تفهمها<br />مستنيه ردك يا هوبه على الايميلات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123504/http://www.20at.com/article2.php?sid=849"

