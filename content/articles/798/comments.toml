subject = "روح بالقوي"
author = "هووووووبه مش شغلك وهبهوب سابقا"
posted = "2006-05-23"
text = "والله يا عبد الله انت فكرتني وانا صغننه بردو العمو بتاع انا كان مديني شويه كتب اقري فيها لسيد قطب عن زوجات الرسول كانت سلسله طويله جدا جدا طبعا ساعتها<br />انا مكنتش عارفه ايه دا وعشان ايه بعد<br />شويه لما كبرت يعني قريتها وفهمتها \" اقصد هنا الاسلوب \" وبعدين ايه يا سيدي وماستك الا انا قريت في ظلال القران دي بقي الروائع فعلا ولما يقترن اسم قطب لازم<br />يقترن بالكتاب دا<br />يلا شكرااااااا عشرينات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123504/http://www.20at.com/article2.php?sid=849"

