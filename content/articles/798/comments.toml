[[comments]]
order = 8
subject = "هل ترانا نلتقى"
author = "مواطنة مصرية 100%"
posted = "2006-05-24"
text = "اولا اشكر عشرينات جدا جدا على تقديم هذه الرسالة فهى رائعة جدا وتوعى الانسان بمفاهيم عديدة فى هذه الحياة، وااحب ان اقدم جزء من العر الذى قالته أمينة قطب له بعد اعدامه<br />هل ترانا نلتقي أم أنها كانت القيا على ارض السراب<br />ثم ولت وتلاشى ظلها .. واستحالت ذكرياتٍ للعذاب<br />هل ترانا نلتقي أم أنها كانت القيا على ارض السراب<br />ثم ولت وتلاشى ظلها .. واستحالت ذكرياتٍ العذاب<br />هكذا يسال قلبي كلما .. طالت الأيام من بعد الغياب<br />هكذا يسال قلبي كلما .. طالت الأيام من بعد الغياب<br />فإذا طيفك يرنو باسما .. وكأني في استماع للجواب<br />فإذا طيفك يرنو باسما .. وكأني في استماع للجواب<br />هل ترانا نلتقي أم أنها كانت القيا على ارض السراب<br />ثم ولت وتلاشى ظلها .. واستحالت ذكريات العذاب<br />هل ترانا نلتقي أم أنها كانت القيا على ارض السراب<br />ثم ولت وتلاشى ظلها .. واستحالت ذكريات العذاب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123504/http://www.20at.com/article2.php?sid=849"

[[comments]]
order = 9
subject = "معذرة"
author = "مواطنة مصرية 100%"
posted = "2006-05-24"
text = "معذرة لم اكمل ارسال الشعر<br />هل ترانا نلتقي أم أنها كانت القيا على ارض السراب<br />ثم ولت وتلاشى ظلها .. واستحالت ذكرياتٍ للعذاب<br />هكذا يسال قلبي كلما .. طالت الأيام من بعد الغياب<br />فإذا طيفك يرنو باسما .. وكأني في استماع للجواب<br />أولم نمضي على الحق معا كي يعود الخير للأرض اليبابي<br />فمضينا في طريقٍ شائك نتحلى فيه عن كل الرضاب<br />ودفنا الشوق في أعماقنا و مضينا في رضاء و احتساب<br />قد تعاهدنا على السير معاً ثم آجلت مجيبا للذهاب<br />حين ناداني رب منعم في حياتٍ في جنان ورحاب<br />ولقاء في نعيم دائم بجنود الله مرحاب الصحاب<br />قدموا الأرواح و العمر فدا مستجيبين على غير ارتياب<br />فل يعد قلبك من غفلته فلقاء الخلد في تلك الرحاب<br />أيها الراحل عذرا في شكاتي فإلى طيفي كأناتُ عتابِ<br />قد تركت القلب يدمي مثقلا تائها في الليل في عمق الضباب<br />وإذا أطوي وحيدا حائرا أقطع الدرب طويلا في اكتئاب<br />وإذا الليل في ضمٌ موحشٌ تتلاقى فيه أمواجُ العذابِ<br />لم يعد يبرق في ليلي ثنى قد توارت كل أنوار الشهاب<br />غير أني سوف امضي مثلما كنت تلقاني في وجه الصعاب<br />سوف يمضي الرأس مرفوعا فلا يرتضي ضعفا بقول أو جواب<br />سوف تحدوني دماء عابقات قد أنارت كل فج للذهاب<br />هل ترانا نلتقي أم أنها كانت القيا على ارض السراب<br />ثم ولت وتلاشى ظلها .. واستحالت ذكريات العذاب<br />هكذا يسال قلبي كلما .. طالت الأيام من بعد الغياب<br />فإذا طيفك يرنو باسما .. وكأني في استماع للجواب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123504/http://www.20at.com/article2.php?sid=849"

[[comments]]
order = 10
subject = "مااااااااااااااااااااشي ."
author = "هوووبه , مش شغلك هبهوب سابقا"
posted = "2006-05-24"
text = "ماله كلامي يا خويا و بكتب لوغارتمات , افهموها بقي قليله احسن من \"الازدواجيه\" .<br />يتك الشلل .يلا اوعي الفتنه , قال ملخبط قال . شوف الواد ملخبط , لاه وبيمئلس وبيقول مقشوفه هبهوب , هوبه , سالي ياخفه عارفه , يا سيدي عقده نقص بحب اغتت علي البشر . واشوفك لابس \"الرادء الاسود\" يا بعيد."
