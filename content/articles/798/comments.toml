[[comments]]
order = 15
subject = "مجرد رأي"
author = "سيد قطب من افضل المفكرين الاسلاميين في العصر الحديث كله. ولا يحتاج لشهادة من احد. فقط اريد ان اسجل انه للاسف كان ضحية للاخوان وليس ضحية لعبدالناصر كما قد يبدو. هم الذين ورطوه ارادوا الاستفادة من قلمه البارع . ولم ينتبه انهم يدفعونه دفعا لطريق مظلم ولا نهاية مفيدة لنفسه ولا للاسلام . لم تكن من صفاته معرفته بالاعيب السياسة فكان ان تاهت خطواته في الطريق الخطأ بينما هم يكسبون من ورائه وبسببه الكثير."
posted = "2006-05-25"
text = "الله يرحمه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123504/http://www.20at.com/article2.php?sid=849"

