[[comments]]
order = 1
subject = "باقي التعليق اللي فات !"
author = "Dr El Ghalban"
posted = "2006-06-22"
text = "علي أن الإكرام العتيد المباشر لصاحب هذا العهد هو أن نتوجه مخلصين لابنه المحبوب وأن نجعل له ما كان للأب الجليل من ثقة ومحبة ولذلك فغنه في الذي تتجاوب فيه القلوب بصدي الخبر الأليم \"مات الملك\" -الله يحرقه - يجب أن يلتف المصريون جميعا حول العرش -بالذوق أحسنلهم- في ولاء ثابت لا يدركه ضعف أو وهن وان يحيوا صاحب الجلالة جمال الأول وقد نودي به إمبراطورا لمصر."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143441/http://www.20at.com/article2.php?sid=969"
