[[comments]]
order = 1
subject = "الجيش المصري فين ؟؟ وساكت ليه على العرص وعصاباته ؟؟؟؟؟"
author = "إبن بهية"
posted = "2006-09-04"
text = "الجيش المصري فين ؟؟ وساكت ليه على العرص وعصاباته ؟؟؟؟؟<br />الرئيس رغم أنف المصريين .. مبارك العرص .. العميل .. القذر .. بدأ زيارات متتالية لأفرع الجيش المصري الذي نهبه وبهدله وجعله شخشيخة في إيد عصابات البيزينس بتوع أولاد الكلب .. طبعا المقصود أولاد مبارك .. مش هو الكلب الكبير برضه .. المهم بدأ الكلب في زيارات مكشوفة ومفضوحه للجيش .. لكن هل يفيد هذا نظامه المتهاوي ؟؟؟ طبعاً لأ وكداب يا خيشه .. الغريب أن العرص مبارك نسي مصيبته الكبيرة وعمالته لإسرائيل وتواطؤه معها لضرب لبنان وكان واضحا هذا ن تعليقات ومواقف مصر السياسية التي جعلت الصحفيين الشبان في لبنان يشتمون أحمد أبو الغيط ويبهدلو اللي جابوه في المؤتمر الصحفي .. وجاي سعادة العرص حسني يقول للجيش المصري في القيادة الغربية (على حود ليبيا.. إيه اللي فكره بيهم؟؟؟) بيقولهم أن مصر أدانت بشدة اعتداءات اسرائيل على لبنان ... طيب أدان ازاي وفين الجزمة ده ؟؟؟ أدانها في الحمام يعني ولا في الحلم ... بالذمه ده مش راجل معرص وزودها أوي أوي أوي .. طيب الجيش ساكت ليه ؟؟؟؟ اسألوا القادة بتوع الجيش المهلهل ...<br />منذ أيام صرح أحد أفراد عصابات مبارك (حسام بدراوي النصاب بتاع مجزرة \"\"عفواً\"\" مستشفى بدراوي بالمعادي) أن جيمي مبارك وده إسمه الحقيقي البريطاني .. أن جيمي هو من يصلح لقوادة مصر في المرحلة المقبلة .. بدأت اسطوانة التوريث تذاع في وسائل الإعلام بعد سنوات من التسجيل والمونتاج والإخراج ... بدأنا نسمع أولى وصلاتها الداعرة ... طيب لإمته يا بلد ؟؟؟ والجيش فين من المصيبة دي ؟؟؟ الجيش المصري اللي بياخدوا مرتباتهم من جيوبنا ومن دم مصر فين ؟؟؟ فين القسم اللي أقسموه على أنفسهم بحماية الوطن ؟؟ طيب وفين الحماية دي ومبارك وعصاباته بيبيع في مصر لليهود حتى حتة .. الجيش مستني إيه ؟؟؟ ولا الجيش مستريح ومالوش دعوة تتحرق البلد والناس ؟؟؟ طبعا مبارك ضاحك عليهم بقرشين زيادة في المرتبات وعايشين في فيلات وقصور وليهم كل الخدمات والمصايف والشقق وحتى السلع التموينية ليهم بأسعار غير خلق الله في جمعياتهم العسكرية ... يعني دول سكان عندنا بس ما لهمش دعوة بالبلد .. لأنهم ببساطة مش مكويين من مبارك وعصاباته زينا ... يبقى هيتصرفوا ازاي وليه ولمصلحة مين ؟؟؟ طالما كل مصالحهم متظبطة وزي الفل ... يتحرق الشعب ... بس ده حرام يا باشوات يا جيشنا العزيز ... لأنكم بكده بتبيعوا القسم بتاعكم بحماية البلد ... بتبيعوه بشوية فلوس وعمارات ومصايف .. ارجعوا إلى ربكم وحرروا مصر من ذلك الخائن وعائلته وعصاباته ...<br />إبن بهية<br />http://ibnbahya.blogspot.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131410/http://www.20at.com/article2.php?sid=1182"

[[comments]]
order = 2
subject = "همسة"
author = "لما أن الرواية اتفكت رموزها ولم ينكر أحد لا نجيب محفوظ و لا محمد سلماوي و سمير سرحان و هم من كتبوا عن هذه الرواية"
posted = "2006-09-05"
text = "يبقي ناقص اية يعني<br />و بالمناسبة يعضد القول ده أن هذه الرواية هي اللي أخد عليها جايزة نوبل (أظن واضح دلوقتي)<br />و لا بس الممنوع مرغوب<br />و علي العموم هو دلوقتي عند ربنا و هو اللي هيحاسبة لكن الله يكرمكم بلاش قصة نشر الرواية دي مش ناقصين قرف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131410/http://www.20at.com/article2.php?sid=1182"

[[comments]]
order = 3
subject = "مجرد رأي"
author = "شغاف احمدد"
posted = "2006-09-14"
text = "السلام عليكم ورحمة الله وبركاته<br />اعتقد ان الاعتراض على هذه الرواية كان سببه التجاوز الذي اظهره نجيب محفوظ على شخصيات الانبياء (ع) عند وصفه لافعالهم واقوالهم ومعنقداتهم وهو اعتراض مقبول على الاقل حسب رأي العامة قبل المشايخ فأنا انسانة عادية (دينيا)لست متعمقة في اصول الدين ولكني مطلعة مثل غيري على القران ولذا فأن الفكرة التي كونتها على الانبياء مصدرها القران الكريم وكان يمكن للمؤلف الاعتماد على الوصف القراني للأنبياء لمراعاة حقيقة كونه مسلم ومراعاة مقام الانبياء (ع) وصدقوني انتم ايضا ستشعرون بالنفور عند قرائتكم لها كما شعرت انا.. شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131410/http://www.20at.com/article2.php?sid=1182"

[[comments]]
order = 4
subject = "لا تكن امعة"
author = "مسلمة"
posted = "2006-09-26"
text = "عن نفسي قرأت الرواية، ولا أري فيها اطلاقا ما استخلصه البع من ان نجيب يقترح ان يحل العلم محل الاديان السماوية..بل أجده في النهاية يخلص الي ان العلم والدين وجهان للعملة الصالحة البشرية<br />وانهما متكاملان لا كما ينادي العلمانيون بضرورة ازالة الدين لتقدم الارض..ان الذي يحز في نفسي ان يتفهم الغرب هذه الرؤيا ويصف الرواية بأنها\"محاولة لاعلاء القيم الروحانية\" بينما نحن مازلنا نكفر صاحبها دون حتي أن نمنح أنفسنا الحق في قراءته..ان الذي لا يقرأ نجيب هو الخاسر الوحيد في رأيي. وأنا لا أحبذ-بصفتي-الترميز لله، لكنني أستطيع تقبل الرواية دون تكفير صاحبها<br />علي أية حال الرواية ليست الأفضل بين كتابات نجيب،وأري أن الحرافيشر مثلا تتفوق عليها فنيا ورمزيا وأكثر امتاعا كذلك<br />فقط اقرأوا يا اخوان..ا..ق..ر..أوا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131410/http://www.20at.com/article2.php?sid=1182"
