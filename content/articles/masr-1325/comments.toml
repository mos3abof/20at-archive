[[comments]]
order = 0
subject = "هم ليسوا خراف"
author = "مصرية مهمومة"
posted = "2006-12-19"
text = "اولا اسمحوا لى ان ارفض تسمية شباب مصر بالخراف قد يكونوا ضلوا وان كانوا كذلك فانت سيدى الكاتب والسيد رئيس الجامعة والسيد الوزير والرئيس بالمرة المسئولون لا نكم او صلتموهم لطريق مسدود فلولا تزوير الانتخابات واقتناع الطلاب بحدوث ذلك التزوير لما اقيمت تلك الانتخابات التى يسمونها بالاتحاد الحر من الذى اضطهد الاخوان وتعمد تشويه صورتهم حتى نالوا تعاطف الناس ومن ثم تاييدهم بدافع عاطفى وليس فكرى من الذى سمح للامن بالتدخل فى الجامعات"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102717/http://masr.20at.com:80/article.php?sid=1325"

[[comments]]
order = 1
subject = "كفاكم يا ذوي الوجهين"
author = "المسكين"
posted = "2006-12-19"
text = "لا أدري في فلك من تدور ياذا الوجهين.أخي في المعتقل الان وتخرجت أنا السنة الماضية وكنت كلما أتقدم للاتحاد كانوا يشطبون كل اللي ما يعرفهوش اخوان او غير.وانا كنت زعلان جدا عشان الثلاثة صور 2 الاتنين جنيه دمغة اللي بيلهفوهم .أنا لا أنتمي للإخوان فكرا ولكني حبهم واجدرهم أخي الصغير هو المنتمي لهم وأنا علي يقبين أنا أخي أفضل مني مليون مرة.رئيس الجامعة كان فين لما اعتدي الوا بتاع أمن الدولة علي طالب وصفعه بالألم ولا لما الحرس اعتدي علي طالبة بالضرب.أنا أبغض أحمد الطيب في الله وأبغضك أيضا يامخبر أمن الدولة(حمدي رزق)"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102717/http://masr.20at.com:80/article.php?sid=1325"

[[comments]]
order = 2
subject = "صفعة علي قفا رئيس الجامعة"
author = "المسكين"
posted = "2006-12-19"
text = "عندما يؤخذ أخي من داخل غرفته بالمدينة الجامعية فهذه صفعة علي قفاك ياطيب.وعندما يستبعد الطلاب غصب عنك فهذه صفعة أخري وعندما تتخلي عن رعيتك فأنت خائن للأمانةحسبي الله ونعم الوكيل فيك ياطيب أنت والمصري اليوم وحمدي رزق."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102717/http://masr.20at.com:80/article.php?sid=1325"

