[[comments]]
order = 4
subject = "كنت فين ياحمدى"
author = "ايمن امام"
posted = "2006-12-20"
text = "كنت فين ياحمدى لما القطر ولع - كنت فين ياحمدى لما العباره غرقت كنت فين ياحمدى لما دينا رقصت فى الشارع كنت فين ياحمدى لما البلد خربت كنت فين ياحمدى لما سبو النبى كنت فين ياحمدى لما عذبوا الشعب كنت فين ياحمدى لما هربو الفلوس بره البلد كنت فين ياحمدى لما باعو البلد - كنت فين ياحمدى لما شستمو السيده / عائشه كنت فين ياحمدى لما هتكو عرض الصحفيه كنت فين ياحمدى لما الشعب اتقتل بالهرمونات بتاعت يوسف والى - كنت فين ياحمدى لما مصل شلل الاطفال طلع فاسد - كنت فين ياحمدى لما الشعب جاع جنت فين ياحمدى لما السرطان والكبد الوبائى ملى البلد - كنت فين ياحمدى لما البطاله انتشرت - كنت فين ياحمدى لما ضاعت العراق - كنت فين ياحمدى لما الاسعار ولعت - كنت فين ياحمدى - طنط بتدور عليك/ ايمن امام"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102717/http://masr.20at.com:80/article.php?sid=1325"

[[comments]]
order = 5
subject = "تسم ياا يمن"
author = "احسنت يا ايمن لا فض فوك - كلامك بيوجع القلب ويدمع العين"
posted = "2006-12-20"
text = "احنا كنا نايمين فين لما حصل كل دة<br />ولا يظهر ان البانجو عشش فى ادمغتنا ومش عارفين اية اللى بيحصل<br />باقة ورد اليك<br />وارفع طاقيتى احتراما"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102717/http://masr.20at.com:80/article.php?sid=1325"

[[comments]]
order = 6
subject = "ورثة إبليس"
author = "أحمد مطر"
posted = "2006-12-21"
text = "وجوهكم أقنعة بالغة المرونة<br />طلاؤها حصافة، وقعرها رعونة<br />صفق إبليس لها مندهشا، وباعكم فنونه<br />\".وقال : \" إني راحل، ما عاد لي دور هنا، دوري أنا أنتم ستلعبونه<br />ودارت الأدوار فوق أوجه قاسية، تعدلها من تحتكم ليونة ،<br />فكلما نام العدو بينكم رحتم تقرعونه ،<br />لكنكم تجرون ألف قرعة لمن ينام دونه<br />وغاية الخشونة ،<br />أن تندبوا : \" قم يا صلاح الدين ، قم \" ، حتى اشتكى مرقده من حوله العفونة ،<br />كم مرة في العام توقظونه ،<br />كم مرة على جدار الجبن تجلدونه ،<br />أيطلب الأحياء من أمواتهم معونة ،<br />دعوا صلاح الدين في ترابه واحترموا سكونه ،<br />لأنه لو قام حقا بينكم فسوف تقتلونه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102717/http://masr.20at.com:80/article.php?sid=1325"

