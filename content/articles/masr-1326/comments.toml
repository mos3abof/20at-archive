[[comments]]
order = 5
subject = "فيه إيه يا ولاد البلد ؟؟؟"
author = "إبن بهيه"
posted = "2006-12-20"
text = "العجيب أن إخوانا المعلقين هنا عجبتهم القصيدة الحلوة بتاعة الأخ محمد وسابوا الموضوع .. باين وواضح أن الجميع وصل إلى حالة من الملل والقرف الشديد ..<br />وكمان موضوع اللحمه ده الظاهر إنه بقى زي الكلام في الدهب والألماظات والسوليتير .. يعني مش الكل بيهتم بيه ..<br />عموماً باتمنى من إخوانا في ولاد البلد يرحمونا من صور أفراد العصابة دي اللي كل يوم يحطوها في الموقع وعلى المواضيع .. فيه إيه يا ولاد البلد ؟؟؟ هي ناقصه يعني ؟؟؟<br />الرحمه شويه ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102243/http://masr.20at.com:80/article.php?sid=1326"

[[comments]]
order = 6
subject = "طبق اليوم"
author = "حسن الجمال"
posted = "2006-12-20"
text = "الشعب ماهوه الا<br />جزر بطاطس وبسله<br />داخل فى وسطيهم كوسه<br />وادى الطماطم مفعوصه<br />ولونها احمر لون الدم<br />والكل عايم قشطه ياعم<br />بهرات وتوم والذى منه<br />الشعب جاهز بسم الله<br />ان شالله يعجب طبق اليوم<br />العمده ويا جميع القوم<br />اكيله طبعا اه معلوم<br />على رأسهم عم علوله الشعب جاهز بسم الله"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102243/http://masr.20at.com:80/article.php?sid=1326"

[[comments]]
order = 7
subject = "لحمة اية"
author = "ابو صياح"
posted = "2006-12-20"
text = "انتم تتكلمون عن اللحمة ؟ اللة هى طلعت<br />ومين بيحلم ياكل لحمة ؟<br />زمان قوى ايام ماكان فية مظاهرات قبل ظهور الامن المركزى والشرطة اللى بلباس مدنى حصل ياسيدى ان اللحمة غليت<br />وطلعنا فى مظاهرة فى القاهرة نهتف<br />يافلان بية اللحمة بقت بجنية<br />علشان اللحمة بقت بواحد جنية عملنا مظاهرات هى بقت بكام دلوقتى<br />ياناس كفاية انتم السبب"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102243/http://masr.20at.com:80/article.php?sid=1326"
