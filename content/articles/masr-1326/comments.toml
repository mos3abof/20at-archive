[[comments]]
order = 3
subject = "لخمة راس"
author = "رئيس تحرير"
posted = "2006-12-20"
text = "ايه يا جماعة طيب مش لازم تاكلوا لحمة كلوا بسكويت او جاتوه طيب فى ايه ليه شاغلين نفسكم باللحمة والكلام الفاضى ده وبعدين كيلو اللحمة ب35 جنية بيعمل من 6 الى 8 قطع بعد ما تشيل اللى الجزار حطه يعنى القطعة بحوالى 4.5 جنية ودممكن ب2 جنية نجيب 2 بسكويت مع كوباية شاى بحليب وتبقى قضيت لكن لحمة دى كلام من الرفاهية وعلية القوم بس هم اللى ياكلوها والاخوة المسيحيين برده ممكن يكملوا صيام واهه كله بثوابه وممكن نعمل حاجة تانية ممكن ناكل فى نفسنا ارخص بس المشكلة هندبح مين على العيد ؟؟؟؟؟؟؟؟؟؟"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102243/http://masr.20at.com:80/article.php?sid=1326"

