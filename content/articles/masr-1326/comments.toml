order = 0
subject = "منين اجيب ناس قصيده جديده"
author = "محمد المصرى"
posted = "2006-12-19"
text = "منين اجيب ناس لمعناة الكلام يتلوه<br />ان صح قولى اشهدولى وأن كان غلط انسوه<br />أنا المصرى اللى طول عمرى بالحديد حكموه<br />اكلونى لحم ولما ما فضلش غير العضم رموه<br />عايش ومش عايش والعيشه بقت مره<br />سنين طويله مافرحتش ولا مره<br />والكدب شغال عن افراح جايه ومسره<br />انا مش لاقى ااكل وبيكلمنى عن الذره<br />يا اخوانا ما فى شىء فى بلدنا ما تبعشى<br />طب والفلوس راحت فين اناعن نفسى معرفشى<br />ولو حد سأل كانوا فى المعتقل نفخوه<br />بياع وسمسار وحواليه الكلاب يحموه<br />طيار وجبار وعلى تلها مبلط<br />لا والمصيبه عايز ابنه كمان يلهط<br />طايح فى عزبة ابوه فرحان ومزقطط كان يوم مهبب يوم ما البعيد ولدوه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102243/http://masr.20at.com:80/article.php?sid=1326"

[[comments]]
order = 1
subject = "كل سنة انتم طيبين"
author = "مصرية مهمومة"
posted = "2006-12-19"
text = "هم فى الدول المصدرة يبيعون لحوما وابقارا مريضة وهناك موضوع حدث قريبا بشان تلك الابقار المريضة والحكومة طبعا عارفة انها مريضة بس بيقولوا ان المصريين معدتهم تهضم الزلط وعلى راى واحد مسئول هو احنا لو اكلنا واحد غربى اكل مصرى هيعيش اساسا<br />كل سنة وانتم طيبين ومن الاحمة شبعانين وعلى الحكومة رضيين"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102243/http://masr.20at.com:80/article.php?sid=1326"

