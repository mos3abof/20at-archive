text = "كارت عائلة ايه وتفتيش ايه ومنكر ايه. انتوا اللي عملتوا المشكلة. انا بقول سيبوا الناس تقعد مع بعضها وليهم رب يحاسبهم. ده افضل من الغرز اللي انتو بانينها دى وبعدين ايه المشكله ان الراجل ياكل مع مراته قدام الناس طالما بيعمل ده في مصر، في شارع جامعة الدول العربية وياريت مع مراته …"
