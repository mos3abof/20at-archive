author = "نور"
posted = "2009-08-06"
text = "طبعا الكبت يولد الإنفجار<br />تفتيش في كل شئ و قد يصل إلي التفتيش في الضمائر<br />هيئة الأمر بالمعروف و ممثليها قد تطارد شخص في سيارة لشكهم إن معاه واحده<br />قيود علي كل شئ<br />الأعزب هنا كالمرض يتحاشاه الجميع<br />المتنزهات للعوائل و يخصص أوقات معينه ليرتادها العزاب<br />تناقض كبير في كل شئ هاهنا<br />ينادون بتطبيق المظاهر الإسلامية لكن الأخلاق في واد آخر يطلقون اللحي و يشتمك و يسبك و يتعالي و يتكبر عليك لأنك هنا أيها المقيم من أجل خدمته بفلوسه<br />ياكل راتبك و حقك و عمولاتك و يخالف القانون و يستهتر بك و يصلي بالمسجد"
archived = "2009-08-30"
capture_url = "https://web.archive.org/web/20090830014004/http://www.20at.com:80/20at/ana-s3ody/12642-2009-07-13-13-50-44.html"

[[comments]]
order = 11
subject = ""
author = "محمد عبدالله"
posted = "2009-08-12"
text = "بسم الله الرحمن الرحيم<br />اخواني واخواتي الاعزاء<br />السلام عليكم ورحمة الله وبركاته<br />لقد قرأت جميع الردود السابقة وهالني ماقرأت فالبعض يحمل السعودية كبلد تبعات وأفعال أشخاص لانعرف عنهم الا انهم يعيشون بالسعودية فقط هل هم اهل بلد ام مقيمون بها<br />ثانيا نحن نعتبر انهم شواذ وقلة لا تعد ظاهرة في عرف علماء الإجتماع<br />نعم تحدث أخطاء من البعض هداهم الله وليس بمستغرب ان يحدث هذا منهم فهم بشر وخطاءون وليسوا معصومين كما يعتقد البعض سواء كانو سعوديين او غيرهم ممن يسكن السعودية<br />البعض يستغرب حدوث ذلك من اناس هم فقط محسوبين على السعودية ويتناسى انهم بشر والكثير منكم يعرف ان السعوةدية هي البلد الوحيد الذي يطبق شرع الله ويطبق احكام الشريعة الغراء مستمدينا احكامهم من القرآن الكريم ومن السنة النبوية وكل فترة نسمع عن حدود القصاص وحدود التعزير التي يطبقها القضاء السعودي على كل مخالف لأحكام الدين<br />هذا الشخص امجاهر بمعاصية على خطر عظيم فالله يستره وهو يفضح نفسه امام الملأ والله يغفر لكل مذنب الا المجاهر بمعصيته فنسأل الله الهداية للجميع"
archived = "2009-08-30"
capture_url = "https://web.archive.org/web/20090830014004/http://www.20at.com:80/20at/ana-s3ody/12642-2009-07-13-13-50-44.html"
