text = "بصراحة أناكتير خجلانة من الموضوع<br />أنابرتاح لملبشوف بلدبتمشي أحكام الاسلام بس<br />دينا الاسلام ماأجبرنالبس الخماروهاداسبب من أسباب المشاكل اللي بتصيربالسعوديةي عني مابتعرف مين تحت الخمار ( بلاموآخذة)<br />والشد كتيربرخي كتير<br />ويا الأهل سهلو أمور الزواج على الشباب والله يهدي بناتنا وشبابنا ويهدينا معاهم آمييييييييييييي ييييييييييييييي ييييييييين"
