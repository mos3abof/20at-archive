text = "السعودية نعاني من مشكلة أكبر منها. مع الأسف تكابر ولا تريد الاعتراف انها اجتماعيا منهاره وان فيه سعودية اخرى غير التي يراها الناس. يا جماعة الخير في السعودية , افهموا شبابكم وحياة مواطنيكم. على فكره ممكن يكون ده عند ربنا اهم من حماية الكعبه."
