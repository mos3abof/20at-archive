[[comments]]
order = 9
subject = ""
author = "شمس"
posted = "2009-08-04"
text = "انا بصراحة مش عارفة اقول ايه ده واحد بيقولك فى المدينة المنورة<br />يعنى ياجماعة هو اتعرف عليها فى هذه المدينة ودارت بينهم الاحاديث<br />والمقابلات معلش ياجماعة انا بس قرات اول واحد مقدرتش اكمل من<br />القذارة اللى فيه يعنى نسى الله عز وجل والرسول والاسلام والدين<br />ده الواحد لما ولد بيوقفوه وبيسالو على اى حاجة الواحد بيبقى مكسوف<br />انه واقف مع واحد غريب مايعرفهوش مش بيتابدلوا المقابلات<br />ايه ده ياجماعة بس وكمان ادت السواق فلوس على شان مايقولش<br />لاهلها يعنى هى خايفة من اهلها ومش خايفة من ربنا اللى خلقها<br />ده ربنا بيقول للشئ كن فيكون هى وهو مايعرفوش كده<br />ياربى لك الحمد كما ينبغى لجلال وجهك ولعظيم سلطانك<br />لا الـــــــــــــ ـــــــــه الا اللــــــــــــ ــــــــــــــه<br />اللهم اعــــــــــــز الاســـــــــــ ـــلام والمسلميـــــــ ـــــــــــــــ ن<br />امين يارب العالمين"
archived = "2009-08-30"
capture_url = "https://web.archive.org/web/20090830014004/http://www.20at.com:80/20at/ana-s3ody/12642-2009-07-13-13-50-44.html"

