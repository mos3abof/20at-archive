[[comments]]
order = 1
subject = "إضا عُرف السبب ...."
author = "لينا"
posted = "2006-06-26"
text = "لا يحتاج الموضوع لتفكير طويل<br />فإول اسباب تراجع طلبة الأزهر وعدم حفظهم للقرأن هو الاهمال الرئيسي في البيت وعدم التحفيز من الصغر.. عدم ادراك الأهل ومتابعتهم لاطفالهم واولادهم في مراحل متقدمه من العمر وحثهم المتواصل عن معرفة اساسيات دينهم ومداومتهم على قراءة القران واستذكاره من وقت لأخر هو أمر بالغ الاهميه<br />الانسان يتأثر بمجتمعه الصغير وهو الاسره<br />فإذا لم تكن الاسره هي الاساس الصحيح لن يستوي شيئا صحيحا بعد ذلك<br />اضف الى ذلك الاسباب الوراده في المقال من ضعف الميزانيه المرصوده وتكاسل الاساتذه وعدم توفر الشروط في الطلبه المتقدمون<br />ولكن قبل كل شيء فالقران الكريم نحفظه لا لندخل الازهر فقط بل هو سبيل رحمه ومغفره يوم القيامه فلماذا لا نحث اولادنا من الصغر على حفظه ودراسته حتى لا نندم حين لا ينفع الندم<br />لينا<br />sleepingangel_wl@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124016/http://www.20at.com/article2.php?sid=991"

[[comments]]
order = 2
subject = "إبراهيم عيسي .... شرف المصريين .... اللي جاي عليه الدور"
author = "محمد السيد"
posted = "2006-06-26"
text = "واستمرارا ..... لمهزلة التمديد ... والتوريث ... وعدم التعديل ......<br />الحكم بسجن إبراهيم عيسى رئيس تحرير صحيفة \"الدستور\" المصرية لمدة عام بتهمة سب الرئيس...<br />طيب .ماهو في 70 مليون مصري بيسبوا اللي اسمه إيه ؟؟؟ حيتسجنوا فين دول ؟؟؟<br />وعمار عليكي ... يا مصر ...<br />و برضه ... مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124016/http://www.20at.com/article2.php?sid=991"

