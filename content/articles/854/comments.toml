[[comments]]
order = 12
subject = "الدقهليه"
author = "محمد شومان طالب أزهرى"
posted = "2006-10-25"
text = "أنا طالب أزهرى حاولت أن أذاكر المواد المكرره على فى الثانويه الأزهريه فلم أسطتع لأن كلما أذاكر ماده وعندما أنتهى منها أجهل الما دة التى ذاكرتها من قبل وهذا ليس ضيق عقل لا والله ولكن كل مافى الموضوع أن المواد كثيره جدا وفى نفس الوقت ثقيله جدا كيف ازن الأمور بين المواد الثقافيه والمواد الشرعيه وفى نفس الوقت نأخذ دروس فى كل المواد حتى فى مادة الفقه الميسر الذى يحكى أمور ديننافها ذا جه للدين مرتب والدى فى الشهر ربعمائة جنيه أننى أخذ مصاريف الدروس مايقرب من مائتين جنيه ونحن ستة أخوات فى الأزهر هذا ما وضع العلم فى الأزهر صعب على الطالب وعلى أولياء الأمور فيجب رفع المواد الثقافيه من الأزهر لأن الأزهر هو منارة الإسلام وليس ضياعا للدين<br />وفق الله شيخ الأزهر محمد سيد طنطاوى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124016/http://www.20at.com/article2.php?sid=991"

[[comments]]
order = 13
subject = "المنصورة دقهليه"
author = "طالبة ازهرية"
posted = "2006-10-30"
text = "اولا السلام عليكم<br />انا طالبه فى السنه التانيه من الثانوية الازهريه القسم العلمى لكن وللأسف لايوجد اى اهتمام يتلقاة طالب الازهر كما يتلقى طالب التربيه والتعليم وايضا ليس لدينا اى امكانيات فى المعاهد خالص حتى مدرسين المواد العلميه ليسوا على درجة كافيه من التعليموكثيرر جدا من المدرسين اللى مش بيشرحوا اصلا وانا وغيرى من الطلبه بنشاهد ذلك وغير هذا انا مشكلتى ومشكلة غيرى كتير من طلبة القسم العلمى اننا لدينا مواد كثيرة جدا ما بين علميه وشرعيه اما فى التربيه والتعليم فيوجد علمى رياضة وعلمى علوم اما نحن فعلمى شامل ومع ذلك لانلقى اهتمام مثل التربيه والتعليم ودائما التربية والتعليم فى المقام الاول اما الازهر فهو الثانى دائما ومع كل هذا التنسيق يجى عالى جدا لكن ارجع واقول ماذا نفعل انا عندى كلام كتير عايزة اقوله والله لانى فعلا حاسة ان الازهرية مظلومين فى كل شئ وشكرااااااا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124016/http://www.20at.com/article2.php?sid=991"
