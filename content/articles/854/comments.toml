[[comments]]
order = 4
subject = "لازم يكون في حل"
author = "محمود صابر - أزهريون من أجل التغيير"
posted = "2006-07-06"
text = "واللهي المشكله كبيره جدا ...هو أصلي الطلبه مش هما لوحدهم المسئولين علي ده ....يعني السؤال اللي بيحيرني ...هوه انهي الاحسن ...اني الواحد يحفظ خمس أجزاء ....وهو زي عفوا - الحمار - يحمل أسفارا مش عارف قيمتها ولا انه يدرس سوره واحد بس بمعناها ومرادها وشرحها ....من وجهة نظري المتواضعه كطالب في الازهر يحلم بتغيير ما هو عليه ....ان طريقه التعليم نفسها هي اللي غلط مش الطالب لوحده...وعلي فكره ..الازهر في العشرين سنه اللي فاتو - من وجهة نظري برضه- أثر بالسلب علي المجتمع كله ....لازم كطلبه نفهم ...مش نحفظ علشان نتخرج .....فاهمين ديننا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124016/http://www.20at.com/article2.php?sid=991"

[[comments]]
order = 5
subject = "انهم بشر"
author = "ازهرى"
posted = "2006-07-13"
text = "السلام عليكم<br />بداية كأزهرى ، احب ان اوضح ان الازهريون بشر وليسوا ذوى قدرات خاصة او معزولون عن العالم فما يؤثر فى الشباب سلبا وايجابا يؤثر فيهم ايضا ، وموضوع عدم حفظهم للقران الكريم فهو بالطبع تقصير واضح يمكن ان يكون سببه بعض السلبيات فى المؤسسات الأزهرية ولا ننفى ذلك.<br />ولكن صدقونى ان الأزهر ينجب من العلماء الأجلاء ما لا يقدر احد على انكاره.<br />وعذرا أن اقول : ان كان الطالب الأزهرى يقصر فى حفظ القران فهو عالاقل يعرف الاحكام الفقهية الأساسية فى حين ان هناك من غير الازهريين من هو متزوج ولا يعرف كيف يغتسل من الجنابة .<br />فلا تنظروا الى الجزء الفارغ من الكوب فقط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124016/http://www.20at.com/article2.php?sid=991"

[[comments]]
order = 6
subject = "؟؟؟"
author = "ازهرية"
posted = "2006-07-18"
text = "اسمحوا لي العيب ليس عيب الأزهر كمؤسسة تعليمية و لكن العيب الأول في المجتمع فطلبة الأزهر مثلهم مثل باقي الطلبة يعيشون في نفس المناخ حيث الاهتمام بالاأغاني و خلافه عولمة بقي و كيف يهتموا بحفظ القرأن في مجتمع يعتبر حفظ القران و المحافظة علي الصلوات و الالتزام و اتباع السنة ارهاب و كيف يمكن القضاء علي الغش في مجتمع الشباب الذي يتفاخر بانه استطاع ان يخدع المراقب و يغش و ينسي ان الله يراه كمان التعليم الأزهري قبل الجامعة في حالة يرثي لهانظرا لضعف الامكانيات خاصة في القري و سوء أحوال القائمين علي الأزهر وشكرا لشيخ الأزهر هو انتم منتظرين منه ايه غير كده وعلي فكرة طلبة الازهر كثير منهم حافظون لكتاب الله و كلهم لديهم قدر كبير من المعرفة بالاحكام الفقهية حتي وان لم يطبقوها<br />و بعدين حفظ القران واجب علي المسلم مش بس الأزهري احفظوا انتم و خليكم في حالكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124016/http://www.20at.com/article2.php?sid=991"

[[comments]]
order = 7
subject = "الدقهلية"
author = "أحمد شحاته"
posted = "2006-07-21"
text = "هذه نتيجة طبيعية جدا نظرا لمستوى التعليم داخل جامعة الازهر فأنا شاهد عيان لأننى خريج هذه الجامعة ،،<br />فجامعة الازهر شأنها شأن أى جامعة مصرية تعانى من إنهيار وانحدار فى مستوى التعليم بالاضافة الى أن جامعة الازهر أرادة أن تجمع بين العلوم المدنية والدينية فى آن واحد ففشلت فى الاثنين معا فأصبح خريج الجامعة لا يجيد التحدث لا فى العلوم الدينية ولا المدنية إلا من رحم ربى وهذه قله قليله جدا 0000"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124016/http://www.20at.com/article2.php?sid=991"

