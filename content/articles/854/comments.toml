[[comments]]
order = 9
subject = "لا تظلمو طالب الازهر"
author = "yahkk"
posted = "2006-07-30"
text = "ياريت قبل منحكم على طالب الازهر نعرف هو كان بيدرس ايه انا كنت بدرس 14 ماده فى السنه بدايه من اولى اعدادى فى الوقت الى كان بيدرس فيه طالب التربيه والتعليم خمس او ست مواد ومكنش حد بيعبرنا حتى بدروس تعليميه زى الى بتيجى فى التلفزيون تقدرو تقولو ازاى اذاكر 14 ماده واحفظ خمس اجزاء واراجع عليهم وانا فى الامتحانات كنت بمتحن كل يوم مادتين واذا ده حصل فى سنه لازم هنساه السنه الى بعدها علشان كميه المواد الكبيره الى بدرسها كل سنه الحل هو ان الازهر يرجع تانى مؤسسه لتعليم العلوم الدينيه فقط علشان يرجع لمكانته تانى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124016/http://www.20at.com/article2.php?sid=991"

