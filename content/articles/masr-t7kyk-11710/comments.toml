author = "نضـــــــــــال"
posted = "2009-03-25"
text = "هى جت على دول وبنقول بتضر بالذوق العام<br />والى ماشى فى الشارع بيتباهــــي ببوكسره عن طريق البنطلون الواااااقع .. ده مش بيضر بالذوق العام<br />و الى بيدق وشم على ذراعه .. ده مش هيضر بالذوق العام<br />و الى ماشي يبص على بنات الناس ويعاكس فى دى و يخبط فى دى .. بدون اى رقيب بل وأحياناً يكون الرقيب متواجداً ويكتفى بجلوسه فى مدرجات الدرجة الثالثة .. و يستمتع بالمشاهدة و أذا أتيحت له الفرصة .. فسوف يتفنن فى المشاركة<br />و احنا ليه ما أتكلمناش عن جماعة الأيمو .. مع انهم مهددين لأمن البلد أكتر من السرسجية دوول<br />الأيمو .. بيئة<br />و السرسجية .. بيئة<br />بس الاسلوب الى بختلف بس<br />او دول بيئة على نظيف<br />ودول بيئة على مش نضيف"
archived = "2009-08-28"
