text = "من الجميل ان تطارد الشرطة الجناة ولكن ماذا ستتصرف معهم هل ستبرءهم بحجة انهم مختلين عقليا كما فعلت من قبل والسبب فى حدوث مثل هذه الحوادث هو الامن لانه لاياخذ موقف حازم مع الجناة فى كل مرة لانه لو وجد تشديد لما كانوا يفعلون هذا مرة اخرى ولكن الله يدافع عنا ولو الحماية لم تكن من عند الله فنحن غير محتاجين لحمايتكم المزيفة"
