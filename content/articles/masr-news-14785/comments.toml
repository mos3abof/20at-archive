posted = "2010-01-07"
text = "المشكلة هى فى القضاء البطىء والممل<br />لو كان القاضى حكم بسرعة وخلال اسبوع على الشاب القبطى مغتصب الفتاة ونال عقابا رادعا كانت الناس هدئت واحست انها اخدت حقها<br />اما ان المتهم لم يحكم علية والموضوع يتعلق بالشرف فيبقى الناس تحس انها لازم تاخد حقها بيديها وهذا ما حصل<br />الحكومة لم تعطى الناس حقها يسبقى ياخدوا حقهم بيديهم<br />المشكلة سببها الحومة"
archived = "2010-01-20"
capture_url = "https://web.archive.org/web/20100120075646/http://www.20at.com:80/masr/news/14785-2010-01-07-14-36-58.html"

