[[comments]]
order = 0
subject = "انت راجل برنس !"
author = "البرنجي"
posted = "2006-06-24"
text = "من النادر ان الواحد يقراء لواحد بيفهم..وانت راجل برنس بصراحه..قلت كل حاجه وكلامك هادئ وممتااااز..<br />دائما ماتقدم فرق افريقيا اداء ونتائج أفضل من الفرق الآسيويه..وأري ان الخطوه الخاصه بتخفيض عدد فرق افريقيا خطوه خاطئه جدا..كلنا رأينا فرق اسياومستواها هذه البطوله والفرق بينها وبين فرق افريقيا..وعلي الأقل تأهل فريق افريقي ( غانا ) أين فرق آسيا؟؟<br />تسلم يابرنس ومستنين باقي تحليلاتك"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074418/http://worldcup2006.20at.com:80/article.php?sid=83"

[[comments]]
order = 1
subject = "افريقيا أحق بالمقعد"
author = "مواطن شريف"
posted = "2006-06-24"
text = "انا شايف انه من الازم ان مقاعد افريقيا تزيد لانه من غير العادل نلاقى منتخبات زى السعوديه وكان ممكن نلاقى البحرين هى كمان لو كانت كسبت ترينداد وتوباجو فى كاس العالم مع العلم ان فى منتخبات فى افريقيا كانت لازم توصل لكاس العالم زى الكاميرون نيجيريا والمغرب ومصر بطلة كاس العالم.<br />وديه كلها دول لو كان واحده منها وصلت لكاس العالم كانت هاتعمل مستواه حلوى."
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074418/http://worldcup2006.20at.com:80/article.php?sid=83"

[[comments]]
order = 2
subject = "حرااااااااااااااام"
author = "زى الاول"
posted = "2006-06-24"
text = "يعنى انا عاوز اعرف ازاى اسيا يكون ليها اربع مقاعد ونص وااااااااافريقيا يكون ليها خمس مقاعد<br />يعنى الدوله الى تتاهل لكاس العالم بعد ما تكسب بنجلاديش واوزبكستان والكويت واندونسيا<br />زى الدوله الى تتاهل بعد ما تكسب الكاميرون ونيجيريا والسنغال والمغرب .<br />ازااااااااااااى ديه"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074418/http://worldcup2006.20at.com:80/article.php?sid=83"

[[comments]]
order = 3
subject = "محلل كروي بارع"
author = "أيموون"
posted = "2006-06-24"
text = "تحليل رائع للنتائج والمباريات وأداء الفرق والقارات المشاركة في المونديال.<br />فعلا لم أرى تحليلا رائعا كهذا, انا كنت فاكر ان آسيا احسن الحقيقة من افريقيا في الكورة بس بتحليلك المبني على أرقام ثبت العكس ويا رب تفضل تمتعنا بتحليلاتك البارعة."
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074418/http://worldcup2006.20at.com:80/article.php?sid=83"

