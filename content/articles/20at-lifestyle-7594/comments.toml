text = "الى تتجوز وهى عندها 16سنه يبأ اترحمت من الفساد نسبيا<br />وياسلام لو اتجوزت20 واحد سنه ملتزم يربيها ويفوز بيها خصوصا ان البنت بتكبر بسرعه<br />والزواج ليس عائقا للتعليم لانهم ممكن يأخروا الخلفه<br />بس يا سلام على الراحه النفسيه والحلوه اللى وصلت اكثر من22سنه ومش راضيه تتجوز تكون غالبا معقدة نفسيا…"
