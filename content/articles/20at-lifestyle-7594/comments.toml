text = "إن الكلام الذي نشر في هذه المقالة يفتقر فعلا للدقة , أنا فتاة سورية ابلغ من العمر 24 طالبة ماجستير في القانون الدولي لا افكر الآن في الزواج حتى أن أهلي يروا أنه من الأفضل أن انهي دراستي ثم التفت للحياة الزوجية لأنه برأيهم مازلت صغيرة نسبيا على هذا القرار و الألتزام و حالتي ليست حالة استثنائية هي حالة مئات الفتيات والعائلات السورية وما تم ذكره في المقال هو فقط للعائلات المتخلفة وهي الفئة القليلة في سورية لأن سورية أكثر الدول العربية تحررا في مجال المرأة , ونسب التعليم للأناث في سورية مرتفعة عن مثيلاتها في الدول الأخرى لذلك أرجو تصحيح هذا المقال أو اعادة النظر فيه وشكرا ."
archived = "2009-11-22"
