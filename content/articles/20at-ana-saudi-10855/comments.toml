author = "من السعودية"
posted = "2009-01-01"
text = "يا أخ مسلم صاحب الرد الأول ، الهدف من الموضوع هو أن يعرف أهلنا في فلسطين وغيرها أننا في السعودية نألم لألمهم ونتمنى نصرتهم ، وأن موقف الشعب يختلف كليا عن الموقف الرسمي والحكومي ، هل المشكلة أن الموضوع أشار إلى مظاهرة وقعت في منطقة شيعية ، ليس من المنصف أطلاقا ترك لب التقرير للتركيز على نقطة جانبية .."
archived = "2010-01-05"
