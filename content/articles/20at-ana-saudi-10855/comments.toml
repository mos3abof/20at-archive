[[comments]]
order = 1
subject = ""
author = "مسلم"
posted = "2009-01-01"
text = "أنا أتعجب من هذا الموقع والقائمين عليه ، هل تفرقون بين المسلم والرافضي ، هل تفرقون بين الصادق والكاذب ام انتم ثلة من الرعاع في هذا الموقع تتلفظون بما يمر على اطراف الألسنه دون وعي ودون إدراك للأمور ، ام انتم اعداء للأمة تريدون لها الشر والدمار .<br />اولا :<br />كانت الأيام الماضية قد شهدت قمع السلطات السعودية عدة محاولات لتنظيم مظاهرات، كما حدث في القطيف (شرق السعودية)، وبرغم المنع والقمع خرجت في مدينة صفوى شرق السعودية مساء أمس الأربعاء مظاهرة تندد بما يحدث في غزة.<br />هل ما يهمك خروج الرافضة تطبل لك ، الست من فلسطين من أهل السنة والجماعة ، الست مسلما ، ماذا تستفيد من التطبيل والمظاهرات .<br />إن هذا المنهج ليس منهج نبينا ولا منهج سلفنا ، والمسلم الصادق يعلم أنكم وأمثالكم زيادة بلاء على الأمة ولا خير يرجى من وراءكم .<br />لذا هل تعلم من أكثر شباب الأمة مجاهدا في الشيشان او افغانستان او العراق انهم اسود الجزيرة أهل السنة والجماعة بل حتى في الصومال وفي كشمير ، ثم تأتينا انت واشكالك تطبل للرافضة لأنهم خرجوا في مظاهرات لاتغني ولا تسمن من جوع .<br />لكن اسفا على قوم انت منهم لازادنا الله بك ولا بأمثالك .<br />يقول ابن تيمية رحمه الله : ايما دولة أعزت الرافضة اذلها الله ، ولقد رأينا من بعضكم إعزاز لهم وذكرا لهم . لأنهم يتكلمون بما تشتهون دون عمل يذكر .<br />هل لي أن أذكر سعادتكم أنه قبل أيام قليلة من الهجوم على القطاع وغزة . أعلن حزب الله أنه استطاع أن يفشل قصف بالصواريخ لفتح الإسلام على شمال إسرائيل .<br />حزب السيد نصر يقبض على شباب اهل السنة ويمنعهم من اطلاق الصواريخ على غزة .<br />وانتم تطبلون مع من طبل وتكيلون الشتائم والسباب للجميع دون وعي ولا إدراك ، كفانا الله لاشركم بما شاء ."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105234238/http://20at.com/20at/ana-saudi/10855.html"

