text = "و الله أنا معك يا مسلم<br />رحم الله أمرءا عرف قدر نفسه و نحن العرب جميعا لسنا أهلا لإسرائيل أو الولايات المتحدة ولا حتى لولاية واحدة من الولايات المتحدة المتقدمة المتطورة المتحضرة فلا يجب الوقوف بوجه السيل أو الوقوف بوجه القطار و إلا كنت منتحرا ولا خلاف على ذلك"
