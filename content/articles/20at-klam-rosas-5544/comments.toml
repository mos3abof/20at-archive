text = "السلام عليكم في عدة نقاط عايزة اتكلم فيها بس في ملحوظة عايزة اقولها المفروض الشباب اللي بيغتصب البنات انا لأول مرة بباة معاهم وببص لهم نظرة شفقة عايزين ايه بعد ما البنات بتشوف ستار أكاديمي وميس ايجبت وميس لبانون ،لازم طبعا يقلدوا وياريت بيقلدو موضة شرعية انا بقيت اقرف بصراحة انزل الشارع يلا احنا شباب وعمتا احنا محتاجين للتغيير بس التغيير للكويس ،يلا حنعمل ايه غير ربنا يهدينا كلنا..<br />أما بالنسبة للموضوع اللي كتبه الاستاذ محمود انا من رايي تعملوا ملف خاص بالقنوات الفضائية تعرضو فيه السلبيات والايجابيات ونقد وتحليل اللي بيتعرض أما عن المقال والي جه فيها<br />أولا:الاستاذة سحر بيلي بتقول بالنص (ان القناة ستكون الاعتماد على الحرية الى اقصى درجة والتي قد تصل الى حد اغلاق القناة)كلنا عارفين أن القناة التجارية اينا كانت همها الأول والاخير هو انها تفضل مفتوحة عشان تجيب فلوس تتقال كلمة (الحرية الى حد قد تصل الى حد اغلاق القناة) اذا كانت تسعى لهدف معين ؟فهل تسعى otvالى هدف معين؟؟اما عن الجزء التاني من النص اللي قالتو (الى انه لن يسمح بأي هجوم عليها سواء من الدولة أو من اي قوى رجعية) معلش ما المقصود بالقوى الرجعية؟ماشي ،وبعدين ليه ؟ممكن نعرف ؟ده احنا حتى في دولة ديموقراطية زي ما بيقولو ،ويعني ايه برضو مش حتسمح ؟هو في حد باة في الزمن ده يمسك حد من لسانو عشان ميتكلمش ولا حد من ايدو عشان ميكتبش ولا ايه؟؟؟!<br />ثانيا:ودي نكتة جامدة معلش سامحوني وهي ان الفيلم سيعرض بليل un_cutوحيتعرض في الاعادة cutالصبح بصراحة لا تعليق غير ان القناة بتحب جمهورها طيب واللي عندو كورس بليل ومحاضرة الصبح يعمل ايه؟<br />ثالثا:انا ضم صوتي لصوت الاستاذ الدكتور المحترم علي عجوة ..مع جزيل الشكر ليه<br />رابعا:اشارت الاستاذة سحر (الى ان otvشبابية بالدرجة الاولى وانها ليست موجهة للاسرة وان القناة متحررة من اي ضغوط وغير خاضعة لأي شروط مجتمعية)ماشي يا استاذة فيه حاجة اسمها شروط اخلاقية واحنا الحمد الله لغاية النهاردة فيه بصيص من نور من الاخلاق واننا في مجتمع اسلامي مش علماني مش منفتح للدرجة دي وحتى ان كان المجتمع اسمحولي اقول لفظ مجروح اخلاقيا واجتماعية لكن منجيش نزود الجرح ..<br />خامسا:GO A HEADيا جامعة الدول ياريت نسمع ده قريب جداااا ان يبقى في نمط تشريعي للفضاء العربي..<br />سادسا:بصراحة عجز عقلي عن التفكير ويدي وقلمي عن الكتابة ولساني عن الحديث عما نعيشه من اباحية علنية ودون وجود اي رقيب بالرغم من ان الرقيب الاول هو الاسرة وان غابت فهي الرقابة الفضائية،بجد مش لاقية كلام اقولو غير حسبي الله ونعم الوكيل وان لله وانا اليه راجعون وارحموا من في الارض يرحمكم من في السماء…"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110082328/http://www.20at.com:80/20at/arts/5544.html"

[[comments]]
