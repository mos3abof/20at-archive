posted = "2007-05-05"
text = "الواد السعودى اللذيذ بيحاول يبرا بلدة وزعلان وبيقول لية ؟<br />احية<br />امل ياولد الجمعيات المشبوهة اللى عندكم دى بتمول مين ؟<br />دة مش كلامى دة كلام جريدة الشرق الاوسط السعودية اللى قالت ان 85 % من الجمعيات الخيرية السعودية بتمول الجماعات المتطرفة فى الوطن العربى بعد تشديد الرقابية عليها من تحويل عملات لافغانستان<br />يابنى انا سمعت واحد شيخ فرد خطبة طويلة عن عدم جواز لبس البنطلون للنساء ووصل لحد البدعة والتكفير<br />عاوز اية تانى ؟ انتم يابنى سبب ومنبع الفكر المنحرف المخلوط بالاسلام المنزهة عن اى نقص"
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715125946/http://www.20at.com:80/20at/klam-rosas/5544.html"

