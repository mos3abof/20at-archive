text = "الشيخ كشك رحمه الله كان يسمي الأشياء باسمها مثلا التلفاز المفسديون , وسائل الاعلام وسائل الإعدام وهكذا وطبعا مش هيعجب الفاسقين لكن الله يرحمه مات وهو ساجد اما هؤلاء فليتوبوا ويقفلوا قنواتهم قبل ما يموتوا وهم يشاهدوا فيلم من أفلام ايناس الدغيدي أو يوسف شاهين أو فلم اجنبي un-cut عاوزين البلد تولع الشباب لا يجد عمل يمتص طاقته ولا مال يتزوج ولا هم له الا قضاء فراغه أمام الشاشات … حراااااااام عليكم بدل ما تعملوا قناة للشيطان شوفو لهم شغلة ولا أي نشاط موجه!! حسبنا الله ونعم الوكيل"
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715125946/http://www.20at.com:80/20at/klam-rosas/5544.html"
