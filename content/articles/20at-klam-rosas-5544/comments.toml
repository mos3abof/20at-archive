author = "معد برامج هناك"
posted = "2007-04-26"
text = "هو ليه احنا نقعد نقول عايزين حريه حريه وبعد كده لما تيجي نزعل .. عادي يا جماعه مصر بلد التناقض<br />وكون ان السيد المحرر مع احترامي ليه مهنته [ *** ]حفي جميل لا اني احب اقوله لو هتعمل ريبروت تاني عن الموضوع ابقي هات الكويس والوحش زي ما قال الجميل مواطن مصري مسلم \" فعلا احنا كده اثبتنا لنفسنا اننا شعب غير قابل للتطوير<br />وعلي راي المثل \" في الهايفه وبنتصدر \" تقريبا لو حد وصل لاقرب سينما دلوقت وشاف فيلم Perfume هيحزن اكيد انه الرقابه ضيعت اهم واقوي المشاهد فيه ومنعتك ك شاب تتفرج علي روعه الصوره بعيد عن المضمون الجنسي ف المشهد ولما تروح ف البيت هتستمتع بيه احسن لما تجيبه دي في دي Un cut بس المثل كده وضح<br />الموضوع مش فيلم جنسي ومش قناه<br />الموضوع نتعلم ناخد اللي احنا عايزينه او لو مش هنعرف نعمل كده يبقي مالوش لازمه نتعلم او نتثقف اصلا .."
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715125946/http://www.20at.com:80/20at/klam-rosas/5544.html"

[[comments]]
