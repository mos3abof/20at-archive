subject = ""
author = "اة يادماغى"
posted = "2007-04-27"
text = "ياجماعة الشيخ ماهر عقل معاة كل الحق فى اللى قالة ماهو طول عمرة اتربى على كدة اول لما واحد يعمل حاجة وحشة يجرى على البرلمان طب ياعم ماهر مالخمور من 50 سنة بتتباع فى فنادق الخمس نجوم انتا فين من الكلام دة ياحج ماهر العاهرات فى القاهرة بقوا برخصة حتى السياخ الخليجيين لاسيما السعوديين بقوا بينزلوا مخصوص هوا انتا فى غيبوبة طب ياحاج ماهر اخبار كلاب الامير ترك اللى بهدلت كرامة المصريين اية ؟ مافيش<br />الحاج ماهر عاوز يخبى الحقيقة بس<br />مصر وكل الشعوب العربية عاوزين يمثلوا انهم مسلمين الكل بيصلى الكل بيصوم لمايشوفوا مشهد خارج يبقى اعوز باللة<br />لكن فى الخباثة كل تمام ؟ فوقوا بقى يابشر ارحموا الاجيال الجديدة اى قدوة انتا بتعطيهالهم<br />وبعدين كلمة فى ودنك ياحاج ماهر ماهو الاسلام بينتشر فى امريكا بالرغم من انها ام الاباحية بس اية مسلمين امريكا احسن بكتير من العرب عارفين لية لان الرزيلة قدامة وهوا اختار الحق فهمت ياحاج ماهر ؟ اشك وضب لحيتك ياحاج ويالا نلحق العصر"
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715125946/http://www.20at.com:80/20at/klam-rosas/5544.html"

