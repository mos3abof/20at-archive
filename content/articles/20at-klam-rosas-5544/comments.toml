text = "و الله الانسه اللى بتقول احنا بنكلم الشباب بلغتهم احب اقوللها لغه ايه حضرتك<br />مين قال ان لغه الشباب بقت الجنسيه الواضحه دى<br />لسه موصلناش لكده و الله<br />و يوم ما نوصل لكده يبقى القيامه تقوم احسن<br />حاجه تقرف"
