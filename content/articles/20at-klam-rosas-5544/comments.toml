author = "مواطن مصرى مسلم"
posted = "2007-04-22"
text = "بصوا ياجماعة انا مصرى ومسلم ومؤكد مش حشوف الافلام دى بتاعت الotvلكن الحقيقة الامر يتعدى مجرد مشاهد جنسية زى مانتوا قلتوا الحكاية ببساطة ان فية مجموعة من النس مبسوطة جدا لعرض اغانى ماجنة بتتلوى فيها البنات بطريقة عاهرة وعندهمشى مانع ان تكون فية قنوات لنشر الخرافات بين الناس زى قنوات الطالع وعندهمشى مانع من احتكار قنوات عربية لمصدر الترفية البسيط للمصريين ومنعهم من مباريات الكرة المحببة ليهم ومعندهمش مانع من انتشار قنوات تمجد فى عمل الارهابيين اللى بيببرروا موت الناس فى العراق باسم الدين وعندهمشى مانع من قنوات قلبت انتصارنا فى 6 اكتوبر لهزيمة واظهار المصريين بالمظهر الهمجى المتخلف فى جميع الاوقات …<br />لكن عنهم مانع ان قناة مصرية يملكها واحد مسيحى<br />لمجرد ان الراجل دة متحرر من قيود الدول البترووهابية وعلشان كدة طلقوا كلابهم علية<br />القناة دى فيها برنامج يبقى انتا كيد فى مصر بيتكلم عن سلبياتنا وفيها برنامج حبة عسيلى بيتكلم عن تطوير افكارنا وطموحاتنا علشان نبقا مجتمع قوى وفيها برنامج كونتاكت بيتكلم عن الكومبيوتر ومع الاسف كل المقالة دى عن فيلم ممكن تشوفة او ممكن تغير المحطة لو مش عاجبك<br />انا عارف انها مؤامرة على مصر ومدفوعة الاجر من شيوخ البترووهابية علشان عقد النقص عندهم ومحاولة انهم يبقوا احسن من المصريين ومع الاسف بيشاركهم شوية ناس معدومين الضمير كل اللى عندهم لحية طويلة وبنطلون قصير لكن جوهر الدين … انسى<br />انا حتفرج على القناة دى مش حشوف الافلام لكن انا مع كل حاجة مصرى ترفع بلدى وتنبهم كفاية بقى بقى قنوات الافلام الساقطة والاغانى الماجنة اللى محدش بيتكلم عليها وسلملى على مسابقة ملكات جمال لبنان بتاعت الل بى سى وصاحبها الوليد بن طلال"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110082328/http://www.20at.com:80/20at/arts/5544.html"

