author = "ادم"
posted = "2008-01-05"
text = "الناس الي بيقولو ( انا حر ) مضطر اسفا اقولك الحقيقه المره الحقيقه الي لازم تكون واضحه قدام عنيك<br />وهي ان انت مش حر مفيش حاجه في الدنيا وفي أي مكان وفي أي بلد حاجه اسمها حريه مطلقه كل مكان وليه قوانينه<br />ودستوره وحدود الي لا يمكن حد يقدر يخرج منها.<br />الي بيتكلم عن الحريه شوف حضرتك احسن بلد في نظرك بطبق الحريه وروح اخرج عن قانون من قوانينهم شوف حيحصلك أي .<br />احنا بقا مش احرار لمؤاخذه في شريعه بتحكمنا في احكام الاهيه ملزمين بيها ( بعد ازنك انا موجهتلكش الكلام انا بقول في شريعه بتحكمنا واظن ان انت متفهمش يعني أي شريعه ) انا كلامي يا جماعه موجهه للمسلمين المسلمين الي قالو لا اله الا الله محمد رسول الله .. ( طبعا الكلام ده مش ليك انت كمان لاني اشك انك عارف معني الجمله دي او مقتضاها أي انا كلامي للمسلمين حقا مش المنافقين )<br />نداء الي كل مسلم مؤمن بيحب الله وبيحب رسوله صلي الله عليه وسلم وبيحب دينه انه يقاطع القناه الاباحيه دي<br />الي هدفها باين زي طلعت الشمس مفيش حد يقول انا حر المؤمن مش حر المسلم المؤمن ميتحركش ولا يتكلم الا بي دليل قال الله وقاله رسول الله صلي الله عليه وسلم .<br />قال الله تعالي ( يا ايها الذين امنوا اتقوا الله حق تقاته ولا تموتن الا وانتم مسلمون ) 102 ال عمران"
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715125946/http://www.20at.com:80/20at/klam-rosas/5544.html"

