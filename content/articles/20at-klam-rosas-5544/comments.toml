subject = ""
author = "شرين منصور"
posted = "2007-04-23"
text = "السلام عليكم اولا ايه يا برنس مصر الكلام اللي بتقولو ده انا الحمد الله ليا كبير وهو عقلي وقلمي يا برنس واللي شايفاه وواللي مقتنعة بيه بقولو وكمان سمتني بنت الايه هههههههه ماشي ثانيا اللي بعتلي وبيقولي ان بتاع صوت الامة شتمني وهزقني خالص معلش انا عمري ما حرد على الاسلوب اللي بيتكلم بيه متهيألي انا اسلوبي في النقد باين جدا ولا انت شايف ايه وهو شايفني اداب اعلام وانا فعلا رديت عليه وقولت ان بتاعت اداب اعلام مش بترد بنفس اسلوب خريج الاعلام ،المهم من ده كلو انا حبيت أوضح حاجة للمقال وللاستاذ اللي كاتب المقال الحاجة دي استوقفتني جدااا كنت بقلب القنوات ولقيت قناة otvوفيها اعلان ان كل يوم فيه افلام أجنبية وبيقولو احنا مستمرين في عرض الافلام انا عايزة افهم هو تحدي ولا ايه؟ ثانيا انا اتفرجت على صباحك سكر زيادة ،هي الاستاذة سحر البيلي قالت ان القناة موجهة للشباب مش للاسرة امال البرنامج ده وبررنامج مسائك سكر زيادة موجهين لمين مهو للاسرة من الدرجة الاولى ،المهم انا اتفرجت وحللت المواضيع بصوا باة في فقرة ثابتة اسبوعيا عن تعليم او تدريس مش لاقية كلمة بصراحة المهم عن الرقص الشرقي والمضحك في الموضوع ان المدربة اجنبية هو احنا خلاص معدش في مصر راقصات مصريات دي مصر ولادة ،طيب ودي موجهة للشباب مع التحفظ على الفقرة دي طبعا، المهم كانوا جايبين موضوع الثانوية العامة والجداول بتاعتها وانفراد ال otvفي نشر جدول الامتحانات متهيألي ان الموضوع ده حيهتم بيه أولياء الامور في المقام الاول مش الشباب وبعدين ده بيتعرض الصبح والشباب في الوقت ده يا نايم يا في كليتو يا مدرستو المهم اللي عايزة اقولو ان زي ما هي موجهة للشباب هي برضو موجهة للاسرة واتفرجوا على البرامج دي وشوفو لو كلامي صح ولا غلط .في حاجة مش واضحة هلى هي موجهة للشباب ولا لاسرة مش عارفة؟.واضح ان الموضوع ده كبير جداا وياريت نقرا متابعة لما يعرض على شاشتنا العربية وبالاخص المصرية لأن هدفنا الاول والاخير هو تعرية الجروح لكي نداويها لا اكثر ولا اقل ،وانا على ما اعتقد ان الشباب حيفضوا نفسهم الساعة 10 عشان يشوفوا الافلامun cut"
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715125946/http://www.20at.com:80/20at/klam-rosas/5544.html"

