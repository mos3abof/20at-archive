subject = ""
author = "أسامة عمر"
posted = "2007-04-22"
text = "أولا بجد برسل كل التحية لشرين منصور وبجد رأيك عجبني جدا فكرتيني بأسم برنامج للأستاذ عمرو خالد وهوا متاخد من ايه في القرآن \" حتي يغيروا ما بأنفسهم\" والله والله ياجماعه لو كل واحد فينا حاول انه يصلح من نفسه وبعد كده يوسع دايرة اهتمامه شويه شويه يصلح من اخواته ومن بيته ومن اصحابه ومن بلده الدنيا بجد هتتغير وهيبأه لينا فكر وعندنا مباديء يصعب علي اي حد انه يغيرها او ينجح انه يلعب في عقولنا ربنا اعلم بكل واحد فينا بيفكر ازاي وهو اعلم بسويرس ان كان نيته هو تخريب عقولنا ولا بيتصرف بسذاجه واكيد ربنا هيخليه يشرب من نفس الكاس لأن الجزاء من جنس العمل مسير يكون له ابن او بنت ويشوفوا المشاهد دي بأسم حرية ابوهم<br />كل واحد فينا يقاطع القناه يبعت ايميل للقناه او جواب ليهم بأسلوب شيك تقوله احنا كنا مستنين افتتاح القناه دي من اول ماسمعنا عنها وتوقعنا انها هتفيدنا وهتكون بتحترم عقولنا وتساعدنا علي حل مشاكلنا لكن مع كل اسف لاقينا فيه مواد بتتذاع عليها ماتتفقش لا مع ديني ولا مبادئي فقررنا اننا نشفر القناه ونقاطع مشاهدتا انا وكل زملائي وده لحد ماربنا يهدي القائمين عليها والله ياجماعه الكلام ده بيجيب نتيجه لأن القناه مفتوحه عشان تتشاف مش عشان الناس تقاطعها لو كلنا عملنا كده انتوا بنفسكوا هتشوفوا النتيجه<br />أتمني تكون كلمتي وصلت ليكم وانا سعيد بكل ارائكم بجد وربنا يهدي الجميع"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110082328/http://www.20at.com:80/20at/arts/5544.html"

