text = "الاخ مسلم مصرى يبدوا ان كلامى جة على الجرح<br />1- لو انتا مسلم يبقى لازم تكون محترم ولا قلة الادب دى تعود ؟<br />2- مش غير متناقشنى انتا شتمت وخلاص لمجرد ان كلامى مش على هواك بصوا ياجماعة دول الاخوة البترووهابيين ودى ديمقراطيتهم<br />3- انك تكون غير محترم دى مشكلتك لكن جاهل ؟ كتير بصراحة لان داروين بيقول الانسان اصلة قرد مش حمار ؟ يا… بنى ادم<br />على فكرة ابلى دى تنكتب كدة قبلى"
