text = "السلام عليكم يا جماعة انا زيي زي اي حد بيعلق بيقول رايو وانا كدة مش بقول لحد اتفرج على ده ومش اتفرج على ده كل واحد رقيب نفسو والاهم انا مليش صفة اقول بس اقول ان كل واحد يفتكر ان عنيه دي هيتحاسب عليها يوم القيامة واحنا مش بنشتغل واعظين احنا بنحاول مجرد المحاولة يا تفشل يا تنجح في تعرية الجروح الاخلاقية اللي بيعاني منها المجتمع وبنحاول اننا نقول رسالة اننا مجتمع شرقي من الدرجة الاولى قائم على اساس ديني سواء اسلامي او مسيحي ،على العموم القناة موجودة واللي عايز يتفرج يتفرج انا مجرد بقول راي،وياريت لما حد يحب يعلق يعلق من غير تجريح متهيالي ان الموقع مش بيجبر حد على حاجة هو مجرد ناقل لوضع معين انا فيه كتير من لتعليقات الموجودة متطاولة سواء على اللي بيعلقوا او حتى على اللي بيكتبوا المقالات ياريت يا عشرينات تلاقو حل ..وميرسي جدااا يا مجدي على العموم انا اللي يهمني ان في ناس من اللي بيعلقوا مع كاتب المقال ومع اللي بيعلقو .."
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715125946/http://www.20at.com:80/20at/klam-rosas/5544.html"

