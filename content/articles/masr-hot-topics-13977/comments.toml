[[comments]]
order = 2
subject = ""
author = "دبى فيها ضابطات"
posted = "2009-11-09"
text = "اولا الصورة فيها دلع<br />التحية العسكرية بتاع البنت مش صح اصابع اليد مضمومة وامام الحاجب ب 2 بوصة من الامام ولكن فى الصورة صوابعها عند اذينها ودى اسمها رقاعة عسكرية<br />مفيش صف ضابط معلم يعلمها العسكرية الصح زى ما تعلمناها زمان اثناء التجنيد<br />وبعدين بتلاقى فى الدول العربية زى الامارات ضابطات شرطة فى المطار وفى مراكز الشرطة للتعامل مع الستات والحريم وسجون الحريم ومحترمات جدا واخلاقهم عالية<br />وعلى فكرة مرة ضابط فى قطر ضرب مسجون بالقلم على وشة فتمت محاكمة الضابط وطرد من الخدمة<br />الدول دى اللى تاريخها كلة كدولة لا يزيد عن 40 سنة محترمة جدا<br />انما احنا عندنا سبعة الاف سنة حقارة"
archived = "2009-11-11"
capture_url = "https://web.archive.org/web/20091111194639/http://www.20at.com:80/masr/hot-topics/13977-2009-11-09-15-36-05.html"

[[comments]]
order = 3
subject = ""
author = "عمرو الطوخى"
posted = "2009-11-09"
text = "والله دى تبقى ارحم بكتير من الرجالة على الأقل لما واحد يروح يقدم بلاغ اويعمل محضر هيتعمل بشياكة مشزى الحكاية دى .واحد اتنصب عليه عن طريق النت فراح القسم علشان يبلغ فحضرات البشوات االمساعدين اللى هما فاكرين نفسهم كل واحد بقى حكمدار العاصمة وهما اصلا مخبرين قعدوا بقى يتريقواعلية واللى يقولوا وهوالفلوس دى تبقى حلال ولاحرام واللى وهودى قضية تستاهل وفضل الضحية صاحب الحق يجاوب اسئلة تافهة مالهاش دخل فى الموضوع او اى علاقة بالقضية لحد مانسى هورايح ليه فواحد من البشوات المخبرين قالة مفيش محضر يتعمل وان كلامك دا قولنا للظابط وهو قال ماتعملش كدا تانى واتفضل روح بدل مانحبسك فخرج من القسم وهو مذهول لدرجة انه راح بعدها ب13 يوم مستشفى الأمراض النفسية بالعباسية اللى الناس بتسميها مستشفى المجانين او الخانكة بعدما خسر كل فلوسة واللى كانتتقدر ب280 الف دولار فى الحكاية دى وضاعحقة بسبب حبة بشوات من المخبرين"
archived = "2009-11-11"
capture_url = "https://web.archive.org/web/20091111194639/http://www.20at.com:80/masr/hot-topics/13977-2009-11-09-15-36-05.html"

