text = "طب ياريت ..<br />ده أحنا هنلاقى الشباب هتروح لغاية عندها وتقولها .. ممش عايزة تشوفي بطاقتى يا حضرة الظابطة .<br />وياسلام لو موزة بقى … هتلاقى الشباب هارينها تلقيح كلام ومعاكسات .. لإن كونها ست فده بيعمل صورة ذهنية عند الواحد بانها ضعيفة … وهى مش كدة وممكن تضرب 100 زيه .. بس للأسف هى دى الصورة الذهنية ."
