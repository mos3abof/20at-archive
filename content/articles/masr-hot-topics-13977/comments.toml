subject = ""
author = "علي جمعة"
posted = "2009-11-10"
text = "طيب ما ممكن البنت اللي حصل معاها الفعل ده تقول لحضرتك اللي حصل وتوصفلك اماكن التحرش وانتى بتكتبي ده في المحضر يعني وكيل النيابة هيشوف الكلام ده وهو مكتوب علي الورق واكيد القاضي واكيد اهلها والمحامي بتاعها وكل الناس اللي بتعرفهم واللي انتي ما كونتيش عايزه ان هما يعرفو حاجة عن المو ضوع دلوقتي الفضيحة بئت بجلاجل<br />تاني هام :- انتى كدة عايزة يبقي في عسكري ست او بنت زيك وعايزه وكيل نيابة من الجنس الناعم وعايزه وعايزة كمان القاضي يكون من الجنس الناعم صح كدة بصراحة فكرة مش كويس بالنسبة ليكي ولو نجحتى يبقى حلمك اتحقق"
archived = "2009-11-11"
