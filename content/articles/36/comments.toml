text = "لا شك أن العلاقة بين الرجل والمراة علاقة قدسها الله سبحانه وتعالى وعندما تذكر في القرآن لا تذكر صراحة بهذا اللفظ المشين وأنما تذكر بمعاني أخري ، فتارة وطرأ ، وملامسة وهكذا من المعاني التي تألفها الأذن ، وأن مثل هذا السؤال المطروح ليس القصد منه الاجابة وتثقيف الناس أنما القصد منه فرح باب من الشر وتنبيه الشباب الى ما يهدم الدين ، ولا شك أن هؤلاء هم أعداء الدين ، فالاسلام لم يترك لا شراردة ولاورادة الى علمنا أياها فلماذا يريد هولاء الأجابة على هذا السؤال الآن ؟ ولكن أنها لحاجة في نفس يعقوب . نسال الله لهم الهداية ."
