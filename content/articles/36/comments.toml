subject = "الجنس المشاعر الاحساس الرومنسية ؟؟؟؟؟"
text = "اسمحو لى ان اشارككم الراى فى هذا الموضوع 00<br />الجنس غريزة داخل الانسان كما المشاعر والرومنسية هى من صنع الله عز وجل<br />لماذا نخجل من مشاعرنا فى هذا الاتجاه ولا نخجل من غيرة<br />لاكن نحن العرب لنا تقاليدنا الجميلة العفيفة<br />ولاكن كثرة التفكير فى الغرب ودول اوربا هى التى تحثنا على ثقافة الجنس فى حين ان الانسان لو تعامل بمشاعرة فى هذا الاتجاه بالفطرة سيكون اسعد الناس جميعا<br />لو تخلينا عن التقليد الاعمى المبثوث من الدول الخارجية<br />التى لاتجد حرج فى اباحة الجنس العام والصداقة الحميمة<br />ايتها السيدة العربية ايتها البنت العربية كونى الحبيبة والزوجة والعشيقة لزوجها لا تحجرى على مشاعرك مع زوجك ولا انت ايها الزوج لاداعى للحرج من زوجتك ستكون اسعد الازواج وهى كمان ستسعد بك وشكرا<br />احمد اسكندرية"
archived = "2005-01-22"
capture_url = "https://web.archive.org/web/20050122092536/http://www.20at.com:80/article.php?sid=86"

