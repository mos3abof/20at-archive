text = "الجنس شىء ضروري للبشر مثل الماء و الهواء ولاكن اصبح فى هذا العصرالوجبه الرئيسيه التى يتكلم بها<br />البشر فى كل الوقت وهو حديث المجالس يبدء المجلس به<br />وينتهى به.وهذا ما خطط له الصهاينه للمسلمين بجميع<br />مذاهبهم و طوئفهم كى يغرقهم فى شهواتهم وملذاتهم.<br />لقد نجحوواستطاعوان يغرقوننافى مستنقع الرذيله بطرق<br />ذكيه و بسيطه كا المسجات وغيرها التى لا تعد ولا تحصى<br />فكرو وتذكرو وصايا الرسول(ص)من الحذر من اليهود"
