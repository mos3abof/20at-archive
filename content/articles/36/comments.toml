subject = "ليه كده يا جماعه"
text = "يا جماعه مش كده الجنس حاجة طبيعيه زي الاكل والشرب رغبه من رغبات الانسان مع احترامي لاراء الشباب بس هما اخدو الموضوع هزار وقله ادب الموضوع فعلا كبير في ستات كتير بتطلق عشان اجوازهم مش بيشبعوا رغباتهم والسبب في كده جهلهم بالجنس مش عيب اننا نتكلم في الموضوع ده على النت عشان نستفيد كلنا زي ما في مواقع عشان تعلمك الرجيم والاكل الصحي برضو دي اراء ومقالات عشان تعلمكم الجنس الصح الجنس الانساني مش الحيواني بس المشكله ان الموضوع اخد مساحه كبيرة في حياتنا وبقينا نفكر فيه اكتر ما بنفكر في حجات اهم بس يمكن الشعوب المتطورة اغلبها مش بيفكر في الجنس لان الموضوع ده عندهم مباح جدا وبيمارسوا بشكل عادي من غير جواز بس مكتمعنا العربي ومش هقول الاسلامي لاني المجتمع العربي هوه إلى حط للموضوع غموض كبير لاكن المجتمع الاسلامي ايام سيدنا محمد عليه الصلاه والسلام مكنش الموضوع مشكلهم ازمه كبيره لان سيدنا محمد كان بيكلم فيه مع الصحابه من غير خجل وكان بيعلمهم لاكن مشكلتنا دلوقتي الاب مشغول والام مكسوفه ومحدش عاوز يفهمنا حاجة وغالبا لو فهمت حاجة منهم حجات كتير هتكون غلط عشان هما اصلا في حجات كتير مش فاهمنها فدي بصراحه فرصه كويسه اننا نفهم من ناس مثقفه بادب واحترام وداخل حدود الدين من غير قله ادب والفاظ ملهاش لازمه في التعليقات وشكرا على الموضوع المفيد<br />سلااااااااااااااااااااام"
