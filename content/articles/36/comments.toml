[[comments]]
order = 94
subject = "1000 دمعه"
text = "صحوة من ســــُــكار الحب<br />من المحبين من هجر الحب المحرم واتصل بالحب الشرعي الطاهر العفيف .. فانتقل من عالم الزور ودنيا الهيام وظلام الغرام ومقام الآثام ..<br />إلى جنة الصدق وروضة المعرفة وبستان اليقين .. وباحة الإيمان ..<br />فهذا ابن أبي مرثد .. هام قبل ان يسلم بفتاة وعشقها وسكب عمره في كأس هواها .. فلما هداه الله وغسل قلبه من ادران الهوان واوصار المعصية .. أفاق والله من رقدة الغفلة ومن سكرة الغي على صوت بلال فارتجف جسمه وتهذبت روحه واعلن في إباء وصاح في استعلاء :<br />أتوب إليك يا رب ..<br />وأقبل على المصحف .. وهب إلى المسجد .. واستعان بالصبر والصلاة .. وأدمن الذكر .. وسجل رائعة الخلود وسفر النجاة ودفتر المجد :<br />برقيات إلى الأحبة<br />الحب على المحبين فرض .. وبه قامت السموات والأرض .. من لم يدخل جنة الحب .. لن ينال القرب .. بالحب عُــبد الرب .. وتــُــرك الذنب .. وهان الخطب ..<br />عقل بلا حب لا يفكر .. وعين بلا حب لاتبصر .. وسماء بلا حب لاتمطر .. وروض بلا حب لا يزهر وسفينة بلا حب لاتبحر ..<br />بالحب تتآلف المجرة وبالحب تدوم المسرة وبالحب ترتسم على الثغر البسمة وتشدو الطيور يالنغمة أرض بلا حب صحراء وحديقة بلا حب جرداء ومقله بلا حب عمياء وأذن بلا حب صماء ..<br />الحب هو بساط القربى بين الأحباب وهو سياج المودة بين الأصحاب :<br />شكا ألم الفراق الناس قبلي .. ورُوع بالنوى حي وميت ..<br />وأما مثل ما ضمت ضلوعي .. فإني ما سمعت ولا رأيت ..<br />بيت لايقوم على الحب مهدوم .. جيش لايحمل الحب مهزوم .. لكن أعظم الحب وأجله ماجاءت به الملة .. أجمل كلمة في الحب قول الرب ( يحبهم ويحبونه ) فلا تطلب حباً دونه ..<br />ليس حبا قطعة معزوفة .. من يراع الشاعر المنتحب ..<br />ما (قفا نبكي ) هو الحب ولا .. ظبية البان وذكرى زينب ..<br />إنما الحب دم تنزفه .. في سبيل الله خير القرب ..<br />أو دموع ثرة تبعثها .. سحرا أصدق من قلب الصبي ..<br />أو سجود خاشع ترسمه .. فوق خد الطين فاسجد وأقرب ..<br />وإن تعجب فعجب أن ترى شاعرا بائسا يشكو طللا دارسا .. فهو يبكي من نار الغرام .. ويشكو ألم الهيام .. ولو سافرت روحه في عالم الملكوت لصار حبه عنده كالقوت<br />ولو أدرك عنترة الإسلام ماكبا .. وما قال : اذكري ياعبل أيام الصبا ..<br />نحن الذين ملأنا جونا كرما .. وقد بعثنا على قرآننا أمما .."
archived = "2005-01-22"
capture_url = "https://web.archive.org/web/20050122092536/http://www.20at.com:80/article.php?sid=86"

