text = "السلام عليكم ورحمة الله وبركاته<br />ايه الجمال ده ** كل يوم 20atتعمل موضوع جديد<br />الغش حلال ممكن عند ناس<br />لكن الى انا عايز اوصله ان العلم ده رزق<br />ولازم من كل واحد منا يفهم ان :<br />الرزق مقسوم ولكن العمل له واجب.... يجب ان نعمل مش ايام الامتحانات بس لكن فى كل ايام الترم<br />لانى بجد كنت البارحة فى الامتحان<br />ولا حولا ولا قوة الا بالله<br />الطلبة مطلعين الكتاب وشغالين الله يسامحهم<br />واحنا بنشد فى شعرنا<br />اقولها ثانية<br />ارزق مقسوم ولكن العمل له واجـــــــــــــب<br />ابو انس"
