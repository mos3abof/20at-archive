[[comments]]
order = 73
subject = "حسبى الله و نعم الوكيل"
text = "موقعكم أسوأ مثل للإخوان<br />موقعكم لو مش وخدين بالكم بيدمج ما هو غير شرعي و بيلبسه عباءة الأسلام<br />ممكن تكون نوياكم صافيه و جيدة بس ياريت تستعينوا بحد من العلماء أو الدعاة أو من الدعاة المصريين زى الشيخ صفوت أو استاذ عمرو خالد أو عالم من علماء الأزهر أو أى حد فاهم تعرضوا عليه محتويات الموقع قبل نزولها<br />انتم معكم واجهة اعلاميه لو نشرتم بيها اللى يرضى ربناهيكون لكم مثل الأجر و إن نشرتم و لو بنوايا صافية أو بجهل - ما ينافى الكتاب و السنة فلكم أيضا مثل الأجر<br />جميل إن الأسلام يبقى فيه سينما و فن و منوعات بس مفهوش طبطبة و لا تعالى على الأسلام عشان الناس تحبه<br />يقول الله تعالى :<br />وقل الحق من ربكم فمن شاء فليؤمن و من شاء فليكفر<br />الكهف<br />للأسف موقعكم لا يعلم الناس الخير<br />يعلم الله الذي هو عليم بذات الصدور أنى لم أكتب حرفا و احدا إلا للنصيحة مصداقا لقول رسول الله صلى الله عليه و سلم : الدين النصيحة<br />و من منطلق غيرتى على الأسلام خاصة أن ذلك يصاغ و كأنه هو الإسلام<br />قال بن سيرين<br />إن هذا العلم دين ... فأنظروا عمن تأخذون دينكم"
archived = "2005-01-22"
capture_url = "https://web.archive.org/web/20050122092536/http://www.20at.com:80/article.php?sid=86"

