subject = "موقع الأحباش المشبوه ضد عمرو خالد"
text = "للعلم فقط يا شباب! الموقع الذي يهاجم الأستاذ عمرو خالد هو موقع تابع لجماعة الأحباش التكفيرية المشبوهة التي تدعي أنها أهل السنة والجماعة ، والسنة منها براء . وهي طائفة منتشرة بكثرة في لبنان ومنها امتدت إلى سائر أنحاء الكرة الأرضية يدعمها أعداء الإسلام . وتهدف إلى تمييع الدين بالفتاوى المنكرة ، وإلى التفريق بين المسلمين ، وقد قامت بتكفير عدد كبير من العلماء والدعاة ، وذلك باقتباس عبارات كتبوها ، بعد أن تخرجها عن سياقها ، فكفّرت مثلاً الأخ عمرو خالد ، وتنال من الشيخ القرضاوي حفظه الله ، ومن القدماء الشيخ ابن تيمية رحمه الله ، ومن المعاصرين الشيخ رجب ديب ، وغيرهم كثير ."
archived = "2005-01-22"
