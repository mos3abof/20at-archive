[[comments]]
order = 10
subject = "الشمحطجى- مصر المحروسة"
text = "اولاً:انا لامواخزة قريت كل الرسائل اللى اتبعتت ليكو و حاسس انها و لاموأخزة فى الكلمة انها فالصو يعنى متفبركة ولّى فبركها واحد مش فنان فى اصول الفبركة و لو عايز يتعلمها يراسلنى على الميل بتاعى.... ده<br />ثانياً: لغة الخطاب اللى بيتكلم بيه الدكتور ( و لاونى اشك فيه انه دكتور ) لاموأخزة لغة ركيكة و تساعد على ان الشباب انه يحاول يجرب كل العادات الوحشة الى اشار ليها فى كلامه و المفروض انه واحد عايز يصلح<br />ثالثاً المفترض انه دكتور و على حد علمى فى الطب انه مافيش حاجة اسمها عجز جنسى و الاصح القول ضعف جنسى ... لازم نراعى شعور الزملاء<br />و لاموأخزة"
archived = "2004-04-23"
capture_url = "https://web.archive.org/web/20040423153126/http://www.20at.com:80/article.php?sid=86"

[[comments]]
order = 11
subject = "ازيك يا عم الشمحطجي"
text = "بص يا عم .. ما دمت انت فتك وبتاع فبركة متهيألي ممكن تورينا فبركاتك ومشاركاتك من خلال موضوع \"تجربة في حياتي\" ايه رأيك بدل ما انت نازل سلخ في الناس"
archived = "2004-04-23"
capture_url = "https://web.archive.org/web/20040423153126/http://www.20at.com:80/article.php?sid=86"

[[comments]]
order = 12
subject = "الدين النصيحة"
text = "( أول مره عرفت الجنس )<br />هذا على مافهمت أسم موضوع ، وليس سؤال مطروح للمشاركة ، فبالله عليكم دعونا نتعلم مايفيدنا في دنيانا وينفعنا ، ولا يكون ذلك منحدراً يأخذنا لغير ذلك وأعلموا أن :<br />كل كاتبُ سيفنى ويبقى ما كتبت يداه<br />فأكتب مايسرك يوم القيامة أن تراه<br />وجزاكم الله خيرا"
archived = "2004-04-23"
capture_url = "https://web.archive.org/web/20040423153126/http://www.20at.com:80/article.php?sid=86"

[[comments]]
order = 13
subject = "ايه إلي بيحصل دا !!!"
text = "كلمتين وبس<br />\" وتخش الموسيقي التصويرية، وبعدين صمت\"<br />الناس عمال تجاوب ع السؤال ولمؤاخذة بتاع الجنس وانتو سيبنهم ولمؤاخذة<br />ايه دا يا عم<br />لا لا لا يا عم<br />الكلام دا ما ينفعش<br />أنا ابتديت اخاف منكم زي الأخ ولمؤخذه الشمحطجي<br />مش كدا ولا ايه<br />مع تحياتي للموقع:<br />عمو فؤاد الي مش حقيقي."
archived = "2004-04-23"
capture_url = "https://web.archive.org/web/20040423153126/http://www.20at.com:80/article.php?sid=86"

[[comments]]
order = 14
subject = "ايه مين ليه"
text = "هو يعني ايه جنس<br />بجد انا بسال لاني مش عارف<br />انا اعرف الجينز<br />اللي بيتلبس"
archived = "2004-06-05"
capture_url = "https://web.archive.org/web/20040605110948/http://www.20at.com:80/article.php?sid=86"

[[comments]]
order = 15
subject = "اول مرة"
text = "للاسف اول مرة اعرف الجنس<br />كان في درس خصوصي<br />حيث قام صاحب البيت باحضار صور جنسية خاصة باخيه<br />والانيل من كدة ان المدرس لما جيه شاركنا تقييم الصور وشرح ما يخفي منها<br />وسلمولي علي التربية والتعليم وحسين كامل بهاء الدين"
archived = "2004-06-05"
capture_url = "https://web.archive.org/web/20040605110948/http://www.20at.com:80/article.php?sid=86"

[[comments]]
order = 16
subject = "مش كده خالص .."
text = "الكلام بالشكل ده مهما تكن النوايا الحسنة .. يدعوا للإباحية بشكل ما .. أرجوا أن تحترموا القارئ .. هل مفهوم شباب عشرينات أن نحدثهم بهذه اللغة فى مثل هذه الأمور .. لماذا لا يكون هناك توضيح فقهي لعملية البلوغ ومفوم المدى والمذى والمنى والاغتسال والحيض وحدود العلاقات والثار السلبية للعمليات الجنسية المحرمة وهكذا .. يعنى التثقيف الجنسي لا يعنى الانفلات فى الحديث الجنسى..<br />صلاح الشاعر"
archived = "2004-06-05"
capture_url = "https://web.archive.org/web/20040605110948/http://www.20at.com:80/article.php?sid=86"

[[comments]]
order = 17
subject = "محمد الحميدى _ مصر"
text = "بسم لله الرخمن الرحيم<br />احب ان اقول لهذا الطبيب الذى يريد نشر الثقافة الجنسية ان هذة الفكرة تدعوا الى الأباحية فبعد ان يتعلم الشباب هذة الثقافة ألايريد بعد ذلك تجربتها وممارستها وهذة افكار مستوردة من الدول الغربية ويتبنها الذين قال عنهم الله (ويريد الذين يتبعون الشهوات ان تميلوا ميلا عظيما) والا قل لى ايها الشهوانى كيف جئت انت الى الدنيا أليس من نتاج ممارسة الجنس بين امك وابوك مع العلم انهما لم يتعلوا الجنس من قوادين من امثالك"
archived = "2004-06-05"
capture_url = "https://web.archive.org/web/20040605110948/http://www.20at.com:80/article.php?sid=86"

[[comments]]
order = 18
subject = "من خدعكم"
text = "من خدعكم و قال أن امثال تلك المقالات و اختيار هذه العناوين الخارجه عن السياق اصلا هى التى تجمع الناس على القراءه . اخشى عليكم ان استمريتم عليها ان المقالات الأخرى الطيبه التى تنشرونها ستفقد مصداقيتها منكم. اتقوا الله و لا تستبدلوا صدقه جاريه بهذا"
archived = "2004-06-05"
capture_url = "https://web.archive.org/web/20040605110948/http://www.20at.com:80/article.php?sid=86"

[[comments]]
order = 19
subject = "هاااااااااااااى اصحو بقة وفوقو"
text = "غريبة اوى الناس اللى عماله تقول المقال سئ ويدع إلى الإباحية , انا مش شايف اى اباحة بصراحة فى كلام الراجل الدكتور (على فكرة ده استاذ كبير وبيكتب دايما فى اسلام أون لاين) وياريت الأخوة المحافظين اوى دول يفتكروا كدة كام مرة سمعوا كلام عن الجنس فى منتهه قلة الأدب من الاصدقاء وحتى فى الأوتوبيسات وكلام فارغ كمان وملوش اساس من الصحة , وارجو منهم قراءة كتب الفقة اللى بتقول حاجات يمكن لو هم مؤدبين اوى كدة يغم عليهم , والكتب دى كانت بتدرس فى المدارس الدينية القديمة لأطفال !!!!!!"
archived = "2004-06-05"
capture_url = "https://web.archive.org/web/20040605110948/http://www.20at.com:80/article.php?sid=86"

[[comments]]
order = 20
subject = "شكراً ..وعفواً"
text = "بسم الله الرحمن الرحيم<br />شكراً لمن كان طرحه نابع من غيرته على دين الله ومحارمه..<br />وعفواً..بل وصمتاً لمن دس السم في الدسم وتلون بلون الحرباء..<br />عجباً ..أمامه لوحة المفاتيح ..ولا زال يكتب باللهجة العامية المقيتة \"لا أعني لهجة مصر لكن عموم اللهجات العامية التي للأسف نجد هنا عينة متشرنقة ومتعلقة بها\" عجباً ....."
archived = "2004-06-05"
