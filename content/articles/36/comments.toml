text = "هل تعرفون انكم كتبتم حول هذا الموضوع اكثر من كل المواضيع التي كتبت في الموقع ؟؟؟<br />وهذا دليل علئ جهل البعض في هذا الموضوع فمنهم<br />يدعي الخجل ومنهم يتستر في الناحيه الدينه ولا يريد ان يتكلم بهذا الموضوع علانيه مع انه بحاجه الئ معلومات في هذا الموضوع<br />ومنهم فعلا لايعرف اي شئ عن الموضوع<br />وهذا دليل علئ جهل البعض لان الجنس احد انواع الثقافه ولاكن يجب ان نثقف انفسنا في الحلال وليس في الحرام كما يضن البعض.<br />وفقنا ووفقكم الله لفعل الحلال وابعادنا عن الحرام"
