[[comments]]
order = 8
subject = "غاية المراد"
text = "بسم الله الذي خلق الأرض في يومين، وبث الناس جميعاً من نفس واحدة وخلق منها زوجهاليسكن إليها..<br />إخوتي الأعزاء، إن غاية المراد في هذا الأمر، أنه ينبغي لكل ذكر من أنثى يسكن إليها غند بلوغه أو بعد البلوغ بزمن يسير، وكذلك الأنثى..<br />غير أننا زحفنا على أيدينا وبطوننا وراء الغرب وقلدنا كل سلوك قبيح أتونا به، وتقلدنا كل مظاهر مجتمعاتهم السلبية، وازداد الأمر سوءاً فضاقت ذوات الأيدي وانتشر الفقر وظهرت أزمة المساكن في مصر، وظل سن الزواج يتأخر تارة بحجة إكمال المراحل التعليمية، ولضيق الحال مرات ومرات..<br />ما أوقعنا في هذه الدوامة من الجهل والانحراف معاً..<br />ولئن تمكن كل شاب من الزواج في الخامسة عشرة أو السادسة عشرة لما ظهر مقال كهذا الذي قرأناه إلا من قبيل السخرية..!<br />والله المستعان.. وهو الهادي إلى سواء السبيل"
archived = "2004-04-23"
capture_url = "https://web.archive.org/web/20040423153126/http://www.20at.com:80/article.php?sid=86"

