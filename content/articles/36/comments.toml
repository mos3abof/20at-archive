[[comments]]
order = 25
subject = "تلمسان 13540 الجزائر"
text = "انه ليس من السهل ان نصدر حكما بدون دراسه اسباب هدا التنظيم او داك او دواعى وجوده .لا لشيى سوى لمراعاة ما يترتب عن صدور مثل هده الاحكام وما ينجم عنه من تبعات قد لا تخدم بل قد تهوى بالامه الى مادون مصالحها . عموما ان تنظيم القاعدة بشكل عام قد حقق شعبية منقطعة النظير وان كانت هده الشعبية متمخضة بدون شك ولا ريب مستمدة وبشكل رسمى من زلزال 11 سبتمبر ضد العدو رقم واحد الو م ا اللتى عاتت فى الارض فسادا ."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018204640/http://www.20at.com:80/article.php?sid=86"

[[comments]]
