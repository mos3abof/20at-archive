text = "اظن المبدا هو اللى غلط<br />و هو مبدا حريه التعبير<br />لو واحد كتب حاجه تكفر فى دين او اله او حتى فى رائيس دوله اظن انه مفهوش مشكله<br />اللى عايز يقول حاجه يقولها<br />و اللى عايز يتبعه يتبعه<br />انتوا مش شايفين مثلا الاجانب لما يتريقوا على رئيسهم<br />حد فينا يقدر ينتقد بالطريقه دى<br />فا انا شايف ان يكون فى كلمه اساسا اسمها تكفير و تحبيب اجتماعى<br />الدين علاقه فرديه بين الانسان و عقيدته او اله<br />مش علاقه جماعيه"
