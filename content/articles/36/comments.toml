[[comments]]
order = 46
subject = "اصحاب الورع الكاذب"
text = "بسم الله الرحمن الرحيم وبه نستعين والصلاة والسلام علي اشرف النبيين صلي الله عليه وسلم , ثم اما بعد ,<br />من الاخر كدا الموضوع دا ممتاز وكان لازم نتكلم فيه من 500 سنة فاتوا احنا للاسف عاملين زي النعام بندفن راسنا في الارض بالرغم من وجود المشكله اولا الي الاخوه والاخوات اصحاب الورع الكاذب اولا الجنس دا او الشهوه الجنسية دي مش حاجه اخترعنها او دسسنها في الطبيعه البشريه دا سبحان الله عزوجل هو اللي خالقها من اجل اعمار الكون يعني مش من عندنا ولو كان بايدينا لكنا تركنها ودفنها بس منئدرش وتعالوا هنا عاملين خاجولين اوي وما نتكلمش في الحاجات دي لانها اباحيه شوف ازاي اانتم اكثر حيائا من الصحابة والصحابيات فهذا يسئل عن المذي والمني وهذه تسئل عن غسل المرأة من الاحتلام وهذه السيده عائشة تروي كيف كان النبي يطهر ثوبه من المني سبحان الله ان الكلام الذي اسمعه من بعض الاخوه والاخوات لا يدل الا علي شئين اما عن جهل بطبيعه هذا الدين الذي هو منهاج حياه منهاج حياه يا جدعان فيه كل تفاصيل الحياة البشريه وعشان كدا هو دين واما الدلاله التانية وهي انهم اصحاب ورع كاذب ولو كنا علي عهد سيدنا عمر لضربهم بدرته عشان يفوقوا من الوهم والجهل المركب اللي هم عايشين فيه يا جماعه الجنس او الكلام فيه بضوابط وبنظام من صميم الدين سبحان الله النبي صلي الله عليه وسلم \"لا يقع احدكم علي زوجته كالحمار \" او كما قال بعمني يجب علي الزوج ان يداعب زوجته قبل الايلاج ومثل هذه الامور سبحان الله دا في القران حتي نوه عن الزواج والجماع \" نسائكم حرث لكم فاتوا حرثكم اني شئتم \" وكلمة جماع نفسها اتكررت كتير وكلمة فرج والكثير \" اانتم اعلم ام الله \" سبحان الله واحنا يا جماعه بنكلم ناس وعيين وفاهمين اني اقصد التكلم في الجنس بضوابط حتي لا نحرك السواكن فالشباب الايام دي متقحرط وانا واحد منهم ولو عليا اتجوز من اول امبارح دا انا هتجوز علي نفسي من كثره الفتن اللي الواحد بيقابلها رحم الله سيدنا يوسف . المهم الوضوع كبير وفيه ردود . المهم ان كان ما قلت صحيحا فمن الله ولو كان خطئا فمني ومن الشيطان والله ورسوله بريئان<br />اخوكم عبده نصحي<br />egypt_____@hotmail.com<br />freaky7979@yahoo.com"
archived = "2005-01-22"
capture_url = "https://web.archive.org/web/20050122092536/http://www.20at.com:80/article.php?sid=86"

