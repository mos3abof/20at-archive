subject = "عبدو من الجزائر"
text = "أول مرة عرفت الجنس عندما دخلت منزل الجارة والتي كانت حديثة الزواج دخلت المنزل بدون استأدان فادا بي أجدها مع زوجها في موقع اباحي أدهشني حينها وقد كنت صغيرا 09 سنوات وراتني هي بدون أن يراني زوجها ومن دالك الوقت أصبحت لاادخل اي غرفة او منزل بدون استادان أماجارتي العروس أصبحت تبتسم كلما راتني بل وتمدني بالمال كي لا أخبر أصدقائي ما رايته."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018204640/http://www.20at.com:80/article.php?sid=86"

