[[comments]]
order = 4
subject = "عتاب"
author = "سيف عبد اللاه"
posted = "2006-09-07"
text = "ليس حقيقى ان كثير من الفتيات مشغولون بالطلبه السياسين داخل الجامعه<br />صوره سيئه لكل الفتيات<br />عندما تصفين انا البت تقف على المعرض وهى لا تفهم شيئا من اجل عيون الذى تحبها على الرغم من اننا داخل الجامعه على مستوى علمى واحد<br />ظلم جيل كامل<br />انك قمتى بتصوير كل الشباب المهتمين بالعمل السياسى على انهم يعنيون من مشاكل نفسيه او اجتماعيه ومغرمين بحب الظهور من اجل لفت انتبهاه البنات اليهم وليس كلنا كذلك كما اننا لا نمجد اشخاص من اجل عمل او مصلحه شخصيه مثل الذى تعرفتى علي فى المؤتمر ذلك الشخص الذى كان يهتف كما تقولين لزعيم الحركه التى ينتمى اليها<br />ليس جيل السبيعنيات الذى نجح فهناك قصص كثيره تمت بنجاح من جيل التعينات من جيل الفين فمن العلاقات التى انتهت بالزواج فى العمل السياسى وبنجاح<br />محمد عبد الحليم<br />وليد السيد ونورهان<br />وليد خيرى<br />انجى ومعتز<br />محمود عزت وشرين<br />على سبيل المثال وليس الحصر<br />لااستطيع فى اخر كلامى اننى على يقين انك تعرفين انا هناك شباب يناضل ليس من اجل مصلحه شحصيه او من اجل لفت انتبهاه البنات او معقدون نفسيا او يعانون من مشاكل اجتماعيه او نفسيه<br />ام بالنسبه للاستاذ محمد السخاوى ارسل له<br />الف تحيه عطره لانه من الذين اضؤوا لنا شمعه فى ظلمات اليل حتى لا نتوه فى دروبات الطريق<br />اما بالنسبه للدكتور عصمت نسالكواء الفاتحه على روح هذا المناضل الكبير<br />شكر وتقدير فى اخر كلامى لااستطيع الا انا اتوجه اليك بالشكر وارجو منك فى المره الفادمه التخصيص وليس التعميم وشكرا مع تحيات سيف عبداللاه"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119213107/http://masr.20at.com:80/article.php?sid=453&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
