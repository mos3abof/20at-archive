subject = "مطلوب بنت ثورجية للزواج"
author = "dead man"
posted = "2006-06-05"
text = "محدش قالنا يعني عن تجربة واحد اتجوز واحدة ثورجية ، هو مش ممكن الشاب من دول يبقي ماشي في وسط البلد تعجبه واحدة ماشية وراء كمال ابو عيطة يقوم رايح بسرعة مطلع كارنية كفاية ولا يسجل نفسه في الاشتراكيين الثوريين علشان يقربها وينوله من الحب جانب ...<br />كده ولا ايه"
archived = "2006-11-19"
