subject = "حاجه دايقتني"
author = "عبدالله مفتاح"
posted = "2006-06-04"
text = "من الحاجات اللي دايقتني ان عرفت ان ناس كتير في كفايه الوطنيين مش محسوبين تبع اي دين<br />وغير كده اخلاقهم سيئه جدا<br />قلت حاجه تزعل لما تلاقي واحد وطني واخلاقه مش كويسه"
archived = "2006-11-19"
