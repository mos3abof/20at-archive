author = "الحوار منقول"
posted = "2009-06-21"
text = "ولن اتوقف كثيرا عند محاولات استجرارى لمهاترات عن طريق الانترنت والصحافه كما حدث فى اسمهان خاصة وان الجميع اعاد تقييم التجربه بعد ان كان يهاجمها فى البدايه وبداو فى الثناء على التجربه والجهد الفنى المبذول بها وهذا ما منحنا القوه والدافع على الاستمرار"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624025420/http://www.20at.com:80/20at/klam-rosas/12422-2009-06-21-09-50-31.html"

[[comments]]
order = 1
subject = ""
author = "دليل نقل الحوار"
posted = "2009-06-21"
text = "لان الشخصيه حتما ستجعلنا نتوقف على جذور الصراع العربى الاسرائيلى وستجعلنا نتطرق الى تاريخ القضيه الفسطينه وان كنا لانريد الدخول بعمق فى هذا المشاكل السياسيه لكننا سنلامسها بالتأكيد واقول للفريقين اننى على استعداد لقبول كل هجومكم بعد مشاهدة العمل على الشاشه<br />لكنى الان سأكتفى بالمتابعه عن بعد الى جانب تركيزى الذى وصل الى مرحلة الدورشه الصوفيه لمعرفة ادق تفاصيل روح وشخصية شاعرنا العربى محمود درويش وسابتسم كلما شاهدت هجوما علىالفكره التى قمنا ولازلنا نعد لها واقول للجميع هناك 90 بالمئه من جيل الشباب العربى الجديد ليست لديه احاطه كافيه بمحمود درويش بمعنى ان مايعرفونه عنه لايتعدى العلاقه بينهم وبين اشعاره<br />اما تجربته الانسانيه التى صنفته كشاعر العصر لايعرف عنها احد الكثير لذلك كان لابد من العمل على الشخصيه بدلا من الذهاب الى شخصيات اخرى قد تكون شهيره لكنها لاتملك هذا الثراء والنضج الدرامى والفنى"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624025420/http://www.20at.com:80/20at/klam-rosas/12422-2009-06-21-09-50-31.html"

[[comments]]
