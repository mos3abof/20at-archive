author = "naiera"
posted = "2009-06-21"
text = "لكن الجديد هذه المره ومايضحكنى كثيرا ان الهجوم جأء لمجرد ان قمت بالاعلان عن الفكره قبل ان يولد السيناريوا الذى لم يقرأ بعد !!!<br />خاصة والحلقات الاولى التى انتهينا من كتابتها لم تقم بقراءتها سوى مجموعه قليله منها على سبيل المثال المنتج يوسف عثمان مستشار رئيس مدينة الانتاج الاعلامى و المسؤل عن الانتاج الدرامى وهو رجل يعلم الجميع مدى ثقله وتاريخه المشرف الذى قدم للساحه الفنيه فى الوطن العربى اكثر من ثلاثمئة مسلسل تحمل اسمه كمنتج لكبار المخرجين بل لاابالغ ان قلت انه قام بتخريج نجوم الصف الاول فى الدراما العربيه على يديه وعندمنا يتبنى المشروع معى ويساندنى فى الوقت الذى ارى فيه اقلام تتطاير هنا وهناك لاغرض لديها الا الهجوم على الفكره قبل ان ترى النورفان ذلك يجعلنى اشد حماسه على تقديم العمل بل ويدفعنى الى التركيز بشكل اكبر"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624025420/http://www.20at.com:80/20at/klam-rosas/12422-2009-06-21-09-50-31.html"

[[comments]]
order = 4
subject = ""
author = "naiera"
posted = "2009-06-21"
text = "وفى رده على الهجوم الذى وجه اليه بالعديد من المواقع الاليكترونيه اضاف \" لقد تعرضت على هجوم كثير فى حياتى منذ البدايات ولم يوقفنى الهجوم عن تقديم تجاربى لكن الفارق فى الامر ان الهجوم كان يأتى متزامنا مع تقديم عمل فنى بعد ظهوره للنور وهذا شىء طبيعى<br />لا اتعامل مع نفسى كاننى سوبر مان غير قابل للخطأ لان النجاح يحتاج الىتفهم اراء الناس واحترامهم حتى لو كانت لهم اراء قاسيه وهناك بعض المبالغات كانت تحدث من اشخاص لهم مصالح شخصيه وكنت اعذرهم لانهم لم يكونوا يتحدثون فى العمل الفنى ولم يكونوا يقومون بتحليله علميا"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624025420/http://www.20at.com:80/20at/klam-rosas/12422-2009-06-21-09-50-31.html"
