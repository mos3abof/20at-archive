subject = ""
author = "دليل نقل الحوار"
posted = "2009-06-21"
text = "وعما اذا كان هذا الهجوم موجه الى شخصه اشار قائلا \" لا اعتقد ان الهجوم اتى على شخص فراس ابراهيم بل هو يصب على كل من يقترب من شاعرنا العربى محمود درويش وقد انقسم هذا الهجوم لنوعان من خلال متابعتى لبعض مانشر القسم الاول يقدس شاعرنا وهو متطرف فى حبه وهذا القسم لا الومه بل انتظر منه ان يشاهد العمل ويساندنى<br />اما القسم الثانى فهو الكاره لظهور شخصية دوريش فى عمل فنى وهى جهات لم ولن يهدا لها بال بل واتوقع ان تتعامل بشكل منظم للهجوم على العمل"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624025420/http://www.20at.com:80/20at/klam-rosas/12422-2009-06-21-09-50-31.html"

