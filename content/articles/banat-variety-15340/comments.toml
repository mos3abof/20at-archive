posted = "2010-02-17"
text = "بارك الله فيكي يا كاتي والله انا عيط لما قولتي<br />( أنا على استعداد لدخول الإسلام، وقلت الشهادة ودخلت الإسلام والحمد لله ) ربنا يكرمك و يثبتك امين يارب و يهديكي و يهدينا اجمعين و ربك و رب سيدنا عيسى بيحبك لأنخ خلاكي تشوفي طريق الحق و النور و اراد ان تكوني من اهل الجنه<br />بجد انا فرحانه جدا جدا بيكي ربنا يثبتك امين<br />و متسمعيش لكلام اي حد و قولي لا اله الا الله محمد رسول الله<br />الله رب كل الرسل و الانبياء و عيسى نبي و موسى نبي و محمد نبي و خاتم الانبياء و كلنا بنعبد الله الواحد القهار<br />ربنا يثبتك و يقوي ايمانك يارب"
