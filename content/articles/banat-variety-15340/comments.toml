author = "To LOVE angel"
posted = "2010-02-17"
text = "بصى ياستى حاولى تنسى أنك تهاجمى أو انك مسيخيه و أحنا مسلمين فكرى انك انسانه ليها عقل و انا كمان انسانه ليها عقل و هاسألك سؤال ولو عندك اجابه يريت تقوليلى بس ياريت تكون مقنعه<br />Just one question<br />لما زى ما بتقولوا فى المسيحيه ان عيسى اتصلب و اتعذب و مات وهو زى ما برده بتقولوا ابن الله او الله نفسه<br />لو افترضنا انه زى ما بتقولوا ابن الله يا ترى ليه ربنا يسيب ابنه يتعذب لهذه الدرجه؟<br />معلش استحملينى فى كمان سؤال<br />لو الا فتراض الأخر انه ربنا نفسه طيب ياترى لما مات ياترى مين الى كان بيرزق الناس و رافع السما و بيدبر امور الكون كله؟<br />طبعا الاجابه<br />إِنَّ مَثَلَ عِيسَى عِندَ اللَّهِ كَمَثَلِ آدَمَ خَلَقَهُ مِن تُرَابٍ<br />ثُمَّ قَالَ لَهُ كُن فَيَكُونُ"
archived = "2010-02-18"
capture_url = "https://web.archive.org/web/20100218111757/http://www.20at.com:80/banat/variety/15340-2010-02-15-14-49-57.html"

