text = "أمري لله!<br />رغم اني قررت أقاطع موقعكم هذا لأنكم حذفتم تعليقي \"حقا: طز في مصرالفساد..ومرحبا بشافيز\" .. كأني باقول شيء عجيب وللا قلة أدب، لا كأني باعبرعن رأيي...أين الديمقراطية يا شباب؟<br />المهم..<br />كيف إذن نعرف أن من ارتبط ببنتنا مسلم؟<br />وكيف يزوجهما المأذون؟<br />أو كيف يسجل المأذون أن الفتة مسيحية وليست مسلمة تعلقت بقبطي أو يهودي؟<br />إلا لو كانت كل الامور عندكم شحصية!!<br />يبقى احنا فعلا صرنا علمانيين..<br />وساعتها لن أقول طز في مصر العلمانية.. وتحذفوها تاني من هذا الموقع ..بل سأضطر للهجرة فورا من بلد لا دين له!<br />مصري حزين حزين حزين :("
