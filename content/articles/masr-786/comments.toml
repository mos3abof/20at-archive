[[comments]]
order = 0
subject = "لعنة الله على من كفر"
author = "سعدي الجميلي"
posted = "2006-08-09"
text = "إنتظروا فالقادم أعظم وما يحاك ضد الإسلام إكتمل ولم يبق إلا أن يعلن، هذا جنين سوء بذر بولاية السادات الكافر وهاهي سنوات حمله إكتملت وآن مخاضه وميلاده. اللهم جنب الأمة مكر أعدائها.<br />قلنا بكفر حكام المنوفية ومن والاهم فرمانا جاهلها بضيق الأفق والتعصب وولاء القاعدة والإرهاب. هل يجرؤ هؤلاء النفر على أمر كهذا لولا علمهم التام بمصادفته لهوى الكافر المنوفي اللامبارك؟<br />أما آن الأوان أن يهب عباد الله لنصر دين الله؟ ماذا تنتظرون؟ فتوى شيخ الأزهر الفاسق؟ أو إعتراض فاروق حسني اللوطي؟ أهذة مصر؟ أهؤلاء خير جند الأرض؟ أكنانة الإسلام هذة أم عورة الأمة؟ إخلعوا الكافر مبارك وإسحلوه ورهطه في شوارع القاهرة وعلقوهم بعد ذلك على النخيل عبرة ونكالا."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050414/http://masr.20at.com:80/article.php?sid=786"

[[comments]]
order = 1
subject = "هذا تمييز إيجابي..ولا مقارنة بغيرنا"
author = "مصري حزين"
posted = "2006-08-09"
text = "أي موقع في أمريكا حاصة - لتي اتخذوها مثالا يحتذى ودائما يقيسونا بها..كأننا ناقصين أهلية أو ذهنية - ستجد في أي أبليكيشن أو نموذج تسجيل في جامعة أو أي شيء خانة اسمها:<br />Race/ Ethnicity<br />أي العنصر أو الثقافة<br />إذن لابد من هذا<br />ومادمنا لنا شخصيتنا..ولنا هويتنا الإسلامية - ولا عبرة بآراء القلة الشاردة التي لا تعرف هوية مصر وغير أمينة عليها ..كما أنه لا عبرة لمن قال في بريطانيا أو كندا إننا نريدها إسلامية..لأنه لا يفهم تاريخها ولا يفهم تطورها ولا هويتها المسيحية.<br />كل هذه الأصوات لا أثر لها..<br />مصر ستظل مصر المسلمة<br />ومن لا يروقه نظامها فهو حر.. مثل الهشرين ألف شاب مصري اللي راحو إسرائيل وتزوجوا من هناك!!!!!"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050414/http://masr.20at.com:80/article.php?sid=786"

[[comments]]
order = 2
subject = "و ايه المانع"
author = "سمر منصور"
posted = "2006-08-09"
text = "مشيرا إلى أن إلغاء خانة الديانة من بطاقة الهوية في دول الغرب يرجع إلى ما تنتهجه هذه الدول من فكر علماني يفصل بين الدين والدولة عكس الواقع المصري حيث أن المواطن باختلاف عقائده متدين ويعتز بقيد ديانته ببطاقة هويته وبالتالي فإثبات الديانة ليس تمييزا لطائفة على أخرى وإنما هو إقرار واقع.\"<br />و يا ترى مش هنبقى لا متدينيين و لا مسلمين الا لو اتكتب فى بطاقتنا اننا مسلمين؟؟؟<br />مصر مش هتبقى اسلامية الا اذا تم تحديد ديانة كل مصرى فى بطاقتنا؟؟؟<br />غريب أوى اهتمامنا بالمظاهر و تمسكنا بيها لدرجة انها تبقى اثباتنا الوحيد اننا مسلمين<br />أنا مش فارق معايا حاجة لأنى مسلمة و الحمدلله,لكن طالما مضايق كتير من المسيحين-شركاء الوطن-و بيسبب لهم مشاكل و بيؤدى لعنصرية ليه مانغليهوش؟؟؟؟<br />اللى استغربته فعلا رأى حافظ أبو سعدة...افتكرت انه هيكون مؤيد للالغاء<br />\" كما تنص القوانين واللوائح المفسرة على ضرورة كتابة الديانة في بطاقة الرقم القومي والقانون هو إرادة الشعب بل وهناك أحكام قضائية تؤيد ذلك.\"<br />ايه المشكلة لو القانون ده اتلغى طالما فى الصالح العام...محسسينى انه كلام منزل ."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050414/http://masr.20at.com:80/article.php?sid=786"

[[comments]]
order = 3
subject = "SOme1"
author = "يعني سؤال معلش..."
posted = "2006-08-09"
text = "هل لو لاقيت مكتوب في خانة بطاقة واحد طلع بطاقته قدامك \" بهائي \" أو \" يهودي \" أو \" مسيحي \" مش بتحس بأي شيء إطلاقاً!.؟<br />طبعاً اللى بيحصل دا في مصلحة مصر و في مصلحة المسلمين و المسيحين، لأن في تمييز واضح بيحصل، و أفرض أنا عايز أبقى مسيحي لازم أغير في البطاقة و أهلي يعرفو إني بقيت مسيحي يقومو يقتلوني!؟<br />الدين شيء خاص، لا المجتمع ولا أي حد ليه الحق إنه يعرف أنا ديني أيه و أتمنى فعلاً من كل قلبي إن الخانة دي تتلغي من البطاقة"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050414/http://masr.20at.com:80/article.php?sid=786"

[[comments]]
order = 4
subject = "اسلامية و ليس علمانية"
author = "هند(المغرب)"
posted = "2006-08-09"
text = "نحن في المغرب ليست لدينا خانة الدين في البطاقة او اي من الأوراق الرسمية و معظم المغاربة يعتقدون ان مغربي يعني اكيد ديانته مسلم بالرغم من انه هناك في بعض المدن المغربية كفاس مكناس و الصويرة بعض اليهود المغاربة الدي اصبحوا اقلية بعدما هاجروا اخوانهم الاخرين الى اسرائيل و يطلون علينا بين الفينة و الاخرى و هم يقولون انهم اخواننا مثلما فعل الخنزير و زير الخارجية الاسرائيلي الحالي و نحن نتبرا منهم و من اخوتهم و الدي باع المغرب او بلده لا يحق له ان يدعي انه ابن هده البلد.<br />اما عن خانة الديانة التي لديكم في بطاقتكم الشخصية فهي جيدة لانها تتثبت ان الدولة اسلامية اولا و ليست علمانية. فاتمنى منكم ان تتمسكوا بها حتى تحافظوا على هويتكم كدولة مسلمة."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831050414/http://masr.20at.com:80/article.php?sid=786"

