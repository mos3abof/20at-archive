[[comments]]
order = 79
subject = ""
author = "الحق"
posted = "2010-02-09"
text = "يا جماعة انا لست افهم لحد الان انتم لماذا تدافعون عن الباطل ؟؟<br />الا تهتمون بحياتكم الابدية ؟؟<br />اساس التخلف و التشرد في مجتمعاتنا هو الاسلام<br />نعم<br />الاسلام<br />اخواني انا لا اكره اي شخص منكم<br />و لكن هذه هي الحقيقة<br />الطلاق و تشرد الاولاد هو السبب الرئيسي في الجريمة<br />و كله بسبب الشهوة التي كانت عند محمد بقوة 40 رجل<br />و عائشة<br />يا روحي على عائشة<br />ما خلت اير يعتب على كسها<br />من فوق ومن تحت<br />خلصونا بقى من هالمهزلة<br />كل فتوى جديدة<br />امبارح عم اقرى بالنت واحد شيخ مطلع فتوى اسمها (تفخيذ الرضيعة )<br />حول امكانية وضع القضيب الذكري بين افخاذ الرضيعة بدون ادخاله<br />هل يوجد بشري واحد يقبل هذا الكلام ؟؟<br />نعم يوجد<br />محمد<br />صاحب القضيب الذي لا يطوى<br />حرام و الله حرام<br />الاسلام = جنس فقط<br />و اللي زاعجني اكتر من هيك انو كاذب عليكن بخصوص الجنة و الحوريات و الولدان المخلدين<br />طيب الحوريات فهمناها<br />الولدان مشان شو ؟؟؟<br />طلع لوطي الاخ كمان<br />يا حبيبي<br />في واحد منكم بيرضى اني ارضع من صدر اختو علشان نصير اخوات ؟؟؟<br />جاوبوني هلق"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212081833/http://www.20at.com:80/20at/arts/3625.html"

[[comments]]
order = 80
subject = ""
author = "الحق"
posted = "2010-02-09"
text = "اقتباس osos:<br />أقل كلمة تقال للكافر اللى اسمه وأئل حسبى الله ونعم الوكيل<br />قافلة الاسلام تسير الحمد لله لامام والكلاب تنبح<br />أمثالك<br />يا شحاتين العرب<br />لحظة لحظة لحظة<br />انا روح قلبي اشرحلكم القصة الحقيقية<br />بدي اعرف بس الشراميط اللي دخلو و كتبوا عن الاسلام انه دين المحبة و التسامح<br />يا اخو المنتاكة اي تسامح ؟؟<br />اي محبة ؟؟<br />الاسلام نشر بالسيف و كلكم تعرفون هذا<br />هذا الاسلوب في الدفاع عن الاسلام بات قديما جدا<br />محمد سوف يحاكم قريبا حتى بعد مماته ب 14 قرن<br />لانه قام باكبر عملية احتيال بالتاريخ<br />انسان مريض جنسيا قام بارضاء الرجال من حوله بالنساء و بالزواج المتعدد و بالطلاق<br />روح اتفرجوا على قناة الحياة على القمر الاوروبي<br />الجمعة الساعة التاسعة بتوقيت بيروت<br />و شوفو الفضايح بالوثائق طبعا<br />اجمل حكاية مرت على راسي<br />و هذه الحكاية هي حديث مثبت<br />الرسول قام بمضاجعة زوجة عمه و هي في القبر ميتة<br />استغرب الناس من حوله هذا الفعل الشنيع<br />فراحوا يردمونه بالتراب<br />سألوه لماذا<br />فقال لهم<br />لكي يخفف عليها عذاب النار<br />هل يوجد كلب واحد فقط يصدق هذه الحجة ؟؟<br />كس اخت هالدين الاير"
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212081833/http://www.20at.com:80/20at/arts/3625.html"

[[comments]]
order = 81
subject = ""
author = "تخلف بتخلف بتخلف"
posted = "2010-02-09"
text = "انتو ياعرب رح تبقو هيك متخلفين .. وانت ياللي بتحكي باسم الدين حقك فرنك عند الغرب<br />روح دورلك على شي شغلة تفيد الوطن بدل ضرب الوطنيات والدينيات وكأنو الله عاطيكم مفاتيح الجنة ..<br />أما عن أهل مصر فهم ليسو خونة بل عملاء فهذه ليست مصر وامامها كذاب ( الله يرحمك يانزار قباني )<br />أهل غزة شهادة عار على الشعب المصري وحكومته<br />ولا اسمح لك بالتشكيك بالشعب اللبناني فالتاريخ لا يخفي نفسه يا شاطر<br />أما عن الذي يتساءل حول النصارى أقول له اذهب إلى غوغل وابحث عن زكريا بطرس أو أي موقع مسيحي لتجد ماتريد فهلوي بس ياحرام رح تنصدم بمعلومات نووية<br />والذي يقول عن زكريا بطرس كاذب فليدخل موقعه ويناقشه )( طبعا اذا كان لديك عقل وتتقبل البحث والتفكير )<br />ومن يقول عن الاسلام أنه الحل فأنا أوافقه بأنه حل للقضية العربية وحل للمجتمع نحو الاسوأ<br />فماذا فعل الاسلام في أفغانستان وماذا فعل في الشيشان وماذا فعل الاسلام في دول كثيرة<br />مشكلتي ليست الاسلام مشكلتي الدين ككل<br />لم تتطور اوربا الا عندما فصلت الدين عن المجتمع …<br />أيها المصريون لديكم نوال السعدواي لتسمعوا لها ان كنتم بسامعين .."
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212081833/http://www.20at.com:80/20at/arts/3625.html"
