text = "على فكرة قناة o t v قناة شبابية بجد وجميع الموضوعات مفيدة والافلام التى تعرض افلام عادية وتعرض فى بعض القناوت على فكرة انا شايف ان دى غرور من القناة يكفى ان البرامج التى تعرض يتم استضافة ضيوف محترامين ومناقشة المواضيع بجدية وعلى الهواء وليس مجملة لاشخاص معينين ولا هى مثل القنوات الاخرة التى تسعى وراء المادة والاثارة والاعلانات والمكالمات المدفوعة"
