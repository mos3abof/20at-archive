posted = "2009-06-16"
text = "والله بالنسبة للفيلم او القناه انا مش هاعلق لان كل واحد هايتحاسب على عمله والله كل واحد عنده عقل يفكر بيه ويقدر يميز الحلال والحرام انا بس عايزه ارد على الاخ احمد اللى بيقول الاسلام هو الحل *ياكلاب* يا اخ احمد الاسلام عمره ماقال نشتم الناس ونسبهم وعايزه اقول للأستاذ الذى نعت نفسه (بالجرىء) الاسلام فعلاً هو ديننا الحنيف هو دين الرحمه والحب والتسامح والاسلام عمره ماقال لينا نشتم او نغلط فى حد بس قال \" لكم دينكم ولىً دين \"<br />* امابالنسبة للى اسمه<br />(وائل)<br />اللى بيلعن \"القائد الفارس الشجاع الطيب المسلم صاحب الخلق وصاحب الصفات الحميدة \" فأنا بقول له انت مين يالى بتشتم القائد الفارس هو انت اساساً تعرف مين هو \"صلاح الدين\" اكيد لا لأنك لو كنت تعرفه كان مستحيل تقول عليه اى كلمه انت انسان جاهل وجاحد وده اقل حاجه تتقال عليك وانت مستحيل طبعاً تكون مسلم او مسيحى انت اكيد يهودى كافر لانك لو مسيحى كنت اكيد هاتعرف ان اليهود فى فلسطين بيقضوا على المسلمين والمسحيون"
archived = "2009-06-17"
capture_url = "https://web.archive.org/web/20090617060310/http://www.20at.com:80/20at/klam-rosas/3625.html"

