text = "يالى اسمك وائل<br />يالى بتقول الاسلام دخل لك الفساد والجهل يافاسد يا جاهل بقا الاسلام دين الفضيلة والفضائل دخل لك الفساد انت تعرف ايه عن الاسلام وتعاليمه اكيد متعرفشى اى حاجه وكمان دخل لك الجهل عشان تعرف انك جاهل تعرف ان من مؤسسى علم الطب والكمياء والفيزياء وغيرهم من العلوم هم علماء عرب مسلميين تعرف اساميهم اكيد لا اما بالنسبة للضربات التى تأتى للاسلام والمسلميين فدى حاجة الاسلام متعود عليها من قديم الازل من بداية الرسلة والفتوحات الاسلامية وسبحان الله مفيش اى حد قادر على محو الرسالة الاسلامية او ابادة المسلميين بالع[ *** ] الاسلام دائماً هو الاعلى والمسلمون عددهم دائماً فى زيادة مستمرة _ وفى النهاية بقول لك حسبيا الله ونعما الوكيل فيك ياكافر يا<br />وائل<br />وفى كل من يهمس او يلفظ او يتكلم بالسوء عن الاسلام او المسلمين .<br />فاالاسلام هو دين الرحمة والحب والتسامح والعطاءفما اجمل هذا الدين وما ارحم هذا الدين وما اطيب هذا الدين ولواعدت اتكلم عن الدين الاسلامى هاافضل اتكلم عنه لحد لما اموت ومش هايكفى ."
archived = "2009-06-17"
capture_url = "https://web.archive.org/web/20090617060310/http://www.20at.com:80/20at/klam-rosas/3625.html"

[[comments]]
