text = "رد على المحترم الذي اسآء للرسول علية اسلام<br />لن ارد عليك بنفس السلوب لانني لااستطيع ان اسئ لسيدنا عيسى علية اسلام لانة من اركان الاسلام الايمان بالرسل جميعا فنحنو نؤمن بعيسى كما نؤمن بمحمد عليما السلام<br />اما كلامك يدل على سؤ اخلاقك لوحدك<br />ان لدي اسدقاء مسيحيون اصحاب اخلاق ومبادى انتة بعيد عنها تماما"
