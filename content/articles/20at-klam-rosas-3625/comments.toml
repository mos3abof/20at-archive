[[comments]]
order = 75
subject = ""
author = "الحق"
posted = "2010-02-09"
text = "على سيرة الحجر الاسود<br />خلينا نحكي شوية تاريخ<br />يا جماعة الحج كان اسمو قديما ( الحك )<br />و هو كان من الطقوس المتبعة قبل الاسلام<br />كانو يضعون الحجر الاسود<br />و لكن كان لونه ابيض<br />و تأتي النساء اليه و يقومون بحك منطقة الفرج فيه وهن حياض<br />يعني يضعون عليه ايضا دم الحيض<br />تصورا كم امرأة مرت على هذا الحجر حتى اصبح اسود ؟؟؟<br />احب محمد هذا الحجر كثيرا<br />طبعا تعرفون لماذا<br />لانه كان يذكره بالنساء التي كان يضاجعهن جميعا<br />كان يقبله بشدة و يشمه دائما<br />اانا لم ارى في حياتي شهوة بهذه القوة<br />مستحيل<br />فعلا يستحق ان يكون رسول<br />و لكن رسول النياكة فقط<br />هذه المعلومات من كتب التراث الاسلامي<br />يعني اي كلب منكم رح يقول هالكلام كذب بدي ادحش شحاطي بنص حلقو<br />روح على اقرب مكتبة و اقرأ بهدوء و شوف الفضايح<br />و اهم شغلة انكم تقرأوا كل الاحاديث<br />لاني متأكد انو ولا واحد فيكن قرأ كل احاديث النبي<br />لانك اذا قرأتهم كلهم سوف تترك الاسلام في لحظتها<br />شكرا لاصغائكم ."
archived = "2010-02-12"
capture_url = "https://web.archive.org/web/20100212081833/http://www.20at.com:80/20at/arts/3625.html"

