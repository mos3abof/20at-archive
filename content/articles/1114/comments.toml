subject = "رائع"
author = "physics-84"
posted = "2006-09-27"
text = "السلام عليكم<br />رائع ما ذكرت أخ عبدالرحمن و موضوع مهم جدا و قد تميز أسلوب طرحك بمناقشة قضيتين في موضوع واحد ...<br />اللهم لا تجعلنا من أهل المعاصي اللهم اجعلنا ممكن يتبع دينك وسنََة نبيك<br />و كل عام و انت بخير أخ عبدالرحمن و لكل القراء<br />شكرا لك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132446/http://www.20at.com/article2.php?sid=1282"

[[comments]]
order = 3
subject = "جمال البنا والاساءات"
author = "معاذ محمود عامر"
posted = "2006-09-28"
text = "أعتقد يا عشرينات انه كان يجب عليكم من باب الدقة والامانة أن تنشروا آخر مقالين كتبهماالمفكر الاسلامي الأستاذ جمال البنا الأربعاء السابق واربعاء الأمس...<br />فبما أنكم قررتم ان تنشروا مقاله المثير للجدل عن التدخين والصيام, كان يجب أن تكملوا السلسلة المتعلقة بهذا الموضوع...<br />وأعتقد أنه تعرض لكثير من الاهانات على لسان بعض العصبيين أو المتشددين....<br />وأظن أن مقاله الذي كتبه الاربعاء قبل السابق كان جديرا بأن يدفع عنه كثيرا من هذه الاهانات السفيهة التي لا يحكم أصحابها عقولهم قبل أن يطلقوها في وجه رجل جليل ومفكر كبير وصاحب مشروع فكري جيد جدا,<br />وان لم يكن كل ذلك فعلى الأقل هو كبير في السن بدرجة تجعل اهانته من الفحش والسب الذي نهى عنه الرسول صلى الله عليه وسلم,<br />لذا أرجو منكم رجاء حارا جدا جدا أن تنشروا مقالتيه المؤرختين27_9<br />و20_9<br />ولكم الشكر العظيم والاحترام الجم ان فعلتم..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132446/http://www.20at.com/article2.php?sid=1282"

[[comments]]
order = 4
subject = "ناس دماغ واللهي"
author = "العمده الكبييييير"
posted = "2006-09-28"
text = "أنا اول مره ادخل الموقع ده بس بصراحه اللي بيكتبوا فيه دمااغ اوي اوي<br />و كمان الناس اللي انتو سألتوهم في المقال ده اصحاب دماااغ عالي اوي اوي<br />شياطين حمر و فول و شيشة.......<br />امممم متفكرونيش بأه ايام مصر ...بس في البلد اللي انا فيها الايام دي موش لاقي ولا شيشة ولا حتي فول بالقشطة<br />فول كله امريكاني و لبناني و اسرائيلي<br />اصل ربنا يبعد عنكم بشتغل في الرياض<br />عافاكم الله دي دارفور ارحم و الله<br />رمضان كريم وكل سنه والامه الموكوسة دايما موكوسة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132446/http://www.20at.com/article2.php?sid=1282"

