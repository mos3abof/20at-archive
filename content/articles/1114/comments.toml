[[comments]]
order = 1
subject = "قشطه"
author = "وفاء&وليد"
posted = "2006-09-27"
text = "فول ابو قشطه ايه ده بتاع الملتزمين الشله اسمها الشياطين الحمر يعني دول حاجزين مقدما معاهم في خيمه في الجحيم وربنا يهديهم اذا كان الشياطين بجلالة قدرها بتصفد في رمضان ودول منطلقين مش فارق معاهم حاجه وتقول الفطار وبعدين رقص شرقي ايه الالتزام ده هما هيقطعوا نفسهم مش كفايه صاموا عن (المم والامبو) عايزهم كمان يصوموا عن الشهوات وياترى الراقصه كانت صايمه وبعدين التراويح خفافي!!!!! طبعا عملوا حبة حسنات وهما مش عايزنهم عشان معاهم فلوس هيخشوا بيها الجنه بس بيني وبينك هما فهمين غلط وانت بتقول عن تجربه ربنا يسامحك وداري الفضيحه دي عشان ده مجاهره بالذنب واخيرا انا من بتوع الفول ابو زيت مش قشطه كمانهوخفيف وحلو في الأكل جربه احسن من الخيمه..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132446/http://www.20at.com/article2.php?sid=1282"

