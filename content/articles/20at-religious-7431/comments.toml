text = "السلام عليكم ارجو من السادة الكرام ان تتفصلو علينا بإرسل ورد لطريقة الخلوتيه في فلسطين إن امكن وجزاكم الله عنا كل خير<br />اخوكم في الطريقة وائل من الجزائر"
