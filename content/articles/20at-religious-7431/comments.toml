subject = ""
author = "حزين على الامه"
posted = "2007-10-30"
text = "يااخواننا اتقوا الله وارجعوا الى شريعة ربكم وسنة نبيكم .<br />قال الله تعالى اليوم اكملت لكم دينكم واتممت عليكم نعمتى ورضيت لكم الاسلام دينا.<br />لماذا كل هذه الجماعات وكل هذه الاشياء التى لم ينزل بها من سلطان."
archived = "2009-05-21"
capture_url = "https://web.archive.org/web/20090521175501/http://www.20at.com:80/salamo-3lakom/7431.html"

