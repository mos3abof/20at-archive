posted = "2008-11-17"
text = "الحمد لله رب العالمين ولا عدوان إلا على الظالمين أليس هذا من تلاعب الشيطان ببني الأنسان، أليس هذا مشاقّة لله ولنبيه صلى الله عليه وسلم، أليس هذا إتباع لطريق الغواية وتركاً لسبيل الصلاح والهداية، الخير كل الخير باتباع من سلف والشر كل الشر بإبتداع من خلف.<br />أسأل الله الهداية للجميع … آآآآآآآآمين"
archived = "2009-05-21"
