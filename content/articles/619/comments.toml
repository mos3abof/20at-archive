[[comments]]
order = 0
subject = "الموز علينا حق"
author = "أكرم ينعي كلبه"
posted = "2006-02-05"
text = "مش عارف اي حكاية النعي مع عشرينات النهارده مرة صفحة وفيات و مرة ننعي حيوان<br />بهذه المناسبة اقوم بنعي كل اخوتي الذين ماتوا كمدا و ماتوا و هم احياء فكما ان الشهيد يظل حيا فهناك بيننا اشخاص يموتون و هم احياء ( مش الاحياء اخت الكيمياء و الفيزياء )<br />الناس اللي غلطوا في حق النبي صلى الله عليه وسلم و على رأي شيخ مسجنا<br />اذا رأيت ثورا ينطح جبلا فلا تشفق على الجبل و اشفق على الثور فما بالكم لو لم يكن ثور و كان برغوت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112950/http://www.20at.com/article2.php?sid=386"

[[comments]]
