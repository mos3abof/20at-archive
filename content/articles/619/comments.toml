[[comments]]
order = 4
subject = "ليش لا"
author = "هبهب"
posted = "2006-02-08"
text = "الله سبحانه و تعالى كرم الانسان على سائر المخلوقات لذلك اعتقد ان الانسان لايشعر براحة في التحدث الى البشر فيتخذ الحيوان صديق له ولا عيب في ذلك طالما ان هذا الحيوان لا يفهم ما نقوله ولا حرج على الانسان ان يكرم صديقه عند موته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112950/http://www.20at.com/article2.php?sid=386"

