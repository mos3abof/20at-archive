[[comments]]
order = 6
subject = "كلاب ولاد كلاب"
author = "واحد محروق دمه"
posted = "2006-03-06"
text = "لماذا كل هذا الحزن والأهتمام بالكلاب على رأى المثل كلب وراح تعالوا شوفوا الناس اللى بتموت من الجوع كل يوم مش حرام ده ولا ايه ولا الناس اللى بتدور على اكلها فى الزباله وبتنام على الرصيف من أطفال الشوارع وخلافه والله ربنا هيحاسبنا وربنا يولع فى اللى بتكتب ثروه بالملايين لكلب والمسلمين بيموتوا من الجوع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112950/http://www.20at.com/article2.php?sid=386"

[[comments]]
order = 7
subject = "محاكم التفتيش"
author = "موز"
posted = "2006-04-11"
text = "يا حرام بعدين الكلاب بتزعل<br />عم تشبهوها بالرؤساء العرب<br />بكرة بترفع عليكم دعوة تظلم<br />هه هه ههه هه<br />اللهم أمحق كل رئيس عربي<br />وأبعث فينا مثل عمر ابن عبد العزيز"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112950/http://www.20at.com/article2.php?sid=386"
