subject = "كلاب لكن عظماء"
author = "حمزة اشرف"
posted = "2006-02-07"
text = "ياسلام لو يكرموا الانسان زى ما بيكرموا الكلاب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112950/http://www.20at.com/article2.php?sid=386"

[[comments]]
order = 2
subject = "؟؟؟"
author = "عبده نصحي"
posted = "2006-02-07"
text = "للاسف انا مش واخد بالي بعد ما قرأت المقال دا اعمل ايه ؟ الله يكرمكم لو حد يقولي النقط الاساسيه والافكار الاساسيه وعلاقتها بعنوان المقال لحسن اخوكم علي اده يدوبك معايه التوجهيه وبذاكر للباكالوريا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112950/http://www.20at.com/article2.php?sid=386"

