[[comments]]
order = 0
subject = "لا اله الا الله"
author = "فلسطينية"
posted = "2006-07-05"
text = "شو الواحد بدو يعمل ولا يقول<br />الله على الظالم..فعلا الاوضاع اللي بنعيشها بتخلي الواحد بدو ينتحر لولا الله علينا<br />ادعولنا يا ناس<br />مشكووور يا عاطف على مجهوداتك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125859/http://www.20at.com/article2.php?sid=1031"

[[comments]]
order = 1
subject = "ندعو الله ليلا ونهار"
author = "اللجين"
posted = "2006-07-05"
text = "اختي وحبيبتي فلسطينيه شاهدت مقالكي كل شي الا الانتحار فانتن الباسلات المضروب بكن المثل فعليكن بالجهاد وانتن ماجورات ان شاء الله الى الا مام لرفع لا اله الا الله محمد رسول الله فوالله نحن ندعو لكم وان يرجع القدس للمسلمين لانقول الا اللهم ارنا في اليهود عجائب قدرتك عاجلا غير اجل وشكرا حبيبتي اختك لجين بنت السعودية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125859/http://www.20at.com/article2.php?sid=1031"

[[comments]]
order = 2
subject = "صبرهم يارب"
author = "وعد"
posted = "2006-07-05"
text = "اللهم صبر اهل فلسطين، لكن انا اريد ان اسال هل هناك حاكم في العالم يكون الجلاد في الوقت نفسه؟<br />هذا من عجائب الزمن واواخره، ولذلك فان الحنكة السياسية تقول: \"العين بالعين والسن بالسن\"..وخلي العالم ينفع اسرائيل في ظلمها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125859/http://www.20at.com/article2.php?sid=1031"

