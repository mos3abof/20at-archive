text = "هدا ك الله يااخي يامن ترمز لا سمك لاشئ ]]]]]]]]]]]]]]]]]]]]]لا تكتب ولا ولن اسمح لك ولن ارضى ان تتكلم في حكومتنا اعزها الله وحفظها [[[[[[[[[[[[[[[[ ان كنت لا تعلم فا المملكة تتبرع بالملايين لابنا فلسطين الشقيق وهي الرائده في هذا \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\ ثانيا لماذا ياجبان لم تكتب من اي بلد انت ام تخاف ان اتهجم عليك واوضح ما قدمته بلدك لا بناء فلسطين واكشف المستور\\\\\\\\\\\\\\\\ ثالثا\\ اعداء المملكة وحسادها كثيرون لما فيها من خيرات تنعم بها فقد انعم الله عليها واختارها لخدمة الحرمين الشرفين ولله حكمة وتقدير في ذالك \\\\\\\\\\\\\\\\ \\ رابعا\\ انا اشك انك اعمى الموضوع عن اسرائيل تحاكم من \\\\\\\\\\\\\\ فاان كانت فيك نخوة وغيرة ودفاع عن اراضي المسلمين يااخي جازهم على الا قل بكلمات رقيقة تمزجها با الدعاء \\\\\\\\\\\\ اخيرا \\ن كنت شجاع قل اسمك ومن اي بلد كما هو اسمي ياجبااااااااااااااااااااااااااااااااان واحذرك من ان تتكلم عن حكومتنا بتللك الطريقة حفظ الله حكامنا وبلدنا من الحاسدين والكل يشهد بخيرهم [[[[[[[[[[[[ دعواتي الحاره لفلسطين الابية وبواسلها\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\ توقيع]]]]]]]]]]]]]]]ريم وبكل فخر بنت السعودية[[[[[[[[[[[["
