[[comments]]
order = 4
subject = "بحب اسرائيل"
author = "مواطن عربي"
posted = "2006-07-06"
text = "اعلن من هنا اختلافي مع السيد شعبان عبدالرحيم فانا احب اسرائيل و اكره العرب لان الفرق واضح وضوح الشمس فالعربي قذر مش مصدق امشي في شوارعهم ادخل دورة مياه في جامع مش حاقولك في حتة تانية اقف في طابور وانت تشم روايح الي بيقولوا على نفسهم نظاف وشوف بنفسك النظام الي في الطابور<br />اما النظافة الداخلية فحدث ولا حرج عن الرشوة والفساد وكانه عادي اما عن الضمير فاحكم بنفسك هو الي بيحكمكوا عنده ضمير؟؟<br />واما عن الوحدة وروح الفريق عايزك تتفرج على سكان عمارة واحدة الي مفترض انهم جيران و النبي (عليه الصلاة والسلام) وصاهم ببعض ولا الي بيحصل في العراق<br />اما عن قيمة العمل مش حا اكلم<br />يعني بالبلدي كده شعوب مالهاش اي لزمة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125859/http://www.20at.com/article2.php?sid=1031"

[[comments]]
order = 5
subject = "يا مواطن عربي عجبا للك"
author = "ريم بنت السعودية"
posted = "2006-07-06"
text = "عجبا لمن يسمي نفسه ابن العرب وهو لا يمت لهم بصله اولا اسال الله ان يفك حصار اخواننا الفلسطينيين وثانيا لمن اسمى نفسه مواطن عربي كيف تتهجم علينا من اثار للك مواضيع دورات المياه ومن ومن 00000000000000000 باسلوبك تحكم علينا بالوساخة بالله عليك دوراة المياه كيف تريدها فهي اصل النجاسة يعني افهم من كلامك انك مطهر وانا عن نفسي لم ارى عندنا جامع ولا مسجد ولا دوراة مياه الا في غاية النظافة جزى الله حكومتنا خير الجزاء اما ماقلت عن الرشاوي فاصابعك ليست كبعض يمكن انك ترى في وطنك رشاوي واختلا سات لكن نحن هنا انعم الله علينا بقيادة رشيدة لاولا تتركنا نحتاج حفظهم الله \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\ لا اقول الا قاتل الله اليهود وابناء القردة والخنازير ونصر عبادة في فلسطين وشكرا[[[[[[[[[[[[[[[[[[[[[[[[[ ريم بنت السعودية وبكل فخر]]]]]]]]]]]]]]]]]]]]]]"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125859/http://www.20at.com/article2.php?sid=1031"

[[comments]]
order = 6
subject = "افتحوا الحدود للأسواد"
author = "القعقاع"
posted = "2006-07-06"
text = "مصيبتنا في حكامنا ، والله لو فتحوا الحدود لنا ستجد إسرائيل اسود الإسلام هبوا من كل فج عميق وافترسوها بعون من الله في أيام معدوده فكم من امبراطوريات قهرة على يد أسود الإسلام وليس بقوة العتاد والأعداد وإنما بقوة الأيمان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125859/http://www.20at.com/article2.php?sid=1031"

[[comments]]
order = 7
subject = "جمال"
author = "الى الاخت ريم بنت السعودية"
posted = "2006-07-06"
text = "لماذا لا تستطيع حكومتكم الرشيدة فك حصار الفلسطينين؟؟<br />ولماذا لا تقدم لهم المساعدات المالية والمعنوية في وقت يعانون فيه من المجاعة؟؟<br />ماذا قدمت حكومتكم الرشيدة للاجيال القادمة عندما ينفذ البترول؟؟<br />هل استطاعت بناء محطات للطاقة البديلة؟؟<br />ماذا قدمت حكوماتكم الرشيدة للعلم ومن هم العلماء الذين خرجوا من بلد يحتوي على ثلث احطياطي العالم من البترول؟؟<br />فلتكف حكومتكم الرشيدة وباقي الحكام العرب عن السجود لامريكا وليسجدوا للواحد القهار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125859/http://www.20at.com/article2.php?sid=1031"

