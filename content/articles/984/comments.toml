[[comments]]
order = 9
subject = "سحقا لاسرائيل"
author = "مسلمة عربية"
posted = "2006-07-10"
text = "يا رب فرج هم الفلسطينيين وكل المسلمين يا رب العالمين . بالله عليكم يا امة محمد الن تخجلو من امفسكم و ان تنهضو من سباتكم الم تخجلوا من سكوتكم على ما يجري .يا عرب كفاكم صراع واتحدو كلكم لمواجهة الصهيونيين اتقو الله يا حكام العرب و افيقوا كفاكم . مغربية بدون عنصرية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125859/http://www.20at.com/article2.php?sid=1031"
