text = "الاتنين متعبين , والصحافه بقي انتو شافين يعني اللي بتروح تتدبح في فلسطين وهبه عكليه والست اللي كانت شغاله في قناه العربيه وماتت وانتو في ولاد البلد الغتاته حطت عليكو ومراسلين بنات , والصوره دي مش غريبه عليا شفتيها فين يا بت شفتيها فين فين فين افتكرت في منشور ضد السلطه."
