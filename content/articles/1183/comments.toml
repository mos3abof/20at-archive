text = "الى الاخت التى انفصلت عن خطيبة بسبب العمل لقد اخطئت فى حق نفسيها وحق من تحب فقد كان من الاول ان تتخل عن عملها وتبحث عن عمل يناسب وضعها كمراة ولاان تترك من تحب نصيحة ان تحاول ان تسترد مافقدتة"
