subject = "الفلبين.. عيد الفطر إجازة وطنية"
text = "احتفل مسلمو الفلبين اليوم السبت 12-11-2004 بعيد الفطر المبارك، حيث أدوا شعائر صلاة العيد في حشود كبيرة. فيما قررت الحكومة الفلبينية الإثنين 15-11-2005 إجازة وطنية للاحتفال بانتهاء شهر الصيام؛ إذ إن السبت والأحد إجازة أسبوعية بالفلبين."
archived = "2004-11-15"
capture_url = "https://web.archive.org/web/20041115115909/http://www.20at.com:80/article.php?sid=752"
