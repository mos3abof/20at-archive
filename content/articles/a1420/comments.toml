subject = "عبدالله"
author = "سم الله الرحمن الرحيم"
text = "لا يحق لأي إنسان مسلم على وجه الأرض أن يقتل مسلماً آخر إلا إذا كان حاكما في بلد يقوم فيه الحكم الإسلامي وغير ذلك يعتبر طغيانا وفسادا في الأرض ، لا بارك الله في أناس يدعون الإسلام ويقتلون على الظن<br />والحمد لله رب العالمين"
archived = "2006-11-02"
