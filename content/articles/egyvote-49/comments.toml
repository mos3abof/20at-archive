[[comments]]
order = 0
subject = "شكر وتقدرير للدكتورة نهى"
author = "م.أحمد"
posted = "2005-11-27"
text = "يادة المستشارة نهى الزينى<br />والله العظيم أنا لا أستطيع سوى أن أقف مصفقا للضمير القضائى الصاحى وأقول فعلا مصر لسة فيها الخير وبارك الله فيكى وأذكرك أن الصدق أنجى يا دكتورة نهى<br />ووالله لا تقوم للأمة قائمة إلا بأمثالك من النبلاء<br />وأحب لو سمحتم أدى للناس فكرة عن الديموقراطية الموجودة فى مصر<br />أناكنت وكيل عن الدكتور نعمان جمعة فى إنتخابات الرئاسة الماضية بصفتى عضو فى الوفد كنت جالس داخل اللجنة ولا أستطيع الخروج من عصابة أمن الدولة التى تنتظرنى فى الخارج فى بعد كدة ديموقراطية؟<br />وفى النهاية أنا بكرر إعجابى وتأييدى للدكتورة نهى الزينى<br />والسلام عليكو ورحمة الله وبركاتة"
archived = "2009-02-11"
capture_url = "https://web.archive.org/web/20090211001847/http://egyvote.20at.com:80/article.php?sid=49"

[[comments]]
order = 1
subject = "عاشق مصر"
author = "ياااااااااااااااااااه"
posted = "2005-11-27"
text = "خيراااااااااااااااااا ظهر لنا من لم يحنى رأسة ووقف فى وجه الظلم والطغيان وقال كلمة حق لا يخشى بها لومة لائم وتأكد لنا من وجودبعض القضاة او من يشرف على العملية الانتخابية ذممهم رخيصة اما خوفا او رغبة هذا لا يصنع فارقا .<br />ظهر لنا المدعو مصطفى الفقى بلطجى فى ثوب مثقف ومفكر .<br />ظهر لنا رجل صنعته الحكومة ووقفت خلفه لذا فولاءه الاول والاخير لسيده الذى اوجده فى البرلمان فلا تنتظر منه كلاما ثاقبا ولا فكر فهذا الشئ بوق دعاية فقط لحزبه الوطنى وحكمه الخالد .<br />لذا ادعوه ان يتخلى عن فكره انه مثقف ومفكر حتى لا يصدق نفسه ويتحدث مرة اخرى عن الحرية والعدالة فهذا شخص رضى بتزوير ارادة الناخبين فى سبيل كرسى البرلمان .<br />عموما اقول له لا نحب ان نرى امثالك يتكلمون فالافضل لهم هو الاختفاء بعيدا عن اعين الناس ونرجو منك الا تقتدى بالاخ المبحل كمال الشاذلى فلعنه الله عليك وعليه"
archived = "2009-02-11"
capture_url = "https://web.archive.org/web/20090211001847/http://egyvote.20at.com:80/article.php?sid=49"

