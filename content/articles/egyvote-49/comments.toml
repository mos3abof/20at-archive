text = "لدكتور مصطفي الفقي خسارة في دمنهور فهو اكثر افادة لاهالى دمنهور من اى عضو اخر يمثلهم فى مجلس الشعب اريد اجابه على سؤالى اذا كان الدكتور حشمت مكروة من السلطة فاى استفادة سوف يجنيها من السلطة لكم افيقوا يا اهل دمنهور وكفايه شعارات باسم الاسلام والمسلمين واتقوا اللة كى يجعل لكم مخرجا ويرزقكم من حيث لا تحتسبوا"
