[[comments]]
order = 8
subject = "ارحمن يا حسني وحل عن سمانا"
author = "مهند"
posted = "2005-12-05"
text = "ا ترى حسني ميارك ممكن يشوف المكتوب هنا؟؟ طيب يا ترى فيه حد في الحزن الوطني هيشوف ده ولا هما مش فاضيين من السرقه والنهب ؟؟ يا ريت يا حسني تحل عنا وتريحنا .. لا أدري لماذا يصر الحزن الوطني ورئيسه على مرمطة البقية الباقية من بعض الرجال .. كأن هذا الحزب يصر على سحق جميع رموزه قبل المغادرة الآتية لا محالة .. طلع علينا السيد أسامه الباز بتصريخ عبيط بيقول أن حسني مبارك لا يعتبر نفسه فرعون .. يا دي النيله .. مين العبيط الذي أملى عليك هذه العبارة ؟؟؟ مش ملاحظين إن كل أفندياتنا وقعوا في الوحل ... روحوا بقى حلوا عنا يا مفلسين .. لا أقصد الفلوس طبعاً فكروشهم وجيوبهم مليئة لكن مفلسين فكر .. ده تصريخ يا راجل .. مش تتعلم تصرخ كويس .."
archived = "2009-02-11"
capture_url = "https://web.archive.org/web/20090211001847/http://egyvote.20at.com:80/article.php?sid=49"

[[comments]]
order = 9
subject = "دكتورة نهى طاول عنقك السماء"
author = "أبو روان"
posted = "2005-12-07"
text = "اسيدتي أقول لك كلي فخر أن وطني يحوي قضاة أمثالك ، ياسيدتي حسبك أنك وفيتي بالأمانة وأبرأتي ساحتك أمام الله تبارك وتعالى ويكفي ما جاء في كلمات شهادتك ، إن كل أكاليل الغار التي في الدنيا لا تكفي كي وضع حول عنقك ، قال صلى الله عليه وسلم \" القضاة ثلاثة إثنان في النار وواحد في الجنة .... \" أسوق هذا الحيث لمن إرتكب هذا الجرم الشنيع ، إن النبي صلى الله عليه وسلم لعن من غير منار الأرض ( أي العلامات التي تعرف بها ملكية الأرض ) فما بالك بمن غير إرادة الناس وبدلها ، أيها النائب الشرعي المنزوع حسبك الله ، أيها النائب المزعوم إن الله يملي للظالم حتى إذا أخذه لم يفلته ألا هل بلغت اللهم فاشهد"
archived = "2009-02-11"
capture_url = "https://web.archive.org/web/20090211001847/http://egyvote.20at.com:80/article.php?sid=49"

