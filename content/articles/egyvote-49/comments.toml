subject = "لو قالوى كمال......قلت طظ فيك يا كمال يا شاذلى وانت ومحمد حسنى مبارك"
author = "من  قده  من الباجور"
posted = "2006-01-07"
text = "نا من اولاد الباجور واول ما عرفت هذا قولت اجى اقول رئيى فيه عن شلة الحرميه نفسى احد من الصحفيون يكتبوا هذا الكلام عن كمال الشاذلى عن كوبرى الباجور الجديد تم بنائو بمبلغ لا يقل عند 100 مليون جنيه بعد السرقه فى حين انا البلد تحتاج لكل قرش لاولدها الابرياء وهذا حكم القوى على الضعيف (حسبناالله ونعم الوكيل)انا من شباب الباجور وانهو حرامى كبير اوى اوى اقتلو بالبغل ابن البغل يالطور ابن الطور"
archived = "2009-02-11"
capture_url = "https://web.archive.org/web/20090211001847/http://egyvote.20at.com:80/article.php?sid=49"

