subject = "لا تنتحر"
author = "د. الحسيني"
posted = "2005-11-27"
text = "زيزي د. مصطفي الفقي: أرجوك لا تنتحر أدبيا وتمحو تاريخا من خدمة الوطن. مصر بحاجة إليك في أدوار أكبر: حين تقول فيصغي لك فؤاد الوطن. تبرأ من هذا الزور وارفض مقعد التزوير واجلس حيث مقعدك الحقيقي في قلب مصر. المخلص المحب د.الحسيني"
archived = "2009-02-11"
