subject = "بلاش تحيز"
author = "تامر الشيخ(عبدالله بن عبدالله)"
posted = "2006-12-20"
text = "والله أعلم ان الظاهر ان الاخ اللي كاتب الموضوع دة مسيجي ومتحمس للخواجة موريس مع احترامي للاخوة المسيحين انا مسمعتش عن موريس ده الا النهاردة بينما الاستاذ عمرو خالد اللي الناس كلها بتهاجمه العالم العربي كله يعرفة مسلمين واقباط والاسلوب الي بيقول عنة الدكتور موريس انه مش من الاسلام ومستغرب ياعيني منه وان غريبة ان عمزو يقول كده بقوله ده من اساس الدين عندنا لان ربنا عز وجل قال ( وادع الى سبيل ربك بالحكمة والموعظة الحسنة وجادلهم بالتي هي احسن) صدق الله العظيم وده قبل ماحضرتك تشوف النور بالاف السنين وجزا الله عنا الاستاذ عمرو خالد كل خير وقيل في المثل الكلاب تغوي والقافلة تسير.... ولو كل كلب عوى القمته حجرا لكانت الحجارة بالدنانير تباع"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127114320/http://masr.20at.com:80/article.php?sid=1079"

