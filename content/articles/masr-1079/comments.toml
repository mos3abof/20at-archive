posted = "2006-12-30"
text = "انا شايف ان الكلام لو اتقبلناه هانستفيد كتير اي كان من الطرفين بدام تحت اسم الحبه وفعلا يعمل بيها هايعرف يعني ايه الاخر لان الاخر دا انسان بغض النظر لونه وديانته او جنسه لان ربنا خلقنا في البدايه علي عهد الحب الي كان بين الله وادم وجه ادم نقض هذا الحب والوعد العظيم ومع ذللك الله بيحب ادم ووفرلو كل احتياجته علي الاض كمان لانه بيحبو هو دا الوعد الي لازم نتعلم منه اعظم حب في الوجود"
