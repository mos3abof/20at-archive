[[comments]]
order = 14
subject = "good site"
author = "nana"
posted = "2006-12-29"
text = "انا بقى سمعت عمر خالد وسمعت القسيس سامح موريس<br />عمر خالد من الشخصيات المؤثرة اللى بتلعب قوى على وتر المشاعر والاحاسيس وعرف كويس قوى انة يعرض افكارة من خلال طريقتة والقاؤة ودة شئ كويس ومش عايزة اتكلم عنة اكتر من كدة لانى مش عارفاة شخصيا<br />انا اتكلم براحتى عن ابوياالقسيس سامح موريس<br />لو كل الناس بتعتقد ان القسيس سامح موريس بيلعب على وتر المشاعر انا مش باعتقد كدة<br />لان الراجل بيتكلم من خلال واقع كتابى وهو واقع الكتاب المقدس اللى بيتكلم عن المحبة والقبول ......تعالوا الى يا جميع المتعبين وثقيلى الاحمال وانا اريحكم......<br />مش بيجيب حاجة من عندة غير ان طريقة القاؤة رائعة جداااااااا وممسوحة بمسحة من الروح القدس اللى هو روح ربنا<br />وسبب ما ان كلامة دة مؤثر جدا هو ان كلمة الله بتقول كدة ... ان كلمة الله صالحة ومرضية واقوى من كل زيف زى حدين وتدخل الى مفرق النفس والروح.....<br />هو دة باختصار اللى بيحصل مع الجهتين<br />مع كل احترامى لاخواتى المسلمين فين فى القران كلمة محبة وللا قبول حتى انا مش بالاقيها مع انى قريت القران .<br />فامنين بيجيب الاخ عمر خالد كلمة الله بيحبك وسمعها فين دى وطريقتة دى اتعلمها ازاى<br />انا مش عارفة حقيقة ان عمر خالد زار كنيسة قصر الدوبارة وللا لا لكن متاكدة ان اسلوبة دة مش من عندة لانة مش فى عقيدتة اصلا محبة<br />وشكرا<br />ارجو نشر مشاركتى"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127114320/http://masr.20at.com:80/article.php?sid=1079"

