text = "ادلوقتى خلاص يابرنس من غير خطوبة و لا ديولو اى بنت انت ممكن توقفها فى الشارع و تخرج معاها من غير مشكلة و اخرها شيشة كو باية شاى و اعمل لاى انت عاوزة و يسلام لو معاك عربية عليك و على المقطم بس روح بدرى علشان هتلاقية زخمة ز مش هتلاقى مكان<br />و انات مش محتاج تتكلم فى الحب لان البنات دلوقتى بتضبضن من الاكلام الرومنسى جيب من الاخر معاها<br />aywa keda ya Wadeeeee3"
