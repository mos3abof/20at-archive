text = "بجد انا لا اثق فى بنت مصرية كلهم ضري و مقضينها وكلهم بيشربوا سجاير و بيعطم<br />بجد انا مش عارف لية كارة كل البنات و مش عاوز ارتبط خالص و على فكرة انا معنديش اى عقد عاطفية بس البنات الى بشوفها فى االجامعة و لبسهم و لون سنانهم من الشيشة و طريقة لبسهم و الى بشوفهم منهم خليتنى اكرههم و مستحقرهم و خلتنى ابسلهم نظرة احتقار لاى بنت"
