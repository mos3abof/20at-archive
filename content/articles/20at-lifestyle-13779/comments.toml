author = "والله انتم عالم فاضي"
posted = "2009-12-03"
text = "بقى بدل ماتتكلمو فى اشاء مهمه عن الجواز وعن المسؤليه اللى بعد الجواز وامتى الواحد يتقدم للجواز ومين هيه وحجات تانيه كتير سبتوها وماسكين فى اذاى يلبس ويجيب ايه معاه واذاى يتكلم<br />غلط طبعا كل ده<br />افرد او افردى ياللى كاتب الموضوع ده ان معظم اللى قراه نفزه وبعد الجواز بان على حقيقته<br />يبقى ايه الحل دلوقتى<br />انتم عايزين اللى يضحك عليكم لحد مايتجوزكم ولا اللى يصارحكم من البدايه وياوافقتم او لا<br />او تحاولو تغيره منه<br />مش يضحك على الواحده فى اول كام مقابله بينه وبينها هيه واهلها وبعدين يطلع لا عنده زوق فى لبس ولا بيعرف يتكلم ولا بيفهم فى الزوق ولا بيستحما اصلا<br />انتم حرين<br />ذمبكم على جنبكم"
archived = "2009-12-06"
capture_url = "https://web.archive.org/web/20091206044212/http://www.20at.com:80/20at/lifestyle/13779-2009-10-21-10-54-21.html?"

