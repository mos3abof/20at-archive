text = "من أفشب المواضيع وأكثرها سطحية إللي قريتها في حياتي .. كل الكلام علي المظهر ولفة الهدية والريحة … كا فيش أي كلام علي إيه النقط إللي تكلمها فيها أو تعرف شخصيتها إزاي"
