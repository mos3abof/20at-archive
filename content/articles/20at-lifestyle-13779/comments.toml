text = "اقتباس واقعى:<br />الكلام جميل بس المشكلة فى شباب كتير بيعملوا كل ده وفى الاخر بيخدوها تسلية يعنى ايه الف جنية مثلا مصاريف وهدايا مقابل الخروج مع بنت ويمسك ايديها ويعمل اللى انتو عارفينوه بعد كده وفى الاخر يقول معاش يا حبيبتى مش هاينفع نتجوز اصلى مسافر او يتحجج بأى حاجة ويشوف غيرها وطبعا ده خطيبها رسمى يعنى محدش يقدر يتكلم حتى البنت لو حصل حاجة بينهم مش هاتقدر تتكلم من الكسوف …صح ولا ايه؟<br />الكلام دة كان زمان لان كان حبة محترمين و مش بيخرجوا مع حد لكن دلوقتى خلاص يابرنس من غير خطوبة و لا ديولو اى بنت انت ممكن توقفها فى الشارع و تخرج معاها من غير مشكلة و اخرها شيشة كو باية شاى و اعمل لاى انت عاوزة و يسلام لو معاك عربية عليك و على المقطم بس روح بدرى علشان هتلاقية زخمة ز مش هتلاقى مكان<br />و انات مش محتاج تتكلم فى الحب لان البنات دلوقتى بتضبضن من الاكلام الرومنسى جيب من الاخر معاها"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135720/http://www.20at.com:80/20at/lifestyle/13779-2009-10-21-10-54-21.html?utm_source=Facebook&utm_medium=CPM&utm_campaign=Home+Page+Facebook"

