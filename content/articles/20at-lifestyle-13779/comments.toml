text = "موضوع جميل جدا جدا…و أنا أحييكم بجد على الفكرة جمييييييلة جدا…تسلمو كتير…والحمدلل ه انى عملت كل اللى اتقال ده لأنى كنت هخطب 3 مرات بس محصلش نصيب…ممكن وقعت فى بعض أخطاء من اللى قولتوها زى حركة الموبايل و أجازة العمل والترابيزة الواسعه فى المكان…شكرا ليكم كتير جدا وان شاءالله لو لقيت عروسة اساسا هبقى اعزمكم ان شاءالله…ولو عرفتو تعملو خاطبة على الفيس بوك تبقى فكرة جديدة و جامده جدا ههههههههههههه…إلى الأمام دائما وربنا يوفقكم"
