text = "الكلام كويس فى اغلبه لكن مستفز فى بعض النقط - و كأن البنى ادم رايح يخطب ملكة انجلترا هههههههه - زى ما العروسه بتشوف الشاب و ممكن تقبل و ترفض - هو كمان ممكن يرفض - يعنى مش لازم يشوفها بالسطحيه انها ممكن توافق عليه عشان بس مظهره كويس و بيقولها انت صح فى كل اللى بتقوليه ؟ !"
