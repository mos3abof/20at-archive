[[comments]]
order = 73
subject = ""
author = "أحمد المصرى"
posted = "2010-02-11"
text = "يعنى انا بوجه كلامى لصاحبة الموضوع و عن تجربة شخصية انا لم روحت اخطب اتصرفت بطبيعتى جدااااااااااااا ا و لا كنت بتصنع و لا كنت بمثل و كملت على كدا على طول يعنى بجد انا كنت لابس اكنى نازل اى مشوار لأنى الحمد لله على طول مهتم بمظهرى لكن كونى انى امثل او البس حاجة مش بلبسها او اعمل حاجة مش بعملها فى الظروف العادية , احب اقولك انا لو عملت كدا يبقى الغرض من المقابلة دى ايه؟؟ تقدرى تقوليلى؟؟؟<br />المفروض اول مقابلة دى ان الاتنين يشوفوا بعض على طبيعتهم و يقعدوا يتكلموا شوية بعيد عن غرض الجواز او عن غرض \"انا على فكرة جاى اتجوزك\". بالعكس يقعد و يفتح مواضيع عادية جدا و احب اقول للبنت بردو متتصنعش علشان كلو بيبان بعد كدا , طب مدام كلو بيبان بعد كدا يبقى اتصنع ليه من الاول و اجيب لنفسى مشاكل بعد كدا و تقولى انتا كدا بنت على حقيقتك. كفاية اقنعه بقى و كفاية تمثيل و الله الكلام دا اللى زود نسب الطلاق بطريقة رهيبة علشان فترة الخطوبة بقت فى معظم الاحيان فترة تمثييييييل. و من ناحية تانيه انا مشوفتش كلمه بتتكلم عن تدينه او اخلاقه او شخصيته كلها بتتكلم عن حاجات سطحية و لفة هدية"
archived = "2010-02-12"
