author = "عروسة لقطة"
posted = "2009-12-05"
text = "1- متركزش على السطحيات الا لو كان هى سطحية (اغلب البنات) ونقول الف مبروك للعريس السطحى الهنحضر فرحة فوق السطوح<br />2- تحاول تكون بشوشة (متديلوش وش خشب يعنى) حتى لو العريس معجبهاش لان بعض ال[ *** ]ان مبتصرفوش بطبيعتهم الا لو حسو بقبول من الطرف التانى و دى نقطة مهمة جدا بينخدع فيها كثير من البنات<br />3- متخليش حد يتكلم بالنيابة عنها<br />4- تبطل استعباط<br />5-تعرف حقوق الزوج قبل ما تفكر تقابل اى حد<br />و فى حجات تانية كتير و ربنا يهدى البنات"
archived = "2009-12-06"
