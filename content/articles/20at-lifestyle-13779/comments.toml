author = "لفيت كتير"
posted = "2009-12-05"
text = "كلام جميل و مظبوط اول مقابلة بتكون اهم حاجة فيها هيئة العريس و العروسة … و القبول بيتوقف على 70% من الانطباع الاول .. لان الانطباعات الاولى تدوم<br />لكن فى بعض النقط احب اوضحها …<br />بالنسبة لجواز الصالونات مش مهم اوى موضوع الهدية تكون قيمة اوى فى اول مقابلة لان اول مقابلة يفضل فيها التصرف بصورة طبيعية و غير مبالغ فيها دا غير ان العريس بيبقى حاطط فى دماغة انة مش ناوى ياخد خطوة لادام و يعمل مجهود كبير ليتخطى حاجز الاسرة و يتعرف على البنت بصورة واضحة الا لو كانت هى كمان تستاهل كل دا<br />دا غير انة بيبقى حاطط فى دماغة ان فى غيرها كتير فمش فارقة يعنى يجيب هدية او ميجبش … اما فى ازيارة التانية لو حصل قبول من الطرفين … لما يجيب العريس هدية قيمة يبان انة مقدم بصورة جدية و يلفت نظر البنت انة معجب بها فعلا …"
archived = "2009-12-06"
capture_url = "https://web.archive.org/web/20091206044212/http://www.20at.com:80/20at/lifestyle/13779-2009-10-21-10-54-21.html?"

[[comments]]
order = 35
subject = ""
author = "Ibrahim"
posted = "2009-12-05"
text = "اقتباس أسطورة الخريف:<br />الكلام ده مش واقعى على الأطلاق..أعزم البنت فى مكان غالى وأطلب لها لها كذا طلب عشان أبان أنى مش بخيل..بس أنا لو عزمتها وهى اللى طلبت كذا حاجة ليه نتقولش أنها هى اللى أنتهازية ومش بتحس..<br />وبعدين لو هنتكلم على البنات المصريات بجد مش هتلاقى فيهوم مزايا كتير دول عايزين يصطادوا راجل ويعتمدوا عليه طول عمرهم<br />اللى سافر بره وأتعامل مع البنات الأجانب يقدر يفهم يا عنى أيه الشخصية غير الأعتمادية يقدر يفهم معنى المشاركة والأهتمام بالأخر…الواحد مش عايز يشترى عروسة..المفروض الواحد بيدور على حد يشاركه حياته<br />نصيحة.أبعدوا عن المصريات خالص<br />لو الواحد ما يتجوزش مصرية من بلده .. امال يتجوز منين ؟؟ الست دي حتبقي ام اولادك<br />لو اتجوزت واحدت اجنبية .. حتلاقي فيه اختلاف كبير قوي في المستقبل في حاجات كتير<br />وسيبك من حوارات المخ الكبير والعقلية المتحضرة صدقني مش حتحس بيهم عند اول مشكلة"
archived = "2009-12-07"
capture_url = "https://web.archive.org/web/20091207065548/http://www.20at.com:80/20at/lifestyle/13779-2009-10-21-10-54-21.html?utm_source=Facebook&utm_medium=CPM&utm_campaign=Home+Page+Facebook"

[[comments]]
order = 36
subject = ""
author = "مؤمن"
posted = "2009-12-06"
text = "كلام بيعبر فعلا عن دماغ البنت المصرية ودماغ أمها, أدمغة وثقافة مليئة بتفاهات الأمور غير مهتمة إلا بالقشور, أدمغة مستعدة لتقديم أعز ما تملك لمن يشبه الممثل فلان أو لمن يمتلك الكثير من الثروة تضح من ملابسه وسيارته ومسكنه ونوع الشيكولاته اللي جايبها معاه, أو ممن يهتم بالوجاهة والسخافة الإجتماعية حتى لو كان أقرع ونزهي<br />أدمغه طلعت لنا بقوانين فاسدة من أمثال إتجوزي خاين وماتتجوزيش بخيل و ان لم يقدم لكي عزيزتي إلا مشروب واحد فهو بخيل!!<br />عقليات لا تعرف أي شيء عن المشاركة ولا العلاقات عموما والجواز تحديدا, عقليات في صباها لا ترتبط إلا بال Losers أفشل الناس ممن لا يهتمون إلا بالتفاهات وإقامة العلاقات, وفي مرحلة النضج ان جاز التعبير لا تبحث إلا عن المال وبعدها يمكن فبركة قصة حب تحكيها لصديقاتها وتضحك بيها عليه وعلى نفسها لزوم الرومانسية, وان كان يسيء معاملتها فستستمتع بالشكوى منه له وللناس, فهي تتلذذ بذلك<br />وان صادفت شخص جيد لا يمتلك المال ترفضه بحجة انه بخيل والعياذ بالله أو أنها لا تشعر بالحب تجاهه أو أنه ليس حسن المظهر أو أشياء من هذه, وان قبلته لتأخر سن الزواج أو لغير ذلك لا تقدم له أي شيء"
archived = "2009-12-07"
capture_url = "https://web.archive.org/web/20091207065548/http://www.20at.com:80/20at/lifestyle/13779-2009-10-21-10-54-21.html?utm_source=Facebook&utm_medium=CPM&utm_campaign=Home+Page+Facebook"

