text = "اقتباس والله انتم عالم فاضي:<br />بقى بدل ماتتكلمو فى اشاء مهمه عن الجواز وعن المسؤليه اللى بعد الجواز سبتوها وماسكين فى اذاى يلبس ويجيب ايه معاه واذاى يتكلم<br />غلط طبعا كل ده<br />ا<br />انتم عايزين اللى يضحك عليكم لحد مايتجوزكم ولا اللى يصارحكم من البدايه وياوافقتم او لا<br />او تحاولو تغيره منه<br />مش يضحك على الواحده فى اول كام مقابله بينه وبينها هيه واهلها وبعدين يطلع لا عنده زوق فى لبس ولا بيعرف يتكلم ولا بيفهم فى الزوق ولا بيستحما اصلا<br />انتم حرين<br />ذمبكم على جنبكم<br />الموضوع واخد الطابع المادى<br />ياجماعة البنت المصرية صعبة جدا و عشان كدا بيعنسو بالملايين برفان ايه وغسيل سنان ايه تعالي اركبي المترو وشمي ريحتكو عامله ازاي<br />المفروض على الأقل يكون عندهم شىء ملفت للنظر .. علشان تسستاهل أن الواحد يحاول كل جهده أنه ينول الإعجاب.."
