text = "كل الكلام دة جميل و طبيعي جدا.. بس مقابل الطلبات الشكلية اللى أنت أهتميتي بيها.. أنا حاسس أن المستوى العام للبنات اليومين دول سواء فى الشكل أو المضمون لا يشجع إطلا قا على الإرتباط.. يعنى الواحد فينا بيعانى علشان بس يلاقى بنت جميله..و زكيه و شيك و معندهاش أى مشاكل نفسيه… أنا شايف أن البنات اللى نفسها فى عريس بالشكل ده .. المفروض على الأقل يكون عندهم شىء ملفت للنظر .. علشان تسستاهل أن الواحد يحاول كل جهده أنه ينول الإعجاب.."
