text = "انا عندي 29 سنة و جاهز للجواز لكن شفت اكتر من 15 عروسة<br />معظم البنات ناويا تغد في البيت من غير شغل مستنية جوزها يفسحها و يا سلام لو في بنت شغالة هي اللي تشوف البيت و الأكل يبقي دليفري يعني من الخر بطة بلدي مأنتخة (والله الشغالة اجدع منكوا)<br />انا عامل التشطيبات في الشقة بتاعتي ما عدا لون الحيطة قوم الاقي واحدة تقلك انها مش عايزة الحمام جوهرة عايزاه كيلوباترا و التانية تقولك غيرلي الرخام و هاتوه باركيه …جتكوا نيلة<br />يا سلام علي ابوها لو الموضوع دخل في الجد و راح يتفرج علي شقة يقولك التجمع الخامس بعيد و المنطقة محتاجة تعمر بيع الشقة و اشتري واحدة تانية في مصر الجديدة …و امها تقولك الأود صغيرة…ازاي اودة نوم 5*4 تبقي صغيرة و بعدين شقة 360 متر في التجمع متنفعش يبقي فيها حاجة صغيرة…و تلاقي الولية اتجوزت في شقة 60 متر<br />و لما تيجي تتكلم في التفاصيل و تقول الخشب النص بالنص تلاقيهم شيفينك لقية و يحاولوا يلبسوك و بالذات لو شايفين بنتهم حلوة…يعني الموضوع بقي من يشيل مين<br />جتكم القرف انا بقالي سنة بدور علي واحدة عدلة تشيل مسئولية بيت مش لاقي …يا تافهين حسبي الله و نعم الوكيل"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135720/http://www.20at.com:80/20at/lifestyle/13779-2009-10-21-10-54-21.html?utm_source=Facebook&utm_medium=CPM&utm_campaign=Home+Page+Facebook"

