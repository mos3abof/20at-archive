text = "اقتباس قرفان:<br />وان الشاب نايمله على زكيبه فلوس اد كده وهيجيب الشقه اللى بتطل على كوكب المشترى والمطبخ والحمام بيطلوا على الزهرة<br />ههههههههههههههه ههههههههههههههه ههههههههههههههه ههههه<br />مان ، انا ضحكت للركب ، بجد إففيه جامد حرق<br />أه ، هاضيف تعليق متواضع لخبرتي المتواضعة في الموضوع ده<br />1) إذن ربنا سبحانه و تعالى ، و ده إنت ماتفكرش أو ماتفكريش فيه بعقلك المحدود ، توكل و خليه في بالك<br />2) إختيار العروسة أو العريس<br />3) و خد بالك يا حبيبي إنت و هي ، نيه سعادتك هاتحدد مسار حياتكم من ناحية فيه بركة ولا مافيش ؟<br />4) لو حد عايز يسأل سؤال أو يشتم أو يتريق أو مايردش خالص ، يتفضل هاسمعه<br />كل سنة و إنتوا طيبين<br />\"قال يعني انا عامل فيها كبير بأه و بعيد عليكوا و بسجدلكوا\" ، ربنا يشفي"
