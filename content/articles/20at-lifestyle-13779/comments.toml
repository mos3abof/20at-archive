text = "اقتباس MIZOO:<br />البنات دي كائنات رقيقه وصعب تملك قلبها فالأول ولو وصلت لده سهل أوى تشكلها على كيف كيفك .<br />بصراحه عجبنى رد الاستاذ يحى فعلا البنت بتحلم بشخص تتباهى بيه ادام صحباتها فلازم تطلع الشخص اللى فى خيلها لو انت عاوزها .<br />بجد انا مش عارف لية كارة كل البنات و مش عاوز ارتبط خالص و على فكرة انا معنديش اى عقد عاطفية بس البنات الى بشوفها فى االجامعة و لبسهم و لون سنانهم من الشيشة و طريقة لبسهم و الى بشوفهم منهم خليتنى اكرههم و مستحقرهم و خلتنى ابسلهم نظرة احتقار لاى بنت"
