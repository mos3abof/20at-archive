text = "اقتباس مصطفى:<br />احب اقول للصاحبه الموضوع ده بلاوكسه وكتكو ستين نيله على خيبتكو هو انتو لاقين [ *** ]ان اساسا برفان ايه وغسيل سنان ايه تعالي اركبي المترو وشمي ريحتكو عامله ازاي ههههههههههههههه ه, وعجبتني اوي كلمه اكوي القميص كويس ومن غير كرمشه ده على اساس انكو بعد الجواز بتكونو مهتمين او بالحاجات دي انتو اساسا مبتصدقو تتجوزو وبعد كده بتكونو قاعدين مبلطين في الخط زي خيبتها كتها نيله اللي عايزه خلف<br />kol klamk sa7 ya man"
