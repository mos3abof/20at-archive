posted = "2009-12-08"
text = "ايه كمية التفاهة دي اينعم مهم انه يبقى جاي شكله عليه الطلا ومستحمي يعني مش جاي من الاتوبيس على البيت عدل لكن اكتر من كدا طلبات يبقى تفاهة محضة حاجة مستفزة والكلام دا اللي مخلي الشباب هربان من الجواز وسنينه , يا جماعة لسه في بنات محترمين طالبين الستر وواحد ابن حلال يكافحوا سوا وراضيين برزقهم والله لسه موجودين وانا واحدة منهم اهو اهم حاجة الاقي قدامي راجل محترم يراعي ربنا فيا وانا هاديله عنيا الاتنين ودا مش اعلان جواز لكن دي حقيقة انا شايفاها في نفسي وفي بنات كتير حواليا كدا وبنات من احسن العائلات وقمة في الاخلاق والثقافة والعلم"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106135720/http://www.20at.com:80/20at/lifestyle/13779-2009-10-21-10-54-21.html?utm_source=Facebook&utm_medium=CPM&utm_campaign=Home+Page+Facebook"

