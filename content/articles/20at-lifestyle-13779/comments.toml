text = "ربنا معانا يا شباب و قبل متفكر تخطب اسلأب عليها كويس فى المنطقة بتاعتها و متستعجلش و لما تخرج معاها حاول تكون صاحبها و اعزم عليها بسجاير علشان معزم النات دلوقتى بيدخنم و لو بتشرب سجاير او شيشة اهرب فى اقرب فرصة لانها كدة مقضيها فى الكافيهات و طبعا مش لوحدها و خالى بالك من صاحبتها لو فى بنت من شلتها مش عاجباك اهرب بسرعة علشان دية هتكون اقرب صديقة ليها و من الا فضل دور على بنت معاها دبلوم تجارة لانها هتكون خلصت و اعدا فى البيت لكن لو فى جامعة هتكون مقضيها و ابعد عن اى بنت فى معهد و بالذات الخدمة الاجتماعية و عبدو باشا و اى معهد فى مدينة نصر لحسن خربنها هناك و احترس من بتوع اداب ولو هية فى عين شمس عليك و على ممر جيمى شوفها لو بتجلس هناك تبقى بنت متمردة و هتتعبك ولو بنت على طول تقول صاحبى الانتيم و متحورش و الكلام دة من الاخر اهرب فى اول قطار و اهم حاجة فى البنت اعرف معاها كام موبيل و كام رقم تليفون و لو معاها اكتر من رقم"
