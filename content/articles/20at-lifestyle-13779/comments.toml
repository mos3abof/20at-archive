posted = "2009-12-05"
text = "الكلام ده مش واقعى على الأطلاق..أعزم البنت فى مكان غالى وأطلب لها لها كذا طلب عشان أبان أنى مش بخيل..بس أنا لو عزمتها وهى اللى طلبت كذا حاجة ليه نتقولش أنها هى اللى أنتهازية ومش بتحس..<br />وبعدين لو هنتكلم على البنات المصريات بجد مش هتلاقى فيهوم مزايا كتير دول عايزين يصطادوا راجل ويعتمدوا عليه طول عمرهم<br />اللى سافر بره وأتعامل مع البنات الأجانب يقدر يفهم يا عنى أيه الشخصية غير الأعتمادية يقدر يفهم معنى المشاركة والأهتمام بالأخر…الواحد مش عايز يشترى عروسة..المفروض الواحد بيدور على حد يشاركه حياته<br />نصيحة.أبعدوا عن المصريات خالص"
