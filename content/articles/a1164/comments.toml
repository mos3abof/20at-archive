subject = "من فلسطين"
text = "السلام عليكم<br />صحيح لإنوا هذه الأفلام دعوة للمسخرة<br />لكن بيجي المخرج أو بطل الفلم يتكلم بكل وقاحة :<br />أنا بحمل رسالة<br />الله يلعن أبوك على أبو رسالتك<br />مثال ذلك :<br />سؤل محمد فؤاد : لماذا اخترت هذا الموضوع لقيديو كليب أنا لو حبيبك ( كانت فكرة الكليب عن الطلاق )<br />شو رد وقال : أنا شفت ان المجتمع المصري تنتشر فيه نسبة الطلاق بكثرة فحبيت أحل المشكة<br />شوفوا العاهر ابن ال . . . . . بديش أكمل<br />هوهذا اللي بدوا يحل مشكلتنا<br />ان تدبر وتفسير آية (إن أبغض الحلال عند الله الطلاق ) لكفيل أن يحجم الزوج عن تطليق امراته ولكفيل أن يمنع المراة عن طلب الطلاق المتكرر<br />لكن وين الدين<br />أما عن بناتنا العربيات<br />فذنبهن في رقبة أهلهن<br />هؤلاء الاهل سيسألوا يوم القيامة<br />هناك فراغ تربوي كبير في الوطن العربي<br />وأنا أتحدى الكون والدنيا كلها لو حد طلعلي بنت تربت على القرآن والصلاة في جو عائلي متماسك وانحرفت فيما بعد إلا عن طريق صديقتها . . وهذه المشكلة تعود للأهل يعني لا يوجد هناك مشكلة إذا تربت البنت على الدين<br />وحاليا الوضع بدو ردع<br />والسلام عليكم"
archived = "2005-06-09"
capture_url = "https://web.archive.org/web/20050609075417/http://www.20at.com:80/article.php?sid=1164"

