text = "كاااك كاااك كااااك.<br />تعالي نشوف واقع الافلام من زمان.زمان قوي.قبل 65 سنة.<br />كان المصريين شعب ملتزم ومتدين.لو اتفرجتي علي افلام ثورة 19 كل الستات كانوا لابسين نقاب.كمان فيلم بين القصرين\" سي السيد\" بينقل الفترة دي.<br />جه عصر الانفتاح ما تعرفيش منين.والمناداه بحرية المرأة وخلافة انكب علي مصر من اليمين والشمال.لو تلاحظي مثلا كل صور\" روز اليوسف \"كانت فيها بشعرها.طبعا روز من السيدات الاواءل اللي كانوا بيطالبو بتحرير المرأة.<br />وبدأ عصر السينيما.<br />الفيلم الواحد فيه مش اقل من 5 اغنيات.الواحد لما يتفرج علي كمية الرقاصات اللي بيجوا ف كل فيلم بيقول هو مين فضل في مصر ما بيرقصش.<br />حتي الفيلم الي بيجيب قصة بنت من حي شعبي كان بيجيبها شفتشي. علي راي صباح في احد افلامها\"فستان شفتشي من اللي بيبين كل اشي\"<br />سيبنا من كل دا وخلينا نفهم اللعبة ماشية ازاي.وعلي فكرة اللعبة لحد دلوقتي بتتلعب. وهي كالاتي:<br />الفيلم لازم بنت تتعرف علي شب.وتعمل معاه ميعاد.وبيكون ليها صاحبة.<br />طبعا البطلة اللي احنا متعاطفين معاها بتخرج مع حبيبها والبوس وارد ومفيد في المشاهد.تيجي صاحبتها تغلط مع الشب التاني وتكون نهايتها وحشة.وتنتهي بان التانية اخرتها وحشة.اما البنت البطلة اللي حبت وخرجت وباست بس نهايتها سعيدة.فتوصل الرسالة ان اخرجي يا بنت واعملي مواعيد واغلطي خفيف خفيف.مش هيضر.<br />مثلا الفيلم الجديد بتاع البنت اللي عنها سرطان دي.اسمة انت عمري تقريبا.بتاع احمد سلامة\"مش فاكر بالضبط\".بس شوفي اللي رايحة تموت وهي بترقص بدل ما تحترم نفسها.<br />الواحد بيكون متدين ف الغالب لما بيموتلو واحد.ولما بيقرب موته لكن دي علي ودنة.<br />اذا هنتكلم ما ننساش اتلزعيم عادل امام ف افلامة اللي ........ربنا يستر علي عرض يسرا وشيرين.<br />وف النهاية بسلامته بيطلع يشتم عمر خالد.<br />اذا عايزة تحليل لأفلام عادل انا مستعد هبينلك ان الصراع ف مصر هو صراع لعدم انتشار الاسلام لان لو جي الاسلام كل اللي بيمثلوا هيفقدو المهنه المبتذلة والفن الرخيص.<br />انا اسف المحاضرة مش فنية علي قد ما هي بتمس الاسلام.<br />بس لحد دلوقتي في الجرايد والمجلات هيفاء وهبي كبرت الثدي بكام ونانسي عملت عملية ف مناخيرها بابصر كام.واللي بيدفع التمن الشاب العربي الخاوي.وشكرا علي تلميحاتك الظريفة يا نونا."
archived = "2005-06-09"
capture_url = "https://web.archive.org/web/20050609075417/http://www.20at.com:80/article.php?sid=1164"

