subject = "عقلاني: ما اسخم م البت الا الولد."
text = "من المعروف عند العرب ان المرأة تعير\"تتعاير يعني\" اكثر من الرجل.يعني اذا مارست البنت الرزيلة وحملت فان الاب يذبح البنت او يتاويها ويكون من مارس معها في السليم. بصوا علي فيلم دعاء الكروان ولا تشبية.<br />الاولاد دايما يتغطي امهاتهم عليهم بقولهن\"دول شباب طايش\"<br />والاب بيقول ابني متهور ودا طبيعي.ويخلقوا للشب عزر عند الغلط ولكن ساد العرف ان البنت مش طايشة.ومستكينة مكسورة الجناح .مع ان المراة العاملة في مصر مش مكسورة الجناح.<br />لكن اعتقد ان الهجوم علي الاسلام ما بيتهدفش الشباب الذكور ويسيب الاناث.من سنين وسنين وهو بيستهدف الذكور ولكن متأخر جدا اكتشفو ان لو عايز تفسد المجتمع افسد المرأة لأنها الام والاخت والزوجة والحبيبة\"ولا مؤاخذة\" والام مدرسة لو فاسدة ولادها وبناتها هيكونو زيها ونظرية يخلق من الفسيخ شربات مش دايما سليمة.<br />عشان كدة كل واحد فينا بيخاف علي اختة وعلي مراتة .<br />السؤال هنا هو ليه الكل بيقول \"لو مس حد شعرة من اختي هقطعو.او لو مس حد شعرة من مراتي هقطعة وهكذا. ليه شعرة!!!! معني كدا ان مراتة بشعرها وان اخته بشعرها .<br />طيب طالما انت مسرحهم بشعرهم ولا مؤاخذة اكيد اللي طالع ونازل هيمس شعرهم.والاتوبيس مترو الانفاق احسن مثال.<br />حد فهم حاجة!"
archived = "2005-06-09"
capture_url = "https://web.archive.org/web/20050609075417/http://www.20at.com:80/article.php?sid=1164"

