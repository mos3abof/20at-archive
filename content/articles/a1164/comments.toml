text = "اولا شريف صبرى وعباره نصف بنات...العبارة المحذوفه من الرقابه لم تكن على لساته بل علي لسان احد شخصيات الفيلم الغارقه فى نزواتها. ثم ناقل الكفر ليس بكافر . وبغض النظر عت افكاره فاعلانانه فى التلفزيون لا تدعو الا لتعليم البنات ..الخ وهو شى لا ىجب رفضه لمجرد صدوره منه وهو دكتور فى التعبير لانه بجبد النعبير عن وجهة نظره وهذا لا علاقة له بوجهة نظرنا<br />ثانياالدول الغربيه التى لابد ان نعترف بتفوقها اقامت هذا كله على مبدا الحريه التى تفسرهابضروره الانحلال وهذا كلام خاطى فالحريه ليست ضدنا ابدا,وكل انسان حر بعد ذلك فيما يفعلهحلى او اراد الانحلال فهذا شانه ونحن نعرف اعداد المسلمين باخارج في ظل مناخ الحريه ونعلم كم كان سيكون لو عاشوا بنفس عقاية فرض الراى التي نعيش في ظلها<br />اغنيه ارخلي الستاره غنتها متبرة وليس عبد الوهاب"
