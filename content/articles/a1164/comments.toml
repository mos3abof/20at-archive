subject = "hanaa_ghoniem@yahoo.com"
text = "مشكلة كثير من البيوت الشرقية ... إننا نتطور وبدون وعي وننجذب لمضمون وثقافة الفكر الغربي ونطبقه على أنفسنا بأنفسنا بالرغم لرفضنا الكثير من لأنه مخالف لشريعتنا ولكن بدون أن نشعر ...!!! وكأننا منومين مغناطيسيا لأنه يوافق هوى النفس والنفس أمارة بالسوء...!!!<br />فلو راجعت على مدى قرن من الزمان وابحث عن المفهوم والمعتقد والثقافة التي كان يتدوالها الوطن العربي المأسوف عليه!!! كان ينهج وينهل من الثقافة الغربية وليته نهل علمها بل نهل حتى النخاع منها كل انحرافاتها النفسية ومشاكلها وكيفية مواجهة المشاكل بطرق ملتوية وتثبت لك في النهاية مقولة \"أنا ومن بعدي الطوفان\". فكر في نفسك أولا وأحب نفسك أولا حتى تستطيع أن تفكر في الآخرين وتحب الآخرين ... ولم يقل كما قال الإسلام وعلمنا الرسول صلى الله وسلم وبارك عليه وعلى آله وصحبه وأزواجه وذريته أجمعين<br />\"لا يؤمن أحدكم حتى يحب لأخيه ما يحبه لنفسه\" وبدأت ثقافتهم تتغلغل فينا وبدون أن نشعر كمن يقدم لك السم في ملعقة العسل فلا تستبين طعم السم إلا بعد أن سرى في جسدك وشله ثم تبدأ في الصراخ طلبا للمساعدة ولكن يكون الأوان قد فات ...!!!<br />عندما أطالع حتى ثقافتي الشخصية والتي لا تختلف بحال من الأحوال عن أقراني من نفس جيلي تجدها واحدة وإن اختلفت كمية الجرعة من شخص لآخر كل على حسب قدرته على تجرع الكمية التي تناسبه...!!! أرجع مرة أخرى إلى الثقافة التي ربينا عليها منذ نعومة أظافرنا في المدارس الأجنبية ... ماذا كنا ندرس؟ ماذا كنا نتعلم؟ ما الفكر الذي كان يحشر في عقولنا وتختزنه عقولنا؟ ثم نفرغه في تصرفاتنا وميولنا ومنها لمبدئنا الذي نعيش به ؟؟؟ دراستنا الغربية المغلفة بأنها عربية وهي في حقيقتها غير ذلك تماما هي ما أودت بحالنا لكل هذا الخنوع وهذا الانحلال وهذا ما يسمى بالفكر المتحضر ( من وجهة نظرنا المتخلفة ) وهو في حقيقة أمره ما هو إلا تخلف ورجوع بل قل هو في أصله شرك خفي ...!!!<br />معظم ما درسناه في مدارسنا الأجنبية ما هو إلا فكر الغرب المحض... الفكر المتخلف المنحل الذي يجعل قانون الإنسان هو قانون الأرض وليس ما وضعه الله في كتابه من تشريع وقانون حتى تسير وتتقدم هذه الأرض وتزدهر بما يرضي الله عنا فيزيدنا ويكرمنا وننال ثواب الدنيا والآخرة...<br />ولكن فلت منا من فلت وأنار الله طريقه وبصيرته لأنه يهدي من يشاء ...وتغلب الفطرة وترفض كل هذا التخلف وتحاول جاهدة البحث عن الحقيقة ثم ترجع لأصلها في الأساس<br />وهو الدين الذي هو طوق النجاة من كل ما يحيق بك من تيه وظلام وخنوع وضياع... تحاول استنباط الحقيقة من وجودك ...الهدف الذي من أجله خلقت على هذه الأرض ...<br />الحقيقة الواحدة التي من أجلها تحي وعليها تموت... وأنت وحظك فيمن تقع في أيديهم ويحاولون مساعدتك أو إغراقك أكثر مما تركوك لربما نجوت بقدرة من ربك...<br />أنا طبعا كتبت هذه المقدمة لتوضيح أمر ما ...<br />وهو مفهوم الزواج والحب حواء العربية ...<br />تلك المرأة التي ظلمت وقهرت وأهينت واغتصبت كل حقوقها من رجلها العربي!!! ومن بعدها يرمي عليها كل عقبات الأمور وبأنها سبب وأس كل المشاكل في العالم بأسره وليس حتى في محيطه هو!!! نعم يا سيدي فنحن لسنا نتاج ثقافة عربية إسلامية صرفه حقه!!! بل نحن نتاج مشوه من ثقافات متعددة ومعظمها منحل أخلاقيا لا يعترف بالقوانين الربانية<br />والتي وضح فيها النفس وأعطاها حقوقها كاملة غير منقوصة وألزمها بواجبات حتى تتزن حياتها وتتقدم للأمام بل بقانون الغاب !!! قانون هوى النفس!!! الشرك الخفي!!!<br />لذا تعذبنا وعذبنا غيرنا وكلنا سيافين وجلادين وحكام ومحكومين في بعضنا البعض لن ينجو أحد من العقاب !!! العقاب ليس ربانيا فقط!!! بل عقاب وضعناه بأيدينا على أنفسنا وحكمنا بأنفسنا به!!! ولكن لن أعفي الرجل من واجبه الأول ومسئوليته الأولى والتي هو في الأصل لا يفهمها ولا حتى يحاول فهمها...!!! بل دائما ما يلقي بتبعاتها على المرأة!!!<br />والمرأة بدورها عندما تصل لذروة يأسها ترمي بكل ثقلها على الرجل وتكون المصيبة الكبرى!!! لقد وضع الله القوامة في الرجل ليس من فراغ (حاشا لله) ولكن وضعها لما خلقه به وعليه ويسره له... ووضع للمرأة أيضا ما خلقه بها وعليه ويسرها لها... ولكن هل التزم الرجل بما خلقه الله عليه وأعطاه من حقوق وألزمه بواجبات؟؟؟<br />هل فعلت المرأة كذلك؟؟؟ لا وألف لا... لا هو ولا هي التزما بما لديهم من حقوق وواجبات ... من هنا ظهرت كل تلك المشاكل العقيمة والتي لم يكن يسمع بها من قبل؟؟؟<br />حتى وإن وجدت مشاكل من قبل وهي لا تختلف بكثير عن يومنا الحاضر ولكن حلولها موجودة وكانت تصاغ وتطبق بما يرضي الله ورسوله صلى الله وسلم وبارك عليه وعلى آله وصحبه وأزواجه وذريته أجمعين وكانت تواجه وبدون إلقاء أي عتاب أو لوم أو تحميل أحد بأي إشارة من أي نوع بعد حل تلك المشكلة..<br />Read the rest of this comment..."
