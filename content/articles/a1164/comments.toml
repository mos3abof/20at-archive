text = "بسم الله الرحمن الرحيم<br />بداية احب افكركو بجمله قالها جمال الدين الافغانى<br />\"هؤلاء القوم اتفقو على الا يتفقو واجتمعو على ان يتشتتو \"<br />يمكن مش كتير هايفهم العباره دى او انا قصدى من وراها ايه بس اللى عايزه اقوله انها فعلا مشكله بس هل احنا درسنا نواحى المشكله دى علشان نحاول على الاقل نوجد لها حل اولا انا هاعلق على بعض الاراء اللى وصلت واللى قراتها فى عدة نقاط<br />1) الاعلام<br />الاعلام فى مصر والحمد لله جميل جدا وانا الصراحه معجبه جدا بيه وخصوصا الفنانه الكبيره نانسى واخواتها واسمحولى اقول نانسى واخواتها لانهم يستحقو اللقب ده (نانسى-هيفاء-روبى...........<br />والبقيه تاتى بس يا جماعه بجد المفروض انه على الاقل كل انسان عنده نسبة وعى حتى ولو بسيطه وعنده جزء متبقى من الدين الذى اوشك على الانتهاء من النفوس وانا باقول الكلمه دى وانا فعلا باقصد المعنى<br />2)الثقافه الغربيه وتعارضها مه تقاليدنا وعادتنا<br />وتحت العنوان ده ياريت نحط مليون خط احنا وبمنتهى لصراحه لازم نواجه نفسنا بالحقيقه شويه كل مره بنطلع بنطلع وننزل على مافيش وماشاء الله مااجدع الشعوب العربيه فى الشعارات والتهليل ومولانا السلطان جيه ومولانا السطان راح وزوجة مولانا ذهبت للكوافير واعتقد ان المعنى وصل انا عن نفسى كطالبه ثانويه انا مش هاقول انى مابحبش اطلع على الثقافات الاخرى بس على الاقل لما اعرف ان فى حاجه غلط او حرام ايه المانع انى ابعد عنها ولا لازم نبقى فى مود العولمه<br />3)الحاله الاقتصاديهوتاثيرها على الحاله الاجتماعيه<br />الصراحه الموضوع ده مش ناقص كلام لانه الحمد لله الناس فى مصر مستواهم المعيشى مرتفع جدا ده حتى بدل ماكانو بياكلو فول دلوقتى بقى فى طعميه كمان وانا عارفه قد ايه الحاله الماديه بتاثر على ظروف الناس بس فى اننا نحاول نخرج الطاقه دى فى شىء مفيد ينفعناوالصراحه انا نفسى اشكر جميع الساده المسؤلين واللى عملو اشد جهدهم فى تحسين المستوى الاقتصادى ولكن لظروف خارجه عن ارادتهم فقد احتاج رعية مولانا ومولانا ذاته ببعض الاموال حتى يشترى عدة اثواب جديده انتو عارفين بقى العيد وكل سنه وانتو طيبين واوى حد ينسى يعيد على مولانا واعتقد برده ان المعنى وصل<br />4)الدين<br />ويمكن انا خليته اخر حاجه لانه مش محتاج راى او محتاج اننا نتكلم الناس كلها بتقول الدين وربنا وقال الله وقال رسوله وانا باعتذر عن كده بس ده اللى باشوفه بس هل حد فكر الدين ده اتكلم ازاى وحللنا كل مشاكلنا هل حد فكر يستخدمه ولا احنا تبع مولان مولانا"
archived = "2005-06-09"
capture_url = "https://web.archive.org/web/20050609075417/http://www.20at.com:80/article.php?sid=1164"

