[[comments]]
order = 14
subject = "عقلاني :اللي عندة معزة يلمها"
text = "العنوان بتاعي وان كان غريب انما بيدل علي حاجة معينه.دا لفظ بنقولوة لما أخو بنت يقول لواحد تاني انت بتبص علي اختي ليه!.\"واخته لبسها يا وكييل.ما يفرقش عن السامعين من مغنيات اليومين دول\".ف الولد يرد علية ويقولوا.هو انا السبب!واللهي اللي عندة معزة يلمها.<br />اسف اذا جرحت شعور البنات.بس البنت ما بتلبسش حاجة ابوها ولا اخوها مش موافقين عليها.روبي اهلها عايزين كدة .<br />المهم مش دا كلامي.انا عاوز اوضح نقطة ف الاعلام المصري.<br />نبدأ بالجنوب.أهل اسوان والنوبة.<br />كان من اكثر الناس التزام بالدين اهل اسوان والنوبة.كانو مثال للاسلام والفبلية والحرارة والنخوة.<br />تعالو اتفرجوا دلوقتي هما ايه.<br />مفيو فيديو كليب للعرا الا ةفيها بنت من اسوان.<br />مفيش مسلسل بيرقصوا فيه الا في بنات النوبة\" الحج متولي\"<br />اغنية عودوني لعمر دياب.وبنات اسوان والنوبة الرخاص.<br />الفرقة الشعبية النوبية الي اين.البنات محجبة اه لكن بيتمايلن والهوا بيرفع فساتينهم ولا مؤاخذة.والايد ف الايد مع الراقص اللي جنبها.<br />شفتوا كنا فين وبقينا فين.ليه التدافع الاعلامي دا علي اهل الجنوب من اسوان والنوبة.اندفاع اندفاع عايزينهم يخربوا.وعايزين اخوانهم يكونوا ديوثين.<br />ما هو الديوث: الذي لا يخاف علي عرضة.<br />دا بس نموزج صغير عن اهل مصر.<br />في لسة بنات بحري وبنات قبلي.<br />لو فاكرين ذئاب الجبل.كان عندهم قبلية لكن سماح انور خرجت وهي بنفس شخصيتها وبناطيلها عن طوع اهلها ورجعت رافعة راسها واهلها اخدوها بالحضن متناسين اللي عملته من الزواج بغير ولي وكمان الانحلال المظهري اللي اهل الصعيد الاحرار ما بيعملوهوش.كل دي معالجات اعلامية عشان يقولولكوا اهو النموزج بينجح البنت لما تهرب من اهلها بتنجح.والرساله وصلت وشكرا."
archived = "2005-06-09"
capture_url = "https://web.archive.org/web/20050609075417/http://www.20at.com:80/article.php?sid=1164"

[[comments]]
order = 15
subject = "crazy nona"
text = "و انت ليه نسيت فاتن حمامة مش كانت بتحب عماد حمدي<br />و ابن عمها كان هيقتلها عشان خلفت من عماد حمدي<br />و ابوها عبد الوارث عسر راح مفاديها<br />و البت الغلابانة اتجوزت في الاخر دكتور زي الفل<br />و نسيت المسلسل الي فيه ريهام عبد الغفور اتجوزت عرفي مرتيين و بعدها اتجوزت ظابط عسل<br />لو تلاحظكل الافلام نهاية الجواز العرفي بانها بيجوزها يا للواد يا اما لواحد زي الفل<br />و عندك مسلسل بتاع يحي الفخراني بتاع عباس الابيض البت اتجوزت عرفي و كان هيقلبها لولا عباس الابيض كلمة حرك جواه الضمير<br />تعالي بص علي الواقع<br />الي بينول غرضة بيرمي البنت و يقطع الورقة و يدور علي الي بعده<br />دي هواية زي البيصطاد سمك و يرمية البحر و دي كلمة من فيلم السلم و التعبان"
archived = "2005-06-09"
capture_url = "https://web.archive.org/web/20050609075417/http://www.20at.com:80/article.php?sid=1164"

[[comments]]
order = 16
subject = "رغم دلك يوجد الدهب"
text = "وما لنا وللغرب ليذهب الغرب بنسائه إلى الجحيم انها مممتهنة في عقر دارها تربح المال من لديها جمال فان ذهب جمالها رموها كما ترمى ليمونة امتص ماؤها لكننا قلدناهم تركنا الحسن واخذنا القبيح اما كفانا تفكيراً برؤوس غيرنا اما كفانا نظراً بعيون عدونا اما كفانا تقليداً كتقليد القردة ليصنع بنات الغرب ما شئن وما شاء لهن رجالهن فما لنا ولهم وتكونى أنت كما يريد لك الله ربك فليس فى الدنيا اكرم منك واطهر ما تمسكت بدينك وحافظت على حجابك وتخلقت بأخلاقك الحسنة .<br />وهذا ما قاله المستشرق شاتليه: ( إذا أردتم أن تغزو الإسلام وتخضدوا شوكته وتقضوا على هذه العقيدة التي قضت على كل العقائد السابقة واللاحقة لها ، والتي كانت السبب الأول والرئيسي لاعتزاز المسلمين بشموخهم وسبب سيادتهم وغزوهم للعالم ، عليكم أن توجهوا جهود هدمكم إلى نفوس الشباب المسلم بإماتة روح الإعتزاز بماضيهم وكتابهم القرآن ، وتحويلهم عن كل ذلك بواسطة نشر ثقافاتكم وتاريخكم ونشر روح الإباحية وتوفير عوامل الهدم المعنوي ، وحتى لو لم نجد إلا المغفلين منهم والسذج والبسطاء لكفانا ذلك لأن الشجرة يجب أن يتسبب لها في القطع أحد أغصانها<br />منقول"
archived = "2005-06-09"
capture_url = "https://web.archive.org/web/20050609075417/http://www.20at.com:80/article.php?sid=1164"

