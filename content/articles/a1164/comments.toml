[[comments]]
order = 47
subject = "عقلاني:يا مين يجيب عقل ."
text = "البنات البنات.ألطف الكائنات.طا فا طيفي طا طا طا.<br />انا نفسي يا نونا لما بقرا كلامي بالعافية بفهم نصة.<br />يمكن يجي جيل بيفهم احسن مننا يقدر يفك الطلاسم اللي انا كاتبهعا.بس يا ريت ما يكونش شومبيليون اللي فك الحجر\"البكر الرشيد\" وللأسف طلعت فيه غلطة .<br />مشكلتنا احنا العرب اننا بناخد كل حاجة من الغرب.حتي الاخبار عن اجدادنا.يعني مين بيقول اخبار الفراعنه غير الفرنسيين.مين فيك حجر رشيد غيرهم ومين لحد دلوقتي مستولي علي نص الاثار غيرهم.<br />هما بقولولنا الفراعنه عملو كدة.واحنا وراهم.يا حبيبي جدك كان كويس يبقي كويس.جدك كان جزمة وعمل وعمل.يبقي كان جزمة.بالزمة مش حاجة تكسف.<br />التبعية للغرب ما بدأتش دلوقتي.دي بدأت بعد انهيار حكم محمد علي اللي رفع راس العرب.واللي انتهت بفضيحة للدولة العثمانية وبداية الثورة وبداية الانهيار الاخلاقي."
archived = "2005-06-09"
capture_url = "https://web.archive.org/web/20050609075417/http://www.20at.com:80/article.php?sid=1164"

