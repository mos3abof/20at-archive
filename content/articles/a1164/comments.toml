text = "ناس بعدت عن دينها وبقى كل هما المظاهر والشكليات وعلى حساب اى حاجة ناس كل همها انها تجمع المال باى طريقة مش مهم حتى لو بالحرام ومش بتفرق لام واب سايبين ولاادهم من غير رقيب فى اخطر مراحل العمر لناس موجوده فى بيوتهم ومش موجوده وانتو فاهمين اقصد ايه لاعلام عميل وقنوات مستهدفه الشباب دا لناس برة كل هدفهم تدمير الشباب دا واحنا بنساعده على كده<br />بس احب اقول حاجة زى مفى الوحش فى الكويس والوحش دا قليل الخوف انه ينتشر اكتر من كده وكمان دايما الصورة الحلوة بيبان فيها ا حاجة مضيعه جمالها عشان كده الوحش ظاهر دايما مع انه اقل من الكويس بس لازم ناخد موقف<br />(ان الله لا يغير ما بقوم حتى يغيروا ما بانفسهم)<br />احـــــــــــــــD.monـــــــــــد"
