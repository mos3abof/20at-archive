subject = "حنة"
text = "يا اخوانا مصر طول عمرها فيها عهر زي ما فيها شرف وتدين .. والنسب بتزيد وتقل حسب مستوى الأزمة السياسية والاجتماعية والفكرية اللي في المجتمع<br />قبل الثورة كان شارع كلوت بك المقر الرسمي للعاهرات المرخصات وكان عبد الوهاب بيغني ارخي الستارة اللي ف ريحنا .. وغيرها من أغاني الهلس ..<br />لما دخل المجتمع مرحلة فيها غنى فكري ظهرت ام كلثوم بالتزامها (الفني والمهني) ووكذلك كان سيد درويش ابن ثورة 19 ..باختصار كل ما المجتمع أصبح جاد وعنده قضية كلما اصبح فنه محترم ولا يعتمد على العرى .. وطبعا بأكد على كلام نونا عن نجيب محفوظ بن ثورة 19 ..<br />طيب مش ملاحظين ان الحجاب انتشر والحمد لله .. وفيه بنات كتير بتتجه للالتزام ... يعني روبي وأخواتها لييسوا سادة الموقف<br />لكن طبيعي جدا واحنا بنعيش مرحلة احتلال العراق والانهيار العربي المريع اننا برضه (يتخلق لنال صورة عن نفسنا غارقة في التشوية.. ورمزها هو فتيات البورنو الكليب).. بس احنا مش كده .. صح؟<br />بالمناسبة اسلام اون لاين نزل مقال محترم جدا للدكتور عبد الوهاب المسيري عن الموضوع ده من فترة"
archived = "2005-06-09"
capture_url = "https://web.archive.org/web/20050609075417/http://www.20at.com:80/article.php?sid=1164"

[[comments]]
order = 27
subject = "عقلاني: كل العرب ايه سيادتك؟"
text = "بصراحة كل العرب .... لأنهم ضعيفين جنسياً شباب وبنات ؟<br />مش فاهم كلامك دا معناه ايه.ضعيفين جنسيا ولا ضعيفين في مقاومة الجنس. طبعا فرق كبير بين الاتنين.<br />الضعف الجنسي بيدخل فيه اسباب كتيرة منها التلوث اللي بتشموفه ف السحابة السودا.ومنها الخضار الكيماوي والاكل اللي مليان بلاوي.<br />ما تنساش فراخ الهرمونات. فيبقي اذا في ضعف جنسي يبقي لينا حق.<br />اما اذا كنت قصدك اننا لا نستطيع ان نقاوم الجنس.فبقولك من ضمن الذين يضلهم الله يوم القيامة في ضلة يوم لا ضل الا ضلة فهو رجل اتته امرأة ذات جمال فقال لها اني اخاف الله.فطبعا الموضوع صعب ومش بسهولة الواحد او الواحدة بيسيطر علي نفسة بالجنس.وليس لنا ملجأ الا الصيام او الزواج.<br />طبعا مش هتلاحظ الكلام دا في بعض الدول العربية عشان سايحة مايحة زي دول المغرب العربي وبعض دول الخليج....وووو.زززاسف كل دولة فيها اللي مكفيها.<br />بس ازكرلك حاجة لذيذة ف ليبيا.<br />بعد ما جوز الست يموت ممكن تخلف بعد 4 سنين.مع انها ما اتجوزتش واحد تاني ولما يسأل الغير ليبيين ايه اللي بيحصل دا.بيقولولهم دي كانت بتخزن ودا شيء طبيعي لأنها مخزنة من جوزها. تصدقوا وصلت لفين المهزلة والدعارة وان المجتمع والعيلة مؤمنين بكدا وبيغطوا عليها.<br />بالنسبة للأخت لونا انا افضل اخفي شخصيتي.من الافضل ان لا يفضح شخص نفسة في موقع من الممكن ان يكون حساس.<br />من الممكن تبادل الاراء هنا.<br />لكي تعرفي عن تعليقاتي اكثر اذهبي الي مقال \"منير في عز الضلمة\" في الارشيف وستجدي تعليقات جيدة مني.شكرا."
archived = "2005-06-09"
capture_url = "https://web.archive.org/web/20050609075417/http://www.20at.com:80/article.php?sid=1164"

