[[comments]]
order = 1
subject = "ليس كلهن"
text = "أولا بالنسبة لرأي شريف صبري( بدون دكتور لأنه ليس من المعقول ان أقول هذه الكلمة على زغلول النجار مثلا و اقولها على رجل مثل هذا الشريف صبري)بالنسبة لرأيه الذي يقول ان نصف بنات العرب عاهرات و النصف الآخر ينتظر الفرصة فهذا كلام يدل على صاحبه فكما يقولون \"الإناء ينضح بما فيه\" أو بمعنى أصح \"السئ لا يظن بالناس إلا سوءا \" .<br />أما بالنسبة لباقي المقال فليس كل البنات أرجوكم فهناك من البنات من تقود الرجال و هي بمنتهي الإحترام و الوقار و هناك من البنات من تضحي بنفسها لأجل دينها ووطنها مثل آيات الفلسطينية أليسوا من نفس المجتمع العربي .<br />أنا لا أنكر أن هناك مشكلة خطيرة هي في الحقيقة من تصدير الغرب لنا لكي يكملوا علي البقية الباقية فينا من الأخلاق و نهوي في الحفرة أكثر مما نحن ألا و هي الهوس الجنسي الذي سلطوا علينا به المغنيات اللبنانيات صاحبات الريادة في ذلك الموضوع ثم أخذت المغنيات المصريات يتنافسن معهن علي من فيهن أكثر وقاحة و البقية تأتي مادمنا نبتعد عن ديننا و نصر أن نعزل الدين عن إعلامنا و عن السياسة و عن الفن و عن العمل فبالله عليكم قولوا لي فيم سنطبق تعاليم الدين إذا لم نطبقها في هذه الأشياء"
archived = "2005-06-09"
capture_url = "https://web.archive.org/web/20050609075417/http://www.20at.com:80/article.php?sid=1164"

