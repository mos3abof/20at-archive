text = "انا طلبت بس انك تنضم لمجموعة ما علينا<br />لانهم شباب نخهم متفتح و واعي<br />موضوع ان الفجر من زمان<br />طيب ما قوم لوط من زمان قبل زمانا<br />و ذوات الرايات الحمر كانوا ايام الرسول اللهم صلي و سلم عليه<br />الفجر موجود بس شوية يعلي و شوية ينزل<br />احنا دلوقتي زي بتوع الاندلس يا رييت تبصوا في طوق الحمامة كان كله بيحب كله حتي الرجالة بتحب بعض و يبقي الراجل شغوف علي الراجل حبيبه<br />و علي فكرة ارخي الستارة الي في ريحنا غنيتها منيرة قبل عبد الوهاب<br />و عنك عمك الي بيقولوا خالد الذكر كان بيغني حرج عليا بابا مروحش السنيما<br />وتقريبا صالح عبد الحي يكون في علمك انا مش فاضي و كل ساعة اعملك قاضي<br />و هات الازازة ......<br />و فيك عشرة كوتشينة<br />كل دي اغاني قديمة جدا و كلها بتحض علي الرذيلة زيهازي اغاني بوسي سمير"
