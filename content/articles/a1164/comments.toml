text = "يقول مثل شعبي بذئ:<br />\"المرأة عقلها بكـ...ها\".<br />,من خلال تجربتي، فهمت أن العكس هو الصحيح: \"المرأة، كـ...ها بعقلها\".<br />أجل، هي ترجح العقل على نداء الجسد أكثر منا بألف مرة. بل و\"تلعب\" بضعفنا في هذا الباب، وتوجهنا حيث تريد.<br />\"كيدها عظيم\"؟ صح. لكن جوهر الأمر في تفسير نعت \"عظيم\". ويا لعظمة هذا الكيد الذي يجعل الواحد منا يحس بأنه ملك، ولو لأمسية أو ساعة أو لحظة.<br />فالزمي يا ابنة فهر كيد النظر، وسحر الإيماءة، ومتاهات الكلام المتيـِّه. إنه أمضى أثراً من \"فخ\" العري، وأعظم غموضا. كيدكن الخفي الغريزي العظيم، الذي جبلتن عليه، كفيل بديمومة حلمنا أكثر من تفاهة روبي ومن لم تلف لفها (أعني لم تلف خرقة حول الخصر ومواضع أخرى).<br />ألا توافقنني الرأي ياجميلات؟"
archived = "2005-06-09"
capture_url = "https://web.archive.org/web/20050609075417/http://www.20at.com:80/article.php?sid=1164"

