subject = "كلمة حلوة وكلمتين .. حلوه يابلدي .."
text = "يااخوان الغناء سواء الان أو من 500 سنة غناء .. وهو سواء صدر عن بنت محجبة أو بنت غير محجبة فهو حرام .. وسواء كان المنتج شريف صبري أو دكتور شريف صبري .. فلا مشكلة .. فالموجود في الخمارة كلهم اصحاب زنوب .. يعني لا تبحث عن سجادة صلاة في بــار أو خمارة .. واذا وجدت فهي لا تنفع .. اما البنت .. السيدة .. امي .. اختي .. زوجتي .. عمتي .. خالتي .. فكان الله معها ومعنـا<br />القادم صعب .. وخطير . وعلينا بأنفسنا أولا .. وسيعلي الله كلمته ولو بعد مليون سنه .. لا تخافوا .. ولا تحزنوا<br />لكن نبدأ بأنفسنا .. وكل المجتمعات طالما فيها بشر وفيها ثقافات وفيها رجل وامرأة .. وفيها جوع وشبع وفيها حلال وحرام لابد ان نجد فيها الصالح والطالح .. والا ماكان هناك جنة ونار .. وماكان هناك - + وماكان هناك حياة وموت ..<br />ربنا مع الجميع ..<br />مصري .."
