[[comments]]
order = 8
subject = "يا جماعة"
text = "=البنت بتكون بعد كده أم و هى اللى بتربى الأولاد بحكم الإحتكاك الأكبر بهم و هى جندى الحصن.<br />=البنت بتكون اخت و عمة و خالة فتخيل لو انهن طوالح.<br />=البنت بتمشى فى الشارع و بتروح الجامعة فتخيل ان تأثيرها فى الشارع و هى مبتذلة اكتر من الخمر على العقل.<br />=البنت بتكون مدرسة فتخيل المدرسة لها سلوكيات المراهقات او المتصابيات ان كن كبار فى السن.<br />علشان كده لما يكون نسبة الشباب (من 18-40) فى العالم العربى فوق ال 60% يبقى اى عدو للبلاد دى لابد يفكر فى تدمير تلك القوة البشرية فيكون المطلوب كالاتى:<br />1. على المدى القصير ----إلهاء الشباب بمصائب الفضائيات الغنائية و لكى يكون التأثير اشد تكون العارية بتتكلم عربى و بلغة البنت اللى فجرت.<br />2. على المدى البعيد ---- تحضير المجتمع للتطبيع مع الزنا لإن اللى جاى بعد كده كليبات و مقاطع جنسية كاملة بعد تعود الناس عل الجرعة الأولى. و احنا شفنا كيف اذاعت الفضائيات مع التلفزيون المصرى قصة الزنا بين الحناوى و الفيشاوى و لم يعبر الناس بأى صورة من الصور عن استياءهم لهذا الفجر ..... ما خلاص الناس بردت من كتر ما بتشوفه و مش هيبقى فيه مشكلة يبن اى ولد و بنت يزنوا الا مشكلة إثبات النسب.<br />3. استغلال هذا الوقت الثمين خاصة بعد سياسة تجفيف المنابع لان معظم الشباب الان لو شققت عقله لن تجد لا قضية و لا فكر - الا ما رحم ربى.<br />4. استغلال عاطفة البنت فهى سريعة التأثر و تحب التقليد و المنافسة ..... و النتيجة: عمليات تجميل كثيرة و لبس سيئ و تصرفات مستهترة.<br />الحقيقة ان اشد اوقات الليل سوادا هو الفجر لكن بعد فجر فى شمس ستنير و تنير العالم بنظافتها و نورها. انتظروا فقط هزيمة امريكا فى العراق و التغيير القادم ان شاء الله.<br />تحياتى"
archived = "2005-06-09"
capture_url = "https://web.archive.org/web/20050609075417/http://www.20at.com:80/article.php?sid=1164"

