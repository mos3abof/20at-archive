text = "السلام عليكم ورحمة الله وبركاتة انا اخوكم فى الله حسان سيد من مصر من اسوان<br />اولا الى الله المشتكى فى انفسنا فى اخواننا فى كل مكان المراة هى سكن للرجل هى المراة كل شى فى الدنيا ولاكن من هى المراة المراة هى ( وكل رجلا عظيم امرة) اخواننا فى الله تستطيع المراة فى البيت وفى كل مكان تجعل منة ومن كل الاهل رجال ينفعون انفسهم اولا قل غيرهم من الاخرين ولاكن علينا بكتاب الله وسنة حبيبة النيى صالى الله علية وسلم<br />وكما قال الرسول الله صلى الله على وسلم(تركت فيكم مان ان تمسكتم بة لان تطلو بعدى ابدا كتاب اله وسنتى ) وصدق رسول الله صلى الله علية وسلم وعلى الاخوات من المسلمين الاقدتاء باصحابيات من امهات المؤمنين وغيرهم من اصحاب روسول الله صلى الله علية وسلم<br />ومثل بسيط ام الامام الشافعى ماذا كانت تفعل كانت هى التى وصل الامام الصغير الى الجامع لكى يصلى وكان فى الصغر من عمرة ونظرو الان امام امة علية رحمة الله وستغفر الله لى ولكم والسلام عليكم ورحمة الله وبركاتة( اخوكم حسان سيد)"
