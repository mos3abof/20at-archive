[[comments]]
order = 1
subject = "بعض النساء المفروض يجلسووووون بالبيت"
author = "حتى عندنا واللهي بعض النساء الله يهديهن يكرهونك غصب بالمسجد استغفر الله وهذه بعض الاشياء اللي تضايقني كثيرا"
posted = "2006-10-20"
text = "* المتزوجة لما تجيب معها العيال المزعجين في صلاة القيام<br />* كثير منهن يتركن الجوال مفتوح وحتى الرجال سمعت ان كثير منهم كذا<br />* الرائحة المزعجه التي تقطع عليك خشوعك وتركيزك ..لدرجه اني احس بعض الحريم يطبخون بعباياتهم<br />>>> قلبت سعودي<br />*غير قلة النظافة في دورات المياه اعزكم الله وماله داعي اشرح اكثر<br />*اللقافه من البعض (التدخل في شؤون الغير) 1-ليه ماصليتي كل الركعات؟ طيب ياحبيبتي هذول الركعات نوافل وليس فرض<br />2-انتي متزوجة؟؟؟؟؟؟؟<br />وياريتها تسأل عشان تخطب لا بس لقافه زايده خخ<br />3-تعالي صلي هنا لاتصلين هناك<br />4-البسي اعملي سوي اف من جد<br />عشان كذا انا مارحت التراويح الا يومين فقط لكن اغلب ليالي القيام صليت بالمسجد لأنها أهم ولكل مجتهد نصيب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123628/http://www.20at.com/article2.php?sid=1376"

[[comments]]
order = 2
subject = "ياللأسف"
author = "معاذ محمود عامر"
posted = "2006-10-21"
text = "بدلا من الدعوة لأن تصلي السيدات في بيوتهن كان من الأفضل الدعوة الى التزام آداب المسجد وتكون موجهة لكلا الجنسين فهناك أيضا من الرجال من لا يحترم آداب بيوت الله....<br />وأنا في الحقيقة لأشعر بالأسى والأسف لما وصل اليه حال التمييز الغبي لدرجة أن تصدر هذه الفكرة التمييزية من امرأة<br />هل ستحرم المرأة أيضا من حقها في نور بيوت الله وتحجب حتى عن الصلاة بدعوى الحفاظ على النظام؟ انها دعوة مطاطة غير منطقية<br />أنافي الحقيقة أرفض هذه الفكرة من أساسها ومن المبدأ ذاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123628/http://www.20at.com/article2.php?sid=1376"

[[comments]]
order = 3
subject = "المسجد لا البيت"
author = "عمرو مجدي"
posted = "2006-10-21"
text = "أنا أتفق مع معاذ في رأيه بشدة، لكن لم يكن هناك داعٍي للتجريح<br />فعلا ليس هناك أدنى سبب لكي لا تذهب السيدات للمسجد، خاصة الفتيات مثلك يا منى وصديقاتك ومن في سنك ، من ليس لديهن أولاد صغار ربما يكونون عامل تشويش<br />غريب جدا يا منى هذه الفكرة العجيبة!!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123628/http://www.20at.com/article2.php?sid=1376"

[[comments]]
order = 4
subject = "للضرورة أحكام"
author = "ذهاب النساء لأداء الصلوات بالمساجد غير ضروري وأصلا النساء لا تذهب إلى المساجد إلا في أيام الجمعة ورمضان والاعياد بالنسبة لطرح الاخت فحسب ما ألاحظه خاصة بمسجد حينا فلا ضرورة بتاتا لأن تذهبن لأداء صلاة التراويح حيث أن حضورهن يجعل حرجا للرجال في أداء الصلاة حيث تتعدى النساء المكان المخصص لهن لأداء الصلاة وأصبحن يصلين بأماكن الرجال لدرجة مزاحمتهم فيها والصلاة جنبا الى جنب فلاحول ولاقوة الا بالله كان هذا مشكلا في بداية رمضان ومع مرور الايام ونسبة النساء في ازدياد ما يضطر الرجال الى تجنب هذا الاحراج بالصلاة خارج المسجد أو البحث عن مساجد بعيدة عن المناطق السكنية الكثيفة السكان"
posted = "2006-10-21"
text = "بالمختصر المفيد اذا كان ذهاب المرأة للمسجد يسبب احراجا فلا ضرورة لذهابها ويكفيها اجر النية وأداء صلواتها ببيتها<br />والله أعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123628/http://www.20at.com/article2.php?sid=1376"

[[comments]]
order = 5
subject = "لاتمنعوهم"
author = "خالد أحمد"
posted = "2006-10-21"
text = "أختى العريرة كاتبة المقال أحى فيك حرصك على أن تؤدى عبادتك بصورة سليمة ولكنى أختلف مع طرحك بمنع النساء عن مصلاتهن وذلك لأسباب أولا -خروج المرأة للصلاة فى المسجد أدعى لكى تؤدىها وخاصة أذا علمتى أن كثيرا من النساء يكسلون عن تأديتها فى المنرل ثانيا-أن لخروج النساء أهمية تعليمة وخاصة مع وجود حال متفاقمة من الجهل بتعاليم الدين عند المرأة المسلمة ثالثا - أن صلاة التراويح تحولت ألى فرصة للألتقاء والتعارف وسؤال الناس على بعضهم البعض وهو شىء أيجابى يدعوا أليه الأسلام ويحض علبه أما مسألة الأطفال الصغار فرجاء منى الى الأخوة مرتادى المساجد لاتنفروا الأطفال من المساجد ولا تمنعوهم منها ولو حتى على حساب الخشوع والتركيز لأن رحمة الله أوسع من ركعة فى سبيلها يكره جيل كامل المسجد والدين غفر الله لى ولكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123628/http://www.20at.com/article2.php?sid=1376"

[[comments]]
order = 6
subject = "اداب الصلاة فى المسجد"
author = "شيرين عبد الحميد"
posted = "2006-10-21"
text = "كانت لى تجربة فى الصلاة فى (مسجد السيدة زينب و مسجد الحسين) قررت بعدها الا اصلى الا فى بيتى على الاقل حتى تعرف النساء حق الصلاة فى المسجد و تذكرت ان هناك حديث لرسولنا الكريم يقول ان صلاة المرأة فى بيتهابل فى حجرتها افضل من الخروج للمسجد خاصة لتلك السيدات التى يصطحبن اطفالا يكونوا سببا فى اذى الاخرين و لن ينقص ذلك من ثوابها فى شىء فلا يكلف الله نفسا الا وسعها و يقول الحق تبارك و تعالى لمن استطاع اليه سبيلا بل بالعكس اذاها للناس بصوتها العالى واطفالها قد يبطا اصلا صلاتها و الله اعلم, اصبح الخروج للمسجد نزهة و تفاخرا و ليس خروجا للعبادة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123628/http://www.20at.com/article2.php?sid=1376"

[[comments]]
order = 7
subject = "خلاف بدون داعى"
author = "مسلمة"
posted = "2006-10-21"
text = "السلام عليكم ورحمة الله اولا الموضوع مش وقته خالص لان رمضان اوشك جدا على النتهاء وبفرض اننا نناقش الموضوع لما بعد فانا اتفق مع الاخ معاذ فى رايه ثانيا لايصح تغيير الحديث الكريم من (لاتمنعوا اماء الله مساجد الله \") الى امنعوا وبعدين فيه نساء كتيير بتكسل عن الصلاة لو قعدت فى البيت وللاخت الكاتبة عاوزة اقولك حاجة انتى عرفتى انهم حيمنعو النساء من الصلاة فى صحن الحرم المكى الشريف اعتقد انه شئ محزن جدا ويمكن مقالة حضرتك تثبط من عزيمة بعض البنات والنساء ويقعدوا فى البيت ويقتنعوا بكلام حضرتك انتم مستخسرين ان النساء تصللى شهر واحد من 12 شهر فى المسجدربنا يهدى الجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123628/http://www.20at.com/article2.php?sid=1376"

[[comments]]
order = 8
subject = "منتهى العقل ولكن"
author = "عبدالله مفتاح"
posted = "2006-10-22"
text = "انا شايف ان الراي عملي جدا<br />انا مش عايز اقول حاجات غلط بتتعمل اكتر من اللي اورده المقال عشان محدش يزعل<br />بس الصلاة في البيت احسن بكتييييييييييييييير اوي<br />وفي الاخر بردو حقهم يروحوا المسجد بس البيت بردو احسن<br />وانا شايف ان الكاتبه معاها كل الحق في اللي قالته ولا تمييز ولا حاجه<br />دي الحقيقة المرة اللي مش عايزين نبتلعها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123628/http://www.20at.com/article2.php?sid=1376"

[[comments]]
order = 9
subject = "الله يهديك"
author = "رامي"
posted = "2006-10-22"
text = "يا أخت مني الله يهديكي .. ده اسم عنوان تحطيه للموضوع؟!!!<br />الرسول يقول لا تمنعوا اماء الله وانت موضوعك اسمه امنعوا اماء الله!<br />أولا<br />غلط نمنع المرأة أو البنت عن المسجد والرسول نهي عن كده<br />ثانيا<br />البنت لو حد بيقول ان معرفتها بالعلم ضئيلة وبالسياسة معدومة وبالجغرافيا لا شئ وبالتاريخ صفر وبالأدب لا تتخطي سلسلة زهور الرومانسية أو سلاسل فلاش وقصص ميكي ماوس المصورة فالسبب في قوقعتها وعدم اثرائها أو المساهمة في اثرائها ثقافيا أو دينيا بأي شكل<br />البنت عمرها ما فكرت في السياسةلأنها بتفكرش الا في مذاكرتها ومعلوماتها في دينها بسيطة لأنها عمرها ما نزلت مسجد الا في المواسم<br />سيبي اللي يتكلم يتكلم لكن ده مش معناه متنزلوش الجامع<br />فقط كل بنت وكل واحدة تحاول علي قد ما تقدر تحترم المكان اللي هي فيه .. مش لازم نجيب العيال وعيال الجيران والراضعة والبزازة والعشا .. ليه بيتم التعامل مع حاجة زي كده علي انها رحلة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123628/http://www.20at.com/article2.php?sid=1376"

[[comments]]
order = 10
subject = "ملاحظة في موضعها"
author = "عائشة"
posted = "2006-10-26"
text = "لقد اصبتي يا اختي الفاضلة في مقالك هذا, فعلا تصرف النساء في المساجد مخجل والغالبية القابعة فيها نخبة جاهلة بالدين وبالتصرف الصحيح و ويجب على الائمة منع النساء من الذهاب الى المسجد لعدم احترامهن لهذا المكان المقدس , زيادة على تصرفاتهم داخل الصلاة , فقد لاحظت مرارا وتكرا بعد تكبيرة الاحرام السيدات يلتفن يمينا وشمالا وظبط السجاد اذا كان هناك ركن غير مظبوط كانهن جالسات فقط للتسامر<br />والصلاة في البيت خير من المسجد للنساء واهنئك انك صليت ليلة القدر في بيتك والقراة في قرانكو فقد فعلت هذا طوال رمضان وذلك لما اراه من تصرفات النساء حتى ان المسجد يصبح مثل حمال النساء العمومي فهناك من تحجز المكان لصديقتها او جارتها وفيهن من يتبادلن اطراف الحديث عن مشاغل الدنيا بدل من ان يمسكن قرانا او يصلين ركعات نافلة او حتى يجلسن لذكر الله دون الكرم عن عدم تسوية الصفوف وحتى عندما يطلب منهن تسوية الصفوف لا يفعلن , فخيرمكان للصلاة للنساء هو بيوتهن."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123628/http://www.20at.com/article2.php?sid=1376"
