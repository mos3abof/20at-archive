[[comments]]
order = 16
subject = "انا عراقي اولا واخيرا"
author = "صباح المهندس"
posted = "2006-06-15"
text = "تحية طيبة الى كل من يهدف بكلمته خير الناس كلهم وليس بعضهم<br />كل مايجري في العراق غير طبيعي فكثرة الفضائيات والصحف والاحزاب والميليشيات والاهم في ذلك كثرة مراكز القرار وكثرة الجرائم البشعة...<br />قسم يقول ان هذه هي الديمقراطية لانه مستفيد من هذه الاوضاع وقسم يريد ان يتبع العراق بلدا اخر لانه تربى هناك وقسم يرى انها فرصة تاريخية للانفصال عن البلد الام موهمين قومية معينة ان هذا سيحقق لهم مستقبل مشرق وقسم يريد ان يقحم الدين في السياسة ويحول الائمة الى وزراء وسياسيين يقودو البلد وتخيلو رجل دين يصبح وزير اعلام او صحة او تعليم عالي مع احترامي لرجال الدين ..والكل يريد ان يقصي الاخر ويبيده اذا ما وقف بوجهه اذا استطاع والكل يعرف يعرف ان الاتجاه الذي يسير عليه اتجاه خاطئ لذلك تراه يرسل امواله واطفاله الى الخارج ولايتخلى عن جنسيته الاجنبية .. ولكن كل هولاء يعتبرون اقلية ولو كثر عددهم ... وهناك اغلبية وطنية صامتة لحد الان وهي مؤمنة بالحلول الصحيحة ولكنها لاتريد ان تصطدم بكل هولاء ومن يسندهم لانها تعتبرهم عراقيين اضلو طريقهم ولكن لكل صبر نهاية مع شكري وتقديري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132116/http://www.20at.com/article2.php?sid=794"

