text = "يا جماعة الخير<br />الأستاذ مصرى نسى يشير إلى إن الموضوع بتاعه هو نسخه طبق الأصل من مقالة بلال فضل الجميله المريعه الفظيعه فى عدد الدستور الأربعاء الماضى.<br />لذا لزم التنويه.<br />أنا بأعتذر يا أستاذ مصرى لو إنت بلال فضل بشحمه و لحمه و عظامه<br />مع تحياتى<br />واحد تانى"
