text = "تصدق يا علي افكارك جديدة تؤدي لفتح زوايا جديدة و مهمة في نظرتنا للاحداث الجاريةو فعلا احوال الفضائيات العراقية تعكس الحالة المحزنة للعراق ومدي التشتت في الاهداف لجميع الطوائف الختلفة وللاسف كمان ان السنية لم يتنبهوا الي اهمية الاعلام كسلاح فاكتفوا بمواقفهم في المساجد و المؤتمرات الصحفيةوانا باشكرك جدا علي المجهود اللي عملته في هذا الموضوع"
