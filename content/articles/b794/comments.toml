text = "بداية يا علي اهم اهنيك جدا على موضوعك موضوع حلو بجد .. هو اكثر من رائع حقيقي ..<br />القنوات الاعلامية الكتير هي تجسيد بسيط جدا لفكرة تفتيت العراق .. لو كل فئة وكل فصيله عملولهم قناة مش ممكن هيتوحدوا ابدا وهي دي الفكرة ببساطة فرق تسد.. لسه الاستعمار بيستخدم نفس الاليا متغيرتش الازمة ان احنا اللى بمنتعلمش او عارفين وبنستعبط"
