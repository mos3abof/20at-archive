[[comments]]
order = 2
subject = "الاحتلال الفكري"
author = "رائد بغدادي"
posted = "2006-05-12"
text = "الاخ علي ,<br />أبارك لك هذا الموضوع المهم والخطير وأعلم ان العراقيين يتكلموا به كثيرا في الشارع مع الحدث ولذلك نحن نستنبط قاعدة كبيرة وهي ان الاحتلال قد احتل العراق ليس عسكريا فقط وانما فكريا والذي على الكل معرفته ان هذه الفضائيات المحتلة والتي يعاني منها العر اقيون صداعا وورما خبيثا انما هيه دعما امريكيا وايرانيا الامر الذي يجعل اولها يدافع عن المرتزقة من الحكومة وعن الاحتلال واعتبارالمقاومة الشريفة ارهابا واخرها يدافع عن الوثنيه التي تعبد الوثن بدلا من ان تعبد الله وتجد هناك من يمول بملايين الدولارات هذه القنوات ولأن تأريخ المسلمين استعباد تجد الاقلة من اصحاب الاقلام الشريفة تغتال وتختطف اذا ماعملوا في قناة تسمي الاحتلال محتلا على غرار من يسمي المحتل قوة متعدد الجنسيات واقول لك ان هذه القنوات العميلة عمرها قصير ولن تدوم وستزول برحيل المحتل بعد تحرير العراق انشاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132116/http://www.20at.com/article2.php?sid=794"

