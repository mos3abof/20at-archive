[[comments]]
order = 9
subject = "ويقبي عهد القائد الرئيس/صدام حسين ( شرفا للعراق)"
author = "توفيق الشيباني-اليمن"
posted = "2006-05-14"
text = "في البداية السلام عليكم جميعا<br />أخواني أخواتي الاعزاء<br />كلنا نعرف ما وصل الية دعاة الحريةومرتزقيها القادمين من خارج العراق الحبيب علينا جميعا<br />فماذكره الاخ المهندس بتعليقة العرب المساكين. فما ذكرة لاأعتقد باانة طرح شخص يحمل حبا للعراق وانما يحمل مرضا خبيثا لمناقشة الوضع في ارض الرافدين الغراء.<br />الطرح متخبط والاسلوب غير مهذب فلا اريد ان ادخل في دوامةالتجريح.<br />لقد كان العهدالاشرف والانبل والطاهر هو عهدالقائد الرئيس صدام حسين رئيس جمهورية العراق غصبا عن المرتزقة ومن مشئ ورائهم بكافة عملاتهم الدنيئة.<br />اما عهد الخونة فبئس عهد اليم وحقير ومايذكر الاخ المهندس هداه الله للصواب فانة سرطان فتنة في العراق شفاة الله منة.<br />واحيي الاخ العزيز/ رائد البغدادي على طرحة واسلوبهاالصادق .<br />ياأخواني لقد رايت في موقع قد التغي من كثر مئأسات دعاة الحرية العملاء والمحتل الامريكي القذر صور انتهاكات اعراض أخواتناونسائناالعراقيات فمن يرضي على قبول الحرية بالطريقة الامريكية فهو قذر وخائن لارضة وعرضة<br />فحبنا للرئيس القائد صدام حسين لم يتغير بل يزاد قوة ودون اي مصلحة والله حبا لله في الله<br />فرحم الله شهداء العراق الابطال الذين دافعوا عن وطنهم وشرفهم بكل بسالة وحب لارض الحضارات."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132116/http://www.20at.com/article2.php?sid=794"

[[comments]]
order = 10
subject = "لا تأسفوا على ذهاب طاغية"
author = "اخواني - أشاطركم الرأي تماما في أن مايجري في العراق أمر يدمي ويبكي كل مسلم له ضمير حي."
posted = "2006-05-14"
text = "ولكن لا ينبغي بحال أن نأسف على ذهاب الطاغية ، فذهاب الطاغية أمر يفرح الشعوب -وإن كان الثمن في حال العراق باهضا.<br />لذلك على الشعوب الحية ، بدلا من الاستسلام للطواغيت ، وتصويرهم بانهم حماة الاوطان ، عليها أن تتكاتف وتسقط الطغاة ، وتقيم حكم المؤسسات.<br />أظنه قصور صارخ لدينا -نحن العرب- أن نتمنى بقاء الطاغية لحفظ وحدة البلد وأمنه ، فالظلم والديكتاتورية لا تبنى الاوطان ، بل تهدمها ، وما هدم العراق الا ظلم صدام وعجرفته."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132116/http://www.20at.com/article2.php?sid=794"

