text = "احب اوجه رسالة لهذا الملعون علي المصري الوسخ قبل ماتحجي على تاج راسك واشرف منكم احب اكله تروحله فدا لصدام حسين انت 70 مليون مصري ياكلب ياابن الكلب ومو بس انت كل عراقي نذل وكل عربي وسخ معفن تشمله هذه الشتيمة صدام تاج على راسك وراس اعوانكم ياخبثاء والعراق يبقى صامد على مر العصور هسة طلع لسانكم على العراق والفضائيات مالتكم نسيتوها نسيتوا نسائكم العرايا بالشوارع ونسيتوا ممثلاتكم اشبه بسيدات دعارة حسبي الله عليك يانذل على عنادك وعناد كل كافر شيعي ملحد صدام يبقى عز العرب واشرف زعيم عربي والي يحجي غير هذا الحجي هو اكبر كلب ابن كلب ولقيط"
