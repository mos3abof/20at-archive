text = "اخونافي العروبةكان الافضل ان تكون صاحب مهنية ورسالية واذا اردت تكون شخصية اعلامية لابد من موضوع الحياد من اجل ان اكون انا القارى لي ثقة في نقلك والا عندما ارى بشكل فاضح رايك في الارشفة للقنوات العراقية فاني اكون منطقي بان هذا الموضوع لا يؤخذ على مجمل الكتابة الصحفية الموضوعية وانما هو تعليق كباقي تعليقاتناالمسرحية ومنها تعليقي الذي يختلط بها الوان الحياة وشخصياتها وانما الموضوع يفقد بتغيير الشخصنة في الوسط"
