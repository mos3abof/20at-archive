[[comments]]
order = 4
subject = "لا تخافوا من الحرية"
author = "الحرية هي مطلبنا جميعا نحن الشعوب ، و الشعوب الحرة هي الشعوب المبدعة المنتجة و لا ينبغي بحال أن نخاف من الحرية ، أو نطالب بالقمع تحت أي شعار."
posted = "2006-05-12"
text = "وهذه القنوات على كثرتها أمر لا يخيف أبدا ، فلن يبقى منها الا ماهو جدير بالبقاء<br />يقول ربنا -تقدست أسماؤه- : فأما الزبد ، فيذهب جفاء ، وأما ماينفع الناس فيمكث الارض ، كذلك يضرب الله الامثال."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132116/http://www.20at.com/article2.php?sid=794"

[[comments]]
order = 5
subject = "عيد ميلاد سيادته"
author = "مصري"
posted = "2006-05-12"
text = "من بين أستار الليل يطلع الفجر، ومن بين حجب الغيام تشرق الشمس ومن قلب الشدائد والمحن يولد الأبطال العظام، ومن وسط الأنواء والعواصف يظهر الربان الماهر الذي يقود بيقظة وحنكة وحكمة سفينة الوطن الي بر الأمان والسلام هكذا افتتحت الصحيفة العريقة بروازها، صحيح انني لولا عنوان كل سنة وإنت طيب ياريس لظننت هذا الكلام مقتطفا من آخر ليلة محمدية يشدو به محمود ياسين أو محمد السبع، وصحيح أيضا انني تأخرت في البكاء الحار قليلا لأنني لم افهم يعني ايه غيام فأنا اعرف ان الحاجات اللي بتمر في السماء اسمها الغيوم، وصحيح برضك أنني لم أطمئن لمفردات العواصف والأنواء والربان والسلام، فموضوع العبارة الغارقة جعل بيني وبين هذه المفردات قلة عمار واستخدامها في مناسبة كعيد ميلاد الرئيس فيه قلة دراية لولا التأكد من اخلاص من كتب لظن أنه تلقيح صريح، كل هذا صحيح لكن الأصح أن الكوبليه الثاني في برواز الاهرام جعلني أنخرط في بكاء حاد وأنا أقرأ ما هو مكتوب نحتفل كلنا هذه الأيام بعيد مولده ونحن معه وهو يقود سفينة الوطن ـ هناك تصميم علي حكاية السفينة لا أدري لماذا؟ لكن يله مش اشكال ـ غير خائفين أو هيابين متقدمين لا متراجعين، متفائلين لا متشائمين، معه وبه يمضي زورقنا ـ فجأة من سفينة الي زورق لا أدري لماذا هل غرقت السفينة وأصبحنا في زورق النجاة لم يتم تحديد ذلك ـ لكي نرسو كلنا علي شاطئ بلا ألغام، بلا أوهام تظلنا معا أشجار التحدي والتصدي ـ لم أكن اعرف ان هناك اشجار تحد وتصد فآخر علاقتي بالاشجار شجرة القرع ـ لا مكان بيننا لمتخاذل هراب ولا لمتوجس مرتاب، ولا مقعد بيننا لحاسد أو حاقد ولا كاره لوطنه ودينه وبيته . لم استطع إكمال قراءة برواز الاهرام فقد صرت خاشعا متصدعا من حب الرئيس، وضعنا أيدينا علي برواز الاهرام بما فينا الفاشل الذي لم يجد عملا من أربع سنين، وأخذنا نهتف من أعماق قلبنا بصوت جهير لكي نسمع من في العمارة قائلين تبنا الي الله ورجعنا الي الله وندمنا علي انتقادنا لسياسات السيد الرئيس وعزمنا علي ألا نعود الي ذلك حتي عيد ميلاد سيادته القادم ثم انخرطنا جميعا في بكاء مرير لم نتوقف عنه حتي الآن ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132116/http://www.20at.com/article2.php?sid=794"

