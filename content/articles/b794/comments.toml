[[comments]]
order = 12
subject = "لا تزال أرض العراق موعودة بالفتن !"
author = "مآتم الظلم تتلوهن أعياد = إياكِ أن تجزعي إياكِ بغدادُ"
posted = "2006-05-26"
text = "قد استبدّ بأهليك الطغاة أذى = وراح يمتحن الأحرار جلاّدُ<br />حتى تهدّم صرح الظلم وانكفأت = قدر الفساد وأهل الظلم قد بادوا<br />نهاية الظلم يا بغداد واحدةٌ = الله والحق والتاريخ أشهادُ<br />بغداد المنصور إياك أن تجزعي فهذا هو قَدَرُك المحتوم أن تكوني ضمن أرض قَدَرها الفتن .<br />قال فيها النبي صلى الله عليه وسلم : إن الفتنة ها هنا ها ، إن الفتنة ها هنا ها ، إن الفتنة ها هنا ، حيث يطلع قرن الشيطان . رواه البخاري ومسلم .<br />ومما يدلّ على أن المقصود بذلك العراق ما فهمه الصحابي الجليل راوي الحديث ، وراويه عنه وهو ابنه .<br />فعن سالم بن عبد الله بن عمر أنه قال : يا أهل العراق ما أسألكم عن الصغيرة وأركبكم للكبيرة ! سمعت أبي عبد الله بن عمر يقول : سمعت رسول الله صلى الله عليه وسلم يقول : إن الفتنة تجيء من ها هنا ، وأومأ بيده نحو المشرق من حيث يطلع قرنا الشيطان . رواه مسلم .<br />ومن العراق كان مقتل الحسين<br />فقد سُئل عبد الله بن عمر سأله رجل عن المحرم يقتل الذباب . فقال : أهل العراق يسألون عن الذباب ، وقد قتلوا بن ابنة رسول الله صلى الله عليه وسلم ، وقال النبي صلى الله عليه وسلم : هما ريحانتاي من الدنيا . رواه البخاري .<br />وفي رواية له عن ابن أبي نعم قال : كنت شاهداً لابن عمر وسأله رجل عن دم البعوض ، فقال : ممن أنت ؟ فقال : من أهل العراق . قال : انظروا إلى هذا يسألني عن دم البعوض ، وقد قتلوا ابن النبي صلى الله عليه وسلم ، وسمعت النبي صلى الله عليه وسلم يقول : هما ريحانتاي من الدنيا .<br />ومن العراق بدأ الرفض وانتشر فيه مذهب الرافضة<br />فقد كانت الكوفة هي معقل الرافضة ومنشأ القوم !<br />قال الذهبي في ترجمة عدي بن ثابت : ثقة لكنه قاص الشيعة وإمام مسجدهم بالكوفة !<br />ومن العراق خرجت الخوارج<br />قال يسير بن عمرو : قلت لسهل بن حنيف رضي الله عنه : هل سمعت النبي صلى الله عليه وسلم يقول في الخوارج شيئا ؟ قال : سمعته يقول - وأهوى بيده قِبَل العراق - : يخرج منه قوم يقرؤون القرآن لا يجاوز تراقيهم يمرقون من الإسلام مروق السهم من الرمية . رواه البخاري .<br />عن أبي نضرة قال : كنا عند جابر بن عبد الله رضي الله عنه فقال : يوشك أهل العراق أن لا يُجبى إليهم قفيز ولا درهم . قلنا : من أين ذاك ؟ قال : مِن قِبل العجم يمنعون ذاك ، ثم قال : يوشك أهل الشام أن لا يجبى إليهم دينار ولا مدى . قلنا : من أين ذاك ؟ قال : من قبل الروم . رواه مسلم .<br />والروم هم النصارى .<br />وفي العراق كان مَعمل وضع الأحاديث المكذوبة على النبي صلى الله عليه وسلم !<br />قال الإمام محمد بن شهاب الزهري : يا أهل العراق يخرج الحديث من عندنا شبراً ويصير عندكم ذراعا !<br />وفي بغداد بدأت فتنة القول بخلق القرآن<br />وفيها عُذِّّب الإمام أحمد رحمه الله على تلك البدعة الهوجاء الشوهاء !<br />ومِن العراق خرج القول بالقدر<br />ففي صحيح مسلم عن يحيى بن يعمر قال : كان أول من قال في القدر بالبصرة معبد الجهني ، فانطلقت أنا وحميد بن عبد الرحمن الحميري حاجّين أو معتمرين ، فقلنا : لو لقينا أحداً من أصحاب رسول الله صلى الله عليه وسلم فسألناه عما يقول هؤلاء في القدر ، فوفق لنا عبد الله بن عمر بن الخطاب داخلا المسجد فاكتنفته أنا وصاحبي أحدنا عن يمينه والآخر عن شماله ، فظننت أن صاحبي سيكل الكلام إلي ، فقلت : أبا عبد الرحمن إنه قد ظهر قِبلنا ناس يقرؤون القرآن ، ويتقفّرون العلم - وذكر من شأنهم - وأنهم يزعمون أن لا قَدَرَ ، وأن الأمر أُنف . قال : فإذا لقيت أولئك فأخبرهم أني برئ منهم وأنهم برآء مني ، والذي يحلف به عبد الله بن عمر لو أن لأحدهم مثل أحد ذهبا فأنفقه ما قبل الله منه حتى يؤمن بالقدر ، ثم قال حدثني أبي عمر بن الخطاب . ثم ذكر الحديث بطوله في سؤال جبريل للنبي صلى الله عليه وسلم .<br />وفي الكوفة والبصرة كان جهلة القراء أسرع من غيرهم إلى الفتن<br />وفي العراق ظهر الإرجاء أول ما ظهر .<br />وفي شوارع بغداد سالت دماء المسلمين على أدي التتار الأُوَل ، حتى جَرَتْ الميازيب بدماء المسلمين<br />ولا تزال تجري على أيدي عبّاد الصليب الهمج !<br />فلكِ الله يا بغداد<br />ليس من تأليفي ولكنه الواقع**"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132116/http://www.20at.com/article2.php?sid=794"

