[[comments]]
order = 7
subject = "العرب مساكين"
author = "المهندس"
posted = "2006-05-13"
text = "في زمن الطاغية المخلوع على يد أسياده الأمريكان كان العراقيون يحلمون بقناة واحدة يشعرون بمشاهدتها بالمتعة ولا يرون فيها وجهه القبيح الذي يقطع عليهم معظم البرامج حتى المباشر منها. ناهيك عن عدم قدرتهم عن التعبير عن آرائهم بحرية وصراحة كما يحدث الآن. والدليل على كون كثرة القنوات الاعلامية حالة جيدة ومطلوبة هو مسارعة بعض الدول العربية الى فتح قنوات (شبه مستقلة) عن حكوماتها مثل الكويت وسوريا والامارات وبدون أن يؤثر ذلك على وحدتها!؟ اضافة الى الدول الغربية وقنواتها الاعلامية التي لاتعد ولاتحصى. وموتوا بحسرتكم أيها المصريين والسعوديين والليبيين واليمنيين و....العرب المساكين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132116/http://www.20at.com/article2.php?sid=794"

