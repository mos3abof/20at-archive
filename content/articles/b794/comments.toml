[[comments]]
order = 0
subject = "هل تريد اصلاح العراق؟؟"
author = "من اراد اصلاح العراق فعليه اصلاح بلده أولا ."
posted = "2006-05-12"
text = "فاهل الجزيرة عليهم اسقاط ال سعود<br />وأهل مصر عليهم اسقاط الفرعون<br />وأهل سوريا عليهم اسقاط الاسد وجوقته المجرمة<br />وأهل الاردن عليهم اسقاط ملكهم الخائن لله ورسولة.<br />فلولا خيانة هؤلاء مجتمعين ، ما استطاعت أمريكا دخول بغداد ، والمكث بها هذه المدة الطوية.<br />إذن تحرير بغداد يبدأ بتحرية القاهرة والرياض ودمشق وعمان."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132116/http://www.20at.com/article2.php?sid=794"

