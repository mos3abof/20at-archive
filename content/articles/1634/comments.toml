[[comments]]
order = 0
subject = "بس خسارة والله ... يالا ممكن أدخل الجيش في الجنة ؟؟"
author = "محمد السيد"
posted = "2005-12-07"
text = "ش عارف هو المفروض أكون عايز أدخل ولا لأ ؟؟<br />الحقيقة أنا بأقول مش عايز ... مش عشان أهرب أو خايف من البهدلة .. لا سمح الله ... لكن أنا مستعجل ...<br />أنا عايز أخلص بسرعة الكلية ... وبعدها أجهز نفسي ... وأبحث عن بيت يجمعني باللي في بالي .... شفتوا الصراحة ؟؟ ...<br />كل اللي أعرفهم السنة دي اخذوا تأجيل .. و في الجيش اختاروا بعض التخصصات القليلة بس ... و باقي الكليات اختاروا الشباب مواليد يوم 30 سبتمير .... بس ...<br />تخيلوا حظ الناس دي .... يعني يوم واحد في السنة ممكن يفرق معاك ... واحد زيي ...يفرق معاه 3 سنين بحالهم ....<br />ممكن يكون يومك .. وممكن يكون يومي .....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151147/http://www.20at.com/article2.php?sid=27"

[[comments]]
order = 1
subject = "من التجنيد طازة"
author = "عبده"
posted = "2005-12-07"
text = "ظكم إني لسه جاس من التجنيد طازه وواخد إعفا عشان النظر ... الحمدلله<br />الناس لما كان بيعرفوا إنهم لبسوا.. كان في فيهم بيعيط .<br />الجيش زي المعتقل كده."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151147/http://www.20at.com/article2.php?sid=27"

[[comments]]
order = 2
subject = "عن تجربة أقول ......!"
author = "نت من \" الصفوة \" الذين \" فازوا \" \" بشرف ! \" دخول الجيش هذا العام ...."
posted = "2005-12-07"
text = "و عن تجربة أقول : التجنيد مالوش أي لازمة !<br />الحكاية كلها صفا و انتباه !<br />و تدريب لا يؤهل الجندي لأن يكون مقاتلا أو حتى يصلح لأن يكون درع بشري !!!!<br />من الاخر الغرض من التجنيد : عمل الجندي ببلاش في خدمات الجيش ...<br />من الاخر سنة ضائعة !<br />و ربنا يعوضنا عنها خير ان شاء الله !"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151147/http://www.20at.com/article2.php?sid=27"

[[comments]]
order = 3
subject = "ماذا اذا كان التجنيد يدمر المستقبل"
author = "مصطفى"
posted = "2005-12-31"
text = "انا الان مجند والتجنيد دمر لى مستقبلى ومستقبل اخوتى فماذا يكون الموقف لانى بدرس وكمان انا وحيد ورحت اعمل ورق الخدمه العسكريه فدخلت الجيش غلطه وكل ما اعرض الموقف على المسؤلين يقولولى كمل وخلاص طب ازاى اضيع سنتين من عمر وانا كمان وحيد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151147/http://www.20at.com/article2.php?sid=27"

[[comments]]
order = 4
subject = "ماذا اذا كان التجنيد يدمر المستقبل"
author = "مصطفى"
posted = "2005-12-31"
text = "والله العظيم بلدنا كلها كوسه يعنى انا لوكنت معايا وسطه كانت خلصت ليا ورقى من زمان بدل ما نا بقالى اربع شهور دايخ كده وفعلا صدق اللى قال لو نهر النيل صلصه عمره ما يكفى الكوسه اللى فى مصر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151147/http://www.20at.com/article2.php?sid=27"

[[comments]]
order = 5
subject = "اريدحلا"
author = "عادل شريف محمد"
posted = "2006-01-02"
text = "انا وحيد وميعاد تجنيدى قرب وبيقولولى انت حتدخل الجيش علشان امى ممعهاش بطاقه واورقها كلها ضائعه وماينفعش تطلع غيرها علشان السجل المدنى اتحرق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151147/http://www.20at.com/article2.php?sid=27"

[[comments]]
order = 6
subject = "اهاانة"
author = "الجندى المجهول"
posted = "2006-07-15"
text = "والة والة والة العظيم الجيش واهانة وزل وزل جامد وجيش عبارة عن اشغال شاقة ودا مش كلامى دا كلام ضبط فى الجيش وئالوا ان الجيش بعلم الجبن ايوة الجبن وخراب البيوت والهروب من الجيش المفروض لا يعاقب علية القانون علشان دى مش جريمة دى حاجة عملتها غزب عنى والمفروض يكون فى نظام وحقوق للعكرى المصرى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151147/http://www.20at.com/article2.php?sid=27"

[[comments]]
order = 7
subject = "مالوش اى لازمة"
author = "عادل المصرى"
posted = "2006-08-26"
text = "من الاخر احنا عمالين نطور فى الجيش ولما لبنان اتحرقت معملناش حاجة بجيشنا ولما اسرائيل قتلتلنا 6جنود على الحدود معملناش حاجة يبقى انا شايف ان الجيش مالوش اى لازمة وبيعلم الخوف والجبن بعد الجيش علشان انتا كنت خايف وجبان وانتا فى الجيش وده كلام ناس لسه مخلصين الزفت ده اللى اسمه لبجيش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151147/http://www.20at.com/article2.php?sid=27"

[[comments]]
order = 8
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-19"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151147/http://www.20at.com/article2.php?sid=27"
