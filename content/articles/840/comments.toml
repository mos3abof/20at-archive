[[comments]]
order = 2
subject = "أقولك حاجة ؟؟ لو قلبك مات خالص ... تجربة أنا مريت بيها"
author = "محمد السيد"
posted = "2006-06-16"
text = "أقولكم عن تجربة عملناها قبل كده ...<br />إحنا اتفقنا في يوم نزور مستشفي ونزور المقابر ....<br />وفعلا رحنا مستشفي للحروق ... والحقيقة كان شئ صعب فعلا ... لكن مؤثر للغاية ... فعلا حسينا قد إيه إحنا محتاجين لربنا وإن ممكن بمنتهي البساطة تحصل لنا أي حاجة ... ولا يكون لينا أي رد فعل فيها ....<br />بعد كده زرنا المقابر ... وهناك كانت أكبر عظة ممكن الإنسان يقابلها في حياته .... خصوصا إن واحد مننا كان أكبر مننا \"بنعتبره أستاذنا \" كانت جدته دفنت هناك ... وقعد يحكي لنا عنها وإنه بيجيي يحكي لها كتير .. وإن هذا من وصايا سيدنا النبي عليه الصلاة والسلام وإن الموتي بيسمعوا كل كلمة نقولها لهم ....<br />بس في نهاية اليوم ده .... كنا حاجة تانية خالص ... حاجة كده كأننا اتنفضنا أو رمينا من علينا هموم كتيره ... وارتحنا شوية من مشاغل وزحمة الحياة ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123840/http://www.20at.com/article2.php?sid=945"

[[comments]]
order = 3
subject = "وكمان تشوف صحابك الملتزمين"
author = "محمد السيد"
posted = "2006-06-16"
text = "طبعا أنا مش قصدي إن ده بس اللي يصحي قلبك ... أو إن الدنيا كلها كده ...<br />لكن دي كانت وسيلة جربناها وفي وسائل كتيييييييير ممكن كل واحد فينا يعملها ...<br />من أحلي الوسائل ... الرسول بيقول لنا مصاحبة الصالحين ...<br />أنا عندي واحد صاحبي .... بيفكرني بسيدنا عمر ... كل ما الحكاية بتقفل معايا وأقابله .... بيغير لي حاجات كتير .... ربنا يكرمه ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123840/http://www.20at.com/article2.php?sid=945"

