posted = "2006-09-08"
text = "للاسف الشديد انا امر بهذه التجربة الصعبة ففى بداية الالتزام كنت قريبة جدا من الله عز و جل و كان يكفينى سماع اى دعاء او اية قرآنية لابكى بشدة و لكم ان تتخيلوا انى اصبحت على النقيض ولكنى والله احاول العودة بشدة لذا استحلفكم الله بالدعاء انه ليس بالامر الهين"
