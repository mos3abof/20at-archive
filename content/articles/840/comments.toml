[[comments]]
order = 10
subject = "الايمان يزيد وينقص"
author = "nan"
posted = "2006-07-31"
text = "السلام عليكم<br />جزاكم الله خيرا الموضوع اللى فعلا كلنا بنعانى منه. احيانا الواحد بتكون همته عاليه جدا وبيحاول يعمل على قد ما بيقدر خصوصا عند تذكر هادم اللذات ومفرق الجماعات. لكن النفس أمارة بالسوء واحيانا فيه حاجات بعد التزامنابتحصل بتشدنا تانى لورا واحيانا بنستجيب لها لكن لازم نقاومها تانى وما نستسلمش<br />وعزائى الوحيد فى كده قوله تعالى\"قل يا عبادى الذين اسرفوا على انفسهم لا تقنطوا من رحمة الله\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123840/http://www.20at.com/article2.php?sid=945"

