[[comments]]
order = 7
subject = "أمرا: إلزم اليمين"
author = "في صمتك مرغم"
posted = "2006-06-22"
text = "مش عارف أبدأ ازاي ولا أقول ايه<br />بص صراحة انا مش لاقي وصف غير اني بكون زي \"الكلب الضال\" أسف لو كانت الكلمة بذيئة شوية, لكن فعلا بحس بده, مش هقدر أوصفلكم شعور انك تكون ناسي نفسك, مش عارف هي موجودة اصلا معاك ولا لأه, يمكن بتموت في اليوم ألف ألف مرة وانت مش حاسس, والله أشد من الموت, الموت راحة ما بعدها راحة, لكن انك تكون كل علاقتك بلاحياة مجرد شهيق وزفير فللأسف بعقلك الغبي ده بقيت أقل من الحيوانات<br />\"يا أيها الذين آمنوا استجيبوا لله وللرسول اذا دعاكم لما يحييكم..\"<br />ياربنا... فعلا والله هي دي الحياة , مش هقول حياة حقيقية او حتى بجد, لكن هي دي الحياة الوحيدة, وأي وجود لحاجة غير كده تبقى مش حياة,,, موت او ضلال مش هتفرق كتير<br />اللهم اجعلنا دائما من أهل اليمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123840/http://www.20at.com/article2.php?sid=945"

