[[comments]]
order = 25
subject = "للأسف"
author = "لا حول ولا قوة إلا بالله"
posted = "2006-05-29"
text = "بعدما أعطانا مرشحي هذه الحكومة الأمل في ان تنتهي مأساتنا نجدهم أول من يطعننا<br />نعم نحن موظفي مؤسسة البحر وسلطة الطيران والهلال الأحمر الغير مثبتين على كادر ديوان الموظفين<br />اعلن عدد من مرشحي الحكزمة بأن البطالة سوف تنتهي وسوف يتم تثبيت البطالة كافة ولكن قبل عدة أيام يتخذ وزير المالية قرار بإنهاء خدماتنا<br />حسبنا الله ونعم الوكيل<br />وأقول لهذه الحكومة إن قطع الأرزاق من قطع الأعناق<br />ولا حول ولا قوة إلا بالله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125239/http://www.20at.com/article2.php?sid=337"
