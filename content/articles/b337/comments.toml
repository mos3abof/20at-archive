author = "أبو العبد"
posted = "2006-05-07"
text = "بداية أبدأ بحمد الله<br />إن هذا الفوز ليس نصر بقدر ما هو إختبار وإبتلاء من الله نحن مهمتنا الأن ليست كالسابق جهاد فس سبيله فقط مهمتنا الأن إقامة الخلافة التي نسعى لهاوسنصل لها بعون الله فهذا الحصار دليل صدقنا وإخلاصنا لله وكل ما نسأله إياكم الأن الدعاء لنا بتحقيق الهدف وأرجو من أحبائنا في فتح التي ناضلت لا بل جاهدت بإذن الله وكنا كتفا بكتف في معبر رفح وفي كوسوفيم وغيرها الكتير أسالكم أن تتحدوا معنا والله نحبكم ونتمنا أن يرمم الشق والخلاف بيننا وفي الختام نحن إخوان في الله نحن أبناء فلسطين نحن مسلمون<br />والله ولي التوفيق<br />أخوكم في الله / أبو العبد هنية"
