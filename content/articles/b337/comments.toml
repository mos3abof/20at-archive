posted = "2006-02-23"
text = "ياجماعة اللي بيفكر بروية بيعرف مين هي حماس وشضو هي سياستها احنا العرب دائما مستعجلين على النتائج قبل العمل<br />انتظروا وسترون باذن الله<br />اليهود الان يخافون من حماس وكل يوم تصريح واخر تصريح كان لهم حماس لاتشكل خطرا الان ولكن جدولها النتخابي وبرنامجها السياسي يشكل خطرا في عام 2027 وستكون هناك انقلابات في السياسة الدولية والاقليمية هذا ماجاء على لسانهم"
