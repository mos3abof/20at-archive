order = 0
subject = "الله اكبر ولله الحمد"
author = "حقا انى لا استطيع ان اخفي فرحي بفضل اله على حماس واكتساحها النتائج"
posted = "2006-01-26"
text = "ولكن ما احوجنا الى ان نجنب العواطف قليلا ونستخدم لغة العقل<br />حماس الان لا تمثل مجرد نفسها<br />ولا هى ايضا تقصر تمثيلها على ان تمثيل لخيار المقاومة<br />ولا هو فقط تمثيل للاخوان المسلمين<br />انه تمثيل للتيار لاسلامي<br />واختبار حقيقي لقدرة المشروع النهضوي الاسلامي على النجاح في عالمنا العربي<br />هل حقا ستثبت حماس بان الاسلام هو الحل ليس فقط لفلسطين بل هو الامل الوحيد للانسانية<br />ام انها ستصبح حلقة جديدة في فشل المشروع الاسلامي كما سبقتها التجربة الجزائرية والسودانية ولافغانية<br />اتمنى لهذا الهذا المشروع النجاح<br />الاسلام هو الحل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125239/http://www.20at.com/article2.php?sid=337"

