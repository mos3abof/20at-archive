text = "اولا احب اهنأ كل الشعب الفلسطيني بالانتخابات التاريخية التي جرت و اخيرا بقا عندنا بلد ديوقراطي عربي<br />ثانيا احب الا نتسرع في المباركة لحماس و ندخر جهدنا لمساندتها امام العالم الرافض لها<br />ثالثاو هو الاهم احب انا ارى من لحماس منهجا لايتفرغ لتسوية حسابات قديمة و يكرر اخطاء الاخرين<br />كفانا فرقة و لنتوحد و لو مرة<br />كفانا احزاب متناحرة و لنتحد<br />حرام عليكوا و الله"
