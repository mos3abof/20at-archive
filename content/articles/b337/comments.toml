subject = "لم يمض 24 ساعة!"
author = "محتار"
posted = "2006-01-29"
text = "القيادي الكبير في حركة حماس محمود الزهار السبت 28-1-2006م أنه لا يعتبر الولايات المتحدة عدوا, وأن الرئيس جورج بوش يمسك بمفتاح السلام في المنطقة.<br />وفي مقابلة أجرتها معه شبكة التلفزة الأمريكية سي.بي.اس في منزله بقطاع غزة, قال الزهار \"لا نعتبر أمريكا عدونا\"<br />لم يمض 24 ساعة عل اعلان فوز حماس باغلبية ساحقة بدا الاخوة في حماس يخلعون ثيابهم! وامريكا التي كانت تلعن على المنابر لم تعد عدو .... و عجبي على وساخة السياسة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125239/http://www.20at.com/article2.php?sid=337"

