[[comments]]
order = 15
subject = "لم افرح كثيرا لفوز حماس"
author = "مسلم"
posted = "2006-01-28"
text = "لم أفرح كثيرا لفوز حماس بل لعلي أهتممت .<br />فالاسلاميون في وطننا العربي ليس لهم تجربة في الحكم-إذا استثنينا تجربة الترابي الفاشلة- ثم أن ادوات الدولة الاسلامية لم تكتمل بعد واعنى بها الدستور ومؤسسات المجتمع المدني المؤصله شرعا .<br />والاهم من ذلك أن من حول حماس - واعنى بهم طواغيت العرب ، لا يرجون خيرا للاسلام ولا أهله ، وأظنهم سيسعون جاهدين هم واسياهم من الكفرة الى افشال مشروع حماس ، ووضع العراقيل أمامها .<br />إن فشل حماس سينسب الى الاسلاميين ، فيقال إن الاسلاميين لا يصلحون لقيادة دولة.<br />كم كنت أتمنى أن لا تدخل حماس دهاليز السياسة ، وتبقى في خنادق الجهاد حتى تقوم دولة الشريعة في الجزيرة أو مصر أو أي قطر عربي آخر.<br />فذلك -والله - أشرف لها وأكرم.<br />أما -إذ دخلت - فما أظن حماس ستبقى كما هي - الا أن يشاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125239/http://www.20at.com/article2.php?sid=337"

