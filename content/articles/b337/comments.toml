text = "الحمد لله الذي نصر حماس عسكريا وسياسيا .. ونسأله سبحانه أن يوفقها لقيادة الشعب الفلسطيني إلى ما فيه عزه وإصلاحه .<br />بس برضه الواحد لسه مش مصدق ، يعني بعد كام يوم هنسمع : \"وقد صرح رئيس الوزراء الفلسطيني محمود الزهار ؟؟ ، أما وزير الخارجية خالد مشعل فقد رأى أن ال.... \"<br />ربنا ينصر إخواننا في كل مكان يا رب ."
