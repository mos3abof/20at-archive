[[comments]]
order = 13
subject = "ماذا يريد الفتحاوية؟"
author = "قارئ بالصدفة"
posted = "2006-01-28"
text = "فتح هي الوجه الحقيقي للعلمانية في العالم العربي و هاهي العلمانية الخبيثة تفضح في فلسطين بعد فضيحتها بجلاجل في مصر<br />هؤلاء العلمانيون لا يريدون مصلحة وطن و لا يقصدون تطويرا... بل يريدون مزيدا من السرقة و انتهاك الحرمات دزن أن يكون هناك رادعا حتى لو كان الإسلام<br />إنها المعركة القديمة بين أنصار محمد و طواغيت قريش لا تزال مستمرة<br />فتح...انت على المحك الآن...إما إثبات ولائك لقضايا الأمة و ليست للعصبيات و الشخصيات و إما خنجرا بيد الصهاينة<br />اللهم اجعل نصر حماس بداية الفتح المبين و اجعلنا من الفطنين الصابرين<br />{وَنُرِيدُ أَن نَّمُنَّ عَلَى الَّذِينَ اسْتُضْعِفُوا فِي الْأَرْضِ وَنَجْعَلَهُمْ أَئِمَّةً وَنَجْعَلَهُمُ الْوَارِثِينَ }القصص5<br />و الله لأكبر و لله الحمد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125239/http://www.20at.com/article2.php?sid=337"

[[comments]]
