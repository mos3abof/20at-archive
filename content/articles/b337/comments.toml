posted = "2006-01-28"
text = "تخيلوا لو بكرة الجهاد الاسلامي عملوا عملية استشهادية فماذا يتفعل لهم حماس هل تجبرهم على التزام الهدنة مع اسرائيل بالقوة ام تبارك لهم!! اتوقع ان القادم اسوا والانقسامات بين الفصائل الفلسطينية ستتعمق. لو بقيت حماس كمعارضة رئيسية وقوية لكان خيرا لها من الامساك بالحكم خصوصا ان قادة حماس لا قبل لهم بالسياسة<br />الله يستر من الفتنة"
