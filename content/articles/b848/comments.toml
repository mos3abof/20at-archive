[[comments]]
order = 4
subject = "قديمة"
author = "اية دة"
posted = "2006-05-24"
text = "الموضوع فكرته قديمة ومافيهوش جديد والفصة معروفة واللي عاوز يعرف اكتر يكتب \"دارفور\" على جوجل.<br />يا استاذ ياللي كاتب المقال فين الجديد يا بتوع عشرينات فين التجديد<br />اية الملل ده مواضعيكم بقت مكررة وقديمة الله يرحمك يا عشرينات شوفلكم حاجة جديدة علشان زمان كنتوا حتى لو اتكلمتوا عن موضوع قديم بيكون لية زاوية او حتة جديدة<br />يعني دلوقتي اية الفرق بينكم وبين الاخبار والاهرام والجمهورية ..<br />دي رسالة تنبية لواستمرتوا بنفس الموضوعات القديمة دي وجربوا كدة اكتبوا \"دافور\" على جوجل..<br />بالمناسبة موضوع مهرجان كان جميل جدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125204/http://www.20at.com/article2.php?sid=848"

[[comments]]
order = 5
subject = "صحوة من غفوة"
author = "رائد بغدادي"
posted = "2006-05-30"
text = "ألاخ أحمد ...مقالك جاء في أوانه ليتعرف شباب الاسلام احفاد القعقاع وخالد والخطاب عمر بمايحدث في دارفور ...اخواني في الله العالم كله يعرف سبب مشكلة دارفور وهي من البداية عمليه لتفتيت الاسلام وتفتيت شعب تمسك بسنة الله ونبيه صلى الله عليه وسلم<br />كل المشكلة في دارفور هي انكم قد سمعتم بالمنظمات الانسانية التي تأتي الى افريقيا ونسمع عنها من المجتمع الغربي ...اخواني هذه المنظمات هي منظمات تبشيرية تعمل على تنصير المسلمين بحجة توفير الطعام لفقراء افريقيا ...اعطيك رغيفا وكن مسيحيا ...ويدرسوهم ان هذه المساعدات من تعاليم السيد المسيح عليه السلام وانه بعثه اليهم تحت خيمة الانسانية وبعد ان اكتفوا من افريقيا وتعلمون جميعا ان افريقيا الان امتلئت بالكنائس قرروا ان يتقدموا نحو السودان ولكن احفاد عمر كانوا لهم بالمرصاد ومنعوهم من دخول بلدهم فأشعلوا نار الفتنه بين الشعب الواحد ولكن هيهات لانه سبحانه وتعالى يقول ((يريدون أن يطفؤؤا نور الله بأفواههم ويأبى الله الا ان يتم نوره))<br />صدق الله العظيم<br />ملاحظة: جائت المنظمات التبشيرية الى شمال العراق بعد حرب الكويت عندما انفصل الشمال عن العراق ولكن أهل السنة كانوا لهم فولوهم الادبار حتى عادوا خائبين بعد تكبيدهم خسائر لاحصر لها حتى تابوا من هذا العمل في العراق العظيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125204/http://www.20at.com/article2.php?sid=848"

[[comments]]
order = 6
subject = "التهميش"
author = "ريم"
posted = "2006-06-03"
text = "اشكر الكاتب على هذا الطرح مع ان الكثير من الشباب العربي لم يكن مهتما بالقضايا التي تمس الوطن,اردت ان اذكر شيئا مهما غفل عنه الكاتب الا وهو سياسه التهميش التي لجات اليها حكومه الانقاذ منذ توليها كراسي الحكم,ذكر الكاتب انه بعد تقسيم الجنوب والغرب والشرق لن يكون هناك سوى الشمال والوسط لكي تفرد عليه الحكومه سلطتها والحقيقه ان الحكومه الموقره طوال فتره حكمها لم تهتم سوى باأقليم الشمالي فقط واتخذت سياسه التهميش تجاه بقيه المناطق فالسلطه والثروه والتطوير كان من نصيب الشمال فقط,اما الصراع الذي كان دائرا في دارفور ومنذ سنين طويله لم تعره الانقاذ اي اهتمام وسدت اذن من طين والاخرى من عجين ولم تتدخل الا بعد تفاقم الاوضاع وعندما اصبح للموضوع اصداء عالميه ورؤى دوليه وهي التي كانت تعتقد ان سياستها المتعسفه تجاه العرق الافريقي داخل دارفور سيمر مر الكرام كما مر غيره,لكن الامر خرج عن نطاق سيطرتها في الاقليم ,ان مايعانيه السودان عموما واقليم دارفور خصوصا من تمييز عنصري تفاقم وانعكس واضحا جليا في ازمه دارفور والقادم امر.......أما ما ذكره احد الاخوه في تعليقه عن حمله تبشيريه والغذاء مقابل التنصير لهو شئ مضحك ,,,,فأنا اقول لك اذا كان شخص قد فقد المأوى والغذاء والكساء والدواء ولم يقدمه لي شخص مسلم مثلي ووقف يتفرج وقدمه لي المسيحي واللاديني فسوف ادين بعقيدته حتما...اسألك اين المسلمين مما يحدث في دارفور فقط المنظمات الاوروبيه والغربيه هي من قدمت يد المساعده للنازحين المشردين............"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125204/http://www.20at.com/article2.php?sid=848"

