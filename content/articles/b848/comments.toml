text = "متىيعرف المسلمون حدود ارضهم وان مشكله دارفور ليست مشكله مسلمين ومسيحيين<br />والعجيب ان معظم شعب دارفور مسلم<br />ولكنه المؤمرات على امه محمد لكى يتم تقسيم اكبر دوله عربيه فمتى نفيق............."
