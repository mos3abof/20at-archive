text = "تنقسم دارفورإلي شمال دارفوروعاصمتهاالفاشروجنوب دارفوروعاصمتهانيالا وغرب دارفور وعاصمتهاالجنينة واقولهابكل صراحةان ماينقله الاعلام عبارةعن افتراءات المقصود منه مآرب تعرفها امريكا فيكفي أن دارفور معروفة علي مستوي السودان بأنهابلد القرآن وسأواصل عن كل ولايات دارفورعلي حدة جغرافيا سياسياإقتصادياوإجتماعيا"
