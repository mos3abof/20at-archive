[[comments]]
order = 0
subject = "هو ده"
author = "صايع وقديم"
posted = "2006-05-23"
text = "ايوه كده يا عشرينات هي دي المواضيع اللي احنا محتاجنها .... بقالكم فتره بتعكوا بس الموضوع ده في الجون ... يا ريت تتكلموا عن الحاجات اللي مش عارفينها الشباب و يبقي الموضوع زي كبسوله صغيره تفهم الشباب ايه اللي بيجري حواليه مش تبقي مواضيع هايفه و اي حاجه في اي حته<br />صايع و قديم<br />موزع موسيقي قديم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125204/http://www.20at.com/article2.php?sid=848"

[[comments]]
order = 1
subject = "كل شىء بيفور"
author = "ديمة"
posted = "2006-05-23"
text = "بجد ربنا يكرمك انا كان نفسى افهم ايه اللى بيحصل ومين زعلان ليه، وكما توقعت طلعوا ناس هايفة والغلابة متبهدلين كده زى الجاليرى الحلو بضراوة اللى انتوا عملينه، تسلم ايدكم .. وللأسف مش دارفور بس كل حادة حولينا بتفور عقبال دمنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125204/http://www.20at.com/article2.php?sid=848"

[[comments]]
order = 2
subject = "ليست كل دارفور .. دامية"
author = "واحد من السودان"
posted = "2006-05-23"
text = "بما اني من السودان، ربما أكون أحسن من غيري في الالمام بما يحدث في دارفور<br />لكني احببت ان اعبر عن اعجابي.. بطريقة عرض الموضوع..<br />لقد كانت الصورة موفقة لمدى بعيد، واخرجتنا قليلا من حصار الاعلام الغربي الذي لم يجد في دارفور الا صور الاشلاء والدمار ليعرضها للعالم.. ليؤكد لنا ان ازمة دارفور المعاصرة.. صنعت صناعة اعلامية..<br />نحن لا ننكر المآسي والصور المفزعة لكل انسان.. لكن ليس بالضرورة ان تكون المآسي على الدوام في الواجهة.<br />من خلال هذه الصورة الجميلة لهذه البنت الدارفورية المنكوبة نستطيع ان نحلم بمستقبل جديد نشارك في صناعته نحن بسواعدنا واعلامنا وبرامجنا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125204/http://www.20at.com/article2.php?sid=848"

