order = 11
subject = "يعني أيه دارفور"
author = "ابوريان"
posted = "2006-07-23"
text = "بسم الله أبدا هذا التعليق وأسأل الله أن أوفق فيه _ عزيزي القارئ إذا أمعنت النظر قليلا في قضيه دارفور تجد أنها قد تم تصعيدها للرأي العام العالمي علي أنها كارثه إنسانيه وبالطبع لا تحتاج لكثير من العناء في التفكير عزيزي القارئ كي تعلم أن هذا التصعيد ذو السرعه الجنونيه لقضيه دارفور أن من تولت كبره هي الاداره الامريكيه _فهل هذا يعني أن الاداره الامريكيه يؤرق مضجعها حال أبناء دارفور ؟ (ابوريان)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125204/http://www.20at.com/article2.php?sid=848"
