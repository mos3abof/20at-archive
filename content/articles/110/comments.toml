[[comments]]
order = 1
subject = "منقول من العربية نت"
text = "نفى طارق بن فارس مالك ومشرف موقع الساحة (alsaha.net) أن يكون موقعه من المواقع التي تدعو إلى التطرف والقتل والإرهاب، ويؤكد بن فارس في هذا الصدد أن الساحات ليست ناطقا باسم القاعدة أو تدعو لتبني أفكارها \"ونحن نعمل على حجب وحذف البيانات التي تدعو للعنف والقتل\"، ولكننا في نفس الوقت - يتابع بن فارس- \" ننشر الآراء التي يوافق هواها فكر القاعدة أو أي فكر آخر، وذلك بغية تبادل الآراء والنقاش وبالتالي إشاعة أجواء ايجابية وجيدة من تبادل الحوار وتفهم الرأي الآخر\".<br />ويعتبر موقع الساحة الذي يتخذ من إمارة رأس الخيمة بالإمارات العربية المتحدة مقرا له، من أشهر المواقع العربية على الإطلاق، حيث يزوره حوالي 700 ألف شخص يوميا، ويتمتع بمتابعة واسعة في دول الخليج، الأمر الذي يعزوه البعض للحرية الواسعة التي ينعم بها المشتركون في الساحات في طرح القضايا والآراء بأنواعها، بما فيها تلك الآراء السياسية المخالفة للمألوف."
archived = "2004-07-01"
capture_url = "https://web.archive.org/web/20040701180851/http://www.20at.com:80/article.php?sid=407"

[[comments]]
order = 2
subject = "2"
text = "ومن المعروف أن موقع الساحة هو أول منتدى عربي على الإطلاق، حيث أسسه طارق بن فارس عندما كان طالبا في الولايات المتحدة الأمريكية عام 1994م. وقد أدى النجاح الساحق لمنتدى الساحة إلى نشوء مئات المنتديات العربية الأخرى التي قلدته إلى حد كبير، بما في ذلك تصنيفات المنتديات وطريقة عرضها، وكان لهذا أثره في انتشار المنتديات في أوساط الشباب العربي وخاصة في منطقة الخليج العربي.<br />ويقول بن فارس لبرنامج \"الكلمة الفاصلة\" الذي تبثه إذاعة بانورما غدا الخميس إن الغاية من إنشاء الساحات لم يكن من ورائها دوافع مادية أو أن يكون \"الموقع للتجارة والبيزنس\"، وهنا ينوه بن فارس لتلقيه عدة عروض ومن عدة جهات لشراء الموقع، وقد وصلت بعض العروض إلى اكثر من مليوني دولار، لكن تم رفضها جميعا.<br />وعن إمكانية فتح باب التسجيل أمام أعضاء جدد، وخاصة أن التسجيل في الساحة تم إيقافه منذ فترة طويلة، أوضح بن فارس أن هناك اتجاها لدى إدارة الموقع لفتح باب التسجيل مجددا مقابل اشتراك مالي، وربما يتم ذلك مع بدايات شهر رمضان حيث من المتوقع أن \"تشهد الساحات نقلة نوعية جديدة\".<br />وعند سؤاله فيما إذا كان الملك الأردني الراحل حسين بن طلال كان يكتب باسم مستعار في \"الساحات\" أجاب بن فارس \"لسنا متأكدين من ذلك، وإن كانت هناك أخبار قوية تؤكد أنه كان يكتب في موقعنا بلقب مستعار\".<br />وعن عدم حجب الموقع في السعودية رغم عرضه لأفكار \"متطرفة\" قال بن فارس \"رغم انه تم حجب الموقع لفترة من الزمن في السعودية، إلا أن السعوديين متفهمين لطبيعة موقع الساحات، وليس عندهم أي حساسية تجاه مبدأ الحوار ما دام يؤدي إلى نتائج جيدة\"، يذكر أن برنامج \"الكلمة الفاصلة\" سيتم بثه عند الساعة السابعة مساء بتوقيت غرنيتش، وقد أجرى الحوار مع طارق بن فارس الإعلامي مساعد الثبيتي."
archived = "2004-07-01"
capture_url = "https://web.archive.org/web/20040701180851/http://www.20at.com:80/article.php?sid=407"

