subject = "عشريناتي قديم..!!"
text = "كيف أسلمت ..!!<br />بقلم :يوسف إسلام<br />\"ولدت في منزل مسيحي يقدس المال.. فنشأت مثلهم .. وعندما أصبحت يافعاً بهرت بالمغنيين الذين أراهم في وسائل الإعلام حتى اعتبرتهم إلهي الأعلى!؟ ثم قررت أن أخوض تجربتهم .. وبالفعل أصبحت من أشهر نجوم \"البوب\" وصورتني وسائل الإعلام وكأنني أكبر من العالم وبأنني سأعيش أطول من الحياة نفسها، وأنّ من صدق هذا هو أنا.. ولكن في يوم ما ..مرضت مرضاً اضطرني للمبيت في المستشفى.. مما أتاح لي فرصة التفكير فوجدت نفسي عبارة عن جسد ، وكل ما كنت أعمله في السابق هو إرضاء لهذا الجسد فقط.. واعتبرت هذا المرض منحة إلهية وفرصة لأفتح عيني.. لماذا أنا هنا ؟ وماذا أفعل في هذه الحياة؟<br />تابع القصة علي الرابط التالي :<br />http://arabic.islamicweb.com/christianity/con_yusuf_islam.htm"
archived = "2004-10-27"
capture_url = "https://web.archive.org/web/20041027191432/http://www.20at.com:80/article.php?sid=643"

