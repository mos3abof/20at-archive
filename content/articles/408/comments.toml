subject = "فتاة مسلمه غيورة على دينها جدا"
text = "نحن الان نرى ان الشخص الذي يسلم من الدول الغربية يعامل فيها معامله لاتسر صديق وانما تسر عدو انا اقول لكل مسلم في تلك البلدان انتظرو ا (الا ان نصر اللة قريب )اتمنى من كل قلبي ان تصل دعواتي الى اسلام يوسف وسامي يوسف بارك الله لكم كل ما تفعلونه من اجل الاسلام"
