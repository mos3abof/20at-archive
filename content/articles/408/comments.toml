subject = "وائل عباس"
text = "انا من المعجبين بيوسف اسلام قبل ان يسلم وبعد ان اسلم وان كانت لي بعض التحفظات على تشدده في بعض الامور غير السياسية اما وجهة نظره السياسية فانا اتفق معها تماما<br />ولكن دائما ما يطاردني سؤال<br />ما هو رد فعل العالم اذا اسلم واحد زي مايكل جاكسون<br />وبالعالم اعني نحن والغرب على حد سواء<br />واذكر مايكل جاكسون بالذات ليس لانه انسان سيء او جيد ولكن لانه انسان اثار الكثير من الجدل ..."
archived = "2004-10-27"
capture_url = "https://web.archive.org/web/20041027191432/http://www.20at.com:80/article.php?sid=643"

