subject = "واشنطن –أ ف ب – إسلام أون لاين.نت/30-9-2004"
text = "طالب وزير الخارجية الأمريكي كولن باول مختلف الأجهزة المعنية في الإدارة الأمريكية بإعادة النظر في قرار منع ناشط السلام البريطاني المسلم يوسف إسلام والمفكر الإسلامي السويسري طارق رمضان من دخول الولايات المتحدة، ومعرفة مدى صحة الأسس التي استند إليها قرار المنع.<br />وقال باول في لقاء نشرته وكالة الأنباء الفرنسية الخميس 30 -9-2004: إنه طلب من مختلف الأجهزة المعنية في الإدارة الأمريكية (الخارجية والأمن الداخلي والاستخبارات) إعادة النظر في الأسس التي استندت إليها في اعتبارهما (إسلام ورمضان) شخصين غير مرغوب فيهما.<br />وأضاف: \"أعتقد أن من واجبنا إعادة النظر في هاتين الحالتين لنرى ما إذا كانتا مبررتين، وما إذا كانت الأسس التي استندنا إليها لرفض دخولهما صحيحة\".<br />وأكد وزير الخارجية أن هذا الاهتمام (بهما) ليس مبررا بشهرة الرجلين، بل ينطبق أيضا على \"المواطن العادي الذي يأتي (إلى الولايات المتحدة) ويتم توقيفه\"، في محاولة منه لإظهار درجة الديمقراطية وحرية الإنسان التي تقول واشنطن إنها أساس للتعامل فيها.<br />وكان يوسف إسلام متوجها الأسبوع الماضي من لندن إلى واشنطن، لكن مسار طائرته حول إلى مطار بانجور (شمال شرق). وقد أعيد إلى بريطانيا بذريعة \"حماية الأمن القومي\"؛ لأن اسمه مدرج على لائحة لأشخاص يخضعون للمراقبة، حسبما ذكرت السلطات الأمريكية."
archived = "2004-10-27"
capture_url = "https://web.archive.org/web/20041027191432/http://www.20at.com:80/article.php?sid=643"

