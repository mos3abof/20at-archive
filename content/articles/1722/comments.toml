posted = "2006-02-19"
text = "هايل فعلا لو حصل كده لان المكفوفين دول ماهمشي زنب انهم ما يقروش كلام ربنا سبحانه وتعالى لكن اللي بيعمل الحكايه دي لازم ياخد باله احسن يغلط في حرف ولا اتنين ودي تبقى مصيبه زي ماعملت بسلامتها امريكا والفت كتاب سمته الفرقان الحق عشان تمحو بيه القران لكب ظنهم خاب (((بسم الله الرحم الرحيم انا نحن نزلنا الذكر وانا له لحافظون صدق الله العظيم )))"
