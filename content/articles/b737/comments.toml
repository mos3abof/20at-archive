[[comments]]
order = 1
subject = "بحب اوضتى"
author = "نيفين"
posted = "2006-04-27"
text = "بحبها بكل ما فيها و لو اتعرض عليا ابدلها باحلى اوضه ف الدنيا هقول لا<br />و هى زى اى اوضه مكركبه من اللى ف الصور<br />بحبها كده بكركبتها<br />بالشوز اللى فوق المكتب<br />بدواوين الشعلا اللى اكتر من كتب الدراسه بجهاز الكمبيوتر اللى راكناه على طول<br />بالقهوه اللى مكبربه ع السجاده اللى ادام البلكونه<br />بالبلاطه المكسوره اللى بحب بيها من تحت الموكيت و انا ماشيه<br />ببوسترات فيروز و سعاد و عبد الحليم اللى كل ما اعلقها اخويا يدخل يشيلها و يخرج علشان بيقول حرام بهدومى المرميه ف كل حته<br />بالراديو المظبوط على اذاعه الاغانى بحبها كده<br />و لما بتترتب ببهدلها تانى<br />الكركبه ونس برده يا جماعه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114146/http://www.20at.com/article2.php?sid=737"

[[comments]]
order = 2
subject = "رسوني على حل؟؟"
author = "اسكندراني"
posted = "2006-04-29"
text = "مرحبا بالشباب ، وانا شاب زيكم.. بس لدي فكرة مختلفة حول غرف المراهقين . اعتقد ان فوضى غرفنا الخاصة هي تقليد منا لا معنى له لغرف تفيان وفتيات غربيين ..اذا كنت خطا نوروني.<br />لا معنى لغرفة كها فوضى ؟ ايه معنى تجد ملابس داخلية كريهة فوق المكتب ؟؟؟ دة حرام والله.. ويسيء الينا كشباب.<br />لازم نعيد النظر ازاي تكون غرفنا في مستوى الحد الادنى من التنظيم والفرفشة.<br />اكيد في شباب مش هيعجبو كلامي بس دة راي<br />ومع تحيات خالصة للموقع على اثارته هذه الخصوصية من حياتنا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114146/http://www.20at.com/article2.php?sid=737"

[[comments]]
order = 3
subject = "انت لسة شفت؟"
author = "مصري ابن مصرية"
posted = "2006-04-29"
text = "ياحبيب قلبي هو انت بس اتعجبت من ملابس داخلية كريهة فوق مكتب !!! ايه رايك لو قلت لك في شباب مبينضفش خالص مناطق العرق في جسمه .. دي مصيبة ولما تخش لغرفته تحس أنك داخل لغار حيوان واسف على الكلمة ولكن دعونا نكون صريحين مع انفسنا..عشان كدة بنسمع اباء وامهات بيتدخلوا في الغرفة لانها بحق وحقيق مبقتش غرفة بني آدم.. ربنا يستر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114146/http://www.20at.com/article2.php?sid=737"

[[comments]]
order = 4
subject = "حرام عليك يا مصري"
author = "مغربي"
posted = "2006-04-29"
text = "ارى ان اخونا المصري زاد فيه كما نقول بالمغربية .. لا يعني انك تعرفت على شباب غير نظيف فكل المراهقين كذلك.. هناك مراهقين ومراهقات غرفهم في قمة التنظيم واللطافة ولما تدخل اليها تحس بسكينة وعالم آخر يتعدى الجدران ..<br />لا ينبغي التعميم باي حال والمشكل ليس في المراهقة او فترة الشباب ولكن في العقلية. صح؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114146/http://www.20at.com/article2.php?sid=737"

