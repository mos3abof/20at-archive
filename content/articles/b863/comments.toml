[[comments]]
order = 1
subject = "نسمع جعجعة ولا نرى طحنا"
author = "كل ماذكرتم من خطوط حديدية في مزرعة بن سعود هي مشاريع وهمية أو لعلها على الورق الغاية منها سرقة أموال الامة على يد لصوص ال سعود."
posted = "2006-05-27"
text = "لا يوجد خط عامل في مزرعة بن سعود الا ما يربط الرياض بالشرقية والهدف واضح وهو تيسير سرقة مقدرات الامة لصالح قرن الشيطان (بن سعود).<br />لو كان القائمين على السعودية من المخلصين(أنى لهم وهم مجموعة من اللصوص) ، لكان اولى اولوياتهم ربط بلادهم المترامية الاطراف بسكة حديد تصل الى كل مدينة بل وكل قرية في هذا البلد-بدلا من تضييع الاموال على شهواتهم التي لا تنتهي."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132214/http://www.20at.com/article2.php?sid=863"
