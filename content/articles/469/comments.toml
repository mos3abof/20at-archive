subject = "تشجيع تدريجي للفسق والفجور"
text = "كثر الكلام عن الحب أيامنا هذه وبشكل لا اخلاقي ونجد من يؤيد هذا الموضوع ويشجع عليه هم أكابر المثقفون من الأساتذه في الجامعات وغيرهم ولا ادري هل هم يهدفون بعملهم هذا توحيد الأمه المبعثره أم رفع الضيم والحيف والجور عن شعوب الأمه العربيةأم انهم بتشجيعهم للفتاة أن تحب من تشاء وقت ما تشاء كفيل بوصولنا لسطح القمر أو مجاراة عتاة الدول بتصنيع السلاح النووي الرادع أم ماذا؟<br />طول عمرنا منذ عهد العرب قبل الاسلام واحنا نتناكح عال العال بلا حب ولا مشاكل ولا بطيخ- اشمعنى الآن عملتوا منها قصه طويله وعريضه ومشكله تحتاج لحل.أم أن مثقفينا المارقين أثبتوا بأنهم أكثر هديا وفهما وعلما من رسول الإسلام وصحابته؟؟؟؟؟؟"
archived = "2005-03-10"
capture_url = "https://web.archive.org/web/20050310091443/http://www.20at.com:80/article.php?sid=794"

