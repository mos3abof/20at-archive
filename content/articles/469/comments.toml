subject = "oosama"
text = "عندما كنت أجلس مع طلاب التيار الإسلامى فى الجامعة<br />كنت أقول لهم أنتم تبدأون من موضع النهاية...<br />شباب غارق فى الحب الحرام والاغانى الفيديو كليب والموضة..كيف ندعوه إلى الجهاد والمقاطعة والتظاهر...!!<br />ورغم أنهم كانوا يقبلون إنتقادى لهم بصدر رحب إلا أنهم لم يغيروا طريقتهم (ربما ومعذرة لأنهم لا يمتلكون آلية التغيير الذاتى أو السريع)<br />أما الآن فأنا أرى أن ما إتجهوا إليه شىء طيب جدا وأضم صوتى لكل من يؤيد هذا العمل(وأخيرا فهموها..)<br />أما عن المقال فهو ممتاز إلا أننى أعترض (أختى سارة)على قول أن هناك طالباسلفيا فعل كذا أو قال كذا ..لماذا؟؟<br />* لانى أشم فى هذا القول رائحة تشويه للسلفية وهذا لا ينبغى أبدا بألاضافة إلى أن هذا القول لم يخدم فكرة المقال فى شىء..أليس كذلك؟<br />*ولأن هذا يبعث على الفرقة والتفريق وأنا لا أحب تقسيم المسلمين إلى سلفية وصوفية وإخوانية و...و..<br />أرجوا أن يصل صوتى للجميع<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2005-01-01"
capture_url = "https://web.archive.org/web/20050101085734/http://www.20at.com:80/article.php?sid=794&mode=&order=0"

