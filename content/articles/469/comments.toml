subject = "هدي منير"
text = "هذا الموضوع جديد ولكنه شيق أيضا ، بسبب بسيط ، وهو أن الحب أساس كل شئ ، فلو كره بعضنا البعض لن نستطيع ان نبنى المجتمع أو حتى ننجح فى بناء أنفسنا . والله ذكر الحب فى القرآن الكريم ، وكذلك الرسول الذى دعانا لأن نكون أمة واحدة ونتآلف سويا . و أنا أرى أن التيار الاسلامى لا يتناول الأمور الدينية فقط وأنما نظرته شاملة ، ونحن نحبه لأن له أنشطة كثيرة للطلاب مثل توزيع ملازم الأمتحانات التى لا تتوافى فى المكتبات"
