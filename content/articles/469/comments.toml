[[comments]]
order = 6
subject = "كنت زمان باتضايق"
text = "يا جماعة الخير لو كل كلب عوى ؟ألقمته حجرا ...<br />بصوا يا جماعة فى ناس بتتكلم عن الاى موضوع فى الدنيا احنا معتقدين انه كويس وبيكون هدفهم واحد من اتنين يا غما<br />1- انه فعلا حاسس ان الشخص ده او الموضوع ده غلط وعايز ينبه الناس ويناقشها .. وده طبعا راجل نحترمه وهوا هيستخدم كلام محترم واسلوب علمى مؤدب<br />2- واحد بيخبط ويتمحك علشان حاجة توغر صدره وحاجة فى نفسه .. وهيستخدم اسلوب غير مهذب ويجذب الانتباه<br />الحل<br />1- بالنسبة للراجل الأول نناقشه ونحاوره ونوضح له ويوضح لنا لغاية ما فى جد مننا يقتنع<br />2- الراجل التانى هيكون الرد عليه ببيت الشعر<br />لو ان كل كلب عوى ألقمته حجرا لأصبح الصخر مثقالا بدينار<br />يعنى أفضل حل وتعامل معاه اننا منعبروش خالص ولا نجيب على كلامه باختصار كما قال القرآن \" وإذا خاطبهم الجاهلون قالوا سلاما\"<br />يا ريت من الىن لا يجيب اى احد على هذه الترهات والافتراءات ونعود لموضوع المقال<br />انا شفت المجلة هيا بصراحة نواة لمجلة كويسة بس ينقصها المثير من حيث التصميم والمواضيع وبساطة الأسلوب وملائمته لروح الشباب والعصر وباضرب مثال بكده مجلة الشباب التابعة لمؤسسة الأهرام مجلة تحقق رواج عالى عايزين مجلة صناع الحياة لما يتم نشرها تحقق رواج أعلى وأعلى ولن يكون ذلك إلا بمزيد من التحسين وجزى الله استاذ عمرو وكل القائمين على المجلة خيرا"
archived = "2005-01-01"
capture_url = "https://web.archive.org/web/20050101085734/http://www.20at.com:80/article.php?sid=794&mode=&order=0"

