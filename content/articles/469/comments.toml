text = "تيار اسلامي ده يعني ايه<br />هو احنا كلنا كفرة مثلا ولا مجوس<br />وهم شوية العيال دي عاملين فيها فونط<br />وها يفهمونا ديننا<br />ياخي روحوا ذاكروا بلا خيبة<br />والجامعة ها تفضل زي ما هي<br />قال بونبوني قال<br />شوية عيال وبيضحكوا على شوية عيال<br />والكبار عمالين يعبوا في جيوبهم وبطونهم من فلوس الزيت<br />ياكلون في بطونهم نارا ان شاء الله<br />كلمونا عن البطالة وتغيير نظام الحكم والاسعار والغلاء والعنوسة"
