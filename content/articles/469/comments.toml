subject = "موضوع جميل وجديد"
text = "السلام عليكم ورحمة الله وبركاته<br />موضوع الحب والتحدث فيه بصراحة شئ جديد ولم يطرح من قبل بصراحة وخاصة فى هذه السن فى الكليات لآن جميع الطلاب فى هذه الفترة بيبصوا لهذا الموضوع بمنطق الحرية وأنا أعمل الى أنا عايزه وأنا كبرت حاجات كتير زى دى لكن الموضوع جميل ويلزم دراسة وتوعية لمن يقوموا بالتحدث عن هذا الموضوع مع الطلبة<br />والحب شئ جميل ولكن مش اى حب الحلال فقط<br />وحب الله فوق كل شئ"
