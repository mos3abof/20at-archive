text = "الأخ اللي فوق<br />ازيك يا كابتن يا بتاع الآليات<br />فعلا الإخوان عندهم رشاشات وكدة؟<br />سبحان الله<br />برافو عليهم<br />فيه حد عنده سلاح في الزمن ده وفي مصر اللي الحكومة فيها بتتلكك لأي واحد ماسك في ايده حتى ريشة فرخة<br />والإخوان ولاد اللذينا معاهم رشاشات والأخ اللي فوق ده عارف مكانها ويا حبة عينه الحكومة طبعا عارفة بس مكثوفة من الاخ بتاع التعليقات أو ان الأخ عارف حاجات الحكومة متعرفهاش وده مالوش غير معنى واحد إن الأخ بتاع التعليقات ده مخاوي !!! من بسم الله الرحمن الرحيم اللي ما يتساموش<br />وأشتاتا أشتوت"
