subject = "لوجه الله"
text = "لماذا ينزعج الكثير من المصريين كلما ذكرت سيرة الإخوان محدش يقول إن الكلام ده غلط ومحدش يقول ان دى ناس وحشه أو حاقده لان فى فعلا ناس كده وهى ناس كويسه على كافة المستويات<br />لابد أن يراجع الاخوان أنفسهم وأن يهتموا أكثر بصدى الناس ويعرفوا ماذا يكره فيهم الناس .<br />صحيح الاخوان شعبيتهم كثيره بس نص الشعبيه دى لان الناس بتكره الحكومه وبتقف جنب أى حد ضد الحكومه حتى ولو كان وحش<br />بس خلاص<br />على فكره أنا كنت موضوعى جدا والله أعلم<br />بعد كده إيه حكاية السلف يأأخت ساره انت عارفه ومتأكده ان السلف عمرهم ما بيحبوا كده لازم يعنى تحببى الناس فى الاخوان وتكرهيهم فى السلف<br />ليه بس الانحياز والاسلوب البدائى القمئ ده"
archived = "2005-01-01"
capture_url = "https://web.archive.org/web/20050101085734/http://www.20at.com:80/article.php?sid=794&mode=&order=0"

