text = "دخلنا المدرج . . ووزعنا بنبوني في أول يوم ، وكتبنا يللا نحب بجد . .<br />المدرج كله هاص . . إيه يا جماعة خير في إيه ؟؟!<br />إنتم جايين تكلمونا عن إيه ؟!<br />والبنات جات تسأل ، إنتم فعلا هاتتكلموا عن الحب بين الولد والبنت ؟!<br />بس فعلا موضوع الحملة في الجون 100% لكن فعلا كان لازم يكون في دورات لشباب التيار وخطط واضحة لمسار الحملة أكثر من كده"
