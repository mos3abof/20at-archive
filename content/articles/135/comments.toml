[[comments]]
order = 0
subject = "جديد الموقع"
text = "لا تعليق غير وصف الله لليهود بأنهم \"تحسبهم جميعا و قلوبهم شتى...\"<br />و قوله تعالى \"يثبت الله الذين آمنوا بالقول الثابت في الحياة الدنيا و في الآخرة...\"<br />تقبل الله الشهيد و تقبل منه، و ألحقنا به إن شاء الله."
archived = "2004-07-17"
capture_url = "https://web.archive.org/web/20040717005015/http://www.20at.com:80/article.php?sid=455"

[[comments]]
order = 1
subject = "لا اله الا الله"
text = "لمازا لم نسمع عن هؤلاء المجاهدين لمازا مكتوب علينا ان نسمع عن ايساف وعن محمد عطيه وعن تسريحه عطه ارجو ان تخصصوا من مسئولي الموقع تخصيص قسم لشخصيات المجاهدين مثل عماد مايند"
archived = "2004-07-17"
capture_url = "https://web.archive.org/web/20040717005015/http://www.20at.com:80/article.php?sid=455"

[[comments]]
order = 2
subject = "مطر"
text = "وضعوني في إنـاءْ<br />ثُمّ قالوا لي : تأقلَـمْ<br />وأنا لَستُ بماءْ<br />أنا من طينِ السّمـاءْ<br />وإذا ضـاقَ إنائـي بنمـوّي<br />..يتحطّمْ !<br />خَيَّروني<br />بَيْنَ مَوتٍ وَبَقاءْ<br />بينَ أن أرقُـصَ فوقَ الحَبْلِ<br />أو أرقُصَ تحتَ الحبلِ<br />فاخترتُ البقـاءْ<br />قُلتُ : أُعـدَمْ.<br />فاخنقـوا بالحبلِ صوتَ الَببَّغـاءْ<br />وأمِـدّوني بصمـتٍ أَبَـديٍّ يتكلّمْ !"
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903082738/http://www.20at.com:80/article.php?sid=455"

[[comments]]
order = 3
subject = "مسلم غيور"
text = "السيد علي، شكر الله لك، على هذا الموضوع، فنحن في شوق إلى أن نعرف أخبار هؤلاء القمم، التي اراد الإعلام أجمعه غربيهم وعربيهم، إلى طمس مثل هذه القمم الشامخة... والتي نرجو من موقعكم الجريء أن يزيل عن هذه الشخصيات هذا الطمس المتعمد...."
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903082738/http://www.20at.com:80/article.php?sid=455"
