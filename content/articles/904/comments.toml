[[comments]]
order = 1
subject = "نهاية (البشير) قادمة لامحالة"
author = "سوداني صريح"
posted = "2006-09-08"
text = "اتمنى دخول القوات الاممية باسرع وقت حتى تحافظ على ماتبقى من اهل دارفور قبل ان ينقرضوا بسبب اعتداء القبائل العربية الهمجية (الجنجويد) وسلاح الجو السوداني المدعوم من حكومة البشير ذي الاصول العربية .... وتلقين حكومة السودان الارهابية درساً في احترام الاقليات غير العربية."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124833/http://www.20at.com/article2.php?sid=1204"

[[comments]]
order = 2
subject = "أيضا نريد قوات اليونيفيع"
author = "باحث عن الحقيقة"
posted = "2006-09-09"
text = "الموضوع مكتوب بشكل جيد، وتم توظيف المعلومات بشكل حرفي، إلى الأمام دائما.<br />أما عن قوات اليونيفيع فهي قوات لحفظ السلام بين محرري عشرينات وقراء الموقع. ياريت تبحثوا في الموضوع<br />ahmed-editor@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124833/http://www.20at.com/article2.php?sid=1204"

[[comments]]
order = 3
subject = "ما شاء الله"
author = "الاخ محمد الجزائري"
posted = "2006-09-23"
text = "الموضوع مكتوب بطريقة جيدة جدا مع حسن انتقاء الالفاظ والكلمات فالصراحة تقال موضوع ولا كل المواضيع حيث جاء في وقت مناسب<br />للوضع القائم في لبنان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124833/http://www.20at.com/article2.php?sid=1204"
