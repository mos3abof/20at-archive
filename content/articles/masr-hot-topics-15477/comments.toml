author = "شوارع لية"
posted = "2010-02-25"
text = "عضو مجلس الشعب الموقر سيد قرارة عن دائرة شبراخيت ووكيل وزارة الصحة صرف فى قرارات العلاج المجانى لوحدة حسب جريدة الوفد 250 مليون جنية - 250 مليون جنية لهطهم عضو واحد وكيل وزارة الصحة ولو فى البلد دى رئيس او حتى بصمجى بيحكم كان سأل دة لية<br />وال 250 مليون جنية نصرفهم على ملاجىء وورش تعليم واماكن ايواء لهؤلاء الاطفال<br />انما بقى هنقول اية<br />وكل يوم مؤتمر فى الهجايص لماما سوزان<br />وكل يوم مؤتمر لمشيرة وزيرة الاسرة<br />وكلة كلام على قفا ام الشعب وصور فى الجرايد واخبار فى التليفزيون وكلهم طرابيش وحتة نائب لهف 250 مليون جنية<br />واعلانات فى التليفزيون لدفع الضرايب ويا عبد القوى<br />يا اخى قحة على ام دى بلد<br />انت فين يا برادعى"
archived = "2010-02-28"
