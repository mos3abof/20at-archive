[[comments]]
order = 2
subject = "نهوووله"
text = "الو... ايوه يا حبيبي كنت عايزاك تروحلي للترزي تجيب التايير و تعدى ع الجواهرجى تجيبلى الهديه اللى وعدتنى بيها<br />الو الو انت مبتردش ليه ناوى طنش ع العموم ذنبك ع جنبك<br />وعايزاك ياحياتي تحضر نفسك عشان تجيبلي هديه رمضان و العيد الصغير والعيد الكبير وعيد ميلادى وسبوع بنت اخويه و الترقيه بتاعتك<br />الله ... مش سامعه ردك يعنى<br />نعم...بتقولى رشا مين؟ هو الحيوان خطب واحدة غيرى يومه اسود<br />الو النمرة غلط وسيباني اتكلم<br />دى قلة ذوق<br />طاااااخ"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033756/http://www.20at.com:80/article.php?sid=458"
