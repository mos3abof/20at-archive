[[comments]]
order = 7
subject = ""
author = "الجميل"
posted = "2009-08-11"
text = "السلام عليكم<br />أنا شفت العاشرة مساء وعرفت بالموقع من البرنامج . وقرأت التعليقات . وطبعا كل واحد لة رأية الشخصى . ولحد ما الفكرة ممتازة بالنسبة لشغل وقت الفراغ . ومخرج لتفريغ الضغط النفسى . وفى الأساس النقاش بين الرجل والست حول مشاكل الزواج وخاصة أنة ينقطع هذا الحوار بين الأزواج والذى يؤدى للطلاق فى النهاية .<br />بالمناسبة ممكن أعرف تفاصيل خلافاتك الزوجية قبل الطلاق . وما هو الشيئ الأساسى الذى جعلك تطلقى ياأستاذة محاسن ؟"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073737/http://www.20at.com:80/masr/hot-topics/12566-2009-07-05-12-23-24.html"

[[comments]]
order = 8
subject = ""
author = "هبه"
posted = "2009-08-11"
text = "اولا المفروض اننا ناس محترمة والاستاذ اللى قاعد يتكلم بطريقة سخيفة ده عن الموقع هو مش ست ولا عاش معاناة اى ست فى المجتمع المصرى فيخلى رايه لنفسه اما عن الاستاذة محاسن انا باحترمها جدا لانها فكرت فى عمل شىء زى ده يمكن يخفف من حدة الضغط النفسى على المطلقة والمتزوجة ايضاَ على فكرة انا باحترم جرأتها لان المرأة اليوم يجب أن تكون بهذه الجرأة لمواجهة تحديات الحياة واعتقد موضوع اعطاء الاولاد للزوج فحسب مقدرتها على تحمل المسئولية وليس عيب فيها ان تربى اطفالها بنفسها لانها ستعيش حياتها لهم فقط وحسب شخصيتها فى القدرة على التربية وهل الرجل سيعيش لاطفاله مثلها كم رجل سيتزوج بعد الطلاق ؟ وكم امرأة لم تتزوج بعد وفاة زوجها أو طلاقها وجلست لتربى اطفالها؟ ياريت لو تقدرى يا استاذة محاسن تعملى لنا احصائية خاصة بالسؤالين السابقين وارجو الاستفادة من تجربتك لتلافى الاخطاء<br />وربنا يوفقك فى مساعدة الرجال قبل النساء لانهم مصابين بمرض يدعى الخرص الزوجى يا اما الشكوى وبس من كل حاجة فى الدنيا ومصابين بالصداع من صراخ الاولاد ."
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073737/http://www.20at.com:80/masr/hot-topics/12566-2009-07-05-12-23-24.html"

[[comments]]
order = 9
subject = ""
author = "االجميل"
posted = "2009-08-11"
text = "نرجوا من جميع القراء للتعليقات أن يكون الرد فقط على أساس الموضوعات المطروحة والتعبير عن الرأى بصورة إيجابية تحترم الرأى والرأى الأخر .<br />وأرجوا من السادة والسيدات الرد على هذا السؤال :<br />ماهى الأسباب التى تثتثير الزوج من زوجتة داخل منزل الزوجية ؟ السؤال للأزواج<br />وماى هى الأسباب التى تثتثير الزوجة من زوجها داخل نفس المنزل (الزوجية) ؟ السؤال للزوجات"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073737/http://www.20at.com:80/masr/hot-topics/12566-2009-07-05-12-23-24.html"

[[comments]]
order = 10
subject = ""
author = "هشام سليمان ..محام"
posted = "2009-08-12"
text = "بسم الله الرحمن الرحيم الحقيقة ان مسالة وجود راديو خاص للمطلقات ,,. جد شئ يقدر ويحترم من الجميع فانا لست مع الفكرة بالشكل المطلق ولا ضدها نهائيا ,, لكن الامر هو محض الحياد الفكرى,,ولو نظرنا للأمر بشقه الموضوعى لوجدنا انه ينفع اكثر الناس رجالا ونسائا,, لان الذى يمر بمثل هذه التجربة الاليمة يشعر ويكأن المسألة تقع عليه بشكل شخصى وعلى فرض الخصوص مما يجعله متعطشا لمن يعاونه على تحمل المر والمشقة,,مما يجعله عرضه لان يكون ضحيه لمن لا ضمير له,,وخصوصا السيدات,,حتى اكون منصفا عادلا فى طرحى وبشكل خاص فى مصر ,,فالمجتمع بكل المقايس قد تغير ولايرحم احد مع الزحام تصعد المشاكل لترقى الى قمه الصعوبة,, بتجربة السيدة/ محاسن صابر. ارادت ان تخفف الحمل عن كاهل المرأة عن طريق المشاركة الموضوعية والفعالة والتى بدورها ايضا تتوقى مشاكل مستقبلية من نفس النوع لمن يدور بباله فكرة الزواج ,,لينظر لشقه المزعج ليتحاشى ذلك بالاختيار الجيد من خلال هذا الطرح الجيد ..أتش."
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073737/http://www.20at.com:80/masr/hot-topics/12566-2009-07-05-12-23-24.html"

