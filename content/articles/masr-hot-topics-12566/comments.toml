[[comments]]
order = 30
subject = ""
author = "واحدة من الناس"
posted = "2009-11-28"
text = "[(quote name=\"انفلت عيار محاسن\"]محاسن انفلت عيارها لانها ملهاش رجل يشكمها<br />هتعمل اذاعة وهتقلد سيد ابو حفيظة وهتعلن هنا اذاعة محاسن شخلع من درب شكمبة<br />تعلن اذاعة محاسن القومية انها تبث للمطلقات من المحيط الى الخليج ثم يعقب ذلك بث نشيد امجاد يا عرب امجاد ثم صوت ولية بتفقع بالصوت وتقول طلقتنى لية هو انا نكدية والا اية<br />ثم يبدا الارسال بمقطع لطم وصويت تؤدية الولية القرشانة المعددة بتاع المياتم وصراخ حاد يا جملى يا سبعى يا مشمت فيا جيرانى<br />على فكرة يا ست محاسن افكارك دى بتقول انك تستحقين الطلاق عن جدارة لانك ولا مؤاخذة مخك ضارب وان الرجل فلت بجلدة منك<br />اذاعة قال<br />ربنا يكملك بعقلك ويهدى سرك ويجعل خاتمتك فى مستشفى المجاذيب)<br />انت بجد محتاج شوية دم يجروا فعروقك ."
archived = "2009-12-21"
capture_url = "https://web.archive.org/web/20091221093427/http://www.20at.com:80/masr/hot-topics/12566-2009-07-05-12-23-24.html"

[[comments]]
order = 31
subject = ""
author = "واحدة من الناس"
posted = "2009-11-28"
text = "برافو عليكى محاسن<br />انت بالفعل ست قوية وعلى راى المثل اللى بيقول ان الضربة المبتموتش بتقوى.<br />واتمنى الناس<br />متوقفش المراكب السايرة وبدل متهاجموا محاسن لازم تشجعوها.<br />الست ممكن تستحمل جرح الراجل وهى معاه خوفا من انها متقدرش تستحمل جرح فراقه لكن وللاسف الراجل مش بيراعى ده .<br />اتمنى لو حد يعرف ازاى نتواصل معاهم يعرفنا واميلى goodbye_sadness 2000"
archived = "2009-12-21"
capture_url = "https://web.archive.org/web/20091221093427/http://www.20at.com:80/masr/hot-topics/12566-2009-07-05-12-23-24.html"

