posted = "2009-10-27"
text = "بسم الله الرحمن الرحيم<br />أحييكي يا استاذة محاسن علي كل هذه الاعمال الرائعة سواء المدونة او الراديو<br />لأنكي تستحقين وسام الدولة أو جائزة نوبل في الإجتماع<br />لأنكي حولتي مأساتك الي عمل مثمر<br />وجعلتي من اعمالك منبراً يهتدي به المطلقات<br />وجعلتي من الراديو اشعاع نور يضئ لهن في ليل مظلم ومستقبل غير معلوم<br />واقول لكي بقلب الاخ سيري فأنتي علي الدرب والي الأمام<br />اخوكي ابو موسي"
