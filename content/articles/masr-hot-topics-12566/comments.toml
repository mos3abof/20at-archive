[[comments]]
order = 15
subject = ""
author = "عماد عدلان"
posted = "2009-11-08"
text = "فكرة جديدة وجريئة بس هل يا ترى الإذاعة هذة تفترض أن الرجل هو سبب الطلاق أم ان سبب الطلاق نصفة للمرأة ونصفة للرجل أرجو ألا تعتبر إذاعتكم الموقرة أن الرجل دائما ظالم لأن ما قابلتة هو أن المرأة مستبدة وتريد أن تكون هى الرجل وكذلك تترك أى شخص للتدخل فى الحياة الزوجية ودائما اذا قام أى شخص بتقديم نصيحة تقوم بتنفيذها بدون التفكير هل تصلح لعائلاتنا ام لا عموما نصيحتى للناس ألا تتركوا أحد يتدخل بين الرجل و إمرأتة وهم سوف يضبطوا الحياة بينهم لأن دخول الناس معناة بداية الطلاق.<br />أتمنى لكم التوفيق و أن تكونوا عادلين فى عرض القضايا ولا يتم إعتبار المرأة هى الضحية فممكن أن تكون هى الجانى مع سبق الإصرار والترصد وفقكم الله للصالح"
