text = "يا ست محاسن لا تدعى الى الطلاق<br />بالاذاعة بتعتك دى<br />مش كل واحد تطلق تعمل مشكلة وتقول العيال<br />العيال لولديها عندنا فى الصعيد<br />لما الام تطلق العيال يواديهم لابوهم<br />يتولى المسئولية ويعلمهم ويطلعهم رجاله تربية الست (المرأه) ضعيفة<br />فانتى ربنا يهديكى ويرشدك لصوابك"
