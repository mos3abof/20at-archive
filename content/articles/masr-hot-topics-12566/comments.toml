subject = ""
author = "انفلت عيار محاسن"
posted = "2009-07-05"
text = "محاسن انفلت عيارها لانها ملهاش رجل يشكمها<br />هتعمل اذاعة وهتقلد سيد ابو حفيظة وهتعلن هنا اذاعة محاسن شخلع من درب شكمبة<br />تعلن اذاعة محاسن القومية انها تبث للمطلقات من المحيط الى الخليج ثم يعقب ذلك بث نشيد امجاد يا عرب امجاد ثم صوت ولية بتفقع بالصوت وتقول طلقتنى لية هو انا نكدية والا اية<br />ثم يبدا الارسال بمقطع لطم وصويت تؤدية الولية القرشانة المعددة بتاع المياتم وصراخ حاد يا جملى يا سبعى يا مشمت فيا جيرانى<br />على فكرة يا ست محاسن افكارك دى بتقول انك تستحقين الطلاق عن جدارة لانك ولا مؤاخذة مخك ضارب وان الرجل فلت بجلدة منك<br />اذاعة قال<br />ربنا يكملك بعقلك ويهدى سرك ويجعل خاتمتك فى مستشفى المجاذيب"
archived = "2009-07-07"
capture_url = "https://web.archive.org/web/20090707012432/http://www.20at.com:80/masr/t7kyk/12566-2009-07-05-12-23-24.html"

