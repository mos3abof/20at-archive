author = "saso"
posted = "2009-11-08"
text = "صباح الخير للجميع<br />لن اقول اننى اليوم فى افضل حالتى المزاجيه لكن استفزنى للرد الافراد اللى بيقولوا ان تربيه السيدة للاطفال تخلق جيل مايع كسول لا يحمل مسئوليه (0 يعنى من لاخر ابن امه )<br />طيب يا رجاله يا فهمين انتوا تعرفوا فى كام واحدة ست فى مصر فاتحه البيت من ماكل ومشرب وتربيه وهى المفروض مسئوله من راجل على زمته يسد عين الشمس لكن البيه يهرب من المسئوليه وهى شايلاها بكل صبر وتحمل ولم تطلب الطلاق ايه الفرق؟<br />وبعدين المطلقه اللى طلع عينها فى ظروف الطلاق والعيشه ازاى حتربى غلط دة من باب اولى لازم تورى العالم تربيتها من تربيه سبع البرمبه ابو شنب بريمه شكرا<br />على العموم اللى شايف ان كلامى فى حاجه غلط يرد عليا ويناقشنى بس بالادب مش بالكلام الساذج اللى سلختوا بيه الست محاسن خليكوا موضوعيين شويه وكفايكم عنجهيه رجاله فاضيه"
