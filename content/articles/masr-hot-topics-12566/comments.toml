author = "أمــيــــــــــــر"
posted = "2009-11-26"
text = "صباح الخير للجميع<br />مع احترامي الشديد لكل مطلقه وكل مدام بالوطن العربي ـ لا بد من الاهتمام بقضية الطلاق ومعرفة سبب الطلاق ـ لانه كل مطلقه لها سبب خاص بخصوص تطليقها ـ فهذا يجب على كل امرأه ان تحاول قدر المستطاع ان تتجنب الطلاق والانفصال وتحاول اكثر من مره لكي تصلح بين زوجها ـ هناك اسباب تافهه لا تستدعي الطلاق والانفصال ويمكن حلها ويتجنب الطلاق وهذا يعود الى وعي وفهم المرأه والرجل .<br />لكن في بعض الاحيان المرأه ترتكب خطأ كبير مثل الخيانه للزوج وهذا يستحق الطلاق بدون ندم .<br />وايضا هناك رجال لا يستحقون امرأه لاسباب عديده .<br />بتمنى السعاده والهناء لكل امرأه عربيه وان تكون بيوتهم دوما عامره بالافراح والمسرات ."
archived = "2009-12-21"
capture_url = "https://web.archive.org/web/20091221093427/http://www.20at.com:80/masr/hot-topics/12566-2009-07-05-12-23-24.html"

