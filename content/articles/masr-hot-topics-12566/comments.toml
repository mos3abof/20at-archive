text = "الفكرة حلوة ورائعة<br />خصوصا ان كل ست مطلقة او على وشك الطلاق<br />تعرض التجربة الخاصة بها<br />ليتعلم اجميع<br />والمعلومة المؤكدة ان مصر شهدت عام 2009 مليون حالة طلاق وخلع من خلال المحاكم<br />هذا بخلاف حالا التطليق امام المأذون<br />فالمجتمع يواجة اكبر عملية انهيار سيؤثر على كيانة<br />فبرجاء التروى ومناقشة الاسباب بكل صراحة<br />والاعتماد على نقد الذات لمعرفة سبب الطلاق"
