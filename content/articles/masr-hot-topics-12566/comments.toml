author = "محمد مكه"
posted = "2009-11-30"
text = "اختى الكريمة / محاسن صابر اولا تحياتى واحترامى الى شخصك الكريم وقوة ارادتك سيرى الى الامام والله معك ولا تيأسى ولا تنسى ان اعداء النجاح اكثر امامك فلا تقنطى وضعى امامك هدفك ورسالتك فثقتى بالله تكون قوية وما اجمل النجاح بعد الفشل وثقى بان رسالتك معرضة لها الالاف بل مئات الالاف من الاخوات المغلوب عليهن بسبب ما من قسوة الحياة فانتى رسالتك هادفة ولها معانيها ولها اهدافها لكى تكون المرأة فى مكانها الصحيح فى غابة يعيش فيها بعضا من الوحوش المغترسة الجاهلة لمعنى ومفهوم واخترام المرأة فالمرأة هى امى واختى وزوجتى وبنتى فلولا المرأة ومكانتها العليا ما استقامت الحياة الله نعك الله ناصرك الله حافظك من اعداء النجاح اخوك محمد مكة المكرمة"
archived = "2009-12-21"
capture_url = "https://web.archive.org/web/20091221093427/http://www.20at.com:80/masr/hot-topics/12566-2009-07-05-12-23-24.html"

