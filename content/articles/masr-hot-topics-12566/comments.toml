text = "لانة زيك طلاق حديث حسة اد اية الواحدة محتاجة حد يتعامل معاها باحترام و صدق لحد لما تستعيد توازنها النفسي و ازاي تربي ولادها صح بعد تجربة الانفصال المهم بقي الرجال ايها تحترم نفسها شوية و تبطل التعليقات السخيفة لان لولا قسوتهم و عدم تقديرهم لعواقب الامور مكنش في طلاق و الامشاكل ابناء المطلقين<br />ا"
