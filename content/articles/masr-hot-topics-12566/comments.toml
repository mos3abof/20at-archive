[[comments]]
order = 2
subject = ""
author = "تربية المرأة للاولاد"
posted = "2009-07-05"
text = "فى الفلاحين يحدث ان يموت الزوج فتتولى الزوجة المسئولية كاملة عن الاسرة والزرع والقلع وتربية الحيوانات<br />وتربية الحيوانات تشمل تربية العجول<br />وللعجول زمان قبل انتشار الالات والمكائن زى دلوقتى للعجول زمان وضع خاص<br />فالعجل يجر الساقية ويجر المحراث ويعمل بقسوة تحت الحر والبرد فى رى الارض وحرثها<br />وهناك مثل قديم فرعونى متداول فى ارياف الدلتا<br />ان المرأة التى تربى ثورا او عجلا عمرة ما يشيل ناف على كتفة<br />بمعنى ان الذى تربية المراة بحنية وطيبة وخوف يطلع مايع وكسول ولا يتحمل المسؤولية ولا يستطيع ان يشيل الناف والناف هو قطعة الخشب التى توضع فوق كتف الثور لجر المحراث او الساقية<br />المراة التى تربى ثورا او عجلا لا يستطيع ان يشيل ناف على كتفة لانة ثور متدلع<br />ادعوا كل ام تطلقت ان تسلم اطفالها الى ابوهم ليربيهم حتى يطلعوا رجالا يشيلوا المسئولية<br />وسيبونا من الكلام الفارغ دة بتاع حقوق المراة وتربية الاطفال<br />فالطفل بعد 7 سنوات لا تستطيع امة ان تسيطر علية ويعارضها ويتحداها احيانا اذا كان شرسا<br />سلموا الاطفال الى ابائهم<br />وتذكروا حكمة الفرعون القديمة<br />التور اللى تربية امراة لا يشيل ناف"
archived = "2009-07-07"
capture_url = "https://web.archive.org/web/20090707012432/http://www.20at.com:80/masr/t7kyk/12566-2009-07-05-12-23-24.html"

