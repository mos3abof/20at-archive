text = "صباح الخير سمعت عن هذا الموقع منذ فترة واليوم قررت ان اعرفه عن قرب اسباب كثيرة هى السبب لكن اظن السبب الرئيسى اننى احمل نفس البصمه او العار اننى مطلقه ( يمكن الناس المتشابههه فى الظروف يكون التفاهم معهم اسهل وكمان بيكونى حاسين اكثر ببعض مش كلامهم عبارة عن طوب وظلط ) اعذرونى على هذه الكأبه على الصبح لكن اوعدكم فى المرة القادمه سوف اكون افضل كثيرا واتمنى لكم التوفيق والنجاح"
