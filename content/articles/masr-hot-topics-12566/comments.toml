text = "على فكره يا مدام محاسن انا معرفكيش طبعا .. بس انتى انسانه واضح انك قويه ومثقفه جدا وانا بحيكى على المجهود ده والتفكير الواعى جدا وطبعا انتى وانا ومعظم الستات عرفين تفكير الرجاله وخصوصا لما تكون ست زيك وعيه ومش بتحاول انها تكون زى ما هما عوزين مكسوره وضعيفه<br />فمتزعليش من الكلام المكتوب ده .انتى اكيد اقوى من كده ..شكرا على المجهود ده وكل امنياتى ليكى بحياه سعيده ..<br />ناريمان"
