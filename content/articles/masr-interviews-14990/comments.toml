text = "طاعة ولاة الأمر وعدم الخروج عليهم<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــــ<br />ولا نرى الخروج على أئمتنا وولاة أمرنا، وإن جاروا. ولا ندعو عليهم، ولا ننزع يدا من طاعتهم، ونرى طاعتهم من طاعة الله -عز وجل- فريضة ما لم يأمروا بمعصية، وندعوا لهم بالصلاح والمعافاة.<br />هذا معتقد أهل السنة والجماعة، أنهم لا يرون الخروج على ولاة الأمور بالمعاصي، ولو جاروا ولو ظلموا؛ لأننا لا نرى الخروج عليهم، ولا ننزع يدا من طاعتهم، ولا نؤلب الناس على الخروج عليهم، وندعوا لهم، ولا ندعوا عليهم ندعوا لهم بالصلاح والمعافاة هذا معتقد أهل السنة والجماعة؛"
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124073619/http://www.20at.com:80/masr/interviews/14990-2010-01-20-18-57-32.html"

