subject = "لور دكاش"
text = "الطبلاوي طبعا.. بحب جداً أسمع منه سورة الحشر وخصوصاً في أية \"لو أنزلنا هذا القرآن على جبل لرأيته خاشعا متصدعا من خشية الله\" صدق الله العظيم"
archived = "2004-10-28"
