[[comments]]
order = 0
subject = "الشيوخ"
text = "بالنسبة لستجيلات الإذاعة أحب الشيخ المنشاوي (سورة الواقعة) ومحمود علي البنا(سورة البقرة)<br />أما بالنسبة للتسجيلات الخارجية فلا يعلى على الشيخ عبد الباسط خصوصاً (سور: يوسف - القمر+الرحمن - التكوير)<br />أما بالنسبة للتعلم فلا يوجد على وجه البسيطة من يصل لقامة شيخنا الجليل الحصري"
archived = "2004-10-28"
capture_url = "https://web.archive.org/web/20041028171929/http://www.20at.com:80/article.php?sid=699"

