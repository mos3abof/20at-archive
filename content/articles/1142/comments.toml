[[comments]]
order = 2
subject = "بركاتك يا سيدي باولو"
author = "مصــegyــري"
posted = "2006-03-23"
text = "ايييييه .. دنيا<br />الراجل دة يا جدعان بجد .. دنيا<br />رواية ساحر الصحراء دي بالذات ليها في قلبي مكان<br />يعني اول اما مسكتها .. و قرأت اول 10 صفحات كده<br />قلت ايه الكلام الفاضي و ( الهجص) دة .. و سبتها مركونة ييجي اسبوعين<br />و بعدين لقيتها تاني بالصدفة .. و كنت لسه طالع من صلاة العشاء ..فتحت القصة كدة و ببص فيها ... لقيت الفجر بيأذن ... لقد اسرني هذا الرجل<br />بس الصراحة معجبنيش هوا نفسه لما استضافوه في ساقية الصاوي العام الماضي<br />الصراحة حسيت ان الناس بيعاملوه على انه نبي مرسل !!<br />او كأنها اول مرة نرى واحد بهذة الموهبة<br />مع اننا معتادين على هذة المواهب القصصية الفذة القادمة من امريكا اللاتينية.. عندكم جبرائيل مركيز مثلا<br />اضحكم ... وانا في المؤتمر اللي عمله في الساقية<br />وهو خارج .. كنت انا واقف فوق سلم كدة بالعافية على رجل واحدة على الشمال<br />و صادف انه خرج من جنبي على طول بعد المؤتمر .. فطبعا مع الزحمة .. و الناس اللي هجموا عليه .. فكنت هقع عليه .. قال ايه افتكرني عايز احضنه ..<br />قام بص لي بحكمة و قال ( باركك الرب ) بالانجليزي طبعا .. ببص لقيت الناس اللي سمعوه بيبصولي بإنبهار و فراحانين لي قوي .. كأنه خلاص .. الامام الشافعي صحي ودعالي ..<br />و من ساعتها و انا كل اما اروح الساقية .. لازم ادخل برجلي اليمين و اقول \" بركاتك ياسيدي باولو \""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133114/http://www.20at.com/article2.php?sid=598"

