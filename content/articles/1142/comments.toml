text = "ضحكتنى بجد يا مصري ...<br />انا بصراحة حبيت باولو بعد ساحر الصحراء بجنون و بعدين لما قرات له اكتر بدات احس بطريقة الموعظة اللى ه بينتهجها لكن ده ما يمنعش انه موهوب بجد و انه ليه أراء كتير مهمة سواء ى الأدب أو ى الحياة ...<br />كان له نصيحة لحد دلوقتى بافتكرها دايماص و انا باكتب:<br />\" اتعمد التقشف فى اللغة لأن وراء كل تعقيد فراغاً مرعباً يتوّهمه الأغبياء عملاً عبقريا!\""
archived = "2006-11-02"
