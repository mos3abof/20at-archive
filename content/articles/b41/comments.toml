subject = "اين اهل كل فتاة تخرج من بيتها لوحدها بعد 9 مساء"
author = "فيروز"
posted = "2006-01-05"
text = "البنت التى تخرج مساء لوحدها اكيد ليس لديها اهل والبنت التى تذهب للسينما بمفردها او مع شاب فهى اكيد غير محترمة"
