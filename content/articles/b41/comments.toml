[[comments]]
order = 5
subject = "لو جاء ملك الموت وقبض روحي وأنا في السينما ... هقول إيه لربنا"
author = "عبدالله"
posted = "2006-01-12"
text = "إيه تقول لربنا لو جاء دورك في طابو الموت وقبض الله روحك وأنت داخل السينما تشوف الراجل بيحضن البنت ولا تنكر المنكر ... بل أن تشجعهم وتدفع ليهم ثمن التذكرة.<br />وبعدين بقالنا سنين نشوف أفلام خدنا منها إيه لدرجة أن أصحاب الأفلام ديه ماتوا وهم قبورهم وإحنا لا نتعظ.<br />يعني المثلين يأخذوا ذنوبا وأموالا وشهر ونحن المشاهدين نأخذ ذنوب وبس.<br />خلونا من السيما لأنها قلة قيما ... خلونا نشوف ربنا وندعو إلي الله تعالي لأن الأفلام ما هي إلا ملهيات ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131501/http://www.20at.com/article2.php?sid=41"

[[comments]]
order = 6
subject = "بالذمه ده كلاااااااام"
author = "المصرى2010"
posted = "2006-02-25"
text = "طبعا ان متفق مع بعض آراء الاخوه والاخوات ان خروج البنت لمشاهده السينما فى هذا الوقت المتأخر طبعا دى حاجه لو سمحتولى قله ادب الا اذا كانت مع والديها لانى لو قلت مع اخوها ولا ابن خالتها ولا ابن عمها هيسمعوا تعليقات وحشه جدااااااا ده لو كان عندهم دم وارحموناااااااا بقى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131501/http://www.20at.com/article2.php?sid=41"

