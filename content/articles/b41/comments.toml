[[comments]]
order = 1
subject = "يامسا الهيافة"
author = "هريدي الجن"
posted = "2005-12-10"
text = "سلامو عليكو<br />سينما إيه دلوقت ياعم الحج.. صبح صبح ياعم الحج..<br />دلوقت موسم إمتحانات, ده غير إن الأفلام إللي بتتعرض عندنا دي أفلام تعبانة.. أنا بنزل الأفلام الجديدة من عالنت واتفرج عليها وخلاص!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131501/http://www.20at.com/article2.php?sid=41"

[[comments]]
order = 2
subject = "مينفعش..!!!"
author = "أبو عبد الله"
posted = "2005-12-13"
text = "بدون تعصب وبقليل من المنطق....<br />يا جماعة لازم تعرفوا ان ربنا هيحاسبنا على الوقت وعلى المال فمش من المنطق ابد اننا نضيع فلوسنا ووقتنا على السينما. فى حاجات تانية نافعة لينا وللناس بس نفكر شوية وربنا هيكرمنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131501/http://www.20at.com/article2.php?sid=41"

