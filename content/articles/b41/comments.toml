subject = "بنات هايفة"
author = "قلب الاسد"
posted = "2005-12-09"
text = "لقد قرات بعض الرسائل بغلية وجدت بنات تتحدث عن الميعاد المتاخر لدخولها السينما وقت متاخر والبعض يقول من البنات طبعااننى ادخل السينما لاسمع تغليقات الشباب ( اين اهلها) سفالة صحيح<br />وقلة ادب"
