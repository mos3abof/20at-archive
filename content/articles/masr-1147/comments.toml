[[comments]]
order = 1
subject = "شعب بيستهبل وعاوز الطخ"
author = "ياسر ابو عمار"
posted = "2006-11-12"
text = "كويس يا محمد موضوع جيد وفكرة كويسة ،ارجو ان يكون بداية اننا نشوف لك شغل على طول فى الموقع،واتمنى ان ينتهى \"استهبال \"المسئولين المصرين على ايذاء البشر اللى ربنا كتب عليهم انهم يعيشوا معاهم فى بلد واحدة ،يا جماعة يا مسئولين استحملونا شوية ،هنعمل ايه ؟والله مكانش قصدنا اننا نعيش فى الوقت اللى انتم عايشين فيه علشان نعكنن عليكم ،بس ده قدرنا وقدركم ،استحملونا شوية وربنا يقويكم علينا ،وليكم الجنة ان شاء الله بس الله يباركلكم كفاية تفنين فى طريقة ايذائنا وقهرنا كل يوم على غيار الريق وبالليل وفى الضحى ،وبعدين ربنا بيخلصكم مننا كل شوية ،ممكن عن طريق العبارات اللى بتغرق ،او القطارات اللى بتخبط فى بعضها ،او التسمم بسبب المياه الملوثة ،او الفيروس سى ،او السرطان ،المهم انكم يعنى بترتاحو من شوية مننا كل يوم ،وربنا ما يقطع لكم عادة."
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

