[[comments]]
order = 16
subject = "أخيرا"
author = "عمر منطاش"
posted = "2006-11-14"
text = "الحمد لله على هذا الفضل بأن تأتي سنة من سنن الرسول صلى الله عليه وسلم وموافق عليها من قبل الدولة فإن هذه بشرى حسنة جدا فبارك الله فيمن أقر هذه السنة ومن ساعده على ذلك ومن لم يعترض على إقرارها يارب ومن أتاح لهم الفرص في العمل والالتحاق بالجامعات بدون مشاكل فلله الحمد ولكم جزيل الشكر وبارك الله فيكم بتطبيق سنن غيرها من سنن المصطفى"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

[[comments]]
order = 17
subject = "وقل ظهر الحق ..."
author = "نور الأمة"
posted = "2006-11-14"
text = "اللهم لك الحمد كما ينبغى لجلال وجهك وعظيم سلطانك ..<br />طبعاكان لازم يحكموا بكدا لأن هو ده الصح والاساس ..<br />فالنقاب حريه شخصية لكل فتاه ومش من حق اى مخلوق انه يقيد تلك الحريه ...<br />وبجد جزاك الله خيرا أخى فى الله على اخبارنا بهذا الخبر الذى أظنه أسعد الكثير ...<br />أثابك الله عليه .. وسلمت يداك ..."
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

[[comments]]
order = 18
subject = "انا فاهمك يا عم مصطفى برضه"
author = "ياسر ابو عمار"
posted = "2006-11-14"
text = "ايوة يا عم مصطفى احمد انا برضه فاهم انت قصدك ايه من تعبى ما رحش هدر ،بس على فكرة مش ضرورى ان نشر موضوع عن حاجة كويسة يكون شيئا يستحق الشكر ،بس خلاص"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

[[comments]]
order = 19
subject = "يا منطاش يا عسل سجل الخصومات وصل"
author = "واحد والسلام"
posted = "2006-11-14"
text = "الله ينور يا عم ابو منطاش ،بس الاول ابقى شوف شغلك كويس ونزل الموضوعات المطلوبة منك وبعدين ابقى ادخل علق على الموضوعات ،على فكرة المرة الجاية انا مش هاتكلم بالكيبورد ،انا مضطر اتكلم بالخصومات والذى منه ،وانتوا يا جماعة يا بتوع الموقع ،الله يكرمكم لو الراجل ده دخل يعلق تانى قولوله روح يا جدع خلص شغلك وبعدين ابقى تعالى وانت مروح من الشغل ،انتو ما يرضيكوش ان الشغل يتعطل .ولا ايه؟؟؟"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

[[comments]]
order = 20
subject = "تحية لقضاء مصر الشامخ"
author = "سيف الإسلام - كل الطلبة"
posted = "2006-11-14"
text = "بداية تحية شكر للقضاء المصري الذي ظل وسيزال قلعة للحرية والعدل برغم كل المحاولات الكثيرة والمتتالية التي تهدف<br />لاخضاعه للحكومة . ومبروك يامحمد وبداية موفقة ان شاء الله ، وياأستاذ ياسر أبو عمار نشر حاجة كويسة في زماننا هذا شئ أكثر من رائع ويستحق الشكر لأن الأشياء الغير جميلة والغير هادفة كثيرة جدا جدا"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

[[comments]]
order = 21
subject = "حوار مع زوجتي المنقبه"
author = "لينا ابن في جامعة حلوان لهذا فزوجتي تتبع اخبار جامعة حلوان وبشأن قضية النقاب في الجامعة كانت مهتمة بها جدا وتدافع عنهن لانها منقبة مثلهن."
posted = "2006-11-15"
text = "فقلت لها ان هناك 12 حديث في البخاري يقرر حق البنتاو المرأة كشف الوجه والكفين.<br />واختصارا للموضوع<br />وجدت زوجتي شرعية النقاب في الزام المرأة في الحج بكشف الوجه والكفين الامر الذي يدلل بان المرأة خارج الحج كانت متنقبه.<br />فقلت لها وقياسا على ذلك اذا كانت المرأة متنقبه لابد ان تكون جاهزة (تماما كالحج) في كشف الوجه عندما يطلب منها ذلك يعني هي متنقبة وعندما يطلب منها في جهة عملها كشف الوجه والكفين فلا تمانع وبعد انتهاء العمل تعود للنقاب وعندما تذهب الى الجامعة ويطلب منها كشف الوجه فلا تمانع وعندما تخرج من الجامعة تعود لتغطية الوجه وهكذا في كل مراحل حياتها هي في الاصل منقبة هذا شيء جميل ولكن عندما يطلب منها نظام العمل او نظام الدولة كشف الوجه فارجو الا تمانع طالما هناك تصريح من الرسول بكشف الوجه والكفين وهذا التصريح مسجل في اهم كتب الحديث وهو صحيح البخاري."
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

[[comments]]
order = 22
subject = "رسالة للاخ اللى كاتب حوار مع زوجتى المنقبة"
author = "محمد عبد الدايم"
posted = "2006-11-15"
text = "اتقى الله<br />لان زوجتك احسن منك دينا لان لا يمكن المسواء بين شعائر الحج والصلاة وبين العمل اللى هوا فى الاصل حرام على المراة التى يملك زوجها او ولدها قوت يومة وقوت يومة ان تعمل..... لان عمل المراة مش فرض انما الحج والصلاة فرض يا ابو العوريف ..... واعزرنى لان وحهة نظرك بعيدة جدا عن الدين وانك مش فاهم الاحديث مظبوط والسلام عليكم ورحمة الله"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

[[comments]]
order = 23
subject = "المهم التطبيق الفعلي"
author = "احمد حمدي"
posted = "2006-11-15"
text = "المهم التطبيق الفعلي لحكم المحكمة الموقرة<br />المعروف أن أحكام القضاء لاتنفذ في بلدنا منذ أقدم العصور وكله دخان في الهواء<br />وكل سنة وحضرتك طيب والمحكمة طيبة"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

[[comments]]
order = 24
subject = "لا بجد جامد"
author = "جريشه"
posted = "2006-11-16"
text = "بختصار شديد جدا الموضوع ده بتاع النقاب واللحيه كل يوم بنشوف ونسمعه<br />مش ان القضيه كسبانه لا انهم بيمنعوا النقاب بس علشان الموضوع وصلل للمحكمه واحنا بلد الحريات فقضيتهم خسرانه خرسانه<br />وكويس ان ممد عمل التقرير ده علشان اى حد عنده مشاكل بسبب حاجه زى ديه يحول الموضوع للمحكمه وانشاء الله الحق هيرجع لصاحبه.<br />بس هختم بالايه القرانيه :<br />\"ويمكرون ويمكر الله والله خيروا الماكرين\""
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

[[comments]]
order = 25
subject = "الى الاخ عبدالدايم"
author = "يا اخ عبدالدايم لو سمحت اقرأ انا كاتب ايه كويس قبل ما تهاجم."
posted = "2006-11-16"
text = "انا قلت انه طالما ان المرأة منقبة اصلاً وكشف الوجه عارضًا.<br />وطالما هناك 12 حديث في صحيح البخاري يصرح للمرأة بكشف الوجه.<br />اذن المرأة المنقبة لما يطلب منها كشف الوجه للضرورة يجب ان تنفذ ذلك.<br />والمرأة يجوز لها ان تعمل في خدمة بني جنسها مثل طبيبة او معلمة وخلافه."
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

[[comments]]
