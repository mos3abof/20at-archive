[[comments]]
order = 6
subject = "وماذا بعد؟"
author = "wlkhoully"
posted = "2006-11-12"
text = "من المهم جدا صدور مثل هذا القرار من مجلس الدولة ، لكن من المهم ان يدخل حيز التنفيذ، فهل سيرتدع الدكتور عبد الحي ، ويسمح لهن بالدخول في جنة الخلد\" المدينة الجامعية\" أو كما سماها هو مدينتي الجامعية؟ هل سيتنازل سيادته عن أنها مدينته وأنه صاحب القرار فيمن يقيم فيها، ومن سيطرد منها؟"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

[[comments]]
order = 7
subject = "ربنا يستر على هذا القاضى"
author = "ايمن امام"
posted = "2006-11-12"
text = "بنا يستر على هذا القاضى ( المفوض ) الذى كتب هذا التقرير - شكلهم كده ها يودوه جوانتانامو-وها يطلعوه اخوان او قعداوى - ومن بكره الجماعه الماركسيين ها يتكلمو عن - الرجعيه وعصور الظلام - وتطلع الوليه اياها تقولك اصل دا فكر زكورى - مش عارف مالها ومال الذكور/ ايمن امام"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

