posted = "2006-11-12"
text = "اولا بشكر الكاتب على موضوعه وهو رائع فعلا وان شاء الله نشوف له موضوعات اكتر ومهمه زى دى<br />اما بخصوص الموضوع فانا مبسوطه لان احنا بلد اسلاميه وعربيه ليه ياخدوا الموقف ده من المنقابات!!!....عموما الف مبروك"
