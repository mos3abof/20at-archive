[[comments]]
order = 12
subject = "الحق دائما منتصر"
author = "عمرو عبده"
posted = "2006-11-13"
text = "مهما تجمع الناس على الحق وظنوا أنهم يريدون أو يستطيعون الخلاص منه فإنه وهم يقف حده عند هذه الحقائق ويتقلص عندما يظهر الله الحق جليا وييسر له من ينصره ولا بد أن نعلم أنه لايعلم جنود ربك إلا هو، وهذا الامر يجعلنا دائما واثقين بنصر الله حتى لو تأخر قليلا"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

[[comments]]
order = 13
subject = "والله متم نوره"
author = "المجاهدة"
posted = "2006-11-13"
text = "جزاك الله خيراً على طرحك هذا الوضوع و على مشاركتك لنا بهذا الخبر.<br />مش اول محاولة ليهم انهم يوقفوا اي شئ ينتمى للاسلام... صحيح لحد دلوقتي معرفش ايه السبب في كده؟ و هما هيخسروا ايه لو كان عدد المحجبات ،او المنتقبات، او الملتزماات بالزي الشرعي، زاد. خوف و جهل لا اجد له اي مبرر<br />و لكن كما تقول الاية الكريمة:<br />{ يُرِيدُونَ لِيُطْفِئُوا نُورَ اللَّهِ بِأَفْوَاهِهِمْ وَاللَّهُ مُتِمُّ نُورِهِ وَلَوْ كَرِهَ الْكَافِرُونَ}<br />شرع الله باقي مهما حاول اي حد انه يحاربه<br />ربنا يجعل هذا في موازين حسنات اخواتنا.<br />جُزيت خيراً على الموضوع"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

