author = "شيماء"
posted = "2006-11-12"
text = "ما شاء الله لا قوة إلا بالله .. المقال قيم جدا و ثري بمعلومات مكنش الواحد يعرفها<br />سلمت يمينك ...<br />و جعله في ميزان حسناتك<br />استمر يا أخي ..<br />وفقك الله"
