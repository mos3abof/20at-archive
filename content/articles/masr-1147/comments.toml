[[comments]]
order = 10
subject = "مش فارقه"
author = "RONY"
posted = "2006-11-13"
text = "الحكم ده كان ممكن يبقى له قيمه فى بلد بتحترم القانون لكن احنا بلد رجال القانون فيها (الشرطه ) هما اول ناس بيكسروه و لو فاكريين مزيعات التليفزيون المصرى المحجبات اللى اخدوا حكم بالعمل و لحد دلوقت ما اتنفزشش ده غير المحجبات اللى بيتحرموا من العمل فى اماكن كتيره دى خلاص بقت عزبه ملكهم و احنا العبيد"
archived = "2006-11-19"
capture_url = "https://web.archive.org/web/20061119211117/http://masr.20at.com:80/article.php?sid=1147"

[[comments]]
