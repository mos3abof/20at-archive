subject = ""
author = "كلهم سا يروس"
posted = "2009-06-17"
text = "اصحاب نظرية استغلال الاقباط في جمع التبرعات<br />نجيب جبرائيل رئيس منظمة \"الاتحاد المصري لحقوق الإنسان\"،<br />ونادر فوزي رئيس منظمة \"مسيحيي الشرق الأوسط\"،<br />وحلمي جرجس رئيس منظمة أقباط المملكة المتحدة<br />وبهاء رمزي رئيس الهيئة القبطية الهولندية<br />ونبيل عبد الملك، رئيس المنظمة المصرية الكندية لحقوق الإنسان،<br />ووديع فهمي منظمة أقباط النمسا<br />وخيري مالك رئيس جمعية الصداقة القبطية الأمريكية.<br />بيتر ميخائيل \"هيئة الشاب القبطي الأسترالي\"،<br />وكمال عبد النور رئيس \"منظمة اندماج وصداقة أقباط النمسا\"،<br />ونسيم كامل شحاتة \"هيئة الشاب القبطي الفرنسي\"،<br />وصبحي جرجس \"رئيس جمعية الصداقة القبطية بفرنسا\"،<br />ورمسيس شحاتة رئيس \"منظمة اندماج وصداقة أقباط ألمانيا\".<br />الكلب عدلي أبادير منظمة \"الأقباط متحدون\"<br />كميل حليم \"التجمع القبطي الأمريكي\"<br />سليم نجيب \"الهيئة القبطية الكندية\""
archived = "2009-06-19"
capture_url = "https://web.archive.org/web/20090619090203/http://www.20at.com:80/masr/2khbar/12390-75-.html"

