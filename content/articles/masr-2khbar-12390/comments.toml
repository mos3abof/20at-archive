posted = "2009-06-18"
text = "الان تلاحظ ان اثرياء الاقباط بيشتروا اراضى زراعية ويجعلوها وقف او يهبوها للكنيسة<br />فية فلوس بتيجى بالهبل للكنائس فى مصر من برة والكنائس بتختار ناس منها يشتروا باسمهم اراضى وعقارات وهى ملك الكنيسة وتستغل هذة الاموال فى اشياء خطيرة<br />والدولة نايمة على ودنها"
