posted = "2009-06-17"
text = "ايه الغرامه التافهة دي<br />وهو سايروس بيه ما يقدرش يدفع<br />ههههههههههههههه<br />دا يدفع ونص كمان<br />ما هو عامل شركة اتصالات للمصريين العبط وبي[ *** ]ب منها ملايين كل شهر<br />ادفع يا سايروس بيه وما تخفش حتلمهم بسرعة من الشعب المصري الاهبل<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
