text = "سوريا رغم التهديد الاسرائيلي لم تبرم اتفاقية سلام معها وهي مستمرة في الصمود أما مصر فقد خانت الجميع وفضلت الاستسلام والاعتراف بالكيان<br />ثم أنا لا أتكلم عن حرب أكتوبر بل عن هذه الاتفاقية الغبية فأرجو عدم تغيير الموضوع والتهرب من الاجابة(إن كانت عندك واحدة)"
