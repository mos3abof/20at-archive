[[comments]]
order = 18
subject = "نونا"
text = "هممممم<br />ليه الحقد ده علي الشعب المصري؟؟؟؟؟؟؟<br />حَدَّثَنِى زُهَيْرُ بْنُ حَرْبٍ وَعُبَيْدُ اللَّهِ بْنُ سَعِيدٍ قَالاَ حَدَّثَنَا وَهْبُ بْنُ جَرِيرٍ حَدَّثَنَا أَبِى سَمِعْتُ حَرْمَلَةَ الْمِصْرِىَّ يُحَدِّثُ عَنْ عَبْدِ الرَّحْمَنِ بْنِ شُمَاسَةَ عَنْ أَبِى بَصْرَةَ عَنْ أَبِى ذَرٍّ قَالَ قَالَ رَسُولُ اللَّهِ -صلى الله عليه وسلم- « إِنَّكُمْ سَتَفْتَحُونَ مِصْرَ وَهِىَ أَرْضٌ يُسَمَّى فِيهَا الْقِيرَاطُ فَإِذَا فَتَحْتُمُوهَا فَأَحْسِنُوا إِلَى أَهْلِهَا فَإِنَّ لَهُمْ ذِمَّةً وَرَحِمًا ». أَوْ قَالَ « ذِمَّةً وَصِهْرًا فَإِذَا رَأَيْتَ رَجُلَيْنِ يَخْتَصِمَانِ فِيهَا فِى مَوْضِعِ لَبِنَةٍ فَاخْرُجْ مِنْهَا ». قَالَ فَرَأَيْتُ عَبْدَ الرَّحْمَنِ بْنَ شُرَحْبِيلَ بْنِ حَسَنَةَ وَأَخَاهُ رَبِيعَةَ يَخْتَصِمَانِ فِى مَوْضِعِ لَبِنَةٍ فَخَرَجْتُ مِنْهَا."
archived = "2004-10-18"
