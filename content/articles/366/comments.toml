[[comments]]
order = 5
subject = "سلام السادات شرعا"
text = "منقول عن حوار مع الشيخ القرضاوي:<br />السلام مع اسرائيل<br />قضية اخرى مازالت تشهد جدلا تتعلق بموقفك من السلام مع اسرائيل فبينما افتى الشيخ بن باز والامام الاكبر محمد سيد طنطاوى شيخ الجامع الازهر ومفتى الديار المصرية الدكتور نصر فريد واصل ومن قبلهم الراحل الشيخ جاد الحق علي جاد الحق شيخ الازهر السابق بجواز الصلح مع اسرائيل من منطلق الآية الكريمة وان جنحوا للسلم فاجنح لها وتوكل على الله وهو السميع العليم فانت لك موقف معروف من السلام والصلح مع اسرائيل الا ترى أن ذلك ايضا يخالف اجماع العلماء فهل ذلك خلاف شرعى ينطلق ممن اجتهد فاصاب فله اجران أما من اجتهد فأخطأ فله أجره أم أنه معارضة من اجل المعارضة واختلاف من اجل الاختلاف يساهم انتشارك الاعلامى فى طرحه بقوة على الرأى العام؟<br />- اننى ادهش لمثل هذا الطرح، لقد شاركت فى اجتماع للمجامع الفقهية بالكويت قبل سنوات وقد صدرت فتوى من العلماء الذين شاركوا فى هذا الاجتماع ووقع عليها اكثر من 300 عالم من مختلف انحاء العالم الاسلامى بتحريم الصلح مع اسرائيل بالطريقة التى تجرى الآن، كما شاركت قبل بضعة اسابيع فى اجتماع المجمع الفقهى بالبحرين واصدر العلماء فتوى اخرى جديدة تؤكد الفتوى القديمة ووقع عليها عدد كبير من العلماء ايضا.. وبالتالى فان دعوى الاجماع على جواز الصلح مع اسرائيل غير صحيحة.. انك تتحدث عن علماء يتأثرون باوضاع معينة تكون سببا فى فتواهم أو لعلهم لا يعرفون الواقع معرفة صحيحة.. لقد ناقشت الشيخ عبدالعزيز بن باز فى فتواه على صفحات الصحف وفندتها وهو من العلماء البارزين المرموقين ومن أقرب العلماء الى نفسى لكنى قلت: ان فتوى الشيخ بن باز حفظه الله مبنية على عدم معرفة بفقه الواقع، انه لم يعرف بالضبط ما وراء هذا الصلح والمفتى يجب ان يفقه النصوص وأدلتها ويفقه الواقع حتى تكون فتواه سليمة، فإذا ما سئل شخص حفظ الكتب وعرف الفقه فى موضوعات مثل التأمين أو زرع الاعضاء أو البنوك أو شىء من هذا القبيل وهو ليس لديه خلفية عن هذه الموضوعات فان فتواه لن تكون صحيحة فأنا لست مسؤولا عن فتوى الآخرين والذى عاهدت الله عليه والقاه به هو ما اقتنع به ان فتواه بعدم جواز الصلح مع اسرائيل مبنية على اساس ان ارض الاسلام لا يجوز التنازل عنها بصورة اختيارية فهذه الارض لا يملك احد ان يتنازل عنها، وانها ارض الأمة الاسلامية وروتها دماء المسلمين من الصحابة وتابعيهم وارض فلسطين فتحها الصحابة وقتل من اجلها عماد الدين زنكى ونور الدين محمود وصلاح الدين الايوبى والظاهر بيبرس وغير هؤلاء من قادة المسلمين العظام.. هذه باختصار ارض الاسلام لا يجوز ان نتنازل عنها لاسرائيل وهكذا كانت السياسة العربية حتى العام 1967 والتى استندت الى ان اسرائيل معتدية مغتصبة لارض ليست ارضها وتلك حقيقة، فاسرائيل لم يكن لها وجود وعندما دخل سيدنا عمر فلسطين بعد فتحها كان من الشروط التى اشترطها عليه اهلها وبطريرك القدس آنذاك سفونيوس الايساكنهم فيها يهود ولم يكن فيها يهود.. أما هؤلاء الاسرائيليون فقد تسللوا فى غفلة من الزمن وضعف من المسلمين ومساعدة من الدول الاوروبية خصوصا الانجليز ايام الانتداب البريطانى وتمكنوا من الدخول الى فلسطين بعبر الهجرات الجماعية وبارهاب العصابات الصهيونية المعروفة ونجحوا فى تكوين كيان لهم بالدم وبالحديد والنار والعنف والارهاب.. والارهاب الاكبر فى العالم فى حقيقة الامر هو اسرائيل.. لقد أقامت دولتها على الارهاب وبالارهاب."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018184556/http://www.20at.com:80/article.php?sid=660"

[[comments]]
order = 6
subject = "وائل عباس"
text = "- صلح الحديبية عقد بعد فرض الجهاد<br />لم يقل احد ان صلح الحديبية كان تفريطا في مكة والكعبة !!!<br />- صلاح الدين الايوبي ومعاهدته مع يتشارد قلب الاسد لم تحرر الشام<br />لم يخرج الصليبيين تماما الا في عهد بيبرس<br />لم يقل احد عن صلاح الدين انه خائن وابن كلب رمة لان ماكانشي فيه على ايامه ناصريين ولا اخوانجية ولا حافظ الاسد ولا صدام ولا القذافي ولا عرفات !!!<br />فيه ايه<br />مافيش مخ<br />بعناه للقرضاوي واشترينا بداله جزمة !!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018184556/http://www.20at.com:80/article.php?sid=660"

[[comments]]
order = 7
subject = "وائل عباس اكسترا"
text = "الله جرى إيه يا سيد يا محترم<br />انت بتقول ايه ؟<br />وجايبلي كلام من عند اسلام ان لاين !<br />دول جماعة وهابية واخوان بتوع ابن تيمية<br />مش ناقص غير انك تجيبلي رأي عمرو خالد في الرئيس المؤمن انور السادات رحمه الله .<br />انا ما اعترفش الا بكلام الشعرواي الله يرحمه هو ده العالم بجد مش تقولي زغلول ولا ابن تيمية ولا عمرو خالد.<br />الشعراوي قال عن الريس السادات : لا يُسأل عما يفعل.<br />وبس خلااااااااااااااص"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018184556/http://www.20at.com:80/article.php?sid=660"

[[comments]]
order = 8
subject = "وائل عباس"
text = "الرجاء من الادارة الكريمة وضع حد لمهزلة هذا اللذي يكتب باسمي !!!<br />والا يكون الموقع مسئول عن نشر التشهير بي والسخرية مني ...<br />بالنسبة للاخ بالاعلي اللذي يردد كلام الناصريين والقومجية العرب كالببغاء اقول له انتظر مقال لي ينشر قريبا بعنوان : مين احسن من السادات ؟<br />وساعري فيه ان شاء الله جميع من تستند الى اقوالهم وافتراءاتهم على رجل بين يدي ربه ولا يستطيع الرد عليهم !!!<br />ولتعرف كم تاريخنا قذر وكيف يتصرف زعماؤنا وكتابنا من باب مصالح مخفية وليس من باب الوطنية !!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018184556/http://www.20at.com:80/article.php?sid=660"

[[comments]]
order = 9
subject = "وائل عباس"
text = "بالمناسبة الشيخ الراحل محمد متولي الشعراوي فعلا قال عن السادات انه لا يسأل عما يفعل ... ومعه حق وانا اؤيده<br />احيانا ما يحتاج ولي الامر للانفراد بالامر كما انفرد سيدنا محمد بقرار صلح الحديبية برغم معارضة البعض ومنهم سيدنا عمر رضي الله عنه ثم ثبتت بعد ذلك صحة ما فعله الرسول ...<br />ومن يريد الغاء كامب ديفيد اقول له ما خطتك بعدها ؟؟؟ هل اعددت لهم ما استطعت من قوة ؟؟؟ ام ستفتح لهم الباب لتنفيذ خطتهم من النيل الى الفرات ؟؟؟<br />وساعتها نهاجر كلنا نعيش في الجيزة ؟؟؟"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018184556/http://www.20at.com:80/article.php?sid=660"

[[comments]]
order = 10
subject = "السادات صائب والأمة الاسلامية مخطئة!!"
text = "ليس الناصريون والقوميون وحدهم هم الذين اعترضوا على هذه المعاهدة،بل أغلبية الدول العربية والاسلامية وأدى هذا إلى طرد مصر من جامعة الدول العربية.<br />أنت تقارن السادات بالرسول (ص)!!هل فقدت عقلك أم ماذا!<br />لماذا لم تبرم سوريا ولبنان معاهدات سلام مع اسرائيل؟!هل أعدت لها ما استطاعت من قوة؟!<br />لقد تنازلت مصر عن مسؤوليتها التاريخية في الصراع العربي الاسرائيلي بهذا القرار الغبي.<br />وأنا في انتظار مقالتك..."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018184556/http://www.20at.com:80/article.php?sid=660"

[[comments]]
order = 11
subject = "وائل عباس"
text = "قبل ما انشر المقالة معلشي يعني<br />سورية ايه ولبنان ايه اللي بتقارنهم بمصر ؟؟؟<br />انت نسيت التاريخ ولا ايه ؟؟؟<br />ثم سورية لسه مضروبالها دمشق من كام يوم<br />انت ليك عين تقول سورية ولبنان !!!<br />اما عجايب والله<br />وانتظر المزيد عن سورية واسودهاالكبير والصغير سيمبا في المقال !!!!!!"
archived = "2004-10-18"
