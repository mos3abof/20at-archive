[[comments]]
order = 13
subject = "أحمد عبيد"
text = "أشكر جميع العشريناتية الذين قاموا بالتعليق على القصيدة، رغم إن إثنين فقط هم من علقوا على العمل وليس على الموضوع.<br />وبهذه المناسبة أتساءل: لماذا كل ما ألقي هذه القصيدة في مكان أو كلما يثار موضوع حرب أكتوبر في مكان، ينشب الصراع ويتركز بشكل أساسي على شخص السادات. وسؤالي الأساسي.. أين الكلام عن الجندي المصري؟؟ وهم كانوا شباب \"عشريناتية\" أيضا. هل تعتقدون أنه إذا قامت حرب- لا قدر الله لا قدر الله- فهل يستطيع شبابنا الحرب؟؟ سؤال يحتاج إلى إجابة."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018184556/http://www.20at.com:80/article.php?sid=660"

[[comments]]
order = 14
subject = "وائل عباس"
text = "لان ببساطة يا استاذ احمد العشريناتية بتوع اكتوبر هم هم بتوع زمان وبتوع دلوقتي<br />الفرق في القيادات<br />عشريناتية زمان ضيعهم ناصر وعامر في صحراء سيناء في 67<br />وحرب اليمن<br />والكونغو<br />ومغامرات كثيرة ضاع فيها دمهم ببلاش<br />وعشريناتية اكتوبر لقيوا قائد بعرف يمشي الامور صح<br />وده سبب الدفاع عن السادات<br />والدفاع عن صلاح الدين وقطز وبيبرس وعشرينات مصر في كل العصور<br />وعشريناتية اليومين دول بيخشوا الجامعة وهما عارفين انهم ها يتخرجوا منها ببكالوريوس او ليسانس صياعة وقهاوي !!!<br />تتوقع من ناس بتتمنى ايام الجامعة ما تخلصشي ايه ؟؟؟<br />من ناس شايفة مافيش امل ومستقبل اسود ومهبب<br />ربنا يفرج عنا يا اخي"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018184556/http://www.20at.com:80/article.php?sid=660"

[[comments]]
order = 15
subject = "وائل عباس"
text = "اقتباس من مقالي الجديد:<br />ودعونا نفترض جدلا ان ما تقوله القيادة السورية صحيح وناخدهم على قد عقلهم ونقول ان السادات فيه وفيه من كل العبر ... فما فعله السادات ان صدقوا لم يكن له اي تأثير على الجبهة السورية ببساطة لأنها حتي في ظل الهجوم المصري الكامل في الأيام الثلاثة الأولي من الحرب كانت قد فقدت قوة اندفاعها في مساء اليوم الثاني‏‏ وعادت إلي ما وراء خطوط ما قبل بدء العمليات في مساء الثامن من أكتوبر‏ وارتكزت علي الخطوط الدفاعية لدمشق والتي لم يكن بمقدور إسرائيل اختراقها بسبب اولوياتها وانشغالها في سيناء ... ده انتم ربنا وحده اللي لطف بيكم !!! ودي معلومة تاريخية مثبتة تدحض جميع ادعاءات النظام السوري !!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018184556/http://www.20at.com:80/article.php?sid=660"

