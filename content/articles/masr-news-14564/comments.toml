author = "الجباية ثم الجباية"
posted = "2009-12-24"
text = "ما معنى الضريبة العقارية ؟<br />بالبلدى<br />معناها يا محترم انك تدفع ايجار لسرير بتنام علية فى بيتك ملكك امتلكتة بعد غربة سنين وبعد خلع الضرس تدفع ايجار لملكك لنظام فاشل بيصرف على مليون عسكرى امن مركزى واقفين فى الشوارع<br />لو بيصرفوا الضرايب على المواطن - ماشى - انما كلنا شايفين اكوام الزبالة فى الشوارع والمياة الملوثة<br />تدفع ضريبة على بيت بتسكن فية لية وهو ملكك<br />تدفع ايجار لملكك لية لحكومة بنت كلب<br />مش كفاية ضريبة الدخل<br />وضريبة المبيعات على كل حاجة بتشتريها من اول القميص اللى بتلبسة للجزمة لشيكارة الاسمنت وبطارية السيارة وفاتورة التليفون وفاتورة الكهرباء عليها ايضا ضريبة مبيعات<br />انا بالعربى لن اقدم اى اقرار ضريبى لبيتى<br />وجاهز للسجن<br />يحبسونى<br />انما لن اقدم لا اقرار لبيتى ولا دافع ضرايب لبيتى"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227041126/http://www.20at.com:80/masr/news/14564-2009-12-24-09-31-20.html"
