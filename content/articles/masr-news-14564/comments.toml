author = "غير قانونية"
posted = "2009-12-24"
text = "القانون بيقول<br />لا ضرايب الا على ربح<br />فاهمين<br />لا ضرايب الا على ربح<br />يعني ضرايب على البيةت دا غير قانونية وغير دستورية<br />فين المحامين الشرفاء يرفعوا قضة على الدولة [ *** ]ه دي ويبطلوا هذه المهزله<br />ليه نصرف على مليون [ *** ] امن مركزي"
archived = "2009-12-27"
