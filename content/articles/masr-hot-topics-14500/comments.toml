order = 0
subject = ""
author = "حبس الناس فى المترو"
posted = "2009-12-21"
text = "الامن منع الناس من الخروج من محطة المترو فى محطة جمال عبد الناصر علشان سيادتة رايح يضرب بقين كلام محدش هيقراهم ولا يسمعهم ولا لهم اى فايدة ولا اى معنى اى كلام فى الكلتش والناس قاعدة تحت الارض محبوسة ولواءات الشرطة كانت متعاطفة مع الناس والناس بتسب ميتيين اللى خلفوة فى الزحمة والقرف وتعطيل مصالحهم ووقفهم مزنوقين فى محطة المترو<br />اللة يرحمك يا عبد الناصر انت والسادات لما كانت الناس والجماهير بتحيط بسيارتك والستات يزغردوا فى البلكونات<br />حاجة اخر قرف وحاجة مقززة"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223080308/http://www.20at.com:80/masr/hot-topics/14500-2009-12-21-14-13-57.html"

[[comments]]
order = 1
subject = ""
author = "واحده قرفانه"
posted = "2009-12-21"
text = "بجد حاجة تقرف مش عارفه هنفضل لغاية امتي كده الواحد طلع عين اهله في الزحمه امبارح و كلنا رحنا شغلنا متأخر يشوف له حل يركب طياره يعمل اي حاجه غير انه يعذب البشر كده حرااااااااااااا ااااااااااااام"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223080308/http://www.20at.com:80/masr/hot-topics/14500-2009-12-21-14-13-57.html"

[[comments]]
order = 2
subject = ""
author = "ضحكت من جهلها الامم"
posted = "2009-12-21"
text = "فى العالم المتخلف والمتقدم فى شمال الصحراء وجنوب الصحراء - لا ترى هذا المشهد الا فى البلد دى<br />منظر يفطس من الضحك على الغباء<br />سيادتة رايح يزور مدينة او سيادة رئيس الوزراء رايح يزور مدينة<br />تلاقى بتوع الامن ينبهوا على اصحاب المحلات والدكاكين ان يكتبوا ويعلقوا يفط قماش ترحب بالزائر الهمام مبعوث العناية الالهية<br />وتلاقى سيادة المحافظ عامل اقواس نصر فى الشوارع من قماش الخيم وعروق الخشب كما هو حادث فى بورسعيد مثلا<br />هل شاهدت هذا النفاق فى اى مكان فى العالم غير مصر<br />اقواس نصر اية يا بهايم<br />ويفط ترحيب اية يا بقر<br />ملكة بريطانيا العظمى ايام اوج مجدها محدش عمل لها اقواس نصر<br />ولا رئيس الولايات المتحدة بيتعمل لة اقواس نصر<br />ولم نرى هذا فى افريقيا ولا فى الدول العربية<br />دة جهل وعمى قلوب<br />ونفاق رخيص وكداب وكلة بيضحك على كلة"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223080308/http://www.20at.com:80/masr/hot-topics/14500-2009-12-21-14-13-57.html"

[[comments]]
order = 3
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-12-21"
text = "اقتباس هو مرعوب لية:<br />رؤساء الدول فى الدنمارك والسويد بيركبوا دراجة ويمشوا فى وسط الناس<br />وفى دول الخليج جميع الرؤساء ابتداء من الشيخ زايد رحمة اللة الى امير قطر والبحرين بيسوقوا عربياتهم بنفسهم ويمشوا فى وسط الناس بدون حراسات ولا قفل طرق ولا تفريغ شوارع<br />ومن الواضح ان هناك شعور انة عدو الشعب علشان يعملوا كدة او ان الشعب مترصد لة وانة عايز يموتة<br />مش هى دى الترجمة للحاصل واللى بنشوفة من الامن والحراسة حوالية<br />هل هناك قناصة متخفية وعايزة تموتة ولية<br />يا عم سلمها للة انت عايز تعيش بعد كدة اد اية تانى<br />سلمها للة<br />صدق الرجل الذى قال لعمر ابن الخطاب حينما وجدة ينام تحت شجرة بدون حراسة ولا امن - قال<br />عدلت فامنت فنمت ياعمر<br />العدل يا سيادة الرئيس هو الذى يحرس<br />و انا أقول\"عدلت فامنت فنمت فقتلت يا(عمر)\"؟!!!<br />حرص و لا تخون يا/ريس؟<br />اللة حافظك و راعيك؟"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223080308/http://www.20at.com:80/masr/hot-topics/14500-2009-12-21-14-13-57.html"

[[comments]]
order = 4
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-12-21"
text = "الى المعلق صاحب التعليق رقم(1)تحت \"هو مرعوب لية\"؟<br />(حكمت فعدلت وفامنت فمنت يا عمر؟<br />و انا أقول لة أيضا<br />\"حكمت فعدلت فامنت فنمت فمت مقتولا يا عمر\"؟<br />و لا ترموا بانفسكم الى التهلكة<br />و من خاف سلم؟<br />و اللة هو حامى السيد/الرئيس<br />و ليس /وزير داخليتة المغوار؟!!!"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223080308/http://www.20at.com:80/masr/hot-topics/14500-2009-12-21-14-13-57.html"

