subject = ""
author = "اقسم باللة"
posted = "2009-12-22"
text = "وانا نايم فى بيتى فى شقتى ملكى وعلى سريرى الخاص اقسم باللة ما انا دافع ايجار لسريرى فى بيتى تحت اسم الضريبة العقارية ولا انا مقدم اقرار وجاهز للحبس وحتى لو حبسونى عمرى كلة - مش دافع ايجار لسرير بنام علية فى بيتى<br />مش ها ادفع ضريبة عقارية يا حسنى وجاهز للحبس"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223080308/http://www.20at.com:80/masr/hot-topics/14500-2009-12-21-14-13-57.html"

