text = "واللة مش لاقي كلام اقولة بس يا جماعة اليي هو في دة عشان عارف انة غلط وبعديين مين اللي هيحرسة لمام ينزل تحت دة هيتمنا حاجات كتير زنب كل الي مات من الجوع و الي اتشرد في الشوارع و اللي واللي في مجلس الشعب نليم و بيشخر واللي بيشخرلنا و مش همة و واللي اختسبط في الشارع و اللي اتمص دمة وباع اعضاءة و ولادة من الفقر و كلة سلف و ديين حتي المشي علي الرجلين و سلملي علي مغارة كوبري الساحل و اهدي شكري لسيادة الرئيس راعي … في مصر."
