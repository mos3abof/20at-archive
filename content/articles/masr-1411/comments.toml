[[comments]]
order = 2
subject = "مش عارف"
author = "ماذا لو عاد المسيح ...."
posted = "2007-01-08"
text = "معنتش عارف اي حاجة اختلفت عليا الاسباب و المسببات صرت كالاعمى اتخبط في طاولات الدنيا و مقاعدها اتعثر في ارجل من يرى ...... من يرى الاشياء كما هي ؟ّ!<br />اهي دنيا حقيقية ام وهم .... اين ذهبت بقايا المثاليه اين ذهب الفعل الصحيح اين ذهب الشخص الصحيح .العمل الصحيح .العقل الصحيح . الخلق الصحيح ..؟<br />لم تعد للقيم معنى او عبارة ... ولا حتى شكارة<br />امتلأت الدنيا بالدعارة بالحقارة بالسفور ... بالسرقة بالنشل بالفجور<br />اختلفت عليا الطرق و الشوارع و الصحيح و الغير صحيح ......<br />ماذا لو عاد المسيح ؟؟"
archived = "2007-01-26"
capture_url = "https://web.archive.org/web/20070126091348/http://masr.20at.com:80/article.php?sid=1411"

[[comments]]
order = 3
subject = "سيعود باذن الله"
author = "ياء"
posted = "2007-01-08"
text = "قال رسول الله صلى الله عليه وسلم<br />والذى نفسى بيده ليوشكن ان ينزل فيكم ابن مريم مقسطا ....<br />سيختار ما اختاره اكثر من مليار من البشر<br />من كتاب معا على الطريق لخادم محمد خالد<br />انه نفس الخيار يقدم اليوم ويعلن وانه لمن حسن الحظ ان الذين يختارون اليوم ليسوا يهود اورشليم ولكنه العالم كافه والغرب المسيحى خاصه<br />لقد رفض احبار اليهود فى ذلك اليوم البعيد ان يختاروا المسيح لانه جماع فضائل لا يطيقونها .. ومشرق عصر عظيم لا يسمح لنقائصهم بالازدهار<br />وحتى حين خجل ممثل روما العاتيه الباغيه ان يشترك فى المؤامره الدنسه وتوسل اليهم كى يدعوا للمسيح حريته رفضوا<br />ترى ماذا يكون جواب البشريه اليوم حين يطلب اليها ان تختار<br />ان محمد رسول الله ليهديها الى الجواب الحق ولقد سبق الى الاختيار السديد<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/<br />وَسَلامٌ عَلَيْهِ يَوْمَ وُلِدَ وَيَوْمَ يَمُوتُ وَيَوْمَ يُبْعَثُ حَيًّا (15) سورة مريم"
archived = "2007-01-26"
capture_url = "https://web.archive.org/web/20070126091348/http://masr.20at.com:80/article.php?sid=1411"

