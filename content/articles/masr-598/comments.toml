[[comments]]
order = 7
subject = "رسول الحرية"
author = "ايمان موسى"
posted = "2006-07-09"
text = "للعلم يا استاذة مروة انا من فريق اعداد المعرض و لعلمك المعرض كان يضم نخبة من الفنانين التشكيليين و كبار الخطاطين المعروفين علي المستوي الفني و أ/ابراهيم المصري و أ/ خضير البورسعيدي و أ/ يسري حسن و أ/ صلاح عبد الخالق و أ/ عسران المنيسي و أ/ حمادة الربع و غيرهم من كبار الفنانين من دول عربية اخري مثل أ/ فريد العلي من الكويت و أ/ ناصر الميمون من السعودية و أ/ اوبرادوفنيش من البوسنه و الهرسك و أ/ خالد الحدبان من السعودية وافتتح المعرض فضيلة الدكتور نصر فريد واصل مفتي الديار المصرية السابق و لاعب الكرة المعروف كابتن هادي خشبة و المعرض ضم نخبة من الشخصيات المحترمة و المرموقة في المجتمع .و دليل علي وجود فنانين مشهورين و معروفين ان العديد من القنوات الفضائية قامت بعمل تغطية كاملة للمعرض و العديد من الجرائد اليومية ياريت تقومي بقرائتها ."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131100/http://masr.20at.com:80/article.php?sid=598"

[[comments]]
order = 8
subject = "اللحية"
author = "شريف نبيل"
posted = "2006-07-09"
text = "أود أن أعلم سيادتك يا أستاذة يا فاضلة ان اللحية هى اتباع لسنة رسول الله و ليس معنى ان يكون الشخص ملتحى أنه ينضم للإخوان المسلمين أو أى تيار إسلامى و على فكرة انا غير ملتحى و إنما غيرة على سنة الرسول صلى الله عليه و سلم"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131100/http://masr.20at.com:80/article.php?sid=598"
