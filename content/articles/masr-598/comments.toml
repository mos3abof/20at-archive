subject = "صلى عليك الله يا علم الهدى"
author = "وحيدشلبي"
posted = "2006-07-05"
text = "سعدت ببعثة أحمد الأزمان<br />وتعطت بعبيره الأكوان<br />والشرك أنذر بالنهاية عندما<br />جاء البشير<br />وأشرق الإيمان<br />صلى عليك الله ياعلم الهدى<br />ما هبت النسائم<br />وما ناحت على الأيك الحمائم<br />---------------------------------------وحيد شلبي"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131100/http://masr.20at.com:80/article.php?sid=598"

[[comments]]
