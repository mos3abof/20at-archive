subject = "دعاء شهر رمضان"
author = "نيفين نيفى نوفا"
posted = "2006-09-27"
text = "صدق رسول الله<br />على فكره يا جماعه من اجمل الادعيه فى شهر رمضان(اشهد ان لا اله الا الله و استغفر الله العظيم..اللهم انى اسالك الجنه و اعوذ بك من عذاب النار)<br />تقبل الله من جميعا"
