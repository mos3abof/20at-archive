[[comments]]
order = 0
subject = "لاحياة لمن تنادي"
author = "ابو الهول"
posted = "2006-04-08"
text = "وهل يستطيع المغرب ان يرفض طلب لامه امريكا؟؟؟؟<br />للاسف نحن الشعوب نساهم في عدوان الدول علينا عندما لا نبالي .. واذا سالنا كم مغربي يعرف ان الحلف العسكري الناتو انعقد ولمدة يومين بالمغرب فاكيد لن تنبهر من نسبة العارفين ...<br />خلوها على الله ونتمنى ان يستيقظ الجمل بما حمل<br />سلام وبرافو انكم فاكرين الناتو ماذا عمل للمغاربة بخصوص جزيرة ليلى."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151250/http://www.20at.com/article2.php?sid=673"

[[comments]]
order = 1
subject = "الهم واحد"
author = "الافغاني"
posted = "2006-04-09"
text = "علي فكرة في عندنا في شهر مايو الجاي منتدي دافوس في مصر تخيلو مش لقين ناكل وعوزين يعزموا اغنيا العالم عندنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151250/http://www.20at.com/article2.php?sid=673"

[[comments]]
order = 2
subject = "علاش؟"
author = "مغربى"
posted = "2006-04-09"
text = "علاش ها الحقد لنا ؟<br />هدا شى بالذاف معروف انا افضل منكن وكل الغرب وامريكا تعرف ان العرب مافيهم الاالمغرب لهدا نحن المغرب فقط الذى يحترمنا الغرب ويقدرنا بالذاف<br />اما انتم فلا تصيرو متلنا<br />بالاصل لا يوجد وجة مقارنة<br />حياكم اللة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151250/http://www.20at.com/article2.php?sid=673"

[[comments]]
order = 3
subject = "إلى علاش"
author = "السلام عليكم"
posted = "2006-04-10"
text = "الوطنية شيء جميل ولكن هل الدين قبل الوطن؟ بالطبع انا احب بلادي اكثر من أي بلد آخر ولكني احب كل البلاد العربية سواء اتذكر قول الشاعر الذي كنا ندرسه في الابتدائي \"بلاد العرب أوطاني وكل العرب اخواني\" ايها الاخ الكريم الموضوع مش موضوع غيرة ولكن هناك الطريقة المعروفة في الحروب \"فرق تسد\" وهي للاسف تعمل بشكل قوي بين ابناء الوطن العربي<br />رفقا باخوانكم<br />اللهم انصرنا على انفسنا حتى ننتصر على اعدائنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151250/http://www.20at.com/article2.php?sid=673"

[[comments]]
order = 4
subject = "الافلام المصرية"
author = "محمد الحسن"
posted = "2006-04-22"
text = "الافلام المصرية فيها الكثير من الكدب على التاريخ ***وعلى الناس *(فيلات*مصانع*شركات*ديموقراطيةالمملكة المباركية*)<br />ما هدا بالله عليكم يا مصريين<br />*جسدو لنا الواقع المرير اللدي تعيشه مصر*سينما البطاطس*<br />يشه مصر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151250/http://www.20at.com/article2.php?sid=673"
