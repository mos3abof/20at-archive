subject = "انه حقاً موضوع جيد"
author = "احمد"
posted = "2006-10-08"
text = "انه حقا موضوع جيد شكراًلجميعكم<br />واتمني اضافة هذا<br />من مقولاته<br />إنني أحس على وجهي بألم كل صفعة تُوجّه إلى مظلوم في هذه الدنيا، فأينما وجد الظلم فذاك هو وطني.<br />الثورة قوية كالفولاذ، حمراء كالجمر، باقية كالسنديان، عميقة كحبنا الوحشي للوطن..<br />لا يهمني اين و متى ساموت بقدر ما يهمني ان يبقى الثوار يملئون العالم ضجيجا كي لا ينام العالم بثقله على أجساد الفقراء.<br />ان الطريق مظلم و حالك فاذالم تحترق انت وانا فمن سينير الطريق.<br />لن يكون لدينا ما نحيا من أجله .. إن لم نكن على استعداد أن نموت من أجله.<br />يمكنك ان تقتلع كل الزهور لكن لا يمكنك ايقاف طلعة الربيع<br />افضل ان اموت واقفا على ان احيا راكعا<br />احمد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130356/http://www.20at.com/article2.php?sid=1324"

