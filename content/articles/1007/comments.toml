[[comments]]
order = 12
subject = "اجدع ناس"
author = "بنت حميدو"
posted = "2006-10-09"
text = "السلام علي من اتبع الهدى<br />بصراحة موضوع رائع, بس و بعدين يعني, ماشى عرفنا الشخصية الجميلة دى و احترمناها و هنفضل نحترمها علطول ان شاء الله, بس عايز اعرف بقا ناويين نعمل ايه, ناويين نبقي زي الاخ الشجاع دة و لا بس هنجيب سيرته كده و نقعد نقول واو و يااه و مش ممكن, و بعدين كل واحد بعد كده يروح لحال سبيله, انتو عارفين الراجل دة اخد شهرة كبيرة ليه, و اخد احترام الناس لية, عشان الراجل دة كان ليه هدف واحد و واضح, و هو كلمة لا , لا لكل شيء ضد الفطرة و الطبيعة و الحق و كل ما يأخذ من لانسان حقه في عيشة كريمة, و قد اخلص النية لهذا العمل , من الممكن انه لم يحقق ما كان مرجو منه, و لكن المحاولة هي الشرف.<br />و الان لنلقي نظرة سريعة و عابرة علي الحركات الثورية او الاعتراضية التي تحدث الان, و طبعا انا اتحدث عما يحدث فى بلدنا الجميل...مصر<br />اعلم انكم ستجدوون عشرات الحركات الاعتراضية, و انا احب ان اسميها الاستعراضية, فلو دققتم النظر لوجدتم ان هذه الحركات اما ورائها هدف خاص للذين قاموا بها, و اما بسبب حركة او خطوة او فعل او تصريح من جهه ما لم يعجب القائمين علي هذه الحركة فقاموا بها.<br />المطلوب يا سادة هو حركة اعتراضية دائمة و غير منقطعة و مستمرة و متزايدة لتحرير مصر, مصر الاسيرة, مصر المحبوسة, اين حركات كفاية و الخوان و لا للتوريث و من اجل التغير و كل هذه العبارات و الالقاب الجبارة, كل هذه الحركات لا تقوم الا اذا حدث شيء ما, او بسبب قضية ما او فعل ما, و الكل نسي او يتناسي الفعل الاكبر و الحدث الاجل و المصيبة المستمرة و هى احتلال مصر, الواقع الذي سيظل و سيبقي مادمنا انشغلنا عنه بمصالحنا و اهدافنا و اهتمامنا, سيبقى و يبقى و يبقى ما دام كل واحد و كل جماعة و كل حركة لا تقوم و تثور الا كذوبعة في فنجان, وهذا كله يصب في صالح المحتل و المستعمر, فهو يدرك حقيقة هذه الحركات و الانفعالات, فيضحك و يضحك و يضحك و يقول \" القافلة تسير و الكلاب تعوي\" ...اي يبقى الوضع علي ما هو عليه و علي المتضرر القيام بمظاهرة.<br />اتركوا جيفارا لحاله, فهو لا يستحق منكم ان يكون مجرد ذكري تتذكرونها في يوم من الايام و تترحمون عليها, انما هو في حاجة لمن يحي هذه الذكري و يجددها و يعيد لها مجد المقاومة الشريفة التي لا هدف لها الا الوطن..الوطن ...الوطن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130356/http://www.20at.com/article2.php?sid=1324"

[[comments]]
order = 13
subject = "انتحار الرئيس المصري حسني مبارك"
author = "بنت حميدو"
posted = "2006-10-09"
text = "لليلة السابعة على التوالي طاردت الكوابيس الرئيس حسني مبارك، ولم تفلح كل محاولات التهدئة والمسكنات والزيارات المتكررة من وزير الصحة وكبار أطباء الصحة النفسية.<br />وأخيرا استجاب سيد القصر لطلب ملح من سيدة كل القصور التي همست في أذنه قائلة: أبو علاء.. لقد آن الوقت لأن تستدعي مفسرا للأحلام لعله يكتشف السر في الكوابيس التي أحالت فراشك لواحد منها ولياليك لجحيم كأنه لا ينتهي مع استيقاظك.<br />جاء الشيخ على عجل، ووقف أمام الرئيس ويداه ترتعشان، والخوف قد دب في كل أوصاله، وأسنانه تصطك ببعضها فتحدث صوتا مثل أنين امرأة عجوز أصابتها حمى شديدة.<br />حاول الرئيس التخفيف عن المسكين ممنيا النفس بتفسيرات مبهجة تحيل كوابيسه في قادم الأيام إلى أحلام سعيدة.<br />قال قبل أن يفغر الشيخ فاه: رأيت في اليوم الأول أنني أقف أمام أربعة وعشرين عفريتا من الجن، لكل واحد قرنان فوق رأس من نار تستند على جسد مشوه، وفي الوجه عينان تخرجان نزيفا من حمم.<br />كان العفاريت كلهم يحملقون في وجهي، ثم فجأة جعلوا يصرخون بأصوات كادت تصيبني بالصمم، فهل لديك تفسير؟<br />قال الشيخ: نعم ،سيدي الرئيس، لو أعطيتني الأمنَ والأمان، ولم تأمر رجالك بالقائي في غيابات السجن بعد خروجي من قصرك.<br />قال الرئيس: أعطيكهما، وتفسر لي بكل صراحة!<br />قال الشيخ: أما العفاريت الأربعة والعشرون فهم سنوات حكمك، والحمم التي تخرج من العينين هي عذابات المصريين في ظل ارهابك وسطوتك.<br />أسرها الرئيس في نفسه ثم أردف قائلا: وفي الليلة الثانية رأيت آلاف النساء يتشحن بالسواد، ويلطمن وجوههن، ثم يرفعن أيديهن إلى السماء ولم أتبين الدعاء لكنني سمعت اسمي، ورأيت سحبا حمراء تتجمع، ثم تتكور، وتتجه ناحيتي، فاستيقظت على الفور.<br />قال الشيخ: أما النساء فهن زوجات وأمهات وأخوات وبنات ثلاثين ألف معتقل حرمتهم أنت من نعمة الحياة الطبيعية والأسرة وتربية الأطفال، فرفعن ايديهن إلى السماء داعيات الله تعالى أن ينزل عليك غضبه ومقته، وأما السحب الحمراء فهي غضبة شعبية عارمة تنتظر فقط كارثة توقظ المصريين فيكتشفون كل جرائمك في ربع قرن.<br />حاول الرئيس اخفاء غضبه على الشيخ، وتمالك نفسه ثم قال: وأما الليلة الثالثة فقد رأيت فيها المساجد والكنائس تفتح أبوابها، ويدخلها المصريون، ثم تغلق أبوابها ويتسلل منها نحيب واجهاش بالبكاء وصرخات، وسمعت اسمي يتردد في جنبات كل دور العبادة.<br />قال الشيخ بعد أن تراجع قليلا للوراء خشية أن يصفعه الرئيس: هذا الكابوس يشير إلى معاناة كل المصريين، مسلميهم وأقباطهم، تحت حكمك، وأنهم لضعفهم وخوفهم وجبنهم لا يملكون إلا صب اللعنة على من أوصلهم إلى هذا الحال، فأصبحت مصر غير مصر التي عرفناها، وأضحي المصريون غير المصريين الذين عاشوا في هذه الأرض الطيبة آلاف السنين، فجئت أنت تعبث بالنفس المصرية، وتحيل عاليها سافلها، وتهيمن بفسادك وعالم الفهلوة والبلطجة والنهب والهبر حتى بدا المشهد المصري غريبا على كل من يقوم بزيارة أرض الكنانة.<br />تسمرت عينا الرئيس لبرهة من الوقت، ثم أكمل كأنه لم يسمع تفسيرات الشيخ: وفي الليلة الرابعة رأيت أسياخا من شواظ من نار على هيئة أشباح تجري ورائي في مكان متسع فوق جبل أسود اللون تنحدر أطرافه إلى واد سحيق لا تراه العين المجردة، والأشباح تدفع بي إلى السقوط، فسقطت من على فراشي الوثير في قصر العروبة وأنا أتصبب عرقا من هول الكابوس.<br />تملكت الشيخَ شجاعةٌ فجائية، وبدأ يتفحص وجه الرئيس ثم قال له: إنهم، سيدي الرئيس، ضحايا التعذيب والضرب والركل والامتهان والاغتصاب وانتهاك الأعراض التي حدثت في السجون وفي أقسام الشرطة والتخشيبات برغبة منك، ورضا تام، وبهجة واضحة لتنفيذ أوامرك بأن يحيل الساديون من ضباط الأمن حياة مواطنيك إلى قطعة من الجحيم الأرضي. أما الأسياخ فهي تمثل رعب رعاياك من تهديدات ضباطك بوضع العصا في فتحة الشرج لكل من تسول له نفسه مناهضة نظام حكمك.<br />أطرق الرئيس خجلا من هذا العار المفضوح أمامه، ثم قال للشيخ دون أن ينظر إلى عينيه: وفي الليلة الخامسة شاهدت ملايين من الناس يرتدون ثيابا رثة ومتسخة، ويفتحون صناديق القمامة يبحثون فيها عن طعام يسد الرمق، وعلى ربوة عالية تجلس مجموعة من الأشخاص في شرفة قصر من قصور الأحلام ، وترتدي ثيابا من حرير، ويبصقون على جامعي القمامة وأنا قد انتابتني ضحكات هستيرية متقطعة.<br />قال الشيخ وقد ارتفعت نبرة صوته: أما جامعو القمامة والباحثون فيها عن كسرة خبز فهم رعاياك في نهاية السنة السادسة من ولايتك الخامسة، وأما من يبصقون عليهم من شرفة القصر فهم لصوص الوطن الذين صنعْتَهم في سنوات الذل والقهر والقمع والاذلال، فكانوا ينهبون بلدك تحت سمعك وبصرك، ويدخلون الغبطة لنفسك المريضة التي ما كرهت شيئا في الدنيا مثلما كرهت المصريين .<br />كاد الرئيس يهوي بكفه على وجه الشيخ، لكن فضوله جعله يصمت حتى يقص آخر كوابيسه، فقال: أما الليلة السادسة فقد رأيت فيها فيما يرى النائم عشرات الآلاف من الأفاعي الصغيرة تصدر صوتا رفيعا مزعجا يصم الآذان، وأنا أقف في وسطها، وهي تتجه ببطء، وتخرج وتدخل ألسنتها في حركة منتظمة كأنها تريد أن تبتلعني مجتمعة!<br />قال الشيخ وهو ينظر للرئيس نظرة ازدراء: هذه الأفاعي الصغيرة تمثل فيروسات الكبد التي طاردت، وأمسكت بتلابيب ثلث سكان بلدك بفضل اصرارك على اختيار أسفل السافلين للتحكم في طعام وشراب المصريين، فلم يكتفوا بهذا لكنهم استوردوا كل السموم والمواد المسرطنة لتصبح النجاة من مرض معوي أو وباء كبدي في عهدك معجزة صحية بكل المقاييس.<br />وقف الرئيس، وأشاح بوجهه إلى الناحية الأخرى، ثم أعاد النظر إلى وجه الشيخ وقال: وأما الليلة السابعة فقد رأيت فيها أنني في غابة متوحشة تجري فيها الوحوش المفترسة في كل اتجاه باحثة عني وأنا أقف أمامها فلا تراني، ثم فجأة يهجم علي أحدها فتنتبه كل الوحوش إلى وجودي، فيوقظني جرس الهاتف من الكابوس لأجد نفسي في القصر المعمور، ومصر كلها كما تسلمتها تخضع لي، ويتبرع المصريون بالمديح في اذلالي إياهم فلا أدري إن كنت في اليقظة أم في المنام.<br />قال الشيخ وقد نهض من مكانه استعداد لمغادرة المكان: إنها، سيدي الرئيس، عشرات الآلاف من الشكاوى والعذابات والاستجداءات والتقارير الخاصة والصحفية وبلاغات مواطنيك الذي لم يجدوا لديك أذنا صاغية، فكانت مصر تنحدر في الرياضة والاقتصاد والادارة والاعلام والصحة والدواء والتعليم والمساواة والتسامح والفنون والآداب والدور الوطني والقومي، وأنت لا تكترث، ولا تأبه، ويزداد طمعك للسلطة، وجشعك للسطوة، وشهوتك لجعل كرامة المصريين أرخض من تراب الأرض، وحياتهم أقل قيمة من الجيفة والديدان.<br />فجأة لمعت في عيني الرئيس دمعتان كأنهما خارجتان لتوهما من ضمير استيقظ فجأة، وأدار الرئيس ظهره للشيخ، ثم توجه بخطى وتيدة لمكتبه، وفتح الدرج الثاني، وأخرج بحذر شديد مسدسا كان قد تلقاه هدية من جنرال كبير زاره في مزرعته ببرج العرب.<br />أمسك المسدسَ كمحترف وقائد قديم للطيران، وتقدم صوب النافذة التي تطل على مساحة خضراء شاسعة، ثم صوب المسدس الأنيق إلى ما بين عينيه وفوق الأنف في ملتقى الحاجبين، ثم أغمض عينيه وأطلق في سرعة عجيبة رصاصة قاتلة كأنه كان يخشى أن يتراجع عن هذا القرار"
