[[comments]]
order = 7
subject = "جيفارا مات(أحمد فؤاد نجم)"
author = "معاذ محمود عامر"
posted = "2006-10-09"
text = "جيفارا مات<br />جيفارا مات<br />جيفارا مات<br />آخر خبر ف الراديوهات<br />و ف الكنايس<br />والجوامع<br />و ف الحواري<br />و الشوارع<br />و ع القهاوي وع البارات<br />جيفارا مات<br />جيفارا مات<br />و اتمد حبل الدردشة و التعليقات<br />مات المناضل المثال<br />يا ميت خسارة ع الرجال<br />مات الجدع فوق مدفعه جوة الغابات<br />جسد نضاله بمصرعه<br />و من سكات<br />لا طبالين يفرقعوا<br />ولا اعلانات<br />ما رأيكم دام عزكم<br />يا انتيكات<br />يا غرقانين<br />ف الماكولات و الملبوسات<br />يا دفيانين<br />ومولعين الدفايات<br />يا محفلطين<br />يا ملمعين يا جميسنات<br />يا بتوع نضال آخر زمن<br />ف العوامات<br />ما رأيكم دام عزكم<br />جيفارا مات<br />لا طنطنة<br />و لا شنشنة<br />و لا اعلامات و استعلامات<br />عيني عليه ساعة القضا<br />من غير رفاقة تودعه<br />يطلع أنينه للفضا<br />يزعق و لا مين يسمعه<br />يمكن صرخ من الألم<br />من لسعة النا ف الحشا<br />يمكن ضحك<br />أو ابتسم<br />أو انتشى<br />يمكن لفظ آخر نفس كلمة وداع<br />لجل الجياع<br />يمكن وصية للي حاضنين القضية<br />بالصراع<br />صور كثير ملو الخيال<br />و ألف مليون احتمال<br />لكن أكيد و لا جدال<br />جيفارا مات موتة رجال<br />ياشغالين و محرومين<br />يا مسلسلين<br />رجلين و راس<br />خلاص خلاص<br />ما لكوش خلاص<br />غير بالبنادق و الرصاص<br />دا منطق العصر السعيد<br />عصرالزنوج و الأمريكان<br />الكلمة للنار و الحديد<br />و العدل اخرس أو جبان<br />صرخة جيفارا يا عبيد<br />في أي موطن أو مكان<br />ما فيش بديل<br />ما فيش مناص<br />يا تجهزو جيش الخلاص<br />يا تقولو ع العالم<br />خلاص<br />1968"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130356/http://www.20at.com/article2.php?sid=1324"

[[comments]]
order = 8
subject = "ملاحظات شخصية"
author = "اقتباس (لم يصدق رجال القيادة في ( فالجيراندي) ببوليفيا أنفسهم عندما وصلتهم رسالة تقول \"أن بابا معنا\" ثم تبعتها رسالة أخري تقول \"بابا متعب\"، وكانت هذه الشفرة المتفق عليها.. فبابا هو جيفارا، ومعنا تعني أنه وقع في الأسر، ومتعب تدل علي أنه جريح."
posted = "2006-10-09"
text = "بعدها دوت صيحات الفرح في المكان..(جيفارا ) أسير وجريح..الأسطورة في قبضة رجالنا.<br />هكذا تحول جيفارا -الرجل الثاني في الثورة الكوبية والوزير السابق الذي التقي بأكبر قيادات العالم، وأثارت خطبه الحماس في كل من سمعوها- تحول إلي أسير في مدرسة ابتدائية في ( لا هيجيرا )..جدرانها مغطاة بالخوص..، ووسط الوحل والقذارة جلس جيفارا ذلك الأسد الجريح .<br />مشهد يبعث في قلبك الأسى حتي وإن كان ألد أعدائك .. ولكن ماذا سيحل بجيفارا الآن ؟<br />تم إصدار الأوامر بقتل جيفارا في مكانه دون أي محاكمة... فالكل يعلم جيدا أن محاكمة مثل هذا الثائر وإعطائه فرصة صغيرة واحدة للتحدث أمام الإعلام، كافية تماما لإثارة الرأي العام، بل كافية لأحداث زلزال بين الشباب المتحمس وقيام المظاهرات التي تنادي بالإفراج عن البطل الأسير.)<br />هذا الجزء بالكامل أو بتغييرات طفيفة منقول من رواية (تشي) لأحمد خالد توفيق الصادرة عن المؤسسة الحديثةوأيضا:<br />(ولمدة ست ساعات دارت معركة شرسة بين الطرفين حتى أصيب جيفارا في فخذه ونزف كثيرا من الدماء، وكسرت بندقيته، واستخدم السلاح الأبيض بوفرة في هذه المعركة و...كانت النهاية.<br />فقد حوصر جيفارا تماما بعد أن فقد الكثير من قوته ودمه.. فأحاط به أربعة جنود من رجال الحكومة فقال لهم : \" أنا التشي ....أنا تشي جيفارا \".)<br />وذلك الجزء أيضا<br />أنا لا أتكلم عن المعلومات بالطبغ فهي متاحة للكل وانما عن أسلوب الصياغة<br />فلم يصدق الجنود أنفسهم، فأسروه ليتأكدوا من هويته، وبالفعل عرفوا أن هذا الأسد الجريح الذي سقط في أيديهم هو من يكابدهم الخسائر منذ أن وطأت قدمه أرض بلادهم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130356/http://www.20at.com/article2.php?sid=1324"

