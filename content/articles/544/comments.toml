subject = "محدش هيسال عليكم"
author = "فارس _fr"
posted = "2006-11-02"
text = "احب اعزيك واعزى نفسي فى بلدنا الحبيبة , واقولك حتىلو كانت العبارةكلها غرقت ولا كان حد هيسال عنكم ,, لان احنا بنعيش فى بلد تحت حكم طاغى من الطغاة اللامبارك الله يفتت لحمه عن عظمه يارب ,,, للاسف بلدنا وصلت لدرجة من السوء ليس بعدها سوء ,, وحسبي الله ونعم الوكيل فيك يا حسنى يا كلب يا ابن الكلب .."
