[[comments]]
order = 3
subject = "اللهم ارحمنا .."
author = "هشام المصري"
posted = "2006-11-02"
text = "برغم وعود الحكومة المصرية بتعزيز اسطول النقل البحري المصري لمعتمرين والحجاج ، وبرغم الأهمية الكبرى لهذه المسألة لحاجتنا إلى الأمن والأمان عند السفر ، إلا أن تلك الوعود لم تسفر عن شيء إلى الآن ومازال المعتمرين والحجاج يعانون أشد المعاناة أثناء رحلتهم ، وسخصيا أعرف الكثير من الأشخاص اللذين تخلوا عن الرحلات البحرية تماما ، حرصا منهم على الحياة والراحة من هذا العناء ، ويأملون الحصول على مبالغ إضافية ومدخرات تمكنهم من الطيران إلى بيت الله.<br />مازال أمامنا الكثير من المعاناة ، وندعو الله أن يرحمنا منها جميعا ، وأن ييسر علينا لقاءه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103122/http://www.20at.com/article2.php?sid=1401"

[[comments]]
order = 4
subject = "من المسئول"
author = "شريف"
posted = "2006-11-02"
text = "السلام عليكم ورحمة الله وبركاته<br />اننا نعيش اليوم فى زمن صعب فعلا اصحاب النفوذ والسلكة لهم الكلمة العليا والبسطاء لا ناصر لهم من الناس ولكن الله ناصرهم باذنه، ما شعور هذا الشاب المعتمر الذى ذهب لإداء مناسك العمرة فى شهر كريم وفضيل كشهر رمضان طبعا لابد من يكون شعورا فرحا وفى غاية الفرح للذهب الى هناك لأول مرة فى حياته وتعالوا نشاهد شعوره بعد عودته اكيد مختلف تماما عن شعوره السابق ليس من وضع الزحام فى مكة او المدينة واو من العمرة ولكن شعوره بالتهميش والتسيب والانجلال من قبل المسئولين فى عودته وقبلها فى ذهابه (واعتقد ان الذهب انقلب شعوره بالفرحة والبهجة عند رؤيته الكعبة المشرفة) لكن شعوره عند عودته شعوره وهو نائم فى الشارع لا يأمن على نفسه من الاذى شعوره وهوه فى العبارة اكثر من 28 ساعة بين الحياة والموت وطبعا كلنا نتذكر ما حدث لعبارة السلام 98 منذ فترة والله انا شعرت بشعوره وهو يتذكر الموت ويتذكر اولاده وامه واهله من المسئول عن الذى حدث من المسئول عن موت اكثر من 25 معتمرا من المسسئول عن تشريد هؤلاء المعتمرين بدون رعاية صحية ولا اى رعاية ومن المسئول عن عدم ذهاب القنصل المصرى لهم وحل مشاكلهم ونقول من المسئول عن ما يحدث فى الشعب المصرى ومع الشعب المصرى المضطهد المهضوم حقه المأخوذ حقوقه كلها من قبل ما يسمونهم المسئولين والحكومة والله اتذكر كلمة خليفة المسلمين سيدنا عمر بن الخطاب رضى الله عنه وارضاه \"لو أن بغلة فى العراق تعثرت لسؤلت عنها لماذا لم تمهد لها الطريق العمر\" سبحانك ربى سيدنا عمر يحاسب نفسه ويسأل نفسه ويولم نفسه لو حدث ذلك لبغلة فما بالكم بالذى يحدث اليوم من استهزاء وأكل الحقوق للمسلمين واضطهاد للبشر هل نحن رخيصين لهذه الدرجة هل المصريين ثمنهم رخيص لهذه الدرجة لكى نلاقى كل هذه المتاعب ونحن لم نجترف اى ذنب او اثم او خطأ فمن المسئول عن ذلك كله اللهم عليك بهم اللهم استنصر لمن أوذى وتعب واضطهد فى هذه المحنة اللهم انصر الاسلام والمسلمين واعلى بفضلك كلمتى الحق والدين وانصر اللهم جيش الموحدين على القوم الكافرين واخر دعوانا ان الحمد لله رب العالمين.<br />السلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103122/http://www.20at.com/article2.php?sid=1401"

