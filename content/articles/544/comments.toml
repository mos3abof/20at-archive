subject = "حسبنا الله ونعم الوكيل"
author = "فهمي"
posted = "2006-11-02"
text = "حسبنا الله ونعم الوكيل على كل من ولّي أمانة ولم يخلص فيها .<br />ما وجدناه في هذا التقرير هو الاهمال والفساد والكذب في العمل سواء كان في مصر أو في الاردن أو في السعودية ، وقس على ذلك جميع الدول العربية الشبيهة .<br />وحسبنا الله ونعم الوكيل ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103122/http://www.20at.com/article2.php?sid=1401"
