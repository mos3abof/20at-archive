[[comments]]
order = 3
subject = "حسبي الله ونعم الوكيل"
author = "فارس مصري"
posted = "2006-09-21"
text = "لولولولولوللولولولولولىىىىىىىىىى<br />اولى الامر ايه يا حاجه هو انت عايشه فين !! دااحنا ماشاء الله علينا اولى الامر عندنا عصابة حرامية ومتخلفين وبلطجية وعملاء !! يا حسة علينا !! اعتقد ان امثالك اللى بيفكروا كده هم اللى مودين البلد فى داهية !! الله يخرب بيت اولى الامر كلهم يارب من اول !! العميل المصر اللامبارك الى الكلب السعودى هادم الحرمين الى الكلب الاردنى !!! ثلاثى العمالة الامريكية الصهيونية !!!<br />بتقوللى اولى الامر ... حسبي الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123836/http://www.20at.com/article2.php?sid=1249"

[[comments]]
order = 4
subject = "عفوا يا سادة"
author = "شيرين عبد الحميد"
posted = "2006-09-21"
text = "عفوا يا سادة اذا اردت ان تصلى فى المسجد و تأخذ ثواب الجماعة و لن يتحقق ذلك الا بالبطاقة فلتعمل البطاقة اذا اردت ان تبعد عن وجع الدماغ و وجع القفا و وجع شتيمة الام و الاب و عدم الاهانة فلتلتزم بيتك. و بلاش حكاية اولى الامر اللى مزعلاكو دى. رمضان كريم يا مسلمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123836/http://www.20at.com/article2.php?sid=1249"

[[comments]]
order = 5
subject = "بالشفا ان شاء الله"
author = "نيفين نيفى نوفا"
posted = "2006-09-21"
text = "انا بهنىء وزاره ال<br />داخليه التونسيه على الاقتراح الرائع دا و بقولها بالشف ان شاء الله<br />دا اللى ناقص فعلا<br />سبحان الله<br />يا حماعه تانى هقولها<br />متهيالى احنا على ابواب رمضان فياريت نحترم نفسنا شويه ف الالفاظ<br />كل سنه و مصر كلها بخير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123836/http://www.20at.com/article2.php?sid=1249"

[[comments]]
order = 6
subject = "رد لتانى مرة"
author = "شيرين عبد الحميد"
posted = "2006-09-23"
text = "يا سيدى انا قلت فى اول تعليق معنى فى القرأن الكريم و لا تلقوا بايديكم الى التهلكة اذا ما نفذتم ما يقوله اولى الامر و كنت اقصد السلطة الحاكمة فى البلاد سواء كانت شرعية او غير شرعية و فسرت فى التعليق الثانى كلمة التهلكة و ما قد يتعرض له المعارض لتلك السلطة (طبعا بضم السين) تغيير الحكام لن يكون بالكلام و المظاهرات و صدق الحق حين قال ما معناه لن يغير الله ما بقوم حتى يغيروا ما بأنفسهم0 ملحوظة خارج الموضوع او داخله(انا اكتب اسمى لاقتناعى بما اقول و ايضا لا اخاف من تعليقات الاخرين سواء كانت بايخة او.......) واخيرا رمضان كريم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123836/http://www.20at.com/article2.php?sid=1249"
