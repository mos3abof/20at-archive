[[comments]]
order = 0
subject = "اولى الامر"
author = "شيرين عبد الحميد"
posted = "2006-09-20"
text = "يأمرنا الله تعالى فى كتابه العزير باتباع اولى الامر فان كان هذا القانون فليكن اذا اردت الصلاة فى المسجد اما اذا لم ارد ذلك فعلى ان التزم بيتى دون اى مشاكل مع اولى الامر تبعا لقول الله تعالى ما معناه لا تلقوا ايديكم فى التهلكة و على هامش هذا الموضوع فأنا لا اؤيد صلاة المرأة فى المسجد و افضل الصلاة فى بيتى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123836/http://www.20at.com/article2.php?sid=1249"

[[comments]]
order = 1
subject = "أولى اية لا مؤخذة"
author = "اهى حكاية اولى الامر دى اللى جايبانا ورا"
posted = "2006-09-20"
text = "مهو مش يبقى قولى الامر عربجى و خمورجى وبايع البلد و حارق الناس و مغرقهم و مبيعهم جسمهم و شرفهم و هاتك عرض حريمهم<br />و نقول لا يجوز الخروج على الحاكم<br />اى حاكم اللى بتتكلمة عنة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123836/http://www.20at.com/article2.php?sid=1249"

