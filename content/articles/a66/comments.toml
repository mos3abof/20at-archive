subject = "قاصدينها و ربنا"
text = "بصوا انا مش هتكلم<br />بس هات اعبط واحد في اعبط منطقة و اسأله لو حد صورك و انت بتشرب سيجارة من ورا ابوك<br />و ممكن يهددك بالصور دي .رد فغل طبيعي انك على الاقل هتضربه .و ممكن لو مخنوق منه و عايز تخلص فممكن تقتله.<br />قلت كل اللي عندي و اللي عنده كلام تاني يسمعهلنا<br />سلام يابني أدميين"
archived = "2004-04-18"
capture_url = "https://web.archive.org/web/20040418002439/http://www.20at.com:80/article.php?sid=66"
