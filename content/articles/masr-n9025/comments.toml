[[comments]]
order = 1
subject = "تهنئة بمناسبة العيد"
author = "ابراهيم سليمان- من فلسطين - نابلس"
posted = "2006-12-24"
text = "اهنئ هذا الموقع الرائع الجميل بعيدالاضحى المبارك واهنئ اهلنا في فلسطين والعراق ولبنان وسائر جميع بلاد المسلمين بهذه المناسبة العطرة .... اعاده اللله علينا وقد تحررت ارضنا من الصهاينة الحاقدين......وعاد العراق سالما باهله وشعبه....وكل عام وانتم بخير"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102728/http://masr.20at.com:80/article.php?sid=1092"

