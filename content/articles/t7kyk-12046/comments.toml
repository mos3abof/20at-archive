text = "المشكلة فى نوعية الموظفين القائمين على العمل والعجرفة والتعالى فى تعاملهم مع الموظفين وكانهم رايحين يشحتوا منهم<br />المفروض ان الموظفين بتوع الزفت الداخلية ياخدوا دورات فى كيفية التعامل مع المواطنين وحسن وتسهيل معاملة الناس مش قوة حاكمة وناس محتلة يجب اذلالهم وتوقبفهم فى طوابير فى الشمس خارج المبنى وتركهم ساعات وانشغال الموظف بالرغى واكل السندوتشات وشرب الشاى وعدم الاهتمام بالناس<br />وبعدين الناس غلابة هيجيبوا فلوس توصيل المنازل دى من اين<br />صحيح دول الخليج ودبى بالذات تطبق هذة الفكرة من سنوات طويلة وبكفائة وتصل المعاملة الى البيوت نظير رسم 10 دراهم وليس 30 جنية ويبدوا اننا نقلد دول المنطقة بعد ان كانوا يقلدوننا<br />شفت التخلف اللى عندنا - بنقلد بس على وساخة"
archived = "2009-05-15"
