[[comments]]
order = 31
subject = "بجد تحفه"
author = "princessnancy"
posted = "2006-08-26"
text = "فيلم اوقات فراغ تحفه تحفه تحفه<br />الفيلم بجد يجنن و انا اعرف احمد حاتم و عمرو عابد شخصيا وهمابجد بيتبسطوا لما بيسمعوا ان فى ناس حبت الفيلم اوى كده<br />انا فى رايى ان الفيلم يستاهل اوسكار لانه كان جرئ فى عرضه للمشكله و طلع كل المشاكل و العيوب الموجوده فى الولاد من ناحية شربهم للمخدرات ا والجنس و غيره و بالنسبه للبنات من ناحية التردد فى موضوع الحجاب و الناس اللى بتقول ان الفيلم طلع شباب اليومين دول كلهم وحشين فهو غلطان و الدليل ان مى(صفا) كانت عارفه هى عايزه ايه و بتذاكر و بتتعب و حتى عمرو(كريم قاسم) كان عارف هو عايز ايه و كان عايز يحول من هندسه لاعلام لولا ان التقديم فى شهر سبتمبر و الفيلم انتهى و هما فى اللعبه متعلقين..<br />يعنى عايزه اقول ان الفيلم بين ان فى شباب كويس و بين مميزاتهم و فى شباب ضايع و برضه بين مساؤهم ..<br />و انا عجبنى الفيلم موووووت و انا شايفه ان كل اللى مثلوا فيه تعبوا بجد و دى نتيجة تعبهم ...<br />ربنا يوفقهم و يفضلوا على نفس خط سير النجاح ده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150024/http://www.20at.com/article2.php?sid=1013"

