text = "الفيلم اكثر من رائع و انا دخلته و هدخلع تانى و عاجبنى فيه الواقعية و الصراع بتاع الابطال و قد ايه هما ضحايا فى نفس الوقت لغياب النرابط الاسرى و كمان مشهد النهاية رائع لكن اكثر مشهد يستحق جايزة هو مشهد الموت فعلا رائع و كمان انا متفقة معاكو فى نقطة الحجاب دى بس ممكن تكون انعكاس لتردد البطلة و دة فعلا بيحصل ممكن ميكنش المقصود الهجوم على الحجاب و كمان الدين على لنه مهرب دة بردة واقعى و خاصة فى الفئة دى من الشباب. بس عامة الفيلم تحفة"
