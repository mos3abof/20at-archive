[[comments]]
order = 12
subject = "احنا في مشهد واحد"
author = "لبناني دما"
posted = "2006-07-16"
text = "الفلم كله في اخر مشهد من الفلم .. واحنا كلنا على بعض كدة ومشاكلنا كلها كدة على بعض في اخر مشهد من الفلم .. يا جماعة اخر في الفلم دة بجد مشهد عبقري جدا جدا جدا .. لكن للاسف كتير اوي من اللي شافوا الفلم طلعوا من السينما مش فاهمين اخر مشهد اية يعني .. واية يعني اللي يخلي المخرج يبدا بمشهد الملاهي وينهي الفلم بمشهد الملاهي برضه..<br />لو ركزتوا كدة في مشهد الملاهي .. اشمعنا اختار بالذات لعبة القادوس علشان يركبهم فيها .. لانها هي اللي زي الساقية بالضبط بتدور تدور تدور .. زي ما قال الرائع الابنودي في الاغنية .. يعني بندور في حلقة مفرغة ومنخرجش منها .. الخروج دة هو هيكون الحل .. لكن المشاكل دي ملهاش حل فعلا .. وثانيا لو بصيتوا على كلامهم وهم فوق متعلقين كدة .. كل واحد بيقول كلمة .. يا عم ياللي تحت .. يا جدعان حد يرميلنا سندوتش ولا حد يجيب ازازة ماية طيب .. طيب حد يدي زقة طيب .. كل دة لو جينا طبقناه على الحياة يعني بالعربي كدة لو شيلنا القادوس اللي هم فيه دة وحطينا مكانه الحياة وطبقنا كل حاجة بقا على الحياة .. هنلاقي ان كل شئ مفهوم ومنطقي جدا ..<br />طيب واشمعنا اختار انه يعلقهم فوق كدة .. يعني كان في ايده انه يختار مكان على الارض او مكان تحت وبرضه يحبسهم فيه .. اية الحكمة من الارتفاع ؟<br />الاجابة يا جماعة ان بجد الناس دي اللي هم الشباب اعلى من الناس العادية اللي تحت دي .. وعندهم طاقات ومخ وفكر اعلى كتير من الناس الكبيرة والمهمة واللي كانوا في الارض لو لاحظتوا حركة الكاميرا على الارض تحت وتركيزها..<br />فعلا يا جماعة اخر مشهد في الفلم دة مشهد عبقري بجد ..<br />زائد ان الفلم كله على بعضه تحفة من كل حاجة سواء من التصوير ولا الاخراج ولا السيناريو .. كل حاجة فيه بجد روعة ..<br />اتنبأ للناس دي بمستقبل باهر بجد لو فضلوا على نفس الخط دة .. مجريوش ورا الشهرة والفلوس وبس ..<br />ربنا معاهم ومعانا في حل مشاكلنا دي .. وربنا مع الكل..<br />شكرا على قرائتكم.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150024/http://www.20at.com/article2.php?sid=1013"

