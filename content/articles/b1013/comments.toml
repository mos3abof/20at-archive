subject = "مجرد رأي"
author = "فاطمة"
posted = "2006-07-02"
text = "في لخبطة بسيطة يا كريم عمرو هو طالب الهندسة اللي اهله منفصلين و حازم هو اللي من عائلة ثرية .<br />اما عن تعليقي عن الفيلم ، اول ردة فعل هي الصدمة من الجرأة يمكن ، من الصدق يمكن يمكن .<br />انا عارفة طبعا ان مجتمعنا فيه نماذج اسوأ من كدة كمان بس الفيلم كان مؤثر بالنسب لي اوي و اكثر حاجة ضايقتني بجد رؤية صناع الفيلم للدين انه مجرد مهرب بعد اوقات عصيبة في حياتناكأنه مهف ضلمة بندخل فيه و احنا مجروحين و اول ما نسترد عافيتنا نبعد عنه و نهجره ."
