[[comments]]
order = 1
subject = "إن شاء الله الأهلى"
author = "عمرو"
posted = "2006-02-23"
text = "إن شاء الله الأهلى سيفوز بالكأس ، لكل مجتهد نصيب واللاعبين تعبوا جدا السنة دى حصلوا على الدورى وكاس أفريقيا للأندية وأغلبهم ساهم فى حصول مصر على بطولة الامم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145243/http://www.20at.com/article2.php?sid=487"

[[comments]]
order = 2
subject = "الأهلى عمهم وحابس دمهم"
author = "وائل كمال الاشوسى"
posted = "2006-02-23"
text = "ياجماعة الأهلى يكسب او يتغلب من الجيش الملكى ده شئ ميهمنيش ... انا كل اللى يهمنى انه يدلع الزمالك الماتش الجاى خمسة ولا ستة علشان نفرح بأة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145243/http://www.20at.com/article2.php?sid=487"

[[comments]]
order = 3
subject = "الجيش هو الاسد"
author = "محمد الريفي المغربي"
posted = "2006-02-24"
text = "اهلي ايه وابو تريكة ايه وبركات اييه...القديوي حيعملها زي ما عملتها مصر في الكاس الافرقية.مرة ليكم ورة لينا واه يا وتي واه.هدي حقرة كبيرة.<br />المغرب ومصر تابعين بعضياتهم زيي الابرة والخيط مش عارف ليه.بس المرة ديه ابرة محمد فاخر حتسبق<br />اكيد الجيش الملكي<br />مين غيرهم<br />اجدو وقديوي وعبد الحفيظ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145243/http://www.20at.com/article2.php?sid=487"

[[comments]]
order = 4
subject = "يارب النصر لمصر"
author = "احمد سامى"
posted = "2006-02-24"
text = "مصر اليوم كلها اهلى ونكرر انجاز افريقيا سواء كان منتخبنا او فريقنا هنكسب بعون الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145243/http://www.20at.com/article2.php?sid=487"

[[comments]]
order = 5
subject = "منتخب مصر يواجه جيش مغربي محلي"
author = "أكرم"
posted = "2006-02-24"
text = "مع الاعتذار لصديقنامحمد المغربي ان الاهلي ممتليء بكل نجوم افريقيا اللي فازوا بالكاس و ميتفعش تبوظوا فرحة المصريين بالكاس ( اللي ضيعتها الانفلونزا طبعا ) و اليكم خطة الاهلي للفوز<br />1- دبح الفرخة للجيش المغربي باحراز هدف في اول عشر دقائق<br />2- العطس بقوة في وجه الفريق المغربي لخلخلة دفاعاته و احراز الهدف التاني في نهاية الشوط الاول<br />3- لعب شوط تاني ممل من الاهلي و احراز هدف في نهاية الشوط<br />و مبروك لمصر<br />و للمغاربة ايضا مبروك<br />1- متنسوش ان المغرب هي الفريق الوحيد الذي لم يهزم من مصر في بطولة 2006<br />2- متنسوش ان المغرب هي الفريق الوحيد اللي فاز على مصر في 1998"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145243/http://www.20at.com/article2.php?sid=487"

[[comments]]
order = 6
subject = "المغرب"
author = "يونس / المغرب"
posted = "2006-02-24"
text = "لست من مشجعي الجيش....<br />و لا أعترف بالاهلي كفريق.....<br />ولاني مغربي وعراقي وسوداني و أفغاني و عربي مسلم<br />فلتكن ادا الغلبة للاقوي.<br />كفي من الوطنية المحدودة ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145243/http://www.20at.com/article2.php?sid=487"

[[comments]]
order = 7
subject = "المغرب بعون الله"
author = "مغربية متيمة ببلادي"
posted = "2006-02-24"
text = "بكوني مغربية طبعا احب المغرب وشعبه واهله لدلك اتمنى الفوز للجيش الملكي وسيعوض كل ما ضاع بادن الله.حض سعيد<br />في رعاية الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145243/http://www.20at.com/article2.php?sid=487"

