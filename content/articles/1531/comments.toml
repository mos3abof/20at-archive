[[comments]]
order = 9
subject = "مبروك للاهلي"
author = "sweet_princess(اهلاويه متعصبه )"
posted = "2006-02-26"
text = "عملوها الاهلاويه ورفعوا راسي قدام كل المغاربه اللي شككوا في كلامي .<br />اهي دي اللي تستاهل زغروته بجد بس مش قادره انتوا قطعتوا قلبي في الماتش وكنتوا هتجبيبولي سكته قلبيه وياللا زغروته مش هتعمل حاجه لولو....( لا مش قادره قطعتو قلبي بجد طول الماتش ).<br />واخيرا (يازمالك ) الاهلي قادم (((جايين لك استنى )))ياللا بقى رجعولنا ايام السته واحد .<br />مع كل احتلاامي للزمالك والزملكويه (على فكرف انا معظم اصحابي زملكويه )."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145243/http://www.20at.com/article2.php?sid=487"

