text = "ويقول الأستاذ الحاج محمد أصبان ـ عضو رابطة علماء المغرب ـ :<br />إنَّ ظهور الصور المتبرجة للنساء بمواقع الإنترنت أمر لا يقبله الإسلام، فالإسلام يرفض أن تظهر المرأة أيا كان شكلها ونوعها متبرجة أمام الملأ، صيانة لكرامتها أيا كانت هذه المرأة مسلمة أو غير مسلمة.. ولا نجد أحدا أجاز ذلك من علماء الإسلام.<br />وأما إظهار صور الصلبان والكهنة فإنه يجوز ذلك لأن القاعدة الفقهية تقول: \"حاكي الكفر ليس كافرا\"، لذلك فعرض صورهم لا يعني تقليدهم ومتابعتهم على ما هم عليه، سواء كان هذا الصليب المنشور بهذه المواقع شارة على يد الكاهن أو في عنقه.. أو كهنة بزيهم الرسمي الكنائسي.. وإنما هذه الصورة تدل على شخصية الرجل حديث الموضوع وأنه كاهن أو نصراني. أهـ"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131122100/http://www.20at.com:80/20at/ana-saudi/15101-2010-01-28-18-22-43.html"

