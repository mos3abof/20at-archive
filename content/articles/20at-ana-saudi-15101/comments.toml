posted = "2010-01-30"
text = "ويقول الدكتور ماهر السوسي ـ الأستاذ المساعد في الشريعة بالجامعة الإسلامية بغزة ـ فلسطين:<br />لا أرى ضرورة لنشر صور النساء؛ لأنه لا يوجد حاجة لهذا الأمر، وإن كانت هناك حاجة داعية لنشر صورة امرأة فالضرورة هنا تقدر بقدر؛ لأن موضوع الفتنة يختلف من شخص لآخر من لا تفتنه امرأة معينة فتنته أخرى؛ وبالتالي لا تنشر هذه الصورة إلا إذا كان هناك داعٍ إلى نشرها أما بدون داعٍ فالأصل عدم النشر للاحتياط وخروجا من قول المانعين.<br />أمَّا بالنسبة للصلبان والكهان… إلخ إذا كان النشر بقصد التعريف أو الدلالة على شيء معين فلا مانع. أهـ<br />ويقول د. حسين أبو عجوة ـ رئيس لجنة الإفتاء بجامعة الأقصى بغزة.:<br />من الناحية الشرعية لا يجوز نشر صور نساء بشعورهن، وإن كان نشر صورة لامرأة بالحجاب، ومن غير أن توضح معالمها كاملة ـ بمعنى أن تكون من بعد وليس بالضرورة أن تكون معالم وجهها بارزة ـ فلا حرج في ذلك."
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131122100/http://www.20at.com:80/20at/ana-saudi/15101-2010-01-28-18-22-43.html"

