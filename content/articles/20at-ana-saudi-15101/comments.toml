text = "ويقول الدكتور عبد الرزاق الجاي - عضو المجلس العلمي بالرباط:<br />الحق أن الصورة تؤثر في الإنسان أكثر من الصورة الحقيقة؛ لأنها تنشط الخيال وتذهب به بعيدا، وللفقيه ابن باز رحمه الله فتوى تنصُّ على تحريم الصور الخليعة للمرأة أو لما يثير الغرائز.<br />أما عن صور الصلبان فنشرها مقيد بالهدف من نشرها، ومقيد بالضرورة، فإذا غابت الضرورة من ذلك، فلا حاجة في نشرها؛ لأن في ذلك دعاية لشركهم وكفرهم، والأولى تعويد الناس على النظر إلى الخير.<br />وقد أشار ابن قيم الجوزية رحمه الله في كتابه \"تلبيس إبليس\"، وكذلك \"حكم أهل الذمة في الإسلام\" إلى أنه لا يجوز تقليدهم في زيهم حفاظا على تميز المسلم.<br />والأفضل لهذه المواقع الإسلامية أن تتنزه عن كل شبهة، وحديث الباب واضح حيث يقول النبي صلى الله عليه وسلم: \"الحلال بين والحرام بين وبينهما أمور مشتبهات فمن اتقى الشبهات فقد استبرأ لدينه وعرضه ومن وقع في الشبهات وقع في الحرام\".. فالعبرة ليس بما يحدث للناشر من أمن من الفتنة، وإنما المستهدف هل هو محصن ضد هذه الفتنة أم غير محصن؟ والواقع أنَّ الغالب غير محصن.أهـ"
archived = "2010-01-31"
