author = "آراء لا يجب أن تغفل2"
posted = "2010-01-30"
text = "يقول الأستاذ الدكتور علي القرة داغي ـ أستاذ ورئيس قسم الفقه والأصول بكلية الشريعة ـ جامعة قطر ـ ونائب رئيس مجلس إدارة شبكة إسلام أون لاين:<br />إنَّ نشر مثل هذه الصور التي تخص المرأة المتبرجة أو الصلبان أو الكهنة بزيهم الديني يتبع أحد الأمرين التاليين:<br />1 ـإن كان المقصود به بيان الواقع للتعليق عليه، وليس لإقراره أو استحسانه أو تأييده فإنَّ هذا يدخل في باب الحكاية والنقل ما دامت هذه الصور لا تثير فتنة، وبالتالي فإن هذا الضابط في هذه الحالة يكفي، فمثلاً: وقعت واقعة في مدينة ما وصورت هذه الواقعة وفيها نساء متبرجات دون التركيز عليهن، وإنما لبيان نقل هذه الصورة فلا مانع منها بهذا الشرط الذي ذكرناه وهو عدم التركيز على هذه الصورة.<br />والخلاصة أنني أعتقد أننا نحتاج إلى ضابط وشرط، الشرط هو: ألا يكون تركيز الكاميرا على المرأة المتبرجة، والضابط هو الوارد في السؤال.<br />2- أما نقل الصور الخاصة للمتبرجات بقصد التركيز عليهن أو للإثارة أو لنحوها فهذا لا يجوز."
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131122100/http://www.20at.com:80/20at/ana-saudi/15101-2010-01-28-18-22-43.html"

