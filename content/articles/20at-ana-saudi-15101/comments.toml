posted = "2010-01-30"
text = "ويقول الدكتور فهد بن سعد الجهني أستاذ الفقه وعميد شؤون الطلاب بجامعة الطائف:<br />ينبغي على المتحدث في مثل هذه المسائل أن يكون من أهل العلم والدراية بالقواعد الشرعية والمقاصد الكلية حتى لا يزل بكلامه أقوام كثيرون.<br />ومن قواعد أهل العلم أن \"الغاية لا تبرر الوسيلة\" وأن المقصد إذا كان مشروعاً فلا بد أن تكون الوسيلة مشروعة أيضاًَ.<br />فنشر صور النساء وهن متبرجات فيما يراه من يحتاج لهذا الأمر هو وسيلة لتحقيق مقصود يراه مشروعاً إلا أن الوسيلة في ذاتها محرمة كما دلَّت على ذلك النصوص الشرعية.<br />ولا ينبغي لأهل الخير أن يطلبوا صلاح الأمة ونفع الآخرين بما حرم الله سبحانه وتعالى ويجب أن يتورعوا عن هذه المحرمات أو الشبهات، فإن الخير كل الخير بالتمسك بما دلت عليه النصوص الشرعية والرجوع إلى قواعد أهل العلم التي تؤصل كثيراً من أمثال هذه المسائل.أهـ"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131122100/http://www.20at.com:80/20at/ana-saudi/15101-2010-01-28-18-22-43.html"

