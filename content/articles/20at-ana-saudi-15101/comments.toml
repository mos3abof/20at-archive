author = "آراء لا يجب أن تغفل"
posted = "2010-01-30"
text = "يقول الدكتور طاهر مهدي البليلي:<br />إنَّ الضابط في نشر الصور ليس الهوى والمصلحة العاجلة، إنَّما الشرع الحنيف. وذلك كما يلي:<br />الأصل ألا ينشر للنساء صور، أما إذا كان ولا بد فعليه أن تكون تلك النساء محتشمة بحيث لا تثير غريزة بإبراز مفاتنها التي أمر الله أن تُستر، وليس هناك فرق كبير بين العري في الصورة وفي الواقع، فكلاهما يثير الفتنة والشهوة وهو غير جائز شرعا وخلقا، لقوله صلى الله عليه وسلم: \"يا أسماء، إن المرأة إذا بلغت المحيض لا يصح أن يظهر منها إلا هذا وهذا وأشار إلى وجهه وكفيه\" (الحديث وإن كان مرسلا فهو معمول به في هذا المجال أبو داوود اللباس 3580). هذا فيما يتعلق بالنساء العاديات."
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131122100/http://www.20at.com:80/20at/ana-saudi/15101-2010-01-28-18-22-43.html"

