[[comments]]
order = 3
subject = "كلام كويس"
author = "حسام الدين على"
posted = "2006-09-18"
text = "انا و اعوذ باللة من كلمة انا ملاحظ ان معظم الباقرة لالخرين بيسموهم مجانين علشان بيتصرفوا بطريقة غير مالوفة للاخرين<br />يعنى غير مهندمين فى ملابسهم مبيهتموش بالشياء الدنيوية قوى المهم عندة انة يبدع مش يقلع علشان كدا احنا بنقول عليهم مجانين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132950/http://www.20at.com/article2.php?sid=1165"
