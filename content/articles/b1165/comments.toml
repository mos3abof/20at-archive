[[comments]]
order = 0
subject = "موضوع مشوق"
author = "واحد الناس بتقول عليه عبقري"
posted = "2006-08-31"
text = "الموضوع فعلا مشوق، بس انتي نسيتي عباقرة العلوم<br />زي جاليليو، و آينشتاين و الحسن بن الهيثم و غيرهم كتير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132950/http://www.20at.com/article2.php?sid=1165"

