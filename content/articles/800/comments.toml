[[comments]]
order = 0
subject = "جمال البنا والاساءات"
author = "معاذ محمود عامر"
posted = "2006-09-28"
text = "أعتقد يا عشرينات انه كان يجب عليكم من باب الدقة والامانة أن تنشروا آخر مقالين كتبهماالمفكر الاسلامي الأستاذ جمال البنا الأربعاء السابق واربعاء الأمس...<br />فبما أنكم قررتم ان تنشروا مقاله المثير للجدل عن التدخين والصيام, كان يجب أن تكملوا السلسلة المتعلقة بهذا الموضوع...<br />وأعتقد أنه تعرض لكثير من الاهانات على لسان بعض العصبيين أو المتشددين....<br />وأظن أن مقاله الذي كتبه الاربعاء قبل السابق كان جديرا بأن يدفع عنه كثيرا من هذه الاهانات السفيهة التي لا يحكم أصحابها عقولهم قبل أن يطلقوها في وجه رجل جليل ومفكر كبير وصاحب مشروع فكري جيد جدا,<br />وان لم يكن كل ذلك فعلى الأقل هو كبير في السن بدرجة تجعل اهانته من الفحش والسب الذي نهى عنه الرسول صلى الله عليه وسلم,<br />لذا أرجو منكم رجاء حارا جدا جدا أن تنشروا مقالتيه المؤرختين27_9<br />و20_9<br />ولكم الشكر العظيم والاحترام الجم ان فعلتم..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123513/http://www.20at.com/article2.php?sid=1286"

[[comments]]
order = 1
subject = "مارلبورو ولا كليوباترا؟"
author = "طيف بدر"
posted = "2006-09-28"
text = "يا عم روح حشش مع جمال البنا بتاعك ده لوحدك و مالناش دعوة بيكم<br />التدخين حرام سواء في رمضان و لا غير رمضان... سبع البورومبة الخرفان ده جاي يعمل إيه ؟ لأ و البجاحة إنه حلال في رمضان وقت الصيام<br />و يا عم لو كنا إحنا متعصبين و متشددين فسيادتك إنت و الحشاش بتاعك سلوليين باكنيين منافقين ... ده لو إنت عايز الحكاية إلقاء تهم و ألفاظ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123513/http://www.20at.com/article2.php?sid=1286"
