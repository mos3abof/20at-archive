subject = "اكيد الاميركى احسن"
author = "zina"
posted = "2006-05-03"
text = "طبعا الفيلم الاميركى والاوروبى احسن ولازم محدش يضيع واته ويروح يتفرج عالافلام العربى اللى ملهاش معنى واللى الممثلين فيها عيزين يا خدو دروس لسه ازاى يمثلو وطبعا مننساش الميزانية احنا لما بنصرف مليون جنيه عالفيلم مش عرفة بنبا مبسوطين اوى ليه وهم بيدفعوا بالمية مليون دولا ر عالفيلم هى هتيجى علا دى يعنى ومش هيتفوقو علينا فيها مهم متفوقين علينا فى كل حاجة"
archived = "2006-11-02"
