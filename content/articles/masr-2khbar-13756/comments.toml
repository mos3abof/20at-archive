author = "قدوة حسنة"
posted = "2009-10-19"
text = "لعل هذا يكون قدوة لبتوع الوطنى وحصوة ملح فى عين الفاشل<br />فاروق حسنى اللى بقى لة 23 سنة وزير<br />والفاشل رئيس مجلس الشعب والشورى<br />والفشلة فى لجان الوطنى الذين من ايام الاتحاد الاشتراكى<br />وعصابات الاحتكار والاستيراد والتصدير التى تحكم البلد<br />لعل هذا يضع حصوة ملح لكل مسئول فاشل ملزوق فى الكرسى حتى الموت باحسن انواع الغراء<br />احسنت يا مرشد<br />استقلت وارتحت وجلست فى البيت"
