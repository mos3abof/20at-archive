[[comments]]
order = 11
subject = "لا حول و لا قوة إلا بالله إنا لله و إنا إليه راجعون"
author = "مناضل أنترنتى قديم"
posted = "2006-04-14"
text = "السلام عليكم ورحمة الله و بركاته<br />خرجتم يا عشرينات عن النص فى هذا الموضوع كنت اتمنى ان تكتبوا موضوع مثلا عن من أفضل قارىء يؤثر فيك بأدائه فى تلاوة القران<br />انا شخصيا يعجبنى أستاذى الشيخ محمد جبريل واسرح معه فى روضات القران الكريم و كذلك القارىء صاحب الصوت الشجى الشيخ مشارى بن راشد العفاسى و حينما اسمع صوت القارىء احمد بن على العجمى ينتابنى احساس روحانى عجيب<br />و لا يمكننى ان انسى دولة التلاوه القديمه و رئيس جمهوريتها الشيخ عبد الباسط محمد عبد الباسط عبد الصمد و كذلك الشيخ محمود الحصرى و كذلك محمد صديق المنشاوى و عبد الفتاح الشعشاعى<br />اما أن نكتب عن الاغانى فهذا كلام لا يرضى الله و لا رسوله<br />إلى شباب المحررين أقول اكتبوا ما يشهد لكم يوم القيامه برجاء الأطلاع على تعليقى فى هذا المقال<br />http://www.20at.com/article2.php?sid=659"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115931/http://www.20at.com/article2.php?sid=694"

