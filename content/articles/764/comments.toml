subject = "انا لله وانا اليه راجعون"
author = "MM"
posted = "2006-04-14"
text = "انا لله وانا اليه راجعون<br />هو اللى بيحصلنا ده من فراغ (جنون بقر..انفلونزا الطيور..والامراض اللى ملهاش اول من اخر)كل ده من ذنوبنا..الاغانى هيا اللى بقت بتريح الاعصاب ..انا لله وانا اليه راجعون ..امال القرآن راح فين..<br />ربنا يهديكم يا عشرينياتيه ...المفروض ان الموقع ده اسلامى ...واللى بيحصل ده هيخلى مستواه فى النازل ..ياريت تكون المواضيع هادفه ومفيهاش حاجه محرمه<br />سلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115931/http://www.20at.com/article2.php?sid=694"

