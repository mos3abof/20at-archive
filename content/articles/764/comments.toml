[[comments]]
order = 16
subject = "هي الحاله ايه اشتغلت ؟"
author = "هبابه او هوبه او هبهوب"
posted = "2006-04-14"
text = "حشتغل محامحي المره دي ليكو وعليكو<br />اولا يا بشاوات عشان تبردوها شويه كنتو حطيتوه حته انشوده في النص كدا لحفظ ماء الوجه , وفي ناس بتحب تسمع اناشيد وكنت عايزه انشوده \" صباره \"<br />يلا بقي انا زعلانه , حاجه تانيه انا بسمع اصاله وفيروز والعالم دي كلها وبردو باك ستريت بويز , و50 سنت , وابو راتب وموسي مصطفي , وهاني شاكر ,ويا سلام علي المزاج بقي ساعات الكابه<br />شغل امايه يا امه لحنان ماضي وافتح علي العياط<br />وللبنات اللي في المدينه الجاميعه يعني متغربين , باختلاف مكان المدينه الجماعيه . انصحهم بالاغاني اللي دكرت فوق دي لزياده الاحباط ,<br />وللغم منه فيه يعني علي راي اختي اسمعو انا علي الجراح قادر , بت نحس صحيح الواحد بيبقي في حاله ودي<br />علي الجراح والمكركروم<br />واغنيتي المفضله \" عصفور طل من الشباك لعايده الايوبي \"<br />والاناشيد كل اناشيد ميس شلش , وابو خاطر , يحي حوا , وبردو دخلك يا طير الوروار وسنرجع خبرني العندليب ,العندليب الاسمر حلو بردو مش هو اللي غني ومنين نجيب الصبر يا طه ؟ حلو بردو يلا بقي .واللي عايز يضيف في برنامج يا حزب اهبل اسمه اختارنا لكم ابقو اكتبو فيه اللي انتو عايزينه ...<br />وسلام يا بشششششششششر."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115931/http://www.20at.com/article2.php?sid=694"

[[comments]]
order = 17
subject = "واحده واحده"
author = "عبدالله مفتاح"
posted = "2006-04-14"
text = "اولا :رجاء اللي يكتب تعليق يكتب اسمه عشان نعرف نرد عليه<br />ثانيا:المعلومه اللي بتقول ان الموسيقى المثيرة للغرائز بس هي اللي حرام دي معلومه مش صحيحه<br />لان الموسيقى اللي تخرج الانسان عن وقاره يعني بالبلدي وسطه يتهز لوحده قيل انها حرام<br />ثالثا:في واحد زعلان اننا قلنا على الموقع اسلامي. والحقيقه ان مش احنا اللي قلنا ده اتجاه الموقع كله هو اللي بيقول<br />وبعدين باسم الله ماشاء الله المشرفين على الموقع شباب نحسبهم على خير<br />رابعا: في بعض الاشخاص فكرهم قاصر جدا وبيظهر هذا القصور في ان اي حد يتكلم في الدين يبقا اخوان يعني هما اللي خلو الاخوان ناطقين باسم الاسلام وفي الاخر يرجعوا يقولو الاسلام لا يتمثل في جماعه.<br />خامسا: الدال على الخير كفاعله ومش معنى اني بسمع اغاني اني اساعد على سماعها يكفي ما اتحمله من اثم واظن انه محدش عايز يشيل اثم على آثامه<br />سادسا: عيب بقا كل اللي ينادي بفضيله نقول عليه معقد<br />عيب جدا بقا بطلوا تقولو على اللي عايزين الخير معقدين<br />سابعا: لما احنا بننقد حاجه في الموقع بنكون عايزين الخير للموقع مش بنكون عايزين نسيطر عليه<br />ربنا يهدي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115931/http://www.20at.com/article2.php?sid=694"

[[comments]]
order = 18
subject = "نسمع الكاسيت ولا نقفله؟؟؟"
author = "vanilla"
posted = "2006-04-15"
text = "لم أصدق كل هذا الكم الغريب من التعليقات والمجادلات على موضوع سبق وتم نقاشه مليون مرة في كل الموضوعات المتعلقة بالموسيقى والأغاني على المواقع والجرائد والكتب وشاشات التلفزيون، هل الموسيقى حرام؟ هل الغناء والعزف على الآلات حرام؟؟؟<br />إحنا ليه ماسكين في صغائر الأمور دي، يا جماعة أنا شايفة إن القضية دي تحديداً فيها إختلاف فقهي وفيها كذا رأي والإختلاف في الرأي رحمة، فكل واحد ياخد الفتوى اللي شايف إنها صح وميهاجمش الباقيين ويغلطهم وساعات يكفرهم وبعدين يقعد يدعي لهم بالهدايا كأنهم ضلوا...<br />الأغاني الأغاني الأغاني.... ده اللي هاممنا بنمسك في فسافس وصغائر الأمور ونسيب أعظمها زي اللي بيحصل في العراق وفلسطين وقضايا الزواج والبطالة وأزمة الدانمارك وأنفلونزا الطيور وإحنا لسة بنتكلم الأغاني حرام ولا حلال.... في حاجة اسمها (الحلال بين... والحرام بين).<br />سيبوا اللي يسمع يسمع... وأعتقد الأغاني حتى ولو كانت عن الحب ومحطوطة في إطارها السليم أكيد تبقى حلال... لو واحد يا جماعة نفسه يهدي لزوجته أغنية عاطفية تعبر عن حبه وتقربها ليه... فيها إيه دي... والعكس طبعاً؟؟؟<br />النية في السماع دي أهم حاجة، لوكان بنية اللهو عن ذكر الله وإثارة الغرائز فمحدش حيختلف على حرمانيتها...<br />وبعدين الناس اللي بتقارن سماع القرآن الكريم بسماع الأغاني وبتقول إن سماع القرآن الكريم أفضل وأحسن... هما بيقارنوا إيه بإيه أساساً... يا جماعة اتقوا الله القرآن الكريم ده كلام الله مش كلام بشر يعني مافيش وجه مقارنة أساساً... ومين قالكوا إن اللي بيسمع أغاني أو موسيقى بيرتقي بها عقله وتفكيره وكتير فعلاً بتهدي أعصابه ما بيسمعش القرآن الكريم دايماً ومواظب على سماعه وقراءته وحفظه...<br />أما بالنسبة للقائمين على الموقع فأنا بقول إن الإختلاف في الموضوعات ده شيء جيد... ومش لازم اللي يعجبك يعجب غيرك... ولو كان الأستاذ أحمد زين موجود كان الموضوع برضه حينزل لأني متأكدة إنه شخص مؤمن بمبدأ الإختلاف مادام لا يوجد أي نوع من الهيافة والإسفاف.<br />وبعدين إحنا بنتكلم عن السماع وليس رؤية الكليبات والعري والقرف... بنتكلم على اللي بيسمعوا مش بيشوفوا قلة الأدب بطلوا خلط الأمووووور.<br />وفي النهاية انا حسيب اللينك ده يرد عليكم وده كان اتنشر في عشرينات قبل كده اسمه نسمع الكاسيت ولا نقفله<br />وسلام<br />http://www.20at.com/article.php?sid=866"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115931/http://www.20at.com/article2.php?sid=694"

