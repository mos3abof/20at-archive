subject = "مازلت لا أصدق!"
author = "Vanilla"
posted = "2006-04-15"
text = "مازلت لا أصدق كل هذا الكم الغريب من التعليقات والمجادلات على موضوع سبق وتم نقاشه مليون مرة في كل الموضوعات المتعلقة بالموسيقى والأغاني على المواقع والجرائد والكتب وشاشات التلفزيون، هل الموسيقى حرام؟ هل الغناء والعزف على الآلات حرام؟؟؟<br />إحنا ليه ماسكين في صغائر الأمور دي، يا جماعة أنا شايفة إن القضية دي تحديداً فيها إختلاف فقهي وفيها كذا رأي والإختلاف في الرأي رحمة، فكل واحد ياخد الفتوى اللي شايف إنها صح وميهاجمش الباقيين ويغلطهم وساعات يكفرهم وبعدين يقعد يدعي لهم بالهدايا كأنهم ضلوا...<br />الأغاني الأغاني الأغاني.... ده اللي هاممنا بنمسك في فسافس وصغائر الأمور ونسيب أعظمها زي اللي بيحصل في العراق وفلسطين وقضايا الزواج والبطالة وأزمة الدانمارك وأنفلونزا الطيور وإحنا لسة بنتكلم الأغاني حرام ولا حلال.... في حاجة اسمها (الحلال بين... والحرام بين).<br />سيبوا اللي يسمع يسمع... وأعتقد الأغاني حتى ولو كانت عن الحب ومحطوطة في إطارها السليم أكيد تبقى حلال... لو واحد يا جماعة نفسه يهدي لزوجته أغنية عاطفية تعبر عن حبه وتقربها ليه... فيها إيه دي... والعكس طبعاً؟؟؟<br />النية في السماع دي أهم حاجة، لوكان بنية اللهو عن ذكر الله وإثارة الغرائز فمحدش حيختلف على حرمانيتها...<br />وبعدين الناس اللي بتقارن سماع القرآن الكريم بسماع الأغاني وبتقول إن سماع القرآن الكريم أفضل وأحسن... هما بيقارنوا إيه بإيه أساساً... يا جماعة اتقوا الله القرآن الكريم ده كلام الله مش كلام بشر يعني مافيش وجه مقارنة أساساً... ومين قالكوا إن اللي بيسمع أغاني أو موسيقى بيرتقي بها عقله وتفكيره وكتير فعلاً بتهدي أعصابه ما بيسمعش القرآن الكريم دايماً ومواظب على سماعه وقراءته وحفظه...<br />أما بالنسبة للقائمين على الموقع فأنا بقول إن الإختلاف في الموضوعات ده شيء جيد... ومش لازم اللي يعجبك يعجب غيرك... ولو كان الأستاذ أحمد زين موجود كان الموضوع برضه حينزل لأني متأكدة إنه شخص مؤمن بمبدأ الإختلاف مادام لا يوجد أي نوع من الهيافة والإسفاف.<br />وبعدين إحنا بنتكلم عن السماع وليس رؤية الكليبات والعري والقرف... بنتكلم على اللي بيسمعوا مش بيشوفوا قلة الأدب بطلوا خلط الأمووووور.<br />وفي النهاية انا حسيب اللينك ده يرد عليكم وده كان اتنشر في عشرينات قبل كده اسمه نسمع الكاسيت ولا نقفله<br />وسلام<br />http://www.20at.com/article.php?sid=866<br />أرجوكم كفاكم هجوماً على الآخرين وشتمهم وتكفيرهم فربما يكونون أفضل عند الله وتأخذوا ذنوبهم وأوزارهم.<br />وبالنسبة للأخ المناضل القديم أرجو أن يقرأ كل التفسيرات التي وردت في هذا الشأن لأن ما ذكره هو رأي واحد فقط لم يتم ذكر من أفتى به.<br />فهذا الموضوع وكما قلت له عدة فتاوى وأراء وإختلافات...<br />وبالمناسبة أنا أيضاً أستمع إلى الموسيقى الكلاسيكية ولكني أحترم ديني الإسلامي الذي علمني أن في الإختلاف رحمة وعلمني أن أقرأ وأستمع إلى قرآني قبل سماع أي شيء ولا أفعل ما يلهيني عن ذكر الله...<br />اتقوا الله بقى وافعلوا شيئاً ينفع أمة محمد."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115931/http://www.20at.com/article2.php?sid=694"

