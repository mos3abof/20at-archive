text = "مرحبا يا شباب وصبايا انا مش موافقة انو الاغاني حرام انا بعرف انو الاغاني الصاغبة هيه الي حرام اما الاغاني الرومنسية مش حرام انا هيك بعرف بعدين هوه كلام الشباب الي بيقولو ان القران هوه الي بريح الاعصاب وبيهدي القلوب صحيح بس برضو كتر الخنقة بالدين بيخرب الدنيا فعلى شان هيك الواحد يقرا القران ويفهمو ويستمع للاغاني بس مش تكون اهم من القران وياريت اكون افدة حد وكان كلامي مش تقيل وفلسفة"
