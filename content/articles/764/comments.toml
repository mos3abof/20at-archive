text = "المعقدين اللى فوق دول ياسيدى اللى مسيطرين على الموقع ودول اعتقد من الاخوان المسلمين وزى ماالحالة اتغيرت ودلوقت الاخوان المسلمين مسيطرين بالعافية على بعض وسائل الاعلام دول كمان مسيطرين على الموقع وعلى فكرة مش حيعطوك فرصة تقول رائيك لانهم جاهزين<br />جاتهم القرف"
