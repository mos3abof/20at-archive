[[comments]]
order = 31
subject = "انت اللي عايز"
author = "عبدالله مفتاح"
posted = "2006-04-17"
text = "بص يا سيدي انت قريت تعليقي بقلك انا مقلتش ان الموسيقى حرام تقلي هات الدليل؟<br />بقلك انا مقلتش حرام اجبلك دليل على ايه؟<br />وعلى العموم انت اللي عايز<br />هقلك راي بعض العلماء اللي حرمواالموسيقى.<br />لازم تكون فاهم ان مينفعش تقول هات دليل من القران بس<br />لانك كده سبت السنه<br />لا زم تقول هات دليل من القران او السنه<br />واللي حرموا الموسيقى دي ادلتهم من القران والسنه<br />قوله تعالى‏:‏ ‏{‏وَمِنَ النَّاسِ مَن يَشْتَرِي لَهْوَ الْحَدِيثِ لِيُضِلَّ عَن سَبِيلِ اللَّهِ‏.‏‏.‏‏.‏‏}‏ ‏[‏سورة لقمان‏:‏ آية 6‏]‏ الآية؛ فقد فسر لهو الحديث بأنه الغناء أكابر الصحابة، ومنهم عبد الله بن مسعود رضي الله عنه.‏<br />وفي ‏‏صحيح البخاري‏‏ عن قوم في آخر الزمان يستحلون الحر والحرير والخمر والمعازف.‏<br />والراي اللي حلل الاغاني موجود فعلا بس مخالف لاجماع الائمة الاربعه<br />ومع كل ده لو بصيت في تعليقاتي مش هتلاقيني قلت ان الموسيقى حرام لاني مش مفتي<br />كل اللي اعترضت عليه الاغاني اللي فيها كلام بيوصف حاجه حرام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115931/http://www.20at.com/article2.php?sid=694"

[[comments]]
order = 32
subject = "انا مع من يقول الحق"
author = "احمد المصرى"
posted = "2006-04-23"
text = "السلام عليكم )فى الاول وبعد من يعادى الاخوان هم الاخوان مالهم ومال داه ثانيا انت شاكلك دمقراطى من الحزب يعنى ثالثا الموقع يعطى الحريه للجميع رابعا انتم بقى دلوقتى داخلتم الموضيع كلها فى باعضها تدخلم على السياسه تدخلو الدين تدخلو على الدين تدخلو السياسه تدخلوعلى الاغانى تدخلم الدين تدخلم على الثقافه تدخلواشياء اوخرى بعيده عن ماتتكلم عنه انتم اصبحتم كامن دخل دائره من فتحا لها ولما دخلها اتى الاخر وغلقها وقال له مبتسما هيا ارينى كيف ستخرج فيظل باحثا عن مخرج له ناسيا ما دخل من اجله الرجاء منكم ياساده اعطو لكل شىء حقه هاؤلاء ناس يتكلمون عن الاغانى وانتم ناس تتكلمون عن الدين وانا من ناس تتكلم فى السياسه وهذا انسان يتكلم اشياء اوخرى فادعو كل من يتكلم يتكلم وما عليك الى ان تتعلم منهم الصح والخطاء تحاول الابتعاد عنه حاول ان تكون مستفيد من الشء حاول ان تكتسب اكثر من معلوماتهم واجعل كل طرف فى عمله انتم عارفين ايه المشكله الاساسيه فى مصر كلها اننا بنعرف فى كل حاجه وبنفهم فى كل حاجه وفى الاخر نلتقى نفسنا مش فاهمين اى حاجه يناس كل واحد يحاول يعمل الصح الاول اانا بحب اسمع اغانى وانت بتحب تسمع القرءان الكريم ماشى داه له مكانه وداه له مكانه ايه بقى سر الانتقادات دى اتكلمو عن كل شىء فى مكانه انت بتحب الدين انتقد الاغانى لاكن فى المكان الى يصلح له وياريت تكونو موافقنى فى ذلك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115931/http://www.20at.com/article2.php?sid=694"

[[comments]]
order = 33
subject = "الموضوع كان أبسط من كده"
author = "Apple"
posted = "2006-05-04"
text = "بجد والله الموضوع أبسط من كده بكتير.<br />لغاية امتى الشباب العربي المسلم حيمسك في الهيافات والهبل، لسة بتتكلموا ومحموقين أوي الأغاني حرام ولا حلال...؟؟؟!!!<br />يا عالم الغرب والدول المتقدمة حتدوس علينا بعد كده بسبب عقول خاوية زي بتاعتنا دي...<br />والله كل واحد عنده رأي كويس يقوله وما يشتمش وميجرحش في الناس التانية...<br />يعني هو لما واحد يكون بيحب يسمع الموسيقى الكلاسيك ويجي واحد يقوله يا أخي المعارزف حرام اتقي الله... خلاص حيبطلها...<br />ما تسيبه يسمع اللي يسمعه إنت عليك النصية وخلاص وفي الآخر ده رأيك مش حتفرضه بالغصب على الخلق...<br />والأهم من كده كفاية بقى يا شباب أسلوبكم في الدعوة بجد منفر موووووووت، الواحد لازم يختار أسلوبه لأنكم حتتحاسبوا على ده يوم القيامة، ده لو واحد لسة ملتزم جديد وإنت كرهته في حياته بالمنظر وصعبت له الأمور (لحسن عكس كده يبقى تهاون) حتكرهه في الدين يا أخي...<br />يا شباب مفيش أفضل من الوسطية.<br />وبعدين المكوقع لا هو إسلامي ولا سلفي ولا مودرن ولا ناصري ولا شيوعي ولا يندرج تحت أي بند...<br />وأنا مش شايفاه غير إنه موقع ملتزم للشباب العربيييييييييييييييييييييييي.<br />وفوقوا الله يهديكوا... مش الأغاني اللي حنقعد نتكلم ونجادل فيها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115931/http://www.20at.com/article2.php?sid=694"

