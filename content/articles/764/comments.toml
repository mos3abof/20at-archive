[[comments]]
order = 28
subject = "الله يسامحك"
author = "عبدالله مفتاح"
posted = "2006-04-16"
text = "اولا: يا ريت اللي يبعت يعلق على تعليقي يبقا يكتب اسمه عشان اعرف ارد<br />ثانيا :الله يسامحك على انك قلتلي متخلف وجتك القرف<br />ثالثا: فين قولي باني قلت ان الموسيقى حرام راجع كل تعليقاتي مفيهاش اني قلت الموسيقى حرام<br />رابعا: يا ريت الاسلوب يكون ارقى من كده<br />خامسا: متقلش هاتلي دليل من القران<br />قول هات دليل من القران او السنه والكلام ده في اي موضوع مقصدش الموضوع ده تحديدا<br />سادسا: الله يسامحك كمان مرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115931/http://www.20at.com/article2.php?sid=694"

