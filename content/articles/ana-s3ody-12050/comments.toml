[[comments]]
order = 3
subject = ""
author = "مغتربة مصرية"
posted = "2009-05-14"
text = "متى ينتهى هذا النظام الظالم بكل المقايسس ولماذا هذا التباطىء الشديد ومشاكل الكفلاء مع المكفولين لا حصر لها وهناك اسر باكملها تعيش فى حاله من القهر النفسى وعدم الاستقرار فى المعيشه من اضرار معامله الكفيل وها انا فى المملكه عانيت الكثير مع زوجى من هذا الامر وحياتنا ما هى الا سلسله من المشاكل مع الكفيل حسبى الله ونعم الوكيل كيف وهى بلد الاسلم والمسلمين يطبق فيها هذا النظام الظالم واقسم بالله اذا قامو كل العاملين فى المملكه من الاجانب وثارو وكان كاقلب رجل واحد لين تجد من يعمل فى المملكه غير الوافدين ولم تنهض المملكه يوما الا بنا وحسبى الله ونعم الوكيل"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519200914/http://www.20at.com:80/ana-s3ody/12050-2009-05-12-11-59-24.html"

[[comments]]
order = 4
subject = ""
author = "الصبر"
posted = "2009-05-25"
text = "نظام الكفاله من المفترض ان يكون نظام تشريعي وعادل وليس نظام الطرف الواحد الذي هو الكفيل انا اعلم ان الكفالة تكون في اجرآت احترازية وفي امور قانونية<br />ولكن المصيبة في نظام الكفالة انه يساوي بين من ولد في البلد وتربى بها واخذ طباع اهلها مثل الفلسطينيين وبين من ياتي اليوم بتأشيرة<br />فهذا ظلم كبير<br />هنا لا بد ان نميز بين المقيم الدائم والمقيم المؤقت اذا كان لا بد ان يستمر هذا النظام"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530002141/http://www.20at.com:80/ana-s3ody/12050-2009-05-12-11-59-24.html"

[[comments]]
order = 5
subject = ""
author = "فيصل محمد"
posted = "2009-05-25"
text = "Quoting مغتربة مصرية:<br />متى ينتهى هذا النظام الظالم بكل المقايسس ولماذا هذا التباطىء الشديد ومشاكل الكفلاء مع المكفولين لا حصر لها وهناك اسر باكملها تعيش فى حاله من القهر النفسى وعدم الاستقرار فى المعيشه من اضرار معامله الكفيل وها انا فى المملكه عانيت الكثير مع زوجى من هذا الامر وحياتنا ما هى الا سلسله من المشاكل مع الكفيل حسبى الله ونعم الوكيل كيف وهى بلد الاسلم والمسلمين يطبق فيها هذا النظام الظالم واقسم بالله اذا قامو كل العاملين فى المملكه من الاجانب وثارو وكان كاقلب رجل واحد لين تجد من يعمل فى المملكه غير الوافدين ولم تنهض المملكه يوما الا بنا وحسبى الله ونعم الوكيل<br />واعتقد يااخت مغتربه مصريه .. انكم تاخذون فلوس على الشغل<br />واذا على قولتك انكم شايلين العمل بالسعوديه وان السعوديه قامه عليكم .. ليه ماتروحون لبلادكم وتعزونه… الجواب لان الفلوس هنا متواجده وبشراهه ..نعم انا لست مع الظلم والحجر على الشخص وقطع رزقه ولكن ايضا لاابخص حق السعوديه بانها تستقبل وتوظف جميع شرائح العالم والمسكين المواطن السعوديه كالعاده يتخرج ويصير عاطل مع مرتبة الشرف يسلمو يامغتربه"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530002141/http://www.20at.com:80/ana-s3ody/12050-2009-05-12-11-59-24.html"

[[comments]]
order = 6
subject = ""
author = "عبود"
posted = "2009-05-26"
text = "أنا مثل واقعي وضحية لنظام الكفالة. ولدت في السعودية قبل 30 عاماً. ولم أخرج منها ولم أشم هواء غير هوائها طيلة هذه المدة.<br />لساني سعودي، طباعي، لبسي، أخلاقي، أصحابي وأصدقائي، تعاملي، تفكيري، لم أجد يوماً سعوديًّا يتعرف على جنسيتي قبل أن أخبره أنا بأني \"أجنبي\" أو كما يسمونه في السعودية الآن \"أرنب\"<br />نحن المواليد في السعودية نساهم في تنمية البلد فأنا عملت في تدريس السعوديين لسنوات.. وعملت في تدريب الشباب السعودي في دورات وزارة العمل لتهيئة الشباب لسوق العمل.. ساهمت في تحسين صورة السعودية بالمشاركة في كثير من المسابقات \"فأنا سعودي بلا جنسية\" وحققت فيها مراكز مشرفة..<br />بسبب نظام الكفالة.. أجبرت على نقل كفالتي عن والدي بعد انتهاء الدراسة.. والبحث عن كفيل.. بمعنى آخر.. أصبح كالسائق أو الخادمة القادم اليوم للسعودية وأضع مصير إقامتي في البلد التي لم أعرف غيرها في يد \"كفيل\" جديد لا أعرفه ولا يعرفني وقد \"يسفرني\" وقت ما يشاء أو يهددني بذلك دون أن يكون لي الحق في الاعتراض.."
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530002141/http://www.20at.com:80/ana-s3ody/12050-2009-05-12-11-59-24.html"

