posted = "2009-05-12"
text = "لم يستطع السعوديون للان التخلص من حب امتلاك العبيد والاحساس اللذيذ بالتحكم في خلق الله لذالك يوهمون انفسهم بان الكفيل يضمن لهم الامساك بالموظف من رقبته ليضمنوا حقوقهم بما يعني انهم الاذكياء الوحيدون في العالم"
