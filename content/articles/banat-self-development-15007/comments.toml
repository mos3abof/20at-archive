text = "السلام عليكم<br />بس انا معترضة على حاجة اسمها الانطباع الاول طبعا حسب علم النفس لايعطى التفسير الصحيح للشخصية اللى بتعامل معها تانى حاجة مش لازم اتسرع خاصة لو ماكنش عندى الفراسة انى اعرف الاخر من لبسه او مظهره وطريقة كلامه طبعا انا مش بدعو للاهمال فى المظهر او اى حاجة وحشة بس ادعو ان احنا نتعامل مع الشخص اكتر من مرة وبعدين نحكم عليه ونحلل شخصيتة فعشان كده انا لا اعترف بالانطباع الاول لانه فى بعض الاحيان بيكون خاطى وانا مش تكلم من فراغ بل تجربة عشتها بنفسى"
