subject = "haraaam"
author = "كريم"
posted = "2006-04-24"
text = "مرحبا بالارهاب<br />مرحبا بمصر الارهابية<br />واللة ماعنكم دم يالمصريين ياقتلة الابرياء<br />شو بكم ؟؟؟<br />واللة حرام عليكم ايها القتلة الارهابيين<br />ايها الاخوان القتلة<br />اللة القادر على الانتقام منكم اولا لان دم اولءك القتلة برقابكم ليوم الدين<br />وماتعلقوها على اسراثيل متل النعام عندما تدفن راسها بالرمال<br />انتم السبب انتم وحكوماتكم<br />ويقودكم الارهابى مبارك<br />مصر بلد الارهاب وليس الامان<br />ومرحبا بعودة مصر الارهابية مرحبا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123905/http://www.20at.com/article2.php?sid=728"

