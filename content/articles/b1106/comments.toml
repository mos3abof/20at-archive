subject = "رد على عصبي ولساني وسخ"
author = "سمير"
posted = "2006-09-07"
text = "أخي<br />اعلم أن الوهابية ليست بمدهب و حاول أن تطلع على حياة الامام عبد الوهاب لتفهم بعض الأمور التي شوهت من طرف بعض الجهال.<br />و ان كنت من أتباع القرضاوي و مقتنع بما قاله فلا تبالي بما قاله الاخرون و لا يسعك الا الدهاب الى الجهاد تحت راية خزب لا ندري ان كان لله.<br />و لا تنسى التعمق في معاني الأية - وأعد لهم ما استطعتم من قوة- و أول اعداد أخي يكون بالعودة الى الله<br />شعوب تفشت فيها الشرك و الربا و الزنا و القدف و السحر و اللهو و تريد الجهاد في سبيل الله محتار و الله<br />اللهم ارزقنا الحق"
