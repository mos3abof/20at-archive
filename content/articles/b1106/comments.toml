subject = "دعم حزب الات الشيعي"
author = "ابوعمر"
posted = "2006-10-15"
text = "الكل بعرف ان حزب الله (الات)الشيعي صنيعة ايرانية لدرجة ان ايران تتكلم باسمة السؤال لماذ لم تتدخل ايران بجشها وكذلك سوريا بالصرحا علنا بانهم لان يتخلا عسكريا والمعروف بالنة الحزب قد اشعل الحر بالنيابة عن ايران وسوريا فاين جيشهما لدعمة العرب والمسلمين في كل مرة يدفعون الملاين لدعم لبنان فاين ايران وسوريا من ذلك؟"
