subject = "تكملة المصادر لموضوع كشف حقيقة القرضاوي"
author = "عندليب"
posted = "2006-08-30"
text = "[1] برنامج الشريعة والحياة حلقة بعنوان غير المسلمين في ظل الشريعة الإسلامية تاريخ 12/10/97 في قناة الجزيرة عافانا الله منها، وتقريره أن الكفار إخوة له في كثير من كتبه منها (فتاوى معاصرة)2/668، (الخصائص العامة للإسلام)90-92،(ملامح المجتمع المسلم)138، وقررها في كثير من برامجه التي تظهر في القنوات الفضائحية ، وإبعادا للشبهة فإن ما أنقله عنه مما ورد في برامجه في القنوات لم أرها –والعياذ بالله- وإنما نقلتها مما هو مطبوع منها وموجود في موقعه على شبكة الإنترنت.<br />[2] (غير المسلمين في المجتمع الإسلامي) ص 68، -ط4-1405، وقرر هذه المسألة في البرنامج السابق وفي عدد من كتبه الأخرى.<br />[3] (الأمة الإسلامية حقيقة لا وهم) ص 70-ط1-1407 ، وقرر هذا أيضا ف برنامج الصراع بين المسلمين واليهود الآتي.<br />[4] برنامج الشريعة والحياة حلقة بعنوان الصراع بين المسلمين واليهود بتاريخ 7/12/97.<br />[5] حلقة بعنوان غير المسلمين في ظل الشريعة الإسلامية في برنامج الشريعة والحياة مثلا .<br />[6] حلقة الإسلام دين البشائر والمبشرات من برنامج الشريعة والحياة بتاريخ 24/1/99م.<br />[7] الإسلام والعلمانية 101، (شريعة الإسلام خلودها وصلاحها للتطبيق) 52، وذكر هذا في عدد من برامجه في القنوات.<br />[8] ذكره في مواضع منها (الحلال والحرام) و (غير المسلمين في المجتمع الإسلامي) و غيرها من الكتب ، وذكرها في برنامج الشريعة والحياة في حلقة غير المسلمين في ظل الشريعة الإسلامية و حلقة الصراع بين المسلمين واليهود وغيرها .<br />[9] (فتاوى معاصرة) 2/671، (الصحوة الإسلامية بين الاختلاف المشروع والتفرق المذموم)147.<br />[10] برنامج المنتدى حلقة بعنوان مستقبل الأمة بين التفاؤل والتشاؤم بتاريخ 7/3/98 في قناة أبوظبي عافانا الله وإخواننا المسلمين منها، وبرنامج الشريعة والحياة حلقة بعنوان غير المسلمين في ظل الشريعة الإسلامية .<br />[11] برنامج الشريعة والحياة حلقة بعنوان العلاقات الدولية بتاريخ 8/3/98.<br />[12] برنامج الشريعة والحياة حلقة غير المسلمين في ظل الشريعة الإسلامية ، وحلقة فضل العشر الأواخر من رمضان بتاريخ26/12/99م،وكتاب (فتاوى معاصرة) 2/617.<br />[13] برنامج الشريعة والحياة حلقة غير المسلمين في ظل الشريعة الإسلامية ، (غير المسلمين في المجتمع الإسلامي) ص 22.<br />[14] حلقة غير المسلمين في ظل الشريعة الإسلامية من برنامج الشريعة والحياة ، وكتاب غير المسلمين في المجتمع الإسلامي 55.<br />[15] هذا مذكور في مقال بعنوان (زيارة القرضاوي لإيران) وهو موجود في موقعه على شبكة الإنترنت ،وانظر (المرجعية العليا للإسلام)ص 14، وحلقة مستقبل الأمة بين التفاؤل والتشاؤم في برنامج الشريعة والحياة ، وكتاب (الغزالي كما عرفته)242.<br />[16] حلقة الإسلام وشبكة الإنترنت من برنامج الشريعة والحياة بتاريخ 28/6/98م .<br />[17] قرر هذا في عامة كتبه إذا تعرض لأهل السنة والجماعة ، انظر مثلا (المرجعية العليا) ص 320،352، (السنة مصدرا للمعرفة والحضارة) 95.<br />[18] (كيف نتعامل مع السنة النبوية) ص 97، وهذا الكتاب ألفه مساندا لكتاب رفيقه الهالك الغزالي المسمى (السنة النبوية بين أهل الفقه وأهل الحديث) حيث إن الغزالي ألف ذلك الكتاب استجابة لطلب (معهد الفكر الإسلامي) لصاحبه المعتزلي الخبيث طه جابر علواني من أجل محاربة السنة النبوية ، قال العلواني في مقدمة كتاب القرضاوي ص9(وحين رأى المعهد الغبش الذي أحاط برسالة كتاب الشيخ الغزالي وشغل معظم الأذهان عن رسالته الأساسية وشكلياته توجه برجائه إلى صاحب الفضيلة الأستاذ الجليل الدكتور يوسف القرضاوي حفظه الله تعالى ونفع به ليعد كتابا ضافيا في مناهج فهم السنة(الصواب: رد السنة)).<br />[19] نفسه ص 162.<br />[20] برنامج في قناة art ، بتاريخ 4/7/1418، وهو ندوة عقدت للقرضاوي مع جمع من المتبرجات ليحاكم لهم النصوص النبوية، وقد رد عليه عبد الرحمن عبد الخالق في (ردود ومناقشات حول تولي المرأة الولايات العامة) .<br />[21] قاله في نفس الندوة .<br />[22] (الشيخ الغزالي كما عرفته) ص 168.<br />[23] ذكر هذا في كثير من كتبه وندواته وبرامجه ، ومن ذلك : (أولويات الحركة الإسلامية)ص 67،(ملامح المجتمع المسلم)ص3، (مركز المرأة) ص 41،130، والبرامج الآتية أيضا.<br />[24] حلقة تحديات المرأة المسلمة في الغرب من برنامج الشريعة والحياة 28/9/97م.<br />[25] حلقة الفضائيات في برنامج الشريعة والحياة بتاريخ 13/6/99م.<br />[26] مجلة المجتمع عدد رقم 1319 بتاريخ 9/6/1419.<br />[27] أخبارالأسبوع ، عدد 401 ، السبت 5 مارس ( 3 ) 1994 م ، مجلة سيدتهم ! العدد 678 ، 5 – 11 / 3 / 1994 .<br />[28] في عامة كتبه وبرامجه ككتاب الحلال والحرام ، والمرجعية العليا ، وفتاوى معاصرة ،وحلقة أخلاقيات المسلم من برنامج الشريعة والحياة بتاريخ 14/6/99، وفي حلقة مفتوحة لأسئلة المشاهدين بتاريخ 12/4/98م.<br />[29] ذكره في الحلال والحرام أيضا .<br />[30] في حلقة مفتوحة لأسئلة المشاهدين من برنامج الشريعة والحياة بتاريخ 12/4/98م .<br />[31] فتوى له موجودة في موقع (الإسلام على الإنترنت) في (الإنترنت) ، والموقع تحت إشرافه، وفيه من الطوام والعظائم أمور منها الدلالة على جميع القنوات الفضائحية في العالم حتى (الفاتيكان) ، وركن التعارف (حتى بين الجنسين)، وخدمة الزواج (حتى بين الكفار)، وركن الثقافة والفن وفيه الحديث عن الأفلام والمسرحيات والفضائيات، وفيه صور للنساء المتبرجات (ليس السافرات فقط)، وفيه تبجيل العقلانيين كالجاحظ وعمارة والعوا، وتلميع رؤوس الطواغيت كالسنهوري (الذي دون ثمانية دساتير عربية)، إلى غير ذلك من الموبقات، وهو يقول بأنه يريد أن يجعل هذا الموقع دار فتوى عالمية !!!!.<br />[32] جريدة الراية القطرية ، عدد 5969 ، تاريخ : 19 جمادى الأولى 1419.<br />[33] جريدة الراية القطرية ، عدد 5969 ، تاريخ : 19 جمادى الأولى 1419، و مجلة سيدتهم عدد678،5-11/3/94م، وأخبار الأسبوع عدد401 ، 23 رمضان 1414.<br />[34] حلقة الفضائيات من برنامج الشريعة والحياة بتاريخ 13/6/99م .<br />[35] حاشيته على فتاوى (مصطفى الزرقا) ص 394، وحلقة السنة النبوية مصدر للتشريع بتاريخ10 /5/98 من برنامج الشريعة والحياة ، وهذا خلاف النصوص القاطعة، وخلاف الإجماع المتواتر الذي اعترف هو به.<br />[36] برنامج (المنتدى) في قناة أبي ظبي حلقة بعنوان (شروط الفتوى) في 10/1/98 ، وأشار إلى هذا في (الخصائص العامة للإسلام) 240 ، وهذا خلاف الإجماع الذي نقله العلماء كابن المنذر وابن عبد البر وابن قدامة وشيخ الإسلام وابن رشد وغيرهم.<br />[37] سبق ذكره في القرضاوي والمرأة ، وهو خلاف الإجماع الذي نص عليه عدد من الأئمة، والذي عليه عمل المسلمين المتواتر عمليا.<br />[38] وهذه من طوامه وموبقاته ، حيث نقل هذا الكلام - مستشهدا به - من شلتوت للرد على شبهة تنقص المرأة وذلك في كتابه (مركز المرأة) ص 20.<br />[39] ذكره في كتابه الحلال والحرام ص91، وفي كتابه المرجعية العليا 243، وفي مدخل لدراسة الشريعة الإسلامية ص85، وفي حلقة السنة مصدر للتشريع من برنامج الشريعة والحياة ، وفي حلقة الزواج من غير المسلمات من برنامج المنتدى، وهو خلاف الإجماع الذي نقله ابن حزم وابن مفلح وابن عابدين وغيرهم.<br />[40] حلقة شروط الفتوى من برنامج المنتدى بتاريخ 10/1/98م، وحلقة مفتوحة لأسئلة المشاهدين من برنامج الشريعة والحياة بتاريخ 12/4/98م، وهذا خلاف الإجماعات القاطعة التي ذكرها الأئمة كابن حزم وابن المنذر وابن قدامة وغيرهم، وبعض طلبة العلم يخلط بين ربا البيوع (الذي وردت فيه الأصناف الستة) وبين ربا القروض المجمع عليه، فإن الربا الأول هو الذي وقع الخلاف فيه وفي تعليل الأصناف الستة وهل تعدى إلى غيرها أو لا ؟ ، أما ربا القروض – وهو المعمول به في البنوك- فلا يجوز قطعا بالإجماع الذي نقله غير واحد في جميع الأصناف وممن نقله ابن حزم في المحلى وغيره."
