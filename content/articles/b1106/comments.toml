text = "كشف الشخصيات : يوسف القرضاوي<br />الحمد لله والصلاة والسلام على رسول الله وبعد:<br />فإن مما ابتليت به الأمة في هذه الأزمان ظهور أقوام لبسوا رداء العلم مسخوا الشريعة باسم التجديد، ويسروا أسباب الفساد باسم فقه التيسير،وفتحوا أبواب الرذيلة باسم الاجتهاد، وهونوا من السنن باسم فقه الأولويات، ووالوا الكفار باسم تحسين صورة الإسلام ، وعلى رأس هؤلاء مفتي الفضائيات (يوسف القرضاوي) حيث عمل على نشر هذا الفكر عبر الفضائيات وشبكة الإنترنت والمؤتمرات والدروس والكتب والمحاضرات وغيرها، وهذه الأوراق فيها خلاصة لبعض فكر هذا الرجل الذي يروج له، أظهرتها نصحا للأمة وبراءة للذمة وتحذيرا من هذا الرجل وأضرابه، ولم أطل بالرد عليه هنا لأن ما ذكرته هنا يستنكره عوام المسلمين، ومن أراد تفصيل هذه المقولات والرد عليها فهي في كتاب (الرد على القرضاوي) ، قاله كاتبه/ناصر بن حمد الفهد في أول شهر شوال عام 1420.<br />أولا : موقفه من الكفار :<br />لقد ميع القرضاوي وأمات عقيدة الولاء والبراء من الكفار ، وإليك بعض أقواله :<br />1- قال عن النصارى<br />فكل القضايا بيننا مشتركة فنحن أبناء وطن واحد، مصيرنا واحد، أمتنا واحدة، أنا أقول عنهم إخواننا المسيحيين، البعض ينكر علي هذا كيف أقول إخواننا المسيحيين؟ (إنما المؤمنون أخوة) نعم نحن مؤمنون وهم مؤمنون بوجه آخر)[1].<br />2- و قال في نفس البرنامج عن الأقباط إنهم قدموا الآف (الشهداء) لا ختلاف المذاهب .<br />3- وقال (إن مودة المسلم لغير المسلم لا حرج فيها)[2].<br />4- وقال إن العداوة بيننا وبين اليهود من أجل الأرض فقط لا من أجل الدين[3] وقرر أن قوله تعالى (لتجدن أشد الناس عداوة للذين آمنوا اليهود والذين أشركوا) أن هذا بالنسبة للوضع الذي كان أيام الرسول (صلى الله عليه وسلم) وليس الآن[4]، مع العلم بأنه يستدل بآخر الآية على قرب النصارى الآن من المسلمين!![5]، ويقول (إذا عز المسلمون عز إخوانهم المسيحيون من غير شك وإذا ذل المسلمون ذل المسيحيون)[6].<br />5- وقرر في مواضع أن الإسلام_ بزعمه_ يحترم أديانهم المحرفة [7]، وقرر أنهم كالمسلمين لهم ما لهم وعليهم ما عليهم[8] ، وأن الأرضيات مشتركة بين المسلمين وبين النصارى ، وأن الإسلام ركز على نقاط الاشتراك بيننا وبينهم لا على نقاط الاختلاف [9]، وأنه لا بد من أن يقف المسلمون والنصارى جميعا في صف واحد على هذه الأرضيات المشتركة بينهم ضد الإلحاد والظلم والاستبداد[10] ، ويذكر أن الجهاد إنما هو للدفاع عن كل الأديان لا عن الإسلام فقط [11]، وجوز تهنيئتهم بأعيادهم[12]، وتوليهم للمناصب والوزارات[13].<br />6- كما قرر أن الجزية إنما تؤخذ من أهل الذمة مقابل تركهم الدفاع عن الوطن وأما الآن فتسقط عنهم لأن التجنيد إجباري يستوي فيه المسلم والكافر[14].<br />ثانيا : موقفه مع المبتدعة :<br />تجد القرضاوي إذا تكلم ضد بدعة فإنه يتكلم ضد خصم لا وجود له ، فهو يتكلم على المعتزلة والخوارج الأوائل ، ولكنه في المقابل يثني على وارثيهم اليوم ، أما الرافضة الذين ورثوا عقيدة المعتزلة وأضافوا إليها من الموبقات والعظائم مايكفي عشر معشاره لإلحاقهم بأبي جهل فتجده مدافعا عنهم ومؤاخيا لهم بل ويعتبر إثارة الخلاف معهم خيانة للأمة، ويعتبر لعنهم للصحابة وتحريفهم القرآن وقولهم بعصمة الأئمة وحجهم للمشاهد وغيرها (خلافات على هامش العقيدة)!![15] ، وكذلك يقول في وارثي الخوارج اليوم وهم الإباضية[16]، وأما الأشاعرة والماتريدية فهم من أهل السنة عنده ولا مجال للنقاش في ذلك[17] .<br />ثالثا : موقفه من السنة :<br />يسير القرضاوي مع تيار العقلانيين في عرض السنة على عقولهم الكاسدة وأفهامهم الفاسدة ، ومن ثم رد بعضها وتأول البعض الآخر مما لا يتفق مع هواه ، وإليك أمثلة من أقواله في السنة :<br />1- ثبت في مسلم مرفوعا (إن أبي وأباك في النار) وأجمع العلماء على ذلك .<br />قال القرضاوي: قلت : ما ذنب عبد الله بن عبد المطلب حتى يكون في النار وهو من أهل الفترة والصحيح أنهم ناجون؟!!![18]<br />2- وثبت في الصحيحين مرفوعا (يؤتى بالموت كهيئة كبش أملح) .<br />قال القرضاوي : من المعلوم المتيقن الذي اتفق عليه العقل والنقل أن الموت ليس كبشا ولا ثورا ولا حيوانا من الحيوانات[19] .<br />3- وثبت في الصحيح مرفوعا (لن يفلح قوم ولوا أمرهم امرأة).<br />قال القرضاوي: هذا مقيد بزمان الرسول صلى الله عليه وسلم الذي كان الحكم فيه للرجال استبدادياً، أما الآن فلا[20].<br />4- وثبت في الصحيح (ما رأيت من ناقصات عقل ودين أسلب للب الرجل الحازم من إحداكن).<br />قال القرضاوي : إن ذلك كان من الرسول على وجه المزاح [21].<br />5- وثبت في الصحيح (لا يقتل مسلم بكافر) .<br />قال القرضاوي-بعد أن قرر أن المسلم يقتل بالكافر خلافا للحديث- : إن هذا الرأي هو الذي لا يليق بزماننا غيره.. ونحن بترجيح هذا الرأي نبطل الأعذار ونعلي راية الشريعة الغراء.[22]<br />وله غير ذلك كثير .<br />رابعا : موقفه من المرأة :<br />عمل القرضاوي على هتك ستر النساء المحجبات بكل ما يستطيع ، فأعلن مرارا أن فصل النساء عن الرجال في المحاضرات بدعة ،وأنه من التقاليد التي ليست من الإسلام[23]، وأنه لا بد من كسر هذا الحاجز بين النساء والرجال ، وقال بالنص (للأسف أنا من السبعينات وأنا أذهب لأمريكا لحضور مؤتمرات إسلامية، ولكن تلقى المحاضرات في هذه المؤتمرات للنساء في جهة وللرجال في جهة أخرى، فالتشدد غلب المجموعات هناك وفرضوا التقاليد على المجتمع الغربي نفسه، حيث أخذوا الأقوال المتشددة وتركوا الأقوال الراجحة، وأصبح الرجال لهم مكان للقاء منفصل عن مكان النساء)،[24]وقال أيضا في نفس البرنامج (مع أن مثل هذه المؤتمرات تعتبر فرصة لرؤية شاب فتاة فيعجب بها، ويسأل عنها ويفتح الله قلبيهما ويكون من وراء ذلك تكوين أسرة مسلمة)، وقال في نفس البرنامج لما قدمه رجل في محاضرة خاصة بالنساء (قلت للمقدم ما مكانك أنت هنا؟ المفروض أن تكون مكانك إحدى الأخوات فالموضوع يخصهنّ، فتقوم على تقديمي وإلقاء الكلمة وتلقي الأسئلة، بهذا ندربهن على القيادة، لكن هناك تحكم دائم من الرجل في المرأة حتى في أمورهن )،وقرر أنه لابد للنساء المحجبات من الظهور في التلفاز والقنوات الفضائحية [25]، ولا بد للمرأة من الاشتراك في التمثيل والمسرح [26]، بل قد ذكر أن له ابنتين درستا في جامعات إنجلترا(وهو إنما يدعو للاختلاط المحتشم!!!!) إلى أن حصلتا على الدكتوراة إحداهما في الفيزياء النووية والثانية في الكيمياء الحيوية !!![27].<br />خامسا : القرضاوي والملاهي :<br />يعتبر القرضاوي من أشهر الدعاة (الشرعيين!!!) إلى الغناء والملاهي ويقرر هذا الأمر من عدة نواحي :<br />1- فيقرر في كثير من كتبه أن الغناء حلال [28]، وأن السينماء حلال طيب[29] .<br />2- ويذكر أنه ينكر على الفنانين الذين يعتزلون الفن !![30].<br />3- ويبارك الذين يلبسون الصلبان ويظهرونها من أجل تمثيل الحملات الصليبية مختتما إجازة هذا العمل لهم بقوله (فسيروا على بركة الله والله معكم ولن يتركم أعمالكم)[31] .<br />4- ويذكر أنه يتابع أغاني (فايزة أحمد) و (شادية) و (أم كلثوم) و (فيروز) وغيرهن[32].<br />5- ويذكر عن نفسه أنه يتابع الأفلام والمسلسلات والمسرحيات ، كفيلم (الإرهاب والكباب) لعادل إمام-وفيه استهزاء بالمتدينين-، و (ليالي الحلمية) و (رأفت الهجان) وأفلام غوار ونور الشريف ومعالي زايد غيرها[33] .<br />6- ويفتي بجواز النظر للنساء اللاتي يظهرن في الشاشة [34].<br />سادسا : شذوذاته الفقهية :<br />كما أنه شذ في كثير من آرائه الفقهية ضاربا عرض الحائط بالنصوص وأقوال العلماء وإليك بعضا من شذوذاته :<br />1- يقرر أن الرجم تعزير لولي الأمر إلغاؤه إن رأى المصلحة في ذلك[35].<br />2- وأن الردة نوعان ردة مغلظة وهي المصاحبة للعنف ضد المجتمع فهذا يقتل، وردة مخففة وهي ما عدا ذلك فيترك صاحبها [36].<br />3- وأن للمرأة أن تتولى منصب الولاية العامة[37].<br />4- وأن المرأة إذا كانت تشترك في البيع والشراء والمعاملات فشهادتها كشهادة الرجل[38].<br />5- وأنه يجوز حلق اللحى[39].<br />6- ويجوز الربا اليسير 1% او 2% بحجة أنه خدمات إدارية[40] .<br />بالإضافة إلى إباحته للغناء والملاهي والتلفاز والقنوات والمسلسلات وإسبال الثياب والسفور والتصوير والتمثيل وبيع الخمر والخنزير للكفار ونقل أعضاء الخنزير للمسلم ومصافحة النساء والتزيي بزي الكفار وأكل المصعوقة من اللحوم وسفر المرأة وابتعاثها للدراسة بلامحرم وغير ذلك ، وقد صدق فيه من قال إن القرضاوي بفتاواه ومسخه للشريعة إنما يصيح بجميع المنتسبين إلى الإسلام قائلا لهم بلسان حاله (اعملوا ما شئتم فقد وجبت لكم الجنة!!!) .<br />نسأل الله تعالى أن يثبتنا على الإسلام والسنة ، وأن يعيذنا من هذه الأقوال وأصحابها، وأن يجعلنا من المتمسكين بهدي النبي صلى الله عليه وسلم وأصحابه .<br />وصلى الله على نبينا محمد وعلى آله وصحبه أجمعين .<br />( كتب البحث : الشيخ ناصر الفهد )<br />وللزيادة عن القرضاوي انظر رسالة : \" كشف اللثام عن مخالفة القرضاوي للإسلام \" ، ورد الشيخ عبدالكريم الحميد عليه ، وغيرها من ردود العلماء والدعاة على هذا الرجل - هداه الله - ."
