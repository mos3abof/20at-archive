[[comments]]
order = 18
subject = "كرم الله وجهك يا معلمنا الجليل : القرضاوى"
author = "..& هيكل الأزهرى &.."
posted = "2006-08-29"
text = "والله يا شيخ قرضاوى انا بفخر بمصريتى وبإنى عاصرت الوقت اللى كنت موجود فيه ربنا يكرمك يارب ويرزقك خير ما رزقه لعبد صالح عالم من عباده يارب العالمين انا متابع لقائاتك فى قناة الجزيرة ونفسى يكون ليك ويب سايت خاص اراسلك وترد عليا من خلاله ربنا يحميك يارب ويكرمك والله انت فخر للإسلام وشرف للأمة جميعا الله ينور بصيرتك ويكرمك وفعلا أمل حياتى انى اكون انسان فاهم زيك ومش هقول انسان فاهم عالم زيك لا هقول فاهم بس والله دا شرق ليا وانا من خلال دراستى الأزهرية بقول مش بعيد ان ربنا يمن عليا ويكرمنى زى ما اكرمك الله يحفظك لينا يا شيخنا الجليل . وعن سعودية دا اولا واخيرا دا شخص وضيع وشوفت كام تعليق ليه فى كذا موضوع ربنا يهديه ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123544/http://www.20at.com/article2.php?sid=1106"

