[[comments]]
order = 14
subject = "محمد حسان والتكفير"
author = "محمد حسان والتكفير"
posted = "2006-08-10"
text = "انهال العشرات من المصريين بالضرب علي امام مسجد في محافظه بورسعيد شمالي البلاد لانتقاده حزب الله لبنان .<br />وقالت صحيفه \"المصري اليوم\" المصريه اليوم ان امام المجمع الاسلامي الكبير في مدينه بورفواد بمحافظه بورسعيد ويدعي الشيخ محمد حسان فوجي‌ء بعد انتهاء خطبه الجمعه امس بعشرات المصلين ينهالون عليه ضربا وركلا حتي نزف الدم منه وانه لم ينقذه من بين ايدي المصلين الا رجال الامن.<br />واوضحت ان الشيخ حسان \"انتقد حزب الله مروجا لفتوي لرجل دين سعودي عن حرمانيه نصرته الامر الذي اثار المصلين الذين هددوه بالقتل ان عاد للمسجد مره اخري\".<br />واشارت الصحيفه الي ان هذه الواقعه هي الثانيه خلال اسبوع واحد التي تحدث في مصر التي يتمتع فيها حزب الله لبنان وزعيمه حسن نصر الله بشعبيه كبيره."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123544/http://www.20at.com/article2.php?sid=1106"

[[comments]]
order = 15
subject = "الرد على الرد على مبارك"
author = "عصبي ولساني وسخ"
posted = "2006-08-11"
text = "يا حبيبي، يا عمري. أنا لست ضد الوهابيين ككل، أنا عنيت منهم علماء السلاطين، فلماذا تتهمني ببطلان المذهب وأنا سنيٌّ مثلك.<br />أنا أحترم كل إنسان يقول أنه سلفي. أما أن يدعي ذلك وهو عالم سلاطين، فأسأل الله أن يرينا فيهم يوما.<br />وأما فهد بن عبد العزيز، وعبد الله الحقيرين عليهما من الله ما يستحقان، فهما عميلان كباقي حكام العرب، أو هما من الرويبضات أيضا كباقي حكام العرب، وأقل دليل على ذلك هو المعسكرات الأمريكية في السعودية، ودعمهم لأمريكا بالنفط، ورميهم لبعلماء الصادقين بالزنازين والربع الخالي، وغير ذلك كثير. فلا تقل لي أنهما خير من الذين ربوني، لا تقذف من رباني دون أن تعرفه إن كنت حقا مسلما كما تقول.<br />وأعود وأقول اللهم أرنا بعبد الله حاكم السعودية وبحكام العرب يوما أسود كالليل يشهده كل الأنام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123544/http://www.20at.com/article2.php?sid=1106"

[[comments]]
order = 16
subject = "الرد على عصبي ولساني وسخ"
author = "عندليب"
posted = "2006-08-29"
text = "السلام عليكم<br />أولا: أود أن أقول لك إن كنت سني كما تدعي فإن من عقيدة أهل السنة والجماعة الدعاء للحكام بالخير حتى وإن كانوا جائرين ظالمين والطاعة لهم في غير معصية الله، وليس الدعاء عليهم وكرههم وبغضهم وتحريض الناس عليهم لأن هذا من عقيدة الإخوان والقطبيين،ولا يجوز لك سب الحكام العرب لأنها من الغيبةالمحرمةفلا تضيع حسناتك في غيبة الحكام بل عليك الدعاء لهم.<br />ثانيا:ولقد قلت من قبل (أحسن من الذين ربوك) لأني رأيت نتيجة هذه التربية بأنك قلت وشتمت بكلاما لا يقوله عاقل ولا إنسان يخاف الله سبحانه ولا حتى إنسان حيي يستحي من الله ومن الناس فأنت قلته أمام الملأ وأدعو الله لك بالهدايةوالسير على الطريق القويم والسير على نهج الرسول والخلفاء الراشدين وعليك بالاشتغال بحفظ كتاب الله و بطلب العلم الشرعي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123544/http://www.20at.com/article2.php?sid=1106"

