[[comments]]
order = 11
subject = "العقال السعودي والقلنسوة الاسرائيلية"
author = "العقال السعودي والقلنسوة الاسرائيلية"
posted = "2006-08-05"
text = "حزمة الاعلام المملوك للسعودية ...الشرق الاوسط والحياة والعربية وايلاف والاعلام السعودي الداخلي تبع الموقف السعودي السياسي المنحاز لاسرائيل باعتبار ان السعودية اول دولة عربية ادانت حزب الله ووصفته بالمغامر لتشكل مع مصر والاردن جبهة عربية لحماية الموقف الاسرائيلي.<br />اعلام العقال قاتل على جبهتين تضامنا مع القلنسوة, جبهة الحرب النفسية ضد حزب الله بالتخويف والتثبيط وهدم الرمزية ومحاولة اظهار الحزب على انه مجموعة مغامرين او مرتزقة يقاتلون لحساب ايران وسوريا مقابل حفنة من الدولارات واذا اخذنا مثالا واحدا بسيطا ندرك اختفاء المسافة الفاصلة بين هاارتس ومعاريف وبين اعلام العقال بل ان الاعلام السعودي خرج عن طوره ليفبرك التحليلات التي تصب في خانة هزيمة حزب الله متفوقا على كذب الاعلام الاسرائيلي نفسه.<br />ترك عبد الرحمن الراشد وهذا هو المثال كل حيثيات المعركة من هزيمة الجيش الاسرائيلي الى جرائم الطيران الحربي بقصف المدنيين وراح يدبج مقالا طويلا عريضا عن كلمة قالها حسن نصر الله عرضا في احد خطاباته وهي كلمة الاموال الخليجية(المكدسة) التي يمكن ان تبني لبنان.<br />زعل الراشد جدا لان نصر الله قال ان لبنان يمكن ان تبنيه الاموال المكدسة في الخليج وانتفض انتفاضة مقاتل عربي من الصحراء ومناظر الجثث اللبنانية المكدسة لم تحرك عقاله .<br />بسهولة يمكن ملاحظة فضيحة الاعلام السعودي على الجبهة الثانية ونقصد بها تولي عملية غسيل سمعة السعودية وملكها وتقديمها على انها راعية العرب والعروبة وحامية الحمى وانها ضد ماتقوم به اسرائيل وايضا ترسيخ صورتها كدولة صناديق طبعا ليس صناديق انتخابات او صناديق عتاد لان العتاد السعودي حكرا على القتال في صيد الضب انما صناديق التبرعات فكلما استجد امرا تقف فيه السعودية مع اميركا واسرائيل اخرجوا صناديق الخديعة ليملؤها بالريالات المستهلكة التي تعاد للبنوك السعودية لحرقها.<br />البعض لايحبون درس الجغرافيا لذا يعتقدون ان العقال بعيد عن القلنسوة مايفسر عدم اشتباكهما في أي حادث منذ تاسيس اسرائيل عام 1948الى اليوم والحقيقة ان حدود اسرائيل الطبيعية تقع اطولها مع مصر والاردن والسعودية باعتبار البحر الميت امتداد للبحر الاحمر كما ان فصل السعودية عن فلسطين جرت بضربة معلم وبخط ناعم عبر شواطئ الاردن على البحر الميت ومعلوم ان خارطة الاردن مصممة خصيصا لحماية اسرائيل وكون السعودية لاتملك حدودا مباشرة مع اسرائيل لايعني انهما متباعدتان وتقاربهما الجغرافي مبني عليه تقارب سياسي على شكل حلف مكتوب او غير مكتوب يقضي بعدم الاعتداء ومعلوم للراشد ان اسرائيل استخدمت الاراضي السعودية للاغارة على مفاعل تموز الرافضي قبل ان يولد حزب الله ويدخل الامة في مغامرة عسكرية وان اسرائيل اجتاحت لبنان عسكريا دون ان يكون لها اسرى لدى فصيل لبناني لملاحقة اناس شردتهم من ارضهم ودفعتهم باتجاه لبنان.<br />ومن ضعفنا في الجغرافيا اعتقادنا ان القلنسوة الاسرائيلية اصغر مرتين او ثلاثة فقط من العقال السعودي وحقيقة الارقام ان الفوارق كبيرة فاسرائيل المحروسة بدعاء ابن جبيرين 9ساعات و90 دقيقة الساعات لقطع اسرائيل طولا والدقائق لقطعها عرضا لان مساحتها 27 الف كيلو مترا مربعا 10الاف ميل تقريبا اما المحروسة السعودية فمساحتها اكثر من مليونين متر مربع وفي العام القادم عندما يحج الاسرائيليون الى خيبر بخيلهم وحميرهم وعجولهم المقدسة سيبدون قافلة تائهة بصحراء مترامية الاطراف وهم ينتقلون من مدينة الى اخرى في مملكة ال سعود.<br />مع ان غولاني تحطم والجيش الاسرائيلي تحول الى اطفال يبكون وسط احراش لاتبعد سوى بضعة مئات من الامتار عن حدود كيانهم ومع ان المجتمع الاسرائيلي اكتشف ان مقولاته التي عاش في ظلها طويلا من قبيل التفوق العسكري والاستخباري ودقة التخطيط صارت هواء في عقال الا ان اعلام خادم الحرمين الشرفين لايزال يصر على التفوق الاسرائيلي واعلامه يكرر لوازمه ذاتها...اسرائيل لاتقهر واسرائيل تمتلك ترسانة نووية تكفي لتدمير الشرق الاوسط طبعا المنطقة وليس الصحيفة واسرائيل اسرائيل عزرائيل الشرق الذي يخطف الارواح دون ان يقدر عليه احد.<br />مايمكن تسجيله هنا ان السعودية كانت تدفع بسخاء ولاتزال تفعل ذلك في مجال الاعلام الا انها وجدت اقلاما تكتب مجانا وتصرخ بهستيريا مجانا لتمجيد طبيعة اسرائيل وترميم هيبة اسرائيل وللاسف فان العقال السعودي الذي يضع القلنسوة فوقه وليس تحته وجد نعالا عراقيا يمشي فيه بانجس المناطق واكثرها قذارة .<br />الاعلام الالكتروني السعودي ابلى بلاء شديدا في الدفاع عن القلنسوة حتى ان الاسرائيليين انفسهم لايصدقون غزوات البالتالك لنصرة اسرائيل من قبل عتاة الوهابية والجماعات المدعومة من قبل الدولة السعودية.<br />لم لا, القبلة الاولى عند اسرائيل والقبلة الثانية عند السعودية وتربة الرافضة اخطر من قلنسوة اليهود والعودة الى خيبر مسالة وقت لن يطول وانا لااكتمكم وان كان للبيت رب يحميه لااستبعد امرا جللا يطال مكة مادام امرها ال الى ال سعود ومفتيهم ابن جبيرين وكنا نعتقد ان القلنسوة ستظل تحت العقال اما ان تكون فوقه فهذا تطور جديد له مابعده مثلما كان له ماقبله وعذرا لاهل العقال فنحن لم نرد الزي انما الرمز الذي ارتبط بالاسرة السعودية."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123544/http://www.20at.com/article2.php?sid=1106"

