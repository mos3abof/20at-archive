text = "أرجو من الآخ الذى تكلم بالطعن فى معتقد أهل السنة ويحاول أن يبحث عن عقيده أخرى<br />\"يا أخى هذا عنوان بريدى:khaledabdelbaset@hotmail.com<br />فالموضوع يحتاج لشرح وأيضاح كبير<br />وللك أن تعرف أن العلم لو كان بالعقل والإجتهاد لكان المسح على الخفين من أسفل أولى بها من أعلى<br />وأن الدين بالإتباع لا للإبتداع<br />فإن كان إ^يمانك بالمنطق والفلسفة<br />فأقول أنت مادى وعقلك محدود مثلما نظرك محدود تستطيع أن ترى لبعد كام كيلو متر؟؟؟<br />هكذا عقلك!!<br />وأعلم أن منهج السلف رضى الله عنهم<br />هو الأتباع فى أمور الدين<br />لدرجة أن أحدهم لما روى حديث ضحك ولما سئل قال رأيت رسول الله يضحك بعدما حدثه<br />والأخر تغوط تحت شجره؟؟؟لماذا لآن رسول الله فعل هكذا<br />وإاليك موقع مفيد فى العقيدة لشيخنا الشيخ محمود عبد الرازق الرضواني<br />www.asmaullah.com<br />أدعوا الله للك بالهداية<br />أمين حاول تراسلنى...."
