text = "مهو مفظوح العرض، العرص ابن الكحبة مبارك الله لا يبارك فيه، واخو الشرموطة عبد الله حسين، يا ريت يستر على الشرموطة مرته وما يطلعها بالمايوهات، والحقير الخسيس المنيك المخصي تبع السعودية فهد ومن بعده عبد الله.<br />والله يهدي حكام السلاطين، الوهابيين وغيرهم، عاملينلي حالهم أهل الدين وهم اللي بفهموا، شو رأيكم يا علماء السلاطين؟؟"
