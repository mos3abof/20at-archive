text = "نشرنا في زاوية صورة وتعليق صورة للشيخ يوسف القرضاوي وهو يقول : تدمير الأصنام في أفغانستان بدعة وكل بدعة ضلالة وكل ضلالة في النار والله أعلم ... وأردنا من هذا التعليق الساخر أن نوجه أنظار القراء إلى تناقضات هذا الشيخ الذي طار إلى أفغانستان بطلب أمريكي قطري لاقناع حكومة طالبن بوقف تدمير تمثال بوذا وقد طار الشيخ فعلا الى كابول وأصدر عدة فتاوى تعارض الإجراء الأفغاني لكن فقهاء طالبان ردوه على أعقابه وأصدروا بيانا بثته محطة الجزيرة القطرية يندد بالوفد الذي ترأسه القرضاوي الذي كان عليه وفقا لبيان طالبان أن يطلب رفع الحصار عن أفغانستان وأن يحتج على تدمير المساجد في الهند واسرائيل بدلا من التدخل لدى طالبان لوقفها عن تدمير تمثال ترى الحركة أنه يتعارض مع معتقداتها .<br />وعاد الشيخ قرضاوي من كابول وهو يجرجر أذيال الخيبة ليجد أمامه ثورة عارمة من الناس الذين صدموا برحلته المضحكة والمخجلة وبدل أن يعتذر الشيخ القرضاوي عن فعلته لجأ إلى الكذب ولوي عنق الحقيقة حين بدأ يروج أن رحلته على رأس الوفد الى كابول لم يكن لها علاقة بتدمير تمثال بوذا وانما كانت تهدف الى الاطلاع على أحوال الشعب الأفغاني المسلم وتقديم المساعدة له ... والقرضاوي كاذب في دعواه لان الوفد طار الى كابول بطلب من عنان والولايات المتحدة وامير قطر لغرض واحد ومحدد وهو إقناع حركة طالبان بالتوقف عن تدمير تمثال بوذا على اعتبار ان هذا يتعارض مع الإسلام .<br />لست هنا في معرض مناقشة الإجراء الأفغاني ... ولكني بصدد الإشارة إلى موقف محدد لرجل شغلته وعملته إصدار الفتاوى وتفصيلها والتجارة بها ليس لمصلحة الإسلام والمسلمين وانما لمصلحة أطراف عربية ودولية ومخابراتية .<br />بعد عودة الشيخ الى قطر ظهر على شاشة محطة الجزيرة الفضائية ليرد على المشاهدين الذين انهالوا عليه بالأسئلة والانتقادات ... ويبدو أن تبريراته لم تجد اذانا صاغية .... ولما<br />اتصل أحد المشاهدين بالشيخ يوسف القرضاوي مبديا اعتراضه على قيام الشيخ بزيارة أفغانستان في محاولة لمنع حكامها من تدمير تمثال بوذا.<br />وبدل أن يرد فضيلته على التساؤل المشروع انفجر غاضبا وقال ساخرا : أفتوا بقتل القرضاوي ... ثم بدأ يتحدث عن نفسه وعن فحوليته في قضايا الدين والإفتاء وقدرته على أن ينسف آراء الاخرين ....الخ .<br />القرضاوي هو نموذج صارخ لشيوخ السلطان الذين يعملون في بلاط الحاكم ويفصلون الفتاوى على مقاسه .... بدءا من الشيخ الشعراوي الذي أفتى بعدم جواز مخالفة أنور السادات ووجوب طاعته بعد أن عينه السادات وزيرا للاوقاف ... مرورا بالشيخ كفتارو مفتي سوريا ... وانتهاء بالشيخ عبدالله غوشة الذي كانت فتاويه تصدر من الديوان الملكي في الأردن .... عداك عن شيوخ شركات توظيف الأموال وعلى رأسهم عبد الصبور شاهين الذي كان يظهر في المؤتمرات الصحافية إلى جانب الريان وأشرف السعد ليفتي بأن دخول الجنة يبدأ بإيداع اموالك في شركاتهم وسحبها من البنوك الربوية ... ولما صدقه الناس وأودعوا أموالهم في شركات الريان والسعد وغيرها طارت الأموال وطار معها أشرف السعد إلى لندن ليعيش كما الملوك والأباطرة بأموال سرقها من المسلمين وساعدته على سرقتها فتاوى الشيخ عبد الصبور شاهين ... الذي تورط مع القرضاوي في فضيحة بنك دبي الإسلامي ... وهو البنك الذي سرقه أصحابه الشيوخ وفروا إلى أوروبا .<br />السؤال الذي وجهه المشاهد للشيخ القرضاوي وأخرج الشيخ عن وقاره لم يكن سؤالا خارجا عن حدود الأدب فقد أصابتنا الدهشة - مثل المشاهد تماما - ونحن نرى القرضاوي يهرول إلى أفغانستان ليقنع حكامها بإيقاف تدمير تمثال بوذا وأصابتنا دهشة مماثلة عندما رد القرضاوي على المشاهدين مدعيا أنه لم يذهب إلى أفغانستان لإيقاف التدمير وانما لمساعدة الشعب الأفغاني المسلم .<br />القرضاوي كاذب في ردوده وتبريراته ولا ندري ما حكم المفتي الذي يكذب على رؤوس الأشهاد ... فمحطة الجزيرة ذاتها أعلنت أن القرضاوي قد طار إلى أفغانستان على رأس وفد عربي وقطري رسمي لاقناع حركة طالبان بالإبقاء على تماثيل بوذا ولم يرد في خبر الجزيرة أو في الأخبار التي نشرتها الصحف العربية والعالمية إشارة إلى مهمة أخرى غير تلك التي أعلن عنها .<br />والقرضاوي هذا واحد من الشيوخ الذين خربوا مفاهيم الإسلام والمسلمين ووظفوا الإسلام لخدمة مصالحهم الخاصة ... وكان ممن حاولوا الانقلاب على ثورة يوليو ثم فر إلى قطر وأصبح مطارزيا لشيوخها ... ويقول الذين عرفوه في السجن الحربي في القاهرة أيام عبد الناصر أنه كان ينافق الحراس ومسئولي السجن بل وكان يغني لهم بصوته الجميل ولعل هذا هو الذي ساهم في إخراجه من السجن والسماح له بالسفر إلى قطر في الوقت نفسه الذي علق فيه عبد الناصر أصدقاء القرضاوي على المشانق ومنهم الشيح سيد قطب .<br />القرضاوي هذا هو الذي يفتي ويسوق حكام قطر ومحطتهم الجزيرة ليل نهار رغم أن مكتبه يقع على مرمى حجر من مكتب إسرائيل في الدوحة والذي أعلنت مشيخة قطر كاذبة أنها أغلقته ... ولم نسمع أن الشيخ قد أفتى بخروج حكام المشيخة عن الإسلام لتعاونهم مع العدو الذي اغتصب القدس ودنس الاقصى .<br />القرضاوي هذا هو الذي عاد قبل أيام من دبي وهو مبسوط لان الشيخ محمد بن راشد منحه جائزة مقدارها مليون درهم ولم ينس أن ينوه بالشيخ وبالجائزة في برامجه الدينية دون أن يسأل الشيخ محمد عن مصدر المليون ...بل الملايين التي يهدرها الشيخ محمد على اسطبلات الخيول في بريطانيا وهي - هذه الملايين - وقف إسلامي لان مشيخة دبي وما جاورها ارض عربية إسلامية استشهد على أرضها مئات الألوف من المسلمين للحفاظ على خيراتها التي ينهبها آل المكتوم أولا بأول بالتعاون مع شركات إنجليزية احتكارية تحكم وتدير مشيخة دبي .<br />القرضاوي هذا أنزله حكام دبي خلال إقامته فيها في فنادق تدار فيها أوكار الدعارة بشكل علني وتسفح فيها أطنان من الويسكي دون أن نسمع فتوى يندد فيها الشيخ بما رأى وسمع ... القرضاوي الذي أنزلوه في فندق برج العرب الأسطوري في دبي وفي جناح طليت فيه الحنفيات ومقابض الأبواب وكراسي الحمامات بالذهب الخالص لم يصدر فتوى بعد عودته بعدم جواز إهدار أموال المسلمين على هذا النوع من الترف والبذخ في وقت يموت فيه المسلمون في السودان وفلسطين وافغانستان من الجوع لان شيوخ دبي سدوا بوزه بمليون درهم .<br />القرضاوي هذا الذي كان مفتيا لشركات توظيف الأموال في مصر بل وشريكا في بعض بنوكها الإسلامية التي سرقت أموال العرب والمسلمين وهربتها إلى البنوك الأوروبية والأمريكية وهرب شيوخها إلى أوروبا ومنهم من يقضي أحكاما طويلة بالسجن ولا زالت رائحة شركات السعد والريان والشريف وغيرها تزكم الأنوف ... أنوفنا وليست أنوف من هم من طراز القرضاوي ... هذا القرضاوي لم يصدر حتى هذه اللحظة فتوى بقطع رؤوس اللصوص أصحاب هذه الشركات والبنوك لان ما فعلوه يعتبر بحكم الشرع سرقة بالإكراه وقرصنة في وضح النهار يجب تطبيق حد الحرابة بمرتكبيها وحد الحرابة هو تقطيع الايدي والارجل من خلاف .<br />القرضاوي هذا هو الذي بارك عقوق الشيخ حمد حاكم مشيخة قطر الذي انقلب على أبيه الشيخ خليفة بطريقة تذكرنا بحكام القرون الوسطى والخيانات بين المحارم ... بل وقام الشيخ حمد مسلحا بفتاوى القرضاوي بالتشهير بأبيه الطاعن بالسن واتهامه بالسرقة وملاحقته عبر الانتربول مع أن الشيخ حمد كان - قبل الانقلاب على ابيه - هو الحاكم الفعلي للمشيخة وبالتالي فهو اللص الأكبر في مشيخة قطر التي تدار هذه الأيام من قصر الشيخة موزة التي تتخذ من زوجة القرضاوي وصيفة لها .<br />القرضاوي هذا هو الذي حلل الربا نزولا عند رغبات بعض الشيوخ من أصحاب البنوك مثل الشيخ زايد وهو الذي حلل لهم الزنا الذي يتستر بأسماء مختلفة مثل زواج المتعة والمسيار والزواج العرفي .... وطبشها وفقا لما نشرته مجلة روزاليوسف بإصدار فتاوى جنسية مقززة لم يعرفها العرب والمسلمون من قبل .... مثل تحليله لممارسة الجنس بالفم ... وتحليله لتقبيل فرج المرأة .... الخ وكلها فتاوى أصدرها الشيخ القرضاوي عبر برنامج ديني تبثه محطة الجزيرة القطرية التي تدار بإشراف إسرائيلي لتخريب مفاهيم العرب والمسلمين مستغلة من هم من طراز هذا الشيخ التلفزيوني الذي بدأ ينافس فيفي عبده في عدد المرات التي يظهر فيها على شاشة التلفزيون .<br />المشكلة ليست في وجود من هم من طراز القرضاوي ممن يتخذون من الدين تجارة ووسيلة رزق .... فمثل هؤلاء تجدهم في كل الأديان والمعتقدات ... لكن المحزن أن القرضاوي ومن هم على شاكلته يقدمون أنفسهم كرجال دين رغم أن هذه بحد ذاتها بدعة دخيلة على الإسلام لانه لا كهنوتية في الإسلام ... وهؤلاء الذين يميزون أنفسهم بطرابيش وعباءات ويقدمون أنفسهم كرجال دين لم يعرفهم التاريخ الإسلامي إلا في عهود متأخرة وعلى أيدي سلاطين بني عثمان فقد دخلوا بأرديتهم وطرابيشهم الى مجتمعاتنا مع دخول النارجيلة وطرابيش السلطان وعبارات حاضر أفندم .<br />المحزن أن قارئا كتب إلينا محتجا على نشر صورة القرضاوي مذكرا انه لا يجوز إسلاميا نقد علماء الإسلام أو السخرية منهم ووقع الكاتب رسالته بلقب دكتور وزعم انه مدير لجمعية إسلامية في أمريكا .<br />يقول المثل الشعبي : رزق الهبل على المجانين ... ودرويش مثل القرضاوي كان يونس نزلاء السجن الحربي بتقليد أم كلثوم ما كان له أن يركب على أكتافنا باسم الدين ويمرر طروحات صهيونية من خلال محطة فضائية صهيونية التمويل والإدارة مثل الجزيرة لولا وجود مهابيل من طراز الأخ الدكتور الذي يزعم أنه يترأس جمعية إسلامية ... لان الدكتور المزعوم لم يقرأ فيما يبدو في تاريخنا العربي والإسلامي أن بدويا توعد سيدنا عمر بن الخطاب بتقويمه بالسيف إن انحرف ... وأن أمرأة خطأت عمر بن الخطاب في قضية شرعية دون أن يأمر سيدنا عمر بقطع رأس البدوي أو المرأة لانهما تطاولا على الذات الملكية مثلا كما يحدث اليوم في الأردن ... ولا أمر رجال العسس أي المخابرات باعتقالهما وتعذيبهما في زنازين المخابرات ... فما بلنا وقد بلغنا درجة لا نستطيع فيها أن نلوم نصابا من طراز القرضاوي عصوا على ذنبه في الدوحة فطار إلي كابول ليفتي بعدم جواز هدم تمثال من الحجر يعتقد سكان المدينة أن وجوده يمس من عقائدهم .<br />لقد اختلفت مع أستاذي الدكتور عبدالله عزام ... لكني احترمته لما ترجم معتقداته الى عمل فطلق مناصبه الرفيعة في الجامعات وطار إلي أفغانستان ليعيش في كهوفها ويستشهد على أراضيها دفاعا عن معتقده ... فأين هذا من القرضاوي الذي تمسح بالدكتور عزام وذكراه بعد عودته مهزوما من كابول ليتمرغ في قصوره في الدوحة ومصر والمغرب وليشرف على ملايينه في بنوك وشركات إسلامية ليس فيها من الإسلام إلا الاسم .<br />على الأقل الشيخ النصاب كفتارو مفتي سوريا يداري وسخه وراء منصبه ولا يظهر على شاشات التلفزيون ليفتي بمناسبة ودون مناسبة ... ومثله الشيخ عبد الصبور شاهين الذي انشغل بالدفاع عن نفسه أمام نصابين من طرازه كفروه وطلقوه من زوجته لانه نفى في كتابه الجديد ابي ادم ان يكون سيدنا ادم هو أبو البشر ... أما يوسف القرضاوي وبفضل محطة الجزيرة الصهيونية التمويل والإدارة والإشراف فقد ركبوه على أكتافنا وسلطوه على حياتنا حتى يفتي لنا بكل شيء ... بدءا بعدم جواز تدمير تمثال بوذا .... وانتهاء بجواز ممارسة الجنس عن طريق الفم ."
