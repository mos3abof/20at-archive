author = "علي ايمن"
posted = "2006-08-04"
text = "الضرب في الميت حرام ويا ريت الجميع يضبط لعصابه وسلوكه ولا يستغل الحريه في التعليق ويشوه صفحات الموضوع بتعليقات اقل من ان توصف بالقذرة. اعلنا وفاة العرب ولا عزاء للسيدات ونشاء الله يقام مراسيم العزاء في الكنيست الأسرائيلي والمقريء الشيخ \"شارون المنشاوي\" سيكون حاضر نيابة عن الحكام العرب بموجب الوكالة المونطة اليه من مجلس الأمم الأمريكية المتحدة."
