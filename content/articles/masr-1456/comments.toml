[[comments]]
order = 6
subject = "الحكمة الفاعلة وليس الحكمة المستكينة"
author = "إبن بهيه"
posted = "2007-01-17"
text = "أسأل الله العلي القدير أن يمد الإخوان المسلمين وكل شرفاء هذا الوطن من كافة التيارات والنحل بعون من عنده لتحقيق النصر وتحرير بهيه<br />وأتمنى على الإخوان أن يكونوا عند حسن ظن الشعب المصري بهم ويتحملوا في صبر جبروت بوبيهات الواطي التي تلاحقهم وتقطع أرزاقهم .. وليكونوا أكثر تأثيراً مما نراه اليوم ، فمنذ زمن بعيد جداً والنظام البائد قريباً بعون الله يضعهم في موقع المدافع فتأتي كل تصرفاتهم مجرد ردود أفعال فقط ..<br />أتمنى من الإخوان أن يأخذوا زمام المبادرة ويتبادلوا مقاعد اللعبة مع ذلك النظام القميء .. ليهاجموا هم .. بطريقتهم التي يرونها مناسبة وفعالة لأسباب كثيرة وحيوية لهم ولمصر والتي أهمها إضعاف ذلك النظام الصهيومصري حتى تذهب ريحه من ناحية ومن ناحية أخرى لا تقل أهمية سيحافظون على كيانهم من التصدع بخروج البعض عليهم إن مللاً أو يأساً أو كلاهما من زمرة الشباب المتحمس كما يحدث دوماً في كافة التيارات في هذا الكون حين تلتزم قياداتها بالحكمة لأمد بعيد.<br />لا تنسوا يا إخوان أن أغلب كوادركم من الشباب الذي ربما لا يتمكن من الاستمرار معكم في طريقتكم الحكيمة تلك وهنا تكون الكارثة على الجميع .. لذا نرجو أن تتحلوا بالحكمة الفاعلة وليس الحكمة المستكينة .. هناك فرق تعلمونه جيداً بكل تأكيد .. أطيب أمنياتي بالتوفيق لكل شريف على أرض مصر ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042317/http://masr.20at.com:80/article.php?sid=1456"

[[comments]]
order = 7
subject = "لماذا لا يفهم المسيحيون اللعبة ويعينوا الإخوان ؟؟؟"
author = "إبن بهيه"
posted = "2007-01-17"
text = "هل يفهم إخواننا المسيحيون اللعبة أخيراً وينضموا إلى حزب الإخوان المسلمين؟ أرجو ذلك .. طيب ليه ؟ إن حجة النظام البائد قريباً في رفض الأحزاب الدينية والتي يعلنها على الملأ دون خجل هي رفبته في حرمان المسيحيين أيضاً من هذا الحق .. يعني لو استمعت لأي من جهابذة النظام ستراه يقول لك فوراً وبلا تردد .. بكره الأقباط يعملوا حزب هم كمان .. طيب وإيه المشكلة يا أفندي ؟<br />هل فهم إخواننا المسيحيون ما أقصده أم لا ؟ سنوضح أكثر .. كم عدد النواب المسيحيين اليوم في البرلمان المصري؟ واحد ؟ إثنان وربع ؟ ثلاثة ؟ ويا ليتهم حصلوا على هذه المقاعد من خلال الصناديق ، لكنهم حصلوا عليها منحة وعطية وهدية ومكرمة من الواطي مبارك .. ولسان حاله يقول لهم اتلموا بقى آديني باديكم نواب من عندي ..<br />هل تعبر هذه النسبة عن المسيحيين في مصر ؟ بالطبع لأ .. لو أخذنا نسبة المسيحيين المنشورة في الإحصائيات العالمية الدقيقة بلا تحيز وهي 6 % من عدد السكان وحسبنا كم عضو يمكن أن يكون للمسيحيين في المجلس الموقر سيد قراره لوجدنا أن من حق إخواننا المسيحيين 27 نائباً في المجلس .. يعني يا أي ببغاء وعامل محلل سياسي حضرتك تتلهي وتسكت .. طيب كيف يمكن للمسيحيين تحقيق هذه النسبة بغير وجود حزب يمثلهم ؟ طبعا مستحيل لا فردي ولا قايمه ولا نايمه ولا أي حاجه ممكن توصلهم للعدد ده غير حزب يمثلهم .. طيب مين بقى اللي واقف في الطريق بقى ؟<br />طبعا مش الإخوان الذين يرحبون بالمسيحيين في حزبهم .. يبقى ما فيش غير النظام البائد قريباً بعون الله .. لأنه لو تجمع للمسيحيين 27 نائب وللإخوان 150 والمعارضه التانيه 25 في المجلس الجاي راح يضيع مبارك الواطي وحزنه الوطني في أبو نيكله وينزاح بصورة سياسية وسلمية من غير دم وخراب يجتهد مبارك الواطي وعصاباته في جر<br />اقرأ بقية التعليق .."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042317/http://masr.20at.com:80/article.php?sid=1456"

[[comments]]
order = 8
subject = "الصورة الجديدة للاخوان"
author = "ما شاء اللة عليهم كلهم دكاترة فى الطب والهندسة والاقتصاد وناس فطاحل وعقول مفكرة وناضجة"
posted = "2007-01-17"
text = "انا لى راى<br />احنا جربنا حكم الشيوعيين وجربنا الراسماليون وجربنا الملكية والجمهورية<br />مانجرب الاخوان<br />هيعملوا لنا فلقة ويضربونا على رجلينا زى سيدنا بتاع الكتاب زمان<br />هيبقوا اصعب من مباحث امن الدولة ورؤساء المباحث فى الاقسام<br />ابدا<br />كلهم دكاترة وعندهم علم<br />نجربهم اية المانع<br />يعملوا حزب اسمة الاصلاح الديمقراطى<br />ويجربوا حظهم<br />ويمكن ييجى الخير على ايديهم<br />اية المانع احنا فى بلد ديمقراطى"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042317/http://masr.20at.com:80/article.php?sid=1456"

[[comments]]
order = 9
subject = "الى ابن بهيه و وجهه نظر"
author = "نيفين نيفى نوفا"
posted = "2007-01-17"
text = "اولا تحياتى ليك يا ابن بهيه<br />انا قرات ردك فى موضوع الاحتفال بعيد العلم على الطريقه المصريه و ياريت تشوف ردى<br />هو بعد ردك ف نفس الموضوع<br />بالنسبه لموضوع الاخوان و احقيتهم بالثقه او لا اسمحولى امتنع عن التعليق<br />بس انا شايفه اولى الاخطوات اللى بيقتضيها الواقع الاخوانى تغيير المرشد"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042317/http://masr.20at.com:80/article.php?sid=1456"

