order = 0
subject = "النصر من عند الله"
author = "مواطن شريف"
posted = "2007-01-17"
text = "هى كلمة هقولة احنا خلاص فاض بينا الكيل من الحكومة ومن شلة المنتفعين امثال الكلب بتاع روز اليوسف وغيرة من شلة المتفعين اقول لهم ان الا يا م دول ومن يتقى الله يجعل لهو مخر جا وسول مهم هل انتم فعلا مسلمون وان كنتم كذلك فكيف تعترضون على شرع الله فى الا رض ولملذا لم تتحدثو عن الفساد والعرى الى فى البلد اشلك انكم مصرين اصلا ومش عاوزين نكفلر حد بس بر ضة اشكك وباذن الله اول واحد سوف ينضم الى هذا الحزب وانا متا كد ان ملين المصرين سوف تسجل عضويتها فى هذا الحزب وما النصر الا من عند الله وبحبك يا مصر اكثر من نفسى"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042317/http://masr.20at.com:80/article.php?sid=1456"

