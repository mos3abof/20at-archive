subject = "شكر"
author = "فريق الموقع"
posted = "2005-12-28"
text = "تم تغيير الخطأ غير المقصود..ونشكرك على تبيهنا.<br />وبخصوص صورة الموضوع فالرقم المكتوب هو 1906 وليس 1996...الرقم الثاني من اليمين والذي يحجبه الرسم هو \" صفر\" و ليس \" 9\" .<br />شكرا مرة ثانية."
