[[comments]]
order = 4
subject = "انا فاهم التيته"
author = "صايع وقديم"
posted = "2005-12-28"
text = "عام 2106 هيكون الأخوان مسكوا الحكم و هيظبطوا الناس بتوعهم وبالتالي الناس بتاعه عشرينات و اسلام اونلاين والعالم الحلوة دي هيكونوا فتحوا بقي قنوات و مجلات و اعلام وحركات و هتفرج معاهم من وسع و هتفضل الناس تشتم في براء برضة و بدل م فريق عشرينات يعلقوا علي المواضيع هيتصلوا بالتليفونات عشان يعلقوا علي البرامج و ظبطتني تجدني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150731/http://www.20at.com/article2.php?sid=160"

