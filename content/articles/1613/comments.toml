subject = "إيه اللخبطة دي؟؟"
author = "واحد برضه"
posted = "2005-12-28"
text = "برااااااااااااافو يا محمد ، كنت فاكرأنا بس اللي بليدف الحساب ... بعد 100 سنة يعني 2106 صحيح !!!<br />مش عارف فاتتكم إزاي دي ، وبعدين الصورةاللي ع الموضوع عليها1996 ، كان نفسي تقولإيهالفرق ف الـ10 سنين ، بدل ماترجع بينا ورا 100 سنة .. عمومًا تًُشكر<br />وتحياتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150731/http://www.20at.com/article2.php?sid=160"

