subject = "تصحيح لابد من منه ..!"
author = "وليد حجاب"
posted = "2005-12-28"
text = "مقال جميل ومناسب جداً للمناسبة ..<br />ولكن ..<br />لزم التنويه عن خطأ حسابي في آخر المقال الذي ورد فيه ( شاركنا برأيك.. كيف ستكون تلك الأخبار المتصدرة لصحف عام 3006 أي بعد مائة عام من الآن؟! ) عند عام 3006 إن شاء الله يكون قد مضى ألف عام وليس مائة ..التصحيح 2106<br />وشكراً"
