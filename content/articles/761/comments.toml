posted = "2006-02-05"
text = "مالك يا نيفين معلقتيش ع الموضوع ليه ؟؟<br />سيبك من عبده ده لانه بيناقض نفسه في تعليقاته<br />و مافيش مشكلة مالهاش حل واحددي ليها مليون حل بس استعيني باللي يقدر عليها ( بالله طبعا )<br />و من يتوكل على الله فهو حسبه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115446/http://www.20at.com/article2.php?sid=377"

[[comments]]
order = 11
subject = "اكرم يا بيضاااااااان"
author = "عبده نصحي"
posted = "2006-02-05"
text = "الي الاخ العزيز اكرم يا ناس حيث اني متخصص في البيضان فانا شايف انك كرتونه بيض متحركه علي الارض وفي تصنيفك في عالم البيضان اتضح انك بيضه تنين متحجره والغريب انها بتجيب سمنه ولزقت في الموقع مش عارف بيطلعوا منين دول انت يعم انا جيت جنبك انا بعلق علي الموضوع هو كل واحد مش عارف يقول ايه يخش يهجص - كلمه معناها زي يهرتل كدا -يهرتل - كلمه بمعني يجعجع - يجعجع -كلمه معناها بياع كلام -بياع كلام -معناها اكرم البيضان هههههه وانا من خلال تعليقي دا بعتزر للاخ اكرم ومش هقوله انت بيضان ولا حاجه وسلامي للاخت اسفين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115446/http://www.20at.com/article2.php?sid=377"

