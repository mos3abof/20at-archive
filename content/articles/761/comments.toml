[[comments]]
order = 6
subject = "الشكرمان طاخ في الترارولي"
author = "عبده نصحي"
posted = "2006-02-04"
text = "للاسف الشديد وانا بكتب الرد علي الموضوع دا حسيت اني مبضون جدا - كلمه مبضون كلمه مستحدثه من البيض وتعني مضايق او مخنوق وهذه كلمه انتشرت في الاونه الاخيره بين الشباب صبيان وبنات تربت تربت تتات - المهم ممكن حد يسئلني يقولي \" ايه الشكرمان طاخ في الترارولي ؟!!\" في الحقيقه وفي الواقع انا معرفش معناها ايه لكن دي كانت في فيلم \" الكيف \" ومن ضمن مواضيع الفيلم دا موضوع علم المصطلح او الكلمات الدارجه علي لسان فئه معينه من الناس وللاسف الشديد انتشرت الكلمات دي بين كل الطبقات وعشان تبقي شاب كول ومش بتاكل فول لازم تسقط بعض هذه الكلمات زي احلقله وكبر دماغك اد الليمونه ويا عم نفض وابضن عليه - برده لها علاقه بالبيض - شاب خانقه , مش طالبه , حنطر عليه واحاينا نام عليه - وتعني امتلاك ما لا يصح لك امتلاكه عن الطريق الكتمان , اركن في الدواسه , بيجيب جاز , انت هتمثل ؟ , ايه الحوار , ايه النظام ؟ , افشخانات , حبشتكانات , كتيان - تشبه بيضان ربما لانها لها علاقه بكرتونه البيض -, حقنه , مقطوم - كلمه تطلق علي شاب معدم - , مصلحه - كلمه تصف شخص نفعي , ابضن عليهم - احد مشتقات كلمه بيضان وتعني مضايقه احدهم - اعمل عبده العبيط مصطلح معناه تصرف كانك لا تعرف شيئا البته \" حلوه البته دي هههه بته ووزه ههههه \"يا عم الامور - تستخدم لوصف شخصا ما بيستظرف - ست الكتكوته - مصطلح اول ما ظهر ظهر علي لسان المواطن اللمبي في احد افلامه وهناك الكثير لو يحب الموثع داسه شامله عن الموضوع دا ممكن اكتب مقال وبتاع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115446/http://www.20at.com/article2.php?sid=377"

