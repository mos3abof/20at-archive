[[comments]]
order = 9
subject = "اشى خيال يا ناس عبده بيهزر طيب ما كان من الاول"
author = "نيفين"
posted = "2006-02-05"
text = "طيب ما نت بتهزر اهوه يا استاز عبده امال ليه محسسنا فى كل تعليق ليك اننا معندناش دم لاننا بنعلق و ان الموقع معندهمش دم لانهم بيكتبو موضوعات خفيفه ما انت بتهزر اهوه<br />سبحان الله<br />ما علينا<br />بالنسبه لى يا جماعه اكتر كلمه خنقتنى جدا الفتره اللى فاتت عباره بيقولوهالى كا اصدقائى المقربين ردا على مأساه و مشكله كبيره حصلتلى موخرا و ملاش حل فعلا و قلبتلى حياتى 180 درجه مره واحده و هى عباره<br />نيفين انا بجد مش عارفه اقوللك ايه<br />بجد بكره الكلمه دى لاتها بتحسسنى ان مشكلتى ملهاش حل و هو الواقع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115446/http://www.20at.com/article2.php?sid=377"

[[comments]]
