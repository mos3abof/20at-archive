subject = "صومواوافرحوا"
author = "رائد"
posted = "2006-04-11"
text = "والله ياجماعة رغم ان العلماء اختلفوا على مشروعية الاحتفال بالمولد النبوي الشريف الا اننا في العراق نحتفل باشكال مختلفة وبطرق متباينة تماما وتطول فترة الاحتفال الى عشرة ايام تقريبا كما ان اكل اللحوم هو المفضل لدينا في هذا اليوم، انا لست مع الاحتفال ولا ضده ولكن هذا ما يحدث بالفعل في الكثير من دولنا الاسلامية وبالتالي فهو الواقع بعينه ولكني لا ارى غضاضة في الاحتفال بالصوم والذكر وكذلك الحلوى لانه لا يوجد ضرر والفرحة مطلوبة"
archived = "2006-11-02"
