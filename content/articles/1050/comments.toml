text = "السلام عليكم الإحتفال بالمولد أساسابدعة ابتدعها الفاطميون ليشغلوا الناس عن أفعالهم فى مصر وكان ذلك فى القرن الرابع الهجرى وقد قال الرسول (ص)فيما معناه \" من أحدث فى أمرنا هذا ما ليس فيه فهو رد\" ولو نظرنا إلى هذا اليوم بنظرة عقلانية لوجدنا أننا بقدر فرحنا بمولد النبى (ص) - الذى أنقذنا من الكفر وهدانا إلى اللإسلام - يجب أن نحزن بنفس القدر لإنه نفس اليوم الذى تفى فيه (ص) وانقطع الوحى من السماء وجزاكم الله خيراً"
