[[comments]]
order = 9
subject = "مش كل سنة يطلعلنا محرماتي"
author = "هاني ضوَّه"
posted = "2006-04-15"
text = "بسم الله الرحمن الرحيم<br />الحمد لله وكفي والصلاة والسلام على سيدنا محمدوآل بيته الأطهار وأنبياء الله ورسلة الذين اصطفي؛ ثم أما بعد:<br />كان لي تعليق على كلام الأخت إللى بتقول إن احتفال بالمولد بدعة، وإن الفاطميين هما إللي أسسوهم:<br />مين قالك كده ؟!!!<br />وفي أي مصدر من كتب التاريخ؟!!!<br />ولا ده كلام الفوزان وابن عثيمين وأمثالهم؟!!!<br />أفتحي البداية والنهاية لأبن كثير، عشان تعرفي الحقيقة إللى حرفوه، أظن الجزء الـ12أو 13 في البداية والنهاية على ما أتذكر.<br />أول من أحتفل بالمولد الشريف ملك أربل وكان من أبطال حطين وصاحب أربل كان سلطانا سنيا على مذهب أهل السنة والجماعة دخل تحت طاعة السلطان صلاح الدين الأيوبي قاهر الصليبيين !!!<br />ومن المعروف أن السلطان صلاح الدين الايوبي الاشعري هو الذي قضي على الدولة الفاطمية في مصر وأحل مذهب أهل السنة والجماعة في الأزهر بمصر بدلاًًً من المذهب الشيعي سنة 567هـجرياً.<br />يعني ملك أربل كان في عهد الدولة الأيوبية إللي أنهت وقضت على الدولة الفاطمية العبيدية.<br />أرجعوا لكتب التاريخ وسيبوكم من الفوزان وأمثالة، وشوفوا علماء الأمة قالوا إية السيوطي وابن حجر وغيرهم كتيييييير.<br />وإللي عاوز مصادر ممكن أقولها.<br />مش كل سنة يطلعلنا واحد يقولنا المولد بدعة وإللى بيعملوة كذا وكذا ، حراااااااااام عليكم سيبوا الناس تفرح بنبيهم.<br />مبقولش الإحتفال يكون فيه منكرات معازف ورقص ومراجيح والحاجات دي، لكن بقول نحتفل بطريقة شرعية.<br />ورجاء محدش يزعل من كلامي وانا مقصدش حد بصفة شخصية.<br />هاني ضوَّه<br />صحفي مصري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131519/http://www.20at.com/article2.php?sid=681"

