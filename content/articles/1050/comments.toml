[[comments]]
order = 4
subject = "فتوى"
author = "الاحتفال بالمولد النبوي له شقان؛ الأول: كون الاحتفال بمولد النبي صلى الله عليه وسلم لم يكن موجودا على عهد الصحابة والتابعين ."
posted = "2006-04-11"
text = "الثاني:اعتقاد المحتفلين به أنه من السنن الواردة.<br />والحقيقة أن كلا الفريقين جانبه الصواب،فليس عدم الاحتفال بالمولد النبوي في السلف يعني أنه بدعة، ولا يعني الاحتفال به أنه أمر من الشرع، ولكنه من المباحات، بشرط عدم اعتقاد سنيته، وألا يكون فيه من الخروج عن هدي النبي صلى الله عليه وسلم مما يفعل في كثير من الاحتفالات، وفي الاحتفال بذكرى المولد تذكير بسيرة النبي صلى الله عليه وسلم.<br />يقول المستشار فيصل مولوي نائب رئيس المجلس الأوربي للإفتاء والبحوث:<br />إن ذلك جائز شرعاً ولو لم يكن له أصل بمعنى أنّه لم يحتفل به الصحابة والتابعون ولا تابعو التابعين من أهل الفقه في الدين وهم خير القرون. ولكن لما جهل كثير من المسلمين صفات الرسول (صلَى الله عليه وسلَم) وحياته، وكيف كان يعيش حياة البساطة والتواضع والرحمة والشفقة، وأصبحت محبة الرسول (صلَى الله عليه وسلَم) في قلوب الكثيرين محبة سطحية، جمع أحد سلاطين المسلمين العلماء وطلب من أحدهم أن يؤلف كتاباً يتناول حياة الرسول منذ الولادة إلى الوفاة وذكر أخلاقه الطيبة العطرة، وأقام لذلك احتفالاً مهيباً وصار الاحتفال بالمولد ذكرى استحبها كثير من العلماء وبقيت حتى يومنا هذا.<br />إلاّ أنّه لا بدّ من القول: إنّ هذا الاحتفال ليس نوعا من العبادات التي يشرّعها الله ، ولكنّه من أنواع العادات والأعراف التي يخترعها النّاس، ثمّ يأتي الشّرع بإباحتها إذا لم يكن فيها حرام، أو بمنعها إذا اشتملت على محرّمات. وبما أن ذكرى المولد في الأصل تذكير بسيرة الرّسول (صلَى الله عليه وسلَم) وأخلاقه فهي مباحة وفيها من الأجر إن شاء الله ما لا يخفى.<br />لكن يجب الحذر ممّا ورد في بعض كتب الموالد من انحرافات وشطحات تصل إلى حدّ الكفر أحياناً. فهذه حرام ولو كانت في غير ذكرى المولد. وإذا اقترنت بها الاحتفالات تصبح حراماً أيضاً.<br />ويقول فضيلة الشيخ الدكتور يوسف القرضاوي<br />هناك لون من الاحتفال يمكن أن نقره ونعتبره نافعا ًللمسلمين،ونحن نعلم أن الصحابة رضوان الله عليهم لم يكونوا يحتفلون بمولد الرسول صلى الله عليه وسلم ولا بالهجرة النبوية ولا بغزوة بدر، لماذا؟<br />لأن هذه الأشياء عاشوها بالفعل، وكانوا يحيون مع الرسول صلى الله عليه وسلم، كان الرسول صلى الله عليه وسلم حياً في ضمائرهم، لم يغب عن وعيهم، كان سعد بن أبي وقاص يقول: كنا نروي أبناءنا مغازي رسول الله صلى الله عليه وسلم كما نحفِّظهم السورة من القرآن، بأن يحكوا للأولاد ماذا حدث في غزوة بدر وفي غزوة أحد، وفي غزوة الخندق وفي غزوة خيبر، فكانوا يحكون لهم ماذا حدث في حياة النبي صلى الله عليه وسلم، فلم يكونوا إذن في حاجة إلى تذكّر هذه الأشياء.<br />ثم جاء عصر نسي الناس هذه الأحداث وأصبحت غائبة عن وعيهم، وغائبة عن عقولهم وضمائرهم، فاحتاج الناس إلى إحياء هذه المعاني التي ماتت والتذكير بهذه المآثر التي نُسيت، صحيح اتُخِذت بعض البدع في هذه الأشياء ولكنني أقول إننا نحتفل بأن نذكر الناس بحقائق السيرة النبوية وحقائق الرسالة المحمدية، فعندما أحتفل بمولد الرسول فأنا أحتفل بمولد الرسالة، فأنا أذكِّر الناس برسالة رسول الله وبسيرة رسول الله.<br />وفي الهجرة أذكِّر الناس بهذا الحدث العظيم وبما يُستفاد به من دروس، لأربط الناس بسيرة النبي صلى الله عليه وسلم (لقد كان لكم في رسول الله أسوة حسنة لمن كان يرجو الله واليوم الآخر) لنضحي كما ضحى الصحابة، كما ضحى علِيّ حينما وضع نفسه موضع النبي صلى الله عليه وسلم، كما ضحت أسماء وهي تصعد إلى جبل ثور، هذا الجبل الشاق كل يوم، لنخطط كما خطط النبي للهجرة، لنتوكل على الله كما توكل على الله حينما قال له أبو بكر: والله يا رسول الله لو نظر أحدهم تحت قدميه لرآنا، فقال: \"يا أبا بكر ما ظنك في اثنين الله ثالثهما، لا تحزن إن الله معنا\".<br />نحن في حاجة إلى هذه الدروس فهذا النوع من الاحتفال تذكير الناس بهذه المعاني، أعتقد أن وراءه ثمرة إيجابية هي ربط المسلمين بالإسلام وربطهم بسيرة النبي صلى الله عليه وسلم ليأخذوا منه الأسوة والقدوة، أما الأشياء التي تخرج عن هذا فليست من الاحتفال ؛ ولا نقر أحدًا عليها .<br />والله أعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131519/http://www.20at.com/article2.php?sid=681"

[[comments]]
order = 5
subject = "راي العلماء"
author = "اسلام اون لاين"
posted = "2006-04-11"
text = "ويقول الدكتور مصباح حماد، وكيل كلية الشريعة والقانون بجامعة الأزهر: \"جرت عادة الأمم على الاحتفال بذكرى مولد عظمائهم، تذكيرا بهم وبأعمالهم. والمسلمون في هذا كغيرهم؛ يحتفلون بذكرى عظمائهم، ويأتي على رأس هذه الاحتفالات الاحتفال بذكرى ميلاد خير البشر محمد صلى الله عليه وسلم، الذي أضاء ميلاده الكون، وأخرج الناس من الظلمات إلى النور.<br />ولقد كان الرسول صلى الله عليه وسلم يحب هذا اليوم الذي ولد فيه، وكان يصومه. ومن هنا يمكن القول أنه لا غضاضة في الاحتفال بيوم مولد رسولنا الكريم صلى الله عليه وسلم؛ على أن نسترشد بفعله صلى الله عليه وسلم فيكون الاحتفال بالعبادة والصوم، وتدبر معاني القرآن الكريم، واستعراض سنته، فما بعث الرسول صلى الله عليه وسلم إلا ليتمم مكارم الأخلاق. ومن مكارم الأخلاق ألا يهتز الرجل اهتزاز المجانين، وألا يرتدي ملابس مهلهلة ممزقة.<br />ويرى الدكتور مصباح أن المسلمين الآن في حاجة للاحتفال بميلاد النبي أكثر من أي وقت مضى؛ تذكيرا للأجيال الصغيرة بنبيهم صلى الله عليه وسلم، ولكي نربي لديهم الاعتزاز والفخر به، دون الوقوع في البدع، ويكفي أن نتذكر حديث الرسول صلى الله عليه وسلم: \"إن الله احتجز التوبة عن صاحب كل بدعة\" (صححه الألباني)."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131519/http://www.20at.com/article2.php?sid=681"

