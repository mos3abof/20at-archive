author = "نبيل فرحان"
posted = "2006-06-28"
text = "انا اعارض كل تلك التسريبات و ايضا اقول للاساتدة تدكروا ايامكم وانتم فى متل سننا انتم ايضا كنتم تتمنون نيل شهادت البكالوريا كما يقول المتل كما تدين تدان و شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151142/http://www.20at.com/article2.php?sid=970"

