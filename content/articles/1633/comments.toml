[[comments]]
order = 1
subject = "مابقا شان للباك"
author = "غضبان"
posted = "2006-06-21"
text = "كنا ايام زمان لما بيحصل واحد من ابناء الحي على الباك كانت تقام له الحفلات والزغاريد لكن الان الكل مسخ في مسخ لاباك ولا اجازة ولا دكتوراه<br />الان عندنا سوى البطالة وقوارب الموت والدعارة وربنا يستر في الباقي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151142/http://www.20at.com/article2.php?sid=970"

[[comments]]
order = 2
subject = "الفرشة عنوان المغرب هدا العام"
author = "يوسف"
posted = "2006-06-22"
text = "كل شئ هدا العام ليس له مصداقية فهاهو مصير الشباب المغربي تحت ايدي غير امينة كماقيل\\ادا اطلق اسم الامين على من هب و دب ضاعت الامانة (ويالهامن امانة) حتى ادا سمعوا ان في بني فلان رجلا اميناعجبوا له وقالوا ان في بني فلان رجلا امينا\\"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151142/http://www.20at.com/article2.php?sid=970"

