subject = "احمدوا الله واشكروه"
author = "الجندي المجهول"
posted = "2006-06-29"
text = "حرام عليكم ياشباب انتهزوا الفرصة وادرسوا وكفى من الالفاظ البائسة ما دام وطنكم يعطيكم هده الامتيازات وما رمتم تعيشون في امان وتستمتعون بالد الماكولات بالله عليكم هل تشاهدون ما يجري خولكم في العالم فاحمدوا الله واشكروه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151142/http://www.20at.com/article2.php?sid=970"

