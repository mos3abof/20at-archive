subject = "فعلا الموت حق"
author = "السلام عليكم و رحمة الله و بركاته"
posted = "2006-02-06"
text = "بما انه الحديث عن الموت ، يا رب نموت بخاتمة حسنة ان شاء الله ، و اتمنى اني اموت و قد عملت شئ لديني و لامتي و يا رب اموت و لله سبحانه و تعالى راضي عني و هو ورسوله صلى الله عليه وسلم ، باني اعمل ما استطيع لنصرته و لتوقيره و حمل العالم على توقيره كما قال عمرو خالد<br />استمعت بالامس الى كلمة عمرو خالد على قناة اقرأ و كانت رسالته لنا:<br />رسالتي للأمه الإسلامية والشباب المسلم حب رسول الله ، توقير رسول الله ، الدفاع عن رسول الله ، العيش على خطى رسول الله ..واجب وأمانه سنسأل عليها يوم القيامه ..في أمانه في رقبتنا يا شباب ، في أمانه في رقبتنا يا صناع الحياة ، في أمانه في رقبتنا يا سيدات أن توقير رسول الله أمانه سنؤديها له يوم القيامه عندما نلقاه على الحوض ، نذهب<br />إليه يوم القيامة ونقول له نحن أمتك يا رسول الله أدينا الأمانه ، احنا يمكن كنا وحشين ويمكن كان عندنا ذنوب ويمكن لم نعمل جيدا في نهضة وإصلاح أمتك ، لكن مش ممكن كنا نسيب غير أن نوقرك ونحمل العالم على توقيرك ، أمانه يا رسول الله بنؤديها لك ويمكن ديه اللي تشفع لنا بها يوم القيامه وتشربنا من حوضك وتفرح بينا وتقول لنا ..كان عندكم أخطاء بس توقيري كان غالي عليكم أوي فتشربنا من حوضك ..صلى الله على محمد صلى الله عليه وسلم ...<br />رسالتي للأمه أن علينا أمانه ...لا يمكن التفريط في هذه الأمانه ..أمانه توقير رسول الله صلى الله عليه وسلم وحمل العالم على توقيره فضلا عن حبه والعيش على سنته وطريقه هذه هي رسالتي للأمه الإسلامية ، لن نفرط أبداً في توقير رسولنا وحبيبنا وقدوتنا<br />الكلمة الكاملة مكتوبة و فيديو على موقع عمرو خالد<br />www.amrkhaled.net<br />نون- الامارات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113924/http://www.20at.com/article2.php?sid=398"

