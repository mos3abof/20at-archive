[[comments]]
order = 10
subject = "كفاية"
author = "Dabdoob"
posted = "2006-02-09"
text = "كل ما ادخل عشرينات الاقي ناس متضايقة من ان عشرينات لا تملا الصفحات حول موضوع واحد برغم اهميته لا يوجد الكثير ليقال فيه وهو موضوع الصور الكاريكاتورية المسيئة للرسول (ص).<br />واذا افترضنا ان عشرينات صنعت هذا الموضوع فماذا ستكون التعليقات وردود الافعال يا تري ؟؟؟<br />1- سيدخل الجميع وخاصة الاسلاميين ليشجبوا وينددوا ويستنكروا وربما كثيرا ليسبوا الدانمارك علي طريقة (الدانمارك الحقيرة الشريرة كارهة الرسول الحقود و.....)<br />2-يدخل البعض ليسب المسيحيين الكفرة المشركين .<br />3-يدخل نفر قليل ليؤيد الدانمارك او ليلتمس لها العذر باعتبار ان هذه هي حرية الصحافة.<br />وفي النهاية لا توجد اي اضافة للموقع او لمرتاديه من هذا الموضوع ولا اعرف ماذا يريدون من ادارة الموقع .<br />انا شخصيا لا اقلل من اهمية الامر ولكنني ضد نشر موضوع لا جديد فيه!!!!! ومن الافضل ان كانوا يريدون اقامة حملة للمقاطعة او لاي رد كان ان يتوجهوا لعشرات المواقع التي اقيمت لهذا الغرض.<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113924/http://www.20at.com/article2.php?sid=398"

