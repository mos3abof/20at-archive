[[comments]]
order = 1
subject = ""
author = "يوميات زوج خائف"
posted = "2007-05-13"
text = "بصراحة أنا رجل لقطة ، وكل البنات أو الستات الي بيحسدوا زوجتي، ويرددوا نفس التعبير \"يا بختها\" مصحوبا بالحسرة أو اللوعة او الاثنين معا، زوجتي طباخة ماهرة وتحسن الطهي حلو وحادق، وست بيت من الطراز الأول ولا ينغص عليها حياتها معي حسب كلامها سوى أني احرمها من متعة الوقوف في المطبخ لساعات طويلة وكل ما تحب تعمل حاجة حلوة لا تجد مني تشجيع فأنا رجل لا احب الحلويات، ثم أني اقوم بكثير من اعمال المنزل حتى تتفرغ هي لطفلي.. الحقيقة أن الدافع لذلك اني احب المطبخ ، لكن اذا اردت الحق ان العمر مش بعزقة آه.. امال ازعلها واصحى في يوم مالقيش دراعي، ولا لا اصحى من اصله علشان اكون اتعملت كفته او دوبت في البانيو المملوء بمية النار.. لا انا رجل معمر عايز يعني اعيش، ورضا زوجتي هو وسيلتي للحياة.. ماذا وإلا .. انتو عارفينحتى تتفر"
archived = "2009-08-15"
capture_url = "https://web.archive.org/web/20090815163343/http://www.20at.com:80/20at/7ayatna/5843.html"

