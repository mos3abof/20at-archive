posted = "2007-05-19"
text = "أحب أقولكم إني ممشية جوزي عالعجين مايلخبطوش ولا يفكر يلخبطو حتى جوزي بيطبخ 3أيام في الأسبوع والأيام اللي مفروض أطبخ أنا فيها بيشتريلي أكل جاهز ما تتعجبوش هو اللي اختار كده أنا قلتلو إني مابطبخش وفهمتو كده بكل الطرق بس الفكيك قال تتعلم مايعرفش إني بليدة عارفين إني لما ولدت خليتو ياخد أجازة وضع زي. على فكرة هو مش مدايق خالص لأنه بيحبني أوييييييييييييي ييييييييييييييي ييييييييييييييي ييييييييييييييي يييييييييييييي."
archived = "2009-08-15"
capture_url = "https://web.archive.org/web/20090815163343/http://www.20at.com:80/20at/7ayatna/5843.html"

[[comments]]
order = 6
subject = ""
author = "فتاه مصريه"
posted = "2007-05-25"
text = "انتى صح يا نيفين لو فيه حب بين الطرفين يبقى كل واحد هيقدر التانى يعنى لو هو شيفها عليها حمل كبيييييير اكيد هيجرى<br />بسرعه ويسعدها واللى هيحركه هنا هو الحب وهى كمان هتعمل كده زيه<br />لكن للاسف اغلبية الاشخاص اللى بيعانوا من الاحساس انهم خادمات انا من وجه نظرى انهم بصراحه مش عرفوا يختاروا صح من الازواج<br />لان لو الشخص بيحب اكيد هيحس بحببته ويساعدها"
archived = "2009-08-15"
capture_url = "https://web.archive.org/web/20090815163343/http://www.20at.com:80/20at/7ayatna/5843.html"
