[[comments]]
order = 4
subject = ""
author = "نيفين نيفى نوفا"
posted = "2007-05-16"
text = "انا شايفه ان لو فيه حب هيبقى فيه تفاهم و احترام و تعاون<br />الحب ياجماعه هو المظله الجميله اللى بتجمع تحتها المعانى الحلوه دى كلها<br />انا سمعت ف برنامج البيت بيتهم ان فيه احصائيه بتقول ان حوالى 70 % من الرجال فى مصر هم من عينه الريس حنفى(بتاع خلاص هتنزل المره بس اعملى حسابك المره الجايه مش هتنزا ااااابدا)<br />يعنى الستا واخدين حقهم برده<br />يا جماعه ده الرجال هم اللى بعد كدخه هيطالبو بالمساواه…هزرنا كتير ..نهرج شويه بقى ..لا بجد يا جماعه لو هنتكلم جد..انا شايفه ان لو فيه حب هيبقى فيه تفاهم و احترام و تعاون.الحب ياجماعه هو المظله الجميله اللى بتجمع تحتها المعانى الحلوه دى كلها<br />لو فيه حب مش هنلاقى الكلمه اللى هى عنوان الموةضوع دى خالص"
archived = "2009-08-15"
capture_url = "https://web.archive.org/web/20090815163343/http://www.20at.com:80/20at/7ayatna/5843.html"

