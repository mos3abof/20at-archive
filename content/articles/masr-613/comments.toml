[[comments]]
order = 7
subject = "لا أمل"
author = "لا أمل إلا بالصحافة وقوتها ويجب أن تتكلم كل الصحف المستقلة والمعارضة فى موضوع واحد وهو سقوط الفاسد وتغييره ولا أمل لأى إصلاح بغير ذلك ويجب أن يكون توزيع الصحف على أوسع نطاق حتى يعرف العالم كله كيف يتعامل هذا الخنزير مع الشعب فى مصر"
posted = "2006-07-10"
text = "على فكرة موقع البى بى سى بالعربى عامل إستطلاع للرأى عن قانون الصحافة الجديد ويبدوا أن أحمد عز راشش جامد قوى ومنزل كل كلاب الحزب الوطنى علشان يكتبوا تأييد مطبوع للكل بتأييد القانون يا جماعه أحمد عز ده الوجهه التجارية لجمال مبارك وهوه مش صديقة ده مجرد وجهه لنشاط جمال مبارك فى البزنس بالضبط زى مكان أحمد بهجت قبل كده ولما جاتله أزمه قلبية راح له حسنى مبارك جرى فى أمريكا لأنه كان بيمثل واجهته التجارية والبزنس علشان كده مش أحمد عز إللى بيروج للقانون ده جمال مبارك هوه إللى وراى القانون ده والسبب إحنا كلنا عارفين بعد لما يخنق الشعب كله ها يقول لهم فيها يا أخفيها ربنا يخفيه من الوجود كله يارب"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090854/http://masr.20at.com:80/article.php?sid=613"

[[comments]]
order = 8
subject = "مش فاهمة حاجة"
author = "ema"
posted = "2006-07-10"
text = "لما سمعت ان الجرايد امتنعت عن الكتابة افتكرت ان الحكومة هى اللى منعتها من الكتابة مش هم اللى امتنعوا بمزجهم . معقولة القرار الغبى دة يصدر من مجموعة صحافيين بهذا المستوى . بالطريقة الهبلة دية حيسيبوا الفرصة للحكومة تستفرض بالشعب وتعمل فية اللى هية عيزاة"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090854/http://masr.20at.com:80/article.php?sid=613"

[[comments]]
order = 9
subject = "خطأ فادح"
author = "ابو اسامة"
posted = "2006-07-10"
text = "زى ما قلت امبارح على الموقع الى للأسف<br />وقع فى نفس الخطأ واحتجب هو الأخر ولا اعرف<br />لماذا ولصالح من فهؤلآالفاسدون لا يفهمون مثل هذه المواقف وزمانهم بيقولوا بركة يا جامع انها جت منهم ويا ريت لو كنتم نفذتم اقتراحى بصدور الصحف بيضأ بدون كتابة<br />سوى(حكومة فاسدة تشجع الفساد)وكنتم بكده<br />تبقوا كسرتم قانونهم من اول يوم وهو ده<br />الأسلوب الى ينفع مع أغبيأوفاسدون امثالهم<br />مش تقولوا احتجاب مين الى يحتجب الحرامى ولا الشريف لو كان عندهم دم كنا قلنا ماشى<br />لكن الى اختشوا ماتوا دول حرامية وعصابة<br />متستنوش منهم اى شىء فهم ليس معهم السلطة<br />التى معكم وهى سلطة الشعب فانتم تتكلمون باسم الشعب وهم لايعبرون عن احد سوى مصلحتهم فقط."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090854/http://masr.20at.com:80/article.php?sid=613"
