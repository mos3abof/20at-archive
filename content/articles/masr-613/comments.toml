subject = "الصبر.........هانت.."
author = "صالح فاروق"
posted = "2006-07-05"
text = "ولسة ..الجايات كتييير وما يستدعي البكاء قادم ..صدقونى يا جماعة ربنا رحيم قوي وحليم قوي ..مش متخيل ازاي ربنا ما حرقناش على اللى بنعمله في بعض ده!!..ازاي ما خسفش بينا الارض ...أكيد ربنا صابر على الفساد و الظلم و النهب و الزنا و القهر لأنه بيعد العذاب العظيم شامل .جامع ..هادر ..كما الطوفان ..وساعتها لن ينجو من العذاب والبلاء الا من رحم ربي .."
