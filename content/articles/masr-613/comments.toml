[[comments]]
order = 1
subject = "الصحافة والفكر اللى لمؤخذة جديد"
author = "بسمه"
posted = "2006-07-05"
text = "انا لا اقراء الصحف الملقبة بالقومية فصدورها او عدم صدورها لا يمثل اى معني اما بخصوض الصحف التي اتابعها و اقرائها لمن يكتبون فيها وليس لم يملكوها وهناك فرق كبير فانا اؤيدهم في مواقفهم ومطالبهم التي تكفل لشعبنا اطلاق الحريات العامه وحرية الراى والتعبير اما المنافقون والموالسون والمتستورون علي الفاسدين فلا يقرا لهم احد واستغرب من من دخلوا مجلسي الشعب والشورى سواء بالتزوير والتعيين الا يستحون الا يخجلون كيف يطلبون ان ينتخبهم الشعب لتمثيلهم في البرطمان وهم ضد حريه الصحافة هؤلاء هم اللذين يستحقون الحبس والتعذيب في سجون الحزب الوطني"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090854/http://masr.20at.com:80/article.php?sid=613"

[[comments]]
order = 2
subject = "!!"
author = "3aber sabeel"
posted = "2006-07-05"
text = "مش عارفة بس على قد ما هي حركة تحتسب لاصحاب الجرايد على انهم اخدو موقف على قد ما شايفها فيها شوية غباوة.. لان اليوم ده ببساطة الجرايد القومية هتكتسح السوق.. الموقف مكانش المفروض يبقى بالامتناع عن الصدور بالعكس.. الكلمة بتوجع اكتر ما الصمت بيعمل"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090854/http://masr.20at.com:80/article.php?sid=613"

[[comments]]
order = 3
subject = "فكرة مش عمليه على الاطللاق"
author = "عبدالله مفتاح"
posted = "2006-07-05"
text = "اظن ان الاقتراح ده احد عملاء الحزب الوطني<br />هو في حاجه اسمها يمتنعوا عن الصدور<br />دي الجريده لازم تصدر وتنتقد وتهاجم اي وضع مش عاجبها<br />منتهى امل الحزب الوطني ان الجرايد دي تفضل ممتنعه على طول<br />دي فكرة غريبه جدا ومش عمليه ابدا"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090854/http://masr.20at.com:80/article.php?sid=613"

[[comments]]
order = 4
subject = "الدور على مين"
author = "نور الغد"
posted = "2006-07-05"
text = "انا مع ان تحتجب الصحف يوم الاحد ويوم الاربعاء لكى يعلم المواطن الذى لايعلم شى عن القانون ماذا يدور فى البلد وان الظلم والتلفيق والثار من كل من وقف للنظام وقال لا وبداء النظام بزعيم الحرية ووجهة مصر المشرق زعيم الغد الدكتور اااا ايمن نور===== ايمن نور ==== ثم احرار الغد وحركة كفاية والاخوان والناصريون و والقضاء والصحفيون من المصرى اليوم والفجر وافاق عربية وصوت الامة والدستور والابراشى وابراهيم عيسى والباقية تاتى لكى اللة يامصر======= والحرية"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090854/http://masr.20at.com:80/article.php?sid=613"

[[comments]]
order = 5
subject = "يجب المقاطعـــــــــــــــــــــــة"
author = "ssss"
posted = "2006-07-05"
text = "يحب على كل المصريين مقاطعة صحف النطام الفاسد حتى ترد اليهم رزم مربوطه زى ما صدرت يمكن يكون لسه فيه شويه دم ويحسوا بينا ياريت كلنا نتحد ولو مره ونقول لالالالالالالالالالالا لعلها تاتى بنتيجه ولوبسيطه افضل من الصمت"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090854/http://masr.20at.com:80/article.php?sid=613"

