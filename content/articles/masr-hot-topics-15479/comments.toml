author = "الضرب على يد مخبر"
posted = "2010-02-25"
text = "ما قلنا من الاول ابن غبى بدر هيعمل اية !!؟<br />هيعين مخبر فى كل مدرسة علشان يعبط العيال ويضربهم بالخيرزانة<br />دى راجل مخة فاضى وسيبوكى من الورقة المزورة اللى معاة اللى اسمها دكتوراة ابوة جابها لة بالفلوس والواسطة وسخر دكاترة معتقلين ايام ماكان وزير دكاترة فى السجن يعملوا رسالة ابنة للدكتوراة<br />اقصى مؤهلات ابن غبى بدر انة يشتغل مرشد امن انما وزير تربية فعلى التربية والسلام"
archived = "2010-03-01"
capture_url = "https://web.archive.org/web/20100301100600/http://www.20at.com:80/masr/hot-topics/15479-2010-02-24-20-28-56.html"

