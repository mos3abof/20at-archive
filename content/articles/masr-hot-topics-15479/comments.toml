subject = ""
author = "ام يوسف"
posted = "2010-02-25"
text = "مهو الوزير ده ابن زكى بدر البلطجى انتوا مستنيين منه ايه يعنى ؟؟؟ هو ده اللى ابوه رباه عليه او بمعنى تانى اللى مارباهوش اصلا هى الدنيا بتطلع لقدام ولا بترجع لورا على فكرة اى مدرس بيضرب طالب مش بيبقى هدفه مصلحة الطالب بالعكس لكن كل الحكاية انه بيفش غيظه فى الطفل المسكين ولو دورت على اى مدرس بيضرب هتلاقيه معقد نفسيا وبيطلع عقده على العيال هيبة المدرس عمرها مكانت بالضرب انا اذكر لما كنت فى المدرسة وعلى ايامى كانت حاجة عادية انك تشوف خرزانة فى يد مدرس بس مكنش بيمسك عصاية غير المدرس الهزء اما المدرس المحترم الشخصية فكنا بنعمله الف حساب من غير عصاية<br />يعنى هو الوزير المحترم ده لو رجعله ابنه اللى فى مدرسة انترناشينال وقاله المدرس ضربنى هيقله معلش يا حبيبى استاذك وله هيبته برده ؟؟؟؟ بيتهيالى كلكوا عرفين الرد<br />وسلملى على التعليم والله يرحمك يا تربية"
archived = "2010-03-01"
capture_url = "https://web.archive.org/web/20100301100600/http://www.20at.com:80/masr/hot-topics/15479-2010-02-24-20-28-56.html"

