subject = "عادي جدا جدا جدا ........."
author = "إبن بهية"
posted = "2006-11-24"
text = "في زمن الواطي مبارك لازم كل شيء يكون واطي .. في زمن عصابات مبارك الملاعين اللي شغالين نهب في خيرات البلد لازم كل شيء يكون معفن وخربان .. الكورة والرياضة وأي شيء هو مجرد نشاط في المنظومة التي تكون هذا البلد أو ذاك وهي كما قلت وأكرر مرارا أنها نظرية الأواني المستطرقة .. خليها ترن في قصر العروبة وينضف من الواطي حسني مبارك وترن في دواوين ووزارات مصر وترن في المجالس المحلية والقروية ورايحين تشوفوا مصر ممكن تكون إيه خلال خمس سنين بس ... يا مبارك يا واطي يا قذر سيب لابلد انته وعصاباتك خمس سنين لأولاد بهية وخلونا نشوف النتيجة ... لأ طبعا مبارك مش من ولاد بهية ولا يمكن أن يكون ... ده واطي .. بهية ما عندهاش ولاد قذرين كده .. بهية ولادها كلهم بجاله وأهم شيء إنهم مش خونة للوطن يا واطي يا مبارك ... وأرر أنني غير مختلف مع مبارك .. أنا لا أختلف مع حرامي ولص وقذر بيبيع شرفه وشرف بلده ويشتغل عميل ... ده ينضرب بالصرمة القديمة مش نختلف معاه .. افهموها بقى دي حاجه ودي حاده تانية ..<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127182255/http://masr.20at.com:80/article.php?sid=1205"

