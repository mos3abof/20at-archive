order = 0
subject = "أقر الفاتيكان بأن الراهبات"
author = "أقر الفاتيكان بأن الراهبات الكاثوليكيات تتعرضن لتحرش جنسي من جانب القساوسة، لكنه هون من حجم المشكلة مشيرا إلى أنها محدودة"
posted = "2006-11-24"
text = "وقد جاءت تعليقات الحاضرة الكاثوليكية ردا على مزاعم وردت في هذا الصدد في أسبوعية ناشيونال كاثوليك ريبورتر الصادرة في الولايات المتحدة<br />وقالت الصحيفة إنها رصدت بعض الحالات التي حملت فيها الراهبات من القساوسة ثم أجبرن على الإجهاض عقب ذلك<br />وقد استند المقال التفصيلي الذي نشر في الصحيفة إلى خمس تقارير أعدت من قبل رجال دين كاثوليك في الفترة من عام أربعة وتسعين وحتى الوقت الحاضر<br />الراهبات عرضة للخطر<br />واعترف المتحدث باسم الفاتيكان جواكين نافارو فولز بأن قيادة الكنيسة الكاثوليكية تعرف بهذه المشكلة التي كانت موجودة في منطقة جغرافية محدودة<br />حملة عالمية<br />لكن التقرير الذي نشرته ناشيونال كاثوليك ريبورتر تناقض مع ما قاله المتحدث حيث رصد ثلاثة وعشرين دولة وقعت فيها هذه الانتهاكات من بينها الولايات المتحدة وإيطاليا والهند وإيرلندا والبرازيل<br />وكان الأب روبرت جي فيتيلو، الذي يترأس حاليا حملة الأساقفة الأمريكيين من أجل التنمية البشرية قد ألقى محاضرة حول المشكلة نفسها في عام أربعة وتسعين<br />ونقل عنه القول إنه سمع شخصيا قصصا مأساوية عن نساء متدينات إجبرن على ممارسة الجنس مع قساوسة أو رجال دين أقنعوهم بأن ممارسة الجنس أمر مفيد للطرفين<br />وقال التقرير إن النساء اللواتي تعرضن لهذه المأساة لم يجدن كثيرا من التعاطف عندما اشتكين<br />وفي تقرير صدر عام أربعة وتسعين قالت الراهبة ماورا أودوني المؤهلة كطبيبة، إن راهبات من الكنائس المحلية قدمن مناشدات حارة إلى المسؤولين الكنسيين الدوليين يطلبن فيها المساعدة<br />وقالت إن الراهبات المتضررات حاولن تقديم شروح إلى السلطات الكن<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127182255/http://masr.20at.com:80/article.php?sid=1205"

