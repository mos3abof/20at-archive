subject = "رد سريع على رد سريع"
author = "مسلم مصري عربي"
posted = "2006-11-25"
text = "الكلب إبن الكلب من صهاينة المهجر اللي عامل رد سريع ومسمي نفسه إيه إل وحاطط روابط وسخة زي اهله الوسخين اكيد عارف انها روابط لمواقع اسرائيلية واما عرب تايمز اللي حاططها برضه فهي كما هو معروف بتاعة الخول مخبر السي اي ايه يعني منهم وفيهم يا ريت لو عند امك حاجه معقوله تقولها او تروح تتنيل على عين اهلك وتتلهي يا خنزير الخنازي يا حبيب شارون يا كلب"
