[[comments]]
order = 13
subject = "فانيليا"
text = "إرحمني يا براء من تعليقاتك انت كده بتعمل لي تضليل و حتخلليني آخد كام قلم في نفسي... و بعدين صحيح يا جدعان مين Y إللي مدلعاني كده آخر دلع و بعدين كده يا جماعة ما ينفعش لحسن يقولوا دي لمه أقاربها و أصدقائها علشان يبعتوا تعليقات...أنا أكتر حاجة تهمني يا جماعة إن الموضوع يكون مفيد و رسالتي تكون و صلت بشكل جيد, و بعدين الأخ اللي متضايق أوي من الموضوع و بيقول هي كل المشاكل خلصت علشان نتكلم في ريحة العرق...أكيد الأستاذ مرفه و عنده العربية الBM و بيشغل التكييف على أربعة و مش حاسس بمعاناة البشر, إلي أنا شايفاه و أرجو إن يكون فيه حد بيأيد كلامي إن الشعب النضيف صح لازم يكون نظيف من جوه و من بره... مش من جوه هالله هالله و من بره يعلم الله.....و شكراًًً على التعليقات على كل حال.<br />أختكم فانيليا كاتبة هذا المقال :)"
archived = "2004-08-20"
capture_url = "https://web.archive.org/web/20040820085032/http://www.20at.com:80/article.php?sid=544"

[[comments]]
order = 14
subject = "نونا المجنونة"
text = "مريم ولا يهيمك شكله لسه مدخلش كلية<br />انا مكنتش بحضر محاضرات لان دخلت المدرج اغمي علي من ريحة عرق الطلبة و كان يوم سبت يا اختي يعني الجمعة المفروض استحموا للصلاة و بعيد عنك خرجت بعد ما فوقوني و حرمت و كرهت التعليم"
archived = "2004-08-20"
capture_url = "https://web.archive.org/web/20040820085032/http://www.20at.com:80/article.php?sid=544"

