[[comments]]
order = 5
subject = "اللهم انصر الإسلام و اعز المسلمين"
author = "mr:designer"
posted = "2006-08-31"
text = "يا من تنتحل شخصية وائل عباس و تقول ان المسيحية ديانة سمحة و ان الأسلام دين التعصب و التطرف و الإرهاب فانني لن ارد عليك بسب المسيحية لاننا من اسس ايماننا بالله الايمان بالرسل جميعاو جميع الديانات التي انزلها الله سبحانة و تعالي و ختمها بأفضلها و احسنها وهو الأسلام فالدين عند الله هو الاسلام فانت بالتأكيد لم تكن مسلما و لم تتذوق للإسلام طعما و انما انت مجرد شخص جاهل عمتك عاالدنيا عن ادراك حقائق ابانها الله سبحانه و تعالي حتي ليراها الطفل الصغير و يدركها حينما يتسائل او يسال امه او ابيه عن من اتي بالسماء او من هو الله او ماذا يعني الله ؟ و اذا كنت تدافع عن مسيحية عيسي عليه السلام فقد بشرت مسيحية عيسي بقدوم الاسلام و اذا كنت تدافع عن مسيحية اليوم فاريد ان اذكرك انها ليست المسيحية التي اتي بها نبي الله عيسي عليه السلام فقد حرفها رهبانكم و قساوستكم حتي تتماشي مع دنياهم و افعالهم و كفانا ان يذكرنا التاريخ بالحملات الصليبية علي المشرق حتي تعرف ان كانت المسيحية المعاصرة سمحة ام لا و كفاك ما يحدث اليوم من الغرب الاوروبي و الامريكي ذي الاغلبية المسيحية ان تبيم لك اي السبيلين ارشد و ايهما اكثر سماحة<br />اللهم رد كيدك في نحرك و انتقم لنا منك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131645/http://www.20at.com/article2.php?sid=1163"

[[comments]]
order = 6
subject = "هو انا بقيت مايكل جاكسون"
author = "وائل عباس"
posted = "2006-08-31"
text = "فيه إيه يا جدعان<br />هو أنا بقيت مايكل جاكسون خلاص ومشهور كده علشان كل الإشاعات دي تستهدفني<br />وبعدين الناس تتصل بيا علشان تتأكد من صحة الإشاعة ؟؟؟<br />بتتصلوا بيا ليه يا جدعان؟؟؟<br />كل حاجة عني معروفة!!!<br />ما تصدقوش غير اللي بأنشره على الوعي المصري واللي بأبعته في الإيميلات كل يوم<br />الموضوع أبسط من كده !!!<br />أنا مش من كام يوم نشرت تحذير إن ده بيحصل !!!<br />محدش بيسمع الكلام ليه !!!<br />وانا مش بأدخل أعلق في أي مواقع ولا مدونات خالص ولو كنت بأعمل كده فأنا بطلت !!!<br />أسخف تليفون جالي النهاردة واحدة بتسالني هو إنت صحيح غيرت ديانتك وبقيت مسيحي كاثوليكي ؟؟؟<br />وناس إمبارح في وسط البلد بتعزيني علشان أبويا مات وانا ما أعرفش !!!<br />أه والله مع إني لسه سايبه في البيت النهاردة الصبح !!! سبحان الله !!!<br />وواحد بيهنيني علشان كسبت جايزة كريستيان ساينس مونيتور لأحسن مصور من العالم الثالث<br />مع إن على حد علمي مافيش جايزة إسمها كده أساسا !!!<br />ولا فيه حد من كريستيان ساينس مونيتور عبر أهلي ولا إتصل بيا يعني !!!<br />وقبل كده حد معلق بإسمي بيشتم الإخوان<br />ما انا لو عاوز أشتم الاخوان ما أنا شتمتهم لما شبعت زمان!!!<br />دلوقت بانتقدهم بس وبانشر النقد ده على الوعي المصري على عينك يا تاجر<br />عندي موقعي بحاله أبرطع فيه<br />إيه يزنقني اروح أشتم الناس في التعليقات عند ناس تانية يعني !!!<br />وواحد تاني بيدعو باسمى لمظاهرة لحرق القران في ميدان التحرير!!!!!!<br />وبعدين يرجع يرد على نفسه ويقول هو وائل ملحد آه بس ما يعملش كده !!!!!!<br />قال يعني فيه حوار والناس بتتفاعل معاه !!!<br />وواحد بيكتب باسمي على اني مسيحي بروتستانتي<br />وواحد بيشتم في الاسلام باسمي<br />الظاهرة دي ابتدت على الضيق في المدونات في التعليقات والتشات بوكسيز<br />دلوقتي انتقلت للمواقع الاخبارية ومواقع اقباط المهجر<br />زي العربية وايلاف وعشرينات والاقباط المتحدون<br />وناس باعتالي بتهنيني على اعتناق المسيحية وبتشكر دفاعي عن حقوق الاقباط !!!<br />اللي ناقص يبقى عندي مزرعة زي مايكل جاكسون<br />ويقولوا اني بانام في غرفة اكسجين<br />ومربي قرود<br />وحد يتهمني بالتحرش الجنسي باطفاله<br />واني عامل مقام لستنا اليزابيث تايلور في بيتي !!!<br />واتجوز بنت الفيس بريسلي !!!<br />ايه الهبل ده !!!<br />قد كده فيه حد او ناس متضايقة مني وعاوزة تشوه صورتي وتكسبني عداوات !!!<br />ربنا يشفي كل مريض !!!<br />والهي اللي بيعمل كده يجيله حمى الوادي المتصدع علشان ما يصدعناش تاني !!!<br />وياريت الناس تعقل بقى<br />ولما ابويا يموت هابقى أقولكم !!! وهاعمل صوان واجيب مقريء يقرا القرآن مش يحرقه علشان أنا لسه مسلم ومؤمن زي بالضبط كده الرئيس المؤمن اللي إنتم عارفين إني باحبه !!!<br />إيه القرف ده !!!<br />وائل عباس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131645/http://www.20at.com/article2.php?sid=1163"

[[comments]]
order = 7
subject = "موسى نبى وعيسى نبى ومحمد نبى وكل من ليه نبى يصلى عليه"
author = "مصرية"
posted = "2006-09-05"
text = "واللهى الموضوع حلوجداوبصراحة هذه الوصاية إن دلت على شىء تدل على اننا فى زمن سقطت منه جميع القيم الانسانية وجميع الاخلاق حسبى الله ونعم الوكيل فيهم ولو كانت الديمقراطية عندهم كدة تبقى دى مش ديمقراطية دى تبقى بتنجان وياريت للاخ اللى منتحل شخصية وائل عباس ياريت متعملش مشاكل طائفية وعلى فكرة الرسول (صلى الله عليه وسلم)وصانا على الاقباط ولو هما دلوقتى محرفين فى دينهم فأحنا مالناش دعوة ربنا هو اللى يحاسبهم وبعدين يعنى ياريت نعمل بوصية الرسول(صلى الله عليه وسلم) وياريت كمان نعمل بالاية الكريمة \"لكم دينكم ولى دين\"وربنا هو اللى هيحاسب كل واحد على اعماله وبلاش يا جماعةنحقق حلم اليهودوالامريكان وحلمهم انى هما يعملوا مشاكل طائفية زى ما حصل مابين اهل السنة والشيعة فى العراق علشان بعد مايعملوا مشاكل طائفية فى البلد يحتلوها هماواحنا فى الاخر مسلمين على مسحيين ولكم دينكم ولى دين وللاستاذ designerالامريكان دول اصلا شوية حيوانات والحيوانات مالهومش ديانةصح ولا مش صح<br />معلش طولت عليكم<br />يالا سلام<br />\"موسى نبى وعيسى نبى ومحمد نبى وكل من ليه نبى يصلى عليه\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131645/http://www.20at.com/article2.php?sid=1163"

[[comments]]
order = 8
subject = "الاسلام اولا واخرا"
author = "فلسطينية"
posted = "2006-09-06"
text = "أولا اريد القول بأنه اي دخيل حاقد لن يستطيع اقناع شباب واعي بإدعائاته الباطلة .<br />ثانيا اريد القول بان كل الدعم والقوة الاعلامية التي بحوزت اسرائيل سببها التخاذل العربي فنحن من سنة 48 ونحن نعلم بقوة اسرائيل والدعم الامريكي- الاوروبي لها ومع ذلك لم نتوقف يوم عن الدفاع والمطالبة بحقوقنا مع طبعا الامل من الاخوان العرب المساعدة وبهذا السياق اود شكر جميع الزعماء العرب على وقوفهم وشدهم لايادينا بمحاولة منعنا من استرداد حقنا والاكتاء بوعودهم الكاذبة وباضافة الى استنكارهم واحتجاجهم ومشكورين - بنسبة لحزب الله اقول لهم الله معكم وينصركم ويقوكم رجعتولنا الامل ان في حدى عربي بيقدر يعمل ايشي وبطلب من لبنانية خليكم مع بعض وما يفرقم لا حزب ولا دين ولا رأي وإلا بضيع لبنان متل ما ضاعت فلسطين والعراق والدوار جاي على الكل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131645/http://www.20at.com/article2.php?sid=1163"

[[comments]]
order = 9
subject = "حسبى اللة ونعم الوكيل"
author = "حكمت على احمد حسن"
posted = "2006-09-10"
text = "يا سيدى الفاضل الوصايا العشرة دول احنا حافظنهم عن ظهر قلب وماشاء اللةحكامنا بينفذو بالحرف الواحد وماشيين على السراط المستقيم معالمحروقة اللى اسمها امريكاواسرائل ربنا يولعهم بجازوسخ كلهم هما وحكام العرب الافاضلوالنظمة العربيةبلا استسنىوهما اصلا هيروحو من ربنا فين دول ناس فقدو كل معنى للانسانية والرحمة بس طول ما فية ناس بتكتب وناس بتفكر مش هنسيبهم حتى لو الثمن هيكون حياتنا لان ببساطة لا حياة بدون كرامة ولا احترام قلتها احسن وتانى ربنا يولع فى امريكا واسرائيل والحكام العرب بكراسيهم بجاز وسخ علشان النضيف خسارة فيهم حكمت على احمد حسن امينة لجنة المراة الاسماعيلية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131645/http://www.20at.com/article2.php?sid=1163"

