[[comments]]
order = 2
subject = "بيرو"
text = "البطل محمد البرادعي مشغول هذه الايام جدا وهويعد انه بمجرد اغلاق ملف العراق والانتهاء من ملف ايران وسوريا والسعودية ومصر سوف..... يستقيل لأن كفاية عليه كده البرادعي مين الموضوع لن يحل الا برجال حماس ... المقال أكثر من رائع لكن في أنتظار المزيد"
archived = "2004-09-26"
