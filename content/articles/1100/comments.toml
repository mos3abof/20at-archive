text = "يا عغبده و يا مودى و يا كل الناس اللى معترضه على الموضوع ده بسبب الاحداث الجاريه بقولكم ده متنفس ليتا وسط كل اقرف اللى احنا فيه من اهاته للرسول و من غرق العباره و من و من ومن<br />نضحك و نسمع اغانى بدل ما نصوت ف الشوارع و نتجنن او نموت ف عز شبابنا زى فقيد الشباب احمد اكرامى اللى بدعى نقرا له الغاتحه<br />و بانسبه لى بنصح الناس تسمع بعد كل اغانى فيروز اغنيه حلوه و قديمه لحنان ماضى اسمها امتى الاكلام يبتدى<br />و ضحك بدل ما نطق على راى السندريللا"
