[[comments]]
order = 23
subject = "الجنة تحت اقدام المفخخات"
author = "عواد العراقي"
posted = "2006-09-29"
text = "هل سمعتم يوما ان مجاهدايهوديا او امريكيا قام بوضع سيارته المفخخة في سوق مزدحم وبين مواطنيه وفجرها وهو يصرخ الله واكبر او اخر يقوم بتكفير اخوانه ويتلوا اية ثم يستل سكينا وينحره ويحز رقبته كشاة ولو حصل هذا ماذا كان رد فعل الزرقاوي وبن لادن وشلتهم العفنة .الم يقدموا احتجاجهم لليهود والامريكان بحجة سرقة ابتكارهم في مجال الذبح والتكفير .<br />اللعنة على كل عفن يحمل فكرا كالزرقاوي وبن لادن والظواهري ومن لف لفهم اللذين يكفرون ويزهقون ارواح الابرياء بلاحق ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"

[[comments]]
order = 24
subject = "لعنة انت يا عواد العراقي"
author = "ابو عمر المجاهد"
posted = "2006-09-30"
text = "أرد على كلام القبيح عواد العراقي حرف حديث الرسول عليه الصلاة والسلام<br />الجنة تحت أقدام ألأمهات وهذه الرافضي عواد يقول الجنة تحت المتفجرات من قال لك هذه الكلام<br />الزرقاوي رجل دين وأسلام لماذا تقول عليه هذه الكلام رحم الله أبا مصعب الشهيد<br />ابو مصعب دمر حسينيات الروفض وهذه يعتبر القضاء على الشركيات والخرافات عند الروافض نسئل الله ان يتغمده بواسع رحمته ويسكن عظامه الجنة يارب يكفي انه شهيد<br />وانشاء الله تشوفون بأسامة بن لادن كل خير في تدمير الأماكن التي يوجد بها اليهود الصهاينة والقضاء على البدع والشريكيات<br />والله يحفظه أيمن الظواهري العضو الثاني في تنظيم القاعدة التي أرهبت الروافض والأمركان الله يساعدهم وهذول مجاهدين لا شك في ذلك ونسئل الله ان يجعل من يريد في تنظيم القاعده شر ان يجعل كيده في نحره<br />رحم الله ابا مصعب الزرقاوي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"

[[comments]]
order = 25
subject = "شوف بعينك وارحم بقلبك"
author = "عواد لعراقي"
posted = "2006-10-03"
text = "ابو عمر المنافق اراه من الزناديق التكفيريين ومثل هذا النموذج العفن اللذي ليس له ولاء لا لدينه ولالوطنه ولا للانسانية فلو كان لديه ولاء لدينه لما انجر وراء مجرمين قاموا يقتلون اخوانهم المسلمين اكثر من غيرهم وبوحشية كلمجرم الزرقاوي العفن اللذي تفنن باساليب قتل الشعب العراقي وبدون تميز وامثالك ليس له ولاء لوطنه وبدلا ان تشجب مثل هذه الافعال التي تعرض الوطن للانتهاك واعطاء المبررات للتدخل الاجنبي كما حدث لجثمان الزرقاوي العفن اللذي قتله جنود امريكان قدموا من خلف البحار والميحطات واقتادوا جثته العفنة ليرموها بمزبلة التاريخ وبفرح بالغ غمر الشعب العراقي اللذي تخلص من هذا العفن وانت يابو عمر النافق بدلا من جلوسك خلف انترنيت اسيادك الامريكان انصحك بلذهاب لقتال الامريكان او ابقى خلف الانترنيت وانت صاغر وذليل وعفن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"
