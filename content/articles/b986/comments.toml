order = 1
subject = "وهم القاعدة"
author = "kuki"
posted = "2006-06-25"
text = "اعزائي يجب معرفة اسم القاعدة كيف اطلق على ذلك التنظيم الارهابي المنافي لاخلاق الاسلام والشريعة السمحاء فااسم القاعدة اطلقه علماء امريكان من المخابرات الامريكية لتنظيم ارسال المنحرفين لغرض مقاتلة الروس في افغانستان ولدعم هؤلاء المنحرفين والمرتزقة قاموا هؤلاء العلماء بنتظيم قاعدة بيانات تحوي اسمائهم واوصافهم وكيفية صرف رواتبهم لتفجير اجسادهم النتنه والعفنه باأسم الاسلام والكل يعرف ان الاسلام منهم براء كبراءة الذيب من دم يوسف عليه السلام فهؤلاء الجرذان من ذلك الوكر الحقير فلامريكان هم اسياد بن لادن والملا عمر وغيرهم من الشراذمة القذرين والمنحرفين خلقيا وهاهو الملعون الزرقاوي كان في صغرة ازعر والكل يعرف بذلك وامه مومس معروفة في جميع منطقة الزرقاء وهو ارسل رسالة لامه ينهاها عن معاشرة الرجال والكف عن الحيث اليهم فهذا الفاسق من تلك الفاجرة وتنظيم القاعدة الوسخ من تلك القذارة المسماة امريكان والسلام على من اتبع الهدى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"

