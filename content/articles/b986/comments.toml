posted = "2006-07-08"
text = "لايجب الرد علي امثال كيكي الكلب لماذا؟ لنه كما قال الشيخ محمد حسين يعقوب ماذا يفعل نبيح الكلاب في قمر مضي لايبهت نوره ابدا كذاللك الاسلام بدر مضي لايتاثر بهؤلاء ابدا ملحظه في التعليق السابق لي هناك كلمه ذائده وهي نستهديه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"

