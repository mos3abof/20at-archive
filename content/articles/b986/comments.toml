author = "ابو مصعب المغربي"
posted = "2006-07-04"
text = "اقول للمخنت كيكي ان يتراجع عن اقواله الكادبة الا تعرف بانك تستهزء بالمجاهدين وان هدا كفربالله عز وجل .....اتق الله وعد الى دين الاسلام واسمع النصائح وكن متواضعا...والرسالة التانية لمن يقول ان الشيخ اسامة قد مات فهداك الله وتب الى الله لان الشيخ اسامة يسعى لاعلاء كلمة لا اله الا الله وانت تجلس امام الحاسوب لتحاربه انت وكيكي المخنث بدلا من الدعوة لنصرة المجاهدين تحاربونهم لاتارة الفتن والفتنة اشد من القتل ...واتقو الله والله غفور رحيم واقول قولي هدا والسلام على من اتبع ملة ابراهيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"

[[comments]]
order = 10
subject = "وداعا أيها البطل"
author = "عاشق الشهادة"
posted = "2006-07-04"
text = "كنت لا أزال في عملي حين فتحت المذياع ففوجئت بنشرة تخبر عن مصرع الزرقاوي فلم أعر للموضوع انتباها وحسبت أنها من المناورات التي تعودنا على سماعها من الأمريكان وأذنابهم ...ولم تمض سوى ساعة حتى جائتني رسالة على جوالي تقول \"إنا لله وإنا إليه راجعون اللهم أجرنا في مصيبتنا واخلفنا خيرا منها \"<br />لم أصدق أيضا وبعد نصف ساعة جائتني رسالة أخرى تقول \"قال يا ليت يعلمون بما غفر لي ربي وجعلني من المكرمين \"هنيئا لهم لقاء الاحبة محمدا وصحبه \"اغرورقت عيناي ولم أصدق بعد وكان زملائي في العمل من الرافضة عليهم من الله ما يستحقون فكتمت دموعي ولم أزل بين الرجاء والخوف حتى عدت إلى المنزل وشاهدت صور البطل وقد ترجل عن فرسه اغرورقت عيناي وأجهشت بالبكاء وقد مر أمامي شريط المجاهدين الابطال وذكرياتهم ... رحل الذي أمتعنا بخطبه .. رحل الذي لا تزال كلماته تدق في ذاكرتي كلما تراءى أمامي شئ من أثر الجهاد والمجاهدين في سبيل الله ..رحل الذي ذكرنا بابي دجانة رضي الله عنه ... رحل الذي قد أذاق الكفار الويلات ومن عاونهم ..انهالت دموعي وحاولت استعادة رباطة جاشي ولكن الدمعات كانت أقوى مني فلا زلت أنفس بالدمعات بين الحينة والأخرى ...صليت صلاة الغائب وأجهشت بالبكاء ... حقا صدق من قال إن دم الشهيد نور ونار فإنه والله نور ينير لنا الدرب و نار سوف تلفح أعداء الله سبحانه وتعالى بإذن الله ...مازال الله يغرس غرسا يستخدمه في طاعته ...وأستخدم هنا كلام البطل المجاهد الشهيد بإذن الله نحسبه والله حسيبه ولا نزكي على أحدا أبو مصعب حين نعى أخاه ورفيق دربه الشيخ أبو انس رحمه الله \"والله إن سؤلنا لننطقن وإن استشهدنا لنشهدن أنك كنت خير حامل راية وكنت عاملا عالما مجاهدا في سبيل الله فسلام على روحك في الخالدين \"<br />عين جودي بدمعك الرقراق<br />واسكبيه على أعز الرفاق<br />لا تلمني على البكاء فإني<br />قد وجدت البكاء حلو المذاق<br />إيه يا زرقا قد فقدت عزيزا<br />فكسيت الاحزان كالأطواق<br />تقبل الله شيخنا في عداد الشهداء وأسكنه فسيح جناته ورفع قدره وحشره مع الانبياء والصديقين والشهداء والصالحين وجعله من الذين يضحك إليهم ربك وإذا ضحك ربك إلى عبد فلا حساب عليه أبدا ...<br />وداعا أيها البطل<br />بفقدك تدمع المقل<br />ونسأل ربنا المولى بأن نلقاك في وطن<br />بدار مابها ملل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"

[[comments]]
order = 11
subject = "نعم للتنظيم ولاللتكفير"
author = "ابو حذيفه محمد بن حسين"
posted = "2006-07-08"
text = "ان المد لله نحمده ونستعيبه ونستهديه ونعوذ بالله من شرور انفسنا ومن سيئات اعملنا من يهده الله فلا مضل له ومن يضلل فلا هادي له اما بعد انا اخوكم في الله محمد بن علي من مصر بلد الشيخ المجاهد ايمن الظواهري اقول نعم للجهاد الاسلامي ضد العدوان علينا ياامه محمد اياكان الاسم الذي نجاهد تحته لاننا نجاهد تحت رايه الاسلام واقولها صراحه نحن نويد وسنظل نويد تنظيم القاعده واقول لالالالا للتكفير كلنا مذنبون وليس كل من فعل ذنب فهوكافر وادعو الله ان ينصر المجاهين في كل مكان وصلي الله علي سيدنا محمد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"

[[comments]]
