[[comments]]
order = 0
subject = "المقال مليئ بالمغالطات"
author = "ابو دجانة"
posted = "2006-06-25"
text = "بسم الله الرحمن الرحيم والحمد لله رب العالمين كما ينبغي له أن يحمد جل في علاه والصلاة والسلام على الصادق الأمين النبي الأمي قائد الغر المحجلين سيدنا محمد وعلى آله وصحبه أجمعين .<br />كما هو ظاهر على موقعكم أنه يحاول أن ينافس المواقع الأخرى بطريقة ملتزمة وطيبة وقابلة للتصفح والقراءة بعيدا عن المحرمات ، وإن هكذا إعلام يسعى لطيب الأمور يجب أن يكون ذا مصداقية عالية وذا معلومات حقيقية بدون تدليس وتلفيق بدون قصد أو بقصد لاختلاف الفكر والاختلاف مع الفعل أو ما يخفى علينا ولا يخفى على الله ، ولعل كاتبتا المقال قد غفلتا سهوا أو عمدا عن الآية الكريمة \" ولا تقفو ما ليس لك به علم إن السمع والبصر والفؤاد كل اولئك كان عنه مسؤولا \" .<br />وبما أني من المتابعين عن كثب وعن قرب لعمليات القاعدة ولبياناتها واصداراتها ولي علاقات مع أفراد شاركوا القاعدة في جهادها فإنه لزاما علي أن أبين لكم النقاط الخاطئة التي وقعتم بها فإن استجبتم وعدلتم تلك المغالطات فأنتم نعم الإخوة وهذا ظني شخصيا وإن لم تستجيبوا فحسبكم أن تعلموا أن الله تعالى يقول \" من عادى لي وليا فقد آذنته بالحرب \" .<br />بداية سأفند المغالطات واشرحها واحدة واحدة على حدة .<br />وهذا اقتباس أول<br />\"وتعجب أكثر المحللين من هذه العودة السريعة لرفع الزرقاوي إلى درجة الإمارة بعد محاولات التنصل من أفعاله وخاصة من جانب الظواهري.\"<br />الزرقاوي أعلن الشيخ أسامة بن لادن أنه أمير تنظيم القاعدة في بلاد الرافدين وذلك من خلال تسجيل صوتي للشيخ أسامة تم بثه على قناة الجزيرة وقناة الجزيرة حصلت عليه من شبكة الحسبة المصدر الرئيس والوحيد لبيانات وتسجيلات القاعدة والتنظيمات المجاهدة في العراق .<br />وعليه فإن الشيخ أبو مصعب الزرقاوي لم يرفع من الإمارة حتى يعاد إليها .<br />أما المناصحة التي كانت من الشيخ أيمن الظواهري للشيخ أبو مصعب رحمه الله ، فلم يكن فيها تنصل كما ادعى الامريكان والتسجيل الذي تحدث عنه الأمريكان مكذوب وليس له أصل وأنا اتحدى أن يأتونا بهذا التسجيل .<br />وفي النقطة التي تليها من المقال تتحدثون أن الأمريكان استغلوا أفعال الزرقاوي مادة أعلامية لتشويه صورة المقاومة العراقية عموما ، وكأني بكم تصدقون كل ما ينسبه الأمريكان للمجاهدين الأبرار والذين وبكل فصائلهم نعوا القائد المجاهد أبو مصعب الزرقاوي ، فهل لي بسؤال ، هل سمعتم عن أبو غريب وما يحدث فيه ، مؤكد سمعتم كيف توفقون بين تصديقكم للأمريكان وبين كذب الأمريكان بإدعاء الحرية والديموقراطية وحقوق الانسان ؟ اعتقد أن من يكذب في هذه يكذب في تلك ، ثم لما تغضون الطرف عن أكثر من حادثة كان الأمريكان فيها خلف تفجيرات في الاسواق العامة والمساجد ، لماذا لا تقبلوا رواية المجاهدين وتقبلوا رواية الأمريكان والمتأمركين والسذج ؟!!<br />قبل أن تقولوا شيئ تبينوا فإن تعسر عليكم علمه فلا تأولوه حسب الهوى والمزاج فإن المرء يقول الكلمة لا يلقي لها بالا فيهوي بها سبعين خريفا في نار جهنم .<br />وهنا الاقتباس الثاني<br />\"أعلن الدكتور \"حذيفة\" نجل القيادي السابق في تنظيم القاعدة \"عبد الله عزام\" يوم 4/4/2006 أن المقاومة العراقية (جناح المجاهدين العرب) قررت \"كف يد أبي مصعب الزرقاوي عن الملف السياسي في تنظيم القاعدة في بلاد الرافدين\"<br />أولا حذيفة عبد الله عزام لا علاقة له البتة بتنظيم القاعدة وثانيا الشيخ عبد الله عزام لم يكن قياديا في تنظيم القاعدة وهو اخواني فلسطيني الأصل وكان مؤسس مكتب المجاهدين العرب في باكستان وكان على علاقة طيبة بقادة الجهاد الأفعان والشيخ اسامة لكنه لم يكن من القاعدة والاستناد على كلمات حذيفة المثير للجدل ، لا أساس له لأن التنظيمات العراقية لها علاقات طيبة بتنظيم القاعدة ولهاعمليات مشتركة وان كنتم تتابعون الأمر عن أهله ومصادره الحقيقية فإنكم سترون حتما أنكم على خطأ فبيانات القاعدة ليست بعيدة وشبكة الحسبة معروفة .<br />وفي النهاية ليس مطلوبا منكم أن تؤيدوا القاعدة ولكن مطلوبا منكم أن تتحروا الصدق فيما تنشروا عن المجاهدين ودمتم في رعاية الله ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"

