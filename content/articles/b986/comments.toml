[[comments]]
order = 20
subject = "رحم الله الزرقاوي وأسكنه جنات الخلد"
author = "أبو عمر المجاهد"
posted = "2006-09-11"
text = "رحم الله شهيدنا الملقب أبو مصعب الزرقاوي وهو شهيد بأذن الله وكان مجاهد عظيم حارب اليهود ولاحقهم في كل مكان ودمر الكنائس اليهودية والكنائس الشيعيه والملقبة بي الحسينية من اين لنا ابو مصعب رحمك الله يا ابو مصعب الزرقاوي اللهم عوظنى برجل مثله يدافع عن دينه ومذهبه رحمه الله رحمة واسعه وأرجو من الرافضة السكوت معى احترامي الشديد لانهم خونة والله يعوظنا خير في أسامة بن لادن وأيمن الظواهري كلكم قولو أمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"

