[[comments]]
order = 6
subject = "حي على الجهاد"
author = "رائد بغدادي"
posted = "2006-07-02"
text = "انا متفق مع الاخ ابودجانة في المغالطات التي وردت في المقال وتفاجأت لان الاخت الكاتبة حذرة ومتمكنه في كتاباتها السابقة فأرجو الانتباه الى هذا السهو والذي ارجو ان يكون سهوا ..<br />ان المقاومة الشريفة في بلاد الرافدين تزداد عزما وقوتا بأذن الله يوما بعد يوم وما زادها من أستشهاد أمير المجاهدين في العراق تغمده الله فسيح جناته الى صمودا وتصميما على الشهادة في سبيل الله الى أن يتوج الله صمودهم بالنصر المبين وتحرير العراق من أحفاد القردة والخنازير هذا ماحصل فعلا فلقد تطوع الالاف من العراقيين الشرفاء وأنظموا الى المقاومة الباسلة بعد أستشهاد الامير وهاأنتم ترون اليوم فشل المحتلين يتوسلون عن طريق اذنابهم من الذين باعوا الدين والوطن بثمن بخس وانخرطوا في الحكومة المرتزقة يتوسلون بالابطال المجاهدين بما أسموه بالمصالحة الوطنية والتي لاتدل الا على مدى فشل أمريكا ومدى وعورة المستنقع الذي رموا أنفسهم فيه فالمصالحة كتبها السفير الامريكي وقدمت بلسان الحكومة العميلة .<br />أما بالنسبة الى المخنث الذي علق على الموضوع أقول له أرجو ان تعلق على هكذا مواضيع عنما تتأكد من نفسك رجل انت ام أمرأة حتى نعرف نوع اللغة التي نكلمك بها<br />لاترمي الناس الباطل ..فأين انت من أسد الاسلام وشيخ المجاهدين .أين انت من امير الشهداء وان كنت لاتملك الدليل على ماقلت من باطل فأعلم ان الله سيقتص منك يوم لاينفع مال ولا بنون .((وقفوهم انهم مسؤولون))والحمد لله رب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"

[[comments]]
order = 7
subject = "الرد على افتراء المشاركين على الامام ابو مصعب الزرقاوى"
author = "عبد الله"
posted = "2006-07-03"
text = "بسم الله الرحمن الرحيم<br />الحمد لله رب العالمين ناصر المستضعفين بعدله قاهر المشركين بقوته غالب المنافقين بمكره اما بعد.<br />فالى اخى فى الله (ابو دجانه) لقد جعلتنى كلماتك احمدالله ان هناك فى هذه الامه من لا يزال يغار عليها و يرجو لها العز والكرامه بعد الذل والهوان الذى الحقه بناتلك الانظمه الشركيه التى ابتعدت عن شريعه الله سبحانه وتعالى والتى احتكموا فيها للطاغوت وتركوا الدين الحق ليتلاعب به المنافقين الذين عبدوا الدنيا والدرهم وتركوا الله الواحد الاحد وتناسوا ان العاقبه باذن الله للمتقين.<br />والى الذين يتهكمون على الاخوه فى تنظيم القاعده والذين لا يعلمون عنهم سوى اسم التنظيم فقط ولا يعرفون اصله ومن اين اتت كلمه القاعده فالتنظيم سمى بهذا الاسم وذلك لقيام الشيخ المجاهد اسمه بن محمد بن لادن بعمل قاعده بيانات للقادمين للجهاد فى افغانستان بها اسماؤهم وسكنهم واسماء ذويهم واسماء الشهداء حتى يعلم بهم ذويهم. فالى الذى كتب عن المجاهدين اجساد نتنه فما هى الاجساد الطيبه اذن ومعنى كلامك ان اجساد الصحابه نتنهوكل الذين جاهدوا فى سبيل الله وانى لاستشعر فى كلامك حقد صليبى للاسلام او نفاق لاهل الاسلام<br />فها هم اسود تنظيم القاعده يدافعوا عن الامه الاسلاميه التى تركت ليعبث بها الانتان من الامريكان وعملائهم من الخونه والمنافقين.فاسود القاعده وعلى راسهم الشيخ اسامه بن محمد بن للادن والدكتور ايمن الظواهرىو القائد ابو حفص المصرى وغيرهم الذين جاهدوا الروس فى افغانستان و الشيشان وتركستان وطاجيكستان ودحروهم بلا اله الا الله فاين كانت الانظمه الديموقراطيه التى تدافع عن الانسان وعن حقوقه يوم كانت الطائرات والمدافع تدك بيوت الامنين وتقتل الاطفال والشيوخ والنساء ام انه افتراء منكم وحقد دفين على الاسلام<br />فهل كان الاتحادالوفيتى سيترك افغانستان من اجل كلمات مثل حقوق الانسان و الانسانيه المعذبه ام انه هرب بنفسه لينجو من ضربات المجاهدين.<br />من الذى دافع عن العراق وعن اخواتنا فى سجن ابو غريب انتم يااصحاب الموقراطيه ام المجاهدين فى العراق من ابناء تنظيم القاعده واخوانهم فى الجمعات الاخرى<br />الم يكن الشيخ المجاهد ابى مصعب الزرقاوى هو الذى اراد ان يرسل العد والعتاد الى المجاهدين فى فلسطين لولا ان قبض عليه النظام العميل الردنى و تم محاكمته فى قضيه اشتهرت باسم بيعه الامام فبدلا من ان تتبجحوا على الاخوه المجاهدين اقئوا التاريخ اولا وانظروا من الذى اوقف الزحف الصهيو صليبى على المسلمين اليس الاخوه المجاهدين هم الذين كنا نناصرهم وندعوا لهم فى الثمانينات يوم كانت امريكا راضيه عنا.<br />والى اختى (سلمه غيوره)اصبرى واحتسبى الله سبحانه وتعالى فقد نعت من قبلك الطيبون والطيبات باسواء الاقوال ولكن احتسبوا الله سبحانه وتعالى فان الحبيب المصطفى قد نبهنا منذ البدايه انه سوف ياتى يوم على المسلمين القابض على دينه كالقابض على جمره من النار فاصبرى واحتسبى فان الله هو حجسيبك<br />واخر دعوانا ان الحمد لله رب العلمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"

[[comments]]
order = 8
subject = "اخو الموحدين المسلمين لا المدعين المرتدين والمنافقين الاثمين"
author = "ابو مصعب المغربي"
posted = "2006-07-04"
text = "بسم الله الرحمان الرحيم والسلام على من اتبع ملة ابراهيم....اما بعد فلقد رايت بعض تعاليق المرتدين الدين للجهاد تاركين وللمجاهدين مسيئين وللزرقاوي واسامة والملا عمر والضواهري محاربين فلعنة الله على من سب اسود هدا الدين كل مارايته من كتابة يدل على ان هده لافكار المحاربةللمجاهدين هي من صنع علماء السوء للحكومة والطواغيت موالين واقول على من يسب المجاهدين كالزرقاوي واسامة وغيرهان يتراجعو على اقوالهم وان هؤلاء الدين يتسابون ان يتكلمو بالحكمة وان عليهم الا يتركو الغضب يسيطر عليهم واما من يقول ان ابو مصعب سفاح فل يتراجع عن اقواله هده لانه لا يمكن لاخ مسلم ان يدبح اخا مسلما واما ابو مصعب فما كان يدبح الا الخونة والمرتدين والمتجسسين لصالح امريكا هدا هو الصحيح والراجح في القول اما بالنسبة لعلماء الحق فغالبهم في السجون لانهم لا يوالون الحكام الطواغيت في الحكم بغير من انزل الله ولهدا لا تجدهم الا في السجون كالشيخ الدوسري وغيره واقول هدا واستغر الله العلي العضيم لي ولكافة المسلمين الموحدين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"

