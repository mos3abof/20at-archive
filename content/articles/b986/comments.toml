[[comments]]
order = 15
subject = "نصرهم الله .........."
author = "معاذ عبد الجليل"
posted = "2006-07-15"
text = "بسم الله الرحمن الرحيم<br />اسال الله القدير ان ينصر المجاهدين<br />وعلي راسهم المجاه اسامه بن لادن نصره الله وكان في عونه امينيارب العالمين<br />اما حماس التي مراكز دعمها داخل ارباء<br />وامريكاء التي لم تستطع ان ترجع متر واحد من فلسطين<br />وانها ترتكب اخطا فادحه ومنها<br />انها تذهب الي اب قتل ابنه او من هاذا<br />القبيل او متطوع فتقوم باعلان عن اسمه<br />وتكون العاقبه بقتل اسره الشهيد<br />انتم لا تعرفون الجهاد انتم تلطمكم اسرائل فتلطموها لا بد ان يكون الجهاد متواصل وليست لطمه بلطمه انتم مراكز دعمكم في اورباء و امريكاء ولا تفعلون نصف مايفعله اسام بن لادن نصره الله تعالي وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125057/http://www.20at.com/article2.php?sid=986"

