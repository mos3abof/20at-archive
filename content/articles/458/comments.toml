[[comments]]
order = 3
subject = "بلا هيافة .. ولا مؤاخذة"
text = "هل موقع عشرينات عايز يقول لنا انهم ليهم فى الكورة والرياضة كمان .. مش بس دين وحاجات جد ؟!<br />اسمحولى رغم انى شاهدت المباراة واستمتعت بها .. بس انا شايف ان الكتابة عنها نوع من أنواع الهيافة أو هى الهيافة فى أضل صورها<br />شوفنا الماتش خلاص خلصت هنعملها قصة .. وللا هى قصة ؟!"
archived = "2004-11-23"
capture_url = "https://web.archive.org/web/20041123124854/http://www.20at.com:80/article.php?sid=766"

[[comments]]
order = 4
subject = "تصحيح"
text = "معذرة بدل ماكتب الهيافة فى أفضل صورها .. كتبت الهيافة فى أضل صورها .. لذا لزم التصحيح<br />وإن كان الاتنين ما يفرقوش كثيا"
archived = "2004-11-23"
capture_url = "https://web.archive.org/web/20041123124854/http://www.20at.com:80/article.php?sid=766"

[[comments]]
order = 5
subject = "يييييييييوه أخر مرة"
text = "بدل ماكتب ميفرقوش كثيرا كتبت كثيا<br />لذا وجب التصحيح وآخر ملة"
archived = "2004-11-23"
capture_url = "https://web.archive.org/web/20041123124854/http://www.20at.com:80/article.php?sid=766"

[[comments]]
order = 6
subject = "تصدق بالله"
text = "التلات ردود بتوعك دول همه قمة الهيافة ياراجل فيها ايه يعني لما نشوف كورة وعشرينات تكتب عن الكورة غلط يعني ولا حرام"
archived = "2004-11-23"
