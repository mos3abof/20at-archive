[[comments]]
order = 0
subject = "الحوار ده أنا سمعته أكتر من عشرين مرة ده غطي علي مبارة الأهلي والزمالك"
author = "محمد السيد"
posted = "2005-11-30"
text = "عرفوا إن ده فعلا تحول لحديث الشارع ... وكأن الإخوان خلاص وصلوا للحكم ...<br />أو علي الأقل مسكوا لهم كام وزارة ...<br />إمبارح وأنا مسافر ... من اسكندرية للقاهرة والعكس ... طول السكة .. شباب جامعة بيتكلم عن كده ... عن فوز الإخوان في دايرتهم ... أو بلطجة الأمن اللي شافوها ضد الإخوان ... أو حتي علي اللي سمعوه بيحصل للإخوان ....<br />وكل اللي أكلمه عن الانتخابات ... يحول الكلام للإخوان وفوز الإخوان ... ونظام الإخوان .. والضرب اللي بياخدوه ويتحملوه ...<br />الناس فعلا مش مصدقة ... بس كلها بتأمل خير ... ومتوقعين إن اللي جاي أحسن بكتير من اللي فات .... ومستنيين يشوفوا ...<br />ماذا سيفعل الإخوان تحت قبة البرلمان ؟؟<br />وأحنا معاهم مستنيين ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-08-15"
capture_url = "https://web.archive.org/web/20070815045014/http://egyvote.20at.com:80/article.php?sid=92"

[[comments]]
order = 1
subject = "حد حكي لكم حكاية حيوانات الغابة؟؟الحكومة عملت مع الناس كده"
author = "زائر"
posted = "2005-11-30"
text = "ان التعلب متعود كل ما يشوف الأرنب يضربه ويقول له ودنك طويلة ليه ؟؟؟ جميل ....؟؟ جميل ...<br />الأرنب زهق من المعاملة دي ... وقال يروح يشتكي لكبير الغابة ... راح للأسد وشكي له من التعلب .....<br />بعد ما مشي الأرنب ... الأسد نادي علي التعلب وأخده وحده ... وبينصحه ... قال له : يا عبيط !! .... بدل ما كل مرة تضربه علي نفس السبب وتخلي شكلك وحش ... ابحث عن سبب مقنع $ ... كل مرة اخترع حاجة .......<br />مثلا اطلب منه يجيب لك حاجة ولما يجيبها اضربه وقول له مش عايز دي انا عايز التانية ... مثلا قول له : هات لي تفاحة ..... ولو جابها حمراء اضربه وقول له انا عايزها خضراء والعكس ...<br />التعلب ما صدق ... راح نادي علي الأرنب وقال له : هات لي تفاحة ...... راح رد الأرنب و عمل نفسه بيفهم وقال له ........... عايزها حمراء ولا خضراء ؟ ..........<br />قام التعلب ضربه وقال له : ودنك طويلة ليه ؟ ...........<br />يعني الحكومة قالت تحلي الحكاية وتقدم اصلاحات و حاجات كده ...عشان تنجح برضه ....<br />لقت الناس بتتذاكي عليها وبتسقط مرشحيها .... قامت ضاربة الناس ورجعت للأسلوب الأول وقالت لها ودنك طويلة ليه ....؟<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-08-15"
capture_url = "https://web.archive.org/web/20070815045014/http://egyvote.20at.com:80/article.php?sid=92"
