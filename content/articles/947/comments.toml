author = "عبدالرحمن سعد"
posted = "2006-10-18"
text = "تحية للأستاذ البراء .. وأثمن فكرته حول ضرورة الاحتفال الرسمي باستشهاد حسن البنا ..ولكنني شعرت بانزعاج شديد عندما قال:\" أكره في حسن البنا.. إخوانه المسلمين!\".. هكذا بكل بساطة.. علمًا بأن حسن البنا هو الإخوان والعكس .. بمعنى أنه عندما يُُُذكر البنا فإن هذا البناء العملاق الذي قام على يديه يُُذكر معه .. ثم إن البراء يطلق التعميم دون أن يقول أي إخوان يكره؟ هل هم إخوان البنا أم إخوان الهضيبي أم إخوان التلمساني أم إخوان الهضيبي أم إخوان هذه الأيام ولماذا.. أقول له إن الإخوان جماعة بشرية تؤمن بأنها جماعة من المسلمين وليس جماعة المسلمين ، وهم لا يحتكرون البنا بل على العكس يلاقون الويلات بسبب سيرهم على مبادئه .. وحبذا لو وسعت مداركك لمطالعة آثار الإخوان الإيجابية اليوم على المجتمع المصري بدءً من الجامعة وانتهاء بالمسجد .. والخلاصةأنك أطلقت أحكامًا عامة ومطلقة ومتعسفة وهوائية مع أن الإخوان ليسوا قديسين ولكنهم برغم ذلك أشرف ظاهرة تشهدها مصر ، وأطلقت العنان لكراهيتك للإخوان التي عندما عللتها فإنك أوردت أسبابًا واهية.. وكنت - أنا- مستعدًا أن أشاركك فيها لو كانت شرعية أو موضوعية.. مع تحياتي .. والسلام عليكم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125418/http://www.20at.com/article2.php?sid=423"

[[comments]]
order = 28
subject = "شكر لتاريخ الشرف"
author = "شريف وطنى"
posted = "2006-10-19"
text = "شكرا جزيل لكاتب المقال استاذى الفاضل<br />تحيه لك خاصه لقلمك ونطمع فى كتاباتك<br />لسرد تاريخ أحد الشرفاء<br />انا لاانتمى لااى من الاحزاب ولااى جماعات<br />ومكنش ليه الشرف ان اكون من احد الجامعات<br />من اللى ممكن تقول عليهم من الهم مشافو تحت رجليهم ولما بدئد تشوف عنيهم سمعو اللى كتبه الله عليهم.<br />عرفته حبيته وعمرى مهنسا ان عندك لقيته.<br />شكرا لقلمك وما جنيته<br />واسمحلى اقولك فى المره الجيه<br />ولك منى الف تحيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125418/http://www.20at.com/article2.php?sid=423"

[[comments]]
order = 29
subject = "مين يكتب عن مين"
author = "شريف وطنى"
posted = "2006-10-19"
text = "اولا فكره كتابه الفلم فكره عظيمه لاانها تجسد شخصبه ليست شخصيه اعتباريه ولاكنا شخصيه تاريخيه لايعرفها الكثير باكثر من انها شخصيه مؤسس جماعه الاخوان المسلمين<br />فهو يربط بين قلب يعرف معنى الصدق والاخلاص وكان يكره العنف واساليب الكراهيه<br />وكان يبدع فى حبه الى والديه كما ابدع فى تاريخه الوطنى<br />فللكاتب لبد ان يكون له احساس جياش بكل معانيها<br />له قلب ينبض بدقات قلب الشيخ حسن البنا<br />فلو تواجد فهو احق من يكتب مثل هذه القصص . لاان القصه ستكون لشخصيه الشيخ حسن البنا<br />وانت كتبت بقلم لايختلف كثيرا عما اقول<br />واهو تعبير من رجل يحمل الحب بقلبه<br />ويحسن الفاظه ويبدع فى عمله<br />وهو ما نطلبه ان يكون بيننا اليوم<br />لنتعلم ونستفيد ونعرف ما لا نعرفه<br />اكتب للبنا واياك تنام<br />ده انت بتكتب لراجل انسان<br />صاحب رساله وتاريخ منقدر ننسا<br />ووعو تسيبو الفلم ده لزم نحافظ على تاريخ اهالينا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125418/http://www.20at.com/article2.php?sid=423"

