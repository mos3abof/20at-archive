subject = "كلام جميل"
author = "عبدالله مفتاح"
posted = "2006-02-13"
text = "والله المقال جميل فعلا يا براء انا فعلا حاسس ان حسن البنا بتاعنا كلنا مش بتاع الاخوان بس<br />لكن ملاحظه يا ريتك تخلي بالك منها ويا ريت ترد عليا<br />انت كررت حبه للحياة كذا مرة مش عارف انت عايز تقول ايه ؟ ان كان حسن البنا بيحب الحياة فهو حبها عشان يكمل دعوته مش عشان يتمتع بنعيمهاولا عشان متاعها<br />بيحبها عشان بيحاول يصلحها ويحسن ما افسده الاخرون<br />يعني من الاخر حرصه على حياته مش عشانه ده عشان الاخرين متفق معايا؟"
