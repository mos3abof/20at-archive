[[comments]]
order = 16
subject = "فيلم حسن البنا"
author = "اظن انه ان الاوان لكى يخرج عمل سينمائى يتناول تاريخ ودور الامام الشهيد حسن البنا والذى وبلا شك اثر فى تاريخ مصر بشكل خاص بل وفى تاريخ العالم الاسلامى بشكل عام ويرجع ذلك الى التوقيت الزمنى الذى جاء فيه حسن البنا وهو سقوط والغاء الخلافة الاسلامية من سيادة العالم حيث انه حمل على عاتقه رسالة اعادة هذة الخلافة من جديد وهى محاولة وان لم تاْتى نتيجتها حتى الان الاانها وبلا شك تعد من اسمى المحاولات التى تستحق التكريم لا التجهيل وبما ان الشريط السينمائى هو اهم وسيلة حفظ للتاريخ فاْنه وجب علبنا نحن المسلمون سواء شعوب اوحكام ان نعمل على انجاز هذة المهمة الكبيرة وذلك بتقديم كل الاْسهامات التى من شاْنها تعمل على خروج هذا العمل السينمائى للعالم كله فى افضل صورة وتتعدد هذة الاسهامات فى اشكال متعددة والتى منها:"
posted = "2006-03-03"
text = "- اولا تقديم تاريخ هذة الشخصية بكل ما يمكن الحصول علبه من مذكرات شخصية وذكريات مع بعض المعاصرين له سواء من الاخوان المسلمون او من خارجهم وذلك حتى تكتمل الموضوعية فى تقديم الشخصية السينمائية<br />- ثانيا تقديم الدعم المادى سواء من افراد الجماعة التى حملت رسالته من بعده او من الحكومات والهيئات الاسلامية والعربية والتى تاْثرت وبلا شك من اسهامات هذا الرجل وحيث انه ملك ليس فقط لجماعة الاخوان وانما هو ملك لشعوب وحكومات تاْثرت به حتى الان<br />- ثالثاالدعم الاعلامى وهو المسؤول عن تمهيد التربة لاْستقبال هذا العمل الفى بشكل يليق بْاْهمية هذة الشخصية وبدورها فى التاريخ الانسانى فى فترة من اهم واخطر فترات التاريخ الانسانى . ويكون ذلك عن طريق وسائل الاعلام من صحف وبرامج تليفيزيونية تهتم بالحشد الاعلامى ليس العربى فقط وانما الدولى ايضا<br />الدعم الفنى وهو يعنى بتجهيز فريق عمل متخصص من كل عناصر انتاج الفيلم على اعلى مستوى- من كتابة سيناريو الى اخراج سينمائى مرورا بالعناصر الاخرى كالمونتاج والصوت والمؤثرات الخاصة واهم عنصر وهوالعنصر التمثيلى والذى سيقوم باْداء شخصية الاْمام حسن البناالى جانب الشخصيات الاخرى والتى كانت تعاصرة سواء المنتمين له او خصومه. حتى وان كانت هذة العناصر غير اسلامية او عربية- وان كانت عربية مصرية افضل بالطبع- و لكى تنجح الفكرة فلا بد من الاْخلاص فى العمل والا كان هباء منثورا ليس له اى روح كى يعيش فى ضمير الاْمة الى ابد الضهر وهو الامر المراد حيث ان ابناءنا يحتاجون الى تقديم القدوة كى يكون لهم نبراسا لتحقيق الامل الذى من اجلة عمل حسن البنا وهو استعادة الخلافة الاسلامية مرة اخرى ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125418/http://www.20at.com/article2.php?sid=423"

