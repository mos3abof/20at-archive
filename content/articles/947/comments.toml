[[comments]]
order = 10
subject = "بس ليه اكتر من سعد زغلول"
author = "فكرة ان حسن البنا مناضل وبتاعنا كلنا زى سعد زغلول ف حد ذاتها جميلة واول مرة حد يتكلم عنها"
posted = "2006-02-20"
text = "لكنمن ناحية الاخوان-ولو ان ده باعتبره بره الموضوع-براء عمال موش محدد موقف باكرهم لا ما باكرهمش اوعوا تفهموا غلط<br />لا بس انا موش باحبهم<br />كان ممكن تبعد النقطة دى عن مجرى الحديث اصلا<br />كمان ليه بتعتبر انه اكتر من سعدما هو سعد كمان اتبهدل وتعب وطلعت عينوه<br />وكان من الافضل ان الموضوع يحتوى على ملخص لاهداف البنا او كفاحه لان كتير من الناس ما يعرفوش الا انه مؤسس الاخوان وبعضهم بيعتقد ان دى سيئة بالنسبة له<br />كانوا محتاجين يعرفوا انه كان بيكافح الانجليز علشان بعدها يفهموا هو ليه بتاعنا كلنا وتعرض لفلسفته ف الحياة ويمكنهم التفكير فيها بعيد عن موضوع الاخوان او التعصب ليهم او ضدهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125418/http://www.20at.com/article2.php?sid=423"

[[comments]]
order = 11
subject = "حسن البنا السعودي"
author = "تركي"
posted = "2006-02-21"
text = "السيد براء ,,<br />أشكرك في البداية على هذا المقال الجميل عن رمز من رموز البذل والعطاء الإسلامي في العصر الحديث<br />حسن البنا تقبله الله في جنات النعيم<br />وجميع شهداء المسلمين<br />أردت أن أكتب لكم عن \"حسن البنا السعودي\"<br />حسن البنا الذي لم أقرأ له حرف واحد، ولم أعرف شيء عن قصة حياته، ولكن -وياللعجب- أثر فيني أنا شخصياً وفي جيل كبير بأفكاره.<br />عن تأثير حسن البنا في السعودية أحدثكم<br />لم أزر مصر -حفظها الله- أبداً طوال حياتي .. ولكنني رأيت حسن البنا في السعوديه !!!<br />كنّّا ايها السادة لفرط فقرنا وأميتنا -قبل عصر النفط- نعيش في جاهلية كبرى، والدين الإسلامي لدينا كان في كتب و صدور علماء في الحجاز وأطراف المناطق السعودية ذات الحدود البحرية فقط. أما بقيّة المناطق الشاسعة من بلادي فكان يندر فيها العالم، والدين لديهم دين جاهلية يذهبون للصلاة في المساجد كي لا يقطع رأسه أمير بلاده بالسيف-وأمير بلاده لا يفقه شيء في الدين ولكن هكذا تعلم من أجداده- والقرآن لا يحفظ منه إلا آيات قليلات لا تسمن ولا تغني من جوع ..وحتى إذا حفظ من القرآن شيء فلا يتدبر فيه<br />ولا يعلم تفسيره<br />لإنه بكل بساطه لا يعرف القراءة !!<br />وكان يؤدي الشعائر الدينية فقط كي ينجوا من عذاب الله ، ولم يكن يفكر بتطوير أمته الإسلاميه ولم يسمع أيضاً بمسطلحات مثل التضامن مع الشعوب الإسلامية الأخرى، ووحدة الأمة.<br />وبعد الطفرة النفطية والتطور الشديد بدأت تنتعش الحركة الثقافية في بلادي وحوربت الأميّة في المجتمع<br />وخلال سنين قليلة أصبح كثير من المجتمع السعودي مثقف ومطّلع ومتطور ..<br />وفي تلك المرحلة قرأت الكثير عن الأفكار الماركسية والشيوعية والرأس مالية .. وعن القومجيين العرب ومن على شاكلتهم..<br />لم يتأثروا بمثل هذه الأفكار بقدر ما تاثروا بفكر حسن البنا وسيد قطب رحمها وأغلب الرموز الإخوانيه في مصر ..<br />وظهر جيل من الدعاة الإسلاميين يحاربون التشدد \"السلفي\" ويجعلون همهم الأول هو وحدة المسلمين وحمل هم الإسلام ولا تتصورون كيف كان عدد الجماهير في محاضرات هاؤلاء الدعاة<br />وإنتشر الوعي الإسلامي بشكل قوي وقامت صحوه مباركه تترك تشدد الماضي وأفكاره السطحية وتنظر وترجو إلى تقدم الأمة الإنسانية في كافة المجالات<br />والفضل -بعد الله عز وجل- يعود إلى حسن البنا<br />تلك هي قصة حسن البنا السعودي<br />أعجبتكم؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125418/http://www.20at.com/article2.php?sid=423"

