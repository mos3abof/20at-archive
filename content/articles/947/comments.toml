[[comments]]
order = 6
subject = "آخر ما كتبه البنا في حياته"
author = "BeDo"
posted = "2006-02-13"
text = "في 8 ربيع الآخر سنة 1370 = 16 يناير سنة 1951 نشرت مجلة (المباحث) آخر رسالةٍ وجَّهها الإمام الشهيد \"حسن البنا\" إلى الإخوان المسلمين<br />أيها الإخوة الفضلاء: أتقدم إليكم مهنئًا بما كتب الله لكم من توفيق، وما أجراه على أيديكم من خير.. وما اختصكم به من ثباتٍ على الحق، مهما تقلبت الأحداث، وطالت الأعوام.<br />كما أتقدم إليكم مذكرًا بخصائص دعوتكم بين الدعوات، وعظيم تبعتكم في هذه الأوقات.. فاذكروا- أيها الإخوان- أنكم الكتيبة المؤمنة التي انتهى إليها- في هذا العصر المادي المظلم بالشهوات.. الأهواء.. المطامع- واجبَ الدفاع عن كلمات الله ورسالاته، والمحافظة على أحكام شريعته وآياته، ودعوته الإنسانية التائهة في بيداء الحيرة إلى الصراط المستقيم.. فأنتم بذلك تهتفون بأكرم دعوة، وتنادون بأقدس منهاج.<br />أيها الإخوة الفضلاء:<br />إن العالم الآن تتجاذبه شيوعية روسيا وديمقراطية أمريكا، وهو بينهما مذبذب حائر لن يصلَ عن طريق إحداهما إلى ما يريد من استقرار وسلام.. وفي أيديكم أنتم قارورة الدواء من وحي السماء.. فمن الواجب علينا أن نعلن هذه الحقيقة في وضوح، ندعو إلى منهاجنا الإسلامي في قوة، ولن يضيرنا أنَّ ليس لنا دولة ولا صولة؛ فإنَّ قوة الدعوات في ذاتها ثمَّ في قلوب المؤمنين بها، ثمَّ في حاجة العالم إليها، ثم في تأييد الله لها متى شاء أن تكون مظهر إرادته وأثر قدرته .<br />وإن الأربعمائة مليون مسلم الذين تمتد مواطنهم من المحيط إلى المحيط لن يظلوا أبدًا عبيد الاستعمار الذي ضرب عليهم في غفلة من الزمن، وترادف المحن وتطورات الأوضاع العالمية.<br />وإن كل شبر أرض فيه مسلم- يقول لا إله إلا الله محمد رسول الله- هو جزء عزيز من وطننا.. نطلب له الحرية، والتخلص من نير الاستعمار الأجنبي الظالم، ونكافح في سبيل ذلك بكل ما أُوتينا من قوة، وإنَّ هذا الوطن- من حدود إندونيسيا شرقًا إلى حدود الدار البيضاء غربًا- يجب أن ينعم بالحرية والوحدة والسلام في ظل الروابط والنظم والأوضاع التي قررها القرآن الكريم، وهداه إليها الإسلام دينه وعقيدته ونظامه وشريعته.<br />ولقد كان من حسن حظنا أن نشهد ذلك العصر الذي تقف فيه اليهودية العالمية متحدية الأمم العربية والإسلامية.. معتدية على مقدساتنا بالحديد والنار، وإننا لنقبل هذا التحدي، معتقدين أن الله تبارك وتعالي قد ادخر لنا فضلَ مقاومة هذا العدوان والقضاء عليه .<br />الإخوة الفضلاء:<br />إذا كان الكثير من ساسة الأمم العربية الإسلامية وقادتها من تلامذة المدرسة الاستعمارية قد أضاع علينا كل ما أتاحته الحرب الماضية – حرب 48 – من فرص ومناسبات؛ لما طبعتهم عليه عوالم البيئة الاستعمارية التي عاشوا في ظلها من فقر في المواهب، وخوف من الغاصب، وفقدان للثقة بالنفس وبالله وبقوة الشعب، وحرص على الاستفادة والتزود من الجاه والمال والمنصب، وحقد وحسد واختلاف وتردد وإحجام عن أداء الواجب، وفرار من الجهاد إلى إعطاء الدنية وإيثار أساليب الدعة والاستسلام، فإن عليكم أنتم وقد استروحتم نسمات العزة من الإيمان بالله، واستمددتم أرفع معاني القوة من تأييده ونصره أن تتداركوا ما فات، وأن تصلحوا ما أفسد الباشوات والخواجات.. والله معكم وهو لأعدائكم بالمرصاد، ومهزوم مَن يُحارب الله ويغالب القدر، ﴿وَاللهُ غَالِبٌ عَلَى أَمْرِهِ وَلَكِنَّ أَكْثَرَ النَّاسِ لاَ يَعْلَمُونَ﴾ (يوسف: 21).<br />إن الله ميَّزكم بالانتساب إلى الدعوة؛ فاحرصوا على التميز بآدابها وشعائرها بين الناس، وأصلحوا سرائركم، وأحسنوا أعمالكم، واستقيموا على أمر الله، وأمروا بالمعروف وانهوا عن المنكر، وتوجهوا بالنصيحة في رفقٍ ولينٍ إلى الناس أجمعين، واستعدوا للبذل والاحتمال، والجهاد بالنفس والمال، وأكثروا من تلاوة القرآن، وحافظوا على الصلوات في الجماعات، واعملوا لوجه الله تعالي مخلصين له الدين حنفاء، وانتظروا بعد ذلك تأييد الله وتوفيقه ونصره، ﴿وَلَيَنصُرَنَّ اللهُ مَن يَنصُرُهُ إِنَّ اللهَ لَقَوِيٌّ عَزِيزٌ﴾ (الحج: 40).<br />وإن أخص ما أوصيكم به بهذه المناسبة أن يكون شعارنا النظافة: في الضمير والتفكير وفي اللسان وفي السير وفي الثوب وفي البدن وفي المطعم والمشرب والمظهر والمسكن والتعامل والمسلك والقول والعمل، وإنَّ مما أوصى به الرسول- عليه الصلاة والسلام- أمته: \"تنظَّفوا حتى تكونوا كالشامة بين الأمم\".<br />وما أجملها إشارة وأرقها عبارة أن يكون أول فقهنا في العبادات الطهارة.. وفي الحديث الصحيح: \"مفتاح الجنة الصلاة، ومفتاح الصلاة الطهور\"، وصدق الله العظيم: ﴿إِنَّ اللهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾ (البقرة :222"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125418/http://www.20at.com/article2.php?sid=423"

