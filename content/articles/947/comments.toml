subject = "بلاش استفزاز يا براء"
author = "ميدو مشاكل"
posted = "2006-02-12"
text = "لا ادري لماذا يريد البراء استفزار مشاعر القراء بهذا المقدمة التي لا داعي لها علي وجه الاطلاق حيث أن مقاله ليس به ما يثير الخلاف اصلا فالجميع يعلم أن شخص حسن البنا واسلوبه وسيرته أصبحت ملكا عاما فهو شخص للجميع وانا من دعوتك ليكون حسن البنا وتاريخه ملكا لكل المصريين<br />ولكن يا عزيزي لماذا اذن هه المقدمة المستفزة والتي اكرر لا داعي لها<br />هل هي لجلب المزيد من التعليقات المثيرة<br />والتعليقات الغير واعية لمجرد فقط من يحاول أن يقؤرأ المقدمة فقط<br />كنت اودك ان تطرح فكرتك الجميلة دون هذه المقدمة وللمرة الثالثة التي لا داعي لها<br />وادعوا جميع القراء الا يستسلموا لرغبة البراء بالتعليقات الساخنة للتعليق علي المقدمة وادعوهم لتبني فكرته وحملته بان يصبح البنا له يوم مصريا خالصا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125418/http://www.20at.com/article2.php?sid=423"

