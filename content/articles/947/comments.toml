subject = "اسمع للاخر"
author = "وليد الباز"
posted = "2006-03-18"
text = "السلام عليكم ورحمة الله<br />اولا يا استاذه نيفين حسن البنا قتل في عهد الملك ولم يقتل في عهد عبد الناصر<br />ارجعي للقراءة من الاول ولا تكتفي بكتب انيس منصور<br />ثانيا الاستاذ صاحب المقال<br />اريد ان اتعرف عليك اكثر واعلم من اين اتيت بهذه الفكرة عن الاخوان المسلمين<br />اراك لا تعلم شيئا عنهم<br />ولا اقصد الاساءة اليك<br />الاخوان هم احسن الناس اخلاقا وادبا وعملا لخدمة الدعوة الاسلاميه<br />يبدوا انك تتحدث عن آخرين<br />حسن البنا لابد ان يحب ولا يملك المنصف الا ان يحبه وهكذا الذين يؤمنون بدعوتهم خاصة ان كانوا يدعون الي الحق وهل بعد الاسلام حق"
