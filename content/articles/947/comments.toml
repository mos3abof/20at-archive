subject = "وباء الجيل الجديد"
author = "ahmad"
posted = "2006-02-13"
text = "احينا اشعر اننا- ابناء هذا الجيل - نتفلسف بشكل متطرف جدا لدرجة انه عندما تراجع ما تكتب تشعر انك لا تفهم شئ مع انك من كتبه ونخلط فى الاوراق حتى لا نفهم من اين جاء اول الكلام واحيانا عندما نتحدث نناقد كلامنا فى نفس الحورا ولا نعترف ابدا اننا اخطنا وان وجهة النظر الاولى لم تكن صحيحة ناهيك عن احساسك انك الوحيد فى الدنيا وفى الناس اللى تعرفهم اللى فاهم صح ؟<br />اظن ان مرض التفلسف زيادة عن اللزوم سيكون احد اهم الامراض الفكرية المسيطرة على ابناء جيلنا<br />الله يعفينا واياكم من الشر<br />واشوفكم على تفلسف جديد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125418/http://www.20at.com/article2.php?sid=423"

[[comments]]
