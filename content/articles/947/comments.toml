author = "نيفين"
posted = "2006-02-21"
text = "تعرفو ان البراء اشرف ضحكنى اصله فكرنى لما مره اشتركت ف مظاهره للتضامن مع الانتفاضهو اشتركت فيها رغم كل اصحابى اللى كانو رافضين و بيحزرونى لاقتناعهم بمبدا عيش نمله تاكل سكر و عيش ديناصور تنقرض بس انا عملت فيها بطله و كنا ماشيين بنهيف احنا معاك يا شهيد و يا فلسطين يا فلسطين و دخلو المسجد و اغتصبوه قتلو الدره ف حضن ابوه<br />وفجأه<br />اخد الهتاف شكل تانى لقيتهم بيقولو حسن البنا يا شهيد دمك راجع من جديد<br />وقتها كانت معرفتى بالشيخ الجليل سطحيه<br />و هنا وقفت و قلت لا الجبن سيد الاخلاق برده<br />فلسطين اه لكن اخوان و سياسه و رفد من الجامعه لاه خصوصا انى كنت ف طليعه المتظاهرين اقصد المتظاهرات و كلهن من الاخوات<br />بصراحه خفت<br />لان ف مصر اسم الاخوان بيخوف<br />بس الحادثه دى كانت بدايه بحثى ف سيره حسن البنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125418/http://www.20at.com/article2.php?sid=423"

[[comments]]
order = 13
subject = "اخر كلمات حسن البنا"
author = "نيفين"
posted = "2006-02-21"
text = "بعد المظاهره بحثت و سالت لانى كنت عايزه اعرف حكايه الراجل دا<br />و عرفت و مستغربتش لما اكتشفت ان موته او قتله بالاصح كان ف العصر الذهبى بتاع عبد الناصر<br />عبد الناصر حبيب الملايين اللى رفعوه الاخوان على العرش و كان اول حاجه عملها بعد اعتلاؤه السلطه هو القضاء على الاخوان<br />انا مش مع الاخوان و لا عمرى كنت منهم و لا ناويه اذكر بلاوى عبد الناصر علشان انا مش قد دراويشه اللى ممكن يردو عليا بقوه لكن بقول كدا علشان اقولكم اخر كلمات حسن البنا قبل الموت مباشره و دى ذكرها انيس منصور فى كتابه الرائع عبد الناصر المفترى عليه و المفترى علينا<br />كانت اخر كلمات حسن البنا اللهم اجعل دمى لعنه عليه الى يوم القيامه و الهاء عايده على عبد الناصر<br />رحم الله الشيخ الجليل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125418/http://www.20at.com/article2.php?sid=423"

