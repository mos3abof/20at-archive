subject = "نسأل الله الثبات"
author = "مسلم عربى"
posted = "2006-10-22"
text = "هل من كانت عقيدته الطعن فى الصحابه وتسفيه اراء علماء فى الامه ويؤمن بالتقارب مع _الروافض _الذين يلعنون فى اذكارهم اليوميه صحابة رسول الله وعلى راسهم ابا بكر وعمر وعثمان رضوان الله عليهم فى دعوتهم الشهيره \" نتعاون فى مااتفقنا عليه,ونتجاوز عن مااختلفنا عليه)!! أقول ابمثل هذا تفاخر أو تطلب له ما تطلب ؟؟ # دون النظر لجنسيته# كلامى موجهه لفئه مسلمه عندها العقيده النقيه أرقى وافضل من تبجيل 0شخص لم يقدم لأمته غير التحزب والتطاول على الصحابه0!! والله من وراء القصد"
archived = "2006-11-02"
