[[comments]]
order = 12
subject = "تعليق منقول من موقع العربيه"
author = "ظافر شكر"
posted = "2006-04-15"
text = "سيادة الرئيس حسني مبارك..أن الشيعة ينهجون منهج تقليد المرجعيات التي تستنبط الأحكام الشرعية وتجتهد في الفتاوى الشرعية كل حسب أستنتاجاته , تماما كما يفعل الأخوة السنة في تقليدهم ألشافعي وابن حنبل وأبو حنيفة و مالك , الشيعة يقلدون كل من يصل الى من يصل ألى مرحلة الأجتهاد وأستنباط الأحكام الشرعية ويجاز من قبل العلماء الأعلم و تتفق الأمة وتجتمع على علمه..أي أن باب الأجتهاد والبحث في أمور الدين لم تغلق عند الشيعة . وكما تعرفون فأنها أغلقت عند الأخوة السنة و أنحصرت على ائمة المذاهب السنية الأربع..منذ حوالي 1000 عام..لذلك فأن الشيعة يقلدون من تجتمع عليهم الأمة والعلماء بأنهم أعلام الفقه والتشريع ...ومن يصل ألى هذه المرحلة يسمى ب( أية الله العظمى) أو الأمام وهي كما تعلمون أنها درجة علمية دينية..ولكن لا يسمى مقلدوه أتباع مذهب جديد وأنما هم جميعا يسمون أتباع أهل البيت عليهم السلام..و بالتالي فيوجد من هؤلاء العلماء الأعلام من هو عربي ومن هو غير عربي..تماما لآن الأسلام دين الأنسانية وليس دين العربية ....فمثلا يتبع ملايين الشيعة ( عربا وغيرهم) أية الله العظمى الشهيد محمد باقر الصدر وهو عربي ..وتتبع ملايين أخرى ( عربا وغيرهم) اية الله العظمى الشهيد محمد محمد صادق الصدر وهو عربي أيضا ..وملايين أخرى من الشيعة تتبع أية الله العظمى السيد محمد حسين فضل الله وهو وكما تعرفون عربي من لبنان.. تماما كما يتبع الأخوة السنة في الدول العربية وغيرها فتاوى الأزهر الشريف فهل نعتبر مثلا أن الأخوة السنة في السعودية و المغرب و أمريكا وغيرها هم يتبعون مصر في أمورهم الدينية , ؟ الجواب كلا هم لا يتبعون مصر بل يتبعون الأزهر...فهل نقول أن ولاء المسيحيين في مصر للدول المسيحية.. النتيجة التي أرغب في الوصول اليها سيادة الرئيس ان ولاء الشيعة دينيا ليس لأيران أو أي دولة أخرى بل يتبعون ويقلدون أحد علمائهم الذي يعتقدون بأعلميته وليس للدولة التي يحمل جنسيتها المجتهد الملقب بالمرجع والذي يحمل درجة أية الله العظمى.. ونشكر العربية لأنها تسعى دائما للتقرب من الحقيقة...حفاظا على شرف المهنة و حفاظا على دماء الناس..وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141546/http://www.20at.com/article2.php?sid=688"

