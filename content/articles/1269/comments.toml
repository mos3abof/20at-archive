subject = "فلتقل خيرا او لتصمت"
author = "حمدي"
posted = "2006-04-12"
text = "الرئيس مبارك لما بيتكلم الحقيقه بيفكرني باغنية بتاعة \" قاعدين علي المصطبه وياه\"<br />الحقيقه ان الراجل كلامه كلام مصاطب فعلا<br />* من اعطاك الحق كي تشكك في ولاء الشيعه لاوطانهم ومن انت حتي تمنح صكوك الوطنيه لمن تشاء<br />وبعدين ياريس انت زعلان من ايران ليه ايران دخلت بالامس نادي الدول النوويه واصبحت الدوله الثامنه في العالم التي تحصل علي هذه التكنولوجيا واظنك تابعت المناورات الايرانيه الاخيره وشفت الاسلحه اللمتطوره التي انتجها العلماء الايرانيون رغم الحصار والضغوط الدوليه<br />** طيب انت عملت ايه لبلدك ياريس ؟؟؟ سؤال بريء<br />** احمدي نجاد رئيس ايران انتخب في انتخابات حره وديمقراطيه بشهادة اعدائه ولو الشعب الايراني حب يغيره لاي سبب مافيش عندهم مشاكل ..هل احنا نقدر نعمل كده عندنا ياريس<br />*** معلش ياريس هتقل عليك شويه واسالك هل انت تعرف ان الرئيس الايراني ساكن في شقه بالايجار ورفض يغيرها ومعروف هو كان عنده كام لما مسك الحكم يعني ببساطه كده اقرار الذمه الماليه بتاعه معروف<br />ياتري ياريس انت عندك اقرار ذمه ماليه انت والاستاذ جمال مبارك<br />*** وبعدين ياريس حتي لو سلمنا بكلامك ان بعض الشيعه ولائهم لايران اكتر من بلدانهم<br />مش يبقوا احسن من الناس اللي ولائها للامريكان والاسرائليين ولا انت ايه راي سيادتك<br />** كلمه اخيره ياريس انت طبعا عارف اللي بيحصل في العراق الان وانت بنفسك قولت ان فيه حرب اهليه في العراق ولو ن الكلام فيه مبالغه ..<br />يبقي من الاولي ياريس ان احنا نحاول نهدي الامور ونحاول كعرب نجمع العراقيين علي كلمه واحده مش نروح نشعللها بكلام يزيد الطين بله زي ما بيقولوا<br />ربنا يهديك الي الحق يا ريس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141546/http://www.20at.com/article2.php?sid=688"

