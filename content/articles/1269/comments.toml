author = "مناضل أنترتى قديم"
posted = "2006-04-14"
text = "السلام عليكم ورحمة الله و بركاته<br />يقول رسول الله صلى الله عليه و على اله و صحبه و سلم فى معناه فى حديثه الشريف<br />انا سيد اهل بيت فى أول الجنه لمن ترك الجدال و لوكان على حق<br />أثرت ان أبدء بهذا الحديث اعلانا بان ردى هذا ليس من باب الجدال ولكن من باب التوضيح ليس اكثر<br />بداية جزاك الله خير على اهتمامك بالرد على تعلقيى و قولك ان تعلقياتى تعجبك فالحمد لله على ما فتح به على من كريم فيضه<br />لهذا أخى الكريم لك منى جزيل الشكر و العرفان<br />ثانيا همسه صغيره فى أذنك لك اخى الفرعون المصرى شاب مسلم فلال ينبغى ان أفرق بينك و بينه فى الكلام فلقد ألمنى بشده أن تقول فى معرض كلامك أننى وضعتك معه فى بوتقه واحده و كأنه كائن من الفضاء و ليس المهم هنا من اخطا انت أو هو او حتى انا<br />ثالثا يسعدنى ان اتشرف بالتعرف إليك وهذه و احده من اجمل مميزات الموقع الذى سمح لى بالتعرف إلى الكثير من الشباب الجميل مثلك<br />رابعا وهى موجهه إلى إدارة الموقع<br />الفلتره الفلتره الفلتره<br />يا ساده أين الفلتره بعض التعليقات تخرج عن المألوف كثيرا و تحتوى على سباب يؤذى مشاعر كثير من الزاور المحترمين و حتى لا يفسر كلامى خطأ أرجو قراءة تعليقى فى الرابط التالى<br />http://www.20at.com/article2.php?sid=663"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141546/http://www.20at.com/article2.php?sid=688"

