[[comments]]
order = 26
subject = "سلام يا ريس"
author = "صالح الدوسرى"
posted = "2006-05-26"
text = "الرئيس المصرى مسكين بعقله والشعب المصرى مسكين بهذا الرئيس و يشهد الله انى اخاف على هذا الشعب العريق الطيب من هذاالرئيس و مجموعته.<br />شيعة العراق هم عرب اقحاح لما تراهم كانك ترى الحصان العربى الاصيل مقابل بقية العرب هم احفاد القبائل العربيه الاصيله التى فتحت العراق وهم ليسوا بحاجه لشهاده الرئيس حسنى.لكن نحن العرب لما نحس بتاخرنانبحث عن اى مِؤامره واسهل شىء هم الشيعه مع ان مص السنيه فتحت قناه السويس للامريكان و مصر السنيه و قعت مع اسرائيا و كان لها دور اساسى فى حرب احتلال العراق و السعوديه السنيه و البحرين السنيه و قطر السنيه و الاردن السنى و الكويت السنيه لمن انتمائهم ؟ السؤال للرئيس حسنى ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141546/http://www.20at.com/article2.php?sid=688"

[[comments]]
order = 27
subject = "مجرد تعليق"
author = "احمد هلال"
posted = "2006-06-07"
text = "الاخوه الكرام لى راى اريدان اعرضه عليكم اولا- قلق دول الخليج من ايران لها كل الحق فيه بسب احتلال ايران للجزر الاماراتيه فلم يمنع اسلام ايرانالشيعيه من الاعتداء على جيرانها المسلمين فلم تراع صله الجوار مثلما فعل صدام حسين السنى مع الكويت المسلمه00 فالقاعده الرئيسيه ان لا نكفر احد من اهل القبله سنى او شيعى وذلك حتى نكون متحدين على الاقل امام اعداء الامه فولله الذى لااله الا هو انكم باختلافكم وتبادلكم الشتائم وتفرقكم يسخرون منا 000 ناتى لدور مصر ورئيسهاتجاه ايران اولا يجب التفرقه بين السياسه الداخليه لمبارك وسياسته الخارجيه حتى لا نخلط الاوراق ببعضها يجب الا ننسى دور ايران فى عهد الشاه مع مصر اثناء حرب اكتوبر اما فى عهد الخمينى فلم يمنعه اسلامةالشيعى من تمويل العمليات الارهابيه ضد مصرنا فى الثمانينات 000على العموم لقد تفائلنا خيرا عندما نجحت باكستان فى تجاربها النوويه وقلنا قنبله باكستان الاسلاميه ولكنعليكم ان تجيبونى اين دور باكستان بما تملكه من سلاح رادع00 وكذلك ستكون ايران00الكل يعلم ان ترسانه اسرائيل النوويه هى للردع فقط لا تستطيع ان تستخدمها الا فى حاله واحده عندما تشعر ان وجودها مهدد00 لكنها تشعر بالقلق من ايران النوويه لانهاوامىكا والغرب كله يعلمان تمام العلم ان ايران او اى دوله اسلاميه اذا امتلكت السلاح النووى سوف تستخدمه لان اسرائيل تعلم عقيده المسلم الاستشهاديه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141546/http://www.20at.com/article2.php?sid=688"

