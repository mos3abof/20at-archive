text = "كلنا مسلمون والمسلم هو من لا يسرق او يقتل والمسلم هو من قال كلمة حق امام حاكم ظالم والمسلم هو من قاتل اسرائيل وعملائهاوالمسلم من وقف الي جانب اخوة المسلم لو طلب منة نجدة والمسلم هو من مسح بيدية دمعة اخوة المسلم والمسلم من دعا الي المساواة امام القانون بين الفقير والغني////www.abdelnasser.8k.com/////brother of pr gamal abdel nasser"
