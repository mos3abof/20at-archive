text = "ي جماعة اللى انتم مش عارفين العراقيين ولشيعة كلام الريس صحيح ان ولاء الشيعة ابو عمامة الخمينى و السادة النين شوفهم شلون يضربون نفسهم من سنين بداعى الحسن و الحسين كلام فارق هم يحبون السواد و الحزن على الانبياء ليه ما ندرى السبب<br />فهم الشيعة ولاءهم لابو عمامه حتى لون كان جاهل اللى يعينك يا ريس منهم"
