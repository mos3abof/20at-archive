[[comments]]
order = 8
subject = "الي الاخ مناضل انترنتي قديم"
author = "حمدي"
posted = "2006-04-14"
text = "السلام عليكم ورحمة الله الاخ مناضل انترنتي<br />انا كنت علي استعداد اني اقولك اني موافق علي كلامك مائه في مائه وااتجاوز عن عدم انصافك لي ومساوتك بيني وبين فرعون الذي وصفني بالغبي والمتخلف دون اي داع<br />لولا جزئيه صغيره في اخر كلامك علقت فيها عن كلامي عن مفاعل ديمونه<br />انا مش عارف والله يااخ مناضل هل انا مش فاهم كلامك ولا انت اللي لم تفهم كلامي<br />اولا انا مصري واظن ده واضح من اللغه اللي بستخدمها في الكتابه وبالتالي فانا عندما ذكرت مفاعل ديمونه<br />انا كنت اقصد انه يمثل تهديد للامن القومي المصري والعربي بل والاسلامي ان جاز التعبير<br />وانا كنت انتقد الاخ اللي شايف ان النووي الايراني يمثل تهديد للخليج بينما لا يتكلم عن الاسلحه النوويه الاسرائليه ولما ذكرت دول الخليج بالتحديد كان لانه هو اختار يتكلم عن دول الخليج فكان كلامي في سياق الرد عليه<br />يعني ببساطه يااخ مناضل انا بقول ان ايران عنصر من عناصر القوه للامه الاسلاميه و يجب ان نتعامل معها كحليف وليس كعدو<br />فاين شبهة النعرة الطائفيه اذا كنت انا من يدافع عن الايرانين الشيعه وكلامي مدعم بفتوي الازهر ومجمع البحوث الاسلاميه وليس كلاما مرسلا<br />** ياريت ترجع الي تعليقاتي في هذا الموقع وانت تشوف انا عمري ماتجاوزت مع اي حد في الرد<br />وان كل كلامي هو دعوه لتوحد المسلمين والبعد عن الطائفيه والشعوبيه البغيضه ودائما تعليقاتي تكون في هذا السياق بينما الاخ فرعون الذي نزل علينابالباراشوت و لا يملك الا السباب والشتائم ووصف الشعب الايراني بانهم كلاب<br />ولم يلفت ذلك نظرك<br />انا متابع تعليقاتك علي الموقع وغالبا بتعجبني لذلك اهتميت ان اشرح لك موقفي وارجو ان وجهة نظري تكون وصلت لك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141546/http://www.20at.com/article2.php?sid=688"

