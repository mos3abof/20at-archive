[[comments]]
order = 15
subject = "أقصر طريق بين نقطتين(خط)"
author = "الرسام الصغير"
posted = "2006-04-22"
text = "السلام عليكم ورحمه الله<br />بعد الصلاه على الرسوا الكريمأحب ان اقولأن الناس ثلاثه انواع أو المشاركين فىابداءالاراء ثلاثهأسوأ نوع(1)المشارك قاصدا الشوشره الانحراف عن الحقيقه لاغرض أعجز عن معرفتها.بينما النوع الثانى وهو الاكثر شيوعا(انتشارا)المشاركهالسلبيه .كيف يدخل .يقرأماكتب .لماذا لاأتحدث(توضيح)لاأعاديهم ولكن كما قال عمر كرم الله وجهه (المرء مخبوؤ تحت لسانه)يعنى أعقلها بعد ما تنظر حولك وتوكل.<br />بينماالنوع الثالث أثنى عليه واضم صوتى لصوته أحب ان صوتنا يتسمع علشان نقدم شى لحياتنا.المسلم ايجابى وتذكروا سيره الرسول(ص)فىرمضان فى على خطى الحبيب المصطفى.<br />*كلنا(مسلمون عرب)كلنانتحدث العربيه كلنا واحد.عاداتنا وتقاليدنا واحده.<br />ارجوالكتابه العربيه الفصحى والذى من النوع الثالث الايجانى المشاركه لا يلتفت لمن ضاقت معرفته عليه العلم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141546/http://www.20at.com/article2.php?sid=688"

[[comments]]
order = 16
subject = "للاخ حمدي"
author = "عمرو السيوطي"
posted = "2006-04-24"
text = "سلام<br />انت كلام جري وغريب تتكلم بصراحه وكلم للا سف كله صح<br />واعرف انك صح بس ما كنش المفروض تفهمنا انهم صح اتمنيت افضل على ما انا عليه<br />احس بقهر لانهموصلو لشي احنا ما وصلنهوش<br />احس بغيره وبحقد مش عارف ليه انا مقهور<br />بس مبارك حرامي واولاده حراميه<br />والي واقف بصف مبارك طز فيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141546/http://www.20at.com/article2.php?sid=688"

