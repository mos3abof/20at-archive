[[comments]]
order = 21
subject = "راي صواب يحتمل الخطا وراي غيري خطا يحتمل الصواب"
author = "حمدي"
posted = "2006-04-27"
text = "يااخ مسلم حكاية ان تيار ديني يزعم ان هو الوحيد علي صواب وباقي التيارات كلها خطا<br />ده مساله ما اعتقدش ان فيه كتير هيوافقك عليهاوالاختلاف بين الفقهاء باب من ابواب الرحمة في الاسلام فدعونا لا تغلقه<br />وقديما قال الفقهاء رايي صواب يحتمل الخطا وراي غيري خطا يحتمل الصواب<br />اما حكاية عمرو خالد واللقب الي اطلقته عليه فيااخ مسلم هذا الرجل قد هدي الله به ناس كثيرون للاسلام وللتدين والبعد عن المعاصي<br />فان اختلفنا معه دعنالا نسيء اليه ولا نقلل من شانه فمن يدري قدره عند الله<br />ولا نزكي احد علي الله ولكني احسبه من المخلصين في دعوتهم والعاملين بجد<br />ولنلتفت نحن الي ماذا قدمنا الي ديننا<br />اللهم ارنا الحق حقا وارزقنا اتباعه وارنا الباطل باطلا وارزقنا اجتنابه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141546/http://www.20at.com/article2.php?sid=688"

