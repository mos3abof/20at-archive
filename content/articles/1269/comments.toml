[[comments]]
order = 3
subject = "غيرة"
author = "عابر القارات"
posted = "2006-04-12"
text = "و الله مش عارف برضه للأسف أنا شعورى ناحية إيران يشبه لحد كبير شعورى من ناحية إسرائيل فواضح جدا إن الاثنين عندهم خطط محددة و إستراتيجية ماشيين عليها من سنين و لسه قدامها سنين بغضع النظر عن اللى بيمسكوا الحكم يتغيروا أو ما يتغيروش و المهم أنهم بينفذوا الخطط بثبات و حسب الجدول الموضوع ... المصيبة السوده بقى يا إخوان العرب عموما و حكام مصر خصوصا لا عندهم جدول و لا عندهم خطط و ماشيين هابولى على الأخر لا عارفين بلادهم رايحه فين و لا جاية منين بس عندهم خطه واحده و الكل اتفق عليها أنهم يقوموا بتخصيب (الغراء النووى) لزومة ما تلزق مقعدتهم بكرسى الحكم أطول فترة ممكنة و لا مؤاخذه يتحرق الشعب و يتحرق اللى خلفوا ابو الشعب و خللى الشعب ياكل بعضه و ياكل (براز) على رأى إخوانا اللبنانين مع إستخدام الفاظ لائقة نوعا ما و ذلك إحتراما للعشرينات ... يا جماعه و يا حكام نص كم فوقوا بقى الامم من حواليكم بتخطط و بتنفذ خطط مدروسة و هييجى يوم هتنقض عليكم و حتى الكراسى اللى لازقين فيها مش هتلاقوها يبقى خسرتم نفسكم و خسرتم شعبكم و لكم فى صدام حسين مثال حي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141546/http://www.20at.com/article2.php?sid=688"

[[comments]]
order = 4
subject = "كلة تمام"
author = "الفرعون المصرى"
posted = "2006-04-13"
text = "الغبى اللى مع عاجبة حسنى مبارك يقولنا شعورة ناحية الشيعة اية ؟<br />اقولك انا انا عايش مع الشيعة من 6 سنوات وعرفت عن ديانتهم الكتير وبقول ديانتهم لانهم مش مسلمين ؟<br />دول عندهم طقوس غريبة وكلام اغرب وبيكرهوا السنة جدا جدا وكلام الرئيس حسنى مبارك مظبوط جدا<br />اما المتخلف اللى فرحان بالنووى بتاع ايران عاوز اقولة اتلهى على عينك بكرة تشوف النووى دة حيروح فين<br />اول ناس حتبتز هيا دول الخليج واحنا فى مصر فاهمين الكلاب الايرانيين جدا<br />عاوز اقول للرئيس المصرى رغم اختلافى الشديد معك فى شئوننا الداخلية واستيلائك على السلطة من ايام الفراعنة بس المرة دة انتا جبت الجون ياريس وعلى فكرة كتير من الحكام العرب بقوا زى معلقى المنتديات جهلة وبيهرتلوا باى كلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141546/http://www.20at.com/article2.php?sid=688"

[[comments]]
order = 5
subject = "الي فرعون واتباعه"
author = "حمدي"
posted = "2006-04-13"
text = "ابدا كلامي واقولك يافرعون انا مش هرد علي قلة الادب والشتائم بتاعتك<br />لان \" كل اناء ينضح بما فيه<br />لكني سوف ارد كلامك بخصوص الشيعه وايران انت بتقول ان الشيعه ليسوا مسلمين<br />وانا عايز اقولك ان الازهر ومجمع البحوث الاسلاميه افتوا بجواز التعبد بالمذهب الشيعي الاثني عشري هو المذهب الاول في ايران<br />والكلام ده مذكور في موضوع قصة الشيعه اللي كتبه الاخ خالد السيوفي تقدر تجيبه من الارشيف بتاع عشرينات<br />الحكايه ليست بالحب والكره .. فهل بعد اجماع الازهر كلام<br />يعني اللي يقول علي الشيعه مسلمين ليس غبي يا فرعون -- الغبي هو اللي عمره ماقرا كتاب في حياته\" غير كتب المدرسه \" ومبيقراش غير عنواين الجرايد واخره صفحة الرياضه وبيفتي وبيكفر الناس من غير حتي ما يكلف نفسه ويقول مصدره<br />وعلي فكره انا الحمد لله مسلم سني بس انا عايز اسالك هو اسلوبك وكلامك ده اسلوب مسلمين سواء كانوا سنه ولا شيعه<br />** ثانيا انت بتقول في كلامك ان النووي الايراني معمول علشان دول الخليج<br />والله انا صعبان علي حالة الجهل اللي انت فيها (علي فكره دي مش شتيمه دي وصف لحالتك<br />** اولا هو انت متخيل ان ايران محتاجه النووي علشان تهدد دول الخليج --القوه العسكريه التقليديه لايران تتفوق<br />علي دول الخليج مجتمعه بمراحل وده كلام معروف ولو عندك وقت ممكن تبقي تتابع وتسال لان دي حاجات من البديهيات يعني ايران لا محتاجه نووي ولا غيره علشان تهدد الخليج لو حبت<br />وبعدين متناسش ان اللي بيحمي الدول الخليجيه هما الامريكان اللي موجودين في القواعد الامريكيه اللي في دول الخليج<br />كل الحكايه ان بعض دول الخليج مش عايزين ايران تبقي قوه عالميه واقليميه مؤثره علشان بعض الحسابات الخاصه بتركيبة<br />دول الخليج واعادة ترتيب الاوضاع في المنطقه<br />يبقي مين المتخلف يا فرعون اللي بيدافع عن امتلاك دوله اسلاميه للتكنولوجيا النوويه ولا الشخص اللي بيقف في صف الاسرائليين والغرب<br />اللي عايزين يمنعوا ايران من حقها الطبيعي في امتلاك التكنولوجيا النوويه<br />** وبعدين مش الاحق ان انت تزعل من اسرائيل اللي مفاعهاا النووي علي بعد كيلو مترات من حدودك وعندها اسلحه نوويه مش زي ايران يعني<br />اللي لسه في البدايه وبتعلن انها سوف تستخدم الطاقه النوويه في الاغراض السلميه<br />** ولا انت شايف ان السلاح النوي الاسرائيلي مش بيهدد الخليج<br />امال بيهدد مين ؟ وليه صوتكم مش عالي كده مع الاسرائليين ؟<br />وفي النهايه اقولك<br />اذا لم تستح افعل ما شئت<br />وحشرك الله مع من تحب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141546/http://www.20at.com/article2.php?sid=688"

[[comments]]
order = 6
subject = "من هنا تأتى الكارثه"
author = "مناضل أنترنتى قديم"
posted = "2006-04-13"
text = "السلام عليكم و رحمة الله و بركاته<br />كنت أنوى التعلق على الموضوع و لكننى وجدتنى مجبر لا أراديا أن اعلق على تعليقات الزوار يا ساده نحن نواجه كارثه كبرى الا وهى فن الاختلاف و تتجلى هذه الظاهره فى مشاورات القمم العربيه و لن أذكر أمثله انتم كلكم تعرفونها حتى لا يخرج احد الزوار برد يدافع به عن رئيس أو ملك بلاده و ندخل فى داوامه نحن فى غنى عنها من التنابذ و الأختلاف<br />فى الحقيقه ألمنى بشده اسلوب الحوار الذى دار بين زائرين من زوار الموقع وكنت اتمنى ان يعرض كلاً منهم وجهة نظره و يكون من داخله يقين بأن كلامه خطأ يحتمل الصواب وأن كلام أو رأى الاخر صواب يحتمل الخطأ و ان كل الناس يؤخذ عليها ويرد إلا الصادق المعصوم صلى الله عليه و على اله و صحبه و سلم بدلا من ان يدخلا فى جدال سفسطائى يتحول فى النهايه إلى مشاده كلاميه ليثبت كلا منهم صحة وجهة نظره و نحيد عن الموضوع الأساسى أنا لا أقصد فى كلامى ان اتعرض لأحد يأيذاء أو تجريح ولكن يؤلمنى بشده ان يغيب عن شبابنا أدب الحوار وادب الاختلاف و ليست هذه باخلاق مسلمين ولاحظت شىء غريب أحد هؤلاء الشابين كان يتكلم عن مفاعل ديمونه الأسرائيلى الذى يبعد عن مصر بضع كيلومترات وكان مصر لا تعنيه فى شىء أو كأن ضرر هذا المفاعل سوف يصيب مصر دون غيرها ن دول الجوار المسلم العربى ياساده دعوا عنكم نعرة الجاهلية تلك فكلنا مسلمون و الحمد لله والمسلم للمسلم كالبنيان المرصوص و لا فضل لمسلم عربى على مسلم أعجمى او أيرانى او أمريكى إلا بالتقوى<br />ووالله المسلم الأمريكى أو الهندى أحب إلى من العربى العلمانى<br />سؤال اخير<br />انا اعلم ان فى أيران مسلمين سنه ترى ولائهم لأى بلد؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141546/http://www.20at.com/article2.php?sid=688"

