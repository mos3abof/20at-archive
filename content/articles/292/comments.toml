[[comments]]
order = 1
subject = "احب مايك تايسون"
text = "بسم الله الرحمن الرحيم<br />في بداية الموضوع احب انا اقول انا مايك تايسون يبقي<br />في قلوب الكتير من الناس الملاكم الضخم الدي يصعب اي شخص هزيمته0<br />وانا شخصيا احب مايك تايسون بعنفه وبقوته وشجاعته التي لا يملكها احد 0<br />تايسون خسر في الاخر مبارة له يوم 310802004ليس بشي<br />السى لانا الملاكم الدي كان يلعب معه طويل القامة و<br />معروف علي تايسون يجيد الضرب عن قرب ولكن اريد طلب الشي واحد من الجهات المعنية ان تبحت لتايسون علي شخص في نفس وزنه وطوله ومتاكد انه يربح 0 وشكرا<br />taison_rook79@yahoo.com"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044520/http://www.20at.com:80/article.php?sid=27"
