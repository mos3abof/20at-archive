subject = "الكناني"
text = "موضوع جميل.. وعلى فكرة أنا الآن لي أكثر من 6 أشهر لم أشاهد فيه التلفزيون... واشعر ان حياتي تسير بطريقة طبيعية... فلماذا لا نأخذ فترة نقاهة.... ونجرب ... أنا لم أعاني كثيرا عندما قررت عدم مشاهدة التلفاز، وكان هذا القرار صادرا لأنني وجدت أن التلفزيون المصري - لأني لا أشترك في البث الفضائي - لا يحترم عقلية المشاهد... فآثرت ان انقطع عن مشاهدة التلفاز عموما لأصون كرامتي وعقلي من هذه السطحية و....."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926034857/http://www.20at.com:80/article.php?sid=479"

[[comments]]
order = 4
subject = "لمن سأل عن صحة الأرقام (منقول)"
text = "منقول<br />غـزو الرسائل النصية لحياتنا ومجتمعاتنا تؤكده الكثير من الإحصائيات والأرقام.. تشير البيانات الصادرة من جمعية معلومات الهاتف المحمول البريطانية إلى أنه في مارس 2004 وصلت الرسائل المتبادلة على مستوى العالم إلى 21 مليار رسالة بزيادة 25% عن مارس 2003، وأنه في بريطانيا وحدها يتم إرسال 69 مليون رسالة خلال اليوم بمعدل 2,3 مليون رسالة كل ساعة!!<br />كذلك سجل المحتفلون بالعام الجديد 2004 في بريطانيا رقما قياسيًّا في عدد الرسائل النصية المرسلة عبر الأجهزة المحمولة في يوم واحد؛ حيث تم إرسال 111 مليون رسالة ما بين منتصف ليلة 31 ديسمبر ومنتصف ليل الأول من يناير بزيادة 8% عن نفس الفترة في عام 2003؛ حيث تم إرسال 100 مليون رسالة.<br />وإذا حاولنا معرفة بعض الأرقام الأخرى من دول العالم نجد أنه خلال احتفالات رأس السنة للعام الحالي 2004 شهدت أستراليا إرسال 16,2 مليون رسالة، وبلجيكا 22 مليون رسالة، وفي التشيك 28,5 مليون رسالة، والهند 12,6 مليون رسالة.<br />أما الأرقام في عالمنا العربي فلا تختلف كثيرا عما ذكرنا في الغرب، وإن كانت هناك ندرة في الإحصاءات والبيانات التي تتحدث عن رسائل المحمول النصية..<br />فقد حطمت ليلة عيد الفطر المبارك الماضي في المملكة العربية السعودية كل التوقعات في حجم الرسائل النصية؛ حيث أشارت تقارير شركة الاتصالات السعودية أنه تم إرسال أكثر من 100 مليون رسالة في هذه الليلة.<br />كذلك شهدت دولة الإمارات العربية ملايين الرسائل النصية في الأسبوع الأخير من عام 2003، ونفس الشيء تكرر مع حلول شهر رمضان وعيد الفطر المبارك والأضحى، ويقدر عدد الرسائل النصية القصيرة التي يتم تبادلها في دولة الإمارات وحدها بنحو مليوني رسالة يوميا يرسلها 3 ملايين مستخدم.<br />كما ذكرت الشركة العمانية للاتصالات أن عدد الرسائل التي تم تبادلها خلال أيام عيد الأضحى الماضي داخل السلطنة وصل إلى 800 ألف رسالة في اليوم، وهي نسبة فوق المعدل المعتاد.<br />أما في مصر فالأمر لا يختلف عن مثيله في الدول العربية الأخرى، خاصة إذا علمنا أنه يوجد في مصر أكثر من 4 ملايين مشترك في خدمة التليفون المحمول.<br />وطبقا لدراسة حديثة أجرتها شركة \"أنفـوتوسيل دوت كوم\" العاملة في مجال توفير خدمات التطبيقات اللاسلكـية في منطقة الشرق الأوسط؛ فإن عدد المشتركين في خدمات الهاتف المحمول في العالم العربي وصل إلى أكثر من 24 مليون مشترك في نهاية العام الماضي بمعدل زيادة سنوي يقدر بنحو 69%؛ مما يؤكد أن هذه الرسائل النصية آخذة في الانتشار السريع يوما بعد يوم بين الشباب العربي، خاصة بعد أن أتيح الآن استخدامها في أغلب الدول بعد أن كانت ممنوعة في بعضها؛ لذا فإن المتوقع أن تصل هذه الأرقام إلى أضعاف ذلك، خاصة مع سعي شركات الاتصال العالمية في إحداث المزيد من التقنيات والتطبيقات لخدمة الرسائل النصية."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926034857/http://www.20at.com:80/article.php?sid=479"

