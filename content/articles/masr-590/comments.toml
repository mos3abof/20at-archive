[[comments]]
order = 6
subject = "فين الحجيجه يا خال"
author = "نيفين نيفى نوفا"
posted = "2006-07-03"
text = "شفت لقاء معاه ف القاهره اليوم بعد رجوعه مصر<br />و بصراحه يا جماعه محدش بقى عارف الحقيقه فين<br />مفيش حاجه واضحه و صوره البلد باهته<br />يمكن برىء يمكن لا<br />اقولكم<br />لا تصدقوا كا ما تقراوه"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074343/http://masr.20at.com:80/article.php?sid=590"
