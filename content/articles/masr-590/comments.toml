[[comments]]
order = 0
subject = "مش مهم.."
author = "بنت البلد دى..!!"
posted = "2006-06-29"
text = "الناس من كتر المصايب مابقتش تفرق<br />مش مهم عندها مين ممدوح اسماعيل ومين ممدوح حمزة<br />اهو كله واحد<br />وبعدين كل واحد فيه اللى مكفيه<br />وعلى كل<br />انا فرحت جدا لما سمعت خبر البراءة<br />وفرحت اكتر لماعرفت انه رجع مصر علشان يقول للكل انا من البلد دى وبحب البلد دى"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074343/http://masr.20at.com:80/article.php?sid=590"

[[comments]]
order = 1
subject = "يلا الحمد لله"
author = "عبدالله مفتاح"
posted = "2006-06-29"
text = "مشعارف انا كنت متعاطف مع الراجل ده ليه<br />على العموم حصل خير"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074343/http://masr.20at.com:80/article.php?sid=590"

[[comments]]
order = 2
subject = "عــــــــــــودا حـــمــيـــدا يــــا عــبــقـــرى"
author = "ممدوح حمزه"
posted = "2006-06-30"
text = "قيمه كبيره متميزه كان لازم انها تتحارب من الملاعين اعداء النجاح<br />مش بس كده ده كمان حاول انه يكشف فساد احد كلاب السلطه و ما اكثرهم<br />كفاره يا باشمهندس<br />أأأأأأأأأأأأأأأأأأأه يــــا بـــــلــــدى"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074343/http://masr.20at.com:80/article.php?sid=590"

[[comments]]
order = 3
subject = "حمزه ولا إسماعيل مش فارقه كتير"
author = "خالد سيدالأهل"
posted = "2006-07-01"
text = "الفرق ليس كبير فهذا ممدوح حمزه وزاك ممدوح إسماعيل وهو أحمد عز وذاك محمد ابوالعنين وهؤلاء نجيب سواريس وأحمد بهجت وغيرهم كثير وكثير ممن نعرف اسمائهم أولا نعرف هم هؤلاء الناس الذين إستباحو دماء هذا البلد وقوت شعبه هم الذين تاجرو فى كل رخيص وغالى والفرق بينهم ليس كبير وحروبهم ليست من اجل رفعت هذا الوطن بل من اجل من يفوز بقوت شعب هذا الوطن من دون شريك من أجل الإنفراد بوليمة كبيره هذه الوليمة هى مصر بشعبها وارضها ومشاريعها وكل خيراتها واخيرا لا نستطيع سوى ان نقول لك الله يا مصر لك الله يامصر"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074343/http://masr.20at.com:80/article.php?sid=590"

