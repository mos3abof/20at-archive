[[comments]]
order = 0
subject = "العيب فينا"
author = "هشام"
posted = "2006-10-03"
text = "ما هما فى الاخر يهود ...!<br />اللى اداهم الثقه المتماثله دى<br />احنا العرب<br />لو بصيت للناس القديمه ...هنا فى مصر<br />ها تلاقيه بيقولك معامله اليهودى ولا معامله العربى<br />وهكذا تكون الثقه التى اعتمدوا عليها<br />من جهل بعض الناس<br />غيروووووووووا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124922/http://www.20at.com/article2.php?sid=1300"

[[comments]]
order = 1
subject = "العوده الاخيره ان شاء الله"
author = "ايمن امام"
posted = "2006-10-03"
text = "السلام عليكم - ياريت كل اليهود اللى فى العالم يرجعوا الاراضى العربيه - لانهاان شاء الله ستكون الاخيره - لانهم سيدفنون على ايدى رجال وهبوا ارواحهم لله سبحانه وتعالى / فلا تهنوا ولاتحزنوا وانتم الاعلون - ان شاء الله/ ايمن امام المحامى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124922/http://www.20at.com/article2.php?sid=1300"

