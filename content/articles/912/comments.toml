[[comments]]
order = 3
subject = "بس هما يجوا"
author = "مصرية"
posted = "2006-10-12"
text = "ياريت يرجعوا يا اهلا وسهلا بيهم ان شاء الله لما يرجعوا هندفنهم فى احقر حتة فى العالم هندفنهم جنب تمثال الحرية لا قصدى تمثال العبودية بس هما يجوا بس واحنا نوريهم النجوم فى عز الدهر ونلعب فى وشهم البخت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124922/http://www.20at.com/article2.php?sid=1300"
