subject = ""
author = "الامل"
posted = "2010-02-17"
text = "يعنى بعد 30 سنة سلام<br />يعنى لو كنت مواطن مصرى زينا وشلت انبوبة البوتاجاز ونزلت الشارع بعد صلاة الفجر ووقفت فى الطابور فى عز البرد ورجعت الظهر وانت بتكح وقرفان ومصدع وبدون انبوبة وحاسس باليأس والاحباط والمهانة<br />هتعمل اية<br />هتجرى وراء الامل<br />والامل هو<br />يا اما عزرائيل يريحنا من العائلة دى<br />يا اما البرادعى او اى مصرى تانى يشوف حالنا<br />يا اخى لا تحرمنا من مجرد الامل<br />عارفين انهم هيزوروا<br />وهيموتوا البرادعى او ايمن نور او عمرو موسى<br />عارفين اننا تحت حكم اوسخ من الاحتلال<br />فلا تحرمنا من الامل"
archived = "2010-02-20"
capture_url = "https://web.archive.org/web/20100220115423/http://www.20at.com:80/masr/news/15370-2010-02-17-13-42-38.html"

