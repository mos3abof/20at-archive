order = 1
subject = ""
author = "الشعب الاهبل العبيط"
posted = "2010-02-17"
text = "الحكومة بتاعتنا دي ذكية جدا<br />عرفت تضرب ايمن نور جزمتين على وشه<br />لان الشعب المصري اهبل جدا وهايف جدا<br />الانتخابات الماضية كان بيجري ورا طارق نور<br />دلوقتي من هيافته بيجري ورا البرادعي<br />المهم ان الشعب المصري الاهبل العبيط عارف ان لا ايمن نور حيكسب ولا البرادعي حيكسب<br />لكن حنعمل ايه بقا في الهبكل والعبط<br />اصل الشعب المصري اصله قبطي والاقباط عبط حتى فيه واحد بدل ما يقول الاقباط<br />بيقول الاعباط<br />سلام يا زخاري"
archived = "2010-02-20"
capture_url = "https://web.archive.org/web/20100220115423/http://www.20at.com:80/masr/news/15370-2010-02-17-13-42-38.html"
