text = "موقعة اية يا ابا الحاج<br />دى حتة مباراة سكة درجة عشرين هتتلعب كلش كان وهيبقى فيها غشم وجرى ورمح والشوية العواطلية بتوعنا عايزين يبينوا انهم بيعملوا حاجة علشان يلهطوا مكافات وفلوس بالالفات<br />هيبقى فيها غشومية وجرى - اة - هيبقى فيها رمح اة<br />ممكن يحققوا اهداف عشوائية جايز<br />انما لعب وفن كرة فالعياذ باللة مفيش"
