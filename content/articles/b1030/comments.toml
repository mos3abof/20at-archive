[[comments]]
order = 10
subject = "انا مع التبرع لانشاء كنيسة"
author = "ايمان محمد"
posted = "2006-07-06"
text = "لازم نفرق بين المسحيين اللى شاركوا فى بناء هذا الوطن كمصريين زيهم زى غيرهم و منخلطش بينهم وبين بوش وامريكا واللى بيعملوة فى المسلمين لان دة يعتبر خطا كبير وانا مع البرع لانشاء الكنائس اذا كانوا هم بحاجة اليها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

[[comments]]
order = 11
subject = "ليش كل هالحقد"
author = "lolo12"
posted = "2006-07-06"
text = "انا مش عارف ليش في ناس حاقدة على المسيحين على الحساب القرأن بحكي لا نفرق بين احد من رسلة بتحبوا الخير لنفسكم وما بتحبوا الخير للناس انا مسيحي وبشكر كل واحد بجد وقف مع المسيحين ويا جماعة مش كل اصابعك زي بعض وبالمسبة للكلب بوش الله يحرقوا انشالله هاد كلب وشوه صورة المسيحين وما تخافوا الله ما بنسى حدا انشالله غير يوخد حقنا من بين عيونه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

[[comments]]
order = 12
subject = "كمان اتبرع"
author = "محمد"
posted = "2006-07-06"
text = "خد بالك إن العنوان خطأ وهوأن أتبرع لأن هذه من الموالاه لهم فأنا طبعا لن أتبرع ولكن القاون في الدنيا كلها يسمح لجميع بحرية ممارسة العقائد وليس الاديان لأن الدين هو الاسلام فقط ولو في بلد لا يوجد بها أي كنيسة نسمح لهم ببناءها ولكن لايكون تنظيم كنسي يشوه معالم البلد الاسلامي وعلي حسبب عددهم فنحن لم نطالب بقلب كل ميونخ إلي مساجد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

[[comments]]
order = 13
subject = "بموضوعية"
author = "المصرى"
posted = "2006-07-06"
text = "نحن لا نرضى الدنًيية فى ديننا نعم ندافع عنهم ولكن لا نتبرع لبناء معابدهم لاننا بذلك نقر عقيدتهم الباطلة ولا نظن ايهاالاحباب اننا بذلك نرضيهم ولنحزر ان نرضيهم على حساب دين الله الأسلام وكما قال الله تعالى (ولن ترضى عنك اليهود ولا النصرى حتى تتبع ملتهم)اذا ارضيهم واتبع ملتهم وكن على عقيدتهم وتبرع لهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

[[comments]]
order = 14
subject = "اقرفني الموضوع"
author = "ريم بنت السعودية"
posted = "2006-07-06"
text = "الصراحة اقرفني الموضوع جدا جدا نحن كعرب نود ان نكون يدا واحدة وادعوا الله من كل قلبي ان يهدي الضال لعبادة الخالق وهو الله لا اله الا هو وشهادة ان محمد رسول الله واخواننا في الوطن العربي هم اخواننا ونحترم شعائرهم لكن اقول للمسيحيين قوله تعالى \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\ ان الدين عند الله الا سلام\\\\\\\\\\\\\\\\\\\\\\\\ثانيا لو قالو تبرعي لبناء كنيسة والله ووالله لا اعصي من خلقني و وهب لي النعم وفي النهاية اجازية ببناء معبد لا يعبد فيه الله بل جعلوه ثالث ثلا ثة وعيسى نحبه فهو نبي من انبياء الله ولا نرضى عليه كلام عليه السلام \\\\\\\\\\\\\\\\مرة اخرى كما حقدوا عليكم اليهود فنحن سمونا ارهابيين مرة اخرى لكم خااااااااالص شكري وكل من قرا مقالي ]]]]]]]]]]]] ريم بنت السعودية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

[[comments]]
order = 15
subject = "ماما امريكا"
author = "القعقاع"
posted = "2006-07-06"
text = "هم اقصد النصارى ليسوا في حاجة لترعات لبناء كنائسهم فأمهم امريكا لم تعلن فطامهم فهي حملتهم من سفاح ثم وضعتهم ومن يومها وهي تتكفلهم برعايتها في كل بقاع الأرض ... نتبرع للفلسطنين أولاً فهم احق بالتبرع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

[[comments]]
order = 16
subject = "ليه انشاالله"
author = "دودى"
posted = "2006-07-07"
text = "يعنى ايه نتبرع لبناء كنيسة خلاص كل ابواب التبرع اتقفلت و الفقراء خلاص راكبين الفرارى و الحية رفاهية طيب ما بدل ما ابنى كنيسة ما ابنى جامع و لا هو هبل ما لو كان واحد مسيحى كان هيجى يبنيلى جامع ما هيقول ما ابنيلى كنيسة احسن هى كدة \"لكم دينكم و لى دين\" و بعدين ربنا امرنا بان نعاملهم بالحسنى لكن مش للدرجة دى و هاتى مسيحى مش واحد حقة تالت و متلت فى دولة اسلامية و شوف اللى بيجرى للمسلمين فى الدول المسيحية يا جماعة انتوا بتتكلموا ازاى ؟؟؟؟؟؟؟؟؟؟<br />المسحيين بيعرفوا يساعدوا بعض كويس جدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

