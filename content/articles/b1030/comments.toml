order = 0
subject = "والله هلى حسب"
author = "هندساوي"
posted = "2006-07-05"
text = "من حيث المبدأ الامر دة مرفوض<br />لكن لو حسبناها من جهة المصالح فممكن مثلا اقف جمب مسيحين عشان يبنوا كنيسة بس اكون انا هجني من ورا دة فايدة للمسلمين<br />انما اساندهم عشان خاطر الحرية والاقلية ومش عارق شعائر ايه فالكلام دة كله ميساويش حاجة<br />زي مقلت لو من ورا الحاجة دي مصلحة لامتي فاوكي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

[[comments]]
order = 1
subject = "موضوع ملفوف"
author = "عبدالله مفتاح"
posted = "2006-07-05"
text = "اذا كان الامة الاربعة لم يجيزوا بناء كنائس جديده<br />والليث بن سعد اجاز ذلك<br />يبقى انا اتبرع ليهم في حاجه فيها خلاف؟<br />مش عارف بصراحه<br />بس لا اظن عشان ابقى صريح مظنش اني هتبرع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

[[comments]]
order = 2
subject = "لهم مطلق الحريه"
author = "عاشور الناجى"
posted = "2006-07-05"
text = "انا من المطالبين بحرية الشعائر فالدين الاسلامى لا يمنع احداً من ممارسة شعائره الدينيه بل و أن اخوننا المسحيين بالذات ذوى مكانه خاصه فى الاسلام اكثرمن اليهود و غيرهم فقد قال تعالى فى كتابه الكريم<br />(َمِنْ أَهْلِ الْكِتَابِ مَنْ إِن تَأْمَنْهُ بِقِنطَارٍ يُؤَدِّهِ إِلَيْكَ [أل عمران : 75 ]<br />و ايضاً<br />(لَتَجِدَنَّ أَشَدَّ النَّاسِ عَدَاوَةً لِّلَّذِينَ آمَنُواْ الْيَهُودَ وَالَّذِينَ أَشْرَكُواْ وَلَتَجِدَنَّ أَقْرَبَهُمْ مَّوَدَّةً لِّلَّذِينَ آمَنُواْ الَّذِينَ قَالُوَاْ إِنَّا نَصَارَى ذَلِكَ بِأَنَّ مِنْهُمْ قِسِّيسِينَ وَرُهْبَاناً وَأَنَّهُمْ لاَ يَسْتَكْبِرُونَ [المائدة : 82])<br />(لَيْسُواْ سَوَاء مِّنْ أَهْلِ الْكِتَابِ أُمَّةٌ قَآئِمَةٌ يَتْلُونَ آيَاتِ اللّهِ آنَاء اللَّيْلِ وَهُمْ يَسْجُدُونَ [آل عمران : 113])<br />و هنا نرى تفضيل الاسلام للمسيحيين عن بقيةغيرهم من غير المسلمين<br />لذلك فليبنوا دوراً للعباده كما يشاءون فلهم كل الحريه فى ذلك 00<br />و أنى اظن أن مجموعة الاوباش المتجمعين ليل نهار على البالتوك او غيره من البرامج و المنتديات و الذين يسبون الاسلام و رسوله الكريم ( صلوات ربى و سلامه عليه ) و يدعون انهم مسيحيون ما هم الا مجموعه من المتخلفين عقلياً و ذوى الامراض و العقد النفسيه ندعو الله لهم بالشفاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

