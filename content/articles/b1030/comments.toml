subject = "بالعقل كده مين أولى"
author = "واحده من مصر"
posted = "2006-07-06"
text = "أعتقد اننا لو حنعتبرها ضمن الصدقه يبقى الاقربون اولى بالمعروف وبلاش توهمنى ان الواحد حتديق بيه فلوسه لدرجه انو يتصدق ولا يتبرع لبناء كنيسه طيب يخليه حيادى بلاش جامع وبلاش كنيسه عندك المستشفيات دى بتعالج كلو<br />وللعلم بقى المسحيين بيعرفوا يؤزروا بعض كويس ولو عايزين يبنوا كنيسه مش حيغلبوا فى فلوسها عشان ياموا تبرعات من المسلمين"
