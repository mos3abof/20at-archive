[[comments]]
order = 18
subject = "لا الة الا الله"
author = "فارس المصرى"
posted = "2006-09-19"
text = "بسم الله الرحمن الرحيم قل هو الله احد .الله الصمد.لم يلد.ولم. يولد.ولم .يكن.لة كفوا.احد<br />صدق الله العظيم الله واحد لا شريك لة لا ابن لة وسيدنا عيس علية السلام نبى من عند اللة وتذكروا كم منكم يدخل الاسلام فى جميع العالم وكم يدخل المسيحية اعتقد بانكم تعرفون الاجابة جيدا ارجعوا الى دين الحق فالاخرة خيرا وابقى اشهد ان لا الة الا الله واشهد ان محمد رسول اللة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

[[comments]]
order = 19
subject = "لماذا هذا النفاق وهذه المداهنة"
author = "الشيخ اويس"
posted = "2006-09-22"
text = "فال الله تعالى<br />انجعل المسلمين كالمجرمين<br />صدق الله العظيم<br />كفوا عن المداهنة واتقوا الله<br />الم تسمعوا بقول الله تعالى قل يا اهل الكتاب لما تكفرون بايات الله والله شهيد على ما تعملون<br />صدق الله العظيم<br />لن ترضى عن اليهود ولا النصرى حتى تتبع ملتهم<br />كفاكم مداهنة وكذب وتدجيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

