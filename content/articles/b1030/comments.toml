[[comments]]
order = 4
subject = "تبرعوااااااااااااااااااااا"
author = "adhb_85"
posted = "2006-07-05"
text = "يلا يا جماعه مستنين ايه نتبرع للكنيسه وفيها ايه يعني مش عايزين فتنه طائفيه الدين لله والوطن للجميع زي ما قال سيدنا احمد مظهر في الفيلم وسيبك من المسجد ودور المسجد لازم نساعدهم انهم يعبجوا صح وياخدوا اولادهم الكنيسه يربوهم ويفتحوها 24 ساعه ونزودلهم عليها حراسه لكن علشان المسلمين الارهابيين اوعى حد يتبرع للمسجد واقفلو المسجد بعد الازان والمصلين يرجوا من الشبابيك وكمان اوعو تحفظوا قران في المسجد علشان منطلعش ميني ارهاببين وبل ما توقفوا الامن على الباب يحرسهم لا جوه المسجدوفي كل مكان مخبر لكل مواطن مخبر اسف قصدي راجل يحافظ عليه ويحرسه ويوجهه ولو غلط مفيش مانع انه يصححله غلطه بس بطريقته وبعد ما تتبرع للكنيسه متنساش تساعدهم ومهما بيعملو مسرحيات ضد المسلمين الارهابيين اللي ببتعرض جوه بس وفي المسجد اوعى حتى يعملو ولو ندوه كل ده بقى لانك لما هتعمل كده هيرضوا عنك وكمان هيخلو ماما امريكا ترضى عنك مش دايما يقولو تعالى يا امريكا حررينا احنا مستعمرين من الارهابيين دول<br />ياترى فهمت مين اللي محتاج تبرع ولا لا؟<br />وفهمت مين ياعيني المظلوم ولا لا؟<br />وربنا يسترها معانا ان شاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

[[comments]]
order = 5
subject = "متفهموش غلط"
author = "adhb_85"
posted = "2006-07-05"
text = "مش معنى كلامي اننا نعاملهم وحش لا بس اهل الكتاب في ظل الاسلام كانوا عايشين احسن عيشه وبيتعاملوا احسن معامله وده بشهادة ناس منهم لكن لما الصوره تتقلب وبسلم عليك بوش ومن وراك بقطع فيك افكركم بمعانلة النبي صلى الله عليه وسلم للجاره اليهودي و موقف عمر بن الخطاب من القبطي المصري لما اشتكى ان ابن عمرو بن العاص ضربه ظلم واللي عايز يعرفهم ممكن ابقى اكتبهمله بس يطلب<br />المهم اننا نفهم صح ونمشي صح وربنا باديه كل حاجه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123859/http://www.20at.com/article2.php?sid=1030"

