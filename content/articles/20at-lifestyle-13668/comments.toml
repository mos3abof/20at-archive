text = "ممكن بعض الاسئلة بجاوب عليها بسؤال بتدخل الانسان اللى بيسألك فى متاهه<br />زي مثلا لو حد سألك مرتبك كام ؟؟ ممكن تقلو بتسأل لية؟؟ هو نفسو هيلاقى انو مش من حقو يسأل سؤال زي ده لان مش هيلاقي اسباب لسؤالة ويعجز عن الرد…والبعض ممكن يكون رخم يقولك عايز اعرف!! … اطلع انت اذكى منو قلو ايوة تعرف لية يعني؟؟ على هذا المنوال دا اذا كنت انت مش عايز تقطع لغة الحوار بينكم وانت عايزو هو يحاسب نفسو وفي نفس الوقت انت متحرجوش"
