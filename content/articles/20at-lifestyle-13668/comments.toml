posted = "2009-11-19"
text = "تسلم إيديك يا دعاء.. الموضوع فعلا مهم وبيتكرر كتير والناس مفيش فايدة في تجاوزها<br />رغم إن أهلنا ربونا على إن الأسئلة من النوع دا من الحاجات العيب جدا، لكن الواحد بيفاجأ إن اللي حوليه بسألوها عادي جدا فعلا كأنهم بيسألوه ازيك؟<br />عجبني كمان طرحك للحلول في النهاية، وخصوصا: \" لا تعتبر انساحبك وعدم ردك كارثة بل هو أمر عادي للغاية، فالطرف الآخر لم يحرج أن يتدخل فيما لا يعنيه وبالتالي لا تشعر بتأنيب الضمير ولا تتراجع عن قرارك.\" فعلا دي أهم نقطة للناس الذوق جدا الي مبيحبوش يكسفوا حد.. لأ إنت مبتكسفهوش، هو اللي بيكسف نفسو ومفروض يستحي أصلا يسأل عن حاجة بالغة الخصوصية كدا.<br />تسلم إيديك كمان مرة يا دعاء"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202205314/http://www.20at.com:80/20at/lifestyle/13668-2009-10-10-09-53-14.html"

