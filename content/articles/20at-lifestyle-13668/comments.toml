subject = ""
author = "جيـــمـي"
posted = "2009-10-10"
text = "فيه أسئلة بتبقى مستفزة فعلاً جداً .. ومعتقدش أن الأستفزاز بيبقى علشان نوعية السؤال .. ولكنه علشان مين الشخص الى بيسأل وليه ؟ وأنت بتقبله ولا بتبقي عايز تنهى معاه الحوار بأي طريقة .. وزي ما أتقال في الموضوع .. أعرف من يكون وأخبره بما تريد ..<br />تلاقى واحد جاي اول مرة اقعد معاه ويقفش ودني .. انت ساكن فين .. لوحدك ولا مع أسرتك .. شغال فين .. وياتري مبسوط.. وبتاخد كام على كدة في شغلك .. نفسي أعرف أنت ليه مش مرتبط لحد دلوقتى .. ناس قدك وفاتحين بيوت .<br />دى عينة من أسئلة إستفزازية .. أنا شايف ان الأسئلة كلها عادية بس لما تكون بين أتنين قريبين من بعض … سواء أصدقاء أو في محيط الأسرة الوالد و الوالدة ولكن مش واحد أول مرة أقعد معاه أو حتى بقعد معاه كتير بس العلاقة مش الى هى يعنى تسمحله بانه يسأل أى من تلك الأسئلة .<br />الحمد لله ان عندي فوبيا التطفل وإن كنت في بعض الأحيان بسأل أسئلة عفوية نتيجة موقف حصل .. وأعتقد ان كدة أحسن ."
archived = "2009-10-11"
capture_url = "https://web.archive.org/web/20091011232506/http://www.20at.com:80/20at/7ayatna/13668-2009-10-10-09-53-14.html"

