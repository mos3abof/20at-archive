subject = "الراوي"
text = "لأ بئه ,إنتوا باين عليكوا أصحاب وما فيش داعي إننا نخش بينكو.على العموم ,تشكري يا ست منى على التلقائيه اللي كتبت بيها المقال,والخمسه مليون جنيه مش خساره في أي مشهد المخرج عاوزه يبقى صادق وطبيعي, مش هانقارن الخمسه مليون بالتصنع والتمويه السازج والتمسيل البحت اللي شربنا منه سنين طويله كده ولا لأ؟"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813114503/http://www.20at.com:80/article.php?sid=456"

