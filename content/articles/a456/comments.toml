[[comments]]
order = 3
subject = "نونا المجنونة"
text = "مني الجرح الي في دماغ احمد السقا ده عنده من يوم ما بدء تمثيل مش من المكياج ولا انتي قصدك انه مجرم عتيد الاجرام في الحقيقة و المخرج حب يظهر لنا ده<br />و الاخ احمد خان انا ساقطة عربي بس مش زيك كده<br />هذه ايامنا كانت بال ذ مش ال ز و في كلمتين كمان بس يالا خير انا محفظتش ردك بصراحة بس متسكتشي علي نفسك"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813114503/http://www.20at.com:80/article.php?sid=456"

[[comments]]
order = 4
subject = "بيرو"
text = "اجمل حاجة بحبها في المقالات اللي بتتكلم عن الافلام أنها تكون مجرد وصف للي بيحصل في الفيلم من غير الدخول في ادق التفاصيل زي كرافتة البطل والفستان اللي كانت لابساه البطلة<br />والحاجة اللي بحبها اكتر ان كاتب المقالات اللي بالشكل ده يكون عنده حس نقدي طبيعي وموش متكلف<br />يعني موش لازم يكتب في آخر المقال بالبنط العريض(كاتب وناقد سينيمائي مصري)<br />وعلشان كده المقال ده عجبنيييييييييييييي<br />برافو للكاتبة<br />وبرافو لعشرينات كمان!!"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813114503/http://www.20at.com:80/article.php?sid=456"

