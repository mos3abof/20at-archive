subject = "منى أبوالحسن"
text = "نونا: آسفة لإساءة التعبير، قصدت بأن هذا الدور هو أول أدوار خالد صالح أنه أول الأدوار الرئيسية له، و ليست فقط أول أدواره الرئيسية، بل أول أدواره المميزة جدا، و أتوقع أن تتوالى أدواره الرئيسية الجيدة التي تتناسب مع موهبه الواضحة."
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813114503/http://www.20at.com:80/article.php?sid=456"

