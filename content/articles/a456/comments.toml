[[comments]]
order = 1
subject = "نونا المجنونة"
text = "ميرسي يا مني بس خالد صالح ممثل قديم له افلام زي احلي الاوقات و فيلم تاني كان من 3 سنيين مثلا اسمه خلي الدماغ صاحي<br />خالد صالح نموذج لفنان مختلف، رغم تداول اسمه في السينما التجارية علي مدار العامين الاخيرين الا انه لم يأت اليها من رحم الغيب.. قدم في الهناجر مايزيد علي عشرين مسرحية وفي الجامعة بلغ هوسه بالفن لتكوين فرقة مسرحية بتمويل ذاتي.. ورغم عدم ترشيحه بطلا الا انه يحتل مساحة شاغرة في الساحة التي امتلأت بالنجوم بينما تعاني الفراغ في مختلف العناصر الاخري.. ده كلام جريدة الوفد"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813114503/http://www.20at.com:80/article.php?sid=456"

