subject = "واحد"
text = "احمد السقا ده خنيق<br />كل ما اشوفه واشوف تمثيله وطريقة كلامه باتخنق<br />باحسه بيقول شوفوا انا بيئة موت بس واد فهلوي من بتوع شبرا وباعرف امشي حالي واخنقكم بافلامي واحد ورا التاني وكله اتفه من بعضه<br />وجاي علشان اقرفكم<br />انا فارغ من اي مضمون واي مهارة واي قيمة<br />مات العظماء وانا من بقيت لكم<br />انا فضلة الكبه !!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018211511/http://www.20at.com:80/article.php?sid=456"

