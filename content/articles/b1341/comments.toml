subject = "سلمان منا ال البيت"
author = "ياء"
posted = "2006-10-12"
text = "مما يروى عن مناقب سيدنا سلمان الفارسى انه صاحب فكره حفر الخندق فى غزوه الاحزاب فلما انته اصحاب رسول الله من الحفر قال الانصار سلمان منا وقال المهاجرون سلمان منا فتبسم الرسول وقال (سلمان منا ال البيت ) فصلى اللهم على الصحابه اجمعين وعلى التابعين وتابعيهم باحسان الى يوم الدين<br />تهون الحياه وكل يهون ولكن اسلامنا لايهون نضحى له ومن اجله نستحب المنون<br />http://yehia2784.blogspot.com/<br />yehia2784@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123701/http://www.20at.com/article2.php?sid=1341"

[[comments]]
order = 1
subject = "salam"
author = "from lybia"
posted = "2006-10-12"
text = "« إن سلمان الفارسي ـ رضي الله عنه ـ دخل مجلس رسول الله صلّى الله عليه وآله وسلّم ذات يوم ؛ فعظموه ، وقدموه ، وصدروه؛ اجلالاً لحقه ، واعظاماً لشيبته ، واختصاصه بالمصطفى وآله ..<br />فدخل عمر : فنظر إليه فقال : من هذا العجمي المتصدر فيما بين العرب؟<br />فصعد رسول الله صلّى الله عليه وآله وسلّم المنبر؛ فخطب ، فقال :<br />إن الناس من عهد آدم إلى يومنا هذا مثل أسنان المشط ، لا فضل للعربي على العجمي ، ولا للأحمر على الاسود إلاّ بالتقوى. سلمان بحر لا ينزل ، وكنز لا ينفذ ، سلمان منّا أهل البيت .. إلخ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123701/http://www.20at.com/article2.php?sid=1341"
