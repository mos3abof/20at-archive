subject = "تصحيح يا عشرينات"
author = "محمد علي"
posted = "2006-06-29"
text = "لا يوجد ما يسمى بمدني إسرائيلي<br />كلهم جاءوا من خارج فلسطين لتنفيذ الإحتلال<br />من سن 14 عام ينضمون إلى مدارس الهاجاناه العسكرية<br />وكل صهيوني هو ضابط احتياط في الجيش الصهيوني الإرهابي"
archived = "2006-11-02"
