[[comments]]
order = 3
subject = "كلهم ارهابيون"
author = "نيفي نيفين نوفا"
posted = "2006-07-02"
text = "كل يهودى صهيونى و مش هنصدق غير كده<br />الطفل اليهودى بيتولد صهيونى و بيحفظ البروتوكولات قبل ما بيحفظ التوراه و بيتنقش ف قلبه عباره اسرائيل الكبرى من النيل للفراتو بيدرس بروتوكولات حكماء صهيون قبل ما بيدرس مواده الدراسيه و اللى قرا الكتاب دا هبفهم قصدى<br />لا تصالح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124825/http://www.20at.com/article2.php?sid=1010"
