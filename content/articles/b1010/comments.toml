[[comments]]
order = 1
subject = "توضيح لا تصحيح"
author = "منى سليم"
posted = "2006-07-01"
text = "شكرا يامحمد على تركيزك فى اننا لا نخطأ فى تحديد مفهوم هام كهذا، وعندك حق طبعا ان اغلب الاعلام حاليا يقوبل عن من يعيش من صهاينة فى اراضى 48 انهم مدنيين، ولكن الحقيقة اننا لم نق هذا فى مقالنا وراجع المفدمة قلنا بها وهل الصهاينة مدنيون.<br />ولكن حاولنا ان نعرض كل وجهات النظر وخاصة الشرعية التى وان قالت عنهم مدنيين قالت نعاملهم بمثل مابعاملوا به المدنيين لدينا<br />ولكن طبعا احنا بنأكد معاك ان اى صهيونى هو مغتصب وسارق للارض، وراجع الملف الذى اعدناه فى ذكرى النكبة \"تصبحون على وطنhttp://www.20at.com/article2.php?sid=804"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124825/http://www.20at.com/article2.php?sid=1010"

