[[comments]]
order = 10
subject = "الدنمارك شماعة الغضب العربي"
author = "شيماء"
posted = "2006-08-01"
text = "الاخوة و الاخوات<br />السلام عليكم و رحمة الله و بركاتة<br />يا جماعة في حكمة انا اتعلمتها معرفش منين بس اتعلمتها هو ان ضعفناهو ذنبنا و قوة الاخرين ليست ذنبهم طبعا مش مفهوم من كلامي دي اني عشان انا قوية اسعي لفساد الارض و اهانة الاخرين و لكن متنسوش ان اغلب الدول الغربية و دول شرق اسيا ميعرفوش كتير عن الاسلام و لا عن الرسول لاننا مسعيناش اننا نعرفهم مسعيناش لقنوات اسلامية او جرائد باللغات المختلفة لتعريف الناس بالاسلام مش بس كدة احنا سيبنا الغرب و خاصة امريكا تروج الفكر الي هي عاوزاه عن الاسلام انه دين الارهاب تقدروا تقولولي حكامنا عملوا ايه عشان يثنوا امريكا عن الفكرة دي و يثبتو للعالم العكس . تعرفوا بدل ميحاولو يثبتو العكس حاولو يثنونا احنا عن تطبيق الاسلام و نشروا الفساد من حوالينا بمختلف الطرق و ترجعوا بعد كل دة تعتبوا علي الدنمارك طيب اهي الدنمارك يا حلوين عينت مذيعة محجبة لا تضع ماكياج و لا تصافح الرجال في قناه رسمية تلفزيوناتكم انتو يا عرب عملتوا ايه؟؟<br />هل تجرؤ مذيعة مصرية علي الظهور محجبة بلا ماكياج في القنوات الرسمية المصرية..حتي الان مستحيل<br />ارجوكم بطلوا بقي تعلقوا تقصيركم علي شماعات غيركم . التقصير من عندكم انتم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125359/http://www.20at.com/article2.php?sid=1060"

