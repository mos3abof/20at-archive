[[comments]]
order = 12
subject = "الى المغضوب عليهم والضالين"
author = "عاطف زكى"
posted = "2006-09-30"
text = "قال الله تعالى (فأصدع بما تؤمر وأعرض عن المشركين انا كفيناك المستهزءين)وقال الله تعالى (يأيها النبى حسبك الله)حسبك الله فهو ناصركعلى كل عدو ومظهرك على كل خصم ومؤيدك فى كل امر فأنت المظفر لان الله حسبك0وانت المنصور لأن الله حسبك وأنت الموفق لأن الله حسبك0فلا تخف من عين حاسد0ولامن كيد كائد0ولا من مكر ماكر0ولا من خبث كافر0ولا من حيلة فاجر لأن الله حسبك ياحبيبى يارسول الله اذا داهمتك المصائب ونازلتك الخطوب وحفت بك النكبات 0واحاطت بك الكوارث لا تلتفت الى المغضوب عليهم ولا الضالين فلا تحزن لأن حسبك الله أنت محفوظ لأنك بأعيننا وانت محروس لانك خليلناوانت فى رععيتنا لانك رسولنا وانت فى حماية الله لانك عبده المجتبى ونبينا المصطفى اننى اتكلم عن أغلى الرجال وأفضل البشر وأزكى العالمين محمد عبد الله ورسوله رسول رب العالمين المبعوث رحمة للناس أجمعين والحمد لله والصلاة والسلام على عبد الله ورسوله محمد0والهوصحبه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125359/http://www.20at.com/article2.php?sid=1060"

[[comments]]
order = 13
subject = "عيب عليكو يا شباب ويا بنات بتهزرو ف ايه وبتتريقو على ايه واخدين الموضو"
author = "الفقيرة لله"
posted = "2006-10-18"
text = "اولا معظم التعليقات هزلية وملهاش لازمة ويا ريت اللى يعلق يا اما يفيدنا يا اما يوفر كلامو وهزارو لحاجات تافهة، موضوع زى ده محتاج واقفة وواقفة مستمرة ودايما وانا بحترم اللى كتب الموضوع ده وبقولوا هوه مش قديم ولا حاجة ده مستمر وهيفضل مستمر وانت بكتابتك ليه بتفكر اى حد نسى بالاساءة لحبيب الله وحبيبنا محمد صلى الله عليه وسلم فعلا الشباب الغافل اللى بيهرج محتاج حد يفكرو كل شوية بموضوع زى ده يمكن يفوق ويفهم ويحس وبقول كلمة للاخ اللى مش عاجبوا اسلوب الكلام وبيطلب التركيز انه الموضوع مكانش يتكتب افضل من كده وده لانه مكتوب ببساطة ووضوح ممكن اى حد يفهموا واديك شايف العينة من الناس اللى بيقرو بيهرجو ولسة مش فاهمين ان الموضوع كبير قوى يا رب ساعدنا وقوى من ارادتنا وقف معنا ضد اعدداء حبيبك محمد وقوى عزيمتنا واخسف بهم ارضك يا الله يا قادر على كل شئ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125359/http://www.20at.com/article2.php?sid=1060"
