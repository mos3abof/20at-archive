[[comments]]
order = 5
subject = "عمرى ما كنت اتخيل"
author = "واحد اول مرة يكتب تعليق"
posted = "2006-07-12"
text = "ازاى تتعاملوا مع موضوع باهمية الاسائة للرسول بالطريقة دى انت بتكتب الموضوع عشان مديرك قالك لازم تكتب موضوع ؟؟؟<br />وزمايلك فى الشغل قاعدين يردوا عليك<br />انتو فاكرينوا ماسنجر وانتو قاعدين مع بعض ترغوا<br />موضوع بالاهمية دى لا يعمل بالسطحية وعدم الحرفية الشديده اللى انت عملتها دى<br />تانى حاجه بقول لمديرك انه لازم يكون ليه تصرف فى الموضوع ده<br />الموضوع مكتوب بعدم حرفيه خالص ( انا مش متخصص لكنى متابع جيد )<br />يعنى كلام ملوش لزمه خالص فى الاول وبعدين كتبت الخبر ( نقلا عن العربيه )<br />وبعدين كلام ملوش لازمه فى الاخر<br />والاغرب ان ده الخبر الرئيسى للموقع<br />انا مش عارف انتو بتعكوا كده ليه يا عشيرنات<br />ارجو منكم انكم تركزوا شويه ولا تستخفوا بعقول من يتابعكم<br />تحياتى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125359/http://www.20at.com/article2.php?sid=1060"

