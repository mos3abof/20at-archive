subject = "دماؤنا فداك رسول الهدى"
author = "ريم بنت السعودية"
posted = "2006-07-11"
text = "عجبا لكم تعليقات ولا احد منكم دافع عن الرسول محمد صلى الله عليه وسلم حتى وان كان الموضوع قديم اكون دائما معك ياحبيبنا رسول الله اللهم صلي عليه \\\\\\\\\\\\\\\\\\\\\\\\ العجب العجاب واحد يقول عدلو الدستور ولا هان عليه يكتب عن الرسول صلى الله عليه وسلم ولو كلمة والاخر يقول رئيسك والاجتماع انتم لها الدرجة صدقتو ان رئسه غضبان عليه هو يبغى ردود ودفاع فقط [[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[ قاطعوا الدنمارك بل اوروبا للابد الا رسولنا محمد صلى الله عليه وسلم باابي هو وامي عرضي دون عرضك يامن بلغت الرسالة و وصلت لنا من دون تعطيل ولا تحريف يامن اخرجتنا من ظلمات الجهل الى نور الا سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125359/http://www.20at.com/article2.php?sid=1060"

