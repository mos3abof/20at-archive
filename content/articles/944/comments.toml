text = "إيه الجمال ده . أدي كل الموقع قراه أهه ... وناقص سيادة الريس ... يقراه بس ...<br />بس حيطلع عينك لما يلاقي ان الناس اللي دخلت وعلقت عليه .... الهواري ومصعب بس ...<br />أنا قلت عشان المنظر العام ... أعلق أنا كمان ... يمكن أشفعك لك ....<br />وبعد كده - أي نعم الاجتماعات الدورية دي ملهاش لازمة وكله بيبقي قاعد مخنوق - بس معلش ..... متبقااااااااااااش زيي .. وعدل مواعيدك ....<br />وبرضه مش حاسكت ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
