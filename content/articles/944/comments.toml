text = "لما بدأت الحملة ضد الرسوم المسيئة ..انفعلت و اتشالت و اتحطيت وتكلمت عن المسلمين و العروبة<br />فقالت لي اهدي شوية ..الناس دي بتخطط صح ..و عارفين اننا سذج و اغبيا ..عارفين اننا بثوووووووووووووور جاااامد أوي و بنهبط بسرعة جدا<br />و بننسى ..وننام في العسل<br />وقالت لي برضه الابداع-اذا كانوا هما بيعتبروا ده ابداع- يترد عليه بابداع تاني..والرأي يترد عليه برأي و الكتاب بكتب و المسرحية بمسرحيات ,,لكن المظاهرات و الحاجات اللي بتقطع القلب دي مسيرهاالى زوواااااااااال"
