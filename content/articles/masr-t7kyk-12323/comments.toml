posted = "2009-06-10"
text = "أفلام عادل امام كلها حشيش وخمره ونسوان ومخدرات وسفاله واستخفاف ومعاه محمود عبدالعزيز وغيره تفاهه مفكرين انها فن …لن أنسى السجاره التي لم تفارق محمود عبدالعزيز في مسلسل رأفت الهجان قمة في الفشل والتطفل على الفن والادعاء بأنهم تاريخ مصر الفني …رحمك الله يا أحمد زكي فقد كنت فعلا الفنان المصري ابن البلد"
archived = "2009-06-11"
capture_url = "https://web.archive.org/web/20090611132357/http://www.20at.com:80/masr/t7kyk/12323-2009-06-09-11-52-46.html"
