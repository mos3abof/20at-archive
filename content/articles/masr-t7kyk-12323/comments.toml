author = "john"
posted = "2009-06-09"
text = "العنف فى الفيلم ده \"over\"وانت عندك حق فى حكاية ان كل العاملين فى الفيلم بيعملو على انهم يخلوا البطل مجرم بس فى نفس الوقت مجرم طيب وجميل وان الاجرام ده حاجة سهلة والقتل دة حاجة سهلة والتنطيط والحركات بتخلى الغير ناضجين او الاطفال يخدو البطل ده مثل اعلى ليهملكن مروان حامد بجد هيعدى من الفيلم ده لان واضح انو بذل مجهود وعمرو واكد انا بأيت من اشد معجبينو والسقا كان خرافة انا بحبو من زمان"
archived = "2009-06-11"
capture_url = "https://web.archive.org/web/20090611132357/http://www.20at.com:80/masr/t7kyk/12323-2009-06-09-11-52-46.html"

[[comments]]
order = 1
subject = ""
author = "هذا واقع مجتمع"
posted = "2009-06-10"
text = "الفن مرأة للمجتمع<br />نعم فى الافلام القديمة كانت الخمرة مشروب منتشر لان مصر كان فيها جالية كبيرة جدا من الاروبيين وبالذات اليونانيين ولا تنسوا ان السينما المصرية بدأت على ايديهم وايدى النصارى القادمين من الشام تحت ظلم الحكم التركى بل ان لبلبة ومجموعة ممثلات اصلهم ارمن وملل من كل حتة استوطنت اسكندرية والقاهرة وهؤلاء بتوع كاس وخمر<br />اما الان<br />فنحن فى عصر البلطجية والسنج والسيوف وفرض الفرد وفى كل شارع وكل يوم قتل<br />القتل والعنف موجود فى كل مكان"
archived = "2009-06-11"
capture_url = "https://web.archive.org/web/20090611132357/http://www.20at.com:80/masr/t7kyk/12323-2009-06-09-11-52-46.html"

[[comments]]
order = 2
subject = ""
author = "هاني مرقص"
posted = "2009-06-10"
text = "الحقيقه الافلام هذه تنقل للعالم وبالذات الخليج ان مصر خمره ومخدرات ودعاره<br />يا ناس محتاجين حمله تغيير صورة مصر في عيون العالم لا احنا حشاششين ولا<br />الدعاره والرقص والمسخره في بيوتنا …<br />منك لله يا أعداء الصليب هنلاقيها منالحكومه ولا من النصابيين الي بيقولوا فنانيين<br />اتفووه على كده فن"
archived = "2009-06-11"
capture_url = "https://web.archive.org/web/20090611132357/http://www.20at.com:80/masr/t7kyk/12323-2009-06-09-11-52-46.html"

