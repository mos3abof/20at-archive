[[comments]]
order = 0
subject = "نونا المجنونة"
text = "برغم من اهمية الموضوع و انه منقول عن اراء الشيخ الغزالي رحمه الله رحمة واسعة لكن التعليقات كلها راحت لموضوع روبي للاسف :( تفتكروا ده مؤشر لاية؟؟؟<br />علي فكرة برغم جمال الموضوع لكن انا احب ان اكون رئيسة مملكتي في بيتي عن اني اكون رئيسة في شغلي<br />العمل للمرأة بهدلة بالذات المهندسة لان بتقابل نوعيات من البشر غريبة و بتتعرض لمواقف وحشة ياريت نعمل موضوع عن المضايقات الي بتقابل المرأة في العمل و انا ممكن احكي لكم منها حواديت"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926043952/http://www.20at.com:80/article.php?sid=510"

