subject = "موقع عشرينات"
text = "الأخت العزيزة \"نونا\" .. عندنا فكرة: لماذا لا تكتبي أنتي لنا موضوعاً عن تلك المضايقات، تحكين فيه لنا تجربتك في ذلك العمل.. ما رأيك؟!<br />ننتظره منك في أقرب وقت على : 20at@islamonline.net"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926043952/http://www.20at.com:80/article.php?sid=510"

