[[comments]]
order = 40
subject = ""
author = "محمود حسين"
posted = "2009-11-18"
text = "مع كل احترامى لكابتن ميمى الشربينى<br />وهو من افضل المعلقين الرياضيين فى الوطن العربى<br />وصوته القرب الى قلب مستمعين كثيرن جدا<br />وثقافته العالية جدا جدا<br />وحبه الشديد لمهنته وعدم دخوله فى دائره استوديوا التحليل وخلافه<br />الى انه ابتعد كثيرا ولا نراه او نسمهع صوته فى التليفزيون كل فاطره كبيرا جدا<br />لدرجة ان فى ناس افتكرت ان الكابتن ميمى اعتزل التعليق<br />ولكن لا يصح ان نضع ميمى الشربينى فى مقارنه مع حازم الكاديكى<br />فلكل منهم مدرسة فى التعليق<br />حازم ينتمى لمدرسة الشمال فى التعليق الحماسى الملتهب<br />ومن المزيعين المحايدا جدا جدا<br />ويجد ايضا فارق فى السن رهيب بين الاثنان<br />بختصار شديــــــــــــ ــــــــــــــد<br />ميمى قوى جدا لكن لا يوجد جديد يقدمه<br />حازم متميز جدا ويطور نفسه بستمرار<br />معلومة<br />الشعب المصرى يحب من يتعاطف معاه من المزيعين العرب<br />خصوصا ان حازم ليبى وزوجته مصرية من الاسكندرية<br />وهو يعشق مصر جدا"
archived = "2009-12-21"
capture_url = "https://web.archive.org/web/20091221085620/http://www.20at.com:80/masr/hot-topics/14053-2009-11-15-13-04-23.html"
