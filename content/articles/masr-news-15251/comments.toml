subject = ""
author = "80 سنه عذاب"
posted = "2010-02-08"
text = "يا جماعة بقالنا 80 سنه سجون ومعتقلات بسبب الاخوان<br />مش معقول كده البلد في النازل<br />80 سنه لا الاخوان عارفين ياخدوا الحكم ولا هما سايبينو في حالو<br />ارحمونا بقا جعنا يا ناس الفشل الكلوي بقا عامل في مصر زي الانفلونزا وكمان السرطان<br />خلصونا بقا من لعب العسكر والحراميه دا<br />لا الاخوان عندهم مخ ولا الدولة عندها مخ<br />وعملوا الشعب سندوتش<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />مش دعاء الشامي ولا مروى عبدالفضيل"
archived = "2010-02-09"
capture_url = "https://web.archive.org/web/20100209224425/http://www.20at.com:80/masr/news/15251--14-.html"

[[comments]]
order = 2
subject = ""
author = "هو دة الشغل"
posted = "2010-02-08"
text = "خليهم عندكم بقى على طول<br />مش تقبضوا عليهم النهاردة وتتركوهم بعد اسبوعين وبعد تقبضوا عليهم مرة تانية وهكذا<br />ملينا اعتقال وافراج<br />ان كان دول سبب مشاكل مصر خلوهم فى الحبس على طول وريحونا<br />اذا كان اعتقالهم هيجيب لنا انابيب بوتاجاز ويرخص السكر ويوظف العيال ويجوز البنات يبقى ولعوا فيهم بجاز<br />يا اما بتتسلوا بينا وبيهم<br />اصل انتم بقيتم كتير قوى وفاضيين<br />وعمار يا مصر"
archived = "2010-02-09"
capture_url = "https://web.archive.org/web/20100209224425/http://www.20at.com:80/masr/news/15251--14-.html"

