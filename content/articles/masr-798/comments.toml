[[comments]]
order = 7
subject = "افضفض آه .. حد يسمع لأ"
author = "مصراوي بلا حدود"
posted = "2006-08-12"
text = "مفيش حد فاضي يسمع حد .. الكل بيجري ويلهث ورا لقمة العيش .. تركنا آدميتنا أصبحنا بلا شعور ولا أحاسيس .. كلنا عايزين نفضفض .. عن أوجاعنا وهمومنا .. لكن مين يسمع .. مشاكِل اقتصادية قاتلة .. أب يومه كله عمل .. لا وقت لأن يسمع زوجنه أو أبناؤه .. والحكومة لا تسمعه أيضاً .. فلا مرتبات تكفي الحد الأدنى لحياة كريمة ولا كرامة ولا حرية .. سلسلة بعضها من بعض هذا كله بالإضافة إلى قلة الوازِع الديني .. فليس لنا إلا الله يسمع شكوانا وندعوه عله يستجيب لنا وينقذ أصحاب القلوب الضعيفة من الإقدام على الانتحار"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830142306/http://masr.20at.com:80/article.php?sid=798"

[[comments]]
order = 8
subject = "عادي جدا"
author = "منتحر كذا مرة"
posted = "2006-08-12"
text = "يا جماعة الانتحار في الايام دي جميل ,,, انا حتى انتحرت يجي 3 مرات وعادي العميلة صعبة في أول مرة بس بعد كده بتتعود دايماً<br />وبعدين انا واصحابي احيانا بنطلع ننتحر كل يوم خميس على الكورنيش ,, بس أحسن طريقة جربنها لحد دلوقت إننا نموت بعض من الضحك ونصحى عادي ونكمل"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830142306/http://masr.20at.com:80/article.php?sid=798"

[[comments]]
order = 9
subject = "الشعب مات من زمان"
author = "ميت قديم"
posted = "2006-08-12"
text = "المصرى إللى بينتحر ده ميت مستجد لكن الشعب كله مات من زمان من 25 سنة من يوم لما إتهمش وإحتل مصر الحثالة من يوم لما حقه فى بلده إتاكل وباعو المصانع والشركات وطردوا العمال إللى فيها ونهبو مصر بالجملة والقطاعى من يوم لما ضربوا الشباب بالأحذية وهذا لم يحدث فى أى دولة فى العالم إلا فى الدول المحتلة ومن المحتل لكن أن يضرب الشعب بأحذية الشرطة بأمر من الحاكم وإبنه فأهون على الشباب الإنتحار وإنتحر يوم أن أصبح عبد فى بلده بعد أن كان سيد ويوم أن زور صوته فى الإنتخابات ليستمر المحتل للسلطة باقى إلى إبد الأبدين ويحاول توريث الحكم بنظام فيكو يا أخفيكو فالشعب فضل أخفيكوا وإنتحر على أن يرى مصر الغالية فى يد متخلف عقلياً كل خبراته السرقة النهب ولكن الشعب المقتول بث الله فيه الروح وسينفجر إن شاء الله وستتبدل الأدوار ليكون المنتحر هو كل خائن لوث تراب مصر"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830142306/http://masr.20at.com:80/article.php?sid=798"

[[comments]]
order = 10
subject = "الفضفضة"
author = "شيرين عبد الحميد"
posted = "2006-08-12"
text = "كثرت هذه الايام وسائل الفضفضة عن طريق الانترنت من خلال المواقع العامة و كذلك المدونات و ايضا عن طريق الجرائد سواء كانت المعارضة او حتى القومية و هذا ما تريده القوى المتحكمة فى الدولة و ذلك لان الناس عندما تتكلم و تفضفض ترتاح فلا يكون هناك كبت قد يؤدى الى الثورة او الاحتجاج, حتى حق التظاهر اصبح عادى الان و لكن باذن و بدون خروج عن الامن العام والا, الكلام ببلاش ولا احد يقرأ و ان قرأ لن يفعل شيئا الا الضحك ثم يرمى ما قرأه فى اقرب زبالة او بضغطة زر يعمل مسح"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830142306/http://masr.20at.com:80/article.php?sid=798"

[[comments]]
order = 11
subject = "بدون عنوان"
author = "فاعل خير"
posted = "2006-08-18"
text = "هو الموضوع كويس<br />بس الموضوع ده محزن اوى ولا فيلم واحد من الناس<br />الناس مش ناقصه حزن<br />وانا هضيف لكم موضوع<br />ف الاونه الاخيرة لقد انتحرت فتاه تدعى جميله الوحشه و ذلك بسبب كثرة العرسان عليها و ترددت ف القبول ممن تقبل فقامت بالانتحار من فوق الكنبه<br />كانت معكم .... من قناه فضفض ترتاح"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830142306/http://masr.20at.com:80/article.php?sid=798"

[[comments]]
order = 12
subject = "التغشف التام او الموت الزام"
author = "نصر الرشيد"
posted = "2006-08-20"
text = "والله موضوع شيق وخارج من المواضيع المعتاده وفعلا مهم مش مجامله عشان الناس تبدا تفكر جديا فى المشاكل الاجتماعيه والظواهر الغريبه الى بدات تظهر على الساحه ومنها الانتحار وامكانيه الحد منه لانو بدات الناس تفكر فيه كحل لمشكلاتهم بس ناخد مثال الاب الى انتحر عشان مقدرش يوفر لاولادو سبل المعيشه اليوميه طيب بعد ماينتحر مافكرش ممكن يحصل ايه لاولادو انا اعتقد دا راجع للاميه زى ما حضرتك كاتبه فى الاحصاءيات عشان كدا الموضوع دا عاوز توعيه كبيره من المساولين والقائمين على الرعايه الاجتماعيه فى البلد وضروره فتح مراكز تاهيل اجتماعى فى الاحياء وخاصه الشعبيه منها موضوع جميل ورساله مهمه للقائمين على الامر على حد اعتقادى ربنا يوفقك ياداليا 1010"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830142306/http://masr.20at.com:80/article.php?sid=798"
