text = "الانتحار يزيد من الاواصر الاجتماعية ويقوي العلاقات الاسرية ومفيد للكبد واكتشسف الاطباء انه بديل لانسولين في احيان كثيرة..<br />وقد افاض الدكتور زغلول الشملول في وصف دلائل الانتحار والاعجاز في اشارته الخفية في الكتب المستخبية...<br />انتحروا يرحمكم الله!!"
