[[comments]]
order = 5
subject = "داه منحى سياسى جديد"
author = "واحد مستنى الباص"
posted = "2006-08-12"
text = "الحكومه اكتشفت ان لا \"انظر حولك\" جايبه نتيجه ولا مشروع الدكتور جايب فايدة ولا حبوب منع الحمل ادت لاى تأثي من الاخر الحكومة اكتشفت انه مافيش فايده من المكافحه البيولوجيه قامت اتبعت اختيار المكافحه المضاده<br />سيب الناس تولد<br />وحث الناس على الانتحار<br />مشكرين يا حكومه على كل جديد<br />اه نسيت اقول الدليل<br />لو حد اتصل بالشرطه عشان خناقة جامده ولا اى حوار فيه اسلحه مش هيروحوا الا بعدها بساعتين<br />يكون اللى مات مات واللى انضرب انضرب"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830142306/http://masr.20at.com:80/article.php?sid=798"

