posted = "2006-08-11"
text = "ايه المشكله فى الانتحار ما الحكومه عايزه كده ويسعدها انهم يزيدوا لان غالبيتهم من المعارضين اما على المدرس او العيشه الزفت او على ظلم واقع عليه ياللللله خليهم ينقصوا شويه وكله سبوبه عند الحانوتى وهو يشغل شويه عاطلين معاه يعلمهم المهنه الجديده ويمكن ديه تبقا مهنه 207 الجايه وربنا يطول عمر بابا حسنى"
