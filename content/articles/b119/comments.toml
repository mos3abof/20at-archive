subject = "وحدو الله"
author = "ياء"
posted = "2005-12-21"
text = "وحدو الله يا جماعه محدش يعمل فى نفسه كده الموضوع مش مستاهل وذى مادخلنا بالمعروف نخرج برده بالمعروف( محدش يكسرالكمبيوتر)<br />افصل النت بالراحه<br />منك لله يا براء ميجيش منك الا مشاكل<br />حاول تهدى النفوس والشقه من حق الزوجه لو كان لها اولاد<br />عللى فكره لو شفت المرشد حبوس ايده الاثنين مرتين وخلى عبدالله كمال يفرقع<br />هاهاهاهاها<br />yehia2784@hotmail.com"
