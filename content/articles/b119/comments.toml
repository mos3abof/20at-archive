[[comments]]
order = 20
subject = "لوسمحت اقرا قبل متكتب"
author = "مثقف"
posted = "2005-12-21"
text = "يا اخ براء قبل متكتب اقرا عن مجهود الاخوان فى ملس الشعب الى فات هتعرف انك جاهل فى الموضوع ده ومش من حقك تكتب فيه وده مش كبت لحريتك بس هشان محدش يتهمك بالكدب او الجهل<br />وخاصهانك بتتكلم عن اقوى معارضه فى مصر متستخفش بالنواب الى اختارهم الشعب<br />انت مقرتشى طبعا برنامج الاخوان لدخول مجلس الشعب ومقرتشى بيانات نشاط نواب الاخوان فى مجلس الشعب الى فات ومقرتشى عن اهداف الاخوان ومقرتشى عن تخصصات النواب داخل لجان البرلمان وللاسف انت جاهل فى الموضوع الى بتتكلم عنه<br />اتكلم فى حاجه تفهم فيها<br />احسن مضيع وقت الناس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

[[comments]]
order = 21
subject = "سيادة المحافظ"
author = "إلى الأخ الشمحطجي"
posted = "2005-12-21"
text = "ايه يا عم عمال تهبد الناس أحكام يمين وشمال خير يا عم؟<br />بالهداوة شوية<br />قلت عبد الله كمال مخبر ونسبت الموضوع ان انت بينك وبينه مسائل في المسائل الواحد قال معقولة برده الإشاعة مالية البلد، قلت آفاق مليانة خوازيق وغلط في دلتا مصر كلها من شرق الدلتا لغربها بدأ الواحد يقلق، لكن فكرة الدولارات الخضرا كلنا نتمناها ونفسنا فيها هي والجمبري والكفتة وزي ما انت قلت كلنا بنشمشم على ريحتهم<br />لكن البنات اللي بيلوا دي حاجة في الوف سايد منك انا أعرف انك راجل محترم وابن بلد وأصيل ميصحش منك تلميحات خارجة وعلى رأيك يا أستاذ شمحطجي الصياعة أدب<br />مش كدة ولا ايه؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

[[comments]]
order = 22
subject = "مع الشمحطجى"
author = "خارج المضمون"
posted = "2005-12-21"
text = "معلهش ياجماعة انا مع الشمحطجى فى نقطة واحدة بس وهى ان اللى بيشتغل فى اسلام اون لاين من الاخوان لازما ولابد ان يترك الجماعة والامش هايتعين وده كلام من ناس شغالين هناك وده لأن الموقع عايز علاقته تفضل حلوة دايما بالحكومة ، وللعلم ياجماعة الموقع ترتيبه فى النازل، بس على العموم الأمور أبسط من كده واستهدوا بالله ياجماعة ده احنا داخلين على شهر كريم (ذى الحجة)<br />وأحب أقول لبراء دع الكلاب تتنبح والقافلة تسير<br />أقول قولى هذا واستغفر الله لى ولكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

[[comments]]
order = 23
subject = "الخنوع المذل والقبله !"
author = "عبد الرحمن جادو"
posted = "2005-12-21"
text = "عبد الله كمال وحمدى رزق صاحب نظرية حجر المعسل المشبر اللى وجعلنا بيه دماغنا فى عموده اليومى بجريدة المصرى اليوم ما بيصدقوا يلاقوا حاجة للاخوان يعملوا عليها حفلة يتبادلون فيها الغناء والطنطنة ؛ تارة يكتبون عن وثيقة لفتح مصر (مش عارف هيفتحوها ازاى يعنى اكتر ماهى مفتوحة بصراحة)روزا اليوسف اليومية بصراحة بتقوم بالدور على اكمل وجه سواء من فتح ابوابها وشبابيكها لاى حد يهاجمن الاخوان فقط من اجل الهجوم او من محاولة ايجاد صيغة جديده للموالسين يحاولوا فيه ان يركبوا صاروخ الوصولوية ويعبروا به عبر قناة اللى تكسب به العب به وصولا الى قناة طشة الملوخية للمتميز ممتاز القط.!<br />اى حاجة فى اى حاجة هو شعار المرحلة لمهاجمة الاخوان خاصة من يعتمد على مصدر دخله من الهجوم على الاخوان وتلفيق الوثائق والبرديات والبلى الازرق على جتتهم .<br />لكن تبقى البوسه عندى افضل من تقبيل احذية الامريكان والصهاينة .تبقى البوسه مع ما تحمله من اى معنى هى افضل من الحياة تحت احذية مبارك وصفوت الشريف ولجنة السياسات ؛ تبقى البوسه مهما اختلفنا معها هى اشرف من النوم على اعتاب الظلم والفساد وتبرير الاخطاء للظلمة ممن انتهكوا ابسط حقوق الحياة .<br />دع من يكتب يكتب ومن يقول يقول واعلم ان اهل الحق سيقتصون ممن ظلمهم وتهكم عليهم يوم ان يقفوا بين يدى الحق تبارك وتعالى ؛اما فى الدنيا فخيبتهم القوية وتسليط ضمائرهم ونفوسهم الخربه عليهم هو اشد عقاب ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

