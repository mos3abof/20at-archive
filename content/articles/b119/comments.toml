subject = "تاعبين نفسكم قوى"
author = "مش داخل الموقع ده تانى"
posted = "2005-12-20"
text = "اكيد فهمتوا البراء ده عامل ايه خلى واحد ولا اتنين من اصحابه يقولوا كويس عشان كسفته تتدارى اهم حجه انه طلغ واد كاتب كبير وعمل جدل قدام بتوع الموقع والاداره بتاعة اسلام اون لاين بصوا هوه ده اللتلاقيه تحت مقالاته تعليقات كتير يعنى ليه قارئ الاستاذ البراء عشرينات سقط وسلملى على البنات اللبتكتب حاجات هايفه وسلم الدولارات وماتنساش تكتب تاني وتعلق على نفسك تانى ويجعله عامر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

