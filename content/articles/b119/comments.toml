subject = "فيه ايه"
author = "حمدي"
posted = "2005-12-22"
text = "كل هذا الهجوم علي براء علشان نقل موضوع مش علي مزاج البعض ...<br />وبعدين هو الاخوان المسلمين ملائكه وفوق النقد...مادموا ارتضوا العمل السياسي لابد ان يتعلموا ان يتقبلوا النقد كما يوجهون النقد للاخرين<br />وبعدين حنا نشوف ايه المضمون بغض النظر عن مين اللي كتبه<br />لو انتم عايزين ننتقل من ديكتاتوريه علمانيه الي ديكتاتوريه اسلاميه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

