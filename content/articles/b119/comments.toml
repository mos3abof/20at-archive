author = "واحد بيحب الحق"
posted = "2005-12-20"
text = "بعيدا عن قبلة النائب على يد المرشد الت أتحفظ عليها الا انه يجب التنويه على شيئ هام هو أن الاخوان يقولون أن عملهم فى البرلمان السابق مثل 31% بالرغم من أن نسبتهم كانت 3% وهو مالا يعقل معه أن شغلهم الشاغل كان هذه القبلات فقط وإلا فليقول هؤلاء الذين يدعون أن الإخوان إلا يهتمون بالقبلات فقط كم استجوابا قدمه الاخوان؟ وكم استجوابا منهم كان عن تلك القبلات؟ وإلا فليسكت هؤلاء عن توجيه اتهاماتهم المرسلة التى لا تستند الى دليل رقمى يؤكد صحتها ولينتظروا أداء الإخوان فى البرلمان المقبل الذى سيؤكد تلك الإتهامات أو سينفيها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

