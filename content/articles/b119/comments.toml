[[comments]]
order = 3
subject = "والله رد بليغ فعلا :D"
author = "Pure^Heart"
posted = "2005-12-19"
text = "بسم الله الرحمن الرحيم<br />ههههههههههههههههههههههههههههه<br />أنا مكنتش ناوي اكتب رد على الموضوع لأني بصراحة لسة مقريتش المقالتين ومعنديش كل المعلومات الكافية عشان أعلق..<br />بس بجد يا براء ردك الأخير عجبني وخلاني أكتر التعليق ده..<br />\"وأنت من أهله\"<br />loooooooooooooooooooooooooooooooooooooool<br />بس بصراحة بعيدا عن النعام الذي يدفن رأسه في الرمال.. وفاقدي النظر الذي لا يرون حولهم سوى عالمهم الخاص.. وغير ذلك من أصناف البشر.. فموضوعك لا يسيء إلا قلمك الذي اتحفنا بالكثير من قبل..<br />ويطرح قضية قابلة للنقاش الموضوعي المتحضر بين المفكرين..<br />أأود أن أذكر هنا مقولة قرأتها ذات مرة على الموقع العملاق إسلام أونلاين وفي صفحة معا نتطور: \"يعد التفكير من أكثر المهام صعوبة لذلك لا يقوم به الكثير من الأشخاص\"<br />أحييك وأحيي كل شخص يحترم عقله..ويفكر...<br />والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

