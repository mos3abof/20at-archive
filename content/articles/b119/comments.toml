[[comments]]
order = 7
subject = "طز ...يا باشا !!"
author = "الشمحطجى"
posted = "2005-12-20"
text = "بصراحة و من غير كلام كتير<br />من الاول خالص قريت مقال عبدالله كمال و معروف لامؤخزة مين هو عبدالله كمال و عن تجربة شخصية و ومن قريب معاه ...عبدالله كمال من الاساس مخبر امن دولة ومن غير كلام كتير ...فيعنى محدش بياخد على كلام لامؤخزة واحد مخبر لامؤخزة بيبوس ايد و رجل و ال ass اى حد ممكن يوصله لكرسى الحكمدارية فى روز اليوسف ..بس للانصاف عبدالله كمال بالرغم من ان كل العبر النجسة فيه الا انه صحفى متمكن من ادواته و اديه تتلف فى حرير ...بس هنعمل ايه ...مخبر !!!<br />اما عبدالجليل الشرنوبى فهو ابن التكية بتاعة الاخوان الى اسمها \"آفاق عربية\" الى الاخوان لمو فيها عواطلية الجماعة و اصحاب الوسايط و فلاحيى الدلتا من الاخوان و لموهم جوه الجريدة و عملوهم صحفين و دخلوهم النقابة بالاونطة من غير حتى ما يشتغلو و معروف للجميع ان الجريدة دى احدى مؤسسات الاخوان الملتهبة الى كلها مشاكل و خناقات و خوازيق بين الاخوان و بعضيهم البعض و كلام كتير مالوش لازمة و انقلابات و دسائس و نمائم بنهم ولا شجرة الدر !!<br />النقطة الاخيرة فيها إيه لما الموقع النكتة ده الى اسمة عشرينيات يكون تابع لإسلام اونلاين ...مش عيب يعنى و لا هى الغيرة و الحقد على المرتبات الى بتدفع بالدولار الاخضر الجميل مع قلة الشغل و المعاملة الى زى الورد ...يعنى لامؤخزة الشغل فى اسلام اون لاين او اى حاجة تبعه حلم لأى صحفى صوغنون هياخد مرتب حلو و مكاتب شيك و و المحررات هناك لزاز خاليص \" بيسلو زى msm\"محدش بيتابع لأن أنهار الدولارات الخضرة الجميلة متدفقة بغير حساب من الخليج الهادر ومن مسلمين غلابة بيدفعو تبراعت لناس \" لامؤخزة يا عم براء\" لا عندها ضمير و لا احساس بيبعترو فيها يمين على مرتبات و بدلات و سفريات و مقرات جديدة و كباب و كفتة و عصير و سمك و جمبرى .... و إلى إداك يدينا يا سيدى !!!<br />و الاهم من ده كله معروف ان اى حد بيشتغل فى اسلام اون لاين من الاخوان بيسيب الاخوان و بيبقى اسلام اون لاين لأن بيبقى عليهم ضغوط فى النقطة دى تحديداً ...بمعنى ان طريق الاخوان انهم يسيبو الاخوان هو انهم يشتغلو فى اسلام اون لاين و امثلة كتير على كده ....كله بيأثر السلامة و ادينا شغالين فى الاسلام اون لاين أأمن من الاسلاميك بروزر<br />و الدولار غالى و اغلى من الدولار دولار الدولار<br />المهم ..هو وضع البلد كله زى الزفت مجتش على اسلام اون لاين و لا الاخوان و لا عشرينيات و لاحتى روزاليوف و لا حتى المخبر عبدالله كمال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

