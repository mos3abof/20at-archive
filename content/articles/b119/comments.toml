[[comments]]
order = 0
subject = "والله انت فاضي يا براء"
author = "مواطن مصري حر"
posted = "2005-12-19"
text = "بصراحه يا ابني يا براء<br />انتي فعلا فاضي<br />ومش لاقي موضوع تكتبه زي ما رزو اليوسف برضه مش لقت حاجه الا موضوع البوسه<br />والموقع بصراحه ززي ما بيقول الغالبيه في النازل كل يوم<br />وزي ما الكل عارف ان اي صحفي الايام دي عاوز يظهر<br />يكتب عن الاخوان والبوسه والفندق والاكل وانهم معاهم فللوس وبيجيبوا ا الفلوس منين وان الناس بتايدهم وبتحبهم وتقدرهم وتحترمهم<br />يا ابني روح شوف مذاكرتك احسنلك ولا كليتك اللي مش بتروحها من اساسه<br />وعلي فكره انتا من الاخوان علي حد علمي<br />او زي ما قالي واحد صاحبي ا اغلب الصحفيين في عشرينات اخوانجيه او اسلاميين من الكرامه او الاحزاب الصغيره اللي طالعه من الاخوان قريب<br />فعيب برضه يعني<br />وبلاش شغل انك عاوز حد يعرفك علي الفاضي<br />وسيب الناس في حالها وبص لنفسك<br />مواطن مصري حر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

[[comments]]
order = 1
subject = "والله انتا فاضي يا براء"
author = "مواطن مصري حر"
posted = "2005-12-19"
text = "ولا انتا عاوز حد يعلق كتيير علي مقالاتك فبتدور علي الحاجت اللي تثير الشباب<br />واغلب الشباب اللي بيفتحوا الموقع اخوان<br />ولا هدفك ايه باظبط<br />المهم ربنا يعينك ونشوفك حاجه في اسلام اون لاين كده ولا حاجه<br />وتقعد تحلل غلط وعلي الفاضي زي جمال عرفه اللي في اسلام اون لاين<br />واجع راسه علي الفاضي في تحليل الاخوان والحكومه والاحزاب وحاجات هبه كلها<br />ربنا يعين الصحفيين من الاشكال دي<br />ومين الي قال ان عشرينات مش تبع اسلام اون لاني<br />تبعها ونص كمان<br />وكله عارف كده<br />ولا نجيب الدليل<br />ولا بلاش<br />ربنا يعينكم<br />ويعينك يا ابني يا براء<br />بجد صعبان عليا اوي اوي<br />بس تعمل ايبه<br />عشان بس الشغل والمرتبات الايام دي قليله<br />فالكل عاوز يرفع مرتبه عشان برضه يعرف<br />يعيش<br />سلام<br />تصبح علي خير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

