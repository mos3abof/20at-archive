[[comments]]
order = 13
subject = "انا راضى"
author = "ياء"
posted = "2005-12-20"
text = "والله انا شايف ان دى حريه شخصيه المرشد بضربش حدعلى ايده عشان يقبل ايده . ولا الى قبل ايده حيخش مكتب الارشاد مثلا .<br />المشكله ان المجله المحترمه ثابت كل حاجه فى الحفله ومعلقتش غير على دى .طب تتقلم لما ماما سوزان( مامه الشعب ) لما بتروح مكان بيحصل ايه اقله الاخوان مكلفوش حد حاجه اما ماما( سوزان ) الزياره الواحده بتعتهابتكلف .<br />عن نفسى لمل اشوف المرشد حقبل اديه الاثنين.<br />وعلى راى المثل انا راضى والمرشد راضى مالك ومالنايا فاضــــــــى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

[[comments]]
order = 14
subject = "يا لائمي"
author = "اولا احب ان اشكرك أخي الكاتب على هذه المقاله الرائعه، وحينما أقول \"رائعه\" فذلك لما أحدثته في من أثر وما أنتابني من شعور بالبهجه وأحساس بالنصر وانا أقرا مقالة الكاتب المبدع ا/عبد الجليل."
posted = "2005-12-20"
text = "اما عن ثانيا: فأحببت أن أسرد في هذا المكان بضع كلمات للـ ا/فهمي هويدى في توصيفه للفارق بين المتطرفين الاسلاميين او\"المغالون\" وأمثالهم من العلمانيين -والتي ازعم انا سلوك أغلبهم لمسلك التطرف العلماني هذا- فالأولين هم من شباب مندفعين سلكوا مسلك خطأ.<br />وأن الآخرين فهم من شيوخ مجربون ومحترفون إتخذوا موضعهم عمداً مع سبق الاصرار والترصد.<br />فشكرا لك مرة ثانية يا من فضحت لنا ذاك الشيخ الذي جعل همه وشغله الشاغل الاطاحة بالنبلاء في هذا الوطن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

