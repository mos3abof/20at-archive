[[comments]]
order = 5
subject = "انا مع البراء والمواطن..معاهم الاتنين...تنفع دي؟؟؟"
author = "محمد السيد"
posted = "2005-12-19"
text = "أنا في جزء مع براء والجزء الثاني مع المواطن المصري الحر ...<br />أولا مع المصري في إيه؟<br />الموضوع أصغر وأهون بكثير من إننا نتكلم عنه بالشكل ده ... لدرجة إنه يكون عنه ثلاثة مقالات بكاملهم غير التعليقات والردود ... عن مجرد إيه؟؟... قبلة !!!<br />ده غير إن الإسلوب ده إسلوب الناس اللي معندهاش حجة أو مش لاقية حاجة تهاجم بيها .... مش عارف أسميها إيه؟؟<br />لكن تعرفوا المثل ؟؟ بتاع ملقوش في الورد عيب قالوا له يا احمر الخدين ....<br />طبعا مع الفارق ....<br />أناعلي فكرة مبحبش حكاية نقبيل اليد دي...<br />أما مع البراء في إيه.......؟<br />وجهة نظره ..... رغم إنه عارف إن وجهة النظر دي مش حتعجب ناس كتير .. إلا إنه عرضها ....<br />علي فكرة ... ده دليل علي الحرية اللي عند الإخوان .... بدليل إن \" البراء \" بيكتب الكلام ده ... ولا خايف ولا مرعوب ...و لا مستني امر من قيادتهم بتعنيفه مثلا ...<br />ده زي ما روز اليوسف وأمثالها بيقولوا ليل نهار .....<br />وبعدين علي رأي واحد ....<br />يا بتوع روزا والأهرام والاخبار والجمهورية .... والذي منه<br />كل يوم بتقبلوا ايادي وأرجل الرئيس مبارك وابنه وزوجته و ....<br />وكلنا عارفين ان ده نفاق ....<br />جايين تتكلموا علي نائب واحد ... من 88 نائب ... ومعملهاش لا نفاق ولا رياء زيكم ...<br />برضه حاقول لكم ..<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143732/http://www.20at.com/article2.php?sid=119"

