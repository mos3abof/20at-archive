text = "سبحان الله اى مصيبه يقولك الاخوان<br />بس على الع[ *** ] المرة دى يا استاذ بدنجان هم بيعملوا حاجت لصالح الناس وانت اللى قلت كده بنفسك يعنى خير مش حاجة وحشة<br />طبعا هتقول على اخوانى بس للاسف احنا مابنبصش غير لرورانا وبس"
archived = "2009-05-27"
