author = "عادل"
posted = "2009-05-26"
text = "جمعيات النشاط المدنى هى التى يجب ان تشتغل<br />بتوع الجمعيات الشرعية بيلموا فلوس بالهبل وبياخدوا الصدقات من المقاولين وبعشرات الالوف وبتوع الزكاة وبعدين بيصرفوها فى اية - بيلاقوا بنت يتيمة بتتجوز يروحوا يشتروا لها تلاجة وبس طيب يا حبيبى يا ابو دقن بقية الفلوس اللى جمعتوها راحت فين ؟<br />بيعملوا شعبية بين البسطاء علشان الانتخابات لما الاخوان يرشحوا انفسهم الناس تنتخبهم -<br />احد اعضاء الجمعيات الشرعية وهو مدرس ابتدائى كان معدم اصبح يركب سيارة مرسيدس بفلوس الجهلاء الذين يدفعون<br />امن الدولة يراقبهم ولكن هم يفعلون اشياءا يمكرون بها علية لانهم متغلغلين وسط الناس<br />على الدولة ان تفك تلك الجمعيات وان تترك للاوقاف فقط اى نشاط دينى<br />انما جمعيات شرعية تنشر التعصب وتدعوا الى لبس البراقع وتشوة الاسلام"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527212438/http://www.20at.com:80/t7kyk/12191-2009-05-26-10-24-07.html"

