author = "سلامات يا بدنجان"
posted = "2009-05-26"
text = "الاخوان المسلمين تخفوا فى الجمعيات الشرعية فى كل مكان<br />والجمعيات الشرعية بتعمل فى كل مكان وبيجمعوا التبرعات والزكاة وعندهم فلوس خرافية وبيعملوا مشروعات<br />وبيستولوا على ارض الدولة ويبنوا عليها مشروعات والحكومة بتشوفهم وتنطش<br />والكل بيسكت ويقول لك دول بيشتغلوا للمصلحة العامة<br />والكل بيهلب ومادام لا يتكلم فى السياسة يبقى خلاص<br />الجمعيات الشرعية هى اوكار الاخوان المسلمين التى يشتغلون فية بمنتهى الحرية"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527212438/http://www.20at.com:80/t7kyk/12191-2009-05-26-10-24-07.html"
