[[comments]]
order = 0
subject = "ماذا تلبسين؟"
author = "نا الحمد لله لابسه ازدال وهو جميل ومريح جدا جدا ادعو لى بالثبات يارب والقبول"
text = "وكان سبب لبسى له هو انى تخيلت انى ساقابل الرسول الان فهل ساجرى عليه ام استخبى منه فوجدت ان لبسى يحتاج لبعض التعديل لانه قال ان المفروض حجابى يكون لا يصف فكان بيصف بصراحة شويه رغم انه كان واسع ولا يشف بصراحة ما كانش بيشف وما يكنش زينة فى نفسه فهو بصراحة كان الزينة كلها.<br />فلقيت ان التزامى ناقص حته كبيره شويه ما ريحتنيش غير بعد ما لبست الازدال<br />فانا الحمد لله كنت بلبس كويس وملتزمة فيه الى حد كبير لكنى كنت حاسه انه برضه لازم يتعدل لانى هااشوف رسول الله دلوقتى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145410/http://www.20at.com/article.php?sid=1072"

[[comments]]
order = 1
subject = "كانت خطوة صعبة جدا"
author = "لسلام عليكم ورحمة الله وبركاته"
text = "تجربتى مع الاسدال جميلة فانا لابسة حاليا الاسدال وعقبال كل البنات يارب<br />لكن انا كان عندى مشكلة كبيرة قوى فى بداية لبسه كنت حاسة انى محرومة من شىء كبير قوى وهو اللبس والموضه والالوان والدلع والحركات<br />فقلت لنفسى مش كفايه لحد كده انتى عايزه ربنا ولا عايزه ناس يعجبوا بيكى وبلبسك انتى عارفه هتقابلى ربنا امتى مش ممكن السنة دى هتقبليه بكل اللبس دى<br />والطبيعى ان الشيطان مش هايسيبك فى حالك فى خطوة حلوه زى دى لحد ما قررت انى هالبسه خلاص<br />ودلوقتى خلاص الحمد لله حاسه انه بقى حاجة اساسية عندى<br />واخيرا قررت انى البسه وفوجئت بتعليقات جميله جدا عليه ماكنتش متخيلاها وكثير قالوا انى فيه اجمل من لبسى العادى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145410/http://www.20at.com/article.php?sid=1072"

[[comments]]
order = 2
subject = "dotifa_2@yahoo.com"
author = "نا والحمد لله إنسانة ملتزمة في ملبسي ولم أكن لألبس الملابس الضيفة أو القصيرة أو ما كان شائع بين الفتيات في الماضي أو حالياإضافة غلى إرتدائي للحجاب منذ أن كنت في السنة الأولى من الثانوية العامة"
text = "ولكن ما دفعني إلى التفكير في إرتداء الإسدال أو الملحفة هو ما رأيته من نظرة ضعاف القلوب ومن لا يرعون حرمتنا كنساء في الشارع أو المواصلات العامة وفكرت في سبب فرض الله سبحانه وتعالى للحجاب على المرأة وبشكل مبسط أشرح لكم ما توصلت إليه، وبسؤال بسيط: إذا كانت لديك جوهرة هل تعرضها على من هب ودب؟ بالطبع لا فأنت ستخفيها وتحفظها في جراب يصونها من الأتربة. وهكذا، فنحن النساء جواهر والحجاب هو الجراب الذي حفظنا الله به من الأتربة أي من كل عين أو يد تمتد إلينا بسوء. وبعد هذا التفكير المبسط وفرحة التوصل لسبب إهتمام رب العزة بنا كجواهر يجب أن تصان، بدأت البحث عن أفضل زي يطلق عليه الزي الإسلامي بحق فوجدت أن الاسدال أو الملحفة تتطابق مع هذا الاسم لأنه يسدل على الثياب الأصلية التي ترتديها الفتاة أو المرأة. ويمكن لها أن ترتدي تحته ما تشاء ولكن لا تسرف في التعري تحته بحيث لا يكون إرتدائه مثل عدمه، مثل التي ترتدي الحجاب وترتدي بلوزة ضيقة تفصل جسدها. وبذلك فهي تراعي الله وترتدي ما تحبه من ألوان وملابس معتدلة أسفل زيها، يمكن لها أن تجلس بها في صحبة زميلاتها أو أقاربها من الفتيات فقط. إن الله لا يحرمنا ولكنه يريد لنا العفاف والعفة فلا يقترب منا كل مار ليرتشف رشفة ويتركناكمن ليس له صاحب. نحن جواهر ولا يقتنينا ولا يدنو منا إلا من يقدر على مهورنا<br />أختكم<br />دعاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145410/http://www.20at.com/article.php?sid=1072"

