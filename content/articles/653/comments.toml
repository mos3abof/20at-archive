[[comments]]
order = 8
subject = "فضايح"
author = "من سجاده الصلاه والفانوس الى الصاروخ"
posted = "2006-10-06"
text = "بعيدا عن العصبيه والتعصب لبلدى<br />الا انى اقول تحيا الصين<br />تحيا حكومه عارفه توجه طاقات وامكانيات ولاد شعبها وتستغلها وتستفيد منها<br />عارفه تستثمرهم فى شىء صحيح بدل ماتوديهم الى صفوف البطاله<br />رغم عدد سكان الصين الكبير الا ان حكومتها لم تعلق فشلها ع هذه الشماعه<br />شماعه زياده عدد السكان<br />وسلملى ع الحكومه المصريه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113710/http://www.20at.com/article2.php?sid=1261"
