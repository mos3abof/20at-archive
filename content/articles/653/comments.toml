text = "بصراحه بحس إنى الفاوانيس دى بتقتل طفولتهم وبتكبرهم مش بتخلينا نشوفشهم فى شكلهم الطبيعى فبتضيع بهجه رمضان أو بتقلل منهاأحب أضيف إن الصين ربنا يخليهلنا قولوا أمين مش حرمانا من حاجه دى حتى عملت لنا مسابح كمان اللهم قوى إيماناوإيمانهم .باى"
