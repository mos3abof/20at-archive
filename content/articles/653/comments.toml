[[comments]]
order = 1
subject = "فانوس نانسي"
author = "DEAD MAN"
posted = "2006-09-23"
text = "انا بطالب حكومة الصين بتقديم شكر رسمي للحكومة المصرية اللي منفضة للبد واللى فيها واللى سمحت للصناعات الصينية بالتوغل في السوق المصري علي حساب صناعات كنا فاكرينها لحد وقت قريب حكر علي المصريين، وسلملي علي حماية الصناعة المصرية والصناعات الصغيرة.<br />ده غير أن الصناعات دي أصبحت تأثر بشكل كبير علي تكوين ثقافة الطفل فاذا كانت هذه الفوانيس قد بدأت بأغاني \"وحوي يا وحي: فانها الان تعتمد بشكل أساسي علي أغاني نانسي وهيفا الى أخر القائمة اللبنانية.. وفى انتظار فانوس \"الواوا أح\" وعقبال فانوس \"SRRY MAM\"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113710/http://www.20at.com/article2.php?sid=1261"

[[comments]]
order = 2
subject = "هييييه الفوانيس جت جت"
author = "معاذ محمود عامر"
posted = "2006-09-23"
text = "زمان كن خالوا أحمد (الله يرحمه) بيلف على كل قرايبه حاملا أجدد أنواع الفوانيس في السوق<br />وكان بابا يبعت يجيب فانوس كبير من مكتبة الفتح الاسلامي ونعلقه على أول الشقة<br />الفانوس ده كان شئ بديع ومؤثر<br />وكنا بنفرح ونغيظ ولاد عمنا ونوريهم ان خالنا جابلنا أحدث أنواع الفوانيس<br />الفانوس فرحة<br />قصدي كان فرحة<br />انما دلوقتي سبنا بيتنا القديم ومبقناش عايشين مع عمنا كل واحد راح في حتة<br />وخالوا أحمد مات<br />وماما ماتت<br />وبابا مبقاش فاضي<br />والسن مبقاش سن فوانيس(17)<br />الله يرحمه عم صلاح عبد الصبورك<br />(يا من يدل خطوتي على طريق الضحكة البريئة....<br />يا من يدل خطوتي على طريق الدمعة البريئة.........<br />لك السلام لك السلام,<br />أعطيك ما أعطتني الدنيا من التجريب والمهارة,<br />لقاء يوم واحد من البكارة)<br />سلاام وكل سنة وانتوا طيبين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113710/http://www.20at.com/article2.php?sid=1261"

[[comments]]
order = 3
subject = "تهنئة"
author = "معاذ"
posted = "2006-09-24"
text = "((((((((كل عااام وكلكم بخير, وصحة, وعافية, وحرية, والتزام, ورغبة في الحياة والتقدم للأمام, كل عام وانتوا بتضحكوا, وبتطربوا, وبتعبدوا ربنا الواحد باخلاص وحب, كل عام وانتوا مطمئنين, وآمنين, وفي راحة نفسية عايشين, كل عام وانتوا.......<br />بني ادمين)))))))))))))))"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113710/http://www.20at.com/article2.php?sid=1261"

[[comments]]
order = 4
subject = "معدناش بنقول حلو يا حلو"
author = "نيفين نيفىنوفا"
posted = "2006-09-24"
text = "ها يا حبييبى تحب فانوس يا طبطب يا دلع و لا اه و نص<br />دى لغه الامهات بعد كده ان شاء الله و هما بيشترو الفوانيس لاو لادهم<br />فعلا الف شكر للصين<br />انا امبارح شفت فانوس عباره عن بطه و شايله فانوس صغير مش باين و بتمشى بالكهربا<br />يا جماعه مش مساله غزو صينى للسوق المصرى بس<br />لا دا عمليه طمس لتراثنا و معتقداتنا و محو متعمد لشكل الفانوس الكلاسيكى اللى هو جزء من ثقافتنا<br />تمام كدا زى تاكسى العاصمه اللى بيضيع الشكل الكلاسيكى للتاكسى الابيض ف الاسود اللى بيميز شوارع القاهره<br />دا غير الاغانى اللى انتو عارفينها من عينه هيفا و نانسى<br />يا خساره"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113710/http://www.20at.com/article2.php?sid=1261"

