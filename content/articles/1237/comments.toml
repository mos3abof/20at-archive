subject = "حد يشرح لي"
author = "Dabdoob"
posted = "2006-02-12"
text = "صحافيات في السعودية !!<br />يعني حاجة كده زي الحيوانات الخرافية بشنب!!<br />ازاي هتعمل موضوعات بس اذا كانت غير مسموح لها بقيادة السيارة او بالسير وحيدة او بالحديث مع الرجال او بالمشاركة في الحياة الاجتماعية او السياسية او.......<br />انا بالمناسبة لا معارض ولا مؤيد لكل الحاجات دي بس ببساطة انا مستغرب !!!!<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134705/http://www.20at.com/article2.php?sid=414"

[[comments]]
