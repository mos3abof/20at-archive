subject = "كفاية تفاهه؟؟؟"
author = "عبدالله"
posted = "2006-02-11"
text = "تفاهة وحقارة بمنى الكلمة<br />يعني وصلت بالمراة السعودية إلا ان تهين<br />زرجها على حساب ان تقود السيارة.<br />أتمنا ان لاتكون مثل بني اسرائيل عندما طلب الله سبحانه منهم ان يذبحوا بقرة...<br />بعدين الصورة هذي مو من السعودية .<br />الدريكسون في الجهة اليمنى من السيارة.<br />اتوقع صورة سائحين .... بس وين الله اعلم.<br />ياناس يا عالم الحضارة غير . وطفرة المال<br />غير.<br />والحضارة لاتشترى بالمال..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134705/http://www.20at.com/article2.php?sid=414"

