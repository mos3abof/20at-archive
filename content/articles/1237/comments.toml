subject = "حاجة غريبة جدا"
author = "أنا مع الأخ اللي قال ان الصورة دي مش من السعودية ثم أنا عايش في السعودية من زمان 1500 ريال ده بالنسبة لسعوديين زي 15 جنيه عندنا و بعدين النسوان اللي هنا اللي بيحاولوا يعملوا الحاجات ده قليلين جدا جدا جدا ميستاهلوش تقرير يتكتب عنهم بصراحة"
posted = "2006-02-12"
text = "من مصري عايش بقاله زمن في السعودية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134705/http://www.20at.com/article2.php?sid=414"

[[comments]]
order = 3
subject = "النساء الشريفات"
author = "ابو ريناس"
posted = "2006-03-09"
text = "بعد التحية 0السلام عليكم<br />اولآ الصور لا تمت الى السعودية بأي صله لا من ناحية المضمون ولا الظاهر<br />فالنساء في السعودية شريفات عفيفات وليسو بحاجة الى قادة السيارة لان من قاد السيارة قبلهم لم يستطع ان يصل الاماوصلته اليهالنساء في السعودية ولننظر الان الى النساء العاملات في مجال الاعلام في السعدية على درايه كامله وعلم رائع ولايتلعثمنا كما هو موجود في الكثير من القنوات الاخرى ومع ذلك لا تجدهم ينظرون اويطالبون بالقيادة للسيارت وبصراحة ( هل تصتطيع اي امرأة في العالم ان تقود اليارة وتسافر بها من شرق السعوديه الى غربه ومن الشمال الى الجنوب ) هذا بلد كبير مترامي الاطراف بهي رجال يحترمون نسئهم ويقدرونهم ويحافظون عليهم من وخزة الشوكة فما بالك بوخزة العين وآسف للاطالة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134705/http://www.20at.com/article2.php?sid=414"

