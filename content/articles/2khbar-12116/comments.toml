[[comments]]
order = 12
subject = ""
author = "الجزاء من جنس العمل"
posted = "2009-05-20"
text = "العمل الاسود<br />1) اعتقال<br />2) تشريد<br />3) سرقة<br />4) نهب<br />5) قتل<br />كم طفل بكى على اباه في عهد مبارك<br />كم طفل شاهد اباه وراء القضبان في عهد مبارك<br />كم امرأة اصبحت ثكلى في عهد مبارك<br />معلش يا زخاري<br />اصلك ما شفتش زوار الفجر بتوع حسني مبارك<br />وما اكلتش الاغذية المسرطنه"
archived = "2009-05-22"
capture_url = "https://web.archive.org/web/20090522025723/http://www.20at.com:80/2khbar/12116-2009-05-19-07-21-43.html"

[[comments]]
order = 13
subject = ""
author = "مصرى"
posted = "2009-05-20"
text = "تريدون ان نشفق عليهم<br />صحيح ان ثقافتنا المصرية القديمة تقدس الموت وتقول لنا وتربينا على انة لا شماتة فى الموت<br />وان الموت ينسينا الاحقاد<br />ولكن<br />ولكن لماذا نحن فقط الملائكة وهم الشياطين<br />الم يفكروا فى الام اولاد ايمن نور حينما كان ابوهم فى السجن زورا وبهتانا<br />الم يفكروا فى بنات واطفال المعتقلين الشاطر وزملائة<br />الم يفكروا فى اطفال غزة وموتهم تحت الحصار<br />ربما الذى حدث هو دعوات امهات مكلومات دعون ربهم العزيز المقتدر فاستجاب لهم لينتقم منهم<br />ان دعوات الامهات مستجابة<br />رب لا تذر على الارض من الكافرين ديارا *** انك ان تذرهم يضلوا عبادك ولا يلدوا الا فاجرا كفارا"
archived = "2009-05-22"
capture_url = "https://web.archive.org/web/20090522025723/http://www.20at.com:80/2khbar/12116-2009-05-19-07-21-43.html"

[[comments]]
order = 14
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-05-20"
text = "ياعالم<br />حرام عليكم<br />حتى فى الموت مازلتم تحقدوا على الرئيس فى مصابة الاليم؟<br />اتقوا اللة<br />و(من يتقى اللة يجعل اللة لة فى الدنيا مخرجا)<br />أتفوا عليكم عالم قلوبكم و ضمائركم ميتة و منعدمة الاحساس"
archived = "2009-05-22"
capture_url = "https://web.archive.org/web/20090522025723/http://www.20at.com:80/2khbar/12116-2009-05-19-07-21-43.html"

[[comments]]
order = 15
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-05-20"
text = "الى المعلق(الجزاء من جنس العمل)<br />لا شماتة فى الموت<br />و كل نفس زائقة الموت<br />و اتقى اللة و كن نعم الانسان الذى يؤمنو ليس الحيوان الذى يفرح لمصائب الكبار<br />الموت سوف يكون لك يوما ما<br />استيقظ من الشيطان الذى بداخل قلبك الحاقد<br />لا شماتة فى الموت<br />سامحكم اللة"
archived = "2009-05-22"
capture_url = "https://web.archive.org/web/20090522025723/http://www.20at.com:80/2khbar/12116-2009-05-19-07-21-43.html"

[[comments]]
order = 16
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-05-20"
text = "قلوبنا انشطرت معك يا مبارك<br />للفقيد الرحمة و للجميع الصبر و السلوان<br />تقبلة اللة ملاكا فى جنات النعيم<br />اللة معك يا مبارك و الهمكم الصبر و السلوان و لا راد لقضاء اللة<br />اقباط مصر مسلمين و مسحيين معك و تصلى لاجل الحفيد العزيز<br />تقبلة اللة مقاما محمودا<br />عزاؤ السماء يقوى ايمانك يا مبارك"
archived = "2009-05-22"
capture_url = "https://web.archive.org/web/20090522025723/http://www.20at.com:80/2khbar/12116-2009-05-19-07-21-43.html"

[[comments]]
order = 17
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-05-20"
text = "الى جميع افراد أسرة/الرئيس مبارك<br />(دائما المؤمن منصاب)<br />هذة تجربة من اتللة و لا راد لقضاء اللة<br />كل نفس زائقة الموت<br />جميع شعب مصر يشاطرونك الاحزان سيدى الرئيس رغم اختلاف الاراء احيانا!<br />للفقيد الملاك الرحمة و لكم و لجميعنا الصبر و السلوان<br />قواكم اللة و الهمكم الصبر و التماسك و قبول ارادتة<br />اللة معك و هو نعم المعين<br />مباركو سوزان و علاء و جمال و جميع افراد الاسرة المنكوبة فى عزيزها<br />جميع شعب مصر معكم<br />رحم اللة الفيد و ادخلة جنات النعيم<br />و لكم الصبر و السلوان<br />اللة معك يا مبارك"
archived = "2009-05-22"
capture_url = "https://web.archive.org/web/20090522025723/http://www.20at.com:80/2khbar/12116-2009-05-19-07-21-43.html"

