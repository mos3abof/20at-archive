[[comments]]
order = 10
subject = ""
author = "مش زخارى"
posted = "2009-05-20"
text = "لية يا زخارى النعش ملفوف بعلم مصر<br />هل هو شهيد مات فى ميدان القتيل ؟<br />ماذا فعل هذا الصبى ليلف فى علم مصر وماذا قدم لمصر من خدمات ؟<br />اليس مواطنا مصريا كباقى الاطفال فى مصر<br />هل كل طفل يموت فى مصر يا زخارى يلف فى علم مصر ويحملة العسكر المزركشين<br />هل كان رتبة عسكرية سابقة وحامل نياشين<br />يا زخارى هناك بروتوكولات رسمية فى الدول لمثل تلك الحالات"
archived = "2009-05-22"
capture_url = "https://web.archive.org/web/20090522025723/http://www.20at.com:80/2khbar/12116-2009-05-19-07-21-43.html"

