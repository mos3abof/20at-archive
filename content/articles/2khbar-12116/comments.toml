[[comments]]
order = 7
subject = ""
author = "امة الله المصرية"
posted = "2009-05-20"
text = "كم طفلا كان في نفس العمر و غرق في العبارة بعد ان ظل 48 ساعة يقاوم و لم يجد قوات انقاذ مصرية؟<br />كم طفلا في نفس العمر من اولاد الشوارع في مصر و لا يجد يدا تمتد له؟<br />كم طفلا يتم قتله و سرقة اعضائه الان بعد قانون التبرع المشبوه؟<br />كم طفلا في نفس العمر يموتون يوميا في انحاء مصر داخل مستشفيات الحكومة المفتقرة للدواء و الطبيب و الضمير و الرعاية و الامانة ؟<br />تري هل الام الذي تمر به الان هو ابتلاء من الله فاصبر ان الله مع الصابرين ؟<br />ام ان ما تمر به الان هو دعوة احد المظلومين عليك؟تري من هو ؟هل اللذي فقد ابنائه كلهم في العبارة؟<br />الله اعلم<br />اللهم اخرجنا من الدنيا علي خير و علي ما ترضي و ما تحب و لا تجعلنا من الظالمين"
archived = "2009-05-22"
capture_url = "https://web.archive.org/web/20090522025723/http://www.20at.com:80/2khbar/12116-2009-05-19-07-21-43.html"

