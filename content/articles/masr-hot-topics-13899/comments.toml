text = "ممكن نفكر شويه ونقول<br />1-أحمد غانم سلطان —— لانه مابيعرفش يلعب<br />2-أبو تريكة —— لانه بيمثل ع الحكام ومش ناقصه تمثيل<br />3-بركات —— لانه واد بسكوته والشعب هيضربه<br />4-عمرو زكى —— لانه هيفترى ع الشعب ضرب<br />5-متعب —— لانه نحس وهينحسنا معاه<br />والباقى من 6 الى 10 بجداره لكل من تسول له نفسه انه يحكم مصر<br />أرشح شيكابالا ليصبح أول رئيس أسود للبلاد"
