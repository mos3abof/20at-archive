posted = "2009-12-05"
text = "شخص من الشخصيات دول حتي لو مكنش الرئيس محمد حسني مبارك بس لو هيعيشنا في سلام وامان زي ما رئيسنا محمد حسني مبارك عيشنا في سلام لو هينفع يكون في رئيس زي الرئيس ده انا موافق انو يمسك الرئاسة حتي ولو كانت ست انما لو مش هيكون في رئيس بنفس مواصفات الرئيس محمد حسني مبارك كا شخصية معيشانا في سلام وامان طوال فترة حكمة يبقي بلاش من وجود رئيس تاني غير الرئيس محمد حسني مبارك اطال الله عمرة وجعله دائما في صحة وعافية دائما للشعب المصري مش بقول الكلام ده علشان خاطر الرئيس ماسك الحكم دلوقتي لاء بقول الكلام ده علشان فعلا مفيش رئيس زي الرئيس محمد حسني مبارك وسياسة الرئيس حسني مبارك واي شخص هيقول ان الرئيس محمد حسني مبارك معيشنا في فقر وغلاء فا احنا اللي عملنا كده في نفسنا مش الرئيس الرئيس مش منزل تسعيرات علي المأكولات البائعين هما اللي مغليين اسعارهم دي حاجة والشباب اللي تقولك احنا في بطالة ومفيش شغل والكلام ده كله غلط البلد مليانة شغل مصانع كتير في شبرا الخيمة عندنا طالبين عمال انا قلت كلام قليل علشان خاطر مساحة الكلام خلصت تحياتي لكم ولكل شخص قام بالتصويت اخوكم احمد المصري"
archived = "2009-12-06"
capture_url = "https://web.archive.org/web/20091206053911/http://www.20at.com:80/masr/hot-topics/13899-10-.html?"

