text = "طيب ايه رأيكم ارشح نفسى للرئاسه !!<br />اول حاجه حعملها حولع فى الجزائر وفى العرب وفى اسرائيل<br />وبعد كدا اولع فى الحكومه<br />وطبعا واحد لذيذ حيقولى طيب ولع فى نفسك<br />جقولو لا علشان انا رئيس الجموريه ولازم تحترم رئيسك<br />وبعد كدا حطالب بالديون اللى على انجلترا لينا<br />طبعا محدش يعرف الحوار دا<br />اه احنا مداينين انجلترا<br />لان فى الحرب العالمبه التانيه انجلترا اخدت قروض من مصر<br />وطبعا بعد الحسبه<br />اصبح على انجترا ديون لمصر بحوالى 28 مليار جنيه استرلينى<br />يعنى تخلى شعب مصر بالكامل يعيش احسن من بتوع سويسرا"
