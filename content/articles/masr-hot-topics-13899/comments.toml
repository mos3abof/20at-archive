[[comments]]
order = 66
subject = ""
author = "واحد مصرى من شبرا"
posted = "2009-12-08"
text = "(ياريت تقرا للاخر وانت تعرف)<br />كام واحد من اللى كتبوا مبارك وجمال لا عندهم بطاقه انتخاب<br />والله عيب اللى بيحصل احنا مش هنقدر قيمه الريس غير لما يمشى هو مش حرامى زى ما بيتقال هو اللى بنى البلد بجد كفايه انك لاقى تاكل وتشرب وتدخن امن الدوله مش غلط انت لو ماشى فى حالك مش هايجى جنبك كفايه ان بلدك مش فيها اى قاعده عسكريه لاى بلد تانى كفايه اسمك فى العالم العربى والعالم كله الراجل ده سياسى لاخر حاجه ومفيش اى حد تانى زيه انا عارف ان ناس مش هتوافق على اللى بقوله لكن دى الحقيقه هو مش مسئول عن الموظف المرتشى ولا المدرس المهمل ولا الوزير الحرامى فى حاجه اسمها تدرج وظيفى هو اعلى حاجه فيه فى ناس كتير اوى قبله هم فين؟<br />مش كل حاجه يبقى الريس ولو ضرورى حد تانى بعده يبقى جمال مبارك هو الاصلح من خبرة ابوه وكفايه انو معروف باسمه مش زى واحد عايش بره وجاى يقول يالا ننزل الانتخابات 75×100(البرادعي) مش يعرفوه ولا واحد منتمى لامريكا منورفى كل حته بالسجن اللى كان فيه(ايمن نور)ولا عمرو موسى لانه عصبى بالدرجه الاولى اما اللى بعد جمال ممكن ينفع الوزير عمر سليمان لان شغل المخابرات شغله يعنى التزام وكل حاجه حلوه"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106120403/http://www.20at.com:80/masr/hot-topics/13899-10-.html?"

