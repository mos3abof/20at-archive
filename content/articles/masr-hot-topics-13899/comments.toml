author = "الرأى الأخيرللمثقفين"
posted = "2009-12-07"
text = "أنا فى اعتقادى أن الشعب المصرى لا يستطيع أن يختار حتى رئيسا لشركة أو لنادى لأنه ببساطة شعب جاهل<br />فليكن كلامنا فى الرياضة لأنها ستكون الرأى الأوضح لتوصيل كلامى :<br />بالنسبة لمشكلة نادى الزمالك و خسائره المتكررة<br />هناك من يقول أن العيب فى المدرب و الكل هلل بقدوم حسام حسن و فى أولى المباريات خسر نادى الزمالك<br />و هناك من يقول أن العيب فى اللاعبين<br />و هناك من يقول أن العيب فى رئيس النادى<br />و هناك من يقول أن العيب فى مجلس الادارة<br />و هناك من يقول بعد لاعبين و مشجعين نادى الزمالك عن دينهم الاسلامى<br />لدرجة أنه يمكن لجماعة الاخوان المسلمين و مرشدهم مهدى عاكف أن يدخلوا الانتخابات القادمة تحت شعار الاسلام هو الحل مبررين ذلك أن كل الطرق فشلت و ما بقى الا الحكم بما أنزل الله لنجد أن اللاعبين و المشجعين كلهم بذقون و المشجعات يرتدين النقاب ليتحول الزى الرسمى للنادى الى الزى الأسود و أطباء الفريق هم من مشايخ الرقية الشرعية و العلاج بالأعشاب و بدلا من تدريب الفريق المعتاد نجدهم يلتزمون بالعبادات و السنن تحت شعار الاعجاز العلمى فى القرآن<br />ترى هل كل ذلك يؤدى الى وصول الزمالك الى العالمية"
archived = "2009-12-08"
capture_url = "https://web.archive.org/web/20091208030018/http://www.20at.com:80/masr/hot-topics/13899-10-.html"

