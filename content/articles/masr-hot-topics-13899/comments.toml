text = "1- محمد حسنى مبارك و مراته<br />2- جمال مبارك و امه<br />3- علاء مبارك و امه<br />4- وزير الدفاع طنطاوى<br />5- ايمن نور<br />6- اى حد اخوان<br />7- اى حد مع القومية العربية زى عمرو موسى<br />8- اى حد كان فى منصب دولى او مترشح ليه زى فاروق حسنى والبرادعى (طالما متوافق عليهم بره يبقوا كلهم سيس)<br />9- كل اعضاء الحزب الوطنى<br />10- الصحفيين كلهم وبذات فنجرية البؤ امثال هيكل ومصطفى بكرى<br />الاسماء المتاحة فى رأيى:<br />عمر سليمان رئيس جهاز المخابرات او اى حد اشتغل فى الجهاز ده لانهم ناس محترمة وبتشوف شغلها على اكمل وجه<br />فاروق الباز العالم المصرى المعروف - زويل لأ طبعا لأنه خد نوبل<br />لو اضطررنا لأختيار شخصية دينية يبقى الشيخ خالد الجندى<br />بس خلاص"
