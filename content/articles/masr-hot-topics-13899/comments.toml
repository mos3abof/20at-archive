text = "إحنا مش هنتكلم عن : من هم الذين (لا) يصلحون بأي حال من الأحوال لرئاسة مصر<br />إوده طبعا علشان هما كتييييييييييييي ييييييييييييييي ر جدا ولا يمكن حصرهم<br />ولكن دعونا نتحدث عن الأصلح , وأنا أُرشح :<br />د/ أحمد زويل<br />د/ فاروق الباز<br />د/عمرو موسى<br />السيد / عبد السلام المحجوب<br />فضيلة الشيخ / نصر فريد واصل<br />وممكن السيد / عمر سليمان<br />هؤلاء نستطيع الإختيار منهم لمنصب رئيس الجمهورية ومنصب نائب رئيس الجمهورية"
