text = "لا أحد في مصر يصلح للرئاسة<br />لأنني لا أراهن علي أن بيننا في مصر نبي أو رسول<br />وبالتالي فإن هذا النظام الشمولي القائم دستوريا حتي في غياب الأشخاص الحاكمين حالياً سوف يجعل دائما من هم علي يسار النظام الحالي علي يسار أي نظام قائم أيا كان شخوصه ورواده<br />وبالتالي فإن الأولي من الرهان علي من يصلح ومن لا يصلح أن نراهن علي أنفسنا في غضبة قوية لصالح تعديل المسار القانوني للنظام _ الدولة _ حتي تكون تجريدية القواعد وحيدتها هي الحاكم الوحيد للمؤسسة الحاكمة ولأي شخص يجلس علي قمتها وجينئذ فقط سوف يصلح الثمانون مليون مصري بكل إختلافاتهم وتمايزاتهم الإجتماعية والثقافية والإقتصادية لأن يكون أي منهم وفي أي وقت رئيس مصر الفادم وبعد القادم وبعد بعد بعد بعد بعد<br />عمرٍ طويل"
