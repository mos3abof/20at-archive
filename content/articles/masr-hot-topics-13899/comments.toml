[[comments]]
order = 83
subject = ""
author = "_________________"
posted = "2009-12-10"
text = "اقتباس كره مصر/الغزاي:<br />لو صارت حرب بين مصر واسرائيل<br />انا مع اسرائيل<br />ده انت بتقول بلسانك انا مع اسرائيل<br />عاوز ايه من مصر و المصريين؟<br />نحارب اسرائيل ولا اللي زيك من الفلسطينيين؟<br />لما تبقي انت واللي زيك تعرف تفرق بين مين عدوك و مين حبيبك ساعتها مصر و المصريين كلهم هيساعدوكم أكتر و أكتر و بألف طريقه .<br />لكن انتم مش عارفين غير الكره والحقد وياريت للي يستاهل الكره ده.<br />و هقولك كلمه أخيره<br />(روح نام في حضن حبايبك اللي انت منهم) علشان انت يهودي"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106120403/http://www.20at.com:80/masr/hot-topics/13899-10-.html?"

[[comments]]
order = 84
subject = ""
author = "مصرى"
posted = "2009-12-10"
text = "عشان تعرف كره مصر/الغزاى<br />لو قامت حرب بين مصر واسرائيل هيكون العرب فى قمة التقدم عشان كده بقول بلاش حقد وكره اليهود اللى فين.<br />والله يسمحك على العموم وشكرن على الاهانه دى"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106120403/http://www.20at.com:80/masr/hot-topics/13899-10-.html?"

