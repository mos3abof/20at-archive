text = "نجيب واحد صينى بمواصفات معينه<br />1-جسم مضاد للبلهارسيا<br />2-جسم مضاد لانفلوانزا الطيور<br />3-جسم مضاد الانفلونزا الخنازير<br />4-يتحمل ضغوط الشعب المصرى من فلاحين و صعايده<br />5-مش بيصيف فى الساحل الشمالى<br />6-يكون مش بياكل علشان نلاقى الكفيار متوفر بسعر عادى<br />7-يكون مش بيخلف علشان تنتهى ازمة التوريث<br />8-لا ينتمى لاى حزب علشان ميتكلمش فى السياسه ويسبها للى بيقولوا فهمنها<br />9-مش بيتاثر بالرصاص علشان يمشى بدون حمايه<br />10-اذا الصين صنعت واحد زى ده ابعتوا لباقى الدول العربيه"
