[[comments]]
order = 0
subject = ""
author = "كلام هيكل"
posted = "2009-11-02"
text = "كلام هيكل ان الاستاذ جمال لا يصلح رئيسا لجمهورية مصر لان هناك اشياء حاكمة<br />اولها ان يكون من ابوين وجدين مصريين<br />وهذا يطبق بصرامة على الطلبة الداخلين للكليات العسكرية<br />وطبعا احد اجداد الاستاذ جمال لامة ليس مصريا وهذا ليس عيبا ولكنها القوانين<br />و مع احترامنا الشديد لة فهو ليس هيبة وستصارع الجميع على كرسى الحكم فى حال تولية<br />اما حكاية ان الامن وامن الدولة سيحمية ويمكنة فهذا ليس تاما فهؤلاء مصريين تعبانين زينا ويعانون مثلنا تماما وتهمهم مصر قبل ان تهمنا ووطنيتهم عالية"
archived = "2009-11-06"
capture_url = "https://web.archive.org/web/20091106123755/http://www.20at.com:80/masr/hot-topics/13899-10-.html"

[[comments]]
order = 1
subject = ""
author = "لماذا يكرهوننا ؟"
posted = "2009-11-02"
text = "هل سال حستى مبارك او ابنة لماذا يكرههم الشعب المصرى ؟<br />نعم لماذا ؟<br />لماذا يتحركوا فى شوارع القاهرة بالسيارات المصحفة والقوات الكثيفة التى تغلق الشوارع وكان القاهرة تورا بورا ؟<br />لماذا لم يلقى مبارك طوال حياتة خطابا فى ساحة مفتوحة كالاستاد مثلا او اى ميدان وانما يلقية فى صالة مؤمنة ويفتش من يدخلها عشرين مرة ؟<br />احنا عايزين رئيس يركب دراجة زى السويد او عربية يسوقها بنفسة من غير حراسة زى الشيخ زايد رحمة اللة لما كان بيمشى فى ابوظبى بسيارتة من غير حراسات ويسوق سيارتة بنفسة والناس بتحمية بقلوبها<br />لماذا نكرههم ؟<br />لانهم بيكروهنا"
archived = "2009-11-06"
capture_url = "https://web.archive.org/web/20091106123755/http://www.20at.com:80/masr/hot-topics/13899-10-.html"

