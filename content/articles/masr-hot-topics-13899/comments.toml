text = "حكاية الرئاسه دى حكايه صعبة جدا على فكره<br />وممكن نختار رئيس كويس وبعد الرئاسه بيبقى مش كويس<br />لان موضوع الحكم دا مش سهل<br />انا بفضل اى حد يكون عارف كل امور البلد من صغيرها لكبيرها<br />مش مهم جمال علاء او اى حد<br />اهم حاجه يكون عارف البلد ولاممها كلها وعارف انه هيمسك بلد حكمها مش سهل وعاوز مجهوووود جبااااااااااااا ااااااااااااااا ااااااااااااااا ااااااااااااااا ر<br />بس انا بصراحه اتمنى \" محمد حسنى مبارك \"<br />طبعا فيه جدل جااامد اوى بس صدقونى مش هتعرف قيمته الا لما يمسك واحد تانى مكانه<br />هنقول يوم من ايام مبارك"
