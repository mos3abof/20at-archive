text = "أنا مش هقول مين اللي لا يصلح لأنهم كتييييير جدا و عددهم 80 مليون مش 10 بس لكن هقول مين اللي يصلح واللي أنا أتمناه<br />1: المشير طنطاوي.<br />2:عمر سليمان.<br />3:مراد موافي.(مديرادارة المخابرات الحربيه)<br />4:احمد زويل.<br />5:علاء مبارك.<br />6:محمدحسني مبارك (مع التحفظ علي السن ولكنه قاد البلاد لمده كبيره وهو الأدري بظروفها و مشكلاتها).<br />7:زكريا عزمي.<br />8:عمرو موسي.<br />9:سيد مشعل. (وزير الأنتاج الحربي)<br />10:جمال مبارك."
