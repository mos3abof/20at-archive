author = "مصرى"
posted = "2009-12-09"
text = "اول حاجة محدش يدافع عن حد<br />انا عايز رئيس يبنى اقتصاد للدولة<br />ويكون عارف ان هو هيتعب وان هو مش جى عشان حد يمجد فى ويكون عارف ان لو هو معملش حاجة تخدم البلد ربنا مش هيسمحوا<br />ويكون عايز يعمل دولة عظمة واى حد شايف كلامى غلط يريت يعلق<br />وان شاء الله لزم الرئيس الجى يفكر اول حاجة انو يبنى جيل يحكم البلد فى المستقبل"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106120403/http://www.20at.com:80/masr/hot-topics/13899-10-.html?"

