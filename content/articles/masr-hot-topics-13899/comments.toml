author = "واحد رايح في داهية"
posted = "2009-12-07"
text = "اي واحد أصلع أو تخين أو بشنب أو بيلبس نظارة<br />أي واحد شخصينه ضعيفة أمام أقرباءه … خاصة زوجته<br />اي واحد بيقول كلام لا يفهمه المواطن البسيط … مثل التعددية الفكرية - الشفافية - المواطنة - الحرية - الديموقراطية<br />أي واحد يعتمد علي المرأة او الاقليات أو يجيب في سيريتها … لا بخير ولا بش<br />ر<br />أي واحد يحب الأجانب … أمريكان أو أوروبيين أو ايرانين أو روس<br />أي واحد يخدع الشعب بكلام غير حقيقي عن التنمية … خليك صادق … الشعب متعود علي البلاوي<br />اي واحد يوقف المرور علشان يعدي بالموكب بتاعه … هو مش هبقي عنده طيارة<br />أي واحد يعطي علاوات أو مكافأت … الشعب المصري كسول و مش بتاع شغل … و بياخد الفلوس و يروح يتجوز ويجبلنا عيال<br />والتجار بيغلوا في الأسعار<br />أي واحد يعطي أي حاجة للمرأة زيادة … انا نفسي أعرف هبطلوا جشع وحقد امتي"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106120403/http://www.20at.com:80/masr/hot-topics/13899-10-.html?"

