text = "الحكايه كبرت وبنشغل بالنا بيها مع اني كلامنا مش هيقدم ولا ياخر كلنا عارفين مين هيمسك الحكم لا برادعي ولا نظيف ولا الشريف ولا زويل ولا اي حد تاني الكل عارف ان الحكم مش هيطلع من الحزب الوطني وده حقيقه مش خيال بس المهم اني الرئيس يكون فاهم المشاكل الفقير قبل الغني لان الفقير بيضيع في الرجلين وما حدش حاسس فوقوا بقى الكلام مش هيجيب نتيجه الاكل غالي ومحدش اتكلم نزلوا ضرايب عالبيوت وسكتنا جيين تتكلموا عالحكم الحاجه الوحيده اللي ملنا يد فيها نتكلم فيها ونشغل بالنا بيها دي الحكومه تعمل اللي هي عايزاه دول لغوا ان القضاء يشرف عالانتخابات الرئاسيه يبقى عايزين ايه تاني يعني الحزب الوطني ناجح ناجح وفوقوا من الوهم اللي معيشين نفسكو فيه"
