text = "لا يصلح : صفوت الشريف , وكل الوزراء السابقين والحاليـن , كل رجال السياسه المصريـن علي شان بتوع كلام بس , مرتضي منصور طبعا مينفعش,<br />يصلح: من لا يبحث عنها .. من يهتم لشئون الناس … من لا يفكر فالحرب .. من لا يتلاعب بعقول الشباب … من لا يحاول الوقيعه بين الشعوب العربيه كما فعل الإخوان فالسودان ( الجزائر ومصر فمواجهة اليهود ) … من لا يدعي التدين … من فقد إبنه وقال الحمد لله إنا لله وإنا اليه راجعون … من لا يحاول الإستفاده من منصبه .. من لا يحاول كسب تعاطف الناس … من يتحدث بلسان الناس … من يُشهد له بالرجوله …"
