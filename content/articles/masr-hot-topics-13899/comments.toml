text = "الذين لا يصلحون للرئاسة هم:<br />1) شريف الدواخلي<br />2) البراء اشرف<br />3) احمد الهواري<br />4) عبدالله الطحاوي<br />5) احمد القطب<br />6) فاروق عجم<br />7) رضوى حسن<br />مروى صلاح<br />9) مروى عبدالفضيل<br />10) دعاء الشامي<br />11) دعاء حسن<br />12) محمد جمال الدين<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />نصيحة اخوية اوعا حد فيكم يرشح نفسه للرئاسة او يفكر انه يبقى رئيس"
archived = "2010-01-06"
