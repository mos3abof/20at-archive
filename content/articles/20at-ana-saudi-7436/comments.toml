posted = "2007-10-26"
text = "لو كلام المجلة دة صحيح والثروات دى مفيش غيرها عند الناس دى يبقى الحكام دول شحاتين ومساكين بالنسبة للى عندنا دول ممكن يستثمروهم فى كام مشروع مع شوية الناس اللى هنا قعدة بتنهب اكبراقتصاد عربى من غير محد يعرف لانهم مبيصدروش بترول والعالم والبنوك تعرف كام وكام دول بيصدروا دولار ويورو والذى منة لسويسرا ولكسمبورغ وهونج كونج لزوم تامين الاحلام المريضة الناس دى لازم ترجع الفلوس اللى سرقتها بدون وجة حق ودى كفيلة انها تنقل المواطن المصرى لمصاف العالم الاول بعيد عن الحاجة للعرب اوغيرهم ولاعاوزين زكاة منهم ولامعونة من اى حد يقيد حريتك ويذلك عليها"
