posted = "2007-10-26"
text = "بسم الله ما شاء الله ربنا يزيدكم يااااا رب و يوسع عليكم قادر يا كريم<br />انا مش قصدي حاجة لا سمح الله من السؤال انا منقدرش برضك علي زعل أسيادنا بس لو الحلوف الكبير عبد الله طلع زكاة ماله يا خويا تيجيلها بكام دي؟ يعني كده يجي 475 مليون كل سنة كده برضه زكا عن صحته ربنا يزيده<br />و إذا كانت دي الثروة اللي بيقولوا عليها فما بالك بما خفي؟؟؟؟ وما خفي كان أعظم<br />ولا ايه؟؟؟؟؟؟؟<br />ولا الحلوف الأكبر بتاع نهيان لو طلعها سنة واحدة بس لدارفور مثلا مش حتخلص كل مشاكل دارفور و كمان يأكلوهم حلاوة بالقشطة؟؟؟؟؟ و يدخلولهم تكييف و يوصلولهم مية حلوة كمان<br />بس نقول ايه بقي … حسبنا الله و نعم الوكيل"
archived = "2010-02-14"
capture_url = "https://web.archive.org/web/20100214022759/http://www.20at.com:80/20at/ana-saudi/7436.html"
