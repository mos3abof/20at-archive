subject = "أهم الشخصيات في رأيي"
author = "سنووايت"
posted = "2006-05-02"
text = "اعتقد ان \" نزار قباني واحد من أهم الشخصيات لأنه كان يجيد النقد الاذع للذات<br />امل دنقل كمان كان مثقف ومبدع جميل رغم اختلافي معاه هوه وكل المثقفين في الفترة دي اللي رفضوا معاهدة السلام<br />جورج اوريل كمان من اهم الشخصيات لانه عمل ميثاق عهر سياسي اسمه \" رواية مزرعه الحيوان\" اهدى للاجيال كلها حل اللغز- هذا ما نفعله عندما نقوم بثورة - بمرور الوقت بناخد ادوار الطغاه<br />مش هعرف اكتب عن سياسيين من اي جنسية واقول انهم شخصيات مهمه<br />لان السياسة تتنافي مع المبادئ خلينا في الفلاسفة وأصحاب الاحلام مع تحيتي الشديدة لجمال عبد الناصر ذلك الحالم الذي عاش فنانا ومات مسموما"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144727/http://www.20at.com/article2.php?sid=757"
