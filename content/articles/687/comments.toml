subject = "شوف يا أخي الكدب"
author = "شيرين مجدي"
posted = "2006-02-22"
text = "أولا يا عم براء بطل كدب شوية أبوس إيدك.. انقلاب على مين يا عم انت.. لو عاوز تنقلب انقلب على استبدادك بمنى ودعاء الغلابة في صفحة مصر. قول يا عم اغراضك الخفية.. وان كل اللي انت طمعان فيه العزومة اللي أحمد زين عزمهالنا في فدركرز...<br />أما انت بقى يا محمد يا معتصم والله يا ابني صعبان عليا ازاي تسيب نفسك لبراء يستخدمك ويستخدم المسندات الخطيرة اللي معاك عشان ينفذ انقلابه.. بكرة يبقى مصيرك مصير محمد نجيب...<br />ومصاعيبو طبعا كنت دايما بقول قناع الطيبة ده وراه حاجة.. على العموم أحسن لك ترتجع، يا إما موضوع البط الفيومي هيوصل لكل وسائل الإعلام وانت فاهم وانا فاهمة<br />ياله كفاية عليكو كده دلوقتي عشان عاوزة أروح.. سلااااام.. ولا حتى حرب لو عاوزين...<br />التوقيع<br />قائمقام شيرين مجدي.. من المحاربين القدامى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114057/http://www.20at.com/article2.php?sid=485"

