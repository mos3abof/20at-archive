text = "بجد أنا مبسوطة بيكم..اخيراااا نطقتم..بس مش ملاحظين حاجة :<br />شكاوي من الزوار: الشكاوي موجودة من زمان..و يمكن الزوار بطلوا يشتمونا بالأب و الأم مؤخرا..!<br />أعطال تقنية: تقنية..تقنية..بتاع التقنية يرفع ايده..ايوا مصعب رفع ايده ببراءته المعهوده..!!<br />خناقات : احنا الخمسة سمن على هاني الحمد لله..وبما انه تسييح بتسييح..يا ريت براء ومحمدالمعتصم يرحوا عن اودة الناظر علشان عندهم استدعاء ولي أمر..قلنا ميت مرة محدش ياكل ساندوتشات زميله يا براء..بس الكي بورد كمان!! كدة كتيير مراسلين في دول عربية لم نكن نعرف عنها أي شيء: المغرب وفلسطين والاردن و السعودية..دول غريبة فعلا...بجد انتوا عسل!<br />جو مخنووووووووق جدا يسطير على المكان : يمكن تكون الحاجة الوحيدة اللي يعني ممكن يكون فيها كلام..خصوصا من ساعة ما شفنا جمال خطوتكم..وطولتم القعدة معانا...!<br />يلا فين عشرينات بالمقلوب..هموت و اشوفه..ايه الانقلاب السلو موشن دا!!"
