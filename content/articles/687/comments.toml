[[comments]]
order = 9
subject = "اتلم تنتون على تنتن"
author = "دودو"
posted = "2006-02-23"
text = "الاخوة عمال المواسير برافو على الفكرة الجامدة دي اولا باحييكم على التكتم الشديد الذي سارت به الامور لدرجة ان ولا واحد فينا حس بيكم<br />ثانيا الاخ محمد المعتصم بما انكم قمتم بالمهمة بنجاح وبسرعة فائقة اذن وحتما ولابد تخلص ديزين صفحة مصر خلال يومين والا سيقام عليك الحد<br />الاخ براء انت مش شايف ان الهجوم ضاري وفي غير موضع يعني ولا شيرين ولا ياسمين شالوا ايديهم من الموقع ولا حتى من حياة اي واحد فينا ...وبلاش انت بالذات دي شرين هاتفضل افضاالها عليك لاخر العمر<br />اما بالنسبة للاستاذ علي فطبعا كلنا معاكوا انه اتغير شوية بس هو في الفترة الاخيرة رجع بقوة وبلاش افترا ع الناس<br />اما مصاعيبوا فانا باقدر خروجك عن صمتك واخيرا فهمت معنى النيك نيم بتاع امبارح (انا شرير بطبع صاحبي) وعرفت انك مضطر للعملة دي<br />عموما ياجماعة انا معاكوا اننا محتاجين نتطور ونغير شوية ونرجع نتواصل مع بعض تاني لاني اول ما جيت عشرينات كان بيعجبني جدا تعاملكم مع بعض وجو الاخوة والبيت في المكان الضغير والز حمة اللي احنا فيه، وانا نفسي نرجع تاني كلنا كده لكن طبعا ولا شيرين ولا ياسمين ولا استاذ علي السبب الناس كلها سبب لازم نتفق كلنا<br />اما بالنسبة لموضوع عيد ميلادي فده فعلا كان يوم رائع بكل المقاييس وانتوا رجعتوني احتفل واحس ان فيه ناس كثير بيحبوني، وبالنسبة لاستبداد براء فينا انا ومنمون فده اكيد هايكون له حد قريب ودعواتكم<br />بس بجد فكرة لطيفة مع تحفظي على المضمون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114057/http://www.20at.com/article2.php?sid=485"

[[comments]]
order = 10
subject = "nice nice"
author = "ما هي مؤهلات الرئيس الحالي ؟؟؟"
posted = "2006-02-23"
text = "سؤال .. ما هي (مؤهلات) الرئيس الحالي وشرعيته القانونية التي جعلته رئيسا لأكبر دولة عربية، من المفترض فيها إنها إسلامية بحكم تاريخ (الأزهر) عبر قرون ؟؟.<br />1 - هل هي مؤهلات عسكرية ؟؟، الإجابة بالقطع هي لا (!!).<br />فقد ظهرت حقائق حرب أكتوبر والتي اختزلتها القيادة السياسية في معاركها الأولي (6 - 10 أكتوبر)، وظهر أيضا حقيقة محدودية دور القوات الجوية (مذكرات هويدي والشاذلي)، وحقيقة الثغرة والمقصرين بها. والخلاصة وبدون إعادة وتطويل أو زيادة وتفصيل نجد ثمارها وسوء أثارها في الموقف الحالي السياسي والعسكري للبلاد الآن والموقف المشين (لسيناء) التي تمثل (7%) من مساحة أرضها، فهي محدودة التسليح وبرقابة إسرائيلية وأمريكية، بل ووصل التسلط إلي (تحريم) أعمال إعادة بناءها (زراعيا وبشريا) والتي سبق التخطيط لها من قبل الإستراتيجيين الوطنيين لتوطين (3 - 5 مليون مصري) كهدف إستراتيجي حامي لقلب الجمهورية، وجعلها مقصورة فقط علي سياحة (المواخير) وبعض المنشآت الصناعية للشركات متعددة الجنسية (وأهمها الأسمنت)، وتحويل دفة الاستثمار الوطني إلي مشروع مشكوك في جدواه الاقتصادية (مشروع توشكي في أقصي الجنوب، والعائد حتى الآن وطبقا للبيانات الرسمية وليست الواقعية الحقيقية هو 8% من المستهدف رغم البدء فيه منذ عام 1996).<br />أما عن أسباب ذلك كله فقد تم التطرق إليه في العديد من مقالات سابقة استنادا علي معايشة ومشاركة ومراجع العسكريين المشاركين والمراقبين (الشاذلي والجمسي وهويدي) والسياسيين ( فهمي وإبراهيم كامل وبطرس غالي) وغيرها، والتي تدين أساسا القيادة السياسية وضعف القوات الجوية المصرية.<br />فعلي أي أساس عسكري يمكن أن يستمد مبارك شرعيته؟؟.<br />وحتى لو فرضنا جدلا أن هناك استحقاقا لشرعية عسكرية من نوع ما (وهو أمر لا يتوافق مع النتائج العسكرية ولكنه أمر فرضي) فهناك طابور طويل من المستحقين يأتي فخامة الرئيس الحالي في نهاية المصطفين.<br />2 - وهل هي نضال ثوري ؟؟ ، وهذا أيضا لا (!!)<br />فلم يُعرف عن فخامة الرئيس مقاومته للاحتلال البريطاني كمثال أو أن له تاريخ نضالي ثوري يكسبه الشرعية بعد الاستقلال والتحرر. والواضح وبإقرار فخامته، أنه كان إنسانا عاديا التحق بالكلية الحربية في نهاية الأربعينات ثم الكلية الجوية في بداية الخمسينات ليتخرج ضابط (نقل جوي) ثم تولي مناصب (تكنوقراطية) أجتهد فيها ليصل إلي رئاسة أركان القوات الجوية. أما عن تعينه قائدا للفوات الجوية ونائبا لرئيس الجمهورية ثم رئيسا للجمهورية فهي أمور سبق عرضها ويطول شرحها وخلاصتها أنها المصادفة وعملية توازنات خارجه عن سيادته (!!).<br />3 - وهل هو ميراثا عائليا ؟؟ ، وهذا أيضا لا (!!) ، ولا نريد الإسهاب (!!!!)<br />4 - وهل هو فكريا ايدولوجيا ؟؟ ، وهذا أيضا لا (!!).<br />فلم يعرف عنه أنه صاحب فكر عقائدي (ديني أو فكري) أو رؤية منهجية لحل مشاكل مصر والعرب والأمة الإسلامية (!!)، بل أن أحاديث فخامته (الغير منقحة من طابور السكرتارية والمستشارين) توضح (تواضع) تمتعه بالفكر الثقافي بتعريفه العام (وهو التمتع بقاعدة معرفية وآلية إدراك وهموم لقضية وطنية أو قومية أو عالمية ورؤية عقلانية للحل).<br />5 - وهل هو سياسيا ، وهذا أيضا لا (!!).<br />فالسياسة هي إدارة الصراعات وحل التناقضات وحسن الاستفادة من المتغيرات، وهي دائما (بنتائجها الإستراتيجية) وليس (بخطواتها التكتيكية)، والنتائج نراها الآن في تحجيم الدور المصري وتهميشه ووضعه في مصاف أحدي الدول الخليجية (مع احترامنا وتقديرنا لهم) بل أنه يستقوي بهم لا داعم لهم (!!)، ونراها علي المستوي الأفريقي والمستوي الشمال إفريقي العربي والمستوي الشرق أوسطي والمستوي العالمي، والأخطر هو ما نراه في القضايا العربية (العراقية، الفلسطينية، السودانية). وهذا أيضا تم الإسهاب فيه بمقالات سابقة.<br />6 - وهل هو عبقريا اقتصاديا ، وهذا أيضا (وبالثلث) لا وألف لا (!!).<br />فقد هبط الجنية المصري في عهده إلي خُمس قيمته ( أي 20% من قيمته، فمن الدولار = 120 قرشا إلي الدولار = 600 قرشا)، وارتفع حجم الدين الخارجي والداخلي (وهو الأخطر) رغم الإعفاءات التي حصل عليها من الدول الدائنة بعد مشاركته بفرقتين عسكريتين في حرب (الكويت والعراق) عام 1991، ورغم أن هناك 150 مليار دولار حصلت عليها مصر في خلال الثلاثين عاما الأخيرة إضافة لحصيلة بترول حقل مرجان (وهو ما سبق وأن عرضه هيكل منذ شهور في اتهام صريح للحكومة، وقام السيد عاطف عبيد بعد إقالته بنفي ذلك واعدا بأنه سيفند الأقوال بالوثائق والمستندات ولكنه لم يفي بما وعد !!)، وهناك حوالي (من 7 إلي 8 مليون) عاطل ومثلهم وأكثر منهم (بمليون) من العوانس، وهناك تسريح إجباري للعمال (تحت مسمي المعاش المبكر)، وهناك حالة غلاء طاحنة وانفلات في الأسعار، وهناك عودة إلي طوابير الخبز (الأسود)، وهناك أزمة إسكان منازل تلائم محدودي الداخل (فكل مليارات استثمارات البنوك ذهبت إلي الاستثمار السياحي والطبقي)، وهناك مليارات البنوك المنهوبة من المال العام ومدخرات الشعب والتي سيتم إدراجها في خانة (ديون معدومة)، وهناك العشوائيات التي ظهرت علي سطح الإعلام حديثا كمصدر للإرهاب (!!) بعد أن أخفوها لسنوات، وهناك القطاع العام الذي تم نهبه وبيعه لصالح فئة من المستفيدين المحظوظين، وهناك التفاوت الطبقي الصارخ بين مجتمع الخمسة في المئة وباقي الشعب، وهناك .. وهناك.<br />والحديث يطول عن فخامة الرئيس الذي يقول عنه حوارييه (!!) في منشور دعائي وصلني بالبريد الإلكتروني:"
