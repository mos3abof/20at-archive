[[comments]]
order = 6
subject = "براء دي حكايتي مع عشرينات"
author = "عبدالله مفتاح"
posted = "2006-02-22"
text = "الحكايه اللي بحكيهالك دي والله حصلت فعلا وتقدر تسال احمد نصر الدين عليها<br />اللي حصل اني بحب الكتابه ولما عرفت موقع عشرينات عجبني اوي وبقيت عايز كتاباتي تتنشر عندكم وفعلا بعت موضوع ظنيت انه كويس وطلبت منكم ابداء الراي فيه وفعلا احمد نصر الدين قالي كتابتك جميله جدا وهتتنشر واتنشرت فعلا بعنوان(خلي البنت تتجوز)طبعا فرحت اوي وبعت حاجه تانيه وطلبت من احمد نصر الدين يقول رايه ،مردش عليا بعتله تاني مردش عليا تاني بعت اقله(يظهر انك بتنفضلي او بتزحلقني او بتحلقلي وكلها عزيزي مرادفات لكلمة تتجاهلني بالفصحي )<br />بعتلي ايميل قال فيه كلام اساء ليا فعلا عشان اعتبر ان اسلوبي في الكلام معاه مش كويس .طبعا انا ادايقت اوي وبعت قلتله حقك عليا انا مقصدتش ادايقك بس قررت اني مبعتش للموقع تاني ابدا<br />ولان قلبي ابيض ولان في حاجات كتير بتستفزني بتخليني اكتب ويكون نفسي تتنشر وناس كتير يقروها بعت مقالين ومحدش رد عليا تالت مقال بعته ليكم وانتو تفضلتوا مشكورين قلتولي انه هيتنشر<br />اللي عايز اقوله ان احمد نصر الدين زعلني فعلا من الموقع كادارة بس انا مقطعتش الموقع لاني بقدر اكتب اللي انا عايزه وهوه موقع حلو<br />دي يا سيدي حكايتي مع عشرينات اديني قلت اللي عندي . وكلمه اخيرة يا ريت تقول لهبه بلاش مواضيع (جريئه )زي مبتسميها على فكرة انا مش ضد مناقشه كل امورنا بس باسلوب علمي مش باسلوب ( كلو يفضح نفسه)<br />وانا والله بتمنى ليكم كل التوفيق لاني فعلا احسبكم على خير ما لم اسئ الظن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114057/http://www.20at.com/article2.php?sid=485"

