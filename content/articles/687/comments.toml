text = "الفكرة يا أخت شيرين، إنك تسرعتي شوية في كتابة تعليقك..<br />الصفحة مازالت لم ترفع أون لاين، وسترفع خلال دقائق إن شاء الله.<br />وأعتقد أنها تحتوي على الكثير مما قد يقلق المحاربين القدماء..<br />على العموم عمال المواسير رجال أفعال لا أقوال.. وننتظر تعليقك الكريم في الصفحة إن شاء الله.. وطبعا تعليقات كل المتعاطفين مع عمال المواسير المكبوتين في ظل هيمنة مجموعة من المحاربين الذين يدعون أنهم قدماء.. مع إنهم لا هما قدماء ولا حاجة، ولم يأتوا إلى العمل إلا قبلنا بأيام قليلة ..<br />يلا كفاية كدة<br />براء"
