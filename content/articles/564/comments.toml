subject = "عاجز عن الشكر"
author = "احمد رفعت"
posted = "2006-10-12"
text = "انا احب اشكرك جدا يا دعاء على النصائح دى لانى بصراحة كنت محتاج للنصائح دى جدا وعلى فكرة فى صدفة غريبة حصلت عارفة ايه هيا البنت الى انا بحبها اسمها دعاء زى اسمك بس قصة حبى لدعاء قصة غريبة مليانة معاناه وانا فى حاجة لشخص اتكلم معاه واحكيلو قصة حبى عشان ينصحنى اعمل ايه ارجوك مش تنسينى وكلمينى يا دعاء انا فى انتظار ردك."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103520/http://www.20at.com/article2.php?sid=15"

