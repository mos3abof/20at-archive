posted = "2006-05-31"
text = "انا نفسى اكون محب لى ناس وناس تحبنى<br />بسى فى حجات نفسى اتعلمها<br />1 لزم اكون متدين عشان ربنة يحبيب فية جميع خلقوة وناس كلها<br />2 لزم اكون راجل اعرف اتحمل مسولية<br />3 لزم اكون مختلط بناس كلها اتعلم منهم وعلمهم بتنسوس انى ربنة هيسال عبدة فى يوم من ايام انت اتعلمت اية وعلمت ناس اية<br />4لزم دحكة تكوت ديمن على وجهى<br />5 لزم اكون طيب ويعرفونى ناس على اساس طيبة<br />6 لزم اكون تفكيرى واسع اعرف اناقش موضوعات<br />7 لزم اكون صريح مع نفسى مع ناس كلها<br />8لا تخاف من حد خاف منربنة فقط ولديك ومك"
