subject = "مش مع اى حد"
author = "ESLAM"
posted = "2006-02-23"
text = "على فكرة الكلام دة مش مع اى حد لاءن لو انتا مثلا بتكلم انسان مش محترم اساسا او بيلاقى نفسة فى عدم الاحترام هتقنعة ازاى انه يحترمك الا بالضرب والقصوة عليه لاءن فى ناس لو اتعملت معاهم بالاستماع اليهم دائمامش هينزلو من على اذنك وبالتالى مش هيسمع منك حاجة لاءنه لقى واحد يسمع ومستمتع بالكلام بتاعه وساعه ما تجيلك الفرصة انك تتكلم هيكون هوا تعب من كتر الكلام وهيحاول يمشى باءى حجة علشان هوا خلاص قال كل اللى عنده واسف فى الفظ الناس فى الوقت اللى احنا فيه دة عوزين يتكلموا ومش عوزين يسمعوا حاجة وساعه وهوا بيكلمك وانتا سمعلوا على طول هيفتكر ان كلامه دخل دماغك قوى وهيفكر نفسه بقى مثل اعلى ليك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103520/http://www.20at.com/article2.php?sid=15"

