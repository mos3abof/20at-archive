subject = "مؤمن"
author = "مؤمن"
posted = "2006-05-31"
text = "ازى اجزب ناس الى وزاى اخلى كل ناس تحبنى<br />نفسى اعمل كدة بس مشعرف هل<br />1 -لزم اكون اعرف ربنة عشان ربنة يحبيب ناس فية<br />2- لزم اكون محترم جدا وكون عندى شخصية مختلفة عن جميع ناس<br />3- لزم اكون صريح معرفشى كزب وكون شجاع<br />4- لزم احسيس كل ناس انى راجل وممكن اعتماد علية<br />5- ازم اخطلت بناس كتيرة اتعلم منهم وعلهم كل حاجة بتنسوس انى ربنة يوم حساب<br />هيسال عبدة هقول انت اتعلمت اية وعلمت<br />3"
