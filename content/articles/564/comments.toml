text = "مشكلتى انى مش بعرف اتعامل مع الناس خالص مع انى شكلى الحمدلله جميله وخصوصا مع اصحابى اواقاربى و كمان احد الاركان اللى فييه السيئه انى انا اللى فى قلبى على لسانى وناس كتيير بتستعبتنى و بتقوللى كلام انا للاسف بصدقه<br />مثلا انا مره بتصل ببنت خالى اللى لسه والده من شهر قلت لها ابنك عامل ايه راحت تقوللى كويس اهة بيمشى ادامى فرحت انا من غبائى صدقت و قولت ماشاء الله واخبرت ماما"
