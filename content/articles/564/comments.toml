subject = "مفيش حب في الزمن ده"
author = "أحمد عوض"
posted = "2006-09-05"
text = "الزمن اللي إحنا عايشين فيه ده لا يوجد أي حب خالص ولكن إزا لقيت حد يحب في الزمن ده غير أمك وأبوك أبقى أنا غلطان الزمن ده اللي يحبك فيه يكون بيفضلك على نفسه وطبعا ده مش موجود أزا لقيت اللي يفضلك على نفسه إمسك فيه ومتسيبوش لإن ده نااااااااااادر في الزمن المهبب اللي عايشينو ده<br />أتمنى الكل يقرأ تعليقي وشكرا لآراء الجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103520/http://www.20at.com/article2.php?sid=15"

