posted = "2006-03-11"
text = "دا موضوع كويس بس المشكلة اننا دايما مش عاجبة الناس لو اتعملت كويس او وحش الناس مش بيعجبها حاجة وبعدين الناس بتختلف فى ازواقعها يعنى صعب ترضى كل دول لو اتكلمت كويس وضحكت وهزرت ابقى بنت مش كويسة ولو اتكلمت بحزر وتحفظ ابقى بنت مغرورة يعنى حيرونا وبعدين الانسان لازم يدور على الناس اللى تفهمة وتقدرو عشان يقدر يستمر فى الحياه لان بجد الناس ساعات بتكون عامل هدم كبير قوى لللانسان وبعدين ادينا بندعى ربنا انو يحبب فينا الناس . بس بجد الناس مش بيعجبها العجب"
