author = "حسام"
posted = "2006-07-20"
text = "انا بقى مشكلتى صعبة جدا هيا انى بحب كل الناس ومش بحب ازعل حد منى وعلى طول احب اهزر مع الناس اللى بحبها ورغم كل دة بقابل مشاكل كتير انى اوقات بعرف من صحابى انى فى ناس مش بتحبنى عشان انا كدة وسعات ناس تقولى انت خبيث مع انى صريح جدا وبحب الناس اوى ومش بلاقى اللى يحبنى ارجو الرد وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103520/http://www.20at.com/article2.php?sid=15"

[[comments]]
order = 23
subject = "من الجميل ان يكون لك قلب انت صاحبه ولكن من الاجمل ان يكون لك صاحب انت"
author = "المحبة"
posted = "2006-07-24"
text = "هل هكذا تموت الأحاسيس الجميلة كما يموت الورد حقا ؟<br />يموت الورد مقطوعاً من شجرته وكذلك يموت الحب بعد أن يقرر صاحبه اقتطاعه من أحشاء القلب<br />ويموت كذلك الورد مدعوسا تحت الأقدام كما تموت الأحاسيس الجميلة عندما يدوس عليها صاحبها ليقتلها<br />ويموت الورد إذا لم يسقيه صاحبه الماء الذي يحييه<br />وكذلك يموت القلب إذا لم يسقيه صاحبه بالحنان والعاطفة الجميلة والحب ..<br />لماذا يتعامل الناس مع الحب كما يتعاملون مع الوردة .. ينظرون إليها ويتمتعون بجمالها ، يشتمون رائحتها العطرة ، ويجعلونها عنواناً للفرح والسعادة ، يسقونها ويعتنون بها ويجعلونها سيدة كل الورود وملكة كل الأزهار .. كذلك يفعلون مع الحب عندما يحترمونه ويقدسونه ويجعلون من يحبون معجزة جديدة فيبادلونه المشاعر الجميلة ويرسمون له الطريق نحو الجنة ويدخلون على حياته الفرحة والبهجة ويعطونه الوعود ويرسمون له الأحلام ويدخلونه إلى تلك الدنيا الوردية الجميلة بعدها يجدون غيره فيرحلون ويقتلونه قبل الرحيل كما يلقون بالوردة على قارعة الطريق بعد الاستمتاع بها !!<br />قالت الوردة : ما ذنبي أنني أحببت وما ذنبي أنني ألقيت بجسدي بين أيدي هؤلاء الذين لا يتألمون ؟!؟<br />وقال المحب : ما ذنبي أنني أحببت ووضعت قلبي بين يدي هؤلاءالذين لا يحترمون الوعد ولا يصدقون ؟!<br />الوردة والحب شيئان مختلفان لكن حياتهما واحدة ولذتهما واحدة وكذلك أقول بأن موتهما واحد .. وما أتعسه من حب يموته الاثنان !!<br />كلمة أخيرة : تموت الوردة على قارعة الطريق باكية حزينة ويموت الحب عندما يقرر العشاق إغراق السفينة<br />ونحن نقول ماذا نفعل ؟؟؟؟<br />في زمن لم يعد للاحساس مكان<br />في زمن تغيرت فيه مفاهيم العشق والحب<br />في زمن تحول العشق الى وحش<br />في زمن لا بد أن تتحول فيه الى جزار<br />لا بد أن تكون قاتلا شرير<br />الأصل أن لا تكون هكذا<br />لكن ماذا تفعل حين ترى كل من حولك هكذا<br />ولكن<br />سيظل هناك دائما بقلوبنا احساس جميل لن نفقده مهما حصل<br />احساس بان هناك وفي مكان ما شخص ما سيبادلنا المشاعر والاحاسيس دون ان يقتلها فينا..<br />تحياتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103520/http://www.20at.com/article2.php?sid=15"

[[comments]]
order = 24
subject = "الوصل الى الحاضر بدايه من الماضى"
author = "مصطفى الجازوى"
posted = "2006-09-04"
text = "ادا كان الناس يحبون بعضهم من ماضيهم لكان حاضرهم احسن بكثير مم فيه الان لوكان كل اخ يخاف علي اخوه ويحبه والحب ليس بما تفعله لخيك فقط لو كان انت تحب واحد وما قلتلش كيف يبي يعرف انك تحبه .<br />الناس تحسب ان الحب هو حب العشيق لعشيقته لا هناك حب الاخ لخيه وامه وابيه وصديقه المقرب له والبعيد عنه .<br />لوكان كل واحد يحب صديقه ويخاف عليه كيف ما يخاف علي خوه لكان الناس واحد جميع هده الدول العربيه امه واحده ليس هناك اسمر واله ابيض المهم انه مسلم يخاف ربه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103520/http://www.20at.com/article2.php?sid=15"

[[comments]]
