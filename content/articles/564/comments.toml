[[comments]]
order = 20
subject = "حتلاقى التلطيش اشتغل"
author = "مارك"
posted = "2006-07-17"
text = "اولا : اننى لا اعلق على المقال لأننى اصغر من ان اتجرأ على مباراة اساتذة جهابذه وانما اعرض وجهة نظرى وهى حق مشروع لكل صاحب فكر حر فعذرا استاذى الجليل اذا خالفتك الرأى<br />1- من ناحية الصيد الحمد لله كلنا قاعدين لبعض ..بنصطاد فى الميه العكره زى ما بيقولوا وكل واحد ناصب الشبك ومطعم السنانير..ما تقلقش...كلنا صيادين مهره<br />2- حكاية ابتسم دى لذيذه قوى منك حنبتسم على ايه والا ايه والا ايه ..والله انت راجل طيب ..طب قول ما تمشوش فى الشوارع تكلموا نفسكم ..قول خلاص فرجت واللى عنده على الأقل 3 اولاد ما بيشتغلوش وقاعدين جنبه حيشتغل اتنين منهم..والا قول للى اتهفوا فى عقلهم واتجوزو اطمنوا الحال بقا عال ومش حتسيبوا بعض بعد شهرين...<br />3- وحكاية تذكروا الأسماء ..حد قال لسعادتك ان احنا بننسى اسم الجزار والا البقال والا بتاع النور ..معلش اذا ما عملتش بنصحيتك ونسيت حد.. واللهى دا من ضعف ذاكرتى .. احسن تفكره راحة بال..<br />4- وجميله قوى كن مستمع جيد دى ..طب لمين ..للى فى البيت طول النهار ..نهارك مش فايت ..قاعدلناياخويا زى هم الموت..وان مكانش فى البيت يبقى فى الفصل..اللى مش حيدخل المجموعه سنة ابوه..وطبعا هية سنه ابوه فعلا .. احنا مالنا احنا.. هوه احنا اللي بندفع ..والا حنتخرج نشتغل ..ماحنا كده قاعدين وكده قاعدين.. والا ...والا ..والا<br />5- واللا حكاية تحدث فيما يسر الآخرين...طب هوه احنا لنا كلام الا فيما يسر الأخرين...الحمد لله نتيجة الثانويه طلعت ونشكرك يارب ابو 45% زى ابو400%.. احنا كلنا على مصطبه واحده..دا غير معرفش ايه زاد كام .. وايه بقى بأيه ..احلى كلام...دا غير الحروب اللى شغاله واللى خلت الدهب والبترول فى السما وطبقة الأوزون اللى لا حول ولا قوة الا بالله اتخرمت ومش عارفين ننقل شوية طفله فوق نسد بيهم لأن اسعار البترول ولعت..والا اللى كل يوم ييسمعوه لنا بسبب الحروب اللى حتبقى عشان الميه..<br />الخلاصــــــــــه<br />بالطريقه بتاعة حضرتك دى ..عشان احبك لازم انت تحبنى وعشان انت تحبنى لازم انا الأول احبك.. وف الظروف اللى احنا فيها دى وبالطريقه دى.. والله لا انا ححبك ولا انت حتحبنى ...ولا حرتاح معاك ولا حترتاح معايا ولا عمرنا متفقين حتى لو كنا اخوات ..وحتبصص تلاقى التلطيش اشتغل والصريخ لرب السما.. وعلى راى الشاعر .. (حب ايه اللى انت جى تقول عليه)<br />هوه حل واحدمافيش غيره((( لابدمن وجود ناس تضحى من اجل الآخرين))وياما فيه ناس بتدفع حياتها عشان اللى بيحبوهم اوعى حد يقول مافيش...ياما فيه ناس بتتبرع باعضائها لأحبابها بلا مقابل..ياما ناس ماتت وبتموت فى الميدان من اجل الوطن والشرف والعرض..وبلا مقابل<br />لازم ناس تنكر نفسها... لازم يكون الحب والعطاء جزء من تكوينهم مايكونش لسبب .. مايكنش لعله...ما يكونوش مستنين مقابل ..مايكونش الحب سناره اصطاد بيها حبك.. لأنى مدام بصطاد حبك يبقى انا منتظر منك الرد .. لألالالا... يكون الحب عطاء..بلا مقابل..يكون الحب نبع داخلى ..ممكن انت تكرهنى..لاكن انا احبك..لأن الحب ليس صناعه..الحب هو نبع ..يعطى ولا ينتظر الرد<br />(( احبوا كل الناس لأنكم اذا احببتم اللذن يحبونكم فأى أجر تستحقون))<br />اعتذر لصاحب المقال فهذه وجهة نظر<br />مارك ســمارت<br />شــكر وتقدير :<br />سادتى القائمين على هذا الموقع<br />والله نفسى اشكركم على هذا الموقع العظيم الذى شغل وقت قراغى واعطانى مثل هذه الفرصه لكى اعبر عن رأى المتواضع فى حرية ويسر...شكرا لكم<br />مارك سمارت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103520/http://www.20at.com/article2.php?sid=15"

