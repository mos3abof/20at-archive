[[comments]]
order = 15
subject = "الى كزانوفا"
author = "واحد معدي"
posted = "2006-11-01"
text = "معلش العتب على النظر<br />بس اصلى نادر اما الاقى معجب اوى كده وراجل فى الاغلب بيكونوا بنات بس ده خطأ واعتذرلك عليه لانه فعلا مش مقصود<br />بس مش فاهم ايه علاقة اتساع الافق والثقافة انى اعرف كزانوفا راجل ولا ست ولو انت متخيل انى ضيق الافق وضحل الثقافة فشكرا ليك وانا هحاول مع نفسى جاهدا انى ازيد من ثقافتى وواسع من افقى خصوصا فى الحاجات اللى انت بتتكلم عنها وهحاول اشوف معاجم الاسماء عشان اعرف كزانوفا وتراجم المشاهير عشان اعرف حنان<br />ولو اللى ما يعرفش كزانوفا وحنان جاهل وضحل الفكر والثقافة انا اول الجاهلين واحمد الله على جهلي واعتز به جدا<br />ربنا يخليك البتنجان اللى انت عايش فيه<br />تحياتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103310/http://www.20at.com/article2.php?sid=1392"

[[comments]]
order = 16
subject = "اللهي ضحكتوني بجد"
author = "shosho"
posted = "2006-11-02"
text = "الناس الي سابت الموضوع وقعده تشتم في بعض ...براحه شويه علي بعض مش كده<br />يعني انتوا محموقين علي الكلمه الي قلتها ست السنيوره حنان وانتوا بنفسيكم اهوه عملين تغلطوا في بعض<br />واللهي محدش هيحترمنا الا اذا احترمنا نفسينا الاول لازم يكون الاحترام نابع مننا ساعتها بس الناس هتحترمنا<br />يارب نفهم<br />وبالنسبه لهاله سرحان فالكلام خساره فيها واقولها علي رأي عمرو دياب خلصت فيك كل الكلام ....عجيبه من عجائب الزمن هاله دي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103310/http://www.20at.com/article2.php?sid=1392"
