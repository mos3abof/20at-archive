subject = "حرام عليك يامنى"
author = "رنا-السعودية"
posted = "2006-10-31"
text = "كل بني ادم خطاء وخير الخطاؤون التوابون ,, وبعدين ياستي مش هي اعتذرت؟؟ وهتوضح الموضوع ده للجمهور ؟؟ يبقى ليه لازم نمسك عليها الغلط وخصوصا انها قالتها ببراءه وحسن نية؟؟<br />ولا عشان بس اتحجبت لازم نوقف في وشها ونشوه صورتها؟؟<br />عموما الكل يعرف اخلاق حنان ترك الراقيه"
