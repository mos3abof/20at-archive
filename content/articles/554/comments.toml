text = "بص يا عم المعدى اولا شكل ثقافتك على ادك وطريقة كلامك غير لبقة اساسا كازانوفا ده اسم راجل مش ست دى حاجة الحاجة التانية ثانيا واحدة بتمثل قضية موجودة فى الشعب المصرى مبحهاش ليه ويبقى فى كلام معاها باحترام وايه اللى مضايقك اوى كده ريح انتا بقى عشان انتا ضيق الافق اساسا(متروحش تسأل حد على كلمة ضيق الافق دى يا مثقف لازم تعرفها لوحدك بقى))"
