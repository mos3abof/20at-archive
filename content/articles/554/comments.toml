text = "بص يا فرستونا حنان قالت انها بتقول كده على اساس انها زينب مش حنان ترك الممثلة بتجسد شخصية داخل حلقة وهما اللى عاملوا cut للبرمو ده وحطوه اعلان وده و ولا دفاع مستميت ولا حاجة بس اللى اعرفه انها مرتكبتش غلط وياريت فعلا تشيلوا ايديكم من على الفنانات المحجبات"
