[[comments]]
order = 0
subject = "حنان ملهاش ذنب"
author = "كازانوفا"
posted = "2006-10-30"
text = "اولا::يعنى انا عايز اعرف يا منى حنان قالتلك انها متقصدش انها تقول فى الاعلان كده وهما عملوا المقطع ده على مزاجهم وحذفوا منه وانا عارف انى اخلاق حنان ترك متسمحلهاش انها تقول كده عن قصد .<br />ثانيا: انتى بتقوليلها ايملليك عشان تشوفى التعلقيات بتاعت الناس اظن انى دى حرية شخصية انها تديكى الايميل بتاعها ده اساسا لو عندها ايميل هيا عندها موقع وبيتجدد حاليا وجروب اتوقف رسايله بعد ما تحجبت واظن انى مفيش ايميل وهيا قالتك هوضح قريب صح.<br />ثالثا: طريقة حنان فى التلفون كده بتتكلم بلهوجة وبسرعة كدا عشان بتبقى all time busy وكمان بتحضر دروس علم غير ندوات المسلسل .<br />رابعا: ياريت تخدى كلامى بصدر رحب بدون اى زعل لأنى حنان ترك شخصية غالية عليا اوى لانى اتكلمت معاها شخصيا كذا مرة ومنتهى الاخلاق اللى فى الدنيا<br />خامسا: اخر 3 ارقام من موبايل حنان ترك هما 438 واوعدكم انها تتدخل ترد على موضوعك ده يا منى وتشارك الناس فى رأيهم<br />وشكــــــــراا<br />كازانوفا<br />www.cazanoova.blogspot.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103310/http://www.20at.com/article2.php?sid=1392"

