[[comments]]
order = 3
subject = "هي المحجبة لازم تكون ملاك"
author = "فرستونا"
posted = "2006-10-31"
text = "حاجة غريبة جدا هذا الدفاع المستميت عن واحدة بتشتمنا عشر مرات يوميا.. كأن مجرد انها محجبة ده بيعصمهامن الخطأ..<br />لأ طبعا حنان ترك فعلا شتمت الجمهور العربي.. وحتى الاعتذار بتتكبر عنه.. ودي مش أخلاق الإسلام اللي بتتمسح فيه حنان واللي زيها.. لأن المؤمن ليس طعان ولا لعان.. ومثقوليش بقى دي لغة الشخصية والكلام الحمضان ده.. أنا اللي بشوفه هو الست حنان وهي طالعة تهددني انها هتضربني بالشبشب على بقي...<br />بجد بجد دي لا أخلاق فنان ولا أخلاق مسلم. ولا أخلاق من أصله..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103310/http://www.20at.com/article2.php?sid=1392"

