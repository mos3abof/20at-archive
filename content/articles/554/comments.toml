text = "بصراحة البرمو مستفز جدا ومنتهى السوء حتى لو كان دى طريقة زينيب ولا مش زينيب بنت الشوارع دا كلام فاضى وربنا يهديهم ويهدينا ويهدى الست هالة<br />وحسبنا الله ونعم الوكيل فى اللى فاتح القنوات دى علشان القرف اللى بنشوفه كل يوم عموما الحمد لله مش بشوف القناة دى وكل لما بلاقيها بغيرها عند فى جملة مش هتقدر تغمض عينك لكن شفت البرمو لما اختى شغلت القناة الزفت دى<br />الله المستعان"
