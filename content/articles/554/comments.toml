[[comments]]
order = 11
subject = "الى كزانوفا"
author = "واحد معدي"
posted = "2006-10-31"
text = "يعنى ايه الاستموات ده وايه الاحساس اللى انتى بتحسسهولنا ان انتى بايته معها فى البيت كل يوم ورقم موبايلها وما بتفتحش الميل و و واحلى حاجه موضوع ال تايم بيزى ده ياختى عليكى وعليها والمستفز بقا انها بيزى فى دروس علم وندوات المسلسل<br />بلا خيبه<br />طبعا القناة اللى غلطانه عشان جابوا الكملة خارج سيقها زى اللى يطلع من القران لا تقربوا الصلاة كده<br />وحنان مش غلطانه<br />بس الاخت كزنوافا دى مستفزه اوي محموقه اوى مش عارف على ايه<br />براح على نفسيك واركزى كده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103310/http://www.20at.com/article2.php?sid=1392"

