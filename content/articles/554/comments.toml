subject = "تفاهه"
author = "صحيح منى عامله فيها انها وحنا اصحاب وبايتين في حضن بعض ..وقال ايه اتصلت بحنان ..وبعدين ما انتي مستفزة برضه يا مني ولحوحة في سؤالك..حتى لو غلطت ..المفروض القناة أو البرنامج ميعرضوش الكلمة دي ..عادي ..لكن واضح انكم بقيتوا حاطين المحجبات في دماغكم و زاعقين ..والموضوع بجد تافه اوي"
