[[comments]]
order = 7
subject = "حنان ترك ليست مخطئه انتم المخطئين"
author = "البروفسير / احمد محمدى"
posted = "2006-10-31"
text = "اولا السلام عليكم<br />ثانيا<br />حنان شاركت فى برنامج هاله سرحان وقدمت حلقه لا توصف باقل من كلمه روعه<br />المهم فى العام الماضى عندما كنا نسمعها فى شخصيه ساره ونتذكر عذاب ساره كانت الدموع تسقط منا بدون وعينا لان حنان قد قامت بدورها على اتم وجه<br />وفى مسلسل اولاد الشوارع ايضا قامت بمناقشه قضيه هامه هى اولاد الشوارع وقامت بتقمص دور فى المسلسل وادته بدور رائع فما المشكله ان تقوم بتقمص جزء من المسلسل فى برنامج كبرنامج هاله سرحان<br />اليس نفس الاسلوب التى اتبعته فى اداء عبارتها نفس اسلوب المسلسل. اليس كذلك !<br />اذا فمن يرفض هذا الاسلوب انما يرفض مبدأ مسلسل تلفزيونى قوى ناقش قضيه تهمنا كلنا. فهل من معترض على المسلسل !<br />اذا فلا وجود لاعتراض على عباره<br />واذا وقفنا على كل عباره تقولها اى ممثله او ممثل<br />فنحن سذج فلا معتصم من الخطا الا الله<br />وهم بشر وانت بشر وكلنا بشر فلا داعى لهذه الحركات الهايفـ ... ولا بلاش<br />وبعدين لو انت بدوروا على عبارات بجد وبتهز الكيان العربى اسمعوا واقراءوا مقالات الكتاب الغربيين الذين يهاجمون الدين والوطن<br />مش كده ولا ايه !!!!!!!!!!!!!!!!<br />سلامى لحنونه وجميع محبيها وناقديها<br />البروفسير / احمد محمدى<br />profseer / ahmed mohamedy<br />http://freehost16.websamba.com/profseer1"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103310/http://www.20at.com/article2.php?sid=1392"

[[comments]]
order = 8
subject = "المتهم الاساسى البرنامج المعفن ده"
author = "واحد بيكره هاله"
posted = "2006-10-31"
text = "يعنى الست المهزئة اللى بتخلى كل ضيف يقول روتانا زفت مش هتتنيل على عينك الضيوف بيقولها بنوع من الهزار واللى بيرفض بتقعد طول الحلقة تزن على ودانه ست لحوحة فعلا يبقى من الاساس كان المفروض حنان وغيرها زى جمال سليمان مثلا ترفض حضور برنامج معفن زى ده مكان واحدة زى ايناس الدغيدى ويوسف شاهين وامثالهم من الصيع.<br />انا مع كل المعلقيين ان القناة والبرنامج الزفت ده بيقطعوا فى كلام الضيف عشان يطلعوا جملة مثيرة تشد الانتباه .<br />واذا كانت الجملة ضايقت يا ست منى لومى القناة لان الجملة لو مشيت فى سياق الكلام مش هتبقى مستفزة لا ليكى ولا غيرك .<br />وياريت بلاش تتدخلوا موضوع الحجاب فى الموضوع خلونا فى البرنامج احسن عشان مش كل واحد متعقد من الحجاب يطلع يزعق المحجبات مش ملايكة احنا معك بس اللى مش محجبات دول يبقوا ايه ملايكة يعنى، اغلبهم شياطين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103310/http://www.20at.com/article2.php?sid=1392"

