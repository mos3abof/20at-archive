subject = "طيب وأسم أم أمي ؟؟؟"
author = "علاء خديجة"
posted = "2006-05-06"
text = "شئ جميل يبقى للواحد نيولوك خاص بأسمه..<br />لكن إذا كان الواحد منا سيذكر أسم أُمه فلماذا يحرم الأخيرة من ذكر أسم اللي جابتها؟؟ ... يعني إذا ذكرت أسمي مثلاً علاء سعاد محمد فذلك خطأ ولا بدأن يكون علاء سعاد فتحية... وهكذا تتواصل أسماء الأمهات أماً عن جدة .. على فكرة أنا من عائلة كبيرة هي عائلة ست أبوها!!"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

