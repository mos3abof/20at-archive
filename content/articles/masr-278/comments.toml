text = "عارفين مين هنى بولا حتقوللى لا<br />اقولكم هنى بولا تبقى بنت هنى بالا<br />اللى هيا مرات باشمهندس هنيبال اللى بياكل دماغ الناس فى الفيلم<br />وشكله كده جاع فكل دماغ مراته والله اعلم<br />لو حتتفرجوا على زعتورة هالة سرحان يوم الاثنين حتلاقوها شبه هنيبالا بالظبط<br />طبعا من غير المخ<br />وبنتها حيبقى اسمها<br />هنى بولا هنيبالا هنيبال<br />(انما نملى لهم ليزدادوا اثما )"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 44
subject = "هو ده بقى التقدم"
author = "م/حسن"
posted = "2006-05-14"
text = "علشان الواحد بقى متقدم ومش يبقى رجعى لازم يعمل كده,التقدم و الرقى والحضاره مش فى ذكر اسم الام ولا اسم الاب و لا مش مهم اسم خلاص اهم حاجه انت بتعمل ايه وايه فائدة العمل على الوطن والانسان ,الامم الخرى تطورت قبلنا بملايين السنيين واحنا لسه بشوف اللى احنا نكرم الام بان الواحد يكتب اسمها بعد اسمه وهو ده التكريم<br />ياوليه حرام عليك<br />احسن حاجه تعمليها علشان تكرمى امك<br />(روحى بوسى ايديها وقولى لها بذمتك هى اشكال تخلفيها)"
