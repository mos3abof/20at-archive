[[comments]]
order = 20
subject = "الرد على السفهاء"
author = "يوسف وللاسف مصرى"
posted = "2006-05-10"
text = "ردا على الرأى المنحط الذى يتأسى من أننى تأسفت على أننى مصري,(1) فإننى أتأسف من أننى مصرى,بسبب إنتماءك أنت وأمثالك الجهلاء المنحطين فى أسلوبهم المبتذل.وأرجو أن تكون فهمت وتتعلم الاسلوب المتحضر فى مخاطبة أسيادك .(2)أما بخصوص تفسيرك للآية الكريمة(أدعوهم لآبائهم)فهذا دليل على جهلك حتى فى أمور دينك(راجع تفسيرها من أهل الدين,إذا كنت عاوز تكون بنى آدم وتتعرف على دينك).(3)أما بخصوص أسلوبك المنحط فى إبداء رأيك ومخاطبة أسيادك,فهو دليل آخر على أنك من أحط أحط أحط..الخ بيئة فى قاع المجتمع.فلعلى وعسى أن تكون فهمت,مع أننى أشك فى ذلك."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 21
subject = "إلى ذلك المصري المزعوم"
author = "إلى المصرى الزعوم المسمى بـ\"يوسف\""
posted = "2006-05-10"
text = "أحب أوضح لك أنى فهمت .. والحمد لله<br />فهمت أن قدرا كبيرا من الجهل يعشش برأس سعادتك، لأكثر من سبب<br />بداية لن أتحدث عن الأخطاء اللغوية والإملائية التى وردت بتعليقك وتنم عن مستواك المعرفى الحقيقي<br />إنما سوف أتحدث عن الشتائم التى سيطرت على تعلقك ، وهو أسلوب غالبا ما يلجأ إليه أصحاب الثقافة المضمحلة ليواروا به سوأتهم وجهلهم فى كثير من الامور<br />أنت لم تقدم أى معلومة أو فكرة يمكن مناقشتها غير الشتيمة فى شخصي الضعيف.. الضعيف بنفسي، القوى بدينى وباتمائي لهذا الوطن الذى اعتز به<br />هناك للأسف عدد غير قليل من أدعياء الثقافة الذين يجرون وراء كل ناعق تصدر منه تقليعة جديدة بدعوى التقدم والتنوير<br />أقول هذا الكلام لعل وعسى أن تراجع نفسك فيما تتشبث به من أفكار براقة وهى فى حقيقتها زائفة..( بالمناسبة يا أخ يوسف لعل بدون ياء ويمكن الرجوع فى ذلك لكتاب المطالعة للصف الأول الابتدائي أوأحد كتاب محو الأمية)"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 22
subject = "والله ضحكتونى وانا فى الثانوية العامة"
author = "اروى"
posted = "2006-05-10"
text = "والله ضحكتونى لما شرأت (شرقت) بس والله الشعب المصرى فى مواهب وفيوزات ضاربة كتير وللاخوة اللى بيتخنقوا ما ينفعش كده معايا حزامين حلوين بيلسوعوا لو تحبوا اوصيلكوا على كم شاطور حلوين كده وتبقى خناقة حلوة لرب السمابس سؤال للست نوال لما واحدة امها ليها اسمين واحد فى شهادة الميلاد والتانى دلع يسموها باى واحد لا موأخذة؟؟؟ بس تعرفوا والله العيب مش عليها دا على جوزها الطرطور اللى مش عارف يلم الولية الهبلة دى"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 23
subject = "لاحول ولا قوة إلا بالله"
author = "أحمد رحال"
posted = "2006-05-10"
text = "نقدي للفكرة : في مجتمعنا الشرقي المحافظ ؛ لن يقبل رجل حار الدماء أن ينادى في الشارع : يا محمد يابن فوزييييييييييةةة ,و لا ضرورة أصلا تستوجب هذا التعديل السخيف.<br />بالنسبة للإخوة المتعاركين لن نتحمل المزيد من العراك الصبياني , و يفضل أن تنتهي هذه المشادة فلا تعلقوا على هذا الموضوع منعا للشجار المتبادل .<br />بالنسبة للدكتورة نوال السعداوي ؛ فلندعوا لها بالهداية و إيانا , فلعنها و السخرية منها ليسا بالطريقة المثلى لنقد ما تقول .."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

