text = "في إحصائية أعلنها وزير الصحة الجديد الدكتور الجبلي قال إن 20 في المئة من المصريين مرضي نفسيين يعني كل خمسة مصريين فيهم واحد ضارب...وكلام بنت نوال لا يدل ليس علي تفشي المرض فقط بل علي صحة المقولة الشعبية إكفبي القدرة علي فمها تطلع الهبلة لأمها"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

