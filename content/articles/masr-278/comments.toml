order = 6
subject = "ابن ام كوثر"
author = "طب لما تكون الحاجة اسمها \"ام كوثر\" كما تنادى في القرى والصعيد ، او لما يكون اسم الدلع بتاعها هو الغالب على اسمها \"فيفي دلع لنفيسة\" يبقى نستخدم انهي اسم؟"
posted = "2006-05-06"
text = "انا عندي حل.. منعا للاشكاليات دي، الاسم يحتوي كل حاجة عن الام<br />مثلا:<br />وليد ام كوثر فيفي نفيسة أحمد السمالوطي<br />حيث ان \"ام كوثر فيفي نفيسة\" هو اسم الحاجة<br />ودمتي يا زوال يا سبعاوي لمصر هرما رابعا"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

