[[comments]]
order = 0
subject = "ابن عزيزة الهبلة"
author = "لى استفسار للدكتورة نوال زينب السعداوى"
posted = "2006-05-06"
text = "لو واحد اسم امه مركب (زى عزيزة الهبلة مثلا ) و اسم ابوه كمان مركب (زى عبده مقص مثلا* أه ونسيت أقولك ان اسمه هو كمان مركب(زى .. أى حاجة) لازم يكتب الأسماء دى كلها<br />وأيه العمل لو طلبوا منه يكتب اسمه ثلاثى؟!"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "نوال - شوال - جوال - وانا وانت يا عبد العال"
author = "سنووايت"
posted = "2006-05-06"
text = "بداية اسفه لان الحدوته مقلتش اسم ام سنووايت قالت انها كانت ست طيبة وماتت وهيه بتولدها تقريبا او ماتت وسنووايت صغيرة المهم يعني اسمها مش مذكور واللي مش مصدق يرجع للمكتبة الخضراء ويشوف<br />عودة لنوال السعداوي طبعا احنا مش هنفتح هنا باب لتسجيل الدعاوي عليها لان باب السما مفتوح ومش محتاج للسايت ده لكن بما اننا فتحنا الموضوع يعني خليني اقولكم انها اجبرتني في يوم من الايام على حرق كتاب ليها كان في مكتبتي اعتراضا مني عليها<br />لما عرفت ان السادات كان حاططها في المعتقل حبيت الراجل ده اكتر وبقيت عندي سبب قوي غير العبور يخليني اقول الله يرحمه بنفس<br />هيه سيدة مستفزة تحب ان تقول لا لتظهر ولانها تحب الظهور جدا تختار الفجاجة وكل ما يخرج عن الدين والقيم كي تتصدر فيه ربنا يوفقها هي وبنتها انا رايي نلم لها تبرعات تطلع تحج يمكن تعقل وتغطي اللليف الحرير اللي بيهفف ومش بيطير لانها بتستخدم صمغ كويس لتثبيته وشكرا"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

