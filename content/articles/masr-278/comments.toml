posted = "2006-05-12"
text = "دى واحدة شكلها فعلا ضاربة , ربنا يبعد عننا شر الناس ال... دول<br />ثانيا , الخناقة اللى حصلت هنا و الشتيمة اللى اتقالت بين اتنين , عيب كدة يا جماعة , فين أخلاق المصريين<br />و اللى بيأسف انه مصرى , ففعلا دى مشكلته , مصر مهما كان فيها دلوقتى من أحسن بلاد العالم , و يكفى ذكرها فى القرآن , و ان أهلها كما قال الرسول عليه الصلاة و السلام فى رباط الى يوم الدين ان شاء الله"
