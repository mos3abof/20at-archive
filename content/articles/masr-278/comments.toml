text = "ربنا يشفيها نوال بنت الهبلة السعداوي<br />محدش عارف يرمي كبريته على شوشتها ويريحنا من وشها الفقر هي ناقصه البلد تخلف جايه تكمل علينا<br />والله السادات كان راجل اما حبسك لكن مبارك اهبل زيك مش هيحبسك يا بنت الهبلة"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

