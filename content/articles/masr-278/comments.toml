text = "المره بتعمل كده لحاجتين ملهومش تالت :-<br />اولا : تكون مجنونه و دى الارجح و ربنا يخدها و نخلص<br />ثانيا: عاوز تشتهر ..<br />هما منعوا ختان الاناث عاوزين تمنعوا ختان الذكور عاوزينها تبقى سلطه كله على بعضه و قشطه يا معلم"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 15
subject = "اسمى سعيد سها"
author = "عاقل"
posted = "2006-05-08"
text = "شىء غريب اوى يعنى الراجل فى الجيش يقولوله ايه جندى مجند عوض هايدى؟؟ و لا رئيس الجمهورية يبقى اسمه جمال سوزان؟ ده حتى مش لايق يعنى انا شايف انها دعوة شاذة تفتقر الى العقل و المنطق..عجبى عليك يا زمن و لسة<br />عــــــــــــــاقل"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 16
subject = "انها دعوى لاختلاط الأنساب"
author = "إلى الأخ يوسف الذى يتأسف لأنه مصرى وأنا عن نفسي أتأسي لأنه مصرى"
posted = "2006-05-08"
text = "ليس بذكر اسم الأم يتم تكريمها ن اللهم إلا إذا كانت الدكتورة السعداوى وأمثالها يريدون فتح الباب على مصرعيه لاختلاط الأنساب فى ظل عدم معرفة الأب<br />الأمر الإلهى\"ادعوهم لآبائهم\" لم يكن عبثا لا سمح الله ، إنما لعلم الإله بأنه سيأتى زمان تدعو فيه أمثال تلك النوال لمثل هذه الدعاوى التى تمهد لحدوث خلال اجتماعى لا يعلم مداه إلأا الله"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 17
subject = "هى بت الهبله دى لسه مماتتش"
author = "خالد المصرى"
posted = "2006-05-08"
text = "هى بنت الهبله دى لسه عايشه ام شعر شبه المكنسه بتاعه الحاجه يلا مش مهم المهم الوليه الهبله دى وبتها خارجين عن مله الاسلام اصلا الوليه المعفنه دى الى مش عاوزه تتلم لسه منزله مقال بتقول فيه كنت من كان يوم فى حمام السباحه بالبكينى بكينى ايه يا وليه يا عبيطه انتا مش حاسه بنفسك ولا ايه ام جلد مكرمش المعفنه دى انا جيرانى مسيحيين بس الست فيهم طالما عدت الاربعين سنه بتحط ايشارب على شعرها علشان محترمه نفسها لكن دى لسه عايشه اوهام هدى شعراوى (ربنا يكحمها ) يلا مش مهم شوفى انتى فين والناس بتعاملك ازاى وشوفى سيدتك وتاج راسك زينب الغزالى الى مهماش الحاكم وقضت احسن ايام حياتها فى معتقلات الحكام الطواغيت ربنا يهديها وانا عن نفسى اهدرت دمها والى كل مسلم الى يشوفها فى سكته يغزها فى نظارتها (اكيد بتلبس نضاره ولا حتعمل زى حسنى وتلبس عدسات )"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 18
