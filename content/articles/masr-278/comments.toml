[[comments]]
order = 62
subject = "الله عز وجل يوم القيامه سوف ينادينا باسماء امهاتنا"
author = "shimaa"
posted = "2006-05-18"
text = "اتمني بدايا ان تنشرو تعليقي ولا تصبحوا كباقي الصحف او المواقع التي تنتقي ما يؤيد رايها فقط و ما يعارضها تنشره علي استحياء<br />اولا: لقد سمعت برنامج هالة شو الذي عرضت فيه حلقة من جزئين التقت فيها مع د: نوال لسعداوي و سمعت لراي نوال مباشرا دون وسيط<br />ثانيا: اعرف جيد ان لدكتورة نوال شطحات واسعة النطاق بان تدعي انها افقه في الدين من الشعراوي و اشهر من نجيب محفوظ<br />ثالثا: يجب علينا و قبل اي شئ ان نعرف لماذا تقول هذا؟ و ما مبررها فيه<br />بالنسبة لموضوع اسم الام : قالت د نوال انها ري انه لماذا نخجل من ان نسمي باسم امهاتنا بالرغم من فضلها العظيم عليناو لماذا تعتبر وصمه عندما ينادي اي منا (يا ابن امك) هل الام اصبحت وصمة عار ؟؟؟ و انها لم تقل ان يكون الانسان باسم امه فقط و يلغي ايم الاب لكن طالبت ان يكون الاسمين متلاحقين اي ان تقول محمد زينب احمد - انا اتعجب من رفضنا فكرة المناداه باسماء الام في حين ان الله عز وجل يوم القيامه سوف ينادينا باسماء امهاتنا"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 63
subject = "من قال لك أننا سوف ننادى بأسماء أمهاتنا يوم القيامة؟1"
author = "مين اللى قال لحضرتك معلومة ان الله تعالى سوف ينادينا يوم القيامة بأسماء أمهاتنا"
posted = "2006-05-18"
text = "هل هناك آية قرآنية تقول ذلك؟ هل هناك حديث نبوى شريف أو حديث قدسي ؟ أو حتى أثر يؤكد هذه المعلومة ؟<br />أنا عن نفسي لا أعرف مدى صحة هذا الكلام .. لكن الذى أعرفه جيدا .. أن الواحد لا يفتى فيما لا يعرف<br />اعتقد ان حضرتك بتفتى فى حاجة لا تعرفها<br />النبي صلى الله عليه وسلم الذى هو قدوتنا جميعا كان اسمه محمد بن عبد الله وليس محمد بن آمنة<br />اسم امه او زوجاته او بناته لم يكن عيبا لا سمح الله<br />وكلنا نعرف أسماء نساء النبي (صلى الله عليه وسلم) واسم امه وأسماء بناته<br />لكن لم نعرف واحدا من أصحابه كان ينادى باسم امه<br />أرجو يا أخى الكريم أن تتبين معلوماتك قبل أن تطرحها<br />الفكرة باختصار - كما أشار البعض - الأستاذة نوال هانم تريد أن تمهد للاعتراف بأبناء الزنا والعياذ بالله<br />مش موضوع تكريم المراة كما تدعى"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

