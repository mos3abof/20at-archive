posted = "2006-05-17"
text = "إن كانت هذة الدكتورة التى لا أدرى من أعطاها البكالوريوس على هذا القدر من العلم فى إذن تعيش فى عالم غير عالمها<br />وحسبنا الله ونعم الوكيل<br />ملحوظة نريد أن نعرف من الدكتورة كم يدفع لها فى الشهر لكى تقود هذه الحملات القذرة"
archived = "2006-12-15"
