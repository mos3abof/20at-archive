[[comments]]
order = 70
subject = "حد فاهم حاجة"
author = "احمد عاطف"
posted = "2006-05-20"
text = "والله العظيم دى قلة فهم<br />من حقها تقول رأيها<br />ومن حقنا ما نسمعهاش<br />لكن قلة الادب ان الفضائيات علشان معندهاش حاجة مهمة تقدمها تقدم لنا موضوع زى ده .<br />كان الاولى انها تتكلم فى موضوع القضاه حتى لو كانت معترضة على استقلال القضاء زيى كده ( المهم يكون فيه مبرر للموضوع ) مش مجرد كلام علشان ابقى مهم ، وعلى رأ المثل \" ياماما عاوزة اعمل مهمة - تعالى فى الهايفة واتصدرى )"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 71
subject = "اهلا اهلا"
author = "ميدو"
posted = "2006-05-20"
text = "ياخونا الواحد يعمل ايه في الزمن الاغبر ده .؟الواحد يكون نفسه ويدفع مهر ويعمل شوارب .ويشتغل طول الليل (علي راي ام كلثوم)بكل اخلاص وجد لحد ما يتقطم ظهره .واخرتها يتسمى الولد باسم امه .هو مافيش عدل ياست نوله.قدري والآ الاخ اللي عندك بينام وانت بقى جايبه كل حاجه.ايه في صنف جديد نازل السوق اليومين دول.اصح للون.لحسن في البيباي.مساء الخيييييير"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 72
subject = "حسبي الله ونعم الو كيل"
author = "ابو علي"
posted = "2006-05-20"
text = "اولا حسبي الله ونعم الو كيل واعوذ بالله من نوال السعداوى وغيرها من امثالها فهي ليست امراءهوانما هي شيطانه جاءت لتخرب بيوت المسلمين وتدعي ادعاءات باطله وظالمه وليس لها اساسا من الصحه ونحن كمصريين لا نريدها بيننا انها تنفذ فكرالغرباليهودى الصهيونى والعياذ بالله لا نريدها بيننا واكررها اكثر من مره انها امراءه تقول انها اعلم من الشيخ الشعراوى بل هي لا تساوى نعل حذاء الشعراوى رحمه الله انها ليست انسانه بل هي شيطانه ملعونه اعوذ بالله منها ومن افترائها علي لا سلام والمسلمين"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

