[[comments]]
order = 40
subject = "أخر أفكار أم شنب"
author = "بعد كل ما قيل من تعليقات خفي علي الكل"
posted = "2006-05-14"
text = "أن الوليه ام شنب وبنتها أم حاجب هاربتين من مستشفي العباسيه ، وعايزين يغيروا أسمائهن حتي لا يستدل عليهن .<br />لكن أحب أطمئنهن ان ده ليس له داعاً حيث أن الأمن عندنا ليس به رجاله أصلاً .<br />وبما أنه كله حريم فسوف ينحاز للحريم اللي زيه ومش هيقبض عليهن ( هذا بفرض انهن حريم مجازاً يعني )<br />أنظروا للمدعوه مني حلمي عندما تتحدث في اي لقاء تليفزيوني () تشعروا ان فمها أكبر من موقف احمد حلمي ) والكلام بيكب منه ولا أجدع شفشق .<br />وتحس فعلاً انك قاعد امام عالمه من محمد علي أو بلانه من دار السلام.<br />ولا اللي اسمها نوال الهبله ( السعداوي سابقاً ) الوليه رجلها والقبر قبر يلمها ) ولسه بتهرتل .<br />معلهش يا جماعه ليس علي المريض من حرج .<br />والواضح ان ابوها جز كل المسائل اللي عندها وهو بيطاهرها علشلن كده طالعه متعقده من موضوع الختان ده .<br />وأظن مني حلمي محتاجه ختان بس في لسانها مش في المسائل اللي أظن انها معندهاش مسائل اصلاً وخايفه يتكشف عليها أحسن تنفضح ."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

