author = "عبد الله بن عبد الله بن امة الله"
posted = "2006-05-15"
text = "\"والعصر* إن الاإنسان لفي خُسر*إلا الذين ءامنوا وعملوا الصالحات وتواصوا بالحق وتواصوا بالصبر*....(العصر)<br />ليعلم الجميع ان الحرب قد اشتدت اكثر مما هي عليه بل ان الامر سيصل بنا الي ان لا نعرف الله<br />يقول رسول الله صلي الله عليه وسلم في الحديث الذي اخرجه مسلم\"لا تقوم الساعة حتي لا يقال الله الله\" اي لا يعرف<br />وحديث اخر \" لا تقوم الساعة حتي يأتي الاحفاد فيقولون كنا نسمع اباؤنا يقولون لا اله الا الله فماذ كان يصقدون\"<br />وانتم رعاكم الله وهداكم ونصركم ترون ما يجري الذي يجعنا علي جرف هار والله والله والله<br />لا سبيل لنا الا الرجوع الي الله بصدق وعزيمة ولن يكون هذا الا بتعلمنا العلم الشرعي من اهله قيل ان يقبض الله العلماء ولا نجد من نأخذ منه ديننا الا رؤس الجهال<br />تعلموا تعلموا تعلموا<br />قد يسأل سائل لا نجد من نثق به اقول لك لا والله الحمد لله انه مازال بيننا رجال صدقوا الله ولكن يتطلب منا البحث كما نبحث علي امر من امور الدنيا امثال( ابو اسحاق الحويني - محمد حسان-محمد حسين يعقوب-مسعد انور-مصطفي العدوي-محمود المصري-...كثير والله ممن يدعون الي المنهج المستقيم (الكتاب والسنة)<br />وتذكروا ان الامة ستفترق علي ثلاثة وسبعون فرقة كلهم في النار الا واحدة وهي ما كان عليه النبي واصحابه<br />هل انت علي ما كان علي النبي واصحابه؟<br />اواكم الله رعاكم الله نصركم الله هداكم الله رزقكم الله ....الله الله في انفسكم"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

