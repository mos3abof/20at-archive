[[comments]]
order = 13
subject = "مرحبا بالمفكرين العظماء"
author = "يوسف وللاسف مصرى"
posted = "2006-05-08"
text = "الى السادة الأفاضل الرافضين وزالمتحامليين:--<br />الشعب المصرى رافض دائمالأى شىء خوفا من كل ما هو جديد مهما كان, والسبب هو الخوف والإنغلاق الفكرى والابداعى الذى سببه هذا النظام الحاكم. فلماذا هذا التحامل والرفض الغير مبرر على الاستاذة الدكتورة/نوال زينب السعدوى.فكان يجب التعمق فى هذه الافكار الابداعية ومناقشتها بأسلوب متحضر كمافى دول العالم الآدمى.فهذا التحامل والسخرية المبتذلة فهى (وللأسف) دليل على سطحية العقلية والثقافة المصرية(فهل إقتران إسم الأم بالابناء حرام؟و...؟و...؟)أم هو تشريف للأم التى أعطتك(نصف)تكوينك الجينى وحملتك وأنجبتك وأرضعتك وقامت على رعايتك و..و.و...الخ.فهل هذا لا يعطيها الحق فى أن يقترن إسمهابإسمك.فهذا تشريف لك قبل أن يكون تشريف لها.وشكرا."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 14
subject = "مكنش اتعذر و لا كل جزر"
