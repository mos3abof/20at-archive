text = "وليه بقا الواحد يبقا اسمه اسم راجل بما اننا هنبدا فى تغير اسم الاب ونخليه اسم الام الاولى اننا نغير اسما الذكور وكلها تبقا ستات ف ستات اذا كانت وصل بيها قلة العقل والدين انها تنتكد تشريع رب السماء والارض انه تفكر فى تغير قيمة المواريث \" لِلذَّكَرِ مِثْلُ حَظِّ الأُنثَيَيْنِ \" النساء الاية 11 وصدق رسول الله صلى الله عليه وسلم النساء ناقصات عقل ودين ودى ولا عندها عقل والله اعلم بدنها"
