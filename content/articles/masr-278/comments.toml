posted = "2006-05-07"
text = "السلام عليكم<br />اول شي بدي أحكيلكم هايي شو قصتها هايي من كتر ما أكلت فول وكشري عششوا براسها (بدماغها) وبعدين هايي عمرها 77 سنة يعني ما عليها حرج بس بجد هادا كلامها هبل كتير وياريت زوجها مش عارف شو اسمو يضبها لانه عيب على شعراتو البي"
