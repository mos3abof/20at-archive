author = "الغريب"
posted = "2006-05-19"
text = "ياشباب.. الست نوال وراها جيش عرمرم.. الموضوع مش موضوع اهبل ولا حاجة.. دي بتنفذ توصيات مؤتمرات دولية تعقدها الأمم المتحدة تستهدف بها هدم الأسرة. في وثائق بتصدر عن هذه المؤتمرات، والأمم المتحدة بتمارس ضغوط على الدول علشان توقع الوثائق وفور التوقيع، تتحول الى قوانين ملزمة للشعوب الغلبانة، والضغط يتم اما بالتهديد بقطع المعونات، أو بإغداق المعونات والفلوس بالهبل على اللي يبيع ضميره وشرفه ويمشي في الزفة.<br />اضربلكو مثال.. الطنطنة اللي ماشية دلوقتي على موضوع الأيدز .. تفتكروا هم خايفين فعلا علينا؟ يعني لما يسيبونا نتقتل وننذبح في فلسطين والعراق وغيرها وغيرها.. حايخافوا اوي علينامن الموت من الإيدز؟ امال ايه الفزع ده ؟ الفزع ده علشان يقولوا لنا في الآخر: شفتوا .. علشان ما علمتوش الأطفال في المدارس ازاي يحموا نفسهم من الإيدز لما يعملوا العلاقات بتاعتهم، النتيجة انهم بيتصابوا بالايدز. لو تعرفوا اي حد في مدارس غربية اسألوه وحايقولكم الكلام ده بيتدرس في مدارسهم هناك للأطفال في سن 8 سنوات، والمطلوب انه يتدرس عندنا احنا كمان تحت عنوان \"الثقافة الجنسية\".<br />قلة الأدب اللي بتعملها الست الدكتورة ( واللي ناس كتير شككوا في الدكتوراه بتاعتها) هبة قطب .. الكلام البجح قليل الحياء اللي بتقوله في الفضائيات ده ماشي على نفس الخط .. نزع الحياء من المجتمع هو الهدف، وبعدين ياللا نعلم اولادنا ازاي يحموا نفسهم من الايدز .. مش اني اقولهم عيب وحرام .. لأ .. اعلمهم يستعملوا الأدوات اللازمة للحماية.<br />ادوني عقلكم علشان انا قربت افقد عقلي"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

