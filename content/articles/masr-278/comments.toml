[[comments]]
order = 81
subject = "حسبى ربى ونعم الوكيل"
author = "احمد بن محمود"
posted = "2006-10-22"
text = "والله انا مش عارف اقول ايه<br />بس انا حسيت ان من واجبى كمسلم انى اتكلم لان ده نوع من انواع الجهاد الحر بالكلمه ضدمحاولات هدم القيم والدين او حتى فتح باب المحاولات لتنفيذ المؤامره دى مش معقول طبعا الكلام اللى بيقول انها بتعمل كده لمجرد الشهره او الظهور على الساحه او حتى مرض لألأ المحاولات دى عامله زى العيار اذا ما صابش النهارده حايدوش وبكره حايصيب فعلا زادت همومى اوى ناس بتحارب الاسلام من خارج الاسلام ومن داخله وعلى فكره انا فخور اوى انى احمل اسم والدى وكمان فخور انى حاحمل اسم امى يوم القيامه لان ده تشريف يليق بالاموانا بتكلم على يوم القيامه لانى حتى على الاقل بحاول اعمله واعمل لارضاء الله وليس لهدم الدين<br />واحب اراهنكم ان يوم القيامه سوف تنادى نوال باسم نوال بنت الافعى بنت ابليسعليهم كلهم لعنه الله والملائكه والناس اجمعين<br />واخيرا ارجوا اننا نعرف الناس اللى زى نوال بيقولو ايه ونعرف الفكر المضاد للالحاد ده ونتطعم بيه ونعرفه الاسلام لانفسنا وللناس وخصوصا حقوق المرأه اللى ما خدتش حقها زى ما اعطاها الاسلام من حقوق واخار كلامى سلااااااموحسبى الله ونعم الوكيل"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 82
subject = "حسبى ربى ونعم الوكيل"
author = "احمد بن محمود"
posted = "2006-10-22"
text = "يالا يا شباب نكون مجموعه نتحد مع بعض وندرس الناس دى كويس ونكتشف حقيقتهم واغراضهم الحقيقيه وربنا يسهل فى الامكانيات ان شاء الله<br />احنا لازم نعمل كده لان اتباعه الالحاد والتخلف بقو كتير اوى ولازم الموجهه معاهم<br />كلمونى على الاميل ah_presedet1@hotmail.com<br />او رقم التليفون الخاص بيا<br />0020121681484<br />انا من مصر<br />وازهرى كمان وفوق كل ده بحب دينى واسلامى والمسلمين<br />يالا معايا وحسبنا الله ونعم الوكيل"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 83
subject = "الدين الاسلامى دين العزه و الكرامه للمرأه"
author = "غادة فتوح"
posted = "2006-11-04"
text = "السلام عليكم ورحمه الله و بركاته انا اقول ان نوال هى اسم امها ايه علشان نلقبها بيه هذه الكاتبه الله ينتقم منها و من امثالها لقد اعز الله المرأه بهذا الدين العظيم سوء عن طريق الامر بلحجاب او ان لا تخرج المراه من بيتها الا للضرورة فنحن نعرف ان التبرج و المناداه بلحريه هما سبب ضياع المراه جلب العار لاهلها فلقد كثرت الفتن فى هذا الزمن و الشباب لا تقدر على الزواج و البنت لما تخرج من غير حجبها تبقى عرضه للاغتصاب و المعكسات و لكن لما تخرج وضعا حجبها و نقبها لا يمكن ان تلفت نظر احد و هذه منه انعم الله بها علينا وهى هكذا تحارب الله و يارب يرحنا منها و من امثالها حسبنا الله و نعم الوكيل"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
