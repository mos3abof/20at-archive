[[comments]]
order = 55
subject = "الطيور على اشكالها"
author = "نظره حائره"
posted = "2006-05-16"
text = "للكائن الذى يتأسف أنه مصرى والله المفروض أن مصر هى التى تتأسف وتحزن كمان كون فسل زيك بيعيش على أرضهاأمابالنسبه لدفاعك عن أمنا الغوله فواضح انك شبها فالطيور على أشكلها تقع سبنالك يازينه الرجاله التعمق والتفسخ والتفكر والتعفن وبما أنك مولع قوى كده بأفكارها ما تأخده وتشفولكم داهيه تروحوا تبخوا أفكاركم السامه فيها الا بالمناسبه المحروسه أمك أسمها أيه علشان نناديك بيهايا دكر جاتكم البلاوى ملايتم البلد"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
