[[comments]]
order = 57
subject = "الديموقراطية لنا وحدنا"
author = "dogma"
posted = "2006-05-17"
text = "اذا كنا نسفه و نهاجم رأي بهذا الشكل لمجرد اختلافه معنا مع انه لا يضرنا في شيئ فكيف نطالب الحكومة بالديموقراطية و احترام رأينا بالمناسبة الاغلبية و صفت الدكتورة نوال بانها مجنونة و مختلة عقليا و انها تستنجد بالخارج وهي نفسها اتهامات النظام الحاكم لمعارضينه<br />لا اتفق مع الدكتورة نوال في دعوتها و لكن لن اسفه رأيها و ادعوها بالمجنونة فربما تكون على صواب و اكون على خطأ"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114546/http://masr.20at.com:80/article.php?sid=278&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

