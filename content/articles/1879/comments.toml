[[comments]]
order = 0
subject = "أنتو رجعتوا تاني"
author = "عباس فارس"
posted = "2005-12-08"
text = "كويس اننا نشوف حد ناشر خبر عن احمدي نجاد بالمعني ده في يوم كل وكلات الأنباء ناشره خبر تاني خالص عنه ( قال .. اذا كانت اوربا تشعر بالتعاطف مع اسرائيل بسبب نزابح النازي فعليهم نقل اسرائيل الي اوروبا ) هوه عنده حق طبعا بس مش ده الموضوع .... الغريبة ان عشرينات هاتجنني ..احيانا باحس انها بره من الموضوع من اساسه واحيانا باحس انها قاريه الموضوع صح .<br />حمد الله علي السلامة<br />والف مبروك علي التصميم الجديد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154340/http://www.20at.com/article2.php?sid=46"

