order = 0
subject = "(عبير صبري) ست الستات"
author = "على رأيك يا دعاء ..عبير صبري غبية وصوتها عالى علىالفاضي..و الحوار كان سيء سيءسيء.."
posted = "2006-07-31"
text = "الاسماء اللي كانت حاضرة كفيلة انها تقدم حلقة هايلة<br />لكن المشكلة في الاعداد الغبي رغم انهاو التقديم الاغبى من عبير صبري ..<br />عبير لا تصلح الا لبرامج ست الستات مع الداكتوووورة هالة سرحان<br />لكن متقدرش اصلا تدير حوار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132905/http://www.20at.com/article2.php?sid=1112"

[[comments]]
order = 1
subject = "لبنانيه مغتربة"
author = "لينا عبود"
posted = "2006-07-31"
text = "مقال رائع ..<br />والوضع مزري<br />ولا حول لنا ولا قوة الا ان نتابع تهافت صغار العقول وبعض من المنتجين الذين لا يرون ابعد من انوفهم في التقديم والعرض<br />اما عن ثقافة المقاومه<br />فكيف لقناة - كما قلت - ترفع شعار السياسه بالدين والعكس ان ترينا بشكل ايجابي ولو واحد على عشره من ثقافة المقاومه<br />في ظل الوضع القائم فإن حتى حكامنا باتوا متقلبين كلعبة اليويو متأرجحين<br />فتارة نجدهم يصفون معركة المقاومه بمغامره خاليه من العقل وساذجه وتارة اخرى يرسلون لنا المستشفيات الميدانيه المتنقله<br />وتارة يقولون انهم لن يتحملو النتائج وتجدهم يتبرعون ب 2 ونص مليار دولار بهدوء شديد<br />براي ان الشخصيات المدعوه قادره على التحاور في ما يخص عموميات الموقف وخيرا لها لو انها اختارات ضيوف يمتون للحدث بصله<br />كسفير لبنان في مصر مثلا<br />او استضافت هاتفيا احد ممثلي المقاومه او على الاقل احد المهجرين النازحين<br />او انها كرست الحلقه لسماع النداء العربي من خارج حدود عقلها كمذيعه سعيده بارتداء الحجاب ولا تزال تردد سبحان الله ومشاء الله وكأننا لا نعرف ان نقولها<br />ختاما<br />للحلقه هدفين او ثلاثه<br />اولها الظهور الاعلامي لقناة الرساله على انها مواكبه لاحداث الواقع ولكنها بدبلوماسية ساذجه حاولت ان لا تكون مع او ضد فتقف على الحياد في موقف لا تحتمل فيه الكرامه العربيه الحياد<br />ثانيهما<br />ظنت عبير انها قادره على اداره هكذا حوار يتطلب الماما بالابعاد الاستراتيجيه والثقافه الحزبيه للمقاومه والمؤثرات ففشلت بسبب سوء التحضير .. او انها لم تذاكر الدرس جيدا وبقيت هي الاخرى على الحياد<br />ثالثا هناك رساله مبطنه بين السطور عندما نجمع التبرعات ونكثف الدعاء لابناء قانا وشهدائها دون ان نقول كلمة دعم للمقاومه فالمغزى واضح.. انهم مع لبنان ولكن ليسوا مع المقاومه<br />التي رفعت راس العرب<br />وادارت ظهرها لجبروت امريكا واسرائيل<br />دعاء<br />تسلسل رائع واعذريني على الاطاله<br />فمن قلب وجعي على وطني وبلدي الذي لا غنى عنه<br />ومن بلد اغترابي .. اتيت بكل ما في خاطري<br />دمتي بعافيه<br />لينا عبود"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132905/http://www.20at.com/article2.php?sid=1112"

[[comments]]
order = 2
subject = "خوف العرب أزلي"
author = "لوسيلولو"
posted = "2006-08-01"
text = "للاسف الشديد لقد نجحت إسرائيل في إيهام العرب أنها قوة عظمى لا تقهر وانهم لو قاوموا اوفكروا في المقاومة سوف تحل عليهم لعنة إسرائيل الكبرى.أما بالنسبة للمثلة عبير صبري فإنها لم تتغير اللهم إلا أنها غطت شعرها وهي فعلا ذات أسلوب سيْْء وكثيرة الضحك والتهجم بصوت عالي.أتمنى لو أنها تقلل من مكياجها وضحكها وتخفض صوتها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132905/http://www.20at.com/article2.php?sid=1112"

