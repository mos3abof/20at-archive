[[comments]]
order = 5
subject = "الاعلام العربي والهزيمة النفسية"
author = "طارق"
posted = "2006-08-01"
text = "لقد اصيبت القنوات الفضائية العربية بالهزيمة النفسية أو لم يتعودو من قبل على معنى الانتصار، فلم ولن يشعرو بانتصار المقاومةالاسلامية في جنوب لبنان، تخيل معي احد مذيعي الجزيرة يسأل أحد المراسلين في جنوب لبنان ويقول له \"هل مازالت مارون الراس مستعصية على اسرائيل؟\" استفذني تعبير المذيع وفكرتن في بديل لما يقول ووجدت تعبير اكثر تحيزا ونصرا للمقاومة الا هو \"لا تزال المقامة في مارون الراس صامدة امام العدوان الصهيوني\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132905/http://www.20at.com/article2.php?sid=1112"

[[comments]]
order = 6
subject = "طب خلاص خلاص خلاص خلاص \" خلاويص\""
author = "هوووووووبه"
posted = "2006-08-01"
text = "حاجه غم فعلا, كل مين هب ودب يعمل برنامج ويعملي فيها مناصر للقضيه<br />عايزه الحق يا حاجه انا بتفرج علي عبير صبري \" اسم غالي\" للسبب بسيط احب اشوف<br />هي لابسه ايه وهدومها ايه , والله<br />انا افتكرت دا فيه لوحدي لما شفت ناس تانيه اتفرجت عليها كانت بتعلق فقط علي هدومهاوبس ....<br />معنديش القناه لاسف , بس من بعيد كدا , هي مش كانت شغاله في اقرأ يعني لو ليها جمهور في اقرا عايزه تجيبه وراها القناه الجديده بصرف النظر عن محتوي الظرف \" معرفش يعني ايه \"<br />اه الست هانم اللي بتخش باسم نورا لمي نفسك بدل ما اضربك<br />وخلاص يا جدعااااااااااان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132905/http://www.20at.com/article2.php?sid=1112"

[[comments]]
order = 7
subject = "وجه بلاستيكي"
author = "الدين لله والسلطة للشرطة والقهر للجميع"
posted = "2006-08-01"
text = "الحقيقة انالم اكمل الحلقة واكتفيت منها بخمسة دقائق كانت كافية جداً لرفع ضغط الدم عندي لمقاييس عالمية ربما تتجاوز مقاييس النفط الذي عجزنا عن استخدامه كسلاح ندفع به الحرب عن شعبناالعربي في لبنان وفلسطين.<br />اصابني ضغط الدم من كثرة التعبيرات البلاستيكية التي ارتسمت على وجه الفنانة عبير صبري - التي لا اعلم حتى الآن لماذا اعتزلت وما هو مفهومها عنه وعن الإلتزام عموماً؟ وكأن الحديث في الحلقة كان يدور حول مماطلة البرتغال في الجلاء عن جزر المكاو الصينية لا عن شعب عربي مسلم كثيراً ما قصدته السيدة عبير لتسجيل مشاهد تمثيلية كفيلم \"الكافير\" الذي يعد علامة في وجه السينما المصرية استلزمت 8 غرز<br />واتمنى من السادة علماءالرقابة الشرعية بالسعودية أن يمنعوا مثل تلك العينة من المذيعين والمنتجين المنفذين بدلاً من ان يمنعوا برنامج ايمان البحر درويش واغاني سامي يوسف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132905/http://www.20at.com/article2.php?sid=1112"

[[comments]]
order = 8
subject = "على ست عبير"
author = "فارس فلسطيني"
posted = "2006-08-01"
text = "ياست صبرين ان من فلسطين وشعب لبنا اهلي اما انتي يلي بتحكي ما بتعرفي المقاومة بكره بس تدخل اسرئيل على مصر وتدعس على كرمتيك وعلى شرف مصر بتصري تحكي وين المقاومة بعديها ماحد راح يسمعكومهو انتو مش فاضين في الرقص والاغنه مش زي الي في فلسطين ولبنان كل يوم بشوف الدم وقتل والدمار اما انا بتمنه من الله انو انتي اتشوفي الي انا كتبته ولو انتي بتحسي بتعرفي انو هادا الاكلام من واحد مقهور واحنا ما بدنا من مصرولا شي خليكو ارقصو وغنو لحد ما انشوف اسرئيل لوين بدها اتوصل انتي ست صبرين يا ريت لو ما تلبسي منديل علشان انتي ما بتنعدي من المسلمين وانشالله اشوف ذليله علشان تعرفي انو المقاومه حق علينا وعلى كل عربي وانا بقول لبيك يا حزب الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132905/http://www.20at.com/article2.php?sid=1112"

[[comments]]
order = 9
subject = "انه ابداع"
author = "نجم الدين ظافر"
posted = "2006-08-21"
text = "قرأت كل التعليقات واري انها غير منصفه او انها متحامله علي النجمه والاعلاميه عبير صبري. الحدث في لبنان كبير وجلل والقتل والدمار لايتخيله عقل بشر. والاعلاميه عبير صبري في تجربتها الجديده - اقصد حوارها المثقفين - غطت معظم المحاور المفروض ان تناقش . وانا من شدة اعجابي بالحلقات شاركت بالاتصال في حلقتين. وبداية الالف خطوه خطوه انها تستحق التقدير فهي اعلامية شامله تكتب في الصحف وتمثل وتقدم برامج خاصه بها وتشارك في برنامج د.هاله سرحان . وفقها الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132905/http://www.20at.com/article2.php?sid=1112"

[[comments]]
order = 10
subject = "قبل أن تحين الساعه"
author = "بهاء الدين"
posted = "2006-10-11"
text = "عبير لا تصلح إلا لتقديم برامج الخنوع والخشوع لغير الله عز وجل وتنسي ان من تهابهم وتدعو لمهادنتهم هم أعداء الله ورسوله حتي يتسني لها ان تغوص في عرض الدنيا ثم تتسول الي الخالق جل وعلا ،بالدعاء ، أي تبجح هذا، دماء المقاومه الطاهره<br />ستظل، لكرامتنا التي تهدر علي أيديكم قبل عدونا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132905/http://www.20at.com/article2.php?sid=1112"
