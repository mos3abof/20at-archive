posted = "2006-08-01"
text = "انا نفس اعرف ايش اهمية هذا التقرير، والله نصير نتابع برامج فضائيات مختلفة ونصير نعمل عليها تقارير.<br />اين الفكرة في التقرير. الظاهر انكم يا عشرينات لم تعودوا تقيسون الاموؤ كما يجب."
archived = "2006-11-02"
