text = "عادي جدا موضوع الرز بلبن ده<br />لما شجرة الدر اتقتلت رميا بالقباقيب عملت ام علي زوجة عز الدين ايبك اكلة جميلة ووزعتها على المصريين بمناسبة وفاة المغفور لها شجرة الدر<br />و انا ادعوا كل المصريين الى اكل ام علي يوم وفاة السيد الرئيس اطال الله في عمره و جعلها مناسبة قومية و ان يعرض التلفزيون في هذا اليوم من كل عام فيلم ابو علي و شورت و فانلة و كاب و شراب و شبشب"
