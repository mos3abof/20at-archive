[[comments]]
order = 11
subject = "انتوا مش عارفين مصلحتكم"
author = "سوسة المفروسة"
posted = "2006-03-14"
text = "لما بابا حسني يتكل(وبقول لما مش لو)لازم كلنا نتقبل الموضوع بايمان عميق فيجب الا نفزع و لانجزع فمن اهم صفات الاب ان يترك من وراءه من يعتني بابناؤه ...وهكذا هنتدحرج من يد بابا سونا لحجر ابيه جيمي ...ارى الكثير من علامات الاعتراض و القرف على وجوهكم و لكني اقولها لكم بكل صراحة :انتوا مش عارفيين مصلحتكوا فهناك الكثير من المكاسب التي تصب في المجارى(قصدي في مصلحة البلد) من جراء هذا الاجراء المبارك(واخد بالك من المبارك دي) و من هذه الفوائد:<br />1- توفير ميزانية وزارة الاعلام حيث لن تكون هناك حاجة لتاليف و تلحين اغاني و اوبريتات جديدة عشان ده مبارك ودوكها الدلعدي مبارك برضه<br />2-يمكن اختصار ميزانية ملابس و البدل الخاصة برئيس الدولة حيث ان ميراث جيمي من البدل(بعد القسمة بينه و بين اخوه)يمكن تاييفه على مقاسه و بهذا التوفير يمكن اقامة 3 مدارس و مستوصفين و 14 نايت كلوب من اجل مصلحة البلد العليا<br />3-جيمي ايده في اللعبه من زمان يعني يقدر يعرف كويس اسلوب سرقة(قصدي ادارة ادارة) القطاعات المختلفة دون ان يخل بالتوازن الدائم و الخالد في ميزانية مصر المحروسة المحروسة منذ عهد جدكم تحتمس السابع و حتى اخوكم بطرس الرابع<br />4-الزواج الميمون القادم في الافق يضمن للبلاد الازدهار الدائم و بتساهيل ربنا سياتي المولود الجديد ليضمن للبلد تولى الجيل الثالث من ابناء مبارك و الجيل الرابع من ابناء المنوفية ..والكل يعرف ان مصر تابى الا ان يحكمها المنوفيون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112906/http://www.20at.com/article2.php?sid=392"

