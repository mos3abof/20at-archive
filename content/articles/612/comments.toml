[[comments]]
order = 1
subject = "اذا مات مبارك فكلنا جمال مبارك"
author = "عبد الرحمن جادو"
posted = "2006-02-06"
text = "اذا مات مبارك فكلنا جمال مبارك ؛ سر على درب ابيك ؛ لقد رشحناك واخترناك والشعب وراك والله يرعاك ؛ امك فى عنينا من جوه واخوك وابنه هنشيلهم على راسنا ده احنا ياما ابوك ورانا ايام كانت كلها قرع بس مكنش عسلى ؛ يا جمال يا جمال انت خيرة الرجال .<br />طبعا دى هتافات من شوية عيال بلطجية ( بيمثلوا ارادة شعبية ) كل واحد فيهم واخدله سنكوتش جبنة فلامنك وسنكوتش فرايديز ومخه اتلحس لما حبس ببيبسى كانز اللى كانت منتهى علاقته بيها انه بيحط فيها كلة عشان الليل واخره .<br />الحقيقة واهم من يظن ان تغيير الانظمة متوقف على موت مبارك او ان العقبة فى مبارك كشخص رغم ان ده نسبيا صحيح لكن من سيأتى الا يعلم انه سيحكم شعب سلبى تحمل غلظة ووطأة حكم مبارك ولم يتفوه ب لا ولم ينتفض رافضا حتى ما يمس لقمة عيشه !!!<br />موت مبارك سيسعدنا جميعا بدرجات متفاوته وستختلف طرق التعبير عن هذه السعادة التى سيخالطها خوف وترقب ربما سيؤديان الى افساد هذا الشعور .<br />لاتتعجبوا ان مات مبارك ورأيتم بعضا من الشعب يبكى او يتعاطف او ينهر شخصا سعيدا بموته فاتذكر ايام ما تعرض مبارك لحادثة اديس بابا وكنت ايامها عيل بلعب فى الرمل وبحطه فى افه اصحابى رأيت بعض الناس قد هالهم الامر واحزنهم ورأيتهم يهرولون بعضهم يهنىء زوجته وبعضهم يضع يده على قلبه يريد الا يسمع تكذيبا او تصريحا مطمئنا يخيب اماله فى التخلص من هذا الطاغية يومها اختلطت على المشاعر وزاد اختلاط هذه المشاعر وقتما رأيت شيخنا الشعراوى وشيخنا الغزالى مع مبارك بعد نجاته يومها تعجبت فاستوضحت والدى كيف يفعلان ذلك ويقفون بجانب رجل رأيت كثيرين يدعون عليه ويتمنون موته ويبشرون الاصدقاء والاهل بوفاته فلم يجبنى أبى فباغته بسؤال صدمه قلت له هو مبارك مسلم ولا كافر ؟ فرد والدى اكرمه الله وقال : مسلم عاصى مثله مثل مسيلمة الكذاب لكن الرد لم يكفينى ولم يشبع فضولى وظللت كثيرا اوجه سؤالى لاساتذتى ورغم تباين الاجابات فضلا عن تهرب البعض من الاجابة قال لى مدرس الفقه اكرمه الله واعزه : مبارك مسلم لكن ضرره اشد من الكافر وظل يشرح لى ما يقصد فكانت اجابته شافية كافية .<br />الشاهد من كلامى انه عندما لا نكون نحن كشعوب مصدر القوة والمحاكمة والمحاسبة فستتبدل الكراسى يذهب مبارك الى الجحيم ويأتى ابنه ليعيشنا فى جحيم ؛ وعلى رأى المثل الخلف تلف وجمال خسارة ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112906/http://www.20at.com/article2.php?sid=392"

