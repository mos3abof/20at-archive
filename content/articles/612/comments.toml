subject = "ده كلام"
author = "احمد شوشه"
posted = "2006-02-06"
text = "ايه يجماعة الموضوع الزفت ده انتوا كده بتهرجوا .<br />انا اتولدت سنة 80 يعنى اتربيت على اخترناك اخترناك والضربة الجوية الاولى .<br />ولما كبرت شوية عرفت يعنى ايه قمع ويعنى ايه فساد واستغلال نفوذ وغياب القانون .<br />مش آدر اتخيل يجماعة ان الرئيس ممكن يموت<br />وبعدين واحد صاحبى قالى مرة افرض جالنا اللى أسوأ منه قلتله ده شىء مستحيل الحدوث قالى افرض ربك قادر على كل شىء وزى مخلق ده قادر يخلق اللى اسوأ منه قلتله ونعم بالله واعدت افكر مش محتاج احلفلكم انى حشت دموعى بالعافية من مجرد الفكرة يخوانا الواحد لو مكنش مؤمن ميه الميه كان قال هو الموديل الجامد ده من الرويسا مبيمتوش.<br />يخوانا سكوا على السيرة ومتقلبوش على الواحد المواجع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112906/http://www.20at.com/article2.php?sid=392"

