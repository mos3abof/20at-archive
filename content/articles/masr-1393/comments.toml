text = "لمايكون القاضى شبعان وابن ناس وبيحب بلده ممكن يعمل كل حاجةويا ريت فعلا ياابن بهية نكون رجالة ونقف وقفة رجالة<br />اما بخصوص السبكى فدا هوجة وحتعدى<br />والناس تنسى"
