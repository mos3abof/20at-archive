[[comments]]
order = 2
subject = "نسيتى حاجات مهمه"
author = "ايمن امام"
posted = "2007-01-02"
text = "كل سنه وانتى طيبه/ نسيتى التعليق اللى بيقول/ ياحكومه يابنت الايه كيلو البصل باربعه جنيه/وياتوربينى كفايه عليك تحط روقه بين رجليك/وشعار# ان لم تستحى فانضم للحزب الوطنى /واغنيه# بيع وطنك بيع دينك شوف الشارى مين - مين بعدك يورث حكمك ويضيع ملايين- بوش اللى حماه وشارون اتبناه- يامعلم ياحبيبنا نهديك بفته جبنا-تعملها اعلام- وفستان للمدام - يابو 99% - ياغالب النبى فى النسبه المئويه- يارافع شعارالدين للاشرار- الهى يرزقك بقاضى كردى- امين/ ايمن امام"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103241/http://masr.20at.com:80/article.php?sid=1393"
