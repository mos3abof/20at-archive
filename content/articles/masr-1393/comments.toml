[[comments]]
order = 0
subject = "طيب ليه ؟ إيش جاب لجاب ؟؟؟"
author = "إبن بهيه"
posted = "2007-01-02"
text = "شكرا على الصور الحلوه دي للقضاه المحترمين .. مش العك بتاع الواطي وإبنه في الصفحه اللي فاتت ...<br />بس عندي اعتراض بسيط أوي على العنوان .. رجال على لافتات .. طيب القضاه وقلنا معاكوا حق وكل الحق كمان دول رجاله من ضهر رجاله ووقفوا وقفة رجاله ..<br />إنما فيه اسماء مسكوك فيها خالص لامؤاخذه يعني .. إيه لازمة فاروق حسني والبكشنجي السبكي في موضوع يخص الرجاله ؟؟؟<br />مجرد استفسار بسيط بس مش أكتر ..<br />كل سنه وكلنا أحسن من كده .. وكلنا رجاله ونقف وقفة رجاله ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103241/http://masr.20at.com:80/article.php?sid=1393"

