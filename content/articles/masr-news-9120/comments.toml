text = "مليون طن قمح هدية من شعب الامارات الى مصر<br />أعلنت الإمارات العربية أنها ستقدم نحو مليون طن من القمح هدية لجمهورية مصر، التي تعاني أزمة خانقة في تراجع المعروض من الخبز وارتفاع أسعار المواد الغذائية الأساسية.وقالت وكالة أنباء الإمارات الرسمية إن الرئيس الإماراتي الشيخ خليفة بن زايد آل نهيان \"أمر بشراء مليون طن من القمح وتقديمه هدية للشعب المصري الشقيق.\"<br />وتابعت الوكالة \"تأتي هذه الهدية مساهمة في تخفيف الأعباء المعيشية عن الشعب المصري الشقيق الناتجة عن ارتفاع أسعار القمح في الأسواق العالمية.\"<br />ويعد الخبز بالنسبة للمصريين أساس الوجبات الثلاث.<br />وكان الارتفاع الأخير في الأسعار حرك المياه الراكدة بالنسبة للفقراء الذين خرجوا انتقدوا بشدة عدم توفر الرغيف بالسعر المناسب ويستفيد فقراء مصر من الخبز المدعوم الذي توفره مخابز على صلة بالحكومة بأسعار تقل 10 أو 12 مرة عن أسعار السوق، لكن الأزمة استفحلت مؤخراَ مع تراجع مخزون الطحين في تلك المخابز وتقلص قدرتها بالتالي على تلبية الحاجات المتزايدة.<br />ونتيجة لما يحصل، يقف المصريون في طوابير طويلة للحصول على خبزهم اليومي من أفران حكومية.<br />والشهر الماضي، سقط بعض القتلى خلال الانتظار في الطوابير، حيث طعن شخصان، وقضى خمسة جراء الإرهاق.<br />وفي ظل هذه الأزمة، طلبت الحكومة من الجيش، الذي يعد عادة الخبز للموظفين، بزيادة الإنتاج لتلبية حاجة عموم المواطنين، وقد قام الجيش بالفعل ببناء 10 أفران كبيرة في القاهرة، كما افتتح 500 كشك لبيع الخبز في الشوارع.<br />يذكر أن مصر تؤمن 50 في المائة من القمح الذي تحتاجه سنوياً من السوق الدولية، بينما تزرع الكمية الباقية."
