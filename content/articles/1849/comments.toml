[[comments]]
order = 0
subject = "ايييييييييييييييييييييييييييييييييييه والله زمان"
author = "الله العظيم كانت احلى ايام"
text = "واللى يرجعنى تانى ابوس ايديه<br />كفاية النظام اللى بنفتقده فى الملكية<br />الكلام فى الجيش كلمة وكلمة<br />مافيش مناهدة زى الملكية\"المدنية يعنى\"<br />يعنى تسمع مرة واحدة وتقول مرة واحدة ويبقى علم وجارى التنفيذ<br />مافيش محايلة<br />بصراحة لو الميرى تم تطبيقه على الملكية\"اللى هى زى ما قلنا المدنية\"<br />هايتصلح حال البلد جدا<br />الله يجازيكم ليه تفكرونا بأيام يا رب تعود بتعبها وقرفها وصحبتها الحلوة<br />ومش هاكون كداب لو قلت بجزاءاتها وحبسها<br />يالا السلام عليكم بقى<br />رقيب مجند مؤهلات سابقا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154045/http://www.20at.com/article.php?sid=1554"

[[comments]]
order = 1
subject = "الى الأخ اللى فوق"
author = "لأخ اللى فوق بيقول أيام ماتتنسيش"
text = "يبدو إنه كان بيشتغل سيكا ( يعنى تخصص غسل وكنس عند القائد)<br />هى فعلا أيام ماتتنسيش لأنها أيام سودة السجن فى المعتقل أرحم منها<br />كنت داخل الجيش فاكر أنه شرف ودى خدمه للوطن<br />بعد ما شفت الذل وأتشتمت فبه واتهانت كرامتى<br />بقيت بكره البلد دى بجد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154045/http://www.20at.com/article.php?sid=1554"

[[comments]]
order = 2
subject = "الى الاخ والله زمان"
author = "ظهر كده والله اعلم أن الميرى بيجرى فى دمه"
text = "ومش قادر يستغنى عنه<br />يبدو أن الجيش كان له متوى يعنى مآوى<br />ذى ماهو متوى لناس كتير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154045/http://www.20at.com/article.php?sid=1554"

[[comments]]
order = 3
subject = "وأنا فى الجيش"
author = "صراحة ياجماعة فى مشكلة قابلتها فى الجيش ويجب أن تتخلص منها القوات المسلحه"
text = "أنتو عارفين هى أيه ؟؟؟؟؟؟<br />مشكله الشذوذ عند الشاويشيه<br />مرة قابلت شاويش كان هايبوس رجلى و انا رفضت<br />دة غير اللى سمعته من الزملاء عن شاويشيه كتير بنفس النظام<br />يجب تطهير القوات المسلحه من هؤلاء العفانه<br />علشان ميبوظوش العساكر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154045/http://www.20at.com/article.php?sid=1554"

[[comments]]
order = 4
subject = "جيش اية ونيلة اية ."
author = "لجيش زمان كان الواحد يتعلم الجلد والصبر وتحمل المسؤلية وغيرها من أمور إيجابية ولكن الأيام دى الجيش كوسة وممكن بأربع الالاف جنية تاخد الإعفاء وإنتا فى بيتك ."
text = "بس سبحان الله فية كمية قلة أدب وعدم إحترام لإى إنسان مهما كان وشتائم وتهزيق ووساخة تلاقى حتت عسكرى ( برص ) بيتكلم بإسلوب فى منتهى الوطيان والسفالة .<br />حصلت معايا أنا شخصيا جية حتت عسكرى بتاع 2 ميجا كدة مالوش أى لزمة فى الوجود ولنكتة واقعة وحالتة نيلة جية يقولى إنتا يا إبنى (إبنك ) !!! حط ورقك تحت رجليك ودوس علية طبعا أنا إتخانقت وكلمتة بكل إحترام وقولتلة أنا إسمى عبدالله وصعب أحط ورقى على الأرض علشان إسم ربنا قالى أنا بقولك حط الورق تحت رجليك الإتنين كمان .. طبعا رفضت فما كان كمة الا ان شتمنى بأمى المريضة طبعا أنا كونى عصبى فكلتة كام ألم إنما اية عسل وقولتلة يا حتت خارية أنا كذا و كذا وكذا (ليا ضهر يعنى ) وخد عشر أيام حبس طبعا صعب عليا جدا فطلبت من القائد أن يسامحة وتكلمت معة برفق وقولتلة متزعلش . دة كان ايام مكنت بقدم ورقى من فترة بس الحمدلله خدت إعفاء علشان نظرى ضاااايع .<br />عبدالله فرج"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154045/http://www.20at.com/article.php?sid=1554"

[[comments]]
order = 5
subject = "آة ياجيش"
author = "اللى كان مضايقنى أوى فى الجيش"
text = "يقوللك أيه ياعسكرى دة انتا لسه مستجد ياعسكرى<br />ياعسكرى دة أنت الأكل الملكى لسه فى بطنك يعنى أكل البيت لسه مجاش مكانه أكل الجيش المعفن فى بطنك<br />يعنى الأكل اللى أنت كلته فى البيت لسه مانزلش بالعربى وخلى بالك من ياعسكرى دى وهو بيقولها تحس أنها سبه أوعار أنك عسكرى<br />ويظل هذا العسكرى المستجد المسكين يرزخ تحت وطأة العساكر القدامى<br />ألى أن تنكشف عنه الكربه وتخرج دفعه وتأتى دفعه أحدث منه وينال شرف الأقدميه البلهاء فى هذا المرستان المسمى بالجيش<br />وتقولى جيش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154045/http://www.20at.com/article.php?sid=1554"

[[comments]]
order = 6
subject = "الأيام السودة"
author = "نا مؤهل عالى دخلت الجيش لمدة سنه أما المؤهلات المتوسطه سنتين والعادة 3 سنوات"
text = "عندما يدخل المؤهل العالى الجيش يجد نفسه مستجد وملوش أقدميه أما العادة اللى ساقط ابتدائيه ولااعداديه بيكون اقدم منك ومعنى الأقدميه هنا أنه ممكن يكدرك ويزحفك ويرقدك ويمسح بكرامتك الأرض تخيل حضرتك ساقط اعداديه يعمل فييك كدة وانت ابوك صرف عليك دم قلبه فى تعليمك 16 سنه<br />والآخر الجيش يجيب لك ساقط اعداديه يهزك بالذمه ده معقول ؟؟؟؟؟؟؟؟<br />طبعا معقول فى مصر اللى ماعندهاش احترام لأبنائها<br />المفروض ياسادة المؤهلات العليا يبقى ليهاأقدميه مش علشان عيل بشخه دخل قبلك الجيش يبهدلك بالمنظر ده ..طبعا بشخه لأنه أصغر منك فى السن<br />دا مفيش أحترام للسن فى الجيش<br />يبقى هيبقى فى أحترام للمتعلم<br />وسلملى على الجيش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154045/http://www.20at.com/article.php?sid=1554"

[[comments]]
order = 7
subject = "الأخ اللى فوق"
author = "لراجل اللى فوق كلامه مظبوط المفروض يبقى فيه أقدميه للمؤهلات العليا مش تبهدله وتهين كرامته علشان الأقدميه وخرة"
text = "ماهو مش معقول تدخله ضابط احتياطى وفى نفس الوقت تدخله عسكرى مستجد أقل من اللى ساقط اعداديه<br />ده كلام ياجيش<br />تهين ولاد الناس كدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154045/http://www.20at.com/article.php?sid=1554"

[[comments]]
order = 8
subject = "سلمولي علي الترماي قصدي الجيش"
author = "ي الحقيقة الواحد قبل الجيش كان بيحب البلد دي قوي ولكن بعد الجيش تقدر تقول انه بقي يكرهها قوي"
text = "لدرجة اننا كنا بنتمني انه تحصل حرب في اثناء خدمتنا مش عشان نقتل العدو ولكن عشان اول ما نقتل نقتل القاده بتوعنا الكبار قبل الصغيرين .!!!!!!<br />طبعا مش مصدقيني<br />والله العظيم انا لو حكيت عن سنة الجيش ما يكفيني ولا مليون صفحةّّ!!!!!<br />انا مش عارف ازاي السكوت علي هذه المهزله ويقولوا الجندية شرف ؟؟؟<br />ومتهيألي جيل من العساكر اللي بيهدروا كرامته مش هايقدر انه يحافظ علي كرامة البلد طب ازاي قولولي حد عاقل يرد عليا ويقولي ازاي نقدر نحارب بجيل فقد ادمييته علي باب التجنيد ؟؟؟<br />صدقوني والله انا خارج من الجيش منذ 10 سنوات ولا زال بيجيلي كوابيس عن اللي اسمه جيش ده لدرجة ان الواحد كان بيتمني انه يموت في الجيش حتي لو كان فاضله ايام ويخلص . بس احسن حاجة في الجيش ان الواحد بيتعامل مع جميع انواع البشر عشان ياخد مناعة ضد البشر اللي مش ولا بد يعني واخيرا اطيب التحايا للجميع واتمني لكم وقتا ممتعا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154045/http://www.20at.com/article.php?sid=1554"

[[comments]]
order = 9
subject = "الجيش والطفاسه"
author = "يضا لقد تعلمت الطفاسه فى الجيش من الجوع وقلت الأكل تصو ر نقعد طول النهار من غير تعيين يعن ى أكل تخيل ليه ؟؟؟؟؟؟؟؟"
text = "لأن الشاويشيه والظباط كان بيكلوهه وسيبونا جواعه طول النهار<br />لدرجت أن أنا كنت أنزل جازة آكل بشراهة وأمى تقولى أنت مفجوعه<br />أقولها الجوع ........الجوع ....... بيجوعونا<br />وحسبنا الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154045/http://www.20at.com/article.php?sid=1554"

[[comments]]
order = 10
subject = "المعتقل أرحم"
author = "goshabab"
text = "ضيت سنه فى الجيش لو كنت قضيتها فى المعتقل كان ارحم<br />شوفت الرعب على أصوله والجوع على أصوله والشتيمه على أصولها ولو اتكلمت ودافعت عن نفسك اعرف انهم هيصتقصدوك لغاية ماتفقد وتعيد مدة الخدمة من جديد<br />يبقى الأحسن تسمع شتيمتك وتسكت ومنها ياحمار ياابن الحمار يا *** يا *** يا *** وغيرة<br />أقول كمان ووووووووولا كفايه كدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154045/http://www.20at.com/article.php?sid=1554"
