subject = ""
author = "عندى ولن اذهب"
posted = "2010-01-31"
text = "لن اذهب الى اى انتخابات متفبركة ومعدة النتائج سلفا بواسطة الامن<br />لا اريد ان اكون بالمعنى البلدى معرص<br />المرشحون فى دائرتى حسب اعلاناتهم من الان فى مواقف الميكروباص وفى الميادين اتنين مرشحون عن العمال والفلاحون اللى هم 50 % من الاعضاء<br />واحد لواء اركان حرب فى الجيش يعلق يافطات تهنئة بالعيد والجو الربيع<br />والتانى عميد برضة فى الجيش مرشح عن العمال وبيوزع نتائج السنة الجديدة وعليها صورتة بالبدلة الميرى والشريط الاحمر<br />هننتخب اية<br />دول رجالة الحزب الوطنى<br />بتوع كلة تمام يا افندم وكلنا فداء مصر - ومصر الحبيبة واكلك من اين يا بطة<br />مش رايح اى انتخابات"
archived = "2010-02-01"
capture_url = "https://web.archive.org/web/20100201030256/http://www.20at.com:80/masr/hot-topics/15118-2010-01-31-03-16-10.html"

