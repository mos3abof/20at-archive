author = "مش ححبك"
posted = "2010-02-05"
text = "ما عنديش بطاقة ومش حطلع بطاقه ومش وعمري ما انتخبت حد ولا حتى انتخابات الرئاسه<br />لان كلها ضحك على الدقون<br />وعيب اوي لما الحكومة تضحك على الشعب وتعمل انتخابات وهي اصلا بتعمل اللي هي عيزاه<br />يعني جمال عبدالناصر جه بانقلاب عسكري هو وشوية المجرمين بتوعه يبقى لزمته ايه انتخابات<br />وقبل ما يموت جاب السادات عمله ولي عهد يبقى لزمته ايه الانتخابات<br />وفضل السادات شغال في عمليات النصب دي<br />ومن وراءه مبارك<br />يبقى لزمته ايه<br />حتى العيال بتوع مجلس الشعب دول شوية عيال نصابه وحراميه كلهم الا من رحم ربي<br />ما يهمهمش الا مصلحتهم الشخصية وبس<br />وكونهم اعضاء في مجلس الشعب دا بيعتبروه مجد شخصي ليهم وحتى عاملين مواقع لانفسهم على النت<br />يبقى لزمته ايه تضييع فلوس الشعب زي ما كل لعيب اخد مليون جنيه من فلوس الشعب<br />بدل ما تضيعوا فلوس الشعب على الانتخابات وتفرضوا عليه ضرائب باهظة علشان خاطر الانتخابات ولعيبة الكوره ادعموا الشعب افضل<br />جتجم نيله"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309071822/http://www.20at.com:80/masr/hot-topics/15118-2010-01-31-03-16-10.html"
