[[comments]]
order = 0
subject = "لما تترجموا ترتبوا"
text = "بأه يا مؤمنة تجيبي ذكر الله بعد الموسيقى والبخور والملح كمان!!"
archived = "2004-07-03"
capture_url = "https://web.archive.org/web/20040703000049/http://www.20at.com:80/article.php?sid=405"

[[comments]]
order = 1
subject = "صحيح"
text = "انت كان احسنلك يا تكتبيه في الأول يا في الآخر خالص كحير ختام.. بس كده مش تمام"
archived = "2004-07-03"
capture_url = "https://web.archive.org/web/20040703000049/http://www.20at.com:80/article.php?sid=405"

[[comments]]
order = 2
subject = "نادر"
text = "اكيد الموضوع مش مترجم كده، لان مفتكرش ان المصدر الاجنبي استدل بالقرأن الكريم..لذلك اعتقد ان الكاتبه تستحق الشكر لأضافتها الطيبة<br />و لا أعتقد ان الترتيب بيفرض أهمية عنصر عن اخر.<br />و شكرا"
archived = "2004-07-03"
capture_url = "https://web.archive.org/web/20040703000049/http://www.20at.com:80/article.php?sid=405"

[[comments]]
order = 3
subject = "شكرا للكاتب وقدما للأمام"
text = "إن المقال فعال وأظن أنه بدلا من أن يكون التعليق على ترتيب النقاط : التى تبدأ أو تنتهى بصدر المقال ، أن يكون المرء إيجابيا ويبدأ بنفسه فى التحكم بغضبه ونصح الآخرين ، فشكرا لكاتب المقال على هذه النصائح. \"وذكر فإن الذكرى تنفع المؤمنين\" ، \"والكاظمين الغيظ والعافين عن الناس والله يحب المحسنين\" ...صدق الله العظيم."
archived = "2004-07-04"
capture_url = "https://web.archive.org/web/20040704033827/http://www.20at.com:80/article.php?sid=405"

[[comments]]
order = 4
subject = "إضافة"
text = "فيه خطوة الكاتبة نسيتها<br />الواحد لازم يتعرف على جزار عنده تلاجة كبيرة<br />و يقضى الويك إند فى التلاجة هيطلع زى الفل<br />إذا طلع!!!"
archived = "2004-07-04"
capture_url = "https://web.archive.org/web/20040704033827/http://www.20at.com:80/article.php?sid=405"

[[comments]]
order = 5
subject = "مصـ( الخير )ـعب"
text = "الموضوع شيق وجميل و هو متعلق بأمر يهمنا جميعا إلى أقصى درجة , فكم من بيت هدم, و كم من ظلم وقع على الكثير منا بسبب الغضب, وأحب أن أذكر بواقعة مهمة من السيرة النبوية :<br />بعد صلح الحديبية دخل الإسلام -في سنتين فقط- أضعاف الأعداد التي اعتنقت الإسلام قبل الصلح-18عاما- و ذلك لأن الصلح خرج بالناس من دائرة الغضب إلى دائرة التفاهم بالعقل بموضوعية ودون تعصب أعمى , و أنا أوافق نادر على أن الترتيب لا يقدم أهمية عنصر على عنصر آخر , ولا يجوز لنا أن نظن ظن السوء بإخواننا ونتهمهم بما لا نملك له دليلاً , و وفقك الله يا أختنا الكريمة ..."
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803045535/http://www.20at.com:80/article.php?sid=405"
