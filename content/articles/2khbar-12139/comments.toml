text = "من الاول عارفين انة مش هيروح<br />وبعدين اتت الحجة التى تزرع بها<br />اولا لا الظروف الصحية ولا السياسية تسمح برحلات طويلة وطيران 20 ساعة ويمكن تكون هناك مظاهرات معارضة واسئلة سخيفة من الصحفيين زى مثلا انت هتظل فى الحكم الى متى ؟<br />ومن هو خليفتك ؟<br />انتم عارفين الصحفيين برة فى منتهى الجراءة وليس عندهم لياقة وبيسألوا اسألة محرجة<br />زى الصحفى الالمانى اللى سالة فى زيارة المانيا اسئلة سخيفة<br />على العموم اوباما جاى جاى وهيقول لة اللى هو عايزة"
