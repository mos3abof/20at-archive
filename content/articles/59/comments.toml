[[comments]]
order = 9
subject = "SLAMAMUSLM"
text = "ونصيحة شوفلك شلة مسلمة مؤمنة تعينك على الخير لان البحر ياسيدى موجه عالى قوى والشلة المؤمنة هتربطك بالله بحبل متين<br />والصلاة وطاعة الله هى النجاة الوحيد وكتاب الله النور الذى تركناه تحت مخدتنا ومدخلشى روحنا ومخنا لسه عليك بيه ينور قلبك ويثبتك وشيله فى جيبك علطول واقرا فيه ربنا يثبتك على الخير ويتوب على اهلنا جميعا انه ولى ذلك والقادر عليه<br />\"ربنا لاتزغ قلوبنا بعد إذ هديتنا وهب لنا من لدنك رحمة إنك انت الوهاب\" صدق الله العظيم"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050148/http://www.20at.com:80/article.php?sid=173"

