subject = "الواد ده كداب يا جدعان"
text = "انت كداب كبير اوي ياواد يا هشام<br />انا مكنتش بعيط عشان افتكرتك مت<br />انا كنت بعيط عشان انت الوحيد اللي كنت بتلف لنا<br />و لما اغمى عليك كنت زعلان عشان مش هنكمل الليلة صح<br />بس ممكن نعملها فيلم و نسميه (شباب لاسع و عاقل)<br />تامرtamer_sams@yahoo.com"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050148/http://www.20at.com:80/article.php?sid=173"

[[comments]]
order = 5
subject = "يا سلام"
text = "يا سلام عليك يا باشا<br />هو انت عبيط و لا بتستعبط<br />و لا انت بتعيش<br />المهم انا متأكد أنك لسه مبطلتش<br />و الدليل أنك لسه عايش<br />إمضاء<br />مدمن قديم أوي<br />أشوفك في الاكاديمية بكرة"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050148/http://www.20at.com:80/article.php?sid=173"

[[comments]]
order = 6
subject = "هشام حمزة"
text = "و الله انا عارفكم واحد واحد<br />و ربنا يهيدينا جميعاً<br />و ربنا يستر التيرم ده"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050148/http://www.20at.com:80/article.php?sid=173"

[[comments]]
order = 7
subject = "عندي قصة شبيهة"
text = "يخرب بيت الهبل يا جدعان<br />هو الكل بيشرب و مقضيها و لا ايه<br />المهم<br />انا برده مبطل بقالي فترة كبيرة بس مش عشان الموضوع اللي انت بتقوله يا هشام لكن عشان اخويا مات و هو بيشرب<br />فياريت الكل يدعي له بالمغفرة<br />و ياريت المجتمع يتعامل مع المدمنين على انهم ناس ضعاف و محتاجين عون و مساعدة<br />مش ناس جاحدة و مش بني ادميين<br />ياريت الكل يدعي و يستغفر<br />ربنا رحمته واسعة اوي<br />مؤمن بركات"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050148/http://www.20at.com:80/article.php?sid=173"

