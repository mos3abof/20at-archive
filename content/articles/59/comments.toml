[[comments]]
order = 1
subject = "قشطة عليك يا مان"
text = "الله يرحم يا عم أتش<br />بقيت تكتب مقالات اهه<br />المهم<br />ربنا يعينك و يثبتك و يغفر لك ان شاء الله<br />و خللي بالك من امتحانات التيرم ده<br />خللينا يا بني نخلص و نشق طريقنا"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050148/http://www.20at.com:80/article.php?sid=173"

[[comments]]
order = 2
subject = "فيه حاجات ناقصة"
text = "ماشي يا مان<br />كده تفضحنا<br />بهرج طبعاً<br />يارب يهدينا جميعاًو يهدي باقي الشباب<br />ياض يا هشام انت السبب و ربنا هيجازيك خير<br />سلام يا معلم"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050148/http://www.20at.com:80/article.php?sid=173"

