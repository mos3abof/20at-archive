[[comments]]
order = 0
subject = "كلام جميل ومنطقي"
text = "السلام عليكم ورحمة الله وبركاته<br />أشكرك استاذة رغداء بندق على هذه الوصفات الدقيقة لمعنى الصداقة، والتي اصبح من هب ودب يتحدث عنها وباسمها.<br />واشكرك جدا أكثر لأنك وضعت قواعد حقيقية ملموسة لمعرفة المرائي من المحب الحقيقي لصديقه.<br />وماأكثر المشاكل التي تقع بسبب سوء تقدير العلاقة بين اثنين.<br />عادل اقليعي<br />المغرب"
archived = "2004-07-07"
capture_url = "https://web.archive.org/web/20040707170906/http://www.20at.com:80/article.php?sid=300"

[[comments]]
order = 1
subject = "هو الاستبيان ده علمي ومدروس"
text = "هو الاستبيان ده علمي ومدروس، ولا كلام ابن عم حتيت. معلش متزعليش يا أستاذة بس بجد عاوزة أعرف"
archived = "2004-07-07"
capture_url = "https://web.archive.org/web/20040707170906/http://www.20at.com:80/article.php?sid=300"

[[comments]]
order = 2
subject = "واحد من البشر"
text = "شكلك كده طلعت من فئة مش ولا بد... والا مكنتش تسأل عن المصدر...وعشان أطمنك الاختبار دة مدروس علميا..فجاوب وحط في بطنك بطيخة صيفي:)"
archived = "2004-07-07"
capture_url = "https://web.archive.org/web/20040707170906/http://www.20at.com:80/article.php?sid=300"

[[comments]]
order = 3
subject = "ابراهيم سعيد"
text = "انتي قلتي حاجه مهمه جدا في بداية الكلام وهي ان الانسان مش ممكن يقدر قيمة الصداقه الا اذا فقد صديق له انا النهارده كنت هفقد واحد بعتبره الانتيم بتاعي والله لاول مرة في حياتي ابكي بالحرقة دي صحيح ياجماعه الصديق يرضه غالي"
archived = "2004-07-07"
capture_url = "https://web.archive.org/web/20040707170906/http://www.20at.com:80/article.php?sid=300"

[[comments]]
order = 4
subject = "1أ/ 1ب/ 2 ج / 1د"
text = "ولا مؤاخذة دي نتيجة التحليل ، معلش متأخرة شوية بس على المعمل ما رضي يديني النتيجة أصل مكنش معايا فلوس فاقعدت أعيط وأقوله الست رغداء هاتبهدلني لو مجبتش النتيجة<br />المهم انا بقى مش عارف هل انا اناني ولا حساس ولا منكسر ولا ايه بالزبط بجد النتيجة لخبطتني جدا<br />يا ترى ادخل الدور التاني وأشوف النتيجة ولا هاخد درجات الرأفه وأعدي ..!!!!"
archived = "2004-07-07"
capture_url = "https://web.archive.org/web/20040707170906/http://www.20at.com:80/article.php?sid=300"

