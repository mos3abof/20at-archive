[[comments]]
order = 4
subject = "مجرد رأي"
author = "مش عارف ليه أنا حاسس إن فيه مشكلة داخل المجتمع السعودي يعني كتير أوي قريت على النت عن مشاكل سرية مخفاة داخل دهاليز المجتمع السعودي مشاكل أو فضاءح غير معلنه"
posted = "2006-04-18"
text = "وأشعر أن السبب في هذا هو عدم اقتناع الشعب بتطبيق الشريعة<br />يا جماعة احنا محتاجين نقنع الناس بتطبيق الشريعة قبل منطبقها<br />أرجوا ألا يفهم كلامي في نطاق خاطئ أنا فعلا مفتنع بضرورة تطبيق الشريعه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144741/http://www.20at.com/article2.php?sid=702"

