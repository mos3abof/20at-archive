[[comments]]
order = 0
subject = "هنا القاهرة"
author = "مسلمه"
posted = "2006-04-16"
text = "اعتقد ده بس علشان قوانين السعوديه لا تسمح بذلك<br />لكن الحقيقه ده لو كان هنا فى مصر كان هيحصل حاجات تانيه<br />الحقيقه الناس هتقعد تتفرج وتصقف واكيد المصور لازم يهرب بالموديلات من الزحمه<br />وساعتها اكيد مكانوش هيلبسو عبايات؟؟؟<br />ولو لبسوها محدش هيعبرهم او ممكن يقعدو يتفرجوا غلاسه<br />هو ده اللى ممكن يحصل فى شواطئنا<br />اللهم اهدى الراعى وارعيه<br />اللهم اهدى شباب المسلمين اللهم اهدى فتيات المسلمين اللهم اهدنا معهم يا رب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144741/http://www.20at.com/article2.php?sid=702"

[[comments]]
order = 1
subject = "لا يصح الا الصحيح"
author = "ادهم"
posted = "2006-04-16"
text = "المفروض دة ميبقاش خبر لان هو دة العادي والطبيعي والصح واللي المفروض يكون بيحصل في اي مكان مش في السعودية بس لكن عشان دة مبيحصلش اصلا واللي حصل دة حاجة غريبة فبقي الموضوع خبر<br />عموما بكرة جماعات الدفاع عن حقوق الفساد والفتن تهب للدفاع عن المطرب والموامس المصاحبين ليه<br />احنا في زمن ما يعلم بيه الا ربنا الصح بقي غلط والغلط بقي صح<br />وسلملي ع الاخلاق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144741/http://www.20at.com/article2.php?sid=702"

[[comments]]
order = 2
subject = "يستاهل"
author = "عبدالله مفتاح"
posted = "2006-04-16"
text = "استغلال جسد الفتاه ده شيء مقزز<br />واللي يعمل كده مش يستاهل ان يتقبض عليه بس<br />يستاهل ياخد حكم كمان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144741/http://www.20at.com/article2.php?sid=702"

