text = "السلام عليكم<br />جزاكم الله خيرا على المعلومات القيمة الموجودة بالمقالة.<br />وبإذن الله سوف أقوم بزيارة الوادى فى أقرب فرصة.<br />وأرجو عمل مقالات مشابهة لمواقع تصلح للزيارة الأسرية موضحاً بها معلومات عن المكان وأسعار الد[ *** ] … إلخ<br />ولكم جزيل الشكر"
