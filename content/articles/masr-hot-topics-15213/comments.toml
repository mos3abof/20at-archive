text = "المثل البلدى بيقول - يا رايح كتر من الفضايح - والناس دى فاضل لهم 6 اشهر ويستلموا استمارة 6 - واستمارة 6 دى بتنكتب للتكهين والتخريد فى معدات الحكومة<br />اظن الانتخابات القادمة فى شهر اكتوبر وكل واحد عايز يبان ويظهر قدام دايرتة انة ولد دكر ولة حس زبيزعق ويشتم كمان"
