author = "50 % عمال وفلاحين"
posted = "2010-02-04"
text = "شوف يا سيدى القانون من ايام الاتحاد الاشتراكى بيقول لك اعضاء مجلس الشعب 50 % منهم يكونوا من العمال والفلاحين - وهو دة اللى فاضل من الاشتراكية فى مصر - رغم تحرير الاقتصاد واقتصاد السوق وبيع كل المصانع والتحول الى الراسمالية المتطرفة<br />طيب هل هم عمال وفلاحين فعلا<br />ابدا<br />دى تمثيلية<br />فى الدايرة بتاعتى واحد عميد اركان حرب وارث عن ابوة 3 فدادين ولة حيازة زراعية يبقى بقدرة قادر فلاح ويلبس جلابية ويقعد فى المجلس ممثلا عن الفلاحين وهو عمرة ما مسك فاس ولا يعرف حاجة عن الفلاحة وتربية معسكرات والكلام البذىء كلة بيطلع من لسانة بحكم وظيفتة الميرى<br />انت عايز اية<br />مجلس عامل زى معسكر مجندين او امن مركزى فية كل السفالات<br />وكلة تمام يا افندم<br />موافقون<br />موافقون ورحمة اللة وبركاتة"
archived = "2010-02-06"
capture_url = "https://web.archive.org/web/20100206221549/http://www.20at.com:80/masr/hot-topics/15213-2010-02-04-16-23-46.html"

