text = "احب اولا اقول للتعليق اللى قبلى احنا حاليا 80 مليون حضرتك بس مش دى النقطه يا جماعه صدقونى<br />النقطه فى ان الواحد عايش طول عمره عنده امل فى ان الجاى احسن لكن لما ينعدم الامل ف بكره عند شابين ف مقتبل العمر ده مؤشر خطير و ميبشرش بخير<br />عجبنى اوى تعليق رئيس شركه المترو<br />و النبى ده كلام يقوله<br />صحيح هم يبكى و هم يضحك<br />سؤال يا جماعه علشان بقالى كتيييير مدخلتش عشرينات حد يقوللى اروح الارشيف منين"
