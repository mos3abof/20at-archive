[[comments]]
order = 2
subject = "نقطة ضعفي"
author = "sweet_princess"
posted = "2006-02-19"
text = "على فكره مامتي هي نقطة ضعفي انا لاني بحبها جدا وبتعامل مهاها على انها صديقتي واختي في نفس الوقت وكل اسراري معاها لكن اما بحب اطلب منها حاجه وتكون مزرجنه شويه بقعد ادلعها واهزر معاها احيانا بتوافق بس لو ما وفقتشي بعمل نفسي زعلت فتوافق على طول<br />اما بابا فللاسف انا مالحقتش اعرفه عشان اعرف نقط ضعفه لانه سابنا وانا لسه بيبي وكل اللي عندي ليه مجرد صوره وشوية كلام بسمعهم من ماما بس تصوروا بالرغم انه مات وسابها من سنين الا انها لسه بتحبه وكل ما تفتكره بتعيط(ونقطة ضعف مامتي بجد هي انا واخويا الكبير )لانها مابتستحملش علينا اي حاجه تزعلنا)عشان كده اي حد بيحب يطلب منها طلب بس يحلفها بينا مابتقدرش تقول لا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114843/http://www.20at.com/article2.php?sid=464"

