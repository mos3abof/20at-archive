subject = "ahmed_83_hassan@yahoo.com"
text = "التعليق على موضوع\"من الحب ماقتل\"<br />_________________________________<br />اعتقد ان هذاالموضوع ليس للمتزوجين لان الزواج مطلوب فية العطاء الى ابعد الحدود دون اى تخوف لان من المفروض ان الزواج فى الاصل مبنى على الثقة وفترة الخطوبة كافية للتعارف الجيد.. اما ان يعطى احد الطرفين والاخر لا يبادلة فهى علاقة بعيدة نسبيا عن الزواج..... اما ان هناك خطا فى الاختيار بين الزواج ولهذا كثرت المشاكل والاسف مشاكل صغيرة تؤدى الى كارثة<br />شكرا"
archived = "2004-08-03"
