[[comments]]
order = 12
subject = "من قال أن فترة الخطوبة كافية؟؟؟!"
text = "ما يتحدث عنه هذا الموضوع أيضاًينطبق على الحياة الزوجية, لأن داخل الحياة الزوجية يبدأ التعارف الحقيقي و الإحتكاك بالطرف الآخر ما أقصده أن ( كل واحد بيبان على أصله) و بيكون على طبيعته أكثر, أما فترة الخطوبة فهي كافية للقبول الجسدي والفكري و التوافق الإجتماعي و الديني و العاطفي الذي يؤدي نهاية الى الزواج , و أعتقد غن الموضوع بينطبق على كل شئ في الحياة و ليس فقط الحب و الزواج , فأي شئ يزيد عن حده ينقلب ضدهّّ!"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803100918/http://www.20at.com:80/article.php?sid=332"

