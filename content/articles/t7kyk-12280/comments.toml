[[comments]]
order = 1
subject = ""
author = "مشاهد للمصرى العادى"
posted = "2009-06-04"
text = "استقبل اوباما عند سلم الطائرة وزير الخارجية ابو الغيط —- اين رئيس الوزراء احمد نظيف<br />على بوابة قصر القبة استقبل السيد الرئيس مبارك اوباما ولم يستعرضا حرس الشرف بل اكتفوا بالسلام الجمهورى الامريكى والمصرى<br />لم يحضر مبارك خطاب اوباما<br />تجول اوباما وحدة فى مسجد السلطان حسن اين السيد رئيس الوزراء<br />ربنا يستر"
archived = "2009-06-07"
capture_url = "https://web.archive.org/web/20090607073413/http://www.20at.com:80/t7kyk/12280-2009-06-04-13-01-01.html"

[[comments]]
order = 2
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-06-05"
text = "الرئيس للاميريكى(باراك اوباما)<br />ليس الا رئيس لدولة و حكومة (الولايات المتحدة الاميريكية)<br />و عضو فى الحزب الوطنى الديمقراطى و ليس رئيسة؟!!!<br />عفوا أقصد ان الرئيس الاميريكى (باراك أوباما)<br />ليس الا عضوا عادى فى الحزب الديمقراطى الاميريكى<br />و ليس (الحزب الوطنى الديمقراطى )المصرى<br />ها هاهاهاهاهاهاهاه ا"
archived = "2009-06-07"
capture_url = "https://web.archive.org/web/20090607073413/http://www.20at.com:80/t7kyk/12280-2009-06-04-13-01-01.html"

[[comments]]
