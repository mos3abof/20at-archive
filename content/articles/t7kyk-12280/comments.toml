posted = "2009-06-06"
text = "على فكرة يا جماعة<br />الولد الاسرائيلى اليهودى اللى بيخش يكتب تحت اسم زخارى دة يهودى اسرائيلى ومش من اسكندرية زى ما بيزعم فمفيش احد يعبر امة فى الجزمة"
archived = "2009-06-07"
capture_url = "https://web.archive.org/web/20090607073413/http://www.20at.com:80/t7kyk/12280-2009-06-04-13-01-01.html"

