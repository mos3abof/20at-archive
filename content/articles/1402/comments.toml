[[comments]]
order = 2
subject = "الشيخ سعيد"
author = "لسلام عليكم ورحمة الله وبركاته"
text = "من الذي يقول بان موسى عرفات اغتله احد غير السلطة؟ لانه اراد ان يكشف ملف تسميم ابو عمار، وثانيا هل يعقل ان 100 مسلح هاجموا منزلا وقاموا بمحاصرته ومكثوا فيه فترة من الزمن دون دراية السلطة. والا فاين الامن والامان؟ انا لا انكر بانه فساد، لكن ايضا السلطة كلها فاسدة في نفس الوقت.,"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143359/http://www.20at.com/article.php?sid=1582"
