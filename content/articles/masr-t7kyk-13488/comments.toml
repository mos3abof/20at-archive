author = "الشعب الاهبل"
posted = "2009-09-23"
text = "الشعب الاهبل عايز كده<br />ما هو اصل ثورة 23 يوليو اعلنت القضاء على الاقطاع والزواج في مصر<br />خلاص ما فيش جواز<br />والبديل العادة السرية<br />والحجات دي تنفع اوي لتنشيط الذهن لممارسة العادة السرية"
archived = "2009-09-26"
capture_url = "https://web.archive.org/web/20090926091201/http://www.20at.com:80/masr/t7kyk/13488-2009-09-17-13-41-45.html"

[[comments]]
order = 1
subject = ""
author = "دي مش جريئة"
posted = "2009-09-23"
text = "بجد انسانة مستفزة جدا خصوصا ف كلامها عن الدين<br />هي مش عارفة يبقى ماتتكلمش مش تشوه الدنيا وخلاص<br />بعدين يا ريت تفهم ان مالهاش دعوة بالمحجبات والحجاب<br />وبلاش تطلعهم بيتمنظروا بالدين<br />وخليها ف حالها<br />وحسبي الله ونعم الوكيل ف كل اللي سمحوا لها انها تتكلم اساسا"
archived = "2009-09-26"
capture_url = "https://web.archive.org/web/20090926091201/http://www.20at.com:80/masr/t7kyk/13488-2009-09-17-13-41-45.html"
