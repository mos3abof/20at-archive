text = "Ma3 enni mesh fahem eh elli dakhaal Elekhwan w hamas felmawdo3. w ma3 enni la ma3 dol wala dol. w ma3 enn kalamak beybayen en el moshkela 3andak el islam wel islameeyen bawagh 3am w en ay 7aga te7sal fel denya yeb2a ay shee2 islami hwa elsabab. laken bs a7eb alfet nazar 7adretak leshee2 soghayar awy enn elli 7asal fi ghaza men 7awali shahreen elshaytan fih makansh 7amas wala 7aga.. w 7adredak magebtesh seeret el shayateen el7a2e2yeen elli kano elsabab fi kol 7aga askherha elyomeen dol sabbo mase7ak w mase7i .. begad enta ra2e3 w demaghak 7elwa.. tebee3?"
