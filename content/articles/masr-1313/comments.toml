order = 0
subject = "واحد من مواليد برج الحوت"
author = "إسلام الكنزي"
posted = "2006-12-25"
text = "مقال جميل منك .. ابدعت فيه من غير مبالغة ..<br />و الله انا لما قريت مقالاتك استعجبت فعلاً ..<br />لأني من برج الحوت و عمري ما امنت بالأبراج .. لكن وصفت الحالة بتعاتي .. و هي اني بميل لإحلام الواقع بطريقة رهيبة ..<br />يا تري فعلاً دي صدفة و لا ايه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128193005/http://masr.20at.com:80/article.php?sid=1313"
