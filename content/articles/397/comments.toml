[[comments]]
order = 0
subject = "الأطفال يفضلون البقرة"
text = "نقلا عن ميدل أيست أون لاين<br />محللة ترى أن تصويت الأطفال لصالح مرشح معين يمثل مقياسا للانتخابات الرئاسية لانههم يشاطرون اهلهم الآراء نفسها.<br />واشنطن - قال حوالي 400 ألف طفل اميركي ردا على أسئلة محطة \"نيكلوديون\" التي تبث بالكابل انهم يصوتون لصالح المرشح الديموقراطي جون كيري المفضل بنسبة 57% على الجمهوري جورج بوش الذي نال 43% من الاصوات.<br />واوضحت المحطة في بيان لها انه منذ ان بدأت تنظيم هذا الاستطلاع في العام 1988، كان الأطفال يختارون على الدوام الفائز في الانتخابات الرئاسية الأميركية. وفي العام 2000 صوتوا لصالح بوش بنسبة 55%.<br />وقالت سيما زارغامي رئيسة المحطة ان \"تصويت الاطفال هو بمثابة مقياس للانتخابات الرئاسية لانه حسب مستوى نموهم فان الاطفال الذين تتراوح اعمارهم بين 2 و 11 عاما يشاطرون أهلهم الاراء نفسها\".<br />وقد دعي الاطفال الذين يزورون موقع المحطة على الانترنت للتصويت لبوش او كيري الثلاثاء، في عملية تربية مدنية عبر الانترنت تطلب منهم حث اهاليهم على الذهاب للتصويت."
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024140315/http://www.20at.com:80/article.php?sid=686"

[[comments]]
order = 1
subject = "مكسوفة"
text = "أنا أقولكم كدة<br />بالعربي (بوش وكيري) بوش يعني إدفع (ملناش دعوة بالسبل بتاعها) وكيري جبنة بناكلها<br />يعني باختصار : ادفع فلوس تاكل جبنة<br />وأصلا جبنة كيري مش حلوة ومش ممكن آكلها حتى لو دفعولي<br />مفيش أحلى من جبنة المراعي السايلة يم يم<br />متهيألي تعلنوا عنها أحسن<br />بوشكيري قال<br />يادي القرف"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024140315/http://www.20at.com:80/article.php?sid=686"

[[comments]]
order = 2
subject = "لور دكاش"
text = "بقرة.. وإيرلندية.. وسوداء.. وحلوب<br />متهيألي اللي يرشح كيري ده بعد كده يبقى يعرض نفسه على دكتور أحسن. بس يا عيني الناس هتعمل ايه.. واحد بقرة والتاني....<br />... بقرة برضه..."
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024140315/http://www.20at.com:80/article.php?sid=686"
