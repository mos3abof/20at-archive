subject = "منظور \"الجندر\""
author = "مصري"
posted = "2006-03-03"
text = "ما مدى ملاءمة منظور \"الجندر\" -أي تأسيس الفروق بين الجنسين على الثقافة وحدها والمناداة بالمساواة الكاملة بينهما- هذا المنظور الذي صار منهاجية، واقتراب في دراسات المرأة، بل والدراسات الاجتماعية في الغرب؛ لدراسة النصوص الدينية والتاريخية من جانب المسلمين رجالاً ونساءً؟<br />أو فلنسأل السؤال معكوسًا: هل يمكن أن ندرس قضايا \"الجندر\" (الخلفية الثقافية لأدوار الجنسين) من منظور المرأة المسلمة؟<br />نساء الأمة شقائق الرجال:<br />في محاولة لتقديم إجابة على هذا التساؤل يمكن أن نشير إلى ثلاث وقائع مترابطة في الحديث الصحيح، اثنان منهما مرتبطتان بأسباب النزول لآيتين قرآنيتين:<br />أ- الواقعة الأولى التي ذكرها البخاري – رحمه الله - عن أم سلمة – رضي الله عنها - أنها كانت في غرفتها تمشطها الماشطة، فسمعت النداء للصلاة الجامعة، فأمرتها أن تتأخر عنها، فقالت الماشطة أن الدعوة للرجال (الناس)، فقالت أم سلمة أنا من الناس.<br />ب- الواقعة الثانية: عندما تساءلت أم سلمة – رضي الله عنها - عن فضل الهجرة وتخصيص الرجال بها دون النساء، فنزلت الآية (فَاسْتَجَابَ لَهُمْ رَبُّهُمْ أَنِّي لاَ أُضِيعُ عَمَلَ عَامِلٍ مِّنكُم مِّن ذَكَرٍ أَوْ أُنثَى بَعْضُكُم مِّن بَعْضٍ فَالَّذِينَ هَاجَرُواْ وَأُخْرِجُواْ مِن دِيَارِهِمْ وَأُوذُواْ فِي سَبِيلِي وَقَاتَلُواْ وَقُتِلُواْ لأُكَفِّرَنَّ عَنْهُمْ سَيِّئَاتِهِمْ وَلأُدْخِلَنَّهُمْ جَنَّاتٍ تَجْرِي مِن تَحْتِهَا الأَنْهَارُ ثَوَابًا مِّن عِندِ اللّهِ وَاللّهُ عِندَهُ حُسْنُ الثَّوَابِ) الآية 195 من سورة آل عمران.<br />ج- عندما سألت واحدة من النساء رسول الله – صلى الله عليه وسلم - عن ذهاب الرجال بأجر الجهاد، فنزلت الآية (إِنَّ الْمُسْلِمِينَ وَالْمُسْلِمَاتِ وَالْمُؤْمِنِينَ وَالْمُؤْمِنَاتِ وَالْقَانِتِينَ وَالْقَانِتَاتِ وَالصَّادِقِينَ وَالصَّادِقَاتِ وَالصَّابِرِينَ وَالصَّابِرَاتِ وَالْخَاشِعِينَ وَالْخَاشِعَاتِ وَالْمُتَصَدِّقِينَ وَالْمُتَصَدِّقَاتِ وَالصَّائِمِينَ وَالصَّائِمَاتِ وَالْحَافِظِينَ فُرُوجَهُمْ وَالْحَافِظَاتِ وَالذَّاكِرِينَ اللَّهَ كَثِيرًا وَالذَّاكِرَاتِ أَعَدَّ اللَّهُ لَهُم مَّغْفِرَةً وَأَجْرًا عَظِيمًا) الآية 35 من سورة الأحزاب.<br />فما هي دلالة هذه الأحاديث؟<br />أ- أنها تدل على حرص النساء في عصر الرسول – صلى الله عليه وسلم – على أن يكون لهن مكان في الشئون العامة للجماعة المؤمنة، وأن يُذْكَرن في النص القرآني، وأن يَكُنَّ جزءاً ظاهرًا من الحياة الإسلامية في جوانبها الدينية والاجتماعية العامة.<br />ب- إنها تعكس حرص النساء على أن يحظين بالمكانة والتقدير لمشاركتهن، وألا يتم إقصاؤهن أو تجاهلهن أو تهميشهن.<br />ج- مثل هذه الروايات تعكس مراعاة التنزيل لإحداث توازن بين شقي المجتمع، أي أن الإسلام راعى تقديم رؤية تراعي الجنسين، وتتعامل بحساسية محمودة مع المرأة بتأكيد دورها ومكانتها؛ لتحقيق المساواة الإيمانية لها في ظل علاقة الولاية بين المسلمين والمسلمات في المجتمع الإسلامي. هذه الرؤية أكدت على احترام وجهة نظر المرأة ومبادراتها ودورها واستجابت لتساؤلاتها وجدلها.<br />د- نقطة أخيرة هامة هي أن الله تعالى سمع قول التي تجادل، وصوت اللائي يتساءلن وأنزل محكم الآيات استجابة لتساؤلات وهموم وهواجس النساء؛ ولذلك دلالة بارزة في أهمية الإنصات لصوت النساء في أي سياق تاريخي تالٍ، والتعامل معه باحترام كما حدث في العصر الإسلامي الأول من الله تعالى جل جلاله ومن رسوله (عليه الصلاة والسلام).<br />هل هناك حاجة في هذا الزمان لإعادة هذه المواقف والإنصات للمرأة المسلمة وسماع صوتها وهواجسها، والتفاعل مع همومها؟<br />حقوق المرأة في الإسلام ثابتة لا يجادل بشأنها أحد، إنما المشكل في تنزيل هذه الآيات والأحكام الشرعية لأرض الواقع الذي يشهد مظالم وتجاهل للحقوق التي كفلتها الشريعة الإسلامية للمرأة في الإرث والتعليم والذمة المالية المستقلة والعمل والجهاد المشاركة في الشورى.<br />فالشقة – بل الهوة- بين الحقوق المكفولة في الشريعة وواقع المرأة المسلمة واسعة في مجال السياسات العامة والقانون، وهناك حاجة ماسة لتفعيل النص وتوفير الفرص وإتاحة المساحة، وكلها قضايا لا بد من فتحها للنقاش.<br />المرأة بين قراءة النص واجتهادات الفقهاء:<br />على المجتمعات الإسلامية أن تأخذ بمزيد من الجدية مسألة المعاملة الإنسانية والعادلة للمرأة، واحترام آدميتها، وهو الموضوع الذي أكد عليه القرآن في مواضع شتى، لكن لم يعتبره المفسرون والفقهاء أبدًا مدخلاً أساسيًا من مداخل فهم القرآن أو مقاصد الشريعة.<br />نحتاج في دار الإسلام لعبور الفجوة بين الأصول والفقه في هذا الصدد، وما أحدثته الثقافات والتقاليد غير الإسلامية (الجاهلية) من تشوه في واقع المرأة المسلمة عن تطبيق النصوص وغلبة ممارسات تاريخية لا تمت بصلة للأصول، وموقفها العادل من المرأة وتكريمها وجعل النساء شقائق الرجال.<br />لقد تسللت مفاهيم الثقافات المحلية إلى مفهوم الفقهاء، والدارس للفقه في قضايا المرأة وسياقات الفقهاء الاجتماعية يلحظ على الفور التباين في المواقف والرؤى حسب الخلفية الثقافية والاجتماعية ما بين إمام مثل السيوطي وآخر مثل ابن حزم، والأمثلة كثيرة.<br />والجهد المطلوب بإلحاح هو أن تتم دراسة الفقه وسياقاته الاجتماعية ومراجعة الآراء الفقهية والفتاوى التي غلبت فيها الثقافة المحلية على صريح النص أو مقاصده، وأهدرت فيها أهلية المرأة العقلية والقانونية، وقدمت لها نظرة دونية تتعارض مع صريح النص القرآني وسنة الرسول(صلى الله عليه وسلم) الصحيحة – القولية والفعلية؛ وتتناقض مع القيم الحاكمة في المنظومة الإسلامية من عدل ورحمة، وكذا مع تكريم وتقدير المرأة في الخطاب القرآني في مواضع شتى.<br />فالتعامل مع مفاهيم المعروف والفضل في التعامل مع النساء خاصة في العلاقة الزوجية تراجعت لصالح مفهوم وتصور للقوامة يصورها سلطة باطشة لا رقيب عليها، وهناك فارق مثلاً بين تفسير هذه المفاهيم بين الطبري والزمخشري بعده بقرنين.<br />لقد ذهب الإمام محمد عبده مثلاً إلى أن المرأة غير ملزمة بخدمة الزوج وهو ما كان يمثل تطويرًا أو تجاوزًا لرؤى قصرت وظيفة المرأة على خدمة زوجها وأولادها، في حين أن بعض الآراء الفقهية جعلت ذلك تطوعًا، وهو ما يجعل منع المرأة من العمل في خارج المنزل بدعوى أولوية خدمة زوجها وأولادها محل مراجعة ونظر كليًا، وغير ذلك كثير من الآراء الفقهية التي لو تمت مراجعتها وردها للأصول لتغيرت النتائج المترتبة عليها في حياة المرأة في جوانب أخرى، وشهدت منظومة الحقوق والواجبات للمرأة المسلمة وتوازناتها داخل الأسرة وفي المجتمع تغيرًا بنويًّا نحو مزيد من العدالة المتسقة مع الأصول وسيرة الرسول (صلى الله عليه وسلم). بل إن صورة المرأة كمؤمنة وإنسان في الجماعة المسلمة ذاتها قد أصابها ما أصابها، فالقرطبي في تفسيره لقوله تعالى: \"الرجال قوامون على النساء\" ذهب لتفضيل الرجال على النساء لأسباب منها أمرهم بالمعروف ونهيهم عن المنكر، في تعارض صريح مع آية الولاية (التوبة: 71). وأمثلة أخرى عديدة.<br />وهذه المراجعات المطلوبة ليست \"نسوية\" ولا \"جندرة\" بل هي تقويم وعودة للأصول وتحرير للنص من سلطة الثقافة السائدة في زمن المفسر؛ لأن الإسلام صلاحيته لكل زمان ومكان، فالأمر ليس \"اجتهاد\" جديد مغاير للأصول أو مراجع لها رجوع استظهار؛ بل هو التزام بها، ورجوع افتقار للإجابة على أسئلة ومشاكل المرأة المسلمة التي من حقها أن ترفع صوتها في أي زمان ما دامت قد رفعته في زمن الرسالة؛ فاستجاب الله لها، وسمع قولها وأنزل من الآيات ما ثَبَّت فؤادها، وأكد مكانتها وقدَّر منزلتها المتساوية مع الرجال في ساحة الإيمان والدعوة وحمل أمانة هذا الدين.<br />إسلاميات في حقل \"النسوية\":<br />إن أجندة النسوية الغربية بها بنود غير ذات صلة بأولويات المرأة المسلمة مثل ما يسمى الحقوق الجنسية وغيرها، بيد أن رفع اتهام النسوية والتغريب في وجه كل من يفتح ملف واقع ومشكلات المرأة المسلمة ليس عدلاً ولا إنصافًا، ويمكن للمرأة المسلمة أن تعي تمامًا أولوياتها وتحريرها الإسلامي\" ولديها الأهلية الكافية لصياغة أجندتها الإسلامية الصحيحة.<br />إن الأجندة النسوية ذاتها ليست متوحدة، فهناك النسوية الليبرالية وأخرى ذات الجذور الماركسية، وثالثة متعصبة للأنثى والأنوثة معادية للذكور، ورابعة دينية مسيحية محافظة، كما أن هناك نسوية تنقد المظالم السياسية والاجتماعية ولا تركز فقط على حقوق المرأة.. وغيرها وغيرها.<br />إن المطالبة بحقوق المرأة ليست مطالبة بمساواة كاملة آلية ميكانيكية، بل هي مطالبة بعدالة وولاية متكافئة، واحترام للفروق الحقيقية وليست المتخلية أو المصطنعة أو المختلقة بتعسف، وهي مطالبة تقف على أرض الإسلام وتعترف بمرجعيته، وشهدت الأعوام الـ 15 الأخيرة صحوة نسائية إسلامية، وجهد دءوب من باحثات هويتهن إسلامية وولاؤهن إسلامي للنهوض بأوضاع المرأة، وإعادة قراءة الأصول، واستعراض التراث، وردة للأصول، وقراءتهن للقرآن والحديث التماسًا للعدل الإلهي ليس قراءة نسوية بل قراءة واجبة شرعًا؛ لأنهن حاملات لهذا الدين وعليهن معرفة ما شرعه الله لهن وعليهن والذود عنه ضد التفريط والإفراط.<br />وهؤلاء الباحثات المسلمات على وعي بالمزالق والمخاطر:<br />-فهن يحاولن الاجتهاد والتجديد بضوابط الإسلام وبوعي، ولا يقعن فريسة الرؤى الاستشراقية التي ترى المرأة ضحية لدين يقهرها.<br />- أنهن على وعي بمخاطر العلمنة والتحديث، ولا يرون اتباع طريق حداثي للتغيير، بل تغييرًا من قلب الإسلام وعلى ساحته.<br />- أنهن لا يقعن في المقابل في فخ خطاب يزعم أنه \"لا مشاكل\"، بل هناك مشاكل نعالجها ونتصدى لتقديم حلول إسلامية لها.<br />وأنا شخصيًا كباحثة في التاريخ الإسلامي ولي دراسات في راويات الحديث من النساء، والمرأة في التراث الصوفي، وتصورت أن هناك الكفاية في الأبحاث المتاحة، لكنني اكتشفت الحاجة الماسة لجهود الباحثين المسلمين في مجال إنصاف المرأة المسلمة على مستوى الفكر والفقه ومستوى الواقع، وإذا كانت مفاهيم الجندر ستفيدنا فنأخذ منها ما يفيد وفق أولوياتنا نحن وأجندتنا الإسلامية التي صغناها بدقة، ونوظف هذه المفاهيم بوعي ولا توظفنا."
