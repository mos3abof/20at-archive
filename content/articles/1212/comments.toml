subject = "ما شاء الله"
author = "sweet_princess"
posted = "2006-03-03"
text = "ايه الجمال دا يا اسرائيل شغاله على ودنه<br />لما(انا بحسد وبقر يمكن تهمد شويه)<br />لقت ان خطة الاكل والاعلام ابتدت تتضرب ابتدوا يلجاوا لبث فكر حكماءصهيون (اللي هما اصلا اساس دولة اسرائيل.<br />الاكل اتضرب عن طريق انفلوانزا الطيور وما خفي من الامراض كان اعظم ولسه هيظهر على مدمني اكلات كنتاكي وماكدونالدز (استنو ما تستعجلوش ).<br />الاعلام عن طريق عصر القنوات المفتوحه والدش (بكسر الدال او ظمها الاتنين واحد)اللي غرقنا بقنوات عمالع تبث فكرها وانظمتها في عقولنا لحد ماخربت .<br />وعارفين ابسط دليل ايه :<br />لما لقيت واحد طالع بمنتهى البجاحه (مؤلف مشهور ومغرقنا مسلسلات في رمضان)اضن عرفتوه طالع بكل بجاحه يقول (كفايه انهم اعتذروا عاوزينهم ينطقوا الشهاده )يا شيخ اتلهي .<br />لا احنا مش عاوزينهم ينطقوا الشهاده ولا ربنا ممكن يتقبل توبة ناس اجترئت على نبيه (عليه الصلاة والسلام )اكتر من مره وبدون اي حيا ولا خشى.<br />لكن برضه مجرد الاعتذار ده مش كفايه .<br />الاول كل الناس اللي سهلت الموضوع دا من اول الخنزير اللي فكر فيه للايد اللي تستاهل قطعها اللي مضت على اذن الطبع لغاية الايد اللي طبعت والايد اللي نشرت .<br />كل العالم دي لازم تتحاسب اولا وبرضه دا مش اعتزار دا مجرد تصحيح وضع مش اكتر .<br />اما الاعتذار بقى لازم يكون رادع .<br />ايه هو مش عارفاه بس لازم يكون برضه في عقوبه اكتر من كده (مش يقولو اسفين نطبطب عليهم .<br />المنهم انا شطحت بالكلام بعيد ووجعت دماغكم.<br />ارجع لموضوعنا :<br />حكاية تسرب الفكر دا للشباب الاردني .<br />اولا :<br />دا شيئ طبيعي ومش مستبعد ابدا على دوله بقالها اكتر من خمسين ...ستين سنه بتمشي امورها مع اسرائيل من تحت الترابيزه و ملوكها بتنقلها اسرار اللي بيحصل بين العرب في اجتماعاتهم ومشاوراتهم .<br />يبقى سهل جدا ان شباب دوله زي دي يبقوا اول الضايعين .<br />ربنا يستر علينا ."
