text = "فبعد ان اصبحنا اتباع لهم فى الفكر \" بافتعال القضايا الاسلاميه التى يجب حلها مثل تحرير المراه\"<br />واتباعهم فى المظهر وبالتالى اتباعهم فى دينهم او بالاصح صهيونيتهم<br />بدلا من الكلام يجب علينا التحرك والمدافعه عن ديننا والعوده الى ربنا والى اسلامنا<br />اللهم من اراد الاسلام والمسلمين بكيد فاكده اللهم ادر الدائره عليهم<br />والسلام عليكم اخوتى فى الله ورحمته وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134331/http://www.20at.com/article2.php?sid=517"

[[comments]]
order = 6
subject = "مفهوم يا مصرى"
author = "نيفين"
posted = "2006-03-05"
text = "نقطتك وصلت يا مصرى<br />بخصوص موضوع الاعلان المشور ف احدى الجرائد الامريكيه بشكرك ان انت بتطلعنا اول باول على الامور دى<br />و بقوللك حسبنا الله و نعم الوكيل<br />و لا عزاء للمصريين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134331/http://www.20at.com/article2.php?sid=517"

[[comments]]
order = 7
subject = "هذا هو سبب التخلف العربي السحيق"
author = "عمر عمر"
posted = "2006-04-02"
text = "هكذا مقالات تشكل عقبة كأداء في طريق التطور العربي وتدفع بالمجتمعات الى السكون تماما \"كالأفيون \" حيث منذ بزوغ الحضارة الغربية وفئة من الامة همها منع العرب من الاقتباس والاستفادة من ايجابيات هذه الحضارة الكثيرة فحاربوا الديمقراطية مثلا واعتبروها \"حرام\" وحربوا لوائح حقوق الانسان واقنعوا المواطن العربي المسحوق والمقموع اقنعوه بانه حاصل على حقوقه اكثر من الغربيين وحاربوا دعوات حقوق المراة واقنعوا المراة العربية بانها تحصل على حقوق اكثر من الغربيات مع انها ممسحة للرجل في الغالب ........وهكذا هؤلاء يؤفينون الشعوب العربية فبقيت ساكنة متخلفة ولولا ان اكتشف لهم الاوروبيون والامريكان النفط لماتوا جوعا وحسرتي غعليهم ماذا سيفعلون بعد ان ينتهي النفط اذا بقوا هكذا ساكنين حتى ذلك الحين ؟؟؟؟!!!!<br />ارفعوا ايديكم عن الادمغة العربية ويكفيكم \"أفينة\" لها الا ترون ما جنت ايديكم ؟ الا تعرفون ان العربي هو الاقل ابداها في العالم؟ ألا تعرفون ان العربي هو الاقل انتاجية فب العالم ؟؟ كل ذلك بسبب \"الأفيون\" هذا الذي تدسونه فيثنايا خطابكم الالديني او السياسي دون ان تدرون<br />كفوا ايديكم عن العربي المسكين لعله ينتفض فيزيل الطين عن دماغه فيكون مع المنطلقين .......... تبارك الله أحسن الخالقين خلق الانسان فس احسن تقويم وانتم له مشوهين ولفكره قامعين ولحقوقه مانعين ولدماغه مطينين وله \"مؤفينين\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134331/http://www.20at.com/article2.php?sid=517"

[[comments]]
