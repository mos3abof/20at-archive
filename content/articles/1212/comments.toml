subject = "من غير جندر بنات ونسوان الاردن شراميط"
author = "وحداتي"
posted = "2006-04-20"
text = "من غير جندر بنات الاردن شراميط ونسوانهم قحبات الزوجة عندهم بنيكها الاب والعم والخال والجار وبعدين بيجي الغريب وروح جرب في عمان والوحدات لانهم لايقهمون معنى الاسره او الشرف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134331/http://www.20at.com/article2.php?sid=517"

[[comments]]
order = 9
subject = "رد على الوحداتي"
author = "فلسطيني من الاردن"
posted = "2006-04-28"
text = "إلى القواد المكني باسم وحداتي من أين ما كان وأينما كان<br />أولا أنا إنسان زرت 17 دولة عربية ورأيت وفعلت لآني كنت جاهلا ومن ثم تبت إلى ربي فليس هنالك في العالم على الإطلاق اشرف من أهل الأردن بكافة أصولهم ولا من أهل فلسطين<br />فقد كان المجتمع الأردني قبل اجتياح الكويت وحضور زبالة الكويت من كافة الأجناس سواء أردنيين وفلسطينيين ممن عاشروا خنازير الكويت.من اطهر المجتمعات العربية كنت أنا احد الباحثين الشبقين عن الزنا ولم أكن أجده في عمان وكنت أجده في كل دول الخليج والعراق وسوريا ولبنان ومصر ولكن بعد هذا التاريخ توسخ المجتمع الأردني بوصول أخواتك القادمات من الكويت وأصبح الزنا واللواط بأمثالك على قارعة بيتكم وفي داخل حرمة دارك."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134331/http://www.20at.com/article2.php?sid=517"

[[comments]]
order = 10
subject = "الجندر موجود في الساحة الهاشمية"
author = "ديانا كرزون"
posted = "2006-05-09"
text = "الجندر موجود في الشساحة الهاشمية<br />المقصود بالجندر هو:- تحول الرجل الى امرأة (مخنث) والعكس صحيح<br />فاجندر مصطلح ماسوني يهدف الى الإنحلال الأخلاقي بحيث تتحدى المرأة الرجل وتصبح لها مزايا مثلها مثل الرجل فتستطيع أن تتحول الى رجل في المجتمعات الغربية اذا أرادت ذلك عن طريق عملية جراحية وتركيب عضو ذكري لها والذكر هناك يستطيع ان يتحول الى امراة (مخنث) عن طريق اسئصال عضوه الذكري والعمل على نفخ أثدائه بعملية جراحية بسيطة وهكذا شرعت بعض الدول الغربية الزواج المثلي وعلى رأسها أمريكا واسرائيل والدانمارك واسبانيا وكندا ، وهذا ما يريده الغرب من أجل محاربة الإسلام وجعل المسلمين تابعين لهم في تقاليدهم وعاداتهم القذرة .<br />وفي الأردن نلاحظ في الساحة الهاشمية أنه يوجد بعض الصبية الأردنيين يقومون بتخنيث أنفسهم من أجل لفت انظار اللوطيون (تبعين الولاد)حتى يأخذوهم معهم عبر سياراتهم وشاحناتهم الى الشقق والفنادق التي يمكها تبعون الولاد وخاصة الخليجيين منهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134331/http://www.20at.com/article2.php?sid=517"

[[comments]]
order = 11
subject = "اللهم رحماك"
author = "ابو على"
posted = "2006-05-19"
text = "لا حول ولا قوة الا بلله...يا ناس لمادا تجلدون داتكم اكثر من اللازم..الكلام هو حول الجندر وليس حول نشر الغسيل..وجب مناقشة الفكرة..وليس ماخفى من مجتمعاتناالمريضة اصلا..<br />نفس الاسلوب نتبعه مند خروج الاستعمار و هو نشر الغسيل لبعضنا البعض..اللهم رحماك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134331/http://www.20at.com/article2.php?sid=517"

[[comments]]
order = 12
subject = "ايه العرب"
author = "مقهور"
posted = "2006-06-19"
text = "السلام عليكم<br />لعن الله المتشبهين بالنساءوالمتشبهات بالرجال<br />اخواني انتم مسلمون وتعرفون دينكم وتعرفون كيف تربون ابنائكم لماذا النقاش والحوار والله لو كل رب بيت انتبه لاسرته لم يحدث هذا من اساس<br />والله لو كل واحد تمسك بدينه وعقيدته وعلمها اهل بيته لم ترا منكرا في شوارعنا<br />والله لو كل واحد امر بالمعروف ونهى عن المنكرلاصبح مجتمعا خالي من الفساد<br />قال تعالى((كنتم خير امةاخرجت للناس تامرون بالمعروف وتنهون عن المنكر))<br />كل راعي مسؤل عن رعيته<br />اخواني نحن نعيش اليوم في عالم مليء بالفسادالخارجي وموقفنا ان نتماسك يدا بيد للقضى عليهولو تنظر لاايات القران وتتمعن تجد اننا نعيش في فتن عظيمه ومشاكل لحل لها الا العودة الدين الله القويم والتمسك به.<br />فتن كقطع الليل المظلم نسال الله الثبات والهديه والنصر على الاعداء .<br />كلمه اوجهها الى كل مسلم تهادوا تحابوا اجعلوا كلمتكم واحده بوجوه الاعداء."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134331/http://www.20at.com/article2.php?sid=517"

[[comments]]
