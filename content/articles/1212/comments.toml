posted = "2006-09-02"
text = "اكيد خواتك مجوزات مع اردنيه يا ابن الشرموطه لانه انتم من قود على خواتهم وسكنوا ببيوت بعد ما كنتم نور لا بيوت عندكم والان اصبحتم من اصحاب العمارات وايري بكل اهلك وعلى فكره كل الي نكتهن من بلدك يا ابن الكلب"
