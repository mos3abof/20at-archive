subject = "رد على المسمى الوحداتي عديم الشرف"
author = "بقعاوي"
posted = "2006-06-25"
text = "كيف لهذا المسمى الوحداتي عديم الاخلاق والشرف ان يصدر حكما على بنات ونساء الاردن بانهن مثل ما قال فاذا كنت وحداتيا فعلا وتقول تعالو وشوفو في عمان والوحدات فدل امثالك على بيتكم لأنهم سيجدون ضالتهم فيه ايها النذل القواد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134331/http://www.20at.com/article2.php?sid=517"

[[comments]]
order = 14
subject = "مهم جدا"
author = "مبيد الحشرات"
posted = "2006-08-23"
text = "إلى كل من أدلى بدلوه فاعلم -اذا كنت مؤمنا- بأنك ستقف بين يدي الله عزوجل عاريا ذليلا ضعيفا وستحاسب على كل كلمة، ولو كنت شجاعا لقلت ما قلت على الملأ ؛لكنني أترفع عن الرد على هكذا أناس وبالفعل إني لأدعو الله أن يذلكم ويسلط عليكم من لا يخافه ولا يرحمكم. وللعلم فإن كل مكان فيه الصالح والطالح وواجبنا هو الأمر بالمعروف والنهي عن المنكر ومن أراد أن يتحدى الله ولا يعجبه كلام رب العالمين فأتمنى أن يمتلك الشجاعة ويقول ذلك على الملأ وأنا أعلم أنه لن يفعل : أتعلمون لماذا ؟ لأنه سيموت ضرباًبالنعال . تذكر أو لا تتذكر أن لك ربا خلقك من ماء مهين وإذا بك تتبجح وتتعجرف وكن على ثقة أنك عبارة عن كتلة من القذارة ولا تساوي شيئا إلا بالتقوى<br />والله من وراء القصد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134331/http://www.20at.com/article2.php?sid=517"

