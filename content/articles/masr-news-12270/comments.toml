posted = "2009-06-05"
text = "\"يا ريت مصر ترحلنى<br />ليتنى كنت(عمرو خالد)هاهاهاهاها هاهاها<br />باطل باطل باطل<br />مناف و مخالف للدستور و القانون و الاعراف الدولية<br />اتفوا على الحمار الغبى اللى أصدر ذلك القرار بالترحيل<br />يا ريتنى كنت (عمرو خالد)علشان يرحلونى خارج مصر<br />أستجب لى ياللة انت مجيب الدعاء"
