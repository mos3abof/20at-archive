text = "الى شيخنا الجليل(عمرو خالد)<br />أشكر ربنا ان النظام رحلك؟!!!<br />مليون مليون مليون مليون الف مرة من ان يتم و ضعك ظلما و زورا و بهتانا على (قوائم اللمنوعين من السفر)<br />قولوا لى يا ناس ياهوووو<br />فين المستشار اللى بيشتغل (نائب عام)<br />هو بيعمل اية بالضبط؟!!!<br />ما تفهمونى أصل انا الظاهر بقيت حمار و بافهم؟<br />ها ها ها ها ها ها ها ها ها"
