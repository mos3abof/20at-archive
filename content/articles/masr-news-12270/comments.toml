text = "يا جماعة عمرو خالد نفسه نفي موضوع الترحيل ده في المصري اليوم لكنه ما انكرش المضايقات الامنية ووقف المشاريع<br />ربنا يرحمنا من اللى عايزين يملوا البلد رقاصات و حرامية و بيحاربوا أي واحد عايز يخدم الناس و يقول اتقوا الله<br />و انا بقولهم كلهم \" اتقوا الله\""
