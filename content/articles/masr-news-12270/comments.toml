subject = ""
author = "ترحيل عمر خالد"
posted = "2009-06-04"
text = "ترحيل عمر خالد من عزبة ابوهم<br />العزبه اللي سابهاله السادات واللي سابها للسادات جمال عبدالناصر<br />عمر خالد الوحيد الذي يجب ترشيحه لرئاسة مصر<br />لا اخوان مسلمين ولا كفاية ولا ولا ولا ولا اي حد<br />عمر خالد الوحيد اللي ينفع يبقى قائد وزعيم لوجه الله تعالى<br />حفظك الله يا عمر خالد ونصرك"
archived = "2009-06-07"
capture_url = "https://web.archive.org/web/20090607073309/http://www.20at.com:80/2khbar/12270-2009-06-04-06-34-22.html"

[[comments]]
order = 1
subject = ""
author = "ابو الغباء"
posted = "2009-06-04"
text = "ابو الغباء قرر ابعاد عمرو خالد الى لندن - وبفعلتة هذة يتخيل ابو الغباء ان فم عمرو فى لندن لن يتكلم<br />فى لندن فية استديوهات ومحطات ومكاتب لمحطات تليفزيون هتشترى حلقاتة وتذيعها احسن من وجودة فى القاهرة<br />ابو الغباء فاكر ان الهواء المصرى فية القنوات المصرية بس وكاننا فى عام 1960<br />الاقمار الصناعية تنقل 600 قناة عربية فى الاجواء المصرية<br />يعنى عمرو خالد هيدخل البيوت هيدخل البيوت<br />مش قادر افهم الغباء دة ليس لة حل<br />امتى هيجيبوا ناس بتفهم"
archived = "2009-06-07"
capture_url = "https://web.archive.org/web/20090607073309/http://www.20at.com:80/2khbar/12270-2009-06-04-06-34-22.html"

[[comments]]
order = 2
subject = ""
author = "مسلم و كلى فخر"
posted = "2009-06-05"
text = "إلى الأخ العزيز عمرو خالد<br />أصبر فإن العاقبة للمتقين … طبعا أخى الكريم انت مش محتاج انى اقولك ان أرض الله واسعه و أن رسالتك ان شاء الله هاتوصل و إن هذا هو قدر المجاهدبن فى سبيل الله<br />نحسبك على خير أخى و لا نزكى على الله أحد … والله أنى أحبك فى الله<br />أخوانى لا تنسونى من صالح دعائكم"
archived = "2009-06-07"
capture_url = "https://web.archive.org/web/20090607073309/http://www.20at.com:80/2khbar/12270-2009-06-04-06-34-22.html"

[[comments]]
order = 3
subject = ""
author = "مش مهم"
posted = "2009-06-05"
text = "ايه العنوان الغبي ده ردود فعل ايه اللي واسعة ..الا ما حد سأل فيه اصلا<br />كفاية تخريف وضحك ع العقول بأه..عمرو خالد ايه اللي انتو لسه فاكرينه داعية ..ارحمونا بأه لوجه الله …يا عالم امن ايه اللي بيرحل ده ليه هو عمرو خالد عمل ايه اصلا يخالف الحكومة ده الراجل مستأنس جدا ويكاد يكون هيبوس ايد الحكومة علشان ترضى عنه<br />هو عمرو خالد كل شوية لازم يطلع له بفرقعة اعلامية علشان يلفت الانظار ليه !! الامن رحله …تجري الصحافة هو الأمن رحلك يا عمرو ؟ يرد عمرو بمسكنة لأ محدش قالي حاجة ..ويقوم يسافر لندن يشوف البيزنس مع صديقه ومدير اعماله د.محمد يحيى (طليق حنان ترك و أبو ابنها محمد ) يقوم الهبل يتصلوا بيه ..انت فين يا عمرو ؟ يتمسكن اكتر يقول انا بحب مصر ومقدرش اشتم فيها وانا برة ..انا وطني وطني وبطنطن!!<br />بلا قرف"
archived = "2009-06-07"
capture_url = "https://web.archive.org/web/20090607073309/http://www.20at.com:80/2khbar/12270-2009-06-04-06-34-22.html"

