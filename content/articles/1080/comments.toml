[[comments]]
order = 4
subject = "اللحية فى الاعمال الفنية"
author = "عا صم"
posted = "2006-01-22"
text = "لى تعليق وقد يكون غريباولكنهاحقيقةالمؤلفون اصبحوا يدمنون استخدام اللحية كرمز لجماعات العنف والارهابوهى صورة فيهاظلم للملتزمين فليس كل ملتحى ارهابى وليس كل ارهابى ملتحى كماايضا وهذا جاء فى اكثر من فيلم ليس كل من ساير تللك الجماعات كان رغبة فى الانتقام او البحث عن القوة فالكثير انخرط لمظنته ان ذلك هو طريق الحق والهدى ولميكن سوى ضحيةلكبار ومنظرى تللك الجماعات يتبقى ان اقول ان كل مؤلف اراد لفيلمه الاثارة استخم هذه الشريحة خاصة وحيد حامد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131916/http://www.20at.com/article2.php?sid=287"

[[comments]]
order = 5
subject = "بدون عنوان"
author = "The Dead"
posted = "2006-03-02"
text = "شفت 3 أفلام<br />أول واحد ظرف طارق : فعلا أحمد حلمى حلم مستقبل الكوميديا لأنه يقدم كوميديا راقية<br />التانى فتح عينيك : فيلم كويس بس فيه حاجات تقليدية من الأفلام العربية ودى أكتر حاجة ممكن تقلل الفيلم فى نظرى<br />الثالث : ويجا وهو أكتر فيلم عجبنى رغم التجاوزات اللى فيه بس جو الفيلم والإخراج والتمثيل أكثر من أكثر من رأئع خصوصا شريف منير بعد بطل الفيلم الأول طبعا خالد يوسف ثم هانى سلامة وتقديم ممثل ممتاز محمد الخلعي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131916/http://www.20at.com/article2.php?sid=287"
