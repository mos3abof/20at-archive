[[comments]]
order = 1
subject = "سينما فى شنك"
author = "خالد"
posted = "2006-01-19"
text = "و اللة معاك حق فى اللى انت بتقولة و اللى الاستاذ اللى معاك فى السؤال قالة انا بجد فرحان اوى ان الحمد للة مش لوحدى اللى بافكر فى موضوع التدين او تقديم الاسلام بشكل صح فى الافلام انا مش فاهم لية لازم فى كل فيلم لما يطلعوا واحد بذقن يباة خلاص ارهابى و متطرف و كل همة انة يقتل اى حد مش متدين معظم افلام عادل الامام دة بيشوةصورةالمحجبات عن و الرجالة اللى بتذوقن و الهم دة<br />عومرى ماشوفت فيلم كدة بيحسن صورة البنات المتحجبات و حتى لو دة حصل زى فيلم صايع بحر ليسمين عبد العزيز شوفنا الحجاب العبيط و سورى فى اللفظ لاكنها كانت بنت شلء اوى و اسلوبها وحش دة غير الفاظها ف لية كدة؟؟؟ لية علشان يضكوا الناس يترقوا على دينهم؟؟؟<br />علشان كدة انا باحب مووت حمحد سعد رغم تفتهة افلامة ااا انها محترمة جدا جدا جدا و مش بيجيب مواضيع تشوة فى صورة الاسلام انا شخصيل بادخل الفيلم اللى بيعملة اكتر من 3 مرات و بباة مرتاح انى اخد اختى الصغيرة او اخويا الصغير باباة متاكد من انو مش هيشوف حاجة واحشةتخدش حياء اختى او عفرت فكر اخويا<br />يا جمااااعة احنا لازم نفوق شوية و الناس اللى بيقدموا البلاوى دة تتقى اللة شوية تعرف انها بتبوظ دماغ اجياااااااااااااال<br />و شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131916/http://www.20at.com/article2.php?sid=287"

[[comments]]
order = 2
subject = "\"لا تجادل ولا تناقش يا اخ على\""
author = "مصــegyـــري"
posted = "2006-01-19"
text = "اللي انا مستغربله اوي<br />فيلم دم الغزال ده !!!<br />هي مش المفروض النغمة دي خلاص قدمت<br />اقصد نغمة الاسلاميين المتطرفين و \" امير الجماعة\" و الحوارات اللي اثبتت انها فكسانة<br />خاصة بعد ان اثبت الاخوان في الانتخابات ان فيه اسلاميين مسالمين وهم الغالبية في مجتمع الاسلاميين .<br />اللي عايز اقوله ان فكرة تخويف الناس من الاسلاميين عبر السينيما اصبحت قديمة و غير مناسبة الا لفترة التسعينيات المنصرمه<br />يبقى فيلم زي ده دلوقتي .. ايه لزمته .. الله اعلم !!<br />اما عن فكرة اللجوء للدين في الازمات<br />فرغم ان فيلم ( سقوط بغداد ) هو الوحيد اللي ذكرها<br />لكن حتى الفيلم ده اغفل دور الاسلاميين المعتدلين في النضال من اجل القضية ايا كانت<br />فلا ترى من المناضلين في الفيلم سوى النضال اليساري و المناضلين يطبعون المنشورات في الخلية و المظاهرات اليسارية الطعم<br />رغم ان في المظاهرات من هذا النوع .. لم نرى ( على الاقل في الجامعة) الا مظاهرات طلاب التيار الاسلامي من اجل فلسطين او العراق بينما انحصر دور شباب اليسار في المؤتمرات و بعض الكلمات النارية في مظاهرات الجامعة اللي بينظمها التيار الاسلامي<br />يبقى ازاي يحصر الدور النضالي للشباب في اليساريين كما هو واضح في الفيلم<br />مجرد تساؤل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131916/http://www.20at.com/article2.php?sid=287"

