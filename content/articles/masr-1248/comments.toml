text = "انا فتاة احب ولدا و لكن لا يعرف بانني احبه وايضا انا لا اعرف بانه يحبني ولكن صارحني يوما قالهالي عن طريق الانترنيت وهو كان يقرا معي في القسم ومن دلك اليوم لم يعد يتكلم معي"
