text = "في كتير من كلامك صح . . لو مش كله لكن برضه براحه علينا شويه في بنات بتقرا الكلام ده .. خفف من الفلظك شويه ,, و على فكره انا ابن ناس بس من الطبقه المكافحه … معنديش شقه .. و عندي 128 … و ابويا و امي بيدفعوا كل الاقساط … بخرج و بهيس بس مش بال 500 و ال 600 فالليله .. 50-100 في ليله نحلف بيها لحد الخروجه التانيه … بقعد على قهاوي بلدي .. بشيش تفاح بلي \" عــام \" .. نوعا ما مثقف . ولا يمكن اشتري لبسي من حته ذي العتبه او الوكاله او شبرا … وسط البلد اضعف الايمان :]:]"
