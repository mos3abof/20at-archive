[[comments]]
order = 48
subject = "................ أين سعة الأفق"
text = "أنا لا أجامل و لا أعادي.. ستار أكاديمي هذه شيء جميل.. لو..<br />لو كنا أمة العرب.. العظيمة.. بدينها و أخلاقها قبل كل شيء.. و العظيمة بأمجادها و إنجازاتها الحضارية..<br />و هنا أتكلم بصيغة الماضي طبعا.. دون تحسر أو شيء من هذا القبيل..<br />فقط للشهادة..<br />قلت إذن لو كنا أمة زخمها أكثر من زبدها.. و غثائها..<br />إنتاجها الفكري.. و الصناعي..<br />وزنها الإقتصادي.. أو التجاري..<br />غير معدوم.. غير مدفون تحت هموم الفقر الذي يهدد أغنى أغنبائها.. مثل بلدنا العزيز السعودية..<br />و كيف لا.. و كلكم قرأ ما سلف.. و حسبنا الله..<br />أمتنا يا أحبتي أمة إقرأ نصفها لا يقرأ..<br />فإذا عدنا إلى ظاهرة الأكاديمية..<br />هل هي وبال أم مجرد منفس للهموم التي..<br />لا منفس لها..<br />و نحن أمة تتفنن في كبت الفرد.. الفكر.. و الحرية..<br />لتطلقها في ما لا ينفع و لا يفيد.. الفن..<br />و بالخصوص ما هبط منها.. و ما شغل الحواس.. و ما قتل الإحساس..<br />أحبتي.. أنا لست ضد الفن الملتزم و المبدع حقا..<br />أو ضد الترفيه الراقي.. بالعكس يا حبذا..<br />و لكن..<br />لو كنا أمة تليق بأكاديمية للفنون.. و النجوم<br />لكانت أكاديمية النجوم و الفنون تليق بنا.."
archived = "2005-02-05"
capture_url = "https://web.archive.org/web/20050205034255/http://www.20at.com:80/article.php?sid=199"

