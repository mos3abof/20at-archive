text = "انا اسمي حنين من مصر العروبة الحبييبة اعبر عن كل شكر والتقدير الي موقعكم الرائع البناء--واشكر العميدة الفاضلة علي عدم تجاوبها مع السخيف اللي اسمعه محمد عطية0000 واقول اوقفوا هذه البرامج الحمقاء العفنة الرذيلة التي تقوم بتمويلها امريكا ودول الخيليج الشقيقة العميلة لاامريكا--صدقوني تصرفات محمد السحفية في هذا البرنامج اساء لكل مصري مسلم غيور علي العروبةومصرhanneen_z002@hotmail.com"
