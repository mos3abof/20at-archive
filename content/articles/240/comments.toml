subject = "فنون مريوم من السعوديه"
text = "بسم الله الرحمن الرحيم<br />على الرغم من كوني سعوديه<br />الا اني صوت الى محمد عطيه<br />في البرايم الاخير<br />لين وصلت فاتورت تلفون 700 ريال سعودي<br />فقط لتوصويت<br />وعلى العكس تماماً<br />انا فرحانه مررررره لانه اهو ستار<br />كنت اتمني يكون محمد خلاوي<br />عشان اخلاقه وعفته<br />بس محمد عطيه يستاهل<br />يكفي انه يشبه اخوي<br />واخوي ديماً يقول لي<br />سوي شعري مثل محمد أتيه<br />معليش صغير مايعرف يتكلم زين<br />بصراحه حاولت الوصول الى محمد عطيه<br />واني اوصل له صورت اخوي<br />بس للأسف ماعندي شي يوصلني فيه<br />حتى ايميله<br />ودي ارد على اللي يشتمون<br />واقول لهم كل انسان وله وجهة نظر معينه<br />واذا هذي كانت وجهة نظرهم مو معناتها صحيحه<br />ماودي اطول اكثر بس اذا عندهم شتم يبون يشتمون فيه<br />ياريت لو يحطون نفسهم مكان محمد عطيه قبل مايقولونه<br />مفروض يكونون معاه<br />مش ضده<br />وكلمة اخيره الى محمد عطيه<br />اذا كنت تقراء الردود<br />ياريت<br />لو انك تعطيني خبر<br />fnon_mariom@hotmail.com"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926034120/http://www.20at.com:80/article.php?sid=199"

