posted = "2006-01-31"
text = "كلنا نتمنى في قرارة انفسنا ان تكون فترة الخطوبة اطول وان يمنح الاهل الفتاة الثقة الكاملة فهي تستطيع حماية نفسها من خطيبها ولو حدث هذا فسيتعرف كل طرف الى الآخر من دون تمثيل وتصنع اما عقد القران فالكل يعرف انه زواج وارتباط نهائي وليس من السهل اتخاذ قرار الانفصال لانه يعني طلاقا بالنسبة الى البنت لذلك من الافضل تأجيله لبعض الوقت."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113814/http://www.20at.com/article2.php?sid=341"

