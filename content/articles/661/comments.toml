author = "لو كنت أنت والد العروسة، هل ستسمح لمن يتقدم لخطبة ابنتك برؤيتها؟"
posted = "2006-01-27"
text = "على طريقة عيدالفتاح القصري : لا ممكن أبدأ أسمح بهذا المصيبة يحدث أمام عيني، ولكن من ورايا، ليس هناك مانع.<br />على طريقة يوسف وهبي : ها ها ها.. ياللعار عريس بنتي يشوفها قبل الجواز... وا مصيبتاه... لايسلم الشرف الرفيع من الأذى حتى يراق على جوانبه الدم... لن أسمح ابدا بخطبة ابنتي لشخص تقدم لها دون ان يراها...ها ها ها"
