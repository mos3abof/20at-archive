text = "آه طبعا موافقه وليه لاء.بالعكس الرؤيه مهمه جدا وعليها عامل كبير وانا بختلف مع الرأي اللي بيئول ان الرؤيه مش مهمه مش اقصد الجمال أو لا لكن روح الذي تحدثه بتبان من ملامحه.<br />والختلاف في الراي لا يفسد للود قضية"
