[[comments]]
order = 7
subject = "قبل عقد القران"
author = "شيخه"
posted = "2006-01-30"
text = "افضل فترة الخطوبة قبل عقد القران وبموافقة من الأهل طبعا وتحت اشرافهم فهذا أفضل من لقب مطلقه بالنسبة لي . فالخطوبة بعد عقد القران لا فائدة منها فهي لن تنفعني بشئ لو وجدت أن الرجل الذي تقدم لخطبتي غير مناسب لي ، لذلك أنا أحبذها بدون عقد قران وبعلم الاهل ومدتها لا تزيد على شهر. وذلك من أجل تفادي المشاكل التي من الممكن أن تحصل لو عقد القران قبل معرفة حقيقة أخلاق المتقدم للزواج . وفترة الخطوبة ان كانت بعلم الأهل لن تتسبب للفتاة بأي ضرر لان التعارف سيكون غرضه الارتباط بالحلال وطبعا هذا التعارف بدون خلوة به بل بوجود أحد من الأهل مع المخطوبين. ويجب الا تزيد اجتماعاتهم مع بعض على 3 مرات بالكثير. ومن الممكن أن يتحدثوا مع بعض بالهاتف للتعارف اكثر وهذا بالفعل يحقق الانسجام ويعتبر أفضل من الارتباط والتورط بزواج غير مناسب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113814/http://www.20at.com/article2.php?sid=341"

[[comments]]
