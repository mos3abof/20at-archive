subject = "أحب ألعب في خط الوسط"
author = "أكرم بس"
posted = "2006-01-28"
text = "و الله انت حر<br />عليز تشوف روح للي يخليك شو<br />ايه اللي يجبر واحد يجوز واحدة مشافهاش<br />اعتقد انا الناس ببرودهم و عدم اعتراضهم و عدم وجود رد فعل ليهم على الاوضاع الخاطئة هو اللي بيكرسها و يخليها عادات ( بس ) مش تقاليد<br />بس مش معنى كده انهم يفتحوها ع البحري<br />خلينا في النصف احسن<br />و سلملي على محمد شوقي و حسن مصطفى<br />و معتز اينو عشان محدش يقول ان انا متعصب<br />و مبروك لمصر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113814/http://www.20at.com/article2.php?sid=341"

[[comments]]
order = 4
subject = "بعد القران"
author = "مناير"
posted = "2006-01-28"
text = "فترة الخطوبة لا تكون في مجتمعنا إلا بعد عقد القران أي بعد أن يكون الرجل أصبح زوجها بالفعل وهذا أفضل لأن مجتمعنا مجتمع محافظ لذلك لا توجد عندنا فترة خطوبة قبل عقد القران والسبب خوفهم على بناتهم من سوء عواقب فترة الخطوبة، وان كان الرجل والمرأة يرغبان أن يدرسا أخلاق بعض فهذا بعد الزواج وليس قبله كما هو حاصل في اغلب المجتمعات الأخرى . ومع العلم أن هناك الكثير من البنات الطيبات حصلن على لقب مطلقات رغم عذريتهن بسبب هذا الأمر لأنهن ارتبطن بأشخاص ليسوا أهلا للزواج وظهر بعد ذلك عدم توافق بالفكر والأخلاق.ولكن يظل موضوع الخطوبة قبل عقد القران شيئا حساسا ولا يقبل به أحد."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113814/http://www.20at.com/article2.php?sid=341"

[[comments]]
order = 5
subject = "طلب من عشرينات"
author = "السلام عليكم"
posted = "2006-01-28"
text = "اعتقد انه عشرينات سمعت زي اي حد تاني بقضية تهجم الدنمارك على الرسول صلى الله عليه و سلم<br />لماذا لم يطرح اي موضوع حتى الان ؟؟؟<br />و السؤال الاهم : لماذا لم يطرح اي موضوع للتعليق على ما قامت به المملكة العربية السعودية جزاهم الله خيرا و ردهم كان اقوى رد على المستوى الحكومي ؟؟؟؟<br />اتمنى ان لا يكون اخوانا في عشرينات بيكتبوا عن الدول العربية الشقيقة في النقد و التهجم و السلبيات بس زي لاصحافة الصفراء .. اتمنى انهم يشدوا على ايد اللي يقدم خدمة للاسلام و يشيدوا بيها زي ما بتنتقدوا بشدة و احيانا باسلوب مش كويس الحاجات الخطأ في بلدانا العربية<br />و لا ايه يا عشرينات ؟؟<br />خلينا نكون حقانيين مع الناس ، و اللي كل شوية يقولي آل سعود و آل ما عرفش ايه يا ريت يتكلم دلوقتي و يقول ال سعود عملوا ايه لنصرة محمد صلى الله عليه و سلم<br />جزاكم الله عنا كل خير يا اهل السعودية و كل مسلم في اي بلد مسلم قدم حاجة في القضية دي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113814/http://www.20at.com/article2.php?sid=341"

