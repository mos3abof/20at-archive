[[comments]]
order = 2
subject = "هناك اشياء حلوة جدا"
author = "هناك اشياء لا تعجبنا في السعودية زي اي بلد فيه حاجات كويسة و حاجات مش كويسة"
posted = "2006-01-28"
text = "احب اشكر المملكة العربية السعودية على استدعاء سفيرها من الدنمارك ، جزاكم الله كل خير على هذه الخطوة لنصرة رسولنا و الله ريحتوا قلبي شوية بهذا العمل جزاكم ربي كل خير<br />_______________<br />السعودية تستدعي سفيرها لدى الدانمارك بسبب الإساءة للرسول<br />استدعت السعودية سفيرها لدى الدانمارك وبررت الرياض هذا الإجراء بعدم اتخاذ كوبنهاغن إجراءات كافية ضد الصحيفة التي نشرت رسوما تسيء للنبي محمد عليه الصلاة والسلام.<br />وقال مسؤول بالخارجية السعودية إن ما وصفه بعدم اكتراث الحكومة الدانماركية لإساءة صحفها للرسول أدى لتعقيد الأمر فتم استدعاء السفير محمد الحجيلان للتشاور.<br />وأعربت الرياض عن أسفها واحتجاجها على موقف الحكومة الدانماركية من موضوع الإساءة للإسلام والمسلمين.<br />يأتي ذلك بعد أن حث مفتي السعودية الشيخ عبد العزيز بن عبد الله آل الشيخ الدانمارك على معاقبة صحيفة جيلاندز بوستن التي نشرت نحو 12 رسما مسيئا للنبي في سبتمبر/أيلول الماضي.<br />ودعا بيان المفتي السعودي الحكومة الدانماركية إلى إجبار الصحيفة على الاعتذار عن هذه الجريمة الشنعاء وفرض عقوبات رادعة على كل من شارك فيها.<br />وتشهد السعودية حاليا حملة تدعو بعدة وسائل مثل رسائل الهاتف النقال إلى مقاطعة المنتجات الدانماركية.<br />وفي كوبنهاغن أعلنت شركة أرلا فودز -أكبر الشركات المصدرة- أن المنتجات الدانماركية مهددة بحملة المقاطعة. وصرح المتحدث باسم الشركة بأن أصحاب المحال التجارية يقومون بسحب منتجاتها من أماكن العرض والعزوف عن استيراد المزيد منها لأن المستهلكين لا يريدون الشراء.<br />وتصدر المجموعة الدانماركية السويدية إلى السعودية سنويا بما قيمته ملياري كورون دانماركي (268 مليون يورو) معظمها منتجات الزبدة والأجبان.<br />كان وزراء الخارجية العرب انتقدوا في اجتماعهم بالقاهرة الشهر الماضي عدم اتخاذ كوبنهاغن إجراء إزاء الصحيفة. وأمام تصاعد الغضب العربي والإسلامي دافع رئيس الوزراء الدانماركي أندريس فوج راسموسين مطلع الشهر الجاري عن حرية التعبير، لكنه حث الدانماركيين على ممارسة هذا الحق دون التحريض على الكراهية ضد المسلمين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113814/http://www.20at.com/article2.php?sid=341"

[[comments]]
