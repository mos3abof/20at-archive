subject = ""
author = "نيفين نيفى نوفا"
posted = "2007-05-19"
text = "عرابى و عبد الناصر مش هما بس القاده اللى يمكن قادو شعوبهم للهاويه..للاسف يا جماعه احنا تاريخنا مليان باخطاء حكام و خيانات ادت الى كوارث<br />و المثل اللى بيقول ان كنت لا تعلم فتللك مصيبه و ان كنت تعلم فالمصيبه اكبر بينطبق على فترات كتير فى تاريخنا<br />و هو ما لا يقر به دراويش عبد الناصر اللذين لطاما تشدقو بمقوله مكنش يعرف<br />و مكنش يعرف دى هى اللى ودتنا ف داهيه<br />مكنش يعرف ان المشير غارق ف ملذاته و سايب البلد تولع<br />مكنش يعرف اللى بيعملوه شيوخ القبائل ف اليمن بزهره شباب مصر اللى بعتهم للنار<br />مكنش يعرف اللى بيحصل ف المعتقلات على يد صلاح نصر و مرؤسيه و على راسهم المشير<br />مكنش يعرف و لا كان عارف و مطنش و لا عارف وراضى بحجه حمايه الثوره اللى اول ما اكلت اكلت ولادها<br />و لكى لا اظلم الرجل انا لا انكر عليه حبه للبلد بس برده غلطات الحكام غير مغفوره لانها بتضيع شعوب<br />انا كمواطنه لما احب بلدى بشكل غلط هازى نفسى او عيلتى او جيرانى او مجموعه معايا لكن لما اكون حاكم و اغلط او ينضحك عليا من الحاشيه بتاعتى انا كده بضيع شعب<br />عبد الناصر حب البلد بس غرقها..و من الحب ما قتل..زى لما تحضن حد اوى لدرجه انك تخنقه<br />ملحوظه:انا اتكلمت عن حقبه عبد الناصر و الله مش لانى قاصده اعلن سخطى لانى انا موقفى من الحقبه الناصريه معروف و معلن للجميع و بتقبل الراى الاخر فيه بشكل واضح و المعلقين عارفين بس انا فعلا خصيت الحقبه دى لانى مش ملمه بالحقبه العرابيه و معلوماتى فيها محدوده"
archived = "2009-12-04"
capture_url = "https://web.archive.org/web/20091204025236/http://www.20at.com:80/masr/egyptian-newspapers/5923.html"

