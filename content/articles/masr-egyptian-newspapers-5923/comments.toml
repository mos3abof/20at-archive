text = "انتم شرا ومكانا وابعد الناس عن هذا الوطن انتم اقل ما توصفون بالخونة واصحاب الاراء القاتلة لا يمكن ان تكون هذه مصر وهذا تاريخنا ان تشويهكم لتاريخ امه هو فعل قبيح وعمل سافل"
