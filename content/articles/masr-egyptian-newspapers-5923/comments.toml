author = "احمد مروان"
posted = "2009-02-08"
text = "اتقو الله وكفايه تزوير للتاريخ<br />يعنى اتنو بتاخدو التاريخ من افواه اللى خانو عرابى وباعوة للانجليز مش على مبارك دة اللى عرابى بعته يتفاوض مع الخديوى ولما راح ولقى ان الوضع فى صالح الانجليز هرب ورمرجعش لعرابى تانى<br />ليه بتتعمدو تشويه اى رمز جيد فى مصر كان مصر اتعدمت تنجب بطل بجد<br />ازى كان عرابى غلط فغلطته انه وثق بشويه خونه هم هماهم اللى كتبو عنه الكلام دة بعد ما باعوة<br />وبعدين مش الجيش التعبان دة هو برضه اللى وقف جيوش اقوى دوله فى العالم فى كفر الدوار 5اسابيع كامله وفشلت فى اقتحامها فى النهايه."
archived = "2009-12-04"
capture_url = "https://web.archive.org/web/20091204025236/http://www.20at.com:80/masr/egyptian-newspapers/5923.html"
