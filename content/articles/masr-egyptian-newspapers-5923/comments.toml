text = "لم أقرا مقال في حياتى يروي ظمأى ويحترم عقلي وفكري عن هوجة عرابي حتى قرأت مقال الاستاذة سناء البيسي الذي رد علي كثير من الاسئلة التى لم اجد لها اجابة لا في كتب التاريخ المدرسية ولا في مقالات الصحف الرسمية<br />كل الشكر والتقدير علي هذة المقالة الرائعة"
archived = "2009-12-04"
