subject = "الصبر جميل"
author = "صابر"
posted = "2006-09-03"
text = "السلام عليكم<br />اناشدكم يا معلمي فلسطين ان تعوداالى مدارسكم فهذه السياسة لا تخدم الا الاحتلال الصهيوني، وان هذا الاضراب لن يسقط الحكومة او غيرها، وانما الذي يتحمل المسئولية الجميع، وانتم تتحملون هذه الامانة التي تودون رميها عن كاهلكم، هذا حرام عليكم، ولا تصبرون في يوم المحنة، ولا تمدون ايديكم لهذا الشعب، اتقوا الله في انفسكم وفي طلابكم وابنائكم."
archived = "2006-11-02"
