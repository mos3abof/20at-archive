[[comments]]
order = 1
subject = "اكتبوها يمكن تنفعكم"
author = "Dabdoob"
posted = "2006-03-29"
text = "الموضوع جديد طبعا علي ناس كتير ولكنه قديم بالطبع بالنسبة لاي دارس للتسويق وفروعه المختلفة (والدعاية والاعلان جزء من عملية التسويق)<br />وهذا الاسلوب في رسم الساعة واساليب اخري كثيرة تستخدم لجذب العميل او المستهلك نفسيا فعلي سبيل المثال هل سالت نفسك لماذا يقولون ان سعر الوجبة 9.999 ولا يقولون 10 او مثلا 386 ولا يقولون 400؟؟؟؟؟<br />الاجابة بسيطة ...لكي تشعر ان الوجبة ثمنها اقل مما هي عليه بالفعل فيصل السعر الي عقلك علي انه 9 جنيهات وكذا وليس 10 او 300 وكذا وليس 400 . وهذا الاسلوب يسمي في التسويق اسلوب odd- even pricing تسعير الزوجي فردي ويختلف تاثير هذا الاسلوب من مكان لاخر .<br />وكفاية عليكم كده النهارده<br />اكتبوها يمكن تنفعكم<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115020/http://www.20at.com/article2.php?sid=630"

