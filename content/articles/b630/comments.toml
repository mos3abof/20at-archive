[[comments]]
order = 4
subject = "كتاكيت ستار اكاديمي"
author = "سوسة المفروسة"
posted = "2006-03-29"
text = "البنات الحلوين اللي فوق انتوا ما تعرفوش خطورة الكلام اللي بتقولوه ...انا هافهمكوا<br />من سنتين بدا ستار اكاديمي و كنت من اكتر الناس الي بيتابعوه ماكونتش بفوت حلقة و لا حتى ساعة من ساعات البث ع القناة المباشرة...و لما وصل محمد عطيه للنهائي صوتله بجنون و كنت بشجع الناس كلها عشان يصوتوله وكنت باخطف من ايديهم الموبايلات و اصوت بالعافية...كنت واخداها مسالة كرامة ووطنية حاجة زي ماتش كورة كده<br />و كسب عطيه و بقى نجم...المهم بعد كام شهر كده اتقبض عليه و هو سايق سكران<br />قعدت افكر ..التصويت اللي انا صوته و اللي خليت الناس يصوتوه ساهم و لو بشكل جزئي في مكسبه للبرنامج و هو اللي خلاه يتشهر و هو اللي بطريق غير مباشر برضه المسؤل عن شربه و ارتكابه لاي معصية<br />و بكده ابقي مشاركه معاه في كل ذنوبه اللي حصلت عن الطريق ده لاني بشكل او باخر ساعدته للوصول للي هو فية<br />صدقوني ما تخدوش الموضوع ضحك و هزار ...انا باندم كل يوم على اللي انا عملته ..ربنا يغفر لي...و دمتم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115020/http://www.20at.com/article2.php?sid=630"

[[comments]]
order = 5
subject = "فلسطينية معترضة"
author = "فلسطينية"
posted = "2006-03-30"
text = "تحياتي للجميع وخصوصا للذي يحضرون ستار أكاديمي لا مانع لدي من أوقات التسلية وأنا من أشد المشاهدين للبرنامج وخاصة أن به فلسطيني لاننا بحاجة لنشر كلمة فلسطين على العالم كله وخاصة العربي لانهم بدأ ينسون قضيتنا ونضالنا ولكن فاجأن فادي بأنه ليس بالمستوى المطلوب لتمثيل فلسطين وقضيتها حتى لو الموضوع فني فإنه ايضا بالنسبة لنا وطني لانه كل عمل لنا نربطه دائما بقضيتنا وأؤيد بشدة تعليق سوسة المفروسة واحيطكم علمنا أن النتيجة محسومة لصالح هناء وهاني كان كبش الفدا لهذا الاسبوع وجوزيف يحاولون ادارة البرنامج ارضاء ضمائرهم بايصاله الى النهائيات وعدم اعطائه اللقب مع انه بيستاهل وسلامي لكم جميعا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115020/http://www.20at.com/article2.php?sid=630"

[[comments]]
order = 6
subject = "صح"
author = "فلسطينى"
posted = "2006-03-30"
text = "انا معكن لكن فادى بيستاهل يصير نجم استار اكاديمى ؟؟<br />وبدى اعرف لما الفلسطينية تقول انو مو على مستوى المسئولية ؟؟؟<br />لكن انا بالفعل كتير حاب جوزيف لانة رجل 100 % لكن ليش هناء تصبح سوبر ؟؟<br />لا هناء ما بتستاهل تصير سوبر اللى عم يستاهل هو جوزيف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115020/http://www.20at.com/article2.php?sid=630"

[[comments]]
order = 7
subject = "اكيد"
author = "فلسطينية"
posted = "2006-04-01"
text = "اكيد جوزيف بيستاهل ولكن هناك اعتبارات اخرى للنجاج لدى الادارة مثل المال وانه لا يمكن تقادي المال من البلاد نفسها لبنان وان ذلك ممكن للدول الاخرى وكلامي ليس ببعيد الاسبوع المقبل ستتأكدو من كلامي -وهل تذكر في سوبر ستار عدم فوز عمار حسن وحتى ولو كان فلسطيني هناك اعتبارات اخرى(مالية)-وبنسبة لفادي هناك امور عديد من تصرفاته لا نستطيع الخوض بها الان ولكن اذكر بشئ يوم الاحد في SMS لم يعرف ماذا تعني كلمة طولكرم عندما راسلته قتاة من فلسطين وانا ما اعرفه ان الفلسطينين حتى المهجرين محفورة بلادهم بكل مناطقها في صدورهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115020/http://www.20at.com/article2.php?sid=630"

