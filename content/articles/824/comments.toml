text = "انا في الحقيقة لا اشاهد تلك القناة لوجود البديل عندي وهي القناة الرائدة قناة المجد الفضائية فلو عملت مقارنات بينها وبين قناة الرسالة او اي قناة اسلامية اخرى ستجد ان القناة الاسلامية التي لها الهدف المحدد والواضح هي قناة المجد ليس لانها سعودية بل شملت كلمة انها اسلامية بمعنى الكلمة فيكفيها انها لاتبث اي صور نسائية للحفاظ عن الفتنة ويكفي انها قد استغنت عن الموسيقى في فواصلها اكتفت بالحناجر الذ هبية لمجموعة من المنشدين بالاصوات الاكثر من راااااااااااااااائعة بعيدة عن الموسيقى المحرمة شاهدوها ولن تخسرو فسوف تبدلونها بجميع القنوات لانها تشمل نواحي الحياة ويكفي انها تربوية من الدرجة الاولى"
