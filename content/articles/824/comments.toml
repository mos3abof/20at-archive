author = "قناة الناس"
posted = "2006-08-23"
text = "السلام عليكم...<br />يا جماعة قناة الناس الفضائية المصرية بما تقدمه من يرامج وشيوخ أفاضل مشهود لهم أمثال فضيلة الشيخ محمد حسان وحسين يعقوب حلت مشكلة القناة الفضائية الاسلامية اللى احنا بندور عليها..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123709/http://www.20at.com/article2.php?sid=1122"

[[comments]]
order = 11
subject = "مقتطفات"
author = "مصطفى العماري"
posted = "2006-08-23"
text = "السلام عليكم ورحمة الله تعالى وبركاته:اعانكم الله ياالمقيمين والعاملين والمشاهدين لقناة الرساله والناس وهسال الله دوام الاعانةمنه لكم : اقول اخواني اذا كانت الرساله نورا فلا يجوز خلطها بظلام اذ ان نور وظلمة لا يجتمعان فاجعلوها نورا خالصا يهدي الى النور"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123709/http://www.20at.com/article2.php?sid=1122"

[[comments]]
order = 12
subject = "تعليق على مواضيع قناه الرساله"
author = "كارينا محمد"
posted = "2006-08-24"
text = "السلام عليكم ورحمه الله وبركاته اولا اشكر الدكتور طارق سوايدان رئيس القناه الرساله على هذه المجهود العظيم وجيزا اللله كل خير اا وشكر خاص لدكتور عبله الكحالوى وشفاء الله وعفيها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123709/http://www.20at.com/article2.php?sid=1122"

[[comments]]
order = 13
subject = "ما هو المبدأ؟"
author = "أمانى"
posted = "2006-08-26"
text = "السلام عليكم ورحمة الله وبركاته<br />الحقيقة انا متفقة فى الراى مع عقلانى فعلا غريبة اوى التناقض دة بما ان دى قناة دينية اذن يجب ان كل ما يقدم فيها لا يكون متناقض اريد انا اسال الاستاذ طارق سويدان هل اذا كانت زوجته مذيعة كان سيقبل ان تظهر هكذا بهذا التبرج مثلما تظهر المذيعات مثل عبير صبرى وصابرين مثلا انا لا اعيب فيهم كل انسان نيته عند خالقه ولكن هذا منهج يقدم باسم الدين وهولاء قدوة اذن اين المبدأ هل يجب على انا انتقى من القنوات الفضائية ما يصح وما لا يصح واذا كنت انا اقدر فماذا يفعل المبتدئون فى التدين<br />اختم كلامى با يجب علينا ان نتقى الله فى افعالنا وان نسير على مبدا واحد<br />والسلام عليكم ورحمة الله وبركاته<br />وارجو منكم ان تنا قشونى اخوانى فى وحهة نظرى اريد رايكم انا متعجبة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123709/http://www.20at.com/article2.php?sid=1122"

[[comments]]
order = 14
subject = "وش قالو قالو قناة اسلامية"
author = "ريم بنت السعوديةoooooooo"
posted = "2006-08-26"
text = "ي انا قات ها الشي قبل مايقوله عقلاني ........ كل دقيقة تخرج لنا قناة فضائية باسم اسلامية ومع ذ تظهر بموسيقى و وجه نسائي لايخلو من الاصباغ والميوعة والخضوع واللين في القول فيربون البنات على انه شيئ عادي انك تخرجين في قناة ومتلطخة بزينة واضعة منديل ويسمونه حجاب ........... انا قلت من قبل القناة التي تسمى اسلامية هي قناة المجد الفضائية بقنواتها التسع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123709/http://www.20at.com/article2.php?sid=1122"

[[comments]]
order = 15
subject = "قناة المجد الوهابية"
author = "حمد بن محمد_الامارات"
posted = "2006-08-27"
text = "مسااااااااااالخير<br />ليس من الانصاف ان نقارن قناة المجد الوهابية المملة بقنوات اسلاميه ووطنية مثل قناة الاحرار (المنار) عندما تراها تجمع في افكارها وبرامجها كل الافكار الاسلاميه والعقائد والمذاهب مع ايمانها الكامل بحوار الحضارات ولا فرق عندها في برامجها بين مسلمين سنة وشيعة وبين مسيح وديانات آخرى اليس من الظلم اننقارنها بقناة الجهل الوهابي المجد رجاء ارجعوا الى عقولكم والى قلوبكم وانصفوا بالحق فنحن نعرف من تتبع هذه القناة ومن يمولها وانتم تعرفون بس الظاهر ان ريم بنت السعودية وطنية في كل شي الظاهر انها ماسافرت بره عشان تعرف حقيقة قنواتهم وايش هدفها الاساسي صحيح الي اختشوا ماتو<br />وكلاا في قلبه شقى الي له<br />الامارات دار زايد دار الحب والخير والانسانيه والتعايش<br />دبي دار الحي<br />\"\" وطني الامارات \"\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123709/http://www.20at.com/article2.php?sid=1122"

[[comments]]
order = 16
subject = "ديني الاسلام منهجي القران"
author = "ريم بنت السعوديةoooooooo"
posted = "2006-08-27"
text = "يا ياحمد .... انت مالك تعليق على قناة الرسالة ليش حاشر نفسك بتعليق على المجد ياخي خلك منها مهوب غصب تتابعها خلك في قنواة الامارات الهبال كله ولا وحدة دينية من دبي لسما دبي ل الشارقة لقناة عجمان لمدري ايش .... بعدين وانا مووووووووواطنة مخلصة وكل السعوديين مخلصين في حبهم لوطنهم ;;;;;;;;;;; بعدين ديني علمني اية في القران ليس من نقل ولا حديث برواية مطعونة انما كلام الله قوله تعالى ... وقرن في بيوتكن .. وش لي بالسفر خارج هل هذ ايه وهابية كما زعمت هل للوهابيين قران لوحدهم نحن مسلمون .... امريكا دست لكم الدسائس وتصدقونها ب اننا وهابيين واننا ارهابيين ووووو يا رافضي اعقل ففي العقل سلامة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123709/http://www.20at.com/article2.php?sid=1122"

[[comments]]
order = 17
subject = "نصيحة لقناة الرسالة"
author = "أبوالزبير"
posted = "2006-09-04"
text = "يقول الله سبحانه وتعالى وتوبوا إلى الله جميعا أيها المؤمنون لعلكم تفلحون فأنصح القائمين على قناة الرسالة بأن يتقوا الله في أنسهم وأن يقدموا للناس الشيئ الحسن الصافي ولايخلطوه بالسم لأن الناس ليسوا أغبياء فيما يقدم إليهم , وعليهم أن يمنعوا ظهور النساء في قناتهم لانه ليس هناك حاجة في ظهور النساء أصلا ولا يحاولوا أن يوجدوا لأنفسهم مبررات وأعذار واهمة.<br />والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123709/http://www.20at.com/article2.php?sid=1122"

[[comments]]
order = 18
subject = "يا ليتني كنت معهم"
author = "المجريسي"
posted = "2006-09-05"
text = "السلام عليكم المشكله ياجماعه ان قناة الرساله ان كانت بتصلح من ناحيه ربنا يخلي روتانا وعلي وجه التحديد هاله سرحان او هاله شو اللي كل همها انهاعايزه تخلق بلبله في الفتاوى الشرعيه وما حدش دلوقت عارف مين اللي بيتكلم في الدين الفنانات ولا المذيعات اللي سافروا اوروبا وجايبين افكار معاهم تودي في ستين داهيه وكل اللي اتعلمت كلمتين تعمل فيها ام المؤمنين والله انا شايف ان قناة الرساله جميله بس من غير نهنهة نسوان وما اتمناه هو ان اكون من المساهمين في نشر الدين الحق نظرا لتخصصي الدراسي في المواد الاسلاميه الشرعيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123709/http://www.20at.com/article2.php?sid=1122"

