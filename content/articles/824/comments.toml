subject = "هل احترمتني قناه الرسالة"
author = "عقلاني"
posted = "2006-08-21"
text = "لماذا احترم قناه لا تحترمني!<br />غريب قولي هذا .صحيح!<br />ارجعو معي عند بدايات قناه الرسالة.من اعلاناتها. بربكم ماذا كانت في معطيات الاعلان؟ ساسرد لكم بعض المعطيات.<br />في اول اعلان. نسمع امرأة من وراء ستار تقول\" اعطيته نفسي جسد من غير روح\"...وهي تتكلم عن علاقتها بزوجها.\"ايحاء جنسي\"<br />في الاعلان الثاني تقول سيدة في التليفون \" انا دخلت الاوضة.لقيت الراجل المحترم لابس..... وحاطط ال..... بتاع بنتي علي وشة \" طبعا من الممكن ان تتخيلو ماذا كان لابس وماذا كان واضع في وجهه.\"ايحاء ايضا جنسي\"<br />هذا في الاعلان.لماذا علي قناه تعتبر نفسها اسلامية ان تزيع مثل هذة المقطوعات من البرامج في اعلاناتها الا اذا كانت تريد ان تستهوي الشباب الذي يفكر بالجملة في الجنس.فها هي روتانا بسلسلاتها كما عودتنا في كل قنواتها ان تتحكم في الشباب عن طريق الجنس.فالجنس يجلب الربح.<br />كان من الممكن ان تكون الرسالة باسم روتانا الدينية مثل روتانا طرب وروتانا موسيقي وغيرها من السلسلة.لكن لن يصدقها الناس ولذلك غيرو الاسم وانخدع البعض.<br />اليس من الاولي ان تناقش هالة سرحان مواضيعها المشبوهة التي تناقشها دائما وهي تحضر العلمانيات مثل ايناس والمتبرجة الوقحة عبير صبري وغيرها ليفتو في امور ديننا مثل ارضاع الكبير وزواج المسيار والجن! اليس بالجدير ان تذاع هذة المهزلة علي الرسالة؟ ما هو رأي الشيخ طارق السويدان الذي احترمة في هذة المهزلة التي تحدث امام ناظرية<br />في روتانا سينيما التوأم مع الرسالة؟<br />لماذا لا يقوي طارق في رد علي هاله سرحان.هل لأنها زميلة عمل!.اذا كانت زميلة عمل لا تحترم دينها ان كانت مسلمة ولا تحترم نفسها ان كانت بلا دين.لماذا ترعاها قناة لها فرع ديني تسمية الرسالة ولماذا يسكت من في الرسالة ممكن يقولون لنا افعلو او لا تفعلو في امر دينكم عن المهزلة في الناحية الاخري من المجموعة الروتانية؟<br />اعذروني ان اطلت عليكم .ولكن فلتعرفو.ان عند الوليد ابن طلال مبدأ.وهو الغاية تبرر الوسيلة.فهذا الملياردير السعودي زي الام اللبنانية لا يفكر في دين المسلمين باقامة الرسالة ولكن يفكر بالاموال.والربح.<br />اريد ان اقول في حق كل من يعمل في قناه الرسالة بما فيهم طارق السويدان . بيت الشعر هذا..<br />اسف يا غرب ان اري.... جيلا من بني قومي علي نهجك صارا.<br />كم عوي يطلب الربح... فلم ينل في غية الا خسارة.<br />ودمتم"
