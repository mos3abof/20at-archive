order = 4
subject = "حقائق فظيعة وخطيرة عن قناة العربية و شبكة الام بي سي ...هام و سري"
author = "SAADIA"
text = "السلام عليكم ورحمة الله وبركاته<br />ملاحظة: (يرجى الانتباه – هام جدا) ما سيكتب في الموضوع يخص – بصورة خطيرة- العرب والمسلمين، فمن واجبك أنت كمسلم أن تساهم بقدر الاستطاعة في نشر ما ستعرفه من مخططات الأعداء لإخوانك في الدين، سواء أكان ذلك عن طريق الخطاب المباشر أوالمساجد أو المحاضرات أو الإنترنت أو أي وسيلة أخرى مباشرة أو غير مباشرة.<br />الملخص العام للموضوع: قناة العربية، وقنوات MBC الأربع، وجريدة \"الشرق الأوسط\"، وMBC FM، بالإضافة إلى قناة الحرة وراديو سوا، تندرج ضمن حملة فكرية أمريكية لتحسين صورة أمريكا عند العرب والمسلمين، وتشويه صورة الإسلام، ونشر الخلاعة والرقص والمجون في العالم العربي، بحيث يصبح العرب كاللعبة في أيدي أعداء الله، إن شاءوا تركوها وإن شاءوا فعلوا بها ما يحلو لهم. وعلينا أن نعرف أن الغزو الفكري أشد بأضعاف من الغزو العسكري، لأن القيم المعنوية لا تتغير بسهولة كالقيم المادية.<br />مجموعة الولاء<br />والآن إلى الموضوع<br />حقائق فظيعة عن قناة \"العربية\" وقنوات MBC هام جدا<br />مقدمة:<br />أنفقت الإدارة الأمريكية مئات الملايين لتحسين صورة أمريكا في العالم بشكل عام والشرق الأوسط بشكل خاص ومن أهم الوسائل التي اعتمدتها الخارجية الأمريكية لتحقيق هذا الهدف كان إنشاء \"قناة الحرة\" و\"راديو سوا\" موجهتان للعرب بلغتهم.<br />والكثير منا ينظر بفرح وغبطة مع فشل هاتين الوسيلتين في كسب المصداقية لدى الجمهور العربي وربما شعرنا أحيانا بغباء الإدارة الأمريكية وفشلها في التغيير... والحقيقة قد تكون عكس ذلك - ويخشى أن نكون نحن الأغبياء - فالإدارة الأمريكية نجحت في جعل هاتين الوسيلتين التي معظمنا يقاطعها نجحت في جعل الحرة وسوا درع واقي تكتيكي ظاهره الغباء و\"غطاء\" ننشغل به عن الوسائل الإعلامية الأمريكية النافذة والمؤثرة التي لا تنشر الدعاية للمشروع السياسي الأمريكي وحسب بل للثقافة والقيم والمبادئ الأمريكية.<br />فرغم أن سوا والحرة تبث السموم الفكرية والسياسية التي تخدم مصلحة أمريكا سياسيا والغرب ثقافيا إلا أن المجموعة الأمريكية الذكية هي الوسيلة الأمريكية الحقيقية للتغيير ....<br />فما هي المجموعة الأمريكية الذكية؟ ، وسنرمز لها بالـ\"المجموعة\".<br />*المجموعة الأمريكية:<br />رغم وجود أعداد مهولة من الصحف والقنوات والإذاعات العربية التي تساعد مشروع أميركا سياسيا وفكريا بصورة جزئية إلا أن هناك من يساند المشروع الأمريكي قلبا وقالبا بصورة كلية وجريئة ومنهجية وتتمثل في المجموعة الأمريكية الذكية -حسب الوصف الأمريكي- وهي قناة العربية وMBC1,2,3,4 وجريدة \"الشرق الأوسط\" وإذاعة MBC FM وقد نجحت الإدارة الأمريكية ممثلة في وزارة الخارجية بتوظيف هذه الوسائل والإمساك بزمام الإعلام وتوجيه الرأي في العالم العربي والخليج بشكل خاص.<br />وقد يسأل سائل : لماذا لا يتم الحديث عن القنوات ووسائل الإعلام العربية الأخرى التي تسيء للثقافة العربية والإسلامية ليل نهار مثل روتانا و ART وغيرهما ؟؟؟ والإجابة بأن الفرق بين المجموعة والقنوات الأخرى أن هذه القنوات ( الأخرى ) لا تعمد إلى نشر الثقافة الأمريكية كرؤية ورسالة لا تقبل المساومة حتى لو كان ذلك على حساب المهنية والربح المادي ولا تعمد لهدم المبادئ الإسلامية بصورة منهجية ولكن تعتمد ( روتانا و ART وغيرهما ) في الطرح على عنصر الإثارة وتغليب مصلحة الربح المادي بصورة عفوية عكس المجموعة التي يمكن أن تتعالى على الربح المادي أو السبق الإعلامي أو حتى شرف المهنة إذا كان ذلك في سبيل مصلحة السياسة والثقافة الأميركية.<br />كيف سنكتب هذه الملاحظات وكيف كتب التقرير الأصلي<br />*التقرير السري:<br />التقرير الأصلي هو تقرير سري مقدم لوزيرة الخارجية الأمريكية و\" المجموعة \" ستكون الرمز المختصر لقناة العربية وجريدة الشرق الأوسط وإذاعةMBC FM والتي سيرمز لها بـ\"الإذاعة\" حينما تذكر منفردة أما \"الكاتبان\" فيقصد بهما الراشد والربعي، وستكتب الملاحظات بنفس الترجمة الحرفية للنص الوارد من التقرير الأمريكي، وأي تكرار -وهو ملاحظ بكثرة- أو عدم مراعاة للأولويات أو سذاجة في الحكم على الأشخاص أو المؤسسات الإعلامية فذلك يعبر فقط عن التقرير الأمريكي وكتابه الذين تكلموا تارة بضمير أمريكي معادي لكل عربي ومسلم وتكلموا تارة بضمير المراقب المحايد وربما المنتقد لسياسة أمريكا والمجموعة.<br />والتقرير الأمريكي قدم لوزير الخارجية السابق بناء على طلبه شخصيا ( كولن باول ) ويحتوي على ثلاث تقارير : التقرير الأول الصادر عن أحد مراكز البحث الممولة بشكل كامل من الإدارة الأمريكية والتقرير الثاني وهو صادر عن الدائرة الإعلامية في الخارجية الأمريكية والتقرير الثالث أو النهائي أو الأخير وهو الصادر عن مكتب نائب وزير الخارجية لشؤون الشرق الأوسط وسنرمز له بالتقرير الأخير والحقيقة أن معظمه تكرار للتقريرين الأول والثاني بجانب احتوائه (الأخير) على نص التقريرين بشكل شبه كامل !. علما بان التقرير الأخير تم إرجاعه من قبل الوزير المقال باول لطوله الشديد 2800 صفحة وتم اختصاره وتحديثه بمعلومات جديدة وقدم للوزيرة الجديدة كوندليزا رايس في 1900 صفحة.<br />ولكن كيف سرب هذا التقرير؟ : من الطريف أن الذي سرب التقرير هو أحد الموظفين الصغار في الخارجية الأمريكية من أصول لاتينية بدون أي مقابل مالي حيث لم يكن مصنفا كتقرير شديد السرية حتى بداية عام 2005 فقد كان يعامل كتقرير سري مثل جميع التقارير الصادرة عن المكاتب و الأقسام في الخارجية الأمريكية دون حساسية مفرطة.<br />واليكم الآن مقتطفات من هذا التقرير دون اعتبار كما هو في نص التقرير الأمريكي لاعتبارات الأولوية أو التسلسل الزمني أو غير ذلك.<br />مقتطفات عامة من التقرير الأخير عن العربية وMBC والشرق الأوسط والإذاعة المجموعة :<br />• جاء في التقرير الأخير أن المشاهد العربي عموما يظن أن هدف العربية هو منافسة قناة الجزيرة والدعاية لسياسة المملكة السعودية والحقيقة ورغم أن مواجهة ومنافسة الجزيرة سياسة استراتيجية متبعة لدى العربية إلا أن الهدف الأساسي يتجاوز علاقة القناتين والدولتين إلى هدفين أساسيين :<br />أولهما تحسين صورة أمريكا في العالم العربي (رغم وجود بعض التقارير والأخبار التي تظهر عكس ذلك بهدف التغطية) واهم وسيلة غير مباشرة لتحقيق هذا الهدف هو تمجيد المبادئ والنماذج والقيم الأمريكية والغربية<br />أما الهدف الثاني فهو تشويه صورة الإسلام (رغم بعض التقارير والأخبار التي تظهر عكس ذلك وأيضا بهدف التغطية) واهم وسيلة غير مباشرة لتحقيق هذا الهدف هو مهاجمة الثوابت والتيارات والرموز والأفكار الإسلامية الوسطية ومحاولة خلط المفاهيم والأحكام وجعل كل اصل إسلامي قابل للمناقشة والتغيير تدريجيا بجانب كم هائل من البرامج التحريرية المتدرجة الموجودة في المجموعة الذكية بشكل عام.<br />•نجحت المجموعة في إتباع السياسة التي اتبعتها الشرق الأوسط في التعامل مع الفكر الإسلامي فمن ناحية أعطت المجموعة مساحة صغيرة للأخبار والكتاب والتقارير والمقابلات الإسلامية وهي مساحة لا تتجاوز 5% من المساحة الكلية لبرامج هذه الوسائل ولكن عالجت المجموعة هذا الأمر بجعل 90% من هذه المساحة الضيقة تحت سيطرة الفكر الاسلامي التنويري المنفتح على الثقافة الغربية .<br />وهكذا أظهرت المجموعة انفتاحها على الفكر الإسلامي بل استغلت هذا الانفتاح في الرد والتشكيك على الثوابت والرموز والثقافة الإسلامية الأصولية فعلى سبيل المثال أصبح رجل الدين العبيكان وخلال شهور عدة رجل الغلاف والسوبر ستار لكل أركان المجموعة بينما كان من المستحيل أن يأخذ هذا الدور رجال دين آخرين مثل المطلق أو العودة أو الحوالي أو بن جبرين رغم أن العبيكان له آراء متطرفة في القضايا الفقهية البعيدة عن السياسة والمجتمع فهو يحرم حلق اللحية ويحرم اختلاط الرجال بالنساء وغير ذلك من آراء الفقه الحنبلي .<br />عموما هذا لا يعني أن المجموعة لم تعط أي مساحة للفكر الآخر بل أعطت ما يقارب 10% من المساحة الضيقة ( 5% ) لمشائخ الصحوة أمثال العودة والحوالي وكان ذلك مناسبا ومفيدا في نفي تهمة الرأي الواحد عن المجموعة.<br />* دور قناة العربية في تدعيم الوجود الأمريكي في العراق<br />كما أثنى التقرير بإسهاب على التغطية الإعلامية لانتخابات العراق في المجموعة خصوصا (العربية) وعلى مساحة الإعلانات المهولة التي وفرتها العربية لتشجيع المشاركة الجماهيرية في الانتخابات والدعايات الخاصة بالأحزاب وأيضا نجحت العربية حسب التقرير الأخير في تهميش اثر مقاطعة السنة للانتخابات.<br />• جاء في التقرير الأخير أن العربية كانت رائدة في نقل أحداث العنف في العراق ولكن بعيون أمريكية:<br />- التقليل نسبيا من مشاهد وأخبار المدنيين العراقيين المصابين اثر الهجمات الأمريكية .<br />- التقليل من مشاهد وأخبار وأثار الهجمات التي تقوم بها المقاومة العراقية ضد قوات التحالف لإبقاء الروح المعنوية عالية لدى مؤيدي الاحتلال .<br />- تضخيم أخبار إصابة المدنيين العراقيين من آثار عمليات المقاومة لإثارة الحنق والكراهية ضد الفئات المقاومة .<br />- والتضخيم من عمليات الجيش الأمريكي وأثرها ضد المقاومة في محاولة لهزيمة المقاومة معنويا ويكتفى كمثل على ذلك الاستشهاد بتغطية العربية لمأساة أبو غريب حيث كان الخبر لا يذاع كخبر أساسي في اليوم الأول بل كان الخبر الثاني أو الثالث حتى مرور 12 ساعة إخبارية حيث رأى المسئولون في العربية أنهم عكس جميع المحطات العالمية الإخبارية التي جعلت خبر اكتشاف عمليات تعذيب وإهانة الخبر الأول فاضطرت العربية حينذاك أن تجعله الخبر الأول .. ولكن عالجت العربية هذه المأساة الأمريكية التي لا يمكن تجاهلها بالتقليل ولو نسبيا منها وأيضا ببث عدة برامج في الأيام اللاحقة عن أعمال العنف التي مارسها نظام صدام سابقا للتغطية على الفضيحة الأمريكية رغم أن المتابعة والإحصائيات الرقمية كما ونوعا تشير أن صحيفة الشرق الأوسط كانت أكثر وسيلة إعلام عربية تمجد وتدافع عن صدام وجرائمه ونظامه حتى تاريخ نشوب الحرب الخليجية الثانية .<br />• رفضت العربية إعطاء حيزاً لبرنامج ديني منذ نشأتها ومن طرائف الراشد انه علل ذلك لاحقا بان وجود برنامج ديني يحتم أن يكون مفتوحا للمسلمين والمسيحيين على وجه المساواة وهذا غير مناسب حاليا لأنه مثير ومستفز للمتشددين المسلمين.<br />• سجلت العربية والمجموعة بشكل عام نجاحاً في التعامل مع أخبار وبيانات الإنترنت فكل بيان يوصم المسلمين والجماعات الإسلامية بالتطرف أو يشجع الطائفية يقبل دون مناقشة أو تثبت حتى لو كان مجرد سطور مكتوبة في أي موقع أو بريد إلكتروني (مثال ذلك البيانات المنسوبة للزرقاوي خصوصا المحرضة ضد الشيعة) ولكن أي بيان ليس من مصلحة أمريكا أن ينشر يكذب مباشرة حتى لو كان مصور وموثق (مثال ذلك اعتراف أحد المسلحين صوتا وصورة بتفجير موكب الحريري لان هذا البيان لا يتفق مع المصلحة الإسرائيلية التي تحمل سوريا مسؤولية التفجير)<br />* ثقافة الخلاعة والرقص:<br />• سجلت المجموعة وحسب التقرير الأخير سبقاً في الانفتاح على الغرب ونشر الثقافة ومبادئ الحياة اللانمطية؟؟ فعلى مستوى الأديان سجلت المجموعة عدلا في التعامل مع الديانات المختلفة والمذاهب (ماعدا الإذاعة).<br />أما البرامج الترفيهية والشبابية فنجحت المجموعة في تغيير مستوى الحرية في الخليج وأصبحت الصور النسائية هي سيدة الموقف في الصحافة السعودية التي كانت ترفض ذلك سابقا أما البرامج الحية خصوصا الشبابية شجعت النساء خصوصا في التعبير عن رفضهم للقيود المفروضة عليهم من قبل المؤسسات الدينية الرسمية والشعبية .. المجموعة فتحت آفاق للشباب العربي و الخليجي لكي يكون جزا من الشباب العالمي.<br />في نفس السياق جاء شكر وثناء على النمط المطور الانفتاحي المتعلق بقنوات MBC 1,2,3,4 التي وحسب التقرير الأخير قدمت هذه القنوات النموذج الأمريكي الثقافي والترفيهي بعباءة عربية وأحيانا بدون عباءة ( مترجم حرفيا حسب نص التقرير ) بل تفوقت هذه القنوات على القنوات اللبنانية المتحررة مثل المستقبل و lbc التي كانتا اقل ذكاء في التعامل مع المتلقي العربي حيث تم استفزاز كثير من المشاهدين بصورة مباشرة عكس برامج المجموعة التي راعت التدرج والاستفادة من الواجهات الدينية رغم أن القن<br />06/08/2006<br />اقرأ بقية التعليق .."
