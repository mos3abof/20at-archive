[[comments]]
order = 1
subject = "الموت القادم من الشرق"
text = "قال النبي صلى الله عليه وسلم : (لاتقوم الساعة حتى يبعث دجالون كذابون قريب من ثلاثين كلهم يزعم أنه رسول الله) رواه مسلم<br />كما قال صلى الله عليه وسلم : (وإنه والله لاتقوم الساعة حتى يخرج ثلاثون كذاباً آخرهم الأعور الكذاب) رواه أحمد<br />ومن هؤلاء الكذابون أربع نسوة!! !<br />قال صلى الله عليه وسلم : (في أمتي كذابون ودجالون ستة وعشرون منهم أربع نسوة وإني خاتم النبيين لانبي بعدي) رواه أحمد وصححه الألباني في صحيح الجامع الصغير<br />يا ترى كم هو عدد مدعي النبوة حتى الان؟؟وهل لم يصل بعد إلى الثلاثين؟؟"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040029/http://www.20at.com:80/article.php?sid=436"

[[comments]]
order = 2
subject = "هذا عن الانبياء وماذا عن الالهة"
text = "ياعم ان جت على نبى تبقى خفيفة وارميها ورا ضهرك لكن ايه رايك في من نصبهم اتباعهم واذنابهم الهة ماذا عن عبد الناصر وتأليهه فهو لا يخطئ وقد انتصر وهو ميت فى حرب اكتوبر وماذا عن صدام حسين وتأليهه هل نتخطى موضوع ادعاء النبوة من اشخاص تافهين او مخبولين او محششين للناقش موضوع التأليه خصوصا انه يتم من مثقفين واعيين يمكن يكونوا شوية شاربين لكن لهم هدف من صنع هذه الالهة ."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040029/http://www.20at.com:80/article.php?sid=436"

