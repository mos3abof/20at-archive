author = "ن أجد كلاما أبلغ من قولي جزاكم الله خيرا على نشر هذا الخبر ، وجزا هذه السيدة كل الخير والسعادة في الدنيا والآخرة."
text = "همسة إلى المحجبات : ليس الحجاب حجاب حجاب البدن فقط.. ولكن الحجاب أيضا حجاب للأخلاق بذمها عن فعل الفواحش وأمرها بترك المعاصي وتعليمها أننا خلقنا لطاعة الله . قال تعالى :\"وما خلقت الجن والإنس إلا ليعبدون\".<br />ما أكثر المحجبات وما أقل من راعت حجابها وفهمته الفهم الصحيح..أرجو أن نفهمه جميعا الفهم الصحيح وأن نسعى جميعا للجنة وألا (نفرح )الشيطان فينا بسلوكياتنا الخاطئة.<br />عذرا لإطالتي عليكم..والشلام عليكم ورحمة الله.<br />سمر"
archived = "2006-11-02"
