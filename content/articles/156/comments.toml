order = 20
subject = "1f u t|-|1/\\/k f*k 15 Fu/\\//\\/Y"
text = "المانول<br />او كتيب التشغيل<br />هو كتيب صغير ياتى مع اى جهاز كهربائى جديد زى الكاست و التلفزيون و الغساله<br />و هذه الفكره اخدها المسلمين و عملو كتيب لكل واحد فى دماغه اسمه الفتواى<br />يعنى ماتفكرش و احفظ ولا تسال ولا تجادل يا اخى<br />فا ان الفتنه من الكفار المشاركين اعداء الدين اليهود الملعلونين و الامريكان الملاعيد اللهم اقتلهم و احرقهم و اعز الاسلام و الموئمنين<br />هو ده المسلم اللى شايف نفسه احسن واحد بالكتيب بتاعه<br />و ماننكرش انه حافظه و انه احسن واحد يحفظ بدليل الكلام الكتير الموجود هنا<br />و كل موضوع بقى فيه درجات من الحلال و الحرام<br />حتى لو كان زنا سموه زواج متعه<br />لو اغانى البعض حللها و البعض لا<br />حتى الحجاب البعض حلله و البعض لا<br />و تم الغاء مخ المسلم بتاتا و المسلمه طبعا لانها نص مخ الراجل اللى اساسا مابيفكرش و يشوف دينه<br />و ياريت الدين لنفسه لا ده لمجتمعه<br />يعنى حاتطلع من الدين حاتتقتل<br />حاتقلعى الحجاب حتلاقى اللى يجبرك عليه (يا اما جماعه الامر بالمعروف و النهى عن المنكر يا اما ضغط نفسى من الجتمع ياما نظرات الناس اللى لا تعرف الحريه و كتيــــــر )<br />ولن يتقدم العربى و المسلم لنهايه الحياه<br />الا لو قاموا و حاربوا امريكا و هنا تكون ابدتنا جميعا و ينتهى العرب او نتخلف اكتر<br />و هى بالدور 1- فلسطين<br />2- العراق<br />3- سوريا<br />4- ايران<br />5- مصر"
archived = "2005-07-15"
capture_url = "https://web.archive.org/web/20050715073957/http://www.20at.com:80/article.php?sid=450"

