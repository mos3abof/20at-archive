[[comments]]
order = 3
subject = "ما شاء الله"
text = "جزاك الله خيرا ... يمكن كمان (والله أعلم) أنبهر أن في حاجة زي كده ... جزاك و جزاها الله خيرا ... ترى هل من الممكن نشر عنوان هذا المحل .. بما أنها تشكو من قلة الدخل .. نشر العنوان سياسعدها على زيادة دخلها . و أيضا يعين كثيرا من النساء و البنات على الذهاب إلى أماكن موثوق بها. يمكن أن يتعلمن منها ما هو جائز أو غير جائز في تجميل أنفسهن. زي الحواجب ... يعني في كثبر من المحلات المخصصة للمحجبات .. تقوم بفعل أمور نهى عنها الشرع<br />جزاك و جزاها الله خيرا"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813110529/http://www.20at.com:80/article.php?sid=450"

[[comments]]
order = 4
subject = "وايت شميز"
text = "لا تعليق على مبدأ (التمسك بالمبادىء )فهو فى حد ذاته مبدا فى الاسلام<br />ولكن الغر يب هو وجود هذا المبدأفى هذا العصر<br />عصر السلبية واللامبالاة00(هوانا هاصلح الكون)00<br />ولكن 000<br />للحق جنوده (جنود الفكرة)00هم اصحاب المبادىء<br />تجدهم فى كل عصر وفى كل مكان وهم الذين استحفظ الحق فى قلوبهم ،،وارواحهم،،وعقولهم><br />أما الكاتبة ..<br />فأقف صامتاً أمام هذه الموهبة الربانية التي تستثير مواهب الشباب العربي في الخير وأدعو الله لها أن يستعملها ولا يستبدلها في زمن<br />\"ستار أكاديمي\"<br />\"ستار ميكر\"<br />\"ستوديو الفن\""
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813110529/http://www.20at.com:80/article.php?sid=450"

[[comments]]
order = 5
subject = "شكر للكاتبة ولصاحبة المحل"
text = "أشكر الأخت الفاضلة الكاتبة وأدعوها إلى المزيد من الكتابة في هذا الاتجاه ، فكل يوم الواحد بيشوف مظاهر كتيرة حلوة كانت أو وحشة ولكن القليل فقط هو اللي ممكن يسخرها لخدمة هدف حلو يمكن توصيله للناس<br />وربنا يبارك للجميع في رزقة خاصة أمثال صاحبة المحل<br />لفت نظري أن الكثير سأل عن صاحبة المحل وأين مكانها وأنا أعتقد أن في كل الوطن العربي من الخليج للمحيط فيه ناس وايد حلوين وعاوزين يرضوا ربنا في أعمالهم وفي رزقهم لكن علينا أن نبحث عنهم<br />وقد فتحت لنا الأستاذة / هبة مجال رحب للتفكير في أمثال هؤلاء والبحث عنهم<br />فأمتنا بخير ولله الحمد والمنة<br />وإلى مزيد من التقدم يا أهل العشرينيات<br />والسلام عليكم"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813110529/http://www.20at.com:80/article.php?sid=450"

