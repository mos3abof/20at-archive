[[comments]]
order = 51
subject = "الله يسعد كل من قراء تعليقي"
author = "حبتي والله لمأكتب الا لاني احبكم في الله .."
text = "الحجاب مالغاية من الحجاب (الكتاب بين من عنوانة)<br />اي يكون بينك وبين الاخرين ستر وحشمة وعدم انجذابية<br />هذة هي الغاية من الحجاب كما قالت عائشة رضي اللة عنها ان الصحابيات اذا خرجن كانهن الغربان من السوادوالستر .. حيث ان الفتاة درة مكنوة وسط صدفة والا ما الفرق بين الرجل والمراءة<br />وأما النقاب في أيام الصحابيات :كان مختلفا جدا عن ايامنا هذة ...............<br />أحبتي ..أن الدين النصيحة<br />.......والدليل ان الوجة واجب التغطية<br />عن عائشة رضي الله عنها قالت:<br />كان الركبان يمرون بناونحن محرمات مع الرسول صلى الله عليه وسلم فإذا جاؤنا سدلت أحدانا جلبابها على وجهها من رأسها .فأذا جاوزونا كشفناه.رواة أحمد وأبو داود وابن ماجة.<br />ففي قولها ((فإذا حاذونا )) تعني الركبان ((سدلت إحدانا جلبابها على وجهها))دليل على وجوب ستر الوجه إذا كان بحضرة أجانب. و كشفه اذا لم يكن بحضرة أجانب والدليلعلى ذلك انها قالت ((فإذا جاوزونا كشفناه)) .<br />فدليل ذلك أنة واجب من تغطيتة إذا كان في حظرة أجانب وواجب من تغطيتة أذا لم يكن هناك أجانب فا الواجب لايعارضة الا الواجب<br />فلولا وجوب الأحتجاب وتغطية الوجة عند الأجانب ماساغ ترك ترك الواجب من كشفه حال الأحرام<br />وقد ثبت في الصحيحين وغيرهما :أن المرأه المحرمة تنهى عن القفازان والنقاب .قال شيخ الأسلام أبن تيمية :وهذا مما يدل على أن النقاب والقفازين كانا معروفين في النساء الاتي لم يحرمن وذلك يقتضي ستر وجوههن وأيديهن . منقول من كلا م الشيخ العلامة ابن عثيمين يرحمة الله ..وهناك أدله أكثر من ذلك<br />والله على ما أقول شهيد<br />محبكم في الله.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142252/http://www.20at.com/article.php?sid=450"

[[comments]]
order = 52
subject = "ارحمونا من العربي العجيب"
author = "رجو من كل الإخوة الذين يكتبون تعليقا أن يهتموا قليلا بأصول الكتابة الصحيحة."
text = "إني أستغرب جدا عندما أجد كثيرا من الناس لا يستطيعون أن يفرقوا بين التاء المربوطة والهاء المربوطة، فتجدهم يكتبون لفظ الجلالة مثلا بالتاء المربوطة \"اللة\" في حين أنها هاء مربوطة.<br />ولتعرف هذه الكلمة تنتهي بهاء أو تاء فما عليك إلا أن تنطق الكلمة بتشكيل آخرها فإن وجتها تاء فاكتبها تاءً وإن وجدتها هاء فهي هاء.<br />وللعلم فإن الهاء المربوطة على لوحة المفاتيح هي نفس الهاء العادية وتظهر هاء مربوطة إذا كانت في آخر الكلمة، أقول هذا لأن كثيرا من الناس لا يعلم أين يجد هذه الهاء المربوطة.<br />على فكرة هذا أمر من ملاحظات كثيرة جدا على كتابة الناس وتعليقاتهم.<br />فهي بصراحة فضيحة بكل المقاييس ألا نستطيع أن نكتب لغتنا لغة القرآن بطرية صحيحة.<br />وجزاكم الله خيرًا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142252/http://www.20at.com/article.php?sid=450"

[[comments]]
order = 53
subject = "لا يوجد اجماع !"
author = "غلب المذاهب على وجوب ستر الوجه و الكفين سواء بالنقاب أو بغيره و هذا هو مذهب الأئمة الشافعي و أحمد و مالك"
text = "أما الامام أبو حنيفة فيرى بوجوب ستر الوجه و الكفين عند عدم أمن الفتنة من المرأة ( لكونها ذات جمال ملفت للنظر ) أو عليها ( إذا كانت في مجتمع يكثر فيه الفساق )<br />المصدر : رسالة ( الحجاب لماذا ) للشيخ اسماعيل المقدم و كتاب ( ففروا الى الله ) للشيخ أبو ذر القلموني ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142252/http://www.20at.com/article.php?sid=450"

