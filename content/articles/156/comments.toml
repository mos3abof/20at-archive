subject = "بيرو"
text = "يااااااااااااااااااااه<br />بجد ده اول موضوع مؤثر قوي للدرجة دي اقراه في عشرينات<br />الحكاية اكبر من كوافير للمحجبات وبس<br />الحكاية ان لسه في ناس بتحكمها مبادئها اللي بتحافظ عليها<br />المباديء في حياتنا بقت شيء عادي وملوش قيمة<br />أظرف حاجة الجملة اللي اصبحنا بنرددها كتير الايام دي ...<br />تسال أي حد عن تصرف \"مشبوه \"بيعمله يرد عليك بمنتهي الثقة<br />\" أنا بعرف أزاي أحكم مبادئي\"<br />المبادئء هي اللي تحكم الانسان<br />موش الانسان هو اللي يحكمها !!!!!!"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813110529/http://www.20at.com:80/article.php?sid=450"

