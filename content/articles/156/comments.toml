subject = "الاختلاف على ستر الوجه والكفين"
author = "المرأة كلها عورة ) الترمذي صحيح"
text = "هذا بالإضافة للأحاديث المشهورة<br />فكما سبقني الأخ بارك الله فيه بأن أبا حنيفة فقط هو الذي اشترط الفتنةللوجوب أما باقي الأئمة قالوا بوجوبها...<br />هذا ونقول أيضا أن الخلاف سائغ في هذه المسألة ولا يجب التعصب لرأي أو شيخ ولكن نحب أن نسير على ما يستر نساءنا ويحفظهم من الفتنة .. ولا شك أننا في هذا العصر اشتدت الفتنة بسبب الفضائيات وما يتم ترويجه من مبادئ هادة للإسلام والمجتمع..<br />لذا أقول التحصن من الفتنة أفضل، والله تعالى أعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142252/http://www.20at.com/article.php?sid=450"

