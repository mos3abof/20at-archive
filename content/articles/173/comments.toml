subject = "الحمد لله"
text = "في سنن أبي داود \"أن النبي صلى الله عليه وسلم قال لرجل : كيف تقول في الصلاة ؟ قال : أتشهد ، وأقول : اللهم إني أسألك الجنة ، وأعوذ بك من النار ، وأما إني لا أحسن دندنتك ولا دندنة معاذ ، فقال النبي صلى الله عليه وسلم : حولها ندندن .\""
archived = "2004-08-16"
capture_url = "https://web.archive.org/web/20040816081335/http://www.20at.com:80/article.php?sid=534"

[[comments]]
order = 4
subject = "سيدة القصر"
text = "أنا سعيدة جدا لقرأة هذا الموضوع الآن بالّذات؛لاننى بعيدة جدا عن ربنا ؛ وكمان توقيته قبل دخول شهر رجب حتى نستعد لرمضان..<br />أنا متأكدة إن ربنا لن يردنى لأنه قبل كدة استجاب لأبليس عندما سأله أن ينظره إلى يوم نبعث ويأجل عذابه..فاستجاب الله عز وجل .<br />وكمان وربنا عندما يسأله العبد المطيع يقول لبيك عبدى ، ولكن عندما يسأله العبد العاصى يقول لبيك لبيك لبيك عبدى فالله اكثر فرحة بعودة عبده من الذى تعود اليه ناقته وحاجاته حتى انه قال اللهم انت عبدى وانا ربك.<br />باللا اسعدوا ربكم يأهل الله.."
archived = "2004-08-16"
capture_url = "https://web.archive.org/web/20040816081335/http://www.20at.com:80/article.php?sid=534"

