[[comments]]
order = 7
subject = "منقول من ساحة حوار إسلام أون لاين"
text = "السلام عليكم ورحمة الله وبركاته<br />في الحقيقة مضمون الرسالة ومضمون المقالة مكرر وهناك الكثير من المقالات التي تحث على العودة والتوبة ولكن ينقصها أدب الحديث عن الذات الإلهية وتقديس وإجلال اسم الله<br />هذا الأسلوب الذي اعتدنا أن نراه في أديان أخرى حيث الاعتقاد بأن الله ثالث ثلاثة والله واحد أحد فرد صمد.<br />وأقصد هنا أن مهما كان الهدف هو تبسيط المعنى أو التلقائية فلا ينبغي أن يقلل هذا من إجلالنا للعظيم ، العال، المتعال ، المتكبر، ذو الجلال والإكرام . وحتى لو نظرت لأسماء وصفات الله التي توحي بالرحمة والغفران لا تشعر أبدا بنقصان العظمة بل تؤكد عليها في باقي الصفات الإلهية<br />لا انتقد هنا النص أو عنوان المداخلة الذي هو عنوان المقالة بل أرغب في أن نراعي أصول الحديث عن الله سبحانه وتعالى مهما كان كلامنا تلقائي .<br />ولو أن الفرد بيتكلم عن رئيسه في العمل هيقول الريس قال الريس عمل الريس كذا .. وهكذا ما بالك في رب العزة جل شأنه ولن تشقى أو يشقى أي فرد في أن يأتي بالعبارات المعبرة البسيطة الوقورة في نفس الوقت ..<br />وعذرا للتعليق<br />أسامة<br />منقول من ساحة حوار إسلام أون لاين تعليقاً على الموضوع"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022033452/http://www.20at.com:80/article.php?sid=534"

[[comments]]
order = 8
subject = "الأدب مع الله"
text = "نيجي وننضف نفسنا عندك.. ما أنت اللى قلت.. وأنت اللى عملّت وأنت اللى بتحكم..<br />؟؟؟؟!!!!!!<br />حتى حسن النوايا لا يعفى من المسئولية يا جماعة ؟؟؟<br />هدف المقالة معروف وواضح ... لكن الأسلوب مصيبة ؟؟<br />الله جل و على لم يتحدث عنه الرسول إطلقاً مطلقاً بهذا الأسلوب أبداً ... لم يذكره أبداً إلا بإجلال سبحانه و تعالى<br />سؤال يوضح الأمر .... هل تستطيع أن تتحدث بهذا الأسلوب مع مديرك مثلاً ... أو مع المحافظ أو رئيس الجمهورية ؟؟؟!!!<br />التبسيط لا يعنى التحدث بهذا الأسلوب أبداً<br />عموماً جزاك الله خيراً على حسن نواياك<br />و غفر الله لنا و لك"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022033452/http://www.20at.com:80/article.php?sid=534"
