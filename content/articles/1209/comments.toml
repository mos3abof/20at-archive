[[comments]]
order = 11
subject = "شكراً"
author = "فارس بلا جواد"
posted = "2006-06-18"
text = "سلام عليكم<br />أحب في البداية أشكرك جداً يا يسر ع الموضوع الجميل ده<br />فعلاً أنا من أكتر الحاجات اللي بحبها التحقيقات يبقى فيه عينات قدامي و آراء و حاجات ملموسة<br />مش مجرد فكرة جوة عقل واحد وعاوز يطلعها و خلاص<br />أهم حاجة الاختلاف<br />و بمناسبة الاختلاف<br />أنا لو عندي قطة و كلب<br />تعرفوا هخلي للكلب حرية إنه يفضل في الشارع إن شا الله لغاية تاني يوم أو حتى لغاية أما يرجع براحته<br />لكن قطتي المقطقطة حبيبتي و نور عينيا ما تخرجش بعد الدنيا ما تضلم<br />أصل الكلب اللي أنا سايبه فيه ناس غير مسيبين كلابهم زيه<br />وحتى لو أنا ما سيبتهوش فيه كلاب برضه هتفضل سايبة<br />يا ريت يكون المثال واضح<br />و بكرر شكري ع الموضوع<br />و مش لازم أوضح وجهة نظري بيتهيأ لي واضحة<br />مع ألف سلامة<br />فارس بلا جواد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134306/http://www.20at.com/article2.php?sid=943"

[[comments]]
order = 12
subject = "سكوت حنكلم"
author = "ساسو"
posted = "2006-06-20"
text = "والله يا جمهعة انا مستغربة انى احنا لسة بنفكر بالالوب دة هو مش عيب ولكن مش مواكب العصر دة ودة لعدة اسباب مش علشان البنات بقت متفتحة ولكن التفكير فى اى بنت بقى عبارة عن شك وخداع ولكن من الممكن اصلاح تلك الفكر فى بعض الخطواط الصغير التى تجعل من الفتاة رمز الاحترام والتقدير مش للغزل والمعاكسة بغض النظر عن اللبس بس فى حدود الاحترام طيب يا شباب امى وامكم كانوا زمان بيلبسوا قصير وضيق محدش كان يقدر يكلم معاهم سواء جوة البيت او خارج البيت علشان كانت نظرة الناس بتحمل حترام للفتاة مش للابس ولكن حقول لكم النصائح ولكن للكل أولاً : تدريب البنت على الطاعة – طاعة الله ورسوله صلى الله عليه وسلم – منذ الصغر :-<br />ينبغي أن تدرب البنت وتعود على الطاعات وأعمال البر واتقاء المنكرات منذ الصغر هناك جملة من المؤثرات تتدخل و تؤثر على تربية الأبناء و توجيههم على الأبوين ملاحظة تصرفات الأبناء وسلوكهم مع بعضهم البعض والإصلاح في ذلك قدر الاستطاعة ، فليغرس في الصغير احترام الكبير وليغرس في الكبير العطف على الصغير كما وج ه إلى ذلك رسولنا صلى الله عليه وسلم وليعلمهم جميعاً الأدب مع بعضهم البعض وترك السخرية والاستهزاء من بعضهم البعض فعليك أيتها الأم أن تتفقدي أحوال ابنتك وتسألي عن صديقاتها ، فكم من بنت شريرة تدعو إلى المنكر والفساد وتزين لصديقاتها الشرور والآثام ، كما أنك تحرصين على إكرام صديقات ابنتك حتى يسهل عليك توجيههم ويلينوا بيديك فلا بد أن يتفقد الأب أبناءه معها ، ولابد للأم أن تتفقد بناتها معها ، فهي وسائل قد غزت كل البيوت ، والاحتراز عنها من أصعب ما يكون إلا على من يسره الله عليه طبيعة البلدان التي يعيش فيها الطفل بما فيها من أخلاق وعادات وآداب ومناظر وأحوال فى نصائح كثيرة ولكن ابدؤ ببعض هذة النصائح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134306/http://www.20at.com/article2.php?sid=943"

[[comments]]
