author = "ساسو"
posted = "2006-06-25"
text = "تحياتى يا مارو جميل انك تقولى رايك وبكل حرية بس خلى فى باللك انى الانسان يموت لو عاش لوحدة حد لو كانت فترة قصيرة اذا دول اهلك ممكن تعيش من غيرهم كويس انك تعتمدى على نفسك فى كل حاجة بس لازم تحسى انى فى رقيب عليكى اولا ربنا ثانيا اهلك النتى منهم حتى لوقلتى حتبداى تكرهييهم علشان هما فى الاول او الاخر خايفين عليك فى الزمن دة معلشى حولى تغير طريقتك معاهم علشان تكونى مرتاحة فى حياتك وشوفى اية الى ممكن يتغير فيك وحولى تغيرية مش حتخسرة اى حاجة ولكن حتكسبى كتر صدقنى انا مجربة الموضوع دة ولكن حول تغيرى المواضيع وحدة واحدة اختك ساسو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134306/http://www.20at.com/article2.php?sid=943"

