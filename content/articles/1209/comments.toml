subject = "السعوديه"
author = "riri"
posted = "2006-06-21"
text = "انا عايزه اقول انى للاسف كنت بعمل بكل النصائح وباقى اصدقائى كانوا يعارضونى ويلتجئوا للكذب تقريبا فى كل الاحيان وكنت عندما اصرح امى بانى فى استطاعتى ان اكدب عليها لعلها تفك الحصار عليه شويه تفولى لا لو اى بنت عملت كده تبقى مش مؤدبه وانى لما تتخطبى ابقى عيشى حياتك ذى ما انتى عايره وتقولى نصائح ساسجه بس للاسف بصدقهاوبعد ما اتخطبت قالت مافيش خروج ولا نزول من البيت ولو جلست معه فى البيت حتى بعد كتب كتابى لازم يكون معنا احد من العائله وبالحجاب مع ان الدين ماقالش كده خالص ، وبعد مضى سن المراهقه وبعد زواجى اكتشفت انى الزواج مش خروج من القيودامى ولكنه مسئوليه واكتشفت انى كنت خطاوانى ماعشتش حياتى وانى كنت من الممكن استمتع بهاوفى حدود دبنى كمسلما وان اصحابى استمتعوا بحياتهم اكثر منى بكثير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134306/http://www.20at.com/article2.php?sid=943"

