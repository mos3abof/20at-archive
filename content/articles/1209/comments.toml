text = "السلام عليكم ورحمة الله تعالى وبركاته التفرقة بين الولد والبنت لازمة.لأن البنت<br />لها حدود مثل التأخر و ..الخ<br />بس هذه التفرقة بتكون فحدود الدين والشرع<br />يعني مايعطوا الولد حرية تامة مثل انو يعمل علاقات غير شرعية مع الجنس الاخر.<br />ملاحضة.<br />البنت لمابتكون الها تربية اسلامية<br />وبتعرف حدودهاما بتحصل هيك مشاكل.<br />تقيم.<br />أنا بشجعكو على هيك مواضع برافوا ليسرى لأنو هاي المشكلة فبلدنا الاسلامي نماذج كثير هي لفتت النضر لالون"
