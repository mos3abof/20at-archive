subject = "انا عملت كل دا للاسف"
author = "مارو"
posted = "2006-06-24"
text = "انا مشكلتي كل اللي تكتب الثقه معدومه تماما مش لعيب فيا او سوء اخلاقي لا لان البنت مش لازم اساسا نديها ثقه اوي علشان مش تفلت دا كلام بالزمه لما اكون ماشيع جمب الحيط ومممين اني بعمل حاجه ويشكو في كل حاجه دا بيخلليني افكر مليون مره اني اغلط علشان كلامهم يبقي علي حق ومش احس بالاضطهاد والظلم حاولت اني اكلم ماما كتير وافهمها ان دا مش صح للتربيه كانت بتعتبرني دايما متمرده ومش متربيه علشان ازاي اكلمها وافهمها ازاي نتعامل يئست كتير من حياتي بتمني اني يجيلي عريس اهرب من البيت بيتهيالي اي نار برا بيتنا هاتكون جنه ولو حصل واطلقت مش هارجع البيت تاني هاشتغل واعتمد علي نفسي واعيش لوحدي كده والا كده انا معرضه للكلام مش هاتفرق بقي ربنا يهدي ابائنا وامهاتنا يارب ويفهمونا بقي بدل مانا قربت اكرههم واكره اخويا كمان بسببهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134306/http://www.20at.com/article2.php?sid=943"

