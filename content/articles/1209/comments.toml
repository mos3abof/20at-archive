[[comments]]
order = 0
subject = "تحليل"
author = "عبدالله مفتاح"
posted = "2006-06-14"
text = ".احرصي علي أن تكون هناك علاقة تربط بين أهلك وصديقاتك.. (وحتى زملائك من الجنس الآخر إذا لزم الأمر).<br />الجملة السابقة هل هي دعوة للدياثه (سؤال بغرض الاستفسار)<br />نظرا لاعتقادي بان الكثير من الفتيان والفتيات يمضين سنوات الجامعه بلا علاقات وطيده مع الجنس الاخر بل ان علاقتهم بالجنس الاخر لا تتعد علاقه السؤال والجواب ولا تمتد الى معرفه الاسرة بها.<br />كل فتاه تشعر بان المجتمع يقهرها او يمنح للشاب ما لايمنحه لها ليس لها سوى علاج بسيط جدا ليس من ضمنه ما تضمنه هذا التحقيق<br />الا وهو زياده وعيها الديني ومحاولة التقرب الى الله وعندما يحدث ذلك ستشعر كم كانت مخطئة وكم اخطات في حق والديها<br />باختصار هذا التحقيق هو احد حلقات التحول المزعوم نحو تحرير المراه اوالفتاة من جحيم مجتمعها<br />فعلى حد علمي ان الكثير من الفتيات الملتزمات لا يشعرن ابدا بقهر او ظلم او تفرقه في المعامله<br />وذلك نظرا لتفهمهن التام للفرق الجوهري بين الشاب والفتاة<br />اما الفئه الاخرى التي تلوث فكرها بالدعاوي الكاذبة والمساواة الواهية والحقوق الكاذبه فكل ما عليها كما سبق وذكرت هو زياده وعيها الديني<br />ولا ارى لهن حلا اخر<br />اللهم لولاك ما اهتدينا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134306/http://www.20at.com/article2.php?sid=943"

[[comments]]
order = 1
subject = "الاخ عبد الله"
author = "يسر عبد الدايم"
posted = "2006-06-15"
text = "الأخ عبد الله..<br />1-- السلام عليكم وشكرا على اهتمامك وتعليقك..ولي تعقيب متواضع عليه..!<br />** احرصي علي أن تكون هناك علاقة تربط بين أهلك وصديقاتك.. (وحتى زملائك من الجنس الآخر إذا لزم الأمر).<br />الجملة السابقة هل هي دعوة للدياثه (سؤال بغرض الاستفسار):<br />-- استغفر الله العظيم...أكيد لأ..ما تحدث عنه التحقيق هي الزماله وليست الصداقة و هذا -إذا لزم الامر-..وفي كثير من الجامعات تكون هذه الزماله جزء من الروتين اليومي بالجامعة او المدرسة والتي قد تمتد لخارج الجامعة ( على سبيل المثال : مشاريع التخرج بالكليات العملية، و مجموعات العمل على مدار سنين الدراسة و التي في أغلب الاحيان يتم تكوينها بواسطة الدكتور او يكون من الافضل تنوع المشتركين فيها ما بين اولاد و بنات للزيادة من ثراء الافكار و تنوعها و اختلافها).<br />2--كل فتاه تشعر بان المجتمع يقهرها او يمنح للشاب ما لايمنحه لها ليس لها سوى علاج بسيط جدا ليس من ضمنه ما تضمنه هذا التحقيق الا وهو زياده وعيها الديني ومحاولة التقرب الى الله وعندما يحدث ذلك ستشعر كم كانت مخطئة وكم اخطات في حق والديها.<br />فعلى حد علمي ان الكثير من الفتيات الملتزمات لا يشعرن ابدا بقهر او ظلم او تفرقه في المعامله<br />وذلك نظرا لتفهمهن التام للفرق الجوهري بين الشاب والفتاة .<br />-- كلام جميل بس والهي موجود في الفقرة قبل الاخيرة بعنوان ( حدود الله أهم).<br />و بشكل عام فالموضوع تحقيق...مع بنات حقيقيات..موجودات بالفعل..ولا يصح أن نتجاهلهم بغض النظر عن معتقادتنا فيما هو صحيح ومن حقهم ان نستمع لهم ..وربنا يهدي الجميع..<br />و تفرقة بعض الاهل في المعاملة بين الأبناء خاصة الاناث و الذكور...في أعتقادي ليست شيء من وحي الخيال..بدليل ان هناك فتاوى شرعيةحول هذا الامر..وجرب تدخل على google.com<br />وتكتب التفرقة بين الابناء...ستجد مئات الفتاوى والمقالات والبحوث والمشكلات ...والكثير منها على مواقع اسلامية و تربوية..<br />شكرا..وربنا يهدي الجميع.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134306/http://www.20at.com/article2.php?sid=943"

[[comments]]
order = 2
subject = "الباب مفتوح"
author = "مسلمه"
posted = "2006-06-15"
text = "للاسف انا فى الفتره اللى كل صحباتى كان اهلهم فرضين عليهم حراسه مشدده \"فى الاعدادى والثانوى\"<br />اهلى كانو بيرحبو جدا انى اخرج لوحدى مع صحباتى حتى من غير ما يعرفو صحباتى \"غير بحكاياتى عنهم\" بس انا كنت برفض ده وكنت بافتكر انهم راميين طوبتى دايما لما كنت بحب اخرج ماما كانت بتقولى \"الباب مفتوح\"<br />وكان كل صحباتى بيحسدونى لدرجه انى فى الثانويه رجعت من الدرس الساعه 12 فى تاكسى ولما طلبت منهم يجو يخدونى قالولى تعالى لوحدك عادى<br />من ساعتها اتعلمت ان الحدودة انا اللى احطها لنفسى وطالما عندى حريه لازم استغلها صح كويس ان الاهل يكونو واثقين فى بناتهم وده المفروض<br />اللهم اهدى فتيات المسلمسين اللهم اهدى شباب المسلمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134306/http://www.20at.com/article2.php?sid=943"

