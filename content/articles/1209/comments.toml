[[comments]]
order = 19
subject = "بطالب بالمساواه .. الولد زي البنت .. ميتأخرش برة البيت"
author = "واحدة وخلاص"
posted = "2006-06-29"
text = "موضوع رائع جدا<br />وحل سليم وبسيط جدا<br />لمشكلة موجودة في كل البيوت<br />فعلالو البنت صاحبت والدتها ووادها واخواتها الصبيانوانها تقول لهم على كل حاجة بصراحة صدقوني ده حيفرق معاها كتير...<br />طبعا ده لازم يقابله تفاهم وسعة صدر وتجاوب من الاسرة...<br />اما عن التفرقة بين الولد والبنت في المعاملة فأنا برفضه لان نتيجته بتكون سلبية وسيئة على الطرفيين<br />وبطالب بالمساواة في الخروج من البيت<br />مش معنا كدة ان البنت تتأخر برة البيت..!!! لأ انا بطالب ان الولد هو اللي ميتأخرش برة البيت....!!!<br />لأن الوقت اللي احنا فيه دلوقتي الخوف على الولد زي الخوف على البنت بالظبط..<br />وعلى فكرة الولاد اللي اهلهم بيتساهلوا معاهم بيطلعوا معندهمش مسؤلية.. وميقدرو يعتمدوا على نفسهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134306/http://www.20at.com/article2.php?sid=943"

