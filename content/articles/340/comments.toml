[[comments]]
order = 5
subject = "وأنا كمان"
text = "أنا كمان مع الأخ اللي فوق<br />حر ايه في الاكصدام ده؟<br />ده حتى السلانسيه مفوت والبوجيهات معرقة، والزيت بينقص والكوندينسر هيتغير والمياه الغازية لازم تنزل<br />عيب كدة وبعدين يا جماعو يا بتوع هيئة مش عارف ايه<br />ايه الصياغة الهباب للبيان دي؟...!!! ال ايه عشان هو مسلم لا يجوز للكفار انهم يعملوا فيه ايه ... !!!<br />فيه عبط أكتر من كدة في الصياغة فيه تشويه للإسلام ألذ من اللي الجماعة دول عملوه ؟!!!<br />يا جماعة لأنه إنسان - مش لأنه مسلم- لا يجوز لأي حد انه يعمل له حاجة لو كافر ومسلم هو اللي بيعذبه لازم نزعل تمام زي ما العكس لو حصل<br />محتاجين ننضف لساننا من الكلام السخيف اللي مش فاهم الناس بتجيبه من أي ثقافة<br />وبالمناسبة دي عربيتك محتاجة ظبط تاكيهات"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022012804/http://www.20at.com:80/article.php?sid=506"

[[comments]]
order = 6
subject = "مصادر"
text = "قالت مصادر عراقية مطلعة إن سالم الجلبي رئيس هيئة محاكمة الرئيس العراقي صدام حسين يُشتبه بصلته بقضية قتل موظف كبير في وزارة المالية في الحكومة المؤقتة.<br />وأكدت تلك المصادر لمراسل \"قدس برس\" أن سالم الجلبي قام بتهديد هيثم فاضل، وهو مدير في وزارة المالية كان مكلفا بإعداد تقرير عن أموال الحكومة العراقية، ومن بينها تلك التي استحوذ عليها حزب \"المؤتمر الوطني\" الذي يتزعمه أحمد الجلبي عمّ سالم الجلبي.<br />وتفيد المعلومات أن سالم الجلبي قام بتهديد هيثم فاضل بعد أن قام موظف آخر في وزارة المالية بتسريب معلومات عن التقرير الذي يتم إعداده إلى سالم الجلبي، مما أثار غضب الأخير، حيث قام بتهديد فاضل الذي أخبر بدوره زوجته بالتهديد، وبأن الجلبي هو من هدده، كما قام بتصوير التقرير الذي أعده ووضعه في مكان آمن، حيث قدم إلى رئاسة محكمة الجنايات في بغداد، وفي الثامن والعشرين من أيار (مايو) الماضي قتل هيثم فاضل، ومنذ ذلك التاريخ ما زال الفاعل في تلك الحادثة مجهولا."
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022012804/http://www.20at.com:80/article.php?sid=506"

