subject = "الخبر تم نفيه برمته"
text = "نفت هيئة علماء المسلمين خبر إغتصاب صدام بشدة<br />نفت الحكومة العراقية وفاة صدام<br />نفى وزير حقوق الإنسان العراقي إصابة صدام بالسرطان<br />أكد الصليب الأحمر الدولي انه زار صدام اليوم في سجنه في مطار<br />بغداد اليوم<br />منقول عن ساحة حوار إسلام أون لاين.نت باسم (نضال مواس)"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022012804/http://www.20at.com:80/article.php?sid=506"

