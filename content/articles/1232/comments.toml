posted = "2006-03-06"
text = "انا بجد زعلانة اوى من طريقة المناقشة و الحوار نريد مزيد من الاحترام للغير و الاستاذ قريش ميصحش اللى انت قولتة لان دى وجهة نظرة وهو حر فيها و لو عيز تعلق علق على الموضوع مش على كلام الناس لان دى حرية راى وانا اتفق الى حد كبير مع الراى الاخر يا شباب الاسلام اتقوا ربكم حتى تفلحوا"
