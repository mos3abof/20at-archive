[[comments]]
order = 16
subject = "طريقة متدنية فى الحوار"
author = "باندورا"
posted = "2006-07-13"
text = "مستوى الحوار المتدنى اللى بدأ بيه الاخ الذى لم يذكر اسمه تحت عنوان كنت فاكر اتجاهكم اسلامى...مستوى للاسف يرثى له ويلخص وضعنا المرزى بين الامم...<br />نحن يا سادة لم نتعود الاستماع فقط الكلام ..ومبدأ خدوهم بالصوت ...هو السائد...<br />اهو انت مثلا يا اخى الكريم...رأيك صحيح مئة بالمئة...لكنك لم تنتق لغة حوارك..وبالتالى فقد رأيك مصداقيته..<br />منين عايزنى اصدقك وانت بتتكلم بوجهة نظر دينية بحتة ...وعلى الجانب الاخر تعبر عنها باسلوب حوار متدن كهذا؟؟؟!!<br />قمة التناقض....والتطرف فى ابداء الرأى ...وانا اعتقد ان رب العالمين امر رسوله الكريم بما يلي:<br />\"فذكر انما انت مذكر ..لست عليهم بمسيطر\"<br />فمن نحن كى نعطى لانفسنا الحق فى انتقاد الاخرين بهذا الاسلوب المهين...<br />والى ان نتعلم لغة الحوار ..لنا الله!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134613/http://www.20at.com/article2.php?sid=436"

