text = "هايل انكو قلتو عشان اخد بالي بس ساعتها بقى ما تقلقوش يا شباب لمايرتفع الطلب من جديد على اكياس النايلون والسواطير<br />بس تفتكرو خطيبي ممكن يعملها ؟<br />يبقى الله يرحمه على طول"
