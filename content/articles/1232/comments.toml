[[comments]]
order = 3
subject = "كنت فاكر اتجاهكم اسلامي"
author = "كنت فاكر ان اتجاه الموقع اسلامي"
posted = "2006-02-18"
text = "لكن يبدو انه يجمع من المواضيع الصالح على الطالح ...زي الموضوع الخايب ده ...<br />و وجه الخيبة فيه : انه بيتكلم عن العلاقات بين الشباب و الفتيات و كأنه أمر عادي ...<br />اتقوا الله ...<br />ده بدل ما تدعو الشباب للعفة و السعي للزواج عمالين تتكلموا عن علاقة الحب و التى هي :<br />- اصلها معصية الاختلاط و الخلوة بالاجنبية<br />- و خيانة الفتاة لاهلها ،<br />- و علاقات كلها بتدور في فلك زنا النظر و زنا اللمس !<br />جاتكم نيلة !"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134613/http://www.20at.com/article2.php?sid=436"

