[[comments]]
order = 10
subject = "موضوع عال العال"
author = "دودى"
posted = "2006-02-27"
text = "هاى على الناس اللى موجودة كلها والمفروض الناس اللى بتعلق ماتتريقش على حد ماشى يا (صقر قريش ) وعموما انا شايف ان فى طريقة للولد اللى مخنوق من بنوتة وعاوز يسيبها والموضوع ماذكرهاش بس طريقة عشرة على عشرة ومجربة وهى ان الولد مايتصلش بالبنت كام يوم كدا وبعد مدا يتصل بيها ويقول لهاان الفترة اللى فاتت كان قاعد بينوا وبين نفسوا وفكلر فى حياتوا وان اللى بنعملوا دا بيغضب ربنا ودا مش معناه انوا مابيحبهاش بالعكس هو متمسك بيها بس بالحلال ولحد مايجى الحلال دا نبعد عن بعض عشان مانزعلش ربنا مننا ويقولها ان هيا فى بالوا على طول واقول لما ينوى الجواز هاتكون هيا اول انسانة هايفكر فيها دا لو فى نصيب ولو ماكنش فى نصيب نلتقى فى الجنة. اية رأيكوا بقى. مش حلوة الطريقة دى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134613/http://www.20at.com/article2.php?sid=436"

