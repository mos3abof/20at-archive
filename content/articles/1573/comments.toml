[[comments]]
order = 0
subject = "ابن مصر"
author = "صر ام الدنيا وعيالها كتير"
text = "الغني و الفقير<br />السفير واوزير<br />نجيب وثومه وزويل همه الدليل<br />وانا ايمن نور ابن مصر الكبير<br />اللي هيأخد باديها للتغير<br />هي وانا والنيل الكبير<br />هنبدر ونسقي مصر ببذور التغير<br />ده انا ايمن نور ابن مصر الكبير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145809/http://www.20at.com/article.php?sid=1025"
