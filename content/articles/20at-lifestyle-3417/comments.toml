text = "والله من قبل ما أقرا الموضوع … قلت إنه إنت …<br />واضح إن كلهم كان عندهم حق …<br />إلي الأمااااااااااا اااااااام يا روميل …<br />إحم … قصدي يا يسر<br />كل سنة وإنت أطيب … وأحسن ..و أفضل … وأنفع …<br />كل سنة وإنت طيبة …<br />بس مش حاسكت برضه<br />لا للتمديد … لا للتوريث … نعم لتعديل الدستور المصري \"بس مش يعدلوه للدرجة دي يعني\"<br />mohamedmat@hotm ail.com"
