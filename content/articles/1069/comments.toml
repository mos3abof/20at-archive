subject = "أعرفه"
author = "أعرف نجيب محفوظ الكاتب أعرفه جيدا عندما استهوتني القراءة كنت اقرأ لطه حسين والحكيم ويوسف السباعي وأنيس منصور وآخرون لكن نجيب محفوظ كان شيئا آخر ."
posted = "2006-09-06"
text = "كان أول ما قرات له ( دنيا الله ) . كنت قبل ذلك أسأل لماذا نجيب محفوظ بالذات دون الآخرين و قرأت و عرفت . اقراوا نجيب محفوظ و ستعرفون لماذا هو فارس نوبل."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131738/http://www.20at.com/article2.php?sid=1184"

