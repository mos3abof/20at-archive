text = "بصراحة انا مقرتش ليه حاجات كتير بس انا اعرف عنه انى هوفارس نوبل وولد عام 1911 وانا قلاتله قصة انت عمرى و لاانام والبنات والصيف والثلاثية يعنى اعرف عنه حاجات بسيطة جدا جدا"
