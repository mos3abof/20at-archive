[[comments]]
order = 6
subject = "إلى أم مفروسة و إلى مجاهد"
text = "وفقك الله يا مجاهد ، عملك يدل على الصبر ، ثمّ لا حدود للطاقات إذا استغلت بشكل صحيح لكن اسأل الله أن يرزقك مكان مريح يناسب قدراتك و يلبي احتياجاتك ، و أن يسخر للبنات المدرس القوي الأمين مثلك إذا كان لا بد من الإستعانة بالرجل عوضاً عن المدرسات.<br />و لابد من حسن الظن بالأخ صحيح أن الوضع بالأساس خطأ لكنه ليس هذا الخطأ المؤسسي الوحيد بالبلد. و أشكر أم مفروسة لتسليطها الضوء على أمر (الخطأ للعملية ككل) لكي لا يموت فينا الشعور بخطأ الوضع بحكم الألفة و نتناسى تحكيم الشرع في ذلك ، أصلح الله الأوضاع و حكم شرعه في بلاد المسلمين.<br />أبو حسّان 4/4/1425هـ"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050641/http://www.20at.com:80/article.php?sid=89"

[[comments]]
order = 7
subject = "ابراهيم سعيد"
text = "انا ما كلمتش قريات المقال لاني حاسس باللي هوه فيه بس المفروض يعني ان الراجل ده تربيه يعني كان بيزل تربيه عملي في سنه تالته ورابعه علي مدارس ثانوي عام يعني والمفروض ان الاتكاك بالطلبة خاصة الثانوي مش جديد عليك كراجل دارس في كلية تربيه وبعدين تعالا اتفرج علي اللي بينعمل فينا في المدارس هنا في طنطا هي مدارس بنات اي نعم بس انا كششاب كنت في تربيه عملي هناك وبامانة الله طلعو عيني"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050641/http://www.20at.com:80/article.php?sid=89"

[[comments]]
order = 8
subject = "بنات ثانو ى"
text = "فى بعض البانت فى الثانوى تكون بتحب الجنس تروح على حد تعرفة وتقلع ادامة و تفشخ كسها وددعكلة زبة وتنيها تمص فية الراجل امنا يلاقى وحدة عايزة تناك لازم المراة تجذبة ليها وتفتح لة البنطالون وتحك كسها فى زبة اوى اى بنت متناكة تحب تتناكككك تروح تتناكة بعيد وراء الجدران وفى الترب والمقابر وعند امها يا ولا الوسخة"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050641/http://www.20at.com:80/article.php?sid=89"

[[comments]]
order = 9
subject = "ما شاء الله"
text = "جزاك الله خيرا ... يمكن كمان (والله أعلم) أنبهر أن في حاجة زي كده ... جزاك و جزاها الله خيرا ... ترى هل من الممكن نشر عنوان هذا المحل .. بما أنها تشكو من قلة الدخل .. نشر العنوان سياسعدها على زيادة دخلها . و أيضا يعين كثيرا من النساء و البنات على الذهاب إلى أماكن موثوق بها. يمكن أن يتعلمن منها ما هو جائز أو غير جائز في تجميل أنفسهن. زي الحواجب ... يعني في كثبر من المحلات المخصصة للمحجبات .. تقوم بفعل أمور نهى عنها الشرع<br />جزاك و جزاها الله خيرا"
archived = "2004-08-06"
capture_url = "https://web.archive.org/web/20040806020036/http://www.20at.com:80/article.php?sid=89"

