subject = "طبعا عارف انا مين"
text = "الله ينور يا عم مجاهد.قدرة جيدة على السرد بطريقه اخذتنا الى المكان والى المدرسه.استطيع تخيلك وانت تشرح وداخلك الف احساس.كما استطيع الاحساس الذى بدأ يتغير من حولك وداخلك.يا راجل دا انا كمان قادر على التخيل البنات اللى كانوا بيرقصوا:-)) ...(اعرف ان داخلك الكثير من القدرة على الفعل والفعل بقوة كمان واعرف ان بداخلك مشروعك الخاص ربنا معاك يا مجاهد)"
