[[comments]]
order = 18
subject = ""
author = "صلاح بدر"
posted = "2007-12-27"
text = "أنا احيك على هذه التجربة الفريدة والرائدة ومن هنا يجب أن تعتني وزارة التربية والتعليم وتأخذ بهذه التجربة<br />وأنه ليس من المستحيل أن ترتفع راية العلم مرة أخرى وأن يرفع المعلم رأسه بدل النكسة التي نمر بها في التعليم وهنا استطيع أن اقول أن المعلم هو السبب في نكسة التعليم بمساعدة الوزارة التي لا تراعي اللي في اولادنا فلو احترم المدرس نفسه كما فعلت حضرتك وانا أبجل فيك هذه الروح التي تنقص الآلاف من المدرسين الذين ليس هم لهم الا جمع الفلوس، ولو يعلمون أنهم السبب في خراب اقتصاد البلد كله لتراجعوا عن دروسهم وجمعهم المال من الغير قادرين على المعيشة لتعليم اولادهم<br />الكثير من المدرسين يشتكون عدم احترام الطلبة لهم ولكن من قصتك استطيع ان اقول له انت السبب<br />أري بعيني في بعض الأحيان واسمع الطريقة التي يتحدث به الطالب لمدرسه ولا أصدق كيف يجرؤ التلميذ على اهانة مدرسه وما هو السبب - فهنا اقول ان السبب المدرس<br />والمدرس باستطاعته ان يبني الأجيال - فالطبيب الفاسد لابد ان يكون من معلم فاسد وبمشيئة الله يقع ابن هذا المدرس او اهله تحت يد هذا الطبيب الفاسد وليعلم ان الله لا يتركه ابدا<br />والمهندس الفاسد الخرب الذمة - كذلك بسبب المدرس<br />والمنافقون والمرتشون وغيرهم - كلهم بسبب هذا المدرس خرب الذمة<br />فاتقوا الله في أنفسكم وفي أبناءكم واعلموا أن الله لن يترككم ابدا وان المال الحرام وأنا اسميه حرام والكل يجتمع على ذلك مال الدروس الخصوصية لن تكون فيه بركة لأنك جمعته بدون وجه حق وبدون أن تقوم بعمل الموكل إليك في المدرسة<br />أين القدوة التي كانت في الزمان أين احترام المدرس لا حول ولا قوة إلا بالله"
archived = "2009-11-15"
capture_url = "https://web.archive.org/web/20091115170030/http://www.20at.com:80/banat/only-for-men/49-2009-11-02-15-10-37.html"

