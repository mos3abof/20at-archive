posted = "2009-12-06"
text = "السلام عليكم ..<br />قال الله جل ثناؤهُ وتقدست أسماؤه (( مَنْ يَتَوَكل عَلَى اللّه فَهُوَ حَسبه )) - و كماعلمنا نبيُنا و طب قلوبنا صلى الله عليه و سلم (( إذا استعنت فاستعن بالله )<br />فهذا ما قُمت أنت به أولًا . . .<br />قال الله جل ثناؤهُ و تقدست أسماؤهُ ((وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجاً{2} وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ )) .. (( ومن يتق الله يجعل له من أمره يسرًا ))<br />وهذا فِعلُك ثانيًـا . . .<br />أسأل الله العظيم أن يُبارك لك و فيك و عليك و أن يحعل عمل كله صالحًا و لوجههِ خالصًا . . . آمين<br />حفظــك الله أخي الفاضـــــل"
