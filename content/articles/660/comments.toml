[[comments]]
order = 0
subject = "حقل الألغام"
author = "القط الأسود"
posted = "2006-09-18"
text = "على فكرة... منطقة العلمين أقصد يعني كل الصحراء اللي حواليها معروف إن لسة فيها ألغام من أيام الحرب بين روميل ومونتجومري... بجد مش عارف الناس كانت بتجيب وقت تزرع فيه الهجص ده إمتى...<br />على العموم ياريت بجد يكون موضوع النباتات اللي بتاكل الأغام ده واقع بجد ويناقشوه في مجلس الشعب لأنه فعلاً خطير..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113802/http://www.20at.com/article2.php?sid=1232"

[[comments]]
order = 1
subject = "نباتات تكشف الألغام"
author = "د/ ايمن المغاوري"
posted = "2006-09-20"
text = "تحية طيبة<br />لقد اعتدنا في الفترة الأخيرة علي سماع الفرقعات الصحفية التي يطلقها المسئولين بالمركز القومي للبحث و التي نتمني بكل صدق و امانة ان تكون حقيقة واقعة و لكن ثبت للأسف عدم صدقها ولقد اتطلعت عن قرب علي البحث الذي قام به د/طارق عبد الرءوف بالإشتراك مع جامعة فلوريدا الأمريكية وكان هذا عام 2003 - 2004 أي منذ عامان ولقد اندهشت تمام الدهشة بالكلام المنشور و المذاع عن اختراع السادة الباحثين بالمركز القومي ان ثبت صدقه وهذ ماأشك به تماما وان صدق فاللأمانة العلمية كانوا لابد من التنويه للبحث الذي قام به د/طارق عبد الرءوف والمنشور من قبل فهذا ان دل فيدل علي عدم التنسيق العلمي في مصر و شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113802/http://www.20at.com/article2.php?sid=1232"

[[comments]]
order = 2
subject = "مصرى يتحدى الألغام"
author = "H.SH"
posted = "2006-09-25"
text = "الموضوع جميل جدا ونفسى كان يبقى بتاع مصر ولكن نحن لانملك إلا أن ندعو أيطبق على أرض مصر . وعلى فكره أنا إحدى طالبات د/ طارق عبد الرؤوف وأتمنى له مزيدا من التقدم لأنه فعلا نموذج نفتخر به وأتمنى ان يأخذ حقه وموضوعه ينسب له لأنى من الناس اللى قرأت الموضوع فى الأهرام وأستغربت جدا.أرجو من المسئولين الأهتمام بالموضوع ومناقشته بجديه. ياااااااارب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113802/http://www.20at.com/article2.php?sid=1232"

[[comments]]
order = 3
subject = "كلام جميل اوى"
author = "احمد محروس"
posted = "2006-10-02"
text = "احب اوضح حاجة صغيرة بس .. ان ما فيش حاجة اسمها نباتات بتكشف عن الالغام و تاكلها الكلام دة بس فى افلام السينما و افلام الرعب ... انا واحد من اللى كانوا شغالين فى الصحراء الغربية للتنقيب عن الالغام و احب اقول ان مش كل الصحراء مزروعة الغام دى مناطق قليلة جدا بس المشكلة انها مزروعة بطريقة عشوائية و اللى تخلى فى صعوبة فى العثور عليها مع عدم وجود الخرائط .... ربنا يخليلنا روميل."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113802/http://www.20at.com/article2.php?sid=1232"

[[comments]]
order = 4
subject = "مشكلة الألغام"
author = "احمد"
posted = "2006-10-11"
text = "الالغام مشكلة عالمية يعاني منها العالم منذ فترة طويلة وهي السبب الرئيسي في اعاقة تنفيد مشاريع تنموية ...<br />كما ان ازالتها تكلف اموال طائلة قد لاتقدر عليها بعض الدول<br />لذلك نتمنى ان يكون هذا الاكتشاف حقيقة وليس مجرد اوهام كما نتمنى توضيح اكثر عن هذه البحوث"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113802/http://www.20at.com/article2.php?sid=1232"
