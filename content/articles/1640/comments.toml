subject = "من المسؤول عن تنصير المسلمين؟"
author = "يا أخوة -لا تقولوا أن أمريكاوغيرها من دول الكفر تنصر المسلمين ، فهذا حق ، ولكن هذه الدول كافرة وتريد من المسلمين أن يخرجوا من دينهم وهذا هو عملها."
posted = "2006-03-26"
text = "أقرؤوا (ودوا لو تكفرون كما كفروا ، فتكونون سواء)<br />المسؤول عن تكفير المسلمين ومعاونة الكافرين لاخراج المسلمين عن دينهم هم : ال سعود ، وحسني مبارك ، وبرويز مشرف وغيرهم من طواغيت العرب، فلولاهم ما تجرأت دول الكفر على المسلمين ، ولولا خيانتهم ماضرب الكفر باطنابه في ديار الاسلام ، فهم -والله - العدو قاتلهم الله أنى يؤفكون."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151227/http://www.20at.com/article2.php?sid=622"
