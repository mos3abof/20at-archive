subject = "الى معاذ"
author = "عبدالله مفتاح"
posted = "2006-10-04"
text = "يعني انت عايز الفن من غير محجبات وعايز الفن يفل منحط اخلاقيا<br />امال بيسمو بالاخلاق ازاي؟<br />ولا هو اي كلام في اي كلام وخلاص؟<br />مش بتفكر في حلال وحرام....<br />اللي انت عايزه الفن يبقى كويس ومش مهم حلال او حرام؟"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060948/http://masr.20at.com:80/article.php?sid=1002"

