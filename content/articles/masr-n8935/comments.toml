[[comments]]
order = 6
subject = "سلاح ذو حدين"
author = "BATISTUTA"
posted = "2006-10-02"
text = "فعلا هناك محجبات يسئن للحجاب ويجعلون منهم فرصة للهجوم على الحجاب من دعاة الحرية والتقدم.<br />لم ارى محجبة تظهر على التلفزيون الا وتتفنن فى تزيين وجهها بالمكياج وانواع مختلفة من الايشاربات .<br />انا لا اعترض على عمل المحجبات فى التلفزيون بس يبقى بعيد عن المغالاة فى التزين حتى لا يصبح الحجاب مجرد قطعة ديكور فى رأس المرأة .<br />بس دا ما يمنعش ان انا معجب بمسلسل حنان ترك فكرته جميلة بس المعالجة ليست جيدة ."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060948/http://masr.20at.com:80/article.php?sid=1002"

[[comments]]
order = 7
subject = "صح بطريق الخطاء"
author = "انسان"
posted = "2006-10-02"
text = "اعتقد ان الاعلام المصرى اتخذ قرار صائب بنيه الخطاء فمنع ظهور الحجاب فالاعمال التلفزيونية هو قرار صائب لان الشرابات التى ترتديها تلك الفانانات بنيه انه حجاب هو الاسائة الحقيقية للحجاب فالحجاب برئ من تلك العاهرات على مدار السنين الاتى عدن لكى يكملو مسيرة الاساءة والهدم لكل ما هو صحيح فالحجاب له شروط وواجبات وليس مجرد قطعة من قماش ترتديها المراءة وتسئ اليها مثلما يفعلون وعقابهم سيكون عسيرا واشد من عقاب العاهرات لان العاهرات معروف عنهم انهم كذلك اما هؤلاء فمثلهم كالمنافقون يرتدون الحجاب ويسيؤن اليه فيمنعون كل من تراودها نفسها الى التوبة ان تتوب لان التوبة اصبحت قطعة من قماش ترتديها المراءة ولا تتغير<br />واخيرا حسبنا الله ونعم الوكيل فى اعلام اصبح هدام واناس اصبحو اشد خطرا من اليهود والشيعة ويطلقون عيهم فنانين وان كنت قرات قبلا ان الفن فى العربية معناها الحمار الوحشى (مع الاعتذار لكل حمير العالم)"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060948/http://masr.20at.com:80/article.php?sid=1002"

[[comments]]
order = 8
subject = "قول باطل يراد به باطل"
author = "BATISTUTA"
posted = "2006-10-02"
text = "فى جريدة صوت الامة العدد الماضى بتاريخ 2/10/2006 قرأت لقاء لاسامة انور عكاشة ومن ضمن الاسئلة بالطبع سئل عن اعمال المحجبات سأنقل لكم السؤال والاجابة بالنص .<br />مارأيك فى اعتراض المحجبات على عدم عرض مسلسل واحد من مسلسلاتهن ؟<br />عليهن ان يصمتن احسن دول قاعدين يقولوا 90% من بنات وسيدات مصر محجبات ويتجاهلن ان هذا يرجع لحالات التهديد والارهاب التى يمارس على الفتيات والسيدات غير المحجبات فالسيدة تتحجب ليس عن اقتناع بينما بسبب الخو من نعتها بتهم مخلة بالشرف والسيدات الفاضلات اللاتى عدن للتمثيل ولم يذع التلفزيون لهن مسلسلاتهن ،أعمالهن على الفضائيات المختلفة وقد شاهدتها وهى اعمال تافهه ليس فيها شئ عليه الطلب ورجوعهن للتمثيل يرجع لسبب من اثنين الاول هو المال والثانى هو توظيف المسألة وهابيا ..اى ان عودتهن خطوة لوهبنه الفن فى مصر لكى تتحجب كل الممثلات وهذه آفه اصابت المجتمع المصرى .<br />وكيف نداوى هذه الافة من وجهه نظرك ؟<br />لن نتغلب على ذلك الا بالحرص على تنوير الناس ورفض النعرات الكاذبة وكشف الحجاب عن العقل وهو اسوأ انواع الحجاب .<br />هل ترى ان هناك تناقضا بين حديث المحجبات فى الاعلام وبين مضمون اعمالهن ؟<br />نعم وهذا واضح بشدة من خلال الازدواجية التى نراها فى دور بثينة رشوان فى مسلسل سهير رمزى الى لم يهمها سوى ان تستغل افيه عودتها كمحجبة وعندها كمان الجرأة ان تحتج وان تقول ان التليفزيون منعها عمدا لكننى اعتقد ان اسباب المنع لو كان هناك منع فنى لان المسلسلات ضعيفة جدا.<br />لكن هناك ترى ان عدم عرض مسلسل واحد للمحجبات يمثل اتجاها للدولة ؟<br />لو كان هذا اتجاه الدولة فانا معه واؤيده مائة فى المائة لاننى ارى ان عودة المحجبات مقدمة لرأس جسر الفكر الوهابى وانا لا امانع ان تتحجب المرأة عن اقتناع اما ان ت<br />اقرأ بقية التعليق .."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060948/http://masr.20at.com:80/article.php?sid=1002"

[[comments]]
order = 9
subject = "مش لايقين"
author = "عابد"
posted = "2006-10-03"
text = "ده حتى شكلهم يا اخى ، اللى داهنه وشها زى الهنود الحمر و اللى منزله شويه من شعرها قال يعنى ، واللى تلاقى بقيه لبسها لا يتناسب مع الحجاب ، واللى كلامها كله شتيمه و قرف وده برضه لا يتناسب مع من تدعى الخلق الرفيع.<br />ومن يقول ولماذا ينتقدوهم ، هو لو كل واحده تعد فى بيتها خلاص محدش هيجيب سيرتها ، انما كونهم يخرجوا علينا فى المسلسلات و الفضائيات فمن حقنا ان ننتقد هذا الذى نشاهده.<br />ومن يقول خلاص لا تشاهدوهم و كل واحد حر ، ماشى يبقى نترك من ينتقدوا الاسلام ايضا يتحدثوا ولا نشاهدهم او نعلق عليهم وكل واحد حر برضه ،... كل واحد يتحدث فى وسيله اعلام سواء تلفزيون صحافه او اى شىء يصل لكل الناس فمن حق كل الناس هؤلاء ان تعترضوا او يوافقوا."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060948/http://masr.20at.com:80/article.php?sid=1002"

[[comments]]
order = 10
subject = "النظريه"
author = "لست من مؤيدى نظريه المؤامره ، ولكن لو نظرنا الى دول كانت تعتبر متشدده تحاول الان الاتجاه للتمثل سواء بصناعه السنما او التليفزيون او تنظيم المسابقات الفنيه"
posted = "2006-10-03"
text = "وفى المقابل ظهر فى مصر الجدل حول حرمانيه التمثيل او حلاله ، الحجاب او دون الحجاب او النقاب...الخ<br />قد لا تكون مؤامره مدبره و قد تكون ، و لكن المعروف و المؤكد ان لا اتفاق بين الدول العربيه و الخلاف بينهم يصل الى حد العداوات و القتال وان العالم العربى منقسم الى تحزبات دول الخليج دول الشام مصر دول المغرب العربى ودوله او اثنان مهمشتان كالسودان و موريتانيا.<br />والامر يتضح فى اجتماعات العرب على مستوى القاده دائما نسمع عن خلافاتهم التى يصل الى الشتيمه و الاهانه ... وعلى مستوى الشعوب نسمع كثيرا عن مشاكل الجاليات العربيه فى الدول العربيه الاخرى، بلاش دى شوف ابسط حاجه مباراه بين فريقين عربيين و ما يحدث فيها.<br />الذى اريد ان اصل اليه من هذا كله ، انه اذا كان هناك غزو ثقافى اجنبى فاسد علمانى.....الخ ، فهناك فى المقابل غزو سلفى متخلف يريد تحويل مصر الى دوله كافغانستان."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060948/http://masr.20at.com:80/article.php?sid=1002"

[[comments]]
order = 11
subject = "غزو سلفى قال"
author = "حلوة اوى غزو دى تلاقيهم داخلين القرى والمدن يفتحونهاوبحد السيف عشان الناس بتوع الاسلام دين عنف يعجبهم الكلام ما هو غزو بقى ويطلبوا منك ان تسلم او تدفع الجزية ."
posted = "2006-10-03"
text = "غزو مين يا عسل انت مش عاجبك كلامهم ما تسمعش بس ما تقولش غزو الله يكرمك ولا يبقى كل حاجة غزو على جنابك ويبقى عمرو خالد غزو رغم عدم اعجابى به والازهر غزو... ربنا يهدى المسلمين"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060948/http://masr.20at.com:80/article.php?sid=1002"

[[comments]]
order = 12
subject = "ملاحظات شخصية"
author = "معاذ محمود عامر"
posted = "2006-10-03"
text = "(1) مسلسلات السيدات المحجبات جاءت هذا العام رديئة لأقصى الحدود, وباستثناء أولاد الشوارع لحنان ترك وقلب حبيبة لسهير البابلي, فان بقية المسلسلات جاءت وعظية بطريقة فظة تتناقض مع مفهوم الفن,<br />كماأن الأداء كان ضعيفا بطريقة ملحوظة.<br />(2) أنا ضد سياسة المنع مطلقا, فالمنع حل بربري وغير ديمقراطي وبلا فائدة, لذلك من حق الكل أن يقدم ما يريد, ومن حقه أن يعرض ما قدم, ومن حقنا نحن كجمهور أن نرفض أو نقبل.<br />(3) أنا أرى أن الحجاب يتناقض مع التمثيل, ولن يلتقيا مهما فعلنا فقد تحتاج المشاهد أن تكون الممثلة بملابس المنزل, وليس من المنطقي أن نرى السيدة في منزلها ترتدي عباءة ب700 جنيه مثلا كما هو ملاحظ في بعص مسلسلات المحجبات هذا العام, لذا أعتقد أنه من الأفضل للمعتزلة أن تعتزل الفن مطلقا,وتبحث عن مصدر آخر للرزق لا يتعارض مع حجابها,وعليها أن تضحي طالما اختارت الحجاباقتناعا,<br />وأنا هنا لا أرفض الفن ولكن أرفض عمل المحجبات بالفن, لأنهن سيفسدن نصوصا وأعمالا كاملة بسبب فرض شروط الحجاب على العمل الفني.<br />(4) ملحوظة للأخ اللي كاتب أول تعليق:<br />يبدو يا صديقي أنك لا تفهم معنى الدولة العلمانية, فليس معنى أن الوزير أنس منع مسلسلات المحجبات يبقى الدولة علمانية,<br />يا صديقي هذا شرف لا يستحقونه,فأين العلمانية فيما يفعلون من تعذيب واعتقالات ومنع المواطنين من حقوقهم الديمقراطية ومنع الفنون والآراء الحرة(أولاد حارتنا لحد النهاردة مثلا مبتنزلش رسميا وكتب أخرى لمفكرين كبار ممنوعة لها عقود)<br />يا صديقي هذا نظام لقيط بلا هوية ولا مرجعية ولاهدف اللهم الا الحفاظ على أمن النظام وطول بقائه جاثما على صدورنا المذبوحة من الشقاء والكبت."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060948/http://masr.20at.com:80/article.php?sid=1002"

[[comments]]
order = 13
subject = "سامحوني عشان الموضوع خارج عن الموضوع .."
author = "إبن بهية"
posted = "2006-10-03"
text = "هناك هوجة ماشية في البلد .. الكل يتحدث عن الصحافة ومهنة الصحافة وشرف المهنة وووو من ذلك البطيخ .. الحقيقة أن هذا الحوار الطرشاني أثير بشدة بعد أشهر من تغيير قوادات الصحف الحكومية ، بعد ما جابوا ربطة غجر .. كلاب .. جرابيع جدد من عينة القواد الكبير بتاع روزاليوسف أو دار الهلال وغيرهم من زعيط ومعيط ونطاط الحيط .. والله زعيط ومعيط وحتى نطاط الحيط أشرف منهم لأنه على الأقل بيعرق في نط الحيط .. لكن رؤساء التحرير الجدد بتوع الحكومة ما بيتعبوش خالص في أي حاجه .. عندهم حق طبعاً .. القوادة أسهل كتير أوي أوي من السرقة ونط الحيطان .. المهم من يوم ما جابت الحكومة حزمة الجرابيع دول والدنيا بتضرب تقلب .. طيب وهم الجرابيع اللي عطنوا وعفنوا على كراسي صحافة الحكومة ربع قرن كانوا حلوين ؟ طبعاً لأ الكل كلاب نباحة للسلطة وقوادين سياسة .. لكن الفرق هو أن الجدد من رؤساء تحرير الصحف الحكومية جايين حافيين وعايزين يثبتوا نفسهم عند سيدهم وولي نعمتهم وزي ما بيقولوا كل غربال وله شده .. فالأباعد دول مشدودين أوي أوي ونازلين رقص وتعريص للحكومة .. دي حاجه .. والحاجة التانية إنهم مش لاقيين مبررات منطقية وعقلية لإقناع القاريء بما يكتبون .. يعني بالبلدي كده مش لاقيين اللي يقولوه عشان يجملوا صورة النظام القذر فتلاقيهم ينزلوا شتيمة وقلة حياء وتهبيش في خلق الله وادعاء باطل للوطنية التي يفتقدونها تماماً.<br />من رأي منكم برنامج البيت بيتك لمحمود سعد منذ يومين وكان ضيفه أحد هؤلاء الأقذار الجدد يسمونه عبدالله كمال ويولونه روزاليوسف سيعلم يقيناً لماذا كل تلك الهوجة والزوابع حول الصحافة وشرف المهنة .. في اليوم السابق له كان الضيف أحد القوادين القدامى (سمير رجب) والفارق واضح بين الاثنين .. جيل القوادة والدعارة الصحفية<br />اقرأ بقية التعليق .."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060948/http://masr.20at.com:80/article.php?sid=1002"

[[comments]]
order = 14
subject = "عين فى الجنه وعين فى النار"
author = "ام محمد"
posted = "2006-10-03"
text = "اعتقد ان هؤلاء الممثلات الائى رجعن للتمثيل مره اخرى بعد ان هداهن الله لطريق النور والحجاب ينطبق عليهن هذاامثل عين فى الجنه وعين فى النار وانا رأيى الشخصى ان الممثله التى تعتزل لا ينبغى لها العوده مره اخرى الى هذا الطريق المظلم الذى يسمونه فن فن ايه ونيلة ايه ده كله حديث كذب الفنانه من دول اول ما تعتزل تختفى عن الانظار تماما وبعد فتره تطل علينا وتقووووووووووول ده مش اعتزال ده انا كنت وقفه مع نفسى براجع حساباتى لا اله الا الله مع تحياتى لكل ممثله اتزلت فعلا مش مجرد مراجعة حسابات"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060948/http://masr.20at.com:80/article.php?sid=1002"

[[comments]]
order = 15
subject = "تحية لعادل بن العادلة بين الزناة"
author = "سيكو"
posted = "2006-10-04"
text = "حذاري يابن تافة الأعاجم*** وإلا نال عرضك كل قاسم<br />أعادل إن أمك من مجوس*****لها ولع بإتيان المحارم<br />تأدب يا بن خالك دون شك***لعتت من الجحاجح والأكارم<br />يدب لخدر أمك يعتليها****أخوها العلج في ليل الفواحم<br />وجدك قائم بالباب هاجت***به الشهوات في شبق مهاجم<br />يناقل بين قائمتيه قهرا*****وينغط في خلاء نغط كاظم<br />وفاض به الغرام فلم يبالي****مقولة ناصح أو لوم لائم<br />فأولج في إست أمك نصف إير**فصاحت كله يابن الأشائم<br />وهاج الجار جار السوء هذا***فأقبل نحو ثالوث الغواشم<br />وألقمها هزيل الأير راحت*** تعاصره بفيها عصر ظالم<br />تعاورها الثلاثة ينكحوها *** تراوح فوقها فعل الحوائم<br />وأمك جودها بالعرض أضحى**يصاغر عنده جود لحاتم<br />تقلب طرفها من فرط شوق***لأير مثل أعواد اللهاذم<br />وتعدل بين طراق لديها**** كجور سدوم في غبش وعاتم<br />لهذا إسمك المنحول زورا**برغمك يابن ساعية الأراقم<br />حذاري ويل أمك أن تثرني**فتعلم هجمة الصيد الضراغم<br />عفوت اليوم عنك عن إقتدار**نجوت بجذع أنف منك راغم"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060948/http://masr.20at.com:80/article.php?sid=1002"

