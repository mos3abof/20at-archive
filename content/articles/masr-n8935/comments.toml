[[comments]]
order = 0
subject = "العلمانية"
author = "ابو اسامة"
posted = "2006-10-01"
text = "يبدوا اننا نتجه الى قيام دولة علمانية<br />بواسطة السيد جمال اتاتورك قصدى جمال مبارك فاين انتم ايها المسلمون اتسكتون حتى على التهجم على دينكم هل تنتظروا<br />حتى يعلن منع الحجاب فى الوقت الذى يلتزم<br />فيه الأخوة الشيعة بالحجاب فى اعلامهم<br />نبتعد نحن بفضل فاسدوا هذه الأمة الى الأنحلال وحسبى الله ونعم الوكيل."
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060948/http://masr.20at.com:80/article.php?sid=1002"

[[comments]]
order = 1
subject = "الاعلام العربي"
author = "حمدي"
posted = "2006-10-01"
text = "المسئولين عن الاعلام العربي عموما بيعانوا من حالة انفصام في الشخصيه<br />*** عندك مثلا الوليد بن طلال هو صاحب قنوات روتاناوفي نفس القت صاحب قناة الرساله<br />*** وصالح كامل هو صاحب قنوات ايه ار تي وهو صاحب قناة اقرا<br />***وايضا مالك قناة الناس هو مالك قناة الخليجيه الفاضحه<br />**وبالتلي كل واحد منهم عمل قناة تاخذك للجنه علي راي قناة الناس ... لكنه لم ينسي ان يعمل قناة تاخذك للنار<br />وبمناسبة قناة الناس فيه واحده اتصلت باحد الشيوخ امبارح حوالي الساعه التالته فجرا علي قناة الناس وسالت الشيخ عن ان بعض اصحابها صاموا مع السعوديه ... فرد الشيخ الفاضل وقالها ما خلاصته ان هذا جائز .. طيب الشيخ ده مش بيعمل فتنه بالشكل ده ... لما كل واحد يصوم بمزاجه ويبقي ليه رمضان خاص بيه .. فين دور الازهر في الرقابه علي مايقال في هذه القنوات<br />****بس رقابه ايه** كانوا الاولي عملوا رقابه علي بتوع الفيديو كليب<br />الله يرحمك يا ازهرنا الشريف"
archived = "2006-11-04"
capture_url = "https://web.archive.org/web/20061104060948/http://masr.20at.com:80/article.php?sid=1002"

