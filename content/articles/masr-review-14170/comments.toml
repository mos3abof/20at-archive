author = "ما بلاش سينما"
posted = "2009-11-26"
text = "اية رايكم بلاش سينما السنة دى<br />وبفلوس التذكرة تساعدوا بها واحدة غلبانة او واحد مسكين او طفل يتيم<br />هتشوفوا اية فى السينما<br />ابعدوا عن الزحام وانفلونزا الخنازير والزكام وبلاوى امراض الشتاء وممكن تشترى الفيلم على سى دى وتتفرج علية فى البيت على الكمبيوتر انت وصحابك وفى مكان امن<br />بلاش سينما السنة دى<br />يا اخى حتى حدادا على هزيمة المنتخب من الجزائر<br />ازعلوا شوية"
archived = "2009-11-28"
