text = "من الصعب أن تتخلى أمريكا عن إسرائيل خاصة إن اليهود يسيطرون على الإدارة الأمريكية بشكل كبير<br />ومن الصعوبة أن يقف أوباما أمام منظومة ضخمة يديرها الصهاينة<br />بس ممكن أمريكا ترخم على اليهود شوية زي قرصة ودن يعني، بس برده مش هيبقى في نظر أمريكا واعتبارها أي مصلحة للعرب والمسلمين"
