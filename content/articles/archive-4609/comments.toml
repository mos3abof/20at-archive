[[comments]]
order = 4
subject = "ثمن الحرية"
author = "إبن بهية"
posted = "2006-10-01"
text = "لا يوجد شيء في الكون أغلى من الحرية .. تلك المرغوبة والمطلوبة والمتبوعة والمرجوة والأمنية الغالية هي الحياة .. بلا الحرية لا حياة .. لذا هي تستحق الحياة نبذلها رخيصة من أجلها ... نعم الحياة هي ثمن الحرية ... عندما يقدم الثوار أرواحهم فداء لقضاياهم التحررية ، يستغرب جلادهم كيف هذا ؟؟؟ لأن الحياة عنده أغلى من أي شيء آخر وهكذا يفكر كل الجبناء المختبئين خلف كلاب الحراسة .. الحياة عند الحر الثائر هي أيضاً أغلى ما يملك ولكنها أرخص ما يمكن أن يقدمه ثمناً لحريته وكرامته .. الحياة ذاتها تفقد معناها إن لم تك حياة كريمة في حرية وعزة وإباء ..<br />يخطئ ويخطئ ويخطئ من يظن أن الحرية يمكن أن يهبها سارقها عبر جملة شعارات فارغة تحت عنوان أهبل سقيم اسمه إصلاحات ديموقراطية ... هذا هراء وخبل سياسي لا مثيل له .. الحرية لا يمكن تسولها ولا استجدائها ... الحرية تنتزع انتزاعا من يد سارقها بعد قطع يده ويد إبنه وعائلته ... الحرية يا سادة لا تستجدى .. الحرية لا يمكن تسولها ... الحرية تنتزع انتزاعاً وبالقوة والدم ..<br />لم يذكر لنا التاريخ من قبل شعباً ظل ألف عام يستجدي ويتسول الحرية ونالها ... إنه فقط زاد مهانته أكثر وأكثر ... لم يحصل شعب واحد عبر التاريخ على حريته مجاناً بلا دماء أو جرأة وشجاعة تغلبت على الدماء كما يطلقون عليها الثورات البيضاء ((بلا دماء)) هي بلا دماء حمراء بادية للعيان .. ولكن ماذا يا ترى كان حجم الدماء التي جفت في العروق من القلق والتأهب والإعداد والانقضاض على سارق الحرية ؟؟؟ أظن أنها دماء أكثر بكثير جداً من تلك التي أريقت في غيرها من الثورات الحمراء ... مجمل القول أن الحرية ليست مجانية على الإطلاق ...<br />الحرية لا تنال إلا بالدم .. الدم بكل أنواعه مراق على الأسفلت وجاف في العروق ...<br />اقرأ بقية التعليق .."
archived = "2006-11-15"
capture_url = "https://web.archive.org/web/20061115180817/http://masr.20at.com:80/article.php?sid=996"

[[comments]]
order = 5
subject = "مصر زمان"
author = "فارس"
posted = "2006-10-01"
text = "لى صديق مغترب معى فى احد الدول العربية هو فلسطينى الاصل اردنىالجنسية بالاضافة الىالجنسية البرازيلية التى لديه ,, فى احد الايام واحنا بنتابع اخبار الحرب على لبنان لقيته بيدعى لمصر ان ربنا يحررها استغربت جداسالته من اولى انك تدعيله دلوقتى مصر ولا لبنان !!! قالى مصر الاساس !! بطبيعة الحال سالته اشمعنا؟ الوقت ده وقت انك تدعلى للبنان قالى ربنايرحم مصر منحكم الطاغيةالعميل اللامباركى !! قالى دايما كانت مصر وعلى مر العصورهى بوابة الفتوحات والانتصارات الاسلامية دايما البدايةكانت من مصر ... ساعتها حسيت بحزن ومرارة قوى قوى .. اد ايه المسلمين معتمدين على مصر !!! قلت حسبي الله ونعم الوكيل فى اللامبارك العميل اللى اصبحت مصر فى حكمة لا حول لهاولا قوةحتىشعبها مش قادر يدافع عن ابسط حقوقه فى الحياة !! قلتله ربنايخلصنا منحكمه الطاغية اللامباركى وان شاء الله ترجع مصر بتاعة زمان ...<br />وحسبي الله ونعم الوكيل"
archived = "2006-11-15"
capture_url = "https://web.archive.org/web/20061115180817/http://masr.20at.com:80/article.php?sid=996"

