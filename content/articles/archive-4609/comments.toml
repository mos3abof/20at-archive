order = 0
subject = "بفضل الله ورعايته"
author = "مطلوب فوري"
posted = "2006-10-01"
text = "بفضل الله ورعايته قام العبد لله بفضح الحكومة المصرية على هذا الموقع وذلك باعتقال شيخ مشلول وعمره ثمانين سنه وهذه من خيبة الحكومة المصرية والقائمين عليها في حماية(الفاسدين) واعتقال المصلحين حكومة مش عارفه اي حاجه مش فاهمه اي حاجه مش عارفه هي رايحه فين وجايه منين وبتعمل ايه لان الحكومة مسلمة وتركت دينها ودين ابائها واجدادها فضاعت وضلت الطريق حكومة بتعتقل ابنائهاوحسبنا الله ونعم الوكيل ومن جهة اخرى لابد ان يرفض الشعب المصري اعتقال الشرفاء او المعارضين لان الحكومة المصرية هي التي امرت بالتعددية وامرت باطلاق الاحزاب فلماذا تكذب على الناس وتعتقلهم بلا اي ذنب ارتكبوه سوى انهم مارسوا حقهم السياسي<br />وانا عايز كل واحد في الحكومة المصرية سواء كان ضابط او وزير او اي مسئول يقتدي بحديث النبي عليه الصلاة والسلام لا يؤمن احدكم حتى يحب لاخيه ما يحب لنفسه المسئول اللي بيأمر بالاعتقال يمرر التجربة على نفسه الاول يتخيل ان هناك اناس جايين يعتقلوه هو من بين زوجته واولاءه ويتخيل المنظر زوجته تبكي واولاده يصرخون ساعتها حيغير رايه.<br />ونرجو من جميع المصريين العودة الى كتاب الله وسنة النبي محمد صلى الله عليه وسلم العودة الى دين الاباء والاجداد وصدق من قال نحن قوما اعزنا الله بالاسلام فلما طلبنا العزه في غيره اذلنا الله"
archived = "2006-11-15"
capture_url = "https://web.archive.org/web/20061115180817/http://masr.20at.com:80/article.php?sid=996"

[[comments]]
order = 1
subject = "و لكن"
author = "بنت حميدو"
posted = "2006-10-01"
text = "السلام على من اتبع الهدى<br />بارك االه فيك يا استاذ \"مطلوب فوري\", و لكن اتعتقد ان اي شخص من الذين نسمع عنهم يعتقلون و يضربون و يعذبون , هل عنده من الضمير ما يجعله يقف و يفكر و يضع نفسه مكان هذا و ذاك, يا سيدى الفاضل هؤلاء قوم منزوع من قلوبهم الرحمة, قوم اعتقدوا و توهموا انهم الهه,فنحن نسل الفراعنة, و انا ربكم الاعلي هو الشعار الذى يرفعه صغيرهم قبل كبيرهم, و تذكر ان العيب و اللوم ليس عليهم وحدهم, و لكن ايضا علي من اعطى لهم الفرصة ليقوموا بذلك, ألا تتذكر قول الله تعالي \"فاستخف قومه فأطاعوه\" و هو سبحانه يتحدث عن فرعون, فلقد استخفوا بعقولنا و لعبوا بمقدراتنا و مستقبلنا, استهانوا بشعب به من الاساتذة و الاطباء و المهندسين و العلماء و الباحثين و الشيوخ و غيرهم ما هو كافي لقيام نهضة في كل المجالات, و الله يا سيدى الفاضل اني اكاد ابكي بدل الدموع دما علي مصرنا الحبيبة و ما اّلت اليه, فأنا قارئة للتاريخ المصري و اعرف من و ما هي مصر,و اري الان ما وصلت اليه فأتحسر والله و اتالم, اعرف اني مقصرة فى حقها مثل كل المصريين, نعم كلنا مقصرين. اكتفينا بالكلام و الهتاف, و طبعا مارسنا هوايتنا المفضلة و هي جلد الذات و الاعتراف بالخطأ دون محاولة تغيره, فالساكت عن الحق شيطان اخرس, لك الله يا مصر, يا كنانة الله في ارضه, يا هبة النيل و مقبرة الغزاة و ام الدنيا و منبع العلم و النور, ادعو الله ان يرزقك بشعب يعرفك و يقدرك حق قدرك و يحميك و يحافظ عليك, فانت اغلي و اكبر من كل ما يحدث لك الان, و هو القادر علي كل شيئ.<br />و سلام الله عليكم و رحمته و بركاته"
archived = "2006-11-15"
capture_url = "https://web.archive.org/web/20061115180817/http://masr.20at.com:80/article.php?sid=996"

