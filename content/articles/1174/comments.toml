text = "والله صراحة لعبة غبية!! شو الفايدة منها يعني بس مجرد نشوة!! عندك القفز بالمظلات و هذي يلي يربطوك بحبل و تنقز من فوق عمارة او جسر.. هاي بتحركك جان تبى!! مب تشنق عمرك!!<br />نحن كنا نسويها لما كنا صغار بس مب بحبل بايادينا و نغمض عيونا كانت حلووة دوخة و كل شي اسود احساس حلو بس ما توصل لحبل!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133807/http://www.20at.com/article2.php?sid=599"

