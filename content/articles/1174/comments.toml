[[comments]]
order = 23
subject = "*المشنقة لعبة الموت *"
author = "محمد"
posted = "2006-04-15"
text = "حتى الموت أصبح لعبة. ظاهرة غريبة تطل علينا من خلال الإنترنت، أحدث هذه الظواهر كان ضحيتها في مصر بطلاً رياضياً شاباً (محمد أحمد – 21 سنة) من مدينة القاهرة، وطالب من محافظة كفر الشيخ الذي لقى مصرعه بعد مشاهدة برنامج (لعبة الموت) في إحدى القنوات الفضائية الأوروبية. لعبة الموت لها طقوسها الخاصة وقوانينها الخاصة حيث يستخدم فيها حبل أو حزام أو (إيشارب) يربطه حول عنقه ثم يسحب جسده شيئاً فشيئاً لأسفل تاركاً حمل جسده على الحبل وهو حول رقبته وواضعاً الكرسي أسفل قدمه وعندها يتوقف ضخ الدماء إلى المخ ليصاب اللاعب بالإغماء. وإذا لم تتم إفاقته قبل مرور دقيقتين يصل لمرحلة الموت! من قواعد هذه اللعبة وجود أكثر من شخص حتى يساعد الآخر. إذا أغمى عليه وعند الإفاقة فإن اللاعب يشعر بمتعة كبيرة بعد عودة الدم إلى المخ. ويشترط أن يمر اللاعب المحترف بمرحلة الغيبوبة أو فقدان الوعي الذي يصاحبه (زرقة في الوجه) مع عجز عن التنفس وفي هذه اللحظة يتم قطع الحبل قبل ثوان من حدوث الوفاة (وهذا يفسر وجود (الكتر) بجوار جثة طالب الأكاديمية محمد). ويتفق اللاعبون فيما بينهم على أن الخاسر هو من يكن حظه سيئاً فيتعرض للوفاة. ومن قوانين اللعبة ألا يتم إفشاء سرها إذا مات أحد اللاعبين. التحريات أشارت إلى أن هذه اللعبة منتشرة بصورة ما بين شباب النوادي وخاصة الراقية. وهي منتشرة بشكل يدعونا إلى أن ندق ناقوس الخطر بين الأهالي. لعبة الموت هي واحدة من قائمة طويلة للألعاب الشيطانية التي يفضلها المراهقون في المجتمعات الغربية للوصول لحالة من الإثارة والنشوة، والتي وصفها البعض بأنها تفوق في قوتها وتأثيرها العقاقير المخدرة خاصة أن خطورة اللعبة نفسها تضفي عليها طابعاً من الرعب أو الهلع الذي يتسبب في حدوث درجة من شلل التفكير لمن يمارسها وهو يجعلها في رأي مدمنيها أقوى تأثيراً من المخدرات. الأطباء وعلماء النفس يقولون إن النشوة التي يتحدث عنها المشنوقون الناجون تنتج عن ضغط الأحبال على العنق بشدة بما يمنع وصول الدم للدماغ وبالتالي يقل الأكسجين الموجه للمخ بما يدخل اللاعب في غيبوبة خطيرة فضلاً عن توتر الجسم كله واختلال توازنه بفعل عامل الترقب والتحفز النفسي للاعب خوفاً من نسبة خطأ تؤدي بحياته وتجعله من الخاسرين. وبشكل عام يقول الأطباء: إن ممارسة هذه اللعبة ومثلها من الألعاب الشيطانية يتطلب مزاجاً سوداوياً ميالاً للكآبة والمقامرة إلى أقصى حد فضلاً عن الفراغ النفسي والروحي الذي يميز شخصية محبي هذه الألعاب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133807/http://www.20at.com/article2.php?sid=599"

