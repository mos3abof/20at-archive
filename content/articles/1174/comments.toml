posted = "2006-05-22"
text = "الحكومة المصرية عايزة كدة لية لان الشباب بيتعلم ويتخرج ومافيش وظايف وبيقولو نستنى القوى العاملة .... وحيلك بقى لما القوى العاملة تقول رايهافين وفين لما الشباب يعجز او يموت<br />او يموت نفسة او يخترعو لعبة زى لعبة الموت"
archived = "2006-11-02"
