[[comments]]
order = 34
subject = "فلنلعب لعبة الحياة"
author = "ياسر الدفراوي"
posted = "2006-05-23"
text = "بسم الله الرحمن الرحيم والحمد لله أن أرسل فينا نبينا محمدا صلي الله عليه وسلم داعيا إلي كل خير ورحمة للعالمين<br />{وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِّلْعَالَمِينَ } (107) الأنبياء<br />وبعد ..<br />فرحمة ياشباب بأنفسكم وبأرواحكم وبنفوسكم وبآخرتكم<br />ألا يفكر الواحد منا إلا في اللحظة التي يعيشها فقط ؟<br />تفكرو في الدار الآخرة وحياة الخلد في جنات نعيم أو عذاب مقيم<br />ندعوا الله أن يجعلنا ممن رضي عنهم وأرضاهم وأن يرفقنا بصحبة نبيه الأمين في جنات تجري من تحتها الأنهار خالدين فيها أبدا ويرضي الله عنا يارب آمين<br />ملاحظة<br />أرفض أن ألعب هذه اللعبة نهائيا أو حتي التفكير فيها<br />وأدعو الله لشبابنا بالهداية والرشاد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133807/http://www.20at.com/article2.php?sid=599"

