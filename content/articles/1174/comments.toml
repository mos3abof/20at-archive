subject = "الشباب مظلوم والله"
author = "شرين"
posted = "2006-03-28"
text = "السلام عليكم ..جزاكم الله خير على فتح ذلك الموضوع الشائك الذي هو بمثابة الابتلاء أو مصيبة حلت على سماء الشباب لن أطيل عليكم رايي وبمنتهى الصراحة ان السبب الكامن وراء تلك الظاهرة هو ثلاث أمور الاول وهو غياب الدور الاسري والتفكك والأهم من ذلك هو انشغال الاباء بكيف يوفرون الحياة المادية لهم والنواحي الاخرى لم تعد لها مكان بالرغم من ان الشباب يحتاج لأشياء اكثر من المال ،اما السبب الثاني هو غياب الرقابة عن الوسائل الاعلامية وخصوصا اتي لا يكون لها هدف اعلامي هادف والتي تساعد على نشر مثل تلك الالعاب الجهنمية أما الامر الثالث وهو ضعف الدور الديني بسبب ما نتعرض له كل يوم من تعارض في الفتاوى ..هذه الاسباب تحتاج الى من ينظر اليها نظرة فاحصة ودقيقة ونأمل ان نغير شيء من واقعناالى واقع يرضاه الله .."
