subject = "جديد الموقع"
text = "منّك لله يا ياسمين.... فضحتينا !!:)<br />بس في نقطه مهمة... إن بعض العلامات دي بتحصل للشخص المنفعل أو المتردد أو صاحب مشكلة قلة الثقة بالنفس... إسألي واحد من دول سؤال محرج له بطريقة عنيفه شويه أو عدوانيه، و حتلاقيه يتلخبط و يعرق و يتوتر حتى لو كان بيرد على سؤالك بمنتهى الأمانة... أو تعالي لإنسان عنده مشكله في صياغة كلامه لإيصال المعنى سليم للي قدامه (و خاصة لو كان انسان عصبي بطبعه) و إسئليه سؤال ينرفز، برضه حتلاقي رد فعل مشابه حتى لو كان ناوي يرد بصدق...<br />مش كده يا رجاله؟"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813081542/http://www.20at.com:80/article.php?sid=447"

