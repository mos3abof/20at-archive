[[comments]]
order = 2
subject = "منتدى"
text = "الكذبُ ايها الإخوة والأخوات شئٌ يمقته الإسلام وكل الأديان السماوية والمعتقدات إنه خلقٌ منبوذ من جميع البشر على وجه البسيطة . وقد شدد الإسلام على الكذب وحثَّ على الصدق في كل الأحوال وما كان الرسول عليه الصلاة والسلام يغضب من أحدٍ كغضبه على من كذب حتى يحدث توبة . وحرم الإسلام الكذب حتى في المزاح وحرمه علينا حتى على الدواب.. ولخطورة الكذب حاول الإنسان طرقاً كثيرة لكشفه بدءً برصد حركات الكذَّاب الجسمانية وانتهاءً بإكتشاف أجهزة كشف الكذب المعقَّدة فأمَّا الحركات الجسمانية وهذا ما يعنينا نحن . يقول أهل الإختصاص مما يُلاحَظ على الكذاب أثناء كلامه كثرة لَمْسُه لأنفه كأنَّه يمتخط أو يزيل شيئا عن أرنبة اُنفه , مكرراً لذلك طوال فترة حديثه , وتعرُّق الأطراف (خروج العرق) من اليدين وباطن الرجلين ويُبالغ في حركات كفّيه التي تكون في الأغلب مبسوطة إلى الأعلى أثناء الحديث ,ويركز نظره المضطرب بعيداً عنك, وتجد الكذاب يجعل فقرات الموضوع المهمَّة مفتوحة بدون حسم ويُلاحظ على الكذاب كُثْرة الحِلْف والقَسَم . ويُسْهب في قوله ( أظنَُ واعتقد وممكن وما أدري وما شابهها من ألفاظ ) . وإذا كان الموضوع مهماً فسيبدو على الكذاب جفاف الفم وشحوب الشفتين . ولو كنت تعرف هذا الكذاب من قبل فستلاحظ عليه الخلط في الأماكن والتواريخ والمواضيع والأشخاص وذلك نسياناً منه ...!!!<br />والعرب تقول لو كنت كذوباً فكن ذكوراً"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813081542/http://www.20at.com:80/article.php?sid=447"

[[comments]]
order = 3
subject = "كشف الكذب"
text = "تم تجريب أحدث جهاز لكشف الكذب في العالم وأكثرهم تطورا على ثلاث أشخاص ??? مسؤول حكومي أمريكي وأخر ياباني وعراقي بعثي بدرجة عضو قيادة قطرية. سئل الامريكي : ماهي أخر مخترعات بلدكم؟ فأجاب: نحن نفكر في تطوير صواريخ عابرة للمجرات. فرنت صافرة جهاز كشف الكذب. وسئل الياباني نفس السؤال فقال نحن نفكر بصنع تلفون نقال يؤمن الاتصال مع سكان المريخ. فرنت صافرة الجهاز أيضا. جاء دور البعثي العراقي وسئل نفس السؤال فأجاب: نحن (نفكر) وقبل أن يتمم جملته رنت صافرة جهاز كشف الكذب بأعلى صوتها"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813081542/http://www.20at.com:80/article.php?sid=447"

[[comments]]
order = 4
subject = "مين علمك الكذب؟"
text = "من علمكِ الكذب أجيبي<br />من لقنكِ أصول الزيف<br />تتبدين ملاكاً طاهر<br />والجوف به كل سخيف<br />وبقشر الأخلاق تذودي<br />تغوين بها كل شريف<br />والشكل كما لو قد كنت<br />مثل سديد الرأي حصيف<br />تتخفين بثوب عفافٍ<br />ولسانٍ ذلق ولطيف<br />ياهذي عيشي بحياءٍ<br />واستجدي للجوع رغيف<br />واعتبري الشيطان عدوا<br />يستدرج من كان ضعيف<br />والتمسي الستار ليعفو<br />قبل نهاياتٍ وخريف"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813081542/http://www.20at.com:80/article.php?sid=447"

[[comments]]
order = 5
subject = "هاهاهاا"
text = "ذهب أحد الأشخاص الى احد المختبرات العلمية، و شاهد في احدى الغرف العديد من ساعات الحائط. فسأل احد الأشخاص:<br />- لم كل هذه الساعات على الحائط؟<br />-يجيبه الشخص: انها ساعات الكذب. عندما يكذب شخص ما تزيد ساعته بدقيقة. فمثلا ساعة امام المسجد بقيت على حالها و لم تزد، و هذا يعني انه لم يكذب طول حياته. و هذه ساعتي لم تزد الا دقيقتين، يعني انني كذبت مرتين في حياتي.<br />-الشخص بدأ يشاهد الساعات، ثم سأل: انني لا أرى ساعة الرئيس بوش؟<br />- أجابه الشخص: انها في مكتب المدير يستخدمها كمروحة.:"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813081542/http://www.20at.com:80/article.php?sid=447"

[[comments]]
order = 6
subject = "خبر حلو"
text = "توصلت مجموعة من العلماء في الولايات المتحدة أن أجهزة كشف الكذب المستخدمة في ضبط حالات التجسس تقوم بدور فاشل حيث أدت إلى التجاوز عن جواسيس حقيقيين بينما جرت على الآلاف من موظفي الحكومة الأمريكية والمرشحين للعمل بها شبهات لا أساس لها من الصحة.<br />فقد أظهرت الدراسة المستفيضة التي قامت بها المجموعة المتكونة من 17 عالما بناء على طلب هيئة الطاقة الأمريكية عدم كفاءة هذه الأجهزة في اكتشاف الجواسيس وإن كانت مفيدة إلى حد ما في التحقيقات الجنائية المعتادة وقد دفع هيئةالطاقة الأمريكية إلى طلب إجراء هذه الدراسة الجدل الذي دار حول هذه الأجهزة بعد اختبار عالم نووي على جهاز لكشف الكذب واتهامه زورا بتسريب أسرار أمريكية إلى الصين.<br />وقد كان لهذه الدراسة أصداء واسعة النطاق خاصة بالنسبة للجهات التي تستخدم أجهزة كشف الكذب لفحص المتقدمين للعمل بها وكذلك لفحص العاملين لديها دوريا ومن بين تلك الجهات مكتب التحقيقات الفيدرالي ووكالة المخابرات المركزية وهيئة الطاقة.<br />وقد صرح الناطقون باسم تلك الجهات أن نتائج الدراسة ستوضع موضع التقييم بينما طالب بعض أعضاء الكونجرس بوقف استخدم هذه الأجهزة."
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813081542/http://www.20at.com:80/article.php?sid=447"

