[[comments]]
order = 1
subject = ">>>>>"
text = "قامت سيدة إسرائيلية بحبس زوجها داخل حمام لمدة ثلاث سنوات – نعم 3 سنوات – متهمة إياه بأنه مجنون..وكانت الشرطة الإسرائيلية قد اكتشفت الأمر بعد أن قام الجيران بإبلاغ والدة الزوج التركي الأصل واسمه (أورحان بابوتشو) باشتباههم بوجود أمر غريب في البيت.. الزوجة قالت أنها كانت تحضر له الطعام يومياً وتضعه أمام باب الحمام و كانت تستمتع بأن تنام خارج الحمام لتستمع لتأوهات وألآم الزوج المسكين.. الزوجة بررت ما قامت به مدعية أن زوجها مجنون لأنه يستحم ثلاث مرات في اليوم(!!)<br />... مادامت تحب الحمام هكذا..قضي فيه بقية أيام حياتك (!!)<br />هذا الذي فعلته الزوجة الإسرائيلية بالزوج التركي المسكين شديد الرمزية.. وشارح للكثير من القسوة و العنف و الكراهية التي يقوم بها الإسرائيليين ضد الشعب الفلسطيني المجنون الذي يتوضأ خمس مرات يومياً."
archived = "2004-08-25"
capture_url = "https://web.archive.org/web/20040825095612/http://www.20at.com:80/article.php?sid=234"

