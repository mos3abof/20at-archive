subject = "بيرو"
text = "ومازال هناك حتي الآن من يسمي العدوان علي العراق حروب التحرير ... اعقد ان التسكية الصحيحة هي حروب التحرير فعلا لكن حروب التحرير للانسان العربي من كل اشكال الانسانية والحضارة ..حسبي الله ونعم الوكيل"
archived = "2004-08-25"
capture_url = "https://web.archive.org/web/20040825095612/http://www.20at.com:80/article.php?sid=234"

[[comments]]
order = 4
subject = "من غير سوليفان وحياتك"
text = "السؤال الأهم .. هو هل أدركنا حقا من هو المسؤول عن تعطيل _ ليس الديموقراطية فحسب _ لكن حياتنا كلها ، من المسؤول عن أوطان بلا كرامة ، وبشر يدورون في سواقي البحث عن لقمة العيش ، وشباب معطلون عن كل فرص الحياة من عمل وزواج ، ثقافة_ هي ثقافتنا _ تتهم بأنها ارهابا ، شعوب تحتل بدعاوى التحرير ، وتعذب بإنسانية المحرر<br />الصورة الشاملة لعالمنا ومعادلة الكبار الذين يحكموننا هي التعذيب المعرى من كل أوراق السوليفان"
archived = "2004-08-25"
capture_url = "https://web.archive.org/web/20040825095612/http://www.20at.com:80/article.php?sid=234"

[[comments]]
order = 5
subject = "التوب تعذيب"
text = "بلغة برامج المنوعات تعني الأفضل في التعذيب .. ما رأيكم في عمل مسابقة لاختيار افضل أنظمة التعذيب في العالم : الأمريكان في العراق / صدام حسين / ولا اسرائيل / ولا بقية السجون العمومية في العالم .. بامكانك إضافة اختيارات أخرى .. والجائزة الكبرى لصاحب أحسن إجابة ممكن تبقى ورق السوليفان الباقي من معدات التعذيب التي استهلكها المعذبون في الوطن العربي<br />... وحظ سعيد"
archived = "2004-08-25"
capture_url = "https://web.archive.org/web/20040825095612/http://www.20at.com:80/article.php?sid=234"

