subject = "هل الحجاب للزينة .. ؟ أم للستر"
author = "رنـــــــــــــــا ،، النجدية"
posted = "2006-08-25"
text = "أولا شكرا لكاتب الموضوع وشكرا لجميع المشاركين ، واقول أن الحجاب عام لجميع الملسمات وليس خاصا لأحد ، والهدف منه البعد عن مظاهر التبرج والفتنة التي هي مدعاة لكل شر ، وأذكر أخواتي المسلمات أنهن مأجورات على الإمتثال لأمر الله ولرسوله وموعودات بالأجر العظيم على الصبر وتحمل مدفعة هوى النفس إلى ما أمر الله به // من يطع الرسول فقد أطاع الله // وما كان لمؤمن ولا مؤمنة إذا قضى الله ورسوله أمرا أن يكون لهم الخيرة من أمرهم // فطاعة الله ورسوله تؤكدان معنى حقيقة الأيمان والإسلام وليس بالاسم فقط<br />جعلنا الله وإياكم موفقين لطاعته والفائزين بوعده ، وتحياتي للمشرفين على الموقع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123755/http://www.20at.com/article2.php?sid=1108"

