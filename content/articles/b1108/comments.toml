order = 3
subject = "ممكن الخلاف البنّاء؟؟؟"
author = "يوسف"
posted = "2006-08-07"
text = "سلام الله عليك..في الحقيقةلا نستطيع أن نطلق لفظة الحجاب إلاّ إذا أخذ المعنى الحقيقي للحجاب..والمعنى الحقيقي لن نستطيع الاتيان به من أهوائنا أو ذكائنا..لأنّ لفظة الحجاب أتى بها ديننا الحنيف فمنه بؤخذ المعنى وهذا منطقيّ فلو جعلنا الآراء هي الحاكمة فسنخرج بآراء مختلفة وحينها لا فضل لرأي على آخر من النّاحية المنطقيةلكن إذا رجعنا إلى الأساس الذي لا يختلف عنه من يقول أنا مسلم..والأساس المتين لن يكون إلاّ من الوحيين..فإذا اتّفقنا على هذا أظن أنّنا حسمنا الأمر...أمّا لو عاملنا هذا المسمّى بالحجاب من باب المقارنة حينها نقول هو أفضل من السفور والعري الجهري إن صحّ التعبير....ولكن من منظور العقل الصريح.هل إذا أردنا الحكم على شيئ أن نستبق إلى ماهو أدنى منه كي نحكم عنه بالخيرية!!!؟؟؟؟الجواب منكم فهل من مجيب..........يوسف الجزائري مقيم في النمسا...سلام واقبلوا تحياتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123755/http://www.20at.com/article2.php?sid=1108"

