order = 1
subject = "الحجاب الشرعي"
author = "ريم بنت السعوديةoooooooo"
posted = "2006-07-31"
text = "''''''''''' لتعلم الاخت المسلمة ان الحجاب عبادة تتعبد بها لله رب العالمين حيث ان الله امر بها في كتابه وامر بها امهات المؤمنين وامر الصحابة بناتهم وزوجاتهم والمسلمون من بعدهم الى يومنا هذا ولله الحمد والمنة ولم تكن الامة الاسلامية تعرف هذا التعري المخزي ا لذ ي وقع به بعض النساء اليوم بسبب التاثر باعداء الاسلام والتغريب الفكري لنا واتخاذ اساليب الغرب قدوة لنا الا من رحم الله ولتعلم اختي المسلمة ان الحجاب لا يكون الا صحيحا الا بشروط التي دلت عليها النصوص الشرعية فالحجاب عبادة والعبادة لاتصح الا بموافقة الشريعة الاسلامية وشروط الحجاب مايلي oooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooo اولا ;;;; ان يكون حجاب الفتاة المسلمة ساترا لجميع بدنها ومنه الوجه محط الزينة ومركز الجمال واليدان والرجلان والشعر والنحر وشرع الحجاب من اجل الحماية من الفتنة قال تعالى ;;;;;;;;;;; وقل للمؤمنات يغضضن من ابصارهن ويحفظن فروجهن ولا يبدين زينتهن ..... الشرط الثاني ... ان يكون الحجاب ثخينا لا يشف ماتحته اما الثوب الرقيق فهو من اسباب الفتنة قال تعالى /.... ولا تبرجن تبرج الجاهلية الاولى.... وقال صلى الله عليه وسلم صنفان من اهل النار لم ارهما وذ كر ونساء كاسيات عاريات مائلات مميلات رؤؤسهن كا اسنمة البخت المائلة لا يدخلن الجنة ولا يجدن ريحها ... وهذا لباس النساء اليوم ;;;; الشرط الثالث... ان يكون الحجاب فضفاض غير ضيق والسبب حتى لا يغري بها اهل الفساد ... الشرط الرابع ان لا يكون فيه زينة تلفت انظار الرجال لان المقصود من الحجاب ستر الفتاة والمحافظة عليها ,,, الشرط الخامس ,,,, ان لايكون مشابه لباس الكافرات فقد قال صلى الله عليه وسلم من تشبه بقوم فهو منهم ... الشرط السادس .,, ان لايكون فيه تصاليب او تصاوير .... وهذا ما جمعته فان نقص فا اكملو وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123755/http://www.20at.com/article2.php?sid=1108"

