order = 0
subject = "haram"
author = "nafar"
posted = "2006-06-18"
text = "لقد انتابني حقد علي ذلك النفر الذي ذكرت لانك لو اتجهت قليلا ناحيه الجنوب لوجدت سوق الرجاله وهوعباره عن مكان متفق عليه اجتماعيا فانت كذبون تتجه اليه وقت الحاجه الي نفر وانا كنفر اتجه اليه يوميا وغالبا اعود بلا عمل وان وجد فهناك ثلاث انواع من الذباين<br />1 ـ مقاول يقوم بأنتقاء الانفار كنخاس مراعياعوامل الصحه والقوه لانجاز اكبر قدر من العمل باقل عدد وده غالبا نصاب حتياالان لم يقبض المستخلص اه نسيت عندما يقع عليك الاختيار يقوم هذاالنخاس بسحبك في عربيه نقل مكشوفه لاتصلح الا لخرفان ومع ذلك تكون سعيدا<br />معلش هاكمل معاك بعدين علشان جالي ذبون سلام"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218163900/http://masr.20at.com:80/article.php?sid=540&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "العيشه المره"
author = "حسام"
posted = "2006-06-18"
text = "عيشة النفر اوعامل اليوميه هى اشدانواع المعاناه والذل فى الحياه والمراره اللى بتكون عند النفر من دول لاتساويها اى مراره فى الدنيا لانه لوقعد يومين من غير شغل او اتعور لاسمح الله اوجاتله اى مصيبه من مصايب الزمن هيحتار فى العيش الحاف هو واولاده ودولتنا زى ما انتو عارفين .<br />هااديكم بعض الامثله من العيشه الهباب دى اللى اعتقد ان ماحدش من اللى بيقرا هنا جربها لكنى ومع الفخر عشتها كتير واتكويت منها مع انى حاصل على ليسانس حقوق ســــــــ99ـــة......<br />اولا-- الاكل هو ارخص الاكل وده للتوفير بغض النظر عن النوعيه او القيمه الغذائيه<br />ثانيا-- النوم فى اعفش اوضه اوبير سلم اوخرابه اوعماره تحت الانشاء اذا كان حظه حلو وعنده واحد بلدياته واذا لم يوجد هذا اوذالك فالرصيف ثم الشرطه ثم التخشيبه ثم الترحيل الى بلده خالى الوفاض مذلول كانه من بوركينا فاسو ومش مصرى.<br />ثالثا-- اللبس اقدم الهدوم لانه نادرا اما يقدر يشترى هدوم جديده لان اولاده اولى بفلوس اللبس اللى بتعتبر عندنا تبذير .<br />انا جربت العيشه دى لانى كنت فى ظروف ازفت من الزفت نفسه لكن الحمد لله سافرت السعوديه وقعدت هناك 3سنين والوضع اتحسن واتجوزت والقلوس اللى معايا خلصت وبدور على شغل .<br />واخيرا وليس اخرا حسبنا الله ونعم الوكيل فى سرقنا وخلانا نوصل للذل ده اللهم اكشف الغمه"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218163900/http://masr.20at.com:80/article.php?sid=540&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

