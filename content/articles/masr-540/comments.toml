[[comments]]
order = 4
subject = "الأنفار قديماً وحديثاً"
author = "أبو عماد"
posted = "2006-06-19"
text = "زمان في بيئة المزارع وكان والدي موظف صغير كان النفر له أسماء ووظائف فالتملي وهو العامل الأجري اللي بيقوم باي حاجة أو الكلاف اللي براعي المواشي سواء كان حصان الدوكار للسيد المهندس أو المعاون أو بقر وحمير لعربة النزح (المجاري اليوم) أو بيقوم بالخدمة في بيوت الموظفين طبعاً الكبار فقط.<br />ثم هناك عامل اليومية وهو اللي بيجلبه المقاول الحرامي من القرى المجاورة مقابل يومية يقوم هو بجز النص لنفسه.<br />أما في المواسم مثل موسم الدودة أو موسم جمع القطن فهؤلاء يسمون تراحيل حيث في بداية الموسم تقوم عربات النقل التابعة للمزارع بنقلهم من بلاد معينة عن طريق مقاولين أنفار طبعاً هم وأسرهم نساء وأطفال طول فترة الموسم ليقيموا في الدوار مع البهايم في عيشه زفت مقابل 25 قرش عن اليوم والشهر عندهم 21 يوم طبعاً<br />ولما ياخد الفلوس في نهاية الموسم يلاقيهم ناقصين 50% القرف أنواع وأشكال"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218163900/http://masr.20at.com:80/article.php?sid=540&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "alhamd lellah"
author = "nafar"
posted = "2006-06-19"
text = "انجاز جديد لمبارك جعلنا 70،000000 نفر ان الموظف الغير مرتشي اوفي موقع لا يتأتي منه رشوه وهم ليس بالقليل جميعهم انفار بعد الظهر وهم الاحق بالقاء الضو ء عليهم او الاسر التي فقدت النفراالذي يعولها الايتام وهم كثير وقد استكثرالزمان عليهم النفر اما النفر الذي تتحدث عنه فهو بالرغم من معاناته فهو والحمدلله يعيش فوق التراب ويسعى ويكلل الله سعيه برزقه اما من يعيش تحت التراب من المرتشين واللصوص ومبارك واعوانه فقد وعدهم الله بخزي في الحياة الدنيا ويوم القيامه وعدوا بلظى وكان وعد ربي حقا سلطوا الضوء علي هؤلاء اللصوص لتعلموا انهم اتعس حالامن النفر مثال ولله المثل الاعلى وزيرالزراعه السابق في وضعه الحالي لاشهره لاولد لازوجه فقط خزي ومال حرام نفر معه زوجه وطفل خيرا 1000 مره من ذلك الخزي والمال الحرام واللهم لا شماته بدون مثاليه مزيفه نفر خيرا مبارك وما جمع من مال حرام ودعوات مظلومين وخزي سترونه قريبا ان شاء الله وبعد الموت لظى وهذا وعد ربي وكان وعد ربي حقا لقد تمنى عبدالملك بن مروان عندموته ان لوكان حطابا اي نفر ويا بخت من بات مظلوم ولابات ظالم احبكم في الله نفر"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218163900/http://masr.20at.com:80/article.php?sid=540&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

