text = "ايه الخبر غير المنطقي ده .. واساسا شرعا مش مظبوط<br />لو تفتكروا قصة سيدنا ابو بكر والعجوز اللي كان بيروح لبيتها دايما عشان بينضفه ليها وبيعملها اكل ويسقيها قصة معروفة ..وكان بيروح لواحده …يا جماعه القواعد من النساء ليهم قواعد خاصه بيهم<br />بصراحه الخبر شكله فكسااااااااان"
