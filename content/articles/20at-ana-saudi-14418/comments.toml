text = "حرااااااااااااا ااااام عليهم واحدة عندها خمسة وسبعين سنة<br />يعني هيا قادرة تقف على حيلها هتكون بتعمل ايه يعني<br />انا بسمع حاجات عن الهيئة و بجد ده مش من تعاليم الاسلام خالص<br />فيه حاجات كتيرة في شغل هيئة \" الأمر بالتخويف \" دي المفروض يعيدوا النظر فيها<br />حسبنا الله ونعم الوكيل<br />\"ولو كنت فظاً غليظ القلب لانفضّوا من حولك \" صدق الله العظيم"
