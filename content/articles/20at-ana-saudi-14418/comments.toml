posted = "2009-12-23"
text = "قصدهم ايه يجلدوهم عشان خلوه غير شرعيه ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />مالعااالم كله بيخلو بخلوه غير شرعيه الاستاذ بيدى البنت الدرس ماهى خلوه غير شرعيه<br />الدكتور بيكشف عالمريضه ماهى خلوه غير شرعيه<br />بتاع النور بيكشف عالعداد ماهى خلوه غير شرعيه<br />وفالأخر يقولوا الاسلام دين جاهل مااحنا اللى بنديهم الفرصه يتريقوا علينا وعلى احكامنا<br />لاحول ولاقوة الا بالله"
