[[comments]]
order = 14
subject = ""
author = "خزامى"
posted = "2009-12-29"
text = "أليس غريبا أن هذا الخبر لم يعلن في أي وسيلة سعودية رسمية مع أنه من المعتاد الإعلان<br />لهذا أشك في صحة الخبر ومن يسعون وراء ترويجه وأهدافهم خاصة أنه غير موثق<br />وبفرض أنه صحيح<br />فقد قرأت في مكان آخر أن المبلغ عنهم وال الشاب الذي يقولون أنه ابنها<br />وأنه يصرح أن هذه المرأة لها سمعة سيئة في المنطقة<br />لا تنزلقوا وراء السخرية من الهيأة فهناك من يسعون لتدمير أي مؤسسة دينية لدينا"
archived = "2009-12-30"
capture_url = "https://web.archive.org/web/20091230122519/http://20at.com/20at/ana-saudi/14418--75-.html"
