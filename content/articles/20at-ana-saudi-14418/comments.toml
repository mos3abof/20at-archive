[[comments]]
order = 11
subject = ""
author = "جوجوبا"
posted = "2009-12-27"
text = "اقتباس طاهر مصر:<br />قمه التخلف والجهل انها السعوديه بل العرب اجمعين يمتازون بالتخلف الموروث منذ عصر الجاهليه الذى ما زال موجود حتى الان وليس جديد هذا الامر وجماعه الامبر بالمعروف اوسخ ناس انهم من القتلى والمجرمين انصار الاسلام هم رمز واضح للجهل وعدم المعرفه انى بكل صراحه اكره السعوديه والعرب والاسلام والتخلف وشكرا لحسن استماعكم<br />ضحكتنى والله<br />طب ما انت عربى أهو<br />يعنى م الاخر انسان متخلف على حد قولك<br />وايه يعني انصار الاسلام هما كانوا عملولك حاجة<br />ناس بتطبق شريعة ربنا يزعلك انت والمتخلفين اللى زايك فى ايه"
archived = "2009-12-30"
capture_url = "https://web.archive.org/web/20091230122519/http://20at.com/20at/ana-saudi/14418--75-.html"

