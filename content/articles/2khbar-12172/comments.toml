author = "ممدوح زكى زخارى جرجس"
posted = "2009-05-25"
text = "ااقتراح جميل و حل لطيف ؟<br />بس ياريت كمان توضع صورة الفتاة التى تغشو يكتب عنوانها و رقم الموبايل بتاعها كمان<br />و ايضا ياريت تتحط صور جميع افراد عائلتها و عنواينهم ايضا مع ارقام تليفوناتهم و عنواينهم و اماكن عملهم<br />و بكدة اعتقد ان الغش سوف يزداد<br />ها ها ها هاو<br />الحل الاوحد هو الرفت من الكلية و اعطاء مكان الغشاش للطالب المجتهد الذى يريد العلم و الدراسة الحقة<br />و بلاش تخاريف كفاية تفاهة و حياة ابوكم"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527183923/http://www.20at.com:80/2khbar/12172-2009-05-25-07-52-18.html"

