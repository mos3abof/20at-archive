text = "20% من الشباب المصري يقبل بالزواج من فتاة غير عذراء<br />بقلم أريبيان بزنسThis email address is being protected from spam bots, you need javascript enabled to view it في يوم الاثنين, 27 أكتوبر 2008<br />أكد بحث قام بإجرائه المركز القومي للبحوث الاجتماعية والجنائية في مصر أن 20% من الشباب يوافق على الزواج من فتاة يعرف أنها غير عذراء.<br />وكان البحث يتمحور حول العلاقات بين الجنسين قبل الزواج.. وهل يوافق الشاب المصري على الزواج من فتاة يعرف أنها غير عذراء.<br />و أجاب على البحث 20% من عينة الشباب التي شملت 1000 شاب من ظروف وبيئات ثقافية واجتماعية مختلفة والذين خضعوا للبحث على هذا السؤال بالموافقة، فيما أعرب بعض المبحوثين عن رغبتهم في قيام علاقات بين الشباب والفتيات قبل الزواج على الطريقة الغربية، غير مستبعدين أن تنتهي تلك العلاقات بالزواج إذا تأكد الطرفان من التوافق التام بينهما"
