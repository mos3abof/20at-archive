[[comments]]
order = 1
subject = "معروف من نوع الحرام"
author = "ابو اليمان"
posted = "2006-03-20"
text = "الاخ طارق لا بد ان احييك.. واضيف ان اصحاب المحلات في مكةالمكرمة والمدينة المنورة يعرفون الاردني حين يطلب نوعية معينةتفاحتين .<br />اذكر انني دخلت محلا لشراء حرام في موسم حج فقلت اريد النوعية الفلانية فقال لي البائع انت اردني عليك ان تأخذ النوعية الفلانية ورفض ان يبيعني ما اريد بحجة ان الاردنيين لهم نوعية معينة.<br />لا بد من ملاحظة اخرى ان الحجاج ومنهم الاردنيين يشترون كما قلت بمبالغ طائلة لكنهم يبخلوا على سائق البكم بريالات معدودة ويفاصلونه على ريال او اثنين!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124245/http://www.20at.com/article2.php?sid=294"
