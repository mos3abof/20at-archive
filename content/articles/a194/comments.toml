[[comments]]
order = 0
subject = "اظن ان هناك خطأ"
text = "لست واثقاً فعلا و لكني اظن ان هذه القصة ليحيي حقي و ليست ليوسف ادريس<br />و لكني لست واثقا برجاء التاكد"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044308/http://www.20at.com:80/article.php?sid=194"

[[comments]]
order = 1
subject = "لا يا حاج"
text = "طبعا القصة ليوسف إدريس ودي حاجة معروفة جدا<br />طلعت أوت<br />جرب المرة الجاية<br />بيت منلحم عنوان مجموعة قصصية كاملة ليوسف إدريس<br />سلامين وحتة"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044308/http://www.20at.com:80/article.php?sid=194"

[[comments]]
order = 2
subject = "بالراحة شوية"
text = "طيب يعني ما ترد بشكل أحسن من كده حتى لو هي ليوسف إدريس! هو عملك ايه؟ الرجل بيقول \"أظن\" \"يمكن\" \"من فضلكم أكدولي\""
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044308/http://www.20at.com:80/article.php?sid=194"

[[comments]]
order = 3
subject = "طيب"
text = "طيب طيب<br />اطلع انت منهاوهي تعمر<br />انت اشتغلت باجور جاز قبل كدة؟"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044308/http://www.20at.com:80/article.php?sid=194"

[[comments]]
order = 4
subject = "بيرو"
text = "الأخوة اللي فوق عمالين يتخانقوا ومفيش حد منهم جاب سيرة القصة أصلا يا ريت نحاول نرتقي بمستوي الحوار بينا ده موقع محترم وهيفضل محترم ولا أيه ؟؟؟<br />أما بالنسبة للقصة فهي كعادة أعمال يوسف أدريس رائعة جدا . والسؤال لعشرينات أنتوا فعلا ناويين تستمروا في تقديم اللون بتاع القصص ده بعد كدة بأستمرار ؟؟"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044308/http://www.20at.com:80/article.php?sid=194"

[[comments]]
order = 5
subject = "معارض"
text = "أعترض على وضع هذه القصة الغير محترمة فى هذا الموقع المحترم .<br />كتابات يوسف أدريس ليس مكانها هنا."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044308/http://www.20at.com:80/article.php?sid=194"
