text = "فعلا احنا محتاجين واحد زي محمد آكي وشعبان عبدالرحيم وغيرهم وغيرهم ياعم آكي احنا عايشبن بنكاكي .<br />قال ايه (لكننا نستسهل ونعمل حاجات كحيانة.. بشلن) هو فينه الشلن لو حتى سلفه لاخر الشهر ولا احنا قدرين نحصله."
archived = "2009-08-29"
