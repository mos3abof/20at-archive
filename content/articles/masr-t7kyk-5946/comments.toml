author = "مش لازم"
posted = "2007-05-20"
text = "موضوعات جمال مبارك لازم تجرنا الى الحديث عن توريث الحكم<br />وانا بطرح هذا التساؤل<br />متى كان الحكم في مصر غير وراثي<br />ارجو من حضرات القراء يستعرضوا تاريخ حكام مصر منذ 7000 سنه ويقولولنا متى كان الحكم في مصر غير وراثي<br />وبعدين لو نظرنا حولنا نجد<br />الملك حسين مات وابنه مسك مكانه<br />الملك الحسن ملك المغرب مات وابنه مسك مكانه<br />الشيخ زايد مات (بتاع الامارات) وابنه مسك مكانه<br />حافظ الاسد مات وابنه مسك مكانه<br />ملك البحرين مات وابنه مسك مكانه<br />وهكذا دواليك<br />احنا اتعودنا في مصر ان كل حاكم بيرتب لخليفته من بعده ايا كان هذا الخليفة<br />وهذا من حق حسني مبارك تماما كالحكام الذين قبله<br />من حقه اختيار خليفته ايا كان هذا الخليفة"
archived = "2009-08-29"
capture_url = "https://web.archive.org/web/20090829074951/http://www.20at.com:80/masr/t7kyk/5946.html"

