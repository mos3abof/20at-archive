author = "نيفين نيفى نوفا"
posted = "2007-05-20"
text = "اولا للاخ او الاخت مش لازم انا بس عايزه اوضح ان بعد الثوره (المباركه)اعلنن ا الجمهوريه و الغينا الملكيه<br />لانك بتقول او بتقولى نستعرض تاريخ مصر<br />اما بالنسبه للى حصل ف الاردن و البحرين و كده احب اوضح برده ان الدول دى نظامها ملكى<br />و الله مش بحجر على راى او بنتقد تعليق بس اصل التعليق لفت نظرى ان فيه حاجات مش راكبه على بعضها<br />اما بالنسبه للموضوع اكمى يا جماعه قال كلمه حكمه سيضمه كتاب التاريخ بين جنباته و يكتبها بحروف مضيئه قال و انا مالى ما هى مجروبه على الكل<br />الله عليه..هو ده الكلام و انا عن نفسى عندى دفتر بسجل فيه اى كلمه بحس ان فيها فكر او منطق او عبارهماثوره و بكتب اسم اللى قالها حتى لو كان بياع ف الشارع و انهارده هسجل كلمه اكى دى<br />فعلا احنا انهارده ف بلد رايحه ف داهيه قريب و على راى عمرو اديب مبقيتش تقدر تعرف ف البلد دى مين مع مين ضد مين و فين و ليه<br />و قال نكته كان قالهاله العبقرى احمد رجب<br />3 مساجين ف الزنزانه بيتكلمو و كل واحد بيقول سبب حبسه<br />الاول قال انا كنت من مؤيدى محمد نجيب<br />و التانى قال و انا كنت ضد محمد نجيب و التالت قال و انا محمد نجيب<br />مش بقولكو كلمه اكى كلمه حكمه<br />اسفه لشيماء البردينى على خروجى عن الموضوع بس هى كلمه اكى"
archived = "2009-08-29"
capture_url = "https://web.archive.org/web/20090829074951/http://www.20at.com:80/masr/t7kyk/5946.html"

