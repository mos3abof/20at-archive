subject = "عيزنهم مثل الشيخ وجدى"
text = "السلام عليكم....<br />أول شىء أريد أن أقوله، شكرا لطرح هذا الموضوع..<br />ُثانيا: بالنسبة للشيوخ الآن هم معزولون تماما عن العالم الخارجى، فلا يعرفوا التطورات التى حدثت فى المجتمع و ما يعترض الشباب للالتزام مثل روبى و شبيهتها.<br />طبعا هما معظورين لسببين. الأول: هو صعوبة متابعة هذه الأشياء خصوصا الملتزمين. ثانيا: إن المستوى الانحلال ده مخطرش على بالهم أصلا..<br />ولكن فى نفس الوقت بعض الشيوخ متابع التطورات الى حد كبير.. طبعا ده قبل ميطفش لأمريكا.. فمثلا لا لأنسى الشريط الذى سجله بعد مبرنامج تليفزيونى غلى القتاة الأولى هاجم الشيوخ...<br />تمكنكم الاستماع له على هذا الرابط:<br />http://islamway.com/bindex.php?section=lessons&lesson_id=826&scholar_id=74"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044507/http://www.20at.com:80/article.php?sid=195"
