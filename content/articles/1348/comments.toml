[[comments]]
order = 1
subject = "كفايه"
author = "سلفى"
posted = "2005-12-18"
text = "انا مختلف معكوفى تسميه الاخوان بالارهبين لان الذين يقوم بعمل التخريبات والتفيجريات فى مصر ليس لهم صله بالاخوان وله يعرفو اى حاجه عن الاسلام الانهم يقمو بقتل النفس وهذا يختلف عن قيم الاسلام بل انهم يسترو وراء مسمى الاخوان ولاكن الاخوان هم الذين عاوزين يغيرو الفساد الموجود وربنا معهم بس هم بجد مش وخدين حقهم وحركه حماس حركه قويه ويريت يكون لهم نصيب فى الانتخابات بس فين اميريكا مبتسبش حد فى حالو وربنا ينصرهم على عدوهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142704/http://www.20at.com/article2.php?sid=106"

[[comments]]
order = 2
subject = "\"ان االله لا يخلف وعده\""
author = "مصرى"
posted = "2006-07-11"
text = "منصورين بايدينا وايدى الاسلاملا تخافوا الجبناء وسيروا فى خطاكم مصرى متحمس للجهاد افتح باب الجهاد يا مبارك وكفايه جبن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142704/http://www.20at.com/article2.php?sid=106"
