[[comments]]
order = 0
subject = "باب النجار مخلع"
author = "الطفشان"
posted = "2007-01-02"
text = "سيدى الفاضل أحنااحسن ناس فى الدنياوبنعرف نعمل كل حاجة لكن دولتنا العزيزة والقائمين عليها يعملون بسياسة الشيخ البعيد سره باتع انا مقيم باالسعوديه توجد هنااشارات مروررقمية تعمل عن طريق الكمبيوتر ولا يوجد عسكرى مرور يقف فى شارع تحت اشعة الشمس الطاحنة ولا يوجد امين شرطة يمارس البلطجة على خلق الله وياخد فردة وأتاوة من سائقى الميكروباص والتكسى والله انا حزين على نفسى وعلى ولاد بلدى"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042256/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 1
subject = "قاعدة بدون بيانات"
author = "مصري"
posted = "2007-01-10"
text = "قاعدة وعارفينها<br />لكن البيانات دي هتيجي منين ان شاء الله<br />مصر مافيهاش بيانات معروفة اصلا<br />اثولكم حاجة لذيذة<br />فاكرين قضية سلسبيل بتاعت الإخوان ( خيرت الشاطر بأه الناس دي )<br />كان ايه مشكلة مركز سلسبيل ده ؟؟<br />كان المشكلة انه لما الحكومة صادرت الملفات من المركز .. لقت فيها بيانات عن حال الصحة و التعليم وما الى ذالك في مصر .. تفوق اللي عند وزارة الصحة و التعليم نفسها !!<br />الخلاصة ... لما نبقى نعرف بيانات دقيقة عن المصابين بفيرس سي ... ولا عن نسبة الأمية الحقيقية ... ولا حتى نسبة الأقباط في مصر<br />ساعتها نبقى نعمل قاعدة بيانات<br />ولا ايه؟"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042256/http://masr.20at.com:80/article.php?sid=1265"

[[comments]]
order = 2
subject = "مأساااه"
author = "احمد"
posted = "2007-01-11"
text = "الحكايه ببساطه ان الحكومات - اللى المبرمجين المصريين سافروا علشان يعملولها قاعدة بيانات - حكومات بتعمل لصالح مواطنيها اما عندنا فالحكومه تعمل لبقاء الفرعون و ابن الفرعون - فمن مصلحة الفرعون ان الشعب ميعرفش اى بيانات"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042256/http://masr.20at.com:80/article.php?sid=1265"
