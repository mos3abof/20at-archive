text = "كلمة حق عمر الشريف ممثل موهب ولاكن ماطر طير فى العلا الا ماهوا اقرب حاجة ان واحد يطلق امراة زى فاتن حمامة التى عرفت بسيدة الشاشة العربية"
archived = "2006-11-02"
