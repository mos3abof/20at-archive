subject = "من يحب حات فهمي"
author = "مينا العراقية"
posted = "2006-07-28"
text = "انابموووووووت في المغني المصري حاتم فهمي واسال سوال مين بيكم يححب حاتم فهمي هو عندة ذوق<br />لال انا بصراحة احب حاتم فهمي وبس وما احب حد غيره وشكا من فضلكم عاوز حد يرسل الرد انا اسمي مينا عمري 13 سنة من العراق الحبيب وانا فكل مكان بسوي دعاية لحاتم فهمي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132028/http://www.20at.com/article2.php?sid=84"

