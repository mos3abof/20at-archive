[[comments]]
order = 1
subject = "اللي يعرف يقو لي"
author = "سمعت ان عمر الشريف شتم يوسف شاهين .. ويوسف شتم عمر برضه."
posted = "2005-12-27"
text = "حد يعرف لية؟؟<br />اعتقد انها نار الغيرة مش اكتر وهما مش برضة كانوا اصحاب زمان ولا اية .<br />ما هي الشهرة تعمل أكتر من كدة وربنا يهدي الجميع .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132028/http://www.20at.com/article2.php?sid=84"

[[comments]]
order = 2
subject = "الى صاحب تعليق اللى يعرف يقوللى و عمر الشريف هو الاستاذ"
author = "نيفين"
posted = "2005-12-27"
text = "احببت و احب و سوف احب عمر الشريف<br />الى صاحب تعليق اللى يعرف يقوللى اعتقد ان الكراهيه اللى بين عمر و يوسف ان يوسف كان بيحب فاتن حمامه و عمر خطفها منه طبعا<br />انا سمعت الحكايه دى و الله اعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132028/http://www.20at.com/article2.php?sid=84"

[[comments]]
order = 3
subject = "نعمين يا عمر"
author = "صايع وقديم"
posted = "2005-12-28"
text = "معلشي الأسلام مش مجرد اسم في بطاقة ومش عشان اشهر اسلامه يبقي مسلم والله اعلم بالنوايا و بعدين يوسف لامؤاخذة شاهين دة اصلا مش ..... طب اقولها ازاي و في بنات قاعدين ... عموما الراجل مش بس بكلمتة يا جووووو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132028/http://www.20at.com/article2.php?sid=84"

[[comments]]
order = 4
subject = "اللى ميعرف عُمر ينخرص حبه"
author = "يحيى مراد"
posted = "2005-12-31"
text = "أحب أن قولك ياعمر انت إنسان حر ولكل إنسان له اخطاؤه وله رب يحاسبه اذا عمل خطأ.<br />أنا بحب عمر الشريف جدا وبحب شاهين جدا ايضا واعتبره ابو الإخراج فى مصر .. لكن مش عشان سمعنا عن عمر حبة كلام يفور الدم فنقوم عليه حملة كراهيه وشتائم من النوع التقيل .زبالعربى ده شغل نسوان رسمى وانى منحبش كده... وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132028/http://www.20at.com/article2.php?sid=84"

