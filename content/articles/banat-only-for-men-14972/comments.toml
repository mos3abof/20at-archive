text = "ردا على كلام صاحب التوبيك<br />الصفة الأولى: التناكة >>> طبيعي جدا اللي عملته البنت وأي واحدة مكانها كانت عملت كدة .. لأن ببساطة هي عملت كدة لانك أول ماسألتها أول حاجة جت في دماغها انك ليه لو تايه ماروحتش تسأل واحد راجل؟!! و بعدين مادام انت فاهم قوي كدة شخصية و خبايا وطريقة تفكير الستات رايح تسأل واحدة ست ليه؟؟!!!!!!!<br />الصفة التانية:معجبة بنفسها>>> طبيعي في ظل اللي احنا بنشوفه بيبقى وضع طبيعي جدا ان البنت تغلب سوء النية . هي ماتعرفش حضرتك عشان تقول عليك انك حسن النية .. سوء النية من حسن الفطن يا أستاذ<br />الصفة الثالثة:الشياكة >>>اذا كان رأيك في ان البنت اللي تنزل واخدة بالها من لبسها وبلبس شيك انها بتعمل كدة قصد انها تلفت الأنظار يبقى يوم ماتتجوز ابقى اتجوز \"قرد\" عشان تضمن عالأقل انها بنت مؤدبة ومحدش قال عليها اللي انت بتقوله على بنات الناس !!<br />الصفة الرابعة:احتقار الرجال>>>صدقني يعني انتو كل اللي مضايقكوا كرجالة هو نجاح الستات وقدرتهم على اثبات نفسهم في أي مجال .. ودة بيخوفكوا لأنكوا دايما عايزين تفضلوا قهرينها وحبسينها عشان ترضوا غروركوا كرجالة !!"
