text = "الموضوع جميل جدا بس اللي انا لاحظته انك شايل اوي من البنات يعني انت عايز البنت تبقى عامله ازاي طب اسالك سؤال<br />لو انت لقيت بنت لذيذه وبتتكلم مع دا و دا وبترد على دا انت نفسك ها تقول عليها ايه<br />انت عارف انا بشتغل في مكان فيه شباب وكمان ناس كبيره قد بابا واكبر انا كنت بتعامل بحرص مع الشباب علشان كلام الناس وبتعامل مع الرجاله الكبيره زي بابا دا انا حتى كنت بقولهم يا (عمو فلان) لقيت عمو فلان دا بيمد يده عايز يسلم وكمان طريقة كلامه مش مريحه فقولت انا ها اتعامل مع كل الرجاله كبار شباب زي بعض<br />لكن بالنسبه للبنت اللي سالتها دي انتو الاتنين غلطانين<br />انت غلط لما سالت بنت ولو بررنالك وقولنا اي حد جه معاك ومكزتش مين وسالت علشان تعرف بس . فا انا بقولك التمسلها العزر هي ما تعرفش نيتك<br />وهي غلطانه انها طولت لسانها وجرحت فيك مالهاش لزمه كل الكلام دا ممكن لو كانت تعرف تقول في المكان الفلاني وتمشي<br />ولو هي مش عايزه ترد عليك تمشي ومن غير ما تجرح في حد"
archived = "2010-02-21"
capture_url = "https://web.archive.org/web/20100221055321/http://www.20at.com:80/banat/only-for-men/14972-2010-01-19-18-51-19.html"

[[comments]]
order = 50
subject = ""
author = "ملوكه"
posted = "2010-02-19"
text = "اول حاجه الموضوع جامد جدا<br />بس بجد انتو بترجمو تصرفات البنات غلط جدا<br />لانها بتتصرف كده علي اساس نظره المجتمع المصري ليها<br />اللي هي اصلا نظره متناقضه<br />يعني لو روحت تتعرف علي بنت مصريه في الجامعه وعادي يعني واتعرفت عليك يبقي دي بنت سهله ومش تمام ومش عارف ايه<br />علشان كده انت مطالب باعداد الخطط<br />وبعدين البنت اللي افتكرتك بتعاكسها دي<br />انت مش فكرت ليه كام حد عكسها بالطريقه دي<br />فده مش سوء ظن بالعكس<br />ده زي مبيقولو اللي اتلسع من الشربه بينفخ في الذبادي<br />فغيرو من نفسكم تتغير ردات فعلنا"
archived = "2010-02-21"
capture_url = "https://web.archive.org/web/20100221055321/http://www.20at.com:80/banat/only-for-men/14972-2010-01-19-18-51-19.html"

