[[comments]]
order = 21
subject = ""
author = "sandrilla"
posted = "2010-01-21"
text = "اولا انا اول مره اكتب تعليق هنا فى بنات عشرين بس لما قريت الموضوع وبعد كده قريت التعليقات مقدرتش مردتش<br />اولا يابنانيت يا قمامير انتو ليه مزعلين نفسكم اوى كده اولا ده رأى فردى مش رأى جماعى يعنى راى الشخص اللى كتبه وده معناه انه عن تجربه شخصيه فرديه<br />وده مش معناه اننا منسمعهوش من حق كل واحد يعبر عن رأيه صح ولا ؟؟<br />ثانيا ومتزعلوش منى طبيعى ان الشباب يخدوا عننا فكره غلط لأن فى كتير مننا أساؤا لينا لأنهم بقوا الواجهه الكبرى والبنات التانيه بقوا فى الخلفيه فطبيعى ان ديه تبقى فكره الشباب عننا<br />ثالثا وده الأهم احب اوجه كلامى للى كتب الموضوع الدنيا فيها حاجات مهمه كتيره جدا واهم جدا من ازاى البنت تعامل الولد وازاى الولد يعامل البنت انا طبعا مش مع اى حد تفه كلامك بس الحياه فيها حاجات اهم بكتير من النصايح العظيمه اللى انت وجهتها للشباب<br />واخيرا هقولك ان البنت اللى انت بتتكلمها عنها ديه هى اولا واخيرا اختك وزوجتك وامك بمعنى اخر هى النص التانى فى المجتمع ده وهى اللى رسولك الحبيب وصاك عليها فى أخر خطبه ليه قبل وفاته<br />وده ميمنعش انى اشكرك على موضوعك"
archived = "2010-01-22"
capture_url = "https://web.archive.org/web/20100122070140/http://www.20at.com:80/banat/only-for-men/14972-2010-01-19-18-51-19.html"

