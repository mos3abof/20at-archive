posted = "2010-01-20"
text = "اولا التوبيك دمه لذيذ بغض النظر عن الكلام اللى جواه<br />ثانيه مش قولنا بلاش تعميم<br />يعنى لو الحلول اللى حضرتك كاتبها للحالات الخاصه دى يبقى اوك ماشى لكن لو تعميم يبقى خلى بالك من نفسك ومش تمشى فى شارع بالليل لوحدك بقى ههههههههههههههه هههه<br />بصراحه بالنسبه ليا لو شاب كلمنى فى الكليه بصراحه بيبقى سوء الظن هو الاول نتيجه لحاجات كتير اولها انى لازم بردو اخاف على نفسى<br />فى جمله سمعتها وعجبتنى فى فيلم italian job<br />ثق فى كل الناس لكن لا تثق بالشر داخلهم<br />اعتقد لو طبقناها هيبقى شئ كويس<br />متهيئلى فى الاخر الاسلم نستنى من حضرتك مقال تانى عن الشباب<br />شكرا"
