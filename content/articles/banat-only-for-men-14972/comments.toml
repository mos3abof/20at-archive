text = "شكراً للأخ اللى كتب الكلام دة رغم أن 90% منه غلط اكيد طبعاً فى بنات تنكة و عايشة الدور و كل الكلام دة بس مش دة الطبيى ليه كان التركيز على الجوانب السيئة فى التافهات من البنات ليه ما اتكلمتش على المهذبات و المحترمات وللا عمرك ما صادفت و قابلت واحدة منهم؟ ليه صورت ان الشباب دول ملايكة يتضحك عليهم ب حركتين؟ مع انهم هم اللى خلَوا بعض البنات يفقدن الثقة فى جميع الذكور اللى معظمهم مدمنين او بتوع كلامز احنا لو جينا نتكلم فى صفات الرجل لم يكفينا اسبوع على الاقل… وشكراً"
