text = "yايه يا عم كل ده؟؟؟؟ مين زعلك قوي كده؟؟؟ بص انا معاك في حاجات وحاجات, بس صدقني مش كل البنات كده وانا بقول كده علشان انا والحمدلله تعرفت علي عدد لا بأس به من البنات وعرفت اوصل لدماغ كل واحدة وقابلني النوع اللي بتحكي عنه ده<br />وعايزة اقولك انا ليه بتكلم كده عن البنات وممكن تفهم لو قولتلك ان معظم زمايلي في الكلية كانوا ومازالوا اصدقاء شباب لاني دايما بحس ان في نوعية من البنات في الصداقة بتغير من بعض وبينافقوا بعض وانتقادتهم لبعض سخيفة<br />لكن الحق يقال انا لاقيت صداقة الصبيان فعلا صداقة حقيقية<br />حتي ان ليا صديق ظابط بحري حاليا لكن صداقتنا لم تنقطع بيقول انه ناقص يحط ايده علي كتفي ويوقوللي منور يا اخ<br />لكن في كثير من الاحيان بكون بنوتة رقيقة وفي الوقت ده طبعا اصدقائي بيكونوا بيشوفوني لاول مرة بنت<br />انا ساعات برفض كوني بنت لان الاتهامات اللي حضرتك قولتها دي بتمشي ع الكل لكن فعلا في بنات بترفض تصرفات البنات اللي بتحكي عنهم, انا حتي بحس انهم شووهوا مفهوم الانوثة بالمعني اللي كانت الناس تعرفه. بس صدقني مش كلهم كده لكن انت معاك حق في معظم اللي قولته"
