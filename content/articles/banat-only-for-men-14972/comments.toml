text = "ايواا طبعااا ليها الحق انها ترد عليك لما تسالها سؤال ساذج زى فين عياه دكتور هشامى طب اسال على العنونان الشارع<br />اولا طريقه السؤال مش حلوه ثانيا ليها حق تعمل كده واكتر من كده من المعاكسات اللى بتشوفهاااا<br />واصلا ميصحش ولد يسال بنت فى الشارع من قله الرجاله يعنى استنى لما راجل يعدى واساله ولا مصر الرجاله ماتواا فيهااا"
