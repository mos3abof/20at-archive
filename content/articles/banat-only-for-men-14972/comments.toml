subject = ""
author = "بنت مصرية"
posted = "2010-01-21"
text = "واضح انك فكرت و ركزت و حللت كتييييير اوى شخصية و سمات هذا النوع من البنات المصريات و اللى مش هانكر انه موجود فعلا بكثرة بسطحيتهم و تفاهتهم (عايشين الدور زى ما بتقول) و غرورهم و انانيتهم المطلقة اى حد ينكر ان النوع ده موجود يبقى منهم طبعا<br />بس انا رأيى كان المفروض تسال نفسك سؤال مهم اهم حتى من انك تنزل المقالة ده انا ليه انجذبت لهذا النوع من البنات؟ و اطلقت على مواصفاتهم المواصفات القياسية فى مصر للبنات؟ بمعنى اخر ليه مركز اوى كدة مع النوع ده و محللتش الانواع التانية من البنات ؟ هل لان انا فيا شبه منهم و لا انا النقيض بتاعهم ؟ و ما اظنش انها الاخرانية لانك حطيت عنوان مقالتك المواصفات القياسية للبنات فى مصر كما لو كان هما دول اهم و احسن نوع للبنات فى مصر بس كل مشكلتهم شوية العيوب دى."
