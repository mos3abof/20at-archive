text = "ok على كل الكلام اللى اتكتب بس فى حاجة انتا كدا مش عجباك تصرفات البنات المصرية … امال هتقول ايه على البنات الاجانب … ياريت تحاول تقول تعليقك عليهم برضو .. فى كتير من صفات المصريات كتير جميلة جدا …<br />يعنى من الاخر حضرتك يا دكتور .. عممت على كل البنات … وشايف ان الولاد هما الصح … انا عن نفسى مش بآمن لاى ولد ف الشارع .. علشان لو البنت محترمه بيعكسوها برضو طب ليه البنت تعمل ايه بقى تلبس اسود ف اسود ورأسها حتى رجلها …<br />فا اكيد الكلام دا كلو مشوه لصورة البنات المصريات … بس دا ميمنعش ان فى بعض البنات كدا<br />بس انا زعلانة جدا جدا من التعميم على كل البنات ..<br />ولك تقدير على رأيك يا دكتور شريف .. لكن ارجو النظر فيه مره اخرى وقرائة التعليقات المقاله على الموضوع<br />وتشكر"
