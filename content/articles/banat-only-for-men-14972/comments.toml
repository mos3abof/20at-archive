[[comments]]
order = 18
subject = ""
author = "أحمد المصرى"
posted = "2010-01-21"
text = "الصفة الأولى: التناكة >>> انا عايز اقولك يا تافه ان دى مش تناكه لكن لأنها قابلت اشكال كتير غلط زيك استغفر الله العظيم , و هيا متعرفتش عليك علشان تحكم اذا كنت انتا محترم و لا لأ و طبعا اكيد لأ , متعرفتش عليك علشان تعاملك كويس. لأنها ما شافتش غير تحرشات فى الشارع. فدا يا برنس علشان هيا محترمه.<br />انا عن نفسى لما بحب اسأل عن حاجة بسأل راجل زيي او بسأل ست كبيرة مش اوقف بنت فى الشارع دا انتا قليل الذوق.<br />الصفة التانية:معجبة بنفسها>>> و بعدين حتة معجبة بنفسها دى , انا عايز اقولك يا تافه انها بتعمل كدا علشان هيا محترمه و اتربت تربيه شرقية و الحمد لله ان لسه فيه بنات كدا علشان الشباب يلاقى بنات محترمه يتجوزوهم , مش بنات هئ و مئ زى اللى انتا بتعرفهم يا برنس<br />الصفة الثالثة:الشياكة >>>و بعدين انتا لسه رابط حتة الشياكة بإن البنت تكون لابس لبس كله عرى.؟ فيه بنات محترمه كتير و فى نفس الوقت شيك و لبسها محترم يعنى من الاخر البنت مش لازم تبقى شيخ غفر علشان تبقى محترمه يا تافه!"
archived = "2010-01-22"
capture_url = "https://web.archive.org/web/20100122070140/http://www.20at.com:80/banat/only-for-men/14972-2010-01-19-18-51-19.html"

[[comments]]
order = 19
subject = ""
author = "أحمد المصرى"
posted = "2010-01-21"
text = "يعنى انا عايز اقولك انك انسان تافه و هايف و شكلك اصلا بتاع بابى و مامى و شغل كافيهات و صياعه مع البنات التافهه,, انا عايز اقولك انى شايف البنت المصرية من احسن البنات وسط الجنسيات التانيه , انا طبعا بتكلم على البنات المحترمه المؤدبة لأنى شوفت امثله كتيرة بنات وقفت جنب ازواجها و اتحملت ظروفهم المادية و المعيشية الصعبة و بعد ما الراجل ما كان مش لاقى ياكل بقى صاحب املاك مسألتش نفسك ليه؟ علشان دى بنت اصول. اول يا جماعه لازم منعممش الكلام فى الناحيتين يعنى يا بنات مش معنى ان صاحب الموضوع دا انسان تافه يبقى كل الشباب تافهين, ابدا بالعكس الحمد لله فيه شباب كتير صاحب خلق و صاحب دين و كله منزلته ربه بها اعلم. و من الناحيه التانيه يا انسان يا تافه يا صاحب الموضوع متعممش الكلام على البنات انهم كدا و الله انا قابلت بنات كتير على خلق و على دين و مشوفتش زيهم لما سافرت الخليج من سوريا و السعودية و غيرها.. و انا بعتز انى مصرى و بعتز ان مصر فيها بعض البنات المحترمه لسه."
archived = "2010-01-22"
capture_url = "https://web.archive.org/web/20100122070140/http://www.20at.com:80/banat/only-for-men/14972-2010-01-19-18-51-19.html"

