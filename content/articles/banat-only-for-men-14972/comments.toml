text = "على فكرة اللى كاتب الكلام دة ذى العسل … و ماحدش يزعل يا جماعة دة مجرد مقال هزار يعنى .. و لونة فية كتير من الحقيقة .. و الحقيقة ماتزعلش حد … بس المشاكل اللى خلت الحال يوصل لما هو علية .. كتيييييرو اووة و موتشابكة .. فاحسن حل ان الواحد يتعامل بطابعتو و مسيرك تقابل البنت اللى تتعامل بطبيعتها معاك من غير عقد .. دة رايى.. مرسى انكو قريتو"
