text = "اقتباس مدينة التفاؤل:<br />هذا مجرد اطراء ايه الي يزعل في كدة وعلي رائ دكتور ابراهيم الفقي ركز علي الرسالة مش علي السلوك<br />تقبلوا الرائ الاخر بكل ترحيب ورائ استاذنا في الاخر مش حياكل مننا حتة ولا ده يهز ثقتكم في نفسكم بالعكس ده يضيف بالايجاب لاي بنت وعلي رائ المثل خد الثمار وارمي العود في النار<br />خدوا الخلاصة من الموضوع وطبقوا الي يناسبكوا واتركوا الباقي مش حنخسر حاجة.<br />بس اسمحلي ياستاذ شريف ياريت تهتم بمعالي الامور شويتين ياعني كلمنا في موضع اقوي من كدة علي الرغم من وجود نقاط مظبوطة وده بيحصل فعلا عند بعض البنات بس ده رايي في الاخر ياريت تاخد اراء الشباب في مواضيع اثقل من كدة وشكرا لطرحك"
