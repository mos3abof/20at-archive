posted = "2009-10-27"
text = "اولا بالنسبة للمقال فهو مقال جميل ورائع<br />بالنسبة لسؤالك الاخير فممكن نعمل حاجات كتير ابسطها التعريف بالنبى محمد-ص- وبحياته وبالدين الاسلامى وتبديل الصورة السلبيه عن المسلمين فى اغلب دول العالم<br />او اشراك العدد الهائل اللى شاركوا فى عمل عمل جماعى موحد زى مثلا ريبورت عن الجروب المسئ مرة واحده فمتهيألى ممكن يحصل اثر لو مليون واحد عملوا ريبورت عن جروب واحد مش مقاطعه بدون اى تأثير"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027212854/http://www.20at.com:80/masr/t7kyk/13830-2009-10-26-15-28-55.html"

