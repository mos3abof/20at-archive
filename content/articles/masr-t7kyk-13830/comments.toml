subject = ""
author = "لماذا نقاطع ؟"
posted = "2009-10-26"
text = "فكرة المقاطعة فكرة غبية ودليل عجز عن المواجهة<br />من يشتمنا نشتمة ونشتم سابع جد لة ومن خلفوة ومن يهاجم ديننا نهاجم دينة ونسب معتقداتة<br />من ضربنا على خدنا الايسر نضربة على خدة الايسر والايمن ايضا ونركل مؤخرتة بالشلوت<br />تقاطعوا اية<br />انتم شايفين طالبان فى افغانستان بيعملوا اية فى رؤوس الدول العظمى وحاملى راية الحرب الصليبية الجديدة<br />الاسلام العارى الحافى ليس ضعيفا ابدا حينما اختبر فى العراق واختبر فى افغانستان واختبر فى جنوب لبنان واختبر فى غزة<br />لا تقاطعوا<br />ولا تخافوا من لاعينيكم لانكم انتم الاقوى<br />قابلوا الشتيمة بالشتيمة والاساءة بالاسائة<br />وما شاء اللة لساننا طويل"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027212854/http://www.20at.com:80/masr/t7kyk/13830-2009-10-26-15-28-55.html"

