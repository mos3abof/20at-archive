author = "جيمـي"
posted = "2009-10-27"
text = "الى المعلق السابق .. ماينفعش الإساءة للأديان .. ديننا مش بيقولنا كدة<br />وإن كنت مقتنع تماماً أن المقاطعة مالهاش لازمة … وفيه سبل تانية كتير ممكن نتبعها<br />يعنى مثلاً .. هل أتصل الداعين للمقاطعة بالإعلام الغربى .. علشان تكون القضية دولية .<br />هل فكرنا نعمل موقع منافس وأحسن منه بأيادى عربية … بدل ما بنقول قاطع قاطع قاطع وخلاص … طب مهو لازم يكون فيه بديل … ولا أيه ؟"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027212854/http://www.20at.com:80/masr/t7kyk/13830-2009-10-26-15-28-55.html"

