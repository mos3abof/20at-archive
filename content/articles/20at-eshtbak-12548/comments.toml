posted = "2009-07-03"
text = "شو الظاهر يا \"عزور\"حضرتك اول مرة بتسمع باسم فلسطين<br />ولا عم تتمسخر …<br />خلينا نحكي عن الموضوع<br />بصراحة الموضوع عجبني كتير<br />وانابصراحة بحبوا لتامر المسحال بلاقي صحفي بمعنى الكلمة<br />وانا عم بقرأ اتزكرت عبارة بتقول انو الضغط بولد الموهبة<br />وهاد اللي عم نشوفو بفلسطين انهم قدروا يتعايشوا مع الوضع اللي عندهم<br />بذكائهم وقدروا يظهروا مواهبهم وابداعاتهم وينجحوا بحياتهم"
