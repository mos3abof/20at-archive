[[comments]]
order = 0
subject = "والست جيهان"
author = "ديمة"
posted = "2006-04-13"
text = "نسيتى تتكلمى عن التفرد المصرى لما الست الاولى جي جى السادات رقصت فى امريكا مع جيمى كارتر فى حفل سابق على توقيع كامب ديفيدـ وكان لذلك اثره فى توطيد العلاقة فعندما جاء كارتر لأداء العزاء فى الرئيس المؤمن السادات زار جى جى وواساها بقبلتين على وجنتيها، وخرج عمال مصر فى مظاهرة بتقول يا جيهان قولى الحق كارتر باسك ولا لأ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125326/http://www.20at.com/article2.php?sid=689"

[[comments]]
order = 1
subject = "الرقص مع الذئاب"
author = "سنووايت"
posted = "2006-04-13"
text = "طالما ارتبطت في ذهني كلمتي السياسية والعهر امتزجا ليصنعا خليطا عبقري من \" مشي حالك\"<br />لذا لنترك السياسية وما بها من رقصات وتعاولوا معي في جولة عن الرقص - شهدت الأفلام الاجنبية في فترة قريبة هوجة افلام تتحدث كلها عن الرقص اجملهم واقربهم لنفسي فيلم لريتشارد جير رجل ملتزم في حياته روتيني كالاف منا \" أزمة منتصفا لعمر لديه\" جاءت في انه اراد تعلم الرقص التحق بمدرسة لتعليم الرقص وبس تغيرت حياته جميل ان يقصد بالتغيير والايقاع ووالحركة كسرا للملل<br />الرقص الذي يخرج احلى ما في الروح وينفض الغبار عن النفوس المرهقةة المتعبة خاصة مع رفيق تتناغم معه قطعه الموسيقى وفلسفة نوع الرقصة \" انا لا اتحدث عن رقص الحاجة دينا والست فيفي وذلك الاسفاف\" انا اتحدث عن الرقصات التي تحكي فلسفات شعوب ومبدعين - اختار شريكا تألف الحياة جانبه وضع قطعه موسيقة راقيه وابدء خطواتك في ذلك العالم 00 وحقا لن تعود حتى تكون قد أغتسلت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125326/http://www.20at.com/article2.php?sid=689"

