[[comments]]
order = 3
subject = "توتو باشا الظابط"
author = "غيبوبه"
posted = "2006-08-30"
text = "انتوا منتظرين ايه من واحد ابوه دفع له رشوه علشان يدخله كليه الشرطه لان المحروس من الاساس فاشل و جايب مجموع زى وشه فى الثانويه و فى كليته يفهموه انه مبعوث العنايه الالهيه و ان الشعب اللى المفروض انه يخدمه مجرد رعاع و حشرات مالهاش قيمه<br />ده غير انه مش ممكن حته عيل صغير بينادوا له بالباشا انه يتعب نفس او يشغل بال اللى خلفته بالبحث علشان يحل قضيه فيمسك اى واحد يعذبه علشان يعترف بحاجه ماعملهاش<br />دول شويه كلاب سعرانه تخيلهم بعيد عن اوكارهم اقصد اقسامهم حتلاقى اتخن ما فيهم<br />فرخه"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062314/http://masr.20at.com:80/article.php?sid=858"

[[comments]]
order = 4
subject = "نفس العنوان"
author = "عبدالله مفتاح"
posted = "2006-08-30"
text = "لما شفت المقطع ده<br />قعدت عشان اكتب بس مقدرتش<br />على العموم لو في راجل في وزارة الداخليه عنده ضمير يحاسب المخلوق ده<br />لانه منحط جدا وخسارة فيه بني آدم<br />انا عايز اشوف راجل في الوزارة اللي المفروض بتحمينا<br />لو وزارة الداخليه كلها فيها راجل انا عايز اشوف الظابط ده بيتحاكم<br />يا وزارة الداخليه وروني كده راجل فيكم وبني ادم فيكم وحاسبوا الكائن ده"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062314/http://masr.20at.com:80/article.php?sid=858"

[[comments]]
order = 5
subject = "يا حكومه مفضوحه"
author = "دول ولادك يا حبيب العادلي (كريه الظالمي )"
posted = "2006-08-30"
text = "لعن الله قوما ضاع الحق بينهم<br />إن الله يرفه دولة العدل ولو كانت كافره ويضع دولة الظلم ولو كانت مسلمه<br />طول ما حسني وأنصاره بيولو الرعاع دول علينا عمرنا ما حنشوف نور<br />وبتقولوا مصر مستقبلنا ومصر إيه بلا خيبه<br />الواحد يروح يشتغل كلب في ماليزيا ولا يكون أمير في ممكلة ظلم مبارك<br />ربنا يجحم الظلمه واللي بيولوا الرعاع دول علينا<br />بقى حاميها حراميها<br />إيه الظلم ده<br />ربنا يقسم ظهرهم<br />من ظلام إلى ظلام في ممكله مبارك و الأسره الطاغيه والحاشيه الظالمه الكافره"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062314/http://masr.20at.com:80/article.php?sid=858"

