[[comments]]
order = 16
subject = "نيفين"
author = "وائل عباس ده ضفره برقبتك انسان شريف مش بيقبض تمن نضاله وعمر ما حد قال عليه كلمة وحشة ولا مسك عليه وساخة زى اللى بيمسكوها على رجال السياسة المشاهير"
posted = "2006-09-01"
text = "لكن انت واحد نكرة او موتور عاوز تشوه سمعة الراجل او انت ببساطة انسان مريض نفسيا وغيران منه<br />الهدم اسهل من البناء ووائل بنى جريدته من الصفر بدون مال او مساعدة من احد واعتقد انه بناها على اساس وعلشان كده اعتقد ان من الصعب حد نكرة يهدمه<br />ومن الطبيعي حد ناجح ومؤثر زى وائل عباس يكون مشهور غصب عن نفسه حتى لو لم يرد الشهرة ويكفى ان تجرى الفضائيات وراه بدلا من ان يجرى هو وراها كما يفعل كثير من النكرات<br />لكن هذه الشهرة يبدو انها تحرق قلوب البعض من الغيرة"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062314/http://masr.20at.com:80/article.php?sid=858"

