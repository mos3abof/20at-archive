[[comments]]
order = 13
subject = "آه والنبي ما تنسوش تكتبوا المصدر"
author = "مطارد الهايفين"
posted = "2006-08-31"
text = "شوفوا الهيافة يا ناس ، يعني لأن كاتب المقال ما كتبش انه جاب الكليب من موقع الوعي المصري بتاع عاشق الشهرة وائل عباس يبقى معناها الكاتب لص وفاشل!!<br />ايه الهيافة دي؟ الناس في ايه وصاحبنا بتاع الوعي في إيه ؟ وده ان دل على شيء فإنما يدل ان الهدف ليس القضية الخطيرة بحد ذاتها وإنما المهم ان يشتهر ابو شهرة والكل يتكلم عنه ، فعلا حاجة تقرف."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062314/http://masr.20at.com:80/article.php?sid=858"

[[comments]]
order = 14
subject = "يا ولاد الكلب"
author = "ابو اسامة"
posted = "2006-09-01"
text = "يا ولاد الكلب اول حاجة قولتها بعد ما شفت اللى بيحصل لشاب ممكن يكون اخويا او قريبى شاب يمثل شباب مصر المقهور وهى دى الصورة الحقبقبة لمن يحكمونا فالشعب عندهم<br />هو لاشىء ولا اعتبار اوشاءن الا لمن معه المال والكلب اللى فى الشريط ده ما هو الا<br />صورة معكوسة لمن يعمل لديهم فهم لا يعملون من اجل الشعب بل من اجل حماية مجموعة من الحرامية يحكمونا بالحديد والنار اناس بلا رحمة او دين او كرامة اين انت يا شعب مصر ايرضيك هذا الذل ."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062314/http://masr.20at.com:80/article.php?sid=858"

