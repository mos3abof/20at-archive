subject = "مفيهاش حاجة"
author = "خالد"
posted = "2006-09-02"
text = "اللي انا شفته في الكليب ده اصبح عادي جدا عند ضباط الشرطة . اللي مش عادي انه ممكن يعمل كده مع واحدة ست او مع راجل امام زوجته واولادة والله العظيم انا شفت افظع من كده. بس العيب على اللي بتضرب انه فضل ساكت كان لازم يرد عليه الصفعه بصفعة ويحصل زي ما يحصل يعني هيعملوا فيه ايه اكتر من كده."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062314/http://masr.20at.com:80/article.php?sid=858"

