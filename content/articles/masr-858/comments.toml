[[comments]]
order = 21
subject = "وائل عباس مناضل؟ ههههههههههههه"
author = "عبدالله مفتاح"
posted = "2006-09-02"
text = "يا سلام على وائل وهو الناس بتقول عليه شريف ومناضل<br />والله ده احنا شعب غلبان وفينا كم كبير من العبط<br />وائل عباس ده في مرة قال على محمد بن عبدالوهاب صنيعه الانجليزلما دخلت عشان اناقشه في الكلام ده طردني ومسح كلامي وتعليقاتي عشان خالفته ومكنتش اول مرة يمسح كلامي<br />هو ده اللي قرفنا بالكلام عن الديمقراطيه؟<br />كفاية تطاوله عليا من غير ما اغلط فيه<br />وتطاوله على العلماء الافاضل<br />مناضل وشريف<br />بلا خيييييييييييييييبه"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062314/http://masr.20at.com:80/article.php?sid=858"

