[[comments]]
order = 8
subject = "الى متى"
author = "ايمن المصرى"
posted = "2006-08-30"
text = "يا جماعة لا داعى للحزن فيوجد اكثر من ذلك بكثير . و اللة ايام الانجليز و ايام اليهود ما حصل فينا كدة . و اللة حرام عليك يا شعب مصر الشريف تسيب شوية كلاب ينهشوا فينا بالشكل دة . و اتمنى ان ارى هذا الكلب الذى بالفديو على انفراد و انا اعرفة معنى الرجولة ."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062314/http://masr.20at.com:80/article.php?sid=858"

[[comments]]
order = 9
subject = "اة يا بلد"
author = "ايمن المصرى"
posted = "2006-08-30"
text = "و اللة جزمة اصغر واحد فيكى يا مصر . اشرف من وزير الداخلية بتاعكو اللى سمح لشوية كلاب زيكوا بهذا . و احب اعرفكم ان الشعب كلة قرف منكم و من شكلكم و مستنى فى اول فرصة عشان يتف و يدوس عليكم ."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062314/http://masr.20at.com:80/article.php?sid=858"

[[comments]]
order = 10
subject = "راجل"
author = "مصرى ولله الحمد"
posted = "2006-08-31"
text = "عنوان التعليق تكملة عنوان المقال اللى انا مستغرب هوا ليه متكتبش المهم انا مش عارف هوا الحل ايه هنفضل نكتب ونقول لا للظلم لا للواسطة لا للرشوة لا للعنف لا للسرقة وبعدين اخرة لآ ايه<br />ياناس البهايم ديه عاوزه حد يوقفها عند حدها مافيش فى مصر شوية رجالة يقدروا يغيروا الوضع لو كان فيه انا بناديهم<br />الحقووووونا .... الحقووووونا"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062314/http://masr.20at.com:80/article.php?sid=858"

[[comments]]
order = 11
subject = "ارحمونا بقى"
author = "مصرى متغرب"
posted = "2006-08-31"
text = "ياعالم ارحمونا الناس الى بتهاجم كاتب المقال لانة جاب الكليب دة من مدونة لية واية يعنى اولا قراء عشرينيات اكبر من كل قراء المدونات الموجودين واكيد فية ناس ماشافتش الكليب دة غير هنا وانا مش شايف فيها حاجة خلونا فى خيبتنا انتم فكرتونى بواحد قاعد وسط اتنين واحد منهم عمال يضربو على قفاة والتانى بيضحك قام ساب الى بيضربوه واتخانق مع الى بيضحك علية<br />صدقونى حلال الى بيحصل فينا دة<br />وانت ياكاتب المقال وحياة ابوك بعد كدة ابقى اكتب انك مستعير موضوعك او فكرتة او اى حاجة من مكانها الحقيقى وارحمنا"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062314/http://masr.20at.com:80/article.php?sid=858"

