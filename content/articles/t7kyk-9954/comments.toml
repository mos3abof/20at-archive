text = "جرى اية يا استاذ حسين<br />خلاص كبرت وبان العجز عليك ما تسيبك من حكاية التمثيل والواد التقيل بتاع سعاد حسنى اللى قتلوها فى لندن تماما زى سوزان تميم علشان لم ترضى ان ترقص وتغنى فى عيد ميلاد المحروس فبعتوا كلب امن دولة رماها من البلكونة<br />ولما نجحت العملية مع سعاد حسنى كرروها مع سوزان تميم<br />سيبك من التمثيل<br />واشتغل شوية سياسة<br />انا ارشحك وزيرا للثقافة او الاعلام<br />انت راجل محترم"
