posted = "2009-04-29"
text = "أولا عند عتاب شديد على الأستاذ الشداد لأنه لوكان قد قرأ، مواضيع سنوات الضياع في القطار، لو أنه ماكان عنده هذا التعليق، هذا يبن أنه يجهل تماما جوهرالموضوع، لذا أنصحه قبل ينقد ويعلق وينقد، أن تكون عنده قريحة القرأة وفهم الأشياء لأن الموضوع الذي كتبه على الصحافة النسائية، والمعلومات الموظفة تبين مدى جهل هذا السيد بالصحافة النسائية المكتوبة للأسف الشديد."
archived = "2009-05-14"
