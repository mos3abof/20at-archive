author = "احمد عوض الله - مصر"
posted = "2009-03-17"
text = "احقا تظل الصحافة النسائية هي الشيئ الوحيد التافه او منزوع الهوية<br />اعتقد انه لدينا الان العديد من الاشيائ التي نراها ليلا ونهارا ونمارسها هكذا دون تمييز او تفكير<br />ألوم نفسي اولا واياكم على انتشار هذه الصحافة المائعة الهدامة لاننا من صنعنا نجومية هذه الصحافة وكتابها في الوقت الذي لا بد لنا فيه من وقفة مع انفسنا لتغيير واقعنا الشخصي الذي امتلأ بالعديد من السلبيات والاخطاء التي اعتدنا ممارستها يوميا …<br />ادعوكم وادعوا نفسي الى اعمال عقولنا ولو بشكل بسيط قبل اتخاذ اي قرار حيال اي قضية حتى ولو كانت تتعلق بتناول طعام او شراب او حتى قراءة خبر في جريدة<br />ونصيحة لكل الشباب … ان نفسك وحياتك اغلى من ان تقف هكذا في صفوف المتابعين او المعجبين او القارئين لفئة من هدامي المجتمع… انتقل وبسرعة الى قلب الحدث .. ولتغير نفسك اولا ليتغير المجتمع"
archived = "2009-04-23"
capture_url = "https://web.archive.org/web/20090423062506/http://www.20at.com:80/klam-rosas/11469.html"

