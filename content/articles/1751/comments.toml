text = "alahoma arina fi hadihi lmojrima laadab achadid.wa inani adou li chifa lihada tifl aladi sourikat minho tofoulatoho wartossiba wahowa fi bidayati hayatihi.inani ounachido kola solotat an tounzila achada liikab aala hadihi chirira .hadihi laajouz chamtaa.hadihi sahira lkhabita alati lam tadouk fi hayatiha maana lomouma wamaana lhob."
