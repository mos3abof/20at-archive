[[comments]]
order = 2
subject = "لا حول و لا قوة إلا بالله"
author = "أنس"
posted = "2006-06-15"
text = "قصة مؤلمة و محزنة عنوانها القسوة و عدم الرحمة، قسوة الأم التي تخلت عن ابنها للهروب من كلام الناس و عدم رحمة الظالمة التي جعلته يحيي عيشة الحيوانات، لقد رأيت الطفل في روبرتاج و كان ذلك في إحدى المستشفيات، صراحة الطفل تظهر عليه علامات توحي بأنه تعرض لإهمال كبير و عذاب شديد، ابتسم يا بني فمئالك الجنة و على أحسن الأوصاف ستدخلها إن شاء الله، أما أنت يا طاغية فاحزني حزنا شديدا فمصيرك مظلم.<br />و لا يسعنا القول إلا لاحول و لا قوة إلا بالله<br />أخوكم من المغرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152533/http://www.20at.com/article2.php?sid=934"

[[comments]]
order = 3
subject = "مجتمعنا لايحرم"
author = "نجاة شاكر"
posted = "2006-06-18"
text = "السلام للاسف السبب الرئيسي لهده الحادثة التي افجعتني هو المجتمع لنظرتة القاصرة والظالمة للمراة عندما تخطىءلا احد يرحمها ونستمر بعلاج الخطأ الى اخطاء افضع منه فهو اتى بطريقة غير شرعية المفروض ان نحتويه وسطنا لانه اصبح واقع ويبقى تحت رعاية امه الحقيقية من غير اي تشنج ونتحث عن الحل لمثل هده الاخطاء<br />اما عن المراة التي عذبته فلا اجد لها اي وصف انعته بها ولا شيء يبرر لها مافعلته فأنا اطالب ان تعدم في ساحة جامع الفنا امام الكل لتكون عبرة لكل من تسمح له بان يعذب اي مخلوق حتى ولو كان ابنه من صلبه فأنا فعلا عاجزة عن التعبيراو عن اي شيء انا لا اقول لها مصيرها جهنم لان ربما جهنم على حسب مفهومنا سنكونو فيها وستكون فيها امه كذلك انا اطلب من العدالة ان تعدم قبل الاعدام ان تعيش نفس الشيء شتى انواع العذاب وسأبذل كل ما في جهدي لكي لاطالب باعدامها وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152533/http://www.20at.com/article2.php?sid=934"

[[comments]]
order = 4
subject = "يفعل بها مافعلت"
author = "شاااااكر"
posted = "2006-06-18"
text = "من خلال هده الاسطر اريد ان اقول مايخالجني من اسىًُ على الوضع الدي اصبح عليه هدا الطفل البريئ هل بسبب انه شقي سوف نرمي به الى الحوانات فوق السطوح انه لعمل شنيع ويستحق من فعله ان يفعل به نفس الشيئ حتى يكون عبرة لكن يعتبر ولكن يمارس العنف ضد كل طفل بريئ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152533/http://www.20at.com/article2.php?sid=934"
