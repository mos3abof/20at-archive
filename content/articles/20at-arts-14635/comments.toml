text = "كذلك فى هذا العام غربت شمس حبي بعد ان سترتها جبال اقرب الناس الي ,<br />تمنيت الا ياتي هذا العام الا وانا معها , ولكن قدر الله وما شاء فعل ,<br />تمنيت لو انى مزقت كل اوراق النتيجة حتى لا ارى هذا اليوم بدونها , ولو علمت ان ليس لحبي مكان بالارض لناديت ان خذوها معي للسماء"
