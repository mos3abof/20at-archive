subject = "لا زال الأمل في نفوسنا"
author = "BASHAR"
posted = "2006-07-12"
text = "الامل في نفوسنا ، نضع الالوان على الرصاص و نعزف على القصف و الدمار ، نحتفل بزاوجنا و نحن نسمع الغارات و ازيز الطائرات ، موسيقة قبل النوم \"السنفونية الهادئة للرشاش\" ..<br />نضع القلم على الجرح ، و الريشة على الجرح ، التفكير على الجرح<br />الفن نعبر به<br />الكتابة نعبر بها<br />الكمبيوتر و الإنترنت نعبر به<br />شعب ، لا يبحث سوى عن الأمل ،،<br />فأين الأمل ؟<br />هل في الشمس التي تطلع في الصباح ، لتغادرنا المساء ،،<br />هل في إبتسامة الأطفال التي تختفي عند سماع دوي الإنفجار ،،<br />الأمل في قلوبنا الطاهعرة التي لا تهاب من طرقات هذا الجبان ، الأمل في قلوبنا المؤمنة بالله وحده<br />الأمل هوا ما نملكه<br />الأمل و رثناه لنورثه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133048/http://www.20at.com/article2.php?sid=1059"
