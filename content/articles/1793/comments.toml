subject = "بلطيم: مصيف لا يزال بخيره"
author = "لطيم: مصيف لا يزال بخيره"
text = "بقلم: أحمد فضل شبلول<br />لا تزال بلطيم نائمة في أحضان البحر المتوسط، منذ أن كان يذهب للمصيف فيها الملك فاروق، والفنان فريد الأطرش الذي صوَّر فيها فيلمه الشهير \"لحن الخلود\"، وغيرهما من الساسة والفنانين الذين كانوا يريدون الابتعاد عن صخب الإسكندرية وضوضائها، ومجونها الصيفي. فبلطيم التابعة لمحافظة كفر الشيخ (التي تبعد عن القاهرة مسيرة أربع ساعات بالأتوبيس، أو حوالي 350 كيلو مترا شمالا) أكثر هدوءا واحتشاما ووقارا من الإسكندرية، وغيرها من المصايف المتوسطية المصرية مثل: مرسى مطروح، رأس البر، جمصة، بور سعيد، العريش.<br />لا تزال بخيرها بلطيم، وعلى طبيعتها القروية، حتى بحرها يحمل هذه الصفة القروية، فمياهه تستقبل في حب وعشق مياه نهر النيل الخالد، فتكسبه اللون الرمادي، وكذا رمالها التي لم نر فيها اللون الأصفر، بل هي معجونة بالطمي النيلي الذي أكسب حبات عنبها لونه الأسود المعروف.<br />في بلطيم نجد العنب الأسود والجوافة وقرع العسل والمانجو بالأطنان، وبأرخص الأسعار، وكأنها تباع بالمجان. اشترت زوجتي ثلاث حبات ضخمة من قرع العسل بسبعة جنيهات، وعندما عرفت زميلتنا القاهرية ـ عضو اتحاد الكتاب ـ تعجبت وقالت: استحالة، فالحبة الواحدة الصغيرة تباع في القاهرة بعشرة جنيهات.<br />خمسة عشر كيلو من الجوافة المطعمة برائحة المانجو (في مشنة واحدة)، تباع بثمن ثلاثة أو أربعة كيلوات في الإسكندرية، ولكن المشكلة كيف سنحملها، ومتى سنأكلها قبل أن يصيبها العطب؟.<br />أصرت زوجتي على الشراء، فلم أملك إلا الاستجابة لرغبتها، وامتلأت رائحة شقة المصيف بشاطئ الفنار ببلطيم، برائحة الجوافة المطعمة برائحة المانجو. ولم تتسع ثلاجة المصيف ـ على كبر حجمها ـ لكل هذه الكمية من حبات الجوافة التي بدأت أتشممها، وأنا على مدخل العمارة ذي الأدوار الثلاثة التي تأخذ شكل الفيلا (كانت شقتنا في الدور الأخير)، والتي حلت محل العشش الخشبية القديمة في كل شواطئ بلطيم، وربما هذا هو التغير الأهم الذي طرأ على بلطيم (وأيضا رأس البر) منذ الأربعينيات والخمسينيات وحتى الآن.<br />ما أن عدنا إلى منزلنا في الإسكندرية ـ بعد ستة أيام في مصيف بلطيم ـ حتى قامت زوجتي بعزل حبات الجوافة المعطوبة (وكانت لحسن الحظ قليلة) وألقت بها في سلة النفايات، ثم وزعت على الجيران الكثير من الحبات السليمة، ثم قامت بعمل شرائح صغيرة من حبات أخرى ووضعتها في (فريزر الثلاجة). وعندما سألتها عن الهدف، قالت: شهر رمضان على الأبواب، ومن هذه الحبات نصنع عصيرا رمضانيا. قلت لها: ونعم التدبير المنزلي.<br />جبل النرجس من أشهر الأماكن في بلطيم، لم نصعده، ولكن كنا نمر أمامه أثناء تجوالنا الليلي بالبلدة الهادئة، التي لا تسهر حتى الصباح مثل الإسكندرية، لذا كان زملاء الرحلة يتعجبون أن نترك الإسكندرية في مثل هذا الوقت من السنة، ونأتي إلى بلطيم، وكنت أقول لهم: رغبتي في أن أتعرف على أماكن جديدة من مصايف بلادنا وشواطئها.<br />أما عن أماكن الترفيه، فلم يكن هناك سوى سينما بلطيم التي تعرض ثلاثة أفلام دفعة واحدة وفي حفل واحد، من التاسعة مساءً حتى الثانية صباحا. قررنا في اليوم الثاني لوصولنا، دخولها. قام الزميل جاد حسين ـ المشرف على الرحلة التي أعدتها لجنة العلاقات الإنسانية باتحاد الكتاب برئاسة الزميل حسن الجوخ ـ بجمع أسعار التذاكر من المشتركين الذين وصل عددهم أكثر من ثلاثين فردا، فاستطاع أن يحصل على خصم جيد.<br />الأفلام المعروضة كانت حسب ترتيب عرضها: السيد العاطفي، والسفارة في العمارة، ومعلش احنا بنتبهدل.<br />كانت السينما الصيفية ممتلئة عن آخرها، فهي المكان الوحيد للترفيه الليلي (فلا سيرك، ولا مسرح، ولا ملاهي، ولا غيره) ما يهمني في هذه الأفلام الثلاثة كان فيلم عادل إمام \"السفارة في العمارة\" الذي أثار جدلا كبيرا لدى أوساط المثقفين والشعراء والأدباء في مصر، وبعضهم رفع دعوى قضائية ضد عادل إمام لتهكمه على قصيدة \"لا تصالح\" للشاعر الراحل أمل دنقل التي أصبحت رمز الدعوة ضد الصلح أو التطبيع مع العدو الإسرائيلي.<br />خرجت من قاعة السينما، وأنا أتساءل: هل الفيلم يدعو إلى التطبيع، أم هو ضد التطبيع؟ أحيانا كنت أشعر أنه يدعو دعوة سافرة إلى التطبيع، ولكن نهايته توحي بأنه ضد التطبيع (مش حانسلم .. مش حانبيع .. مش حانوافق ع التطبيع) وهو الشعار الذي رفعته طوال الفيلم الممثلة داليا البحيري، وكان يستجيب لها أحيانا بطل الفيلم.<br />لن نناقش هنا فيلم \"السفارة في العمارة\" الذي لا يعد ـ فنيا ـ من أفضل أفلام عادل إمام، نظرا لعدم توافق سنه مع شخصية المهندس الشاب العائد من الإمارات الذي لا يهمه في الدنيا سوى إقامة العلاقات مع النساء، والاهتمام بملابسهن الداخلية. أما فيلم السيد العاطفي فهو يلعب أيضا ـ في بعض مشاهده ـ على وتر السياسة وعلى الموقف من إسرائيل، بينما يعزف فيلم \"معلش احنا بتبهدل\" بطولة أحمد آدم، على نغمة أحداث 11 سبتمبر ثم الحرب على العراق في حوار، لا يرقى إلى مستوى الفكرة.<br />خرجنا من قاعة السينما في الثانية صباحا، على وعد بعقد ندوة صيفية بلطيمية لمناقشة الأفلام الثلاثة في كازينو حمادة الذي يقع في أول شاطئ الفنار، والذي كان يحتضن هذه المجموعة من أعضاء اتحاد الكتاب وأسرهم. تحمس للمناقشة كل من الكتَّاب: سعيد الكفراوي، وعلي عيد، وفتحي سلامة، ورفقي بدوي، ونبيل عبد الحميد، وعبد المنعم عوَّاد يوسف، ود. يسري العزب، وعادل الخطيب، وغيرهم. لكن لم تقم هذه الندوة، وإنما دارت أحاديث جانبية حول الأفلام الثلاثة، وخاصة \"السفارة في العمارة\" فهو الأكثر جدلا.<br />تقع بحيرة البرلس في الجنوب الغربي لبلدة بلطيم، وقمنا بعمل جولة بحرية تحت الشمس الملتهبة، في وسط هذه البحيرة التي ذهبنا إلى شواطئها عن طريق (الطفطف) وهو مركبة تشبه الباص (أو الأتوبيس) مفتوحة من جميع الجهات، حيث قمنا بتأجير مركب، وتجولنا به داخل البحيرة الهادئة التي تتميز بوفرة سمكها، لكننا لم نصطد منها شيئا، فهناك مراكب شراعية كثيرة العدد تجوب أنحاء البحيرة لاصطياد السمك وبيعه بأثمان معقولة إلى المستهلكين، أو توريده لتجار السمك الآخرين.<br />اقرأ بقية التعليق .."
