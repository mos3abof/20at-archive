[[comments]]
order = 7
subject = "مسلمة اون لاين"
text = "السلام عليكم ورحمة الله وبركاته<br />تقبل الله منك يااخى الكريم:) موضوعك قمة في الروعة والصدق وسلاسة الاسلوب لدرجة انى احسست انى بالحرم المكى الله يبارك فيك ويكثر من امثالك احاسيسك دليل على قربك من الله عزوجل لا يسعنى ان اقول الا ربنايرزقناويرزقك عمرة في رمضان والمسلمين اجمعين"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018144711/http://www.20at.com:80/article.php?sid=632"

[[comments]]
order = 8
subject = "بنت القسام"
text = "أخي مجاهد<br />بداية السلام عليكم و رحمة الله و بركاته<br />موضوع جميل , بارك الله فيك و ادامك ذخراً للإسلام و المسلمين .<br />سبحان الله قد يكتب الفرد منا خواطر عند ذهابه لبيت الله الحرام ... لكن لم أكن اعرف إن هذه الخواطر قد تتجدد و تتجدد مع كل زيارة .<br />سبحان الله ذكرني موقفك مع \" الحجر الأسود\" بموقفي بالضبط ... كم هي ضعيفة هذه النفس .<br />أتمنى من الله أن يتقبل عمرتك و أن يرزقك الحج قبل لقائه إن شاء الله .<br />كذلك لغتك الصحفية و انسياقها جميل للغاية<br />جزاك الله خيراً"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018144711/http://www.20at.com:80/article.php?sid=632"

[[comments]]
order = 9
subject = "رنا."
text = "الله يا اخ مجاهد ..خواطر رائعة جدا ...<br />كل سطر قرأته جعلتني أحس وكأني هناك بالفعل ..لقد زدتني شوقا لزيارة بيت الله الحرام مرة أخرى...<br />ان شاء الله ان كتب الله لي زيارة بيته الحرام مرة اخرى ان اجعلها زيارة تختلف عن مثيلاتها السابقة...<br />فالانسان كلما ازداد عمرا ازداد نضجا وكلما اكتشف آفاقا ومعان جديدة في هذا الدين الرائع وعباداته وشعائره المتميوة.<br />بارك الله فيك اخي وان شاء الله عمرة مقبوله وتكون بعودة يارب العالمين"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018144711/http://www.20at.com:80/article.php?sid=632"

