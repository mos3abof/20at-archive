text = "أكتر وقت أستشعرت فيه حلاوة العمرة وأنا في البقيع الجو هناك حاجة تانية تحس وأنت ماشي في المقابر انك ماشي في جنينة واللحظة اللي موش ممكن أنساها هي لحظة المرور علي قبر النبي صلي الله عليه وسلم ...<br />حسيت اني عايز ابكي ..مكنتش عارف استوعب فكرة ان ورا السور ده فيه واحد ربنا باعته علشاني وان ورا السور ده واحد انا بحبه قوي ...<br />ربنا يتقبل مننا جميعا ويرزقنا تكرارها كمان مرة"
