subject = "الهمسة واللمسة"
text = "الحبيب مجاهد<br />جزاك الله خيرا<br />وتقبل منك همساتك ولمسات.. وغفر خطاياك.. عمدها وسهوها سرها وعلانيتها<br />ولا بد لك من جناحي الخوف والرجاء، فهو غفور رحيم وشديد العقاب<br />أصلح الله أحوالنا جميعا وتقبل منا ومنك صالح العمل."
archived = "2004-10-18"
