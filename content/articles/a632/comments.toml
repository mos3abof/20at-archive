subject = "زمزم"
text = "اللللللللللللللللللللللللله<br />الموضوه جميل جدا جدا جدا ربنا يباركلك يا مجاهدخليتنى احس انى شايفه كل حاجه بتوصفها<br />انا حلم عمرى انى اطلع عمره لانى حاسه انها هتغير حاجات كتير فى حياتى ربنا ينولهالى يارب وينولها لكل مسلم<br />وانت هايل يا مجاهد ربنا يكرمك"
archived = "2004-09-25"
