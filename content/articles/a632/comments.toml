[[comments]]
order = 3
subject = "zohor135@hotmail.com"
text = "أثرت شجوننا يا اخ مجاهد والأحاسيس في المقال جعلتنا نشتاق لمكة ولزمزم وللصلاة في ساحة الحرم<br />زيارة المسجد الحرام هي أحب واقرب الزيارات إلى قلبي<br />ادعوا الله أن يديم هذه النعمة علي وعلى من يحب وان يرزقها لكل من يتمناها<br />وأقول لمن تمنى العمرة وشعر بأنها بعيدة عنه لظروفه أو أي شيء انويها بصدق وسييسر الله لكم كل عسير<br />من أفضل أيام حياتي يوم عملت عمرة مع أخت لي في الله<br />مااسعدها مت لحظات أمام الكعبة دعوت الله أن تكون محبتنا خالصة لوجهة وان يظلنا تحت عرشه يوم لا ظل إلا ظله<br />اللهم بلغنا رمضان وارزقنا وإياكم فيه عمرة وبعدها حجه عما قريب<br />اللهم آمين<br />زهور"
archived = "2004-09-25"
capture_url = "https://web.archive.org/web/20040925143830/http://www.20at.com:80/article.php?sid=632"

