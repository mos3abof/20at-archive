[[comments]]
order = 1
subject = "سؤال محيرنى"
text = "بصراحة كلما قرأت عن الأصوات التى تنادى بالاصلاح داخل السلطة الفلسطينية، و ازاحة هذه الوجوه الفاسدة، أثير فى خيالى سؤال ، لماذا هذا التوقيت بالذات، و هل هذا يصب فى مصلحة الاحتلال الصهيوني، الذي يسعده الانشقاق داخل الصف الفلسطيني، لا اعلم، لكن بصراحة أنا خايفة كتيييييييييير على مستقبل الانتفاضة و خايفة أن تكون هذه الصراعات الداخلية بداية النهاية لها"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018213338/http://www.20at.com:80/article.php?sid=496"
