[[comments]]
order = 7
subject = "يا تلاميذ بغداد الأبية..!!"
text = "يا تلاميذ بغداد الأبية...<br />علمونا ...<br />بعض ما عندكم ...<br />فنحن نسينا ...<br />علمونا ...<br />بأن نكون رجالا ً<br />فلدينا الرجال ...<br />صاروا عجينا ً...<br />علمونا ...<br />كيف الحجارة تغدو ...<br />بين أيدي الأطفال ,<br />ماسـا ً ثمينا ً ...<br />كيف تغدو<br />دراجة الطفل , لغما ً<br />و شريط الحرير ...<br />يغدو كمينا ...<br />كيف مصاصة الحليب ...<br />إذا ما اعتقلوها ...<br />تحولت سكينا ...<br />يا تلاميذ بغداد ...<br />لا تبالوا ..<br />بـإذاعـاتـنا...<br />ولاتسمعونا ...<br />إضربوا ...<br />إضربوا ...<br />بكل قواكم<br />و احزموا أمركم<br />و لا تسألونا ...<br />نحن اهل الحساب ...<br />و الجمع ...<br />و الطرح ...<br />فخوضوا حروبكم<br />و اتركونا ...<br />إننا الهاربون<br />من خدمة الجيش ...<br />فهاتوا حبالكم ...<br />و اشنقونا ...<br />نحن الموتى ...<br />لا يملكون ضريحا ...<br />و يتامى ...<br />لا يملكون عيونا<br />قد لزمنا حجورنا ...<br />و طلبنا منكم<br />إن تقاتـلوا التنينا ...<br />قد صغرنا , أمامكم<br />ألف قرن ...<br />و كبرتم<br />- خلال شهر- قرونا ...<br />يا تلاميذ بغداد ...<br />لا تعودوا ...<br />لكتاباتنا ... و لا تقرأونا<br />نحن أباؤكم ...<br />فلا تُشبـِهُـونا ...<br />نحن أصنامكم ...<br />فلا تعبدونا ...<br />نتعاطى القات السياسي ...<br />و القمع ...<br />و نبني مقابرا ً ...<br />و سجونـا ً ...<br />حررونـــا ...<br />من عقدة الخوف فينا ...<br />و اطردوا<br />من رؤوســنا الأفيونا ...<br />علمونا ...<br />فن التشبث بالأرض<br />و لا تتركوا ...<br />المسيح حزينا ...<br />يا أحباءنا الغار ...<br />سلاما ً ...<br />جعل اللّه يومكم ياسمينا ...<br />من شقوق الأرض الخراب ...<br />طلعتم<br />و زرعتم جراحنا ...<br />نسرينا ...<br />هذه ثورة الدفاتر ...<br />و الحبر ...<br />فكونوا على الشفاه ...<br />لـُحـونا ...<br />أمطرونا ...<br />بطولة , و شموخا ً ...<br />و اغسلونا من قبحنا ...<br />إغسلونا ...<br />لا تخافوا موسى ...<br />و لا سحر موسى ...<br />و استعدوا<br />لتقطفوا الزيتونا ...<br />إن هذا العصر اليهودي<br />وهم ...<br />سوف ينهار ...<br />لو ملكنا اليقينا ...<br />يا مجانين العراق ...<br />ألف أهلا ً ...<br />بالمجانين ,<br />إن هم حررونا ...<br />إن عصر العقل السياسي ...<br />ولىّ من زمان ...<br />فعلمونا الجنونا ...<br />القصيدة لنزار قباني بعنوان\" يا تلاميذ غزة \" وقد تدخلت ببعض التعديلات<br />(( واحد والسلام ))"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018174804/http://www.20at.com:80/article.php?sid=653"
