[[comments]]
order = 0
subject = "سددوا وقاربوا"
author = "عل الوقع الذي يتركه خطأ أو \"ذنب\" الشخص الملتزم في نفوس المحيطين به يكون أكبر وأعظم، لإنهم ينظرون له دائما برؤية القدوة أو بنوع من الاحترام الكثير، وليس بالضرورة كنوع من تصيد الأخطاء للملتزمين، رغم أنني لا أنفي أن نفرا غير قليلا يفعل هذا التصيد"
text = "الثابت في الأمر أنني توصلت إلى قناعة داخل نفسي، إذ ناقشت معها ذلك الأمر، مفادها جملة واحدة \"اتركوا الملتزمين في حالهم\" !!!<br />ليس الملتزم ملاكا كي لا نتوقع منه خطئا . . وليس الملتزم شيطانا كي نتوقع من كل ملتحٍ أنه يحمل حزام متفجر حول وسطه!!<br />الملتزم شخص عادي جدا، من الناحية التشريحية والفسيولوجية أيضا أما من الناحية الإيمانية والأخلاقية فعلى كل منا أن يكون ذاك الشخص سواء أطلق عليه الآخرون لقب \"ملتزم\" أو \"شيخ\" أو لم يطلقوا<br />ومعايير الالتزام في دين الله معروفة .. وعلى كل شخص أن يكون ذلك الشخص !!<br />عمرو مجدي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142302/http://www.20at.com/article.php?sid=1543"

