[[comments]]
order = 3
subject = "اللهم اصلح حال الأمة"
author = "لأسف الملتزمين كل تصرفاتهم تحت الميكروسكوب وكأن الناس نسيت كل همومهاولو وجدت شخص ملتزم لابد وان تتصيد له الأخطاء وتجلد فيه"
text = "المفروض ان الناس تصلح من عيوبهاأولا لو كل إنسان اصلح نفسه لصلحت الامة<br />اللهم اصلح حال الأمة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142302/http://www.20at.com/article.php?sid=1543"

[[comments]]
order = 4
subject = "الحقوا بنا"
author = "لسلام عليكم و رحمة الله :)"
text = "لو عرف غير الملتزمين مايعني الالتزام بطاعة الله<br />من سعادة و راحة بال لتنافسوا عليها..<br />يا ناس اضمنوا السعادة في الدنيا والآخرة واضمنوا وعد الله :<br />\"من عمل صالحا من ذكر او انثى و هو مؤمن فلنحيينه<br />حياة طيبة ولنجزينهم أجرهم بأحسن ما كانوا \"<br />دعاء.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142302/http://www.20at.com/article.php?sid=1543"

[[comments]]
order = 5
subject = "الملتزم هو"
author = "لملتزم هو شخص يحاول دائما ان يرضى الله"
text = "لكن ارضاء الله ياخذ اكثر من شكل<br />فمن يرضى الله فى علاقته بالله عن طريق العبادات كالصوم والصلاه والسنن النبويه الجميله<br />ومن يرضى الله فى علاقته بالناس يحاول ان يحبهم فى الله فلا يؤذيهم القول او العمل ويشجعهم على الخير والنجاح<br />ومن يرضى الله فى نفسه بان لا يهلك نفسه يهتم بنفسه فلا يهلكها بسجائر مثلا او صداقات سيئه<br />فهو شخص يسعى لله فى مثل هذه المواطن او غيرها<br />لكنه من الطبيعى انه يخطأ لانه ربنا خلقه بشر وانسان عادى مش نبى لكن زى ما بيقولوا كده هفوة العالم لا تغتفر اقول ان خطا الملتزم لا ينسى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142302/http://www.20at.com/article.php?sid=1543"
