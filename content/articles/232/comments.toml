[[comments]]
order = 10
subject = "وائل عباس"
text = "الحقيقة انا مع الاخ موضوعي قلبا وقالبا<br />فكيف نطالب بحقوق دول اخرى ولا نطالب حقوقنا احنا !!!<br />بس هو فيه حاجة يا اخ موضوعي<br />تلاحظ ان السادات لما حب يغلي الاسعار قام قايلها صراحة في خطاب له<br />كان راجل طيب<br />انما اخينا اللي ماسك البلد ده يقول حاجة وتاني يومك يعمل عكسها<br />يعني يقولك نزلنا الجمارك وتاني يوم تلاقي كل حاجة ولعت نار<br />لاحظ حاجة كمان<br />ان كل القوانين المهمة بتتعمل في الصيف وهي الطلبة واخدين اجازة !!! علشان محدش لا يعترض ولا يتظاهر<br />بجد انا احيي النظام الحاكم على ذكاؤه وتجنبه لاوقات تجمع الطلبة<br />وباقول لدكاترة الجامعة سواء الاخوانجية او الناصريين وممكن اقول اسماء لو عايزين ... اقولهم اتكسفوا على دمكم بقى !!! وبطلوا تهيجوا العيال علشان فلسطين والعراق !!! العيال دي ها تتخرج مش ها تلاقي شغل !!! خلونا نصلح بلادنا الاول قبل ما نصلح بلاد الناس التانية !!!"
archived = "2004-09-25"
capture_url = "https://web.archive.org/web/20040925071127/http://www.20at.com:80/article.php?sid=631"

