subject = "سونيا الشريرة"
text = "الموضوع حلو جدا<br />بس فعلا هو ليه احنا دايما بنعول على الطلبة انهم يكونوا عصب حركة المعارضة في البلد .. مع إن الطلاب قطاع بيتخرج ويخلع وتبقى الحركة مبتورة ومريضة<br />ثم ليه كل اهتمامات الطلبة هي القضايا الخارجية مع أن الداخل هو مفتاح الخارج<br />خمال عبد الناصر اكتشف كده في الفلوجة ومن هنا بدأت ثورة يوليو<br />عقبال الثورة الجاية ويسقط كل العصافير"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018143356/http://www.20at.com:80/article.php?sid=631"

