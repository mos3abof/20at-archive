[[comments]]
order = 0
subject = "واحد موضوعي"
text = "للاسف يعتبر كثير من الناس ان الاخوان هم الاسلام وهم الاصلاح بالرغم من انهم على العكس تماما!!!<br />فكل ما يردونه هو شوية كراسي في البرلمان !!!<br />فالاخوان في حالة غزل مع الحكومة ولا يمكن ان يتطرقوا للسياسة الداخلية ودي معلومات مؤكدة منشورة في منتديات الاخوان على لسان قادتها !!!<br />وليسوا هم بتوع السياسة الوحيدين في الجامعة<br />فيه شيوعيين وناصريين ووفديين<br />ثانيا مظاهرات الجامعة يغلب عليها العبط<br />فهذا الشباب المتحمس لفلسطين والعراق يا ليته يتحمس بنفس الحماسة لبلده مصر وما فيها من فساد وبطالة وغلاء !!!<br />والسبب هو قيادات الاخوان والناصريين القومجية بالتحديد ومنهم دكاترة في الجامعة نفسها<br />فكل ما يقومون به تهييج وتحميس الطلاب ضد امريكا واسرائيل وبلاد تركب الفرافير<br />اما الحكومة فهم يعيشون معها شهر عسل ... فلا مظاهرات احتجاج على البطالة ولا الحريات كما حدث ايام ناصر ولا ارتفاع الاسعار كما حدث ايام السادات ولا اي شيء مما يمس حياة هؤلاء الشباب فعلا وما بعد تخرجهم<br />ده حتى اللي يعوزه البيت يحرم على الجامع<br />وللاسف نجد في تلك المظاهرات التافهة طلبة يستشهدون للاسف ولا حول ولا قوة الا بالله<br />فين المظاهرات ايام عبد الناصر ؟؟؟<br />فين المظاهرات ايام السادات ؟؟؟<br />لما كان الشباب واعي وفاهم مصلحته ومصلحة بلده اللي فوق اي اعتبار !!!"
archived = "2004-09-25"
capture_url = "https://web.archive.org/web/20040925071127/http://www.20at.com:80/article.php?sid=631"

