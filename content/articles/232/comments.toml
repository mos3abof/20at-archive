[[comments]]
order = 16
subject = "تجربة شخصية"
text = "كنا في مظاهرة..ومع الهتافات والحماس انفعل احد المشاركين في المظاهرة وهاجم بشدة قائد حرس الجامعة..الرجل كان يقف بعيداً ويتابع مايحدث في المظاهرة والنجوم بتلمع علي كتفه<br />المهم انتهت المظاهرة وانفضت وبقي تار قائد الحرس البايت..ولذلك كنا متوقعين أن يأتي أحد من العصافير ويخترقنا ليعرف مكان من شتم القائد الهمام.<br />في اليوم التالي جاءنا شاب غريب..يتحدث بإرتباك شديدوتقدم نحونا ثم قال:<br />ماتبصوش ناحية شباك الحرس..أنا أمن دولة وباعتيني علشان أعرف مكانك وأشار إلي من شتم قائد الحرس..أنا شغال معاهم من زمان علشان انا باخف من امن الدولة جداً بس بعدم ماشفتكم امبارح وانتو بتتكلموا بتهتفوا حزنت علي نفسي..يارتني اعمل زيكم..علشان كده ياريت حد ييجي يتمشي معايا في الجامعة ويشوفونا مع بعض علشان يتأكدوا ني قمت بشغلي.<br />ذهب معه زميلنا المطلوب..وتحدثوا كثيراً..عن أهله وبيته والحقيقة أنه ظروفه ماكنتش تختلف كتير عن ظروف الناس اللي انتوا جايبنها في التحقيق بتاعكم<br />ومن ساعتها الشاب ده كان بيساعدنا كتير لما يعرف أي حاجة تخصنا..من اليوم ده عرفت ليه احنا بنسمي الشباب دول عصافير....."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018143356/http://www.20at.com:80/article.php?sid=631"

[[comments]]
order = 17
subject = "عصفور في اليد"
text = "كنت عصفور بس بشكل عكسي ...كانت مهمتي اني اقوم بانشطة عادية تماما في اتحاد الطلبة وفريق المسرح والرحلات ...<br />واتظاهر اني بكره بتوع التيار الاسلامي جدا واكون صدقات مع الأمن وأعرف منهم حجم المعلومات التي يعرفونها عن الشباب الي معانا وناويين علي ايه معانا ...<br />الموضوع ده استمر سنتين وبعدها في سنة تالتة بقيت مسئول عن جماعة المسرح وكان لازم يبقي فيه تغير ...اعلنت اني تبع التيار الاسلامي في مظاهرة خرجت فبها وبعدها ....<br />مفيش بعدها ...قعدت سنتين في ثالثة وربنا كريم ..!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018143356/http://www.20at.com:80/article.php?sid=631"

