[[comments]]
order = 0
subject = "منقول"
text = "لولا الارهاب الذي لا يجوز الدفاع عنه, ولا يمكن تبريره إطلاقاً, لما كانت هناك مشكلة في عودة المسلمين الى الدين, ففي الولايات المتحدة نفسها هناك زيادة ملحوظة في الميل الى التديّن, حتى خارج \"حزام التوراة\" في جنوب الولايات المتحدة. وكنتُ قرأت قبل بضعة أيام تحقيقاً دقيقاً في \"كريستيان ساينس مونيتور\" رصد ظاهرة جديدة هي انتشار العبادة في البيوت, إضافة الى الكنائس والكنس. وهي تابعت جماعات مسيحية تصلي في البيوت من بوسطن الى اوستن في تكساس, كما سجلت ان 15 جماعة صلاة يهودية في بوسطن تحوّلت الى طوائف منفصلة خلال السنوات الثلاثين الماضية.<br />جهاد باشا الخازن - أشطر صحفي في الدنيا الحياة اللندنية - 2 أغسطس 2004"
archived = "2004-09-01"
capture_url = "https://web.archive.org/web/20040901175824/http://www.20at.com:80/article.php?sid=499"

[[comments]]
order = 1
subject = "حزام التوارة"
text = "المعلم معلم فعلا يااخوانا ..تعبير حزام التوارة تعبير رائع فعلاً ياعم جهاد..وعليه نستدرك أن دين امريكا فيما يبدو يخرج علي حزام الأديان السماوية بشكل عام ..ويحاول ان يخلق دينه الخاص بما يتناسب أولا مع الإيقاع الأمريكي - وعلشان كده حلو أوي موضوع عبادة الشقق دي اللي تحولت إلي أديان ايجار مفروش - وثانياًمع مصالحه - ككل الأديان - .<br />ومعني الكلام أن امريكا من مصلحتها تعمل عجينة دينية خاصة وقابله للتمدد..وزي مابيقول توماس فريدمان عن العولمة انها \"بيتزا ثقافية\" بمعني انها عجينة يمكن وضع المكونات الخاصة بكل ثقافة كما تريد..ففيه بيتزا تونة وبيتزا لحمة مفرومة وبيتزا فراخ بالكاري - آه ياكاري يانا- وهكذا.<br />تشكل أمريكا بيتزا دينية كما تريد وفي هذا الإطار نفهم دعوة امريكا بتغيير المناهج ..وحذف بعض الآيات القرآنية..وتغيير بعض السلوكيات ...فما المانع إذا كنت تستطيع ان تضع في العجينة ما تريد وتنزع عنها ماتريد.<br />المهم الطعم يطلع حلو<br />وبالهنا والشفا"
archived = "2004-09-01"
capture_url = "https://web.archive.org/web/20040901175824/http://www.20at.com:80/article.php?sid=499"

