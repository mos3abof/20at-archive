subject = "الموت القادم من الشرق"
text = "في الولايات المتحدة نفسها هناك زيادة ملحوظة في الميل الى التديّن؟؟كيف هذا ومعدلات الجريمة والسرقة والاغتصاب في ارتفاع مستمر في هذا البلد اللعين؟المجتمع الأمريكي من أكثر المجتمعات التي تشهد الانحراف الأخلاقي و المخدرات والإباحية ،كيف يمكن لهذا المجتمع أن يكون متدينا؟؟؟؟"
