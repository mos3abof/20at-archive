[[comments]]
order = 3
subject = "في الأهم من كأس العالم وإسرائيل !!"
author = "محمد الحسن"
posted = "2006-06-18"
text = "قبل الكلام ده في مباراة إيران والمكسيك فوجئت بعلم إسرائيل بين أيدي المشجعين المكسيكيين ؟؟ ليه ؟؟ وطنية بالشقلوب ولا بيحرقوا دم الإيرانيين ؟؟ ولا قلة مندسة مش من المكسيك ومجرد مشجع يهودي غاوي قلة أدب ؟؟<br />حاجة كمان : كالعادة بيتم ترجمة الملصقات الدعائية للمونديال واللي بتحمل الشعا زي البروشورز والفلايرز لكل لغات الدنيا ، المرة دي لفت نظري حاجة ،، العرب مشاركين بدولتين ، وتاريخهم في المونديال من سنة 1978 وهما بيشاركوا فيه ،، ومافيش كلمة توحد الله بالعربي ؟؟؟؟؟ في المقابل في شعارات بالعبري ؟؟ وإسرائيل عمرها ماشاركت في كأس العالم وإن شاءالله ماتشاركش ؟؟ الفكرة شوف كام واحد بيتكلم عربي وكام واحد بيتكلم عبري ؟؟؟؟؟؟<br />وعندي حاجة أهم : ليه المتابعة العبيطة دي من العالم العربي لكأس العالم والواصلة لحد الهوس ؟؟ بنتابع المونديال كإننا بنتابع العبور أو فتح عكـــا ؟؟ حد أخد باله بالمصايب اللي بتحصلنا في فلسطين والعراق ؟؟ ولا حتى في مصر ؟؟؟ كام واحد تابع فاجعة الطفلة هدى في غزة اللي فقدت أهلها وكام واحد تابع في نفس الوقت إفتتاح كأس العالم ؟؟ مش عايز أعرف الإجابة<br />عارف إن المتابعة مش مرفوضة ، أنا عن نفسي بتابع وبشغف كبير المباريات ، يكفي إننا بنتفرج على كورة فعلا وفن ومهارة مش العك بتاع لاعبينا ؟؟؟ كفاية ياعالم اللي تابع مباراة الأرجنتين وصربيا 6 - 0 وشاف الفن ، جاله نفس إزاي يتابع في نفس اليوم مباراة الأهلي والزمالك ، واللي انتهت بفوز الأهلي كالعادة ، وخسارة الزمالك كالعادتين ؟؟؟؟<br />بس الفكرة إن لازم يكون عندنا أولويات عشان ماننساش نفسنا وقضيتنا : الحرية ، سواء لأهلنا في فلسطين والعراق ، أو لينا إحنا عبيد النظام في مصر ... للأسف<br />عامة الموضوع ممتاز وجميل جدا"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208075006/http://worldcup2006.20at.com:80/article.php?sid=61"

