subject = "أحذروا من فرق تسد ."
author = "شرقاوي"
posted = "2006-06-19"
text = "مش يمكن غرض إسرائيل هو بث الكراهية بين غانا و العالم الإسلامي تطبيقاً لمبدأ \\\" فرق تسد \\\" ؟<br />دعونا نفوت عليهم الفرصة و نقول أحنا برده مع غانا الأفريقية و الواد جون ده مش هو الحكومة ولا هو الشعب الغاني .<br />و كمان أحنا مع أي تحالف ضد أمريكا حتى و لو مع أمريكا اللاتينية ."
