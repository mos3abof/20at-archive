[[comments]]
order = 5
subject = "وماله ‍!!!"
author = "سيف الدين"
posted = "2006-06-19"
text = "و ماله ياعم على لما جون يطلع علم اسرائيل على الاقل هو عمل حاجة مقتنع بيها من غير مايخاف<br />تقدر انت تطلب رسميا من التليفزيون المصرى منع اغانى الفيديو \\\"كلب\\\"لانهاكلها عرى وده<br />حراماوتقدر تمنع د/اقبال بركة من مهاجمة الحجاب فى كل مناسبة و من غير مناسبة وبتدافع عن العرى و بتقول بالحرف \\\"ان الشعب المصرى كان فى الخمسينات و الستينات كان بيحترم الممثلةاللى بتطلع بالمايوهعلى البحر لكن مش عارفةايه اللى حصل فى المجتمع و ليه بقينامجتمع متطرف \\\"الكلام ده كان فى برنامج البيت بيتك وكمان مش عاجبها النص القرآتى الذى فرض فيه الحجاب . يعنى ياعم على لما المجتمعات الاسلامية الاصيلة يظهر فيها دعاة الفجور و العرى باسم الفن ولا احديمكنه ايقافهم عن الحد حتى لا يخربوا عقول الناس ويرجعوا بيهم للجاهليةو التطرف قبل الاسلام تيجى انت تزعل من جون لما يرفع علم اسرائيل‍‍‍؟‍ ياراجل خليك فريش واقبل بوجود الاخر و<br />\\\"طبع العلاقات\\\" و \\\"تعايش سلميا\\\".<br />شوف الناس دى بتوصل للباطل اللى هم عاوزينه ازاى و انت ابسط ابسط الحقوق مش عارف تحلم بوجودها,تعرف ان انا بحسد شباب اسرائيل عشان عندهم دولة بتحققلهم احلامهم حتى و لو دموية<br />اما احنا \\\"شباب مصر\\\"بقينا بنخاف من خيالنا و من امن الدولة ماتزعلش منى لما اقول \\\"لو لم اكن مصريالوددت ان اكون اسرائيليا\\\"<br />و على راى عمرو دياب \\\"وماله\\\""
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208075006/http://worldcup2006.20at.com:80/article.php?sid=61"

