text = "هل المقصود أنها رسالة أرسلها الأستاذ أنيس منصور للموقع وبدأها بـ\"السلام عليكم\".. ام أن طالسلام عليكم\" اسم وكالة أنباء جديدة ؟!<br />يا ريت توضحوا لنا الله يكرم والديكم"
