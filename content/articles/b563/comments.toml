[[comments]]
order = 0
subject = "فعلا سبحان الله"
author = "طماطم"
posted = "2006-03-13"
text = "سبحان الله العظيم الكريم لة فى خلقة شوؤن ان الله سبحانة وتعالى خلق الانسان فى اجمل صورة وميزة عن كثير من مخلوقاتة وكرمه افضل تكريما وعندما انظر الى نفسى اجد الكثير من الاشياء التى تجعلنى اقول سبحان الله مش الف مرة بل ميلون مرة واشكر العشرينات على هذا الموضوع<br />وهناك الكثير من المخلوقات التى تستحق منا التوقف امامها كى نعرف مدى قدرة اللع العظيم وسبحان الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144448/http://www.20at.com/article2.php?sid=563"

[[comments]]
order = 1
subject = "يايها الأنسان ما غرك بربك الكريم"
author = "مناضل انترنتى قديم"
posted = "2006-03-13"
text = "سبحان و الحمد لله و الله أكبر<br />سبحان الله خلق الأنسان من نطفة تمنى من شىء صغير لا يرى بالعين المجرده لتعلم ايها الأنسان كم كنت صغيرا فاكرمك الله و هىء لك الأسباب لكى تحى وتكون مكرما متوجا بين مخلوقاته انظروا معى لقوله تعالى فى الحديث القدسى \"يا ابن ادم خلقت الأشياء كلها من أجلك فسر فى طاعتى يطعك كل شىء\" وعلى الرغم من ذلك يفعل الأنسان من الخطايا الكثير و العظيم و منهم من يأخذه الكفر إلى أن يتحدى مولاه و يتخيل أنه بيده ضره و نفعه و تسول له نفسه قتل أخيه الأنسان<br />إليكم يا من تقرؤن كلامى و أذكر نفسى معكم كلنا كنا هكذا فمن الله علينا بأن صرنا رجالا و نساءً و شيوخا و أطفالا الا يستحق منا الملك الحمد و الشكر على هذه النعمه<br />و لتعلم ايها الانسان أنك مهما بلغت من العلم فانك جاهل و لا يأخذك الغرور مهم نجحت و ختاما يقول تعالى<br />يايها الأنسان ما غرك بربك الكريم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144448/http://www.20at.com/article2.php?sid=563"

