[[comments]]
order = 6
subject = "تصحيح"
author = "Dead Man"
posted = "2006-03-14"
text = "ذكر الأستاذ أنيس منصور فى هذا المقال أنه<br />بالرغم من العدد الهائل للحيوانات المنوية<br />لكن واحداً فقط يلتحم ببويضة واحدة، وأحياناً باثنتين وثلاث وأربع<br />ويسمحلى أن أصحح هذه المعلومة فإنه من المستحيل أن يلتحم حيوان منوى واحد بأكثر من بويضة لكن من الممكن أن يلتحم حيوانان منويان ببويضه واحدة لينتج توأم متماثل أو حيوانان منويان ببويضتان كل على حده لينتج توأم متآخى وهذه الحالة الأخيرة تحدث فقط فى حالات نشاط المبيضين أو احدهما لينتج بويضتان فى نفس الدورة<br />حيث أنه من الطبيعى إنتاج بويضة واحدة كل دورة شهرية عند الأنثى إلا فى الحالت السالف ذكرها<br />وهذا من بعض ما درسته فى كلية الطب<br />وأشكركم للقراءة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144448/http://www.20at.com/article2.php?sid=563"
