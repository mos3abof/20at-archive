[[comments]]
order = 8
subject = "محمد البــــــــــــــــــاز"
text = "إلى كل محبى الشيخ محمد جبريل :كان ممكن أقولكم موتوا بغيظكم .. لكن أنا مؤدب ولن أقولها وعن نفسى لن أقول لكم أن ما نشر كان صحيحا .. لكن ممكن أن أحيلكم على :<br />1 - تحقيقات الأمن التى تمت مع الشيخ خلال أسبوعين ، وظهر فيها عدد لا يحصى من النساء اللاتى كن زبائنه فى فنادق القاهرة وبيوتها.<br />2 - محامى الشيخ الذى كان على اتصال دائم بى وتليفونه ***<br />3 - محامى المنقبة الضحية والتى ثبت فيما بعد أنها كانت تجرى وراء مصالحها الشخصية ، وتليفونه ***<br />4 - ومازال لدى العديد من التفاصيل التى لم تنشر بعد لأننى لم أكن أبحث عن الفضائح بقدر ما أعمل على سحق الفاسدين حتى أنظف البلد من الفساد؛ ومن يريد الإطلاع عليها فليراسلنى على malbaz550@hotmail.com أو يكلمنى على ***<br />أما عن الأخ رضا فايز محرر عشرينات المنتسب :فأنصحه أن يلعب مح حد قده .. فالصحافة الحقيقية لها ناسها ياأستاذ .. وأنت لست منهم.<br />وبالنسبة لموقع عشرينات والقائمين عليه:فأتمنى ألا يحذفوا تعليقى وهذا لسبب بسيط أنهم هم الذين ورطوا أنفسهم فى الخوض فى هذا الجدال .. فليتحملوا للنهاية..<br />البـــاز<br />مدير تحرير صوت الأمة<br />*** نعتذر عن حذف أرقام التليفونات التي ذكرها الزميل العزيز أ.محمد الباز لأن هذا ضد سياسة الموقع، والموقع يحتفظ بأرقام الهاتف لمن يريدها"
archived = "2004-11-12"
capture_url = "https://web.archive.org/web/20041112192516/http://www.20at.com:80/article.php?sid=747"

[[comments]]
order = 9
subject = "موقع عشرينات:"
text = "أولاً: لا نملك إلا أن نعبر عن سعادتنا وشكرنا للأستاذ الفاضل محمد الباز على تواصله معنا، وعلى تعليقه على موضوع أثار جدلاً طويلاً في الأوساط الصحفية والدينية على حد السواء في الفترة الأخيرة..<br />ثانياً: لقد قام موقع عشرينات بنشر حوار موضوعي محايد، ينقل وجهة نظر الشيخ محمد جبريل رداً على ما قامت به بعض الصحف من هجوم على شخصه، وكما يلاحظ القراء أن الموضوع لم يذكر أية جريدة قامت بهذا الهجوم، أي أننا لا نعادي تياراً ولا جريدة ولا صحفياً.<br />ثالثاً: لا يجب أن يٌفهم من الحوار الذي أجري مع الشيخ محمد جبريل كان تحيزاً لطرف ضد طرف.<br />رابعاً: موقع \"عشرينات\" دائماً في صف واحد مع كل من يحاول أن يكشف الفساد والفاسدين، فكما يقول المثل: \"كلنا في مركب واحد\".<br />خامساً: ما قام الأستاذ رضا فايز كان – من وجهة نظرنا- كان مهنياً واحترافياً، فبينما انبرت صحف كثيرة في نقل وجهة نظر واحدة تهاجم الشيخ محمد جبريل، قام الأستاذ رضا بتقصي وجهة النظر الأخرى، وهو ما لم تقم به صحف كثيرة، ونحسب أنه \"انفراد صحفي\"، قام به الأستاذ رضا فايز خلال اتصال هاتفي لم تقم به صحف أخرى حاولت الوصول للشيخ لكنه كان يرفض الحديث مؤخراَ، وهذا ما نجح فيه الأستاذ رضا، وهذا هو ما تعلمناه من أساتذة الإعلام والصحافة، من تقصي كل وجهات النظر لكي تصل الحقيقة كاملة للقراء.<br />سادساً: موقع \"عشرينات\" دائماً ما \"تورط\" و\"يورط\" و\"سيورط\" نفسه في أي جدال صحفي، \"بالحسنى وبالتي هي أحسن\"، فكما سبق أن قلنا نحن في صف واحد ضد الفساد والفاسدين، وكما سبق أن قلنا نحن لا نعادي أحداً.<br />سابعاً: بالطبع لم يكن الموقع ليحذف التعليق الذي كتبه الأستاذ العزيز محمد الباز؛ لأننا نفتح الباب أمام الجميع للتعليق، مادام لم يخرج عن الآداب العامة والقواعد الملزمة للحوار بالحسنى..<br />وكل عام وحضرتك بخير يا أستاذ محمد وكل عام وجميع زوار عشرينات بخير وفي أحسن صحة وحال."
archived = "2004-11-12"
capture_url = "https://web.archive.org/web/20041112192516/http://www.20at.com:80/article.php?sid=747"

[[comments]]
order = 10
subject = "عمى محمد يا باز ...... اسمحلى"
text = "ايه يا جدعان الى الواحد بيأراه ده.. عشرينيات بقت شهرتها عالمية بقى محمد الباز بجلالة قدره بيبعت رد على مقال اتنشر فى عشرينيات ايه الحلاوة دى<br />دى مقدمة ادبية كنت بستعرض فيها مهاراتى اللغوية<br />اما بعد ....<br />ايه يا جدعان هى جت على الشيخ محمد جبريل و قفلت متسيبو الراجل يعط زى ماهو عايز ما البلد كلها غرقانه فى العط اشمعنا يعنى الشيخ محمد<br />دى حاجة الحاجة التانية هو حد من الاساس جاب سيرة الجرنال الى اسمه صوت الجماهير و لا مش عارف ابصر ايه ده...ايوه افتكرت صوت الامة...<br />حاجة تانية يا عم محمد يا باز ماله رضا فايز...الواد ده انا معرفوش شخصياً بس اسمع اسمه و شوفته يمكن مرة و لا مرتين ..هو واد مجتهد و مبدع و زى ما بيقولو بيحرق نفسه فى شغله ومع ذلك الى انا اسمعه عنه انه حفى علشان يدخل جريدة ينفع يتقيدمن خلالها فى النقابة الا ان الوضع الصحافى فى مصر زى الزفت لامؤخزة اكمن الواد يا ولداه لاعنده واسطة (فيتامين o ) على رأى الناس هنا فى الاردن و لا عنده اونكل رئيس تحرير ولا مدير تحرير جريدة و لا معاه خمس ست تلاف جنيه يدفعهم لامؤخزة من تحت الترابيزة لأى واحد من بتوع الجرايد اياها علشان يحطه على جداول القيد فى النقابة الى ريحة الفساد فيها لامؤخزة تشمها من على بعد محطتين من مقر النقابة فى الاسعاف يعنى من ميدان التحرير تقريباً ....<br />المهم ...<br />ان اصلاً الكلام الى مكتوب ده لاهو حصل حوار صحفى وضح فيه عمناالشيخ تفاصيل التهمة الى عليه ولا قدر يسبت برأته منها يعنى بقى على رأى ستى ربنا يديها طولت العمر ( زى اكل الحمار فى النجيلة ... لا الحمار شبع ولا النجيلة خلصت ) و الواضح جلياً ان عمنا الاستاز رضا فايز ما كنش معاه فلوس كفايه يكمل بيها الحوار مع الشيخ و دى يسأل فيها حبيبنا بتوع المقع مع انى على حد علمى \" الضئيل \" انهم عالم متريشه اوى و وصلين مع عالم فوق بيدفعو وميهمهمش الفلوس ( بحبحوها شويه ...و الشئ لزوم الشئ ) بح بح<br />المهم ... مبروك للجماعة بتوع عشرينيات و ربنا يديم الشهرة و العز و البحبحة..و عمنا محمد جبريل ده سيدنا و تاج راسنا و كمان عمنا محمد الباز كمان سيدنا و تاج راسنا بس بقوله الواد رضا فايز ده واد مجدع و بتاع شغل لو يخده عنده فى صوت الشعب و لا مش عارف اسم الجريدة بتاعته اسمها ايه هيكسب و الله لأنه واد بجد بتاع شغل و قد الى هو بيكتبه بجد والله ...خده و ينوبك ثواب بحق هذا الشهر الكريم<br />و كل عام و انتم بخير و انا آسف للاطالة بس دول كلمتين كنت مزنوق فيهم و ملقتش غير الموقع \" الواقع \" اللزيز ده اخرجهم فيه ...و سلامو عليكوم"
archived = "2004-11-12"
capture_url = "https://web.archive.org/web/20041112192516/http://www.20at.com:80/article.php?sid=747"

[[comments]]
order = 11
subject = "اه ....يا بلدي"
text = "انا هدخل في الصميم<br />لاهتكلم عن جبريل ولا الأخ كاتب الموضوع ولا الصحفي متخصص في الفضائح<br />انا عندي سؤال تاعبني<br />ليه الحقيقة في بلدنا غايبة<br />ليه على راي احد الكتاب لا حس فيها ولا خبر<br />ليه ماتطلعش السلطة وتتهم الشخص المعنى بالموضوع او اي شخص اتهام مباشر وعلني<br />او حتى لو الشيخ جبريل أخطأ ليه ما يطلعش وويقول بعلو صوته زي ماقال سيدنا موسى عليه السلام<br />لما واجهه فرعون بجريمة القتل اللي ارتكبها<br />فعلتها إذا وانا من الضالين<br />والله انا ما بتهم شيخ جبريل<br />لكن نفسي في الحقيقة بحلوها ومرها<br />والله ياجماعة هتكون بلدنا أحلى كتير<br />وآآآآآآآآآآآآه يابلدي"
archived = "2004-11-12"
capture_url = "https://web.archive.org/web/20041112192516/http://www.20at.com:80/article.php?sid=747"
