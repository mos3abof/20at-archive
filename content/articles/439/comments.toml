text = "واحد ابن ....من المرتزقة<br />مرتزقة الشهرة والصعودوالتسلق على حساب انتهاك الأعراض وفضح الناس بالحق والباطل<br />واحد بروباجنداوي يعني<br />المهم<br />كتب عن الراجل كلام في جورنال سمعته معروفة<br />الكلام في إساءة بالغة لمحمد جبريل<br />وسواء محمد جبريل حلو او وحش<br />لو حلو ربنا يكرمه<br />ولو وحش ربنا يهديه ويغفر له<br />صاحبنا ده ماله بقى ؟؟؟"
