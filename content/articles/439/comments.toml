subject = "الله اكبر ظهر الحق"
text = "الله اكبر بجد<br />شويه الحساله الصحفيه اللى ىبيقطعوا فى فروة الشرفاء ان شاء الله هنشوف فيهم يوم اسود<br />المهم ان الشيخ اسلام فكرى والدكتور محمد عبد الكريم كانوا مكسرين الدنيا السنادى فى عمرو بن العاص<br />انا مستنيك من الوقتى يا شيخ محمد<br />انى احبك فى الله<br />كل اللى يقرأ المقال ده ياخد اللينك ويبعته لاكبر عدد من اصدقاءه واخوانه حتى نقضى على تلك الشائعات<br />القذرره<br />الحمدلله على كل شئ<br />الحمد لله على كل حال<br />الحمد لله رب العالمين"
archived = "2004-11-12"
capture_url = "https://web.archive.org/web/20041112192516/http://www.20at.com:80/article.php?sid=747"

