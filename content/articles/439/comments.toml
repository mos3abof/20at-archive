subject = "شلة قذرة"
text = "يا اخوانا في شلة قذرة ملمومة في صحيفة صفراء قذرة تصدر في امريكا هي عربتايمز هم المتخصصين في التهجم على دعاة الاسلام فهذا النذل اسامة فوزي ومساعده زهير جبر متخصصان في الادعاء الكاذب على الشيخ احمد جبريل وعمرو خالد والقرضاوي والجريدة دي اصبحت عبارة عن غرزة لكل السفلة الذين يريدون الانتقاص من العلماء والدعاة."
