text = "اولا - هذا التقرير اللى متبة يبلة ويشرب ميتة<br />ثانيا - كيف تسمح دولة بتربية خنازير فى وسط البيوت وبين السكان وهل هذا مصرح بة فى امريكا ان يربى الناس الخنازير وسط المساكن وبجوار المدارس وفى وسط الشوارع<br />- اللى عايز يربى الزفت الخنازير يربيهم بعيدا عن الكتل السكنية ويأكلهم اعلاف مش زبالة وقرف فى مزارع داخل حدود واسوار بعيدا عن السكان مثلما هو متبع مع مزارع الدواجن<br />ان مربى الخنازير ليسوا من تلك المناطق العشوائية بل قادمون من الصعيد وهاربون من احكام ويشتغلون بالدعارة وتوزيع البانجو<br />ان اى تقرير من اى صحيفة امريكية لا يهمنا فى شىء واذا لم تقتل الحكومة الخنازير فالشعب سوف يضع لها السم فى الزبالة ليقتلها"
archived = "2009-05-22"
