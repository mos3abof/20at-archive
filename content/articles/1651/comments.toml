[[comments]]
order = 1
subject = "الحقيقة عندى"
author = "فارس العرب"
posted = "2006-09-19"
text = "اولا انا هتكلم على العمل الارهابى اللى واحد مسلم عملة لكن يا ريت تسمعونى للاخر الحكاية دى فى العراق ايى الموضوع اسمع يا سيدى واحكم مين الارهابى ومين المجنى علية الحكاية تبدا كالاتى يذهب مواطن عراقى الى اى مكان فيفاجا بدورية امريكية فيتفتش تفتيش ذاتى خد بالم من ذاتى دى المهم يسالوا ان رايح فين يقول اللى يقولوا يهددوا انهم هيسجنوة بتهمة الاشتباة طبعا الرجل يخاف ثم يخيروا بان يوصل لهم شى فى مكان ما بالسيارة تحت حجة بانى عراقى ولن يتعرض بسوء وطبعا مع وع با ن يتركة لحالة فيفرح الرجب طبعا لا زم يفرح يعنى ابو غريب ولا المشوار اكيد المشوار من عارف اية اللى بيحصل فى ابو غريب من المسيحة الامريكان اللى مؤمنين بالمسيح على حسب كلامهم المهم يكون فى السيارة قنبلة مخباة وطبعا الرجل لا يعلم ويعطونة جهز لاسلكى واول ما يوص الكان المنشود وهذا المكان لا يكون طبع فى صحرا بل فى اى تجمع والسلام سوق مكان الشرطة المهم اكتر من 100روح تروح وفعلا هو يقولهم انا وصلت وهما من الجهاز من على بعد اضغط على الز وراح وضيع معاة اى رقم من اللى انت بتشوفة فى اسفل الشاشة وفى ىالاخر يقولك انتحارى اولا مفيش انتحارى مسلم والمسلم لو هيموت نفسة يبقى فى وسط اعداء اللة مش مسلمين زية لكن دة تفكير من يدعوا الديمقراطية وماذا تنتظر من ناس قالوا الله لة ابن بالله عليك ماذا تنتضر منم ولكن الشى الذى لا يعلمون بانهم اصحاب النار خالدين فيها ابدا ان شاء اللة الا من تاب وعمل صالحا فكيف تغتصب رجل مثلك اهذة اهانة كيف تسمح بان تفعل اشسائ كهذا الا لو كنت لا تؤمن بش ولكن نحن نحتسب امرنا عند الخالق الجبار الله سبحانة وتعالى بان النصر قادم قادة واما كل من لا يؤمن باللة ويقول علية ما لا يعلم فانى اشفقعلية فكم سيعيش 100سنة وبعد لا شى سوى عذاب اللى والحمند للة اننا مسلمين"
archived = "2006-11-02"
