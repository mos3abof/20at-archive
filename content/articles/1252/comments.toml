subject = "الشعب واستيعاب المرحله"
author = "نذير الجلاوي"
posted = "2006-01-21"
text = "المشكله هنا ان العراق الجديد الديمقراطي الحر يريد ان تكون المحاكمه شفافه وذات معايير دوليه وليس معايير عربيه فاشله كما في محاكمة ايمن نور مثلا الذي لم نشاهد ولو جلسه واحده من محاكمته ولكن هذه المعايير الدوليه والتي يتحدث عنها الدليمي المحامي الذي يريد امكار المأسي التي عاناها الشعب العراقي من صدام وازلامه وهنا المشكله اخلاقيه لان الضحايا غالبيتهم من الشيعه والاكراد الذين لا يعنون شيئا للدليمي لانهم ليسو دليم او؟؟؟؟؟؟؟ على العموم فان غالبية الشعب العراقي لا يستوعب الاسلوب الاخلاقي العالي الذي يتمتع به القاضي امين مع مجرم كانت اطول محاكمه في عهده لا تتعدى الدقائق فلم يستطع القاضي عند ذلك الموازنه بين المعايير الدوليه وبين ما عاناه الشعب من الطاغيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141410/http://www.20at.com/article2.php?sid=259"

