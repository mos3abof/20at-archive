text = "ان هذا المحكمة محكمة حضارية و متقدمة بالنسبة للمحاكم التي يديرها النظام الدكتاتوري الصدامي لان في وقت النظام ليس لاحد في العراق حق التكلم و الدفاع عن النفس حتى لو انة برىْ وبعد سقوط صنم الدكتاتورية ونرى في محاكمة الطغاة ثقافة المجرم صدام و بارزان و اخرون من المجرمين كيف يستفزون القاضي والمحكمة وانا باقتقادي ان يدخل صدام و جلاوزتة فى قفص ويجولون في العراق من كوردستان حتى الفاووكل من يتف على وجه بالف دينار لكي يتعوض عوائل الشهداء واعمار العراق وهذا اقل شى يستحق الدكتاتور صدام<br />*** ملاحظة *** صدام اهانة العرب والعراقيين وهو ليس من العرب الشرفاء<br />مع التحيات<br />** القاضي له الحق في ضبظ المحكمة"
