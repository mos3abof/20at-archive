text = "بسم الله الرحمن الرحيم<br />لبنان فلسطين عراق أفغان.....<br />ـــــــــــــــــــــــــــ<br />دماء المسلمين في ساحة تجري...<br />قنابل صهيون لا ترحم أطفال...<br />خطاب الساسة يسجع ذباح الجسور...<br />مساجد وكنائس بيروت تهديم.......<br />أطفال لبنان وفلسطين تحصدهم حصاد...<br />عوائل في بيوت تحت الأنقاد تدمير...<br />هذه آلة التدمير قادرة على التقتيل...<br />أوقفوا حرب الإبادة على لبنان وفلسطين....<br />لا ........<br />تأييد واشنطن للجزار جنون مجنون....<br />سفاح الدماء في عراق وفلسطين......<br />لبنان والشرق الأوسط الجديد......<br />حقيبة في داخلها إحتلال وتقسيم....<br />حمات الإحتلال في بيت العرب.....<br />فتحوا له النوافذ والأبواب....<br />بيروت اليوم في ساحة الدمار....<br />صيداوالبقاع وجنوب لبنان.....<br />أين الأمة من لبنان وفلسطين بغداد......؟؟؟<br />طريق إلى الزوال من خارطة البلدان....<br />شعوب العالم تنادي أوقفوا الدمار....<br />شعوب الأمة تقفل عليها الأبواب......<br />أين الأمة من دمار لبنان.........؟؟؟<br />أين الأمة من غزة وبغداد.......؟؟؟<br />صباح الخير يالبنان.......<br />صباح ليس فيه إنسان.....<br />ممنوع من جرعة الماء والدواء....<br />مساء الخير ياؤمة .........<br />تنادي من تحت الأنقاد......<br />صور والطريق خطر الوصول...<br />أطفال العرب والمسلمين قتلهم مباح...<br />شيوخ قتلهم مستباح.......<br />نساؤهم وبناتهم تقاوم السفاح.....<br />عن ساحة لبنان لا تتكلموا......<br />عن فلسطين لا تتكلموا......<br />عن عراق لا تتكلموا.......<br />عن أفغانستان لا تتكلموا....<br />عن الشيشان لا تتكلموا....<br />عن القدس لا تتكلموا......<br />عن إغونتانانمو لا تتكلموا....<br />عن ابو غريب لا تتكلموا.......<br />عن بوكا لا تتكلموا..........<br />عن صدام حسين ممنوع الكلام.....<br />عن سجناء فلسطين لا تتكلموا...<br />عن وزراء حماس ممنوع الكلام...<br />عن الإسلام لا تتكلموا......<br />عندنا مشروع جديد .......<br />إنتظروا حتى ينتهي الدمار في لبنان....؟؟<br />تعالوا عندنا لتصفية المقاومة اللبنانية...؟<br />في فلسطين أوقفوا المقاومة.......<br />في العراق أوقفوا المقاومة......<br />إمنعوا الإحتجاجات في عواصمكم...<br />نحن ندرس الشرق الأوسط الجديد....<br />أصدقاء صهيون يرسلون له رسائل تأييد...<br />أعداء حزب الله يرسلون له تهديد...<br />أعداء الأمة يطعنونها من الداخل عبيد...<br />لبنان لبنان لبنان .................<br />فلسطين فلسطين فلسطين...................<br />عراق عراق عراق......................<br />قدس قدس قدس .......................<br />الأمة الإسلامية والعربية هوى سقفها.....<br />الأمة العربية تدمير بيتها.............<br />الله الله الله.............<br />الله الله الله.............<br />لا الاه الا الله محمد رسول الله .<br />لن تقلعوها من قلب هذه الأمة....<br />الإسلام جمع الأمة........<br />الإسلام إحفظ حقوق اهل الدار حربا وسلما...<br />لا تتركوا حزب الله في لبنان......<br />لا تمنعوا المقاومة في فلسطين تحمي القدس والأمة...<br />23.07.2006<br />أحمد الجيدي<br />مرتيل<br />نقلت الى المستشفى اليوم، سلامتك يابطل . وحفظك الله من كل مكروه، فالله معك،حفظك ويرعاك... واللعنة للعملاء والغازي المحتل،والعملاء من العرب الذين هيئوا للإحتلال الأمريكي الأرضية."
