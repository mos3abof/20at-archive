text = "البيت الأبيض يندر سوريا ؟ ويطلب منها الضغط على المقاومة اللبنانية،؟ ويدعم القصف الصهيوني لقرى ومدن لبنان؟؟؟؟؟؟المثل العامي يقول( ضربونا وابكاوا سبقونا واشكاوا)....<br />ــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــــ<br />الضغوط الأمريكية لم تترك سوريا ولو من روسيا اليوم:15.07.2006فبوش يوجه تحذيرا الى سوريا من المؤتمر الثمانية، ويحثها على الضغط على حزب الله لوقف إطلاق الصواريخ على مواقع الإحتلال الصهيوني، والبيت الأبيض لا يستبعد إستهداف سوريا من قبل الكيان الصهيوني، إلى متى يبقى الإحتلال الصهيوني في الأرض الفلسطينية والعربية،؟ وهل يريد بوش والصهاينة نزع حزب سلاح حزب الله في لبنان، حتى تبقى القوة المهيمنة الوحيدة في المنطقة،؟ إلا أن هذا الحلم الذي يرغب فيه بوش،لن يكن ، ولن يسمح للعدو ان يتجبر ، وإن كان قد جرب الضغط على الفلسطنيين بتسخيره مصر والأردن للقيام بهذه العملية الدنيئة لنزع سلاح المقاومة الفلسطينية ،فإن سوريا ليس لها نفس التوجه، فهي أراضيها لا زالت محتلة من قبل الصهاينة،ب(الجولان) وحزب الله ليس لأحد له يد عليه، فهو سيد نفسه، وهو إختار المقاومة ليس إختيارا، بل فرضت عليه من المحتل، لأن أرض لبنان يجب أن تحرر من يد العدو، وإن كان حزب الله معتدي على المحتل الصهيوني، كما قالت بعص العواصم العربية، والدروز وسعد الحرير، لأن الصهاينة يفرحون عندما يسمعون التصريحات من قبل أذناب واشنطن والصهاينة، لأن واشنطن إستعملتهم في إحتلال العراق كواجهة لتبرير إحتلالها للعراق،... وتستعملهم الآن ضد لبنان حتى يكونون لسانها لإضعاف الجبهة اللبنانية المرابطة على الخط، والحادثة التي حدثت في مجلس الأمن قبل ثلاثة أيام، عندما رفعت السيف المسلط على المسلمين والعرب (الفيتو) حتى لا يدان الكيان الصهيوني ، إلا أن الفيتو الأمريكي قد غرق في البحر، أمس، فجاءت المعادلة مخيبة للأمل الأمريكي والصهيوني عندما خرجت الصواريخ من يد المقاومة اللبنانية، لتقول للفيتو الأمريكي سنغير اللعبة في الساحة، وعليك ان تعرف أن العملاء الذي تعتمد عليهم في المنطقة أصبحوا مكشوفين ، ووجهوههم بليت كما بلي البيت الأبيض، لأن أطفالنا لم يعبؤوا بالصواريخ والطائرات الحربية والبواريج البحرية والمدافع والصواريخ التي تقصف الأطفال الأبرياء في فلسطين والعراق وأفغانستان لايخشونها اليوم، لأن السلاح الصهيوني الذي يقصف به لبنان اليوم هو سلاح أمريريكي، ففكروا في البقاء في اماكنهم معتمدين على السلاح التقليدي الذي أصاب البارجة البحرية الأمريكية التي تقتل المدنيين ، والتي رفض القوة الدولية حمايتهم من القصف الصهيوني، لأنها هي موجودة في لبنان لحماية الإحتلال الصهيوني ، فترعض المدنيون للقصف الصهيوني وهم في طريقهم الى مدينة صورأمام القوة الدولية، لأن ساعات الإنتظار التي أعطت للمواطنين اللبنانيين عندما طلبوا حمايتهم من الصهاينة ، فكان ردها يساند الإحتلال الصهيوني، لأن الصهاينة والبيت الأبيض لن يسمحوا لنا بإستقبالكم،وكأنهاتقول : للعالم نحن هنا للدفاع عن الإجرام الصهيوني ، أين العملاء من هذه المجزرة ،؟ الذين ننددوا بحزب الله ،؟ فلن يستطيعوا التنديد بالكيان الصهيوني في هذه المجزرة 23مدنياأحرقوا بالقنابل الصهيونية، فالقوة الدولية هي التي عرضتهم للقتل حسب العرف الدولي، وهي التي تتحمل المسؤولية الكاملة جراء رفضها اللا مبرر، وهذا يذكر المسلمين بما وقع في البسنة والهرسك وكوسوفو، لأن بعض القوة الدولية ساهمت في المقابر الجماعية الذي نفذتها القوة الصربية،....<br />وقد سبق للقدس العربي أن تنبأت في مقال لها نشر بالمنبر الحر أن 2006ستكون حربا طاحنة من النهر الى النهر، لأن الحرب الدائرة اليوم بين القوة العظمى (الأمريكية) وهي القوة الرابعة في العالم( الصهيونية) فتحت النار على المنطقة قد تكون نوات لحرب عالمية الرابعة، لأن الحرب العالمية الثالثة كانت على العراق بفيادة البيت الأبيض،ولن تتخلص من تبعاتها ، فهي وجدت الرفض المطلق من قبل الشعب العراقي، رغم مساندة العملاء الذين يذبحون الشعب العراقي ويرمونه في الشوارع العراقية، ....<br />والتي رفضت المشاركة في هذه الحرب هي سوريا، وبما انها خرجت من المثلث العربي في المنطقة، لا زالت الضغوط العربية المساندة في تلك الحرب ، قلقة من سوريا، فهم يبحثون من ذريعة لتوريط سوريا في ذبح الشعب اللبناني على يد الصهاينة وتأليب المعارضة السورية في الخارج لوجود مسلك للإنقضاض عليها، الا سوريا قد تعي الدرس مما جرى على يد الوسطاء والعملاء للعراق، فهي بقيت وحدها ، وإشعال الحرب في لبنان إنما هو تدبير أمريكي صهيوني بتمويل من نفط العرب في المنطقة، لأن سعر البرميل وصل الى 78 دولار، لأن النقط لم يق التحكم فيه (لأوبيك) في السوق الدولية، بل في يد البيت الأبيض،...<br />فبوش يحدر سوريا ويغط عليها للضغط على المقاومة اللبنانية بالتوقف عن إرسال (الكتيوشا) على المستعمرات الصهيونية،في المقابل يدعم القصف الصهيوني للبنان، وان الصهاينة في تل ابيب يحق لهم الدفاع عن أنفسهم،....<br />15.07.2006<br />أحمد الجيدي"
