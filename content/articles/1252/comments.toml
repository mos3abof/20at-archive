subject = "المدعي العام العميل للشيطان"
author = "احمد الجيدي"
posted = "2006-06-24"
text = "الجيدي | المغرب | 22/06/22م | 11:37 | مراسلة صاحب التعليق<br />189 - المدعي العام يؤيد إغتيال الأستاذ: خميس العبيدي . على يد عملاء الإحتلال ....... أحمد الجيدي... |21/06/2006 م، 10:16 مساء (السـعودية) 07:16 مساء (جرينيتش) ــــــــــــــــــــــــــــــــ إن إستهداف الأحرار في العراق ، هو شيئ أصبح معتادا ، والرجل الذي لم يرضى أن يكون صنيع العملاء والإحتلال الأمريكي والبريطاني للعراق، لأن الشرفاء في نظر العملاء هم إرهابيون، والمحكمة التي تسير من قبل الصهيونية ، لم تلقي أي إهتمام للإستشهاد الأستاذ<br />خميس العبيدي) اليوم واثناء مقابلة التي أجريت مع المدعي العام من قبل إذاعة ال: بي بي سي.العربية (لندن)...الموسوي.1 الناطق باسم الإحتلال ، وعندما طرح عليه سؤالا من قبل الصحفي في ال:بي بي سي. حول إجراء التحقيق في ملاباسات إغتيال النائب في هيئة الدفاع عن السيد: الرئيس العارقي ورفاقه. فكان جواب المدعي العام ، سخيفا جدا، لأن سيده لم يكلفه بهذه المهمة، وقال<br />أنه ليس من إختصاصه التحقيق في وفاته)..وحول توفير الحماية لهيئة الدفاع، وخاصة خميس العبيدي. الذي رفض الإقامة في المنطقة الخضراء ، مع العملاء والإحتلال، ورفض أيضا : الإقامة في الأردن، البوابة التي دخل منها الإحتلال، وفضل البقاء مع أولاده في العراق، ومع الشعب العراقي، لأن البقاء في العراق بالنسبة له تعني الشيئ الكثير، والتجربة الفلسطينية لها وقع على الوضع العربي، عندما فضلوا الخروج من فلسطين الى دول عربية وإسلامية وأوروبية ...الخ . والرجل ليس من طينة المرتزقة ، ولا من طينة العملاء للإحتلال الذين جاءوا على دبابة النازية الأمريكية، فهو مواطن له هويته العراقية والعربية ، وله نظرة تختلف عن نظرة العملاء، لأن الذين يتركون الوطن للعملاء والإحتلال خوفا من ظلمهما، تعني شيئا بسيطا، نخرج من وضع القهر الذي سلط علينا بسبب الخونة والعملاء، و نبلغ موقفنا الرافض للإحتلال من الخارج، بعيدين عن الظلم والقهر داخل الوطن، هذا رأي البعض... الا أن المجاهد ، خميس العبيدي (رحمه الله ) له رأي مغاير لهذا الرأي، إذا تركنا الوطن للعملاء والإحتلال ، فوضعنا سيكون كوضع الفلسطنيين، نقاوم الإحتلال والعملاء من الداخل بوسائلنا الخاصة، وإذا كتب لنا الحياة فسنكون قد ادينا واجبنا الوطني والديني. وإذا كتبت لنا الشهادة على أرض العراق، قد نكون دافعنا عن الوطن بدمائنا ومالنا ، ودافعنا عن الكرامة الوطنية التي ينتهكها العملاء والإحتلال البغيض.لأن الهوية الوطنية لا يحس بها سوى الشرفاء، ولا يقبلون بإي إغراء يقدم من طرف الإحتلال والعملاء. وهو التبرير الذي قدمه المدعي العام الى الإذاعة البريطانية، ال: بي بي سي.عندما قال: (هو الذي يتحمل المسؤولية وحده ، لأنه لم يقبل السكن في المنطقة الخضراء، ولم يقبل الخروج الى الأردن ليعيش هناك) بتصرف.إذا كان المدعي العام لا يملك الحديث عن جريمة إغتيال الأستاذ . خميس البعبيدي، وهو يمثل المحكمة الخاصة الجنائية، المصنوعة من قبل الإحتلال، هذا يعني أنه مصنوع فيها لتنفيذ أهداف الإحتلال الإمريكي البريطاني،فهو بوق للإحتلال، لأن المواطنة شيئ أكبر من الجلوس على كرسي مصنوع من خيانة الوطن ودماء الأمة، وهي مشاركة في الخيانة الوطنية وهي بالفعل، وكأنه أجاب الصحفي بطريقة غير مباشرة، نحن في المحكمة خدام الإحتلال، ساعدناه في الدخول لتمزيق العراق ، ولا زلنا نساعده على جرائمه التي يرتكبها كل يوم مقابل الخيانة الوطنية، وجزاؤنا هي بعض الدولارات التي يسرقها الإحتلال من عائدات البترول العراقي الذي ينهب من قبل الحكومة التي صنعها الإحتلال، والذين يعارضون سياسة العملاء والإحتلال تتكفل بتصفيتهم وزارة الدفاع والداخلية ،واغتيال :خميس العبيدي داخل في الخطة الجديدة التي هيئ لها ،40.000من الدروع البشرية، لتنفيذ الجرائم الكبرى كهذه، وهذا هو المحامي الثالث الذي يغتال على يد عصابة العملاء، من هيئة الدفاع عن الرئيس العراقي السيد:صدام حسين ورفاقه،وعندما إختطف جنديين من جنود الإحتلال على يد المقاومة العراقية، حضر الإحتلال الى العراق ليعطي إلإنطلاقة الجديدة للمقابر الجماعية في العراق،بعدها صرح المدعي العام في الجلسة أثناء ترافعه وطالب بإنزال عقوبة الإعدام في حق الرئيس العراقي وأخيه ونائبه، لأنه أبلغ التوصية التي قدمها له المحتل الأمريكي، وما هي الا محاولة منه للتأثير على شوكة المقاومة العراقية الشريفة، ثم التخطيط لتصفية هيئة الدفاع التي تقاوم الظلم الأمريكي والبريطاني بالعراق،وإن دل تصريح المدعي العام اليوم عن شيئ ، فإنما يدل على عدائه للعراقيين الشرفاء الذين يقاومون الإحتلال والعملاء والخونة، رحم الله الأستاذ : خميس العبيدي ورحم الله شهداء المقاومة العراقية المجاهدة في سبيل الله...والسلام 21.06..2006 أحمد الجيدي مرتيل.. --------------------------------------------------------------------------------"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141410/http://www.20at.com/article2.php?sid=259"

[[comments]]
order = 5
subject = "العملاء والإحتلال خرجوا عن النروؤة العامة في العراق وأفغانستان.وبفعلهم"
author = "أحمد الجيدي"
posted = "2006-07-09"
text = "العملاء والإحتلال خرجوا عن المروؤة والإخلاق العامةفي كل من العراق وأفغانستان، وبفعلهم هذا يردون كسر شوكة المقاومة الشرعية، لأنهما لاشرعية لهما؟<br />إن الحادثة التي كشف عنها في العراق الجريح، ليست الأولى وليست الأحيرة، بل عدة جرائم من هذا النوع، لأن العراق أستبيحت من قبل العملاء والنازية الأمريكية والبريطانية، وسجن أبو اغريب.وبوكا...الخ وإجتياح الفلوجة وتلعفر والأنبار وسمراء ودهاليز وزارة الداخلية والدفاع حدث فيهم ما لايتصوره العقل، لأن العملاء الذين أدخلوا للعراق مع الغزو النازي واللصوص الذين أستقدموالها من شتات المنطقة وخاصة من الدول الذي مولت الغزو الصليبي الأمريكي البريطاني شحنوامن قبل الصليبيين والعملاء للنيل من شرف الأمة، ولم يفرقوا بين الصالح والطالح، فهم بفعلهم هذافي الفتات التي خرج الجرم الشنيع بالصدفة، لأن الذين أعلموا بالجريمة حضروا على نبأ أن إرهابيين دخلوا منزلا وقتلوا من فيه؟ فوجدواعكس ما تقوله الحكومة العميلة للصهيونية في وسائل الإعلام،فانكشفت الجريمة،جنود الإحتلال هم الإرهابيون بتواطئ مع العملاء، وهذا يذكر الرأي العام بالتفجيرات التي تحدث بالمساجد والمراقدبالعراق ينفذها العملاء والموساد وجنود الإحتلال وهذا ما كشف عنه في الكوفة في تاريخ سابق، الموساد البريطاني بعمامة كوفية يندسون في وسط الأمة وينفذون الجرائم الكبرى للنيل من شرف الأمة، وسكت عنها الجميع، حتى السياسيون الذين يمجدون الإحتلال ويسمونه بالقوة المتعددة الجنسيات، وهو أسلوب العمالة الدنيئة والخسيسة،لأن المقاومة الباسلة بالعراق لن ولن تنجر الى هذا الأسلوب المنحط أخلاقيا وإجتماعيا،فيما الحكومة العميلة تتعمد هذا الأسلوب لكسر شوكة الشعب العراقي المناهض للعملاء والإحتلال. لأن العملاء والإحتلال أقدموا على الأسلوب لفرض نفسهم بالقوة، الا أنهم لم يجيدواآذانا صاغية لكذبهم،اللهم أنصر المجاهدين في أرض العراق، لأنهم هم الذين يمثلون الشرعية على أرض الرافدين، والشرعية والسيادة في سجن الإحتلال .والباقي إما عميل أو منافق، أو صعلوك، يرون المنكرويصفقون للإحتلال النازي... والسلام<br />أحمد الجيدي - المغرب"
