subject = "الإنتصار التاريخي؟؟؟"
author = "أحمد الجيدي"
posted = "2006-08-22"
text = "سيدي أن الإنتصارات للكيان الصهيوني عبر التاريخ لم يكن بقدرتها العسكرية وترسانتهاالضخمة،فهي في المواجهة الأخيرة إعتمدت في إستراتجيتهاالحربيةللقيام بالعدوان على لبنان،على شيئين،<br />الأول:على تجربتها على الشعب الفلسطيني، فهي ترتكب المجازر في كل ضاحية، وتغتال الكوادر الفلسطينية المناهضية للإحتلال الصهيوني، وتختطف من تشاءوفي أي لحظة شاءت، لأن المقاومة الفسطينية مكبلة بالوساطات العربية، ومخترقة من قبل العملاء، ؟<br />وضعف آلة الردع لدى المقاومة الفلسطينية،لأنها جنحت للهدنة المجانية، مما أعطى للصهاينة التمادي للتطاول على المجلس التشريعي ، والوزراء في السلطة الفلسطينية التي تحاصرها الأنظمة الإقليمية،كما يحاصرها مجلس الأمن والأمم المتحدة،لأن الديموقراطية خرجت بدون إذن البيت الأبيض الذي يحاصر الشعب الفلسطيني، ويزكي الجرائم الصهيونية،<br />فظنت أن الترسانة التي وضعتها في لبنان للقيام بهذه الأدوار الدنيئة ستحقق لها الغظاءالميداني في الجنوب اللبناني،فهذا المخطط تم إفشاله كليابلبنان، وهذا مما صعب المأمورية للكيان الصهيوني لتحقيق إنجاز ما على الأرض، وعندما فشلت العملية الأولى، أصابه الدوران، فاعتمد على قصف المدنيين بعشوائية، وهذا الدمار الواسع التي إستوقف عنده مليا كل الزائرين للضاحية اللبنانيةبالجنوب، الكل بقي مذهولا للعقلية الهمجية الصهيونيةوقدرتها على إرتكاب المجازر في حق الأبرياء، ولم يبارك هذه الجرائم أحدفي العالم سوى الذين يزودون الصهاينة بالسلاح والقنابل العنقودية،وصدروا القرار المشهور،أما الذين أعطوا الغطاء للعدوان الصهيوني على لبنانوجوههم تلونت ولسانهم خرس، وبدأوا يتجرعون مرارة الهزيمة السياسية والأخلاقية،لأن التجاريب التاريخية علمتهم الإذلال، لأن الفين وثلاثةقال لهم الرئيس العراقي السيد: (صدام حسين) لا أطلب منكم شيئا سوى أن تسدوا أفواهكم وحدودكم، ففعلوا الضد،والشيخ( حسن نصر الله) قال في هذه المعركة نفس التوجيه لهؤلاء، فلم يفعلوا؟الخ<br />الثاني: وأنت مطلع على الأحداث ومجريات الأدوارفي المنطقة الشرق الأوسطية،الإنتصارات التي حققها الكيان الصهيوني كلها لها تاريخ أسود بالنسبة للسياسة الداخلية لدول المحور،وبدون إعتاد الكيان الصهيوني على الرؤوس الغليضة في قلب الهرم السياسي التي لاتعرف الوطن ولا سيادة الوطن، تبيع المقابلة النهائية، أو تبيع (لماش )في المربع لاأقول الذهبي بل في المربع السيادي للأمةمقابل دولارات أو الجنسيةالأمريكيةكما حصل في العراق الفين وثلاثة.....<br />22.08.2006<br />أحمد الجيدي"
