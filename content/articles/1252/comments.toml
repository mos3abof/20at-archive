subject = "الخارجية الأمريكية قادمة للشرق الأوسط بأجندة صهيونية"
author = "أحمد الجيدي"
posted = "2006-07-22"
text = "11:36 الآحد 23 يوليو 2006<br />أرسل لصديق نسخه للطباعه<br />احمد الجيدي - المغرب<br />الخارجية الأمريكية قادمة للشرق الأوسط بأجندة صهيونية<br />أصدقاء صهيون يستعدون هذه الأيام لإستقبال (كونديليز رايس)...التي تعقدت عليهم كل أمالها لإلحاق الهزيمة بالمقاومة اللبنانية المرابطة في الجنوب اللبناني، لأن الأجندة التي ستحملها في حقيبتها للمنطقة الملتهبة اليوم ، بعدما فشلت القوة الصهيونية وعملائها منع (الكتيوشا)من الوصول الى مدينة حيفا الفلسطينية. المحتلة، والخريطة التي تتجول فيها .مصر .الأردن. السعودية. وهذه هي الدول المعول عليهامن قبل الإدارة الإمريكية أن تساعدها لنزع سلاح حزب الله وحماس بالقوة، إلا أن حسن نصر الله إستبق الزيارة وحدد الخطوط العريضة في حواره أمس.والتي أذاعته قناة الجزيرة، فعن العرب، قال: (...إنسنا)..لأن العرب كانوا في موقفهم إتجاه حزب الله قاسيا جدا،لأنهم وضعوا وزنهم في كفة الحزار، كما فعلوا مع حكومة حماس،....<br />ثم إن الإدارة الأمريكية جربت هؤلاء في غزو العراق، فاستجابوا لها، وجربتهم في القبص على الرئيس العراقي السيد: (صدام حسين) فسخروا كل وسائلهم لتحقيق هذاالإنجاز، ثم تعقب المقاومة العراقية،حتى إنتهى بهم المطاف لبيع الشيخ الزرقاوي ب:500 مليون حسب التعليقات الصحفية الدولية الآنيةأنذاك. فاحتفلوا بالإنجازات التي يعتبرونها إنتصارا، وهلل الجميع في المنطقة، لهذا الإنجاز؟؟<br />ثم جاء الآن حزب الله في لبنان،فالتصريحات التي صدرت من العواصم الثلاثة كلها حملت حزب الله المسؤولية الكاملة فيما حدث، وكأن حزب الله هو الذي قصف الصهاينة بالطائرات الأمريكية المدنيين، وهذا يجعل الزيارة قد تنحوامنحى آخر، والإتصالات ستكون سرية بين رايس وعواصم الدول التي حددتها، لأن الزيارة تقدمت عن موعدها، وتم الإسراع بتحرك أمريكي في المنطقة التي تحارب فيها الإرهاب، لأن موازين القوى في ساحة المعركةفي لبنان، وإن كانت غير متكافئة، الا انها قلبت الموازين على الأرض،فعندما كان الصهاينة يدمرون بيوت المدنيين في لبنان دون تمييزفي الأهداف التي تدمر، وسد كل المنافيذ البرية والبحرية والجوية، الإدارة الأمريكية قالت: لانستعجل الزيارةللمنطقة حتى تحقق الترسانة الصهيونية أهدافهابلبنان، والكل سكت على جرائم صهيون في لبنان، وحتى النداءات التي نادت بوقف إطلاق النار، او إستعمال القوة المفرطة في الهجوم على لبنان، رفضها البيت الأبيض، والإحتلال الصهيوني،وفشل مجلس الأمن في إتخاذ قرار يدين الصهاينة على تهورهم في الهجوم في على لبنان، واستطاع أن يدين المقاومة اللبنانية جزافا، لأن مجلس الأمن يدين المقاومة الفلسطينية، ولم يدن الكيان الصهيوني على جرائمه في فلسطين، لأن مجلس الأمن يخدم الإحتلال الصهيوني في المنطقة، وحتى مقاطعة حكومة حماس المنتخبة، رفض الإتصال بها إرضاءا للكيان الصهيوني.<br />فبعدأن إهتزت المستعمرات الصهيونية بالكتيوشا، في فلسطين، ولم تستطع الترسانة العسكرية الصهيونية توقيفهاخلال 11 يوما من المنازلة الجوية، وفيها التفوق الجوي للكيان الصهيوني، والمناوشات البرية في الجنوب بين المقاومة اللبنانية، والترسانة الصهيونية البرية، والتي إعترف الكيان الصهيوني بها كقوة ذات كفاءة.<br />وامام تزايد تدارك الكتيوشا بعضها ببعض على المستعمرات الصهيونية بفلسطين، من قبل المقاومة اللبنانية، ولم يستطع الكيان الصهيوني السيطرة على لبنان من الجو، والدمار الهائل الذي احدثه في البنية التحية في لبنان، جعل البيت الأبيض يقلص من الفترة الزمنية لزيارة المنطقة للإتصال بأصدقائه التقليديين الذين تعامل معهم في إحتلال العراق، الحدود: فتحت جوا وبرا وبحرا، بتعاون العملاء من الداخل العراقي، الذين يقتلون الشعب العراقي حاليا، ويسرقون النقط العراقي. إلا أن هذا لم يحدث في 11 يوما من الهجوم الصهيوني على لبنان، حس الكيان الصهيوني بالقرب من الإنهيار الداخلي، سياسيا، لأنه لم يستشر الصهاينة في المستعمرات الصهيونية بفلسطين، والمعركة ستطول مع المقاومة في لبنان، وهزيمته حتميةعلى يد المقاومة.<br />فققر البيت الأبيض التحرك في المنطقة لإنقاد الصهاينة من الغرق، لأن تل أبيب في مرمى الكاتيوشا في أي لحظة، وإن كان وجه البيت الأبيض منبوذا من قبل الشعوب العربية والإسلامية، ومقبولاعند الساسة الذين دخلوا معه العراق،.. فهل سيدخلون معه لبنان تحت العلم الصهيوني لنزع سلاح حزب الله؟<br />احمد الجيدي - المغرب<br />تاريخ الماده:- 2006-07-22"
