subject = "بكاءالسنيورا مرتين،،،؟؟"
author = "أحمد الجيدي"
posted = "2006-08-07"
text = "الإسم : أحمد الجيدي<br />البريد الإلكتروني : eljaidi1@yahoo.com<br />الدولة / المدينة : المملكة المغربية<br />عنوان التعليق : السنيور ا بكى مرتين ، هل للضعف العربي الذي هو متواجد في القاعة’؟ أم للطعنة الأولى؟؟<br />التعليق :<br />لا تستغرب؟لأن المجتمعين اليوم، لاحول لهم ولا قوة؟لأن الزمام العربي والإسلامي في يد الصهاينة؟ وإن كان لهم موقف لما إنتظروا 26 يوما من التقتيل والتهجير والتدمير؟ ولم يفيقوا من التنويم المغتطيسي، إلآ بعد رأوا حزب الله في لبنان يقف وقفة لم يسبق لهم أن حلموا بها،فخافوا على أنفسهم من التأنيب الأمريكي والبريطاني والصهيوني،فحرب الستت أيام في القاموس السياسي العربي بجنوده وعتاده سحقت في ضرف وجيز،ولا زالوا يرددون لا قبل لنا بالحرب مع الصهاينة..... هكذا رددوا في إحتلال العراق؟ فوقعت الكارثة.لأن حزب الله في لبنان إستطاع خلال 26 يوما أن يوقف المد الصهيوني العسكري على لبنان، وحاول إعادة الثقة في النفس للشعوب العربية والإسلاميةالتي أحبطت من تصريحات بعض المتخاذلين في بداية المواجهة المباركة، ؟ فهذا لم يثني المقاومة اللبنانية عن المواجهة نظرا لجبروت الترسانة الصهيونية الأمريكية لدى الإحتلال الصهيوني والغطاء الأمريكي والعربي، لما ذا سحب اليمن دعوته بعد إجتماع الأول في الجامعة العربية لعقد قمة عربية طارئة؟؟ هل كان لإعطاء فرصة للإنقضاض على المقاومة اللبنانية من قبل الصهاينة في ضرف وجيز؟ هل كان هناك تحذير من قبل البيت الأبيض وابريطانيا لليمن حتى سحبت طلبها؟؟ هل اليمن ليس دولة يمكن لها أن تقوم بهذه المبادرة لبلورة موقف عربي يسجل بإسمها،؟ أم أن المبادرة العربية في بيروت لم يؤخذ بها لأنها تدعم الإحتلال الصهيوني، وأصحابها يريدون أن تؤخذ بعين الإعتبار، فجاءوا بطلب قبل الإجتماع اليوم:.07.08.2006لعقد قمة عربية طارئة،؟ متى؟ وأين؟إنها محاولة للوصول الى مفهوم يمكن أن يكون فيه بصيص من الأمل لصالح المقاومة الإسلامية؟ أم هو مضيعة للوقت؟ أم هو تحايل على الموقف العربي حتى تحتل لبنان كما أحتلت العراق؟ وحديث السنيورة في الإجتماع وإن كان مؤثرا، إلا أن الوقت ليس وقت البكاء،ام أنه بكى مرتين في كلمته هو إحساس بالخذلان من قبل المجتمعين، وأراد أن يعبر بالدموع جئتم الى بيروت وهي تحترق، وجئتم الى بيروت في طائرة البيت الأبيض الذي تقتل اللبنانيين،وجئتم الى بيروت بعد إستشارة الإحتلال الصهيوني وتحت حمايته، ولم يحترم الصهاينة إجتماعكم ولا سيادتكم، وأن موقفكم يمكن ان يكون للبنان هزيمة إذا سمح الله للمقاومة اللبنانية الباسلة في الجنوب اللبناني وفي خط النار،نرحب بكم لكن..... لأن البعض يمكن حضر لجس النبض اللبناني ومتى صموده في وجه الترسانة الصهيونية الأمريكية والبريطانية ومواقفة فرنسا على تهميش الموقف اللبناني ومبادرة التي لم يؤخذ بيعين الإعتبار من قبل التحالف الصهيوني الأمريكي والبريطاني والفرنسي في مسودة القرار المعروض على مجلس الأمن، والتأييد المبدأي من قبل بعض الدول العربية للكيان الصهيوني الحاضرة معنا،وفيما يتعلق بإنتداب من دول الخليج للسفر الى نيويورك لتعديل مشروع القرار الأمريكي البريطاني الصهيوني لا ينتظر منهم أن يقدموا شيئا للبنان ، فهم أناس يحبون أنفسهم ويبحثون عن الظهور فقط، فكان من الأجدر إنتداب وزراء من دول أخرى لها الحياد في الصراع اللبناني الصهيوني، ولها قدرة في تبني الموقف اللبناني والعربي والإسلامي، بدل هؤلاء، لأن الموقف اليوم يحتاج الى قوة الشخصية لإنتزاع حق من القوة الكبرى الداعمة للعدوان اللصهيوني البربري،واسمعوا ما قاله بوش. ورايس في الندوة الصحفية اليوم. المشروع قدم الى مجلس الأمن والتصويت سيكون عليه. والسلام .07.08.2006"
