subject = "التغلغل الصهيوني في العراق...."
author = "أحمد الجيدي"
posted = "2006-07-13"
text = "الأربعاء 16/6/1427 هـ - الموافق12/7/2006 م (آخر تحديث) الساعة 23:26 (مكة المكرمة)، 20:26 (غرينتش)<br />عرض/إبراهيم غرايبة<br />يعرض المؤلف في هذا الكتاب مجموعة كبيرة من الأمثلة والحالات عن التواجد الإسرائيلي في العراق بعد الاحتلال الأميركي، أو في شمال العراق \"كردستان\" خاصة، وهي أمثلة يغلب عليها الاقتباس الصحفي، والحشد المرهق الذي أضاع ترابط الكتاب ومنطقيته.<br />وكانت الأمثلة أيضا متفاوتة إلى حد كبير في مستواها ومصادرها، والكثير منها يصعب تأكيده، مع أن العراق بالطبع كان هدفا إسرائيليا وصهيونيا على مدى أكثر من قرن من الزمان.<br />- الكتاب: التغلغل الإسرائيلي في العراق<br />- المؤلف: محمد الحوراني<br />- عدد الصفحات: 256<br />- الناشر: مركز الراية للتنمية الفكرية، جدة<br />- الطبعة: الأولى 2006<br />الإسرائيليون والعراق<br />وجدت إسرائيل في توثيق العلاقة والتعاون مع الحركات الكردية المعارضة للنظام السياسي العراقي والمطالبة بالانفصال عن العراق فرصة للتسلل والتأثير في السياسات والموارد العراقية والعربية، وإضعاف واستنزاف القوات والموارد العراقية وتقليص فاعليتها وقدرتها على المشاركة في الصراع العربي الإسرائيلي.<br />وقبل إنشاء دولة إسرائيل كان للوكالة اليهودية مندوب في بغداد تحت غطاء العمل الصحفي واسمه روفين شيلوا، وقد أقام في جبال كردستان وطوّر صلاته مع بعض الأكراد في العراق عام 1931.<br />ويتحدث كاتب إسرائيلي اسمه شلومو نكديمون عن بداية العلاقة بين الإسرائيليين وعائلة البرزاني الكردية المعروفة ومنطقة برزان (ومعناها أرض الهجرة) التي تنتسب إليها العائلة، وهو ما ذكره أيضا الشيخ سعيد البرزاني الذي كان من المناوئين للسلطة العثمانية.<br />وعلى مدى 12 عاما عمل إلى جانب مصطفى البرزاني وفد استشاري إسرائيلي كان يتم تغييره كل ثلاثة أشهر، وعلى رأس هذا الوفد كان مندوب الموساد وإلى جانبه ضابط عسكري من الجيش الإسرائيلي إضافة إلى مستشار خاص.<br />وفي 24/5/1966 طار عيزرا وايزمان الذي كان ضابطا كبيرا في الجيش الإسرائيلي ثم صار فيما بعد رئيسا لدولة إسرائيل، إلى طهران للاجتماع بالشاه في طائرة نقل عسكرية كانت تحمل على متنها خمسة أطنان من التجهيزات العسكرية للأكراد تم إيصالها من قبل السافاك الإيراني.<br />وكان أول اعتراف إسرائيلي رسمي بالتعاون الإسرائيلي-البرزاني يوم 29/9/1980 عندما انهارت حركة البرزاني، فأعلن رئيس الوزراء الإسرائيلي الأسبق مناحيم بيغن في لقاء صحفي أن إسرائيل قدمت الدعم للبرزاني طوال عشر سنوات من عام 1965 إلى عام 1975.<br />ويكشف الكاتب الأميركي جوناثان راندل أن مجموع المساعدات التي قدمتها واشنطن للأكراد بين عامي 1972 و1975 بلغ 16 مليون دولار.<br />ويمكن اليوم ملاحظة تطور الاهتمام الإسرائيلي بمنطقة كردستان العراق من خلال تدفق مئات اليهود إلى مدن شمال العراق الواقعة تحت سيطرة الحزبين الكبيرين (الاتحاد الوطني، والحزب الديمقراطي).<br />وتذكر مصادر مطلعة أن طواقم استخبارية أمنية إسرائيلية تقيم منذ احتلال القوات الأميركية للعراق في مناطق الشمال بالتنسيق مع سلطات الاحتلال التي تحضر لإقامة محطات استخبارية متطورة تغطي منطقة الخليج العربي والشرق الأوسط وإيران.<br />ويبدو أن الزعامات الكردية لم ترد للعلاقات مع إسرائيل أن تقتصر على الجوانب السياسية والاقتصادية، وإنما تجاوزتها إلى علاقات فنية وثقافية.<br />فذكرت إذاعة إسرائيلية يوم 8/11/2005 أن رجال أعمال إسرائيليين دخلوا الأراضي العراقية من الحدود التركية بهدف الاجتماع مع عدد من الفنانين الأكراد وجلبهم إلى إسرائيل ليحيوا عروضا فنية أمام يهود ينحدرون من أصل كردي.<br />وهذا ما أكدته صحيفة إسرائيلية تعد برنامجا للسياحة الدينية اليهودية المنظمة إلى قبور الأولياء في كردستان العراق.<br />ولم يكتف الأكراد بتقديم كافة التسهيلات للسياح الإسرائيليين في شمال العراق، بل إنهم منعوا بعض العرب من الدخول إلى الأماكن التي يوجد فيها السياح الإسرائيليون، والهدف حماية الإسرائيليين الذين سجلوا هناك حضورا لافتا للانتباه عام 2005.<br />وكشفت صحيفة \"ميليست\" التركية في عددها الصادر يوم 11/12/2003 أن شخصيات إسرائيلية قدمت قروضا ميسرة للأكراد بقيمة 300 مليون دولار، وذلك لشراء أراضي العرب والتركمان في شمال العراق.<br />وقد أكدت مصادر الجبهة التركمانية يوم 27/6/2004 أن مئات اليهود الأكراد أخذوا يشترون أراضي واسعة في مدينة كركوك وضواحيها بخمسة أضعاف أسعارها الحقيقية.<br />لم تكن العلاقة التي ظهرت بين بعض الزعماء العراقيين وإسرائيل عقب احتلال العراق عام 2003 وليدة اللحظة، بل إنها محصلة جهود طويلة من لقاءات المعارضة العراقية –سابقا- مع زعماء إسرائيليين في إسرائيل وغيرها من بلدان العالم، لا سيما أوروبا وأميركا<br />وقد رافق شراء الأراضي هجرة كردية واسعة إلى مدينة كركوك حيث يقوم الحزبان الكرديان بتقديم مخصصات مالية قدرها 200 دولار شهريا لكل عائلة كردية تنزح إلى كركوك.<br />وهذه الأموال إنما هي دعم يقدمه الموساد الإسرائيلي للأكراد العراقيين مقابل تسهيلهم عملية نقل اليهود الأكراد إلى شمال العراق.<br />ونشرت الصحيفة الإسرائيلية يديعوت أحرونوت أن هناك نشاطا واسع النطاق يجري تنفيذه عبر التعاون الإسرائيلي مع القادة الأكراد لتزويدهم بالأسلحة والعتاد، وبمشاركة شركات كبرى تعمل على إنشاء مطار دولي \"هولر\" قرب مدينة إربيل في شمال العراق.<br />لم تكن العلاقة التي ظهرت بين بعض الزعماء العراقيين وبين إسرائيل عقب احتلال العراق عام 2003 وليدة اللحظة، بل إنها محصلة جهود طويلة من لقاءات المعارضة العراقية -سابقا- مع زعماء إسرائيليين في إسرائيل وغيرها من بلدان العالم، لا سيما أوروبا وأميركا.<br />ومن قادة المعارضة العراقية الذين دخلوا في علاقات مع إسرائيل: نوري عبد الرزاق وأحمد الجلبي وانتفاض قنبر وكنعان مكية.<br />وكانت \"رابطة الدفاع اليهودي\" إحدى أقدم المنظمات التي وجهت رسالة شكر إلى هؤلاء الأشخاص لما قدموه من خدمات جليلة لإسرائيل.<br />وفي هذا المجال نشرت صحيفتا هآرتس ويديعوت أحرونوت الإسرائيليتان تقريرا أعد بالتشاور مع إسرائيل لوضع ملامح عراق ما بعد صدام.<br />أما حلقة الضغط من أجل علاقات طبيعية ومتميزة بين بغداد وتل أبيب فتتكون من ست شخصيات تدير الاتصالات السرية مع إسرائيل. وتتردد هذه الشخصيات على انفراد على تل أبيب عبر مطارات أوروبية ومن تركيا، ومنهم مسعود برزاني وجلال الطالباني ورئيس مليشيات البشمركة الذي اعتاد زيارة إسرائيل عندما أقام في مستشفياتها في أغسطس/آب 2004.<br />وقد وافق إياد علاوي عندما كان رئيسا لوزراء العراق على فتح سفارة لإسرائيل قرب السفارة الأميركية في منطقة القصر الجمهوري، ولم تمض أربعة أشهر على احتلال أميركا للعراق حتى أعلن افتتاح مركز إسرائيلي للدراسات الشرق أوسطية في بغداد، ليكون أول بداية علنية للتغلغل الإسرائيلي في \"العراق الجديد\".<br />وأوفدت الصحف الإسرائيلية المهمة مراسليها الخاصين لتغطية الأحداث من المسرح العراقي.<br />وقد دعا جلال الطالباني في مقابلة له في قناة إسرائيل الثانية رجال أعمال إسرائيليين إلى الاستثمار في العراق، وأعلن وزير المالية الإسرائيلي بنيامين نتنياهو إلغاء الحظر الإسرائيلي على الشركات بالتعامل مع العراق.<br />إسرائيل كانت شريكا في التحضير الأميركي لاحتلال العراق، وربما تكون العقيدة التوراتية قد لعبت دورا بارزا في التحريض على الغزو الأميركي للعراق<br />تعاون إسرائيلي أميركي بالعراق<br />لم يعد سرا أن إسرائيل كانت شريكا في التحضير الأميركي لغزو العراق واحتلاله، وربما تكون العقيدة التوراتية قد لعبت دورا بارزا في التحريض على هذا الغزو.<br />فهناك نص توراتي ظلت الدعاية الصهيونية تكرره خلال فترة نشاط الحركة الصهيونية في العراق، وهو عبارة عن وعد إلهي منسوب للرب يخاطب فيه إبراهيم الخليل عليه السلام يقول \"لنسلك أعطي هذه الأرض من نهر مصر إلى النهر الكبير نهر الفرات\".<br />وكان المسؤولون الأميركيون ذوو التوجه الليكودي هم الذين حرضوا على غزو العراق واحتلاله، واستأثروا بنصيب الأسد من العراق بعد احتلاله، ومن أبرزهم الجنرال جي غارنر.<br />وعندما اشتعلت المقاومة العراقية في شتى أنحاء البلاد، لجأت القوات الأميركية إلى التعاون مع إسرائيل باعتبار القوات الإسرائيلية أكثر خبرة من القوات الأميركية في التصدي للمقاومين بحكم تجربتها الاحتلالية لفلسطين، فكان لا بد من تعاون أميركي إسرائيلي لقمع المقاومة العراقية.<br />ومن جهة أخرى أشارت بعض الصحف البريطانية والأميركية إلى مشاركة وحدات عسكرية إسرائيلية في سير المعارك.<br />وذكرت صحيفة الغارديان البريطانية أن ضباطا أميركيين تلقوا تدريبا في إسرائيل حول السيطرة على المدن، كما تلقى أكثر من ألف جندي من المارينز تدريبا في إسرائيل حول حرب المدن.<br />واستدعى البنتاغون الخبير العسكري والإستراتيجي الإسرائيلي في الجامعة العبربة بالقدس فان سرفلد عام 2002 ضمن الاستعداد لغزو العراق لإلقاء محاضرات حول حرب المدن اعتمادا على نموذج مخيم جنين.<br />وقد بنيت مجسمات للمدن والأهداف العراقية في جنوب إسرائيل لتدريب المارينز عليها، وكان من ملاحظات الخبير الإسرائيلي سرفلد أن السيطرة على مدينة بغداد ستكون أمرا صعبا نظرا لوفرة السلاح والتدريب في العراق ولضعف المعلومات الاستخبارية الأميركية.<br />وقد عكفت الإدارة العسكرية والاستخبارية الإسرائيلية منذ عام 1990 على وضع الخطط والدراسات لغزو العراق من أجل المشاركة في العمل العسكري ضد العراق ولتقديم المشورة والمعلومات والدراسات للأميركان.<br />وقد اعتمدت أفكار ونماذج إسرائيلية عدة للحرب والاغتيالات والتفكير المستقبلي.<br />وذكرت صحف بريطانية أن هناك وحدتين عسكريتين إسرائيليتين ترابطان اليوم مع القوات الأميركية في غرب العراق، وقد زارهما عدد من كبار الحاخامات في إسرائيل.<br />ونشرت مجلة نيويوركر تقريرا مفاده أن القوات الخاصة الأميركية تلقت مساعدات إسرائيلية استخبارية وفنية، وأن بعض الجنود الإسرائيليين يتخفون في العراق كعرب وعراقيين.<br />القوات الخاصة الأميركية تلقت مساعدات إسرائيلية استخبارية وفنية، إضافة إلى وجود 150 جنديا من الوحدات الخاصة الإسرائيلية داخل العراق لاغتيال العلماء الذين وردت أسماؤهم في قوائم مفتشي الأسلحة الدوليين<br />وقد كشف جنرال فرنسي في تصريح لقناة \"تي.في5\" وجود 150 جنديا من الوحدات الخاصة الإسرائيلية داخل العراق لاغتيال العلماء الذين وردت أسماؤهم في قوائم مفتشي الأسلحة الدوليين.<br />ويؤكد ذلك التقرير الذي أعدته الخارجية الأميركية ورفع إلى الرئيس الأميركي يوم 18/6/2005 أن وحدات الموساد والقوات الخاصة الإسرائيلية تعمل في الأراضي العراقية منذ أكثر من عام.<br />وهذه الوحدات تعمل خصيصا لقتل العلماء العراقيين، ويوجد بحسب القناة الفرنسية نحو 3500 عالم عراقي يعملون في التصنيع والتطوير العسكري.<br />وعينت الإدارة الأميركية البروفيسور اليهودي نوح فيلدمان مشرفا على القضايا القانونية والتشريعية في العراق.<br />وقد ضم فريق المستشارين الذين عينتهم الإدارة الأميركية للوزارات العراقية عددا من الإسرائيليين واليهود الأميركان، مثل: فيليب كارول مستشار وزارة النفط، ودور إيردمان مستشار وزارة التعليم العالي والبحث العلمي، وروبن رافايل مستشار وزارة التجارة، ودون أيبرلي مستشار وزارة الرياضة، وديفد نعومي مستشار وزارة المالية، وديفد لينش مستشار وزارة والاتصالات.<br />وحصلت مؤسسات الصناعة العسكرية الإسرائيلية على عقد بتزويد الجيش الأميركي بالذخيرة بقيمة 300 مليون دولار، وذكرت صحيفة هآرتس أن مصنع يتسحاق للذخيرة قرب مدينة الناصرة المحتلة عام 1948 قائم بالأساس على تزويد القوات الأميركية بالذخيرة، وأنه يعتبر المزود الأساسي لها بذخيرة البنادق العادية والآلية.<br />وقد تلقت المصانع الإسرائيلية طلبات طارئة ومستعجلة عام 2004 بقيمة 72 مليون دولار."
