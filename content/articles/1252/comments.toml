text = "يوليو 2006<br />أرسل لصديق نسخه للطباعه<br />رزكار أمين: الأمريكيون دربوني وأحضروا لي حكما جاهزا لصدام<br />كشف الرئيس السابق لهيئة الدفاع عن الرئيس صدام حسين ورفاقه المحامي زياد الخصاونة عن فحوى الرسالة التي تلقتها هيئة الدفاع من القاضي الكردي رزكار محمد أمين الرئيس السابق للمحكمة الجنائية الخاصة بمحاكمة صدام. وقال الخصاونة إن رزكار خاطب الهيئة برسالة وجهها عبر الإنترنت وعبر زملاء دراسة له في الأردن، حيث خاطب صدام بالرئيس صدام حسين رئيس جمهورية العراق. وأوضح الخصاونة أن رزكار كشف عن كيفية تدريبه على محاكمة صدام قبل أن تبدأ من قبل الأمريكيين في بريطانيا، حيث وعدوه بإعطائه اللجوء إليها بعد انتهاء المحكمة، مشيرا إلى أن الأمريكيين دربوه على كيفية إدارة المحكمة من حيث إظهار الهدوء وأن يبقى مبتسما دائما وإعطاء بعض الفرص للمتهمين وضبط هيئة الدفاع وغيرها من الأمور.<br />وبحسب الخصاونة فقد اعترف رزكار بأن الأمريكيين قدموا له حكما جاهزا بالإعدام على صدام فرفضه ولكنه نوه إلى أن أسباب الاستقالة لا تتعلق بهذا الأمر تحديدا وبقي متحفظا عليها بقوله إن أطرافا من الحكومة العراقية وغيرها كانت تضغط عليه بأمور لم يقبلها هو. كما شرح رزكار شعوره عندما دخل عليه صدام وهو يجلس على كرسي المحكمة بأنه وقف لا شعوريا لصدام إلا أنه تنبه لذلك وأوحى للآخرين بأنه يعدل جلسته على الكرسي، مشيرا إلى أن هذه الحالة كانت تنتابه في المرات اللاحقة من المحاكمة مما حدا به إلى إعلام المراقبين القانونيين الأمريكيين للمحكمة الذين أشاروا عليه بأن يمسك بيده مقابض الكرسي أثناء دخول صدام لقاعة المحكمة وعدم النظر إلى عيني صدام مباشرة.<br />واعترف رزكار بأن الأمريكيين لا يريدون محاكمة عادلة. وأكد الخصاونة بأن رزكار لم يتطرق إلى ما أسماه أخطاءه التي لا تغتفر بقبول رئاسة المحكمة من البداية، لكن الاستقالة جاءت لتسجل موقفا وطنيا لصالحه.<br />تاريخ الماده:- 2006-07-20"
