author = "سيادة الرئيس"
posted = "2010-02-01"
text = "نحن حققنا المجد بفوز فريقنا ونحن سعداء ورقصنا طول الليل فى الشارع<br />ولكن انا زعلان جدا على دول متخلفة زى الصين التى تغطى العالم بصادراتها ولكنها لم تحقق مثل فوزنا<br />وزعلان جدا لان اسرائيل الجبارة لم تحقق انتصار مثل انتصارنا<br />ولا حتى الهند التى صدرت برامج كمبيوتر للعالم بعشرة اضعاف صادراتنا<br />اما تركيا التى لم يكسب فريقها بطولة الامم الاسيوية فاقتصادها 30 مرة الاقتصاد المصرى<br />سيادة الرئيس نحن سعداء جدا<br />وسنرقص فى الشوارع اسبوعا<br />فا الى الامام<br />وربنا معاكم"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204230600/http://www.20at.com:80/masr/news/15150-2010-02-01-06-18-14.html"

