[[comments]]
order = 1
subject = "اول مرة اقرى عن العربيات حاجة وافهمها"
author = "ديانا"
posted = "2006-11-01"
text = "انا باتفق تماما مع الامورة اللى علقت قبلى على اننا فعلا محتاجين لو ان الموضوع يكمل على هيئة سلاسل عشان نتقدر نقولها بالفم المليان لا ميكانيكى بعد اليوم .. او حتى نقدر نتصرف فى الحاجات البسيطة ..<br />بالاضافة إلى كده عايزين كلام عن السيارات الجديدة بقى شوية ازاى ممكن اشترى عربية جديدة ومايضحكش علي .. وازاى اقدر احكم على عربية كانها محترفة وانا هاوية ..<br />وازاى اقدر استغل كل مكانيات عربيتى اللى يمكن نصفنا لا يعرفها ..<br />باللللله مستنيه باقى الموضوعات .. سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113824/http://www.20at.com/article2.php?sid=1394"
