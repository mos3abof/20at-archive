subject = "بجد الموضوع تحفة يابيبو"
author = "بوسى"
posted = "2006-11-01"
text = "انا بصراحة مكنتش متصورة انى ممكن اعمل صيانة عربيتى بنفسى بالسهولة ديه ... دا المكانيكى بيخرب بيتى .. بجد المعلومات هايلة بس انا محتاجة انكوا تكلموها وكأنها سلسلة .. ياريت"
archived = "2006-11-02"
