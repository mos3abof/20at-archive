[[comments]]
order = 0
subject = "حاجة واحدة بس"
text = "حاجة واحدة بس<br />نور ...<br />عايز اقولك حاجة واحدة بس<br />ان مافيش واحدة بتاخد غير جوزها<br />يعني ربنا اذا كان مقدر انك تكوني مراة فلان حيحصل رغما عن اي حد<br />هيه اقدار وارزاق ومتوزعة<br />ادعي ربنا انه يختارلك الخير<br />وياريت نعرف اخر اخبارك"
archived = "2004-09-11"
capture_url = "https://web.archive.org/web/20040911105755/http://www.20at.com:80/article.php?sid=598"

[[comments]]
order = 1
subject = "الاسره الصديقه"
text = "من المفيد ان يجد الشباب من يسمعهم و لكن من الافضل ان يكون من يسمع هو الاب والام لكى يكون هناك مجال اوسع و اسرع لحل المشاكل و يجب ان يبداء الاب و الام فى خلق الحوار مع الطفل فى سن مبكره حتى لا يكون هناك حاجز لا يمكن هدمه بعد ذلك"
archived = "2004-11-02"
capture_url = "https://web.archive.org/web/20041102235343/http://www.20at.com:80/article.php?sid=598"

[[comments]]
order = 2
subject = "موضوع مهم"
text = "معتز محمد<br />تحتل الانترنت فى حياتنا يوما و بعد يوم اهمية بالغة للكبار و الصغار و كما ان لكل شىء منفعة فلكل شىء مضار و الانترنت تحتاج الى الحذر البالغ من كل الأسر فهى تحمل الخصوصية و عليها يمكن للابنه او الابن مقابلة اشخاص من كل مكان فى العالم تختلف قيمهم و عقائدهم و اتجاهاتهم و حكمهم على الأشياء و لأن ابنائنا يقضون وقتا كبيرا على الانترنت فهم عرضة للمخاطر و لذلك يجب على الابن او الابنه ان يجد ان هناك رقابة و حوار معه حول نشاطاته على الانترنت حتى نستطيع حمايتهم من ما لا يتفق مع عقائدنا و قيم مجتمعنا"
archived = "2004-11-02"
capture_url = "https://web.archive.org/web/20041102235343/http://www.20at.com:80/article.php?sid=598"

[[comments]]
order = 3
subject = "ده اخرت الدلع"
text = "ماتتساءل عنه الفتاة حول ماذا تفعل انما هو من قبيل السخرية فكيف لها ان تسال مثل هذا السؤال وما هو الجواب الذي تنتظره منا ان نقول ان تذهب اليه هذا امر لايقبله الدين ولا الخلق وعليها ان تتجه الى الله فعلا بقلب سليم لكي تخرج اوهام ووساوس الشيطان التي تدور براسها وفي النهاية اقول ده ان حدوث هذا الامر جاء نتيجة التربية والحياة التي سمحت لها بالجلوس امام الانترنت دون رقيب لمدة 12 ساعة<br />المتنبي"
archived = "2004-11-02"
capture_url = "https://web.archive.org/web/20041102235343/http://www.20at.com:80/article.php?sid=598"

