[[comments]]
order = 5
subject = "أجبينى نورهل تحبيه ؟"
text = "أختي نور<br />أجمل حاجة فى الدنيا أن يتم الزواج بين المحبين لكن يأختي قرار الزواج عند الرجل و قرار نجاح الحب و الزواج عند الرجل و المرأة سويا<br />أحترمك و أحترم كل كلمة تقوليها و أشعر بك وبأحزانك<br />لكنني أعتبر أن الذى لا يستطيع أن يدافع عن حبة لا يستحق الدموع ؟ أسف نورا؟؟ لا تزعلي ؟ و لكن حاولي ترك طريقه ؟ أسف أن زوجته التى علي فراشه و بين ذراعه - سوف تكون أقرب منك - أسف نور لسؤلي لك هل تحبيه الأن ؟؟ نعم ؟ كيف و أنت تتخيلين الأن أن بين ذراعية امرأة غيرك - يقبلها و يعانقا و يراها و تراه ؟ تخيلي معي و أجبينى هل تحبيه ؟<br />أتركيه والزمان كفيل بدمل الجروج ؟؟ معلش حاولي و أبعيدي عن طريقه<br />أخوك سامى عفصه"
archived = "2004-11-02"
capture_url = "https://web.archive.org/web/20041102235343/http://www.20at.com:80/article.php?sid=598"

[[comments]]
order = 6
subject = "قرفان"
text = "عزيزتي نور..<br />من كان قادرا على الانتحار احسب انه قادر على رفض الزواج...<br />كنت اظن ان الفتيات فقط هن اللاتي يجبرن على الزواج...اما الرجال!!!!<br />انستي...ما زالت الحياة امامك...لا تياسي و لا تلعني حظك العاثر....وعموما...هذا شخص لا يستاهل مجرد التفكير فيه..كيف تنتظرين من شاب يقدم على الانتحار<br />ان يعتني بك...انستي...عند الزواج...اهم شيئ ان يكون المتقدم رجلا قادرا على تحمل المسؤوليه...<br />اوتعتقدين ان هذا الشاب يستحق منك ذره تفكير...؟؟؟<br />انا لا اعتقد..<br />حظا موفقا..<br />و السلام"
archived = "2004-11-02"
capture_url = "https://web.archive.org/web/20041102235343/http://www.20at.com:80/article.php?sid=598"
