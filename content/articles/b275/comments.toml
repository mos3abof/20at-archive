[[comments]]
order = 0
subject = "الى الاخت ليلى منصور بتاعة الهزيمة"
author = "واحد أتفقع من الأخت بتاعة الهزيمة"
posted = "2006-01-17"
text = "الى الأخت ليلى المذكورة فى المقالة أعلاها... تعجبت كثيرا من موضوع الهزيمة التى ذكرتها و أظن أن الاخت كالأعمى الذى خرج فى يوم مشمس ليقول \"هو أنتم طفيتم النور ليه\" و أظن أيضا أنها لا فرأت و لا سمعت و لا حتى أحست بكل قصص البطولة التى سطرتها دماء الشهداء و من ورائهم أهلم فى كل بر مصر .... و كنبذه صغيرة عسى ان تبدأ فى رؤية النور و نفض غبار الأنهزامية التى أصابت البعض منا بعد سلسة الهزائم و الانتكاسات التى منينا بها فى العقود الثلاثة الماضية حتى بات هذا البعض حتى لا يصدق أننا ممكن أن ننتصر فى يوم من الأيام لا فى الماضى و لا فى الحاضر .... يكفى أن تقرأى مذكرات المأسوف على شبابها أمنا الغولة جولدا مائير عندما خرت باكية فى أتصالها بنيكسون رئيس الولايات المتحدة حينئذ لتقول له بالحرف الواحد و هذه الحروف موثقة من قبل العدو قبل الصديق و أبحثى عليها فى كتبهم قبل كتب العرب قالت \"أنقذوا أسرائيل\" ..... ده معناه أيه يا أخت ليلى .... أظن معناه هزيمة لمصر !!! .... ربنا يشفى من عميت قلوبهم قبل أبصارهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130302/http://www.20at.com/article2.php?sid=275"

[[comments]]
order = 1
subject = "بحب شارون"
author = "انسان"
posted = "2006-01-17"
text = "اها........ايه ذكرياتي معاه<br />بجد بحبه وزعلان انه هيموت<br />لانه هوا اللي صحي المسلمين والعرب من نومهم في العسل<br />ويا تري لو مات هل هيستخدم اليهود اساليب فارغه ويضحكوا علي عقول العرب...<br />وكمان افتكروا ان احد القسيسين الامريكيين وهو ذو انتماءات يهوديه كبري<br />قال ان سبب مرض شارون انه غضب من الرب لانه امر بالانسحاب من غزه ...<br />فيا سلام لو رجع تاني من جديد البلدوزر عشان يخلي المسلمين دايما صاحيين<br />ولو مات هيقول اليهود فعلا مات لان الرب غضب عليه<br />ارجه يا شارون من جديد<br />علشان نفضل فايقين<br />شدوا حيلكم يا دكاترة المستشفي ورجعوه من جديد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130302/http://www.20at.com/article2.php?sid=275"

