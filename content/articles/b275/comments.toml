subject = "حسبى الله ونعم الوكيل"
author = "ايمان"
posted = "2006-01-17"
text = "مع الاسف ذكريات مؤلمة جداجداكل ما افتكر المجازر التى فعلها تشعل نار فى قلبى وتزيد كرهى له وكنت كل اللى اقدر اعملة ارفع يدى الى السماء وادعى رب العالمين لكى ينتقم منه شر انتقام ويكون وقودا لنار جهنم ان شاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130302/http://www.20at.com/article2.php?sid=275"

