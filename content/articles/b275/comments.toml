[[comments]]
order = 5
subject = "الي الجحيم بلا رجعة"
author = "محمد"
posted = "2006-01-17"
text = "أنشاء يتعذب اكتر وأن نراه كيوم علي شاشات التلفاز يوما مشلولا ويوما بإيدز ويوما بانجار إنشاء الله تعالي واقولها كلمة شديد علي ما يحصل عندنا في فلسطين وباسم كل فلسطيني غير جسوس أن يذهب الي الجحيم دون رجعة وان يبقي في غيبوبته ألاف السنين كما كان يعذب المسلمين في دول العالم اللهم خذ شارون دون رجعة<br />أأأأأممممـــــيييييــــننننن<br />مع تحيات<br />أخوكم في الله/ محمد-أسد حماس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130302/http://www.20at.com/article2.php?sid=275"

[[comments]]
order = 6
subject = "لو حكينا يا اسرائيل نبتدى منين الحكايه"
author = "نيفين"
posted = "2006-01-18"
text = "ياااااااااااااااااااااه<br />هى الزكريات السودا معاهم ليها اول من اخر<br />و لو حكينا يا اسرائيل تبتدى منين الحكايه<br />شارون و لا باراك و لا نتنياهو و لا جولدمائير<br />و الزكريات مذابح صبرا و شانيلا و لا دير البلح و لا قانا و لا دير ياسين<br />و لا مصنع ابو زعبل و لا مدرسه بحر البقر اللى هى ابشع جريمه انسانيه بعد جريمه هيرؤشيما و ناجازاكى<br />هنقول ايه و لا ايه<br />هقول لشارون ردا على صورته اللى فوق دى اللى قاله فاروق جويده عليه ف احدى قصائده<br />قبيح وجهك المرسوم من اشلاء قتلاتا<br />ف 60000000000000000000 داهيه و الى النار قولو امين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130302/http://www.20at.com/article2.php?sid=275"

