author = "الى عشريناتي قديم"
posted = "2009-04-19"
text = "ممتاز يا عشريناتي قديم<br />اصل انا معلق مهم في عشرينات<br />واول ما شفت الاخراج دا حصلي اكتئاب<br />واشكرك على توجيهاتك انا كبرت الخط وبقا عال العال<br />شكرا لك<br />انا بقا المعلق (مش)<br />مش بحبك<br />مش ضروري<br />مش لازم<br />مش شريف الدواخلي ولا البراء اشرف<br />مش رضوى حسن ولا مروى صلاح<br />مش احمد الهواري ولا عبدالله الطحاوي<br />معلش بقا الظروف معايا جد كده<br />واميلي اهه<br />SYDMOHD<br />DXBPP.GOV.AE<br />يا ريت تراسلني<br />سلام"
archived = "2009-04-21"
capture_url = "https://web.archive.org/web/20090421022048/http://www.20at.com:80/masr/105-msa7t-r2y/11757-2009-04-12-17-59-28.html"

