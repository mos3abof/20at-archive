text = "وأخذا يتبادلا الحديث \"فين حلة محشي البتنجان والكرنب وورق العنب ولا محشي الممبار، وفين دقيقة البامية، كانت تعملنا شوية فتة وعلى وشهم حتتين لحمة مسلوقة ومعاهم كارع أحسن من كل العك ده<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــ<br />اكيد دا نظيف واحد معاونيه في احد اجتماعات مجلس الوزراء"
archived = "2009-04-21"
