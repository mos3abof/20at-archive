author = "مش رضوى حسن ولا مروى"
posted = "2009-04-18"
text = "يا رضوى حسن قوليلهم يكبرواالخط شوية<br />بطلوا هبل وعبط<br />ايه الاخراج الزفت دا<br />كبروا الخط شوية والاول كان احسن كتير<br />سلام يا رضوى حسن وسلميلي على مروى صلاح"
archived = "2009-04-21"
capture_url = "https://web.archive.org/web/20090421022048/http://www.20at.com:80/masr/105-msa7t-r2y/11757-2009-04-12-17-59-28.html"

[[comments]]
order = 1
subject = ""
author = "من أجل مطبخ نظيف"
posted = "2009-04-19"
text = "المطبخ هو أكثر أجزاء المنزل استخداماً، لذا يجب الاهتمام به بشكل أكبر باعتباره المكان الذي نطهو فيه الطعام وأحياناً نأكل فيه عندما يكون متسعاً بعض الشيء لطاولة وكراسي وهو المكان الذي نخزن فيه أطعمتنا، وهو المكان أيضاً الذي يحوي القمامة بعد تنظيف الشقة وبعد الانتهاء من طهو الطعام وأحياناً يكون المكان الذي يحتوي على الغسالة الأتوماتيكية. وفي بعض المنازل قد يحتوي المطبخ على مكان مؤدي إلى الحديقة الخاصة بالمنزل، وبهذا يكون من السهل تعرضه للأوساخ.<br />ولا أحد يحب أن يكون مطبخه سيئاً ومقراً للجراثيم والحشرات والفئران والتي غالباً ما يكون مقرها المطبخ وقد تنتقل إلى باقي الشقة عندما تتكاثر في المطبخ. وما يطمح إليه كل إنسان هو أن يكون مطبخه معقماً وآمناً وخالياً من الجراثيم بحيث يستمتع بإعداد وجباته ولا يكون سبباً غير مباشر في إيذاء نفسه أو غيره بالعدوى أو التسمم الغذائي. والحل هو العناية بكل مكان وبكل جهاز وبكل الأدوات في المطبخ بطريقة معينة حتى لا تنتشر الجراثيم. وتتلخص طرق العناية والتعقيم لكل مكان في المطبخ في الطرق الآتية:"
archived = "2009-04-21"
capture_url = "https://web.archive.org/web/20090421022048/http://www.20at.com:80/masr/105-msa7t-r2y/11757-2009-04-12-17-59-28.html"

