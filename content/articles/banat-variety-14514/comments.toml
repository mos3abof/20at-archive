text = "اقتباس yasmin said:<br />انا و خطيبى مش بنتخانق كتبر بس على طول فى خناءات بينة وبين مامتى و دى مشكلة كبيرة اوى<br />لا مينفعش علشان المشاكل دي هتكبر بعد كده<br />لازم تتكلمي معاه وتحولي تقنعيه وتقوليله اللى بيعمله ده مش صح وانه يعتبرها زي والدته حتى لو هي اللى غلطانه وتفهميه ان لو والدته هي اللى غلطت في حقه ممكن انه يعمل مشكله معاها بس بمنتهى الهدوء وتحسسيه انها فعلا زي والدته بالظبط وهتخاف عليه زيها وربنا يوفقك"
