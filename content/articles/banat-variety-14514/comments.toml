posted = "2009-12-26"
text = "[quote name=\"dodosh\"]<br />لا الى بيحب حد مبيشوفش عيوبه انا خطيبي للاسف 24/24بينتقد فيا لحد مكرهن نفسي وبردو يا جماعه فى لاخر سابنى وطلعت انا الى غلطانه وبجد مصدومه جدا معقولة يكون فى حد وحش اوى كدا زى ماهو شايفنى دايما[/<br />انا اعايزة اقولك ما فيش حد كامل ولا حد كله عيووووووووووووو ووووب<br />اكييييييييييييي ييد انتى فيكى ميزاااااات حلوة كتير اوى بس هو كان بس بيعلق على الحاجات اللى كانت بتضايقه لحد ما<br />بس عايزة اقولك لو هو وصل لمرحلة انه شايفك كلك عيوووووب يبقى صعب انكو فعلا تكملو لانه ما بقاش شايف الحاجة الحلوة الى بدات ما بينكو او اللى كانت السبب فى اختياركو لبعض من الاول وده معناه ان الحب بينكم انتهى<br />بس ده مش معناه انك انسانة وحشة او قليلة بصى ربنا خالق كل شئ فى الدنيا بسبب وبمقدار واكيد حاتلاقى اللى شبهك اوى ويكون كل حاجة وحشة بتعمليها فى نظره دى اجمل حاجة فى الدنيا وبكرة تقابليه وتشوفى ان شاء الله وما تحسيش انك وحشة فى اى حاجة لان ربنا جميل وخلقك جميلة حتى بعيوبك جميلة"
