author = "silvercat"
posted = "2009-12-27"
text = "كل المشكلات اللى اتعرضت سببها ان كل واحد فيهم عايز التانى يسمع كلامه و بس و مش عايزه مناقشه…طبعا واحد يطلع يقولى لا بنتناقش ..ارد عليه و اقول له انه مش بيتناقش لكن بيتخانق اسمعوا بعض فى هدوء ..وياريت و انتوا بتسمعوا متفكروش فى انكم على حق لكن فكروا ان اللى بيتكلم معاك مش عايز الا المصلحه ..ومش عيب ابدا لما الواحد يعترف انه غلطان و يقتنع بكلام اللى قدامه اصل هو مش صراع على سلطه.. اما بالنسبه للاخ اللى بيصبر على خطيبنه انها تعمل الغلط مره و اتنين و تلاته هو اللى غلطان ما هى لو عارفه ان اللى بتعمله غلط ما كانت بطلته …انتى اللى مش يعجبك فى تصرفاتها قولها عليه بطريقه كويسه …عشان متفتكرش انك مش حاببها كده و انك عايزه تبقى زى ما انت عايزه كل واحد حابب انه تكون ليه شخصيه مستقله"
