text = "الحياة مش الصورة اللى فى خيالنا مهما اتخيلنا ورسمنا<br />البنات كل تفكيرها فى العاطفة والاحساس وازاى خطيبك هو اللى يحسسك انك اجمل واحلى انسانة فى عينيه وانك تنلاقيه دايما جانبك والحياة الرومانسية الخيالية البحتة وان كل حاجة حاتمشى زى ما احنا عايزين بس ده مش صحيح<br />لان الولد العكس تماما وكل تفكيره بيبقى الشغل والفلوس والمصاريف والحياة اللى حابب انه يأمنها لشريكة حياته<br />كل واحد من الطرفين لو فهم انه بيفكر بالطريقة العكسية دى وكل واحد احتياجاته ايه ممكن المووازين تتعدل شوية"
