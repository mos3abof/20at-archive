text = "انا وخطيبي بنحب بعض جدا الحمد لله بس اكيد كانت بتحصل بينا مشاكل في الطبيعي يعني بس قررنا اننا نتفق نحاول كل واحد فينا يتجنب اللى يضايق التاني يعني انا عارفه انه بيضايق اني اكلم زمايلي في الجامعه بشكل خاص لكن في حدود الزماله مفيش مشكله انا عرفت انه بيضايق فقررت اني معملش حاجا تضايقه وهو كمان الحاجا اللى بضايق منها هو بيتجنبها ومش بيعملها بالشكل ده مش بقينا بنتخانق ولا في بينا اي مشاكل الحمد لله"
