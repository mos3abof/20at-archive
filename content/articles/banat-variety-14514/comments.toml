text = "اقتباس ايلاف هشام :<br />بصوا بقة هااقولكم على سر بقة وبجد الى مش مصدقنى يجرب بس الموضوع دة لمدة شهر واحد بس جربى تتعاملى مع خطيبك على انو بيبى صغير افضلى قليلوا انو احسن حد فى الدنيا وانو عبقرى وانك متقدريش تعملى اى حاجة فى الدنيا من غيرة وهو ساعتها هيحس احساس حلو قوى وجميل ومش هيقدر يستغنى عن الاحساس دة عشان كل الرجالة بتحب دة قوى بمش هيزعلك خالص عشان يفضل على طول مودك حلو وتقليلو كلام حلو جربوا ومش هتندموا<br />تسلمى لما تحسسي خطيبك على انة طفل وتعاملية كويس وتخافى علية هيكون كويس اوى معاكى وهتلاقية يجيلك على طول ومش هيحتاج حد غيرك لانك مالية علية حياتة ومالية عينة<br />وبعدين الراجل عاوز اية غير واحدة تكون بتحبة وبتخاف علية وبتحافظ علية وعلى اسمة لو خطيبك دا اوحش الناس ف الدنيا كلها انتى بامكانك تخلية احسن الناس .بالحنية والطيبة والاخلاص والتقدير والمعاملة الحسنة (عامل الناس كما تحب ان يعاملوك )"
