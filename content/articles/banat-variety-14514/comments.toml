text = "لا طبعا كل الخطأ و لا حق بيقى على اىتنين اولا مفيش دخان من غير نار اكيد هى تكون لازم عملت حاجه تخليه يغضب و اكيد هو عمل حاجه تخليها تعلق اهم حاجه ان احنا ذي مابنراعي شغلنا و نحاول و ما نخطئش فيه لازم نراعي ربنا في بيتنا عشان يبقى فيه استقرار و بعدين ايه الخناقات العبيطه دي الحق عليك و الحق عليكي فين السكاكين و الخناجر و السنج و نادوني اتفرج"
