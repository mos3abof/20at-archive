text = "خطيبي خطيبي خطيبي<br />انا نفسي اعرف الانسان الي ممكن يحمل هذا اللقب الي مفروض ياخده بعد كام قاعدة وايه الي عيوب الي من وجهة نظركم يترفض بسببها رفضا تاما مع العلم اني اعلم انها تختلف من شخص لاخر وبعدين هو ممكن الواحدةيعتبره كأخأو أب يعني عمل ولا سوا هو اخوكي بردوا وبتحبيه ولالأأخويا متأكده أنه يحبني لكن ده لأاااااا"
