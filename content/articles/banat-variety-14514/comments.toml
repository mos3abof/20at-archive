posted = "2009-12-27"
text = "انا بحب خطيبي اوى والحمد لله متفاهمين الى حد ما ولما بيغضب وبيتنرفز بحاول يقدر الامكان اكون هادية وحنينة عشان يهدى<br />واحسن حاجة بينا بجد ان اى حاجة جوايا بقولهالة على طول وهو كمان لما بيزعل منى بيقولى عشان كدة مش بنشيل من بعض.<br />اهم حاجة نتقي الله ف معاملاتنا مع بعض وكل واحد لوحدة يعنى مع الناس يتقى الله ف حبيبة يعنى ميكدبش علية وميخونهوش ويستحمل حبيبة وقت النرفزة لان لو انتى استحملتى حبيبك وقت نرفزتة هو اكيد هيستحملك وقت غضبك. وانا بقول حبيبك مش خطيبك او زوجك لانك لو عاملتى خطيبك او زوجك على انة حبيبك هتكون علاقتكو ناجحة جدا ان شاء الله .<br />وانا بقول لــخطيبي وحبيبي قبل خطيبي كمان ربنا ما يحرمنى منك ويتتم لينا على خير يارب .انا بحبة اوى"
archived = "2009-12-30"
capture_url = "https://web.archive.org/web/20091230113849/http://www.20at.com:80/banat/variety/14514.html?utm_source=facebook&utm_medium=ads&utm_campaign=moshkelat_khtoba"

[[comments]]
