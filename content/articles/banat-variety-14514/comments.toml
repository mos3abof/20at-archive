text = "بجد أنا بحب خطيبى اوى ونفسى نرجع لبعض تانى ,احنا بقلنا سنة منفصلين وانا بحبه بعيوبه ومميزاته ,بس صعب جدا انا مش عارفه عنه اى حاجه واحنا سيبنا بعض عشان هو غير اتفاقه مع ولدى واتهمنى انى مش بحس بيه ومش واقفه جنبه وكان لازم اقنع ولدى ,ماكنتش متخيله انه فى الاخر يقولى لاكده لانفشكل حسيت انه مش بيحبنى واتكلمت معاه ببرود ,حقيقى حسه إنى السبب ومش عارفة انساه ومش متخيله اكمل حياتى مع حد غيره,احنا كنا بنحب بعض بجنون,نفسى اعرف عنه اى حاجه"
