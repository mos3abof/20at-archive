text = "مشكلتي اني محبوبه عند كل الناس الا خطيبي الوحيد اللي مش عارف يفهمني اويحبني مخطوبه من 9شهور عمره ماقالي كلام حلو وانا كمان عمري ما قولتله كلام حلو انا هاديه جدا وصبوره جدا هو عصبي جدا واي حاجه بتحصل يقوللي انتي السبب بس بصراحه هو طيب اوي وحنين بس مش عارفه اتعامل معاه انا عمري ماحبيت وبالغم من كده انا اجتماعيه جداجدا مع كل الناس انما هو بتكسف اوي منه<br />وبجد مش عارفه اعمل معاه ايه من اسبوع كنا حنتفصل بس رجعنا تاني لبعد وبقينا كويسين عن الاول انا بجد عايزه حد يقولي انا كده غلطان مشكلتي انا بتكسف اوي وهو عايزني مفتوحه معاه انا مش عارفه اعمل ايه"
