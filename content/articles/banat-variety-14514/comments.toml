text = "اكتر حاجه بتدايق الراجل من الست سواء مخطوبين او غيره انها تعامله بنفس ما بيعاملها دايما بيحب يحس انه يغلط وهى تسامح<br />طبعا ده كله بيمثل عبء كبير على المراة لانها بتتجاهل مشاعر واحساس نفسها فى سبيل رضاؤة ولما بيفيض بيها بتنفجر<br />لكن لو بيتعاملوا من الاول على انى مش هزعلك واانتى كمان تزعلينى ولما يحصل حاجه بينا لازم نتكلم عن الى مدايقنا بصدر رحب صدقونى100% مش هيكون فى اصلا مشاكل وكل الناس هتعيش مبسوطه"
