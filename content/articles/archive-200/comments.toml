[[comments]]
order = 3
subject = ""
author = "مصطفى احمد محمد"
posted = "2007-11-03"
text = "ليس هذا هو الكف الصعيدى بل هو نمط من انماطة فالكف الصعيدى هو بالدف والطار والعود وليس الناى وهذا الذى تتحدث عنة انما هو نوع من الموال وليس الكف ومن اشهر فنانين الكف رشاد عبدالعال ومحمد ابو درويش ومكى وابسعود ويونس اما اشهرهم على الاطلاق فهو رشاد عبدالعال ابو ياسر والكف يدا بالنغمة الهادئة وهى المربع او الرباعى تبدا بالصلاة على النبى والسلام على الحاضرين ثم باقى الخين"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122715/http://20at.com:80/archive/200.html"

[[comments]]
order = 4
subject = ""
author = "اشرف فرغلى"
posted = "2009-05-27"
text = "مع احترامى الشديد لكل فنانى الكف الصعيدى لايوجد اى فنان يقول انا فنان كف صعيدى بعد المرحوم رشاد عبد العال ابو ياسر عليه رحمة الله هذا الرجل تعلمنا منه الكثير واحببنا هذا الفن بسببه رغم اننا لسنا جعافرة ولسنا نوبيين عموما سيب اللى يخبط يخبط لكن هذا الرجل اذ كان توفاه الله ولكن ستظل اعماله خاله ابد الدهر"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122715/http://20at.com:80/archive/200.html"
