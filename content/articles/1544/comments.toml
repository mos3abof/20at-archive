[[comments]]
order = 1
subject = "بص العصفورة…!"
author = "مصري"
posted = "2006-03-03"
text = "عندما يكون هناك زحام حول أمر يهم جموع الناس ويلتف الناس حول هذا الحدث ويبدأوا في الحديث واستنتاج أسباب ما حدث وكيف نتصرف؟<br />عندئذ يدخل نشال وسط الجموع وفى تخطيطه إشغال فكر الناس بأمر ملفت أو له بريق أو مخيف ليشغل تركيزهم عما هم فيه حتى يقوم بمهمته وهى نشل الناس وهم غافلون<br />فيصيح مثلا ( بص العصفورة) (شفتم القمر)( شوفوا لطيارة)……الخ!!!!!<br />وهنا تشرئب أنظار الناس بعيدا عما كانوا يركزون فيه فتبداء يد النشال تعبث في جيوب المتجمهرين خلسة وهم غافلون حيث شتت تركيزهم بعيدا عما هم بة منشغلون<br />هذا ما يحدث في مصر الآن<br />الناس مهمومة بالإصلاح السياسي ، والإصلاح الاقتصادي، معالجة مشكلة البطالة، أسباب كون الفساد هو القاعدة وان النزاهة هي الاستثناء والشذوذ ،قتل الناس في عبارة وبقاء 800مصرى تحت مياه البحر الأحمر غذاء لأسماك القرش<br />في هذا الوقت صاح المسئولون (أنفلونزا الطيور) !خاف الناس وتشتتوا ذعرا فتم نشل أصحاب مزارع الدواجن ومحلات بيع الدجاج بحجة الوقاية من الوباء ! وتعويضا لذلك قاموا بنشل أصحاب المزارع واخذوا منهم الدجاج لسعر الدجاجة 2جنية (شوف الرحمة) ليذبحها رجال البزنس وأصحاب المجازر في مجازرهم وبيعها مجمدة في المجمعات والسوبر ماركت بسعر15جنية للدجاجة…! بعد أن كان المواطن يشتريها ب7جنيه شغل نشل على أصوله<br />ثم تسرى شائعة بان مياة النيل ملوثة..! وتسير سيارات في الأحياء الراقية(المعادى) تحذر الناس من خطورة مياه النيل ورسائل في الموبايل فاختفت المياه من المجمعات والسوبر ماركت زجاجات المياة الصحية‍<br />هكذا يكون البزنس (نشل الشعب) ولقد ضرب عصفورين بحجر واحد لفت أنظار الناس بعيدا عماهم به مشغولون( الفساد،الديموقراطية،الإصلاح السياسي،استقلال القضاء،الإصلاح الاقتصادي، الكساد الحاد،البطالة،إحجام الشباب عن الزواج،حرية الصحافة، القوانين الاستثنائية….الخ)<br />هذا العصفور الأول أما العصفور الثاني هو ملء جيوب رجال البزنس من أقوات الناس فيزيدون ثراء ويذهب الفقراء إلى الجحيم<br />{الَّذِينَ إِذَا أَصَابَتْهُم مُّصِيبَةٌ قَالُواْ إِنَّا لِلّهِ وَإِنَّـا إِلَيْهِ رَاجِعونَ }البقرة156"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145418/http://www.20at.com/article2.php?sid=511"

