text = "القصيدة قوية جداً ومعبرة ولكن تذكرني بقصيدة لنزار قباني اسمها حبيبتي والزمن ، ولكن لن أظلم القصيدة مهما كان كاتبها فهي جميلة وكلماتها منتقاة بجدارة وشكرا"
