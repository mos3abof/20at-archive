posted = "2007-12-16"
text = "القصيدة رائعة وأكثر من رائعة وتلمس بين كلماتها الصدق في المشاعر ويبدو أن الشاعر في تجربة حقيقية وهو متمسك بحبيبته ويخاف عليها ان يفرقهما الزمن ولكنه يشجعها على الصبر في وجه الرياح والعواصف التي ستقابلهما في المستقبل فلك مني أجمل تحية من غزة الصمود وأتمنى لك حياة سعيدة مع من تحب أخوك أمجد"
