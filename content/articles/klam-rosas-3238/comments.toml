posted = "2007-12-25"
text = "الى من احب قلبى اهديك رسالتى واهديك هذه القصيده ولو كانت تعبر عن ما فى قلبى من ناحيتك اهديكى عمرى اهديكى حياتى اهديكى شيئا ملك لك وهو قلبى الى غاليتىومحبوبتى التى اشعلت النار فى قلبى التى لما اعد ازق طعم للنوم منحبها اليك يا حبيبه ايامى وكل احلامى اعترف انى احبك كما احببتينى بل واكثر اعترف انى شغلت بك لا غيرك اهداء من حبيبك العاشق (عمر)"
archived = "2009-04-20"
capture_url = "https://web.archive.org/web/20090420131609/http://www.20at.com:80/klam-rosas/3238.html"

