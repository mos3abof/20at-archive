author = "عفوا يا شيخ الازهر"
posted = "2009-10-08"
text = "عفوا يا شيخ الازهر<br />ايام النبي محمد صلى الله عليه وسلم طلع واحد من بين الصحابه ومسكنه من قميصه وقال له اعدل<br />وقال النبي صلى الله عليه وسلم على ذو الخويصره الذي مسكنه من قميصه<br />يخرج من ضئضئي هذا قوم يتلون كتاب الله رطبا لا يجاوز حناجرهم يمرقون من الدين كما يمرق السهم من الرمية"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010165359/http://www.20at.com:80/masr/2khbar/13657-2009-10-08-08-19-21.html"

