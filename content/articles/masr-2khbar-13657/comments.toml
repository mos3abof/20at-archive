posted = "2009-10-08"
text = "كل من يسيء الى شيخ الازهر او علماء الدين الكبار هو انسان سافل وواطي ومنحط اخلاقيا<br />وجاهل ويتبع الرؤوس الجهاله وينتمي الى قتلة عثمان والخوارج الذين خرجوا على الامام علي<br />،،،،،،،،،،،،،،، ،،،،،،،،،،،،،،، ،،،،،،،،،،،،،،<br />مش ححبك"
