subject = ""
author = "المعلم كفتة"
posted = "2009-03-28"
text = "مفيش فن يبوز فن فية فرق بين الفن الشعبى والفن والطرب الاصيل والاغانى الشبابية السريعة وكل حد لية زوقة ومزاجة وبالنسبة لبعض كلمات الاغانى الشعبية والمصطلحات العامية والمبتكرة فى النص دى على فكرة فية ناس مثقفة ونخب مختلفة بتحب الفن الشعبى وفنانينة وفنناتة والدليل افراح رجال الاعمال والسياسة وولادهم لازم يبقى فية فى البرنامج مطرب شعبى ورقاصة وبعدين يابو محسن لما تبص لاوروبا وامريكا حتلاقى عندهم فنانين شعبيين بيقولوا كلام اوحش من الوحاشة على ريتم ميوزك ورقص خاص بالفن واهم بيحترموهم فى بلادهم وماقالوش دول بوزو على بيتهوفن وموزارت وفرانك سيناترا وخوليو ايغليسس وتقبل تحياتى"
archived = "2009-04-22"
