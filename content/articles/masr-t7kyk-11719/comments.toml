[[comments]]
order = 4
subject = ""
author = "مش لازم منقول"
posted = "2009-03-28"
text = "حصل أحداث هذه القصة عام 1991م ، بعد إحتلال العراق الكويت بأيام ، وهذه القصة لها علاقة بحرب الكويت .<br />بدأت أحداث هذه القصة أثناء حرب الكويت عام 91 ، وقتها سافر أحمد عدوية إجازة إلى الكويت وبالصدفة تعرف على أميرة كويتية ، فأحبها وأحبته ولكن لسوء حظه في نفس الوقت هناك أمير كويتي يحب نفس الأميرة التي يحبها أحمد عدوية ، فأمره أن يبتعد عنها فرفض وصمم بأنه أحمد عدوية يريد الأميرة الكويتية تفضل حبيبته ، فغضب الأمير الكويتي وأرسل إليه ناس جنسيتهم مجهولة ، فخطفوا أحمد عدوية وأسقوه مخدرات وقطعوا عضوه التناسلي ، وأصبح أحمد عدوية مدمن مخدرات ورجل عاجز ومشلول ، وفي عام 1997م شفى أحمد عدوية من شلله ومن إدمانه في المخدرات ولكنه ظل عاجزاً حتى الآن لأن عضوه التناسلي مقطوع ، وأتمنى أن يشفى بأن يقوم بعملية جراحية بزراعة عضو تناسلي ذكري ، لكي يستطيع أن يستعيد رجولته ، وكان قبل هذا الحادث عندما يغني كان يرفع يديه إلى أكتافه ولكن بعد شفائه من إدمانه المخدرات لم يستطع حتى الآن وهو يغني أن يرفع يديه إلى أكتافه ، لكي يمتعنا بحركته المألوفة .<br />بالنسبة لحقيقة مرضه حقيقية أما قصته عن الأمير والأميرة لا أدري الله أعلم أنا رويتها كما رواها لي أبي عام 1991م ، والله أعلم .<br />ما رأيكم بهذه القصة المأساوية عن أحمد عدوية أريد آرائكم ."
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003335/http://www.20at.com:80/masr/t7kyk/11719-2009-04-15-18-53-04.html"

