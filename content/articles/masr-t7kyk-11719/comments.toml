author = "ابومحسن غربة 27 سنه"
posted = "2009-03-27"
text = "عدوية بداية سقوط الاغنية العربية<br />اتذكر اول اغنيةى التي هوت بالمغنى المصري الى الجحيم<br />السح الدح امبو ادلي الواد لابوه<br />يا عيني الواد بيعيط الواد عطشان اسقوه<br />وراحت في ستين داهية الاغنية العربية<br />وراح في ستين داهية خريجي معهد الموسيقى العربية<br />وجلب علينا القهوجية والمكوجية والحرامية وكله اعد يغني<br />بع شادية وعبدالحليم<br />شوفوا بقا مين بقا بيغني<br />معدش يجي منه<br />سلام يا صاحبي"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003335/http://www.20at.com:80/masr/t7kyk/11719-2009-04-15-18-53-04.html"

