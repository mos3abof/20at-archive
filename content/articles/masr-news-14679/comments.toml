author = "تاكسيات"
posted = "2010-01-01"
text = "هى فين الشوارع اللى هتمشى فيها التاكسيات الجديدة<br />ياعم نظموا المرور الاول فى الشوارع واتعلموا قواعد المرور الاول وبعدين دوروا على تاكسيات اضافية"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102103119/http://www.20at.com:80/masr/news/14679-2009-12-31-10-48-02.html"
