order = 0
subject = ""
author = "قيادات متفرنجة"
posted = "2009-12-31"
text = "قيادات النسوان بقت خواجاتى خالص من بتوع الشعر الاصفر واللى امها اجنبية وطالعين فيها تحرر كاننا فى هولندا ومواخير امستردام اللى زاروها<br />احنا هنا فى مصر<br />فى بلد فية حياء<br />فية الست بتنكسف من جوزها<br />وفية خصوصية للمراة عندنا تختلف عن خصوصية المرأة الاجنبية<br />دة مش تاخر ولا تزمت ولا رجعية ولا تخلف - هذا فهم لطبيعة ومشاعر الست المصرية<br />فكرة تاكسى الحريم فكرة ممتازة وعربة الحريم فى المترو فكرة رائعة وشباك سيدات فى اماكن دفع الفواتير فكرة رائعة<br />رفقا بالقوارير"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102103119/http://www.20at.com:80/masr/news/14679-2009-12-31-10-48-02.html"

[[comments]]
order = 1
subject = ""
author = "واحد وخلاص"
posted = "2009-12-31"
text = "انا مش عارف شوية النسوان الى مساكين مناصب دول عايزين ايه<br />شوية يتكلموا عن التحرش مع كله عارف البنات لابسة ايه فى الشوارع<br />عملنالهم عربيات خاصة فى المترو والترام<br />والناس عايزه تعملهم تاكسي<br />وكل ده ومش عاجبهم<br />انا مش عارف الناس دى عايزة ايه<br />ربنا يولع فيهم"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102103119/http://www.20at.com:80/masr/news/14679-2009-12-31-10-48-02.html"

[[comments]]
order = 2
subject = ""
author = "نانسى"
posted = "2009-12-31"
text = "نعم الغاء عربه السيدات بالمترو<br />دا انتوا عيزين التحرش بقى يكون للركب<br />ولو مكنش تحرش مقصود فالزحام سيجعل هناك احتكاك بين الرجال والسيدات<br />عن نفسى لو اتلغت عربه السيدات بالمترو فلن اركب هذه الوسيله ابدا"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102103119/http://www.20at.com:80/masr/news/14679-2009-12-31-10-48-02.html"

[[comments]]
order = 3
subject = ""
author = "ولماذا ترفضن التحرش"
posted = "2009-12-31"
text = "ولماذا تشتكون من التحرش بعد ذلك ؟<br />فيها اية لما يبقى تاكسى تقودة سيدة او فتاة وتنقل سيدات او فتيات اذا رغبن فى ذلك<br />واللى عايزة تركب مع الرجالة تتفضل هى حرة واللى عايزة تتزنق فى الاتوبيس هى حرة<br />دى خدمة خاصة لمن يريد وليست اجبارية<br />زى عربة المترو - ممكن اى سيدة او بنت تركب فى اى مكان فى المترو فى وسط زنقة الرجالة ومحدش هيكلمها<br />هو انتم لية بتعارضوا اى فكرة جميلة<br />دى فكرة خاصة - لمن ترغب من الحريم فى وسيلة مواصلات محترمة وبعيد عن الرجال"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102103119/http://www.20at.com:80/masr/news/14679-2009-12-31-10-48-02.html"

