text = "اقتباس (جواب المصلين الايقاعى,بنود دعائيه,آمين نداء تحررى,الدعاء حالة انفلات نظن انه بالضجيج وحده سنرضى(!!الرب!!!)؟,والقدر تاريخيآهوبناء!! ))0 لماذا ارتديت ثوب الهالك باذن الله نجيب محفوظ وأنت تكتب ماكتبة!؟! ياخى استغفر الله وعد لرشدك ان كنت مسلمآ حقا؟وان كانت كلمة#الرب# هناتبعث على الشك!أوحشرك الله معه! وبعقلك ال م ؤ م ن !! أين تتوقع ان يحشر ؟؟وذلك طبعآ باذن الله وقدرته وعلمه 000 وأستغفر الله العظيم لى ولكم00"
