text = "مقال جميل لكن اعتقد لو اسلوب الكتابه ابسط شويه كان يكون افضل حتي يصل الي قدر اكبر من الناس ولا يساء فهم بعض العبارات من بعض المعلقين ... خصوصا لهؤلاء المتحفزين لكل ماهو غير تقليدي في اسلوب التناول والخطاب"
