text = "اللهم عونك على أن تجعل أقوالنا أفعالاً، وأفعالنا نصرةً لدينك، ولا تجعلنا من الذين يقولون ما لا يفعلون، فقد كبر مقتًا عندك أن نقول ما لا نفعل.<br />آمـين ......آمـين .... آمـين"
