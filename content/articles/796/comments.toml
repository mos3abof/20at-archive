[[comments]]
order = 4
subject = "أسأت من حيث اردت ان تحسن"
author = "NEW DAY"
posted = "2006-10-23"
text = "المبدأ الذي اردت طرحة لا غبار عليه ، وهو ( على قد ما فهمت ) ان يتقدم العمل على الدعاء ، وان كنت ارى اناالاثنين مترابطين ولا يوجد ما يُقدم او يُؤخر ،<br />انما المشكلة في اسلوبك الذي تناولت به الموضوع<br />اولا :بدأت بدعاء من السُُُنة وانتقدته واعتبرته دليل على السلبية وربطته بالفاس والحمار والبقرة والطين ، وده سوء أدب مع الرسول - صلى الله عليه وسلم -<br />ثانيا:\"اتفزلكت\" واستعملت الفاظ صعبة مش مفهوم عاوز تقول ايه<br />ثالثا : مين اداك الحق انك تعمل اسقاطات على لفظ \" آمين\" ؟ وتحمله فوق ما يحتمل مما قد يكون في قلبك ولكنه ليس ما في قلوب الآخرين<br />ومين قال ان التفكر والتفكير معناه الخروج على الثوابت والتعدي على المقدسات كالسُنة والدعاء والايمان<br />أسأل الله لك توبة نصوح لا تضل بعدها ابدا<br />آمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123449/http://www.20at.com/article2.php?sid=1381"

