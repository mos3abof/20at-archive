subject = "الى الأخ حمدى مع 00 التحيه"
author = "مسلم عربى"
posted = "2006-10-23"
text = "نحن لاندعى العلم ( شهادات ) ولا العلم فى كمال الدين أو الدنيا \" وما اتيتم من العلم الا قليلآ \" ولكن لانسفه أحد !! ولا ننظر للخلق من ( برج الجزيره )!؟ ونحن لاننتقد ماكتبه _ الطحاوى _ لأن عباراته تصعب علينا أو دون _ لا أقول علمنا _ معرفتنا بفصده !! ولكن00 نحن ننتقد سؤ أدبه , أو سؤء عباراته حتى لايزعل علينا!!! مع الله 0 والله من وراء القصد0"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123449/http://www.20at.com/article2.php?sid=1381"

[[comments]]
order = 6
subject = "المكفراتية"
author = "مسلم مسلم"
posted = "2006-10-31"
text = "الاخ المكفراتي الذي يقسم رحمة الله ويتحدث عن الاخرة بقوة وجرأة احسده عليها ولا عجب فقد كان الاحبار والرهبان اكثر صنف هجاه القران لانه اكثر جرأة ووقاحة مثلك ام علم الربوبية ومشتقاتها فهو موجود في القرآن مثل \"رب العالمين\"والحمدلله ايها المتشنج الذي حذر من فكرك الهاذي المصطفى انك لم تقرا مقولة اقبال عن القدر او الاستاذ سيد قطب او ابو حامد الغزالي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123449/http://www.20at.com/article2.php?sid=1381"
