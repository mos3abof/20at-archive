[[comments]]
order = 1
subject = "عجيب"
author = "محمد صلاح"
posted = "2006-07-03"
text = "من العجيب فعلا ان اي رئيس في بداية حكمه بيكون صادق في نيته في التخلص من الحكم في اقرب فرصة (ممكن تكون فترة رئاسية ) .. لكن يبدو ان كلاام الليل لما يطلع عليه الشمس بيسيح فعلا , لان الحاكم فجأة بيحس علي ما يبدوا ان البلاد بدونه حتضيع وتتيتم فيقرر انه ييجي علي نفسه شويه ويتنازل ويستمر في حكمنا ... من الاخر انا واثق ثقه عمياء ان كل الحكام العرب بلا استثناء مرضي نفسيين \" واغلبهم مريض بداء العظمه \" فعلا مفيش فايده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130425/http://www.20at.com/article2.php?sid=1020"

[[comments]]
order = 2
subject = "الخيار لكم"
author = "يا شباب الاسلام الخيار بايديكم ، فإماأن تظلوا خانعين ذليلين تحت حكم الطاغوت ، أم تثوروا ثورة الاحرار ، وتبنوا دولة المؤسسات والحرية."
posted = "2006-07-03"
text = "أما هذه الاسمال البالية ، والعراجين القديمة ، فستسعى بكل ما أوتيت من قوة لتوريث الضيعة (البلاد) الى افراخها المشؤمة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130425/http://www.20at.com/article2.php?sid=1020"

[[comments]]
order = 3
subject = "كل شعب يستحق حاكمة"
author = "ابراهيم الشورى"
posted = "2006-07-03"
text = "طالما رضيت الشعوب بالذل و الهوان راضين بالقهر فسيبقى حكامها جاثمين على قلوبها.الحل بأيدى الشعوب. يقول الشيخ خالد محمد خالد اذا خفنا ان نصطلى بنار الثورة دفاعا عن حرياتنا فسنصطلى بها غدا دفاعا عن حكامنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130425/http://www.20at.com/article2.php?sid=1020"

[[comments]]
order = 4
subject = "ده كان زمان"
author = "محمد صلاح"
posted = "2006-07-03"
text = "عصر الثورات ولي وراح لحاله ... اصبحنا في عصر الناس بتجري فيه علي اكل عيشها \" معذوريين حيلاقوها منين ولا منين \""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130425/http://www.20at.com/article2.php?sid=1020"

[[comments]]
order = 5
subject = "اللص لم يبقي شيئا"
author = "علاما تجري -يا مسكين - هل ابقى اللص -الملقب زورا وعدوانا - بانه ولي امر المسلمين ."
posted = "2006-07-04"
text = "هل ابقى لك او لولدك شيئا ؛ حتى تجري وراءه ، انه قد أكل الاخضر واليابس ، والسمين والهزيل ، فتركك انت وولدك في جوع ولظى ، فانهض ، واجعل من نفسك جسرا ؛ لتعبر الاجيال الجديده عليه الى حياة العزة والحرية."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130425/http://www.20at.com/article2.php?sid=1020"

[[comments]]
order = 6
subject = "فرسان الصحراء"
author = "مالك الشريف"
posted = "2006-07-24"
text = "عندما تسئل عربى عن موريتانيا فانه يجيبك بانه لا يعرف عنها الكتير ولكن هاهم فرسان الصحراء الموريتانية اولاد الباديةياتونلكى يضعو بصمتهم فى الديمقراطية"
archived = "2006-11-02"
