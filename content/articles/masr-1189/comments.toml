order = 0
subject = "عمنا دا إيه يا أحمد ؟؟؟؟؟؟؟؟"
author = "إبن بهية"
posted = "2006-11-21"
text = "بداية أتفق مع الأخ أحمد الهواري في حرارة البهارات التي يضيفها حمدي رزق إلى طبق الكشري اليومي الذي يكتبه في المصري اليوم .. لكني حقيقة لا أتفق معه على أنه كاتب كبير والذي منه لأن أحمد الهواري مجرد فرد .. نفر يعني .. لذا سأتفق مع الأغلبية التي تقول بأن حمدي رزق مخبر كبير وليس كاتب كبير .. نعم هو مخبر كما يعلم الجميع من زملائه .. مخبر أوي ومش غلط نعتبره واحد من أكبر البوبيهات النابحة ليل نهار لحماية النظام الفاسد في مصر بما يقدمه من خدمات جليلة للوطن مثل الآلاف ممن يخدمون هذا الوطن نهبا وسلبا وعواء حتى لا يتركوا للوطن قرش (يبوظه من باب أن الفلوس بتبوظ العيال وبلدنا لسه نغه وخايفين عليها من البوظان) .. هذا هو حمدي رزق مخبر الداخلية المعروف بجريدة المصري اليوم والذي تربى في أقسام البوليس منذ كان (يتمحلس) لأي باش شاويش كي يحصل على كلمتين عن أي حادث وفي أغلب الأحيان كان لا يجد من يصغي له ولا حتى بنات الليل بتوع قضايا الآداب الائي ضربنه علقة زمان كانت أسخن من بهاراته .. فكان يصغي لبنات أفكاره ويفبرك قصص الحوادث التي كان يكتبها منذ نعومة أظافره في بلاط صاحبة القمامة (صاحبة الجلالة سابقاً وأما ما نراه اليوم في الصحافة من مخبرين أقذر من أكوام القمامة التي تسد شوارع القاهرة) ، لحسن حظ الولد (لأنه محظوظ) ولسوء حظنا نحن والصحافة معنا أن ذلك الغليم تقرب وتودد من بعض الضباط بمساعدة بعض الناس .. وشوية شوية راح داخل في زواريقهم وعجبهم وبقى يخرج معاهم في سهرات من إياها بتاعة باشاوات الداخلية ، وفي إحدى هذه السهرات القذرة وجد الفرصة التي سعى لها طويلاً حين اصطدم بواحد من إخوانا البعدا بتوع أمن الدولة .. راح الولد ماسك فيها ومن يومها وهو شغال مخبر عندهم وبكره تشوفوه رئيس تحرير كبير وله شنة ورنة<br />اقرأ بقية التعليق .."
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124073205/http://masr.20at.com:80/article.php?sid=1189"

[[comments]]
order = 1
subject = "عمنا احمد الهواري.. اسمحلي !!"
author = "الشمحطجي"
posted = "2006-11-21"
text = "معلش يا عم احمد ...المقال غريب شويتين<br />في البداية تقريباً ثلث المقال مدح في عمك حمدي رزق..واسمحلي اختلف معال في بعض الامور الي اوردتها في المقال والولها وصلة الغزل الي واضح انه مش عفيف في عمك رزق واعتقد ان كلامك في مبالغة كتيرة حوالين شخصية محل شبهات كتيرة من ناس محيطة بيه ومقربين منه واقصد هنا الشبهات الامنية وليس شئ آخر والشبهات دي مؤكدة عند البعض \"وهم كتير \" وكلام داير حواليين علاقة عمك حمدي رزق بمباحث امن الدولة ولولاش عمك التاني عبدالله كمال على الحجر اليومين دول كان ممكن عمك الاولاني رزق ماسك عصايا المارشيلية في روزا اليوسف دلوقت..ده اولاً من ناحية سمعة الراجل إلي هي لامؤخزة زي الخرة في اوساط الصحفين إلي هما من جيله<br />اما من الناحية الفنية وأقصد هنا الصياغة واسلوب الكتابة معتقدش ان عمك رزق جاب التايهة يعني هما شوية استظراف وتقل دم وتكلف في الكتابة الراجل قدر يعمل توليفة منهم وطبعاً العوام والناس الي مخها على قدها تحب قوي قعدات المصاطب إلي سيادتك نازل فيها قصايد شعر وفي كتابات عمك رزق المهلهلة من غير مضمون ولا قضية حقيقية يعني مثلاً عمك حمدي رزق في موضوعه الي كاتبه عن الوزير فاروق حسبسني وتصريحاته حوالين الحجاب تلاقيه ملفق حاجات في بعضها ورأي من هنا على رأي من هناك وكحال كل الناس سابو القضايا الحقيقية إلي ممكن اركان النظام يتحرقو بسببها في ميدان \"لو في محاسبة حقيقية في البلد\" ومسكو في قضية فرعية ثانوية وهي الحجاب إلي هي لا هتودي ولا هتجيب وتخيل معايا كده ان نفس الوزير لم يتحرق للحكومة رمش لما اتحرق اكتر من سبعين شاب وناقد وصحفي فني في محرقة مسرح بني سويف ومع ذلك عملو هوليلة على تصريح لا هيودي ولا هيجيبوالين قطعة قماش مت x متر اسمها \"الحجاب\"<br />في نقطة اخير واسمحلي يا عم ا<br />اقرأ بقية التعليق .."
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124073205/http://masr.20at.com:80/article.php?sid=1189"

[[comments]]
order = 2
subject = "نصيحة من مواطنة"
author = "بسمة"
posted = "2006-11-21"
text = "انا مواطنةمصرية عاطلة بقي لي سنتين خريجة كلية علميةعملية بيقوتواعليها كليات القمة ما عليناوعلشان اقتل الفراغ وعدم التفكير في الحصول علي عمل وجدت في متابعة الصحف والقراءة بصفة عامة خروج من القضاء والقدر اتبع معظم الصحف التى غالبا لاتستحق المتابعة ولكن شر لابد منه يا استاذ احمد لا اعلم حضرتك صحفي محترف ومحترف عندى تكتب في الصحافة المكتوبة ام صحفي من اللي بيقولوا عليها صحافة شعبية مش المهم كلام حضرتك عن عمود حمدى رزق يدعونا الي التشاؤم اكتر ما احنا لان هناك فرق بين الصحفي والمخبر الصحفي ممكن يكون تجاوزا نموذج مهما اختلفت معه فيما يكتبه ولكن المخبر نتفق علي انة يخدم جهات وافراد ولا يخدم اى فكره ارجوك ان تكون انت وزملائك صحفيون تخدمون افكاركم حتي لو اختلافنا نحن عليها"
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124073205/http://masr.20at.com:80/article.php?sid=1189"

[[comments]]
order = 3
subject = "أختلف كلية معك"
author = "قلم جاف"
posted = "2006-11-21"
text = "بداية حمدي رزق حر في رأيه في الإخوان ، وليست معاداته لهم جريمة وليست بطولة ..<br />ثانياً .. أسمي سخريته الدائمة تلك استظرافاً يعاني منه مشاهدوه في القاهرة اليوم عندما يحل ضيفاً ثقيلاً على الأستاذ خيري رمضان حسنة برنامج القاهرة اليوم الوحيدة ، أو من خلال بوجي وطمطم مذيعي البرنامج الفاشل هو فيه إيه..<br />ثالثاً: لم \"يتنحرر\" حمدي بيه رزق للرد على مفتي الديار المصرية عندما نشرت له صحيفة الوفد وصحيفة الحزب الوطني البيروقراطي (الوطني اليوم) تصريحاً لم ينفِه عن أن الانتخابات تعادي مبدأ إسلامياً ، بينما ثارت ثائرته عندما هاجم فضيلة المفتي الإعلاميين ، الليبرالية تصحو وتنام لدى \"عمنا\" رزق بزرار!<br />رابعاً : أنا قرفان من الطريقة التي يتعامل بها هو وغيره مع المرأة ، إما أن تكون المرأة عورة عند المتشددين أو فازة ورد عند رزق بيه ، المرأة كائن بشري يا بشر.. متى يفهم هو ذلك؟<br />خامساً : لا يوجد شيء اسمه مفكر إسلامي أصلاً ، وما هي حجية جمال بيه البنا الذي قال يوماً أن مجلس الشعب ليس في عمومه جهة تشريع! ، ولا داعي لسرد خزعبلاته وتعفيره على الذقون فيما يخص مسائل السياسة التي هو فيها أمفيوترك للغاية ويلعب على كل أنواع الحبال.."
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124073205/http://masr.20at.com:80/article.php?sid=1189"

