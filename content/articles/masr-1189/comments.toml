text = "A1 يااحمد<br />بجد موضوع عشرة على عشرة ، وللأسف ان انت عارف تحلل وتتكلم وتجيب معلومات وترد كده والمذيع والمذيعة المحترمين على المحور وكثير من امثالهم لم يعرفوا كيف يردوا على حسين فهمى مثلا وهو بيقول \"الحجاب ليس فرض كما قلا السيد الوزير الذى تحدث الحديث الصحيح \" وتقريبا نزل يقول من صحيح مين؟!!"
