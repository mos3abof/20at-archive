[[comments]]
order = 5
subject = "شكر"
author = "أحمد الهواري"
posted = "2006-11-21"
text = "أولا أحب أن أشكر كل من قرأ المقال وعلق عليه، وأردت أن أوضح بعض النقاط لابن بهية، والشمحطجي.<br />الشمحطجي<br />أولا: اسمحلي أسجل اعتراضي علي وصفك \"وصلة الغزل الي واضح انه مش عفيف\" لأنه اذا كان من حقك أنك تشوفه غزل وتعبر عن رأيك فمن حقي أرد وأعترض علي وصفك.<br />ثانيا: أنا ماليش دعوة بالشبهات الأمنية حول حمدي رزق، أنا اللى يهمني أسلوب كتابته وأعتقد أنه كاتب متمكن من أدواته.<br />ثالثا: بالنسبة لكلمة \"عمنا\" ففي 3 نقاط، الأولى أن استخدام صيغة نحن في اللغة العربية يفيد تفخيم المتحدث أو المتحدث اليه ودي مش اللى أنا قصدتها، الثانية أن كلمة \"عمنا\"، كلمة دارجة يستخدمها العوام مثلي عند الأشارة الى بعض الناس مثل \"اتفضل ياباشا.. يا عمنا.. يا حج.. الخ\"، الثالثة أحيانا كلمة عمنا تستخدم للسخرية مثل \"ولا إيه يا عمنا\".<br />ابن بهية<br />أشكرك أولا أن تعليقك علي هذا الموضوع كان علي المقال أو كاتبه وليس خارج السياق.<br />ثانيا أنا لم أنكر أني فرد وأعتقد أنه واضح جدا أن الموضوع محل التعليق عبارة عن رأي شخصي.<br />ثالثا بالنسبة لكلمة عمنا أحيلك إلي أعلى التعليق.<br />وشكرا"
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124073205/http://masr.20at.com:80/article.php?sid=1189"

[[comments]]
order = 6
subject = "احمد الهواري..اسمحلي \"تاني\" !"
author = "الشمحطجي"
posted = "2006-11-21"
text = "متشكرين على ردك ...دي واحدة<br />التانية : بالنسبة لردك ليه عليه تعليق بسيط وهو ان الرد اتكون من نقطتيين أولها ان كون ان حمدي رزق ليه تعامل مع امن الدولة من عدمه دي حاجة مش مهمة قوي بالنسبة ليك ودي اختلف معاك فيها لأن الصحفي يا عم احمد \"سمعة\" و\"موقف\" وبالنسبة لحمدي رزق هو من الآخر راجل مشبوه ومكروه في اوساط الصحفيين وسمعته زي الزفت وفي رأيي الي اختلف معاك فيه إن في دنيا الصحافة في حاجات مينفعش إنها تجتمع في صحفي واحد لأن الصحافة كلمة والكلمة أمانة وقيمة وبيتهيألي حمدي رزق لا حافظ على أمانة الكلمة ولا قيمتها وده بشهادة ناس كتير حواليه ومنهم اتنيين صحفيين شغاليين معايا في نفس المكان الي انا بشتغل فيه \"ومش هقولك انا شغال فين !!!\"<br />انقطة التانية استأذنك تراجع تعليقي هتلاقي اني اتكلمت عن مقالات حمدي رزق من الناحية الفنية يعني من ناحية الصياغة وفن الكتابة وريأي انه راجل بيهبش في كتاباته والفكرة في اوقات كتير مبتكونش واضحه وده ممكن يكون راجع لكونه بيحب يوصل رسايل لبعض الجهات بعنها وراجع مقالاته إلي بيوجه كلامه فيها لرشيد محمد رشيد وكلها رسايل متغطية وفيها ريحة مصالح مشتركة متعطلة وده يفهمه الصحفيين اصحاب الخبرة إلي انا واحد مش منهم !!!<br />ده من ناحية المتن أما ناحية السند على رأي اخواننا المشايخ تلاقي اغلبية مقالاته فيها تهبيش ونهش وغير موثقة سواء كانت المقالات دي في الاخوان او في غرهم وده موضوع لو استمرت الصحافة المصرية على النهج ده ...قول عليها السلام !!!<br />ومن الآخر ...انا مش هلاقي اعز منك يا ابو حميد انغشة وازغزغه ومش هيوقع بنا حمدي رزق ..يتحرق حمدي رزق في ستين داهية ...المهم انا وانت يا عسل !!!"
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124073205/http://masr.20at.com:80/article.php?sid=1189"

[[comments]]
order = 7
subject = "الشمحطجى"
author = "انوس بتاع الننوس"
posted = "2006-11-22"
text = "ايه مجمع الفاشلين الحاقدين الملوثين , واحد فاشل لا حد يعرفه ولاسمه عنه مسمى نفسه الشمحطجى وواحد بيلقح جتته , وواحدة لامؤاخذة كان نفسها فى عمكمك وحابس دمكمك ولاتطالتشى العنب , شوية قذورات وصراصير وعجزة , الراجل فى حاله بيكتب مابدا له , وبيطلع فى البرامج وناجح ومؤثر ومقروء وحاجة تفرح اخص عليكم وعلى اهاليكم اللى ربوكم , يازبالة المواقع الاكترونية , وايه الواحد الهوارى انتم فاكرين الواد ده يجرؤ يكتب كلمة واحدة ويرسلها للاستاذ ابو الاساتذة ابو تريكة الصحافة المصرية , ولد تافه قرر يتشهر ويعمل فيها كاتب فعلق على مقال استاذه ومن ده فى السوق بقرشين , راجل واحد يطلع لرزق ويقول اسمه وتليفون لكن كما كتب هو اشباح الكترونية اخر شرمطه"
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124073205/http://masr.20at.com:80/article.php?sid=1189"

