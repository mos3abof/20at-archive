subject = "حمدى رزق مش هايشم رئاسة تحرير المصور"
author = "زكى الدبور"
posted = "2006-11-22"
text = "انا واثق مليون 100 ان حمدى رزق هو كاتب الموضوع وكاتب الردود على نفسة .<br />اصلة مريض بدة من ايام ماكان بياتى روزاليوسف بشبشب من المنوفية مسطح على القطار.<br />انا حاليا بصددكتابة حياتة من البداية والتى هى خليط من محفوظ عجب و محجوب عبد الدايم و ايمن نور.<br />واتمنى ان يحترم قلمة (الغير محترم اساسا) ويتوقف عن سبوبة التليفزيون (هو فية اية)"
archived = "2006-11-24"
capture_url = "https://web.archive.org/web/20061124073205/http://masr.20at.com:80/article.php?sid=1189"
