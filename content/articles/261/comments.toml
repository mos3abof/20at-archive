[[comments]]
order = 1
subject = "مصرى مغترب بالكويت"
text = "ياخوفى من الجامعه الروسيه دى<br />والله احتمال يكون فيه قسم لتعليم الرقص لانهم مشهورين جدا فى الموضوع وماخفى كان اعظم<br />استر يارب وانشاء الله قريبا الجامعه العبريه الاسرائيله<br />يارب استر علينا"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035833/http://www.20at.com:80/article.php?sid=341"

[[comments]]
order = 2
subject = "بيرو"
text = "وتابع: \"ومن المخطط لهذه الجامعة أن تسهم في إعداد وتخريج كوادر مصرية متميزة في هذه المجالات التي ستقوم الجامعة بتدريسها في استجابة كاملة لتلبية احتياجات أسواق العمل المحلية والإقليمية والعالميةمن السيارات اللادا والكسوة الروسي وكذلك تولي عملية البحث عن رئيس جديدانتحاري للشيشان خلفا للي مات علشان كان متعلم في روسيا ...يظهر مفيش فايدة ...أف ونص ياعشرينات احنا قربنا نتخنق من اللي بيحصل لنا حبة أمل يا ناس ,..."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035833/http://www.20at.com:80/article.php?sid=341"

[[comments]]
