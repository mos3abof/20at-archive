subject = "بيرو تاني"
text = "قريبا جامعة جوبا فرع المحلة الكبري والسوربون فرع بني سوف وبنسلفانيا فرع بلبيس والجامعة الامريكية فرع منيا القمح..أما عن جامة القاهرة فيمكن تكون مغلقة للإصلاحات"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035833/http://www.20at.com:80/article.php?sid=341"

