[[comments]]
order = 0
subject = "مسلمة"
author = "مسلمة"
posted = "2006-04-09"
text = "اولا الاحتفال ده غلط اساسا بالطريقه دى<br />لو عايزين نحتفل بنبينا حقيقى نعود تانى لسنته \"مش ناكل حلويات\"<br />انا عندى اقتراح: ايه رايكم نحفظ 3 احاديث منعرفهاش فى اليوم ده وندعوا اصحابنا للمشاركه معانا<br />حقيقى فكره جميله جاتلى دلوقتى حالا<br />وانا عايزه اقول للكاتب ان العروسه الحلاوه موجوده فى المناطق الشعبيه زى\" شبرا\"<br />اللهم ارزقنا حبك وحب نبيك اللهم اهدنا الى العمل بكتابك وسنه نبيك"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216072243/http://masr.20at.com:80/article.php?sid=144&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "مولد ايه"
author = "اروى"
posted = "2006-04-09"
text = "يا جماعة هو الرسول كان طلب من سيادتكم المسخرة اللى بتتعمل دى الرسول عاوزنا نمشى على خطاه مش نشترى عروسة مولد وحلاوة مولد وبعدين ما فيش حاجة اسمها مدد يا رسول الله لان الرسول هو من البشر ومن عباد الله لا يمنح المدد فاذا اراد المدد احد فليطلبه من مانحه وهو الله عز وجل وبعدين اقلها حاجة نعملها ان احنا نحافظ على صلاتنا بدل ما نطلع فى الزفة اللى بتدل على التخلف"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216072243/http://masr.20at.com:80/article.php?sid=144&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "اتقوا الله"
author = "سؤال بس لاروى... هو انتى (بنت الانصار:) )؟ ياريت تردى"
posted = "2006-04-09"
text = "لو انتى هأكلمك على المسينجر<br />بالنسبه لموضوع الاحتفال بالمولد النبوى فهو بدعه<br />وكل بدعه ضلاله وكل ضلاله فى النار لان مفيش حاجه تثبت ان الصحابه او التابعين احتفلوا بالمولد<br />النبوى<br />والمفروض ان الرسول دايما فى بالنا بالصلاة عليه او بالسنن اللى المفروض بنعملها كل يوم<br />والمفروض بدل ماناكل حلاوة نشوف السنن المهمله اللى هتلاقى تلات تربع الناس اللى بتحتفل بالمولد مبتعملهاش ونعملها ونواظب عليها<br />يا خوانا بطلوا النوم اللى انتوا فيه ده الرسول بيتسب ويتهان والناس قاعده تاكل حلاوة اتقوا الله<br />بدل ما نضيع الفلوس فى الكلام الفاضى طلعوها صدقه ولا اتبرعوا بيها لاخوانا فى فلسطين<br />والله هو دا اللى هينفعكم مش الحلاوة<br />وحاولوا تصوموا يوم الاتنين سنه عن الرسول صلى الله عليه وسلم<br />واذكر نفسى واياكم بصيام الثلاثه ايام البيض (11و12و13)من كل شهر<br />وهى توافق من الشهر الحالى (ربيع الاول) ايام ( الثلاثاء والاربعاء والخميس)"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216072243/http://masr.20at.com:80/article.php?sid=144&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "اسلام اون لاين"
author = "ويقول الدكتور مصباح حماد، وكيل كلية الشريعة والقانون بجامعة الأزهر: \"جرت عادة الأمم على الاحتفال بذكرى مولد عظمائهم، تذكيرا بهم وبأعمالهم. والمسلمون في هذا كغيرهم؛ يحتفلون بذكرى عظمائهم، ويأتي على رأس هذه الاحتفالات الاحتفال بذكرى ميلاد خير البشر محمد صلى الله عليه وسلم، الذي أضاء ميلاده الكون، وأخرج الناس من الظلمات إلى النور."
posted = "2006-04-11"
text = "ولقد كان الرسول صلى الله عليه وسلم يحب هذا اليوم الذي ولد فيه، وكان يصومه. ومن هنا يمكن القول أنه لا غضاضة في الاحتفال بيوم مولد رسولنا الكريم صلى الله عليه وسلم؛ على أن نسترشد بفعله صلى الله عليه وسلم فيكون الاحتفال بالعبادة والصوم، وتدبر معاني القرآن الكريم، واستعراض سنته، فما بعث الرسول صلى الله عليه وسلم إلا ليتمم مكارم الأخلاق. ومن مكارم الأخلاق ألا يهتز الرجل اهتزاز المجانين، وألا يرتدي ملابس مهلهلة ممزقة.<br />ويرى الدكتور مصباح أن المسلمين الآن في حاجة للاحتفال بميلاد النبي أكثر من أي وقت مضى؛ تذكيرا للأجيال الصغيرة بنبيهم صلى الله عليه وسلم، ولكي نربي لديهم الاعتزاز والفخر به، دون الوقوع في البدع، ويكفي أن نتذكر حديث الرسول صلى الله عليه وسلم: \"إن الله احتجز التوبة عن صاحب كل بدعة\" (صححه الألباني)."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216072243/http://masr.20at.com:80/article.php?sid=144&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "هو فيه ايه"
author = "بلال"
posted = "2006-04-11"
text = "هو فيه ايه ياجماعة هي الاخت دعاء كفرت يعني ولا جابت حاجة من عندها ، هو احنا هانضحك على بعض مين فيكم ماجابش حلاوة في بيته يوم المولد ومين قدر يمنع والدته من الطبيخ المعتبر يوم المولد هي قالت انها نزلت وجايت اللي في الشارع يعني احنا كلنا عارفين ان مصر كلها بتحتفل وبعدين هو ايه المانع اننا نشتري حلويات وبرضه نصلي ونصوم ونذكر النبي وندعي ربنا، وفيه اراء كثيرة جدا اقرت الاحتفال بالمولد النبوي الشريف لكن الاعتراض على طريقة الزار والموسيقى لكن في الاخر كل ده فعلا بيحصل وياريت نبطل ندفن راسنا في الرمل زي النعامة"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216072243/http://masr.20at.com:80/article.php?sid=144&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "متباركين"
author = "محتار"
posted = "2006-04-17"
text = "السلام عليكم<br />متباركين بالمولد النبوي الشريف<br />وكل عام وانتم بخير<br />يستحسن على الناس ان يهتموا في ليلة المولد بذكر فضائل ومناقب رسول الله صلى الله عليه وآله وسلم حتى الناس يتعلموا ويتعرفوا اكثر على شخصية الرسول (ص)<br />وينشدون المدائح والتواشيح في حقه ...<br />افضل من العرائس والأشياء الجانبية الأخرى"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216072243/http://masr.20at.com:80/article.php?sid=144&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "اصحوا؟!.."
author = "مسلمة حقيقية"
posted = "2006-05-08"
text = "قال الرسول صلى الله عليه و سلم \"للمسلم عيدان عيد الاضحى و عيد الفطر\"<br />لم يقل عيد مولد النبي او الميلاد او الام.. اي ان هذه الاعياد بدعة و متبع البدعة ملعون اي مطرود من الجنة..هل هذا ما تردون من اتباعكم للبدع؟!..<br />اتقوا الله و ارجعوا امة محمد صلى الله عليه و سل..و الرسول في قلوبنا ليس بحاجة الى يوم مخصص له و ننساه باقي الايام..ان الحديث الذي ذكرته صحيح و ان لم تصدقوني فاسألوا اهل الذكر الصالحين و ارجعوا لكتب الاحاديث..و الله يهديكم.."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216072243/http://masr.20at.com:80/article.php?sid=144&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "ما بالكم؟!.."
author = "مسلمة حقيقية"
posted = "2006-05-08"
text = "قال الرسول صلى الله عليه و سلم \"للمسلم عيدان عيد الاضحى و عيد الفطر\"<br />لم يقل اعياد مولد النبي او الميلاد او الام و غيرها من البدع..<br />و ان متبع البدعة ملعون..اي مطرود من الجنة..<br />فهل هذا ما تريدون؟!..<br />و انا اثبت ان الحديث الذي ذكرته صحيح..و ان لم تصدقوا فاسألوا اهل السنة و عودوا الى كتب السنة..و ان محبة الرسول في قلوبنا..فلا نذكره يوم و ننساه سنوات!..هداكم الله اللهم امين.."
