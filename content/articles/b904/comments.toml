text = "حزنى عميق .. جرحى انت يا وطنى<br />كلمات فاروق جويدة وهى الاكثر تعبيراً عن حالنا كلما فكرنا لماذا نحن على ماهو عليه.<br />لكن دائماانتهى لنفس النهاية هناك معانى جميلة مازالت قوية داخلنا رغم الاحساس الصعب بأنك يحكمك شخص غبى، وشكرا على نصيحة البغال لبعضها"
