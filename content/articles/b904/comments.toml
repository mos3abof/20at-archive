[[comments]]
order = 3
subject = "نشيد رفض"
author = "معاذ محمود عامر"
posted = "2006-06-15"
text = "أريد أن أقول لا, (ما أجمل اللاءات) ما أعظم الرفض المناضل حين يهتف حانقا, لا! لا! لا! لا! ما أشرس العبرات, حين تهطل من عيون العاشقين البائسين. ماأشرس الآهات حين تخرج صارخات من صدور الغاضبين. انني حنق حزين, تائه متذبذب, فكل شئ لا يبين, الا اذا ما قلت لا! فانني قد صرت رب الموقنين, بأن نصرا لن يضيع, قد يبطئ الخطوات لكنه سيجئ, سيجئ بالعشق المبين, لكنه سيجئ, سيجئ بالوطن الوضئ, سيجئ بالعـــــدل المضئ. (حد يقوللي رأيه في كتابتي أنا 17 سنة)للمراسلة والنبي: mizo_bns2011@yahoo.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125345/http://www.20at.com/article2.php?sid=904"

[[comments]]
order = 4
subject = "مصر امانه فى ايديك يا رافت"
author = "عبد الرحمن الداخل"
posted = "2006-06-16"
text = "اخى الكريم اشكرك جزيل الشكر على الموضوع المميز تذكرت وانا اقرا الموضوع الكلمه الشهيرة التى كان يطلقها محسن ممتاز لرافت الهجان وهو ذاهب الى اسرائيل ان مصر امانه فى رقابتك يا رافت<br />ونرى رافت الهجان وهو فى اسرائيل يبكى عندما يسمع مكروة عن مصر وعن زعيمها جمال رغم ما فعله وقتها جمال فى الشعب من ظلم من نادا بالدين ولكن لاعليك من هذا وانظر معى كيف كان الشعب وقتها على قلب راجل واحد اى نعم الراجل دا خان الشعب فيما بعد بفضيحه مدويه من العيار الثقيل بنكسه مروعه ولكن ايضا دعنا من ذالك المهم ان الشعب برضك على قلب راجل واحد وعلشان على قلب راجل واحد بيموت راجل وبيجى راجل تانى بينهض بالامه لما عرف كلمه السر فى النصر وهى الله اكبر فبيقولها وبيننصر فى 73 معركه العاشر من رمضان وسريعا بينسى كلمه السر التى كانت السبب فى نصرة وما ان نساها الا وجاء ما ينسه ايضا نفسه ثم بعد ذالك يا تى رجل اخر ليبحث عن القلب الذى من خلاله يجمع الناس على تلك الجمله التى سائمها الشعب<br />ولكن مع طول البحث ينشغل بما هو فى نظرة افضل بكثير حب المال وتفرقه الرجال ...........<br />المهم حتى لا اطيل اريد ان اقول الكلمه اللى انا ايضا بدور عليها هو سؤال ويا ريت من يرد عليا فيه<br />يا ترى هل لو احد اليوم من ملاين الشباب قيل له ما قالها محسن لرافت اقصد هنا رافت الهجان فما تكون الاجابه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125345/http://www.20at.com/article2.php?sid=904"

[[comments]]
order = 5
subject = "الى منى سليم"
author = "رائد بغدادي"
posted = "2006-06-16"
text = "منى تعب الكلام من جور الحكام<br />الإعدام أخف عقاب<br />يتلقاه الفرد العربي.<br />- أهناك أقسى من هذا؟<br />- طبعاً..<br />فالأقسى من هذا<br />أن يحيا في الوطن العربي!<br />أنا لا أدعو<br />إلى غير السراط المستقيم…<br />أنا لا أهجو<br />سوى كل عُتلٍ و زنيم…<br />و أنا أرفض أن<br />تصبح أرض الله غابة<br />و أرى فيها العصابة<br />تتمطى وسط جنات النعيم<br />و ضعاف الخلق في قعر الجحيم…<br />هكذا أبدع فنّي<br />غير أني<br />كلما أطلقت حرفاً<br />أطلق الوالي كلابه<br />آه لو لم يحفظ الله كتابه<br />لتولته الرقابة<br />و محت كلّ كلامٍ<br />يغضب الوالي الرجيم…<br />و لأمسى مجمل الذكر الحكيم…<br />خمسُ كلماتٍ<br />كما يسمح قانون الكتابة<br />هي:<br />(قرآن كريم..<br />صدق الله العظيم)<br />أنا لو كنت رئيساً عربيا<br />لحللت المشكلة…<br />و أرحت الشعب مما أثقله…<br />أنا لو كنت رئيساً<br />لدعوت الرؤساء…<br />و لألقيت خطاباً موجزاً<br />عما يعاني شعبنا منه<br />و عن سر العناء…<br />و لقاطعت جميع الأسئلة…<br />و قرأت البسملة…<br />و عليهم و على نفسي قذفت القنبلة<br />بالتمادي…<br />يصبح اللصّ بأوربا<br />مديراً للنوادي…<br />و بأمريكا…<br />زعيماً للعصابات و أوكار الفسادِ…<br />و بأوطاني التي<br />من شرعها قطع الأيادي…<br />يصبح اللصّ<br />رئيساً للبلاد…<br />قال: مالشيء الذي يهوي كما تهوي القدم ؟<br />قلت: شعبي…<br />قال: كلا… هو جلدٌ ما به لحمٌ و دم…<br />قلت: شعبي…<br />قال: كلاّ… هو ما تركبه كل الأمم…<br />قلت: شعبي…<br />قال: فكّر جيداً<br />فيه فمٌ من غير فمْ<br />و لسان موثقٌ لا يشتكي رغم الألم<br />قلت: شعبي…<br />قال: ما هذا الغباء ؟!<br />إنني أعني الحذاء !<br />قلت: مالفرق؟<br />هما في كل ما قلت سواء !<br />لم تقل لي أنه ذو قيمةٍ<br />أو أنه لم يتعرض للتهم.<br />لم تقل لي هو لو ضاق برِجلٍ<br />ورّم الرِجل و لم يشكو الورم.<br />لم تقل لي هو شيءٌ<br />لم يقل يوماً… (نعمْ) !<br />وأخيرا يامنى لكي ((نصيحة البغل المستنير))<br />قال بغلٌ مستنير واعظاً بغلاً فتيا:<br />يا فتى إصغِ إليّا…<br />إنما كان أبوك امرأ سوءٍ<br />و كذا أمك قد كانت بغيّا.<br />أنت بغلٌ<br />يا فتى… و البغل نغلٌ<br />فإحذر الظن بأن الله قد سواك نبيّا.<br />يا فتى… أنت غبي.<br />حكمة الله، لأمرٍ ما، أرادتك غبيّا<br />فاقبل النصح<br />تكن بالنصح مرضياً رضيّا<br />أنت إن لم تستفد منه فلن تخسر شيّا.<br />يا فتى… من أجل أن تحمل أثقال الورى<br />صيرك الله قويّا.<br />يا فتى… فاحمل لهم أثقالهم مادمت حيّا<br />و استعذ من عقدة النقص<br />فلا تركل ضعيفاً حين تلقاه ذكيّا.<br />يا فتى… احفظ وصاياي<br />تعش بغلاً،<br />و إلاّ<br />ربما يمسخك الله رئيساً عربيّا !<br />لافتات<br />الجزء الخامس<br />أحمد مطر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125345/http://www.20at.com/article2.php?sid=904"

