[[comments]]
order = 0
subject = "شكراً"
author = "معاً نحو صحافة خالية من النفاق"
posted = "2006-06-05"
text = "أشكرك من كل قلبي على هذه الفصول الرائعة التي أختصرت السنوات التي يعيشها المواطن العربي كل يوم، ولكن السؤال هو إلى متى سنبقى في هذه الفصول وغيرها من الفصول التي ربما لم يتسع للكاتبة ذكرهاهنا، وهل نحن فعلا مؤهلين لما نطلبه أم اننا فقط شعوب فوضوية نطالب بالتغيير فقط لأننا نريد التغيير وليس لأنه حق مشروع لنا، ونطالب بالتغيير بشكل فوضوي لن يزيد حكوماتنا الا تعنتا واصرارا بسبب المرتزقة والمطبلين لهم، والذين لا يفكرون سوى في مصالحهم الشخصية، تحية من كل قلبي لمن أبدع في هذا المقال وتحية خاصة على المقطع الصوتي المرفق. شكراً"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125345/http://www.20at.com/article2.php?sid=904"

[[comments]]
order = 1
subject = "مش عارف اقول اية"
author = "lost soul"
posted = "2006-06-06"
text = "اولا احب اشكرك على هذا الموضوع الرائع<br />اما بالنسبة لحكاية حب الوطن احب اسال سؤال هو يعنى اية وطن؟؟؟<br />انا حاسس ان النظام بيحاول يكرة الناس فى الوطن علشان لمل البلد تضيع محدش يسال و لا يزعل.<br />يعنى انا مثلا حاسس انى منفى فى بلدى مش شرط يكون النفى دة مادى هو نفى معنوى و نفسى و اعتقد ان دة اصعب شىء على المواطن انة يحس بالغربة فى الوطن .<br />مش لاقى احسن من كلمات العبقرى الثائر احمد مطر<br />المعجزات كلها فى بدنى<br />حى انا لكن جلدى كفنى<br />اسير حيث اشتهى,ولكننى اسير<br />نصف دمى بلازما و نصفة خبير<br />مع الشهيق دائما يدخلنى ,ويرسل التقرير فى الزفير<br />وكل ذنبى اننى امنت بالعر و ما امنت بالشعير<br />فى زمن الحمير<br />لا للتمديد<br />لا للتوريث<br />الحرية لمصر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125345/http://www.20at.com/article2.php?sid=904"

