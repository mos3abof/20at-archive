[[comments]]
order = 9
subject = "رد على ابن بهيه"
author = "مصرى متغرب"
posted = "2006-08-30"
text = "اولا اسجل اعجابى الشديد بأرائك على كل المواضيع فأنا بعد قرائتى لاى موضوع ابحث عن تعليق لك علية ثم ابدأ قراءة باقى تعليقات الاخوة الافاضل واسمح لى ان اعلق على تعليقك اليوم<br />انت تسأل اين الجيش فى حين يعتبر البعض تدخل الجيش والمتمثل فى ثورة يوليو اكبر كارثة فى تاريخ مصر تصورليس هذا وفقط بل ويرون ايضا ان تأميم القناة وبناء السد من الكوارث ايضا لهذا الحد وصلنا ياعزيزى<br />وصلنا ايضا الى اننا لانستطيع التحاور فكل مقتنع ان رأية هو الصحيح واذا افهمتة واقنعتة برايك اتهمك بالتخلف وربما كفرك ايضا والعياذبالله بل وسبك بأقبح الالفاظ<br />اذا كان همنا من سيحصل على الدورى فى الوقت الذى يموت فيه الاف من الشعب المصرى بدون مقابل وتنقلب الدنيا لان فلافيو احرز هدفين بعد موسمين عجاف<br />اذا كنا حتى غير متفقين هل ندعم حزب الله اولا وكأنة منثظرا لدعمنا فاذا ايدناه حتى بالرأى يخرج علينا الجاهبزة بأننا كفار لاننا نؤيد حزب الله وكأن اسرائيل ملائكة ونحن لاندرى<br />هل رأيت شعبا يشوه زعماؤه مثلما نفعل بل وفى هذا الموقع المحترم خرج علينا القراء الافاضل بأن من يذكر عبد الناصر هم دراويش عبدالناصر ؟؟؟ثم يخرج علينا اخرون باننا لابد ان نترك مبارك يفعل مايريد لاننا لاندرى من هو البديل<br />صدقنى وانا استمع لبرنامج العاشرة مساء امس تأكدت تماما انة لا امل فى اصلاح او تغيير لان كل شيء فى البلد يريد ان يزال ويبنى من جديد على اساس نظيف فهل نحن قادرون"
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

[[comments]]
order = 10
subject = "لا يصلح لا يصلح"
author = "جمال مبارك لا يصلح أن يكون حتى مدرس فى حضانة لإنه لم يتربى إلا على نعيم مصر المنهوب فكيف سيشعر بألم الشعب"
posted = "2006-08-30"
text = "أقل كفاءات مصر أفضل منه<br />أنظروا إلى فساده هو وعائلته فماذا يعدون فيه غير التزود بمزيد من الفساد والإبداع فيه<br />ياريته يعد على يد أساتذه الفقه والدين ليعرف مصيره هو وأبوه ويتقى الله فى شعبه ويترك مصر لمن يخاف الله فى أبنائها أفضل له ولنا كثيراً"
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

[[comments]]
order = 11
subject = "مصر مصر مصر"
author = "حسبنا الله ونعم الوكيل ، انا فعلاً حزين علي هذه البلد التي اصبحت نهب لمجموعة من الفاسدين الذين لا يراعون مصلحة هذا الشعب المسكين اصبح الشعب المصري كالايتام علي موائد اللائام ، ليس هناك من يدافع عنه او يرعي مصالحة اصبحت حياة الشعب المصري معاناة يومية من أجل الحصول علي ابسط الحقوق ، الحزب الحاكم ومن خلال قيادته عملت خلال السنوات السابقة علي الاطاحة بكل الرموز والكفاءات التي تصلح لقيادة مصر، حتي نصل الي المرحلة الحالية وهي مرحلة اين البديل ،الفئة الحاكمة تريد ان تجعلنا نعتقد انه لا يوجد بديل الا واحد فقط واللي تعرفه احسن من اللي ما تعرفوش ، عندما تنظر من حولك لدول المنطقة مثل الامارات ودول الخليج الاخري يزعل فعلا عما آلت اليه اوضاع بلدنااحنا فعلاً نستحق احسن من كده ، حسبنا الله ونعم الوكيل."
posted = "2006-08-30"
text = "اصحوا يا مصريين قبل فوات الاوان"
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

[[comments]]
order = 12
subject = "هوه ده الإعداد الصح"
author = "الله يخرب بيتك يا جمال وتغور فى داهية"
posted = "2006-08-30"
text = "فساد نجلى رئيس الجمهورية<br />يشارك كل من علاء و جمال مبارك على سبيل الرشوة و البلطجة بحصص مجانية تبلغ 50 بالمائة فى رأس مال كبرى الشركات التجارية و الصناعية بمصر و كان من نتيجة فرض هذة النسبة المرتفعة جدا على هذة الشركات أن هذة الشركات أصبح يتهددها خطر الافلاس و الانهيار وقد تم طرد نسبة كبيرة من العاملين بها مما أسهم فى زيادة نسبة البطالة و ارتفاع معدلات الكساد. و مما زاد الطين بلة أن جمال و علاء يفلسان و يطفشان من السوق من لا يدفع لهما و يستمر فى السوق مع ذلك و بكل بجاحة لينافس الشركات التى تعطى لهما حصة مجانية برأس المال مما أدى الى خروج الألاف من المستثمرين و رجال الأعمال الشرفاء الجادين من السوق و نتج عن ذلك توقف الإنتاج فى معظم الوحدات الإقتصادية بالبلاد و طرد العاملين بها مما أوصلنا الى الحالة الراهنة من البطالة الشاملة و هى نموذج لحالة إقتصادية إجتماعية سيئة لم يعرف العالم مثيلا لها منذ أزمة الكساد العالمى فى نهاية العشرينات من القرن الماضى. و بالرغم أن جمال و علاء شركاء ببلاش يعنى مش دافعين حاجة الا أنهما بسبب جشعهما لا يرحمان شركاءهما و لا يقدرا ظروف الكساد و يرفضا سماع أعذار و حجج فلا بديل عن دفع نصيبهم البالغ 50% و مش مشكلتهما إذا كان شركاءهم خسرانين و لا كسبانين. و من الشركات التى يشارك فيها جمال و علاء بنسبة 50% بالمجان هى: مارلبورو و مترو و هيرميس و ماكدونلدز (منصور)، سكودا (شفيق جبر) ، حديد العز (أحمد عز) ، دريم لاند( أحمد بهجت) ، اية أر تى (صالح كامل) ، فرست (كامل والخولى) ، موفينبيك ( حسين سالم) ، التجارى (الملوانى) ، فودافون (نصير) ، سيراميكا (أبو العنين) ، النساجون (خميس) ، موبينيل (ساويرس) ، هيونداى (غبور) ، الأهرام للمشروبات (الزيات) ، سيتى ستارز (الشربت<br />اقرأ بقية التعليق .."
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

[[comments]]
order = 13
subject = "العصيان المدنى هو الحل"
author = "زنوبه"
posted = "2006-08-30"
text = "لن ينالها وهم متيقنون تماما لهذه الحقيقه ويعيشون فى قلق من مغبة الضغط فى هذا الامر فترة طويرله ـ ما يجدث هو مراوغه لجس نبض الشارع المصرى ـ وآعتقد آن لديهم خطه بديله وآن هذا السيكو ما هو إلا غطاء لما هو آسواء<br />آكرر : العصيان المدتى هو الحل<br />وسيله مؤثره وفعاله وورقة ضغط رابحه بآقل الخسائر البشريه بين جموع الشعب<br />لقد نجحنا نحن المصريون فى الخلاص من المحتل الاجنبى ولم يستطع آى محتل آجمبى الصمود آمامنا فتره طويله. آما المحتل المحلى فهو مثل العمل الرضى يحتاج لكثير من الذكاء والحنكه ... والصبر للخلاص منه بآقل الخسائر . لآنه وببساطه من داخل البيت المصرى يعنى عارف إزاى يلاعبنا<br />ويمكرون ويمكر الله ، والله خير الماكرين<br />العصيان المدنى هو الحل"
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

[[comments]]
order = 14
subject = "لا للتوريث"
author = "حسنى مبارك لا يجد أى غضاضة فى التفاخر بأنة يتخذ من طغاة مثل كل من هتلر و موسولينى و ستالين مثل أعلى لة. و لكن حسنى مبارك لم يقل أبدا من قبل بأنة يتخذ من بوكاسا مثلا أعلى لة أيضا. بوكاسا كان الديكتاتور العسكرى لجهورية وسط أفريقيا فى الفترة ما بين 1966 و 1979 . قام بوكاسا بانقلابا عسكريا على حكم الطاغية داكو فى عام 1966 أعلن نفسة بعدها رئيسا للجمهورية و رئيسا للحزب الوحيد هناك. فى عام 1972 جعل بوكاسا من نفسة رئيسا للجمهورية مدى الحياة . و فى عام 1976 حول بوكاسا نظام الحكم فى جمهورية وسط أفريقيا من جمهورية الى ملكية. و بعد ذلك بعام قام بوكاسا بتنصيب ولدة صلاح الدين رئيسا للوزراء و هو ثانى منصب بعد رئيس الجمهورية أو الملك بعدما توج بوكسا نفسة ملكا على البلاد. و يتسم عهد بوكسا بالقمع الوحشى لكل أشكال المعارضة ضدة و بالافلاس الاقتصادى و السياسى و الأخلاقى"
posted = "2006-08-30"
text = "مثل بوكاسا ، مبارك هو حاكم مصر الطاغية العسكرى. فى عام 1981 نفذ حسنى مبارك انقلابا عسكريا سريعا و دمويا قتل فية الرئيس السادات و أنهى نظام حكمة و تولى هو رئاسة الجمهورية و رئاسة الحزب الوحيد فعليا بالبلاد و هو الحزب الوطنى الديموقراطى. فى عام 1993 جعل مبارك من نفسة رئيسا لمصر مدى الحياة بعدما أخل بتعهدة بعدم تولى الحكم لأكثر من مدتين رئاسيتين تنتهيان فى عام 1993 بل استمر يحكم لفترة ثالثة و رابعة و اذا امتد بة العمر سيستمر فى الحكم فترة خامسة تبدأ فى عام 2005 . و فى عام 1997 حول حسنى مبارك دون اعلان نظام الحكم فى مصر من جمهورية الى ملكية و ذلك بمجرد أن بدأ يخطط جدية لتوريث الحكم لولدة جمال. و فى يوم 28 من سبتمير من هذا العام أو بعد ذلك بوقت قصير سيعين حسنى مبارك ولدة جمال رسميا أو فعليا نائبا لرئيس الجمهورية. جمال مبارك سيصبح رئي<br />اقرأ بقية التعليق .."
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

[[comments]]
order = 15
subject = "الفاجومي"
author = "عاشق زنوبة"
posted = "2006-08-30"
text = "عليا الحرنكش يا ريس مبارك<br />في عصر مزركش ملون بنارك<br />لأبايعك وأبايع حكومة حمارك<br />ملعون أبو اللي يقدر يقاطع قرارك<br />نهارك مقندل وليله مبارك<br />فهمبك وهجس وطلع في روحنا<br />اكيد روحنا طالعة تشاهد جمالك<br />جمالك مبارك وسوزانك سوزانا<br />يا محلا حصارك لمصر اللي جالنا<br />أؤيد وأبايع فخامة جلالتك<br />وأؤيد أي واحد بيمسح ريالتك<br />ولأنك سر باتع حننسي هبالتك<br />علي تل مصر يا ريتك تهيص<br />خرابة فسيحة عليها متيس<br />وأأمر تتطاع فشعبك مهيس"
