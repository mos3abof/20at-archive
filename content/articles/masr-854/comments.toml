subject = "اليكم.....ايها المناضلون امام الشاشات"
author = "محمود"
posted = "2006-09-02"
text = "انا بتجنن كل ماقرأ كمية التعليقات السياسية في الموقع ده؟؟؟؟؟؟؟؟ يعنى لما البلد مليانه ثورجيه و عالم فاهمه و ناس بتدور علي حقها و الرجاله لسه ما خلصوش من البلد.. ليه الواحد كل اما ينزل مظاهره مايلاقيش معاه غير يالاخوان يابتوع كفاية. وياما فى الجامعة نحاول نقنع الناس بالمشاركه وانها متخافش وانها تدور على حقها.مانلاقيش غير الخوف ..ثم ..الخوف..وكمان الخوف.<br />ولما تيجى الانتخابات نقول للناس رشحوا نفسكم ولاحتى روحوا انتخبوا ماتلاقيش غير الخوف..ثم الخوف..والمزيد من الخوف<br />وللي يشلك انك تبقى ماشى في مظاهره وتلاقي واحد خروف ساحب معزه ومعديين يضحكوا علي المظاهرة وتروح تكلمهم وتقلهم انا بطالب بحقي وحقكم تلاقيه عمل فيها غاندي وهي عملت فيها جميله ابوحريد .<br />لا وبقيت تلاقي الشباب عايزه تبرر سلبيتها بانهاتتهم الشرفاء من الاخوان وغيرهم من كفاية بسوء النوايا واكلاشيهات التهم الجاهزه<br />صدقوني احنا نستاهل اللى بيحصلنا. طول مااحنا بنخاف من الخوف وبنخاف على زبالتنا (اققصد حياتنا) اكتر من خوفنا من ربنا.<br />وللي مش مصدق يتفرج علي شباب مصر فى الجامعه فى المولات فى الشوارع حتى الجوامع عشان يعرف اننا نستاهل اكتر من كده.<br />عايز تقول رايك اققف قدام الظالم وقول رايك .عايز حقك روح للى اخده وطالب بيه.<br />انا معرفكمش ولا انتو تعرافونى لكن اكيد هنتفق ان البلد دي محتاجه مننا اكتر من اننا نشتم مبارك وابنه عن طريق اسم مستعار واحنا قاعدين قدام الكمبيوتر تحت التكييف."
archived = "2006-09-02"
