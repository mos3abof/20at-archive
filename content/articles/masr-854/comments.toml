[[comments]]
order = 6
subject = "لازم الرفض الكامل للشعب"
author = "لازم العصيان المدنى مصر دى بلادنا لازم الأعتراض ده لو جه المتخلف الشاذ المدمن حاكم على مصر معنى كده أننا ها نستمر فى الفساد ده كمان 30 سنة ويمكن أكثر"
posted = "2006-08-29"
text = "ده مدمن وعلى فكرة أسمه موجود فى ملف الشواذ جنسياً والله العظيم<br />ييجى إيه ده جنب الدكتور هشام البسطويسى ولا الدكتور مكى ولا السيد عمرو موسى<br />يا جماعة شوفوا الزعماء زى حسن نصر الله وأنتم تعرفوا الرجالة شكلها إيه وإيه الفرق بينها وبين الشواذ والعملاء والفاسدين<br />لو كان قلبة على البلد كان عرف إن الشعب كله رافضه هوه وأبوه وكان غار فى ستين دهية"
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

[[comments]]
order = 7
subject = "الزعماء لا يعدون"
author = "للى بيقول أن الحزب الوطنى بيعد المتخلف عقلياً وبقية الأحزاب تعد كفاءاتها أحب أقوله أن الكفاءات معده وجاهزة ومش محتاجة إعداد"
posted = "2006-08-29"
text = "أنظروا إلى الدكتور هشام البسطويسى وأنتم تعرفوا كيف تكون الكفاءات معده جاهزه<br />أنظروا إلى الإخوان المسلمين لتعرفوا معنى كلمة كفاءة<br />دول مش محتاجين يتعلموا إزاى يبقوا كفاءات من الفراغ<br />ولتعلموا أن فاقد الشيىء لا يعطيه وهذا المتخلف عقلياً مفتقد لكل الخبرات فهيعدوا فيه أيه<br />تبات تعلم فى المتبلم يصبح ناسى"
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

[[comments]]
order = 8
subject = "عموما"
author = "محمد منير ابو المجد"
posted = "2006-08-30"
text = "للاسف شغلين بالنا بالترشيح ومين يكون الرئيس ومين يكون النائب ..<br />ليه ما يكنش فيه ديمقراطية ويكون تصويت مباشر وتنتهى القصة ويترشح 5 مليون مواطن للرئاسة .<br />للاسف احنا نتكلم فقط وتشتم في بعض كويس جدا وكل واحد سايب شغله وقاعد شاغل نفسه بأشياء اخري حتى انا سايب شغلي وقاعد اكتب هذا الكلام .... عموما يترشح جمال أو غيرة مش دي المشكلة المهم مين ينفع البلد ودة المفروض نتكلم فيه ."
archived = "2006-09-02"
