order = 33
subject = "سؤال واحد بس"
author = "نفسى أسأل حسام بدراوى إنت جيت المجلس إزاى وهل بتعتبر نفسك أصلاً كوادر"
posted = "2006-09-01"
text = "وياريت بالمرة بقى يقولى جمال ده جيه المجلس أزاى وكام مرة أترشح من الشعب للمناصب الهائلة دى إللى هوه فيها فى المجلس<br />ياريت يقولى بالمرة برضوا إيه مؤهلاته هو ولا المحروس جمال إللى خليته يوصل للمناصب العميقة دى فى المجلس مع العلم دى يادوبك بمؤهلاته دى كان زمانه موظف حكومة مرتبه 200 جنية وبس<br />ياريت يعرفوا أن باقى الأحزاب همشت بواسطه المحروس إبنه ولو كنت ناسى أفكرك بالدكتور أيمن نور وأعتقاله بناء على تعليمات ملفقة وتفرقة حزب الوفد والوقيعة بناء على تعليمان من المحروس وبرضوا إعتقال الإخوان بناء على تعليمات من المحروس<br />لما هو ممكن كان يحل مشاكل مصر على رأى إللى كاتب كان قاعد بيهبب إيه فى لجنة السياسات وطاير بين المحافظات علشان يعمل شعبية مفتعله ليه رغم معرفته جيداً برفض الشعب كله ليه<br />فساد مجلس الشعب كانت أكبر مصادره شلة أصدقاءه التى أتى بهم للمجلس يبقى فين التطوير إللى ممكن ها يعمله أو التغيير غير مزيد من النهب والسرقة والدليل أصحاب رؤوس الأموال الهائلة فى المجلس وإللى هما اصدقاءه جابوا فلوسهم منين وهو أصلاً جاب فلوسه منين<br />ياريت بقى يعرف إن الشعب دلوقتى وضعه فاهم ورافض ومختلف عن الشعب إللى إتفرض عليه أبوه من 27 سنه فاتت ويراجع دفاتره وينسحب بدون إزعاج ولا خسائر<br />على فكرة نسيت أقوله أنا بكرهك قوى يا جمال يا غير مبارك<br />ونسيت كمان أقوله لو فيه فيلم عن رئيس فاسد ومش لاقيين أى ممثل فاشل ممكن يؤدى الدور ده ياريت يأخذوك ليه أو ربنا أولى بيك اللم آمين"
archived = "2006-09-02"
