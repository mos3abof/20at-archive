[[comments]]
order = 0
subject = "يعنى ها يعملوا فيه إيه"
author = "نفسى أعرف هما بيعدوه يعنى ها يعملوا فيه إيه ها يحموه مثلاً ولا ها يشتروله مريلة جديدة لحضانة الحزب الوطنى إللى إتربى فيها وإيه هيه مؤهلاته إللى أعد نفسه بيها كما أعدت المعاناة الحكام المخلصين أمثال مصطفى كامل وأحمد عرابى وسعد زغلول وغاندى وغيرهم ماذا قدم لمصر غير المتاجرة بألامها وديونها ليكون ثروته الهائلة التى بدون حدود أقصى"
posted = "2006-08-29"
text = "مهو سابق الأعداد والتجهيز الم ينشأ ويترعرع على أيد أكبر دكتاتور خائن عرفه العالم أليست أموال المصريين المنهوبة التى تربى عليها غير كافية لإعداده على النهب والسرقة والفساد أليس إنتمائه إلى أمه اليهودية كفيل بكراهية كل ما هو أسلامى وعربى أذا ماذا تبقى له من إعداد<br />ألم يحتمى بالحثالة كما يحتمى أبوه ألم يكن المشرف الأول على تزوير الإنتخابات لأبوه<br />أعتقد أنه معد الإعداد الكافى ليطيح بالمصريين كما أطاح أبوه ومن شابه أباه فما ظلم وحسبى الله ونعم الوكيل"
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

[[comments]]
order = 1
subject = "هل الخبرات تعد"
author = "المعاناة تصنع الرجال والخبرات لا تأتى إلا بالممارسة وماذا مارس هذا الشاذ غير النهب والسلب وهل الخبرات تكتسب بالتحفيظ"
posted = "2006-08-29"
text = "أنهم يعدون ممثل رديىء مفتقد لكل الخبرات ليمثل دور حاكم فاسد<br />أين خبرائك يامصر الذين أعدهم ظلم مبارك وخلق منهم كفاءات وكوادر<br />أين أنتم ياقضاة مصر الأكفاء لتتركوا مصر لهذا المتخلف<br />أين شعبك يا مصر ليرتضى لمثل هذا الفاسد حاكم بعد أن أنجبت الشرفاء والفكاءات<br />أين الإخوان المسلمين الذين رشحهم الشعب عن حب وأقتناع وقاسوا الأمرين من حكم هذا الفاسد حتى يسمحوا بإعداد الفاسد ليتولى إدارة بزنس مصر"
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

[[comments]]
order = 2
subject = "ومن البديل"
author = "اشرف"
posted = "2006-08-29"
text = "اللزين يهاجمون ترشيح السيد جمال مبارك اليس من حق الحزب الوطنى ان يعد مرشحا لة من الان ما العيب فى زلك اليس هزا من اولويات اى حزب لة وجود بدلا من معارضة ترشيح جمال مبارك وهزا حق يكفلة لة الدستور يجب المطالبة باشراف قضائى كامل يضمن نزاهة اى انتخابات تجرى فى المستقبل وكزلك اعداد مرشح يكون قادر على منافسة مرشح الحزب الوطنى كائنا ماكان اما البكاء والندب لمجرد ترشيح الحزب لجمال مبارك فهزا دليل العجز وعدم وجود شخص يتفق علية الجميع لمنافسة جمال مبارك"
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

[[comments]]
order = 3
subject = "الجيش المصري فين ؟؟ وساكت ليه ؟؟؟؟؟"
author = "إبن بهية"
posted = "2006-08-29"
text = "الجيش المصري فين ؟؟ وساكت ليه ؟؟؟؟؟<br />بالأمس صرح أحد أفراد عصابات مبارك (حسام بدراوي النصاب بتاع مجزرة \"\"عفواً\"\" مستشفى بدراوي بالمعادي) أن جيمي مبارك وده إسمه الحقيقي البريطاني .. أن جيمي هو من يصلح لقوادة مصر في المرحلة المقبلة .. بدأت اسطوانة التوريث تذاع في وسائل الإعلام بعد سنوات من التسجيل والمونتاج والإخراج ... بدأنا نسمع أولى وصلاتها الداعرة ... طيب لإمته يا بلد ؟؟؟ والجيش فين من المصيبة دي ؟؟؟ الجيش المصري اللي بياخدوا مرتباتهم من جيوبنا ومن دم مصر فين ؟؟؟ فين القسم اللي أقسموه على أنفسهم بحماية الوطن ؟؟ طيب وفين الحماية دي ومبارك وعصاباته بيبيع في مصر لليهود حتى حتة .. الجيش مستني إيه ؟؟؟ ولا الجيش مستريح ومالوش دعوة تتحرق البلد والناس ؟؟؟ طبعا مبارك ضاحك عليهم بقرشين زيادة في المرتبات وعايشين في فيلات وقصور وليهم كل الخدمات والمصايف والشقق وحتى السلع التموينية ليهم بأسعار غير خلق الله في جمعياتهم العسكرية ... يعني دول سكان عندنا بس ما لهمش دعوة بالبلد .. لأنهم ببساطة مش مكويين من مبارك وعصاباته زينا ... يبقى هيتصرفوا ازاي وليه ولمصلحة مين ؟؟؟ طالما كل مصالحهم متظبطة وزي الفل ... يتحرق الشعب ... بس ده حرام يا باشوات يا جيشنا العزيز ... لأنكم بكده بتبيعوا القسم بتاعكم بحماية البلد ... بتبيعوه بشوية فلوس وعمارات ومصايف .. ارجعوا إلى ربكم وحرروا مصر من ذلك الخائن وعائلته وعصاباته ...<br />إبن بهية<br />http://ibnbahya.blogspot.com"
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

[[comments]]
order = 4
subject = "الريس المنتخب بتاع الديمقراطية"
author = "فين الديمقراطية يا ريس"
posted = "2006-08-29"
text = "حبس 17 من قيادات الإخوان 15 يومًا على ذمة التحقيقات<br />إخوان أون لاين - 27/08/2006<br />كتب- محمد عزت<br />قررت نيابة أمن الدولة العليا بالقاهرة مساء الأحد 27/8/2006م حبس الدكتور محمود عزت الأمين العام لجماعة الإخوان المسلمين والشيخ لاشين أبو شنب عضو مكتب الإرشاد و15 من رموز وقياديي الجماعة الذين اعتقلوا الجمعة الماضية بمحافظة كفر الشيخ.<br />ــــــــــــــــــــــــــــــــــــــ<br />يا جماعة هي البلد دي حتنضف امتى حتفضل وسخة كده لغاية امتى<br />بيقولوا ان جماعة الاخوان المسلمين محضورة<br />هو مين اللي يقول محظورة<br />الشعب هو اللي يقرر اذا كانت محضورة ولا لأ<br />مش شوية الزبالة البلطجية اللي بيحكموا البلد<br />ذنبهم ايه وذنب اسرهم ايه<br />تحب حد يعمل فيك كده يا ريس<br />تحب حد يقبض عليك ويوديك السجن يا ريس ظلم وعدوان"
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

