text = "الى كل اللى هاجمونى واتريقوة على تعليقى اولا -- صدقونى واللة العظيم انى اول ماقرات كلام د حسام بدراوى فى جريدة الوفد اتتابنى الغيظ واحسست بالمهانة لهذا الشعب ---- ثانيا عندما قررت ان اكتب هذا التعليق كان الدافع لى هو اثارتكم حتى استمتع بالردود والتعليقات ------ ثالثا تفتكروا فى مصرى عاقل يوافق على التوريث دةحتى مايبقاش مصرى ----- رابعا اقدم اعتذارى لكل اللذين استشاطو غضبا من تعليقى----- ملحوظة---- فى التعليق الاول حرف ال ذ كان معطلا فاستخدمت حرف ال ز بديلا لة فارجو المغفرة --------- واخيرا وليس اخرا اقولها باعلى صوتى لا للتوريث لا للتوريث"
