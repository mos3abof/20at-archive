author = "للإستاذ إللى بيقول رشحوا حد أحب أقول له الكوادر موجوده مش لسه بنطبخها وبنحضرها وبنحميها ونلبسها ونعلمها إزاى تتكلم"
posted = "2006-09-01"
text = "يا عمنا القيادة خبرة عملية ومعاناة وإحساس بالشعب مش تسكن فى قصور الشعب المنهوبة من دم الفقراء وتركب طياره من خير مصر وتتنقل بيها وتلبس إللى كل الشعب لا يستطيع أن يشترى ما تلبسه من دماء المصريين وتقولى أنه ينفع يبقى حاكم<br />القيادات موجوده جاهزة ألم تسمع عن السياسى المحنك إللى مابعش البلد لأى حد وبيدافع عن مصر ويعلم جيداً كيف يقود مصر للريادة مرة أخرى السيد عمرو موسى ولا السيد سعيد العريان ولا مليون ولا<br />ولما إللى ها يمسك الحكم ها يصرخ زى النسوان أمال ليه مسكين فى البلد بإديكم وسنانكم ومش عايزين تغوروا فى داهية<br />وحسنى مبارك ليه مصرخش زى النسوان وهو بينهب البلد وببيع مصانعها وببيع مصر كلها للأمريكان واليهود ولا الشعب بس هو إللى ها يصرخ لما يمسك الحكم على العموم الشعب فعلاً بيصرخ بس من حكمكم الفاشل الفاسد<br />ولو المحوس ابنه كان عنده حلول لمشاكل الشعب من الفقر والبطالة والفساد النابع منه ومن عيلته واصحابه طيب ليه محلش المشاكل دى وهو رئيس للجنة السياسة فى مجلس الشعب ولا مخبى مفاجأة للمصريين بمزيد من النهب والسلب<br />ده لو ربنا لا يقدر ولا يكون لو مسك الحكم وده مش ها يحصل علشان الشعب رافضه وخلاص أنتهى الدرس ياغبى"
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

