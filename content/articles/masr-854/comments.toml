[[comments]]
order = 20
subject = "طظ فيك وفى إللى خلفوك"
author = "لنا كلمة لابد ان نوضحها فى الجدال الدائر حول تولى جمال مبارك الحكم000000"
posted = "2006-08-30"
text = "1- بداية، الحالة الصحية لجمال مبارك لا تسمح لة بتولى مهام رئيس الجمهورية لانة مصاب و فى مرحلة متأخرة بسرطان الدم و يضطر مثل والدتة التى أورثتة هذا المرض الى السفر الى الخارج للعلاج عدة مرات كل عام بعد أن استنفذ عدد المرات المسوح بها لتغيير دمة.<br />2- تعديل المادة 76 باطل لإن مجلس الشعب باطل أعضاءة نجحوا بالتزوير فضلا عن أن وجود مبارك فى الحكم سببة البلطجة و التزوير كما أن التصويت تعديل المادة المذكورة باطل لما شابة من تزوير.<br />3- جمال مبارك يحمل جنسية أجنبية (الجنسية البريطانية)<br />4- جمال مبارك متهرب من أداء الخدمة العسكرية.<br />4- جمال مبارك مصاب بداء الشذوذ الجنسى و لن يقبل الشعب المصرى أو أى شعب أخر أن يحكمة رئيس لواطى. معظم المقربين من جمال يعرفون إنة على علاقة شاذة بكل من عمر طنطاوى و وليد حافظ الذين جعلهما من أغنى \"رجال\" مصر. حتى زوجة كل من عمر و وليد تعرف بهذة العلاقة الشاذة. يحتفظ جمال ببلايين الدولارات فى حسابات بإسم عمر و وليد فى سويسرا و بريطانيا و أمريكا و النمسا و الباهاما و هونج كونج.<br />5- جمال مبارك مدمنا للكوكايين و الهرويين و الخمر و لا يعقل أن تكون مقدرات هذة الأمة فى يد مدمن.<br />6- جمال مبارك يفتقر الى شرط حسن السمعة اذ أن هناك أدلة و اثباتات بما فيها شهادة الشهود تؤكد أن جمال مبارك شخص منحرف و فاسد. على سبيل المثال يحصل جمال مبارك من رجال أعمال و غيرهم على أموال طائلة على سبيل الرشوة لتوفير مزايا لهم أو على سبيل الأتاوة لمنع أذى عنهم. و طبقا للثابت من الأدلة المتوفرة فجمال مبارك يتاجر فى السلاح و الأثار و يحمى كبار بارونات المخدرات بمصر و منهم محمد منصور و أحمد المغربى و عفت السا<br />اقرأ بقية التعليق .."
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114609/http://masr.20at.com:80/article.php?sid=854"

