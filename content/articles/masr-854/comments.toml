text = "حسنى مبارك استدعى شيخ الازهر وسألة ان يفتى له فتوى ان جمال يمسك الحكم من بعده<br />شيخ الازهر: قاله لا يجوز<br />حسنى : انت بتستهبل ياطنطاوى<br />طنطاوى : ابدا ياريس مش انا اللى بقول كده<br />حسنى : امال مين اللى يقدر يثول كده<br />طنطاوى : ربنا بيقول كده فى القرأن<br />حسنى : ازاى ياطنطاوى<br />طنطاوى : الاية بتقول ( ولا تنكحوا ما نكح ابائكم )"
