[[comments]]
order = 0
subject = "الحيوان الانوي النادر"
author = "أكرم"
posted = "2006-02-25"
text = "هناك ايضا عالم مصري مشهور اسمه دارويش يقول ان الانسان اصله حمار و انه يبحث عن الانسان الانوي النادر ليثبت نظريته و وجد هذا الانسان في شخص شنبو الغلبان لذي وفع في المصيدة و اكتشف انه زعيم عصابه<br />ع العموم مش هرغي كتير شوفوا فيلم شنبو في المصيدة لفؤاد المهندس هتعرفوا مين اللي على حق داروين و لا دارويش<br />اما عن رأيي انا في اصل الانسان فانا بقول ان اصل البني ادم جلدة جنفية و هشرحها في كتيب من 1500 صفحة وش و ضهر بالقطع الكبير ان شاء الله في 2055 هجريه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151314/http://www.20at.com/article2.php?sid=490"

[[comments]]
order = 1
subject = "سمعينا زغروته ياحاااااجه والنبي"
author = "sweet_princess"
posted = "2006-02-26"
text = "لولولولولولولولولولولولولي (نفسي اتقطع ).<br />انا بقى برشح نظرية 4 2 4 واللي مايعرفهاش يشوف الفيلم (4 2 4)بتاع سمير غانم ويونس شلبي وان كنت بميل اكتر للحاج داروين اللي فعلا ثبتت نظريته بعد مامات وشبع موت (امال بوش بيعمل ايه )اما نظرية الحمار فهي تليق على (شارون )اكتر .... صحيح والله عالم تافهه.<br />تركيا بقت بتلجا لتسليك الامور واللي مش مصدقني يشوف فيلم( كده تسبيك كده توليع )والغريبه ان المسلمين ساكتين (هي تركيا دي مش دوله اسلاميه برضه ؟ولا هي انضمت لمعسكر الاعداء ؟)واللي مش مصدقني يشوف فيلم (احنا بتوع الباتوى)هو لسه في السينمات وامانه اللي رايح يشتريلي تذكره معاه عشان انا منفضه ودايخه على جنيه سلف لاول الشهر (اقولكم سلفوني احسن ) وهردهم لما اقبض مصروفي ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151314/http://www.20at.com/article2.php?sid=490"

