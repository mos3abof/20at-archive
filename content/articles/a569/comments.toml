subject = "هو مايكل فاضي لينا؟!"
text = "الفيلم موجه إلى الشعب الأمريكي بالدرجة الأولى.مور لم يفكر في العرب أصلا ولا في ردة فعلهم!!"
archived = "2004-09-26"
