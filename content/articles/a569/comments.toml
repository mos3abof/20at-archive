subject = "مطراوي"
text = "ويا تري مين الواحد التاني اللي إسلوبه يشبه إسلوب عمرو ..<br />شوقتينا نعرف يا سيدة...القصر ولا مؤاخذة ..!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035204/http://www.20at.com:80/article.php?sid=569"

[[comments]]
order = 6
subject = "فكروا معايا"
text = "الكلام عن المطلوب من العرب فعله بعد مشاهدة الفيلم ما هو إلا تاكيد مفهوم لنظرية المؤامرة<br />ربما لا يريد الكاتب ذلك ..لكنه فكر بنفس قوانين لعبة المؤامرة الغبية من اول سطر للمقال وحتي الحرف الاخير ...!!!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035204/http://www.20at.com:80/article.php?sid=569"

