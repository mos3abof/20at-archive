[[comments]]
order = 0
subject = "9-11"
text = "المقال ممتاز ويدل علي تميز كاتبه ..كنت قد قرأت من قبل في اسام اون لاين مقال بعنوان لماذا أخطا العرب في فهم فيلم مور للكاتب مامون فندي وبعدها مقال آخر لناقد شاب بأسم خطا العرب وخطايا بوش<br />الجميل في مقال الأستاذ عمرو عبد الناصر انه جمع بحرفية شديدة-وان كنت اقرا اسمه للمرة الأولي- بين المقالين واضاف عليهما وجه نظره الخاصة عن الفيلم ..<br />الأمر الثاني هو تنبهه لموضوع الرموز والسيدات في فيلم مور ..لقد شاهدت الفيلم من قبل ولم ألتفت إلي هذه المشاهد مطلقا .<br />وأخيرا يبقي السؤال العبقري الذي طرحه الكاتب وأجاب عليه بنفسه إجابة مقنعة ..ماذا يريد مور من العرب بعد أن يشاهدوا فيلمه ..؟؟<br />حقيقي أنا سعيد بأن في الشباب من هو قادر علي النقد البناء بهذه الصورة ...<br />برافو عشرينات"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035204/http://www.20at.com:80/article.php?sid=569"

[[comments]]
order = 1
subject = "سيدة القصر"
text = "أنا متشككة فى شخص كاتب المقال..<br />لأنه قريب الأسلوب من واحد تانى ..<br />ولا إيه ياعشرينات؟"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035204/http://www.20at.com:80/article.php?sid=569"

[[comments]]
order = 2
subject = "سيد القصر"
text = "بس والله موضوع جميل ؛ ورؤية نقدية تستحق التقدير..ومازلت عند رأي.."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035204/http://www.20at.com:80/article.php?sid=569"

[[comments]]
