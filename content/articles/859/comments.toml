author = "عاصم"
posted = "2006-01-22"
text = "موضع كويس وظريف ولكن حبذا لو ابتعدت عن الالفاظ مثل\"عاشق\" فمثل هذه الكلمات لا تليق با النبى ً\"ص\" خاصة فى وقتناهذا والذى فيه العشق له معانى اخرى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 11
subject = "اني انقد و انت تردين"
author = "العبد الفقير الي الله"
posted = "2006-01-23"
text = "انني لم اعلق علي الموضوع لانه خاص بكي لان الوضوع يتحدث عن الرسول عليه السلام وكان نقدي من قبل عن تغير العنوان الذي لا يليق و كيفية مناقشة الموصوع ومن الواضح اني تصرين ويبدو لي اني لم تفهمي معني الرد وهو اقرارك علي عدم قدرتك علي اختيار الالفاظ المناسبة ((ليس معني الرد عدم احترامك لعقول القراء لكن الردلإضاح الموصوع والاعتراف بانكي اخطاتي يبين حسن النوايا وليس العكس))"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 12
subject = "هو ده الحب الحقيقى"
author = "dooody"
posted = "2006-01-23"
text = "اذاكرهنا قصة الب الكبير بين النى محمد والسيدة عائشة كيف كان محمد صلى الله علية وسلم يحب زوجتة حيث كان يتحثث موضع شفاتيها على الكوب وكيف كان يدلعها كان يقول لها يا عويش وكان صللىالله عليه وسلم يسابقاها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 13
subject = "المقال جميل"
author = "ahmed"
posted = "2006-01-24"
text = "المقال جميل جدا ياهبة ولا تلتفتي للناقدين المغرضين فلو شعروابحبك للنبي واتخاذه قدوة فى كل شئ حتى فى الحب لما ارادوا أن يسيئواللمقال والتعبيرات التى استخدمتهانسمعها الأن فلماذا لاتقرب المعنى بهذه الألفاظ أهى حرام ؟أم أنها غير لائقة؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 14
subject = "هبه المقال جميل و لا تلتفتى للنقد الخطأ"
author = "نيفين"
posted = "2006-01-25"
text = "ليه يا جماعه مش عايزين كلمات زى الرومانسيه هو الرسول مش بشر<br />ثم ليه الناس بتفهم كلمه جنتلمان بمعنى متحرر او اباحى دى معتلها ان يكون الانسان انيق ف التعامل بالمقام الاول<br />يا ريت شويه سعه ف التفكير يا جماعه<br />المقال حلو يا هبه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 15
subject = "اني انقد و هي لا ترد"
author = "العبد الفقير الي الله"
posted = "2006-01-25"
text = "كل شيئ يفعله الانسان اما عن يمينهاو عن شيماله فاقول لكي كلمة واحدة حسبي الله ونعمة الوكيل وعلي كل من تسول له نفسه وإن الله يمهل ولا يهمل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 16
subject = "لا حول ولا قوة الا بالله"
author = "كتكوت"
posted = "2006-01-29"
text = "اش هالكلام والافتراء على رسول الله !!<br />ليه الرسول ما عنده غيره على نساءه !!!<br />كيف يرضى ان زوجته صفيه تركب امام المسلمين الجمل على ركبتيه !!<br />كيف يقول للرجلان على رسلكم انها صفيه !! الرسول ما عنده غيره !!<br />كيف ترضون هالاحاديث اللي تقول ان زوجات الرسول يدخلون المسجد وهم حياض !!<br />وربي انكم متخلفين<br />عندي تعلقيات كتيرة بس مستعجل<br />باي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 17
subject = "أحسنت الاختيار"
author = "حسن خميس"
posted = "2006-01-30"
text = "جزاك الله خيرا اخيتى على هذا الجانب المشرق من سيرة الحبيب محمد صلى الله عليه وسلم وما علق عليه الاخوة من كلمات كعاشق فليس هناك حرج ان تم التغيير فالمراد من الموضوع تبيين ان النبى صلى الله عليه وسلم كبشر يحب فالاولى اختيار الكلمات التى تناسب الحبيب<br />ولك كل التقدير على موضوعك الطيب ومحبتك للنبى صلى الله عليه وسلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 18
subject = "لم يعد هناك حب حقيقي"
author = "نوال معزو"
posted = "2006-02-01"
text = "اليلام عليكم ورحمة الله وبركاته وصلوات ربي وسلامه عليك يا شفيعي وحبيبي ورسولي محمدالا تعتقدون اخوتي اننا لانسوى شيئا بدون سيدنا محمد فقد ترك لنا كل شييء ينفعنا حتى الحب الطيب بين الرجل والمراة فقد ترك لنا دلك الحب الطاهر لطيب الجميل البريء الصافي الدي لايشوبه خداع ولا نفاق ولا رياء دلك الحب الدي لم يعد لنا في هدالزمن مثيلا له فاين هم الرجال ليتخدوا من رسولنا اسوة حسنة لهم اين من يريدون المراة العاملة ويتركوا الفتاة الطيبة الملتزمة اين هم رجال الامة اين هم امة الحبيب الم يستوصي بالنساء خيرا اين هي الرومانسية بالله عليكم قولو لي فالرومانيسية هي ان يكون المحب ومن يحبه قد اجتمعوا على حب الله ورسوله الرومانسية الحقيقية ان يصلي الاحبة الفجر معا ان يدكروا الله معا هده هي الرومانسية الحقيقية سامحوني ان اتقلت عليكم اختكم في الله نوال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 19
subject = "من منكم-يا اشبه الرجال- فى شرك نعل الرسول"
author = "أرجوان"
posted = "2006-02-04"
text = "سبحان الله على الحاقدين...اللهم احفظنا.<br />حبيبتى هبه...موضوعك اكثر من رائع...و هو يركز على نقطه يعتبرها الذين يتعبرون انفسهم رجلا-و اعنيها- يعبرونها قله كرامه او ذل.<br />نسوا او تناسو ان الحياه الزوجيه قائمه على الحب و الموده و الرحمه...تناسوا ان الرومانسيه من اهم دعائم بناء حياه زوجيه ناجحه.<br />الاخوه الى مش عاجبهم الموضوع عندكوا اثبات ان الى قالتوا هبه غلط..؟<br />الاخ الى بيقول ان ده افتراء...هات لنا اثبات ان ده محصلش من سيد الخلق كلهم و همه يصححوا.<br />بصراحه انا مستغربه اوى...و مش لاقيه تفسير..<br />هو غيره...و لا عقدة نقص ...و لا ايه بالظبط.<br />الى موش قادر يكتب يكف لسانه عننا الا اذا كان نقدا بناء موش شتايم.<br />فلتقل خيرا لو لتصمت<br />لا تراعى يا هبه...القافله تسير..و عاااااااادى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 20
subject = "معا ننجح.. معا نصنع الحياه"
author = "علي محمد"
posted = "2006-02-06"
text = "بسم الله الرحمن الرحيم<br />الحمدلله وكفى وصلاه وسلاما على حبيبنا المصطفى :<br />الموضوع حلوووووو كثير وممتاز رغم كل ما يقال<br />الواحد منا عندمايريد ان يحكم على الشيء<br />ينظر لماذا طرح هذا الموضوع<br />اكيد طرح للفائده وليس لاجل النقاش اكيد التعليق له فائده بس بطريقه حلوة<br />وهذا هو دائنا نحن نهتم بتوافه الامور<br />وهذا كلام جميل وبارك الله فيمن كتب وافاد اما النقادون الهدامون لهم الله<br />ولنا الله جميعا<br />الى الامام يا اخوتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 21
subject = "بارك الله فيك"
author = "احمد فهمي"
posted = "2006-02-09"
text = "جزاك الله خيرا يا اختي و نسائل الله ان يكون في ميزان حسناتك وكل من سيقرا سيوضع في ميزان حسناتك انشاء الله و اريد على اخي الناقد فهل علمنا الرسول عليهالصلاة والسلم ان ننقد بعض بهذه الطريقة ؟ و كلمة الرومانسية لا تسيأرسولنا الحبيب و هي ملاءمة تماما"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 22
subject = "حبيبي يارسول الله"
author = "ام عادل"
posted = "2006-02-10"
text = "من يكون هؤلاء الكفرة الفجرة لكى يذكروا الرسول الكريم بهذه المهازل واين هم حكام المسلمين من هذه المهازل فاقول حسبنا الله ونعم الوكيل فى الحكام الصم البكم واقول للمسلمين افيقوا قبل ان ياتى التتار فهذه هى البداية والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

