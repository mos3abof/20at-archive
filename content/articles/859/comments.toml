[[comments]]
order = 26
subject = "أيها الجهلاء كفوا أيديكم عن اللغو فى حمى الدين"
author = "د.أبويحيى الحنبلى"
posted = "2006-02-20"
text = "الدعوة الى الله تعالى هى سبب وجود الخيرية فى هذه الامة المرحومة .ولكن الدعوة على بصيرة لقول الله تعالى (قل هذه سبيلى أدعو الى الله على بصيرة)...على بصييييرة.أما أن نجد كل من هب ودب يتكلم _وبلا ادنى بصيرة بل والله ولا بصر_عن النبى صلى الله عليه وسلم _وهو صاحب الجناب العالى_فكيف يوصف بما يعف لسانى عن تكراره .فالله الله فى فتنة الناس ,فانى محذر كل ناعق بما لايعلم مدعيا العلم أن يتقى الله عزوجل فانى لايلفظ من قول الا لديه رقيب عتيد وحسبنا الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

