subject = "فعلا اشتقنا اليك يا ابا القاسم"
author = "نيفين"
posted = "2006-01-18"
text = "ابا القاسم يا حبيبى<br />و هو فيه ف الدتيا قصه حب زى الرسول و السيده خديجه و من بعدها اسيده عائشه<br />احتا بس اللى بعيد و مش بناخد بالنايا جماعه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 5
subject = "اني انقد و انت تردين"
author = "عبد فقير الي الله"
posted = "2006-01-19"
text = "الرومانسية النبوية نحن نتحدث خير من خلقه الله فارجو تغير العنوان الغريب من وجهة نظري وباتابعية كيفية مناقشة الموضوع لانالسول عليه السلام كان يحب لله و يكره لله ليس من اجل الرمانسية اومن اجل الدنيا الفانية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 6
subject = "عنوان لا يليق"
author = "حمدي"
posted = "2006-01-19"
text = "الحديث عن رسول الله صلى الله عليه وسلم يجب أن يكون منتقى بعبارات سليمة طيبة بعيدة عن عبارات مثل ( الرومانسية) أو ( الجنتلمان) وتقريب المعنى إذا كان مقترناً برسول الله فيجب أن يكون بمعنى يليق يه, وقصة دعوة الفارسي فيها نظر أما جمع الموضوع فطيب وأرجو الانتباه لما سبق وأرجو سعة الصدر فيما قلت وشكر الله لك يا هبة الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 7
subject = "أوووووووووووف"
author = "وسام كمال"
posted = "2006-01-19"
text = "سخييييييييييييييييييييييييف<br />اللي كتبت الموضوع لم تفهم معنى الحب في حياة الرسول...<br />ولقب \"العاشق\" لا يطلق على كل مواقفه،<br />الموضوع عبارة عن كوبي بيست للقطات من السيرة دون فهم حقيقي..<br />أفسدتم جمال موضوعات العيد والحج.. ربنا يسامحكم.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

