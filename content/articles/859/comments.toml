posted = "2006-01-21"
text = "صعبانه عليا فاكرة نفسها مبدعه وهيه غلبانه اوي ربنا يبعدها عن الجهل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

