[[comments]]
order = 0
subject = "أشتقنا إليك يا رسول الله"
author = "حسن عادل حسن"
posted = "2006-01-17"
text = "السلام عليكم ورحمة الله وبركاته<br />إن الحمد لله نحمده و نستعينه و نستهديه و نسترضيه و نعوذ بالله من شرور أنفسنا و من سيئات أعمالنا من يهده الله فهو المهتد و من يضلل فلن تجد له ولياً مرشدا اللهم صلى على الطيب الكريم و الذى أرسلته رحمةً للعالمين وكان بالمؤمنين رؤوفاً رحيم<br />و الله لقد ضاع الحب حينما ضاع الدين و ابتليت الأمه بقصص الحب البلهاء فصار الحب باهتاً لا طعم له و لا لون و سيطرت الماده على تفكير الناس فضاع الحب فى زحام الحياه حتى الحب فى الله ضاع إلا ما رحم ربى أخوانى فى الله اننى لا أجد فى هذا الزمان حب صادق و حتى أكون منصفاً لم يمن الله على حتى هذه اللحظه به حتى الحب بينى و بين أصدقائى أراه غائبا أننى أعيش لحظات وحده قاسيه و أن كنت أعيش بين الناس أتكلم و لا يسمعوننى أحبهم و أخلص لهم أبتغاء وجه الله و لا أجد ذلك عندهم اللهم لا تحرمنى من حنان حبيبى و أبى محمد بن عبد الله صلى الله عليه و على اله و صحبه و سلم فى الفردوس الاعلى اللهم متعنا بالحور العين و أبدلنا فى الجنه دوراً خير من دورنا وأهل خير من أهلنا و احبه خير من أحبائنا و أصدقاء خير من أصدقائنا و اخوه خالصه لوجه أنك انت البر الرحيم اللهم ارزقنا شهادةً على أعتاب الأقصى ترضى بها عنا أنك قريب مجيب الدعاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 1
subject = "اخطاتي سيدتي"
author = "بيبرس"
posted = "2006-01-18"
text = "لم تستطع السيوف والدماء أن تنسي القائد )) كيف لم تنسي النبي السيوف والدماء الحب فهل كان النبي كل حياته سيوف ودماء اخطاتي سيدتي عندما اضفتي تلك الجمله وارجو منك حذفها فالنبي لم يكن بين السيوف والدماء ابدا ابدا وان اردتي ذلك احصي عدد القتلي في جانب الكفار لتعلم اني النبي ليس بين السيوف والدماء ابدا فكيف لنبي الرحمه ان يكون كذلك سيدتي لقد اخطاتي فعلا سيدتي واقول ان حياه النبي لم تكن في يوم من الايام سيوف ودماء بل كانت هناك عده ايام فقط من كل حياه النبي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 2
subject = "انا مع بيبرس"
author = "رهام"
posted = "2006-01-18"
text = "فعلا انا مع بيبرس فتلك الجمله جعلتني اتحيل النبي مجرد قائد يقتل البشر مثل اي قائد اخر سفك دماء الكثيرين وانا اؤؤيد حذف تلك الجمله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

[[comments]]
order = 3
subject = "هدينا النبوي"
author = "سمسمة"
posted = "2006-01-18"
text = "والله ياجماعة فعلا الرسول صلى الله عليه وسلم موسوعة حياتية وانسانية ، واذا قابل اي حد فينا مشكلة او معضلة ياريت يرجع للهدي النبوي الشريف هايلاقي كل الحلول ونبعد عن الكلام بتاع الناس بتوع علم النفس والاجتماع والغرب انفسهم اعترفوا بكده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

