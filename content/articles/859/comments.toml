subject = "صبرا"
author = "ابراهيم"
posted = "2006-06-09"
text = "المسلمون في واد و الإسلام في واد آخر,لقد جاء غريبا و سيعود غريبا.نحن مسلمون بلا إسلام,و عند غيرنا إسلام بلا مسلمون.<br />لقد وصف الله سبحانه و تعالى رسولنا الكريم صلى الله عليه وسلم في سورة القلم\" وإنك لعلى خلق عظيم\" فكيف لكم و هذه الدردشة في حقه عليه الصلاة و السلام,لقد برأه خالكم قبلكم."
archived = "2006-11-02"
