[[comments]]
order = 24
subject = "هو الحبيب الدي ترجى شفاعته"
author = "معزو نوال"
posted = "2006-02-15"
text = "بسم الله الرحمان الرحيم والصلاة والسلام على اشرف المرسلين سيدنا وحبيبنا ومعلمنا محمد عليه وعلى اله وصحبه اجمعين اما بعد اخوتي في الله رددوا معي اللهم صلي وسلم وزد وبارك على رسول الله واله الاطهاراخوتي في الله ان حبيبنا محمد يريد من امته ان تنصره الم يقل عليه الصلاة والسلام اننا اخوته فداك ابي وامي ونفسي وةروحي يا حبيبي يامحمد اللهم احشرنا في زمرته واوردنا من حوضه رددوا معي اميييييين اللهم ادخل كل الدانماركيين في امته واجعلهم من حزبه ومناصريه واجعلهم من المدافعين عنه لاالمستهزئين به اللهم صلي عليه صلاة تنجينا بها من جميع الاهوال والافات وتطهرنا بها من جميع السيئات وترفعنا بها اعلى الدرجات وتبلغنا بها اقصى الغايات من جميع الخيرات في الحيات وبعد الممات يا ارحم الراحمين واوصيكم اخوتي بان تشدوا على سنة الحبيب بالنواجد طبقوا سنته احيوها حتى ادا لقينا الحبيب عند الحوض انشاء الله اتفت ونضر الينا وسقانا من يده الشريفة جعلني الله واياكم منهم قولوا ااااامييييييين يا رب العالمين اختكم في الله نوال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124114/http://www.20at.com/article2.php?sid=277"

