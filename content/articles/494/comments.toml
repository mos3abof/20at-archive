subject = "prince of egypt"
text = "تعليق ذو صلة ارجو عدم حزفة.............. و شكراً<br />لا يا جماعة نقاطع اية هنهرج من اولها لا طبعا خلونا منطقيين فى تفكيرنا و نشوف لو انتخبنااو استفتينا هيحصل اية و لو قاطعنا هيحصل اية<br />السيناريوا الاول :<br />زى ما الأحزاب اللى اسمها معارضة و اللى عمرها ما عارضت غير بالصوت المهم النصارى و التجمع و الوفد و الاخوان اللى نفسهم فى حزب يعنى اللى عايزين يقولوا لا هما اللى مش ها يروحوا يعنى أكيد منافقى الحزب الوطنى و و المرزقين من اتباعة و القابيضة هما اللى هيصوتوا و طبعا بالشكل دة النتيجة ممكن تعدى 99.9% بكتيير ...............!!!!!!!!!!!!!<br />السيناريو الثانى :<br />المعارضين و القارفنين و الزهقانين و الطهقانين اللى زينا من الشعب المكلوم المغلوب على امرة المسلوب الارادة و المظلوم اللى عمرة ما قال لا ابدا .......!!!!! ياة كل دى طاقة كابتها فى نفسى ...<br />المهم احنا نروح و نقول لا لا مش عايزين لا لا مش لاعبين<br />اكيد صوتنا مش هيوقف التعديل و هايتوافق علية بس عمر النتيجة ما هاتطلع ب 99.9 % و دة امر اكيد<br />يا جماعة لازم نسحب البساط من تحت الديكتاتور المتدمرق و نبدا نعرية<br />و انا شايف كفاية الراجل دة و دلاديلى يعرفوا احنا بنكرههم قد اية و يعرفوا بالظبط هما مكانتهم فى اى حتة فى نعل الجزم بتاعتنا<br />يا جماعة روحوا و قولا لا<br />معلومة مهمة :<br />لو كانت نتيجة التصويت للاغلبية الرافضة للتعديل على المادة 76 من الدستور فى هذة الحالة سيعاد تشريع المادة بواسطة مجلس الشعب مرة اخرى ثم يت التصويت علية من قبل اعضاء المجلس و فى حالة الموافقة يصدق علية رئيس الجمهورية<br />يعنى :<br />مش معنى كدة ان هيكون الشعب رفض تعديل المادة و ان احنا بنحب الاستفتاء على راس واحدة<br />بس : يعنى ان احنا رافضين التعديل فى الصورة المعروضة للاستفتاء<br />أكيد :<br />سيتم تعديل الصيغة و الشروط من جديد لا دة امر الريس و الريس اكيد مش هايرجع فى كلامة لانة اصدر اوامر بكدة<br />يا شباب روحوا و قولوا لا ارجوكوا<br />يا شباب احنا اللى بنحكم مصر<br />يا شباب احنا الاغلبية<br />يا شباب احنا الاصوات بايدينا<br />يا شباب احنا اللى يحترمنا نحترمة ونرفعة فوق رسنا<br />يا شباب احنا لو مرحناش هيمر الاستفتاء ب 99 .9 %<br />و الباشامبارك يبان على انة هوا الزعيم و رائد الديمقراطية و يدخل التارخ و الخرط اياة بتاع القناة الاولى<br />هذا راى و اسف للاطالة لكن الموضوع تقيل و يستاهل<br />و شكرا للمتابعة<br />internet_boy_82@hotmail.com"
archived = "2005-07-12"
capture_url = "https://web.archive.org/web/20050712084256/http://www.20at.com:80/article.php?sid=1177"

[[comments]]
order = 13
subject = "محاولة قتل عبد العزيز مخيون"
text = "معلش يا جماعة هقطع كلامكو عن سيدنا عماد الدين اديب عليه السلام و رضى الله عنه..<br />بس فى خبر مهم...طبعاً هو مش اهم من سيدنا عماد..<br />تعرض النجم القدير عبد العزيز مخيون صباح اليوم الاثنين إلى محاولة قتل على يد مجهول.<br />كان الفنان جالسا في منزله عندما طعنه المجهول، و تم نقله إلى مستشفى السلام في حالة صحية خطرة.<br />و تمكنت قوات الأمن من القبض على المجهول، و لم يتضح حتى الآن السبب وراء الحادث.<br />ومن المعروف ان الفنان عبد العزيز مخيون له موقف<br />معارض للنظام المصرى و للتمديد للرئيس المصرى حسنى<br />مبارك و صرح بذلك على الملأ فى مناسبات عديدة"
archived = "2005-07-12"
capture_url = "https://web.archive.org/web/20050712084256/http://www.20at.com:80/article.php?sid=1177"

[[comments]]
order = 14
subject = "إني أتنفس تحت الشمس"
text = "الكلام عن عماد أديب مهم جدا في هذا الوقت ..لأنه فعلا بدأ يظهر بقوة في مناطق لم يكن يظهر فيها من قبل ..وبدأ يلعب دور دعائي وترويجي للنظام المصري بشكل واضح ودون أي كسوف .<br />عماد أديب أقترب فعلا من استكمال امبراطوريته الاعلامية والاعلانية والدعائية ..وهو يحتاج بالفعل لان يجد حكومة تقف في ظهره وتحميه من ولاد الصحافة الاشقياء ومن الصبيان الجدد الذين يجذبون الجماهير ناحيتهم بخفتهم ودلعهم ..واباحيتهم احيانا .<br />ورغم أنى أحترم في عماد أديب أنه يعلم جيد الدور الذي يلعبه ..ويتفهم أنه \"على مقاسه\" إلا أني أختلف معه في إضطراره للكذب حتى يكتمل تألقه في دوره ..وطبعا حلقات الرئيس مبارك خير مثال على ذلك .<br />وما لا افهمه عن عماد أديب هو اصراره على الاستمرار في اصدار جريدة نهضة مصر رغم أنها لا تحقق مبيعات تذكر اذا ما وضع في الاعتبار انها جريدة يومية .<br />اتخيل ان عماد أديب ايضا يجيد اللعب مع تيار المستقبل ..وهو التيار الذي يتمثل في جمال مبارك في مصر وجمعية جيل المستقبل الذي يترأسها ..<br />ويتمثل في الحريري ونجله في لبنان وهو أيضا يرتبط بعلاقة صداقة قوية مع عماد أديب .<br />في النهاية لا أحب الرجل على الإطلاق ولا أكرهه ..فرغم مهنيته إلا أنني أتحفظ كثيرة عند أخلاقيته ..والأخيرة أنا لا أملك حسابه عليها ..<br />ولا أنسى أن أشكر صاحبة الموضوع على المعلومات التي قدمتها والتي كنا نحتاج أن نعرفها بالتأكيد"
archived = "2005-07-12"
capture_url = "https://web.archive.org/web/20050712084256/http://www.20at.com:80/article.php?sid=1177"

