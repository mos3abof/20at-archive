text = "أحسن إنكم حذفتم التعليقات اللي فاتت لأنها كانت فعلا مستفزة .<br />الناس سابت الموضوع و اتكلموا في بدانة عماد أديب و وزنه و شكله و مش عارف إيه ... و نسيوا الموضوع تماما .<br />مش معني كده إني ضد اختلاف الآراء بس ده لو كان في اختلاف آراء في موضوع ما لكن إننا نسيب الأصول و نتكلم في الفروع .... متهيأ لي ملوش لازمة .<br />ولا إيه؟؟<br />و بعدين إيه اللي مش عاجبك يا آنسة وسااااااااام ؟؟<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري .<br />mohamedmat@hotmail.com"
