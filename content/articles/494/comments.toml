subject = "التعلب"
text = "ههههههههههههههههه<br />فعلا دلوقتي...ليكوا حق تقوله:-<br />تم حذف جميع التعليقات التي خرجت عن سياق مناقشة الموضوع.<br />هو انتوا فاكرين مثلا ان في حشاشين بيزورا الموقع ده...يدخلوا ينسوا هما كانوا بيقروا في ايه..ولا علقوا على ايه..................يعني صباح الكوسه....<br />عموما انا هكتب تعليقي تاني بقى..وعلى الله يتمسح:-<br />عماد الدين أديب كان مثال لكل مواطن مصري...ولازم يكون عبره لينا من أول كرشه الي ممكن يتعمل زحلاقه....لحد قفاه الي كان لامع في نصف الشاشه مع حسني مبارك....قفاه كان نصه منتظف بجلانس الله ينور...والنص التاني باين منه كتاف الريس...وده ان دل على شىء فهو يدل على...ان لو حد اتكلم كلمه مش ولا بد مع الريس هياخد على قفاه..........<br />*مع نحيات تعلب التعالب..."
