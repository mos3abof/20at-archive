text = "أولا من أنتم حتي تتحكموا فيما ينشر من رأي وما لا ينشر من أعطاكم هذا الحق ...تقولوا موقعكم وإنتم أحرار فيه ... نقول لكم إشربوه بناقص موقع<br />ثانيا الأخ الذي كتب عن موضوع عبد العزيز مخيون يبدوا أنه من المرسة إياها التي عاشت منذ نشأتها وحتي الآن علي تحويل كل شيئ لسياسة ( عارفينها ) لو وضحت أكثر سوف يلغون المشاركة لأننا نلعب في أرضهم المهم الأخ عرف إن الموضوع لا سياسة ولا دياولوا والحكاية إن الست عرفت شاب وأرادت أن تتخلص من العجوز بس خلاص ...فين السياسة ....ياريت يا شباب تنضفوا مخكم شوية من اللي إياهم زروه فيه..سلام"
archived = "2005-07-12"
capture_url = "https://web.archive.org/web/20050712084256/http://www.20at.com:80/article.php?sid=1177"

[[comments]]
order = 17
subject = "احوال البلد"
text = "اولا اود السؤال هل هذا الموضوع وهذه التعليقات تعبر عن فكر شباب مصر الان؟اتمنى الا يكون هذا هو حال كل شباب المصريين!كما اتمنى من كل من كتب تعليق هنا ان يقف امام نفسه لحظة ويسالها ما جدوى ما كتب!وهل بهذا يرجوا تحسين المستقبل"
archived = "2005-07-12"
capture_url = "https://web.archive.org/web/20050712084256/http://www.20at.com:80/article.php?sid=1177"

[[comments]]
order = 18
subject = "غراب مصر .... !!!"
text = "الاخ الى عمال يهاها ها ده....!!!<br />براحة على نفسك شوية ياأبنى هتغرق روحك ....<br />مفيش حاجة تضحك ...الموضوع من البداية غلط ....<br />الترويج لمفاهيم و سلوكيات زى دى حاجة ممكن تإذى<br />كتير....<br />بمعنى ان نقل تجربة سامى يوسف الى هى فى مكان و ظروف مختلفة كل الاختلاف عن ظروف 95% من الشباب الى بيدخلو على الموقع ممكن يخلط عليهم المفاهيم يعنى لامؤخزة بجد متجيش تسهل لواحد تربية حوارى امبابة و لا دهاليز فيصل ( زى الاخ الاولانى ماقال ) انه يتصل ببنت و يبعتلها sms ولا يكلمها على الشات و تقولى عادى خالص و احنا شباب زى بعضينا و خليك كول<br />العلاقة بين الولد و البنت فى فترة العشرينيات<br />تحديداً علاقة شائكة جداً المشاعر و العلاقة نفسيها<br />بتطور بسرعة رهيبة يعنى بتبدى اننا شباب ناضج و<br />تجاوزنا اننا ممكن الشطان يضحك علينا و كلام كتير<br />بنفس الروح دى بيبث على الموقع ده تحديداً دون<br />مراعاة لأمانة الكلمة و مسؤلية العمل....<br />و نيجى لموضوع سامى يوسف ... يعنى هو مجرد انه اتعرف عليها خلاص يبعتلها sms و يكلمها على الشات<br />فعرف مين ده و شرع ايه و لا اسلام ايه و لا عادات ايه<br />يا جماعة راعو ان الى القائمين و زوار الموقع 95% منهم من حوارى مصر و متمردين على على اوضاعهم الاجتماعية و الاقتصادية<br />زائد كمان انا بهاتى ليه ....هما كل الى بيدخلو على الموقع ال 10 محررين الى فيه و ال10 محررين الى متعاونين من بره و عليهم 30 واحد عواطلى فاضى موارهمش غير النت<br />خليكو كده احسن<br />بس راعو بعد كده ان الكلمة امانة و مسؤولية"
archived = "2005-07-12"
capture_url = "https://web.archive.org/web/20050712084256/http://www.20at.com:80/article.php?sid=1177"

