subject = "بدين بس عقلة رشيق جدا"
text = "الموضوع جميل جدا وعماد الدين اديب دة واجهة مشرفة جدا جدا لكل مصرى وعلى فكرة ياجماعة مش كل حاجة لازم ننتقدها والراجل لة عيوب لكن هوا 99% تماموياريت يكون عندنا 100 عماد اديب بدل المتحنطين من رؤساء تحرير الصحف القومية اللى بيظهروا للتهليل وبس ولا اصحاب الاعمدة اللى عمالين يكتبوا فى كلام فارغ<br />بس ملحوظة عماد اديب اشتغل كمان فى قناة س ان ان"
