text = "بجد انا زعلت علي المستوي الواطي للحوار بينكم يا مسلمين ويا عرب احترموا الدين والرسول وربنا قبل اي شي وبجد مش كل السعوديات صايعين ولا كل المصريات بس السعوديات اغلبهم مش محترمين وانا كنت بسافر السعودية وشفت ده بعيني ومحدش يشتم بلدي ولا يمسها بسؤء \"يايها الزين امنوا ازا جائكم فاسق بنبا فتبنواان تصيبوا قوما بجهالة فتصبحوا علي ما فعلتم نادمين \"صدق الله العظيم......"
archived = "2005-07-12"
