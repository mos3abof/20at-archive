[[comments]]
order = 22
subject = "انا مؤيد لسامي الواعي"
text = "سامي الفلسطيني وصل ومعه المفاجأة<br />مساء الخير للجميع كيفكم<br />موضوف تافه لانسان تافه فاسد مفسد<br />والتعليقات اتفه مما يتصور البعض على مسالة تخين وبدين وكان المسالة مشهد كوميدي لعادل امام، ان كان مستمر في عالم الكوميديا مع انه في ايامه الاخيرة بدا يخرف ويمسح تاريخ حب الملايين له باستيكا من اجل عيون حكومة الحيتان التي تحكم مصر<br />ما علينا<br />اولا عماد اديب لم يفتح الاندلس ولم يخترع القتبلة النووية ولم يساهم في بناء المجتمع المصري باي شيء<br />ولم يتبنى عناصر او مقومات الحضارة وبناء المجتمعات بل العكس اخذ يساهم في افساد الامة من خلال جلب مهدمات الحضارة للشعب المصري وتسويق قذارة هذا العالم على انها التقدم والنجاح والوصول الى القمة<br />تتكلمون عن عماداديب وكانه عماد الدين زنكي الذي حرر الرها من ايدي الصليبين مع انه لا وجه للمقارنه<br />اما من يقول يا ريت كلنا عماد اديب اقول له يا ريت كلنا احمد زويل او كلنا مصطفى كامل او احمد ياسين او فتحي الشقاقي او عمر المختار او فاروق الباز او صلاح الدين الايوبي الخخخخ من الشرفاء العظماء<br />واي شخصيات من العيار الثقيل التي قابلها عماد<br />ما هي الا شخصيات معفنه تافهه فاسدة مفسدة اذلت شعوبها وجوعتهم واجهلتهم من حسني مبارك الى القذافي والملك حسين والخامس والسادس لا يوجد فيهم رجل رشيد<br />حاول المنتفع عماد اديب ان يساير الامر من باب البحث عن السبوبه ولو بالنفاق والانزلاق الى الهاوية في التملق لضيوفه ومحاولة ارضائهم وتلبيسهم ثوب العفة الذي هو ضيق جدا عليهم<br />عماد اديب ما هو الا منافق وصولي انبطاحي وفاسد ومفسد ولا يمت للاخلاق بصلة فهو لايعرف لها عنوانا<br />لا يعرف الا عناوين الرذيلة والانحطاط وهذا ما كرسه في ما يسمى امبروطورية عماد للاعلام<br />افيقوا يا شباب مصر وشباب عشرينات من هذا الوهم الذي اسمه الوصول الى الشهرة ولو على حساب اوطانكم<br />ان نفاقكم لهذه الانظمة القذرة ما هو الا تمديد وزيادة في عمر هذه الانظمة التي تستعبدنا ليل نهار<br />ارجوكم لا تلمعوا الا الشرفاء الا العظماء الا من ساهم في بناء هذه الامه بعلمه وبماله وبدمه<br />اخوكم سامي"
archived = "2005-07-12"
capture_url = "https://web.archive.org/web/20050712084256/http://www.20at.com:80/article.php?sid=1177"

