order = 1
subject = "ماما أنا مش بحب مريكا"
text = "ماما قولي أمريكا حوه<br />علشان موكن احنا إعمل كل حاجة احنا اوزينهاهناك والناس كله يحب امريكا عشان امريكا كوي<br />بس انا حبش امريكا!<br />عشان امريكا قتل بيبي زي انا<br />وانا مش آوز أموت زي بيبي في عراق انا يشوف على تفزيون<br />بس ممكن اعمل كل حاجه انا عاوز ومش لازم انا اكون امريكي!!!!"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022163217/http://www.20at.com:80/article.php?sid=75"
