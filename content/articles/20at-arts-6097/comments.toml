posted = "2007-06-03"
text = "الفيلم هايل و بيمثل صرخه من المهمشين او الناس العاديين ووليد بيمثل المواطن الشاب بكل ظروفه من اول تخرجه من علوم فسم فيزيا و عمله ف مصلحه الضرايب لحد حياته الزوجيه الروتينيه و موته اللى محدش حس بيه<br />و لولا التعليق اللى سبق الفيلم كان الواحد حس انه بيتفرج على فيلم من غرار ghost<br />و الاخراج عجبنى اوى و عجبنى الاسقاط الواضح ف الخلفيه و اللى بقصد بيه مسرحيه شاهد مشفش حاجه و الى ليها signifihgabce و اضحه و كمان ال gloomy atmosphere اللى بيناسب الجو النفسى للشخصيه<br />كمان فكره اختزال الشخص لارقام بيفكرنى بفكره جت ف احد مسرحيات تشارلز ديكنز<br />بجد جميل يا عشرينات"
archived = "2009-11-16"
capture_url = "https://web.archive.org/web/20091116181709/http://www.20at.com:80/20at/arts/6097.html"

