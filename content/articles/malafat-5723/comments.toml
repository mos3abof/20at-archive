text = "سلام عليكم<br />لو اتكلمت عن شارعى و طفولتى فيه طبعا لازم اتكلم على الجامع اللى فى شارعنا لانهم مقترنين ببعض<br />كنا نخلص التحفيظ فى المسجد و نكون مرتبين اللعب بعدها و ما احلى اللعب فىالشارع مع اصحابك فى المسجد ،لانك ما كنتش بتسمع كلمات بزيئة (الا قليل ) و كمان الاساتذة بتوع الجامع كانوا بيلعبوا كمان و بعد الساعة 10 ف طبعا الاستغماية و الكهربا و المنديل ,,,<br />و لكن لست ككثير مع الكبر تنقطع صلتهم بالشارع مع دخول الجامعة و تأففهم من التعامل مع الشارع<br />و لكن احببت ان اعمل حاجة للشارع ده فجمعت اولاد الشارع بتاعنا , و كل صلاة نروح نصلى مع بعض و بعد الصلاة نقول ادام الجامع مسابقة و اوزع بنبونى او بسكوت حسب الميزانيه و اشتركتلهم فى فريق كشافه و بنعمل سوا ايام خدمة عامة لتنظيف شارعنا الحبيب"
archived = "2009-05-27"
