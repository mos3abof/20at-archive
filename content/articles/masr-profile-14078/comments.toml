[[comments]]
order = 1
subject = ""
author = "مهندس فاشل"
posted = "2009-11-17"
text = "مهندس فاشل بيحط توقعات غبية او صبيانية للسفر وكانة فى الاعدادية<br />هيركب قطار من القاهرة لاسوان - ماشى - هياخد كم ساعة<br />ثم من بحيرة ناصر الى وادى حلفا - كم ساعة<br />ثم القطار السودانى - كم ساعة<br />الرحلة محتاجة لا يقل عن اسبوع حتى تصل ام درمان بامان اللة<br />وبعد اسبوع تكون المباراة انتهت وشبعت موت - ويبقى امامك ترجع لنا بجمل تشيل علية خيبتك<br />من القاهرة الى ام درمان - انت فاكر نفسك فى الاتحاد الاوروبى وهناك قطار الشرق السريع<br />شباب غير واقعى بالمرة وبيحمل خيبتة للحكومة واتحاد الكرة"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119040213/http://www.20at.com:80/masr/profile/14078-2009-11-17-13-41-57.html"

