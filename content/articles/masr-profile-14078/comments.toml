[[comments]]
order = 4
subject = ""
author = "مهندس سكة حديد"
posted = "2009-11-18"
text = "سياسة المستعمر البريطانى كانت خبيثة وتزرع التفرقة الابدية<br />فمثلا السكك الحديد الاوروبية القضبان متساوية فى كل القارة فى الوسع يعنى بعد القضيبين عن بعض او المسافة بين القضيبين ثابتة او عرض السكة واحد بحيث ان اى قطار يطلع من اى دولة يوصل للدولة التانية عادى<br />انما المستعمر البريطانى عمل السكة الحديد المصرية واسعة والسودانية ضيقة بحيث لا يمكن لجرار او عربة سكة حديد ان تسير على قضبان الاخر<br />ثم تركوا مسافة واسعة جدا من اسوان حتى وادى حلفا وهى التى تشمل الشلالات فى النيل وتعوق الملاحة النهرية بدون قطارات ايضا<br />وبدل من عمل ترابط مع اسرائيل فى الغاز والكهرباء لماذا لم نمد السكة الحديد المصرية الى وادى حلفا<br />لماذا لا نربط وادى النيل بسكة حديد من الشمال الى الجنوب ؟"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119040213/http://www.20at.com:80/masr/profile/14078-2009-11-17-13-41-57.html"

