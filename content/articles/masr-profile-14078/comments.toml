text = "من اسوان لوادى حلفا توجد باخرة نيلية تتحرك مرتين فى الاسبوع وتستغرق 3 ايام وركوبها وسط الغنم والقرف والبضاعة مخاطرة كبيرة ثم من وادى حلفا فى السودان يوجد القطار وهو ليس مثل القطارات المصرية فسواق القطار وهو ماشى لو عايز يشرب شاى بيوقف فى اى قرية تقابلة ويبات ويتعشى ويشرب شاى وتانى يوم يمشى فى النور مرتاح ويصل الخرطوم فى امان اللة فى الشهر القادم وطبعا الباخرة هتمشى فى بحيرة ناصر وهى مليانة تماسيح واحتمال يكون واحد من اللى على السفينة عايز يخدم تمساح ويزقك بالليل فى المية علشان يسرق جزمتك"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119040213/http://www.20at.com:80/masr/profile/14078-2009-11-17-13-41-57.html"

