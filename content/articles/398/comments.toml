text = "جزاكى الله خيرا على موضوعك وأحب أن أضيف ماأجمل أن نتأخى فى الله ما أجمل أن نتحاب فى الله ما أجمل الصلاة على رسول الله ما أجمل أن يتخذالشباب رسول الله قدوتهم وما أجمل أن تتخذالأخوات نساء رسول الله قدوتهن يا حبيبى يا رسول الله0<br />أود ان أبعث لكى برسالةوهى:<br />ليكن شعارك فى رمضان لن يسبقنى أحدالى الله"
