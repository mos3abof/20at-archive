order = 0
subject = "معلومات أخري عن معتقل الخيام"
author = "ميوزة"
posted = "2006-06-22"
text = "قدمت المذيعة رولا مصطفي خرسا حلقة عن هذا المعتقل للتلفزيون المصري ولست اتذكر بالتحديد ولكن تقريبا كان في الذكري الثانية لتحرير الجنوب اللبناني واستضافت بعض السجناء السابقين في المعتفل وحكي واحد منهم عن احد زملائه وانة وبعد ما عذب لايام لم تتم معالجتة وكان مجروح جرح غائر في الرأس حتي تعفن الجرح ويقول وجدناه يضرح عندما وجد الديدان تخرج من راسه<br />اما عن الزنازين فكانت هناك انواع بارتفاع النصف متر ولكم ان تتخيلوا لكي يجلس اي انسان بداخلهايكون جالس مقوس ومحني الظهر وكان فيها فتحة صغيرة لادخال الهواء وتم ادخال بعض التحسينات عليها بعد زيارة لجنة من الصليب الاحمر الدولي هذا بعض ما اتذكره عن هذا المعتقل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130402/http://www.20at.com/article2.php?sid=982"

