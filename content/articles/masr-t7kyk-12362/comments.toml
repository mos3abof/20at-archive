author = "االقرع"
posted = "2009-06-14"
text = "يا بلدنا يا عجيبة<br />قيكى حاجة محيرانى<br />نزرع القمح بصعوبة<br />يطلع القرع فى ثوانى<br />رحم اللة صلاح جاهين<br />فعندما اردت ادخال طابعة كمبيوتر عادية جدا حجزوها فى المطار ودخت بين وزارة الاتصالات ومباحث امن الدولة حتى احصل على تصريح ادخالها وكاننى مزور فلوس<br />وغيرنا بيدخل البلد من الطيارة للبيت فورا بدون حتى ختم الجواز"
archived = "2009-06-18"
capture_url = "https://web.archive.org/web/20090618052245/http://www.20at.com:80/masr/t7kyk/12362-2009-06-14-10-41-17.html"
