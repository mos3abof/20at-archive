text = "انفلونزا الخنازير مش هتحوق مع الشعب المصرى<br />هو احنا فافى للدرجة دى - احنا ناس بتوع الحاجات الكبيرة فيروس كبدى - سرطانات بانواعها انما شوية انفلونزا وزكام وزحار فلعب عيال"
