subject = "الاناشيد والواقع"
author = "أبو سيف"
posted = "2006-04-30"
text = "أنا عن نفسي قرأت في هذا الموضوع كثيرا وقرات آراء متشددين والممعتدلين والمنفتحين في هذا الموضوع فرأيت ان الموسيقى صارت في كثير الكثير من البرامج والاخبار على سبيل المثال لا الحصر والمسلسلات التاريخية وافلام الكرتون وووووووو فاذا كان الحرام هو في الآلات فما حرمتها إن الآلة هي آلة استخدامها هو الذي يحدد هي حلال ام حرام الهاتف المحمول على سبيل المثال لو ستخدمته في المعاكسات والغرام والحب والكلام السيئ لكان حرام على صاحبه السيارة اذا استخدامها الشخص في التنقل والسفر الى الحرام لكانت عليه حرام الساعة كذلك الستالايت كذلك اذا سخدته في الشي الحرام لكان حرام ولو ستخدمته في الشيئ الحلال سيكون حلال كذلك الامر في الموسيقى اذا ستخدمتها في الكلام البذيئ وكلام الحب والغرام والمجون لكانت حرام بنما لو ستخدمناها مع الاناشيد الاسلامية والكلمات الراكزة المعبر المربية للامة ولشباب المسلمين والله تعالى اعلم انها حلال على قول العلماء ومنهم علماء الازهر الافاضل الاكارم وان الدف للذي يحلونه هو ضابط الايقاع ولو دققنا النظر في الفرق الموسيقية الذي يقودها الكثير من الفاجرات لرأيت ما لا يقل عن 3 الى 4 دفوف في الفرقة الموسيقية اذا كان وهو في الموسيقى يسمى ضابط الايقاع وكان حلالا كيف الفروع ومن المعروف ان الفرع للأصل ينسب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132542/http://www.20at.com/article2.php?sid=126"

