[[comments]]
order = 63
subject = "اه يعنى"
author = "محمود حسن"
posted = "2006-10-17"
text = "اناشاب من مصر احب ان اقول من الذى يحرم الغناء باسم الدين من اراد ان يقرا يقرا لهولاء الشيخ محمد الغزالى والدكتور يوسف القرضاوى وفتاوى اخره وراي الشيخ محمد حسين يعقوب بتحريم الغناء والموسيقى هذا فعلهوالان لن الان جعلوا المطربين فتنة بسببالرقص والعرى وكما يقول المفكر الاسلامى فهمى هويدى ان هذا لايسمى بالفن النبيل فى شى انما هى دعوة لانحلال والدعارة وهدية مجانية نقدمها للمتطرفين فى تقيد دعاوهم بان الفن حرام واناشيد الاردن جميلة وانا احب ان اقول للناس لا كلمة تجبهم ولا توديهم ارجع لاراء الصحيحة وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132542/http://www.20at.com/article2.php?sid=126"

