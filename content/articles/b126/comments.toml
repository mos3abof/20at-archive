[[comments]]
order = 23
subject = "تطور ام تدهور"
author = "ابو اليمان"
posted = "2006-03-20"
text = "بداية لا بد من تصحيح :ان الاناشيد الاسلامية في الاردن بدايتها كانت في اواخر السبعينات واوائل الثمانينات ومن ابرز من اسس ه1ا النوع في الاردن هو المنشد ابو احمد راشد قشوع لما اسس فرقة غرباء الاسلام والتي صار اسمها اليرموك فيما بعد.وكان وقتها قدوم المنشدين السوريين مثل ابو راتب وابو محمود الترمذي ولكن الشهرة كانت مع الانتفاضة الاولى.<br />واعتقد ان نسبة اي شئ للاسلام يعني ان يكون منضبطا بالضوابط الشرعية واهم ضابط للانشودة هو بعد الكلمة الطيبة عدم وجود الموسيقى والتأثيرات الموسيقية لأن اغلب جمهور الفقهاء على تحريم الموسيقى وان وجد البعض ممن قال بحلها كإبن حزم والغزالي الا ان ادلة القائلين بحرمتها هي اقوى والارجح وليس هنا مقام سرد الادلة والاقوال.لذلك انا مع عدم استخدامها<br />اضف الى ذلك ان فتح الباب لهذا الامر اي استخدام الموسيقى وغيرها سيفتح المجال لوجود رقص اسلامي فيديو كليب اسلامي يستخدم نساغء عاريات وقد يطلقون عليهن موديل اسلامي والعياذ بالله ... وخلاصة قولي ان الكلمة الطيبة والصوت الجميل لا يحتاجان لموسيقى او مؤثرات محرمة(واسمعوا ابو الجود وابو مازن والحفارووالترمذي ..)وهذا نوع من التدهور لا من التطور الذي ادعاه موسى مصطفى في مقابلته مع ايمان البحر درويش على قناة الرسالة....<br />ملاحظة اخيرة:<br />ما رأيكم بظاهرة ميس شلش (الطفلة)هل لا زالت طفلة!!!!!!!!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132542/http://www.20at.com/article2.php?sid=126"

