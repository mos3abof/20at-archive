text = "السلام عليكم وبعد انا فتاة اعشق الاناشيد و المنشدين خصوصا المنشد سامي يوسف و المنشد موسى مصطفى و جميع المنشدين و الطفلةميس شلش احب الاناشيد وانايسمونني عاشقة الاناشيد يا ليتني صغيرة لاكون منشدة مثل المنشدين و المنشدات<br />ان سامي شاب جميللطيف مشهور محبوب احبه اعشقه اعشق اناشيده الرائعة<br />واخر دعواي اللهم انصر اهلنا فيكل مكان يا الله يا رب العالمين<br />ادعوا معي ربنا بنصرة الاسلام و المسلمين و حماية المسجد الاقصى من كل سوء<br />يا الله يااااااااااااااا الله"
