[[comments]]
order = 16
subject = "ما ورد في الأناشيد من استخدام الموسيقى"
author = "سلمة عمر"
posted = "2006-02-22"
text = "احبتي الكرام كثيرا ما يتحفنا القراء برايهم حول تحريم استخدام الموسيقى والدف في الأناشيد الإسلامية حتى أن بعضهم اوصلها لدرجة التحريم والبعض الآخر كفر من يسمعها وحينما تقول له لماذا تحبذها في الأغاني يقول هذه غير ؟؟ لماذا بأي منطق تتكلمون لماذا لا سنتخدم الدف والإيقاعات في الأناشيد بل إن هذا يجعلها أحلى وتحرك النفس لتامل في معانيها أكثر ونجذبه نحو الفن الأسلامي !! أما أن يأتي واحد ويلقي نشيدة بدون أي مؤثرات فمثله مثل الذي يلقي نشرات الأخبار مجرد كلام مرصوص يقوله وينتهي الأمر بل أنتم بذلك تشجعون الشباب والشابات إلى الأتجاه لسماع الأغاني بتلك الأفعال كفاكم النقاش حول هذا الموضوع فقد شوهتم الفن الأسلامي بعدين لا يأتي أحد ويتكلم بدون نص قرآني ويحرم ويحلل على كيفه العلماء في عصرنا اجازوها لذلك كفاكم الخوض في هذا المجال سواء في التلفزيون او على النت من لا يريد لا يسمعها أما أن يجادل فهذا هو المسيء لنا بذاته ويكره الخوض في شيء لا تعلمونه ولكم الشكر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132542/http://www.20at.com/article2.php?sid=126"

