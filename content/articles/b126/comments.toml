subject = "التعلق بالإسلام"
author = "ام خالد"
posted = "2006-03-01"
text = "الشىء الإسلامى لازم يكون ليه ضوابط إسلامية وهل النشيدالقديم اللى من غير ايقاع كان لايواكب الشباب بل بالعكس كانت الاناشيدتؤثر فى النفس اشد التأثير أما فأين الأناشيد الجميلة نحن الذين بايعوا محمدا وأمثالها ليس ضرورى أن يكون الإيقاع هو المؤثر وأن ننجذب للنشيد لأن به إيقاع بل لإنه إسلامى وبضوابط إسلامية وهذا الفرق بين كل ماهو إسلامى الضوابط والمرجعية هل توافق الإسلام أم لا"
