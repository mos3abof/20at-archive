subject = "مبحبهاش لكن بموت فيها"
author = "ياء"
posted = "2005-12-21"
text = "انا عن نفسى بعشق الموسيقى ومقدرش اذاكر من غير مسمع اناشيد وبحب الاناشيد القديمه التى كانت تغنى بدون موسيقى لا دف وتعتمد على صوت المطرب واعشق ابو راتب فى القديم واستمع الى الاناشيد التى يوجد بها موسيقى واشعر انها عصريه جدا ومناسبه لسن الشباب الملتزم واشجع اصحابى على ان يسمعهوها<br />واهديهم شرائط اناشيد واكثر من احب من النشدين<br />ايمن الحلاق<br />فرقه اليرموك<br />ميس شلش<br />موسى مصطفى<br />وانا اعتبر ان اى كلمات طيبه تلحن بشكل جيداناشيد ولايهمنى من هو المطرب حتى لو كان يؤدى اغانى لا ارضى عنها<br />yehia2784@hotmail.com"
archived = "2006-11-02"
