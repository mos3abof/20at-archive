posted = "2006-01-04"
text = "ياجماعة ان بفا منشد فى فريق جنة المصرى ويمكن احنا اول فريق اسلامى يستخدم الموسيقى ويكون لينا افق فنى فى مدينة الاسكندرىة وجميع المحافظات المصرية وانا اتمنى ان نرا كل شباب العشرينات قريبا سواء فى الحفلات او الافراح الاسلامية وارشح لكم شرائطنا القادم انشيد مصطفى محمود واحمد عز وتامر عبد الشافى السلام"
