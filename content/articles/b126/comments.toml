posted = "2005-12-22"
text = "امممممب بص هما بالفعل اتكلموا عن الحب مش المبتذل في شريط مصطفي محمود وكمان اشرف زهران في شريط فلبي عليك وبالتحديد انشوده قلبي عليك ثانيا : بخصوص الايقاع ممكن يكون جامد اوي زي انشوده اصلي لربي بس الانشوده كلها علي بعضها حلوه ايه تاني يا بت اه الغزل اللي كان في ها قد رحلتي اغنيه واحده يعني مش كتتتير اوي ودي من افضل اناشيدي وبعديم ما الراجل وضح هو عايز ايه من الاخر ثالثًاًًًُ: الفيديو كليب مططططططططلوب بشده اولا عشان عايز اشوف المطربين اللي بسمعهم دول وبعدين فيها ايه يعني لو عملوا فيديو كليب زي فرشي التراب اممممممم نسيت حاجه لا خلاص وسلامي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132542/http://www.20at.com/article2.php?sid=126"

