posted = "2006-08-12"
text = "انوا اول مرة بشارك بهذا المنتدى بس الموضوع شدني لانه عن جد وضع الانشاد بالاردن مش طبيبعي هالفتر.......... بس انا كثييييييييييير مستغربة من شعبية الاسطورة ميس شلش بمصر بس والله انها بتستاهل اكثر من هيك لانه فعلا روعة بس عن جد في ناس بالردن ما بيعرفوها طبعا هاذ دليل على جهلهم وسوء ذوقهم لانه ميس عباروة عن معجزة صعب تتكرر........... بالنسبة لموضوع المقالة وبغض النظر عن الموسيقى اذا حرام ......... بس اللي بيجلط في النشدين وخاصة المنشد موسى مصطفى \"عفكرة انا بموت بصوته\" بس ما بتعجبني فلسفته وطريقته وبالذات اخذوه الحان الاغاني وخاصة الاغاني الهابطة وعمل اناشيد على لحنها.........انا بشوف هاذ كثير غلط المفروض انه احنا فن اسلامي والنا طابع خاص فينا وما بنقلد حد بالعكس لازم همه يقلدونا<br />بس بالنسبه للكلمات انا ما بشوف في بعد الشاعر خليل عابد ما شاء الله عليه رااااااااااااااااااااااااائع وياسلام لما ينشد هالكلمات عبد الفتاح عوينات اللـــــــــــــــــــــــــــــــــه دماااااااااااااار"
