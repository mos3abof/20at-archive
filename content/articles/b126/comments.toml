subject = "كلام جميل"
author = "Juman"
posted = "2006-01-14"
text = "بعيدا عن خلافيات الموسيقى وغيره..<br />أردت فقط التعليق على نقطة تحويل مسار القصدية من التغزل في المحبوبة إلى الوطن!<br />هذا التحويل الذي اراه مغالطة من الشاعر أو المنشد ربما إذا كان هو الذي غير الكلمات، كشاعر معرفو يكتب غزلا رائعا، ولن يفاجئ قارئه أن هذا الغزل في القدس! فهل يخجلون من التصريح بأنه غزل؟ أم يعتبرونه غير جائز؟ أتمنى ان نسمع غناء إسلاميا فيه كلمات حب وغزل لنستبعد فيروز وماجدة الرومي وعبد الحليم، وطبعا الشلة الشنكوتية الحديثة التي لا تتحدث في الحب إنما في الإباحية!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132542/http://www.20at.com/article2.php?sid=126"

