posted = "2010-02-26"
text = "اثنين بشاوات حاطين رجل على رجل وها ها ها ها ولا على بالهم اي حاجه<br />وهما الاثنين مرشحين للحكم<br />الكلام دا ما ينفعش في بلد المليون شحات ومليون ارمله ومليون مريض بالسرطان ومليون عاطل عن العمل<br />اللي ينفع عمرو خالد اسمعوا كلامي"
