author = "لن يصمت البرادعى"
posted = "2010-02-25"
text = "البرادعى يصمت لية<br />النظام الديكتاتورى يخاف ما يختشيش - والبرادعى قامة عالمية عالية ولا يجرؤ احد على المس بة<br />والبرادعى هو الرئيس القادم<br />وعلى الاخرين ان يبحثوا عن ملاجىء لهم عند اخوالهم بتوع التايمز"
archived = "2010-02-27"
capture_url = "https://web.archive.org/web/20100227081501/http://www.20at.com:80/masr/news/15487-2010-02-25-13-06-50.html"

[[comments]]
