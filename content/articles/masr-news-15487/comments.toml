author = "الهواء الفاسد"
posted = "2010-02-25"
text = "افتحوا الابواب وافتحوا الشبابيك لتغيير الهواء الفاسد - لا للتوريث ولا للتمديد - شبعنا فقر وشبعنا ازمات - والبرادعى هو الرئيس"
archived = "2010-02-27"
capture_url = "https://web.archive.org/web/20100227081501/http://www.20at.com:80/masr/news/15487-2010-02-25-13-06-50.html"

