author = "ارشح عمرو خالد"
posted = "2010-02-25"
text = "يا شعب مصر بلاش هبل وعبط<br />برادعي ايه وبطيخ ايه بصو في الصورة شوفوا القعده بتاعتهم عامله ازاي<br />عمرو خالد هو الونحيد اللي يستاهل يبقى رئيس مصر<br />لماذا ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ ؟؟؟؟؟؟؟؟؟؟<br />لان عمر خالد حس بالفقير<br />حس بالمسكين<br />حس بالمحتاج<br />علشان خاطر هو الوحيد اللي ممكن ينهض بالشعب المصري<br />لكن البرادعي اللي حاطط رجل على رجل في الصورة دا حاسس بمين<br />بلاش كلام فارغ يا شعب<br />عمرو خالد هو الوحيد اللي المفروش يترشح لحكم مصر"
archived = "2010-02-27"
capture_url = "https://web.archive.org/web/20100227081501/http://www.20at.com:80/masr/news/15487-2010-02-25-13-06-50.html"

[[comments]]
