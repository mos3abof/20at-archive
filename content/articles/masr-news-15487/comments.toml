subject = ""
author = "المعلق السابق"
posted = "2010-02-26"
text = "ومين اللى خللى مصر بلد ال مليون شحات و5 مليون عانس والمليون طفل مشرد وال 10 مليون عاطل و 7 مليون مريض الكبد بى وسى<br />مين !!!!!!!!!!!!!!<br />مش حسنى وابنة<br />مش ابن حسنى هو اللى عوم الجنية وخلاة بعد ما كان يساوى دولار والموظف اللى مرتبة 200 جنية يعنى بيقبض 200 دولار - خللى الدولار ب 6 جنية - يعنى خفض مرتبات الموظفين للسدس<br />مش النظام الفاسد القائم<br />يا راجل دة فى اسبوع واحد فضيحة العلاج على نفقة الدولة<br />وزير المالية يعالج عينية ب مليون جنية على حساب الدولة فى امريكا ووزير الصحة يعالج نفسة فى لندن ب 10 الاف يورو ويعمل شوية فحوصات على حساب الدولة فى الوقت اللى المستشفيات الحكومية مفيش فيها شاش ولا قطن<br />لازم يبقى فية تغيير<br />مالها الصورة<br />عايزهم يقعدوا على بلاج شرم الشيخ زى صاحبنا<br />والا يتصوروا فى الميريلاند"
archived = "2010-02-27"
capture_url = "https://web.archive.org/web/20100227081501/http://www.20at.com:80/masr/news/15487-2010-02-25-13-06-50.html"

