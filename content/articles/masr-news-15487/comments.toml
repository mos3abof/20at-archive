posted = "2010-02-27"
text = "انا بقول لما نطلب التغيير نطلبه صح<br />لما نطلب التغيير نشوف مين اللي حيداوي جراحنا والامنا<br />اللي ينفعنا واحد زي عمر خالد عينه على الارمله واليتيم والمسكين<br />لكن اللي في الصورة دول ما ينفعوش ببصله<br />اثنين بهوات حطين رجل على رجل وبيضحكوا ولا على بالهم اي شيء<br />اخي كلنا عايزين نغير الحكم ولكن نجيب اللي يستحق الحكم نجيب اللي حيداوي جراحنا<br />زي عمر بن الخطاب كده كان بيمشي في الشارع والناس نايمين يشوف احوال الناس واحوال الرعية<br />لما نطلب التغيير نطلبه صح"
archived = "2010-02-27"
capture_url = "https://web.archive.org/web/20100227081501/http://www.20at.com:80/masr/news/15487-2010-02-25-13-06-50.html"
