[[comments]]
order = 7
subject = "مش هيك"
author = "ريما"
posted = "2006-10-13"
text = "لي كاتب النشيد الاردني انت خبصت الدنيا و لا مقطع عالتاني و كلو اغلاط<br />انا كتر نشيد بحبو النشيد الفلسطيني<br />فدائي .. فدائي<br />فدائي يا ارضي يا ارض الجدود<br />فدائي.. فدائي<br />فدائي يا شعبي يا شعب الخلود<br />بحب كتير رنة كلمة فدائي.. و بصراحة بتذكر على طول منظمة التحرير<br />الله يرحمك يا ابو عمار... يوم جنازتك حسيت النشيد انكتب الك انت بالذات<br />تحية الك يا رمز الفدائية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131758/http://www.20at.com/article2.php?sid=947"
