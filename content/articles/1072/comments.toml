text = "عيشي بلادي عاش اتحاد إماراتنا<br />عشت لشعب دينه الإسلام هديه القرآن<br />حصنتك بسم الله يا وطن<br />دام الأمان وعاش العلم يا إماراتنا<br />رمزالعروبة كلنا نفديكِ<br />بالدما نرويكِ<br />نفديك بالأرواح يا وطن"
