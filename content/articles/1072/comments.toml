order = 0
subject = "نسيتوا الأردن!!"
author = "Yahya_Ayash"
posted = "2006-06-16"
text = "يوم موت الملك حسين رحت لصديق أردني قلت له بالمناسبة النشيد الوطني للأردن إيه؟..<br />صاحبنا راح قعد ينشد:<br />عاش المليك..<br />عاش المليك..<br />ساميا ما قالوا له قاتل في المعارك..<br />عاش اسمه..<br />الشباب الأمجد..<br />جندك المجند..<br />عزمه لا ينفد..<br />مش فاكر الباقي وبصراحة معجبنيش \"رأي شخصي\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131758/http://www.20at.com/article2.php?sid=947"

