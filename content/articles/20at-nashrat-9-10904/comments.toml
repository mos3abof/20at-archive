posted = "2009-01-08"
text = "سوف نقوم بمهاجمة المنتديات اليهودية<br />ونقوم بالتسجيل فيها<br />وإضافة موضوعات تؤثر فيهم نفسياً وتنشر الرعب<br />ولا يشترط أن تكون بالعبرية وإن كان ذلك ممكناً عن طريق استخدام أدوات اللغة في جوجل<br />بل قد تكون الكتابة العربية أكثر تأثيراً وأعمق في نفوسهم<br />( يكفي أن العرب يمرحون في منتدياتهم)<br />أمثلة<br />1-تحليلات عسكرية ، ومقالات توضح الوضع السئ لليهود وتثير فيهم اليأس والإنهزامية<br />2- صور لجرحاهم وقتلاهم ومعداتهم العسكرية المدمرة<br />3- تذكيرهم بهزيمتهم في لبنان<br />4- توعدههم وتهديدهم<br />5- صور مقاتلي حماس والمقاومة ، ومقاطع فيديو من استعراضاتهم العسكرية<br />ومن أمثلة ذلك الكثير مما تتفتق عنه قريحتكم"
archived = "2009-07-30"
capture_url = "https://web.archive.org/web/20090730222355/http://www.20at.com:80/20at/nashrat-9/10904.html"

