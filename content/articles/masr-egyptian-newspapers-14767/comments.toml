author = "موت يا حمار"
posted = "2010-01-06"
text = "من سنة فاتت كان يجب طرد هذا الوزير الفاشل<br />من ايام تسرب امتحان الثانوية العامة فى بنى سويف والمنيا وكانت الطلبة بتشترى امتحانات الثانوية العامة من المكتبات<br />وطبعا بما ان رئيس النظام شبة ميت وفى غيبوبة فتذكر تلك القصة بعد سنة ونصف من حدوثها وطردة من الوزارة<br />ثم ماذا ؟<br />ماذا سيفعل الوزير الجديد ايا كان ؟<br />اصلاح التعليم او التطوير محتاج فلوس وميزانية - والفلوس بتنصرف على مليون عسكرى امن مركزى وسفريات العلاج لباريس كل شهرين وشراء الجمبرى فى الشرم لزوم الحاشية<br />يبقى مفيش اى فايدة فى اى تغيير"
archived = "2010-01-07"
