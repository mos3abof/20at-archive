[[comments]]
order = 6
subject = "الموضوع جميل و لكن"
text = "الموضوع فعلا جميل،و هو نظرة فى حال ( الكرسي) العربي، ولكن اظن لو ان الكاتبة قامت بتخصيص موضوع لكل فقرة من فقرات الموضوع لأوضحت المزيد، بمعنى أنها لو تحدثت عن مصائر الرؤساء الذين خرجوا من السلطة عنوة، فى موضوع، ثم كتبت عن الرجل الثاني في السلطة و انه كان فى كثير من الأحيان أول المنقلبين على صاحب العزة و السلطة، و موضوع عن السلطة و المال وثروة أصحاب الجلالة و الفخامة، و موضوع عن جنون العظمة الذي يصاب به الرؤساء، و إليها كتاب \"البحث عن الذات\" خير دليل على ذلك<br />أظن أنها بذلك كانت ستمنح لنفسها مساحة للحديث بشكل افضل عن هذه النماذج المريضة فى وطننا، و لكانت أمتعت القارئ أكثر و أكثر<br />و على كل حال، الموضوع فعلا شيق و مثير ومكتوب بشكل جيد<br />تحياتى للكاتبة"
archived = "2004-10-21"
capture_url = "https://web.archive.org/web/20041021233824/http://www.20at.com:80/article.php?sid=472"

