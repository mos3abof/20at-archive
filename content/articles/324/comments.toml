[[comments]]
order = 2
subject = "بيرو + مطر (إنتاج مشترك)"
text = "زارَ الرئيسُ المُؤتمنْ<br />‍‍‍‍‍بعضَ ولاياتِ الوطنْ<br />وحينَ زارَ حَيَّنا<br />قالَ لنا :<br />هاتوا شكاواكم بصدقٍ في العَلَنْ<br />ولا تخافوا أحداً .. فقد مضى ذاك الزمنْ<br />فقالَ صاحبي \" حسنْ \" :<br />يا سيدي<br />أينَ الرغيفُ واللبنْ ؟<br />وأينَ تأمينُ السكنْ ؟<br />وأينَ توفيرُ المِهنْ ؟<br />وأين منْ<br />يوفرُ الدواءَ للفقيرِ دونما ثمنْ ؟<br />يا سيدي<br />لم نَرَ منْ ذلكَ شيئاً أبداً<br />قال الرئيسُ في حَزَنْ :<br />أحرقَ رَبّي جَسدي<br />أكَلُّ هذا حاصلٌ في بَلدي ؟!!<br />شكراً على صِدْقكَ في تنبيهنا يا ولدي<br />سوفَ تَرَ الخيرَ غداً .<br />وبعدَ عامٍ زارَنا<br />ومَرَّةً ثانيةً قالَ لنا :<br />هاتوا شكاواكُمْ بصدقٍ في العَلنْ<br />ولا تخافوا أحداً<br />فقدْ مَضى ذاك الزَّمَنْ<br />لمْ يَشتكِ النّاسُ !!<br />فَقُمتُ مُعلناً :<br />أينَ الرغِيفُ واللبنْ ؟<br />وأينَ تأمينُ السكنْ ؟ وأينَ توفيرُ المِهَنْ ؟<br />وأينَ مَنْ<br />يُوَفِّرُ الدَّواءَ للفقيرِ دونما ثَمَنْ ؟<br />معذرةً ياسيدي<br />... وأينَ صاحبي \" حَسَنْ \" ؟؟؟!!!"
archived = "2004-10-21"
capture_url = "https://web.archive.org/web/20041021233824/http://www.20at.com:80/article.php?sid=472"

[[comments]]
