subject = "مطر"
text = "أنا لو كنت رئيساً عربيا<br />لحللت المشكلة...<br />وأرحت الشعب مما أثقله...<br />أنا لو كنت رئيساً<br />لدعوت الرؤساء...<br />ولألقيت خطاباً موجزاً<br />عما يعاني شعبنا منه<br />وعن سر العناء...<br />ولقاطعت جميع الأسئلة...<br />وقرأت البسملة...<br />وعليهم وعلى نفسي قذفت القنبلة(!!!!!!!)"
archived = "2004-10-21"
