subject = "مصـ( الخير )ـعب"
text = "السلام عليكم يا حماعة<br />على فكرة أنا عاوز أقول حاجة<br />من باب الأمانة العلمية<br />فقط لا غير<br />النصاااااااااااااااااااااااااااااااااب<br />اللي اسمه \" بيرو\"<br />و النصااااااااااااااااااااااااااااااب<br />اللي اسمه \"مطر\"<br />هما في الواقع شخصية واحدة<br />و إليكم المفاجأة<br />الشخصيتان هما في الواقع :<br />\" البراء أشرف جابر \"<br />كاتب المقالات على الموقع<br />أصل أنا يا جماعة صاحبه<br />مساء الخيييييييييييييير يا بيرو<br />sory يا مطر ,,,<br />يووووه آسف قصدي يا براء<br />هاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاهاها"
archived = "2004-10-21"
capture_url = "https://web.archive.org/web/20041021233824/http://www.20at.com:80/article.php?sid=472"

