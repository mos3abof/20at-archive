author = "امة الله المصرية"
posted = "2009-10-21"
text = "اذا كان لم يخطئ لما يهددها؟من ماذا هو خائف؟اين بطولاته و اخلاقه الرياضية في تهديد النساء؟ يا حسرة كان من اكثر الرياضيين اللذين تفتخر بهم مصر"
