subject = ""
author = "حوارى طنطا"
posted = "2009-10-20"
text = "مش شوبير دة كان بيلعب كرة شراب فى حوارى طنطا وكان حافى والغبى التانى كان بيجرى وراء حمار فى قريتة بجانب ميت غمر<br />دلوقتى اصبحوا بتوع نسوان وتسجيلات واصحاب عمارات فى طنطا وشركات وفلوس - صحيح الفقر للناس دى دواء<br />فين اخلاق القرية اللى الزبالة دى جاية منها<br />لية يخوضوا فى الاعراض ويتكلموا فى التليفزيون والجرايد<br />موضوع فى منتهى السفالة"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022121947/http://www.20at.com:80/masr/2khbar/13768-2009-10-20-08-52-07.html"

[[comments]]
order = 1
subject = ""
author = "الحقارة والوضاعة"
posted = "2009-10-20"
text = "شخصين من المتسلقين وقادمين من قاع المجتمع كان اهاليهم من المعدمين وتعلموا فى مدارس ناصر المجانية وفى عصر النهب والسلب سرقوا وظهروا واغتنوا واصبحوا من اصحاب الملايين وعلى صفحات الجرايد وعلى شاشات القنوات الخاصة<br />اية الهيافة دى<br />ما يروحوا فى ستين داهية"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022121947/http://www.20at.com:80/masr/2khbar/13768-2009-10-20-08-52-07.html"

