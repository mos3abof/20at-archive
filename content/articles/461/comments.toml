[[comments]]
order = 0
subject = "مصـ( الخير )ـعب"
text = "الووو..<br />ايه؟! مين؟! ليه؟! فين؟! ازاي؟!<br />ياهووووووووووووووووووووه<br />أخيرا قررت عشرينات ترفع الرقابة الحزبية..<br />من بكرة الصبح هيكون عندكم :<br />\"البيان التأسيسي للحلف الالكتروني الفظيع!!\"<br />فاكرينه؟!<br />إن شاء الله سنطالب لجنة الأحزاب بالموقع<br />أن تنشر هذا البيان و معه تاريخ نشأة الحزب..<br />و مساء الديموقراطية يا شباب عشرينات!!"
archived = "2004-11-26"
capture_url = "https://web.archive.org/web/20041126092440/http://www.20at.com:80/article.php?sid=774"

[[comments]]
order = 1
subject = "بيرو.. كنت بعافية ورجعت"
text = "بست ..بست ..<br />كابتن ياللي فوق ..<br />لحظة واحدة الله يخليك<br />الواضح ان الأخ ناسي هو مين وأنا مين<br />أنت المتحدث الرسمي فعلا<br />لكن البوس هنا يا ابا<br />مفيش احزاب الا لما تدفع فلوس نص الفراخ اللي انت لسه بالعه من نص ساعة ..<br />وصلت الفلوس ..نعمل الحزب ونعيش سوا عيشة هنيا<br />موصلتش الفلوس..<br />موش هقولك ع اللي هيحصل<br />تسمع عن الأخوان وحزب الوسط والحكومة<br />حخليك أزفت كم التلاتة<br />لا انت طايل اخوان<br />ولا شايف حكومة<br />ووسطك تاعبك<br />من الفراخ طبعا<br />سلام يا حلف الشر"
archived = "2004-11-26"
capture_url = "https://web.archive.org/web/20041126092440/http://www.20at.com:80/article.php?sid=774"

[[comments]]
order = 2
subject = "مصـ( الخير )ـعب"
text = "حمدالله على السلامة يا بوس<br />أنا زعلان منك لأنك فهمتني كده غلط<br />ومش من أولها يا بوس!!<br />لو تلاحظ يا زعيم انا قلت إن احنا هننشر تاريخ الحلف<br />و لا يمكن تجاهل دورك في تاريخ الحلف<br />و دي مش مجاملة دي حقائق<br />و ما تنساش يا باشا<br />انت اللي كلفتنب أكتب اليبان التأسيسي<br />وللا ايه؟<br />حمدالله على السلامة<br />المتحدث الرسمي باسم الحلف الالكتروني الفظيع"
archived = "2004-11-26"
capture_url = "https://web.archive.org/web/20041126092440/http://www.20at.com:80/article.php?sid=774"

[[comments]]
order = 3
subject = "بيرو..وصية سياسي ناوي يعتزل"
text = "طيب<br />لما نشوف<br />أشهر الحلف يا ولد<br />بس براحة ع الحكومةالمعارضة<br />وخليك شديد مع المعارضة الحكيمة<br />والجرايد لو كتبتك عنك ظبطها<br />والناس لو أشتكت منك بططها<br />والقضية لو سهلة عقدها<br />ولو صعبة أربطها<br />أبعد عن الشعب وقضيتها<br />وعن سعد أبراهيم ومعونته<br />وخليك مع \"الجميل ابن الجميل\"<br />ده حتي ربنا بيحب الجمال<br />يا ابني خدها مني كلمة<br />وابقي رجعها تاني..!!<br />البلد دي مفيهاش سياسة<br />وأنت وحظك بقي"
archived = "2004-11-26"
capture_url = "https://web.archive.org/web/20041126092440/http://www.20at.com:80/article.php?sid=774"

[[comments]]
order = 4
subject = "القيصر"
text = "بسم الله ما شاء الله<br />الثنائي الفضي بيرو ومصعب"
archived = "2004-11-26"
capture_url = "https://web.archive.org/web/20041126092440/http://www.20at.com:80/article.php?sid=774"

[[comments]]
order = 5
subject = "مقطع السمكه وديلها"
text = "انا بقى حزبي اسمه حزب الهيئه عباره عن 11 او 12 شاب .<br />كنا مع بعض من المدرسه وبنتقابل كل اسبوع في قهوه في حتتنا.<br />احنا ما نعملش حاجه سوى شرب السجاير والشيشه وسعات حجات تانيه.<br />اصل احنا مش لاقيين شغلانه ودورنا كتيير بس ما فيش فايده."
archived = "2004-11-26"
capture_url = "https://web.archive.org/web/20041126092440/http://www.20at.com:80/article.php?sid=774"

