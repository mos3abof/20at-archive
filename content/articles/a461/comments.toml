subject = "اول دى جى اسلامى روش طحن"
text = "شاهدت مصطفى محمود المنشد الإسلامى وهو يقوم بالدى جى الإسلامى فوجدته لا يقل كفاءة وشياكة وروشنه عن ما كنت أراه زمان فى الديسكوهات الكبيرة (الحمد لله ربنا تاب علينا)والحمد لله ان احنا بنشوف نماذج زى مصطفى"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154731/http://www.20at.com:80/article.php?sid=461"

