[[comments]]
order = 5
subject = "الليدي"
text = "شكرا علي تعليقك القيم<br />خاصة ‘لي اضافة بعض الأسماء اللامعة في عالم الدي جي مثل الحريري وغيره وهؤلاء تحولوا إلي حيتان في سوق الدي جي خاصةفي حفلات الصيف والقري السياحية وهؤلاء تحديدا هم من يرافق حفلاتهم الكثير من السلوكيات السيئة مثل شرب الخمور أو إرتداء ملابس فاضحة وإلي ماهنالك من تصرفات معروفة<br />ولذلك تجاهلنا هؤلاء محاولين التركيز علي البسطاء من الشباب العاملين في هذا المجال في كل من فلسطين ومصر<br />اما عن عدم تغطية باقي البلاد العربية فهذا لظروف تواجد مراسلين في باقي البلدان العربية وهو ماسنحاول توفيره في قادم الموضوعات بإذن الله<br />اما عن كتابة disco فيمكنك مراجعة الموضوع مرة أخري لتكتشفي أننا كتبناها بطريقة صحيحة<br />وشكراًعلي اهتمامك<br />المحرر"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154731/http://www.20at.com:80/article.php?sid=461"

