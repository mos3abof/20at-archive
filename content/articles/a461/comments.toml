[[comments]]
order = 0
subject = "بالنسبة إلي"
text = "أنا أكره هذه المهنة مووووووووت..<br />أنا أكره الأفراح ذات الضوضاء موووووووووووووووت<br />أنا أكره الدي جي طحن.......<br />إنها مهنة اللامهنة<br />ما يشغلوا الراديو على الشرق الأوسط ويخلصونا لازم واحد يقعد يشغل أغاني.. حاجة خنتأوش خالص"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154731/http://www.20at.com:80/article.php?sid=461"

[[comments]]
order = 1
subject = "سؤال لو سمحتم"
text = "لا مؤاخذة في السؤال<br />هو العمل فى هذه المهنة ايه الموقف الشرعي منها؟ يعنى حرام ولا حلال ؟<br />ارجو من الأستاذ مسعود ان يفيدنا بالاجابة علي سؤالى، خاصة و أن ضيق اليد، و انتشار البطالة قد تدفعنا الى العمل بهذه المهنة"
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154731/http://www.20at.com:80/article.php?sid=461"

[[comments]]
order = 2
subject = "lady-cyclamen"
text = "الموضوع ده بالذات حاسة إني لازم أعلق عليه لأن ناقصه حاجات كتير, أولا بالنسبة لكلمة ( DJ ) فمعناها ( DISC JOCKEY ) و ليس ( DISCO JOCKEY ) لأن كلمة ديسك تفرق عن ديسكو كتير في المعنى لغوياً طبعاًفالديسك تعني الأسطوانة, كنت أرجو مراجعة أي قاموس حتى لا يكون هناك مثل هذه الأخطاء اللغوية البسيطة التي تشكك في مصداقية الموضوع, ثانياًالموضوع أهمل وجود ( DJ ) سيدات لحفلات الفتيات سواء أعياد الميلاد أو الأفراح و ليلة الحنة و هو منتشر بشكل كبير للغاية و عليه إقبال ممتاز, ثالثاً النماذج المعروضة هي فقط لشباب يعاني من هذه المهنة أو من أجل لقمة العيش, هناك نماذج ل( DJ ) و خصوصاً هنا في مصر بين الطبقات الغنية و المتوسطة تجني أرباحاً خيالية على مدار السنة مثل ( AMAZON DJ ) الخاص بياسر و وليد الحريري هنا في مصر, من الملاحظ أيضاً أن الموضوع يوضح ظاهرة ال( DJ ) بشكل كبير في فلسطين و هو حقاً ما يريد معرفته الكثير من الشباب و لكن لم يذكر أي بلد آخر في الوطن العربي مثل دول الخليج و سوريا و لبنان, تعليق أخير أود أن أضيفه و هو عن مدى حرمانية هذه المهنة من عدمها, فأنا أعتقد أن حرمانيتها يعتمد على نوعية الأغاني و كلماتها ( ألا تكون خارجة ) و أيضاً تعتمد على الجو العام للمكان و الأشخاص المحيطين ( كمكان يشرب فيه الخمور أو شباب و فتيات يلبسون ملابس خارجة و يرقصون سوياً بدون أي خجل أو حياء ) و الله أعلم.<br />اللهم إني بلغت, اللهم فأشهد.<br />و أرجو لكم التوفيق في موضوعات أخرى."
archived = "2004-08-31"
capture_url = "https://web.archive.org/web/20040831154731/http://www.20at.com:80/article.php?sid=461"

[[comments]]
