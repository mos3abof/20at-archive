[[comments]]
order = 5
subject = "لاجديد"
author = "نور الغد"
posted = "2006-06-12"
text = "لا يوجد شى فى برنامج الحزب جديد تغير الدستور دولة برلمانية تقليل سلطات الرئيس وغير ذالك هو نفس برنامج حزب الغد وهذا كل ما طالب بة الدكتور ايمن نور الذى حارب الفساد والظلم وانشاء اقوى احزاب المعارضة المصرية وانك كامواطن تشعر بحزب الغد فى كل المظاهرات من اجل الحرية وفى كل مكان ومع كل الاحترام للدكتور اسامةحرب لااعتقد ان بحزبة سيستطيع ان يقف ضد الظلم والفساد وان يغير اى شى لقد حاول الرجل الذى جاء الى الدنيا لكى يكون زعيم ولم يستطيع واصبح يدفع حريتة وبعدة عن زوجتة واولاده وعن حزبة لذلك لااعتقد ان الحزب سيواثر فى اى شى فى مصر"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216231309/http://masr.20at.com:80/article.php?sid=496&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

