[[comments]]
order = 2
subject = "العدالة والحرية"
author = "محمد"
posted = "2006-06-11"
text = "الدكتور اسامة حرب والناس اللى معاه ناس محترمة جدا ومعروفين بانهم جدعان وربنا يوفقهم ، بس يارب ماتكون نهاية الحزب زى غيره ويحصل التجمد الفظيع التى يعانى منها كل احزاب مصر ما عدا الوطنى طبعا لانه بيحكم بالعافية ، ويارب كل الاحزاب تحط ايدها مع بعض برغم اختلافتها لان الهدف الوحيد دلوقتى هو رحيل هذا النظام الفاسد المفسد ، وربنا المعين"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216231309/http://masr.20at.com:80/article.php?sid=496&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "الامل الجديد"
author = "ميدو"
posted = "2006-06-12"
text = "اتمنى من كل قلبى مثلى مثل كل المصرين البائسين المهدور حقوقهم الانسانية والاجتماعية والسياسيةفى ازاحة هذاالنظام الملكى الوراثى وان كنت اشك فى موافقة لجنة الحزن الوطنى بالموافقة وحتى ان تمت الموافقةلن يخلو الامر من بعض الاسافين ولكن اى سوال واتمنى الاجابة علية من الدكتور اسامة (كم سنة يحتاج الشخص المثقف مثلكم للحكم على لجنة الحزن الوطنى بانها مكلمة)؟ واتمنى التوفيق"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216231309/http://masr.20at.com:80/article.php?sid=496&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

