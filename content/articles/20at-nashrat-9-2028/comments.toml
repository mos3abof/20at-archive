text = "ورقــة تعريـف فنيـة بالفنـانة والأستـاذة ليـلى لمرينـي<br />* تعشق الفنون أينما هبت نسائمها لكنها تحتضن<br />فن الملحون بكل جوارحها *<br />عندما يلتقي العلم بالموهبة في شخصية واحدة يتولد الإبداع هكذا هي الأستاذة والفنانة ليلى لمريني،و في مدينة مكناس نشأت ليلى و من جمال التراث الشعبي تزينت وعشقت فن الملحون مند الصغر حيث علقت بكلماته وأنغامه و بكل مشاعرها الرقيقة تفانت لتجسده في قالب غناء راق، وهي الآن من أهم الأصوات النسائية المنشدة لطرب الملحون والتي تعتبره من أرقى التعابير الفنية الشعبية المغربية وكذلك تعتبره رمز لهويتنا الثقافية.<br />ومن هنا كانت الانطلاقة في رحلات استكشافية في عمق التراث الموسيقي الشعبي وقد حان الوقت، ليتحول العشق إلى دراسة للموسيقى بكل ألوانها ومن بعدها صارالولع بالموسيقى العربية وباللغة العربية كشذى يعطر أيامها وعبرها نستنشق عبق التاريخ كما نلاحظ ان الملحون وإنشاد أضحى دراسة علمية لكل من يرغب في تعلم تاريخ الموسيقى العربية وهي الآن تعمل بالمعهد الموسيقي التابع لوزارة الثقافة عازفة على كل من آلة العود والبيانو، ملمة بإنشاد التراث من الموسيقى سواء أندلسية،أو غرناطي كفن المديح والسماع ومتخصصة في فن الملحون حيث حصلت على الجائزة الأولى فيه والجائزة الشرفية، تتابع دراستها الموسيقية الأكاديمية، وهكذا حظيت ليلى باهتمام الشيخ الكبير الحاج الحسين التولالي والأستاذ المبدع الحاج محمد الوالي رئيس جوق مكناس الملحون والذي تعتبره الأب الروحي لها فعلى يديه أخذت قواعد الإنشاد وقد ضمها إلى الأصوات النسائية المتميزة في مدينة مكناس حتى أصبحت لها مكانةخاصة سواء محليا أو دوليا وكذلك الشيخ مولاي عبد العزيز العبدلاوي أحد الشيوخ البارزين بمكناس والذي أسند إليها عدة قصائد من نظمه للإنشاد لتميزها عن باقي المنشدات.<br />وبتمكنها من أداء القصائد التراثية وبراعة التعامل مع مخارج الحروف والكلمات والأوزان الشعرية كون لدى المطربة ليلى لمريني حوافزوتأهيل علمي أعانها كي تكون واثقة بالنفس حيث شاركت في عدة ملتقيات عدة مرات كملتقى سجلماسة لفن الملحون بكل من الراشدية أرفود والريصاني، بالإضافة إلى المشاركة الفعالة في إحياء عدة سهرات للقناتين الأولى والثانية وعلى خشبة مسرح محمد الخامس بالرباط وبالعديد من المدن المغربية، لتصل إلى باريس حيث لم تكن تتوقع الاستقبال الحار من طرف الجمهور بمختلف جنسياته وهي تقدم لوحات فنية ملحونية وفق قالب جديد في إطار زمن المغرب في فرنسا وبالضبط على خشبة معهد العالم العربي وقد كانت ليلى ضمن النجوم الأكثر إشراقا في إبراز جانب من التراث المغربي الأصيل وهي تؤدي إنشادا لقصائد دينية وروائع فن الملحون والمديح للرسول الكريم مما جعلت الكثير يكتشفون جمالية الملحون عبر غنتها المتميزة وقدرتها الفائقة في أداء جل القياسات أي الطبوع المرتبطة به، وهكذا لاقت استحسانا كبيرا من طرف الجمهور وكذلك اللجنة المنظمة لهذا الملتقى الدولي الكبير الذي نالت خلاله جائزة تقديرية، لتحط الرحال في هولندا حيث أنشدت وأطربت الجمهور الحاضر في أكبر مسارح أمستردام حيث تفاجئت بعشقهم للتراث المغربي فأنشدت ليلى مختلف أنواع هذا التراث وتمكنت من إعطاء لوحة فنية باهرة علقت في أذهانهم وقلوبهم، فالفن هو مرآة الشعوب ولغة التعايش، التساكن، لغة المحبة والسلام.<br />لم يقتصر مسار ليلى المريني على الدراسة العلمية والمساهمة في إعادة ما يزخر به المشهد الغنائي التراثي بل قامت بتسجيل مجموعة من القصائد الشعرية في شكل جديد ينهل من نبع تراث الملحون مثل:<br />معيار الباهيات غاسق لنجال الزمنية والعصرية التيهان<br />وذلك بتنسيق مع الأستاذ والمبدع الحاج محمد الوالي بالإضافة إلى مشاركتها الفعالة في إحياء عدة سهرات لفائدة الأعمال الجمعوية والإنسانية والمساهمة الفنية مع العديد من الجمعيات كعالمة ومبدعة تعتز بتراثها وبهويتها.<br />فكما قلنا لم ينته البحث والاشتغال عند هذه الفنانة المتألقة بل بفضل اجتهادها ودراستها استطاعت أن تمزج بين التراث المغربي والجاز، في مهرجان الجاز في شالة في دورته الحادية عشر والذي يحتضن نخبة من ألمع نجوم الموسيقى الأوربية تحت شعار المرأة والشباب والأصالة هكذا مزجت ليلى ما بين طرب الملحون الخاص بمدينة مكناس مسقط رأسها وإيحاءات المتوسطية للفنان العازف على آلة الساكسفون والملحن الفرنسي PADOVANI ومجموعته.<br />حيث كانت ليلى من ألمع نجوم المهرجان وبرهنت عن حضور المرأة والشباب والأصالة بشكل قوي في شخصها فهي المرأة الشابة التي تعتز بأصالتها و تراثها وهويتها، وقد أحسنت وعبرت عن نخوة واحترافية و مهنية عالية عبر أدائها لأصعب الألوان التراثية وبهذا الشكل الجديد الذي لقي تجاوبا واستحسانا وتنويها كبيرا من طرف الجمهور العريض و الشخصيات المهمة فصفقوا لها بحرارة وإعجاب، والكل يشهد أن لهذه الفنانة حضور قوي ومتميز على خشبة المسرح بما يبرهن على قوة شخصيتها المتزنة والملتزمة وهذا ما يعطيها طابع الخاصية والتميز.<br />واستطاعت بذلك أن تكون سفيرة لتراثنا المغربي والعربي الأصيل ودائما في إطار المزج بين موسيقى الجاز والتراث المغربي،حيث قامت بجولة فنية رفقة الموزع الفرنسي والمجموعة في كل من باريس،تولوز،وبد ار الأبرا بديجون.حيث تفاجئت بالحضور المتميز للجمهور وعشقهم لتراثنا المغربي بشكله الجديد واستحسانهم لتلاقح مختلف الثقافات الموسيقية رغم اختلاف الهوية فكانت حاضرة كل من فرنسا،المغرب،ال جزائروماسيدوان.<br />وبعدها رحلت هذه الفنانة المتألقة إلى بلد الفن والموسيقى النمسا وخاصة بمدينة فيينا حيث قامت بالتعريف بالتراث المغربي بشتى ألوانه(الملحون، الموسيقى الأندلسية،الغرن اطي) حيث استطاع المستمع والمشاهد النمساوي التعرف على هذا التراث الجميل من خلال هذه الفنانة التي تحدثت بكل تلقائية وسلاسة عن هذا الأخير معتزة بثقافتها وبهويتها المغربية،وبعدها قامت بإحياء سهرة فنية للتراث المغربي بمناسبة افتتاح رياض مغربي نمساوي نور النخيل من طرف النمساويين إذا يدلل على شيء فإنما يدل ارتباط النمسا بالعرب وكان الحضور من جميع مختلف الجاليات وعلى رأسهم السفارة المغربية،فاستقب لت فنانتنا من طرف السفير المغربي بالنمسا فأمتدح مشاركة الفنانة ليلى المريني ونوه بمشاركتها الفعالة في التعريف بتراثنا بهذا الشكل المتميز والاحترافي،فالب فعل تستحق الشهادة التي سلمت إليها كسفيرة للنوايا الحسنة من طرف العصبة المغربية لحماية الطفولة،ونعتز ونفتخر بها كسفيرة لتراثنا.<br />إلا أن الجميل في هذه الفنانة أنها لم تقتصر على كونها فنانة من الطرازالعالي بل استطاعت أن تنبث جدارتها كذلك في تنظيم بعض المهرجانات المحلية والوطنية،وتنشيط الحركة الثقافية وتقديم سهرات بمختلف المدن المغربية بأسلوبها السلس والتلقائي وهذا بشهادة لمهتمين والمسؤولين.<br />هكذا نجزم أن أداء الفنانة الأستاذة ليلى المريني هو الأداء الأمثل لقصيدة الملحون والذي يجب أن يمتح منه كل من يسكنه عشق القصيدة إيقاعا وسماعا ودائما يبقى للمتخصصين في الميدان والمستمعين الحكم على ذلك .<br />ومن خلال هذه المسيرة الفنية المتألقة استطاعت ليلى أن تنبث وجودها داخل الوسط الفني بجدارة واستحقاق.<br />إلا أن الجميل في هذه الفنانة أنها لم تقتصر على كونها فنانة من الطراز العالي بل استطاعت أن تنبث جدارتها كذلك في تنظيم بعض المهرجانات المحلية و الوطنية، وتنشيط وتقديم سهرات بمختلف المدن المغربية بأسلوبها السلس و التلقائي وهذا بشهادة المهتمين والمسؤولين.<br />هكذا نجزم أن أداء الفنانة الأستاذة ليلى المريني هو الأداء الأمثل لقصيدة الملحون و الذي يجب أن يمتح منه كل من يسكنه عشق القصيدة إيقاعا وسماعا ودائما يبقى للمتخصصين في الميدان والمستمعين الحكم على ذلك.<br />ومن خلال هذه المسيرة الفنية المتألقة استطاعت ليلى أن تنبث وجودها داخل الوسط الفني<br />بجدارة واستحقاق.<br />محمد الأسواني<br /><embed id=\\\"VideoPlayb ack\\\" src=\\\"http://video.google.com/googleplayer.swf?docid=-8974976540246419212&hl=de&fs=true\\\" style=\\\"width:400p x;height:326px\\\" allowFullScreen =\\\"true\\\" allowScriptAcce ss=\\\"always\\\" type=\\\"applicatio n/x-shockwave-flash\\\">;"
