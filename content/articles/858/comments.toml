[[comments]]
order = 0
subject = "ضاف ايه يا بت ؟؟؟ معرفش"
author = "هبابه او هوبه او هبهوب"
posted = "2006-03-22"
text = "هو اتكلم عن نفسي \" معرفش حاسه ان الموقع بقاله كام يوم زي ما بيقولي اتكلمي يابت \"<br />حاضر حتكلم يا بشر<br />اولا اولا اولا اولا يعني اللي مربني \" عمو\"<br />اللي هو سلفي \" وخدلي بالك انت من الحته دي \"<br />علي الرغم مني اني لسه عارفه يعني ايه سلفيه قريب بس كل اللي كنت اعرفه من عمي<br />\"السلف الصالح \"\" بيكفي \"<br />وبعدين ايه يا بشر دخلت مدارس \" عشان محدش يجي يقولي هما فاتحين ازهر عندكوا \"<br />لا اصل وانا صغيره رحت مدارس \" الاخوانيه \"<br />مش \" عدوانيه \" كانت مدارس لذيذه جدا وعلمتي حاجات كتير اوي .<br />يبقي بقي ابويا اللي هو \"علماني \" اللي ديما انا وهو نتخانق في مسائل فقهيه<br />بس بالنسبه \" للشباب \" معرفش بس اانا بحس ان الدنيا\" تعلم\" يا بشر ومفيهاش حاجه لما اكلم شباب بعتبار ان هما اللي طالع عينهم في الشغل وهما وهما يعني اخد بتجارب البشر \"مثلا ما انا في الموقع مصاحبه \" متنحش في مصاحبه دي \" دبدوب , مفتاح , كرمله دا غير الواقع\" والله يا بشر كلكوا اخواتي \" معني كدا اني قليله الادب لاه<br />بس حاجه كمان انتوا فاتحتوا الموضوع دا في في بيتنا ملتزم صح باختلاف الصياغه ليه بقي ها ها ها ليه ؟<br />\"هو انا ليه دايما بكتب اول تعليق \"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124109/http://www.20at.com/article2.php?sid=604"

[[comments]]
order = 1
subject = "جميل يا هبه"
author = "عبدالله مفتاح"
posted = "2006-03-22"
text = "والله موضوع جميل يا هبه بس كلمة في سرك وردت كلمة(شهوة) لشراء كتب وهي كلمة مش في محلها<br />ممكن تستبدل بكلمة رغبه عارمة او اي حاجه تانيه<br />خالص امنياتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124109/http://www.20at.com/article2.php?sid=604"

[[comments]]
order = 2
subject = "ماضافش حاجة"
author = "واحد تاني"
posted = "2006-03-23"
text = "اه ماضافشى حاجة …. استنى بس , متفهمنيش غلط … اصل كل واحد فينا جواه تركيبة الصح والغلط , الخيروالشر بره وبعيد …. الفكرة بقى يا محترم ان الالتزام بيمحى طبقة الصدأ اللى متراكمة على مناطق الصح والخير جواك وينفض من عليها اكوام التراب وبطبيعة الحال ينقلها فوق مناطق الغلط والشر … وساعتها تحس بلحظة ميلادك من جديد رغم انك اصلا كنت موجود بس الالتزام خلاك تلاقى نفسك اللى كانت ضايعة منك (صدقنى دا عن تجربة)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124109/http://www.20at.com/article2.php?sid=604"

[[comments]]
order = 3
subject = "أحمد زي Zأحمد"
author = "كرميلينو"
posted = "2006-03-23"
text = "لما التزمت من ييجي سنتين كده ( ربيت دقني يعني ) حاولت جاهدا ( خد بالك من جاهدا دي ) اني متغيرش افضل زي ما انا لاني دايما لمض و حاسس اني مبعملش غير الصح<br />كل اللي اتغير شويه اني عصرت على نفسي لمونه عشان اسمع الشيخ محمد حسين يعقوب و كانت تجربة حلوة لانه ساعات بيقول كلام كويس و عرفت اسماء شيوخ كتير مكنتش هسمع عنهم لو مكنتش ربيت دقني زي الشيخ ياسر سلامه ( مقريء ) و الشيخ مسعد انور ( على فكرة ده شيخ روش طحن )<br />و زي ما الدقن بتلقط التراب و العفار اتعرفت على ملتزمين كتير منهم المتشدد اللي مش طايق نفسه و لا طايق اللي حواليه و منهم المعتدل الكويس الرزين بتاع الرأي و الرأي الاخر<br />هي تجربه كويسة حاولوا تجربوها ( و كل واحد و ذوقه )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124109/http://www.20at.com/article2.php?sid=604"

[[comments]]
order = 4
subject = "عجيب أمرك"
author = "زارا"
posted = "2006-03-23"
text = "أهذا كل ما أخذت من الالتزام يا أحمد زاي ذقن ولمونة معصورة يعني ماشاء الله ما غيرت من خلقك وما غيرت من طباعك شيئاوفي النهاية تبقى تجربة وجربووووووووووها عجييييييييييييييييب والله يا أخي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124109/http://www.20at.com/article2.php?sid=604"

[[comments]]
order = 5
subject = "الالتزام مش دقن يا زارا"
author = "كرميلينو"
posted = "2006-03-23"
text = "انا قضدي يا اخ زارا اني كنت ملتزم قبل ما اربي دقني بس الناس مبتقولش ع الملتزم غير اللي مربي دقنوا و الملتزمة اللي بتلبس اسدال و خمار ( مع ان ناس كتير بيلسوه موضه )<br />انا قصدي اني كنت ملتزم قبل ما الناس تعرف اني ملتزم<br />فهمتني ؟؟؟<br />معلش عشان انا اسلوبي صعب شويه زي يوسف شاهين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124109/http://www.20at.com/article2.php?sid=604"

[[comments]]
order = 6
subject = "رسالة مهمة"
author = "رسالة مهمة"
posted = "2006-03-23"
text = "من فضلكم يا جماعة و بجد و من غير هذار و للاهمية القصوى ومن غير مبالغة<br />روحوا شوفوا اللى بيحصل على صفحة (الاخوان x وحيد حامد = تار بايت ) هاتوا الصفحة دى من الارشيف بسرعة من فضلكم واقراؤا الموضوع والتعليقات و بالاخص اخر تعليقين<br />يا ريت يا جماعة التفاعل والتعليق على الموضوع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124109/http://www.20at.com/article2.php?sid=604"

[[comments]]
order = 7
subject = "تعليق على تعليق"
author = "زارا"
posted = "2006-03-25"
text = "لم أكن أعرف أن أسلوب يوسف شاهين صعب لهذه الدرجة لأني لم أقرأله شيئا<br />على فكرة هل هوأصلا كتب شيئا؟؟؟؟ أفلامه كانت كافية لتكرهني فيه فما بالك أن أتحمل كتاباته على كل أنا آسفة لم أقصد الإساءة إليك. فأنا بصراحة أجد أن أجمل شيء صنعته في حياتي هو الالتزام ولا أحتاج لعصير الليمون ولا الحامض لكي أستمع لمحاضرة أي داعيةمهما كان.<br />تحياتي لكل الملتزمين بشرع الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124109/http://www.20at.com/article2.php?sid=604"

[[comments]]
order = 8
subject = "كونت عايش"
author = "محب للنبى ولعمرو خالد"
posted = "2006-03-26"
text = "تعليق صغير ولا كن حاولو ان تفهمو العنى والمغزى<br />قبل الالتزام كونــت عايــش<br />بعد الالتـــزام انــــا حى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124109/http://www.20at.com/article2.php?sid=604"

[[comments]]
order = 9
subject = "نفسي والله"
author = "حمدي"
posted = "2006-03-31"
text = "ادعوا لي ياجماعه علشان اكون ملتزم زيكم<br />اللهم احيني ملتزما وامتني ملتزما واحشرني في زمرة الملتزمين<br />امين يارب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124109/http://www.20at.com/article2.php?sid=604"
