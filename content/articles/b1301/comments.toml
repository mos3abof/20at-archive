[[comments]]
order = 16
subject = "كلمتين وبس"
author = "معاذ محمود عامر"
posted = "2006-10-03"
text = "(1) كويس جدا العنوان الجديد للمقال لان العنوان السابق كان في تعميم غبي وغير لائق بالمرة<br />(2) عندي كلمة للمسماة ريم<br />لما انتي شايفة ان عشرينات بيثير الفتن<br />ليه متريحيش نفسك وتريحينا وتحافظي على صيامك ومتخشيش عليه تاني<br />وبعدين بتتكلمي زي ميكون الكتاب في عشرينات بيكتبوا في آخر كل مقال يللا اشتموا في بعض يا حبايبي<br />السباب والشتيمة دول احنا اللي مسؤلين عنهم لأن التعليقات بتاعتنا معظمها عصبية(ولا أبرأ نفسي)<br />وابقي سلميلي على خالتك (فتنة)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

[[comments]]
order = 17
subject = "يااتفه شعب ( الشعب المصري ) ابو ريحة باااط"
author = "مازن"
posted = "2006-10-04"
text = "ههههههههههههههههه يامصاااريه<br />اقسم بالله الحريقة ارحم لكم يامعفنين حياتكم بؤس وربنا حارمكم من النعمه بسبب كثرة معاصيكم بالله شوفوا التلفزيون وشوفوا قنوات الاغاني سارت كلها مصاااريه وريحة باطهم طلعت في كل مكان<br />والله العظيم الشعب المصري مثير للشفقه شعب تافه وشعب جيعان وشعب شحات وماعنده الا اللف والدوران<br />اقول اتوجهوا لربكم عسى ان يرفع من درجتكم شويه ويخفف عنكم المصايب والهموم اللي انتوا فيها<br />لكن الحمدلله احنا هنا في اطهر بلد على وجه الارض الكل مرتاح والكل سعيد ومبسوط ولكن الاعلام التافه حقكم مافي الا يتكلم كلام حريم<br />وماجانا هذا الشي الا من تعلقنا بربنا الاعلى وحبنا فيه وحبنا لرسول الله عليه افضل الصلاة والسلام<br />حريييييييييقة في اتفه شعب الشعب المصري الكريه اللي ماله قيمه<br />على فكره المصاريه لمن يجوا عندنا السعودية يشتغلوا ( كلاب حراسه)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

[[comments]]
order = 18
subject = "الى الاخ الكريم مازن"
author = "ابراهيم - مصر"
posted = "2006-10-04"
text = "السلام عليكم و رحمة الله و بركاته،<br />الاخ الفاضل مازن، إسمحلى انى أتوجه لك بكلمتين عتاب رقيق، أرجو من الله انك تتقبلهم منى بصدر رحب:<br />أولا: حضرتك بدأت كلامك بالسب فى المصريين و توجيه الاهانه الغير مبرره بأى شكل، و خرجت عما أراه أصول الحوار الراقى او حتى اى اعتبار للشهر الكريم اللى احنا فيه.<br />ثانيا: يا أخى الفاضل حتى اذا كان الكلام السابق جرحك (و انا اتفق معاك على فكره ان اسلوب التعميم فى كتابة المقال جانبه الصواب من الكاتب الاصلى للموضوع) و لكن ده ما يعنيش انك تفتح النار على الجميع بالطريقه دى.<br />أرجو انك ماتاخدش كلامى على انه فيه اى إساءه ليك، بس ياريت يا جماعه نحاول نقرب من بعض، مش نبعد عن بعض و نعمل اللى بنعمله ده و ندى الفرصه للأغراب انهم يتمكنوا مننا عملا بمبدأ (فرق تسد)<br />لك منى الف سلام و تحيه (و على فكره انا ريحة باطى مش وحشه زى انت ما بتقول!)<br />ملاحظه على الماشى:<br />الى الاخت ريم من السعوديه بصفه خاصه ، و اى حد تانى ها يدخل يرد على الموضوع ده، ياريت يا جماعه تفكروا قبل ما تكتبوا اى رد او تفتحوا اى مجال للنقاش بصولها من منظور هلى الرد اللى هاتكتبوه ده هايبقى فى ميزان حسناتكم و لا العكس ، يا ترى الرد ده هايبقى بيوحد الصفوف ولا العكس ، يا ترى الرد ده انت هاتكيب بيه صديق و اخ و لا هاتعمل بيه عداوة و بغض.<br />فى النهايه، ملاحظة لوقع عشرينات اللى باحبه جدا و بخاف عليه جدا، ياريت يا جماعه تتحروا فى (بعض) مواضيعكم انها تبقى بتجمعنا مش تبقى خبطات صحفيه او حاجات من القبيل ده<br />السلام عليكم و رحمة الله و بركاته<br />ابراهيم<br />الاسكندريه<br />مصر ام الدنيا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

