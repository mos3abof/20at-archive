order = 35
subject = "من هو محمد عبدالوهاب؟؟"
author = "حاتم"
text = "الإمام محمد بن عبد الوهاب دعوته وسيرته<br />القسم : إملاءات > مقالات<br />كتاب العلم<br />كتاب العلم<br />الحمد لله رب العالمين، وصلى الله وسلم وبارك على عبده ورسوله وخيرته من خلقه سيدنا وإمامنا محمد بن عبد الله، وعلى آله وأصحابه ومن والاه.<br />أما بعد: أيها الإخوان الفضلاء، أيها الأبناء الأعزاء، هذه المحاضرة الموجزة أتقدم بها بين أيديكم تنويرا للأفكار، وإيضاحا للحقائق، ونصحا لله ولعباده، وأداء لبعض ما يجب علي من الحق نحو المحاضر عنه، وهذه المحاضرة عنوانها: الشيخ الإمام محمد بن عبد الوهاب ، دعوته وسيرته.<br />لما كان الحديث عن المصلحين والدعاة والمجددين، والتذكير بأحوالهم وخصالهم الحميدة، وأعمالهم المجيدة، وشرح سيرتهم التي دلت على إخلاصهم، وعلى صدقهم في دعوتهم وإصلاحهم، لما كان الحديث عن هؤلاء المصلحين المشار إليهم، وعن أخلاقهم وأعمالهم وسيرتهم، مما تشتاق إليه النفوس، وترتاح له القلوب، ويود سماعه كل غيور على الدين، وكل راغب في الإصلاح، والدعوة إلى سبيل الحق، رأيت أن أتحدث إليكم عن رجل عظيم ومصلح كبير، وداعية غيور، ألا وهو الشيخ المجدد للإسلام في الجزيرة العربية في القرن الثاني عشر من الهجرة النبوية هو الإمام محمد بن عبد الوهاب بن سليمان بن علي التميمي الحنبلي.<br />لقد عرف الناس هذا الإمام ولا سيما علماؤهم ورؤساؤهم، وكبراؤهم وأعيانهم في الجزيرة العربية وفي خارجها، ولقد كتب الناس عنه كتابات كثيرة ما بين موجز وما بين مطول، ولقد أفرده كثير من الناس بكتابات، حتى المستشرقون كتبوا عنه كتابات كثيرة، وكتب عنه آخرون في أثناء كتاباتهم عن المصلحين، وفي أثناء كتاباتهم في التاريخ، وصفه المنصفون منهم بأنه مصلح عظيم، وبأنه مجدد للإسلام، وبأنه على هدى ونور من ربه، وإن تعدادهم يشق كثيراً.<br />ومن جملتهم المؤلف الكبير أبو بكر الشيخ حسين بن غنام الإحسائي . فقد كتب عن هذا الشيخ فأجاد وأفاد، وذكر سيرته وذكر غزواته، وأطنب في ذلك وكتب كثيرا من رسائله، واستنباطاته من كتاب الله عز وجل، ومنهم أيضا الشيخ عثمان بن بشر في كتابه عنوان المجد، فقد كتب عن هذا الشيخ أيضا، وعن دعوته، وعن سيرته، وعن تأريخ حياته، وعن غزواته وجهاده، ومنهم خارج الجزيرة الدكتور أحمد أمين في كتابه زعماء الإصلاح، فقد كتب عنه وأنصف، ومنهم الشيخ الكبير مسعود الندوي ، فقد كتب عنه وسماه: المصلح المظلوم، وكتب عن سيرته وأجاد في ذلك، وكتب عنه أيضا آخرون، منهم الشيخ الكبير الأمير محمد بن إسماعيل الصنعاني ، فقد كان في زمانه وقد كان على دعوته. فلما بلغه دعوة الشيخ سر بها وحمد الله عليها.<br />وكذلك كتب عنه العلامة الكبير الشيخ محمد بن علي الشوكاني ، صاحب نيل الأوطار ورثاه بمرثية عظيمة، وكتب عنه جمع غير هؤلاء يعرفهم القراء والعلماء وبمناسبة كون كثير من الناس قد يخفى عليه حال هذا الرجل وسيرته ودعوته رأيت أن أساهم في بيان حال هذا الرجل، وما كان عليه من سيرة حسنة، ودعوة صالحة، وجهاد صادق، وأن أشرح قليلا مما أعرفه عن هذا الإمام حتى يتبصر في أمره من كان عنده شيء من لبس، أو شيء من شك في حال هذا الرجل، ودعوته، وما كان عليه، ولد هذا الإمام في عام (1115) هجرية، هذا هو المشهور في مولده رحمة الله عليه، وقيل في عام (1111) هجرية، والمعروف الأول: أنه ولد في عام 1115 هجرية على صاحبها أفضل الصلاة وأكمل التحية.<br />وتعلم على أبيه في بلدة العيينة، وهذه البلدة هي مسقط رأسه رحمة الله عليه وهي قرية معلومة في اليمامة في نجد، شمال غرب مدينة الرياض، بينها وبين الرياض مسيرة سبعين كيلو متر، ولد فيها رحمة الله عليه، ونشأ نشأة صالحة، وقرأ القرآن مبكرا واجتهد في الدراسة والتفقه على أبيه الشيخ عبد الوهاب بن سليمان وكان فقيها كبيرا، وكان عالما قديرا، وكان قاضيا في بلدة العيينة. ثم بعد بلوغ الحلم حج وقصد بيت الله الحرام، وأخذ عن بعض علماء الحرم الشريف. ثم توجه إلى المدينة على ساكنها أفضل الصلاة والسلام، فاجتمع بعلمائها، وأقام فيها مدة، وأخذ عن عالمين كبيرين مشهورين في المدينة ذلك الوقت. وهما الشيخ عبد الله بن إبراهيم بن سيف النجدي ، أصله من المجمعة، وهو والد الشيخ إبراهيم بن عبد الله صاحب العذب الفائض في علم الفرائض، وأخذ أيضا عن الشيخ الكبير محمد حياة السندي بالمدينة. هذان العالمان ممن اشتهر أخذ الشيخ عنهما بالمدينة، ولعله أخذ عن غيرهما ممن لا نعرف.<br />ورحل الشيخ لطلب العلم إلى العراق، فقصد البصرة واجتمع بعلمائها، وأخذ عنهم ما شاء الله من العلم، وأظهر الدعوة هناك إلى توحيد الله، ودعا الناس إلى السنة، وأظهر للناس أن الواجب على جميع المسلمين أن يأخذوا دينهم عن كتاب الله، وسنة رسول الله عليه الصلاة والسلام، وناقش وذاكر في ذلك، وناظر من هنالك من العلماء واشتهر من مشايخه هناك شخص يقال له الشيخ محمد المجموعي ، وقد ثار عليه بعض علماء السوء بالبصرة، وحصل عليه وعلى شيخه المذكور بعض الأذى، فخرج من أجل ذلك، وكان من نيته أن يقصد الشام، فلم يقدر على ذلك لعدم وجود النفقة الكافية، فخرج من البصرة إلى الزبير، وتوجه من الزبير إلى الأحساء واجتمع بعلمائها وذاكرهم في أشياء من أصول الدين، ثم توجه إلى بلدة حريملاء وذلك (والله أعلم) في العقد الخامس من القرن الثاني عشر، لأن أباه كان قاضيا في العيينة، وصار بينه وبين أميرها نزاع، فانتقل عنها إلى حريملاء سنة 1139 هجرية، فقدم الشيخ محمد على أبيه في حريملاء بعد انتقاله إليها سنة 1139 هجرية، فيكون قدومه حريملاء في عام 1140 هجرية أو ما بعدها، واستقر هناك، ولم يزل مشتغلاً بالعلم والتعليم، والدعوة في حريملاء حتى مات والده عام 1153 هجرية، فحصل من بعض أهل حريملاء شر عليه، وهم بعض السفلة بها أن يفتك به، وقيل إن بعضهم تسور عليه الجدار، فعلم بهم بعض الناس فهربوا، وبعد ذلك ارتحل الشيخ إلى العيينة رحمة الله عليه.<br />وأسباب غضب هؤلاء السفلة عليه أنه كان آمرا بالمعروف ناهيا عن المنكر، وكان يحث الأمراء على تعزير المجرمين، الذين يعتدون على الناس بالسلب والنهب والإيذاء، هؤلاء السفلة الذين يقال لهم العبيد هناك، ولما عرفوا من الشيخ أنه ضدهم، وأنه لا يرضى بأفعالهم، وأنه يحرض الأمراء على عقوباتهم، والحد من شرهم، غضبوا عليه وهموا أن يفتكوا به، فصانه الله وحماه، ثم انتقل إلى بلدة العيينة وأميرها إذ ذاك عثمان بن ناصر بن معمر ، فنزل عليه ورحب به الأمير، وقال قم بالدعوة إلى الله، ونحن معك وناصروك، وأظهر له الخير، والمحبة والموافقة على ما هو عليه.<br />فاشتغل الشيخ بالتعليم والإرشاد والدعوة إلى الله عز وجل، وتوجيه الناس إلى الخير، والمحبة في الله رجالهم ونسائهم، واشتهر أمره في العيينة، وعظم صيته، وجاء إليه الناس من القرى المجاورة، وفي يوم من الأيام قال الشيخ للأمير عثمان : دعنا نهدم قبة زيد بن الخطاب رضي الله عنه فإنها أسست على غير هدى، وأن الله جل وعلا لا يرضى بهذا العمل، والرسول عليه الصلاة والسلام نهى عن البناء على القبور، واتخاذ المساجد عليها، وهذه القبة فتنت الناس وغيرت العقائد، وحصل بها الشرك فيجب هدمها، فقال الأمير: لا مانع من ذلك، فقال الشيخ: إني أخشى أن يثور أهل الجبيلة، والجبيلة قرية هنالك قريبة من القبر، فخرج عثمان ومعه جيش يبلغون 600 مقاتل لهدم القبة. ومعهم الشيخ رحمة الله عليه، فلما قربوا من القبة خرج أهل الجبيلة لما سمعوا بذلك لينصروها ويحموها. فلما رأوا الأمير عثمان ومن معه كفوا ورجعوا عن ذلك. فباشر الشيخ هدمها وإزالتها، فأزالها الله عز وجل على يديه رحمة الله عليه. ولنذكر نبذة عن حال نجد قبل قيام الشيخ رحمة الله عليه، وعن أسباب قيامه، ودعوته.<br />كان أهل نجد قبل دعوة الشيخ على حالة لا يرضاها مؤمن، كان الشرك الأكبر قد نشأ وانتشر، حتى عبدت القباب وعبدت الأشجار، والأحجار، وعبدت الغيران، وعبد من يدعي بالولاية. وهو من المعتوهين، وعبد من دون الله أناس يدعون بالولاية، وهم مجانين مجاذيب لا عقول عندهم، واشتهر في نجد السحرة والكهنة، وسؤالهم وتصديقهم وليس هناك منكر إلا من شاء الله، وغلب على الناس الإقبال على الدنيا وشهواتها، وقل القائم لله والناصر لدين الله، وهكذا في الحرمين الشريفين، وفي اليمن اشتهر في ذلك الشرك، وبناء القباب على القبور، ودعاء الأولياء والاستغاثة بهم، وفي اليمن من ذلك الشيء الكثير، وفي بلدان نجد من ذلك ما لا يحصى، ما بين قبر وما بين غار، وبين شجرة وبين مجذوب ومجنون يدعى من دون الله ويستغاث به مع الله، وكذلك مما عرف في نجد واشتهر دعاء الجن والاستغاثة بهم، وذبح الذبائح لهم، وجعلها في الزوايا من البيوت رجاء نجدتهم، وخوف شرهم، فلما رأى الشيخ الإمام هذا الشرك وظهوره في الناس، وعدم وجود منكر لذلك، وقائم بالدعوة إلى الله في ذلك، شمر عن ساعد الجد، وصبر على الدعوة، وعرف أنه لا بد من جهاد، وصبر وتحمل للأذى، فجد في التعليم والتوجيه والإرشاد وهو في العيينة، وفي مكاتبة العلماء في ذلك، والمذاكرة معهم رجاء أن يقوموا معه في نصر دين الله، والمجاهدة في هذا الشرك وهذه الخرافات، فأجاب دعوته كثيرون من علماء نجد وعلماء الحرمين، وعلماء اليمن، وغيرهم وكتبوا إليه بالموافقة، وخالف آخرون وعابوا ما دعا إليه وذموه، ونفروا عنه وهم بين أمرين، ما بين جاهل خرافي لا يعرف دين الله ولا يعرف توحيد الله، وإنما يعرف ما هو عليه آباؤه وأجداده من الجهل والضلال والشرك، والبدع، والخرافات، كما قال الله عز وجل عن أمثال أولئك: {إِنَّا وَجَدْنَا آبَاءَنَا عَلَى أُمَّةٍ وَإِنَّا عَلَى آثَارِهِمْ مُهْتَدُونَ}[1] وطائفة أخرى ممن ينسبون إلى العلم ردوا عليه عنادا وحسدا، لئلا يقول العامة: ما بالكم لم تنكروا علينا هذا الشيء؟ لماذا جاء ابن عبد الوهاب وصار على الحق، وأنتم علماء ولم تنكروا هذا الباطل؟!. فحسدوه وخجلوا من العامة، وأظهروا العناد للحق، إيثارا للعاجل على الآجل، واقتداء باليهود في إيثارهم الدنيا على الآخرة، نسأل الله العافية والسلامة.<br />أما الشيخ فقد صبر وجد في الدعوة، وشجعه من شجعه من العلماء والأعيان في داخل الجزيرة، وفي خارجها، فعزم على ذلك واستعان بربه عز وجل، وعكف قبل ذلك على كتاب الله، وكانت له اليد الطولى في تفسير كتاب الله، والاستنباط منه، وعكف على سيرة الرسول صلى الله عليه وسلم وسيرة أصحابه، وجد في ذلك وتبصر فيه، حتى أدرك من ذلك ما أعانه وثبته على الحق، فشمر عن ساعد الجد، وصمم على الدعوة وعلى أن ينشرها بين الناس، ويكاتب الأمراء والعلماء في ذلك، وليكن في ذلك ما يكون.<br />فحقق الله له الآمال الطيبة، ونشر به الدعوة، وأيد به الحق، وهيأ الله له أنصارا ومساعدين وأعوانا، حتى ظهر دين الله، وعلت كلمة الله فاستمر الشيخ في الدعوة في العيينة بالتعليم والإرشاد، ثم شمر عن ساعد الجد إلى العمل وإزالة آثار الشرك بالفعل، لما رأى الدعوة لم تؤثر، باشر الدعوة عمليا ليزيل بيده ما تيسر، وما أمكن من آثار الشرك، قال الشيخ للأمير عثمان بن معمر : لا بد من هدم هذه القبة التي على قبر زيد. وزيد بن الخطاب رضي الله عنه هو أخو عمر بن الخطاب أمير المؤمنين رضي الله تعالى عن الجميع. وكان من جملة الشهداء في قتال مسيلمة الكذاب في عام 12 من الهجرة النبوية، فكان ممن قتل هناك، وبني على قبره قبة فيما يذكرون، وقد يكون قبر غيره، لكنه فيما يذكرون أنه قبره، فوافقه عثمان كما تقدم، وهدمت القبة بحمد الله، وزال أثرها إلى اليوم ولله الحمد والمنة، أماتها جل وعلا لما هدمت عن نية صالحة، وقصد مستقيم ونصر للحق، وهناك قبور أخرى منها قبر يقال إنه قبر ضرار بن الأزور ، كانت عليه قبة هدمت أيضا، وهناك مشاهد أخرى أزالها الله عز وجل، وكانت هناك غيران وأشجار تعبد من دون الله جل وعلا، فأزيلت وقضي عليها وحذر الناس عنها.<br />والمقصود أن الشيخ استمر رحمة الله عليه على الدعوة، قولاً وعملاً كما تقدم، ثم إن الشيخ أتته امرأة، واعترفت عنده بالزنا عدة مرات، وسأل عن عقلها فقيل إنها عاقلة ولا بأس بها، فلما صممت على الاعتراف، ولم ترجع عن اعترافها، ولم تدع إكراها ولا شبهة وكانت محصنة، أمر الشيخ رحمة الله عليه بأن ترجم فرجمت بأمره، حالة كونه قاضيا بالعيينة، فاشتهر أمره بعد ذلك بهدم القبة، وبرجم المرأة، وبالدعوة العظيمة إلى الله، وهجرة المهاجر<br />22/10/2006<br />اقرأ بقية التعليق .."
