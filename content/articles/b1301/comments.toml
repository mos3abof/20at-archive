[[comments]]
order = 22
subject = "أنا سعودي وبأحب المصارية يامازن"
author = "ارفع راسك أنت سعودي"
posted = "2006-10-04"
text = "أخي مازن<br />والله عندما قرأت ما كتبته في التعليقات تألمت كثيراً مما قلت.<br />اذا كنت ترى نفسك قريب من الله وتطبق دينه فلماذا هذه الكلمات السفيهة التي نطقت فيها وكمان في رمضان.<br />تب إلى الله مما قلت فهذه ليست من شيم الرجال.<br />أنا اعرف كثيراً من الاخوة المصريين ماشاء الله عليه.. أخلاق وأدب.<br />لا تعمم شيئا رأيته على الكل.. اتقي ربك.<br />وبعدين بالنسبة للذين قالوا مفيش زي كذا في السعودية.. والله ياناس في..<br />مش السعوديين بشر زيكم.. هم بيغلطوا عادي لكن (لا يجرمنكم شنأن قوم على ألا تعدلوا.. اعدلوا هو أقرب للتقوى).<br />أخيراً إلى الاخوة المصريين.. اعتذر إليكم نيابة عن مازن عما قاله.. ولكم منا كل حب وتقدير عشتم فخراً للإسلام والمسلمين..<br />(إن أكرمكم عند الله أتقاكم)."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

[[comments]]
order = 23
subject = "كفاكم"
author = "ريم من السعودية 0000000"
posted = "2006-10-04"
text = "احنا برمضان وقبل كذ ا مسلمين اخوة كالجسد الواحد ---------- انا اسفة ان سببت بعض الاشكال لكن لم استطع ان اقرا تفاهات واسكت الغلط بكل مكان وليس هناك امة معصومة من الخطا وعلينا ان نرد ونوضح بالعقل يا اخ مازن ليس بالتفلت وكلام وسخ يهز الجسد ويقشعر من قرائتها وعلى الموقع ان راى كلام مثل كلام مازن اوتجريح لاحد اوظلم ان يحذ فة ولا يستنون الردود واشعال الحرب والفتنة بالكلام الفاسد -------------------------- واكرر تذكرو نحن برمضان فادعو لانفسكم واهليكم وللمسلمين اجمعين ولاتنسوا ان للصائم دعوة لاترد ============================================================= ورجاااااااااااااااااااااااء خااااااااااااااااص لعشرينات ان ماتنشر تفاهات وكلام ماله اي داعي واقترح انكم ماتضعون قسم دين وقسم علاقات وقسم000000 الخ بل اقترح وضع موضوع محدد له قيمته الثقافية واللغوية يهم الامة باكملها ونقاش ماعلى الساحة الان من خطط اليهود والاستشراق والتغريب فهي الاهم ارجو ان تكون الرسالة وصلت ودمتم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

[[comments]]
order = 24
subject = "من مازن"
author = "مازن"
posted = "2006-10-05"
text = "حبايبي السعوديين والمصاريه<br />انا ماغلطت الا لانكم انتوا اللي بدأتوا الغلط يعني واحد يسب فينا في موضوع والثاني يضمر للسعوديين الكره واخر يقول ان السعوديين شعب متخلف ووووو<br />كل هذا من الحقد اللي في قلوب بعض الناس<br />انا والله احب مصر واهل مصر ولكن بعضهم يسيؤا لسمعة مصر واهل مصر ويخلوا الواحد فينا يضطر لهذي الاشياء<br />المفروض احنا كلنا مسلمين ونكون يد وحده مع بعض واذا ماجمعنا الدين يجمعنا اننا كلنا عرب ومن اصل واحد<br />شوفو المصاريه اليهود مهما يكون .. مؤيدين اسرائيل في الحرب وووو<br />حسبي الله ونعم الوكيل<br />عموماً المعذرة للاخوان المحترمين اللي ردوا على غلطي بكل احترام وتفهم وارجوا ان نكون كاليد الواحده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

