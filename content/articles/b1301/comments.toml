text = "اللهم لا حولا ولا قوة الا بالله العلى العظيم ايه اللى بيحصلنا ياجماعة ده انا ملاحظ الظاهرة دى مش بس فى السعودية دى فى بلاد كثيرة جدا الناس اللى بتفطر دى متعرفش انها لا يمكن ان تعوض فطورها فى رمضان حتى ولو صامت الدهر كله<br />والمصيبة ان الكلام ده بيحصل علنا قدام الناس (وأذا بليتم فأستتروا .... )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

[[comments]]
order = 10
subject = "السعوديه لازم مايكون فيها هذا"
author = "فهد العنزي"
posted = "2006-10-02"
text = "اختي ريم انا سعودي بس اتكلم الحق<br />المفروض ان السعوديه بالذات مانشوف المناظر هذه فيها<br />لان العالم من كل دول العالم تجي لعندنا علشان تعتمر وتشوف الاسلام الصحيح<br />ويتفاجؤ ان في عالم تفطلر في رمضان<br />ونحن نعرف ان الافطار في رمضان كفر<br />معناة ان فيه عالم كافره بالسعوديه<br />وانا رايت العالم لذلك لا تدافعي عن الاشياء هذه لانك راح تسئلي عنها وشكرا<br />اختي العزيزه ريييييييييييييييييم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

[[comments]]
order = 11
subject = "==========="
author = "ريم بنت السعودية"
posted = "2006-10-03"
text = "الفساد في كل مكان انا لا قول ان السعودية مطهره لا ---- انما مااقصده يجب ان يرتقي موقع عشرينات ويجيب مواضيع هادفة تجمع الامة لاتفرقها مواضيع تناسب ثقافتنا ونرتقي بها ليس تتبع التفاهات من كل دوله فهم لهم رب يحاسبهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

[[comments]]
order = 12
subject = "ما هذه التفاهة والكذب والتلفيق يا عشرينات"
author = "باحث عن الحقيقة"
posted = "2006-10-03"
text = "موضوع تافه وعنوان سخيف ملفق ومجموعة من الإتروهات والأكاذيب بين جنبات الموضوع:<br />- بداية من سمح لكم أن تصدروا حكما بالتعميم بأن شباب السعودية يجاهر بالإفطار، وكل من سألتو هم في الموضوع هم 3 أشخاص، أحدهم يبدو أن كان يتحدث عن ماضيه، وآخر يفطر في السر أي لا يجاهر ، وثالثة تروي ما رأته .... ما هذه السخافات وما الهدف من مثل هذا الموضوع.<br />- ثانيا الأجانب غير المسلمين لا يتطيعون المجاهرة بالإفطار في نهار رمضان، وانا أعمل مع عدد كبير منهم ومتأكد من ذلك، وكذلك هناك قرار من وزير الداخلية يمنعهم من المجاهرة بالإفطار فمابالك بالسعوديين.<br />- أنا أقيم في السعودية منذ عدة سنوات وزرت عدة مدن ولم أرى مثل هذه المجاهرة ولو مرة واحدة.<br />- حتى لو كان هناك من ياجهر وإن كنت أشكل في ذلك فعددهم لا يتجازو أصابع اليد الواحدة ربما في المملكة بأسرها فكيف تعتبروها ظاهرة<br />-في النهاية لا أملك إلا أن أنضم صوتي للأخت ريم لأعرب عن أسفي واتيائي من هذه الانحطاط والسفه التي تقوم به عشرينات، إنهم فقط لا تلفقون وتكذبون ... للأسف أنت تفترون على شباب شعب بأكمله<br />ahmed-editor@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

[[comments]]
order = 13
subject = "وا مصيبتااااه"
author = "بنت حميدو"
posted = "2006-10-03"
text = "اختى الفاضلة بنت السعودية, ريم:<br />لم اكن اتوقع منك , و انت المتعلمة المثقفة المتدينة ان تتفاعلي بهذه السرعة, كما لم اكن اتوقع ايضا انك ممكن ان تكتبي كلمة \"الله اكبر\" في بداية حديثك كما كتبتيها \"الله و اكبر\", فان صدرت مثل هذه الغلطة من مواطنة سعودية ملتزمة و متدينة و كررتيها مرتين, فماذا نتوقع من شباب السعودية الغير منضبط."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

[[comments]]
order = 14
subject = "أخاوكم الباشا"
author = "أخاوكم الباشا"
posted = "2006-10-03"
text = "الكلام ده كلام فارغ وأنا واحد مصري وعايش في السعودية وما شوفتش حد بيفطر خالص وبعدين أزاي يفطرو على الشاطيئ في نهار رمضان... ليه ما فيش هيئة دي كانت سيارة الهيئة يعلقوهم .<br />كلام فارغ وإدعاء من غير دليل ولو في فعلا حد بيفطر بس مش مجاهرة ولا هنا ولا في مصر ده حتى غير المسلمين بيختشو .<br />موقع عشرينات ده موقع زباله وأنا قلتها قبل كده ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

