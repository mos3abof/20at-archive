[[comments]]
order = 7
subject = "قول باطل يراد به باطل"
author = "BATISTUTA"
posted = "2006-10-02"
text = "فى جريدة صوت الامة العدد الماضى بتاريخ 2/10/2006 قرأت لقاء لاسامة انور عكاشة ومن ضمن الاسئلة بالطبع سئل عن اعمال المحجبات سأنقل لكم السؤال والاجابة بالنص .<br />مارأيك فى اعتراض المحجبات على عدم عرض مسلسل واحد من مسلسلاتهن ؟<br />عليهن ان يصمتن احسن دول قاعدين يقولوا 90% من بنات وسيدات مصر محجبات ويتجاهلن ان هذا يرجع لحالات التهديد والارهاب التى يمارس على الفتيات والسيدات غير المحجبات فالسيدة تتحجب ليس عن اقتناع بينما بسبب الخوف من نعتها بتهم مخلة بالشرف والسيدات الفاضلات اللاتى عدن للتمثيل ولم يذع التلفزيون لهن مسلسلاتهن ،أعمالهن على الفضائيات المختلفة وقد شاهدتها وهى اعمال تافهه ليس فيها شئ عليه الطلب ورجوعهن للتمثيل يرجع لسبب من اثنين الاول هو المال والثانى هو توظيف المسألة وهابيا ..اى ان عودتهن خطوة لوهبنه الفن فى مصر لكى تتحجب كل الممثلات وهذه آفه اصابت المجتمع المصرى .<br />وكيف نداوى هذه الافة من وجهه نظرك ؟<br />لن نتغلب على ذلك الا بالحرص على تنوير الناس ورفض النعرات الكاذبة وكشف الحجاب عن العقل وهو اسوأ انواع الحجاب .<br />هل ترى ان هناك تناقضا بين حديث المحجبات فى الاعلام وبين مضمون اعمالهن ؟<br />نعم وهذا واضح بشدة من خلال الازدواجية التى نراها فى دور بثينة رشوان فى مسلسل سهير رمزى الى لم يهمها سوى ان تستغل افيه عودتها كمحجبة وعندها كمان الجرأة ان تحتج وان تقول ان التليفزيون منعها عمدا لكننى اعتقد ان اسباب المنع لو كان هناك منع فنى لان المسلسلات ضعيفة جدا.<br />لكن هناك ترى ان عدم عرض مسلسل واحد للمحجبات يمثل اتجاها للدولة ؟<br />لو كان هذا اتجاه الدولة فانا معه واؤيده مائة فى المائة لاننى ارى ان عودة المحجبات مقدمة لرأس جسر الفكر الوهابى وانا لا امانع ان تتحجب المرأة عن اقتناع اما ان تستغل الحجاب فى تطبيق فكر معين فانا ارفض ذلك شكلا وموضوعا.<br />كيف تجزم بان المحجبات يمثلن الفكر الوهابى ؟وما هى اسبابك فى ذلك ؟<br />اولا الفكر الوهابى هو احد الفصائل شديدة التعصب على يمين يمين السنة وهو فكر متصلب ساهم فى شق صفوف المسلمين واستغل عند هجمة التتار اما ما يجعلنى اقول ذلك هو علاقة المنتجين بالتمويل السعودى والرحلات المكوكية الى الرياض اضافة الى رحلات العمرة والحج التى كثرت جدا بين الفنانات .<br />هذا جزء من حوار اسامة انور عكاشة مؤلف مسلسلات كارابيسك وزيزينيا وليالى الحلمية انا لا انكر اعجابى بهذه المسلسلات وآسف لكونه هو مؤلفهم ولكنى ارفض ماقاله عن الحجاب كما قال شكلا وموضوعا لان قضية الحجاب ليست رأى نتناقله ونتباحث فيه ونتفلسف حوله فالحجاب امر ربانى فرضه الله على نساء المسلمين كما ورد فى سورة النور \"وقل للمؤمنات يغضضن من أبصارهن ويحفظن فروجهن ولا يبدين زينتهن إلا ما ظهر منها وليضربن بخمرهن على جيوبهن ولا يبدين زينتهن إلا لبعولتهن أو أبائهن أو أباء بعولتهن أو أبنائهن أو أبناء بعولتهن أو إخوانهن أو بنى إخوانهن أو بنى أخواتهن أو نسائهن أو ما ملكت أيمانهن أو التابعين غير أولى الإربة من الرجال أو الطفل الذين لم يظهروا على عورات النساءولا يضربن بأرجلهن ليعلم ما يخفين من زينتهن وتوبوا إلى الله جميعا أيه المؤمنون لعلكم تفلحون \""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

[[comments]]
order = 8
subject = "الاخت ريم.... غفر الله لنا و لها"
author = "الزيني بركات"
posted = "2006-10-02"
text = "الاخت ريم ؛<br />كنت قد بدأت فى تعليق سابق بتقديم السلام والتحية لك على غيرتك على بلدك<br />اما الأن فأبدي استيائي الشديد مما كتبتيه و مما تلمحين اليه ومن هذا التدنى فى مستوى الحوار و لن اذكر لك ما اراه هنا فى صيف القاهرة من الأخوة السعوديين لسببين :-<br />1 - اننا لا اريد ان اشعل نار الفتنة<br />2- لأنى أؤمن ايمانا شديدا ان من اراهم لا يمثلون اخواننا فى المملكة و ان اخواننا فى المملكة ممن هم افضل أكثر من هؤلاء بكثير<br />و ادعو اخواننا المصرين فى رودودهم بالتعقل فإن كانت نسيت انها شقيقة لنا فنحن لن ننسى اننا اشقاء لها<br />نقطة اخيرة و برغم انتقادى للموقع و انه يحمل الكثير من السلبيات و كونهم يظهرون الاعتناء بزوارهم ثم يبطونن خلاف ذلك من عدم رد على الرسالات و استهانة باراء الزوار<br />الا انه و برغم ذلك لا اعتقد انهم لا يستحقون التحاشي فى رمضان<br />الاخت ريم غفر الله لنا و لك و لا تنسيني من صالح دعائك<br />السلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

[[comments]]
