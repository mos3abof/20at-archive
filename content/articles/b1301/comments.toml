author = "حاتم"
text = "وبالدعوة العظيمة إلى الله، وهجرة المهاجرين إلى العيينة.<br />وبلغ أمير الأحساء وتوابعها من بني خالد سليمان ابن عريعر الخالدي أمر الشيخ، وأنه يدعو إلى الله، وأنه يهدم القباب، وأنه يقيم الحدود، فعظم على هذا البدوي أمر الشيخ، لأن من عادة البادية- إلا من هدى الله- الإقدام على الظلم، وسفك الدماء، ونهب الأموال، وانتهاك الحرمات، فخاف أن هذا الشيخ يعظم أمره، ويزيل سلطان الأمير البدوي، فكتب إلى عثمان يتوعده، ويأمره أن يقتل هذا المطوع الذي عنده في العيينة، وقال: إن المطوع الذي عندكم بلغنا عنه كذا، وكذا!! فإما أن تقتله، وإما أن نقطع عنك خراجك الذي عندنا.!! وكان عنده للأمير عثمان خراج من الذهب، فعظم على عثمان أمر هذا الأمير، وخاف إن عصاه أن يقطع عنه خراجه أو يحاربه، فقال للشيخ: إن هذا الأمير كتب إلينا كذا وكذا، وإنه لا يحسن منا أن نقتلك، وإنا نخاف هذا الأمير ولا نستطيع محاربته، فإذا رأيت أن تخرج عنا فعلت، فقال الشيخ: إن الذي أدعو إليه هو دين الله، وتحقيق كلمة لا إله إلا الله وتحقيق شهادة أن محمداً رسول الله، فمن تمسك بهذا الدين، ونصره وصدق في ذلك نصره الله وأيده وولاه على بلاد أعدائه، فإن صبرت واستقمت، وقبلت هذا الخير فأبشر، فسينصرك الله ويحميك من هذا البدوي وغيره، وسوف يوليك الله بلاده وعشيرته. فقال: أيها الشيخ إنا لا نستطيع محاربته، ولا صبر لنا على مخالفته. فخرج الشيخ عند ذلك وتحول من العيينة إلى بلاد الدرعية، جاء إليها ماشياً فيما ذكروا، حتى وصل إليها في آخر النهار، وقد خرج من العيينة في أول النهار مشيا على الأقدام، لم يرحله عثمان ، فدخل على شخص من خيارها في أعلا البلد يقال له محمد بن سويلم العريني ، فنزل عليه ويقال إن هذا الرجل خاف من نزوله عليه، وضاقت به الأرض بما رحبت، وخاف من أمير الدرعية محمد بن سعود فطمأنه الشيخ وقال له: أبشر بخير وهذا الذي أدعو الناس إليه دين الله، وسوف يظهره الله. فبلغ محمد بن سعود خبر الشيخ محمد، ويقال إن الذي أخبره زوجته، جاء إليها بعض الصالحين، وقال لها: أخبري محمدا بهذا الرجل، وشجعيه على قبول دعوته، وحرضيه على مؤازرته ومساعدته، وكانت امرأة صالحة طيبة، فلما دخل عليها محمد ابن سعود أمير الدرعية وملحقاتها، قالت له: أبشر بهذه الغنيمة العظيمة! هذه غنيمة ساقها الله إليك، رجل داعية يدعو إلى دين الله، يدعو إلى كتاب الله، يدعو إلى سنة رسول الله عليه الصلاة والسلام يا لها من غنيمة! بادر بقبوله وبادر بنصرته، ولا تقف في ذلك أبدا، فقبل الأمير مشورتها، ثم تردد هل يذهب إليه أم يدعوه إليه؟! فأشير عليه، ويقال إن المرأة أيضا هي التي أشارت عليه مع جماعة من الصالحين، وقالوا له: لا ينبغي أن تدعوه إليك، بل ينبغي أن تقصده في منزله وأن تقصده أنت، وأن تعظم العلم والداعي إلى الخير، فأجاب إلى ذلك لما كتب الله له من السعادة والخير رحمة الله عليه، وأكرم مثواه، فذهب إلى الشيخ في بيت محمد بن سويلم وقصده وسلم عليه وتحدث معه، وقال له يا شيخ محمد : أبشر بالنصرة وأبشر بالأمن وأبشر بالمساعدة فقال له الشيخ وأنت أبشر بالنصرة أيضا والتمكين والعاقبة الحميدة، هذا دين الله من نصره نصره الله، ومن أيده أيده الله، وسوف تجد آثار ذلك سريعا، فقال: يا شيخ سأبايعك على دين الله ورسوله، وعلى الجهاد في سبيل الله، ولكنني أخشى إذا أيدناك ونصرناك وأظهرك الله على أعداء الإسلام أن تبتغي غير أرضنا، وأن تنتقل عنا إلى أرض أخرى، فقال: لا؛ أبايعك على هذا، أبايعك على أن الدم بالدم، والهدم بالهدم، لا أخرج عن بلادك أبداً، فبايعه على النصرة، وعلى البقاء في البلد، وأنه يبقى عند الأمير يساعده، ويجاهد معه في سبيل الله، حتى يظهر دين الله، وتمت البيعة على ذلك. وتوافد الناس إلى الدرعية من كل مكان، من العيينة، وعرقة، ومنفوحة والرياض وغير ذلك من البلدان المجاورة، ولم تزل الدرعية موضع هجرة يهاجر إليها الناس من كل مكان، وتسامع الناس بأخبار الشيخ، ودروسه في الدرعية ودعوته إلى الله وإرشاده إليه، فأتوا زرافات ووحدانا، فأقام الشيخ بالدرعية معظما مؤيدا محبوبا منصورا، ورتب الدروس في الدرعية في العقائد، وفي القرآن الكريم، وفي التفسير، وفي الفقه، والحديث، ومصطلحه، والعلوم العربية، والتأريخية، وغير ذلك من العلوم النافعة.<br />وتوافد الناس عليه من كل مكان، وتعلم عليه في الدرعية الشباب وغيرهم، ورتب للناس دروسا كثيرة للعامة والخاصة، ونشر العلم في الدرعية، واستمر على الدعوة، ثم بدأ بالجهاد وكاتب الناس إلى الدخول في هذا الميدان، وإزالة الشرك الذي في بلادهم، وبدأ بأهل نجد، وكاتب أمراءها وعلماءها، كاتب علماء الرياض، وأميرها دهام بن دواس، وكاتب علماء الخرج وأمراءها، وعلماء بلاد الجنوب والقصيم، وحائل، والوشم، وسدير، وغير ذلك. ولم يزل يكاتبهم ويكاتب علماءهم وأمراءهم، وهكذا علماء الأحساء وعلماء الحرمين الشريفين، وهكذا علماء الخارج في مصر، والشام والعراق، والهند، واليمن، وغير ذلك، ولم يزل يكاتب الناس ويقيم الحجج، ويذكر الناس ما وقع فيه أكثر الخلق من الشرك والبدع، وليس معنى هذا أنه ليس هناك أنصار للدين، بل هناك أنصار، والله جل وعلا ضمن لهذا الدين أن لا بد له من ناصر، ولا تزال طائفة في هذه الأمة على الحق منصورة، كما قال النبي عليه الصلاة والسلام، فهناك أنصار للحق في أقطار كثيرة، ولكن الحديث الآن عن نجد، فكان فيها من الشر والفساد والشرك والخرافات ما لا يحصيه إلا الله عز وجل، مع أن فيها علماء فيهم خير، ولكن لم يقدر لهم أن ينشطوا في الدعوة وأن يقوموا بها كما ينبغي.<br />وهناك أيضا في اليمن وغير اليمن دعاة إلى الحق، وأنصار قد عرفوا هذا الشرك وهذه الخرافات، ولكن لم يقدر الله لدعوتهم من النجاح ما قدر لدعوة الشيخ محمد لأسباب كثيرة، منها: عدم تيسر الناصر المساعد لهم، ومنها: عدم الصبر لكثير من الدعاة، وتحمل الأذى في سبيل الله.<br />ومنها: قلة علوم بعض الدعاة التي يستطيع بها أن يوجه الناس بالأساليب المناسبة، والعبارات اللائقة، والحكمة والموعظة الحسنة. ومنها: أسباب أخرى غير هذه الأسباب، وبسبب هذا المكاتبات الكثيرة والرسائل والجهاد، اشتهر أمر الشيخ، وظهر أمر الدعوة، واتصلت رسائله بالعلماء في داخل الجزيرة وفي خارجها، وتأثر بدعوته جم غفير من الناس، في الهند وفي أندونيسيا وفي أفغانستان وفي أفريقيا وفي المغرب وهكذا في مصر، والشام والعراق، وكان هناك دعاة كثيرون، عندهم معرفة بالحق والدعوة إليه فلما بلغتهم دعوة الشيخ زاد نشاطهم وزادت قوتهم، واشتهروا بالدعوة، ولم تزل دعوة الشيخ تشتهر وتظهر بين العالم الإسلامي وغيره، ثم في هذا العصر الأخير طبعت كتبه، ورسائله، وكتب أبنائه وأحفاده، وأنصاره، وأعوانه من علماء المسلمين في الجزيرة وخارجها، وكذلك طبعت الكتب المؤلفة في دعوته، وترجمته، وأحوال أنصاره، حتى اشتهرت بين الناس في غالب الأقطار والأمصار، ومن المعلوم أن لكل نعمة حاسدا، وأن لكل داع أعداء كثيرين كما قال الله تعالى: {وَكَذَلِكَ جَعَلْنَا لِكُلِّ نَبِيٍّ عَدُوًّا شَيَاطِينَ الْإِنْسِ وَالْجِنِّ يُوحِي بَعْضُهُمْ إِلَى بَعْضٍ زُخْرُفَ الْقَوْلِ غُرُورًا وَلَوْ شَاءَ رَبُّكَ مَا فَعَلُوهُ فَذَرْهُمْ وَمَا يَفْتَرُونَ}[2] فلما اشتهر الشيخ بالدعوة، وكتب الكتابات الكثيرة، وألف المؤلفات القيمة، ونشرها في الناس، وكاتبه العلماء، ظهر جماعة كثيرون من حساده ومن مخالفيه، وظهر أيضا أعداء آخرون.<br />وصار أعداؤه وخصومه قسمين: قسم عادوه باسم العلم والدين، وقسم: عادوه باسم السياسة لكن تستروا بالعلم، وتستروا باسم الدين، واستغلوا عداوة من عاداه من العلماء، الذين أظهروا عداوته وقالوا إنه على غير الحق، وإنه كيت وكيت، والشيخ رحمة الله عليه مستمر في الدعوة يزيل الشبه، ويوضح الدليل، ويرشد الناس إلى الحقائق على ما هي عليه من كتاب الله وسنة رسوله عليه الصلاة والسلام وطورا يقولون: إنه من الخوارج، وتارة يقولون: يخرق الإجماع ويدعي الاجتهاد المطلق، ولا يبالي بمن قبله من العلماء والفقهاء وتارة يرمونه بأشياء أخرى، وما ذاك إلا من قلة العلم من طائفة منهم، وطائفة أخرى قلدت غيرها، واعتمدت على غيرها، وطائفة أخرى خافت على مراكزها فعادته سياسة، وتسترت باسم الإسلام والدين، واعتمدت على أقوال المخرفين والمضللين.<br />والخصوم في الحقيقة ثلاثة أقسام: علماء مخرفون يرون الحق باطلا والباطل حقا، ويعتقدون أن البناء على القبور، واتخاذ المساجد عليها، ودعاءها من دون الله والاستغاثة بها وما أشبه ذلك دين وهدى، ويعتقدون أن من أنكر ذلك فقد أبغض الصالحين، وأبغض الأولياء، وهو عدو يجب جهاده.<br />وقسم آخر: من المنسوبين للعلم جهلوا حقيقة هذا الرجل، ولم يعرفوا عنه الحق الذي دعا إليه، بل قلدوا غيرهم، وصدقوا ما قيل فيه من الخرافيين المضللين، وظنوا أنهم على هدى فيما نسبوه إليه من بغض الأولياء والأنبياء، ومن معاداتهم وإنكار كراماتهم. فذموا الشيخ، وعابوا دعوته ونفروا عنه.<br />وقسم آخر: خافوا على المناصب والمراتب، فعادوه لئلا تمتد أيدي أنصار الدعوة الإسلامية إليهم، فتزيلهم عن مراكزهم، وتستولي على بلادهم، واستمرت الحرب الكلامية والمجادلات والمساجلات بين الشيخ وخصومه، يكاتبهم ويكاتبونه، ويجادلهم ويرد عليهم ويردون عليه، وهكذا جرى بين أبنائه وأحفاده وأنصاره، وبين خصوم الدعوة، حتى اجتمع من ذلك رسائل كثيرة، وردود جمة، وقد جمعت هذه الرسائل والفتاوى والردود فبلغت مجلدات، وقد طبع أكثرها والحمد لله، واستمر الشيخ في الدعوة والجهاد، وساعده الأمير محمد بن سعود أمير الدرعية، وجد الأسرة السعودية على ذلك ؛ ورفعت راية الجهاد، وبدأ الجهاد من عام 1158 هـ، بدأ الجهاد بالسيف وبالكلام، وبالحجة والبرهان، ثم استمرت الدعوة مع الجهاد بالسيف، ومعلوم أن الداعي إلى الله عز وجل إذا لم يكن لديه قوة تنصر الحق، وتنفذه فسرعان ما تخبو دعوته وتنطفئ شهرته، ثم يقل أنصاره، ومعلوم ما للسلاح من الأثر العظيم في نشر الدعوة، وقمع المعارضين، ونصر الحق وقمع الباطل، ولقد صدق الله العظيم في قوله عز وجل، وهو الصادق سبحانه في كل ما يقول: {لَقَدْ أَرْسَلْنَا رُسُلَنَا بِالْبَيِّنَاتِ وَأَنْزَلْنَا مَعَهُمُ الْكِتَابَ وَالْمِيزَانَ لِيَقُومَ النَّاسُ بِالْقِسْطِ وَأَنْزَلْنَا الْحَدِيدَ فِيهِ بَأْسٌ شَدِيدٌ وَمَنَافِعُ لِلنَّاسِ وَلِيَعْلَمَ اللَّهُ مَنْ يَنْصُرُهُ وَرُسُلَهُ بِالْغَيْبِ إِنَّ اللَّهَ قَوِيٌّ عَزِيزٌ}[3] فبين سبحانه وتعالي أنه أرسل الرسل بالبينات، وهي الحجج والبراهين الساطعة، التي يوضح الله بها الحق، ويدفع بها الباطل، وأنزل مع الرسل الكتاب الذي فيه البيان، والهدى والإيضاح، وأنزل معهم الميزان، وهو العدل الذي ينصف به المظلوم من الظالم، ويقام به الحق وينشر به الهدى، ويعامل الناس على ضوئه بالحق والقسط، وأنزل الحديد فيه بأس شديد، فيه قوة، وردع وزجر لمن خالف الحق، فالحديد لمن لم تنفع فيه الحجة، وتؤثر فيه البينة، فهو القامع.<br />ولقد أحسن من قال في مثل هذا:<br />وما هو إلا الوحي أو حد مرهف تزيل ظباه أخدعي كل مائل<br />فهذا دواء الداء من كل جاهل وهذا دواء الداء من كل عادل<br />فالعاقل ذو الفطرة السليمة، ينتفع بالبينة، ويقبل الحق بدليله، أما الظالم التابع لهواه فلا يردعه إلا السيف، فجد الشيخ رحمه الله في الدعوة والجهاد، وساعده أنصاره من آل سعود طيب الله ثراهم على ذلك، واستمروا في الجهاد والدعوة من عام 1158 هـ إلى أن توفي الشيخ في عام 1206 هـ فاستمر الجهاد والدعوة قريباً من خمسين عاماً، جهاد، ودعوة ونضال، وجدال في الحق، وإيضاح لما قال الله ورسوله، ودعوة إلى دين الله، وإرشاد إلى ما شرعه رسول الله عليه الصلاة والسلام حتى التزم الناس بالطاعة، ودخلوا في دين الله، وهدموا ما عندهم من القباب، وأزالوا ما لديهم من المساجد المبنية على القبور، وحكموا الشريعة، ودانوا بها وتركوا ما كانوا عليه من تحكيم سوالف الآباء والأجداد، وقوانينهم ورجعوا إلى الحق وعمرت المساجد بالصلوات، وحلقات العلم وأديت الزكوات، وصام الناس رمضان كما شرع الله عز وجل، وأمر بالمعروف، ونهي عن المنكر، وساد الأمن في الأمصار والقرى والطرق والبوادي، ووقف البادية عند حدهم، ودخلوا في<br />22/10/2006<br />اقرأ بقية التعليق .."
