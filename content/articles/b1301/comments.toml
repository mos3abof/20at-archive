[[comments]]
order = 30
subject = "الى الاخ مازن السعودى"
author = "السلام عليكم ورحمه الله وبركاته ..."
posted = "2006-10-11"
text = "انا اول مرة ادخل هذا الموقع وبالصدفه دخلت الى الرابط الخاص الذى يتحدث عن شاب سعودى يجاخر بالافطار فى نهار رمضان مع ان الصورة مش موضحه جنسيه الشخص ومع اعتراضى على طرح مواضيع ممكن ان تفتح مجال للخلاف لكنى اريد ان اوضح لك اشياء يظهر انها غائبه عنك وهى ماهى مصر التى تتكلم عنها بطريقه توضح انك شخصيه مريضه و لا تعبر بالطبع عن الشعب السعودى الذى نعرفه لان هناك اساليب فى الحديث تسطيع من خلاللها نقض التعليقات دون التجريح وتستطيع ان تكسب مؤيدين كثيرين لرايك فانت تتبع سنه الرسول (ص)فكيف كان يقابل الرسول السيئه هل كان يقابله بالاهانات والشتائم كما فعلت بالرغم من ان ماقلته مجرد افترات كاذبه لان المصريين الذين يعملون بالمملكه ينمون فى الاقتصادالوطنى لبلدك فى المدارس كمدرسين او مهندسين او اطباء وكذلك الجنسيات الاخرى ,ويكفى ان عندما فتح الله مصر للمسلمين كما وعدهم الرسول (سيفتح الله عليكم مصر ....الى اخر الحديث )كان الشعب المصرى والجنود المصريين بما لهم من خبرات سابقه عبر العصور فى الحروب وركوب البحر اثر فى الفتوحات الاسلاميه وملخص الحديث ياريت نلتقى على نتقاط اتفاق دون تجريح او الفاظ لا تجدى نفعا\"انا لن ارد على الفاظك وتشبيهاتك وياريت تراجع نفسك وتعتذر لجميع الاخوة عما بدر منك.<br />شكرا\"للجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124339/http://www.20at.com/article2.php?sid=1301"

[[comments]]
order = 31
subject = "ردا على مازن وريم...اتقوا الله"
author = "طالب في هندسة القاهرة"
posted = "2006-10-18"
text = "هذا هو ردي على ماقاله ((البطل القومي العظيم مازن نصير الاسلام والمسلمين والعروبة والديمقراطية والمش عارف ايه وو.....الخ)):<br />أولا نحن في العشر الأواخر من رمضان ونقترب من ليلة القدر.<br />ثانيا: الموضوع كان عن السعودية أصلا فما الذي أدخل مصر في الموضوع؟؟؟!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!<br />ثالثا: هل نعتبر أنفسنا مسلمين بهذ الطريقة التي يتعامل بها المسلمون مع بعضهم البعض؟؟؟!!!!!!!!!!!!!!!!!! يعني ايه مصر ويعني ايه السعودية؟ كلام فاضي كله. مسميات الهدف منها تمزيق الأمة تمزيقا مميتا بسلاح نشر العنصرية وهي جزء من المؤامرة الكبرى على الأمة.<br />واذا أردنا التحدث بدقة وحق فنحن دولة اسلامية كبرى واحدة بها مدن عديدة مثل مدينة السعودية ومدينة مصر ومدينة اندونيسيا ومدينة الجزائر...الخ.<br />وكلام هذا المدعو مازن قد خرج به عن صف دولتنا الاسلامية الكبرى فأنا أعتبره ليس سعوديا ولا حتى مسلما فالمسلم من سلم الناس لسانه ويده.<br />أما بالنسبة لما ورد في تعليق ذلك المدعو مازن, فيمكن الرد عليه بكل بساطة كالتالي:<br />أولا بالنسبة لقنوات الأغاني المصرية أيها الفاتح العظيم فأنتم تملكون أكبر شبكة لقنوات الأغاني العربية في العالم كله وهي (روتانا) المملوكة للأمير الوليد بن طلال, فتوجد قناة روتانا أغاني وروتانا كليب وروتانا خليجية وروتانا طرب وروتانا زمان...الخ, هذا فضلا عن قنوات الفيديو الكليب الخليجية مثل قناة نجو الخليج وقناة ميوزيك بلاس وغيرها, وأيضا قنوات الأغاني اللبنانية مثل سترايك وغيرها, فكيف تحصر الموضوع في مصر والسعودية تملك أكبر شبكة قنوات أغاني عربي وأكبر شركة أغاني وهلس هي روتاناوغيرها؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!<br />وبالنسبة لقولك العبقري هذا: (ربنا حارمكم من النعمة وجعانين), فأقول لك:<br />أي نعمة تلك التي تتحدث عنها؟ فاذا كنت تقصد أننا لانملك مالا مثلما تملكون بسبب مخزون السعودية من النفط, فأقول لك بكل بساطة: المال ليس نعمة في حد ذاته بل على العكس فقد يكون اختبارا من الله ليرى كيف سينفقه الناس في مرضاته أم في شيء آخر, وهو مسئولية كبرى خاصة اذا كان الثراء فاحشا مثلما في السعودية والخليج عموما, ويوم القيامة لاينفع لا مال ولابنون ولا أحد يأخذ معه المال في قبره بل يأخذ عمله الصالح فقط, وقد يدخل الفقير الجنة لأنه لم يملك المال الكافي للمساعدة لاصلاح حياة غيره, أي انه لن يحاسب بماله لأنه لايملك مالا أصلا الا لتلبية حاجاته الأساسية تلبية بسيطة وربما بسيطة جدا, أما الشخص الثري ثراء فاحشا فوضعه مختلف مع الله عز وجل, والغني يوم القيامة ليس من يملك مالا كبيرا ولكن الغني هو من يملك أعمالا صالحة كبيرة.<br />ولاتنسى يا مازن أن الخبراء قالوا أن مخزون العالم كله من النفط سينفد بعد حوالي خمسين سنة, وهذا القول أساسا مر عليه حوالي عشرة سنين, أي أن النفاذ يقترب فماذا سيفعل الأثرياء المعتمدون على النفط في دول الخليج كلهل وليس السعودية فقط؟؟؟!!! وكيف سيكون حال البروج المشيدة في الامارات العربية المتحدة وغيرها؟؟؟!!! هل ستسكنها الغربان؟<br />لا اله الا الله ولا حول ولا قوة الا بالله.<br />كلمة أخيرة الى مازن: بالنسبة الى ألفاظك النابية والسب والشتائم فلن أرد عليها وٍسأرتقي فوق هذا المستوى المتدني الوضيع في حق المصريين الذين يعالجون الناس بحرفية عالية يشهد لها عالميا وينجزون المشاريع الهندسية الضخمة وتختارهم الشركات العالمية لذلك وحدهم دون سواهم بسبب كفاءتهم العالية التي تتفوق في بعض الأحيان على الكفاءات الأمريكية والغربية وغيرها والأمثلة لا مجال لحصرها هنا لكثرتها وسأكتفي بالتذكير بذلك المهندس الشاب المصري الذي قام بتصميم وتنفيذ مشروع مترو أنفاق اروربا الجديد في ألمانيا الذي كان متعثرا عندما كان يديره مهندس ألماني بسبب مسار المترو شديد التعقيد والعقبات الفنية التي تواجه هذا المسار, وتم تغيير المهندس الألماني بأربعة من أفضل الكفاءات الألمانية دون جدوى الى أن جاء المهندس هاني المصري الجنسية الذي انجز المشروع بكفاءة وتم افتتاحه بالفعل.<br />وأنا هنا أدعو الجميع الى التخلي عن العنصرية المقيتة فان وجد بلاء فهو كما وضحت في سياق كلامي بلاء عام في الدول الاسلامية كلها وليس حكرا على دولة أوشعب دون غيرها. وتحياتي وسلامي لجميع الشرفاء في مصر والسعودية وغيرها من سائر بلاد المسلمين, وأحلم أن تسقط هذه المسميات ونكون مسلمين فقط لاغير, لاسعوديين ولامصريين ولالبنانيين ولا بتنجانيين, وان أساء أحد في أي دولة فما ذنب باقي الشعب؟؟؟ هل يحاسب ويتهم بذنب غيره سبحان الله!!!<br />اتقي الله يا موقع العشرينات, اتقي نار جهنم, الصحافة ليست ارتزاق بل هي مسئولية كبرى أمام الله عزوجل والرسول عليه الصلاة والسلام يوم القيامة, اتقوا زقوم جهنم, اتقوا زقوم جهنم, اتقوا زقوم جهنم<br />تب الى الله يا مازن وياريم, كلمة واحدة ممكن أن تلقي بصاحبها في زقوم جهنم أغاثنا الله جميعا منها.<br />اتقوا الله جميعععععععععععععععععععععععا يا زائري الموقع الكرام, وادعوا لي أنا أيضا بتقوى الله, وتحلوا بأخلاق الرسول عليه الصلاة والسلام, وأعرضوا عن اللغو وتكلموا بكلام الرسول وتعاملوا مع الناس بأخلاق الرسول وامشوا على خطى الحبيب في كل مناحي حياتكم أيا كانت.<br />وأستغفر الله لي ولكم والصلاة والسلام على حبيبنا محمد والحمد لله ولا اله الا الله ولا حول ولا قوة الا بالله<br />اللهم انك عفو رحيم تحب الفو فاعفوا عنا وبلغنا ليلة القدر يا مغيث..أغثنا يا مغيث أغث أمة حبيبك محمد يا مغيث<br />نستفرك ربنا انا كنا من الظالمممممممممممممممممممممممممممين<br />نستفرك ربنا انا كنا من الظالمممممممممممممممممممممممممممين<br />نستفرك ربنا انا كنا من الظالمممممممممممممممممممممممممممين"
