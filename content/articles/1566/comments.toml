[[comments]]
order = 0
subject = "ليش ما يتبرعوا بالساحة الهاشمية"
author = "ديانا كرزون"
posted = "2006-05-09"
text = "ليش ما تبرعوا في الساحة الهاشمية ، لأنه الساحة الهاشمية بحاجة الى مجموعات كبيرة من الشباب والولاد الحلوين اللي لازم يعبوا الساحة ، لنه ( تبعون الولاد) صاروا يتضايقوا من قلة عدد الشباب والولاد النظاف اللي كانوا يملؤوا الساحة ايام زمان ، وهم بحاجة للحلوين بشكل كبير لأنهم بسلوهم وببسطوهم وبمتعوا بعض لأنهم زهقوا من البنات والنسوان.<br />وصار بدهم ولاد."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145734/http://www.20at.com/article2.php?sid=783"

