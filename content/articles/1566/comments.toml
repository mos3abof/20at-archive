[[comments]]
order = 2
subject = "اللهم ارحم ضعفنا وقوي عزيمتنا"
author = "مراد"
posted = "2006-05-11"
text = "انا مستغرب صحيح انها دوله وليست محتله<br />فلماذا فقراء والله كل الحق على الرئيس النائم ليس على الشعب المسكين هي دوله وباستطاعتها جلب كل شيء لاكن الرئيس همه نفسه ولا يهمه غيره ... لذالك الله لن ينصرنا حتى نصلح انفسنا مع انفسنا وتنتشر المحبه بيننا.....؟؟؟ الرئيس الاردني مقصر في حق شعبه العامل الذي يشتغل كل الشهر ياخذ 100 دينار انها لا تكفي لطفل اسرائيل وهم كفره يعطو الشخص الواحد القعيد الذي ليس باستطاعته العمل<br />1500 دينار .. هاولاء وهم كفره فماذا نحن لماذا الظلم انا غير مستعد اتنعم وجنبي وجنبي جياعا .. النبي قال لا يؤمن لايؤمن لا يؤمن من نام وجاره جائع فالامير ينام مليء البطن وشعبه جائع ....."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145734/http://www.20at.com/article2.php?sid=783"

