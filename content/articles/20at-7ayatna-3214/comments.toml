posted = "2009-07-19"
text = "لمشكله واضحه وضوح الشمس..سبب المعاكسات والفساد اللي عبى البلاد ..كله البعد عالدين<br />تفكير الاولاد صار كله لبس وشعر سبايكي وماركات احرف من البنات ومعاكاسات عالتيليفون وغيره وغيره ..ونادر مانشوف ولد في العشرينيات وملتزم لان الكل يبي يهيج اي حياة هادي بالبعد عن ربي!!!<br />والبنت اللي تحساب الحجاب في انها تحط وشاح علي راسها وخصله طالعه من هني وهني وتلبس مايجي علي بالها والله اللي نشوف فيه لو اللي دروحها متحجبه تنحي بس الوشاح يبدا ماعاش في فرق بينهها وبين اللي مش متحجبه. فياريت نفهمو الحجاب على انه ستر للبنت ومش موضى.. ويارت نمشو حياتنا بما يناسب ديننا مش نغيرو ونستغنو ونضحو بقيم ديننا غر باش يرضى الغير علينا.<br />ياريت تتعاملو بعقلانيه اكتر من هكي وبلاش منه اسلوب الشتايم لانه في الجدال الكل خسران مافيش افضل من الحواااااار.<br />ربي يهدي الجميع ويوفقكم الى مايحبه ويرضااااااااااا ااااه ويهدي شبااااااااااابن ا والله متحسره علي وضع شبابنا وبناتنا<br />*هديتي ليكم::*من كلام يحيى بن معاذ الرازي:ليكن حظ المؤمن منك ثلاثه:ان لم تنفعه فلا تضره، وان لم تفرحه فلا تغمه، وان لم تمدحه فلا تذمه* :"
