text = "تتميز لبنان وكما يعتقدون بأنها البلد المتحضر عن غيره من الدول العربيه ..<br />وعرض المايوه اصبح سمه من سمات هذا البلد … فكل يوم جمعه .. تطل علينا اجمل وانعم الفتيات بلباس المايوه .. الذي يظهر الكثير من اجزاء جسمها ان لم يكن كامل الجسد ..<br />الغريبه في مسابقة جمال لبنان ان الاب والاخ هم من يشجهون بكل قوه ويحضرون الحفل لرؤية ابنتهم بذلك اللباس الخليع ..<br />سؤالي … هل تعتقدون انه سوف يأتي يوم من الايام وتقام مسابقة في احدى دول الخليج والملكات خليجيات وعلى نفس النظام من لبس مايوه والرقص باحضان الرجال ؟؟؟؟<br />ولاسيما ان اكثر جمهور تلك المسابقات هم من الخليج … والذين ينفقون الكثير في التصويت …<br />تحياتي للجميع … كتبت هذا الموضوع وانا اشاهد هذا البرنامج …<br />_______________ ___"
