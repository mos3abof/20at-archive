[[comments]]
order = 14
subject = ""
author = "مهندس رمضان محمود هاشم - القاه"
posted = "2008-02-14"
text = "ليس الي الاخوة الليبيين وحدهم و لكن الي كل اخوتي العرب شرقا و غربا شمالا و جنوبا<br />في المقام الاول ما يربطنا ديننا و لغتنا و لا اقصد لهجاتنا<br />ديننا و ليس بجديد عليكم ينهانا عن المفاخرة بالالقاب و الاصول فالمفاخرة فقط بالتقوي و التقوي هي تقوي الله<br />و ينهانا عن كل قول و فعل نتيجته و مدلوله يؤدي الي الفرقة و الشتات<br />فنحن مامورون بالاتحاد و التالف فرسالتنا كبيرة لقد نسينا اننا مطالبون بالامر بالمعروف و هداية الناس الضالة في كل انحاء الكرة الارضية يا جماعة يقع علينا ذنب كل ضال علي و جه الارض<br />اقدم ليبيا علي بلادي هي فخر للعرب و تونس و الجزائر و المغرب و السعودية و الاردن و العراق و سوريا و فلسطين و غيرهم و انا و انت و كلنا يعلم اننا اهل و لمن لا يعلم فانا اذكر فقط و لا اتفاخر ان ام العرب ام سيد العرب سيدنا اسماعيل هي السيدة هاجر مصرية<br />مصر اكبر دولة عربية و لذلك فحملها تجاه اخواتها اكبر<br />و نحاول نشر رسالتنا و ديننا الي كل الدنيا و هذا هو الازهر اكبر دليل كم من البشر شرقا و غربا تربي داخله<br />لقد افل نجمه في ايامنا هذه انا اعلم لان هذا اصبح حالنا لا نتعاون علي الخير نجري و ننجرف الي الشتات و العرقيات<br />بنات ليبيا للحقيقة انا افخر بهم نسبة اقترابهم لشريعة ديننا كبيرة جدا و ارجو ان لا يعتقد الاخرون ان بناتهم و منهم بلادي ان بناتهم غير ذلك لا و لكن ليكن اهتمامنا الاصلاح و الرقي و التوجيه<br />من هذا المنطلق نرجو الكل يحدد الهدف يرجع الي الاصل نتقي الله في رسالتنا يا جماعة نحن خير امة خذوا العبرة من احد عندما تركنا كلام الرسول و انهزمنا هذه دروس<br />ندعو الله ان يهدينا سواء السبيل و يرينا الحق حقا و الباطل باطلا<br />الهم لا حول لنا و لا قوة فلا تول علينا من هو منا فلقد اصبحنا في حا لا يرثي له<br />اللهم ما ولي علينا من تري فيه الخير لنا اللهم ما اصلح لنا حالنا<br />و اهدي ابنائنا و بناتنا لقد ضاع منا الاقصي و تمكن منا اعداءك اعداء دينك<br />لا حول ولا قوة الا بك<br />لا حول و لا قوة الابك"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110082336/http://www.20at.com:80/20at/lifestyle/3214.html"

