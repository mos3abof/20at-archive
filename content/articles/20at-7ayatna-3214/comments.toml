text = "بسم الله لن أعلق على الموضوع فهو مجهود تشكر عليه كاتبته وأتمنى لها مزيدا من التألق ولكن لفت انتباهي هو هجوم بعض الشراذم من مصر على ليبيا والذين هم لا يمثلون مصر بطبيعة الحال وإنما يمثلون فئة مصرية تائهة وبدون هوية الفقر من جهة والتكالب على الدنيا والماديات من جهة أخرى هذه الفئة تبيع شرفها وضميرها بأبخس الأثمان حتى لليهود وتعيش حياة الفهلوة والنصب أنا أستغرب كيف يلتفت الليبيون لمثل هؤلاء وينسون أنهم أكبر شأنا هؤلاء يتصرفون من وازع الحقد والحسد تضنيهم حياة الترع والمياه الآسنة والليبيون كانوا ولازالوا قمة العرب في أصالتهم وشرفهم ومن يتحدث عن الليبيات إنما يعلم أنه لايمكنه أن يطالهن حتى في أجمل أحلامه هؤلاء قوم يائسون بائسون لا يليق بنا أن ننزل لمستواهم يا أبناء ليبيا بلغو عني هذا الأمر وهو أنتم زينة العرب"
