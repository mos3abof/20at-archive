author = "ليبية حرة"
posted = "2009-06-20"
text = "مساء الخير<br />انا قريت الكلام كله والتعليقات كلها واتأسفت على معظمها… لانه ما حكته الاخت هبة في مقالها عن الشباب الليبي و(المنابشة) أكدته تعليقاتكم الخالية من حدود الادب وذلك واضح وجلي في رودوكم المليئة بالالفاظ الغير المحترمة والمؤسفة لبناتنا وشبابنا.. وهذا لايعني ان ليبيا وخالية من الناس المحترمة وانصح اخوتي واخواتي بدلا من تبادل الارقام والعبارات المتهكمة ان يصلوا ويركعوا لله ويستغفرونه..<br />الشئ الاخر نحن هنا لسنا في نزاع من افضل هل هي ليبيا ام مصر..<br />فمن رأيي ان لكل قاعدة شواذ والمحترم والغير محترم موجودين في كل مكان..<br />وهذا شئ لا يعرفه الا الله سبحانه اي لكل منا عمله الذي سيحاسب به يوم الاخرة وعندها نعرف من الافضل من الاخر<br />فأتقوا انفسكم واستغفروا الله<br />والسلام عليكم<br />اختكم ليبية حرة"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621192718/http://www.20at.com:80/20at/7ayatna/3214.html"

