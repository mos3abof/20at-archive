posted = "2009-07-16"
text = "السلام على كل ليبي اولا<br />ومسلم وعربي ثانيا<br />حني قاعدين ولله الحمد في آخر الترتيب بين البلدان العربية والعالم من ناحية الفسق والانحلال الاخلاقي<br />وفي اول الترتيب في الروابط الاجتماعية والمحافظة على أهل البيت وماتنسوش انه مازال عندنا الغيرة على الاهل وحتى على بنات الجيران<br />ولو نتكلم على عزة النفس أعز من نفسنا دور ماتلقى<br />اكبر عيب عندنا الليبيين اللسان اللي بصراحة في التفتفيت وينه اللي يحصل معاك ويقدرك في الكلام<br />ولما يستعمله لفايدته دايما مايكون منقذ ليه<br />المعاكسات والقرمة والتفتفيت وطول اللسان هذا طبع فينا والله طبع علينا من الطليان واللي عاش في ايطاليا يعرف الامور هاذي"
