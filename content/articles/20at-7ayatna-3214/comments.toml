text = "السلام عليكم ورحمة الله وبركاته<br />والله كلي اسف عالكلام اللي قريته..صدمتني عقلية بعض المشاركيين وتفكيرهم الساذج..لو كل واحد فينا فكر بان كل كلمة محسوبه عليه عند الله وفكر لو الرسول معانا كان حايرضى بالالفاظ هادي والاسلوب اللي لا يمت لاخلاق المسلمين بصلة…والله مانقول الا ان شاء الله ترجعو للدين وتتعاملو فيما بينكم بسنه الحبيب محمد عليه الصلاة والسلام. اما بالنسبه لموضوع المعاكاسات اني براي ان الطرفين مسؤليين عالغلط اللي صاير البنت بلبسا وتبرجها وعدم حجابها تعرض نفسها والشباب للفتنه…والاولاد نقوللهم العبارة اللي الكل يعرفها لكن ماحدش يتعامل بيها وهي ياريت كل الاولاد يخافو علي بنات الناس زي مايخافو علي اخواتهم *ان شاء الله ربي يهدي الجميع ويثبت علينا العقل والدين*"
