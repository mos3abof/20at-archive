author = "ترهونى"
posted = "2010-01-05"
text = "اقتباس casper:<br />اقتباس مروان:<br />عمرى 17 سنة من بنغازى هنالك بعض الشباب والفتيات الغير موئدبات والفتيات يبهرون الشباب بملابس الضيقة والشفافة واذ رئوها فقد بدات المعاكسه والمغزله<br />والله صدق قول الشاعر اتقي شر من احسنت اليه<br />اما الشعب المصري الدي يساق بالكرباج و الدي بنى الاهرام بقوة سوط فرعون وحفر القناة بالقوة ادهب و اقرا تاريخكم المدل يا كدابين وفيكم من الشدود الجنسي من ايام الفراعنة حتى الان وصدق عمرو بن العاص حين قال عنهم ان نسائهم طرب يتكلم عن الشعب الارقى والدي قال فيه عبدالكريم الخطابي ان على الشعوب الاسلامية تعلم الجهاد من الليبين ياتي فلاح مصري او شامي او راع خليجي و يتكلم عن الشعب الليبي الشريف فليقرا التاريخ وكما نقول الجمل ما يشوف عوج رقبته و بعدين يا مصري يللي يتكلم ما كنت حشت بناتكم عن الامريكان سنة 1990 و الا نسيت ؟ اما اخونا الشرقاوي اللي خشله الريح وبدي يدافع عن شرق ليبيا اراهو ليبيا وحدة يا خوي"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106145059/http://www.20at.com:80/20at/lifestyle/3214.html"
