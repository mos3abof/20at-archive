[[comments]]
order = 12
subject = ""
author = "دكتور حزن-المملكة المتحدة-ليفر"
posted = "2008-01-31"
text = "السلام عليكم..<br />أولا شكرا لكاتبة الموضوع ..التي حاولت ان تقول شيئا بطريقة عجز عن فهمها بعض القرأ…<br />ثانيا .زتعليقي على الاخوة المصريين…أحدهم يسئل هو الكلام الليبي كلام عربي أو ايه…؟ أجيبك أيه كلام عربي…والسبب لعدم فهمك هو لان اللهجة الليبية صعبة عليك..مثل باقي اللهجات يلي لا تستوعب منها الا القليل ..ولانك عايش في قوقعة اللهجة المصرية التي ساهمت في انتشارها الافلام والمسلسلات والاغاني…والا كان هذا لم يكن هناك في العالم العربي من يفهم كلمة من كلامك…فلا تسخر من لهجات الغير…على الأقل الليبين أصلهم عربي..وهم عندما يتكلمون خلاف اللهجة يتكلمون بلغة عربية فصحى…أما أنتم لإابحتوا لكم عن جدوركم وقل لي الى اين ستصل…<br />وأقول للمصري لاخر الذي يسئل عن أشكال الشباب الليبي لإأبشرك هم يحملون كافة الصفات العربية..أذا كنت تعرف صفة العربي فذاك هو الليبي..وهناك فرق بين العربي والفرعوني والقبطي…<br />أما عن ترحيل العمالة .فهذا قرار دولة لايحق لامثالك النقاش فيه لانك لست بليبي ..وكان بالاحرى لكي يا ديمة مناقشة<br />تسفير المصريات الى السعودة للعمل كخادمات بيوت…أهتموا بشؤونكم الداخلية أفضل لكم…وقرار الترحيل ناتج عما يفعله المصريين من هروب عبر البحر الى اوروبا مما سبب مشاكل لليبين مع اللاوروبيين…أذا كنتم عاوزين تسافروا اوروبا روحوا للسفارات وخدوا تأشيرات…هو فيه احد حايشكم…<br />أما عن الشخص يلي بيسئل هو ليبيا فيها بنات…والله ان ماكن فيها بنات اذا من اين وجد الليبين…اللهم الا اذا كان كل الليبين متزوجين مصريات…اما لذيك نظرية اخرى عن خلق البشر وانهم يوجودن من غير البنات…لاتستحق الرد ..لانك الظاهر ما تملك شيء..<br />تعليقات الليبين والليبيات على الموضوع كان غير جيد ..فيه اساءة لصورة الليبين…أتمنى من صاحبة الموضوع متابعة موضوعها وحذف أو التبليغ على التعليقات المسيئة…واتمنى من الليبين والليبيات عدم التعليق باسلوب يتخلله الشتم…مهما يحدث فكلنا مسلمين عرب…وذي اهم حاجة…من أراد أن يسب فليسب وليأخذ هو الاثم..اما الانسان الناجح يدخل فقط لتوضيح مفهوم او لابداء رأي بصورة سليمة…<br />وشكرا للجميع…<br />دكتور حزن …ليبي.<br />المملكة المتحدة-ليفربول"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110082336/http://www.20at.com:80/20at/lifestyle/3214.html"

