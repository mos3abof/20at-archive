[[comments]]
order = 1
subject = "؟؟؟؟"
text = "و يترى لو كان المسجد هو اللى عامل نفس النشاطات ده كان هيبقى نشاط ولا تنظيم إرهبى!!!<br />يا ريت نطالب بحفظ حقوق الأقلية المسلمة فى مصر...<br />على فكرة انا مش ضد نشاط الكنيسة.. خالص.. بس صعبان عليا نحرم من حاجة زى كده و فى ناس كثيرة عندها استعداد لتنظيمها و الاشراف عليها...<br />يا خسارة"
archived = "2004-09-07"
capture_url = "https://web.archive.org/web/20040907015850/http://www.20at.com:80/article.php?sid=463"

