text = "تا تا خطى العتبة<br />اية فايدة المثلث ؟ خابور المرور اللواء در[ *** ]يون بيقول لك علشان لما السيارة تعطل تقوم تحط المثلث ورائها على بعد 10 متر يقوم السواق اللى جاى ورائك يتنبة ويبعد عنك — طيب يا سيادة الخابور السيارة فيها اشارات الانذار اللى بيقولوا علية بالبلدى الغماز يعنى الاربع اشارات اتنين من خلف السيارة واتنين فى مقدمة السيارة بيعملوا فليشر ولون اصفر بيظهر من مسافىة طويلة لغاية سيارة المرور ما توصل وتجر السيارة الى منطقة امنة<br />- بعض الدول بدل المثلث بتحط مخروط بلاستيك - بس مع اللوارى والسيارات الكبيرة<br />على العموم الموضوع خلاص"
