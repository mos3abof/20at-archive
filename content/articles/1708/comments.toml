[[comments]]
order = 4
subject = "احنا السبب"
author = "sweet_princess"
posted = "2006-02-14"
text = "احب اقوللكو اننا السبب عشان سكتنا ع اللي حصل واللي بيحصل واللي لسه هيحصلنا احنا ولله الحمد كشعب مصري قفلنا بقنا وبلعنا الجزمه لما حصلت اتفاقية الكويز اللي دخلت اسرائيل معانا في اهم مشاريعنا الاقتصاديه وانجحها اللي هي صناعة النسيج وغيره وغيره واحنا كمان السبب لما بنسكت على حق واحد مات شهيد لاحاولنا نحقق في سبب موته اللي كلنا متاكدين من انه مات مسموم (انا بتكلم عن ياسر عرفات )ومراته اللي خدت ملف حالته المرضيه من المستشفى بعد موته ورفضت تسلمه لمعرفة سبب الوفاه الحقيقي بالله عليكو بقى واحده زي دي خدت كام عشان تسكت احب اقوللكو في اخر كلامي وبكل احترامي (جتنا نيله في صمتنا الهباب )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152057/http://www.20at.com/article2.php?sid=421"
