subject = "نشالين"
author = "الحقيقة انهم في ناس في السلطة الفلسطينية كبار قوي ونشالين، وكبار النشالين ايضا."
posted = "2006-02-13"
text = "لكن مش معنى ده انه الشعب فاسد ايضا، لانه بحاول بكل قواه انه يغير الكلام ده.<br />وان شاء الله بعد فوز حماس الميزان هيتغير"
archived = "2006-11-02"
