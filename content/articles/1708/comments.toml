text = "الحل للقضاء على الفساد:<br />يقظة الشعوب وفى الإنتخابات التشريعية الحرة والنزبهه حتى نصل الى النضج السياسى والممارسة والحياة السياسية السليمة بدون قمع أو إرهاب أو تضليل من الحكام للشعوب المقهورة ولضمان كشف اى ممارسات غير مسئولة فى الوقت المناسب."
