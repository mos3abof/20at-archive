[[comments]]
order = 1
subject = "يا حرامي يا وحش"
author = "أكرم"
posted = "2006-02-12"
text = "يقول احد الخبثاء ان الفلسطينيون باعوا ارضهم لليهود و يستاهلوا الحرق بجاز ( وحدد نوع الجاز ) و اننا حاربنا عشاهم بس هما مبيعجبهمش العجب<br />اكيد دلوقتي هيزلني و هيقولي شوف و بص يا عم و بيسرقوها كمان عشان تعرف ان الفلسطينيين دول وحشين متلعبش معاهم تاني<br />بس ااقوله ايه ؟؟؟<br />دي قلة قليلة مندسه هيقولي انتوا كده يا بتوع العلام بتقولوا كلام في كلام بس الواقع بيأيدني<br />أأقولوه ايه انت حرامي و بتسرق القروض من البنوك عشان يصدقني و لا ااقوله انت قواد و بتسرح ورا السياح العرب و الاجانب من اجل حفنة دولارات<br />و هنفضل نشتم في بعض و نجادل و مفيش فايدة<br />حد يدلني يا جدعان ( مفرد جدع )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152057/http://www.20at.com/article2.php?sid=421"

[[comments]]
