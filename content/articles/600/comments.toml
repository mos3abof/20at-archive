subject = "مش ممكن مش ممكن مش ممكن .. يا خبر ابياااااض"
author = "مصــegyــري"
posted = "2006-01-28"
text = "و ماله<br />و حماده امام يشتغل شيف و يلبس مريلة طبخ<br />و شوبير يعمل برنامج لك و لأسرتك<br />في رأيي المعلق هو شخص لعب كرورة و اعتزل<br />مش مجرد اتفرج على كورة<br />لما يبقى عندنا ستات عندهم خبرة في ( لعب) الكورة زي حماده و شوبير. مش مجرد متفرجات<br />ساعتها ممكن يبقى عندنا ( معلقات )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112729/http://www.20at.com/article2.php?sid=342"

