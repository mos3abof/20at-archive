text = "تخيل ان السيد المرشد جمع جميع الفضائيات واعلن على الجميع انة تم فك وحل جماعة الاخوان وخلاص هيروح يقعد فى بيتهم وان نشاط الجماعة انتهى وكل واحد يشوف حالة وانة سيتفرغ لرعاية احفادة وعلى الجميع ان ينصرفوا الى اشغالهم خلاص بح مفيش اخوان مسلمين تانى فى بر مصر<br />كيف سيكون رد الحكومة المصرية ؟<br />هيتجنن طبعا<br />الامن مش هيلاقى شغلة ولا مشغلة ولا احد يعتقلة ولا احد يفرج عنة ومش هيعرفوا يترقوا ولا يرفعوا تقارير سيادية بنشاطهم ولا المؤمرات التى اكتشفوها<br />والحكومة هتجيب سبب من اين لقانون الطوارىء<br />والحكومة هتقول اية فى تداول السلطة والانتخابات وتصديها لمنع المتشددين من الوصول للحكم<br />الدولة هتنكشف لان شرعيتها قدام الغرب هى فى محاربتها للمتشددين الاخوان<br />اية رايك يا مرشد تضربهم مقلب وتعلن فك الجماعة<br />واللة هيحتاسوا<br />طيب جرب"
