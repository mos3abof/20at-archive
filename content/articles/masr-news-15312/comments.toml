subject = ""
author = "حمرا يا زخاري"
posted = "2010-02-15"
text = "ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــــ<br />الاسم: ممدوح زكى زخارى<br />العنوان: حقا انه رجل محترم أما انأ فخطير على الأمن القومي المصري كما تدعى على كذبا وزارة داخلية مصر<br />ليتنى كنت ممدوح اسماعيل و ليس ممدوح زكى زخارى المصرى الذى منعت من السفر خارج مصر من 11 مايو 1992 و حتى و قتنا هذا انتقاما منى بسبب زيارتى الى دولة إسرائيل لغرض العلاج الطبى الغير متوفر فى مصر و كل الدول العربية و أيضا قيامي بأداء مراسم التقديس بالقدس لكوني مسيحي مصري؟ يشرفنى حقا ان يكون لى شرف التعرف بالشخصية الهامة التى ساعدت على اخراج السيد ممدوح اسماعيل خارج مصر من صالة كبار الزوار ليخرجنى انا كمان؟ مستعد لدفع مليون دولار امريكى لاى شخص يساعدنى على الخروج خارج مصر و ليعتبرنى ممدوح اسماعيل ولست ممدوح زكى زخارى جرجس المصرى المسيحى القبطى الشريف و لست القاتل؟"
archived = "2010-02-16"
capture_url = "https://web.archive.org/web/20100216221038/http://www.20at.com:80/masr/news/15312-2010-02-14-12-39-14.html"

