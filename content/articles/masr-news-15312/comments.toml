text = "كلاب الثورة بقيادة جمال عبدالناصر الذين دمروا البلد وخربوها وسرقوها واغتصبوها بالتعاون مع الاخوان المسلمين في لعبة العسكر والحراميه الشهيرة<br />وكانت النتيجة احتلال سيناء بالكامل<br />يا خسارة مصر الملكية ويا خسارة الازهر الشريف<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
