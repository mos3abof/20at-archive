order = 1
subject = "امسك حراااااااااامي"
author = "mozhel"
posted = "2006-09-02"
text = "قد يلتقي الإنسان منا شخصا ما لم يره منذ أعوام طويلة صدفة، وقد نتذكر شكله ولا تسعفنا الذاكرة لمعرفة اسمه، وهذا أمر طبيعي يحدث كثيرا مع تقدم العمر وكثرة مشاغل الحياة وغياب اللقاءات المتكررة بين الناس. أما أن يحاول الشخص منا استرجاع معلومة قد قرأها أو سمعها منذ وقت قصير ولا يستطيع تذكرها، فهنا يتساءل الإنسان لماذا لا أتذكر؟ لماذا أصبحت كثير النسيان؟<br />ولمعرفة أسباب النسيان، لا بد من الرجوع إلى العقل وفهم كيفية عمله وتخزينه للمعلومات ومن ثم استرجاعها عند الضرورة. والنسيان هو عدم المقدرة على استرجاع المعلومة المطلوبة في الوقت المناسب، وبالتالي فإن أفضل تعريف للتذكر هو استرجاع المعلومة عند الحاجة إليها. أما الذاكرة وكيفية عملها فقد احتار العلماء والباحثون في معرفة ذلك بالرغم من آلاف الأبحاث التي قاموا بها إلا أنهم عجزوا أمام قدرة العقل البشري الخارقة على الحفظ، حيث إن العقل يحفظ كل ما يأتيه عن طريق الحواس الخمس إضافة إلى قدرته على التخيل والابتكار والتفكير وبالتالي استحداث أفكار ومعلومات وصور جديدة.<br />يصاب الكثير بالقلق من عدم تذكرهم للمعلومات ويطرح الخوف في قلوبهم من أن يكونوا مصابين بأمراض مزمنة كالزهايمر أو الخرف المبكر بلا داع، فاستنادا للاستنتاجات السابقة الذكر قد تكون الأسباب بسيطة ومن السهولة علاجها، ومنها عدم تركيز المعلومة في الذهن، فالمعلومات في العقل بحاجة إلى تثبيت وتركيز حتى لا تضيع. تزاحم المعلومات وعدم ترتيبها يلعبان دورهما، فتدفق كم كبير من المعلومات في ذات الوقت مع عدم ترابطها يؤدي إلى تشابك الأفكار وبالتالي صعوبة استرجاعها. ومما قد يزيد الطين بلة كثرة المسؤوليات والإرهاق البدني الذي يؤثر أيضا على قدرة الإنسان الذهنية. وتشترك كل هذه الأمور معا في نقطة عدم التركيز.<br />ومن الأسباب المؤثرة أيضا عدم ربط المعلومات بالأخرى المشابهة لها، فالعقل البشري يحمل الآلاف بل الملايين من المعلومات التي تشترك في معطيات معينة، لذا قد يحدث التباس في الأمر عند استحضار المعلومة المطلوبة بأخرى خاطئة، ويحتاج المرء إلى عمل ربط قوي ومحكم لكل معلومة مع التصنيف الذي يتبعه. كما أن عدم تثبيت المعلومة بالكتابة يلعب دوره في عدم ترسيخ المعلومة، فكلنا نتذكر أيام دراستنا المدرسية كيف كان يطلب منا تكرار كتابة الكلمات والجمل عشرات المرات حتى ترسخ في أذهاننا، وينطبق ذلك في الوقت الحالي على تدوين المواعيد والمعلومات العامة، حيث ان لهذا الفعل أثرا رائعا على قدرة التذكر والاستحضار.<br />وبالإضافة لما سبق يوجد الكثير من الأسباب التي لا يهتم بها الإنسان مثل النظام الغذائي والصحة العامة، فقدان الأمن والأمان، غياب الراحة في المنزل أو العمل، الاستخفاف بالأمور، الاستعجال في التفكير، الصدمات النفسية، كثرة المسؤوليات وعدم الراحة، الإجهاد الجسدي والعامل الوراثي، والتقدم في العمر.<br />لقد قام العلماء والأطباء بالكثير من الأبحاث العلمية للوقوف على طرق علاج النسيان ولقد ألفت المئات من الكتب حول هذا الموضوع، ومع كل ذلك تظل بعض الأمور البديهية البسيطة من الأمور المهمة الأساسية لتقوية الذاكرة.<br />ومن هذه الأمور، الربط الذهني، الذي يعتبر من العمليات التلقائية التي يقوم بها العقل البشري، حيث انه من الممكن تذكر شخص ما بمجرد استنشاق رائحة عطره أو سماع كلمات أغنية كان يرددها مثلا. وباستغلال هذه الموهبة للعقل يستطيع المرء منا ربط المعلومة بأمر ما مرتبط بها، لذلك نستطيع الاستفادة من هذه العملية لتثبيت المعلومة وبالتالي تقوية الذاكرة، أما الكتابة وتدوين المعلومات فتساعد أيضا على ترسيخ المعلومة في ذهن مدونها، والدليل على ذلك أن المواظبين على تدوين مواعيدهم يجعلهم ذلك يتذكرونها دون العودة إلى ما كتبوه، فهذه الطريقة مع مرور الأيام تساعد كثيرا على التذكر التلقائي.<br />اتخاذ الأعداد وسيلة للمساعدة على التذكر طريقة فعالة ومثمرة أيضا، فعند الخروج من المنزل أو العمل يمكن حصر الأمور التي ينبغي أخذها معك بعدد رقمي، ورسخ او رسخي هذا العدد في الذهن وعند الخروج سيتأكد الشخص من أخذ كل الأشياء للوصول إلى العدد المطلوب. الغذاء من الأمور المهملة في حياتنا اليومية بالرغم من أهميته الكبرى، فتكاد المكونات الغذائية السليمة تنعدم في ما نتناوله، فمع انتشار مطاعم الوجبات السريعة المتماشية مع إيقاع عصرنا، بدأت الأعراض الصحية والعقلية في الانتشار، والسبب في ذلك كما أثبتت الدراسات هو نقص أحماض أوميغا 3 التي لها دور أساسي في تغذية الدماغ، وبالتالي يؤدي نقصها إلى ضعف عام بالذاكرة. وتتوفر هذه الأحماض في الأسماك والمكسرات كالجوز والزبيب، والبيض، كما ينصح بتناول الخميرة لما تحتويه على مركبات فيتامين «بي» المركب وفائدته لتنشيط الذاكرة أيضا. وما ينطبق على الغذاء ينطبق على المحافظة على صحة الجسم العامة وراحته وبخاصة النوم، حيث تشير الدراسات إلى أن النوم من حاجات العقل وليس الجسد، فمن الممكن أن يجلس الشخص ولا يحرك عضلاته طوال اليوم، لكن العقل يعمل جاهدا ولا يكف عن التفكير وحفظ ما تراه العين وتسمعه الأذن، وبالتالي يحتاج إلى فترة لا تقل عن 8 ساعات يوميا من الراحة للقيام بهذا الجهد الجبار. كما أن المواظبة على الرياضة و البعد عن الإرهاق والخلافات المرهقة نفسيا وبدنيا من الأمور المهمة للمحافظة على الصحة البدنية العامة التي هي أساس لعمل العقل بطريقة سليمة.<br />أما أساسيات العلاج فتنحصر في التركيز و الانتباه والتوجه الجاد عند تلقي المعلومة وعند حفظها، محاولة الابتعاد عن المسؤوليات الكثيرة التي تسبب حالة من الارتباك النفسي والإجهاد الجسدي والذهني، وهذه المشكلة تخلق تربة مناسبة للنسيان. كما أن التنظيم في أمور الحياة وترتيبها يؤدي إلى حالة من الهدوء والراحة في إدارتها، الأمر الذي ينعكس إيجابا على قوة التفكير وقوة الذاكرة. وتفادي الأسباب الأنفة الذكر والبحث عن الهدوء والأمن والأمان، المطالعة حتى آخر العمر، المحافظة على الصحة العامة والنشاط البدني، وكذلك الابتعاد عن الأغذية الدسمة المليئة بالدهون المضرة بخلايا الدماغ، والتدخين والمشروبات الروحية، والإكثار من تناول الخضروات والفاكهة المليئة بالفيتامينات الطبيعية المفيدة والمغذية للجسم، وكما يقال دائما العقل السليم في الجسم السليم.<br />التاريخ : 02/01/2006<br />امممممممممممسك حرررررررررامي<br />صح ولا ايه يا استاذه رانيا الشاعر ؟؟<br />مش عيب بردوا ؟؟"
archived = "2006-11-02"
