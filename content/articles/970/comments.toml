subject = "عجبنى تعليقك يا مصرى و كلمه للشمحطجى"
author = "نيفين"
posted = "2006-01-08"
text = "حلو تعليق المصرى اللى بعنوان بلا وكسه لان فعلا احنا ف وكسه عامه شامله الجميع برا و جوا<br />و بالنسبه للشمحطجى يا ريت ترحم نفسك و ترحم الموقع و ترحمنا من تعليقاتك النيره اللى اسلوبها ...... و لا بلاش احنا ف اسام مفترجه<br />و ان شاء الله تروح امريكا و ترجع تقول ان حسحس و حسحس انا"
