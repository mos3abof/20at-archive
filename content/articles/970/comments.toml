order = 0
subject = "علىَ النعمة ...راجل أهبل !!"
author = "الشمحطجى"
posted = "2006-01-07"
text = "يا عم ظواهرى حل بقى عنا بقى الى يخرب بيتك كفايا إلى عملته ...<br />بيتهيألى ان الاسلام رجع خمسوميت سنة لورا بسبب الظواهرى و شلته المهوسة..<br />قولى كده و رحمة ابوك يا شيخ \" إنت عملت إيه ؟\" و إلى عملته ده فاد ولا ضر الاسلام و المسلمين..<br />يا راجل دا أنا كنت ناوى أخلع على امريكا ونشوف الحريم و النسوان البيضا ...لولاش أم العملة المجنونة بتاعة 11 سبتنمبر دى وقفت المراكب السايرة...<br />و أدينى قاعد اهو لا شغله ولا مشغلة...<br />قفلتها علينا ربنا يقفلها فى وشك روح يا بعيد<br />زائد كمان إلى مستغربله إن البنى آدمين إلى فى تنظيم الهبل إلى بيقولو عليه القاعدة كلهم اتقبض عليهم عدا القرد إلى اسمه بن لادن و لحمار إلى اسمه الظواهرى و الله خايف يتكون الشرايط دى متصورة فى ال سى آى إيه و بيبخوها كل فترة علشان يلهو الناس و العالم بيها<br />زائد كمان انت مش ارتضيت لنفسك القاعدة ...مالنا إحنا و مالك .<br />يا عم حل عن قاعدتنا بقى ...الله يخرب بيت أمك يا شيخ<br />ربنا يهدك ...قادر يا كريم!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

