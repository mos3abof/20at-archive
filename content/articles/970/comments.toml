[[comments]]
order = 3
subject = "أقصروا يا معشر القاعدين"
author = "عجبالجرأة القاعدين!! الا تستحون ، تتخلفون عن الجهاد المأمور به شرعا ثم تستطيلون في أعراض المجاهدين ."
posted = "2006-01-07"
text = "أين أنتم وهم ، وقد فضلهم الله عليكم - يا معشر القاعدين - أفضالا كثيرة<br />أقرؤا : ( لاَّ يَسْتَوِي الْقَاعِدُونَ مِنَ الْمُؤْمِنِينَ غَيْرُ أُوْلِي الضَّرَرِ وَالْمُجَاهِدُونَ فِي سَبِيلِ اللّهِ بِأَمْوَالِهِمْ وَأَنفُسِهِمْ فَضَّلَ اللّهُ الْمُجَاهِدِينَ بِأَمْوَالِهِمْ وَأَنفُسِهِمْ عَلَى الْقَاعِدِينَ دَرَجَةً وَكُـلاًّ وَعَدَ اللّهُ الْحُسْنَى وَفَضَّلَ اللّهُ الْمُجَاهِدِينَ عَلَى الْقَاعِدِينَ أَجْرًا عَظِيمًا ،<br />دَرَجَاتٍ مِّنْهُ وَمَغْفِرَةً وَرَحْمَةً وَكَانَ اللّهُ غَفُورًا رَّحِيمًا)<br />وهل تظنون -يا معشر القاعدين - أن الامة ستنال العزة بدون جهاد أهل الكفر والزيغ ؟<br />هيهات ، والله إنكم لفي وهم كبير .<br />فتصدقوا على أنفسكم بكف السنتكم عن أعراض المجاهدين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

[[comments]]
order = 4
subject = "سامي الفلسطيني وصل"
author = "سامي"
posted = "2006-01-07"
text = "مساء الخير للجميع اعجب من ذلك التافه الذي يريد السفر لامريكا لرؤية اللحم الابيض فهذا ان دل على شيء يدل على مدى الانحطاط الذي وصل اليه الشباب العربي اليوم في هذا الزمن الامريكي الذي اقتحم كل الازمنه<br />واقول للدكتور ايمن ربما معك حق في عدم دخول البرلمانات العربية وعلى ما اعتقد ان هذا هو فكر سيد قطب بعينه رحمه الله الذي كان يدعو الى التغير من خلال ازالة الانظمة ومن ثم تحكيم شرع الله في الارض<br />ولاكن يا شيخ ايمن ما تفعله القاعدة من تفجير مساجد في العراق هل هذا من الايلام في شيء وان كنتم لستم الفاعلين لمذا لم تنفي ذلك بل وتدين ذلك كذلك ما حدث في فنادق عمان من قتل لابرياء<br />انا اتفق معك بان الدخول للبرلمان لا يوصل الامة الايلامية الى ما تصبو اليه من دولة كريمة وعزة وكرامة وعدالة اجتماعية<br />انا ارى تغير هذه الانظمة من خلال الثورة الجماهيرية لان الجماهير هي اداة التغير في كل المجتمعات اما القوة لا تنفع واثبتت فشلها ولكن ثورة الشعوب لاتقف امامها اي قوة وهذا المنطق اثبته التاريخ في الثورة الايرانية وفي جورجيا وفي رومانيا لا احد يستطيع ان يقف امام رغبة الجماهير بالتغير<br />انا معك ان هذه الانظمة مع اميركا واسرائيل وجهين لعملة واحدة وان الخلاص من واحدة يعني موت الاخرى وارى ان كل ثورة يجب ان يسبقها الايمان ثم الوعي ثم الثورة حتى نستطيع ان نغير في مجتمعاتنا وهذا كله يحدث من خلال وحدة اقطاب الحركة الاسلامية في العالم او على الاقل ان يتفقوا على التعاون وان يعتمدوا على منطق التكامل ،،، بعكس ما هم عليه اليوم ممزقين كل منهم يشوه الاخر ويحارب الاخر ليل نهار ،،، فحولوا التكامل الى لغة التامر والعنصرية والجري وراء الكراسي واصبحوا ولالاايف الشديد لعبة بين ايدي قادة النظام العالمي الجديد واصبح اعداء الامة يستغلوا من يدعي الوسطية فيهم لضرب المتمسك بثوابت هذه الامة<br />اسال الله التوفيق للجميع<br />اخوكم سامي الفلسطيني<br />samii666@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

