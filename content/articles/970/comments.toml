subject = "خدعة"
author = "محمد علي"
posted = "2006-01-08"
text = "أقسم بالله العظيم<br />أقسم بالله العظيم<br />أقسم بالله العظيم<br />مفيش حاجة اسمها قاعدة ولا أسامة بن لادن و لا زرقاوي و لا غيره<br />خدعة قديمة من أيام حكاية لافون<br />و بالنسبة للأخ بتاع اللحمة البيضا... علشان نيتك السودا أمريكا انضربت و وقف حالك<br />ياريت تفكر بأه في نسوان إسرائيل<br />و جزاك الله على قدر نيتك"
