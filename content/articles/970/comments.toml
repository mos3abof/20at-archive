[[comments]]
order = 24
subject = "المسلم تانى ؟؟؟؟؟"
author = "الفرعون"
posted = "2006-01-18"
text = "انا قراءت الموقع بتاع الولايات المتحدة الاسلامية وعندى بعض التعقيب<br />1- الكلام فى مجملة ليس بجديد بل على العكس كشكل عام اتخدتة بعض الدول مثل السعودية كنظاما لها<br />2-اسرف الموقع فى الحديث عن مواضيع تافهة مثل تقسيم البلاد الى دويلات تسمى محلات وقد انتظرت ان اخرج منها بفكرة نيرة فلم اجد بل انها خارج حساب الزمن وليس لها اى اهمية<br />3-الانظمة الاقتصادية تكاد تحاكى افكار المدينة الفاضلة فلاتوجد انظمة حسابية تكافىء الدول التى ستتعامل معها ولا توجد خطة واضحةلالية التضخم التى ستواججها ولا توجد اطار للقضاء على البطالة مثلا بمعنى انة ليس هناك خطة من اصلة<br />4-اين النظام التعليمى مثلا واين النظام الصحى واين معاملاتك مع الغرب واين النظام العسيكرى<br />من الاخر انا قلت عليك جاهل ........... اسف جدا انتا مش جاهل انتا سلفى بتحلم وبتخرب الدنيا فى احلامك مشكلتكم انكم فاقدين الادوات كل اللى بيحركم كتب قديمة وعقلية عفا عليها الزمن<br />ياخسارة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

[[comments]]
order = 25
subject = "معلهش يا فرعون"
author = "محمد علي"
posted = "2006-01-20"
text = "ياريت تتخلى عن النرفذة اللي إنت فيها دي<br />الموقع صراحة قوي و يرسم صورة مكتملة للدولة الإسلامية التي ننشدها<br />و كمان عايز أقولك حاجة...<br />أولا : أنا أشك في وجود حاجة اسمها القاعدة<br />ثانيا: المسئول عن كل البلاوي اللي بتحصل هي امريكا و المشروع الصهيوني<br />ثالثا: أنا حاسس فيك نبرة تعالي على المسلمين كلهم مش مجرد \" السلفيين\" بس<br />و سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

[[comments]]
order = 26
subject = "تانى الاستاذ محمد على"
author = "الفرعون"
posted = "2006-01-21"
text = "نبرة تعالى ازاى يعنى ؟؟؟؟؟؟؟ انا مسلم<br />عاوز تتكلم عن الاسلام ........ حاضر<br />1- مافيش حاجة اسمها جماعات اسلامية دى بدعة حزر منها الرسول<br />2- منهاج الجماعات الاسلامية يقوم اولا على القبض على السلطة ثم ماتيسر<br />4- حتى الموقع اللى انتا حبيتة فى الحقيقة هوا مدينة فاضلة لم يضع فى اعتبارة ان الناس اللى ساكنة جايز ميعجبهاش الكلام دة ...... لا هوا كدة بالعافية<br />5- المدينة الفاضلة لطالبان وهوايل الناس فى حكمها دليل واضح<br />اخيرا انا معنديش تعالى لكن الحقيقة انا بقررررررررررف من شوية الناس اللى عاوزين السلطة وبيتمحوا فى الدين<br />حتسيبوا الدين فى حالة غصب عنكم وروحوا دورلكم على حاجة تانية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

