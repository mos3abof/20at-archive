subject = "الكاسر"
author = "محمد"
posted = "2006-09-29"
text = "في البداية الله ينصر اخواننا المجاهدين<br />والله يهدي الشباب للجهاد في سبيل الله<br />والوعد الصادق مني ومن كل مسلم ان لن نكل ولا نمل حتى نعلي كلمة لا اله الا الله<br />محمد رسول الله ونحطم كل شخص متبوش في البلاد العربيةونقضي على الفساد في بلادنا ونكون متكاتفين ونعد ما استطعنامن قوة ورباط خيل لكي نرهب به عدونا وعدو الله كمااخبرنا الله تعالى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"
