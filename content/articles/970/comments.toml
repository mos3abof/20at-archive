[[comments]]
order = 19
subject = "وماهو هدفك انتا يامسلم ؟"
author = "الفرعون"
posted = "2006-01-15"
text = "لو عاجبك قوى اسامة بن لادن بسرعة روح عندة<br />بس ارجوك اوعا ترجع<br />وبالنسبة للدول العربية واضح انك سلفى ومش فاهم حاجة زى اسامة بن لادن وعندى بس سؤال واحد ليك<br />فى اى جزء من القران او السنة امر اللة المسلمون بقتل العزل الامنيين من غير المسلمين اقوللك او حتى المسلمين<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

[[comments]]
order = 20
subject = "خطابي للمسلم"
author = "مسلم"
posted = "2006-01-15"
text = "الفراعنة وغيرهم من الكفرة لا يعنوني في شئ .<br />خطابي للمسلمين والمسلمين فقط.<br />وهمي كمسلم -بناء دولة الاسلام الواحدة التي يتفيأ ظلالها كل مسلم.<br />ولن تكون هذه الدولة الا بازالة الطواغيت."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

[[comments]]
order = 21
subject = "فين الرد؟"
author = "الفرعون"
posted = "2006-01-16"
text = "زى ماكنت متوقع ردك يامسلم مزيف والحقيقة انك ارهابى بلاش ارهابى لحسن تزعل اقصد مجرم عديم الضمير لاتعرف عن الاسلام الا كلمتين فقط اللى اكيد علموهملك شيوخك المزيفين ............<br />عارف طبعا انك معندكشى رد سؤالى<br />والسؤال التانى ليك وممكن تستعين بصديق اقصد مجرم قديم السؤال بيقول<br />ماذا تعرف عن الجهاد؟<br />لو تحب ممكن احزفلك اجابتين او احذف السؤال كلة علشان ممكن تكون مبتعرفشى تقرا<br />لكن اكيد اسيادك معلمينك ازاى تكفر الناس المسلمة ؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

[[comments]]
order = 22
subject = "تانى للمسلم المزيف ؟"
author = "الفرعون"
posted = "2006-01-16"
text = "قلت همك بناء الدولة المسلمة الواحدة .........<br />ودة كلام كبير قوى طيب ممكن سيادتك تعرفنا انتا خريج اية ؟<br />جامعة ولاصنايع اية خبراتك فى الحياة ؟ بتشتغل ولا صايع ؟<br />وياترى احلام الزعامة دى عندك من زمان؟<br />صدقنى انتا اتفة من انى ارد علية لكن ياجماعة مع الاسف دة النموذج اللى عاوز يحكمنا ميعرفشى حاجة الا الجهاد لو قلت لة اية نظريتك الاقتصادية او السكانية او المالية او اى حاجة فى الدنيا حيبلم لانة ميعرفشى الا تكفير الناس والكلام عن الطواغيت ؟<br />طيب علشان تحكم حد لازم تتعلم فنصيحة روح اتعلم واشتغل اى شغلانة ودة فى حد زاتة خدمة للاسلام اما الكلام الفاضى اللى مايين بية دماغك فانا ممكن اناقشاسيادك فية علشان الغلط فية كتير قوى ومشكلتنا كمصريين مع كل اسف ان 80% من الشعب المصرى لايعرف عن الاسلام الكثير ولما بييجى سيرة حاجة فى الاسلام هوا ميعرفاش بيخاف يقاوح لحسن يرتكب ذنب ودة اللى الجماعات الارهابية اللى البية منهم بيستغلوة<br />احنا ياسادة بندور على التغيير بس اكيد مش بندور على شوية جهلة متخفيين ورا ستار الدين<br />ولا اية ؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

