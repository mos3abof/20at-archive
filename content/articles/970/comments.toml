[[comments]]
order = 30
subject = "لايجوز التجاوز"
author = "رائد بغدادي"
posted = "2006-06-22"
text = "أما يكفيكم عارا فوق عاركم والتخلف عن الجهاد الا التهجم على المسلمين وأعراضهم ويلكم من الله يوم لاينفع لامال ولابنون<br />(لاَّ يَسْتَوِي الْقَاعِدُونَ مِنَ الْمُؤْمِنِينَ غَيْرُ أُوْلِي الضَّرَرِ وَالْمُجَاهِدُونَ فِي سَبِيلِ اللّهِ بِأَمْوَالِهِمْ وَأَنفُسِهِمْ فَضَّلَ اللّهُ الْمُجَاهِدِينَ بِأَمْوَالِهِمْ وَأَنفُسِهِمْ عَلَى الْقَاعِدِينَ دَرَجَةً وَكُـلاًّ وَعَدَ اللّهُ الْحُسْنَى وَفَضَّلَ اللّهُ الْمُجَاهِدِينَ عَلَى الْقَاعِدِينَ أَجْرًا عَظِيمًا ،<br />دَرَجَاتٍ مِّنْهُ وَمَغْفِرَةً وَرَحْمَةً وَكَانَ اللّهُ غَفُورًا رَّحِيمًا)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

[[comments]]
order = 31
subject = "ولا يغتب بعضكم بعضا"
author = "السلام على من اتبع الهدى :"
posted = "2006-07-10"
text = "قبل ان ابدا كلماتى اود اعرفكم بانى لست مع الظواهرى و القاعدة او ضدهما و لكننى مع الحق والحق يجب ان يقال.<br />بداية اود التعليق على الاخ الذى كتب الموقع كيف تقول فى حقة انة غير محترم وهل الاحترام هو شتم الناس و سبهم:<br />ثانيا:الاخ الكريم محرر الموقع الذى لم يعجبة قول الظواهرى بان برفيز مشرف خائن اقول له انه بالفعل خائن للاسلام و المسلمينهل نسيتم انة فتح اراضية لامريكا لضرب افغانستان المسلمةمقابل شطب الديون الامريكية...نهاية فانا اصفق لكل من يستطيع ان يسقط جنود امريكان مهما كانوا فانا احب الظواهرى ان كان يقتل الجنود الامريكان فقط وان كان يقتل العراقيين فانا اكرهم و لم يثبت انهم يقتلون العراقيين والى ان يثبت ذللك لا يجوز لاحد تسميتهم بالارهابيين...وعلى القاعدة نفى هذى التهم فورا<br />واخيرا الاخ الذى كان يريد ان يرى اللحمة البيضاء احمد اللة و اشكر القاعدة الذين ابعدوك عن الذنوب و اتقى اللة يا اخى.<br />و اسلام عليكم و رحمة اللة و بركاتة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

