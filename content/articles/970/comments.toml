[[comments]]
order = 12
subject = "الكذب على انفسنا؟"
author = "الفرعون"
posted = "2006-01-12"
text = "احنا هما احنا ؟<br />غاويين كذب على نفسنا ........... محترفين كذب على نفسنا<br />الراجل اللى قال عاوز يروح امريكا يتفرج على اللحما البيضا اتبهدل من كل واحد .لية ؟<br />علشان كل واحد مش عاوز يسمع كلام غير كلامة وراى غير رائية كلكم بقيتوا شيوخ واللى يدور وراكم يلاقيكم زفت ؟<br />ربنا سبحانة وتعالى حط الجنة والنار وقال لنا اختاروا<br />يعنى فية جنة ونار فية صح وفية غلط<br />وعلى حسب مابفهم ان الاسلام جاء للهداية مش للشتيمة<br />الراجل دة لو عاوز يروح للحمة البيضا حيروح ومحدش حيمنعة وبدل مانقول ان اللحمة البيضا دى بتشجع بوش على حصارنا اقتصاديا وانها ضد كل ماهو مسلم بنشتمة<br />مع الاسف انتم مفهمتوش حاجة من الاسلام<br />الاسلام ياحضرات مش شتيمة والا روحوا للغير محترم ايمن الظواهرى وشلتة السلفية ولعوها حريقة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

