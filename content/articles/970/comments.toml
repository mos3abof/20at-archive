subject = "إلى جميع من علق على الموضوع"
author = "Microsoft Corporation"
posted = "2006-07-27"
text = "أنا أرى إنه هدف الجميع فقط تضليل رأي الآخر و أثبات أن رأيه هو الصحيح.<br />الرجاء أنا يكون الحوار هادف (يعني الجميع يضع في حسبانه احتمال كون وجهة نظره خاطئة و يناقش على هذا الأساس) و ليكون الهدف الأسمى الوصول إلى الحقيقة.<br />و كمان بالمناسبة هذه الصفحة وضعت للتعليق و ليس المحادثة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

