text = "أنا آسف جدا جدا يا فرعون<br />أنا قريت تعليقك أول مرة و مفهمتوش<br />بس السخرية في ىخر تعليقك كانت مستفزة أوي<br />أرجوك سامحني<br />أخوك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

[[comments]]
order = 17
subject = "ما هو هدفك أيها المسلم ؟"
author = "مسلم"
posted = "2006-01-14"
text = "سوالا أوجهه اليك أيها المسلم ، فما أقصى ما تتمناه أيها المسلم في الدنيا ؟<br />أظن بعد التفكير أن المسلم يتمنى أن يكون جميع المسلمين في بلد واحد ، لا تحدهم حدود ولا تمنعهم فواصل<br />أنها دولة الاسلام الواحدة من اندونيسا شرقا الى المغرب غربا ومن الصين شمالا الى السنغال جنوبا.<br />تصور يا أخي أن كل هذا هو بلدك -أيها المسلم.<br />كيف نحقق هذا؟<br />نحقق هذا بأن نتوحد في الهدف ، فالهدف هو اقامة دولة الشريعة ، الستم معي ؟<br />فإذا اتفقنا أن الهدف ، هو إقامة دولة الشريعة ، دعونا نتساءل ، ماهي المعوقات أمام تحقبق هذا الهدف؟؟<br />إن أكبر عائق أمام توحد المسلمين هم حكام المسلمين او لنقل الانظمة الحاكمة -الظلمة، الطواغيت أو سمهم ما شئت.<br />ولكن هذه الانظمة يدعمها الكفار الامريكان الاوروبيين ، الصهاينة وغيرهم.<br />يتضح من هذا أن انجع الوسائل للوصول الى هدفنا المشترك -اقامة دولة الشريعة التى يتفبأ ظلالها كل مسلم - هو محاربة الكافرين واعوانهم من الظلمة.<br />تبين جليا أن القاعدة -بقياة الشيخ أسامة -نصره ربي وحفظه هو ومن معه من المجاهدين أقرب الناس الى تحقيق هدفنا المشترك .<br />وهذا لا ينفي أن ثمة وسائل أخرى للوصول الى هذا الهدف ولكن الجهاد اعلاها وانجعها.<br />فإن كنت تريد الخير لامة الاسلام ، فاسلك درب أسامة ، فإن عجزت فحارب انظمة الظلم والجور ما استطعت ، وان ابيت فاكفف لسانك عن المجاهدين فهم -والله الطليعة الرواد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

