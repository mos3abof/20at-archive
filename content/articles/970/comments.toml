[[comments]]
order = 7
subject = "بلا وكسة"
author = "مصـegyـــري"
posted = "2006-01-07"
text = "للأسف فعلا الظواهري اثبت ان تنظيمه غير قادر على استيعاب فكرة ( ميادين الجهاد المختلفة )<br />و حسب ان الجهاد هو كلاشنكوف في الدراع و بازوكة عالكتف<br />و اعجب ايضا لتعليق الاخ اللي وصفنا بالقاعدين ( على اعتبار ان هو من الواقفين )<br />لأ يا حج ايمن .. الاخوان لم يصلوا الى الـ88 مقعد اللي مش عاجبينك دول الا بجهاد قد يوازي جهادك و قد يفوقه<br />و اذكر هنا ذالك الرجل الكبير في الاربعينيات الذي تبدوا عليه امارات النعمة ( راجل بيه كده ) وهو واقف اما احدى اللجان و ماسك يافطه صغيرة للدكتوره مكارم ... من ساعت فتح اللجان الى غلقها<br />كل دوره كان هذه اليافطة و لسان لاهج بالذكر الهامس<br />الا يعتبر هذا الرجل من المجاهدين<br />او ذالك الفتى الصغير الذي رصدته عدسات الجزيرة و قد اخذته الحميه عند تقطيع لافته للإخوان, وحده و سط انصار المرشح المنافس ليهتف \" الله اكبر و لله الحمد \"<br />حتى جرا وراءه رجل في سن جده ليضربه و يخرسه<br />الم يكن هذا مجاهدا<br />ام لانه فقط مخالف لك في اسلوب الجهاد يكون من القاعدين يا حج ايمن ؟؟<br />للأسف لسالنا كتير عشان نعرف نختلف بدون ان نتخلف<br />( بالمناسبة .. الكابتن اللي عايز يروح يتفرج على اللحمه البيضا ... الهي يا رب تروح تتقلب هناك .. و تعيش في هارلم الزنوج لحد اما تتربى و تقولهم\" البنطلون لأ.. البنطلون اه\" .. وترجع تبوس في تمثال نهضة مصر )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

[[comments]]
