posted = "2006-01-07"
text = "مساء الخير للجميع اعجب من ذلك التافه الذي يريد السفر لامريكا لرؤية اللحم الابيض فهذا ان دل على شيء يدل على مدى الانحطاط الذي وصل اليه الشباب العربي اليوم في هذا الزمن الامريكي الذي اقتحم كل الازمنه<br />واقول للدكتور ايمن ربما معك حق في عدم دخول البرلمانات العربية وعلى ما اعتقد ان هذا هو فكر سيد قطب بعينه رحمه الله الذي كان يدعو الى التغير من خلال ازالة الانظمة ومن ثم تحكيم شرع الله في الارض<br />ولاكن يا شيخ ايمن ما تفعله القاعدة من تفجير مساجد في العراق هل هذا من الايلام في شيء وان كنتم لستم الفاعلين لمذا لم تنفي ذلك بل وتدين ذلك كذلك ما حدث في فنادق عمان من قتل لابرياء<br />انا اتفق معك بان الدخول للبرلمان لا يوصل الامة الاسلامية الى ما تصبو اليه من دولة كريمة وعزة وكرامة وعدالة اجتماعية<br />انا ارى تغير هذه الانظمة من خلال الثورة الجماهيرية لان الجماهير هي اداة التغير في كل المجتمعات اما القوة لا تنفع واثبتت فشلها ولكن ثورة الشعوب لاتقف امامها اي قوة وهذا المنطق اثبته التاريخ في الثورة الايرانية وفي جورجيا وفي رومانيا لا احد يستطيع ان يقف امام رغبة الجماهير بالتغير<br />انا معك ان هذه الانظمة مع اميركا واسرائيل وجهين لعملة واحدة وان الخلاص من واحدة يعني موت الاخرى وارى ان كل ثورة يجب ان يسبقها الايمان ثم الوعي ثم الثورة حتى نستطيع ان نغير في مجتمعاتنا وهذا كله يحدث من خلال وحدة اقطاب الحركة الاسلامية في العالم او على الاقل ان يتفقوا على التعاون وان يعتمدوا على منطق التكامل ،،، بعكس ما هم عليه اليوم ممزقين كل منهم يشوه الاخر ويحارب الاخر ليل نهار ،،، فحولوا التكامل الى لغة التامر والعنصرية والجري وراء الكراسي واصبحوا وللاسف الشديد لعبة بين ايدي قادة النظام العالمي الجديد واصبح اعداء الامة يستغلوا من يدعي الوسطية فيهم لضرب المتمسك بثوابت هذه الامة<br />اما لشباب هذه الامة ذكور واناث واخص بالذكر شباب مصر الحبيبة اقول النالي انصحكم بالقراءة فلا تتركوا القراة الا لما هو اهم ولا تتركوا ما هو اهم الا لتقراو وتعلموا جميع العلوم التقنية حتى تتعرفوا على اسباب وعوامل قيام نهضة اسلامية في هذا العالم يسجلها لكم التاريخ بحروف من نور<br />اسال الله التوفيق للجميع<br />اخوكم سامي الفلسطيني<br />samii666@hotmail.co<br />07/01/2006"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125735/http://www.20at.com/article2.php?sid=217"

