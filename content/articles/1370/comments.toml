author = "نا احمد عبدالرحمن الذبحاني من اليمن محافظة عدن اقول وبكل صراحة وجرئة لم اسمع ابدا شعر افضل من الشاعر الكبير العظيم نزار قباني وارجو من الجميع بعدم التلفض علية بأي كلام وارجو منكم ان ترسلو لي جميع اشعارة إلى بريدي"
