[[comments]]
order = 2
subject = "To hhhh"
author = "a7et deek el baraber mesh wazeefet el banat. homma zayyak 3andohom mozakra w' emte7anat, w' ehtemamat w' 7ayat'hom ye3ishooha, w' ghaleban homma motafaweqeen 3annak fel derasa, w' azka mennak bekteer. enta mesh ahamm 7aga fi 7ayat'hom. ekbar ba2a w'khalleek ragel badal me teb2a metdalla3 keda. 3ala fekra, ana mesh bent, ana ragel w' ta7ammalt mas2ooleyyet ommi w' okhti lewa7di, wel mas2ooleyya khedma, mesh ra7a, lakennaha sharaf kebeer. mafeesh 7aga zay ennak teshoof el ebtesama 3ala wesh okhtak lamma tedalla3ha aw te3mellaha khedma. 7aga bel donya kollaha"
text = "salam"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154014/http://www.20at.com/article.php?sid=1606"

[[comments]]
order = 3
subject = "افهموا ليمكن يكون في مساواه"
author = "ستحيل يا بنات نتساوى معاكو مش عشان احنا احسن لا اننا غيركم وانتو غيرنا احنا لينا اختصاصات وانتو ليكو اختصاصات"
text = "اقلك على حاجه<br />بابا دايما بيدي اخواتي البنات مصروف اكتر مني عشان ميركبوش مواصلات زحمه ويركبو سي تي ايه<br />او مثلا لو كانوا عايزين يشربو يشتروا ميه<br />اما انا انت ولد اركب ميكروبص او ميني باص مش فارقه<br />تشرب من الكولدير تشرب من البحر انت ولد<br />في مقابل كده انا بخرج براحتي البنات طبعا مش برحتهم انا اروح اي حته لوحدي البنات لا<br />وكده. انا عايز افهمكم ان الولاد حاجه والبنات حاجه تانيه خالص<br />عبدالله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154014/http://www.20at.com/article.php?sid=1606"
