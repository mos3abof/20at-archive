text = "ومالة لما الشباب والرجالة يشوفوا قنوات اباحية - خلوهم يدردحوا ويعرفوا الدنيا ماشية ازاى - الشاب من دول بيدخل ليلة الدخلة على عروستة وهو مش عارف يتنيل يعمل اية وبيعتمد على شوية معلومات سمعها من واحد اكبر منة كلها غلط ومعلوماتة الجنسية صفر وبيبقى مرتبك ويمكن البنت اشجع منة<br />خلوا الشباب يتعلم ويعرف يعيش حياتة بعد ما يتزوج لانة مهما سمع ومهما اتشرح لة مش هيفهم حاجة<br />ولما بيعرف حياتة بتبقى مستقرة وسعيدة مش خيبة ولخمة ويتكسف ويحمر وشة ويبص الناحية التانية"
