author = "أم عبد الرحمن"
posted = "2006-02-23"
text = "في البداية أوجه شكري لموافاتنا بهذه المعلومات القيم.<br />ثانيا: لدي استفسار أود أن تجيبوني عليه<br />هل عملية تجميد الدواجن بعد ذبجها يضعف أو يقتل الفايرس. وعليه هل عند شراء الدجاج المجمد لا خطورة في تقطيعه وغسله قبل الطهي؟<br />الرجاء التفضل بارسال الاجابة على هذا السؤال الى عنوان بريدي الالكتروني. بالاضافة الى نشرها بشكل عام لكي يستفاد الجميع."
