order = 0
subject = "جهاز المناعة الضعيف"
author = "كوكى"
posted = "2006-02-19"
text = "اذا كانت المناعه ضعيفه جدا وعندها اصلا ازمه صدرية اىتكون حساسيه ما هى الوقاية الافضل س انا اشكو كثيرا من الصداع وكثيرا بسخنيه داخلية واشعر بالوجع من ناحية الرقبةوالظهر ومناعتى ضعيفه ماذا يكون الاصح<br />وابعث احترامى لكم بكل الموضوعات التى فسرتوها لنا بكل سهولة ولكم جزيل الشكر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113203/http://www.20at.com/article2.php?sid=466"

[[comments]]
order = 1
subject = "والله دي حكايه"
author = "sweet_princess"
posted = "2006-02-19"
text = "ماشاء الله احنا البلد الوحيده اللي لما تحصل فيها اي كارثه لازم يطلع علينا سيادته المسؤل ويقول ((الوضع تحت السيطره ماتخافوش ))وهو دا اللي بيجيبنا وراوعشان كده احنا شعب واعي وعارفين لما يتقال ان الموضوع تحت السيطره يبقى العالم دي ابتدت تهرج وان الموضوع خرج من ايديهم وبقى في رجليهم دا من ساعة ما طلعت اشاعةان انفلوانزا الطيور دخلت مصر من شهرين (ولو اني اشك انها اشاعه )<br />ماما منعت الفراخ والحمام والبط والوز من بيتنا نهائي لحد ماخلاص (اهئ اهئ ) هنموت على فرخه (((والنبي اللي عنده فراخ كويسه ومضمونه ها مش تايواني)))<br />يسلفني واحده ومايخافشي هرجعهاله قفص بحاله بس لما الفراخ تخف لان ماما منعتها في بيتنا خالص"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113203/http://www.20at.com/article2.php?sid=466"

