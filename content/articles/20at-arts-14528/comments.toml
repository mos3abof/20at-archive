text = "ومين افضل في زمانا دلوقتي نانسي عجرم ولا استاذة الجامعة , انا شايف نانسي افضل من حيث الشهرة والمستوي الاجتماعي وحب الناس والتاثير عليهم<br />مين افضل هيفاء وهبي ام دكتورة جامعة<br />انا شايف هيفاء وهبي لانها تسبب بهجة لمن يراها وتقدم فن بغض النظر عن اختلافنا في مضمون هذة الفن"
