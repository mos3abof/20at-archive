[[comments]]
order = 2
subject = "دبدوب اسلامي islamic Dabdoob"
author = "Dabdoob"
posted = "2006-03-26"
text = "تاني تاني تاني<br />استخدام الدين في البزنس اصبح متكررا جدا وبشكل مثير للاعصاب<br />تليفون اسلامي يؤذن<br />هاتف اسلامي للرد علي الفتاوي (اتصل الان)<br />دمية تنشد اناشيد اسلامية<br />عباءات وسجاجيد للصلاة<br />تليفزيون واقع اسلامي<br />بنوك اسلامية<br />تامين اسلامي<br />اغاني اسلامية<br />سينما اسلامية<br />رنات موبايل اسلامية<br />عروض ازياء اسلامية<br />وغدا نستمع الي راقصة اسلامية وربما فيلم سكس اسلامي!!!!<br />ارجو ان ننتبه الي هذا النوع من الاستغلال الديني واستخدام العاطفة الاسلامية وألا نندفع تجاه اي شيئ يحمل هذه الكلمة (....اسلامي) خاصة وان هذا اصبح ملحوظا جدا في الخارج وقد قرات عدة مقالات وبحوث في الصحف والمجلات الاقتصادية الاوروبية تتحدث عن فرص الاستثمار في هذا المجال ومن اشهرها مقالة (gaining the prophet's profits)<br />الله قد بلغت اللهم فاشهد<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145526/http://www.20at.com/article2.php?sid=616"

[[comments]]
order = 3
subject = "قدري أن قرأت التعليق"
author = "مسلمة"
posted = "2006-03-27"
text = "في بداية أحب أن اوضح اني من المستجدين على الموقع وانا عادة لا أقرا التعليقات لأن ليس عندى وقت بس قدري أني قرأت التعليق هذه المرة والمصبية أني لم افهم التعليقين الأوليين أهم استهزاء بالمبادئ الاسلامية أو تشجيع المسلمات على ارتداء الحجاب على العموم لو كانا استهزاء فان تعليقي سيكون من باب انكار المنكر (الاستهزاء) ولو كانا تشجيع على الحجاب فاللهم اعن صاحبا هذان التعليقان على طاعتك<br />\"إنما الأعمال بالنيات ولكل مرء ما نوى\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145526/http://www.20at.com/article2.php?sid=616"

[[comments]]
order = 4
subject = "ليش؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
author = "ابو اليمان"
posted = "2006-03-27"
text = "الحمدلله الذي من علينا بنعمة الاسلام واوضح لنا كل شئ في حياتنا حتى في لباسنا .ان شرط اللباس الاسلامي سواء للمرأة او الرجل معروف وهو الا يصف الجسد ولا يشف اي لا يرى ماتحته ....وما الجينز وهو لباس عمال المناجم اصلا والذي تم اختراعه لانه يتحمل اوساخهم وصعوبة تمزيقه عند العمل(يعني بيتحمل دعك)هذا الجينز الذي سموه اسلامي هو كغيره من المسميات التي انتشرت كالموسيى الاسلامية والرقص الاسلامي وما هو الا لفتنة المسلمين عن دينهم واقرا رد دبدوب الاسلامي السابق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145526/http://www.20at.com/article2.php?sid=616"

[[comments]]
order = 5
subject = "معاك حق يا كرميلنو"
author = "حمدي"
posted = "2006-03-27"
text = "انا عجبني التعليق بتاع كرميلنو<br />وصحيح مادام الزي ليه شروط ومواصفات ولكن ليس له هيئه معينه<br />يبقي بلاش نحبكها زياده عن اللزوم يعني مش لازم تبقي عبايه سوداء والحاجات الغريبه دي<br />وبالنسبه لكلام دبدوب عن ان بعض الناس بتستغل حب الناس للاسلام للترويج لاشياء لاجل اسباب اقتصاديه<br />انا شايف ان ده شيء ايجابياته اكتر من سلبياته وبيؤكد ان توجه الناس نحو الاسلام فرض علي المنتجين والمصنعين انهم ياخدوا احتياجات الناس دي في الحسبان<br />وفي التهايه الانسان عنده القدره علي التمييز في الاختيار وما حدش بيفرض علي حد انه يشتري حاجه او ما يشتريهاش<br />بس في الاخر ان عندي سؤال محيرني لالاخ كرميلنو اذا كان عندك وقت تجاوبني اكون شاكر ليك<br />انا فهت من كلام سابق ليك ان انت راجل سلفي<br />لكن هنا انت بتتكلم عن ظهور الوجه والكفيين وانا طبعا اؤيد هذا الراي لكن اليس هذا يتعارض مع كونك سلفي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145526/http://www.20at.com/article2.php?sid=616"

[[comments]]
order = 6
subject = "سلفي انا"
author = "كرميلينو"
posted = "2006-03-28"
text = "ارجع يا اخي حمدي لفتوى الشيخ بن عثيمين التي تقول ان النقاب مكرمة للنساء و ليس فرض و ان كثير من المنتفبات يكن سبب للفتنة اكثر من غير المنتقبات<br />فالنقاب سنه واضحة عن امهات المؤمنين و فرض عن الضرورة اذا كثر السفهاء و ارجع الى ايه سورة النور ( يا ايها النبي قل لازواجك و بناتك و نساء المؤمنين .... ) الى اخر الايه<br />و ارجع الى تفسير بن كثير لتعرف ان حكم النقاب مقيد و ليس على العموم و الشمول<br />و الادلة واضحة و كثيرة<br />و شكرا و السلام عليكم و رحمة الله و بركاته<br />نلتقي بعد الفاصل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145526/http://www.20at.com/article2.php?sid=616"

[[comments]]
