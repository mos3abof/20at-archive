[[comments]]
order = 0
subject = "حللوه"
author = "كرميلينو"
posted = "2006-03-25"
text = "فكرتوني لما كنت بتسأل نره عن لبس الجينز للنساء حلال و لا حرام ؟؟؟<br />الناس كانوا فاكريني شيخ اصلي<br />طبعا قلت في عقل بالي ايه اللي هيحرمه بس قلت عشان مفتيش انقل للبنت معلومه تنفعها و في نفس الوقت اهرب من الفخ ده<br />قلت ان الزي الاسلامي للمرأه لازم تتوافر فيه بعض الشروط<br />1- الا يصف و لا يشف الجسد<br />2- يكون واسع و فضفاض<br />3- لا يظهر اي من اجزاء الجسم ماعدا الوجه و الكفين ( الرجل تغطا يا بشر )<br />4- لا تظهر فيه اي من انواع الزينة المحرمة او الالوان الملفته<br />5- الا يكون غريبا عن عادات و تقاليد البلد ( كل حسب تقاليده )<br />ساعتها اتسألت سؤال محرج و هو فاضل شرط<br />6- الا يكون متشبها بياب الكافرات<br />هما الكافرات ( و لا مؤاخذه ) ليهم زي رسمي<br />الواحد بيسمع حاجات غريبة يا اخي<br />حتى الجينز هيحرموه<br />طيب هقولكوا على موقف اظرف<br />واحد صاحبي ملتزم و اخلاقكوا زي السكر<br />الولاد اصطادوا في يوم عايزين يمسكولوا غلطة ( كعادة المستهزئين ) و قالوا يا عم الشيخ حاطط جيل على شعرك ؟؟؟ انت مش عارف ان الجيل حرام<br />قام افحمهم و قالهم ان الجيل سنه لان الرسول عليه الصلاة و السلام امر الامه ان تهتم بشعرها و بزينتها<br />فكوا بقا يا بشر و بلاص تعصب<br />و برضه بلاش تيب و انحلال<br />كلمه اخيرة الصور اللي فو كتابة التعليقات دي بايخه اوي<br />مش عاجباني<br />مبقلكوش غيروها عشان سواد عيني<br />بس بقول رأيي الخاص<br />حد ليه وق في حاجه ؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145526/http://www.20at.com/article2.php?sid=616"

[[comments]]
