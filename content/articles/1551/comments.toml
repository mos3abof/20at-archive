subject = "حررررررررررامي"
author = "هوبه او هبا به او هبهوب"
posted = "2006-03-25"
text = "ايه يا كرمله انت سرقت كلمتي \"يا بشر\"يا راجل كدا عيني عينك ... فين حقوق النشر والغسيل دلوقتي ...علي العموم هعديها بمزاجي ...<br />اللبس المحزق والملزق وحجاب الفشه والكرشه \" بدل اصل الحجاب حجاب القلب \" علي راي غنيم<br />شوف يا بشر .... حاجه غريبه والله<br />علي العموم \"الدين يسر طحن برده \""
archived = "2006-11-02"
