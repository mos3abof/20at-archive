[[comments]]
order = 8
subject = "وقعت في الفخ يا عبد الله"
author = "كرملينو"
posted = "2006-03-30"
text = "انا قصدت ااقول ان الشيخ ابن عثيمين عشان اعرف السلفيين اللي على حق هيقولوا ايه ؟؟؟<br />انا برضه كنت زيك كده يا عبدو<br />بقرأ اول السطر و اسيب باقي الصفحة<br />العلماء المحترمين مثل الشيخ بن عثيمين و الشيخ الالباني معنهومش مانع انهم يتراجعوا عن فتواهم لو اثبت لهم خطأها<br />و الشيخ تراجع عن فتوته الاولى ( فرضية النقاب ) في اخر حياته و اخر كتاب نشر لفتاوى الشيخ<br />و الشيخ الالباني له فتوة اخرى عن الاخذ من اللحية ما دون القبضة و التي تراجع عن فتواه الاولى من ان الافضل هو الاطلاق دون اخذ<br />و كل شيخ يجد دليل من الكتاب و السنة الصحيحة يخالف فتوة افتى بها سابقا يعلنها على الملأ انه اخطأ و ان هناك فتوة جديدة<br />و لا عيب في ذلك لانه لو لم يفعل كان تكبرا<br />و الرسول عليه الصلاة و السلام يقول ( لا يدخل الجنة من كان في قلبه مثقال حبة من كبر )<br />راجع فتاوى الشيخ بن عثيمين الاخيرة<br />بصرك الله و هداني معك الى الخير في الدنيا و الاخرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145526/http://www.20at.com/article2.php?sid=616"

