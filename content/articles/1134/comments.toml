subject = "الولد الرائع"
author = "احمد حمارشة"
posted = "2006-04-29"
text = "يوجد ولد رائع اسمه جابر في هذا الفيلم فانه يشدك للتمثيل لانك تحب تمثيله فانا احب تمثيله جدا فادعو الله ان يجمعني مع جابر في سورؤيا وعندما اكبر سازوره انشاء الله ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133025/http://www.20at.com/article2.php?sid=521"

[[comments]]
order = 4
subject = "الولد الجميل"
author = "احمد حمارشة"
posted = "2006-04-29"
text = "عرفنا ان فيلم الآباء الصغار فيلم جميل جدا من ناحية الاخراج ومن ناحية التمثيل لكن الولد الذي اسمه جابر هو الذي اعطى الفيلم رونق جميل في تمثيله وهذا الفتى انا معجب به شخصيا من كل ناحية انه ولد عبقري ينتظره مستقبل عظيم في التمثيل الكومدي والاجتماعي وجميع انواع الافلام والفتاة الجميلة حنان ترك عظيمة التمثيل وجميع المساهمين على هذا الفيلم يعطيهم العافية على هذا الفيلم واشكرهم شخصيا من كل قلبي واتمنى انا التقي بالولد جابر وجميع افراد أسرة الفيلم كما اني اتمنا من المخرجين انا يخرجوا افلام زي الآباء الصغار لانوا نادر ما يخرجوا زيو ويتركوا الافلام الوسخة زي ويجا وبنات وسط البلد شكرن لكل الي بدو يقرأ تعليقي i love جابر كتيييييييييييييييييييييييييير جاااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااابر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133025/http://www.20at.com/article2.php?sid=521"

