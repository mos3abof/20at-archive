[[comments]]
order = 0
subject = "كان فين من زمان؟"
author = "محمد السيد"
posted = "2006-03-04"
text = "اهه أنا من زمان نفسي في فيلم زي ده ...<br />فيلم بيتكلم علي الناس العادية يعني .. رجل وولاده وواحده غريبة عليهم ... في بساطة عجيبة ...<br />من غير اختراعات وأوهام مبيشفهاش غير مخرجين ومؤلفين اليومين دول ...<br />ربنا يرحمنا منهم ..<br />لاللتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />بأفكر أغيره .. حد عنده توقيع جديد؟<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133025/http://www.20at.com/article2.php?sid=521"

[[comments]]
order = 1
subject = "فيلم رائع"
author = "حاموزة النجم"
posted = "2006-03-05"
text = "فيلم رائع جدا 00 واحلى حاجه فيه انه بسيط للغايه يعنى ببساطه بدل ما تخرج من الفيلم وانت عندك مشكله نفسيه تجاه الفيلم لا تخرج من الفيلم وانت عارف حل المشكله واحلى شئ انك بتتعايش مع ابطال الفيلم مش كانهم ابطال هذا الفيلم لا كانهم اخواتك والمشكله البسيطه دى مشكلتك انت وى النهايه بتتحل بكل بساطهزى اى مشكله فى حياتنا اليوميه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133025/http://www.20at.com/article2.php?sid=521"

[[comments]]
order = 2
subject = "نحن بحاجة قصوي لهذه النوعية من الأفلام"
author = "محمد عبده العباسي"
posted = "2006-03-22"
text = "حقاً نحن بحاجة قصوي لمثل هذه النوعية من الأفلام التي يمكن أن نطلق عليها اسم الفيلم الأسري الذي يمكن لكل أفراد الأسرة مشاهدته دون خجل ،بدلاًً من هذه الأفلام التي لا تقدم كثيراً ونري وجوهاً تتصنع مهنة التمثيل التي صارت مهنة من لا مهنة له في هذا الزمان ، مجرد أفلام منقولة بلا إبداع يذكر أو يبقي في ذاكرة المتلقي ، مجرد ممثلون هواة يأخذونهاسبوبة ولقمة عيش وممثلات أكل الدهر وشرب من تجاعيد وجوههن المتوارية خلف النيولوك ..<br />تحية لأسرة الآباء الصغار التي قدمت ابداعاً راقياً ووجوها بريئة تؤدي أدوارها دون أن تبتذل ، تحية للرجل الجميل دريد لحام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133025/http://www.20at.com/article2.php?sid=521"

