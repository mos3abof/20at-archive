subject = "للأسف"
author = "أفتخر إني سعودي"
posted = "2006-06-12"
text = "نعم للأسف هذا واقع الحمدلله الذي من علينا بالستر ولكن أرفع قبعتي احتراماً للفتاة المذكورة بالقصة فالعمل بشرف أفضل من الوقوع في وحل الدعارة ولها أن تفخر بذلك فهي رغم صغر سنها ولكنها الأب والأم وروح تلك الأسرة الفقيرة وإن كنت اعتب على الأب الذي أنا متأكد أنه مجبراً على ذلك الفعل لا بطل وأكبر دليل أنه استعاد ابنته بعد ان أصرت على العودة للقرية برفقته ولكن نسأل الله الستر والعافية في الدنيا وفي الآخرة.<br />فاصلة ،،،<br />للأسف انا عربي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112847/http://www.20at.com/article2.php?sid=137"

