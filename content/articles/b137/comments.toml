author = "مجيب الحمادي _ اليمن"
posted = "2006-09-25"
text = "بسم الله الرحمن الرحيم<br />اولا انا احترم واقد الفتاة او الشاب الذي يتعب من اجلب راحة اسرته ولكن لي رجاءواكرر رجاء من له خدم يعملون لديه عليهان يتقي الله فيهم وأن يعاملهم با الحسنى ولنا في الرسول عليه الصلاة والسلام خير مثال .<br />اللهم فرج همنا واستر عوراتنا وأمن روعاتنا واغفر لنا اجمعين"
