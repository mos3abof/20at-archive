[[comments]]
order = 0
subject = "طب لو عايزة اقرأها اعمل ايه ؟؟؟"
author = "واحدة وخلاص ....بس مصرية جدا"
posted = "2006-07-04"
text = "طول عمري بقول ان المصريين دول عباقرة مش بيظهروا الا لو سمحت لهم الظروف<br />اما ان تكون هذة الظروف هي الامكانيات المناسبة<br />او تكون هذه الظروف هي الذل والقهر والتعنت و(((الاستغباء))) - (وهو مرض لعين انتشر في جزء من المجتمع المصري ويجب علينا ازالته بكل الطلاق)<br />--اما عن اعراضه فهي--<br />-عندما يتعامل المريض مع الأخرين على انهم اشياء لا يستطيعون الا الموافقة<br />-ويشعر انه يسيطر على ارادتهم اما بأمواله او نفوذه<br />-وتظهر عليه علامات البجاحة حين يظهر في وسائل الاعلام يتباهى بأخطائه وعيوبه غير مبالي بمشاعر المتفرجين لانه يظن انهم حصيد خامدين<br />وقد ظهر هذا المرض لأول مرة في الولايات المتحدة الامريكية منذ ما يقرب من ستة اعوام ولكنه انتشر انتشار هائل في الوطن العربي خلال هذة الاعوام"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091024/http://masr.20at.com:80/article.php?sid=604"

[[comments]]
order = 1
subject = "يا سلام على المصريين"
author = "مصرى جدا"
posted = "2006-07-05"
text = "يا سلام يا جماعة على المصرييين وافتكاساتهم ،فعلا ما ضاع حق وراءه مطالب،ادعو الصحفيين فى افاق الا يستسلموا او يياسوا من تاخر اصدار الجريدة بل لابد ان يبتكروا يوميا وسيلة جديدة للمطالبة بحقهم المشروع فى الدفاع عن جريدتهم وحريتنا."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091024/http://masr.20at.com:80/article.php?sid=604"

[[comments]]
order = 2
subject = "دعم"
author = "حسين عبد الظاهر"
posted = "2006-07-05"
text = "ادعو القراء جميعا أن يشاركوا فى تحرير الجريدة ويدعمونها ما استطاعوا إلى ذلك سبيلا، وأشد على أيدى زملائي بآفاق عربية ألا يتسرب اليأس إلى نفوسهم فهذا ما يتمناه رئيس التحرير ومن وراءه<br />وأن يتمثلوا النداء الربانى \"ياأيها الذين آمنوااصبروا وصابروا<br />ورابطواواتقوا الله لعلكم تفلحون\""
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091024/http://masr.20at.com:80/article.php?sid=604"

[[comments]]
order = 3
subject = "حسبى الله ونعم الوكيل"
author = "سمسم"
posted = "2006-07-05"
text = "بسم الله الرحمن الرحيم<br />لا أعلم حقيقة كيف يمكن لشخص ما أن ينام ملئ جفونه مرتاح الضمير بعد أن طرد هؤلاء الصحفيين من وظائفهم وشرد أسرهم بغض النظر عن انتمائهم.<br />(ألا يظن أولئك أنهم مبعوثون* ليوم عظيم* يوم يقوم الناس لرب العالمين) المطففين(4-6)<br />حسبى الله ونعم الوكيل.<br />إذا ظن هو ومن وراءه أنهم نجحوا فى الدنيا, فقد أخطأوا, لقد خسروا خسراناً مبيناً.. وماذا يفيدهم فى الآخرة كل ذلك؟؟؟؟<br />الله أكبر ولله الحمد<br />الإسلام هو الحل"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091024/http://masr.20at.com:80/article.php?sid=604"

[[comments]]
order = 4
subject = "صحيفة ماتت صحفيين لسه"
author = "حمدي"
posted = "2006-07-06"
text = "ليست آفاق عربية الأولى في سجل إغلاق الصحف في مصر وأعتقد لن تكون الأخيرة في ظل وجودأشباه رئيس تحريها الذي ظهر في عالم رئاسة التحرير بالصدفة والحظ لا غير وإذا كان الصحفيون في الجريدة يريدون أن ترجع آفاق عربية لهم فلن ترجع كما كانت وهو وقتها لن يكونوا أبنائها وإنما تأدية واجب لا أكثر لكن أقول لهم لا تتركوا من أغلق صحيفتكم ينام مرتاح البال أياً كان إلا بعد أن يأتي معترفاً ومقراً بخطأه فاصبروا ولا تستعجلوا فالحقوق في مصر أصبحت من أغلى السلع وأحلاها انتزاعاً مرة أخرى لا تتركوا من أغلق صحيفتكم حتى لو كان مين أكيد عارفينه."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091024/http://masr.20at.com:80/article.php?sid=604"
