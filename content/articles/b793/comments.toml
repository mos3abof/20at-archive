author = "نعم انها هيافة وسطحية ، ولكن الا يحق لناأن نتساءل من ينشر تلك الهيافة و السطحية ، ويشجع عليها ؟؟"
posted = "2006-05-12"
text = "أعتقد أن الجواب معروف للجميع ، وهم طواغيت العرب -أسأل الها ذا جبروت ذا ملكوت أن يدك ملكهم جميعا- ، فمن أهدافهم الماكرة تمييع الشعب ، وتسطيحه ، فيكون هم الشباب اللعب والانشغال بما لايجدي.<br />إن مسؤولية اصلاح المجتمع تقع على عقلاء المجتمع الذين ينبغي عليهم أن يكونوا يدا واحدة لاسقاط الطغاة ، واقامة حكومات جادة تأخذ بيد الشعب الى طريق العزة والكرامة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134603/http://www.20at.com/article2.php?sid=793"

