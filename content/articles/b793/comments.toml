text = "وماذ بعد ذلك..؟<br />ياصديقي<br />الراجل راجل في لبسه وشكله ومظهره وشهامته وشجاعته وقوة الشخصيه ولكن أن يقوم الشاب بتغيير كل هذا لمجرد انه نوع من أنواع التغيير فهذا فراغ وفراغ غير طبيعي ياعالم ممكن في يوم من الايام نجد الرجل يحبل ويولد (استغفر الله العظيم ) هذا ليس تدخل في ارادة الله أو خليقته ..ولكن الراجل راجل0<br />ياصديقتي يا أنسه<br />كفاك تغيير مش كفايه الزينه وتلوين الشعر بكذا لون تغيير ولون العيون......كمان عايزه تغير في انوثتها<br />ربنا يستر علي بناتي"
