subject = "هل نحن مسلمون ام مسلون"
author = "ابوكساوى"
posted = "2006-05-12"
text = "بدايه اريد توضيح نقطه مهمه. العولمه تعريفها هى تيار ايدولوجى يهدف الى السيطره على العالم العربى الاسلامى الحديث بحيث ياخذ العالم العربى الاسلامى الحديث حياته بنمط حياة دول الغرب..<br />ان الشى الذى يريده الغرب هو تشويه صوره الاسلام التى فطرنا عليهاومن ثم اتباع النمطيه الغربيه اى الاتباع بهم والاغتداء اننا الان صرنا كالقرود نقلد الاشياء فليس لنا عادات او تقاليد اوثقافه بل اننا حمير حمير ولكن قبل ان ندرك اننا حمير نريد ان نعلم العالم العربى اننا صرنا على ايديكم ارجوزات تضحك ولاتضحك بل الان الغرب ينظر لنل كاننا حثاله لسكان كوكب الارضوحثاله العالم لذا لابد من ازالتنا حتى يصبح العالم نظيفا من الجنس العربى المذدوج المقلد وكما قال تشارلز داروين باننا قرود وتحياتى للشباب العربى الخشن وخصوصا الصعايده والبدوا واهل العوض السودانيين وضربه قاسيه على قفا الشباب المخنس المايص المائع وشكرا ابو رناد شاب سودانى من مواليد 1984 خريج تمريض مقيم بالسعوديه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134603/http://www.20at.com/article2.php?sid=793"

