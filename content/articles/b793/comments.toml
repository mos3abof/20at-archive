text = "وعونك له بأن تشيع فكر الارهاب والخوف بين الناس من الظلمة وشرطة الظلمة.<br />المطلوب من الجميع تمزيق ستارالخوف من الديكتاتور ، واشاعة الجرأة على الظالم ، واستنهاض الهمم لمقارعة الظالمين .<br />فما الذي استفدناه من فكر التخويف والترهيب من الظلمة الا تطاول الظلمة علينا ، وافسادهم لحياتنا."
