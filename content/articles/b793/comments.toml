text = "بسم الله الرحيم.<br />بد قول للمتخلفة أو المتخلف الحقيقي الي كان عنوانو ما فيها شي انواهوالمتخلف الحقيقي وبدي اسألوا لما يسألوا ربو شو راح يقلو عادي يامتخلف (أستغفر الله العضيم) وكمان بدي قلوا عندك عادي الولد يتأنث والبنت بتتحول لرجل احنا ما بدنا نقلد الأوربيين احنا عرب<br />و ما بنغير تقاليدنا وعاداتنا هما هيك لأنهم مو مسلمين بس انتوا العرب الي فتحتوا عيونكم عالاسلام وبتعلموا وين الحرام وين الحلال بتعملوا هيك. بس الاسلام بريئ منكم وبدي قول شي تاني الأوربيين عم بيسخروا منا ليش لأنا قلدناهم وتركنا ديننا. الله يهديكم ويهدينا معكم"
