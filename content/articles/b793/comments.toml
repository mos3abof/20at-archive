[[comments]]
order = 31
subject = "ماذا أقول"
author = "مسلم"
posted = "2006-07-28"
text = "الله يوخذ الملك عبد الله بن حسين الأدرني، الذي يدعي أنه هاشمي. لسة على أيام أبوه كان الوضع أرحم. الله لا يوفقه، إذا زوجته ما بتلبس حجاب، ولها صور للأسف وهي بالمايوه مع زوجها العربي الأصيل في مجلة فرنسية. ستقولون وأنت لماذا رأيتها، أقول لأتأكد من صحة الخبر فقط.<br />الله يجعله يذوق الويل، قولوا آمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134603/http://www.20at.com/article2.php?sid=793"

[[comments]]
order = 32
subject = "يا خسارة"
author = "مرام"
posted = "2006-08-06"
text = "بسم الله الرحمن الرحيم<br />والله يا خسارة احنا هلء في اخر زمن فاي شي ممكن يصير الناس بطل الها ضمير كل واحد ممكن يقلد الغرب هدول الناس اخرتهم النار والعياذ بالله بس شو بدنا نحكي بعين الله والله يهدينا ويهديكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134603/http://www.20at.com/article2.php?sid=793"

[[comments]]
order = 33
subject = "فتح عقلك"
author = "تليمة"
posted = "2006-08-27"
text = "من الواجب ان نطرح هذا الموضوع على انفسنا اولا فسوف تجدون انكم ترحبون به لانك لوفكرت شوية هتجده خطوة جيدة للحرية بمعنى ان الفردمنا حتى هذا الحين الذى لايحصل على حريته سوف يقبل على هذا الفعل كرمز للتحرر وذلك من خلال التحرر منالملابس الرسمية التى نعتاد عليها فان هذه الفئة تفعل هذا الفعل اشباعا لرغباتها ولاحساس نفسا بالحرية وصدقونى لوتركناهم يلبسون مايرغبون فاننا نساعدهم فى التخلص من هذه الافكار ولو لاحظتم سوف تجدون الامة الغير مقيدة باشياء كثيرة تكون واعية وممتلئة بالنشاط فانا احترم السعودية احترام شديد ولكن تجدونها ملتزمة بالزى التى ترمز به للاحتشامولكنها مدمرة اخلاقيا وثقافيا ومعطين للرجل باسم الاسلام كل الحقوقوالنساء هناك مدمرين نفسيامع الملاحظة بانى عشت كثيرا فى السعودية ورايت ذلك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134603/http://www.20at.com/article2.php?sid=793"

