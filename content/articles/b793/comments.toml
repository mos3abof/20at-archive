subject = "حافضوا على الأنوثة"
author = "نسيبة العشيري"
posted = "2006-06-21"
text = "أنا نسيبة من المغرب<br />أنا شيئ واحدبس بد قولوا للبنات وهو حافضوا على الأنوثة فالله خلق النساء متميزين على الرجال بجمالهم ورقتهم فحافضوا عليها<br />بس أنا بشوف اني الأنوثة مو في التبرج واللبس الديق و كثير اشيا<br />الأنوثة هي لما بتكون البنت عاملة حجاب ومحافضة على كرامتها وما عندها علاقات غير شرعية مع الجنس الأخر..الخ<br />هايي البنت عم بكون الكل بد يخطبها وخصوصا ادا كانت حلوة<br />احنا شبابناالشباب المغربي ادا كانوا بدم يتجوزوا عم بحثوا عن بنت مثل هاالمواصفات والبنات لي<br />كانو عملين معاهم علاقات عم بكونوا عم بيضحكوا وبتسلوا فيهم بس مومشان شي لتضييع الوقت بس .لأنو بدو زوجة لتصون بيتو وتحفضلو كرامتو و بتحبوا وتكون قد المسؤلية وتربيلوا ولادوا أحسن تربية<br />والله يهيهم ويهدي بنات وشباب جميع المسلمين<br />nassiba_80@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134603/http://www.20at.com/article2.php?sid=793"

