order = 0
subject = "منى أبوالحسن"
text = "lol<br />الله يا شيرين... تصدقي من كتر ما اتعودت على المواقف دي بقت تعدي عليه من غير ما أحس انها حاجه غريبة؟ لدرجة اني طول ما أنا بقرأ كلامك قاعده بضحك من انطباق الكلام ده عليه و على باقي صديقاتي الي حظهم حدفهم على الدول العربيه يكملوا حياتهم فيها !<br />ربنا معاكي، كملي الموضوعات و لو عايزه مساعده بموقف أو تجربه، حاحب إني أساعدك...:)"
archived = "2004-11-02"
capture_url = "https://web.archive.org/web/20041102235124/http://www.20at.com:80/article.php?sid=586"

[[comments]]
order = 1
subject = "من نونا الي منمن و شريين"
text = "انتوا الاتنين و بالذات منمن<br />انا عندي اروح كوالالمبور و ابقي لوحدي يا منمن بس اسيب هنا<br />ايه رأيك نبدل؟؟ انا فعلا بفكر جديا اهاجر لزيمبابوي<br />كمان يعني هما عرسان مصر الي عدلين قوي... يا شيخة روحي :|<br />ملاحظة: غدا سأقوم بتوصيل الامانة يا منمن<br />و كلمة السر: كتكوت يا معلم"
archived = "2004-11-02"
capture_url = "https://web.archive.org/web/20041102235124/http://www.20at.com:80/article.php?sid=586"

[[comments]]
order = 2
subject = "وائل عباس"
text = "ما تقلقوش يا جماعة<br />بعد ما اقوم بالثورة الميمونة بتاعتي وشوية الاعدامات للخونة والعملاء واللذي منه على كام تاميم كده على كام حرب هافتح الحدود بين كل الدول العربية<br />وهالغي مسخرة الكفيل والشهادات والاستقدام الممنوع وحجز الباسبور والكلام الفارغ ده كله<br />وهاسحب خرطوم من ابار البترول كلها يصب في بيت مال واحد هو بيت مال المسلمين اللي المفترض يكون موجود بدلا من ان يحفظ ذهب المسلمين كله في فورت نوكس بشارع وول ستريت علشان عائلات محددة تظفر به وحدها في حماية امريكا ... ان شاء الله يتوزع على فقراء المسلمين في كل مكان حتى السودان و الصومال وجيبوتي ومصر وما يبقاش حكر على فئة او عائلة آل فلان وحاشيته وما شابه ... يتجبوا علينا بيه ويقولوا صدقة ويقولوا بنشغلكم ونوظفكم ونعطيكم مرتبات وهم بيعطوا الامريكاني عشر اضعافها ويبوسوا ايده كمان لكن احنا مطلوب نبوس الجدم ... الى اخر الاغنية ...<br />وان شاء الله مش ها يكون فيه عاطل ولا عانس ولا حد مش قادر على الجواز ... ويا بخت من وفق راسين في الحلال بدلا من صرف نقود المسلمين على شراء الخيول واسطبلاتها في انجلترا او على موائد القمار في مونت كارلو او على البنات المش كويسة في ماربيا باسبانيا او استثمار الف مليار دولار داخل الولايات المتحدة من اموال دولة عربية واحدة بدون ذكر اسماء والعواطلية المسلمين ملطعين على القهواي وعائلة ال زعبلة رايحة تشغل ولاد الامريكان بفلوسها !!!<br />بس ادعولي ما اتجوزشي واحدة تضحك على عقلي وتخليني احط الخرطوم في جيبي انا واجهز ابني الصغير لتولي العرش من بعدي ..."
archived = "2004-11-02"
capture_url = "https://web.archive.org/web/20041102235124/http://www.20at.com:80/article.php?sid=586"

[[comments]]
order = 3
subject = "أحمد"
text = "تسلم إيدك يا شيرين<br />المضوع مهم جدا والتناول رائع وفيه كوميديا سوداء غير مفتعلة.<br />أهم حاجة بقى إنك اتكلمتي عن الرجالة برضو كطرف في الموضوع ولم تركزي على البنات فقط ، وده للأسف اللي بتعمله كتير من البنات إلا ما رحم ربي،وكإن محدش عنده مشاكل غيرهم.<br />تسلم إيدك وفي انتظار المزيد"
archived = "2004-11-02"
capture_url = "https://web.archive.org/web/20041102235124/http://www.20at.com:80/article.php?sid=586"

[[comments]]
order = 4
subject = "منى أبوالحسن"
text = "إلى نونا المجنونه:<br />في انتظار تأكيد وصول الأمانه.. خلي بالك كتلفتيش النظر ليكي، الكل عارفك بالإسم الحركي.. و مش عايزين فضايح..<br />مش حاوصيكي، لو انكشفتي اوعي تبوحي بسر الأمانه أو اسم صاحبها (إلي هوه أنا) مهما كانت الضغووووووووووووووط... معلش أنا عارفه إن السيخ المحمي صعب شويه بس انتي قدها برضه و أنا أستاهل"
archived = "2004-11-02"
capture_url = "https://web.archive.org/web/20041102235124/http://www.20at.com:80/article.php?sid=586"

