[[comments]]
order = 13
subject = "عذرا"
author = "البراء أشرف .. كاتب المقال"
posted = "2006-02-18"
text = "السلام عليكم..<br />بدية أشكر كل الإخوة المعلقين على اهتمامهم، وبالنسبة للمشهد الذي سبب إزعاج للبعض، فإن لي توضيح بسيط أرغب في قوله..<br />المشهد المذكور هو المشهد الوحيد الذي لم يتدخل فيه خيالي، فقد حدث بالفعل أمام عيني أمس الجمعة بمسجد الاستقامة بالجيزة، سواء ما قيل في الخطبة أو ماقاله البائع الملتحي.<br />وبالتالي فانا لم أقع في فخ الحكومة وتكريسها لصورة المتدينين ، ولم أختلق موقفا.<br />الأمر الثاني هو أني حتى ولو كنت تخيلت المشهد، فإن هذا حق لي، خاصة وأن صورة المتدينيين بعيدا عن الحكومة ليست على الوجه الذي يشرفهم.<br />النقطة الثالثة متعلقة بالتعليقات الـ\"هائجة\" بخصوص أزمة الدنمارك، وبصراحة لا أملك تعليق واحد سوى.. ربنا يهدينا جميعا.<br />سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130140/http://www.20at.com/article2.php?sid=459"

[[comments]]
order = 14
subject = "حراام"
author = "غيور"
posted = "2006-02-18"
text = "الدنمارك غلطت اة<br />واعتذرت اة<br />خلااص خلصناخلااااااااااااااااااااااااااص<br />انتو بتفهمو ازاى يابشر بتفهمو ازاى<br />قلنا خلاص ولا ههههههه عاوزينهم ينطقوا الشهادتين علشان ترتاحو<br />دا كلام ؟؟؟؟؟؟؟<br />انتو سدقتو ما لقيتو قلنا عملو كدا واكتر فى باقى الانبياء خلااص<br />واللهى بقى معنى الاسلام عندهم هو اللى بيعملو الزرقاوى واخواتة<br />يدبحو ووراهم لا اللة الا اللة<br />طيب عاوزين اية تانى<br />لازم صورة الاسلام تتصحح من البداية<br />اخيرا احب اقول خلاص الدنمارك غلطت واعتذرت والاعتذار فى الاهرام<br />يبقى نقبل الاعتذاااااااار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130140/http://www.20at.com/article2.php?sid=459"

[[comments]]
order = 15
subject = "ربنا يبارك لكم"
author = "البراء مشعارفة اقولك ايه على اسلوبك الرائع ده"
posted = "2006-02-18"
text = "والله و الله و الله ...انا بشتغل في مؤسسة صحفية كبيرة ..ومش بلاقي الأسلوب الجميل ده ,ولا الأفكار الرائعة دي ,ولا الحماس الملتهب ده عند الشباب اللي في سن شباب عشرينات و اللي اكبر من سنهم عشر سنين<br />ربنا يوفقكم و يبارك لكم وتبقى عشرينات مؤسسة صحفية كبيرة ..اكبر من الاهرام..شفت وقعت بلساني ازاي !!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130140/http://www.20at.com/article2.php?sid=459"

[[comments]]
order = 16
subject = "مشهد رقم 8"
author = "أكرم"
posted = "2006-02-18"
text = "احد المصريين الصعايدة يبكي بحرقة كبيرة امام مركز الانقاذ في سفاجا<br />الصحقي : هل مات ابوك في العبارة ؟؟<br />الصعيدي : لا ابويا مات في حادثة قطر الصعيد من سنتين<br />الصحفي : يبقا اكيد امك<br />الصعيدي : لا امي ماتت في اتوبيس الموت في طريق بني سويف اسيوط<br />الصحفي : امال مين اللي مات ؟؟؟<br />و في سره ( حنقتني )<br />الصعيدي : اخواتي كلهم ماتوا في العبارة<br />الصحفي ( و هو يتنفس الصعداء ) : عشان كده بتعيط ؟؟<br />الصعيدي : لا انا بعيط من الفرحة لفوز مصر بكاس افريقا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130140/http://www.20at.com/article2.php?sid=459"

[[comments]]
order = 17
subject = "اهيه دي النتيجه"
author = "عبدالله مفتاح"
posted = "2006-02-18"
text = "يا براء يا حبيبي حد قال ان مفيش ملتحين اخلاقهم سيئه.؟ كلنا عارفين انهم موجودين<br />بس ليه نسلط الضوء عليهم طيب مهو في ملتحين زي النسمه دول اولى ان احنا نتكلم عنهم<br />وبعدين كل السينما والمسرح والصحافه بتسئ للمتحين بمناسبه وغير مناسبه نروح احنا كمان نسيء ليهم طيب ليه يعني<br />الناس خلاص بقت بتاخد الملتحي انه سيء الخلق حتى يثبت العكس مع ان الاصل في الملتحي حسن الخلق<br />والنتيجه انت شايفها الاخ اللي قال اغلبهم ان مكنش جميعهم مش كويسن<br />ولا انت يا يا براء يا صحبي هتعمل زي المخرجات اللي يجبولك اسوا ما في المجتمع ويقولو مهو موجود؟<br />مهو موجود بس احنا عايزين الضوء يسلط على النماذج الحسنه مش السيئه عشان الناس تعرف الصالح من الطالح<br />وربنا معاك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130140/http://www.20at.com/article2.php?sid=459"

[[comments]]
order = 18
subject = "القوالب-مرة أخرى"
author = "فارس"
posted = "2006-02-18"
text = "عزيزي البراء<br />لقد عبر الأخ عبدالله مفتاح عما بجول بخاطري.<br />فلقد درج الإهلام الحكومي على تنميط صورة قبيحة لكل الملتحيين و لكل من يعتاد المساجد حتى أصبحت تلك الصورة حقيقة في اللاوعي.<br />قد يكون المشخد حقيقة و قد بل يكون، و لكن أذكرك و نفسي بقول الرسول الكريم:\"ألا سترته\"!<br />في الجوقة الكثير بالبفعل، كان بمكن المعالجة بطريقة أخرى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130140/http://www.20at.com/article2.php?sid=459"

[[comments]]
order = 19
subject = "يا راجل حرام عليك"
author = "يا راجل حرام عليك الافتراء.....اللحية لا تعني بالضرورة التزام صاحبها.....وانت تعلم ذلك....كما تعلم ان اللي هيقرا كلامك هيعمم فكرته عن الملتحين الذين نعلم عنهم انهم اطيب الخلق وان علاهم بعض الخبث الوارد في كل مكان.....فحتى في عهد النبي لم يسلم من منافقين يجالسوه ويسمعون حديثه."
posted = "2006-02-18"
text = "حرام اما عادل امام السافل يشوههم شوية ونور الشريف شوية ويوسف شاهين شوية.....وانت تأتي لتكمل.....طب مين يظهر المحاسن.<br />وأقسم بالله العظيم غير حانث في يميني ان شاء الله ان هذا الموقف بهذا الشكل لم يحدث .<br />وأقسم بالله لاجاجنك عن هذه الكلمات التي كتبت يوم القيامة ومش هسيبك عنده غير اما يفصل لاحدنا.....الا ان تتحلل مما كتبت .<br />عيب عليك .....اتق الله.....هنلاقيها منين ولا منين....!!!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130140/http://www.20at.com/article2.php?sid=459"

