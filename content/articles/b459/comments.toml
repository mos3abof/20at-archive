[[comments]]
order = 39
subject = "احلال وتبديل"
author = "الضبع"
posted = "2006-04-01"
text = "اولا اسلوب المشاهد أكثر من رااااائع ولكن المادة نفسها وكلها غير واقعية بالمرة واختيار المواضيع غير موفق اطلاقا هي ليست مشاهد مصرية فهى ممكن ان تحدث فى اى مكان فمثلا مشهد الطيور مأخوذ عن حادث قدرى صادف ان يكون فى مصر فى هذا التوقيت وهو منذ اكثر من عام كان موجود فى هونج كونج ( اشمعنى مصر يعنى ) وكان أولى أن تسخر من موضوع واقعى مثل ارتفاع اسعار قطع غيار السيارات بالرغم من تخفيض الجمارك ومشهد المساطيل أيضاً غير واقعى لأن ادمان الحشيش ما بقاش موجود فى مصر دلوقتى زى زمان واحنا شبعنا سخرية منه زمان وأيضاً موضوع العبارة اللى غرقت موضوع قدرى وان كان الإهمال هو احد اسبابه ولكنه لايحدث كل يوم عبارة مصرية تغرق وكان الأولى انك تختار موضوع بيحصل كل يوم زى موضوع أزمة المواصلات والمرور احنا كلنا بنعانى منه كل يوم وكل ساعة وكل دقيقة وهو موضوع مصرى مصرى يعنى 100% مصرى ولسة ماشبعناش سخرية من هذا املوضوع وممكن تطلع منه بمادة فكاهية حلوة وانا عارف انك تقدر و منتظر منك حجات كتير حلوة فى هذا الموضوع أما عن موضوع نشرة الأخبار فهو اختيار جيد لأ ممتاز أما موضع الهدف الضائع من احمد حسن فهو أيضا موضوع قدرى الراجل ماكانش يقصد يضيع الهدف لكن معاك حق الريس زكريا كان يقصد يضيعنا وانا عارف ان هوة دة المقصود من المشهد وهو النكتة وعارف انك ماتقصدش تعاتب احمد حسن أما بقى بخصوص موضوع الشيخ اللى فى مسجد الإستقامة فأنا رأيى انك تغير المسجد يعنى تصلى فى مسجد آخر مايكونشى نفس الشيخ اللى مش عاجبك بيخطب فيه وأنا أضمن لك انك مش حتسمع الكلام اللى سمعته ده تانى ولا حتى كلام شبهه أو من عينته لأنك أعطيت انطباع سيئ لمليار وميتين ألف مسلم بالتشدد والتعصب والتسرع والهمجية فى حين ان الحقيقة غير كدة وما تنساش ان 99% من شيوخ المساجد كانت تتطالب بالمقاطعة والحوار وهذا حق مشروع لا يستحق الجدل ولا السخرية أما الناس اللى بتبيع سيديهات مضروبة قدام مسجد الأستقامة أناعارفهم كويس وياما اتلدعت منهم كتير واحب اقولك يا براء ان دول مش شيوخ ولا حاجة زى ما انت فاهم دول عاملينها سبوبة ومايصحش اننا ناخد العاطل بالباطل وكان ممكن تستبدل مشهد الشيخ فى المسجد بموضوع واقعى بنعيشه وبنعانى منه وهو مشاهد الفيديو كليب الخليعة فى التلفزيونات العربية والتى أصبحت لا تروج إلا لفكرة واحدة وهو ان الإبداع لا يوجد إلا فى حجرات النوم فقط وهى السمة الغالبة فى اغانى الفيديو اليوم وأخيرا انت فنان موهوب جدا جدا وممكن تعمل حاجة لبلادنا مفيدة ولكن راعى الدقة فى المواضيع التى تكتب فيها<br />نصيحـــــــــة<br />حاول ان تكتب فيما يمس الناس قوى ولا تكتب فيما هو شائع بين الكتاب الكبار وذلك لكى تكون لك ( كاريزما ) شخصية مستقلة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130140/http://www.20at.com/article2.php?sid=459"

