[[comments]]
order = 21
subject = "انتوا مستغربين ليه"
author = "Dabdoob"
posted = "2006-02-19"
text = "انتوا مستغربين ليه من المشهد الخاص بالشيخ؟<br />الكثير من المتدينين يؤيدون قول ابن كثير في ان من يسب الرسول جزاؤه القتل ودون استتابة اذا ثبت عليه السب وبالتالي فانهم يرون انه لابد من قتل رسامي الكاريكاتيرات المسيئة بل ورئيس تحرير المجلة ايضا ويقولون ان من يقتلهم يثاب من الله علي فعلته المجيدة!!!!!<br />وتعليقي هنا اننا اذا فعلنا هذا فاننا نقول لهم ببساطة انكم رائعون نجحتم في رسمنا في كاريكاتيراتكم كما نحن بالفعل ارهابيون ومفرقعي قنابل.<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130140/http://www.20at.com/article2.php?sid=459"

[[comments]]
order = 22
subject = "ياااااااااااااسلااااااااااااام"
author = "basmatokom"
posted = "2006-02-19"
text = "هو صحيح مقال تحفة ماحدش يقول غير كده..بس سخيف أوي إنك تساوي بين ضربة جزاء هايفة بيلعبها واحد هايف في ماتش هايف كلهم هيافة في هيافة ..وبين واحد سب رسولنا و حبيبنا صلى الله عليه وسلم.. واللي بيقول اعتذار في جريدة الدستور يقراه عدل وهو يكتشف اد ايه هو ضحك على الدقون وماهواش اعتذار أصلا ده بالعكس اعتذار مهين لينا جدا....طبعا نقبل اعتذار أحمد حسن ولا نقبل اعتذار ادانمارك لأنه مش اعتذار أصلا ولو بلناه نبقى هبل و نستاهل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130140/http://www.20at.com/article2.php?sid=459"

[[comments]]
order = 23
subject = "اقتلوهم"
author = "Dabdoob"
posted = "2006-02-19"
text = "الاخ basmatokom<br />طب هترفض الاعتذار<br />احب اعرف انت عايز ايه ؟؟؟<br />رقبة الرسامين عشان تطبق عليهم حد ساب الرسول؟<br />يا جماعة الناس دي اخر حاجة عندها الدين ده غير ان رسمنا بالصورة دي بيعبر عن صورتنا عندهم ببساطة<br />بمعني اخر اليهودي لو احنا رسمناه هنرسمه بانف طويلة معقوفة وفي موقف بيعبر عن عشقه للمال بنفس المنطق هم شايفينا ناس عنيفة عابشة في عصر ما قبل التاريخ وبيضطهدوا المراة والاقليات<br />وده اسمه SELF-REFERENCE CRITERION اي معيار الرجوع للذات يعني انك بتشوف الحاجات من خلال نظرتك الشخصية وثقافتك المحيطة<br />وسلام<br />Dabdoob"
