[[comments]]
order = 10
subject = "المشاهد فعلا مصرية جدا"
author = "المشاهد كلها حقيقية واشوفتوها بعينكوا"
posted = "2006-02-18"
text = "واللى شايف ان مشهد مالوش لازمة ف الغالب ما يقدرش ينكر انه موجود مثلاالاخت اللى شابفة ان مشهد خمسة مالوش لازمة واضح انها ما فهمتهوش ودا عادى ناس كتير موش بتفهم مقالات براءوبقية الاخوة متعصبين لاتجاه معين<br />اما بالنسبة لموضوع الاعتذار فلو حد قرا جريدة الدستور عدد الاسبوع اللى قبل اللى فاتمنشور فيه الاعتذار الرسمى<br />واما قالبالحكومةللمتدينين فالقالب براء موش واخدوا منالحكومة لان كتيرمن المثقفين بيضعوهم ف القالب دا لكن دا موش معناه ان الناس دى بتتبلى عليهم لان الملتحين مع الاسف معظهم-ان لم يكن جميعهم-على هذه الصورة وليس كل شىء متعلق بالدين او اى حد يتفلسف ويعمل نفسه متدين خلاص بقى شيخ طريقة وحتى لو كان كده مهواش ربنا على<br />يكون نقده ممنوع<br />بس النقد لازم يكون بهدف المعالجة<br />انا موش محامى لبراء لكن حاسس ان دى نقط اتمنى ان اكون فهمتها صح وحبيت اوضحها للاخوة العرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130140/http://www.20at.com/article2.php?sid=459"

