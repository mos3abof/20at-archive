text = "الحقيقة أنا موبايلي وقع مني في المياه وبعد ما طلعته حطيته قدام مروحة وبعد كدة أشتغل بس كان بيخرف شوية وحاولت اصلحه في أي حتة بس ما حدش رضى يصلحهولي وقعد لمدة اسبوع وكل ما احطه في الشاحن ويسخن يتظبط لغاية ما رجع زي الاول .. بس ساعتها فرحت و أن موبايلي ده أحسن موبايل في الدنيا"
