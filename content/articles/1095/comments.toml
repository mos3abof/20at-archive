[[comments]]
order = 1
subject = "ابو الفوارس الشجاع اضاء فينا كلشعاع"
author = "هووووبه"
posted = "2006-06-19"
text = "المقال عجبني اوي يا كابتن , عندي عقده اساسا من حكايه الامغازي والبربر والمغاربه عامه بس اللي حلوه حكايته مع مراته وامه دي , ويبقي بقي انك تعرف ان في صوره عندي نسخه من اللي فوق دي بس متفرقه الفارس الملثم لوحده واخده الحيطه كلها والجمل او الحصان لوحده وبرافو علي المقال وفي النهايه اغرب الغرباء من صار غريبا في وطنه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132153/http://www.20at.com/article2.php?sid=961"

