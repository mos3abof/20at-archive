[[comments]]
order = 6
subject = "تحيا الكلمة"
author = "ايوب"
posted = "2006-07-15"
text = "المقال قرأته ولا يسعنى فى نهايته إلا ان اشكر كاتبه و قلمه الرصاصى حقا الغرباء كثر فى اوطانهم واريد لهم الفناء فى حياتهم فياترى ما جرمهم ؟ لا شىء إلا ان العالم اليوم يعيش مرحلة ما بعد الشرف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132153/http://www.20at.com/article2.php?sid=961"

