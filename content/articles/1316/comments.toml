[[comments]]
order = 1
subject = "ابسط يا معماري"
author = "واحد تاني"
posted = "2006-03-16"
text = "الحبة دي هتكون اختراع هايل لكل المهندسين المعماريين المساكين وكمان طلبة كليات العمارة المطحونين , يعنى حبة ويقدر يعمل جزء من طلبات الدكاترة او حبتين ويطبق لتاني يوم (يعنى يشبك يومين فى بعض 48 ساعة يعنى) عشان يقدر يسلم المشروع ,,, كنتى فين يا حبة لما كنا سهرانين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142334/http://www.20at.com/article2.php?sid=575"

[[comments]]
order = 2
subject = "عودة الى الانحدار"
author = "كرملله"
posted = "2006-03-16"
text = "مش عارف ليه الموقع باظ من بعد الانقلاب الفاشل<br />يبدو ان كل شيء بقا فاشل في حياتنا<br />الظاهر ان الناس الجامدين في الموقع كتروا شويه من الحبوب بتاعت النوم دي و واخدين شهر في العسل<br />فين المواضيع المتنوعه و الحلوه يا جماعه ؟؟<br />انتوا انبوبتكوا خلصت و لا اليه ؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142334/http://www.20at.com/article2.php?sid=575"

[[comments]]
order = 3
subject = "تنويه عن المفقودين"
author = "كرملله"
posted = "2006-03-16"
text = "انا طبعا مش قصدي ااقل من شأن الموضوع ده بس حاسس ان الموضوعات بدات تنحدر و عايز نلحقها قبل ما تقع في الهاويه و منعرفش نطلعها الا بونش و بعدين ممكن نطلعها و بعدين نلاقيها ستين حته و نفعد بقا نصلح فيه<br />طب و ليه منلحق المركب قبل ما تقع احسن<br />بالتوفيق يا عشرينات و الى الامام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142334/http://www.20at.com/article2.php?sid=575"

[[comments]]
order = 4
subject = "لا بلاش"
author = "طماطم"
posted = "2006-03-16"
text = "النوم دا مالوش حل بس انا شايفة ان الحباية دى هتاثر على ناس كتير خصوصا موظفين الحكومة بتاعتنا عشان هما دايما نايمين ودى ممكن تقلق راحتهم عشان هما يدوب بينامو 20ساعه بس فى اليوم يعنى بجد دا هيبقى ظلم عليهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142334/http://www.20at.com/article2.php?sid=575"

[[comments]]
order = 5
subject = "لقتهم انا بقي"
author = "هبهوب او هبابه او هوووبه"
posted = "2006-03-17"
text = "بص يا كرمله الموقع دا في تجديد ولسه شغالين في ولاد البلد الي حسه اني الوحيده اللي بعلق هناك من \"كرمات\" الموقع دا علينا والفضفضه الي بنقولهايا \"كرميلنو \" براحه يا باشا.\" وخف تعوم\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142334/http://www.20at.com/article2.php?sid=575"

[[comments]]
order = 6
subject = "اني اغرق اغرق اغرق"
author = "كرميلينو ( اللي هو كرملله اللي هو اكرم )"
posted = "2006-03-18"
text = "انا سيبتلهم يا هوبه تعليق في ولاد البلد و نفسي الموقع يبقا احسن لان فيه ناس كتير بحترمهم و لان الموقع خسارة انه ينحدر الى الهاوية من تاني<br />و بعدين فين البراء الاشرف و عمال المواسير ؟؟؟<br />انتم صفيتوهم و لا ايه ؟؟<br />و اختملكوا بامل دنقل<br />إن المدافع التي تصطف على الحدود، في الصحارى<br />لا تطلق النيران.. إلا حين تستدير للوراء.<br />إن الرصاصة التي ندفع فيها.. ثمن الكسرة والدواء:<br />لا تقتل الأعداء<br />لكنها تقتلنا.. إذا رفعنا صوتنا جهارا<br />تقتلنا، وتقتل الصغارا !"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142334/http://www.20at.com/article2.php?sid=575"

[[comments]]
order = 7
subject = "اين اجدها"
author = "وليد جميل"
posted = "2006-03-18"
text = "هي الحل الفعال لكثير من المشاكل التي تمر بنا وتؤرقنا<br />يستطيع الانسان ان يسهر الي قبل الفجر بساعتين ثم ينام ويستيقظ للفجر ويبدأ اليوم من اوله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142334/http://www.20at.com/article2.php?sid=575"

[[comments]]
order = 8
subject = "النوم ساعات بيبقى رحمه"
author = "نيفين"
posted = "2006-03-18"
text = "يعنى لما تبقى زهقان ممكن تنام ..لما تبقى عيان ممكن تنام..لما مخك يبقى شغال تقكير ف مليون حاجه ف الفمتوثانيه الواحده تنام..و لما يبقى الليل ليل كموج البحر ارخى سدوله علىك بانواع الهموم ليبتلى يبقى احسنللك تتخمد.الخلاصه يا جماعه النوم ساعات بيبقى الملاذ الخير و الحصن الحصين<br />لكن لما يبقى عندك مجستير مش لاقيله موضوع و لا مشرف يبقى الحبه الهايله دى افضل اختراع عرفته البشريه<br />ماله الموقع يا اكرم اللى هو كرملينو اللى هو كرملله<br />مع اعترافى ان فشل الانقلاب زعلنا كلنا<br />و اعترافى ان من يوم ملف الموت مفيش حاجه حلوه بس الموقع مش وحش برده<br />خف يا اكوم على راى هبه<br />مش محتاج اقوللك مليون ميرسى على كلمات امل دنقل<br />انت عارف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142334/http://www.20at.com/article2.php?sid=575"

[[comments]]
order = 9
subject = "لا تنام من فضلك"
author = "مصري"
posted = "2006-03-19"
text = "شرطة الصف تحتجز 51 رهينة لإجبار سجين هارب على تسليم نفسه<br />قام أحد المسجونين ويدعى محمد صالح عبد المحسن بالهروب من سجن المنصورة أثناء ترحيله مما جعل قوات الأمن تقتحم منزله ومنازل أقاربه بمركزي الصف وأطفيح بمحافظة الجيزة ، حيث قامت باحتجاز ما يزيد على 51 فردا داخل.<br />منظمات حقوقية تناشد الرئيس التدخل لحماية أسرة من التعذيب .. وتشريد عمال طالبوا بإنشاء نقابة لهم<br />ناشدت 17 منظمة حقوقية الرئيس مبارك التدخل لحماية أسرة السيد جمال راضي مما تتعرض له من تعذيب وإهانة على يد ضابط قسم حلوان . وكان 11 من أفراد الأسرة منهم 4 سيدات قد تعرضوا للضرب والتعذيب الوحشي<br />مواطن يتقدم ببلاغ للنائب العام ضد وزير الداخلية لتعذيبه داخل قسم شرطة الشرابية<br />قدم أهالي المواطن إبراهيم علي 22 سنة بلاغا للنائب العام ضد وزير الداخلية ومباحث قسم الشرابية يتهمون فيه قوة المباحث بتعذيب ابنهم وتعليقه واحتجازه لمدة 4 ساعات دون وجه حق.<br />تعذيب مواطن بقسم شرطة المنيا .. تهمته أنه كان جارا لقتيل جاري البحث عن قاتله<br />كان فتح الله حافظ مواطنا يعيش في المنيا ويعمل في إحدى الأراضي الزراعية إلى أن حدثت جريمة قتل بالبلدة التي يقيم بها ففوجئ بالمباحث تقتحم منزله وتقوم بإتلاف أثاث منزله<br />ترحيل الشيخ عبد الله السماوي وأبنه إلى سجن وادي النطرون دون معرفة سبب اعتقالهما<br />علمت المصريون أن الشيخ عبد الله السماوي رحل إلى سجن وادي النطرون عقب أن قامت قوات من مباحث أمن الدولة باعتقاله منذ حوالي 15 يوما هو وأبنه سلوان ومعهما العديد من الذين يسكنون بجواره في المنطقة ويصلون ...<br />مذكرة للنائب العام تتهم قسم شرطة عين شمس بتعذيب مواطن<br />قامت مباحث قسم عين شمس بإلقاء القبض على المواطن حسن إبراهيم واحتجازه وتعذيبه دون وجه حق. كان حسن يتجه إلى محل عمله ففوجئ بالمباحث تقتحم ورشته التي يملكها ويأخذونه إلى القسم بدعوى أنه متهم في ...<br />في قسم شرطة إيتاي البارود : حفلة تعذيب لسيدتين ومتهمين لم يعترفا بارتكاب جريمة<br />قامت قوة من شرطة إيتاي البارود بالقبض على محمود عزمي وحمد ناجي أبو الخير لأنهما متهمان في قضية شروع في قتل وقد تعرضا للضرب المبرح والسب والإهانة أمام ذويهم كما تعرضوا لأشكال مختلفة من الضرب والتعذيب ... التفاصيل<br />تشريد 700 عامل بالاسكندرية للأسمنت ونقل عاملين بالتأمين الصحي لكشفهما وقائع فساد<br />دخل ناصر سيد ومحمد بكر الموظفان بمستشفي التأمين الصحي إضرابا مفتوحا عن الطعام احتجاجا عن نقلهما تعسفيا من مستشفي التأمين الصحي بالفيوم إلى مستشفي التأمين بكميان فارس وفسرا قرار نقلهما بأنه جاء بعد كشفهما عدة ... التفاصيل<br />النيران تلتهم أحد المحتجزين داخل نقطة شرطة الفنار بالإسماعيلية<br />قامت نقطة شرطة الفنار بمدينة فايد بالإسماعيلية بإلقاء القبض على المواطن خالد حسن إبراهيم 19 سنة أثناء سيره في إحدى شوارع محافظة الإسماعيلية ، حيث تم اقتياده إلى مقر النقطة واتهامه ... التفاصيل<br />وفاة مواطن داخل قسم شرطة إمبابة واسرته تتهم الضباط بتعذيبه<br />قامت شرطة إمبابة بإلقاء القبض على سليم الصغير 26 سنة أثناء استقلاله ميكروباص متوجها إلى زيارة أخته ، حيث قام كمين للشرطة بإيقاف السيارة وطلب منه إظهار تحقيق شخصيته وعندما ... التفاصيل<br />اتهام الحكومة بفرض إتاوات على المواطنين من خلال فواتير الكهرباء والمياه وهدم 500 منزلا لفلاحين فقراء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142334/http://www.20at.com/article2.php?sid=575"
