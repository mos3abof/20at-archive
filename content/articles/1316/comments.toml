subject = "النوم سلطان وملك كمان ."
author = "هبهوب او هبابه"
posted = "2006-03-15"
text = "لو الانسان عمره 60 سنه 20 سنه نووووووووم<br />الرجل اللي فوق دا شكله تحقه بيفكرني بواحد صحبنا<br />المهم انا ساعه لما احط\" راسي\" او \"رجلي\" علي السرير<br />انسسسسسسسسسسي ."
archived = "2006-11-02"
