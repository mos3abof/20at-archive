author = "االمياة فى اسرائيل"
posted = "2009-10-26"
text = "اسرائيل فيها مياة اكتر من مصر<br />وفيها خبراء فى تحلية مياة البحر هم اعظم خبراء العالم ولا تعانى اسرائيل من شح او قلة مياة الشرب اطلاقا بعكس مصر<br />وفى اسرائيل محطات تحلية مياة البحر بالضغط الاسموزى متقدمة جدا وتنتج جالون المياة ارخص من مياة النيل<br />وهناك دول الخليج والسعودية كلها تعتمد على المياة المحلاة من مياة البحر<br />اذن الموضوع موضوع سياسى واستعمارى خبيث بحيث يستغل موضوع المياة لد[ *** ] مصر واحتلال سيناء ثانيا بحجة تامين المياة<br />لا تنسوا الخبث والمكر اليهودى وسوء المقصد<br />واللة المستعان<br />مهندس تحلية مياة"
archived = "2009-10-29"
capture_url = "https://web.archive.org/web/20091029053815/http://www.20at.com:80/masr/2khbar/13820-2009-10-26-07-36-10.html"
