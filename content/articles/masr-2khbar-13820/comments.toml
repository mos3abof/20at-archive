author = "اهبطوا مصر"
posted = "2009-10-26"
text = "فى قصة يوسف موضوع يحيرنى<br />عندما اراد اخوة يوسف ان يهبطوا ارض مصر وياخذوا معهم اخاهم بنيامين فى القافلة وعلى حسب قولهم لابيهم كما جاء فى القران ( لنزداد كيل بعير )<br />هل كان عزيز مصر يوزع مجانا الحبوب بالمكيال على البدو العبرانيين لوجة اللة ؟<br />الفلاح المصرى القديم وحتى وقت قريب جدا يمكن من 50 سنة فاتت كان يحصد القمح والذرة والفول وينتظر قدوم البدو بالجمال ليحملوا محصولة من الحقل الى الجرن او البيت على ظهور الجمال وكان الفلاح يعطى لصاحب الجمل جزءا من الحبوب سواءا ذرة او قمح<br />وعلى ما روى الاجداد وقريبا فى بداية القرن كانت الجمال تاتى من نجد فى الحجاز ومن سيناء ومن فلسطين لرعى الغنم وتشغيل الجمال فى اوقات الحصاد<br />هل اخوة يوسف كانوا يشتغلون فى حمل محاصيل الفلاحين وينالون عن حصة عن حمل كل بعير او ربما يحملون من حقول العزيز والعزيز كان يكيل لهم الحبوب اجرا نتيجة عملهم<br />السادة المتبحرين فى الدين يفيدوننا برايهم<br />ربما كنا مخطئين"
archived = "2009-10-29"
capture_url = "https://web.archive.org/web/20091029053815/http://www.20at.com:80/masr/2khbar/13820-2009-10-26-07-36-10.html"

