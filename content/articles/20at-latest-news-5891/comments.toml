posted = "2007-05-18"
text = "ياعم الشيعة والسنة اخوة ولا فرق بينهم وانة وانة من يفرق بينهم فهو صهيوني يهودي زززز ان قبلة الشيعة هية بيت اللة وانة اذمتعرفين عقية الشيعة اقرئها في كتب الازهر الشريف وكتب ابن تيمية واقول حسبي اللة فيكي وان امريكا وايران قوتان تتصارعن عاى الخليج وشدخل الشيعة وسط الموضوع"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112125131/http://www.20at.com:80/20at/latest-news/5891.html"
