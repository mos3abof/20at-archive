author = "بسلة مسلمة مصرية"
posted = "2007-05-16"
text = "يا عالم دول شيعة<br />الناس دى فى عقيدتها ان من قتل سنى دخل الجنة مثلهم مثل اليهود ؛ الذين يوجد ايضا فى عقيدتهم ان اليهودى الصالح هو من قتل مسلما .<br />هم من سبوا صحابة رسول الله وامهات المسلمين من فوق منابرهم .<br />تخيلوا انهم يسجدوا لقبر الحسين مش لربنا سبحانةوتعالى .<br />مش كفاية ن روحنا فى ايدى الامريكان والاسرائليين لاء وكمان عايزين نسلم نفسنا للشيعة واله ة حرام حرااااااااااااا ااااام"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112125131/http://www.20at.com:80/20at/latest-news/5891.html"

