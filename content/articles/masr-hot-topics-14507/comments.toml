text = "انا شايفة ان عادل امام هو اللى صح لان مدرسة المشاغبين موجودة من زمان جدااااا فاكر دلوقتى الداعى خالد الجندى انه بتكلم فيها وكمان التعليم فى مصر كلنا عارفين انه مش تعليم وكمان فيلم حسن ومرقص ادى الى رسالة مهمة جداااااااااا وهى اتحاد المسلم مع اخوه المسيحى ولقب الزعيم هو لقب يستحقه وهو لقب مثل باقى الالقاب ليه نمسك كل كلمة ونشرحها على مزاجنا سيبوااااااااااا ااااااا الناس فى حالها لو سمحتم"
