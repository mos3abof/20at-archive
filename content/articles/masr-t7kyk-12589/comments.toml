subject = ""
author = "مدرس الاحياء"
posted = "2009-07-14"
text = "مدرس الاحياء واحنا فى اولى ثانوى كان منفلت شوية ومرة شرح لنا مراكز الاحساس فى جسم الانسان وبالذات جسد الانثى<br />وقال لنا لو قابلت بنت الجيران على السلم وعصرت حلمة الثدى هتلاقيها سخسخت<br />وطبعا عملتها<br />وقالت لابوها<br />وابوها قال لابويا وكانت علقة محترمة فى حضور ابوها<br />والمصيبة اننى اتجوزتها بعد كدة لما اتخرجنا من الجامعة"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

[[comments]]
