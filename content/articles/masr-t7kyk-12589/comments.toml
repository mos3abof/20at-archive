subject = ""
author = "البقال الملعون"
posted = "2009-07-12"
text = "وانا فى ستة ابتدائى امى كانت بتبعتنى اشترى طلبات من عند البقال وكان رجل مش ولا بد كان بيستغل عدم وجود زباين ويمد ايدة يتحسس الاجزاء الحساسة فى جسمى ويحتضننى بقوة ويضحك على بشوية حلويات ويقول لى ما تقوليش لامك<br />وانا انصح الامهات بعدم ارسال بناتهم لشراء حاجات من برة لوحدهم لازم يبقى فية واحد معها يحرسها ويبعد عنها ولاد الحرام<br />وربنا ستر معايا لانى مقلعتش هدومى خالص كانت كل حركاتة من برة الهدوم"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

[[comments]]
order = 6
subject = ""
author = "فى كلية الزراعة"
posted = "2009-07-12"
text = "زمان استاذ مادة قال انة يوم الجمعة سيتم عمل زيارة الى مزرعة الكلية لمشاهدة عملية التزاوج فى البقر فذهب الصبيان وانكسفت البنات الا بنت جريئة ذهبت لترى ووقفت فى الخلف تشاهد ما يحدث<br />اخرج العامل البقرة من الحظيرة وربطها فى شجرة ثم بعد ذلك اخرج الثور وقربة من البقرة ولكن الثور تمنع ولم يرضى ان يقترب منها وكان يقف بجانب البقرة بهدوء<br />هنا لجا العامل الى الثور واخذ يدلك فى شعر راسة بين قرنية لمدة ربع ساعة وبعدها هاج الثور وقفز فوق البقرة وتمت المعاشرة بنجاح<br />وفى اليوم التالى سالنا تلك البنت الجريئة عما شاهدت<br />فقالت لقد اكتشفت وعرفت ان لية معظم الرجال صلع"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

[[comments]]
