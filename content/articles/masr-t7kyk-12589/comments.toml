author = "قطط جدتى"
posted = "2009-07-15"
text = "كانت جدتى عجوزة تقيم بمفردها فى شقة فى شبرا وكان معها فى الشقة قطة صغيرة لطيفة ترعاها وتقدم لها الطعام وكانت جدتى تحذرنى ان اطرد قط الجيران اذا اقترب من قطتها فهو قط مجرم شرس على حسب تعبيرها<br />الا ان القطة كانت فى اوقات معينة وفى فصل معين تموء وتنونو كتير جدا وبطريقة متواصلة وكنت اقول لجدتى ان القطة مريضة فتضحك جدتى وسمحت للقط الشرس بالاقتراب منها وتم معاشرتها فهدات القطة وسكتت واصبحت اكثر الفة<br />وشاهدت تلك المعاشرة وانا ابنة سبعة سنين وتقيأت كل الذى فى بطنى"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

