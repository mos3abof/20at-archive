subject = ""
author = "منى ابو سيف"
posted = "2009-08-01"
text = "مشاكل الاسر المصرية وكثرة حالات الطلاق سببها مشاكل الجنسية وعدم توافق الزوجين لعدم الفهم والجهل وعدم الاشباع الجنسى للجنسين مما يتسبب فى التوتر لعدم الارتواء الجنسى فينتج التوتر والعصبية والخلافات لتنتهى بالطلاق<br />مطلوب تعليم الجنس فورا للشباب فهو ليس رفاهية ولا قلة ادب ولا حياء فى الدين"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

