author = "مع الخادمة"
posted = "2009-07-25"
text = "كانت الخادمة الكبيرة تحملنى وتجلسنى على رجليها وتعتصر اعضائى الجنسية فى لذة وانا فى التاسعة ثم تقوم فى نفس الوقت بتانيبى اننى اوسخ ملابسى وتقرصنى فى اماكن حساسة وتقول شايف الوساخة اللى فى هدومك ها اقول لماما<br />واحيانا كانت تدخل الحمام وقت استحمامى لتقوم بعملية غسيلى وانا فى الثامنة بتعليمات من امى وكانت تداعب اعضائى بحجة الغسيل بالصابون وعرفت العادة السرية على يديها"
