text = "وانا فى الاعدادية ذهبت مع امى لزيارة احدى القريبات العجوزات ونمت عندها<br />وفى الليل استيقظت وهى تعرينى من ملابسى وتعمل معى اشياءا لم اعرفها من قبل<br />ولما راتنى مستيقظ هددتنى ان تقول لامى اننى قليل الادب<br />وكان اشبة باغتصاب الامر الذى دمر حياتى بعد ذلك فلم اتزوج ولا انوى الزواج"
