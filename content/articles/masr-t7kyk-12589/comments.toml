subject = ""
author = "فى الاعدادى"
posted = "2009-07-14"
text = "كنت راجع من المدرسة الساعة 3 بعد الظهر وكانت الساحة اللى بيتم بيع الخضار فيها فى الصباح فاضية وكان فية زحمة والناس متحوطة حوالين حاجة بيتفرجوا عليها ومعظمهم عربجية بينقلوا الخضار على العربيات الكارو<br />وكانت اللمة علشان بيعشروا حمار مع حمارة<br />وشفت العملية كاملة على الطبيعة وفى الهواء الطلق وفى وسط الناس وبلا استهجان وان دة عيب يجب سترة<br />لية لانهم حيوانات وبتتكاثر وبيبيعوا المولود الجحش اللى هييجى"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

[[comments]]
