text = "فية قنوات كانت بتيجى من قبرص وبتوصل دمياط وكانت بالليل بتذيع افلام جنسية ولقطات جنسية وكنا بنسهر نتفرج عليها بحجة اننا بنذاكر<br />وفى مرة انزبطت وانضربت علقة محترمة بالحزام وكان يومها اسود"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

[[comments]]
