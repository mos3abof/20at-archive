subject = ""
author = "قهوة الست وزة"
posted = "2009-07-27"
text = "فى حارة ضيقة الست وزة فاتحة اوضة فى بيتها غرزة وبتبيع فيها مخدرات وبتعرض افلام سكس وصديقة لطلبة ثانوى وبتفتح بيتها بعد الساعة عشرة ليلا<br />وبنسهر عندها ساعة وساعتين وبتاخد مبلغ صغير ولها زبائن كتير<br />وتعرفنا عندها نظرى وعملى<br />وهى معلمة<br />وصديقة للشرطة"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

[[comments]]
order = 27
subject = ""
author = "النت"
posted = "2009-07-28"
text = "يوميا تصل رسائل على النت من اماكن مجهولة كلها صور جنس وعرى ومسخرة وهناك جهة ما تفسد شباب هذة الامة"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

