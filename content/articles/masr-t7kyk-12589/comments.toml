posted = "2009-07-12"
text = "كنت وانا صغيرة اسمع امى تتاوة وتتالم بصوت عال وكنت اظن ان ابى يضرب امى فى الليل<br />وعندما كبرت قليلا افهمتنى احد الصديقات انهم يمارسون الجنس<br />فارتبط فى مفهومى الجنس بالالم<br />وانا الان طالبة فى الجامعة واخاف من الزواج جدا لانة مرتبط بالالم الشديد جدا فتاوهات امى لا يمكن نسيانها"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

[[comments]]
