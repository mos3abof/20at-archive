subject = ""
author = "اولى ثانوى"
posted = "2009-07-13"
text = "فى اولى ثانوى فى اجازة الصيف ماما وبابا كانوا بيروحوا الشغل وكان فية واحدة ست عجوزة شوية بتييجى مرة البيت كل اسبوع ساعتين او تلاتة تنظف البيت وتغسل المواعين<br />وكنت نايم فدخلت على الاوضة وقالت لى تييجى نلعب عريس وعروسة فقلت لها ازاى قالت لى ها اعلمك اللعبة<br />واستمر الحال حتى اصبت بمرض صدرى وتعالجت منة ثم سافرت مع اسرتى الى دولة كان ابى معارا فيها"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

[[comments]]
order = 10
subject = ""
author = "مصرى"
posted = "2009-07-14"
text = "زمان لما كان التعليم تعليم بجد فى الفترة الناصرية اللى درس ايامها احمد زويل وغيرة وغيرة وغيرة كان فية تعليم جنس ولكن تحت مسمى اخر جانب يقوم بة مدرس الدين او مدرسة الدين وجانب تانى مدرس الاحياء فى التعليم الثانوى<br />يعنى مدرس الدين كان بيشرح التطهر من الجنابة وحلق شعر العانة يعنى النظافة الشخصية وحرمة الجماع اثناء الحيض والتودد للنساء قبل المعاشرة والاداب الدينية الرائعة قبل المعاشرة الجنسية وطبعا كان بيتطرق الى يعنى اية جماع ومتى وكيف ولماذا وكذلك مدرسة الدين عند البنات كانت بتشرح الطهارة من الدورة الشهرية والنظافة الشخصية ويعنى اية دورة شهرية<br />ومدرس الاحياء كان يشرح الاعضاء والدورة الجنسية عند الرجل والمراة<br />وكانوا بيقولوا لنا بطريقة مهذبة<br />اية اللى حصل فى التعليم مش عارف<br />كل بلاوينا بسبب انهيار التعليم"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

[[comments]]
order = 11
subject = ""
author = "من الف ليلة وليلة"
posted = "2009-07-14"
text = "كان فية كتاب قديم مكتوب بحبر الكوبيا وخط اليد فى مكتبة عمى عن طبعة شعبية لالف ليلة وليلة بالعامية المصرية وكانت فية صور بسيطة بخط اليد لنساء عاريات واشعار عامية كلها تتكلم عن اعضاء الرجل واعضاء الانثى وشعر فاحش جدا عامى<br />ومن الغريب ان تلك المكتبة احترقت وقضيت سنين طوال افتش عن هذا الكتاب الاثرى فى شوارع الازهر والحسين ولكنة اختفى تماما ككتاب جنسى كان يتداول فى السر اسمة مذكرات ايفا كتبتة عاهرة فرنسية بعد فترة خدمة طويلة فى المهنة"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

[[comments]]
