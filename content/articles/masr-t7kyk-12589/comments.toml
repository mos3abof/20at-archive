[[comments]]
order = 32
subject = ""
author = "االجنس"
posted = "2009-08-02"
text = "العلامة فرويد رائد علم النفس قال ان الجنس غريزة زى الاكل وزى الشرب وهو حاجة طبيعية جدا ومش محتاجة اى تعقيدات ولازم الانسان زى ما بياكل ويشرب يمارس الجنس لانة اقوى غريزة عندة<br />والاديان نظمت العملية دى وحددت امتى يبقى حلال وامتى يبقى حرام وطبعا يبقى مخبول اللى يحرم الجنس<br />اعرف صديقا لم يتزوج ولم يمارس الجنس اطلاقا ولا حتى العادة السرية لانة كان مثاليا جدا مات فى سن التلاتين بسرطان نتج عن تضخم البروستاتا<br />البروستاتا لازم تفضى كل شوية والا هتتضخم وبعدين تييجى مشاكل<br />تزوجوا ومارسوا حياتكم الطبيعية<br />وملعون ابو الفقر"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811010734/http://www.20at.com:80/masr/t7kyk/12589-2009-07-07-12-24-20.html"

