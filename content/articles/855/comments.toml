[[comments]]
order = 2
subject = "أمرنا النبي بالتحذير من أدعياء العلم وخطباء السوء.. متى نحذر منهم؟"
author = "ناصح محمد ءامين"
posted = "2006-06-12"
text = "الحمد لله رب العالمين، وصلوات الله البر الرحيم على حبيبنا سيد السادات محمد، وعلى ءاله وصحبه أجمعين،<br />صدق رسول الله صلى الله عليه وسلم في قوله :\"إن الناسَ إذا رأَوُا المنكر فلَم يغيّروه أوشك أن يعمَّهُمُ الله بعقاب\". وقد يُرى ذلك في كثير من النواحي من بلاد المسلمين. بسبب ترك الأمر بالمعروف والنهي عن المنكر بالطريقة الشرعية، أصاب الله تعالى الناس بالبلاء."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124032/http://www.20at.com/article2.php?sid=914"

[[comments]]
order = 3
subject = "تنبيه الى الاخت هبة الله أحمد"
author = "ناصح محمد ءامين"
posted = "2006-06-12"
text = "متى يجب التحذير من أدعياء العلم والمشيخة؟..<br />لما ينحرفوا عن ما اتفق عليه جمهور علماء أمة النبي محمد صلى الله عليه وسلم، يجوز التحذير منهم بل يجب شرعاً أن نحذر الناس منهم ومن انحرافهم عن أهل الحق. فقد قال رسول الله : \"إذا رأيت أمتي تهاب أن تقول للظالم يا ظالم فقد تودع منهم. لا تبكوا على الدين إذا وليه أهله ولكن ابكوا عليه إذا وليه غير أهله.\"<br />وقال ربنا تبارك وتعالى: (ولتكن منكم أمة يدعون إلى الخير ويأمرون بالمعروف وينهون عن المنكر).<br />وروى الإمام أحمد من طريق اسماعيل بن أبي خالد عن قيس بن أبي حازم قال: قام أبو بكر رضي الله عنه فحمد الله وأثنى عليه ثم قال: يا أيها الناس أنكم تقرءون هذه الآية: (يا أيها الذين ءامنوا عليكم أنفسَكم لا يضركم من ضل إذا اهتديتم) وإنّـا سمعنا رسول الله صلى الله عليه وسلم يقول: \"إن الناس إذا رأوا المنكر فلم يغيروه أوشك أن يعمهم الله بعقابه\".<br />أخي المسلم، لا تقل: ما لي وللناس ليفعلوا ما يريدون ويشربوا ما يحبون. بل كن داعياً الى الرشاد والفلاح وساعياً الى الخير والنجاح، وامر بالمعروف وانه عن المنكر بالحكمة والموعظة الحسنة. تذكر حديث رسول الله صلى الله عليه وسلم : \" من دعا إلى هدى كان له من الاجر مثل أجور من تبعه لا ينقص ذلك من أجورهم شيئا ومن دعا الى ضلالة كان عليه من الاثم مثل آثام من تبعه لا ينقص ذلك من آثامهم شيئاً \". رواه مسلم.<br />المسلمون المعتدلون بين التطرف والتقصير والافراط والتفريط قال تعالى: (وَكَذَلِكَ جَعَلْنَاكُمْ أُمَّةً وَسَطًا لِّتَكُونُواْ شُهَدَاء عَلَى النَّاسِ وَيَكُونَ الرَّسُولُ عَلَيْكُمْ شَهِيدًا). ويقول النبي عليه الصلاة والسلام: \"ستفترق أمتي إلى ثلاث وسبعين فرقة كلهم في النار إلا واحدة وهي ما أنا عليه وأصحابي\" رواه الترمذي في كتاب شعب الايمان.<br />وقال صلى الله عليه وسلم: \"عليكم بالجماعة وإياكم والفرقة\" صححه الحاكم. وقال الإمام الطحاوي رحمه الله (وهو من علماء الحنفية الماتريدية): \"ونرى الجماعة حقاً وصواباً والفرقة زيغاً وعذاباً ونسأل الله أن يثبتنا على الإيمان ويختم لنا به ويعصمنا من الأهواء والآراء المتفرقة والمذاهب الردية مثل المشبهة والمعتزلة والجهمية والجبرية والقدرية وغيرهم من الذين خالفوا السنة والجماعة وحالفوا الضلال. ونحن منهم براء وهم عندنا ضلاّّل وأردياء وبالله.<br />ثبتنا الله واياكم على نصرة وخدمة هذا الدين، وأماتنا على كامل الإيمان."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124032/http://www.20at.com/article2.php?sid=914"

[[comments]]
order = 4
subject = "الكتاب خير جليس صح ومعك حق ولكن"
author = "الشيخ أويس القرشي"
posted = "2006-06-12"
text = "وكما قالوا أن الكتاب خير جليس، فهو أيضا خير معين علي إنعاش إيمانياتك، فتقول (هاله عبد الهادي): \"رغم أن القراءة ليست من هواياتي المفضلة، إلا أنه لا غني عنها في أحيان كثيرة، خاصة عندما تنقل إليك مشاعر إيمانية بهذا التأثير، فانا لا استطيع نسيان ما شعرت به عند انتهائي من كتاب (أفراح الروح) (ل سيد قطب\").<br />الى الاخت هبة احمد عرفت اشياء وغابت عنك اشياء<br />الكتاب خير جليس صح،ولكن علينا ان نختار كتاب لاهل الحق المعتدلين،وهم كثر، وليس كتاب اهل التطرف والقتل وتكفير المسلمين واباحة دمائهم،وكل ما حصل ويحصل في مصر ولبنان والمغرب والجزائر وبلدناالاسلامية من افكار صاحب هذا الكتاب صاحب الفكر الاسودالمطترف عنيت به(المفكر الصحفي سيد كتب)او سيد قطب)الذي قال في كتبه ما يسمى في ظلال القرءان(ارتدت البشرية بجملتها<br />سيد قطب كفر الأمة الإسلامية قاطبة وبدون استثناء.<br />يكفيه من الخزي ما امتلأ به كتابه (الظلال) ومما قال في الجزء الثالث ص1257طبعة دار الشروق بأن ((الإسلام اليوم متوقف عن الوجود مجرد الوجود وإننا في مجتمع جاهلي مشرك . ا هـ .))<br />فمن الذي كفر الأمة?<br />قال رجل من جماعة فيصل مولوي من ءال حوا ((يجوز لنا إذا أردنا ن نقتل إنسانا اختبأ في قرية فيها سبعمائة شخص أن نقتل السبعمائة لأجل أن نقتل هذا الواحد.)) !!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124032/http://www.20at.com/article2.php?sid=914"

[[comments]]
order = 5
subject = "نصحية الى هبة احمد"
author = "الشيخ أويس القرشي"
posted = "2006-06-12"
text = "ستمع ياهبة الله احمدإلى سيد قطب الذي تعظمه وتحث على كتبه وطريقته ماذا يقول عن الفقه في كتابه الظلال الجزء الرابع ص2012 طبعة دار الشروق يقول<br />: (( إن العمل في الحقل الفكري للفقه الإسلامي عمل مريح لأنه لا خطر فيه ولكنه ليس عملا للإسلام لا هو من منهج هذا الدين ولا من طبيعته وخير للذين ينشدون الراحة والسلامة أن يشتغلوا بالأدب والفن أو بالتجارة أما الاشتغال بالفقه الآن على ذلك النحو بوصفه عملا للإسلام في هذه الفترة فأحسب والله أعلم أنه مضيعة للعمر وللأجر أيضا )) .<br />فما رأيك بزعيمك ياهبة الله أحمد الذي اعتبر العمل بالفقه مضيعة للأجر والعمر بل اعتبر عمل الفن كالرقص والغناء أحسن من العمل في مجال الفقه ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124032/http://www.20at.com/article2.php?sid=914"

[[comments]]
order = 6
subject = "الى هبة احمد"
author = "الشيخ أويس القرشي"
posted = "2006-06-12"
text = "هذا المنحرف الذي يسمي سيد قطب يحسب التفقه بالدين مضيعة للعمر<br />والرسول عليه افضل الصلاة والسلام<br />يقول ويرد على هذا المنحرفمن خرج في طلب العلم في سبيل الله حتى يرجع \"<br />والذي قال (إنَّ الملآئكةَ لتضعُ أجنِحَتها لطالبِ العلمِ رضىً بما يصنع) رواه الإمامُ مسلمٌ<br />\"طَلبُ العلمِ فريضةٌ على كلِّ مسلم رواه البيهقيّ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124032/http://www.20at.com/article2.php?sid=914"
