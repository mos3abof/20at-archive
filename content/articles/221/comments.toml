[[comments]]
order = 0
subject = "وائل عباس"
text = "يا جماعة خلي الغلابة تفرح<br />اهو ده المكان الوحيد اللي الواحد ممكن يسترجع فيه ذكريات الجنيه المصري قبل التعويم والتغطيس والغسيل والفرد والمكوة<br />اي نعم الجنيه ما يجيبشي حاجة برضه<br />يمكن قزازة حاجة ساقعة صاروخ مثلا<br />لكن العشرة جنيه اللي قربنا نحس ان هي كمان ما تساويش ... هناك تجيب اربع حاجات<br />اهو اي تفاريح في الزمن الكالح اللي احنا عايشينه ده ..."
archived = "2004-09-08"
capture_url = "https://web.archive.org/web/20040908100626/http://www.20at.com:80/article.php?sid=592"

[[comments]]
order = 1
subject = "وائل عباس"
text = "يعني نقارن ده مثلا بكارفور<br />الواحد بيخش كارفور بيقول ده انا عاوزلي عشرتلاف جنيه مرتب علشان اقدر افتح بيت ...<br />اهو اي حاجة تدينا امل وهمي ان الدنيا لسه بخير ..."
archived = "2004-09-08"
capture_url = "https://web.archive.org/web/20040908100626/http://www.20at.com:80/article.php?sid=592"

[[comments]]
order = 2
subject = "فطرة"
text = "الموضوع حلو جدا .... بس كله علي بعضه عبارة عن جر شكل ...يعني لا أنت اهملت الظاهرة ولا انت استغرقت في الكلام ...يعني عديت وسلمت وخلاص كدة<br />هو ده حلو طبعا ...بس يا ريت ميتكررش تاني"
archived = "2004-09-08"
capture_url = "https://web.archive.org/web/20040908100626/http://www.20at.com:80/article.php?sid=592"

[[comments]]
order = 3
subject = "فكرة"
text = "المحلات دي فعلا نكتة ومفيدة جدا ....مع اني مقتنعة تماما انها موش بتكسب بس يالا ../صائب قوم عند قوم فوائد....!!"
archived = "2004-09-08"
capture_url = "https://web.archive.org/web/20040908100626/http://www.20at.com:80/article.php?sid=592"

[[comments]]
order = 4
subject = "حمامة بتاع التليفونات"
text = "أنا عندي محل من اياهم ....<br />والله يا جماعة الموضوع لذيذ وماشي يعني ..<br />واللهم لا حسد بيكسب والعجلة ماشية وقربنا نسدد القرض ويمكن اتجوز الصيف الجاي بس ادعولي ...<br />وبما ان ده اول تعليق ليا انتهزها فرصة واحي وائل عباس علي تعليقاته اللذيذة وآرائه الغريبة والشاذة وهجومه الجبار علي بيرو وامثاله ,,,<br />ربنا يكرمك ونشوفك نقيب الصحفيين الأليكترونيين ...في حياتي ان شاء الله"
archived = "2004-09-08"
capture_url = "https://web.archive.org/web/20040908100626/http://www.20at.com:80/article.php?sid=592"

[[comments]]
order = 5
subject = "بنت والسلام"
text = "في السعودية المحلات دي اسمها (( أبو ريالين))<br />أنا كنت بحبها زمان عشان أشتري توك وصور استيكرات وهبالة كدة<br />لكن متهيألي دلوقت كبرت وبطلت<br />لكن فعلا بتكون فيها هدايا حلوة ميد ان تشاينا تحف صغيرة كدة وحجات تفرح<br />والصراحة الهدية مش بقيمتها<br />الهدية باللي جاية منه<br />يعني لو حد بكرهه وجب لي هدية بمليون ريال هكسرها على راسه فعلا<br />لكن لو حد بحبه وجب لي هدية حتى بنص ريال هطير بيها<br />(آه يا عم الرومانسي)<br />أوعى وشك"
archived = "2004-09-08"
capture_url = "https://web.archive.org/web/20040908100626/http://www.20at.com:80/article.php?sid=592"
