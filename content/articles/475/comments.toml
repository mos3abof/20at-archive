[[comments]]
order = 0
subject = "مصـ( الخير )ـعب"
text = "الله على الفكرة دي<br />ربنا يبارك فيكم يا شباب<br />و \"يللا نحب زي نبينا\"<br />صلى الله عليه وسلم<br />وتاني مرة ربنا يباركلكم يا شباب عشرينات ويا شباب كل الطلبة"
archived = "2005-02-25"
capture_url = "https://web.archive.org/web/20050225083959/http://www.20at.com:80/article.php?sid=980"

[[comments]]
order = 1
subject = "يلا نحب بجد = يلا نحب زي نبينا"
text = "إلى الأمام يا شباب مصر ويا شباب موقع كل الطلبة وجامعة القاهرة ، كل شوية بيفاجؤونا بحاجات رائعة<br />ربنا يتقبل منهم وبالتوفيق ان شاء الله"
archived = "2005-02-25"
capture_url = "https://web.archive.org/web/20050225083959/http://www.20at.com:80/article.php?sid=980"

[[comments]]
order = 2
subject = "samozean"
text = "اى حا جه تا يجى من رحت الحبا يب بطمن قلبى الطاب عنى غا يب<br />وشكرااااااااااا"
archived = "2005-02-25"
capture_url = "https://web.archive.org/web/20050225083959/http://www.20at.com:80/article.php?sid=980"

[[comments]]
order = 3
subject = "فكره جميله فعلا"
text = "ما شاء الله فعلا فكره جميله"
archived = "2005-02-25"
capture_url = "https://web.archive.org/web/20050225083959/http://www.20at.com:80/article.php?sid=980"

[[comments]]
order = 4
subject = "اوشو"
text = "السلام عليكم<br />فكرة ماشاء الله جميلة<br />بارك الله فيمن ابتكرها<br />ودورنا اننا ننشر<br />احبكم فى الله"
archived = "2005-02-25"
capture_url = "https://web.archive.org/web/20050225083959/http://www.20at.com:80/article.php?sid=980"

[[comments]]
order = 5
subject = "فكرة رائعة"
text = "فكرة جميلة جدددددا اللة يبارك فيكم يا شباب ويكثر من امثالكم و يبعد عننا التفاهات قولو امين امين امين يا رب العالمين"
archived = "2005-02-25"
capture_url = "https://web.archive.org/web/20050225083959/http://www.20at.com:80/article.php?sid=980"

[[comments]]
