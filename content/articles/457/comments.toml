[[comments]]
order = 10
subject = "بيان من مجاهدي الفلوجة"
text = "بسم الله الرحمن الرحيم والصلاة والسلام على أشرف الخلق<br />سيدنا محمد وعلى آله وصحبه أجمعين :<br />بغداد _ أ.ف.ب :<br />بيان من مجاهدي الفلوجة بتاريخ<br />20/11/2004<br />الحصيلة النهائية لخسائر قوات الاحتلال في الفلوجة :<br />1 _ إسقاط طائرتين نوع ( إف – 16 )<br />2 _ إسقاط 11 مروحية .<br />3 _ إسقاط ( 5 ) طائرات بدون طيار .<br />4 _ مروحية نقل طراز \" شينوك \" على متنها 60 جندي .<br />الاعتقالات<br />126 جندي أمريكي<br />133 جندي عراقي موالي<br />15 جندي بريطاني<br />التدمير والقتل للعدو المحتل<br />11 دبابة طراز امبراز .<br />9 مركبات عسكرية .<br />13 هامفيز .<br />400 جندي أمريكي قتلوا<br />140 جندي عراقي موالين قتلوا .<br />ولم تحتل القوات الأمريكية سوى 20% من الفلوجة<br />إن ينصركم الله فلا غالب لكم<br />الله أكبر و لله الحمد"
archived = "2005-02-12"
capture_url = "https://web.archive.org/web/20050212095228/http://www.20at.com:80/article.php?sid=768"

