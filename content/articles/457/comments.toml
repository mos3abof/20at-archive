[[comments]]
order = 18
subject = "فين أخبار المقاومة"
text = "الأخوة الكرام المتشككين في الخبر الرجاء مشاهدة أي نشرة أخبار سواء للجزيرة أو العربية ولنلاحظ سويا اذا كان هناك خبر واحد يذكر عمليات للمقاومة ونراجع ايضاً لماذا إلي الآن لم يعد أهل الفلوجة إلي مدينتهم غذا كانت القوات الأمريكية قد احكمت السيطرة عليها كما تتدعي.؟!<br />ولماذا لا تدخل وسائل الإعلام \"الطبيعية\" أي غير المرافقة للقوات الأمريكية وتتبع مراقبتها المباشرة علي كل خبر أو صورة ينقلها الصحفيين.؟!<br />والحقيقة التي لا خلاف عليها ولم ينكرهاا أحد ان جميع وسائل الإعلام طردت من الفلوجة وجميع وسائل الإعلام محكومة بقبضة الرقابة الأمريكية وما يتم تسريبه من أخبار نحاول نشره<br />وهذا الخبر تحديدا وجدناه علي موقع نثق في مصداقيته و هو موقع مفكرة الإسلام وأكدته الصور من موقع أنصار الإسلام الموقع الذي تنشر عليه كل بيانات المقاومة الإسلامية ولأن الصورة أبلغ من مئة كلمة والصور تابعت الخبر كلمة بكلمة ومعلومة بمعلومة فلم نجد غضاضة في نشرة.<br />اما لماذا لم ينشر هذا الخبر في موقع آخر أو وكالة أنباء أخري فهذا يسأل فيه أصحاب الشأن أما نحن فنحاول تحري الصدق بقدر الإمكان بالإضافة إلي أننا معنيين بشكل خاص بكسر التعتيم الإعلامي علي معركة الفلوجة لما نقدره من أهمية هذه المعركة ولأهمية الإعلام في حسم هذه المعركة<br />والله المستعان"
archived = "2005-02-12"
capture_url = "https://web.archive.org/web/20050212095228/http://www.20at.com:80/article.php?sid=768"

