subject = "غيورة"
text = "الله الله<br />الله مع المقاومةيؤيدها وينصرها<br />وبالمناسبة حبيت اقول لكل شيخ من شيوخ هذا الزمان<br />بطلوا بقى اسكتوا احسن<br />لانه كلمة مدنيين عندما تطلقونها على امريكان داخل العراق او فى فلسطين تستفزنا ابشع استفزاز ووفروا فتاواكم لانفسكم حتى تبرروا بها تقاعسكم عن نصرة الاسلام والمسلمين الذبوحين هنا وهناك<br />فلا تحملوا وزر تشويه صورة المقاومة والجهاد<br />فالعراق _ في رأيي _ كاليتيم بلا اهل والمسؤلون الوحيدون الان عنه هم المقاومةفهم عندما يحذروا العرب والاجانب من كافة انحاء الدنيا بانه من دخل العراق تحت حماية او مع الامريكان تحت اي مسمى من المسميات فهذا من حقهم ولا لوم عليهم ان قتلوا من لم يلتزم بتلعيماتهم لانه ليس امامهم سوى هذا الطريق لتحرير تراب العراق العريق من نجاسة لحقت به وستزول ان شاء الله وشكرا"
archived = "2004-11-23"
capture_url = "https://web.archive.org/web/20041123124846/http://www.20at.com:80/article.php?sid=768"

