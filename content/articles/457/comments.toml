[[comments]]
order = 12
subject = "كسر الطوق عن حرب التعتيم الإعلامي"
text = "مفكرة الإسلام [خـاص]: في تطور جديد على صعيد الأوضاع الميدانية في مدينة الفلوجة، قام مقاتلو المقاومة العراقية حول الفلوجة بإطلاق ثلاث صواريخ [غير عادية] باتجاه القوات الأمريكية المتمركزة في بساتين 'البوعرين' شمال غربي الفلوجة.<br />وقال مراسل 'مفكرة الإسلام': إن غبارًا أبيض ارتفع من المنطقة التي ضربها القصف الصاروخي، وعلى إثر ذلك قامت القوات الأمريكية بحمل قتلاها وجرحاها بواسطة 4 طائرات من طراز شينوك العملاقة.<br />وأضاف مراسلنا أن المقاومة استغلت انشغال القوات الأمريكية بالقصف الصاروخي والآثار الناجمة عنه في كسر الطوق عن شمال غربي حي الجولان، حيث قامت بالدخول إلى الحي، وكان ذلك عند الساعة التاسعة والنصف مساءً بالتوقيت المحلي من يوم أمس الاثنين.<br />وتعد هذه العملية هي ثاني عملية استثنائية تنفذها المقاومة العراقية انتقامًا لما أقدمت عليه القوات الأمريكية من عملية إبادة بالغازات السامة والأسلحة الكيماوية ضد أهالي الفلوجة من المدنيين العزل من النساء والأطفال وكبار السن.<br />هذا، ولم نستطع الوقوف على حجم الخسائر التي أصابت القوات الأمريكية في هذه العملية، غير أن مراسلنا استطاع تحديد عدد المروحيات الأمريكية التي قامت بنقل الجرحى والقتلى، وهو الأمر الذي يدلل على ضخامة حجم الخسائر في صفوف القوات المحتلة؛ حيث إن طائرة الشينوك يصل أقصى حد للجنود عليها ما يقارب من 70 إلى 80 جنديًا، وهذا في الحالات الحالية، أما في الظروف الاستثنائية فإن القوات الأمريكية تقوم بتكديس القتلى والجرحى في الطائرة."
archived = "2005-02-12"
capture_url = "https://web.archive.org/web/20050212095228/http://www.20at.com:80/article.php?sid=768"

