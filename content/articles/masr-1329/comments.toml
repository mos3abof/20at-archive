[[comments]]
order = 13
subject = "وجهه نظر"
author = "نيفين نيفى نوفا"
posted = "2006-12-25"
text = "فعلا جميل يا اميره<br />و رغم ان القصه دراميا عاديه بس فعلا لو الكاتبه بتدخل ف عمق الشخصيه زى ما وصفتى كدا هجيب الروايه دى و اقراها ان شاء الله<br />و الاجمل ان فكره د.ريم بينادى بيها كتاب كتير ف كتاباتهم و هى السبب ف فشل علاقات كتير فعلا و هى ان كل طرف بيظهر على عكس ما فيه متناسيا ان ممكن طبيعته تكون احسن من التظاهر<br />علشان كدا بمرور الزمن ممكن يزيد الحب لان كل طرف بيظهر الجميل اللى عنده<br />مش الجميل اللى كان بيصطنعه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102828/http://masr.20at.com:80/article.php?sid=1329"

[[comments]]
order = 14
subject = "حقا مبدعه"
author = "سندباد"
posted = "2006-12-26"
text = "لا ادري ماذا اقول غير انك اروع من تناول تحليل والتعليق عن روايه حقا لقد ابدعتي في وصف وتجسيد فكر المبدعه والمؤلفه في شخصياتها الرائعه<br />لقد احسست بالروايه من احساسك وكأني اقرائها بعينيكي وبعقلك حقا استمتع بتناولك للروايه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102828/http://masr.20at.com:80/article.php?sid=1329"

