[[comments]]
order = 7
subject = "هكذا هو الحب"
author = "أميرة هشام"
posted = "2006-12-20"
text = "مقال رائع يااميرة بحييكي عليه<br />وعلي فكرة انا هروح اقرا الرواية كدة بسببك لانها واضح انها اكثر من رائعة<br />وواضح انها تحمل الكثير من معاني الرومانسية<br />وفعلا للحب لحظة سحرية يولد فيها<br />قد يعيش اتنين سويا ويحمل كلا منهما للاخر الحب ولكنه لايدرك ذلك ويتعلل بحب شخص اخر<br />لتأتي لحظة سحرية ويعترف فيها الطرفين يحبهمايكون بداخلهما زمن طويييييل<br />ولكنه يقرر ان يولد في هذه اللحظة فقط-اللحظة السحرية-<br />تحياتي لك يااميرة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102828/http://masr.20at.com:80/article.php?sid=1329"

[[comments]]
order = 8
subject = "برافو"
author = "ديمة"
posted = "2006-12-20"
text = "طريقة عرضك للرواية هى الاكثر جاذبية، تفاضيل القصة جعلنى فى اول فقرتين اقول انها معتادة ولاتستحق العرض لكن بحثك عن الفلسفة التى قصدتها او لم تقصدها الكاتبة وابطالها كانت رائعة خاصة الجملة الاخيرة وهى لما لا نتحرر اذا جاءنا الحب"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102828/http://masr.20at.com:80/article.php?sid=1329"

[[comments]]
order = 9
subject = "هايل"
author = "سالي"
posted = "2006-12-20"
text = "لم أقرأ الرواية لكن بعد ان قرأت العرض اشعر برغبة في قرائتها.<br />ارجو الا تكون الكاتبة صديقتك وهذا كل ما في الامر.<br />كثيرون يسعون وراء ما لا يستحق .........<br />ويتركون ورائهم ما هو اغلى كثيرا مما يسعون اليه.<br />ولكن من يملك القدرة على الفهم ، ولا يسعى حثيثا في اتجاه الندم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102828/http://masr.20at.com:80/article.php?sid=1329"

