[[comments]]
order = 1
subject = "zohor135@hotmail.com"
text = "موضوع رائع يامي وفي وقته بالنسبة لي ذكرتيني ب الاذكار<br />ذكَرك الله بكل خير<br />دعاء الهم والحزن ((اللهم إني أعوذ بك من الهم والحزن، والعجز والكسل، والبخل والجبن، وضلع الدين وغلبة الرجال)) وهو أيضا من اذكار الصباح والمساء<br />صباح ومساء يعنى أن دينا لم يترك شيء في يومنا إلا وعُني به"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040216/http://www.20at.com:80/article.php?sid=578"

[[comments]]
order = 2
subject = "فانيليا"
text = "موضوع جميل يا مي, بس أنا نفسي أعرف مالها اليوجا, والله زي الفل, أنا في شوية حاجات كده بعملها زائد اللي إنت ذكرتيه في موضوعك يا مي لما بكون متضايقة شوية أو مكتئبة :-<br />* المشي لفترات طويلة مع الذكر.<br />* بعض تمرينات اليوجا الخفيفة و السهلة.<br />* سماع الموسيقى الكلاسيكية خصوصاً سيمفونيات بيتهوفن, باخ, موزارت, فيفالدي, جورج بيزيه, يوهان شتراوس, شوبرت, شوبان.<br />و بعدين مساعدة الضعفاء و الفقراء دي فكرة أكتر من ممتازة,بس عايزة أضيف نقطة على النقطين اللي إنت قلتيهم غير إن الفعل ده بيجعل الإنسان المكتئب قادر على الإنجاز و التأثير, و يكسبه حب الناس.<br />في حاجة أهم بكتير و هي :-<br />إن الشخص لما بيشوف الناس اللي أقل منه في مستوى المعيشة و بيشوف إن مشاكلهم و إحباطتهم أكبر من ضيقه و إكتئابه بكتير, بينظر لمشاكله على إنها بسيطة و بيقدر يتغلب على إكتئابه.<br />و بعدين الأخت اللي بتسمع كاظم الساهر لازم تعرف إنه أساساً بيجيب الإكتئاب, مالها الموسيقى الخفيفة... يا ستي إسمعي قرآن أحسن...قال كاظم قال..."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040216/http://www.20at.com:80/article.php?sid=578"

[[comments]]
order = 3
subject = "مفيش فايدة"
text = "ونعم بالله .. ملناش حد غيره<br />لكن كل حاجة حوالينا بتخلينا نموت نموت بجد<br />لاكاظم ولا يوجا ولا انفجار حتى يعمل حاجة<br />هي رحمة ربنا<br />يارب أرحمنا بقىىىىىىىىىىىىىىىى"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040216/http://www.20at.com:80/article.php?sid=578"

[[comments]]
order = 4
subject = "فانيليا"
text = "جرى إيه يا أخ و لا يا أخت ياللي بتقول مافيش فايدة... بتفكرني بهاني رمزي ( مسعود ) في مسرحية وجهة نظر,أنا عارفةطبعاً إن رحمة ربنا بعباده وسعت كل شئ, لكن نظام اليأس و الإستسلام ده بيزيد الطينة بلة, ربنا قالنا نأخذ بالأسباب, يبقى كل فرد لازم يعرف القوة الكامنة بداخله و يوجهها صح, و بعدين ده لو حتى كل حاجة حوالينا سيئة و فضلنا نرمي حزننا و مشاكلنا على الظروف و الحظ و القدر و نقول يا رب ساعدنا و إحنا مبنساعدش نفسنا يبقى فعلاً إحنا لا نستحق الحياة, و ساعتها فعلاً بنكون إحنا اللي بنموت نفسنا مش اللي حوالينا هو اللي بيخلينا نموت بجد !!!!!!!!!!<br />و إنت عايز ربنا يرحمك لما تقوله يا رب إرحمنا بقى...قال بقى قال... هو ربنا ماكنش رحمك قبل كده...أستغفر الله العظيم...<br />و بعدين جربت اليوجا قبل كده و منفعتش...أراهنك و لا حتى تعرفها...<br />سلام يا عم اليائس..."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040216/http://www.20at.com:80/article.php?sid=578"

[[comments]]
order = 5
subject = "نونا الي مفيش فايدة ....... حول"
text = "يا اختي الجميلة<br />في اية طبعا انا مش حفظها .. استني اجيبها .. هولد اون يا عزيزتي<br />اهي وجدتها اقرائي و ردي<br />قوله تعالى: { ولا تيأسوا من روح الله، إنه لا ييأس من روح الله إلا القوم الكافرون } [ سورة يوسف: الآية 87 ]"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040216/http://www.20at.com:80/article.php?sid=578"

[[comments]]
order = 6
subject = "وحدة ميتة"
text = "يعني دي بجد طريقة تكلم بيها حد مدايق وحزين يا استاذ فانيليا .. انتى من جماعة اقطع عرق وسيح دم ولا ايه .. بعدين انت متعرفش ظروفي حاجة أصلا متتخيلهاش وأنا بقدرة ربنا لسا بتنفس أصلا .. بشويش على الناس ياابني .. وانا بجد غلطت لما قلت يارب ارحمني بقى لكني كنت ميتة من العياط ومش حاسة بالدنيا .. وكويس انك نبهتني عشان مفتحش النت تاني ولا اقرا أي حاجة وانا بعيط وشكرا"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040216/http://www.20at.com:80/article.php?sid=578"

[[comments]]
order = 7
subject = "من فانيليا إلى واحدة لسه ما ماتتش"
text = "أولاً أنا مش واحد, أنا واحدة.<br />ثانياً أنا لا بقطع عرق و لا بسيح دمه.<br />كل اللي عايزة أقوله إن مهما كانت مشاكلك و إحباطاتك, فأكيد في حد مر بنفس التجربة أو يمكن أسوأ منها... و بيتغلب عليها و بيفضل عايش و زي الفل لا بيموت و لا غيره.<br />أرجو إنك تكوني استوعبتي الكلام اللي أنا قلته في التعليق قبل كده, و فكري فيه كويس...<br />و نصيحة أخيرة لوجه الله... إوعي في ياتك تاخدي أي قرار أو تحكمي على أي شئ أو تكتبي أي تعليق و إنتي بتعيطي... خدي و قتك في التفكير الأول حتى لا تندمي على أي شئ قلتيه أو عملتيه.<br />cheer up ba2a, coz life just go on and on and on....."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926040216/http://www.20at.com:80/article.php?sid=578"
