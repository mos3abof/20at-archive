[[comments]]
order = 0
subject = "انكار واستنكار الاهل"
author = "انا مش مستغربة من حالته"
posted = "2005-12-15"
text = "لاني انا كمان بعد تخرجي من كلية<br />الطب برضه محستش اني انجزت اي شيء<br />وعلي طول شاردة وبنام فترات طويلة<br />طبعا لما فاتحت والدتي في رغبتي اني<br />اروح لطبيب نفسي استغربت اوي<br />مش عارفة ليه لازم ننتظر حدوث حاجة وحشة<br />عشان نلجا للمساعدة.انا مقدرتشاصبر واضطريت اروح لطبيبة نفسية ورغم اني رحت<br />مرتين فقط لكن ارتحت واخدت الدوا<br />اللي وصفته بس الخوف دلوقت من استنكار اهلي رغم انهم كلهم متعلمين وبعضهم اطباء.انا شايفة ان لازم الناس كلها تعرف ان في حاجة اسمها طب نفسي و في علاج للتوتر العصبي والاكتئاب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134730/http://www.20at.com/article2.php?sid=87"

[[comments]]
order = 1
subject = "ابداء راي"
author = "حسناء"
posted = "2005-12-15"
text = "السلام عليكم<br />انا بحيك علي انك تطرقت لهدا الموضوع الدي يسبب احراج لبعض الناس مع اني اراي اننا كلنا في حاجة الي دكتور نفساني نضرا للضروف التي تعشها المجتمعات بصفة عامة من بطالة وقلة الايمان واسباب تانية تترك الانسان يفقد اعصابه وبالتالي يكون في حاجة الي طبيب نفساني لكن للاسف معضهم يعتقد انه ادا دهب الي الدكتور النفساني فان الناس تندر له كانه مجنون لكن اعتقد دا كان من سنوات ماضت اما الان فاغلبتهم لديهم وعي وتقافةتجعلهم يعرفون ان العلاج النفساني اصبح عادي وضروري كدلك والله الموفق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134730/http://www.20at.com/article2.php?sid=87"

[[comments]]
order = 2
subject = "المعاصي سبب الاكتئاب"
author = "إن ما ينبغي أن يعلمه كل مسلم أن المعاصي تسبب الاكتئاب ، اقرؤا -ان شئتم قوله تعالى : ومن أعرض عن ذكري فإن له معيشة ضنكا . فالمسلم الحق لا يكتئب أبدا لانه يعلم أن رزقه سيأتيه وأنه لن يصيبه الا ما كتب الله له ؛ لذلك لما الوجل او الخوف من المستقبل ."
posted = "2005-12-15"
text = "يا من تشعر بالاكتئاب ارجع الى مولاك وتقرب اليه بسجدة بالسحر واستغفر لذنبك وواظب على صلواتك ، وقراءة كتاب ربك ، واعلم أن ما أصابك لم يكن ليخطئك ، وأن ما أخطأك لم يكن ليصيبك ، ينجلي عنك الاكتئاب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134730/http://www.20at.com/article2.php?sid=87"

[[comments]]
order = 3
subject = "دواء الإيمان"
author = "عياش"
posted = "2006-01-23"
text = "سلام الله عليكم أما بعد: فقد مررت بحالة من الإكتئاب مماثلة، بعدما أصبت بمرض في الحبال الصوتية، فعشت زمنا من القلق والخوف، إلى أن هديت إلى العلاج الأمثل، وذلك بعد أن طالعت قوله تعالى من سورة الحديد: ( ما أصاب من مصيبة في الأرض ولا في أنفسكم إلا في كتاب من قبل أن نبرأها، إن ذلك على الله يسير، لكيلا تاسوا على ما فاتكم ولا تفرحوا بما آتاكم، والله لا يحب كل مختال فخور ) الآية: [21/22]"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134730/http://www.20at.com/article2.php?sid=87"

[[comments]]
order = 4
subject = "اريد ان انصحك"
author = "مجمد الوطواط تازة المغر ب"
posted = "2006-05-30"
text = "كنصبحة الا اللاخ سعد الا احسن علاح سلام هوااحسن علاج لحلتكة علايك بصلاة و قيرائة القران وتقرب الاالله ومخلاطةاناس اصالحن وعدم اتفكير في الماضى واخيرن اتمن للاخى اشفئ العاجل والعودة الا اطريق المستقم وسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134730/http://www.20at.com/article2.php?sid=87"

[[comments]]
order = 5
subject = "قاوم و تعلم العلاج الذاتي"
author = "محمد"
posted = "2006-07-10"
text = "بسم الله الرحمان الرحيم التضرع الى الله و الثقة فيه يو لد لدى الانسان ان هناك معينا قادرا ...و الايمان درجات...المهم هو البداية.....الايحاء بالتفاؤل و الايجابي في كل شىء...التصالح و السلام الداخلي....<br />العقاقير .....ابحث في الانترنت فهناك الكثير يمكن تعلمه...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134730/http://www.20at.com/article2.php?sid=87"

[[comments]]
order = 6
subject = "العلاج السريع"
author = "اخوك محب للمغربيين"
posted = "2006-07-10"
text = "كس امك يا خكري<br />ههههههههههههههههههههههههه<br />كس ام الشعوب الافريقيه ما عاد السودان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134730/http://www.20at.com/article2.php?sid=87"

[[comments]]
order = 7
subject = "ما لو ..."
author = "محمد"
posted = "2006-07-12"
text = "بسم الله الرحمان الحيم(لايغير الله ما بقوم حتى يغيروا ما بئنفسهم).(ان يعلم الله في قلبكم خيرا يوتيكم خيرا).<br />التفكير السلبي يولد نتائج سلبية...اذا فكر الانسان في الخير تدفق الخير في عقله...والعكس بالعكس....(تفاءلوا بالخير تجدوه)<br />هذه اساسيات و ركائز علم النفس..و الايحاء..وو العلم الحديث....كله عندنا في ديننا و اكثر بعبارات صريحة ...من يتوكل على الله فهو حسبه<br />اذا ماذا لو ثقنا بالله و توكلنا عليه و احسننا الضنون في الله..<br />ماذا لو فكرنا متفائلين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134730/http://www.20at.com/article2.php?sid=87"

[[comments]]
order = 8
subject = "مغربية"
author = "تفائلوا بالخير تجدوه"
posted = "2006-07-27"
text = "الواضح انها حالة نفسية نتيجة مجموعة من الضغوط بس نصيحتي لهدا الشاب هو التمسك بطريق الله و يمحي كل الافكار الماساوية اللي تربت في خياله و يعطي لنفسة ايحاءات ايجابية و يحاول يغير حياته و يخطط لها بشكل سليم<br />حاول تسترجع دكريات الطفولة و تعرف السبب اللي خلاك تحبط و انا اكيد انك لو عرفت السبب ممكن تلاقي الحل بس الصلاة ثم الصلاة و الدكر فان بدكر اللله تطمئن القلوب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134730/http://www.20at.com/article2.php?sid=87"

[[comments]]
order = 9
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-10-01"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134730/http://www.20at.com/article2.php?sid=87"
