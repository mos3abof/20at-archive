author = "مواطن مصر"
posted = "2009-08-05"
text = "رسالة من مواطن مصرى الى الكلاب الامريكان<br />بطلوا سفالة يا اولاد الزنا بطلوا سفالة يا اولاد الكلاب<br />بطلوا سفالة يا اولاد الخنازير بطلوا سفالة يا زبالة يا اولاد المومسات"
archived = "2009-08-06"
capture_url = "https://web.archive.org/web/20090806193637/http://www.20at.com:80/masr/2khbar/12847-2009-08-05-07-03-39.html"

[[comments]]
order = 1
subject = ""
author = "مواطن مصر"
posted = "2009-08-05"
text = "السلام عليكم<br />يااخوانى ماذا تنتظر من شعب امريكى كلهم مرتزقة اولاد شوارع واولاد زنا<br />السادات رحمة الله كان رجلا بمعنى الكلمة وما يفعلة الكلاب الامريكان فى حقة جريمة لا تغتفر<br />ويجب على كل الممصريين الاحرار مقاطعة كل تعاملات الكلاب الامريكان<br />واذا كان هذا رايهم فى الرئيس السادات فان راينا فى الكلب بوش انه حشرة جاء بها حشرات فان بوش كلب ابن كلب وان الامريكان كلاب والسادات بطل وشهيد"
archived = "2009-08-06"
capture_url = "https://web.archive.org/web/20090806193637/http://www.20at.com:80/masr/2khbar/12847-2009-08-05-07-03-39.html"

[[comments]]
order = 2
subject = ""
author = "اليوزباشى السادات"
posted = "2009-08-05"
text = "اول نشاط لة فى انقلاب يوليو كان عضو محكمة الثورة مع جمال سالم وحكم بالاعدام على 11 عضو بالاخوان بالاعدام شنقا<br />سبق لة الاشتراك فى قتل السياسى المصرى امين عثمان<br />كان فى الحرس الحديدى لحماية الملك فاروق<br />صاحب الانفتاح السبهللة الذى اوصلنا الى مانحن فية الان<br />اظن ان الامريكان هم الذين قتلوة عن طريق عملائهم من الجماعات الدينية بعدوا ان احسوا منة تململا من كامب ديفيد<br />وهكذا او صلنا عسكر يوليو فى ستين داهية"
archived = "2009-08-06"
capture_url = "https://web.archive.org/web/20090806193637/http://www.20at.com:80/masr/2khbar/12847-2009-08-05-07-03-39.html"

[[comments]]
order = 3
subject = ""
author = "صديقهم وبيشتموة"
posted = "2009-08-05"
text = "دايما الامريكان بيتركوا عملائهم بعد ان يستنفذوا اغراضهم منة<br />رموا شاة ايران فى الزبالة<br />واعدموا عميلهم صدام حسين بطل القادسية<br />وبيشتموا السادات بتاع الكامب وسحب القوات من سيناء وتسليمها خالية<br />يبقوا احرار<br />الامريكان ما بيغلطوش لانهم عارفين بيشتموا مين<br />فية احد شتم عبد الناصر - لا اظن"
archived = "2009-08-06"
capture_url = "https://web.archive.org/web/20090806193637/http://www.20at.com:80/masr/2khbar/12847-2009-08-05-07-03-39.html"

