[[comments]]
order = 8
subject = "احبك فى الله"
author = "ذلفى"
posted = "2006-07-08"
text = "السلام عليكم ورحمه الله وبركاته<br />اشهد الله انى احبكفى الله واحب كل من اختار الحق وفضله علا الباطل وضحى فى سبيل الله بكل ما يره الناس وفىاعينهم هو غالى ولكن نضحى بالغالى لما هو اغلى مرضاه الله والفردوس الاعلى ومرافقه الرسول اغلى ثبتك الله انت ومن مثلك ولكم نشعر بالتقصير عندما نرى ونسمع عن من اسلمو وهم لاينطقون العربيه ويبلو بلااء حسن فى الاسلام ونشعر بالخل وان حسابنا سيكون عسير على هذا التقصير فها انتم تبحثون عن الحق وتعتنقوة وليس فقط هذا بل تسعو الى تتبيقه ترتدى الحجاب وتهجرى الاهل والاصدقاء والبلد وتعتنقى دين هو فى نظر السفهاء دين الارهابيين ,وتتركى بلادك التى هى فى نظر بعضنا بلد التقدم ولكن لا عجب فهذا ما كان عليه الصحابه والسلف كانو يتركو المال والاهل والولدوالبلد وذلك فى سبيل الله ولكن ضعفت نفوسنا امام الدنياوانا اقول لنفسى الويل لى من الله لانى لسانى ينطق العربيه ويسبقنى اخوانى الذين يسلمواولا ينطقوا العربيه ثبتك الله وااعانك احبك فى الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123509/http://www.20at.com/article2.php?sid=749"

