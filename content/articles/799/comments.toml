[[comments]]
order = 18
subject = "ما هو الاسلام?"
author = "مسلمه"
posted = "2006-10-08"
text = "السلام عليكم ورحمة الله وبركاته<br />لاول مره ادخل موقعكم لفتنى تعليقات الموضوع من الواضح من بعض الردود كراهيه شديده بس سؤال واحد الى كل اخ واخت تعرفوا ايه عن الاسلام وعن رسول الله محمد صلى الله عليه وسلم سؤال ايه معنى مسلمين مش دين لكن فى اللغه العربيه ممكن بس حد يجاوبنى من القرءان مش من الكلام اللى بيتقال فى الكنيسه لاتعقل يجى حد يهاجمك وهو مش عارفك تيجى ازاى دى يلا انا مستنيه حد يجاوبنى وايوه حاجه مهمه معلش انا قلت سؤال واحد بس انانفسى حد يجاوبنى مش عشان حاجه وحشه لا سمح الله يلا اخر سؤال ما هى مكانة المراه فى الاسلام ?كم مره ذكر فيها عيسى عليه السلام فى القرءان وكم مره ذكر فيها رسول الله محمد صلى الله عليه وسلم?<br />يلا اناعايزه حد يجاوبنى<br />الى الاخ رافض سؤال جميل<br />لماذا نتقبل ان يتحول المسيحي الى مسلم ولانتقبل العكس؟<br />وهل الالتزام بدين معين هو اجباري ؟ لايوجد هذا الاجبار غير في الدين الاسلامي<br />عارف يا رافض مش حجاوب على سؤالك بس انصحك روح اقرا فى الدين الاسلامى ولو ما لقتش الاجابه معنك هتلاقيها اسال رجال الدين من الدعاه والعلماء والشيوخ وعايزاك تنسى الاعلام والكلام كله بيتقال بس فكر انا عايز اجابه انا مش عارفه انت مسلم ولا بس اعتقد انك مسلم من كلمة نتقبل المهم ( انك لا تهدي من أحببت ولكن الله يهدي من يشاء) وما تعمليش زى اللى بيقولك الاسلام لم يعطى حريه للمراه وان المراه ليس لها قيمه فى الاسلام ولو ده رايك تبقى الصراحه حالتك صعبه روح اقرا فى الدين الاسلامى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123509/http://www.20at.com/article2.php?sid=749"
