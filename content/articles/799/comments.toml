[[comments]]
order = 13
subject = "والله متم نوره ولو كره الكافرون"
author = "احمد محمد"
posted = "2006-07-31"
text = "في البداية اود ان اشكر الآخت امنية واقول لها جزاك الله كل خير وانا من مصر كنت اتمنى ان تختاريهاولكن كلنا عرب ولقد احسنت الآختيارواحمد الله على انه انعم عليكي بنعمة الاسلام وان يجعلكي من الذين يدعون له ويحموه بالخير والله المستعان واود ان ارد على كل من االاخ(سمير وبسام)قائلا:انت لا تعلمون شيئا عن الاسلام فديننا يقول (لكم دينكم ولي دين) اما عن تعدد زوجات الرسول فانت ياخ سمير لا تعلم شيئا عن سيرتهكما ان سيدنا سليمان تزوج1000زوجه واعتقد انك تعلم هذا بحكم قراءة كتابكم المقدس واماياخ بسام عن العنف فهؤلاءالاسلام برى منهملان ديننا رحمة وسلام وتحيتناهيالسلام فتفقه في الدين الاسلامي جيداوسوف تجد لذة ما بعدهالذة تلك اللذة التى شعرت بها الاخت امنيةوشعر بها كل من اسلم ابتغاء مرضاة الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123509/http://www.20at.com/article2.php?sid=749"

