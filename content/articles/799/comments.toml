[[comments]]
order = 1
subject = "\" كاسي هو ..... يعني ازيك باالاوردو لغه اهل باكستان \""
author = "مش شغلك ..."
posted = "2006-04-30"
text = "اولا يا كابتن طارق\" اوعي تكون بتزعل من كابتن \" عشان انا بحترمك وبحب الاردن , الموضوع جميل و لديد و \"بالي عليها موز\"<br />انا كنت عامله اعتصام ومخمصه الموقع ولسه كنت فاكره \" كلنا ولاد تسعه وبنسعي دي مش وسيه الناس سواسيه \"<br />والجزء الرابع الناس اللي راحت الوسيه ودفعت الالاف عشان تاخد علم وحاجه مفيده للي حوليها \" وكاني قلت حاجه \"<br />واللي فهم فهم واللي مش فاهم يجيب قاموس , وحعلق عشان ايدي بتكلني بس مش اكتر وبعد كدا اخاصم براحتي \" محدش يسالني ليه \"...<br />الست اللي كانت في الصب واي يعني ميترو اللي قرا مزكراتي اسلمت قريب والله مش بهزار الموقف دا عمري ما حنساه وعدم \" صبري\" في اجابتي علي اسالتها بس بعد كدا جوبتها , بعد 11/9 وامريكا والغرب عامه علي قد ما كارهين الاسلام علي قد ما عندهم شغف يعرفوا البشر التانيه دي بتفكر ازاي , ودا اللي حصل معايا باختلاف الناس اللي سالت عن الحجاب بالدات , اللي مش همه تلبسي تقلعي بلبوصه , او ابن ستين في سبعين وعايز ضرب الحزاء\" اظن كدا بقيت ملتزمه \"واللي متقبل ثقافتك جداً ومحترمها وعارف الفرق ...والبشر دول قابلتهم<br />يبقي بقي اهم حته انك تعرف شخصيه اللي قدامك وتكلمه علي قد فهمه ومعلوماته بالدين الاخر بدون فزلكه او تعصب مش اول ما تقول حبتدي شرح اقول \" ان الاسلام لحيه واقول تركها او خلعها \" حلوه خلعها دي\" حرام او حلال يا جماعه الاسلام مش كدا خالص \" اللي مش كدا خالص \" براحه علي البشر دي البشر دي الاعلام مبوظ دماغها غسلها معرفش بايه, من لفه طرحه اسلمت يا خلق براحه براحه براحه خفو تعومو , اغلبهم بيتقبل الراي الاخر دايما ووخاصه لما يكون هو اللي شغوف وعايز يعرف اخرتك ايه , العالم دي علمتني \" الصبر \" وتقبل الراي الاخر ... وان اختلاف الاراء لا يفسد للفته... تقليه علي راي عمنا\" واحد تاني \" , علي قد اسئلتهم الرخمه والغبيه في نفس الوقت علي قد ما الواحد بيفرح لما يصحح معلومه ..<br />نلتقي بعد الخصام ..<br />\" منجهي اكيلي تشور دو\" حاجه بالاردو بس مش قايله معناها يلا بقي .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123509/http://www.20at.com/article2.php?sid=749"

