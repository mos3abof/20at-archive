text = "الله هو الهادي والحمد لله علي نعمة الايمان<br />والاسلام<br />اللهم بارك لنا في ديننا وفقهنا فيه<br />واجعل سيدنا محمد عبدك ورسولك شفيقنا يوم<br />القيامة<br />والهمنا الصبر علي الشدائد والمصاعب وقوي<br />ايماننا<br />اللهم ثبتها علي الحق ووفقها للعمل<br />الصالح يا رب العالمين"
