subject = "حرية المعتقد"
author = "رافض"
posted = "2006-08-11"
text = "لماذا نتقبل ان يتحول المسيحي الى مسلم ولانتقبل العكس؟ الايجوز للمسلم ان يترك دينه اذا كان غير مقتنع به ؟ وهل الالتزام بدين معين هو اجباري ؟ لايوجد هذا الاجبار غير في الدين الاسلامي . اتركوا الناس تختار وتترك دينها الذي ورثته ولم تعتنقه . ولماذا يهدر دم الخارج عن الدين الاسلامي ؟لماذا لانتقبل رايا آخر او دينا آخر ؟ في كل الاديان هناك حرية الا في الديانة الاسلامية هناك قهر وعبودية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123509/http://www.20at.com/article2.php?sid=749"

