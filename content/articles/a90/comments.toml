[[comments]]
order = 0
subject = "رحمه الله"
text = "رحمه الله تعالى.. خاطرة نبيلة ... وربنا يجعلك الابن الصالح الذي يقبل الله دعوته لأبيه"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050828/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 1
subject = "غفرالله للمسلمين والمسلمات"
text = "اذكرك بحديث النبى صلى الله عليه وسلم والذى فيه اذامات ابن ادم انقطع عمله إلامن ثلاث منهمولد صالح يدعو له الله اسال ان تكون كذلك ولا نزكيك على اللهرحم الله ابيك وامى التى توفيت منذ 5سنوات ولايمرعلى يوم إلاوتذكرتها والحمدلله رحمهما الله جميعا واموات المسلمين"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050828/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 2
subject = "صدق وتأثير"
text = "رحم الله أباك ، وسائر أموات المسلمين ..<br />يميز الخاطرة صدقها وبساطتها ، مع الاحتفاظ برونق اللغة ..<br />أشكر لك إشراكك لنا في تجربتك ، وتعبيرك الصادق السليم، ولعلها آخر الأحزان بإذن الله.<br />أجنادين<br />6/4/2004"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050828/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 3
subject = "اختك في الله"
text = "رحم الله والدك وجعلك الله الولدالصالح الذي يدعو له ورحم الله امواتنا واموات المسلمين"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050828/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 4
subject = "رااااااائع"
text = "اسلوب راقي جداً. لقد جعلتنا جميعا شركاءك في التجربة. رحم الله الوالد..."
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050828/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 5
subject = "ذكرى وتذكرة"
text = "الاخ العزيز / البقاء لله<br />لقد لمست كلماتك شغاف قلبي فكم منا يموت كل يوم وننساه لكن الاب لفضله وحبه يكون دائما عالق في الذهن . رحم الله أباك وأبي وكل موتى المسلمين ..."
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050828/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 6
subject = "الله يرحمه"
text = "ويجمعكم على خير"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050828/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 7
subject = "From a friend"
text = "You will meet him in Janna ISA<br />you're a strong guy and Allah will bless you and cover you with his grants"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050828/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 8
subject = "انا لله وانا لله راجعون"
text = "أيقظت شجوني وذكرتني بوفاة والدي رحمه الله و لكنها خاطرة جميلة ربنا يرحم موتي المسلمين جميعا ويسكنهم فسيح جناته"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050828/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 9
subject = "من ساعة ما مات"
text = "أنا اصلا ابويا ميت<br />كان عندي واحد صاحبي والده لامؤاخذة كان بيحشش ..<br />وكنت بأروح اذاكر عنده في الثانوية ( مذاكرة ضرب ) في يوم والمذاكرة مشعللة على الآخر .. والحاج برة الأودة مضيع ع الاخر<br />لقيتوا فجأة داخل وفي ايده سيجارة حشيش وقالي :باقولك يا كابتن<br />قلتله اتفضل يا حاج<br />قاللي انا زعلان من والدك اوي<br />ليه بس يا حاج<br />قاللي : من ساعة ما مات ما حدش بيشوفه"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050828/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 10
subject = "أبي الحبيب رحل عن الدنيا وتركني وحيدة"
text = "مات أبي ...<br />مات بعد صراع 4 شهور مع المرض اللعين ولم نعلم به إلا قبل وفاته بشهرين ..<br />الألم كان يعصرني وانا أشاهده يتألم ويصرخ ولا استطيع عمل شيء سوى الدعاء له بالرحمة...<br />مات أحب إنسان لي في الدنيا وتركني وحيدة لا أجد الحنان إلا في ذكراه وكيف كان يأتي ليلاً ليقبلني ويأخذني بين احضانه الدافئة ليعينني على قسوة الحياة ....<br />اللهم أجعل قبره روضة من رياض الجنة ولكل أموات المسلمين يا رب العالمين ....<br />اسالكم الدعاء لموات المسلمين بالرحمة"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050828/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 11
subject = "أبوي سبق الكافة"
text = "أبي توفي وانا طفل رضيع، وأكبر إخوتي عمره 10 سنوات ، والآن عندما أعلم بوفاة أحد الناس لا أشفق على أبنائه وإنما على زوجته التي ستحمل مسؤولية أسرة، وكذلك إذا كان كل أولاده بنات، فإنه أمر محزن، ويسبب مشاكل كثيرة ، لكن وفاة الأب تعني مشاكل كثيرة في الصغر ، وخبرة كبيرة عند سن الشباب"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050828/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 12
subject = "ابراهيم سعيد"
text = "البقاء لله والله انتا مريت بموت ابوك والله يكون في عونك يعني يا سيدي واللي يشوف بلاوا الناس تهون عليه بلاواه وهي دي الدنيا"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529050828/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 13
subject = "رنيــــــــــــــ الحب ـــــــــــــــــــــن"
text = "بسم الله الرحمن الرحيم<br />ان لله وان اليه راجعون.: كلنا هانموت وانا اسفه مش عارفه اعبر انت فعلا اثرت شجونى . ربنا معاك ويصبرك وفعلا اللى يشوف بلاوى الناس تهون عليه بلوته<br />رنين"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814012257/http://www.20at.com:80/article.php?sid=90"

[[comments]]
order = 14
subject = "عاشقة_الاسلام"
text = "والله انت فعلا خلتنى اعيط<br />والله يرحمه ويجمعكم مع بعض فى الجنه باذن الله"
archived = "2004-10-21"
capture_url = "https://web.archive.org/web/20041021231321/http://www.20at.com:80/article.php?sid=90"
