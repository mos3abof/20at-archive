subject = "اللى بيشتم الاسلام"
author = "هاقوللك كلمة واحدة قالها صدام عليه رحمة الله لمن اعدموه"
posted = "2007-01-08"
text = "هذى هى المرجلة ؟<br />بقوللك هى دى الرجولة انك تشتم المسلمين والاسلام والنبى محمد ؟<br />بتشتم انسان مات من سنوات طويلة وما اساء لك ولم يؤذيك ؟<br />ان دل ذلك فإنما يدل على التعصب الاعمى وقلة الحيلة ...<br />كنتوا بتستنجدوا بشارون ... أهو شارون بقاله سنة واكتر بيطلع فى الروح .. عمللكم ايه ؟ ولا حتى عرف يعمل لنفسه ايه ؟<br />اوهام واحلام القضاء على الاسلام خليك انتا وأمثالك عايشين فيها لحد ماتنتهى انتا وتزول وتعرف الحق بعد فوات الأوان"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130164454/http://masr.20at.com:80/article.php?sid=1402"

