text = "اخينا المعقد الذى كتب بالانجليزيه حقيقى انا لا افهم لمصلحه من كتب هذا الكلام ، لن ادخل فى شعارات واقول انه لا يعبر عن المسيحيين ... الخ فمعروف ان كل انسان مسؤل عن نفسه و كل جاهل يتحمل مسؤليه جهله ، ولكنى اتساءل لمصلحه من ؟ المسيحيه .. وهل قالت المسيحيه لك اشتم بهذه الصوره المقززه ، قد يختلف المسلمون و المسيحيون حول امور او حول اشخاص كما يختلف ابناء الدين الواحد ولكن ان ينحدر هذا المتعصب بالحديث الى هذه الدرجه فهذا امر غير مقبول من اى عاقل.<br />وهناك نقطه اخرى استوقفتى فى التعليقات هى قصه الاستنجاد بشارون هذه !! وهل حدثت فعلا .. ولو كان بعض المسيحيون يريدون الاستقواء (وعلى من ؟؟) بشارون (او رئيس وزراء اسرائيلى فى العموم) فهذا نوع من الغباء .. ولو صدق بعض المسلمون ان رئيس وزراء اسرائيلى قد يعبأ بمسيحى مصر فهذا نوع من الجهل.<br />فاذا كان اليهود يكرهون المسلمون فهم فهم لا يطيقون المسيحيين ، ولا يتحدث احد عن علاقه امريكا المسيحيه باسرائيل اليهوديه فما هذا الا تبادل مصالح ليس الا ويوم ان تتحول من مركزها كقوه عظمى الى مركز ضعف فاول من ينقلب عليها سيكون اسرائيل ، تماما كما تحالفت امريكا مع القاعده لضرب الاتحاد السوفييتى وما ان انهار حتى اصبح لا فائده للقاعده لدى امريكا فانقلبت عليها.<br />اذ ان من صميم الفكر اليهودى كراهيه كل ما هو مسيحى ، والمسيح عندما جاء كان يوجه اللوم دائما لكهنه اليهود على تظاهرهم الزائف بالتدين فى حين انهم يخفون كل ما هو خبيث ، وكان يشبههم بالقبور المزخرفه من الخارج بينما لا يحوى فى داخلها الا اجساد مائته<br />وفى الحقيقه ان اليهود كانوا دائما ينتظرون مجىء المسيح ! ولكن اى مسيح ، كانوا ينتظرون مجىء المسيح القائد و الملك الذى يتكون جيش لامه اليهود و يدحر به اعدائهم م<br />اقرأ بقية التعليق .."
