[[comments]]
order = 7
subject = "التاريخ يقول"
author = "مسيحى"
posted = "2007-01-06"
text = "ان تاريخ الكنيسه يقول ان الرهبنه بعيده عن الكهنوت 0 اى ان الرهبان لا يصح ان يكونوا كهنه او اساقفه 0 والحادث الان بالكنيسه امر مخالف للتاريخ الكنسى والابائى 0 والكل يعرف هذا 00 ومتاكد ان البابا شنوده والاساقفه يعرفون هذا 0 ولكنهم يكسرون النظام الكنسى 0 فالكنيسه الان وكما يقول علماء التاريخ الكنسى محتله رهبانيا ويجب على الشعب القبطى ان يحرر الكنيسه من هذا الاحتلال بالطريقه التى يراها مناسبه 0 ولا نتعلل بمجمع نيقيه الذى قال ان الاساقفه يجب ان يكونا بتوليين - لا رهبانا - فمجمع نيقيه كان رايه زمانى ولكن الاصح قول الانجيل ( يجب ان يكون الاسقف بعل امراه واحده دبر بيته حسنا 0000الخ تيموثاوس الاولى 3 ) وحيث وجد نص لا مجال للاجتهاد الكتاب يقول صراحة الاسقف زوج امراه واحده 0 فمن اين اتوا بان الاسقف يجب ان يكون راهبا -هذه بدعه - فلكى تكون التعاليم مسيحيه يجب ان تكون المرجعيه الى الكتاب المقدس لا الى غيره 0 وعليه لا حاجة لنا بتعديل لائحه خاطئه يجب ان نرجع الى الانجيل -الاسقف بعل امراه واحده 000000 الخ -"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130164454/http://masr.20at.com:80/article.php?sid=1402"

[[comments]]
order = 8
subject = "نعم الاسقف بعل امراه واحده"
author = "دارس للتاريخ"
posted = "2007-01-06"
text = "نعم الاسقف زوج امراه واحده حسب النص الانجيلى وحسب التاريخ الكنسى والذين يقولون خلاف ذلك اما جهله بالتاريخ والكنيسه او منتقعين من الوضع القائم 0 واسالوا الانبا باخوميوس الذى كان ابا لالاف من النساك الذين نسميهم خطا رهبان وكيف كا يستدعى كاهن من العالم ياخذ اعترافاتهم ويصلى لهم القداس ويناولهم من الاسرار المقدسه 0 لانه لم يكن مسموحا للرهبان ان يحملوا اى درجه كهنوتيه 0 الانبا انطونيوس اب جميع النساك -الرهبان - فى العالم والذى كان معاصرا لبدعة اريوس 0 لم يختاروه بطريركا بل اختاروا تلميذه اثناسيوس الذى كان يخدم وسط الشعب فى العالم 0000 وهناك ادله كثيره تقول ان الاساقفه والكهنه لا يجب ان يكونوا رهبانا 0 بل ممنوع كتابيا زكنسيا ان يكونوا من حملة الرتب الكهنوتيه 0 فمتى ترجع الكنيسه الى الينابيع الصافيه وتترك هذا الماء العكر الذى تعيش فيه ويرجع الرهبان الى قلاياتهم تاركين الكنيسه لمدبريها الذين هم حسب قلب الله المعلنه فى كتابه المقدس 000 امين عن قريب عن قريب"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130164454/http://masr.20at.com:80/article.php?sid=1402"

