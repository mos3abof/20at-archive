author = "مواطن مش عاجبه الحال"
posted = "2007-01-06"
text = "هعهعهعهعهعهع<br />الحكايه احلوت اوى ....<br />الاول كان فى مسيحيين بيدخلوا باسم مسلمين وبيحاولوا يشتموا فى الاخوان و غيره ويرصوا لهم كام ايه قال يعنى هم مسلمين برضه وخايفين على الاسلام من الاخوان والاسخم من كده انهم كانوا بيحاولوا يناقشوا امور اسلاميه ملهومش فيها .... بس طبعا كانوا بينكشفوا فى الاخر لان كلامهم بيبقى فيه جهل و مغالطات متصدرش من مسلم<br />ودلوقتى الاخ اللى عامل اسمه دارس للتاريخ ده برضه مقضيها وعمال بس يكتب الانبا معرفش مين وايه عشان اللى معندوش معلومات كفايه ويقرا الكلمتين دول هيصدقه وقال يعنى مسيحى خايف على المسيحيين من الرهبان مع ان كلامه فيه مغالطات تضحك (بس للى بيفهم) عم الدارس ده.<br />هعهعهعهعهع"
