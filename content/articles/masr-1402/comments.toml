[[comments]]
order = 2
subject = "؟؟"
author = "فؤاد سامى"
posted = "2007-01-05"
text = "لا دين فى السياسه ؟؟<br />لو كان الاخ متحمس للاخوان و بيكتب هذا اسمح لى ان اضع !!!!!! !!!!! !!!!! !!! !<br />(يعنى الموقع حركاته فى المواضيع دى مكشوفه اوى الصراحه موضوع يشتم فى المسيحيين ثم تلات اربع تعليقات مجهوله الصاحب تؤيد الموضوع وبشده )<br />كان فى اكتر من واحد مره قال ان الموقع ده يعمل لصالح الاخوان ولكن بطريق غير مباشر وفى صوره الدعاه الى الديموقراطيه و الحريه ...الخ ولكن من خلال هذا يبثون مثل هذه المواضيع و غيرها ضد الاقباط مره و ضد الشيعه مره و غيره ومن ناحيه اخرى الترويج لنشاطات الجماعه و ابرز هذه المظاهر الدفاع المستميت عن عرض الاخوان فى الازهر و حتى المواضيع المعارضه له نشرت على سبيل الاستهزاء و السخريه من اصحابها، لا احد يعترض على الترويج لفكر معين ولكن فى النور و بصوره واضحه.<br />والموقع يدعى انه لكل المصريين فى حين انه ليس كذلك بدليل حمله الاعتراضات و(الشتائم) التى يلاقيها (والتى قد الاقيها اناالاخر) كل صاحب راى مخالف ، ولا اتكلم هنا عن المتحمسين للحكومه و للرئيس امثال الدشم و غيرها بل كل صاحب راى يخرج عن اطر محدده يراها اصحاب الموقع وخاصه الاراء التى قد تنتقد مجرد نقد للاخوان فى حين انكم تضعون عنوان للموضوع هذا يوحى بالدكتاتوريه الهائله التى يمارسها سماحه البابا العام شنوده اسلوب خبيث وواضح جدا ولكن هناك من يريد هذا الكلام و يحبه.<br />ومن امثله ادعاءات الموقع هذا الاستفتاء المضحك الذى يزين الصفحه الرئيسيه حول الاخوان ، فالمشارك عليه الاختيار بين ثلاث اختيارات مؤيده للاخوان اما ان تكون مستنكرا لوجود الميليشيات متماشيا مع تصريحات الجماعه و اما ان تقر بوجودهم (ولكن هنا الذكاء بقى هم موجودين ولكن يمكن ان يفهم من الاختيار ايضا انهم موجودين و هذا جيد انهم موجودين!) واما انك لا<br />اقرأ بقية التعليق .."
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130164454/http://masr.20at.com:80/article.php?sid=1402"

[[comments]]
order = 3
subject = "الاخ فؤاد سامى"
author = "انت مصرى مثلى واحترمك ايا تكون"
posted = "2007-01-05"
text = "ولكن احيانا انتم تجعلون الحليم يفقد اعصابة حينما فى كثير وكثير من المواقع القبطية تسبون النبى والدين الاسلامى وكلام مبتزل وحقير وكنتم البادئين وقصص كثيرة واقباط المهجر ومظاهرات انقذنا يا شارون<br />ثم تزعلون حينما يرد عليكم احد<br />نحن اخوان فى الوطن و و و اللة نحبكم ولا نكرهكم<br />والموضوع ليس اخوان او غير اخوان<br />انتم مواطنين مصريين مثل بقية المواطنين ويجب ان تراعوا شعور الاخرين<br />ومعلهش لا تؤخذ كلامى بمعنى اخر انما اريد التوضيح<br />وخللى مخك كبير وما تزعلش قوى"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130164454/http://masr.20at.com:80/article.php?sid=1402"

[[comments]]
order = 4
subject = "كالعاده"
author = "فؤاد سامى"
posted = "2007-01-05"
text = "مع الاسف يا عزيزى انت و كما هى العاده دائما ذكرت نصف الحقيقه لم تذكر الكثير و الكثر من المواقع الاسلاميه التى تسب المسيحيين و الدين المسيحى بكلام مبتزل وحقير بل و اكثر من ذلك شيوخ بعض المساجد ومسلسل شتم المسحيين فى كل خطبه جمعه وعلى مسمع من الجميع ،<br />ثم لماذا تجزم هكذا و بثقه بان المسيحيين هم البادئين على اى اساس بل اقول لك فى مساله البادئين هذه انك لا تستطيع ان تحددها ابدا فمتى وما هى الحادثه الدقيقه التى بنيت عليها حكمك هذا<br />ولماذا نبره التهديد هذه التى فى كلامك (انتم تجعلون الحليم يفقد اعصابة .... ) ، الست تتكلم بالحق و عن اقتناع بما تقول ام ان المسأله هى كثره عدديه و شعور بالقوه فقط<br />لماذا انا مزعلش نفسى قوى و ا لمفروض انى اخرس ولا اتحدث حتى لا يغضب على الحليم! ومن جديد اعود و اقول هى المسأله مساله شعور بالقوه فقط؟؟ وعلى من على مصريون مثلكم يعيشون فى نفس البلد<br />يا عزيزى ولا المسيحيون يكرهونهم انما يجب ان نعترف ان هناك مسيحيون يسيئون للمسلمين وهذا خطا و هناك العكس ، نعم فهناك فئات من الطرفين تكره الاخر و تسىء اليه<br />ولكن المشكله واضحه من ردك ، فان كمثال لاترى و لا تقبل مجرد الفكره ان هناك فئات من المسلمين تخطىء نحن دائما المخطئين و نحن دائما البادئين ، بل ان البعض يذهب ابعد من ذلك و يقول ان المسيحيين يطهدون المسلمين فى مصر !!! ولا افهم كيف و متى وعلى اى اساس يقال هذا الكلام<br />وكم من فتاوى خرجت بتكفير المسيحيين و طردهم من مصر باعتبارهم (كلهم) خونه و عملاء و بل و يجب قتلهم ايضا اذا لزم الامر (ولا اريد ان اذكر اسماء بعينها)<br />اما اذا كنت مقتنع بهذا الكلام بان المسيحيين هؤلاء قذاره و دنس للوطن و يكفى انهم مازالوا احياء حتى الان ويحمدوا ربنا اخر حمد و يحطوا حزمه<br />اقرأ بقية التعليق .."
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130164454/http://masr.20at.com:80/article.php?sid=1402"

