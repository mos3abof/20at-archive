order = 5
subject = "الاخ اللى فوق"
author = "انت يا عم فؤاد انت - وتلاقى اسمك الحقيقى مايكل و لا جاك ولا اسم اجنبى من اللى غاوين تسموها دى - انت ما صدقت يا حبيبى حد عبرك و رد عليك روحت فاتح فى حنفيه الغل اللى جواك"
posted = "2007-01-05"
text = "ايه اللى جاب السيره دى دلوقت انت خرجت بره الموضوع اللى موجود ولو عاوز تكمل فى كلامك ده يبقى مش هنا يا بابا روح على البال توك جنب زكريا بتاعك و غيره ولبخ براحتك و برضه هتلاقى هناك اللى يرد عليك<br />وياللا بقى."
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130164454/http://masr.20at.com:80/article.php?sid=1402"

