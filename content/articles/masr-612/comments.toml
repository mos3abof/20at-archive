subject = "كفاية 25 سنه فقر وفساد وبطالة = كفاية مبـــــــــــارك"
author = "ابو كرتونة"
posted = "2006-07-10"
text = "الحل يا جماعة في ازالة هذا النظام البائس هو الثورة عليه وبس وليس الكلام علي الفضي لان النظام لايخاف من الكلام<br />ولكن ازالته تكون بثورة الشعب عليه وهو العلاج المضمون مائة بالمائة"
