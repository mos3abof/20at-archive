[[comments]]
order = 4
subject = "لك الله يا د. مسيري"
author = "مهموم"
posted = "2006-07-09"
text = "في البداية عندما نشرت كتبك التي تعري الصهاينة واتهمت كما اتهم قبلك كثيرون بمعاداة السامية قلنا أنك وسط أهلك وأهل بلدك الذين سيحمونك مهما كلفهم الأمر، ولكن الآن بعد أن عاديت حكومتنا الرشيدة التي تهاجم الجميع وتعتقل الكل، لم يعد حتى أهل بلدك قادرين على الدفاع عنك ولا الدفاع عن أنفسهم، وصدقني ليس هذا تخليا عنك، ولكن كما عودتنا دائما فإن الحقيقة هي أهم شيء، وهذه هي الحقيقة المرة.<br />لنا ولك الله يا د.مسيري"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090807/http://masr.20at.com:80/article.php?sid=612"

