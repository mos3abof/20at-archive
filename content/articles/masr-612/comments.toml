[[comments]]
order = 0
subject = "مين المعني بالوثائق بروفيسور مسيري؟"
author = "متعجب"
posted = "2006-07-05"
text = "بكل إحترام نسمع لكلام الوثائق والحقائق بالأرقام وده بيعملوه الناس اللي عايزين يجدوا حل لمشكلة ما. إنما إحنا مشكلتنا نظام عفن من سنة سبعين لغاية الله أعلم، نظام سرطاني إستشرى في جسد الأمة وأفسدها، ولم ينجح إلا في إثقال كاهل البلد بديون خارجية تزيد بكثير عن 700مليار دولار أمريكي، أو ما يعادل ثروة عشرة من اللصوص الكبار اللي وجدوا تحت مظلة هذا النظام.<br />الوثائق دي موجهة لمين؟ للشعب؟ ولا للنظام ولا لمين بالضبط؟<br />الفشل في كل القطاعات في مصر وأولها الزراعة اللي لاتلبي حاجة المواطنيين وبنتسورد منتجات زراعية من إسرائيل، مش عايز أتكلم عن الصناعة وغيره حفاظا على الوقت ولعدم جدوى الكلام.<br />الحل إجتثات النظام وكل ما تولد عنه من الفساد والمفسدين، غير كده يبقى لعب عيال. جود نايت!"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090807/http://masr.20at.com:80/article.php?sid=612"

[[comments]]
order = 1
subject = "و الله مش عارف اقول إيه"
author = "عابر القارات"
posted = "2006-07-05"
text = "و الله مش عارف اقول إيه بس هوه مجهود يشكر القائمين عليه و خصوصا كشف الفساد بالارقام و لكن للاسف ان الارقام ما ضفيتش حاجه للحقيقة اللى الناس شايفاها واضحة زى الشمس و هيا ان الفساد بقى مستشرى لدرجة إنك تفتح الحنفية تخرررررر فساد المشكلة اللى عاوز اسأل عليها كفاية بعد ما كشفوا الحقائق بدليل مادى زى الارقام يا ريت يقولولنا حل عمل نعمله و يا ريت يكون حل عملى الشعب يعمله مع الاخذ فى الاعتبار حاجه مهمة إن الشعب بقى بليد و متبلد"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090807/http://masr.20at.com:80/article.php?sid=612"

