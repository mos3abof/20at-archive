[[comments]]
order = 1
subject = ""
author = "مترو الانفاق"
posted = "2009-06-03"
text = "كم راكب يستخدم مترو الانفاق فى اليوم ؟ على حسب الاحصائيات الحكومية 3 ملايين راكب - بدخل او ايراد يومى 3 مليون جنية مصرى<br />يعنى مكسب خرافى<br />لماذا لا نتوسع فى خطوط مترو الانفاق ؟ ونمدها الى مكان<br />الاخطر من مترو الانفاق هو الاهتمام بالسكك الحديدية<br />حينما يتم تطوير السكك الحديدية التى انشأت فى الحكم الخديوى ويتم الاستغناء عن جرارات الديزل وذلك بكهربة السكك الحديدية واستخدام التحكم الالى فى تحركات القطارات<br />ساعتها نعرف اننا نتقدم<br />اما والحال والعذاب الذى يلاقية ركاب الصعيد فى السكك الحديدية فامر لا يقبل فالاهتمام بالقاهرة فقط وعمل شبكة مترو وترك الصعايدة يعانون فامر غير مقبول<br />افتكروا الصعايدة فمحافظات الصعيد واللة العظيم تتبع جمهورية مصر العربية وليست مصر هى القاهرة فقط"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019102503/http://www.20at.com:80/masr/2khbar/12262--6-.html"

