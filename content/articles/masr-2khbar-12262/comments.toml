author = "مش لاوى بوزى"
posted = "2009-06-03"
text = "أنا أعتبر أن مترو الانفاق ده مشروع بجد هايل جدا بالرغم من الزحام الرهيب والغير عادى اللى فيه وهو أهم الاسباب اللى خلتنى احتمل الشمس ولا انى اموت مخنوقة من الانفاس المكتومة داخل المترو الرهيب بس ربنا يوفقهم"
archived = "2009-10-19"
