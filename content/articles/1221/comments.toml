subject = "تامر سبب البطالة"
author = "واحدملوش خص"
posted = "2006-05-01"
text = "اناقرأت الموضوع والتعليقات خاصة تعليقات البنوتات واستنتجت ان تامر حسني هو سبب البطالة<br />هو بيشتغل ايه (نقيب العمال ) وله وزير العمل<br />وله حبسوه لانه بيشغل قرابه وبيترك غيرهم<br />ما اتفعمونا يا جماعة شو علاقة تامر بالبطالة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134459/http://www.20at.com/article2.php?sid=751"

[[comments]]
order = 6
subject = "إيه الهبل ده آآآآآآآآآآه"
author = "islam_physics@yahoo.com"
posted = "2006-05-01"
text = "ربنا بجد يزود البنات اللي بتحب تامر ومتضامنة كدة معاه ربنا يزودهم هبل على هبلهم وعبط وتفاهه أكتر من تفاهتهم .. إحنا عمالين نتكلم في موضوع مهم زي البطالة وهما عمالين مهتمين بواحد كل شغله إنه يفضل يصدع دماغنا عمال يرقص ويغني طبعا مش حاسس باللي احنا فيه والله حرام عليكوا بس طبعا البنات عندها حق علشان مش مهم عندهم الشغل لأن فيه تعيس حظ هيصرف عليهم وهو العاطل اللي هتخليه يشحت عليها علشان يبقوا يسمعوا تامر كويس على الرصيف هي وجوزها يبقى خلي تامر ينفعكوا وبعدين هو دخل السجن مش عشان أنه مناضل كان عايز ياعيني يغير البلد يخليها أحسن بلد في العالم ده زور شهادة الجيش يعني مش عايز يدافع عن بلده ده يستحق إننا نعمل عشانه كده<br />فين عقلوكوا يا بنات بطلوا هبل بقى<br />أخوكم إسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134459/http://www.20at.com/article2.php?sid=751"

