[[comments]]
order = 1
subject = "و نعيييش"
author = "أمير"
posted = "2006-04-30"
text = "كل سنة و أحنا عاطلين او حتى لو شغالين بتكون شغلانة هلامية ماللي بتجيب تبلد و تخلف عقلي مبكر انا ياريت بس يوفرو للشباب المتريال اللي هي المادة المهنية و المادة الفكرية بمعنى ,خلاص مش عايز حديني يشغل بس على الأقل ساعدونا ان أحنا نعمل البزنس بتاعن و ماتخدوش ضرايب و جمارك علينا و مش بس كده, انتو عارفين ان ممكن مجموعة شباب تعمل دار نشر أو مصنع أو ستوديوهات افلام و موسيقى.,لازم يرحمونا من الشهادات و البيروقراطية و يبنو فينا مهارات بالمهرات حنكون شغالين ذاتيا و ننتج و ننافس و اتمنى ان ميكونش الناس المسيطرة عال سوق خايفة من احنا ننافس و ننتج و ناكل عيش و ده الأهم.....و نعيش<br />www.AmirAdouani.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134459/http://www.20at.com/article2.php?sid=751"

