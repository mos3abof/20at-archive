subject = "الصبر او السفر"
author = "نيفين"
posted = "2006-05-02"
text = "بقول لكل بنت لسه نشتغلتش الصبر ثم السعى<br />و لكل شاب لسه ما اشتغلش السفر ثم السفر<br />البلد دى راحه ف داهيه و السفر الحل الوحيد للشباب<br />انا الحمد لله بدرس و بشتغل<br />عن نفسلى قبل الشغل كنت بشغل نفسلى بالرسم و كتابه الشعر<br />و المذكرات برده<br />وخدالى باللك يا هبهوب<br />فينك يا بت<br />وحشاااااااااااانى"
archived = "2006-11-02"
