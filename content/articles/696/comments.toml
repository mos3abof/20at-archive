[[comments]]
order = 0
subject = "I am not bat man"
author = "Blue Sea"
posted = "2006-03-11"
text = "السلام عليكم<br />بعيد عن سلاحف النينجا و بات مان وبابا نويل<br />فكرت كتير البس اية البس اية<br />بصراحة الموضوع مكنش في بالي<br />بس بعد تفكير عميق لقيت شخصية حبيت اني ارسم صورتها في الحفلة<br />شخصية الفارس العربي ( او الفاتح العربي )<br />العباءة و السيف او ملابس الحرب<br />لو تسمحولي أأجر حصان كمان يبقي كويس قوي<br />وحكون متأثر بالمسلسلات السورية التاريخة<br />مثل .. صقر قريش و ربيع قرطبة و الحجاج و الظاهر بيبرز<br />وأتكلم لغة غربة فصحى طوال الحفلة<br />بطلاقة وبدون تهتهه زي ما بيقولوا<br />وفي الختام بشكر عشرينات علي الفكرة الحلوة ...<br />ومستنيين شاكيرا و مايك جاكسون يجوا الحفلة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114152/http://www.20at.com/article2.php?sid=555"

[[comments]]
order = 1
subject = "اممممممم"
author = "هووبه او هبهوب"
posted = "2006-03-11"
text = "اممممممم ناس كتير والله بس عشان الوقت وعشان انا في عجاله حقلكو علي اللي في بالي .<br />بعد تشغيل اغنيه \" مش انا \" .<br />وشراء اغلي اكسسورات فيكي يا مصر \" اللي مش عارفه مكانها فين اصلا \".<br />قررت اكون... اكون<br />شاااااااارون \" ايوه عشان اول ما اخش الحفله الناس \" تتف عليا \"<br />او \" عمرو خالد \" عشان الناس تحبني وتسمعلي .<br />ايه دا بس انتي بت يا \" حماره \" اه صحيح اذا كان كدا بقي<br />قررت اكون \" نهي الزيني \" او \" ايات الاخرس \"<br />ولو فيها حبه فرفشه يبقي \" سعاد حسني\"<br />وبعدين هي مش محتاجه كل اللي حوليا \" متنكرين \"<br />وسلاااااااام لكل واحد مش \"متنكر\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114152/http://www.20at.com/article2.php?sid=555"

