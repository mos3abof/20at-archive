[[comments]]
order = 5
subject = "اكبر راس فيكي يا مصر ..!!"
author = "sweet_princess"
posted = "2006-03-12"
text = "اولا يرحمكم الله يا( بو سريع ) وابعد وشك عن شاشة الكمبيوتر اما تحب تعطس عشان ما تعديناش ...<br />ثانيا اما احب اتنكر لا زم اختار (شخصيه عليها القيمه وزباله قوي زي اكبر راس في مصر مثلا )مع ان التنكر في هيئته هيتعبني اوي وكمان هيعرض حياتي للخطر (لان ممكن اي حد قرفان منه ينشني رصاصه تجيب اجلي )((الف بعد الشررر عليا -انشاللا اللي يكرهوني )).<br />اما لو تنكرتا في هيئة مناضل مش هلاقي احسن من ((اسامه بن لادن )) واجيب حد بقى يتنكر في بوش وانزل ضرب فيه ونقلبها فيلم بقى...<br />اما لو حبيت اتنكر في هيئة شخصيه تاريخيه عظيمه هتنكر في هيئة هتلر (ابوز ربع شنب دا ) ودا في حالة تنكر هبهوب في شكل شارون ( عشان يتقال اني بعادي الساميه .. واجيب شوية جاز وسخ واولع فيه .. وتروح هبهوب ضحية العمليه ).<br />اما لو حبيت اتنكر في شخصيه سنيمائيه فلازم الرزمانسيه تلعب دورها هنا .. يعني مثلا اتنكر في شكل عادل امام في فيلم الارهابي ..واول ما ادخل (بووومممم انسف الحفله كلها واخلص الليله من اولها .<br />اما بقى لو تنكرت في هيئة مطرب محبوب زي (شعبوللا اللي كل اغانيه عباره عن جملتين يعد يعيد ويزيد فيهم وما فيش على لسانه غير اييييييه .. واغني انا بكره اسرائيل .. عشان اغيظ هبهوب اللي متنكره في شاورن .. عشان لو نجي من الحريقه يتفرس و يموت من الغيظ .. وانا بكره اسرائيل ..ايييييييييييييه.. اااااااااااااه انا بكره اسرئيل.<br />اما بقى لو حبيت اتنكر بجد .. هتنكر في هيئة كليوباترا.. ليها هيبه كده وشخصيه محيره ولا اخيلها مارجريت تاتشر ,, لاء اخليهااااامنى بتاعة رجل المستحيل (عشان اغمكم ).. ولا اتنكر في هيئه هاله سرحان (يا بااااي ..رخمه رخمه )... اوفففففف مش رايحه الحفله دي ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114152/http://www.20at.com/article2.php?sid=555"

