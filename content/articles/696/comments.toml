text = "انا نفسي اجي متنكر في هيئة جمال عبدالناصر عشان اخطب فيكم ( و ان شاء الله ما يكونش فيه حد متنكر في هيئة إخوانية .. عشان اكون في السليم ) ههه<br />او برضه هي فكرة كويسه اني اتنكر في هيئة بحار و اجيب معايا وحدة فرنساوية ( يعني انها حتحبني ) هههه<br />و آآخر فكرة هي التنكر في شكل صحافي دانمركي ( ياعيني على الشلاليت اللي حاخدها ) ههههههه"
