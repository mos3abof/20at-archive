posted = "2007-11-20"
text = "عجبنى جدا الجزء الأخير بتاع أمن الدولة … و انا كمان بحب الشعر العمودي جدا و مفتقدينه في شعراء اليومين دول<br />لكن ما يزعجنى هو أن بعض أصحاب المواهب يحاولون الابتعاد عن الدين حتى لا يصنفهم الناس بالاسلاميين بالرغم من انها ليست سبة بالعكس هو شرف و للأسف يحاولون الابتعاد عن طريق الاباحية في أعمالهم حتى يثبتوا للبعض انهم ملك الجميع … يا ريت طلال ما يكونش واحد منهم …على العموم بالتوفيق إن شاء الله"
