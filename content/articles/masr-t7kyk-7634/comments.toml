text = "انا مقريتش لطلال غير المقطع المكتوب في نهاية المقاله<br />و لو قيمته يا أخي و اتهمته بالاسلامجيه - لو اعتبرنا دي تهمه أصلا<br />بسبب المقطع ده<br />يبقي انت مفهمتش أصلا هو يقصد ايه<br />أليس هذا مايفعله بنا الزبانيه و الامريكان و اليهود<br />يريدون ليطفئوا نور الله بأفواههم"
