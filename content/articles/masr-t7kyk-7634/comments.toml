[[comments]]
order = 6
subject = ""
author = "محب دمشقي"
posted = "2007-11-27"
text = "قرأت بتؤدة تعليقات القراء، وذهلت من نقد كثيرين النقد غير العلمي ولا الممتلك لأدوات النقد الحقيقية، يعني أول تعليق يرى أن نصوص طلال قص ولزق، وانا اجيبه بكل روح منفتحة هذه رؤيتك صديقي، ولكن ان تحكم على طلال وشعره هذا الحكم القاسي بقراءتك لأبيات مقتطعة من ديوانه فاسمح لي أن أقول لك لقد خانك التوفيق. فالحكم النقدي يكون بعد وضع مبضع النقد على جسد النص كاملا لا ان أختطف بعض الكلمات وأجعلها سبة لصاحب النص. ففي هذا الحوار الذي قام به الاخ مع طلال التكيز يجب أن يكون على رد واجوبة المحاوَر ، وأنا وجدت في طلال أملا طال انتظاره ولغة تشي عن روح نقدية واعدة وقلم شعري واعد شق طريقه في اقتناص مواضيع يشترك فيها الجميع وما الشعر إلا أن ينطق بما أفكر فيغوص إلى داخلي فيكون كلامي الذي لا أسطيع نطقه وصوتي الذي لا اعرف كيف اعبر به، واستطاع طلال ان يقف على هذه الوظيفة فاختار عنوانًا لمقاله يتفق مع حال الكثيرين ويمزق الحجي وينير بضوء شعره بقعة حاول الكثيرون سترها، وأما من اعترض على كلمة حذف سورة الأنعام فلا شك أني مشارك إياه، ولكن هل طلال الذي قال أم شخصية المحقق معه هي التي نطقت ، وما الشعر إلا اخيلة تسكب وتطرز في ألفاظ تعطيها سمت الواقعية والوجود. وأسأل من يظن أن طلال من أتياع تامر حسني كيف يكون هذا مع إنسان رفض لأنه كما يدعي أدعياء الفن والثقافة متمسك بشيء قد ولى زمنه ألا وهو زمن الشعر الموزون المقفى هل يتفق من أبو الطيب رفيق عقله وروحه أن يكون عقله متصالحًا مع من يقول: يا بنت الإيه، أعتقد ان تصديق مثل هذا الأمر كمن يصدق أن أغاني شعبولا صارت تمثل همًا ويصدق من يقول إن شعبان فرض نفسه على الواقع. وجدت في كلمات طلال ورحًا أدبية وثابة تعرف كيف تعبر وكيف تصور وكيف تنقد وكيف توجد الحل، سأنتظر معكم يامن نقدتم وجرحتم لنرى معًا ما سينبلج عنه مستقبل طلال وإن لأعتقد وبإذن الله أنه سيكون مستقبل ظاهرة سيكتب عنها وتتابع من كل إنسان يفقه معنى الفن الحقيقي."
archived = "2009-08-10"
capture_url = "https://web.archive.org/web/20090810185824/http://www.20at.com:80/masr/t7kyk/7634.html"

[[comments]]
order = 7
subject = ""
author = "مي نجيب"
posted = "2007-12-12"
text = "لا يجوز لغير المتخصص أن ينقد وحين يقرر شخصاً أن ينقد لابد أن يوجّه نقده للحاله الشعريه كاملة لا أن يكتفي ببضعة أبيات ..<br />وشعر طلال أنا إستمعت إليه وحقاً يبشّر بالخير الكثير والجميل أنه حقاً تجربه إبداعيه جديده وتجربه مميزه ومختلفه عن كثير مما نسمعه(ويكفي أن يعبر الشعر عن حاله إنسانيه يعاني منها الكثير من الشباب ..فدورنا أن ننحني لها لا أن ننتظر كلمات ممتزجه جذابه ورائعه حين نستمع لها دون أن تكون حقيقيه ) فلنمهله الفرصه لعرض تجربته ولا نحجر عليها من قبل أن تسطع ..وأنا بدوري أشجعه وأحييه على قصائده وفي إنتظار الديوان الورقي .."
archived = "2009-08-10"
capture_url = "https://web.archive.org/web/20090810185824/http://www.20at.com:80/masr/t7kyk/7634.html"

