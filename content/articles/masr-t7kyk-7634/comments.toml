posted = "2007-11-21"
text = "لم ارى من هذا المقال سوى شخصا يجامل صديقة بحملة اعلانية غير مباشرة… و رغم ذلك فان صديقه هذا لا يمت لموهبة الشعر بصلة.. بالاضافة الى انتهاج كلاهما لمنهج الباحثين عن الشهرة السريعة (اضرب ف الاسلام و اجري) و انا اعتبره احط و ارخص الطرق للشهرة… بالله عليكم هل يجوز ان نقول اشطب سورة الانعام؟؟؟ و الهواري يبدأ مقاله استهزءا بمن يدعوهم الاسلامجية؟؟ سؤال يا اخ هواري: هو الاسلام ناقص حرب داخلية؟ الا تكفي الحروب الخارجية؟؟؟"
archived = "2009-08-10"
capture_url = "https://web.archive.org/web/20090810185824/http://www.20at.com:80/masr/t7kyk/7634.html"

