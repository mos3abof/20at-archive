subject = "قطره لكل من يهمه الامر"
author = "إيزيس"
posted = "2006-09-06"
text = "شكل الاستعمار اختلف من قبل ثلاثون سنه كان هناك استعمار واضح وصريح وايضا كان رد الفعل الشعبي واضح تجاه اي تدخل او اعتداء خارجي الاستعمار اليوم بزيه الجديد المتمثل في العمل علي مصلحه الدول سواء العربيه او الافريقيه و بالصبع علينا السمع والطاعه هم بدئوا بالاحتلال الفكري و الثقافي والاجتماعي وهناك دلالات كثيره علي ذلك ولكن السؤال هل هم فعلا نجحوا في مخططهم المنظم لتخريب عقولنا وارواحنا انا اقول لا وهذا بسبب الغباء السياسي الذي يظهر في صوره استعجال اتحقيق الاهداف فأهداف مثل ذلك يجب الصبر ليس اقل من قرن من الزمان الخطه الحاليه هي تقسيم جميع الدول الي دويليات لاحكام السيطره عليها وزع الفتن في ابناء البلد الواحده وهذا واضح وحدث كما حدث في العراق والمحاوله المستمره في جميع الدول العربيه فتاره سنه وشيعه وتاره عرب وبربر وتاره مسلم ومسيحي ونوبي ايضا وبالمناسبه المانيا قامت بمجهودات جباره لاظهار الاقليه النوبيه وغيرها وغيرها ولا يتسع الوقت لكل شئ وماذلنا في طريق طويل نحن فقط في البدايه وهنا ك بصيص من النور هنا وهناك واؤكد لن يظل الوضع عل ما هو عليه.............."
