[[comments]]
order = 5
subject = "سيادة المحافظ"
text = "وفيه كمان لعيبة جداد حبتين لكن ما يتنسوش<br />مشير حنفي<br />والكابتن الكبير هشام يكن<br />ولا محمد حشيش<br />وفوزي عبد المسيح بتاع الترسانة<br />وخالد القماش بتاع المحلة<br />ولا زكريا ناصف مثلا<br />وعندك كمان فوزي جمال<br />وعاصم زغلول<br />والكابتن الكبير قوي<br />قوي قوي عمرو أنور"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041010/http://www.20at.com:80/article.php?sid=346"

[[comments]]
order = 6
subject = "غاندي البلد"
text = "فاكر يا سيادة المحافظ يا خويا ماتش مانتشستر يونايتد ومركز شباب أبو حتة ونص سنة 1881 لما النتيجة 154 - 2 لمانشستر، قام الحكم العالمي فادي وائل حسب ضربة جزاء ظلم لمركز شباب أبو حتة ونص للواد بعرة (محترف الآن في نادي أوعى وشك يا محسن الأيسلندي) عشان النتيجة كان شكلها وحش أوي ... قامت إنجلترا احتجت..<br />وكانت النتيجة: الاحتلال الإنجليزي لمصر<br />ياااا ... ده زمن الفن الجميل يا سيادة المحافظ مش تقولي الضظوي والأنجلبير"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041010/http://www.20at.com:80/article.php?sid=346"

[[comments]]
order = 7
subject = "سيادة المحافظ"
text = "يا أخ غاندي يا أخويا<br />بارك الله فيك<br />فكرتني بالزمن الجميل<br />بس بقى اسمح لي أقولك<br />أنك مش متابع كويس<br />يعني مثلا ما قلتش على الماتش الكبير اللي كان نقطة فارقة في التاريخ الكروي عام 1598 ميلادية<br />والل كان بين محلة أشمون ومنتخب مصر العليا<br />وحضره كل من سيادة الملتزم الأكبر بإقليم الحكمشاري وسيادة شاهنشاه ترعة الرياح ومملوك مصر العظيم حسني برنجل<br />والأحداث المؤسفة التي جرت من نبوت زيمبابوي لاشهير اللي ضربه كبير مشجعي فريق السراويل البرتقالية المعلم متولي العتلاوي فتوة السكاكيني<br />يللا<br />كفاية بقى حديث الذكريات<br />إخص<br />إخص<br />إخص"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041010/http://www.20at.com:80/article.php?sid=346"

[[comments]]
order = 8
subject = "غاندي البلد"
text = "ياااااااااااا يا سيادة المحافظ .. الله يسامحك قلبت علينا الذكريات والمواجع ..<br />الله يخليك كفاية كده ..."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041010/http://www.20at.com:80/article.php?sid=346"

[[comments]]
order = 9
subject = "سيادة المحافظ"
text = "خلاص يا ابني<br />متعيطش<br />وعلى رأيي عميد المسرح العربي<br />محمد بك نجم<br />ما الدنيا إلا مسمط كبير<br />(جزء من مسرحية ودان لا تسمع الألوان لصمويل بيكيت وإخراج نيكسون مانديلا بطولة نادية الجندي ومصطفى قمر وسيد زيان وثريا حلمي والمطرب الراحل محمد محيي"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041010/http://www.20at.com:80/article.php?sid=346"

[[comments]]
order = 10
subject = "غاندي البلد"
text = "الأخ سيادة المحافظ قاعد يخبط في رموز البلد العظيمة .. تطلع مين أنت عشان تتريق على الله يرحمه محمد محيي صحيح إخص إخص إخص"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041010/http://www.20at.com:80/article.php?sid=346"

[[comments]]
order = 11
subject = "تصدقوا"
text = "في برنامج على إحدى القنوات الفضائية استضافت المذيعة الشاعر سيد حجاب وقالت ما يلي:<br />طبعاً كلنا عارفين أغنية \"احمد حلمي اتجوز عايدة كتب كتابهم الشيخ رمضان\" ..<br />أنا بأه أول مرة أعرف إن في اغنية بعدها طلعت لمطرب ثاني بتقول: أحمد حلمي ساب عايدة وطلقهم الشيخ رمضان\" ..<br />أما غير المتخيل أن يظهر مطرب ثالث بيقول:<br />\"ما تصدقهومش .. دي إشاعات .. أحمد حلمي وعايدة إخوات\"<br />وبيب بيب أهلي"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041010/http://www.20at.com:80/article.php?sid=346"

[[comments]]
order = 12
subject = "يا خبر"
text = "حد شاف ماتش فرنسا وإنجلترا .. مش ممكن<br />لو لم أكن فرنسياً لوددت أن أكون فرنسياً<br />أنا لغاية دلوقتي مش مصدق"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041010/http://www.20at.com:80/article.php?sid=346"
