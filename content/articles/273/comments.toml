[[comments]]
order = 1
subject = "سيادة المحافظ"
text = "أنتم كدة يا شباب اليومين دول<br />زي القرع تمدوا لبرة<br />وناسيين أمجاد بلادكم فين أيام الضظوي والفناجيلس ومصطفى رياض وشحتة الاسكندراني وحسن الشاذلي وسيد بازوكا<br />دول اللعيبة اللي بحق<br />وبعدين بتتكلموا على العالمية<br />دول وصلوا للعالمية من زمان<br />وفاكرين ماتش المختلط مع ريال مدريد<br />ولا الإسنماعيلي والانجلبير؟<br />إخص<br />إخص<br />إخص"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041010/http://www.20at.com:80/article.php?sid=346"

