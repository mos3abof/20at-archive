[[comments]]
order = 6
subject = "الاسكندرية"
author = "المنشد محمد محمود"
posted = "2006-09-19"
text = "السلام عليكم ورحمة اللة وبركاتة انا بجد لمل شفت الحفلة حسيت ان فى ابداع فنى حقيقى وجزاكم اللة خيرا ووعد ان احنا حنوريكم حاجة قريب جدا فى اسكندرية حتعجبكم اوى طبعا مع فريق جنة الاسكندرانى وهو دلوقتى بيعد هذة الحفلة اللى بنرجوا من ربنا ان هيا تحوز اعجابكم يارب وترقبوا شريطنا القادم مع تحيات اخوكم المنشد محمد محمود الجامعة العمالية الاسكندرية فريق جنة للفن للابداع الفنى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143756/http://www.20at.com/article2.php?sid=1154"
