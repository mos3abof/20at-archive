text = "هايدي دي بلدك متنسيش كده.لازم يكون عندك ولاء لبلدك ولو علي الاقل تخلي كلامك كويس عليها امام الزوار لانك عايشه فيها وبتاخدي من خيرها فلازم تحترمي اللي ليه فضل عليكي ده المفروض.ولو مصر مش عجباكي روحي عيشي في اي بلد تعجبك وفي الاخر هتندمي وترجعي زى ال........... ولو مش عجباكي بسبب هبوط مستواها الفكرى الايام دي فده بسبب الجيل اللي طالع اللي افكاره زى الزفت معظمها؟؟؟؟؟؟؟ فحاولي تراجعي تفكيرك في رايك ده ولو عاوز تعيشي فيها حاولى لرفع شانها مش تشوية صورتها في الخارج لان لو ملكيش خير في بلدك ملكيش خير في اقرب الناس ليكي فكرى علشان لازم ترجعي نفسك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114213/http://www.20at.com/article2.php?sid=366"

