[[comments]]
order = 9
subject = "بحبها بعنف"
author = "أكرم بجد"
posted = "2006-02-03"
text = "و الله الموضوع ده ون واي ( يعني القصد انه موجه ) لان الكاتبه نسيت تقول الحوار الللي تم بين احمد السقا و مصطفى شعبان في فيلم المافيا ( ذلك المشهد الرائع تحت المطر ) لما كان احمد السقا بيقول انه بيكره مصر و بيكره الزبالة فرد عليه مصطفى شعبان ببساطة و مين اللي رمى الزبالة ؟؟<br />انا برضه بسأل نفسي لحد دلوقتي مين رمى الزبالة ؟؟<br />أكيد مش انا و لا انتوا طبعا اكيد اسرائيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114213/http://www.20at.com/article2.php?sid=366"

[[comments]]
order = 10
subject = "مصر بلدى ما أتغيرتش"
author = "أكرم بس"
posted = "2006-02-03"
text = "مصر بلدى ما أتغيرتش<br />ما أتبدلتش<br />أللى أتبدل هو أنا<br />و أنت و هما و كلنا<br />أتغيرت فينا المعانى<br />و الأمانى<br />حتى الدقايق و الثوانى<br />حتى المراكب و الموانى<br />حتى القلوب<br />ماباقيتش فيها أحاسيس تدوب<br />أو تبتسم وقت الغروب<br />بلدى ماهياش السبب<br />بلدى مازرعتش الخرايب<br />بدل العنب<br />بلدى مالعبتش بضماير<br />بلدى ما لعبتش بمصاير<br />بلدى لسة بنت حلوة<br />شعرها مجدول ضفاير<br />بس احنا أللى مالناش نصيب<br />غاويين تعاسة<br />غاويين نخيب<br />غاويين نعيش دور الضحية<br />غاويين نخون حتى الحبيبة<br />أو الحبيب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114213/http://www.20at.com/article2.php?sid=366"

