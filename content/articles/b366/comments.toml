subject = "يا جمالك يا مصر بحبك"
author = "عبدالرحمن"
posted = "2006-02-03"
text = "و الله مش المشكلة في مصر المشكلة في المصريين اللي ناموا بعد ما كانوا طول عمرهم قادة للعالم<br />الظاهر انهم في حالة إغماءة من كتر التفكيير ربنا يسهل و يقوموا بالسلامة<br />و بعدين الناس اللي مش عاجبهم حاجة في الموقع و كل موضوع يكتبوا حسراات لو مش عاجبكم الموضوع مش لازم تردوا بواخة كده أو ردوا و قولوا ايه اللي معجبكمش"
