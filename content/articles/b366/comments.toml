[[comments]]
order = 35
subject = "الله يرحمكم"
author = "قال مصر"
posted = "2006-08-30"
text = "اذا كانت مصر ام الدنيا<br />فالله يرحم الدنيا اللي امها<br />فاسقة<br />اذا كانت مصر قائدة العالم<br />الاسلامي فسلام على الدين واهله<br />واللي يتكلم ويقول مصر اشرف<br />دولة بالعالم احب اقولة<br />انه ما في اوسخ وافسق واكبر<br />من الزبالة اللي اسمها مصر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114213/http://www.20at.com/article2.php?sid=366"

