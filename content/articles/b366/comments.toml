subject = "لديانا وجوان"
author = "مصري"
posted = "2006-07-25"
text = "مالكم انتم بمصر يارمه.خليكم فبلدكم احسن.وبعدين انتوبتتكلموعلى خفة الدم دنتو ارخم واغلس شعوب الارض يخرب بيت تقل دمكم ياساتريارب دكفايه اساميكم غورو فداهيه اتعلجو الأول من الغل والحقد اللي جواكم يزباله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114213/http://www.20at.com/article2.php?sid=366"

