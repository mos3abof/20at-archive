subject = "لا شك ان الكلام ده حقد وقلةحيلة"
author = "tamer"
posted = "2006-02-18"
text = "السلام عليكم ورحمة الله وبركاته<br />انا تامر صديق من مصر - كلية الاعلام جامعة القاهرة<br />من المعروف ان مصر سيدة دول العرب والمصريين اذكى واجمل شعب على مستوى العرب وكمان بيتمتع بخفة ظل ودم مش موجودة عندك حد تاني<br />اما حكاية استخدام كلمة مصر في افيهات الافلام فده مش معناه كره او تقليل من حجم مصر في قلوب المؤلفين بالعكس ، لكن لدينا في مصر اكبر واحسن المؤلفين وحين يستخدموا كلمةمصر في جملة فاعلموا ان مفيش كلمة تانية ممكن تقوم بدور الكلمة دي في السيناريو<br />واخيرا احب اقول لكاتب المقال ده يحاول اختيار العناوين لمقالاته لان العنوان نصف الخبر وانا في اعلام واعرف حاجة زي دي كويس جدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114213/http://www.20at.com/article2.php?sid=366"

