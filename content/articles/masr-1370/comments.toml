text = "الموضوع كويس وجميل يا ا/ منير وانا عارفه انه في دماغك من سنين ولكن كان محتاج اكتر من كده شغل ولا انت مش فاضى للشباب مش كفايه الصحافه الملتزمه ع النت الشباب عاوزين يشوفوا نماذج مع انهم لو دخلوا اى دورات المياه عامه هيشوفوا كل حاجه وممكن يجوا يكتبوا"
