[[comments]]
order = 0
subject = "دردشة على باب الحمام.."
author = "سحس"
posted = "2006-12-28"
text = "بعض الآراء تعبر عن رأى سياسي يخشى صاحبه من الجهر به على ملء من الناس ، فيتحين الفرصة عندما يخلو بنفسه فيكتب عبارته حيث لا صديق فيؤيدها ولا عدو فيبلغ عنه.<br />كثيرا ما أرى داخل دورات المياه عبارات من عينة الموت لأمريكا ، أو يسقط النظام الفاسد .. وكلها عبارات تدل على كبت سياسي ينفس عنه صاحبه خلف الأبواب المغلقة<br />وأحيانا يستخدم البعض باب الحمام فى الدعوة إلى الله.. (تخيل) كأن يكتب العبارة الشهيرة \"لا تنسي دعاء الخروج من الخلاء\" .. يعنى خلاص زنقت معه الدعوة فلا يريد ان يضيع وقتا .. حتى وهو يقضي حاجته<br />,والأغرب من هذا أنك تجد أحيانا حوارا ينشأ بين اثنين من زوار الحمام الواحد غالبا ما يتطور إلى الملاسنة ، كأن يكتب أحدهما رأيا فيرد عليه الآخر بعبارة \" بلاش تكتب فى الحمام يا كذا ، فيدخل الأول مرة ثانية ويرد عليه وانت مال أهلك يا كذا..و هكذا إلى أن يتدخل ثالث بلون قلم مختلف ليفض هذه المعركة.. ذات الروائح الكريهة.<br />ونظرا لما تخلفه الكتابة من آثار سيئة على منظر الباب من الداخل .. اقترح على المشرفين على دورات المياه العمومية والمساجد ، أن يضعوا داخل كل حمام قلم \"صبورة\" يسهل إزالة آثاره بعد يوم أو اثنين ، وبجوار القلم \"بشاورة\" لمن يرغب فى إزالة أى تعليق لا يرضى عنه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103123/http://masr.20at.com:80/article.php?sid=1370"

[[comments]]
order = 1
subject = "هو فين الموضوع ؟"
author = "لور دكاش"
posted = "2006-12-28"
text = "من أسوأ الموضوعات التي قرأتها على عشرينات.. مفيش أي معلومة جديدة، ولا حتى الكاتب كلف نفسه وجاب لنا نماذج من الحاجات اللي بتتكتب في الحمامات دي. وفي الآخر راصص لنا كلام تخين وملوش اي معني.. هو مش ده برضه موقع للشباب.. ولا غيرتوه؟"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103123/http://masr.20at.com:80/article.php?sid=1370"

