subject = "روضه عبد الحميد"
author = "موضوع ممتاز استاذ منير وفكرة شبابيه فعلا؛ من المؤسف ان اراءنا لم يعد لها كان سوى ذلك المكان النجس؛لاادرى هل لان اراءنا لها رائحة الفساد ام؛لأن ارائنا دفنت بمعرفه الفساد."
posted = "2006-12-28"
text = "بس كنا نحتاج لصور لتلك الكلمات الماثورة"
archived = "2007-01-28"
