text = "ده مش كفاية لان الواحد مزاجه بيكون وحش من حاجات قوية مؤثرة صعب تغير المود على طول ممكن البوم الصور ينسينى لفترة القلق او التوتر او المدايقة بس لمدة صغيرة و المهم ان الفكرة فى اننا نحاول ننسى الحاجات دى و الحاجات دى اكيد مشاكل فننسى المشاكل ازاى, اما اننا نحلها او نتنش, فنختار ايه لو تنشت ابقى سلبية و لو حليت فيها بوينت كويسة انى هاوصل لنتيجة ايا كانت النتيجة بس اسمى خلصت منها كمشكلة وان نتيجتها جت ضدى فدى مش مشكلة لان اكيد هاتعلم منها اللى عايزة اقوله فاينل كويس ان الواحد يفكر يخرج برة المود السىء بس المهم اننا نتعلم من اللى بيقابلنا مانمشيش ورا اللى عايزينه لانه لو نصيبنا هيجيلنا غصب عن اى حد"
