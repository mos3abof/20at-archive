posted = "2008-08-13"
text = "هاااااااااااااا ااااااااااي …كيفكن …ميرسي لالك يمنى على هيدا الموضوع الحلو ومو بس حلو وكمان واقعي…وانا كتير باكد انه الانسان بشكل عام موالمراهق بس في شي بيشدو للاغاني والموسيقى بشكل خاص يعني انا في موسيقى بتبكيني وفي موسيقى بتفرحني هيك من دون سبب يعني كتير الواحد بيتاثر فيهن وخاصة اغاني تامر حسني وعلى فكرة انت يا يمنى عندك طموح وهاد الشي لازم يدعمك اكتر وان شاء الله موفقة دائما بموضيعك الحلوة متلك وكمان في مجال عملك بتعرفي تاكيدا على كلامك في مرة في الدول الغربية عملو دراسة عن اهمية الموسيقى في نفسية البشر وجربو هيدا الشي على المراة الحامل ولقو انه الجنين بيتاثر بالموسيقى وقت سماعها وكمان بيتاثر بسماع القران الكريم ولهيك ما تردي على اي حد بيقلك انه الموسيقى هبل او شي فاضي وهلا باااااااااااااا ااااااااي"
