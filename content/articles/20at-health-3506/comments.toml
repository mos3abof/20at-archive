posted = "2007-04-14"
text = "اسلام عليكم اخواني صراحة موضع مثير للاءعجاب حيث انه يتناول احسن المواضيع الاجتماعية المراهقة . كم من انسان يسال عن ادواء فقد حار الجميع ولاكن الدكتورة غادا تحدت الجميع فلقيت نفسها تداوي المراهق بالموسيقى التي هي الأمر المحير للمجتمع ولاكن نشكرها على ادواء الجميل يعني عمل من طرف دكتورة عربية % نشكرك من المغرب غادا<br />المرجوا المتابعة لكي تصبحي مشهورة في جميع انحاء العالم انشاء الله. وانصح الشباب المراهق ان يتبع نصائح *غادا عبد الرحيم* ويضع في نفسه تقة .وانا احييها على البحت الدي تعمله لكي تنقد الانسان الشاب المراهق عبر فهم نفسيته بالموسيقى الدمنسية الهادئ…"
