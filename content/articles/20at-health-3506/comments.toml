author = "الحسين اعميمي"
posted = "2007-03-28"
text = "أشد على أيادي الأخت يمنى مختار و أحييها على تناولها لمثل هذا الموضوع الهام الذي أصبح موضوع العصر، فكم من أسرة مشكلتها الوحيدة ، طفلها المراهق و كيف نتعامل معه و ما هي رغباته؟ فكم من أسرة أسألها عن طفلها المراهق خاصة عندنا في المغرب هنا، تقول بدون تردد بالدارجة المغربية: ''حمقنا هاد الدري ،ماعرفناه شنو بغا'' أي أن هذه الأسرة قد أصبحت حائرة أمام رغبات هذا المراهق،فما سبب هذه الحيرة إذن؟<br />يمكن القول أن هذه الأسرة الحائرة ينقصها فقط هذا العلم ،علم فهم نفسية الشاب المراهق، و هو التي تمارسه الأخت ''غادة عبد الرحيم'' التي أحييها من هذا المنبر، و أشد على أيديها في مسيرتها الرسالية و هو إنقاد الإنسان الشاب المراهق عبر فهم نفسيته بالموسيقى ذات الطابع الرومانسي الهادئ…"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105211548/http://20at.com/20at/health/3506.html"

