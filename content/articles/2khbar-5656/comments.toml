posted = "2007-04-30"
text = "السلام عليكم و رحمة الله وبركاته<br />الاخت نهي : انا مستغرب يعني اشمعني من قلبك و بجد… مالهاش غير احتمالين… يا انت مغيبة عن اللي بيحصل و ملكيش في الواقع و الاحداث الجارية, مجرد بتباركي لابن رئيس الجمهورية .. والتاني انك من فئة معينة لا احب ان اذكرها.<br />الاخ ياسر : تسلم ايدك والله علي اللي كتبته وان كنت احب اقولك انه غصب عنك و عني و عن كل الشعب المصري فرد فرد… هيتجوز السيد جمال… و متستغربش و تقول كيف سيهنأ و يفرح هو و الاسرة المالكة و كل هذه المحن و المصائب تجلجل علي دماغ الشعب المصري…و الاجابة بسيطة جدا…عادي… عادي خالص… عادي جدا…بل اكثر من عادي… سيفرحون و يرقصون و يستقبلون التهاني و النقوط و الهدايا … سيفرح حسني السيد ابراهيم مبارك كما سبق و فرح في زواج نجله الاكبر.. سيفرح كما فرح و استقبل احفاده… سيفرح كما فرح و تربع علي عرش مصر للمرة الخامسة…سيفرح كما فرح و استعد الدستور… كما فرح و قضي علي شخصية مصر… كما فرح و موت جميع احزاب المعارضة… كما فرح بالارصدة اللامعقولة في خزائن العالم… كما فرح باستعداد مبارك الصغير لتولي المنصب المرموق… فلا تستغرب كيف سيفرح.<br />اعتقد انه علي السيد حسني و العائلة ان يقيموا ..نكاية في الشعب المصري… فرح كبير جدا جدا جدا في اكبر مكان مفتوح في مصر .. و يوجه الدعوة لكل صاحب شكوي و كل مظلوم و كل واحد فقد اب او ابن او زوجة او اخ.. لكل ام موجوعة علي ضناها في الحبس و كل زوجة مشتاقة لزوجها الموجود وراء الشمس…لكل شاب اخد علي قفاه في القسم و اضرب لحد ما فقد ادميته… لكل طفل جاهل مصاب جوعان و علي وجهه ابتسامة بريئة و هو يري حفيد الرئيس يجلس علي حجره في المقصورة الرئيسية في الاستاد… لكل شاب بلغ سن الجواز و تعداه يكثير و يطمح كل الطوح لكي يعف نفسه و يكمل نص دينه… لكل فتاه وصلت او تعدت السن الجميل و لم تحظ بزوج يطفئ حباها و احتياجها لرجل …لكل رجل مسن عزت عليه نفسه بعد عمر طويل الا يجد اقل اقل احتياجاته من مأكل او ملبس او دواء… ساعتها اضمن لك يا عزيزي ان مصر جميعا الا قلة قليلة ستكون موجودة في الفرح …و ساعتها سنبارك من كل قلبنا لابن الرئيس و نتمناله حياه لم و لن نراها او نعيشها..لانهم جعلوها ليست حق لينا ولكن حكرا عليهم …والله ببكي."
