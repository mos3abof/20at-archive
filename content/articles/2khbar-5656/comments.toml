text = "أنا حاسس إنه مش هيلحق يتجوز ، وأتمنى ذلك أيضا ، يا ترى هو وأبوه هيعرفوا يفرحوا وهما حابسين الألاف من أبناء الشعب المصرى لأنهم يعارضونها معًا ؟<br />كيف سيفرح وآلاف النساء والفتيات تدعو عليه لأنه اختطف آباءهن أو أبناءهن أو إخوانهن وألقاهم فى السجون بلا أى مبرر إلا حبا فى السيطرة على الحكم إلى الأبد ؟<br />كيف سيهنأ مبارك وابنه وهناك ألاف الأطفال ينامون دون أن يتمكنوا من منع عيونهم عن ذرف الدموع لأن آباءهم مظلومون ومنهم من يحاكم أمام المحاكم العسكرية دون ما أى جريمة إلا حبهم لأوطانهم ؟<br />بالله عليكم كيف سيفرحان والالاف من العاملين فى شركات الشاطر وحسن مالك وسعودى والحداد وغيرهم أصبحوا من العاطلين بسبب إغلاق الشركات التى - كانوا -يعملون فيها وتعتبر مصدر دخلهم الوحيد ؟<br />ياااااااااااااا ااااااااااااااا اااااه على الظلم والقهر لما يسيطر على الناس ؟<br />هل تتصوروا أن دعاء هؤلاء المظلومين لن يؤتى ثمارا ؟<br />لا يا جماعة ربنا قريب مننا جدا وبيسمع دعوة المظلوم اللى بيدعيها فى جوف الليل ، أكيد مش هينفع إن جمال وأبوه وأمه يفرحوا ومعظم الشعب المصرى يبكى \" وكل يبكى على ليلاه \"، يعنى منهم من يبكى على غريق فى عبارة ، أو على محروق فى بنى سويف أو قلعة الكبش أو الفيوم أو القطارات التى تحرق تباعًا ، أو يبكى على معتقل غيبته السجون وذهبت بزهرة شبابه خلف جدرانها الصلبة ، ومنهم من يبكى على مريض -أو قتيل - بالسرطان الذى انتشر بفضل أتباع الرئيس ، ومنهم من يبكى أيضا على الدعامات المهترئة التى تم تركيبها لأحد أقاربه فى معهد القلب على يد شريف عبد الهادى أو قتل بواسطة أكياس الدم الملوثة التى اقتحمت بلادنا - الآمنة - على يد هانى بيه سرور …<br />القائمة طوييييييييييييي ييييييييييييلة من الضحايا والمشردين الذين يدعون على مبارك وابنه آناء الليل وأطراف النهار .<br />هل قرأت سورة الفجر ؟ وهل لاحظت الأية التى يقول فيها تعالى \" إن ربك لبالمرصاد \" ؟ بالتأكيد قرأتها قبل ذلك ، وبالتأكيد ربنا صادق فى كلامه .<br />دعوات المشردين واليتامى والمرضى والمنكوبين وذوى المعتقلين المظلومين الذين لم يقترفوا سوى حب الوطن تلاحق كافة الظالمين ..وإن غدً لناظره قريب ، أقرب مما نتصور ."
