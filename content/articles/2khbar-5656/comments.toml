text = "لا يوجد افضل مما قال عمنا احمد فؤاد نجم عندما اهدى جمال مبارك هذه القصيدة بناسبة زواجه<br />مبروك يا عريسنا<br />يا أبو شنة ورنة<br />يا واخدنا وراثة<br />أطلب وإتمنى<br />وأخرج من جنة<br />أدخل على جنة<br />مش فارقة معانا<br />ولا هارية بدنا<br />ولا تاعبة قلوبنا<br />ولا فاقعة000000<br />يا عريس الدولة<br />إفرح وإتهنى<br />ما احناش كارهينك<br />لكن هارشينك<br />حا تكمل دينك<br />وتطلع ديننا"
archived = "2009-05-22"
