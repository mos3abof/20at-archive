[[comments]]
order = 0
subject = "انها لحظه"
author = "نيفين نيفى نوفا"
posted = "2006-06-21"
text = "لا علاقه بين الحجاب كاتحد فرائض الدين و الالتزام كاحد فرائض الاخلاق<br />الحجاب شىء مفروغ منه لايصح الجدال فيه<br />و الالتزام حتى لو اقرنه الشخص بالدين لا يسقط فريضه دينيه<br />و لكن<br />لا انصح برفع رايه الفسق فى وجه غير المحجبات لان الحجاب قرار و القرار عند بعض الناس لحظه و عند البعض الاخر يحتاج وقت<br />و نرجو الهدايه للجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 1
subject = "لبس الحجاب فرض"
author = "محجبة"
posted = "2006-06-21"
text = "الكلام في اخطاء المحجبات تهرب منه- يعني لما اشوف واحد يصلي ويشرب اقوم انا وامتنع عن الصلاة لان الكثير يصلوا ويزنوا ويكذبو العيب ياجماعة فينا مش في اوامر الله والضعيف يضع الاعذار ولا ماكانش احد اسلم من الديانات الثانيةوهم بيشوفوا الصورة السيئة عن الاسلام من بعض المسلمين ما قالوش زيكم كفاية حجج واهية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 2
subject = "حرام عليكم"
author = "احمد المصرى"
posted = "2006-06-21"
text = "انا شاب مصرى لا اعرف اذا كان لى الحق فى الرد ام لا ولاكن ما دفعنى الغيره فى دفاعى عن الحق واظهار الحقيقه اتريدون ان تعلمو<br />اى حقيقه<br />الحقيقه هى انكم تخلطون بين الفرض والسنه<br />الفريضه للمرئه الحجاب بلا شك ام السنه فهيه ارتداء النقاب<br />اما بالنسبه للشاب فاتربية اللحيه له سنه<br />وحلاقتها زمب<br />اما الجلباب الابيض القصير فهوه سنه معروفه<br />بنات دينانا الجميل الحجاب فريضه عليكى.<br />لا تصح صلاتك من غيرة اذا لايصح خروجك من غيرةاما بالنسبه لرائى فى الموضوع فهو حقا يستحق النقاش فيه وكاتبته اجادات اختيار الموضوع المناسب فاليبارك الله فيها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 3
subject = "ممكن وممكن"
author = "عبدالله مفتاح"
posted = "2006-06-21"
text = "اظن ان فيه تعارض بين الالتزام والتبرج<br />يعني ممكن نقول مفيش تعارض بين عدم ارتداء الحجاب والاحترام<br />لكن الالتزام والسفور متعارضين<br />مش هزود لحسن حد يزعل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 4
subject = "طول الأمل...يورث الشرق"
author = "وطن"
posted = "2006-06-21"
text = "وعن ابن مسعود رضي الله عنه قال : خط النبي صلي الله علية وسلم خطاً مربعاً ، وخط خطاً في الوسط خارجاً عنه ، وخط خططاً صغاراً إلي هذا الذي في الوسط من جانبه الذي في الوسط ، وقال : \" هذا الإنسان وهذا أجله محيطاً به ، أو قد أحاط به ، وهذا الذي هو خارج أمله ، وهذه الخطوط الصغار الأعراض ، فإن أخطأه هذا نهشه هذا ، وإن أخطأه هذا نهشه هذا\" رواه البخاري . وعن عبد الله بن عمر رضي الله عنهما قال : أخذ رسول الله صلي الله علية وسلم بمنكبي فقال : \" كن في الدنيا كأنك غريب أو عابر سبيل \" ، وكان ابن عمر يقول : \" إذا أمسيت فلا تنتظر الصباح وإذا أصبحت فلا تنتظر المساء ، وخذ من صحتك لمرضك ، ومن حياتك لموتك \" .[رواه البخاري .]<br />وكفى بالموت واعظـــا...نسأل الله الهداية للجميع والثبات على الطاعة..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 5
subject = "يا حاج احمد المصري"
author = "محمد"
posted = "2006-06-22"
text = "يا حاج احمد المصري يا راجل يا عسل والله بعد ازنك شيء بسيط النقاب ليس سنه لان السنه هي ما اخذت عن النبي والنقاب خاص بالمراه فقط فلا يجوز ان نقول عليه سنه باختصار يا جماعه الحجاب ليس قيمه فقط للمراه لامسلمه بل هو تميز عن حياتها تميز عن باقي المجتمعات لان ديننا متميز للغايه والمراه المسلمه اعطاها الاسلام حق لا يمكن ان تخيله من قوته ومتانته فالحجاب جزء اساسي من الاسلام ولا يعقل ان يوضع الحجاب تبع الاهواء الشخصيه والاراء الشخصيه فانا احترم الفتاه التي قالت انها تعرف ان الحجاب فرض لكن لا تلبسه فهذا هو حالها المهم انها علمت انه فرض اما بخصوص الموضه فالاسلام لم يضع زيا معينا للحجاب بل وضع العلماء شروطا للحجاب والمراه باختيارها ترتدي ما تشاء فتلك حريتها المهم ان تكمل كل تلك الشروط فحجاب اهل اندونيسيا غير حجاب اهل باكستان غير حجاب اهل روسيا غير حجاب اهل مصر فالاذواق تختلق والتقاليد وايضا الموضه المهم ان تحافظ علي شروط الحجاب وهذا لحريه المراه فلها حق الاختيار في ملابسها المهم ان تحافظ علي الشروط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 6
subject = "\"ميني\" اسلام"
author = "في صمتك مرغم"
posted = "2006-06-22"
text = "صراحة معظم الأراء اللي اتذكرت في الموضوع تضحك...أولا انا متفق تماما ان الأسلام ليس حجابا فقط, ولكنه أيضا لا يكتمل بدون حجاب مهما قيل...وبخصوص الاخت التي قالت \"فيوجد أشياء أخري أهم مثل الأخلاق الإسلامية وأداء العبادات\" كان الحجاب والعبادات دي حاجات ملهاش اي علاقة بالحجاب.... الحجاب ضرورة من ضروريات الدين, وإذاي دينك هيكتمل وانت اجزاء من جسمك ظاهرة \"للماشيين في الشارع\" انت بكده كأنك صندوق كل اللي يشوفك يرمي فيه سيئتين او تلاتة<br />وانا عن نفسي مش هقبل اتجوز صندوق<br />مفيش احسن من الحلويات المغلفة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 7
subject = "كفاية تخلف!"
author = "عمر الاسيوطي."
posted = "2006-06-22"
text = "هي دي مشكلتنا منذ الاذل كل حاجه نبص فيها للمظاهر يعني خلاص الاسلام خلص وما فيش حاجه نتكلم فيها غير الحجاب في اشياء اهم في عقائد واخلاق واشياء احنا عمرنا ما اتربنا عليها مثل العمل لمؤاخذه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 8
subject = "الصلاه افضل"
author = "مسلمه"
posted = "2006-06-22"
text = "استغربت جدا لما البنات المتبرجات سواء محجبات او لا يدخلو الجامع يلبسو الاسدال<br />والحق يتقال بيستئذنو الاول من اصحابهم الاولاد امال<br />بس يصلو احسن من انهم يتبرجو وكمان يتركو الفريضه<br />اللهم ارنا الحق حقا وارزقنا اتباعه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 9
subject = "كفاية كفر ....حرام"
author = "سلمي حافظ"
posted = "2006-06-22"
text = "السلام عليكم ورحمة الله وبركاتة...اية الكلام الغريب دة يا عشرينات...البنات دية رموز سيئة للبنت المسلمة موضة اية والشعر تاج اية كل دة كفر في كفر.الحجاب دة فرض ولا جدال في ذلك مش انا مش محجبة بس بصلي ماينفعش طبعا الكلام الفرض الاول طبعا والاخ الغريب الاسيوطي اية اللي انت بتقولة دة حرام عليك انت مسلم انت اعرف الاول معنى القران الكريم أفهم معني الاية وتعمق فيها وربنا يهديك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 10
subject = "حرقة دم"
author = "saber"
posted = "2006-06-22"
text = "مش عار بصراحة ارد علي تعليقات بنات اخر زمن بأيه؟؟<br />بس هسألكم شوية اسألة وطبعا الاسئلة ديه ليهم ولشوية الجزم المتبرجات اللي هيقرأوا هذا التعليق<br />انتي متبرجة ليه..؟؟؟<br />كاشفة شعر اهلك ليه؟؟؟<br />لابسة ضيق ليه؟؟؟<br />عشان الموضة؟؟؟<br />لا ...انتي كذابة مش عشان الموضة ولا حاجة انتي بتعملي اعلان عن نفسك.....انتي بنت رخيصة .....ملكيش اي لزمة...او تفتكري ان اي ولد بيبصلك انه بيتمناكي زوجة ليه....لو بيتمناكي زوجة ليه فهو مش راجل...اسمه امعة او ديوس....ممكن يكون عاوزك زوجة عشان يتربح من وراكي ويشغلك في (......).....بس في الغالب هو بيبصلك عشان في قلبه مرض ويتمني انه يقضي معاكي وقت وبعد كدا يرميكي زي الكلبة....ودا اللي بيحصل في اغلب الاحوال.....انتي عارفة انا لو اطول اولع فيكم بنار واحرقكم كلكم...هعملها....يمكن انا ردي قوي بس مش بعرف اعمل زي عمرو خالد واتمايل يمين وشمال واقولكم ان الدين حلو وابقوا تعالوا عندنا ....لا دين ربنا عزيز ....ولو عاوزين تدخلوه لازم تعرفوا انه غالي....والبنت اللي بتدخله بتكون هي كمان غالية مش رخيصة<br />ادعوا الله لكل بنات المسلمين بأن يرزقهم الله العفة ويشرح صدورهم للتدين....وان يخسف بكل من هي متبرجة وكاسية عارية الارض<br />قال رسول الله صلي الله عليه وسلم<br />: ( صنفان من أهل النار لم أرهما … قوم معهم سياط كأذناب البقر يضربون بها الناس ، ونساء كاسيات عاريات مائلات مميلات ، رؤوسهن كأسنمة البخت المائلة ، لا يدخلن الجنة ولا يجدن ريحها ، وإن ريحها ليوجد من مسيرة كذا وكذا )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

