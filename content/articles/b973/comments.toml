[[comments]]
order = 32
subject = "لا حول ولا قوة إلا بالله"
author = "سمسم"
posted = "2006-07-05"
text = "بسم الله الرحمن الرحيم<br />مش عارف أقول غير كلمة واحدة لا حول ولا قوة إلا بالله.<br />بقى أخواتنا المسلمات بيقاتلوا فى الخارج (تركيا وفرنسا..إلخ) علشان يلبسوا الحجاب. واحنا وبكل بساطة عادى ولا تفرق مع بناتنا لبسهم للحجاب من عدمه.<br />يا أخواتى بصوا وشوفوا أخواتكم فى الخارج متمسكين قد إيه بالحجاب وبيناضلوا عشان محدش يعريهم ويزيل حشمتهم.. والله أسأل أن يهدينا جميعاً.<br />الله أكبر ولله الحمد<br />الإسلام هو الحل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 33
subject = "متبرجات ملتزمات"
author = "هبة الرحمان"
posted = "2006-07-05"
text = "بسم الله الرحمان الرحيم<br />اود ان ابدي رايي الا و هو انا الحجاب هو فرض و فرض وفرض على كل مسلمة حقيقة تردن تعدرن انفسكن ولكن والله مافي عدر حرام وكانكن لستن مسلمات وبعدين وين المشكلة الله سبحان و تعالى فرض علينا الحجاب رحمة بنا فالله لا يكلف نفسا الا وسعها وهدا رايي خصوصا بعدما تحجبت واخيرا الحمد لله والسلام عليكم ورحمة الله تعالى وبراكاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 34
subject = "هدانا الله واياكم"
author = "اختكم في الله"
posted = "2006-07-06"
text = "قبل اي شئ احب اقول لكم اني احبكم جميعا في الله<br />واحب اسال كل اخواتي المعترضات علي الحجاب<br />انتوا ماشاء الله بتقولوا احنا بنصلي ومحترمات ودا احسن حاجه فعلا في الاسلام وهو حسن الخلق<br />لكن اسلامنا عزيز جدا ومش بيتجزأ ولازم لما ناخده.ناخده كله علي بعضه ماينفعش نقول انا هاخد منه الصلاه او الصوم او الاخلاق بس واسيب حاجات تانيه ياعني لازم ناخده كله حته واحده<br />والاياات اللي يتامرنا بالحجاب في القرآن كتير منها اللي في سوره النور ومنها اللي في سوره الاحزاب ياريت نقرا القران كمان ونفهم معانيه كويس ما هو دا برضه من الاسلام<br />ونعرف انا ربنا لما امر بيه كان علشان تقديره الشديد للمرأه وشده حرصه عليها لانها عامله زي الجوهره الغاليه لازم تكون متغططيه ومحفوظه مش مكشوفه لكل عين<br />وبيتهيألي لو واحده مننا عندها حاجه غاليه اكيد يتفضل تحوط عليها وتداريها لانه غاليه طبعا ودا اللي الاسلام عمله معانه علشان يكرمنا<br />فامينفعش ربنا يختار لينا التكريم واحنا نقله لا يارب مش عاوزين التكريم دا<br />وعلي فكره ارتداءالحجاب او عدمه مالوش علاقه اطلاقا بالزواج لان اله سبحانه وتعالي كاتب لكل واحده مين هو زوجها من قبل ماتتولد ....ولو كان زوجك هو اللي عاوزك مكشوفه قدام الناس فدا دليل علي عدم غيرته عليكي وانه عاوز يعرضك قدام الناس وفي النهايه هو ايضا محاسب امام الله<br />واما الحجاب الدلع اللي بنشوفه كتير جدا هذه الايام والبنت تكون لابسه وكأنها مش لابسه ندعيلهم ان ربنا يهديهم جميعا الي الحجاب الصحيح<br />وهدانا الله جميعا الي ما يحب ويرضي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

