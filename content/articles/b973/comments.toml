subject = "الله أكبر - يا مسلمات فوقوا"
author = "محمد مصطفى"
posted = "2006-07-16"
text = "اللى ما تعرفش تقول عدس - جاتكوا خيبة مش فالحين غير فى الجدال...غلط غلط..<br />الحجـاب يا فتــاة الإسـلام<br />الحمد لله، والصلاة والسلام على رسول الله صلى الله عليه وسلم، وبعد: فهذه رسالة قصيرة موجهة إلى الأخت المسلمة تتعلق بمسألة الحجاب والسفور، ولا يخفى على عاقل ما عمت به البلوى في كثير من بلاد المسلمين من تبرج كثير من النساء وعدم التزامهن بالحجاب، ولا شك أن هذا منكر عظيم، وسبب لنزول العقوبات والنقمات. وفي هذا الرسالة بيان لفرضية الحجاب وفضائله وشروطه، وتحذير من التبرج وعواقبه، نسأل الله أن ينفع بها أخواتنا المؤمنات، إنه ولي ذلك والقادر عليه.<br />الحجاب عبادة وليس عادة<br />أختي المسلمة: إن دعاة الضلالة وأهل الفساد يحاولون دائما تشويه الحجاب، ويزعمون أنه هو سبب تخلف المرأة، وأنه كبت لها وتقييد لحريتها، ويشجعونها على التبرج والسفور وعدم التقيد بالحجاب، بدعوى أن ذلك دليل على التحرر والتحضر، وهم لا يريدون بذلك مصلحة المرأة كما قد تعتقده بعض الساذجات، وإنما يريدون بذلك تدمير المرأة والقضاء على حياتها وعفافها، فاحذري أختي المسلمة أن تنخدعي بمثل هذا الكلام، وكوني معتزة بدينك متمسكة بحجابك، وتأكدي أن الحجاب أسمى من ذلك بكثير، وأنه أولا وقبل كل شيء عبادة لله وطاعة لرسوله صلى الله عليه وسلم، وليس مجرد عادة يحق للمرأة تركها متى شاءت، وأنه عفة وطهارة وحياء.<br />أختي المسلمة، إن الله تعالى عندما أمرك بالحجاب إنما أراد لك أن تكونٍ طاهرة نقية بحفظ بدنك وجميع جوارحك من أن يؤذيك أحد بأعمال دنيئة أو أقوال مهينة، وأراد لك به أيضا العلو والرفعة . فالحجاب تشريف وتكريم لك وليس تضييقا عليك، وهو حلة جمال وصفة كمال لك، وهو أعظم دليل على إيمانك وأدبك وسمو أخلاقك، وهو تمييز لك عن الساقطات المتهتكات . فإياك إياك أن تتساهلي به أو تتنكري له، فإنه - والله - ما تساهلت امرأة بحجابها أو تنكرت له إلا تعرضت لسخط الله وعقابه، وما حافظت امرأة على حجابها إلا ازدادت رضا وقربا من الله، واحتراما وتقديرا من الله.<br />شروط الحجاب الشرعي<br />إن الحجاب الشرعي للمرأة المسلمة يجب أن يكون سميكا غير شفاف، وألا يكون زينة في نفسه كأن يكون ذا ألوان جذابة يلفت الأنظار، ولا ضيقا، ولا لباس شهرة، ولا معطرا؛ لأن النبي صلى الله عليه وسلم حرّم على المرأة أن تتعطر وتخرج إلى مكان فيه رجال أجانب، فقال: (أيما امرأة استعطرت فمرت بالقوم ليجدوا ريحها فهي زانية)، وألا يشبه لباس الرجل، ويجب أن يكون الحجاب أيضا ساترا لجميع البدن بما في ذلك الوجه الذي تساهلت بكشفه بعض النساء بحجة أنه ليس بعورة. وياللعجب كيف لا يكون الوجه عورة وهو أعظم فتنة في المرأة، وهو مكان جمالها ومجمع محاسنها، وإذا لم يفتتن الرجل بوجه المرأة فبماذا سيفتتن إذا ؟!!<br />ولقد وردت نصوص كثيرة في الكتاب والسنة تدل على وجوب تغطية المرأة لجميع بدنها؛ لأن المرأة كلها عورة لا يصح أن يرى الرجال الذين ليسوا من محارمها شيئا منها، ومن هذه الأدلة قوله تعالى: (وليضربن بخمرهن على جيوبهن) النور (31) قالت عائشة رضي الله عنها: (لما نزلت هذه الآية أخذن نساء الأنصار أزرهن فشققنها من قبل الحواشي فاختمرن بها) أي : غطين وجوههن. وأيضا ما جاء في الحديث المتفق على صحته في قصة عائشة رضي الله عنها في حادثة الإفك لما نامت في مكانها ثم أتى صفوان ابن المعطل إليها قالت: فخمرت، وفي رواية: (فسترت وجهي عنه بجلبابي) الحديث كل ذلك مما يدل على وجوب تغطية الوجه .<br />لذا يجب على كل امرأة مسلمة أن تتقي الله في نفسها، وأن تلتزم بحجابها التزاما كاملا، ولا تتساهل بأي شيء منه، كأن تكشف مثلا كفيها أو ذراعيها، أو تلبس نقابا أو لثاما مثيرا للفتنة، تظهر من خلاله جزءا كبيرا من وجهها، أو تغطي وجهها بغطاء شفاف يشف ما تحته، ثم تعتقد بعد ذلك أنها قد تحجبت حجابا كاملا، وأن ما كشفته من جسمها يعتبر أمرا بسيطا لا يثير الفتنة، أو لا يعتبر من التبرج، المذموم، وأنه يجب عليها أن تحرص على أن تتجنب كل ما قد يؤثر على حجابها أو يخدش حيائها، لئلا يطمع فيها الفسقة كما هي عادتهم مع المرأة التي لا تظهر بمظهر الاحتشام الكامل ، ولكي لا تعرض نفسها لسخط الله وعقابه، كما ورد ذلك عن رسول الله صلى الله عليه وسلم في قوله: (صنفان من أهل النار لم أرهما …) وذكر (… ونساء كاسيات عاريات مميلات مائلات، رءوسهن كأسنمة البخت المائلة، لا يدخلن الجنة ولا يجدن ريحها، وإن ريحها ليوجد من مسيرة كذا وكذا) رواه مسلم.<br />قال أهل العلم: معنى كاسيات عاريات أنهن يلبسن ملابس لكنها قد تكون ضيقة أو شفافة أو غير ساترة لجميع الجسم.<br />وسئل فضيلة الشيخ محمد بن عثيمين –حفظه الله تعالى- عن صفة الحجاب الشرعي، فأجاب حفظه الله بقوله: القول الراجح أن الحجاب الشرعي أن تحجب المرأة كل ما يفتن الرجال بنظرهم إليه، وأعظم شيء في ذلك هو الوجه، فيجب عليها أن تستر وجهها عن كل إنسان أجنبي منها، أما من كان من محارمها فلها أن تكشف وجهها له .<br />وأما من قال إن الحجاب الشرعي هو أن تحجب شعرها وتبدي وجهها… فهذا من عجائب الأقوال !! فأيما أشد فتنة : شعر المرأة أو وجهها ؟! وأيما أشد رغبة لطالب المرأة أن يسأل عن وجهها أو أن يسأل عن شعرها؟<br />كلا السؤالين لا يمكن الجواب عنهما إلا بأن يقال: إن ذلك في الوجه. وهذا أمر لا ريب فيه، والإنسان يرغب في المرأة إذا كان وجهها جميلا ولو كان شعرها دون ذلك، ولا يرغب فيها إذا كان وجهها ذميماً ولو كان شعرها أحسن الشعر، ففي الحقيقة أن الحجاب الشرعي هو ما تحتجب به المرأة حتى لا يحصل منها فتنة أو بها، ولا ريب أن متعلق ذلك هو الوجه .<br />التبرج والسفور دعوة إلى الفاحشة والفساد<br />إن المرأة إذا تبرجت وتكشفت للرجال - غاض ماء وجهها، وقل حياؤها، وسقطت من أعين الناس، وعملها هذا دليل على جهلها وضعف إيمانها ونقص في شخصيتها، وهو بداية الضياع والسقوط لها، وهي بتبرجها وتكشفها تنحدر بنفسها إلى مرتبة أدنى من مرتبة الإنسان الذي كرمه الله وأنعم عليه بفطرة حب الستر والصيانة، ثم إن التبرج والسفور أيضا ليس دليلا على التحضر والتحرر كما يزعم أعداء الإسلام ودعاة الضلالة، وإنما هو في الحقيقة انحطاط وفساد اجتماعي ونفسي، ودعوة إلى الفاحشة والفساد، وهو عمل يتنافى مع الأخلاق والآداب الإسلامية، وتأباه الفطر السليمة. ولا يمكن أن تعمل هذا العمل إلا امرأة جاهلة قد فقدت حياءها وأخلاقها؛ لأنه لا يتصور أبدا أن امرأة عاقلة عفيفة يمكن أن تعرض نفسها ومفاتنها هذا العرض المخجل والمخزي للرجال في الأسواق وغيرها دون حياء أو خجل.<br />وريما تعتقد بعض النساء أنها إذا خرجت متبرجة كاشفة وجهها ومفاتنها للناس أنها بذلك ست**ب إعجاب الناس واحترامهم لها، وهذا اعتقاد خاطئ؛ لأن الناس لا يمكن أبدا أن يحترموا من تعمل مثل هذه الأمور، بل إنهم يمقتونها وينظرون إليها نظرة ازدراء واحتقار، وهي في نظرهم امرأة ساقطة معدومة الكرامة والأخلاق، فكيف ترضى امرأة عاقلة لنفسها بكل ذلك؟! وما الذي يدعوها إلى أن تهين نفسها وتنزل بها إلى هذا المستوى؟! أين ذهب عقلها وحياؤها؟!<br />فيا من أغراها الشيطان بالتبرج والسفور: اتقِ الله وتوبي إليه من هذا العمل القبيح، واعرفي مالك وتذكري مصيرك، وتذكري سكناك وحيدة فريدة في القبر الموحش المظلم، وتذكري وقوفك بين يدي الله عز وجل، وتذكري أهوال يوم القيامة، وتذكري الحساب والميزان، وتذكري جهنم وما أعد الله فيها من العذاب الأليم لمن عصاه وخالف أموره .. تذكري كل ذلك قبل أن تُقدمي على مثل هذا العمل، واعلمي أنك والله أضعف من أن تتحملي شيئا من عذاب الله، أو أن تطيقي شيئا من هذه الأهوال العظيمة التي أمامك، فارحمي نفسك ولا تعرضيها لمثل ذلك، وبادري بالتوبة النصوح قبل أن يغلق في وجهك الباب ، ويعلوك التراب، فتندمي ولات ساعة ندم.<br />كلمة إلى بعض الرجال<br />إنها لم تفسد أكثر النساء ولم تصل إلى هذا الحد من التبرج والسفور والتهاون بدينها وحجابها إلا بسبب تهاون بعض الرجال مع نسائهم واستهتارهم بدينهم وفقدهم لنخوة الرجال وغيرتهم وعدم نهيهن عن مثل هذه الأعمال.<br />فيا حسرتاه … ترى كم فقد بعض الرجال من رجولتهم حتى أصبحوا أشباه رجال لا رجالاً، فويل ثم ويل لأولئك الذين لا يعرفون كرامتهم، ولا يحفظون رعيتهم، ولا يحسنون القيام على ما استرعاهم الله من النساء، ولقد توعد رسول الله صلى الله عليه وسلم من فرّط في حق رعيته فقال: (ما من راع يسترعيه الله رعية يموت يوم يموت وهو غاش لرعيته إلا حرم الله عليه الجنة)<br />فيا أيها الرجال إن أعراضكم كأرواحكم وقد فرطتم بها كثيرا، فأهملتم الرعاية، وضيعتم الأمانة، وركبتم الخطر، وإن تهلكون إلا أنفسكم وما تشعرون أفلا تعقلون وتتوبون إلى ربكم وتحفظون نسائكم.<br />وصلى الله وسلم على نبينا محمد وعلى آله وسلم"
