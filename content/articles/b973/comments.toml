posted = "2006-06-23"
text = "انا نفسي افهم حاجة مهمة قوي يعني اية البنت تسمح لنفسهاانها تنزل من البيت من غير حجاب اهلها فين لازم الاهل لازم يفرضوا علي بنتهم الحجاب امال اسمة فرض لية اماحاجة غريبة صحيح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

