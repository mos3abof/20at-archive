[[comments]]
order = 54
subject = "لنبك على أمتنا"
author = "متحسر على عقول شباب هذه الامة"
posted = "2006-09-14"
text = "واحسرتاع على شبابنا الذين لايرون الفضيلة الا في الحجاب . جميهعم يفكرون بالشكل لا المضمون . اذا كانت الفتاة محجبة فهي شريفة اما اذا كانت طبيعية في لباسها وعلاقاتها وتصرفاتها فهي من أهل النار . الاتعتقدون ايها الشباب ان الفسق هو في النميمة والغيبة والنفاق المتفشي في كافة شرائح مجتمعنا ؟ الكل يتكلم عن الحجاب والحجاب فقط . ان معنى الحجاب ان الفتاة لاتثق بالشاب لأنه اذا رأى جزءا منها فسينط عليها ويغتصبها . ان الحجاب معناه ان شبابنا ذئاب لايستحقون الثقة . ان الحجاب معناه ان الفتاة بضاعة ما ان يراها من يراها الا وسيشتهيها وكأن لامحل للعواطف الانسانية لدى الشباب وكأن لديهم فقط الشهوة الجنسية .ان الحجاب يعني ان الفتاة ليست انسانة ذات عقل وبامكانها تقديم شيء للمجتمع . ان الحجاب يعني ان الفتاة لدينا ليس لديها مهمة في الحياة الا ارضاء شهوات الرجال . يكفينا شرشحة : العالم كله ينظر الينا وكأننا انصاف بشر بسبب تصرفاتنا وسلوكياتنا وعلاقاتنا القائمة فقط على الشهوة الجنسية المعبأة في نفوسنا وتنتظر الانطلاق لدى اول حركة من الفتاة . ياجماعة عيب علينا .فكروا وناقشوا . هل الشباب حيوانات ولاتسيطر على افكارهم الا الشيق الجنسي ؟ اليس هناك محل في تفكيرهم للعلم والتفكير والعمل والبناء : بناء مستقبل الاجيال القادمة ؟ غي كل المجتمعات يخططون لمستقبل اولادهم الا المجتمعات الاسلامية فهم لايفكرون الا في اخلاقيات اجدادهم . السنا في حاجة للمستقبل ؟واحسرتاه على شباب امتنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

