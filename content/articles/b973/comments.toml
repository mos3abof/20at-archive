[[comments]]
order = 12
subject = "فين ده"
author = "عبدالله مفتاح"
posted = "2006-06-22"
text = "هو الراجل غلط خالص في عمرو خالد<br />مضمون كلامه بيمدح فيه<br />بيقول ان عمرو خالد عنده حكمه مش موجوده عنده هو<br />يعني مغلطش في عمرو خالد خالص<br />تحياتي ليك يا صابر بس خليك هادي شويه عشان البنات بيزعلوا وده مش اسلوب دعوة<br />يعني حاول وانت بتكتب تحافظ على هدوءك الكلام هيطلع شيك وحلو<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 13
subject = "افاتؤمنون ببعض الكتاب وتكفرون ببعض"
author = "هو انا مش فاهم هما البنات دول مش مقتنعين بأن الحجاب فرض"
posted = "2006-06-22"
text = "طيب الصلاة اللى هما محافظين عليها دى هى كمان فرض<br />اشمعنى لا يتهاونوا فى الصلاة ويتهاونوا فى الحجاب<br />طيب يعنى ممكن واحدة منهم تلبس حجاب شرعى مش حتة منديل على راسها<br />وتسيب الصلاة خالص<br />ممكن يعنى ولا لا<br />الحقيقة انهم بيتبعوا هواهم<br />عايزين يعروا اجسادهم وخلاص<br />الموضة عندهم اهم من ربنا<br />بيعبدوا الموضة مش بيعبدوا ربنا<br />اللهم اهدينا للاسلام ياكريم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 14
subject = "عيب قوى"
author = "اروى"
posted = "2006-06-22"
text = "أظن عيب أوى يا أستاذ\\ة المشرفين على التعليقات تسيبوا تعليقات مسيئة للدين الاسلامى بحجة انها حرية تعبير فهل ياترى كاتب تعليق (حجاب العقل ) ده قسيس ولا راهب كل واحد حر يعبد زى ماهو عاوز بس حلوا عننا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 15
subject = "محب عمرو خالد وابو اسحاق الحوينى"
author = "محب عمرو خالد وابو اسحاق الحوينى"
posted = "2006-06-22"
text = "لا حول ولا قوة الا بالله ان اخوتنا اللى بيلبسو الحجاب التعبان او الاشبه بالمثير<br />ما فعلو هذا لله ولا<br />لان عندهم فى نفسيتهم ضغط انى لاذم اتحجب لانى مسلمة فبتفصل حجاب على مذجها علشان ترضى نفسها ولاكن تبقا الفترة السليمة تذكر صاحبتها ان هذا لا يس بالحجاب ولاكن هذا لاكى ترضى نفسك<br />الاسوء من ذالك<br />انهم بيسيئو للاسلام فترا النصارى يقولون المسلمون يدعون العفة والحجاب<br />وبنات الملسمين هما الان اللى بيفتنو الشباب<br />والاسوء ان الاجيال القادمة من البنات الاعدادية وما شبه هذه المرحلة ايضا تتوقف عند ذالك الحجاب<br />اتقو الله اخوتنا<br />وسعدو الشباب على غض البصر والعفة<br />ومش العرى ولا الضيق هو اللى حيخليكى تجوزى لثلاثة اسباب<br />1 لانى الجوز قدر ونصيب<br />2 لان الشباب معهمش فلوس<br />3 لانى الشاب اللى بيتزوج بيفكر بتفكير مختلف عن تفكير الجا معة وهو انه لا ياخذه اللى الناس اتفرجو على جسمها ولا يامن لها على اولاده<br />ففى الذواج نتجه للملتزمة<br />ربنا يتوب علينا وعليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 16
subject = "الحجاب فريضة وليس مظهر اسلامى"
author = "محمد فايد"
posted = "2006-06-23"
text = "الحجاب هو فريضة اسلامية يجب على كل مسلمة ارتداءه وليس مظهرا اسلاميا ممكن للفتاة المسلمة ان تظهر به او لا, وارد على الراى القائل بان جوهر الدين هو فى المعاملات والسلوك والتصرفات وليس فى الحجاب بان كل واحدة محجبة تسئ السلوك هى مسلمة ناقصة الايمان ويجب ان تصلح احوالها مع الله, وعلى الجانب الاخر فان كل فتاة غير محجبة وملتزمة سلوكيا وملتزمة بالعبادات هى ايضا مسلمة ناقصة الايمان وندعو لها بالهداية ولا يجب ان نرفع راية الفسوق فى وجهها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 17
subject = "الحجاب قبل الحساب"
