text = "يقول المولى عز وجل \"وقل للمؤمنات يغضضن من ابصارهن ويحفظن فروجهن ولا يبدين زينتهن الا ما ظهر منها وليضربن بخمرهن على جيبوهن\"<br />ففى الايه الكريمه امر بالحجاب وللتوضيح كلمه جيبوهن تعنى منطقه الراس والرقبه والصدر والامر هنا للمؤمنات ولكنى ارى ان كاتب المقال لم يات براى واحده فقط ملنزمه ولكن كلهم متبرجات وللاسف يخدعون انفسهم بانهم سوف يرتدون الحجاب وهذا من تدليس الشيطان عليهم بالتسويف فليتقين الله فالموت ياتى بغته ."
