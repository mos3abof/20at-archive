[[comments]]
order = 56
subject = "اتقوا الله"
author = "مسلمة"
posted = "2006-10-14"
text = "بسم الله الرحمن الرحيم<br />والصلاة والسلام على رسوله الكريم<br />لعل هذا التعليق جاء متأخرا جدا ولكن شاء الله أن أقرأ اليوم ما كتب وقدانتابتني حسرة كبيرة لما قرأت منآراء من أناس المفروض أنهم مسلمون<br />أقول لمن يقول أن سبب تخلفنا هو بحثنا عن الماضي وعن فرضية الحجاب وكيفية دخول الحمام (أعزكم الله) أقول له نحن ما تخلفنا وأصبحنا من الدول التي تسمى بالنامية إلا عندما ابتعدنا عن تلك التعاليم السامية التي جاء بها الإسلام وحثنا عليه نبينا الكريم<br />هل كانت الأمة الإسلامية أكثر عزا كما كانت أيام الرسول صلى الله عليه وسلم ؟؟؟؟<br />وتلك الأيام التي تلتها حيث كان الناس لا يزالون يمتثلون لأوامر الله وأوامر رسوله صلى الله عليه وسلم؟<br />نحن ما ابتعدنا عن الركب إلا عندما ابتعدنا عن الدين<br />ألا يذكر الأخ أن علوم الطب والكيمياء وجميع العلوم التي قامت عليها نهضة اوروبا هي من المسلمين عندما كانوا حقا مسلمين؟؟!<br />وأقول لأخواتي هداهن الله عليكن بتقوى الله ومعرفة أوامره سبحانه والحرص على ألا تكن مثل اليهود الذين قالوا نؤمن ببعض ونكفر ببعض .. حاشاكي أختي الغالية أن تكوني كذلك<br />ثم ألم تقرأي قول الله تعالى \"يا بنى آدم لا يفتننكم الشيطان كما أخرج أبويكم من الجنة ينزع عنهما لباسهما ليريهما سوآتهما إنه يراكم هو وقبيله من حيث لا ترونهم إنا جعلنا الشياطين أولياء للذين لا يؤمنون \" أي أن عدم سترك جسدك هو من عمل الشيطان وفتنته فاحذري<br />قد يزين لك الشيطان ويسمي لك الأشياء بغير أسماءها ليفتنك ويخرجك من حياءك وسترك وما ذاك إلا ليجعلك وسيلة ليفتن بك الشباب الذين إن التزموا كانت مصيبة كبيرة لشياطين الإنس قبل الجن<br />ثم اعلمي أخية أنك بخروجك متبرجة تجمعين سيئات كل من نظر إليك وافتتن بك ما دام يفكر بك وبكيفية الوصول إليك فهل أنت على استعداد لجمع كل هذه السيئات ؟!<br />اتق الله أخية بنفسك أولا وبالشباب ثانية واعلمي أنك بالتزامك بالزي الشرعي ستنالين بإذن الله حسنات بكل نظرة إليك تذكر بالله<br />ملاحظة:<br />أرجو من المسؤولين عن هذا الموقع متابعة التعليقات جيدا على المواضيع فهناك من يدسون أسماء لمواقع اباحية فاحذروا لأن هذا سيكون مما تسألون عليه يوم القيامة وسيكون في ميزانكم الى يوم القيامة فانظروا ماذا تجمعون وما هو كائن في ميزانكم<br />وفقكم الله جميعا لما يحب ويرضى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 57
subject = "اقراوا وعوا"
author = "بيان من أجل إسلام مستنير.. 27 مقترحاً لإصلاح الإسلام"
text = "د. ابراهيم نتو: كاتب سعودي- عميد سابق في جامعة البترول<br />نشرة الأزمنة العربية<br />يعتبر مالك شبل، العالم الأنثروبولوجي المعروف، من أبرز المثقفين الفرنسيين من أصول مغاربية والمختص في شؤون العالم العربي. أسس في عام 2004 في فرنسا مؤسسة للإسلام المستنير. وقد نشر حوالي 20 كتابا عن الإسلام، ركز فيها على مواضيع حساسة وغير مطروقة، مثل الحب في الإسلام، حيث يقول إن الإسلام ديانة تتعامل مع الحواس، ويدين النظرة الأصولية المتشددة للعلاقة بين الرجال والنساء.<br />كما تطرق إلى بعض القضايا التي تعتبر من المحرمات، مثل الخمر والمثلية الجنسية. وتتضمن مؤلفات مالك شبل \"قاموس الحب في الإسلام\"، و\"موسوعة الحب في الإسلام\". أما الجانب الآخر من اهتماماته فانصب على إصلاح الإسلام، والذي خصص له كتابين رئيسيين هم:\"الإسلام والعقل: معركة الأفكار\"، و\"بيان من أجل إسلام مستنير\".<br />ولد مالك شبل في الجزائر عام 1953 وفيها أكمل دراساته الجامعية حتى أصبح أستاذا معيدا في جامعة قسطنطينة. ثم سافر إلى باريس وتخرج من معهد الدراسات السياسية ونال شهادة الدكتوراه من السوربون. ثم أصبح أستاذا في قسم الدراسات العربية والإسلامية في جامعة السوربون الجديدة باريس الثالثة. وهو مختص في علم الانثروبولوجيا والتحليل النفسي بل ومارس التحليل النفسي في المغرب وتونس وفرنسا والولايات المتحدة. ثم انخرط في دراسات عديدة عن التراث الإسلامي والأدب العربي.<br />في كتابه بيان من أجل إسلام مستنير (2004 وضع شبل 27 مقترحا لإصلاح الإسلام، استند فيها إلى قيم القرن الثامن عشر وعهد التنوير الأوروبي، عندما قادت العقلانية والعلمانية الطريق نحو التقدم السياسي والاجتماعي والثقافي.<br />وفي أول مقترحين يرسي شبل مبادئ الإصلاح: تفسير جديد للقرآن، وأولوية العقل على الإيمان. لكنه يرفض الإلحاد، مشيرا إلى أنه\" لا يمكن تحقيق أي نجاح ذي أهمية خارج إطار الدين\".<br />ويدعو شبل لوضع حد للجهاد باسم الإسلام، فالجهاد بنظره غير أخلاقي، كما يدعو إلى إلغاء جميع الفتاوى التي تحض على القتل، وكذلك العقوبات البدنية في الإسلام. وهو يقف ضد ختان الإناث والعبودية والاتجار بالبشر في العالم العربي. ويطالب بتشديد العقوبات على مرتكبي جرائم الشرف وترقية وضع المرأة.<br />ويدافع شبل في مقترحاته عن استقلال القضاء، وأسبقية الفرد المسلم على الأمة الإسلامية، كما يرفض الاغتيال السياسي ويدعو لنشر الديمقراطية في العالم العربي.<br />وهو أيضا يدافع عن إحداث تغييرات ثقافية أساسية، مثل إدخال حرية الفكر ضمن القيم الإسلامية، ورفض عبادة الفرد، واحترام الآخر، ومحاربة الفساد.<br />أما مقترحاته الأخرى فتتعلق بالتكنولوجيا والبيئة والإعلام. وتهدف جميع هذه المقترحات إلى توفير مفاتيح لإسلام عصري ومستنير وإصلاحي.<br />فيما يلي مقترحات شبل لإصلاح الإسلام وهي مقسمة إلى جزئين من ناحية الموضوع.<br />إصلاحات أساسية شاملة<br />يقترح شبل عددا من الإصلاحات الأساسية الشاملة للتمكن من إنجاز الإصلاح في العالم العربي. وهو يمزج الإصلاح في مجال الدين والسياسة والقضاء والتعليم وحقوق المرأة.. الخ:<br />1- تفسير جديد للقرآن: عند قراءة القرآن على المرء أن يأخذ في الاعتبار عنصر الزمن والتغيرات التاريخية. ويجب أن تتناول القراءة الجديدة للقرآن القضايا المعاصرة للمسلمين، سواء بالنسبة للإسلام أو العالم. لأن التفسير الجديد هو مجرد طريقة لتكييف الإسلام مع الحداثة.<br />2- أولوية العقل على جميع أشكال الفكر والاعتقادات: هناك ظاهرة عامة تميز العالم الإسلامي وهي إنكار العلم والتقدم. وبغية إصلاح الإسلام ينبغي على الدول الإسلامية أن تعيد النظر في التعليم الديني، وأن تكيّف القرآن مع وقائع العالم المعاصر. ولقيام المسلمين بذلك عليهم إحياء صلتهم بالجوانب المستنيرة في الحضارة الإسلامية التي غيبها النسيان.<br />3- إدارة المجتمع عن طريق السياسة وليس الدين: يشير شبل في هذا المقترح إلى العلمانية حيث يجب فصل السياسة عن الدين، وأن تتمتع بمنزلة أعلى منه. ويوضح أن الغرب لم يكن قادرا على تحقيق تقدمه الهائل لولا خروجه من تحت وصاية الكنيسة.<br />4- الاستثمار في الإنسان: ليس هناك من وسيلة أفضل للتقرب إلى الله من ترقية أجمل مخلوقاته وهو الإنسان، ويضيف شبل قائلا \"الإسلام سوف يظل إلى الأبد دين الفقراء، إذا كانت النخبة لا تجاهد من أجل وضع الإنسان في مركز الحياة الاجتماعية\". وبالنسبة لشبل فإن \"الاستثمار في الإنسان\" يعني أيضا الكفاح ضد التمييز الذي يقوم على أساس العرق أو الجنس، ومحاربة الجهل، وتطوير التعليم. وهذا ينطبق على التوزيع العادل للثروة، والأخذ بعين الاعتبار إرادة الناس واحترام \"الآخر\"، بما في ذلك الجيران والأجانب والنساء والأطفال.<br />5- الفرد أعلى مكانة من المجتمع: إن حقيقة كون المجتمع في الإسلام أهم من الأفراد، أدى إلى تأخير – وأحيانا- الحيلولة دون ظهور القدرة على التعبير الذاتي عند الفرد المسلم. ولذلك فإنه، عبر التأكيد على أن المسلمين مسؤولون عن أعمالهم ويتحملون نتائج تلك الأعمال، نكون قد شرعنا في إقامة التمييز بين المستوى الجماعي والمستوى الفردي. وحسب شبل فإن حرية الاختيار تسمح بالمسؤولية الفردية، والتي بالتالي تسمح بالتقدم.<br />6- حرية التفكير والضمير ينبغي أن تصبح فضيلة إسلامية: يقول شبل إن تحقيق هذا الهدف هو من الصعوبة بمكان. فحرية الضمير تعني قبول المسلم لغيره من المسلمين مثلما هم، بصرف النظر عن درجة إيمانهم الديني. وقد سعى الإسلام إلى معاملة جميع المسلمين على قدم المساواة، حيث لا يتم الحكم على الناس حسب العرق أو الثروة. لكن ما يحدث هو أن المسلمين يرفضون فضيلة الاختلاف كما ينبذون الفكر الفردي. وبالتالي ينظر إلى المفكرين الأحرار، في ضوء الإسلام، باعتبارهم مجرد زنادقة أو أفضل الأحوال غير مؤمنين. ولمواجهة ذلك ينبغي على الإسلام أن يطور نوعا من الإنسانية، تجعل من حرية الضمير أمرا ممكنا.<br />7- احترام الآخر: يستشهد شبل بحديث يقول إن المسلم لا يكون مؤمنا حتى يحب لأخيه المسلم ما يحب لنفسه. ويقول إنه يجب على المسلمين أن يحترموا الآخرين، بنفس القدر الذي يريدون من الآخرين أن يحترمونهم فيه. فإذا كان المسلمون يريدون من الغرب أن يحترم طقوسهم في تحريم بعض الأطعمة ورفض الاختلاط بين الرجال والنساء- فإن عليهم إظهار نفس القدر من الاحترام والتسامح تجاه الأديان الأخرى في البلدان الإسلامية، بما في ذلك المسيحية واليهودية والبوذية.. الخ. وليس كما يحدث الآن حيث يطالب المسلمون ببناء مسجد في فرنسا، لكن من غير المسموح فيه أن يكون للمسيحيين كنائس في السعودية. وحيث من الجائز المطالبة بحرية السفر والتنقل في دول الغرب، بينما في السعودية يمنع (نظريا) دخول غير المسلمين. ويتساءل شبل لماذا لا يسمح لأتباع الديانات الأخرى بدخول المسجد؟!<br />إصلاحات محددة<br />وبالإضافة إلى الإصلاحات الأساسية الشاملة، يقترح شبل إجراء تغييرات معينة داخل الإسلام، في محاولة لوضع نهاية للعنف باسم الدين. وهو يقترح أيضا إجراء إصلاحات سياسية محددة، تهدف إلى تشجيع الديمقراطية في العالم العربي، وإصلاحات اجتماعية لزيادة رفاه وسعادة الإنسان في البلدان الإسلامية.<br />8- ترك الجهاد وتبيان عدم فائدته: يتساءل شبل أليس من الممكن أن نستبدل الحرب بالسلام؟ ويجيب :\" يجب اعتبار الجهاد غير شرعي بما أنه يتضمن القتل، الذي هو أمر غير مقبول في نظر القرآن، وأيضا بسبب أنه يستخدم لتبرير جميع أشكال العدوان\".<br />من الناحية الأخرى يجب تشجيع مبادرات السلام سواء جاءت من داخل العالم الإسلامي أو من خارجه. ويقترح شبل إنشاء منظمات إسلامية غير حكومية، بموارد كافية، لتشجيع السلام بين البشر، سواء في الأراضي الإسلامية أوفي أي مكان آخر إذا تطلب الأمر.<br />ويكتب شبل :\" أنا أؤمن أنه لا توجد ديانة تصرف من المال على تسلحها، كما يفعل العالم الإسلامي\". ويشير إلى أنه \" لا توجد إعادة توزيع للثروة، وإذا وجدت، فإن ما يهم هو بناء المساجد فقط\".<br />9- إلغاء جميع الفتاوى التي تدعو للقتل: إن إصدار فتاوى تدعو للقتل، أمر لا يمكن وضعه تحت تصرف شخص واحد. فالإنسان مهما كان مستنيرا أو معصوما، لا يمكن أن يمنح سلطة أكبر من محكمة بكاملها. لذلك فإن أفضل شيء هو إلغاء استخدام الفتاوى أو على الأقل إلغاء تلك التي تدعو للقتل. إن هناك نوعان من الفتاوى، فتاوى عادية وهي تهدف إلى حل المشاكل بين الأفراد، وفتاوى تضع بعض البشر في مصاف العدالة الإلهية. هذا النوع من الفتاوى ينبغي إلغاؤه بالكامل، بينما يمكن الإبقاء على النوع الأول. إن الفتوى يجب اعتبارها نوعا من المشورة غير الملزمة التي تقدمها سلطة مؤهلة- مثل استشارة الطبيب.<br />10- تحسين أوضاع النساء: يعتبر طرد الزوجة من المنزل وتعدد الزوجات والزواج القسري (خاصة للفتيات الصغيرات السن)، وجرائم الشرف وغيرها، كلها نتيجة للوضع الدوني للمرأة. وبالتالي تجب مراجعة القوانين المدنية لتدعيم وضع النساء. فلا يجب أن ينظر للمرأة بعد الآن على أنها مخلوق هامشي.<br />11- إلغاء العقوبات البدنية :ليس هناك أكثر بربرية من قطع يد السارق أو رجم الزاني. ومثل هذه العقوبات، بما في ذلك الجلد، وجدت قبل الإسلام، ومن الغريب أنها دخلت إلى الدين الذي من جانب آخر يدعو إلى التسامح إزاء الضعيف. أيضا، بما أن عقاب المرأة الزانية في القرآن هو مائة جلدة، فإنه لا يحق لأي محكمة أن تصدر حكما بالموت كعقوبة للزنا، مثلما يحدث في بعض الأحيان.<br />12- منع الختان: يطالب شبل بمنع جميع أنواع الختان، بما أنه لا يوجد أي أساس له في القرآن، باستثناء بعض الإشارات القليلة في الأحاديث النبوية. لذلك يجب إبلاغ الفتيات التي يراد إجراء الختان لهن وكذلك عائلاتهن بأن هذا الأمر هو خروج عن الدين. ويؤكد شبل أنه يجب نزع الصفة الدينية عن جميع أنواع الختان، وخاصة ختان الإناث الذي لم ينص عليه أي حكم ديني مطلقاً.<br />13- إلغاء عقوبة جرائم الشرف: يبدي شبل استغرابه من أن النساء لا يزال يتوجب عليهن المحافظة على طهارة جماعة بشرية معينة. فمثل هذا الواجب يجعل منهن ضحايا لجرائم الشرف. وفي مسعى لاستئصال جرائم الشرف، فإنه يدعو لوضع قوانين تحمي الضعفاء، كما يجب ضمان حرية الاختيار للنساء، إذا تعلق الأمر بالعلاقة مع الطرف الآخر.<br />14- تحديث القانون المدني وقوانين الأحوال الشخصية: يشدد شبل على أن الفقه الإسلامي يحول دون أن يكون الإسلام تقدميا أو داعية للسلام والتسامح. ويضيف \"لقد نشأ الفقه في الأساس كعلاقة مع الواقع، لكنه فقد صلته بالواقع منذ فترة طويلة\". ويقترح شبل التخلي عن الفقه الذي أصبح \"الجناح المسلح\" لرجال الدين، واستبداله بقوانين تستمد روحها من العصر. وهو يؤكد أن أفضل شيء للإسلام الإصلاحي هو اختيار أكثر القوانين كفاءة لدى الدول الأخرى، والتأكد من إمكانية تطبيقها في سياق عربي ومسلم. ويوضح مالك شبل أنه في حين يجب تخفيف العقوبات البدنية في الإسلام، فإنه يتعين سن عقوبات ضد قضايا مثل الفساد، الذي يعتبر أسوء ما ابتليت به المجتمعات الإسلامية. ويرى شبل أن الإلغاء التام للفقه دفعة واحدة سيكون أمرا صعبا، لذلك يقترح إجراء مراجعة شاملة للفقه من أجل إزالة ما أصبح باليا، والاحتفاظ بما لا يزال مواكبا للحياة. لكن في جميع الأحوال يجب التخلص من الجوانب البربرية في الشريعة، مثل قطع يد السارق، أو رجم الزاني، أو منح الرجل ضعفي نصيب المرأة في الميراث. وهو يرى أن إصلاح الفقه أمر ضروري من أجل تشجيع العدالة وتعزيز وضع النساء.<br />15- إنشاء قضاء مستقل: في الدول العربية، النظام القضائي عادة تابع للسلطة السياسية، وحيث الأحكام تصدر اعتباطا. لذلك فإن وجود قضاء مستقل سوف يجلب قدرا أكبر من العدالة.<br />16- حرية الوصول إلى الوسائل السمعية والبصرية: يؤكد مالك شبل على ضرورة ضمان حرية الوصول إلى جميع المسائل المتعلقة بالفن والموسيقى. إذ لا يوجد أي أساس ديني للإدعاء بأن الإسلام يحرم الصور مثلا. لكن المسلمين يعتبرون أن الموسيقى ما لم تكن دينية فهي من عمل الشيطان. ويضيف أنه في الألفية الثالثة، لم يعد ممكنا منع الموسيقيين والمطربين والراقصين من ممارسة فنهم، مثلما أنه لم يعد ممكنا منع الناس من الظهور<br />24/06/2006<br />اقرأ بقية التعليق .."
