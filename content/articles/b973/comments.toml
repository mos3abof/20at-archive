[[comments]]
order = 24
subject = "اللهم اهدى شباب المسلمين"
author = "أبو زياد المصرى"
posted = "2006-06-27"
text = "السلام عليكم ورحمة الله وبركاته<br />أقول للأخوات عدة نقاط :<br />1- ممكن تكون أخت مش محجبه وتصوم وتصلى وتقوم الليل كله وتتصدق - ستجمع الف حسنه تضيع منها فى نظره أو اثنين للسيئات التى ستطرح عليها من النظر لجسدها الغير محجب<br />2- الحجاب طاعه لله فمن ارتضى الاسلام دينا يقبله كل ولايجزأ ولايصح أن يقول نطبق البعض ونرفض البعض كما قالت اليهود<br />3- لماذا لم تستفتى أى من الأخوت المعترضات على الحجاب فضيلة المفتى ؟ أليس هو على رأس الفتوى فى بلادنا المسلمه أنصحكم بسؤاله فورا ولينظر كل منك عمن يأخذ دينه<br />أقول قولى هذا وأستغفر الله لى ولكم فأسيتغفروه<br />أبو زياد المصرى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

