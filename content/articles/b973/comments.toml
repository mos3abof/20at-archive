[[comments]]
order = 27
subject = "الحجاب فرض و ليس إختيار"
author = "سميرة من المغرب"
posted = "2006-07-02"
text = "الى كل من تقول الحجاب اختيار ،اقول لها الحجاب فرض فرضه علينا الله سبحانه و تعالى فكيف تعلنين اسلامك بدون حجاب،هل تصح صلاتك من غير حجاب سؤاليطرح على كل متبرجة تقول انها مسلمة، طبعا لا و الف لا ادا لا يصح خروجك من غير حجاب ،<br />اما الاخت التي قالت انه في محجبات لا يلتزمنا باخلاق الحجاب اقول لها انت احتجبي و لا تقليدهم.<br />وهدانا الله اجمعين"
archived = "2006-11-02"
