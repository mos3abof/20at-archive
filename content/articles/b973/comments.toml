posted = "2006-07-04"
text = "بسم الله الرحمن الرحيم<br />وبه أستعين<br />أكرم الله القائمون على الموقع وهداهم الله..ولكن عندي أمنية بسيطة ، إن صور العاريات والمحجبات المودرن لنراها كثيرا - بم أننا متوصي علينا شوية من بوش وحبايبه-ولا يجب عليكم بذل جهد مضني في عرض هذه القبائح علينا،لذا أتمنى من إدارة الموقع إذلة هذا الصورة أعلاه من الموقع، إرضاءا لله ورسوله-0 صلى اله عليه وسلم- وجزاكم اله خيرا.."
