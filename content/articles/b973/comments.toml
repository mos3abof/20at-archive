[[comments]]
order = 36
subject = "كفاية تشتيت للناس"
author = "سارة مصطفى السيد النجار"
posted = "2006-07-12"
text = "انا بس عاوزة ارد على بعض الكلمات اللى قيلت عن الحجاب بانة قرار وممكن يحتاج لوقت وانة ليس فريضة بل حرية ولاعلاقة لة بالدين كل دة تخريف وليس لة اساس من الصحة لان فى اية فى سورة النور مشهورة واغلب النساء عرفينهابتحس على ان الحجاب فريضة وكمان فى حاجة مهمة اوى عيب لما نقول على اوامر ربنا انها محتاجة تفكير او اقتناع فاللة اعلم بشؤن عبادة"
