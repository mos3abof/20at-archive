[[comments]]
order = 28
subject = "تنتظرون النصر، وأنا أنتظر حجارة أو نارا من السماء"
author = "الباكي على أمته"
posted = "2006-07-04"
text = "بسم الله الرحمن الرحيم<br />وبه أستعين<br />قال رسول الله صلى اله عليه وسلم\" صنفان من أهل النار لم أرهما..وذكر منهما..ونساء متبرجات كاسيات عاريات مائلات مميلات رؤسهن كأسنمة البخت،لا يدخلن الجنة ولا يجدن ريحها \"<br />وهؤلاء هن اللاتي تراهم العين في طرقات المسلمين..<br />أقول لكل متبرجة مكشوفة الشعر، أو الذراعين،ومن ارتدت حجابا وجسدت عوراتها، أترضين ألا تدخلى الجنة ولا تجدي ريحها؟؟<br />إنكن - أيتها العاريات- أخطر على الأمة من جيوش أمريكا وأوروبا،فقد فتنتم شبابها، فضلوا عن السبيل..<br />\"إن الذين فتنوا المؤمنين والمؤمنات ثم لم يتوبوا فلهم عذاب جهنم ولهم عذاب الحريق\" قرآن كريم<br />ولن ينفعكن يوم القيامة جمالكن إلا من أتى الله بقلب سليم، واذكرن كمن منشاب دفعتموه بعريكن إلى الرذيلة وإلى النظر الحرام ، أيتها المسلمات لا تكَنًٌٌَُ شيطانات<br />ورحم الله أحد الصالحين ،فقد انقطع المطر، وكادت تهلك الخلائق والناس ينظرون إلى السماء يترقبون البشائر،فيقول الرجل\"إنكم تنتظرون الماء، وأنا أنتظر حجارة من السماء\"..وليس ذلك إلا لعظم ما رأى من ضلال قومه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 29
subject = "يلاهوىىىىىىىىىىىى يا خرابىىىىىىىىىىىىى"
author = "adhb_85"
posted = "2006-07-04"
text = "ياريتني ماقيته ولا سمعت الردود ايه ده ايه الحلاوه دي ناس مش مقتنعه بالحجاب وناس بتدعي عليهم ان ربنا يخسف بيهم الارض يا سلام على هيئة علماء المسلمين اللي في الموقع واللي بيردو كمان افتولنابعضهم افتى ان الحجاب مش فرض لان الولد مش بيربي دقنه يا سلام ايه الهنا ده طب ده الحجاب فرض ومفيهوش خلاف واللي بيتكلم في انه مش فرض ياريت يسمع شريط الحجاب لعمرو خالد او غيره مفيش مجال اشرح لكن فعلا لازم تدور احنا لو قولنالها خلي بالك في شك ان الملزمه دي داخله في الامتحان هتلف على كل اصحابها علشان تتاكد لكن ديننا هناخده من ماا وباا واصحابي وياسيدنا الشيخ يا اللي دعيت عليهم وشتمتهم استغفر النبي صلى الله عليه وسلم لما جاله صحابي طلب منه الزنا مشتمهوش ولما جاله صحابي قاله انا زنيت برضه مشتمهوش والصحابه لما اغتابو امراه زنت النبي صلى الله عليه وسلم نهرهم تيجي انت تدعي عليهم (ادعوا الى سبيل ربك بالحكمه والموعظة الحسنه) ويارب نفهم ونتغير ده احنا كلنا غلابه اوى وربنا يسترها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 30
subject = "أيها الفاشلون"
author = "الباكي على أمته"
posted = "2006-07-04"
text = "بسم الله الحمن الرحيم<br />وبه أستعين<br />إلى الذين يتباكون على تخلف أمتنا عن ركب التقدم، ويلصقون خيباتهم بالتمسك بالإسلام..<br />إن بلادنا - الإسلامية- حاربت الإسلام منذ عقود عدة ، قبل تمرد أمريكا ووجود إسرائيل، وقد حكمتم بالعلمانية تارة والإشتراكية تارة أخرى وبكل مذهب ومنهج إلا الإسلام ، فياأيها الغبياء إن الإسلام برئ من فشلكم وخيبتكم ..<br />إن كنتم تزعمون أنكم مسلمون ، فإنكم لا بد أن تؤمنوا يقينا أن الله هو الذي رضى لنا هذا الدين ، فكيف يرضى الله دينا لعباده يقودهم إلى التخلف والرجعية ، أفلا تعقلون؟؟<br />هذا إن كنتم مسلمين حقا ، وأما إن كنتم منافقين أو ملحدون أو مرتدين ، فأبشروا ولا بشرى لكم، ف\"إن نصر الله قريب\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 31
