subject = "أنها صفقة خاسرة"
author = "السلام عليكم"
posted = "2006-07-31"
text = "أن الأخت التي لا ترتدي حجابها و لا تستر مفاتنها و تلزم نفسها بما تنتقية من الفرائض أنما هي في صفقة خاسرة و ربما أتي الله علي عملها فجعله هبائا منثورا فما تأخذة من حسنات بأداء الفرئض - التي أختارت أن تؤديها - يضيع بالسيئات من ترك الفرائض الأخري - مثل الحجاب.<br />و والله أن المرء ليصيلي و يصوم و يزكي و لا يعلم أتقبل الله أم أن عمله خالطه نفاق أو تفريط أو أحبط كله.<br />كل من علمت و أيقنت بفرضية الحجاب و لم تتحجب فهي في ذنوب ما دامت متبرجة خارج منزلها و أمام غير المحارم من الرجال.<br />و أدعوا الله سبحانه و تعالي أن يهدينا ألي سواء الصراط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

