subject = "ان شاء الله في الفردوس"
author = "مريم"
posted = "2006-07-28"
text = "السلام عليكم و رحمة الله و بركاته يجب على هؤلاء النسوة ان يخجلن عندما يقلن انا مسلمة فكيف يطبقن الفرائض كلها و يتركن عنصرا اساسية اتخدته امهات المؤمنين طريق هداية و نور فؤاد فكما تؤمن بان الصلاة و الصيام فرض و يقمن به و احجاب و ليس اي حجاب بل الحجاب الشرعي الدي يراعي حرمة المرأة المسلمة و عورتها و ليس حجاب الموضا يعتبرنه لهوا فاين مساعدتك لخيك المسلم في غض البصر و انا متؤكدة انك تعرفين حق المعرفة ان مرأة متعبدة تقوم الليل و تصوم النهار و لكن تغتاب و تنمم ادن هي في النار فالحجاب الشرعي هو ايضا يشكل جزءا كبيرا من عبادات و طاعة الله لدلك ارجو من كل مسلمة بحق ان تخاف من ربها و تراعي ان الموت قادمة و قد لا ينفعك شيئا و السلام عليكم و رحمة الله و بركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 49
subject = "حاجه تحزن لا حول ولا قوه الا بالله"
author = "ســـــــــــــمــر"
posted = "2006-07-29"
text = "الاخ عمر الاسيوطى<br />انا مقراتش التعليقات بس لفت نظرى كلام الاخ عمر<br />اولا والله حاجه تخلى الواحد يحزن لحال الامه ازاى يا اخ عمر نقلل من قيمه الحجاب ونقول فى حاجات اهم<br />وننسى حديث النبى صلى الله عليه وسلم نساء كاسيات عاريات مائلات مميلات رؤوسههن كاسنمه البخت المائله لا يدخلن الجنه ولا يجدن ريحها فيما معنى الحديث<br />لا حول ولا قوه الا بالله<br />ازاى نقلل من قيمه الحجاب اللذى به تصلح الامه ويصلح حال الشباب<br />هى لو كل بنت ملتزمه بحجابها الشرعى مكنش الشباب وقعوا فى الزنا والحب والعشق وما يخالف الشرع<br />واخيرا احب اقول يا بنات اتقين الله والبنطلون الجينز والبادىة لا يعتبر حجاب ابدا وانما هو تبرج ونساء كاسيات عاريات<br />وتخيلى يا اختى بمنظرك ده وقابلتى النبى فى الشارع هل هتروحى تسلمى عليه!!!!!! وهتقوليله ايه!!!!!!!<br />فلتحذر كل اخت او اخ يقلل من قيمه الحجاب<br />حجابنا الغالى يا مسلمات والله المفروض كل يوم نحمد ربنا انه فرضه علينا ليعفنا ونرقى به ويعاملنا الناس كعقل وليس سلعه وجسد<br />لا اله الا الله اللهم اصلح احوال شباب المسلميـــــــــن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

