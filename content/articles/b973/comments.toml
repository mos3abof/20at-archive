text = "اولا احب اقول لكل واحد شتم ربنا يسامحك و يهدينا جميعا و اذا كان دة دليل على شئ فهو دليل على عدم الفهم الواضح للأمور. بالمناسبة احب اقول ان مش اي واحدة مش مغطية شعرها تبقى لازم لابسة الضيق و القصير ممكن جدا تبقى لابسة محترم اكثر من بنات محجبات<br />سؤال.... كام واحدة في مصر مغطية شعرها و كام واحدة محجبة ؟ على الأقل المش محجبة لاتدعي شئ اما المغطية راسها...هو دة المفروض اللي تناقشوة فعلا.."
