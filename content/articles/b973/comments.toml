[[comments]]
order = 52
subject = "الحجاب ليس فرضاً دينياً.. بل عرفاً إجتماعياً"
author = "مصري ..وفقط"
posted = "2006-08-03"
text = "الحجاب ليس فرضاً دينياً في عصرنا هذا لإنتفاء أسباب تشريعه، فمن الثابت عن جمهور الفقهاء (ومنهم المذاهب الأربعة الشهيرة) أن الحجاب أنما هو فرض على المرأة الحرة البالغة فقط، أما الأمة أو الجارية فتمنع (أي تمنع بالقوة) من تغطية شعرها بل وقد قام عمر بن الخطاب بضرب جارية في السوق لأنها تشبهت بالحرائر وغطت شعرهاومنعها من ذلك.<br />وقد إستقر فقهاء المسلمون طيلة أربعة عشر قرناً على أن الحجاب أنما هو للتفريق بين الحرة والأمة ، ويمكن مراجعة أي كتاب متخصص في الفقه للتأكد من أن الجواري يمنعن من تغطية رؤوسهن كالحرائر، بل وكن يبعن في الأسواق شبه عرايا، ويمكن للباحث أن يراجع كيف كان الصحابي الجليل عبد الله بن عمر بن الخطاب يشتري جواريه.<br />وبما أن الرق قد ألغي بالقانون، فإن أسباب تشريع الحجاب قد إنتهت تاريخياًً و لأ أظن أبداً أن الله سينزل لهذا المستوى حتى يعاقب إمرأة أو فتاة أرادت أن تبدو جميلة .. أم من يرى في هذا فتنة عمياء فعليه أن يراجع طبيبه النفسي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

