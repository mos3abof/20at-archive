posted = "2006-06-23"
text = "اللي تعرض نفسها دي رخيصة وواطية وناكرة لامرالله وتستاهل القتل لانه اعلنت عصيانها ورفضهالامر ربنابحجةعدم الاقتناع اكثر من كدة استهانة بالاسلام مافيش وقال ايه بتقول انها مسلمة انتي بتكذبي على الخالق او المخلوق وكمان بتجاهري بالمعصيةطب خلي شعرك يمنع عنك عذاب جهنم"
