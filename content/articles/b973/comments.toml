text = "سلام كبير لاهل مصر حبايبنا ثم على كل من في الموقع الرائع...نبينا محمد صلى الله عليه وسلم يقول(الدين المعامله) يعني ان روح الدين ورأس سنامه هو المعامله وفي حديث آخر(انتم شهداء الله في ارضه)اي على الناس.من هذا المنطلق لابد ان نحكم على الناس من معاملتم لنا اما عباداتهم فهي بينهم وبين الله هو اعلم منا بعباداتهم وماذا يعملون في الخفاء وماذا يضمرون في انفسهم...مع خالص تحياتي"
