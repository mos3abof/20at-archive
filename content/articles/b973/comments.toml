[[comments]]
order = 22
subject = "الاسلام لا يحتاج لمستشرقين من اي جتسية"
author = "محجبة"
posted = "2006-06-25"
text = "تعبت نفسك على الفاضي كل دي المقالة الاسلام دين ودنياالى يوم البعث صالح لكل الازمان لا يحتاج الى تعديل فهو دين اتى من الكمال المطلق ولا يشوبه نقص ونحن لن نكون مثل من حرفوا دينهم وجعلو من كتابهم المقدس كتب ومراجع حسب اهوائهم ولكل ملة كتاب يسطر بايديهم وينسبونه الى الخالق ويقرا بالمزامير والاورغ ويدندن فيه ويعلوا فيه التصفيق والرقص والتمايل نحن باقون على ديننا والاختلاف بين المسلمين لا يفسد للود قضية فاخرج منها فانك واتباعك من الضالين والمغضوب عليهم الى يوم الدين والاسلام دبن نهضة شاملة وما تخلفنا الا لاننا هجرناه وليس لتمسكنا به بل وكثر اختلافنا فيه رغبة في التنصل من المسؤولية والعيش مثل الهوام كما تعيش باقي الاديان المحرفة حبا في الدنيا وشهواتها واولها فتنة النساء وما يسمى بتحررها كي نبلغ ما بلغ الغرب من دعارة وبغاء وزنا وابناء بلا آباء ولقطاء وتشر-الاسلم حفظ للمراة كرامتها وعزتها وشرفها ويكفيها انها اما برضاها ندخل الجنة اختا برعايتها ندخل الجنة بنتا بتربيته الصالحة تدخل الجنة عمة او خالة بوصلها يبارك الله في اموالنا وصحتنا وزوجة اخيار الرجال من هو خير مع زوجته ولم يحملها الاسلام ما حمل الرجال من تكاليف ونفقة لبيته حتى مالها الخاص خالص لها تتصرف به كيف تشاءفما احلى الاسلام لو اتبعناه قلبا وقالبا فرسولنا الامي كان فردا واحدا وبالاسلام اصبح امة باقية ليوم يبعثون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

