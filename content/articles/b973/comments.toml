capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 19
subject = "ده مش اسلوب دعوة ابدا"
author = "محجبة تحترم الآخرين"
posted = "2006-06-23"
text = "اولا انا محجبة من خمس سنين والحمد لله ..<br />بس بجد انا لو مش محجبة وقرأت التعليقات الي فيها شتايم دي كنت هعند بزيادة ..<br />انتو فاكرين انكو لما تشتمو البنات دول وتقولو عليهم كلاب ورخاص انهم هيموتو خوف ويتجبو تاني يوم؟؟<br />ومين قال ان البنت المش محجبة هدفها الوحيد انها تلفت نظر الشباب وانها تتجوز ؟؟<br />ولما يمكن كمان البنت بتتحجب علشان يتقال عنها \"الحلويات المغلفة\" ؟؟<br />انا كمحجبة بتهان اوي من الكلمة دي .. كأن محور افعال البنت سواء المحجبة او المش محجبة علشان تتجوز !!<br />وبعدين ربنا الي بيحاسب مش انتو .. ال يعني سيادة الولد المحترم اللي شتم فوق ده ما ارتكبش معصية .. ولا البنت الي شتمت فوق برضو كأنها كدة قامت بالامر بالمعروف والنهي عن المنكر<br />الاسلام مش كدة خالص يا جماعة.. وربنا بس هو اللي بيحاسبنا على المظهر والباطن بتاعنا وكل انسان خطّاء .. ربنا يهديكم جميعا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

