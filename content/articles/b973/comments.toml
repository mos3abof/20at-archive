text = "كانهن لؤلؤ مكنون وصف الله الحور بهافلما لا نكون مثلها لؤلؤ لا يرانا الا ازواجنا ونحيا فى ستر ورضا الله اللهم ادم الحجاب علينا نعمة ووفقنا الى طاعتك الى لقاك<br />والله العظيم الحياة بالحجاب رائعة بها تكون المسلمة ملكة متوجة مصونة فى ثوبها فنحن الغاليات لا الرخيصات<br />فنحن المكنونات لاالمتهتكات<br />فنحن احفاد خديجة وعائشة<br />الحمد لله الهادى الى الحجاب"
