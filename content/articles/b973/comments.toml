text = "اخواتى الاعزاء السلام عليكم او Hi لبعض الفتيات اتمنى لكم حياة سعيده مليئه بالخير والعمل الصالح . الدين لا يتجزأ الدين كل نأخذه كما امرنا الله ورسوله انا لا افتى ولا استطيع هذا فقط ما اقتنع به الحجاب يزيدك جمالا فوق الجمال بالنسبه لى انا لا استمتع الا برؤيه الفتاه المحجبه ام المتبرجه فلا خقيقى لا اجد فيها الجمال الحقيقى الحجاب فرض من الله ورسوله فكيف تجزئى بينه وبين العبادات الاخرى وكيف تقولين ان بر الاهل واجب لا طاعه لمخلوق فى معصيه الخالق ولا تؤجلى حجابك ليوم ما او بعدين ابدأى على طول دون تردد وهناك من الملابس الشيك جدا التى ينطبق عليها صفات الحجاب اذا اردتى ان تسايرى الموده كما تقولين لا تنسوا الحجاب الجمال كله"
