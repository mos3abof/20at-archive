[[comments]]
order = 45
subject = "للبنات اللى مش فاهمة حاجة (ياريت تفهمو دينكو الاول وبعدين تتكلمو)"
author = "NICE EMOTION"
posted = "2006-07-22"
text = "بسم الله الرحمن الرحيم<br />يا أيها النبى قل لأزواجك وبناتك (ونساء المؤمنين) يدنين عليهن من جلابيبهن ذلك ادنى أن يعرفن فلا يؤذين وكان الله غفورا رحيما<br />صدق الله العظيم (سورة الاحزاب)<br />ومش عاوز بقى الاقى واحدة تقولى لأ ده ربنا قال جلابيبهن مش الحجاب<br />علشان انا مرارتى اتفقعت من البنات اللى بيقولو الحجاب ملوش دعوه بالعبادات<br />من الاخر الحجاب فرض فرض فرض على كل مسلمة بالغة<br />وياريت للبنات اللى مش فاهمه يدرسو دينهم فى الاول قبل مايتكلمو<br />يعنى ياريت يعترفو انهم بيرتكبو ذنب او معصية بدل مايبررو موقفهم بكلام عن الدين اللى هم مش فاهمين منه حاجة غير انه مكتوب فى البطاقة مسلمة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 46
subject = "كلمة اخيرة"
author = "NICE EMOTION"
posted = "2006-07-22"
text = "بصراحة انا كتبت ردى على الموضوع بس من غير ما أقرا التعليقات<br />ولقيتها بصراحة حاجة تكسف لان لقيت بجد ناس كتير بتشتم ومتعصبين على الاخر<br />ياجماعة كل المفروض يتعمل ان كل واحد عنده دليل يثبت مشروعية الحجاب ويثبت فرضيته ياريت يكتبه فى تعليق او حتى حديث او كلام عالم من العلماء فى فرضية الحجاب<br />والبنات من حقهم يقررو هل يلبسو الحجاب او مايلبسهوش<br />بسم الله الرحمن الرحيم<br />لا اكراه فى الدين<br />صدق الله العظيم<br />وللناس اللى بتقول انا لو بأيدى كنت احرق واضرب واموت<br />انت مين انت علشان تعمل كل ده<br />هل انت احسن من رسولك صلى الله عليه وسلم اللى كان بيدعو الناس بالتى هى احسن<br />هل حد عينك الحاكم بأمر الله مثلا<br />ياجماعة اتقو الله فى البنات شوية<br />ومعلش اعزرونى لو كنت اتنرفزت شوية فردى اللى قبل كده بس معلش الكلام اللى قالوه البنات فأول الموضوع يستفز اى حد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

[[comments]]
order = 47
subject = "ليه بنلف وندور"
author = "ادهم"
posted = "2006-07-23"
text = "ش عارف احنا ليه بنلف وندور وبنتكلم كتير في حاجه محسومه وواضحه المفروض في الاسلام الحجاب فرضه يعني زي اي فرض في الاسلام ده من ناحيه يعني محدش يتكلم في الشرع عشان هوا محسوم من لم تنهه صلاته عن الفحشاء والمنكر فلا صلاه له متهيالي ده يرد علي اي واحده فاكره نفسها ذكيه ومعلش بتحاول تصيع لا يا شاطره انتي هتصيعي علي الشرع ولا علي الناس ولا بتضحكي علي نفسك ولا علي مين ...ده من ناحيه الشرع ..من ناحيه الاهل انا مش عارف اوصف اي اب او اي اخ يسمح لمراته او بنته او اخته انها تمشي في الشارع وهيا مش محجبه لانها اكيد لافته للنظر وطبعا اي شاب من الشباب اللي مش لاقي يتجوز هيخدها من فوق لتحت تلات مرات وله عذره برده ..يبقي اللي يسمح لواحده من اهله انها تكون في موقف زي ده يبقي اسمه ايه ......... حاجه كمان انا مش عارف ليه انتي يللي مش محجبه ومسلمه اسما بس هتستفادي ايه لما تمشي في الشارع لفته الانتباه كده..ده ميمنعش برده المحجبات اسما اللي لبسهم خليع دول اصلا مش محجبات فمنتكلمش عليهم لانده تحايل علي الدين ..يا ريت محدش يدافع عن المعصيه لان دي حاجه تغيظ جدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

