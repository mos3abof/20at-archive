[[comments]]
order = 40
subject = "الكاتبتان هبة و يسر"
author = "عقلاني"
posted = "2006-07-17"
text = "أولا سؤالي عن كاتبتا المقال.انتو محجبتان؟يعني انتي يا هبة وانتي يا يسر محجبتان؟ لو محجبتان كنتو هتنكسفوا تكتبو الكلام دا.وبعتقد انكم مش محجبات ابدا وبتدوروا علي حاجة تدعم كلامكم عشان كدة جبتو نمازج غير محجبة وعاملة ملتزمة.<br />بتفكروني باللي بيشرب خمرة.بيتمني الناس كلها تشرب زية واللي بيشرب سجاير بيتضايق لما يلاقي حد مبيشربش.انتو عاملين زي كدة.<br />من جهة تانية.مش هقولكو يا جماعة الاسلام بيفرض الحجاب واتحجبوا.بس هقولكو حاجة تانية.<br />بتشوف سسترات في الشارع.السيستر هي النصرانية اللي بتخدم في الكنيسة.دي واحدة يا حرام متحجبة.وتتخيلو ان حجابها احسن من حجاب كتير من المسلمين.دي بتلبس جلبية طويلة.وكمان شوفو العجب مغطية شعرها بغطاء شرعي الاولي بالمسلمات انهم يلبسو زية.مين قالها تعمل كدة؟ اسامة ابن لادن !.لأ. لأنها وهبت نفسها للرب وعفيفة ومش عايزة حد يتمتع بعينه منها.طيب مش كفاية اللبس الواسع.لأن لازم الشعر كمان .ليه يا سيستر !.لأن الشعر من اكثر الحاجات اللي بتجزب النظر للمرأة.لأنه تاج الراس.طيب خلاص يا سيستر وصلت الرسالة.الحجاب فضيلة.<br />طيب يا يهود انتو كمان بتبينو شعركو؟؟؟<br />لأ طبعا.ازاي.زوجات الخاخامات اليهوديات بيقومو بحلاقة الشعر كليا ولبس باروكة.طبعا دا كلام فارغ عندنا لأن الواقعة هي هي ميجوزش نعمل كدة.بس عند اليهود حرام الشعر يبان.يلهوي اليهود عندهم شعر المرأة حرام يبان.اه.حرام.كمان المسيحيين بيغطو شعرهم.<br />طيب ناقص ايه ع المسلمين عشان يتحجبوا.<br />بتتفرجو علي روتانا سينيما وبتشوفو عبير صبري اللي مبتفوتش جلسة جنسية من جلسات هالة شو.شفتو عبير وحجابها.دي الاولي انها تنساق للنار علي طول.هتقولولي ليه.بقولكم لأنها مغطية شعرها لكن في لبسها الكاسي العاري وكمية الميك اب اللي مبهددلة بيه خلقتها بتقول لكل شاب \"بحلقلي وبصلي\" ورقبتها باينة وصدرها بارز.مش هقولكو.مزة مزة.بس مغطية شعرها بكل وقاحة.الاجدر ان تبين شعرها وتستر جسدها.<br />في النهاية عايز اقول....<br />الحجاب فريضة شرعية وليس حرية شخصية.<br />علي الدولة فرض الحجاب الرسمي.<br />ليه التعنت دا.فين الحرية.<br />اقول لكل بنت في كلية الحقوق بياخدو جملة اسمها\" ان حقك يقف عند بداية حقوق الاخرين\"<br />حقك في الحرية يقف عند بداية حقي.انا حقي ايه.اه انا ليا حق.حقي اني امشي في الشارع ملاقيش بنات عريانا اقعد افكر فيها لما اروح.مهو كلمة الحق بتتقال.هو الشباب مهما غض البصر ودا واجب ديني عليهم ميقدرش الا يبص.<br />مرة احد الأئمة تعلثم في قراءة القران فسألة الشيخ ماذا رأيت اليوم.قال رأيت عرقوب امرأة. يعني كعب رجليها.مش السمانات الملزلظة اللي بنشوفها دلوقتي.عرقوب امرأة كانت كفيلة بأنه ينسي القران ويفكر فيه. ربنا يستر علينا.<br />من الاخر.ممكن البنت تكون متحجبة ومتحررة.وممكن تكون متبرجة وملتزمة.بس علي الاثنين مهما كانو.علي المرأة مهما كانت ملتزمة او غير ذلك ان تتحجب لما فيه من فرض.<br />واقول لكل بنت خدي الشعر دا.يمكن يبينلك حاجة من اللي بيقولولك اعمليها باسم الحرية.<br />إنا سمعنا أختنا شيئا عجاب ** قالوا كلاما لا يسر عن الحجاب<br />قالوا خياما علقت فوق الرقاب ** قالوا ظلاما حالكا بين الثياب<br />قالوا التأخر والتخلف في النقاب ** قالوا الرشاقة والتطور في غياب<br />نادوا بتحرير الفتاة وألفو فيه الكتاب ** رسمو طريقا للتبرج لا يضيعه الشباب<br />يا أختنا هذا نداء الحاقدين من الذئاب ** يا أختنا أنت العفيفة والمصونة بالحجاب<br />يا أختنا هذا نباح لا يؤثر في السحاب ** يا أختنا صبرا تذوب ببحره كل الصعاب<br />فالجنة المؤى ويا حسن المئاب ** والنار مثوى الظالمين لهم عقاب**<br />والله يكشف ظلمهم يوم الحساب .**<br />ربنا يخسف بالارض المستشرقين.الذين يقولون للفتاه انتي حرة.علاقتك خاصة بينك وبين ربك. ومن الكلام الاهبل دا.<br />والان تعليق بسيط علي بعض اللي علق فوق.<br />الي عمر الاسيوطي<br />اخرس ايها الغبي.الحجاب مش مظاهر .الحجاب اساسي وليس فرعي.انا اكرة اللي بيجو يبهدول الموضوع الجد بكلام اهبل.<br />الي \"محجبة تحترم الاخرين\"<br />جملتك \"وبعدين ربنا هو اللي بيحاسب مش انتو\" دي بتفكرني بفيفي عبدو لما بيسألوها مش حرام الرقص.بتقول انا علاقتي بربي علاقة خاصة جدا .محدش يتدخل فيها.يعني طالما ربنا اللي بيحاسب مش احنا.متيجي كلنا نسرق .ونقتل.مهو ربنا اللي هيحاسبنا.مش البشر.لو في شلة شباب وبنات بيسهرو سهرة زرقا في الشقة اللي جنب شقتكو وصوتهم عالي مسخرة وضحك وخمرة.هتقولي ربنا هو اللي هيحاسبهم دي .<br />كلمة هبلة اوي بيتحرق دمي لما واحد في نص الكلام يقول كلام سخيف ذي كدة.بحس اننا بننهق في مالطا.<br />الي دينا<br />انت لست متحجبة لأن الدين يسر وليس عسر.يبقي متصليش.لأن الصلاه بتاخد من وقتك خمس مرات في اليوم.ويمكن تكوني مش فاضية بتتفرجي علي فيلم لايناس الدغيدي.هتقومي تصلي.لأ لأ.الدين يسر وليس عسر.<br />كمان في حاجة.ليه متتجوزيش عرفي.وبلاش جواز اصلا اتمتعي من غير جواز.مش خسارة عمرك الجميل دا وانتي في زهرة شبابك متتمتعيش بيه وانتي مستنية ابن الحلال.افرضي مجاش لحد سن 35.مش الاولي ان انت تتمتعي بالشئ اللي مش هيرجع تاني وهو الشباب.واكيد ربنا هيسامحك لأن الدين يسر وليس عسر..<br />في الاخر ٍاقول بيت شعر من احلي ما سمعت<br />* لحد الركبتين تتشمرين ***** بربك أي نـــهر تعبرين<br />* كأن الثوب ظل في صباح ***** يزيد تقلّص حيناً فحيناً<br />* تظنين الرجال بلا شعور ***** لأنك ربـــما لا تشعرين<br />سلام الي من تنتضر الهدي بالحجاب وسلامي الي كل محجبة تجاهد من اجل دينها وربها وتجعل دنياها المقام الثاني."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123401/http://www.20at.com/article2.php?sid=973"

