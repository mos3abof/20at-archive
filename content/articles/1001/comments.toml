[[comments]]
order = 6
subject = "إخواني لكم الله"
author = "dsh5"
posted = "2006-04-16"
text = "خلال مهرجان حاشد في طولكرم بمناسبة ذكرى المولد النبوي الشريف.. الوزير زيدان يحذر من حملات التحريض ضد الحكومة<br />طولكرم ـ المركز الفلسطيني للإعلام<br />حذَّر وزير الأشغال العامة عبد الرحمن زيدان من حملات التحريض التي تشنُّها أطراف خارجية وداخلية على الحكومة الفلسطينية، بهدف النيل من الروح المعنوية لشعبنا، ومحاولة إفشال الحكومة الجديدة وما تمثله من محاولات جادة للقضاء على الفساد والفوضى.<br />وقد جاء هذا في كلمة للوزير زيدان ألقاها في المهرجان الحاشد الذي نظمته حركة المقاومة الإسلامية \"حماس\" في طولكرم، في ذكرى المولد النبوي الشريف، وذكرى استشهاد الشيخين القائدين \"الياسين\" و\"الرنتيسي\"، بحضور كلٍّ من النائب الشيخ حامد البيتاوي والنائب رياض رداد وقادة الحركة في المحافظة والآلاف من أنصار الحركة الذين بايعوا الحكومة على السمع والطاعة والدعم بالأنفس والمال والولد.<br />وقال الوزير زيدان عن الحكومة: لقد استلمنا الحكومة في وضع بائس من اليوم الأول، ولم نكن نعلم حقائق الأمور وتفاصيلها إلا بعد دخول الحكومة وفتح ملفاتها، فوجدنا الخزينة فارغة، بل مديونة بما يزيد عن مليار وربع المليار دولار، والأخطر من المديونية، هي السياسة الاقتصادية للحكومة السابقة خلال العام الماضي التي ارتكبت بحق شعبنا ما يندى له الجبين، فرهنت شعبنا بالديون الداخلية والخارجية، وأغرقت الحكومة بديون كبيرة، فهي مدينة للبنوك المحلية بـ600 مليون دولار، وللسوق المحلية بـ650 مليون دولار. وهذه الديون تكلِّف الحكومة 40 مليون دولار شهريا كفوائد\".<br />وأوضح الوزير زيدان أن 10بالمائة من موظفي السلطة يستأثرون بـ 60بالمائة من ميزانية الرواتب، وأن 90 بالمائة من الموظفين يحصلون على 40 بالمائة فقط. وأن الرواتب زادت بقيمة 45 مليون دولار خلال 5-6 أشهر، مشيراً إلى أن الحكومة السابقة صرفت ضعف الموازنة خلال سبعة أشهر فقط، إضافة إلى أن هناك 19 ألف منتسب جديد للأجهزة الأمنية خلال فترة الانتخابات، لافتاً النظر إلى أن النائب العام صرَّح بوجود 37 ألف وظيفة وهمية،<br />وقال الوزير: \"إننا لا نريد أن نحبطكم بهذا الكلام، ولكن من حقكم أن تعرفوا ما وضع الحكومة السابقة؛ من هدر للمال العام والتسيُّب، وأن نصارح شعبنا، وأن نبدأ من نقطة ثابتة، وقد جلست الحكومة مع الرئيس وأطلعته على الأرقام والمعلومات المذهلة، توطئة لاطلاع شعبنا عليها\".<br />وحول الحصار وقطع المساعدات، قال الوزير زيدان: إن هناك مؤامرة من أمريكا و(إسرائيل) بالضغط على البنوك المحلية لمقاطعة الحكومة، ومنع المانحين من إيصال أموالهم للحكومة، وهذا معلن من قبلهم، ولكن الذي لا نستوعبه أن يكون مِن بيننا مَن يساهم في هذا الحصار وأحيانا بالتطوع، كما فعلت إحدى المؤسسات المحلية بإيقاف منحة بمئات الملايين من الدولارات كانت تخصص لبناء المدارس ودعم الوزارات\".<br />وأضاف: \"نسمع دعوات بلسان الناصح الأمين للحكومة بأن تتنحى، وخاصة بعد اقتحام سجن أريحا، ودعوات نعلم أهدافها بحل السلطة، وهذا الأمر يخلو من الإحساس بالمسؤولية ويسعى إلى تحطيم الروح المعنوية لشعبنا، ويحاول التخريب وإفشال الحكومة الجديدة وما تمثله من محاربة الفساد والتسيُّب\".<br />وحذَّر زيدان من التحريض الذي يتعرض له الموظفون، وخاصة مطالبة المعلمين بالإضراب، وقال: \"ليس لأننا ضد الإضراب، ولكن لنسأل المحرِّضين: أين كانوا عندما أضرب المعلِّمون قبل سنوات؟ فأفشل هؤلاء المحرِّضون أنفسهم إضرابهم، ووقفوا ضدهم وأهانوهم وفُصل وسُجن بعضهم\"، وأضاف: \"من مظاهر التحريض الهجوم على مجلس الوزراء في رام الله ومكتب وزيرة شؤون المرأة، وإغلاق دائرة السير في رام الله وجنين وطولكرم، وإطلاق النار عليها، لأن الوزير السابق أخذ قراراً بتوزيع أرقام عمومية للسيارات بشكل غير مُنصف، وعاد وأوقفه قبل إنهاء مهامه\".<br />وتابع قائلاً: \"لا ننسى التحريض الداخلي من خلال المقالات في الصحف والإذاعة والتلفزيون، وفي المجلس التشريعي بدعوتنا لأن نكون واقعيين!\"، وأضاف: كل التنازلات تمَّت تحت غطاء الواقعية، وكأن أمريكا ليس فوقها قوة، ونحن نفهم الواقع بأن أمريكا قوية، ولكن الله أقوى منها، والذي سيدوم هو ثباتنا وإصرارنا، وسننتصر وتتحرر أرضنا ومقدساتنا بإذن الله.<br />وحول المطالبة الاعتراف بـ (إسرائيل)، قال الوزير زيدان: \"لن تحصلوا منَّا على هذا الاعتراف، فنحن لسنا مغفلين، ونتساءل بماذا اعترفت (إسرائيل) من حقوقنا؟ وأين الضمانات التي أعطيت للرئيس عرفات في أريحا؟! على (إسرائيل) أن تعترف بحقوق شعبنا في أرضه ومقدساته وعودة لاجئيه وإطلاق سراح معتقليه وحقه بدولة مستقلة، ونترك بعدها شعبنا يقرر ويقول كلمته في هذا الموضوع\"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130323/http://www.20at.com/article2.php?sid=701"

