text = "اموضوع جميل جدافعلا الفن اليام دى هو الى خلى الجرايم تكتر خاصة الغتصاب لان ثلاث ارباع الفن اصبح بيهدف لكده الحلال بين والحرام بين بس المغريات بقت كتير جداوالبنات معدش عندها حياء طبعا مش الكل بس الاكتر بقه كده فى النظره والبصه والدلع احنا بقينا بنعانى منكترة المغريات وبقول لخباب ان الموضوع كويس جدا وربنا يوفقك لنصرة الاسلام"
