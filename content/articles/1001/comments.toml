author = "سمسم"
posted = "2006-05-28"
text = "الأخت المصرية/<br />ربنا يكثر من أمثالك ياأختي ويسترها معاكي دنيا وآخرة، وكل اللي عندهم دين وضمير وغيره زيك. لاكن أنا عاتب عليكي لأنك مفهمتيش قصدي بالمرة، حضرتك فهمتي عكس اللي قولته تماما، وليكي العذر.<br />الكلام ده أنا قلته بعد قراءة طويلة ومتمعنة للي حصل معانا عرب ومسلمين من نكبة فلسطين لنكبة العراق مرورا بهزيمة سبعة وستين. حماس كحركة مقاومة سلامية على راسى وراس اللي خلفوني، مافيش كلام، هو فيه حد متصدي للتفريط بالقدس وباقي الثوابت غيرهم؟ علشان كده بأقول لازم تكون درجة الوعي اللي عندهم موازية إن ماكنتش أكثر من الصهاينة، مش معنى كده إني بأقول إن محمد عباس البهائي عنده ولو أدنى درجة من الوعي، على العكس سعادته لا وعي ولا حكمة ولاسياسة ولاوطنية ولادين، بل منتهى الإخلاص في العمالة.<br />لما أسمع إنه محمود زفت ده وأبو قريع بيستوردوا أسمنت من مصر العربية، ويبعوه للصهيانة علشان يبنوا بيه الجدار العازل، وده كلام موثق يبقى أقول زي سعد زغلول\" مافيش فايدة ياصفية!\".<br />إسرائيل يا أختي من الدول المصدرة للأسمنت، وماركة \"النيشر\" يعني النسر ماركة معروفة وإسألي، يبقى همه محتاجين ليه الأسمنت المصري بالتحديد؟ تقدري تقوللي؟ هنا مربط الفرس.<br />ومناقشتنا ليها إن شاء بقية لما أسمع ردك، وفيها حأتكلم عن الحركات الإسلامية بالتفصيل، إخوان مسلمين وغيرهم وأبين إزاي أنهم أيضا يتحملوا مسئولية عن الأوضاع اللي إحنا عايشنها النهارده، واللي أدت لأن الخونة من حكامنا وفي كل بلد يعملوا فينا كل ما لذ لهم وطاب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130323/http://www.20at.com/article2.php?sid=701"

