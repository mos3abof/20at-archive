posted = "2006-04-18"
text = "شكرااااااا جداااا يا استاذ عبد الله<br />وانا قلت فى الاول اننا مؤدبين<br />بس كل الحكايه عايزين نفرح بعروستنا انا واخواتى وصحباتنا بس بينا وبين بعض<br />وانا كده اتطمنت وهنعمل البارتى(فى شقه فاضيه مفيقاش غيرنا) ان شاء الله<br />وجزاك الله خير الجزاك<br />اللهم ارنا الحق حقا وارزقنا اتباعه وارنا الباطل باطلا وارزقنا اجتنابه"
archived = "2006-11-02"
