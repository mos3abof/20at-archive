posted = "2006-04-15"
text = "الله معكم يا حماساوية - يشد من همتكم - ويسدد خطكم - ونحن بالقلب معكم - اما بالدعوة فانا التوجه بها الي الله لان يدعمكم ويفتح له خزائن سماواته - واما للبشر فقول لكل مسلم - ولكل انسان صاحب قلب - تبرع وادعم اخوانك في فلسطين - وانتصر لدينك من ذلة اليهود"
