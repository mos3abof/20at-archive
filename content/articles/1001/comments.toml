subject = "الى مسلمة"
author = "عبدالله مفتاح"
posted = "2006-04-16"
text = "انا عايز اضيف اضافه بس<br />معنى تاني لامن الفتنه من البنات من بعضهم<br />ان البنات متعدش ترقص وكل واحده تشوف التانيه<br />وبعد ما تخلص وصله الرقص وكل واحده تروح تحكي للي في بيتها عن مفاتن فلانه وهيه بترقص و كده يعني<br />يعني لازم البنات تكون واخده بالها ان ميصحش تمدح في مفاتن بنت امام اخوها مثلا.<br />دي فتنه تانيه انا مكنتش واخد بالي منها وقلت اذكرها من باب الامانه<br />يا ريت لو قريتي التعليق ده تقولي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130323/http://www.20at.com/article2.php?sid=701"

[[comments]]
