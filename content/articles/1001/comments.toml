order = 14
subject = "يا ريت اكون فهمت خطا"
author = "المصرية المهذبة"
posted = "2006-05-29"
text = "التعليق الاول باسم سمسم كان كويس اما التعليق الثانى باسم سمسم اتهمت فية الدكتور عطا الله بانة معاة ابتدائية وبتستغرب انة فجاة اصبح معاة دكتوراة اما الاتهام الثانى فهو انك قلت انهم اجهل من بتوع حماس معنى هذا الكلام ان بتوع حماس جهلاء وهذا مالم استطيع ان اتحملة فاقل شيىء نقدمة لاخوانا من حماس هو الدفاع عنهم ولو بالكلمة فهم امل الامة المنكوبة وهم خط الدفاع الاول عن العرب والا سلام وهم اكثر الجماعات التى قدمت تضحيات ولا يليق بنا كمسلمين ان نشهر بهم على الانتر نت فان كان هذا التعليق الثانى خاص بك فانا لم افهم خطا وان كان هناك من استعار هذا الاسم لتشوية صورتك فاعتذر ونسال الله ان يجعلنا من المرابطين فى سبيل اعلاء راية التوحيد وان يوحد صفوفنا كما توحد اليهود والنصارى لذلنا وحصارنا واكرر الا عتذار لكل اخوانى واخواتى ان كنت فهمت خطا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130323/http://www.20at.com/article2.php?sid=701"

[[comments]]
order = 15
subject = "أحي الأخت المصرية"
author = "أختي المصرية المهذبة/"
posted = "2006-05-31"
text = "خلاص حأبطل أكتب بإسم سمسم، ولصاحبنا أبو السماسم إياه ياراجل خلي عندك دين شوية، هو إنته تعرف الإستاذ أو الدكتور عطاءالله منين؟ كنت في فلسطين حضرتك؟ ولا سيادتك بتاع \"جرب وطني\"؟<br />وإفرض إن معاه إبتدائية وبعدين قام وكمل تعليمه، مفلوق ومقهور حضرتك ليه يا أفندم؟<br />أحي الأخت المصرية على نبل أخلاقها، وربنا يهديك!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130323/http://www.20at.com/article2.php?sid=701"

