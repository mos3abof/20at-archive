text = "بجد الشخصية دي لذيذة جدا ولما اتعرفت عليه عن قرب في زيارته لمؤتمر القاهرة الدولى في نقابة الصحفيين اكتشفت ليه الناس دي -طبعا الحمساويين- يستهالوا ينجحوا<br />ربنا يكون فى عونهم ويفك حصارهم ويرزقنا حكومة زى حكومتهم<br />واتمنى فعلا انهم يقدروا يحققوا رسالتهم على مستوياتهم المختلفة<br />سواء فى الحكومة او فى المقاومة وبناء فلسطين من النهر الى البحر وازالة الاحتلال الصهيونى الغاصب"
