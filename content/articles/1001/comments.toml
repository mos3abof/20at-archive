text = "والله جميل انه يكون فيه فن اسلامى<br />بس لازم اللى يقدموه يكونو فاهمين دينهم اصلا<br />معلش انا كان عندى سؤال ملح جدا وعايزه اسأله بس ياريت الاجابه تبقى دينيا صحيحه<br />هو ممكن فى الافراح الاسلاميه البنات يرقصو\" رقص بلدى \"يعنى على الدف ولا لأ معلش اصلى عندى فرح اختى<br />معلش السؤال خارج اموضوع<br />بس الحقيقه ده اول فرح عندنا من ساعة ما بطلنا نسمع اغانى ونحسب اننا التزمنا بعض الشئ<br />اللهم ارنا الحق حقا واوارزقنا تباعه وارنا الباطل باطلا وارزقنا اجتنابه"
