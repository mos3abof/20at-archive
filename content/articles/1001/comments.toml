[[comments]]
order = 11
subject = "آه يابلد العجايب!"
author = "سمسم"
posted = "2006-05-23"
text = "بجد دلوقتي؟ عطاه الله ده بقى دكتور دلوقتي ومدرس جامعة؟ اللي أعرفه إنه كان مدرس إبتدائي في مدينة إسمها رفح ع الحدود مع مصر، وإنه خريج معهد متوسط للمعلمين، يعني معندوش مؤهل جامعي ولا مايحزنون، تقدرم تقولولي هو عمل بقى ده كله إمتى وفين؟<br />الراجل ده أنا عجنه وخابزه، يعني ذكاؤه وسط لهو غبي ولهو ألمعي، وعلى مدى العلاقات الإجتماعية مالوش يعني علاقات على مستوى، بمعنى مهوش محبوب قوي، ومن النوع اللي بيدب كلامه دب ولايهمه، لاكن في الجامعة بتاعة غزة دي، كل شئ جايز أنه أعرف برضه واحد تاني راح السودان لمدة شهر واحد ورجع بدكتوراه وبقى مدرس هناك بشنه ورنه، أظن إسمه سهيل ولا حاجة زي كده.<br />والله العظيم مانه مع حد ضد حد، لاكن صعبان عليه وضع أهلنا اللي في الداخل، مساكين ياحمير المنظمة قدمهم ياما الدكتارة موديل عطاالله ده!<br />إيه ده؟ هي الخبرات الفلسطنية اللي في الخارج دي في أوروبه وأمريكا مش تكون أحسن. ياجماعه مع كل الإحترام قدمنا عدو متفوق علينا في كل المجالات، مش نحط في عينا حصوة ملح ونجيب حد على مستوى المسئولية بدل الهواة دول؟<br />المصيبة المحبكة إنه البديل بتاع المنظمة ألعن وأضل سبيلا، وأجهل من بتوع حماس وذمتهم خسرانة عالآخر. يعني بياع البليلة دحلان ده والعتال الرجوب إزاي يبقم ألوية وعقداء كده في الأمن، بعد دورة في الموساد! إسرائيل عايزة كده، واللي تقول عليه يمشي، يبقى فيها أمل ياصفية؟<br />إنتم فاهمين أنا عايز أقول إيه؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130323/http://www.20at.com/article2.php?sid=701"

