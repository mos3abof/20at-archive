[[comments]]
order = 0
subject = "رد من مجند سابق"
author = "لى فكرة التجنيد فى مصر اصبح بهذه الطريقة لأن عدونا قوانينه العسكرية تنص على التجنيد الالزامى بل وتجبر كل مجند انهى فترة تجنيده على ان يتواجد داخل وحدته لمدة 40 يوم كل سنة"
text = "حتى يكون على استعداد دائم ليوم محتوم لا يعلمه الا الله<br />وان كانت قوانين بعض الدول لا تجبر اثرياءها او امراءها على الخدمة العسكرية فهذا طبعا شئ جميل لماذا؟<br />لانهم تختخوا من كتر الأكل ومايستحملوش جهد الرجال<br />لان الجيش هو الحاجة الوحيدة اللى هاتفضل للرجالة وبس<br />وتانى سبب<br />من هؤلاء حتى يتشبهوا بسيدنا النبى عليه الصلاة والسلام الذى ورد عنه انه كان عسكريا محنكا ومخططا براعا<br />وكان يحارب فى الغزوات فى مقدمة قوات المسلمين<br />\"ولكم فى رسول الله اسوة حسنة\"<br />فهذا افضل لنا ولهم<br />فهم قد حازوا الدنيا ونحن نحوز الآخرة برحمة الله<br />مع خالص تحياتى<br />اخوكم خالد دربالة<br />مجند سابق<br />محامى حالى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145900/http://www.20at.com/article.php?sid=1484"

[[comments]]
order = 1
subject = "حلم يراودنى"
author = "ائما ما احلم بدخول الجيش المصرى واشترك فى معركه مثل حرب اكتوبر لقد كنت اتمنى دخول الكليه الحربيه ولكنها قصرت على ذوى الاموال والوسايط ."
text = "نعم والله احلم بحمل الار بى جى على كتفى وادمر به الدبابات الصهيونيه .<br />كم اكنت اتمنى ان اكون مشاركا فى معركه السويس ففيها حارب المصريون الشجعان الاعداء با سلحتهم الخفيفه ومنها سلاحى المحبب لى ار بى جى ضد الدبابات الاسرائيليه هذا هو الجيش وهذه هى الحياه التى اتمناها وسيأتى يوم نجاهد فى سبيل الله نحارب فيه اليهود ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145900/http://www.20at.com/article.php?sid=1484"

[[comments]]
order = 2
subject = "إللى الأخ : حلم يراودنى"
author = "قد كانت احلامى مثل أحلامك بالضبط كم كنت أتمنى أن أكون مع أبطال 73 وأكون واحد منهم"
text = "وكنت أنتظر ان أدخل الجيش بفارغ الصبر<br />حتى يتحقق حلمى ولو أكون مثل هؤلاء الأبطال<br />ولكنى عندما دخلت الجيش صدمت بالواقع ا لمرير<br />لقد أهينت كرامتى وشتمت بأقبح الألفاظ انا وزملائى<br />وشربنا الذل أشكالا وألوان<br />وأصبحت كل يوم أحصر ماتبقى لى من أيام حتى أنتهىى من هذا الكابوس الملعون<br />والله إنه لكابوس ولكنه كابوس فى الواقع وفى الحقيقه وليس فى المنام<br />لولا أنى أخاف أن أطيل عليكم لرويت لكم الكثير والكثير من قصص الذل ولأستعباد<br />فى هذا المعتقل المسمى (بالجيش)<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145900/http://www.20at.com/article.php?sid=1484"
