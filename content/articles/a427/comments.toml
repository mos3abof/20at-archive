[[comments]]
order = 0
subject = "واحد بيحب موقع عشرينات"
text = "بصراحة وبدون زعل انا موش بكتب دلوقتي علشان اعلق علي المقال ..<br />تقدروا تسموها تعليق علي الموقع كه...فين يا جماعة التعليقات والموضوعات السخنة ..<br />فين الكلام الخفيف اللي كنا بنشوفه أول ما الموقع طلع ....<br />فين جماهير عشرينات وروحها في التعليقات ...<br />وسؤال أخير ما هي قيمة الموضوع اللي انا بعلق تحته للشباب من وجهة نظر اللي كاتبه....<br />هقول كلمة ومحدش يزعل مني<br />فيه حاجة غلط!!!!"
archived = "2004-07-11"
capture_url = "https://web.archive.org/web/20040711054145/http://www.20at.com:80/article.php?sid=427"

[[comments]]
order = 1
subject = ""
text = "صديق عشرينات الزعلان<br />شكرا علي الإهتمام وعلي حبك للموقع وموضوعاته ..احنا بنحاول نجرب ونغير في الموضوعات وبنختبر ده معاكم أول بأول.<br />اما بالنسبة للموضوع وعلاقته بعشرينات واهتماماته..فهذه رسالة عن إعلام الشباب والشباب هو تخصص عشرينات والإعلام تخصص مواقع الإنترنت وفي الموضوع قراءة واضحة للمنتج الإعلامي العربي."
archived = "2004-07-11"
capture_url = "https://web.archive.org/web/20040711054145/http://www.20at.com:80/article.php?sid=427"
