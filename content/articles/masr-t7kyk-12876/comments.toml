[[comments]]
order = 1
subject = ""
author = "الامن المركزى"
posted = "2009-08-08"
text = "وهل التجنيد فى الامن المركزى يبقى مصنع للرجال ؟<br />يا جماعة فضوها سيرة<br />مصنع رجال اية ومصنع بهايم اية<br />فعلا اذا كانوا محتاجين يبقى بفلوسهم يطلبوا متطوعين"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809145959/http://www.20at.com:80/masr/t7kyk/12876-2009-08-08-10-41-53.html"

[[comments]]
order = 2
subject = ""
author = "مصنع الرجال ولكن"
posted = "2009-08-08"
text = "نحن ننعم بالسلام وبعلاقات اكثر من ممتازة مع اسرائيل<br />ولا توجد اى حروب سوف تحدث فى المستقبل المنظور يخوضها جيش مصر<br />اذن لماذا لا يكون الجيش جيش متطوعين زى تركيا والاردن والسعودية وتركيا<br />لية نتمسك بالتجنيد الاجبارى والشاب يتعلم عسكرية ويسيبها بعد سنين<br />لماذا لا يكون متطوع يخدم عشر سنوات ويتقاضى راتب وعلى الاقل نساهم فى تقليل مشكلة البطالة<br />اظن حكاية التجنيد الاجبارى محتاجة اعادة نظر فى الوضع الاقتصادى اللى البلد عيشاة"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809145959/http://www.20at.com:80/masr/t7kyk/12876-2009-08-08-10-41-53.html"

[[comments]]
order = 3
subject = ""
author = "gabello"
posted = "2009-08-08"
text = "الالتحاق بالجيش هو شرف لكل شاب، والجيش هو مصنع الرجال، منه يتعود الشاب على الحياة العسكرية لكي يكون صالحاً للدفاع عن وطنه يوم يحتاج إليه الوطن"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809145959/http://www.20at.com:80/masr/t7kyk/12876-2009-08-08-10-41-53.html"

[[comments]]
order = 4
subject = ""
author = "نسيت فى الاراق"
posted = "2009-08-08"
text = "مطلوب ايضا شهادة القيد العائلى وبدونها لن يقبلوك<br />وشهادة القيد العائلى مطلوب لها صور شهادات الميلاد لجميع الاخوة وصور البطاقة الرقمية للاب والام وصورة من قسيمة الزواج واستخراجها محتاج اسبوع ودفع رسوم"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809145959/http://www.20at.com:80/masr/t7kyk/12876-2009-08-08-10-41-53.html"

[[comments]]
order = 5
subject = ""
author = "مصنع الرجال ؟"
posted = "2009-08-09"
text = "هة بتقول اية<br />انت عارف سن نملة الدبانة<br />مصنع الرجال<br />دة كان زمان قوى ايام البطل الشاذلى<br />والبطل محمد على فهمى حامى السماء المصرية بحائط الصواريخ<br />انما دلوقتى<br />مفيش حاجة<br />الجيل الجديد عمرة فى حياتة ماشفش عرض عسكرى يقول لة هذا هو جيشنا<br />انتم عارفين لبنان<br />الجيش بتاعها كان عامل عرض عسكرى الاسبوع اللى فات وكان عرض رائع<br />انما الجيش بتاعنا فمحدش بيشوفة<br />كلهم مرعوبين من العروض بعد اغتيال السادات فى احد العروض"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809145959/http://www.20at.com:80/masr/t7kyk/12876-2009-08-08-10-41-53.html"

[[comments]]
order = 6
subject = ""
author = "جيـــــــــمـي"
posted = "2009-08-09"
text = "ده كان يوم ما يعلم بيه إلا ربنا<br />بس الحمد لله … أنا خدت إعفاء مؤقت علشان والدي ماجبش الستين لسة .. وخايفين يعملها ويجيبلي ولد .<br />بقعد أتخيل كدة … لو جه أخ ولد لية … أعمل ايه ؟؟؟<br />طبعاً والدي مش أقدر آجي جنبه … يبقي عليا و علي الأخ الصغير أتخلص منه .<br />طبعاً مش هعمل كدة بس هيبقي أحساس رخم<br />الى هو انت بدأت تأقلم حياتك ومستقبلك وعلاقاتك علي أساس أنك فرررري و مافيش جيش ولا يحزنون .. فلما تيجي مرة واحدة وتقولي أهلاً بيك في مصنع الرجال وانا عندي 23 سنة .. هقولك وعليكم السلام ورحمة الله وبركاته"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809145959/http://www.20at.com:80/masr/t7kyk/12876-2009-08-08-10-41-53.html"

[[comments]]
order = 7
subject = ""
author = "جندى مجند"
posted = "2009-08-12"
text = "حسبى الله ونعم الوكيل<br />بس الجيش سلبيات وايجابيات منه بتتعلم الحياه الصعبه القاسيه المره<br />وممكن تتعلم حاجات تانيه مش كويسه<br />بس العيب الصعب هو انه بيمحو شخصية الشاب<br />كله تمام يا فندم مفيش مناقشه<br />لا جدى لامناقشه يا اخى على"
archived = "2009-09-17"
capture_url = "https://web.archive.org/web/20090917142104/http://www.20at.com:80/masr/t7kyk/12876-2009-08-08-10-41-53.html"

