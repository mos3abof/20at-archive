[[comments]]
order = 4
subject = "العلم لا يكيل بالبدنجان"
text = "يعد السلام عليكم ...<br />بعد الحمد لله ..<br />لما قريت القصه الطريفة دي تذكرت الواد اينشتين وهو صغير مكنش بيعرف يتكلم بجد كان كثير الصمت لدرجه انهم افتكروه ابكم كان لسانه تقيل قي الكلام وكان بيكره اللغات والتاريخ والحاجات دي كره العمى لانها مكتش سكته، كان يحب الرياضيات جدا ، وبرع فيهاعشان التعليم بره مش بيفرض عليك مواد ملهاش علاقه ببعض، زي ما بيحصل حدانا، المهم عشان ما نتكلمش في السياحه ، كبر اينشتين وبقي العالم المشهور والعبقري المحبوب ، من المواقف الطريفه لاينشتين انه كان مره في مكان كدا وكان موجود في المكان دا الكوميدي المشهور تشارلي تشابلين عارفينه طبعا تشابلين المهم اتجمعت الناس حوليهم وبتاع توقيعات وكدا، تبسم اينشتين وقال اتعجب من حب الناس لعبقري مثلك تشابلين فهم يفهموتك ويفهوم فنك ، واتعجب اكثر من حبهم لشخص غريب مثلي لا يفهمون منه شئ ... حاجه كدا ع السريع من اخوكم عبده نصحي"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035013/http://www.20at.com:80/article.php?sid=620"

