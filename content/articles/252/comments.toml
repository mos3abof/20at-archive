[[comments]]
order = 2
subject = "غزالي"
text = "هاي يا جماعه.........انا اخوكم في الله الشهير بغزالي<br />انا هحكيلكم قصه عالم الفيزياء الصغير عشان تحكوها لاولادكم ليله امتحن الفيزياء في ثاله تانوي<br />في سالف العصر والنسوان اقصد (الاوان) كان في واحد اسمه الشاطر غزالي ....الشاطر غزالى ما كنش بيحب ماده الفيزياء خالص وغير كده مدرسه بيكره في الماده وكان بيعقدو فيها لغايه مارباله أبو جنب اسمه الفيزياء...الايام مرت والشهور مرت وصاحبنا غزالي نايم في العسل لحد ما بقاش على امتحان الفيزياء غير اربع ايام المعلم غزالي بدل ما يقعد على الفيزياء يدحها قعد على ماده التربيه الوطنيه يدحها ودخل امتحان الفيزياء مش عارف يكتب كلمه ومش عارف ان كان ده امتحان فيزياء ولا ضحكوا عليه ودولوا بيولوجي ...المهم غزالي ما سكتش وقام في وسط المتحان وخد اقلامه ومشي بيلعن اليوم الي دخل فيه علمي ....غزالي شال فيزياء دور ثاني....غزالي قال كلام وحطه هدف قدامه انا لازم انجح المره دي وفعلا عملها غزالي ونجح من غير ما يحفظ قانون فيزياء .....عارفين نجح ازاي....غزالي صحي بدري قبل الامتحان برشم المنهج في جيوبه اشي رسومات واشي قوانين واشي تعريفات واشي حاجات في الفيزياء ما يسمعش عنها ولا هيسمع عنها ابدا .....غزالي دخل اللجنه وقاعد في مكانه وطلع البراشيم وزبط نفسه صح<br />...وبكده توتا توته خلصت الحلوفه اقصد(الحدوته) ....يعني يا جماعه لو حد شال ماده يعمل زي وما يخفش ....ومين بقى احسن انا ولا الراجل بتاع الترمومتر ولا الترموستات ....هو كان اسمه ايه؟؟"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035013/http://www.20at.com:80/article.php?sid=620"

