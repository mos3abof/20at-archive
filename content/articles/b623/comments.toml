subject = "عقبالنا"
author = "ابو اليمان"
posted = "2006-03-27"
text = "خطوة ممتازة لكن الناس اكيد رح تلتزم واما في الول العربية اعتقد ان القانون موجود بمنع التدخين في الاماكن العامة على الاقل عندنا في الاردن كما اعلم لكن من يستجيب له؟؟؟<br />وبعدين الناس اللي يتدخن ليش بتدخن ؟؟اكيد من قهرها من اللي بيحطوا القانون وما بيطبقوه/ الدكتور بيقولك مرضك من الدخان لازم تتركه طبعا يقول هذا وهو يشعل سيجارة//مجالس النواب اللي بتصدر قانون بمنع الدخان يوافق اغلبية النواب على القانون برفع اليد اليسرى وفي اليداليمنى سيجار ا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142559/http://www.20at.com/article2.php?sid=623"

