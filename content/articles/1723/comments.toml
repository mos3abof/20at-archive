[[comments]]
order = 1
subject = "راي بقي"
author = "هووووووووبه"
posted = "2006-06-16"
text = "شوفي يا حاجه الكليه اللي بتدرس فيها اختي غير اللي بدرس فيها انا ,الكليه تقريبا الوحيده اللي في الولايه اللي بتدرس صيدله لانه نادر انك تلاقي امريكاني بيدرس صيدله, بالنسبه لحكايه اللي خاد جايزه نوبل طب ما اختي اللي بيدرسلها اقتصاد ابن عم الدكتور زويل ومع كدا كليتها مش من الاوائل ليه بقي ,وعلي فكره كليتها اللي اتخرج منها الكابتن اللي عامل الياهو كل ما تمشي في حته ختلاقي ياهو ياهو يا هو خش علي الياهو.<br />\"يار التقييم جاء أكثر سذاجه حيث أعتمد علي مواقع الانترنت وهي نافذة واحدة فقط\"<br />اما بالنسبه للتقيم في اخر كل سميستر بيطلب من كل طالب في جواب يقول ايه ممييزات الكليه وايه مساوها وليه وحشه وايه الحلوه وانت ازاي عرفت الكليه عن طريق صاحب نت اعلان<br />ونفسك في ايه الترم الجاي في الكليه يعني مظبتين ك علي الاخر تقوم بقي سيادتك تقول ان التعليم او الاختيار عنصري ازاي بقي ,<br />وفي نادي كمان لكل فرقه لو انت صيني وعايز تعمل تجمع لصينين ماشي او باكستاني ماشي روسي ماشي قبطي ماشي يهودي ماشي كله ماشي مفيش عنصريه جامده في حكايه التفريقه الجنسيه كله شخبطاطه , اما بالنسبه للمقوله الكليات غير هادفه للربح ازاي يعني انا طالع عيني في مصاريف الكليه وتقولي غير هادفه للربح ؟؟؟ والكليات الامريكيه كميله خالص انا مش بقول كدا انحياز لا ابدا والله بس واقع شفته ومقال الحاجه دينا عن الكليه تخليني اقول ان الكليات الامريكيه افضلها.<br />ح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152231/http://www.20at.com/article2.php?sid=944"

