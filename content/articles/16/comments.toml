order = 0
subject = "ميساء - اليمن- 24 سنة- تحتاج لقوة اعصاب"
text = "أعمل كجاسوسة!!، لن أوافق بالطبع، و لو حتى لحساب بلدي، لأنها مهنة تتطلب مقومات شخصية معينة، غير متوافر في، فأنا لا أحب العيش في قلق و خوف، كما أنها تتطلب قوة أعصاب غير متوافرة لي .<br />كما أن العمل كجاسوس ضد بلدك، وظيفة الأنذال، أما لو طلبت منى بلدي العمل كجاسوس لها، فبداية أنا ارفض العمل بشكل رسمي، أي لا أكون مثل رأفت الهجان الذي ترك بلده وحاله، و عمل كجاسوس لحساب بلده في مكان آخر، بينما لو وقعت بين يدي معلومات تفيد بلادي، فلن ابخل بها و سوف أقدمها لبلدي، خاصة في حالة الحرب . .<br />و أيضا يمكنني تقديم هذه المعلومات لبلد آخر يتفق مع أيديولوجيتى، ولكن في حالة عدم الإضرار ببلادي، يعني بالعربي الانتماء الوطني أولا"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417072451/http://www.20at.com:80/article.php?sid=77"

[[comments]]
order = 1
subject = "هاني- مصري- بريطانيا-25 سنة (انهار عصر الأيدلوجيات"
text = "إن التجنيد في هذه الأعمال دائما ما يتم بطريقة غير مباشرة تماما، فمن خلال القصص المعروفة عن التجنيد غالبا ما تتم عبر وظيفة ذات طابع معلوماتي في الأصل كمراسل وكالة أنباء أو باحث إحصائي، ثم يتم مواجهة الشخص بالحقيقة بعدما يكون امضي وقت طويل<br />و يتم تهديده بكشف أمره أن لم يستمر و هكذا .<br />لكن بشكل عام الكل غالبا يرفض لو عرضت الفكرة بطريقة مباشرة و صريحة<br />أما أنا فلن اعمل كجاسوس، مهما كانت المزايا، فلهذه الوظيفة عواقب وخيمة .<br />العمل تحت مظلة الانتماء الأيدلوجى، لم يعد موجودا، فنحن في عصر انهيار الأيدلوجيات التقليدية .<br />ففي الماضي كان يقال أن عدد من الشيوعيين يأخذ رواتب من مخابرات الاتحاد السوفيتي<br />نظير دور مخابراتي يقوم به في المجتمع و هناك الكثيرون الذين اتهموا في هذا الموضوع لكن الآن هذا الإيمان بأيدلوجية خارجية لا أظنه موجودا ."
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417072451/http://www.20at.com:80/article.php?sid=77"

[[comments]]
order = 2
subject = "نبيل – السعودية – 44 سنة (الجاسوس شخص غير سوي)"
text = "أعتبر أن من يوافق على العمل كجاسوس، ما هو إلا خائن، سواء إذا كان يتجسس على بلده أو على أي بلد آخر لحساب البلد الذي يعمل لديه، فكله خيانة مقابل أجر، و لكن بالطبع نفوس الناس تختلف و كذلك ظروفهم، و هناك أناس اشتغلوا قبل كده في هذه الوظيفة.. وكانت نهايتهم الإعدام.<br />و العمل في هذه الوظيفة بدعوى رفض سياسة البلد، فهو قول مرفوض، \"اللي رافض لسياسة بلده يصلحها مش يتجسس عليها.. ويحاول بشتى الطرق\" .. لكن بأي حال من الأحوال فهي في رأيي خيانة .. يعني لو يسرق أفضل من هذا العمل .. وكل واحد ينظر لهذا الموضوع من خلال ذاكرته .. وأفكاره ..<br />و لكننى بالطبع أرضي كمسلم أن اعمل لحساب وطني في التجسس على دولة معادية، مثل إسرائيل، فهذا من وجهة نظري جهاد .. لأن ده عدو المسلمين .. والإسلام .. ومحاربته واجبة،وبالمثل أية دولة أخرى معادية للإسلام .<br />بينما لو كان العمل –حتى ولو لحساب بلدي- ضد بلد إسلامي آخر، مثل التجسس على العراق أو الكويت أو السعودية .. طبعاً هارفض .<br />كما أنني اعتبر الشاب الذي يقبل بمثل هذه الوظائف .. أي تربيته غير سويةـ، وبالتأكيد عائلته مفككة، وليس لديه أي وعي عن مثل هذه المواضيع .. يعني من السهل أن \"ينضحك عليه ويتورط في مثل هذا العمل\" ."
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417072451/http://www.20at.com:80/article.php?sid=77"

[[comments]]
order = 3
subject = "أحمد – مصر- 26 سنة (بلدي بنت ستين في سبعين)"
text = "أنا لا اقبل العمل كجاسوس، سواء لبلدي أو غيرها، أولا لأن الجهاز الاستخباراتى التابع لدولة أخرى، من المؤكد سيكون معادى لبلدي، و حتى لو أدُعو أنهم معادين للغرب، فلا يستطيع الفرد أن يتأكد من ذلك، وقد تكون معادية للغرب، لكنها مخترقة من قبل أجهزة غربية .<br />أما رفضي للعمل لحساب بلدي، فهذا لأنني أصلا ارفض سياسة بلدي فهي \"بنت ستين في سبعين\"، كما أنه بالنسبة لفرد يحتكم على قدر من الوعي، لا يمكنه أن يسلم نفسه إلى أي جهة استخباراتية ما لك يكن ذلك هو عمله الاحترافي، وكان يعي تماما مدى توجه الجهة التي يعمل لحسابها ومحددات عمله .<br />و حتى لو في حالة حرب، هارفض العمل تماما لصالح بلدي، إلا في حالة الحرب ضد إسرائيل أو ضد دولة غربية معادية، أما في حالة حرب ضد دولة عربية أو إسلامية، فلا يمكن أبدا التعاون فيه لأني ببساطة لا أثق في نظام وحكومة بلدي بالقدر اللي يخليني اعمل حاجة زي دي و أنا مغمض العينين ."
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417072451/http://www.20at.com:80/article.php?sid=77"

