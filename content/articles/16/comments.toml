[[comments]]
order = 16
subject = "جاسوسه على غرار نادية الجندي"
author = "عبدالله مفتاح"
posted = "2006-07-19"
text = "لاننا شعب بنتميز باننا غلابه بنتفرج على افلام ناديه الجندي وهي رخيصه وقال ايه؟ بتتجسس على اسرائيل لصالح مصر ونبقا شايفنها بتقدم نفسها للمتعه الحرام ونسقف لها ...دي مصر يا جماعه دي مصر<br />والمخرج بقا يحسسنا انها امراه فاضله والكارثه اننا بنقتنع انها فاضله بجد<br />ودي المصيبه اول ميشغلوا السلام الوطني على شرف الجاسوسه المصريه نلاقي قلوبنات عماله تدق عشان العمل العظيم اللي عملته الجاسوسه ناديه الجندي<br />ومشهد رجلها اللي ببتلوي وتقول للراجل ادعكهالي عشان تخف يقولها هنا تقولو لا فوق شويه ...هون؟ لا فوق شويه...هون ؟ لا فوق شويه<br />والواحد مننا يا عيني يبقى قاعد يقول يا رب ياخدها الاوضه عشان تعرف تتجسس حلو<br />مش بقلكم احنا شعب غلابه<br />الرذيله بتبرر ونقول لصاحبة الرذيله برافو عليكي وقعتي الاسرائيلي برافو عليكي<br />بلا خيبه الواحد هيقول ايه ولا ايه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125210/http://www.20at.com/article2.php?sid=1091"

