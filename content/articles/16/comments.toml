subject = "60 مليون جاسوس على الويتينج"
author = "الطريق السهل للهاوية"
posted = "2006-08-27"
text = "انا فى راى الواحد ممكن يشتغل جاسوس لما يمون في بطاله + انى الدولة مبتهتمش فى رعايته الصحية + الضرائب + التجنيد الاجبارى طبعا للافئات المسكينة بس والباقى بيخرجو طبي عشان بابا عنده واسطه+ قلة المستوى الاجتماعي لما يشوف شباب من سنه راكبين احسن عربيات وهوا مش لاقى يركب اتوبيس + لما يشوف الزل والمهانه فى اى جهة حكومية عشان معندوش واسطه ولا فلوس + الروح الى بتتقتل الف مره فى اليوم لما تحس انها مش عارفه تعمل حاجه فى حياتها + لما يشوف انه معاها ماجستير وبكالريوس ومش لاقى ياكل ولا عارف يلاقى شغل يليق بيه اعتقد انه بجد هيبقى جاسوس فى اقررب وقت لانه حاسس انى بلده معملتلوش حاجه غير انها تاخد منه وبس لكن لو نتخيل العكس اعتقد انه عمره ميبعها ابدا وكفايا شعارات"
archived = "2006-11-02"
