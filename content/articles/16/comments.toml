subject = "اى نوع من التجسس؟؟؟!!!!!!!!!!!!!!!!!!!!"
text = "اى نوع من التجسس سيدتى فى ظل عالم مفتوح وتكنولوجيا معلومات يوميا فى تطور وشركات ومؤسسات<br />معتدية (متعدية)على الجنسيات واساليب للحصول على المعلومة يتضائل معها العامل البشرى.<br />ارى انه لا مكان فى المستقبل للجاسوس الفرد وان البديل الواضح حاليا هو مؤسسات متكاملة للتجسس تحت مسميات براقة وببراءة كاملة من المستخدمين.<br />بمعنى آخر هل العاملين ببعض الجمعيات الأهلية وبمؤسسات البحث العلمى وبأقسام تنمية الموارد البشرية بشركات معولمة وما إلى ذلك ........جواسيس؟؟؟؟ اتسائل؟؟؟؟<br />يتبقى نوع من التجسس الفردى سيظل دائما الا وهو التجسس من فئةالخمس نجوم.......وهم القريبين جدا من دوائر صنع القرار بدول العالم الثالث واحيانا من يملكون سلطة اتخاذ القرار ونحن فى عالمنا العربى لسنا بعيدين عن ذلك للأسف!!!!!!!<br />فأذا كان العرض ياسيدتى من تلك الفئة........<br />فأنا موافق بشدة.....وليس بعيدا ان يصبح لى نصب<br />تذكارى فى ميدان عام"
archived = "2004-09-25"
capture_url = "https://web.archive.org/web/20040925144756/http://www.20at.com:80/article.php?sid=77"

