text = "أشكركم على هذه المعلومات المفيدة وعشان أنا مش فاضى من الفضا عاوز عنوان ارسال السى فى لأنى معنديش معلومات كافية يعنى مبارك مقدم السى فى بتاعتة والملك عبدالله مقدمنها من زمان وأحنا فى عصر الحرية والديمقراطية والمساواة والريادة الجديدة والفكر الجديد من هذا المنطلق ارجو من سيادتكم توضيح الجهة الواجب التقدم إليها<br />شكرررررررررررررررررررا على هذا الخبر"
