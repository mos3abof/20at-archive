[[comments]]
order = 5
subject = "ثقيلة كتير"
text = "بنسمع مطلوب موظف بشركة بمصنع هدا اعلان مش غريب<br />بس يجي اعلان كجاسوس تقيلة شوي ما هيك؟؟<br />يعني صح شعبنا عايم على بعضو نصو جواسيس بس ما بيمنع انو اغلبو ناس عندهن شرف وكرامة ومهما كان في بطالة بسوق العمل يعني من وجهة نظري يلي عندو شرف وكرامة ممكن يموت من الجوع ولا يشتغل جاسوس لو حتى لصالح بلدو ارض الرباط هاي صح وفيها المنيح وفيها الاعطل من العاطل بس لو حتى كل الصندوق كان فاسد وجه الصندوق على القليلة يكون منيح<br />ما بعرف كان قصدك العموم بالوظيفة هاي او قصدت شعب بذاتو لكن بغض النظر يلي بدو يتقدم لهالوظيفة بالبداية بدو يعمل شوي اشيا<br />مثلا: يغير دمو وجلدو (بالمعنى المجرد)<br />يتخلى عن اهلو وبلدو وبالتالي مش معقول يضل على دينو<br />اذن هاي المعادلة نتيجتها انسان فاشل وسرطان موجود بالمجتمع فيجب استئصاله قبل ان ياذي كافة انحاء الجسد"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417072451/http://www.20at.com:80/article.php?sid=77"

[[comments]]
order = 6
subject = "الموت أهون"
text = "أخي أهون على الشريف منا أن ينام عاريا في الشوارع على أن يخون بلادة ,, أهون على الشريف منا أن يموت جوعا على أن يدنس أحشائة بطعام ثمن الخيانة ,, هذا هوا الشريف يا أخي أما ضعفاء النفس فلهم الموت و هذا مصيرهم فليتمتعو بيوم او يومين او سنة لكنهم سوف يكسوهم العار طول العمر لا دنيا ولا أخرة لهم هذا غير الجزاء المنتظر لهم ,, الموت أهون يا اخي ......."
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417072451/http://www.20at.com:80/article.php?sid=77"

