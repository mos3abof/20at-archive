text = "لسه النهارده بس - علي سيرة الكلام - تم الحكم علي شاب مصري ذهب بنفسه إلي السفارة الإسرائيلية بالقاهرة وعرض عليهم خدماته للتجسس علي مصر..الشاب وليد أحمد لطفي هاشم 29 سنة يعمل كمحام لم يتقدم للوظيفة بدون تقديم السي في بتاعه فعرض امداد السفارة بمعلومات عن مصر كما ارسل اليهم بطريق الفاكس معلومات عن وحدته العسكرية التى ادى بها الخدمة العسكرية عام 1998\".. الأصيل بن الأصل أدين بأقصي عقوبة وحكم علية بالسجن 15 سنة.عقبال الباقيين"
