text = "هل البطالة سبب للجاسوسية ؟بالطبع لا .يودى الفراغ الشديد الذى يعانى منة الشباب بعد التخرج الى جعلهم فريسة سهلة الصيد من اللاخرين ، وما ادراك ما الاخرين هل هم المنحرفين المتشددين ، المتطرفين ام الاعداء. الذى يفصل فى هذا الامر هو البيئة التى نشاء فيها الفرد حيث انها هى التى تشكل شخصية هذا الفرد اما تجعلة يتخطى هذة الازمة او تجعلة ينجرف مع التيار ايا كان نوع هذا التيار . فشخصية الفرد لا تتأثر بالفقر او البطالة0"
