author = "الموساد قرر أنه يشغل جاسوس صعيدى عنده بعد طول بحث أستقروا على هريدى"
posted = "2006-07-20"
text = "راحوا لهريدى و أخدوه تل أبيب و قعدوا يدربوه 6 شهور و بعدها قالو ليه أنه<br />كدة جاهز للمهمة بتاعته<br />هريدى : يعنى حارجع مصر<br />مدرب الموساد : أيوة .. تروح و تنفذ كل التعليمات اللى قلنالك عليها<br />هريدى : طب ازاى حاتصل بيكم<br />مدرب الموساد : لا لا .. انت ماتتصلش .. احنا لما نحب نتصل بيك حانبعتلك مندوب<br />يقوللك ازايك و ازاى امك .. تعرف أنه تبعنا .. ماشى يا هريدى<br />هريدى : تحت أمرك يا فندم<br />و بالفعل رجع هريدى مصر .. و بعد شهرين أحس الموساد انه لازم يتصل بهريدى ..<br />فراحوا باعتينله مندوب<br />المندوب لبواب العمارة بتاعت هريدى : هو هريدى ساكن فى أنهى شقة<br />البواب : أنهى هريدى يا بيه .. العمارة فيها 4 هريدى<br />المندوب خاف لحسن العملية تنكشف : قولى شقة أى واحد فيهم<br />البواب : عندك واحد ساكن فى الدور الأول<br />طلع المندوب و خبط على الشقة اللى فى الدور الأول<br />المندوب : أنت هريدى .. ازايك و ازاى أمك<br />هريدى : أنت عايز هريدى الجاسوس .. هو ساكن فى الدور الرابع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125210/http://www.20at.com/article2.php?sid=1091"

