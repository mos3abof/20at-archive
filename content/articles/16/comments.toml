text = "الاخت شيرين لم افهم هل مقالك يدعو للجاسوسية ام انه يسخر منها........؟ وعلى حد علمى ان الجاسوس عزام عزام افرج عنه وليس لحسن السير والسلوك كما قالو ولاكنبلضغط او بالسكر شئ من هذا القبيل وبالنسبة لوظيفة جاسوس فانها لو عرضت فى مصر فاعتقد ان الكوسة ستتدخل فيها فلن يكون فيها مكان لاحد بعد ما يستولى على مقاعدها كل ابن باشا او كل من يعمل ابوه بواب عند احد الوزراء"
archived = "2006-11-02"
