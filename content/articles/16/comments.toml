subject = "محمد مصر 26سنة اية الفلسفة دى كلها"
text = "انا على اتم الاستعداد للعمل بهذة المهنة فانا احب الاثارة والمغامرة جدا اما عن من يقولون بلادناو الخيانة ومشعارف اية والكلام الجامد دة بقلهم اتغطوا ونتو بتتكلموا بلاش التهور دة البلد دى عملت لكم ايه انتو بين عليكم مخدرين<br />او منتوش عيشين فى الزمن دة<br />عموما انا مستعد لهذة الوظيفة"
archived = "2004-04-17"
