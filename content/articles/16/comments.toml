author = "احمد المصرى"
posted = "2006-10-15"
text = "انا شاب عمرى 20 وارى انه من الممكن العمل مع اى دولة مقابل المال حيث من الممكن نثلا العمل لصالح بريطانيا ضد روسيا فانى ارى انا لايو جد بها مخاطرة غير انها تحقق زايا خيالية لصاحبها كما ان الحماية من قبل الدملة لصديقها توفر نوع من الثقة بصراحة هى اامن من ان الشخص يعمل بمهنة شاقة كالدابة يخسر صحته مقال قروش"
