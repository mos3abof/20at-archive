author = "محمد أمين محمد الأعسر"
posted = "2006-10-11"
text = "أشتغل جاسوس اه ليه لاء طالما فى مصلحه بلدى مصر اللى شالتنى و خلتنى أبقه راجل و اللى قصه كفاح زعمائها الوطنيه عظيمه و مشرفه للعالم كله دى مصر يا جدعان أم الدنيا لو مهما عملنا معاها مش هنخلص جمايلها علينا بموووووووووووووووت فيكى و فى أرضك و فى شعبك يا مصر يا اللى سقتينامن نيلك"
