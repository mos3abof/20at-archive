subject = "الله اكبر علي كل من طغي وتجبر"
author = "تقي الدين"
posted = "2006-07-21"
text = "الله اكبر الله اكبر الله اكبر النصر قادم لا محاله لهذه الامه يا اخواني في كل الامه فلا نحزن ولا نغتم فأن وعد الله حق وقد وعدنا بالنصر ويومها سيفرح المؤمنون والمؤمنون فقط بنصر الله و يومهالا مكان للمأمرين واصحاب الامجاد الزائفه و الذين يخادعون شعوبهم.............اللهم انصر المقاومة اللهم انصر رجال المقاومة اللهم ايدهم بنصرك وايدهم بجند من جندك امين امين امين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125210/http://www.20at.com/article2.php?sid=1091"

[[comments]]
order = 25
subject = "تحب تشتغل جاسوس"
author = "ابن مدينة الناصره"
posted = "2006-07-21"
text = "على فكره اذا حابب تشتغل جاسوس لازم تكون فيك هذه الؤهلات وصبفات<br />عديم الضمير قذر وعديم الشرف وعديم الدين ولا تصون شرفك وعرضك ولا تحب ارضك ووطنك وتكون عباره عن حاوية زباله وان تتقن تقبيل اقدام الامريكان والانكليز وان تعلم ان نهايتك ستكون على يد المجاهدين في فلسطين ولبنان والعراق وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125210/http://www.20at.com/article2.php?sid=1091"

