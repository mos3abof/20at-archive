text = "شئ غريب اوي اننا نكتب فى موضوع زي ده ولا هو ملي صفح وخلاص من رائيي ان احنا كده بنتهم نفسينا انتي بتقولي ارهاب وجاسوس معنى كده ان احنا هنتجسس على نفسنا ومعنى الكلام كله ان احنا الارهاب هههههههههههه عاوزه تهزري انتي"
