text = "والله العظيم انا عندى مؤهلات ممتازه للعمل جاسوس ولو لصالح الشيطان مش اسرائيل بس منين السكه مش عارف<br />انا مصرى طبعا للاسف الشديد وعندى 37 سنه ومتزوج وعاطل من 4 سنوات<br />سبب العطل ان ماعنديش كوسه (واسطه) فى بلد زى مصر اللى واسطته ربنا يموت احسن وانا لاعارف اموت ولاعارف اشتغل<br />لذلك اقر واعترف وانا فى كامل قواى العقليه اننى على استعداد كامل لقبول وظيفه جاسوس بكل فخر وارى نفسى مؤهلا لذلك تماما وارجوا المساعده لمن يستطيع وكفايه بقى شعارات ووطنيه وكلام فاضى من ده لايأكل ولا يشرب<br />شالوم مؤقت"
archived = "2006-11-02"
