[[comments]]
order = 34
subject = "ابن ماريكا"
author = "يا معلاقين على المراجيح والحبل مستورد فاخر ليلتنا فاتت زى الريح ماهو كل حاجة وليها اخر."
posted = "2006-09-06"
text = "بس الحقيقة المذهلة انى الجميع فى السلسلة فوق الرقاب يا معلمين احبال اطيفة مدلدلة.<br />اصلى الخواجة ابن مريكا لما بيدخل حواريكا ياإما يا خدك فى بطاطه ياإما يا بنى هياءذيكا.<br />حاكم الخواجة ابن ماريكا هو اللى بدع الشيكا بيكا تدخل افاه عايز تلعب هيرقصك سامبا وسيكا.<br />افتح عيونك فنجل لكل من جيه يتحنجل.<br />اصلى الجراد اشكال والوان حاطط على الاخضر بيحش له الف ماركة والف دراع وكل يوم بيبدل وش .<br />يابن العرب يالا ياويكااعرف بقى مين اعاديكا.<br />دة انت إذا كفوفك ضمت ماحديقدر يساويكا<br />افتح عيونك فنجل لكل من جيه يتحنجل اصلى الجراد اشكال والوان حاطط على الاخضر بيحش له الف ماركة والف دراع وكل يوم بيبدل وش.<br />الكلمات دى غناها المطرب محمد منير وبعد الاغنية الاجابة بتاعتى واضحة جدا إذا كنت اشتغل جاسوسة ولا لا.وطبعا انتوا عارفين مين هما الجراد ومين هما اللى بيجوا متحنجلين ومتمسكنين وعاملين نفسهم غلابة وطبعا احنا عارفين مين هما اللى على المراجيح (الحكام العرب) .والحدق يفهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125210/http://www.20at.com/article2.php?sid=1091"

