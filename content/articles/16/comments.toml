[[comments]]
order = 40
subject = "طب ما الجواسيس ماليين البلد"
author = "المصرى افندى"
posted = "2006-10-26"
text = "شوف اعداد الطلاب اللى امن الدولة والمخابرات العامة بتجندهم عشان يكتبوا تقارير عن اوضاع البلد وتلاقى كل عميل صغير من دول بيعتبر نفسه بقى رأفت الهجان بعد ما يعملوا له غسيل مخ على حاجات عبيطة، بلاش لو تحب تشتغل جاسوس بجد وتخضع لإختبارات بجد وتاخد فلوس وتتدرب وتكتب فى بلدك تقارير كأنك صحفى سجل فى موقع السى آى ايه او لاين وحتلاقيهم بيتصلو بيك وحيعرفوا يبعتوا لك واحد يجندك بجد ويشوفك جاسوس محترم ولا بتلعب، وغالبا لو لقاك بتلعب حيبلغ عليك المخابرات لأنها تبعهم اساسا وآهى فرصة لأى ظابط مخابرات يعمل بيك شغلزيها زى قضايا المخدرات، اما لو عاوز تتجند تبع الموساد فروح على البال توك يا تدور فى غرف اليهود يا فى غرف الشواذ عشان تتشقط بجد وتبدأ تبقى جاسوس ( للدولة العبرية) بجد وفى الآخر برضه يدوك بمبة. المهم السؤال بيفضل داير ...ياترى هل ما دمنا شايفين الكبار بيرتكبوا جرائم التخابر تحت حماية ومعرفة اجهزة المخابرات والأمن الساكتة فهل حيستكثروا على الشعب انه يبيع بلده ...خلى الشعب يعيش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125210/http://www.20at.com/article2.php?sid=1091"

