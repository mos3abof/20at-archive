author = "درات الايام"
posted = "2006-09-07"
text = "فتاة فقيرة تعمل في سنترال خاص،و لكي تملأ فراغها فإنها تتنصت على مكالمات الزبائن،لتكشف عوراتهم جميعا و تعري كلا منهم في كابينته المغلقة التي يظن أنها تغلف أسراره و تستر فضائحه..لتكشف تفسخ و تشوه مجتمع بأكمله بكل ما فيه من أمراض : كبت جنسي ، خيانات زوجية ، قوادة و نصب تخفيهما الجلاليب القصيرة و اللحى."
