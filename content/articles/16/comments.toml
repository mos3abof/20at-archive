text = "و النبى ممكن تشوفولى فرصة و لو حتى (جويسوس) صغير اصلى بقالى خمس سنين متخرج و زهقت من البهدلة اللّى الواحد متبهدلها فى البلاد دى بالاضافة للى الواحد بيشوفى من انى الناس الهاى لايف عمالين بيزيدو فى الترف الى بيوصل لحد السفه و الناس الفقرة بيزيدو فقر لحد الموت من الجوع ناهيك عن الظلم اللى الناس شيفاه فى توزيع الوظايف اللى اصبح المحترم منها سولء كان فى الخارجية او فى اى مكان تانى ك\\محترم حكر على اصحاب الطبقة اياها و يجعله عامر"
