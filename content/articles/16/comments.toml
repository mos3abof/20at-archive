text = "شوفي ياختي , شكلك قديمه يعني<br />ما علينا , محسوبتك بتموت في حاجه اسمها جاسوسيه , حقول شويه حاجات واقفه في زوي<br />الجدع اللي اسمه بوند دا يعني روايات جمس بوند المولف نفسه كان جاسوس واشهر جاسوس وهواول بنو ادم عمل فرقه اكومندا , ماشي الكلام<br />وبالنسبه للجنس الناعم<br />ماتهاهاري كااشهر جاسوسيه في العالم<br />والوليه دي كانت في اندونسيا اثناء الحرب العالميه التانيه , غريبه فعلا<br />استغلت الجمال والنفوذ والحاجات الوحشه دي عشان تجيب اخبار العدو, المهم اشتغلت في فتره من الفترات كا لاعبه ثعابين يعني تمسك التعبان تلفه اللفه انسي , قعدت كتتتتتير خالص في المجال دا بس الحلو مش يكمل اتقفشت واعدمت بطريقه بشعه , الادهي بقي , بنتها<br />\"باندا\" امها اللي هي الوليه التعبانه دي ايوه اسم الله عليك , لما كبرت ما كنتش تعرف ان مامتها جاسوسيه , هي اساسا امها سبتها وودتها عند حته عشان يعتنو بيها ولما كبرت وعرفت ان امها جاسوسيه اذبهلت كدا , وقعدت تعيط اا امي جاسوسيه انا امي جاسوسيه , المهم الحاجه دي اتجوزت جينيرال كبير في الجيش اسمه عبد الله , الجدع دا لما عرف ان امها جاسوسيه حب يجرها في صالح الحزب بتاعه<br />شويه تردد كدا , واحد اتنين ماشي خلاص<br />اشتغلت باندا في الجاسوسيه زي امها من غير ما تحس شويه زهق طهقان , حبه حبه وانكشف امرها وماتت بردو بنفس طريقه امها .\" مصر المحروسه \" قديما بردو\"<br />في طفل صغنن اشهر جاسوس مصري , السادات بنفسه راحله بيته , عشان يهني علي انجازاته اللي عمالها اثناء الحرب<br />الطفل دا كان بيروح قرب الحدود ويحاول يسمع اللي بيحصل ويوصله للكبار , اتحملت كتير من ضرب وشتميه وكدا بردو لغايه لما الحرب خلصت ...<br />اثناء الحرب كان في شويه لعب علي الاسرائلين و اول لعبه الكهربا<br />يعني يفضو الجاز , ويخلو البشر تحتفظ باللمبه حيث لما تشتد الحرب , يغلي السعر والعدو ميعرفش يشتريها يعني يتعمي من الاخر .<br />وحيث ان جبنا سيره الحرب , في لبنان يا حاجه . ستك اسمهان يقال عنها انها كانت جاسوسه جامده واترمت في البحر بسبب الموضوع دا<br />\" والله كله من الذاكره يا بشر \""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125210/http://www.20at.com/article2.php?sid=1091"

