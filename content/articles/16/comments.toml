author = "بسلة مصرية مسلمة"
posted = "2006-09-24"
text = "كان فى مشهد فى فيلم النوم فى العسل بين عادل امام ولطفى لبيب لما كان بيقولة لو دولة معادية عايزة تقضى على شعب تعمل اية ؟ قلة دة يكفى وزيادة . وعلى كدة فاللى بيحصل دة فى مصر من تشرد وجوع وفقر ومرض ومهانة واعتقالات وسجون وبلاوى ما يعلم بيها الا ربنا اعتقد النفس ضعفت بس حقول اية ربنا يخرب بيوتهم"
