text = "جاسوس لصالح دول معادية للعروبة وللعكس أي لصالح دولة عربية ضد الصهاينة والامريكيين الذين دمروا بلاد العرب والمسلمين انتو عارفين لو قعدت الف الف عام عاطل عن العمل ........... مبشتغل جاسوس (من يرضي ان يخون بلده واهله فهو ذليل وسوف يعيش ذليل الي الابد وعلي فكرة انا سوداني دمي حاأأأأأأأأأأأأمي"
