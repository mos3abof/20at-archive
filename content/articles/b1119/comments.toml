[[comments]]
order = 0
subject = "فين المشرفين"
author = "واحد والسلام"
posted = "2006-08-02"
text = "انا مش مصدق إن موقع زى ده ما فيهوش مشرفين<br />كله شتايم و قلة ادب و مسخرة<br />المفروض القائمين على الموقع ده يشيلوا القرون اللى مركبينها و يوقفوا الوساخة و الدعارة اللى بتحصل فى الموقع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132425/http://www.20at.com/article2.php?sid=1119"

[[comments]]
order = 1
subject = "ماتستغرب يا اخ واحد والسلام"
author = "ريم بنت السعوديةoooooooo"
posted = "2006-08-02"
text = "صدق او لا تصدق كل شي بها الموقع انا مثلك استغرب مافيه مشرفين يمكن كل المشرفين عبري او فرانسي مايفهم عربي فلذالك يسمح بجميع الرسائل او انه موقع من دون احد يعني يبرمج نفسه بنفسه وهو الاصح ها ها ها كل شي جايز الايام هذي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132425/http://www.20at.com/article2.php?sid=1119"

[[comments]]
order = 2
subject = "اول الغيث قطره"
author = "الشافعى"
posted = "2006-08-04"
text = "المقاومه فى لبنان وفلسطين هى بدايه للمقاومه فى كل البلااد العربيه ضد الحكام الخونه والعملاء قبل اميريكا واسراءيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132425/http://www.20at.com/article2.php?sid=1119"

[[comments]]
order = 3
subject = "حاجة غريبة"
author = "لوسيلولو"
posted = "2006-08-05"
text = "حاجة غريبة سبحان الله المقال في واد والأخ واحد والسلام والأخت ريم من السعودية والسلام بيغنوا في واد ثاني, وهو ده سبب نجاح وتفوق نصر العرب والمسلمين على الغرب, إحنا العرب ما في عندنا شىء جد ولا مهم كله عند العرب بطيخ والسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132425/http://www.20at.com/article2.php?sid=1119"

[[comments]]
order = 4
subject = "هايل"
author = "علوووش"
posted = "2006-08-05"
text = "وينكم يا عرب، والله لنسأل جميعنا في ما فرطنا في جنب الله وتقاعسنا عن العمل، يا ايها العرب انصروا اخوانكم في كل مكان، الفلسطينيين والعرب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132425/http://www.20at.com/article2.php?sid=1119"

[[comments]]
order = 5
subject = "ليس من يسمع كمن يرى"
author = "عيلمـوـوـون"
posted = "2006-08-05"
text = "ليس كل من يسمع كما يرى، وأعتقد أن اي شخص من شتى أنحاء الوطن العربي قد جاء إلى قطاع غزة لن يلبث أكثر من أسبوع بعقله، ففي غزة تعيش بدون كهرباء، بدون ماء الا بأوقات معينة، بدون رواتب، بدون أي عمل، ولكن يكفي أنك تعيش بكرامتك<br />والحمدلله الذي أنعم علينا بنعمة الرباط<br />اللهم انصر الاسلام والمسلمين، واهزم الكفار والمنافقين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132425/http://www.20at.com/article2.php?sid=1119"

[[comments]]
order = 6
subject = "الى لوسيلولو"
author = "ريم بنت السعوديةoooooooo"
posted = "2006-08-05"
text = "انت شكلك جديد على الموقع لكن احترمك ولن ارد عليك اما بخصوص ما اقصده من انه ليس هناك مشرفين فاانت ادخل ارشيف سياسة واختر عنوان [[[ الحرب لحظة بلحظة [[[ وسترى العجاب انا عن نفسي انسحبت وتمنيت اني لم اعلق لان اصحاب الموقع هداهم الله تركو الحبل على الغارب وكل من دخل سب ولعن تبرات السنتهم منهم وسب في الدين والسنة وقتال حتى تحول الى حرب حقا الحرب لحظة بلحظة لكن اين بين هؤلاء المساكين من سعودي حر الى المغربي الى بقية المساكين وكل واحد ياتي بوثيقة والاخر ياتي بمصدر مقدس لديه هو صحيفة اسرائلية والاخر والاخر وهكذ ا ووصلوا الى الغيبة والبهتان وسب الدين والاستهزاء بالمسلمين وبااهل الحى والثياب القصيرة والحلف بغير الله لا يعلمون انهم يوم القيامة سيحاسبون واخر امرهم ظهر بينهم مجنون يسرد لنا قصة باسم مصطفى الرافعي اهذا دين ونخوة واجتماع العرب قلي ورد على ماكتبت وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132425/http://www.20at.com/article2.php?sid=1119"
