subject = "لقطة من حياته"
text = "المكان: القاهرة - منطقة الحلمية.<br />الزمان: بعد منتصف الليل يوم 12 فبراير من عام 1949.<br />الوقائع: تتقدم قافلة من عربات الشرطة في سكون الليل، تصل إلى أحد شوارع الحلمية بمدينة القاهرة، تتوقف السيارات، يندفع الجند بأسلحتهم لحصار الشارع كله، وتُشدد الحراسة، حول بيت متواضع في منتصف الشارع، تتقدم إحدى سيارات الشرطة إلى هذا البيت، صف من الجنود ينقُلون جسد ميتٍ من السيارة إلى البيت في سرعة، يطرقون بابًا في أعلاه، يفتح الباب شيخ جاوز التسعين من عمره، يدخل عدد من الضباط إلى البيت قبل دخول الجثمان للتأكد من عدم وجود آخرين به، التعليمات صارمة للشيخ، لا صوت، لا عزاء، ولا حتى أحد من المتخصصين في إعداد الموتى، فقط أنت وأهل البيت، في تمام التاسعة صباحًا يتم دفن الميت."
archived = "2004-08-10"
capture_url = "https://web.archive.org/web/20040810024955/http://www.20at.com:80/article.php?sid=515"

[[comments]]
order = 1
subject = "طيب خد دي"
text = "بدأ \"حسن البَنّا\" تعليمه في مكتب تحفيظ القرآن بالمحمودية، وتنقل بين أكثر من كُتّاب حتى أن أباه أرسله إلى كتّاب في بلدة مجاورة للمحمودية. وكانت المدة التي قضاها في الكتاتيب وجيزة لم يتم حفظ القرآن خلالها؛ إذ كان دائم التبرم من نظام \"الكُتّاب\"، ولم يُطِق أن يستمر فيه، فالتحق بالمدرسة الإعدادية رغم معارضة والده الذي كان يحرص على أن يحفّظه القرآن، ولم يوافق على التحاقه بالمدرسة إلا بعد أن تعهّد له \"حَسَن\" بأن يتم حفظ القرآن في منزله.<br />وبعد إتمامه المرحلة الإعدادية التحق بمدرسة \"المعلمين الأولية\" بدمنهور، وفي سنة 1923 التحق بكلية \"دار العلوم\" بالقاهرة، وفي سنة 1927 تخرج فيها، وقد قُدّر له أن يلتحق بها وهي في أكثر أطوارها تقلبًا وتغيرًا، خاصة في مناهجها الدراسية التي أضيفت إليها آنذاك، دروس في علم الحياة، ونظم الحكومات، والاقتصاد السياسي، فكان نصيبه أن يتلقى تلك الدروس إلى جانب الدروس الأخرى في اللغة والأدب والشريعة وفي الجغرافيا والتاريخ.<br />وكان لديه مكتبة ضخمة تحتوي على عدة آلاف من الكتب في المجالات المذكورة، إضافة إلى أعداد أربع عشرة مجلة من المجلات الدورية، التي كانت تصدر في مصر مثل مجلة المقتطف، ومجلة الفتح، ومجلة المنار وغيرها، ولا تزال مكتبته إلى الآن في حوزة ولده الأستاذ \"سيف الإسلام\".<br />أمضى البَنّا تسعة عشر عامًا مدرسًا بالمدارس الابتدائية؛ في الإسماعيلية، ثم في القاهرة، وعندما استقال من وظيفته كمدرس في سنة 1946 كان قد نال الدرجة الخامسة في الكادر الوظيفي الحكومي، وبعد استقالته عمل لمدة قصيرة في جريدة \"الإخوان المسلمون\" اليومية، ثم أصدر مجلة \"الشهاب\" الشهرية ابتداءً من سنة 1947؛ لتكون مصدراً مستقلاً لرزقه، ولكنها أغلقت بحل جماعة الإخوان المسلمين في 8 ديسمبر 1948."
archived = "2004-08-10"
capture_url = "https://web.archive.org/web/20040810024955/http://www.20at.com:80/article.php?sid=515"

