[[comments]]
order = 5
subject = "مصـ( الخير )ـعب"
text = "فعلا \" إذا صدق العزم وضح السبيل \"<br />هذا الرجل أشهدكم أني أحبه في الله<br />فعل هذا الجل ما يعجز عنه \"الكثيرون\" اليوم<br />فقد بلغ به السبيل أن دول القوة الكبرى آنذاك<br />صارت تخشاه !!!<br />و هو فرد واحد أعزل من السلاح<br />اللهم إلا سلاح الإيمان بالله و ايقين في نصره<br />صنع الرجل ملحمة بطولية<br />أيقظ أمة و أحيا همتها و عرفها عدوها<br />ووضح خطوات النصر والتمكين لدين الله في<br />الأرض......<br />رحم الله الإمام البنا وجزاه عنا خير الجزاء<br />و عوضنا عنه خيرا إن شاء الله ..."
archived = "2004-08-10"
capture_url = "https://web.archive.org/web/20040810024955/http://www.20at.com:80/article.php?sid=515"

[[comments]]
order = 6
subject = "اخواني قديم"
text = "رغم اني من الاخوان من زمان الا ان حسن البنا بالذات هو الشخص الوحيد الذي انظر له وانا اشعر بصدق كلمة الرجل الرباني ..<br />حسن البنا صانع للحياة بغض النظر عن الاخوان وما فعلوه طوال رحلتهم \"الخالدة\"<br />ربما اتعصب للاخوان في اي شيء ...وربما اتساهل في الكثير ايضا ..<br />الا ان حسن البنا يظل كلما مر الوقت الرمز والقدوة ولا انسي انه مجدد الاسلام للقرن العشرين ..<br />اللهم الحقنا به وبالصالحين من عبادك اللهم امين !!"
archived = "2004-08-10"
capture_url = "https://web.archive.org/web/20040810024955/http://www.20at.com:80/article.php?sid=515"

[[comments]]
order = 7
subject = "لعن الله شيوخ السلاطين"
text = "حسن البنا صنيعة المخابرات الفرنسية<br />صنعته لتحافظ على المصالح الفرنسية في مصر وخاصة قناة السويس<br />واستفاد منه الانجليز في مواجهى الاحزاب السياسية بدعوى انه لا احزاب في الاسلام<br />واستفاد جمال عبد الناصر من جماعة الاخوان المسلمين بتدعيم حكمه الديكتاتوري والغاء الاحزاب بنفس الفكرة<br />ثم انقلب عليهم 1ذبحا وتقتيلا بعد ذلك<br />قاتلهم الله جميعا من يلبسون الحق بالباطل"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018085016/http://www.20at.com:80/article.php?sid=515"

[[comments]]
order = 8
subject = "ايه يا خالتي"
text = "ايه يا خالتي ياللي فوق الكلام الاهبل اللي انت كاتبه ده استعمار فرنسي ايه يا ابلتي<br />انت لسة صاحي وضارب حجرين وعامل فيه المدافع عن الامة وانت اصلا لا فاهم ولا عارف حاجة<br />آه يا امة بتضحك المخاليق علينا وعلى جهلنا<br />اجري يا ابلتي العب بيعيد اجري"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018085016/http://www.20at.com:80/article.php?sid=515"

[[comments]]
order = 9
subject = "الحلم الثائر"
text = "اعتراض ومداخلة<br />بداية اعترض على كلام كاتب المقال فيما وضعه بين الاسطر بقوله مريدي حسن البنا<br />لم نكن يوما ولن نكون مريدي شخص مهما كان وانما اصحاب فكر اسلامي متوازن انطلق امتداده من الشرع والسنة متمثلا في فكرة من عقل الامام حسن البنا<br />ويثبت هذا كلام البنا في احدى الدورس عندما هتف البعض باسمه و كان في مجمل كلامه انه لن تنجح فكرة ولن تسير وتستمر في العطاء اذا هتفت باسم ولم تنطلق من عقل وبصيرة<br />اما المداخلة فهي كلام من اتهمه بانه صنيعة فرنسية<br />من منطلق اسلامي البينة على من ادعى واليمين على من انكر ... ولو راينا تسلسل القاعدة ان البينة تسبق اليمين في الطرح لهذا اين البينة على ما قيل بانه صنيعة فرنسية<br />ثم من منطلق العقل ... لم تقم اي حركة في العالم العربي والاسلامي ذات بعد غربي او عامل خارجي حتى لو تحمل الغطاء الاسلامي الا وانهدمت والامثلة كثيرة<br />فلم حركة الاخوان المسلمين ما زات على نفس القوة واعضائها بمئات الالاف ان لم يكونوا بالملايين؟؟؟<br />وشكرا"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018085016/http://www.20at.com:80/article.php?sid=515"

