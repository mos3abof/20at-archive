subject = "ابوفريد"
text = "الحمد لله وكفى .. والصلاة والسلام على النبي المصطفى وبعد: جزاكم الله خير على نشر مثل هذا لحياة الامام والله اني لاجد قيها عبرة لمن اراد ان يقتدي بهذا الشخص ولا حول ولا قوة الا بالله من اولئك الجهلة الذين يحاولون الطعن في شخصية هذا النفس الذي احياء الامة وايقضها وارجوا منكم نشر الكثير عن حياة البنا<br />رحمك الله يا امامنا مع تحياتي ((عامر باسلوم )) ابو فريد"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018085016/http://www.20at.com:80/article.php?sid=515"
