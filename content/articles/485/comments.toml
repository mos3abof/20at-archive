[[comments]]
order = 33
subject = "اغير علي ديني"
text = "السلام عليكم و رحمة الله و بركاته<br />ارجو من السادة القراء ان تتفهم راي بحيادية و موضوعية شديدة كذلك الاخ المطرب\\مصطفي محمود<br />1-يجب الاعتراف بان مصطفي محمود هو مغني او مطرب و ليس منشد ديني<br />2-وبذلك اعتقد ان فكرة الاغاني او الاغنية الملتزمة غير موجودة بالفعل فالالتزام ليس بالكلمة فقط و لكن الاداء و اللحن و الفرقة و المطرب و الجمهور ايضا.........<br />ان تدخلني ربي الجنة هذا اقصي ما اتمني<br />دعاء جميل جدا ولكن هل يصح من الاخ الذي يغنيه ان يقول للجمهور سقفو معايا و كم الموسيقي الصاخبة التي تصاحب مثل هذا الدعاء و اذا كان هذا هو الطريق و الاسلوب الذي يبتغيه مصطفي و فرقته و هو<br />ان تدخلني ربي الجنة هذا اقصي ما اتمني<br />فما علاقته بباقي الحفل الساهر الصاخب<br />ئانيا ياتي الاخ مصطفي و مايحمله من تهريج و مداعبات مع الجمهور و تنكيت و حاجات من هذا القبيل<br />و اعتقد ان علي سبيل المجال الفني و ليس الديني ان احترام المطرب للجمهور من اهم قواعد الادب<br />موقف غريب جدا احدثه مصطفي محمود حين اخذ زجاجة العطر و قال الله دي من عند النبي عليه الصلاة و السلام<br />و بعدها يقول اضعها هنا و يقصد علي خشبة المسرح ولا في جيبه.(منتهي الاستخفاف)<br />شئ اخر الاخ المحترم مقدم الحفل فوجئت به يقول ان المطرب مصطفي محمود اقتداء برسول الله صلي الله عليه و سلم قي حبه و تقديره للسيده عائشة رضي الله عنها<br />سيقدم اغنية لزوجته ما علاقة هذا بذاك؟!!!!!!!!!!!!<br />اما الجمهور فيبدو انهم سمعوا ان مصطفي مخمود سيقدم حفلة و غناء ملتزم (حلال كماسمعت من البعض)<br />فذهبوا و سمعوا و سقفوا لانه حلال؟!!!!!!!!!!!!<br />مع ان نفس الاشخاص و انا اغرف ناس منهم ممكن يكون في اغنية لاي مطرب تاني ولا تحمل اي معاني جارحة<br />ولكنهم لايسمعوها لان محدش قال عليها حلال<br />اخيرا انا لست ضد مصطفي محمود ولا ضد من يستمعون له<br />ولكن ضد<br />من يتاجروووووووووووون بالدين<br />melarabi@masrawy.com"
archived = "2005-06-01"
capture_url = "https://web.archive.org/web/20050601080353/http://www.20at.com:80/article.php?sid=1157"

[[comments]]
order = 34
subject = "تعليف"
text = "ارد علي الاخ الذي ارسل تعليقه بحياديه تامه ارد عليه ايضا بحياديه تامهمثلك فانا لا اعرف الفنان مصطفي محمود شخصيا ولكني مستمعا لبالبوماته كلها وكنت ممن حضر الحفل الذي اقامه00000 اولا مصطفي محمود معروف عنه حبه الشديد للناس عامه ولجمهوره ثانيا كما انه ايضا معروف بخفه دمه الملحوظه والا ماأحبه هذا الكم الكبير ولو هو مغني وليس منشد ديني فهو ايضا مقبول لانه لا يخرج بغنائه عن الكلمات المبتذله والمعاني الجارحه واعتقد انه بذلك ومن المجال الفني وليس الديني يحترم جمهوره بما يقدمه له من معاني هادفه 00فليس من الضروري اذا كان منشد ديني ان يقف امام جمهوره عابسا متجهما فما يعيبه اذا كان يداعب حضوره باكلمه الطيبه والبسمه الرقيقه ويزيل كل الفواصل بينه وبينهم باحترام واؤكد لك اذا كنت حضرت الحفل انه لم يخرج عن قواعد الاحترام بل وبالعكس فجميع من راه شعر انه مع اخيه او ابنه وانه يتكلم معهم بكل براءه 0000 اما عن تقديمه لاغنيه يعبر بها عن تقديره لزوجته وانه بذلك يقتدي برسول الله عليه افضل الصلاه والسلام فهذه رساله لكل زوج وايه المشكله فرسول الله اوصانا بالزوجات خيرا وكان ذلك من باب التذكره وهو بذلك يقتدي بافضل خلق الله عن طريف الكلمه الهادفه واللحن الرقيق العذب والعلاقه قويه لعلك تدركها حين يرزقك الله بالزجه الصالحه باذن الله فتجلها وتقدرها يااخ ياكريم اذا كنت تعد مصطفي محمود من المغنيين وليس المنشديد فمرحبا به في زمن انعدمت فيه الكلمه الطيبه التي تصل الي اذاننا واذان اطفالنا فتؤذيها واهلا به مطربا ومغنيا ومنشدا"
archived = "2005-06-01"
capture_url = "https://web.archive.org/web/20050601080353/http://www.20at.com:80/article.php?sid=1157"

[[comments]]
order = 35
subject = "أنا من مستمعين مصطفى"
text = "بسم الله الرحمن الرحيم<br />أنا من مستمعين مصطفى و كنت ممن ذهبوا إلى الحفل.. وأنا أكتب الآن و أنا أستمع إلي CD صناع الحياة و معجب بيه جداً ...<br />الفكرة إن في ناس كتير و أنا واحد منهم لهم تذوق فني للموسيقى و الكلمات و الألحان .. وكانت أصعب حاجة بطلتها في بداية التزامي هي عدم سماع الأغاني و أصعب قرار كان إني مسحت الـ mp3 كله من على الجهاز و الحمد لله ...<br />و بالنسبة لي مصطفى محمود و سامي يوسف و أي حد مثلهم هو طوق النجاة الذي أتعلق به كي لا أعود للأغاني العاطفية البذيئة التي كنت أستمع إليها ...<br />.... و أخيرا بوجه لمصطفى رسالة :<br />\"ربنا يحفظك و يوفقك و يدخلك فسيح جناته يا رب .. و ياريت تكمل مشوارك مع الفن الهادف ..<br />** و إليك 3 نصائح مني ليك كأخ صغير ليك و من أشد المعجبين :<br />1- حاول زيادة نسبة الطابع الديني على أغنياتك .<br />2- استخدم تقنيات أحدث ، واعتن بألحانك أكتر .<br />3- ياريت بعد كده الشريط يبقى 8 أغاني (جامدين) و بلاش أغاني (كسر) أو تكرار ...\"\"<br />و جزاكم الله خيرا<br />ayman_basha_06@hotmail.com"
archived = "2005-06-01"
capture_url = "https://web.archive.org/web/20050601080353/http://www.20at.com:80/article.php?sid=1157"

