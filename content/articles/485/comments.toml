[[comments]]
order = 23
subject = "يا مصطفى يا مصطفى"
text = "السلام عليكم ورحمة الله و بركاته<br />انا حضرت الحفلة يا جماعة و بصراحة كانت جميلة جدا و يكفى ان المستوى الفنى ليها كان فى تعادل مع حفلة سامى يوسف , اما بالنسبة لتفاعل الشباب فكان عالى جدا و ياريت اللى يعرف منكم ميعاد اذاعة الحفلة على اقرأ يقول علشان اللى مش راح الحفلة يقدر يتابعها , مع ان الحضور حاجة و المشاهدة حاجة تانية خالص, بس انا عندى ردين على تعليقات اخوة هنا فى الموقع اولهم ان بالنسبة لبدانة مصطفى محمود فهوه بيعوض الشكل فى خفة الدم الجامدة جدا و طبعا الصوت الاجمد, و الرد الثانى لأدهم صبرى و هوه على الجزء الخاص بالعطر الذى اهدى الى مصطفى وهوه كان من الفنانة المعتزلة مديحة حمدى .<br />أراكم على خير فى حفلة جديدة.<br />السلام عليكم ورحمة الله و بركاته"
archived = "2005-06-01"
capture_url = "https://web.archive.org/web/20050601080353/http://www.20at.com:80/article.php?sid=1157"

