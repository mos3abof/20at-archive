text = "بسم الله الرحمن الرحيم<br />1) بالنسبة للشكل هو أوسم من الفنان خالد عجاج (حد ممانع)<br />2) بالنسبة للتخن هو أرفع من الفنان محمد فؤاد .<br />3) بالنسبة للأخ بتاع الشعر هو سعادتك مرشد الإخوان ولا المتحدث الرسمي المشكلة إن كل واحد عاوز يقول حاجة بيقولها يعني سعادتك مش هترتاح إلا أما حد يدخل يفقع الإخوان شتمتين وواحد يرد عليه ونطلع من الموضوع .<br />4) الخطوة دي جريئة من مصطفى واللي أعرفه إنه كان قبل الالتزام عاوز يكون مطرب وياريت باقي المنشدين يعملوا زيه وزي المنشد اللي عمل نشيده فيديو كليب وقناة اقرأ جابته في برنامج اقرأ معكم"
