[[comments]]
order = 29
subject = "ايه رأيك تعطينا رأيك البناء بكل صراحة"
text = "السلام عليكم ورحمة الله الحمد لله فقد كنت من الحضور للحفل بل والفضل لله كنت من الذين أعدوا لها وكنت ضمن فريق العمل وبعد ما شاهدت وعايشت وعاصرت فيها من صعاب ومن مهام ثقيلة ومن مفاجأت أقول بداية هى نقلة نوعية كبيرة جدا للفن الإسلامى عامة ثم لمصطفى محمود على وجه الخصوص مهما اتفقنا او إختلفنا فى جوانب القصور أو جوانب التكامل . ثانيا كان من المقرر حضور الفنان إيمان البحر درويش لكنه اعتذر فى أخر لحظة وذلك لإرتباطه بتصوير فى التليفزيون كما ان الفنان وجدى العربى الذى كان ايضا من المدعويين اعتذر بسبب بروفات مسرحيته فيتنام تو و التحضير لها والتى ستكون الأسبوع القادم فى محافظة دمياط كما ان قناة النيل للأخبار كانت ضمن فريق عمل كيبر قامت بتغطية الحفل والذى سيذاع تغطية عنه فى قناة النيل للأخبار يوم الأحد السابعة صباحا وحتى العاشرة كما ذكر لى معد ومقدم البرنامج ثالثا مهما احاط هذا العمل من قصور أو تكامل فهى خطوة تستحق أمرين الأول بالتأكيد هو التقدير حيث الحرص على تقديم لون وشكل متميز للفن الهادف كما وصفته الفنانة منى عبد الغنى والثانى هو النصيحة لكل من رأى فى هذا العمل من قصور ويريد أن يرى له شكل أفضل وصورة أبهى لذا أتمنى أن أتلقى على البريد الإلكترونى الخاص بى أى نصيحة أو تعليق او أى شئ تود قوله حتى نكون بذلك عمليين. على يوسف مدير مؤسسة إشراقة للتسويق الإعلامى المؤسسة الراعية لحفلات وأعمال مصطفى محمود حول العالم<br />0020102587376<br />sama4for@hotmail.com"
archived = "2005-06-01"
capture_url = "https://web.archive.org/web/20050601080353/http://www.20at.com:80/article.php?sid=1157"

