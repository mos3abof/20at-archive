subject = "حسبنا الله ونعم الوكيل"
text = "حسبنا الله ونعم الوكيل الأخ ( ولو أنه مش أخ ولا حاجه ) لأن الأنسان اللي يدعي على إنسان مسلم الملائكه بتردله الدعوه وهو مراعاش أنه ممكن يأذي مصطفى بهذه الدعوه ولا أن يأذي محبيه ولكن أحب أعرفه أن مصطفى لم يهتز لهذه الكلامات لأنه لا يلتفت إلى الوراء ولأن مصطفى أمامه رساله لا بد أن يؤديها للدعوة لدينه ووطنه عن طريق الفن الراقي الجميل وكفايه أن كل اللي حضر الحفلة واللي محضرهاش ( لأنه شسمع عنها )أتبسط جداً منها .<br />وأحب أعرفك يامصطفى أننا جميعاً بنحبك وبنشجعك وربنا معاك ويكمل شفاك على خير وقلوبنا كلنا معاك"
archived = "2005-06-01"
capture_url = "https://web.archive.org/web/20050601080353/http://www.20at.com:80/article.php?sid=1157"

