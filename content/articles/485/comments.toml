order = 31
subject = "نقلا من موضوع اخر عن مصطفى محمود"
text = "مصطفى محمود ده صوته خنيق....بحس اني عايز ادخل الحمام لما اسمع صوته<br />أنا كاتب التعليق ده<br />تاني يوم بعد ما كتبته لقيت رساله في ايميلي مكتوب فيها:<br />السلام عليكم ورحمة الله وبركاته<br />انا مصطفى محمود<br />جزاكم الله خيرا على هذا التعبير الجميل,,فى الحقيقة انا اول مرة حد يقول عليه كدة واسف<br />جدا لو كنت سببتلك اى اذى بسبب صوتى بس والله انا نيتى خير من الاغانى اللى بأقدمها........<br />عامة أكون سعيد لو اتعرفت عليك و سمعت صوتك على تليفونى ************أخوك مصطفى محمود<br />انا قولت الاخ مصطفى محمود بيبعتلي الرساله دي...قال يعني هخاف منه وهتحرج ومش هتصل بيه...بس اثبت العكس...اني معنديش دم...واتصلت بيه<br />انا طبعا من اشد المعجبين بمصطفى محمود بس مصطفى المحمود القديم بتاع يا طريق ويا ذا المنه...والكلام ده كله<br />...بس مش معجب بمصطفى محمود الجديد بتاع صناع الحياه....لانه غير صوته على الاخر....الصوت بقى رفيع أوي أوي...والصوت ده بيبقى خنيق.<br />كلمته وقولتله الكلام ده...بس الراجل كان في منتهى الطيبه والسماحه معايا زكنا بنتعامل كاننا اصدقاء نعرف بعض من زمان....واثبت فعلا اخلاقه الحميده...ووضحلي اهدافه التي يسعى ورائها...فهو لا يسعى الى الشهره او الصوت الجميل...لكنه يسعى اللى توضيح افكار ممتازه من خلال الاغاني مثل اغنيه صناع الحياه....وفعلا انا بعتذر للرجل ده عن اسلوب كتبتي للتعليق.<br />والراجل ده ما فيش منه اتنين"
archived = "2005-06-01"
capture_url = "https://web.archive.org/web/20050601080353/http://www.20at.com:80/article.php?sid=1157"

