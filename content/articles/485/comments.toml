text = "إزيك يا (ريس) ؟؟؟ أنا تقريبًا أول واحد يعدي هنا :) القلوب عند بعضها ، ما تنساااااااااش معادنا بعد بكــرة ، وياريت تبقى تنشر شعرك الجميل هنا كماااااااان :)<br />هوا الوجود إيه غير الكلمـة ؟؟<br />ممكن تسمح لي أقول : هوا إحنا زماننا اللي استعجل ، ولا إنتا كبرت وبتداري ؟؟؟<br />حلوة حكاية الرسالة اللي تستغلها ، وتكتبها مقال ....<br />بص عجبني بــجد ...<br />بس أنا كنت فاكرك هتتريق عليهم ، بدل (مرة واحد صعيدي) تحيااااااااااتي<br />إنتا عارفني :)"
