author = "زويل امريكى"
posted = "2010-01-12"
text = "زويل امريكى من اصل مصرى<br />انتم عارفين القرعة اللى بتتباها بشعر اختها - اهى نفس الحكاية<br />زويل مخ جبار ومخترع وكل حاجة حلوة فية ولكن عمل اية لمصر وعمل اية لامريكا<br />للاسف كل عمايلة لامريكا بلدة<br />وانا رايى ان اى مهندس مصرى صغير بنى لمصر كوبرى على ترعة او رصف طريق<br />او حتى دكتور صغير فى وحدة صحية ريفية عالج فلاحة مصرية فى اعماق الريف او الصعيد او مدرس ابتدائى فى نجع من النجوع علم طفل حروف الهجاء<br />او حتى بناء بنى جدار فى عمارة - كل هؤلاء عندى احسن من زويل وعشرة مثل زويل"
archived = "2010-01-13"
