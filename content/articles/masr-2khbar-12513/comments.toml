author = "تقنيا كيف ؟"
posted = "2009-06-30"
text = "تقنيا وفنيا كيف سيتم تنفيذ ذلك ؟<br />هل عسكرى الامن المركزى الواقف فى اشارة المرور هيبقى معاة لاب توب ويسجل المخالفة لتنتقل الى مركز المعلومات لارسال رسائل على المحمول<br />واذا كانت ضباط المرور لا يعرفون الكمبيوتر ولا يحبون التعامل معاة - يبقى ازاى هيتم<br />مشكلة المرور فى مصر<br />ان بتوع المرور عساكر وضباط عمرهم ما ساقوا عربية ولا يعرفون القيادة وكل ضابط بيركب العربية جنب سواق"
