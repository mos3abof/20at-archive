[[comments]]
order = 1
subject = "حرب غبية..بقيادة غبي"
author = "انا بقى موضوع اليمن ده دايما بيفكرني بخيبة عبد الناصر.."
posted = "2006-06-03"
text = "باع غطاء مصر الذهبي عشان يصرف في حرب اليمن ... و يساند الجزائر.. و كام بلد تانية ..و سابنا احنا نجوع.. مش كان الاولى انه يعمل على تنمية مصر..؟؟<br />كان زماننا دلوقتي زي الهند كده ولا حاجة !<br />احنا مالنا بحرب اليمن !! يموت جنودنا في سبيل خلافات غيرنا ليه ؟؟ هو احنا خلاص.. مظبطين نفسنا اوي..<br />مساندة الاخوة لا تعني ابدا اني اقلع بلبوص.. و اعمل من جلبيتي عمة لأخوية ..!"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216071907/http://masr.20at.com:80/article.php?sid=418"
