text = "الاخ اللي فوق ..زهي الاخت مريم مزعلاك في حاجة ولا مؤاخذة ...<br />مالها البنية ...بتكتب عن تحضير الشنط قبل السفر وعن برود الاعصاب اللي فن وهندسة وعن ريحة العرق الفظيعة اللي تعتبر مشكلة مهمة جدا في حياتنا ...<br />وأخيرا عن الايس كريم ودوره الحيوي في المنطقة العربية بل والعالم كله ...<br />يبقي فين القسم الامريكاني اللي انت بتكلم عنه ...!!<br />عيب عليك ده الأمريكان لو عرفوا هيعتبروها شتيمة ..!!<br />قال امريكاني قال ..!!"
