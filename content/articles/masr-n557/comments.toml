[[comments]]
order = 14
subject = "فانيليا و مانجو"
text = "على فكرة يا جماعة أنا عندي كذا وصفة لأنواع كتير أوي و نكهات بتحبوها بس ماكانش فيه وقت أو مساحة أكتب فيها كل الوصفات اللذيذة وأنا عارفة إن الفانيليا ممكن تنفع الناس كلها, لو أي حد عايز أي معلومات عن الآيس كريم, ما يتحرجش مني و يقول على طول و أن تحت أمر الجمهور.<br />و أتمنى فعلاً إن الموضوع يكون عجب نسبة كبيرة منكم, أما بالنسبة لحكاية إن أنا مسئولة عن المقالات الأمريكاني بالموقع, فأنا بحب أكون دقيقة في معلوماتي و علشان كده بلجأ لمراجع و كتب و مجلات و مواقع باللغة الإنجليزية و كمان العربية علشان أكون عاملة تغطية شاملة للموضوع, ففي حاجات كتير بترجمها, لكن يا جماعة أصل الموضوع مش ترجمة, دي بعض المعلومات أو الإرشادات هي اللي مترجمة و ليس الموضوع ككل... أرجو أن أبقى مع جمهور عشرينات على إتصال دائم... و شكراً<br />كاتبة المقال :)"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018101738/http://www.20at.com:80/article.php?sid=557"
