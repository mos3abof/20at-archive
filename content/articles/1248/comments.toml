subject = "كدب وافتراء"
author = "احمد ابو امين"
posted = "2006-06-26"
text = "انني على يقين بان هدا الهراء والحشو من قبيل صب الزيت على النار من قبل محتل يبحث عن كل الوسائل لكي لا يجتمع شمل الفلسطينيين ولكي لا تتوحد كلمتهم ولا اظن ان هده الفرية ستلقى ادانا صاغية اللهم وحد صفوف اخواني في فلسطين وايدهم بنصر من عندك وكن لهم وليا ونصيرا"
