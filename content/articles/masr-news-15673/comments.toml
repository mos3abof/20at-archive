text = "بكرة وزير البترول هيطلع بيان او النهاردة بالليل هيقول<br />ان بتوع المزارع بيدفوا الفراخ بالسولار وان بتوع مصانع الطوب بيستخدموا السولار الدعم وان الفلاحون المجرمون بيولعوا قش الارز بالسولار وان العصافير والغربان وقفت على الخزانات وشربت السولار وجارى تحويلهم للنائب العام وان السولار متوفر وكتير والحمد للة بس بتوع السوق السودة هما المتسببين فى الازمة واطمئنوا جدا فالحزب الوطنى صاحى ورجالة الحزب صاحية<br />وسلامتها ام سيد"
