subject = "الكل مرتاح"
author = "عابر القارات"
posted = "2006-07-17"
text = "الى كاتب الموضوع الشيق يا سيدى الكل مرتاح بما يجرى و أستطيع أن ألخصه فى الاتى:<br />1- أمريكا: و هى تخرج بفوائد عديده من ما يجرى أولها صرف الانظار بيما فيها الداخل الامريكن عن ما يجرى فى العراق و أفغانستان من خسائر فادحة للامريكان و ورطة لا يدرون كيف يخرجوا منها و ثانيها أن حزب الله يمثل لها إمتداد لأيران التى تكرها أصلا و بذلك فليذهب حزب الله الى الجحيم فهذه منظمة إرهابية و جرى تشبيهها بالقاعدة لكى تجذب المؤيديين لما يحدث هذه الايام<br />2- إسرائيل: إن إسرائيل أمنت جانب الحكومات العربية فهى تعرف أنها هزيلة و عميلة فأمنت جانبها و لم يبقى لها الا بالفعل ما تخاف منه و فعلا يهدد وجودها و هى المقاومة التى لا تأبه بالحياة كثيرا و الجهاد هو عقيدتها و العناد و الصلابة هو ميثاقها و هذا ما يقض مضجع الساسة فى إسرائيل فحان الوقت للتخلص منهم دفعة واحدة فى فلسطين و لبنان ليخلوا الجو لإسرائيل و تتفرغ للتالى فى القائمة و بما تكون سوريا بعد ذلك<br />3- العرب: الحكومات الهزيلة تفرح بما يحدث فى لبنان و فلسطين لأسباب عديدة فمنها من فرح لأن يكره الاسلاميين أين كانوا أكثر بكثير من بغضه تجاه إسرائيل و بعضهم بالخصوص يفرح بما يجرى لأختلاف المذاهب و نكاية فى حزب الله و من وراءه الايام الذى يمثل هدفها تصدير الفكر و الثورة الاسلامية الشيعية أكبر هاجس و قلق لدولى الخليج على وجهه الخصوص و منها من يفرج لأنه عميل أصلا و خائن أبا عن جد جد و أول شئ يهرع أليه هو الخيانة و إتخاذ المواقف التى تتأخذها إسرائيل و أمريكا بدون وعى أو تفكير و منهم من يفرح لأن عنده مشاكل داخلية أصلا و لأنه له مصالح (الشخصية طبعا) فكانت فرصة جيدة جدا لأن ينشغل الناس بما يحدث فى لبنان و فلسطين عما يحدث فى داخل بلدهم من فرض قوانين ظالمة و قمع<br />اقرأ بقية التعليق .."
