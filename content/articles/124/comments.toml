subject = "كبه، ياسم"
text = "موضوعك حلو يا احمد زين ...لكن كانك جبت قعر القفص...مجبتش سيرة واحده من اياهم من اللي بيطلبوا الدين فقط والحياة الكريمة، ولا جبت سرة الأرملة اللي عاوزة تعف نفسها وتربي عيالها..مدرستش في اية اللي يخلي العربيات يتجرأوا ويحطوا طلباتهم وعروضهم على الإنترنت!!! مش يمكن من قلة الرجالة!!<br />وبعدين اية القفلة اللي قفلت بها الموضوع...بتعشمهم بإية بلا خيبة...مش لما يسترجلوا الأول.<br />ولا الفتك التاني اللي عاوزنا نكون زي زوجات الرسول وبناته...يا اخي اتمنى اننا نكون عشرهم مش زيهم ...لكن انتم كمان خليكم زي اللي اتجوزوهم وبلاش شعارات رنانة ...اهو كل اللي تعرفوه في السنةخدوهم فقرا يغنيكم ربنا!!!لكن لا تعرفوا حاجة في معنى الرجولة ولا المسؤلية .... كتكم القرف غميتوا نفسنا"
