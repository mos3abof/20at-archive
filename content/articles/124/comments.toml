text = "ابي اتعرف على وحده صادقه انا سعودي جميل ساكن بالرياض عمري 28سنه وياليت تكون قصيره عشان اقدر احتويهايعني الى 165طولها 160ولوني ابيض ويالبت تكون مقبوله الشكل وياليت تكون صادقه<br />ومش فارقه معي زواج او لا اهم شي الصدق<br />سواء كانت مطلقه او انسه ولكم تحياتي<br />الا ياوقت وين اللي على بالي يجي ويروح<br />هذاك اللي اذا شفته كأني بعالم ثاني"
