text = "ياشباب انا احس انكم جالسين تخرطون على بعض قالبين النت مخرطة أكاذيب كل من هب ودب قام ينصب واحد ابي اتزوج واحد ابي مطلقة واحده ابي واحد غني واحديقول انا ابوي مليونير وحده تقول انا عنية جدا وحلوه جدا ومغروره هي أكيد وابصم على العشرة العكس هو الصحيح ياااااااااااااااااناس التواضع حلو والصراحه احلا وصدق من قال ان الكذب صارت موضه .<br />أخوكم<br />مخاوي القمر : من الرياض : 0505495313<br />للإستفسارات : prince595@hotmail.com"
