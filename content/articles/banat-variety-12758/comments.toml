author = "أُختــك في الله . ."
posted = "2009-12-07"
text = "السلام عليكم . .<br />الحمد لله على نعمة الإسلام و كفى بها نعمــة . .<br />فقد أمرنا الله عز و جل بغض البصر عن الحـرام سواء للرجال أو للنساء . .<br />فقال تبارك و تعالى (﴿قُلْ لِلْمُؤْمِنِينَ يَغُضُّوا مِنْ أَبْصَارِهِمْ وَيَحْفَظُوا فُرُوجَهُمْ ذَلِكَ أَزْكَى لَهُمْ إِنَّ اللَّهَ خَبِيرٌ بِمَا يَصْنَعُونَ (30) وَقُلْ لِلْمُؤْمِنَاتِ يَغْضُضْنَ مِنْ أَبْصَارِهِنَّ وَيَحْفَظْنَ فُرُوجَهُنَّ﴾) - و اقترن غض البصر مع حفظ الفـرج لأن عدم غض البصر طريق إلى زنـــا الفـرج .<br />وقال النبي صلى الله عليه و سلم (( العيـــن تزنــي و زناهـا النظــر )) زنا العين هو زنا يوجب التعذير لفاعله لأن الدوام على زنا العين يــؤدي إلى زنـــا الفــرج<br />فهذا هو الدين الإسلامي العظيم الذي يحافظ على الإنسان من مجرد الوقوع في مقــدمات الزنــا , يحذر الإنســان من خطــوات تؤدي به إلى الهـلاك الحتمـي ."
