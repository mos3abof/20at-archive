subject = "رسالة"
text = "نشرت جريدة آفاق عربية -القريبة من الإخوان - فى عددها الأخير تصريحات للأستاذ مهدى عاكف اكد خلالها انهم مع تغيير السياسيات والمناخ العام قبل تغيير الدستور .. فما الجدوى من تغيير نصوص فى الدستور وتبقى حالة الطوارئ والكبت السياسي سائدة كما أكد على ضرورة ان يتم اختيار رئيس الدولة من بين اكثر من مرشح.. وهناك تفاصيل أخرى لمن أراد الرجوع إليهاكما اود أن أشير إلى أن سياسية الاخوان تقوم على تغيير السياسات وليس هناك عداء مع أشخاص وهذا ما سبق وان اكده مرشد الاخوان وغيره"
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

