subject = "الاخوان بشر ممكن يخطئوا المهم من يصوب الخطأ"
text = "انا اظن ان<br />الاستاذ مهدى عاكف<br />اخطأ كثير فى استحواذه على منصب المتحدث العام وابعاده المتمكن عصام العرايان<br />ولا انسى يوم ان كان على الهواء فى الجزيرة ورن الهاتف المحمول الخاص به بعد وصله من التقطع فى الكلام ( لا اجد ما اصف به غير التهتهوانا اعتذر عن اى سوء ظن )<br />فاخرج جهازه المحمول ونظر للشاشته<br />لازم نضع كل رجل فى مكانه<br />وبعدين لا زم نتعلم ازاى نختلف<br />مع بعض<br />دون تعصب<br />انا من الاخوان<br />ولا امل توجيه النصائح واعلم ان الاخوان بشر وليسوا ملائكه<br />المهم ان نتفهم هذا<br />كل الشكر"
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

