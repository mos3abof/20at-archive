text = "هذا عن التدخل الاجنبي ...<br />ولكن هل يندرج تحت هذا البند التدخل العربي في شئون مصر؟؟؟<br />خاصة من دول نفطية صحراوية تحاول نشر ثقافتها وفقهها وفهمها للدين بالعافية وبالفلوس في مصر؟؟؟"
