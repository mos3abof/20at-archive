[[comments]]
order = 17
subject = "قاطعوا الفارغين لو سمحتم"
text = "فى كل المجموعات البريدية والمواقع التى تتيح حق الرد مثل عشرينيات وحتى فى الندوات وبرامج الهواء يتواجد بعض اشخاص لا هم لهم سواء السفسطة والتظاهر بالمعرفة وهو ينقلوان وجهات نظر سمعوها من اخرين ولان معندهمش شغلة او شغلانة واظاهر كدة النت عندهم ببلاش /عندهم استعداد يجادلوا للصبح /<br />فرجاء لكل الاخوة المثقفين والواعين حافظوا على صفاء هذا الموقع وتجنبوا الرد على هؤلاء وانتم تعرفونهم جيدا واى مقطوع منهم يكتب كلمة شتيمة واحدة فى كلامه يطبق عليه قرار المقاطعة<br />ان هؤلاء هما الذين -بقصد او بدون- يثبتون قاعدة مغلوطة تقول اننا شعوب غير قادرة على الحوار<br />محمد عبدالرحمن"
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

[[comments]]
order = 18
subject = "ايها المرشد ..حسني مبارك ليس ولي احد .....ارحمونا"
text = "مرة أخري وبدون سابق انذار ...يخرج الرجل الاول في جماعة الاخوان المسلمين ....ويلقي قنبلة علي الكل اولهم شباب وفتيات الاخوان المسلمين ...الحياري ما بين مسئول وقائد ......يحاولون بذل كل جهد لتبرير كل كلمة ينطق بها احد من قيادة الاخوان مفترضين اولا انه يعرف ماذا يقول ومفترضين ثانيا انه علي حق مهما كان وانه لا يخطأ ابدا.<br />الاخوان المسلمون سواء احببناها او كرهناها هي الجماعة ذات العدد الاكبر والتنظيم الافضل في مصر<br />وهي تحتكر الاسلام بقصد او بغير قصد ..والسبب اننا في بيئة ديكتاتورية .....يتحول فيها كل حامل فكرة الي الاوحد من نوعه بينما يتم اهمال الاخرين<br />ولان الاسلام دين عالمي ومسالة مرتبطة بحياة ملايين المصريين .....كثير منهم ينظر الي هذه الجماعة نظرة المثل الاعلي باعتبارها تذود عن الاسلام<br />لكن<br />حتي لو حلف لك اي اخ او اخت من الاخوان مليون مرة ..نحن لا تحتكر الاسلام ...الواقع يخالف الاقوال<br />هكذا نحن نعيش في زمن الاحتكار مرة اخري<br />جماعة تتحكم في الخطاب الاسلامي<br />دعاة يحددون من علي منابر التلفزيون كيف نتحرك خطوة بخطوة<br />هذا احتكار<br />والمشكلة ان لفظة اسلام ترتبط بهم<br />وانا هنا لست بصدد نقد الاستاذ مهدي عاكف ...فانا احترمه شخصيا كانسان عاني الكثير من اجل مبادئه وهو رجل متواضع وبشوش لمن قابله في اجتماع معارضة او جلس معه احيانا في اي مؤتمر<br />ليس هذا القصد وليست هذه القضية<br />القضية هو أسلمة الذل ......وخلع القاب \" عصور التوسع في ايام الخلافة \" علي طغاة \" عصر الدول والمؤسسات \"<br />المشكلة في طريقة التفكير<br />المشكلة في خلق حالة من الانتظار ل ....مش عارف هي ايه بالظبط ....الهدف منها السماح للاخوان بالتغلغل اكثر حتي يتمكنوا من المواجهة<br />لكن لا مانع من نفاق هنا ومداهنة هناك ..واهوه كله \" مصلحة دعوة \"<br />بحق الله .......من يفتي لكم ؟ ومن اين تاتون بسياساتكم ؟ ولم فزع اكثر شبابكم من هذه التصريحات لدرجة ان عصام العريان نفسه اضطر يبرر بشوية كلام يضحك الاطفال ؟<br />وهل سالتم الالاف من الاخوان العاملين في صفوفكم ؟ وهل استطلعتم رايهم ؟ وهل تعبرون عنهم ؟<br />ام ان صوت المرشد اعلي من الجميع ؟<br />مهدي عاكف..ايها الاستاذ الفاضل ...حسني مبارك ..هو وليك أنت ...<br />الطاغية وليك وليس ولي احد فينا ......ولم تستأذت حتي الشعب المصري لتساله ..من وليكم؟<br />وما هي ولي ؟<br />وليه استخدام الفاظ شرعية لها وضع سياسي خاص لا يصلح لزمننا هذا ابدا ؟<br />ايه الهدف من وضع \" اسلامية \" لكل لفظة ....و\" شرعية \" لكل هفوة ؟<br />ارحمونا .....انتم تستخدمون الاسلام وتدعون الي الذل<br />ارحمونا ........وارحموا حتي اتباعكم الحياري الذين لا يعرفون علي من يردون ؟<br />وكفي استخداما للاسلام لتبرير مواقفكم ...انتم احرار ولكن لا تأسلموا كل شئ ..حتي تكتسبوا مصداقية<br />حتي وانتم تسقطون في الهاوية<br />ايها \" المرشد \" ............... اذكرك بخطأ ارتكبه حسن البنا ....عندما ظن انه يقود مصر باسم الله حتي من غيراستئذان المصريين<br />عندما بدات المعارضة المصرية تقوم لتحارب فساد الملك<br />قال :\" ان كان الشعب ضد الملك فان الله مع الملك \"<br />ولكن الملك خان الله والشعب...بل وحسن البنا<br />هل تتعلمون من اي خطأ ؟<br />نقلا من موقع : www.salamegypt.org<br />- هذا رأيي الشخصي ولا يعبر بالضرورة عن راي الجبهة الشعبية السلمية لانقاذ مصر -"
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

