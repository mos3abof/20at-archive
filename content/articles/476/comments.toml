subject = "فياجرا عشرينات !!"
text = "إلى الأخوة الذين يعلقون بقولهم ( عشرينات عايز يعمل دعاية وينشط نفسه )<br />1- أنا مجرد زائر للموقع لست محررا فيه<br />2- من حق كل موقع أن يصنع دعاية لنفسه بالطريقة التي تعجبه طالما لا تصدم مع شيء من الأخلاق . هذا إذا افترضنا أن هذا الموضوع هو كما تقول ( دعاية للموقع )<br />3- الموضوع - إذا كان دعاية - فهو أيضا لا يخلو من دعوة للنقاش هو قضية مهمة تخص كبرى الجماعات الإسلامية في العالم أجمع والتي تضم بين جنباتها معظم المفكرين والدعاة الموجودين على الساحة"
