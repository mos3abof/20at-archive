subject = "يا أيها الذين آمنوا لا تقربوا الصلاة"
text = "السلام عليكم . .<br />أحب أن أدلي برأيي المتواضع في هذا الموضوع وهذه التصريحات ..<br />1- الذي يستدل بهذه التصريحات على أن الإخوان قد دخلوا في عباءة الحكومة . .فهو تماما مثلما يفعل أحد عندما يقرأ ( لا تقربوا الصلاة ) ثم يترك بقية الآية . .<br />مواقف الإخوان محددة ومعروفة وثابتة ولا أحد يقبل المزايدة عليها أو التلاعب بها . .<br />الإخوان هم الفصيل السياسي الأقوى في مصر ، الإخوان هم أصحاب المعارضة الأقوى ، أصحاب الكلمة الأقوى ، أصحاب الصوت الأعلى في الشارع السياسي المصري . .<br />أصحاب أكبر كتلة برلمانية معارضة رغم التزويير ومحاصرة القرى لمنع وصول الناخبين . .<br />وقد جاءت صحيفة ( آفاق عربية ) هذا الأسبوع لكي تكشف زيف هذه التصريحات التي تفسر خطأ وغباء واستهبالا وعبطا من بعض ( الحاقدين على الإخوان )<br />2- الحرية هي التوحيد . .<br />ولا يقبل أحد أن يعيش عبدا ، في مثل تلك الظروف الذليلة . .<br />الحرية هي التوحيد . . ومن أجل الحرية يعمل الإخوان . . ومن أجل الحرية يعتقل الإخوان ، ومن أجل الحرية يشرد الإخوان . . لإن الإخوان هم جند الله وسيف الله المسلسول .<br />3- يمكن أن نقبل هذا الكلام إذا صدر من أحد قيادات الحركة السلفية في مصر ، فهم يعتقدون أن الإنتخابات حرام والديموقراطية كفر !!!!<br />أما أن يصدر مثل هذا الكلام من فم مرشد الإخوان فهو شيء يجب معرفة كذبه فورا . .<br />حتى أنك تجد الأباء يحذرون أبنائهم قبل دخول الجامعة ( إياك يواد تمشي مع التيار الإسلامي !! بلا إخوان بلا مظاهرات !! عايزين يا بني نعيش مستورين ونموت مستورين !! )<br />يعني من الآخر بلاش تخلف عقلي .<br />4- لا أميل إلى نظرية المؤامرة في تفسير كل شيء لكن !!!<br />لكن يجب ألا ننسى دور أمن الدولة المصري ، والذي يحاول بشتى الطرق والوسائل ( الغلوشة ) على الإخوان وتكبيل حركتهم وتقدمهم . .<br />ويجب ألا ننسى أيضا أن رسالة بريدية مماثلة كان يتم تداولها منذ سنتين أو3 وكانت تتهم عمرو خالد بالزنا و عائض القرني بالشذوذ الجنسي مع أحد الأطفال !!!<br />وطبعا كان الأمن المصري هو المحرك والمصدر لمثل هذا التحشيشات !!<br />5- ما معنى ( ولي الأمر ) ؟!<br />يعني نسمع ونطيع له . .أكيد . .<br />لكن عندما يتعلق الأمر بما يغضب الله ، وبما يتصادم مع العقيدة والفقه فلا سمع ولا طاعة . .<br />عندما يتعلق الأمر بإفقار الشعب ، وتجوعيه وقتله ، فلا سمع ولا طاعة . .<br />وهذا هو ما قصده مرشد الإخوان إذا ثبتت صحة هذا التصريح .<br />الإخوان سيظلوا هم الفصيل السياسي الأهم في الحياة المصرية . .<br />الإخوان سيظلون هم أصحاب الصوت الأعلى<br />الإخوان سيظلون هم الحركة الإسلامية الأكثر اعتدالا ونبذا للعنف والأكثر معارضة في نفس الوقت . .<br />لا نريد أن ننجر للعنف كما فعل أغبياء الحركة السلفية وأغبياء الحركة الجهادية . . الذين اعترفوا بخطأهم بعد ذلك !!!<br />وكفانا فبركة وتفسيرا للتصريحات على مزاجنا الخاص !!<br />6- من حق كل فرد في الإخوان أن يقول رأيه بحرية ، وأن يصطدم مع من يشاء حتى لو كان المرشد . .<br />ومن يقول بغير ذلك فأنا أطلب منه أن ينضم للإخوان لكي يعلم بنفسه . . وإلا فليكف الكاذبون عن الثرثرة النسوانية !!!"
