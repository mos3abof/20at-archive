[[comments]]
order = 12
subject = "السلام عليكم"
text = "السلام عليكم ورحمه وهدى من اللهعلى ما اعتقد ان معظم اللى بتكلم ميعرفوش حاجه عن الاخوان .والاخ اللى بيتكلم عن التغير زى اللى بيحصل فى فى الغرب .اولا احب اقوله ان التغير ده مش عشان يطبقوا شرع الله ولما تعرف ممكن يحصل ايه لما يحصل تغير سريع فى الدستور من اجل الحكم بشرع الله من غير الدوله ماتكون مجهزه لذلك يعنى اول مايطبق شرع الله اول ناس هيقوموا بثوره من اجل الدستور القديم هيكونوا الشعب يعنى هيعم الفساد اكتر وهتدخل القوى العظمى الممثله فى امريكا اكتر من الان"
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

[[comments]]
order = 13
subject = "انسى يا عمرو"
text = "خلونا نبص بصة على الحوار الدائر علشان نعرف نا مافيش اي فايدة فينا ..<br />الاخوان متحمسين للمرشد و خلاص .. الناصريين بيشتموا في الاخوان .. يساريين مش طايقين يسمعوا سيرة المرشد أصلا .. ليبراليين عمالين يطبلوا في الزيطة ..<br />لما نبقى نعرف نتحاور و نتكلم زي بقية الناس في الدنيا يبقى نقول تغيير و ديموقراطية .. لكن طول ما احنا كده ..يبقى مافيش أحسن من اللي احنا فيه و احمدوا ربنا ."
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

[[comments]]
order = 14
subject = "قومية مين و يسارية مين يا عم..!!"
text = "معلش... الاخ الى كاتب الموضوع ده ..بيتهيألى كده و الله اعلم ... ولا بلاش !!<br />المهم صاحبنا ده الى كتب الموضوع و يتكلم عن انسحاب الاخوان لصالح قوى اليسار و القومية<br />احب اوضحلو شوية حاجات<br />اولها هى فين من الاصل قوى اليسار و القومية الى بيتكلم عليها ؟!<br />بعلش بتوع اليسار دول مش فالحين غير فى الطنطنة و التهليل و التسبيح بحمد اليسارية و الماركسية...او مغازلة و مسح جوخها عن طريق مهاجمة الاخوان و التطاول عليهم نظير شوية الفكه الى بترميهم الحكومة ليهم آخر كل سنة ...و اسألو رفعت السعيد<br />لكن انك تشوف حاجة من الكلام ده فى الواقع او بين الناس متلاقيش...<br />الاخوة بتوع القومية و بتوع اليسار وجعو دماغنا بحقوق الفقير فى العيش و الهجوم على رأس المال بسبب و بدون سبب...<br />و لكن انك تلاقى مشروع علاجى واحد عملينو بتوع حزب التجمع مثلاً ماتلاقيش... ولا تقديم مساعدات لفقراء ولا لغلابة ماتلاقيش ...ولا دفاع عن حقوق العمال الى بيتسرق شقاهم عينى عينك على مدار الساعةمتلاقيش..!!<br />وفى الآخر يجى واحد يتكلم عن تصريح قاله فضيلة المرشد الى تاريخه و تاريخ جماعة الاخوان واضح زى الشمس للكل....و التصريح ده زيه زى اى وجهة نظر ممكن تكون موائمة او غير موائمة \" و على فكرة مافيش وجهة نظر صح و وجهة نظر غلط وجهة النظر توصف بالموائمة او عدم الموائمة \" ...<br />يا جماعة الى عايز و النبى يساعد فى اصلاح البلد دى يمد اديه و يساعد فى اننا نلحقها قبل ماتنهار و الى مش عايز يكفينا شره و شر كلامه و يسكت<br />زى ما النبى عليه الصلاة و السلام قال \"\" من كان يؤمن بالله و اليوم الآخر فليقل خيراً او ليصمت \"..<br />و الى عايز يقدم النصيحة بصورة محترمة و لوجه الله مش علشان يكتب كلمتين فى جريدة ولا فى موقع نت يتمنظر بيهم على مخاليق ربنا ولا يطلع الى جواه من مكنون الغل و الحقد اهلاً و سهلاً بيه اخ منا و لكنه مش فينا و لكنه اخ نحترمه و نحبه فى الله..<br />و على فكرة انا من الاخوان و بدفع اشتراك شهرى علشان يتصرف على المشاريع الى جماعة الاخوان بتقدمها للناس فى مصر او بتبعتها للاخوان الى هما حماس فى فلسطين يواجهو بيها اليهود او بتتصرف على اسر الشهداءو المعتقلين...<br />و ربنا يهدى الجميع"
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

[[comments]]
order = 15
subject = "و فيها ايه يعنى...!!"
text = "معلش نسيت اكمل حاجة صغيرة و هى<br />و فيها ايه لما بعض شباب الاخوان يرفضو ولا يعترضو على تصريح لفضيلة المرشد<br />هو العالم فاكرة ان الاخوان دول مبخرتيه للقيادة بتاعتهم...!!<br />لا ...فى جوه الاخوان ناس بتعترض و بتقول ..لأ<br />و بيتسمع ليها و اقتنعت اقتنعت و مقتنعتش ...احنا فى بينا كأخوان قواعد و تقاليد و شورى<br />و لو اتفقنا على حاجة و الاغلبية وافقت عليها ...اول ناس ممكن تسارع فى التنفيذ هما الى بيكونى معترضين<br />و الكلام ده حصل فى امور كتير جوه الاخوان شهدت اعتراضات من بعض الاخوان و لكن اول ناس كانت بتسارع فى التنفيذ كانو المعترضين..و كل واحد حسب فهمه و قربه من الفكرة و من روح الاسلام..."
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

