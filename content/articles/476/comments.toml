[[comments]]
order = 8
subject = "لا للتغيير بالعنف"
text = "من المستنتج أمامنا على الساحة العربية و العالمية أن التغيير بالعنف لا يأتي بنتيجة ..!!<br />و ذلك رد على موضوع كرواتيا و المستضعفين و الحوار الميت ده ..!!<br />و أظن ان ما يحدث في العراق الآن من عمليات خطف سياسية و إرهابية بل وعمليات خطف إجرامية من أجل المال هو خير نتيجة واضحة للتغيير بالقوة ..!!<br />و ما حدث في تركيا و أفغانستان سابقا قبل الغزو و إيران و غيرهم من رغبة في تطبيق حكم الإسلام بالقوة أو فلنقل فجأة ... يشهد عليه الواقع الحالي من مأساة حقيقية ..<br />zaid_s86@hotmail.com"
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

[[comments]]
order = 9
subject = "z.o.z.a"
text = "أكيد لابد من طاعة ولي الأمر مهما كان مالم يظهر كفرا بواحا و لم ينكر معلوما من الدين بالضرورة<br />و هو ده الللى احنا عرافينه .. بعيدا عن فساد الحاكم و الحكومة و البلد بحالها .. و كيفما تكونوا يول عليكم .<br />و بالتاي فإن الكلام ده طبيعي بعيدا عن الرغبة في الإصلاح الديمقراطي و السياسي و قانون الطوارئ.<br />فهمتوا بأة الراجل يقصد ايه..؟!<br />و بالنسبة \"للهبل\" اللي نازلين شتيمة ف بعض ع الفاضي و المليان و في الي يسوى و الللي ميسواش زي وائل مش عارف ايه ده اللى نازل شتيمة في عمرو خالد و القرضاوي و غيرهم .. و في الإخوان عامة .. ياريت يبطلوا عبط و يشتغلوا أحسن عشان نبني الأمة ..يا \"أخخخي\" .. معايا...؟!<br />و بالنسبة لشتيمة الشيوخ افكره الفقيه الكبير اللى لسه عارف ازاي يتوضا إن لحم العلماء مر .. و معلش عشان كلامي بيلسع ..!<br />شكرا جدا<br />zaid_s86@hotmail.com"
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

