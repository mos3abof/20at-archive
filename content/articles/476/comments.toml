subject = "ماشى يا شباب"
text = "انا بصراحة موش بالع الكلام ده و التعلقيات كله تعبر عن فراغ ادمغة اشباب و افتقادهم لكيفية الحوار الجيد و البناء و انا شخصيا موش هقدر احكم على صحة التعليقات دى ....لكن انا بحب عصام العريان و مقتنع بيه لمنصب مسئول اعلامى للجماعة مثلا ...زى مامون الهضيبى الله يرحمه ايام ما كان متحدث رسمى ...كان جامد جدا"
