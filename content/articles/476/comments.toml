subject = "المرشد و لا لمبارك"
text = "تصريح المرشد هو التصريح الخطأ في الوقت الخطا...<br />اتمنى ان يرجع فضيلة المرشد عن تصريحه و اعتقد ان هذا ليس رأي الاغلبية في الاخوان و اكد ذلك عصام العريان<br />و يجب على الاخوان ان يكون لهم دور اكبر في الحملة ضد مبارك لاني اعتقد ان نجاح الحملة يعتمد على مشاركة الاخوان بصفتهم اكبر قوى شعبية و بقية التيار الاسلامي"
