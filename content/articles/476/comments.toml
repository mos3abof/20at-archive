[[comments]]
order = 30
subject = "بسم الله"
text = "تمام، التدخل الذى تتحدث عنه (إن كان يرقى إلى هذا المستوى فى حالة مصر) مرفوض أيضا، ليس لأنه تدخّل (فالتفاعل بين الجيران و أهل اللغة و العقيدة الواحدة.. مسألة طبيعية)، بل لأنه فى أحيان كثيرة يأتى من فهم سقيم للدين، أبرز ما يعيبه أنّ أهله لا يتقبلون اختلاف الرأى وتباين آراء علماء الدين فى كثير من الأمور الفرعية.<br />فى هذا الشأن يجب ألا ننسى أن مصر الأزهر -كنانة الله فى أرضه- ليست بحاجة إلى من يعلّمها دينها.<br />فالدين عندنا و صيانته و الدفاع عن بلادنا تحت رايته واضح فى تاريخنا حديثا و قديما. فمن أفات هذا الزمان أن يستغرب بعض الناس ذلك و يقاوموه على الرغم من أنه سنّة اللى الماضية التى ينعدم النصر عند مخالفتها.<br />ربنا يهدينا للحق جميعا."
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

