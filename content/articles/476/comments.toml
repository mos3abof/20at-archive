subject = "برغم تفاهتك يا وائل عباس"
text = "انت واللي كتب التعليق اعلاه ولو اني متاكد انكما نفس الشخص الغبي<br />سؤال بسيط<br />انت صدعت راسنا طول الوقت يا وائل ان الموقع ده بتاع الاخوان ،،<br />طيب دلوقت يا غتت:<br />إيه رأيك؟<br />هو لو الموقع بتاع الاخوان كانوا حيكتبوا فيه المقال ده ؟<br />طبعا حتقول تقيا<br />وحتقول عني اخوان<br />وانا حاقولك طظ فيك"
