subject = "راي مثير للاهتمام :"
text = "راي مثير للاهتمام :<br />\"هل التيار المعتدل يكبح ثورة الشعوب المقهورة؟!.. إن التيار المعتدل يأخذ خيرة الشباب ثم يعلمهم أن يصبروا على الحكام. بحجة عدم جدوى التصدي لهم. فيتم تسكين الشعب باسم الدين. ومن ثم لا أمل في انتفاضة شعبية كما حدث مع شعوب كافرة في كرواتيا\".<br />وتذكر المداخلة المنشورة على ساحة الحوار: \"بذلك يكون دور التيار المعتدل هو تدعيم النظام القائم من حيث لا يدري. ويسمح النظام له ببعض ما يسمى – بالشغب السياسي - مثل المؤتمرات والمسيرات وإحراز بعض التقدم في الانتخابات. ليجمل شكل النظام. وليكون هذا التيار قادراً على حشد الثوار ثم تخديرهم بحجة الدين. فيتم تجفيف منابع الثورة بأيدي الإسلاميين المعتدلين\"."
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

