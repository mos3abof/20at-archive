subject = "بسم الله"
text = "السادة المعلّقون ، واضح وضوح الشمس ان الباشا صاحب المقال من الجريدة السالف ذكرها ، ينتظر أى كلمة ليفسّرها كما يريد ، بعيدا عن باقى كلام و أفعال الرجل.<br />من الطبيعى و البديهى لأى مصرى وطنى خالى من عرقى الحماقة و الخيانة، ان يعتبر التدخل الأجنبى فى بلادنا شرا محضا لا يمكن توقع الإصلاح من خلاله. و ما أسهل ان يزايد كاتب بكلمات طنانة و هو لا يقف وراءه أى ثقل بشرى من شعبنا.<br />أولا أشكر القائمين على هذا الموقع على مجهوداتهم التى تجاوزت حد \"كلام المصاطب\".<br />ثانيا: أرجو من إدارة الموقع تغيير نظام المداخلات عندما يتيسّر لهم ذلك : بحيث يشترك الإنسان من خلال UserName & Password و يكون هناك مسئولية بقدر الإمكان لكل كاتب عن ما يكتب ، لا يصح ان يسمح بإرسال شتائم أو عدة صفحات فى تعليق واحد تحت شعار \"الحرية\""
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

