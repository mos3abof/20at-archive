subject = "وائل عباس"
text = "قال عمر:<br />أيها الناس ! إنى قد وليت عليكم ولست بخيركم ، فإن أحسنت فأعينونى ، وإن أسأت فقومونى \" ، وقال رجل لعمر : \" اتق الله يا عمر ! \" فنبهه بعض الحاضرين بأنه لا يجوز أن يقول ذلك للخليفة ، لكن عمر الحاكم هو الذى يشجع الأمة على مراقبته ، فقال : \" لا خير فيكم إن لم تقولوها ، ولا خير فينا إن لم نسمعها - وفي رواية اخرى : ألا، فلتقولوها. لا خير فيكم ان لم تقولوها، ولا خير فينا ان لم نسمعها !!!<br />ويحكى ان خولة بنت ثعلبة خاطبت في ذات يوم عمر بن الخطاب –رضي الله عنه- عندما كان خارجاً من المسجد وكان معه الجارود العبدي، فسلم عليها عمر فردت عليه، وقالت: \" هيا يا عمر، عهدتك وأنت تسمى عميراً في سوق عكاظ ترعى الضأن بعصاك، فلم تذهب الأيام حتى سميت عمر، ثم لم تذهب الأيام حتى سميت أمير المؤمنين، فاتق الله في الرعية، واعلم أنه من خاف الوعيد قرب عليه البعيد، ومن خاف الموت خشي الفوت\"، فقال الجارود: قد أكثرت على أمير المؤمنين أيتها المرأة، فقال عمر: دعها<br />و حين حاول ابن الخطاب تحديد المهور، وقفت امرأة وذكّرته بالآية الكريمة: (وإن آتيتم إحداهنّ قنطاراً فلا تأخذوا منه شيئً) فأقتنع عمر برأيها وقال قولته الشهيرة : اخطأ عمر واصابت امراة !!!<br />ويحكى ان عمير بن سعد كان عند عمر بن الخطاب جاءه من حمص اللتي عمله عليهاوكان في حالة يرثى لها فقال له عمر : بئس المسلمون خرجت من عندهم، فقال له عمير‏:‏ اتق الله يا عمر فقد نهاك الله عن الغيبة، وقد رأيتهم يصلون صلاة الغداة‏.<br />ويحكى عن عمر بن عبد العزيز انه استدعى مهاجرًا أحد الوزراء، وقال: كن بجانبي، فإذا رأيتَني ظلمت مسلمًا أو انتهكت عرضاً، أو شتمت مؤمناً، فخذ بتلابيب ثوبي وقل: اتق الله يا عمر. فكان وزيره مهاجر يهزه دائمًا، ويقول: اتق الله يا عمر.<br />و قال سفيان الثوري رحمه الله : \" دخلت على أبي جعفر المنصور بمنىً - الحاكم هو الحاكم في كل العصور ، كبار العلماء ماتوا في السجن كأبي حنيفة ، الحاكم هو الحاكم - فقال لسفيان : ارفع إلينا حاجتك ، فقلت له : اتق الله ، فقد ملأت الأرض ظلماً وجوراً ، قال : فطأطأ رأسه ، ثم رفعه ، وقال : ارفع إلينا حاجتك ، فقلت : إنما أنزلت هذه المنزلة بسيوف المهاجرين والأنصار ، وأبناؤهم يموتون جوعاً ، فاتقِ الله ، وأوصل إليهم حقوقهم ! قال : فطأطأ رأسه ، ثم رفعه ، وقال : ارفع إلينا حاجتك ، فقلت : حج عمر بن الخطاب رضي الله عنه فقال لخازنه : كم أنفقت ؟ خليفة المسلمين حج ، قال لخادمه : كم أنفقت ؟ قال : بضعة عشر درهماً ، وأرى هاهنا أموالاً لا تطيقها الجبال \".<br />ودخل أعرابي على سليمان بن عبد الملك فقال : \" إنك قد اكتفيت رجالاً ابتاعوا دنياك بدينهم فلا تأمنهم على ما ائتمنك الله عليه ، فإنك مسؤول عما اجترحته ، فلا تصلح دنياهم بفساد آخرتك ، فقال له : سليمان لقد سللت لسانك ، فقال له : هو لك لا عليك<br />وقال الأصمعي : \" دخل عطاء بن أبي رباح على عبد الملك بن مروان وهو جالس على سريره ، وحواليه الأشراف من كل بطن ، وذلك بمكة المكرمة في وقت حجه بخلافته ، فلما نظر إليه قام إليه ، وأجلسه معه على السرير ، وقعد بين يديه ، وقال له : يا أبا محمد ما حاجتك ؟ فقال : يا أمير المؤمنين اتق الله في حرم الله ، وحرم رسوله ، فتعاهده بالعمارة ، واتق الله في أولاد المهاجرين والأنصار ، فإنك بهم جلست هذا المجلس ، وهم الذين فتحوا هذه البلاد ، واتق الله في أهل الثغور - الحدود - فإنهم حصن المسلمين ، وتفقد أمور المسلمين ، فإنك وحدك المسؤول عنهم ، واتق وحدك مَن على بابك ، فلا تغفل عنهم ، ولا تغلق بابك دونهم ، فقال له : أفعل إن شاء الله ، ثم نهض ، وقام ، فقبض عليه عبد الملك ، فقال : يا أبا محمد إنك سألتنا حاجة لغيرك ، وقد قضيناها ، فما حاجتك ؟ قال : مالي إلى مخلوق حاجة ، ثم خرج ، فقال عبد الملك : هذا والله هو الشرف<br />كان ما سبق مقتطفات من مقال قديم لي بعنوان \"اللذي قال لرسول الله اتق الله يا محمد!\"<br />فاين مهدي عاكف من هؤلاء الشرفاء الشجعان!!!"
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

