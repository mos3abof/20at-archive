subject = "اسلاميو مصر مع الديكتاتورية و ضد التغيير..."
text = "نقلا من مدونة طق حنك :<br />http://digressing.blogspot.com<br />يمكن لكل من تابع هذه المدونة أن يحصل على فكرة ما عن الزخم المتزايد الذي تتلقاه دعوات التغيير في مصر و عن أن تلك الرغبة تجتمع عليها معظم التيارات ا السياسية تقريبا....<br />( الكتابة الاخيرة عن هذا الموضوع هنا )<br />و لكن....<br />جماعة الاخوان المسلمين الذين كانوا مؤيدين لحملة التغيير و مشاركين نشطين فيها حيث انضموا مبكرا الى الحملة المصرية من أجل التغيير ، كما صرحوا في مؤتمر صحفي مع الناصريين أنهم سيجمعون مليون توقيع للمطالبة بالبلا بلا بلا - و قلت أنني أتوقع أنها مجرد فرقعة دعائية- و كانت بالفعل فرقعة دعائية تلاها انسحاب غير معلن من الحركة المصرية للتغيير .... و تلى ذلك تصريحات مميزة من المرشد العام للاخوان المسلمين لجريدة (المصري اليوم) أن \"الرئيس مبارك هو ولي الأمر وطاعته واجبة\"، وأن \"التقارير التي تقول إن النظام يضطهد الإخوان هي تقارير خبيثة وأن الإخوان هم أبناء النظام\"<br />ياللروعة...<br />بضعة شهور و انقلبت اللهجة....<br />لا أجد أبلغ مما قاله رئيس تحرير المصري اليوم :<br />\" انزعج الناس، لما قاله فضيلة المرشد العام للإخوان المسلمين، ونشرته المصري اليوم في عدد أول يناير، واشد ما ازعج الناس قول المرشد: الرئيس مبارك ولي الأمر وطاعته واجبة، ومبرر الانزعاج مفهوم، فالمرشد يتحدث بفقه القرون الوسطي، بفقه الخضوع لولاية التغلب والقهر، ولم يستطع المرشد أن يرتقي إلي مستوي فقه الدولة الحديثة، ولم يلامس فقه الحرية، وهو باب غائب ـ قهراً أو قسرا ـ عن أبواب الفقه الإسلامي، الذي كتبه الفقهاء تحت اجنحة السلاطين. بالنسبة لي، لم يكن هذا هو اكثر ما يثير الانزعاج، فالأخطر هو رفض المرشد تعديل الدستور او تغييره، والرجل ينطلق من مخاوف، تدور حول فكرة مؤداها: إن مصر تتعرض لهجمة غربية امريكية عاتية، وربما تنجح هذه الهجمة في التأثير علي صياغة أي دستور جديد فيؤدي ذلك إلي إلغاء مادة أن دين الدولة هو الإسلام وأن الشريعة الإسلامية هي المصدر الرئيسي للتشريع . لهذا فإن الإخوان يرفضون تعديل الدستور، وهم بذلك يقفون مع النظام في خندق واحد، وإن تعددت واختلفت الأسباب والأغراض.<br />وهذه نقطة اعوجاج في فهم الإخوان، وهي ثابت من ثوابت الاعوجاج عندهم، فميراثهم في المجال الدستوري كان دائما مضادا لفكرة الحرية، وكانوا دائما منذ ثلاثينيات القرن الماضي، يختارون الوقوف ضد الحرية وضد الدستور، بزعم ان في ذلك مصلحة للدين وللعقيدة، وهذا الخط الثابت في فكرة وممارسة الإخوان أضرهم بالأمس، مثلما يضرهم اليوم. وهذا الخط الثابت كان ومازال واحدا من عوامل الإعاقة، التي تحول دون استيعاب الإخوان للحلم الوطني والقومي، وحال ويحول دون استيعاب واندماج الإخوان في المجري الرئيسي للوطنية المصرية.<br />وأهمس في أذن المرشد: الدستور الحالي ينص علي ان الإسلام دين الدولة، وأن الشريعة مصدر رئيسي للتشريع، ورغم هذا فإن الدولة لا هي تتقيد بالإسلام، ولا هي تلتزم بالحريات والديمقراطية، وفي ظل هذا الدستور يتعطل نمو البلد، وتتعطل طاقاتها، ويقع الجميع تحت سيف العسف والخسف. الدولة لا تتقيد إلا بإرادة الحاكم الفرد، وما الإسلام إلا ديكور في المواسم الدينية، وما الديمقراطية إلا ديكور نضحك به علي العالم الخارجي .\"<br />هل هذا كافي...؟<br />لا فقد زاد فضيلة السيد المرشد بتصريحات للزمان العراقية : \"حينما يتم انتخاب مجلس الشعب المعني بتعديل الدستور بطريقة ديمقراطية سوف يسهل تعديل الدستور علي ارضية سليمة خاصة تعديل المادة 76 الخاصة بالاستفتاء علي اختيار رئيس الجمهورية الي االانتخاب الحر المباشر بين اكثر من مرشح علي الا تزيد مدة ولايته علي دورتين خلافا للمادة 77مع تحديد صلاحياته واختصاصاته.\"<br />هل خرجتم بلب ما قاله ؟<br />نعم... الاصلاح ...احم... ياتي بعد أن يصبح الرئيس رئيسا لفترة أخرى ، فيتفضل علينا باصلاحات جديدة.... القوة السياسية الوحيدة التي تؤيد الحزب الوطني في رغبته في تأجيل حديث الاصلاح الآن حتى يتم تجاوز \"دوشة \" انتخابات 2005 هي الاسلاميين...<br />هل يشير ما قاله الى تركيزه على انتخابات مجلس الشعب؟<br />يتملق النظام بهدف السماح له بزيادة عدد نوابه في مجلس الشعب؟<br />يتملق النظام لكي يدرجه في قائمة من يحاورهم النظام في تمثيلية فكاهية اسمها الحوار مع الأحزاب ؟<br />لا تقل لي من فضلك أنه يعتقد فعلا بما قاله ؟<br />لأنه غير موقفه 180 درجة من خطاب الجماعة السابق و خطب مسؤوليها العنترية... و لأن جماعته تعرف جيدا كيق تجري الانتخابات في مصر....<br />و لأنه يكذب و يعرف أنه يكذب حينما يقول أن النظام لا يضطهد الجماعة و أنهم أصحاب و حبايب...<br />حسنا لقد قدم للنظام جانبه من الصفقة و من المفروض أن يرد له النظام الهدية بنوع ما من التسهيلات...<br />أتذكر صديقا لي عند<br />Read the rest of this comment..."
archived = "2005-02-26"
capture_url = "https://web.archive.org/web/20050226090750/http://www.20at.com:80/article.php?sid=879"

