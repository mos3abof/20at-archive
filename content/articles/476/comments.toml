text = "لا تجادل . .<br />لا تجادل .. أتفهم أنت في علم الرجال أم كنت مرشداً مناضل<br />لا تجادل .. نعم هو ولينا واميرنا وحبيبنا وفي الاخلاق فاضل<br />لا تجادل .. ومن قال أنه يضطهدنا كاذب منافق وبالحق جاهل<br />لا تجادل .. هو أمامنا فكن خلفه ساجدا وزاحم صف الأوائل<br />لا تجادل .. وان نادى للصلاة فلبّي ولو رفع الأذآن من المحافل<br />لا تجادل .. أنسيت فضله عليك,أنسيت طعم هاتيك الهراول<br />لا تجادل .. فالمعتقلات خلوته بعشّاقه والمشانق مهر الأرامل<br />لا تجادل .. الشرّ منا اليه صاعد والخير منه الينا نازل<br />لا تجادل .. وقم مصلياً بآية الكرسي فبها تتم النوافل<br />لا تجادل .. وطف ببيته محرماً من مكتب العاكف ذي الشمائل<br />لا تجادل .. وعلى اعتابه قل لبيك اغفر لرجال بحبك حوامل<br />سفير الإسلام"
