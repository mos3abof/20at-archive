[[comments]]
order = 1
subject = "!!"
author = "virus"
posted = "2006-05-21"
text = "الموضوع جميل جميل جميل ..<br />وتقديمك ليه تحفة بمعنى الكلمة ..<br />اسلوب راقي وحد فاهم وعارف يحلل ازاي .. مزج اكثر من رائع بين الفيلم والتحليل ..<br />بجد بجد مقريتش وصف وتحليل للفيلم احلى من ده ..<br />اكثر من هايل بجد .. ومش عارفة اقول ايه اكتر من كدة<br />ملحوظة الموضوع مش طويل خالص بالعكس ده حجمه الطبيعي ويادوبك كمان ع الفيلم .. مرة تانية تحفة واكثر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132416/http://www.20at.com/article2.php?sid=833"

