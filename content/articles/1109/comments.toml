[[comments]]
order = 3
subject = "حلو قوي"
author = "مفروسة"
posted = "2006-05-22"
text = "بجد برافو عليكم انتوا هايلين وتقديمكم للموضوعات وخصوصا الافلام والشخصيات رائع فعلا، الفيلم انا كمان سمعت عنه من اصحابي وشفت الافيش بتاعه في السينما من زمان لكن أكيد بعد اللي قريته من شريف ومعاذ هاروحه<br />برافو يا جماعة انتوا هايلين بصراحة احلى موضوع قريته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132416/http://www.20at.com/article2.php?sid=833"

[[comments]]
order = 4
subject = "لكاتبي التحليل فائق الاحترام"
author = "عابر سبيل"
posted = "2006-05-23"
text = "بكل صراحة لم استطيع هذه المرة أن اكون فقط مجرد قارئ دون أن اشارك بالرأي، فالموضوع بالفعل موضوع شيق يخاطب الحس العقلي والفني والحس السياسي لدى القارئ، لذا اود أن اهنئ كاتبي المقال واقدم لهما فائق الاحترام والتقدير."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132416/http://www.20at.com/article2.php?sid=833"
