subject = "تعددت الاسباب والموت واحد"
author = "mego_mego"
posted = "2006-11-27"
text = "السادة الافاضل :<br />عن تجربة جادة مع هذا المرض حيث اصيب به والدى ونقضى الان معظم الوقت داخل اروقة المستشفيات ومعامل التحليل سمعنا كلنا ببرنامج البيت بيتك عن اختراع دواء مصرى لعلاج هذا الفيروس اللعين وكعادة السادة الاطباء كان الدكتور سراج زكريا احدكبار اطباء الكبد بمصر ضيف الحلقة مع الدكتور مخترع العقار وعلى ما اتذكر انه يمت بصلة قرابه للسيدالرئيس جمال عبد الناصر رحمه الله بعد مشاهدة هذه الحلقة كانت الفرحة طاغية على سبعة مليون مريض معتقدين ان الله من عليهم بالشفاء العاجل ولكن كالعاده اختفى الموضوع بقدرة الله العلى القدير ولم نعد نسمع شىء عن العقار او مخترعه رغم النداء العاجدل الذى توجه به الاستاذ محمودسعد الى الوزير حاتم الجبلى<br />ياعم تموت بفيروس سى تموت فى عبارة السلام تموت فى قطار المهم انك تموت وخلاص<br />حسبى الله ونعم الوكيل<br />http://mego_mego.blogspot.com/"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216231743/http://masr.20at.com:80/article.php?sid=1212"

