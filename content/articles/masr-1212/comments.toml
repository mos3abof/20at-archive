[[comments]]
order = 1
subject = "يااااهـ هـ هـ ... صح النوم"
author = "إبن بهية"
posted = "2006-11-27"
text = "السيد مجدي مهنا كتب وصيته خلاص ... الله يرحمه .. يبقى بلغه خبر إنهم خلاص راح يموتوه موتة حكوميه.. يموتوه بالحرمان من الامتيازات ، فراح كاتب الوصية المتأخرة أوي دي .. لسه فاكر ياسي مهنا ؟؟؟ طبعا الكلام مش جديد .. عارفين الكلام ده من عشرين سنة .. عارفين إن الواطي بتاع إصلاحات بقيقي وبس .. لما الواطي حسني مبارك جدد لنفسه بنفسه وطلعت أيامها الأغاني الواطية من عينة يا ابو أول طلعه جويه جابت لينا الحرية والكوسة والمهلبية ووووو وأخواتها من الأغاني اللي عمرها ما كانت بني آدم ولا عاجباني ... طيب ما هو أي صول كان قائد ساعتها كان حينفذ المهام المسندة إليه .. إيه اللي عمله زيادة الواطي ده ؟؟؟ بعدما قبل يا عين امه بصعوبة يتحمل مسئولية البلد في 1981م وشرط علينا انه يرحل بعد قضاء مدة واحده بس تكون البلد فيها هديت واستقرت .. جاء موعد تحقيق شرطه علينا أو وعده لينا ولقينا فخفخامة جلالة الواطي مبلط وطظ في الشعب .. قاعد على قلبكم ... من يومها يا سي مهنا واحنا عارفين إنه كذاب إبن كذابين وواطي .. ومن يومها عرفنا كذبه .. يا راجل ده بقى يقول كلام وعكسه في الخطاب اللي وراه .. زي أنيس منصور تمام لما كان بيكتب صفحة كاملة في أخبار اليوم زمان .. كان يسرح بيك السرحة اللي هي وبعد كام شهر وممكن أسابيع بس ينسى هو كتب إيه ويروح كاتب عكس اللي قاله بنفسه .. الكذاب نساي كما يقول المثل ..<br />إصلاح إيه وبطيخ إيه بس ؟؟؟ بالله عليكم فيه عاقل صدق كلام الواطي ده ؟؟؟ موضوع الإصلاح اللي فلقونا بيه ده مجرد حبة فرفشة عن الشعب وخلاص .. هو فيه حرامي بيرجع اللي اغتصبه ؟؟؟ ما هو لو فيه قاطع طريق يرجع اللي خطفه يبقى حاجه من اتنين ، إما أنه اتجنن ، أو حصلت معاه معجزة إلهية نبت له ضمير من العدم وفي الحالة دي يبقى صحوة الضمير تدف<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216231743/http://masr.20at.com:80/article.php?sid=1212"

[[comments]]
order = 2
subject = "لقد اسمعت لو ناديت حيا-- ولكن لاحياة لمن تنادى"
author = "مصرى من معدومى الدخل"
posted = "2006-11-27"
text = "ده على كده تعداد مصر سنة2060هيقل عن دلوقتى مش هيذيد لان اللى بيموتوا اكثر من اللى بيتولدوا انا عرفت دلوقت ايه سر حملة تعداد السكان اللى عملينها فى شهر ديسمبر دى اكيد معموله لاحصاء الوفيات مش المواليد --- انا باتكلم جد والله --- فاكرين اعلانات تنظيم الاسره اللى كانت ماليه البلد وحسنين ومحمدين --وانظر حولك -- وحاجه ببلاش كده --كل ده اختفى مره واحده وماعدش فيه ولا اعلان واحد فى التلفزيون زى مايكون الحكومه نجحت (وبالمناسبه دى اول مره تنجح ) فى خطه معينه رسمتها للشعب الا وهى زيادة عدد الوفيات حتى توازى عدد المواليد وبالتالى لايشكل عددالسكان والانفجار السكانى صداع فى راس الطبقه الحاكمه --- انا خايف والله ليكون موضوع يوسف والى والمبيدات المسرطنه كان بتعليمات عليا ؟ والا الراجل لغاية دلوقت قاعد فى بيته معزز مكرم رغم ان محكمة الجنايات طلبتوه اكثر من مره ورفض الانصياع بحجة الحصانه البرلمانيه ! طب دلوقت لافى حصانه ولا يحزنون ماسمعناش يعنى ان المحكمه استجوبته او ان فى تحقيق جارى ؟ انا شامم ريحة قيادات عليا كان واخد منها الضؤ الاخضر قبل مايستورد المبيدات والا ماكنش قعد فى بيته مطمن وعارف انه فى تهمه زى دى عقوبتها فى اى بلد هى الاعدام؟انه سيناريو مترتب لهذا البلد واهل البلد فى سبات عميق----- لك الله يامصر"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216231743/http://masr.20at.com:80/article.php?sid=1212"

