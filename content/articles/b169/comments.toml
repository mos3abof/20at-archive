subject = "الشعوب الجريحة"
author = "احمد عبد الحسيب عامر"
posted = "2006-08-07"
text = "الى الشعوب العربية اريد ان اوجه لكم رسالة صغيرة كلم من الاطفال والعجائز ماتوا فى لبنان لعدم تحركم والله لو كام الامر بيدى الانسان لكان الان له كلمة اخرى تلك هى لبنان هل نسيتم لبنان نحن لا نطمع فى شى ولكن اخوانى قفوا فى وجة اولمرت وبوش والادعاءت حول شرق اوسط جديد اجلسوا وحافظو على كراسيكم حتى لا تتغير واتركوا لبنان فلسطين العراق وغيرها قادم جريحة والسلام عليكم ورحمة الله وبركاتة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125102/http://www.20at.com/article2.php?sid=169"

