[[comments]]
order = 3
subject = "أيهما أسخف؟"
author = "محمد علي"
posted = "2005-12-30"
text = "حلو أوي !! رامسفيلد يقدم الطعام للجنود الأمريكان<br />و ياترى ماذا فعل مع المسلمين و المستضعفين في فلسطين و العراق و أفغانستان و أمريكا الجنوبية غير أنه قدم لهم لحومهم مشوية بنيران الأباتشي و عصابات المخابرات الإرهابية الصليبية؟<br />لعنة الله على من ظلم من حكام العرب و المسلمين و لعنة الله على الصليبيين و الصهاينة الذين لم يكفوا عن ذبحنا من أيام دير ياسين<br />ولعنة الله على من يدافع عن هؤلاء المجرمين السفاحين<br />بالله عليكم كيف أحترم هؤلاء الأعداء و انا أعيش جرائمهم يوميا ام علي ان أسبح بحمدهم لأنهم بيض البشرة يرتدون الحلل زرق العيون و أصب لعناتي فقط على حكام العرب<br />كلهم مجرمون و لصوص و قطاع طرق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125102/http://www.20at.com/article2.php?sid=169"

[[comments]]
order = 4
subject = "نداءالى اخواني المسلمين حق وحقيقي"
author = "رباب من المغرب"
posted = "2005-12-31"
text = "بسم الله الرحمان الرحيم اقول لكم يا اخواني المسلمين دعو الجبناء يفرحون قليلا فسندترهم الى حزن عسيرانشاء الله وبعونه يطنون انهم باقون هاهنا بالارض لا فنحن تاركونها جميعاوهناك الحفل الكبير سوف يدوق شارون وجورجبوش واعوانه حلويات تقطع الامعاء وسنطعمهم من الزقوم ما يشتهون ونشربهم نخبا من ماء الحميم فلا حزن فدورنا في النصر قريب مع الله ورسوله الكريم وكتابه العزيز فنحن الفائزون انشاء الله........."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125102/http://www.20at.com/article2.php?sid=169"

