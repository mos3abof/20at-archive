subject = "قاضى"
author = "ياء"
posted = "2006-05-25"
text = "قاضى يا قاضى شد الحيل الحريه طريقا طويل<br />وسط الظلمة وسط الليل القضاة هم الدليل<br />انا اتوقع الانتصار للقضاه ضد السلطه التنفيذيه لاكن تبقى المشكله فيمن ينفذ الاحكام فالحكومه المصريه ودن من طين وودن من عجين فى احكام عادله لواطنين شرفاء لم تنفذ حتى الان رغم مرور اعوام على اصدارها<br />حمدلله على السلامه يا جى من المعتقل وحشانى الابتسامه وشك ولا القمر<br />الحريه للمعتقلين الحريه للوطن<br />بلادى بلادى لك حبى وكفاحى<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151201/http://www.20at.com/article2.php?sid=861"

[[comments]]
order = 1
subject = "هيئة قضايا الدولة"
author = "نائب الدولة"
posted = "2006-05-28"
text = "ارى ان القضاء وحده واحدة ويجب الاتحاد فيما بين الهيئات القضائية قاطبة وعلى وجه التحديد القضاه مع زنلائهم من اعضاء النيابة الادارية وقضايا الدولة وللاسف ارى ان عدد من القضاه يهاجمون زملائهم من الهيئات القضائيه الاخرى بلا مبرر وبدون اى سند قانونى متناسيين الدور القضائى الهام لكلتا الهيئتين وخصوصا هيئة قضايا الدولة الهيئة القضائية الاعرق والتى هى الامينة على الدعوى المدنيه وتنوب عن الدوله بسلطاتها الثلاث وليست نائبة عن الحكومة فالهيئة لا تخضع لسلطان احد ما كان مهما علا شأنه فلا سلطان عليها الا للقانون والشرعية ، فاعضائها مستشارون غير قابلين للعزل ولديهم من الحيدة والشرف والنزاهة ما يكفل لهم حريه الدفاع عن المال العام والشرعيه فى الدولة فكيف يأتمن الشعب هذه الهيئة على امواله وممتلكاته ولا يستامنها على الاشراف على عمليه انتخابية ؟ ويكفى انه لم يذكر اسم مستشار واحد من هيئة قضايا الدوله بزعم تزوير انتخابات كما حدث مع هيئات اخرى واقول انه لا يجب التطاول على الهيئة لانها اكبر واعرق من كل هذه الصغائر وقد قضت المحكمة الدستوريه العليا بذلك حينما قررت<br />(1) ان مصطلح\" الهيئة القضائية \"فى النظام القانونى المصرى ان هو الا اسم جنس تندرج تحته عدة انواع ،منها جهات تمسك بزمام العدالة و تنفرد على وجه الاستقلال بالفصل فى القضايا على أسس موضوعية وفقا لقواعد اجرائية تكون منصفة فى ذاتها، بما يكفل الحماية الكاملة لحقوق من يلذون بها و اخصها المحكمة الدستورية العليا و محاكم جهتى القضاء العادى و الادارى بمختلف درجاتها و منها جهات قائمة بذاتها و هى و ان لم يعهد اليها المشرع باختصاص الفصل فى القضايا الا انه اصبغ عليها صفة الهيئة القضائية تقديرا منه بأنها هي%C"
archived = "2006-11-02"
