text = "ايه اللي جاب شرم الشيخ في الموضوع!!<br />و بعدين انا أعرف اتنين محترمين عملوا شهر العسل فيها عادي..أستمتعوا بوقتهم..و لسة محترمين الحمدلله...وماليزيا فيها الحلو وفيها الوحش...اعرف اتنين تانين كانوا هناك و حكوا لي بلاوي!!<br />يعني علشان متصرفش فلوسك على الفاضي."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
order = 10
subject = "وائل عباس"
text = "اقتباس من المقال:<br />تقول نهى 19 سنة: \"أنا فكيت الحجاب 4 مرات منذ أن لبسته، بعلم وموافقة ماما وبابا. وذلك لأن القرية التي نصيف فيها تمنع نزول حمام السباحة إلا بالمايوه العادي، يعني حتى مايوه المحجبات ممنوع، وغير محدد يوم خاص للسيدات!!<br />حضرتك قريت المقال قبل ما ترد ؟؟؟<br />ولا هو اسم وائل عباس بقى بيعمل ارتيكاريا وخلاص ؟؟؟"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
order = 11
subject = "وائل عباس"
text = "اقتباسات اخرى للاخ اللي بيقرا التعليقات ويسيب المقالات:<br />ومن ناحية أخرى فقد قضينا شهر العسل في الغردقة، وهناك كل الرواد أجانب، فلا أحد يلاحظ الآخرين. كما أنني صحيح كنت أرتدي الشورت والكات، لكن كل الأجنبيات كانوا بالبكيني!!\"<br />ومثلها دينا 25 سنة، وتقول:\" خلعت الحجاب في صيف شهر العسل، وذهبت إلى شرم الشيخ لكي أستمتع بوقتي. ولكن بعد عودتي رجعت للحجاب أكثر مما كنت عليه قبل الزواج، وأصبحت أرتدي العبايات بعد ان كنت أرتدي الملابس العادية\"!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
order = 12
subject = "ياه"
text = "انا رجعت بعد غياب ياجماعه حد يقولى حمد لله على السلامه<br />المهم موضوع الحجاب ده مهم جا طبعا ولكن المفروض انه منتهى ومفيش فيه كلام يعنى هو الانسان يقدز يعيش من غير اكل ولا المسلم يبقى مسلم من غير صلاه<br />دى ناس بتدلع وبتحاول تدور على اى حجه فارغه وخلاص"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
order = 13
subject = "بلاد الله"
text = "اولا...انت أسمك هيجبلي أرتياكاريا لية..يعني بصراحة مبيمثليش حاجة اوي!!<br />ثانياالعيب مش في شرم الشيخ..العيب في الناس اللي على لسانهم الكلام..ربنا يهديهم ويعافينا..<br />المكان في حاجات تانية كتير حلوة تتعمل بلحجاب..و بالنقاب كمان...<br />و مش معقول هنسيب بلادنا للأجانب يتمتعوا بيها و يشيعواالفساد فيها وناخد جنب..المفروض منهربش و نعمل مدينة فاضلة وهمية!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
order = 14
subject = "والله غريبه"
text = "شلون تخلع حجابها وتقول هذي مرة بالعمر يعني بالاخره راح تقول لربنا انا خلعت لمده شهر حتى استمتع بوقتي شنو هذا الكلام الفارغ اذا هي ما لها نفس تلبس الحجاب الاسلامي لا تلبسه بالمره وبعدين الامراة السفور تعاقب في الاخرة سواء خلعته مرتين او ثلاث...اذا القناعه ما موجوده لا تلبس الحجاب لأنه مو موضه والا شكل...<br />البحرينيه"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
order = 15
subject = "وائل عباس"
text = "رد على المقال يا حبيبي مش عليا انا<br />لا حول ولا قوة الا بالله<br />والله يا عمنا ما انا اللي كاتبه<br />دي حاجة تجيب الضغط !!!<br />ربنا يهديك يابني وينور طريقك احسن شكلك شيش بيش خالص<br />مش مفرق بين اللي كتب المقال واللي بيعلق في حدود ما كتب في المقال ...<br />ارحمنا يا رب برحمة من عندك ..."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
order = 16
subject = "واحد لمون عند الاستاذ"
text = "و لما انت مش مقتنع بالي أتكتب في المقال..بتقتبس منه ليه و بتستدل..انا أعرف ان اللي بيفتبس من مكان و يستدل بيه..يكون مقتنع بالرأي اللي فيه..<br />و انا بعلق على تعليقك....\" مافيش حد محترم يروح يقضي شهر العسل في شرم الشيخ !!!\"<br />مسكت في شرم الشيخ و سيبت الموضوع الاساسي.. بعدين مالك مخنوق ليه في الحر دا!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
