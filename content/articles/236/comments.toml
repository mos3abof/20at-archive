subject = "واحد لمون والتاني مجنون ... دي مسرحية على فكرة"
text = "اه انا فعلا مقتنع باللي جه في المقال وعلقت على المقال واحنا هنا علشان نعلق على المقال مش علشان نعلق على بعض ...<br />فخيمتو يا ريس ؟؟؟<br />وفعلا الدنيا حر جدا ومش طالبة خنقة الله لا يسيئك ...<br />الواحد المجنون"
archived = "2004-09-26"
