text = "خلعت الحجاب علشان حمام السباحة ...أنا موش مصدق نفسي ..فيه فعلا بني آدم كدة ...<br />وبعدين اللي بتتكلم عن إن كل الموجدين كانوا أجانب وكانت الستات لابسين بكيني ...<br />معني كدة ان فستان نانسي في \"آه ونص \"يعتبر حجاب بالنسبة لبدلة رقص روبي ...<br />معنديش كلام تاني اقوله ..!!"
