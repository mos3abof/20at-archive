[[comments]]
order = 8
subject = "وائل عباس"
text = "ان شاء الله وكان لينا عمر<br />والبلد دي حالها انصلح<br />وبقى معايا فلوس اقدر افتح بيت<br />ده بعد عمر طويل طبعا<br />مش ها اتجوز غير واحدة محجبة<br />ولو ما كانتشي محجبة ها تتحجب قبل قراية القتحة<br />قولوا ان شاء الله<br />وطبعا مافيش قلع حجاب في الفرح ولا الكلام الفارغ ده<br />واحب اقول للناس المحترمين<br />مافيش حد محترم يروح يقضي شهر العسل في شرم الشيخ !!!<br />لان شرم الشيح للاسف لاهي ولا الغردقة بلاد محترمة تحترم ناس بلدنا<br />فياريت تدعولي كمان بالمرة يبقى معايا فلوس اقضي شهر العسل في ماليزيا !!!<br />اهي دولة اسلامية بتحترم المسلمين وصحابي كانوا هناك بعتولي صور لجنة من جنات الله على الارض ومش محتاج اقلع اي حاجة علشان استمتع بيها !!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
