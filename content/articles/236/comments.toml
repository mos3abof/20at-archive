[[comments]]
order = 28
subject = "قبل ما تبحث عن الحجاب يا وائل"
text = "قبل ما تعمل فيها واد حمش وحتتجوز واحدة محجبة عشان تبين لنا التزامك ، روح يا حبيبي حشم اخلاقك الأول ده انت كل ألفاظك نابية ومنحطة سواء في الجريدة الصفراء عربتايمز او شباب مصر .<br />انا فعلا ملاحظ انك بتحاول انك تظهر مؤدب شوية هنا عشان الجنس اللطيف الموجود هنا ياخد عنك فكرة كويسة بس ده مش حل .<br />وعلى فكرة في جريدة عربتايمز في واحد اسمه عطية زاهدة بيشتم بالشعراوي روح تجرأ ورد عليه يا حبيب الشعراوي ."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
order = 29
subject = "عاشقة لبنان"
text = "السلام عليكم<br />اخوتي واخواتي في الله من المؤلم جدا انه في مسلمات بيتحدثوا عن الحجاب على انه مقيد للحريه وكانه البنت لو سمحت لكل الناس يشوفوا شعرها واجزاء من جسدها بتكون حره واصلا الحجج اللي تذرعوا فيها غير مقبوله بتاتا واحده ما بتقدر تضحي بالسباحه من اجل دينها وكان السباحه ضروره مثل الهواء والمياه وواحده زوجها سمحلها تخلع الحجاب خلال شهر العسل والاخ مش عارف انه عبيتنازل عن عرضه ويشاركه مع الناس لو الحجاب صار بلا قيمه عند بعض الناس لهذه الدرجه فنحن بازمه كبييييييييييييييييييييره"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018131715/http://www.20at.com:80/article.php?sid=606"

[[comments]]
order = 30
subject = "اختكم من المغرب"
text = "أولا السلام عليكم<br />بصراحة انا اتاسف لوضع شبابنا المسلمين<br />حرام عليكم يا شباب احنا مسلميييييين<br />ولازم تفهمو ان الحجاب واجب وفرض علينا مثله مثل الصلاة يعني من تلاعب به فجزاؤه عسير<br />اختي يا من خلعت الحجاب كي تسبح حرام عليكي<br />انتي تخليتي على عفتك وكرامتك انتي سمحتي لاي كان يتمتع بجسمك الجميل تركتي سلعتك معروضة بالمجان للجميع\\<br />وما قدرتي لها ثمن الثمن الي قدره لها ديننا الحنيف الاسلام<br />وكمان الي خلعت الحجاب بحجة انها لازم تعيش حياتها وتحس بشهر العسل هو شهر عسل واحد بس ولازم تتمتع بيع<br />يا اختي الحجاب ما منعك من انك تعيشي شهر عسل<br />بالعكس هو راح يخليكي تحس بيه ويبارك لك في زواجك كمان بس وانتي خلعتي الحجاب مش عارفة ايه الي هيحصل بعد كده يمكن ربنا يغضب منكي ويحصل مالا يحمد عقباه اللهم اغفر لنا ولكي اختي عودي الى صوابكي واستغفري ربكي لعل الله يتوب عنكي<br />وربنا يهدي الجميع"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018131715/http://www.20at.com:80/article.php?sid=606"

