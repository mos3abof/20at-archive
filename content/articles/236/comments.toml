text = "انا جديد بلشت اكتب في الموقع قبل كنت بقرا بس وباخد فكرة عن الأشخاص يلي بيكتبو دايما ولكن هذا المقال مهم كتير براي وانا قبل هيك في موقع اخر كتبت عن الحجاب الاسلامي وكان الحمدلله موضوع ناجح<br />عجبتني كتير فكرة الأخ وائل وحرصه على طهارة بلده ومش ضروري يتاخد كلامه على انو عدو لمصر ولا كلمة الحق بتزعل يعني واكيد هذا الشي مش موجود بس في مصر................... بس المهم يا أخ وائل انو الواحد مايترك بلده ويحاول كل جهد حتى يطهرها من هذه القوانين الأ اخلاقية"
