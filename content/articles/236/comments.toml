[[comments]]
order = 6
subject = "هو أحنا ناقصين حرقة دم"
text = "الحقيقة أنا مستغرب على البنت اللي تمشي وهي نست تلبس هدمها... أو اللي بتلبس علشان الناس يشوفوا المستخبي...<br />طيب هي الوردة اللي بتتقلع من غصنها بيشمها إلا واحد ولا اثنين وبعدين!!! تنداس بالرجلين...<br />طيب وليه.<br />أقولكم حاجة عمرنا شوفنا جوهرة مرمية في الشارع للي يسوا واللي مايسواش.... واللا بياخذها اللي بيعرف قيمتها!!!! أما الفالصوا مرمي على الرصيف زي الرز في كل حتة.... بقرش وقرشين ويمكن فوق البيعة!!!<br />وبعدين أنا استمخيت من كلامك يا فكرة... كلام في السليم وموزون قوي...<br />والننوسة الست بنوتة الصغنطوطة... مش عاوزانا نزعل لما نشوف بنات بلدنا ماشين وهم نسيوا يلبسو.... مش مهم حجاب ولا دياولوا بس يتحشموا شوية.... والا أحنا ناقصين حرقة دم....<br />عجبي"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

