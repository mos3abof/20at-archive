[[comments]]
order = 25
subject = "نونا"
text = "ير سانت كاترين يا وائل ده مثال<br />ممكن لو عايز تعيش من الحلال هتعيش<br />انا اعرف واحد ممكن تكون انت كمان تعرفه هيفتح شركة سياحة بس بيخاف ربنا اقترحت عليه ان يعمل لبرحلات التثقيفية و الدينية زي الحج و العمرة و دي سياحة دينية و رحلات الاقصر و اسوان و دير سانت كاترين و اكيد مصر فيها حاجات حلوة كتير يا وائل<br />شارم نفسها اناشايفة لو انت محترم حتي لو ايه مش هتتأثر انا عمري مرحتها صراحة بس مظنش حرام ولد ينزل غطس او كده هناك يمكن بنت هيبقي اللبس مش مناسب لحد ما عشان بيوصف الجسم بس دي ممكن تتحل لو عايزيين احنا ممكن نستمتع بالحلال مش لازم نضيقها علي نفسنا عشان الحلال اكتر من الحرام<br />و الحجاب عمره ما كان قيد بالعكس انا افتخر بحجابي<br />انت عارفني انا مش ملاك و لا مثالية بس انا بحب حجابي و ممكن اكون بيه اشيك و احلي الف مرة لو من غيرة"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

