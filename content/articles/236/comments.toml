[[comments]]
order = 18
subject = "أيه يا شباب؟"
text = "ما هذا الجو الملغوم، والمشحون، هذا جو غير طبيعي، يجب أن نتحمل بعضنا البعض، أليس كذلك، والأصل أن نقبل تعليق الأخرين بصدر رحب...<br />هذا ما تعلمناه في الإسلام. وأن نعتبر النقد ليس للذات ولكن للفكر والرأي...<br />أخوتي رفقا ببعضنا البعض... ألا يكفي ما نحن فيه؟؟؟<br />................................حالم بمستقبل مشرق"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
order = 19
subject = "أما عن الموضوع..."
text = "أنا حقيقة مستغرب من الأم التي تشجع ابنتها لخلع الحجاب.... وكيف يفرطوا في عرضهم هكذا ويجعلوها مشاع....<br />وكذلك للأخت التي رضخت هل طاوعتها نفسها ولم تستح من كونها عارية أما الناس ينظرون إليها وهي تلبس لباس البحر الغير لائق.... خلقا قبل أن يكون شرعا..<br />وأنا أشعر أنها نزوة يجب أن تتوب إلى الله فإن الحجاب كالصلاة والصوم والحج... ((فريضة))<br />لدي سؤال أخير ماذا سيحدث إن لم نذهب إلى مثل هذه الشواطئ (نقاطعه) حتى يتوبوا إلى الله ... ونذهب إلى الشواطئ التي بها العفة وهي ولله الحمد كثيرة...<br />نسال الله أن يتوب علينا أجمعين وأن يرزقنا خشيته في الغيب والشهادة.<br />وأن يجعل نساءنا كنساء الصحابة.<br />.................................حالم بمستقبل مشرق"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
order = 20
subject = "واحد من بره"
text = "على فكره فعلا مش لازم نربط المشكله بمكان أو حتى نظلم المكان احنا لازم نستمتع بكل حاجه كويسه و مش هنتحبس فى بيوتنا علشان ناس مبتراعيش ربنا فى معاملاتها احنا نروح شرم و الغردقه و طظ فيهم و بالمعامله الكويسه مع ربنا حتى نكون رمز للتدين الكويس مش نستخبى , فعلا شرم من الأماكن اللى احنا بينسيبها للأجانب و للناس المصريين المتشبهين بيهم لكن لأ نأخد حقنا<br />ثانيا ايه حكايتكم انتم بتتخنقوا ليه مع بعض ربنا يهدى"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
order = 21
subject = "جميل جداً هذا التدافع"
text = "والله كلكم شباب ذي الفل اما غيور على دينه او غيور على أرضه ،ربنا يصلح لكم الأرض وتطبق شريعته ويصلح لكم الاقتصاد ويرزقكم الزوجات الصالحات آمين"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

[[comments]]
order = 22
subject = "وائل عباس"
text = "كلنا غيور على ارضه<br />ولكنه عندما تهجرني ارضي اهجرها هجرا جميلا<br />وليس لاحد الحق ان يمنعني من ان احتج على اوضاع لا تعجبني !!!<br />فشرم الشيخ والغردقة تسمح للسائحات بالتشمس توبليس اي بمايوه يغطي الجزء الاسفل فقط اما الاعلى فهو سداح مداح<br />اما المحجبات فلا !!!<br />يبقى انا اروح هناك اهبب ايه<br />كده كده ها تشوف مناظر لا تسر<br />وبعدين اللي بيتجوز ويروح هناك بيتجوز ليه اصلا !!!<br />فالحين بس نقاطع بيبسي وكوكاكولا اللي بيصنعهم ولاد بلدنا وبياكلوا منهم عيش وفاتحين بيوت !!!<br />على فكرة برغم من ان مؤهلي مناسب تماما للعمل في السياحة الا انني ارفض تماما العمل بها ...<br />وما ساقوله هو رأي شخصي بحت ينطبق على انا فقط ... فانا ارى ان العمل بالسياحة هو ان تكون خادما او قرني وبمزاجك وكمان بتاخد فلوس ... وشكرا ..."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033728/http://www.20at.com:80/article.php?sid=606"

