[[comments]]
order = 17
subject = "عقلاني: بيلي دانس"
author = "هو انتو ما تعرفوش ان الرقص دا رساله.دا فن.بس للأسف متضايقين من فيفي ودينا ومش متضايقين من ناس تانيين.طيب تعالو نشوف حاجة تانية.هسألكم سؤال.هو في رقص اسلامي!"
posted = "2006-01-31"
text = "يعني الواحدة ممكن ترقص من غير ما تكون متعرية ! بكامل ملابس الحشمة.وترقص قدام الناس!<br />انا اعتقد ان الشعب المصري راقص بطبعة.وهذا خالي من الحشمة.انا عارف ان البعض متضايق من كلامي .بس انا هقول لكم ليه.<br />مهرجان الفنون الشعبية\"فولكلوور\" اللي بيتعمل كل سنه.في الاسماعيلية.كل واحد يجيب فرقة رقص شعبي.وطبعا ما يخفاش عليكو ان الرقص الشعبي هو كمان رسالة.الفلاحين ليهم رقص شعبي.تلاقي الست من كتر ماهي لابسه من تحت متشوفش رجلها.لكن من ناحية الصدر الفتحة بتوصل لمسافات بعيدة.هو دا لللأسف لبس الفلاحين.والناس بتوع الارياف عارفين كلامي.المهم.ومع ذلك وان كانت البت لابسة وهي بتهز بتبان مفاتنها.وجسد المرأة فيه مغريات.ولذلك المرأة الحشمة لا تقبل علي الجري لأنه يبرز مفاتنها بالحركة السريعة. ودول يا ولداه بيتنططو قدامنا باسم الرسالة.وان احنا لازم نحمل الرسالة اللي العالم كلة لازم يشوفنا واحنا بنعمل فنوننا وفلكلورنا.عشان نبان دولة حضارية.<br />احنا في فلسطين عندنا رقص شعبي اسمة الدبكة.انا مستغرب مين واحد محترم.بيخلي اخته او زوجته تهز قدام الاف الناس اللي فيهم مفترسين بعيونهم كل همهم النظر الي مفاتن البنت والمرأة وهي بترقص.والاشياء بتهز.وناهيك عن مسك الايادي مع الشبان زملاءهم في الرقص والضغط عليها .انتو عارفين يا جماعة دا كلة فولكلوور.ورسالة زي رسالات فيفي ودينا.<br />اذا كرهنا فيفي عبدة يبقي لازم نقف قدام ما نسمية الرقص الشعبي.هو الشعوب برقصها.يعني حضاراتنا الاسلامية لما ظهرت.وعمرت الكون.وكنا منارة الكون في فترة معينه دا حصل بالرقص.بدل ما نرقص.نشتغل.وبقولو علينا رجعيين زي ما هما عاوزين.ما هو يا اما نشلح يا اما نبقي رجعيين!لأ نبقي رحعيين ونفضل بكرامتنا.<br />علي سبيل المثال لا الحصر.اليابان.دولة بنت نفسها بنفسها.دولة معندهاش دين معين.بودا وغيرة.شفتو الرقص الياباني! من كثر بطي الحركة.وعفة المرأة اليابانية.تقريبا مفيش حاجة بتبان.\"مع ان فكرة الرقص ماذالت فكرة غير مقبولة ولكن اليابان مجرد مثال\" .لكن بصو بناتنا.من كتر النط والحركات السريعة بتفتكر انها هتنتحر.وبتقولك افترسني بنظرك.<br />ودا اللي السينيما المصريه عملته في اواخر التلاتينيات.كانت الافلام كلها استعراضية.وملو الافلام بالنساْء العرايامن اليونان وايطاليا وغيرها.في الوقت دا كانت المرأة المصرية عفيفة.كانت بتلبس الخمار.مش بالمعني الموجود حاليا.ولكن شبكة بتحطها علي وشها وملايه لف بتستر بيه نفسها.طبعا مع عدم التحزيق حولين وسطها بيه. ولو تلاحظو في ثورات 19 وغيرها كانت المرأة المصرية لابسة الزي الشرعي وهو النقاب.لكن انفلبت الايه.والسينيما جابت الرقاصات والرقاصين .وشوية شوية .خربت المسألة.<br />انا طولت عليكم.بس عندي نقطة عاوز اوضحها.مين المسؤل عن تخريب بناتنا .من اجل بث افكار فيفي ودينا فينا.<br />اذا رحنا النوبة.وهم من اكثر المصريين حشمة.ووقار في الملبس.عملو عليهم هجوم.وحكولهم لازم الفلكلور النوبي يوصل للعالم.ارقصو ورقصو بناتكم.وطبعا الشاب النوبي الاصيل اتنازل عن اصالته.وسمح ان اخته ترقص رقص عفيف.اتفرجو علي أغنية عودوني لعمر دياب.وازاي قدم الشعب النوبي علي انه شعب غير محترم وبناته في منتهي المسخرة.واتفرجو علي هجوم الفرق النوبية علي حفلات عيد الميلاد وغيرها.فيلم مافيا والرقص النوبي.وفيلم انت عمري الحديث بتاع هاني سلامة ونيلي كريم.وازاي النوبة بقو يدخلوها في كل الافلام عشان يرقصو.تحول تام يا حضرات.بيع اكثر تشتهر اكثر.<br />في النهاية بقول.الموضوع موضوع قرار.الرقص يبقي حرام.والرقص يقف.وان الفلكلور حرام.وانتهت المشكلة.الموضوع موضوع وقفة بجد.اولا يتعلم رب المنزل ان بنته اللي بترقص دي بتخالف شريعة الله.وابنه اللي بيرقص بيروح للفساد.<br />مش عاوز انسي.ان بالفعل احنا انشهرنا بالبيلي دانس وهو هز الوسط.ولكن للأسف من من فيفي عبدة.ولا دينا.بقالهم سنين بيهزو ومحدش معبرهم.بس لما جت شكيرة بالبيلي دانس.الكل في اوروبا عاوز يرقص بيلي دانس.يعني تعبنا تعبنا وعلي الفاضي.جت اللبنانية شكيرة تاخد من المصرية المجدوتعب السنين. شوفو المسخرة وصلت لفين.<br />انا متضايق مش بس من مصر.كمان من بلدي فلسطين.بس الشعب المصري اكثر لأن الشعب المصري اوقات ليه كلمته.<br />سلامي لكم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112520/http://www.20at.com/article2.php?sid=252"

