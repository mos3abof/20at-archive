subject = "يهدى من يشاء ويضل من يشاء"
author = "احمد"
posted = "2006-01-14"
text = "نسال الله عز وجل ان يهدينا ويهدى الراقصه ديناويجب الا نعجب لهذا الموضوع فعسى ان يقبل الله توبتها ويتوب عليها فينفع بها الاسلام ولنتذكر ان النبى دعا (اللهم أعز الإسلام بأحد العمرين ) وكلنا نعلم العمرين-وهماعمروبن هشام ( ابوجهل)وسيدنا عمر بن الخطاب _ ونعلم تمام العلم كيف هدى الله عمر بن الخطاب بعد ان كان غارقا فى الكفر............. فهل بعيد على الله ان يهدى الراقصه دينا!!!ولا يعنى قولى اننى أبرر أو أبيح رقصها وعريها فهى بلا شك مذنبه... ولكن أسال الله عز وجل لى لها وللمسلمين جميعا التوبة والمغفرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112520/http://www.20at.com/article2.php?sid=252"

