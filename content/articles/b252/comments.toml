text = "موش عارفه اقول ايه بس الحج فريضةوربنا يكتب لكل واحد نفسها ينولها بجد وربنا يكتب لنا نحج او حتى نعمل عمرة أما عمليةالتباهى بالحج والعمرة بين الفنانين شئ يسئ للدين الاسلامى وخاصة ان الحج الان اصبح شئ صعب فكيف على المسلم الفقير ان يذهب للحج والحج اصبح الان يتكلف فوق الثلاثين ألف جنية حتى يذهب لاداء فريضة الحج والان الراقصات هم من يملكون المال فلذلك يتباهون بالحج وربنا يتوب علينا من هؤلاء الطائفة حتى لا يدموا عقول شبابنا اكثر من كدا<br />وسلامى لكل من عمل فى هذا الموقع"
