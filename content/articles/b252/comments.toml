[[comments]]
order = 33
subject = "الله يكون فى عوننا"
author = "عزيز المصرى"
posted = "2006-10-21"
text = "لا ادرى هل دينا وامثالها يضحكون علينا ام يضحكون على انفسهم ام يضحكون على من فهم ادرى منا بالكم الهائل من الذنوب التى يرتكبونها كل يوم فى حق انفسهم وحق اهاليهم وحق اولادهم وهم يتناسوا حجم الفجور والفسوق والمعاصى التى ترتكب كل يوم بأفعالهم .<br />الم تسأل واحدة منهم وهى فى احضان من يستطيع ان يدفع مهر ليلة معها من بدايتها الى اليوم هل ما تفعله يقع تحت اى مسمى الحلال ام الحرام وعندما تتفنن اى منهم فى اختيار بدل الرقص ومدى ما تكشف عن مفاتنها لتثير شهوات السكارى والذين أخذ الخمر بعقولهم ان ماتفعله حرام ام حلال وعلى من تضحك وعلى من تكذب وعلى من تتخفى على رب يرى ويسمع واين سيذهبون ساعة الحساب ومن سيشفع لهم.<br />حسبنا الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112520/http://www.20at.com/article2.php?sid=252"
