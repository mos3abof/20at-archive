[[comments]]
order = 1
subject = "من وجهة نظري الشخصية"
author = "عبدالله"
posted = "2006-01-14"
text = "هل يقبل الله تعالي حج الراقصات أو لا يقبله فعلم ذلك عند الله تعالي ... ولكن أنا لي رد علي ما قالته بعض الراقصات:<br />قالت لوسي: ربنا ما يبصش لأجسامنا بل يبص لقلوبنا ... وأنا أقول إن ربنا بعث لينا القرآن الكريم وبعث لينا رسوله محمد لكي يوضح الأوامر التي يريد الله تعالي منا الإلتزام بيهاوالنواهي التي يريد الله تعالي تجنبها ... والله تعالي في القرآن أمر النساء بالحجاب الشرعي أما كلام لوسي فلا يؤخذ منه لأنه مخالف لما أمر به الله تعالي.<br />2- قالت فيفي عبده إن الرقص بفتح بيوت للمحتاجين ... وأنا قولها اللي بيفتح بيوتا للمحتاجين هو الله تعالي وإنتي بتفتحي بيوتا للمحتاجين وبدمري بسلوكياتك بيوتا أخري ... ولم نسمع أن الله تعالي أنه بيرزق المحتاجين عن طريق هز الوسط .<br />3- دينا : أربعون يوما لا ترقص علشان ربنا يقبل حجتها بعدين ترجع ترقص فهذا تحايل علي الله تعالي وما فيش حد يقدر يتحايل علي ربنا .<br />عموما الدين الإسلامي له رب سبحانه هينصره ومين عارف جايز يرجعون هؤلاء الراقصات إلي الله تعالي بالشكل اللي يرضي الله عنهم ... آمين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112520/http://www.20at.com/article2.php?sid=252"

