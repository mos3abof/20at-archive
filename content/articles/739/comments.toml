order = 0
subject = "و و احد قهوه و صلحو"
author = "نيفين"
posted = "2006-01-18"
text = "الموضوع جنان يا مريم<br />بس دى تصائح مفيده للبروده الخارجيه لكن تعمل ايه ازا كانت البروده داخليه<br />برودة المشاعر<br />عموما ما علينا<br />اضيف للتصائح بتاعتك فتجان قهوه دافى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114835/http://www.20at.com/article2.php?sid=279"

[[comments]]
order = 1
subject = "كوول مريم"
author = "Blue Eyez"
posted = "2006-01-18"
text = "كتيير حلو الموضوع مريم ما فيني احكيلك الا الله يبارك فيكي :<br />ونقطة أماني كتيييير مهمة بدنا ندفي حالنا من برودة المشاعرة مريم<br />ثانكس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114835/http://www.20at.com/article2.php?sid=279"

[[comments]]
order = 2
subject = "والفقرا يعملو ايه؟"
author = "حسام"
posted = "2006-01-18"
text = "كل الحاجات الجميلة دي محتاجة امكانيات<br />مننساش نساعد أسرة فقيرة بمبلغ أو وجبة أو غطاء أو أي شيء يساعدهم على اتقاء البرد الشديد ... عشان نحس بدفا حقيقي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114835/http://www.20at.com/article2.php?sid=279"

[[comments]]
order = 3
subject = "موضوع جميل"
author = "ماميا"
posted = "2006-01-20"
text = "الموضوع دافىء جدا و لكني شعرت ببرودة شديدة جدا جدا لانى رايت في خيالى صورتين الاولى لانسان يجلس امام شاشة التلفزيون وعليه بطانيةناعمة كما تنصح مريم كاتبة المقال و يشرب كوب الكاكاووبالتالي يشعر بالدفىءولا يفكر الا في احتياجاته التي تزيد من راحته و لا يتذكرالصورة الاخرى لانسان يجلس في الخلاء يعاني البرد القارس الذى يكاد يجمد اطرافه و يحتاج فقط لما يبقيه علي قيد الحياةو يحتاج للمساعدة وصدقوني الشتاء يكون اكثر دفئا اذا بذلنا مافي مقدورنا للمحتاجين وبعدها ننعم بما انعم الله به علينا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114835/http://www.20at.com/article2.php?sid=279"
