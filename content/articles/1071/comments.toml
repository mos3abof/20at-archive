[[comments]]
order = 0
subject = "الخروج من الصمت"
author = "بويشو مراد"
posted = "2006-10-12"
text = "بسم الله الرحمان الرحيم انا شاب مغربي عمري 21سنة من عشاق فن الراب وانامن المولعين بالفنان لطفي دوبل كانون بالنسنة لهدا النوع الجديد من الاغاني فهيفي نضرنا تحكى عن واقعنا المرير و المعانات اليومية لدالك وجدنا اغنية الراب المتنفس الوحيدلنا نحن الشباب لنقول كلمت الحق في وجه الدين يريدون تكميم افواهنا واغلاق اعينناليفعلو بنا كما يوريدون ولكن لن نكون لقمتا سهلت لهم ولونموت المهم يجب عليهم تحقيق متطلباتنا كما يقول احد مغني الراب ''بركا من الخوف ''"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131751/http://www.20at.com/article2.php?sid=1237"

