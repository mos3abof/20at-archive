posted = "2006-10-12"
text = "بركا من الخوف هزو ريوسكم يالي جزايري حراروا بركامنالخوف نخاف من البوليس و نخاف من الجماعة ونخاف من لي عندو فلوس تخافو منكلشي انخافو منالله"
