[[comments]]
order = 7
subject = "البطالة والواسطة"
author = "مجلة الإعصار"
posted = "2006-05-03"
text = "احنا شباب مصر المحروسة **** احنا شباب مصر العاطلين<br />شعرنا شاب والسن اتقدم **** بس املنا ييجي التعيين<br />اوحتى نلاقي شغلانة **** او سبوبة نجيب قرشين<br />العيشة في مصر بقت نيلة **** والاسعار اهي زي الطين<br />ياما تعبنا وياما ذاكرنا **** واهالينا شالوا الهم سنين<br />واخرتها قاعدين ع القهوة **** يوماتي نفتش في الجرانين<br />لكن الشغل ياعيني معدوم **** الا لاولاد الواصلين<br />دول بيلاقو الشغل كتير **** بنفوذ بابا وعمو حسين<br />كارت صغير او تليفون **** يفتح خمسين باب حلوين<br />كم سنة لما الواد يتودك **** ويعرف ماشية ازاي ولفين<br />يبدأ يعمل بيزنس خاص **** ويبقى حسابه بالملايين<br />ويجيب ناس يشتغلوا معاه **** برضو بكارت او تليفون<br />واحنا ياناس نقعد نتفرج **** ونقول بكرة ييجي التعيين<br />وييجي بكرة زي امبارح **** ونقول بعده وهايروح فين؟<br />دا نصيبنا من الدنيا ياناس **** نستناه سنة ولا اتنين!<br />سنة ورا سنة والايام تجري **** واحنا على القهوة قاعدين<br />نتفرج على اهل البيزنس **** واولاد الامرة الناجحين<br />لحد العمر مايزحف بينا **** وتظهر شعرة بيضة واتنين<br />واحنا نقول دي هموم الدنيا **** لما الحلم يبان هاتهون<br />بكرة الشعر هايرجع اسود **** لما نشوف ورق التعيين<br />والقهوة قعدتها مملة **** \"دومنة..طاولة..شاي..ينسون\"<br />لما نمل القهوة ننام **** نفضل بالايام نايمين<br />و ساعات نتمنى ما نصحاش **** ونشوف واقع كله لعين<br />الجرنان بيقول فيه وظائف **** بس شبابنا ياناس هايفين<br />عايزين يقعدوا ف الارشيف **** وياخدوا اعانة للعاطلين<br />ونروح نجري على العنوان **** يقولوا لنا جايين مع مين؟<br />الواسطة ياجماعة دا شرط **** واحنا نجيب الواسطة منين؟<br />لو مش واسطة تبقى عمولة **** وما فيش اصعب من الاتنين!<br />الشعر الاسود بقى نادر **** والاطراف ما بقتش تلين<br />ونقول بكرة اهو جاي يا ناس **** بطلو تبقو متشائمين<br />إلى استنى تلاتين عام **** مش معضلة يصبر سنتين<br />ما بقاش فيه شعر اسود خالص **** والاسنان وقعو الصفين<br />الدكتور قال خف القهوة **** واوعى تقرب من التدخين<br />الدكتور قال فيه اضطرابات **** ف القلب وزغللة ف العين<br />فيه ف حياتك حاجة خطيرة **** فرحة كبيرة او حزنين<br />ف الشيخوخة الفرح بيتعب **** ذي الحزن يغوروا الاتنين<br />قلت له انا امبارح جاني في **** البوسطة جواب التعيين<br />مجلة الإعصار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134036/http://www.20at.com/article2.php?sid=330"
