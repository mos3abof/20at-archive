text = "يا جماعة الموضوع ده خطير جدا ومايستاهلش منكوا التريقة لأن ده السبب الرئيسى فى تأخر بلادنا لأن الواسطة ( الكوسة ) بتدى حق لناس لا تستحق الحق ده زائد انها بتدمر النفوس بالنسبة للناس اللى محتاجة تاخد دورها وفرصتها فى الحياة وبكده يشع الحقد والحسد فى بلادنا وبدل ما نتقدم خطوة للأمام نرجع خطوات كتير للخلف مش بس كده ده كمان معناه ان الواسطة حتفضل تتورث لسنين وسنين كمان<br />ادعوا معايا اللهم أرنا فيهم عجائب قدرتك ..اللهم انصر كل ضعيف وافصل بينه وبين الواسطة... آمين"
