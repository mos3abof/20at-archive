[[comments]]
order = 4
subject = "هل نحن مستعمرون"
author = "صعيدي أصيل"
posted = "2006-02-01"
text = "وضع تعامل الدولة المصرية مع الصعيد يذكرني بتعامل مصر مع سورية فى زمان الوحدة حيث كان كل ما كان يمسك بزمام الأمور فى سوريا مصريين وليس ذلك فقط بل ويتعالون عليهم؟؟<br />بصورة أوضح كل ما تدخل مؤسسة حكومية فى الصعيد سواء قسم الشرطة سواء مجلس المدينة سواء المحافظة حتى الضابط الذي يقوم بأعتراضك فى الشارع شكله كدة ود حيلوه أبيضاني وبيقول بئه ولئه يعني من وجه بحري ونحن الصعايدة محروم علينا ندخل كلية شرطة ولا يمسك منصب حساس ، ويتحايلون بموضوع الثأر ليس كل القري فيها ثأر ، فالعديد من الشباب يقدمون فى الكليات العسكرية والشرطة ولايقبلونهم على الرغم أنه رجل محترم وحتى جده الألف موجود فى القرية ومعروف أصله وفصله ولا يوجد عندهم ثأر ومستورين الحال ، ولكن يتعاملون مع الصعيد وكأنه ليس جزء من مصر ولكن يتعاملون معه كأنه منطقة مستعمرة والمستعمر دولة وجه بحري أي من القاهرة وشمالها ، يامسئولين تعاملوا معنا كما تتعاملون مع الأخوة المسيحيين وأعطونا حقنا ، أنا عارف أن العديد منكم يقول هناك ضباط ومسئولين من الصعيد وهم قلائل ولكن لو ركزت جيدا ستجده أبن عمدة أبن عضو مجلس شعب ومن المعروف أن 99% من عمد مصر هم فى الأصل أتراك أو شراكش أي لو ركزت فى أي عمدة ستجده شكله بعيد كل البعد أن يكون أصله مصري وجده الأكبر كان الأغا وتغييروا مع الزمن، هل رأي أحد منكم مذيعة أو مقدمة برامج فى التلفزيون صعيديه أو حتى بتتكلم حتى صعيدي أليس نحن الجزء الأكبر من حيث العدد والمساحة من مصر ، وياسلام كلام على الايحاءات والغمزات والنكت وقلت القيمة فى الافلام والمسلسات والاعلام المصري الذي يصور للعالم أن هؤلاء الصعايده مجموعة من المتخلفين والجهلاء مما يقف حجرعصرة فى تعاملنا مع العالم الخارجي ، حيث مهما كان درجة تعليم الصعيدي ، عندما يتعامل مع الأخر يشكل عليه فكرة مأخوذه من الاعلام المصري ، وتقول لي أن الصعيد ليس مستعمر ن بل نحن مستعمرون من وجه بحري ولكن إلى متى؟ نريد وسطه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134036/http://www.20at.com/article2.php?sid=330"

