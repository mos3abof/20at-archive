subject = "bebeto"
author = "k_k88@hotmail.com"
posted = "2006-02-03"
text = "لن يشهد طارق عزيز وزير الخارجية السابق واكثر الوجوه العراقية شهرة على الساحة الدولية ضد حاكم بلاده السابق صدام حسين امام المحكمة العراقية المتخصصة كما اكد شخصيا لمحاميه الذي التقاه الخميس للمرة الاولى.<br />\"ابلغني طارق عزيز انه لن يشهد ضد صدام حسين\" قال بديع عارف عزت المحامي العراقي الوحيد لطارق عزيز اثر اجتماعه بموكله في قاعدة عسكرية اميركية قرب بغدا.<br />يذكر بان هيئة الدفاع عن صدام حسين اعلنت قبل عشرة ايام ان كبار المسؤولين العراقيين الاحد عشر المعتقلين يتعرضون لضغوط شديدة لدفعهم للادلاء بشهادات ضد صدام.<br />وابلغ عزيز محاميه بان كبار المعتقلين \"لم يلتقوا صدام مطلقا\" فهم مسجونون في زنزانات افرادية انما في المكان نفسه \"ويلتقون بعضهم يوميا ثلاث ساعات\".<br />التقى عزت طارق عزيز لمدة سبع ساعات في مكان لم يستطع تحديده لانه نقل اليه \"داخل مدرعة للقوات الاميركية\".<br />وكان وزير حقوق الانسان العراقي بختيار امين كشف في 14 من الشهر الجاري ان صدام حسين محتجز في قاعدة \"كامب كروبر\" الاميركية قرب مطار بغداد الدولي موضحا انها \"قاعدة عسكرية محصنة جيدا وجزء من مجمع عسكري واسع يسمى \"فيكتوري كامب\" (معسكر النصر) على بعد حوالى 16 كيلومترا من وسط العاصمة العراقية.<br />واكد عزت ان الاجتماع تم بحضور عسكري اميركي وان طارق عزيز \"بصحة جيدة ومعنوياته عالية\" وانه كان يرتدي زيا ازرق اللون يبدو انه زي السجن ويضع نظارته السميكة التي اشتهر بها وكان مرحا روى له نكاتا عدة.<br />واصطحب عسكريون اميركيون عزت في زيارة لمرافق السجن الصحية ولغرفة الرياضة. وتتهم المحكمة العراقية المختصة طارق عزيز بتهمة المشاركة في عملية \"ابادة الجماعية\" جرت في المناطق الكردية في شمال العراق اثر قمع الجيش العراقي لانتفاضة الاكراد في اذار/مارس عام 1991.<br />في رده المكتوب على المحكمة الذي اطلع وكيل دفاعه عليه اكد عزيز \"انه لم يغادر طيلة شهر اذار/مارس بغداد وكان يداوم في مكتبه في وزارة الخارجية\".<br />وعدد شهودا على ذلك منهم محمد سعيد الصحاف (حينها وزير دولة) وزير الاعلام قبل سقوط النظام في نيسان/ابريل عام 2003 وصابر عبد العزيز الدوري قائد الاستخبارات العسكرية حينها والموقوف حاليا في المكان نفسه.<br />بعدها غادر عزيز بغداد في جولة شملت عمان وصنعاء والخرطوم \"في الفترة التي تم فيها استعادة السيطرة على محافظات كركوك والسليمانية واربيل ودهوك\".<br />وكتب عزيز في رده \"لذلك فان اي تهمة توجه الي حول هذه المسائل هي باطلة وليس لها اساس من الصحة\".<br />وحمل طارق عزيز محاميه رسالة خطية الى مسعود بارزاني رئيس الحزب الديموقراطي الكردستاني رفض المحامي الكشف عن مضمونها قبل تسليمها.<br />من ناحيته اكد عزت ان المحكمة العراقية المتخصصة \"تعاونت معه ايجابيا لتامين لقائه الطويل مع موكله\" وخص بالذكر رئيس القضاة فيها رائد جوحي.<br />وجوحي هو القاضي الذي مثل امامه السبت الماضي علي حسن المجيد الملقب \"بعلي الكيماوي\" ووزير الدفاع العراقي الاسبق سلطان هاشم احمد في اولى جلسات التحقيق مع الموقوفين في حضور محامي الدفاع عنهم.<br />تقضي مهمة المحكمة الخاصة التي انشأتها سلطة التحالف في كانون الاول/ديسمبر 2003 بالنظر في الدعاوى على المتهمين \"بابادة جماعية وبجرائم ضد الانسانية وبجرائم حرب وبخرق القوانين العراقية\"."
archived = "2006-11-02"
