[[comments]]
order = 0
subject = "تكبر الاشبال فتصير أسودا"
author = "هذا و قد اعلن مصدر مسئول انه يجرى الان العمل على قدم و ساق لانشاء سجن الاطفال العمومى بالصحراء الغربيه بتعاون مثمر بين وزاره الداخليه و التعليم و مباحث امن الدوله"
posted = "2006-07-16"
text = "كما صرح المصدر نفسه عن الحاق العاملين بحقل التربيه و التعليم بفرق امنيه للكشف المبكر عن الكوادر المستقبليه لحركات العارضه المحتمله<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأه يــــــــا بـــــلـــــدى"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719125025/http://masr.20at.com:80/article.php?sid=650"

[[comments]]
order = 1
subject = "الاء و الخسيس"
author = "هند"
posted = "2006-07-16"
text = "ان من فام بتصحيح اختبار الاء هو حمار اعتقد انه بفعلته هده سيحصل على مكافئة من حكومته وبهدا فهو حمار جسوي خسيس لا يعرف ان مكافئته هي الجحيم فالى جهنم و بيس المصير"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719125025/http://masr.20at.com:80/article.php?sid=650"

[[comments]]
order = 2
subject = "المدرس المخبر"
author = "aymanemam"
posted = "2006-07-17"
text = "الظاهر ان حكايه زياده رواتب المدرسين وتزامنها مع الخيبه اللى عملها المخبر -هى السبب فى اللى حصل الراجل معذور مش لاقى حاجه يبيعها- ولى رجاء من المسئولين عن هذا الموقع ان يخصصوا لهذه الطالبه عمود يومى لكى تكون رمز لجيل جديد"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719125025/http://masr.20at.com:80/article.php?sid=650"
