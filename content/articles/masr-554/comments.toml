[[comments]]
order = 22
subject = "يا رب يتفهم المرة دى !!"
author = "الواحد زهق من كتر إعادة الكلام!"
posted = "2006-06-24"
text = "يا نجم يا حبيب قلبى منك ليه الموضوع بسيط قوى, الأخ ده من حقه يلبس زى ما هو عايز و يعمل اللى هوه عايز يعمله...أنا برضه من حقى أتقبل ده أو لا أتقبله !! ولا هوه عافية و بالعند ؟!!<br />انسان مالوش أى دين أو عقيدة و تصرفاته و طريقة مناقشاته فى مدونته الأشبه بزريبة الحيوانات مالوش قيمة عندى....<br />احنا ادخلين نقول رأينا عن شخصية من وجهة نظر مجتمع دينى ( ولا بلاش دينى نخليها أخلاقى ) متسحقش منى أى اهتمام أو تقدير..<br />الاهتمام ده احوشه لواحد محترم زى عصام العريان ولا عبد العزيز صدقى ولا كمال خليل ( و أنا لا إخوانى ولا ناصرى)<br />لكن واحد ( .....) زى ده..زى ما قلت فى مشاركتى الأولى يبقى بطل فعلاً ...بس على الأمامير اللى زيه !<br />ولا مؤخذة"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

[[comments]]
order = 23
subject = "الــمـشـرحــه مـش نـاقـصه قـتلى"
