[[comments]]
order = 26
subject = "عيب على مين؟!!!!"
author = "لا حول ولا قوة الا بالله ..أنا بقول رأيي في الشاب الصغير و الشابة مراته رغم انهم وطنيين زي ما بتقولوا ..لكن ينقصهم جزء كبييييير جدا من الأخلاق و التدين"
posted = "2006-06-25"
text = "و انا مش بقلد الحكومة وهيافة الحزب الوطني و لا الهبل اللي سعادتك بتقولوا عليه<br />يا سيدي ان كان على الايجابيات على عيننا وعلى راسنا بس مشكلتنا ان الشباب اللي زي حضرتك متعطش جدا لأنه يشوف اي بطل و هو مستعد يلبس له طراطير علشان يمجده ..<br />ان كان على الوطنية فالحمد لله كلنا بنحب البلد دي و خايفين عليها ..و المظاهرات كلنا طلعنا فيها ..واضربنا و اتبهدلنا ..و اصحابنا و اخواتنا اعتقلوا بالسنين ومحدش عرف عنهم حاجة<br />كل اللي قلته ان مدونة سي علاء ومنال مليانة بالايحاءات الجنسية و الكلمات القذرة جدا جدا.. كلام منال هانم ان الحجاب بالنسبة ليها زي الاندروير الرجالي (يعني الملابس الداخلية الرجالي )فهو من الملابس اللي مستحيل تلبسها<br />الراجل المحترم اللي عيب اقول عليه كده نشر صورة مراته و هي نايمة و مرة و هيه بترقص له بقميص النوم ....عفوا و هي بترقص لنا كلنا بقميص النوم ..ومرة و مراته لابسة مايوة ..ومرة و هيه لابسة قميص نوم و رافعاه فوق ركبتها اد كده<br />معلش اصلي متخلف حبتين ..ومريض نفسيا ..علشان كده صور علاء ازعجتني جدا...وللأسف انا رافض اني اقدر الولد ده رغم شهرته و رغم صغر سنة و رغم المدة الطويييييلة اللي اتعذب فيها في المعتقل .."
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

[[comments]]
order = 27
subject = "مجرد رأي"
author = "علاء نشر صور مراته على الانترنت محدش سرقها من أوضة نومهم"
posted = "2006-06-25"
text = "علاء مش مثل اعلى لينا ..انا مثلي الاعلى مش خمورجي ...مثلي الاعلى مبيصورش مراته بالشورت و قميص النوم ..ومبيصورش مراته و هي بترقص<br />مثلي الأعلى لسان بينطق بكلام ربنا و رسوله ..وكلامه ميخدش حياء اي حد<br />مثلي الاعلى عارف ربنا ..و اسألوا علاء عن ربنا !!<br />انا لا اخوان ..ولا حزب وطني ولا شيوعي<br />انا واحد بيقول \"مجرد رأيي\"<br />سمعوني شتايمكم بقى !!"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

