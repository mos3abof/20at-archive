[[comments]]
order = 16
subject = "تمام..لوحنكتبها لأشخاص يبقي حق لكل واحد جوه إننا نفرد له مقالات مخصوصة"
author = "محمد السيد"
posted = "2006-06-23"
text = "صحيح ...<br />أنا كمان مع \"مصري بيحب مصر وكل أهلها<br />\" إننا منركزش علي علاء كتير أوي كده .. أو غيره .....<br />أنا عارف إن رأيي ده ممكن ميعجبش ناس كتير ..... لكن أنا ملاحظ إنكم بدأتم تحولوا القضية لأشخاص .....<br />علاء .. مالك ... شرقاوي ....؟؟<br />في إيه يا جماعة ....؟ الموضوع عمره ما كان أشخاص . ولا بنحسب لكل واحد اتحبس قد إيه ولا عملوا في إيه ؟؟؟<br />ده من أيام الملكية والانجليز .... عمر الحكاية ما كانت أشخاص ....او علاقات أسرية ...... دي تضحية كل واحد وده حبه لبلده .... وأظن كل ده شوية جدا ... علي البلد دي ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com<br />ياريت حد من ولاد البلد يكلمني علي الماسنجر"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

[[comments]]
order = 17
subject = "عقبال الأفراج عن مصر ولو بعفو صحى"
author = "كله ماشى"
posted = "2006-06-23"
text = "كفارة حقيقى ياعلاء وأجر وعافيه إن شاء الله<br />أما العالم اللى بتهجص وتعترض على شكل ومحتوى مدونة علاء ومنال فلا مؤاخذة بطلوا<br />ليه بقى<br />فيكفى نظرة سريعة سريعة حوليك علشان تشوف مبارك وعصابته عملوا أيه مصر<br />مخدرات ماشى<br />رشوة ماشى<br />عمالة ماشى<br />أنبطاح أمام أمريكا والصهاينة ماشى<br />فساد من قمة السلطة وطال حتى جانب مؤسسة العدالة حتى أصبح النائب العام وبعض القضاة مجرد أداىة من أدوات القمع فى يد مبارك وعصابته<br />ماشى<br />وبعد كده تقول لى مدونة علاء ومنال ما عرفش فيها أيه<br />يا عالم ده أحنا عايشين - بل غرقانين - فى باكبورت من مبارك والعائلة المسمومة<br />وبجب أن نحيى أى حد بيحاول أن يخرجنا من هذا الباكبورت مهما اختلفنا معاه<br />أف أف أف"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

