[[comments]]
order = 34
subject = "\\\\"
author = "القبض على الديكتاتور مبارك وتقديمه لمحاكمة عادلة وعاجلة"
posted = "2006-06-26"
text = "أخي المواطن المصري،<br />هذا البيان منك إنْ كنت واحدا من الذين انتظروا طويلا محاكمة الرئيس حسني مبارك على مئات الجرائم التي ارتكبها في حق شعبنا.<br />الرئيس هو الذي أمر بنهب أموال المصريين، وقام بتسهيل عمليات النصب والاحتيال والقروض والهروب سواء بأوامر مباشرة أو بصناعة إدارة مالية فاشلة أصر هو على استمرارها طوال فترة حكمه.<br />الرئيس هو الذي قام بحماية مُجرمي الزراعة والري لأكثر من عشرين عاما، عندما علم بكوارث الأمراض والتلوث والمواد المسببة للسرطان والفشل الكلوي مما أصاب أكثر من ربع أبناء شعبنا بها.<br />الرئيس رفض معاملة المصريين إلا بأحكام عرفية في قانون طواريء مما أفقد الشعب حقه الطبيعي في الوقوف أمام محاكم مدنية.<br />الرئيس هو الذي أعطى توجيهاته بامتهان كرامة المصريين في أقسام الشرطة والمعتقلات والسجون، وتعذيبهم، واغتصابهم، وانتهاك حرماتهم، بل وصل الأمر باشعال ضابط أمن النار في أحد المواطنين، ولما علم الرئيس بالأمر استحسنه .<br />في خلال فترة حكمه دخل السجنَ أكثر من ربع مليون مواطن، ولايزال يحتفظ بثلاثين ألفا دون محاكمة اذلالا لهم ولأهلهم وذويهم.<br />هل هناك أحد لا يظن أن المشهد المصري في عصر الطاغية كارثة تنذر بطوفان؟ فشل في كل المجالات الزراعية والصناعية والاعلامية والسياحية والادارية والتعليمية والأخلاقية والتربوية والثقافية والفنية فتراجعت مصر في عهده، وتقدم لصوص صنعهم لسرقة اللقمة من أفواه المصريين، وشهدت البطالة والعنوسة وسكان المقابر والغلاء والأمراض والادمان والفساد والتلوث والتهريب حالة مصرية عامة، ولا يزال يُصرّ على الكذب، ويقوم بتصعيد ابنه ليصبح الوحيد المؤهل فيرشحه مجلس الشعب دون المرور على فكرة التوريث المرفوضة شعبيا.<br />هذه ا<br />اقرأ بقية التعليق .."
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

