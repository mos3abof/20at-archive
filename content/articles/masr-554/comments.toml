[[comments]]
order = 14
subject = "عقبال كل بطل معتقل لسة ... كل واحد فيهم له حدوتة وله أفعاله العظيمة"
author = "محمد السيد"
posted = "2006-06-23"
text = "حمدا لله علي السلامة يا علاء ...<br />وعقبال كل المعتقلين ....<br />أما بقي للحوار الداير .... أنا مع إنسان حقيقي طبعا .....في رأيه ...<br />ولما ننعم بالحرية ويكون لنا حرية الفكر والاعتقاد ...... ساعتها حاقول لكم رأيي في علاء ومالك وشرقاوي ...... وناس كتير ......<br />لكن دلوقتي نتوحد كلنا وراء حرية أي واحد فينا .......<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

[[comments]]
