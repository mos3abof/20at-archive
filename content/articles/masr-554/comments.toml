subject = "معاك يا انسان حقيقى"
author = "بالنسبة للناس الللى بتتكلم فعلاً عن الأمور (الغبية )زى شكله و هوه حر فيه..احنا مش بنتكلم عن الشكل يطول شعره يحط حلقان يلبس فيونكة هوه حر! احنا بنتكلم عن الفكر و العقيدة...و بالنسبة للأمور اللى قالك ورينا انتا هتطالب بالحرية ازاى هأقوله يا شاطر الإخوان المسلمين ( و أنا مش منهم ) بيتاخدوا فى سجون أمن الدولة و بيتعذبوا و يطلع عين اهاليهم و فى اللى بيقعد فى السجن تلاتاشر سنة ! فمش عشان حتة عيال خد تلات خماستسشرات حبس احتياطى بقى بطل !"
posted = "2006-06-22"
text = "و بينى و بينك خهوه بطل فعلاً ..بس على الأمامير اللى زيك :P"
