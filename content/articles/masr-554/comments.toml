[[comments]]
order = 2
subject = "صدق المدونون و لوسجنوا"
author = "أبو أسامة"
posted = "2006-06-21"
text = "لولم تعرف حكومتناوحزبها وامنهاالمستغبى<br />ان المدونون صادقون ما سجنتهم لأنها تعرف ان كلمة الصدق تطير وتدخل الى القلوب وليس<br />بينها وبين الناس حجاب ولأنها تعلم انه سيكون لهؤولأ المدونون شأن فى زوال هذا النظام الذى يحتمى بأمن ليس له عقل سوى<br />فألى الأمام ايها المدونون ولا تخشوا سجن السجان واعلموا ان الحق والصدق معكم<br />حتى ولو سجنتم .<br />واقول للجميع<br />اجهر بصوتك يا فتى<br />لاتبقى فى الظلمة ضوئاخافتا<br />سيحرقوك ويغرقوك ان بقيت صامتا<br />فالى متى الى متى ستبقى دوما صامتا"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

