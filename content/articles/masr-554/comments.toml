[[comments]]
order = 24
subject = "جتكو نيلة"
author = "يا اخي احترموا نفسكوا ...انتو بتعظموا في واحد مصور مراته وهي بترقص له بقميص النو ..وصور تانية ليها بالمايوه و بالاحضان و هو نايم لي عريان..ومتصور لي هوه و هي وقدامهم الخمور"
posted = "2006-06-24"
text = "و الهبلة مراته تقول ان الحجاب من الملابس اللي لا مكن تلبسها الا لو راحت ايران<br />الله يلعنكوا ياانتو الاتنين<br />جاتكو القرف ..فكر ايه و زفت ايه<br />يعني مفيش ناس محترمة بيدخلوا معتقلات بالسنين ..مفيش ناس عارفة ربنا منهم؟<br />اشمعنى دول يعني اللي بتعملوا لهم موضوع<br />عبد المنعم محمود ..قعدتوا شهوووووور على ما جيبتوا سيرته في جزء من مقال ..واتخرستوا بعدها ..بالذمة مش اولى بالدعا هو و اللي معاه !!"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

