[[comments]]
order = 29
subject = "مجرد رأي"
author = "يا جماعة انتو زعلانين ليه من رأينا في"
posted = "2006-06-25"
text = "مش انتوبتوع ديموقراطية ..وكل واحد حر في اللي بيقولوا<br />طيب علاء لايستحق التقدير ده كله للأسباب اللي قلتها قبل كده ..كمان للي بيسألوا احنا ليه شفنا الصور..لأن ده من حقناقبل ما نقدر حد أو نكرهه ..لازم نعرفه و بما انو نشر حياته بالتفصيل الممل ..ليه بتلومونا لما نشوفها و نعلق عليها ..حاجة غريبة اوي ...هو لازم يعني نصلي لعلاء ركعتين علشان تنبسطوا مننا ..ونبقى وطنيين !!!!!!!!<br />هذا رأيي"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

[[comments]]
order = 30
subject = "رداً على \\\" سؤال صغير \\\""
author = "هأرد على سؤالك يا كابتن...عايز اقول سيادتك ان الواحد مش ميت على روحه ولا كان هيجان و مريل على نفسه فراح دخل مدونة منال و علاء عشان يشوف يمكن تبع قانون الصدفة يكون علاء مصور مراته و حاطط الصور للجميع !!"
posted = "2006-06-25"
text = "احنا سمعنا عن اللى اسمه علاء ده فكان لازم ندخل مدونته نشوف ايه اللى فيها الراجل ده بيعمل ايه بيسوى ايه و هكذا...<br />الصور كانت احدى ما اكتشفناه و لهذا نعبر عنه, حكاية ان حضرتك تقولى أتقبل الانسان مهما كانت تصرفاته نقطة فى منتهى الغباء !<br />يعنى هل انا لو جالى عريس لبنتى من عيلة و متريش و معاه فيلا و عربية...لكن البيه أخلاقه زى الزفت ( و يمكن توصل لانه يصور البنت وينزل صورها ع النت !! ) هل أرضى بالعريس ده ؟!<br />مصر هى العروسة...و أنا مقبلهاش عريس قذر زى ده...<br />انتا تقبله......انتا حر !"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

[[comments]]
order = 31
subject = "يا حسرة علي المشيخة"
author = "مسلم"
posted = "2006-06-26"
text = "شيخ المدونين !!!!!!!!!!!!!!!<br />أكيد مخدش اللقب علشان السن<br />و لا أكيد أخدها علشان هو شيخ بجد لأنه لو شيخ مكنش نشر الصور دي<br />للأسف أنا فعلا من زمان دخلت مدونتهم و شفت الصور و اتفاجأت بإن ده فكرة و ده أسلوب حياته هو مراتة , مجرد عربدة في الحياه<br />و للي زعلانين , أنا مجرد ملقيت الصور بالوضع ده خرجت مكملتش فرجة و مشفتش معظم الصور إلي الإخوة بيقولوا عليها<br />و موضوع الحرية دي بقي يعني يضحك<br />صح هو حر يعمل اللي عاوزة<br />بس إحنا كمان حرين نقول أنه رجل ديوث مش بيغير علي مراته و ميهمش مسن يشوفها و بأي وضع<br />و بالمناسبة دي مش غيبة لأن عارف إن اللي عاملة حرام<br />و بالنسبة للي بيمجدوه<br />ربنا عو و جل بيقول في كتابة الحكيم : (إن كنتم تألمون فأنهم يألمون كما تألمون و ترجون من الله مالايرجون)) يعني الناس اللي بتخش المعتقل و بتتعذب في ناس برضة بيخشوا لكن في ناس دخلت علشان قلت قال الله و قال الرسول و بتقول حلال و حرام و في ناس دخلت علشان الحرية زي علاء كدة وكله هياخد حسابة<br />بس علي فكرة موضوع الشكل ده و الفكر لازم يكونوا مرتبطين ببعض<br />بالمناسبة مش علشان بنعترض علي سلوكة و صورة القذرة و الملفات الصوتية اللي مليانة كلام قذر طبعا أكيد مراتة بتسمع الكلام ده و عرفاه فسهل نعرف أي نوع هما الاتنين<br />مش معنى إن احنا بنعترض علية يبقي بندافع عن النظام<br />ربنا بيقول (كذلك نولي الظالمين بعضهم بعضا) و علشان إحنا بنظلم نفسنا جه اللي يظلما<br />و هو اية أكبر من أن الواحد يصور مراتة صور زي دي و يطلعها علي الانترنيت , ده مش بيظلم نفسه<br />يمكن ذنوبنا و ذنوب زي بتاعة علاء دي هي اللي مودية البلد في داهية<br />و بكل بساطة لو اتغير الحكم و بقي علاء ده رئيس جمهورية تفتكروا اية اللي هيحصل<br />يمشي النسوان كلها زي مراتة<br />و مش بعيد اللي تلب<br />اقرأ بقية التعليق .."
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

[[comments]]
order = 32
subject = "تحرير مصر وغرف النوم"
author = "زنوبه"
posted = "2006-06-26"
text = "آن مش من النوع اللى آحب إنى آخوض فى آعراض الناس لكن لى سؤال ـ هو علاء ده مثلا مصطفى كامل واللا سعد زغلول علشان الهيصه دى كلها؟؟؟!!! آنا مش باأقلل من مجهوده من آجل تحرير وطنه بس فيه ناس كتير قوى قاموا بنفس المجهود وآكثر وما حدش إتكلم عنهم ـ فيه ناس قضى نحبهم فى سجون الداخليه آو آصيبو بعاهات مستديمه وإعاقات وما حدش جاب فى سيرتهم!!!<br />من 15 سنه واحد قابل مبارك عند الكعبه آثناء العمره وقال له آتقى الله فى شعبك ـ كانت النتيجه آنه تم نقله الى مصر فى طائره خاصه عن طريق جهه سياديه عليا والالقاء به فى معتقلات مصر (طبعا من غير ما يكمل العمره) ولم يفرج عنه حتى الانـ قوقوا بقى !!!<br />على العموم إحنا متشكرين قوى يا علاء بس من فضلك صورك آنت ومراتك فى غرفة النوم مالهاش دعوه بتحرير مصر والمصريين لآن تحرير مصر لا يبداء من غرف النوم<br />وربنا يهدينا ويهدى الناس"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

