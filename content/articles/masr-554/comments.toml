[[comments]]
order = 7
subject = "الف مبروك يا علاء"
author = "الف مبروك يا علاء وعقبال الشرقاوى وباقي المجموعة يارب"
posted = "2006-06-22"
text = "وبنسبة للبيتكلم عن المنظر والشكل والصور والكلام التقليدى الغبي المتخلف , انا بقولة دى حرية شخصية ولو مش عجبك الصور والبيتكلمة عن الحرية منظرهم مش عجباك فرجنا على مطالبتك للحرية وهتبقا صورك بقا وقتها وانت راكب الحصان وبتسمع اغنية طلعت يا محلة نورها شمس الشموسة ...... انت عارف الباقي بقا<br />سلام عليكم<br />حــــر يـــــة ولا للتوريث لا للفساد ولا لكل بصاص على صور الناس :P"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

[[comments]]
order = 8
subject = "هى دى الحرية"
author = "انسان حقيقى"
posted = "2006-06-22"
text = "طبعا انا كنت متوقع الردود دى من دعاة الحرية ودا عادى جدا وواخد عليه<br />انا غلطان يا جماعة<br />انا مقدرتش انى احط صور لاصحابى وهم بقمصان النوم على السرير تبقى حرية<br />مقدرتش ان معظم صورى تبقى ظاهرة فيها ازيز الخمرة هى دى الحرية<br />مقدرتش ان يبقى فيه صور بهدوم البنات اللى شبه محترمة تتكسف تلبسها حتى فى بيتها ومع ذلك الصور دى فى الهواء الطلق هى دى الحرية<br />الوحيد اللى مش حر طبعا انا وامثالى من المتخلفين اللى للاسف لسة فى دماغهم حاجة اسمها قيم واخلاق<br />ولا حول ولا قوة الا بالله العلى العظيم<br />يسقط الظلم على اى يد حاكم او محكوم"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

