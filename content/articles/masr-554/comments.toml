[[comments]]
order = 11
subject = "الاختلاف فى الرآى لا يفسد للود قضيه"
author = "زنوبه"
posted = "2006-06-22"
text = "من فتره دخلت على موقع علاء ومنال ولى ملاحظات عده على ما يحتويه الموقع<br />آتفق مع علاء فى هدفه وهو الحريه للوطن ولكنى آختلف معه في بعض مما ينشره على الموقع الخاص به كما آتفق مع الاخوان واليساريين والناصريين فه هدفهم السياسى للحريه ولكنى آختلف معهم فى طريقة التفكير<br />الاختلاف هنا لا ينتقص من قدر آحد ولذا ليس هناك آى داعى لرسائل الشرشحه التى بدءات تنهال على آحد الاخوه لآعتراضه على ما ينشره علاء فى موقعه<br />فى كل مناقشه لكل موضوع فى هذا الموقع يخرج المتحاورون عن الموضوع الرئيسى بسبب رسائل الشرشحه والسباب ـ عوده الى الارشيف الخاص بالموقع ستجدون آن آغلب المواضيع آنتهت نهايه دراميه بسبب تلك الطريقه فى الحوار ولا يصل المتحاورون الى آى نتيجه.<br />تفتكرو الطريقه دى ممكن تخلى آى بلد فى الدنيا يتحررمن آى حاجهآو يتقدم<br />قد آختلف معك فى الرآى ـ لكن مش معنى كده إنك تسلسلى آو آسلسلك<br />وربنا يهدينا ويهدى الناس<br />الاختلاف فى الرآى لا يفسد للود قضيه"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

[[comments]]
order = 12
subject = "تحية ...وتوضيح"
author = "انسان حقيقى"
posted = "2006-06-22"
text = "فى البداية انا بحيى وباخلاص كل من اتفق او اختلف معى فى الراى واؤيد واردد ان اختلاف الرأى لا يفسد للود قضية وانا فعلا احب بل واعشق الحوار الحر الجاد القائم على فكر بدون مهاترات او سباب.<br />ثنيا احب اوضح انى ولله الحمد لست ممن يحملون فكرا متطرفا او ميولا نقدية (عمال على بطال) لا والله الا انى احب ان احق الحق قدر ما استطعت واعلى القيم ومعايير الاخلاق التى اخاف عليها الان من الاندثار مع ثورة الحريات التى اساء الكثيرين للاسف فهمها ولهم العذر لان كل ما عاناه او عانته الشعوب العربية جميعها من كبت سياسى ودينى احيانا لابد من يكون له سلبيات من هذا النوع ..لكن عندى امل ان نجتاز ردة الفعل العكسية هذه ونزن ما نرى وما نسمع بميزان حساس يمكننا من فهم معايير الحرية الحقيقية .<br />وللجميع منى التحية والسلام"
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152312/http://masr.20at.com:80/article.php?sid=554"

