[[comments]]
order = 2
subject = "اتفرجوا علي قصايد المدح لولي النعمة في مقابلات الط"
text = "بصراحة مش عارف أقول حاجة بعد اللي سمعته من الدكتور عبد المنعم أبو الفتوح .............<br />دي الناس بجداللي ممكن تهز العالم كله بكلمة واحدة لكن بقلب صادق و شجاعة رهيبة .<br />بس سؤال لينا ..... مش مكسوفين من اللي بنسمعه ده؟؟<br />إيه مفيش أي إحساس خالص ؟؟ ده واحد وقف أدام رئيس الجمهورية وقال الكلام ده...أمال إحنا مبننطقش بكلمة واحدة بس أمام الدكاترة و الأساتذة و......<br />و ظلمة اليومين دول ؟؟؟؟<br />بنخاف نتحرك في مظاهرة أو وقفة عشان عشرات العساكر اللي واقفة ! ! ! .... بالرغم إننا لو نعرف هم أد إيه خايفين مننا ما كنا نخاف منهم أو نعمل ليهم حساب .... من كبيرهم لصغيرهم... و الدليل الآلاف اللي بتخرج من عساكرهم وجنودهم و .... عشان إيه؟؟؟؟عشان كام واحد لا معاهم سلاح ولا بينادوا بإنقلاب .... لكن بيقفوا وقفة بسيطة يعبروا فيها عن غضبهم عن التنازلات المستمرة والمهانات والخيانات المتتابعة.....<br />و بعد كده نسأل ليه كل اللي إحنا فيه ده؟؟؟<br />لأن زمان وقف طالب و قال كلمة زي دي لرئيس الجمهورية أما الآن فاتفرجوا علي قصايد المدح لولي النعمة في مقابلات الطلبة كل سنة ..... علي فكرة نفسي أكمل لقاء واحد من لقاءات الزعيم الملهم مع الطلبة لك مس قادر أتحمل مش عارف ليه....حد يعرف منكم؟؟؟...<br />كفاااااااااية<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري .<br />mohamedmat@hotmail.com"
archived = "2005-03-19"
capture_url = "https://web.archive.org/web/20050319092303/http://www.20at.com:80/article.php?sid=1001"

