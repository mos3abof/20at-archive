subject = "غلطة الدكتور"
text = "لنعرف غلطة الدكتور أبو الفتوح علي الرغم من بطولته في هذه المناسبة الجليلة خلونا نشوف ماذا قال حمدين صباحي في نفس القابلةز حمدين تحدث عن قضية عن فقر عن جوع وعن ناس وعن مستقنل بلد لكن الكتور أبو الفتوح اختصر ذللك كله في شخص الشيخ الغزالي رحمه الله وأعطى بذلك هدية مجانيه للسادات رحمه الله ليهاجم الجميع وصدق من قال اكل جواد كبوة"
