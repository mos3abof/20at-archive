author = "الى المعلق رقم 1"
posted = "2009-08-18"
text = "كل واحد بيحكم على اد فهمه يا اخي الكريم<br />الكلام دا لو احنا فيه حد بيحطمنا عقليته اقتصادية<br />لكن ولاد الجذمه القديمه اللي هما بتوع ثورة 23 يوليو بيحكمونا بعقلية الثكنه العسكرية<br />الثكنه العسكرية او المطار العسكري اهم حاجه فيه الامن<br />لذلك حولوا مصر كلها الى ثكنه عسكرية او مطار عسكري<br />امن دولة وامن مركزي وامن عام وامن العاصمه وامن الطرق وعشرين ولا تلاتين جهاز امن<br />طول ما انت ما شي في الشارع تلاقي فرق جيش بتتنطط<br />لكن لما يجي واحد بقا يحكم عقليته اقتصادية اصلا زي مين كده<br />زي حكام دبي<br />حكام اقتصاديين<br />في 30 سنه تحولت دبي من شوية تراب الى اكبر مركز مالي عالمي<br />لان الحكام اقتصاديين<br />مش شوية ضباط جيش ولاد احبه ما يعرفوش غير لليمين در معتدل مرش<br />جتهم نيله<br />وحكام دبي دول كانوا بيمشوا حافيين وما عندهمش بترول<br />وحولوا دبي الى اكبر مركز مالي عالمي"
archived = "2009-08-19"
capture_url = "https://web.archive.org/web/20090819141850/http://www.20at.com:80/masr/ebn-balad/12973-2009-08-18-12-57-16.html"

