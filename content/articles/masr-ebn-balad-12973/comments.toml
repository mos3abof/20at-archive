text = "أولا الحمد لله الذى عافانا مما ابتلى به غيرنا … ونعرف اد ايه احنا فى نعمة … واكيد فيه غيرها ملايييييييييين فى شعب تخطى الفقر المدقع فيه ثلثه<br />ثانيا:نفى اعرف بتاع القرية الذكية والغبيه دا … ما سمعش عن سكان المقابر ؟؟؟ مايسأل مره … بلاش ينزل هو…!!!"
