author = "للة يا محسنين"
posted = "2009-08-18"
text = "يا عم حكاية للة يا محسنين هتحل اية<br />عندك مليون مصرى يسكنون فى المقابر وياكلون من الرحمة على الاموات<br />عايز تحل مشكلتهم<br />اعمل زى اسرائيل جنبك<br />اعمل مستعمرات سكنية فى صحراء سيناء واعمل بجانبها شوية مصانع اسمنت وزجاج وتقطيع رخام وافتح فرص عمل لهم هناك<br />احنا اغبية لية<br />لية ما بنعملش زى اسرائيل فى تعمير الصحراء<br />انما هتعطى سكان القبور حسنة وشوية تبرعات تحل مشاكلهم النهاردة طيب بكرة هيعملوا اية<br />الدولة دى ماتت<br />فرحانين انهم بيمشوا فى الشوارع فى عربيات مصفحة وحولهم جيش حراسات والشعب ياكل فى بعضة<br />اتعلموا من اسرائيل<br />انقلوهم الصحراء<br />يلعن ابوكم"
archived = "2009-08-19"
capture_url = "https://web.archive.org/web/20090819141850/http://www.20at.com:80/masr/ebn-balad/12973-2009-08-18-12-57-16.html"
