[[comments]]
order = 2
subject = "شوية غيره !!!!!!!"
author = "يا ريت يبقى فى شوية غيره على الرسول الى تعب عشان يوصلنا الرساله و حتى لو كنا ضعاف دلوقتى مشمعقول نقول الصحيفة اعتذرت وخلاص"
posted = "2006-02-17"
text = "الى موش قلبه على الرسول مايستهلش شفاعته هو هايشفعلناليه بقه<br />الجنون هو عدم اخذ العبره من هذا الموضوع ولتكن فرصه لمراجعة النفس يا مسلمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142447/http://www.20at.com/article2.php?sid=457"

[[comments]]
order = 3
subject = "يعني ايه اعتذروا وخلاص"
author = "sweet_princess"
posted = "2006-02-19"
text = "لا الاعتذار نفسه مش كفايه الناس دي لازم تعرف يعني ايه اهانة اشرف البشر على يد حثالة البشر واحنا مش هنيجي لشوية خنازير ونقول طالما اعتزروا خلاص لا دا لازم يكون فيه رد فعل اقوى من كده على يد يد الدول الاسلاميه يعني الدول العربيه على الاقل لو عندها دم كانت سحيت السفراء يتوعها من الول دي واعلنت احتجاج رسمي عشان نبيهم لكن هنقول ايه ؟ ومستغربين اننا في ديل الامم وبناخد علومنا كلها منهم بعد ما كنا احنا اساس علومهم دي كلها وعشان كده اي عالم كويس عندنا لو ماعرفوش ياخدوه لنفسهم بيموتوه زي على مصطفى مشرفه وسميره موسى وواحد تاني برضه فى الذره اسمه رشدي ابو زهره يبقى ابن عم جدي ابو ماما"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142447/http://www.20at.com/article2.php?sid=457"
