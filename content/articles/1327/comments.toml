author = "طاهرة"
posted = "2006-02-17"
text = "عليك نور<br />صح لانهم هم اسيادنا مهما حصل<br />وبعدين خلاص يعنى ما اعتذرت الجريدة عاوزين اية تانى<br />على راى اسامة انور عكاشى عاوزينهم ينطقو الشهادتين<br />دانتو صح عالم مجانين"
