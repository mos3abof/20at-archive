[[comments]]
order = 5
subject = "بدون عنوان"
author = "من غير تصريحات عنترية ..من سيتحمل هذا الكم الهائل من المواطنين أو اللاجئين في بلاده ..ليس هذا فقط ..بل في الشارعو و في ارقى شوارع العاصمة و أكثر حيوية على الإطلاق"
posted = "2006-01-04"
text = "من سيتحمل انتشارالاوبئة و الامراض في بلاده لمدة 3 شهور<br />من سيتحمل مناظر مؤذية و غير أخلاقية ..ولمن يدافعون عنهم ...هل ستتحمل ان ترى من يقضون حاجاتهم أمام سور مدرسة اطفالك؟!<br />هل ستتحمل ان ترى أنت أو شقيقتك أو ابنتك مجموعة من الهمج يمارسون (العلاقات الخاصة و الحميمية بين الأزواج)في الشارع!!!!!!!!!<br />من سيتحمل اعمال البلطجة و التخريب التي كانوا يقومون بها هؤلاء اللاجئون؟<br />من سيتحمل مشاجراتهم و تحرشهم بالنساء في الشارع ؟من سيتحمل شجاراتهم ؟ من سيتحمل بلطجتهم و تسولهم في الشوارع و فرض الاتاوة على اصحاب المحلات في المنطقة؟<br />من سيتحمل تلويثهم و تخريبهم لأفضل ميادين القاهرة ؟!! فقد جعلوا من الحديقة ...خرابة ومزبلة ؟!!!<br />وجعلوا سور المدرسة مبولة عمومية مكشوفة في الشارع<br />لماذا تخلطون الاوراق ..و تقارنون بعوطفكم استقبال الأنصار للمهاجرين ؟؟ كيف ؟ هل مارس اهل مكة أفعال اللاجئين السودانيين في مصر؟!!!!!<br />المسئولية مسئولية المفوضية أولا ...ثم كان الواجب من اللاجئين احترام البلد الذي استضافهم فكما تعلمون انهم كانوا \"واكلين شاربين نايمين في خير مسجد مصطفى محمود\"<br />كما ان رغبة هؤلاء كانت السفر إلى كندا و دول اوروبية ....فهم رافضين ان يعودوا إلى بلادهم رغم تحسن الاوضاع هناك<br />إذن لا مبرر للجوء السياسي ..و إن كان هناك مبرر للجوء السياسي فهذا شأن يخصهم و المفوضية ..أما مصر...فألف شكر لها ان تحملت همجيتهم إلى ذلك الوقت<br />دمتم سالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125640/http://www.20at.com/article2.php?sid=195"

[[comments]]
order = 6
subject = "علينا بضبط الامور وعقلها"
author = "حسام الدين اسماعيل محمد"
posted = "2006-07-26"
text = "يجب ان نتبع فى كل امور حياتنا اسلوب ضبط الامور وعقلها كما علمنا ديننا فاذا كان هناك قوانين تضبط اسلوب معيشة اللاجئين هنا فى مصر فلن تجد ادنى مشكله ولكن فى الحقيقه انه لا يوجد لا ضابط ولا رابط لاى شىء وان كنت انت كمواطن مصرى ينتظر حقه ولا ياتيه فلن يجد اللاجىء اى حق لجؤ الا اذا كان قد اتى بثروته معه .<br />ولكم جزيل الشكر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125640/http://www.20at.com/article2.php?sid=195"
