[[comments]]
order = 0
subject = "مصر أم الدنيا"
author = "و الله العظيم مصر بلد جميل جدا بشعبها . بجد . كفاية ان شعبها مستحمل السوادنيين بكل اللى بيعملوه فيها و بالوظايف اللي بياخدوها من شبابها."
posted = "2006-01-04"
text = "يا جماعة انا ساكن في عين شمس و دي منطقة من أكثر المناطق اللى فيها سودانيين و خصوصا بتوع الجنوب و ماتتخيلوش المناظر اللى بيعملوها في الشوارع غير انهم بجد ماليين شوارع عين شمس ، بيعملوا تجمعات رهيبة ناهيك عن ريحتهم و عن غلظتهم في التعامل مع الناس و ناهيك كمان عن خناقاتهم مع بعض.<br />روح كده شارع عين شمس الساعة 12 بالليل صدقني مش هتعرف انت في مصر و لا في السودان من كتر السودانيين اللى مقفلين القهاوي و الانترنت كافيهات و بعد مايخلصوا سهراتهم في الفجر يطلعوا يمشوا في الشوارع بهذا الكم الهائل طبعا يصحوا الناس من نومهم من أصواتهم العالية خصوصا لو كانوا بيتخانقوا و هما خناقاتهم عجيبة مفيش عندهم حد بفض الخناقة زي عندنا بل بالعكس بيسيبوا الاتنين اللي بتخانقوا يضربوا بعض لغاية مايقطعوا بعض و هما يكتفوا بإنهم يعملوا حواليهم دايرة و يشجعوا اللى يضرب التاني أكتر لغاية ماييجي البوليس يفض الخناقة. بالذمة بقى دول لاجئين و لا بلطجية؟!!!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125640/http://www.20at.com/article2.php?sid=195"

