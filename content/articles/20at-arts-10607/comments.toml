text = "بوجهة نظري وبحكم إني تونسية إن هالاشهار لم يأثر فينا بنسبة حادة جداا وندكره الا لسبب التسلية والترفيه عن النفس فإلي متي يبقي الانسان يفكر في همومه ومشاكله ويسمع كل مرة مشكلة من مشاكل فيجب عليه ان يسلي نفسه ويرفه عنها عاد علي الاقل نحنا نسلي نفسنا بالشكولاطه مو مثل اغلب البلدان العربية بدون ذكر اساميهم يسلون انفسهم بالرقص والغناء امام الكميرات وانا متأكدة من ان اللي كتب هالمقال بالغ جداا فيه وبصورة ملحوظه بعد أتمني من صاحب المقال ان يراجع مقاله دوون تهميش صورة المجتمع التونسي حسبي الله والنعم الوكيل"
