text = "لا حول ولا قوة الا بالله… انا مش عارف الموقع العجيب ده شغال ازاى.. ساعات بيبقى فيه مواضيع جادة وهادفة وجميلة… وساعات بلاقى مواضيع هبلة ومتخلفة زى الموضوع العبيط ده…شوكالاتة ايه واهالينا فى غزة بيموتوا..<br />اللهم انصر اخواننا فى غزة.<br />اللهم انصر الاسلام وأعز المسلمين.<br />حسبنا الله ونعم الوكيل."
