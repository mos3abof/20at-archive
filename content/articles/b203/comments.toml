subject = "هذالواقع"
author = "منى"
posted = "2006-01-16"
text = "بصراحه هاللغه كثير مخربطه بس لازم نتفاهم مع هالعماله ولازم يكون بينا تفاهم خاصه ان ثلاث ارباعهم غيرمتعلمين فالحوارمعدوم فبحكم طبيعت عملي اطريت اتعلم اوردو وبقلاديشي حتى اقداتفاهم معهم خاصه بموسم الحج خاصه لمى يكون مريض ومايعرف يتكلم لاعربي ولاانقليزي بجد مشكله بس بحكم التعامل اليوم اتعلمت منهم وصرت اقرقرسيم سيم هزا نفر حتى مرات اغلط بالبيت واكلمهم بنقالي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132431/http://www.20at.com/article2.php?sid=203"
