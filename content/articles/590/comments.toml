subject = "رسالة للحاطة ناس بيئة"
author = "مرام"
posted = "2006-08-06"
text = "الحمد لله احنا مش من الناس هاي بس مهما يكونوا بضلوا ناس متلناوهدا الحكي بحكي للحاطة ناس بيئة في تعليقها بس بحكيلها انها اتشد حالها اشوي ومتتكبرش لانوا اخرتها راح اتكون مش منيحة وبدي احكيلك شو حكة الرسول (ص) من كان في قلبه ذرة تكبر حرمت عليه الجنة فخليكي متواضعة احسن لشخصيتك بس ما تزعلي مني لانوا هاي اعطيتك اياها نصائح من اختك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112626/http://www.20at.com/article2.php?sid=1120"

