[[comments]]
order = 1
subject = "هوووووبه الطفسه"
author = "هوووووووووووووووبه"
posted = "2006-08-03"
text = "الموضوع دا لمس حاجه فيه , الطفااااااااااااسه<br />والله بصرف النظر عن كونها مجرد اكل<br />كمان ثقافه شعوب اه بقي غتاته شعوب دي وقفالي في الزور, الاكل الباكستني مثلا اغلبه مشطشط علي الاخر مجرد شطايه صغننه برجع , زي الاسباني مثلا كلو شطه حته علي الحلويات ..<br />واختلاف عمايل الكسكسي مثلا , المغربي عن المصري .يووووووووه بقولكو لمس حاجه فيا<br />غير اني طفسه بعيد عنك واشكر الكتاب لانهم بكدا رجعولي كرامتي بعد مقاومه اكس لارج ..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112626/http://www.20at.com/article2.php?sid=1120"

[[comments]]
order = 2
subject = "م"
author = "أخطاء على العشاء:"
posted = "2006-08-04"
text = "1: التحدث وفى فمك طعام<br />2: إمساك السكين وكأنها خنجر والشوكة كأنها تشيلو ووضع ادوات الاكل على الطاولة<br />مباشرة بعد استخدامها<br />3: وضع شنط اليد والمفاتيح والقفازات وغيرها فوق الطاولة<br />4: انهاء اكلك قبل الجميع او بعدهم<br />5: تنفيض الفوطة لفردها ووضعها على الطاولة قبل انتهاء الوجبة<br />6: الميل بالجسم للامام او الى الجانب او الميل بظهر الكرسى للخلف<br />7: تسليك الاسنان<br />8: ترك بقع احمر الشفاه على الكوب أو الفوطة<br />9: التدخين , انتظر حتى انتهاء الوجبة ويرجى عدم استخدام الاطباق والاكواب<br />كطفايات للسجائر<br />10:وضع الزبد على الخبز كله \u0013اقطع كل لقمة وضع عليها الزبد عند اكلها<br />كوارث العشاء:<br />1: اذا سكب منك شئ على الطاولة ، لا تقلق كثيرا نشفه بفوطتك واطلب فوطة اخرى<br />2: اذا سكبت شيئا على شخص ، اعتذر واعرض ان تنظف ملابسه على حسابك فى التنظيف<br />الجاف ، ولكن اترك الطرف الاخر يقوم بالمسح والتنشيف<br />3: عند التجشؤ ، ضع فوطتك على شفتيك وقل \" اسف \" دون ان توجه كلامك لاحد بعينه<br />4: السكاكين والملاعق توضع على اليمين ، والشوك والفوط على اليسار والسوائل على<br />اليمين والجوامد ( كصحن الخبز) على اليسار<br />5: استخدم الفضية من الخارج إلى الداخل<br />6: استخدم حافة صحن العشاء لوضع الخبز إذا طلب احد صحن الخبز الخاص بك<br />7: اكبر اخطاء عشاء البوفية هو أن تملأ صحنك أكثر من اللازم<br />8: لا تلفت الانتباه إلى اخطاء العشاء التى يقع فيها الاخرون ولا تبالغ فى<br />اعتذارك عما تقع انت فيه من اخطاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112626/http://www.20at.com/article2.php?sid=1120"

