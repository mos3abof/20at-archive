[[comments]]
order = 5
subject = ""
author = "نفس التجربة"
posted = "2009-07-20"
text = "فى قريتى قام شاب جزار بذبح جاموسة وباع كيلو اللحم ب 25 جنية وكان ذلك من ستة اشهر وحاربة الجزارون الاخرون الذين يبيعون الكيلو ب 36 جنية بالاشاعات وقالوا عنة انة بيدبح عجول وقيع ومريضة وعجوزة وطلعوا فية القطط الفاطسة وبلغوا مباحث التموين والطب البيطرى لانة بيذبح خارج السلخانة ولكنة لا يزال يبيع الكيلو ب 25 جنية<br />اما الناس المرتاحة فى القرية<br />فكل الاخوات 3 او اربعة اخوات بيشتركوا فى شراء عجل ب 3 الى 4 الاف جنية وبيدبحوة ويسلخوة ويقسموا اللحم بالتساوى بينهم وبيشيلوا اللحم فى ديب فريزر ولما يحتاجوا لحمة فى وقت بيطلعوها من التلاجة وبيقف الكيلو فى حدود 20 جنية الى 25 جنية<br />والناس ممكن تتفق وتعمل كدة<br />اشتركوا فى عجل وادبحوة وشيلوا اللحم فى التلاجات"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727202011/http://www.20at.com:80/masr/2khbar/12704-2009-07-20-06-46-31.html"

