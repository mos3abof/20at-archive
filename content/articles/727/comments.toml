[[comments]]
order = 0
subject = "اه يا نوم"
author = "صايع وقديم"
posted = "2006-06-19"
text = "النوم نعمه مبيحسهاش اللي طلعان عينيه و بيشتغل شغلانتين صبح و ليل مطحون و بيناملوا في اليوم بالكتير 4 ساعات<br />يا سلام لو عندي اجازة اسبوع انام فيها ليل ونهار و اقفل التليفونات واعمل بيات شتوي او صيفي مش بس نوم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114623/http://www.20at.com/article2.php?sid=957"

[[comments]]
order = 1
subject = "الموضوع يحتاج لتنظيم"
author = "حسين العسقلاني"
posted = "2006-06-19"
text = "في الحقيقة الموضوع يحتاج إلى شيء من التنسيق لأن العمل له وقته والنوم له وقته أما أن يكون الموضوع بشكل عشوائي فهذه هي الفوضى التي لا يرضاها الجادُّون أبدًا... ولا أحد يحزن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114623/http://www.20at.com/article2.php?sid=957"

[[comments]]
order = 2
subject = "احلي تعسيله"
author = "محمد المصري"
posted = "2006-06-20"
text = "انا بصراحه يا جماعه مقدرش استغني عن تعسيله كل يوم الصبح دي احلي حاجه في الدنيا بس المشكله انه لازم تلاقي حد رخم بيصحيني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114623/http://www.20at.com/article2.php?sid=957"

[[comments]]
order = 3
subject = "النوم سمة البال المرتاح"
author = "عابر سبيل"
posted = "2006-06-20"
text = "لا ينام الا من كان باله مرتاح وهانئ، فالنوم نعمة لا يعرفها الا من حرم منها بسبب الفكر مهماكانت الاسباب، والراي عندي من وجد فرصة للنوم فلينتهزها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114623/http://www.20at.com/article2.php?sid=957"
