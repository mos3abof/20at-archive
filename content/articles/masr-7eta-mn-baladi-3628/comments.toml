text = "قبل أي حاجه\"اللهم اجعل كلامنا خفيف عليهم\"<br />\"موقف براء بعد المقال\"<br />المشهد الأول:<br />براء وهو في البيت وفجأه(دب.. دب.. دب طاخ ..طاخ.. طاخ)<br />براء:ايه ده مين البيخبط كده؟!<br />اللدخل(سوري اللبيخبط):كل(طاخ)حاجه(دب)تعرفها(تران)في(دب)الوقت(طاخ)المناسب(دب)<br />(موسيقي تصويريه \"يا عيني يا عيني ياعيني علي الولا\")<br />المشهد الثاني:<br />(براء في علبه سوده\"ملحوظه:وفقا لرأي بعض المؤرخين أن العلبهالسوده تبئا عربيه\" وبتمشي وفيها قبيلة قايمه بالواجب وصوت براء في أغنية الاثتاذ عبد الحليم \"ثواح\"مع القليل من الالم\"آآآآآآآآآآآآآه\")<br />براء:هوه في ايه؟<br />ايد ربنا يباركلها:طااااااااااااخ<br />براء:طب رايحين فين؟<br />رجل ربنا يخليها:ددددددددددددب<br />براء:يعني...طب...هوه احنا فين؟<br />دماغ زي العسل:ترانننننننننننن<br />(براء في غيبويه تامه)<br />المشهدالثالث:<br />(براء قاعد علي كرسي وباين ان هوه في أوضه وعينيه متغميه وايده ورجله مربوبوطين)<br />صوت غريب هافت:اسمك ايه<br />براءفي صوت هافت:براااااااااااء<br />نفس الصوت بصراخ:انت هتهزر يا بن ال....<br />براء في عجله:البراء أشرف(..ناسف علي قطع باقي الاسم لاسباب أمنيه ااااااقصدي فنيه..فتيه)<br />نفس الصوت:ايه الانت كاتيه علي النت ده؟<br />براء:ايه؟!!!!!أنهي موقع ..يعني ايه نت أصلا؟!!!!!!<br />الصوت :موقع(20at)<br />براء<br />hat is the meinning of 20at?<br />(\"دب.. طاخ.. طيخ.. اي \"عشان مطولش عليكوالحوار أخد أشكال كتيرة في النقاش طبعنننن براء أقنعه بوجهة نظره في الآخر)<br />المشهد79211356<br />عام 3020)<br />واحد ماشي في الشارع دقنه طويييييييييييييييله وشعره ملعبك وهدومه مقطعه راجع بيتهم(يااااااااااه ده طلع براء)<br />امضاء من زي اللزي أخوك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

[[comments]]
order = 87
subject = "جانا الفرح جانا"
author = "مواطن مقهور"
posted = "2006-03-08"
text = "بجد موضوع جامد جداااااااا بس انا شايفة انو من حقة يتجوز ننوس عين امة على الاقل يشوف ابنة قبل ما يموت او يتنش رصاصة ولا اونى اشك فى كده هما هيموتونا واحد واحد اصلا<br />المهم بقة اننا المفروض نفرح لية والمفروض كمان نقوم بالواجب انا بقترح اننا نلم بعض وناجر عربية ونروح نبارك وميمنعش يعنى نيجيب معانا قفصين فراخ على حمام وبيض وشوية زبده وفطير ماهو عريس بردو . بس يارب بس نلاقى بيض اصل انا بسمع ان غلى اوى ومفيش فى السوق . بجد ربنا يرحمنا ويقف معانا . وارجع واقول على راى صبحى شعبى الحبيب المهاود المطرمخ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

