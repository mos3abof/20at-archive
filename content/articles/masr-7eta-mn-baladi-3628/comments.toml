[[comments]]
order = 64
subject = "ألف ألف مبروك وعقبال الفرحة الكبري باستلام الحكم يا زعيم"
author = "مصري"
posted = "2006-03-03"
text = "استقبل المصريون والعرب خطوبة جمال مبارك بسيل من التعليقات المتنوعة تؤكد أريحيتهم المعهودة وسخريتهم المعروفة تربط بين السياسة والسلوك الشخصي، وبينما يقول البعض ان الحياة الشخصية لابن الرئيس مثله مثل أي شخصية عامة لا يجوز الاقتراب منها، وهو ادعاء صحيح في ظاهره، ولكنه قد لا ينطبق علي جمال مبارك في هذه الحالة، فجمال كان يستطيع أن يتكتم أخبار خطوبته إلي الآنسة خديجة كريمة المهندس محمود الجمال أحد أبرز رجال الأعمال في مجال المقاولات، لا أن يسربها إلي الصحف، كما يتكتم أخبارا أخري شديدة الأهمية مثل لقاءاته مع شخصيات إسرائيلية لأنها قد تسيء إلي صورته، وربما يري البعض أن خطوبة جمال تذكرنا بسيناريو زواج الملك محمد السادس قبل اعتلائه العرش مكان أبيه الراحل الملك الحسن الثاني يتكرر في مصر، فالزواج تأكيد للأهلية الاجتماعية في مصر، وشرط لاعتلاء العرش في المغرب، وشهد مــوقع العـــربية نت عشرات التعليقات أسفل خبر الخطوبة اخترنا منها هذه المجموعة.<br />بدأ أبو جاسم قائلا: ألف ألف مبروك وعقبال الفرحة الكبري باستلام الحكم يا زعيم أما مصراوي فلم تسعه الفرحة وأخذ يغني: خطابك كتير وقالولي تستاهلي الدهب واللولي.. مبروك يا جيمي.. بس ياريت تقول لسيدة مصر الأولي تبطل شوية المصاريف اللي بتصرفها علي المؤتمرات والكلام الفاضي علشان الشعب خلاص اتخنق أوي منكم واقتربت ساعة الحسم. أما خالد فتحدث بلغة أهل البلد شد حيلك يا بطل وخلف لنا حسني الصغير اللي هايمسك البلد من بعدك . لكن المصري المفقوع كما يسمي نفسه يسأل سؤالا استعصي علي عقلي الضعيف الوصول إلي إجابة له وهو: ليه الأخ جمال خطب بس ما اتجوزش علي طول.<br />الإجابة جاتلي من واحد مطلع علي بواطن الأمور، وقالي ان جمال محتاج يكوّن نفسه شوية، يعني فيه مصاريف فرح وشبكة والذي منه، يعني هو الراجل هايجيبهم منين، وكمان لازم يجيب شقة وعفش وغرفة نوم وطبعا الراجل مموت نفسه في الحزب الوطني ولجنة السياسات متطوع ما بيقبضش قرش واحد. تاني قالي لاحظت أن عمر خطيبة الأخ جمال اتولدت عام 82 يعني من ساعة ما وعيت علي الدنيا وهي شايفة حماها رئيس جمهورية. أخيرا تحيا جمهورية رجال الأعمال.. الست مبروكة لاحظت ملاحظة ذكية وهي: إن العروسة أبوها جمال وجوزها اسمه جمال عشان تطقوا زيادة . وكمل عليها أبو زياد: ربنا يهني سعيد بسعيدة ولا عزاء للشعب المصري المطحون والذي سوف يخرج غصبن عن عين اللي خلفوه في الشوارع احتفالا بزواج زعيمه الجديد واللي هو مش لاقي ياكل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

