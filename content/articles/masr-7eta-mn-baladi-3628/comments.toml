[[comments]]
order = 82
subject = "شفونيره فى الهزه"
author = "الاستاذ محمد حسنى مبارك"
posted = "2006-03-07"
text = "بأسم الشعب<br />امرنا نحن محمد حسنى مبارك<br />باجرائ محاكمه ديمقراطيه عادله على ان ان يكون الحكم كالتالى<br />سلخ المدعو براء سلخه بائنه و يتم توزيع الجته فى خمس محافظات نائيه ليكون عبره و عظه لكل من تتسول له نفسه ان يمس ابنى و حبيبى و عم الكل و رئيس الجمهوريه القادم غصب عن امكو الباشا عمكو و عم عيالكو يا كلاب<br />جمال ابنى البار بوالده<br />البند 2<br />رفع مصروف جمال الى نصف موازنه الدوله حتى يلتزم الشعب و يحترم نفسه<br />بند 3<br />تخصيص 70 مليون مواطن لتوضيب الشقه و عمل حمام سوبر لوكس للعروسين<br />بند 4<br />اغلاق الموقع و تشفيره بالشفره الحمراء<br />بند 5<br />عمل عمليه جراحيه لجميع من رد فى الموضوع يكون ناتجها عدم مقدرته على الزواج و على اطباء القصر الجمهورى مراعاه ذلك<br />جمال - الشعب- الوطن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

