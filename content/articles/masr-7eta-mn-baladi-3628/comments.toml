[[comments]]
order = 68
subject = "خلاص خطب"
author = "سمسمة"
posted = "2006-03-04"
text = "مبروك يا عريسنا<br />يا أبو شنه ورنه<br />يا واخدنا وراثه<br />أطلب واتمنى<br />وأخرج من جنه<br />أدخل على جنه<br />مش فارقة معانا<br />ولا هارية بدنا<br />ولا تاعبه قلوبنا<br />ولا فاقعة (.....)<br />يا عريس الدولة<br />أفرح وأتهنى<br />ما أحناش كارهينك<br />لكن هارشينك<br />ح تكمل دينك<br />وتطلع دينا<br />* القصيدة ألقاها شاعر الشعب بميدان طلعت حرب مساء اليوم الخميس، في أمسيةنظمتها حركة أدباء وفنانون ردا على منع النظام حفل غنائي الجمعة الماضية بحديقة الخالدين مخصص لأغاني الثنائي (إمام ونجم).<br />شارك في إحياء الامسية الشاعران الكبيران أحمد فؤاد نجم وسيد حجاب، والفنانون على إسماعيل وزينب احمد فؤاد نجم ورشا سالم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

[[comments]]
order = 69
subject = "رسائل محمول: مبروك يا عريسنا.. يا بوشنة ورنا.. افرح واتهنا"
author = "القدس العربي"
posted = "2006-03-04"
text = "رسائل محمول: مبروك يا عريسنا.. يا بوشنة ورنا.. افرح واتهنا:اليوم خطبة جمال مبارك.<br />تعقد اليوم في حفل عائلي خاص خطبة جمال مبارك علي الانسة خديجة الجمال وسط اهتمام صحافي وشعبي واسع نظرا للتكهنات بأنها قد تكون السيدة الاولي المقبلة في مصر.<br />وبالرغم من حرص العائلتين علي ابقاء حفل الخطبة في اطار عائلي خاص الا ان اخباره هيمنت علي العديد من الصحف ومواقع الانترنت المصرية.<br />وجاء فيها ان والد العروس وهو المقاول المعروف محمود يحيي الجمال قد اصر علي ان يقام حفل كبير لابنته الوحيدة خديجة والتي يناديها اصدقاؤها بـ موني ما جعل العريس يوافق ان يضم الحفل عددا من الاصدقاء المقربين.<br />واشارت المصادر الي ان الحفل سيقام في منتجع سياحي فخم في شرم الشيخ التي يفضلها الرئيس مبارك ويقضي فيها نحو ثمانية شهور من العام.<br />وسيبدأ الحفل في الظهيرة باجتماع عائلي ينضم اليه تباعا الاقارب والاصدقاء، ما جعل البعض يشبهه بالطريقة الامريكية في الاحتفالات.<br />ومن المنتظر ان يقام حفل موسيقي في المساء، الا انه من غير المعروف ان كان سيشارك فيه مطربون.<br />ولكن من هي العروس التي اقنعت اهم عريس في مصر بدخول القفص الذهبي، بعد ان بدا وكأنه مضرب عن الزواج خاصة انه يبلغ من العمر اثنين واربعين عاما ولم يسبق له الارتباط.<br />ـ انها خديجة محمود الجمال (24 عاما) .<br />ـ تخرجت من قسم ادارة الاعمال في القاهرة وتهوي عزف الموسيقي، كما تهوي الرياضة (مثل عريسها) ويقال انها عضو ناشط في فريق كرة القدم النسائية.<br />ـ تعرفت علي جمال اثناء مؤتمر سياسي عقدته الجامعة الامريكية العام الماضي، وتكررت لقاءاتهما في اطار العائلة والاصدقاء، حيث ان اثنين من اقاربها يرتبطان بصداقة قديمة مع جمال.<br />ـ برغم فارق السن بينهما الا ان مقربين من العائلة اكدوا ان بين جمال وخديجة تقاربا كبيرا في الافكار السياسية وغير السياسية.<br />ـ فستان الخطبة تم تصميمه خصيصا للعروس واحضر من باريس ويقال ان تكلفته زادت عن مئة وخمسين الف جنيه مصري (نحو 27 الف دولار امريكي). اما خاتم الخطبة فاختاره جمال من احد اشهر محلات المجوهرات في مصر، ويقال ان ثمنه بلغ 30 الف جنيه (تسعـــة الاف دولار).<br />وكان يفترض ان يلتقي فريقا الاهلي والزمالك ولكن تقرر تأجيل المباراة حتي ينشغل الناس في مصر بالمباراة ويتركوا جمال وخطيبته لشأنهما.<br />وانتشرت في القاهرة امس رسالة علي الهواتف النقالة عبارة عن ابيات منسوبة لشاعر العامية المعروف احمد فؤاد نجم تقول مبروك يا عريسنا يا بو شنة ورنة.. يا واخدنا وراثة افرح واتهنا . في اشارة الي التكهنات بأن الرئيس المصري يحضر ابنه لتولي سدة الحكم (بعد عمر طويل).<br />وتتحدث اوساط صحافية عن خديجة باعتبارها سيدة مصر الاولي الجديدة، وذهب بعضها الي ان الاهتمام الذي يحيط بحفل الخطوبة يتناسب مع حكم ملكي وليس جمهوريا.<br />والمعروف ان والد العروس هو احد اكبر المقاولين في مصر، وقد بني عددا من القري السياحية الي جانب بنايات وعمارات مهمة في القاهرة.<br />ورأت صحف معارضة ان مصاهرة الرئيس مبارك لاحد اكبر رجال الاعمال تكرس زواج السلطة والبيزنس الذي اصبح يميز ملامح السياسة والتركيبة الحكومية في مصر.<br />وبالرغم من نفي جمال مؤخرا انه يسعي او يرغب في الترشح للرئاسة الا ان القوي السياسية الاساسية في البلاد تتوقع ان يكون المرشح المقبل خاصة بعد ان تم تصعيده مؤخرا الي منصب الامين العام المساعد للحزب الحاكم، اثر ازاحة كمال الشاذلي وهو احد اهم رموز ما يعرف بـ الحرس القديم في مصر."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

