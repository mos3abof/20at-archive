[[comments]]
order = 54
subject = "حفل خطوبة جمال مبارك سيكون على الطريقة الأمريكية"
author = "علا محمود (المصريون)"
posted = "2006-03-02"
text = "يبدو أن التسريبات التي تمت خلال الأيام الماضية حول خطوبة جمال مبارك على الآنسة خديجة محمود الجمال ، كريمة رجل الأعمال محمود الجمال ، والمعروفة وسط العائلة باسم \" موني \" ، قد أدت إلى بعض التغيير في الأفكار حول حفل الخطوبة ، كما أن القطاع الأوسع من القراء الذين تابعوا الخبر الذي تسرب كان قد نسي السياسة وانشغل بما يمكن تسميته البعد الإنساني في الحدث ، وهو بعد لم يخل من إحساس مشارك بالبهجة ، وقد علمت المصريون أن أسرة العروس وخاصة والدها أصر على أن يكون هناك حفل لائق بابنته التي تحتل مكانة خاصة في قلبه وفي أوساط الأسرة كلها ، رغم الرغبة من طرف العريس في أن يكون الحفل محدودا ، وفي نطاق عائلي بحت ، وتتجه الفكرة الآن إلى أن يكون الحفل على الطريقة الأمريكية ، بمعنى أن يعقد الحفل من الواحدة ظهرا تقريبا ويستمر حتى مغيب الشمس ، ومن المرجح حتى الآن أن يكون الحفل في أحد الفنادق المرموقة في منتجع شرم الشيخ لضمان الخصوصية ، ولكنه سيقتصر على الأسرتين والدائرة الضيقة جدا من أصدقاء العروسين ، جدير بالذكر أن خديجة خريجة الجامعة الأمريكية ، وهي مشهورة باهتماماتها الرياضية ، ولعل هذا أحد الأسباب الإضافية للجاذبية بينها وبين جمال مبارك ، حيث من المعروف عن جمال حبه للرياضة وممارسته لها ، ومشاركاته العديدة في بطولات كرة القدم الخماسية ، كما أن خديجة من الأعضاء البارزين في الفريق المصري لكرة القدم النسائية ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

