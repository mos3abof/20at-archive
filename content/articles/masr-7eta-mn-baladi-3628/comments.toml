subject = "مباااااااارك"
author = "الجاااااامد"
posted = "2006-02-28"
text = "عارفين ليه هو أتأخر فى الجوازه ديه ؟؟!!!<br />معلش أصله كان بيكون نفسه !!!!<br />أصله كان أخد شقتين واحده فى أسوان والتانيه فى الاسكندريه ...<br />وكان بيفتحهم على بعض ....<br />وعارفين أبو خديجه يبقى مين ...<br />أنا أقولكم ...<br />هو صاحب القهوه اللى كان معدى عليها واحد فى الصحرى .. ولقى صاحب القهوه \" أبو خديجه \" حاطط 3 صور واحده لعبد الناصر وواحده للسادات وواحده لمباررررك<br />فسئله مين دول ؟؟؟<br />قله الاول صاحب الثوره ...<br />والتانى بطل الحرب والسلام ...<br />والتالت أبو شريكى فى القهوه ...<br />وعلى فكره يا براء جيمى هيزعل منك جدا وهيقولك \" يا وحش يا كخه كدا تكتب على الكلام دا والله لخلى بابا يبعتلك 1000 أمن مركزى و100 عربيه مصفحه و50 قنبله مسيله للدموع \" علشان متعملش كدا تلنى ...."
archived = "2006-11-02"
