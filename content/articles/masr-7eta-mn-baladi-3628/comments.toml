posted = "2006-03-01"
text = "المقال تحفة جداً بصراحة<br />بس عندي سؤال، هي سياسة عشرينات ليه غطت كتف خديجة وأمها، ما تخلوا الناس تتفرج وتتبسط، إنتوا معقدينها ليه يا جماعة<br />هتقولولي حلال وحرام، طب يعني إيه الفرق بين الشعر والكتف ما الإتنين عورة<br />شكراً يا جماعة"
