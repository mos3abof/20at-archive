subject = "وحش اوى يا براء"
author = "نيفين"
posted = "2006-03-05"
text = "اول مره متعجبنيش يا براء<br />وحش اوى<br />انت لما كتبت مواقف مصريه ساخنه ضحكتنا و علقناللك من قلوبنا بجد ان دا كحويس<br />لكن ليه حياه الناس الشخصيه<br />ليه التجريح<br />انا بتكلم عن تجربه اتحطيت فيها ف وقت مت الاوقات لقيت حياتى الشخصيه انتشرت بشكل ما بين الناس بسبب مشكله ما و مش هوصف دا بيضايق اد ايه<br />الا التجريح<br />لازم نحنرم ال privacy بتاعه غيرنا اكتر من كدا<br />اتكلم عن سياسته بس حياته الشخصيه لا<br />مينفعش"
