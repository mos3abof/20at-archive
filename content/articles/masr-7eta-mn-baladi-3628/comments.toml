posted = "2006-03-08"
text = "شكر خاص للاستاذ عمر اااااااااااااااا000سورى س من الناس<br />ملحوظة: على المشهد79211356<br />ان الاستاذ براء مستحيل يكون عايش لحد المشهد رقم 3 ازاى هيكون عايش لحد المشهد<br />انا ما قلتلوش يبطل يحلم بس بالعقل ازاى براء هيعيش شهر واحد ما كتب المقال<br />هئ هئ هئ هئ هئ دا انا كل امنيته فى الحياة ان براء يقرأ التعليق ويطمنى عليه"
