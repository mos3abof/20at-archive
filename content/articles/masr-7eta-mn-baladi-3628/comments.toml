[[comments]]
order = 41
subject = "ليه تعليق تاني بس بجد المره دي"
author = "sweet_princess"
posted = "2006-03-01"
text = "اولا :شكرا ليك يا عابر القارات<br />انت عرفت تقو ل اللي ما كناش قادرين نقوله وكنا كلنا بنداريه بالهزار وبالتهريج واحنا في الحقيقه بنغلي .<br />وليه كمان تعليق ع الاخت اللي شتمت وقالت علينا واطيين .<br />اولا: الله يسامحك<br />ثانيا :هقول ايه ...بجد مش لاقيه كلام هو قال كل حاجه خلاص .<br />بس احب انك تعرفي ان الموقع دا من المواقع القليله جدا اللي بتتيح لنا اننا نعبر عن راينا بحريه ضد انسان ظالم ضيع بلدنا وضيعنا معاها .<br />وخدي بالك كمان انتي واللي بيعترض على اسلوب الهزار والتريقه في التعليقاتبس احنا لازم نعمل كده بدال ماننفجر.<br />يعني شوفي مثلا فرح واحد زي دا لما ييجي يتجوز هيتكلف كام من دم الغلابه.<br />شوفي الفلوس اللي ممكن تتدفع في فرح زي دا تحل كام مشكله اسكان للناس اللي بتبت في الشارع او تعمل كام مشروع وتشغل الشباب اللي خلصوا شهاداتهم وبيندبوا حظهم.<br />واضح انك انسانه مرفهه ومش حاسه بمشاكل الناس .<br />عموما اللي اتكتب مش هيتمسح وطالما ماحدش قال كلمه مخله بالشرف او الدين (تبقى حرية الراي مكفوله للجميع ).<br />وبعدين هي دي طبيعة الشعب المصري بيجيب الضحك وخفة الدم من المصايب اللي بيتعرض لها .<br />ويمكن عشان كده احنا لسه عايشين وعندنا امل ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

