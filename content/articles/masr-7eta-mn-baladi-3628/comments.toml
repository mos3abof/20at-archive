[[comments]]
order = 60
subject = "تعليق على Bent Al-islam و : حسام الأبرق"
author = "الزيني بركات"
posted = "2006-03-02"
text = "اولا بالنسبة الى الاخت بنت الاسلام احترم رأيك و اقدره ثم ارفضه لا ادرى ما دلالة اشارتك بانك تعيشين فى الولايات المتحدة بس الشيء الوحيد اللى عايز اقوله انك لو من هذا الشعب لما قلت هذه الكلمات دا اولا بالنسبة لكاتب الموضوع اعتقد انه وقع فى خطأ فادح لا يجب ان يمر الا و هو وصفه لجمال انه عايز يصلح غلطته و ديه اعتبر قذف للمحصنات<br />حيرد و يقول انا مقلتش صراحه<br />حرد انا و قوله بس انت لمحت<br />و كل لبيب بالاشارة .......<br />بالنبة للاخ حسام الابرق اللى بيسأل عن الشعر و الكتاف و العورة<br />اقول له ان الفرق كبير بين الشعر و الكتاف لييييييييييييييييييييييييييه<br />اقولك ليه<br />الشعر دا عبارة عن باروكة يعنى عيرة انت مش شايف ان الاتنين نفس الباروكة و لا ايه<br />و بالتالى فأن الشعر الحقيقى انت مش شايفه فمتقدرش تتكلم<br />اما الكتاف فالظاهر ان كاتب المقال رأى انها الكتاف الحقيقية فدا طبعا حرام<br />و السلام عليكم ورحمة الله و بركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

[[comments]]
order = 61
subject = "معا نفهم الكوميديا"
author = "تبسم"
posted = "2006-03-02"
text = "سبحان الله..<br />للأخ صاحب التعليق السابق.. نفسي أفهم كيف نقرأ الكوميديا والكتابة والإبداع بشكل خاص..<br />أولا بالنسبة لقذف محصنات فأنا لا أظن أن وصف المحصنات في الفقة ينطبق على الآنسة خطيبة جمال.<br />أما بالنسبة لجملة أصلح غلطتي، فهي إفيه.. وهو ما أشك أنك تعرف إفيه..<br />الإفيه هو جملة غير واقعية، متهكمة، تعتمد بالكامل على \"الكذبة\" أو الخروج عن الواقع، وبالتالي فكل المشاهد إفيه غير حقيقية، وللكاتب أن يبدع كيفما شاء طالما أنه لم يقل أنها مشاهد حقيقية.<br />وبالتالي فهذا ليس قذفا للمحصنات يا أستاذ..<br />النقطة الأخيرة التي استوقفتني في بعض التعليقات هو اعتراض البعض على السخرية من جمال في أمر يخصه هو وحده..<br />الأسئلة التالية قد تفهمكم شيئا..<br />من أين سيدفع جمال مهر عروسه وشبكتها..؟<br />من أين سيأتي جمال بثمن القصر الذي سيعيش فيه ..؟؟؟<br />من سيدفع ثمن حفل الزفاف؟؟؟<br />من صاحب المصلة في تلميع جمال في الفترة الأخيرة؟؟؟<br />لماذا نقلق من جمال؟؟<br />لماذا نخاف منه؟؟<br />لماذا نتوقع جميعا أنه سيكون الرئيس القادم؟؟؟<br />ولماذا يحتل خبر خطوبة جمال كل هذه الأهمية؟؟؟<br />الحقيقة يا سادة أن جمال أصبح هو نفسه يتدخل في كل صغيرة وكبيرة في حياتنا.. وطالما هو يفعل ذلك فحياته مشاعا لجمهوره..<br />وهي قاعدة يعرفها الجميع، خصوصيات الحاكم مشاع للمحكومين.. ولا خصوصية لحاكم.. فطالما جمال مبارك هو الحاكم.. فسيظل دون خصوصية إلى أن يبتعد عن الحكم بيده.. أو بدمائنا نحن جميعا..<br />نا سي أقول حاجة مهمة قوي ..<br />أنا بكره جمال مبار قوي<br />ولازم كلنا\"نتعلم\" إزاي نكرهه..<br />معا نكره جمال وخطيبته.. لن تكونا حكمانا!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

[[comments]]
order = 62
subject = "تعليق على التعليق السابق"
author = "الزيني بركات"
posted = "2006-03-02"
text = "الاخ العزيز الذى لم يرشر الى اسمه او كنيته<br />اولا اثنى على انك بدأت تعليقك بسبحان الله<br />و ااحترم رأيك و اقدره ثم ارفضه ايضا<br />خد بالك تعبير محصنه لازم ترجع ليه فى المعجم لأنى لن اخوض فى معناه على الساحة<br />ثانيا لما بدأت قولك بكيفية قرآتى للأبدع و التى كنت تستغرب عليها<br />احب ان اوضح انى خريج احد كليات الفنون و ليس الابداع ان ترسم لوحة ما مثل الخروج من الجنة لمايكل انجلوا و تقول انى لا اقدر ابداع مايكل انجلوا و تمثال النبي دانيال وتقول ان دا ابداع الابداع ليه حدود<br />اما الافيه اللى افهمة فانت اعلم منى به لذلك لن اخوض فى معناه<br />اخيرا لعلك لاحظت انى لم اعلق على مشهد مثل قانون الضرائب و غيره و انما استوقفنى المشهد السالف الذكر. لما لمسه فى نفسى من معنى<br />اشكر لك حسن قراءتك و لو اختلفنا فى الرأي راجيا منك ان يكون اسلوبك فى النقد افضل من ذلك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

