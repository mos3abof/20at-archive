text = "يخواننا الراجل من حقه يعيش حياته<br />بس على فكره من حقنا احنا كمان اننا نعيش حياتنا<br />حياه طبيعيه من غير لادكتاتوريه ولا مهلبيه<br />على العموم سيبوه ياخد فرصته ف الخطوبه بس مش اى حاجه تانيه<br />لانه لو خد فرصته ف حاجه تانيه يبقى ولا حتى عيال عيالنا هيعرفو يخطبو زيه<br />وفى الاول وفى الاخر ...:<br />من حق الكبير يدلع"
