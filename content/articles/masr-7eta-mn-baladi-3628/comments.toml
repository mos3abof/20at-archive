subject = "جيمى يأمر ...وانا اعمله فرح محصلش !"
author = "الشمحطجى"
posted = "2006-02-28"
text = "ولازنى زعلان من جمال علشان متصلش بيه وعزمنى ..إلا ان الاخوة والصحوبية اكبر من كده ...مبروك يا جيمى والله فرحتلك ... يمكن تتكن وتتشغل شوية بمراتك وجوازك وتروق دماغك من مشاكل الناس و قرفهم ..!!<br />وليك عليه يوم فرح هتكفل بيه من طقطق لسلامو عليكو<br />اجدعها بيره و أنضفها بانجو ...<br />وهجبلك الواد العربى الصغير يحيى الفرح و كوثر الرقاصة وصبحى جوزها الطبال ..!<br />بس قولى يا جيمى<br />هتعمل الفرح فين ...فوق السطوح برضك زى فرح علاء أخوك ...وبل على نصة الحارة ؟!<br />انا رأيى إنك تعمله على ناصية الحارة اوسع علشان الناس إلى هتيجى ...<br />دى هتبقى ليلة العمر ...عقبال البكارى !"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

[[comments]]
order = 20
subject = "سمعينا زغروته ياحاااااجه والنبي (كلاكيت تاني مره )"
author = "sweet_princess"
posted = "2006-02-28"
text = "والله ما كنتش اعرف ان ننوس عين امه هيتجوز .<br />والله كنت فاكراه متجوز اتريه طلع عانس لحد دلوقتي بس كويس ان ربنا مد في عمر مبارك عشان يشوفه في بيت العدل .<br />وعموما برضه اهو مننا وعلينا وياما كل على قفانا عيش وملح هووالدلعدي ابوه (لو كان اللي بيطفحوه اسمه عيش وملح ) (نخليها بيتيفور وسيمون فيميه عشان مايزعلش ) .<br />وطبعا الفرح هيتعمل في ارقي فنادق فينيسيا .<br />اااااااه ما هو مش معقول يتعمل في مصرعشان ماحدش ينشه رصاصتين يجيب اجله هو و(اسنغفر الله العظيم بعيد بعيد)عشان بييجي ع السيره .<br />اقوللك يا جيمي اعمل الفرح في مبنى الامن المركزي والمعزيم لازم تتفتش تفتيش ذاتي قبل ما تدخل (استحياط يعني )<br />اما انا عن نفسي بقى يعني لو كان الفرح هيتعمل في مصر (في المشمش وابقو تعالو قابلوني بس ابقوا فكروني اقوللكم هنتقابل فين ).<br />بمنماسبة العروسه (((ايه العفانه دي ))).<br />لا يا جيمي زوقك معفن قوي ( بلدي بلدي )<br />ولو اخدتو بالكم معايا شويه وركزتو كويس في الصوره هتلاقوا العروسه مبينالكم العين الحمرا من دلوقتي.<br />الكلام دلوقتي للحاجه ام العروسه (أأأال حاجه ااال).مبروك يا ختي((( ع الجوازه الشيك بين وزه واحلى ديك ))).<br />زعشانك انتي بس وحياة معزتك عندي هزغرط ..........وسسعوا ..<br />لولولولولولولولولولولولولولولولولولولولولولولولولولولولولولييييييييي.<br />(قطعتي نفسي ربنا يهدك ).<br />يا للا سلام .<br />ماشي يا بني ادمين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

[[comments]]
order = 21
subject = "42 - 24 ( مش خطة الجوهري )"
author = "أكرم"
posted = "2006-02-28"
text = "ايه ياعني لما جيمي يتجوز ؟؟؟<br />على الاقل يبقا مش فاضي لخراب البلد طوال ايام الاسبوع ( الاحد و الخميس ماتينيه 8.30 )<br />اما عن السبق الصحفي يا عم براء فقد سبك بها عادل حمدوه ( ناس واصله يا ابويا ) فقد نشر في جريدة الفجر ( بفتح الفاء او ضمها لا يهم ) مش فاكر بالظبط في اي عدد بس هي في الاعداد الاولى لاني مشتريتش غيرهم و حدد بالظبط ان خطيبة جيمي هتكون سيدة مصر التانية ( و التلاتين ) الانسه ( حاليا ) خديجة الجمال ( الجمال ده مقاول مش بتاع لحمه جملي )<br />تقلت عليكو مش كده ؟؟<br />نسيت اقولكوا العنوان ده معناه ايه ؟؟<br />42 سنه عمر جيمي<br />24 سنة عمر خديجة الجمال ( بنت المقاول )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

