[[comments]]
order = 79
subject = "الى أخى العميل الاجنبى"
author = "عابر القارات"
posted = "2006-03-06"
text = "خى العميل الاجنبى أنا معجب جدا بتفاؤلك و لكن هل سمعت عن شئ إسمه الاحباط (و ليس من تحت الباط) و لكن ما جدوى الاخلاص إذا كان ما سوف تعمله قد ضاع هباء من قبل حتى ان تفكر فيه و أخذه منك من لا يستحق .... يا أخى العميل أنا أعتقد لو هناك إحصائية عادلة فأنا متخيل أنا أمام كل جنيه أكسبه من عرق جبينى هناك عشرة جنيهات تذهب إتاوة الى جيوب الحيتان و الكبار و المحاسيب فأنت تعمل لكى يعيشوا و تكد و تتعب لكى تنتفش كروشهم و أخر المتمه يغرقوك فى عبارة لتأكلك الاسماك أو يصبوا عليك الجاز و انت فى قطار أو مسرح لكى تحترق أو يدوسوا لك السم فى الخضار و الفاكهه لكى تموت مسموما .... و فى الاخر تقولى اعمل بإخلاص .... أنا و الله من أشد المنادين بالاخلاص و التفانى فى العمل لكن ماذا أعمل و قد كسروا أرجلى و ذراعى و من قبلهم كسروا نفسى .... فلينتقم من الله كإنتقام عاد و ثمود"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

