text = "السلام عليكم : الفكرة جميله جدا ولكن الطريقه محتاجه اسلوب ازاي؟؟؟ ان انتقد شخص في تصرفاته هذا هو النقد الصح<br />واقول الغلط في تصرفاته واقول كيف يكون الصح هذا هو النقد وهذه اخلاقياته انما اتتدخل في خصوصيات اي شخص هذا هو الفلس في النقد عزيزي البراااااااء ياريت يكون لك رد في امان الله"
