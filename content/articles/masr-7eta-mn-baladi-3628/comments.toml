subject = "فيلم سيما"
author = "ايمن الضبع"
posted = "2006-03-02"
text = "الحقيقة نفسى يجى اليوم اللى نقدر نفكر بالشكل الحر ده اكيد هانتغير كتيير للاسف بقالنا اكتر من قرن مابنقدرش نفكر بهذا الاسلوب الساخر ودة لااننا كنا دايما بنحس انى فى عشر عساكر بيراقيونا وبيكتبوا كل حاجه بنفكر فيها عشان يحكمونا فى افكارنا ويسجنونا لمجرد اننا فكرنا فى ال البيت \"اهل الحكام اللى بيحكموا البلد\" لذلك ادعوا للمذيد من هذه الافكار الساخرة واللى بتعبر عن احوال حقيقية ولكن بشكل مبالغ فية وهو شئ يبعث على الضحك والتفكير فى نفس الوقت وده اللى خلانى بجد انصح كاتب هذة السطور ايا كان اسمه الى احتراف الكتابه الساخرة سواء عن طريق الكتابة الصحفية لللمقال الصحفى او الكتابة للمسرح او السينما احنا بجد محتاجين لمثل هذة الافكار الجريئة لتقديمها للجماهية سواء للمشاهدة او قرائتها فى المجلات والجرائد وادعوك للاتصال بى عن طريق الاميل للتعاون معى لكتابة فيلم سينمائى ساخر حيث انى اعمل فى هذا المجال وقد قمت بتاْليف فيلم سينمائى بعنوان\"روحية رئيسة جمهورية\"وهو فى طريقة للتنفيذ ان شاء الله ."
archived = "2006-11-02"
