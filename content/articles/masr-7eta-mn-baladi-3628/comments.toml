text = "فينك من زمان يارجل وبعدين اذا كان مكنش بسلامته يعمل كده يبقي مين اللي هيعمل كده انا مثلا او انت او اي حد زينا.<br />احنا ناس ربنا يتولاهم برحمته الواسعه وانشاء الله ربنا يريحنا منهم الي الابد والظهار ان اننا محتاجين شركة نظافة جديده<br />ابقي اتعرف عليك في المعتقل اذا ماكنش يضايق.<br />ربنا معاكم يارجاله النصر او الشهادة"
