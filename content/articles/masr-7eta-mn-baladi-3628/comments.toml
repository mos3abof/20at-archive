subject = "ولبوا نداء الإنقاذ"
author = "مصري"
posted = "2006-03-02"
text = "بعد اشتداد الحصار السياسي علينا من عائلية الحكم التابعة لنهج فكر وسياسة الأعداء... واستطالة أمد حكم الغباء... وتأثير سياسة إعلام البغاء... أصاب الوهن بعض الجنود الزملاء... وازداد الأمر سوء بوفاة الرفقاء... هكذا نالوا منا بقدرا اثر سلبيا في عملية المقاومة والبناء... لكن... كان في عزم استمساك صبرنا الوقاية والاكتفاء... الصلابة أمام ريح الانكسار والانكفاء... حتى أتانا مدد الله برجالا جدد أشداء... وعادت الأعمال وكلمة الحق منا ترتفع وتطمس باطل الافتراء... وتعالج بحكمة انتشار الوباء... وباء سياسة عائلية الحكم الصهيوني الشركاء... الشركاء علي حد قول المرأة الخرقاء... إنني أسجل ذلك ذكرى وتعليما للخلفاء... للشباب من أهلية الطهر والنماء... أسجله علامات استرشاد لهم ولمن يشاء... إذا ما هيمنت الظلمة وتوارى العلماء...!!!<br />والان... لك أيها المستقرئ أننا ندعو لجهادا باجتهادا علميا حق وضاء... جهاد مؤمنين مسلمين لله أمنيتهم أن يكونوا العدل وآمان وسلام الحق فداء...شهداء... ننادي نوعية قبل الكمية فلا نفع في كمية الغثاء... نوعية ترتضي حق الكيفية... ننادي خامة آدمية وليست إنسانية... ننادي قوامة الصلاحية... بمقياس مرجعية هويتنا الإسلامية العربية وغير العربية... الهوية الإسلامية لله بنفسية سوية... وهذا ما سبق وفصلناه فيما طرحنا من نظرية... نظرية تحالف الحضارات الكونية... نظرية توحد المؤمنين في وجه عداء إبليس وسياسة حزبه الصهيونية... سياسة تدمير الآدمية وتكامليتها الزوجية وسبي البشرية...!!!<br />إننا ندعوا حفاظا وصيانة لاصل بالأرض مكين... اصل شجرة جذعها متين... شجرة الإسلام لله والإيمان به وبما أنزله من نور وهدى للعالمين... سلام ورحمة للناس أجمعين... وما فصله من حكمة سياسة الدين... ورتله علي يد رسل صادقين... بداية من آدم وحتى محمد الآمين... خاتم النبيين... الذي اكمل واتم الله علي يده المعنى الحق لاسلام أهل الدين... بكتاب مهيمن علي كل كتاب ومكتوب ذات لسان عربي مبين... فما يكذبك بعد بالدين أليس الله باحكم الحاكمين...؟<br />شجرتنا هي شجرة الآدمية الفطرية الكونية... ظلها بارد كريم وثمارها غذاء لكل معية... وبذور ثمارها زكية... نقية... من هندسة السياسة الوراثية... وسموم هرموناتها الإنسانية... إنها بذورا آدمية... تستلهم بتقوى وبحق العلم تعقل وهكذا تكون نيتها سوية... ليست باغية ولا عدائية... بل بخشية الله رهبانية... تدرك حق معنى الحياة وحدود الحرية... تصل الأرحام وتجل التعارف والحياة الاجتماعية... تعمل علي عمارة الأرض ونفع الناس وحق العبودية... ترى الرجال رسلا ذات قوامة خلقية... والنساء أمهات حاضنات تربوية... تلك البذور هي مشروع القوة الحتمية... قوة تدافع الحق في وجه باطل السياسة الصهيونية... قوة قيمية علمية... قوة تكاملية زوجية... قوة كما ذكرنا من قبل نوعية... كيفيتها قياسية حاكمة للكمية... إنها حتمية حياتية...!!!<br />اعلم أن الحياة الدنيا ليست وردية... وأن ما أدعو إليه لا يتحقق بمجرد نداء ومقالات فكرية علمية... وأن المدينة الفاضلة ليس لها عنوانا بالكرة الأرضية... وإنها صورة فنية ترسم أمنية... بل واعلم أن الحياة الدنيا مسرح وزمن تدافع وصراع في إطار شبكة من المقدرات الابتلائية... ولكل منا في ذلك سبيلا وتقنية... وانه ليس الجميع مثلي في الارتكان إلى شفافية العلانية... فهم لا يأمنون بالمصداقية... وأنا أراها ايسر السبل لتحقيق الأهداف الحياتية... وما ذاك من أمري إنما هو أمر حكمة الآيات القرءانية... وبتلك الحكمة سيكون سبيلي لتحقيق حتمية القوة الحياتية...!!؟<br />لكل مشروع غاية... واهداف... وإمكانيات لتحقيق المستهدف بلوغا للغاية... ويجب أن تكون هذه الأمور محسوبة الخطوات استراتيجية زمنية علمية... لا تنفك عن الأخذ بتطور الاغيار الحياتية... زمانا ومكانا وما بينهما من حداثة آلية... تقام وتستقيم علي أساس الهوية... بسمات وبصمات جلية الماهية... حتى يكون التعارف بها هداية وهدية... وكذا السياسة والتدافع بها وحتى القتال مشروع السببية... معالم أعرافه حق وقانونية... نعم... فالسببية لا ترتضي استقرارا إلا علي شاطئ الرهبانية... ولا تأمن سكنا دون سكن العبودية... العبودية لله التي هي سبب الخلق وهي \" الغاية الإسلامية \"... غاية تأتيها النفس بتجارة مع الله زكية... تجارة لعمارة الأرض والنفس وجعل نفع الناس سنة مقضية... تجارة هي صدق المخرج وحسن القبول والفوز بالمقامات العلية... ذاك تفصيل غاية الاستراتيجية وبذرة شجرتها النقية الزكية التي لله إسلامية...!!!<br />أما حينما نقف متفكرين في إمكانيات بذور... وثمار... ورجال شجرة الإيمان الإسلامي لله الطيبة... فللآسف الشديد أرى – والرؤية وحكمها الحق لله – وكأني بما لك قصر يبيت لياليه في العراء... أرى ثري وقد أرتكن رقودا بالطريق العام يقتات بيد سفلة من المارة... أرى كريم اصل معاني وقد راح الرعاع يطاردونه بالسخرية والاستهزاء... لماذا... لا ادري إلا أن يكون قد مسه شيطان في عقله... أو بدنه... أو ربما قلبه... فبات سكيرا وما هو بسكير... مفلتا نعم الله من بين يديه وما هو بسفيه ولا حقير... فعجبا... ثم عجبا لخليفة حين يتخير سبيل التكفير...!!!<br />والسؤال... ما هي إمكانيات ذاك الثري كريم الأصل العفي...؟ ثلاث مصادر إمكانيات اصلها واحد... الواحد... واليقين الإيماني به... والأخذ بأسباب حق علمه... لا طاقة لما هو دون تلك الثلاثية بقادرة علي مواجهة المؤمن المسلم كفرد وجماعة وأمة أن اعتصم باليقين في الواحد الأحد وعلمه... لا طاقة...!!!<br />فاليقين الإيماني الإسلامي لله ثبات أقدام القوة... والأخذ بعلم الحق تقدم القوة... ونصر الله الأحد بعد ذلك هو القوة وهيمنتها... القوة التي لا تحمل فيروس البغي والخسارة... القوة العادلة المعتدلة باتزان أوزان الحق... قوة رحمة وصلة أرحام... قوة جلود لانت وقلوب رقت وعيون تدمع لذكر الله... قوة تصون الحرمات وتحفظ العهود وتفي الأمانات... قوة تمهدت لها بكل زمان ومكان السبل والتطورات... سلسبيلا متاح لخير أمة أخرجت للناس سياسة وسياسات... فهل لذاك من قلوب سليمة واستواء اعقالات...؟؟<br />وإلي لقاء إن الله شاء...<br />ملاحظات هامة<br />1- حقا وعلما قلنا وفصلنا... والحمد لله أدركت امتنا حق ما قلنا وان التفجير في أسواق العراق وقتل الأبرياء أمريكي إسرائيلي صهيوني الفكر والبصمة... ونقول مؤكدين أن الاعتداء علي مراقد شيعة المسلمين ومساجد الله هو بيد عملاء أهل البصمة العدائية للإسلام... لإشعال الفتنة وتلويث ثورة المسلمين علي سفه حرية تعبير الغرب... فعجبا أن نقع في ذاك الفخ وتلك المكرة بعد كل ذلك... عجبا أن لا نتوحد... وتتحد قوتنا في مواجهة أعداء الله واعدائنا في العراق وفلسطين ولبنان وأفغانستان... وذيولهم الملوثة في مصر وتونس وسوريا وكل الأقطار المسلمة... أفيقوا يا مسلمين يرحمك الله...!!!<br />2- سفه عقلي وسياسي أن ندعم الوجه الأسود بفساده وصهيونيته في مواجهة الوجه المنير الإيراني... السوري اللبناني... الفلسطيني الحماسي... العراقي المقاوم... المصري الإسلامي العربي...!!!<br />3 - لم تخسر مصر في زمن أكتوبر 1973 ما خسرته في زمن ازعان سلام مبارك... لا في أرواح انفجار الطائرات المدنية والعبارات البحرية والقطارات المحترقة والأتوبيسات ( الحافلات ) المنقلبة... الخ ولا في ميدان كرامة الممارسة السياسية داخليا وخارجيا... فإلي متى تستمر تلك الخسارة... أظن... \"لا يغير الله ما بقوم حتى يغيروا ما بأنفسهم\"...!!! انه عقاب وبلاء عدل...!!!<br />4- شاءت دبة الحكم المصري مقاومة أنفلونزا الطيور... فخربت بيوت المصريين... وبات الأمر بيدها الجاهلة كارثة قومية... كارثة تضاف إلى خسارة استمرار عائلية حكم مبارك...!!!<br />5- من شعارات الدعاية الانتخابية التي أعادت مبارك فوق رؤوسنا هي إصدار قانون منع الحبس في قضايا النشر وحرية التعبير... وهاهو المجلس التشريعي بحضانة مجلس الشعب ينام تحت القبة... ولا حس ولا خبر عن الوعد والقانون... فهل ذاك من شرع أن المنافق إذا وعد اخلف...؟؟ أم سمة من سمات صهيونية حكم العائلة...؟؟<br />6- يا بذور شجرة الإسلام هلموا... تجمعوا... توحدوا... فانتم الأمل الوحيد الحي للإنقاذ... أنادى فيكم وعليكم فهلموا ولبوا نداء الإنقاذ...!!!"
archived = "2006-11-02"
