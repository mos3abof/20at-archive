text = "بصوا نا عرفت من مصدر موثوق به ( اللي هو انا ) مين هو محمود الجمال ؟؟<br />مش هعيش في دور ابراهيم عيسى و لا عادل حموده في كشف قضايا الفساد بس انا بحكم معرفتي بشركة صن ست للمقاولات و بحكم عملي كمهندس مدني فان ليا علاقات بهذه الشركة و شركاء محمود الجمال فيها اشرف فرج و الشربتلي ( رجل اعمال سعودي )<br />الشركة دي استولت على ارض فضاء في الهرم مملوكه لبعض المستشارين و الاطباء و اساتذه الجامعات و بنت عليها القصور و الفيلات بعد ان قاموا في جنح الصباح بمساعده رجل الاعمال احمد فؤاد اباظة ( عضو مجلس الشعب الحالي عن دايرة ابو حماد شرقيه ) الذي قام بتوفير البلطجية الذين قتلوا اكثر من عشرين غفير و تم البناء و بقا امر واقع و اضرب المربوط يخاف السايل<br />و لكي نعرف ان المصالح و المصاهرات متشابكة في مصر سنعرف ان احد شركاء محمود الجمال متزوج من شقيقة الرئيس و ان اشرف فرج مرتبط بعلاقة نسب بحبيب بيك العادلي<br />و اه لو كنت صحفي و لا فاضي كنت جبتلكوا الاسماء و العناوين و الوثائق و شهود العيان"
archived = "2006-11-02"
