text = "انك و الله -يا براء-سقطت من نظرى ومن نظر الكثيرين من معجبى موقع عشرينات. من اعطاك الحق ان تتكلم عن الرجل بتلك الطريقة السافرة؟ اين انت من الاسلام وانت تتكلم عن السيدة التى سيتزوجها بذلك الاسلوب المشين؟اين انت من القدوة وموقعكم ياخذ صبغة اسلامية؟ماذا تقصد ايها المؤدب بقولك(اصلح غلطتى)؟... راجع نغسك يا بنى واتق الله, وتخيل لو قرا النبى (ص) هذا الذى كتبته..اسيسعد به ويبتسم فى وجهك؟ام سيعرض لانك لم تتبع تعاليمه النبيلة؟ ديننا يا اخى دين اخلاق وا الله."
