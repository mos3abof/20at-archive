subject = "الحقوا بسرعة"
author = "سوسة المفروسة"
posted = "2006-03-05"
text = "يا جماعة عشان تبقوا ايجابيين و ما يركبكوش حد و يدلدل رجلية >دلوقتي تقدروا تروحوا اي قسم و تطلعوا بطاقة انتخابية لان اخر ميعاد هو 11/3 فلو سمحتوا تلحقوا بسرعة و متكسلوش عشان لو بعد الشر بعد الشر بعد الشر بابا سونا جراله حاجة يبقى من حقكم تدوا صوتكم لاي حد غير الطفل المعجزة<br />و والنبي الله يخليكم محدش يقولي هما هيطبخوها و ما فيش فايده و الكلام البيئة اللى هايجيبنا ورا ده انتوا شفتوا الناس عملت ايه في انتخابات مجلس الشعب اللى فاتت قبل التزوير و الضم .....و الموضوع مش صعب ولا حاجه انا رحت و الموضوع كله خلص في اقل من 5 دقايق<br />و الله نقدر نعمل كل حاجه بس احنا بنستهبل و نقضيها ضحك و تريقه و في الاخر نقول ماحدش بيسمعنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

