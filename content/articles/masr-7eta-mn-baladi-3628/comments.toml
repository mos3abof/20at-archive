[[comments]]
order = 39
subject = "حلوة من الاخ اللى فوق"
author = "عابر القارات"
posted = "2006-03-01"
text = "أجمل حاجه أن الاخ أو الاخت اللى فوق فى أخر التعلبق بتشتم كل اللى علق و بعدين تقول ان حسنى و ابنه أخد حسنات لأننا بنشتمه .... حلو التناقض ده و كوميدى طحن ... بس نفسى كنت أسمع الاخت او الاخ اللى علق بتقول كام حسنة أخدها كل فرد من أفراد الــ 75 مليون اللى فى رقابته و اللى هوه راعيهم لما يكون مثلا عيان و مرمى قدام المستشفى و مش لاقى حق القطن و الشاش لأن اللى مسئول عنه و الراعى بتاعه بيتفرج على الماتش و ملهى بالتشجيع و تلميع صورته قدام الشعب لأنه لا ليه فى الكوره و لا فى البللى حتى و لا يتستر على الفساد اللى قتل الشعب المصرى فشر الابادة الجماعية فى البوسنة و الهرسك و ده لأن شلة المنتفعين بتعذيب و إبادة الشعب المصرى هما شلته و حبايبه و لما تقوم مظاهرات بتعبر عن رأيها و تقول كفاية يقوم يطلق عليهم كلاب سعرانه تنهش فى عرض إخواتنا و بناتنا و لما خريج الجامعه اللى أتصرف عليه الاف الجنيهات طول ربع قرن لغاية لما إتخرج لاعب طاولة فى دورى قهوة سهراية اللى على الشارع العمومى و لما تتحرق الغلابة و لا يغرق الشقيانين بسبب الاهمال و الفساد و تنهار أسر عايشه من وراهم و لما و لما و لما ... و لما تحصرى عدد الحسنات اللى أتخدت منه إن شاء الله تعالى لأنه هو سبحانه اللى قادر على إحصاءها يبقى يا ريت يا اللى فوق تقولى لينا حق ننفث عن اللى مكبوت جوانا و لا لأ و أهه كله من رصيد حسانتنتا اللى عنده و عند عيلته ربنا يا رب يا مجيب دعاء كل مظلوم تزول من على وجه الارض و يا رب يحكمنا يا رب من يخافك فينا و يرحمنا يا رب إنك أنت سميع الدعاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102702/http://www.20at.com/article2.php?sid=502"

[[comments]]
