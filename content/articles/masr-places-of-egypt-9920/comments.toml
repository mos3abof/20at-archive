author = "السيد يوسف"
posted = "2008-08-23"
text = "الخديوى اسماعيل هو اللى نظم عملية الاسواق على مستوى القطر المصرى<br />فمثلا سوق المواشى يكون فى عاصمة المركز واية يتوجة الفلاحون من كل القرى لبيع الغنم والحمير والبقر والجاموس<br />وكل مركزين متجاورين لهم يومين مختلفين علشان الفلاحين يروحوا المركز دة او المركز دة<br />وتجار المواشى الكبار فى القاهرة عارفين ايام الاسواق فى طنطا وابوكبير وفاقوس والدلجمون وبيبعتوا مندوبينهم بسيارات نقل تشترى من اسواق الفلاحين وتحمل الدبايح للقاهرة لتوزيعها على الجزارين وهم من يتحكموا فى سعر اللحوم فى مصر ودول اخطر مافيا فى مصر وبيكسبوا ملايين اسبوعيا<br />اما اسواق الخضار والفاكهة فدى مجلس المدينة او الحى بينظمها ويحدد مكانها وزلها برضة اباطرة تجار خضار الجملة اللى بيروحوا الغيطان ويشتروا من الفلاح بالجملة وينقلوها فى اللوارى ويتحكموا فى سعرها<br />يعنى البلد فى اكلها شغالة على شوية مافيا خضار ولحمة ولا بيدفعوا ضرايب ولا احد حاسس بيهم<br />والدولة نايمة على الشاطىء الرملى فى الشرم او الساحل الشمالى والناس بتاكل فى بعض<br />وسلم لى على الفوضى"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105141727/http://20at.com/masr/places-of-egypt/9920-2009-06-10-18-04-04.html"

