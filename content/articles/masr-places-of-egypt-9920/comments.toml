text = "لا تذهب اول السوق او فى بدايتة فى الصباح فكل شىء تمام والقادرون بيشتروا والخضار طازة والكل بينقى من على وش الرصة او وش القفص الطماطم او البندورة الحلوة الحمراء والكل بيشترى<br />ولكن اذهب فى نهاية السوق وشوفة وهو بيشطب<br />تلاقى زباين من نوع تانى<br />تلاقى الغلابة والفقراء وهم ملح الارض بيشتروا بقايا الخضار - الطماطم المفعصة والكوسة الضاربة والملوخية الدبلانة<br />واقول لها يا<br />المصريين حلوين بيشيلوا بعض واللى عندة من الشارع بيدى اللى معندوش انما اللى فوق بتوع الشرم والساحل الشمالى اللى بالعين الدنيا فى بطنهم - ربنا ياخدهم اخذ عزيز مقتدر"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105141727/http://20at.com/masr/places-of-egypt/9920-2009-06-10-18-04-04.html"
