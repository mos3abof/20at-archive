posted = "2008-03-22"
text = "لم يختلف ايضا سليمان جوده عن دحلان الكلب العميل ولا عن ساويرس جزامه ومساح جزم الامريكان<br />فاسليمان جوده لم يقل عنهم عنصريه وعداء وخصوصا للاسلام ولا ادرى اى ديانه يدبنها فهو من خصص مجهوده للهجوم على عمرو خالد وعلى حمله عمرو خالد ضد المخدرات وكأنه خايف يبص مايلقيش تجار الكيف حواليه فاميعرفش يتكيف<br />وهو من هاجم بما اسماهم الدعاه الجدد طارق السويدان وعمرو خالد وعمر عبد الكافى وغيرهم من الاساتذه المحترمين واتهمه تهمه فظيعه بشعه انهم اغنياء!!!!!!!!! !!!!!!!!!<br />ومنذمتى والغنا عيبا وكما قال احدهم فى رده ان 6من المبشرين بالجنه كانو اغنياء .لن اطيل الحديث على شخص لا يستحق الاهتمام يكفى ما رد عليه به عمرو اديب فى حلقه يوم الاربعاء الماضى(بنيت انت ايه فى حياتك عشان تيجى تهد اللى الناس بتبنيه)<br />فليس بعد عن شخص بوضاعته ان يحامى لمجرم واضح اجرامه للقاصى وللدانى ويعلمه الصغير قبل الكبير"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602052542/http://20at.com:80/masr/t7atuf/8552.html"

