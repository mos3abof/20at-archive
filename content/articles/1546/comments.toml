subject = "وللحمير حظوظ"
author = "وعد"
posted = "2006-05-14"
text = "بصراحة انا توقعت منك يا استاذ عاطف انك تكتب اكثر من كده، مش لانك بتكتب هبل ولا حاجة، لانك بصراحة بتنقل معاناة الناس، فانا متأكد انك اردت ان تنقل معاناة الطفل هذا، مع انك ايضا تريد اصباغ الموضوع بطرفة معينة. اشكرك على اهتمامك بالمواضيع ده."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145441/http://www.20at.com/article2.php?sid=792"

