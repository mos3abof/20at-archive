text = "القصه حلوه بس ليه فقعلا ظالمين الحمير معانا مع اننا ساعات بنبقى اغبيا و مش شايفين حاجه و و الامثله كتير<br />و على راى البت (مش شغللك)صبى قال للحمار يا حمار رد عليه الحمار يا عربى<br />وخدالى باللك يختى"
