[[comments]]
order = 1
subject = "راجل محترم"
author = "مصرى"
posted = "2006-03-21"
text = "علاء الأسوانى راجل محترم ابن راجل محترم<br />لكنى لا أوافقه على عدم مسئوليته عن الفيلم<br />فرغم أن القصة السينمائية أبداع خاص باصحابه من السيناريست إلى المخرج إلى الممثلين إلى الديكور والملابس<br />لكنى كنت أفضل إلا يقع علاء فى خطأ نجيب محفوظ<br />فلابد أن يكون حد أدنى للآختلاف بين رؤية مؤلف القصة ورؤية أصحاب العمل السينمائى<br />لأن الفيلم يظل فى النهاية يحمل اسم صاحب القصة الاصلية"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021846/http://masr.20at.com:80/article.php?sid=44&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 2
subject = "اية ؟؟؟؟؟"
author = "مصرى"
posted = "2006-03-23"
text = "الراجل دا قذر بجد<br />انتو عارفين يعنى اية يحكى عن الشواذ ؟؟؟؟؟<br />دى هتبقى مسخرة والفيلم هيبقى سافل جدا<br />احنا هنا فى مصر فى ناس بردو طبعا لغاية دلوقتى متعرفش يعنى اية شواذ<br />لية لية ياقذر تجيبهم فى افلاامك لية ؟؟<br />عشان تعلم الناس اللواط والسحاق ؟؟؟؟<br />دا غير طبعا انو هيتدخل فى الدين ومش بعيد تحصل فتنة طائفية<br />اللة يخرب بيتك ماتروح تقعد فى عيادتك احسن<br />قال شواذ قال اللة يفضحك"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021846/http://masr.20at.com:80/article.php?sid=44&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 3
subject = "الى مصري ( لا تدفن رأسك في الرمل )"
author = "كرميلينو"
posted = "2006-03-23"
text = "الشواذ عيب في المجتمع موجود و باين بس للاسف احنا بنحط راسنا في الرمل و عاملين فيها عبط و بنقول لا يا راجل ده مفيش حاجة اسمها شذوذ و لا فيه ناس مرضى عندهم مرض اسمه الشذوذ الجنسي<br />و بدل مندور حاجة لعلاجهم او حرقهم بجاز حتى بنقول : كله تمام يا ريس على رأي كل وزراء صحة مصر<br />و بعدين ده مش اول فيلم يتكلم عن الشواذ الموضوع ده اثاره وحيد حاد مد في فيلم ديل السمكه و حاول يفسره على انع حريه<br />لازم بجد نتكلم في الموضوع ده و نقتله بحث بدل ما نقتل اللي بيتكلموا فيه ؟؟؟"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021846/http://masr.20at.com:80/article.php?sid=44&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 4
subject = "عبقرىّ فذأ"
author = "أمير"
posted = "2006-04-22"
text = "قرأت \"عمارة يعقوبيان\" منذ عدة أيام، و رأيى أن علاء الأسوانى هو عبقرىّ فذ---حقيقة، و أن هذه القصة شبه حقيقة ما جاءت إلا لتكشف عن ما يدور خفية فى المجتمع المصرى---للأسف."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021846/http://masr.20at.com:80/article.php?sid=44&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"
