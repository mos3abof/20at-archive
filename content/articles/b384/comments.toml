subject = "نموت نموت و تحيا مصر"
author = "أكرم بس"
posted = "2006-02-05"
text = "انت خلتوني هعيط النهارده<br />مش عارف ايه كم المقالات اللي بتكلم عن الموت دي<br />رغم انه هادم اللذات و مفرق الجماعات بس الموت علينا حق و ربنا قال للنبي عليه افضل الصلاة و السلام ( انك ميت و انهم ميتون ) عشان محدش يفتكر انه هيبلط فيها<br />يا جماعه يا ريت كل واحدة يعرف بجد انه هيموت بس مش مهم الموت يا حلو المهم اللي بعده<br />اوعى وشك ؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114123/http://www.20at.com/article2.php?sid=384"

