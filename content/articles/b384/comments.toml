text = "نفين ازيك يا حاجه عاش من شافك ,الايميك بتاعي اهوه ماشي . sabarh_egy@yahoo.com<br />بجد والله كنت عايزه اكتبها لسببن قبل ما انسي العربي واهيه فضفضه . انا ببخش علي النت اساسا اشوف الاخبار والموقع دا قلت يلا اغتت شويه علي الخلق اللي هناك دي . اشوقك بعدين يوووه اقصد ابعتلك بعدين."
