subject = "اسماعيل البلبيسي"
author = "أكرم"
posted = "2006-02-07"
text = "من يعرف من هو اسماعيل البلبيسي ؟؟<br />ملجن جامد جدا و صاحب اغنية رائعة انصحك يا هبهوب تسمعيها مش هتقعدي في الغربة ربع ساعة هي اغنية الغربه<br />بس انا شايف من كلامك انك بنت و الاغنية بتكلم عن شاب متغرب عشان يرسم طريق لنفسه بس الغربه جتالة يا بوي ( و لا اراكم الله مكروها في عزيز لديكم )<br />و ان كان ع الخواطر فهي اكتر م الهم ع القلب بس الشعر اشد و الايميل اهو اهو اهو<br />HURRY_DAY@YAHOO.COM<br />HURRY_DAY@HOTMAIL.COM"
