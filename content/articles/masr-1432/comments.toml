posted = "2007-01-13"
text = "اه يا بلد والله انا فعلا نفسي في زلزاااال يهد البلد دي على دماغ اللي فيها حكومه وناس<br />عشان حكومه وسخه وناس جبانه لو ايدي في ايدك نشيل ولاد الكلب من السلطه<br />نفسي اسال الظابط اللي معلق البنيه لو حضرته ما اكنش ظابط وكانت اخته اللي اتعلقت كده كان عمل ايه؟؟؟؟"
