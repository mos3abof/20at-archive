[[comments]]
order = 0
subject = "تشكر يا ريس"
author = "حسام عيون"
posted = "2006-12-29"
text = "تشكر ياريس على غلوة الجاز والبنزين انتة عارف انتة كدة بضر مين بضر المواطن الفقير لان الجاز اكتر واحد بيستخدمة المواطن الفقير مش الغنى الى راكب عربية بمليون جنية هيهمة الجاز يغلةطبعا لا الفقير هوة الى تعبان الفقير الى انتة يا ريس مش عارف عنة الى حاجة لانة اساسا مش على الخريطة خريطة الطريق الى جهنم الى انتة حطوة فيها الرحمة يا ريس عندك فكرة يا ريس اللحمة بكام اكيد لا لانك بتبعت تيجيبها من برة احسن واضمن لان كل حاجة انضربت فى السوق حتى المياة الى بنشربها فيها مجارى بس ارجع واقول ربينا اقوة من الكل وربينا على المفترى وسمعنى سلام بودعك المرسل ماااااااااااااات"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127113923/http://masr.20at.com:80/article.php?sid=1264"

[[comments]]
order = 1
subject = "جهل وتجهيل"
author = "ياسر"
posted = "2007-01-03"
text = "اولا الناس جهله يعنى عندما الوقود غلى ووصل ل80دولارطبعا الدوله مقدرتش تغطى الزياده من فلوس الدعم اللى الدوله بتدفعهفافضرت تغلى المواصلات وكان ده من شهر 9 اللى فات بسبب تضهور الاقتصاد العالمى بسبب حرب ليبنان لكن فى اول شهر 12رخص الوقود العالمى الى 54دولار المفروض بقى الناس تطالب الدوله بان تقلل الاجره بما يتناسب مع هذا الانخفاض الوقود العالمى<br />لكن طبعا الدوله متبعه اسلوب تجهيل المواطن فالاجره بعد مازادت بقت زى ماهى لم تخفض التعريفه والناس مش فاهمه كله بيفكر يدفع وخلاص ويقولك يعنى اعمل ايه ((جهل%جهل)) اهى ماشيا زى مياه النيل؛؛؛ لا تعلايق ياسر"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127113923/http://masr.20at.com:80/article.php?sid=1264"
