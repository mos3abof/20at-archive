[[comments]]
order = 10
subject = ""
author = "لا لضلمة نور"
posted = "2009-10-16"
text = "الأستاذ جمال مبارك هيمسك الحكم إن شاء الله مش علشان الرئيس محمد حسنى مبارك أبوه ولكن علشان هو الأجدر بالرئاسة .<br />مثقف وعنده خبرة طويلة مع السياسة خبرة بجد مش زي نور خبرته في السجن و فى الضلمة وكمان كان قال انه هيوفر على البلد نفقات كتير اوي عايزين أيه تانى بقى<br />كفاية بق على الفاضي ومافيش غير جمال مبارك للحكم نعم لجمال مبارك ولا لضلمة نور ولا أعوانه ولا الى يشبهولوا"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205111/http://www.20at.com:80/masr/t7kyk/13726-2009-10-15-14-12-11.html"

[[comments]]
order = 11
subject = ""
author = "صباح الخير بالليل"
posted = "2009-10-16"
text = "ماليزيا فى التنمية كانت ماشية على خطة تنمية عزيز صدقى وجمال عبد الناصر<br />نفس الخطة<br />احنا فين وماليزيا فين<br />دلوقتى المشروع القومى للحكومة هى تاكيل الشعب وشراء قمح من اوسخ الانواع وعمل ارغفة عيش رخيصة يطفحوها والشرطة والجيش تشارك فى المشروع القومى اللى هو انتاج رغيف الخبز ابو شلن<br />فية مشروع تنمية فى مصر<br />ابدا مفيش اى تنمية<br />فية بيع وبس فى مصانع عبد الناصر<br />يا عم احنا موافقين على حكمك بس هتحكم اية ما كلة انباع<br />واللة موافقين على حكمك<br />احكمنا"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205111/http://www.20at.com:80/masr/t7kyk/13726-2009-10-15-14-12-11.html"

[[comments]]
order = 12
subject = ""
author = "اى واحد ينفع"
posted = "2009-10-16"
text = "شغلة الرئيس دى شغلة سهلة خالص واى واحد يقوم بها ومش عايزة مؤهلات<br />وكل اللى بيعملة اى رئيس فى اى بلد انة بيطلع شوية تصريحات زى<br />نحن مع الفقراء<br />قلوبنا مع محدودى الدخل<br />واى واحد بيشتغل شغلانة فبتبقى بناءا على توجيهات سيادتة<br />واجازات زى الفل وسفريات<br />يعنى ما تقلقوش على اللى هييجى<br />يجيبوا الدو يشيلوا شاهين<br />يمسكوا تفيدة ويسيبوا ام الخير<br />كلة محصل بعضة<br />وعمك احمد تمام زى الحاج احمد<br />مفيش فرق<br />لانة كلة مالوش لزمة وكل واحد يشوف مصلحتة ويشوف شغلتة ورزق عيالة انما الكلام فى الحاجات دى مالوش لزمة<br />وانا راييى ان اى واحد فى مصر ينفع بدليل ان السادات كان اية وعبد الناصر كان اية ايام مولانا الملك جنب الباشوات والكبار وقتها<br />سلموها للة"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205111/http://www.20at.com:80/masr/t7kyk/13726-2009-10-15-14-12-11.html"

[[comments]]
order = 13
subject = ""
author = "شجرة الدر"
posted = "2009-10-17"
text = "حينما حكمت مصر شجرة الدر<br />ارسل الخليفة العباسى رسالة الى المماليك وهم الجيش المصرى وقتها يقول فيها<br />ان كان ليس عندكم رجالا فاخبرونا حتى نرسل اليكم رجلا<br />فاضطرت على حسب كتب التاريخ ان تولى ابنها<br />صحيح اليس عندنا رجالا<br />اقرؤوا التاريخ<br />ففية بلاوى مسيحة فيمن حكم هذة البلد من قبل"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205111/http://www.20at.com:80/masr/t7kyk/13726-2009-10-15-14-12-11.html"

[[comments]]
order = 14
subject = ""
author = "الحاج عبد الشكور"
posted = "2009-10-17"
text = "انا راييى ان اللى يصلح لحكم البلد دى هو الحاج عبد الشكور عمدة كفر النوارس وضواحيها فالرجل عندة خبرة فى العمودية ودق طرمبتين ارتوازى وطهر مصرف ابو غريب وشق ترعة صغيرة جنب الكفر وعندة خبرة واسعة فى التعامل مع الخفر وشيخ الخفرل وبتوع ضرايب الاطيان و حكيم الوحدة الصحية والمدرسة الابتدائى اللى الحكومة مؤجرة بيتة لعمل المدرسة<br />واللة دى راجل كويس<br />ومراتة الست ام الخير ست محترمة وبنتة تفيدة محامية<br />واهم حاجة معندوش ولاد يورثوة"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205111/http://www.20at.com:80/masr/t7kyk/13726-2009-10-15-14-12-11.html"

[[comments]]
order = 15
subject = ""
author = "الفرقعة قادمة"
posted = "2009-10-17"
text = "مصر زى ما قالوا مش عشة فراخ ولا هى زريبة مواشى بيورثها الاب لابنة<br />مصر كبيرة قوى<br />واكبر من تصور اى صبيان او هلافيت او هواة<br />وبما ان الساحة السياسية خالية<br />والظروف اشبة بمصر سنة 1952<br />والامن هو الذى يحكم ويدير<br />لماذا لا يصعد جنرال من بتوع الامن ويقول لك انا الحاكم لفترة انتقالية وخصوصا ان قواتة فى الشارع قوات الامن المركزى<br />وللاخوة المنظرين<br />مصر مش سوريا زى ما قال سابقا الرئيس مبارك<br />ومصر مش الجابون<br />ولا مصر زى اليمن او ليبيا<br />مصر دولة قائدة غنية جدا باولادها العظام الذين يظهرون وقت الخطر<br />ولا واحد من الذين تتداول اسمائهم سوف يحكم<br />اللة اعلم<br />هناك جنرال ما فى مكان ما ينتظر الانقضاض وسوف يخرج ملايين الجياع للترحيب والتهليل لة<br />علينا الانتظار<br />واهو احنا بنتسلى ونتفرج<br />وما تقروش جريدة الدستور كتير ولا تتفرجوا على حلقات حسنين هيكل"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205111/http://www.20at.com:80/masr/t7kyk/13726-2009-10-15-14-12-11.html"

