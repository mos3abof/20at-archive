[[comments]]
order = 0
subject = ""
author = "جيـــمـي"
posted = "2009-10-15"
text = "مش عارف ليه حاسس انه أيام الإنتخابات هتحصل فوضي جامدة اوي وتخرج الأمور عن السيطرة ويبقى فيه حظر تجول و أعتقالات بالجملة و الحاجات دى .<br />وبعدين يطلع مجلس الشعب يقولك أن المجلس وافق على تعيين جمال مبارك رئيس مؤقت لفترة أنتقالية لحين أستقرار الأوضاع و التمكن من أجراء أنتخابات نزيهة في جو يعمه الأمن والآمان .<br />وتلاقي جمال هبش اليلة كلها .. ونور واقف بيتفرج عليه أو المعارضة الى مش موجودة أساساً .<br />المشكلة ان مافيش حد يقدر يكون رئيس لمصر … مافيش شخص مناسب للأسف .. جميعهم رابش وقليل منهم هو الى نضيف بس هيروح فين فيهم"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205111/http://www.20at.com:80/masr/t7kyk/13726-2009-10-15-14-12-11.html"

[[comments]]
order = 1
subject = ""
author = "شوية تفكير"
posted = "2009-10-15"
text = "القيادة السياسية وقفت مع فاروق حسنى ورشحتة وربطت لانجاحة مع امريكا وفرنسا ودول اوروبا وربطت مع اسرائيل ايضا علشان فاروق حسنى يقعد على كرسى اليونسكو<br />وجرت اتصالات على اعلى مستوى علشان ينجح<br />واعطوة امل فى اول الانتخابات ونجح فى الجولة الاولى ونجح فى الجولة التانية وتعادل فى الجولة التاتة ثم هزموة فى الاخر وتخلت اسرائيل وامريكا وفرنسا عنة<br />لان الدول دى لها مبادىء<br />نفس الكلام هيحصل مع مرشح الرئاسة<br />وها تفتكروا"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205111/http://www.20at.com:80/masr/t7kyk/13726-2009-10-15-14-12-11.html"

[[comments]]
order = 2
subject = ""
author = "منصور ابو كحة"
posted = "2009-10-15"
text = "الحقيقة المرة<br />ان الذى سيختار لنا الرئيس القادم<br />هى امريكا واسرائيل<br />خلص الكلام<br />وقد اختاروا خلاص<br />وان غدا لناظرة قريب"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205111/http://www.20at.com:80/masr/t7kyk/13726-2009-10-15-14-12-11.html"

[[comments]]
order = 3
subject = ""
author = "ان شاء اللة"
posted = "2009-10-15"
text = "وما تشاؤون الا ان يشاء السميع العليم<br />ربنا كبير<br />ورحمتة واسعة<br />وعارف ان الشعب بتاعنا تعب قوى وجاع قوى وانظلم قوى وشرب من المجارى واكل من القمح المسرطن ووقف فى طوابير العيش وقعد على القهاوى عاطل عن اى شغل وطلع معاش مبكر<br />ربنا كبير<br />وبيحب مصر<br />وهيبعت مددة فى اللحظة الاخيرة<br />يا رب"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205111/http://www.20at.com:80/masr/t7kyk/13726-2009-10-15-14-12-11.html"

[[comments]]
order = 4
subject = ""
author = "دولة الجابون"
posted = "2009-10-15"
text = "فى الجابون والجابون دى دولة فى افريقيا بتاكل قرود ونسانيس<br />رئيسها كان واحد اسمة عمر بونجو وكان ثورجى وعمل نفسة محرر وبطل ضرب القرود فى الغابات ومخوف النسانيس<br />مات عمر بونجو بعد فترة حكم 30 سنة<br />البرلمان رشح ابنة على بونجو وفاز باغلبية ساحقة 99 و 99 %<br />المضحك ان الكبار بعتوا لعلى بونجو رسائل وبرقيات تهنئة<br />عرفتم اية فايدة رئيس البرطمان واللجان المحلية<br />نفس ما حدث فى الجابون سوف يحدث<br />فية احد عندة حل تانى<br />يا مرحبا يا مرحبا"
archived = "2009-10-18"
capture_url = "https://web.archive.org/web/20091018205111/http://www.20at.com:80/masr/t7kyk/13726-2009-10-15-14-12-11.html"

