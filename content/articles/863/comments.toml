[[comments]]
order = 9
subject = "ليس عيدا للنصارى ..."
author = "هاني جمال الدين"
posted = "2005-12-31"
text = "الأخ ملتزم والآخرين ...<br />ينقسم النصارى في أنحاء العالم الى فرق عديدة، ولكنهم في هذا الشأن فريقين:<br />- مسيحيون غربيون: واحتفالهم يوم 25 ديسمبر<br />- مسيحيون شرقيون: واحتفالهم يوم 7 يناير<br />أما الاحتفال بليلة 31 ديسمبر، فهو احتفال للعالم أجمع بعام جديد بالتقويم العالمي، وهو ليس يوم عيد للمسيحيين.<br />ويا رب الناس تفهم ...<br />** وبعدين يا عم الملتزم اللى بيحصل في رأس السنة بيحصل كل ليلة من المسلمين قبل غيرهم.<br />** وعلى فكرة أنا رأيي إنك متشدد مش ملتزم، وأمثالك هم أمل أعدائنالنشر التفرقة بين أواصل الشعب المصري.<br />** آخر كلام .. أنا بأقضى رأس السنة في البيت مع زوجتي وولدي .. وحتى قبل الزواج ماكنتش حتى بأخرج من البيت في هذه الليلة .. لكن كلامك استفزني انت والأخ اللي بعدك اللى مكتبش اسمه ..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124142/http://www.20at.com/article2.php?sid=166"

[[comments]]
order = 10
subject = "رحمتك يارب"
author = "wonder"
posted = "2005-12-31"
text = "السلام عليكم<br />اولا يارب كل الايام اللي جاية ومش السنة الجاية بس تبقى ايام كلها خير .<br />ثانيا : انا عندي تعليق بسيط اكيد معظمنا بيتضايق لما بيسمع عن المعاصي اللي بتحصل في ليلة رأس السنة بس احنا بقى لازم نكون حاجة تانية مش زي اي حد يعني ياريت نقضي الليلة دي في طاعة ربنا اد ايه ها يكون ثوابنا عظيم مع كل المعاصي اللي بتحصل في الليلة دي عايزين نقول لربنا لو الكون كله بيعصيك احنا ها نعبدك .ونقوله وعجلت اليك ربي لترضى عايزين بس رضاك يارب.. انا اعرف ناس ها يعتكفوا الليل كله في مسجد من المساجد وتبقى الليلة كلها قيام ليل ربنا يوفقهم ويثبتنا جميعا على طاعته.<br />ياريت نحاول ولو حتى نصلي ركعتين قيام ليل قبل لما تنام<br />اكيد ها تفرق كتير اوي ........."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124142/http://www.20at.com/article2.php?sid=166"

