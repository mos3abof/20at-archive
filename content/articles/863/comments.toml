[[comments]]
order = 20
subject = "حكم الأحتفال بالكريسماس ورأس السنه"
author = "عبدالله 17 سنة"
posted = "2006-02-06"
text = "حكم الأحتفال بالكريسماس ورأس السنه<br />بسم الله الرحمن الرحيم<br />بسم الله والحمد لله والصلاة والسلام على رسول الله أما بعد<br />فهذه خطبة للشيخ محمد صالح المنجد حفظه الله بعنوان<br />احتفال المسلمين برأس السنة الميلادية<br />إن من يزور كثيرا من بلاد المسلمين في هذه الأيام، وما إن تطأ قدماهُ أرضَهُا، ويتجولُ في شوارع مُدُنِهِا، ويُراقب سلوك الأفراد في مجتمعاتها .. حتى يجدَ أن الصورة التي كانت منطبعة في ذهنهِ، قدِ انقلبت رأساً على عقب.<br />فما يراه من مظاهر الفرح والابتهاج، وما يلمسه في مختلِفِ فئات المجتمع من تأهبٍ واستعدادٍ لاستقبال عيد الميلاد المسيحي، والاحتفال برأس السنة الجديدة بل ومشاركة وسائل الإعلام المسموعة والمرئية والمكتوبة في مظاهـر الحفاوة هذه، حتى يكاد يكذبُ ما كان يسمعه عن بلاد المسلمين وتشبثِ شعوبهاِ بدينهمِ الحنيفِ.<br />إن هذا التقليدَ الكلِّيَ لما هو غربيٌ، ناتجٌ عن نقصان الإيمان بالله أو انعدامه، مع ضياع العقيدةِ الصحيحةِ أو انعدامها، وانسلاخٌ من مستلزمات التميز الإسلامي، ومنكر يُدخِلنا في دائرةِ من قَـالَ فيهم رَسُولُ اللَّهِ : { مَنْ تَشَبَّهَ بِقَوْمٍ فَهُوَ مِنْهُمْ} [أبو داود]‏<br />و هذه فتوى للشيخ محمد بن صالح العثيمين رحمه الله :<br />السؤال :<br />ما حكم تهنئة الكفار بعيد الكريسماس ؟ وكيف نرد عليهم إذا هنئونا بها ؟ وهل يجوز الذهاب إلى أماكن الحفلات التي يقيمونها بهـذه المناسبة ؟ وهل يأثم الإنسان إذا فعل شيئاً مما ذكر بغير قصد ؟وإنما فعله إما مجامـلة أو حياء أو إحراجًا أو غير ذلك من الأسباب وهل يجوز التشبه بهم في ذلك ؟<br />فأجاب رحمه الله :<br />تهنئة الكفار بعيد الكريسماس أو غيره من أعيادهم الدينية حــرام بالاتفاق ، كما نقل ذلك ابن القيم - رحمه الله - في كتابه ( أحكام أهـل الذمـة ) ، حيث قال : ( وأما التهنئة بشعائر الكفر المختصة به فحرام بالاتفاق ، مثل أن يهنيهم بأعيادهم وصومهم ، فيقول : عيد مبارك عليك ، أو : تهنأ بهذا العيد ونحوه ، فهذا إن سلم قائله من الكفر فهو من المحرمات ، وهو بمنـزلة أن يهنئه بسجوده للصليب ، بل ذلك أعظم إثمـاً عند الله ، وأشد مقتـاً من التهنئة بشرب الخمر وقتـل النفس ، وارتكاب الفرج الحرام ونحوه ، وكثير ممن لا قدر للدين عنده يقع في ذلك ، ولا يدري قبح ما فعل ، فمن هنأ عبداً بمعصية أو بدعة أو كفر فقد تعرض لمقت الله وسخطه . انتهى كلامه - رحمه الله - .<br />وإنما كانت تهنئة الكفار بأعيادهم الدينية حرامًا وبهذه المثابة التي ذكرها ابن القيم ، لأن فيها إقراراً لما هم عليه من شعـائر الكفر ، ورضىً به لهم ، وإن كان هو لا يرضى بهذا الكفر لنفسه ، لكن يحـرم على المسلم ان يرضى بشعائر الكفر أو يهنئ بها غيره، لأن الله تعالى لا يرضى بذلك ، كما قال الله تعالى: { إن تكفروا فإن الله غني عنكم ولا يرضى لعباده الكفر وإن تشكروا يرضه لكم } ( الزمر: 7 ) وقال تعـالى: { اليوم أكملت لكم دينكم وأتممت عليكم نعمتي ورضيت لكم الإسلام دينا } ( سورة المائدة: 3 ) وتهنئتهم بذلك حرام سواء كانوا مشاركين للشخص في العمل أم لا .<br />وإذا هنئونا بأعيادهم فإننا لا نجيبهم على ذلك ، لانها ليست بأعياد لنا ، ولأنهـا أعياد لا يرضاها الله تعالى ، لأنهـا إما مبتدعة في دينهم ، وإما مشروعة ، لكن نسخت بدين الإسلام الذي بعث به محمدًا صلى الله عليه وسلم ، إلى جميع الخلق ، وقال فيه: {ومن يبتغ غير الإسلام ديناً فلن يقبل منه وهو في الآخرة من الخاسرين } ( آل عمران : 85 ) .<br />وإجابة المسلم دعوتهم بهذه المناسبة حرام ، لأن هذا أعظم من تهنئتهم بها لما في لك من مشاركتهم فيها وكذلك يحـرم على المسلمين التشبه بالكفار بإقامة الحفلات بهـذه المناسبة ، أو تبادل الهدايا أو توزيع الحلوى ، أو أطباق الطعام ، أو تعطيل الأعمال ونحو ذلك ، لقول النبي صلى الله عليه وسلم: \"من تشبه بقوم فهو منهم\". قال شيخ الإسلام ابن تيمية في كتابه اقتضاء الصراط المستقيم مخالفة أصحاب الجحيم : \" مشابهتهم في بعض أعيادهم توجب سرور قلوبهم بما هم عليه من الباطل ، وربما أطمعهم ذلك في انتهاز الفرص واستذلال الضعفاء \" . انتهى كلامه - رحمه الله - .<br />ومن فعل شيئاً من ذلك فهو آثم ، سواء فعله مجاملة أو توددًا أو حياء أو لغير ذلك من الأسباب ؛ لأنه من المداهنة في دين الله ، ومن أسباب تقوية نفوس الكفار وفخرهم بدينهم ."
