text = "السلام عليكم انا مستغربه اوى من شىء ان انسان عنده17 فاهم وعارف الحق عنكم جميعا وطريقة كلامه كانت منظمه ومرتبه عن ناس كتير اكبر منه اهتمتم من الظاهر ولكنه تحدث بالخلاصه (وخير الكلام ما قل ودل) يعنى اتكلم باختصار وكمان بعلم اللى عاوز يتكلم يتكلم وهو عارف بيقول ايه وكمان كذا راى لقتهم اراء غبيه موتت موتت موت وهبل وشكرا والسلام عليكم"
