posted = "2006-04-29"
text = "أنا مع الأخ عبد الله 17 سنة<br />جاب الخلاصة<br />ويريت ال شايف غير ذلك يجيب فتوى برده ويوريها لنا<br />الأستاذ هانى<br />الموضوع ان النصارى ( وهذا اسمهم فى القرآن )<br />بيحتفلوا به<br />الموضوع مش موضوع هو الكريسماس ولا لأ<br />الموضوع موضوع احتفال بيعظموه وبيحتفلوا به يوم 25 يوم 31 يوم 7 يناير<br />مش فارقه<br />احنا المسلمين عندنا عيدين نحتفل بيهم<br />ونخرج ونور بعض ونفرح<br />لكن أعياد بعظمها غيرنا بتهيألى صعب<br />كلام أخير من قال ان عدم الاحتفال بأعياد غير المسلمين وتهنئتهم يعد من سبل التفرقة بين أفراد الشعب الواحد<br />فهو مخطئ<br />أنصح الجميع بأن يتفقهوا فى هذه المسألة<br />النبى 1لى الله عليه وسلم لم يحتفل بيوم عاشوراء لأن اليهود يحتفلوا به بل صامه لأن الله أنجى موسى من عدو الله ( فرعون )"
