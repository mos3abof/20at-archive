author = "إن مشاركة النصارى في اعيادهم هو اقرار بهاوبمشروعيتها ، وهذا لا يحل لمسلم يزعم الايمان ، وقد أمرناربنا بالكفر بالطاغوت : اقرؤا : ومن يكفر بالطاغوت ويؤمن بالله ، فقد استمسك بالعروة الوتقى ، لاانفصام لها."
