subject = "انسان"
author = "انا احترم راي استاذ هاني لانه انسان فاهم و مثقف و قد اوضح مواعيد عيد الكريسماس و هو 25 ديسمبر و 7 يناير"
posted = "2006-01-04"
text = "اما 31 فهو يوم راس سنة جديدة اتية<br />و بالنسبة للمعاصي التي يقال انها ترتكب ليلتها اقول نقاط اوضحها:<br />من يرتكب المعاصي كما قيل فهو يرتكبها طول العام و ليس هذة الليلة من كل الناس<br />ثانيا ثقافة حفلات الكريسماس 3/4 من الافلام و الافلام بها فانتزيا و خيال<br />ثالثا: الانسان الذي يتكلم ان المسيحين يقوون بارتكاب المعاصي ليلتها احب ان اوضح له نقطة ان في هذا اليوم تقو الكنيسة باصلاة من الساعه 9 ال السادسة صباحا شكرا علي السنة الماضية ة الاتية<br />و اللي عايز يفهم يفهم و لو اني عارفة انب بكلم نفسي و ماحدش عايز يسمع بس بعمل اللي عليا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124142/http://www.20at.com/article2.php?sid=166"

