text = "بقيت أدخل عليه مرة كل سنة وألاقيه لسه دمه واقف برضه زى ما هو...<br />ياريت تحاولوا تتصرفوا في الموضوع ده!!<br />يعني على الأقل تجيبولوا كرسي...<br />دمي واقف أناكمان .. مش كده!!!!!"
