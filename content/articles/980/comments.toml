subject = "تكملة...أحرار الأقصى مع الملك وبريطانيا"
author = "YOUSEF AL-JAWARNEH"
text = "( سحر رسول الله صلى الله عليه وسلم يهودي من يهود بني زريق يقال له لبيد بن الاعصم، حتى كان رسول الله صلى الله عليه وسلم يخيل اليه أنه يفعل الشيء وما يفعله، قالت حتى إذا كان ذات يوم أو ذات ليلة، دعا رسول الله صلى الله عليه وسلم ثم دعا، ثم قال يا عائشة شعرت أن الله عزوجل قد أفتاني فيما استفتيته فيه جاءني رجلان فجلس أحدهما عند رأسي والآخر عند رجلي فقال الذي عند رأسي للذي عند رجلي أو الذي عند رجلي للذي عند رأسي ما وجع الرجل قال: مطبوب، قال: من طبه قال: لبيد بن الاعصم، قال: في أي شيء قال: في مشط ومشاطة وجف طلعة ذكر، قال: وأين هو قال: في بئر أروان قالت: فاتاها رسول الله صلى الله عليه وسلم في ناس من أصحابه ثم جاء فقال: يا عائشة كأن ماءها نقاعة الحناء ولكأن نخلها رؤوس الشياطين، قلت: يا رسول الله فهلا أحرقته قال: لا أما أنا فقد عافاني الله عزوجل وكرهت أن أُثير على الناس منه شرا قالت: فأمر بها فدفنت ).<br />إن في بريطانيا للسحروالسحرة أقسام ودوائر تتبع لدائرة المخابرات المركزية البريطانية التي تدعى<br />/‘M I 5’/<br />، وإن فيها من السحرة لمردة..، ناهيك عن الشياطين من الجن والانس معا، وإن فيها لطائفة كبيرة من المسلمين الباكستان تسمى \"البريلوية\" يعتبرون السحر من الدين ويفترون على الله وعلى الرسول الكثير من الكذب، ولديهم من الشرك ما يخرج من الملة كليا، فهم يطلقون على الرسول صلى الله عليه وسلم صفات ترجع الى الذات الالهية مثل إيمانهم بأن الرسول موجود معهم ويسمعهم ويراهم في أي مكان، وفي المولد النبوي يقيمون الاحتفالات تكريما لزيارة الرسول صلى الله عليه وسلم اليهم كما يزعمون، وفي مناظرة بيني وبين أحد كبار أئمتهم الضالين المضلين الذين لا يطلقون عليه إلا إسم \"عالم\"، قال: لي إذا أردت أن تواصل القول بأن محمد صلى الله عليه وسلم هو بشر مثلنا فلا تقترب من هذا المسجد ولا تدخله، أي المسجد الذي كنا فيه وهو مملوك لطائفتهم الضالة، قلت: بإختصار فليس الموضوع يتسع للحديث، إن الله تعالى يقول في أخر أية من سورة الكهف لمحمد صلى الله عليه وسلم ( قل إنما أنا بشر مثلكم يوحى اليّ...)وإنك والله مضل لكل هؤلاء الناس ولسوف أُحاججك أمام الله يوم القيامة. المهم أن هذه الطائفة من أكبر أعوان نظام المخابرات البريطاني على المسلمين أنفسهم فهم يعتبرون أنفسهم أنهم اهل السنة والجماعة وغيرهم كله على باطل، ولا ترى في كتبهم من الاحاديث إلا الموضوع والملفق على رسول الله صلى الله عليه وسلم، فهم جزء لا يتجزأ من النظام البريطاني، وإن بريطانيا لتجد فيهم ضالتها لحرب كل من يقتفي للاسلام أصول ويقتدي ويهتدي بهدي الرسول. كما أن فيها طائفة من السحرة السود الافارقة يجلبونهم من كل مكان في افريقيا ويضعوا لهم التسهيلات لاستقدامهم ويقبلوا لجوئهم ويدعموهم بالاموال للاستفادة من سحرهم.<br />ومنهم \"عرب\" أحدهم لم يقل لي أنه ساحر ولم أكن أعرف أنه ساحر ولكني إكتشفت لاحقا فتذكرت ما كان يقول، قال: لي مرة إن ريئس بلادهم يضطهد السحرة في معرض حديثه عن قضايا اللجوء وبريطانيا تقبلهم حيث الحرية المطلقه كما يدعي، وكانه لم يكن قد تلقى الاوامر بالعمل مع جهاز المخابرات البريطاني \"إم أي فايف\" ليتعاهدني بسحره قاتله الله في ذلك الوقت وذلك في أحد أماكن السكن الجماعي. ومن السحرة صينيون من الذين أختبرتهم أو تعرضت لسحرهم في مسيرتي الجهادية في بريطانيا ومنهم بريطانيون الاصل حيث قال لي كثير من الناس بأن السحر منتشر في أوساط البريطانيين، والله أعلم الى أي حد، فليس هناك بعد الكفر أي ذنب فإن في بريطانيا وفي أُروبا من الفجور ما هو أطغى وأكبر من السحر. ولقد جاءت علي أيام وأنا في فندق ليس به نزيلا إلا أنا فلقد أوقفوا استقبال النزلاء بعدما أُنزلته، وأحضروا طاقم كبير من السحرة ومن شتى الاجناس، وتحشير وأبخرة في الممرات ليل نهار وذات روائح كريهة تساوي في شدتها رائحة البراز \"الغائط\" بل أقوى، وطرق أبواب لايفتر إلا للحظات وفترات متقطعة وتزداد في أوقات قرائتي للقرآن ، وإطفاء أنوار مفاجئ وإنقطاع وبشكل متكرر وأغلقوا ممرات الفندق الرئيسية وجعلوا لي ممرا ملتويا حتى أصل الى غرفتي فعندما يطفئوا الانوار تشعر أنك تمشي في سرداب أحد الكهوف القديمة تحت الارض بعشرات الكيلومترات، وتطبيل وضرب في الغرف أو الجدران مفاجئ وبشكل متتكر كانفجارقنبلة في شدته في بعض الاحيان، فلا نوم ولا اطمئنان ولا خلود الى راحة، كان هذا السكن قد منحني إياه أحد كبار الخون والمنافقين في بريطانيا ويعتبر من كبار عملاء الملك عبدالله على أساس أنه يريد قربي منه حتى أتمكن من الحضور لتدريس أولاده اللغة العربية والاسلام وكنت وقتها بلا ملجأ حيث أسكن أحد المساجد مهددا...فلا إطمئنان ولقد مرت الأيام ووضعت أمتعتي في خارج المسجد بعد رجوعي اليه فلا مأوى ولا مكان تنفيذا من إمام المسجد لاوامر المخابرات الذي يتعاهدهم بالعمالة كما أنه عميل من عملاء عميل الملك الكبير وقد حاول هذا الامام منع أحد أصدقائي الذين منحوني نصرة من توزيع أحد بياناتنا التي نوزعها في أيام الجمع عادة خارج المساجد عند خروج المصلين، بل قال لي صديقي أنه قال له لا توزع له أمرا إياه أمرا مع علم الامام أن بياناتي لا تحمل إلا خيرا، ومع العلم أنه يوزع خارج المسجد رجال ونساء متبرجات وكافرات بيانات لا تمت للاسلام بصلة، كان هذا من ضمن الاساليب الضاغطه التي وضعت تحت شدة وطأتها في بريطانيا ولقد وضعت أمتعتي في الخارج لمرات عديدة وما زال الحبل على الجرار والله أعلم، بل والله إني لأعيش التشرد حتى هذه اللحضة التي أكتب فيها مقالي هذا فقبل أقل من أسبوعين فقط وضعت أمتعتي خارج مكان سكني الحالي وإني الآن أسكن في مكان مؤقت معرض فيه للطرد وبأي لحظة مع العلم أن أموال الملك تصرف بالالاف على كل من يعاديني ويؤذيني، بل أقول جازما بالملايين لان عملاء الملك الكبار من أصحاب الملايين الكبيرة ولا يعقل أن يصرف عليهم بالالاف. فكيف لنا أن نعود للاردن الآن...مع العلم أن جواز سفري محجوز لدى الحكومة البريطانية. ووالله إن هذا لقليل من كثير مما لاقيته، وإنه والله يتسع لصفحات بل كتب بل مجلدات لمن أراد أن يكتب أو يرسم ويصنع من الحروف كلمات. وكل ما لاقيته وأُلاقيه والله بإذنه تعالى لا ولن يزيدني إلا اصرارا على مواصلة سيري في طريقي الذي رسمته على ثقة بالله سبحانه وإنا بعونه تعالى لا نرى إلا بصيص من النور ينتظرنا في أخر الطريق...، لا بل والله الذي لا إلاه غيره أننا قد أُرينا تحرير المسجد الاقصى قبل الشروع بهذا المشروع أو التفكير بالشروع به، ولم نتذكر هذه الرؤيا إلا بعدما شرعنا به والله على ما نقول شهيد. وإن وجودنا في بريطانيا قد ولد لدينا القناعة التي نُسري فيها عن أنفسنا على القليل أن هذه هي البلد التي منحت اليهود وطن قومي في فلسطين وأن مشروع تحرير فلسطين قد يشاء الله سبحان وتعالى أن ينطلق من هذا البلد أيضا والله من وراء القصد وعلى الله قصد السبيل والله أعلم وما هو على الله بعظيم.<br />قد يقول البعض وكيف تقاوم كل هذا السحر والسحرة وشتى أنواع الاذى المتواصل، أقول: لا تخف ،فكما قال موسى عليه السلام فإن معي ربي سيهدين، وإني والله أقرأ \"البقرة\" غيبا مرتين كل يوم في ما قبل الصبح وفي المساء ناهيك عن وردي اليومي الصباحي والمسائي وتلاوتي المعتادة لكتاب الله عزوجل والصوم فيه جُنةٌ، وصلاتي ونسكي ومحياي ومماتي لله رب العالمين. بل والله إني لأُعَلِمُ بريطانيا وأُلقنها دروسا والملك عبدالله وزبانيتهم من السحرة وشياطينهم من الجن والانس سوياً أنه لا سبيل لكم ولا غاية الى أتباع محمد وجنوده صلى الله عليه وسلم، نسأل الله أن نكون منهم. بل وإن رسالتي \"رسالة الاسلام\" بلغت بعون الله الى أعماق أعماق حكومة بريطانيا بإن الاسلام لايُهزم أبدا أبدا أبدا... وأنا أعي ما أقول وأعلم ما أقول جيدا... فانا أقول من تجربة خمس سنوات مضت ومن صراع مرير وطاقات قد استنزفت وجراح والآم لم تنمحي أثارها بعد وتحديات صعبة مرت عليَّ لا يثبت فيها إلا من ثبته الله العلي القدير القوي العزيز ولا فضل فيها إلا له وحده سبحانه وتعالى. وإني أختصر القول والحديث بهذا البيت من الشعر الذي قلته في قصيدتي \" عراق أيها التاريخ دماً وحروبا \". فإن فيه إيجاز لمن وعى وأدرك.<br />إن الجهاد دربٌ من تمرسهُ<br />لم يتخذ من دون الآله صَديقا<br />وفي عودة..ومرة أُخرى في مركز الشرطة، حيث هيئة التحقيق تفتح ملفاتها وتشغل أدوات تسجيلها وتبدأ أسئلتها ونحن نجيب، السؤال: أنت تدعوا في المساجد على تدمير بريطانيا وتدمير إقتصادها، نعم أنا أدعوا في \"القنوت\" أدعوا في المساجد وفي مصلى الجامعة، وسأبقى أدعوا... \" اللهم دمر بريطانيا وأمريكيا كما يدمرون بلاد المسلمين، اللهم قتل من أبنائهم من يعادون الاسلام وأهل الاسلام، اللهم قتلهم كما يقتلون أبناء المسلمين، اللهم خرب ديارهم كما يخربون ديار المسلمين، اللهم دمر اقتصادهم كما يدمرون اقتصاد المسلمين، اللهم اقتل جيوشهم في العراق وفي أفغانستان جميعا، اللهم اقتلهم بددا واحصهم عددا ولا تذر منهم أحدا \" . هذا من ضمن ما أدعوا به في قنوتي وصلاتي، كما أن دعائي هو رسالة الى حكوماتكم، فماذا لكم في العراق وفي أفغانستان غير نهب ثرواتهم وسرقة خيراتهم ومقدراتهم وحرمانهم منها، فأنتم تقتلون الاطفال والنساء والشيوخ وتهدمون المنازل على ساكنيها الابرياء وتدمرون كل أسباب الحياة فيها بإسم المسيحية الحاقدة على الاسلام ، الم يقل جورج بوش على شاشة التلفاز على مسمع من العالم كله دون خشية أو حياء من أحد، ودون أن يحسب لاي جهة أي حساب \"إنها حرب صليبية\" وذلك عندما غزا العراق، وتدعون أن القتل والدمار بسط للديمقراطية والاصلاح. وماذا تقول في \"أُسامة بن لادن\" أقول: إن أُسامة بن لادن مسلم عظيم يدافع في افغانستان عن أطفالهم ونسائهم وشيوخهم الذين أنتم تقتلون، ويدافع عن أفغانستان البلد المسلم الذي أنتم تدمرون وتنهبون، طبعا هم يعتبرون مجرد الاشادة به جريمة في بريطانيا يعاقب عليها القانون الذي صيغ ليخدم اليهود ووضعه يهود، ومعاهدات تشرشل اليهودي وسايكس بيكوا ووعد بلفور اليهودي أيضا باعطاء اليهود وطن قومي في فلسطين تؤكد ما نقول وتحتويه. قلت: ثم إنكم تتهمونه بالارهاب وتتهمون كل مسلم ينادي بحقوقه ويجاهد من أجلها بالارهاب وأنتم من ترعون الارهاب وتمارسونه على شعوب العالم المستضعفة وواقع العراق وأفغانستان وفلسطين يشهد، وإن \"جورج بوش\" \"وتوني بلير\" هم الارهابيون ولا يوجد مسلم على وجه الارض ارهابي، فالاسلام دين السماحة والاخلاق الفاضلة والعدل بين الناس والاحسان، وكلمة اسلام تعني باللغة العربية الاستسلام التام والانقياد الكامل لله عزوجل رب هذا الكون، ربي وربكم، كما أن الاسلام هو دين كل الانبياء من أدم عليه السلام مرورا بموسى وعيسى الى محمد خاتم الانبياء والمرسلين صلى الله عليه وعليهم وسلم أجمعين، وخاتم الرسالات السماوية للناس كافة أبيضهم وأسودهم، عربي وبريطاني وأمريكي وأسيوي وإفريقي وأيٍ كان. وماذا تعني لك كلمة كافر؟ أنا أقول: كلمة كافر باللغة تعني \"غطى\" وهي في اللغة الانجليزية<br />)، Cover(<br />أي بمعنى غطى أيضا فأصل هذه الكلمة عربية، والكافر هو كل من غطى الحقيقة فهو كافر بها، وأنتم تكفرون بهذه الحقيقة، ألا وهي الاسلام، لذلك فأنتم كفار، فأنتم لستم مسيحيين كما تدعون، فلو كنتم مسيحيين لاتبعتم دين عيسى عليه السلام ولو اتبعتم دين عيسى لاصبحتم مسلمون لان عيسى عليه السلام يأمركم أن تتبعوا النبي الذي يأتي من بعده أي محمد عليه الصلاة والسلام وهذا مكتوب في توراتكم كما هو مكتوب لدينا في القرآن.<br />ومتابعا قلت لهم فلقد استغليت الموقف أن يكون هذا التحقيق دعوة لهم الى دين الله عزوجل بل ودائما أستغل هذه المواقف لتكون دعوة الى الله، ووالله الذي لا إله غير ما من تحقيق إلا وجعلت فيه دعوة لله مهما كان نوع التحقيق والمحققين،ثم إني أُحاول تأدية هذا الواجب في أي موقف ما استطعت. قلت: متسائلا كم سيعيش أحدكم ستون سبعون ثمانون سنة أقل أو أكثر قالوا: نعم، قلت: ثم ماذا، الموت الذي لا مفر منه، فالمشكلة ليست في الموت ولكن ما بعد هذ<br />18/04/2006<br />اقرأ بقية التعليق .."
