text = "ان حماس هى خط الد فاع الاول عن المقدسات وهى امل الامة واعداء الا سلام يدر كون ذلك ويدركون مدى خطرها عليهم ولهذا اجتمعت ملة الكفر كلها على حصار حماس وتوحدوا جميعا على وضع حماس فى مازق فياليت المسلمون يتوحدون جميعالنصرة الله والدفاع عن المقدسات فهم الاولى بالتوحد من اليهود والنصا"
