text = "ومتابعا قلت لهم فلقد استغليت الموقف أن يكون هذا التحقيق دعوة لهم الى دين الله عزوجل بل ودائما أستغل هذه المواقف لتكون دعوة الى الله، ووالله الذي لا إله غير ما من تحقيق إلا وجعلت فيه دعوة لله مهما كان نوع التحقيق والمحققين،ثم إني أُحاول تأدية هذا الواجب في أي موقف ما استطعت. قلت: متسائلا كم سيعيش أحدكم ستون سبعون ثمانون سنة أقل أو أكثر قالوا: نعم، قلت: ثم ماذا، الموت الذي لا مفر منه، فالمشكلة ليست في الموت ولكن ما بعد هذا الموت، الى الجنة حيث النعيم أو الى جهنم وبئس المصير وأنتم ما كثون فيها أبدا وخالدون، أي في جهنم، ولا يدخل الجنة إلا من يؤمن بالاسلام ويعتنقه، والامثله ذكرت كثيرا ولا متسع للكلام. نهاية التحقيق قال لي المترجم الذي أحضروه والذي لم يفتح فاه إلا في بداية التحقيق وفي بعض المداخلات التي لم تعلق بذهني وهو من أصل يمني قال: يا أخي أنا فخور بك...ثم قال ألم ترى الى المحقق الكبير والله إنه عرف أنك صادق فيما تقول وإني أحسبه سيسلم، ثم جائني هذا المحقق الى غرفة الحجز في قسم الشرطة وأحضر لي بعض الطعام وأبدى حسن تعامله واحترامه. كان هذا على أثر اعتراضي من قبل أهل الخيانة والنفاق على القنوت في صلاة الظهر والدعاء السابق الذكر على تدمير بريطانيا وأمريكا، وحدث ذلك في مصلى جامعة هلام شفيلد في مدينة شفيلد البريطانية، وقد يكون هذا هو الاعتراض المليون...ولكن هذه المرة كان خطبه شديدا الى حد ما ومفتعلا قاتل الله الخون والمنافقين وبائعي الدين والظمير الضالين المضلين المفسدين. لعبت الدولة البريطانية بقيادة جهاز المخابرات والبوليس دورا كبيرا وعملوا جاهدين على أن لا تصل هذه القضية الى المحكمة فهم لا يريدون لهذا المشروع أن يظهر للملاْ ولا ينكشف للعيان. فهم يتعاهدوني بالحرب الصامتة، وبكل الادوات والاساليب التي يطلقون عليها \"الحرب النفسية\" قاتلهم الله وقاتل كل العملاء والخون.<br />قد يقول البعض ولماذا أنت في بريطانيا أو لماذا خرجت بمشروعك \"أحرار الأقصى وأنصار حماس \" الى بريطانيا، نقول وبكل يقين والله ما خرجنا إلا \"هجرة\" وكما قلنا سابقاً حرصا منا أن يظهر مشروعنا للناس ونحصل على عالمية المشروع قبل أن يدفن في سجون النظام الاردني المهين فلا يرى نورا ولا تسلط عليه أنوار، فنحن والله الذي لا إله غيره لم نسلم من ملاحقة هذا النظام الملكي العميل منذ بداية دخولنا الى بريطانيا الى هذا اليوم الذي أكتب فيه هذا المقال، فرجالات بل أزلام الملك عبدالله كثر في هذا المكان طبعا بالتعاون مع النظام البريطاني الذي يقدم لهم الحماية حتى التبني، فهم والله كالعصابة في تعاضدها وتكاتفها على الشر، وزعيمهم يعتبر من الاسماء العربية المشهورة عالميا وكثير هم أعوانه، وأقول لنفسي كم يصرفون من المال على هولاء في الوقت الذي يعملون به جاهدين على حرماني من كل شيء، ومتابعتي وأذاي في كل مكان حتى السحر والتهديد بالقتل وعمل بروفات ليلية في أماكن وجودي على أن القتل يلاحقني حيثما كنت وأينما كنت...تحت وطأة الدعم البريطاني بذلك والتعتيم الكبيروالتغطية.. وعلى أن لا يظهر هذا المشروع أو أن يرى للعيان سبيل، كما ويعملون جاهدين على أن لا يتركوا للاتهام أصابع ولا أيدي يسرى للدليل.<br />بعد فشلهم بالاغواء المتواصل لسنوات... بدأوا بعرض النساء علينا للزواج عرضا تلوا الاخر فقلت: بمحض خبرتي بهم وبعميق درايتي لما يدور حولي والله إن بريطانيا لا تعرض عليَّ من النساء إلا كافرة أوخائنة..أو كلاهما معا، إنهم لايريدون أن تكون زوجتي معي في بريطانيا ( أحبها الله ) لان زوجتي ترتدي خمار أُمها \"عائشة\" رضي الله عنها...، وإنهم لا يريدون أطفالي ( بارك الله بهم وجعلهم سنداً وذخراً للاسلام والمسلمين ) أن يكونوا معي لانهم يصلون الفجر مع المصلين جماعة في المسجد...،وإلا ما الذي يمنعهم ومن بعد خمسة سنوات أو تزيد على عدم إعطائي حق الاقامة كحق للجوء الذي يحصل عليه من لا قضية له ولا لجوء، غير مكرهم واصرارهم على إخراجنا عن حيز ارتباطنا بأسرتنا في الاردن التي تربت على الشرف والاخلاق الحسنة وهدي الرسول صلى الله عليه وسلم، بل والله إنهم أروني وولدوا لدي القناعة من خلال أزلام \"الملك\" أن النظام الاردني وراء هذا التخطيط وحرماني زوجتي وأبنائي...ولقد لوحوا لنا بالمال كثيرا والملك والوزارة في معارض تكتيكاتهم وأساليبهم الشيطانية وما زالوا يلوحون، مقابل التنازل عن هذا المشروع، فأضفنا له نكاية بهم وإيمانا منا بقضيتنا اليقين، صوت المعارضة الاردنية والعربية والاسلامية، بعد استخارة الله تعالى في ذلك...فكان هذا المشروع كله بمثابة إعلان موجه الى الشعب الأردني والشعوب العربية والامة الاسلامية جمعاء، إذ نعلن فيه عن تبني مشروع معارضة أُردنية وعربية واسلامية شاملة تشمل كل أطراف الامة الاسلامية المترامية على وجه البسيطة الأرضية، حتى تكون (أحرار الأقصى وأنصار حماس ) الحركة الجهادية الاسلامية هي صوت الحق المعارض للنظام الملكي الأردني المهين والأنظمة العربية الفاسدة برمتها وكما الأنظمة الاسلامية المتردية في العالم كله. وذلك من أجل إيجاد مشروع إسلامي إصلاحي وحدوي ندعوا من خلاله الى إزاحة هذه الأنظمة العميلة الفاسدة والإعداد سويا وعلى قدم وساق، ونصراً لاخواننا في فلسطين ل( معركة تحرير المسجد الأقصى ) من براثن الدنس اليهودي والمشروع الصهيوني الغاشم والتي سيكون موقعها بعون الله في الأردن على ضفاف نهر الأردن، أُردن الشام والعرب والمسلمين.<br />ولو كان المال والملك والمنصب والسلطان هدفنا لحصلنا عليه بكل سهولة ويسر ووالله من البداية...ولما تكلفنا كل هذا العناء...ولكننا تربينا على الشرف وترعرعنا في كنف الاشراف..أهلنا وذوينا، مع أن أهلنا وذوينا من أبسط الناس...ولكنا خُلقنا شرفاء..ولا نقنع بغير الشرف..وسنموت بعون الله شرفاء. وإن المخابرات الاردنية تعي هذا وتعلم على خلفية اجتماعاتنا في مدينة \"اربد\" في معرض نشاطنا وفعالياتنا مع لجان مقاومة التطبيع مع العدوا الصهيوني مع أنه كان قصيرا وغير مقنعا بالنسبة لنا الدور لعدم قناعتنا للاسف بالمجتمعين، ليس لاشخاصهم، ولكن لم يكن فيهم ولا حتى واحدا يحمل فكر الاسلام وهم الاسلام...هذا باختصار...ولقد قال لي رجال المخابرات يوما اننا نعلم كل كلمة وكل جملة قيلت في اجتماعاتكم، فقلت والله إني لأعلم أنكم تعلمون..ولكني والله غير مستعد أن أُزودكم بكلمة واحدة قالها أي من الموجودين ولو كانت لا تساوي شيئا...أما إذا أرتم ما قلت أنا فوالله لن أتوانى بتزويدكم بكل كلمة مع علمي المطلق أنكم تعرفون كل كلمة قلتها، ولقد كان من ضمن كلامي على أثر استدعائي بعد ذلك الاجتماع. أنه يجب عل كل أُردني أن يقتي السلاح ويعتني به كما يعتني بأولاده إعدادا لتحرير فلسطين......وأما في بريطانيا فلو كان همنا وهدفنا هو الحصول على الاقامة واللجوء لذاته لحصلنا عليه، ففي السنة الرابعة من وجودي فيها بعد أن فشلت بريطانيا بتركيعي واعطائي حق اللجوء على طريقتهم....بعثوني الى مكتب محاماة قالوا إنه جديد المنشأ ويساعد ويتبنى قضايا اللجوء..ذهبت حسب ارشاداتهم الى العنوان، وإذا به داخل كنيسة..لا تصل اليه إلا عن طريق مكتب في الكنيسة..يخرج رجلا على انه يجهلني مع أنه يعرف من انا ومن أين جئت ولماذا جئت..يقول لي مكتبهم ليس هنا ولكني سأتصل لك بهم..يأتيني شخص وإذ به المحامي بنفسه..يفتح بابا ويغلقه خلفنا..ونمشي في كرادور أو ممر..فننزل درجا..فالى المكتب ..أنا متسائلا كيف سيصل الناس اليكم بهذه الطريقة..المحامي المكتب أُفتتح جديدا ونحن نبحث عن مكان مناسب. المهم، المحامي يقول لي في خلال أسبوعين فقط سوف نؤمنك بالسكن ومخصصات اللجوء وفي ضرف شهرين أو أقل سوف نأتيك بالاقامة الدائمة في بريطانيا فنحن موجودين للمساعدة وسوف نساعدك على استقدام زوجتك وأولادك بالسرعة الممكنة...أنا كأنني في حلم...شكرا..شكرا جزيلا..أنتم تستحقون الشكر...يخرج المحامي معي الى الباب ليودعني مرورا بما مررنا به عند الدخول، وشلة من السود في المتسع الذي أمام المكتب يتناخرون..لا تخفى علي خافيتهم..فخبرتي تجعلني دائما أعلم ما يدور حولي...المهم على القليل أنا فرح ففرحي يعني أنني سأجتمع وألتقي بزوجتي وأولادي بعد هذا العناء والغياب الطويل..على الباب ودعني بحرارة وقال لاتقلق سوف نتصل بك نحن...رجعت الى حيث المكان الذي كنت أقيم فيه وهناك فتحت القاموس لاعرف ما يعني أسم هذا المكتب فإن الكلمة لم تمر عليَّ باللغة الانجليزية...القاموس يقول الحقيقة المعنى للكلمة هو Samaritans اليهودي السامرائي، والكلمة بالانجليزية<br />والجملة \"مكتب المحاميين السامرائيين...أنا مندهشا فاقدا للفرح الذي فرحته..أمسكت هاتفي النقال واتصلت، رد عليَّ شخص أخر غير المحامي واعتذر عن عدم وجوده، فقلت هل أنتم يهود؟ قال لا ولكنا نساعد كل الناس يهودا وغير يهود، قلت له هل تعلم أن اليهود هم أعدائي، وأنا لا أتعامل مع أعدائي مغتصبي بلادي فلسطين....وإذا كانت الاقامة عن طريقهم فلا أريدها، لم يعجبه الكلام وأغلقت الهاتف. ثم استدعتني البنت التي في مركز اللجوء وقالت ماذا عملت كانوا سيأتوا لك بالاقامة، قلت لها أنا لم أخطئ أنا قلت لهم إذا كنتم يهود فلا أريد إقامتكم، أبدت تعجبا شديدا، ثم قالت إنهم يريدون منك اعتذارا عما قلت حتى يأتوك بالاقامة، قلت لها أنا مصر على ما أقول وبشدة فكيف سأعتذر...وإنتهت وما زلنا بلا إقامة’ طبعا هذا المكتب لم يكن حيا من قبل ولم توهب له من بعدي حياة فلقد افتتح فقط من أجلي. وكثيرة هي المواقف.<br />ولقد جهلت بريطانيا وجهل الخون والمنافقين وأزلام الملك من شياطين الانس والجن وما زالوا يجهلون أن النفس صار من طبيعتها الحرمان فهي لا ترنوا لما في أيدي الناس ولا تجتهد الى ما يجتهد اليه الناس، المال والجاه والمنصب...الرخيص ولو على حساب المبدأ... بل إنها تعلمت من هذا الحرمان بإنها من أغنى الناس وأن قناعتها هي كنوز كسرى وقيصر، وأن اليوم قد يكون أحسن بكثير من الغد...فإن المقبل جهاد والقادم صراع... فلله شكرا وحمدا في الحياة وفي الممات وما بعد الممات. وإنا لا نطمع إلا بنصر تعلوا فيه رايات الاسلام خفاقة فوق كل البلاد ويصل خيره الى كل العباد فتسعد به الانام كل الانام... بعد أن تكون عيوننا قد اكتحلت بتحرير المسجد الاقصى وفلسطين والعراق وأفغانستان وكشمير والشيشان... وكما نريد بعون الله المستعان أن نطمئن الى أن يأتينا الموت \"شهادة\" منه سبحانه وهو المنان، ونحن في سبيله بإذنه نعمل ونجاهد...وعن أبي سعيد الخدري رضي الله عنه ’حيث نختم مقالنا، قال: قال رسول الله صلى الله عليه وسلم:<br />( ألا أخبركم بخير الناس وشر الناس؟ إن من خير الناس رجلا عمل في سبيل الله على ظهر فرسه أو على ظهر بعيره أو على قدمه حتى يأتيه الموت. وإن من شر الناس رجلا فاجرا يقرأ كتاب الله لا يرعوي إلى شيء منه )رواه النسائي، نسأل الله عزوجل أن يجعلنا من خير الناس ومع خير الناس ولا يجعلنا من شر الناس ومع شر الناس.<br />والحمد لله رب العالمين وصلى الله تعالى على خير وأشرف المرسلين محمد الصادق الوعد الامين وعلى أله وصحبه أجمعين ومن تبعهم بإحسان الى يوم الدين وسلم تسليما.<br />(أحرار الأقصى وأنصار حماس)<br />\" صوت المعارضة الأردنية والعربية والإسلامية \"<br />المهندس: يوسف الجوارنه<br />www.ahraralaqsa-ansarhamas.com"
