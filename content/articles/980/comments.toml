[[comments]]
order = 6
subject = "أحرار الأقصى مع الملك وبريطانيا"
author = "مهندس: يوسف الجوارنه"
text = "السلام عليكم ورحمة الله وبركاته<br />أرجوا أن تصل رسالتنا هذه الى رئيس الوزراء اسماعيل هنية وجزاكم الله خير الجزاء<br />بيان صادر عن الحركة الجهادية الاسلامية<br />(أحرار الاقصى وأنصار حماس)<br />\" صوت المعارضة الأردنية والعربية والإسلامية \"<br />أحرار الأقصى مع الملك وبريطانيا<br />خمس سنوات من عمرنا مضت في بريطانيا الطاغوت الأكبر..، ونحن ننام ونصحوا على أذاهم، فقد تعاهدونا بالاذى كما تتعاهد الام طفلها بالحنان والرضاعة، خمس سنوات ونحن نبحث عن ملجأ يؤوينا مع أن الذي يطلق عليه اسم متسول في بلادنا العربية ففي بريطانيا يوفر له الملجأ من غير عناء، لا بل إنه حق من حقوقه المكتسبة التى لا يساوم عليها ولا يختلف عليها اثنان، أما إنسان مثلنا يمتثل لقول ربه وخالقه ولا يبغي الحياد عنه ( أمر أن لا تعبدوا إلا إياه ) فهو ألد أعداء بريطانيا الحاقدة على كل من لم يسجد لها من دون الله، مع أني طالب للجوء السياسي فيها ومن المفروض أن يكون لي حقوق تسمى في العرف الدولي \"حقوق الانسان\" مع النظر الى ما جرى في أفغانستان وما يجري الآن في العراق وطول عهد ما يجري في فلسطين يعرف أنه لا حقوق لهذا \"الانسان\"...حرب شعواء شنوها علينا من البداية فحرمان من اللجوء ومخصصاته وحرمان من العمل إلا ما ندر اسبوعين أو ثلاثة ثم فصل بلا معنى...عقاب تلو العقاب... أما الاسباب، بل أصل الاسباب كلها هو عدم الركوع لبريطانيا وسياستها التي تدعم اليهود وتنصرهم وتذود عن حياضهم أيما ذود، وحرمونا من كل موارد الدخل، وحرمونا من المسكن، وحرمونا حتى من تلقي العلم في الجامعة مع أنه لغيرنا مسموح، والادهى والامر هو حرماني أهلي ( زوجتي وأبنائي الاربعة )، حرمان تلوا الحرمان والسبب أنني رجل لم أسجد وأرفض أن أسجد الى بريطانيا من دون الله ولو سجدة واحدة، ولن أسجد بعون الله ما دامت دمائي تجري في عروقي فأنا حر من أحرار الله في الارض ورمز من رموز العزة والإباء ورجل من رجال الحق، لا أُلبس نفسي غير لباس ولا أُزكي نفسي على الله.. ولكني هكذا أُري نفسي لعدوي اللدود وعدوا الله.. بريطانيا الحاقدة وهكذا أُلقنهم وأُعلمهم. وثقتي بنفسي المستمدة من مبدئي لا توازيها ثقة، فلو قلت الى حد الغرور أقول بل هي الغرور بعينه، لانها ببساطة مستمدة من تعلقي برب هذا الكون جلَّ وعلا ومن ثم إيماني اللامحدود بمبدئي الذي أدعوا اليه وقمت من أجله.<br />فمنذ أيامي الاولى في بريطانيا حيث لم يمضي على وطئ أقدامي لترابها وأجوائها المنجوسة أكثر من شهرين حتى بعثوا الي بحوالي سبعة من أزلامهم ضربوني في مكان عام حتى الموت مباغتة ودون سابق إنذار أو إشارة، ضربة \"جبان واحد\" إجتمعوا عليها بعد تخطيط مسبق وتنسيق موزون، كنت أمشي مسبحا وأذكر شاكرا لله فلا أدري سوى أني في وردي اليومي أتلوه وفي ساعة من ساعات المساء حيث كنت في طريق عودتي الى الملجأ الذي طردوني منه أملا أن أُؤوي نفسي عند صديق... وإذ بي في الارض أُضرب بلا رحمة وأُرفس فلا هوادة، لقد كان الضرب معظمه في العنق حيث \"المقتل\" وكان الرفس في القلب حيث \"لا إله إلا الله\" مصدر النبض بها، وإنتهى المشهد في المستشفى مع أنه طويل ويحتاج الى صفحات حتى ينقش على جدار الزمن، ونذكر من الاثار الظاهرة للعيان لهذا الحادث أو لهذه الجريمة، أنه تم تعليق يدي في رقبتي الى حقبة من الزمن جراء الوقوع الاول للجريمة مع العلم أنني لست بدينا.<br />وبعد الانتقال الذي لا خيار لنا فيه من مدينة لندن حيث العاصمة البريطانية الفاجرة الى مدينة شفيلد حيث المدينة التي رأينا اسمها في المنام قبل الهجرة وقبل التفكير بالهجرة مع أنا لانعرف هذا الاسم من قبل ولا نعرف له معنى ولا في أي أرض يكون، تعاهدوني هناك بالخون والجواسيس من أبناء جلدتنا في البداية، السكن مشترك، والساكنون منتقون ومدربون وملقنون ماذا يفعلون، ولكل دوره، شياطين في صور أدميين، لا تنفعهم تذكرة ولا تبلغ الى قلوبهم موعظة ، يسجدون لبريطانيا ولما تلقيه عليهم من دراهم معدودة ومال رخيص ولا يسجدون لله إلا مرآة وحسب ما يتطلبه الدور الذي يقوم به أحدهم، أذى كثير وإزعاج متواصل ليل نهار وخمر ونساء..وعبث في غرفتي وتعطيل في جهاز الحاسب وشطب ما أكتب من على جهاز حاسبي ثم تنتهي الحلقة في مركز الشرطة بإنتظارحلقة أُخرى قادمة، والمجرم طبعا دائما صاحب اللحية والسجادة والوضوء.<br />في مركز الشرطة، يأتوني بدكتور مثقف وعلى قدر من الفهم في السياسة وفي قضايا \"الشرق الاوسط\" كما يطلقون عليه، أو قد يكون ملقناً تلقينا،ً أنا لا أعرف لماذا يأتوني بدكتور في مركز الشرطة ، طبعاً تبين لي لاحقاً أنهم يعدون من البداية الى مرحلة مرضية يخططون اليها ويمكرون<br />( ويمكرون ويمكر الله والله خير الماكرين ).<br />المهم زبدة ما يقول الدكتور، الدكتور باللغة الانجليزية قائلا: يا يوسف انت تعلم أن اليهود قوة عظيمة ولا قبل لاحد أو لايٍ من بلادكم على مجابهتهم فدع الامور للايام ودع عنك الاقصى وخذ الحياة في بريطانيا، أي نعطيك الدنيا وما تريد ولا تتكلم عن اليهود والاقصى والقدس وفلسطين ولا تمدن عينيك الى تحرير.<br />أي ضع القضية في بئر وأغلق عليها...والى متى...فلربما يأتي بعض السيارة.. في زمن تكون القضية فيه كنز..والبيع فيها ثمن بخس دراهم معدودة... بدل أن يكون الشراء غال ربما يكلفك حياتك وتكن من الخاسرين، قلت إن الاقصى لن يعود بثمن بخس ولا بدراهم معدودة، فما سلب بالقوة لن يعود الا بالقوة، فكيف إذا كان المسلوب وطن ومقدسات وإرث أُمة وحضارة وعقيدة ومقومات، ثم إني في بلادكم حيث \"حرية الرأي\" ولا حرية للرأي... خصوصا عندما يتعلق الامر باليهود...فكيف إذا كان صاحب هذا الرأي مسلما مطالباً بحقوق له قد سلبها يهود، ثم إني لا أخشاكم ولا أخشى اليهود الذين يُروني أو أنتم تُروني أن لهم في بلدكم شوكة وأيدي وأصابع من حديد ولا الخون والعملاء الذين تشترونهم من أبنا الاسلام،*الخارجين بأعمالهم عن الملة إذا ما قرنت بمسألة البراء والولاء*، إنما أنا رجل أخشى قوة واحدة في الوجود كله، فأنا لا أخشى إلا رب هذا الوجود الذي أوجدني وأوجدك وأمرني وأمرك أن لا يبغي بعضنا على بعض ولا يسلب بعضنا حقوق بعض ولا يتخذ أحدنا من دونه إلهاً ولا معبوداً ولكنكم قوم تكفرون.<br />وقلت لهم أيضا وفي أكثر من مناسبة إنكم تملكون السجون والتعذيب والحرمان والتشرد الذي تمارسونه عليّ منذ سنوات وتملكون قتلي إذا شاء الله وقدر ذلك، ولكنكم لا تملكون كتم صوتي الذي يدعوا الله بأن يدمركم ليل نهار وفي السر والعلن في القنوت وفي السجود، في المساجد عندما أُقدم لإمامة الناس وفي صلاتي التي أُصليها منفرداً، وإن القتل الذي تهددونني به بين الحين والاخر إنما هو هدفي ومنشودي كما أنكم تنشدون الحياة وتحرصون عليها كل الحرص، فلو كان الموت هو الذي يخيفني فوالله لما خرجت بمشروعي هذا، وما خرجت من بلادي إلا حرصاً مني أن يظهر مشروعي هذا للعالمين قبل أن يدفن في سجون \"الاردن\" فيبلى ويأكله التراب، ولو كان الموت هو الذي يقلقني فلما والله سلكت هذا الطريق الوعر ولما أمضيت عمري بين المخاطر والعذابات والجراحات... ولكني رجل باع نفسه لله عزوجل منذ اليوم الذي أخذ على عاتقه \"تحرير المسجد الاقصى\" طامعا بما بعد الممات، وإنكم لا تفقهون بما بعد الممات، لإنكم قوم تجهلون. إنه الطريق الذي رسمناه وسلكناه والهدف الذي حصرنا أبعاده...ورسمنا زواياه. فالنظر ليس إلا الى ما فوق السحاب، والهامات توازي في شموخها الجبال، والمشروع أملا بالله أن يخرج من هذه الامة رجال فيهم الحمية والنخوة والغيرة على ما يصيب إخواننا في فلسطين وما يصيب الامة بشكل عام وعلى هذا الدين القويم العظيم، فيعقد الله عزوجل لهم النصر والتحرير، ويشفي بهم صدور المؤمنين ويذهب غيظ قلوبهم أجمعين. نريد بمشروعنا \"أحرار الاقصى وأنصار حماس\" أن يخرج الانسان العربي المسلم عن إطار المشاهدة والحزن والانكار لما يحدث لاخواننا هناك الى حيّز الفاعلية والمشاركة الفعالة في دفع الاذى عنهم والذود عن عرضهم وحياضهم والنيل من عدوهم وعدونا وعدوا الله وقتالهم وإخراجهم من ديارنا ومن أرضنا التي قدسها الله وباركها للعلمين وكتبها لنا وأورثنا إياها كمسلمين. نريد بمشروعنا أن يتنصل المسلم من حب الدنيا والركون اليها الذي أورثنا الذل وأن يعدل عن كراهية الموت والخنوع من أجل العيش ورمق البقاء كيفما تكون الحال وحيثما تكون الاحوال، فلا نظر الى عزة ولا تطلع الى مجد، ولا غيرة على دين ولا حسرة على حال الأمة ولا مرارة على ما يصيبها، مع العلم أن هذه صفات غير اسلامية ولا تتمتع بها الشخصية الاسلامية الحقيقية ولا تمت اليها بصلة، فالمسلم بشخصيته الاسلامية عزيزا قويا وحرا أبي، هامته في الثريا ولا ينظر لما دون السحاب. وهذا عمر رضي الله عنه يقول: \"إنما سبقتم الناس بنصرة هذا الدين\"، فمن لم توجد فيه حمية لنصرة دينه فلا خير فيه حتى يراجع نفسه ويوجدها..، ولقد أكد مصابنا الذي نحن فيه وعزاه الى وهننا رسول الله صلى الله عليه وسلم في حديث تداعي الأمم عندما سئل عن \"الوهن\" وما الوهن يا رسول الله فقال: ( حب الدنيا وكراهية الموت ) وقال أيضا ( إذا تبايعتم بالعينة وأخذتم أذناب البقر، ورضيتم بالزرع، وتركتم الجهاد، سلط الله عليكم ذلاً لا ينزعه حتى ترجعوا الى دينكم ). رواه أحمد وأبو داود وصححه الحاكم. ونريد أيضا بمشروعنا أن يخرج من هذه الامة رجال في صفاتهم مؤمنين وفي جهادهم بيع رابح قد قبظوا ثمنه سلفا، فثمنه جنة عرضها السموات والارض، وهم قد باعوا أنفسهم لله عزوجل كما باع الذين من قبلهم فاستحقوا قول الله فيهم. ( إن الله اشترى من المؤمنين أنفسهم وأموالهم بأن لهم الجنة يقاتلون في سبيل الله فيَقتلون ويُُُقتلون وعدا عليه حقا في التوراة والانجيل والقرآن ومن أوفى بعهده من الله فاستبشروا ببيعكم الذي بايعتم به وذلك هو الفوز العظيم )التوبة111.<br />وخلاصة ما قلنا: أي للدكتور: إن الأقصى والقدس وفلسطين مقدسات إسلامية وأرض إسلامية مغتصبة ومحتلة ولا مكان للمحتل إلا أن يرحل عن هذه الارض مهما بلغت قوته ومهما آلت اليه سطوته، فإنني في حقي أقوى منه ودعوتي ومناداتي بهذا الحق إنما هي النور الساطع والحق الذي لا لبس فيه، وسأبقى أدعوا الى هذا الحق واسترجاعه وتحريره حتى أخر قطرة من دمائي وحتى أخر نفس تلفظه أنفاسي قبل أن أُفارق هذا الكون، وقلت له أنا مسلم ولا أخشاكم، ولا أخشى أحدا سوى الله ربي وخالقي، ولا تنسى أنني وأُكرر لك القول أدعوا الى حق، فهذه مقدساتي وأرض أهلي وأبائي وأجدادي المسلمين. إنتهى الحوار بأن أسدل رأسه وسكت فأنا كالليث حين أتكلم عن حقي إذا كان هذا الحق ينطلق من ديني وعقيدتي وليس حق شخصي.<br />لقد كان الحقد أكبر بعدها والبطش أشد والعقاب تعذيب ومزيدا من الاذى الذي يتقنه الظالم دوما، فهذا هو الظالم دوما لا يترك أداة للاذى إلا استخدمها ولا طريقا للبطش إلا سلكه ولا سبيلا للمكر والحيلة إلا استعمله وفوق هذا فهو مريض في استعذابه لعذاب الناس الابرياء وسلب حقوقهم وحرمانهم.<br />تعاهدوني بالسحر والسحرة، في كل مكان أمضي اليه، واي بيت أرحل اليه، أطعموني أوساخ فجورهم، لقد قال لي بعض الاخوة إنهم يستخدمون\" حيض النساء\" من جملة ما يستخدمونه في السحر فقلت له لقد أطعموني ما هو أقذر من هذا فوالله إن معدتي لتنبئ بذلك. في البداية كالتيار الكهربائي يجري في جسدي وأوصالي أو كالاشعة لا أدري، ومن بعد ذلك ألام مفاجئة في المعدة شديدة في ألمها كالصاعقة تنزل ثم تروح تاركة أثارا للاذى والدمار، الام في الظهر، الام في الرقبة وصداع في الرأس لم أختبر شدته في حياتي كلها، وأنا محتار لا أعلم مالذي يحصل حتى قالوها لي بألسنتهم إنه السحر، بعدها صرت أعلم أنه السحر الذي أُصيب به سيد الخلق وحبيبنا وقدوتنا محمد صلى الله عليه وسلم، قلت لنفسي ولبعض الناس سبحان الله لم يترك شيئا إلا وترك لنا به أثرا، فهو القدوه حيث يعلمنا، فلم يترك شيئا إلا وعلمنا إياه، فهوا أول من سحر من هذه الامة، وهذه عائشة رضي الله عنها تقول:<br />( سحر رسول الله صلى الله عليه وسلم يهودي من يهود بني زريق يقال له لبيد بن الاعصم، حتى كان رسول الله صلى الله عليه وسلم يخيل اليه أنه يفعل<br />18/04/2006<br />اقرأ بقية التعليق .."
