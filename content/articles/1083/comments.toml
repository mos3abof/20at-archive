subject = "عيد المغرب من خلال مكتسبات رمضان"
author = "محمد العلمي"
posted = "2006-10-27"
text = "بسم الله الرحمن الرحيم<br />ما قرأت حول الموضوع لا علاقة له البثة بالعادات والتقاليد عند المغاربة فهم شعب مسلم بامتياز يتمسكون بالعقيدة أكثر في شهر رمضان مواضبون على المساجد في كل أوقات الصلاة المفروضة والمسنونةقبل العيد أو بعده حيث لا تجد مكانا لك في بعض الصلوات في بعض المساجد خصوصاوأن بلاد المغرب معروفة بقراء مغاربة انفردوا بقراءة ورش وطريقة مغربية تجعل من المواطنين المغاربة المنافسة في التعرف على أكبر عدد من المساجد ومن المقرئين . ليلة القدر تكون مشهودة بالتبتل والخشوع والإجلال يطبعها ختم القرآن ويليه ختم صحيح البخاري في بعض المساجد بالمدن العتيقة . في ليلة العيد يودع المغاربة رمضان بالبكاء على الع تعالى والتبجل إليه سائلينه أن يعيده عليهم بالخير والبركة ومستعدين لصيام ستة أيام من شوال ليكملوا الحول مصداقا لقول الرسول صلى الله عله وسلم من صام رمضان وتابعه بست من شوال فكأنما صام الدهر كله .فالمغاربة يأخذون مكتسبات خيرة في رمضان من خلال دروس الوعظ والإرشاد التي تسهر على إشرافها وزارة الأوقاف والشؤون الإسلامية ونظاراتها بمختلف ربوع المملكة تختار لها خيرة الأساتذة وأجودهم يعلمون الناس أمور دينهم ويعدونهم لمعاشهم ومعادهم أحسن إعداد ويبعدون عنهم عقائد الخرافا والأوهام ."
archived = "2006-11-02"
