[[comments]]
order = 0
subject = "الأعمار بيد الله"
author = "Blue Sea"
posted = "2006-04-30"
text = "السلام عليكم ورحمة الله<br />رغم اني مقتنع بالكلام إلي في المقال<br />بس نرجع و نقول الأعمار بيد الله وحدة<br />ولكن علينا اننا نأخذ بالاسباب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152326/http://www.20at.com/article2.php?sid=748"

[[comments]]
order = 1
subject = "طويل العمر ..يطول عمره"
author = "أحلام فاضل"
posted = "2006-05-01"
text = "نعم أصدق مانشر في المقال, فهي ليست حقيقة بل واقع,وهذه من تجربه شخصية ,إنما يطول عمر الإنسان ليس بإزدياد عدد السنين على عمره الذي كتبه الله عزوجل ,وإنما بدل أن يعيش من عمره سنين كثيره عليل بسبب عاداته السيئه في الطعام وكمية الحركة وطلب الراحة,إنما يطول عمره بعدد السنين الخالية من الأمراض المزمنةوالقاهره لصحة الإنسان التي تقصر من عمره.وشكرا لكم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152326/http://www.20at.com/article2.php?sid=748"
