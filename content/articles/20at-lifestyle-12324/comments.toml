text = "خليك مع ربنا على طول صدقنى هاتكون اسعد الناس والاجمل انك هاتمثل اسلامك ودينك والامة الاسلامية العظيمة وعيش بالامل وعيش كل لحظة كأنها أخر لحظة فى حياتك وقدر قيمة الحياة .اة بجد انا عمرى ماهاجوز من السلك الدبلوماسى لان بجد غيور جدا وحمش هههههه"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202072146/http://www.20at.com:80/20at/lifestyle/12324-2009-06-09-12-53-30.html"

