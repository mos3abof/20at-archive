author = "لولولولوليش"
posted = "2009-06-18"
text = "بسم الله الرحمن الرحيم<br />لا تذكروني بحلمي الكبير في أن أكون دبلوماسية فتجربتي مريرة واضحك كثير لما أتذكر امتحان المقابلة بعد أن نجحت في المتحان الكتابي فهذا الأخير شيء والمقابلة حاجة تانية خالص دي محتاجة ثقافة عميقة سياسية - اقتصادية<br />جرأة- ذكاء- سرعة بديهة- قدرة على الخروج من مأزق عدم وجود إجابة- اضطلاع دقيق على الأقل على مشاكل منطقة الشرق الأوسط<br />إجادة اللغة الانكليزية على الأقل<br />ثقف نفسك اتعب شوية ما تستسلمش يا خويا يمكن تصير دبلوماسي - سفير…"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202072146/http://www.20at.com:80/20at/lifestyle/12324-2009-06-09-12-53-30.html"

[[comments]]
