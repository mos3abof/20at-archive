text = "بصراحة يا جماعة السلك الدبلوماسى شى قوى جدا ولية هيبتة واحترامة ومش السهل بالفعل انا اى حد ممكن يدخل فى كيان السلك الدبلوماسى حتى لو معاة وسطة بس الثقة فى النفس وايمانك من جواك انك بجد هاتكون شخص متميز بغض النظر على انك دبلوماسى او غيرة دة طريق انك بجد تكون انسان يستحق ان يمثل مصر ."
