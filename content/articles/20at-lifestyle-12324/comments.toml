subject = ""
author = "سلمى"
posted = "2009-06-30"
text = "يا شباب ان كل حلمى انى اشتغل فى السلك الدبلوماسى<br />بس للاسف واللى يضحك انى معرفش انجليزى كويس حتى<br />ممكن بقى تفيدونى انا اقدر اتعلم انجليزى كويس قرائة وكتابة فى قد اية وقت يعنى<br />ارجوة الافادة باللة عليكم"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202072146/http://www.20at.com:80/20at/lifestyle/12324-2009-06-09-12-53-30.html"

