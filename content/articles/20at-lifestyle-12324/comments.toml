author = "مصــرى"
posted = "2009-06-10"
text = "زعـلأن على فلطسيـن<br />دلوقتــى سكــوت<br />[ *** ]ـح أسرائيـــل وعـد من اللــله .. ووعــد الله حـــق والحمد الله الى احنأ مسلميـن وعارفيـن ربنأ .. بـس المشكلــة من المسلــم الذى لا يعرف ربـة ويتعايـش معا المسلميـن بكلامـة وهـو فى طبعــة كأفر بالنسبـة لمسالـة سفير .. انا بقــول انــى المأضى لا يمـوت واسرائيــل عملـت كتيـر مش استنأأأ اكـون سفير عشان احافـظ على بلدى ودينى وشكـرا"
archived = "2009-06-18"
capture_url = "https://web.archive.org/web/20090618081059/http://www.20at.com:80/20at/7ayatna/12324-2009-06-09-12-53-30.html"

[[comments]]
