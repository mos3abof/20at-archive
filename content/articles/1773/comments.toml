subject = "مبارك الإبن: ودلالات الزيارة السرية"
author = "محمود الزهيري"
posted = "2006-05-27"
text = "مبارك الإبن: دلالات الزيارة السرية<br />زيارة جمال مبارك للولايات المتحدة الأمريكية والعروج خصيصاٌ لمستشار الأمن القومي الأميركي لها بعض الدلالات التي لاتخفي علي الكثير من الذين يعملون في الحقل السياسي, والعربي, فهي لم تكن لتجديد رخصة الطيران, ولم تكن خاصة بعرض برامج الإصلاح المزعومة والمختزلة فقط في عقلية جمال مبارك والأسرة الحاكمة في مصر, ولم تكن جولة سياحية يأتي موعدها في اليوم التالي لسحل متظاهري حركة كفاية والقوي الشعبية ,ولم تكن من أجل مصر والمصريين , فالرهان الأمريكي لايتم علي حصان خاسر , وإنما المعتاد علي الأحصنة الرابحة التي تحقق أكبر القفزات للسياسة الأمريكيةعلي المستوي الداخلي والخارجي, فالرئيس مبارك الأب لم يعد قادراٌ علي تحمل تبعات قيادة شعب مصر من نواحي تخص الرئيس ذاته وتتمثل في إعتلال صحته البدنية والعقلية, والأمور التي تخص الشعب متمثلة في حالة فوران سياسي وإجتماعي بسبب إعتلال صحة الشعب البدنية والعقلية أيضاٌ وأصبحت المخافة من المختلين عقلياٌ الذين أصبحوا يشكلون قطاعاٌ كبيراٌ في الشعب المصري, وهؤلاء المختلون عقلياٌ تقع عليهم العديد والعديد من الضعوط السياسية والإجتماعية والإقتصادية مما قد يجعلهم يفقدوا الوعي الكامل ويتصرفوا كمجانين من وجهة نظر وتحليل منظري النظام المصري , ومن ثم كانت مخافة النظام من الأيام المقبلة التي قد تكون حالكة السواد من وجهة نظر وتحليل منظري النظام, ومن ثم كانت الزيارة السرية لأمريكا ولجنة الأمن القومي الأمريكي ,فالمادة الخنثي المسماة بالمادة 76 من الدستور الحزين لم تجدي نفعاٌ في مسألة توريث جمال مبارك لعرش مصر خلفاٌ لأبيه , وكذا سحل وضرب وهتك عرض المتظاهرين وإعتقالهم وإستخدام أبشع الطرق في التغذيب لم تجدي نفعاٌ, وظهور حركة القضاة بقوة وشراسة غير معهودة علي الساحة الإجتماعية ومطالبتهم بتعديل قانون السلطة القضائية الذي يتيح للقضاة الفصل الشبه تام عن سيطرة السلطة التنفيذية عن السلطة القضائية, ومطالبهم بالإشراف القضائي التام علي الإنتخاببات بجميع أنواعها ومراحلها من تسلم الجداول الإنتخابية وتنقيتها وتلقي طلبات الترشيح حتي إعلان النتائج, ومطالبتهم بالإفراج عن جميع المعتقلين الذين تضامنوا معهم في مطالبهم, كل هذه الأمور جعلت النظام الحاكم في مأزق سياسي خطير يوحي بدلالات تبتعد بجمال مبارك عن طريق التوريث للحكم خلفاٌ لمبارك الأب, ومن ثم مخافة الملاحقات القضائية الدولية لمبارك الأب والإبن بل ونظام مبارك بالكامل. ومن هنا كان الذهاب لأميركا من أجل التفاوض علي وراثة حكم مصر وشعب مصر , ولأن الأمريكان تحركهم المصلحة العليا للوطن الأميركي والشعب الأميركي كانت الأمور تتطلب بعض الشروطالمملاة علي الوريث طالب التوريث من الأمريكان والذي أصبحت كل الضمانات الدستورية والقانونية والواقعية في السياسة والإجتماع ضده .<br />فماهي شروط الأمريكان ؟<br />أولاٌ: لأن الأمريكان يؤرقهم تنامي تيار الإخوان المسلمين في المجتمع المصري بفعل فكرة الخلاص الديني للشعب المصري المأزوم بفعل الفقر والجهل والمرض الناتج من سياسات مبارك الأب والإبن ومنظري الحزب الوطني علي مدار ربع قرن من الفساد في جميع المناحي ومن ثم لجأ الشعب المصري لفكرة الخلاص الدين باحثاٌ عن الجنة المؤجلة مادام ليس في مقدوره العيش في جنة الدنيا المتمثلة في تدبير أبسط أمور الحياة من أكل و طعام وشراب وفرصة عمل ومواصلات وعلاج وصرف صحي وتأمين لقمة الخبز التي يتقاتل عليها الشعب المصري يومياٌ أمام المخابز البلدية, وكأن الإخوان هم صنيعة النظام بفساده وإستبداده, ومن هنا كان الإخوان بالمفهوم الأميركي يمثلون قمة الخطرعل المصالح الأمريكية في الحال الآني والمستقبل القريب والبعيد من تنامي ظاهرة الإسلام السياسي الذي يكن العداء لأمريكا والغرب ويلبسه الثوب الديني الذي لايجدي معه ثمة حوار أونقاش وظاهرة فوز حماس مازالت عالقة في الوجدان والعقل الأميركي ومعها ظاهرة محمود أحمدي نجاد في إيران, وفوز الإخوان بالمقاعد الثمانية والثمانون برغم التضييقات الأمنية في إنتخابات مجلس الشعب المصري الفائتة, ومنة ثم كان الشرط الأول عدم الإستعانة بالإخوان المسلمين في صعود جمال مبارك علي عرش التوريث في مصر, وهذه أزمة لجمال مبارك كان يفكر فيها ويعمل لها حساب والأمريكان أسقطوها من حساباته<br />ثانياٌ: الموقف من منظمة حماس والسلطة الفلسطينية, فأميركا والإتحاد الأوروبي وإسرائيل الجميع ينظر لحماس علي أنها من ضمن المنظمات الإرهابيةالتي يتوجب علي الدول الصديقة لأميركا والإتحاد الأوروبي وإسرائيل أن تقف في خندق هذه الدول وتمنع عنها أية مساعدات حتي تظل منظمة حماس تعيش فس ظلال أزمة خانقة ويتم تأديب أي تيار سياسي يستند إلي مرجعية دينية تهدد المصالح الأمريكية والأوروبية ومن ثم تهدد إسرائيل ذات الصلة بأوروبا وأمريكا وذات المصالح المشتركة ومن ثم يتم تضييق الخناق علي حماس والشعب الفلسطين الذي تضطره الظروف للبحث عن الجنة الآنية متجاهلاٌ عن عمد الجنة المؤجلة, ومن ثم يحتدم الصراع والإحتقان الداخلي المؤدي في أقرب الفرص لحرب أهلية وإقتتال داخلي ومن هنا يأتي دور جمال مبارك في كف يده عن مساعدة حماس والتدخل بالوساطة أو بالتجارة لحل الأزمة ونزع فتيل القنبلة, وهذا له ملامحه الفجة من عدم إستقبال أي مسؤل فلسطين من منظمة حماس في القاهرة وعدم دعوة السلطة الفلسطينية لمؤتمر دافوس في شرم الشيخ, وكذا عدم إخذ قرار في مسألة توجيه الإعانات لمنظمة حماس والشعب الفلسطيني, وبوادر الأزمة قادمة وبسرعة, وسوف ينفذ جمال مبارك هذا الشرط الأميركي وزيادة<br />ثالثاٌ: موقف مصر من إيران في حالة توجيه ضربة موجعة لها في أي وقت من الأوقات , فلابد أن يكون دور مصر مماثل للأدوار التي أدتها حينما وجهت أمريكا ضربات موجعة للعراق والتدخل في مفاوضات السودان ودارفور, لأن أميركا في حالة توجيه ضربة موجعة لإيران فلن تكون من دول الخليج الموالية لأميركا لحسابات تتقنها أميركا وتعلم أبعادها الإستراتيجةومن ثم كان وجوب الدور المصري المتوائم والمتحالف مع أميركا في ظل الأحداث الدولية والعالمية التي تمسك أميركا بإعتبارها قوة عظمي وحيدة في المنطقة والعالم , وأعتقد أن جمال مبارك أصبح الأن في أزمةخانقة فلا تعديل الدستور يقف بجانبه ولا الأوضاع الإجتماعية والإقتصادية تقف بجانبه ولازيارته لأمريكا أحدثت له إنفراجة في الأزمة ومن ثم كان الرهان خطير وإلا فملف حقوق الإنسان يمكن فتحه وملف إضهاد الأقليات الدينية فارض نفسه بقوه. فهل سيقبل مبارك الإبن هذه الشروط ؟الأيام هي التي تحمل الإجابة والمستقبل سيحددها!!!!!<br />محمود الزهيري"
