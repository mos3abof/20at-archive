author = "شريف وطنى"
posted = "2006-05-27"
text = "هنعتبر انك رجل علم كبير<br />لاكن لعلمك عيب عليك لما تكون مصرى وتعلق على<br />الموتمر الناجح عالميا كده وتعرف ايه انت عن حضور مين ومين ميحضرش كفايه عليك رايك الى خلا<br />تعليق يجى بلشكل العربى بتاع الانسه ساره<br />الى فكرتنى بحنان ترك فى مسلسل ساره<br />شباب كتير ممكن يقرائلك تعرف انت مين تقراءله"
