[[comments]]
order = 1
subject = "والله العظيم جميل ...وتستاهلي عليه الدعا.ربنا يخليكي يارب ويبارك فيكي"
author = "محمد السيد"
posted = "2006-05-03"
text = "إيه الجمال ده يا بنتي ....<br />والله بجد .... في الأول مجاش في بالي انك حتتكلمي كده ...<br />بقي لكم فترة بعيد عن الاتجاه ده ... لكن والله برافو عليكي ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124212/http://www.20at.com/article2.php?sid=763"

