subject = "يا خبر أسود"
author = "راميش شنكر"
posted = "2006-12-26"
text = "أنا مش زعلان من أي مسلم أو مسيحي بيكره الهندوس أو غيرهم بس يا ناس فعلا انا بتكلم بجد واذا في احد ممكن يدلني على نفس الطريقة الي اثبت فيها البهائية حقهم .<br />في هنود بهره موجودين في القاهره حاليا مصريين وليسواهنود ونحن من الذين اتينا معهم.<br />نحن في محافظة البحيرة و جدودونا هم من تسموهم ابوحصيرة واليهود خذوا منا قبر جد هندي لنا يعني نحن فعلا هندوس ومحتاجين لاحد يعترف فينا.وعندنا كل ما يثبت ذلك واذا ارد احد منكم التأكد فله ان يخبرني<br />جي رام جيكه باجوناوه<br />جودا دانكيشكو مصريابوكو"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

