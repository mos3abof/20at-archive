text = "ما حدث نكسه للدوله المدنيه و أنتصار جديد للأرهاب و التخلف يقول القرأن الكريم ( لقد كفر الذين قالو أن الله ثالث ثلاثة) فمتى ستصدر المحكمه المصريه حكما بألغاء الديانه المسيحية؟!!!<br />ليس من حق أى دين أن يحكم على دين أخر سواء كان بهائى أو هندوسى أو حتى من عبدة الشيطان !!<br />مصرى-عربى-مسلم-سنى"
