text = "اخوانى اتقوالله ان كانت البهائيه ديانه لابلغ عنها القران كما ابلغ عن المسحيه<br />واليهوديه الم يفكر احد من البهائين الثقفيين لماذا لم يبلغ عنها القران رغم<br />تبليغه بالدينات الاخرى والله لقد قرات فيها ولم اجد غير رجل ضال لعب به الشيطان<br />فاتقوا الله واعيدوا النظر والقراه جيدا وتوبوا الى الله"
