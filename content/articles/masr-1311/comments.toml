[[comments]]
order = 17
subject = "شعب عنصري يفتقد التسامح"
author = "د. أحمد عزب"
posted = "2006-12-25"
text = "للأسف التعليقات أعلاه تثبت كيف تم تخريب ثقافة المجموع لتنحدر الي هذا القدر من عدم التسامح مع حرية الأخر في الأعتقاد!! أنا شخصياً مسلم ولكني أؤمن بمصر خالية من اي نوع من انواع الأجبار على العقيدة او التضييق باي طريقة على من يتبع عقيدة تختلف عن عقيدة المجموع. الذين يؤيدون الحكم بناءاً على ان القران لايعترف بدين هؤلاء! طيب! نفترض ان هؤلاء لايعترفون بالقران مثل المسيحيين او اليهود مثلاً! وما علاقة اعتراف القران الذي نؤمن به نحن من حرية الأخرين في الأيمان بالعقيدة التي يريدون الأيمان بها؟ لماذا نتدخل في حرية الأخرين؟ بنفس المنطق، اليابان مثلا، وهي تعتنق ديناً غير معترف به منا، يمكن ان تمنع كتابة الديانة الأسلامية على البطاقة! اخ! نسيت! احنا البلد الوحيد في العالم اللي بيكتب دينه على البطاقة والباسبور!! ده حتى بعض السير الذاتية التي تصلني لتشغيلهم، تحتوي على دين المتقدم للوظيفة!!!! الناس هتموت وتفرق بين الناس حسب الدين! رغم اننا تربينا على ان الدين لله والوطن للجميع وهو شعار ثورة 1919 الخالد يوم كان هناك ناس يتفكرون في مصر. http://nahdetmasr.blogspot.com"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

