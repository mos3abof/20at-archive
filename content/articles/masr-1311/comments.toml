[[comments]]
order = 36
subject = "الجنه قطاع عام"
author = "و المواطن الصايع اللى بيشتم ده عامل حسابه يعنى و بيجهز نفسه انه هيورد على جنه ولا الجنه كمان بيدخلوها بالواسطه"
posted = "2007-01-02"
text = "الناس باخلاقهم ولا انتو بقيتوا يهود خلاص شايفين انكو شعب الله المختار مهما عملتم من معاصى ... كفى تدين مظهرى اضاع الكثير على هذه الامه<br />ولا انتو شايفين ان اى مسلم سنى مثلا تيدخل الجنه مهماعمل خلاص يا جدعان ياللا روحوا اسرقوا و اقتلوا و ازنوا.<br />رحمنا الله من الجهل."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

