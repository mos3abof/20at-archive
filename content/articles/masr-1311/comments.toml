[[comments]]
order = 9
subject = "الدين البهائي دين سماوي"
author = "هدي موسى"
posted = "2006-12-20"
text = "الدّين البهائيّ هو أحد الأديان السّماويّة، ويشترك معها أساسًا في الدّعوة إلى التّوحيد، وتعلن أنّ الدّين هو سبب انتظام العالم واستقرار المجتمع، وتأسيس الوحدة والسّلام بين الأمم.<br />ويعترف الدّين البهائيّ بأن الأديان السماويّة واحدة في أصلها، متّحدة في أهدافها، متكاملة في وظائفها، متّصلة في مقاصدها، جاءت جميعًا بالهدى لبني الإنسان. ولا يخالف الدّين البهائيّ في جوهره المبادئ الرّوحانيّة الخالدة الّتي أُنزلت على الأنبياء والرّسل السّابقين، وإنّما تباينت عنها قوانينه وأحكامه وفقًا لمقتضيات العصر ومتطلّبات الحضارة.<br />وأتت بما يدعم روح الحياة في هياكل الأديان، وهيّأت ما يزيل أسباب الخلاف والشّقاق، وأتت بما يقضي على بواعث الحروب، وأظهرت ما يوفّق بين العلم والدّين، وساوت حقوق الرّجال والنّساء توطيدًا لأركان المجتمع.<br />إنّ مبادئ وأحكام الدّين البهائيّ الّتي أعلن بهاء الله، أنّها السّبب الأعظم لنجاة البشر واتّحاد العالم، قد أثبتت قدرتها على تحقيق غاياتها في المجتمعات البهائية: فقد أدّت إلى تطوير أفكار النّاس، وتقويم سلوك الملايين من أتباعه وألّفت منهم، مع تباين أعراقهم، وثقافاتهم، وبيئاتهم، ومكاناتهم الاجتماعية، وثرواتهم، وسابق معتقداتهم، جامعة إنسانيّة لا شرقيّة ولا غربيّة متّحدة في مُثُلها ودوافعها وأهدافها، دائبة السّعي لرعاية مصالح الإنسانيّة جمعاء، بغض النّظر عن اختلاف الدّين والرّأي والتّفكير."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

[[comments]]
order = 10
subject = "الباب وبهاء الدين .. أين هم من ..."
author = "Qassami"
posted = "2006-12-20"
text = "بإختصار .. أسأل الأخت المشاركة .. الباب وبهاء الدين .. أين هم من التوحيد؟ وأقصد بالتوحيد الإيمان الجازم بالله عز وجل خلقنا لعبادته ونتفرد به معبودا وارسل الينا رسلا ختمهم بخير البشر والأنبياء والرسل .. محمد صلى الله عليه وسلم بلغه الرسالة بالوحي بالملاك الأمين جبريل .. فنؤمن به وبمن أعلمنا بهم من الملائكة .. بأن هناك يوم قيامة يحاسب فيه المرء على ما قدّم في حياته الدنيا .. فأماخلود في ناراً متقدة .. أو النعيم في جنة منعمة أبدا .. فما ردك .. ورد كل بهائي عن ذلك؟!"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

