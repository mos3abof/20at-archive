subject = "لا حول ولا قوه الا بالله"
author = "مواطن صايع"
posted = "2007-01-02"
text = "من غير قله ادب اهو<br />سوف تنقسمامتي الي بضع واربعون شعبه و ولن يدخل الجنه الا شعبه واحده<br />مش كلامي اهو<br />اذن انا بقوا سيب العبيط يعبط والاهبل يهبل<br />ونجمع كده في يوم الـــــفصــل نضحك سوي علي بهائي والجموسي والخرفاني و السهودي ... يعني صلو بينا عالنبي وخلينا في حسني الهوهو وجيمي الهشهش .... وعجبي عليكي يا مصر"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

