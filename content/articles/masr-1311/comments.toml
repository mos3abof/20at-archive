subject = "مصر مليانه.......ربنا يعينها"
author = "المظفر قطز"
posted = "2006-12-29"
text = "السلام عليكم<br />ابحثوا عن البهائيين والدروز و البهره الى اخره على النت حتقولو الله يكون في عوننا.و كله كوم والبهره كوم تاني.بيشتروا القاهره واحنا مش دريانين. روحوا شوفوا املاكهم بقت اد ايه في الحسين و خان الخليلي. فوقوا يا مسلمين.دول اول همهم هدم الاسلام.و الغا خانيه الي زعيمهم مدفون في اسوان ومعملوا مزار؟؟؟؟انا عايز اعرف حكمنا حيقبلوا ربنا ازاي يوم القيامه؟؟؟؟<br />السلام عليكم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

