text = "يا ناس يلي فوق ما تردوا على الي تحت<br />نحن طائفه هندوسية مصرية من جذور هندية من ايام الاحتلال جدودنا هنود استقروا في مصر ممكن احد يساعدني ويدلني على طريقة نثبت فيها اصلنا وحقوقنا مع اننا طلبنا من الحكومه الهنديه تساعدناوفعلا تم مساعدتناومنحنا تذاكر سفر لزيارة معبد نهر الجانج ومع هذا اريد حقي... عاوز حقي ياناس!!!!!!!!<br />مركز ابن خلدون نحن مسجلين فيه ممكن تتاكدوا بنفسكم<br />بجد هندوسي مصري وبعبد البقر وبحب مصر<br />www.hindu.com"
