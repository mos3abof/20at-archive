[[comments]]
order = 30
subject = "نعم للبهائية"
author = "ممدوح -نخلة"
posted = "2006-12-29"
text = "أصيب مركز الكلمة لحقوق الإنسان بخيبة أمل للحكم الصادر من المحكمة الإدارية العليا بإلغاء الحكم القاضي بأحقية البهائيين في إثبات كلمة ( بهائي ) في خانة الديانة للتعريف بهويتهم الدينية باعتباره حقا دستوريا نصت عليه المواثيق الدولية ومعاهدات حقوق الإنسان .<br />وإذ يؤكد المركز علي احترامه الشديد للقضاء المصري الشامخ وأحكامه النهائية فانه من ناحية أخري يناشد المشرع المصري بضرورة إصدار تعديل تشريعي ليسمح لإتباع العقيدة البهائية بإثباتها في البطاقة الشخصية للتعبير عن هويتهم الدينية والمذهبية إذ أن وضع تلك العقيدة في البطاقة الرقم القومي قد يزيل أي غموض يكتنف المتعاملين معهم في مسائل الزواج والميراث ومانحو ذلك جدير بالذكر أن محكمة القضاء الإداري قضت في ابريل الماضي بأحقية إتباع العقيدة البهائية في إثبات عقيدتهم ببطاقة الرقم القومي باعتباره حقا دستوريا وإنسانيا إلا أن الحكومة المصرية ممثلة في وزارة الداخلية قامت بالطعن علي هذا الحكم أمام المحكمة الإدارية العليا التي أصدرت حكمها المتقدم ."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

