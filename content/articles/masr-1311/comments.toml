[[comments]]
order = 12
subject = "لو كانوا يعلمون"
author = "مهدي السامري"
posted = "2006-12-25"
text = "الى كل بهائي وبالذات المصري لا تنسى أن منبع بهاء الله في قم الاسلامية (ايران)<br />تم اقفاله ورجع العديد من البهائيين الايرانيين الى السنه وكما قال الامام آية الله خامنئي البهائية بدأت كفرقة منحلة من الشيعه ولم تاتي كدين جديد وللاسف كان من اسسها من المذهب الشيعي الغرابي اي الاقرب الى اليهودي واذ دخل مصر بهاء الله مرورا لانه علم ان اهل مصر يجمعهم الطبل والمزمار .فلا يعتقد اي احد ان البهائيه الحالية هي ماكانت عليه وانما قد رئسها اليهود ولكم في ذلك انه يجب الحج الى قبر بهاء الله في اسرائيل .وعيد النيروز تستباح فيه الجنس الجماعي واختلاط الانساب ويجوز للبهائيه الزواج من اي جنس او دين<br />والبهائية تؤيد ان اليهود ابناء الله وكل من يدعي انه بهائي مصري فهو مخطأ لانه مثل من يحصل على الجنسية الامريكية او الكنديه سيظل طوال عمره يعامل كمصري وليس امريكي.<br />بهائي تاب الله وعرف أن الاسلام هو الحق"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

