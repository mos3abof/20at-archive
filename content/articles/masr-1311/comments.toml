[[comments]]
order = 41
subject = "أكفر الكافرين"
author = "مسلم"
posted = "2007-01-09"
text = "إن الدين عند الله الإسلام<br />اليهود كفار<br />النصارى كفار<br />قال رسول الله صلى الله عليه وسلم ( والذى نفسى بيده ما سمع بى يهوديا ولا نصرانيا ولم يؤمن بما أرسلت به ومات على ذلك فهو فى النار )<br />فإذا كان اليهودى كافر والنصرانى كافر فما بالك بالبهائى فهو أكفر الكافرين ولا عزاء للمنافقين"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

[[comments]]
order = 42
subject = "رفعت الاقلام و جفت الصحف"
author = "المظفر قطز"
posted = "2007-01-09"
text = "(ان الدين عند الله الاسلام وما اختلف الذين اوتوا الكتاب الا من بعد ما جاءهم العلم بغيا بينهم ومن يكفر بايات الله فان الله سريع الحساب) سورة ال عمران<br />(ومن يبتغ غير الاسلام دينا فلن يقبل منه وهو في الاخرة من الخاسرين) سورة ال عمران<br />رحمنا و رحمكم الله"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

[[comments]]
order = 43
subject = "لا حول ولا قوة الا بالله"
author = "اشهد ان لا اله الا الله وان محمد رسول الله"
posted = "2007-01-09"
text = "كفاكم فروع وانشقاق تركتم اصل الاسلام وانخرطتم فى فروع ابتدعتموها ما انزل الله بها من سلطان لايوجد فى الاسلام باب ولا شباك ولا بهاء ولا تامر انتم اتباع مسيلمة الكذاب وغيركم كثير ممن ضلوا وحسبوا انهم يحسنون صنعا<br />الله واحد لاشريك له ورسولنا محمد صلى الله عليه وسلم ولا طاعة لمخلوق فى معصية الخالق ولن يوجد مخلوق يوصلنا لطاعة الله ورضاه سوى سيدنا محمد ولا حول ولا قوة الا بالله العلى العظيم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

