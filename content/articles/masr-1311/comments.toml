[[comments]]
order = 20
subject = "السلام عليكم"
author = "محمد السافي"
posted = "2006-12-26"
text = "بسم الله الرحمن الرحيم وبه نستعين<br />أخوتي أخواتي انا اخوكم محمدمن ليبيا<br />رأيت هذا الخبر ولكم تمنيت أن أكون قد حضرت تلك الجلسة التي اذل فيها أعداء الله<br />هل تعلمون أننا في ليبيا عندنا قانون رسمي بمحاكم أي شخص (مسلم أو غير مسلم) اذا تطاول بالكلام فقط عن الله عز وجل أو نبيه الكريم<br />فمن أين جاء هؤلاء الكفرة الكاذبون ليقولو أن بهاء الدين نبي وكيف يحق لهم قول كهذا<br />أخوتي في الاسلام أخواني المسيحيين أيضاً ان من يدعي بأن هناك ديانة تدعى \"البهائية\" أوفهو مشرك بالله والعياذ بالله من الشرك<br />أما من قال انا مسلم بس عايز يكون في حرية اختيار العقيدة<br />فهذا كلام غير منطقي<br />لأنه لو سكت الناس والقضاء عن هذا الامر لتفاقمت الازمة ولكثر أنصار ومعتنقي هذه التفاهة ولا تنسى يا أخي المسلم أنه عليك أن تفكر في مستقبل ابنك الذي قد وصل أو سيصل الى مرحلة المراهقة فيجد في هذه التفاهات ملاذاً له من أحكام الاسلام التي يتضايق منها البعض سامحهم الله وهداهم<br />وفي النهاية لا يسعني الا أن أقول لكم دمتم أهل عزة وحق والله لا يضيع أجر المحسنين<br />أخوكم محمد من ليبيا"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

