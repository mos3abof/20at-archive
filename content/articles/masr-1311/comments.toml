posted = "2007-01-01"
text = "بيقولوا في شيء كده اسمه بهائي هي الحكاية نقصة اللي عاوز يكون غير مسلم يغور في دهية بره البلد ديه ناقص بعد كده نلاقي مجوس وهندوس والبوذيين ونلاقي اللي بيطالب بحقوقو الشواذ وحرية الزنا واللواط متى اتفق الطرفان لالالالالالالالا<br />لن يحدث ابدا في هذه البلدمن يبتغي غير الاسلام دينا فليذهب الى الجحيم هو واتباعه وقبلهم ديانتهم لعنهم الله"
