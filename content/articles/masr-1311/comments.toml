[[comments]]
order = 25
subject = "لا اله إلا الله محمد رسول الله"
author = "حفيد الصحابة و زين العابدين بن على"
posted = "2006-12-29"
text = "لا حول و لا قوة إلا بالله العلى العظيم .<br />البهائيين دول لهم حلين يا يخرجوا من مصر .<br />يا يموتوا لأنهم مرتدين .<br />أما الأخ المصرى الهندى ،، أخى الهندوسية ليست ديانة سماوية و غير معترف بها ،<br />و غذا أردت الإعتراف بها إذهب إلى الهند .<br />و لعنة الله على الشيعة الرافضة و البهائييييييييييييييين ."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

