[[comments]]
order = 14
subject = "خيبه بالويبه..بس كلمه حق"
author = "نيفين نيفى نوفا"
posted = "2006-12-25"
text = "يادى المصيبه<br />ادى اللى كان ناقص<br />البهائين كمان<br />و الله العظيم البلد دى رايحه ف داهيه<br />ف القاهره اليوماستضاف عمرو دكتوره فاضله و دكتور فاضل بهائيين<br />اللى غاظنى انهم واثقين من نفسهم جدا و رافضين اقتراح عمرو و الناس بالخروج بره البلد<br />و لاول مره الواحد يتفق معمرتضى منصور اللى اتصل و شتمهم ع الهوا ووصفهم بالكفره<br />بس عجبنى راى عضو مجلس الشعب مصطفى حشيش اللى قال لكم ينكم و لى دين<br />هما اختارو الكفر دين ليهم<br />اوكى<br />اثبتوه ليهم ف البطاقه علشان لو جه لبنتى واحد يتقدم لها و اسمه جورج او محمد و طلب بنتى زينب او جورجيت و لقيت ف بطاقته انه بهائى اطرده<br />هو دا الكلام بدون تعصب<br />اديهم العار اللى عايزين يثبتوه ف بطايقهم و خلصونا من قرفهم<br />اصل هى البلد ناقصاهم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102952/http://masr.20at.com:80/article.php?sid=1311"

