subject = "التوجه كليا نحو اوربا"
author = "نبيل بكاني"
posted = "2006-05-21"
text = "لم افهم حتى الان لمادا يصر المغرب على التوجه كليا نحو اوربا على جميع المستويات متناسيا الجدور العربية ومتناسيا اننا عرب وشرق واصلنا من المشرق . فانت تجد المصطلات المستخدمة في كل ماهو اداري او اقتصادي او سياسي كلها مستوردة من اوربا قبل ان تترجم الى العربية والامر يتعلق حتى بالاعلام فجميع قنواتنا موضوعة بالهوت بورد .فهل الامر يتعلق بعقدة الاجنبي\"النصراني\" كما هو معروف عند المغاربة.......فهل سياتي يوم يطلب فيه ان نتوجه نحو اوربا عند الصلاة او بالتحديد نحو قبلة الفاتكان<br />مجرد سؤال<br />http://rawafed.ektob.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123633/http://www.20at.com/article2.php?sid=685"

[[comments]]
