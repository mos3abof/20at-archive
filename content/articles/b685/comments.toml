text = "السلام عليكم احيي كل الاخوة على كلمة الحق لم تسلم مساجدنا من اسرقة الاحدية والزرابي فهل تسلم من....<br />في الحقيقة تنقسنا العقول التي تعرف التدبير او بالاحرى نحن مقموعين<br />ول حول ولا قوة الا بالله<br />وفي الختام نحن غير راضين رغم السكوت الدي هو تحت القهر"
