[[comments]]
order = 14
subject = "قبل ماتشوف اخطتء الناس البعبدن عنك صلح اخطاءك و اخطاء اللي حواليك"
author = "اللي مايوصل للعنب حامض عليه يقول"
posted = "2006-06-12"
text = "المغرب شيق و جميل جدا و اهله اهل الضيافة الكرم و الحضارة و الثقافة و غير هههه ,,,, لا تضحك هده الحقيقة غصبا عنك ولو كرهت فيه تالف بينا تاخي في وقت الشدة نجد بعضنا البعض مو زي بعض الناس لا يعرفون حتى من يسكن جوارهم على اليمين التالف و الرحمة و المودة لازم تكون بيننا مو لازم نلقي اللوم على من يبنون المساجد و على غير لا نطلب المستحيل صحيح اننا نمر بازمة البطالة و ترى بعض الشباب المنهمشين يسمعون من افواه غيرهم ان في وراء البحر حياة جميلة و مال لو كانو يعلمون ماينتظرهم هناك او حتى في البحر ماكانو يتركون قطران بلادهم ولو ما خلو او تركو بعض الاوباش يظربون بهم المثل صحيح عندنا ظروف بس عادي زي اي بلد و اتحدى من يقول العكس لاالحمد الله مش زي بعض الدين بلدهم كله مشاكل ازمة سكن ازمة تخلف عقلي مخدرات فساد من كل النواحي هشك بشك و رقص اكثر دعارة و اسفل من كدا يعني و اكل العيش بطرق مو حلال يعني مش نلقي اللوم على الغير و ننظر الى اخطاء من هم احسن منا على الاقل و ببلدبعيد علينامسافات و نننسى من هم نحن و ما يدور بجوارنا و حارتنا فلتصلح ادن نفسك و احرص بيتك و اهلك و جيرانك و قلل من اخطائك تم اتلهى بمشاكل الغير صحيح عندنا ظروف بس بنتغلب عليها و لا نننتظر اللي فوق يساعدونا احنا بنساعد بعضنا ماافش احلى من هدا التضامن هاي هدا هو المغربي و المغربية الاصيلةرغم عن كيد الغيورين فليصلح الله شبابنا و بناتنا و يهدينا جميعا للطريق المستقيم و ينجنا من اعين الحاسدين و الباغين انك سميع مجيب و يهدي الجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123633/http://www.20at.com/article2.php?sid=685"

