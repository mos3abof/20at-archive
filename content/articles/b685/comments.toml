author = "هشام"
posted = "2006-04-13"
text = "لسلام عليكم ورحمة الله وبركاته<br />هذه المبادرة مأجورة عند الله بإخلاص النية له وحده، فمن اجتهد فأصاب فله أجران ومن اجتهد فأخطأ فله أجر واحد.<br />إلا أنني أرى والله أعلم أننا إذا شغلنا عقولنا قليلا سيتبين أن الأمر سيكون دون جدوى، أولا لأن كل بيوت المغاربة الآن تحتوي على جهاز تلفاز وجهاز البارابول أي بإمكانهم مشاهدة كبار علماء الأمة على القنوات الفضائيةالهادفة، فالأولى أن تصرف هذه الميزانية في أمور أخرى أكثر نفعا، والله من وراء القصد وهو يهدي السبيل"
