[[comments]]
order = 1
subject = "بجد هو ده الكلام"
author = "محمد بدر"
posted = "2006-06-26"
text = "هو ده الكلام والله الموفق و<br />ياريت اللي جعانين (سلطة) و خرجوا من الانتخابات بسبب الفساد يريحوا شوية وحماس بتدخل فلوس عشان تقاوم حصار<br />ومحمود عباس نازل بوس في أولمرت(ده مباسش هنية كده)ولا حول ولا قوة الا بالله<br />و يا ريت يبقى في حملة دعا لاخوانا في غزة وده أقل واجب<br />يارب افضحهم في غزة هم واللي بيبوسوا فيهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130505/http://www.20at.com/article2.php?sid=997"

[[comments]]
order = 2
subject = "رد على فساد السلطة لمحمد بدر"
author = "محمد هلال"
posted = "2006-06-27"
text = "بلا حماس بلا هم<br />انتوو بتجكو هيك لأنكوو مش عايشين بالبلد<br />ليه ما تنتفض يابو لسان اللي بتحكي عن جيعانين السلطة<br />ولا القدس فلسطينية بس<br />بتعرفووو شغلة<br />والله لو بس احكم يوم<br />ونحرر القدس اقسم بالله ما اخلي عربي يزورها<br />لأنهم اوسخ خلق الله<br />كمان شغلة<br />اللي بيحكي عن الفساد بالسلطة<br />وهلأ في فساد يابو لسان واكتر من الاول<br />واقل ما فيها كان فيه فساد زي ما بتحكي بس الناس شبعانة ومبسوطة<br />هلأ الناس ما كلة هووو فش رواتب عشان الاصلاح والشرفى اللي بتحكي عنهم<br />يا ريت الناس اللي خارج فلسطين ما تجيب سيرة فلسطين على لسانهم وهييي بتسلم<br />كمان شي احترم رئيسنا احسن ما نفتح ملفات رؤساء العرب<br />وانت بتعرف مين بدأ الخيانة من الرؤساء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130505/http://www.20at.com/article2.php?sid=997"

[[comments]]
order = 3
subject = "الوحدة الوطنية"
author = "أبن كتائب شهداء الاقصي"
posted = "2006-06-27"
text = "شكرا يا كتائب القسام ويا لجان المقاومة وجيش الاسلام أنتم أبطال الامة العربية تم بحمدالله هذا العملية الفدائي في قلب الاحتلال الاسرائلي في موقع عسكري أنا أبن كتائب الاقصي لكن معك يا كتائب القسام نحن في مجموعات الشهيد:محمد صيام مستعدين الاجتياح الاسرائلي ع القطاع والله سوف يعلم جيش الاسرائلي من هي غزة هذا الجندي لن يعود الي اسرائلي باذن الله حتي تحرير الاسيرت والاسيرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130505/http://www.20at.com/article2.php?sid=997"

[[comments]]
order = 4
subject = "غريبه جدا"
author = "ابو العبد"
posted = "2006-06-27"
text = "الغريب في الموضوع ان جميع الدول العربية والدول الاوروبية وشخصيات كبيرة وكهان ورجال دين مسيحيين يتصلون بالسيد اسماعيل هنية رئيس الوزراء لتوسط واطلاق سراح الجندي الحقير الذي لا يساوى شعره من شعر اسير فلسطيني مجاهد, لكن وللاسف والغريب ان الكيان الصهيوني يعتقل اكثر من 9000 معتقل بينهم نساء واطفال وشيوخ على مدار 30 عام ولكن لا احد من هؤلاء الرؤوساء والخائنين يحرك ساكنا ولا يكلف نفسه بالاتصال بالارهابي اولمرت وشارون بان يخففوا معاناة الاسرى وليس اطلاق سراحهم..اطالب كتائب القسام بعدم اطلاق سراح هذا الارهابي الحقير.<br />هذه هي الخيانة بعينها<br />وحسبنا الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130505/http://www.20at.com/article2.php?sid=997"

[[comments]]
order = 5
subject = "الجندي المعجزة"
author = "همام"
posted = "2006-06-27"
text = "غريبة فعلا الاهتمام الزائد بالعيل الجندي ده مصر،امريكا، بريطانيا، سفراء الغرب في فلسطين، قياديين من فتح و خماس للأفراج عن الطفل المعجزة دون اي مقابل<br />طبعا انا اول الرافضين اكده لازم يكون في مقابل و مقابل كبير كمان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130505/http://www.20at.com/article2.php?sid=997"

[[comments]]
order = 6
subject = "رد على محمد ذلال(هلال)"
author = "ابن المخيم"
posted = "2006-06-27"
text = "اكيد انت بتدافع عن الخونة المفسدين لانك ابن واحد منهم او على الاقل فسود صغير اولا لما بدكش حدا من خارج الوطن الفلسطيني يتكلم اتكلم باللهجة الفلسطينيةثانيا: اللي احسن الك وامثالك يروحو يعيثو في تونس او اريكيا لانو ما بقي لهم بينا مكان وعلى راسهم محمد فلتان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130505/http://www.20at.com/article2.php?sid=997"

[[comments]]
order = 7
subject = "روقو شوي"
author = "فلسطينية"
posted = "2006-06-27"
text = "العملية كانت منيحة والحمد لله انا ولا مع حماس ولا مع فتح انا محايدة انا مع الحق<br />اكيد لازم نقاوم ونموت يهود وهيك شي بس لازم نفكر بالناس كمان<br />يعني هلا عملية غزة اللي بيتوعدونا فيها رح تموت ناس كتير<br />وهلا اللي الو ما شاف اهلو 20 سنة وعم بيستنا على المعبر شو بدو يعمل هادا التاني<br />كيف المرضى اللي قاعدين هونيك كمان<br />واللي ناوي يسافر يتعالج شو بدو يعمل هيدا التاني<br />احنا صحيح بنعمل عمليات بس ما بدنا كلو يطلع على راسنا بألأخير<br />الله يوفق الجميع وهدو وتناقشو بصوت واطي وبلاش الجيران تسمع<br />الموضوع حلو كتير<br />يسلمووووووووو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130505/http://www.20at.com/article2.php?sid=997"

[[comments]]
order = 8
subject = "الهم امحي الصهاينة من الوجود"
author = "شمس الدين من تونس"
posted = "2006-07-21"
text = "شكرا لك يا سيدي حسن نصر الله و شكرا لكل المجاهدين الذين معك لإرجاعك للمسلمين و العرب أنفتهم و عزتهم و أدعو الله أن ينصركم علي الصهاينة الظالمين. قولوا آمين يا أحباء رب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130505/http://www.20at.com/article2.php?sid=997"
