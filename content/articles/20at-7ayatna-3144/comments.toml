author = "مروه"
posted = "2007-01-30"
text = "كلامكم زي الذهب<br />انا بنسبي الي ما بلبس غير تركي لانو ارتب شي واحشم شي واثقل شي<br />بارك الله فيكم على الموضوع الرائع"
archived = "2009-05-03"
capture_url = "https://web.archive.org/web/20090503094326/http://www.20at.com:80/7ayatna/3144.html"

[[comments]]
order = 1
