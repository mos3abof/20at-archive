author = "منى"
posted = "2007-01-30"
text = "الله اللباس ده حلو اوي وفي كمان حشمة، ياريت يجيبوه عندنا بمصر"
archived = "2009-05-03"
capture_url = "https://web.archive.org/web/20090503094326/http://www.20at.com:80/7ayatna/3144.html"

[[comments]]
order = 2
subject = ""
author = "نوال"
posted = "2007-01-31"
text = "انا ادعو كل فتاة للبس الزي الشرعي التركي، لانه جيل وبنفس القوت جذاب ، وبالتالي يحافظ على اناقة الفتاة وجوهرها، حلو يا تركي…"
archived = "2009-05-03"
capture_url = "https://web.archive.org/web/20090503094326/http://www.20at.com:80/7ayatna/3144.html"

[[comments]]
order = 3
subject = ""
author = "الاء"
posted = "2007-10-25"
text = "موضوع رائع وجميل وفعلا هذا الحجاب بفلسطين<br />لسة ابل شهر اشتريت جلباب تركي لانو فعلا بيناسب الصفات الشرعية للحجاب<br />وهاد اللبس الشرعي بفلسطين وبنفس الوقت مرتب وحلو لحتى يعطي صورة منيحة عن المحجبة<br />والحمد لله رب العالمين<br />واسال الله ان يهدي بنات الاسلام الى الحجاب الصحيح في كل مكان"
archived = "2009-05-03"
capture_url = "https://web.archive.org/web/20090503094326/http://www.20at.com:80/7ayatna/3144.html"

[[comments]]
order = 4
subject = ""
author = "ريمان العراقيه"
posted = "2007-10-29"
text = "السلام عليكم<br />شكرا على هذا الموضوع الحلو وترا مو بس الفلسطينيات ايحبون الزي التركي الشرعي احنا بالعراق نلبسا دائما وهو حلو وشيك ومحتشم ويظهر المراه بمظهر مرتب وملتزم ومحبب للنفس واني عايشه بديالى احدى المحافظات العراقيه واشوف اللبس التركي مرغوب عدنا بالاظافه الى الابس الامراتي والخليجي والله الموفق لان هذا الشي جيد للمسلمات شكرا مره ثانيه"
archived = "2009-05-03"
capture_url = "https://web.archive.org/web/20090503094326/http://www.20at.com:80/7ayatna/3144.html"

[[comments]]
order = 5
subject = ""
author = "مروه"
posted = "2007-12-02"
text = "السلام عليكم<br />انا كمان من فلسطين وباكد هذا الكلام انو كل اخت محقه بالي بتقولوا عن الجلباب التركي<br />وعن نفسي ما بلبس غير تركي او با[ *** ]تاني وما عندي غرهن بلخزانه<br />الجلباب التركي بناسب كل المناسبات وكل الاوقات وهو انيق وعملي بنفس الوقت"
archived = "2009-05-03"
capture_url = "https://web.archive.org/web/20090503094326/http://www.20at.com:80/7ayatna/3144.html"

[[comments]]
order = 6
subject = ""
author = "رحيق"
posted = "2007-12-12"
text = "الجلباب التركي جميل جدا وانا عن نفسي لا ارتدي سوى الجلباب التركي لانه الستر والاناقة والرقي ولكن بعض تجارنا يستغلون اقبال الفتيات الفلسطينيات فيقابلون ذلك بزيادة في الاسعار رغم ان اسعارها في الاساس معقولة وليست غالية"
archived = "2009-05-03"
capture_url = "https://web.archive.org/web/20090503094326/http://www.20at.com:80/7ayatna/3144.html"

