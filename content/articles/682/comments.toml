[[comments]]
order = 9
subject = "للي بدي يعرف شو أنا كنت عم أعمل"
author = "BASHAR"
posted = "2006-07-08"
text = "انا بشار من فلسطين يمكن انا شفت كل مواضيع عشرينات و كنت من اوائل المتتبعين للموقع ، بس إذا فصل الموقع لمدة 24 ساعة ، و حابين تعرفوا أنا شو كنت أعمل ،،<br />أنا كنت أدور على بيت أنام فيه ، لإنو انا ساكن بشمال غزة و محاذر و مش قادر أدخل على بيتي هادا إلي كان شاغل عقلي بصراحة .<br />مش هان المشكلة برضو ، المشكلة وين العرب ، و ين عشرينات ، يا عشرينات إنتو متضامنين مع الشعب بمقالات الأخ عاطف ، بس من الضوروري يصير تحرك الشعب العربي كلو نايم و هادي الشغلة إتأكدت منها لما سمعت إنو في محلل سياسي يهودي بقول إنو إسرائيل من الضروري إنها تشن هجمات قوية على الفلسطيني أول ما يبدا المنديال و الكل شاف إنو في أول يوم تم قتل عائلة الطفلة غالية ، و هادا كلو ليش ، لإنو الشعب العربي بتابع المنديال .........<br />و لما دخلت موقع العربية أشوف شو كاتبين أخبار عنا ، لقيت كمل الشباب العربي ب\\عتبرنا إرهابين صرت اشد بشعري ، يا عالم ضحايا قدام عيني ، 4 فوق بعض مش ميتين ، مقطعين ،،،<br />أتمنى من الأخوة من عشرينات مع إحترامي الشديد للموقع و مع إحترامي الشديد للأخ عاطف ، الموقع بعيد كتير عن القضية الفلسطينية أنا ما بقول هيك علشان يصير الموقع فلسطيني أو خاص بضحايا الفلسطيني<br />الموقع ضوروري يضلو شبابي ، و بما إنو الموقع بضم فئة كبيرة منالشباب العربي لازم نستغله تنديهم المعلومة الصح بديلة عن المعلومات المغلوطة و المشهوة إلي بتعمل من الشب المقاوم للإرهاب الصهيوني و العداء المطول بأسلحة خيالية ،،<br />بطلب من إدارة عشرينات الوقوف مع الشعب الفلسطيني حتى لو ببنر ، ما بدي تعملوا قسم ، بنر زي بنر كأس العالم حيخلي كل فلسطيني يحب موقع عشرينات و بالتالي بتحقق هدفنا من التجمع العربي تيعرف شو هيافلسطين ، المدينة المحتلة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114024/http://www.20at.com/article2.php?sid=1040"

