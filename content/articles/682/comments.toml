text = "انا بصراحه حاسس ان فى حاجه من يومين<br />كان فى مقال لمنى سليم بعنوان لا تصافح وعلقت عليه وبعدين ملقتش المقال وفى نفس الوقت لقيت مدونه مصعب تقيله جدا ومش عايزه تفتح<br />قلت فى عقل بالى شكل السيرفر عمالها معاكم ولما ملقتش فايده دخلت نمت لانى كنت تعبان جدا حدا جدا جدا جدا بس بصراحه انا متخيل ان موقع ذى ده ( عشرينيات ) ممكن يتحجب فى اى لحظه ممكن ينقبض على من فيه بتهمه معارضه الحكومه المباركه<br />كله جايز من حكومه العجايب بس حمد الله على السلامه<br />وسالمه يا سلامه عشرينيات جه بالسلامه<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
