subject = ""
author = "حوار"
posted = "2009-10-24"
text = "أقترح على عشرينات عمل حوار مع السفير البريطاني وكيف يرى الأوضاع الراهنه في مصر. وأن يكون كلامه موجه للشباب المصري. ياريت كمان يعمل مقارنات تاريخية كالتي عرضها في مدونة النقاب عن جون الثالث والعشرين.<br />في انتظار ذلك."
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

[[comments]]
