text = "السفير لم يخطئ وربما هذه هى المشكلة؟ مشكلتنا انه بيتعامل باحترام مع موضوع اسلامي. تحياتي للجميع"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

[[comments]]
order = 7
subject = ""
author = "المندوب السامى"
posted = "2009-10-24"
text = "المندوب السامى البريطانى رجع يمارس دورة تانى من قصر الدوبارة وبيقول لنا الصح اية والغلط اية<br />اللة يرحمك يا شيخ عبد الحليم محمود واللة يرحمك يا شيخ محمد ابو زهرة واللة يرحمك يا شيخ محمد يا غزالى<br />هنقول اية ما احنا نسيبنا الحكومة البريطانية والسفير بقى خالنا"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

[[comments]]
order = 8
subject = ""
author = "هو احنا كاثوليك"
posted = "2009-10-24"
text = "ه8و احنا كاثوليك والا بروتستانت علشان السفير يتدخل<br />يا جماعة دى حرية شخصية وكل واحد يلبس اللى هو عايزة واللى عايزة تمشى فى الشارع بمايوة بكينى اهلا وسهلا واللى عايزة تتنقب برضة اهلا وسهلا<br />دى حرية شخصية<br />وبعدين المنقبات دول هم اخواتنا وبناتنا وامهاتنا وهم شافوا كدة صح يبقى خلاص هم احرار<br />وبعدين هنسيب القدس والمسجد الاقصى وندور على حتة نقاب<br />فية اهم<br />فية المسجد الاقصى بينهار واليهود بيفحتوا تحتة<br />انتم هتشغلونا بامور فرعية لية"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

[[comments]]
order = 9
subject = ""
author = "ايهاب المصري"
posted = "2009-10-24"
text = "هو السفير شايف شيخ الأزهر بطل إصلاحي زى جون الثالث والعشرين ولا ايه؟ الشيخ حسب الله طنطاوى الأول ملوش تاني ومش هييجي زيه . وده شيخ السلطه ولو قال للناس الجنه من هنا محدش هيصدقه."
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

