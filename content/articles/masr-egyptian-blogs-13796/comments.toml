archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

[[comments]]
order = 11
subject = ""
author = "جيمـي"
posted = "2009-10-24"
text = "النقاش بجميع أشكاله مفيد … بس الزاوية الى بيتناولها الأعلام و شيخ الأزهر هى الى غير مقبولة .. وهى سياسة الرفض .<br />سيادة السفير البريطانى أتكلم كلام محترم .. حتى لو فيه نقد بس باحترام ومش بصفة الوصي ومش بصفة الأمر .أو الرفض فهو مقتنع تماماً - بحسب التدوينة - بأنها حرية شخصية . وانهم فى بلاده يبحثون عن حل للمشكلة ولا يكتفون بمناقشتها .<br />ولكننا عمالين نتكلم نتكلم ولسة ماحدش حل اى حاجة لأننا ماعندناش ثقافة الحل أحنا بنعقدها بس .<br />المصريين مش محتاجين غير حد يحترم آدميتهم وحرياتهم … بس"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

[[comments]]
order = 12
subject = ""
author = "هاني"
posted = "2009-10-24"
text = "دى فضيحه والله العظيم. سفير بريطانيا بيكتب عن النقاب باحترام وشيخ الأزهر بيقل أدبه على بنت صغيره. أنا بقول ان السفير يقتنع بأن مفيش فايده ويحتلونا تاني ويرحنا من شيخ الأزهر ويحمي البنت دي هههههه تدوينه حلوه بجد وعميقه شكرا عشرينات"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

[[comments]]
order = 13
subject = ""
author = "موضة الشوال"
posted = "2009-10-24"
text = "خلاص كل مشاكلنا مع البطالة والفقر والعنوسة والامراض واكوام الزبالة والوضع الاقتصادى المتردى انتهت وتفرغنا لموضوع النقاب ولبس الحريم<br />زمان كان فية نقاب ترتدية السيدات فى مصر ايام ثورة سعد زغلول وكانت تلبس الملاية اللف والا نسينا<br />وكانت السيدات الاتراك من الطبقة الراقية فى مصر يلبسونة اى النقاب التركى حتى وقت قريب جدا قبل الثورة<br />ثم جاءت موضة المينى جيب والميكروجيب والشوال ايام عبد الناصر وهاجم المشايخ وعلى راسهم الشيخ محمد الغزالى رحمة اللة العرى وطالب بتحجب المراة المصرية وكان الحجاب فى وجهة نظرة فى الستينات ايامها هو لبس الفلاحة المصرية اى جلابية واسعة طويلة ومنديل يربط على الراس وطرحة فوق راسها مع مراعاة الموضة الحديثة والتجميل<br />اما الان فان موضوع النقاب هو رفض للمجتمع من البنات والسيدات وتمرد من الاوضاع الاقتصادية المزرية التى جعلت 12 مليون فتاة فى سن الزواج عوانس<br />12 مليون فتاة عانس حسب مركز التعبئة والاحصاء ويعلن انسحابهم من الحياة والمجتمع بالنقاب ويدفنون انفسهم احياء<br />وفى انتظار السادة المثتثمرون الذين لن ياتوا ابدا<br />النقاب هو رفض واحتجاج لاوضاع البنات العوانس"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

