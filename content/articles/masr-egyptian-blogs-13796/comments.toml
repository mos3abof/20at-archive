subject = ""
author = "عادل عمر"
posted = "2009-10-23"
text = "المقارنه بين ماحدث في الكنيسة منذ 50 عاما وما فعله شيخ الأزهر بخصوص النقاب. أعتقد أن شيخ الأزهر يختلف عن جون الثالث والعشرين . فينما استخدم شيخ الأزهر العنف اللفظي ضد بنت صغيره، أزال جون الثالث عشر الحدود بين المتديين العاديين والكنيسة.<br />شيخ الأزهر والمؤسسة الدينية المصرية انعزلت عن الشارع ولم يعد يصدقها إلا قلة وليس لكلام المؤسسات الرسمية الدينية تأثير كبير."
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

[[comments]]
order = 1
subject = ""
author = "جيمـي"
posted = "2009-10-23"
text = "انا شخصياً كمسلم أرحب بالنقاش , ولكن حول ماذا ؟؟؟<br />يا سعادة السفير إن كان النقاش حول النقاب فيفترض أن يكون السؤال المطروح هو … كيف يمكننا ان نجعل النقاب زياً غير خطراً ولا يمكن ان يكون عباءءة يستتر رائها رجل<br />بينما لا يجب ان يكون الخطاب الموجهة للشعب با نرفض ذلك الزي ونقوم بتجريم ارتدائه مناسين الحريات الشخصبة التى من ضمنها المظهر و الزي بشكل عام<br />يعنى ممكن نجيب فى اى حتة واخجة ست تكشف على هوية الست الى زيها وتوتة توتة … خلصت الحدونة . مش مهولين الدنيا وشيخ الأزهر الى كل ما ييجى يبرر يروح هادم لاكتر"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

[[comments]]
order = 2
subject = ""
author = "الى رانيا"
posted = "2009-10-24"
text = "لا يا رانيا<br />مفيش عواطف في الدين<br />الدين زي القانون تماما<br />ادين زي ما قال الشيخ الشعراوي افعل ولا تفعل<br />قانون يا ماما<br />مفيش فيه عواطف<br />وقبل النقاب فيه حاجه اسمها وقرن في بيوتكن<br />افضل من النقاب مليون مرة<br />النقاب الناس مختلفين عليه<br />لكن وقرن في بيوتكن امر رباني ليس عليه خلاف<br />المرأة تجلس في البيت وخلصت المسألة"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

[[comments]]
order = 3
subject = ""
author = "رانيا"
posted = "2009-10-24"
text = "\"إن للعاطفة دور هام في الدين\" حطيت ايدك على الجرح. عندنا شيوخ عواطفهم ماشيه مع السلطة واللي بيحبه النظام وفيه شيوخ عواطفهم مع التقاليد والعادات . لازم تكون عواطف الشيوخ مع مواكبة الدين لتحديات العصر"
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

[[comments]]
