posted = "2009-10-24"
text = "تسلم ايدك سعادة السفير. انا بجد استمتعت بقراءة المدونة ، سؤال: هل ينشر السفير مقالات في أماكن أخرى وكيف يمكن اتاحتها لنا باللغة العربية.<br />Thank you very much and I really enjoyed your wonderful text."
archived = "2009-10-27"
capture_url = "https://web.archive.org/web/20091027104230/http://www.worldcup2006.20at.com:80/masr/blog/13796-2009-10-23-23-13-19.html"

