text = "اقتباس هو احنا كاثوليك:<br />ه8و احنا كاثوليك والا بروتستانت علشان السفير يتدخل<br />يا جماعة دى حرية شخصية وكل واحد يلبس اللى هو عايزة واللى عايزة تمشى فى الشار<br />ع بمايوة بكينى اهلا وسهلا واللى عايزة تتنقب برضة اهلا وسهلا<br />دى حرية شخصية<br />وبعدين المنقبات دول هم اخواتنا وبناتنا وامهاتنا وهم شافوا كدة صح يبقى خلاص هم احرار<br />وبعدين هنسيب القدس والمسجد الاقصى وندور على حتة نقاب<br />فية اهم<br />فية المسجد الاقصى بينهار واليهود بيفحتوا تحتة<br />انتم هتشغلونا بامور فرعية لية<br />أنا أكرة\"النقاب\"؟<br />و أحب \"البكينى\"!!!<br />و لا للحجاب و النقاب و الارهاب و التخلف و الحقد و الكلام الفارغ؟"
