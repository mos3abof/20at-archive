order = 0
subject = "تم حذف جميع التعليقات"
author = "موقع عشرينات"
posted = "2006-09-19"
text = "نظراً لعدم تحلي معظم المعلقين بآداب الحوار والإستماع للرأي الآخر.. ونظراً لتراشقهم بالألفاظ النابية والشتائم الخارجة، وإثارة الفتنة والتفريق بين أبناء الوطن العربي الواحد.<br />فقد قمنا بحذف جميع التعليقات...<br />كما نود أن ننوه أن الموقع ليس على اتصال بالأمير الوليد بن طلال عن طريق مباشر أو غير مباشر وأن رسائل المساعدة لن تصله بهذه الطريقة.<br />وشكراً"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153820/http://www.20at.com/article2.php?sid=30"

[[comments]]
order = 1
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-19"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153820/http://www.20at.com/article2.php?sid=30"

