[[comments]]
order = 2
subject = "سنة جديدة .. مع سفاح جديد"
author = "Blue Sea"
posted = "2006-01-05"
text = "السلام عليكم<br />ممكن أكون سعيد .. بس مش متفائل<br />شارون ما هو إلا رمز لنظام<br />تشاء الأقدار ان تأتي السنة الجديدة بسفاح جديد<br />يعني موتة او حياتة مش حتأثر كتير<br />شارون بيتبع سياسة صهيونية زي كتير قبلة<br />وحيروح ويجي واحد تاني بنفس السياسة<br />يعني تحرير القدس ... مش بموت شارون أو غيرة<br />زي واحد حرامي سرق فلوسي<br />فضلت ادعي علية لحد ما مات<br />استفدت انا اية ؟؟ هل فلوسي رجعت لي ..<br />بدل فوسي مرجعتش .. يبقي مينفعش افرح لموتة<br />وعيدكم مبارك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151406/http://www.20at.com/article2.php?sid=207"

