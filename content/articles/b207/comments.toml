text = "ربنا يهد الظالم وياخده القادر الكريم بس يا جماعة ماتنسوش ان شارون ده دماغه عالية وذكي جدا وياريت بس ربنا يبعت لنا رئيس بيحب بلده زي شارون ما بيحب اسرائيل"
archived = "2006-11-02"
