[[comments]]
order = 2
subject = "في فكرة عن شباب من أجل التغيير"
text = "شتيمة ولا لأ ؟؟؟؟<br />إنتو شايفين إيه بعد كل اللي جري ؟؟؟<br />في فكرة عن شباب من أجل التغيير ... وصلني إيميل من مجموعة شباب من كام يوم فاتوا ... إيه رأيكم لو نسجل اسمنا معاهم ..... مش حنخسر حاجة .... و بعد كده حتي نقعد في بيتنا مش مهم لكن نكون سجلنا اسمنا و تكون بداية لعشريناااااتية من أجل التغيير.<br />يا رب محدش يخاف بس و منطلعش يتوع كلام وساعة الجد كله يهرب .<br />كل المطلوب تبعث إيميل ليهم بس لا أكتر ولا أقل<br />diaaelsawy@hotmail.com<br />shabab_kefaya@yahoogroups.com<br />0106832876<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2005-07-14"
capture_url = "https://web.archive.org/web/20050714085200/http://www.20at.com:80/article.php?sid=1272"

[[comments]]
