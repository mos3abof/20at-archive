subject = "أرفض"
text = "الموضع هايل<br />وأنا أرفض مبارك ، وأرفض نوال السعداوي أكتر من مبارك ، وأرفض كل اللي مرشحين نفسهم ...<br />ولي سؤال هو ما فيش حد عليه القيمة في مصر يرشح نفسه للانتخابات ..<br />كل دول عملاء ... عملاء<br />يا70 مليون مافيش واحد فيكم عدل ..."
