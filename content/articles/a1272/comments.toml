subject = "زميلة صوت الجامعة"
text = "التحقيق هايل جدا، وأنا فرحانة بيكى أوى يا داليا يا رفيقة قسم الصحافة وصوت الجامعة ربنا يوفقك دايماً<br />أميرة"
archived = "2005-07-14"
capture_url = "https://web.archive.org/web/20050714085200/http://www.20at.com:80/article.php?sid=1272"

[[comments]]
