[[comments]]
order = 7
subject = "الي الاخ والاخت بتوع خليك فريش"
author = "عبده نصحي"
posted = "2006-01-10"
text = "الاخ والاخت بتوع خليك فريش احنا في رحله وبتاع .. خليك فريش وركب ديش ايه يا بشمهندس هو انا بقولك الكلام دا من دماغي طيب انا عاوز اسئلكم سؤال ورد عليا بامانه انت شوفت واحد منهم بيحتفل بعيد الفطر ولا بيحتفل بعيد الاضحي .. اوعي تقول بيحتفلوا وتكدب عشان الكدب وحش لا هم بيحتفلوا ولا بتاع ومش بيقولوا لبعضهم احتفلوا باعياد المسلمين وخليكوا فريش زي ما انت بتقول يا عم التانج مش فريش .. ويجعلوا عامر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153147/http://www.20at.com/article2.php?sid=152"
