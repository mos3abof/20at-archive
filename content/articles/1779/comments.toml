[[comments]]
order = 5
subject = "حرام وبدعه"
author = "أبو شهد ونور"
posted = "2005-12-28"
text = "السلام عليكم،<br />يا جماعة الاحتفال بهذه الأعياد غير الإسلامية بدعة. فقد شرع الله لنا أعيدنا نفرح ونبتهج فيها كما نشاء. لذلك ادعو إخواني وأخواتي المسلمين إلى تقوى الله في هذا اليوم والأبتعاد عن مظاهر الشرك. وأما النصارى فأدعو لهم بالهداية.<br />أرجو ألا أتلقى تعليقات تتهمني بالرجعية لإن هدفي هو ابتغاء مرضاة الله.<br />وكل عام وأنتم بخير بمناسبة اقتراب عيد الأضحى."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153147/http://www.20at.com/article2.php?sid=152"

[[comments]]
