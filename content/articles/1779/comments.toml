[[comments]]
order = 1
subject = "بابا اوبح"
author = "عبده نصحي"
posted = "2005-12-25"
text = "بابا نويل ايه اللي في العتبه بيقولوا عليه مش يعرفوا الاول بابا نويل دا بيبيع ايه ؟؟!!! لا حول ولا قوة الا بالله العلي العظيم صدق النبي صلي الله عليه وسلم حين قال \" لتتبعن سنن من كان قبلكم شبرا بشبر وذراعا بذراع حتي اذا ما دخلوا جحر ضب لدخلتموه \" او كما قال النبي صلي الله عليه وسلم والمقصود سنن من كان قبلكم اي اليهود والنصاري الشاهد من الامر ان الناس بتقلد تقليد اعمي وبيحتفلوا احتفال اعمي بحاجه المفروض لا تمثل لهم اي شئ ومن العجيب ايضا انه نفس الشئ في الصين البلد المنتج لهذه الدميه , الصينين نفسهم اساسا ميعرفوش مين بابا نويل دا ولا هم اصلا بيؤمنوا بيه وبالرغم من كدا بيحتفلوا بالكريسمس , انا حبيت بس ااقول الكلمتين دول لاني استغربت جدا وابرا نفسي من الكريسمس ومظاهر الاحتفال بيه ويجعلوا عامر .. عبده نصحي بجوار سور الصين العظيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153147/http://www.20at.com/article2.php?sid=152"

