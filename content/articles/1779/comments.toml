subject = "ايوة رجعي"
author = "صايع وقديم"
posted = "2005-12-28"
text = "ايوة طبعي رجعي يابني ماهو اي حد بيحاول يبقي مسلم في البلد دي يبقي رجعي و ارهابي و ثكلتك امك<br />اة يا بلد بكرة تحصلي اخواتك اللي اتدبحوا واحنا قاعدين هنا زي الخرفان<br />اعترف امام الجميع اني رجعي معتز برجعيتي<br />واتمني ان يقبلني الله من الرجعيين<br />وكل سنة وانت راس يا جرجس (هات الشمعه يا ميخائيل)"
archived = "2006-11-02"
