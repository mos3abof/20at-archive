[[comments]]
order = 3
subject = "إجابة مجرد سؤال"
author = "Bent Al-islam/USA"
posted = "2005-12-26"
text = "فتوى للشيخ سفر الحوالي<br />السؤال: ما حكم من يحتفل بأعياد الكفار أو يهنئهم بها مع علمه بأن ذلك من خصائصهم كما هو حال أكثر المسلمين اليوم؟!<br />الجواب: الحمد لله والصلاة و السلام على من لا نبي بعده... وبعد:<br />فإن الاحتفال بأعياد الكفار أو التهنئة بها مع العلم بأن ذلك من خصائصهم لا يخلومن هذه الأحوال:<br />أولاً: إما أن يكون ذلك لمجرد موافقتهم ومجاراة لتقاليدهم وعاداتهم من غير تعظيم لشعائر دينهم ولا اعتقاد من المشارك لصحة عقائدهم (وهذا يتصور في التهنئة أكثر منه في حضور الاحتفال ) وحكم هذا الفعل التحريم لما فيه من مشاركتهم ولكونه ذريعة إلى تعظيم شعائرهم و إقرار دينهم .<br />قال كثير من السلف في تفسير قوله تعالى ((والذين لا يشهدون الزور وإذا مروا باللغو مروا كراماً)) إن شهود الزور هو حضور أعياد المشركين وقال صلى الله عليه وسلم ((إن لكل قوم عيداً )) وهذا من أوضح الأدلة على الاختصاص.<br />ثانياً: وإما أن يكون ذلك لشهوة تتعلق بالمشاركة كمن يحضر أعيادهم ليشاركهم في شرب الخمور والرقص واختلاط الرجال بالنساء ونحو ذلك. وحكم هذا النوع التحريم المغلظ لان هذه الأفعال محرمة بذاتها فإذا اقترنت بها المشاركة في شهود زورهم كانت أعظم تحريماً.<br />ثالثاً: وإما أن تكون المشاركة بنية التقرب إلى الله تعالى بتعظيم ذكرى ميلاد المسيح عليه السلام لكونه رسولاً معظماً كما يحتفل بعض الناس بذكرى مولد الرسول صلى الله عليه وسلم، وحكم هذا النوع انه بدعة ضلالة وهي أشد تحريماً وأغلظ ضلالاً من الاحتفال بمولد الرسول لكون صاحبها يشارك من يحتفلون بذلك معتقدين أن المسيح هو الله أو ابن الله - تعالى الله عما يصفون - وهذا مما أحدثوه في دينهم مما لم يشرعه الله تعالى ولم يفعله المسيح عليه السلام ولا غيره من الأنبياء وتعظيم الأنبياء إنما يكون بمحبتهم واتباع دينهم وليس بهذه الاحتفالات.<br />رابعاً:وإما أن يكون الاحتفال مقروناً باعتقاد صحة دينهم والرضى بشعائرهم و إقرار عبادتهم كما عبروا قديما بقولهم ((المعبود واحد وان كانت الطرق مختلفة)) وكما يعبرون حديثاً بوحدة الأديان وأخوة الرسالات وهو من شعارات الماسونية وأشباهها وحكم هذا النوع أنه كفر مخرج من الملة قال تعالى ((ومن يبتغ غير الإسلام ديناً فلن يقبل منه وهو في الآخرة من الخاسرين)).<br />وصلى الله وسلم على محمدوآله وصحبه أجمعين<br />منقووول من ركن الأخوات islamway.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153147/http://www.20at.com/article2.php?sid=152"

