[[comments]]
order = 4
subject = "الغريب"
text = "ياجماعه يعنى هيا جت على السيد محمد المتولى ماطول عمرنا دمنا رخيص وطول عمر ولادنا واهالينا فى الجيش بيندبحوا زى الخرفان واندفنوا احياء بعد 67 وبالجير الحى كمان وعمر حكومتنا المحترمه ماتحركت تاخد حقهم اهموها بقى وبلاش وجع دماغ احنا أرخص شئ فى البلد دى . وتخيلوا كده لو كانت الاستاذه فيفى عبده ولا حد من اخواتها هو اللى حصله حاجه لا قدر الله اكيد كل المؤسسات الموقره هتتحرك لانقاذ الثروه القوميه"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022032830/http://www.20at.com:80/article.php?sid=532"

[[comments]]
order = 5
subject = "نونا المجنونة"
text = "والله عندكم حق الدنيا انقلبت عشان مطربة معظمنا نكانش يعرفها الي هي ذكري و الصحافة تكتب و امير سعودي بعت طيارة فيها الغنانين عشان يدفنوها في تونس و الممثلين و المطربين اصحابها كانوا بيبكوا عشانها<br />لكن حد منهم اتهز له شعرة ولا الامير السعودي ده عمل حاجة لمحمد الدرة مثلا<br />و غير الدرة كتير ده عندنا بس اطفال الشوارع دول مأساة و قنبلة موقوته مش فلوس الي اندفعت عشان ذكري هما كانوا اولي بيها؟؟؟؟؟؟؟؟"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022032830/http://www.20at.com:80/article.php?sid=532"

[[comments]]
order = 6
subject = "نونا المجنونة"
text = "لا يتفهم كلامي غلط<br />انا اقصد ان مش بيهتموا بالي بيموتوا<br />ولا حتي الي عايشيين و عايشيين في ظروف صعبة اهو الي مات ارتاح لكن ان واحد عربي يهدي مطرب يخت عشان بيحبه و الي يدي سيارة لكل مطرب مدعوا في حفلة هو عاملها هدية<br />دول مش اولي يصرفوا علي الايتام ولا يشوفوا مشاكل البلد"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022032830/http://www.20at.com:80/article.php?sid=532"

[[comments]]
order = 7
subject = "لا فيه فرق يامجنونة"
text = "اللي اندبح في 67 اندبح علشان كان بيحارب ومات شهيد انما ده رايح خيانة والحكومة عايزه تبعتنا زي الخرفان علشان ندبح العراقيين زي الخرفان برضوه<br />وهي دي المصيبة<br />انما لو نقتل في معركة<br />هذه امنية يبدو اننا لا نستحقها"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022032830/http://www.20at.com:80/article.php?sid=532"

[[comments]]
order = 8
subject = "نونا المجنونة بتوضح"
text = "احناتمنا رخيص سواء في معركة او في سلم<br />ده الي انا اقصده و محدش حاسس بينا ولا بمشاكلنا<br />مين ميتمناش الشهادة ؟؟؟ اكيد كلنا نتمناها بس شهداء 67 دول حد دور علي حقهم الي اعتقد ان مش بيسقط بالتقادم؟؟؟؟؟ بس برضة دول ماتوا و ارتاحوا<br />العايشين في مصر حالهم اسواء من الميت عايشين و مش عايشين"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022032830/http://www.20at.com:80/article.php?sid=532"

[[comments]]
order = 9
subject = "نونا المجنونة المزعجة"
text = "صراحة في رأي اي حد بيسافر للعراق او افغانستان عشان الامريكان يبقي بياكل من دم العراقيين<br />مجرد ان شغال مع الامريكان ده يجعله خاين في نظري والله اعلم"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022032830/http://www.20at.com:80/article.php?sid=532"

