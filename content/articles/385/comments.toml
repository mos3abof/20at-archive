[[comments]]
order = 0
subject = "بيرو"
text = "لماذا تم ذبح الرهينة المصري بالعراق<br />يبدو انه سؤال يحتوي بالفعل علي قدر كبير من التعقيد والكلكعة ....<br />100 سؤال وسؤال ...<br />هل كان الرهينة جاسوسا.....وهل دقق الخاطفون في جنسيته قبل خطفه وهل يساوي الحدث كل هذه الضجة ..<br />ربما لو أني أستغرقت قليلا في بحثي مرتديا \"نظرية المؤامرة \"لأحرزت نتائج هائلة ...<br />لكن دعنا نبتعد عن المؤامرة قليلا ونتحدث عن الواقع ..<br />والواقع هنا يقول ان الرهينة المصري لا يساوي من وجهة نظر خاطفيه -وبالتأكيدحكومته- حتي ثمن الشريط الذي احتوي مشهد ذبحه واجرة الكاميرا التي صورت العملية الفظيعة ..<br />الغريبة أنني بدأت أشعر أن حركات ومجموعات المقاومة التي ركزت خلال الفترة السابقة علي اختيار اسماء الصحابة والتابعين شعارا لها ...بدأت أشعر أنها مثل مجموعة الشياطين ال13 الذين يستهون اللعبة ويتعاملون معها من منطلق تختخ والأصدقاء الخمسة وربما لايرقي اداء اللاعبون ليصل لمهارة ادهم صبري...<br />في ظني ان معيار هؤلاء الصبية في اختيارهم لضحايهم يخضع في النهاية لسهولة أو صعوبة الوصول للضحية وأختطافها ..!!<br />الكل يعلم ان رهينة اوربي \"أحمر اللون \"يساوي العشرات وربما المئات من اصحاب الالوان الاخري<br />لكن الالوان الاخري هذه متاحة بوفرة ولا تجد من يسأل عنها ....وهنا تقبع عبقرية الشياطين ال13 ..!!"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022032830/http://www.20at.com:80/article.php?sid=532"

[[comments]]
order = 1
subject = "فكرة"
text = "لو كان محمد متولي جاسوس فعلا ...<br />كان يبقي من الصعب جدا اختطافه وذبحه..!!<br />ولا ايه"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022032830/http://www.20at.com:80/article.php?sid=532"

[[comments]]
order = 2
subject = "مطراوي"
text = "وليه منقولش ان ده كله تخطيط امريكي علي اصوله علشان الناس في مصر تحس باللي بيحصل في العراق وتول يالا يا جماعة نروح نحارب ولاد الكلب دول اللي بيدبحوا في ولادنا ..!!<br />الغريبة ان الدم عندنا بقي عملة نادرة فعلا ...<br />والموضوع ده يمكن يزعل امريكا مننا ...<br />علشان كدة موش بعيد نلاقي \"الحزب الوطني \" خارج في مظاهرة يوم الاتنين علشان يندد باللي حصل ويمكن يخرج معاهم ابو الغيط ويقول في الزحمة ....هنروح العراق علشان دم متولي يا رجالة ..!!<br />والله هم يبكي وهم يضحك!!"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022032830/http://www.20at.com:80/article.php?sid=532"

