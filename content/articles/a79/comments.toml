[[comments]]
order = 4
subject = "أنا أحمد"
text = "صباح الجمال يا رجالة( ذكورا وإناسا- بالسين ) العشرينات :<br />اسمي احمد<br />ومش من هنا<br />وباكتب موضوعات ( أوعى ) .. بس راح اعتزل الكتابة بعد ما قريت المقال العنيف بتاع البت المفروسة رغداء .. ومش كفاية انها فرسانة اوف لاين .. لأ واونلاين كمان<br />كلها نازلة عندكم في اسلام اونلاين ( السايت المؤدب ) بس أنا بجد بجد بأموت في الهلس وأنتم لامؤاخذة يعني أحلى ناس في التهييس علشان كده قررت اعتزال الكتابة عند المؤدبين وبدء صفحة جديدة من حياتي بعد التوبة والذي منه.<br />واحد صاحبنا طلب الايميل بتاعي على أساس يعني إن احنا بنكتب مقالات في الإيجابية وكده<br />بس بيتهيألي بعد ما يقرأ الرد ده .. هيدور على قعدة تانية يقعد فيها عاوز اقولك الميل بتاعي مفيش اسهل منه<br />ama673@hotmail.com<br />ده طبعا الميل الشعبي .. لو عاوز البس بدلة وكرافتة .. واديلك الميل الرسمي .. انا مستعد .. بس خلينا في الميل ده .. علشان اعمل تشات أنا وانت ( انت واد ولا بت ؟ ):)<br />حاكم أنا اعرف ناس كتير محدثين نعمة في التشات .. وأخوك سيد من يتريأ.. وربنا ما يغلبلك ماسنجر<br />وأشوف هترد علي ازاي<br />مرة تانية<br />اسمي أحمد"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417074052/http://www.20at.com:80/article.php?sid=79"

[[comments]]
