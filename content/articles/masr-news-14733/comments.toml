author = "اسواق الجملة وكارفور"
posted = "2010-01-04"
text = "الحكومة تنوى ان تفتح فى كل محافظة اسواق زى كارفور وسيتى سنتر وهى شركات جنسيتها فرنساوى<br />وطبعا وعن تجربة حينما تم فتحها فى بعض مدن الخليج والامارات وكنت وقتها موجود هناك تم اغلاق عدد كبير من الدكاكين الصغيرة والبقالات ومحلات البيع للاحذية والملابس الجاهزة والسوبر ماركتات الصغيرة لعدم الاقبال وتوجة الناس الى كارفور وسيتى سنتر<br />يعنى الاسواق الكبيرة دى الفرنساوى هتخرب بيوت الاف الاسر المصرية اصحاب المحلات الصغيرة لصالح شركة فرنسية<br />الحكومة بتدور على مصلحة الاجانب واليهود واسرائيل"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105172741/http://www.20at.com:80/masr/news/14733-2010-01-04-08-34-16.html"
