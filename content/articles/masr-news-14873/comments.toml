text = "انا مش عارف مين اختارة وزير للخارجية ليقعد على كراسى الوزراء العظام للخارجية المصرية امثال الدكتور محمود فوزى وصادق وعمرو موسى وغيرهم وغيرهم من العظماء<br />فاكرين ابو الغيط لما اصر ان الجزائر بعد احداث السودان تعتذر لمصر - فين الاعتذار<br />وفاكرينة مع احداث غزة واحداث حماس وموقفة لما كان ماسك وساند ايد ليفنى بحنية<br />دة راجل اقصى قدراتة انة ينفع سكرتير تالت فى سفارة فى افريقيا<br />انما ابو الغيط وزير خارجية لمصر<br />يا اخى !!!!! والا بلاش"
