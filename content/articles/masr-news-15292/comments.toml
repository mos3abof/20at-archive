posted = "2010-02-11"
text = "فين انابيب البوتاجاز يا ولاد الكلب<br />احنا ملينا من الهبل دة<br />والقصة المكررة مليون مرة<br />كلاكيت للمرة المليون<br />القبض على الاخوان<br />كلاكيت للمرة المليون<br />الافراج عن الاخوان<br />انما انابيب البوتاجاز فين - فين العيش - فين السكر - يا ولاد الكلب"
