order = 1
subject = "شكرا لعمرو خالد و حسين فهمي , اما الثالث فلنا وقفة"
author = "معتصم بالله"
posted = "2006-07-31"
text = "بعد ما حدث في قانا و الكلام الكثير عن التخاذل العربي و الصمت المشين و .. و..الخ , يبدأ الامل يظهر من جديد , فالامة العربية امة خير منذ قديم الازل و دوما يظر اصحاب الضمائر الحية .<br />الان بعيدا عن الاستاذ عمرو خالد المعروف دوما بمواقفه الرجولية و العقلانية , ليس جديدا عليه ان يحتج لما يراة يوميا يحدث في لبنان و بالاخص ما حدث ليلة امس في قانا , فهو الشهم النبيل الذي لا يتردد لحظة في نصرة الاسلام و المسلمين , با و لا يقتصر فقط علي المسلمين يل يمتد ليشمل كل عربي سواء اكان مسلم او مسيحي او حتي يهودي .<br />فالجديد هو موقف الفنان حسين فهمي , فموقفه موقف مشرف لكل فنان يدعي انه يحمل رساله , فهو بذلك اكد انه فنان يحمل رسالة و لابد لهذه الرسالة ان تصل , فكونه سفيرا يتخلي عن هذا المنصب لمجرد ايمانه بالرسالة التي سخر نفسه لانجازها و ليقف و يقول انا هنا و اين انتم يا امة محمد فهو لا شك انسان نبيل يمكن ان يطلق عليه رجل بل و يستحق ان يكون عربي .<br />فكأن حسين فهمي يقول للزعماء العرب انا و بصفتي سفير للنوايا الحسنة في الامم المتحدة اتنازل عن هذا المنصب فأنا لا استطيع ان اقدم شيئا للامة العربية من خلال هذا المنصب فتنازلت عنه , اذا اين انتم يا حكام العرب يا من تتدعون حرصكم علي المصالح العربية ؟! مر علي توليكم للحكم اكثر من 20 سنة و مازلتم جالسون , بل و ليس فقط جالسين بل و تنددون بالمقاومة الاسلامية في لبنان التي تحافظ علي كرامة امتكم التي دفنتوها بجهلكم و صمتكم . ان سكوتكم لهو افضل بكثير من كلام يعطي غطاءا لعدوان صهيوني علي ارضنا الحبيبة.شكرا لك يا حسين.<br />و بالنسبة للجندي الصهيوني اشكرك علي شعورك الطيب , و لكني اتسائل هل فعلا تنازلت عن الخدمة العسكرية لأن هذه الحرب ليست شرعية ام لأنك تخاف ان تقتل علي يد المقاومة الاسلامية في لبنان , و بالنسبة للقيم التي ربيت عليها .. فأين هذه القيم؟؟!! هل تخدع نفسك ؟؟؟!!! انك ربيت علي رائحة الدماء و القتل و التهجير و الخمر و الميسر ...الخ من المحرمات , فأدعوك الا تقول هذا الكلام مرة اخري لأن العالم يعرف تاريخك و قومك فألزم الصمت.<br />اخيرا .. لقد اثبتنا نحن العرب مرة اخري اننا الامة الباقية و النصر حليفنا و العزة قدرنا و سيظل العنصر الخير في امتنا ال يوم الدين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125809/http://www.20at.com/article2.php?sid=1111"

