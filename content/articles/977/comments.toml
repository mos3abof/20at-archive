order = 0
subject = "سامحونا يا عرب .. جاين لكم قريبا .."
author = "إبن بهية"
posted = "2006-07-31"
text = "ما بقي للبنان الجريح غيرهم .. شيخ وفنان .. هم فقط من يستطيعوا نجدتهم بما يملكون .. الشيخ يدعو الله والفنان يعترض بما لديه من إمكانات بسيطة .. والشعوب نائمة للأسف الشديد .. نائمة لا تدري ما يحيط بها من مصائب .. المشكلة يا شعوبنا العربية ليست في فلسطين ولا لبنان المشكلة أن بلادنا كلنا مستهدفة .. الموضوع أكبر مما قاله الواطي حسني مبارك منذ يومين عندما قال أن مصر لن تحارب نيابة عن لبنان .. هو حد قالك حارب يا واطي ؟؟؟ الحرب دي للرجاله يا واطي .. احنا بس قلنا أطرد إبن عمك .. السفيرالإسرائيلي .. يعني معقوله أطفالنا تقتل في قانا وعلم الصهاينة القبيح الوسخ يرفرف في سماء القاهرة ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ والله دي مصيبة وعيب أوي أوي في حق كل بنت مصرية مش راجل ... يا جبان يا كلب يا واطي .. بتضحك على مين ؟؟؟؟ لا حد قالك حارب ولا حد طلب منك كده لأنك ما تقدرش والجيش المصري بعته خرده يا وسخ .. كل المطلوب كان بس موقف يا جبان يا عميل .. بلاش موقف المواقف دي برضه بتاعة الرجالة .. كان المطلوب تسكت وتتنيل على عين أمك ... لأ تسكت ازاي وانته بتحضر للهجمة دي مع الصهاينة من سنة يا عميل ... نسيت تصريحاتك من شهور اللي ما لهاش لازمه خالص ساعتها لما قلت الشيعة ولائهم لإيران ؟؟؟ نسيت يا واطي ؟؟؟ حسبنا الله ونعم الوكيل ... سامحونا يا إخوانا في لبنان ... سامحنا يا سيد حسن يا نصر الله .. تحرير الأسرى في سجون الصهاينة يلزمه في مصر تحيري من نوع آخر ... تحرير الشعب كله من سجن كبير ساجنهم فيه عميل إسرائيل على مصر .. ساجنهم فيه مبارك الواطي .. سامحونا يا إخوان العرب .. مش قادرين نعمل أي حاجه خالص ... بس نوعدكم .. وعد الحر دين وانتم عارفين مصر وتاريخ مصر .. نوعدكم أننا سنتخلص في أقرب ما يمكن من العميل مبارك وكل نظامه القذر من الوزير للغفير لأنه ملاهم كلهم قذارة .. بقت ريحتهم قذره مش ممكن نستحملها أكتر من كده .. قريبا سيكون الخلاص وقريبا جدا يا عرب ستأتيكم مصر كما عهدتموها .. بهية .. صبية .. عفية .. شريفة مش عميلة .. مش ممكن تبيع وطنها ولا إخوانها .. قريباً يا عرب .. نعدكم ..<br />إبن بهية<br />http://ibnbahya.blogspot.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125809/http://www.20at.com/article2.php?sid=1111"

