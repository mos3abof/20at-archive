text = "وبعدين...........................<br />هل سنسكت؟<br />ولا لازم وقفة<br />الكندليزا الطيبة المسكينة الي الي بتعزي<br />في ارواح قتلى قاناالذين كانوا جالسين<br />في بيوتهم خائفين مذعورين من القصف السرائيليالغادر<br />والله الكلام معدش يجيب نتيجة خا لص و على ما اظن صح؟؟؟؟؟؟<br />والله الصورة بتشرح نفسها<br />الله قادر على كل شيء<br />وشكرا<br />nightmoonwolf2006@yahoo.com"
