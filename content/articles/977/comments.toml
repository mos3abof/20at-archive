order = 6
subject = "cha3aboulla"
author = "القاهرة – الوطن - تقدمت السفارة الإسرائيلية بالقاهرة باعتراضات شديدة اللهجة إلى وزارة الخارجية المصرية؛ احتجاجًا على الألبوم الأخير للمطرب الشعبي شعبان عبد الرحيم \"2 عساكر\"، الذي تضمنت أغانيه انتقادات لاذعة إلى رئيس الوزراء الإسرائيلي أيهود أولمرت."
posted = "2006-08-01"
text = "وانتقدت السفارة في مذكرتها أغنية شعبان عبد الرحيم لمقطع \" شارون ارتحنا منه وجالنا أولمرت اللي أوسخ منه\"، وحذرت فيها من أن موافقة الجهات الرقابية على مثل هذه الأغاني قد يحدث توترًا في العلاقات المصرية - الإسرائيلية في وقت شهدت فيه هذه العلاقات تطورًا كبيرًا خلال الأشهر الماضية.<br />وطالب المذكرة السلطات المصرية بضرورة سحب هذا الشريط من الأسواق المصرية بشكل فوري حتى لا تقوم السفارة برفع دعاوى قضائية على الجهات المختصة والمطرب؛ وخاصة وأن هذه ليست الواقعة الأولى التي يتناول فيها شخصيات إسرائيلية بالنقد اللاذع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125809/http://www.20at.com/article2.php?sid=1111"

