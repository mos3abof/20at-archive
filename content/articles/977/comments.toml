subject = "البقاء لله"
author = "حانوتي"
posted = "2006-08-01"
text = "البقاء لله في حكامنا العرب وجامعة العيال العربية لقد وافتهم المنية من> زمن ولكن رائحة جثثهم ظهرت مع العدوان على لبنان.<br />البقاء لله والعزاء في البيت الابيض ويتلقى العزاء اي كلب ماسك الرئاسة في البيت الابيض او في اسرائيل.<br />الغريبة ياعالم اننا حطين امل في ان الحرامي يعترف بذبه واللي يساعدنا يكون شيخ المنصر بالذمة مش ده هبل مننا ومن حكامنا<br />البقاء لله ولا عزاء للرؤساء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125809/http://www.20at.com/article2.php?sid=1111"

[[comments]]
order = 5
subject = "الجيش العربى فين"
author = "مواطن مقهور"
posted = "2006-08-01"
text = "واحد اتنين .. الجيش العربى فين<br />الجيش العربى فين .. الجيش العربى فين<br />الجيش العربى فى مصر<br />ساكن فى مدينة نصر<br />يصحى من النوم العصر<br />و بيفطر شاى و منين<br />واحد اتنين الجيش العربى فين<br />الجيش العربى فى سوريا<br />حالق ع الموضة كابوريا<br />و على طريقة فيكتوريا<br />خلى الترماى بدورين<br />واحد اتنين الجيش العربى فين<br />الجيش العربى الليبى<br />زى الفن التكعيبى<br />كله بتنجان يا حبيبى<br />و الظاهر واخد عين<br />واحد اتنين الجيش العربى فين<br />الجيش العربى خليجى<br />ما فيه حيل لا يروح و لا ييجى<br />هدا صمت استراتيجى<br />ايش بيك يا غراب البين<br />واحد اتنين الجيش العربى فين<br />الجيش العربى فى تونس<br />أخضر مثل البقدونس<br />و عزيزة بتعشق يونس<br />تبقى الحُرُبات بعدين<br />واحد اتنين الجيش العربى فين<br />الجيش العربى سودانى<br />سامع خطوته بودانى<br />هوا انا ههجم فردانى<br />يالله ارجع يابو حسين<br />واحد اتنين الجيش العربى فين<br />الجيش العربى فين<br />الجيش العربى اتهان<br />يوم مانضربوا الافغان<br />وسكت فى البوسنة زمان<br />وقدر ياكل ليلتين<br />واحد اتنين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125809/http://www.20at.com/article2.php?sid=1111"

