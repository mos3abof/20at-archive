subject = "مش بس الشباب هو اللي ملتزم وروش طحن"
text = "احنا البنات كمان الحمد لله ملتزمين وبنعرف نقضي وقتنا كويس جدا بس بالطريقة اللي تناسبنا انا كنت معتقدة قبل التزامي اني مش هعرف اقضي وقتي لكن الحمد لله انا بعرف اقضيه دلوقتي كويس جدا لدرجة انس مش عندي وقت ضايع تقريبا<br />اهم حاجة بالنسبالي الصحبة ومع بعض بنعمل كل حاجة من غير مانغضب ربنا وبنروح النادي وبندخل النت وبنتقابل اكثر من مرة في الاسبوع وبنحضر دروس كثيرة مع بعض في المساجد والحمد لله كلنابنقضي وقتنا كويس جدا وبنية طاعة الله"
archived = "2005-07-20"
capture_url = "https://web.archive.org/web/20050720084513/http://www.20at.com:80/article.php?sid=1296"

