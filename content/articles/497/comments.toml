[[comments]]
order = 6
subject = "الالتزام أم الروشنة وأبوها"
text = "لم أر في حياتي شباب روش طحن مثل الملتزمين<br />لم أكن أعرف أن الملتزمين لديهم كل هذه الروح من المرح والدعابة . . والمهارات في التمثيل والغناء والإنشاد<br />لم أر في حياتي شبابا أكثر روعة من هؤلاء الملتزمين<br />لعب ، وثقافة وفكر وسياسة ، وفي آخر اليومين ركعتين مع ربنا<br />لم أر في حياتي أتفه ممن يدعون الروشنة والشبابية بينما هو تجاوزوا الأربعينات .. . ويبيعوا للشباب الوهم في أغاني العري كليب<br />لم أر في حياتي شبابا أكثر روعة من هؤلاء الملتزمين . . كورة ولعب وخروج ومصيف . . وكل دا من غير معصية ومن غير قلة أدب واستهبال<br />والله أكبر ولله الحمد . . والإسلام ينتشر والالتزام يعود . . والشباب الأكثر روشنة والشباب الأكثر التزاما والشباب الأكثر ثقافة هم شباب الصحوة<br />وليس شباب \"الشهوة\"<br />وغدا يفيق الجميع على الحقيقة . . حقيقة أنه لم يبق سوى الملتزمين ، أمل الأمة وماضيها ومستقبلها<br />والله أكبر ولله الحمد<br />عمرو مجدي"
archived = "2005-07-20"
capture_url = "https://web.archive.org/web/20050720084513/http://www.20at.com:80/article.php?sid=1296"

[[comments]]
order = 7
subject = "معتز"
text = "موضوع طيب ربما يجيب اسئلة تدور في أذهان الكثيرين<br />ففعلا كثير من الناس ترى في اعينهم التعجب إذا علموا انك لا تذهب لسينما ولا مسرح ولا تشاهد الكليبات<br />ولكن لا تأتيهم الجرأة ليسألوا<br />ربما خافوا من أن ( تشخط وتنطر وتتهمهم بالفسوق) كما صور لهم الإعلام ذلك<br />ولكن<br />لي تعليقان<br />واحد على الموضوع والىخر على راي قيل في الموضوع<br />1- اسم الموضوع لا يعجبني لأن صورة ( الروش طحن ) في أذهان الناس كما تعلمون فلا احب ان يوصف بها المتدينون - وايضا لو أنهم ( روشين طحن) لمجرد أن يترفهون بما احل الله فهذا هو الطبيعي فهل نصف كل المسلمين من عهد النبي صلى الله عليه وسلم إلى يوم القيامة ب(الروشين) أنا لا احب ذلك بالطبع<br />2- عجبت لمن قالوا انهم يرفهون عن انفسهم على المقاهي .. هل يرفه الملتزم عن نفسه بين دخان الشيشة و وأصوات الطرب المنبعثة من التلفزيون الذي غالبا يكون متصلا بالدش لا اتصورها<br />أو بالأفلام الخيال العلمي فهل هناك افلام خيال علمي او نحوه استغنى فيها عن عنصر النساء وعن الموسيقى - وخاصة ان معظم هذه الأفلام أميريكية"
archived = "2005-07-20"
capture_url = "https://web.archive.org/web/20050720084513/http://www.20at.com:80/article.php?sid=1296"

