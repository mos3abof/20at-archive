[[comments]]
order = 12
subject = "بالنسبة لمشاركة to mo3taz"
text = "بسم الله الرحمن الرحيم<br />أولا أخي أنا لم أقل أن الناس تجلس في البيت ولأن كلامي لم ينشر كاملا عندما سئلت في هذا الموضوع – غير عاتب على عدم نشره كاملا لان معظمه تكرر في آراء أخوة آخرين – فقد تتوهم ذلك<br />فمما قلت (الوسيلة الأكثر انتشارا هو جلوس مجموعة من الأصحاب معا يتكلمون ويتمازحون ويضحكون وأحيانا يحدث هذا يوميا في وقت قصير – بعد الصلوات – أو كل مدة لوقت طويل ، وغالبا ما يكون هناك الأمران معا<br />البعض يحب لعب الكرة وإن كان هذا لطلبة الكليات العملية أمرا صعبا نوعا ما<br />البعض يحب ألعاب الحاسب<br />ممارسة الهوايات كالكتابة وتصميم أعمال على الحاسب والكتابة على الانترنت ..<br />مجالسة الأهل والأقارب<br />كثرة الخروج للصلاة وعدم ( الحبس) في البيت خاصة في الأجازات من الأمور التي تسري عن النفس كثيرا)<br />أما عن مقارنة القرن 21 بـ 1400 عام مضت فالأمور لم تختلف كثيرا فحينها كان هناك كان وسائل ترفيه منها المشروع وغير المشروع والآن مع اختلاف الصور فكان من المشروع عندهم على سبيل المثال المسابقة في الجري (كما بين النبي صلى الله عليه وسلم والسيدة عائشة ) والفروسية والرمي بالرمح وغيره ومن غير المشروع مجالس اللهو والغناء ( راجع سيرة النبي صلى الله عليه وسلم قبل البعثة عندما حاول مرتين أن يحضر عرسا في لهو وغناء فأنامه الله حتى لا يسمع)<br />وأخيرا أن لم أقل للناس موتوا حتى تنصحني بتركهم عايشين<br />معتــــــز"
archived = "2005-07-20"
capture_url = "https://web.archive.org/web/20050720084513/http://www.20at.com:80/article.php?sid=1296"

[[comments]]
order = 13
subject = "أما عن مشاركة (حالة خاصة)"
text = "أخي الحبيب: الشارع يختلف كثيرا عن الفيلم<br />فأنا مضطر لأمشي في الشارع على ما فيه وأذكر أن رسول الله صلى الله عليه وسلم نهى عن الوقوف في الطرقات في غير ضرورة وهنا -حين تأتي الضرورة -علي أن أطبق أمر غض البصر<br />لكن عندما أدخل فيلما فيه ما فيه من العري – ولا يستلذ مؤمن بشيء يعصى فيه الله بل إن الغضب لله يفتك بقلبه - فهنا نذكر أن الإسلام لم ينهنا في كثير من الأحيان عن الذنب نفسه بل عن مجرد الاقتراب منه لأن النفس ضعيفة وتأمل كلمة ( لا تقربوا) في القرآن لتصدقني ، فلا أقول أنني أجلس في وسط صور متبرجة وأنني بي من الإيمان والالتزام ما يجعلني أغض بصري<br />إذن لماذا لم يستثني الشرع الصالحة والصالح من حكم تحريم الخلوة مثلا؟<br />ولما يحذر الله (المؤمنين) ((يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ وَمَن يَتَّبِعْ<br />خُطُوَاتِ الشَّيْطَانِ)) سورة النور وفي غيرها<br />وأذكر أن سبب ضياع برصيص العابد الذي قال فيه الله تعالى(كَمَثَلِ الشَّيْطَانِ إِذْ قَالَ لِلْإِنسَانِ اكْفُرْ فَلَمَّا كَفَرَ قَالَ إِنِّي بَرِيءٌ مِّنكَ إِنِّي أَخَافُ اللَّهَ رَبَّ الْعَالَمِينَ {16} فَكَانَ عَاقِبَتَهُمَا أَنَّهُمَا فِي النَّارِ خَالِدَيْنِ فِيهَا وَذَلِكَ جَزَاء الظَّالِمِينَ {17}) الحشر .. كان سبب ضياعه نظرة<br />وأخيرا حركت جفنك يا أخي وغضضت بصرك (فتخلصت من زنا العين) فكيف تغض أذنك عن أصوات الخاضعات بالقول فهل ستدخل السينما لتغطي عينك وأذنك ؟!!<br />ولما وعندنا من الوسائل الكثير كما ذكرت أمثلة منها آنفا؟<br />وميزة الشباب الملتزم أنهم يجاهدون أنفسهم فيما يحبون ويلتذون إذا كان به معصية ويحتسبون الأجر عند الله ويعوضهم الله خيرا وقد قلت – ولم ينشر – أن المسلم الملتزم حقا متصلا بالله قارئا لكتابه ملتذا به أحزانه قليلة وهمومه يكفيها النذر اليسير من الترفيه ليقضي عليها دون الحاجة ليدخل في حرب ليجاهد عينيه وأذنيه"
archived = "2005-07-20"
capture_url = "https://web.archive.org/web/20050720084513/http://www.20at.com:80/article.php?sid=1296"

