[[comments]]
order = 3
subject = "حالة خاصة!!!!"
text = "ضحكت قوي و انا بقرأ الموضوع ده<br />لذيذ و الله .... الملتزمون دلوقتي بقو حالة خاصة نعمل عنها مواضيع \" كيف يروش الملتمون \" و \" ملتزمون في المصيف \" و كده يعني !!!<br />اعتقد ان الموضوع ده المفروض يكون اسمه روش طحن فقط<br />لأن الاصل هو ان الدين الاسلامي هو دين الجمال و\" الروشنة \" اذا جاز التعبير<br />لكن ان صاحب هذه الروشنة معاصي فهي المعاصي فقط اللتي تناقش<br />يعني ببساطة السينما مش حرام .. و لكن قد يعرض فيها فيلم حرام<br />يبقى نتكلم في الفيلم ولا السينما ؟؟<br />المهم انا رأيي اني اصبحت استمتع اكتر بل و اروش مما كنت عليه بعد التزامي و الحمد لله<br />يعني الاول كانت الموضه تروح و احنا وراها<br />دلوقتي على الاقل احنا اللي بنعمل الموضة بتاعتنا<br />يعني بدل ما البنطلون الـ funnky ساقط و عليه تي شيرت شبك<br />رفعناه شوية و لبسنا حزام و عليه تيشيرت نص كم<br />يبقى كده اكيد اروش ( على الاقل شكلة محترم )"
archived = "2005-07-20"
capture_url = "https://web.archive.org/web/20050720084513/http://www.20at.com:80/article.php?sid=1296"

