subject = "صيف,سينما, خرجات"
text = "بسم الله الرحمن الرحيم لم ولن يكون التدين الصحيح معارضا للا ستمتاع بالحياة( صيف أوغير صيف)فأنا مثلا أخرج وأذهب الى أي مكان أريده وليست لدي أي مشكلة لأن نفسي والحمد لله تنفر فورا من أي مكان فيه معصية كالشواطئ واذا ما اشتقت لمنظر البحر أذهب مبكرا فالجويكون أحلى وأكثر راحة وأظن أن هذا ما تصبوله النفس أماالسينما فطالما سلتنا لكن بكل صراحة قلمااااا تفيدنا ومع ذلك فليست كل الأعمال فيها بذاءة وأي واحد منا ترك شيئا طاعة لله أبدله الله تعالى ماهو خير منه وأحلى"
archived = "2005-07-20"
