subject = "اسم الاخت (عاشقه لله ) لايجوز"
text = "ان الاسماء غا لبا تدل على المسميات فلا يجوز تسمي نفسك بهذ الاسم ولا ان تنسبي الى الله سبحانه وتعالى هذ الاسم فان العشق دليل الشهوه ولاينسب الا الى المراه وقديغلط كثير من الناس فيقول انه يعشق النبي صلى الله عليه وسلم وهذ من الاخطاء الشائعه بين الناس الذين لم ينالو حضا من العلم الشرعي الصحيح<br />والسٍٍٍٍٍٍٍٍٍٍٍٍٍٍٍٍٍٍٍٍٍٍٍٍٍٍٍــــــــــــــــــلام"
archived = "2005-07-20"
capture_url = "https://web.archive.org/web/20050720084513/http://www.20at.com:80/article.php?sid=1296"

[[comments]]
order = 23
subject = "الشيوخ والدعاة اخف الناس ظلا...ولكن"
text = "كانت قريباتي تسألني دائما ...هما ليه الشيوخ كلهم دمهم خفيف جدا ومرحين حتي ...فكنت ارد بهذه الآية (قل بفضل الله وبرحمته فبذلك فليفرحوا هو خير مما يجمعون)....كثير من الناس تجد انه بعد ضحكه ولهوه ينتابه كآبة عجيبة اذا كان لهوه في معصية الله...اما الملتزمين فضحكهم في مرضاة الله لذلك لا تجد هذه الكآبة أبدا.<br />المهم ان الآية بتقول ان الفرحة تكون في رحاب الله وهدي الاسلام ولا تخرج عنهما ...وهذا لا يمنع ان هناك مجالات كثيرة لان يفرح المسلم فرحا لا يناقض دينه.<br />ولكن بالنسبة للخروجات والخميس...فاحنا بنعرف ايه اللي في الشارع دلوقت واللي في المصايف ...وحاجات كتيرة اغلقت علينا ابوابا للهو المباح......وبالطبع لا يجوز الانخراط في الاماكن التي قد يفتن فيها المسلم ...وبالتالي يضيق علينا.<br />ولكنه زمن الغربة الذي جاءنا فيه خبر عن المصطفي صلي الله عليه وسلم.....الطاعة وسط المعصية ..والغربة وسط الذنوب.......فمن اراد ان ينخرط مع اللاعبين ويخرج من دائرة الغرباء فلينخرط....وطوبي للغرباء....الذين يعبدون الله في الهرج.<br />ولازال هناك اللهو والضحك المباح....فلا تتمحكوا في الباطل بحجة عدم وجود بديل سواه."
archived = "2005-07-20"
capture_url = "https://web.archive.org/web/20050720084513/http://www.20at.com:80/article.php?sid=1296"

[[comments]]
order = 24
subject = "تاريخه اسود من قرن الخروب"
text = "انا لا ادري ما اي طاعة لولي امر في معصية الله....السفير بتاعنا ربنا يغفر له ويرحمه عمل في اسرائيل وذهب للعراق في اوج الفتنة ...وهو يعلم انه بسفره للعراق سوف يقوي دور امريكا ويضعف دور المجاهدين .....يبقي يعمل فيها بطل ويسافر ليه...الحكومة بتاعتنا عارفين انها بتعمل جرد علي اي حد شغال في السلك الدبلوماس من اول اللي بيفتح باب عربية السفير للسفير نفسه....وهما ماكانوش هايقبلوا السفير الا عندما يتأكدوا من فكره العلماني الذي يوافق الدبلوماسية العلمانية.<br />راح اسرائيل و كان فاتحة السفراء العرب في العراق ...يعني تاريخ اسود بعيد عنكم.<br />عمل فيها بطل يستاهل......والله اعلم بما في قلبه وسيحاسبه عليه.<br />واشمعني الدين وطلب طاعة ولي الامر لا يكون الا الان رغم ان تعاملهم الوحيد بالعلمانية."
archived = "2005-07-20"
capture_url = "https://web.archive.org/web/20050720084513/http://www.20at.com:80/article.php?sid=1296"

