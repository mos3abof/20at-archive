text = "عندي تساؤل بسيط و مش عايزة عليه إجابه :<br />إيه اللي يضمن إن بعد ما الكشك يتفتح \" تاني\" بفلوس أهل الخير \"تاني\" مايتقفلش \"تاني\" ؟<br />بسبب إن رأس المال بيضيع … يعني بسبب إنها مش بتشيل فلوس تجيب بيها بضاعة جديدة"
archived = "2009-08-30"
