author = "والنبى يا ست رضوة"
posted = "2009-08-27"
text = "خفى علينا شوية من موضوع القبور دى<br />انت فاكرة الغلابة ساكنين فى القبور بس<br />البلد كلها غلبانة<br />ومطرح ما تمشى فى اى حتة تلاقى اللى بيمد ايدة ويقول لك زكاة رمضان<br />انا اصبحت اخجل اطلع من البيت بيقابلك افندية وستات وبنات وشباب فى كامل صحتهم ويقول لك هات للة<br />البلد حالتها صعب قوى"
archived = "2009-08-30"
capture_url = "https://web.archive.org/web/20090830003420/http://www.20at.com:80/masr/t7kyk/13087--10-.html"

