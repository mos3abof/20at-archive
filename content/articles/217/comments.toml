[[comments]]
order = 0
subject = "بنت والسلام"
text = "أروح بس مصيف<br />بعدين أحب ولا محبش مش مشكلة<br />إيه يا جماعة العبقرية غي اختيار المواضيع دي<br />حلفتكوا بالله تقولولي بتاكلوا ابه<br />بجد هايلة"
archived = "2004-09-06"
capture_url = "https://web.archive.org/web/20040906152605/http://www.20at.com:80/article.php?sid=587"

[[comments]]
order = 1
subject = "ايه ده ؟؟؟"
text = "خلاص يا عشرينات مش لاقين موضوعات تنزلوها فمضطرين تنزلو اى حاجه<br />لو الموضوعات خلصت قولولنا بدل الهيافه دى"
archived = "2004-09-06"
capture_url = "https://web.archive.org/web/20040906152605/http://www.20at.com:80/article.php?sid=587"

[[comments]]
order = 2
subject = "حبيتك بالصيف ...حبيتك بالشتا"
text = "أيوة والله يا فيروز ...<br />معلش لسه صاحي من النوم ...حب ايه ياجدعان اللي بيطلع في الصيف ..<br />ده حتي الدنيا بتبقي حر وخنقة وموش طالبة وجع دماغ ...<br />بصراحة أنا بحب في الصيف حاجة واحدة بس ...<br />البحر والمياة والهواء....اللي في الساحل الشمالي طبعا ...<br />سلام ....رايح آخد غطس ....<br />جايلك يا بحر :)"
archived = "2004-09-06"
capture_url = "https://web.archive.org/web/20040906152605/http://www.20at.com:80/article.php?sid=587"

[[comments]]
order = 3
subject = "فكرة"
text = "يخرب بيت الروقان ...واحد قاعد علي الشط بلاب توب وبيعلق ... خدي غطس معاك يا كابتن"
archived = "2004-09-06"
capture_url = "https://web.archive.org/web/20040906152605/http://www.20at.com:80/article.php?sid=587"

[[comments]]
order = 4
subject = "فعلا"
text = "يعني إيه ..أسيتون ...سؤال برئ والله ؟؟؟؟"
archived = "2004-09-06"
capture_url = "https://web.archive.org/web/20040906152605/http://www.20at.com:80/article.php?sid=587"

[[comments]]
