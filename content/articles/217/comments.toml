subject = "فعلا فعلا"
text = "يعني حاجة بتطير بسرعة ...أنت مقريتش المقال ولا أيه ؟؟؟"
archived = "2004-09-06"
capture_url = "https://web.archive.org/web/20040906152605/http://www.20at.com:80/article.php?sid=587"

