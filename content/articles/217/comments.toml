text = "عايز اروح أصيف ...يمكن احب هناك ...حد جاي معايا ؟؟"
archived = "2004-09-06"
capture_url = "https://web.archive.org/web/20040906152605/http://www.20at.com:80/article.php?sid=587"

[[comments]]
order = 9
subject = "نونا"
text = "بلا حب بلا نيله<br />انا رايحة المصيف ارتاح من وش مديرتي العكر<br />الله يبعت لها سفرية لبلاد تركب الافيال و يبعدها عن طريقي<br />انا كل نشاطي في المصيف<br />انام اصحي اكل اصلي انام تاني<br />كفاية قوي........"
archived = "2004-09-06"
capture_url = "https://web.archive.org/web/20040906152605/http://www.20at.com:80/article.php?sid=587"

[[comments]]
order = 10
subject = "وائل عباس"
text = "انا برضه عاوز اصيف<br />بس للاسف مافيش هناك خط تليفون اخش بيه على النت علشان ارازي في البشرية<br />ايه ده ...<br />يظهر انا متراقب وشايفين اللي انا باكتبه<br />لحقوا يشوفوا اللي انا باكتبه في عشرينات ؟؟؟<br />شارون بعتلي تذكرتين نيوزيلاندا اصيف على حسابه وابعد عن عمليات الموساد في فرنسا ...<br />المخابرات السعودية بعتولي بيقولوا نبوس ايدك روح صيف وحل عن ال سعود ...<br />والاخوان المسلمين بيلموا من بعض علشان يدفعولي اروح اصيف ويخلصوا من لساني ...<br />ومباحث امن الدولة ما كانوش عارفين يصنفوني كاتب اسلامي ولا كاتب شيوعي دلوقتي صنفوني ((من الاخوان المصيفين)) ..."
archived = "2004-11-02"
capture_url = "https://web.archive.org/web/20041102235910/http://www.20at.com:80/article.php?sid=587"

[[comments]]
order = 11
subject = "DONDON"
text = "اولا<br />انا كنت متوقعة انى الاقى موضوع الاول وبعدين اراء لكن للاسف ما لقيتش .<br />بس يا جماعة ما تظلموش الكاتبة يمكن تكون لسة مبتدئة وهم عدلو فى موضوعها وغيروة فغيرو من وجهة نظرها الصحيحة.<br />واحنا كتير بنسمع عن تغيير المواضيع وخاصة اذا كان كاتبيها من الشباب.<br />شكرا. ولا تغضبى يا اميرة من التعليقات."
archived = "2004-11-02"
capture_url = "https://web.archive.org/web/20041102235910/http://www.20at.com:80/article.php?sid=587"

