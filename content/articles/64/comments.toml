order = 9
subject = "لا تهاجموهم بل اشكروهم و ادعو لهم"
text = "السلام عليكم و رحمة الله و بركاتهاود ان اوضح ان الداعية الاستاذ عمرو خالديعتبر نعمة من رب العالمين على الامة الاسلامية و كذلك اى داعية مخلص لديننا الحنيف لذالابد ان نحمد الله على ان تغمدنا برحمته و ارسل الينا شباب مسلمين يقدمون الينا الاسلام فى صورة عملية و قربوا الينا المفاهيم و المعانى الدينيةكما يجب ان نقتدى بهؤلاء الصناع للحياة و للعلم فان الاستاذ عمرو خالد قد التحق بمعهد الدعاة الى جانب اعتماده على المراجع و الكتب و المؤلفات الدينية لكبار شيوخ و علماء الامة عند تحضيره لاى محاضرة دينية وفقه الله وزاده علما و نورا و قبولا و بارك لنا فيه و فى كل من يهم لنصرة ديننا و اسلامنا الجميل كما انه لم يكن ابدا داعية للتسيب فى القيم و التعاليم و الاومر الدينية و (ارجو الرجوع لمحاضراته: www.amrkhaled.net ) اما بالنسبة لقناة اقرأ الفضائية فارجو ان ينظر اليها المسلمون اعلى انها الملاذ الآمن للاسرة من الفساد الاعلامى المنتشر فى كل المكان اللهم الا القليل فيا اخوانى الداعية الاستاذ عمرو خالد و غيره من شباب الدعاة يمثلون بصيص امل للامة فلقد تاثرت شخصيا بفكرة صناع الحياة حتى جعلتنى افكر ان اوجه تفكيرى المستقبلى كاملا نحو نصرة الاسلام و محاولة اعداد جيل جديد من المسلمين الملتزمين فقد منح الله هذا الجيل الجديد من الدعاة القريبين الى فكر الشباب القدرة على توصيل روح الاسلام بطريقة اسرع و ايسر من غيرهم و لابد من تقديم الشكر لقناة اقرا على الدور الذى تقوم به لتوصيل رسالة هؤلاء و مااعظمها رسالة. اما بالنسبة للتعليق المذكور على الاستاذ احمد الفيشاوى فارجو توخى الحذر عند القاء التهم. كما انه لابد من التوقف عن مهاجمة هذا الجيل من الملتزمين لانهم يعكسون ان الاسلام كل يوم ينضم اليه فردا جديدامن الشباب و الشباب هم السواعد التى ستقوم عليها نهضة الامة."
archived = "2004-09-01"
capture_url = "https://web.archive.org/web/20040901174158/http://www.20at.com:80/article.php?sid=189"

