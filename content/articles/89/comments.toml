subject = "مصرى مغترب من الكويت"
text = "بيقولو ان التشكيل الوزارى الجديد<br />هيكون جمال بيه مبارك رئيس الحكومه<br />وعلاء بيه الوزارء كلهم<br />واحنا الشعب طبعا<br />هههههههههههههههه<br />ياريت تعرفونى الموضوع بالظبط لانى فى الكويت ومش عارف حاجه فى اى حاجه"
archived = "2004-06-19"
capture_url = "https://web.archive.org/web/20040619080234/http://www.20at.com:80/article.php?sid=367"
