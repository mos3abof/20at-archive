[[comments]]
order = 3
subject = "كلنا مسلمين"
author = "مى عبدالهادى"
posted = "2005-12-23"
text = "ألم يقل رسولنا الكريم صلَََى الله عليه وسلم أنتم أعلم بأمور دنياكم,فلماذا خلط الأوراق ولماذانقحم الدين فى السياسة ولماذا يتكالب البعض على السلطة تحت شعارات دينية ولماذا نتفرق إلى جماعات وطوائف؟؟؟وهذا يخالف شرع الله الذى قال فى كتابه العزيز \"واعتصموا بحبل الله جميعا ولا تفرقوا\"صدق الله العظيم فكلنا مسلمون فاتقوا الله ولا تفرقوا ففى مصلحة من هذه التفرقة ابعدوا المصالح الشخصية ولاترتكبوا أخطاء فادحة فى حق أنفسكم ودينكم تدفعون ثمنها باهظا عندما يستغل أعداؤكم الحقيقيون هذه التفرقة أفيقوا قبل فوات الأوان و أيقظوا ضمائركم وكلامى هذا لأنى أحبكم فى الله"
