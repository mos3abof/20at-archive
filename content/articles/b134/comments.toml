[[comments]]
order = 4
subject = "الله أكبر و لله الحمد"
author = "إخواني"
posted = "2005-12-24"
text = "الأخت مي، الموضوع الذي طرحتيه يستدعي ردا مطولا ، لكن بإختصار إستشهادك بالحديث في غير محله، أنتم أعلم بشؤون دنياكم يكون صحيحا عند المفاضلة إذما كنت ستتناولين الباذنجان على الغداء أم المهلبية ، لكن عندما يتعلق الأمر بالسماح بقطع الجيش الأمريكي و الصهيوني بالمرور في قناة السويس فإن ديننا الذي تطالبين بإقصاءه عن السياسة أخرج من أعان الكاقر على قتال المسلم من الملة و عد قتاله واجبا و طاعته أو الرضا بقعله مشاركة له في الكفر.<br />لسنا دينا كهنوتيا يعطي ما لله لله و ما لقيصر لقيصر ، بل تحن قومانسلم أمرنا لله في كل شأن و خرجنا من بين الأمم لترغم أنف قيصر... كل قيصر!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152856/http://www.20at.com/article2.php?sid=134"

[[comments]]
order = 5
subject = "الإخوان المفلسون"
author = "مسلم على هدي السلف الصالح"
posted = "2005-12-24"
text = "بسم الله والحمد لله والصلاة والسلام على رحمته المهداه<br />1- قال رسول الله -صلى الله عليه وسلم- : \" ... إن هذه الأمة ستفترق على إحدى وسبعين فرقة كلها في النار إلا واحدة وهي الجماعة\" فالفرقة الناجية بإذن ربها هي \"جماعة أهل السنة والجماعة\" وإن قال الأخوان أنهم منها فلا تصدقوهم فهم ليسوا منها بل هم يحاربون السنة ومن يطبقوها.<br />2- قال الرسول :\"إن العلماء ورثة الأنبياء\" فقد قال العلامة الجليل عبد العزيز بن باز - رحمه الله تعالى- عندما سئل عن جماعتي التبليغ والأخوان : \"نعم، من ضمن الثنتين والسبعين\" وقد قالها قبل وفاته -رحمه الله- بسنتين أو أقل.<br />3- قال العلامة مقبل بن هادي الوادعي -رحمه الله- عن هذه الجماعة وسماها \"الإخوان المفلسون\"<br />4- انظروا في نشأة هذه الجماعة المبتدعة ومؤسسها الصوفي حسن البنا وبدع هذه الجماعة المبتدعة.<br />5- كل من ينتمي إليها لا تتكبر على الله وعلى أقوال العلماء واتقي النار فلن ينفعك منصب ولا جماعة حينها.<br />6- هذا باختصار شديد عن هذه الجماعة وكلام سلفنا الصالح عنها وعن غيرها من الجماعات المبتدعة (والسلف هم كل من ساروا في الطريق المستقيم وانتسبوا إليه وتمسكوا بمنهج نبيهم دون زيادة أو نقصان إبتداءا من الصحابة وحتى يومنا هذا وكل من ابتدع فليس من السلف وإنما من الخلف الذين يبتدعون ويستحدثون في هذا الدين ماليس منه)<br />6- الله المستعان والله من وراء القصد.<br />7- أخوكم في الله السلفي.<br />8- للمزيد حول الموضوع راسلوني على iguhgyu@yahoo.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152856/http://www.20at.com/article2.php?sid=134"

[[comments]]
order = 6
subject = "بن باز مفت لهذا الزمان"
author = "إخواني"
posted = "2005-12-24"
text = "يكقي أنه حين أراد المقبور قهد الأستعانة بالصليبين في الأرض الحرام على العراق أفتى بجواز ذلك!<br />و حين أقام الهالك السادات الصلح مع الصهاينة حرم ذلك ، و حين تم إحتلال الأرض الحرام من قبل الأمريكيين أفتى بوجوب الصلح مع اليهود! و مت يريد قراءة تلك الفتاوى و غيرها مما يندى له الجبين ، فليرجع إلى مجموعة الرجل الكاملة أو إبى موقعه.<br />قال رسول الله صلى الله عليه و سلم :\" أخوف ما أخاف على أمتي : عابد جاهل و عالم فاجر\".<br />و لست أعلم من يملك من صك حرمان أو غفران لتحديد أعضاء الفرقة الناجية من الفرق الهالكة!!!!<br />يا من تزعم إنتماءك إلى السلف قد أعطيتك أمثلة فأضرب لنا نثلا من أفكار الجماعة تدل على محاربتهم السنة.<br />لتوك فد رميت الجماعو بالكفر، و كما تعلم قد باء بها أحدكما!<br />إنى حزين من أجلك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152856/http://www.20at.com/article2.php?sid=134"

[[comments]]
order = 7
subject = "لا أيها الإخواني"
author = "إخواني حقيقي"
posted = "2005-12-25"
text = "معذرة إلى الأخ الذي وصف نفسه بالإخواني، في الحقيقة أنا لست مصدقا أنك من الإخوان، اللهم إلا أن تكون مازلت مبتدءًً.<br />لأننا لم نتعلم هذه اللغة في الحديث عن علماء الأمة مهما اختلفنا معهم، فوصفك لعالم مثل ابن باز بالعالم الجاهل فهذا أمر غاية في التطرف والسوء.<br />يا أخي لا يكون رد الإساءة بالإساءة.<br />نحن لا ندافع عن الإخوان لأننا منهم، وبالتالي كل من يخالفهم ويهاجمهم يكون على خطأ، لا يا أخي توقع أننا نخطئ حتى لا نقع فيما ننقض فيه أمثال ذلك الأخ الذي وصف نفسه بالسلفي.<br />دائما ما نتعلم في الإخوان احترام علماء الأمة، وقبول الرأي الآخر حتى لو تهجم علي.<br />أليس كذلك أيها الإخواني؟<br />في الحقيقة أنا متوجس خيفة أن يكون من كتب تحت اسم سلفي هو نفسه الذي سمى نفسه بالإخواني حتى يوقع العداوة والبغطاء بين المسلمين... والله أعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152856/http://www.20at.com/article2.php?sid=134"

[[comments]]
order = 8
subject = "أتركوها أنها نتنة"
author = "مسلم"
posted = "2005-12-25"
text = "لا حول ولا قوة إلا بالله العلى العظيم ...<br />(( ربنا لا تؤاخذنا أن نسينا أو أخطأنا , ربنا ولا تحمل علينا أصراً كما حملته على الذين من قبلنا ربنا و لا تحملنا ما لا طاقة لنا به و أعفو عنا و أغفر لنا و أرحمنا أنت مولانا فأنصرنا على القوم الكافرين ))<br />أحب أن أوضح الأتى :<br />1- أنا لست سلفى ولا من التبليغ ولا أخوانى ولا صوفى ولا شيعى ولا حنبلى ولا من أى هذه المسميات أعوذ بالله منها ... و هو سمانا المسلمون<br />2- يقتدى السلفيون بائمة محددون و هم يقفون عند الجيل الثالث بعد النبى على ما أتذكر و لا ينتمى لهؤلاء الأئمة العالم الجليل بن باز ولا أى من ذكرهم الأخ السلفى فى مجمل حديثه<br />... أى أن هؤلاء العلماء لسيوا من أئمة السلف و لكنهم ينتهجون نهج السلف الصالح مثلهم مثل الأخوان و الوهابيون و السلفيون و التبليغ و غيرهم من من لم يبتدعوا فى دينهم .<br />3- كيف لأى كان أن يحدد من هى الفرقة الناجية إلا الله عز وجل ... حتى أن كان الأمام أبن باز رحمه الله و هو ما أشك فى أنه قال هذه المقولة ... و لما قالها قبل موته مباشراً ؟!! أنه أمر مريب .<br />4- عباد الله كونوا أخوانا لا تتحاسدوا ولا تتباغضوا و لا يبغض بعضكم بعضا ... الأخوان المسلمون على هدى النبى و سنته فهم مسلمون و هم أخوانى ولا يقول غير ذلك إلا جاهل رغم أنى أختلف معهم فى بعض الأمور ...السلفيون على هدى النبى و سنته فهم مسلمون و هم أخوانى ولا يقول غير ذلك إلا جاهل رغم أنى أختلف معهم فى بعض الأمور ...الوهابيون على هدى النبى و سنته فهم مسلمون و هم أخوانى ولا يقول غير ذلك إلا جاهل رغم أنى أختلف معهم فى بعض الأمور... كل من هو مسلم و كان على هدى النبى و سنته فهم مسلمون و هم أخوانى ولا يقول غير ذلك إلا جاهل رغم أنى أختلف معهم فى بعض الأمور<br />و أهم أختلاف أن أخذ من عالم لأنه سلفى و أخر أحقره لأنه غير ذلك فهذا هو الجهل ... لقد أختلف الأئمة الأربعة و لم يكفر بعضهم بعض فى أمور أكبر بكثير من الأختلافات بين الفرق السابق ذكرها من أخوانى بالأخص<br />الصوفيون أبتدعوا ... نعم ... كافرون ؟ ... الله ربهم و هو أعلم ...الشيعة أبتدعوا ... نعم ... كافرون ؟ ... الله ربهم و هو أعلم ...<br />الله ربنا ... و الرسول أمامنا ... و كل مردود عليه إلا صاحب الرسالة محمد صلوات الله عليه ... أخوانى ... لا تكونوا سلف أو أخوان أو أياً كان ... أنما أنتم مسلمون ... و لن يشفع لك إن أخطأت أن تقول قال لى أبن حنبل هذا ... أو بن باز أو أياً كان ... أنما قال الله و قال الرسول فلا تنتمى إلا للمسلمون ولا تتبع إلا هدى رسول الله ...<br />عن ام المؤمنين أم عبد الله عـائـشة رضي الله عنها ، قالت : قال رسول الله صلي الله صلى الله عليه وسلم (من أحدث في أمرنا هـذا مـا لـيـس مـنه فهـو رد ). رواه الـبـخـاري [ رقم : 2697 ] ، ومسلم<br />عن أبي هريرة عبد الرحمن بن صخر رضي الله عنه ، قال : سمعت رسول الله صلى الله عليه وسلم يقول : ( ما نهيتكم عنه فاجتنبوه ، وما أمرتكم به فأتوا منه ما استطعتم ، فإنما أهلك الذين من قبلكم كثرة مسائلهم واختلافهم على انبيائهم ). رواه البخاري [ رقم : 7288 ] ، ومسلم [ رقم : 1337<br />عن أبي نجـيـج العـرباض بن سارية رضي الله عنه ، قال : وعـظـنا رسول الله صلي الله علية وسلم موعـظة وجلت منها القلوب ، وذرفت منها الدموع ، فـقـلـنا : يا رسول الله ! كأنها موعـظة مودع فـأوصنا ، قال : ( أوصيكم بتقوى الله ، والسمع والطاعة وإن تأمر عليكم عبد ، فإنه من يعــش منكم فسيرى اخـتـلافـا كثيرًا ، فعـليكم بسنتي وسنة الخفاء الراشدين المهديين عـضوا عـليها بالـنـواجـذ ، واياكم ومـحدثات الأمور ، فإن كل بدعة ضلاله ).<br />رواه أبو داود [ رقم : 4607 ] والترمذي [ رقم : 2676 ] وقال : حديث حسن صحيح.<br />عن أبي هريرة رضي الله عنه ، قال : قال رسول الله صلي الله عليه وسلم : ( لا تحاسدوا ، ولا تناجشوا ، ولا تباغضوا ، ولا تدابروا ، ولا يبع بعضكم على بيع بعض ، وكونوا عباد الله إخوانا ، المسلم خو المسلم ، لا يظلمه ولا يخذله ، ولا يكذبه ، ولا يحقره ، التقوى ها هنا ) ويشير صلى الله عليه وسلم إلى صدره ثلاث مرات – ( بحسب امرىء أن يحقر أخاه المسلم ، كل المسلم على المسلم حرام : دمه وماله وعرضه ).<br />رواه مسلم [ رقم : 2564 ]."
archived = "2006-11-02"
