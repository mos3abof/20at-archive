[[comments]]
order = 9
subject = "فر من الحزبيه فرارك من العدوي"
author = "عبده نصحي"
posted = "2005-12-25"
text = "اخي السلفي اخي الاخواني اخي من اسرد حديث تفترق امتي الله يهديكم فروا من الحزبيه فراركم من عدوي المرض ولا تكونوا كمن قال الله فيهم كل حزب بما لديهم فرحون كل منا سيموت وحده ويقبر وحده ويبعث وحده ويسئل وحده وطالما انت مع اخوان لك يعيونك علي الطاعه هذا ليس معناه التحزب والعصبيه لفكر معين الله يهديكم لن ينادي يوم القيامه ايها السلفيون لن ينادي يوم القيامه ايها الاخوان سينادي عليك وحدك وتسئل وحدك فمن ثقلت موازينه فهو في عيشه راضيه واما من خفت موازينه فامه هاويه وما ادرك ما هي نار حاميه المقصود دعكم من التحزب وتذكر ان كل علي ثغر من ثغور الدعوه وربنا يهديني ويهديكم .. عبده نصحي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152856/http://www.20at.com/article2.php?sid=134"

[[comments]]
order = 10
subject = "إتحاد المسلمين فرض"
author = "مسلمة وبس"
posted = "2005-12-26"
text = "السلام عليكم ورحمة الله وبركاته<br />سمعت باذنى واحتفظ برأى الأمام بن باز فى جماعة الأخوان ومن يحب ان يراسلنى فليفعل ورده عن السائل عن جماعة الاخوان انه قال فيها انه لم يقرأ عن منهجهم واتجاهاتهم ولم يعطى اجابه محددة لجماعة الاخوان بالاسم وذكر ان كل جماعه تحيد عن السنه فهىمن الجماعات الهالكه (ولم يخص الاخوان او التبليغ) فلا تفتروا على الرجل الكذب<br />واريد ان اقول انه حين اختلف المسلمون فى احدى القرى المصريه على العدد الافضل لركعات التراويح وكاد الامر يتحول لفتنه منعهم الامام حسن البنا عن ذلك وقال لهم ان التراويح سنه واجتماع المسلمين فرض<br />وقد اوصى نبينا صلى الله عليه وسلم بعدم التنازع والتفرق<br />ولا اقول غير حسبنا الله ونعم الوكيل فيمن يقول اننا نحارب سنة النبى الكريم ولا اقول له الا انه ليس بامانيّّه ولا بامانينا؛؛؛؛كل مسلم عليه ان يجتهد ويعمل مايراه خيرا لدينه ودنياه فى ظل الكتاب والسنه والمصير الافضل علمه عند الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152856/http://www.20at.com/article2.php?sid=134"

[[comments]]
order = 11
subject = "الاخوه في الله اساس صلاح الامه"
author = "محمد الديب"
posted = "2006-05-05"
text = "اخواني في الله جميعا اننا جميعا نعمل لله ولدعوة الله وليس لهوي النفوس وحب الظهور ومن اراد ان يعمل ويكون مخلصا لا يتهجم علي الاخرين بدون دليل وتعلمنا من القران\"يا ايها الذين امنوا ان جائكم فاسق بنبا فتبينوا\"ارجو من اخواننا جميعا الي الرجوع الي رسائل الاستاذ البنا وخاصة رساله التعاليم فهي تشرح بالتفصيل ما يشفي الغليل عن الاخوان المسلمون ودعوتهم ورجاءا من يقراها يحكم عقله وليس هواه والله اني احبكم في الله فكلنل نعمل لدين الله وربنا يتقبل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152856/http://www.20at.com/article2.php?sid=134"

[[comments]]
order = 12
subject = "الاسلام"
author = "خالد رضوان"
posted = "2006-05-13"
text = "انا قرئت كل التعليقات ورئيت ان تعليقين مهمين<br />ان العيب مش فى الشبان ولا فى الجماعه وان العيب فى الحكومه<br />لا مانع ان نكون مسلمون كلنا لا يوجد اخوان ولا شبان نكون مسلمون جميعا والدين لله تعاله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152856/http://www.20at.com/article2.php?sid=134"

[[comments]]
order = 13
subject = "ان انت الا جاهل فهل عرفتهم"
author = "فتاة الاسلام"
posted = "2006-05-20"
text = "الي من كتب انه مسلم علي هدي السلف الصالح هل سمعت ان السلف الصالح قد رمي احد بأنه من اهل النار<br />وانا علي يقين من انك لم تتعامل مع احد من الاخوان المسلمين او تحاورهم فهل عرفت منهجهم او تفكيرهم<br />سامحك الله اقرأ عنهم واعرف من هم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152856/http://www.20at.com/article2.php?sid=134"
