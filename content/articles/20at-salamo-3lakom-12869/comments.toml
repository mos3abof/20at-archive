posted = "2009-08-07"
text = "المشكلة إن الناس بتعتبر إن مجرد ذكر النبي لدى الأجانب إنجاز علمي وديني وبشري<br />لسه كلنا حاسين بالدونية<br />كعرب وكمسلمين<br />يعني إيه نفرح لما نسمع إن النبي اتذكر في نشيد نادي ألماني 70 ألف بيرددوه كل مباراة<br />مش فاهم الناس فرحانة ليه… Read More<br />دول الناس بتسكر في المدرجات وهي بتقوله والنشيد بيقول<br />محمد كان نبي مش بيعرف كرة قدم.. اختار الأزرق والأبيض لأنه لون شالكة<br />على أي أساس نفرح بالكلام ده ونقول إنه اعتراف بالنبوة<br />ياخي يتحرقوا بجاز عنهم ما اعترفوا<br />بس المهم إن اسم النبي ما يتذكرش بالطريقة المهينة دي.. ده لكل مقام مقال"
