[[comments]]
order = 0
subject = "حلو قوي"
author = "مشاعل"
posted = "2006-03-29"
text = "السلام عليكم ورحمة الله وبركاته<br />دعاء مستجاب بعون الله، ان شاء الله ربنا يجعل كيدهم في نحورهم.<br />اللهم نسلك خير هذا الدعاء، اللهم وفتت شملهم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145236/http://www.20at.com/article2.php?sid=634"

[[comments]]
order = 1
subject = "مسلمه"
author = "يارب تقبل دعائنا"
posted = "2006-03-29"
text = "اللهم عليك بكل من سب نبيك الكريم  ,اللهم عليك بكل من عادا الاسلام والمسلمين<br />اللهم من اراد الاسلام والمسلمين بكيد فاكده اللهم اجعل كيدهم فى نحرهم اللهم ادر الدائرة عليهم<br />اللهم ردنا الى دينك مردا جميلا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145236/http://www.20at.com/article2.php?sid=634"

[[comments]]
order = 2
subject = "صبرا أقصانا فالليل ينجلى و يبزغ فجراً جديد"
author = "مناضل أنترنتى قديم"
posted = "2006-03-29"
text = "السلام عليكم ورحمة الله و بركاته<br />لك الحق أقصانا أن تغرد وحدك فى السرب حزينا فلقد هنّا على أنفسنا وهنّا على كل الناس<br />أما أنت يا أقصانا فلك الله وحده و دعاء المخلصين و أنتظر صلاح الدين فلقد ولد و لقد رأيته بأم عينى<br />و انتم أيها المسلمين فلإن خلص إلى الأقصى فأأأأأأأأأأأأأأأأأاه أين ستفرون أين ستختبئون<br />وإليكم جيش صهيون و جند أبليس أجمعون أعلموا أن جند الله هم الغالبون و أن حزب الله هم الغالبون<br />وجيش النصر قد و لد و لا يغرنكم طول الأمل و حلم رب العالمين عليكم و لا يغرنكم ضعف المسلمين فجيش النصر قد ولد<br />اللهم أرزقنى شهادةً على أعتاب الأقصى أو صلاةً أمنةً مطمئنةً فى رحابه بعد تحريره بالكمال... اللهم أميييييييييييييييييييييييين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145236/http://www.20at.com/article2.php?sid=634"

[[comments]]
order = 3
subject = "انا أدعو وهو يعمل"
author = "ظهير"
posted = "2006-03-31"
text = "لن يفيدني دعائي ما لم أعمل لتحقيق هدفي وكل ما لا يؤذي غيري فهو حلال الا من اغتصب حقوقي وحياة شعبي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145236/http://www.20at.com/article2.php?sid=634"

