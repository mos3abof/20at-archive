subject = "حقأ انها الفجالة"
author = "قد زرت الفجالة كثيراً اثناء الدراسة وكما هى مليئة بكل شى لكن كما هو مكتوب اصبح هناك تحول الى تجارة الادوات الصحية ومع الوقت قد تختفى تجارة الكتب منهامثلما اختفت الكتب من سوق الازبكية القديم."
text = "فلابد من المحافظة على تلك المناطق التى تعتبر جزاءً مهما من تاريخ القاهرة.<br />وربنا يعين الاباء والامهات والابناء على الكفاح والجهاد فى السنة الدراسية 2005/2006.<br />والسلام عليكم"
archived = "2006-11-02"
