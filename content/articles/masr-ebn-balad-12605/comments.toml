author = "معجبة جدا بحسين"
posted = "2009-07-10"
text = "ربنا يباركلك هواية جميلة وفكر اجمل ان شاء الله تحقق ما تتمنى ياحسين<br />جميل ان اولادنا يعملوا فى الصيف كهواية ومع ذلك لديهم هدف يريدون تحقيقه<br />موفق ان شاء اله"
archived = "2009-07-11"
