[[comments]]
order = 1
subject = ""
author = "pupa"
posted = "2009-08-05"
text = "ربنا يبارك فيك ويبارك لك يا حسين<br />وعلى فكرة فى ولاد كتير افى اسكندرية كدا<br />انا السنة الى فاتت كنت فى اسكنرية وكنت صباحا كل يوم من الساعة 6 ل12 بعد عند بير مسعود عند الصخور الى فى نص المية دى وفعلا كنت بلاقى كل يوم ولدين بيجوا ويعدوا يجمعوا الصدف دا من وسط الصخور بس مكنتش عارفة صراحة بيعلموا بيها اية<br />وللاسف كنت بعد اجمعها زيهم كدا ومكنتش اعرف بيعلموا بيها اية وكنت بعلب بيها وبعدين ارميها<br />مش هاخدهخا تاني يا حسين وهسيبها ليك ولاحصابك انتوا اولى بييها"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105144723/http://20at.com/masr/profile/12605-2009-07-09-10-34-36.html"
