[[comments]]
order = 1
subject = "اللهم أشكو إليك"
author = "اللهم أشكو إليك ضعف قوتي وقلة حيلتي"
posted = "2006-06-05"
text = "وهواني على الناس، يا رب العالمين، أنت<br />رب المستضعفين وأنت ربي، إلى من تكلني يا<br />رب، إلى بعيد يتجهمني أم إلى قريب ملكته<br />أمري، إن لم يكن بك على غضب فلا أبالي،<br />ولكن رحمتك هي أوسع لي، أعوذ بنور وجهك<br />الذي أشرقت له الظلمات، وصلح عليه أمر<br />الدنيا والآخرة، من أن تنزل بي غضبك، أو<br />تحل عليّ سخطك، لك العتبى حتى ترضى، ولا<br />حول ولا قوة إلا بك\"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124415/http://www.20at.com/article2.php?sid=900"

