author = "عاشق منتخب الساجدين"
posted = "2009-11-12"
text = "ان شاء الله مش صعب ولا ومستحيل وبكره تقولو احمد قال بأذن الله هيكون يوم عالمى والعالم كله هيفتكره وبعدين انتو ناسن الخمسه ولا ايه بجد ان شاء الله ربنا هيكرم منتخب الساجدين"
