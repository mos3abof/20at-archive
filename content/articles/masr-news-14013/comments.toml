subject = ""
author = "سارة"
posted = "2009-11-12"
text = "السلام عليكم و رحمة الله و بركاته أولا أقول أنا الجزائر هي بلد قوي و حتتأهل إن شاء الله و دومااا يارب …إحنا مسلمين و كلنا عرب بس يا خسارا للمصر إلي شعبها معظمهم يهودين و مسحيين …ربنا دوماا بيحب مسلمين و دوما مهعم مههما كانت ظروف …الجزائر رابحة و الله أكبر…و الله صلي على محمد صلى الله و عليه و سلم"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121530/http://www.20at.com:80/masr/news/14013-2009-11-12-07-25-39.html"

