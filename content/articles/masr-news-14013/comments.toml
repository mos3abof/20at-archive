author = "رد على ساره"
posted = "2009-11-12"
text = "المعلقة السابقة سارا<br />انتي بتقولي ان شعب مصر معظمه يهود ومسيحيين<br />الله يخرب بيت امك يا شيخه<br />مصر نسبة المسلمين السنه فيها 94%<br />ويارب هما الاثنين يخسروا المباراه<br />جتك البله غبيه"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121530/http://www.20at.com:80/masr/news/14013-2009-11-12-07-25-39.html"

