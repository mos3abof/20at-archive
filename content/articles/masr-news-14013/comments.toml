text = "صعب جدا ان مصر تجيب 3 اجوال فى الجزائر<br />لو كان جول واحد كان يبقى ماشى انما تحقيق 3 اجوال فصعبة شوية لان الجزائر هتستميت فى الدفاع<br />على العموم العملية هتبقى ضربة حظ"
