[[comments]]
order = 1
subject = "ما شاء الله"
author = "السلام عليكم ورحمة الله وبركاته"
posted = "2006-10-07"
text = "ما شاء الله و سبحان الله كل هذه فوائد صحية فقط للصيام ولو أضفنا اليها مضاعفة الأجر وغيرها من النفحات الإيمانيه في رمضات<br />انه شهر كريم من رب العالمين حقا<br />أدعوا الله لكاتب هذا المقال بمزيد من التوفبق وهل من الممكن أن أتعرف على نشاط المنتديات أم هي مقالات فقط<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112637/http://www.20at.com/article2.php?sid=1277"

[[comments]]
order = 2
subject = "اكتر من ممتاز"
author = "جامد جدا وجيه في وقته في رمضان"
posted = "2006-10-07"
text = "جزاك الله خيرا وارجوا الاستفسار عن انشطه المنتديات ديه بتعمل ايه ولا مجرد مقلات علي النت ولا ايه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112637/http://www.20at.com/article2.php?sid=1277"

