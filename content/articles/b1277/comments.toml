subject = "نريدكم معنا على طول"
author = "شيماء سامى المؤذن"
posted = "2006-10-12"
text = "السلام عليكم ورحمة الله وبركاته<br />ربنا يبارك فيكم جميعا وياريت تكملوا معنا حتى بعد رمضان<br />وفقكم الله إلى ما فيه خير أنفسكم وخير الناس"
