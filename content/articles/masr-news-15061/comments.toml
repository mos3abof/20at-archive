author = "ليه يا برادعي"
posted = "2010-01-27"
text = "ليه يا برادعي مش عايز تكون رئيس<br />دي حلوه اوي يا برادعي<br />تخيل لما الخزنة تبقى تحت ايدك تسحب منها زي ما انت عايز<br />وقوات امن شرطة وجيش رهن اشارة سعادتك<br />وكله بيتمنالك الرضا<br />رشح نفسك يا برادعي يمكن تضرب معاك يا حبيبي<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130012541/http://www.20at.com:80/masr/news/15061-2010-01-26-15-48-37.html"
