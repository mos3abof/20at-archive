author = "ومن سيسمح لك"
posted = "2010-01-26"
text = "تبقى رئيس ازاى<br />والاستاذ جمال هيروح فين<br />وبعدين الفقى مستشار القصر السابق قال ان امريكا واسرائيل اختارت خلاص<br />وطبعا مش انتى<br />خليك فى بيتك جنوب فرنسا وعش لك يومين - لغاية ما ربنا يجيب الفرج من عندة"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130012541/http://www.20at.com:80/masr/news/15061-2010-01-26-15-48-37.html"

