[[comments]]
order = 4
subject = "الإنصاف ... حرام عليكم"
author = "islam_physics@yahoo.com"
posted = "2006-04-29"
text = "السلام عليكم ورحمة الله وبركاته<br />أولا أنا مصري بس يا شباب بالله عليكم ليه كل حاجة السعودية السعودية لازم ديما نركز عليها ومنبصش إلا في عيوبها مفيش مقال كتبه حد من عشرينيات يقول حاجة كويسة عن السعودية أيه في إيه إنتو نسيتوا إنها بلد البيت الحرام بلد الرسول وأحبها إلى قلبه بلاد دعى لها سيدنا إبراهيم نسيتوا إنها بلاد تطبق الشريعة الإسلامية واللي ينكر الكلام ده يبقى فعلا مش منصف في حكمه.<br />يعنى طيب لو هنقول أخطاء نبص بقى في كل الدول العربية المسلمة ونقول عن كل الدول مثلا ليه تخصيص للسعودية واتهام للسعودية مش شايفيين إن ده كتير أوي ايه هي باقي الدول الحمد لله العدل والنظام والرخاء والدين وبقى فيها صحابة والسعودية هيا اللي مليانة لسه بأبو جهل وأمثاله إيه ومفيهاش يا عيني أي حاجة كويسة نكتب عنها أنا مش بتكلم لأني بحب السعودية بس - والنبي بردوا كان يحبها- ده كمان شوفوا كام موضوع اتكتب في الموقع عن السعودية مثل الفتاوى في السعودية حسب الطلب، في السعودية أذنب وأعتمر، والموضوع ده وغيرهم وشوفوا وأحكموا ليه بقى كل ده.<br />أنا مش هقول دي بقى بلد الصحابة بس كل البلاد فيها اللي مكفيها ولازم نقول اللي لينا واللي علينا ولا بس نقعد نقطع في صورتها قدام العالم هو إحنا مش عرب ومسلمين زي بعض.<br />ثم في الموضوع ده طيب ماهو في مصر مثلا لأني مصر وفعلا الموضوع ده منتشر جدا وبعدين حتى لو كان كدة مش ربنا بيقول \"يجيب المضطر إذا دعاه\" طيب دول لما اضطروا لجأوا إلى الله أحسن ملي لما بيتزنقوا بيروحوا الملاهي اليلية ويروحوا الكازينوهات والحتت دي وانتوا عارفين<br />يعني حتى هي حاجة كويسة فيهم علشان معناها انهم عارفين أنهم ليهم رب لما يتزنقوا يدعوه وبيرتاحوا لما يعملوا العمرة والحج والصلاة مش زي ناس تانية<br />واللي مستغربله ان كاتب المقال من السعودية طيب ليه كل الكلام ده عنها صحيح أهل مكة أدرى بشعابها بس يعني مش لاقي حاجة كويسة تكتب عنها في السعودي بلدك وبلد نبيك مش لاقي خالص وعمال تكتب بس في الحاجات اللي تشوه صورة بلدك وصورة العرب وصورة المسلمين.<br />ياريت تتقوا الله في كلاماتك فكلنا مسئول عما يقول<br />أخوكم إسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123521/http://www.20at.com/article2.php?sid=316"

