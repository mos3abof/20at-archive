subject = ""
author = "غاضبة"
posted = "2009-08-06"
text = "اذا اما ان نكون صادقين ونحل مشاكلنا<br />واما ان نلتزم الصمت يكفي ان ندعي اننا الافضل<br />ولنشعر بالخزي من انفسنا ولا نمدحها بعد ذلك قط بل نصفها بالبشاعة التي هي فيها<br />اللعنة على كل الحكومات التي تقصر وبيدها ان لا تقصر"
archived = "2009-08-08"
capture_url = "https://web.archive.org/web/20090808223729/http://www.20at.com:80/masr/2khbar/12860-2009-08-06-05-52-48.html"
