[[comments]]
order = 2
subject = ""
author = "يحترمونا ازاى"
posted = "2009-08-06"
text = "ازاى الدول التانية لما يشوفوا الصور دى يحترمونا<br />لما يشوفوا اطفالنا بتشرب من المجارىيبقى لية العرب ماتفش علينا والغرب يضربنا بالجزمة<br />احنا بقينا مهزئين<br />وشعب مالوش كرامة<br />اقسم باللة العظيم لو شارون كان بيحكم مصر او رومر بتاع العراق مكناش وصلنا للخراب دة"
archived = "2009-08-08"
capture_url = "https://web.archive.org/web/20090808223729/http://www.20at.com:80/masr/2khbar/12860-2009-08-06-05-52-48.html"

[[comments]]
order = 3
subject = ""
author = "تيفوئيد"
posted = "2009-08-06"
text = "بعد انتشار التيفوئيد فى الغربية والشرقية والقليوبية صرح مصدر رفيع وتخين على اعلى واوطى مستوى اننا حولنا البلد الى اكبر مقلب زبالة فى الشرق الاوسط وافريقيا<br />وكالعادة مسؤول كبير يروح يفتتح طرمبة مية ملوثة ويطلع تصريح يقول فى الجرايد اكبر طلمبة فى الشرق الاوسط وافريقيا حيث تنفرد بانها تسحب من مياة المجارى الى البيوت مباشرة"
archived = "2009-08-08"
capture_url = "https://web.archive.org/web/20090808223729/http://www.20at.com:80/masr/2khbar/12860-2009-08-06-05-52-48.html"

[[comments]]
order = 4
subject = ""
author = "40 مليار قروض"
posted = "2009-08-06"
text = "فى فترة الحكم الحالى بلغت القروض من دول الخارج 40 مليار دولار<br />وكلما تسال<br />يجيب المسئولين بنينا بها البنية الاساسية<br />30 سنة ونحن نبنى البنية الاساسية وصرفنا فيها المليارات من القروض<br />والنتيجة كما ترون<br />ولاد الكلب الزبالة اللى خربوا البلدوكل همهم فتح وحماس والعسكرى شاليط ومؤتمرات فى طيز مؤتمرات فى الشرم"
archived = "2009-08-08"
capture_url = "https://web.archive.org/web/20090808223729/http://www.20at.com:80/masr/2khbar/12860-2009-08-06-05-52-48.html"

[[comments]]
order = 5
subject = ""
author = "وسيادة اللواء اركان"
posted = "2009-08-06"
text = "وسيادة اللواء اركان حرب المحافظ عمل اية لما شاف الصورة ؟<br />جمع اركان حرب حرب المحافظة وطلع بيان قال فية ان مياة الصرف الصحى نقية جدا وعلى حسب المواصفات العالمية وان الشرب منها مباح وحلال<br />والا قعد فى المكتب المكيف بتاع اللى جابوة وقال خلوهم يروحوا فى ستين داهية<br />انتم شفتم فية احد سال احد من المسئولين فى البلد دى وقال لة بتعمل اية<br />دى عزبة يا ابا<br />وكل واحد بيلهط فيها بمزاجة والفقير ينضرب على راس امة<br />لو فية رئيس وزراء مسئول كان شاف الصورة واتصل بالمحافظ وقال لة ما تجيش بكرة وابقى اقعد عند امك"
archived = "2009-08-08"
capture_url = "https://web.archive.org/web/20090808223729/http://www.20at.com:80/masr/2khbar/12860-2009-08-06-05-52-48.html"

[[comments]]
