posted = "2009-08-06"
text = "دي حكومة تعبانة اساساً<br />المجاري ضاربة في كل حتة<br />و الشوارع مكسرة<br />والزبالة مرمية في الشوارع<br />وتقولولي حكومة"
archived = "2009-08-08"
capture_url = "https://web.archive.org/web/20090808223729/http://www.20at.com:80/masr/2khbar/12860-2009-08-06-05-52-48.html"

[[comments]]
