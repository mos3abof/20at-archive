order = 0
subject = ""
author = "تحذير من القطارات"
posted = "2009-09-19"
text = "احذر اى بنت او امراة من ركوب القطارات<br />فقد شاهدت فى محطة قطارات طنطا فتاة محجبة ترتدى بنطلون جينز تصعد الى القطار من على الرصيف فمد احد الاندال او الاوباش يدة بين فخذيها من الخلف وعندما صرخت قال انا كنت با اسندك وانت هتقعى<br />ولم يعترض احد من الركاب او يتكلم<br />وعندما ناقشت الموضوع مع بعض الناس قال لى ان كل الفتيات والسيدات يتجنبن ركوب القطارات لانتشار البلطجة والسرقة عاشت مصر بلد الاستقرار والامان"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108191421/http://www.20at.com:80/masr/hot-topics/13497-2009-09-19-11-47-49.html"

[[comments]]
order = 1
subject = ""
author = "جيمي"
posted = "2009-09-19"
text = "طب بالذمة ده كلام<br />نعيد إزاى أحنا بقى دلوقتي<br />مهو يا توفرولنا التحرش يا توفرولنا الكلة<br />كل سنة وانتم طيبين يا عشريناتية وجعله الله في ميزان حسناتكم وتقبل منكم"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108191421/http://www.20at.com:80/masr/hot-topics/13497-2009-09-19-11-47-49.html"

[[comments]]
order = 2
subject = ""
author = "فعليه بالصيام"
posted = "2009-09-20"
text = "قال رسول الله صلى الله عليه وسلم يا معشر الشباب من استطاع منكم الباءة فليتزوج فإنه أغض للبصر وأحصن للفرج ومن لم يستطع فعليه بالصوم فإنه له وجاء)."
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108191421/http://www.20at.com:80/masr/hot-topics/13497-2009-09-19-11-47-49.html"

[[comments]]
order = 3
subject = ""
author = "اترضاه لامك"
posted = "2009-09-20"
text = "أترضاه لأمك؟!!<br />عن أبى أمامة (رضى الله عنه) قال: إن فتىً شاباً أتى النبى (صلى الله عليه وسلم) فقال: يا رسول الله ائذن لى فى الزنا ، فأقبل القوم فزجروه ، وقالوا: مه مه (*)!<br />فقال له: \"ادنه\" – أى اقترب منى – ، فدنا منه قريبا ،<br />قال: أتحبه لأمك؟ قال: لا والله ، جعلنى الله فداءك.<br />قال: \"ولا الناس يحبونه لأمهاتهم\".<br />قال: أفتحبه لابنتك؟ قال: \"لا والله يا رسول الله ، جعلنى الله فداءك\".<br />قال: \"ولا الناس يحبونه لبناتهم\"."
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108191421/http://www.20at.com:80/masr/hot-topics/13497-2009-09-19-11-47-49.html"

[[comments]]
order = 4
subject = ""
author = "وَلا تَبَرَّجْنَ"
posted = "2009-09-20"
text = "وأما قوله تعالى: وَلا تَبَرَّجْنَ تَبَرُّجَ الْجَاهِلِيَّةِ الْأُولَى [الأحزاب: 33] فمعناه: لا تظهرن زينتكن مثل فعل الجاهلية الأولى، فقد نقل ابن كثير أقوال العلماء في تفسير ت رج الجاهلية الأولى، فقال: قال مجاهد: كانت المرأة تخرج تمشي بين الرجال، فذلك تبرج الجاهلية.<br />وقال قتادة: وَلا تَبَرَّجْنَ تَبَرُّجَ الْجَاهِلِيَّةِ الْأُولَى [الأحزاب: 33] يقول إذا خرجتن من بيوتكن، وكانت لهن مشية وتكسر وتغنج فنهى الله عن ذلك.<br />وقال مقاتل بن حيان: التبرج أنها تلقي الخمار على رأسها ولا تشده فيواري قلائدها وقرطها وعنقها، ويبدو ذلك كله منها .<br />والله أعلم"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108191421/http://www.20at.com:80/masr/hot-topics/13497-2009-09-19-11-47-49.html"

[[comments]]
order = 5
subject = ""
author = "وقرن في بيوتكن"
posted = "2009-09-20"
text = "قال ابن كثير في تفسيره: هذه آداب أمر الله بها نساء النبي صلى الله عليه وسلم، ونساء الأمة تبع لهن في ذلك.<br />وقد جاءت هذه الآية ضمن مجموعة من الآيات نزلت في تخيير النبي صلى الله عليه وسلم أزواجه، فلما اخترنه أدبهن بهذه الآداب الكريمة الرفيعة، فقال: وَقَرْنَ فِي بُيُوتِكُنَّ [الأحزاب: 33] أي الْزَمْنَ بيوتكن، فلا تخرجن لغير حاجة، فيجوز لهن الخروج للصلاة في المسجد بشرط الحجاب وعدم التعطر، كما في الحديث: لا تمنعوا إماء الله مساجد الله، وليخرجن تفلات . رواه أحمد وصححه الأرناؤوط .<br />وفي صحيح البخاري أن النبي صلى الله عليه وسلم قال لسودة: قد أذن الله لكن أن تخرجن لحوائجكن ."
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108191421/http://www.20at.com:80/masr/hot-topics/13497-2009-09-19-11-47-49.html"

