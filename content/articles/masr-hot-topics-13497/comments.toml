text = "الأخ بتاع مشكلة التحرش و الى بيستشهد بالاية \" وقرن في بيوتكم\"<br />قبل ما تتكلم اعرف بالظبط الاية نزلت ليه وامتى وفين وكان الوقت ده فيه ايه"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108191421/http://www.20at.com:80/masr/hot-topics/13497-2009-09-19-11-47-49.html"

[[comments]]
order = 7
subject = ""
author = "مشكلة التحرش"
posted = "2009-09-20"
text = "هما كلمتين لا ثالث لهما<br />النساء تجلس في البيت تنفيذا لقول الله تعالى وقرن في بيوتكن<br />او<br />تتحمل كل اللي يجرالها يتحرشوا بيها يغتصبوها يخطفوها<br />على مسؤليتها الشخصية<br />لان ثورة 23 يوليو اعلنت القضاء على الاقطاع والزواج في مصر<br />يا خسارة يا مصر<br />عزك ومجدك راح مع كلاب الثورة"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108191421/http://www.20at.com:80/masr/hot-topics/13497-2009-09-19-11-47-49.html"

[[comments]]
order = 8
subject = ""
author = "ابومحسن غربة 28 سنه"
posted = "2009-09-21"
text = "الى الاخ المعلق رقم 10<br />الاحوان التي تعيشها مصر الان كان يعيشها اهل الجزيرة العربية قبل البعثة المحمدية<br />كانوا عرب همج القوي ياكل الضعيف ويقطعون الطرق ويسبون النساء الى اخره<br />فبعث الله سبحانه وتعلى خاتم الانبياء المرسلين صلى الله عليه وسلم فمكث معهم 23 سنه علمهم المنهج الرباني<br />وبعد ان انتهت مهنة النبي وفي اقل من 100 سنه كانت الدولة من اسبانيا الى الهند<br />فيا عزيزي المعلق رقم 10 لا ياس مع الحياه ادعي لتطبيق منهج النبي بمفهوم اهل السنه والجماعة وليس بمفهوم الخوارج<br />واول ناس حتتبهك البلطجية دول<br />الصحابي ابو ذر الغفاري كان من قبيلة قطاعين طرق وامن بالنبي محمد صلى الله عليه وسلم وقابل النبي ثم ذهب الى قبيلته وبعد فترة من الزمن قبيلته قطاعين الطرق كلها جاءت لتبايع النبي محمد صلى الله عليه وسلم"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108191421/http://www.20at.com:80/masr/hot-topics/13497-2009-09-19-11-47-49.html"

[[comments]]
order = 9
subject = ""
author = "الزحام ثم الزحام"
posted = "2009-09-21"
text = "زيادة تكدس السكان فى منطقة محدودة زيادة كبيرة بتعمل عدوانية شديدة جدا<br />بمعنى انك لو حبست 5 دجاجات فى قفص هيبقى سلوكهم عادى<br />انما لو حبست عشرين دجاجة فى نفس القفص هتزداد العدوانية وهينقروا فى بعض وينتفوا ريش بعض<br />المشكلة فى الكثافة السكانية<br />مطلوب تفريغ التجمعات السكنية الى قرى ومدن جديدة فى الصحراء ذات كثافة سكانية قليلة<br />اذن مشاكلنا كلها من الزحام<br />لان كل شىء عشوائى"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108191421/http://www.20at.com:80/masr/hot-topics/13497-2009-09-19-11-47-49.html"

[[comments]]
order = 10
subject = ""
author = "مسخرة"
posted = "2009-09-21"
text = "عدت الى مصر بعد غربة 30 سنة<br />الاخلاق اصبحت زبالة<br />والتحرش بالبنات حتى من الرجال اصحاب الجلاليب فى الميكروباصات ووسائل المواصلات اصبحت حاجة عادية<br />وانعدم الحياء<br />وانتشرت السفالة وطول اللسان<br />والبلطجة وشلل البلطجية الماجورين الذين يهاجمون اى بيت او مكان ويستاجرهم البعض لتصفية الحسابات<br />مصر بقت حاجة تانية<br />وانعدمت الشهامة<br />ربما لضعف المقررات الدينية او الغائها بسبب محاربة التطرف فانهارت الاخلاق"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108191421/http://www.20at.com:80/masr/hot-topics/13497-2009-09-19-11-47-49.html"
