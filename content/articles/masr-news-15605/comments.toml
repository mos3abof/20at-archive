[[comments]]
order = 10
subject = ""
author = "اخيرا عيان"
posted = "2010-03-06"
text = "دى رئيس تحرير جريدة الدستور قال قبل كدة انة عيان وحبسوة لانة ازاى يقول انة عيان وهو حسنى بيمرض ! حاشا للة<br />دلوقتى الاعلام الحكومى هو اللى بيقول عيان<br />ورايح يشيل المرارة فى المانيا<br />دى واسعة قوى<br />رايح يشد وشة ويصبغ شعرة وياخد حقن السيلكون تحت الجلد قبل القمة العربية علشان يظهر فى نيولوك او ابو الشباب<br />او بيستدر عطف الناس بعد رجوع البرادعى وانة غلبان عيان مسكين<br />على العموم اول الغيث قطرة<br />ولو حقيقى<br />دة هنا فى مصر بيشيلوا المرارة فى تاكسى مش فى المانيا<br />ربنا يحسن خاتمتة<br />ويا ريت احد ينطقة الشهادتين"
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307073351/http://www.20at.com:80/masr/news/15605-2010-03-04-21-26-38.html"

[[comments]]
order = 11
subject = ""
author = "للنطع السابق"
posted = "2010-03-06"
text = "كما تكونوا يولى عليكم<br />دة كلام مين<br />واحد جاهل مروج لسلاطين الفساد<br />الذى يزرع الفساد والقهر والذل هو الحاكم فى شعب والذى يأتى باللصوص والحرامية والاعلام الهابط ليفسد اخلاق الشعب هو الحاكم الفاسد العميل<br />الذى يوالى الاعداء ويحارب المجاهدين ويساعد اليهود ضد المسلمين هو الحاكم<br />العرب قبل النبى كانوا متناحرين ومتقاتلين وكلهم فساد والنبى اتى كقائد وارتقى بهم ولم يذلهم ويقهرهم ويقول لهم كما تكونوا يولى عليكم<br />للكلاب اولاد الكلاب المتنطعين بالدين والذيسن يتكلمون فى احاديث يهودية مدسوسة على الاسلام ان يبعدوا الدين عن السياسة<br />لانهم جهلة<br />فى الدين الخروج على الحاكم الظالم بالسيف مشروع<br />فى الدين تولية الاخيار وابعاد الاشرار من على كراسى الحكم موجود<br />على الانطاع ان يسكتوا<br />وعلى الفاسد ان يخرج من البلد"
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307073351/http://www.20at.com:80/masr/news/15605-2010-03-04-21-26-38.html"

[[comments]]
order = 12
subject = ""
author = "كيفما تكونو"
posted = "2010-03-06"
text = "القاعدة بتقول<br />كيفما تكونو يولى عليكم<br />اي حاجه بيعملها حسني مبارك هي موجوده في الشعب<br />حسني مبارك حرامي يبقى الشعب حرامي<br />وهكذا<br />لا يغير الله ما بقوم حتى يغيروا ما بأنفسهم<br />غير نفسك يا شعب<br />سلام يا شعب"
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307073351/http://www.20at.com:80/masr/news/15605-2010-03-04-21-26-38.html"

[[comments]]
order = 13
subject = ""
author = "خنزيييييييييييييير"
posted = "2010-03-06"
text = "بياكل زباله وبيلم في بطنه نار…واحنا نستاهله لان كما تولو يولا عليكم..مش شاطرين غير في الكلام..خليكو كده اتكلمو …وردو علي بعض..انا متاكده ان ولا واحد ولا واحده من اللي اتكلمو طلع في مظاهره ..ولا دخل معتقل ..وشاف يعني ايه الم وحرقه قلب علي راي وصوت مش مسموع ..ولما بقول مش مسموع مابقصدش الحكومه لا دا انا اقصد ان حتي اللي زيكو بردو مابيسمعوش صرخه واحد اتعذب في معتقل واتبهدل اهل بيته وضاع مستقبله عشان واحد مواطنه بتقول اهو اللي نعرفه احسن من اللي منعرفوش طب خليكي بقي في اللي تعرفيه عشان واضح انك تستهليه…وكمان مش عشان بقول بلاش خنزير فمعني كده اني موافقه علي الي حد تاني..لا بس لما يحصل تغيير وبرده مايعجبكش يبقي انت موجود وليك راي وممكن تغيير تاني لحد مايجي اللي تستاهله بجد وتحس انه معتبرك انسان مش كلب او كلبه وبيرميك الوساخه بتاعته …انتو فاهمين عشان انتو مش شاطريين غير في انكو تفهمو وبس"
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307073351/http://www.20at.com:80/masr/news/15605-2010-03-04-21-26-38.html"

