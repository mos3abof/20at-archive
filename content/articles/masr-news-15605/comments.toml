subject = ""
author = "عزرائيل"
posted = "2010-03-05"
text = "عزرائيل يظهر فى خيالى كتير اليومين دول<br />والعملية كبيرة<br />والنهاية باللغة الانجليزية تعنى end<br />والانتخابات فى علم الغيب ويا عالم مين اللى هيبقى موجود ومين اللى القبر هيلمة<br />والمجرمين لا بد ان يتعذبوا فى الدنيا قبل الاخرة ولا بد ان يزرع اللة الرعب والخوف فى قلوبهم قبل ان يقبض عزرائيل ارواحهم<br />كم ام دعت عليهم وهم يقبضون على ابنها فى الفجر ويهتكون حرمة البيوت والامهات والبنات<br />اقترب وقت حساب الواحد القهار<br />ولسوف يؤخذ المجرمون بالنواصى والاقدام<br />ويا رب يكون سرطان يفرى كبدة"
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307073351/http://www.20at.com:80/masr/news/15605-2010-03-04-21-26-38.html"

[[comments]]
