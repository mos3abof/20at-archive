author = "حبيب العادلي"
posted = "2010-03-05"
text = "يا جماعة انا اللي حعمل الانتخابات<br />وانا اللي حشرف عليها<br />وانا اللي حصدر النتيجة<br />يعني انا الكل في الكل<br />وانا حأقولكم على النتيجة من دلوقتي<br />حل حزب حيكسب 1% والبرادعي معلش حيكسب ال 5% اللي اخدهم ايمن نور المرة اللي فاتت<br />والريس حيكسب بقية الاصوات<br />يبقى تاعبين نفسكم ليه"
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307073351/http://www.20at.com:80/masr/news/15605-2010-03-04-21-26-38.html"

