[[comments]]
order = 5
subject = "يجوزان تكون في العالم العربي اجمل من ديلار هده"
author = "محمود مصري"
posted = "2006-01-23"
text = "الجمال جمال داخلي ولو عيزين اخوانا بروسيا يعرفو الغربين بالدين الاسلمي لزم منهم يسلكو طرق اخرى مثلا في اوساط الشباب مش الحرمة الي مكتوب عليها الا تطهر نفسها للاخرين نعم منكر انها جميلة لكن هناك من هي اجمل منها تصون نفسها ولاتطهره على القنوات التلفازية لتشتري بجمالها ثمنن قليلا فين هو الاسلام ياعالم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141530/http://www.20at.com/article2.php?sid=308"

[[comments]]
order = 6
subject = "أحلى من الشرف مفيش"
author = "أكرم بس"
posted = "2006-01-23"
text = "أنا رأيي ان فكرة التقليد في كله حاجة مش اللي هي ( يعني مش عاجباني )<br />أنا رأيي ان يكون في بديل إسلامي أو محافظ بأسلوب مفيهوش تقليد فيه ابداع اكتر<br />يعني انا لما بطلت اسمع اغاني مليت فراغ الاغاني بالقران<br />فبدل عمرو دياب مشاري راشد<br />و بدل محمد فؤاد الشيخ جبريل<br />أما انهم يعملوا كليب عريان نعمل كليب اسلامي و يعملوا ستار اكاديمي نعمل عبد الحميد اكاديمي فده انا برفضه<br />احنا لازم نطرح بديل حيوي بجد مش تقليد<br />و في الختام اشكر ماما و بابا و عمو محمد بالسعودية و طنط الهام في الامارات و خالوا علي في تترستان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141530/http://www.20at.com/article2.php?sid=308"

