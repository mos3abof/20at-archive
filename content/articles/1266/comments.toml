[[comments]]
order = 8
subject = "يا ردالة العالم اتحدوا"
author = "مصــegyــري"
posted = "2006-01-24"
text = "بمناسبة اول تعليق في الموضوع ده<br />(خيلوا رغم مشاكل البنات في مصر لسه كتير من البنات مطلعة عين الاولاد من الامور المادية الي اللوع وخلافه وكله بالاحترام ولا تعرف تاخد معاهم حق ولا باطل. انا شخصا بعد ما طلع روحي من كده قررت الاتجاه شمال واخد واحده من نوعيةديلارا..علشان ما حدش يفهمني غلط المسلمات بتوع روسيا وتترستان اادب ناس ومخلصات جدا والراجل المسلم عندهن مقدس. الي كل طلعان روحه اهديه هذا الموقع اللي عن طريقه يقدر يرتبط بواحدة فيهم بس امانة يتق الله فيها www.ru4arab.ru ويدخل على صفحة المسلمات الروسيات )<br />فكرني ايام كوسوفو<br />كان اللاجئين من كوسوفوا بيجو مصر و بيتولى المشايخ تزويجهم بمصريين<br />فمرة شيخ من دول اعلن عن وصول وفد من اللاجئين دول على طلابه ... واداهم محاضرة عن ازاي لازم نستر اخواتنا المسلمات<br />طبعا الشباب ماصدقوا .. و معاك يا شيخنا .. و نعم لستر الاخوات المسلمات<br />و كله تطوع .. واستنى العروسة الاوروبية المسلمة<br />و بعدين اتضح ان الوفد ده جايين من الصومال<br />و خلاص...كل الشباب فستك بخ .. اتضح انهم كانو مستنيين العروسة الاوروبية .. مش العروسة المسلمة ولا بتنجان<br />و افتكر كمان ان في طالب من دول بعدها<br />اشترط في عروسة المستقبل .. انها تكون من الجالية (اللبنانية) (المسلمة)في مصر<br />اشمعنى بجى !! ;)<br />قال مسلمات روسياقال ... خش في عبي يا واد خش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141530/http://www.20at.com/article2.php?sid=308"

