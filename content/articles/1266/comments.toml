text = "لا لايمكن تكون ملكة جمال العالم بالحجاب<br />لايمكن طبعا والشروط بتاعة المسابقة معروفة<br />واى واحدة عاوزة تكسب لية تخبى جسمها ومفاتنها لية ؟<br />لا طبعا واصلا غلط المسابقة دى بتاعة روسيا"
