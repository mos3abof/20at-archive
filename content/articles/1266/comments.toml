[[comments]]
order = 15
subject = "بناتنا هم العفيفات و الشريفات"
author = "اسعد حدادو_سوريا"
posted = "2006-09-26"
text = "الى كل من يقول بان مسابقات الجمال تعتمد فقط على اظهار مفاتن المراة<br />عن طريق التعري هم فاشلون و مخطاون لان جمال المراة لايكمن فقط في جمالها الخرجي و انمامع عفتها و كرامتها و رجاحة عقلهاوالاهم من كل هذا في شرفها<br />و اليهم اقول قبل ان تضحكو على فتياتنا و نساءنا يكفينا فخرا اننا عندما نتزوج من احداهن متاكدون بانها فتات اما<br />نساؤكم فلا فرق عندكم ان كانت فتاة ام نساء<br />و هل الذي يذوق العذراء كالذي يذوق الحذاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141530/http://www.20at.com/article2.php?sid=308"
