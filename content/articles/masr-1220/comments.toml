[[comments]]
order = 4
subject = "كل العداوات"
author = "مسلم"
posted = "2006-11-28"
text = "كل العداوات يرجى مودتها الإ عداوة من عاداك فى الدين<br />هؤلاء الذين يخفون لنا كل حقد وكراهية ويعتبرونا غزاة أخذنا منهم وطنهمويرتدى قساسوتهم السوادوهم اكثر اقلية تأخذ الحقوق والإمتيازات فى العالم فهل هناك اقلية مسمله فى العالم تعامل مثل هؤلاء فى مصر المحروسه وهم سبب كل فتنه وانظروا الى الجماعه الاسلاميه فى مصر وما فعله النصارى من فتن حتى قضت عليهم الدوله الوضيعه ارضاء للنصارى وهم لايفرقون بين عملاء وشرفاء لانهم لو تمكنوا منا لفعلوا بنا الافاعيل فهناك نصوص فى انجيلهم المحرف تدعوا الى القتل لأجل القتل حتى الاطفال والنساء طالما انهم ليسوا نصارى وما حرب البوسنه وكسوفا ببعيد ثم يقولون عن الأسلام انه دين الارهاب كبرت كلمة تخرج من افواههم إن يقولون الإكذبا"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142704/http://masr.20at.com:80/article.php?sid=1220"

[[comments]]
order = 5
subject = "من المســــــــــــــــئول"
author = "تنص المادة 46 من دستور جمهورية مصر العربية على حرية العقيدة ولكن للاسف واضح ان هذات الدستور يطبق على بعض الناس او فى بعض المواضيع ان قصة اسلام وفاء قسطنطين هى من اهم ما حدث على صعيدالتاريخ الحديث بين المسلمين والمسيحين وبغض النظر عن ما يحدث الان داخل مصر من احتقان بين المسلميين والمسيحيين اجبرت دولة بكامل هيئاتها على الرضوخ لاوامر بطريرك الكرازة المرقصية نيافة الانبا شنودة الذى هدد بالاعتكاف فى وادى النطرون الى ان تحل مشكلة وفاء قسطنطين اى عار هذا واى منطق يؤيد حرية الانسان فى عقيدته ويرد الاخوة المسيحيون لماذا تعتبرون ان الذى يتنصر ويترك الاسلام مرتد ويجب قتله وكان رد الكاتب الكبير والمفكر الاسلامى د.محمدسليم العوا ان الدين الاسلامى لا يكره احد على الدخول اليه مستشهدا بنص الايه الكريمة (لا اكراه فى الدين )"
posted = "2006-11-28"
text = "ولكن بعيدا عن تفسير د العوا وعن رد الاخوة المسيحيون فان الواضح ان المشكلة بأبعادها كانت مشكلة سياسية بكل الابعاد ولم تفلح حكومتنا الرشيدة بايجاد اى حلول لها مما ادى الى تفاقمها وكان الرد الهزيل بعض الاغانى من الماضى البعيد والمنظر الذى يتم بثه فى التلفزيون المصرى الذى لم يعد احد يشاهده عن الشيخ الذى يعانق القس وتناسى اولئكم انهم امام مشكلة خطيرة تهدد مصر وتاريخها القادم امام عقدة اضطهاد مصطنعة ويبث سمومها اقباط المهجر ( ابادير وامثاله )<br />وحيرة من المسلمين الذين وجدوا اخوان الامس باتنوا اعداء اليوم وكل مسيحى يختفى من بيته بات المسلمون متهمون بخطفه المشكله اعمق من كل هذا ومن الواضح ان حكومتنا لا تستطيع حلها فالمسلمون يروا اليوم ان المسيحيون قد اخذوا حقوقا كثيرة مثل يوم الاجازة لعيدهخم وبناء الكنائس والمشاركة فى الحياه السياسية وهم متاكدون ان هذا يكفى لاننا دولة اسلامية اما<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142704/http://masr.20at.com:80/article.php?sid=1220"

[[comments]]
order = 6
subject = "حاجة تحير"
author = "عنتر مش لاقى سيفه"
posted = "2006-11-28"
text = "السلام عليكم و رحةه الله<br />الحقيقة انا لست قارء جيد لتاريخ الاقباط او عن الشخصيات العامة عندهم,, و لكني صراحة اقع في حيرة احيانا كثيرة...فالقران الكريم يوضح لنا كيفية معاملة الاقباط الدين هم اهل كتاب و يجب معملتهم بالتي هي احسن...و انا اتبع هذه التعليمات و بصراحة اجدها مجدية مع من حولي من الاقباط...ولكن ما يحزنني كثيرا هو ما اقراه علي بعض المواقع لهم و استشفه من نوايا غريبة لهم ضد الاسلام و المسلمين تجعلنى في حيرة من امري..هل مع كل ذلك يجب ان استمر في المعاملة الحسنة ...ام هذه المعاملة تقتصر علي فئة معينة منهم ام ماذا؟<br />بالنسبة للتعليقات التي تسب رموزهم..اعتقد و ان اختلفنا معهم في كل سيء فلا يجب ان نتبع اساليبهم الغير سوية..بل علي العكس لابد ان نرتقي و نترفع عن مثل هذه الالفاظ لاننا دائما و ابدا علي حق و نحن خير امة اخرجت للناس..فيجب ان نتعامل من هذا المنطلق"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142704/http://masr.20at.com:80/article.php?sid=1220"

[[comments]]
order = 7
subject = "عبدالله الطحاوي ..اسمحلي !"
author = "التحليل رائع يا طحاوي...بس في تعليق صغير"
posted = "2006-11-28"
text = "وضع مقارنة بين صعود التيارات المسيحية المتطرفة وبين صعود الجماعات الاسلامية في اعتقادي مقارنة غير موفقة وجانبها الصواب لإختلاف طبيعة التجربتين كلياً وكمان اختلاف طبيعة العقيدتين.<br />وفي نقطة كمان حوالين تحركات الكنيسة خلال الثلاثين سنة إلي فاتو وهي ان الكنيسة انسلخت من لحمة الجماعة الوطنية وتبنت مواقف غير موفقة ونفس الحال على الجماعة المصرية في عمومها مع ظهور تيارات اسلامية متطرفة ولكن يبقى ان المستقبل مبشر لأن المصريين مسلميهم واقباطهم ظهر لهم عدو مشترك وهو الفساد إلي الحزب الوطني غرق فيه البلد واظن ان الفترة إلي جاية هنشوف فيها تغير في بنية تفكير المصريين واقصد هنا الفترة إلي جاية مش سنة ولا اتنيين على الاقل خمستاشر سنة ويمكن عشريين<br />متستعجلوش .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142704/http://masr.20at.com:80/article.php?sid=1220"

