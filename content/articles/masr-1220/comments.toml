[[comments]]
order = 9
subject = "مين المضطهد ياناس!"
author = "Drsalah_hanie"
posted = "2006-11-30"
text = "أنا عايز أعرف مين المضطهد فى البلد دى اللى عنده 60% من إقتصاد مصر ,اللى بتمارس سلطته الدينيه الحد الاقصى من الارهاب السياسى والفكرى ,اللى فيه أتباع ديانته مش عارفين يمارسوا أبسط حقوقهم فى اختيار الدين اللى همه عايزينه(ماريا,كريستين,تريزا إبراهيم,وفاء قسطنطين...............) فى نفس الوقت الذى يمارسون هم فيه أقذر أنواع الاستغلال الدينى عن طريق استهداف أطفال الشوارع الفقراء أو الاطفال الصغار بهدف تنصيرهم!!!<br />وأنا لى سؤال \"برىء\" عندا لنصارى :<br />ليـــــــه فى الاحتفالات اللى بتعملوها واللى بتتذاع على التليفزيون ,ليه بيتحول التصفيق من تصفيق \"من النوع العادى\" إلى تصفيق\" من النوع الحــــــــــــــار\" وذلك عند ذكر أى مسئول أمريكى أو السفير الأمريكى!!!<br />هل تحبون أمريكا وسياستها لهذه الدرجه, أم أن أفضال أمريكا عليكوا وعلى الكنيسه مغرآكم من ساسكوا لراسكوا كما يقولون!!!<br />حتى أننى أشعر _من حجم التصفيق والتحيات للسفير_ أشعر أنكم على وشك إحضار فرقه موسيقيه لعزف النشيد الوطنى للولايات المتحده الامريكيه!!!<br />لذا فليرى الجميع من يشعل نار الفتنه ومن يستقوى بالخارج على حساب أولاد بلده."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216142704/http://masr.20at.com:80/article.php?sid=1220"

