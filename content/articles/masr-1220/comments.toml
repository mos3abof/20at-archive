text = "شنوده حلم حياته ان مصر تكون اندلس تانيه المسلمين فيها يندبحوا او يتنصروا او ينطردوا من بلدهم في عهد الأرهابي نشوف ناس بتستنجد بالخنزير شارون خش علي اي موقع قبطي تلاقيهم بيمدحوا اسرائيل وامريكا في كل لحظه الأقباط في عهد شنوده مشروع كبير مش لشعب قبطي زي ما بيقولوا لكن شعب خاين وارهابي وعميل مش هنشوف اقذر منهم"
