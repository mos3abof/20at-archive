posted = "2009-11-03"
text = "بطرس باشا غالى عمل ضريبة على العقارات ( جباية يعنى ) وطبعا الزوج هيتزوج الزوجة التانية فى شقة والشقة هيبقى عليها ضريبة عقارية تكسر وسطة يبقى اطمئنوا يا زوجات الراجل مش هيتجوز واحدة تانية علشان الضريبة العقارية"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

[[comments]]
order = 1
subject = ""
author = "لور دكاش"
posted = "2009-11-03"
text = "على فكرة المشكلة بقت أكبر من ثقافة المسلسلات.. ده على الأقل المسلسلات المصرية بتتكلم عن الزواج الثاني باعتبار انه مشكلة وحاجة وحشة وآخرتها سودا، ولو نظرت لنهايات كل المسلسلات التي ذكرتيها لوجدت أن سعادة الزواج الثاني لم تدم إلا أيام وبعدها بدأ يجلب الخراب على الرجل حتى يصل لنهايته المحتومة إما بالتعاسة الأبدية أو تطليق الزوجة الثاني والعودة لشريكة العمر.<br />المشكلة الحقيقية بقى هي ثقافة مدعي التدين التي انتشرت بشكل مرعب بين شبابنا، فقد أصبح من العادي أن تجد أحدهم يروج ويؤمن بفكرة ضرورة الزواج الثاني للقضاء على أزمة العنوسة، أو لغرض الإنجاب أو حتى لمجرد إشباع الرغبات الجنسية، وينكرون على السيدات رفضهن للفكرة، متناسين أن الرسول الكريم رفض أن يتزوج علي بن أبي طالب على السيدة فاطمة، وتراجع سيدنا علي بالفعل عن عزمه الزواج بأخرى، يعني الست من حقها تضايق وترفض إن زوجها يتجوز عليها.<br />المهم يا أستاذة رضوى موضوع جميل جدا، وحقيقي جدا جدا.. برافو"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

[[comments]]
order = 2
subject = ""
author = "جوانتيمالا"
posted = "2009-11-03"
text = "واحد سعودى كاتب رقم تليفون زوجتة فى المحمول الخاص بة وامام الرقم كتب كلمة جوانتميالا - يعنى بيعتبر زوجتة او البيت جوانتميالا اى معتقل جوانتميالا<br />الزوجة اكتشفت ذلك فطلبت الطلاق<br />احيانا فية زوجات فعلا بتحب تحول البيت لمعتقل وسين وجيم وكنت فين وجاى منين وقعدت مع مين وعملت اية فى الشغل وانت مكشر لية ولو غلط وقال لها يا ستى الرز ناقص ملح تنفجر فية ابقى روح كل عند امك<br />انت وسخت الملاية وبدل ما انت قاعد قدام التليفزيون روح المطبخ اغسل لك طبقين<br />فية ستات اساتذة فى العكننة وتطفيش الراجل من البيت"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

[[comments]]
order = 3
subject = ""
author = "اوهام ووساوس مرضية"
posted = "2009-11-03"
text = "دة كان زمان يا ستات لما كان الراجل امة بتربية على السمن البلدى والقشطة واللحمة الضانى ودكور البط والوز وكان راجل يعنى راجل يضرب ايدة فى الحيطة تنفد الناحية التانية ويسلم على الجيران وكان عندة فحولة وذكورة قوية وزوجتة بتقرف من كتر معاشرتة الزوجية وتقول لة روح يا عم اتجوز واحدة تانية انا خلاص واحدة تستحملك وخصوصا لما يكون جسمها ضعيف<br />انما دلوقتى الرجالة رجالة منظر مهدود الحيل وبيتنفس بصعوبة ويطلع السلم ينهج ومقطوع النفس - لية - لان اكلة عبارة عن فراخ بيضاء وكلها هرمونات تربى لحم بس انما عضلات مفيش والخضار والفاكهة كلها هرمونات ومفيش حاجة طبيعية<br />اطمئنوا يا سيدات مفيش راجل يجرؤ يبص برة لانة مش هيقدر الا اذا كانت واحدة سقع وعندها فلوس وقرشين هيلهطهم<br />انما واحد يجوز واحدة تانية علشان متعة او اشباع رغبة فهذا مستحيل<br />اطمئنوا"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

[[comments]]
order = 4
subject = ""
author = "مهند اولا و أخيرا"
posted = "2009-11-03"
text = "جوزي فعلا بينزل الصبح حاطط البرفان و غاسل وشو و متأنتك على الاخر و يا عين امي انا بيرجعلي خلقة يا عوز بالله و طبعا على امام هذا الشكل الغير آدمي ان ارتدي اجمل ما عندي و اضع له الريحة بينما هو لا يهتم ابدا حتي اذا طلبت منه ان يغير ملابسه هذه او يتجمل لي ينظر الى و كأني جرحت رجولته بصراحة انا عايزة اتجوز واحد زي مهند"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

[[comments]]
order = 5
subject = ""
author = "اغفر لنا"
posted = "2009-11-04"
text = "الزوج حديث العهد بالزواج بيدعى ربنا صباحا ومساءا<br />ان يغفر لنا ذونبوبنا بعد زواجنا وان يلهمنا الصبر والسلوان على تلك الزيجة المصيبة والا يؤاخذنا بذنوب السفهاء ( الاب والام اللى جوزوة ) وارحما وخفف عنا واجعل كلامنا خفيف عليهم ( الزوجة )<br />جواز تانى<br />تانى<br />يا نهار اسود - تيجى تاخد اللى عندى"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

[[comments]]
order = 6
subject = ""
author = "روح عند امك"
posted = "2009-11-04"
text = "اى واحدة عايزة تعرف ان جوزها ممكن يتجوز عليها والا لا<br />تلف لة هدومة كلها فى ملاية سرير وتعملها بؤجة وتفنعل معاة خناقة اى خناقة حاجة مفتعلة كدة وترمى لة هدومة برة الشقة وتقول لة روح عند امك<br />واللة اذا اخد هدومة ومشى يبقى ناوى على نية واذا استغاث وقال لا وبطلى هزار بايخ يبقى انتى نجحتى تقصقصى ريشة وتنتفى وبرة وخلتية على الحميد المجيد<br />جواز اية تانى<br />فية احد عايز يجيب لبيتة عقربة او يمسك سلك الكهربا زى ما بيقول الشاعر البحرينى عبد الرحمن<br />جواز تانى يا لهوى<br />ويفتح بيتين<br />انتى بتصدقى كلام المسلسلات العبيط اللى واحد اشتغل فى الكويت سنتين وبقى صاحب مجموعة شركات وصاحب فيلل وسيارات واتجوز اتنين دة كلام فارغ وهبل طيب ما احنا فى الكويت بقى لنا 30 سنة ودرجات عليا ويدوبك اللى جاى على قد الرايح وساكنين فى شقة ويدوبك بنعلم العيال تعليم خاص والسلام<br />الحرامية بتوع الحديد زى عز والواد بتاع هيفاء هما اللى ممكن يتجوزوا اتنين ويدفعوا ملايين<br />انما الغلابة الموظفين اللى ما بيصدق يلاقى واحدة تبقى سترة وغطاة ويخلف عيلين يعرف يربيهم ويشوف هى وهو المرار علشان تربية العيال<br />مسلسلات هابلة وكلها خبل"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

[[comments]]
order = 7
subject = ""
author = "مفروس"
posted = "2009-11-04"
text = "راح زمن الراجل اللي يتجوز على مراته .. هيجيب منين شقة ومهر وشبكة مرة تانية .. وبعدين هو الواحد يقدر يستحمل نصيبة عشان يجيب لنفسه بلوة تانية؟<br />ولو الراجل افتكر ان الزوجة التانية هتسعده وتنسيه الاولى، طب ما يفكر انها ممكن لا بالتأكيد بعد شوية من الجواز هتبقى زي ضرتها ويمكن العن<br />إن كيدهن عظييييييييمم .. ربنا ينتقم منكم يا ظلمة"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

[[comments]]
order = 8
subject = ""
author = "عانس"
posted = "2009-11-05"
text = "اولا نحن لسنا كاثوليك<br />ثانيا - عندنا مشكلة 7 مليون عانس لم يتزوجوا بعد ولا يوجد هناك بصيص من امل فالشباب عاطل ولا توجد اى فرصة لا فى القطاع الخاص ولا فى الحكومة<br />طيب والحل<br />نصيع فى الشوارع ونمشى على حل شعرنا<br />و الا عقلاء المجتمع يشوفوا حل<br />ماذا لو تزوج الرجل القادر ماديا اتنين وتلاتة وحتى اربعة ؟<br />طالما قادر فلماذا لا ؟<br />يا من تتبنون الفكر الكاثوليكى نحن مسلمون ومسلمات ولنا حق<br />لماذا نظل عوانس طوال عمرنا ؟<br />لماذا لا نرى ذلك الجانب من الحياة ؟<br />كل قادر يتزوج اكثر من واحدة يصنع بالمجتمع خيرا فجزاة اللة خيرا<br />نحن مسلمات ولسنا كاثوليك نكررها للمرة العاشرة<br />هل احد عندة حل لمشاكلنا غير تعدد الزوجات - والا تريدوننا ان نعيش عذارى ونموت عذارى ؟<br />لا كلام اكثر"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

[[comments]]
order = 9
subject = ""
author = "الحلة وغطاها"
posted = "2009-11-05"
text = "بالبلدى بيقولوا فى الامثال الجواز زى الحلة وغطاها بمعنى المراة هى الحلة والرجل غطاء الحلة<br />واللة اذا الغطاء مناسب للحلة وبيحبك كويس ومظبوط وعلى المقاس يبقى خلاص<br />انما لو غطاء الحلة صغير او كبير او مش مناسب فاكيد هيحصل مشاكل وطلاق وجواز تانى<br />من هنا الاسلام بيشترط التكافؤ فى الزواج<br />التكافؤ الثقافى والتعليمى والتكافؤ المادى والعائلى والطبقى<br />لو فية تكافؤ يبقى فية اتفاق وود ورحمة ومعاشرة بالحسنى والمعروف<br />المشكلة فى اختيار الزوجة او الزوج بدون عمل حساب للتكافؤ"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

[[comments]]
order = 10
subject = ""
author = "ابومحسن غربة 28 سه"
posted = "2009-11-05"
text = "تعدد الزوجات ضرورة اباحها الشرع<br />والنبي محمد صلى الله عليه وسلم عدد الزوجات<br />فاللي عايز يعدد لازم يكون عنده اهداف النبي محمد صلى الله عليه وسلم<br />التعدد خير وبركة ونماء ومحبه<br />وليس كما يحدث الان غل وحقد وطلاق وشقاق والعياذ بالله<br />النبي محمد صلى الله عليه وسلم استوصا بالنساء خيرا"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

