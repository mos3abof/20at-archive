posted = "2009-11-05"
text = "إلى جيمي<br />طب ما هي الرجالة كلها برضه عاوزة الستات تبقى شبه هيفا ولا نانسي ولا على الأقل حتى سمية الخشاب.. إشمعني يعني.. ولا حلال عليكو حرام علينا"
