[[comments]]
order = 12
subject = ""
author = "جيمـي"
posted = "2009-11-05"
text = "بصراحة … هي واجبات منسية من الطرفين<br />أنا شايف إنك جاية أوي علي الراجل .. ومتناسية انه فيه ستات مابيعملوش أى حاجة فى حياتهم غير انهم يصحو من النوم ويتفرجوا على التلفزيون ويطلبوا أى حاجة تيك أواى وتيجى بالدلفيري وياكلوا ويناموا تانى علشان يصحوا من جديد .<br />وفيه ستات مش بتهتم بمظهرها .. وفيه ستات جالها هوس بمهند (السمج) وأمثاله .. وعايزين الرجالة كلها تبقى عنيها خضر …<br />يعنى كان فيه خبر منشور أن واحد راح عمل عملية تجميل بتوصية من المدام علشان تبقى عيونه زرقا وأبيضانى وشعره مصفر علشان يبقى شبه مهند .<br />طب بالذمة ده كلام برده ."
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

[[comments]]
order = 13
subject = ""
author = "مش ححبك"
posted = "2009-11-06"
text = "اضافة الى التعليق رقم 11 الاخ ابو محسن<br />بشأن التعدد ضرورة اباحها الشرع<br />بكل تأكيد التعدد ضرورة اباحها الشرح<br />لماذا؟<br />لان الرجل قبل الزواج يريد ان يتزوج لكي يعف نفسه من الشهوه<br />وبعد الزواج<br />بينتقل الاخ المتزوج من شهوه الى شهوه من نوع اخر<br />يعني قبل الزواج هناك شهوه<br />وبعد الزواج هناك شهوه اخرى<br />الا وهي شهوة التغيير<br />يريد ان يغير وهي شهوة قوية جدا<br />ولذلك تجد رجال متزوجين وكأنهم غير متزوجين<br />يجرون وراء النساء والبنات<br />وكأنهم غير متزوجين"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

[[comments]]
order = 14
subject = ""
author = "اخص على المحامين"
posted = "2009-11-07"
text = "موظف بريد بأسيوط يرفض ‏10 ملايين جنيه رشوة‏..‏ ووزير الاتصالات يقرر تكريمه<br />- محرر مصراوى -<br />رفض موظفو ادارة الحاسب الألى بمكتب بريد منفلوط بمحافظة أسيوط رشوة قدرها 10 ملايين جنيه من أحد المحامين نظير قيامهم بتسهيل اختراق شبكة الحاسب الألى للهيئة العامة للبريد والاستيلاء على مبلغ 40 مليون جنيه .<br />وكان عبدالرحمن فتحي محمد صفوت معاون مكتب بريد منفلوط قد فوجئ بزيارة من المحامي رمضان محمد شلبي رئيس جمعية تنمية شباب الخريجين بعزبة عبدالله محبوب‏,‏ يعرض خلالها عليه صفقة تتضمن إبلاغ المحامي بالشفرة السرية الخاصة بإيداع أموال البريد في البنوك‏,‏ علي أن يستغل المحامي ذلك في عمل إيداعات وهمية باسم الجمعية بمبلغ‏40‏ مليون جنيه‏,‏ ويقوم بسحبها بعد ذلك مقابل حصول المعاون علي عشرة ملايين جنيه‏.‏<br />_______________ __________<br />اتفوووووووووووو ووووووووووووووو و على المحامين هما اللي ضيعوا البلد"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145253/http://www.20at.com:80/masr/places-of-egypt/13900-2009-11-02-15-53-21.html"

[[comments]]
order = 15
subject = ""
author = "التعليق رقم 14"
posted = "2009-11-08"
text = "التعليق رقم 14 للاخ مش ححبك قال شيء مهم جدا ترى رجال متزوجين وكأنهم غير متزوجدين<br />متزوجين ويفعلون افعال المراهقين تماما<br />ومتدينين<br />ومن اجل هذا يؤكد صحة فرضية التعدد<br />ولكن يجب ان يكون التعدد بالرضى والمحبه والخير<br />تماما كما فعل النبي محمد صلى الله عليه وسلم<br />لما عدد النبي كانت عائشة وحفصه وام حبيبه وام سلمه<br />تعدد محبه وخير وبركة ونماء<br />وليس كما يحدث الان<br />يتزوج الثانية لكي يغيظ الاولى<br />ويتزوج الثالثة لكي يهجر الثانية<br />واشياء عجيبة الاسلام بريء منها ومن الذي يفعلها<br />يا معشر الرال<br />التعدد خير وبركة وحب ونماء<br />ومن لم يستطع ذلك فواحدة<br />والتعدد بالرضا والحب وليس بالكره والبغض والحقد"
archived = "2009-11-10"
capture_url = "https://web.archive.org/web/20091110021204/http://www.20at.com:80/masr/egyptian-blogs/13900-2009-11-02-15-53-21.html"

