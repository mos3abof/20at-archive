text = "التعدد حلال شرعا بشروط و قيود ليست بسهله او بسيطه<br />مش كل واحد معاه شوية فلوس وشاف واحدة و عجبته يروح يتجوزها<br />اهم حاجة الــعــــدل و طبعا ده موضوع صعب اوي اوي اوي<br />لان في ظروف الحياة دلوقتي الراجل المتجوز واحدة ممكن في احيان كتير ميكونش عادل معاها<br />فحيعمل ايه مع اتنين. ده طبعا بجانب القدرة الصحيه و العقليه الكافية لتحمل مسؤليه بيتين<br />الي شايف نفسه يقدر, يتفضل يتجوز تاني بعد ما يقول لزوجته الاولي و يحاول انه يهون عليها علي قد ما يقدر..<br />في المسلسلات كل واحد اتجوز علي مراته اتجوز بسبب سوا كانت مراته السبب او لانه بتاع ستات<br />فالمشكله انهم بيخبوا كانهم عاملين جريمه و من هنا الغلط لان الجواز اصلا اساسه الاشهار و ثانيا بيترتب علي الموضوع ده الكثير من الكدب و الصدمة للزوجة الاولي بتكون اكبر بكتير.<br />انت عايز تتجوز تاني و قادر علي ده بجد, قول لمراتك الاولي و اشرح اسبابك عسي انها تقدر تعوضك الي انت بتدور عليه ولو لا بيقي انت عملت الصح في النور."
