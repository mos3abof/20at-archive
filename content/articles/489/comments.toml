[[comments]]
order = 5
subject = "معادلة بسيطة"
text = "عندما نحذر البنت من أن تتسبب في إيقاع الشاب في الفتنة سواء بالقول أو العطر أو الملابس، لا نحذرها من باب أنها شيطان يحاول الإيقاع بالشباب، ولكن ننصحها بذلك لأن هذا الشاب أخوها في الإسلام، ويجب أن تحافظ عليه من الوقوع في ذنب النظرة أو الشهوة، وهي مسئولة عنه قبل أن تكون مسئولة عن ذنبه.<br />وكذلك نحظر الشباب من إفتتان البنات وإيقاعهن في محاظير شرعية مثل التحدث معهن في أمور لا تليق أو حتى إثارة ضحكاتهن العالية والتي تصير فتنة للقلب المريض الذي يتحسس مواضع الشبهات، ولذا نهى الله تعالى النساء عن الخضوع بالقول حتى لا يفتتن ذوو القلوب المريضة..<br />وهنا أيضاً ننصح الشباب؛ لأنهم مسئولون عن البنات في اٌلإسلام، فالمؤمنون إخوة يا شباب ويا فتيات، فيجب على كل طرف أن يحفظ الآخر من الوقوع في الذنب سواء بسببه أو بسبب أي شيء آخر، ويجب أن ينتشر بيننا النصح في الله، ولو حتى أن ينصح الشاب زميلته في العمل بألا يفرطا في صداقتهم حتى لا يظن بهم الآخرون الظنونا.. (والعكس بالعكس)<br />ومن هذا المنطلق، يجب أن يحافظ كل طرف على الطرف الآخر سواء أصدقاء الجامعة أو زملاء العمل؛ حتى يكون الطرفان زميلين في الفردوس الأعلى إن شاء الله..<br />وإلى الملتقى..."
archived = "2005-05-31"
capture_url = "https://web.archive.org/web/20050531083001/http://www.20at.com:80/article.php?sid=947"

[[comments]]
order = 6
subject = "من رد للدكتور وائل أبو هندي"
text = "وصلت مشكلة لصفحة مشاكل وحلول الشباب باسلام أون لاين بخصوص العلاقات بين الجنسين وجائت هذه الفقرات ضمن رد الدكتور وائل أبو هندي علي المشكلة ..<br />عندما أتحدث إلى المراهقين عن العلاقة بين الجنسين فإنني أقول لهم بأن أنواع العلاقة بين البشر إما أن تكون زمالة أو صداقة أو حبا عاطفيا.. ثم أفسر وأفصل الأمر بأن الزمالة هي التواجد في مكان مشترك من أجل عمل أو علم، وبذلك فالزمالة يمكن أن تكون بين طرفين من جنس واحد أو طرفين من جنس مختلف.<br />وللزمالة حدود بين الجنسين هو أن يحكمها غض البصر وعدم الخضوع بالقول، والمقصود هو موضوع الحديث وطريقته، ثم أن تلتزم الفتاة الملبس الشرعي، وأن هذه الحدود تضمن للزمالة أن تكون زمالة ملتزمة يسودها الاحترام بين أطرافها.<br />وأما الصداقة فبحكم تعريفها يكون فيها الصديق هو ذلك الشخص الذي أرتاح إليه وأفضي له بسري، وأتحدث إليه كما أتحدث مع نفسي، وألجأ إليه في السراء والضراء لأجد عنده الملاذ الآمن الذي أستريح فيه. هذه الصداقة بهذه الصورة لا تصلح إلا أن تكون بين طرفين من جنس واحد؛ لأنها لو كانت بين طرفين من جنسين مختلفين فبحكم الميل الطبيعي بين الجنسين فإن هذه الصداقة لا بد من أن تتطور إلى حب عاطفي؛ لأن هذه هي طبيعة الأمور، ولأن هذا الميل الفطري لو أضيف إليه ما بين الأصدقاء فلا بد أن يكون الناتج حبا، وهذا الحب مشكلته أن أصحابه لا يعترفون به ولا يسمونه باسمه الحقيقي. وبالتالي لا يتطور إلى المآل المناسب للحب وهو الارتباط الشرعي فتظل العلاقة بين الطرفين معلقة لا هي صداقة ولا هي حب.. هو شيء مشوش مبهم لا تنطبق عليه أي من قوانين الحب والصداقة فتتأرجح العلاقة بدون أن ترسو على بر.<br />وأما النمط الأخير للعلاقة بين البشر وهو الحب العاطفي فإنه أيضًا بطبيعته لا يصلح إلا أن يكون بين طرفين من جنس مختلف؛ لأنه لو كان بين طرفين من جنس واحد لأصبح مرضا يستوجب العلاج وشذوذًا يجب استئصاله.<br />وألخص حديثي في النهاية بأن فهم هذه الحدود في العلاقات بين البشر في هذه السن المبكرة يؤدي إلى أن المراهق يسير في حياته وهو يدرك ما حقيقة كل علاقة، فما هو زمالة يلتزم بحدوده وما هو صداقة يعطيه حقه وما هو حب يؤجله للوقت المناسب للارتباط عندما يقابل الشخص المناسب في المكان المناسب ولا يترك الأحداث تحركه وتورطه في علاقة لا يدرك مآلها.<br />ويمكنكم قراءة المشكلة كاملة والرد كذلك علي<br />هذاالرابط"
archived = "2005-05-31"
capture_url = "https://web.archive.org/web/20050531083001/http://www.20at.com:80/article.php?sid=947"

