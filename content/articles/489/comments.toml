text = "يجب أن تقوم العلاقة بين الجنسين في إطار العلاقة الأخوية لتؤدي إلي صداقة حميمة مبنية علي الأسس السليمة علي أن يعتبر الشاب صديقته مثل أخته ويضعها موضع أخته فعلا فيضع في اعتباره ما يؤذي مشاعرها ويتجنبه ويطبق الحديث الشريف افعل ماشئت فكما تدين تدان فلو آذيت مشاعرها توقع أن ممكن تجرح مشاعر وكرامة اختك ويجب علي البنت ان تراعي كلامها مع الشباب فلا تزيد في كلامها عن المطلوب في حدود الأدب<br />والسلام عليكم ورحمة الله"
