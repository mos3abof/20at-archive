text = "السلام عليكم ورحمة الله وبركاته<br />لاحظت أن معظم الردود في هذا الموضوع وغيره ردود غير لائقه ..وفي هذا الموضوع لاحظت أن معظم المشاركين لايهمهم الموضوع بدليل وجود هذه التعليقات ..<br />قال تعالى ((وغير متخذي أخدان))..أي للنساء لاتتخذوا أصحابا من الجنس الآخر..ومن يدعوا إالى حرية الصداقه بين الرجل والمرأة بدعوى التطور ومواكبة الغرب أقول لهم إتقوا الله ..<br />قال الكاتب((لا يمكنني أن أقتنع أن كل كلمة أتفوه بها مع الجنس الآخر حرام. كده كل حاجة في الدنيا حرام؟ ))..<br />(أقول أنا))اللهم إني أعوذ بك أن أسخط على حكم من أحكامك..<br />ويا إخوتي أدعوكم إلى تصفح المواقع الدينيه للسؤال عن هذا الموضوع ..<br />إليكم مني هذا الموقع وعسى أن يهديكم الله<br />WWW.TWBH.COM"
