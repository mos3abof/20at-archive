subject = "فايزة"
text = "بسم الله الرحمان الرحيم<br />جزاكم الله خيرا على كل ما قلتم.لكن كيف يمكن لنا أن نحد من هده المشكلة علما أهنا منتشرة حتى في صفوف المحجبات؟<br />بالنسبة للشات أنا أعتقد بأنه يزيد الطين بلة .أولا لأن الدعوة غير ممكنة فيه يعني أن تدعو الجنس الأخر إلى العمل بكتاب الله لأنك بدلك تحتاج في كل مرة تدخل فيه بأن تقول أنك لا تريد علاقة وإنما تدعو إلى الله وهدا طبعا غير ممكن.<br />بانسبة لي أنا أرفض بتاتا هده العلاقة لكني في المقابل أدعو للموالاة بين المسلمين من الجنسين.<br />والله أعلم"
archived = "2005-05-31"
capture_url = "https://web.archive.org/web/20050531083001/http://www.20at.com:80/article.php?sid=947"

