[[comments]]
order = 0
subject = "بيع من لا يملك لمن لا يستحق"
author = "ابو اسامة"
posted = "2006-10-18"
text = "من اذن لهؤولآالخونة بالبيع وكيف يشترى شيىء من من لا يملكه فاذا كان لابد من البيع<br />فليأخذ راى اصحاب الشان فهذا الرئيس او هذا الوزير الذى يبيع لم ينتخبه احدولم<br />يعطه احد الحق فى البيع اذا فيجب على اعضاء مجلس الشعب المعارضون الطعن فى البيع لآنه تم دون رضى صاحب الشان و<br />بذلك يكون البيع باطل قانونا ويحذروا من يشترى هذه الأشياء المملوكة للشعب ان البيع<br />باطل."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061357/http://masr.20at.com:80/article.php?sid=1064"

[[comments]]
order = 1
subject = "الخصخصه"
author = "ممتاز"
posted = "2006-10-18"
text = "هذا اوضح دليل على ان الحكومه تعتبر البلد تركه ابوهم ، يتصرفوا بها كما يريدون ، لشخص يبيع ورثا له ، حد يقدر يعترض او يقول له لماذا ، ماذا بقى ، ان يقسموا ارض البلد قطعه قطعه ويبيعوها بالمتر؟؟؟<br />معا ضد حكومه مماليك الالفيه الثالثه"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061357/http://masr.20at.com:80/article.php?sid=1064"

[[comments]]
order = 2
subject = "شوفوا الفرق"
author = "مصرى"
posted = "2006-10-19"
text = "شوفوا الفرق بين اللامبارك إللى ببيع أملاك الشعب والسادات إللى حارب علشان يرجع أرض مصر فرق زى السما للأرض وهو ده إللى خلاه يقتله علشان عمره ما ها يقدر يوصل لزعامته ولا لسياسته ده يا دوبك طيظ متحركة وليس بها أى مخ أو كفاءة وبيعتبر الكلمتين إللى إبنه أتعلمهم بالفلوس فى الجامعة كافيين أنه يحكم مصر بيهم هههههههههههههههه سلملى على التوريث يا حثاله.<br />الشعب ورافضكم كاتمين ليه على نفس الشعب وقاعدين بتعملوا إيه مش مكفيكم إللى نهبتوه وعملتوه فى البلد يا أحقر الخلائق أخرجوا من مصر لا للعمالة ولا للحقارة ولا للتوريث ونعم لزعامة جديدة لمصر من كفاءاتها"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061357/http://masr.20at.com:80/article.php?sid=1064"

