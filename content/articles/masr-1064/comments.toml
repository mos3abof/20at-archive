[[comments]]
order = 4
subject = "احا يا بلد"
author = "قيادي في حركة دمار ال مبارك"
posted = "2006-10-20"
text = "يا جماعة انا عاوز اقوا لكم اننا اندفنا بالحيا خلاص ولا في شغل ولا سكن ولا حتي جواز وظلم وقهر واعتداء علي كل شيء منها النفس وما في شخص يقدر يعمل شيء ختي الراجل الي وقف في وش الناس الظالمة دي ما حد وقف بجوارة اقصد طلعت السادات<br />بطلم كلام كفاية وقفوا بجوار المعتدليين لكي نتخلص من هؤلاء الزئاب البشرية التي اكلتنا"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061357/http://masr.20at.com:80/article.php?sid=1064"

[[comments]]
order = 5
subject = "شرطة مصرية جدا"
author = "شرطة مصرية جدا"
posted = "2006-10-21"
text = "أرسله تعذيب يوم اثنين, 16/10/2006 - 20:18.<br />هذا المقال ورد الينا عبر البريد الاليكترونى بتوقيع \"مصرى مغترب\"<br />رأيت مرة أحد الطلاب المقبولين حديثاً بكلية الشرطة - وفي أول أجازة حصل عليها وكان حليق الرأس تعلو أنفه لمحة عجرفة لم أعهدها عليه فسألته: ماذا علموك في الشهرين الأولين من دراستك؟ فقال: علموني أن الشعب المصري مثل الياي ( الزنبرك) طالما أنت ضاغط عليه بقدميك فهو ساكن، وإن خففت الضغط عنه انطلق في وجهك. والحقيقة أننا يمكن أن نلمس زرع تلك الخصومة بين أفراد الشعب بكل طوائفهم ومستوياتهم وفئاتهم من ناحية وبين جل منسوبي الشرطة المصرية بكافة فروعه:<br />أمن دولة - مباحث نجدة مرور جمارك مطار مسطحات مائية مرافق إلخ إلخ.<br />فما من مواطن إلا وناله قسط من الإهانه إلا أصحاب الحظوة بالطبع والذين تعمل الشرطة في خدمتهم. وطبيعة التربية الشرطية في مصر أن يتحمل الضغط ممن فوقه أياً كان نوعه ثم يمارس التنكيل بالمواطنين. وهي طبيعة جُبِل عليها العاملون بهذا الجهاز والذي بلغ مستوى الإساءة للمواطنين مداه الأعلى أيام اللواء زكي بدر وزير الداخلية الأسبق،<br />ولم ينزل مستوى الإنجراف في إهانة المواطن من بعده بل زاد.<br />ومن لا يرض برأيي هذا ويعتبرني مبالغاً أتركه مع هذه العناوين، التى استقيتها من هذه الجريدة الموقرة، وأعود إليه بعدها:<br />° سحل مواطن حتى الموت في شوارع فايد بالإسماعيلية<br />° بقسم شرطة العامرية : علقة ساخنة لسائق رفض توصيل حضرة الضابط<br />° تعذيب أسرة بأكملها..<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061357/http://masr.20at.com:80/article.php?sid=1064"
