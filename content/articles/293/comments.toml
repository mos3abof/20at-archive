[[comments]]
order = 5
subject = "** منقول"
text = "انا حضرت القصة ديه من أيام ما كان عندي 15 عام, وانا الآن 30<br />عام.<br />أولا صدقت ما قيل فيها, ولكن احد الشيوخ المحترمين اقنعني بكذب<br />هذه القصة, والآن وأنا عندي 30 سنة, أجد نفسي والحمد لله في تقدم<br />مستمر.<br />ولكن المسألة تأخذ شكل التطور الطبيعي في أي شيئ, بمعنى أنها<br />بدأت أن تنسخها على يدك 10 أو 13 مرة<br />ثم مع انتشار آلات التصوير أصبحت , صورها 13 مرة, ومع ظهور<br />الإنتر نت أصبح عليك أن ترسلها إلى 13 صديق,<br />وأتوقع أنه اذا قدر الله لنا ان نستطيع ان نتجول في الفضاء<br />الخارجي بطائرات خاصة, فسيضاف إلى القصة \"عليك أن توزعها على<br />13 كوكب\"<br />تصدقوا انه شيئ لذيذ ومسلي<br />** منقول"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044555/http://www.20at.com:80/article.php?sid=457"

[[comments]]
order = 6
subject = "لا أعرف بالضبط ..."
text = "لكن أذكر أنه من إحصائيات رسمية لبرنامج سوبر ستار (القديم!) ..<br />في الأردن وحدها تجاوزت تكاليف الإتصالات ال5.5 مليون دولار !!<br />الإتصالات أكيد تجاوزت المليونين !!<br />لا يعني ذلك أن 2 مليون (بني آدم) إتصلوا ،<br />يمكن واحد إتصل مليونين مرة !!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044555/http://www.20at.com:80/article.php?sid=457"

[[comments]]
order = 7
subject = "عبيد"
text = "الله ينور عليك يا علي، الموضوع مهم فعلا، وأنا بأعتبر ان تصديقه نوع من ضعف الإيمان بالله، لأن النفع والضر بإذن الله، وليس بأفعال البشر.<br />مرة كنت بانتقد الموضوع ده قدام أخويا الكبير ، فقال لي \" دا انتو فيه تصوير على أيامكم، إحنا كان بيطلب منا نكتبها مش عارف كام مرة ونوزعها\" وعلى رأي واحد تاني إن اللي بيروج للموضوع ده صاحب ماكينة تصوير:) بس الإنترنت حرقت المشروع .<br />ملحوظة أخيرة للشباب اللي بيمرر هذه الرسائل من باب الذكر، إحنا ممكن نضر من حيث نريد الإصلاح، وواجبنا في وقت زي ده إننا نحارب الجهل . وتسلم إيدك يا علي"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044555/http://www.20at.com:80/article.php?sid=457"
