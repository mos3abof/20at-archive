[[comments]]
order = 2
subject = "فعلاً"
text = "لقد أصبت بدهشة من أن الجميع أخذوا يرددون خبر الـ80 مليون مكالمة.. حتى موقع إسلام أون لاين نشر خبراً عنها.. وحتى عمرو خالد تكلم عنها..<br />لقد قرأت من قبل في مقال لوحيد عبد المجيد بالأهرام أن عدد الاتصالات كان 4 مليون اتصال.. ورغم أنه عدد رهيب إلا أنه ليس 79 مليون..<br />قد يرد أحدهم ويقول أن شركة الاتصالات السعودية هي التي صرحت بذلك الرقم كما ذكر صاحب الميل، إلا أنني تتبعت أخبار تلك الشركة ولم أجد هذا التصريح..<br />الذي روج لهذا الميل يبدو أنه كان يروج للجزء الثاني من البرنامج.. أو أنه يهدف إلي إصابتنا باليأس والاحباط.. ويبدو أنه قد نجح"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044555/http://www.20at.com:80/article.php?sid=457"

[[comments]]
order = 3
subject = "نونا المجنونة"
text = "شكرا يا علي انا ياما اتخانقت مع ناس بسبب الموضوع ده لان الي يحرقك ان منهم مهندسين و ناس متعلمة حديث الشيطان ده واحد اقول له حرام تقول علي الرسول عليه الصلاة و السلام حديث بالكذب يرد يقول بس هو فيه كلام حلو<br />وكان مهندس عنده 27 يعني اخنقه ولا اعمل ايه قولي"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044555/http://www.20at.com:80/article.php?sid=457"

