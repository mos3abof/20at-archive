author = "وحتى السفير واعظا"
posted = "2009-10-21"
text = "شيخ الازهر بفعلتة فتح علينا ابواب الفتاوى حتى ان جناب السفير البريطانى رجع الى دور ووظيفة المندوب السامى البريطانى ايام الاحتلال ويعلمنا او يلقنا كيف نتعامل مع النقاب<br />لماذا اقحم الشيخ نفسة فى قضية قال هو عنها انها ليست من الدين<br />فى تحليلى الشخصى ان شيخ الازهر مدفوع بفعلتة هذة سياسيا وقال هذا الكلام نكاية او اغاظة للسعوديين<br />فمعلوم ان السعوديين ودول الخليج متمسكة بالنقاب<br />وهجوم شيخ الازهر على النقاب هجوم عليهم وعلى لبسهم<br />وزيارة الملك السعودى خادم الحرمين الى سوريا وتقارب السعودية مع سوريا ربما ضايق السياسيين فى مصر<br />فاوعزوا الى ازلامهم شيخ الازهر ووزير الاوقاف وهلال بتاع التعليم العالى كلهم فى وقت واحد فى حملة على النقاب ولبس النقاب<br />وظهر الغضب واضحا فى اعلام دول الخليج وهجوم حاد على الازهر والقائمين على الازهر<br />والنتيجة هى فقد الازهر الى مكانتة الدينية وفقد قدرا من احترامة بين الناس<br />ربما اكون مخطئا<br />ولكن تفسر بماذا سكوت الحملة على النقاب فجاة وكانها اصابتها السكتة القلبية<br />فشل فى كل المجالات"
