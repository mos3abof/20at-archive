text = "السلام عليكم<br />ى مسكات كتيرة اوى للقاء على حب الشباب<br />انا هقولك يا ايويه لى ماسك حلو اوى هيعجبك ان شاء الله<br />جيبى تلات معالق عسل وعلقة قرفه واخلطيهم وحطيهم على الوجه<br />ولو قدرتى تنامى وتصحى الصبح تغسلية ياريت يعنى حاولى باى طيقه خليه اطول وقت ممكن اعمليه كل يوم لمدة اسبوعين وشوفى النتيجه وقولولى ويارب اكون افدتك<br />ومعلش يا جماعه انا لسه جديدة ومش عارفه اضيف موضوع منين"
