posted = "2010-02-20"
text = "انا بقول ان اللى اتكتب لم يضف اى جديد لكن ما نريده هوا ازاله الحبوب … مثلا بمسكات طبيعه … ولا نريد استخدام الادوية الكيميائية … لانها يمكن ان تعلج حب الشباب لكن لها اثار تضر مناطق اخرى …<br />فا انا لدى طريقة ماسك بالتأكيد مفيدة لكل انواع البشرة لاننى جربتها كثيرا من قبل من فترة 3 اسابيع وهى<br />المكونات … ردة عيش و وماء<br />الطريقة … اضيفى بعض من ردة العيش فى صحن وعليها قليل من الماء جدا … ثم قومى بتنديه وجهك بالماء الفاتر .. ثم قومى بفرك وجهك بشكل دائرى بالخليط على وجهك كاملا .. ثم اتركى على وجهك ما يوجد به من الرده لمدة ربع ساعة على الاقل … ثم اشطفى وجهك بماء دافى … ثــــم نشفى وجهك بطريقة ناعمة …ليس بقوة … ثم ضعى الكريم الذى يناسب بشرتك<br />ويقوم هذا الماسك بازالة الدهون من البشرة مما يؤدى الى تقليل حب الشباب …<br />واتمنى ان يكون عجبكم الماسك بعد تجاربكم … وادعو لى بالنجاح .. يعطيكم العافية …"
archived = "2010-02-21"
capture_url = "https://web.archive.org/web/20100221090535/http://www.20at.com:80/banat/health-and-beauty/health/15391-2010-02-18-13-55-25.html"

