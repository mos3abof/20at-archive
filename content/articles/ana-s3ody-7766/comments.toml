text = "أنا أفضل المنزل طبعا ففي هذا الزمان لأحد يأمن على نفسه وخاصة أنه في ظرف ثواتني صورك قد تكون على مواقع ومنتديات الإنترنت<br />االمنزل أأمن وأكرم من الحمام"
