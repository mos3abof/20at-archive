author = "سماره"
posted = "2008-07-03"
text = "الأخت رشا تحيه طيبه واتمنى ان تجدي مواضيع افضل من ذلك والله مايصير مجهود عليكي وعلى المشرف اللي نزلك المووضوع انا من المتابعين لهذه المجله الرائعه القيمه لذلك ارجو عدم تكرار مواضيع غير هادفه (وين نقيس ملابسنا الجديده)…والخ إطرحي مثل هذه المواضيع في منتديات اوشات او غير ذلك وشكرا"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530122708/http://www.20at.com:80/ana-s3ody/7766.html"
