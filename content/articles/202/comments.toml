text = "بصراحة طلع واد جدع وعرف الزاى يضحك عليها<br />وانا طول عملرى نفسى فى واحدة تكون عندها مليون بس مش مليار<br />بس واضح ان ارامل مصر فقرانييييين زيهم زي الشباب تماااام"
