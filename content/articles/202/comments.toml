[[comments]]
order = 6
subject = "سيد ة القصر"
text = "اذنك معاك ياواد ياتقيل..<br />وياست وسام أنت أخطأت فهم الوضوع ..فنحن لا نتعارك حول شخص تيريزا..وإنما نناقش فكرة دور المرأة فى حياة الرجل ..وليست تيريزا محل التطبيق ..لأنها لم تقف وراء رجل معجزة ولا حاجة..<br />أما أنت ياراجل ياللى عندك دم..أنت ينطبق عليك مثل \"اللى على راسه بطحة\"..فلماذا أفتيت بأننى أعنى الرجال كلهم بكلمة \" ناس معندهاش دم\"..على الإطلاق أنا أعنى بعض الرجال وبعض النساء .. لأن سبب كببير فى وكسة الستات والرجالة معا عدم إدراك النساء لأهمية دورهن فى المجتمع..<br />ولا هو الإحساس بالذنب ؟ّ!"
archived = "2004-09-01"
capture_url = "https://web.archive.org/web/20040901180653/http://www.20at.com:80/article.php?sid=570"

