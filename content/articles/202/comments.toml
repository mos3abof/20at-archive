[[comments]]
order = 3
subject = "رجل عنده دم"
text = "ليه الغلط بس يا سيدة القصر، أنت أسمك سيدة القصر.. فخليك اسم على مسمى.... وبعدين قليلات السيدات اللاتي يقفن وراء أزواجهن... ولكن الكثيرات منكن ناكرات الجميل، وتظل وراء الزوج حتى يفتقر وعلى رأي المثل على ما اذكر (أنتفي ريشه أول بأول ليلوف على غيرك) عفوا لأني لا أحفظ الأمثال... ولكن أحببت أن استشهد بشيء في ثقافة سيدة القصر التي لا يعجبها الرجال..."
archived = "2004-09-01"
capture_url = "https://web.archive.org/web/20040901180653/http://www.20at.com:80/article.php?sid=570"

