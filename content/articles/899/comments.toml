subject = "حب أسامة دليل الايمان"
author = "من وجد في قلبه مثقال ذرة على الشيخ أسامة -حفظه الله وحرسه ونصره- فليراجع ايمانه ، فلعله نافق وهو لا يعلم."
posted = "2006-05-02"
text = "وأما الزعم أن المجاهد لا يختفي عن أعدائه ، فهذا زعم باطل ، فالمسلم مأمور بأخذ الاسباب في شؤونه كلها ، والاختفاء من الاعداء سبب من الاسباب ، ولا ننسى أن النبي -صلى الله عليه وسلم - اختفى في جبل ثور من قريش هو وصاحبه ابي بكر -رضي الله عنه - في طريق هجرته الى المدينة ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

