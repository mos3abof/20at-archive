order = 12
subject = "كيف يكون حب أسامة دليل الايمان ؟"
author = "أيها المسلم ، لو قلت لك أن ثمة رجل يسب الله ورسوله ، وإن رجلا أخر يحب ذلك الرجل الساب لله ورسوله ، ما عساك تقول عن الرجل الاخر ، ستقول على الارجح أنه منافق أو كافر ."
posted = "2006-05-03"
text = "فإذا قلت لك أن رجلا ملياردير أنفق ملايينه كلها في حرب الكافرين وأعوان الكافرين ، بل لم يكتفي بذلك ، بل حاربهم بنفسه هو ، وأختار أن يعيش طريدا شريدا ، كل ذلك في حرب الكافرين وأعوان الكافرين ، ما عساك تقول عن هذا الرجل ؟ على الارجح أنك تقول إن هذا رجل مؤمن ، والمؤمن يحب المؤمن ، ولا يبغض المؤمن الا منافق."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

