text = "يا جماعة من فضلكم عاوزين نفرق بين فترتين فى حياة المقاومة الإسلامية الباسلة<br />الفترة الأولى هى ما قبل خروج السوفييت من أفغانستان حيث كانت أمريكا راضية عن المقاومة و كانت تحاول أن تشجع الشباب المسلمين على الجهاد فى أفغانستان لأنها تعلم أنهم الوحيدون القادرون على دحر الدب الروسى و تقليم أظافرة و هكذا ظهرت شخصيات نبيلة آثرت الجهاد على الحياة المترفة-و على فكرة أغلبهم كانو من الأغنياء و ليسو صعاليك كما تحاول وسائل إعلامنا الآن أن تصورهم-مثل بن لادن و الظواهرى و000 من فضلك تابع التعليق"
