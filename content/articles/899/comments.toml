posted = "2006-05-12"
text = "الى كل المسلمين في بلاد العرب يجب ان نكون متحدين كما اوصانا الرسول صلى الله عليه وسلم افيقوا من غفوتكم انجدوا اخوانكم المسلمين الفلسطينيين و العراقيين كونوا متفائلين بالخير<br />قال تعالى _تعاونوا على البر والتقوى ولاتعاونوا على الاثم والعدوان_<br />اخيكم في الاسلام حكيم منالجزائر"
