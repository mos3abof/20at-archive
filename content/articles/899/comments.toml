author = "ابو عمر"
posted = "2006-06-07"
text = "بسم الله الرحمن الرحيم والحمد لله على نعم الاسلام وان جعلنا من اهل السنه والجماعه والعزه لله ولرسوله والمؤمنون اخوانى رجاء اولا ان تتقو الله تعالى فيما تكتبون وان لا تصبحو ممن يطعنون فى المجاهدين وبدلا من نصرتهم او الدعاء لهم اجد من المسلمين من يتهمهم باتهامات باطله اخوانى هذا ما فعله فيكم اعلام امريكا واذنابها جعلكم تتشككون ان يكون هناك مجاهدين حقا يفعلون كل هذا بامريكا طارت العقول يوم غزوه منهاتن المباركه ولم يتخيل احد وحتى الان انه من الممكن ان يقوم اسود الاسلام بهذه العميله الخطيره والكبيره جدا سب البعض شيخنا اسامه بن لادن على هذه العميله وقالو ان فيها دمار للمسلمين وانها السبب فى غزو البلاد المسلمه وللاسف ما زال المسلمين يفكرون بالطريقه الامريكيه حتى الان لم يفهمو ما يدور فى العالم اجمع ضد الاسلام يريدون اقتلاعه ولكن بعدا عنهم باذن المولى عز وجل غزوه منهاتن او ما يسمى ب11 سبتمبر كان الهدف الاول فيها اذلال امريكا واظهارها على وجها الحقيقى الحقير وانها ليست منيعه كما يظن البعض وايضا ضربه مركزه ضد اقتصاد صهيون والصليبين خسرو فيها مليارات لا تعد ولا تحصى وايضا ضربه لاكبر مركز تدار فيه المؤامرات ضد العالم الاسلامى وهوه وزاره الدفاع الامريكيه البنتاجون التى من الله علي المجاهدين بتدميرها هنا ياتى الهدف الاكبر من هذه الغزوه وهى اخراج امريكا من دارها التى تظن انه محصن الى اماكن نريدها نحن فيها فجاءت الى ارض الاماره الاسلاميه فى افغانستان والحمد لله تعالى والمنه لله حصد المجاهدين من رءوس الصليبين ما يزيد عن 30 الف وهذه هى حقيقه قتلاهم الى جهنم وبئس المصير واصيب منهم الالاف الكثيره معظمها حالات انتهت تماما حياتها بما حل بها من بلاء ثم جاء دور العراق لتلقى امريكا حتفها داخله والحمد لله ويقتل منهم الالاف وكثيرا من المصابين ايضا الميئوس من عودتهم الى حياتهم السابقه وفى نفس الوقت يؤدى القسم الاعلامى فى الجبهه العالميه لقتال اليهود والصليبيين دوره فى انزال الهزيمه باعلام اقوى دوله فى العالم فيعترف طواغيتها بالهزيمه وينصر المسلمين فى هذه المعركه اخوانى ارجو منكم رجاء ان تتقو الله تعالى فى المجاهدين وان لا تتطعنو فيهم بغير علم لان هذا حسابه عسير عند المولى عز وجل اتقو الله وان لم تقدرو على مساندتهم فعلى الاقل بالدعاء او السكوت لانهم يرفعون عن الامه بلاء كثير فهم دعامه الاسلام ياذن الله وتذكرو اقوال رسول الله صلى الله عليه وسلم فى الجهاد وان ذروه سنام الاسلام وعماده وان باق الى يوم القيامه والنصر للاسلام باذن الله تعالى<br />تذكير اخير لعل الله يجزينى عليه بان لهذه الامه امير وخليفه يرعى شئونها ويقوم بواجبه تجاهها حاليا مجاهد ومستقبلا باذن الله مؤسسا لدوله الاسلام العالميه وهوه امير المؤمنين الملا عمر حفظه الله تعالى ومن معه من المجاهدين صابرين محتسبين حالهم عن المولى عز وجل ولا اله الا الله محمد رسول الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

