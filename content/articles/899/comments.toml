[[comments]]
order = 4
subject = "شكرا يا عبد الله"
author = "نيفين"
posted = "2006-05-02"
text = "الف شكر يا عبد الله علشان نفسى حد بجد يوقف اخمد عبد المعطى حجاوى عند حده<br />هتفرج عليه ان شاء الله<br />و بالنسبه للموضوع انا بس عايزه اقول يا بصرف النظر عن كل حاجه يا جماعه الجزيره عايزه جنازه و تشبع فيها لطم<br />و بتمنى اصحى ف يوم الاقيها اتشالت من الوجود<br />و كله كوم و اللخبطه اللى بتقولها ف موضوع ايرؤان و امريكا كوم<br />و الناس هبله و بتصدق<br />ال احنا مش عارفين ان اصلا فيه تحالف استراتيجى بين امريكا و ايران بان امريكا تدخل الايرانيين الشيعه للعراق للقضاء على السلفيهو بكده امريكا بتقضى على الاسلام بالمع وجوهه فى مقابل ان امريكا تعمل نفسها مش شايفه البرنامج النووى لايران<br />علشان تبقى رقم 10 ف النادى النووى الدولى<br />فبجد كفايه لعب بعقولنا بقى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

