subject = "السلام عليكم"
author = "مصري"
posted = "2006-05-21"
text = "انا مستغرب من الناس الي بتقول ان أمريكا لو عايزة تمسكالشيخ المجاهد أسامة بن لادن كانت مسكته هي أمريكا دي رب العالمين لا حول ولا وقوة إلا بالله<br />يا أحبة كل شئ بيد الله سبحانه وتعالى وليس بيد أمريكا إذا أراد الله أن تنتهي أمريكافي لحظة لقال كن فيكون<br />أمريكا ولله الحمد مرغت أنفها في التراب<br />اللهم انصر اخواننا المجاهدون في كل مكان<br />اللهم انصر عبدك الشيخ أسامة<br />اللهم انصر عبدك الدكتور أيمن الظواهري<br />اللهم انصر عبدك المجاهد أبو مصعب الزرقاوي"
