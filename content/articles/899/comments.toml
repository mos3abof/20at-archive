author = "واحد منقوط"
posted = "2006-05-08"
text = "ولكن...بعد إنهيار الإتحاد السوفيتى و تحول أمريكا إلى قطب أوحد صارت أمريكا باحثة عن أى قوى قد تمثل ند فى المستقبل يكبل حركتها أمام المجتمع الدولى او أى تراث حضارى قد يصعب هضمه داخل إمبراطورية المجون ورأس المال التى لا ترحم و قد كان هناك قوتان مؤهلتان للعب دور الندو هما:<br />1)الصين كقوة باطشة و وريث جغرافى للإتحاد السوفيتى<br />2)الإسلام كأيديولوجية متكاملة ترفض الظلم والإستبداد<br />و قد عمدت أمريكا-و معهاوسائل الإعلام العربية- إلى تشويه صورة المجاهدين الأفغان حتى ارتبطت فى أذهان الناس بالإرهاب خاصة بعد أن بدأ الفغان يتخبطون بعد ان فقدوا الهدف وبعد خروج السوفييت و بعد أن أصبح المجاهدون القادمون من بلاد آخرى عبئاعلى الدولة الوليدة<br />ولذا ينبغى أن نفرق بين الصورة الرائعة التى كان عليها المجاهدون الأفغان و بين الصورة الزائفة التى تصنعها أمريكا بالشرائط المزيفة و التى لا يصعب عليهم تزييفها خصوصا أنهم يمتلكون آلاف التسجيلات لرموز المقاومة الأفغانية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

[[comments]]
order = 20
subject = "الزرقاوى"
author = "واحد منقوط"
posted = "2006-05-08"
text = "أماالشخصيات التى ظهرت فى العراق مثل الزرقاوى-والذى أشك فى وجوده أصلا- فهى كلها شخصيات مخترعة و لا تمثل المقاومة العراقية و المقاومة العراقية أساسا لا تمثلها منظمة ما أو فصيلة ما فهى معتمدة على القدر الضئيل من السلاح الذى وزعه صدام على العراقيين قبيل الغزو<br />والهدف من (صناعة)هذه الشخصيات هو تشويه صورة المقاومة العراقية المشروعة و إظهار العراقيين بصورة الهمج الغير قادرين على حكم بلادهم و الحفاظ على ثرواتهم مما يضفى الشرعية على الإحتلال كما أنها-اى تلك الشخصيات-تخوف العالم من الإسلام و تصور الجهاد على أنه قتل شهوانى جاهلى بذىء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

[[comments]]
order = 21
subject = "حقائق لا بد و أنك لاحظتها"
author = "واحد منقوط"
posted = "2006-05-08"
text = "1)العمليات الزرقاوية لا يسقط فيها جندى محتل واحد<br />2)كل عمليات الزرقاوى لها سيناريو واحد(سيارة مفخخة تنفجر فى تجمهرما أو تنفجر فى تجمع شيعى لبذر الفتنة)و ليس صعبا على الأمريكان أن يزرعوا سيارة مفخخة هنا أو هناك (ما هما اللى مسئولين عن الأمن)<br />3)أسلوب المقاومة العراقية الشريفة هو قتال المحتلين وجها لوجه و ليس التفخيخ<br />4)من المستفيد من قتل الصحفيين؟؟!<br />5)ما الذى يمنع أمريكا من شراء العملاء و الطابور الخامس ليقوموا بذبح من لا يعجبها من نشطاء حقوق الإنسان -لاحظوا أننى قلت ذبح و ليس خطف لأننى لا أستبعد أن تكون قولت الإحتلال هى المسئولة عن خطفهم<br />6)يجب أن لا ننسى أحلام إسرائيل الواسعة ويد الموساد الخفية فى العراق( و لمن لايعلم فإن الخطان الأزرقان فى العلم لاإسرائيلى يمثلان النيل و الفرات و المقصود هو حلمهم بإمتداد دولتهم من النيل إلى الفرات)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

[[comments]]
order = 22
subject = "ابحث عن اليهود والامريكان"
author = "صاحب خبره"
posted = "2006-05-10"
text = "عندما ترى العلماء يقتلون بالمئات فىكل مكان فابحث عن اليهودعندما ترى كل شيى يغتصب فابحث عن اليهود والامريكان عندما ترى التفجيرات الارهابيه فى اى مكان ابحث عن اليهود والامريكان عندما ترى الفتن الطائفيه في اى مكان ابحث عن اليهود والامريكان عندما ترى الموازين مقلوبه والحقائق مغيبه ابحث عن اليهود والامريكان عندما ترى حماس والديموقراطيه الحقيقيه مرفوضه ابحث عن اليهود والامريكان ****عندما ترى الخزى والعار والهوان وخيار الاستسلام الاستراتيجى فابحث عن الحكام العرب العملاء لليهود والامريكان .......قلت قليل من كثير !!!!! ربما الزانى يتوب ربما يحمل ماء فى ثقوب ربما شمس الضحى تشرق من الغروب ربما الشيطان يتوب لكن لا يبراء حكام العرب من زنب الشعوب *************************************"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

[[comments]]
order = 23
subject = "انتبهوا...!"
author = "المجهول_س"
posted = "2006-05-12"
text = "اولآ اشكركم جميعآ لتطرق الى هذا الموضوع.<br />وثانيا<br />احذركم من المخططات الارهابيه الحقيقيه التي تمارس على الشعوب من قبل النصارا واليهود تحت مسمى الحرب على الارهاب سوف اثبة لكم انها حمله صليبيه على الاسلام<br />لو لحضتم في مجريات الاحداث من الحدي عشر من سبتمبر اليومنا هذا حتي الايام القادمه...<br />لعرفتم انها مخطط الحمله الصليبيه جاهز منذ سنين انا الخطه ترمي لاحاطة الدول الاسلاميه والمسلمين وجزيرة العرب خاصه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

