posted = "2006-05-20"
text = "يعني هلأامريكا ما بتقدر تمسك بن لادن حتى لو ما اله اشرطه بتقدر تمسكه بس ما بدها علشان تبقى ذريعة الهم علشان يبقو بأفغستان لأنها بطل على بحر قزوين هم ما بدهم بن لادن هم بدهم افغانستان متل ما صار في العراق مع صدام<br />آل شو دورو عليه ما لقو مهو على بين عملو حالهم بدورو واوهمونا انه متخبي فرضو سيطرتهم على المنطقة<br />وسبحان الله بس سيطرو واستعدو واحتلو العراق وبسطو سيطرتهم لقو"
