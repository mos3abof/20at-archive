[[comments]]
order = 46
subject = "ال سعود حكامنا الابطال"
author = "احبك ملكنا عبد الله"
posted = "2006-06-25"
text = "ان الارهابي الضال اسامه بن لادن ماهو الا انسان منحرف يشكوا من املراض نفسية خطيرة الا وهي حب العظمة والسلطان يريد ان يحكم العالم يظن هذا الصعلوك ان بملايينه التي جمعتها اسرته من ارض السعودية انه يستطيع ان يشتري العالم وعقول الناس فهو ذليل ومن يموله با الاموال لقتل الانفس البريئة فهو ارهابي مثله وعلى شاكلته وبعدين من هو اسامه بن لادن ذلك اليمني الاصل الذي اتت اسرته للسعودية للحصول على لقمة العيش للاسف اهكذا تتم الامور هل جزاء الاحسان الاساءه حتى انه اساء لباقي افراد اسرته الذين لاذنب لهم وادعوه من هذا الموقع ان يعود الى رشده ويسلم نفسه هو واعوانه لينفذ جكم الله فيهم ماذنب الاطفال الابرياء والنساء والشيوخ الذين قتلوا بنيران قنابلهم الملعونة ولكن اقول حسبي الله ونعم الوكيل فيك يا اسامه والظواهري وشركائكم في القتل والتدمير<br />ماذنب الطفلة التي كانت تلهوا حول سور منزلهم وبقنابلكم الملعونة قتلت يكفي دعاء امها عليك واكرر سلم نفسك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

[[comments]]
order = 47
subject = "اي نوع من انواع الاسلام نتبع"
author = "علي السعدي"
posted = "2006-06-26"
text = "يا اهل العلم هل من مغيث ينصحنا اي نوع من انواع الاسلام نتبع,هل اسلام بن لادن وتفجير الطائرات المدنية والابراج ديننا,ام دين الزرقاوي والذبح من الوريد الى الوريد لاي انسان يخالفنا الراي,ام نترك الدين ونبحث عن دين جديد,لقد شوه هؤلاء الكلاب الدين والجهاد,بن لادن يحلل قتل النصارى واليهودواي ديانة اخرى لا بل يحلل قتل المسلمين اذا لم يؤمنوا بما يؤمن,هل من مجيب يا بشر الم يكن جار النبي(ص)يهوديا ,لماذا لم يقتله النبي لانه يهودي ام ان النبي بنظر هؤلاء الكلاب لايملك الشجاعة التي يملكونها في قطع الرؤس,الم يسمعوا بنصائح انبي لجيش المسلمين وتحذير الجنود من قطع الاشجار وترويع الاطفال ,حسبنا الله ونعم والوكيل اللهم اقطع دابر التكفيريين الذين عاثوا بالارض فسادا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

