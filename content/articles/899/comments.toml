text = "سلام<br />1 بن لادن كلب صناعه امريكيه ومن ينكر دالك فهو جاهل او يتجاهل<br />2اكثر من شوه سمعت الاسلام هو بن لادن واعوانه<br />3 الزرقاي كلب والله ارانا فيه يوم وهو الان مع ابولهب وابو جهل في الدرك الاسفل من النار يكفي قتله لمات الابرياء بلعراق<br />الشقيق وقتل العمال والطلاب وخطف الابرياء هل هدا انسان<br />4 كل من يرضى بعمل بن لادن او الزرقاوي فهو شريك<br />نيفين<br />انتي فلتة زمانك في تحاليلك الغبيه الممتازه بلغباء<br />باي"
