posted = "2006-05-03"
text = "شوية عيال لسه بيا خدوا مصروفهم من ابوهم ويمكن مقراش الا تلت اربع كتب في حياته وقال ايه يااخوي بينتقدوا الشيخ اسامه بن لادن اللي ترك متاع الدنيا والدنيا عند قدميه من اجل ان يدافع عن منهجه الي يؤمن به<br />سواء وافقته او لم توافقه لابد ان تتكلم بادب عن الشيخ اسامه بن لادن<br />اما الاخت اللي اسمها نفين وبتقول ان نفسها يشيلوا قناة الجزيره طيب لما مش عجباكي الجزيره اجوكي اديني مثال علي القنوات اللي بتعجبك<br />اما بقي حكاية ان فيه تحالف استراتيجي بين ايران اامريكا ده كلام فيه من الجهل ما يفوق كل الحدود ولا يستحق ان الواحد يتعب نفسه بالرد عليه"
