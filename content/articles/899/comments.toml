[[comments]]
order = 36
subject = "المخابرات الاردنية تغتصب الرجال"
author = "ابو اسامه"
posted = "2006-05-24"
text = "بعد التحية المؤلمة<br />قابلت في أحد المطاعم ليلة أمس شاب يقول.....<br />أن الحكومة الأردنية لاتمد للإنسانية أو للإسلام أو لأي دين عرفته البشرية أو حتى للكفر أي بمعنى أنها أحقر من ذلك بكثير وبل أخص دائرة الزندقة وعبدة شارون(المخابرات الأردنية)<br />وكان السبب في قوله ذلك :-<br />انهم استدرجوا هذا الإنسان البريء إلى دائرة المخابرات في الأردن وبعد وضعه تحت التحقيق في الأدوار السفلا تحت الأرض في المبنى الواقع بجانب الدوار الثامن وهو معروف جدا.......<br />بداءة الأسئلة الخرافية من نسج الشيطان والله قد يكون الشيطان اشرف منهم بدرجات وبعد أن شكوا بأنه (الفتى المتحدث) ينهج بنهج الإسلام والجهاد في سبيل الله قاموا باغتصابه بكل الطرق المعروفة لدى الشيطان والطرق التي لم تخطر على بال الشيطان....<br />وقالوا له اذهب يا مجاهد جاهد<br />نقطة لا أقول مع السلامة ولكن (سالمات)<br />يا عقلاء أسال الله أن يحمي كل إنسان من ذلك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

