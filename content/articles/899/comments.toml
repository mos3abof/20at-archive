[[comments]]
order = 27
subject = "واعتصموا بحبل الله جميعا ولا تفرقوا"
author = "مش مهم"
posted = "2006-05-13"
text = "انا بس حبيت اضيف على كل التعليقات اللى الاخوة والاخوات امتعونا بها ان لازم نكون متاكدين اننا كمسلمين هدف امريكا الوحيد هو اننا دايما يكون مشغولين فى حاجات هم اللى بيصنعوها لينا علشان ما نحاولش نفكر نطور انفسنا او نفكر نستغل العقول اللى موجودة عندنا فى شخصية مثل احمد زويل او مجد يعقوب او غيرهم وهم كثيرون المهم عندهم ان مافيش اى حد من ابناء هذه المة يفيدها مباشرة وان كان ولازم يبقى لازم يكون من خلالها<br />ولوشفنا اللى بيحصل الان من ايران هنجد ان امريكا مش مهم عندها ان ايران تمتلك السلاح النووى او لا المهم هو ازاى قدرت تتطر نفسهاوتشتغل على الابحاث دى وازاى لم تلجا لها وتطلب من المساعدة وده معناه بالنسبة لها خروج عن طوعها اوانا اسف فى اللفظ بس هى شافت ان اللجام اللى كانت فضاه على الامة فى واحد قدر يتخلص منه جزئيا ويقول لها لأ انا اقدر استفيد من شعبى بعيد عنك وعن سيطرتك<br />المهم ان لو حكام العرب خرجوا وبعدوا شوية عن مضمار امريكا اللى هى سايباهم يجروا فيه كا الانعام واعطوا لشعوبهم الفرصة يخرجوا الطاقات الموجوده عندهم<br />صدقونى ولا كنا هانشوف بن لادن ولااغيره<br />ولكن صدقونى طول مافى ظلم وطول مافى استبداد فى الراى من حكومتنا اللى بتعتبرنا جزء من الميراث بتاعها هنلاقى كل يوم الف بن لادن وساعتها ما فيش حد هيلومه<br />اين اذهب فى هذا الكون والظلم رفيقى<br />وكلما هربت منه وجدته يظلم لى طريقى<br />فوالله لاسحقنهقبا ان يسحقنى ولو اتخذت بن لادن رفيقى<br />اسأل الله النصر لاخواننا المجاهدين فى فلسطين وان يرد لنا القدس والمسجد الاقصى من ايدى اليهود الملاعين ابناء القردة والخنازير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

[[comments]]
