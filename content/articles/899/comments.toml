[[comments]]
order = 8
subject = "ما هو الجهاد ومن هم المجاهدون"
author = "مصطفى احمد"
posted = "2006-05-02"
text = "فى الحقيقة كنت نويت ان اكتب لكم موضوع مبسط عن الجهاد والمجاهدين ولكن المساحة محدودة وعندى الاستعداد امداد الموقع بالموضوع كامل غير منقوص بأذن الله والأميل عندكم.<br />ولكن نقول ان هناك فرق كبير بين الجهاد والقتال .<br />سيدنا محمد صلى الله عليه وسلم جاهد فى الله حق جهادة نعترف بهذا جميعاً فهل اختبأ الحبيب المصطفى ولم يعلم مكانة عدد سنين ام كان معرف المكان بدون حراسة تذكر لا نقول هذا رسول ومؤيد من الله فالله جعلة اسوة حسنة لمن كان يرجوا الله واليوم الأخر .<br />المجاهدون فى كل مكان صلاح الدين قظز عمر المختار حسن البنا سيد قطب ... القائمة كبيرة وكثيرة وما هذه الا نماذج.<br />هل الدعاة العاملين أليسوا مجاهدين شيوخنا القرضاوى وعلى جمعة البوطى عمرو خالد ... القائمة طويلة .<br />نحن لا نريد ان نجرح فى احد لان هذا ليس دورنا ولكن نبين الحق ومن يريد ان يفهم ويتعلم ويعمل فأهل به وسهلا واما من عاند وكابر فنقول له الحديث الشريف يقول لا يدخل الجنة من كان فى قلبة مثقال ذرة من كبر."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

[[comments]]
