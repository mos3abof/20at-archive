text = "السلام لكم واليكم ...الرجل خدمنا وفي نفس الوقت لاتنسوا انه من عائله ثريه جدا ...وقد ضحى بكل هذا واستثمره بالجهاد..المهم مهما ظهرت من تسجيلات ..وان كانت صحيحه ام غير ذلك ..المهم انتبهوا ان كل تسجيل كان لابن لادن ..وهو يظهر به وتلاحظون ان الصوت يسبق الصوره فأنه مفبرك ..اي من فعل عائلة بوش القرده...واذا كان التسجيل واضح اي مابه اي تسارع في الصوت او الصوره فأنه حين ذاك صحيح ....لانه مهما كانت التقنيه الكترونيه متطوره فلن تفلت من ذلك...لان الموضوع فني وليس اعلامي...<br />....اخوكم مهندس الكترونيات"
