text = "فلقد قامو باحتلال افغانستان وبنو معسكراتهم فيها وبهذا وضعو ايديهم في الجه الشرقيه لجزيرة العرب وبعد ذالك تحركة الحمله لاتجاه الشمال واحتلة العراق وبذالك تكون قد وضعة يدها في اتجاه الشمال وفي هذه الايام يبحثون عن دوله في اتجاه الغرب ليضعو يدهم عليه لتكتمل عملية الحصار وناهيك عن التواجدهم في الوسط اي جزيرة العرب فمن هنا ادعوكم لعدم التسامح والتهاون امام الحمله الصليبيه الجائره على الاسلام والمسلمين."
