[[comments]]
order = 51
subject = "اللهم احشرني مع اسامة.واحشر الكلاب مع سيدهم بوش ."
author = "ALG"
posted = "2006-07-24"
text = "في وقت الاستعمار الفرنسي للجزائر,كانو بعض الكلاب الجزائرين الموالين يقولون = كيف يمكن لفئة ان تغلب فرنسا وقد كانت الاقوي في العالم ؛؛ لماذا لايتروكنا نعيش في سلام مع الفرنسين. انهم حقا يعشيون معهم سويا الان في جهنم.احمد لله.<br />وانشاء الله سيعيش كل محب مع محبه.هناك رجال وهناك ذكور,فيا ايها الذكور الم ترؤا غير اسامة كي تنتقدوه؟؟؟ مبارك اه رجل. زين العابدين تونس ممنوع الحجاب اه رجل . المتشدد بوش و بلير اه كم قتلو الاطفال اه انتقده تجد نفسك في جوانتنمو اه. ابو بوش اه صحابي .الجبهة الاسلامية للانقاد الجزائرية انقلاب لاأحد يتكلم .تعرفون إلا اسامة ,و الأخرون اصحاب الجنة. النفاق والإعتناق.تحيا اسامة ويسقط الكلاب من العرب والعجم.الحمد لله.<br />ألي يحبنا نحبوه ونحطوه فوق راسنا كي لعمامة ـ ولي يكرهنا نكرهوه حتي يوم القيامة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

