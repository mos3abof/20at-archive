posted = "2006-05-15"
text = "ويحكم ..بن لادن ورجاله اعادوا لهذه الامة كرامتها .. كيف تزاودون على رجل مثل بن لادن .. هل تصدقون كل ما يشاع في وسائل الاعلام المتصهينة من ادعائات كاذبة ضد المجاهدين .. اليس الزرقاوي هو من يقود المقاومة الاسلامية في العراق .. الم يتباهي باسلحة الامريكان التي اهينت في بلاد الرافدين كما اهين شارون و جنده في غزة ...<br />بالله عليكم استفيقوا وحاربوا الطغاة و العملاء بدلا من النقد الفارغ من امام شاشات الكمبيوتر ..<br />تحياتي<br />على فكرة ..<br />كل الفلسطينيين يحبون بن لادن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

