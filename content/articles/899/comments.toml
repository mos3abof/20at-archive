[[comments]]
order = 0
subject = "ممكن أسأل سؤال ولكن أنتظر الرد"
author = "ابن الإسكــــــــــــــــندرية"
posted = "2006-05-01"
text = "ممكن أسألكم سؤال؟؟؟؟؟؟؟<br />أنتم مين إللى قال لكم إن فى حاجه أسمها بن لادن ؟؟ أيوة أنا معاكم إن فى واحد أسمه أسامه بن لادن<br />بس مش كل مايحصل تفجير نقول بن لادن وبعديها بيوم نلاقى شريط على الجزيرة فيه أسامه بن لادن ويقول المزيعه ( وصل إلينا شريط مسجل من أسامه بن لادن لن يتثنى للجزيرة التأكد من مصدره ) مأئة شريط تم عرضه على الجزيرة تحت عنوان لم يتثنى للجزيرة التأكد من مصدرة<br />أنا هنا بتساااااااائل الجزيرة بتجيب الشريط منين؟؟ واحد هيرد عليا وهيقول أسامه بن لادن بيبعتهلها طيب مش أمريكا عاوز تمسك بن لادن كان من الطبيعى بعد عرض أى شريط عنه أن تذهب أمريكاإلى قناة الجزيرة وتقوم بالتحقيق معها من أين تأتى بكل هذه الأشرطه (الكليبات ) يومياً<br />أنا حاسس إن الموضوع فى لعب كبييييييييير<br />وشكراً<br />أنتظر الرد وأتمنى أن أرى تعليقاتكم<br />أخوكم/ ابن الاسكندرية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

[[comments]]
order = 1
subject = "أمريكا ليست رب العالمين"
author = "الى المهزومين في دواخلهم ، اعلموا أن أمريكا ليست رب العالمين ، وأن ما تريده يتحقق لها ."
posted = "2006-05-02"
text = "فانظروااليها ، كيف خذلها الله ، وهزمها ، فهاهي قد جيشت الجيوش وأنفقت الاموال ، واستعملت الخونة كال سعود الفاجرين وحسن مبارك الفاجر وبرويز مشرف العاهر وملك الاردن الخائن ، وغيرهم كثير من الخونة ، كل ذلك في القبض على شيوخ الجهاد فباءت بالفشل الذريع ورجعت بالخبية (أسأل الله أن يديم حفظ المجاهدين قائمين وقاعدين ، وأن يقلبهم اليه غير خزايا ولا مفضوحين) .<br />فهاهم شيوخ الجهاد وعلى رأسهم الشيخ أسامة (أسد الاسلام) حيا يرزق ، بل يوجه الامة ، ويحرضها على قتال الكافرين والمرتدين فلله جزيل الحمد وعظيم الثناء.<br />أيها المهزمون ، إن معركتنا طويلة مع الكافرين والمنافقين ، فاعدوا العدة لذلك بعلاج نفوسكم المهزومة ، باليقين أن أمريكا قد هزمت أو كادت على يد فئة مؤمنة صابرة (كم من فئة قليلة غلبت فئة كثيرة بإذن الله)."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

[[comments]]
order = 2
subject = "انا اوافقك الرأي"
author = "ام عزت"
posted = "2006-05-02"
text = "السلام عليكم ورحمة الله وبركاته<br />اوافقك الرأي يا اخي بن الأسكندرية كمان بصراحة من كتر ما شوية يقتلو مسلمين و شوية احس انه مع امريكا كمان لما بيقتلو الشيعة المدنين احس انهمع امريكا عشان امريكا عايزة توقع فتنة بينا و بين الشيعة لتقسم بلادنا و دا طبعا في مصلحتها و مش ممكن يكون قائد محنك يرتكب خطأزي دا لأنه بيساعد على قيام حرب اهلية وبث الغضب و الحقد في نفوس المسلمين<br />ثانيا ساعات برضه احس انه ضد امريكا لما يقتل الجنود الأمريكان شئ فيه لعب كبيرا فعلا اكيد و اكيد امريكا بتلعب بينا زي العرايس الماريونت و بتضحك علينا<br />اللهم ارنا الحق حقا فنتبعه و أرنا الباطل باطلا فنجتنبه و لا تكلنا الى نفوسنا فنضا ضلالا بعيد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124807/http://www.20at.com/article2.php?sid=756"

