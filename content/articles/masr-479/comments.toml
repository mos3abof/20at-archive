order = 0
subject = "حبيبك يمضغ لك الزلط"
author = "لم تعد مصر تستطيع الا ان ترحب بأى شىء قد يفعله الراعى الامريكى و الصديق الاسرائيلى حتى لو كان امتهانا لكرامه و أمن مصر طالما لايمس عرش الفرعون الاله"
posted = "2006-06-08"
text = "فماذا يعنى قتل عده حشرات مصريه لاقيمه لها؟ لا شىء و كيف كان الرد لا شىء<br />بالعكس فالصديق الاسرائيلى يستحق الشكر خاصه و انه قدأراح عددا من المصريين فلن يعانوا بعد الان وكذلك فقد قلص عدد سكان مصر فساعد فى رفع جزء من العبء عن كاهل الحكومه وهذا ما جعل مبارك يضحك ملء شدقيه طوال لقاءه مع اولمرت<br />بالمناسبه<br />اثبتت تلك الصوره صحه نظريه دارون \"النشوء و الارتقاء\"<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأه يـــــأ بـــــلـــــــدى"
archived = "2006-12-15"
