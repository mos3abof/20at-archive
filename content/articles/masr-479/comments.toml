text = "اسائيل تتعامل معنا بطريقه ممثل اسمه احمد البرعي في فيلم النوم في العسل عندما كان ينعني الرجوله الضائعه ويقول (اهم حاجه بين الراج والست بتاعته الاحترام والاحترام فقط)<br />ولو مات 10 من المصريين برضه مش مهم المهم ان دماغ المصريين تتمرمغ غي التراب وابو دماغ كبيرة (حسني واللي معاه) لازم دماغه تبقي عاليه مدام بيسلم علي ويحترم بتوع اسرائيل غصب عنه ومش بمذاجه<br />ولكي الله يااااااااااااااا مصرنا"
