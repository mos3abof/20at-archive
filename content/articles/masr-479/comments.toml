text = "من الأفضل ان تنشغل الأمة الأسلاميه بالأحداث المؤسفة التي تحدث لأخواننا المسلمين في فلسطين ولبنان وان يتفننوا في التفكير والوصول الي رد فعل منهم يجازيهم الله خير عليه يوم الحساب فضلاً من ان ننشغل بالفنانات العاهرات فوقوا يا بشر من الغفلة التي تعيشونها ( لحد امتي ) فوقوا بقي"
