[[comments]]
order = 8
subject = "استغفروا الله"
author = "سمراء"
posted = "2006-06-13"
text = "السلام عليكم و رحمه الله و بركاته<br />مش فاهمه ايه لزمه وضع صوره الممثله اللي لسه متحجبه قريب بل و التعليق من قبل الكاتب على حجابها بقوله انه حجاب استعراضي!!!!!!!!!<br />هو حضرتك دخلت في قلبها و عرفت نيتها؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />و ليه تحط نفسك يوم القيامه قدام ربنا في خصومه مع حد؟<br />على كل حال ده كان رايي لاني زعلت جدا من الكلام و الصوره<br />المفروض نشجع مش نثبط<br />و جزاكم الله خيرا<br />و السلام عليكم و رحمه الله و بركاته"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215042157/http://masr.20at.com:80/article.php?sid=479&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "اتقي الله يابعيد"
author = "ام العيال"
posted = "2006-06-13"
text = "يعني معلش اللي كتب المقال بصراحة مش ربنا علشان يقول انه حجاب استعراضي..وانت اش عرفك اساسا..ولا انت عاوزها بلد علمانية الرقصات تفضل فيها للصبح..يااخي اتقي الله..<br />وبعدين اية دخل حنان ترك واسرائيل..<br />ولا انت زي شعبان عبدالرحيم..<br />بصراحة انا شايفة ان احنا في فترة ذل وهانت كرامتنا على كل الامم<br />واية يعني يموت اتنين تلاقي الريس قال كدة لما سمع<br />وممكن كمان فكر انه عنده 75مليون لما ينقص اتنين احسن<br />اهوة يقل الناس اللي بتنتقده<br />وبعدين حد فكر همة كانوا متسلحين اية<br />على مابسمع انة ممنوع التسليح لينا ومسموح ليهم<br />وتلاقيه كان سباق بين الصهاينة علشان يصطادوا المصريين<br />ماحنا ولاد...........مالناش صاحب يسال علينا<br />اه نموت نموت بس تحيا مصر والله"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215042157/http://masr.20at.com:80/article.php?sid=479&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "المهم والاهم"
author = "مسلم"
posted = "2006-06-13"
text = "قد يكون ارتداء احدى الفنانات للحجاب خبر هام يلفت الانظار لكن اذا ما قورن بما يحدث من مهازل فى المجتمع وفى العالم اجمع فانه يصبح بلا قيمة واعتقد والله اعلم ان الكاتب كان على حق عندما قال ان الناس تهتم بالاخبار التى لا فائدة منها فى حين يتجاهلون كوارث تحدث حولهم وفى حاجة حقيقية للاهتمام بها مثل المصريين الذين يموتون بين الحين والاخر على يد الصهاينة , اظن ان هذا اولى بالاهتمام به بدلا من الاهتمام بحجاب احدى الفنانات الذى يعترض البعض على وصف الكاتب له بانه حجاب استعراضى , نعم هو حجاب استعراضى بلا ادنى شك لان الحجاب الشرعى يجب ان تتوافر فيه خمس شروط والا اصبح بلا فائدة واصبح وجوده مثل عدمه وكما ان الحجاب مثله مثل اى امر من امور الدين يحتاج نية خالصة فانه فى ذات الوقت يتقيد بان يكون على الشكل الذى شرعه الله عليه , وهذا لا يعنى اننا ننكر على هذه الفنانة ارتدائها لما اسمته بالحجاب ولكن ننكر عليها عدم التزامها بشروط الحجاب الشرعية وبدلا من ذلك التزمت بشروط الحجاب على الموضة ناهيك عن تاثيرها كفنانة على الفتيات الذين سيقلدونها ويرتدون حجابا ليس بحجاب واعود مرة اخرى الى المهزلة التى نعيشها نحن المصريين , نحن الذين نتعرض للذل والهوان من داخل بلادنا ومن خارجها فاذا كانت كرامتنا لا تصان داخل بلادنا ونتعرض للضرب والتعذيب بل والموت على ايادى قوات الامن ( الحقد ) المركزى فلا عجب ان يستهين بنا اعدائنا ونموت على ايديهم ولا يدافع عنا احد , نحن الذين اهملنا فى حقوقنا ولذلك اصبحت دمائنا رخيصة , وحتى ان وجد بيننا من يرفض الذل والهوان ويناضل من اجل حريته وكرامته يكون مصيره الاعتقال خلف جدران النسيات لان الحرية والكرامة لا يمكن استردادها الا بارادة جماعية وثورة على الاوضاع , لكن فى النهاية الشئ الاكيد<br />اقرأ بقية التعليق .."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215042157/http://masr.20at.com:80/article.php?sid=479&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

