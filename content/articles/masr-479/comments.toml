[[comments]]
order = 14
subject = "اسمعوا اغنية وين الملايين يمكن علامات الرجوله تظهر عليكم ؟ يمكن ؟"
author = "سيف الله وليد الجوهري"
posted = "2006-07-26"
text = "فضلاً من ان ننشغل باخبار عاهرات يجب علينا التقرب الي الله سبحانه وتعالي بنية التوبه 0<br />في اغنية اسمها وين الملايين لا اعرف من التي تغنيها ولكنها فعلاً اغنية تستحق كل تقدير ارجوا من الساده المهتمين بأخبار العاهرات ان يسمعوا هذه الأغنية<br />وين الملايين الشعب العربي وين الدم العربي وين وين ؟ وين ؟"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215042157/http://masr.20at.com:80/article.php?sid=479&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
