[[comments]]
order = 6
subject = "كامب ديفيد"
author = "ابو شريف"
posted = "2006-06-13"
text = "مما لاشك فيه ان اتفاقية كامب ديفيد كانت السبب الرئيسي والوحيد في عودة جميع الأراضي المصرية بدون إراقة دماء في حروب اخري مع الدولة الصهيونية .. ولكن السؤال الذي يفرض نفسه علينا ويتجاهله الكثير من ولاة الأمر (لأنهم مشغولون بقضايا أخري .... اتفه منه) هل الرئيس الراحل عندما سعي لطريق السلام سيكون من نتيجته مايحدث الان من سحل للشخصية المصرية عن طريق إسرائيل ... إني مقتنع تماماً لو كان الرئيس الراحل يعلم ماستؤل له الأمور ماكان فكر في هذه الاتفاقية لأنه الأكرم للجندي المصري أن يموت شهيداً في معركة مع العدو الصهيوني دفاعا عن القدس وفلسطين المسلوبة عن مايقتل وهو يحمي منتجعات الدعارة في سيناء .... وانا هنا لدي اقتراح ارجو من القراء الإعزاء ان يتبنوه في حالة اقتناعهم به ... في حالة عدم محافظة اتفاقية كامب ديفيد علي الهوية المصرية وفي حالة اصرار الدولة العبرية والمؤامرات المتحدة الأمريكية علي التنكيل بالشعب الفلسطيني البطل واحتلال القدس الشريف وتهويده لماذا لانطالب بإلغاء تلك الإتفاقية أو التهديد بجدية وصدق بين اقامة فلسطين وعودة القدس وبين الغاء الاتفاقية التي تضمن عدم تدخل مصر في اي شئ له علاقة بإسرائيل حتى ولو كان مقتل جنود مصريين ... المصريين الذين وقفوا أمام الاحتلال الانجليزي وطردوه شر طرده هل يخافون من الغاء الاتفاقية والعودة لأجواء حرب 73 ومن مات في حرب فهو شهيد وله الجنه ومن عاش فسوف يعيش كرجل له كرامه مصانة وحق محفوظ وكلمة مسموعه في العالم بأسره ام نكتفي بالسماع لتامر حسني ومتابعة الدوري العام وأخر اخبار حجاب حنان ترك وهل الموت في معارك الكرامة افضل أم الموت علي خوازيق الحكومة افضل"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215042157/http://masr.20at.com:80/article.php?sid=479&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

