author = "رمضان زمان"
posted = "2009-08-22"
text = "فى بداية الثورة او ايام الخمسينات وحتى سنة 1960 كان رمضان شكلة اية<br />بالضبط كان الاتى فى ريف مصر<br />كان كل بيت بيستاجر مقرىء قران وكانت القرى تغص بهم<br />وبعد صلاة التراويح تفتح المندرة فى البيت ويجلس الرجال ويقرا الفقى القران ترتيل وليس تلاوة ويتناول الحضور شرب القهوة والقرفة وينتقلون من بيت الى بيت عند كبار العائلات<br />وكان المقرىء يقرا القران كلة فى الشهر اربع مرات<br />ثم يتناول المقرىء السحور مع الرجال وينصرف<br />وما اذكرة وكنت تلميذا فى الابتدائى اننى كنت اجلس بجانب سيدنا بعضا من الوقت وفى حجرى المصحف واذكرة ان توقف فى قراءة اية فى القران<br />كان رمضان قران فى قران<br />لم يكن هناك تليفزيون ولا كهرباء والراديو ابو بطارية يفتح عند نشرة الاخبار وعند موعد القران<br />كان شهر رمضان شهر القران<br />الان فى القرية<br />وصلات النت ووصلات الدش واطباق الدش معلقة فوق كل بيت بل وكل زريبة بهايم بعد انتاج الصين الرخيص فالدش والريسيفر والراس والسلك كلة ب 150 جنية<br />واصبحت المسلسلات والبرامج التافهة ومدعى الغناء واشباة الرجال يتراقصون<br />بدل القران اصبحت المسلسلات<br />وبدل الاجتماع للاستماع القران يجتمعون لشرب البانجو<br />اللهم رحمتك"
archived = "2009-08-24"
capture_url = "https://web.archive.org/web/20090824152706/http://www.20at.com:80/masr/ebn-balad/13015-2009-08-20-16-13-45.html"

