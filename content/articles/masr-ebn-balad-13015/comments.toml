author = "الى الكاتبة"
posted = "2009-08-23"
text = "ما هذا الهراء ؟<br />الموضوع لا هو تقرير ولا قصة قصيرة ولا تحقيق ولا حدوتة ولا اى حاجة ادبية<br />شوية ثرثرة زى ما تكون واحدة بترغى مع جارتها فى المترو او على محطة القطار<br />اما الاسلوب فركيك وشوية عامية وشوية سوقية وغير جذاب بالمرة<br />هى كل بنت بتشخبط كلمتين بتبقى بتكتب ولازم نقرا ليها<br />ما تروحوا فى ستين داهية تتزوقوا شوية وتلبسوا محزق وتدوروا على عريس والا راجل يلمكم وتلاقوا وقت تعملوا سلطة وتغسلوا الهدوم فى الغسالة<br />هى العنوسة هتقرفنا كمان فى القراءة والادب<br />اتفرسى بعيد عننا"
archived = "2009-08-24"
capture_url = "https://web.archive.org/web/20090824152706/http://www.20at.com:80/masr/ebn-balad/13015-2009-08-20-16-13-45.html"

