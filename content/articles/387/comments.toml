text = "ربنا يخليلهم أل سعود!!<br />حقيقي عشنا وشفنا دول بحالها بتتسمى باسم واحد<br />يعني انا كده ممكن اعمل ثورة او حرب اهلية وامسك حكم مصر<br />وساعتها عيالي يسموها جمهورية وائل العباسية<br />هاهاها<br />يعني الواحد يسموا شارع مثلا باسمه<br />فيلا ... عمارة ... برج<br />مش بلد بحالها والمصيبة ان فيها الحرمين !!!<br />**** تم حذف الجملة التي وضع مكانها هذه العلامة"
