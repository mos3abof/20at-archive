subject = "الى هناء"
text = "يجب ان تكون هناك صراحه داخل المنازل وان يفهم الاباء والامهات ان الامر الذي لم يقتنع به الان او الابن سوف يفعلوه بدون علمهم ولو كانت الصراحه كان الاباء والامهات متابعون من منازلهم مايفعله ابناؤهم خارج المنزل بدون مخابرات او مراقبه اونكد لكن ها نقول للناس اللي مبتفهمش ؟؟؟؟؟؟؟ يجب ان تكون هناك صراحه تامه بين الابناء والاباء للمحافظه على الدين والخلق ابو انس المالكي ......"
