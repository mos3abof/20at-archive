[[comments]]
order = 16
subject = "شرين"
text = "صراحة متشكرة جدا ياجماعة على ردودكم الممتعة دى<br />والي بتحسسنى إنى لسا في مصر وبين أهلي<br />وقلبي معاكي ياست منى<br />وحاسة بيكي والله من غير ماتكلمى<br />عموما أنا والله من حيث البلد الي أنا مقيمة فيها<br />فوالله ماعنديش أى نقد على حاجة فيها<br />لأنها تكفي إنها بلد إسلامية وبتطبق الدين<br />فأنا إن حكيت فبحكي عن السلبيات الي بناخدها من الغربة<br />ومانصحكيش أبدا يا ست نونا تججربي<br />علشان متبقاش مذكرات هناء وشرين ونونا..........<br />وائل ما شاء الله ماشفتش حد عنده طموح وخياله واسع شوية زايك..بمزح ترى بس إنت بتكلم مع واحدة يأسه شويه<br />أشكرك جدا ياأستاذ أحمد على حسن ظنك<br />وبالنسبة للتشادي مقولناش عنصرية ولا حاجة لكن لا كدا ولا كدا<br />لكن يكون في حد المعقول<br />أنا متأكدة لو كنت خذته كانوا عيالي هيطلعوه مخططين<br />أبيض في أسود<br />ولا حتى كروهات<br />أصل دة غلب التشادين كلهم بجماله"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022135751/http://www.20at.com:80/article.php?sid=560"

[[comments]]
order = 17
subject = "من هناء"
text = "أول حاجة معلش شيرين ردك جا في موضوعي زي ماقالت يسمينة الله يمسيها بالخير (( التعليقات أرزاق)) تعيشي وتاخدي غيرها يا حبيبتي<br />وثانيا .. بجد أنا اتبسطت أوي من الكلام الجميل اللي قرأته هنا ومش عارفة أعمل ايه من الشكر يعني ..<br />مرسي أوي لبيرو ومطراوي وبقولك يامطراوي اسمك بيفكرني بعيله هنا اسمها (المطيري) لكن مطراوي يعني بتحب المطر ولا انت من العيلة دي ومتخفي ؟؟؟<br />أما بقى واحد من الشعب حكايتك تهلك من الدحك وأنا رحت برج المملكة دا عادي جدا من جوا زي أي مول بس هو اللي من برا شكله حلو عشان بيتلون .. وعنده ناس زحمة جدا وكل مايحبوا يعملوا مظاهرات يجروا على هناك :))<br />مصعب الخير أرجوك الحقنا في فنون التخفي وأصول الفكاك والحصار اللي بتقول عليها دي أرجووووووووك<br />وائل عباس .. انت كبير أوي كدة ولا عامل علينا عمو :)) بترول ودولة وعباسية .. لو الموضوع بجد أنا هاصوت لك بس تجيب لنا عربية بسواق ..<br />نونا .. اتبسطت أوي من ردك .. لكن منين انتي بتدايقي من أهلك بسبب خوفهم الزيادة ومنين هتعملي مع ولادك أكتر ؟؟ :( أنا حطيت نفسي مكانهم لقيتني مش ممكن أعمل زيهم<br />واحد من هناك ؟؟؟ لو مش عيزنا نخرج لوحدنا تعال وصلنا ياعم الشهم :))))))))))<br />أما بقى أجمل رد ..<br />عارفين يا جماعة إن أبو أنس دا يبقى ابن عمتي (( يارب بس مكونش غلطانة واتكسف )) تتخيلوا إن الحكمة بتاعته دي كلها والرأي السديد وهو لسا في ثانوي .. ربنا يحرسك ويحميك ياعبوووووود يااااااااااارب<br />وطبعا مش هانسى أشكر كل من قرأ وعلق ومكتبش اسمه وأنا بجد زي ماقالت توأمتي شيرين حاسة إني في مصر وفي وسط أهلي كمان .. وأشوفكم على خير في المغامرة الجاية<br />هناء"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022135751/http://www.20at.com:80/article.php?sid=560"

[[comments]]
