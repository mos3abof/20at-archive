[[comments]]
order = 2
subject = "واحد من الشعب"
text = "أنا كنت في السعودية من سنة في زيارة عمل سريعة المهم كنت في الرياض وكان فيه برج كبير وشكله حلو واسمه برج المملكة ..<br />قبل السفر بيوم قلت يا واد لازم تصور البرج ده علشان تفرجه علي الناس في مصر<br />المهم وانا راجع من الشغل بالليل جبت كاميرا جديدة والله ..وطلبت من السواق اننا نعدي من تحت البرج ...<br />جينا قريب من البرج ... نزلت من العربية بسرعة وهاتك يا تصوير ..<br />وخلاص<br />مشينا بعدها ربع ساعة فجأة لقينا عربيات كتير حوالينا وناس كتير ولمة وزعيق وهات الكاميرا وفين هاويتك وانت بتصور ليه يا حيوان ..<br />قلت معلش يا جماعة اسف وخدوا الفيلم وانا اسف وسلام ..<br />قالوا لأ الريس جاي من المخابرات الملكية وهوا هيشوف يعمل معاك ايه<br />جيه الراجل بتاع المخابرات ...وقعد يسأل نص ساعة ,ولما قلتله انت خايف من ايه ..قالي انت بتصور البرج علشان تبعت طيارة تضربه من مصر ..<br />يا نهار اسود<br />ياعم الحاج انا بس معجب بجماله ,,,ابدا<br />المهم انتهي الموضوع لما قلتله اني بعمل بحث وكنت محتاج الصور فيه ...فرح قوي وقعد يدعيلي وادالي صورة للبرج من طيارة هليكوبتر ...<br />اقولكم بصراحة ....لما شوفت الصورة فكرت بجد اني اضرب البرج بطيارة ..!!"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022135751/http://www.20at.com:80/article.php?sid=560"

