[[comments]]
order = 8
subject = "عاملى شملول قوى"
author = "عابر القارات"
posted = "2006-07-03"
text = "أنا عاوز حد يجاوبنى يا جماعة بقى كم المشاكل اللى بتحصل فى مصر دى كلها و الراجل ما طلعش حتى على شاشة التلفزيون و جاوب الناس عن الاسئلة و على القضايا و عن المشاكل اللى بتؤرقها صبح و الليل و البلد بتغلى و مشاكل مع الكل من قضاة لصحفيين لمهندسين لضحايا عبارة لأساتذة جامعة لكل كل الشعب المصرى و الراجل ودن من طين و ودن من عجين و لا بنشوف وشه خالص و المهم انه قاعد فى شرم الشيخ و عمال يطلع فى تصريحات و يقابل فى ناس و كلها مشاكل متعلقة بحماس و الفلسطينين و كأن مشاكلنا كلها الخارجية أختذلها فى مشكلة حماس و الضعط على راس ام حماس علشان تنصاع للمطالب اليهودية و الامريكية و طبعا ما حدش ينكر ان احنا لازم نتدخل لصالح اخونا فى الدين و نقف جنبهم (مش نقف على نفسهم) و الراجل يا عينى عمر سليمان رايح من غزة و جى من غزة و ما بقاش ليه وظيفة و هوه المفروض اهم راجل فى الدولة الا الواسطة يطبطب و يدلع اليهود و يدى حماس على دماغها علشان فى الاخر مهمته تنجح .... خلاص بقت مشكلة مصر مشاكل خارجية !!! طيب ما يجيى يقعد شوية فى وسطنا و يحللنا مشاكلنا اذا كان هوه رئيس مش سايبها لشوية وزرا متخلفين و معاهم شوية حيتان مبهدلين ام البلد لغاية لما طوب الارض عاوز يهج و يشوفله بلد تانية و لا داهية تانية تاخده ..... يا ريس حسنى إنت سمعت عن الحديث الشريف اللى بيقول فيه الرسول عليه افضل الصلاة و السلام \"كلكم راع و كلكم مسئول عن رعيته\" ربنا يكرمك و الله نصيحة لله تعالى أهه برضه بينى عيش و كفيار (طبعا انا اللى كنت بأكل العيش حاف و هو اللى بياكل الكفيار حاف برضه) الله يخليك إفضلنا شوية و راعينا يا راعينا و يمكن الايام اللى جاية ربنا بسببها يغفرلك اللى عملته فينا طول السنين دى كلها و يمكن بسبب دعوة مظلوم راجعتله حقه و لا شاب ع<br />اقرأ بقية التعليق .."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705061410/http://masr.20at.com:80/article.php?sid=600"

[[comments]]
order = 9
subject = "سمع هس"
author = "هانيبال"
posted = "2006-07-03"
text = "يا شباب .. يا شباب .. يا شباب ..<br />من فضلكم دقيقة واحدة معايا كده ..<br />كلنا عارفين ان مبارك حرامي وخاين وحقير وفيه ما في الخمر .. وعارفين ان كل اللي حواليه واللي بيشجعوه احقر منه وانتن .. كلنا عارفين كل حاجة .. كلنا من اول رؤساء الجامعات لحد بياعين الطماطم والجرجير .. من فضلكم كفاية بقى نتكلم في عيوب واحد كله عيوب وبلاوي زرقا على دماغه و دماغ اللي خلفوه .. واهو المثل بيقول الضرب في الميت حرام .. هانيبال النهاردة بيقولكم تعالو نتفق كلنا على حاجة واحدة .. ايه هي الحاجة دي بقى ؟؟<br />كل واحد فينا يكتب هو عايز ايه بالظبط وباختصار .. ( باختصار يعني مش عايزين شعر وزجل وحاجات من دي اللي مش جايبة همها ) .. او يحدد الحل من وجهة نظره الشخصية .. بس بشرط .. انه يكون مقتنع مية في المية باللي هو كاتبه .. يعني يكون صادق مع نفسه قبل مايكون صادق معانا .. هانيبال شخصيا شايف ان الحل الوحيد هو ثورة شعبية منظمة تخلع صاحبنا من الكرسي وتحاكمه محاكمة معتبرة وتخوذقه وتحط مكانه نادي القضاة لمدة سنتين وبعدها الناس ينتخبو رئيس جديد .. هانيبال متاكد ان مصر بعد كده هاتدخل السبق من جديد والحال هايبقى معدن وكل واحد هاياخد حقه ..<br />وكلنا نطلب من ادارة الموقع انها ترفع رغباتنا لاي حركة او منظمة او حزب او جريدة محترمة على اساس ان الكلام ده مش مدهون بزبدة وانه مش مجرد كلام .. لا .. ده حلم .. وامل .. ومستقبل ناس ضايعة .. تعالو كلنا نعمل ده النهاردة .. التلات يعني .. هاااا مين قال انا اهو .. ؟؟؟؟<br />عمكم هانيبال"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705061410/http://masr.20at.com:80/article.php?sid=600"

[[comments]]
order = 10
subject = "للاسف يا هانيبال"
author = "عابر القارات"
posted = "2006-07-03"
text = "للاسف يا هانيبال انتا بتنفخ فى قربة مقطوعة لأنك لو تشوف المظاهرات اللى حصلت فى الايام الماضية هتلاقى بضع عشرات من شعب تعداده 75 مليون !! موضوع يدعوا للتفكير هل الشعب مات و لا ماتت فيه النخوه و لا الدولة موتت فيه حتى التفكير فى بكره و بقى التفكير فى لقمة عيش يومه هيه شغله الشاغل و بقى الشعب \"بق\" على الفاضى يعنى تقعد على القهوة و لا فى البيوت تلاقى الشعب بيسب و يلعن سلسفيل أم الدولة و الحكومة و اللى بتعمله فيه الحكومة تيجى تقول الناس طيب ما لازم نعمل حاجه إيجابية علشان على الاقل نوقف الظلم ده مش حتى ننقلب عليه الناس تقولك هاه هاه و يعملوا نفسهم عبده الاهبل و تقولى ثورة و إنقلاب !! يا هانيبال يا أخويا الشعب ده مات بعد ما عرفوا يتعبوه و يدوخوه لغاية لما داخ من الامراض و الجرى ورا لقمة العيش و فقروه لغاية لما بيدور على اكله فى صفايح الزبالة و بعد كده تقولى انقلاب ... ده يا راجل لبنان اللى هيه لبنان و بتصدر للعالم العربى كله لا مؤاخذه نانسى عجرم و هيفاء وهبى و دومينيك لما الاحزاب قالت يا مظاهرات طلع حوالى اكتر من نصف مليون بنى ادم فى مظاهرة واحدة من شعب تعداد سكانه حوالى خمس ملايين يعنى اللبنانيين اللى دماغهم اصلا فى الطراوة طلعوا ارجل مننا اللى الواحد مننا عامل السبع رجاله"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705061410/http://masr.20at.com:80/article.php?sid=600"

[[comments]]
order = 11
subject = "الى عابر القارات"
author = "هانيبال"
posted = "2006-07-04"
text = "يا اخي غلط الكلام اللي انت بتقوله ده .. انت هاتخسر حاجة لما تقول انت عايز ايه ( وباختصار ) ولا لما تشغل دماغك شوية وتفكر في حل .. ولا حاجة .. عارف يا اخ .. الاطباء لما واحد يكون عيان اوي بينصحوه بايه ؟؟؟ بينصحوه بانه ما يفكرش في الوجع .. وبينصحوه بانه يخلي عنده امل في ربنا .. مش ده اللي بيحصل ولا انا بهجص ؟؟ اهو حنا عاملين زي العيان ده .. وعلاجنا اننا نبطل نغني ظلموه وننسى الوجع ونخلى عندنا امل في ربنا .. اكتب حلمك مش هاتخسر حاجة .. اكتب حلمك في كل مكان .. وخليك فاكر انهم لما ضربو الاعمى على عينه قال خسرانة خسرانة .. كلنا خسرانين كل حاجة ببركة مبارك .. اكتب حلمك .. فكر شوية واقترح حل تكون انت نفسك مقتنع بيه .. طول ماانت بتفكر في وجعك عمرك ما تخف .. وهاتعيش ايامك في عذاب ومرار ووجع قلب .. هانيبال مش احسن من حد هنا .. هانيبال ظروفه العن من ظروفكم كلكم .. ومع ذلك هانيبال بيكتب حلمه وبيفكر في حل .. هانيبال عنده امل في ربنا ومستحيل هايخلي حيوان زي صفوت عزيزة يهزمه وياكل دماغه .. هاااا جاي في القصة دي ولا لسه ناوي تغني ظلموه .. القلب الخالي ظلموه ..<br />عمكم هانيبال"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705061410/http://masr.20at.com:80/article.php?sid=600"

[[comments]]
order = 12
subject = "اكتب حلمك"
author = "بحلم ان المدارس يكون فيها مدرسين بيعلمو و يربو"
posted = "2006-07-04"
text = "مش بيبدلو المدارس في اسكندريه لما يجلهم تفتيش من بتوع المعونه و لا بيبلغو عن الطلبه لما بيكتبو موضوع تعبير<br />بحلم بكليات فيها دكاتره فهمين مش بيعين كتب<br />بحلم بشغل في بلدي بمرتب مناسب<br />بحلم بشوارع نضيفه و ناس نضيفه<br />كفايه كده لما نعمل دول نشوف الباقي"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705061410/http://masr.20at.com:80/article.php?sid=600"

[[comments]]
order = 13
subject = "الحلم الجميل"
author = "عادل محمد السودانى"
posted = "2006-07-04"
text = "بحلم بيك يبكره بحلم بالف فكرة بكره يلى جى عطشان وانت المى ببكره يلى جى نور انادتل الضى بحلم الايد فى الايد ونبدء من جديد الكرسى مش هو المشكلة المشكلة فينا جوانا وربنا ويانا الايمان هو الحل"
