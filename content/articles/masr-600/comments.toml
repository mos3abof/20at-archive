[[comments]]
order = 0
subject = "ربنا ياخدهم"
author = "ربنا ياخد الرئيس التعيس اللي حافظ على نظام تعيس أكتر من 25 سنه ربنا ينتقم منهم أخدوا مصر 250 سنه لورا ........."
posted = "2006-07-02"
text = "مقارنه بسيطه:<br />مهاتير محمد حكم ماليزيا في نفس التوقيت اللي حكم فيه حزني مبارك مصر في زمن كانت ماليزيا لا تجد من طعامها إلا الأرز ومصر كانت بتاخد كل سنه غير دخلها القومي معونه أمريكيه أقل من المليارين سنويا ......<br />حاليا شوف ماليزا أين أصبحت ومصر أين أصبحت ........<br />أنا شخصيا أرفع قبعتي أحتراما لنظام علم الدنيا كيف يكون الفساد , كيف يكون عفن النظام بأقل رائحه وأشد تأثير<br />(( لعن الله قوما ضـــــــــــــاع الحــــــــق بينهـــــم ))"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705061410/http://masr.20at.com:80/article.php?sid=600"

[[comments]]
order = 1
subject = "راجع نفسك يا دكتور حسن لاننا بنحترمك"
author = "مصرى"
posted = "2006-07-02"
text = "الحقيقه اللى دفعنى على التعليق اسم الدكتور حسن نافعه واللى كنت اظن انه اكتر جرأه يا دكتور مصر مش نا قصه يا تقول كلمة حق بجد يا تعرص بجد يا تسكت احسن<br />لازم المواقف تكون واضحه<br />نظام مبارك نظام مخبرين وعسكر وده شئ جلى جدا مش محتاج تدليل واللى بلغ عن الورقه مش المصصح الغلبان اللى خايف على اولاده انا اعرف وانت كمان تعرف وكل شخص له علاقه بالعمل العام يعرف<br />ان اللى بلغ شخص دى وظيفته يودى تقارير على كل اللى بيحصل لامن الدوله<br />والشخص ده موجود ف كل مدرسه ف مصر<br />وانت عارف كويس<br />انه موجود ف الكليه اللى انت بتدرس فيها<br />حدوتة التسلسل والافلام دى لما يقولها وزير ولا وكيل وزاره<br />اهوه الراجل بيعرص<br />انما انت يا دكتور<br />عيب عليك<br />بجد انا بتكلم لانى بحترمك وبحبك<br />وبعدين انت عايز الوزير ينجحها<br />احه<br />امال با با مبارك يبقىاب حنون ازاى<br />وميتاجرش على دين ابونا ليه<br />د انته الوحيد اللى وقفت للراجل ده ف معرض الكتاب وكلمته بجد<br />ارجو ان التعليق ده يوصلك<br />لان فيه ناس كتير اوى هاتتصدم فيك لو قرت المقاله الهزيله دى<br />وكلمة هزيله احسن من كلمه تانيه بيتهألى وصلتك"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705061410/http://masr.20at.com:80/article.php?sid=600"

[[comments]]
order = 2
subject = "إدانه وليس دفاع"
author = "مصراوي"
posted = "2006-07-03"
text = "ارجو من اللي يقول ان المقال دفاع عن حزني مبارك أن يعيد قراءته مرة اخرى لإنه مقال يدين الرئيس وليس يدافع عنه ... فالنظام الذي تكون حكومته مجرد موظفين منفذين لأوامره هو نظام فاشل واستبدادي لان من المفروض ان الوزير هو رئيس جمهورية وزارته (ده لو كان وزير بجد) وبعد ذلك يكون قادرا علي الدفاع عن قراراته في مجلس الوزراء او مجلس الشعب ، أما الوزير الذي يتسلم كل ساعة ورقه بالقرارات المطلوب منه اعلانها فهذا لايعتبر وزير بل يعتبر سكرتير للنظام الحاكم<br />ورجائي يا استاذ هانيبال طالما تسترشد بألقرآن الكريم في عقاب المنافقين فأيضا السباب والكلام الإباحي ليس في الإسلام من شئ ولايجوز ان نأخذ من الدين مانريده ونترك مالانريده"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705061410/http://masr.20at.com:80/article.php?sid=600"

[[comments]]
order = 3
subject = "هانيبال يعتذر"
author = "هانيبال"
posted = "2006-07-03"
text = "اعتذر ان كنت مخطئا واشكركم على التوضيح .. بس بصراحة الواحد مش قادر يتحمل فكرة ان فيه بني ادم واحد يدافع عن اللي ما يتسمى ده .. او يوصفه بصفة واحدة كويسة مهما كانت .. عامة هانيبال رصد تفكير الناس وثقافتها اليومين دول .. تخيلو ان الكدب هو الصفة الوحيدة اللي بيشترك فيها وبيحافظ عليها جميع المواطنين .. والكفر بكل شيء جاد ( حتى الاديان ) بيخبط على ابواب كل البيوت .. طيب عارفين ايه اللي هايحصل بعد كده ؟؟؟ انا بقى عارف لان فيه تجربة زي كده بالظبط مرت بيها البلد دي ..<br />تحبو اقول ولا بلاش .. انا بقى مش هاقول غير لما حد يطلب مني<br />عمكم هانيبال"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705061410/http://masr.20at.com:80/article.php?sid=600"

[[comments]]
order = 4
subject = "الحقيقه"
author = "نيفين نيفى نوفا"
posted = "2006-07-03"
text = "ميت يا جماعه شاف برنامج الحقيقه امبارح<br />البرنامج جاب الصحفيه ندى القصاص و الصحفى احمد صلاح اللى افرج عنهم من الاعتقال مؤخرا<br />اللى شاف البرنامج هيحس بالظلم و القهرو بجد كلمه االتاريخ البلد دى رايحه ف داهيه<br />العمليه مش الاء<br />لا دا نظام فاسد من اوله لاخره<br />كنتو تشوفو الناس بيحكو عن اللى حصللهم و تبكو<br />مش هعيد الى قالوه لان كلنا عارفينه و بيوجعنا<br />انا بس هقول انى شفت فى يحيى وهدان العقيد المحترم اللى كان مستضيفه وائل الابراشى النظام<br />شفت كلب مستقيل من كلاب الداخليه<br />شفت رغبه ف قلب الباطل حق<br />شفت النظام متجسد فى شخص حقير وضيع اسمه يحيى وهدان و سالت نفسى سوال<br />الناس دى بتقدر تنام ازاى<br />الناس دى بتحس بايه لما تبص ف المرايه<br />اااااه يا بلد رايحه ف داهيه"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705061410/http://masr.20at.com:80/article.php?sid=600"

[[comments]]
order = 5
subject = "مين قال نظام بائس"
author = "مصري مدحور"
posted = "2006-07-03"
text = "انا لا اصف النظام المصري بانه بائس لأته سعيد جدااااااااا, ولكن الصفة الأهم هي الذكاء في التصرف وقلب الأمور, وأريد فقط أن أذكركم بأن النظام عدل المادة 76 لتكون على مقاسه بالظبط, وترك نعمان جمعة وأيمن نور يقولان كل ما يرغبان فيه فنحن في دولة حرة طبعا, والآن أين جمعة ونور؟؟"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705061410/http://masr.20at.com:80/article.php?sid=600"

[[comments]]
order = 6
subject = "انا شفت البرنامج"
author = "و اندهشت من منظر الناس الي جيبنهم يدافعو عن الحكومه"
posted = "2006-07-03"
text = "حسيت ان النظام بيدافع عنه كفتجيه و ناس فاهمه و مقتنعه ان البلد بلدها و معاهم و رق بكده و الي مش عجبه يسيب البلد و يمشي<br />و سلملي علي العباره و الطياره و القطر و العساكر الي علي الحدود"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705061410/http://masr.20at.com:80/article.php?sid=600"

[[comments]]
