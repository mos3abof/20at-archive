subject = "ديه عزبة مبارك واملاكه"
author = "زيكو"
posted = "2006-07-03"
text = "الي فاكر ان مصر دولة مستقلة او حرة ذات سيادية يبقي مغفل لان مصر هي مبارك مصر هي سوزان مصر هي جمال وبس<br />مصر اصبحت العزبة بتاعتهم والشعب المصري خدم فيها ولا صوت الي صوت مبارك وزبانيته الكلاب وحرسه من خنازير امن الدولة"
