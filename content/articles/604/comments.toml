[[comments]]
order = 5
subject = "نتتتتتتتتتتتتتتتتت !!"
author = "أحمد عمر"
posted = "2006-10-25"
text = "أنا أكتشفت إني مدمن نت !!<br />لدرجة إن الوالده بتفكر إنتها تغير كرسي طرابيزة الكمبيوتر , و بتقولي \"إنت بتقضي نص عمرك علي الكرسي ده \" فلازم تبقي قاعد نص عمرك و إنت مستريح<br />بس بجد بجد أنا مبحسش بنفسي و أنا قاعد .. يمكن علشان أنا في قسم عماره (في بكاليريوس) ف شغلي كوووله علي الكمبيوتر .may be<br />بس الموضوع جامد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112759/http://www.20at.com/article2.php?sid=1383"

