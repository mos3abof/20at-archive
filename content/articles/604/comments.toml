text = "انا مدمنة لحاجات كتير وهما الرياضة ومادة الرياضيات والكيمياء والرسم والاهم ادمانى لمصر الغالية لانى انا عمله زى السمك لو طلع من الماء يموت وشكرا لموقع عشرينات على طرح هذا الموضوع لانها خلتنا ناخد بالنا من حاجات كنا بنعملها واحنا مش عارفينوفكرة جديدة وحلوة"
archived = "2006-11-02"
