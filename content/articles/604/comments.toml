[[comments]]
order = 3
subject = "التعود سبب الادمان"
author = "شرين منصور"
posted = "2006-10-24"
text = "السلام عليكم الموضوع ده رائع جداااااااا بس في توضيح ان التعود هو سبب رئيسي في الادمان فمثلا انا اتعرفت على شخصية معينة في مكان ما واخدنا ارقام بعض من خلال جلستي معاها لقيتها مثقفة وانا قليلة التثقيف فححاول اتصل بيها اليوم التاني بحجة اني بسال عليها ومرة وحدة بفتح معاها موضوع وهكذا الى ان اتعودت أن الشخصية دي لاز متبقى معايا ولما تسافر بحس بنقص شديد جداااااا دي حاجة الحاجة التانية ان ممكن نقول ان في انواع من الادمان وده النوع الايجابي اما النوع التاني وهو السلبي وهو ادمان على عادة سيئة زي مثلا شرب السجاير والحشيش ومتابعة الافلام التي بيها مشاهد بها نوع من العلاقة الحميمة بين الطرفين وفي ناس على فكرة مدمن لهذه الافلام وغيرو وغيرو من السلبي والجدع اللي فينا يحول ادمانو لدمان ايجابي ...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112759/http://www.20at.com/article2.php?sid=1383"

