[[comments]]
order = 0
subject = "واحد زيي ؟؟؟؟ كان زمانه رئيس جمهورية كمان...."
author = "لحقيقة يا عشرينات من فنرة معجبنيش مقال زي ده ....."
text = "أو بمعني اخر مفيش موضوع استفزني للتعليق من فترة ...<br />لكن أنس ... الحقيقة مش عارف أقول إيه ؟؟؟ تعبيراته جميلة جدا و كمان واقعية ويومية فعلا ... يعني كتب اللي حاسس بيه حقيقي ...<br />واحد زيي ؟؟؟؟ همم؟؟؟ كتير بتتقال لي الجملة دي ... بس الأكتر لما أقولها لنفسي ...<br />واحد زيي كان زمانه سياسي كبير ... واحد زيي ان زمانه مفكر ولا كاتب ....واحد زيي كان زمانه إعلامي محترم ... واحد زيي؟؟؟؟؟ إيه ده كله ؟؟؟<br />كل ده كلام عني ؟؟؟ إيه الغرور ده ؟؟؟<br />لا للتمديد ... لاللتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142314/http://www.20at.com/article.php?sid=1627"

