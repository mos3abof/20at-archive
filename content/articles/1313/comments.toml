subject = "أحمد عبيد"
author = "ما شاء الله يا أنس .. أسلوبك رائع وشيق جدا .."
text = "لا أدرى هل تكتب أي شكل من أشكال الأدب أم لا؟ ولكنني أرى أنك مؤهل بقوة لأن تكتب القصة القصيرة. بس اهتم شوية باللغة.<br />ربنا يوفقك .. وياريت نقرأ لك دايما على عشرينات.<br />تحياتي"
archived = "2006-11-02"
