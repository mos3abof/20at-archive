subject = "الاسلوب جميل ولكن"
author = "لى فكرة الاسلوب جميل لكن اذا بليتم فاستتروا"
text = "انت ليك جيرل فرند بلاش تعرف الناس انك سيء الخلق<br />خلي سوء الخلق ده جواك وبلاش اي حد ينحرف يقول انه<br />منحرف.(علاقتكوا مش بريئه وبتقول) ده انت مش محترم<br />فعلا<br />وابقى سلملي على الموقع الاسلامي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142314/http://www.20at.com/article.php?sid=1627"

