author = "ا إبنى واحد زيك كان المفروض يكتب فى عشرينات من زماااااان"
text = "أو بصراحة: واحد زيى كان المفروض يقرالك المقالاتين السابقتين من زمان<br />شد حيلك... أسلوبك حلو... والطريقة كويسة....ورح أخطب البت بتاعتك لو بتحبها...."
