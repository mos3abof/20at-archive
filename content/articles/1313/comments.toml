text = "بس ما تتغرش.<br />حقيقي كل واحد فينافعلا مش راضي عن نفسه وبيوبخ نفسه كل ما يفتكر(كل0000001. من الثانية) لكن الناس مش مصدقين و خاصة اللي بيحبونا وكمان اللي محتجينلناو على العموم: اللهم أصلح لنا أنفسناو اهدنا"
