order = 10
subject = "تعليق بسيط"
author = "لا خ اللي قال انه ميصحش ان الكاتب يقول ان ليه (girl friend)معاه كل الحق بس لو مكنش قال انت مش محترم يا ريت يا اخ تنتقد بس من غير الفاظ"
text = "يعني اللي الكاتب قاله غلط واظن الجميع متفق على كده بس بلاش نجرح في بعض<br />بخلاف كده الاسلوب رائع والكتابه منسابه بطريقه كلاسيكيه رائعه<br />عبدالله مفتاح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142314/http://www.20at.com/article.php?sid=1627"

[[comments]]
order = 11
subject = "استمتع بروعة المقال"
author = "الكل اجزم بانه خلاص القصة حقيقية والكاتب له جيرل فريند"
text = "علشان كده كانوا بيقولوا على بطلات احسان عبد القدوس عشيقاتوا<br />يااخوانا خليكم احسن ف الفكرة والاسلوب بعيد عن الحاجات الشخصية اللى ماحدش يعرفها عن الكاتب اصلا<br />حاولوا تستمتعوا بالاعمال الحلوة موش ف الكتابة بس ف كل شىء موش لازم ندخل العادات السيئة اللى اتعودنا عليهاف كل حاجة خلونا نحاول نتخلص منها<br />وبيتهيالى انه دى اجابة السؤال اللى بتساله هدى عمار ف اغنية مسلسل هوانم جاردن سيتى(ليه كل مرة ننطلق نتكفى؟)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142314/http://www.20at.com/article.php?sid=1627"
