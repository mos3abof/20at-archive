author = "ISLAM LOTFY"
posted = "2007-05-03"
text = "معلش يا بني؛ احب اقول لك اني فيصل ما بيمثل ليش اي مشكلة . . انا دخلته في جميع اوقات اليوم علشان اشوف يبقى الطريق سالك امتى ووالله تتبعته على مدار 24 ساعة بس الشهادة لله مرة كان الفجر بيدن وكانت الدنيا اقل من وصف زحمة بحاجة بسيطة<br />ومن بعدها انتهت حالة العداء بيني وبين شارع فيصل نهائياً لأني بطلت امشي فيه من اساسه ولو عندي مشوار في شارع فيصل باسوق في الهرم واركن وانزل امشي اكرم لي"
archived = "2009-09-01"
capture_url = "https://web.archive.org/web/20090901042808/http://www.20at.com:80/masr/7eta-mn-baladi/5712-2009-06-10-09-27-47.html"

[[comments]]
order = 3
subject = ""
author = "اكتب اسمك هنا"
posted = "2007-05-05"
text = "انا ساكنة فى فيصل و بشتغل فى فيصل طبعا اللى يسمع كدة يقول ان الحيلة وردى ما يعرفش انى بدفع نصف مرتى<br />مواصلات و النص الثانى غدا عشان المرتبات زى ما انتم عارفين دا غير الساعات اللى بقفها فى الشارع و لما ربنا بيكرمنى<br />السواق بيخلينى راكبة بس بعد ما بوعدة انى هادفع ثلاث اجور مش اجرة واحدة<br />مش عايزنا نتعقد و نلعن اليوم اللى اتولدنا فية<br />على فكرة انا مؤهل عالى ومعايا كمبيتر ولغات"
archived = "2009-09-01"
capture_url = "https://web.archive.org/web/20090901042808/http://www.20at.com:80/masr/7eta-mn-baladi/5712-2009-06-10-09-27-47.html"

[[comments]]
order = 4
subject = ""
author = "almotayam2002"
posted = "2009-10-10"
text = "انا بقه ساكن في فيصل<br />وبشوف القرف كله في المواصلات بتاعته<br />زمان كانو بتوع الميكروباسات يقفو جمبك عشان يركبوك<br />لأنه زمان كان الطريق شبه فاضي وده كان في اواخر الثمانينات و اوائل التسعينات<br />لما كان فيصل راقي شويه وكان الناس فيه مش كثير وكانت المواصلات كثيره جدا<br />لكن دلوقتي بعد ماهجمت مصر كلها على فيصل من كل الطبقات ليتحول فيصل الى كتله سكنيه مليان طبقات الجيزه بولاق وامبابه و ارض اللواء وكل مناطق العشوائيات<br />لدرجة ان سواق التاكسي لما اكون في منطقه واقوله فيصل يمشي من غير مايرد عليا كأني قولتله جهنم يا اسطى<br />وسواكين الميكروباسات حولوه نقاط توزيع المساحه / العشرين / الطالبيه / التعاون / الطوابق / الكوم الاخضر / ومطالب لو نازل المريوطيه تقسط الاجره عشان توصل او تتنطط من كل عربيه للتانيه<br />ده غير التكاتك اللي حولت فيصل لعشوائيات وخلت الشارع بقه من مزابل مع كل المستويات اللي بتسوقه<br />بجد انا اتخنقت من فيصل لأقصى درجه مع اني كنت بحبه زمان<br />ربنا يتوب علينا منه"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064338/http://www.20at.com:80/masr/places-of-egypt/5712-2009-06-10-09-27-47.html"
