text = "لن أنسى هذه الحادثة المفجعة لطالما حييت !<br />فإني رجل مصري أسكن في الجزائر و كانت هذه أكبر غلطة في حياتي فبعد المباراة بين الجزائر و مصر بأسبوعين طعنني رجل في إصبعة قدمي اليمنى فبعد أن خزلتني الجزائر بلدي الثاني و مصر بلدي الأول انتقلت للعيش في سورية بلدي الثالث و لغتي الأم و من وقتها إلى حد الآن لم أشاهد مباراة كرة قدم في حياتي و أنا أرجو أن تساعدوني في ايجاد طريقة للانتقام من هذا الرجل الخبيث"
