text = "والله انا كتبت التعليق دة بس للرد على الاخت ياسيمن<br />يعنى اية نتكلم معاها على اية الى بتحسة وهى بتتفرج على الحاجة<br />يعنى دلوقتى لو هو مش قادر يحسسك بالشهوة<br />دورى انتى على طريقة تانية<br />اتكلم معاه بوحى بسرك لية<br />مش تعلجى الغلط بغلط<br />وبعدين فى الاول وفى الاخر<br />الانسانة المحترمة متعملش كدة لا بتحس ولا بتعمل<br />لية …؟<br />لانى الست الشريقة المسلمة<br />جوزها بيكون اول رجل فى حياتة<br />فاستحالة تفكر التفكير دة<br />فالباتى مش تقدر تعمل حاجة خارجة عن الموضوع<br />وبالبسنى للفرجة على الحاجات دية<br />طبعا بخلاف الحرام<br />دية اهانة فى حد ذاتها<br />بس طبعا الطرفين هما المفروض يحلوا مشاكلهم من غير احراج وجرح احد الطرفين<br />وشكرا<br />elgram55<br />yahoo.com"
