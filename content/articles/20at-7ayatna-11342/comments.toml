text = "المشكلة إن مفيش ولا واحد من اللي إتاخد رايهم فى التقرير قال إنى هتكلم معاها و أحاول أفهم هيا بتعمل كده ليه و إيه اللي بتحسه لما تتفرج على الحاجات ديه وإية إللي أنا مش قادر أخليها تحسه معايا.<br />بس فالحين تقولو على نفسكو رجالة و إنتو مش بتفهمو إزاى تتعاملو مع البنت سواء نفسيا أو جسديا"
