text = "الأخ محمد عبد الجواد، اللى بيقول إنه لو اكتشف إن مراته بتعمل كده هينهي علاقته بها فورا لأنها بمثل هذه الأمور توجه له إهانة لكرامته كمواطن شرقي..طيب و لو هوه اللى بيعمل كده؟؟ مش هيقولها أنا رااااااجل و أعمل اللى انا عايزه؟!!<br />مفيش حاجة إسمها المرأة الغربية تختلف عن الشرقية كلنا لينا نفس الرغبات و الإحتياجات الجنسية و ياريت نبطل نضحك على بعض بأه لأن تجاهل رغبات المرأة بيسبب مشاكل كتيرة اوي<br />كفاية جهل و تخلف بأة"
