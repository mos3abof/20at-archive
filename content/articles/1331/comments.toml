[[comments]]
order = 0
subject = "فليستقل لحود ويرح ويسترح"
author = "مسلم"
posted = "2006-02-21"
text = "لا أدري لماذا يصر هذا الرئيس بالتمسك بالسلطة وهو يرى فريقا لا يستهان به من الشعب اللبناني يريد تنحيته.<br />فليكن شجاعا ، وليقدم استقالته معللا ذلك بأن الشعب اللبنان لايريده ، فهو ينزل عند رغبه شعبه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142513/http://www.20at.com/article2.php?sid=479"

[[comments]]
order = 1
subject = "دا شئ مش جديد"
author = "sweet_princess"
posted = "2006-02-22"
text = "معظم رؤساء الدول العربيه مكروهين من شعوبهم واولهم احنا كشعب مصري وكلنا عارفين من اول العجوز اللي عنده 90 سنه فمافوق والطفل اللي عمره 10 سنوات فما تحت ان الانتخابات كانت متطبخه ومتفبركه وان حكاية تعديل الدستور دي كانت بنج حطهولنا عشان مانحسش بالخيبه التقيله لكن والله برضه مهما عمل هيفضل مكروه طول عمره هو وحاشيته ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142513/http://www.20at.com/article2.php?sid=479"
