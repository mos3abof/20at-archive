[[comments]]
order = 9
subject = "دنشواى الحرة"
author = "صلاح ابن دنشواى"
posted = "2006-12-12"
text = "اذا وصفتم دنشواى فارجو ان تتحرو الحقيقة كما زكرت من اجدادناوارجواعدم التغير فى وجه التاريخ العظيم لتلك القرية المنكوبة للان وارجو ان تنظر الدولة الى تلك القرية بعين الرضا فبيوتهم اصبحت مهدمة من عدم وجود الصرف الصحى بها فلا نريد تباهى بما فعلة الاخرين باجدادنا بل نريد رد بعض الجميل لاجدادنا الذين ضحو بانفسهم ودمائهم من اجل حرية مصر فرحمة بابناء دنشواى ان تهتموا باهل هذة القرية الذين يعانون من تهديم بيوتهم كل يوم بسبب ارتفاع المياة الجوفية"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218111642/http://masr.20at.com:80/article.php?sid=528&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

