subject = "كلنا تاريخ"
author = "مخ أبو المخاميخ"
posted = "2006-06-23"
text = "أنه التاريخ ، يقتلنا ، يبكينا ، يفرحنا ، يرفع شعوب ، يخفض شعوب ، يحرك مظاهرات ، يعلق مشانق ، أنه التاريخ ، المتحرك على الجغرافيا ، يذهب التاريخ وتبقى الجغرافيا . الفساد تاريخ والتقدم تاريخ ، سرقة الشعوب تاريخ ، حق الشعوب فى مقاومة المحتل تاريخ ، ما أكتبه أنا تاريخ .<br />أحبكم تاريخ فربما أكرهكم بعد قليل<br />يا حبيبى ذوووووب فى التاريخ"
