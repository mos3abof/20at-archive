[[comments]]
order = 1
subject = "زي اليومين دول ..كان لازم يكون للانجليز ناس مصريين يتآمروا معاهم علينا"
author = "محمد السيد"
posted = "2006-06-18"
text = "طبعا ...لأن لازم خونة في كل عصر ...<br />كانوا خونة الزمان ده ....<br />1- رئيس المحكمة المهزلة هو بطرس باشا غالي ..<br />2- ومن أعضائها احمد فتحي زغلول، شقيق الزعيم سعد زغلول والذي تولى كتابة محاضر المحاكمة ...<br />3- ومثل الادعاء ابراهيم الهلباوي اشهر محامي في مصر في الوقت ده ، اللي قال خطب في الاشادة بمناقب الاحتلال والتنديد بالفلاحين وطالب بانزال اقصى العقوبة بهم ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218111642/http://masr.20at.com:80/article.php?sid=528&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "بس إيه ..... محدش سابهم ... واحد واحد أخد جزاءه"
author = "محمد السيد"
posted = "2006-06-18"
text = "بس إيه علي مين .... ده إحنا مصريين ياعم ....<br />كان لازم يتاخد بالتار منهم ...<br />1- قُتلنا \" بطرس باشا غالي\" علي يد الثائر الشاب الصيدلي \" إبراهيم الورداني \" ....<br />2- لم يشفع \" للهلباوي \" تطوعه للدفاع عن \"الورداني\" و قعد طوال عمره حتي مماته كهلا منبوذا يحمل لقب \" جلاد دنشواي \" ...<br />3- أما الموظف البيروقراطي \"أحمد أفندي فتحي زغلول\" فقد ظل موصوما بمشاركته ونفاقه ومداهنته زي بتوع اليومين دول يعني ...<br />اه وعلي فكرة .... مشفعلهوش له إنه أخو \" سعد باشا زغلول \" ....<br />مش ابن سيادة الريس اللي واخد ...ولا كفاية كده ياعم ....<br />شفتوا بقي إزاي إن المصريين مش بيسيبوا حقهم أبدا .... وحتشوفوا الأيام الي جاية إيه الي حيحصل ..<br />وبرضه<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218111642/http://masr.20at.com:80/article.php?sid=528&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "دنشواي عالمية"
author = "بهاء"
posted = "2006-06-19"
text = "ولاتزعل ياعم/<br />حشاشنا السادات جاب لنا بطرس غالي جنيور بدل من بطرس سينيور، وياقلب ما تحزن، وبدل الهلباوي تقول مليون هلباوي، هو نبوي إسماعيل الي أصله ضابط شرطة في سكة حديد مصر، يتقلب بقدرة قادر وزير داخلية خبطة واحدة من غير سبب؟ ده هو والست المطربة مراته فايدة كامل فلوقونا ياجدع بأغنية\"قول يا سادات ياللي كلامك حكم!\". أستغفر الله العظيم، مش غيرها قال عنه\" السادات لايأتيه الباطل من خلفه ولابين يديه، ولايسأل عما يفعل وهم يسألون!\". والله لولا إنه حرام نبش العلماء الأموات لأقولكم على إسمه.<br />في عهد بطرس أفندي غالي نالت إسرائيل وضع في الأمم المتحده لم تكن تحلم به، مثلا مشاركة علماءها وخبراءها في قضايا وأبحاث ذات طابع دولي، كان محرما عليها من قبل، وهو كمان صاحب الفضل في إلغاء قرار الأمم المتحدة بإن الصهيونية صورة موازية للعنصرية، الي إتخذ في عهد كورت فالدهايم، لي لصقوا فيه تهمة النازية لما ترشح لرئاسة النمسا، أمال ناس يايسبوش تارهم ولاد عمنا.<br />وفي عهد الأبعد لم تدان إسرائيل مرة واحدة رغم مذابحها في لبنان عند إجتياحه، وصاحبنا أثرى ثراء فاحش من صفقة النفط مقابل الغذاء من دم العراقين، وكمان من دم مسلمي البوسنة. الخبثاء بيقولو ده علشان مراته يهودية من عيلة نادلر المشهورة، ده كلام؟<br />والله الخيانه ماليها دين، هو الجحش البرادعي مسيحي ولا يهودي؟ عرفتم بقى ليه سمح إنه يكون لمصر أراجوزين غالى-برادعي إخوان في المحافل الدولية؟ لأنهم لايفعلوا إلا ما هو مضر بالعرب والمسلمين، وفي صف إسرائيل، وأخيرا مين رشحهم؟ صح ريسنا الشريف."
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218111642/http://masr.20at.com:80/article.php?sid=528&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

