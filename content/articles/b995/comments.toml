[[comments]]
order = 0
subject = "مبروك الزواج، ولكن.."
author = "ئالان"
posted = "2006-06-26"
text = "مبروك الزواج!<br />لكن لماذا استخدام السلاح، يبدو ان هذه الظاهرة متفشية في مصر ايضاً..<br />ظاهرة اطلاقات النار في الحفلات تعبيراً عن الفرح هي ظاهرة خطيرة جدا، وقد انتبهت السلطات -هنا في كوردستان- الى هذه الظاهرة بعد عدة حوادث مؤلمة، وقامت بحملات توعية في الاونة الاخيرة لمنع استخدام السلاح في هكذا مناسبات..<br />اتمنى ان تزول هذه الظاهرة في عموم بلدان الشرق الاوسط في القريب العاجل.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141424/http://www.20at.com/article2.php?sid=995"

