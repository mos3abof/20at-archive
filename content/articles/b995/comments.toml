subject = "طيب ...مش كنت تعزمني ؟؟؟ ده اسمه كلام يعني ؟؟"
author = "محمد السيد"
posted = "2006-06-27"
text = "ألف مبروك ياريس ....<br />بارك الله لكما وبارك عليكما ... وجمع بينكما في خير ..وعلي خير ...<br />وعقبال مانفرح بفلسطين كلها ... وربنا يعدي الأيام دي علي خير ...<br />لكن برضه ... أي نعم مش وقتها ...<br />لكن مش حاسكت ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141424/http://www.20at.com/article2.php?sid=995"

