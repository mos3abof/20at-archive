[[comments]]
order = 8
subject = "مبروك، والعقبى لجميع الشابات والشبان"
author = "عبد الغني المغربي"
posted = "2006-06-28"
text = "السلام عليكم، مبروك أخي عاطف، ولا تنسى أن تعطف على أم أولادك ـ إن شاء الله ـ ومتمنياتنا بالتوفيق. وبارك الله لك في أهلك، والعقبى إن شاء الله لجميع عزابنا من الإناث والذكور.<br />وتحياتي لأهل ناب لس.<br />فإن هذه المدينة ذكرتني بدرس في المطالعة بالابتدائي المغربي، يقال إن أصل مدينة نابلس هو أفعى اسمها \"لس\"، ووجدوا نابا عظيمة، وقالوا نابُ لسّ.<br />بالتوفيق. وحرر الله جميع فلسطين من الكيان الصهيوني الغاصب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141424/http://www.20at.com/article2.php?sid=995"

