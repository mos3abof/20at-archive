order = 0
subject = "الانهيار"
author = "مهم"
posted = "2006-11-15"
text = "ما هو الاونكل نضيف لما جه قال انه عنده خطه محكمة لوقف هذا الانهيار وفوجئنا بنظرية ضم البنوك علشان خاطر يوقف الانهيار والبنوك انضمت والانهيار مازال وفوجىء الشعب بخفض الفائدة ومع ذلك الانهيار زاد. وبعد ذلك فوجئنا بخصخصة البنوك وعم نظيف باع بنك اسكندرية والانهيار لسه ما وقفش.<br />يبقى الحكومة مش نافعة حنعمل ايه حنجيب حكومة ثانية علشان خاطر توقف الانهيار.<br />وهكذا دواليك وصدق الشاعر العربي حينما قال:<br />وزارات ورا وزارت هتعيش على حلمنا<br />و اللي بيجى يادوب مظبوط على قدنا<br />جايز هيجي اليوم والشبكة تيجى إنما<br />تفضل فلوس الشقة ودة شيء بعيد عننا<br />جايز هيجي اليوم والشقة تيجى إنما<br />هتكون سنانك وقعت قربت على 100 سنه"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095348/http://masr.20at.com:80/article.php?sid=1161"

[[comments]]
order = 1
subject = "قصة إسلام"
author = "قصة إسلام غريبة جداً"
posted = "2006-11-16"
text = "بسم الله الرحمن الرحيم<br />قد تكون هذه القصة غريبة على من لم يلتقي بصاحبها شخصيًّا ويسمع ماقاله بأذنييه ويراه بأم عينيه فهي قصة خيالية النسج ، واقعية الأحداث ، تجسدت أمام ناظري بكلمات صاحبها وهو يقبع أمامي قاصًّا عليّ ماحدث له شخصيا ولمعرفة المزيد بل ولمعرفة كل الأحداث المشوقة . دعوني اصطحبكم لنتجه سويا إلى جوهانسبرغ مدينة مناجم الذهب الغنية بدولة جنوب أفريقيا حيث كنت أعمل مديرًا لمكتب رابطة العالم الإسلامي هناك.<br />كان ذلك في عام 1996 وكنا في فصل الشتاء الذي حل علينا قارسا في تلك البلاد ، وذات يوم كانت السماء فيه ملبدة بالغيوم وتنذر بهبوب عاصفة شتوية عارمة ، وبينما كنت أنتظر شخصًا قد حددت له موعدا لمقابلته كانت زوجتي في المنزل تعد طعام الغداء ، حيث سيحل ذلك الشخص ضيفا كريما عليّ بالمنزل .<br />كان الموعد مع شخصية لها صلة قرابة بالرئيس الجنوب أفريقي السابق الرئيس نلسون مانديلا ، شخصية كانت تهتم بالنصرانية وتروج وتدعو لها .. إنها شخصية القسيس ( سيلي ) . لقد تم اللقاء مع سيلي بواسطة سكرتير مكتب الرابطة عبدالخالق متير حيث أخبرني أن قسيسا يريد الحضور إلى مقر الرابطة لأمر هام.وفي الموعد المحدد حضر سيلي بصحبته شخص يدعى سليمان كان ملاكما وأصبح عضوا في رابطة الملاكمة بعد أن من الله عليه بالإسلام بعد جولة قام بها الملاكم المسلم محمد علي كلاي. وقابلت الجميع بمكتبي وسعدت للقائهم أيما سعادة. كان سيلي قصير القامة ، شديد سواد البشرة ، دائم الابتسام . جلس أمامي وبدأ يتحدث معي بكل لطف . فقلت له : أخي سيلي ، هل من الممكن أن نستمع لقصة اعتناقك للإسلام ؟ ابتسم سيلي وقال : نعم بكل تأكيد . وأنصتوا إليه أيها الإخوة الكرام وركزوا لما قاله لي ، ثم احكموا بأنفسكم .<br />قال سيلي : ك<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095348/http://masr.20at.com:80/article.php?sid=1161"
