text = "ماتخليكى فى حالك يا جربوعة دا احسن امير او سلطان او ملك عندكم لابس شبشب فى رجلية وحجاب على وشة وكرشة عامل علامة استفهام ومش عاجبكم المصريين جاتكو نيلة عليكم وعلى بلادكم وعلى رجالتكم يا شوية بدو كبيركم ترعو معيز يا مواشى واشوف وش اهلك هاضربك بالجزمة فى 60 داهية انتى واهلك منتظر رد ميتينك"
