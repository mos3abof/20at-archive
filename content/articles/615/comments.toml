order = 2
subject = "موضوع يصلح للمصريين!"
author = "خليجية"
posted = "2006-07-10"
text = "لاحظت أن المصريين يعانون من الكرش رجالهم ونسائهم.. إضافة إلى المؤخرة الكبيرة والجسم المليان.. فنادراً ما نرى شخصاً نحيفاً هناك... ربما من كثرة أكلهم للفول والطعمية والفطير المشلتت والنشويات!<br />إذا عليهم بتجربة هذه الوصفة.. ومثلما قالت ريم من السعودية، يجب عدم شرب الماء مع الطعام.. بل بعده بنصف ساعة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112930/http://www.20at.com/article2.php?sid=981"

[[comments]]
order = 3
subject = "مش المصريين بس.........! يا خليجية"
author = "حازم المكاوى"
posted = "2006-07-15"
text = "مش المصريين بس اللى رجالهم و نسائهم ذوى كرش و مؤخرة كبيرة كذلك الخليجيين سواء ( كويت و قطر و امارات و سعودية و بحرين و قليل من س عمان)<br />الاهم ممكن اكل زبادى 3 ايام ثم فاكهة 3 ايام ثم دجاج مشوى 3 ايام ثم سلطة خضراء 3 ايام ثم بيض 3 ايام فى الثلاث وجبات ثم بعد 15 يوم تكونى خسيتى حوالى 7 كج يا خليجية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112930/http://www.20at.com/article2.php?sid=981"

