author = "أشرف من الجزائر"
posted = "2009-10-22"
text = "ياأخي أنتم تصادرون حقنا في مساندة الفريق الجزائري و تشجيعه ، هل هذا غريب أما الشعب الجزائري فلا تهمه المباراة بقدر الإهانة و التجريح من بعض الإعلاميين و خاصة عمرو أذيب الذي جرح الشعب الجزائري و خدش كرامته ، في الأول كان الشباب فقط وراء المنتخب الجزائري و كان المواطن الجزائري يعيش يومياته عادية مع مشاغل الدنيا و لكن الآن و بعد الإهانة و التجريح الذي أفرغهما عمرو أذيب في وجه الشعب الجزائري أصبح الكل صغارا و كبارا أطفالا و نساء ، همهم الوحيد هو تشجيع الفريق الجزائري و مساندته لكسر هذا الغرور و هذه العجرفة و هذا التعنت الإعلامي ياإخواني إلا إلا إلا …الكرامة و تحيا الجزائر و المجد و الخلود لشهدائنا الأبرار"
archived = "2009-10-23"
