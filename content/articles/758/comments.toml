[[comments]]
order = 2
subject = "تحذير (الكلام دا حصل مع اخويا )"
author = "sweet_princess"
posted = "2006-02-26"
text = "انا بوجه تحذير للجمبع ضد المواقع اللي من النوع دا وخاصة البنات ودلوقتي هتفهموا انا قلت كده ليه .<br />الحمد لله مافيش ايميلات بتوصلني من المواقع اللي من النوع دا لاني مظبطه ايميلي.<br />بس اخويا هو اللي كان مشترك في مجموعه من النوع داواكتشف انها بتادي لمشاكل كتير على طريقة (تلبيس سلطانية دا لدا ).<br />واللي حصل مع اخويا بقى انه وصله ايميل من مجموعه من النوع دا واشترك معاهم فبقت توصله صور للفنانين ومناظر طبيعيه وكده يعني فعجبته مجموعة صورمناظر طبيعيه كانو باعتينهاله (ادارة الموقع دا) بس الصور دي كانت صغيره جدا وما عرفش يعمل لها داون لود(dawn lood) فبعت للويب ماستر (wep master) رساله بيسال فيها عن الصور دي ويجيبها ازاي بحجم اكبر شويه وطلب منه شوية معلومات عن الموقع دا وبعدين تاني يوم لقي واحد غريب ضايفه على ايميله وعاوز يكلمه فدخل عليه وساله هو يعرفه منين وازاي قدر انه يضيفه عنده فلقاه هو اللي مستغرب وقاله انه وصلته من اخويا رساله غريبه بيساله فيها عن صور وينزلها ازاي ومعلومات عن الموقع (وطبعا اي حد توصله رساله زي دي هيقول ان اللي باعتها دا انسان مش محترم وانه يقصد شئ مش كويس )فشرحله الموضوع وقاله انه كان باعتها لادارة الموقع مش ليه هو بس برضه الموضوع ماكانش مفهوم لحد دلوقتي .<br />المهم وصلته رساله في يوم من واحده بتقوله اتقي ربنا وانت ماعندكش اخوات بنات وقالتله انه باعت لها صور مش كويسه (وانتو طبعا فاهميني هي تقصد ايه ).<br />وساعتها اخويا فهم ايه اللي حصل بالظبط .<br />واكتشف ان صاحب الموقع دا انسان (مريض وما عندوش ضمير ولادين )بيستغل المشتركين ويبعت ايميلات عشوائيه لاي حد( وطبعامفهوم الايميلات دي يتحتوي على ايه ).<br />زطبعا اخويا لما عرف كده بعت ايميلات لكل الناس المشتركه على الموقع دا وحذرهم و بعت للحيوان دا رساله بيقولله اتقي الله .<br />قام الحيوان دا رادد عليه وبرساله قذره وقاله كلام زباله زيه وباسلوب زي بتوع الخليج .<br />والله العظيم<br />والله العظيم<br />والله العظيم<br />الكلام دا حصل والله انا حبيت بس اقوللكم عشان احذركم من المواقع اللي من النوع دا وخاصة البنات .<br />انا سعيده بجد اني جت لي الفرصه عشان احذركم من المواقع اللي من النوع دا<br />اللهم قد بلغت اللهم فاشهد ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115327/http://www.20at.com/article2.php?sid=501"

[[comments]]
order = 3
subject = "أبو نواف الأفضل"
author = "عبدالله"
posted = "2006-02-26"
text = "بداية نشكر موقع عشرينات على استضافة أبو نواف على صفحاتها، ولصاحب التعليق السابق أقول: إن مثل هذه التحذيرات لا يمكن إطلاقها على العموم وضد الكل،لأنني مشترك في مجموعة أبو نواف البريدية منذ فترة طويلة وكل ما يصلني منها من رسائل رائعة وهادفة ولا يوجد بها أي شئ... وأعتقد أنها تجربة جيدة لشاب سعودي استطاع أن يوظف إمكانياته ويطور مهاراته للتواصل مع الآخرين في كافة انحاء الوطن العربي وإفادتهم... أما تحذيراتك العامة فهي اشبه بتحديرات من التعامل مع الإنترنت أو الفضائيات بشكل عام.. وكل منه يوجد بينه الغث والسمين... ولمعلوماتك ايضا المجموعة يوجد بها خيار إلغاء الاشتراك لمن لا يريد.<br />وأخيرا نرجو تعليقات مسئولة تصب في صلب الموضوع ولا ترمي الناس بالباطل وهدى الله الجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115327/http://www.20at.com/article2.php?sid=501"

[[comments]]
order = 4
subject = "انا اسفه جدا"
author = "sweet_princess"
posted = "2006-02-27"
text = "اسفه جدا اني حذرتكم وماكنتش متوقعه الهجوم دا من الاستاذعبد الله ولا كمان كنت مستنيه حد يشكرني لان كل حد هنا بيقول رائيه بدون قلق وبمنتهى الحريه(ادارة الموقع قالت كده اكتر من مره على ما اعتقد ).<br />اما بالسبه لانك قلت اني اطلقت كلامي دا على الجميع فدا ما حصلش وانا كنت اقصد مجرد تحذير مش اكتر ولا اقل من كده .<br />ودا سببه خوفي على البنات والشباب كمان اللي هنا دا لاني والله بعتبركم كلكم زي اخواتي.<br />ومره تانيه انا بعتذر و اسفه جدا اني حذرتكم ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115327/http://www.20at.com/article2.php?sid=501"

[[comments]]
order = 5
subject = "جدا روعه"
author = "فهد"
posted = "2006-02-27"
text = "الموقع والمجموعة البريدية أكثر من رائعة<br />ولي رد على sweet_princess تحذيراتك هذه تؤخذ بوجه عام وليست لمجموعة بريدية او موقع معين وايضا تحذيراتك على الفضائيات أيضا وأكثر ضررا من الانترنت<br />أتمنى يتسع صدرك للملاحظه<br />وشكرا لموقع عشرينات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115327/http://www.20at.com/article2.php?sid=501"

[[comments]]
order = 6
subject = "عبدالله"
author = "إلى sweet_princess"
posted = "2006-02-27"
text = "لا داعي للزعل ولا للاعتذار... فكما قلتي كل منا يدلي برأيه... ولكن لو أعدت قراءة تعليقك ستجدين أنك ارتكبت أكثر من خطأ<br />- في حق أبو نواف<br />- في حق الموقع<br />- في حق القراء<br />فالرجل يعد صاحب أشهر مجموعة بريدية، ويقوم بإدارتها بمفرده، ولم يتوقف على مدار سنوات، ومحتوى رسائله وموقعه لاغبار عليهم ويشهد لهم الجميع.<br />ويزيد الأمر سواءا أن تحذيراتك لمثل هذه المجموعات يعد اتهمام لمجموعة أبو نواف وانت - كما قلتي- لاتقصدين المجموعة، هذا إل جانب انك غير مشتركة فيها.<br />- كما أن لايعقل أن يجري موقع عشرينات حوارا مع أحد إلا إذا كان علما في مجاله.<br />- كذلك ليس من حقك الحجر على جمهور القراء بتوجيهم إلى ما تريدين.<br />لذا فاعتذار واحد لايكفي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115327/http://www.20at.com/article2.php?sid=501"

[[comments]]
order = 7
subject = "الى هبهوب ,........عبد الله"
author = "sweet_princess"
posted = "2006-02-27"
text = "متشكره جدا ليكي لانك قدرتي تفهمي قصدي كويس واشكرك جدا على اهتمامك (على فكره تعليقاتك لذيذه جدا وبتعجبني )(((ودي مش مجامله والله ).<br />على فكره انتي محامي جامد جدا .<br />انا والله من بعد ما قرات تعليق الاستاذ عبد الله كنت قررت اني اكتب اعتزار و مش هدخل تاني ع الموقع دا لاني ماكنتش متوقعه ابدا الهجوم دا عليا .<br />اما بخصوص الاستاذ عبد الله فالكلام موجه ليه دلوقتي (انت قلت ان الاعتذار مش كفايه )طيب قوللي اعمل ايه ؟<br />انت بجد اسلوبك في التعليق قاسي جدا (وبعدين انا احب انبهك لحاجه مهمه انا ما اطلقتش كلامي دا على موقع نواف بعينه انا قلت مجرد تحذير من موقف حصل لاخويا وكان ممكن يحصل لاي حد )<br />واخيرا :<br />لو حبيت اني ما ادخلش الموقع دا تاني انا مستعده لاني ما بحبش اتواجد في مكان مكروه وجودي فيه ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115327/http://www.20at.com/article2.php?sid=501"

[[comments]]
order = 8
subject = "إلى sweet_princess.....وهبهوب"
author = "عبدالله"
posted = "2006-02-27"
text = "إلى sweet_princess... بداية أشكرك على إسلوبك المهذب في الرد<br />ثانيا انا لا املك منعك من دخول الموقع وبالطبع لا أريد ذلك فيسعدني جدا تواجدك<br />ثالثا: إن كان الإسلوب قاسي فقد تعمدت ذلك لكي أبين لكي ببساطة إن إسلوب تعليقك هو الآخر كان به تجريح للمجموعة التي انتمي إليها، قبل أن توضحي أنكي لاتقصديها.<br />رابعا: الاختلاف في الرأي لا يفسد للود قضية.<br />إلى هبهوب:........ إسلوبك سخيف في الرد ولا يستحق التعليق عليه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115327/http://www.20at.com/article2.php?sid=501"

[[comments]]
order = 9
subject = "الي سويت برنسن ثم عبد الله"
author = "هبهوب"
posted = "2006-03-01"
text = "اي خدمه يا حببتي انتي تامري بس . اما بالنسبه للكابتن عبد الله احب اقولك ان دي<br />طرقيتي قد تكون مستساغه للبعض وقد لا , ولو لا اضغط علي back . حاجه تانيه انت ليه بتناقض نفسك مينين بتقول اختلاف الاراء لا يفسد للود قضيه وتقول علي تعليقاتي سخيفه لا بقي دا يفسد للود قضيه يا عبدو واحسن كنت تقول الي هبهوب اختلاف الاراء لا يفسد للود قضيه من غير سخيفه باعتبار لو حد دخل الموقع دا وشاف تعليقاتي هيقول البت دي تعليقتها سخيفه طبعا مستندين لرايك زيها زي عملتي غلطه في حق ابو نواف والقراء ..... علي العموم مش هزعل وهعملك زي اخويا .......\" قال تعليقاتي سخيفه قال .... حكم\" ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115327/http://www.20at.com/article2.php?sid=501"

[[comments]]
order = 10
subject = "الى هبهوب ,........عبد الله"
author = "sweet_princess"
posted = "2006-03-02"
text = "اولا هبهوبي :<br />حمد الله ع السلامه ياجميل .<br />ثانيا بصي بقى انا عندي ايميلات كتير ع الياهو وعندي واحد بس ع الهوت ميل بس هو الوحيد اللي اسمي مش مكتوب فيه يعني لو عندك ايميل ع الياهو ممكن تبعتي لي رساله منه عشان اعرف عنوانك واضيفك على ايميلات الياهو.اتفقنا (هستنى منك رساله بس ماتاخريهاش عشان انا كمان قربت انشغل بدراستي .اوك<br />اما بخصوص الاستاذ عبد الله :<br />اشكرك على زوقك في الحديث وبوجهلك التحيه .<br />واشكرك كمان انك ماقلتليش ماتدخليش تاني .<br />اما بخصوص الموضوع الاهم((هبهوب ))<br />اسمحيلي يا هبهوب ابقى محامي عنك المره دي .<br />يا استاذ عبد الله هي دي هبهوب وهو دا اسلوبها .<br />هي كده دايما يتحب الضحك والهزار وكل تعليقاتها لذيذه ومرحه.<br />ولو مش مصدقني راجع كام تعليق ليها .<br />وبعدين هي ما تقصدش اي شئ اكتر من التعليق وبس .<br />وهي دي طبيعتها واسلوبها اللي كلنا بنحبه .<br />واخيرا ماتاخدش على خاطرك منها .<br />وزي ما انت قلت اختلاف الراي لا يفسد للود قضيه .<br />مستنين تعليقاتك الحلوه دايما (انا وهبهوب ).<br />واوعدك اننا هنختلف معاك كتير بس برضه كلنا اخوات."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115327/http://www.20at.com/article2.php?sid=501"

[[comments]]
