posted = "2006-03-02"
text = "دايماً بحب التفوق فى أى مجال والأستاذ أبو نواف نموذج كويس جدا للشاب المكافح المتفوق فى مجاله<br />انا مشترك فى الجروب بتاعته وهى فعلا جروب ممتازة وتخدم جميع الأذواق وفوق كده انه لا يسمح بنشر مادة مخالفة للشريعة الإسلامية بخلاف كثير من الجروبات التانية واللى كانت بتقصدهم سويت برينسس (ده إذا سمحتولى أتدخل فى المناقشة اللى بينكم) وهى بكدة كانت بتتكلم عن جروبات تانية أنا تعرضت لموقف مثل اللى اتعرضله أخوها وكلامها صح 100 فى المية"
