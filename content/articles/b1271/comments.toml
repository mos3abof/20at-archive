subject = "حاكم عربي"
author = "حاكم عربي"
posted = "2006-09-25"
text = "ياابني ياشاور رغم دعوتك النبيله الا انني مضطر ااستمر في التضحيه بنفسي وبراحتي وسعادتي من اجل الاستمرار في حكمكم وتحمل مشاكلكم وبلاويكم<br />.. ده قدرنا ياشاور يا بني ... احنا خلقنا علشان المهمات العظيمه دي<br />تصدق يا شاور اننا مقدرش امشي علي<br />الكورنيش انا والمدام نقزقز شوية ترمس ولا<br />فول سوداني زي بقية الشعب ...شوفت حجم<br />التضحيه ... بس هنعمل ايه ونقول ايه<br />علي قدر الرجال تاتي المصائب<br />... نفسي يا شاور اجرب المتع العظيمه الي<br />شعب بيستمتع بيها وانا محروم منها<br />يعني نفسي مثلا اقف في طابور الجمعيه علشان<br />اخد لي صابونه ... هي الجمعيات التعاونيه<br />لسه موجوده ولا اتلغت ... لازم اسال وزير<br />التموين ... شوفت المسئوليات بتطاردني حتي ف<br />ي احلامي... يعني كمان مش قادر احلم<br />نفسي اركب اتوبيس زحمه وقت الظهر ويكون<br />العرق ريحنه تخنق والناس مش طايقه بعضها<br />والكمسري بيشتم في الركاب ... والركاب<br />بتشتم في السواق ... والكل بيشتم في الحكومه<br />نفسي ضابط ياخدني تحري علي القسم ويسالني عن<br />اسمي اجي ارد عليه يلحقني المخبر بقلم علي<br />قفايه وكام شلوط ... وياسلام بقي لو ربنا<br />كرمني وحولوني علي امن الدوله واتفرجت علي<br />احدث مانتجته التكنولوجيا العالميه من<br />ادوات التعذيب يا سلام علي المتعه اللي انا<br />محروم منها .. تصدق اننني هعيط خلاص ... لكن<br />اطمن يا شاور مستمر في التضحيه علشانك انت<br />وابنائي من الشعب اوعي تقلق ابدا ...<br />عمري ما ها اسيبك .. وراك وراك<br />.. ساعات يا شاور بحلم اني مواطن عادي<br />ومروح لمراتي بكيلو خيار من بتاع الصوب<br />اللي بيقولوا بيجيب السرطان وتقابلني علي<br />الباب وهي فرحانه بالخيار ونقعد ناكل انا<br />وهي والعيال لحد ما نتسرطن وننتظر العلاج علي نفقة الدوله..ياسلام علي المتعه..<br />خيار الصوب ده طبعا يختلف عن الخيار الاستراتيجي اللي انا وزمايلي الحكام العرب بنستخدمه ... مش كل الخيار ياسي شاور خيار عن خيار يفرق<br />كفايه احلام بفي .... وارجع الي الواقع المرير اللي انا عابشه كحاكم عربي بيضحي علشانك ياشاور انت وبقية الشعب<br />اد ايه التضحيات جسيمه ومؤلمه ... لكن راحت الشعب تستاهل ان الواحد يضحي اكتر من كده<br />بس انا عاجبني المقال يا شاور لذلك ماتتردش اذا احتجت حاجه تتصل بي ... انا برده حاكم عربي ولي نفوذ بحكم الدستور والقانون<br />يعني مثلا لو اتزنقت في اتوبيس .. او ظابط شرطه غلس عليك ... ولامامور ضرائب رذل معاك<br />ابقي كلمني ياشاور اوعي تتردد<br />تكلمني فين ؟؟؟ ممكن تكلمني علي الايميل ده<br />hamdytawfik2000@yahoo.com<br />سلام ياشاور علشان اخوي وحبيبي بوش عايزني علي التليفون ومش عايز اتاخر عليه .. اصل لسانه طويل حبتين<br />ياله باي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130525/http://www.20at.com/article2.php?sid=1271"

