[[comments]]
order = 2
subject = "رجال الأمن"
author = "najah7"
posted = "2006-04-27"
text = "ذكرت الاخت كاتبة المقال المشاكل التي يعانيها رجال الامن اقول للاخت ان رجال الامن في العالمين العربي والاسلامي يقومون بحراسة الانظمة الكافرة التي اوجدها المستعمر الكافر لخدمة مصالحه والحيلولة بين الامة والعودة الى تطبيق اسلامها في الحياة ، ومخطئ من يظن ان رجال الامن يقومون على حماية شعوبهم فنظرة واحدة لما يحدث في المعتقلات والمظاهرات يبين بوضوح ما هي وظيفتهم وما الهدف من وجودهم فهم من جنس الحكام لا من جنس الشعوب ، ولذلك ما يعانونه من مشاكل هي جزء من العذاب المعجل لهم في الدنيا ولهم في الاخرة عذاب شديد قال رسول الله صلى الله عليه وسلم : يقال للجلواز( الشرطي) يوم القيامة ضع سوطك وادخل الناس وينطبق على الشرطة الذين باعوا آخرتهم بثمن بخس حتى يعيش الحكام في رغد ينفقون اموال الامة على ملذاتهم وشهواتهم ينطبق على الشرطة قول الرسول صلى الله عليه وسلم: اشد الناس ندما يوم القيامة رجل باع آخرته بدنيا غيره<br />ولهذا نبهنا رسول الله صلى الله عليه وسلم الى انه اذا عشنا في زمان حكامه ظلمة يجب ان لا نعمل في سلك الشرطة ابدا فكيف اذا عشنا في زمن حكامه ليسوا ظلمة فقط ولكنهم كفرة وفجرة وفسقة ايضا . قال رسول الله صلى الله عليه وسلم: يكون في آخر الزمان امراء ظلمة ووزراء فسقة وقضاة خونة وفقهاء كذبة فمن ادركهم فلا يكونن لهم عريفا ولا جابيا ولا خازنا ولا شرطيا<br />ولمعرفة تفسير الحديث انظر الموقع<br />www.maktoobblog.com/najah7"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125134/http://www.20at.com/article2.php?sid=510"

