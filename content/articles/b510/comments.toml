subject = "أعتداءاءت وحشية علي الاطفال في مراكز الشرطة المصرية"
author = "مصري"
posted = "2006-03-02"
text = "رصدت منظمة «هيومن رايتس ووتش» ما يتعرض له الأطفال من أعتداءاءت وحشية في مراكز الشرطة المصرية وأعلنته في تقرير خاص بهذه الظاهرة في مصر، وثقت فيه شهادات حية لأطفال تعرضوا لهذه الانتهاكات.يقول «زياد» (14 سنة) القاهرة: «كنا أربعة أولاد، وكنا في المنيل، والوقت كان نهار، وكان فيه ستة أو سبعة شرطة جايين بالبوكس، ضربوني علي ظهري بعصاية لما العصاية اتكسرت، وبعد كده بقوا يضربوني بقزازة لما القزازة اتكسرت».أما يوسف (16 سنة) فقال: «لما العساكر يقبضوا عليك بيضربوك، ويضربوك في القسم، حتي العساكر إللي يعرفوك بيضربوا»، وذكر «أنور» (15 سنة) أن «الشرطة إللي يبقوا جايين بعربيات بيضا، ساعات يكون عندهم عصاية كهربا، عصاية سودا بيستعملوها، كان فيه عربية بيضا ومسكوني، كان فيه أربع عساكر، بس واحد منهم ضربني بعصاية الكهربا، وسألني: إنت سايب بيتك ليه؟، وقلت له: أنا من هنا من الجيزة كنت عارف إني لو قلت له إن أنا من الصعيد، كانوا هيمسكوني ويرحلوني».عربة الترحيلات ويحكي «يحيي» (11 سنة) عن الوضع في عربة الترحيلات فيقول: «أول مرة اترحلت من المحافظة إللي أنا جاي منها، كان فيه خمسين أو ستين عربية ترحيلات، كبار وصغار، واحد من الكبار قال لي إن أنا «ابن ...........»، كنت متكلبش بالحديد، والكبار كانوا متكلبشين كمان، ماكنتش قادر أتنفس، وفكرت إن أنا هاموت، كنت أصرخ بس ماحدش عمل حاجة، وما فتحوش الباب إلا لما وصلنا، كان فيه عيال صغيرين بيعيطوا، بس ماحدش عمل لهم حاجة».ذكر تقرير المنظمة وصفا للوضع في عربة الترحيلات، والتي يتكدس فيها جميع من يتم ترحيلهم، حتي لو كانت درجة الحرارة مرتفعة للغاية، ويبقون فيها لساعات طويلة، حيث تستخدم كمقار احتجاز مؤقتة، دون تقديم طعام أو ماء.خطوات لابد منها وأوصي التقرير، بعدة توصيات لضمان حسن التعامل مع الأطفال الذين يتم إلقاء القبض عليهم، وكان منها علي سبيل المثال: استحداث منصب دائم في وزارة العدل لمراقبة معاملة الأطفال في مقار الاحتجاز، وأن يقوم النائب العام بإصدار تعليمات لوكلاء النيابة، بإعطاء أولوية للتحقيق في قضايا القبض التعسفي والتعذيب وإساءة المعاملة، التي ترتكب ضد الأطفال المحتجزين لدي الشرطة، ومقاضاة مرتكبيها.وأوصي التقرير بضرورة حماية الأطفال الموجودين في رعاية الدولة، من الاحتجاز التعسفي، والتعذيب والمعاملة القاسية أو اللاإنسانية، أو المهينة، من قبل الشرطة أو الموظفين الآخرين، وأن تدعم وزارة العدل استحداث سلك محترف ودائم من وكلاء النيابة والقضاة والأخصائيين الاجتماعيين، المتخصصين في التعامل مع الأحداث، وأن تتيح وزارة الداخلية الفرصة الكاملة للمنظمات غير الحكومية في الوصول إلي أماكن احتجاز الأطفال، وأن تؤسس تدريبا إلزاميا للشرطة حول الاحتياجات الخاصة بالأطفال وحقوقهم.ودعا التقرير إلي تقليل دور الشرطة في القضايا المتعلقة بالأطفال إلي الحد الأدني، والتأكد من أن الأوضاع في كل مقار الاحتجاز التي يودع فيها الأطفال تفي بالمعايير الدولية لإدارة النظام القانوني للأحداث، كما لابد من الإنهاء الفوري لممارسات القبض علي الأطفال المعتبرين «معرضين للانحراف» أو معرضين للخطر."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125134/http://www.20at.com/article2.php?sid=510"

