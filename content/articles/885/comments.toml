subject = "لا مش صحيح يا أخ وليد"
author = "مسلم"
posted = "2006-08-09"
text = "أخي وليد كلامك غير صحيح<br />هذا الشيخ افتى منذ زمن وليس قصده الفتوى في هذه الحرب.<br />افهم قصد الشيخ.. ثم هو وضح.<br />والخطأ مش خطأه السبب هم الشباب الذين اجتهدوا ونشروا الفتوى دون الرجوع له.<br />استغفر ربك وتوب مما قلت.<br />للمعلومية الشيخ عبدالله بن جبرين مش مفتي المملكة ولكنه عضو هيئة كبار العلماء في السعودية."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124359/http://www.20at.com/article2.php?sid=1128"

