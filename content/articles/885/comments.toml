author = "محمد سالم مسلم سني مصري"
posted = "2006-08-10"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم ورحمة الله وبركاته<br />اردت ان اريكم ماذا حدث اثناء خطبه الجمعه (28/7/2006)<br />الخطيب هو الشيخ ( محمد احسان ) احد شيوخ مدينه بورسعيد الذى اكن له كل احترام وتقدير<br />و فى خطبه الجمعه جعل كل الخطبه عن مساؤ الشيعه وانتقادهم للصحابه والرسول وكل الاخطاء<br />التى تجعل المسلمين السنه يكرهونهم وتبعد بيننا وبين الشيعه واخذ يقص ويقول ويعيد ويزيد<br />حتى امتلء الجامع بالسخط ليس على الشيعه ولكن على الشيخ القدير واذا برجل من اقصى الشمال<br />يهب واقف ويقول ( مش وقت الكلام دة ) ورجل فى اقصى اليمين يقول ( حرام عليك انت بتقول ايه )<br />ويقف رجل فى المنتصف ويقول ( انت تريد فتنه ) واشتد الصياح من كل ارجاء المسجد و لفطانه الشيخ<br />اقام الصلاة قبل ان يفرغ من بقيه الحديث وانهى الصلاة ( بسرعه ) وبعد الصلاة بدء التحرش بالشيخ<br />وصال الهرج والمرج فى الجامع و حضر بعد الصلاة مدير امن بورسعيد وكثرة من رجال الشرطه<br />واخذو يهدئون من الموقف ومن السخط العام داخل المسجد و اصحاب الشيخ اخرجو الشيخ باعجوبه<br />وانقذوة من بين يد المصلين وقال الكثير ( نحن نعرف عن الشيعه الكثير ولكن ليس هذا بوقت الحديث عن مساؤ الشيعه )<br />وانا ازف لكم ان الفتنه لايمكن ان تحدث ونحن اقوى بكثير من هذة الخلافات وكيف هب ابناء بورسعيد<br />هؤلاء المقاومين بالطبع والطبائع للوقف بحزم امام هذة الفتنه و الله كنت فرح فرحا كبير جدااا<br />ان ارى هذا التفاعل الكبير و الحمد لله انا الان اطمئن كثيراا<br />ملحوظه: لم يذكر الشيخ العدوان ولا المقاومه وهذا ما اثر الغيظ<br />كان يريد ان يحزر من الشيعه وان يجعل الناس غير مبهورين بهم<br />ولكن ليس هذا وقت الحديث عن ذلك<br />عاشت المقاومه وعاش المقاومين"
archived = "2006-11-02"
