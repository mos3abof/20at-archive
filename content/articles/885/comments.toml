subject = "ياشيخ عليك بالقران أولا"
author = "جابر الإباضي"
posted = "2006-08-11"
text = "يا أيها المسلمون أرجوكم أن لا تنساقوا وراء الفتاوى أي كلام البشر وتعرضوا عن ذكر الله تعالى الذي لا ريب فيه هدى للمتقين وان تغربلوا فتاواكم على غربال القران الكريم , العجب ياإخواني كيف نرى أبرياء يقسفون في ديارهم ليلا ونهارا بعدو لا يرحم لا سنيا ولا شيعيا ولا يفرق بينهم إلا أنهم يعلمون أن هناك إسلاما يجب أن يستأصل من جذوره وإلى الأبدألم تروا انهم وقفوا كلهم ضد الإسلام رغم الخلاف الموجود بينهم ,ألا ترون أن في فتوى الشيخ المحترم إعانة صريحة للكيان الصهيوني . أرجو من الإخوة التفكر بعمق والعودة إلى القران الكريم أولا فقد هجرناه ونطلب من الله النصرة . قال تعالى - ومن أعرض عن ذكري فإن له معيشة ضنكا, وقال عز وجل - ومن الذين قالوا انا نصارى اخذنا ميثاقهم فنسوا حظا مما ذكروا به فاغرينا بينهم العداوة والبغضاء الى يوم القيامة وسوف ينبئهم الله بما كانوا يصنعون- أنصروا إخوانكم الموحدين وادعوا لهم بالنصرة وإلا فنحن في المخطط الصهيوني ال محال والسلام عليكم ورحمة الله."
archived = "2006-11-02"
