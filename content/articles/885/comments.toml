[[comments]]
order = 12
subject = "إلى الوهابيين التكفيريين موتوا بغيظكم!"
author = "إلى الوهابيين التكفيريين موتوا بغيظكم!"
posted = "2006-08-09"
text = "موتوا بغيظكم!<br />لقد أصبحت الوحدة الإسلامية واقعاً فرضته عليكم المقاومة الإسلامية وسيدها حسن نصر الله..<br />موتوا بغيظكم!<br />لقد وصل العشق بالله بين السنة والشيعة إلى حد أفقدكم صوابكم، كل ذلك بسبب انتصارات المقاومة الإسلامية المؤيدة بالله ورسوله وكل المؤمنين اللذين يساندونها بالمال والكلمة والدعاء.<br />موتوا بغيظكم!<br />لقد أصبحت الوحدة الإسلامية أمراً واقعاً بسبب الوعي الشعبي لمقتضيات المرحلة، رغم أصواتكم النشاز ومحاولاتكم التعلق بقشة التشويش على وحدتنا.<br />موتوا بغيظكم!<br />لقد تكشف للعالم الفرق بين من هو المجاهد الحقيقي ومن هو الذي ضل طريقه ووجه سلاحه وعبواته المتفجرة لتمزيق أجساد المسلمين في المساجد والحسينيات والأسواق.<br />موتوا بغيظكم!<br />لقد انتصر الدم على السيف مجددا في لبنان وفلسطين (وهي مقاومة سنية، فماذا قدمتم لها؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟). وهذا النصر هو لكل الأمة بكل طوائفها، ومن ضمنها أنتم، شئتم أم أبيتم! فالخير هنا يعم، والشر يخص! لقد فرض عليكم انتصار مشرف لم تعتادوا عليه ولا تستحقونه!<br />موتوا بغيظكم!<br />لقد سقطت أقنعتكم عن وجوه مشوهة ملؤها الحقد، الحقد على كل ما هو نظيف وشريف في هذه الأمة، الحقد على الشرفاء اللذين أثلجوا صدور الأمة بانتصارات بطولية ضد عدو يشبهكم في عنصريته وإجرامه..<br />موتوا بغيظكم!<br />لقد اختار المقاومون الأبطال والمؤمنون الشرفاء من خلف أظهرهم خط المقاومة ضد عدو الأمة الحقيقي، تاركين لكم تكفير المؤمنين بسبب أطوال أثوابهم أو لحاهم!<br />موتوا بغيظكم!<br />لقد مكرتم ومكر الله .. والله خير الماكرين!!<br />موتوا بغيظكم!<br />فكلنا شيعيون من أجل لبنان.. وكلنا سنيون من أجل فلسطين..<br />ولا عزاء لكم!<br />والسلام على غيركم ورحمة الله وبركاته...<br />بل نقول لكم ..... \"سـلامـــا!!!\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124359/http://www.20at.com/article2.php?sid=1128"

[[comments]]
order = 13
subject = "وحدة الامة مطلبنا ، ولكن!!"
author = "مسلم"
posted = "2006-08-09"
text = "يظن بعضهم أننا نكره وحدة الامة ، حاشا وكلا ثم كلا!!<br />والله -الذي لا يحلف بغيره - اننا من أشد الناس حبا لوحدة الامة وتوحدها ، وليت شعري لو صدقتم يا معشر الشيعة في ادعائكم الحرص على وحدة الامة ، ولكن هيهات ، فدينكم مبتناه على الكذب ومسبة خير البرية ، ودين كهذا لا يحمل أصحابه الا على بغض الاخر والكيد له ، مهما ادعيتم وزعمتم الحرص على وحدة الامة.<br />انظروا الى عامة أهل السنة -ما أصدقهم وأبرهم واحسن أفعالهم ، أنظروا الى تناغم مواقفهم وعدل ارائهم ، فهاهم يناصرون الجهاد والمجاهدين في كل مكان في افغانستان وفي العراق وفي الشيشان واخيرا في لبنان ، لم يقولوا هؤلاء شيعة فلا نناصرهم ، بل شدوا على أيديهم ، وأنكروا على من يأبى نصرتهم .<br />هل تستتطيعون انتم -يا معشر الشيعة أن تفعلوا مثلهم ، فتناصرون المجاهدين في العراق وافغانستان ؟؟ كما نناصركم نحن في لبنان؟؟؟!!<br />(إن فعلتم ،نتوحد معكم ، وهيهات ~أن تفعلوا)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124359/http://www.20at.com/article2.php?sid=1128"

[[comments]]
order = 14
subject = "موتو بحسرتكم فأن النصر من الله"
author = "محمد على حسن"
posted = "2006-08-09"
text = "يا نصرنا العزيز ....و يا قائد الزمان المقدس ... بقلم ماريا المعلوف<br />* ماريا معلوف سيدة مسيحية من لبنان ومقدمة برنامج بلا رقيب في قناة نيوتي في، وهي كاتبة أيضا أنظروا ماذا كتبت في السيد حسن نصرالله.<br />دعني أركع أمام قدميك – الثابتتان على الحق – يشاركني الرغبة الكثيرون ممن يعرفون قدرك الرفيع ... أنت يا نصرنا العزيز ....و يا قائد الزمان المقدس .<br />تمنّيتك والداً..و أنت الأب الشرعي لأمتنا اليتيمة ...<br />حلمت بلقياك....و كان الله حليفي فجمعني بوالديك في صدفة خير من ألف ميعاد.<br />على حدودنا مع سوريا التي كثيراً ما تمنيت أن تسقط...<br />تمنيت أن اشارك جنودك المقاومين فرحة الجهاد المقدس في جنوب لبنان الصامد.<br />تمنيت أن انتسب لجنوبناالأبي....قانا...رميش...بنت جبيل...مارون الراس.<br />اني أعترف بأن جبناً يمنعني من مشاركةالأطفال و الشيوخ و النساء الذين شملتهم بمحبتك و تقديرك و امتنانك و أنه والله لعظيم.<br />تمنيت أن أقدم لك كوباً من ماء سلسبيل لتروي ظمأنا نحن محبيك و مريديك.<br />لا تغص... و لا تدمع... سيدنا و سيد المقاومة و سيد الأحرار و الشرفاء في أمتنا العربية.كم هو رائع صوتك الرخيم عندما يصل الى أفئدتنا و كم هي بليغة كلماتك التي أضحت تترددعلى ألسنة الملايين عرباً و مسلمين.<br />سيدي كم من مرة تمنيت أن أجفف عرقاً طاهراً يبدو كحبات اللؤلؤ .على جبينك الطاهر الشامخ و منه تستمد الأمة شموخها.<br />رأيتك في خيالي تربت على كتفي و تخبرني أن المسيح آت ليخلص الأمة من الهلاك.<br />سيدي و سيد المقاومة متى نراك رؤية العين ....منتصب القامة كما عهدناك شامخاً في وسط الحصار العظيم الذي يتحدّى بفضل ندائك الى بناء صلب لشعب أبيّ يستمو منك العنفوان و العزة.<br />هل لي أن أتصور معك حالة أبي عبد الله الحسين عليه السلام مرمياً في وسط صحراء كربلاء \" قد قتل أولاده حتى طفله الرضيع و اخوانه و اخوته حتى العباس و أصحابه و أنصاره ، و ما هي الا دقائق معدودات حتى يحتز رأسه و تدوس الخيل صدره و ظهره و يهجم الناهبون على خيامه و ينهبوا أمواله و يسبو نساءه زينب و رباب و أمّ كلثوم و سكينة في اللحظات الأخيرة التي يجود بها بنفسه يتوق الحسين الى الله عز و جلّ و يقول له: اللهم متعالي المكان عظيم الجبروت شديد المحال غني عن الخلائق ، قادر على ما تشاء ، قريب الرحمة ، صادق الوعد، سابغ النعمة ،حسن البلاء ،قريب اذا دعيت محيط بما خلقت ،قابل التوبة ، لمن تاب اليك قادر على ماأردت ومدرك ما طلبت شكور اذا شكرت ذكور اذا ذكرت ،أدعوك يارب ، محتاجاً، وأرغب اليك فقيراً،و أفزع اليك خائفاً ،و أبكي اليك مكروباً، ولنتذكر ماأعلمته لنا من دعوات الأمام الحسين ( رض ) في اللحظات الأخيرة ،و أستعين بك ضعيفاً و أتوكل عليك كافياً ،احكم بيننا و بين قومنا، فانهم غّرورنا، و خدعونا ،و خذلونا و غدروا بنا، و قتلونا ونحن عطرة نبيك وولد حبيبك محمد بن عبدالله ،الذي اصطفيته برسالة و ائتمنته على وحيك ، فاجعل لنا من أمرنا فرحاً، و مخرجاً برحمتك، يا أرحم الراحمين، صبراً على قضائك ، يا رب، يا غياث المستغيثين، مالي رب سواك، و لا معبود غيرك ، صبراً على حكمك ،يا غياث من لا غياث له ، يادائما\" لا نفاذ له، يا ٌمحيي الموتى، ياقائما\" على كل نفس بما كسبت \" .<br />وبعد هذا الكلام هل يصح الكلام ؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124359/http://www.20at.com/article2.php?sid=1128"

