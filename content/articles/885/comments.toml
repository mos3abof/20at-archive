[[comments]]
order = 4
subject = "الى الشيخ السديس"
author = "حسن المصري"
posted = "2006-08-09"
text = "اتق الله يا سديس<br />اراك اصبحت قارء جيدا للقرآن وكفا<br />اين دعائك الذي تدعم به المجاهدين ضد عدوي وعدوك وعدو الله<br />اين نصرتك لحزب الله<br />اني انصحك ان تقراء القرآن بتمعن ولا تكون كالذين حملوا التوراة<br />اتخشى ان تدعوا للذين خرجوا جهادا في سبيل الله<br />اتخشى منصبا ام عقابا<br />الا تظن ان ستبعث يوم الدين فيسالك رب العالمين بماذا ايدت جند الله المجاهدين<br />ااستكثرت عليهم الدعاء<br />ماذا كنت ستفعل لو كنت في عهد رسول الله في غزوة خيبر<br />هل ستقعد مع القاعدون ام تقول لا طاقة لنا بقتال اليهود<br />اتقي الله ربك وانصحك ان تقرء بتدبر الجزء الثامن والعشرين من المصحف<br />الذي تحفظه عن ظهر قلب ولكن للاسف حكمت احكام القرآن لحكامك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124359/http://www.20at.com/article2.php?sid=1128"

