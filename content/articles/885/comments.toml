text = "فتوى الشيخ ابن جبرين .. لم تختلف مع بيانه الأخير .. في مضمونها ..<br />فهو لم يتطرق إلى حزب الله في بيانهبنصر ٍ أو تأييد ..<br />بل ظهر جلياً أن الشيخ مع قتال اليهود .. لكنه ضد حزب الله ..<br />و كثير من علماء السنة الثقات .. يقنتون في صلواتهم بـ ( اللهم أهلك الظالمين بالظالمين .. و أخرج المسلمين من بينهم سالمين ) ..<br />* لذا فيبقى بيان الشيخ دلالة على سياسته المثالية ..<br />و تبقى فتواه دليلاً على إخلاصه و تفانيه و وضوح مراده في نصر الإسلام و أهل السنة النبوية المطهرة ..<br />قاتل الله اليهود و النصارى .. و الروافض .."
