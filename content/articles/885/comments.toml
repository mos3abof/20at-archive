text = "لو كان هنالك من شخص عانى من الصفويين في العراق، يظن بأن له كلمة مسموعة بين الناس، فلربما ناشد المسلمين بالدعاء بنصرة إسرائيل على حزب الله. وأسألوا من دخل أبو غريب ورأى الصفوينن يعذبون أهل السنة باسم المليشيات وليس باسمه هو شخصيا. وبما أننا جربنا ظلم اليهود ولم نجرب تسلط الشيعة، لذلك نستنكر مثل هذه الفتاوى التي عرضتها الجزيرة.<br />الصواب ما قاله الشيخ الجبرين، بأن ندعو الله بنصرة أهل السنة، إذ أنهم عصبتناوإخوتنا. هب أن حزب الله انتصر انتصارا حاسماً وصار له الأمر والنهي في لبنان كله. ما الذي سيتلقاه أهل السنة من الحزب؟؟ سوف يتلقى أوامراً بمنع الصلاة في المساجد إلا إذا قالوا في الأذان (أشهد أن علياً ولي الله)، وإذا جعلوا الإمام شيعياً. هل تستغربون كلامي؟؟!!!<br />ماذا لو قلت لكم أن هذا يحدث في إيران...حيث يسمح لعباد النار (الزرادشتية) بعبادة النار، ولا يوجد في إيران مسجد سني واحد، علما أن أهل السنة يزيدون عن 10ملايين نسمة!!<br />وماذا لو قلت لكم أن سبب وقوف أهل السنةفي العراق مع صدام في تمرد عام 1991 ، هو أن الشيعة منعوا أهل السنة في مدينة زبير من الصلاة إلا إذا قالوا (أشهد ان عليا ولي الله)، وقالوا : ماكو إمام إلا علي، نبغى حاكم جعفري (بمعنى ليس هناك إمام إلا علي، نريد حاكما شيعيا!!).<br />ليس هناك من يبغض علي رضي الله عنه بين أهل السنة. لكن لو تتبعت سيرة اليهود تجد أنهم وإن حولوا بعض المساجد إلى مواخير إلا أنهم يسمحون لك بالصلاة...الشيعي لن يسمح لك!!<br />لكن هل ندعو الله أن ينهزم حزب الله؟ كلا ندعو الله أن يختار الخير لنا، وأن يبعد عنا الظلمة من كل الأديان، وهذا لب ما قاله الجبرين ، وهو لم يتراجع عن شيء. لكن مشكلته أن الجزيرة لها عين انتقائية في نقل الأخبار. ولكم أن تلاحظوا الفارق بينها وبين قناة العربية. لا يعني هذا مدحا في العربية، لكنه لفت نظر إلى السياسات المتبعة في نقل الخبر!.<br />مرة أخرى، نحب أن نرى إسرائيل مهزومة، لكن الحذر من الاستجارة من الرمضاء بالنار"
archived = "2006-11-02"
