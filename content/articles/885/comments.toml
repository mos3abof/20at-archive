text = "اتق الله يا صاحب المقال<br />علي ماذا يتوب الشيخ الجليل؟؟؟<br />فتواه سليمة وصحيحة....من لا يعرف الشيعة لا يتكلم<br />والاخ الذي دخل يسب الامام السديسي اقول له قبحك الله ...ماذا تعرف انت عن السديسي حتي تتكلم وتخوض فيه؟؟؟<br />اتق الله واخرس لسانك ولا تطاول علي اهل العلم"
