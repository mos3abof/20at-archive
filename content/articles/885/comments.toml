subject = "ارحموا نفسكم"
author = "عن اى شئ يتوب الرجل هل اخطئ ثم عاد وصحح"
posted = "2006-08-09"
text = "كل الاعتراض ان هذا ليس وقت الفتوى اى لايجب اظهار لخلاف بين السنة والشيعة فى ذلك الوقت .<br />اما ان نستغل ذلك الموقف لتجميل وجه الشيعة فهذا لا يصح انا متفق بشدة مع ما يفعله حزب الله لانه يحارب اعداءنا جميعا .<br />لكن ارجو ان تعودوا ايها السنة لمراجع الشيعة بعد زوال الغمة باذن الله وتعرفوا ماذا يعتقدون وما فكرهم عن اهل السنة وفى النهاية هذا ليس وقت لتقسيم المسلمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124359/http://www.20at.com/article2.php?sid=1128"

