subject = "لاسف"
author = "كريمة"
posted = "2006-09-15"
text = "لاسف هده مقدمة كلامي اقف مستغربة لامة منهجها القران الكريم وسنة الحبيب بابي هو وامي وتجد خلافاتها علت وارتفعت كل يدلي بدلوه في موضوع حرب لبنان ومقاومة حزب حسن نصرالله كل نصب نفسه عالما اوداعيا يبدي وجهة نضره وكان الامر قضية فكرية يجتهد في سبر اغوارها لاسف مرة اخرى من هدا المنبر حينما اجد السباب والشتم بين المسلمين بالسطور المكتوبة كيف يمكن لاحد ان يحترم من لم يحترم اخاه والله هدا عيب وحرام واتقوا الله في العلماء مهما اخطاول فواجبنا نحوهم التادب معهم واجلالهم تم بيان خطائهم هدا هو النصح لله ولرسوله ولعامة المؤمنين ولا داعي لكترة التعليقات الفارغة التي لا تزيد القلب الا قسوة وايلاما بدل ان نسعى في لم الصف ودرء الفتنة نسعى في احياءها الا اني بلغت فاشهدول قولي يا امة محمد التي قال فيها النبي بابي هو وامي تركت فيكم ما ان تمسكتم به لن تضلوا وهو كتاب ربي وسنة الحبيب صلى الله عليه وسلم"
archived = "2006-11-02"
