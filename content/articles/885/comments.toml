[[comments]]
order = 6
subject = "العلم أمانة عند العلماء"
author = "مسلم"
posted = "2006-08-09"
text = "العلماء هم ورثة الانبياء ، وعملهم هو تجلية الحكم الشرعي في المسائل الطارئة ، وربما يحسن السكوت احيانا ، ولكن ألحق احق أن يتبع .<br />فلو أن عالما ربانيا سئل<br />هل يجوز القتال تحت رأية بدعة كحالةالشيعة(بالمناسبة هذه احسن احوالهم ، والا من العلماء من وصفهم باكثر من هذا) ، فما ظنكم سيجيب العالم ؟<br />إذن القضية ليست سهلة ، والعلماء قد اختلفوا في القتال تحت امرة المبتدعين ،<br />ولهم الحق في أن يختلفوا فالبدعة شر كلها.<br />خلاصة الامر ، أقلوا لوم الشيخ ، فليس وحدة من أفتى بهذا بل غيره كثير ، الا أنهم اختاروا أن يسكتوا هذه المرة ، حفظا لوحدة الامة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124359/http://www.20at.com/article2.php?sid=1128"

