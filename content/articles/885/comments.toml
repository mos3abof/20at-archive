subject = "أيا من كنت شيعيا"
author = "لا يهم"
posted = "2006-08-24"
text = "أيا أيها الشيعى الرافضى هذه كلمة صدق لك من قلوب المسلمين..<br />لسنا مناظرين ولا مجادلين ولكنا راجعين الى الحق المنزل من لدن رب العالمين..<br />فان كنت منا معاشر الموحدين فيا من شهد لله بالوحدانية ولنبيه بالرسالة قل أشهد أن لا اله الا الله وأن محمدا عبده ورسوله..<br />فان أنت أقررت بها توحيدا خالصا صادقا، وهممت بها بكل لوازمها وواجباتها، فناج الرب وقل له،<br />اللهم انى أشهدك بصدق بغير تقية ولا نفاق، وأقسم باسمك الأعظم أنى قد برأت اليك من كل من قال أن كتابك الذى بين أيدى المسلمين، والذى عملت به الأمة فى زمان الأولين والأخرين وأجمعت من أقصاها الى أدناها على صحته، محرف مكذوب أو أنه ينقصه حرف مما أنزلت أو يزيد عليه حرف أو أنه قد امتدت اليه يد بتحريف أو بتغيير أو بتدليس..<br />قل له، اللهم انى أشهد بكفر من زعم بذلك وأبرأ اليك منه ومما يقول..<br />قل، اللهم أنى أشهدك أنى أقر ببراءة نبيك صلى الله عليه وسلم من الخيانة ومن التأمر مع أهله وذويه على صحابته وجمهور المسلمين فى زمنه ومن بعده يا رب العالمين..<br />قل له، اللهم انى أشهد أنه قد أدى الأمانة وبلغ ما أنزل اليه حق التبليغ ولم يكتم الحق ولم يكتم شهادة عنده منك أبدا أو علما خص به قوما من ذويه ووصاهم بكتمانه..<br />قل، اللهم انى أشهدك أنى برئ ممن يزعمون نفاق أل البيت المطهرين للمسلمين وانتسابهم لدين غير دين الصحابة الذى أظهرته على العالمين يا رب العالمين..<br />قل، اللهم انى أشهدك أنى أبرئ عليا رضى الله عنه من صفات الربوبية التى نسبت اليه، ومما أشركوه بك ومما وصفوه عليه من كتمان الحق الذى أنزلته عن المسلمين، وأشهد ببراءة فاطمة بنت رسول الله صلى الله عليه وأله وصحبه وسلم وولديها من بعدها مما نسب اليها من تلقى وحى بعد خاتم النبيين، ومن فرية كتمانها لكتاب أنزل عليها من بعد وحيك لنبيك الخاتم يا رب العالمين..<br />قل، اللهم انى أشهدك أنى برئ ممن جعلوا لك أل البيت شركاء وزادوا عليهم تسعة من بعدهم نسبوا اليهم ما لا يكون الا لله الواحد القهار رب السموات والأرض وحده لا شريك له..<br />قل، اللهم انى أشهدك أنى برئ ممن يدعون أناسا من دونك يسألونهم ما لا يملكه الا أنت وحدك، ويعتقدون فيهم حتى من بعد موتهم ما لا يكون لأحد الا لله رب العالمين..<br />قل، اللهم انى أشهدك أنى برئ من دين قوامه الكذب والنفاق وخديعة المسلمين جميعا وتكفيرهم والتربص بهم..<br />قل، اللهم انى أشهدك أنى برئ من كل كاذب دعى أن لكتابك الذى نزل بلسان عربى مبين باطنا غير ظاهره، وافترى عليك الكذب بتأويل والحاد فى كتابك يا رب العالمين..<br />قل له، اللهم انى أقر لك بالصدق والحكمة وتمام العلم والعدل والرحمة بالعالمين، وأنزهك سبحانك عما يقول المجرمون.. فلست يا مولاى بالرب الذى يقصر علم الحق فى خاتم الرسالات على فئة من عباده يخصهم به ويأمرهم بكتمانه عن سائر الناس وعن المؤمنين، يحبسه في تلك الفئة ويخرج الباطل للعالمين!.. ذاك معبود يهود الذى زعموا تآمره معهم على سائر البشر، تقدست أسماء الله وتعالى عن مثل ذلك علوا كبيرا..<br />قل، اللهم انى أبرأ اليك من كل زنديق يسب ذاتك العلية يزعم أنك قد أحطت خاتم النبيين بشرذمة من الكافرين وجعلتهم له صحبا منافقين مبدلين للدين وللأمة أئمة مضلين من بعده يا ذا الجلال والاكرام..<br />قل، اللهم انى أبرأ ممن زعموا العصمة لأحد من البشر غير النبيين والمرسلين عليهم صلوات الله أجمعين..<br />قل، اللهم انى أبرأ اليك ممن جعلوا دعاء سائر النبيين شركا بك وتوسلا ببشر أمثالهم مخلوقين يا رب العالمين..<br />قل، اللهم انى أبرأ اليك من كل من زعم أنك يبدو لك البداء وتتراجع عما قدرت فى علمك وفيما قضيت من قضاء.. تبت اليك ربى وبرأت لدينى.. سبحانك هذا بهتان عظيم..<br />فاشهد معنا يا من تصلى الى قبلتنا وتحج الى كعبتنا شهادة صدق ويقين بتلك المعانى جميعا، وأشهد الله على صدقك فى الاقرار بها، ولا تقلها تقيا وكذبا فالله مطلع على سريرتك وهو أعلم بك منك.. فان أنت فعلت، فقد فئت لأمر الله، ورجعت لجماعة المسلمين..<br />فان أنت صدقت فى ذلك فابرأ من كتب يملؤها الحقد والكذب والبهتان على الله وعلى رسوله وعلى أل البيت الأطهار والصحابة الأبرار رضى الله عنهم وأرضاهم أجمعين.. ابرأ من الكلينى وكتبه ومن المجلسى وكتبه ومن ابن بابويه والطوسى والطبرسى وغيرهم من الكذبة الزنادقة.. رد عليهم جميعا فراهم وافكهم.. وأحرق تلك الكتب وادع الناس لمفارقة كل من أخذ علمه منها واتخذ من أصحابها أئمة للدين..<br />ان كنت تحب أل البيت عليهم رضوان الله فهم والله من ذلك الضلال براء..<br />فهلا براتهم وبرأت صحابتهم الأطهار وامامهم وامام المسلمين جميعا خاتم المرسلين صلى الله عليه وأله وصحبه من ذاك الدنس ونزههم عنه.. من قبل أن يأتى يوم لا بيع فيه ولا خلال؟<br />هذه كلمتنا، معاشر المسلمين الموحدين، أهل الكتاب الحق والسنة الحقة.. جماعة المسلمين.. المسلمين لله وحده لا شريك له.. ولا كلمة لنا غيرها، لا نرضى لها بديلا فلا وسط بين الحق والباطل وليس بعد الحق الا الضلال.. هذه كلمتنا نلقى الله عليها، وان دعونا دعونا اليها، فهى الحق المبين الذى لا ترضى سواه قلوب المؤمنين الذين أسلموا وجوههم وقلوبهم لله رب العالمين..<br />(فَذَلِكُمُ اللّهُ رَبُّكُمُ الْحَقُّ فَمَاذَا بَعْدَ الْحَقِّ إِلاَّ الضَّلاَلُ فَأَنَّى تُصْرَفُونَ)<br />(وَاعْتَصِمُواْ بِحَبْلِ اللّهِ جَمِيعاً وَلاَ تَفَرَّقُواْ وَاذْكُرُواْ نِعْمَتَ اللّهِ عَلَيْكُمْ إِذْ كُنتُمْ أَعْدَاء فَأَلَّفَ بَيْنَ قُلُوبِكُمْ فَأَصْبَحْتُم بِنِعْمَتِهِ إِخْوَاناً وَكُنتُمْ عَلَىَ شَفَا حُفْرَةٍ مِّنَ النَّارِ فَأَنقَذَكُم مِّنْهَا كَذَلِكَ يُبَيِّنُ اللّهُ لَكُمْ آيَاتِهِ لَعَلَّكُمْ تَهْتَدُونَ)<br />(إِنَّ الَّذِينَ فَرَّقُواْ دِينَهُمْ وَكَانُواْ شِيَعاً لَّسْتَ مِنْهُمْ فِي شَيْءٍ إِنَّمَا أَمْرُهُمْ إِلَى اللّهِ ثُمَّ يُنَبِّئُهُم بِمَا كَانُواْ يَفْعَلُونَ)<br />فان أردت الاسلام فكذا الاسلام.. وما عداه فالله ورسوله وأله وصحبه منه براء.. والله المستعان على ما يصفون..<br />والحمد لله رب العالمين"
archived = "2006-11-02"
