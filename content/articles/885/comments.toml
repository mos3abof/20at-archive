text = "رأيته صريحا يسب الصحابي الجليل ابو سفيان رضي الله عنه.. وأما يكفيك أنه يسب أيا بكر .. خليفة رسول الله ، الذي رافقه بالهجرة ، وتكلم الله عنه حينما كانا في الغار ..<br />رسول الله قال أنه لو أراد أن يتخذ خليلا .. لاتخذ أبا بكر خليلا .. لكن قلب النبي صلى الله عليه وآله وصحبه وسلم قد امتلأ حبا لله ..<br />ومن تطاول على مشائخنا كابن جبرين أو ابن باز .. سيحاسبه على ذلك الله"
