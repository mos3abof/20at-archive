subject = "بارك الله في عالم الامة الاسلامية"
author = "يوسف"
posted = "2006-10-25"
text = "ارجو من المسلمين ( عدا الرافضة ) ألا يتعاطفو مع أي أحد خصوصا مع المسمى حزب الله قبل أن يقرأو عقيدة المنتمين اليه ، حيث أنها عقيدة مشركة تلبس لباس الاسلام وترفع شعارات اسلامية وهي في الاساس تعتقد بتحريف القرآن وتكفير صحابة رسول الله صلى الله عليه وسلم ما عدا علي رضي الله عنه وقليل من الصحابة وتعتقد اعتقادات كثيرة باطلة ، اما ماتعمل هذه الطائفة باهل السنة قاسئلو عن أحوال أخوانكم من اهل السنة في ايران والعراق حيث تمكنوا هناك .<br />والله المستعان"
