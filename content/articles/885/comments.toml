[[comments]]
order = 21
subject = "اشكر الوهابية لانها كانت سبب تشيعي"
author = "محمد على حسن"
posted = "2006-08-12"
text = "الاسم : ابو محمد علي<br />الدولة و المدينة : هولندا<br />تاريخ ومكان الولادة : -11-1977 المغرب<br />الرتبة العلمية : البكالوريوس<br />الدين والمذهب السابق : مالكي - وهابي<br />المؤلّفات : بعض الكتابات<br />الإقتراحات : ترجمة الكتب المهمة الى جميع اللغات وخصوصا الهولندية للاسف ليست هناك كتب مترجمة الى الهولندية,الوهابية نشطة جدا في هذا المجال وخصوصا في هذا البلد<br />المساهمة:<br />ومن لايريد سفينة النجاة؟!<br />اللهم صل على محمد وآل محمد.<br />بعد ان كانت بداية التعرف على الشيعة والمستبصرين شاءت الاقدار ان اهاجر الى بلاد الغرب وبدأت حياة جديدة والتعرف على اناس جدد من جميع الطوائف الاسلامية ولكن كان احتكاكي اكثر مع الفرقة الوهابية ((السلفية)) ,فكانت نظرتي تجاه هذه الفرق معتدلة وحتى تجاه الشيعة ولكن للاسف حينما تسمع الوهابية موقفي المعتدل تجاه الشيعة تأنبني على ذالك ويقولون لي ان هذه الطائفة اي الشيعة الامامية اخطر من اليهود,انهم يكفرون الصحابة ويتهمون عائشة ب...و..و... .<br />فاحترت بين ماعرفته من المستبصرين من اخلاق سمحة والالتزام الديني و... وبين مااسمعه من الوهابية.فكان الاختيار صعبا والقرار اصعب ولكن بفضل الله تحررت من القيود وتمردت على العادات والتقاليد فقررت ان امضي في البحث حتى ولو كلفني ذالك كثيرا من الاشياء.<br />من هنا بدأ البحث عن سفينة النجاة, ((ومن لايريد سفينة النجاة؟؟؟!!!)) والقصة طويلة فيها كثيرة من الصعاب والاشواك ولكن الحمد لله الذي هداني الى هذا وما كنت لاهتدي لولا ان هداني الله,والحمد لله الذي اخرجنا من حدود البهيمية الى حدود الانسانية بولاية علي وآل علي.<br />((اشكر الوهابية لانها كانت سبب من اسباب الرئيسية في ان دفعتني للبحث عن الحق بافتراءتها على اتباع محمد وآل محمد)).<br />والسلام عليكم ورحمة الله وبركاته والى فرصة اخرىان شاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124359/http://www.20at.com/article2.php?sid=1128"

[[comments]]
order = 22
subject = "لماذا تناصر العدو بفتاواك يا شيخ؟"
author = "محمد على حسن"
posted = "2006-08-12"
text = "بعد فاتورة هائلة جاوزت الـ 75 مليار دولار صرفها التيار السلفي على نشر فكره عبر العالم في ربع القرن الأخير، وفقا للرئيس الأندونيسي الأسبق عبد الرحمن وحيد، وفي ظل وجود ما لا يقل عن 60 الف منبر سلفي في السعودية وحدها، فضلا عن مئات أخرى في جهات الأرض الأربع تسوّق لهذا الفكر حصرا، نستطيع القول اليوم أن هذه السلفية تلقت أخطر طعنة في تاريخها وأصابتها في مقتل، ليس على يد أعداءها بل على يد بعض من أبرز عرّابيها، الذين اختاروا من حيث يريدون أو لا يريدون أن يقفوا جنبا إلى جنب والعدو الاسرائيلي من خلال فتاواهم المناهضة للمقاومة الاسلامية في لبنان.<br />هذا الأمر دفع حتى بعض رموز السلفية المحلية لاطلاق تصريحات صادمة لكبرائهم وأتباعهم على حد سواء، بالقول «ان الوهابيين المتشددين فقدوا صلتهم بنبض الشارع.. وأنهم لا يفكرون في العالم الاسلامي بل يفكرون فقط في عالمهم الوهابي.» وفقا للشيخ عبد العزيز القاسم، وأن رموز هذا التيار «يعيشون خارج كوكب الأرض» كما يقول محسن العواجي.<br />أما عربيا فورد عن اخوان مصر أن «هناك بعض الجهات (السلفية) التي تحاول إحياء الانقسامات الطائفية القديمة» تبعا للمراقب العام للإخوان المسلمين في مصر محمد مهدي عاكف، إلى جانب ما ورد عن اخوان الأردن «من المؤسف أن تصدر من بعض المنسوبين على العلم الشرعي فتاوى تخدم أهداف العدو الأميركي واليهودي» إبراهيم زيد الكيلاني رئيس لجنة علماء الشريعة الإسلامية في حزب جبهة العمل الإسلامي في الأردن، وما إلى ذلك من تعليقات مشابهة..<br />ولهذا يمكن القول بكل ثقة أن التيار السلفي المحلي بامتداداته الخارجية لم يكن معزولا تماما أكثر مما هو عليه اليوم، ونحن نمضي الأسبوع الرابع من العدوان الاسرائيلي على لبنان، ليس لأن أتباع هذا التيار يعيشون عالمهم الوهابي فقط كما يقول القاسم، ولا لأنهم يعيشون خارج الكوكب كما قال العواجي، بل لأن أوهاما كثيرة صرفت عليها المليارات وسال فيها حبر كثير في سبيل ترسيخها في أذهان الناس، فإذا بها تتهاوى الواحدة تلو الأخرى.<br />أحد هذه الأوهام الكبرى التي انهارت منذ زمن لكنها غرقت من جديد في وحل «أمطار الصيف» هي ما استماتت السلفية في ترسيخه بأذهان العامة ودهماء الناس بل وتأثر بها بعض علّية القوم، من أن الطائفة الشيعية ليست سوى فئة متآمرة على الأمة دائما، كما ينظر لها الشيخ بن جبرين في فتواه التكفيرية الأخيرة، وليتبعه رفيق دربه الشيخ ناصر العمر الذي لم يجد من عيب في حزب الله إلا أنه «لا يقاتل من أجل السنة في فلسطين» حسب تصريحه للجزيرة، ولعمري لعل الشيخ توهم ربما بأن حزب الله يقاتل من أجل الهنود الحمر في أمريكا! أو أن الجهاد لا يكون جهادا إلا عندما يكون في خدمة أبناء السنة دون غيرهم من المسلمين! والسؤال من هم المتآمرون على الأمة، هل هم الذين يضحون بفلذات أكبادهم في قتال عدو الأمة الأول وهي اسرائيل، أم هم أؤلئك المرجفون المثبطون المكفرون لهؤلاء المجاهدين؟ أترك الإجابة لضمائركم.<br />اللافت في الأمر أن فتاوى الشيخين ضد الشيعة والتي مرت بـ «سلام» على مدى سنوات، أبت هذه المرة إلا أن ترتد عليهما بصدمة عنيفة لتصيبهما في الصميم، فهما في الوقت الذي أرادا أن يعزلا «المخدوعين» من أبناء الأمة عن «حزب الله الرافضي» على حد قوليهما، إلا أنهما وضعا الطائفة الشيعية في الحقيقة ومن حيث لم يحتسبا أمام استفتاء عالمي، تاريخي، شارك فيه أغلب الرموز الاسلامية في العالم، حول اسلامية الشيعة والتشيع، ونجح فيه الشيعة بامتياز وإن كانوا في غير حاجة اليه، ولعل كثرا منا سمعوا تصريح بعض الرموز النقابية في مصر بالقول «إذا كانت المقاومة في لبنان تعني التشيّع فنحن أول المتشيّعين» ونحن ندرك مدى التأثير الصاعق و«الاستراتيجي» لمثل هذه التصريحات -الاعلامية- على العقول التكفيرية.<br />أكثر من ذلك، وضع الشيخان نفسيهما في وضع لا يحسدان عليه، من حيث الاتهامات ذات العيار الثقيل التي بدأت تنهال عليهما، كونهما وقفا إلى جانب العدوان الصهيوني، وفق ما يرى معارضوهما، ومنحا العدو -شاءا أم أبيا- شرعية مجانية لم تكن تنقصه أصلا بعد المظلة الدولية والغطاء السياسي العربي!<br />فمع طعن الشيخ بن جبرين والعمر في المقاومة الشيعية في هذا الظرف الحرج الذي تتعرض فيه الامة لهجمة صهيونية شرسة يقف الشيعة وحيدون في مواجهتها، خلق ذلك هوة واسعة بينهما وبين عامة أبناء الأمة، ما دفع لأن تنهال عليهما الاستنكارت من كل حدب وصوب ليس من العامة فحسب، بل من أجلاء علماء الدين السنة والمؤسسات والحركات والاتحادات الاسلامية السنية عبر العالم، مقرة ليس فقط باسلامية المقاومة، بل لترفض التشكيك في اسلام أبناء الشيعة وهم الموحدون من أمة لا إله الا الله، وليفتح الشيخان بذلك على نفسيهما سيلا من التسفيه والتقريع ما لا قبل لهما به، وليصدق عليهما -في الحد الأدنى- أنهما من أبرز الرموز «التي تحاول إحياء الانقسامات الطائفية القديمة» وفقا لمهدي عاكف.<br />فمما لا يمكن تفهمه بالمطلق، اطلاق الشيخين الجبرين والعمر لهذا الجدل المذهبي البيزنطي في هذا الوقت بالذات، حتى أنه لم ينقص فتاواهما ضد الشيعة وحزب الله سوى أن يطالبا أتباعهما بالدعاء للجيش الاسرائيلي في قنوت الصلوات بالتوفيق والنجاح في مهمته، وأن يشدوا على أيدي جنرالات اسرائيل في المضي قدما لتصفية الشعب اللبناني والمقاومة الإسلامية. وقد فعلت ذلك ضمنا.<br />ولعلي هنا أشير لحقيقة تكاد تكون غائبة عن البعض وهي هذا أن التيار السلفي برموزه ومنتسبيه وامتداداته، لا يمثل أكثر من نسبة مئوية ضئيلة ولا تكاد تذكر بالمقارنة مع أبناء الأمة، فليس هناك أي وجه مقارنة بين 16 مليون مواطن سعوديا -بافتراض جدلي أنهم جميعا سلفيون- مع مليار ونصف المليار مسلم في العالم بعلماءهم ومذاهبهم وتياراتهم وقومياتهم ولغاتهم المختلفة، إلا ان الحقيقة الأكثر مرارة هي أن هذا التيار قد أختطف الاسلام وأمسك بتلابيب أبناء المذاهب الاسلامية المختلفة تبديعا وتفسيقا و«تشريكا» وتكفيرا، بفضل البترودولار السياسي، والهيمنة الروحية المستقاة من الحرمين الشريفين! وهذا ما يحتاج لمقالة أخرى.<br />الآن ربما يصح القول أن هذا التيار عاد -مؤقتا على الأقل- إلى حجمه «الطبيعي» الخارج عن السياق العام لتوجه أبناء الأمة، وضمن هذا السياق يمكن فهم محاولة ما يدعون برموز الصحوة في السعودية لتدارك ما يمكن تداركه ولمعالجة «شبهة» تأييد التيار السلفي لإسرائيل التي وجدوا أنفسهم وقعوا فيها بفضل الفتاوى المذكورة، ليطلق الشيخ سلمان العودة والشيخ عائض القرني والدكتور محسن العواجي بيانات التأييد الموارب للمقاومة الاسلامية في لبنان.<br />ونحن في الوقت الذي لا نجرد مواقفهم من الإيجابية عموما، إلا ملامسة قليلة للتفاصيل تكشف بسهولة مقدار المواربة لديهم، فهم في الحقيقة في وضع المكره فيصدق على الواحد منهم القول «مكره أخاك لا بطل»، فهم رأوا أنهم لابد وأن يركبوا قطار المقاومة حتى وإن كانت شيعية! وحتى لو كان ركوبهم بتذاكر مغشوشة، فقط حتى لا يدهسهم هذا القطار الذي قفز إليه أغلب عقلاء الأمة من اندونيسيا إلى المغرب، وأقرأوا بيان الدكتور العواجي لتتلمسوا بوضوح مقدار «المواربة» المقصودة، فهو لم يدع ثلمة في أبناء الشيعة إلا سطرها في بيانه، ثم أخيرا وبشق الأنفس أتبع كلامه بـ «لكن»، ليقول ما قال.<br />وأخيرا تشاء الاقدار وينقلب السحر على الساحر، وتعود الفتاوى على أصحابها بنتائج كارثية على صعيد السمعة والتأثيرات السلبية، بعد أن دفع الشيعة ثمن ذلك دمعا ودما ليستردوا بعضا من كرامة هذه الأمة، وليمرغوا أنف العدو للمرة الثانية بعد العام 2000، وأن يثبت أبناء هذه الطائفة للعالم أن في هذه الأمة رجال صدقوا ما عاهدوا الله عليه، وليكنسوا بذلك عار الهزائم العربية على يد الجيش الاسرائيلي على مدى أكثر من خمسين عاما.<br />من هنا نتساءل، ألم يأن للسادة الشيوخ أن يرفعوا سيف التكفير عن رقاب هذه الأمة؟ ألم تكفكم يا مشائخنا فتاواكم التكفيرية السالفة عبر عقود من الزمن؟ أما آن لكم وقد ابيضت لحاكم أن تتقوا الله في هذه الأمة وقد سالت بفضل فتاواكم دماء الشيعة والسنة أنهارا في أكثر من بلد اسلامي؟ ألا يحق لنا هنا ان نقول لك «بسّك» فتاوى تكفيرية يا شيخ؟ واسمحوا لي هذه المرة فلن أسأل هنا أين الجهات المسئولة عن فوضى الفتاوى الاستئصالية التي تنخر هذا البلد، فالضرب في الميت حرام!<br />حسين العلق"
