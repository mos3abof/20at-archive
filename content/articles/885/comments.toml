text = "الحمد لله الذ ي هدانا للاسلام والصلاة والسلام على اشرف خلق الله نبينا محمد صلى الله عليه وسلم '''''''''''' وبعد ..... يا اخ محمد علي حسن جاوبني وبصراحة وبعقلانية بعيدا عن السب والشتم انت سردت لي اسمك وبلدك ومكان ولادتك ووووو وفي النهايه قلت ان الله هداك للحق افهم من كلامك انك كنت سني وبعد ذلك تشيعت اي حق عند الشيعة قل لي اهي حلفهم بالحسن وبجاهه وهذ ا شرك لان الحلف عبادة لاتصرف الا لله ام تكفيرهم للصحابة الذين شهد لهم الرسول صلى الله عليه وسلم بالجنة كا ابي بكر وعمر والبقية رضي الله عنهم هل لديهم دليل واضح من القران ام مقولتهم ان الوحي اخطا ونزل على محمد بدل علي رضي الله عنه وبذلك يقولون عند الاذ ان اشهد ان لا اله الا الله اشهد ان علي رسول الله ام سجودهم للحجر المكتوب عليه الحسين اهو الحسين ربهم ام;;;; الله ;;;;;الذي خلقنا وله كل من في الارض يسجد وحده لاشريك له ومن هو موسى الكاظم حتى يقولون عليه السلام اهو نبي مرسل ونحن لانعرف وباي دليل واية من القران ذكره الله حتى يزورو قبره وما يخلو من الاعمال الشركية من عبادة له وتقرب له وهل هو ينفعهم اويضرهم او حتى ذكره النبي صلى الله عليه وسلم في حديث عنه ........... ام الرجبيون ومايفعلونه من تعظيم لرجب وتخصيصه بالصيام وكا ن الله لايوجد الا في رجب اين بقية الاشهر لما ذا لايصومونها علي اي دليل استندوا والصيام ليس فيه شيئ انما الخطا في بدعتهم بتخصيص رجب .......... حتى ايضا نجدهم حول الكعبة يطوفون ما ذ ا يقولون اهم يستغفرون الله اهم يستنجدون باالخالق لا لا لا وكلا فهم يستنجدون بالحسين وبفاطمة اي اشركو بالله والمشرك خااااااااااا لد مخلد في الناااااااااااااار وتعال الى صلاتهم فهم اي الشيعة معروفون بنقرهم للصلاة فاانا اعرف الشيعي من صلاته فلا يكادون يتمون ركوعها وسجودها ينقرونها كنقر الغراب والرسول صلى الله عليه وسلم قال اتعرفون شر السارقين قالو الذ ي يسرق المال قال لا الذي يسرق من صلاته قالو كيف يسرق من صلاته يارسول الله قال لايتم ركوعها وسجودها '''''''' ينقرها كنقر الغراب وهو حال الشيعة والصلاة بطمانينة واكمال اركانها حتى تحصل الراحة وتوادي العبادة ............... واخيرا نحن كسنه نحب الشيعة كمسلمين ونحب علي والحسن والحسين وجميع الصحابة ومن شهد لهم الرسول بالجنة ولاننقص فضلهم ومع ذلك لانرفعهم فوق قدرهم وتصل لعبادتهم والحلف بجاههم ......... اللهم ارنا الحق حقا وارزقنا اتباعه والباطل باطلا وارزقنا اجتنابه واهدي ظال المسلمين امييييييييييين وصلى الله على محمد وعلى اله وصحبه اجمعين"
