subject = "مشكلة الامة"
author = "مشكلة الامة في السعبين سنة الاخيرة شئ واحد اسمه ال سعود."
posted = "2006-06-26"
text = "فإذا اردت أيها المسلم العزيز صلاح أمة محمد -صلى الله عليه وسلم - فما عليك الا السعي الحثيث الجاد ؛ لاجتثاث شجرة الخبث والنجس والكفر ، شجرة ال سعود"
archived = "2006-11-02"
