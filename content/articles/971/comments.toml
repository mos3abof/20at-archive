[[comments]]
order = 0
subject = "للالمروت كل الحق أن يصنع في غزة ما يشاء"
author = "حق للامروت ومن قبله شارون أن يصنع في غزة والضفة ما يشاء ، ولم لا ؟ والامة تحكمها الطواغيت ، الم تروا الى نايف بن عبدالعزبز -عدوالله ورسوله و والمؤمنين ، كم قتل من خيار الامة ورجالها الاشاوس ، الم تروا الى عدو الله ورسوله ملك الاردن كيف تعاون مع الصلبيين الغزاة في قتل أسد من اسود الاسلام وهو ابي مصعب -رحمه ربي وتقبله شهيدا، الم تروا الى حسني مبارك كم قتل من نفس مؤمنة وعذب من أخرى ، الم تروا الى الاسد وجوقته المجرمة كما قتل من المؤمنين وحبس من الصالحبين ."
posted = "2006-06-25"
text = "عربد ياالمروت , وافعل في غزة ما تشاء ، فرجال الامة يقتلها طواغيتها ، وباقي الامة هيام نيام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125740/http://www.20at.com/article2.php?sid=993"

