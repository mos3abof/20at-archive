subject = "حماس لم تستنكر"
author = "حماس لم تستنكر العملية يا اشرف بل ايدتها"
posted = "2006-04-21"
text = "واكيد لن الانسان ممكن يمارس سياسية بدون قذارة<br />اذا التزم بمنهج الرسول في السياسة فقد كان رسول الله سياسيا محنكا من الدرجة الاولى<br />اقرا تاريخه لكي تعرف يا اشرف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152839/http://www.20at.com/article2.php?sid=708"

