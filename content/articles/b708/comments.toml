posted = "2006-04-22"
text = "ياجدعان نقول أبومازن ده عميل الناس مش مصدقه ، ياجدعان أنا خايف ليكون زي الراجل القزر بتاعنا ويفضل علي نفسكم حتي يكون الرئيس الراحل ، أقترح ان يتم إغتياله ونستريحه من الأشكال الحقيره إلي زيه ، وأنا مستعد لعمليه إغتياله بس دخلوني فلسطين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152839/http://www.20at.com/article2.php?sid=708"

