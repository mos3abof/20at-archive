[[comments]]
order = 1
subject = "الرئيس"
author = "وعد"
posted = "2006-04-19"
text = "السلام عليكم ورحمة الله وبركاته<br />اولا العلمية مباركة<br />ثانيا الشاب الذي قام بها هو اسد ورجل من ظهر رجل وامه حره<br />ثالثا الله يلهم اهله الصبر والسلوان<br />رابعا عيب عليك يا ايو مازن يا اللي بتقول عن حالك رئيس ان تصف العملية بالحقيرة، فأنت بذلك الوصفغ لم تتيح للجواسيي امثالك وصفااخر أكبر واعظم، عيب عليك ياذاك الرئيس المنافق أن تكون هكذا وتصرح بمثل هذا الكلام.<br />كل ما اقوله لك هو أنك أجبن انسان رايته في حياتي، واطلب منك طلبا أن تعلن للعالم أجمع انك جاسوس رسمي لاسرائيل، وان تقولها بالقلم العريض بانك انت الذي كنت وراء مقتل ابو عمار، وانت من احضر السم، وانت وراء طرد محمد رشيد خارج الضفة وغزة ايضا كي لا يفضحك. وانت ايضا من اسكت زوجة الرئيس عرفات بملايين الدولارات حتى تكتم ما اخبرها به الاطباء الفرنسيون منذ اول لحظة، ولماذا لم يغادر ابو عمار لدولة غير فرنسا للعلاج، مع أن دول الخليج العربي فيها أحدث الاجهزة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152839/http://www.20at.com/article2.php?sid=708"

