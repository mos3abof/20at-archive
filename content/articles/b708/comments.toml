subject = "لا ياشيخ"
author = "اروى"
posted = "2006-04-18"
text = "حقير لا يا شيخ والنبى حد يزغزغنى علشان اضحك_لا اله الا الله _والله نرفزنى هو حقير وانت ايه عسل قشطة منجة فراولة روح ياخويا زور شارون شوفوا عامل ايه كان بيقول نفسى اشوف مزونة حبيبى قبل ما اموت"
archived = "2006-11-02"
