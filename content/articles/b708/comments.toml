[[comments]]
order = 4
subject = "شوية واقعية"
author = "أبو مازن مضطر إنه يقول كده رغم تاريخه النضالي (إفتكروا فتح الثورة و منظمة التحرير لأن المقاومة موجودة قبل حماس ب30 سنة) حتي ال يعزل الشعب الفلسطيني عن باقي العالم و الواقع المؤلم يقول أن بدون مساعدات الدول المانحة لا يمكن أن يعيش الفلسطينين."
posted = "2006-04-19"
text = "حماس بتزايد علي الجميع والبارحة كانت تتهم فتح بالخيانة لانها تتعامل مع الإحتلال و اليوم هي في السلطة وتعمل نفس الدور القذر الذي لابد أن يقوم به أحد من أجل الشعب.<br />كفاية مزايدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152839/http://www.20at.com/article2.php?sid=708"

[[comments]]
order = 5
subject = "حتى انت يا بروتس"
author = "نيفين"
posted = "2006-04-20"
text = "فين شكسبير يا جماعه علشان يعدلها و بقول حتى انت يا ابو مازن<br />بصثو يا جماعه احنا مش عايزين نجرى ورا اللى مش ملمين بالموضوع و نقعد نشتم<br />ابو مازن اكيد ليه وجهه نظر انا مش فهماها بس اكيد كان لازم يختار لفظ اخف من حقير دى لانها كلمه تنرفز فعلا<br />بيفكرنى بالمرشد لما قال طز<br />اللى فاهم وجهه نظر ابو مازن يفهمهالى لو سمحتم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152839/http://www.20at.com/article2.php?sid=708"

[[comments]]
order = 6
subject = "بالعقل كدة!"
author = "المواطن مصري"
posted = "2006-04-20"
text = "ماهم الفلسطينيين بيتقتلوا وهم نايمين أو وهم راكبين عربياتهم أو ماشيين في الشارع أو قاعدين في فصول المدارس .. فالولد قال أموت واخد معايا حد بدل ما أروح فطييييييس<br />أعتقد ان هذا الشاب بطل ، على الأقل أكثر بطولة من اسمه ايه ده الكتكوت اللي هرب من الخدمة العسكرية عشان يخدم الفن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152839/http://www.20at.com/article2.php?sid=708"

[[comments]]
order = 7
subject = "الواقع يقول"
author = "اشرف"
posted = "2006-04-21"
text = "بالامس كانت حماس تعلن مسئوليتها عن اى عمليه ضد اسرائيل حتى ولولم تعملها تقول بمشاكتها اليوم الوضع اختلف حماس تستنكر برافو اتمنى فى الانتخابات القادمه ان تصل سرايا القدس للسلطه علشان الناس تقرأ المواقف صح هو أنه ما فيش سياسه بدون قذاره واللى عايز يفضل نظيف يبعد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152839/http://www.20at.com/article2.php?sid=708"

