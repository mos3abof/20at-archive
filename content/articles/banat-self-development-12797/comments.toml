order = 8
subject = ""
author = "AYA20s"
posted = "2010-01-03"
text = "انا عندى مشكله وحابه آخود رأيكوا فيها انا مخطوبه من شاب قريبى من بعيد . اتقدملى ووافقت عليه واقتنت نفسي ان الحب هيجي فى الخطوبه لاكن ظهرلى العكس<br />الانسان ده آه بيحبنى لاكن نا مش قادره احبوا لا مستويا الاجتماعى زيي ولا التعليمي انا كتر مينوا هو دبلوم صنايع وانا كليه تجاره قتقدمي وانا فى اولا كليه وافقت عليه لان اهلى موقتنعين بيه وبيحبواه وشيفين انوا مناسب ليا . لاكن الى اكتشفتوا بعد الخطوبه ان مافيش انسجام مابيني ومابينه وان كلاموا معايا فى اتجاه واحد وبس وهو الحب والجواز ولما بحاول اكلموا عن اهتماماتوا بقولى انا ماعنديش اهتمامات ولا مواهب ولا عمروا سألنى انا بحب اعمل ايه فى وقت فراغى ولما بحاول افتح معاه اي موضوع خارجي قلاقيه مش معايا ولا عاوز يسمعلى انا خايفه بجد اتجوزوا انا شايفه انوا مش مناسب ليا خالص لاكن اهلى موصيرين عليه وكتر اصرارهم عليه بيخلونى اكرهواا واهلى فامعتقدين ان مش هيجيلي حد تانى وان دى نهايتى ولازم ارضى بالواقع حتى لو ماكونتش بحبوا انا فكرت اكتر من مره انى اقتلوا .<br />تنصحونى بأيه وايه الى ققدر اعملوا ارجوا الرد"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106031218/http://20at.com/banat/self-development/12797-2009-07-30-09-41-15.html"

