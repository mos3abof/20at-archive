[[comments]]
order = 6
subject = "حرية إيجابية"
author = "نجم الحرية"
posted = "2006-04-26"
text = "لقد سمعت عن مسرحة \" حكي نسوان \" للكاتبة المبدعة لينا خوري ومدى الإقبال الكبير عليها وهذا دليل أن الشمس لا يمكن أن يحجبها غربال ومواضيع المسرحية مرغبة وتحتاج لمعالجة وحديث وتحتاج لجرأة في الطرح ، وقد أسعدين ان الكاتبة اقتبست عن كاتبة أرميكية حيث يوجد حرية التعبير و الانفتاح والحرية الجنسية الملتزمة الموجودة لدى الكتاب بعيداً عن الغباحية املبتذلة ، فالكاتبة تناولت مواضيع جنسية فسارع البعض للاستنكار والصراخ هذا sex متناسين ما تتضمنه هذه المسرحية من عرض لواحات من واقع الحياة بهدف تسليط الضوء عليها ومعالجتها ، ثم نحن في عصر الحرية واصبحت ممكن الوصول إلى معلومة عن الجنس والثديين والحلمات والمهبل وغي ذلك من ولادة وسحاق واغتصاب عبر شبكة الانترنيت يوجد كثير من هذه املواضيع وللإنسان حرية ان يختار ويتابع أو لا فهذه حرية شخصية ، أتمنى التوفيق للكاتبة والمخرجة لينا خوري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154229/http://www.20at.com/article2.php?sid=726"

[[comments]]
order = 7
subject = "إلى نجم الحرية"
author = "عربية"
posted = "2006-04-27"
text = "أولا عندك أخطاء كثيرة في استخدام لوحة المفاتيح تتعب القارئ . ثانيا يبدو انك كثيرا ماتدخل على مواضيع اباحية في النت وتشجع غيرك على الحرية أقصد المعصية .فالمسرحية مبتذلة من أولها لآخرها وأفضل تعرض في أمريكا فقط ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154229/http://www.20at.com/article2.php?sid=726"

[[comments]]
order = 8
subject = "قلة ادب"
author = "اسمر"
posted = "2006-06-18"
text = "احب اعقب عن المسرحية الجنسية اللي تم استعراضها من قبل اربعة او خمسة فتيات لبنانيات.احب ان الحاجات الجنسية هده تعرف بالسليقة مش منتظرين انو حد يجي و ينشرها على العلن عشان الواحد يتعلمها<br />ممكن هناك في لبنان عندهم حرية زيادة عناللزوم انو ممكن الواحد بتفرج عليها مع ابوه او معاه امه و ممكن تكون والدة احد الفنانات العظيمات قاعدة وبتتفرج و بتصفق لبنتهاعلى العبقرية المسرحية اللي قاعدة بتقدمهاخشبة المسرح<br />و زي ماقريت انو الكاتبة استوحت المسرحية من مسرحية شاهدتها في امريكا . بس احب انو انوه انو ليس كل مايعرض في بلاد الغرب يكمن ان يستهلك هنا في الشرق<br />احنا الشعوب العربية تحكمها عادات وتقاليد خاصة<br />ادا كان في بعض البيوت بتستحي من كلمات الحب اللي بتسمع بالاغاني .فمابالك بمناقشة هيك موضوع و علىالعلن<br />بصراحة الموضوع عندي قلة ادب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154229/http://www.20at.com/article2.php?sid=726"
