posted = "2006-04-24"
text = "انا بعشق المسرح<br />اكيد المسرح المحترم مش مسرحيات الفطاع الخاص<br />و بحترمه اكتر من السينما<br />و برد على مسلمه ان انتى فاكره السينما اخف لا بالعكس المسرح اكثر احتراما من السينما بكتير<br />ة بعدين يا جماعه مش يمكن يكةن العرض كويس<br />ليه التسرع ف الحكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154229/http://www.20at.com/article2.php?sid=726"

