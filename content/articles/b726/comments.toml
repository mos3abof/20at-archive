order = 0
subject = "لا حياء"
author = "مسلمه"
posted = "2006-04-23"
text = "اولا الصوره لايقه جدا على الموضوع<br />ثانيا مش عارفه ايه اللى بيحصل ده<br />طب لو كان فى السينيما اهه فيلم اتصور مره واحده وخلاص<br />لكن مين الممثلات \"البجحات\" اللى ممكن يعملو عرض بهذا المضمون كل يوم<br />الحقيقه ناس ولا عندها خشى ولا ادب<br />صحيح\"اذا لم تستح فافعل ما شئت\"<br />اللهم البسنا حله الحياء<br />اللهم توفنا وانت راض عنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154229/http://www.20at.com/article2.php?sid=726"

