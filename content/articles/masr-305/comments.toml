order = 0
subject = "عندهم حق"
author = "بكر"
posted = "2006-05-14"
text = "أتفق مع الاخوان في ذلك .. فسقطات المرشد العام كثيرة وبعضها \" يودي في داهية \" واتذكر له ان قال \" ان حركة كفايه لسانها طويل \" وان مبارك حامي الديمقراطية والتصريح الاخير نشرته جريده الشرق الاوسط من قبل"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124534/http://masr.20at.com:80/article.php?sid=305&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "فوبيا الاخوان"
author = "hossam saif alnser"
posted = "2006-05-14"
text = "لا ادرى ماذا يريد البعض بالضبط من الاخوان!!!البعض يتصيد لهم اى شارده او وارده ليبنى عليهاموضوع وانشقاق وصراع ..وكل هذا الوهم هو فى عقلية من يتربص بالاخوان وليس له فى الواقع اى سند ..وانا لست منضما للاخوان وليس لى اى علاقة تنظيميه بهم ولكنى ارى الامور بموضوعية بقدر الامكان ..اتصور ان البعض قد اغاظه وآلمه كثيرا ان ينجح الاخوان برغم التزوير والعداء الكامل من كل الفصائل..فمنهم من يقول ان هناك تنسيق مع الحكم ..!!!!!والبعض قال ان لهم تمويل من جهات اجنبيه !!!!!!لمصلحة من هذا الذى يحدث ؟؟؟ازعم ان هذا يصب فى مصلحة الحكم الفاسد فقط ..ارجو ان يلتزم هذا البعض بالموضوعية والحقيقه وان يبعد عن التاويلات والاشاعات الفارغه التى لا تسمن ولا تغنى من جوع"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124534/http://masr.20at.com:80/article.php?sid=305&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "عيب"
author = "ابو اياد"
posted = "2006-05-15"
text = "ياجماعة عيب عليكم هذا الرجل صاحب تاريخ كبير فى حب مصر وله تاريخ كببير فى الاخوان وليس من سلوك الاخوان ان اختلفه مع مرشدهم ان يتكلمه معه بهذه اللهجة المستفزة او الغير المهذبة قد نعترض على مرشدنا او نختلف معه ولكن فى حدود الادب مع رجل افنى عمره فى خدمة هذه الدعوة وان قال المرشد طظ فى مصر فمليون طظ فى البلد التى نسجن فيها مليون طظ فى البلد التى نعذب فيها مليون طظ فى البلد التى يهتك فيها اعراض الحرائر من كفاية والصحفيات وغيرهن مليون طظ فى بلد نام شعبها ولم يستقظوا وبلدهم تباع و تباع وتباع يااستاذنا يا فضلية المرشد سير على بركة الله ونحن وراك جنود مطيعن مبصرين طاعة ممبصرة تبنى وتشارك وتعترض ولكن فى ظل الاخوة والاحترام"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124534/http://masr.20at.com:80/article.php?sid=305&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "كل دي طظات"
author = "سبحان الله"
posted = "2006-05-15"
text = "أظن من حقي بعد الكام طظ الآخاري دوول أول ييجي 70-80 مليون طظ في اللي بيقول طظ في البلد وكمان 170-180 مليون طظ في الاخوان المسلمين واللي عملوه في البلد"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124534/http://masr.20at.com:80/article.php?sid=305&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "الحق حق ربنا"
author = "نيفين"
posted = "2006-05-15"
text = "انا اولا مليش اى علاقه بالخوان و مليش ف الموضوع ناقه و لا جمل<br />بس كلمه حق<br />الاخوان عندهم حق<br />المرشد فعلا بيلبخ و خبط كتير الفتره اللى فاتت و بدل ما كان بيكحلها كان بينيلها<br />يا ريت الاخوان يستعينو بكوادر شبابيه افضل و انا قلت دا قبل كدا<br />و لو مش ممكن يبقى فعلا يعينو متحدث باسمه"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124534/http://masr.20at.com:80/article.php?sid=305&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

