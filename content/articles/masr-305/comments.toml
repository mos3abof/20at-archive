subject = "طظ فيكو كلكوا"
author = "واحد زهق من المتاجرة بالكلام"
posted = "2006-06-30"
text = "ياجماعة هو انتوا لسة مفهمتوش زيف الاخوان دول ناس فاكرين المرشد بينزل الوحي عليه الهي تنزل عليه مصيبة تاخده الاخوان مقدموش حاجة لمصر وعمرهم أساسا ما كانوا بيجيبوا سيرة مصر الا اليومين دول لما الوطنية بقت موضة ووصلت لانه يقول طظ في مصر طظ فيك يا عاكف يامنافق يا مدعي الوطنية طظ فيك وفي كل الخوان واللي بيأيدوهم لان الاخوان مجموعة ناس زبالة وحقيرة طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ ظطظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ طظ في عاكف وفي الاخوان"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124534/http://masr.20at.com:80/article.php?sid=305&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

