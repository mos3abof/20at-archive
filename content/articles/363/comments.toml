[[comments]]
order = 6
subject = "أعتقدى أن"
text = "مسألة الإيقاع أو الموسيقى خلافية ..قد لا يروقني الرأي القائل بـ جوازها ..و لكني مقتنعة أنها طريقة مناسبة ..لـ الوصول لمن أعرض عن كثير من الخير ..كلنا على ثغرات ..و ديننا يحتاج منا البذل ..بدلاً من محاولة إثباط الهمم !في حالة المنشد سامي تتشعب الأمور كثيراً ..نظراً لـ البيئة و المجتمع القادم منهما ..تماماً كما يوسف إسلام ..أكرر أنه بـ رغم ما في الإنشودة من تعارض و نظرتي لـ النشيد الإسلامي ..إلا أن الفرح طغى على مشاعري حينها ..لـ الخطوة السباقة في عرضها على قنوات غنائية ..أصداء هكذا جرأة في التخطيط ..سـ تصلنا تباعاً ..لـ ندرك حينها كم كنا مخطئين بـ فهمنا أن هذا النوع من الأناشيد ..موجه لـ سامعي النشيد أساساً !بعيداً عن غياهب الخلاف الفقهي في هذه المسألة ..و سرد الأدلة الشرعية ..و أقوال العلماء ..هل لنا أن نتناقش في إيجابيات و سلبيات الأناشيد الإيقاعية .. ؟- نشيد المعلم مثالاً -الأثر الذي تتركه هذه النوعية على مجتمعاتنا بـ كافة أصعدتها .. على إختلاف توجهاتها الدينية .. مشاربها الفكرية و فئاتها العمرية ؟ما أتمنى سماعه هنا ..هو آثار - إن سلباً أو إيجاباً - نستشفها نحن ..كـ شباب في مجتمعات إسلامية ..و كـ أفراد في دين عظيم ..نطمح لـ إنتشار الصورة الأكثر مثالية ومطابقة لـ الواقع عنه ..في مجتمعات أخرى ..صورة الإسلام الوحيدة فيه ترسم بـ أيدي وسائل إعلام تهاجمه ليلاً نهاراً !تظهره و نحن معه بـ مظهر الإرهابيين المتخلفين !هو نقاش حضاري يليق بنا ..و ليس فرضاً لـ الآراء ..أو محاولة لـ إقناع إجباري !لا بأس بـ توسيع نظرتنا لـ الأمور قليلاً ..لـ تشمل بعداً آخر ..قد لا نتعايش معه فعلياً ..ولكننا في صدامات أزلية معه ..أتشوق فعلاً لـ قراءتكم قريباً ..كونوا بـ خير حتى ذلك اللحين"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018180252/http://www.20at.com:80/article.php?sid=654"

