text = "إنقاذا لسمعة عشرينات ,, وردا على الذين يزعمون أن عشرينات قدمت موضوع عن سامى يوسف لارتباطه بالإعلان لسامى يوسف وأن سامى يوسف دفع له مقابل هذا .. نرد عليهم ونقول أن صاحب الإعلان لسامى يوسف بالموقع هو شركة النور للإنتاج الإعلامى وهى التى دفعت مقابل هذا الإعلان للترويج لمنتجاتها وليس سامى يوسف هو من دفع....م/رامى إيمان (نائب مدير التسويق)"
