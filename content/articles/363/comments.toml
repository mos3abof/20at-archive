order = 101
subject = "إلى متى هذه المهزلة بالدين ..!"
text = "نداء أخوي لجميع الأخوة المنشدين أمثال سامي يوسف وكل من سار على نهجه ..<br />أين عقولنا وأين ديننا الذي تعلمنا مبادئه ..<br />ندعي الله ونبتهل إليه بما حرمه ..<br />ويدعون حب الله و رسولنا المصطفى عليه أفضل الصلاة والتسليم وهم يخالفون نهجه.<br />فهذا يطلب منه المغفره بالموسيقى وآخر يتأمل في آياته بالإيقاع !!<br />وكلاهما محرمات ومعاصي ولا جدل في ذلك فأحاديث المصطفى واضحة في ذلك ولا يجوز لنا إلا استخدام الدف وليس في كل ماهب ودب بل في الأفراح والمناسبات السعيده ...<br />ولكن للأسف بدأ المنشدون يتساهلون في هذا الأمر رويداً رويداً حتى أصبح إسم النشيد غناء إسلامي ومتى كان النشيد يتساوى بالأغنيه الماجنه !<br />أما علم هؤلاء المنشدون أنهم سيحملون ذنب كل من سمع ذلك الشريط الموسيقي ..<br />ومن سن سنةً حسنة فله أجرها وأجر من عمل بها إلى يوم القيامة ومن سن سنة سيئة فله وزرها ووزر من عمل بها إلى يوم القيامة ... \" فيما معنى الحديث \"<br />نسأل الله الكريم في هذا الشهر الفضيل ـ شهر رمضان المبارك ـ أن يرزقهم وإيانا التوبة الصادقة وأن يعودوا إلى رشدهم ..<br />THOoOoOG@hotmail.com"
archived = "2004-12-10"
capture_url = "https://web.archive.org/web/20041210084214/http://www.20at.com:80/article.php?sid=654"

