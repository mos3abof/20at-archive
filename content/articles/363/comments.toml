subject = "من عمرو خالد إلى سامى يوسف يا قلبى لا تحزن"
text = "تحياتى لكل من شارك فى الحوار واقول: اعتقد ان الشخصية المسلمة الآن مصابة بانفصام حاد ، بمعنى ان القواعد تخضع للهوى وليس العكس، المفروض ان يكون هوانا تبعاً لما جاء به الشرع وليس تطويع الشريعة لما نهواه ونحبه ، من ناحية اخرى احكامنا على الامور اصبحت مشوشة ومشوهة الى حد بعيد ، واصبحنا لا نفرق بين ما يجب علينا فعله وما يجب علينا مقاطعته، سامى يوسف شاب على خلق وفنه محترم ، لكنه جاء فى عصر اصبح للدعوة ومنبر الاسلام اولاد كثيرون غير شرعيين، يعنى لقطاء ، المهم فى الموضوع يا جماعة اننا نشوف المنهج بكل صدق ، المرجعية الدينية هى الفسصل الوحيد وهى العلاج الناجح للقضاء على انفصام شخصيتنا المسلمة"
archived = "2004-12-10"
capture_url = "https://web.archive.org/web/20041210084214/http://www.20at.com:80/article.php?sid=654"

