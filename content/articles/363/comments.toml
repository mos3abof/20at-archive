subject = "أختك فى الله"
text = "بسم الله الرحمن الرحيم<br />الشريط بكل ما يحمل من معان وكلمات رائع لأقصى درجة يتصورها كل حامل لشهادة أن لا إله إلا الله وأن محمدًا رسول الله .<br />ولكن رجاء قبول هذا الاقتراح وإن كان لا ينقص من قدر الأغانى شيئًا ألا وهو نزول شريط كامل باللغة العربية وذلك لأننى أريد أن يسمع هذه الأغانى كل مثقف وكل أمى لا يعرف ترجمة اللغة الإنجليزية وخاصة أن الأغنية الواحدة فى الشريط تكون باللغة العربية والإنجليزية مع اختلاف المعنى ، مع علمى أنك لا تجيد العربية ولكن أنا على ثقة أن قراءة القرآن الكريم ستجعلك تقبل هذا الاقتراح مع تنفيذه يا ابن الإسلام ."
archived = "2004-12-10"
capture_url = "https://web.archive.org/web/20041210084214/http://www.20at.com:80/article.php?sid=654"

