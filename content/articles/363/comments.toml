[[comments]]
order = 21
subject = "مسلمة تحب دينها جدا"
text = "السلام عليكم ورحمة الله وبركاتةكل عام وانتم بخير بمناسبة شهر رمضان الكريمبصراحة كليب سامي يوسف هايل ورائع بكل المقايس في الكلمات والاخراج والتلحين والصوت رائع وعذب وجميل واللة انا اول مرة شفت هذا الكليب بكيت من شدة التأثروبكلماتة الرقيقة واحساسة الصادق الذي صحي حب النبي في قلوبنا وكلنا بندعو لة بالخير وان ربنا يكرمة ويثبتة وهذة شهادة حق يجب ان اقولهاانا قرأت كل التعليقات بخصوص هذا الموضوع ومع احترامي لكل التعليقات فانا لي بعض الملاحظات اولا بالنسبة لمن يعترض علي الكليب لوجود الحان او موسيقي بها انا سمعت من فقهاء لهم وزنهم ان الموسيقي الهادئة الراقية التي لا تثير الغرائز ليس فيها شئ وجائزة وبعدين يا جماعة يكفي انة كل ما يذكر النبي علية الصلاة والسلام نكسب ثواب الصلاة علية وكفاية برضة في وسط الكليبات التي تثير القرف والاعياء ظهر كليب راقي وهادف لمنشد مسلم انجليزي !ثانيا بالنسبة لمن يعتقد ان مدح الموقع للكلب والمنشد اعلان مدفوع الاجر لو هذا حقيقي يبقي بصراحة حلال عليهم وربنا يباركلهم علي الاقل انهم ما يعلنو عن شئ هادف يبني مش بيهد مش احسن ما يعلنو عن المطربة فلانة والمطرب علانثالثا بالنسبة لمن يعتقد انة لن يستحمل ان يقعد في مصر او سيطرد من مصراول حاجة ادخولو موقع سامي يوسف بيقول اية عن مصر يا جماعة انا بالرغم من يوجد اوضاع صعبة مشعاجبة كثيرون وانا منهم بس انا احب البلد دي قوي وبزعل لمن يتكلم عنها كدة وبعدين حتكون اكتر من امريكا بلد الحرية والديمقراطي الشاب الذي اسلم فطردوة من عملة وبلدة ونزل ذلك هنا علي الموقع ودة مش اول واحدياريت مايكنش حد زعل مني هذة مجرد اراء شخصيةوالسلام ختام"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018180252/http://www.20at.com:80/article.php?sid=654"

