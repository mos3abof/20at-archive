[[comments]]
order = 180
subject = "كلااام صحيح بس مافيش ناس بتفهم"
author = "نااا من المعجبات بسامي يوسف وبما يقدمه"
text = "لكن اظن انه من الغلط انه الناس قامت تسميه مغني!!<br />وانو بيغني لله !!<br />تسمياات غريبه اشوفها بالتعليقاات.. طيب ما الاغاني حرام؟<br />قولوا عنه منشد<br />وهناك فرق بين المنشد والمغني<br />واذا على الحفلاااات والمصخرره اللي بتقولوا عنه<br />فصحيح مايصحش اللي صااار<br />وعلى ساامي يووسف ان يشترط منع الاختلاط<br />الواحد مايعرفش يقول ايه<br />مدام التصرفات كلها واحده سواء كانت من جمهور سامي يوسف ولا عمرو دياب<br />ولكني مازلت اقوول الدنيا بخير وفي ناس واعيه بتتعاامل مع اناشيد سامي يوسف بنيه صادقه ومن غير اي سلوكيات موزينه!<br />واستغرب دعوة البعض من حذف المقال..ليش الحذف؟الواحد عم يقول رأيه بصراحه وله الحريه في ذلك<br />واني من المعجبات بأداء سامي يوسف واتمنى له افضل بما يرضي الله سبحانه وتعالى ..وان يبتعد عن السلوكيات اللتي قد تكون محل جدال له!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154245/http://www.20at.com/article.php?sid=654"

