subject = "ميساء _فلسطين المحتلة"
text = "بسم الله الرحمن الرحيم<br />أولاًًً: نشكركم على حسن وروعة هذا الموقع وعلى الموضوع الذي طرح فيه بخصوص أغنية الشاب سامي يوسف<br />بصراحة انا بكتب شعر رائع ولما حاولت كتابة شعر بوصف أنشودة المعلم عجزت فقد عجز اللسان والقلم من روعة أدائه لهذه الأنشودة<br />فقد ادااها بشكل وبقلب يفيض هداية وادب<br />وأتمنى من الله ان يهدي جميع الفنانين والفنانات بدلأمن تلك الأغاني الخليعة ان ينشدوا للاسلام ويحثوا هذا الجيل جيل الانترنت على التمسك بعادات وتقاليد العرب الصيلة وأن يسيروا على منهاج الدين الإسلامي<br />وأمنى من هالمنطلق ان تكون بداية طيبة للعودة غلى الله من هذا الموقع المتميز<br />والسلام عليكم ورحمة الله وبركاته<br />مع تحيات :<br />ميساء من فلسطين"
archived = "2004-12-10"
capture_url = "https://web.archive.org/web/20041210084214/http://www.20at.com:80/article.php?sid=654"

