subject = "شكر واضافة"
text = "اولاً انا اشكر الاخت نهى على هذا الموضوع وتحليلها وانا اقول ان كان هذا الكلام صح فهذة خسارة جدا واخوانا في مصر يعني مبالغين شوية لانو الفساد منتشر<br />فمن وين يعني حيتعلمو اذا كانت الاغاني والقصص كثيرة<br />وفاحشة وتثير الغرائز والافلام والمراقص فمن وين حيجي الخير وهذا ما تريدة امريكا وهذة حربها والغزو الثقافي وهذا اكبر غلط واتمنى انلا يكون هذا الكلام<br />غير صحيح لانو بالفعل يثير المشاعر ويزعل جدا وانا<br />الصراحة اخذ نضرة على السياسة المصرية وفي الاخير<br />صلو وسلمو على من امرتم بالصلاة والسلام علية وشكرا<br />جزيلا لكل من نشر هذا الخبر ولكل المساهمين في انجاح هذا الموقع وارجو انلا يتكرر مثل هذا الامر اخوكم:ايمن<br />حسن مهيوب من اليمن تعز اول ثانوي وارجو نشرة"
archived = "2004-12-10"
capture_url = "https://web.archive.org/web/20041210084214/http://www.20at.com:80/article.php?sid=654"

