[[comments]]
order = 10
subject = "سارة اختكم فى الله"
text = "السلام عليكم و رحمة الله و بركاته<br />بصراحة يا جماعة انا بحى الاخت ياسمين جدا على الموضوع الجميل ده و اناعن نفسى روحت الحفلة بتاعت سامى يوسف و كانت اكثر من رائعة اروع من حفلات كاظم الساهر , لان كمية الايمانيات فيها كانت عالية جدا و تجاوب الجمهور مع سامى كان عالى جدا و على فكرة كان فى هناك كمية فتيات غير ملتزمين بالزى الاسلامى كتير , و هوه ده اللى احنا عايزينه ان عدد الملتزمات يزيد و متهيألى ان كتير من البنات ديه ممكن يلتزم , و هأقولكم موقف كمان حصل هناك اقشعر له جسدى و التهمت له يدى التصفيق التهاما و علت له حنجرتى و حناجر كل من كان هناك بالتكبير الا وهو اسلام شخص بريطانى يناهز من العمر 85 و اعلن اسلامه فى خلال الحفل بعد الاستراحة فياله من مشهد<br />و السلام عليكم و رحمة الله و بركاته"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018180252/http://www.20at.com:80/article.php?sid=654"

