subject = "يا الله عليكم ما اسعدكم والله يزيدكم بس كمان احنا"
text = "انا كنت مبسوطة كتيير بكل اللي بيصير لحد ما سمعت كلمة حفرت بقلبي جرح كبييير واحد مصري مع احترامي لكل المصريين قال عن الفلسطينيين مع العلم انه انا فلسطينية قال عنهم باعوا ارضهم !!!!<br />كيف بعنا ارضنا واحنا بندفع كل يوم من ارواحنا ومن دمنا ومن حياتنا وسعادتنا ما تتصوروا كم الفلسطينين متواضعين احنا بنعتبر سامي يوسف عمل انجاز اكتر منا احنا على الرغم انه احنا كمان بندافع عن الاسلام وبنذوق من الالم والحسرة اكواب كل لحظة احنا ما بنعرف للسعادة طعم زي باقي شعوب العالم انا مثلا اذا ما عملت شي ولا يمكن حد في اطفال الدنيا يعمله ما بحس حالي انسانة صالحة ارجوكم جاوبوني انتوا كلكم هيك نظرتكم للفلسطينين لانه لو هيك كانت نظرتكم اذا ضاعت ارضنا وعمرها ما بترجع على ايدينا اذا انتم يا اخواننا تخليتم عنا في عز حاجتنا لكم اغيثونا!!!!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018180252/http://www.20at.com:80/article.php?sid=654"

