[[comments]]
order = 3
subject = "Life Journey"
text = "حقيقة يااخوان لوأخذنا المنشد سامي يوسف كمثال<br />نجد انه مثال معقدحيث انه اذربيجاني الاصل ..بريطاني الجنسية أبوه من أشهر الملحنين العالميين<br />أحب سامي الموسيقى منذ نعومة اظفاره وتمرس على كثير من الالات درس في المعهد الملكي البريطاني للموسيقى ...والذي يعتبر من اعرق المعاهد الموسيقية في العالم ودرس فيه التلحين<br />ومع ذلك استطاع هذا الشاب من ان يخدم دينه من خلال عمله لشريط المعلم وكذلك لهذا الفيديو كليب<br />من ناحية الايجابيات<br />بداية اول ايجابية ساحقة...هي مزاحمة الكليبات الغنائية في مواقعها<br />ياجماعة سأمنا مزاحمة الشر لنا في كل مكان مافتحنا تلفزيون او راديو الا وسمعنا ورأينا المنكرات<br />أفلا نزاحمهم قليلا...<br />لاحظوا الضجة اللي صارت عندما نزل مثل هالكليب...تخيلوا لونزلت كليبات تضاهي جودته وأفضل؟؟؟<br />أكيد راح يكون هناك تأثير كبير جدا"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018180252/http://www.20at.com:80/article.php?sid=654"

