[[comments]]
order = 1
subject = "لا"
text = "مع احترامي للجميع وآرائهم .. ولكن للأسف ان مثل هذا الفيديو كليب ينسب للنشيد الاسلامي .. هل لأنه خال من النساء والعري والرقص .. يكفي الايقاعات والموسيقى المصاحبة<br />يا أخوان والله المسألة خطيرة وهي الخروج بالنشيد الاسلامي لما وضع له من شحذ للهمم والنفوس في كل مجال خيّر .. بالتدرج في إدخال بعض الإيقاعات وغيرها ..<br />أخواني انصحكم وانصح نفسي بالابتعاد عن مثل هذه الأغاني .. وإن كانت كلماتها ذات معنى جميل .. ولكن هي تدرج لما هو أخطر منها .. في البداية دخلت الألحان والأصوات المايعة .. والآن الإيقاعات والفيديوكليبات .. وغداً ربما يكون هنالك دويتو نشيد إسلامي .. والله المستعان .."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018180252/http://www.20at.com:80/article.php?sid=654"

