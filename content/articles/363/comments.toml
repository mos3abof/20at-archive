text = "أما محمد من مصر:<br />\"منذ أن سمعت صوت سامي يوسف الرخيم وكلماته العذبة التي خفق قلبي معها أحببته، صوت في غاية الجزالة والفخامة، به من القوة واللين ما يكفي لأن يضع حبه في قلب كل من يسمعه\".<br />أختى كاتبة الموضوع ياسمين<br />هذه الكلمات مأخوذة من موقع رمش العين كما كتبها رأيه في سامي يوسف ...<br />اختى فلننتبه أثناء الكتابة الا نأخذ كلمات من مكان ما و نضعها على لسان مصدر ... حتى لا يكون كذب صحفي<br />دمتي بخير"
