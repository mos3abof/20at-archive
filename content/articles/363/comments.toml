[[comments]]
order = 18
subject = "غزلان من الإسلام وإليه في الإمارات"
text = "ليش يا أخواننا المصصريين؟النشيد مش حرام ولا عيب أنتو بتفضلو أغاني خليعة زي روبي وأمثالها ولا أناشيد تقربكم لله سبحانه وتعالى،اتقو الله ولا تسبون الرجال(سامي يوسف) والله اليوم الساحة الفنيه صارت مثل زجاجة البيبسي لما تتخض وتطلع منها الغازات،أماالساحة الإيمانيه اللي موجودين فيها ينعدون على الأصابع واتمنى لكم كل خير ورمضان كريم للجميع.وفكرو بالكلام اللي كتبته وأحييكم بتحية من الشعب الإماراتي الحبيب.غــــــــزلان"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018180252/http://www.20at.com:80/article.php?sid=654"

[[comments]]
order = 19
subject = "أمريكي أصبح مسلما بعد الاحداث"
text = "أنا أمريكي من أصل أمريكي كنت مسيحيا قبل أحداث سبتمبر،كنت أسمع عن الاسلام كثيرا وكنت مدركا أنه الدين الصحيح الذي سار عليه انبياء الله والمرسلين (عليهم السلام)وبعد تفكر طويل كنت ذاهبا لأعلن عن أسلامي في يوم 10سبتمبرقبل الاحداث بيوم ورأيت الشي الذي سيدخلني إلى باب التقوى وكان مشغولا وقال لي سوف أراك غدا أي في يوم الأحداث وقدر الله وماشاء فعل،فمنعت من زيارة مسلمي أمريكا وكنت قبل ذلك قد كلمت صديقي عن الاسلام وكان يضحك علي مستهزءا ولكنه مات في التفجيرات في البنتاجون وبعد أن علمو أهلي بما حصل لصديقي أعلنو أنهم سيدخلون الاسلام معي بعدما كانوا رافضين الفكره تماما.<br />وها أنا الان طردت وأهلي من أمريكاولجأنا إلى دولة الامارات العربيه المتحدة وحصلت على عمل ولله الحمد وسأتزوج من قتاة مواطنة(إماراتيه) إن شاء الله تعالى.<br />أشكركم يا أيها العرب لما تقدموه لنا نحن الغرب عن الاسلام ومعانيه الطيبه وأرسل لكم تحيات أهلي وأحب أن أبارك عليكم الشهر الفضيل الذي سأصومهللمرة الثانيه في حياتي ورمضان كريم للجميع."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018180252/http://www.20at.com:80/article.php?sid=654"

