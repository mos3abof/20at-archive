[[comments]]
order = 36
subject = "سامى يوسف واشياء اخرى"
text = "السلام عليكم و رحمة الله<br />اسمحوا لى ان أسال لماذا نحارب انفسنا..و هذا السؤال لمن يهاجم سامى يوسف لماذا نقول انه حرام او ادائه سئ او توزيعه ليس على المستوى المطلوب؟؟!!!!... أاداء عمرو دياب فى الاغنية الاخيرة احسن منه... ام اغانى روبى حلال ....لماذا لا ترتفع اصواتنا هكذا لنقول حلال و حرام عندما يقوم سفيه او سفيهة فيخرج علينا بكليب عارى فاضح؟؟...لماذا لاننطق وقتها و نقول بكل وضوح ان هذا حرام حرام بين و سوف نقاطعه ولانسمعه لانه ليس من ديننا او قيمنا فى شئ؟؟!!!<br />احبائى ان الصحابة و التابعين كانوا يخشون من لفظ حرام و حلال لدرجة انهم كانوا يفتون بكلمتى مكروه ومستحب<br />فدعونا نتترك هذا الجدل ونقول فقط..ان سامى يوسف خطوة اولى نحو فن اكثر احتراما....<br />الى حبيبتى الفلسطينية ...ان هذا المصرى الذى قال ما قال هو ببساطة جاهل ...لانه لم يقرأ تاريخ فلسطين الحبيبة قبل ان يردد مثل هذا الكلام.. و احب ان اقول له أقرأ يا أخى تاريخ فلسطين من اوله.. من عهد الانتداب البريطانى لتعرف ان هذا الذى تقوله خطأكبير .. فهذا الكلام نشروه اليهود انفسهم ليستحلوا به الارض و العرض وسوف اسوق لك -ولمن لا يعرف- مثال لماكانوا يفعلوا ..فقد كانت عصابتهم يدخلون قرية فيحطونها من ثلاث جهات و يتركون الرابعة مفتوحة و يدخل جزء منهم القرية فيذبحون ابنائها و يغتصبون نسائها و يتركون من تبقى منها ليفروا عبر الجهة الرابعة ثم يستولون على الارض و الممتلكات ... ابعد هذا نقول انهم باعوا ارضهم..؟؟؟ يا حبيتى الفلسطينية انا مصرية مثله و هو لايعبر الا عن رايه الشخصى فنحن و كل المسلمين قلوبنا و ارواحنا ان استطتعنا معكم...و لكن عندى رجاء عندك و عند كل الفلسطنين لا تقولوا مصرى و فلسطينى وسعودى...-فهذا ايضا مما فعلوه بنا- بل قولوا مسلمين موحدين لا يجمعنا الا الدين فهذا فقط ما يضمن لنا النصر<br />و السلام عليكم و رحمة الله"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018180252/http://www.20at.com:80/article.php?sid=654"

