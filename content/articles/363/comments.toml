text = "انا محمد من القاهرة شكرا جدا على الاغنية الدينية انا نفسى اشوفك فى مصر يا سامى انتا ويوسف اخوك واللة يسمحهم من المغنين المصريين زى روبى ولوسى وهيفاء وهبى واليسا من المناظر الخليعة وانا اول مرة اخش على موقع عشرينات صحبى اشكرة على ان اقلى على موقع عشرينات دة وانا بشكرة ربنا يوفقك يا سامى وانا اول ماسمعت الاغنية (المعلم) جسمى اشعر وحزنت حزن جامد اقوى على الانا عملتة فى الحياة وربنا يسمحنى على انا عملتة لانى بمد فى ظروف صعبة عشان كدة انا عاوز اشوف الامام سامى لاكلم معاة فى حاجات كتير جدا وانا عاوز اعرف ان النور الا كان فوق الجبل دة كان نور الكعبة من هدايا اللة ولا دة اية<br />شكرا<br />يعتبر من اخوك محمد من القاهرة 18 سنة<br />ربنا يوفقك<br />مع السلامة"
