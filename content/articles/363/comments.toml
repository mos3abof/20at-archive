subject = "سامي يوسف وبس"
author = "ولا انا بطلب من ادراة الموقع حذف المقال الي ما الو اي معنى وتاني شي سامي يوسف احسن من غيرو بمليون مرة حتى احسن من شباب عرب مسلمين ما بعرفوا غير الهمالة مع احترامي للجميع"
text = "تالت شي سامي يوسف اكيد رسالتو بالاناشيد هاي اول شي طبعا الدعوة للاسلام اكيد وتاني شي يبعد الشباب والبنات عن الاغاني الي ما الها معنى و التافهة<br />وانا بحكي للاخ الي كتب المقال يروح يحكي عن ناسني وماريا وهيفا وبوسي سمير والشلة الجديدة احسنلو من انو يحكي على سامي يوسف الي مافي متلو ابدا<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154245/http://www.20at.com/article.php?sid=654"

[[comments]]
