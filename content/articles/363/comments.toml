text = "السلام عليكم ورحمت الله تعالى وبركاته،<br />كنت من الناس الذين لم يصدقو رايتهم لاغنية دينية في التلفاز لدرجة انني قلتها لكل من اعرفهم واقول \"اسمع اغنية لسامي يوسف في ميلودي انها رائعة وارددها لهم\"<br />انها حقا اغاني جميلة فيها ذكر الله تعالى وصلاة على رسول الله صلى عليه وسلم<br />اصبحت اسمع هذه الاغاني في الشارع والمحلات التجارية هنا في المغرب واقول انه انجاز عظيم ان نسمع صوتا جميلا وحنوناينشد بذكر الله ورسوله<br />واشكر الله وسامي يوسف وكل من يسانده واتمنى لهم التوفيق و الاستمرارية فنحن حقا محتاجون لمثل هذا"
