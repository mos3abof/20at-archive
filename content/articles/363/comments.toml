text = "يا جماعة هي دي البداية للطريق الصح ولازم نشجع سامي يوسف وغيره مهما كان فيه عيوب وبصوا للمزايا على الأقل مش كله عيوب زي روبي (عري - رقص - موسيقى) ياريت حد يقول ميزة واحدة ؟ مش هيلاقي وسامي يوسف هو البداية وبعد كده كله هيقلد بس ياريت نشوف الأحسن مش تقليد وخلاص يعني الناس اللي هتعمل حاجة زي كده ياريت تتلافى العيوب فمثلا يبقى من غير موسيقى ويستخدم الدف والدف حلال , قالر رسول الله صلى الله عليه وسلم \"أعلنوا هذا الزةاج واضربوا عليه بالدف\" صدق رسول الله صلى الله عليه وسلم."
