subject = "اختي عزك وعفتك وكرمتك وشرفك وفوزك وطاعتك .. في حجا"
text = "السلام عليكم و رحمة الله و بركاته<br />اغلب الي علقوا كانوا شباب و الحمد لله باين انهم واعين بحقيقة الحجاب هو فرض و الاقتناع به واجب مادام ربنا قال اتحجبوا خلاص متبصيش لشكلك في الحجاب ومتحدديش لان الله قال انوا واجب ووجبوا على الفتاة البالغة يعني كل شيء واضح والي حتقول لازم اقتنع متقول مش حصوم لحد مقتنع ايه فيدة الانقطاع عن الاكل يوم كامل عشان نحس بالغلابة الي مش لقيين يكلوا لا دا سبب غير مقنع ابدا اقتنع الاول ثم اصوم احنا بنصلي و بنصوم و مؤمنين بالله و بكتابوا ... لان الله فرض علينا دا نقطة ولا نقاش ربنا لما امر سيدنا ابراهيم انوا يدبح ابنوا هو قعد يناقشوا او... لا فمابالك ان الحجاب عفة و ستر و حجاب عن كل من يريد الاساءة لجنسنا والاستقلال به بخاطب البنات و بقلهم مضللوش انفسكم و متتعدروش بمبررات واهية وانتم يا شباب سيبوا البنات يتحجبوا و بلاش معاكسات وكلام منمق بيغر اخوتكم<br />الحديث طويل لكن السلام عليكم"
archived = "2004-12-10"
capture_url = "https://web.archive.org/web/20041210084214/http://www.20at.com:80/article.php?sid=654"

