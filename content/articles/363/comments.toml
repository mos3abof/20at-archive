subject = "يسرى .هاوية القدس .من المغرب"
author = "لسلام على من اتبع طريق الهدى"
text = "الحمد لله وحده لا شريك لهو له الحمدو الشكر و هو على كل شيء قدير<br />اما بعد<br />انا جد معجبة باغانيك الدينية المحبوبة الدا فئة التي كل من يستمع اليها يحن قلبه و يرق لسماع كلمة الله و النبي محمد تنور لسانك قبل ان تنير اسماعنا .<br />جزاك الله خيرا فصحيح انني لا زلت صغيرة 14سنة و لكن لي الحق في ابداء راء ي الخاص<br />و السلام عليكم و رحمة الله<br />عفوا اي مكنك انشاء نشيد او فيديو يتعلق بالمراهقين ننحن ننتظر منك هدا العرض بفارغ الصبر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154245/http://www.20at.com/article.php?sid=654"

