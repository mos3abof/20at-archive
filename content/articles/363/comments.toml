text = "السلام عليكم ورحمة الله وبركاته,<br />هذا التعليق رداً علي ما ذكره الواحد وأنتقد ما اسماه حجاب عمرو خالد, ليس هناك ما يسمي بحجاب عمرو خالد وحجاب وجدي غنيم , هو حجاب الأسلام ثم أن عمرو خالد ظهر في وقت كان الشباب فيه ضائع تماماً<br />ولو تأملت قليلاً لوجدت أن أساس دعوة أ/ عمرو خالد هو أنارة الطريق وبعد ذلك مهما حدث لن نستطيع السقوط في الغيابات وحتي لو ضللنا الطريق مرة او أكثر فسيوعيدنا طعم الطاعة الذى ذقناه من قبل علي يد الأستاذ عمرو خالد.أسأل الله أن يجزيه عنا خير الجزاء ويبارك له وعليه ويجمعنا وأياه مع الحبيب في الجنةوأسأل الله أن يجعل جميع المسلمين مثل أستاذنا الفاضل عمرو خالد.سبحانك اللهم وبحمدك نشهد ألا إله إلا أنت نستغفرك ونتوب إليك."
