[[comments]]
order = 44
subject = "Message Regarding the Egypt Tour- from sami yusuf"
text = "Message Regarding the Egypt Tour<br />My dear Egyptian brothers and sisters, jazakumullahu khairan for all the kindness and courtesy you have displayed during my stay in Egypt. Wallahi, I felt so blessed and honoured to have been amongst you on the 30th September and 1st October. It was a truly blessed and enlightening experience for me for several reasons; firstly, I felt as though Egypt is my home. I never thought I could feel so comfortable and at-home anywhere in the world as I did in Egypt. Wallahi, the warmth’ and richness of Egyptian people moved me in a way that will remain in my heart and memories forever; secondly, Egyptians (like Azeri’s and the Persians) appreciate art and beauty, hence the name “Ummud Dunya” (“Mother of the World”) is ascribed to it. Finally, I realised that Egyptian people are unique in the sense that their Iman is deeply rooted and instilled firmly in their hearts. May Allah bless the many beautiful countries in our Ummah and may He bring back the glory of our religion and our contribution to human civilisation at large – Amin."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018180252/http://www.20at.com:80/article.php?sid=654"

