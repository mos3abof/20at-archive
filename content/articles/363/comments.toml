text = "بسم الله تعالى:السلام عليكم ورحمة الله وبركاته:امابعد انا حببت كثيرا اغنية المعلم لفنان صاحب الاحساس المرهف والجميل الاستاذ \"سامى يوسف\"عندما شاهدت اغنيته وبصراحةفرحت كثيرا وقلت لحد الا الدنا بخير واحلى شئ اعجبنى فيه لهجته عندما كان يلفظ كلمة \"محمد\"عندما يقول \"مهمد\"اجذبتنى كثيرا وفى النهاية ادعوا من البارئ ان ينور دربه وان يجعله يغنى اغانى احلى واروع من المعلم والله يوفقه واريد ان اشكر سامى يوسف على هذا الانجاز الرائع انا نرجس الكردية من شمال العراق مع السلامة"
