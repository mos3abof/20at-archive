text = "بسم الله الرحمن الرحيم . أود أن أاكد اننا في وضع الامه الاسلاميه الحالي بحاجه الي انسان يبعث بأسمى الأفكار بكلماته الرائعه لتدخل قلب كل شاب وشابه . خاصة بعد انفجار وضغط الأغنيات الهابطه التي تبعد تفكير الشباب عن الصواب وتؤدي بهم الي الفساد . واتمنى ان تبدأ بعد هذه الاغنيات الرائعه لأخ سامي يوسف وبعد ان اخترقت كلماته وصوته الرائع قلبي وقلب العديدات من بنات القدشس الشريف وشبابها حتى اصبحت في كل حي وكل منظقه . نتمنى جميعا ان تبدأ الحرب بعدها على تلك الاغنيات لنتخلص منها . وليجعل الله من امثال سامي يوسف العديد واود ان اشكره كثيرا لمثل هاذا العمل<br />اختكم في الله بنت بيت المقدس"
archived = "2004-12-10"
capture_url = "https://web.archive.org/web/20041210084214/http://www.20at.com:80/article.php?sid=654"

