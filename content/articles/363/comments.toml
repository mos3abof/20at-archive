subject = "موافقة لو له سند من الدين"
text = "ها ها ها حاجة تفطس من الضحك يا جماعة بصراحة مبطلتش ضحك و أنا أقرأ ، وححفظهاعندي بس واضح أن اللي كاتبها واحد مفروس ، و بصراحة من حقة ، ما إحنا موصلناش للفرسة دي إلا من برود- لا مؤاخذة بس ده واقع- إخوانا المدخنين و اللي بنلمسه فعلا من إجاباتهم اللي أوردها المقال، و رغم تحفظي علي شدة الإسلوب لأننا مسلمين و لازم نتبع أساليب التهذيب حتي في الحروب ، إلا إنني لا أستطيع معارضة هذا الأسلوب خفيف الدم ها ها ها ها مين عارف يمكن يكون لنا سند في دينا و نذكر جميعا شدة سيدنا عمر لذلك سأعرضها و أناقشها مع من حولي و لو وجدت لها سندا و الله لأنشرنها ما أستطعت إلي ذلك سبيلا."
archived = "2004-12-10"
capture_url = "https://web.archive.org/web/20041210084214/http://www.20at.com:80/article.php?sid=654"

[[comments]]
order = 126
subject = "ابن فلســـــــــ انا الهيجااء ــــــــــطين"
text = "كان الغريب فيديو كليب أنشودة \"المعلم\" لسامي يوسف الأذربيجاني الأصل.. إنجليزي النشأة.. صاحب الصوت الجميل الذي يتسلل إلى قلبك بمجرد الاستماع إليه.. فلا تعرف هل السر في دفء صوته أم في جمال كلماته؟!.. أم في ترانيماته الملائكية؟!.. وربما جميعا بالإضافة إلى الصورة الجيدة المقدم بها الكليب؟!.<br />في الأيام الأولى لعرض الكليب كنت تستمع إلى مثل هذه الكلمات الجميلة في مدح الحبيب المصطفي، تقع عينك مصادفة على شريط الـ SMS لتجد كلمات الهزار والحب، أما حاليا فبمجرد أن يبدأ الكليب في العرض لتجد الشريط تحول لصلوات وتسليمات على الرسول الكريم..!!<br />وعقب إذاعة الكليب رصد \"عشرينات\" ردود أفعال مشاهديه على ساحات الحوار العربية التي انتشرت بها وصلات الفيديو كليب بكثرة، ونلتقط من تلك الرسائل:<br />زياد- الإمارات – 22 عاماً، الذي قال فيها: \"أيكون قد آن الأوان لتغزو كلمات الحق شاشات الرائي، أيكون قد آن الأوان لفن النشيد الإسلامي الذي ولد الخفاء كشعر المهجر لكنه أسمى وأرقى، حمل هموم الأمة في مرحلة من أعتى المراحل حدا القافلة النورانية في الظلمات هذه كلها كلمات من أثر نشيد الرائع سامي يوسف.<br />أما محمد من مصر:<br />\"منذ أن سمعت صوت سامي يوسف الرخيم وكلماته العذبة التي خفق قلبي معها أحببته، صوت في غاية الجزالة والفخامة، به من القوة واللين ما يكفي لأن يضع حبه في قلب كل من يسمعه\".<br />أما رامز السعودي فيحكي لنا:<br />\"كنت أشوف هالفيديو في مؤسسة إعلامية.. وكان هناك عامل هندي عادي قاعد يشوف الفيديو معانا.. بعد ما خلص الفيديو...قال هذا في مسلم كويس.. شوف كيف نور وجهه؟!<br />شوف كيف تأثر العامل؟! .. مع إن ثلاث أرباع الكلام مو فاهمه!! هذا إضافة ممن أعرفهم وتأثروا بهذه الأنشودة حتى سقطت دموع احدهم عندما شاهد هذا الكليب!!\""
archived = "2004-12-10"
capture_url = "https://web.archive.org/web/20041210084214/http://www.20at.com:80/article.php?sid=654"

