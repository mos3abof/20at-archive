subject = "مساؤه اشطة يابو عمر"
author = "عاشت موزمبيق حرة مستقلة"
posted = "2006-06-25"
text = "ياعم محمد فتحي..مساؤه فل واشطة...احنا سيبنالك الكلاب اللي بجد تتكلم انت عنهم..لو حد منهم هو هو انت قدها وادوووووووووووووووووووود. انما انا عندي فوبيا كلاب يابو عمر!!<br />ومنذ رحل روي عن عالمنا ..لم تبق لنا سوي الشموع السوداء..حتي صالح سليم رحل....ولازالت مسيرة الهوهوة مستمرة.."
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626150930/http://masr.20at.com:80/article.php?sid=561"

[[comments]]
