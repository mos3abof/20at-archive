subject = "روك اند رول...."
author = "هووووووووبه"
posted = "2006-06-25"
text = "الكابتن اللي فوقي والله كانت علي طرف لساني اقول الشموع السوداء , ونسيت ياض الحاجه ماجده الخطيب مافيش مسلسل الا وهي ماسكه كلب لولوه او كلبه حسب ذوقها , بس انا قريت بالنسبه لحكايه الكلاب واهتمام الغرب بيها مقال بعنوان كلب وراح باين وازاي الغرب مهتم بالكلاب اكتر من البنو ادم .<br />بس الحقيقه سبب \"الصرع\" في مصر كلب كبير اسمه\" روك\" قعد 25 سنه يمص في \"عضم\" شعب بيهديه اغنيه انا عندي كلب حسحسوه والكلب يهيديها ل\"رول\"...<br />وريلتم ..."
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626150930/http://masr.20at.com:80/article.php?sid=561"

