[[comments]]
order = 0
subject = "مالكم عنا"
author = "فلسطينى"
posted = "2006-01-12"
text = "واللة ما بقدر اقول غير اننا عم كتير نكرهكن<br />ونكرة كل مصرى<br />وكل ماشابة بالمصريين وبلاادهن<br />وللعلم قتل نحنا الفلسطينين لضباتكن المصريين على الحدود كان فرحة لاالنا<br />وهلاا اغربو عنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114530/http://www.20at.com/article2.php?sid=240"

[[comments]]
order = 1
subject = "اه يا زمن"
author = "مصرى"
posted = "2006-01-12"
text = "انت انسان حقير يا اخ يا فلسطينى بتفرح ان ضباطنا موتوهم اه يا زمن .انا مش عارف عملنالكم ايه يا حثاله ولا هوا حقد ازلى فاكر سيدكة السادات اللى حاول ينضفكوا انتوا والعرب بس اطنطوا عليه يا كلاب دلوقتى بتبوسوا الايادى علشان سبر واحد والعرب يلهسون من اجل رضا الصهاينه ...........اه يا زمن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114530/http://www.20at.com/article2.php?sid=240"

[[comments]]
order = 2
subject = "نعم"
author = "فلسطينىاخر"
posted = "2006-01-13"
text = "انضم لصوت اخى الفلسطينى وانتو ليش عم تصيرو وتمشو الضباط الااسرائيلية واللة هم عم يحموكم منا<br />ونعم نوافق على قتالكم من قبل ضباطنا نعم ونعم ونعم<br />وهلاا المزيد من القتلى منكن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114530/http://www.20at.com/article2.php?sid=240"

[[comments]]
order = 3
subject = "يا للبئس"
author = "من كتبا باسم فلسطين ليسوا فلسطينيين"
posted = "2006-01-14"
text = "ولا حتى لهجتهم لهجة فلسطينيين<br />فالعبوا غيرها<br />اللي بعده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114530/http://www.20at.com/article2.php?sid=240"

[[comments]]
order = 4
subject = "فلسطيني ثالث"
author = "السلام عليكم"
posted = "2006-01-15"
text = "يااخوتي انا شايف انو تعليقاتكم السابقة لا تمت بصلة للموضع الاصلي، وبعدين لا لا يجوز ايا منا ان يتهم الاخر مهما كانت الظروف. الله يسامحكم<br />نحن مسلمون قبل ان نكون عربا وقبل ان نكون مصريين وفلسطينيين.<br />وفقكم الله شباب المسلمون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114530/http://www.20at.com/article2.php?sid=240"
