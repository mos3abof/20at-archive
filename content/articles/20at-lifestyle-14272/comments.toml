text = "انا عندى نفس المشكلة وانا بنت وفعلا اليونيفورم واللبس الكلاسيك بيفرق كتير اوى حتى فى معاملة الناس معايا فى الشغل وحتى فى المحلات بس ,وانا اصغر من كده ولحد دلوقتى تعليقات الناس بتخنقنى فبحاول اغير فكرتهم بانى اتكلم معاهم وابينلهم انى صحيح شكلى صغير بس عقلى كبير والعموم الواح لازم يحب نفسه عشان يعرف يحب الللى حواليه ولكل واحد الموضوع دا مدايقة فكر فى قدام بكرة كلة يعجز وانت بس اللى حتفضل صغير ولا ايه؟؟؟"
