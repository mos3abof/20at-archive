text = "أناحبيت واحد عمره 22 أناعمري 18 وأجا طلبني وهو مو ناقصو حاجةالا انه فرور شوي يعني صغنون<br />المهم بلا طول سيرة أول كلمة قالها بابا موحاسة انو ولد يعني صغير حجم مو عمر لأنو اختي تزوجت واحد عمره 23<br />أنبكيييييييييت كتييييييير لأنه أنا بحبه كتير وبمووووت فيه ومابدي غيره مع كل التعليقات الي سمعتها بسب حجمه<br />بس لو احنا نرتقي شوي بفكرنا بنبطل نفكر بهاي سخافة لأنو مافي حد كامل وبكفي نحرج غيرنا ونجرح الناس<br />ونحرجهم<br />لأنو الانسان مش حكمنا عليه من شكله<br />الحكم عليه من الأخلاق والأحترام والزوء<br />فيا عااااااااااالم تعاو نتغير احناعشان غيرنا يتغير<br />صحيح بس النهاية بابا وافق وتغير مفهمو لهدول الناس ادعولي<br />وشكراااااااا عهلموضوع فشيت ألبي شوي"
