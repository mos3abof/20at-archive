text = "تقبل الوضع زي ما هو لأنك مش هتغير حاجة أو هتبقى حاسس بأحساس مزيف<br />هو فيه أحسن من أن الواحد يبقى شكله صغير<br />بس مش لدرجة \" ماما حبيبتى\" يعني …<br />بس تخيلوا كدة أن واحد عنده 30 سنة وشكله يبقى مدي على 25 سنة مثلاً … حاجة آخر روشنة أكيد .<br />هو بصراحة كمان كل حاجة ليها مميزات وليها عيوب واللى شكله صغير عايز يكبر واللى كبير عايز يصغر وماحدش عاجبه حاجة وعلشان كدة لازم نقتنع تماماً أن ربنا خلقنا وصورنا في أحسن صورة تناسبنا … وأن ده هو الخير لينا<br />و الحمد لله علي كل شيء"
