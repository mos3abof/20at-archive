text = "خمسون فائدة من حديث ( لا تغضب )<br />لبيان ما حوته السنة النبوية المطهرة من المعاني العظيمة والفوائد الغزيرة التي ينبغي على العلماء وطلبة العلم التصدي لها لاستخراج كنوزها وبث فوائدها وبيان أسرارها البديعة الصادرة من المشكاة النبوية على صاحبها أفضل الصلاة وأتم التسليم .فقد ألقى فضيلة الشيخ العلامة المحدث سليمان بن ناصر العلوان كلمة عن حديث من أحاديث الرسول الكريم التي جمعت بين البلاغة والإيجاز وعظيم النفع وكبير الفائدة واستنبط منه أكثر من خمسين فائدة فقال حفظه الله تعالى :-<br />أخرج البخاري والترمذي من طريق أبي حصين عثمان بن عاصم عن أبي صالح ذكوان السمان عن أبي هريرة رضي الله عنه أن رجلاً قال للنبي صلى الله عليه وسلم : أوصني قال : ( لا تغضب فردد مراراً قال : لا تغضب ) وروى هذا الحديث الأعمش عن أبي صالح عن أبي سعيد وفيه نظر والمحفوظ ما رواه أبو حصين ولذلك روى البخاري الحديث من إسناده وأعرض عن إسناد الأعمش لكثرة اختلافه على أبي صالح في هذا الخبر كما رواه الإمام أحمد عن أبي هريرة وغيره .<br />الفوائد<br />1- المقصود من ترك الغضب هو اجتناب أسبابه والأمور المفضية إليه .<br />2- فيه الأمر بالأخذ بالأسباب .<br />3- فيه الرد على الجبرية والقدرية .<br />4- فيه قاعدة سد الذرائع وأن الوقاية خير من العلاج .<br />5- فيه أهمية جمع المفتي بين العلم والعقل فيعطي كل مسألة حقها وكل سائل ما ينفعه .<br />6- التأدب في السؤال وطلب العلم .<br />7- فيه عدم جواز كتم العلم عمن طلبه إلا لمصلحة راجحة .<br />8- فيه أن الغضب يمنع العدل في القول والعمل .<br />9- فيه أن الذي لا يغضب منضبط الأفعال والأقوال حال رضاه وغضبه .<br />10- فيه الحث على حسن الخلق .<br />11- فيه الحث على الرضا بالقضاء والقدر .<br />12- فيه أن عدم الغضب دليل على وفور العقل وكماله .<br />13- فيه معنى قوله تعالى ( وإثمهما أكبر من نفعهما )وتقرير مبدأ المقارنة بين المصالح والمفاسد .<br />14- فيه أن هذا من محاسن الشريعة وكمالها .<br />15- حرص الصحابة على التفقه في الدين .<br />16- فيه معنى قوله صلى الله عليه وسلم اكلفوا من العمل ما تطيقون .<br />17- أن الشر كله في الغضب .<br />18- أن الغضب منه المحمود ومنه المذموم .<br />19- عظم فقه الصحابة حيث لم يفهموا العموم من هذا الخبر بل غضبوا الغضب المحمود وتركوا المذموم على ما علمهم الرسول صلى الله عليه وسلم .<br />20- أن الغضب من الأسباب المفضية إلى الكفر .<br />21- وجوب بذل النصح للمسلمين .<br />22- أهمية النصيحة وأثرها في المجتمعات .<br />23- فيه أن المرء قليل بنفسه كثير بأصحابه فإن المؤمن مرآة أخيه المؤمن فالمرء لا يرى عيوب نفسه غالباً .<br />24- أن العبرة بفائدة الكلام ونفعه لا بكثرته وسجعه .<br />25- جواز مراجعة العالم في المسألة مع الأدب وحسن الخلق .<br />26- أن ترك الغضب والتحكم فيه خلق مكتسب .<br />27- مدافعة السنة الكونية القدرية بالسنة القدرية الشرعية .<br />28- أن الغضب من الشيطان .<br />29- أن القوي هو الذي يملك نفسه عند الغضب .<br />30- فضيلة الصبر والحلم .<br />31- مشروعية النصيحة بلفظ موجز جامع مانع .<br />32- فيه معنى ( أوتيت جوامع الكلم ) .<br />33- إنزال الناس منازلهم في النصيحة .<br />34- فيه أن النهي عن الشيء أمر بضده أي عليك بالحلم والصبر .<br />35- الإخلاص في إسداء النصيحة .<br />36- طلب النصيحة إنما يكون من ذوي العقل والرأي والدين .<br />37- أن لازم القول في الكتاب والسنة متوجه بخلاف كلام الناس فإنهم لا يؤخذون بلازم قولهم .<br />38- فيه أن طلب الوصية والنصيحة رفعة للعبد لا منقصة ولا مذمة فيها .<br />39- أن قبول النصيحة من كمال الإيمان .<br />40- فيه قياس الناس بأخلاقهم لا بهيئاتهم .<br />41- فيه جواز تكرار النصح والوعظ ما لم يبلغ حد السآمة .<br />42- فيه معني قوله ( أحب العمل إلى الله أدومه وإن قل ) .<br />43- أن النهي عن الشيء نهي عن أسبابه ومقدماته من باب أولى .<br />44- أن من ترك لله شيئاً عوضه الله خيراً منه فمن ترك الغضب عوض بالحلم .<br />45- بيان فضل كظم الغيظ .<br />46- الحث على العفو والنصح .<br />47- اتساع صدر العالم للمسائل والمراجعات .<br />48- تواضع النبي وسعة حلمه وحسن خلقه .<br />49- أن الترك يعتبر عملاً .<br />50- أن العمل من مسمى الإيمان .<br />51- أن العبد يؤجر على أفعال التروك .<br />52- أن النبي صلى الله عليه وسلم لا يزيد في حديثه على ثلاث .<br />53- فيه ثبات العالم على أقواله ومبادئه طالما أنه على الحق مهما ألح عليه الناس أو ضغط عليه الواقع .<br />والله أعلم"
archived = "2010-03-07"
