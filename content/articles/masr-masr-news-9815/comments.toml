text = "\\\\في سنن أبي داود عن ابن عباس رضي الله عنهما قال: كان النبي صلى الله عليه وسلم يدعو:<br />رب أعني ولا تعن علي، وانصرني ولا تنصر علي، وامكر لي ولا تمكر علي، واهدني ويسر لي الهدى، وانصرني على من بغى علي، اللهم اجعلني لك شاكرا، لك ذاكرا، لك راهبا، مطواعا إليك مخبتا أو منيبا، رب تقبل توبتي، واغسل حوبتي، وأجب دعوتي، وثبت حجتي، واهد قلبي، وسدد لساني، واسلل سخيمة قلبي.<br />والحديث في سنن الترمذي وابن ماجه أيضا، وقال الشيخ الألباني: صحيح.<br />قال في عون المعبود شرح سنن أبي داود: معنى واغسل حوبتي: أي امح إثمي، والحوب الإثم، ومعنى واسلل سخيمة قلبي: أي غشه وغله وحقده وحسده ونحوها بما ينشأ من الصدر ويسكن في القلب من مساوئ الأخلاق. قاله علي القاري انتهى.<br />والله أعلم."
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307234219/http://www.20at.com:80/masr/masr/news/9815.html"

