text = "لم يخرج علينا صاحب الضربة الجوية كذبا اذ كان فى جالس فى المكتب يشرب عصير وصاحب الضربة الجوية هو الشهيد عاطف السادات- لم يخرج سعادة اللواء طيار او اللواء حفار او حمار ليقول للجماهير المتعطشة انويةخطابة رأى سيادتة فى احكام العبارة - ولا رأى سيادتة فى الغش فى الثانوية العامة ولا رأى سيادتة فى ازمة الغلاء والجوع<br />هو الراجل دة عايش معانا فى البلد<br />هل هو عارف ومتأكد انة رئيس مصر<br />انا خايف ليكون فاكر نفسة لسة نائب للرئيس السادات والسادات لم يعطية تعليمات يعمل اية<br />احنا بلد من غير رئيس<br />رئيس مصر هو الجالس هناك فى لاظوغلى"
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307234219/http://www.20at.com:80/masr/masr/news/9815.html"
