text = "تصور حفل الافتتاح كان فية اكتر من مليون انسان<br />وكان اللى بينظمة شوية بنات ارق من النسيم<br />وما احزننى اننى لم اشاهد ولا عسكرى امن مركزى بسحنتة الغبية والدرع والخيرازانة الذين يملؤون الاستاد كالقمل<br />هل الصين فاشلة امنيا<br />هل حبيب العادلى ابو خيرازانة ودرع هو نجم الاستاد عندنا<br />هل نحن عندنا تخلف عقلى فى القيادات بحيث ان العساكر بيكونوا اكتر من المشجعين<br />لم الاحظ اى واحد بيرتدى هدوم ميرى او عسكرية فى الاستاد فى بكين<br />هل هم احسن مننا<br />والا احنا زبالةالعالم عندنا عساكربتاكل ميزانية التنمية"
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307234219/http://www.20at.com:80/masr/masr/news/9815.html"

