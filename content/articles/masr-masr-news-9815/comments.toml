text = "كيف لا أغضب!<br />سأظل أغضب …<br />اغضب فإن الله لم يخلق شعوباً تستكين<br />اغضب فإن الأرض تـُحنى رأسها للغاضبين<br />اغضب ستلقىَ الأرض بركاناً ويغدو صوتك الدامي نشيد المُتعبين<br />اغضب<br />فالأرض تحزن حين ترتجف النسور<br />ويحتويها الخوف والحزن الدفين<br />الأرض تحزن حين يسترخى الرجال<br />مع النهاية .. عاجزين<br />اغضب<br />فإن العار يسكـُنـُنا<br />ويسرق من عيون الناس .. لون الفرح<br />يقتـُل في جوانحنا الحنين<br />ارفض زمان العهر<br />والمجد المدنس تحت أقدام الطغاة المعتدين<br />اغضب<br />فإنك إن ركعت اليوم<br />سوف تظل تركع بعد آلاف السنين<br />اغضب<br />فإن الناس حولك نائمون<br />وكاذبون<br />ومنتشون بسكرة العجز المهين<br />اغضب<br />إذا صليت .. أو عانقت كعبتك الشريفة .. مثل كُل المؤمنين<br />اغضب<br />فإن الله لا يرضى الهوان لأمةٍ<br />كانت - وربُ الناسِ- خير العالمين<br />فالله لم يخلق شعوباً تستكين<br />اغضب<br />إذا لاحت أمامك<br />صورة الكهان يبتسمون<br />والدنيا خرابٌ والمدى وطنٌ حزين<br />ابصـُق على الشاشات<br />إن لاحت أمامك صورة المُتـنطعين<br />اغضب<br />إذا لملمت وجهك بين أشلاء الشظايا<br />وانتزعت الحلم كي يبقى على وجه الرجال الصامدين<br />اغضب<br />إذا ارتعدت عيونك<br />والدماء السود تجرى في مآقي الجائعين<br />إذا لاحت أمامك أمة مقهورة خرجت من التاريخ<br />باعت كل شئٍ<br />كل أرضٍ<br />كل عِرضٍ<br />كل دين<br />ولا تترُك رُفاتك جيفةً سوداء كفنها عويل مُودعِـين<br />اجعل من الجسد النحيل قذيفة ترتج أركان الضلال<br />ويُـشرق الحق المبين<br />اغضب<br />ولا تُسمع احد<br />فإنك إن تركت الأرض عارية<br />يُـضاجعها المقامر .. والعميل<br />سترى زمان يغتصب الصغار ويـُـفسد الأجيال<br />جيلا ً.. بعد جيل<br />وترى النهاية أمة . مغلوبة . مابين ليل البطش . والقهر الطويل<br />ابصق على وجه الرجال فقد تراخى عزمُهم<br />واستبدلوا عز الشعوب بوصمة العجز الذليل<br />كيف استباح الشرُ أرضك ؟<br />واستباح العُهر عرضك ؟<br />واستباح الذئبُ قبرك ؟<br />واستباحك فى الورى<br />ظلمُ الطـُغاةِ الطامعين ؟؟؟<br />اغضب<br />إذا شاهدت كـُهَّان العروبة كل محتال تـَخـفـَّى في نفق<br />ورأيت عاصمة الرشيد رماد ماضٍ يحترق<br />وتزاحم الكـُهَّان فى الشاشات تجمعهم سيوف من ورق<br />اغضب<br />كـَـكـُـلِّ السَّاخطين<br />اغضب<br />فإن مدائن الموتى تـَضجُّ الآن بالأحياء .. ماتوا<br />عندما سقطت خيول الحـُـلم وانسحقت أمام المعتدين<br />إذا لاحت أمامك صورة الأطفال في بغداد<br />ماتوا جائعين<br />فالأرض لا تنسى صهيل خيولها<br />حتى ولو غابت سنين<br />الأرض تـُـنكر كـُـلَّ فرع عاجز<br />تـُـلقيهِ في صمت تـُـكـفـِّـنـُـ ه الرياح بلا دموعٍ أو أنين<br />الأرض تكره كل قلبٍ جاحدٍ<br />وتحب عـُـشاق الحياة<br />وكل عزمٍ لا يلين<br />فالأرض تركع تحت أقدام الشهيد وتنحني<br />وتـُـقبِّـل الدم الجسور وقد تساقط كالندى<br />وتسابق الضوءان<br />ضوء القبر .. في ضوء الجبين<br />وغداً يكون لنا الخلاص<br />يكون نصر الله بـُشرى المؤمنين<br />اغضب<br />فإن جحافل الشر القديم تـُـطل من خلف السنين<br />اغضب<br />ولا تسمع سماسرة الشعوب وباعة الأوهام .. والمتآمركين<br />اغضب<br />فإن بداية الأشياء .. أولها الغضب<br />ونهاية الأشياء .. آخرها الغضب<br />والأرض أولى بالغضب<br />سافرت في كل العصور<br />وما رأيت .. سوى العجب<br />شاهدت أقدار الشعوب سيوف عارٍ من خشب<br />ورأيت حربا بالكلام .. وبالأغاني .. والخـُطب<br />ورأيت من سرق الشعوب .. ومن تواطأ .. من نهب<br />ورأيت من باع الضمير .. ومن تآمر .. أو هرب"
