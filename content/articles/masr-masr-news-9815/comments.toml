text = "اخيرا اكتشفت لية الناس بتشرب حشيش ومخدرات فى بلدنا<br />علشان ينسوا حياة الهم والقهر اللى عايشينها<br />يلزمك التوتر ابتداءا من مطالعة الصفحة الاولى فى الجريدة ومشاهدة وجوة الحكام العكرة والعميلة والتى انتهت صلاحيتها من سنين طويلة<br />الى اخبار فساد القضاء والتعليم والغش الجماعى وتسريب الامتحانات لابناء المسئولين وكل هذا وكانة يتم فى جمهورية منغوليا ولم نسمع تصريحا واحدا لرئيس الدولة المغيب الذى اجتمع بالمعارضة فى دولة افريقية ويكن كلالاحتقارللمعا رضة فى بلدة حيث لم يجتمع بهم ولا مرة واحدة<br />مش هتغضب ازاى - وواحد محتكر الحديد - وتانى محتكر استيراد القمح وتالت استيراد اللحوم وبيعذبوا فى الشعب المطحون<br />مش هتغضب ازاى لما تسمع كل يوم اخبار ناس بتموت فى المواصلاتوبيغرق وا فى العبارات<br />مش هتغضب ازاى لما كل تطلع الاخبار ان قواتنا موتت كام سودانى وكام افريقى وهم يعبرون الى اسرائيل وكان قواتنا بتحمى حدود اسرائيل<br />مش هتغضب ازاى من شنطة المرور ومثلث الرعب وغرامات المخالفات القاصمة للظهر فى شوارع مفيش فيها اشارات مرور ولا علامات ارشادية تحدد الاتجاة وتقول ان الشارع دة اتجاة واحد وممنوع الدخول<br />بالرشوة تحصل على رخصة قيادة وابنك واخوك يطلع معافاة من الجيش<br />بالرشوة تحصل وظيفة وتدخل الحربية والشرطة بعد ماتدفع المعلوم للكبير<br />اصبحت مش دولة<br />اصبحت طابونة حسنى مبارك واولادة"
