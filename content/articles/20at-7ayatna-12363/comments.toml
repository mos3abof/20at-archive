[[comments]]
order = 0
subject = ""
author = "شملول قوى"
posted = "2009-06-14"
text = "ذهبت الست زوجتى الى بيت امها للزيارة حيث ان امها كانت مريضة - فقلت يا ولد ساعد زوجتك فى ظروفها - وجمعت الغسيل وشغلت الغسالة وعملت كباية شاى وانهيت الغسيل وانا فرحان اننى ساعدت زوجتى<br />وعندما عادت وكنت للتو قد انتهيت من الغسيل لوت بوزها شبرين وقالت بعصبية انت بتعمل شغل مش شغلك لية - واصرت على اعادة الغسيل بنفسها وفعلا اعادت غسلة مرة ثانية<br />ثم انة قالت بصريح العبارة ممنوع تدخلى فى شغل البيت ورغم اننى اجيد الطبخ فانة مصرح لى فقط بدخول المطبخ لعمل الشاى والسلطة وعدم تعدى ذلك تحت اى ظرف من الظروف حتى ولو بتموت ومش قادرة تقوم من السرير<br />حيرتونا معاكم يا ستات نعمل لكم اية<br />ومرة نشرت الغسيل ففضحت الدنيا - وقالت لى ان كل جارتها سالوا عنها وسالوها جوزك بينشر الغسيل لية واتهمتنى باننى عملت لها فضيحة"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 1
subject = ""
author = "اللباس ابو دكة"
posted = "2009-06-14"
text = "ذهب بلديتنا الى لندن للدراسة - وهناك فى لندن غسالات عامة - يضع الشخص فيها ملابسة فتخرج مغسولة وجافة ومعها الفاتورة فيعود بها الى المنزل بدون وجع دماغ<br />ووضع صاحبنا لباسة ابودكة<br />فخرج بعد الغسيل والتجفيف مكتوب فى الفاتورة 50 جنية استرلينى نظير غسيل خيمة بحبالها<br />نكتة قديمة"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 2
subject = ""
author = "ابومحسن غربة 28 سنه"
posted = "2009-06-16"
text = "السيدة فاطمة الزهراء رضي الله عنها طلبت خادمة لتساعدها<br />فرفض النبي محمد صلى الله عليه وسلم واوصاها ان تقول قبل ان تنام<br />سبحان الله 33 مرة<br />الحمد لله 33 مرة<br />الله اكبر 34 مرة<br />ـــــــــــــــ ــــــ<br />ايه رايكم اعزائي ربات البيوت لو تجربوا كلام النبي محمد صلى الله عليه ونسلم<br />ـــــــــــــــ ـــــــــــــــ ـــ<br />والله يا رسول الله لا نقول لك الا كما قال سعد بن عباده<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />والذي نفسي بيده لو أمرتنا أن نخيضها البحار لأخضناها ، ولو أمرتنا أن نضرب أكبادها إلى برك الغماد لفعلنا<br />ـــــــــــــــ ـــــــــــــ<br />وسمع الصحابة كلام رسول الله صلى الله عليه وسلم وفي اقل من 100 عام كانت الدولة من اسبانيا الى الهند<br />ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />فتشوا عن سنن النبي واوامره ونواهيه"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 3
subject = ""
author = "مغاسل عامة"
posted = "2009-06-16"
text = "تنتشر فى الامارات الغسالات العامة - حيث يمكن ان تقومى بتسليم الملابس لصاحب المحل ويقوم العمال باعمال الغسيل والتجفيف والكى وتسليمها فى اكياس بلاستيك وكانها جديدة<br />والمشكلة هى فى الملابس الداخلية<br />وهذا يمكن وضعها فى الغسالات الاتوماتيكية قبل النوم وبعد صلاة الفجر تقومين بنشرها وجمعها من على حبال الغسيل بعد العودة من العمل<br />وما تفتكروش يا بنات ان الجواز حاجة سهلة"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 4
subject = ""
author = "دعاء"
posted = "2009-06-16"
text = "حلوة فكرة الخادمة دي لكن في الحقيقة انا لا استطيع قيادة خادمة يعني بصراحة معرفش اتأمر على الناس واقول لها اعملي ده وسيبي ده اعتقد انها مهارة مش اي حد يقدر عليها كمان انا عندي تجارب سيئة مع الستات اللي بييجوا ينضفوا كل مرة اجيبهم الموضوع يشفلوانضف انا وهي تطنشني وتاخد الفلوس وتمشي والبيت يبقى زي ماهو تقريبا"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 5
subject = ""
author = "مبيعات الغسالات"
posted = "2009-06-16"
text = "بشرى سارة لكل السيدات<br />خلال ال 5 سنوات القادمة سيتم تصنيع غسالات جافة تعمل بدون ماء عن طريق نزع وتبادل الايونات - وجارى اجراء التجارب عليها فى اليابان وسيتم انتاجها تجاريا فى غضون السنوات القليلة القادمة وهترتاحوا من الصابون والنشر وهتبقى العملية سهلة خالص<br />وبالتوفيق<br />يعنى تضعوا هدومكم داخل الغسالة تطلع نظيفة وناشفة"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 6
subject = ""
author = "الى الكاتبة"
posted = "2009-06-16"
text = "فى شريعة الاسلام<br />عندما يكون الزوج مقتدرا ان يوفر لزوجتة خادمة لتساعدها فى شغل البيت وتعينها فى تربية الاطفال<br />كلمى السيد زوجك ان يوفر لك خادمة ولو فلبينية او سيرلانكية حتى تعينك على الحياة<br />وان لم يكن مقتدرا فهذا نصيبك وعليك ان تتحملى<br />والزواج نصيب<br />واحيانا يكون الزوج المقتدر نعمة للفتاة<br />اعانك اللة<br />وقلبى معك<br />سودانية من بور سودان"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

