author = "دعاء"
posted = "2009-06-22"
text = "فعلا أنا فخورة بالسيدة التي حكت عن ابنها الصغير الذي يحتاج منها إلى رعاية خاصة احييكي كل التحية واقبل يدك على هذا العمل الرائع وربنا يقويكي يارب..<br />هدى باشكرك على المشاركة وتوضيح المور لن الناس فاكرة اني باهزر او عندي وقت فراغ فقررت اكتب اي حاجة فعلا فيه مواقف وحاجات عن الغسيل مهمة زي اي حاجة تانية لكن واضح أن مهام المرأة دوما بسيطة ومهمشة واي حد يعملها بصباعه الصغير..<br />ارجو التواصل عبر التعليقات الهادفة والبعد عن التدخل في المور الشخصية يا جماعة، وطبعا كل واحد حر في رأيه تماماً"
archived = "2009-08-16"
capture_url = "https://web.archive.org/web/20090816201447/http://www.20at.com:80/masr/t7kyk/12363-2009-06-14-12-49-10.html"

