author = "منكم لله ياستات!"
posted = "2009-07-12"
text = "منكم لله ياستات رجعتونا لورا الاف السنين فضلتوا تقوموا باعمال الخدم لحد مابقيتوا شبههم في الذل والمسكنة لحد ماخلتوها رسمي والرجل فهم انه حقه من حقوقه الشرعية واول مابتتبهدلوا بيتبص لغيركم ماهو قرف من الشغالة بقى!!!!جهزتوا مع الزوج لحد مابقينا تقريبا الدولة الوحيده في العرب كده واحنا الوحيدين اللي مابتخدوش مهر ولو ادهولكوا يبقي منتظر تكملو عليه وتجهزوا!!!!وممك ن تطلقوا بعدها باسبوع…مش احسنلكم كنت فضلتم في بيوت اهاليكم احسن من الذل وتخلصكم من كرامتكم واهانتكم وترخيصكم لنفسكم؟ماتعرفوش انكم بتسيؤا لكل بنات مصر حتي للبنات اللي مارخصتش نفسها لمجرد انهم مصريات زيكم للاسف ارخص امرأة عربية هي المصرية عفوا اقصد ارخص جوازة هي جوازة المصرية !!!!!!!!!!!!!!!"
archived = "2009-08-16"
