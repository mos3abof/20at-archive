author = "اتجوزوا الخلوق الغني"
posted = "2009-07-11"
text = "اممم اولا ربنا معاكي انا لما جيت اتجوز اشترطت وجود خدامة ولو لاي سبب ماكنتش موجودة(هربت اتطردت)انا ماليش دعوة الا بالطبخ 3ايام في الاسبوع وممكن اتطوع في الباقي يعني يبقي من عندي لان اصلا الشغل ده مش واجب ولا فرض علينا والراجل اللي مش معاه يبقي يشكر مراته يوميا ومايتأمرش ابدا ويتلم علي الاقل لانه بالبلدي قلة ووالله جوزي بيساعدني ساعات لما احن عليه واطبخ ولو جبت بيبيي هيساعدني ياأما يجيبلي بيبي سيتر ويكع بس عاوزة بقي اسأل دار الافتاء فرض عليا كل العناية بالطفل ولا ولو فرض يبقي مافهاش كلام وعلي فكرة فاطمة رضي الله عنها كانت فقيرة وعلي كان فقييير فأزاي يعني الرسول هيقوله يجيبلها شغالة(النبي نفسه كان عنده خادم انس ابن مالك فازاي يرفض الخدم)وبعدين اين علي؟جوزوا البنات اللي زي علي رضي الله عنه ووالله ماهيفكروا في الشغالات!"
archived = "2009-08-16"
