posted = "2009-06-17"
text = "ايه يا دعاء<br />دي اغنية ولا موضوع<br />انا بكره الغسيل<br />انا بكره الغسيل<br />وبحب الطبيخ<br />وبحب الطبيخ"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 9
subject = ""
author = "راى علماء الازهر"
posted = "2009-06-17"
text = "فى فتوى للشيخ على جمعة مفتى الديار المصرية<br />انة يحق للمراة الامتناع عن خدمة زوجها واولادها ولها ان تطالب باجر مقابل ارضاعها لاولادها واكدت الفتوى ان الزوجة لا تتزوج لكى تصبح خادمة وانما جاءت لمؤانسة زوجها وعلية نفقتها وجلب خادمة لها<br />وفى شرح لتلك الفتوى<br />يلتزم الزوج بنفقة الخادم لان نفقة الخادم من مكملات نغفات الزوجية فان امتنع عن ذلك فرض القاضى لها اجا لخادمتها<br />وكان الرسول علية السلام يساعد اهل بيتة وعمر كان يعجن ويرقع ثيابة ويعجن<br />ام ابراهيم من بور سودان"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
