posted = "2009-06-18"
text = "ايه العك الا الاخت كاتبها يعني - خلاص يعني معتش كلام يكتب- مش لاقيه مواضيع أكثر أهمية على فكرة انا متابع مقالاتها وكلها فاضية ولا تحمل مضمون وكل سنة وانت طيبة"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 11
subject = ""
author = "احب واكرة"
posted = "2009-06-18"
text = "الموضوع مش با احب الغسيل واكرة الغسيل<br />الغسيل لازم ينغسل يبقى لازم ينغسل<br />واللى مش عاجبة يروح عند امة<br />هى دى شغل الست المصرية وصميم عملها وكانت بتشيل الغسيل فى طشت وتروح على شط الترعة او شط النيل وتدعكة بالرمل والتراب وتغسلة من غير ما تشتكى<br />دة تبطر على النعمة لما يبقى فية عندك غسالة اتوماتيك وبعدين تشتكى<br />واللى انت بتعتبرى الشكوى رقية وانك يا عينى تعبانة ومظلومة والشغل كتير وهتعملى فيلم هندى<br />هتغسللى يعنى هتغسلى<br />نسوان اخر زمن"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 12
subject = ""
author = "با احب الغسيل"
posted = "2009-06-19"
text = "لنحمد اللة كثيرا ونشكرة على ان اعطانا الصحة لنقوم على اعمال البيت<br />فانا يا ست دعاء ام مصرية لصبى معاق اعاقة ذهنية وبيعملها على نفسة 3 مرات يوميا<br />واغسل الصبى واغسل جسدة 3 مرات - وكذلك يوميا اغسل ملابسة بما فيها من فضلات وروائح بلا تافف ولا عدم رضا فهو ابتلاء من اللة عز وجل وعلينا بالصبر والرضا بما كتبة اللة - وحينما ترين الصبى تجدية نظيفا والحمد للة ورائحتة طيبة - ولم اهمل يوما واحدا الغسيل لانى لو تركتة يوما يمتلىء بالديدان والعفن<br />ومن فضل اللة انة يمنحنى الصحة لكى اخدم ولدى حتى يقضى اللة امرا كان مفعولا<br />فلنتعلم كلمة شكر اللة على ما اعطى<br />الحمد للة رب العالمين"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 13
subject = ""
author = "دعاء"
posted = "2009-06-19"
text = "ممممممممممممممم مممم<br />طبعا من حق الجميع التعبير عن رأيه في المقال لكن أنا مختلفة شوية مع البعض وباطلب منهم إعادة قراءة المقال بهدوء وبدون تحيز ولا حتى تهكم<br />بو قريتوا المقال بتاني شوية هتلاقوني ولا باطلب خدامة ولا عايزة حد يساعدني ولا حتى باتبطر على النعمة دي مجرد شكوى من واحدة عاشت العصر اللي كله مشاغل وضغط واعتقد المقدمة انا قلت فيها ان دي نعمة وان زمان كان الوضع مختلف تماما<br />عجبني قوي تعليق الطشت دي لأني كنت باعمل كده وأنا صغيرة واصر اروح بنفسي وأمي ماتروحش معايا عشان اثبت اني شاطرة يعني<br />وطبعا متفقة مع اللي قال ان في النهاية الغسيل لازم يتغسل يعني لازم يتغسل<br />في النهاية انا بس هاوضح نقطة صغيرة وهي أن دي مساحة رأي يعني من حق أي شخص يكتب فيها عن همومه او مشاغله ومع كامل احترامي للي قال أنه لام فاضي لكنه عنده كلام مهم وشكوى مكررة واللي مش عارف يسأل اي واحدة بتشتغل وعندها طفل ومش بتجيب اي حد يساعدها"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 14
subject = ""
author = "ستات الحرملك"
posted = "2009-06-19"
text = "يظهر ان الكاتبة عايزة تبقى ست من ستات الحرملك وتسمى نفسها دعاء هانم بظابيظو وتحيط نفسها بالدادات والاغوات فى قصر الهانم المطل على القلعة<br />وانا عن نفسى مستعدة اشتغل دادة لدعاء هانم السلحدار بيظابيظوا اذا جلست فى الحرملك دة واغسل لها الغسيل واسرح لها شعرها وهى تقعد على كرسى السلطنة وانا تحت رجليها"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 15
subject = ""
author = "المفروض البراء يساعد"
posted = "2009-06-20"
text = "خلي البراء يساعدك يا دعاء<br />وقوليلوا ان النبي محمد صلى الله عليه وسلم بجلالة قدره كان يساعد نساءه في البيت صلى الله عليه وسلم ما دامت السماوات والارض<br />يا براء ساعدها يا براء هي في الغسيل وانت ترضع مليكه (حفظها الله)<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـت<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 16
subject = ""
author = "هدى"
posted = "2009-06-20"
text = "طيب<br />انا عجبني جدا المقال … وتقريبا مشتركة معاكي يا دعاء في نفس المشكلة<br />انا بشتغل ومتجوزة وعندي غسالة اوتوماتيك وبكره الغسيل وجوز مش قادر يفهم ليه<br />تقريبا عشان كل التفاصيل اللي انتي قولتيها … خصوصا اني في اول شهر بوظت بنطلون ليا كان لونه رمادي بقى بمبي مسخسخ<br />وعشان ما اكررش دا تاني .. بنقع الألوان قبل الغسيل وبضطر في الغالب اغسلها على ايدي<br />موت على نفسي من الضحك على مشهد النشر<br />اقريبا نفس اللي بيحصل معايا<br />بنشر بعدها ب24 ساعة<br />وبنسى الغسيل ع الحبل .. بشوفه من الشارع وانا جاية واقول اول ما هطلع هلمه .. وطبعا انسى<br />والله بجد الغسيل دمه تقيل"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

[[comments]]
order = 17
subject = ""
author = "التوهان"
posted = "2009-06-20"
text = "اشتكت الست زوجتى من حرقان وتشقق فى جلد يدها بعد الغسيل - وكانت تتالم من جلد اصابعها ويدها بعد كل غسيل<br />وبما تتخصصى الفنى يسمح لى بعمل تجارب على مساحيق الغسيل فى مصر فقد اكتشفت بعد تجارب اولية بسيطة ان كل مساحيق الغسيل خارج المواصفات الفنية السليمة وان ما تعانى منة ايدى الست زوجتى هو نتيجة طبيعية لزيادة البوتاس عن النسب المقررة قانونا وعالميا<br />وبما انة كلة عند العرب صابون فى المثل المصرى الشهير<br />هتشتكى لمين<br />هتروح لمين<br />قلت حل فردى لزوجتى فقط - اذ ليس عندى قدرة على المناطحة مع رجال الاعمال منتجى مساحيق الغسيل<br />قلت حل مشكلتك بنفسك<br />اشتريت لزوجتى زوج من الجوانتى الرقيق تلبسهم فى يدها عند الغسيل وتمنع عنها بلاوى مساحيق الغسيل"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620133505/http://www.20at.com:80/masr/7eta-mn-baladi/12363-2009-06-14-12-49-10.html"

