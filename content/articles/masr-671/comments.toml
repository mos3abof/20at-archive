[[comments]]
order = 1
subject = "بحبك قوي يا حلى وانت بالحجاب"
author = "هايدي فؤاد"
posted = "2006-12-23"
text = "بحبك في الله يا حلى متهميش باللي بيقولو انك وحشة بالحجاب والله انت زي القمر المهم اللي انت رضيي ربنا وده اهم حاجة وملكيش دعوة باي حد خالص مفيش حد حينفعك يوم القيامة والله العظيم عملك الصالح وبس وفي قبرك برده فمتهتميش باللي بيقولو كلام ملهوش لزمة والحجاب فرض قال الله تعالى( وليضربن بخمورهن على جيوبهن)وقال (ولا تبرجو برج الجاهلية الأولى)وقال (وليدنين عليهن من جلابيبهن ) الله يبارك فيكي ويرفعك في الدنيا ولااخرة"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042527/http://masr.20at.com:80/article.php?sid=671"

