subject = "مشعل وطهران"
author = "baker_brother"
posted = "2006-10-19"
text = "كلامك طيب اخي الكريم<br />لكن هل تحرير الارض والقدس ياتي بيوم وليلة الا تحتاج لحر اوليس الحرب تحتاج لحلفاء ومن هناك حليف لمشعل غير طهران<br />او بشكل ادق تبادل مصالح<br />وهل طهران جادة في انها ستزيل اسرائيل<br />ولكن هل توقفت حماس الذي يراسها خالد مشعل عن ضرب الكيان الصهيوني بالطبع لا الا ان خالد مشعل جعلها كلمة كما يقول المثل عصفورين بحجر<br />(هذه هي السياسة) اجارك الله منها"
