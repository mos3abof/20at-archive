[[comments]]
order = 0
subject = "هل يوجد أحمدي نجاد عربي؟"
author = "أبو فهد اليافاوي"
posted = "2005-12-15"
text = "تعليق مرقم على المقال :<br />1- كنا نأمل من كاتب المقال وضع إسمه على بداية المقال أو نهايته حتى نتوجه اليه بالرد شخصيا .<br />2- عندما قصفت اسرائيل مفاعل اوزيراك العراقي لم نسمع أى كلمة من أشاوس العرب الحاليين والسابقين وغير كلمات العهر من شجب وإدانة وبكائهم كالنساء .<br />3- إن تصريحات أحمدي نجاد باللسان ( وهو أضعف الإيمان ) صدرت عن إيراني أو فارسي أو أعجمي وهو ما عجز عن قوله باللسان ( مرة اخرى وهو أضعف الإيمان) كل ال 22 خنزيرا من ملوك وامراء و شيوخ و رؤساء ما يدعي بالعالم ...... العربي .<br />4- عندما نشاهد الطريقة التى يتعامل بها شارون و عصابته مع ال 22 خنزيرا عربيا بكل ما بها من عجرفة وتعالي على هذة الحيوانات العربية ( الحكام وليس الشعوب) ... والطريقة التى قام بها نواب هذا السفاح اليهودي بالإدلاء بتصريحاتهم تجاه طهران ( والتى لم تستطيعوا ترجمتها الترجمة الصحيحة ) وهى بالنص \" إن اسرائيل تملك الوسائل الكافية للدفاع عن نفسها أمام طهران \" فإننا نستطيع تبيان البون الشاسع فيما بين الرد على الخنازير العرب والرد على ........ طهران . وهو مثل المثال الكوري الشمالي ... فبعد أن تأكد الكاوبوي الأمريكي من أن كوريا الشمالية أصبحت تملك بالفعل السلاح النووي ... توجه الى الدبلوماسية و خرجوا من ............ محور الشر !!!<br />5- تصريحات السيد أحمدي نجاد المعلنة للمرة الثالثة ... ما هو وجه الخطأ بها ؟ أ- اسرائيل دولة يهودية زرعت داخل الجسم العربي كالشوكة و يجب محوها من خريطة العالم (العربي) - ب - المحرقة هى اسطورة قامت بتكرارها اسرائيل وخلفها كل وسائل الإعلام الغربي ليل نهارا حتى أصبحوا يؤمنون بها ... وعلى فرض صحة هذا القول الإسطوري عن حرق الستة ملايين يهودي على يد النازيين ... فإن عدد من قتلوا و حرقوا فى الحرب العالمية الثانية يزيد عن ال 52 مليون قتيلا.... منهم ما يزيد عن العشرة ملايين ألماني و أكثر من عشرين مليون روسي ... و مع ذلك لا تقام لهم كل هذة الزفة التى تقام لأبناء == شعب الله المختار == من دولة و نصب تذكارية و متاحف و يوم عالمي برعاية العبد أو الزنجي النيويوركي - ت - المطالبة بنقل اسرائيل و شعبها الى ألمانيا و النمسا . هل تتعارض النتيجة مع السبب ؟ الجيش والجستابو الألماني والفهرا هتلر النمساوي الأصل هما السبب فى هذة المحرقة المزعومة ... فلماذا على الفلسطينيين العرب دفع فاتورة هتلر وجيشه؟؟ ولا يدفعون هم ثمن جرائمهم المزعومة؟؟ ولو بشراء ولاية أمريكية بالمال مثلما حدث مع ولاية آلاسكا أو مقاطعة فى كندا أو استراليا وهى دول ترحب بالمهاجرين و تفتح ذراعيها لهم ؟؟ .<br />6- تصريحات أحمدي نجاد لا تعبر فقط عن رأى الحركات الإسلامية ولكن عن رأى كل من يملك ذرة من العقل وليس كتبعية ال 22 خنزيرا عربيا من الحكام.<br />7- مجموعة التساؤلات الطفولية والسطحية والتافهة فى نهاية المقال ... أعتقد أنها ليست بحاجة الى الرد عليها بسبب الغباء الصريح فى تركيبها و صياغتها . و شكرا على قراءة هذا التعليق ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112653/http://www.20at.com/article2.php?sid=95"

