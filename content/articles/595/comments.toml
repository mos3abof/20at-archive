[[comments]]
order = 9
subject = "الفارسي"
author = "بدون اسم"
posted = "2006-05-29"
text = "اذا كان مشعل اعتبر الخميني وزبانيته تاج على جبين الامه العربية والاسلامية<br />ولا يخفى على احد ما يجري في العراق من ذبح للسنه وحرق مساجدهم بما يعرف بفرق الموت المدعومه من ايران والاحتلال الامريكي والقتل على الاسماء خاصة اسم \"عمر\" لحقدهم على الصحابي الجليل والخليفة الثاني الفاروق عمر رضي الله عنه<br />ما هو الا دليل على جهل في اختيار الحلفاء والسير خلفهم وما تشكيل المجلس الاعلى للثورة الاسلامية في فلسطين المحتله بعد زيارة مشعل الفتنه الى ايران الا دليل على خروج عن سنة الرسول الكريم عليه افضل الصلاة والتسليم<br />والكثير الكثير عن مشعل الفتنه يجب على الانسان ان يبحث عن اصول هذا المارق عن الدين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112653/http://www.20at.com/article2.php?sid=95"

