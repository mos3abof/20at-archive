[[comments]]
order = 5
subject = "حسبي الله ونعم الوكيل"
author = "سامي ابو زهري"
posted = "2006-04-22"
text = "يا استاذ خالد مشعل كيفك ان شاء الله تكون بخير<br />انا بحب اقلك حاجه لا تجعل الفتنه تنتشر في فلسطين لان الوضع هناك صعب للغايه والامور متوتره للغايه<br />فانت من هذه التصريحات الخطيره تعمل على اشعال الفتنه في البلد وانت لا تعمل ما يجري في الداخل وانت موجود في الخارج ولا يعنيك ذالك كتير . وكل ما يعنيك هو كسب رضا ايران وان تصبح حليفا الك وانت يا سيد مشعل هذا اخطر تصريح تصرحه على مرئي ومسمع الناس اجمع<br />وانت الان اشعلت الفتيل لتنتشر الفتنه في البلد وانت لا تعلم ما مدي خطورتها هذه الفتنه سوف تذهب البلاد الى ابعد الحدود ولا تفتكر ان القوه معك وانت قادر على عمل اي شيئ فان هناك قوه اخري وباستعدادها ان تفعل ما تشاء وهيه حركه فتح ولاكن هذه الحركه البنائه تفهم ومتعرف جيدا ما يجري ولا تحتاج الى الكتير من اراقه الدماء الفلسطينيه الفلطسينيه<br />وفي اخر التعليق احب ان اقول حسبي الله ونعم الوكيل فيك يا ابن مشعل<br />اخوكم المخلص سامي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112653/http://www.20at.com/article2.php?sid=95"

[[comments]]
order = 6
subject = "يقولون ايران .. ؟؟!!"
author = "يافا"
posted = "2006-04-22"
text = "السؤال الاول : ما هو الدور المشرف الذي لعبته ايران لصالح الاسلام او الامة العربية ونحن كفلسطينيين على امتدداها التاريخي .....؟؟...<br />غير انها حاربت العراق ساعدت سوريا باضعاف وشل عمل ونشاط منظمة التحرير الوطنية الفلسطينية اثناء وجودها في لبنان (1982-1986) _وهذا حديث يطول شرحه ولكن لا بد من طرحه_ وكذلك عملت ايران على الاستيلاء على طنب الصغرى والكبرى .... هذا هو العمل المشرف الذي قدمته ايران الفارسية الشيعية بامتداها التاريخي ....؟؟؟<br />س2: لماذا صدام هو كما يقال دائما _ بوز مدفع_ ؟؟؟ اليس لأنه الاقرب جغرافيا على ايران ويعرف حقيقة الشيعة ولاهداف الفرسية في الوطن العربي ....أليس هو بالحقيقة من منع المتداد الشيعي للجزيرة العربية التي باتت تعج بالفساد بعد انهيار النظام العراقي وغياب القومي العربي صدام حسين عن الساحة العربية؟؟<br />واخيرا رسالة من فلسطيني يعيش الواقع المرير الذي يعيشه جميع فئات الشعب ...<br />هل انت يا حماس قادرة على التعامل معنا بمنطق العقل وواقع العصر ؟؟؟<br />هل الواقع كما هو أم تغيرت الادوار ولا تسطيعي كشف الحقيقة للحفاظ على القاعدة في الشارع الفلسطيني والتي بنيتها على حساب منظمة التحرير وحساب السلطة؟؟؟<br />وما الفرق يا حماس بين 1996 والعام التاريخي 2006 عندنا كشعب فلسطيني محتل منذ الازل ...؟؟؟؟<br />لماذا يا حماس لم تساعدي في يوم من الايام السلطة والمنظمة في عملية البناء قبل دخولكم المجلس التشريعي ...؟؟ بل وقفتم في يوم من الايام في طريق الممثل الشرعي والوحيد للشعب الفلسطيني (منظمة التحرير) .....؟؟؟؟<br />والحقية تقول ان الدور الذي تلعبه في الساحة السياسية ختلف تماما عما في الميدان ...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112653/http://www.20at.com/article2.php?sid=95"

