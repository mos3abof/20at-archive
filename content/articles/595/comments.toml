[[comments]]
order = 2
subject = "ناغويا - اليابان"
author = "عزام التميمي"
posted = "2005-12-31"
text = "كلا خالد مشعل وأحمدي نجاد مخطآن في أمران ومحقان في آخر. هم مخطآن في اعتبارهما المحرقة أسطورة، بل هي حقيقة تاريخية آثارها واضحة للعيان، بل إن من مصلحة الفلسطينيين والعرب والمسلمين أن يقروا بحقيقتها لأنها العامل الأساسي الذي ساهم في تحول اليهود في أوروبا إلى أنصار للمشروع الصهيوني بعد أن كانوا خصوماً له أو على الأقل منقسمين بشأنه. فلولا المحرقة، أي لولا هتلر، لما حقق الصهاينة حلمهم بإقامة وطن لليهود في فلسطين. أما ما هما فيه محقان فهو أن المحرقة استغلت، ولا تزال تستغل، استغلالاً بشعاً من الصهاينة وأنصارهم في الغرب لإضفاء مشروعية أخلاقية على اغتصاب فلسطين وجلب اليهود من أقطار الأرض ليحلوا فيها بدلاً من أهلها. ولو أن الزعيمين الفلسطيني والإيراني اقتصرا على انتقاد الاستغلال الاستعماري للمحرقة، وهي جريمة ارتكبها الأوروبيون بحق اليهود وغيرهم، وباستنكارهم أن يفرض على الفلسطينيين والعرب والمسلمين أن يدفعوا ثمن تلك الجريمة لكان أبلغ وأصوب وأعدل."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112653/http://www.20at.com/article2.php?sid=95"

[[comments]]
order = 3
subject = "بسمك اللهم"
author = "same229"
posted = "2006-02-06"
text = "السلام عليكم<br />اخواني هل تعتقدون ان الزعماء العرب بحاجه لان نتكلم عنهم.<br />اليوم حماس في المقدمه , و الدنمارك تتهكم على رسول الله و الخ...<br />و لكن نحن اين .<br />اقول وبالله التوفيق ارفض كلمة مشعل يغازل هذا الشيخ الجليل يجب ان ياخذ فرصته في اثبات حركته, ولتعلم ايه القائل ان حماس حركه شوريه و لا توجد اراء فرديه.<br />ايران تقول لامريكا لا و حماس ايضا و نشاء الله جميع العرب (الزعامات) قريبا الا تبحث عن من يقف في وجه الارهاب الحقيقي الغرب .<br />لقد حكمة الانظمه العربيه كثيرا لماذا لا نعطي الاسلاميه فرصه لتحكم بكتاب الله و سنة رسوله ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112653/http://www.20at.com/article2.php?sid=95"

