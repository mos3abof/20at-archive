subject = "الثبات .. الثبات ..فالثابت أشد عليهم من النووي"
author = "ياسين أبو محمد"
posted = "2006-04-22"
text = "ثبات رجال حماس هو الرعب الحقيقي الذي أزهل العالم الطالم بزعامة المغرور الحقير بوش لأن رجال حماس شرفاء وليس لأحد عليهم يدا ولا على أحدهم سقطة فهم يخافون الله ومن خاف الله خافه العام ولو أن للأخرين عظة وعبرة ولة أن لهم خير في أنفسهم لنهجوا نهج حماس وتترسوا بشعوبهم في مواجهة الظلم والطغيان الواقع عليهم من بوش وأشباهه فالثبات على الحق خير طريق للنصر وعلى كل مسلم واجب تجاه حماس في حصارها هذا وسيسأل الجميع أمام الله لما تخليت عن أهل الحق وماذا قدمت لهم وهل ما قدمت كان هو الواجب أم قصرة فقدوا لانفسكم فبل أن تسألوا أمام الواحد الديان فالله الله في حماس رمز الفاع عن الحق والمقدسات والاسلام وأمل الاصلاح لوجه الارض ان ىشاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152740/http://www.20at.com/article2.php?sid=658"
