posted = "2006-06-14"
text = "من ياحبها ليس لها ماضي , فقد ولدت يوم احببتها...فإذا كان الحب ضعفاً فهو ضعف القلوب العظيمة...فهي حبيبى وقرة عينى ...فعندماعندما تنام كل العيون ، تظل عيون الحب وحدها ساهرة فحبهاالحب عندي ماء وهواء ودواء وغذاء للروح ...فهو ليس حباً عادياً كما في الأشعار والكتب والقصص ... فهوليس له عنوان ...محمد_تطوان/المغرب."
archived = "2006-11-02"
