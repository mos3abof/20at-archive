[[comments]]
order = 4
subject = "قصدي بقي ...."
author = "هوووووووبه"
posted = "2006-06-08"
text = "وبنحبك يا دنيا بجد ومهما تعملي فينا ..<br />بحب بابا,مامتشي ,اخواتي ,تاتا ,عمووو<br />بحب اغتت علي البشر ..<br />بحب الكمبيوتر واكره المحلول ..<br />بحب كتاب الموقع ..<br />بحب رمضان وعمايل التمر..<br />بحب ريحه المطر واحمد مطر..<br />بحب بكار واللون الاسمره ..<br />وقلولي بتحب مصر قلت \"مش عارف \"<br />بحب \"حبايبنا\"..<br />بحب عمرو دياب ,سيلين ديون , مشاري راشد, ميس شلش, فيروووز..<br />وبحب احلم احلام بضفاير قلب وبس بحلم بجنه وبرج حمام وارض حضنها بتسعني بحلم ولو منعوا الاحلام من حقي احلم واتمني واعيش براح الكون جنه ..<br />بحلم ان العدل يسود عدل عمرو وجنوده اسود والاقصي ينادي يا اسير احكم من تاني<br />بحلم اخلص الكليه علي خير بدون اصابات<br />وبحلم اني اطير وارفرف في الفضا واهرب من الدنيا الفضا ....."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154815/http://www.20at.com/article2.php?sid=913"

[[comments]]
order = 5
subject = "بحر الحياة"
author = "shimoo"
posted = "2006-06-08"
text = "سلام عليكم الاول<br />اولا جميل اوى الموضوع يااااااااااااااااه قد ايه تحفة<br />هو أنا ليه بحب الحياة<br />سؤال محتاج قبله سؤال هو انااصلا بحبها<br />اعتقد ان مفيش حد بيحب الحياة مهما كانت مؤلمة<br />صحيح اوقات بتبقى عاملة زى الحلقة اللى بتخنقنى بس برجع وقول ماهى لازم تكون كده علشان احبها ماهى لو الحياة كلها كويسه وجميلة ووردى ولذيذة ومفيش فيها مشاكل هتبقى مملة انا معاكم ان المشاكل بقت كتر وفوق الاحتمال بس كل ما بتزيد صعوبة المشكلة كل ما بتكون قيمة الحياة وده بنحسه وقت لما المشكلة تتحل<br />بحب ضحكة طفل تنسينى كل هموم الدنيا<br />بحب الشعر بطير معاه بخيالى<br />بحب اوى لما اتعب كتير فى حاجة واشوف نتيجتها<br />بحب اوى اشوف الناس مبسوطة وبتضحك بحس بالامل<br />بحب كلام الاطفال ومشيتهم<br />بحب لما ادخل معمل الكلية واعمل تجربة وتطلع صح يااااااااااااه بيبقى احلى يوم فى حياتى<br />بحب اقعد مع اصحابى ونقعد نضحك حتى لو كان ضحكنا ده هو طريقة للتعبير عن حزننا وهمنا<br />بحب اقعد اتكلم مع اخويا<br />بحب اتفرج على ديكورات بكل انواعها<br />بحب الكارتون اسعد لحظات حياتى اوقات الكارتون<br />بحب اقعد فوق سطح بيتنا وقت المغربية واشوف الشمس وقت الغروب ومن بعدها السما والنجوم<br />بموت فى القمر واتكلم معاه<br />بحب الحمام والعصافير بعدال فجر بشوية شكلهم روعة<br />بحب الشمس الصبح وهى جاية تخبط على الباب<br />بحب الشجر اى ان كان شكله<br />بحب شجرة لما تكون وحيدة لوحدها ومفيش حواليها اى شجر تانى<br />بحب الكتب العلمية<br />بحب البالية جداااااااا<br />يااااااااااااااااه على فكرة لو عدينا اللى مش بنحبه هيكون اسهل<br />الحمد لله يارب على نعمة الحياة<br />اللهم لك الحمد كما ينبغى لجلال وجهك وعظيم سلطانك<br />سلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154815/http://www.20at.com/article2.php?sid=913"

[[comments]]
order = 6
subject = "هى دى الحياه..ضحكتين و اه"
author = "نيفين نيفى نوفا"
posted = "2006-06-11"
text = "احب القمر و احب اطلع على السطح اشوفه زى امبارح كدا و اسمع اى حاجه لحميد الشاعرى<br />احب نجمه قدام بلكونتى بكلمها و بتسمعنى<br />احب الساعه 9 اسيب كل اللى ورايا و اتفرج على توم اند جيرى على سبيستون<br />احب روايه ذهب مع الريح و احب و انا بقراها افتكر دى المره الكام بعد ال 100 اللى بقراها فيهاو افتكر البت هبهوب فى جمله ان هذا لكثيييير<br />احب فنجان قهوه بعد الساعه 2 بليل و انا بسمع برنامج دندنه على الشباب و الرياضه<br />احب تمسكى بالمل ان ف يوم من الايام هصحى على صوت نهى و هى بتقوللى انا رجعت و مش مسلفره تانى<br />احب اتخيل رجوع كل اصحابى اللى سافروا و قعدتنا ف الكافيه بتاعناحوالين القهوه المانو و احنا بنحكى عن الايام السودا اللى بعدنا فيها عن بعض و اقولهم يا تحف لما يقولولى يا نيفى و اللهع رومانسيتك دى هتوديكى ورا الشمس<br />احب اقرا هاملت و اشوفها على المسرح كل يوم اكتر ما شفتهاو اقابل نفسى فيها لانى متردده جدا<br />احب امشى انا و لبنى و ندندن زى زمان تانى تانى تانى راجعين انا و انت تانى<br />احب ابص ف عيون الاطفال الواسعه اللى بتلمع و بتقوللى الدنيا لسه بخير<br />و لسه فيه براءه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154815/http://www.20at.com/article2.php?sid=913"

[[comments]]
order = 7
subject = "هى دى الحياه ..ضحكتين و اه"
author = "نيفين نيفى نوفا"
posted = "2006-06-11"
text = "احب اسمع سعاد حسنى و اطلع صورتها من محفظتى و الاقى عينيها التحفه تقوللى الجمال كل جمال ليه نهايه برده<br />لكل شىء اذا ماتم نقصان و لا ايه يا عبد الله<br />احب اقرا احببتها لكامل الشناوى احببتها مش حبيبها<br />احب ماتشات كاس العالم و ازعل اوى لما اسمع 100 نشيد وطنى و ملاقيش فيهم بلادى بلادى<br />احب اسمع حليم بيقول على حسب وداد جلبى يا بوىوادوب مع موال الصبر اهو داب من يوم الحب ......<br />احب ادندن عمرو و انا على اللسان فى راس البر و هو لبقول حكايتنا يا روح قلبى حكايه و ارمى الدني و را ضهرى و انا باصه للبحر<br />احب اسمع اغنيه الحدود لقربق الاصقاء و اعيط كانى اول مره بسمعها<br />احب الليل الليل الليل...الصديق اللى عمره ما خلف ميعاده معايا و لا يوم اتاخر ثانيه<br />احب اسقى الزرهع و انا بغنيله حاجه لمحمد فوزى؟؟معرفش ليه فوزى بالذات<br />احب اقعد اكتب يومياتى حتى لو كئيبه و اسال نفسى ليه يا بنتى كدا ما انتى هتتعكننى لما تقرايها تانى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154815/http://www.20at.com/article2.php?sid=913"

[[comments]]
order = 8
subject = "هى دى الحياه ..ضحكتين و اه"
author = "نيفين نيفى نوفا"
posted = "2006-06-11"
text = "احب اشوف مدرسه المشاغبين و اموت من الضحك لما يقول الاباصيرى افرض منفعتش ف الدراسه اصيع انا يعنى<br />احب اقرا سوره مريم و اتخيل شكل السيده مريم<br />راسمهليها مليون شكل ف خيالى كلهم احلى من بعض<br />احب اسافر اسةان و انا ف مكانى لما اسمع منير بيقول الليله يا سمرا<br />احب ادخل و لاد البلد و يتولد جوايا شعورين عكيس بعض كلكو عارفينهم<br />احب اقعد على الفيشاوى انا و اصحابى نحلم بمصر اللى بتتولد من جديد ف ساعه ضلمه ما يعلم بيها الا ربنا<br />بحب احمد فؤاد نجم حتى لما بيلبخ<br />احب و انا وسط المكفوفين ف جمعيه النور و الامل اغنيلهم النور مكانه ف القلوب<br />بحب ال3 خبطات بتوع المسرح<br />احب لما ارسم لوحه جديده او اكتب حاجه جديده الم كل اصحابى و نتناقش حتى لو كنا الفجر<br />احب اتفتت على صوت فيروز و هى بتقول انا لحبيبىو احس انى واقفه ف وسط حديقه فيها مليون ورده و مفيش ورده شكل التانيه<br />دى تخريفاتى انا<br />لكن كلمه للكل<br />ف فيلم السلم و التعبان قالها طارق التلمسانى لهانى سلامه<br />قالله الحياه مفيهاش اى ضمانات و يوم ما تكرهها هتلاقى 100 حاجه تخليك تحبها<br />الحياه حلوه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154815/http://www.20at.com/article2.php?sid=913"

[[comments]]
order = 9
subject = "هقول ليه"
author = "عبدالله مفتاح"
posted = "2006-06-11"
text = "بحب الحياة عشان اثبت ان السعادة في رضا الله<br />بحبها عشان ادور على البراءة<br />بحبها على الطفولة<br />بحبها عشان محدش يقدر عليها<br />بحبها عشان ياما ناس ندموا على انهم اتخدعوا فيها<br />بحبها عشان عشان متاخدنيش<br />بحبها عشان تفوقني لو خدتني<br />بحبها عشان الامانه والاخلاص والصدق موجودين فيها<br />بحبها عشان الايثار موجود فيها<br />وفي الاخر لازم اقول<br />يا دنيا اليك عني غري غيري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154815/http://www.20at.com/article2.php?sid=913"

[[comments]]
order = 10
subject = "حبي لأشياء معينة هو اللي بيربطني بالحياة"
author = "يرتبط حبي للحياة بحبي للأشياء المحيطة به، فمثلا من أكثر الأوقات التي أكره فيها نفسي وحياتي، أوقات الدراسة التي أكرهها للغاية؛ لأن حال التعليم في مصر لا يخفى على ذو بصر...."
posted = "2006-06-12"
text = "أما إذا كان الجو المحيط بي يضم أشياء أحبها، كأن أكون مع أصدقائي المقربين، أو أن أمارس نشاطا أو هواية أعشقها، فهذا يجعلني أشعر بحب وشوق وعشق للحياة...<br />كما أن التفوق في عمل شيء ما يجعلني سعيد ومحبا للحياة؛ لهذا فإن الأوقات الوحيدة التي أعشقها في دراستي هي أوقات الامتحانات التي أبذل فيها كل ما بوسعي كي أتفوق، وهو ما يشعرني بالسعادة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154815/http://www.20at.com/article2.php?sid=913"

