[[comments]]
order = 12
subject = "مش بحبها بس؟؟؟؟"
author = "ميوزة"
posted = "2006-07-12"
text = "مش بحبها بس في حاجات هي الي بتخليني فيها علشان مينفعش نقول انا مش عايزة اعيش مع ان الواحد بيقولها كتييييير بس ما باليد حيلة يمكن في ناس كتير لسه عايشة علشان عندها ايمان بربنا<br />اما بحب فيها ايه بحب لما حد يفهم عليا يحسني يحسني اوي يبص بس في وشي يقولي مالك انا هنا جنبك<br />بحب ابص في البحر اوي اوي<br />بحب اقف في البلكونة الفجر اشم الهوا<br />بحب اغنية عصفور طل من الشباك وبحب اي حد يحبها<br />بحب فيروز.........اعطني الناي انا عصفورة السحاب.كيفك انت .وانا صار لازم ودعكم<br />بحب منير<br />بحب عائلتي اوي واولاد خالاتي<br />واصحابي نعمة<br />وبحب لما بكون مديقة اعيط يا اما هنفجر<br />بحب جبران خليل خبران<br />بحب الجنون وبكره القيود والجمود<br />بحب اتوه من نفسي ومن الي حوليه<br />بحب اسرح منغير معرف لفين<br />بحب الي بيحبني وبكره اودع الناس<br />واكتر حد بحبه في الدنيا دي كلهامامتي مع ان دايما مش بعرف اتكلم معاها من غير ماتنرفز ونتخانق في الاخر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154815/http://www.20at.com/article2.php?sid=913"

