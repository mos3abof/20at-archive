text = "لما اصحى الصبح في الشتا وتكون الشمس طالعة<br />لما اروح من شغلي اخر اليوم واترمي على سريري الساقع في عز الحر<br />لما اتعلم حاجة جديدة<br />لما انزل في شوارع مصر الفجر و تكون رايقه وفاضية<br />لما اناااااااام من غير محد يصحيني<br />لما تجيلي مسج من حد بحبه و بقالي كتير مكلمتوش"
