text = "بحبها ....... مش عارف بحبها ولا لا<br />او مبقتش احبها<br />كل حاجه فيها بقت ضدى.... كله واقف فى سبيل سعادتى<br />طبعا الحمد له على كل شيئ بس دا مش اعترف والحمد لله على كل شيئ<br />بس احنا بتكلم وطرحنا الموضوع يبقى نفضفض شويه<br />انا مش بحبها ... او بحب فيها حاجات معينه بس<br />احب فيها عباده ربنا بس<br />مش بحب الحياه دى الا علشان عباده ربنا واى حاجه تانى مش عايزها ومش بحبها<br />علشان كده كم اتمنى لقاء ربى ولو حتى دلوقتى حالا فى اللحظه اللى بكلمكم فيها<br />مش عارف مستعد ولا لا .... بس عايز اقابله<br />الحياه دلوقتى عندى مش ليها اى هدف<br />وهدفى الوحيد ليها انى اجهز لاخرتى<br />مش عارف رايئ دا هيعجب حد ولا لا<br />بس دا رائ<br />سلامى ليكوا<br />@ باستووو @"
