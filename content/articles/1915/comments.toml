posted = "2006-07-12"
text = "بحب ان انا جويا طفلة شقية وبحب العب ومش بحب اكبر<br />بحب اروح دريم بارك واصرخ واطلع الي جوايا<br />بحب الخروج في اي حتة حتي لو هتمشي شوية<br />بحب الشعر بيخدني بعيد<br />بحب القراءة واتفرج علي الافلام<br />بحب اتكلم في السياسة<br />بحب الشهداء والمناضلين<br />بحب ربنا والرسول وبدعي ان ربنا يكون راضي عني انا وكل الناس الي اعرفهم<br />في الاخر بحب موقعكم اوي وبكره اوي لان من كتر المواضيع ما بتبقي جميل بعيط وبيبقي شكلي صعب"
