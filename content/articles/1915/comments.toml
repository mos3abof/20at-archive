subject = "بالله اقرووووووووووووا ردي"
author = "جوجو الاردن"
posted = "2006-06-07"
text = "والله اول شي السلام عليكم ورحمة الله وبركاته تاني شي الواحد لازم يحب الحياه لانها نعمه من ربنا وكلنا عارفين هاد الكلام بس الي حابه احكيه انو انا مرات بكون زعلانه او متدايقه وبتمنى الله ياخد امانته وارتاح لانو الحياه احيانا صعبه وخصوصا للي عنده مشاكل الها اول ما الها اخر بس ما علينا لازم نقول جميعا الحمدلله رب العامين"
