text = "بتحبها ليه؟؟؟؟؟؟؟؟؟<br />اذا كان الواحد بيحبها اصلا<br />باحبها لما احس ان فيه حد بيحبني و يخاف عليه ممكن نرتبط ببعض في يوم<br />و اكرهها لما افكر ان كل ده ممكن يطلع غلط او اتخدع فيه<br />و ارجع احبها تاني لما اسمع منير و فضل<br />و اكرهها لما احس اني مش بارضى ربنا<br />و احبها لما اسمع انشوده الهي لمشاري<br />واحيها و اكرهها هيه ديه الحياه......"
