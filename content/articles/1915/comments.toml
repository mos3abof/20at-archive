capture_url = "https://web.archive.org/web/20061102154815/http://www.20at.com/article2.php?sid=913"

[[comments]]
order = 2
subject = "مش عارف"
author = "lost soul"
posted = "2006-06-07"
text = "احبها لية؟؟؟؟؟<br />ممكن ساعات<br />هى بينى و بينكو حلوة<br />بس للاسف<br />اتحولت جحيم<br />يعنى بعد ما الواحد دخل معترك الحياة (حلوة معترك دى) حس ان مش دة اللى كان فى نفسة مش نفس الصورة المرسومة فى الخيال<br />حاليا بعد ما الواحد جمع كل احلامة المكسورة واحباطاتة و انتصاراتة اذا كان فى انتصارات ووقف فوق الحطام يعنى الحطام دى عملت ييجى 20 دور الواحد شايف احسن دلوقت.<br />شايف كل الناس اللى تحت و بيستغرب هو لية لسة عايش.<br />بس تيجى لحظات حلوة تخلينى افكر و اقول ياخى الحياة حلوة.<br />قضاة مصر-ايمن نور-ابراهيم عيسى - صحفيين مصر الشرفاء مش بتوع القومية- شعر احمد مطر -ابويا - امى - اخواتى- الكورة- Vanna-Josh Groban-<br />ياة دى فيها حجات كتير اوى تتحب.<br />لا تسقنى ماء الحياة بذلة بل فاسقنى بالعز كاس الحنضل<br />ماء الحياة بذلة كجهنم و جهنم بالعز اطيب معزل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154815/http://www.20at.com/article2.php?sid=913"

