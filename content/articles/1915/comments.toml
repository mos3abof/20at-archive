[[comments]]
order = 25
subject = "أكتشفت اني بحبها"
author = "Blue Sea"
posted = "2006-07-30"
text = "السلام عليكم ورحمة الله وبركاتة<br />قبل ما اعلق علي الموضوع و اقول بحبها لية .. احب اوضح للشخص إللي كاتب فوق<br />انتي انسانة دنيوية<br />اولا .. عدم قراءة الموضوع للنهائة مش حاجة كويسة تفتخر او تفتخري بيها<br />دا ان فيدل علي عدم القدرة علي سماع الآخرين<br />ثانيا .. مش معني حبنا للحياه لاسباب دنيوية يبقي نسينا ان في ربنا<br />الحياه هي روح و كيان كل انسان ( ونعمة من الرحمن)<br />ثالثا .. كرهنا للموت هو أكبر دليل علي حبنا للحياه<br />وأظن مفيش حد يختلف معايا علي رهبة الموت<br />اما بالنسبة للناس إللي اتكلمت ..<br />مع اختلافي و اعجابي بحجات كتير قالوها<br />وجمال الاسلوب ... والتعبير الصادق<br />احب اقول انا كمان<br />بحب الحياه لما احسن ان في حد بيهتم بيا<br />بحب الحياه لما ابقي عارف ان إللي جاي أكيد احسن<br />بحب الحياه لما احقق نجاح كنت مستنية<br />بحب الحياه في رمضان زمان أيام الطفولة<br />بحب الحياه لما اسافر وكل يوم ابقي في مكان<br />بحب الحياه لما اسمع ان فلان ألتزم<br />بحب الحياه لما احس برضا ربنا عليا<br />بحب الحياه و انا واقف في تراويح رمضان<br />بحب الحياه و انا داخل المسجد ساعة الأدان<br />بحب الحياه لما اعرف اني لما اموت ححياها تاني<br />بحب الحياه لما اكون في الشارع لوحدي<br />بحب الحياه لما الحبايب ينادوا أسمي<br />هي حياه ... ورغم مأسيها و عزابها<br />حيفضل جوا منا شئ يخلينا تملي .. نحبها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154815/http://www.20at.com/article2.php?sid=913"

