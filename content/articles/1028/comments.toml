[[comments]]
order = 0
subject = "هل كان يجب أن يموت أولا"
author = "حسام عبد اللطيف"
posted = "2006-09-05"
text = "أتصور كيف كان الأستاذ نجيب محفوظ سييشعر وهو يقرأ كلامك عنه يا هناء، أكاد أوقن بأن عيناه كانتا ستدمعان وكانت ستخرج منه تنهيدة إرتياح عميقة لشخص شعر بأنه أضاف شيئا جميلا لهذه الحياة، أظنه كان سيضع كلامك عنه حتى قبل كلام أكثر النُقاد ثناء عليه وسيقدمه على ربما كل ما كُتب عنه بعد فوزه بالجائزة.<br />ما أتسآل عنه هو هل كان يجب أن يموت محفوظ أولا قبل أن يُكتب عنه بهذا الصدق والتلقائية؟ أعلم أن الرد الجاهز هو إدانة ذاتية وترديد للمقولة المحفوظة باننا هكذا لا نعرف قيمة مُبدعينا إلا عندما يرحلون. ولكننى أظن أن هذه المقولة صحيحة فقط بشكل جزئى، فدائما سيظل رحيل الشهاب هو فقط ما يفجر كل مكامن الشجن والحنين وإحساس الفقد ليجعلنا نكتب بهذا الصدق الذى لن أستطيع أن أحسد عليه أستاذ نجيب ولكننى أستطيع أن أحسدك وأشكرك عليه يا هناء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131247/http://www.20at.com/article2.php?sid=1185"

[[comments]]
order = 1
subject = "حيا الله قلمك"
author = "إنسان"
posted = "2006-09-06"
text = "كاتبة السطور تكتب برهافة حس ، وجمال نفس غريبين لكأنك تندهش من قدرتها عن الخوض فى تفاصيل شديدة الحميمية والخصوصية قى ذات الوقت .<br />مقالك مسّّ قلبى فى مقتل .. برغم كل ما أثير حول الرجل من جذب وطرد ، وصد ورد شعرت أننى أمام عاشقة لأدب الأديب العزيز .. وإننى لأحسدك حقاً على قدرتك المدهشة فى الوصول لمنطقة لم يستطع المحترفون أو الأكاديميون الوصول إليها .. كلام كثير أحب أن أقوله عن مقالك الرائع ، لكن البيان يخذلنى فى نذالة .<br />بارك الله فيكى ، وأرجو أن ينطلق قلمك الموهوب فى مقالات أخرى .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131247/http://www.20at.com/article2.php?sid=1185"

