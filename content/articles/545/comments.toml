subject = "اللبناني احلى"
author = "علي شهاب من عراق"
posted = "2006-10-15"
text = "جمل لغة بالنسبة لي ولكل العراقيين هي اللبنانية لانها لغة دلوعة وسلسة وجميلة وانا متعود على اللغة اللبنانية من صغري بحيث اجيدها احسن من العراقي الى جانب كوني عراقي واعتز بعراقيتي وانا اشوف ان ما في فرق بين اللهجات لان كلنا عرب"
