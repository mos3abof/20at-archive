text = "كل جماعة ما لهم مصطلحاتهم لخاصة للتواصل فيما بينهم...وهذه المفردات تأثرت فيما قبلها من شعوب وثقافات على تلك المنطقة المأهولة.....أمل انا والله فتعجبني لهجات المغاربة...وحصرا تونس والمغرب...على الرغم من اني سوري..ولدي معرفة بكل اللهجات العربية ...نظرا لسفري ..الى اغلب البلدان العربية....ممتااااااااااااز للتوانسة والمغاربة ..والله 100/100"
