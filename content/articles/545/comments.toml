subject = "اجمل لهجة على الاطلاق هي اللبنانية"
author = "مصطفى - الاسكندرية - مصر"
posted = "2006-01-10"
text = "لهجتنا المصرية هي لهجة غير واضحة بالنسبة لجميع العرب و هي تعتبر بدوية.<br />اللهجة السورية هي ابشع اللهجات و اضحكها.<br />اللهجة العراقية بسيطة قريبة للفهم.<br />اما اللهجة اللبنانية فهي الافضل و الاجمل على الاطلاق، وهي مفهومة عند جميع العرب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103129/http://www.20at.com/article2.php?sid=75"

