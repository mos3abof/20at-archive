subject = "فعلا يلزمنا قاموس لغات"
author = "عدنان"
posted = "2006-10-15"
text = "اني أرى أفضل لهجة وأقربها الى الفصحى هي اللهجة السوريةالحالية بحروفها ومعانيها وأسقط لهجة هي المصريةرغم انتشارهابسبب كثرة المصريين وانتشارهم سواء كانت في انتشار فنهم الفاضح أو بسبب رحيلهم هم عن بلادهم للعمل فاللهجة المصريةقبيحة ولاأرى فيها أى جمال"
