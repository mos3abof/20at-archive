[[comments]]
order = 11
subject = "الله يعين بعدين ما تفرقوا بين العرب نفسهون"
author = "ريما"
posted = "2006-05-26"
text = "السلام عليكم<br />هذه الكلمة والتحية الطيبة المباركة اكيد كلكون فهمتوها وما بدها ترجمة<br />وبعدين اخواني اللهجة والكلام هي وسيلة التخاطب والتعارف بين الشعوب<br />من هذا المنطلق ويا اخي مصطفى اعانك الله كيف بتقدر تحكي هيك يعني كده عندكوم يعني بقصد كيف بتقدر تجرح الغير وما بتسال انو في سوريين رح يقروا هادا الكلام يعني مو اسلوب الحوار بلا مؤاخذة لكن مع ذلك نحن نعشق ارض مصر ونحترمكم ولهجتكم ...وبالنسبة الي انا بحكي اللهجاتالمتنوعة حسب لهجة الشخص اللي بيحكي معي والكل عندي سواء بس يا ريت لو نرجع للغة الفصحى لانها اكتر تعبيرا واكتر قوة واكتر احترام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103129/http://www.20at.com/article2.php?sid=75"

[[comments]]
order = 12
subject = "حرام عليكم كلكم"
author = "مناحي بن عصودي"
posted = "2006-06-10"
text = "السلام عليكم ورحمة الله و بركاته<br />سبحان الله و بحمده سبحان الله العظيم<br />أشهد أنه لا إله إلا الله و أشهد أن محمداً عبده ورسوله<br />( صلى الله عليه و سلم )<br />بالنسبة للهجات العربية فمعظمها تأثر بالاستعمار و عند الرجوع للفصحى ستضحكوا كثيرا على أنفسكم جميعا و في جميع الدول العربية . مع أسفي على حالكم جميعا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103129/http://www.20at.com/article2.php?sid=75"

