text = "كلها موسيقى في الاخر، تسموه نشيد تسموه اغنية او طقطوقة، في الاخر كله فن، والفن الكويس بيفضل والفن الهابط بيروح مع الوقت<br />مش كيميا يعني!!<br />اما موضوع \"إسلامي\" فده بصراحة اكتر حاجة بتستفزني... مع اني مسلم ولله الحمد، بس الموضوع بقى في تسطيح بطريقة مستفزة ومتاجرة بالدين<br />وبعدين انا نفسي افهم يعني ايه موسيقى اسلامية؟!!<br />ومين اللي له الحق انه يقول ده اسلامي وده مش اسلامي؟!!"
