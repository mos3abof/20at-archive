text = "بجد يامصطفى ربنا يكرمك على طريقتك فى الكلام وأدعي لكل حد قال عليك كلمة وحشة ان ربنا يغفرله ويسامحه لأنهم بيحطوا حجج ويقولك طول منا نيتى خير أدوووووس بس انا أقول حسبى الله ونعم الوكيل وانا شاهد معك عليهم يوم القيامة بإذن الله ..<br />رززقك الله الإخلاص يأخى وثبتك ورزقك الطريق السليم<br />اللهم إن الإخلاص قد شق علينا فمكننا منه"
