subject = "مشروع كباريه اسلامي"
author = "عبددالله اشرف"
posted = "2006-03-29"
text = "أنا مبسوط من التعليق بتاع بسمتكم<br />و عندي اقتراح و هو انشاء بار اسلامي يتم فيه تشغيل اغاني مصطفى محمود الاسلامية و من الممكن أن ترقص فيه راقصة بالخمار او نسمح بالرقص المشترك بين الشباب و الفتيات بشرط التزام الملابس المحتشمة و عدم التفكير في حاجة و حشة اثناء الرقص و اللي عايز اي حاجة تانية نمشيهاله شرعي برضه و ماله زواج المتعة.انا مش عارف سبنا ايه لاصحاب السبن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

[[comments]]
order = 14
subject = "كالعادة يا دبدوب"
author = "عبدالله مفتاح"
posted = "2006-03-29"
text = "طبعا انت يا دبدوب سايب الدنيا كلها باللي فيها وماسك في تعليقي مش عارف ليه ؟هقلك يا حبيبي يا دبدوب<br />اولا:لما اقلك ان فكرك يساري بتزعل واهو بتفرض سوء النيه في المتدينين ودي الف باء يسار .ليه مثلا متقلش ان يوجد في الدين راي حلل الموسيقى بشرط ان الكلام يكون حسن. وهما بيحاولوا يعملوا خير .<br />ثانيا:هترجم مقالات اجنبيه تفسرلنا ظواهرنا؟ صلي على النبي يا دبدوب مش كل اللي يقوله الاجانب صح .<br />ثالثا:انا قلت ان الاغاني دي مش عجباني ولا انا قلت رايي خالص؟ ايه اللزقه دي.<br />رابعا:حاجه تانيه من كلامك بتعبر عن فكر اليسار بتقول ان الموضوع ده بالنسبالي يعني انا اللي وحش وبفكر في الاغاني بمعنى وحش. وانت بقا الملاك اللي بتفرض حسن النيه طيب انا راضي ذمتك(تعالى جوه حضني وارتاح دي ليله تسوى كل الحياة)،(خليني اصرخ جوه حضنك من الحنان وكل مصرخ زودي الاحضان كمان) فسرلي الحضن تفسير ابن حلال منتا ملاك تقدر تخلي نيتك كويسه لكن انا عفريت نيتي على طول شيطانه زيي ولا اقلك؟ تيجي نضحك على نفسنا ونقول بيغنيها لمراته حتى لو لمراته مصطفى محمود مش بيقول حاجات زي دي في اغانيه<br />خامسا:انا حالتي مش صعبه ولا حاجه يا صحبي دبدوب كل ما فيها ان عندي احساس ودي ميزة مش عيب لكن اللي مش بيحس هو اللي تبقى حالته صعبه .<br />سادسا:اغنية سميره سعيدبتقول(ياللي ممكن اسيبلك نفسي ) تفتكر بتسيب نفسها للولد ده ليه؟ عشان يقعدوا يتدارسون القران؟ خلي نيتك كويسه(لان زي منتا عارف انا دايما نيتي وحشه بحمل الامور مالا تحتملها) وقولي بتسيب نفسها ليه؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

