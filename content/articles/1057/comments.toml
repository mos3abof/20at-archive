subject = "سحقا لمعادين\" الساميه\""
author = "هوووووبه ...هبهوب"
posted = "2006-04-03"
text = "ماله النشيد ماله \"في جيبه\"<br />لديد وجميل وسكره ومصفي محمود راجل قلبوظه وعسل بردو<br />اهو قليله احسن من شعبولا<br />وعادي في اناشششششيد كتيره جدا فيها موسيقي المهم يابشر<br />قد تكون حماسيه ...الخ اللي دكروه لكاتب<br />والعالم متتطلعش تتكلم وهي مش فاهمه<br />وفي حته في نشيد اتكلمت عن الحب بمعني رائع<br />\" بيسالوني عن معني كلمه حب انا قلت احساس بيسكن كل قلب<br />وبين قلوب الناس يتبدل الاحساس في ناس بتعشق فسها وناس تحب<br />الناس والحب اللي في رحاب المولي يضمنا ياريت نعرف نعيشه ونخاف<br />علي بعضنا الحب لو في الله محلاه يا ناس محلاه مهوش لمال اوجاه<br />وميقللش بمال وبين قلوب الناس يتبدل الاحساس في<br />ناس بتعشق نفسها وناس تحب الناس<br />ومحبه الازواج الرحمه والسكن حب ود وسعاده وربيع طول<br />الزمن انسانه تحس جرحك عيشه حزنك وفرحك تحبها وتحبك وحبكم اخلاص<br />حب الام لضانها قبل معاد اللقي \" لمدام رغداء \"<br />شهور تحلم بصورته وتحكي عن غلوته ومهما بشقها قولتوه<br />دا الحب دا احساس ...<br />واسمعو اناشيد في خماره محترمه شويه مش قزازه فودكا \" ايه الهبل دا\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

