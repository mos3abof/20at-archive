[[comments]]
order = 29
subject = "الاخوة اللي بيقولوا على مصطفى استعباط اسلامي"
author = "مهند"
posted = "2006-04-05"
text = "يا جماعة بلاش اصدار احكام عالناس...اللي قال ان اغاني مصطفى محمود استعباط يبقى الصراحة بيستعبط....لانه مش استعباط بس ....دا هبل وتخلف.<br />يكفي ان كاتب الموضوع واللي كتب عنه واللي مقرين تققت فيهم نبوءة النبي (يكون اقوام من امتي يستحلون الحر والحرير والخمر والمعازف)<br />عادي ...مش تزعلوا ....الخمورجية برضوا وقعوا وقالوا دي مشروبات روحية.<br />والله سواء استحللتموها بغباء واستهبال من عندكم.....او بفتوى عالم مسمومة من علماء اليومين دول....أو باي شيء.....فقد استحللتموها.....وطبقتوا زي ما الكتاب بيقول .....قصدي زي مالنبي بيقول.<br />الاخ البراء....نصيحة على جنب:<br />لو ربنا سترك وانت بتكلم واحدة عالماسينجر ...بلاش تفضح نفسك عالملأ عشان دي مجاهرة بالذنب يا حبيبي .....وان قاوحت فانا بسألك بالله ...تعمل ايه لو النبي دخل عليك وانت بتكلم زميلتك ...أكيد هتقفل الشات فورا وتعمل عبيط.<br />ملحوظة: لو الذنب عندكم تحول لاستحلال ....فلا تشغل نفسك بمحاولة فهم كلامي .....لانك في هذه الحالة تحولت من عاصي لمستحل....وحاجة زي كدا مش عاوزة كلام من عبد زيي ......ميفرجهاش غير ربنا.<br />والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

