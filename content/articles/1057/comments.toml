text = "اما وجهة نظرى ان الشخص يتحول داعى دينى فى حالة اذا ماكان متفقة فى الدين يعنى حافظ القران او على الاقل نصفة وقارى كويس فى كل العلوم الدينية ولة وجهة نظر دينية يعترف بها الفقهاء او شيوخ الازهر اما بقى كل واحد سمع كلمتين ييجى يعمل نفسة داعية دة كلام مش مظبوط<br />وحكاية اننا فى مصر مش عارفين صحيح اسلامنا دة كلام حقيقى ومتبصش لنفسك انا بتكلم على مجتمع نصفة امى والناس بتوع الارياف لغاية النهاردة بتحكمهم العادات والتقاليد اللى جزء منها من الدين والباقى ضد الدين فية ناس لغاية النهاردة لو واحد اتكلم قدامهم فى الدين مبيعرفشى اذا كان كلامة صح فى الدين فعلا ولا الراجل دة مدعى واغلب الظن اننا فى مصر بنستقبل الدعاة بالعاطفة مش بالعقل"
