[[comments]]
order = 5
subject = "موضوع حيوي"
author = "عبدالله مفتاح"
posted = "2006-03-28"
text = "بص يا سيدي كلمة اناشيدبيتم اسقاطها على اللي بيقوله المنشد يعني مصطفى محمود منشد لان بيراعي ان كلمات اغنيته مينكش فيها قبح يبقى اللي بيقوله مصطفى محمود اناشيد لكن استحاله نقول على عمرو دياب منشد طيب ليه منقلش على عمرو منشد؟ لان عمرو كلمات اغنياته فيها من قبيح الكلام الكثير زي ايه؟<br />اقلك زي ايه(تعالى جوه حضني وارتاح دي ليله تسوى كل الحياة) ده مثل على اخر اغنيه واغلب الاغاني كده.<br />ولا محمد منير نقدر نقول عليه منشد ليه ؟بردو لان كلماته فيها من قبيح الكلام الكثير زي ايه؟ اقلك<br />(خليني اصرخ جوه حضنك من الحنان وكل ما اصرخ زودي الاحضان كمان)<br />ولا (واما) ينفع نقول عليهم منشدين ليه؟ اقلك ليه؟<br />(وتكون معايا وفي حضني لكن بعيد عني يا غالي)<br />على فكرة انا اديت مثال واحد لكن اغلب اغاني المطربين دول على نفس الوتيره وبصراحه الواحد لما بيسمع الاغاني دي بيبقى عايز يخترع بنت عشان يجرب الكلام ده(مش موضوعنا)<br />بايجاز كلمه نشيد بتتقال على اللي نقدر نعتبره منشد وبما اننا نقدر نقول على مصطفى محمود منشد ومنقدرش نقول على التانيين منشدين يبقى اللي بيقوله مصطفى اناشيد والحاجات التانيه اغاني.<br />ملاحظه بسيطه في اغاني كلماتها فيها كوارث ادي مثال واحد بردو ( ياللي ليك بسلم نفسي ياللي معاك بنسى نفسي) اغني سميرة سعيد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

[[comments]]
order = 6
subject = "مفيش دين ولا غيره في البزنس"
author = "Dabdoob"
posted = "2006-03-29"
text = "الموضوع ببساطة ان البزنس بيلعب دوره<br />يعني ببساطة كيف تنجح في جذب نقود المتدينين (وهي كثيرة ) ؟؟؟ وانا نشرت ده بشويةتفصيل في موضوع (جينز اسلامي) وممكن اترجم ان شاء الله بعض المقالات الاجنبية التي تتحدث عن هذا الموضوع بس مش عارف هيرضوا ينشروها في عشرينات ولا لأ ؟؟<br />اخيرا بالنسبة لكلام الاخ عبد الله مفتاح :<br />1- لا تسمع هذه الاغاني ان كانت تضايقك<br />2- لم ار كل هذه الاثارة التي تتحدث عنها في كلامك واغلب الظن انك تتحدث عن نفسك وربنا معاك لان شكل حالتك صعبة<br />3- التفسير الجنسي لكلمات الاغاني سهل جدا وهذا ما تفعله انت الان!<br />وعلي سبيل المثال عمرو دياب يقول (يا حبيبي وانت جنبي تفتكر انا هاعمل ايه ....هيه هيهيه هيهيه) وهو بالطبع لا يقصد اي شيئ غير مهذب ولكنها ببساطة ركاكة تعبير ليس الا!!!!!<br />ولكن بتفسيرك انت ماذا سيكون يفعل ؟<br />بالطبع لابد انه يفعل هيه وهيهيه وهيه<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

