text = "انا الايراني اخبر عن اغنيه السامي و رغبت اليه و فرحت من الانشاد المعنوي والاهي و لذلك اعتقد انّ الاغنيه امكن ان يستخدم بالدين و الاسلام و المسلمون احسن ان الحامي لهذه الاغنيه<br />في امان الله"
