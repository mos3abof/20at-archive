author = "فتاه الاسلام"
posted = "2006-06-27"
text = "اخواتى واخوانى فى الله<br />مش معنى ان النشيداوالاغنيه ذى ماتسموهاانتمالى نزلها مصطفى اوغيره من المنشدين الاسلاميين يكون فيها موسيقى انها اغنيه اولا النشيد بمعناه مش بمسيقته اوغيره المهم المعنى رايح فين بيعمل ايه فى الشباب ثانيا بصوا حوليكوا وشوفوا الشباب بتشوف ايه فى القنوات وغيره ده ضيع منينا شباب كتير وده الى بيحاول يعمله مصطفى وغيره وهوة انهم يسمعوا الشباب حاجه على نفس المستوى الى اتعودوا يسمعوه بس بعنى هادف ما يسرش جواهم الشهوات فى الطريق الخاطى ودى حاجه مهمه واحنا محتجينها دلوقتى اوىىىىىىىىىىى ارجوا ان احنا نشجعهم مش نعارضهم يارب تكونوا اقتنعتوا بكلامى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

[[comments]]
order = 46
subject = "اظن مفيش فرق ابدا"
author = "خالد أمين"
posted = "2006-07-14"
text = "بسم الله الرحمن الرحيم :<br />الحقيقة اني لما سمعت بداية الاغنية محسيتش ابدا اني في فرق بين الاسماء للي نتو حطينها.<br />هو في الحقيقة الموضوع جميل ونوقش بشكل محترم لكن مضنيش ابدا ان الشكل دا من الاغاني يمكن نصنفو ضمن الانشودة الاسلامية.<br />دي اغنية عادية زيها زي غيرهالانو في خطاب للمشاعر بشكل مباشر.<br />عموما نتمنى ان الفن الاسلامي يصل فيوم من الايام الى شكل يرضى متابعيه رغم ان في محاولات جميلة لكن الطريق مازالت طويلة.<br />اخيرا اخواني اخواتي اتمنى ان الانتقاد اكون بشكل محترم دون المساس بالاخريين بشكل يجرح."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

