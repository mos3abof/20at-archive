subject = "استعباط إسلامي"
author = "basmatokom"
posted = "2006-03-29"
text = "أغنية وححشششة أوي ........سامعه دي ..لأمش سامعه حاجه..وبعدين فرقنا إيه بأه عن الناس الوحشين التانيين ماهو كلهم ممكن يكونوا بيكلموا زوجاتهم.. على فكرة ده استعباط..... أعرف واحدة صاحبتي ما تسمعش أغاني علشان بتأثر فيها وتخليها تفكر تفكير مش صح لكن بتسمع مصطفى محمود مع انه بيأثر فيها نفس التأثير بس أهو اسمه إسلامي و خلاص.... ده مش فن إسلامي ده استعباط إسلامي واللي عايز يكلم زوجته يكلمها بينه و بينها مش أدام الناس!!!!!!!!!!!!!!!!!!!!<br />ده إيه نظام التلكيك ده أمال سيبنا ايه للأغاني بأه لما موسيقى واستعملناها وقلنا المهم المعنى و ادي المعنى كمان ياسيدي الحاجه الوحيده اللي ناقصه إن مصطفى محمود يعمل فيديوكليب هو ومراته ويرقصوا فيه........ رقص إسلامي برضه ماقلناش حاجه!!!!!!!!!!!!!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

