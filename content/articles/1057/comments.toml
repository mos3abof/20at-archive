author = "أحمد حامد"
posted = "2006-03-30"
text = "السلام عليكم جميعاً ....<br />أحب أعلق في 4 نقاط .<br />أولاً : أناشفت في آخر المقال ان الراجل الطيب كاتب المقال قال إن طرح الموضوع للنقاش لإثراء الموضوع ( نستفيد أكتر يعني )مش نشتم بعض.<br />ثانياً: اللي زعلانين من كلام مصطفى محمود ومن الناس اللي بتسمع الأغاني اللي كلامها محترم علشان ده كلام ميرضسش ربنا ، كلامكم والاستهزاء بالناس والتريقة ده ترضي ربنا ؟؟؟؟؟؟؟؟؟؟<br />ثالثاً: الناس اللي بتنتقد يشدة الأناشيد اللي بموسيقى وبتشتم في الناس أفكرهم إن من مبادئ الإسلام عدم الاستهزاء بالغير .<br />قال تعالى : \" يا أيها الذين آمنوا لا يسخر قوم من قوم عسى أن يكونوا خيراً منهم....(الآية) \" .<br />رابعا: واحد زي مصطفى محمود اجتهد واللي بيجتهد ممكن يخطئ و ممكن يصيب فلو تأكدلينا إنه أخطأ نراجعه بأدب النصيحة اللي علمهولنا إسلامنا الحنيف مش بالشتيمة والتريقة .<br />أنا آسف للإطالة يا جماعة بس الكلمتين دول كان لازم أقولهم بعد لما شفت كل التعليقات الظريفة اللي فيها تهكم شديد لا يليق اننا نشوفه في سياق مناقشة تثري موضوع تم طرحه .<br />وجزاكم الله خيراً"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

[[comments]]
order = 19
subject = "نادي اعداء النجاح .. الفيلق الفني الرابع ..حول"
author = "مصــegyــري"
posted = "2006-03-30"
text = "الا معلش يا جماعة سؤال برئ<br />هو عشان احنا اتهرينا اغاني سافلة عن الحب و الرومانسية .. يبقى اي حد يقرب من موضوع الحب او الرومانسية .. يبقى زنديق و نشغله في بار !!<br />هوا عشان احنا اتهرينا غزل اباحي .. يبقى كل الغزل حرام ؟؟<br />هوا عشان واحد فكر يجدد في الانشاد او الغناء المشروع ( وهما مترادفان في معجم لسان العرب ) .. يبقى حاد عن الطريق<br />الراجل بيقول بكل براءة<br />\"اول ما هندخل بيتنا راح نسجد نشكر لله و هنبتدي اول سكتنا على عهده اللي اتعاهدناه .. \" مصطفى محمود<br />لما اغنية زي دي تشتغل في فرح (وهو شريط افراح لو حد اخد باله ) مش احسن من اما تشتغل اغنية \"ضميني\" ولا \"خبيني\" ولا حتى \"كعبو كعبو حبيبي وانا الاعبو\" ...<br />ولا عايزين الناس تنتقل بقدرة قادر من اغاني البورنو الى ابو مازن في صفعة واحدة على القفا<br />الصراحة انا شايف ان مصطفى محمود يرتقي بناالسلم درجة درجة بنجاح حتى الان و ان كان ينقصه الانتشار .. و ممكن كمان 20 سنه ولا حاجة نشوف نهاية السلم دة و تكون عودة للفن الحلال<br />ساعتها بأه هنفتكر انه في واحد في يوم من الايام بدأ السلم .. و ارجوا انه يكون مصطفى محمود لا سامي يوسف لأعتبارات تتعلق باللغة<br />حاجة اخيرة .. كنت اتمنى اقرأ من كاتب المقال البراء نقد لمصطفى محمود فنيا بعيدا عن هذة الجدالات و الاشتغالات ( براء باشا .. انا المروحة الكبيرة فاكرني<br />اما البشمهندز اللي عايز يشغل شريط \"صناع الحياة\" ولا \"يا طريق\" في بار اسلامي .. فممكن لو فيها بواخة يبقوا يقدموا معاه منقوع حبة البركة بكحول 8% .. واهو قليل منه يصلح المعدة<br />و بيني و بينك .. سامي يوسف مانجحش الا اما وصل للبار التليفزيوني اللي اسمه ميلودي .. فأعتقد ده يبقى قمة النجاح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

[[comments]]
order = 20
subject = "مش مهم ايه الفرق المهم مين اللي هيدفع الفرق ؟؟؟؟؟؟؟؟؟؟؟؟؟"
author = "كرميلينو"
posted = "2006-04-01"
text = "قد لا نبالي بالرصاص ا>ا تهاوى حولنا<br />فانا و انت نفيق انت ثقب الرصاص رؤسنا<br />انا ارى ( يعني شايف ) ان الفرق الوحيد بين النشيد و الاغنية هو في الموسيقى<br />شيل الموسيقى من اي اغنية تبقى نشيد<br />اما مصطفى محمود و امثاله من منشدي اليومين دول بيترفعوا عن لقب مغني او مطرب عشان ميبقوش زي الناس الوحشين ( عمرو و منير و امثالهم )<br />اما بقا في المشكلة التانية و هي الصراع القائم بين الاسلاميين و الاسلاميين و لا احب ان اسمي اي طرف بالمتشدد او المعتدل لان الله وحده يعلم من الحق<br />هناك طائفة يتزعمها الدكتور محمد عمارة و يستندون على فتوى ابن حزم على تحليل الغناء شرعا و لا يجدون غضاضة في الموسيقى الغير مثيرة للغرائز ( ازاي معرفش بصراحه ) و لديهم ادلة عكسية بمعنى انهم قاموا بالتشكيك و تضعيف و تجريح كافة الاحاديث التي تتكلم عن حرمة الغناء و الموسيقى<br />و هو رأي فقي اجتهادي يجوز مناقشته و لا يجوز الحجر عليه و تتفيهه او تشويهه<br />اما الطرف الاخر فيرون ان الغناء حلاله حلال و حرامه حرام مثل علماء الجمعيه الشرعيه و الاخوان المسلمون و لا يجدون غضاضة في استخدام الات الايقاع فقط ( الدف و الطبله ) او الات التخبيط او استخدام المؤثرات الصوتيه الطبيعية مثل اصوات العصافير و صهيل الخيول و غيرها و هؤلاء ايضا لهم تجرب فريدة في قناة الفجر لعلوم القرآن الكريم و رأيهم ايضا يحترم<br />اما بقا السلفيين و انا منهم و الحمد لله ( رغم تقصيري في حق هدا المنهج العظيم ) فيرون ان الموسيقى محرمه بالكليه و ان الدف للنساء الصغيرات اي الاطفال و لهم ادلة كثيرة من الكتاب و السنة بعضها ضعفها و جرح فيها كما دكرنا انفا اصحاب المنهج و الراي الاول و لهم رأي محترم في العلماء ال>ين اختلفوا معهم<br />فالامام الالباني رحمه الله يقول عن الامام ابن حزم بانه امام مجتهد و كبير و لكن لكل عالم زله و ليس من الجزم الاخ> برأي ابن حزم في مسألة الغناء<br />و لكل دليله و الله يعلم الحق و هو يهدي السبيل<br />اما عن الاشتراطات الفنية و المهنيه و الدينية لاغاني 99 % من المطربين و المطربات الاحياء منهم و الاموات فهي لا تنطبق على اي من اصحاب الاراء الثلاثة<br />يبقا بم ان ادن<br />الفرق موجود<br />بس مين اللي هيدفع الفرق ؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

[[comments]]
order = 21
subject = "هجر القران بسبب هذه الاغانى"
author = "ساره"
posted = "2006-04-01"
text = "سلام عليكم ورحمة الله وبركاته<br />طرح مثل هذا الموضوع من الامور المهم جزاكم الله خيرا<br />بكل اسف ومع احترامى للعلماء الاجلاء الافاضل ولكننا الان نعانى من كثرة الفتوى حتى لدرجة انى عندما اشاهد حلقه فى برنامج يطرح تساؤلات دينيه فقهيه مع عالم او دارس للفقه فاننا نرى منه فتوه لو قلبت التلفاز ووجدت عالم اخر فى برنامج اخر اجد فتوة اخرى فى نفس الموضوع اخر فاللهم ثبتنا على راى واحد<br />انا اعلم انه حتى فى القديم كان هناك اختلاف فى الاراء ولكن ليس بهذه الصوره الموجوده اليوم, وانا اراى ان نستفتى قلبنا فهل ترون ان باستطاعة انسان ان يحفظ القران وهو مستمع لهذه الاغانى والكليبات والله بتجربتى انا والكثير مستحيل لذلك فان هذه الاغانى الفاسده تبعدنا كل البعد عن قراننا ومرشدنا فى هذه الحياه ولن نستطيع ان نكون من حملة القران فوالله نكون بعيدين كل البعد عن قراننا مدامت هذه الاغانى فى اذننا فلا سعاده فى هذه الحياه بعيده عن رضا الله عزوجل وارى ايضا, هل اذا كان رسولنا وحبيبنا محمد صلى الله عليه وسلم يعيش معنا فى هذه الايام هل كان سيعجب بهؤلاء وهل كان سيسمع لهم فاذا كونا نحب ان نكون على خطاه فيجب علينا البعد عن هذه الاغانى وارى اننا سوف نحاسب عن هؤلاء لاننا نشجعهم على ما يقومون به فلولا تشجيعنا باللتفرج عليهم والانصات اليهم وشراء شرائطهم وحضور حفلاتهم ما كانوا حققوا هذا النجاح الذى جعلهم يزدادون فى اعدادهم لنشر الفساد بين المسلمين حتى لو لم نكن غير مقتنعين بما يعملوه ولا نتمنى ان نكون مثلهم, مع العلم انى مع راى ان الموسيقى اذا استخدمت بالطريقة المفيده الهادفه فلا مانع منها لاننا الان فى زمن كثرة فيه الفاحشه والوسطيه هى افضل وسيله<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

