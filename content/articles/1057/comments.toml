text = "اتفق مع كل الاخوة والاخوات انها مبالغ فيها بعض الشئ فهذة المشاعر اعتقد انها لايجب ان تروى على الملا..مش عارفة دا راي وكمان السمت العام احنا مش متعودين على الشكل ده من الاغاني احنا مش عايزين النشيد يكون متجددبانه يقلد الاغاني ولكن عايزين التجديد يبقى فية ابداع قائم بذاتة وليس تقليييد وارجوكوا تسمعوا نشيد حب الزوجة للمنشد الاصيل عقيل الجناحي في شريط هكذا الحب<br />زكمان انشودة زوجتي للمنشد الرائع احمد بوخاطر في شريكط دعني وانتو حتعرفوا الفرق والشريطان موجودان على موقع انشاد"
