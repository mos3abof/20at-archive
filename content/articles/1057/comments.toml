[[comments]]
order = 39
subject = "ياجماعة فعلا فيه فرق"
author = "محمد محمود"
posted = "2006-04-11"
text = "اولا ياجماعة انا بحب اشكر اخونا مصطفى محمود على الاغنى الجميلة اللى هو بيعملها لانه خلى الواحد فعلا بعد ماكان بيقول ان مفيش اناشيد او اغنى دينية كويسة انه يرجع ويقول لأ انه فعلا فيه حاجات كويسة ممكن نسمعها وتغير وجهة نظر الواحد فيها.<br />ثانيا ياجماعة ياريت نحط ادينا على نقطةالموضوع احنا مش هنخش في تفاصيل كتير بس انا عاوز اسال كل واحد بالله عليك بينك وبين نفسك الفرق عارف في ايه ولة لأ<br />واذا مكنتش عارف اقلك ان الفرق موجود في الكلمات طبعا كلمات مصطفى محمودمعانيها اسمى بكتر من الكلام الفارغ اللي انتو بتسمعهوه<br />ثالثا الناس اللى بتكلم في الفاضى ياريت تتكلم على حد ينفع يتكلموا عليه او يجرحوا فيه وميتكلموش ع الناس المحترمة واحسنلهم يروحوا يتكلموا ويواجهوا نانسي وهيفاء<br />رابعا كلمة الى اخى مصطفى محمود:<br />بقلك يامصطفى بالمصري كده نفض لكلام الناس اللي بيتقال وانت صح وشد حيلك وربنا يوفقك ويخليك ترفع من شان الاغنية الاسلامية<br />والسلام عليكم ورحة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

