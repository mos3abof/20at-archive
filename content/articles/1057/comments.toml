subject = "السلام عليكم ورحمة الله وبركاته"
author = "مصطفى محمود"
posted = "2006-04-07"
text = "السلام عليكم ورحمة الله وبركاته<br />انا مبدئيا مش هاتناقش فى الموضوع لأن براء أظن عارف رأيي فيه كويس<br />بس أنا ليه تعليق وطلب واحد<br />يا جماعة اتقوا الله وانتوا بتتكلموا عن ناس بعينها<br />لأن واضح إن مسألة التجريح فى المسلمين<br />بمنتهى سوء الأدب أصبح سهل على كتير من الناس وبيستحلوها<br />أنا بانصحكم بإن ده حرام أما أنافمش هاسامح أبدا حد أهاننى أنا شخصيا<br />فأنا بأرحب بأى إختلاف معايا فى وجهة النظر فنيا أو دينيا أو بأى شكل<br />إنما سوء الأدب فأكرر إنى لن أسمح بيه ولن أسامح فيه أبدا<br />مصطفى محمود"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

[[comments]]
