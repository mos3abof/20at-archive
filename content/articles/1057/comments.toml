[[comments]]
order = 33
subject = "محـــدش يعيـــــــش في الدووور"
author = "كريم امام"
posted = "2006-04-06"
text = "عايز اشكر البراء ياجماعة علي أنة فتح الموضوع المثير دة وديما احنا متعودين منة علي التخبيط في الحيــلل كدة وبيحط ايدة علي (نقطة الموضوع)زي مقال اللمبي وعلي فكرة انا بستخدم النت من زمان مفيش مرة فكرت اكتب مشاركة ودي اول مرة اشارك برأي في موضوع علي النت لاني شيفة مهم جداً .<br />بتتكلم علي الوضع الحالي بتاع الفن الاسلامي يا البراء بس انا عايز ارجع ورا شويه بالزمن أيام الحرب الباردة في السبعينات والثمانينات وأوائل التسعينات وكان ساعتها العالم مقسوم نصين وفي صراع ايدولوجيات وأفكار(حلوة ايدولوجيات دي؟...لسة عارفها امبارح)المهم وكانت الفكرة الإسلامية لسه في المهد ولسه لم تنضج يعني في المراحل الأولي وكان علشان الإسلاميين يميزوا نفسهم وسط الدووشة دي كان بيقوللك علي كل حاجة إسلامي تمر هندي إسلامي ودرة وفشار إسلامي كان لازم كده في المرحلة دي برضو مننساش ان مؤيدي الفكرة كان عددهم قليل جداً وكان الناس(عامة الشعب يعني) مش فاهمين الاسلامين عايزين اية بالظبط وكان الاسلاميين علي الطرف الاخر حاسيين بالعزلة عن المجتمع وكانو ببغنوا \" غربــــــاء \" ويسموا اولدهم\" البـــراء\"( واخــد لـي بالك معايا ) علشان أسماء إسلامية بمعني أخر مفيش نوع من الانسجام مع المجتمع ومع الإنسانية كلها وكان بيعيشك واحد تاني مش انت وكان بيحطك في صراع مريض مع نفسك بين فلان الانسان(الي عايز ياكل ويشرب ويقضيها )وبين فلان نفسة الاخ بتاع الاخوان والدليل علي كلامي دة عايزك لو وقعت علي عددين او ثلاثه من مجلة الدعوة او المنار) الي اتمنعو الي كان بيصدرها الإخوان المسلمين باعتبارهم اوسع الجماعات الاسلامية انتشارا واعتدالا ً(هما الي بقولو واللة) هتحس لما تقراء ان المجلة دي كان الي بيصدرها طالبان مش الاخوان وعايزك بقي تبص علي المجلات الي طلبة الاخوان بينشروها في الجامعة ويبعوها في الكليات وهما بيغنوا \"قلب كبير\" ولم تعد الفكرة الاسلامية مسغربة او غريبة عن الناس بعد عمرو ..........خالد طبعا مش دياب وسامي يوسف والذي منة.<br />علشان كدة مينفعش نفصل حركة الفن الاسلامي عن التاريخ الثقافي والأجتماعي والسياسي العام الي كانت بتمر بية المنطقة كلها الي عايز اقولو ان الدنيا بتتغير والأسلامينن بتغيروا وبقوا واقعيين اكثر من الاول.(افتكر كدة حملة الانتخبات الي فاتت واسلوب الدعاية الحديثة وكمان واخد بالك معايا من الحركة الي عملها الدكتور عبد المنعم ابو الفتوح عضو مكتب الارشاد في جماعة الاخوان لما زار الاديب العالمي نجيب محفوظ في بيته ) مش بقولوكو بيتغيروا.<br />انا لا أعطي مبررات للموضوع دة (قصدي اطلاق وصف اسلامي علي كل حاجة عمال علي بطال) لأني برفضوا تماما برفض تقسيم الاشياء عموما الي اسلامي وغير اسلامي مش الفن بس او الاغاني لأ كل حاجة تربية واقتصاد وسياسة ولكن بحب اقول هادف مش هادف مفيد مش مفيد نافع غير نافع حتي لو كان الهدف هو التسلة والامتاع يعني بالمفهوم دة انا اقدر اقول علي مسلسلات محمد صبحي ومسرحياتة اسلاميةوعروض دار الاوبرا اسلامية وموقع عشرينات اسلامي (هوديكو لاظوغلي) وفيلم القلب الشجاع بتاع ميل جيبسون برضو اسلامي!!! (بالعند) بس الرأي دة مكنش ينفع يتقال قبل كدة لان الظروف مش هتسمح بدة وحركة زي الي عملها الدكتور ابو الفتوح لو كان عملها من عشر سنين كان الاسلاميين هـيغـزووو ويعــلّموا علية (اذا كان دلوقتي اتبرّوو من عملتو دي وبيقولو علية انة ديما في حجات كدة بيطلع فيها وبعملها من دماغو وميخدش راي الجماعة.. والبركة.. وسمع وطاعة.. ووحدة صف ..وتجرد.. وبيعة.. واخلاص نية..وربع لنشون وبجنية مخلل وحجات كدة تانية كتير بيقولو عليها مش فاهم منها حاجة)<br />وحاجة عايز أوضحها لازم أكون حريص علي تقييم المنتج الفني من منظور الفن كفن وهل هو علي المستوي ولا لأ ومش معنا إني بقدم حاجة هادفة إني مهتمش بالعناصر الفنية الاخري من جودة صوت والأخراج نقاء صورة .....الخ وعجابني جدا سامي يوسف لما طلع مع احمد منصور في بلا حدود علي قناةالجزيرة 8/3 الي فات وقال بالحرف \"أعتقد أن هناك فراغا بين الفن الملتزم والراقي لأنني مسلم وأعتبر نفسي من العالم العربي والإسلامي، فنحن في الحقيقة نفتقر إلي أعمال فنية منتَجة وفقا لمعايير عالية وسامية\" ودا معناة انه فاهم كويس هو بيعمل اية ولما سألة احمد منصور عن \" الجمهور الذي تستهدفه؟\" سامي قال بالحرف \" الجمهور الذي أستهدفه هو الإنسانية جمعاء، الإنسانية برمتها ليس فقط المسلمين \"<br />واقرا كمان معاية أي هو هدف سامي يوسف الي قالو في الحلقة دي \" من وجهة نظر فنية إحدى طموحاتي أن أقدم مقطوعات سيمفونية وأن تكون معزوفة بأوركسترا لكن من حيث مهمتي ورسالتي أنا أريد لموسيقاي أن تُسمع من قِبل الإنسانية جمعاء، ثانيا أريد أن أكسر الهُوَّة، أريد أن أكون جزءا من بناء صناعة موسيقية إسلامية لها علاقة بالتسلية والترويح ولكن أيضا مع التثقيف والتربية كما سماها البعض مزيجا بين التعليم والترويح والتسلية\"<br />يعني الراجل بيخاطب البشرية كلها مش المسلمين بس او الاسلاميين بس او المصريين بس وعلشان كدة مبيعات البومة كسرت المليون في انحاء العالم في حين لو فرقة\"اللمبةالقلاووظ\"الاسلامية لو عبت شرط (بدون دف) وباعتو في معرض الكتاب ووزع خمس ست الاف نسخة (هيبوسوو ايدهم شعر ودقن)وانا برضو يا بشر في الاناشيد دي ممن ايام \"الورده الحمراء \"والبيضا\"لغايه دلوقتي زي ( هبهوب) الي مشارك اول واحد<br />اخر حاجة عايز اقولها للناس الي كاتبين فوقية ماعدا (مصري ) لوسمحتو لو سمحتوا لو سمحتوا محدش يعيش في الدووووووور علشان كلنا بصلاعـنبـي كدة بنحب اللمي وهنيدي وبنشوف مزيكا وميلودي ورتانا سينما من الاخر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

