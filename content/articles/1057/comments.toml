order = 0
subject = "مووووووووضوعي يا بشر"
author = "هبابه او هوبه او هبهوب"
posted = "2006-03-28"
text = "بص يا باشا النشيد دا فن سامي جدا جدا<br />ممكن يتقلب لاغنيه زي انشوده اصلي لربي<br />او ها قد رحلتي<br />او الايقاع يبقي سريع<br />بس الاناشيد ساعات تتسخدم في حاجات تانيه<br />زي ايه دعوه مثلا<br />\" زنبيكا\" يوسف اسلام او سامي يوسف<br />ولون انا مبحبش سامي اوي بيحسسني انه اول واحد ينشد وبستهبل كل وحد يفتكر طالما سمع لسامي يبقي خلاص مع ان الراجل كويس برده<br />او للغرب زي فرقه\" native deen'<br />بصو يا بشر انا في الاناشيد دي ممن ايام<br />\"الورده الحمراء \"والبيضا\"لغايه دلوقتي<br />بت يا هند<br />نعم<br />شغلي 50 سنت."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

[[comments]]
order = 1
subject = "موضوع حلوووووووووو"
author = "كـــ( الخير )ـود"
posted = "2006-03-28"
text = "بسم الله ما شاء الله ، تساؤل في محله جدا و منطقي و بيشغلني بضراوة..<br />أنا عن نفسي ما عنديش مشكلة تسموه نشيد أو تسموه أغنية ..<br />أنا كل مشكلتي لما المسميات دي انهارت.. على أي أساس نقدر نحدد اللي نسمعه و اللي ما نسمعوش؟!!<br />انا عن نفسي بأسمع الأغاني اللي انتوا حاطينها دي و بأحبها جدا و مش شايف فيها أي مشكلة لا شعرية و لا غيره..<br />أنا أقصد الأغاني التانية ، اللي مش بتتكلم في معاني سامية ما عليهاش شبهة زي (حب الله ، أو الرسول أو حب الوطن أو حب الحياة الخ ...) ، الأغاني اللي بتتكلم في (سبتيني و هجرتيني ، و حبك من أول نظرة و الذي منه)<br />في نظري ده تساؤل مهم و محيرني شويتين!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131613/http://www.20at.com/article2.php?sid=632"

