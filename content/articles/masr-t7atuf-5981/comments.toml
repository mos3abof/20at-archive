author = "حسام البدراوى"
posted = "2007-05-24"
text = "بغض النظر عن ان فريدة كانت صديقة انيس منصور من عدمه لكن المطلوب من المقال ايه ؟ ان احنا نلعن ابو الثورة ورجالتها الحرامية اللى سرقوا العقد بتاع الملكة يا حررررررام هيا يعنى الثورة كانت قامت علشان العقد … عيب جدا نختصر جزء من تاريخ مصر بحسناته وسيئاته بحكاية العقد دى وعموما انيس منصور هو رجل كل الأزمنه لو عبدالناصر كان عايش كان هايقول فيه أشعار لكن هل يقدر حاليا انيس منصور يقول اى كلمة على مبارك او أى مسئول فى الدولة ؟ طبعا لاء مع انهم سرقوا البلد كلها وياريتها كانت جات على محل جواهرجى مش عقد بس كانت هانت"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809142347/http://www.20at.com:80/masr/t7atuf/5981.html"

[[comments]]
order = 2
subject = ""
author = "المصري الغريب"
posted = "2007-05-24"
text = "انت عاوز تفهم مين ان الملكة فريدة كانت صاحبتك، على غرار اصدقاء هيكل ، المهم هي كانت صاحبتك امتى ياسيدي قبل الثورة 0ولا بعد ما الثورة قامت وبقيت انت انيس منصور 0المهم الثورة اللي لما تكون ثورة حرامية تكون ثورة عبد الناصر بكل تجاوزاتها ولكن اذا كانت الثوره كويسة تبقى ثورة السادات 0 طبعا عارف حكاية الحمام التركي لما ولع والناس اللي ماتوا والناس اللي لم يموتو ( واللي اختشوا ماتوا ) طبعا السن له حكم والاخ انيس بينسى المقالات الغزيرة اللي كان بيكتبها في عهد النظام الثوري والمديح والمرثية اللى كتبها في موت الزعيم عبد الناصر كأن الدنيا وقفت وكل دة موجود للاسف في الجرايد اللي موجودة في دار الكتب موثقة ولا الاخ انيس ان احنا شعب من غير ذاكرة 0 يأخي كفاية كدة عيب خليك في رحلاتك الوهمية وعفاريتك اللى محدش شافها غيرك 0 المهم انا عاوز من الاخ انيس شئ واحد يقول لنا مين بنت رجل الثوره بتاعة العقد واية كانت علاقتة برجل الثورة اثناء الحكم 0 وعجبي عليك يازمن فيك … صحفي !!!!!"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809142347/http://www.20at.com:80/masr/t7atuf/5981.html"

