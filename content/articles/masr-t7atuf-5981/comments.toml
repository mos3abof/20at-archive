subject = ""
author = "نور"
posted = "2008-08-02"
text = "أنا احب الملكه فريده كثير وبموت فيها اشوف فيها شخصية المرأه القويه اللي صبرت وتحملت الظلم في السرايات وانا ما عندي ادنى شك انها كانت بتحب الملك فاروق لانه هو كمان كان بيحبها كتير بس الظروف ماسمحت لهم انا حبهم يدوم لانها ما جابت ولي العهد والسبب ادى اللى الطلاق على الرغم من الطلاق الا ان الملكه فريده ندمت على طلاقها من الملك فاروق وانا بحبها كتير كتير كتير و يمكن يكون الملك فاروق ظلمها بس مش اكيد المهم انا اعتبر الملكه فريده قدوه لي … الله يرحمها ويغمد روحها الجنه …"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809142347/http://www.20at.com:80/masr/t7atuf/5981.html"

