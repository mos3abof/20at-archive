posted = "2008-11-29"
text = "دعك من عقد الملكة فريدة واقول لك شئ اخر ان مجوهرات الاميرة فوزية والتى اهدها لها زوجها شاه ايران اخذها رجال الثورة وبمعنى اصح سرقت وهل كانت هى الاخرى ملك شعب مصر لتستولى عليها الثورة واين ذهبت هذه المجواهرات واين الباقى فاذا وجد المدافعون عن جمال عبد الناصر الاجابة فليقول مع العلم ان مجوهرات الاسكندرية مزورة<br />ولكن الصورة بالفعل للاميرة فوزية"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809142347/http://www.20at.com:80/masr/t7atuf/5981.html"

