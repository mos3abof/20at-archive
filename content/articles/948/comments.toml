[[comments]]
order = 2
subject = "اخيراً"
author = "ديمة"
posted = "2006-03-14"
text = "الاستاذ عاطف اخيراً كتب لنا عن تفاصيل لا نراها ولكن نعيش الامها وافراحها، ياريت تركز فى مثل هذه الموضوعات وتنقل لنا صور لا نستطيع الاقتربا منها، احكى لنا عن كيف يلعب الاطفال على ابواب المدن المحاصرة ، احكى لنا عن عرب الدالخ وقصص السباب هناك.. حكى معنا خى عاطف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125425/http://www.20at.com/article2.php?sid=561"

[[comments]]
order = 3
subject = "ولا يهمك"
author = "عاطف دغلس"
posted = "2006-03-14"
text = "ان شاء الله قريبا، راح اتناول كل المواضيع التي يعيشها الفلسطينيون واقعا محتوما، احنا في عشرينات هدفنا نقرب الناس من الواقع اكثر فاكثر، بعد اذن عشرينات طبعا. سنحكي للعالم عن فلسطين، سنرسم المستقبل بواقعية أكثر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125425/http://www.20at.com/article2.php?sid=561"

