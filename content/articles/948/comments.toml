[[comments]]
order = 5
subject = "الله بعين"
author = "جذور"
posted = "2006-03-15"
text = "الله ينتقم من اليهود دول، والله لسا الوضع بفلسطين بيزداد سوء، ولسه العرب نايمين، شا شعوب العرب، لو كان اللي بيحصل في فلسطين ده بيحصل في الاردن ولا في مصر، هل تعتقدوا أن الفلسطينيين كانوا هيسكتوا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125425/http://www.20at.com/article2.php?sid=561"

[[comments]]
order = 6
subject = "للك الله يا فلسطين"
author = "نيفين"
posted = "2006-03-15"
text = "و الله يا جماعه فلسطين دى هتفضل جرح ف القلب العربى لا يطيب<br />و الله ربنا يكون فى عونهم دا الواحد لما المرور بيتعطل بيه شويه بيبقى هيشد ف شعره<br />تخيلو معايا يا جماعه لو عندكو امتحان و ضاع عليكو<br />بلاش دى لو معاكو مريض و بيموت<br />يا خبر<br />دى الناس دى مستحمله<br />ربنا معاهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125425/http://www.20at.com/article2.php?sid=561"

[[comments]]
order = 7
subject = "المقا له ابسط من الواقع"
author = "ابو خالد"
posted = "2006-06-28"
text = "اعتقد ان ما ذكره الاخ عاطف نموذج مبسط لما تعانيه معلمه اي تقارب تقطع حاجزين عاى الاقل يوميالكي تعلم ابنائنا في القرى المجاورة لنابلس وتكسب رزقها المؤجل حاليا الى---- مع احترامي لللاخ عاطف ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125425/http://www.20at.com/article2.php?sid=561"
