posted = "2009-12-21"
text = "والله كل قاعدة وليها شواذ<br />يعنى الستات اللي بيسوقو فية منهم بيسوق حلو وفية منهم بيسوق وحش<br />ونفس النظام عند الرجالة<br />فى منهم بيسوق كويس وفي منهم عندهم حالة<br />اللي يفقع مرارتك بقى سواقين التاكسي اللى دايما يقولو فى الطريق السواقة دي مش ليكو<br />خلى اخوكى يسوق بدالك ولا ابوكى ولا جوزك واقعدى انتى فى البيت<br />بجد يفقعو المرارة"
