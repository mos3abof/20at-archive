text = "اذا كانت الستات سواقتهم وحشة .. ومسببين كل الصداع دة في الشارع بسواقتهم .. تقدر تقولي ليه أغلب حوادث الطرق سببها رجالة سايقين ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ ؟؟<br />صدقني والله الموضوع مش موضوع ان واحدة قدامك كانت بتتكلم في التليفون وهي سايقة بلا مبالاة .. الموضوع كله بالنسبالك انها واحدة ست اللي سايقة … لو كان راجل اللي قدامك وعمل كدة والله ماكنت استعنيت حتى تكتب توبيك عنه …<br />بس أقول ايه .. المشكلة عند أي راجل بيسوق هي \"فرسته\" من ان بقى في بنات كتير بيسوقوا زيه بالظبط … الرجالة دول معقدين والله !!!!!!!!<br />الموضوع مالوش دعوة براجل أو ست .. في حد بيسوق كويس و حد بيسوق وحش .. في حد تعبان في تمن العربية و خايف عليها وحد بابي ولا مامي جايبله العربية وماشي في الشارع طايح في الناس و كانه نزل من بطن أمه سواق !!!!!!!!!"
