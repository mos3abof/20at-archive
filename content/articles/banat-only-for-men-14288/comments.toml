text = "ياجماعه انا عندي مامتي راكبه عربيه 128 و طبعا عارفين انها حديد في حديد .. العربيه بتتسمكر و تترش كل شهرين عشان زي ما بتقول العواميد محطوطه غلط و العربيات ب تحدف عليها كل حاجه غلط ماعدا هيه<br />و دا راي كل الستات اللي بيسوقو<br />بس مش غلطتهم غلطة اللي بيجبلهم الرخصه و يسبهم يتعلمو على الناس<br />صحيح ماما فكرت انها تجيب عربيه جديده لنفسها و طبعا كلنا قفشنا عليها عشان ده خراب بيوت"
