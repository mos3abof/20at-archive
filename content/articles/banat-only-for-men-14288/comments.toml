text = "بجد انتى بت جدعه يامنى وعجبتينى جدااا هى دى البنات اللى تنفع فالزمن ده<br />انا اتعرضت لنفس موقفك بس مش انا لا ماما وكنت راكبه معاها وف شارع مصر والسودان عربيتين زنقو علينا جامد واحنا اتحشرنا فالنص ومثلا بقى المفروض يعدو لا دول وقفوا ورخمو طبعا احنا ضربنا فرامل واحد حيوان منهم بيقولو ليه كده ياعم عديها دى ست يعنى غبيه ولا ليها ف ام السواقه شكل العربيتين مظبتين مع بعض طبعا احنا اتجننا وبطلنا العربيه ووقفنا والاستاذ جاى يبلطج علينا فاكرنا هنكش ونخاف كده<br />حلفنا مانمشى الا لما يجى البوليس والناس تتحايل وماما ابدا والتانى يعتذر وماما ابداا وانا بقى دقرمه اول ماشتم اتصلت ب بابا وهو عقيد فى الشرطه دققتين وكان قدامنا عربيه محترمه من البوليس وعملنا محضر وطبعا عشان بابا وكده اتظبطو ف القسم وخدو التمااااام"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224135511/http://www.20at.com:80/banat/only-for-men/14288--qq.html"

