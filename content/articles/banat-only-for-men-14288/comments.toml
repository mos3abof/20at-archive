subject = ""
author = "منى"
posted = "2009-12-23"
text = "ياعم انا اتخنقت منكم<br />انا ولله الحمد بسوق من اولى اعدادي ولله الحمد ميكانيكية شاطرة وافك الكاوتش ولا الحوجة ليكم انا زي زيك ربنا ممايزكش عني بايدج ولا رجل<br />اما الشلل بعينه انكم بلطجيه احنا عمر مافي ست تبلطج احنا بنخاف ع عربيتنا زي جزمنا بالضبط لو الجزمة بتعمر في رجل البنت تبقى العربية زيها انا بقى الحمد لله جزمي بتعمر<br />اوسخ موقف شفته واحد قد والدي الشارع اتجاهين في الدقي وعربيات ركنة انتظرت اللي خارجين وضربت كلاكس ورعشت للجاي علشان ينتظر<br />البيه راكن واول ماشافني حبك يطلع قلت له لا انا هاعدي ومش هاتحرك قل ادبه قلت له مش نازلة هات البوليس قال الشارع اتجاه واحد انت غلط قلت له البوليس وماتقلش ادبك طابور وقف وحلفت ما امشي الا لما اخد حقي ووقفت العربيه واعلى مافي خلهم يركبوه<br />نزل اعتذر بعد 20 دقيقة واقفة والناس يهديك يرضيكي انا ماغلطتش وماشتمتش يعتذر افكر ابعد لا والله البوليس ياغجر<br />اعتذر وركنت ع جنب وعدى رد يامحترمين يبتوع الغرز وقال ايه فالح شوف احصائية حوادث الرجال والنساء<br />القاعده المهمه حرص من خطا الاخرين حتى لو ماشي صح انتبه مش كل اللي بيسوق بيفهم"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224135511/http://www.20at.com:80/banat/only-for-men/14288--qq.html"

