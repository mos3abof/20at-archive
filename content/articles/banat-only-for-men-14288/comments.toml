author = "مسلمة مصرية"
posted = "2009-12-28"
text = "اه و بالنسبة لموضوع بهدلة العربية برده دى كمان ملهاش دعوة براجل او ست مثلا عربيتى قبل ما اركبها كان اخويا بيركبها قبل ما يجيب عربية تانية كان مبهدلها على الاخر و تقريبا بوظ الفتيس بشكل جزئى و بعد اما اخدتها قعدت كم شهر فى مشاوير عند الميكانيكى لحد ما اظبطت المشاكل دى خصوصا اما تبقى العربية قديمة محتاجة عناية اكبر<br />بهدلة العربية دى ليها علاقة بثلاتة حاجات<br />اولا: صاحب العربية تعبان فى تمنها و لا ايه فاهمنى طبعا<br />ثانيا: عنده سينس او احساس بميكانيكا العربية اللى راكبها<br />ثالثا: انه هو شخص بيحافظ على الحاجة و لا مهمل بطبيعته"
archived = "2010-01-25"
capture_url = "https://web.archive.org/web/20100125065746/http://www.20at.com:80/banat/only-for-men/14288--qq.html"

[[comments]]
