text = "اذا كانت سواقة الستات وحشه فسواقة الرجال اوحش..جميع الحوادث التي يقع فيها اموات يكونوا السواقين رجال<br />و ثانيا سبب المشاكل ان في ناس بتغلس على الست و هي سايقه و لو كان راجل ما بتغلسش عليه كده ، و اتذكر مره كانت والدتي تقود سيارتها في طريق اتجاهين و جاء اتوبيس في الإتجاه المقابل و عندما وجد ان قائد السياره إمرأه ..ترك طريقه الصحيح و دخل ف الإتجاه المعاكس عشان يزنق على سيارة والدتي و كانت حركه واضحه وضوح الشمس و ما استفزني اكثر ان البجح يكلمها كلمتين كانها هي المخطئة و مش عارفه تمشي صح"
