[[comments]]
order = 8
subject = ""
author = "Marian"
posted = "2009-12-21"
text = "طيب وايه رايك في اللي تدخل شارع اتجاة واحد وتلاقي قدمها راجل جه غلط ويزعق فيها على سواقة الحريم؟يبقى حقها تفتح دماغة بمفتاح العجل ولا لأ؟<br />وايه رايك في اللي شامم في عز الضهر ويخبط العربية من ورا وانا باعدي تقاطع و لما اكلمة يقولي انا معملتش حاجة<br />و التاكسجي اللي مبيحترمش اي حد ولا اي حاجة ويكسر عليك من اقصى الشمال لاقصى اليمين عشان عينية لمحت زبون؟<br />وايه رايك كمان في الواد الروش اللي يعمل نفسة هياخد غرزة محصلتش في تاريخ اللي بيسوقوا على وجه الارض من قدامي والنتيجة انه طيرلي وش العربية؟<br />وايه رايك في الرجاله الي ربنا بينزل عليهم هدوء الأعصاب كله الساعة 9 اصبح والواحد متاخر على الشغل وتلاقي بطة بلدي ماشية قدامك بيسوق على اقل من مهله،ولو عملت كلاكس يشوحلك ويقولك هي الدنيا طارت؟<br />بلاش ده كله امبارح رايحة شغلى ولازم اعدي علي شارع جانبي الاقى عربية راكنه في نص الشارع وسط عربيتين ولما عملت كلاكسات والشارع كله صحي جة واحد بمنتهى هدوء الاعصاب فتح العربية ورجع بيها لورا<br />مبنكرش ان فيه ستات كتيرة مستهترة بالسواقة وبتكسل تركز بس بصراحة فيه رجالة تفقع المرارة وتشل"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224135511/http://www.20at.com:80/banat/only-for-men/14288--qq.html"

