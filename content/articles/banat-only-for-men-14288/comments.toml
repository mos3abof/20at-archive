text = "بجد الرجاله معقدين ومكلعكين وكل واحد بقى فيه كولكيعه ااااااااااااااا د كده ياترى بئى كل الرجاله بتسوق كويس وبريمو ع الاسفلت يموتوا ويتحرقوا جدا من اى واحده ست بتعمل اى حاجه فى اى حاجه<br />لو بشتغل وشاطره ف شغلها يركبو 60عفريت ويتجنن ويقول ان القران قال علينا ناقصات عقل ودين وبردو القران قال محدش كامل والكمال لله وحده زى ماانتو مش بريمو ف كل حاجه احنا كمان مش بريمو يبقى متتقتصروش السواقه ع الرجاله بس<br />هما حاسين اننا هنتفوق عليهم او ع الاقل هنبقهم زيهم ف المهااراتيطلعو فينا القطط الفاطسانه دول بهايم دول ملهمش غير ف قعده البيت والرغى ف التليفون سوورى طولت عليكو بس بجد تصرفاتهم تفقع المراره والعين"
