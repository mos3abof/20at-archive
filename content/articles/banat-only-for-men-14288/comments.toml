posted = "2009-12-28"
text = "على فكرة انا واحدة ست و باسوق سايت 133 كمان بس متقلقوش عكس المتوقع مبمشيش سحلفاة بامشى بسرعة الطريق<br />الموضوع ملوش دعوة براجل و لا ست الموضوع زى ما قالت لبنى بان مين اللى بياخد الرخصة و معظم الستات زى ما قال محمد جلال فعلا في مصر عندهم عيب التردد فى اتخاذ القرار تدخل يمين و لا شمال و عندهم عيب فى تقديرهم للمسافات مش عارفة اذا كانت عربيتها تعدى و لا متجييش و لنفس السبب مبيعرفوش يركنوا قليل فعلا من الستات اللى بتعرف تسوق بجد دى حقيقة بس ارجع و اقول بالرغم ان الستات فيهم العيوب دى كلها معظهم بيدى اشارة و نادر اما بيكسروا على حد و بيحترموا الاشارات يمين و شمال و تعديك لو فى فرصة غير الرجالة معظمهم مبيديش اشارات و بيعمل نفسه مش شايف الاشارة يمين او شمال و يكسر مرة واحدة كان الشارع بتاع اللى خلفوه بدون اى سابق انذار و هو نفسه مبيعديش حد من قدامه حتى لو مدى اشارة و داخل شوية بشوية فالملخص ان الموضوع ملوش دعوة بسواقة الستات انما مين اللى معاه رخصة السواقة و عدى اختبار القيادة و مين اللى بيحترم قواعد المرور لانه فعلا زى ما قالوها القيادة فن و ذوق"
archived = "2010-01-25"
capture_url = "https://web.archive.org/web/20100125065746/http://www.20at.com:80/banat/only-for-men/14288--qq.html"

