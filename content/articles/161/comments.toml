[[comments]]
order = 7
subject = "معذرة ولكن هذا رأيى"
text = "السلام عليكم ورحمة الله<br />سوف أغض الطرف فى تعليقى عن أسلوب الأخت الكاتبةالتى من الواضح أنها حديثة عهد فى هذا المجال .(هذا ما استشعرته من الموضوع)<br />ولكن ماأثارنى أن كاثرين التى أطلت لنا من بين السطور نموذج ردىء لشخصية أوربية وكل مافى الأمر أن المذكورين فى المقال أنبهروا بها لكونها فقط أوربية (كما أوضحت الأستاذة كاتبة المقال فى بدايته)<br />كما أننا لا ينبغى أن نتخذ منها مثال أو نموذج للنجاح العملى وتحقيق الطموح لأنها أقل من ذلك<br />بيد أن أضمحلال الهوية والهدف وعدم وضوحهما قد يؤدى بالبعض الى الأنبهار بأى نموذج"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814010149/http://www.20at.com:80/article.php?sid=377"

