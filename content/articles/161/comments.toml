[[comments]]
order = 3
subject = "بيرو"
text = "فعلا الموضوع جميل جدا ويستحق الاشادة ومفيش اختلاف علي موهبة الكاتبة (اللهم لاحسد) بس هو فيه رأي صغير قوي عندي وموش هطول فيه....طبعا جميل اننا نحب العلم ونسعي اننا نتعلمه ..وجميل كمان اننا نقتدي بالغرب في حبهم للعلم وسعيهم ورائه ..بس يا تري أي علم اللي المفروض نسعي وراه...يمكن اعتراضي بس علي بعض النماذج اللي بنظن انها خارقة للعادة زي الاخت المذكورة لكن الحقيقة ان النماذج دي لا تستفيد بعلمها ده ابدا باختصار بتفضل تدور في ساقية العلم من غير هدف والناس اللي بالشكل ده موش ممكن يوم يقفوا ويقولوا كفاية لحد كدة علينا علم ويالا نشتغل بقة...حد شاف فيلم فورست جمب ....الموضوع قريب منه"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814010149/http://www.20at.com:80/article.php?sid=377"

