[[comments]]
order = 1
subject = "رااااائع"
text = "ماشاء الله موضوع رائع ، ليت شبابنا، بينه وبين نفسه يعقد مثل هذه المقارنة، فالحضارة الاسلامية بدات و علا صيتها بالتحضر و قيم مثل الاخلاص فى العمل و الدأب للوصول الى الحقائق العلمية، و بالفعل استفاد منا العالم كله عندما كان يغوص فى ظلام كاحل، اما اليوم فليتنا حتى استطعنا ان نقلد هذا الغرب عندما اخذ منا حضارتنا و علمنا، ولكننا للأسف لم نقلده سوي فى تلك القشور الضعيفة، وكأننا لم نأخذ من الأكلة كلها سوى الريم، الذي يعلم الطباخ الماهر ان عليه ان يتخلص منه قبل أن يبدأ فى تقديم و تناول الوجبة"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814010149/http://www.20at.com:80/article.php?sid=377"

