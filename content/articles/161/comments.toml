[[comments]]
order = 5
subject = "أنا شوفت فورست جامب"
text = "أولاً هو فيلمي المفضل.. وأرى إن كاترين تقترب من شخصية فورست جامب في أحيان كثيرة، منها فكرة التحصيل، وفكرة الإصرار بعيداً عن كلام الناس وأعينهم وتعليقاتهم، إلا أن كل من فورست جامب وكاثرين هدف في الحياة وإلا لما كان لديهم هذا الإصرار في تحصيل العلم..<br />أما فكرة استخدام العلم في إفادة الناس، فهذا متحقق ايضاً بالنسبة لكاثرين، التي تفيد الناس عبر عملها كممرضة تقوم بتحصيل بعض العلوم من أجل تحقيق ذاتها، فهدف تحقيق الذات (رغم أنه ذاتي) إلا أنه هدف سامٍ..<br />ولا تنسى أنها تحقق نفسها اجتماعياً من خلال عمل التمريض الذي يعد عملاً إنسانياً عظيماً في أي دولة في العالم.. عدا في دولنا المبجلة<br />أما فورست جامب فقد قام بالجري حتى الثمالة كما يقولون، ورغم هدفه أنه كان يحب الجري إلا أنه استغل الجري في خدمة قضايا سياسية (رغم أنه لم يعلن عن ذلك).. كما أن خدمته في الجيش كانت لهدف (الأمريكان يعتقدون أنه إنساني)..<br />ما أقصده أن كل من كاثرين وجامب نموذج يحتذى به بالنسبة لحال الشباب حالياً.. رغم أننا في الحقيقة لا يجب أن نحتاج نماذج، فتاريخنا وديننا يكفينا .. والسلام ختام"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814010149/http://www.20at.com:80/article.php?sid=377"

