[[comments]]
order = 23
subject = "من الجزائر المجاهدة"
text = "الى ارض العراق وبالضبط الفلوجة الصامدة في وجه الكفرة الخنازير من حثالة الارض(الامركان) لا تدعو اليأس يسيطر عليكم فوالله انهم يحبون الحياة والعراقيون يحبون الموت في سبيل الله فكم عاشت فرنسا في ارضنا واندحرت في سبعة اعوام وكانت من اقوى القوى والله انهم جبناء فاذبحوا منهم ما استطعتم حتى يندحروا من ارض الخلفاء وكذا بالنسبة لليهود<br />اخوكم شياح فارس"
archived = "2005-01-01"
capture_url = "https://web.archive.org/web/20050101085422/http://www.20at.com:80/article.php?sid=354"

[[comments]]
order = 24
subject = "جماعة مكافحة الحاكم المصري الظالم حسني مبارك"
text = "اولا اقول اللهم وفق الاسلام والمسلمين وانصراللهم المجاهدين وفك قيد الاسرى المسلمين اللهم أهدي حكام بلدنا اللهم اجعل بينهم وبين الظلم بعد السماءعن الارض اللهم تقبل مني يارب العالمين<br />يجب على الانسان المسلم ان يكون رحيما لان الاسلامامرنا بذلك الا في حلة شدة الظلم من الكفره"
archived = "2005-01-01"
capture_url = "https://web.archive.org/web/20050101085422/http://www.20at.com:80/article.php?sid=354"

[[comments]]
order = 25
subject = "الاماراتي...99"
text = "انتم جماعه ظاله وانتم الخونه وانتم المفسدين في الارض كل من تسول له نفسه في تدمير وطنه اوقتل اي شخص برئ في وطنه مهما كانت ديانته مسلم او كافر انتم لا تصلحون في البلاد انتم تفسدون وانتم الخونه فويحكم من جماعه ظاله.الاسلام دين يسر وليس دين عسر الاسلام يعلم على اطاعة اولي الامر منكم.انتم تريدون ان تصلحو فصلحو اولادكم وبيوتكم قبل ان تفكروفي ان تصلحو اولي الامرمنكم.فويحكم لكم نار جهنم وبئس المصير. مكامكم من الامارات"
archived = "2005-01-01"
capture_url = "https://web.archive.org/web/20050101085422/http://www.20at.com:80/article.php?sid=354"

