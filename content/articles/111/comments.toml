[[comments]]
order = 17
subject = "سرية الشهيد المجاهد الشيخ أحمد ياسين"
text = "السلام عليكم ورحمة الله وبركاته<br />بيان صادر عن تنظيم القاعدة في جزيرة العرب ومن سرية الشيخ احمد ياسين بالتحديد أننا نهدد ونتوعد ليس فقط في المقالات ولكن على ارض الواقع اننا نهدد ايطاليا الحاقدة على الاسلام والمسلمين ارض الكفره نهددها بضربها بالصميم ونحن المجاهدين نتوعدها اننا سنضربها في شهر 8 سنة 2004 وستكون الضربة موجعة عليهم لانها سوف تسقط الحكم هنالك وسوف تحدث ثورة عارمة وستكون هذه العملية عن روح الاخ المجاهد عبد العزيز القرن رحمه الله وتقبله بين الشهداء وفي جنات النعيم ونحن نقول لليابان بالسياق نفسه اننا قادمون اليكي بعون الله واننا انشاء الله سوف نثائر لكل قطرة دم سالة من أخوتنا وأخواتنا في جميع الاراضي الاسلامية واخيرا انتضرو الرد والسلام سرية الشهيد<br />أحمد ياسين<br />22-7-2004 الخميس"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803041216/http://www.20at.com:80/article.php?sid=354"

