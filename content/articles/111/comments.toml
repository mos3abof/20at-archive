[[comments]]
order = 8
subject = "السلام عليكم"
text = "الكريم جاسر<br />كنت اريد ان اكتب عن هذه الفكرة موضوع خاص ولكن بما انك فتحت الموضوع فممكن نفكر فيه جميعا - اون لاين -<br />افكاري تتلخص في الآتي:<br />1) حرب العراق كانت مأزق كبير لكل الأطراف وبالأخص الشعب العراقي.. هذا الشعب الذي يكره صدام ويكره أمريكا..وهذا نموذج موجود في كل البلاد العربية تقريبا.<br />2) الشعوب اثناء الحرب تقاتل تحت راية تفهمها وتستوعبها وتؤمن بها..وهذا غير متحقق في كل البلدان العربية..لأن الجيوش لحماية الحكام وليس المحكومين.<br />3)اخترع العراق هذا الحل..قاموا بخلع رداء الحاكم - في دولة بنت مجدها علي قهر الناس بالعسكر والجيش- فخلع الناس - أو من يكونون الجيش- الدولة التي هي في تعريفها المنطقي في كل البلاد العربية أوأغلبها ..جمهورية عسكرية غير ديموقراطية محمية من الجيش.<br />4) تمت إعادة صياغة الجيش لحماية الأمة في تنظيمات مقاومة من الشمال والوسط والجنوب ومن السنة ومن الشيعة..أي عاد دور الجيش بعد تفكيكه.<br />5) مايقوم به المقرن في السعودية..هو عدم استعداء الجيش لتفكيكه واستقطاب جيش شعبي..من خلال تنظيمة..فكان لافتا في عملية الخبر الإشارة في كل وكالات الأنباء إلي أن المنفذين كانوا يرتدون زي موحد (أسود).<br />ارجو ان تكون وضحت الفكرة بعض الشئ<br />في أمان الله"
archived = "2004-07-02"
capture_url = "https://web.archive.org/web/20040702053327/http://www.20at.com:80/article.php?sid=354"

[[comments]]
order = 9
subject = "جيل العشرينيات ..!!"
text = "لو كان معسكر البتار موجود منذ القرن الماضي<br />لما وطئت أرضنا قدم أمريكي ولكان لنا هيبة واحترام<br />ولو كان جيل حماس موجود منذ أوائل القرن الماضي ماتجرأ يهودي علىالإقتراب من فلسطين ..<br />الحمدلله الذي حقق وعده \" وإن تتولوا يستبدل قوما غيركم ثم لا يكونوا أمثالكم \" فإني أرى سنة الإستبدال تجري<br />نشهد اليوم جيلا أخر لا يعرف من هي أمريكا أو قوتها أو ترسانتها العسكرية والأستخباراتية<br />جيل الحزام الناسف ، بارك الله هذا الجيل ..<br />جيل في سن العشرينيات تستوي الحياة لدية والموت<br />وفي أحايين كثير يحبون الموت أكثر من الحياة ..!"
archived = "2004-07-02"
capture_url = "https://web.archive.org/web/20040702053327/http://www.20at.com:80/article.php?sid=354"

