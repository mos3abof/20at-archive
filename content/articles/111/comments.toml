text = "ما اسرع انتقام الله ..ايحسبون دينه عبثا يقتلون من يشاؤون باسم الاسلام ..هل كان الرسول يفعل ذلك ..قتل المقرن ومعه زمرته والبقية أتية باذن الله ( ان الله لايصلح عمل المفسدين)"
archived = "2005-01-14"
capture_url = "https://web.archive.org/web/20050114091928/http://www.20at.com:80/article.php?sid=354"

[[comments]]
order = 27
subject = "الله اكبر"
text = "من شياح الى كل من يحب الحياة ان الله جعل لنا الحب في الحياة كبيرة لكن في ضل الاحداث الاخيرة في العراق فان الحياة لا معنى لها الان الكفار يفسدون فيها واني ابارك الجهاد في العراق علىان لا يقتل ابناء الوطن لانهم ابرياء فركزو في ضرباتكم والله لن يضيع خطاكم فكلنا مسلمون واخوة فلا داعي لان تكثر الفتنة في بلد الخلفاء ولو ان للعراق او فلسطين حدود مع الجزائر لكنا من اول المجاهدين في سبيل الله ....اخوكم فارس"
archived = "2005-03-12"
capture_url = "https://web.archive.org/web/20050312091421/http://www.20at.com:80/article.php?sid=354"

[[comments]]
order = 28
subject = "بدري عليكم"
text = "الظاهر انك متأثر بقرندايزر<br />بعدين يا شاطر بري عليك تبث فينا ما سقته لك الاستخبارات المعادية للدين الإسلامي والحكومة السعودية والشعب السعودي الحبيب<br />قال ايش انقسامات وتطرف وحركات جهادية واصلاحية .<br />كلهم ارهبيون وكلهم مجندين من الس آي ايه.<br />وانت اولهم .<br />الله يخلي لنا آل سعود ويطول في اعمارهم ويديم فضله علينا بتطبيق شريعته .<br />ويكفينا شر من فيه شر .<br />محمد الغامدي / 30 عام. سعودي وبكل فخر."
archived = "2005-05-23"
capture_url = "https://web.archive.org/web/20050523082405/http://www.20at.com:80/article.php?sid=354"

[[comments]]
order = 29
subject = "الى المقرن"
text = "هؤلاء-- جماعةمنحرفة<br />والدليل:<br />انهم يضنون انفسهم مجاهدين--- ويستدلون بحديث((اخرجوا المشركين من جزيرة العرب))<br />قال العلماء:<br />((الرسول قال اخرجوا ولم يقل اقتلوا))<br />مما يدل على ان جهادهم باطل-باطل-باطل-باطل-باطل-باطل"
archived = "2005-05-23"
capture_url = "https://web.archive.org/web/20050523082405/http://www.20at.com:80/article.php?sid=354"

[[comments]]
order = 30
subject = "يا ظلمة و يا كفره"
text = "افضل قدوة لنا في الحياه هو رسول الله صلى الله عليه و سلم....فلم يأمر بالقتل او نهب ارواح المسلمين او اهل الذمة....من قتل نفساٍبغير حق فقد دخل النار...انا اشكر حكومتنا السعوديه الجلليله على قضائهازمرة من الفسدة...فوفقكم الله على الفئة الضاله و المدعية بأنها من الجهاد ؟<br />اليوم الذي يقتل فيه فاسد ,هو يوم فرحتي و عيدي..<br />فأجعلوا ايامنا افراح<br />مواطنة سعوديه و النعم"
archived = "2005-05-23"
capture_url = "https://web.archive.org/web/20050523082405/http://www.20at.com:80/article.php?sid=354"

