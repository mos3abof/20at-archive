[[comments]]
order = 21
subject = "المرعب"
text = "اعانكم الله اخوة الجهاد والاستشهاد وسدد الله خطاكم حتى تطهروا لنا ارض الحرمين من الخونة والمارقين اعداء الله والدين وازيالهم من خونة الحرمين الشريفين طواغيت العصر وازيال الامريكان ونتمنى ان نرى العديد من العمليات الاستشهادية الناجحة باذن الله تعالى ونحن نتمنى المشاركة معكم وسبق لنا التدريب العسكرى وخضنا الكثير من العمليات الحربية فى احراش جنوب السودان وقمنا بالقتال ونعرف جيدا كيفية ادارة حرب العصابات ونتمنى ان تتاح لنا الفرصة لننقل لكم تجربتنا فى الجهاد في سبيل الله المكتسبة من ارض السودان ونريكم ماتسر به انفسكم وتفتخرون به وتتثأرون لاخواننا في كونتا نامو وابو غريب فنحن من اوينا المجاهد الشيخ اسامة بن لادن حفظه الله وسدد خطاه .<br />المرعب"
archived = "2005-01-01"
capture_url = "https://web.archive.org/web/20050101085422/http://www.20at.com:80/article.php?sid=354"

