posted = "2006-04-16"
text = "اخوان ولا مش اخوان اللى حصل دا حرام<br />دا ميرضيش ربنا ابدا<br />ازاى بس ازاى ناس جوة دور العبادة بتاعتهم يحصل لهم كدا لية ؟<br />اية ذنبهم ؟ اية ذنب الناس اللى كانت جوة الكنيسة واترعبت<br />انا لو مكانهم مانساش الموقف دا طول عمرى<br />ماتزعلش مارك انت وكل المسيحيين بس اللى حصل دا واللهى مش هو الاسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153825/http://www.20at.com/article2.php?sid=700"

