[[comments]]
order = 26
subject = "خبر ساخن جدا......"
author = "رمضان جورج كوهين"
posted = "2006-04-17"
text = "ياجمعة احب الفت نظركم لحاجة ....<br />مصر طول عمرها احمد على جورج ونستبعد كوهين..<br />والى بيحصل اليومين دول اكبر خطر على الوحدة الوطنية ويثير الفتن ومن الممكن ان يكون النهاية ....<br />كان فى حكاية حصلت امبارح ودى الى لفتت نظرى..<br />امبارح فى العصافرة ليا واحد قاريبى ساكن هناك كان بيتكلم فى الموبايل ومرة واحدة جت طوبة فى الموبايل يدوب خدشته واتضح ان الفاعل واحد من البلطجية الى عملوا الموضوع بتاع امبارح....المهم..(-على فكرة قريبى ده يعمل من كرم جابر 2-3-4 -) قريبى ده مسك البلطجى الى كان فى ايده سكينة ورزعه فى الحيطة وبوم يمين وبوم شمال الواد فرفر ورغم ان الموبايل اتخدش بس الا ان قاريبى ده صمم انه ياخد ثمنه من البلطجى تتخيلو يطلع من جيبه كام؟؟؟؟<br />(والله اكثر من 500 جنيه) ده ما يلفتش نظركم لحاجة؟... يا جماعة ياريت قبل ما نحكم عضلتنا نحكم عقلنا الاول."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153825/http://www.20at.com/article2.php?sid=700"

