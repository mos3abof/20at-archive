text = "اوعا الطاغوت ؟<br />وخلافة من تعليقات مشبوهة كتير جدا جوا الموقع دة ومواقع مشابهة<br />عاوز اقول للشباب مش بس مصر مستهدفة من اليهود والامريكان بنشر الخلاعة ياجماعة انتبهوا انتبهوا<br />نشر التشدد جوا البلد مقصود<br />هوا كدة اللة كارة مصر يخللى البلد نصها فسق ونصهاتشدد وبكدة كلة يضرب فى بعضة<br />عاوز اقول لكل كلب مش عاجبة اللى بيحصل فى البلد لو راجل اعلن عن نفسك وبدل تحريض انتا عاوز المصريين يقعوا فى بعض ودة فى احلامك وبس"
