[[comments]]
order = 24
subject = "ولادك محدش هيخدعهم يا بلد"
author = "واحد"
posted = "2006-04-17"
text = "القاهرة - ا ف ب ، رويترز<br />استقبل النائب العام المصري اليوم الاحد 16-4-2006 في القاهرة وفدا يضم نحو 40 مسيحيا ومسلما من حقوقيين واعضاء تنظيمات نقابية وغير حكومية سلمه دعوى ضد الرئيس المصري حسني مبارك ووزير داخليته حبيب العادلي تحملهما مسؤولية الاعتداءات الاخيرة على ثلاث كنائس في مدينة الاسكندرية.<br />وجمع الوفد اعضاء في منظمات للدفاع عن حقوق الانسان وفي نقابة المحامين وحركة كفاية المعارضة التي اكد منسقها العام جورج اسحاق لوكالة فرانس برس ان \"ما جرى في مدينة الاسكندرية هو غياب للدولة لانها واجهزتها وجهت كل اهتمامها للحفاظ فقط على نظام الحكم الذي يتحمل رئيسه ووزير داخليته مسؤولية ما جرى من اعتداءات على الكنائس\".<br />واتهم اسحق \"كل من يحرض على هذا النوع من الفتنة بانه يقوم بدور مطلوب صهيونيا وامريكيا\". وبرر اسحق هذه الاحداث بان \"المواطنين من كلا الطائفتين يعانون من ظلم هذا النظام الاستبدادي الذي اوصلهم الى حالة من الاحتقان يبحث فيها المواطن عن متنفس فاتجه الى اضعف الحلقات في هذه العلاقة وهي العلاقة بين الطائفتين\".<br />ورافق الوفد عدد من النشطاء الذي رفعوا لافتات كتب عليها \"دم الاقباط في رقبة مبارك والعادلي\" و\"من يحاسب مثيري الفتنة\" و\"اعلان وظيفة مطلوب مختل عقليا للتعاون مع وزارة الداخلية\"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153825/http://www.20at.com/article2.php?sid=700"

