[[comments]]
order = 18
subject = "مش عارفه وصلت بيتنا ازاي النهاردة؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
author = "مش عارفه اقولكم ايه بس"
posted = "2006-04-16"
text = "صعب قوي لما تمشي في الشارع وانت مش عارف هل حتوصل وللا لا<br />صعب اوي لما تمشي وانت خايف هل في احتمال ان حد ياذيك وللا لا<br />صعب قوي لما تمشي في الشارع وانت مبيشغلش تفكيرك غير شئ واحد.............. ليه بس كده<br />ليه يا بلدي كده؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />ليه امشي فيكي وانا خايف علي نفسي<br />ليه امشي فيكي وانا بسال هل بيتنا فاضله كتير لانه الشئ الوحيد اللي هيحميني طالما الامن حواليا ومش بيتدخل بيتفرج بس<br />رغم اني بشوف الامن بيتدخل في مظاهرات الاخوان وبيضرب كمان يعني بيعرف<br />اشمعني النهارده ساكت؟؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153825/http://www.20at.com/article2.php?sid=700"

[[comments]]
order = 19
subject = "مش عارفه وصلت بيتنا ازاي النهاردة؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
author = "كنت بفكر هل الامن ما اتدخلش لان لازم الفوضي تسود وقانون الغابه اللي يمشي عشان يمتد قانون الطوارئ لمده الفين سنه كمان بدون اي اعتراض من حد"
posted = "2006-04-16"
text = "مش عارفه يا بلدي هل اللي بيحصل فيكي ده طبيعي ؟؟<br />اسفه يا بلدي....غصب عني .......بس للحظه لقيتني خايفه منك<br />كنت قبلك كده خايفه عليكي النهارده لاول مرة لقيتني خايفه منك<br />كرهت نفسي لخوفها منك<br />زة ما كرهت الصرخه المكتومه جوا صدور المقهورين فيكي<br />زي ما كرهت الاهة اللي ساكنه حوا خوفنا من سنين<br />زي ما كرهت اللقمه المرة جوا حلق المظلومين<br />كرهت كله ده وكرهت ايديه اكتر لما لقيتها متسلسلين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153825/http://www.20at.com/article2.php?sid=700"

