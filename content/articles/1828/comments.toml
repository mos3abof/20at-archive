author = "صانع حياة"
posted = "2006-04-17"
text = "بسم اللة الرحمن الرحيم انا بقول لكل من تسول لة نفسة انة يقول ان دة هو الاسلام ابسط شىء اقولة احنا تاريخنا يشهد لنا والى حصل دة لو عمر ابن الخطاب عايش ماكنش اتكلم بفمة فقط واقول للى بيتهم الاسلام ان الليهود والمسيحيين ماعشوش عصر الامن والامان الا مع المسلمين والى عايز يعرف الحقيقة يروح يقرا تاريخ الاسلام والمسلمين ويشهد بكدة اعدائنا وللة الحمد"
