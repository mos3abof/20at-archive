subject = "فتنة طاءفية"
author = "zina"
posted = "2006-04-16"
text = "مصر طول عمرها بلد المصريين لا قلنا مسلم ولا قلنا مسيحى احنا مصريين وهو دة المهم الجديد الى بيحصل الوقتى دة ورا عصابة كبيرة عايزين يحطو من صورة الاسلام الى ربنا هيخلي رايته دايما مرفوعة وكمان عايزين يعملو فتنة طاْءفية ويقولو مسلم ومسيحى احنا مصريين يا جماعة العمليات دى كلها وراها ناس مينفعش تكون مسلمة ولا مسيحية ولا مصرية"
