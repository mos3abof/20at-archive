posted = "2006-04-16"
text = "اولا لو ده تحت شعار الاسلام فوالله ان الاسلام برئ مما حدث اولا لانه حرم الهجوم علي دور العباده ولنسترجع كلمات سيدنا محمد صلي الله عليه وسلم حينما فتح مكه قال ايه افتكروا كويس وكمان انا واحده خايفه انزل من بيتي دلوقت وعندي مواعيد مهمه ده في شرع مين والله بجد حرام ولو قالوا تنظيم فمين اللي نظم ده"
