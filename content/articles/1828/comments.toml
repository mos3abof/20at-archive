text = "دلوقتي .. الجو هادئ نوعا ما ...<br />أنا نزلت الصبح ... قلت أشوف الحال وصل لإيه ... الحقيقة الأمن واخد باله من المكان كويس جدا ... وعامل ترتيبات ضخمة للغاية ...<br />بس أنا مش عارف ؟؟هم إمبارح كانوا فين ؟؟ محدش شافهم في الشوارع الجانبيةااللي كان فيها الضرب يعني ....<br />عموما دول اخواتنا برضه ومنرضاش ليهم الأذية ....<br />لكن دلوئتي أطمنكم .. في جيش كامل تحت لحمايتنا من البلطجية وشرورهم ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />إيه ؟؟ شكلي مش حأغير التوقيع ده ولا إيه؟<br />mohamedmat@hotmail.com"
