posted = "2006-04-16"
text = "انا عايز اعرف البيت بيتك بيتكلم على الاخوان المسلمين دلوقتي ليه على الرغم انهم ملهمش دعوه بالموضوع و بيشتموا فيهم من الصبح مش عارف ليه<br />ملحوظه: دي تاني مره يتكلموا على الاخوان بعد موضوع المرشد<br />انا اعتقد ان موضوع الكنايس ده برده للقضاء على شعبيه الاخوان بعد موضوع المرشد خاصه انهم ليهم ثقل في الاسكندريه<br />المهم ربنا يستر"
archived = "2006-11-02"
