subject = "double حرام"
author = "نيفين"
posted = "2006-04-16"
text = "حرام الاولى بقولها للناس اللى عملت العمل المهبب دا<br />ياناس انتو عايزين تودونا فين اكتر من كدا<br />و الناس الهبله اللى فرحانين باللى بيحصل دول متخلفين و باصين تحت اقدامهم و مش فاهمين اللعبه<br />و حرااااااااااااااااااااااام التانيه بقولها للامن<br />ربنا يخليكو مش عايزين حد يطلع لنا بيان مكتوب فيه الفاعل مختل عقليا<br />بقت بايخه اوى<br />و الخلل يا ساده مش ف العقول<br />الخلل فى النظام الامنى و انتو عارفين فين تانى<br />عبد الله عذرا علشان مكملناش الكلام لظروف طارئه و لكن للحديث بقيه ان شاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153825/http://www.20at.com/article2.php?sid=700"

[[comments]]
order = 10
subject = "التعقل مطلوب"
author = "مسلمه"
posted = "2006-04-16"
text = "صحيح احنا عارفين انه اكيد ورا الحكايه دى تخطيط خارجى يعنى امريكانى<br />لكن مش لازم ابدا انهم ينولو غرضهم<br />احنا مش لازم نقسم البلد على انها مسلمين ومسيحيين خلونا مصريين<br />وبعدين اى حاجه واى قانون ممكن نناقشه مع بعض بالحسنه بس مش دلوقتى<br />لازم نتعقل فى احكايه دى جدااااااا<br />اللهم اجعل مصر ارض سلام واهدنا ياربنا الى خير اسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153825/http://www.20at.com/article2.php?sid=700"

[[comments]]
