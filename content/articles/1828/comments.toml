[[comments]]
order = 29
subject = "- فتش عن اليد الخفية"
author = "واحدة اسكندرانية"
posted = "2006-04-20"
text = "اول حاجة بقدم التعازي لكل مسيحي في الاسكندرية اللي كتيير منهم صحابي وجيراني<br />تاني حاجة عايزة اقول ان الشخص اللي ارتكب الجريمة دي (محمود صلاح) هو فعلا مريض نفسي ومش معنى انه مريض نفسي انه مايعرفش يخطط لجريمة لان الناس اللي من النوع ده بيبقوا عباقرة بس المشكلة ان نتيجة القهر والمواقف الصعبة اللي بيقابلوها في حياتهم بيتحولوا لمرضى يسيطر عليهم فكرة معينة والأغرب من كده ان مرضهم ده بيظهر في وقت محدد كل فترة زمنية<br />اقصد اقول ان الجريمة دي جريمة شخصية مش جماعية وربنا يصبر اهل المتوفى والضحايا<br />تالت حاجة ماكنش فيه مظاهرات عند كنيسة 'مارجرجس' لأنهم كانوا عارفينه وعارفين انه مريض لأنه ساكن هناك<br />المظاهرات كانت عند كنيسة 'القديسين' اللي في ميامي وفي شارع 45 كمان<br />واخر حاجة عايزة اقولها ومهما قلت مش حقدر اوصفلكم الحالة اللي كنا عايشينها مش ممكن دي تكون مصر<br />لما تحس انك مش قادر تروح بيتك لما تشوف اتنين كانوا امبارح صحاب والنهارده بيضربوا في بعض لما تفتح بابك ولاول مرة تلاقي جارك مش عارف يبتسم في وشك<br />ساعتها عرفت انهم نجحوا ..<br />هما مين ..<br />معروفين طبعا..<br />نجحوا في ايه؟؟<br />نجحوا في انهم يفرقوا ما بينا طبعا بينفذوا مبدأ 'فرق تسد' المشكلة مش في الحادثة اللي حصلت<br />المشكلة الأخطر هي ان فيه يد خفية غرضها كله انها تستغل اي حاجة علشان تولع الموضوع على فكرة عايزة اقول شوية حاجات من واحدة عاشت قلب الاحداث<br />المظاهرة اللي طلعت يوم جنازة المتوفي لم تكن لها علاقة بالجنازة بدليل ان اهله لم يسيروا فيها<br />ان من طلع على هذه المظاهرة ليسوا إلا مجموعة من البلطجية (اللي بيكونوا مسلمين وقت اللزوم ومسيحيين وقت اللزوم وممكن يكونوا ملحدين وقت اللزوم) اما غرضهم وهدفهم فهو<br />اما مصالح شخصية مثل السرقة والنهب وسط المظاهرة<br />او يكونوا مأجورين لغرض غير شخصي وهو تنفيذ خطة( الايدي الخفية )في اشعال وتوليع الفتنة بين الناس<br />وكانت النتيجة 30 مصابا 2 متوفى وتدمير وتخريب محلات كثيرة وسيارات اكثر<br />ملحوظة اخطر ما في الموضوع انهم نجحوا في ان يشعلوها ...<br />والله اعلم متى وكيف سوف تطفأ وأخيرا ادعو الله الا أرى ما حدث مرة اخرى لانه احساس بشع<br />ادعو كل مصري أن يكون بعيد النظر وان يفكر معي ويبحث عن صاحب 'الايدي الخفية' التي تسقينا سم العداوة والفتنة دون ان ندري<br />فتاة اسكندرانية رأت الخراب بعينيها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153825/http://www.20at.com/article2.php?sid=700"

