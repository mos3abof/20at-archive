[[comments]]
order = 12
subject = "يا اسكندرية"
author = "واحد تاني"
posted = "2006-04-16"
text = "يا اسكندريه<br />بحرك عجايب<br />ياريت ينوبني م الحب نايب<br />تحدفني موجه<br />على صدر موجه<br />والبحرهوجه<br />والصيد مطايب<br />أغسل هدومي<br />وأنشر همومي<br />على شمسه طالعه<br />وأنا فيها دايب<br />كأني فلاح في جيش عرابي<br />مات ع الطوابي<br />وراح في بحرك<br />كأني نسمه فوق الروابي<br />م البحر جايه<br />تغرق في سحرك<br />كأني كلمه من عقل بيرم<br />كأني غنوه من قلب سيد<br />كأني جوا المظاهره طالب<br />هتف باسمك<br />ومات معيد<br />كأني صوت النديم<br />في ليلك<br />بيصحي ناسك<br />يشدوا حيلك<br />كأني طوبه من بيت في حاره<br />كأني دمعه<br />في عيون سهارى<br />كأني نجمه فوق الفناره<br />تهدي الحيارى<br />والبدر غايب<br />يا اسكندريه<br />يامصراويه<br />على سن باسم<br />على ضحكه هاله<br />البحر<br />شباك ومشربيه<br />وانتي الاميره<br />ع الدنيا طاله<br />يا اسكندريه عاشق<br />وبدي<br />ارتاح في حضنك<br />والود ودي<br />يكون كلامي<br />عربون غرامي<br />وبالمحبه<br />ناخد وندي<br />يا اسكندريه فيكي الغلابه<br />ع الرزق يسعوا ولايناموش<br />صبح صباحهم<br />رجع مساهم<br />وزاد شقاهم<br />ومارتاحوش<br />يا عيني ع اللي الزمان تعبهم<br />وضاع تعبهم<br />ومالتقوش<br />نزل شبكهم<br />في بحر طامي<br />طلع شبكهم<br />على فاشوش<br />وفيكي بين البشر<br />ديابه<br />وفيكي فوق البشر<br />وحوش<br />وفيكي ناس مغرمين صبابه<br />لو خان زمانهم<br />مابيخونوش<br />وفيكي خمري<br />سلمت امري<br />ما اقدرش اشوفه<br />وما اغنيلوش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153825/http://www.20at.com/article2.php?sid=700"

[[comments]]
order = 13
subject = "احييك جدا"
author = "mark"
posted = "2006-04-16"
text = "وبردو مختل عقليا ياناس يابشر يروح من كنيسة لكنيسة<br />وياخد الترام ويقطع تزكرة ويطلع من كنيسة للتانية<br />دا كلام عاقل ؟؟؟؟<br />تانى حاجة تغيظ اكتر الامن ؟؟؟؟؟؟؟؟<br />الامن فين<br />بعد اول كنيسة كان المفروض الامن يبلغ الكل لكن لاااااااااا دول سابوة يروح من كنيسة للتانية للتالتة اللى يعينى لقيها زحمة اوى فراح للرابعة واخيرااااا<br />قالو خلاص كفاية كدا نمسكو بقى<br />يااااااااااارب الرحمة من عندك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153825/http://www.20at.com/article2.php?sid=700"

[[comments]]
order = 14
subject = "شعللها شعللها...ولعها ولعها"
author = "سوسة المفروسة"
posted = "2006-04-16"
text = "مش عارفة يا جماعة انا شامة في الموضوع ده ريحة مش عاجباني<br />اصل بعد الموضوع بتاع (بني مزار) و الكلام اللي الناس ماصدقتوش عن ان اللي منفذها مختل عقليا ..لا يمكن حد من اي حكومة بتفهم هيطلع يكرر الكلمة دي تاني...تكرارها سببه الوحيد ان الحكومة عايزة الناس تشعلل اكتر و يهيجوا اكتر و اكتر....هتسالوني السبب ايه??<br />اقولكوا:<br />1- تمديد العمل بقانون الطوارئ لمدة 25 قرن قادمين بدون اي اعتراض من اي شخص<br />2- تقويم الناس و بالذات الاقباط ضد جماعة الاخوان اللي موجودين في اسكندرية بنسبة مش بطالة لانهم هما اللي عليهم الدور بعد ايمن نور و نعمان جمعه يعني شدة ودن او يمكن قمعها محدش عارف لان اللي يشوف القساوسة و الاقباط و هما بيتكلموا عن الحادثة دي كله بيقول وراها تنظيم وراها تنظيم و تحس ان كلمة الاخوان واقفة على طرف لسانهم مستنيه زقه عشان تتقال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153825/http://www.20at.com/article2.php?sid=700"

[[comments]]
