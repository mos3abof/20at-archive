posted = "2009-07-09"
text = "بعض الساقطات فى اوروبا يرسمون تاتو على شكل فراشة حول عورتها<br />وبعض الخليجيات يرسمن بالحنة تاتو حول اماكن العفة ليلة الدخلة وفى المناسبات<br />والاخ عمرو ايضا يرسم تاتو على مؤخرتة تحت الثياب<br />وما يظهر فى الصورة هو الجزء المؤدب"
archived = "2009-07-10"
capture_url = "https://web.archive.org/web/20090710074609/http://www.20at.com:80/masr/t7kyk/12593-2009-07-07-15-31-16.html"

