posted = "2009-07-08"
text = "بلا حرام بلا بطيخ . انتم المشايخ تحاولون افساد المتعة على الناس . و نعم استطيع ان اتكلم بالفصحى مثلك ايها لعجوز اللعين الهرم . لا تتدخل بامور لا تعنيك"
archived = "2009-07-10"
capture_url = "https://web.archive.org/web/20090710074609/http://www.20at.com:80/masr/t7kyk/12593-2009-07-07-15-31-16.html"

[[comments]]
