subject = ""
author = "الشيخ الشكسي"
posted = "2009-07-08"
text = "الوشم حرام شرعن و صدرت فتاوى عديدة بتحريمه . و الآن يخرج هذا الأرعن عمرو دياب يتحدى دين الإسلام (و العياذ بالله) .<br />لقد اقترب عمرو دياب إلى الكفر و أتمنى أن لا يقترب أكثر من ذلك ."
archived = "2009-07-10"
capture_url = "https://web.archive.org/web/20090710074609/http://www.20at.com:80/masr/t7kyk/12593-2009-07-07-15-31-16.html"

