[[comments]]
order = 1
subject = "إلى من تطاول على قادتنا"
author = "عبــــودي"
posted = "2006-06-24"
text = "السلام عليكم ورحمة الله وبركاته ..<br />نجاحات مملكة الإنسانية ( المملكة العربية السعودية ) قائمة ولا تزال تواصل مسيرتها بعون الله ثم بفضل جهود قادتها ..<br />ماذا فعلوا لك ( آل سعود ) .. لكي تتهمهم باللصوص والفساد وحتى الكفر ( الله يهديك ) .. ( من كفر مسلما فقد كفر )<br />أعتقد أن الصلاح في بالك هو : أن تقود النساء للسيارات .. أن يسمح بفتح المراقص وبيوت الدعارة والمشروبات المحرمة .. وأن يكون هناك منع للحجاب<br />اتقِ الله في نفسك .. ولتكن أكثر عقلانية<br />ولتنظر لجهودهم في خدمة بيت الله وطباعة المصاحف وغيره الكثييييييير ..<br />لماذا ننظر لنصف الكوب الفارغ ونترك النصف الآخر الممتلىء ؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154756/http://www.20at.com/article2.php?sid=980"

[[comments]]
order = 2
subject = "طموح وتشريف"
author = "لينا"
posted = "2006-06-24"
text = "تفكير ممتاز بدأنا نلمس ثماره في المملكه فنحن قبل كل شيء يهمنا ان نطور من شبابنا ونتيح لهم افضل الفرص لتكوين شخصيه مسؤوله قادرة على تحمل اعباء الحياة بطريقه عمليه متحضره تنمي لديهم حب الانتاج والعطاء بالاضافه الى احترام الذات<br />واكبر دليل على ذلك الانجازات العظيمه التي تجلت مؤخرا والتي كان واضع حجر الاساس فيها الملك عبدالله اطال الله عمره<br />حيث اتاح فرص جديده وفتح المجال امام العقول المفكره لطرح ايجابيات افكارها.<br />خلاصة الكلام:<br />استمرار التشجيع = جيل يرسو على ارضيه صلبه سقفها الطموح وهوائها العطاء<br />لينا<br />sleepingangel_wl60@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154756/http://www.20at.com/article2.php?sid=980"
