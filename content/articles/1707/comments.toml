[[comments]]
order = 0
subject = "الأعمال التطوعية هي الأهم"
author = "Aster"
posted = "2005-12-06"
text = "النسبة لي لم يكن لدي الوقت الكافي لأفعل كل النشاطات التي كنت أود فعلها منذ زمن طويل وعندما انتبهت أن حياتي وشبابي يضيعان مني دون أن أكسب الدقائق والساعات قمت بجمع أصدقاء المدرسة وشكلنا فريقاً تطوعياً يقوم باستخدام طاقات الشباب لعمل الخير. فخصصنا يوم الجمعة لزيارة دور الأيتام والمعاقين ويوم السبت من كل أسبوع للاجتماع ومناقشة الأفكار الجديدة والمشاريع المقترحة. والحمد لله لاقت الفكرة حماساً وقبولاً منقطع النظير وأصبح لدينا الوقت لنقضيه مع بعضناالبعض أيضاً"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152048/http://www.20at.com/article2.php?sid=13"

[[comments]]
order = 1
subject = "االله عيكم يا عشرينات"
author = "نيفين"
posted = "2005-12-07"
text = "و دا الكلام لان ناس كتير بتضيع فتره الجامعه ف المزاكره و بس<br />يا جماعه نصيحه اللى يضيع فتره الجامعه عمره ما هيعيش بعد كده<br />شويه مزاكره و شويه ف الحياه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152048/http://www.20at.com/article2.php?sid=13"

[[comments]]
order = 2
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-18"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152048/http://www.20at.com/article2.php?sid=13"
