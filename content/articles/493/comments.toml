subject = "مبروووووووك يا أحمد باشا"
text = "إزيك يا (ريس) ؟؟؟ أنا تقريبًا أول واحد يعدي هنا :) 16/4 ( الساعة 7 وربع ، وأنا ف مكاااان ضلمة × ضلمة ،<br />القلوب عند بعضها ، ما تنساااااااااش معادنا بعد بكــرة ، وياريت تبقى تنشر شعرك الجميل هنا كماااااااان :)<br />هوا الوجود إيه غير الكلمـة ؟؟<br />ممكن تسمح لي أقول : هوا إحنا زماننا اللي استعجل ، ولا إنتا كبرت وبتداري ؟؟؟<br />حلوة حكاية الرسالة اللي تستغلها ، وتكتبها مقال ....<br />بص عجبني بــجد ...<br />بس أنا كنت فاكرك هتتريق عليهم ، بدل (مرة واحد صعيدي) تحيااااااااااتي<br />إنتا عارفني :)"
archived = "2005-07-06"
capture_url = "https://web.archive.org/web/20050706075804/http://www.20at.com:80/article.php?sid=1159"

