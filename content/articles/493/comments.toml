subject = "destien22@yahoo.ca"
text = "بدات اناقش شخصيتي لاول مرةفي حياتي بعد وقوعي في اكبر مشكلة .لمادا انا موجودة ما الهدفي في وجودي في هده الحياة الغريبة..... ورجعت إلى اصلي الدي هو ديني .انا مسلمة لكن في حقيقة الامرلا اعرف من الاسلام سوى اسمه عندها بدات في البحث فيه واتعلم مبادئه ....وجدت ديني الدي هو اساسي وبناءي الحقيق الدي يجب ان اكون عليه يتعرض الى مطاهدعنيفة من الدين لايجدون فيه مصلحتهم ..طرح السؤال نفسه لماذا كل هذا ضد الاسلام بضبط .منه علمت ان الاسلام دين كامل وشامل واكبر فخر لن كمسلمين (اقل هذا من يجعل من الغرب مثلا له)"
