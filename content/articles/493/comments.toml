subject = "يجد طريقه في الحياة"
text = "اجمل ما في الانسان ان يجد طريقه في الحياة وهو ماحدث بحذافيره لاخينا في الله تقي الدين فقد استطاع ان يعرف الطريق الصحيح في حياته واختار ان يكون مسلما لذا فانا اشد علي يديه واتمني ان يوفقه الله في حياته اما بالنسبة لهذا المصري او تاكي فهو معذور لانه مجبر علي ذلك فهو مسلم لان اهله مسلمين ولكنه علي غير هذا الطريق تماما وتبرا من اسمه حتي يكون فريقا للغناء وحتي الغناء الذي يغنونه ليس بالهادف ولا بالمفيد ولكن (انك لا تهدي من احببت ولكن الله يهدي من يشاء)"
archived = "2005-07-06"
capture_url = "https://web.archive.org/web/20050706075804/http://www.20at.com:80/article.php?sid=1159"

