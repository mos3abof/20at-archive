[[comments]]
order = 16
subject = "كاظم الشمري ـ العراق"
text = "انا انصح هذا الولد الياباني بالرجوع الى طريقه الصحيح, لان اذا كان طريق الاسلام صحيحا فلماذا علماء الاسلام لا يتمكنون من تطهيره من المرتدين, مختصر كلامي هو ان الاسلام عقيدة صحيحة ولاكن العرب يشوهونه و يستعملونه كسلاح لشوفينتهم, الا ترون العراقيون كيف يذبحون الانسان, يذبحون المسلمون بمقابل فئة من النقود.<br />و علماء الاسلام امثال الدكتور(يوسف القرضاوي) متهمون بحق الانسانية و تشويه سمعة الدين الاسلام، لانهم يفتون للجاهلين بضرورة قتل الابرياء و سفك دمائهم.<br />فيا ابناء العرب فكروا ان طريقنا .. طريق القومية المتطرفة غير اخلاقي و سكوتنا على هذا الغدر هو خير دليل على اننا شريك الشياطين.<br />و السلام عليكم ورحمة الله وبركاته.<br />كاظم الشمري"
archived = "2005-07-06"
capture_url = "https://web.archive.org/web/20050706075804/http://www.20at.com:80/article.php?sid=1159"

