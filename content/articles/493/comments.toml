subject = "كثير من السعوديات يطالبن باقتناء عبيد"
text = "والله يا إخوان اسمعت عن كثير من السعوديات يطالبن بالسماح لهن بشراء عبيد بدل الخدم والله هؤلاء السعوديون فاضحين المسلمين فضيحة كبيرة لا شك أن فيهم ناس ممتازيين ومسلمين ممتازين بس كمان فيهم كثير ناس فضايح للإنسانية أرى وضع السعودية تحت وصاية الجامعة العربية أو منظمة المؤتمر الاسلامي أو هيئة الامم المتحدة بلكي هالسعوديين بطل فيهم هيك فضايح وصاروا *** زي الناس العاديين وصاروا سويين بدل ما هم مشوهين وممسوخين.<br />الللللله يفتحها عليكم أيها السعوديين وتصيروا زي البشر وصي عندكم إنسانية يا ***"
archived = "2005-07-06"
capture_url = "https://web.archive.org/web/20050706075804/http://www.20at.com:80/article.php?sid=1159"

