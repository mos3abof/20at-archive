[[comments]]
order = 7
subject = "بارك الله فيه"
text = "بارك الله في تقي الدين و رزقه التقوى و أنا بس تعليقي على حكاية اختياره لاسمه بالرغم من ان في ناس بتحاول من نفس الاسم تقليدا للغرب هو كده يا جماعة هو ده الفرق بين اللى كل علاقته بدينه ان وجد ابوه و أمه مسلمين فبقى زيهم و بين اللي بحث عن الحقيقة لغاية ما عثر عليها أكيد هما الثنين عند ربنا ليسو سواء.<br />لابد أن نبحث نحن أيضاعنها و ان كنا واثقين منها فلابد أن نعمل بها. و جزاكم الله خيرا علي هذه الموضوعات الجميلة"
archived = "2005-07-06"
capture_url = "https://web.archive.org/web/20050706075804/http://www.20at.com:80/article.php?sid=1159"

