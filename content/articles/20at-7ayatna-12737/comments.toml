text = "بحيكي يا مي علي إصراراكورغبتك في تحقيق هدفك واستمري في عملك<br />العمل عمره ما كان عيب ولا حرام ما دام ملتزمة بدينك واخلاقك .إنتي نموذج يحتذي به وياارب يبقي البنات عندهم ولو جزء بسيط من عزيمتك علي الوصول لطموحك<br />الله معك وربنا يوفقك"
