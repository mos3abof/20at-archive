text = "كسبنا والا خسرنا اية اللى هيحصل<br />القدس هترجع<br />هتتحرر فلسطين<br />اية الكلمات المعجرمة دى - مصر الصائمة وكاننا خارجين نغزوا فى سبيل اللة<br />دى رواندا اول مرة تبقى دولة فى حياتها من عشرين سنة وكانت شوية غابات مليانة نسانيس<br />احنا بقينا هايفين لية<br />ما هى حتة مباراة زى اى مباراة بين طلخا وكفر الزيات<br />الكرة الارضية مش هتخرب"
