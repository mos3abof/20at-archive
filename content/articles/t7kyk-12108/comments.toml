subject = ""
author = "محمد شعبان"
posted = "2009-05-18"
text = "فى محاضرة القاها الشيخ محمد الغزالى زمان فى مسجد سيدى بشر بالاسكندرية<br />قال الشيخ<br />اذا لم يكن فى المنطقة او القرية او المدينة او الحى طبيبة مسلمة تكشف وتعالج النساء فان تعليم البنات الطب يصبح فرض واجب<br />نعم تعليم البنات الطب اصبح فرض واجب - ومعلوم طبعا اهمية ومعنى كلمة فرض واجب اى انة فرض مثل الصلاة والصوم<br />لا يجوز للمرأة المسلمة ان تتعرى وتكشف عورتها على رجل او امرأة من غير دينها<br />حرام شرعا الا عند الضرورة القصوى التى فيها انقاذ حياة ووقت الطوارىء<br />ولكن اذا توفرت الطبيبة المسلمة الحاذقة فلماذا تذهب المرأة الى عيادة رجل او امرأة كتابية<br />كل ذلك لبعد الناس عن الدين<br />علموا السيدات الاحكام الشرعية<br />افهموا بقى لان كل ذلك بيعمل مصايب"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528235415/http://20at.com:80/t7kyk/12108-2009-05-18-13-00-12.html"

