author = "رضا السوهاجى"
posted = "2009-05-18"
text = "من حوالى عشرة سنوات مضت فى احدى مدن الصعيد وفى سكن المعلمات المغتربات<br />حدث ان كانت معلمة انسة تستحم فى حمام السكن وفتحت باب الحمام عليها معلمة متزوجة تقيم فى السكن معهم - فرفعت الانسة قضية امام المحاكم وجاء فى شكواها ان الزميلة المتزوجة اطلعت على عوراتها بدون اذن منها وهى الاجنبية عنها وخصوصا وانها تعمل كخاطبة حينما يطلب منها احد الزملاء وان اطلاعها على جسدها قد يسبب لها الاذى<br />وحكم القاضى لها وكذلك تم تحويل المعلمة الى النيابة الادارية<br />هذا الطبيب المجرم يجب ان يجرم بجناية وتسحب منة رخصة مزاولة المهنة لخيانتة الامانة"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528235415/http://20at.com:80/t7kyk/12108-2009-05-18-13-00-12.html"

[[comments]]
