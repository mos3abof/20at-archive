posted = "2009-05-19"
text = "من سنوات كنت طالبه فى الثانوى واخذتنى زميلتى عندطبيب لعمل شهادة طبيه لى وعندمانمت على سريرالكشف لاحظت انه غيرمحترم لعنه الله حتى انه رفع ملابسى الداخليه فى غفوة منى ونظرالى عورتى وقمت على الفور وخرجت مسرعه اناوزميلتى ومن ساعتها تربت عندى عقدة كبيرة وبعدزواجى احدثت هذة الحادثة غصه فى حلقى لم اتخلص منهاحتى الان لذلك انصح كل ام الاتدع ابنتهاالذهاب للطبيب الاوهى معها وكذلك كل اب واخ وزوج وكلمة اخيره اقول لكل طبيب لايراعى الله فى مريضه الذى بين يديه موعدنافى الاخره لكى تأخذجزاؤك عندمن لاتضيع عنده الحقوق وحسبى الله ونعم الوكيل"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528235415/http://20at.com:80/t7kyk/12108-2009-05-18-13-00-12.html"
