[[comments]]
order = 4
subject = "دوله فى واد وشعب فى واد اخر"
author = "ايمن امام"
posted = "2006-09-28"
text = "هيه- المقاله دى بالذات كانت هاتخلينى افطر رغم ان الساعه اتنين لكنى مسكت لسانى -انا عندى سؤال مش لاقى له اجابه مين - بيحكم مصر - بجد سيبكم من الرسميات والتصريحات واستقبل وصرح واعلن - بجد مين بيحكم مصر - ياترى السفير الامريكى مثلا - ياترى السفير الهندى مثلا - ياترى ياترى - الواحد كل يوم يسمع خبر اغرب من اللى قبله - لدرجه ان الواحد حاسس انه مش مت هذا البلد وكأنه هبط عليه بالباراشوت-قيم غريبه واعراف غريبه هل هذه السفارات هى التى تمثل هذا الشعب - هل هذه الاموال من دم هذا الشعب هل يدفع صاحب الكشك الصغير الضرائب لكى تصل الى ايدى هؤلاء هل ادفع انا ضرائب لكى تشتروا بها خمورا - هل يدفع كل صاحب عمل ضرائب لكى يلهوا بها هذه الطبقه - التى لاتعرف دينا ولامله - هل بعد ذلك يكون بن لادن والظواهرى ارهابيين - هل بعد ذلك يكون شيوخ الازهر ومن فرضواعليبنا على انهم علماء الامه الاسلاميه - هل لهؤلاء مصداقيه - هل لايعرفون انهم - مجموعه منافقين لهم دور واحد وهو اعطاء الحاكم صبغه شرعيه وانا اؤكد لكم انه لو كان الحاكم هذه الايام - غير مصرى ولو كان سيخى لاعطوه الشرعيه ولكفروا كل من يخرج عليه - ولقال احدهم هؤلاء ولاد كلب 0 ولقال الاخر هؤلاء اوباش - - حتى يعطينا الله فيهم ايه - عندما يتعرضون للازلال فى مطارات امريكا ويعود كل منهم يجر ازيال الخيبه - ليس للغيره على المسلمين الذين فاتهم دروسه ولكن على بدلات السفر التى طارت -"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125256/http://www.20at.com/article2.php?sid=1280"

