subject = "THUNDERBIRD@YAHOO.COM"
author = "انسان"
posted = "2006-10-03"
text = "لقد وقفت يوما على كلمة قالها السادات وسمعتها فالتلفزيون فانا لم احضر الا5 اشهر فقط من فترة حكم السادات قال(لادين فالسياسة ولا سياسة فالدين)عتبت عليه ثم كرهتة فالدين الاسلامى هو دين الحكم وهو الدين الحكم والمنظم لكل وكافة امور الحياة انا الان افضل فصل الدين عن السياسة لان السياسة اصبحت بلا دين)وحتى اشعار اخر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125256/http://www.20at.com/article2.php?sid=1280"

