[[comments]]
order = 1
subject = "الموضوع كبير يا ايمان"
author = "نيفين نيفى نوفا"
posted = "2006-09-27"
text = "للاسف مش بس كدا<br />دا اى اوتيل خمس نجوم من شروط منحه الجوده ان لازم يقدم خمور<br />اصل المساله مش بادئه من النقطه دى<br />المساله بادئه من نظريه اعتمادك على الاخر و الاخر هنا الغرب و اللى بيمنح اةى اوتيل نجوم شرفيه هما الغرب و لان اللاخر هو مانح الشىء فلازم يفرض عليكى ثقافته<br />و انتى لانك تابعه لازم تقبلى شروطه<br />مش بقوللك الموضوع كبير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125256/http://www.20at.com/article2.php?sid=1280"

[[comments]]
order = 2
subject = "أصدق أم كان من الكاذبين"
author = "الزيني بركات"
posted = "2006-09-27"
text = "السلام عليكم<br />الأخت الفاضلة كاتبة المقال / ايمان عبد المنعم<br />ينتابنى شعور و يكأني قرأت نفس المقال من قبل<br />و لا أدري أصدقنى شعوري أم كان من الكاذبين<br />تحية طيبة لكي و لموقعكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125256/http://www.20at.com/article2.php?sid=1280"

