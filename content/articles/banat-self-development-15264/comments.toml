posted = "2010-02-19"
text = "السلام عليكم<br />الكلام ده كله غير منطقى لانه اساسا مش من المنطق اننا نوجد الاختلافات بين الرجل والمرأة ونقعد نشوف مين الاحسن والافضل والاقدر على البقاء<br />زى مانتوا طلعتو 10 ميزات فى رائى انهم لا شىء<br />لكن ممكن تطلعوا 100 ميزة بيتميز بها الرجل عن المرأة<br />ولكن لماذا كل هذا الهراء يعنى احنا بقينا فاضيين ومش لاقيين حاجة نعملها وقاعدين نطلع الاختلافات<br />وكاننا فى سباق"
