author = "سارة الجنيدى"
posted = "2010-02-13"
text = "متهيألى ان الستات بقوا تعبانين اكتر من الأول لأنهم داخلين منافسة مع الرجل في انهم عايزين يثبتوا انهم الأقوى والأفضل وانهم ممكن يستغنوا عنهم<br />ونسيوا أهم دور ليهم وهو ابنائنا وأهلنا والمجتمع اللى محتاج حنيتنا وعطفنا على كل محتاج . حاجات كتير الست كانت شيلاها كانت درع واقي من مشاكل كتير بنعانى منها دلوقتى ولما الستات دخلوا المنافسة وتخلوا عن دورهم الأساسي حاجات كتير باظن وادمرت<br />متهيألى جه الوقت اللى كل واحدة فينا لازم تهتم بولادها وبيتها ودا ميمنعش ابدا انها تتعلم وتشتغل بس في حدود طبعا"
archived = "2010-02-14"
capture_url = "https://web.archive.org/web/20100214194221/http://www.20at.com:80/banat/self-development/15264-2010-02-09-23-33-47.html"

[[comments]]
