author = "maysa zaitoun"
posted = "2010-02-17"
text = "احب اقول يا جماعة الكلام دة زي الفل وواقعي ومحدش يقدر ينكرة وبرضة مينفعش نتنحي عن واجباتنا المنزلية فلو وجدنا ان العمل هيؤثر علي البيت والاولاد فبلاش منة والسبب لان زى ما احنا بارعين في الوظائف الخارجية ونحتل المركز الاول مع مرتبة الشرف فكذلك ايضا في الوظائف المنزلية بس الفرق ان الرجالة ممكن يقوموا بالوظائف الخارجية ولو بكفائة 50% لكن ميقدروش يقوموا بالوظائف الداخلية بكفائة 5% فمن باب اولي نشوف اية محتاج لينا اكتر ونعملة لان هو دة دورنا في الحياة الراجل يشيل جزء هو الأقدر علي تحملة واحنا نشيل جزء اكبر الراجل ميقدرش يتحملة<br />وشكرا جزيلا"
archived = "2010-02-19"
capture_url = "https://web.archive.org/web/20100219235608/http://www.20at.com:80/banat/self-development/15264-2010-02-09-23-33-47.html?"

