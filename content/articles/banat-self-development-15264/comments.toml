author = "أحمد المصرى"
posted = "2010-02-18"
text = "خلاص تمام اوى كدا مدام الستات فيهم كل المميزات دى و احسن من الرجالة يبقى بقى يعيشوا لوحدهم على جنب بعيد عننا<br />انا عايز اقول ان العملية مش سباق ما بين الراجل و الست على مين الاحسن لكن انا بحب أكتر انى اقول ان الاتنين بيكملوا بعض يعنى ممكن بعض المميزات دى ظهرت عند بعض الستات علشان كان فيه رجالة واقفين جنبهم و بردو فيه مميزات فى الرجالة مش عايزين ننكرها و بردو بقول المميزات دى اللى ابرزها فى الرجالة ان كان فيه ستات واقفين جنبهم يعنى بجد من الاخر مفيش طرف يقدر يستغنى او يعيش من غير التانى مهما انكرنا ذلك"
archived = "2010-02-19"
capture_url = "https://web.archive.org/web/20100219235608/http://www.20at.com:80/banat/self-development/15264-2010-02-09-23-33-47.html?"

[[comments]]
order = 5
subject = ""
author = "اختك فى الله"
posted = "2010-02-18"
text = "بسم الله الرحمن الرحيم<br />maysa zaitoun<br />احب اعلق على كلامك و اقول عيب المرأة تتنافس مع الرجل وده مش من اصول الدين — يعنى مثلا المرأة المسلمة لا يحق لها ان تعمل<br />حيث ان عملها يعرضها للاخرين - يعنى تشتغل اه بس فى بيتها لان<br />من زماااااااااان هوا ده شغل الست - مش تخرج على الشغل<br />متمكيجة و متبرجة وتقول انا بنافس راحل — بتنافسى على ايه يا اختى — ده الرسول الكريم قال : اطلعت على النار فوجدت اكثر اهل النار النساء — طبعا انا مش بعلق على كلامك لكن انا حبيت انصحك<br />للمنافسة الشريفة على الجنة بأتباع أصول الدين احسن من منافسة الدنيا الفانية على لا شىء اكثر من مجرد شهرة غير ذات نفع فى النهاية<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2010-02-19"
capture_url = "https://web.archive.org/web/20100219235608/http://www.20at.com:80/banat/self-development/15264-2010-02-09-23-33-47.html?"

[[comments]]
order = 6
subject = ""
author = "action"
posted = "2010-02-19"
text = "السلام عليكم ورحمة الله وبركاته<br />طبعا الكلام ده جميل جدا وأكيد المرأة مميزة عن الرجل وأحسن منه فى حاجات كتيير فهى التى كرمها الله تعالى.. فهى الأم التى تربى أعظم رجل وهى الزوجة التى تحنو على زوجها وتهون عليه ضغوط الحياة ويحكى لها مشاكله وتستمع إليه جيدا وتشاركه وتنصحه وتصون بيته فى غيابه لذلك فهى ليس لديها وقت للعمل خارج مملكتها .وهى الرقيقة التى تصان فى بيتها(إنها ملكة)والرجل هو الذى يعمل مدرس ومهندس و…مدير !!!فهو لديه قوامة وقوة تحمل لكل ما يواجهه خارج بيته من معاملات مع هذا وذاك ويركب المواصلات ويسير تحت الشمس الحارقه كل هذا السعى للحصول على الرزق من أجل تلك الملكة اللتى تنتظره عندما يعود ليجد الصدر الحنون الذى يخفف عنه ما به من آلام..أعتقد بعد كل هذا لا يوجد وجه مقارنة فلكا من الرجل والمرأة خلقته التى تتحمل ما خلقت له…البلهم اهدينا واحفظنا واصلح أحوالنا ووفقنا لما تحب وترضى"
archived = "2010-02-19"
capture_url = "https://web.archive.org/web/20100219235608/http://www.20at.com:80/banat/self-development/15264-2010-02-09-23-33-47.html?"

