posted = "2009-03-17"
text = "أعتمدنا فى هذا المرجع إلى أمهات الكتب المسيحية والأسلامية بدون تحيز بالرغم من أن الكتب الأسلامية التاريخية محشوة بالبروباجاندا الأسلامية كما أن بعض أمهات الكتب التاريخ الأسلامية كتبت تاريخ الحدث بعشرات السنين قد تصل إلى سنتين , والموقع يثق ثقة تامة فى المراجع المسيحية المؤرخة للتاريخ المسيحى حيث أعتمد الموقع على مراجع مسيحية سجلت تاريخ الحدث حال وقوعه , فالمراجع المسيحية مثل تاريخ البطاركة لأبن المقفع جمع من كتابات كتبه القبط فقد كان لكل بطريرك قبطى كاتب يسجل الأحداث التى حدثت فى عصرة , وقد جمع ساويرس الشهير بأبن المقفع هذه الكتابات وسجلها فى كتاب واحد وما زالت بعض مخطوطات الكتبة فى الديرة التى جمع منها أبن المقفع تاريخ البطاركه موجوده فى الأديرة حتى الآن , وقد سجل ساويرس أبن المقفع حادثة نقل جب المقطم , وموجود مراجع أخرى تؤيد هذه الحادثة , ولا يوجد بيت مسيحى لا يذكر فيه الاباء إلى الأبناء هذه الحادثة , والمسيحية تختلف عن الإسلام فى أن المسيحيين يؤمنون بالقوة الإلهية الإعجازية التى تتكرر فى عصور الإضطهاد التى قابلوها من المسلمين , أما وقع هذه الحادثة ونهايتها بأعتناق الخليفة المعز المسيحية تهزهم فيشككون فى مصداقية المراجع المصاحبة لتاريخ البطاركة لساويرس أبن المقفع وعموما فالأسلام وقرآنه وشكك المسلمين فى العقيدة المسيحية ذاتها التى جاءت قبل الأسلام بــ 600 سنة ومحمد لم يحضر ميلاد المسيح وصلبه وحتى القرآن ليس له اصول مثل كتاب تاريخى مثل كتاب تاريخ البطاركة فهذا ليس بجديد عليهم ."
archived = "2009-05-22"
