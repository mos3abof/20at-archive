text = "المـــــــــــر اجع<br />(4) كتاب تاريخ الامه القبطيه وكنيستها تاليف ا0ل0بتشر تعريب اسكندر تادرس طبعة 1900 الجزء الثانى ص 18<br />(5) وقد كتب عشرون مقالة هذا غير الميامر وتفاسير وأجوبة لمسائل وأسئلة لأبى البشر ابن جارود الكاتب المصرى … أسماء الكتب العشرين الذين كتبهم ساويرس المعروف بإبن المقفع – كتاب التوحيد , كتاب الإتحاد , كتاب الباهر رد على اليهود , كتاب الشرح والتفصيب رد على النسطورية , كتاب فى الدين كتبه الوزير قزمان إبن مينا , كتاب نظم الجوهر , كتاب المجالس , كتاب طب الغم وشفا الحزن , كتاب المجامع , كتاب تفسير الأمانة , كتاب التبليغ رد على اليهود وكيف تقوم النفسين , كتاب الإستيضاح وهو مصباح النفس , كتاب السير , كتاب الإستبصار , كتاب ترتيب الكهنوت الإثنى عشر طقوس البيعة , كتاب إختلاف الفرق , كتاب الأحكام , كتاب إيضاح الإتحاد – وربما هناك أسماء أخرى للكتب السابقة وربما أيضاً هناك إسمين لكل كتاب<br />(6) وتذكر مخطوطة بدير الأنبا أنطونيوس مكتوبه بخط اليد أن جبل المقطم أطلق عليه أسم المقطع أو المقطب وسُمى بذلك لأن سطحه كان متساوياً أى متصلاً فأصبح بعد نقله ثلاث قطع واحده خلف الأخرى ويفصل بينهما مسافة لهذا أطلق على المقطم أسم المقطع أو المقطب وكل هذه الأسماء تعنى معنى واحد . وقد ذكر أسم جبل المقطم على أنه جبل واحد فى جميع مراجع المؤرخين التى تؤكد أنه كان جبلاً واحداً ثم تقطع أو تقطب وقد ذكر الجبل المقطم فى كتب المؤرخين فيقول : أيمن بن خُرَيْم الأسدى (ت 80 هــ): \" رَكِبْتُ مِنَ الْمُقَطَّمِ فِي جُمَادَى إِلَى بِشْرِ بْنِ مَرْوَانَ البَرِيدَا \" يقصد أنه سافر من مصر حيث كان عبد العزيز بن مروان واليا، إلى العراق الذى كان يتولاه أخوه بشر.<br />وقيل أن الجزء الذى نقل من المقطم هو جبـــل الجيوشى , وما زال المثل المصرى يردده العامة عند مواجهتهم أى مشكلة صعبة فى مصر وهو : \" دا جبل الجيوشى أتنقــــــل )"
