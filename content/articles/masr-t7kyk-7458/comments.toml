text = "بالله عليكى متنقلى الهرم ولا خلى شوشو بيه ئصدى اللى كان ظابط وبعد كده شوشو بئه رئيس مجلس الهبل المو[ *** ]ين ينقل الهرم ولا يردم ترعة المريوطية ئصل بتجيب ذباب لاصحاب الفيلات واكيد هيظبتوه شوشو بالفلوس بدل مايمس دماء غلابة المسيحيين واللى اكيد منعهم من زريبته (جنته) لانهم فقراء واعطى نصف الزريبة لسويريس وعاءلته الموقرة اما الفقراء فملهمش مكان هو ده دينكم دين الهبل على المجانين ياكلبة ياحقيرة يازبالة لو اهلك مربوكيش وده اكيد عشان بيت الدعارة ( الكنيسة) هوه اللى مربيكى نعلمك احنا التربية تانى مستعدين نوريكى"
