text = "بص يا اللى فاكر نفسك عاقل تصدق ضكتنى على هبل اهلك دة<br />بس ما علينااولا : لم نفس اهلك ومتفتيش فى حاجة اكبر من سنك وكل معلوماتك اتحداك لو وفيها معلومة صح بس انت عايز تعمل نفسك عاقل وانت اصلا اغبى حيوان على وجة الكرة الارضية علشان مينفعش اقول انسان هظلمك طبعا ومعنديش وقت افهم اغبية زيك<br />ثانيا : غريبة انك شكلك منهم ومعلقتش على حمادة ولا متعرفش حد بالاسم دة غيرتوة ولااية يالة انت<br />ممكن برضة اصل التغير مطلوب new look<br />وكمان لو عايز تحسسنى انك بتفهم ولونة معتقدش هاتلى معجزة واحدة بس عرفتة تعملوها بغض النظر عن الشجرة اللى انتوا قصينها علشان تاخد شكل الشهادة حكايات الف ليلة وليلة بتاعتكم دة<br />تجبلى معجزة ببراهين بس يا حراااااااااام هتقعد كتير تتدور ومش هتلاقى بس علشان تعرف انكم الجهل بعينة بس بتضحكوا على نفسكم واحنا كمان بنضحك عليكم برضة اى حاجة تسلى الواحد احسن من ازازة اللب بااااااااااااى<br />اة سورى نسيت بلاش قلة ادب امك دة يا خفيف الدم علشان بس الواحد مش طالبة معاة خنقة يا بتاع ترعة الزمر وانت شكلك كدة بولاق اوسخ منطقة فى مصر والعالم كلة فى 600000000000000 00000 داهيةةةةةةةةةةة ةةةةةةةةةةةةةةة ةةةةةةةةةةةةةةة ةةةةةةةةةةةةة"
