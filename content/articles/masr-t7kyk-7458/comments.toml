posted = "2009-03-17"
text = "جدال دينى بين يهودى ونائب البطريرك أمام الخليفة المعز لدين الله الفاطمى ينتهى بنقل جبل<br />من هوالأنبا ساويرس أسقف الأشمونين المعروف بإبن المقفع ؟<br />وحدث أن وزير المعز اليهودى الذى أسلم يعقوب إبن كلس كان له صديق يهودى إسمه موسى وحصل على نعم ورزق وفير من الخليفة لأجل صداقته لوزيره فلما رأى محبة الخليفة للبطرك ومركزه عنده إشتعلت الغيرة فى قلبه وحسده وأعد خطه شريرة فقال للمعز : \" أنا أريد أن تحضر البطريرك واجادله بين يديك (أمامك) ليظهر لك حقيقة دينه \" فلم يقل المعز للبطريرك ما قاله موسى بالضبط ولم يعٌرضه لهذ المناقشه حتى لا تهتز مكانته لمحبته له فقال له : \" إن رأيت أن تحضر أحد أولادك الأساقفه يجادل اليهودى فإفعل \" فإتفقوا على يوم يحضروا فيه لمناقشه اليهودى .<br />وإجتمعوا فى اليوم المحدد وكان من حاضر مع الأساقفة أسقف الأشمونيين قديس وعالم بالكتب المقدسة إسمه ساويرس ويعرف بإبن المقفع وكان كاتبا ينسخ الكتب المقدسة ويعمل فى دواوين الدولة وهذا الأسقف له حوادث وأخبار وتاريخه نسقه بعد مماته الأسقف ميخائيل الذى كان أسقفاً لمدينة صان الحجر ( محافظة الشرقية حاليا ) وهو مؤرخ شهير لكتاب تاريخ البطاركة ويوجد منه نسخة موجودة باللغة الاتينية جمع وتأليف المؤرخ رنودوت ولم يرسم ساويرس إلا فى عهد الأنبا أفرايم القصيرة (4) وأعطاه الرب نعمة وقوة فى اللسان العربى حتى أنه كتب كتباٌ كثيرة وميامر ومجادلات (5) وكثيراً ما كان يجادل قضاة من شيوخ المسلمين بأمر من المعتز فأفحمهم بقوة حجته ومناورته وشدة المنطق والفلسفة والبلاغة التى كان يتكلم بها<br />وحدث فى إحدى هذه المجادلات أنه كان يجلس عند قاضى القضاة من شيوخ المسلمين وأئمتهم فعبر أمامهم كلب وكان يوم الجمعة وكان كثير من الناس مجتمعين فقال قاضى القضاة : \" ما قولك يا سويرس فى أمر هذا الكلب أهو نصرانى أم مسلم ؟ \" فقال له : \" إسأله فهو يجيبك عن نفسه\" فقال له القاضى : \" هل الكلب يتكلم ؟ \" ولكن نريدك أنت أن تقول لنا \" فقال : \" نعم لهذا يجب أن نجرب هذا الكلب وذلك ان اليوم يوم الجمعة والنصارى يصوموا ولا ياكلوا فيه لحم فإذا إنتظروا فى العشيه يشربوا النبيذ والمسلمين لا يصوموا ولا يشربوا النبيذ وياكلوا اللحم فضعوا أمام الكلب لحماً ونبيذاً فإن أكل اللحم فهو مسلم وإن لم ياكله وشرب النبيذ فهو نصرانى \" فلما سمعوا كلامه تعجبوا من حكمته وقوة حجته وتركوه فى خزى شديد .<br />الأنبا ساويرس إبن المقفع أمام المعز<br />وفى اليوم المختار ذهب إلى قصر المعز الأنبا أفرآم ومعه الأنبا ساويرس إبن المقفع فجلسوا فى حضرة الخليفة المعز وجلسوا صامتين مدة طويلة حتى قال لهم المعز : \" تكلموا فيما إجتمعتم من أجله \" ووجه نظره إلى البطرك قائلاً : \" قل لنائبك أن يقول ما عنده \" فقال البطرك للأسقف : \" تكلم يا ولدى فإن الرب يوفقك \" .. فقال الأسقف للملك المعز : \" لا يجوز الكلام مع رجل يهودى جاهل أمام أمير المؤمنين \" فقال له اليهودى : \" أنت تحط من قدرى وتعيبنى وتقول فى حضرة أمير المؤمنين إنى جاهل \" فقال له الأسقف الأنبا ساويرس إذا ظهر الحق لأمير المؤمنين فلا تغضب \"<br />فقال المعز : \" لا يجوز أن يغضب أحد فى المجادلة بل ينبغى للمجادلين أن يقول كل واحد منهم ما عنده ويوضح حجته كيفما شاء \" فقال الأسقف أنا لم أشهد عليك يا يهودى بالجهل بل نبى كبير جليل عند الرب هو الذى شهد بذلك \".. قال له اليهودى : \" ومن هو هذا النبى ؟ \" .. قال له : \" أشعياء النبى الذى قال فى أول كتابه عن الرب : الثور يعرف قانية والحمار عرف مزود سيده أما إسرائيل فلم يعرفنىوالشعب الجاهل لم يفهمنى \" فقال المعز لموس اليهودى : \" هل هذا صحيح ؟ \" قال : \" نعم هذا مكتوب \" قال الأسقف : \" أليس الرب هو القائل أن البهائم والدواب أفهم واعقل منكم ولا يجوز لى أن أخاطب فى مجلس أمير المؤمنين دام عزته منْ تكون البهائم والحيوانات أعقل منه وقد وصفه الرب بالجهل \" فأعجب المعز بالجدال وأمرهم بالإنصراف<br />وإستحكمت العداوة بين الفريقين وأصبحت نفس الوزير اليهودى مريرة من الغضب وذهب ليبحث عن ثغرة فى الإنجيل لأن الأقباط تغلبوا على اليهودى عند المعز وبعد بضعة ايام دخل الوزير اليهودى عند المعز وقال : \" مكتوب فى إنجيل النصارى: من كان فيه إيمان مثل حبة خردل فإنه يقول للجبل إنتقل وإسقط فى البحر فيفعل والنص الإنجبلى هو: لو كان لكم إيمان مثل حبة خردل لكنتم تقولون لهذا الجبل إنتقل من هنا إلى هناك فينتقل ( متى 17 ك 20 ) فليرى أمير المؤمنين رأيه فى مطالبتهم بتنفيذ هذا القول لأنه من المستحيل أن يتم هذا وإنه كذب فإن هم لم يفعلوا فلنفعل بهم ما يستحقوه على إيمانهم الكاذب \" فلنختبر النصارى بهذا القول ولنا فى ذلك إحدى فائدتين فإن صح زعمهم به فهذا جبل مكتنف القاهرة سمى فيما بعد بالمقطم (6) وإذا إبتعد عنها كان هوائها أنقى ومناخها أجمل ون[ *** ]ب مكاناً نبنى فوقه المدينه ونوسعها , وإن لم يصح كان المسلمون أولى بمساكن هؤلاء الكفرة والإستيلاء على أملاكهم وإذا طردناهم ومحونا أثرهم من الوجود ويبقى لا ذنب علينا من قبل الله .<br />فوافقه المعز وأرسل فى طلب الأنبا أبرآم البطريرك وقال له : \" ماذا تقول فى هذا الكلام , هو فى إنجيلكم أم لا ؟ \" فقال البطريرك : \" نعم هو فيه \" قال له : \" هوذا أنتم نصارى ألوف ألوف وربوات ربوات فى هذه البلاد وأريد أن تحضر لى واحد منهم تظهر هذه الآية على يدية وأنت يا مقدمهم ( رئيسهم ) يجب أن يكون فيك هذا الفعل وإلا أفنيكم وأمحيكم بالسيف أو أمامك ثلاثه لتختار إما قبول الإسلام أنت والنصارى أو هجر البلاد ( طرد الأقباط من البلاد) أو نقل جبل الشرقى [تحكي السجلات المسيحية أن جبل المقطم في فترة العهد الفاطمي منذ عام‏969‏ م كان يسمي الجبل الشرقي وطلب المعز لدين الله الفاطمي من الأنبا أبرام السرياني بطريرك الأقباط نقل الجبل الشرقي ] ( سمى بعد ذلك بالمقطم (7) \" ( المساحة الأرض المسطحة التى نقل الجبل الذى نقل منها وإستغلها المعز فى إنشاء القاهرة أنظر أسفل الصفحة حاشية(<br />.. حينئذ ذهل البطرك وخاف خوفاً عظيماً ولم يدرى بماذا يجيبه وألهمة الرب فقال : \" إمهلنى ثلاثة أيام حتى أبحث وأطلب من الرب إله السماء أن يطيب ويسر قلب أمير المؤمنين على عبيده \" .. وعاد البابا إلى منزلة بمصر وأحضر الكهنة والآراخنة بمصر وجميع الشعب القبطى وعرفهم ما حدث وهو يبكى .<br />وجزع النصارى لهذا النبأ ولبس كبارهم وصغارهم المسوح وفرشوا الرماد وذروا التراب على رؤوسهم وصرخ الشيوخ والأطفال إلى الرب وألقت الأمهات المرضعات صغارهن بلا رضاعة أمام الكنائس وصعد العويل والصراخ إلى الرب من كل حدب وصوب (9)<br />وحدث أنه كان فى بابليون (مصر القديمة) مجموعة من رهبان وادى هبيب (وادى النطرون) فأمرهم ألا يرحلوا إلى ديرهم ويمكثوا لمدة ثلاث ايام لمداومة الصلاة فى كنيسة السيدة العذراء بقصر الشمع المعروفة بالكنيسة المعلقة ليلاً ونهاراً فظلوا ثلاثة أيام ولياليها فى صوم وصلاة .<br />أما البطريرك صام صوماً إنقطاعياً فى الكنيسة المعلقة ولم يفطر طيلة النهار من الليل إلى الليل يأكل خبزاً وملحاً وماء يسير وظل واقفاً فى صلاه يبكى وتنهمر دموعه بين يدى الرب كل تلك الأيام ولياليها وفقد القوة على الحركة ولكنه جاهد فى الصلاه أكثر وفى صباح اليوم الثالث سقط البطرك القديس على الأرض من تعبه وحزن قلبه وصيامه الشديد وغفى غفوه قصيرة فرأى السيدة العذراء الطاهرة مارت مريم وهى تقول له بوجه فرح : \" ما الذى أصابك \" .. فقال لها : \" أنظرى حزنى يا سيدتى فإن ملك هذه الأرض هددنى قائلاً إن لم تفعل آية ومعجزة وتنقل جبل سأقتل جميع النصارى فى مصر وأبيدهم من خلافتى جميعاً بحد السيف \" ..<br />فقالت له السيدة العذراء :\" لا تخاف فإنى نظرت إلى دموعك التى ذرفتها وسكبتها فى كنيستى هذه , قم الآن وأترك المكان وأخرج من باب درب الحديد الذى يؤدى إلى السوق الكبير وفيما أنت خارج ستجد إنسان على كتفه جرة مملوءه ماء وستعرفة من علامته أنه بعين واحدة فإمسكه فهو الذى سوف تظهر عليه العلامه على يديه \" فإستيقظ البطريرك فى الحال وهو مرتعب وكان جالساً على الأرض فنهض بسرعة ولم يدع أحد يعلم بإستيقاظه وخروجه وذهب فى الطريق الذى ذكرته السيدة العذراء حتى وصل إلى الباب فوجده مغلقاً فشك فى قلبه وقال : \" اظن أن الشيطان لعب بى \" ثم دعا البواب ففتح له فأول من دخل من الباب كان هو الرجل الذى ذكرت علامته السيدة العذراء له فمسكه وقال له بمطاونه وظل يربطه بعلامة الصليب قائلاً : \" من جهه الرب , إرحم هذا الشعب ثم أخبره ما حدث فى إجتماعهم بالكنيسة المعلقه \"<br />العذراء تظهر للأنبا إبرأم فى كنيستها المعلقة بمصر القديمة وتخبرة عن القديس سمعان<br />الذى سينقل الرب على يدية جبل المقطم بالإيمان<br />فقال له الرجل : \" إغفر لى يا أبى فإنى إنسان خاطئ مخطوطة بدير الأنبا أنطونيوس ولم أبلغ هذا الحد ( يقصد من القداسة ) \" وعندما قال له ذلك اخبره البطريرك بما قالته السيدة العذراء مريم عند ظهورها له ثم قال له ما صناعتك وعملك فأراد أن يخفى أمره ولا يرد على السؤال فجعل عليه الصليب وربطه بالحروم بألا يخفى شيئاً ويحكى له قصة حياته وألا يكتم شئ – فقال : \" أنا رجل دباغ (10) ومن الألقاب الأخرى التى أطلقت عليه سمعان الخراز (10) وهذه عينى التى التى تراها أنا قلعتها من أجل وصية الرب فعندما نظرت لما ليس لى فى شهوة ورأيت إنى ماضى إلى الجحيم بسببها (11) ففكرت وقلت الأصلح لى أن أمضى من هذه الحياة بعين واحدة إلى المسيح خير من أمضى إلى الجحيم بعينين وأنا فى هذا المكان أعمل أجيراً لرجل دباغ وفى كل يوم آكل خبزاً قليلاً وبباقى أجرتى أتصدق للفقراء والمساكين نساء ورجال (12).. حتى هذا الماء الذى أحمله - أحمله لهم كل يوم قبل أن أمضى إلى شغلى وعملى وهم قوم فقراء ليست لهم قدرة على شراء الماء من السقا وأقوم فى مثل هذه الساعة المبكرة من كل صباح لأملأ جرتى ماء وأوزعها على الكهول والمرضى الذين أقعدتهم الشيخوخة أو المرض عن القدرة على إستجلاب الماء لأنفسهم ,<br />ولما أنتهى من خدمتى هذه أعيد قربتى إلى البيت وأذهب إلى عملى (13)– وباقى النهار أعمل دباغاً فى المدبغة وليلى قائم أصلى (14) وهذه هى حياتى وأنا أطلب منك يأبى ألا تحكى ما أخبرتك به لأحد فليست لى مقدره على تحمل مجد الناس بل الذى أقوله لك إفعله أخرج أنت وكهنتك وشعبك كله إلى الجبل الذى يقول لك الملك عنه ومعكم الأناجيل والصلبان والمجامر والشمع الكبير وليقف الملك وعسكره والمسلمين فى جانب وأنت وشعبك فى الجانب الآخر وأنا خلفك واقف فى وسط الشعب بحيث لا يعرفنى احد وإقرأ أنت وكهنتك وصيحوا قائلين : يارب إرحم .. يارب إرحم ساعة طويلة ثم إصدر أمراً بالسكوت والهدوء وتسجد ويسجدون كلهم معك وأنا أسجد معكم من غير أن يعرفنى أحد وإفعل هكذا ثلاث مرات وكل مرة تسجد وتقف ثم تصلب على الجبل فسترى مجد الرب \" .. فلما قال هذا القول هدأت نفس البطريرك بما سمعه .<br />وجمع البطريرك الشعب وذهبوا إلى الخليفة المعز وقالوا له : \" أخرج إلى الجبل \" فأمر جميع عساكره ومشيريه وحكماؤه ووزراؤه وكتبته وجميع موظفين الدولة بالخروج وضربت الأبواق وخرج الخليفه ورجاله وفى مقدمتهم موسى اليهودى .. وفعل البابا كما قال سمعان الدباغ ووقف المعز ورجاله فى جانب وجميع النصارى فى جانب آخر ووقف سمعان الرجل السقى خلف البطرك بثيابه الرثه ولم يكن فى الشعب يعرفه إلا البطرك وحده وصرخوا يارب إرحم مرات كثيرة ثم أمرهم البابا بالسكوت وسجد على الأرض وسجدوا جميعا معه ثلاث مرات وكل مره يرفع راسه يصلب على الجبل كان الجبل<br />يرتفع عن الأرض وظهرت الشمس من تحته فإذا سجدوا نزل الجبل وإلتصق بالأرض وحدثت زلزله إرتجت لها كل جهات الأرض – فخاف المعز خوفاً عظيماً وصاح المعز ورجاله : \" الله أكبر لا إله غيرك \" وطلب المعز من البطرك أن يكف عن ذلك لئلا تنقلب المدينة رأساً على عقب ثم قال المعز بعد ثالث مرة يا بطرك عرفت أن دينكم هو الصحيح بين الأديان فلما سكن الناس وهدأوا إلتفت البابا خلفه يبحث عن سمعان الدباغ الرجل القديس فلم يجده (15) ثم قال المعز للبطرك أنبا أفرآم : \" تمنى أى أمنية \" فقال البابا : \" أتمنى أن يثبت الرب دولتك ويعطيك النصر على أعدائك \" وسكت البطرك فكرر المعز ما قاله ثلاث مرات وأخيراً قال : \" لا بد أن تتمنى على شئ –<br />فقال البطرك إذا كان لا بد فأنا أسأل مولانا أن يأمر إن أمكن من بناء كنيسة الشهيد العظيم ابو مرقورة فى مصر القديمة لأنها لما هدموها لم يكن بإمكاننا أن نبنيها مرة أخرى وحولوها شونة قصب – والمعلقة بقصر الشمع إنهدمت حوائطها وظهرت الشروخ فيها فطلب الإذن بترميمها وإعادة ما تهدم منها \" فأمر المعز فى الحال بأن يكتب سجل ( أمر مكتوب من الخليفة) بالتصريح له بذلك – فلما قرأ سجل الخليفة عند أرض كنيسة القديس مرقورة لتبيه المسلمين فإجتمع أوباش الناس ( العامة) فعاد البطرك للمعز وأخبره بما حدث فغضب لذلك فركب حصانه فى الحال ومعه عساكره حتى وصل إلى مكان الكنيسة فوقف وأمر بحفر الأساس فحفر بسرعة كبيرة وجمعوا البنايين وحملت إليه الحجارة من كل مكان بأمر الملك المعز وبدأوا يبنون فلم يجسر أحد أن ينطق بكلمة إلا شيخ واحد كان يجمع هؤلاء الباعة فى الجامع ويصلى بهم ويحرضهم ويدفعهم لهذه الأعمال –<br />فألقى هذا الشيخ نفسه فى حفرة أساس الكنيسة وقال : \" أريد اليوم ان أموت على إسم الله ولن أدع أحداً يبنى هذه الكنيسة \" ولم يكن المعز موجوداً فذهب إلى هناك وأمر بأن ترمى الحجارة ويبنى فوقه فلما بدأ العمال برمى الجير والحجارة عليه أراد أن يقوم ويهرب فلم يسمحوا له جنود المعز بذلك لأن المعز أمر بدفنه فى الأساس الذى رمى نفسه فيه – ولما راى البابا القبطى ذلك نزل عن دابته وذهب إلى المعز يترجاه حتى يعفوا عنه وظل يترجاه والعمال يرمون فوقه الحجارة والطوب حتى أمر بإصعادة من الأساس وبمجرد أن لمست قدمة سطح الأرض حتى جرى وأفلت بعد أن أشرف على الموت وعاد المعز إلى قصره فلم يجسر أحد من المسلمين أن ينطق بحرف واحد إلى أن إنتهى بناء كنيسة الشهيد أبى سيفين وكذلك رمم وأصلح الكنيسة المعلقة وبنا كل الكنائس التى تحتاج إلى بناء أو تكملة وكذلك كنائس الإسكندرية بنا فيها أماكن كثيرة ولم يعترضه أحد من المسلمين ."
