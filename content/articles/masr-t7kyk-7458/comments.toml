text = "هل من عاقل يرى ما آل اليه الحال عندما لوى البعض عنق الحقيقة و حاول الصيد فى الماء العكر و إعطاء مساحة لا يستحقها هذا الأخ ما[ *** ] ميشيل , , يا سيد شريف الدواخلى ؛ أفضت و أسهبت في مدح السيد / ما[ *** ] و نشاطه و تبعك ضعفاء العقول فى تأجيج معركة غير موجودة أصلا , هل مثلا إذا تقدم شخص لمصلحة الأحوال المدنية طالبا إثبات صفته في البطاقة كرئيس للجمهورية أو حتى رئيس طابونة حمزة ! هل تقبل منه ذلك ؟ لقد علقت من قبل \" لا ينساق أحد وراء شيئ من هذا \" : \" يا سادة انتبهوا ؛ مصر بلدنا بتنهار فى كل المجالات . و يتضح الآن لأي عاقل أن ظاهرة ما[ *** ] ميشيل مدبرة ؛ سواء من جهات أمنية داخلية أو من جهات مخابراتية خارجية ؛ ياريت ما حدش يتهمني بأنى مريض بنظرية المؤامرة ! و على فكرة أنا أعتذر كمسيحي عما قاله البعض فى هذه المجادلات إساءة لنبي الإسلام محمد , و في تعليقي السابق أكدت أنني أحترم , و أكرر أحترم إيمانكم ؛ فقظ لا تطالبوني بأن أؤمن بما تؤمنون … و من يريد أن يكتشف الضرر البالغ الذي تسبب فيه السيد / شريف الدواخلى ليقرأ آخر التعليقات التى تمتلئ بالمساجلات البذيئة التى لا تزيد الناس إلا كرها و بغضا و تلهيهم عن أعدائهم المتربصين بهم عسكريا و اقتصاديا و دينيا أيضا ؛ و اليك يا سيد شريف اقرأ عناوين الجرائد ليوم الأربعاء 26 ديسمبر 2007 ستجد حكم محكمة القضاء الإدارى برئاسة المستشار/محمد الحسينى نائب رئيس مجلس الدولة برفض الاعتراف بطائفة السيد/ ما[ *** ] ثم اقرأ حيثيات الحكم \" بالغاء قرار و زارة الداخلية بمنحه بطاقة رقم قومى مدون بها صفته كأسقف للكنيسة , و أكدت المحكمة ان الكنيسة الأرثوذ[ *** ]ية على رأسها البابا شنودة و أضافت أن ثبوت الشخصية الاعتبارية للهيئات و الطوائف الدينية لابد من أن يكون بناء على اعتراف خاص من الدولة و ن القانون حصر الطوائف المسيحية و أوضح كيفية اختيار رأس الطائفة على وجه يحفظ حقوقها و أن يكون الاختيار معبرا عن ارادة شعب الكنيسة كما أن رأس الكنيسة يتم انتخابه من شعب الكنيسة ثم بقرار يصدر من رئيس الجمهورية … و أنه تبين للمحكمة ان المبنى الخاص بالكنيسة ( التابعة لما[ *** ] ميشيل ؛ اللى زاره فيها شريف الدواخلى) لم يرخص له ككنيسة , و إنما هو جمعية أهلية ليست مخصصة لممارسة الشعائر الدينية \" . يا ترى دلوقت حيطلع ناس يقولوا اقفلوا الكنيسة , و الا يمكن يحرقها بعض المتطرفين زي ما حصل و بيحصل , والا يا تري دي كنيسة تبع امريكا ؛ يعنى حماية أمريكية و الا يمكن أمريكا تقطع المعونة ؛ بالمناسبة هي قطعتها و الا لسة ؟ انظر يا سيد شريف و لاتكن أداة و معول هدم بل معول بناء و اليكم أحبائى المسلمين : \" من مصلحتنا جميعا أن نكون أنداء أقوياء , و لنوجه جهودنا لنبنى بلدنا أولا و نكون صفا واحدا ليحترمنا الآخرون ؛ و انظروا معى الى حال مجتمعنا العربي , هل فيه ما يرضي أحد منكم ؟ هل نحن نتقدم أم نتأخر ؟ و يؤسفنى بأن أقرأ نبأ مصرع بينظير بوتو فى حادث ارهابي خسيس , و لنتأمل لمصلحة من يتم هذا , و لمن لا يعرف منكم فهي ابنة رئيس وزراء با[ *** ]تان الأسبق \" ذو الفقار علي بوتو \" الذى انقلب عليه الجنرال \" محمد ضياء الحق \" و هو عميل مباشر للمخابرات الأمريكية ثم حاكمه بتهمة مزيفة ؛ محاولة ندبير اغتيال لأحد أعضاء البرلمان ( لم يمت ) و كانت المحاكمة مهزلة من نوع \" أنا سمعت \" و \" بيقولوا \" و حكم باعدام \" ذو الفقار على بوتو \" و أمريكا - يا حرام - ناشدت و طلبت تخفيف الحكم لكن الراجل الحقانى \" ضياء الحق \" - شايفين اسمه ؟ يا سلام ! \"ضياء\" و \"حق\" , راسه و ألف جزمة قديمة ان الحق لازم ياخد مجراه و تم اعدام \" بوتو\" , و على فكرة أعتقد انه تم اغتيال ضياء الحق فى تدبير عسكرى من ظباط فى الجيش البا[ *** ]تانى لاحقا , يا تري لسه فيه حد معترض علي صحة نظرية المؤامرة ؟ و الا تغلغل المخابرات فى مصائر الدول و الشعوب , طبعا أمريكا حتندد باغتيال \" بينظير بوتو \" و مش بعيد \" بوش بنفسه يحضر الجنازة , و مفيش مانع يعمل شوية بيزنيس فى المنطقة و فى النهاية . . . . . . أفيقوا يا سادة ! لا تنساقوا وراء من يبغى الخراب , لنظل مختلفين , و لكن ليحترم كل منا معتقدات الآخر . فعندما يحل الخراب - و هو أقرب مما تتصورون - لن ينجو أحد ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! !"
