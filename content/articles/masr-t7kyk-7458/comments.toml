text = "بسم الله الرحمن الرحيم<br />الى كل مسلم ومسيحى … بعيدا عن كلام ما[ *** ]يموس وغيره … هل تعلم ان الانجيل الاصلى الذى نزل على عيسى عليه السلام قد فقد فى زمانه وان كل الاناجيل الموجودة حاليا محرفة ؟ هل تعلم انهم يضيفون فيه و يرفعون منه مايشاؤون سواء شنودة او ما[ *** ]يموس ؟ هل تعلم ان علماء مايسمى بالكتاب المقدس اثبتوا فيه اكثر من خمسين الف خطأ ؟ هل تعلم ان قصصا مثل قصة ملاك الرب والبركة وقصة المرأة [ *** ] فى انجيل يوحنا ليست موجودة فى المخطوطات ؟ هل تعلم ان عدد اسفار الكتاب \\\" المقدس ؟ \\\" تختلف من كنيسة لاخرى اما زيادة او نقصان ؟ هل تعلم ان هناك عالم لاهوت امريكى يعد الاشهر فى العلم فى علم اللاهوت قد اجرى مؤخرا حوارا على قناة بى بى سى الانجليزية اعلن فيها انه ليس هناك اى اشارة فى المخطوطات او النسخ القديمة لكتاب النصارى تدل على صعود المسيح الى السماء … ولا حتى اشارة تفيد قيامته بعد الموت ؟؟؟ وهذين امرين قام عليهما الدين المسيحى وبدونهما لا يكون ايمان مسيحى ويكون ايمان باطل ؟؟؟ هذا الرجل بعد هذا الاعلان ترك المسيحية … لا نقول دخل الاسلام والحمد لله انه لم يدخل الاسلام بعد حتى لا يقال انه قال هذا لانه مسلم …"
