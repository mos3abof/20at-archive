text = "iهل أرضاك يا سيدى ما تفوهت به من بذاءات ؟ و هل هكذا تكون قد انتصرت لدينك ؟ أنل أطلب من جميع الداخلين على الموقع أن يدينوا هذا المستوى المتدنى فى الحوار , هل لى يا سيدى أن اقول أن كل اناء يتضح بما فيه , و من أين أتيت بتلك الكلمات الوضيعة لتتهم بها أصحاب ديانة تؤمن أنت بدون شك أنها سماوية , هل دخلت الى كنيسة و وجدت فيها شيئا مشينا ؟ ألا تعلم - و مؤكد أنك تعلم - أخلاق المسيحيين أقرانك و ماذا يدعون اليه من العفة و القداسة ؟<br />كان من الممكن لى أن اتجاهل تعليقاتك و كان من الممكن أيضا أن أرد بنفس المستوى من الشتائم و لكن عندى أمل أن ا[ *** ]ب عقلك و قلبك لأن كل انسان مهما بلغ فى غيه يوجد لديه ضمير يبكته , فياليتك ان كنت تشعر بمدى ما أذنبت فيه أن ترفع صلاة لله لكى يظهر لك ما هى المسيحية و من هم المسيحيون الذين تتهمهم باطلا - و أنا بالرغم من كل شيئ أصلى لأجلك ."
