text = "يا شباب صلو على الحبيب محمد<br />انا تقريبا اقتنعت بالدين الاسلامي<br />و لكن عندي كم سؤال اريد اجابتهم قبل دخولي للاسلام<br />اذا اتاني الجواب عليهم سوف ادخل<br />1: كم رجل قام برضاعة ثدي عائشة تحت غطاء فتوى رضاع الكبير ؟؟<br />2 : هل كانت تحب عملية الرضاعة و تكتفي بها ام انها كانت تطلب المزيييييييد<br />3: لماذا قام محمد بممارسة الجنس مع زوجة عمه و هي في القبر ميتة ؟؟؟<br />4 : لماذا كان الوحي يأتي لمحمد كثيرا و هو نائم على فخذ عائشة ؟؟؟<br />5 : والد محمد كان اسمه عبد الله و هذا يعني انه ليس وثنيا . يا هل ترى ماذا كان دينه ؟؟؟<br />6 : هل ما يقال صحيح انه بقيت النطفة في رحم ام محمد 4 سنين و بعدها تخصبت ؟؟<br />7: هل كان لون الحجر الاسود ابيض ؟؟ و من دم الطمث صار اسود ؟؟<br />انا باتظاركم يا اولاد العاهرات لتردوا على اسئلتي<br />عندي الكثير و لكن سوف اكتفي بهذه الان<br />انا ناطر<br />بدي اشوف اي كلب رح يرد<br />ايري بالحجر الاسود"
