text = "[quote name=\"اكتب اسمك هنا\"]************** *************** *************** *************** *************** *************** *************** *****<br />أعتمدنا فى هذا المرجع إلى أمهات الكتب المسيحية والأسلامية بدون تحيز بالرغم من أن الكتب الأسلامية التاريخية محشوة بالبروباجاندا الأسلامية كما أن بعض أمهات الكتب التاريخ الأسلامية كتبت تاريخ الحدث بعشرات السنين قد تصل إلى سنتين quote]<br />كلامك كله خرافة والدكتور على الريس رد علي كلامك وفنده كله في كتاب<br />كتاب نقل جبل المقطم معجزة أم خرافة ؟<br />كتاب نقل جبل المقطم معجزة أم خرافة ؟ - الأستاذ على الريس - لإثبات عدم تحرك جبل المقطم والرد علي كل من يقول بتحرك الجبل وأنه ليس أكثر من خرافة ولا أصل لها http://eld3wah.net/play.php?catsmktba=3559"
