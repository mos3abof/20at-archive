text = "بسم الله والصلاة واتلسلام على رسول الله محمد بن عبد الله النبي الامي خاتم الرسل الذي ارسله الله عز وجل ليكون للعالمين بشيرا ونزيرا وليس للعرب فقط بل للعالمين اي لجميع البشر<br />انما قضية حب المسلم للنصراني وقضية حب اخوك المسيحي دي قضية قديمة جدا ومينفعش اصلا ان اقول اخويا المسيحي ليه بقا اقول ليه لان ربنا ذكر في القران الكريم بعد اعوذ بالله من الشيطان الرجيم (لقد كفر الذين قالو ان الله هو المسيح ابن مريم)(المائدة:17)وعجبي على اللي عايز اللي بيقول ان لا اله الا الله مع اللي بيقول المسيح ابن الله مع اللي بيقول العزير ابن الله يلا ماهي سمك لبن تمر هندي<br />والمرء مع من احب فمن احب محمدا صلى الله عليه وسلم وصحبه حشر معهم ومن احب ما[ *** ]يموس حشر معه (ولن ترضى عنك اليهود ولا النصارى حتى تتبع ملتهم قل ان هدى الله هو الهدى ولئن اتبعت اهوائهم بعد الذي جائك من العلم مالك من الله من ولي ولا نصير)البقرة :120)<br />واخيرا انا لله وانا اليه راجعون"
