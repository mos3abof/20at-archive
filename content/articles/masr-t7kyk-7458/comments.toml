text = "اقتباس مبخفش من حد الا الله:<br />بالله عليكى متنقلى الهرم ولا خلى شوشو بيه ئصدى اللى كان ظابط وبعد كده شوشو بئه رئيس مجلس الهبل الموكسين ينقل الهرم ولا يردم ترعة المريوطية ئصل بتجيب ذباب لاصحاب الفيلات واكيد هيظبتوه شوشو بالفلوس بدل مايمس دماء غلابة المسيحيين واللى اكيد منعهم من زريبته (جنته) لانهم فقراء واعطى نصف الزريبة لسويريس وعاءلته الموقرة اما الفقراء فملهمش مكان هو ده دينكم دين الهبل على المجانين ياكلبة ياحقيرة يازبالة لو اهلك مربوكيش وده اكيد عشان بيت الدعارة ( الكنيسة) هوه اللى مربيكى نعلمك احنا التربية تانى مستعدين نوريكى<br />يا ابن المنيوكة والشر موطة .. أمك منتكة بكل مساجد القاهرة<br />يا ابن الكلب بترضى امك او اختك ارضع منها مشان تصير أختي .. اذا بترضى ابعتلي اياها مشان ارضع مزبوط<br />بدي انيك اختك يا ابن الدعارة"
