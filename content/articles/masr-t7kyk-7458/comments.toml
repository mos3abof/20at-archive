text = "يؤسفنى انى ارد عليك وانزل لمستواك الفكرى ولكن للضرورة احكام تقتضيها اولا ياريت تحترم نفسك وبلاش اسلوب فرش الملايه ده ؟ وخليك مؤدب وبلاش حكاية امك وخالتك ونظام الشراغيش والشماشرجيه اللى انت واخد عليه ده ثانيا انت بتتحدانى ان كلامى مش صحيح وانا قبلت التحدى —- اتفضل افحمنا ياعم العلامه وقولنا فى اى عام مات المعزلدين الله الفاطمى وقولنا المصدر اللى بتكتب منه وبالمره احكينا حكاية سمعان الخراز وكانت سنة كام ؟ لو سمحت جاوب بدون طولة لسان —- س2 من كان وزير المعز لدين الله الفاطمى يعقوب ابن كلس ام جوهر الصقلى ؟؟ يارب تنفك عقدة لسانك وتجاوب —- س3 اى من المؤرخين القدامى بخلاف الفريد باتلر ذكر هذه الواقعه؟ على فكره حتى اكون منصفا فالفريد باتلر نفسه سمى هذه الواقعه اسطوره اى انه لم يقتنع بها ولكن مرقس باشا سميكه سنة1930 اراد ان يؤرخ لها على انه حقيقه ولكن المحقيقين كانوا له بالمرصاد وصار على نفس المنوال صاحبنا عزت اندراوس —— ثالثا او رابعابخصوص المعجزات س1 ماهى المعجزه التى اتى بها يوحنا المعمدان وهو اعظم انسان ولد فى هذه الارض فى زعمكم—- اتفضل جاوب ملحوظه هناك فى بلاد التبت والهند الناس ياكلون الحجاره والزجاج وعندنا فى مصر احمد فرعون بياكل الزجاج والصفيح ومعدته بتهضم الزرنيخ ابقى روح اعبده بقى؟؟ —— س3 ماهى المعجزه التى وعد الله بها انها ستكون مع النبى الاتى الى العالم —— اقطع دراعى ماهتعرف طبعا؟؟ اتدرى ماهى هذه المعجزه انها ليست احياء الموتى ولا شفاء المرضى اتدرى ماهى—- انها الكلام — نعم الكلام ؟؟ انا لا افترى على الله ولكن هذا هو كلام الله ارجع الى سفر التثنيه اصحاح 18 ستجد (واجعل كلامى فى فمه)وهذه هى العلامه الوحيده للنبى الاتى الى العالم لانها ستكون معجزته فانها المعجزه الوحيده الباقيه الى يوم القيامه —فكل معجزة تموت بموت صاحبها فنحن لم نشاهد معجزات موسى وعيسى عليهما الصلاة والسلام ولكن معجزة محمد (صلى الله عليه وسلم باقيه الى يوم الدين وكذلك مازال التحدى قائم (قل لئن اجتمعت الانس والجن على ان ياتوا بمثل هذا القران لا ياتون بمثله ولو كان بعضهم لبعض ظهيرا ) اما المعجزات التى هى خوارق للعادات الوقتيه فهى تفنى بفناء صاحبها —يارب تكون فهمت—- خامسا عايزنى اعلق على كلمة حماده واضح انك عايز تستظرف بس مش عارف ———- يعنى اتريقلك على اسم قديسك المعظم بولس واسميه(بوول) واطلب منك التعليق واضح انك ماعندكش ملكة مقارعة الحجه بالحجه فعايز تقلبها تهريج وخلاص——— سادسا انا مش من بولاق ولا من ابو اتاتا ولا من عزبة الصفيح بس يشرفنى انى اكون من منطقه فيهم لان الانسان بذاته وليس بسكنه وقديما قال احد العظماء(للثعالب اوكره ولطيور السماء اغصان تاوى اليها وانا لا اجد موضع اضع راسى فيه) ابقى اشتمه هو الاخر او اغلط فيه حاكم انا عارفك لسانك اعمى زى قلبك ——- اما بالنسبه للشجره اللى عليها الشهادتين فنحن المسلمين اللى انكرنا هذا الكلام ورفضنا هذ الاسلوب ولم نتمادى فيه ونضحك على البسطاء ونعيشهم فى الوهم زى موضوع صاحبنا الخراز اللى فقع عينه بالمغراز ونقل جبل المقطم ——على كل حال اعلم ان لكل شبهة رد ومقال وان عاد العقرب عدنا بالنعال"
