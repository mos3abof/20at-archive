text = "الأخ العزيز ( عاقل في دنيا المجانين ) - على فكرة - انت كتبتها مرة ( مجنون فى دنيا العقلاء)- تحياتي و بعد : ؛ لو لم تثمر كلماتي شيئا سوى ردك هذا لكفانى ذلك ؛ و لو لم يثمر النقاش عن شيئ سوي جعلك - أنت و الآخرين - تقف و تفكر في هذا المخطط الشيطاني الذى يحاك و نحن عنه غافلون لاستحققت عنه ثوابا عظيما , و أطمئنك يا صديقى العزيز و أؤكد للجميع حقيقة لا ينكرها أحد و هى الاحترام المتبادل بين المسيحيين و المسلمين في معظم الأحيان و الأنحاء ؛ أما ما يحدث من طائفية فسببه العصبية و لا يخفى على أحد ما يستفيده البعض من مشاجراتنا معا , و سأسوق لكم مثالا غريبا : هل ركب أحدكم المينى باصات الجديدة اللى التذكرة بجنيه و عشرة صاغ , و هل حضرتم الخناقات بين الركاب و السواق اللى بيصمم ياخد العشرة صاغ لكن مابيصممش يدى الناس الباقى , ده مثال للى عايزاه السلطة ؛ يتخانق السواق و الركاب على حاجة بسيطة ؛ و بالمناسبة مالهاش حل ! لغاية ما واحد يقول \" ياريت كانوا خلوا التذكرة بجنيه و ربع بدال الخناق و البهدلة \" يعنى الحكومة تخللي الناس تطلب زيادة سعر التذكرة , و الا بقى يا سلام يطلع قرار سيادي بتوجيهات سيادة الرئيس بخفض التذاكر لجنيه واحد و يبقى سيادته هو صاحب الحل يا ريت يا جماعة يوعى كل واحد منا للدور اللى مفروض يعمله , فى عمله و فى مجتمعه و فى وطنه ؛ و أول كل شيئ يسأل نفسه : إيه الفرق بينى كعامل أو مهندس أو دكتور أو مدرس أو ,, أو ,, و بين العامل و المهندس و الدكتور و المدرس و ,, و ,, فى الهند أو ماليزيا ؛ مش حأقول الصين و لا تايوان و لا كوريا و ليه هم فوووووق و احنا ؟؟؟؟؟ ليه الهند من أعلى عشر دول فى التقدم العلمى ! تصوروا ؟ الهند ! و فى الآخر تيجى احدى الجرائد تنشر خبر عن وزير البيئة : \" العالم يستمع لتجربة مصر فى مواجهة التغيرات المناخية \" يعنى احنا - بتوع السحابة السوداء , و تلويث مياه النيل و المبيدات المسرطنة - بنحكى للعالم و العالم بيسمع تجربتنا ّ! شفتم فكاكة بالشكل ده ؟ فى النهاية ليعمل كل منا فى نطاقه و ليحاول أن يجتهد و يطور حتى لو جاهده كل من حوله , فربما يتصلح حال البلد اذا شعر كل منا بمسؤليته تجاه وطنه و تجاه ربه و تجاه أجيال قادمة لن نترك لها - لو ظل حالنا كما هو - سوى أطلال وطن !"
