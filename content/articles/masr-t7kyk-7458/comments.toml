author = "عاقل فى دنيا المجانين"
posted = "2007-12-26"
text = "يامعتوه ياجاهل ياجهول ياا جهل الجهلاء افهم الكلام و بعد كده ابقى رد : جبل مقطم ايه اللى اتنقل يامتخلف هما بيضحكوا عليكو بحكايات هبله زى دى وبتصدقوها : ذنبنا احنا ايه؟ يامتخلف الحكايه مرويه على موقع الجاهل عزت اندراوس روح اقراها وانت تعرف مافيها من كذب وتخريف اسمع وافهم ياجاهل واشك انك هاتفهم : اولا الخرافه بتقول ان سمعان الجزمجى او الدباغ اوالخراز او زى مايكون : عمل المعجزه الرهيبه دى سنة 982م من اجل افحام يعقوب ابن كلس اليهودى وزير المعزلدين الله الفاطمى بسبب وجود ايه فى الانجيل بتقول اذا قال احد للجبل انتقل من مكانك وفى قلبه ايمان لانتقل الجبل من مكانه فامر المعز بطريرك النصارى فى زللك الزمان ان ينقل الجبل تحقيقا للايه فتحير البابا حتى جاءته العدرا فى المنام ودلته على صاحبنا الدباغ اللى قام بالواجب ونقل الجبل امام الخليفه وجموع الشعب المصرى المسلم وبناء عليه امر الخليفه بهدم المسجد وبناء كنيسه مكانه وبقى مسيحى كمان ؟؟؟؟؟؟؟؟ ياسلااااام ؟؟؟؟؟ ثانيا اسمع ياجهول تعرف المعزلدين الله الفاطمى مات سنة كام والله العظيم ماتعرف! !!!! مات سنة 975م واتحداك لو اثبت لى خلاف زلك؟ ثالثا تعرف الوزير يعقوب ابن كلس كان وزير لمين!!! والله العظيم ماتعرف برضه !!!! لكن هاقو لك والاجر على الله : ده عمره ماكان وزير للمعز لدين الله ابدا لانه ببساطه كان وزير للعزيز بالله ابن المعز لدين الله ولكن الفريد باتلر الكذاب مخترع هذه الخرافه خلط بين الاب والا بن فى الروايه يظهر ان فكرة التجسد كانت مسيطره عليه فظن ان الاب اللى مات من ست سنوات تجسد فى الابن الحى ومافى فى زلك من خزعبلات تؤمنون بها؟اخيرا ايها الابله من ذا الخليفه المسلم الذى يهدم مسجدا ويبنى مكانه كنيسه ؟؟؟؟ والله وبالله وتالله ( لقد جئتم شيئا ادا تكاد السموات تتفطرن منه وتخر الجبال هدا ) خليفة المسلمين يهدم المسجد ليبنى مكانه كنيسه ومع زلك لايذكر اى مؤرخ اوكاتب او حتى بشكاتب هذه الداهية الدهياء والمصيبة الصلعاء ؟؟ والمعز لدين الله كان له من الاعداء الكثيرين وقد سبوا الفاطميين ووصفوهم باشنع الالفاظ ومع زلك لم يجروء مؤرخ واحد او حتى نصف مؤرخ ان يتهم الرجل بانه حول المسجد الى كنيسه !! ولكن الفريد باتلر وفريد سميكه وعزت اندراوس عايزين كده هما احرار ؟؟ وعلى فكره ياعم الايه لسه موجوده فى الانجيل ماتحرفتش والتحدى مازال قائما : هاتونا اتخن بابا او اجعص دباغ اوخراز او حتى شيال من محطة مصر وخلو ه يرجع الجبل مكانه ؟؟ بلاش دى ليكون الجبل تقيل شويه عليه —- ياريت ينقل لنا ترعة الزمر او المريوطيه ويوفر علينا مشقة ردم الترع وساعتها مش هايؤمن بيه الخليفه وبس لاء ده كل الرعيه وساعتها والله العظيم كل مؤرخين الدنيا هيكتبوا عنه ومش هايهضمه حقه زى صاحبنا الخراز اللى كل المؤرخين اتعموا وماشفوش الجبل وهو بيتنقل من مكانه فتباّ لهؤلاء المؤرخين اللى اتصوا فى نظرهم وماشفوش الجبل وهو بيمشى على اربع رجلين ——- واخيرا فليسقط اصحاب العقول والدماغ ولتحيا خرافة سمعان الدباغ"
archived = "2009-05-22"
