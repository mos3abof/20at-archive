text = "الى الاستاز مخلص : اولا كل عام وانتم بخير بمناسبة اعياد الميلاد ثانيا برغم الاختلاف معك فى بعض النقاط الا انه من الواضح انك راجل وطنى حقيقى تقدر المسؤليه الملقاه على عاتق اخواننا المسيحين فى وطننا الام (مصر) وياليت كل مصرى مسلم كان او مسيحى ينتابه هذا الحس الوطنى الجميل وارجو ان تلتمس لنا العزر اذا قام احدنا ورد على احد المسيحين اللذين يتناولون ديننا او نبينا(عليه الصلاة والسلام) بالاساءه فهذا لن يرضاه اى مسلم كان : ثالثا ارجو ان تقرا تعليق الاخ المسيحى الذى تكلم عن موضوع جبل المقطم (فبحق الله العظيم ) لو ان هذا الشخص تكلم عن هذه الواقعه دون الاساءه لديننا ونبينا (صلى الله عليه وسلم) والله ماكنت كتبت كلمه تسىء اليه ولا كنت علقت على الموضوع من الاصل : واخيرا لتعلم اننا لسنا مع او ضد الا نبا م[ *** ]يموس فى قضيته مع الكنيسه ولكننا عبرنا عن اعجابنا بصراحة الرجل وشجاعته ومبادلته لنا نفس الشعور الا وهو الاحترام المتبادل رغم اختلاف العقيده وهذا مانفتقده للاسف مع اغلب شركائنا فى الوطن (الاقباط) ومع زلك لا ننكر ان هناك الكثيرين من الاقباط يستحقون الاحترام والتحيه لانهم اصحاب مبادىء وطنيه مشرفه وان اختلف معى بعض المسلمين او اتفقوا الا اننى احترم د|ميلاد حنا والاستاز امين اسكندر والاستاز جورج اسحاق والاستاز جمال اسعد عبدالملاك وكثير من النمازج المشرفه فى هذا البلد وارجو ان تقبل اعتزارى برغم انى لم اسيىء الى المسيحيه كدين ولكنى فقط كنت ارد على شخص اساء الى دينى ومعتقدى فكان لزاما على الرد : وفى النهايه ارسل لك تحيه خاصه متمنيا لك ولجميع الاخوه المسيجين عاما سعيدا والسلام عليكم ورحمة الله وبركاته"
archived = "2009-05-22"
