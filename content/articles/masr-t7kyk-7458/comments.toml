text = "الى كتب المقالة الطويلة بيتغزل فى الكائن ميشيل ما[ *** ] اسمع دى الى مالوش خير فى اهله… عموما يا حبيبى انت تعرف ايه عن الكنيسة او عن قداسة البابا شنودا غير من الاغبياء امثالك بيرددوا دولة ايه اللى من اسيوط ونازل انت عبيط المسيحيين عمرهم ما يحاربوا رعاع لان فى الى يدافع عنهم وهما مش عاوزين حاجة من الارض لان وطنا السما بس الشيطان واعوانه هم اللى عاوزين الارض حاول تقراء التاريخ وتعرف المسيحية ومن هم المسيحيين سمعت عن جبل المقطم مين اللى نقلوا الشيخ؟؟؟؟؟ ولا انسان مسيحى متواضع بلاش المعز لدين الله تعرف قلتم عنه ايه انه اتجنن عارف ليه لانه عرف المسيح وبقى مسيحى وتنازل عن الحكم لاعوان الشيطان اللى يحبوا الارض المسيحية عمرها ما كانت دين ودنيا لا دين وسما اسف ماعنديش وقت اشرح لاْمثالك ايه هى المسيحية اصل المسيحية مش بتحب العدد ( العدد فى اليمون ) اقراء التاريخ صح مش هاقولك من مصادر مسيحية لا من مصادر اسلامية متعلمة مش متخلفة …"
