text = "يا عبيط يا اهبل انت عامل نفسك فاهم وانت شكلك بيهمة اصلا اللى انت متعرفوش انة فعلا واحد احسن من بلدك دة كلها هو اللى نقل رالمقطم ومتتكلمش يا شاطر كلام اكبر من سنك اوكى<br />والوهم اللى بتتكلم عنة انت وامثالك اللىىعايشين فية اصلا وعيب تتريق على اسيادك وتقول بقال شكلك كدة بتيع فجل وجرجير على ناصية الخرابة بتاعتكم اقصد بيتكم يعنى مش علشان معندكمش معجزات ولا تعرفوة معنها اى حاجة تتريقوا والحقد والغل يملو قلوبكم اة نسيت هو اصلا مالى قلوبكم من زمانننننننننننن ننننن اوى من قبل ما تتتولد<br />اقولك امتى بالظبط لما ظاهر المحروس بتاعكم حمادة نيلة عليكم وعلية بلا و[ *** ]ة باااااااااااااى"
