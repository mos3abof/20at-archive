[[comments]]
order = 0
subject = "الله"
text = "دا ايه السلطنة دى.انا خلاص هحب من النهارده لو الموضوع كده.بس لو مطلعش الحب حلو.هادعى عليكم وكفايه عليكم الخياط وزلط."
archived = "2004-04-01"
capture_url = "https://web.archive.org/web/20040401085644/http://www.20at.com:80/article.php?sid=22"

[[comments]]
order = 1
subject = "سبحان الله"
text = "المقال جميل جدا وصادق وواقعي بس الحب مش فردوس مفقودالحب بين ايدينا خاصة اذا كان مرتبط بالله"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022135344/http://www.20at.com:80/article.php?sid=22"

[[comments]]
order = 2
subject = "مش فاهمه"
text = "و هل الحب الذى تفضل فيه ان تبتعد عمن تحب حتى تدوم العاطفه و حب لا تستطيع البوح به و حب يعيش الشخص فيه فى خياله اكثر من الواقع و ما الى هذا يعد فى رأيك عاطفه سويه يجوز ان نطلق عليها حبا. اشعر انك يلتبس عليك الحب و الاحساس بالشىء أيا كان نوع هذا الاحساس"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022135344/http://www.20at.com:80/article.php?sid=22"

[[comments]]
