subject = "احمد ماهر ماله...!"
author = "مروة"
posted = "2006-10-18"
text = "أحمد ماهر مين ال بيتكلم هو ايه اخر دور قدمه الممثل المغوار احمد ماهر وبعدين مين قال ان الفن ليه وطن ولا جنسية لو كان كده مكنش ممثل انجليزي عمل دور حمزة ابن عبد المطلب<br />حدائق الشيطان هو افضل مسلسل وجمال سليمان هيقعد الفخراني ونور الشريف في البيت"
archived = "2006-11-02"
