[[comments]]
order = 2
subject = "غباء مركز"
author = "قلم جاف"
posted = "2006-10-18"
text = "أعتقد أن فرضية عدم عرض المسلسل على القنوات المصرية فقط لأن بطله سوري هي ضرب من ضروب الغباء المركز .. تذكروا أن التليفزيون فتح أبوابه لمادلين طبر وجومانا مراد ، والحمد لله وجودهما زي قلته..<br />مع احترامي للدراما السورية ، أجد أن نظرتنا للنموذج الدرامي السوري مبالغ فيها للغاية .. وعندما نقلده كما يطلب الصحفيون الأكارم نجد النتيجة في قمة التخلف العقلي كما حدث في مسلسلي الطارق وعلى باب مصر ، لمخرجي الفظائع أحمد صقر وهاني إسماعيل على الترتيب!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132112/http://www.20at.com/article2.php?sid=1364"

[[comments]]
order = 3
subject = "الغـــــــــــولة"
author = "أحمد القطب"
posted = "2006-10-18"
text = "معلهش يا عم ماهر خيرها في غيرها وإن شاء الله السنة الجاية تعمل انت مسلسل \"ثكنات الشيطان\" وهانحط إسمك عالتتر وهانبسطك قوي..<br />أنا شايف ان جمال سليمان ممثل قدير أثبت وجوده من زمان قوي بس احنا اللي عايشين خارج الزمن، والممثلين الأشاوس بتوعنا لسة فاكرين ان ماينفعش حد ياخد بطولة مسلسل مصري ويتألق فيه إلا لو كان مصري الجنسية وأنا بالعكس شايف ان إعطاء بطولة مسلسل مصري لفنان سوري ده فخر لمصر ولصناعة الدراما فيها، لأنه بيبرهن على إن الفن والثقافية المصرية هما فن وثقافة العرب والمنطقة العربية كلها.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132112/http://www.20at.com/article2.php?sid=1364"

