text = "ياجماعة هوة كويس بس فى اللى احسن منه فين احمد عبدالعزيز وممدوح عبدالعليم وعلى راى احمد ماهر هوة كان المفروض مايتحطشعلى راس التتر لات اللى مفروض يتحط اسمه هوة دياب (رياض الخولى)والباقى فى المسلسل اكثر من رائع امانور الشريف فهوه عامل مسلسل اكثر من رائع ويارب يرجع لبوسى قابل ماغيرة ياخودها لانها زى القمر وعليها صدر يهبل مع السلامة"
