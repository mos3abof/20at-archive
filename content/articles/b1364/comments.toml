text = "واللة انا شايف ان احمد ماهر زعل بكلامة الفارغ ناس المفروض انهم كانوا بيحبوة وذلك لان الاستاذ جمال سليمان لولا شوية الهفتات البسيطة بسبب اللغة او اللهجة كان ياخذ فى المسلسل دة 10/10 ,ولو كان احمد ماهرعلى مقدرة من عمل دور زى دة كان هيكون فى كلام تانى.اقترح علية عمل فيديو كليب علشان غناة المرة دى معجبناش"
