[[comments]]
order = 11
subject = "من غير تحيز"
author = "معاذ"
posted = "2006-10-19"
text = "الحقيقة التي لا شك فيها هي أن جمال سليمان ممثل رائع وقدير وأنا منذ شاهدته في فيلم العندليب وأنا أراه موهبة كبيرة وقد أدى الدور بتمكن واقتدار فائقين وأقنعنا بكل انفعالاته وكان دقيقا جدا في أسلوبه وردات فعله طبعا كان واضحا بعض اللهجة السورية في الكلام جعلت من طريقته مختلفة عن بقية الأدوار الصعيدية وهذه وان اعنبرها البعض عيبا ولكني لا أرى فيها شيئا, فمن الذي قال أن ما يؤديه جميع ممثلينا في كل الأدوار الصعيدية القديمة والجديدة هو اللهجة الصعيدية الصحيحة والدقيقة.<br />هذا رأيي بصراحة في جمال سليمان وكان اختياره مناسبا للدور<br />ولا يمنع هذا من هناك ممثلين كثيرين يستطيعون تأدية هذا الدور على أكمل وجه وباقتدار أيضا ومنهم مثلا يوسف شعبان أو ممدوح عبد العليم أو رياض الخولي أو أحمد ماهر نفسه ولكن تم اختيار جمال سليمان وأدى المسلسل باقتدار وانتهى الأمر وليس معنى اختياره للمسلسل انكار لوجود أفذاذ في مصر يمكنهم تأديةالدور ولكن هذا الاختيار ما أرى منح المسلسل شهرة أكبر وصار الحديث عنه منتشرا كما نرى الآن.<br />أما بالنسبة لرأيي في أفضل من أدى دور الصعيدي فهم وبدون ترتيب مقصود لأنهم كلهم في رأيي على نفس المستوى:<br />يوسف شعبان في الضوء الشارد<br />ممدوح عبد العليم في الضوء الشارد<br />رياض الخولي في الفرار من الحب وفي حدائق الشيطان<br />صلاح السعدني في حلم الجنوبي<br />عبدالله غيث في ذئاب الجبل<br />جمال سليمان في حدائق الشيطان<br />حسن حسني في حلم الجنوبي<br />صلاح عبدالله في حدائق الشيطان......<br />نقطة كمان كلام أحمد ماهر غير لائق وميصحش يتقال أبدا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132112/http://www.20at.com/article2.php?sid=1364"

[[comments]]
order = 12
subject = "غيره واضحه"
author = "احمد ماهر اقحم نفسه في امر لا يخصه"
posted = "2006-10-19"
text = "الرأي الاول والاخير للجمهور و النقاد<br />مافيش اي حق لاي ممثل انه يحكم علي شغل زميله مهما كان<br />كل واحد وليه شغله كان احمد ماهر يعمل حاجه احسن واحنا نشكره مش يقعد ينتقد زميله<br />طبعا مافيش جنسية للابداع<br />عيب ان الكلام ده يطلع من فنان كبير زي احمد ماهر<br />لعلها كبوه<br />اما جمال سليمان ...... فله تحيه كبيره جدا علي أداءه الجميل \" مهضوم جدا جدا \" بصوره غير متوقعه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132112/http://www.20at.com/article2.php?sid=1364"

[[comments]]
order = 13
subject = "صعيدى _هوارى"
author = "يوسف الهوارى"
posted = "2006-10-20"
text = "اولا تحيه طيبه الى الفنان الجميل _جمال سليمان _الرجل الزى ابدع فى دور الرجل الصعيدى انا بصفتى صعيدى ابا عن جد عايش فى احى قرى مدينه قنا _التى اجرى بها بعض مشاهد المسلسل _ وبالتحديد _قريه الحميدات _والتى يقع بالقرب منهامبنى المحكمه و مبنى امن الدوله الزى صور به بعض المشاهد ايضا_المهم انى اقول وبكل ثقه ان الممثل القدير _جمال سليمان_من خلال دوره فى هزا المسلسل ويكانه كان عايش فى الصعيد منز ان ولد انه حقا ممثل قدير وانا بدورى اوجه كلمه للا ستاز الكبير _احمد ماهر انه اكبر من ان يقول هزه العبارات العنصريه _هزا مصرى وهزا سورى_لان الفن كان فى صباح وفريد الاطرش ولم نكن نسمع مثل هزه الاكازيبوفى النهايه تحيه الى مندور _بيه_ابو الدهب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132112/http://www.20at.com/article2.php?sid=1364"

