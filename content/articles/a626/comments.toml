subject = "موقع عشرينات"
text = "نشكركً يا أ.وائل على تفاعلك المثمر والدائم مع الموقع، وبالطبع نرحب بهذه الفكرة الجميلة، وننتظر منك هذه الصور، وننتظر من جميع زوارنا الكرام مثل هذه المبادرة الطيبة على البريد الخاص بالموقع : contact20at@yahoo.com"
archived = "2004-09-26"
