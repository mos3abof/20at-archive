[[comments]]
order = 6
subject = "وائل عباس"
text = "شكرا يا استاذة نونا<br />ويوفقك انت كمان ويوفق مساعي المسلمين الحميدة جميعا لمافيه خير الامة والاسلام<br />والارهابيين والجهلة لا<br />رجاء من الادارة متابعة التعليقات<br />لانكم ها تلاقوا فوق تعليقي ده واحد قليل الادب ومناخيره واجعاه يظهر حد حشرله فيها حاجة ... رجاء حذف التعليق لمنافاته ... كل حاجة واي حاجة ...<br />والحقيقة انا مش فاهم الاخ معترض على ايه بالضبط ؟؟؟ وايه اللي مش عاجبه ؟؟؟<br />ولا هي قلة ادب والسلام ؟؟؟<br />وشكرا"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035211/http://www.20at.com:80/article.php?sid=626"

