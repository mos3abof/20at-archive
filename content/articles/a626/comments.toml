[[comments]]
order = 9
subject = "موقع عشرينات"
text = "قراء عشرينات الأعزاء..<br />تحية طيبة وبعد،<br />نعتذر عن أي خطأ فني يحدث في الموقع منذ يوم أمس، وهذا يرجع إلى قيامنا بتغيير السيرفر Server الذي يعمل عليه موقع عشرينات، على أن الموقع سيعود بإذن الله لهيئته الطبيعية خلال 48 ساعة على أقصى تقدير إن شاء الله، ونود أن نعتذر عن أي خطأ أو عطل فني سوف يحدث خلال تلك الفترة.<br />ونود أيضاً أن ننوه أن السيرفر الجديد سوف يوفر خدمات جديدة لم تكن متوفرة لسابقه، حيث سيتم بإذن الله خلال ثلاثين يوماً البدء بخدمتي البريد الإلكتروني وساحة الحوار، من أجل توفير خدمات أكثر لقراء عشرينات الأعزاء.<br />وأرجو أن تقبلوا كامل اعتذارنا عن أي عطل فني يصيب الموقع، ونطمئنكم أن الموقع بكامل موضوعاته سوف يعاود الظهور عقب عملية النقل ونرجو من قرائنا الكرام أن يراسلونا على contact20at@yahoo.com في حالة ملاحظة أي عطل فني..<br />وشكراً لحسن تعاونكم والسلام عليكم ورحمة الله وبركاته"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035211/http://www.20at.com:80/article.php?sid=626"

[[comments]]
order = 10
subject = "وائل عباس"
text = "شكرا لعشرينات<br />لكن هل يمكن اضافة جاليري للصور اللتي يلتقطها الاعضاء من مصر وعن مصر ؟؟؟<br />اعتقد ان هذه فرصة لتعريف العالم بمصر عن طريق صور حقيقية لهواة وليسوا محترفين تصور مصر على سجيتها وتقريب المصريين بالخارج من بلدهم بحلوها ومرها<br />وانا شخصيا امتلك مجموعة كبيرة من الصور منها صور مظاهرات في القاهرة والاسكندرية وصور لمناطق اثرية وطبيعية ومحميات ... الخ"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035211/http://www.20at.com:80/article.php?sid=626"

[[comments]]
