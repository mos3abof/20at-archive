[[comments]]
order = 4
subject = "وائل عباس"
text = "اولا شكرا لعشرينات على نشر الصور<br />ولو انهم لم ينشروها كلها وكمان صغروها اوي<br />بس كتر خير الدنيا احنا ها ننهب ...<br />الاستاذ يا سلام<br />والله الكاميرا الجديدة انا مش راضي عنها اوي الصراحة برضه<br />بس هو ابن ادم كده نمرود<br />هاهاها<br />الاخ اللي عاوز يشتري كاميرا ديجيتال<br />انا اشتريت كاميرتين<br />اللي صورت بيها دي كانت كاميرا قلم زي بتوع الجواسيس<br />وصورها كانت كبيرة مش زي ما عشرينات حبايبنا صغروها كده<br />والجديدة ماركة Aiptek مزودة بفلاش<br />بتعمل صور لحد 25 في 20 سم<br />وبتسجل فيديو بس وقت قصير<br />والصوفتوير فيه امكانية لتكبير الصور<br />والحقيقة انت ممكن جدا تشتري كاميرا على حسب الامكانيات اللي انت عاوزها<br />والسوق المصري فيه من اول 320 جنية لحد الكانون ام 5000 جنيه ... على حسب فلاش ولا لا وكارت ذاكرة والريزولوشان والعدسات والحبشتكانات وانت فاهم وكده ...<br />الزبون بتاع الزمالك<br />النظام هناك يا باشا ابجني تجدني<br />وظرفني تعرفني<br />والبضاعة المباعة لا ترد ولا تستبدل حتى لو عملت قرد لا مؤاخذة والشرطة لا تحمي المغفلين واحترس من النصابين ... الخ من الشعارات<br />الزبون بتاع الاهلي<br />اعلان في الاهرام عائلة من السعودية طالبين دادة للاطفال ... لحد كده كويس ... طالبين ايه بقى في المؤهلات ؟؟؟ ... يكون معاها دكتوراه في طب الاطفال !!!<br />فيه استخفاف ورخص لبني ادم اكتر من كده ؟؟؟<br />ولا حول ولا قوة الا بالله"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035211/http://www.20at.com:80/article.php?sid=626"

[[comments]]
