text = "نعم مادا يجدي الشرف، فلنكن كلنا فاسدين بحكم الوراثة كما هو شأن اشياء كثيرة في مغربنا الحبيب. طبعا الحقوق توخد و لا تعطى و كل من سبقنا فس الحرية و الديمقراطية مرو من دروب الدم و الاعتصام وواجهوا العصى الغليظة باغلظ منها ووصلوا اصواتهم لمن هم قابعون في قصور مكيفة لا يدرون بالشعب الدي يبيع نفسه في الكثير من المظاهر، فلمادا يركب خيرة الشباب امواج البحر في قوارب غارقة قبل الإقلاع، و لمادا ترى بناتنا المشهود لهن بالجمال الرباني في كل انحاء المعمور فمنهن من تبيع نفسها مقابل دريهمات اما من يحالفها الحظ فيكون زوج اوروبي يكبرها بضعف عمرها هو نصيبها و منقدها من بلد داق عليها سقفه، لمادا الموظف في مكتبه يبيع نفسه و كرامته يرفض إعطاء الحق لاصحابه منتظرا اياهم ان يفهموا انهسهم و( يمدوا له قهوته) لمادا الشرطي في الشارع يتنكر لزيه الرسمي الدي هو اسمى من الدات لانه رمز الوطن لمادا يتنكر له مقابل عشرين درهم..كثيرة هي علامان الاستفهام و لا جواب سوى اننا في بلد كبرنا و تربينا و كل منا يقول لست انا من يضحي من اجل الأخرين (اللي خاف نجى) لكن ادا نجونا كلنا من العصى فاكيد ليس لصالح الوطن ، و الحل ان نهرب عند اول فيزة الى بلد نستطيع ان نقول فيه ما نريد و ان اقتضى الامر ان نطالب بتغيير الحكومة و المطالبة بالاصلاح ، و مغربنا يبقى الشمس الجميلة و براد الشاي برائحة النعناع و ان رأينا ما لا يعجب فما هو إلا شهر و سيمضي…خير من إمضاء سنين في تازمامارت …و بلدي قد يثور على نفسه يوما و يقوم باصلاح داتي فكل شيئ ممكن."
