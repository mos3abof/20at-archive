author = "I$L@M"
posted = "2009-10-08"
text = "اقتباس الموعظة لمن يتعظ:<br />ردا على التعليق الاول…كاتب المقال ىينبهنا جميعا هذة حياة الشباب وما يدور فى اذهانهم الموعظة هنا كيف نتعامل مع هؤلاءوليس كيف نأنب هؤلاء الكلام كثير للعلاج والموعظة لايسع المجال للحديث عنة بأجازفلزة اكبادنا هم مستقبلنا يعرفو هذة الاشياء ولا يطبقوها حتى تستقيم حياتهم<br />معلش ياباشا دا مش حال الشباب<br />و حتى لو حالهم نطرح المشكله و نعرض حلها مش نحى حكاوى"
archived = "2009-10-09"
capture_url = "https://web.archive.org/web/20091009022730/http://www.20at.com:80/masr/t7kyk/13650-2009-10-07-15-20-53.html"

