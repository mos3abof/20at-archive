posted = "2009-10-08"
text = "مش فاهم اى ده<br />بعد مقرأت المقال لقيت فى شويه قصص او حكاوى<br />بس مش فاهم قصد المقال ايه و لا حتى هو دراسه لرفع واقع<br />شويه كلام بلا هدف<br />بس كل الافتكرته حكايه واحده لبست ميكروجيب فى الجامعه و مشيت فهى كده زقت الناس بعيد اوى و كانت الى بتمشى بعد كده بمينى جيب بتبقى ستنا الشيخه<br />هو المقال ده بقى بيعمل كده بيزق العيب بعييييييد اوى علشان لما نشوف الحرام نعتاده<br />ربنا بيقول فى سوره النور<br />{ إن الذين يحبون أن تشيع الفاحشة في الذين آمنوا لهم عذاب أليم في الدنيا والآخرة والله يعلم وأنتم لا تعلمون }"
archived = "2009-10-09"
capture_url = "https://web.archive.org/web/20091009022730/http://www.20at.com:80/masr/t7kyk/13650-2009-10-07-15-20-53.html"

