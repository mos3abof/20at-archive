posted = "2009-10-07"
text = "المشكلة دلوقتى فى الموبايلات والدش والنت وكل شاب او شابة بيستعملوهم وبدون استعباط كل واحد بيشوف اللى هو عايزة وباللون الاحمر الفاقع<br />ولكن المشكلة على النت الان ان تجد البعض يستخدم كاميرا الموبايل فى تصوير اوضاع ومشاهد جنسية فى غرف النوم مع مصريات وينشرها على النت<br />مطلوب وضع ضوابط لحماية خصوصيات الاسر"
