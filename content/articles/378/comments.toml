[[comments]]
order = 2
subject = "مسائل غريبة"
author = "معاذ"
posted = "2006-09-24"
text = "الفقهاء القدامى لما وضعوا المسائل الغريبة دي كانوا بيتحرزوا من أي خطأ<br />يعني بيحاولوا يجمعوا كل الغريب والشاذ ويجاوبوا عليه<br />لكن المشكلة ان كل عصر ليه طبائعه وظروفه فعلى أيام زمان ماكانش فيه كتير موجودة دلوقتي<br />لذلك فمن الضروري عصرنة المسائل الفقهية<br />وأن يقوم فقهاء كل عصر بمواءمة المسائل الفقهية حسب التطورات الحادثة فيه<br />وينطبق هذا بالطبع على مسائل الصيام<br />فمن شدة ورع العلماء القدامى وضعوا مسائل أقل ما يقال عنها في عصرنا أنها (هبلة) _وعذرا لعلمائنا الكرام_ ونسوا كما قال الشيخ الهدف الأساسي للصيام<br />وهو الامساك عن الشهوات<br />وهذا هو المقياس المنطقي لصحة الصيام<br />أن نسأل أنفسنا<br />هل فعل كذا وكذا يعني أنني لم أمسك نفسي عن الشهوات؟<br />وهذا ما أظنه والله أعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124403/http://www.20at.com/article2.php?sid=1266"
