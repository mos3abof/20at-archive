text = "لو عندنا مسؤل فى الدول العربية يصصمم على رأيه فى موضوع القدس ولا يفرط به مثل تصميم هذا الرجل او على الاقل يحصل له اللى حصل لهذا الرجل لو علم ان لا احد يستجيب له"
