author = "اكتب اسمك هنا"
posted = "2007-11-15"
text = "لا اعتقد ان المشكلة مادية لانه كثيرا ميسوري الحال عوانس و مطلقين ايضا المشكلة في راي هو صعوبة العثور علي الانسان الصالح و المناسب و من يتم توافق بينه و بينها و ان تم تتعنت اسرته او اسرتها"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602050201/http://www.20at.com:80/archive/5548.html"

