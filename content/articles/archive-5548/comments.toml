text = "الرسول صلى الله عليه وسلم قال من استطاع منكم الباءه فاليتزوج فلو سيرنا على هذا النهج ولم نهتم بالشبكه والعربيه وخلافه فا ان شاء الله تحل مشكله العنوسه ولو بنسبه كبيره منها وليس باكملها طبعا"
