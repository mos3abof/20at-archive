[[comments]]
order = 0
subject = "موضوع جميل....و لكن"
author = "موضوع جميل يا ياسمين و نصائحك في محلها فعلا .. و لكن ما الحل فيمن يستمع إلى الناس بمنتهى الإنصات و لا يجد من يتحدث إليه."
posted = "2005-12-21"
text = "فعلا .. فجميع الناس يشعرون بانتعاش عندما يتكلمون عن أنفسهم و يجدون من يستمع إليهم و لكن قليلون جدا من تجدعندهم الاستعداد لسماعك و معايشة مشاكلك معك.<br />ربما يكون ذلك لكثرة المشاكل و الضغوط التي يتعرض لها الناس ....الله اعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114558/http://www.20at.com/article2.php?sid=127"

[[comments]]
order = 1
subject = "كلام جميل"
author = "عزة"
posted = "2005-12-23"
text = "كلام جميل بس المشكلة إن انا مثلا لما بأحب أعبر عن مشكلة حاسة بيها أحيانا مش باعرف أعبر عن إللى جوايا بل كمان بلاقى كلامى إللى باقوله بيخللى إللى بيسمع بيوصله حاجة مختلفة تماما عن إللى قاصداها .ياريت يا أستاذة ياسمين لوعندك حل تردى غليا على إيميلى والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114558/http://www.20at.com/article2.php?sid=127"

[[comments]]
order = 2
subject = "سمسمة"
author = "سارة"
posted = "2006-02-11"
text = "كلامك جميل ماشاء اللة ربنا يباركلك فعلا انا هحاول اعمل بية دايما والثواب ليكى باذن اللة بس المشكلة فعلا فى اللى يسمعلى ربنا المستعانت منتظرين منك شىء جديد دكتور ياسمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114558/http://www.20at.com/article2.php?sid=127"
