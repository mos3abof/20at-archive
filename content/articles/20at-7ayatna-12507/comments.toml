author = "الهوت ميل"
posted = "2009-06-29"
text = "الطريف في الموضوع ان اليهود في يوم من الايام اصروا على السيطرة على العالم واصروا ان يتحكموا في هذا العالم<br />وصدقوا ما عاهدوا الله عليه<br />والازمة المالية العالمية الاخيرة خير شاهد على ذلك فهم يتحكمون في شبكة البنوك<br />ومن ضمن هذه السيطرة<br />الانترنت فمفاتيح السيرفر العمومي للانترنت في يد اسرائيل<br />ليغلقوه في الوقت الذي يريدون ويدخلوا العالم في ازمه عالمية<br />والهوت ميل دي اشهر شركة للبريد الالكتروني يتزعمها يهوديان<br />والله المستعان<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2009-08-20"
