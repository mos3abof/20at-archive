text = "رفعوا الحصانة عن ايمن نور في نفس اليوم الذي تقدم بالطلب وزير العدل - خد بالك - وزير العدل بنفسه مالقاش حاجة يعدل فيها غير انه يضرب الزنبوووووووووووووق الكبير أوي في حزب جديد لسه حتة لحمة حمرا يعني ماكملش 3 شهور<br />بالذمة دي بلد دي"
