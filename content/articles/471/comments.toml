subject = "تنويه هااااااااااااااااااااااام"
text = "آخر موعد لإصدار البطاقة الانتخابية هو يوم الاثنين 31 يناير 2005، على جميع شباب مصر المشاركة في انتخابات مجلسي الشعب والشورى ولا تنسى أن تقول لا للرئيس في الاستفتاء القادم :)))<br />ملحوظة البطاقة حق لك، فاحرص على إصدارها من قسم الشرطة الذي أصدرت منه البطاقة، ولو قام أحد الموظفين بتأخيرك (أشخط فيه) وأخبره أنك ستبلغ مأمور القسم عن تأخيرك..<br />ولا تنسى أن هذه أمانة أمام الله ورسوله والمؤمنين.. فما الفائدة أن نظل نسب ونشتم في الحكومة والحزب الوطني ولا نشارك في إسقاطها بحقنا الانتخابي"
archived = "2005-02-14"
capture_url = "https://web.archive.org/web/20050214095135/http://www.20at.com:80/article.php?sid=922"

