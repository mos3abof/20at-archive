[[comments]]
order = 12
subject = "ليس ذل...بل العكس تماما"
text = "لقد قرأت الرسالة التي أرسلتها جبهة سلام إلى عمرو موسى ولم أجد فيها أي ذل أو إستعطاف...بالعكس دي كلها مطالب وشروط على عمرو موسى إذا تم إنتخابه.....شوفوا كاتبين إيه:<br />بيان رقم 2<br />القاهرة , الرابع عشر من مارس لعام 2004<br />رسالة موجهة الي السيد الأستاذ عمرو موسي من الشعب المصري :<br />من بين كل عشر مصريين استفتيناهم حول من يرغب في أن يكون رئيسا لمصر خلفا للرئيس محمد حسني مبارك , سبعة اختاروك من بين 10 مرشحين مختلفين . ان الذين رشحوك لهذه المسئولية الجليلة يطالبونك بالاتي اذا تم انتخابك , ويعلنون أنهم يرشحونك بناءا علي الأسس التالية :<br />1. الغاء قانون الطوارئ و اعطاء الحريات و السماح للمصريين بمختلف اتجاهاتهم بممارسة كل الحقوق الديموقراطية التي نص عليها الدستور دون مضايقة أو ارهاب حكومي أو تضييق أمني, والسماح باجراء الانتخابات النزيهة و السماح للأحزاب بالاعلان عن مبادئها عبر وسائل الاعلام المختلفة.<br />2. فتح الباب لعودة كل الأمناء و الشرفاء و الأكفاء من أبناء و بنات وطننا الغالي الذين يئسوا من الوضع الحالي ليشاركوا في بناء مصر اعتمادا علي كفاءاتهم و مواهبهم لا المحسوبية و القرابة و الواسطة.<br />3. اذا قدر الله فوزك بمنصب رئيس الجمهورية بواسطة الانتخاب الحر فان الشعب يطالبك باختيار الوزراء الشرفاء و الوطنيين و الأكفاء المصلحين القادرين علي رفع مصر من مستنقعها السياسى و الاقتصادي و الاجتماعي , ومحاسبة اللصوص و المنتفعين من الوزراء و المسئولين و سيساندك الشعب كله في ذلك باذن الله .<br />4. اجلال الأديان و احترام حقوق الانسان و اعلاء القيم و الأخلاق و التعاون مع الامم الشقيقة و الصديقة بما فيه مصلحة مصر و العالم العربي بلا تنازلات و لا تهاونات .<br />5. احترام الدستور بكل بنوده , وعدم البقاء في الحكم لأكثر من المدة التي يحددها الدستور .<br />6. دعوة كل الأحزاب و الجمعيات الناشطة في المجتمع المصري للمشاركة في صناعة مستقبل مصر و التعاون معها في ارساء أساس المرحلة الجديدة للأمة المصرية بمختلف قطاعاتها .<br />7. وقف السيطرة الأمريكية علي شئون مصر و تدخلها في سياساتها بجد و حزم لا بالشعارات و الكلام , والشعب عن بكرة أبيه سيبني معك مصر الحرة من الديكتاتورية و الامبريالية الأمريكية و غيرها<br />8. الشعب المصري يقول لك أهلا بك رئيسا منتخبا و ليس ديكتاتورا مسلطا . فلا هتافات باسمك , ولا أغاني نفاق تمدحك , و لا مسؤولون يتسترون علي أخطائك, الشعب يحاسبك و يقومك كما اختارك و رشحك .<br />9. اصلاح التعليم و تيسير العلاج و تشجيع الصناعة و تصحيح مسار المؤسسة الزراعية , و تقويم الاعلام و الاهتمام بالاسرة<br />10. تقوية المؤسسة العسكرية للدفاع عن مصر بدون أن تتدخل في السياسة المصرية الداخلية أو الخارجية<br />11. قل الحق و انصر المظلوم و اصبر علي الأذي و ثق فيمن اختارك و احترم أدميته.<br />شعارنا هو انقاذ مصر , وان الصير علي الأمل خير من الصبر علي الذل .<br />لا لتوريث الحكم , و لا للعمالة للقوي الأجنبية .....ولا تراجع بعد اليوم<br />والله الموفق<br />والسلام عليكم ورحمة الله وبركاته<br />توقيع :<br />الحملة الشعبية السلمية لإنقاذ مصر - سلام -<br />الناطق الرسمي و الوحيد باسم حملة جمع التوقيعات الشعبية والتي تطلب من الأستاذ عمرو موسي بترشيح نفسه للإنتخابات الرئاسية المصرية لعام 2005"
archived = "2005-02-14"
capture_url = "https://web.archive.org/web/20050214095135/http://www.20at.com:80/article.php?sid=922"

