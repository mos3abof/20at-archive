subject = "انا عملت البطاقة"
text = "انا عملت البطاقة<br />ايوة رحت عملتها مع ان ناس كتير قالتلى خليك فى حالك و أمشى ورا الحيطة مش جمبها<br />الموضوع زى شكة الدبوس<br />صور البطاقة وش و ضهر و روح القسم<br />بس البس شيك عشان تتعامل كويس<br />الموضوع هياخد 3 دقايق و 22 ثانية<br />و أهم حاجة<br />روح بنية انك عايز تفيد المسلمين و توصل الولاية للى يستحقها<br />مش ممكن بنا يحلسبك على اللى كان ممكن تعملة ومعملتوش يا سلبىىىى"
