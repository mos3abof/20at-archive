[[comments]]
order = 3
subject = "hesham"
text = "السلام عليكم ورحمة الله وبركاته<br />يمكن في البدايه احب اني احيي فريق عمل عشرينات<br />علي جهدهم الواضح والمتميز<br />طبعا دلوقتي وفي الاوقات الاخيرة كتر الحديث اووي<br />عن موضوع الانتخابات وعن ان عمنا الحاج حسني مبارك<br />هيكسبها هيكسبها ...وكترت الاراء اللي مش عارف<br />هي فعلا حقيقه ولا مش حقيقه وان المعظم بيقول<br />لا لمباررررك نعم لاي شخصيه أخري ...؟!!<br />هتلاقي ناس بتقولك ياعم خلي مبارك اهو احسن من اللي<br />منعرفهوش مش يمكن حد يجي علينا ويطلع عييننا أكتر<br />مهي طالعة ... خلوه خلوة وكمان اديني ياعم شغال<br />وعاوز اربي عيالي وامشي جمب الحيط ...<br />وفيه اللي في النحيه التانيه واللي بيقولك لا مش عاوز<br />مبارك دا راجل خرب بيتنا وودي البلد في داهيه<br />وازاي بيحارب المتديينن والاخوان في كل مكان<br />وبيطرد العلماء وفاتحها علي البحري للشاذلي وصفوت<br />الشريف وهلم جره ....<br />والصراحه بقي انا توهت بين الرأيين<br />ومش عارف اختار مين ولا مخترش مين<br />ومش عارف مين اصلا هيرشح نفسه ادام الحاج مبارك<br />ولو حد رشح نفسه فين البرنامج الانتخابي بتاعه؟!<br />وفين ياعم المناظرات اللي بنشوفها في امريكا بين<br />المرشحين نفسهم للانتخابات ...؟!<br />نفسي بس حد يقولنا ايه النظام؟<br />ولو عندهم مشاكل ممكن احنا نحلها<br />يعني لو مفيش ستديو فاضي يعملوا فيه مناظرة<br />نقولهم ويجوا يصوروا عندنا في اي دار مناسبات<br />وننقلها علي التلفزيون برضو وخلي الشعب يعيش علي رأي<br />ريكو...<br />طب انا ممكن ارشح عمنا الحاج حسني بس يقولنا هو<br />ناوي علي ايه للشباب الغلبان اللي زيي واللي زيكم<br />(( متهيألي كل الشباب بقوا غلابه دلوقتي ))<br />يقولنا اي حاجة ...يضحك علينا حتي بشويه كلام..<br />اي حاجة ياجدعان بدل الفقر اللي احنا فيه دا<br />كفايا كده كلام انا باين عليا اتجننت<br />وفي النهايه<br />اناهشام<br />23 سنة<br />شاب مصري<br />هتساعدني ؟<br />تعاطفك لوحده مش كفايا...!!<br />سلام عليكم ورحمة الله وبركاته"
archived = "2005-02-14"
capture_url = "https://web.archive.org/web/20050214095135/http://www.20at.com:80/article.php?sid=922"

