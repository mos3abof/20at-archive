[[comments]]
order = 23
subject = "الفكرة مش عمرو موسي"
text = "حتي جبهة سلام وهي تحاول ايجاد رمز وطني له الشعبية الجارفة والخبرة السياسة والنزاهة .....لم تقل ان عمرو موسي هو افضل انسان<br />الموضوع واقعي ..وعندم تجربة اوكرانيا<br />شخص له وزن ...عنده خبرة ....يصلح ان يكون رئيس<br />يجتمع الناس حوله ..يهزو ا عرش الظالم ....وياتوا بشخص جديد...مش عن طريق انقلاب عسكري<br />لا بالانتخاب او حتي بالعصيان المدني<br />ولما ده يحصل نخش في مرحلة تانية ..الا وهي محاسبة الرجل الجديد وتعديل الدستور<br />اللي يتعلم يتغلب علي خوفه مرة واحدة بس ..يبقي خلاص كل كل شئ وراء ذلك اسهل<br />هي دي الفكرة ببساطة"
archived = "2005-02-14"
capture_url = "https://web.archive.org/web/20050214095135/http://www.20at.com:80/article.php?sid=922"

[[comments]]
order = 24
subject = "اعتقال طلبة وطالبات من جبهة \" سلام \" في"
text = "خبر اعتقال اعضاء وعضوات صدر في جريدة المصري اليوم<br />تم اعتقال مجموعة من طلبة وطالبات هندسة منوف من علي باب الكلية بتهمة توزيع ورق لجبهة \" سلام \" وانه يدعو الي التوعية الانتخابية والدستورية وانه يطالب عمرو موسي بان يكون مرشحا رئاسية لانتخابات عام 2005<br />ولا يعلم احد اين مكان هؤلاء الطلاب الان<br />تم الاتصال بجمعية امنستي انترناشنال ...وهيومن رايت واتش<br />المقاومة السلمية مستمرة بحمد الله<br />وستعود مصر حرة"
archived = "2005-02-14"
capture_url = "https://web.archive.org/web/20050214095135/http://www.20at.com:80/article.php?sid=922"

