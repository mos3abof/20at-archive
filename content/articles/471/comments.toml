subject = "نونا المجنونة"
text = "كل واحدحر في رأيه<br />احنا في بلدحرة<br />انا عن نفسي شايفة ان اجري علي اكل عيشي و اشوف شغلي اهم من اضيع يوم في حاجة بالنسبة لي مش شايفة ليها قيمة<br />روح انت يا سيدي و هنشوف نتيجة الانتخابات في الاخر<br />لو فعلا حصل تغيير<br />اوعدك ان شاء الله ابقي اتحرك<br />بس معلش انا واحدة موظفة بجري ورا لقمة عيشي فهي دي اهم حاجة عندي و كل يوم فيها لواهمية عندي حتي لو هنام فيه ببقي برتاح عشان اقدر انتج تاني يوم"
archived = "2005-02-14"
capture_url = "https://web.archive.org/web/20050214095135/http://www.20at.com:80/article.php?sid=922"

