subject = "لعلها تكون نواة لثورة سلمية"
text = "صحيح ان فيه ناس كتيير حتتريق<br />لكن أعظم النار من مستصغر الشرر ..........<br />تعجني فكرة البس اخضر كل يوم جمعة التي علي موقع \" سلام \" ويمكن لمن شاء ان يتعرف علي المزيد<br />الجبهة قدمت اول ضحاياها يوم 16 من يناير حيث تم اعتقال طلبة وطالبات في هندسة منوف بتهمة الانتماء الي \" سلام \" ..تجدون نص البيان علي موقعهم ايضا<br />هناك اعلان عن تظاهرة سلمية في الاسكندرية في شهر فبراير ...يا تري حنشارك ام نظل نتفرج ؟<br />للمزيد ......يمكنك زيارة موقعهم<br />www.salamegypt.org<br />لقاء جيد .....فيكوا الخير يا شباب مصر"
archived = "2005-02-14"
capture_url = "https://web.archive.org/web/20050214095135/http://www.20at.com:80/article.php?sid=922"

[[comments]]
order = 9
subject = "مريم"
text = "أنا مبسوطة جدا بالموضوع دا.....لسة في أمل إن شاء الله طالما لسة في شباب زي دول في مصر<br />أنا عرفت جبهة سلام من شهر.....وببلغ كل الناس اللي أعرفها ....أنا عمري ما كنت بفكر في السياسة ولا إنتخابات والكلام دا....كانت سلبية مني...بس الحمد لله طلعت بطاقة إنتخابية و ببلغ كل الناس اللي أعرفها بجبهة سلام....حتى أنا لسة عارفة إنهاردة إنهم هينظموا مسيرة سلمية في إسكندرية الشهر اللي جاي<br />http://salamegypt.org/salam/tazahorat.htm<br />أنا حاسة إني عايزة أكسر الحيطة اللي كنت ماشية جنبها.....كفاية ظلم بقة...وكفاية سلبية"
archived = "2005-02-14"
capture_url = "https://web.archive.org/web/20050214095135/http://www.20at.com:80/article.php?sid=922"

[[comments]]
