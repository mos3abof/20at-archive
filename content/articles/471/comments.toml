text = "اقتبااااااااااااس<br />\"\"روح انت يا سيدي و هنشوف نتيجة الانتخابات في الاخر<br />لو فعلا حصل تغيير<br />اوعدك ان شاء الله ابقي اتحرك<br />بس معلش انا واحدة موظفة بجري ورا لقمة عيشي فهي دي اهم حاجة عندي و كل يوم فيها لواهمية عندي حتي لو هنام فيه ببقي برتاح عشان اقدر انتج تاني يوم \"\"<br />ماهو ده اللي بقولي يا آنسة نونا..انتي فعلاً كلامك أو رأيك اللي انتي حرة فيه فيروس يأس<br />وده اللي انا ضده وبعبر عن رأيي برضوه<br />شكرا<br />يحيي"
archived = "2005-02-14"
