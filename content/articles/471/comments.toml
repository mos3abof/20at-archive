text = "لقاء هااااايل<br />بس ليه كنتوا خايفين من مقابلة أعضاء سلام؟؟<br />دا أنا ومعايا شباب وبنات هنا من إسكندرية مستنيين مسيرة سلام دي من زمان عشان نفسنا نشارك في عمل إيجابي بدل ما احنا قاعدين ناقمين على حال البلد وااللي وصلناله ومبنعملش أي حاجة عشان نغير الوضع السيء دا.....ربنا يوفقهم ويوفقنا كلنا عشان نشوف بلدنا وأهل بلدنا عايشين بكرامتهم وباحترامهم مش عايشين خايفين ومذلولين ومش قادرين يتكلموا<br />ياسر فاروق / إسكندرية"
