subject = "وأنا كمان"
text = "أنا رحت طلعت البطاقة وطلعت علطول.. حتى مأمور القسم كان بيشخط في الموظفين علشان يشوفوا شغلهم كويس.. والموظف حاول يضرب على القلم وياخده لنفسه.. المأمور زعق له وقال له: \"هتاخد الفلم بتاع المواطن\":)<br />العملية كلها أخدت منى 15 ساعة عشان تصوير الورق بعيد عن القسم.. علشان كده يا ريت تاخدوا معاكم صورة البطاقة وش وضهر<br />وسبحان الله لما رحت القسم البنات اللي كانوا جايين أكتر من الولاد وكمان كان في راجل عجوز بيطلع البطاقة.. يعني الشعب مصحصح وعارف حقوقه فين..<br />المهم.. محدش ينسى إننا عاملين البطاقة عشان نقول لا لمبارك:)).. النية دي إن شاء الله تدخلنا الجنة لو متنا قبل ما ننتخب :)))"
archived = "2005-02-14"
capture_url = "https://web.archive.org/web/20050214095135/http://www.20at.com:80/article.php?sid=922"

