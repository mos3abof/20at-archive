text = "احب الاول اعرفكم بنفسى انا شخص عادى كمان زيكم مصرى بس والله مش عارف اذا انا كنت من مصر ولا .لا<br />انا كتبت اسمى الموكوس عشان الوكسه اللى احنافيهااناعن نفسى هسميها وكسه والواحد مش عارف وكسه ولا كوسه الله واعلم المهم ان كله بقى بيروح مع الغسيل ( غسيل اموال ) ولا غسيل الجنيه ( قصدى تعويم الجنيه ) المهم انتم شباب زى الورد وربنا معاكم ومعانا ويوفق عشرينات تتطلع اراء العشرينات"
