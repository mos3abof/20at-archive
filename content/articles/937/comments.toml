author = "اسماعيل الدبسان - كسيفة - فلسطين 4848"
posted = "2006-01-16"
text = "عندما يرضخ الانسان لوضع صعب ومعقد مثل تدهور صحته او وضعة النفسي ام الاقتصادي او العيش تحت الاحتلال يبحث عن ملجا او ملاذ لذلك يجد الطمانينة عند المشعوذين والعياذ بالله والاولى به اللجوء لله الحي القيوم فاطر السموات والارض . لذلك نجد تنبؤات المنجمون مبهمه وغامضه لانها افتراء وكذب . واتحدى اكبر المنجمين في العالم على التكهن الصحيح باليانصيب..."
