author = "ا أملك أمام هذا المقال إلا أن أذكر لكم حديث الرسول صلى الله عليه و سلم"
text = "‏حدثنا ‏ ‏يحيى بن سعيد ‏ ‏عن ‏ ‏عبيد الله ‏ ‏حدثني ‏ ‏نافع ‏ ‏عن ‏ ‏صفية ‏ ‏عن ‏ ‏بعض أزواج النبي ‏ ‏صلى الله عليه وسلم ‏<br />‏عن النبي ‏ ‏صلى الله عليه وسلم ‏ ‏قال ‏ ‏من أتى ‏‏ عرافا ‏ ‏فصدقه بما يقول لم تقبل له صلاة أربعين يوما"
