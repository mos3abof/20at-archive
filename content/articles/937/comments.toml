posted = "2006-05-04"
text = "لا يعلم الغيب الا علام الغيوب<br />وقد اوصى الرسول صلى الله علية وسلم قبل 1400 عام تقريبا من خطر الشرك وعبادة الشيطان الرجيم ونتخذه عدوا . والتنجيم والكهانة هي عبالرة عن طقوس للتقرب ولعبادة الجن والشياطين والعياذ بالله ."
