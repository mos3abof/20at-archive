[[comments]]
order = 10
subject = "كذب المنجمون ولو صدقوا"
author = "عمرو عبد الكريم"
posted = "2006-06-15"
text = "تعليقي علي حديث الرسول صلي الله عليه وسلم (كذب المنجمون ولو صدقوا) لماذا كذبوا ولو صدقوا لانهم يتنبئون بالغيب ومالك الغيب هو الله اي كان نوع الغيب فهو بيد الله لان عندما يصدقوا بما سيحدث غدا المستقبل فمن يملك يومنا وغدانا ومستقبلنا غير الله بيده الأمر كله بيده تغيره وايضا المنجمون لا ينجمون كيفية حدوث الشئ او معاده واين سيحدث وتفاصيل حدوثه كل هذه امور بيده الله فقط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125313/http://www.20at.com/article2.php?sid=26"

[[comments]]
order = 11
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-19"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125313/http://www.20at.com/article2.php?sid=26"

