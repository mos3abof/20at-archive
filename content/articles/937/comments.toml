[[comments]]
order = 15
subject = "Hilalgor@Yahoo.com"
author = "ا هو الفرق بين هذه التنبؤات وتأويل رؤيا سيدنا يوسف عليه السلام في السجن ؟"
text = "وما هو تأثير الفلك على جسم الانسان فسيولوجيا؟<br />-يجب على الاخوة الذين يحرمون ويحللون أن يضعوا المهتمين في صلب الموضوع ، عندما يقول الرسول صلى الله عليه وسلم كذب المنجمون ولو صدقوا فهذا يعني أن الصدق وارد.<br />وقال عليه السلام (بما معنى الحديث: يصاحب الانس الجني فيسترق الجني السمع من السموات ويلقي الكلام في أذن العراف - ولهذا ذكر في القران الكريم : ويتبعه شهابا رصدا. صدق الله العظيم.<br />نحن بأمس الحاجة لتوضيح الامور وقوة الحجة وفهم المصطلحات وتوضيح المفردات وذلك لترسيخ العقيدة والوقوف على أرض صلبة وخصبة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150845/http://www.20at.com/article.php?sid=1602"
