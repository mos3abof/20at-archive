text = "قال تعالى ( ولو كنت أعلم الغيب لأستكثرت من الخير ) لو كان أحد من أهل الأرض يعلم الغيب لكان من أغنى الناس في الأرض ولا تقل إن أحد مناالناس يكره المال ولكن مجرد كلام قد يصادف حدث يوافقه ونحن نصدق بعلمه للغيب وفي الختام اسمح لي * كذب المنجمون ولو صدقوووووووووووووو *"
