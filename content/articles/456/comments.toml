[[comments]]
order = 3
subject = "القيصر"
text = "كل ده ليه يا جماعه...عشان احنا دوله مش ذات سياده...ماعندهاش شخصيه يعني.<br />المفروض ما نستغربش من الاعتذار الي قدمه شارون لمبارك<br />فاكرين الي حصل للابطال الفلسطنيين الى سيطروا على سفينه امريكيه معديه في البحر الحمر..الكلام ده كان في الثمنينات.<br />في عهد مبارك قام فلسطنيون باختطاف سفينه امريكيه,ولم تستطع امريكا ان تتفاوض مع المختطفين,فطلبت من مصر بلتوسط لهم بين المختطفين,وفعلا قامت مصر بلتفاوض مع الفلسطنيون,ووصل الامر بهم بان تاتي طائره مصريه تنقلهم بعيدا عن هذه السفينه وبعيدا عن ايدي امريكا,وعندما قامت الطائره المصريه بعمليه النقل..دخلت الاجواء المصريه خمسه طاترات عسكريه امريكيه ...واختطفت الطائره المصريه من الاجواء المصريه...اي خرقوا كل شروط اتلتفاوض والسلم.<br />بس بصراحه مبارك ما سكتش وقام قدم طلب لامريكا يطلبهم فيها بلاعتذار....................<br />وطلع في التلفزيون تاني يوم يقول:<br />انا ما سكتش ..ده استهتار بلكيان المصري...انتوا بتتكلموا في ايه....امريكا قدمتلي اعتذار والجرايد كلها بتتكلم عنه النهارده في امريكا كلها."
archived = "2004-11-23"
capture_url = "https://web.archive.org/web/20041123124843/http://www.20at.com:80/article.php?sid=764"
