[[comments]]
order = 0
subject = "من نونا المجنونة الي ياسمين"
text = "شكرا يا ياسمين<br />فعلا ملابس المحجبات مشكلة لان المفروض تحافظ علي اناقتها مع البساطة و عدم لفت الانتباه و معظم الازياء المعروضة لا تصلح للحجاب اطلاقا او لا تتناسب مع ظروف العمل<br />شكرا يا ياسو"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035102/http://www.20at.com:80/article.php?sid=547"

[[comments]]
order = 1
subject = "رنا"
text = "بارك الله فيك<br />فعلا ازياء جميلة وتناسب المحجبات ..مع اني افضل ان تكون الالوان اهدا قليلا.<br />اسواقنا العربية للاسف لا تراعي المحجبات وكل المعروض اما ضيق او مكشوف<br />ارجو ان يكون لدينا في المستقبل القريب مصممين ازياء للمحجبات فقط وتكون عصرية وانيقة."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035102/http://www.20at.com:80/article.php?sid=547"

[[comments]]
order = 2
subject = "نعم للازياء الاسلامية"
text = "كلام جميل<br />قصدي التزام جميل<br />والي الامام دائما يا اصحاب المرجعية الاسلامية<br />وعقبال عندنا :)"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035102/http://www.20at.com:80/article.php?sid=547"

[[comments]]
order = 3
subject = "الله"
text = "جميل قوي و الله<br />ياريت لو عندك أي صور تانية هاتيها"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035102/http://www.20at.com:80/article.php?sid=547"

[[comments]]
order = 4
subject = "كل ألبومات مصطفى"
text = "ده رابط لكل ألبومات مصطفى محمود وعينة صوتية لمعظم الأغانى .. موجود فى<br />سـوق النـور"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035102/http://www.20at.com:80/article.php?sid=547"

[[comments]]
order = 5
subject = "lختكم فى الله"
text = "السلام عليكم ورحمة الله انا بتمنى لكم مزيد من التوفيق والله معكم وتتقدمو وتحسنو صورة الاسلام والمسلمين لان اسلامنا معرف بالاناقة والجمال والله جميل يحب الجمال وحيى يحب الحياء نرجو بعض الازياء التى تناسب عاداتنا وتقاليدنا"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035102/http://www.20at.com:80/article.php?sid=547"

[[comments]]
order = 6
subject = "جمهوريه مصر العربيه /المحله الكبري"
text = "السلام عليكم ورحمه الله وبركاته<br />شكراا جداا يا ياسيمن على رسالتك الجميله اتمني ان تساعديني فى مشروعي انا عندي محل بيع للمحجبات واتمني ان تفيدينى فى هذا الموضوع على الايميل التالى a_el_banna@hotmail.com<br />واتمني ان يكون ردك سريعا.تعرفى يا ياسمين ان بحلم بانى اشوف كل البنات بالحجاب حتى من قبل ما اعمل مشروعي بتبقى البنت لها جمالها الغير عادي وهيه محجبه مش عارف انا طولت عليكى ولا ايه بس ياريت تفيدنى فى الموضوع ده لانى عايز اعرف عن الحجاب اكتر وعن تصميماته لانى ناوى افتح مصنع صغير كده شكراا جداا للمره الثانيه على قرائتك رسالتى .<br />احمد البنا"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018094105/http://www.20at.com:80/article.php?sid=547"

[[comments]]
order = 7
subject = "احمد البنا"
text = "السلام عليكم ورحمه الله وبركاته<br />شكرا على ردك يا احمد واتمنى من الانسه ياسمين شكري ان تطلعنى على الجديد فى معرض حلال.<br />a_el_banna@hotmail.com<br />وتحياتى لموقع حول اهتمامات الشباب عن الكليب والدش<br />احمد البنا"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018094105/http://www.20at.com:80/article.php?sid=547"
