text = "الأستاذ الطحاوي برجاء مراجعة الآيات القرآنية قبل دفع الموضوع على الشبكة فقد جاءت آية سورة المائدة رقم 28 هكذا((لئن بسطت إلي يدك لتقتلني ما أنا بباسط يدي لأقتلك إني أخاف الله))وتصحيح الآية((لئن بسطت إلي يدك لتقتلني ما أنا بباسط يدي إليك لأقتلك إني أخاف الله))<br />لكن في المجمل نفع الله بك في هذا المضمار"
archived = "2007-01-26"
