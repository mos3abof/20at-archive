[[comments]]
order = 8
subject = "الشيعة لا دين لهم"
author = "سمير حسين"
posted = "2007-01-10"
text = "الأستاذ عبدالله قلت بدعوى العاطفةيحرق السنة والشيعة مساجدهما ، وأنا أتساءل من يحرق مساجد من ، ثم أن الشيعة لادين لهم أصلا ، فقل لي بالله عليك كيف تحكم على من سب الأصحاب وقبل الأعتاب واتخذ دينه هواه<br />أعلم أن كلامي لن يعجبك في هذا الباب ، لأنك من دعاة التقريب لكني أسوق لك ماقاله الشيخ إسماعيل صادق العدوي خطيب الجامع الأزهر ـ رحمه الله ـ ... يقول العدوي : مذهب الإمامية ، ومذهب الزيدية ، ومذهب الإسماعيلية ، ومذهب العلوية ، ومذهب لعلياوية ، ومذهب المُُخمسة ، ومذهب الراجعية ، ومذهب الواقفية ، ومذهب القحطة ، ومذهب الخطابية إلى غيرهؤلاء ، وكل من هؤلاء له شطحات في كلامه ، وله خروج شديد عن دائرة الإسلام والمسلمين ، وعن الكتاب والسنة ، وأضاف العدوي : لم يكن لمرجع الشيعة أصول في الإسلام إطلاقا.<br />ومن هنا يا شيخ عبد الله فإن الشيعة ليس لهم مساجد كنها حسينيات ، وعن حرق المساجد هم لذين يتولون كبرهافي العراق ،ويقومن تحويل المساجد السنية في لبنان إلى حسينيات<br />والفتاوى في خروجهم عن الإسلام عديدة لايسعنا المجال لذكرها .. فمن قائل من العلماء أنهم دين مستقل بعيد عن الإسلام، ومن قائل بتكفيرهم، فنختلف معهم في الكتب والسنة، كل أدلة الفقه تنبني على الكتاب والسنة ، وهم يرون أن القرآن الذي بين أدينا ناقص ومحرف ، وهناك كتاب لمرجع شيعي عن تحريف القرآن وهو<br />فصل الخطاب في إثبات تحريف كتاب رب الارباب ،ولديهم أكثر من ألفي رواية تثبت تحريف القرآن في مصادرهمالقديمة والحديثة<br />ونسوا قول الله تعالى \"إنا نحن نزلناالذكر وإنا له حافظون\"<br />معذرة للخوض في هذه المسألة، أماعن الموضوع فليت نصارى مصر يتدارسونه فيما بينهم ، علهم يتخلقون بأخلا السيد المسح صلى الله عليه وسلم<br />أما بوش ومن سار سيره فلهم دين آخر غير ا<br />اقرأ بقية التعليق .."
archived = "2007-01-26"
capture_url = "https://web.archive.org/web/20070126092539/http://masr.20at.com:80/article.php?sid=1409"

[[comments]]
order = 9
subject = "عند الشيعة يموت الإيمان وتحيا الطقوس"
author = "سمير حسين"
posted = "2007-01-10"
text = "الأستاذ عبد الله تكملة لتعليقي السابق ، ومعذرة للخوض في هذا الموضوع ، لكن موضوع حرق المساجد أثارني ولأن موضوعك يتحدث عن حياة الطقوس بعد موت الإيمان ، ولأن الطقوس عند الشيعة هي الأساس ــ راجع طقوسهم في يوم عاشوراء ، وأيضا طقوسهم عندما قتلوا صدام حسين ــ والإيمان لا وجود له عندهم ومن هنا لابد من عرض فهمهم للقرآن ، ففهم القرآن الكريم لدى الشيعة يختلف عنه لدى السنة، فهو عندهم يقوم على تأويل الآيات وصرف معانيها إلى غير ما فهمه منها الصحابة عن النبي صلى الله عليه وسلم، وإلى غير ما فهمه منها أئمة الإسلام عن الجيل الذي نزل عليه القرآن. وهم يرون أن القرآن الكريم الذي جمعه الخليفة عثمان بن عفان رضي الله عنه قد تعرض للتحريف بالزيادة والنقص من قبل أعداء آل بيت الرسول وشيعته, ويقصدون بهم من يسمونهم بالنواصب من الصحابة وأتباعهم .<br />يقول الكليني في كتابه (الكافي) - وهو لديهم بمكانة صحيح البخاري لدى السنة- : \"عن جابر الجعفي قال: \" ما ادعى أحد من الناس أنه جمع القرآن كله كما أنزل إلا كذاب ، وما جمعه كما أنزل إلا أمير المؤمنين علي بن أبى طالب عليه السلام والأئمة من بعده\" ، والمصحف المعتمد لدى علمائهم هو ما يسمونه \"مصحف فاطمة\"..<br />جاء في 'الكافي' عن جعفر الصادق: 'وإن عندنا لمصحف فاطمة عليها السلام، قال: قلت: وما مصحف فاطمة عليها السلام؟! قال: مصحف فيه مثل قرآنكم هذا ثلاث مرات، والله ما فيه من قرآنكم حرف واحد'.<br />ما المقصود بالجملة 'ليس فيه حرف من قرآنكم'؟! هل هو مكتوب بغير اللغة العربية؟! أم يريد الراوي أن يقول: 'ليس به آية واحدة من آيات قرآنكم؟! وفى كلتا الحالتين ما صفات هذا القرآن العجيب؟!<br />وهل أنزل الله تعالى أحسن كتبه وأشملها وهو القرآن الكريم ليبقى سرًا لدى الأئمة الشيعة عن جميع الأمم<br />اقرأ بقية التعليق .."
archived = "2007-01-26"
capture_url = "https://web.archive.org/web/20070126092539/http://masr.20at.com:80/article.php?sid=1409"

