subject = "###"
author = "لا للتوريث نقول للامبارك الأب ما قاله عبد الله بن عمر بن الخطاب لمعاوية بن أبي سفيان بن حرب :\".. لقد كان قبلك خلفاء وكان لهم بنون ليس ابنك بخير من أبنائهم فلم يروا في أبنائهم ما رأيت في ابنك فلم يحابوا في هذا الأمر أحداً\""
posted = "2006-07-10"
text = "لقد حان وقت انتقال السلطة الى الشعب، لا لتوريث الحكم، ولا لجمال مبارك."
archived = "2006-07-19"
