[[comments]]
order = 0
subject = "معركة تأسيس الدولة"
author = "http://gorfah.blogspot.com"
posted = "2006-07-05"
text = "لقد انتهت شرعية يوليو فى رمال صحراء سيناء ورحم الله عبد الناصر ،المصرى الشجاع الذى مات محسورا على هزيمة تحمل مسئوليتها كاملة ،اما الآن فبناء شرعية جديد يقتضى انتصار لارادة القوى المتصلة بالآم المصريين والمعبرة عن طموحاتهم فى الحياة الكريمة فى معركتها التى نشهد بدايتها ،معركة طويلة تنضج خطابا تاسيسيايتجاوز المهاترات الفكرية التى لا نزال نراوحها على مدى ثلاثين عاما وقيادات معتبرة قادرة على تحمل مسئولياتها وذات صلابة استمدتها من معركة التحرر، ليس هناك جمهورية رابعة بل هناك جمهورية جديدة يضع قواعدها احرار منتصرون ومحررون من روح الهزيمة واليأس"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124920/http://masr.20at.com:80/article.php?sid=615"

[[comments]]
order = 1
subject = "معترض"
author = "عابر القارات"
posted = "2006-07-05"
text = "أعترض مع المعلق السابق فى ترحمه على عبد الناصر فطبعا لا اعترض على الترحم و ليرحم الله سبحانه و تعالى أمواتنا جميعا و لكن بدون الدخول عميقا فى مجاهل التاريخ عندما أكون رئيسا و لا أعرف مدى قوتى و لا مدى حجمى الحقيقى و تقلدت منصب الرئاسه و لا خبرة عندى لا سياسيا و لا إقتصاديا و لا حتى عسكريا و كل ما عندى خبرة فيه فقط هى خبرة هزيمة حرب فلسطين و انا داخليا مقتنع بذلك أننى عديم الخبرة تماما فى أن أحكم حى باب الشعرية فكيف لى ان احكم بلد بحجم و ثقل و تاريخ مصر!!! و هذا و على صورة مصغرة كل من تقلد مسئولية مؤسسة أو مجلس محلى من قيادات عسكرية لا تدرى ما الفرق بين إدارة مجموعة من العساكر و إدارة العلاقة بين الحكومة و الشعب!! يا أخى رحم الله جميع موتانا و لكن اللهم جازى من تولى أمر المسلمين و لم يتقى الله فينا اللهم جازيه بأسوء ما عمل"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124920/http://masr.20at.com:80/article.php?sid=615"

[[comments]]
order = 2
subject = "اسف"
author = "مجدى اليمانى"
posted = "2006-07-06"
text = "اخوانى الاعزاء تحيه طيبه وبعد لو نظرنا قليلا فى التاريخ لوجدنا اننا حكمنا من حكام ليسو شرعين 000فعبد الناصر اغتصب الحكم من نجيب ونسب لنفسه امجاد الثورة والسادات لم يكن الاحق بالحكم لانه النائب الثانى بعد الشافعى رحمه الله 00اما مبارك فاعتقد ان يداه مازالت ملوثه بدماء السادات هو وابو غزاله لانه ليس من الطبيعى ان يقتل رئيس الدوله وسط جيشه وبدل من ان يحاكم وزير الدفاع (ابو غزاله )يقلد اعلى الاوسمه والنياشين ويصبح المشير ابو غزاله بالله عليكم كيف تنتظرون الرئيس القادم وما هو السيناريو الذى سوف يجلس به على الكرسى 000الله اعلم واخيرا كما قال الشعراوى 00شعبا اسفا ان يكون سلبيا"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124920/http://masr.20at.com:80/article.php?sid=615"

