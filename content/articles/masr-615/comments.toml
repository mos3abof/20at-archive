subject = "ايه اللي بيحصل في مصر"
author = "مصراوي نفسه يرجع مصر"
posted = "2006-07-06"
text = "انا عايز اعرف هو فعلاً في مصر الان رياح تغيير ومش عارف ايه ولا كله كلام وهيصه, انا بقالي في ايطاليا سنة ونصف, قبل ما امشي مكنش فيه حاجة من ديه خالص, يعني ممكن نرجع بلدنا تاني ولا هنفضل متغربين طول عمرنا, لو حد عنده جواب ياريت يطمني!!!"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124920/http://masr.20at.com:80/article.php?sid=615"

