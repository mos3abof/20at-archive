[[comments]]
order = 0
subject = "برافو"
author = "علي"
posted = "2005-12-29"
text = "السلام عليكم<br />والله برافو عليكم يا طلبة فلسطين، هو ده الشغل ولا بلاش، والله كان نفسي اكون معاكم، وان شاء الله اول ما اخلص دراسة هني العمل.<br />موضوع هايل جداااااااااا<br />هي دي الديمقراطية \"نتناقش حول ما نختلف عليه...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124859/http://www.20at.com/article2.php?sid=164"

[[comments]]
order = 1
subject = "كان الله في العون"
author = "احمد عمر"
posted = "2005-12-29"
text = "و الله رجاله<br />ربنا يوفكم و يجازيكم خير عن أمة المليار المغيبه و المسطحه من كل غالي<br />الهم ثبت أقدامهم و أنصرهم علي عدوك و عدوهم<br />اللهم آمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124859/http://www.20at.com/article2.php?sid=164"

[[comments]]
order = 2
subject = "بارك الله فيكم"
author = "ايوب صوان"
posted = "2006-02-25"
text = "بارك الله فيكم يا ابناء الله الكتلة الاسلامية على عملكم الدؤوب في شتى ميادين الحياة فلولاكم كيف نكون ؟؟؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124859/http://www.20at.com/article2.php?sid=164"
