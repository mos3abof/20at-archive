subject = "لو بيفهم الزفت اللي علق"
author = "واحد مفروس من تعليقات جمهور الموقع ده"
posted = "2006-12-25"
text = "قليل الذوق المنحط اللي معلق ع الموضوع وبيقول انه تافه،طب طالما و تافه يا ابن المهميمن انت،طب اكتب تعليقك بلغة عربية سلمية،ثم الموضوع ده لم يكتب لامثالك ياسيء الخلق ومنحط الطوية،انت بتفهم يااااااااض؟<br />انت عشان مبتفهمش ياحاقد ياغبي،مش هههزق فيك اكتر من كده..<br />ينعل ابو التعليقات اللي بتتنشر ع الموقع الغبي ده..<br />جمهور متخلف..<br />وعيال حاقدة<br />واخوان مسلمين..<br />وحاجة تجيب الاجل"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102848/http://masr.20at.com:80/article.php?sid=1356"

