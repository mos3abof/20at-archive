posted = "2006-12-27"
text = "الموضوع جميل و جديد<br />و فعلا دا بيحصل و بنشوفه حتى لما بنستلف مذكرات من حد ممكن كتير نلافقى هوامش من النوع دا<br />و انا شخصيا بحب اسيب بصمتى على كتبى الخاصه و علشان كدا بكتب بالرصاص علشان لو حد استلفها و كان فيها حاجه شخصيه امسحها<br />و كتير بلاقى صعوبه انى احافظ على اى كتاب استبفه من التعليقات و بيحصل انى اعلق بالرصاص و امسح التعليقات قبل ما ارجع الكتاب لصاحبه<br />عادات بقى"
