posted = "2009-11-19"
text = "مش الجبلى دة اللى قعد يبوس فى جمال مبارك يوم مبارة الجزائر فى القاهرة<br />هو فاضى للصحة<br />دى راجل بتاع بيزنس وعلاقات وفلوس ومستشفيات خاصة وقعدات مع ولاد الكبار<br />صحة اية<br />عايز تعرف صحة يعنى اية - روح زور مستشفى حكومى فى اى مدينة او حى شعبى هتلاقة المزبلة احسن وانظف منها"
