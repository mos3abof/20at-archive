[[comments]]
order = 3
subject = "العراق"
text = "صدام حسين القائد الضروره هل تعلم من هو ابوه هو احد الصاغه(صائغ ذهب )يهودي وبعده تزوجة امه من جريو وبعدذلك تزوجت من حسين المجيد وصدام عمرهستة اشهر واهل العوجه جميعهم يعرفون ذلك"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926225847/http://www.20at.com:80/article.php?sid=101"

[[comments]]
order = 4
subject = "العراقي/الديوانيه"
text = "صدام ياخزي العراقيين ..تعليقنا الذي يحمل عنوان العراق ..هذا حقيقه ولست تبلي على الرجل وهل يعلم القاريء الكريم ان صدام اعتدى على ابنت خاله قبل الزواج وهرب الى مصر وحملت بولدها عدي وهي لم تتزوج بعد وتم زواجهم هو في مصر وهي في العراق بعد التهديدمن قبل خيرالله وعبد الطيف"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926225847/http://www.20at.com:80/article.php?sid=101"

