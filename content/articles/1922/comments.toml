[[comments]]
order = 1
subject = "موافقة"
author = "ثريا راشد"
posted = "2005-12-12"
text = "اشكر الموقع جدا على طرح مثل هذا الموضوع المؤثر فلو تم باسلوب صحيح وفي اطار عاداتنا وتقاليدنا فسيحقق نجاحا كبيرا على ان يتم بواسطة الاهل وليس الفتاة صيانة لكرامتهاوعزتها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154846/http://www.20at.com/article2.php?sid=11"

[[comments]]
order = 2
subject = "صعب"
author = "داليا"
posted = "2005-12-12"
text = "على فكره الموضوع صعب جدا ان بنت تعرض نفسها للجواز واحنا ايامنا غير ايام الرسل و الصحابه وبعدين لو حصل ده يبقى بطريقه غير مباشر ومش البنت هي اللي تقول ويبقى عرض الموضوع من غير ان البنت تبقى رخيصه او جريئه او مس لكرامتها لان الحياء اهم حاجه للبنت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154846/http://www.20at.com/article2.php?sid=11"

[[comments]]
order = 3
subject = "تجربتي"
author = "مصباح"
posted = "2006-04-21"
text = "لقد حدث هذا الأمر معي<br />أعز صديق لي عرض على أن يزوجني أخته<br />و قد فاجأني هذا كثيراً .. و في نفس الوقت رفع من قدر صديقي عندي و بدا لي أكثر رجولة مما كنت أعتقد<br />فهو يفكر في أخته كأنها ابنته و يسعى لتزويجها ممن يعتقد في صلاحه<br />و أنا أرى هذا قمة من قمم الإحساس بالمسئولية و الرجولة الحقيقية<br />بغض النظر عما إذا كان الموضوع سيتم بالفعل (الزواج) أم لا<br />و قد نويت أن اختار لبناتي بإذن الله إذا رزقني الله بالبنات - طالما أن ذلك ليس فيه أي شبهة إكراه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154846/http://www.20at.com/article2.php?sid=11"

[[comments]]
order = 4
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-18"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154846/http://www.20at.com/article2.php?sid=11"
