text = "وسام كمال راحت وسام كمال جت .. يا جماعة حرام عليكوا سيبتوا الموضوع الاصلى بتاع السيما وضيعتوا وقتنا فى واربورى رايح وابورى جاى .. اللى يستحق التعليق هى الفكرة اللى تجنن مجرد انك تعرض افلام ماحدش هيشوفها ولا هيحس بيها ده انجاز ،مجرد ان الناس تشوف بداية فنان بلخبطه وعكه وادواته اللى لسه بتتشكل ده اللى لازم نعشقه ، الفكرة دى ممكن هيا صورة الفوتغرافيا اللى هيفضل فيها شكل الفنان وهو لسه لابس البربطوس وشايل فى ايده شنطة الكتب ورايح المدرسة موش تتوهوا فى وسام راحت وسام جت ..انما هيا مين وسام دى ياجماعة عندكوش صورة ليها ؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
