subject = "yehya_ayash@yahoo.com"
text = "بسم الله والحمد لله والصلاة والسلام علي رسول الله<br />انا تعليقي بسيط جدا<br />انا فتحت اللينك بتاع الفيلم وبدأت اتفرج وقولت ياسلام اخيرا هيبقي فيه سينما كويسة الواحد يتفرج عليها<br />لغاية ما الولد راح رن الجرس وفتحت له واحدة<br />ففوجئت انها مش محجبة والمفروض طبعا ان اللي عمل الفيلم ده منتظر طبعا تهنئات علي العمل الجديد ده<br />انا بقول لك ان كل واحد شاف شعر الست اللي طلعت دي فهو اخد وزره لان طبعاشعر المراة عورة ولا ايه؟ انا طبعا ما كميلتش الفيلم بعدها يا اخواننا اتقو الله المواضيع اللي انتو حاطينها كلها بتخدم الاسلام بشكل كويس ودي حاجة جميلة لكن الفيلم ما ينفعش يتحط في موقع فيه الحاجات دي للسبب اللي انا قولت عليه ما ابقاش بتفرج علي فيلم فيه ظهور لعورة علي شمال الصفحة وعلي يمينها مكتوب حسن البنا وعمرو خالد ويوسف اسلام اتقو الله انا بحاول انشر الموقع ده لكل اللي اعرفهم فياريت ما يلاقوش حاجة يفكرو انها عادي ومقبولة وحلال وهي حرام لكن للاسف محطوطة في الموقع فبالله عليكم يا ريت حد يرد عليا"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

[[comments]]
order = 37
subject = "أخي العزيز"
text = "أخي العزيز الذي كتب التعليق الذي يعلو هذا التعليق، رغم أنني أحد االعاملين في هذا الموقع، إلا أنني لا أتحدث هنا باسمه ولا أدافع هنا عن الفيلم، ولكني سأفكر معك كما يقولون بصوت عالي..<br />وأحب في البداية أن أشدد على أن الفن مثله مثل السياسة والرياضة، يجب أن يقدم في صورة تتواكب مع الشريعة الإسلامية رغم ما يدعيه العلمانيون وأمثالهم من أباطيل.. كما أنني أشدد على أن الغاية لا تبرر الوسيلة..<br />ولكن لا أعلم (وأنا هنا أفكر بصوت عال كما ذكرت) هل من الأفضل أن نقدم فيلماً به مخالفة شرعية بسيطة أم نترك المجال والوسط الفني كله لمن يقدم ساعتين من المخالفات الشرعية ؟؟<br />خاطر آخر يلح على ذهني: هل الأمر يمكن أن يصبح مثل تحريم الخمر الذي جاء على مراحل؟.. لماذا لا نشجع المباردات الأقل خطأ من أن أجل أن نصل إلى فيلم سينمائي محترم بدون أدنى مخالفة شرعية؟؟<br />مجرد أسئلة.. أعرضها على أخي الذي كتب التعليق السابق"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

