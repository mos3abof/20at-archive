text = "السلام عليكم ورحمة الله وبركاته<br />يا اخوننا انا اعتراضي ما كانش لان في واحدة مش محجبة طالعة في فيلم ديني انا عارف ان الفيلم مش ديني ومش شرط ان الفيلم علي شان يبقي حلال يبقي ديني بيتكلم علي احداث دينية وسير بس لا ممكن حاجت اجتماعية وبس بل علي العكس ده ده مطلوب في الوقت الحالي<br />لكن انا اعتراضي كان علي ان الموقع الرائع ده كل الظواهر اللي فيه تؤكد ان هو مش موقع شبابي عادي لا ده موقع شبابي له هدف جميل وفي نفس الوقت حريص علي انه ما يجيبش حاجات حرام<br />بدليل ان معظم المقالات اللي في الموقع مافيهاش حاجة حرام ومعظمها ديني بدليل انه لما حب انه يتكلم عن المغنيين اتكلم عن المغنيين الاسلاميين زي مصطفي محمود وسامي يوسف ويوسف اسلام وكمان المقالات زي خطابات حسن البنا والرابط بتاعكم بيودي علي موقع الاستاذ عمرو خالد<br />فانا بقول<br />ان كل واحد هيدخل علي الموقع ده<br />هيقول علي طول ان ده موقع اسلامي لكن مش متشدد لا ده روش كمان وحلو<br />فالمفروض لو حد حب انه يحط الفيلم ده فالمفروض يعمل حساب ان اللي هيتفرج هيبقي عارف ان الحاجات اللي في الفيلم دي اكيد اكيد بدرجة مية في الميةمش حرام ولا ايه؟<br />فكون وجود واحدة مش محجبة فدي حاجة حرام حرام حرام حرام بس للاسف الشخص العادي اللي هيتفرج هيفكر ان دي حاجة عادية جداجداجدا ان واحدة تظهر شعرها لان الفيلم بيتعرض في موقع عشرينات وزي ماقولتلكم الموقع بتاعكم كل يوم بيتنشر ما بين الشباب اكتر واكتر وانا من ضمن الناس الي بيساعدو علي كدة<br />ولو يعني هي لابسة حجاب هل ده هيأثر علي فكرة او قصة الفيلم لا ابدا والله<br />يا ريت يا اخواننا ما نقعدش نرد علي بعض وخلاص وكل واحد يقول رايه الشخصي وبس لا يا ريت نرجعى لعلمائنا ونسألهم<br />زي مثلا ما في اخ بيقول ان احنا عايزين نعمل حاجة هادفة في وسط الهيافات اللي موجودة فما فيش مانع يكون في بعض المخالفات الشرعية كبداية بس هل انت رجعت لعالم من العلماء وهو اللي قال لك كدة يا اخواننا ارجعو لواحد زي استاذ عمرو خالد وشوفو رأيه ارجعو لواحد زي الدكتور طارق السويدان وشوفو رأيه ارجعو لواحد زي الدكتور يوسف القرضاوي وشوفو رأيه الله يكرمكم خلي الحب هو الشئ الاساسي اللي بيربطنا ببعض احنا كلنا في مركب واحد وكلنا هدفنا واحد وهو الاصلاح فما ينفعش طريقة الردرد في التعليقات دي وجزاكم الله خيرا ووالله انا بحبكم كلكم في الله<br />اخوكم حسين"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

[[comments]]
order = 46
subject = "فكرة رائعة وبداية جيده- محمد صيام"
text = "الحقيقة ان الفكرة رائعة ورائده وستحسب لموقع عشرينات الفكرة اعجبتني جدا وبالتأكيد ساتابع الأفلام التي ستعرض تباعا اولا ليقيني ان مصر حبلي بالاف المواهب اللامعه فقط ينقصهاالفرصه وهاهي فرصه لكل موهوب جائته علي طبق من ذهب اسه موقع عشرينات<br />تحيه خاصة للمسئولين عن الموقع<br />بخصوص العمل الاول لعبه البيت<br />الفيلم يحمل فكر عميق<br />عرضها ببساطه في خمس دقائق<br />انا لست متخصص لكن هاو وازعم اني متذوق<br />أعجبني في الفيلم فكرنه والديكور والاخراج<br />لم يعجبني رداءة الصوت والألوان وبالطبع حجم الملف هو الذي يحكمهم لكن اعتقد في المرات القادمة يجب ان تكون الجوده عالية لاننا نتعامل مع الصورة فاذا كانت سيئة ربما انصرف الكثيرون عن مشاهدته<br />شكرا جزيلا لكل من ساهم في الفيلم<br />محمد صيام"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

[[comments]]
order = 47
subject = "خطأ وضع الصور مع عنوان الموضوع"
text = "السلام عليكم<br />انا لو صاحب الصورة المنشورة مع الموضوع<br />ارفع عليكم قضية قذف وسب واكسبها<br />انا لست مدخنا<br />وادعو الى ابتكار وسائل جديدة لحث المدخنين للاقلاع عن التدخين<br />ولكن بأدب<br />وثانية مراعاة اصول العمل الصحفي<br />لأن لو كل موضوع بالصورة دى مش الامن السياسيى اللى هايقبض عليكم<br />لأ دا الامن الجنائى<br />وبدل ما تقعدوا فى مزرعة طرة مع الناس المحترمين<br />هاتقعدوا فى السجون بحق وحقيق<br />شكرا"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

