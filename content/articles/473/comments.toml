subject = "وسام كمال"
text = "فكرة السينما طبعا ممتازة بالطبع<br />ولكنها مثل الموقع تماما<br />تنفيذها سيء<br />ياريت لما الواحد يحب يقدم فكرة جديدة<br />يبدأها بشكل جيد<br />فكان من الأفضل الاستهلال بفيلم أفضل !<br />أليس كذلك؟<br />wesamkamal@hotmail.com"
