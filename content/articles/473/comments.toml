[[comments]]
order = 2
subject = "عباس الأبيض"
text = "يا جماعة الأستاذة وسام لا قلبت ولا حاجة ..<br />هي بس بتقول رأيها ..<br />وأحنا لو خسرنا الاستاذة وسام موش هنبقي خسرنا انسانة ممتازة فقط<br />بل سنكون خسرنا استاذة متمكنة من فنون النقد والمراجعة والتصحيح ..<br />عندك مثلا تعليقاتها السابقة والتي تجدها علي طريقة ..<br />وسام كمال ..كويس<br />وسام كمال ..ممتاز<br />وسام كمال ..موش بطال<br />وسام كمال ..عايز ملح<br />وسام كمال ..يتقدم بارد<br />وسام كمال ..خصم اسبوعين<br />وسام كمال ..برافو يا دقدق<br />وسام كمال ..نظر<br />وسام كمال ..seen<br />وسام كمال ..نجمة ع التكيت ونجمتين ع الجلاد<br />والله العظيم منورة يا استاذة وسام"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

[[comments]]
order = 3
subject = "واحد والسلام"
text = "طب بدل القلبة ع الموقع<br />متورينا شغل حضرتك يا ست وسام<br />ولا احنا اخرنا نشتم وبعدها نقول<br />هتخسروا انسان عظيم<br />أو موش هتقدروا تعوضوا البني ادم ده<br />او الاخ فلان اللي شاتمكم ده راجل متخصص وكلامه مهم جدا ولازم تخدوا بالكم<br />علي حد علمي ان الانسانة العظيمة كانت بتكتب ف الموقع<br />وان الموقع متنطور فيه بانر صغير كدة لموضوع خطابات حسن البنا وده نفس الموضوع بتاع وسام كمال<br />شوية منطقية وعدم تناقض والنبي يا جماعة"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

[[comments]]
order = 4
subject = "Muhammadan"
text = "بداية أنا لا أعرف من المسئول عن موقع عشرينات .. ولكن يعجبني الفكر المتطور ..<br />وفكرة سنيما أونلاين .. فكره جديده .. قامت بتنفيذها عشرينات كبدايه ... وأكيد راي<br />والتاني هايخليها تغير طريقة تنفيذها ... ومجرد رأي من الصحفيه<br />وسام<br />ميخلّيش الناس تسيب الموضوع نفسه وتكتب عن رأي شخص قام بالتعليق على فكره .... ولكن<br />آرائنا يجب أن تكون بنّائه لكي نقوم بالإستفاده منها كلنا وليس الموقع فقط<br />وللعلم<br />أنا<br />من أشد المعجبين بمقالات وسام .. ولكن ارفض فقط طريقة التعليق اللي تنسّي الواحد<br />هدف التعليق نفسه<br />لأن<br />هي قالت رأي .. أعتقد أصحاب الموقع هايفكروا فيه ... باقي التعليقات بئه هنستفاد منها إيه ؟<br />شوية<br />رغي وبس ...<br />أرجو<br />إن مفيش حد يزعل مني .. بس حبيت أصحصح الناس بس<br />أخوكم<br />Muhammad"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

