[[comments]]
order = 7
subject = "القيصر"
text = "1-تصوير الفيلم ضعيف الامكانيه من ناحيه الزوايا والالوان وطريقه العرض.<br />2-الفيلم مالهوش فكره خالص سوى ان طفل وطفله بيلعبوا مع بعض واتخنقوا رجعوا لبعض تاني.<br />3-طيب ايه هدف الفيلم.<br />4-اسم الفيلم لعبه البيت وده واخدينوا من مسرحيه لعبه الست...الاسم مش لايق تماما على مضمون الفيلم.<br />5-ممكن نسميه لعبه الطفل...لان انا لما قرات اسم لعبه البيت جه في بالي انها حاجه بين راجل وزوجته ...اسره وجيرانها...بس اتصدمت لما شوفت الفيلم.<br />6-فكره سينما عشرينات جميله جدا جدا جدا..بس انتوا استعجلتوا ونزلتوا الفيلم بسرعه من غير ما تشوفوا اذا كان الفيلم يصلح لاول طلعه لفكره السينما."
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

[[comments]]
order = 8
subject = "منى أبوالحسن"
text = "أولا: الفكره عجبتني جدا..و أنا سعيده بيها ولو اني اتفاجئت زي كل القراء..<br />الفيلم ضعيف الامكانيات، لأنه مشروع تخرج لبعض طلبة المعهد العالي للفنون المسرحية، يعني متوقع ان الامكانيات و الأداء يكون متواضع و ليس به احتراف.. و أعتقد ان الموقع عموما فيما يختص بالموضوعات الفنيه و الأدبية، بيقدم محاولات الشباب و تجاربهم الأولى بغرض تلقي النقد البناء و الاستفاده منه و تحسين الأداء.. فأرجوكوا يا جماعة تبقى التعليقات للغرض ده، مش تكسير مآديف و تحبيط همم..<br />الأستاذة الفاضلة وسام كمال:<br />مع كامل احترامي لحضرتك، أرجوا انك توضحي اوجه النقص الي حضرتك شايفاها في الموقع، عشان نحسن من أدائنا.. و شكرا لاهتمامك"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

[[comments]]
order = 9
subject = "منى أبوالحسن"
text = "قيصر:<br />الفيلم ليس مأخوذا عن \"لعبة الست\".. والغرض مش بس \"لعب عيال\".. لكن المدلول واضح من اسم الفيلم، ان اللعبة دي بين الولد و البنت هي نموذج مصغر و رمزي للحياة الزوجية بين الرجل و المرأة بوجهة نظر معينة.. \"حب و سعادة.. خلاف ممكن بسبب وجيه أو بسبب تافه.. صلح و سعاده تاني و كأن شيء لم يكن\".. مش هيه دي الحياة الزوجية عموما؟"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

[[comments]]
order = 10
subject = "حزين والله"
text = "يا إخوانا الأفاضل<br />مش لازم كل رأي يتقال نفضل نتخانق عليه وحوله والله يا جماعة ده خلل في التفكير مش هين وأتصور أنه أحد المشاكل الرئيسية وراء تخلفنا كعرب ومسلمين<br />النقطة التانية هل الاخوة بتوع عشرينات قالوا إن ده فيلم لفيلليني ( أعظم مخرجي إيطاليا) ولا لهيتشكوك ولا سبيلبرج ولا عاطف الطيب هما قالوا دي سينما شبابي بتاعت طلبة متخرجين م الجامعة<br />الحاجة لتانية انا قرفت بقى من الإخوة اللي حاجزين في المكيف طول عمرهم وكل ما يشوفوا واحد بيعمل حاجة برة أتوبيس البطالة والأنتخة اللي راكبينه يقولوا ياي.. سوفاج الحقوا الناس بيعملوا ايه<br />بصراحة نفسي واد جدع ولا بنت أصيلة يشوفوا الفيلم سهل كدة فيقولوا يللا بينا نصور فيلم بقى على مزاجنا وبرؤيتنا ...<br />بدل ما احنا قاعدين زي ملك الجمل وزوزو ماضي في أفلام يحيى شاهين وماجدة وعماد حمدي"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

[[comments]]
order = 11
subject = "عبد الواحد استيتو"
text = "أولا، أمنح نفسي حق التعليق على كل التعليقات رغم أنه أول تدخل لي. أرجو إن تعذروني إذن.<br />أتفق مع الأخ أو الأخت الذي قال أن أدب الا ختلاف ينقصنا إلى أبعد حد. لم أدخل منتدى أو مكان تعليقات إلا ووجدت هجوما كاسحا من الجميع على الجميع. باختصار أغلبنا يتبني شعار: إما أن تكون أنا... أو تكون أنا. و لا خيارات لديك.<br />الجدل الذي لا يهدف إلا إلى الجدل و النقد الهدام يفضل أن يتجنبه الجميع. فنحن نلوم الآخرين على الأخطاء التي نرتكبها نحن.. و قد نهانا رسولنا صلى الله عليه و سلم عن الجدل... بل حتى لو كنت على حق!!<br />لأنك في الغالب ستصل إلى لا شيء.<br />أما النقاش المفيد البناء فهو ما نحن في أمس الحاجة إليه.<br />الآن ، آتي إلى الفيلم و أنثر ملاحظاتي كما يلي :<br />1 - مجرد فكرة فيلم قصير يبث عبر موقع هي فكرة ممتازة و سباقة، لذا استحق القيمون على الموقع الشكر.<br />2- اقتباس فكرة الفيلم من قصة يوسف ادريس لم تكن موفقة، خصوصا انه من الواضح أنه تم اقتباسها لمجرد أنه يوسف ادريس..لا أقل و لا أكثر. ففكرة الفيلم بسيطة جدا تقترب من السذاجة.<br />3 - الملاحظة السابقة لا تنفي كون الفيلم يستحضر لقطة إنسانية جميلة و لذيذة عشناها جميعا و بشيء من التغيير كان من الممكن أن تكون أفضل.<br />4 - الموسيقى التصويرية ناجحة و لم أفلح أن أجد بها ثغرة ما.<br />5 - الصوت و الصورة رديئان و تنقصهما الجودة.<br />6 - أداء بطلي الفيلم رائع رغم صغر سنهما، و رغم أن من يقوم بتصويرهما هواة.. إلا أنهما مثلا باحترافية. يستحقان التهنئة.<br />7 - الظلام المحيط بالفيلم لم يكن ناجحا في نقل المشاعر المفترضة في الفيلم. كان من الممكن أن تكون الإضاءة أفضل.<br />8 - مقدمة الفيلم و آخره فيهما ابتكار و طرافة و لا تعليق عليهما.<br />أخيرا، أهنئ كل من ساهم في هذا الفيلم. عهذا تكون البدايات. ننتظر المزيد."
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

[[comments]]
order = 12
subject = "الدين لله والسلطة للشرطة والقهر للجميع متأثر جداً"
text = "أولاًً:<br />زعلان من الموقع لأنه مش ممكن نكون بنعرف نفسنا في \"من نحن\" بأننا شباب متفتح وبيقبل الآخر واول ما نتنرفز نتنرفز في موضوع رأي حتى لو كان فيه اساءة او جليطة\"انا باستخدم صيغة الجمع -نا- لأني باحب فكرة الموقع جداً وكان نفسي اعملها قبل كده في شكل مجلة لكن المشروع لم يستمر لضيق ذات اليد او لضيق ذات المخ.<br />ثانياً:<br />برضه زعلان من الموقع تاني, مش معنى ان الآنسة وسام كتبت في الموقع لفترة وراسلت جريدة \"محترمة جداً جداً جداً\" زي صوت الأمة اننا نطلق عليها لقب صحفية . . هي متدربة, وبعد اتقانها لحرفة الصحافة وتحليها بآدابها واخلاقها في عرض الرأي والخلاف من الممكن ان نحاسبها كصحفية, انما حالياً . . ظلم لها ولنا وللموقع ان نحاسبها على ما لم يكن.<br />ثالثاً:<br />عتاب للآنسة وسام كمال, الموضوع منشور في موقع عشرينات . . صح!!<br />ما دام الموقع بهذا السوء! لماذا تلجأ عقلية نابهة مثلك ذات قلم قاطع ومضاء الى تصفحه والدخول عليه من الأساس؟ فضلاً عن انك عملتي به وادركتي كم ما به من ضعف وسوء كما ترين؟!!<br />كما ان الموضوع يتناول فيلم هو مجرد مشروع تخرج طلابي ولم يتناول من قريب او بعيد تصميم الموقع او طريقة ادارته مما يجعلني شبه متأكد انه كان هناك ما يشغل بالك اثناء كتابة التعليق فخلطتي الأمرين بعضهما ببعض كرفض بعض الموضوعات مثلاً او حدوث بعض التغيرات في قناعاتك الفكرية إذا كنت تملكين بعضاً منها.<br />هناك حكمة تقول بدلاً من ان تلعن الظلام 1000 مرة اوقد شمعة واحدة ولذا انا ادعو الناقدة السينيمائية وسام كمال لترشيح فيلم يصلح ان يوضع في موقع للشباب."
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

