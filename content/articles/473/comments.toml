subject = "متترياش لو سمحت علشان كده عييييييييييييييييييييييي"
text = "السلام عليكم<br />بالنسبة للاخ اللى بيتريا على النقاب و بيقول عليه بعبع , عيب اوى , المفروض انك عارف ان زوجات النبى كن منتقبات ,و المسلمات كن يرتدين النقاب حتى فترة اريبة و افلام ثورة 19 تبين كده , يعنى عيب تتريق على كل دول , انت مش مقتنع بالنقاب ده رايك و احتفظ بيه لنفسك .<br />استغربت ان الموقع حذف تعليق الاخ اللى اتريا على الفليسطنيات و محذف التعليق ده .<br />و فى اخ تانى بيقول ايه علاقة الفن بالدين , يعنى الواحدة ممكن تكون عريانه فى الفلم و تخدلها كام بوسة و اللذى منه , و بره الفلم تتحجب و تصلى و تحج و تبا اسمها متدينة و كل سنه تعمل عمرة و فيلمان و حلو الحياة يا لولو .....<br />و السلام عليكم"
