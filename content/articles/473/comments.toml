subject = "يرجى تحسين جودة الصوت"
text = "السلام عليكم<br />رداءة صوت المادة المعروضة هي انتقادي الوحيد، و أعلم أن هذا يرجع لإعتبارات ضغط حجم الملف ..<br />أما الإيجابيات فهي كثيرة ما شاء الله. أقلّها أننا قد نتيح بهذا الفرصة لمن يريد أن يسلك مسلك الفن السينمائي النظيف الهادف في بدايته أن يستمر و يجذب جمهورا بل و ينجح، بدلا من ((أخد الطريق من قاصره)) و ((الدخول في المضمون)) عن طريق تقديم الفن (إيّاه) المبتذل المصاحب له القفشة الكوميدية التافهة و الحسناء المتبرّجة فحسب.<br />شكرا لإتاحتي الفرصة<br />menSh"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

[[comments]]
order = 28
subject = "الجانب الشرعي"
text = "السلام عليكم<br />الفكرة طيبة ولكن بعيدا عن الشق السينمائي والنقدي يجب مراعاة الجانب الشرعي فيهاحتى تكتمل الفائدة. فمثلا يمكن بدلا من أن تظهر \"أم الطفلة يسرا\" سافرة - يعني شعرها مش متغطي - يمكن أن تظهر مرتدية ولو طرحة. ممكن واحد يقول تطبيق الشرع فى السينماصعب، نقوله بس مش مستحيل، لدرجة إنك ممكن توصل للجمهور حدث ما ينفعش يظهر على الشاشة ويكون عن طريق الحكي أو السرد.<br />المادة المعروضة دي أمانة وربنا هيسألكما عنها، فلنتقي الله فى المشاهدين وخاصة الشباب واللي بياخدو المادة من الموقع كأنها مسلم بها.<br />السلام عليكم"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

