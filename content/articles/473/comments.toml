subject = "مكسوفة"
text = "شوفو أنا هاقولكم انتو ليه مش مبسوطين من الفلم ؟<br />لأنكم أصلا مش قريتو القصة<br />القصة بتاعت الأديب الكبير الراحل الأستاذ يوسف ادريس في مجموعة قصص قصيرة<br />أنا والله يوم ماقريتها عيطت بجد<br />لأنها قصة معبرة جدا ومؤثرة<br />والفلم بجد صورها وصور أحاسيسها<br />سيئة ليه بقى ؟؟<br />هي بس الست التخينة اللي لابسة جلبيا بيضا دي مش كانت حابكة الدور أوي<br />بس الولاد يجننو<br />أنا باعزمكم تقرو القصة<br />وهايعجبكم أوي الفلم زي ما عجبني<br />مرسي أويييييييييي لعشرينات العسل ولكل من عمل الفلم دا وانا بجد عجبني خالص<br />حتى عجب كل اللي بحبهم كمان :)"
archived = "2005-02-16"
capture_url = "https://web.archive.org/web/20050216093436/http://www.20at.com:80/article.php?sid=845"

