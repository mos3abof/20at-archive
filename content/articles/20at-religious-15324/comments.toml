author = "محمود محمد"
posted = "2010-02-14"
text = "ولن ترضى عنك اليهود ولا النصارى حتى تتبع ملتهم<br />يجب عدم النظر الى مثل هذه الافعال من ناحية الحلال والحرا وفقط ولكن يجب النظر الى ابعاد اخرى قد تنتج عنها فبالامس منع بناء المآذن واليوم منع الاذان وغدا لا ندري ما سيحدث والمشكلة ان من المسلمين من يبرر هذه الافعال ويقول انها لمصلحة المسلمين بدلا من ان يدافع عن عقيدته ولينظر هؤلاء الى ما يفعله النصارى في الخارج من الدفاع عن عقائدهم"
archived = "2010-02-16"
