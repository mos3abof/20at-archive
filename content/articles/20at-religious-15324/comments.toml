text = "أنا مش عارف هو الأذان مجننهم في إيه..يعني هو مش زي الجرس بتاع الكنيسة؟<br />ولا جرس الكنيسة زي انغام البيانو عندهم وعلى قلبهم زي العسل؟<br />ازاي نسكت على كده احنا اللي عاملين كده في نفسنا ومهزقين نفسنا"
