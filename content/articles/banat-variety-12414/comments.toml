text = "الكلام ده صح بنسبة 100% انا شنطتى مهمة جدا جدا جدا ومن غيرها بحس انى ناقصنى حاجة كبيرة ورغم انها بتكون تقيلة من كتر محتوياتها وعبء عليا بس انا بحس ان كل ما الشنطة تكون ممتلئ ده بيعطى المراءة شئ من الثقة انها لو وقعت فى موقف هتلاقى الحل معها ومش بحتاج انى ادور فيها وانا شايفة ايدى خلاص حفظت شكل وملمس كل محتوايتها"
