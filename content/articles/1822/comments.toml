[[comments]]
order = 0
subject = "اعشق قناة الجزيره"
author = "حمدي"
posted = "2006-07-09"
text = "قناة الجزيره ماذا اقول عنها ؟؟<br />قناة الجزيره بالنسبة لي هي افضل ما انجاز حققه العرب او بعض العرب في التاريخ الحديث ...<br />ليست مبالغه ... بل هي الحقيقه<br />الجزيره بالنسبة لي تعني الحريه ووالكرامه والامانه والموضوعيه الي حد كبير<br />من الجزيره عرفت ماهي الديمقراطيه وما هي حرية الانسان وكرامته وحرية الراي<br />من الجزيره عرفت تاريخنا الحقيقي تاريخ امتنا بعيدا عن كتب التاريخ المزوره التي تملا مكتباتنا<br />الجزيره هي التي فتحت ابواب الحريه علي مصراعيها للاعلام العربي ولها الفضل في هذه النقله النوعيه في الاعلام العربي<br />من الجزيره تاكدت ان في هذا الوطن اعلاميين محترميين يجيدون عملهم بمهنيه واحتراف وامانه<br />ادعو الله العلي القدير ان تستمر الجزيره في رسالتها في تنوير الامه وفي كشف الطغاه والفاسدين العرب وغير العرب<br />وادعو الله ان يحفظها من كل من اراد بها سوءا وان يحفظها من اعلاميي ال سعود ومن كتبة الانظمه العربيه الفاسده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153746/http://www.20at.com/article2.php?sid=1047"

[[comments]]
order = 1
subject = "ربنا يستر عليها"
author = "عمار"
posted = "2006-07-09"
text = "والله الواحد خايف لحسن الدور يجي على الجزيرة هيا كمان<br />مش عارف هتظل صامدة لغاية إمتى ، وهل تؤثر الضغوطات العربية والأمريكية على حياديتها ولا لأ<br />الموقع الجديد ظريف بس محتاج مجهود أكبر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153746/http://www.20at.com/article2.php?sid=1047"

[[comments]]
order = 2
subject = "مش عارف"
author = "عابر القارات"
posted = "2006-07-10"
text = "طبعا ما حدش ينكر ان قناة الجزيرة دخلت مناطق أول مرة قناة عربية تدخلها و لكن أرجوألا تفرطوا فى الامال و مدح قناة الجزيرة فبالرغم أننا سمعنا فيها كلام أول مره نسمعه فى قناة عربية و لكن ككل شئ فى الدنيا و خصوصا فى الاعلام فهى تستجيب للضغوط و خصوصا عندما تأتى من قطر البلد الحاضنة و المموله للقناة و يمكن التدليل على كلامى بالخطوط الحمراء التى لا تتعداهاالقناة و خصوصا فيما يتعلق بحكاية أمير قطر و والدة و القفز على كرسى الحكم من قبل أمير قطر الحالى و كذلك علاقات قطر المشبوهه و الغامضه بإسرائيل و إحتضان قطر لأكبر قاعدة عسكرية أمريكية فى الشرق الاوسط و التناقضات فى السياسة الخارجية و الداخلية القطرية ده حتى و للتدليل بصورة أكبر على كلامى ممكن أن تستعيدوا الحلقة التى قدمت من أسبوعين مع وزير خارجية قطر و محاورة المذيع الذى أحترمه أحمد منصور له ... أحمد منصور المعروف عنه أنه بيهاجم ضيوفه بصورة قد تبدو مستفذه و مهييجة للاعصاب فى كثير من الاحيان و لكن مع السيد وزير الخارجية بدى هادئ مستسلما لكل ما يقوله السيد الوزير بكل ما فيه من تناقضات و إستفزازات و حتى تخيلات و أعتقد بغض النظر عن حرفية و القبول المنقطع النظير التى تتمتع به الجزيرة فأعتقد و الله أعلم أن قطر قد أنشأت هذه المحطه كجزء من خطه تضخيم الذات و النفخه الكدابه التى بدأت مع تولى الامير الجديد حكم البلاد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153746/http://www.20at.com/article2.php?sid=1047"

[[comments]]
order = 3
subject = "بص من كل الزوايا"
author = "عمرو مجدي"
posted = "2006-07-11"
text = "صح يا عابر القارات ، كلامك صحيح بس إذا كان الجزيرة بتتراجع أحيانا ، فدا بسبب الضغوط و \"حسابات المكسب والخسارة\"<br />يعني مثلا تخفف النقد لدولة معينة في فترة ما بدل ما مكتبها في الدولة دية يتقفل خالص ، وبعدين ترجع تدوس وتشد ، وهكذا ... الخ<br />بخصوص علاقات قطر المشبوهة ، فبرضوه بص للموضوع كأفراد في الحكومة مش ككتلة واحدة، أكيد فيه أفراد لهم اتجاهات مغايرة لسياسة الحكومة ، زي وزير الخارجية مثلا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153746/http://www.20at.com/article2.php?sid=1047"

[[comments]]
order = 4
subject = "الغايه تبرر الوسيله"
author = "FM"
posted = "2006-07-12"
text = "شكرا لكل اعلامي من اسره قناة الجيزيره شكرا لكل حقيقه ، شكرا لكل ايضاح الموت حق في بثر قناتكم واناشخصيا اعتبر الشهيد هو شهيدكم لان الساكت عن الحق شيطانا اخرس والموت في الحق فضيله والله لو تفتح لي الجزيره ابوابها لاالبي النداء واتشرف وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153746/http://www.20at.com/article2.php?sid=1047"

