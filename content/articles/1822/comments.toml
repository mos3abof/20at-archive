subject = "مكمن الخطر"
author = "شادي أبو زيد"
posted = "2006-08-26"
text = "ان مكمن الخطر ايها العرب هو ما تتجاهلونه من مد غربي وشرقي على بلاد العرب وقد كان لقناة الجزيرة دورا غير مباشر على الاطلاق في تبيان هذا المد القناة التي جعلت الجهال منا نحن العرب نعرف ماهي اهداف حكوماتنا والغرب والشرق وهذ الكلام انما موجه الى من ليس لهم صوتا على السحة العربية والدولية واللبيب من الاشارة يفهم والسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153746/http://www.20at.com/article2.php?sid=1047"

