[[comments]]
order = 5
subject = "السودان"
text = "سلام عليكم<br />الوضع مختلف قليلا في بلدي فالطرحة هي جزء اساسي من الملابس سواء وضعتيها باحكام(محجبة)انا اعتبر نفسي ملتزمة واعرف تماما اني في اعماقي مؤمنة.<br />الفتاة التي زكرت انها خلعت الحجاب نحن لا نعرفها ولا نعرف كيف هي البيئة التي نشات فيها لكننا نعرف انها حاولت (اي لديها ايمان ولو ضعيف بانه امر صحيح هي ليست في غيبوبة )تاني حاجة اعترفت بذلك علي الملأ والاعتراف بالذنب فضيلة.<br />اذا إحنا قلنا عليها ساقطة ونبذناها ستميل علي من يحبوها بشكلها هذا اكثر اي انكم ايها المتفهمون افسدتم بدايتها المزعزعه وثبتموها حيث لا نريد."
archived = "2004-08-25"
capture_url = "https://web.archive.org/web/20040825102248/http://www.20at.com:80/article.php?sid=48"

[[comments]]
order = 6
subject = "أنرضى الذُل"
text = "الحمدلله وكفى والصلاة والسلام على النبي المصطفى أمابعد: أن أرى أن من قدِر على الجهاد فيلزمه القيام والمسارعة لنصرة أخوانه المضطهدين في شرق الارض ومغاربها في بلاد المسلمين وخاصة في العراق وما يحصل في سجن > وفي الختام نسأل الله العلي القدير بأسمائه الحسنى وصفاتة العلى أن ينصر أخواننا المجاهدين في كل مكان وأن يفك أسر المأسورين من المسلمين اللهم آمين ........؟"
archived = "2004-08-25"
capture_url = "https://web.archive.org/web/20040825102248/http://www.20at.com:80/article.php?sid=48"
