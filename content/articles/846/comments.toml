subject = "عجبي على الدنيا"
author = "ميتو"
posted = "2006-07-28"
text = "عجبي على الدنيا اللي خلت أول واحد يعلق بصورة زي دي ويفتكر إنه مختلف عنها!!!!!<br />الناس دي عايشة و عارفة أولوياتها لأنها مش عايشة زي البهايم.. زي ناس<br />أهل الصومال دول بالرغم من البهدلة اللي هما فيها.. مازالوا على الفطرة اللي ربنا خلق بيها الإنسان<br />الناس دي مش متأثرة بإعلام اليهود الكلاب ولا بأفلامهم الحيوانية ولا بكليباتهم القذرة<br />الناس دي عارفة الدنيا و حاسة بيها أكتر مننا إحنا أصحاب الموبايلات و العربيات و الدش و القنوات الفضائية و الإنترنت و أحدث الموضات ونسينا نمسك كتاب و نقرأه فمابالنا بالقرآن... حسبي الله و نعم الوكيل في اللي عمل فينا كده<br />ز ربنا يكرم أهل الصومال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123911/http://www.20at.com/article2.php?sid=1058"
