subject = "أنا كمان"
author = "وسام كمال"
posted = "2006-01-25"
text = "فعلا.. مصعب جميل، ويحمل الخير في قلبه، وكمان دمه شربااااااااااااااااات موت.. أتوقع له مستقبل رائع بإذن الله، طالما أن له صديق مثل براء، ويدفئ قلبه بحب كبير مثل حبه لبراء..<br />ربنا ما يفرقكم أبدا، ويطرح البركة في حبكم..<br />يارب يرزقني ربي بما أطلق عليه صلاح عبد الصبور \"أخ الروح\".."
archived = "2006-11-02"
