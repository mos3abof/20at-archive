subject = "تخيل الجنة"
author = "منارة الإسلام"
posted = "2006-02-01"
text = "الموضوع رائع لأنه يحي معنى الصداقة و قيمة الصحبةالصالحة وإن الصديق هو من يكون بجانبى على أى حال و أنا شخصياحبيت مصعب من خلال الموضوع والتعليقات على العموم أنا نتخيلة إن ربنا بيحب مصعب و لاأزكي على الله أحدا لأنه عزوجل قال إنى أحب فلانا فأحبوه ثم يوضع له القبول فى الأرض كمان نشكر براء لأنه أعطى الفرصة بأن نعيد النظرمرة ثانية فى أصدقاءنا و نقول لهم نحبكم فى الله وأتمنى أن يتخيل براء ومصعب و كل أثنان تحابا فى الله وهم تحت ظل عرش الرحمن يوم القيامة وصحبتهم فى الفردوس الأعلى مع خير الأنام صلى الله عليه وسلم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112618/http://www.20at.com/article2.php?sid=329"

