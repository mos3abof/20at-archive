[[comments]]
order = 27
subject = "من الفيوم ...انا ايضا اتحدث"
author = ".....صلاح"
posted = "2006-02-18"
text = "السلام عليكم.. منذ ان قرات المقال احاول ان اكتب تعليقا اعبر به عمااحمل فى صدرى لمصعب من حب ,رغم ان البراء قد تفوق على حتى قبل ان ابدا,ليس عجبا ان بحمل قلب لقلب اخر حب وتقدير ولبس عجبا ابضا ان تخبر من تحب بانك تحبه ,ولكن العجب ان يملئ عليك هذا الحب كل كيانك ووجدانك ,ان تحس وكانك محاصر بمجموعه من الاحاسيس الرائعه التى لا تود ابدا الخلاص او الفرار منها ,هذا ما احسه مع مصعب الخير, عرفته منذ 4 سنوات احببته منذ ان رايته ,دائما ما كان يذكرنى باحساس طالما لخصناه فى ثلاث كلمات تحمل فى طباتها اسمى معانى الحب والاخلاص والايمان جعلناها شعارا انها (الحب فى الله) كثيرا ما حلمنا بصلاح الدين ,كثبرا ما اعجبنا وجه قمر وحلمنا بان بسقط فى ايدبنا ,كثيرا ما شد انتباهنا سرب حمام محلقا فى فضاء الله كثبرا ما دعوتا الله بان يجمعنا فى حبه وطاعته فى الدنباوفى الاخره,عرفته هادئا السمت , طبب القلب , مسامحا دائما حتى فى اشد الاوقات ,مرت علينا ايام اصعب ما تكون كان لى فيها نعم السند بعد الله عز وجل ضرب لى فيها اروع معانى التسامح والحب لا يوصف الا بدمع العين كلماتذكرت ,لكم ادعو له ,هذه كانت بعضا مما يموج فى صدرى لمصعب الخبر ,اخيرا الى لقاء والبك اخر كلماتى (لكم مصعب ...احبك )والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112618/http://www.20at.com/article2.php?sid=329"

