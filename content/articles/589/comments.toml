subject = "براء ومصعب.. مصعب وبراء"
author = "جديد الموقع"
posted = "2006-01-26"
text = "إنتوا الإتنين مشكلة بالنسبالي من يوم ما عرفتكوا واشتغلت معاكوا!!<br />براء دايما يعقدني ويبهرني ويحرق دمي..<br />ومصعب دايما يحسسني بالبراءة والطيبة ويغيظني بأسماءه المتفائلة جدا على الماسينجر.. وبعدين يسأل عن أحوالي في حوار عمره ما زاد عن 10 دقايق !<br />لكن رغم كل ده، هما الإتنين من أهم الأسباب اللي بتدي عشرينات طعمها المميز، وهما أكتر ناس قادرة تحافظ على طابع عشرينات اللي حاسيته وحبيته من أول يوم دخلته فيه..<br />وحشتوني يا عشريناتيه.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112618/http://www.20at.com/article2.php?sid=329"

