order = 24
subject = "من الفيوم أتحدث"
author = "من واقع حبي وأحلامي أنشد في الكون أسلامي"
posted = "2006-02-05"
text = "السلام عليكم ورحمة الله<br />صديقي مصعب قد لا أكون كاتباً مثل براء<br />ولا شاعراً مثل ......صلاح<br />ولا رساماً مثل عمر<br />ولا دبلوماسياً مثلك<br />قد يكون اسلوبى سئ في التعبير عن المشاعر قولياً<br />ولكن كل هذا لا ينفى أننى احبك واقدر صداقتنا المنتهية على أعتاب بداية جديدة<br />صداقه عشنا فيها مرحله حملت الفرح وحملت الألم بعد قرائتى للمقال مر أمام عينى شريط صداقتنا ............<br />كتاب( إلى أخى فى الله لمجدى الهلالى) وجلسات الحدبث تحت الشجرةالتى أمام كلية الاثار ، التليفونات ، مشروع الميكانيكا وجلسة المكتبة مرورا بزيارتك عندما انكسرت رجلك وكانت اول مرة اقابك براء واسامة وزياراتك لى فى الفيوم بعد الضغط عليك لكى تأتى ........ومرحلة من الذكريات الجميلة عشنا فيها الالم وعشنا فيها الفرح<br />حلمنا تحت الكبرى عند موقف مصر ............... العمل فى الموقع<br />مر هذا بى مر...،مر بى ولكن فى حاله من الحزن بعدما وصلت علاقتنا الى ما وصلت اليه<br />عندما رأيت المقال واطلعت على تاريخه اكتشفت انه تاريخ اخر حوار معك وبالتأكيد تتذكر ما دار به<br />ففرحت ان معك من هو أفضل منى فى بعض الأمور وحزنت اننى افسدت عليك فرحتك بالمقال بحواري معك<br />أسف على ما سببته لك من ألم وأرجوا ،أن يوفقك الله فى أحلامك وحياتى تكون فيها على طريق الله المستقيم وسنة نبيه و أذكرك بقوله تعالى (ولا تتبعوا خطوات الشيطان إنه لكم عدو مبين)<br />وأذكر نفسى بما حمله جبريل الى الرسول (يا محمد : عش ما شئت فإنك ميت، واعمل ماشئت فإنك مجزي به ،وأحبب من شئت فإنك مفارقه ، واعلم أن شرف المؤمن قيام الليل وعزه استغناؤه عن الناس)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112618/http://www.20at.com/article2.php?sid=329"

[[comments]]
order = 25
subject = "من الفيوم أتحدث"
author = "من واقع حبي وأحلامي أنشد في الكون أسلامي"
posted = "2006-02-05"
text = "ما باله ما حاله ؟ تسؤ دوما فعاله<br />لم أدر ما حياته ؟ لم أدر ما ماَله؟<br />لقد ذاق طعم اليتم طفلا بأمه كما ذاق بالأب فى شبابه<br />هل تراني إلا من أجل مصعب أحزن<br />قد كان من قبل فينا فتى الزمان المدلل<br />يسير ينفخ فينا أملا ويبهر الناس حسنا<br />يزهو الندى ويهفو الجمال من أثوابه<br />فما تغير منه ؟ في كل شئ تغير<br />الأمل ما عاد املا والحسن ما ظل حسنا<br />أهكذا أنت يا مصعب يا أخي أنت و صديقي<br />رغبت فى العيش ضنكا من بعد عيش رقي<br />قد يسألني الناس ويقولون<br />ماذا يضرك منه إذا تبدل أمره<br />فأقول والحزن ينبت والهم يعلوا ويهبط<br />الأمر أبعد من ذلك الذي قد ترونه<br />أبيت أخشى عليه من الذي قد دهاه<br />فالناس للناس هذا قانون كل فضيله<br />وهذا أخي و صديقي فى يوما كان خليلى<br />الى براء أقول ومن بعد أسامه<br />ألا ترى ما أرى فتبتغيه رشادا<br />حتى نقوم منه من قبل أن يتمادى<br />ان سألتني عن سر حاله<br />السر ليس بخاف بل شاع بين الجميع<br />وإلا<br />ياحسرة لشاب قد كان يزهو ندياً<br />وأرجوا أن يكون ممن يقولون (مصعب)<br />غذاٌ ستعلم أنى عند البلاء فتى<br />روحي وديني وعقلي هذا الجهاد الأبي<br />أمسى هنالك داعياً لا يرهب الدنيا<br />عجباً لمصعب هذا رجع القاهرة مختارا<br />ما فكر فى أهل ولا زودهم زادا<br />براء !؟ عجيب أمره الصبى المدلل(مصعب)<br />يسير يحمل عبئاً وما هو مبالي<br />الى مصعب أقول :<br />قد بعدت عنا كثيرا ثم لم نسمع منك تفسراً<br />لولا أنك كنت خليلا لأحرقنا نارك بالنار<br />إن جئت لتشعلها كرها إن جيئت لتشعلها بعدا<br />هيهات هيهات<br />قد عدت للجنة أركض قد عدت عن النار أهرب<br />ان كنت تظن بنا شراً لا لا .. لست تعلم غيباً<br />فالله بالغيب أعلم<br />كم فلت إنك تبدو فى العقل أحكم وأفهم<br />يا مصعب أنت فى صحبك ذو عقل تحسن الفصل بحسن الرأي في أكثر الأمري<br />لو تأملت فالأمــــر جليل وخطــــير تفند الرأى فى جلاء وظهور<br />فاذا لم تلق سمعا فليسعك الرفض مشكورا<br />يا أخى ..يا أخى ...يا أخى قل سأسمع قل سأسمع ؟<br />أن كنت للخير دليلا أن كنت للرشد معينا<br />الله أبغى من حديثى بتعاليم الحبيب حبيبى صلى الله عليه وسلم<br />من واقع حبي وأحلامي أنشد في الكون أسلامي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112618/http://www.20at.com/article2.php?sid=329"

