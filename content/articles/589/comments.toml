[[comments]]
order = 13
subject = "حملة \"ما أحلى الرجوع إليها\""
author = "مروة السيد"
posted = "2006-01-26"
text = "أشكر محرر الموضوع على انه فتح المجال للحديث عن الصداقة، فهى تمثل جانب كبير فى حياة معظمنا واعتقد ان من غيرها صعب الواحديستمر فى طريقه ، وأحب اقولكم ما تيجوا نفعل الموضوع عمليا ونعمل حملة \"ما أحلى الرجوع إليها\" نظرا لأن مشاغل الحياة بتخلينا نبعد عن أصحابنا.<br />ممكن كل واحد فينا يتصل ب3 من أصحابه كل أسبوع اللى بقالهم حوالى 3 شهور ما اتصلش بيهم \" من أصدقاء ابتدائى واعدادى وثانوى وجامعة بالنسبة للناس اللى اتخرجوا...\" .<br />انا باحس ان الواحد لما بيقابل اصحابه فعلا كأنه استرد روحه من جديد ، فياريت نهتم بعلاقتنا الاجتماعية أكتر من كده.<br />أسفة للاطالة أو اذا كنت غلست فى الكلام<br />بس ياريت نفعل الحملة بجد.<br />وجزاكم الله خيرا<br />marwaelsayed20@yahoo.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112618/http://www.20at.com/article2.php?sid=329"

[[comments]]
order = 14
subject = "ربما كنا سويا"
author = "أرجوان"
posted = "2006-01-26"
text = "عندما قرات الموضوع...كلمة كلمة...كنت وقتها احدث براء على الماسنجر...و تلاقيه زهق من كتر اسالتى...ما زلت متابعه جديده لعشرينات و عرفتها عن طريق براء و هو احد معارفنا اذ ان اباه صديق ابى...<br />و عرفته ايضا بمحض الصدفه...سبحان الله<br />ثم عرفت ان مصعب كان فى باكستان...فاستغرب جدا حيث انى كنت هناك انا الاخرى...و اتذكر ان الجاليه المصريه كانت مترابظه جدا و تعرف بعضها بعضا...و لذا اتعقد اننا قد نكون كثيرا ما لعبنا سويا و تشجارنا اكثر<br />و لكن فى النهايه...اكتشفت ان الدنيا عالم صغييييييييير جدا تجد فيه معظم الناس مرتبطة ببعضها..<br />و اعظم رباط انهم ابناء ام و اب واحد<br />بارك ربى فيكم اخوتى و جمعكم دوما على طاعته و لا فرقكم ابدا يا رب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112618/http://www.20at.com/article2.php?sid=329"

