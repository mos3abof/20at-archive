[[comments]]
order = 5
subject = "عسوووووووووووووول"
author = "دعاء"
posted = "2006-01-26"
text = "جميل جدا الموضوع ده برافوووووووووو براء(هو انت على طول كده) الفكرة اكثر من رائعة فعلا فيه ناس في حياتنا بنحبهم قوي ومش مهم نقول لهم كل يوم اننا بنحبهم بس طبعا مهم نحسسهم بكده ، اما مصعب بقه فهو شخص اكثر من رائع وانسان الى ابعد الحدود ويستاهل كل خير ، وبراء طبعا حد جميل قوي هو طبعا مختلف عن مواصفات مصعب بس رائع بطريقة مختلفة، وهمه الاثنين زي العسل ربنا يخليهم لعشرينات وما يحرمناش من هلتكم البهية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112618/http://www.20at.com/article2.php?sid=329"

[[comments]]
order = 6
subject = "هنحب ايامنا"
author = "ديمة"
posted = "2006-01-26"
text = "لان انت براء ولان هو مصعب، ولان الموضوع عن صداقتكم كان لازم يعجبنى اوى ويخلينى عايزة اجيب كل الناس اللىبحبهم فى اودة واحدةواحبسهم فيها وما يطلعوش منها اداً، واجمل ما فى الموضوع انى متأكدة ان كل شلتى لما هتقراه هتفكر فى نفس اللى جه فى بالى ان احنا نيطل شغل وخطوبات ونطلع على اسكندرية ونسمع اغنية هنحب يارب لمحمد فؤاد."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112618/http://www.20at.com/article2.php?sid=329"

[[comments]]
order = 7
subject = "موش فاهمك يا براء"
author = "بيسو افندى"
posted = "2006-01-26"
text = "و الله موش عارف ابدأ منين...مبدئياً براء و مصعب انا فرحان بصداقتكم دى قوى ...و لو اتكلمنا مع براء الاول هقولك انتا مستوى كتاباتك ارتفع موت و عجبتنى بصراحة بس عارف على راى واحد صاحبنا بلال فضل بيحط حاجة بس مبعرفشى يحبكها او يقفلها مظبوط ..انا شايفك كتبت كويس قوى عن مصعب بس مأقنعتنيش انتا ليه اصلاً كتبت عنه ....<br />كنت ممكن تكتبله الكلام ده فى جواب و تقعد معاه فى نايل بولينج اللى عند السفارة الاسرائلية بخمسة جنيه و 2 ليمون و تقوله الكلمتين دول ...او ممكن توفر الخمسة جنية و كفاية على مصعب الجواب موش هينهب و ياخد جواب و اليمون كمان ممكن يبقى كوبرى الجامعة و واحد حلبسة فى السريع و تعبر عن مشاعرك تجاهه ...<br />بالنسبة لمصعب ..انا اول مرة فى حياتى اعرف موضوع باكستان ده مع انى اعرفك من فترة ...ربنا يوفقك يا مصعب انا شايف انك تطورت كتيييييييييييير عن اخر مرة اتكلمنا فيها مع بعض عن الشغل و امكانيات الشغل و الحاجات دى و مستواك بقى افضل كتير و ده اللى يخلينى اقولك انك لازم تاخد سلمة جديدة فى حياتك و تفكر كويس فى الموضوع ده علشان تحس بتطور ....<br />بس فى النهاية الموضوع كويس قوى ...و وحشتونى كتير قوى و اتمنى انك تجيب براء و تيجوا تزورونى الزيارة اللى لسه محصلتشى لحد دلوقتى .<br />بيسو افندى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112618/http://www.20at.com/article2.php?sid=329"

