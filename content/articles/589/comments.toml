text = "نعم بكيت من موضوعك يابيرو ومن صورتك يامصعب ولكن اقدم لكما نصيحت عاشق ولهان احرصا على ستر هذه المشاعر الرائعة من عيون الحاسدين حتى لاتصابافي حبكما مصعب وبراء اجوا ان ترددوااسمكما اكثر من مرة وتتدبروا في معناهما ربنا يكون في عون ابوك وابوه الله يرحمه وامك وامه الله يرحمهاوياترى يابيرو ابوك كان يحمل لابوه نفس المشاعر هذه اللهما احفظهما في الدنيا وجمعهما في مستقرات رحمتك وزوجهما شقيقتين رحمتا بهما مش عارف ليه قلت زروجهما معذرة للتحدث في الامور الشخصية"
