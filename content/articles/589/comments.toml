posted = "2006-01-25"
text = "اناصحابى عندى بالدنيا وهما قلى بيخدونى لطريق الجنه فى الاخره باذن الله<br />مع اصحابى بحس انى مستريح نفسيا وممكن اقول اى كلام لانى واثق انهم حيفهموا<br />مع انهم سعات بيجنونى بس بحبهم فى الله اصحابى اعمل ايه ؟<br />انا بدعى ربنا ما يفرقنا ابدا ابدا<br />ويجعلنا( اخوان على سرر متقابلين ) فى جنه الخلد ان شاء الله"
