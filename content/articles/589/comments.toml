subject = "لا بد وأن يحبك الكثير"
author = "أحمد الجعلى"
posted = "2006-01-31"
text = "برغم انى قد عرفته فقط منذ قرابة الثلاث سنوات إلا أنى وجدت فيه اخا صغيرا حبيبا، برغم تقصيرى الدائم فى حقه والاتصال به.<br />حقا يا مصعب تستحث الكثير والكثير من الكلمات ولكن امام ما فعله البراء بهذا المقال ستكون كل الكلمات ضئيلة صغيرة لا محل لها من الاعراب.<br />أسأل الله أن يديم صداقتكما وأن يبارك فيك يا مصعب ودوما من نجاح إلى نجاح ومن تقدم إلى تقدم."
