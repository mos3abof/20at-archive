[[comments]]
order = 0
subject = "انا مش قادر أمسك دموعي"
author = "مصعب .. صاحب الصورة"
posted = "2006-01-25"
text = "ايه ده يا ابني..<br />أنت لعبت على أوتار قلبي الباطن ..<br />أنت فرتكت الأشاعير و المحاسس بتاعتي<br />أنت شحورتني ..<br />انا مش عارف أقول لك ايه بس..<br />والله و الله والله ..<br />أنت أكتر واحد بأحبه في الدنيا دي (أنت عارف بعد مين) !!<br />يا أعزصديق<br />أنت بابا و أنت ماما و أنت البراء أشرف!!<br />براء يا جماعة هو أكتر شخص وقف جنبي في كل المواقف الصعبة و الحلوة،<br />براء له الفضل الأكبر بعد ربنا سبحانه و تعالى فيما أنا فيه الآن..<br />حاسس إني عاوز أعيط !!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112618/http://www.20at.com/article2.php?sid=329"

