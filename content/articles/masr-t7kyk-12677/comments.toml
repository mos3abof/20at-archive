author = "مش شريف ولا براء"
posted = "2009-07-17"
text = "يا سعادة وزير الداخلية لو سمحت اركب مترو الانفاق وشوف العيال اللي بتشحت والعيال اللي بتبيع مناديل وشوف ايه حجايتكم يا سعادة وزير الداخلية<br />يا سعادة وزير الداخلية المنصب تكليف وليس تشريف<br />يا سعادة وزير الداخلية زي ما هو عندك مباحث مكافحة الاخوان المسلمين<br />لازم يكون فيه مباحث مكافحة الخطب يا سعادة الوزير<br />غلط كده العيال تتخطف من اهلها ويتباعوا ويسرحوهم في الشارع كده والداخلية نايمه على نفسها<br />بالذمة مين اللي حيخلي ابنه ولا بنته تنزل تسرح بمناديل في الشارع ولا تشحت في هذا السن المبكر<br />الا اذا كانت العيال مخطوفه<br />وانت يا جماعة الصحافيين بلاش تهريج وكتابة مقالات ما لهاش قيمه زي افلام عادل امام وبقية الزباله اللي بيسموهم ممثلين<br />يا بنت الحاج عبدالفضيل التحقيق الجاي لازم يكون عن الاولاد المخطوفة دي وحتلاقيهم في متروا الانفاق ومحطات المترو<br />سلام"
archived = "2009-09-17"
capture_url = "https://web.archive.org/web/20090917085550/http://www.20at.com:80/masr/t7kyk/12677-2009-07-16-12-26-07.html"

