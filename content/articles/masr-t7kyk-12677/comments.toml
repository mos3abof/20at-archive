author = "مفيش خطف"
posted = "2009-07-18"
text = "مفيش اى عملية خطف<br />انة الفقر<br />اناس بيرموا اولادهم فى الشارع لشدة الفقر وعدم وجود القدرة على اطعامهم يبيعوا اى حاجة ويجيبوا اى فلوس علشان يعرفوا يعيشوا<br />اركب اى مترو انفاق وشوف ازدياد هؤلاء الاطفال والشحاتين بطريقة مرعبة<br />لاول مرة فى تاريخ مصر تطلع احصائية بتقول ان استهلاك المصريين فى 6 شهور الماضية قلت بنسبة 35% يعنى الناس لا تاكل اللحمة لشدة الفقر<br />الوضع صعب جدا<br />الدولة بتشترى سيارات نقل مرسيدس للامن المركزى وسايبة الناس الغلابة<br />واللة لولا شوية العاملين فى الخارج وتحويلاتهم الى اهليهم وبنائهم شقق وبيوت لكان حال البلد دى بقى زى الصومال"
archived = "2009-09-17"
capture_url = "https://web.archive.org/web/20090917085550/http://www.20at.com:80/masr/t7kyk/12677-2009-07-16-12-26-07.html"
