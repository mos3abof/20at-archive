author = "مش ححبك"
posted = "2009-07-17"
text = "بخصوص بيع المناديل<br />على ما يبدو وعلى حسب ما رأيت بعيني ان فيه عيال صغيره جدا بتبيع مناديل<br />بشوفهم في مترو الانفاق<br />وفي محطات المترو وفي حلوان<br />لفت نظري بنت صغيره بتتحايل عليا اني اشتري كيس مناديل لحسن الولية اللي مسرحاها لو ما بعتش الكمية اللي معاها بتنزل عليها ضرب بالخرطوم<br />وبعد البحث والتحري اتضح لي ان معظم هذه العيال مخطوفة من اهلها<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــت<br />نكرر العيال اللي بتبيع المناديل مخطوفة من اهلها<br />مرة شفت بنت صغيره بتبيع مناديل شعرها اصفر وعنيها خضرا اي والله<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــ<br />نرفع الموضوع الى السادة المسئولين في وزارة الداخلية"
archived = "2009-09-17"
capture_url = "https://web.archive.org/web/20090917085550/http://www.20at.com:80/masr/t7kyk/12677-2009-07-16-12-26-07.html"

