author = "القاهرة – مصطفى سليم"
posted = "2009-07-17"
text = "المختطفون يقعون ضحية بيع الأعضاء أو يباعون للخارج بجوازات مزورة<br />مصر تبحث تزايد خطف الأطفال و\"الداخلية\" تنفي وجود \"ظاهرة\"<br />عقدت لجنة الأمن القومي بالبرلمان المصري جلسةً مخصصة لبحث ظاهرة خطف الأطفال، فيما تملأ الشارع شائعات عن عصابات منظمة تنشط في خطف الأطفال للمتاجرة بهم ببيعهم إلى أجانب بجوازات سفر مزورة، أو لبيع أعضائهم.<br />وبينما أكد مسؤولٌ في وزارة الداخلية المصرية تلقي بلاغات يومية عن حالات خطف، إلا أنه نفى وجود ظاهرة أو عصابات منظمة، معتبرًا أن \"ثقافة الشائعات\" صارت تشكل خطورةً على الاستقرار في البلاد.<br />وكان العديد من أهالي محافظات مصر، خاصةً في الصعيد، تقدموا ببلاغات إلى الشرطة خلال الأسابيع القليلة الماضية، تفيد بخطف أطفالهم، كما سرت حكايات عن قتل الأطفال وبيع أعضائهم، مما أدى إلى حالةٍ من الذعر.<br />ووصل الأمر إلى أن تظاهرت نحو 300 أسرة في قرية أبطوج، بمركز بني مزار محافظة المنيا 300 كم جنوب القاهرة، يومي السبت والأحد الماضيين احتجاجًا على ما اعتبروه تخاذل رجال الشرطة في البحث عن الأطفال المخطوفين."
archived = "2009-09-17"
capture_url = "https://web.archive.org/web/20090917085550/http://www.20at.com:80/masr/t7kyk/12677-2009-07-16-12-26-07.html"

