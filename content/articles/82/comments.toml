subject = "امين عام الشباب العربي"
text = "الصراحة الشباب العربي متشفق للاغراء و الجنس و بيحب الجنس و كل من ينكر هذا الكلام يعتبر انسان غير سوي لان هذا شي طبيعي يمر فيه اي انسان في هذه المرحلة و الجنس الناعم شيء يحبه كل البشر من الجنس الخشن الذكر الفحل و خلاف ذلك يعتبر شاذ و الايام هذه بداءة تظهر العلقيه بتاعت النسوان و الشباب ما يقصرون"
