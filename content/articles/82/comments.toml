text = "يا جماعة لو سمحتوا خدوا بالكوا من كلمكوا شوية علشلن انتوا بتلخبتوا فى الكلام كتيير.............واحد يقولى مهة الشيوخ بيتفرجو على نانسى و اليسا و كلام غريب مالوش معنى لو سمحتو راجعو كلمكو قبل ما تبعتو و الناس تقراه"
archived = "2004-08-13"
