subject = "اشتغالات"
text = "ايه يا عم اللي بتقوله ده؟ هو انت بتشتغلنا ولا بتوع كلية الإعلام دول هما اللي اشتغلوك؟؟ ايه هو اللي مية في المية من الشباب بيشوفوا نانسي واليسا، و40 في المية بيشوفوها من ورا أهاليهم. أحكام عاااااااامة وواضح جدا ان الأبحاث دي يا إما متفبركة، يا إما مسلوقة ومعمولة على عينات صغيرة. يعني من الآخر كل دكتور من دول جاب ولاد أخته وعمل عليهم بحث فيالسريع كده. ربنا يسامحكو بقى."
