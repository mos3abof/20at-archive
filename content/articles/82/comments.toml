[[comments]]
order = 19
subject = "اخجلو من انفسكم"
text = "بسم الله الرحمن الرحيم<br />الاتخجلون من انفسكم حين تتحدثون عن هذا الرجل الذي يهدي الكثير من الشباب و الشابات الى طريق الله اذاكنتم احسن منه فحاولو ان تفيدو وتهدو الشباب المسلم الطريق الصحيح ولاتحاولو ان تكونو متصيينين اكثر من الصهاينة انفسهم والواجب عليكم ان تدعو الى زيارة موقعه لعل الله يغفرلكم بعض ذنوبكم الكثيرة التي حصلتم عليها عندما تحدثتم عنه"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813200252/http://www.20at.com:80/article.php?sid=276"

