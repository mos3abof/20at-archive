subject = "ابراهيم سعيد"
text = "يلا ما هو كله رايح في الكازوزا والله يا جماعه انتو مكبرين العمليه اوووي اقولكم اذا كنا بنتكلم عن الاغراء والكلام ده تعالو با نتفرج علي افلام زمان هنلاقيها افظع وافظع واذا كان الشاب يعني يتعب اما يشوف كليب من دول او حتي تقدر تغيريه يبقا اسمحو ليا اقولكم انه شاب دماغه فاسده من الاصل الذنب مش ذنب اليسا ونانسي وروبي الذنب ذنب الاعلام اللي مش موعيي شبابه فين هو الرد علي كدا ولما الكليبات دي فيها مصايب كدا ليه الاعلام العربي بيسبها تتذذاع هتردو تقولو ايه حرية راي سلامات يا حرية كان فيه منه وخلص يا جدعان وبعدين الحمد لله انا لو شفت واحده من غير ملابس ده ولا يحرك فيا شئ وده مش برود لا دي سيطرة علي الاعصاب وحسن تربيه والحمد لله والناس اللي زيي كتير اوووووووووووووووووي وبعدين هنقاوم الاحتلال ولا هنقاوم اليسا ونانسي والجماعه دول ونبي يا اخ يا بتاع الاعلام خلينا نركز في حاجه<br />وبعدين علي طول مقاومه مقاومه الشباب بيتعب يا اخي لازم ولو حاجه صغيرة تتطري علي قلوبهم<br />عارف يا جماعه اني اتطرفت اووي وعديت حدودي بس هوه ده الي مفروض ينقال"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616114458/http://www.20at.com:80/article.php?sid=276"

