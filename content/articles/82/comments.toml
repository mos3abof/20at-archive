[[comments]]
order = 12
subject = "طريق الشر مليء بالورود"
text = "بسم الله الرحمن الرحيم. الحمد لله والصلاة والسلام على رسول الله وبعد :<br />الله سبحانه وتعالى عليم بمصالح العباد ومضارهم . ومهما زعم أهل الحرية والديموقراطية وغيرها من الألفاظ الجوفاء أن الشريعة الإسلامية تتحكم بحريات أتباعها فهم كاذبون .. ولكن طريق الشر مليء بالورود . فقد سار كثير من الناس (ومن المسلمين) في طريق هذه النظم المختلة الناقصة , وتركوا كمال الدين الإسلامي .. هذه القصة واقعية , حدثت لشخص مسلم عربي ابتعد عن الجادة وسار في طريق إغواء الشيطان , باسم الحرية . فماذا كانت النتيجة؟ نرجو قراءة القصة فهي تستحق القراءة ..<br />كان في العشرين من عمره . شاب في مقتبل الشباب , وفي عز فتوته .. أراد أن يعيش حياته كما يقولون ففقدها . كان من الشباب الذين يحضرون المساجد متدين تقي يحفظ القرآن . ويحسن الانجليزية لقوله صلى الله عليه وسلم : من تعلم لغة قوم أمن مكرهم ... لما دخل الجامعة زامله بعض الملحدين والشيوعين والديموقراطيين الخبثاء ممن يبغون دفن الإسلام وقتله . ولما رأوا عمامته لا تفارق رأسه ولحيته المهذبة ولباس التقوى يغطيه ثاروا وأخذوا ينادونه بالألفاظ الجارحة للهزء والسخرية فتارة : يا مطوع .. وتارة جاء سماحة الشيخ .. وتارة اسألوا المفتي فهو أدرى .. ويا أصولي ويا رجعي ويا إرهابي وغيرها مما أطلقه حاسدو الإسلام بغرض إطفاء نوره ..<br />في البداية تحمل صاحبنا الأفاظ على مضض . ثم لما زادت وكثرت بدأ يشكو منها . حتى في النهاية ضجر وغضب وذهب إلى بعض الشيوخ فقالوا له : اصبر . سيجعل الله بعد عسر يسرا.. ولكن الأمر زاد فعاد إلى شيخه فقال له : تعرف عليهم وحاول أن تقنعهم بالالتزام .. وبالفعل بدأ يقترب منهم ليقنعهم بالإسلام . ولكن ..<br />كان مرة يمشي مع أحدهم ففوجئ بفتاة تأتي إلى صديقه سافرة متبرجة كاشفة ما يجعل عقل الرجل يدور في محله وتحدثه فيستأذن صديقه منه ويتأبط ذراعها ويمشي معها .. أبدى صاحبنا الغضب من ذلك ومضى وعزم على تركهم .. وتركهم مدة لكنه كان قلقاً خلالها . فعاد إليهم بعد أن أقنع نفسه أن لعلهم يهتدون على يده ..<br />وتكررت هذه الحادثة نفسها أمامه كثيراً .. لوكن ردة فعله الأولى بدأت تخفت .. حتى أنه آخر الأمر أصبح يحسدهم على هذه الحياة .. ويقول في قرارة نفسه : إن الحياة فعلاً حياتهم. وكان يحسدهم أنهم لم يتربوا مثل تربيته منذ البداية فتمنعهم مما يفعلون .. وزاد الأمر فترك الصلاة .. حتى كانت الطامة .. ورأى أحدهم يقبل صديقته شفة .. فثار البركان الكامن داخله . وانفجر البارود المخبء فيه .. ولم يطق الصبر والاحتمال .. فاختلى بأحد أصدقائه وكان ماكراً .. وسأله بكل صراحة : إنني أحسدكم على حياتكم .. فرد الماكر عليه : ولمه ؟ قال : أراكم كلكم تماشون صديقاتكم وأنا ليس لي صديقة .. هنا فهم الخبيث ماذا عليه أن يعمل .. وأراد أن يطلق رضاضة الخلاص على ضحيته فقال : ولكن مظهرك لا يجذب الفتيات !! تعجب صاحبنا وقال : فما العمل ؟ قال : احلق هذا العشب الذي نبت على ذقنك ثم غير ملابسك واخلع عمامتك .. ثم تعال إلي لأعرفك على صديقة ..<br />صدق المسكين ذلك .. وفعل ماأمره به ذلك الملحد .. وجاءه وقد انقلب فتى أمرد .. فقال له : والآن ماعليك إلا أن تطلب إجازة وتسافر إلى أحد تلك البلاد لتنتقي لك صديقة من بين بناتهم اللائي يحسدهم القمر على بهائهم وجمالهم ..<br />فغر الفتى فاه . فلم يكن يتوقع أن يصل الأمر إلى حد السفر إلى هناك .. وأخذ باقي إيمانه يصيح فيه أن عد إلى ربك ودينك .. ولكن الشيطان أراد طرق الحديد وهو لم يزل حامياً فأخذ ينفخ في النار ويثير شهواته .. إنما هي يوم أو يومين ثم تعود إلى ربك وتتوب .. إنما أنت ذاهب للدعوة .. إنما إنما .. حتى غلب الشيطان على الإيمان .. وذهب فسأل عن أجمل البنات أين يوجدن .. فقيل له : في أستراليا .. وبالفعل طار الأخ إلى أستراليا بعد الاحتجاج على أهله أنه ذاهب لدورة دراسية لمدة شهر . لم ينس أخذ الكثير من النقود كما أوصاه زميله..طار وطار منه إيمانه وتقواه .. صرف نعم الله ليحصل على عذابه . وباع رضاه بهواه .<br />لما وصل الأخ إلى هناك .. لم يكن يعرف ما العمل الذي عليه أن يعمله بعدها .. لذا فقد استأجر غرفة ثم مزل يتمشى وهو يرى البنات الكاسيات العاريات .. والمجون والانحلال تحت مسمى ودعوى : الحرية ..<br />لم يستطع الأخ تحمل هذا كله .. فدخل أحد المقاهي هناك .. وجلس على طاولة فيها وهو لا يدري ما العمل ..<br />وفجأة رأي فتاة كأنها القمر . لها أفخاذ مكشفة حتى الـ.. كأنها اللجين وسواعد بيض رقيقات وشعر كأنه الحرير أو أنعم .. وعيون لو رآها غزال لحسدها عليه .. تدخل وحيدة .. رآها تدخل المقهى وتجلس على طاولة أخرى أمامه والملل باد عليها .. نسي كل شيء وانشغل بالنظر إلى هذا الشيطان الذي تصور في صورة ملاك على هيئة إنسان . وفغر فاه .. وأمعن في النظر إليها ناسياً كل ماحوله حتى الشاي ..<br />رأت الفتاة ما به من نظراته البلهاء إليها .. وارتباكه وقلقه البائن ...<br />Read the rest of this comment..."
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813200252/http://www.20at.com:80/article.php?sid=276"

