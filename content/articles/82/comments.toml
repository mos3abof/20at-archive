text = "بس هوه فيه مشكلة..يعني المقاومة حاجة والمذاكرة والشغل شئ تاني..يعني مفهوم ان اللي بيشتغل او قعد 8 ساعات بيذاكر \"يفك\" نفسه شوية بحاجة كده او كده..انما اللي بيقاوم او يجاهد ده طريق حياة وطريقة تفكير وحجم علاقات..لأن الجهاد في الأساس طريقة حياة مش موضوع باعمله كده وانا باقضي يومي..اما ازاي تتفرج ولا تثار دي قضية تانية..يعني مش القاعدة انك لا تثار من اللي بيتعرض ده انما ده الإستثناء"
