[[comments]]
order = 21
subject = "زمن الجواري"
text = "يمكن من قبل نزول الاسلام كانت من ضمن مهنة الجواري والرقيق الرقص للترفيه عن اسيادهم... الفرق ان الجواري دلوقتي بقوا اسيادنا وعلى راسنا... كل المطلوب واحدة معندهاش كرامة .. تتعرى وتتلوى وتقول انا فنانة واللي يسقفولها كتير.. وليه لا.. ماهي فرخة بتبيض دهب.. البحث المعروض مثير للرعب مع انه فكرة ان المروجين لاغاني الفيديو كليب العارية مفهوم انهم لا يشغلوا بال لمستقبل امة عربية لها تاريخ عريق.. للاسف نحن نصنعها ونروج لها بايدينا وهنيئا لاعداءنا المستوى اللي وصلت ليه ثقافتنا. المسئولية زي ما هيه مسئولية اللي بيشترى الشريط ويسقف.. مسئولية الرقابة اللي بتدعي الحرية ويمكن كمان مسئولية بوليس الاداب!"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813200252/http://www.20at.com:80/article.php?sid=276"

[[comments]]
order = 22
subject = "كويس اوى"
text = "كويس اوى الكلام ده<br />واكيد كل الشباب عرفينه<br />بس عافينه ومبيعملوش بيه<br />وده فى حد ذاته حرام<br />لان الواحد مش يئول انا عارف<br />ولاكن يئول انا بعمل لان خير الكلام ما قل ودل<br />وياريت بئه الشباب يتعظ لاحسن احنا خلاص ربنا يرحمنا من كل المهالك اللى بئت حولينا ومحدش حاسس بيها<br />والمصيبة ان الشباب عارف وبيئول : يا سيدي خلينا نعيشلنا يومين<br />يعنى نعيش لنا يومين فى الحرام، طب ليه نعيش فى الحرام واحنا ادامنا الحلال بسيط جدا وممكن نعمله ودلوئتى بئى زى مافى مواقع تدعو للحرام بئى فى برده مواقع تدعوك للحلال والحاجات اللى ترضى ربنا يعنى محدش يئول انا مش عارف ، كل حاجة بئت وضحة دلوئتى واللى يسئل ميتوهش ، واللى يستعين بربنا ويتجهله فى وئت الشده ربنا معاه ومش هيتخلى عنه<br />ارجو انى مكنش طولت عليكو ، بس انا فعلا نفسى الشباب ينعدل حاله بئه<br />وربنا يئدم مافيه الخير ، سلام عليكو"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813200252/http://www.20at.com:80/article.php?sid=276"

