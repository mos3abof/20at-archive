subject = "مسلم فلسطيني صغير"
text = "السلام على من اتبع الهدى<br />ايه يا اخ هوه انته جن ولا ليك شبكة تجسس علي انته كيف تتجرى تقول هاذا الكلام<br />ميه ميه الشباب بيشوفوا نانسي وكوسا دي<br />الهم عليك بيهود<br />الهم عليك بامريكاا<br />الهم عليك باهل الطرب والمزيكا<br />الهم تقبل دعوتي<br />وسيبوكو من الكلام ده<br />وفلسطين على فكره فيهاا مسلمين وشباب موش فاضيين للكلام ده<br />يعني قول غير الكلام ده<br />ميه الميه بيشوفوه<br />هاذا يعني كماااااان انته واخوانك واصحابك بتشوفوه<br />اهدي سلامي الى اخواني واخواتي<br />وسلامو عليكو"
