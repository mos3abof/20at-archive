text = "تحيه طيبه وبعد<br />ايه ده هو ربنا ما خلق الا نانسي دي<br />طز فيها وربنا ياخذها هيه والي بيحبها فاهمين<br />ال نانسي ال هههههههههه عالم تافه<br />وكمان الي عابد الله يسمى عبد الله<br />طيب والي بيشاهد نانسي وبيحبها<br />يبقى عبد نانسي<br />طز في كلواحد بيحب غير الله حدا<br />ان شاء الله وحده بيحبها بس بشرط<br />ولا تؤاخذوني لاني في متاهة الاخلاص<br />سلامممممممممممممممي ليكو"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813200252/http://www.20at.com:80/article.php?sid=276"

[[comments]]
