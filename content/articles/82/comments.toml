subject = "هذه رغبة الحكومات"
text = "الحكومات تنشر أغاني الفيديو كليب لإلهائنا، ثم تحلف بأغلظ الأيمان وتمصمص الشفايف بأنها محتارة جدا جدا في شوية البنات العاريات، ولو أرادت الحكومات منعهم لمنعتهم من السفر أو إقامة محطات استقبال هذه القنوات مثلما تمنع قيام أي قنوات تعارض حكمهم، والأخ بتاع أفلام الستينات عنده حق لأن في الماضي كانت الأفلام كلها سيئة، والشباب الآن يشاهد الأفلام الممنوعة، والحكومات تصفق من بعيد، والحل يكمن في المناعة الذاتية، والتوعية، وأن يظل المجتمع ينظر إلى طائفة المغنيات على أنها طائفة منبوذة وحقيرة، وليس كما يقدمهم وسائل الإعلام على أنهم نجوم. بل إنهم أراذل القوم"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616114458/http://www.20at.com:80/article.php?sid=276"

