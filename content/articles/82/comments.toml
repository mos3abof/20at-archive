subject = "رنين الحب"
text = "بسم الله الرحمن الرحيم<br />والله يا جماعه انا عندرائى كل الناس بتشوف نانسى واليسا حتى الشيوخ يعنى هما لو مش بيشوفوهم وبيتفرجو عليهم هايعرفوهم منين كلنا عندنا حب استطلاع كبير وصغير ومن اول يوم اتخلقت فيه البشريه كان عندنا حب استطلاع ولحد الان فعلا الذنب مش ذنب اليسا ونانسى وغيرهم من الشخصيات لكن الذنب ذنب الاعلام والمسؤلين عن اذاعه هذه الشخصيات على الشاشه اللى المفروض بيتوزع منها توعيه للناس وبعدين لازم نشوف كل حاجه وكلنا بس مين فينا بقى عنده اخلاق يقدر يعرف كل حاجه من غير مايضر نفسه وبالتالى عدم ضرر الاخرين وبعدين احنا بنتكلم فى ايه احنا المفروض نركز على الاستعمار الموجه بكل اسلحته تجاهنا نحن العرب الغرب والدول الاستعماريه بيحاولو يشغلونا بمثل هذه الاشياء من اجل اهداف اخرى واحنا للاسف 10 % فقط اللى فاهمينهم والباقى بيتفرجوا على الدش المفروض نسال انفسنا امتى هانتحرك تجاه الخطر القادم الخطر الحقيقى.<br />رنين الحب"
archived = "2004-06-16"
