subject = "الرد على الاتهامات"
author = "المحرر"
posted = "2006-12-22"
text = "\" ظني ان موقع عشرينات اصبح حكومي اكتر من الحكومة نفسها , فالانتقادات الموجهه للحكومة اصبحت قليلة والمواضيع التي تكشف الفساد والفاسدين انعدمت , وكنت شعرت اني اقرء جريدة الاهرام بدلا من موقع عشرينات.<br />عيب عليكم يا موقع عشرينات ان تخسروا الحرب ضد الفساد والفاسدين وعملاء الوطن وعلي راسهم مبارك وجمال (رضي بوش عنهما) وتخسروا ايضا القراء الاحرار الذين يقروا مدونتكم \"<br />\" السؤال ايضا ايها الساده:<br />لماذا الاعلان عن برنامج نووى فى هذا التوقيت بالذات ؟<br />ثانيا: بخصوص ارتفاع معدلات الامان - قولو لى اين معدلات الامان فى اى ادارة فى مصر ؟<br />فلماذا اذا سستوافر فى المفاعلات النوويه لدينا ؟<br />على ما يبدو ان الساده الافاضل لدينا لم يسمعوا بمعدلات الامان العاليه لدينا سواء فى ادارة مرفق السكك الحديديه او قصور الثقافه او المستشفيات العامه والتامين الصحى او او او ............... ال\"<br />بسم الله الرحمن الرحيم :<br />فى الحقيقة لم اكن انوى الرد على التعليقات إلا ان بعض زملائى المقربين نصحونى بالرد عليها حتى لا يظهر موقف الصمت وكانى لا أجد ما ابرره به موضوعى ..<br />وقبل أى شئ أحب ان اوجه عنايتكم ان رجع الصدى لاى موضوع \" يعنى تعليقاتكم \" مهما كان سلبيا هو المحك الاساسى لنجاع أى موضوع ..<br />و بخصوص الاهتمام بأن عشرينات تحولت لمؤسسة عشرينات القومية التى تتبع مجلس الشورى .. فهل رأيت فى الموضوع كلمة شكر واحدة فى الرئيس أو أبنه أو حزبه يا سيدى الفاضل .. و بالله عليك هل مجمل الموضوعات التى تعالجها عشرينات باتت بعيدة عن معركتها لمحاربة الفساد \" اقرء كويس بس \" وستجد أن الموضوعات كلها تحارب الفساد .. و اذا كنت ترى اى أى موضوع خرج عن هذا السياق ومال لجانب الحكومة فلماذا لم تدلل عليه بامثلة ........<br />وبالمناسب<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
