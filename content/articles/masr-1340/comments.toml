subject = "مصر التى احبها"
author = "مواطن مصرى"
posted = "2006-12-24"
text = "اولا احب اشكر ولاد البلد على هذا الجهد الهائل بالموقع بجد انتم ممتازين<br />ثانيا ما اود ان اقولةان القضية ليست تقدم مصر بالمشروع النووى او عدم تقدمها انماتم الاقتراب من هذا الملف لعيون جمال مبارك والا اذا كان كل الخبراء المصرين اجمعوا ان مصرتسطيع ان يكون لها مشروع نووى من سنين فما الذى اخرنا اذاوبعدين الامان النووى ماهو موجود من 10 سنين مش طالع امبارح يعنى عشان فية ناس بتعملها حجة للدولةعلية العوض فى مصر المحكومةمن عصابة مبارك الى ان لم يكن قتل السادات فلا احد يشك انة تامر علية واغتصب الحكمثم اغتصب مصر بالكامل هو وعيلتة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102738/http://masr.20at.com:80/article.php?sid=1340"

[[comments]]
order = 15
subject = "الشاب الفرفور مش المطحون"
author = "Max"
posted = "2006-12-25"
text = "على فكرة يا جميل يا مطحون انته شكلك مدخلتش حضانة اصلا انته من قلك على اختراع الانترنت ده انته شخص فاشل ميه فى الميه عرفنا ان البلد خربناة نعمل ايه بقا مش فاهم لو على العمايل نعمل بس معدش فيه حاجة تتعمل اصلا انته بتتكلم بطريقة هزلية غير مثقفة تماما انته مش اكتر من واحد فاضى مالى دماغه باى حاجة وخلاص الموقع ده من زمان بيتكلم فى كل حاجة يعنى سياسى اجتماعى ثقاف يعن مش عشان الحوار مش على هواسعادتك يا شاب يا فرفور تقرف امنا بدماغك الى عايزة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102738/http://masr.20at.com:80/article.php?sid=1340"

[[comments]]
order = 16
subject = "تجربة سابقة"
author = "Max"
posted = "2006-12-25"
text = "معلش يا عم المطحون لو كلامى ضايقك بس انته بارد مفيش موضوع الى ودخلت وكتبت نفس الكلام يعنى بلاش كده فوق من الوهم ده عرض السياسة مش كده انته كده بتخلى الناس تنفر منك حسن اسلوبك شوية ولا روح خد كورس فى كلية العلوم السياسية انا يا جماعة ممكن اكتب حاجة متكنش مرتبطة بالموضوع بس انا اهنى الكاتب على موضوعه وبكره ربك يعدلها الحقيقة انا مش عارف انا هكتب الكلام ده فى الصفحة ديه بالزات ليه بس هى جت كده فى الحقيقة انا كان لى تجربة مع ظابط مخابرات سابق هو كان فى المخابرات ايام السادات الراجل ده كان تعب من الشغل بتاعه لان اى امر كان يطلب منه لازم يتنفز حتى لو هيموت اخو طبعا انتم عارفين يعنى ايه جهاز مخابرات المهم فى وسط كلامى معاه الكلمة الى حبيت انكم تعرفوها انى قولتلوا الجيل بتاعكم باعنا ليه وخلى جيلنا احنا جيل هش ليه موقفتوش ليه مشيتو جنب الحيط وسبتونا نتبهدل دلوقتى قلى يا ريت الزمن يرجع بيا وانا مكنتش خليت حاجة من ديه حصلت بصراحة قلها بصدق شديد اكنه نفسه يرجع تانى ويقول لا ويموت عليها هو قلى احنا للاسف بعنا القضية بس يا ترى هتبيعوها انتم كمان وتخلوا الجيل الى جاى يقول نفس الكلام انا كنت مستمتع جدا وانا بتكلم معاه عارفين هى كانت عبارة عن رحلة استمرت ربع ساعة اتكلم معاى فيها فى حاجات عميقة جدا تظهر انه شخص مثقف جداااا غير طبيعى انا مكنتش عايز اسيبه بس للاسف كان لازم اسيبه لانه سواق تاكس بس تخيلوا معاى يا ترى ممكن ظابط مخابرات يشتغل سواق تاكس هو عند حوالى 55 او 60 بس هو مش شخص عادى انا نفسى ابقله تانى واقعد اتكلم معاه كلام مثمر مبيرحش هدر"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102738/http://masr.20at.com:80/article.php?sid=1340"

[[comments]]
order = 17
subject = "الي المتحدث الرسمي بلجنة الوكسات (MAX)"
author = "المواطن المطحون"
posted = "2006-12-25"
text = "معلش انته لو كلامي مش هيعجبك , انا مش كنت عايز ارد علي واحد زي اشكالك , لانك مش ذات اهمية اصلا , واسمك يدل علي شخصيتك (MAX) يعني تعاطي وادمان او تهريب, اعتقد اسمك(MAX) يدل انك عميل وان كان العميل ذات اخلاق اعلي منك.<br />ثانيا) لو بتدعي اني مش فاهم حاجة يا حمار وللاسف اقولك ذلك؟؟؟؟ ليه انت الوحيد الي بتنتقدني , وفي ناس كتير معجبه بأرأي وانت بس المنتقد؟؟<br />انا وانت عارف انه قصر ديل يعني سيادتك مش عندك حاجة تتكلم فيها , فتنتقد من يقولوا ارائهم وكانك وصي او ولي علي الموقع , وطبعا ابو العراف.<br />ثالثا) بتنتقد اني بكتب بره الموضوع وانت بتنقد ذلك ؟؟<br />طيب احب اقولك ليه انت جيبت سيرت واحد سواق تاكسي كان شغال في مخابرات و و و و الخ في موضوع لا يتعلق اصلا بما كتبته (مبارك وتعطيل البرنامج النووي) , طيب قبل اما تنقد احد شوف نفسك يا حمــــــــــــار ."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102738/http://masr.20at.com:80/article.php?sid=1340"

[[comments]]
order = 18
subject = "الى البتاع المطحون ده"
author = "Max"
posted = "2006-12-25"
text = "بص يا بوب فيه ناس كتير منتقداك وفى جميع المواضيع فكك من الموقع ده وشفلك موقع واطى زيك انا مبحبش اخرج بره سياق الموضوع بس ساعتدتك خرجتنا لما ةنشوفك يا مححرر القطبين هتعمل ايه وبعدين سواق التاكس ده متفتحش بقك خالص عليه انا اكتب الى انا عايزه وقت ما يجينى الالهام هو ده الشغل فكككككك خالص انا مش عايز ارغى مع مخ ضلم وفاضى زى بتاع سعتدتك"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102738/http://masr.20at.com:80/article.php?sid=1340"

