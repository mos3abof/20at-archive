subject = "من المواطن المطحون الي المحرر"
author = "المواطن المطحون"
posted = "2006-12-22"
text = "مش ملاحظ ان الموقع شغال مية مية اليومين دول في نقد الاخوان زي الحكومة ما بتعمل لدرجة اني حسيت وللاسف ان الموقع ده جريدة حكومية او مجلة روزليوسف تابعة للنظام الحقير او برنامج (حالة حوار) للديوس عمرو عبدالسميع , ولو تلاحظ ان هناك 3 مواضيع علي الاقل في نفس الوقت بتنتقد الاخوان او علي الاقل مركزة عليهم, ارجو من مدونة عشرينات التي اعشقها ان تنوع مواضيعها او بالاحري تركز علي المواضيع المصيرية مثل التعديلات الدستورية والقوانين الهامة التي تهدد استقرار البلد والاوضاع الاقتصادية السيئة واعتقد ان محرر المدونة يتفق معي في ذلك.<br />وشكرا للمحرر علي الرد"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102738/http://masr.20at.com:80/article.php?sid=1340"

