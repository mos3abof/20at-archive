subject = "موقع عشرينات انضم لابواق الحكومة الفاسدة"
author = "المواطن المطحون"
posted = "2006-12-21"
text = "اظني ان موقع عشرينات اصبح حكومي اكتر من الحكومة نفسها , فالانتقادات الموجهه للحكومة اصبحت قليلة والمواضيع التي تكشف الفساد والفاسدين انعدمت , وكنت شعرت اني اقرء جريدة الاهرام بدلا من موقع عشرينات.<br />عيب عليكم يا موقع عشرينات ان تخسروا الحرب ضد الفساد والفاسدين وعملاء الوطن وعلي راسهم مبارك وجمال (رضي بوش عنهما) وتخسروا ايضا القراء الاحرار الذين يقروا مدونتكم.<br />وشكرا"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102738/http://masr.20at.com:80/article.php?sid=1340"

