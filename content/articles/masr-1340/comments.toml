[[comments]]
order = 12
subject = "نووي ؟؟؟؟ يا نووي ياني ......."
author = "إبن بهيه"
posted = "2006-12-22"
text = "أعتقد أنه ليس وقته أبداً .. ربما للمرة الوحيدة أتفق مع سيادة الرئيس مبارك الواطي القذر على ذلك .. في 1995 لم يكن وقته لأن فخفخامة جلالة أمه مشغول بالنهب ومش فايض مليم أحمر نبعزقه في النووي وكمان ست أبوه أمريكا اللي عينته عندنا بدرجة ريس راح تزعل وتخلعه فوراً .. وحبايبه الصهاينه راح يزعلوا رخرين ويدوله بالصرمه ويمنعوا عنه أي عمولات من ورا الأدوية والسماد والبذور والمبيدات المسرطنه اللي بيستوردها منهم<br />وطبعا دلوقتي مش وقته خالص .. وهو مجرد فنجرة بق مش أكتر .. يعني ننوس عين أمه جيمي الكلب أو الجرو الصغنن بتاع لجنة الوكوسات عايز يلبس طاقية بشار الأسد ويعمل فيها عنتر ويطلع يفنجر ببقين حمضانين إنه هيعمل نووي عشان يخش على لاشعب بمشروع قومي وأمن قومي وبطيخ قومي ويستهبل علينا لغاية ما يدلدل رجليه على الكرسي وطظ في مصر كلها .. نووي إيه .. المشروع هيكون برضه مش وقته ويتأجل لغاية الفترة الرئاسية الخامسة في حياة مبارك الواطي الماسوني الثاني يعني عليكم بخير كده في 2040 ممكن أحفادنا يناقشوا الموضوع ده لما الموقع يتغير اسمه ويبقى ثمانينات مش عشرينات<br />حواديت فارغه وقصص خايبه زي توشكى وبوشكى اللي ضحكوا على لاشعب بيها والشعب غلبان وضايع وماشي ومصدق ولسه بيدعي ويقول يا رب .. لأن ربنا رزقنا بشوية أشاوس عاملين مثقفين وهم في الأصل حزمة حوش عايزه الحرق بجاز وسخ .. كلهم عن بكرة أبيهم بايعين البلد بيعه ندامه .. عمرك كنت تصدق يساري زي رفعت السعيد ولا مكرم محمد أحمد ولا غيرهم وغيرهم كحمروش العبيط بتاع سي فاروق أبو خازوق يدخلوا كده في زواريق الحكومة ويبقوا ديول لها ومساحين جوخ وقذرين بالشكل ده ؟؟؟<br />حكومة واطيه وقواد قرني بيبيع في البلد للصهاينه جمله وقطاعي .. وتصدقوا كذبة النووي الخايبه دي ؟؟ قال ن<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102738/http://masr.20at.com:80/article.php?sid=1340"

[[comments]]
