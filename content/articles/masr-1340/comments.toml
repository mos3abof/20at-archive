[[comments]]
order = 8
subject = "يخوفى يا بدران"
author = "امل ضائع"
posted = "2006-12-22"
text = "والله ان خايف يطلع الموضوع ذى مشروع المنيوم ابوطرطور؟ علشان غى كم غلبان مذنوق عايز يهبش من امال الشعب كم مليون يامن مستقبله؟<br />او يطلع الموضوع فرقعة فى الهواء علشان ايران عملت كده والعالم العربي والاسلامى بيكلم عليها وامريكا مش عارفة تعمل مها حاجة. واحنا حكومتنا الموقر خايفة ينسحب الباقى من البساط من تحت اقدامها؟<br />ويمكن الموضوع صحوت ضمير بعد ثلاثون عاما ؟<br />طيب كانت فين الحمومة من الموضوع ده من سنين؟<br />اهمية المشروع الان؟ المزانية هل متوفرة ؟ والله الاقتراض من الخارج علشان بعدين مخصص المشروع؟<br />والله نبقى نبيع البلد فى الاخر مثل الان؟<br />عايز انسان واحد فى مصر يعرف ربنا وخايف على البلد وعلى الناس يطلع ويقول الحقيقة؟<br />ياناس احنا دفعنا دم عيلنا فى بناء البلد وعمل مشاريع من ايام زمان حتى فى حفر قناه السويس وبناء السد العالي.. طيب وبعدين شافت الحكومة الموقرة بيع البلد كل البلد علشان محش عارف يدير البلد؟<br />والله متشكرين يا حكومة بعت كل حاجة.. وضاعت كل حاجة . ومباقش اي حاجة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102738/http://masr.20at.com:80/article.php?sid=1340"

[[comments]]
order = 9
subject = "نووي مين والناس جائعين"
author = "المواطن المطحون"
posted = "2006-12-22"
text = "ياه تثبت الحكومة كل يوم وطبعا ورئيسها العجوز انها من اغبي حكومات العالم , بل انها تفوقت في الغباء علي كل الاصعدة , ومرشحة لشهادة الايزو في التخلف العقلي , فهل يعتقد لصوص البلد ان بكلامهم علي المشروع النووي وخيراته القادمة انهم سيلهو الشعب عن مشاكلهم المتفاقمة التي تعصف بالحياة الاقتصادية والاجتماعية بالبلد, فكام مشروع قبل ذلك جري التهليل له والحديث عن خيره القادم علي البلد والرخاء الذي سيعم علي الشعب منه فمثلا مشروع توشكي الفاشل الي شرق العوينات الفاشل الي مشروع ترعة السلام الفاشل ومشروع شرق التفريعة الفاشل وغيرها من المشاريع التي قدمت للشعب علي انها الخير القادم لمصر , فكل هذه المشاريع التي انفق عليها ملايين المليارات من خزينة الشعب بحجة الاستثمار ولكن قدمت هذه الاستثمارات بهدف سرقة الشعب الفقير الجائع , ولو نجح ولو واحد فقط من هذه المشاريع لكنا في حال افضل بكثير من الان الواقع الاقتصادي صعب جدا , فنسبة لا بئس بها من المواطنين ياكلوا من الزبالة , والفقراء المعدوميين لا يجدوا بالكاد قوت يومهم, والطبقة المتوسطة التي هي اساس التنمية في طريقها الي الزوال , والشباب المصري عاطلين عن العمل , والمشكلة ليست في بطالة الشباب ولكن المشكلة في حجم البطالة , فكل العالم يوجد به نسب معينة من البطالة , فمثلا النسب المسموح بها عالميا يجب الا تتخطي 4 % علي اقصي تقدير من قوة العمل , ولكن مصر المسروقة لها راي اخر فالحكومة تقول ان نسبتها 10% يعني 2 مليون عاطل, يعني ضعف معدل الامان العالمي مرة ونصف , ولكن المنظمات الدولية والامم الامتحدة والاهم الواقع الملموس يري انها لا تقل باقل تقدير عن 30 % من قوة العمل يعني 8 مليون عاطل , فتخيلوا حجم الماساة التي اوصلنا اليها الحزن الوطني الواطي بالفكر الجد<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102738/http://masr.20at.com:80/article.php?sid=1340"

