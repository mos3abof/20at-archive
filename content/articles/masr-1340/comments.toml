subject = "الاخ الي مش كاتب اسمه"
author = "المواطن المطحون"
posted = "2006-12-24"
text = "اولا :لو بتدعي انك فاهم واذكي مني يا عبيط اخواتك , طيب اتكلم في حاجة مفيدة تخص البلد بدل الفذلكة بتاعت اهلك ديه .<br />ثانيا : لو انت متفذلك كده طيب ماتكتب اسمك يا جبان.<br />ثالثا: شوفلك موضوع هادف تتكلم فيه او ناقشني في اشياء مفيدة بدل مناقشة اسمي المطحون او لاي حزب او جماعة يا عبيط اخوات , ولا انتا مش عجبك اسمي المطحون.<br />للعلم<br />علي فكرة المواطن المطحون ماركة مسجلة ولا يجوز الاعتداء عليها باي وسيلة مرئية او مسموعة لانها( تخص الشعب المصري المطحون) ويعاقب كل من يستخدمها طبقا للمادة 8 من قانون مبارك الواطي ( رضي بوش عنه)"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102738/http://masr.20at.com:80/article.php?sid=1340"

