posted = "2007-03-19"
text = "حلو اوى ياياسر وعقبال ما تكتب عن مهندس القرن الواحد والعشرين ويكون منا لو لنا او يحسب علينا او فينا<br />كنت باسمع شعر دلوقتى اتكتب فى سناء محيدلى \"عروس الجنوب\" وبيقول:<br />لم يعد اسمها بكاء<br />ثال ت الشمس انها حية<br />سناء<br />اجمل الاسماء لصبية<br />اعطت للعالم درس جاء بحجم القضية<br />علمت اجيال واجيال<br />كيف تسحق البربرية<br />تحت اقدم صبية<br />تحمل بندفية"
archived = "2009-06-13"
capture_url = "https://web.archive.org/web/20090613065542/http://www.20at.com:80/20at/eshtbak/3458.html"

