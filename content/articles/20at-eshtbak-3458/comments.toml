text = "اختيار موضوع جميل اوي يا ياسر احييك على الكلاشنكوف وعلى الموضوع الجميل ده ، على فكرة انا فعلا اغلب معلومات موضوعك كانت جديده عليا وده اما لجهلي كشاب مصري جاهل او لاجتهادك في اختيار الموضوع واعتقد انك اختيارك كان موفق جدا جدا واعتقد انك انت الاخر لن تندم على كتابة هذا الموضوع لان فعلا جميل<br />تحية لصانع الكلاشنكوف ولكاتب موضوع الكلاشنكوف"
