author = "مرور اية ؟"
posted = "2010-01-16"
text = "مبادىء المرور العالمية ضباط المرور فى مصر لا يفهموا مبادئها<br />عندنا شوية جهلة لابسين ميرى واقفين فى الشوارع لا يختلفوا مهما علت رتبهم عن مخ عسكرى الامن المركزى<br />ها اضرب مثال واحد فقط<br />لون الرصيف<br />معلوم على مستوى العالم ان الرصيف بيتلون حجر ابيض وحجر اسود عندا يسمح للسيارة بالوقوف بجانب الرصيف<br />وبيتلون اصفر واسود عندما يمنع الوقوف بجانب الرصيف اطلاقا<br />ولكنك فى مصر ونتيجة الجهل المرورى المفرط للقيادات المرورية تلاقى كوبرى قصر النيل مثلا الرصيف متلون ابيض واسود يعنى مسموح الوقوف بجانب الرصيف فوق الكوبرى وهو محظور عالميا<br />وفى بعض المحافظات شفتهم بيدهنوا حجارة الرصيف الوان مسخسخة فزدقى واحمر وخمرى واهو كلة عند العرب الوان"
archived = "2010-01-24"
