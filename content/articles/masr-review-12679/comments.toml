text = "وتطلع اية ليلى جعران او ليلى جعرام<br />عمرى فى حياتى ما سمعت عن واحدة مطربة بالاسم دة<br />يمكن سمعنا اسمها بعد حادث ابنتها<br />انما طرب واغانى اية<br />ما تروح تغنى فى بلدها وتبعد عنا بقرفها<br />هى كل البلاوى بتتحدف علينا لية<br />واحدة كومبارس او مغنية كباريهات احنا مالنا ومال القرف دة"
