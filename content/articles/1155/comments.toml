posted = "2006-03-21"
text = "الموضوع فعلا رائع وياريت كل اللي سافروا يكتبوا لنا عن أحسن اللي شافوه عشان اللي مامعهوش فلوس يسافر يستمتع برضه واحلى ماخرجت به من الموضوع هو أنه وراني ساحة مسجد الحسين والأزهر بس على مستوى أرقي ترتيبا وتنظيما ومش عاوز اقول نظافة عشان قلبي مش مطاوعني لكن عموما بقى عندي أمل أن حفيدي الحادي عشر اللي لسه في عالم الغيبيات ( ده لو اتجننت اكتر واتجوزت )هايشوف ساحة حي الحسين حتى بس بالجمال ده وخلينازي بعضه نسيب الازهر محتفظ برونقه الأصيل كما هو."
