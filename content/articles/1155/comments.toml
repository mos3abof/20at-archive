[[comments]]
order = 0
subject = "امنيه خياتي"
author = "هوووووبه او هبابه او هبهوب"
posted = "2006-03-20"
text = "بجد نفسي ازور البلد دي اولا لاني قريت عليها كتير وحسه انها مهمله من بقيه الدول العربيه يمكن عشان اللهجه<br />حسه ان فيها اصاله كدا قريبه من الاندلس<br />حاجه كدا يعني<br />المهم كمان عايزه ازور اصاحب ليه هناك<br />هما عازمني من دلوقتي عشان اكل الاكل الشعبي بتعهم واللي كلت شويه منه زي \" الكسكي المغربي \" فظيع<br />احب الاماكن لقلبي<br />اقول ولا بلاش<br />اقول<br />حارتنا المعفنه<br />علي الرغم من اني لفيت ورحت بلاد نضيفه ولسه فيها بس حارتنا احلي مكان في قلبي .<br />\"ولا باس لا باس \""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133310/http://www.20at.com/article2.php?sid=593"

[[comments]]
order = 1
subject = "موضوع جامد يا شيري"
author = "مجنون رسمي"
posted = "2006-03-20"
text = "برضه سبقتيني يا هبه في التعليق<br />مع اني كنت ناوي اعلق الاول<br />لان الموضوع بصرحه جامد جدا جدا جدا<br />بس هل يا تري ممكن نكتب عن مكان في لادنا كده<br />اعتقد لأاا<br />بس بصراحه موضوعك يا شيري في الجووون<br />والصور اجمد حاجه فيه<br />لانها فعلا صور مجنونه<br />ولو انتي بجد اللي مصوراها<br />مفروص يا بنتي ياخدوكي في الجزيرة<br />وترحمي نفسك من عشرينات<br />مع اني عارف انها طفلك اللي بتحبيه وبتموتي فيييييييه<br />بس برضه لازم تخرجي بره الأوضتين دول ولا باين هما تلاته<br />مش فاكر<br />وربنا يزيدك كمان وكمان وتروحي المغرب وتفضلي هناك لو بتحبيها اوي كده<br />المهم من الاخر<br />الموضوع جامد جدا جدا جدا<br />وفعلا مكان يجنن<br />وان شاء الله اخليه في النوته الخاصه بزياراتي في الاجازه ونروحه<br />سلام<br />مجنون رسمي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133310/http://www.20at.com/article2.php?sid=593"

[[comments]]
order = 2
subject = "اسكندرية .... ماريا"
author = "واحد تاني"
posted = "2006-03-20"
text = "رغم انى زرت مدن كتير غيرها .... اجمل وانضف واكثر تحضرا ونظاما , الا انى لسه شايف ان مدينتى اسكندرية هى احلى مكان احب ازوره (كمان وكمان)على راي يوسف شاهين , بتوحشنى بناسها وشوارعها فى الشتا... طول مانا بعيد , مش عارف ليه ؟ يمكن عشان سندوتشات الكبده من عند الفلاح بعد سهرة جميلة فى سينما امير (اللى اتقلبت رينيسانس) و يمكن عشان الناس اللى متشعلقة فى الترام والكمسارى اللى عمال يقول العربية فاضية جوه, ورق يا افنديه ....او يمكن عشان محطة مصر لسه ماشى فيها ناس كتييييييير جدا وشوشهم كلها شبه بعض كلها شبه مصر ,اوحتى القعدة فى البورصة التجارية على البحر فى محطة الرمل اللى شكلها متغيرش من ايام الملك بترابيزاتها الرخام والقهوجى اللى بيقول ايوا جااااااي ,,, يا اخواننا احنا بنحب البلد دى بس مش عارفين او مش فاكرين , بس بنفتكر لما بنبعد ونقعد لوحدنا على جنب نفتكر ايامها , وشوفوا المحترم قال ايه عنها ....<br />مصر .. التلات أحرف الساكنة اللي شاحنة ضجيج<br />زوم الهوا وطقش موج البحر لما يهيج<br />وعجيج حوافر خيول بتجر زغروطة<br />حزمة نغم صعب داخلة مسامعي مقروطة<br />في مسامي مضغوطه مع دمي لها تعاريج<br />ترع وقنوات سقت من جسمي كل نسيج<br />وجميع خيوط النسيج على نبرة مربوطة<br />اسمعها مهموسة والا اسمعها مشخوطه<br />شبكة رادار قلبي جوه ضلوعي مضبوطة<br />على اسم مصر<br />وترن من تاني نفس النبرة في وداني<br />ومؤشر الفرحة يتحرك في وجداني<br />وأغاني واحشاني باتذكرها ما لهاش عد<br />فيه شيء حصل أو بيحصل أوح يحصل جد<br />أو ربما الأمر حالة وجد واخداني<br />انا اللي ياما الهوى جابني ووداني<br />وكلام على لساني جاني لابد اقوله لحد<br />القمح ليه إسمه قمح اليوم وأمس وغد<br />ومصر يحرم عليها .. والجدال يشتد<br />على اسم مصر<br />رحـيـلاً رحـيـلاً بغيـر هـوادة<br />رحـيلاً فإن الـرحـيل سعـادة<br />عبادة<br />إرادة<br />سيادة<br />ولادة<br />رحـيـلا .. إلى أين لـيس يـهـم<br />ولـيس يـهـم بأي وسيـلة ..<br />أجيـراً بلقمـتـه في البـواخـر ..<br />عـلى واحـد من جيـاد القبيلة ..<br />على مقعـد في ذرى الجـو فـاخـر<br />وتمـلأ الكـأس بنت جمـيلة ..<br />على قدمي .. أو بفكري .. أهاجر<br />أبادر<br />أغادر<br />أخاطر<br />أسافر<br />ولـكـن إلى أيـن .. لـيس يـهـم<br />إلى حيث لا تعبـر الأفـق شمس<br />إلى القـطب .. أو حلقة الاستواء ..<br />إلى حـيث يـسمـع لـلجـن همس<br />إلى بـاطـن الأرض أو في الـفضـاء<br />إلى مـرفـأ الغـد .. أو أرض أمس<br />أرى كل شيء ومن أين جاء<br />وافعل ما قاله القدماء<br />من الفقراء<br />أو الحكماء<br />أو الأمراء<br />أو الأشقياء أو البلهاء فليس يهم<br />لقد قيل وهو الكلام المهم<br />اللي يعيش ياما يشوف<br />واللي يمشي يشوف اكتر<br />شفت الجبرتي بحرافيش الحسين وبولاق<br />بان البلد ماشي زي النمس في الأسواق<br />بالفلاحين ع المداخل من بعيد وقريب<br />بالأرنؤوط بالشراكسة بكل صنف عجيب<br />مترصصين سور رهيب مزراق في ريح مزراق<br />كأنهم لا بشـر ولا خلقـة الخـلاق<br />ومصر فلاحة تزرق بين رقيب ورقيب<br />من غير أبو الهول ما ينهض ناهضة شايله حليب<br />والصبح بدري الجبرتي ينام وقلمه يسيب<br />على اسم مصر<br />مصر اللي عمر الجبرتي لم عرف لها عمر<br />وطلع لقاها مكان مليان عوام وزعر<br />جعيدية غوغاء يجيبوا تملي وجع الراس<br />وخليط أفارقه هنادوة روم ملل أجناس<br />والترك في القلعة والمماليك خدودهم حمر<br />كان عمرها ستلاف سنة .. كلها سنين خضر<br />بس الزمان يختلف زي اختلاف الناس<br />ناس تبني مجد وحضارة وناس بلا احساس<br />وناس تنام لما يزحف موكب الأحداث<br />على اسم مصر<br />والمس حجارة الطوابي وادق بكعابي<br />يرجع لي صوت الصدى يفكرني بعذابي<br />يا ميت ندامة على أمة بلا جماهير<br />ثورتها يعملها جيشها ومالها غيره نصير<br />والشعب يرقص كأنه عجوز متصابي<br />إنهض من القبر احكي القصة يا عرابي<br />يطل لي رافع الطهطاوي م التصاوير<br />شاحب ومجروح في قلبه وجرح قلبه خطير<br />وعيونه مغرورقين بيصبوا دمع غزير<br />على اسم مصر<br />مالك سلامتك بتبكي ليه يا طهطاوي<br />قال لك عرابي .. انكسر بسلاح أوروباوي<br />وسلاح أوروبا ماهواش المدافع بس<br />ده فكر ناقد مميز للثمين والغث<br />قلناها ميت ألف مرة ألف مرة بصوت جهير داوي<br />بس الحماقة لاليها طبيب ولا مداوي<br />ولا حد م الخلق بالخطر اللي داخل حس<br />الغفلانين اللي خلوا العقل صابه مس<br />قالوا الخطر هو فكر أوروبا لو يندس<br />على اسم مصر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133310/http://www.20at.com/article2.php?sid=593"

