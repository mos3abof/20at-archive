[[comments]]
order = 12
subject = "باريس"
author = "واحد تاني"
posted = "2006-03-22"
text = "اذا كنت من اللى بيحبوا يختصروا ويجيبوا من الاخر يبقى اول حاجة هتحب تبتدى بيها رحلتك لباريس هى الشانزليزيه وهتكون بدايتك من ميدان الكونكورد واللى اول ما توصل هناك هتعمل زى الاستاذ اللمبى لما قال ايه اللى جاب القلعة على البحر, بس انت هتقول ايه اللى جاب الاقصر فى باريس ودا بمجرد ماتلاقى المسلة الجميلة اللى بتزين قلب ميدان الكونكورد واللى طبعا واحد من اللى حكمونا اهداها لهم ولا لما تكون بتاعة ابوه.<br />وميدان الكونكورد له قصة تاريخية لو عرفوها حكامنا ممكن ياخدوا منها عبرة وهى ان الباشمهندس اللى اخترع المقصلة (بتاعة قطع الرقبة) هو والدكتور لوي سيز (الملك اللى خلاه يخترعها) هما الاتنين تم قطع رقابيهم فى الميدان دا وبنفس المقصلة لما قامت الثورة بفرنسا.<br />اما الشانزلزيه بقى.... فاذا كنت محتاج تقعد ربع ساعة فى ميدان (التايم سكوير) بنيويورك عشان تشوف كل اعراق واجناس الدنيا فا انت هنا محتاج بس تتمشى خمس دقايق عشان يحصل نفس الشيئ ... ناهيك عن المطاعم والقهاوى اللى اكيد هتلاقى منها اللى على ذوقك والمحلات بقى حدث ولا حرج.<br />اما اذا كنت غاوي فن فيمكن تحب تبتدي من اللوفر واللى هيبهرك اول ما توصل للساحة الرئيسية له (ساحة نابليون) لما تشوف الهرم الزجاجى الكبير اللى معمول بنفس نسب الهرم بتاعك ودى طبعا كانت لفته ذكيه من الاستاذ اليابانى اللى صمم توسعة المتحف (او القصر بمعنى ادق) لما اضاف الهرم الفرعونى كجزء رئيسي للمبنى.<br />استنى بقى لما تدخل وتشوف بعينك الجناح المصري وكمية الاثار الفرعونية واليونانية الموجودة فيه وانت تعرف اد ايه انت شخص محل اهتمام منذ سنين , مش بس من اللى بيسرقوك من الداخل لا دا كمان من اللى بيسروق فى بلاد بره كمان ... تحف واثار ملهاش عدد واللى كتير منها خرج بره مصر من ابواب خلفية وتروح تدفع تذكرة عشان تتفرج عليه .... مش مهم خليك فريش انت فى رحلة.<br />انا حاسس انى طولت عليكم وانا لسه محكيتش غير عن مكانين اتنين بس, لو مهتمين تعرفوا اكتر قولوا ما تتكسفوش او ممكن نروح بلد تانية."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133310/http://www.20at.com/article2.php?sid=593"

[[comments]]
order = 13
subject = "يلا بقي"
author = "هبابه او هوبه او هبهوب"
posted = "2006-03-22"
text = "ولوني مبحبش اتكلم كتير عن البلد دي<br />بس عشان حلفانكو حقول ......<br />خلينا نروح نيوريوك الاول .<br />بالاخص\" منهاتن \".<br />رحت فين يا بت يا هبه انا كنت عامله نفسي مثقفه ورحت متاحف<br />باختلاف انواعها \" للبشر والحيوانات \"<br />يعني متاحف لسكان البلاد الاصلين اللي هما الهنودومتاحف للحيوانات زي الديناصورات<br />شفت الديانصور يا بت يا نفين<br />وبعدين ايه ...<br />علي ايدك الشمال فيه وول ستريت .<br />لحظه ادبهلال سعتها اللي بشوفه في التلفيزيون شايفه قدامي \" كبايه ميه \"<br />المهم اول ما دخلت الشارع لقيت \" التور \"<br />المشهور وفتحلي بقه \" هو ورايا ورايا \"<br />بعديها كدا بكام شارع رحت اقدم كنيسه فيكي يا نيويوك .<br />حدها علي طول \" يعني في قفاها \"<br />مركز التجاره العالمي \" لاالالالاه\"<br />ناس كتير بقه بتاخد صور ومنظر بشع خير اللهم ما اجعله خير ارض وااااااااسعه لسه بيبنه فيه . وانا اتصورت جنب المبني<br />\"مصيبه لتقع في ايد البوليس \"<br />\"فرنسا \"<br />رحتها ساعتين علي سبيل الترانزيت بس و ما ادراك لفيت المطار<br />لما قلت بس بصوا الموضوع دا كبير ولو فتحت مش هخلص , بس كل اللي كنت بقوله<br />je suis malaid مش عارفه استهجتها صح ولا<br />لاه . كفايه كدا النهارده ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133310/http://www.20at.com/article2.php?sid=593"

[[comments]]
order = 14
subject = "القاهرة قطعة من القلب"
author = "سنووايت"
posted = "2006-03-22"
text = "عن المدينة التي لا تنام<br />وغرام لا يضاهيه غرام<br />متى بدأ العشق بيننا لا أعرف<br />متى تعودت نفسي أن تصحبني لذلك النيل الذي يحمل أسرار البشر والحضارات التي مرت على ضفتيه<br />ينتابني إحساس باني أقف أمام بوابة للتاريخ 00 بكل ما يحويه من غموض وعبق<br />مدينتي التي لا تنام<br />أعرف ان أغازلها في أي لقطة من لقطات اليوم<br />يوم استقبلت الفجر هناك في مركب شراعي على صفحته الصافيه<br />وهمس لي بسره وحكيت له سري<br />صارت القاهرة ونيلها هما تميمة العشق والخلود<br />ميدان رمسيس وشمس مارس وانا اقف هناك ذائبة بين جموع البشر فلا اعرف إلا ان اتجمد لأراقب البياعين والنساء والأطفال والرجال 00 خلطة من الدم واللحم والعرق والصبر \" كيف تلمح كل ذلك في عالم اخر ومدينة اخرى<br />القاهرة ومترو مصر الجديدة \" ألة الزمن العبقرية\" اغمض عيناي لارى كل سنوات العمر التي مضت هنا وكل من صادقت وصاحبت في هذه الاله<br />ألفا من الحكايات تنهال على ذاكرتي وانا استمتع بصوته المحبب ومشيته الهادئة ونزهته الطفولية 0<br />وسط البلد 00 وسحرها ومبانيها<br />جروبي ومكتبة مدبولي ودار الشروق<br />ميدان طلعت حرب 00 شارع عماد الدين<br />أخرج من ذاتي لاراني نصف اخر مشطور من زمن أخر اراني اركض سعيدة هانئة البال احمل ألفا من الامنيات في مقلتي<br />هي دي القاهرة<br />مزيج الحب والسحر والغموض"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133310/http://www.20at.com/article2.php?sid=593"

[[comments]]
order = 15
subject = "من الغرب للشرق ... حول"
author = "واحد تاني"
posted = "2006-03-22"
text = "طبعا كلنا عارفين الفخفخينة .... وهيا انك تروح ضارب كل العصاير سوا فى كاس واحد وتحس فكل شفطة بعصير مختلف عن اللى قبله , لو عايز بقى تحس بطعم فخفخينة الدول .... اطلع على دبي وتحديدا دبي يعني مش ابوظبي ومش الشارقة.<br />هى بلد ظريفة هتستمتع فيها بوجودك , ورغم فكرة القرية العالمية اللى فيها(Global Village) اللى كل حى هناك بيمثل مكان من دولة الا انك مش محتاج تزورالقرية دى, كفاية انك تمشى فى البلد وانت تشوف كل العادات وكل الطباع وكمان تاكل اكلات كل الدول التانية , لو ركبت مركب فى الخور الموضوع شوية هيفكرك بالنيل الا اذا مكنتش عاوز تفتكر, انت حر...(والخور دا ممر مائي ينفصل من الخليج ليمر بوسط دبى قبل ان يعود للخليج مرة اخرى) ترعة يعنى.<br />سيبك من الفنادق لانها كتيرة وحلوة اوى ممكن تلاقى منها كتير فى بلاد بره , على اعتبار ان احنا لسه فى بلاد جوه, انما الجديد بقى... لازم تجرب السفاري فى الصحرا هناك وياعينى لو سقت بنفسك هتعمل طيران شراعى بالعربية فى الكثبان الرملية, والسهرة تحلى على النيران المشتعلة مع الشوي والموسيقى الشرقي.<br />المهم ان البلد دى بقى بيسيطر عليها احساس واحد هو انها تعمل كل اللى انت مش متوقعة فى الوقت اللى انت مش متوقعه.... يعنى بلد درجة الحرارة فيها 50 درجة وتلاقى فيها اكبر مكان للتزحلق على الجليد فى العالم تبقى دى بقى جديدة, ولما قالوا يا عمران قالك فين اعلى مبنى فى العالم ياعم.... طيب ياللا بينا نعمل برج دبى ارقى واغلى كيلومتر مربع على وجه الارض.<br />اما عن المراكز التجارية (Malls) فمن احلى المراكز اللى عجبتنى هناك (ابن بطوطة) والمبنى بيحكى رحلات ابن بطوطة السبعة وكل جناح فيه بينقلك لعالم تانى, عجبنى اوي جناح تونس وجناح الهند .<br />الجديد بقى انك فى المستقبل القريب مش هتحتاج تروح فرنسا تشوف برج ايفل ولا ايطاليا تشوف برج بيزا ولا حتى الناس يجولك مصر يتفرجوا على الاهرامات لان كل عجايب الدنيا بيبنوها حاليا فى دبى لاند ...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133310/http://www.20at.com/article2.php?sid=593"

[[comments]]
order = 16
subject = "\"كلاكت تاني مره \""
author = "هووووبه او هبهوب"
posted = "2006-03-22"
text = "هو انا مش حكتب زي اخونا \"الواحد التاني<br />\"بالحق هو الاول فين ?<br />المهم رحتي فين تاني يا بت يا هوبه \"حقول نيورك بس\"<br />نقول الحي الصيني \"نقول الصيني \"<br />اولا ساعه لما تخش الحي دا ابسط حاجه ابسط حاجه تتقال \"الارض بتتكلم صيني \"<br />بتتكلم صيني كلوه صيني في صيني انك تشوف انجليزي ابدا البنوك صيني في صيني تحس انك سائح حتي<br />لو امريكاني . اشتريت ايه من هناك حته ضفدعه \"علي سبيلالتدكار\"<br />نروح هارلم ولابلاش نروح هارلم معاك كام مطوه علي الرغم<br />من ان الحي كان الاغنياء فقط معرفش ايه اللي حصل<br />بس هارلم الزنوج ولاحاجه بالنسبه \"لهارلم الاسبان\"<br />الاخير دا العن \"ما انا كنت قاعده في بتنا لازم اخرج يعني\".<br />نروح فين تاني يلا بينا علي حي الروس زيه زي الصيني بالظبط.<br />الكلمه المشهوره واللي كنت دايما بقولها \"خرشو\" او\"دا\"<br />يعني \"حسنا\" اشتريت مش حقول فودكا طبعا حته شنطه مسكينه.عليها رسمه بريئه \" شنب فلادمير بوتن\".<br />نروح الحي العربي اوباه<br />حتلاقي طبعا مساجد وبيشتموه في امريكا عيني عينك \"زي فيلم عادل امام\" اكتر المحلات لبيع اللحمه الحلال وازيء<br />ا<br />فيه مركز اسلامي كويس في قدام المسجد بلظبط قهوه للمزاجامال وحبه شيشه \" وري وريابرده\"<br />نفس\" شهيق زفير ...زفير شهيق \"<br />بقي حاجه ان نيويورك بلد اللهجات كل واحد بيتكم بلهجه<br />مختلفه يعني الزنجي غير الابيض \"موضوع اللهجات اصله تعبني\"<br />تبقي بقي حارتنا \"المعفنه \" واللي بحبها موت وعم \"السيد\"<br />وادانه اللي يصحي الميت \"دلوقت مبسمعش ادان خالص مالص\"<br />ولما افتكر حاجه حكملكم \"هبهوب في بلاد العجائب\" او \"ماوراء واحد بحر وااحد محيط\"<br />و و\"جاي \"علي راي سنبل ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133310/http://www.20at.com/article2.php?sid=593"

