posted = "2006-03-21"
text = "فيها بروكلين وكوينز اللى كنت هتقتل فيها عشان فى جيبى 100 ملطوش اخضر<br />فيها ارض فاضية (للبيع) مكان برجين وقعوا محدش عارف ليه<br />فيها مصريين فى نيوجيرسى اكتر من اللى فى محطة مصر<br />منهم اللى زى ابراهيم ومنهم اللى زيي<br />بس فى النهاية فيها ممكن تروحى معاهم واشنطن دى سي تشتمى اجعص واحد وتقوليلو الكداب بيروح النار...وفين ؟ قدام بيته اللى لونه ابيض وترجعي بيتك سليمة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133310/http://www.20at.com/article2.php?sid=593"

