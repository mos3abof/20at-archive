[[comments]]
order = 19
subject = "شووو.....ما هايك ؟"
author = "واحد تاني"
posted = "2006-03-23"
text = "اذا كنت تبحث عن مكان يحتويك بكرم الضيافة فلا بد من زيارة لبنان ولا بد لك ان ترى لبنان الجديدة التى قامت على يد الرئيس الحريري ذلك العظيم الذى احب بلده واعطاه فحفظه شعبه حتى بعد رحيله, لعل من اعظم المشاهد التى تراهاكان يوم الوفاء يوم 14 فبراير الماضى عندما احتشد الناس بجوار مسجد رفيق الحريرى فى قلب بيروت لاحياء ذكرى مقتله,المهم لازم تروح تشوف السوليدير وتاكل مشاوي لبناني وفتوش وتبولة فى مطاعم الداون تاون ولا تنسى التمشية فى شارع الحمرا وزيارة صخرة الروشة(بفتح الراء) اماعن اكثر الاماكن التى احبها هناك فهى خارج بيروت , اذا ذهبت شمالا الى مدينة جونيه ربما لانها تذكرني بالاسكندرية زمان بشوارعها المرصوفةبحجر البازلت الاسود ومبانيها ذت طابع البحر متوسطى والشواطئ الرائعة, واذا كنت من محبى الاثارة فعليك بالجبال اما للتزحلق اذا كنت فى الربيع او لركوب التلفريك والتمتع بالمناظر من اعلى...نصيحة, لا تنسى زيارة مغارة جعيدة قبل ما تفل (بكسر الفاء)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133310/http://www.20at.com/article2.php?sid=593"

[[comments]]
order = 20
subject = "شو هايدا .... انت مصري؟"
author = "واحد تاني"
posted = "2006-03-23"
text = "ملحوظة اذا كنت تحمل الجنسية المصرية فى جواز سفرك ودونما باقى الجنسيات العربية الاخرى فانت الوحيد (نظرا لانك فريد من نوعك) هيكون مطلوب منك فى كل مرة تدخل فيها لبنان انك توريهم فى المطار 3 اثباتات :<br />1- تاكيد حجز الفندق (وهيتصلوا بالفندق عشان يحلف لهم انك نزيل عنده)<br />2- تذكرة العودة مؤكدة الحجز (واحتمال يتصلوا بشركة الطيران عشان تحلف لهم هى كمان)<br />3- على الاقل مبلغ 2000 دولار حتى لو كانت هتقعد فى البلد يومين بس.اوعى تروح معاك اقل من 2000 دولار.<br />غير كده بقى اهل البلد نفسهم ناس ذوق ذوق صراحة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133310/http://www.20at.com/article2.php?sid=593"

