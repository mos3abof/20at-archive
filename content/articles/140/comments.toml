[[comments]]
order = 11
subject = "يا من يسب اسامه - قاتلك الله ان لم تهتدى"
text = "يا من يسب اسامه- قال رجل يا رسول الله صلى الله علية وسلم هل نأخذ على ما نقول فقال له علية الصلاة والسلام ويحك وهل يكب الناس فى النار على وجوههم وفى رواية على مناخيرهم فى النار إلا من حصاد السنتهم . لذلك اتقى الله قبل ان تنطق بكلمة ربما لاتلقى لها بالا تهوى بك فى نار جهنم .<br />وبدلا من ان تسب بن لادن اذهب وانظر لمن يقتل ويسبى المسلمات ويفعل فيهن ما يغضب الله(فى العراق-وافغانستان- و الشيشان والبوسنة والهرسك وفلسطين الحبيبةمسرى حبيبنا صلى الله علية وسلم .<br />واخيرا لايسب بهذة الطريق الا الجبان الجبان"
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019033839/http://www.20at.com:80/article.php?sid=443"

[[comments]]
order = 12
subject = "صلي الله علي محمد صلي الله عليه و سلم(عبد اللطيف)"
text = "تظل جيادنا متمطرات تلطمهن بالخمر النساء<br />فإما تعرضو عنا اعتمرنا وكان الفتح وانكشف الغطاء<br />وإلا فاصبروا لجلاد يوم يعز الله فيه من يشاء<br />وجبريل أمين الله فينا وروح القدس ليس له كفاء<br />ــــــــــــــــــــــــــ<br />أما البشر الذي يلقي السب فهذا يكفيه ذالك<br />والسلام علي من أتبع الهدي"
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019033839/http://www.20at.com:80/article.php?sid=443"

[[comments]]
order = 13
subject = "صلى الله عليك يا سيدى يا رسول الله"
text = "لا يجوز كاتبة او قول: اللهم صلي ( بالياء المثناة تحت لان هذا يدل على التانيث وتنزه الله عن ذلك ) وانما يقال ويكتب ( اللهم صل ) باللام المشددة وهو فعل طلب ولا يقال فعل امر لانه طلب من الادنى الى الاعلى اى من المخلوق الى الخالق جل وعلا. لعله كان خطا مطبعى ... بارك الله فيكم ورزقنى واياكم حسن الختام."
archived = "2004-10-19"
capture_url = "https://web.archive.org/web/20041019033839/http://www.20at.com:80/article.php?sid=443"
