text = "اللهم صلي و سلم و بارك على سيدنا محمد..<br />موضوع جميل و أجمل ما فيه هو ابراز اللهجة السلمية التي استخدمها عليه الصلاة و السلام، و التأكيد على كذب المقولة بأن الإسلام انتشر بالسيف و رفض المسلمين لأهل الكتاب..<br />ربنا يوفقكوا..."
