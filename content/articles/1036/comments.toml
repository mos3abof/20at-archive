[[comments]]
order = 0
subject = "حسبنا الله و نعم الوكيل"
author = "مسلم"
posted = "2006-05-23"
text = "اية التفاهة دي واية الصور دي<br />أنا مش عارف اية الضنك اللي احنا فية ده<br />موقع منقسم علي نفسة مواضييع سياسية و دينية<br />و في نفس الوقت مواضييع سخيفة و صور نساء متبرجات<br />لا أفهم ماهي توجهات هذا الموقع بالضبط<br />و حسبنا الله و نعم الوكيل<br />و لي سؤال واحد لصاحب المقال<br />هل عرض صور النساء في آخر موضوعك حلال؟<br />إذا أعدت الجواب فحفظة جيداً حتى تجيب بة و انت بين يدي الله يوم القيامة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131337/http://www.20at.com/article2.php?sid=837"

[[comments]]
order = 1
subject = "يا اخي اتلهي"
author = "مفروسة"
posted = "2006-05-23"
text = "لا اله الا الله ياجماعة قلنا قبل كده الناس بتوع التكفير والهجرة دول بلاش يدخلوا يعلقوا ع الموضوعات أصلا وبعدين يا أخ المسلم هو انت اول مرة تشوف نساء من غير طرحة او من غير حجاب والنبيي تتلهي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131337/http://www.20at.com/article2.php?sid=837"

[[comments]]
order = 2
subject = "ياستي الله يسامحك"
author = "مسلم"
posted = "2006-05-23"
text = "الأخت مفروسة ربنا يهديكي ياستي<br />أولا الله يسامحك علي انك اتهمتيني بأني تكفير و هجرة و سبحان الله كل ما حد يتكلم في دينة يبقي تكفقر أنتي شفتيني كفرت حد, أتقي الله و لا ترمي أحد بما لا تعرفيني<br />ثم أصلا لو قلنالك أية هو منهج التكفير و الهجرة مش هتعرفي ترضي<br />و أخيراً مش معنى أن المتبرجات بقت كثير في البلد يبقي رؤيتهم حلال و إلا مكنش يبقي في معنى لغض البصر<br />و أرجو لمن يجادل ان يجادل و يحاور بإدب و شكراً"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131337/http://www.20at.com/article2.php?sid=837"

[[comments]]
order = 3
subject = "توجهاته شمال في يمين اهلا بيك دا انت في المريخ."
author = "مش شغلك بس بيحشر نفسه في كل حاجه"
posted = "2006-05-23"
text = "مش ححناور ولا حنجادل الموضوع ظريف وكميل ...<br />اما الصور فاعتقد انك عندك قناه الجزيره..<br />ولما تقلب في القنوات\" يعني القناه اللي بعدها\"<br />حتلاقي روتانا او ميلودي وم ش حتقدر تغمض عينك<br />صور النساء ياباشا في الشارع زي الرطش...<br />مجتش علي المسكينه تفتتح تعليقاتك بحسبنا الله ونعم الوكيل ويعني هوانت\"مسلم'واحنا كفره..<br />ياباشا الموضوع كويس من الناحيه الفنيه..<br />ولو رحت اسلام او نلاين حتلقيهم بر دوبيتكلمو عن الفن.<br />واتكلمو عن عمرو الشريف,ويوسف شاهين, كتييييير<br />في قسم فنون وثقافه ماله بقي الموضوع دا<br />ها ماله ماله .وفي الاخر كلمتي المفضله شوف<br />الوحش قبل الحلو واللي عارف الصح يعمله من تانيبه<br />ضمير \" يعني صرف النظر عن \"مسلم\" او قبطي.<br />وتقبل راي بصدر او كليه رحبه وسلام ياباشا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131337/http://www.20at.com/article2.php?sid=837"

