[[comments]]
order = 6
subject = "اخي مسلم اختي مفروسه"
author = "عبدالله مفتاح"
posted = "2006-05-23"
text = "كلنا متفقين على ان التبرج حرام ولكن الاختلاف على عرض الصور<br />بامكاني ان اتفهم وجهة نظر مسلم في عدم عرض صور متبرجات وبامكاني ايضا ان اتفهم وجهة نظر المفروسه وان كنت اميل لوجهة نظر مسلم لانه من الواضح انه الاقوى حجه<br />وانتشار الخطا لا يعني بالضرورة ان نكون جزء منه او نشارك فيه<br />اما مش شغلك هبهوب سابقا مسلم لم يعترض على الكلام في الفن قدراعتراضه على الصور<br />اخي مسلم ارجو ان يكون نقدك اكثر حلما حتى يتقبله الاخرون<br />وعلى كل مسلم يريد لكم الخير فوجهة نظره تتلخص في ان نشر صور المتبرجات قد تجلب لكم بعض الاثام التي انتم في غنى عنها<br />يعني كلنا خايفين على بعض"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131337/http://www.20at.com/article2.php?sid=837"

[[comments]]
order = 7
subject = "هذا ماقصدتة بارك الله فيكم"
author = "مسلم"
posted = "2006-05-24"
text = "أخي : عبدالله مفتاح<br />هذا ما قصدتة بالفعل و هو عرض الصور ليس أكثر و لم أتطرق أن الفن حلال لم حرام فهذا يتطلب كلام من شيوخ و علماء و ليس منا نحن<br />و طالما الحرام كثير فليس معنى هذا ان نشارك فية أو ان سيكون حسابنا لأسهل لا و الله<br />و المفروض علينا الا تعجبنا كثرة الخبيث.<br />أما الأخ هبهبوب فأهذا موضوع عجيب جدا<br />هل لأني سميت نفسي مسلم أكون أنعت بقية الناس أنهم كفرة يا أخي مين يفهم ما فهمتة أنت<br />نرجو من الأخوة عدمتخيل كلام لم أقولة و الحكم علية<br />ثم حتى نشر هذه المواضييع تضع في أذاهننا نحن الشباب أن هؤلاء قدوة و مثل عليا لناز<br />فقط هذا ما وددت توضيحة و لكم جزيل الشكر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131337/http://www.20at.com/article2.php?sid=837"

[[comments]]
order = 8
subject = "الفرق بين العالم والمثقف"
author = "رائد بغدادي"
posted = "2006-06-27"
text = "أخواني أرجو الالتفات الى أن الفرق بين العالم والمثقف مع الاحترام والاعتزاز للجميع:<br />العالم هو الذي يعرف كل شيء عن شيء واحد(يختص بعلمه في مجال واحد حتى يعرف انه عالما في المجال الفلاني)<br />المثقف هو الذي يعرف شيئا عن كل شيء<br />فأذا ماوجدنا ان كاتب المقال تكلم اليوم عن الفن وغدا عن السياسة فهذا دليل ثقافته .أما ماقال الاخ مسلم فأنني احترم وجهة نضره كما أحترم وجهة نضر الاخت مفروسة ولكن لايجوز تكفير أحد ياأخت مفروسة لانه ان لم يكن كافرا فحديث النبي عليه الصلاة والسلام أنك ستكوني كافرة مكانه لان على احدكما ان يبوء بكلمة الكفر نسأل الله العافية. أما من حشر نفسه بينهما وله بالغ الاحترام والذي تكلم بقلة الادب قليلا فأرجو ان يراجع نفسه كثيرا والى كل الاخوة أن لم يكونوا بمستوى الموضوع أرجو التفضل بالسكوت وعدم رمي قذاراتهم هنا.واخيرا لنكن عمليين قليلا ونعترف ان الموضوع رائع جدا لاننا نسمع عن مهرجان كان ونرى حفلات المهرجان في التلفاز ولم نتعرف على هذه المدينة الا من خلال هذا المقال الجميل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131337/http://www.20at.com/article2.php?sid=837"
