subject = "طب خلاص حغيره رخامه...."
author = "هوووووبه\"الموسم الجديد\" مش شغلك وهبهوب سابقا"
posted = "2006-05-23"
text = "خفيف ظريف بيسال هناك اهوه منين غيرتي اسمك.<br />وخليتيه \"مش شغلك\" حقولك \"مش شغلك\" ياخفه...<br />عشان خاطر نوفا والله .. يتكم الشلل مع ان اسم غتت,فعلا بس يلا اشوفكم في \"مش شغلك جديده\""
