[[comments]]
order = 16
subject = "..& نحبه .. نعم - نغالى فى حبه : لا &.."
author = "..& هيكل الأزهرى &.."
posted = "2006-09-01"
text = "السلام عليكم اولا .. ثانيا احب اقولك يا اختى العزيزة المصرية إن نجيب محفوظ فعلا يستحق كل التقدير مننا لكن لا نغالى فيه اان فعلا زعلت على موته لكن قولت فى نفسى لعل وعسى المرض فعلا يكون تاعبه والموت ريحه من كل التعب دا واحب اقولك يا اختى العزيزة اننا لازم نكتب اى شىء يكون فعلا عن اقتناع ورضى وانتى فعلا اسئتى للشيخ الشعراوى رحمه الله واسكنه الفردوس الأعلى وعمرو خالد رغم كل الإنتقادات اللى عليه فهو انسان بيعمل مجهود كبير وفعلا من عباد الله الصالحين فى ارضه .. ياريت تعيدى نظرك فى الموضوع ولو ايقنتى انك غلطتى ياريت تتأسفى بنفس الكتابة لنفس الأسماء اللى اسئتى ليهم.. واحب اقولك يا اخى الفاضل اللى رديت على اختنا مصرية انك مقولتش شىء غلط لكن اتكلمت بجفاء شديد والله اعلم بنيتها ممكن تكون فعلا ناوية على غير الكلام دا لكن معرفتش تعبر الا بالكلمات دى مش اكتر اهم شىء نلتمس لبعض العذر لاننا بشر وكلنا بنخطء اهم شىء اننا ننصحها فعلا لوجه الله وبطريقة ترضى ضميرنا ويرضى عنا بيها ربنا عز وجل .. تحياتى لكل انسان بيكتب بصدق ويعلق بصدق ويقرأ بصدق ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133522/http://www.20at.com/article2.php?sid=1166"

