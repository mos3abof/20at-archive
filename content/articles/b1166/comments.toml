text = "لم اكن من عشاق الرجل و لكنى اعترف ان نجيب محفوظ فعلا هو اخر حبات العقد كما قال مراقب<br />ذللك العقد الفريد الذى ضم السباعى و احسان و يوسف ادريس معشوقى الاول و الاخير<br />رحم الله محفوظ و رحم الادب العربى مما قد ياتى من بعده<br />و بالنسبه للجنازه سواء عسكريه او لا فالشعب المصرى سيشيع نجيب محفوظ بنفس الاحساس<br />و بنفس الحزن"
