[[comments]]
order = 18
subject = "الاخوة المترحمين على من سب الله والرسول وأل البيت"
author = "الاخوة المترحمين على من سب الله والرسول وأل البيت اتقوا الله"
posted = "2006-09-01"
text = "- أعطى الغرب نجيب محفوظ جائزة نوبل عن روايته \" أولاد حارتنا \" ، التي بدأ نشرها مسلسلة في جريدة الأهرام سنة 1959م ثم ظهرت في كتاب عام 1967م عن دار الآداب ببيروت. وهي رواية رمزية تجرأ فيها على الله سبحانه وتعالى ، وعلى الأنبياء عليهم السلام ، وعلى الإسلام . وملخصها لايخرج عن فكرته السابقة في ادعاء التناقض والصراع بين العلم والدين ؛ ثم تكون النهاية بانتصار العلم . وقد حاول في هذه القصة أن يقول بالرمز كل ما عجز عن قوله صراحة.<br />- إن الحارة رمز للدنيا وأولاد الحارة هم البشر من لدن آدم عليه السلام إلى العصر الحاضر وربما دخل فيهم - عنده - الملائكة والشياطين. و\" الجبلاوي \" المتسلط في الرواية رمز لله - سبحانه وتعالى - ، و\" قاسم \" رمز لمحمد صلى الله عليه وسلم ، و \" جبل \" رمز لموسى عليه السلام - لأن الله كلمه في الجبل - ، و\" رفاعة \" رمز لعيسى عليه السلام - لأن الله رفعه - .. وهكذا ، ثم جعل \" عرفة \" رمزًا للعلم الذي يقتل \" الجبلاوي \" !! نعوذ بالله من الكفر - . وفكرة \" موت الإله \" كما يقول الأستاذ عبدالله المهنا : \" فكرة فلسفية غربية ، كتب عنها نجيب محفوظ في بداية حياته مقالات عدة ، وخاصة عندما كان يدرس الفلسفة ، وهي مستقاة من مقالات وكتب لسلامة موسى .. \" . ( دراسة المضمون الروائي في أولاد حارتنا ، ص 62 ) . يقول الدكتور عبدالعظيم المطعني : \" الخلاصة أن هذه الرواية تترجم في وضوح أن كاتبها ساعة كتبها كان زاهداً في الإسلام كل الزهد، معرضاً عنه كل الإعراض، ضائقاً به صدره، أعجمياً به لسانه، فراح يشفي نفسه الثائرة، ويعبر عن آرائه في وحي الله الأمين بهذه الأساليب الرمزية الماكرة، والحيل التعبيرية الغادرة، رافعاً من شأن العلم الحديث.. فالرواية –وهذا واقعها- رواية آثمة مجرَّمة بكل المقاييس\" . ( جوانيات الرموز المستعارة .. ، ص 229 ) . فالرواية : - \"ترسي مبادئ الاشتراكية العلمية والماركسية الملحدة بديلاً للدين والألوهية والوحي، وتبشر بوراثة العلم الدنيوي المادي للدين الذي ترى أنه استنفذ أغراضه، ووهنت قواه!\" . (الطريق إلى نوبل عبر حارة نجيب محفوظ، ص5) ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133522/http://www.20at.com/article2.php?sid=1166"
