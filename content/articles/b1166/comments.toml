[[comments]]
order = 0
subject = "مصر.................عريانة"
author = "مراقب"
posted = "2006-08-31"
text = "وجميلة في قلب زنزانة<br />عريانة والأرض عريانة<br />رحم الله الزمن الجميل ,كان هذا ضمن قصيدة للجميل كامل الشناوي في جميلة بوحريد الفدائية الجزائرية ..وانفرط العقد .وكانت آخر حباته نجيب ... وهكذا أصرت الأساطير أن تبارح مصر ذهب الحكيم توفيق ويوسف إدريس والسباعي عبد القدوس و جودة السحار وطه حسين العميد وحسن الزيات وأمير الشعراء شوقي والعقاد وذهب الرجال الذين كانوا يطوقونهم بالحب ومعارك النقد كالمازني وغيره كثر وكثير ... وأخيرا أطفأ محفوظ السراج وهو يغادرها وتركها في قلب زنزانة.. عريانة والأرض عريانة.... سلام عليك يا مصر في العالمين ...سلام عليك وقد شيعت آخر حبات اللؤلؤ في العقد الذي كان يزين جيدك .... سلام عليك يا مصر وأنت تدخلين النفق المظلم بعد أن ودعت كل أولاد حارتك ولم يبق حولك وفوق صدرك سوى أولاد................الحرام"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062300/http://masr.20at.com:80/article.php?sid=865"

[[comments]]
order = 1
subject = "اجعلوا جنازته شعبية .....لا عسكرية"
author = "مراقب"
posted = "2006-08-31"
text = "لا تزعجوا مصر .. ولا تفزعوا نجيب محفوظ<br />لا تجعلوها جنازة عسكرية.. لقد كرهنا كل ماهو عسكري ... وياليت السياسيين جميعهم لا يشاركون فيها .... فقط دعوها جنازة شعبية... اجعلوا الشعب وحده هو الذي يشيع جثمان نجيب محفوظ.. اتركوا الجثمان تحمله اكتاف أولاد الجالية والسيدة زينب وبين القصرين وحارة المواردي... أتركوه لأولاد المنيب والقلعة والسيدة عائشة وشبرا ... اتركوه لأولاد الشعب الذي حفظه ووصفه بين جنبات رواياته ... ولا تدعو الجثمان تتقدمه الياقات الزرقاء والبرفانات والرتب ... لا تجعلوا الشعب دائما في الخلف بعدكم أيها المتخلفون الأميون الجهلاء... فأنتم لم تقرأوا لنجيب محفوظ ولم تعرفوا نجيب محفوظ ولم تقدروا نجيب محفوظ ... فقط دعوه للشعب واتركوه لأحبابه ..اتركوه للفقراء يحملونه على أكتافهم فذلك خير وسام له وأفضل من جنازتكم العسكرية ومن مدفعيتكم.."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062300/http://masr.20at.com:80/article.php?sid=865"

[[comments]]
order = 2
subject = "بلاش تقديس"
author = "ياسر ابو عمار"
posted = "2006-08-31"
text = "طبعا لازم اقول البقاء لله فى الاديب الكبير ،ولكن ابوس ايد كل المسئولين فى وسائل التغييب \"الاعلام \"المصرية ،استحلفهم بالله الا يكرهونا فى الرحل بعد وفاته ،وذلك عن طريق الحديث عنه ليل نهار لمدة 3 سنوات منذ يوم الوفاة ،طبعا كلنا عارفين انه الحكومة بتاعتنا ما بتصدق جنازة وتشبع فيها لطم ،واهو كله مصلحة منها نملا فراغ فى المواد الاعلامية ومنها نلهى البنى ادمين الغلابة اللى ربنا كتب عليهم يعيشوا فى مصر ،الرحمة حلوة ،والشئ اذا زاد عن حده انقلب الى ضده ،وبعدين عاوز اسال يعنى ايه وليه جنازة عسكرية وايه فائدتها ،ارحمونا من تقديس الافراد ودعونا نحترم الموهوبين دون مبالغة ."
archived = "2006-09-03"
