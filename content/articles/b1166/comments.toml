subject = "كل تقدير واحترام"
author = "مصرية"
posted = "2006-08-31"
text = "كل تقدير واحترام لاستاذنا المحترم والجليل ابى واخى وحبيبى اللى انا متربية على رواياته نجيب محفوظ اللى عندى افضل بكثير من الشعراوى وعمرو خالد وجميع المفتين اللى على الساحة لان نجيب محفوظ اعطى لمصر الكثير ويشرفنى انه مصرى لانه كان بيعمر مصر بافكاره لكن اللى انا ذكرت اسمهم بعد نجيب محفوظ هما اللى خربوا مصر بافكارهم والرجوا من الله ان يعوضنا بنجيب محفوظ اخر على الاقل يبقى له مثل افكاره وانا حزينة جامد على ما قراءته على ان مرشد الاخوان بانه سوف يقوم هو بعمل الجنازة وياريت يطلع الخبر دى خاطىء لان على راى المثل الشعبى المعروف ( يقتل القتيل ويمشى فى جنازته) بسبب تحريض امثاله على قتل الرجل العظيم سنة 1994 وبالتالى المرشد مبسوط دلوقتى علشان هيعرف يشتغل ويدس افكاره المسمومة ورحمة الله لنجبنا المحفوظ اللى كتبه هتقضى على اى فكرة مسمومة بعد موت جسده والبقاء لله ولمحبين الرجل العظيم الكامل نجبنا المحفوظ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133522/http://www.20at.com/article2.php?sid=1166"

