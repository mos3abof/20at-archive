subject = "إن لله وإن إليه راجعون"
author = "زنوبه"
posted = "2006-09-01"
text = "إن لله وإن إليه راجعون<br />الى رب غفور رحيم إنشاء الله<br />يعتقد الكثير منا آن آصحاب المعاتى الجميله فقط هم الذين يرحلون عن عالمنا ليبقى الحقراء جاثمين على آنفاسنا<br />ولكن الحقيقه عكس ذلك فالشرفاء يرحلون والحقراء آيضا إلى زوال عن قريب بإذن الله<br />ولكن ... آين العظه؟!! هيهات هيهات لمن هم صدئت قلوبهم وآعتقدوا آنهم فى غفله من الموت باقون<br />ولا يبقى الا العمل الصالح آو الطالح<br />نحن ندعوا للشرفاء بالمغفرة وللحقراء بالخزى والهلاك<br />الى رب غفور رحيم بإذن الله يا نجيب محفوظ<br />هذا الدعاء صادر من قلبى بالرغم من طلوع عيييينى آنا وآلاف البشر فى شوارع القاهره اليوم بسبب ترتيبات الجنازه<br />البلد كلها واقفه وكل من آضطرته الظروف للخروج ... شعر بالندم"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903062300/http://masr.20at.com:80/article.php?sid=865"

