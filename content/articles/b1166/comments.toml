text = "نجيب محفوظ الله يرحمه كان أستاذ و رائد فى مجال الرواية و القصة القصيرة كمان و كان صاحب أسلوب خاص جدا سماه النقاد بره (بالواقعية السحرية) على أساس أنة بينقل صور من الواقع بس بأسلوب خيالى ساحر يشد القارئ و يخليه ميقدرش يسيب القصة إلا بعد ما يخلصها<br />الله يرحمك يا أستاذنا كنت فعلا فنان"
