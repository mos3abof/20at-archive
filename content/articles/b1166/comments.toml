subject = "..& رحمك الله يا طيب القلب &.."
author = "..& هيكل الأزهرى &.."
posted = "2006-08-31"
text = "رحمك الله يا استاذنا الجميل .. رحمك الله يا صاحب القلب الطيب العريق .. رحمك الله واسكنك فسيح جناته - كلنا هنموت وآمل انى اقابلك فى الجنة ان شاء الله يا استاذنا الجميل - انا فعلا سمعت كلماته فى كذا مناسبة وبجد مش ممكن نلاقى الصدق اللى فى كلامه دا متوفر فى كتير غيره ربنا يرحمه يارب .. اخر شىء احب اقوله ان الإنسان دا النجيب المحفوظ بإذن الله , احب اقول للى مش عارف عنه شىء احب اقوله انه شخص فعلا كان بيفكر بعقله وبيستخدم مواهب ربنا وضعها بداخله وفعلا يستحق كل الثناء ودلوقتى لا يستحق منا الا كل خير وأن نذكره بكل خير ولا نكف من الدعاء عليه .. اللهم ارحمه يارب العالمين وأسكنه فى فسيح جناتك واغفر له كل خطاياه وبرحمتك لا بعمله اسكنه جنة المأوى يارب العالمين & اللهم آمين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133522/http://www.20at.com/article2.php?sid=1166"

