[[comments]]
order = 2
subject = "استخدم عقلك"
author = "لينا"
posted = "2006-06-21"
text = "بداية، فكرة الموضوع جدا رائعه والمعلومات المطروحة قيمة للغاية ان الجهد المبذول لجمع وصياغة ماكتب ماهو بالجهد القليل ابدا لذلك كل الشكر للكاتب وجامع المعلومات وهكذا عودتنا عشرينات على البحث والتقصي عن كل ماهو ممتع ومفيد فقد اصبح من النادر في هكذا وقت ان تجد عنصري المتعه والاستفاده في وقت واحد.. وهذا فعلا ماحققه راسموس من عمله واضافاته العلميه<br />اظنه كان مستمتعا كثيرا بما يقوم به لذلك نجح هذا النجاح الرائع مع العلم انه يصف نفسه بالكسول<br />ليتنا كسالى مثله .. فما كان هذا حالنا مازلنا نستورد العلوم والتكنولوجيا من الخارج بينما نحن العرب مؤسسوا علم الرياضيات والفيزياء وغيرها<br />عزيزي مصعب<br />عمل جديد وموضوع يستحق التصفيق<br />دمت بعافية<br />لينا<br />sleepingangel_wl@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143541/http://www.20at.com/article2.php?sid=883"
