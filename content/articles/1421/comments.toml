[[comments]]
order = 0
subject = "موضوع رااااائه بشدة"
author = "Cherry"
posted = "2006-05-31"
text = "بجد الموضوع ده رااااائع، مكتوب حلو أوي والقصة نفسها جميلة أووووي.<br />والأشخاص العباقرة دول بجد واللي موجودين في عصرنا الحالي واللي بيخترعوا تكنولوجيا تمكننا أن نشعر بأن العالم صغير جداً وأننا نستطيع إبتكار تقنيات حديثة تقرب الشباب من بعضهم والعالم كله من حوالينا... لازم تقدموها لنا كتتتيييييير أوي...<br />النماذج دي مع إنها مش عندنا بس لازم نعرف إنهم السبب إن إحنا ننشر اللي إحنا عايزينه على النت وقدموا للبشرية أشياء عظيمة أفادتها وأكيد لسة حتفيدها.<br />شكراً جداً يا مصعب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143541/http://www.20at.com/article2.php?sid=883"

