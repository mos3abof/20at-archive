subject = ""
author = "بلد متخلف"
posted = "2009-11-29"
text = "العالم كلة شرقة وغربة وجنوب الصحراء وحتى الدول اللى كانت بتاكل فيران دلوقتى تدخل اى مكتب حكومى تلاقى الموظف قاعد على المكتب وقدامة الكمبيوتر وبيخلص المعاملة لاى مواطن بتكة ماوس او نقرة على لوحة المفاتيح تطلع مطبوعة من على الطباعة فى ما عدا المخروبة بلدنا مصر تلاقى الموظف علشان يخلص لك معاملة هايفة يلففك 10 مكاتب و 10 توقيعات وتكون الورقة اطبقت ودابت<br />احنا فى مصر فى الحكومة بيننا وبين التقدم 100 سنة<br />يصة صغيرة لاجتماع مجلس شعب تلاقى الاعضاء بتوعنا قاعدين زى المقاطف او الزكايب يصفقوا وقدمهم شوية ورق ابيض فارغ انما اى دولة تانية متخلفة تلاقى الاعضاء قاعدين فى المجلس وكل واحد فاتح اللاب توب بتاعة قدامة وبيتابع الجلسة<br />طالما السادة اللواءات بتوع احذية البيادة فى رجليهم ودماغهم وبيحكمونا يبقى مفيش فايدة<br />علموا عيالكم كمبيوتر<br />الهند بتورد لامريكا متخصصين فى البرمجة واعظم المبرمجين فى امريكا هنود<br />دة حتى بنك القاهرة بيستخدم برنامج هندى فى المعاملات<br />اخية عليكى بلد"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202102652/http://www.20at.com:80/masr/hot-topics/14173--icdl.html"

