subject = "رمضان معنا ...............:u"
author = "التلفزيون الأردني احسن شي انو يسكر القناة لأنو ما عندو برامج حاوة و لا عندو مذيعين و مذيعات بفهمو و اذا بالصدفة طلعت مذيعة منيحة القنوات الأخرى باخدوها و طبعا ما رح يرفضو لأنو ما حد بضل بقناة ماالها مستقبل و انكتب عليها الموت"
posted = "2006-10-04"
text = "**نصيحة انكم ما تحاولو تقلدو اي قناة لأنو هيك بتخربو بدل ما تحاولو تصلحو"
