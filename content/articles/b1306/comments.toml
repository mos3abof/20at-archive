[[comments]]
order = 4
subject = "ضوء احمر"
author = "لمياء"
posted = "2006-10-12"
text = "رمضان كريم<br />من الاجدر ان نضع اللوم على عقولنا بدل من ان نضع اللوم على اجهزتنا<br />التلفزيون و الصحافة منابر حق ومن الاصح ان نضع اللوم على العائلات الاردنية المنغلقة تحت شعار ( من العيب ) ان تعمل الفتاة في مجال الفن . التلفزيون ..و غيرها<br />الاردن بلد حضاري متطور يكافح لاجل شعبه فماذا عمل الشعب لبلده ؟<br />و كما قال الوالد الراحل جلالة الملك الحسين رحمه الله ( على قدر اهل العزم تؤتي العزائم )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133109/http://www.20at.com/article2.php?sid=1306"
