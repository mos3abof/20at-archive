[[comments]]
order = 1
subject = "همام مين يا ريس"
text = "الكلام اللي انت شفته في همام في امستردام حاجة واللي يعملوا (اتش) ده حاجة تانية<br />الحكاية دي بتفكرني بشخصية اعرفها كويس جدا .. الحياة عندها بسيطة وابسط من كل الكلام الجعلص اللي بتستخدموه في التعبير عن احلامكم .. الراجل حب يروح على لندن .. خدت شنطة هدومه وطلع على لندن .. اشتغل وتعب وعرق من غير ما يزعق ولا يقول أنا سافرت لندن يا رجالة ولا رجع عمل فيلم هندي عن رحلة العذاب .. ويكفي الكلمة اللي بيقولها في الآخر .. انه اكتشف لغة واحدة بتجمع الناس كلها اسمها الحماسة والعمل<br />ولو قعد كل المجعلصين اللي في الدنيا يقولوا افاكارهم مش ممكن يوصلوا للفكرة دي زي ما وصلت ببساطة كده من اتش .. خلونا ندور على اللغة الواحدة اللي بتجمع الناس كلها .. الحماسة والعمل .. نفع الناس .. السفر واكتشاف افاق جديدة .. احلى حاجة فيك يا اتش .. انك عميق زي البحر بس بسيط في بساطة نسمة المطر في الخريف اللي تنزل على الانسان تنعشه من غير ما تزعق .. بحبك يا اتش .. تتجوزني؟"
archived = "2004-09-16"
capture_url = "https://web.archive.org/web/20040916010234/http://www.20at.com:80/article.php?sid=611"

[[comments]]
order = 2
subject = "زمزم"
text = "فكره الموضوع حلوه بس اسلوب سردها كان محتاج يتظبط شويه<br />المهم الحكايه دى مشجعه لو واحد بيفكر يعمل زيك بس واضح انك كانت والدتك دعيالك عشان الامور تمشى بالسهوله والسرعه دى<br />وحمد الله على السلامه ياH"
archived = "2004-09-16"
capture_url = "https://web.archive.org/web/20040916010234/http://www.20at.com:80/article.php?sid=611"

[[comments]]
order = 3
subject = "احب اقول لكل شب و كل فتاء"
text = "بسم الله الرحمن الرحيم<br />احب اشكر الاستاذ البني ادم اللي كان بيتكلم من شوية<br />و اقوله ان هعقب على نقطتين اتنين بس<br />النقطة الاولى و التانية ذي بعض<br />اللي هي ان الواحد مدام قلبه جامد و مش خايف من الحياة و مخليها على الله . اكيد ربنا هيكرمه و يكون جانبه .<br />النقطة التالته الباشا اللي كاتب التعليق التاني . راجل جامد و جدع و الناس كلها بتحبه و انا بقدره و احترمه و ربنا يديم المعروف.<br />وانا عايز اقولكوا انكم عندكم حل من اتنين تحلوه<br />يتبنيلهم بيوت يا توفر لهم الكلة<br />و السلام عليكم ورحمة الله وبركاته<br />كاتب الموضوع<br />HMH"
archived = "2004-09-16"
capture_url = "https://web.archive.org/web/20040916010234/http://www.20at.com:80/article.php?sid=611"

[[comments]]
order = 4
subject = "واحد من بره"
text = "لندن دى تحفه من تحف الزمان, بس مطار هيثرو مش نضيف قوى ثم البوابه بتاعه الشرق الأوسط اللى هيه بوابه 4 مش نضيفه خالص يعنى بس برضه لندن تحفه و ملهاش حل, بس على فكره الدنيا مش سهله قوى كده و وردى يعنى انا شفت ناس متبهدلين هناك قوى و انجليز زفت ثم لندن فيها جنسيات تانيه خالص يستحقوا الدبح زى الإيطالين و الإيطالين و بناتهم مش مؤدبين يعنى خالص جدا قوى و ربنا يهدى"
archived = "2004-09-16"
capture_url = "https://web.archive.org/web/20040916010234/http://www.20at.com:80/article.php?sid=611"

[[comments]]
order = 5
subject = "واحد عاوز يسافر"
text = "الأول حمد لله على السلامة.<br />وبعدين هي اسم المدرسة أيه؟؟<br />أصل باين عليها مدرسة شكلها كويسة... أصل أنا لما قرات الموضوع طلعت في دماغي وعاوز اكرر اللي حصلك بس سلفني قريب اللي ظبطك."
archived = "2004-09-16"
capture_url = "https://web.archive.org/web/20040916010234/http://www.20at.com:80/article.php?sid=611"
