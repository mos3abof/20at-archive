[[comments]]
order = 2
subject = ""
author = "محمد فتحى"
posted = "2009-07-28"
text = "والله يا جماعه كل كليات الشرطه والحربيه والجويه والعسكريه لازم الوسطه وقبل الوسطه الفلوس يعنى بقيمة 50 الف جنيه معاك هتخش مش معاك هتتطرد فى الحال حتى لو كنت كامل من مجاميعه هى دى الحيات معاك فلوس هدوس على كل شىء مش معاك هتتداس من كل شىء ليه بس هى الدنيا كلها بقت بالفلوس وهى دى سنه الحياه ههههههههههههههه ه يا رب يارب يكون عند الناس ضمير انا كنت عاوز اقدم فى الحربيه وفى مقدم قلى معاك وسطه قلتله ربنا قالى روح استنى ربنا فى الجامع هههههههه ايه هى الناس دى بتعبد الفلوس (حسبيا الله ونعم الوكيل فى البشر الى بالشكل ده حسبيا الله ونعم الوكيل)"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121333/http://www.20at.com:80/masr/hot-topics/6942.html"

[[comments]]
order = 3
subject = ""
author = "محمد فتحى"
posted = "2009-07-28"
text = "الناس خلاص يا دنيا نسيت ربنا مسكين حبل الفلوس وبندمر مستقلب بعضنا"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121333/http://www.20at.com:80/masr/hot-topics/6942.html"

