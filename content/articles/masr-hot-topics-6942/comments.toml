[[comments]]
order = 5
subject = ""
author = "الشيطان"
posted = "2009-08-08"
text = "عايز ابقي امين شرطة بس مش عارف اروح ولا اجي منين ارجوووووووووووو ووووكم سعدوني"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121333/http://www.20at.com:80/masr/hot-topics/6942.html"

[[comments]]
order = 6
subject = ""
author = "وائل سيد على فرغلى"
posted = "2009-08-22"
text = "[انا مش هقول انا نفسى ابقى امين شرطه بس انا بااتمناها بس ارجو من الامناء ان يكونى مخلصين لعملهم ان فى مناطق واحشه والشرطه معها فى الرشاوى وهى حكومه قسم السلام ارجو ان كلامى توصل لمكتب المكافحه ارجوكم"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121333/http://www.20at.com:80/masr/hot-topics/6942.html"

[[comments]]
order = 7
subject = ""
author = "احمد"
posted = "2009-08-25"
text = "و النبى الناس اللى بتقول فلوس و مش فلوس لنا مستعد ادفع و اخش كلية الرطة بس يا ريت حد يدلنى انا اعرف ضباط و طلبة فى الرطة و لا و احد فيهم عنده او يعرف اللى تدفعله يدخللك ده"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121333/http://www.20at.com:80/masr/hot-topics/6942.html"

