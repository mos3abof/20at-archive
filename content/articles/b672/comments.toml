[[comments]]
order = 0
subject = "معلومه ب.... ببلاش"
author = "عبدالله مفتاح"
posted = "2006-04-08"
text = "كلمة يتيم في اللغه من الغفلة او من الوحدة<br />واليتيم في الانسان هو من مات ابوه<br />اما اليتيم في الحيوان من ماتت امه<br />شايفين حلاوة اللغة؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143203/http://www.20at.com/article2.php?sid=672"

[[comments]]
order = 1
subject = "والله ده كلام العاقلين"
author = "ام محمد"
posted = "2006-04-08"
text = "بالفعل ان يوم اليتيم اسمه واللي بيحصل فيه من الاهتمام البالغ احسسني انه لابد سيؤذي الانسان اليتيم لانه يوم واحد وبعد ذالك ان شاء الله السنه الجايه تجعل الطفل الذي يميز يسأل نفسه اساله ماكان بيسالها من قبل وان وضعه اصبح وضع شفقه امام الجميع لذالك يجب تغيير الاسم واحلى اختيار هو يوم الطفل حتى يشعر الايتام انهم مثل باقي الاطفال والله اعلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143203/http://www.20at.com/article2.php?sid=672"

[[comments]]
order = 2
subject = "لغتنا العربيه"
author = "نيفين"
posted = "2006-04-09"
text = "انا برده با عبد الله كنت بشعر بالفخر لما بسمع فاروق شوشه و هو بيقول لغتنا العربيه و يمكن علشان بكتب شعر (متواضع)بحس بكدا اكتر<br />المهم و الله يا جماعه الواحد بيحس بفخر كل سنه لما بيساهم ف اليوم دا و السنه دى كان اليوم رائع و قدرت اشارك رغم ان ايدى مكسوره..عموما الحمد لله.. عبد الله انا بعتللك رد على الايميل بتاعك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143203/http://www.20at.com/article2.php?sid=672"

[[comments]]
order = 3
subject = "انا عيطت"
author = "هبابه او هوبه او هبهوب"
posted = "2006-04-09"
text = "بصو يا جماعه الحاجات دي بتاثر فيااوي<br />وبزعل جدا جدا جدا لما اشوف طفل صغنون بيعيط والصوره اللي فوق دي موثره بجد حسه اني عايزه امسح دموعه يا قلبي ياني .دا غير انه اسسسسسمره كمان ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143203/http://www.20at.com/article2.php?sid=672"

[[comments]]
order = 4
subject = "من سيد اليتامى"
author = "مناضل أنترنت قديم"
posted = "2006-04-10"
text = "السلام عليكم ورحمة الله و بركاته<br />انا معترض أساسا على فكرة وجود يوم للطفل اليتيم يا جماعه الطفل اليتيم مش عايزك تفتكره مره واحده فى السنه هو محتاج لك كل يوم تكون معاه و الله احنا فى نعمه و ربنا يبارك لنا فى أبائنا و أمهاتنا<br />اما لايتامنا فنقول لهم بشرى لكم فسيد الخلق كان يتيما و انتم ليسوا بشىء شاذا انتم من اختاركم الله ليبتلى بكم المجتمع كله فان احسن إليكم فاز و إلا خسر خسرانا مبينا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143203/http://www.20at.com/article2.php?sid=672"

[[comments]]
order = 5
subject = "فقدان الأب ولا فقدان الدين"
author = "أمينه"
posted = "2006-04-11"
text = "بورك لكم في آبائكم وأبنائكم، فقط أردت التذكير كم من أبناء لديهم آباء ولاكن لايهتمون بهم ، فعليه وجب التنبيه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143203/http://www.20at.com/article2.php?sid=672"

