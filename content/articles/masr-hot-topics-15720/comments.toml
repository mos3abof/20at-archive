author = "لا تذهبوا"
posted = "2010-03-12"
text = "اذا كان البابا شنودة مانع الحج للقدس الا برجوعها للعرب تانى والقدس الشرقية بالذات<br />والناس كلها بتحترم راية<br />ويمكن التسويات ترجع الضفة الغربية والقدس الشرقية وفيها مقدسات المسلمين والمسيحيين<br />فانتظروا شوية<br />الا اذا كانت هناك ضغوطا من اسرائيل<br />ونتنياهو اتصل بالمسئولين عندنا وقال لهم ابعتوا العيال يلعبوا مع الفلسطنيين كحجة واهو بالمرة زيارة لاسرائيل<br />وبعدين المنتخب لما اخد بطولة افريقيا المرة اللى فاتت شيخ امارة دبى دعاهم وكرمهم واعطى كل واحد فيهم صندوق هدايا وفلوس<br />والمرة دى محدش عبرهم يمكن علشان الموقف من الجزائر ومحدش عايز يزعل الجزائريين<br />فرايحيين يتكرموا فى اسرائيل<br />العملية ريحتها وحشة"
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314062253/http://www.20at.com:80/masr/hot-topics/15720--t-.html"
