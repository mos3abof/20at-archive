author = "لنتواصل"
posted = "2010-03-11"
text = "لنتواصل مع اهلنا اصحاب الارض وندعم موقفهم ونقول لهم انتم اهل الرباط<br />الختم الاسرائيلى على الجواز المصرى نقطة قذارة ولكنها الضرورة<br />مصلحة امتنا وشعبنا الفلسطينى اولا<br />انتم شفتم الاسرائيلى فى الانتفاضة الاولى عمل اية لما لقى الفلسطينيون بيحرقوا العلم الاسرائيلى فى المظاهرات - فتح دكان يبيع فية الاعلام الاسرائيلية للفلسطنيين علشان يحرقوها<br />وتوسع نشاطة وعمل ورشة خياطة تفصل العلم الاسرائيلى من قماش ردىء ويبيعة بأغلى الاسعار للفلسطنيين وحقق مكاسب<br />وهل حرق علم اسرائيل هيوجعها فى حاجة دى هبل ولا معنى لة<br />كذلك ختم اسرائيل على الجواز المصرى هل يضرنا فى شىء<br />توكلوا على اللة وسافروا وشوفوا الفلسطينيون<br />وربنا معاكم"
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314062253/http://www.20at.com:80/masr/hot-topics/15720--t-.html"

