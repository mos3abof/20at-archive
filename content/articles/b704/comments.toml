[[comments]]
order = 5
subject = "أنشودة المطر"
author = "ئالان نوح / كوردستان العراق"
posted = "2006-04-18"
text = "انه كلام جميل عن المطر..<br />واضيف لكم رائعة بدر شاكر سياب (انشودة المطر):<br />عَيْنَاكِ غَابَتَا نَخِيلٍ سَاعَةَ السَّحَرْ ،<br />أو شُرْفَتَانِ رَاحَ يَنْأَى عَنْهُمَا القَمَرْ .<br />عَيْنَاكِ حِينَ تَبْسُمَانِ تُورِقُ الكُرُومْ<br />وَتَرْقُصُ الأَضْوَاءُ ...كَالأَقْمَارِ في نَهَرْ<br />يَرُجُّهُ المِجْدَافُ وَهْنَاً سَاعَةَ السَّحَرْ<br />كَأَنَّمَا تَنْبُضُ في غَوْرَيْهِمَا ، النُّجُومْ ...<br />وَتَغْرَقَانِ في ضَبَابٍ مِنْ أَسَىً شَفِيفْ<br />كَالبَحْرِ سَرَّحَ اليَدَيْنِ فَوْقَـهُ المَسَاء ،<br />دِفءُ الشِّتَاءِ فِيـهِ وَارْتِعَاشَةُ الخَرِيف ،<br />وَالمَوْتُ ، وَالميلادُ ، والظلامُ ، وَالضِّيَاء ؛<br />فَتَسْتَفِيق مِلء رُوحِي ، رَعْشَةُ البُكَاء<br />كنشوةِ الطفلِ إذا خَافَ مِنَ القَمَر !<br />كَأَنَّ أَقْوَاسَ السَّحَابِ تَشْرَبُ الغُيُومْ<br />وَقَطْرَةً فَقَطْرَةً تَذُوبُ في المَطَر ...<br />وَكَرْكَرَ الأَطْفَالُ في عَرَائِشِ الكُرُوم ،<br />وَدَغْدَغَتْ صَمْتَ العَصَافِيرِ عَلَى الشَّجَر<br />أُنْشُودَةُ المَطَر ...<br />مَطَر ...<br />مَطَر...<br />مَطَر...<br />تَثَاءَبَ الْمَسَاءُ ، وَالغُيُومُ مَا تَزَال<br />تَسِحُّ مَا تَسِحّ من دُمُوعِهَا الثِّقَالْ .<br />كَأَنَّ طِفَلاً بَاتَ يَهْذِي قَبْلَ أنْ يَنَام :<br />بِأنَّ أمَّـهُ - التي أَفَاقَ مُنْذُ عَامْ<br />فَلَمْ يَجِدْهَا ، ثُمَّ حِينَ لَجَّ في السُّؤَال<br />قَالوا لَهُ : \" بَعْدَ غَدٍ تَعُودْ .. \" -<br />لا بدَّ أنْ تَعُودْ<br />وَإنْ تَهَامَسَ الرِّفَاقُ أنَّـها هُنَاكْ<br />في جَانِبِ التَّلِّ تَنَامُ نَوْمَةَ اللُّحُودْ<br />تَسفُّ مِنْ تُرَابِـهَا وَتَشْرَبُ المَطَر ؛<br />كَأنَّ صَيَّادَاً حَزِينَاً يَجْمَعُ الشِّبَاك<br />وَيَنْثُرُ الغِنَاءَ حَيْثُ يَأْفلُ القَمَرْ .<br />مَطَر ...<br />مَطَر ...<br />أتعلمينَ أيَّ حُزْنٍ يبعثُ المَطَر ؟<br />وَكَيْفَ تَنْشج المزاريبُ إذا انْهَمَر ؟<br />وكيفَ يَشْعُرُ الوَحِيدُ فِيهِ بِالضّيَاعِ ؟<br />بِلا انْتِهَاءٍ - كَالدَّمِ الْمُرَاقِ ، كَالْجِياع ،<br />كَالْحُبِّ ، كَالأطْفَالِ ، كَالْمَوْتَى - هُوَ الْمَطَر !<br />وَمُقْلَتَاكِ بِي تُطِيفَانِ مَعِ الْمَطَر<br />وَعَبْرَ أَمْوَاجِ الخَلِيج تَمْسَحُ البُرُوقْ<br />سَوَاحِلَ العِرَاقِ بِالنُّجُومِ وَالْمَحَار ،<br />كَأَنَّهَا تَهمُّ بِالشُّرُوق<br />فَيَسْحَب الليلُ عليها مِنْ دَمٍ دِثَارْ .<br />أصيح بالخليج : \" يا خليجْ<br />يا واهبَ اللؤلؤ ، والمحار ، والردى ! \"<br />فيرجعُ الصَّدَى<br />كأنَّـه النشيجْ :<br />\" يَا خَلِيجْ<br />يَا وَاهِبَ المَحَارِ وَالرَّدَى ... \"<br />أَكَادُ أَسْمَعُ العِرَاقَ يذْخرُ الرعودْ<br />ويخزن البروق في السهولِ والجبالْ ،<br />حتى إذا ما فَضَّ عنها ختمَها الرِّجالْ<br />لم تترك الرياحُ من ثمودْ<br />في الوادِ من أثرْ .<br />أكاد أسمع النخيل يشربُ المطر<br />وأسمع القرى تَئِنُّ ، والمهاجرين<br />يُصَارِعُون بِالمجاذيف وبالقُلُوع ،<br />عَوَاصِفَ الخليج ، والرُّعُودَ ، منشدين :<br />\" مَطَر ...<br />مَطَر ...<br />مَطَر ...<br />وفي العِرَاقِ جُوعْ<br />وينثر الغلالَ فيه مَوْسِمُ الحصادْ<br />لتشبعَ الغِرْبَان والجراد<br />وتطحن الشّوان والحَجَر<br />رِحَىً تَدُورُ في الحقول … حولها بَشَرْ<br />مَطَر ...<br />مَطَر ...<br />مَطَر ...<br />وَكَمْ ذَرَفْنَا لَيْلَةَ الرَّحِيلِ ، مِنْ دُمُوعْ<br />ثُمَّ اعْتَلَلْنَا - خَوْفَ أَنْ نُلامَ – بِالمَطَر ...<br />مَطَر ...<br />مَطَر ...<br />وَمُنْذُ أَنْ كُنَّا صِغَارَاً ، كَانَتِ السَّمَاء<br />تَغِيمُ في الشِّتَاء<br />وَيَهْطُل المَطَر ،<br />وَكُلَّ عَامٍ - حِينَ يُعْشُب الثَّرَى- نَجُوعْ<br />مَا مَرَّ عَامٌ وَالعِرَاقُ لَيْسَ فِيهِ جُوعْ .<br />مَطَر ...<br />مَطَر ...<br />مَطَر ...<br />في كُلِّ قَطْرَةٍ مِنَ المَطَر<br />حَمْرَاءُ أَوْ صَفْرَاءُ مِنْ أَجِنَّـةِ الزَّهَـرْ .<br />وَكُلّ دَمْعَةٍ مِنَ الجيَاعِ وَالعُرَاة<br />وَكُلّ قَطْرَةٍ تُرَاقُ مِنْ دَمِ العَبِيدْ<br />فَهيَ ابْتِسَامٌ في انْتِظَارِ مَبْسَمٍ جَدِيد<br />أوْ حُلْمَةٌ تَوَرَّدَتْ عَلَى فَمِ الوَلِيــدْ<br />في عَالَمِ الغَدِ الفَتِيِّ ، وَاهِب الحَيَاة !<br />مَطَر ...<br />مَطَر ...<br />مَطَر ...<br />سيُعْشِبُ العِرَاقُ بِالمَطَر ... \"<br />أصِيحُ بالخليج : \" يا خَلِيجْ ...<br />يا واهبَ اللؤلؤ ، والمحار ، والردى ! \"<br />فيرجعُ الصَّدَى<br />كأنَّـهُ النشيجْ :<br />\" يا خليجْ<br />يا واهبَ المحارِ والردى . \"<br />وينثر الخليجُ من هِبَاتِـهِ الكِثَارْ ،<br />عَلَى الرِّمَالِ ، : رغوه الأُجَاجَ ، والمحار<br />وما تبقَّى من عظام بائسٍ غريق<br />من المهاجرين ظلّ يشرب الردى<br />من لُجَّـة الخليج والقرار ،<br />وفي العراق ألف أفعى تشرب الرحيقْ<br />من زهرة يربُّها الرفاتُ بالندى .<br />وأسمعُ الصَّدَى<br />يرنُّ في الخليج<br />\" مطر .<br />مطر ..<br />مطر ...<br />في كلِّ قطرةٍ من المطرْ<br />حمراءُ أو صفراءُ من أَجِنَّـةِ الزَّهَـرْ .<br />وكلّ دمعة من الجياع والعراة<br />وكلّ قطرة تراق من دم العبيدْ<br />فهي ابتسامٌ في انتظارِ مبسمٍ جديد<br />أو حُلْمَةٌ تورَّدتْ على فمِ الوليدْ<br />في عالَمِ الغَدِ الفَتِيِّ ، واهب الحياة . \"<br />وَيَهْطُلُ المَطَرْ ..<br />كان بودي ايضا ان احدثكم عن المطر في رواية (مائة عام من العزلة) لغابرييل غارسيا ماركيز.. لكنني افضل ان اكتبها لكم في مناسبة اخرى.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131416/http://www.20at.com/article2.php?sid=704"

