text = "ده اسم اغنيه جميله كنت باسمعها زمان وانا صغيره بس كانت بتحسسنى بدفء الصعيد حتى فى عز البرد<br />حقيقى وعندها حق هبه بحب جدا بعد ما تخلص المطر اشم ريحته حقيقى جميله ولا مانع من الحصول على بعد القطرات من المطر قبل ما يشتد ينزل على راسنا<br />بس المهم اننا نقول دعاء المطر ومننساش فضل ربنا علينا فى كل وقت<br />اللهم اعنا على شكرك وذدرك وحسن عبادتك"
