order = 0
subject = "طق طق طق صوت مطر"
author = "هبابه او هوبه او هبهوب"
posted = "2006-04-16"
text = "ايوه كدا الله ينور كدا الكلام ولاه بلاش يا حاجه مني ,المطر دا ريحته فظيعه فظيعه بحبها موووووووووت<br />متعملوش زي الهبله اختي وتقولي هو المطر ليه ريحه اه ليه ريحه زي ريحه رمضان بردو عندي بقي ليه ريحه . مش عارفه اببعبر عنها ازاي بس ريحته حلوووووووه وخلاص<br />ريحته تبتدي من الشعر الاصيل \" يا مطره رخي رخي علي سقف بتنا رخي او طخي \"<br />و\" الدنيا بتشتي واروح لستي تعملي فطيره اكلها وانام تحت الحصيره \"<br />غير الاشعار الكتتتتتتتتيره اللي اتكلمت عن المطر ييييوه يا عشرينات حقلبها شعر كدا , اه علي فكره الاغاني تحفه 1<br />مطرٌ يبكي<br />خوفاً<br />من المطر !<br />المطر<br />2<br />مطرٌ<br />مجنونٌ<br />يستحم<br />بلعابه !<br />3<br />مطرٌ<br />يزحفُ<br />على بطنه<br />في بطنِ الشارع<br />يضاجعُ<br />ظله !<br />4<br />مطرٌ<br />لا يفهم شيئا<br />مما أكتبه<br />5<br />مطرٌ<br />يرعبُ فسائل الصلواتِ<br />في أطرافنا<br />غير المورقة !<br />6<br />مطرٌ<br />يبالغُ في المطر !<br />7<br />الملحُ<br />خيانةٌ الماء<br />يا مطري !<br />8<br />لماذا<br />يسرقون المطر<br />من أصابعي ؟<br />9<br />مطرٌ<br />يسكبُ ماء وجهه<br />تحت أقدامنا<br />10<br />قطرة وحيدة<br />تضحك<br />في هذا الزحام<br />11<br />مطر<br />يتبرعُ بأعضاءه<br />للتراب !<br />12<br />قطرة مطر تتساءل<br />أي الشرفات<br />أكثر ملاءمة<br />للانتحار ؟<br />13<br />قطرة مطر<br />التحم وجهها<br />بقفاها<br />على هذا الزجاج !<br />14<br />مطرٌ<br />يضرب رأسه<br />بالجدارِ<br />15<br />هذا الرعد<br />اعتذار المطر المدوّي<br />لم يقصد قتلكِ<br />.. أيتها النملة !<br />16<br />يا قطرة المطر العظيمة<br />كيف أخذتِ العالم كله<br />في قلبكِ حقوق النشير محفوطه لدي موقع مش فاكره ؟!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131416/http://www.20at.com/article2.php?sid=704"

