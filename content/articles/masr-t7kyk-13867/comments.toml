text = "الموضوع مهم جداً ولا يحتمل التأخير<br />As received<br />مؤامرة كبيرة جديدة تحيكها الماسونية العالمية عبر شركة Baxter والشياطين المسيطرين في الإدارة الأمريكية<br />للأسف فإن الأمريكيين أنفسهم اليوم كشفوا هذه المؤامرة ورفض الكثيرون أخذ لقاح الانفلونزاH1N1<br />Swine flu vaccine<br />والذي تنتجه شركة Baxter ذات السمعة الملوثة والإجرامية<br />حيث أنتجت 158 باوند من اللقاح الملوث بالفايروس وباعته لكل الدول الأوروبية قبل سنوات :<br />اقتباس:<br />BAXTER LABS makes 158 POUNDS OF PURE POISON VACCINE & SENDS IT OUT TO ALL EUROPEAN COUNTRIES<br />ويؤمن الكثير من المختصين الأجانب بأن انتشار هذا الوباء عبارة عن صفقة كبيرة Big Deal ضحيتها المجتمع البشري بشكل عام , ورفض كثير من الأطباء المشاركين في اختراع هذا اللقاح أن ي خذوه بل ومنعوا أصدقاءهم وأقاربهم من أخذه"
