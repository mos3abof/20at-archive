text = "وهذه ليست المرة الأولى لمثل هذه المؤامرات فقد حصل نفس الأمر عام 1918 م عندما توفي أكثر من 50 مليون انسان بنفس الطريقة The1918 flu pandemic<br />وللأسف فإن الدول العربية ستستورد اللقاح والذي من آثاره على جسم الانسان<br />إضعاف المناعة واحتمال الشلل النصفي والتوحّد وجعل الجسم ضعيفا ً أمام الفايروس<br />وأرجو من الإخوة أن يترجموا المعلومات الهامة جدا ً والتي ستفيد شريحة عظيمة من إخوانهم في الخليج ,ونتمنى إيصال هذه الرسالة إلى وزراء الصحة العرب<br />David Vaughan Icke: ‘Don’t Take The Swine Flu Vaccine’<br />\"لا تأخذوا لقاح الانفلونزا\" , تقارير طبية أجنبية<br />VACCINE CREATORS WILL REFUSE THE H1N1 VACCINE"
