[[comments]]
order = 13
subject = "الواقعية و حماس و التاريخ"
author = "إنسان غير واقعي"
posted = "2006-05-03"
text = "أن أؤمن أن الواقعية يجب أن تكون لها حدود. إن الواقعية المطبقة هي نوع من الاستسلام و الخنوع سواء على مستوى المقاومة أو حياة الفرد أما المثالية الطموحة الواعية العاقلة فهي سبيل الإنجاز... يجب الركون إلى موقع وسط بين الواقعية و المثالية في المبدأ...<br />لو أن كل الشعوب المستعمَرة ركنت إلى الواقعية و لم تطمح لما وجدنا أمثلة على الاستقلال من التاريخ... دائما في التاريخ كانت قوات الاحتلال أقوى و هو الوضع الطبيعي و لكن طموح المظلمين الذي هو فوق الواقع هو الذي أنتج لنا تاريخا يقول لنا أن المحتل لا بد أن يندحر...<br />باختصار: التاريخ يخبرنا أن المثالية السياسية في الطموح يمكن أن تثمر..<br />اللهم بارك في حماس و كل المناضلين ضد الظلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130542/http://www.20at.com/article2.php?sid=637"

