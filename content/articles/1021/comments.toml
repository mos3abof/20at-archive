[[comments]]
order = 19
subject = "احسب الناس"
author = "سامح"
posted = "2006-06-05"
text = "يقول رب العزة في كتابه العزيز* أحسب الناس أن يتركوا ان يقولوا آمنا وهم لا يفتنون ولقد فتنا الذين من قبلهم* فليعلمن الله الذين صدقوا وليعلمن الكاذبين* صدق الله العظيم<br />غالبية شعب فلسطين اختار الاسلام ورب العزة والله أعلم يمتحن هذا الشعب العظيم على مواقفه وقراره فاصبرا يا أهل الرباط نحن بخير عظيم وابشركم بانكم مدرسة هذه الامة ان شاء الله0 ولا نقول كماقال لعيسى ابن مريم اذهب انت وربك فقاتللا بل نقول يا حركة المقاومة الاسلامية \"حماس\" امضي ونحن من ورائك ان الله معناباذن الله0 والسلام عليكم ورحمة الله وبركاته0"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130542/http://www.20at.com/article2.php?sid=637"

[[comments]]
order = 20
subject = "حماسسسسسسسسسس"
author = "حمزة"
posted = "2006-06-19"
text = "بسم الله الرحمن الرحيم<br />الذين قال لهم الناس ان الناس قد جمعوا لكم فاخشوهم فزادهم ايمانا وقالوا حسبنا الله ونعم الوكيل فانقلبوا بنعمة من الله وفضل لم يمسسهم سوء واتبعوا رضوان الله<br />صدق الله العظيم<br />أولا الله يوفق حماس ونحن معها قلب وقالب<br />وربنا يخلصنا من الخونة في الداخل<br />يعني استغرب كيف بطالبوا بالعتراف في اسرائيل بس الي بقوله حسبنا الله ونعم الوكيل<br />سيري سيري يا حاماس انت المدفع واحنا الرصاص"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130542/http://www.20at.com/article2.php?sid=637"

[[comments]]
order = 21
subject = "رد على احمد"
author = "حمزة"
posted = "2006-06-19"
text = "بسم الله الرحمن الرحيم<br />حاب ارد على احمد الي بحكي على اشرف واحسن ناس (حماس) رحمة الله عليك يا شيخ احمد ياسين ويا عبد العزيز الرنتيسي الفصيل الي بتأسسة مثل هذول ناس مستحيل يطلعوا خاينين او هذول ضحوا بحالهم وبمالهم لأجل القدس والشعي الفلسطيني<br />وبعدين بيجي واحد زيك بحكي عليهم انت شو عملت عشان اخوانا ولا بس شاطر في الحكي<br />اكيد انت فتحاوي<br />بس حسبنا بالله ونعم والكيل وربنا شايف وعارف شوبسير والله يوخذ الخونة عشان نخلص<br />وحماس تعرف تشتغل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130542/http://www.20at.com/article2.php?sid=637"

