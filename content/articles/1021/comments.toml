subject = "الله يعزك يا حماس"
author = "مي المنوفيه"
posted = "2006-04-06"
text = "الله يعزك يا حماس<br />رافعه راسنا ما بين الناس<br />قالوا القوه هيا سلاح<br />قولتي الدين فوق كل أساس<br />الله يعزك<br />الله يعزك<br />الله يعزك يا حماس<br />النصر للمسلمين و لحماس<br />و إن شاء الله سوف تثبت حماس أنها الحق<br />و إن شاء الله سوف تثيت الأيام لكم أيضاً<br />حب الجهاد في دمك وولادك مخلصين<br />تحرير الأرض همك من إيد الغاصبين<br />حالفه يمين يا حماس<br />لاجل فلسطين ياحماس<br />اللهم انصر حماس و كل المجاهدين و حرر أراضي المسلمين كلها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130542/http://www.20at.com/article2.php?sid=637"

