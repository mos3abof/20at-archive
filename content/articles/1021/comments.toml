[[comments]]
order = 17
subject = "المجرم هو اليهود والنصارى :"
author = "حبيب الاقصى"
posted = "2006-05-28"
text = "المجرم ليس حماس او فتح وانما المجرم هم اليهود والأمريكان وكل من يعاونهم من الخون والانذال \"قاتلهم الله جميعا واخزاهم\" حسبي الله ونعم الوكيل...حسبي الله ونعم الوكيل... حسبي الله ونعم الوكيل ، لكن كما بٌشر سيدنا محمد سينتصر الاسلام والمسلمين وسيكون النصر من هنا من بيت المقدس انشاء الله وسوف يندم اشد الندم كل الظلمة وكل من كان له سبب في احتلال فلسطين او انتهاك حرمات المسلمين في بقاع الارض . لذا عليكم بالعودة الصادقة الى الله ولا تسألوا كيف انما كل منا يسأل قلبه قبل ان يتكلم او يفعل او حتى يصمت هل هذا الفعل يرضى الله سبحانه وتعالى أم لا؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130542/http://www.20at.com/article2.php?sid=637"

