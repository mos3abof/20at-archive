[[comments]]
order = 11
subject = "مالكم يا عرب اصحووووو"
author = "محمد من فلسطين الابيه"
posted = "2006-04-23"
text = "بسم الله الرحمان الرحيم بحب ابد وانهي كلامي انشاء الله باختصار ...... انا لا حماس ولا اشي انا فلسطيني عربي بحب بلدي الي ولدة فيها وتربية فيها انا بميل اكتر لتنضيم فتح بس مش معناه اني بكره حماس كلنا شعب واحد بس الي مستغرب منو انو العب قبل اليهود بيحاربونا و مش ولا بدهم ايساعدونا احنا هال فب 22 الشهر الموضفيين ماقبضو رواتبهم انا الي محل في رامالله والله بنفتح وبنسكر بمخسر ما في شغل ولا في اشي مش مشكله الجوع ولا الركوع بس انو نلاقي العرب ضضدنا هاي المصيبه (وين وصية سيدنا محمد وين عزة العرب وين دين الاسلام ) ما بنحكي الا عالا الله المستعان و ما بدنا اشي من العباد طووول مهو معنا رب العباد هو اعلم و اكبر انشاء الله ينصرك يا فلسطيين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130542/http://www.20at.com/article2.php?sid=637"

