[[comments]]
order = 0
subject = "مصـ( الخير )ـعب"
text = "السلام عليكم ورحمة الله و بركاته<br />أستاذ / محمد<br />سمعت عنكم الكثير من أحد الأصدقاء ( هو عارف نفسه )<br />و تمنيت أن يمن الله علي بقراءة أي من كتاباتكم<br />ثم فوجئت بهذا المقال الرائع ...<br />فبارك الله فيكم و سدد خطاكم<br />و جزاكم الله خيرا ...<br />شكرا جزيلا \" عشريناتنا \"<br />يا أجمل موقع شباب في الدنيا<br />ترقبوا البيان التأسيسي للحلف الكتروني الفظيع<br />مهندس العمليات المستحيلة!!!"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814012015/http://www.20at.com:80/article.php?sid=493"

[[comments]]
order = 1
subject = "هندسة"
text = "فعلا جمييييييييييييييييييييييييييييييييييييييل!!!<br />و أجمل حتة عجبتني :<br />\" هذا هو الرسم الهندسي لحياتك \"<br />حسيت فيها بالنخوة والانتشاء<br />و حمدت ربنا ان في حد من بره أسوار الكلية<br />ممكن يفهمنا ...<br />ازايك يا باشمهندس مصعب الخير ؟!<br />ده حضرتك و الأستاذ بيرو و الأستاذ مطر<br />قدوتي في التعليقات<br />و أتمنى أكون عند حسن ظنكم<br />في الحلف الالكتروني الفظيع<br />هندساوي حتى الموت!!!"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814012015/http://www.20at.com:80/article.php?sid=493"

[[comments]]
order = 2
subject = "اللي عارف نفسه"
text = "أول مقال كتبته للموقع ده كنت واخد نصه من كتابك الرائع \"أبدأ وعينك علي النهاية\"<br />أستاذ أحمد ...ربنا يبارك لنافيك<br />يا ريت كل العشريناتية يقولوا آمين (:"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814012015/http://www.20at.com:80/article.php?sid=493"

[[comments]]
order = 3
subject = "مصـ( الخير )ـعب"
text = "الحمدلله أنا بخير<br />لكن دخول الحلف مش بالساهل<br />و للا انت عاوزنا نفتح الباب على مصاريعه<br />و نسيب الفرصة للجواسيس و الخزنة ينضموا للحلف<br />هيبقى فيه اختبارات ولاء وانتماء للأعضاء الجدد<br />مستعد وللا تخلع؟!<br />ترقبوا البيان التأسيسي للحلف الكتروني الفظيع!!!<br />مهندس العمليات المستحيلة!!!"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814012015/http://www.20at.com:80/article.php?sid=493"

[[comments]]
order = 4
subject = "مصـ( الخير )ـعب"
text = "ازايك ياللي ( عارف نفسك )<br />آمييييييييييييييييييييييييييييييييييين<br />أي خدمة تاني؟!"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814012015/http://www.20at.com:80/article.php?sid=493"

[[comments]]
order = 5
subject = "هندسة"
text = "طبعا مستعد<br />أنا أفديكوا الساعة لما أحوز شرف انضمامي للحلف؟!<br />اختبروا براحتكم<br />و أنا بحيي الأستاذ \" بيرو \"<br />على حكمته وحرصه على الحلف<br />مش هو رئيس الحلف برض؟!<br />آه بالمناسبة<br />آمين"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814012015/http://www.20at.com:80/article.php?sid=493"

[[comments]]
order = 6
subject = "هريدي الدامد دداً"
text = "مقال قشطة<br />لمؤلف عسل<br />و حلف فل<br />أنا دايس في النظام<br />بعد إذنيكم<br />يا بوس \" بيرو \" , و معلم \" مصعب الخير \"<br />و اكسلانس \" مطر \"<br />تقبلوني أكون تاني الكتروني مستقل ينضم للحلف؟!<br />و بجد أنا بشجعكم من كل قلبي<br />وهاتبرع بتمن لتر دم<br />باسم الحلف \" إذا لقيت عندي دم \" !!!!!<br />و باعلن تطوعي في الجيش المصري<br />و خلاص بعلن اني هابطل السجاير<br />و اكون انسان جديد<br />و من أول يناير<br />خلاص هاشيل حديد<br />محسوبكم \" هريدي الدامد دداً \""
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814012015/http://www.20at.com:80/article.php?sid=493"

[[comments]]
order = 7
subject = "تايه بيشكرك"
text = "أنا كنت مستني مقال زي ده من زمان<br />شكرا يا أستاذ أحمد اناكنت تايه و حياتي ملخبطة دلوقتي هاعرف أوجه حياتي و اخليها ليها قيمة و استفيد منها وافيد الاخرين...ياه يا استاذ أحمد انت ماتتصورش المقال ده أثر في قد ايه<br />شكرا يا عشرينات"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814012015/http://www.20at.com:80/article.php?sid=493"

[[comments]]
order = 8
subject = "مكنتش عايزة اخش"
text = "معلش انا عارفة ان اسمى مش مناسب للموضوع لكن انا بشكر فضولى اللى خللانى اخش وبشكر الكاتب وياريت بكتب زىة كتييييير و شكرا لعشرينات اصل انا عندى ورق كتتى بكرة هرمية و اكتب الورقتين دول بس"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814012015/http://www.20at.com:80/article.php?sid=493"

[[comments]]
order = 9
subject = "نصيحة"
text = "لقد سبق و قرأت منذ ما يقرب من عام كتاب العادات السبع للشخصيات الأكثر فعالية، و الحق، لقد كان لهذا الكتاب تاثيره الفعال على شخصيتي، حيث تصالحت مع ذاتى و بدات اعى ما هى رسالتى فى الحياة، وبالفعل قبل كل عمل اقوم به اضع امام عيني سؤال و هو \" لماذا افعل ذلك\" و اجابة هذا السؤال هى التى تحدد هل ساقوم به أم لا<br />نصيحتى للجميع بقراءة هذا الكتاب الأكثر من رااااااائع"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814012015/http://www.20at.com:80/article.php?sid=493"

[[comments]]
order = 10
subject = "طاهر سليم"
text = "الباشا صاحب المقال واخد اسم المقال من شركه كانت عمله على الاسم ده مشروع شكرا<br />فاعل خير"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814012015/http://www.20at.com:80/article.php?sid=493"

[[comments]]
order = 11
subject = "السفاح"
text = "لأ بجد المشروع بتاع أبدأ وعينك على النهاية جبااااااااااااااااااااااااااااااار وأنا حضرته مع أستاذ أحمد محمد"
archived = "2004-08-14"
capture_url = "https://web.archive.org/web/20040814012015/http://www.20at.com:80/article.php?sid=493"

[[comments]]
order = 12
subject = "الأخ الفاضل طاهر سليم"
text = "الأخ الكريم طاهر سليم<br />ارجو ان تقول لي اسم الشركة اللي انا واخد منها اسم المقال ومتى انشئت وما هو هذا المشروع الكبير اللي انا واخد اسمه منهم وعندي لك مفاجأة حلوة لو رديت علي<br />احمد محمد علي"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018215056/http://www.20at.com:80/article.php?sid=493"
