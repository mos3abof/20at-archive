posted = "2009-12-24"
text = "شكرا على موضوعك اولا<br />وفعلاانا اعرف ان االى بيمارس رياضه ويبطلها جسمه بيرجع يزيد تانى<br />بس كمان كل الناس بتكلم عن انظمه التخسيس<br />والناس اللابه الى نفسهم يتخنو شويه مش ليهم نصيب<br />انا نفسى فى نظام يزيد الوزن شوى مش كتير"
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124014747/http://www.20at.com:80/banat/health-and-beauty/health/12632-2009-07-13-07-43-21.html"

