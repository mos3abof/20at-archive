author = "viva"
posted = "2009-12-22"
text = "اقتباس batta:<br />تسلم ايدك<br />طيب انا مش عارفه اعمل ايه دلوقتى عشان اخس انا عندى نفس الحاله دى بالظبط نظام الرجيم والرياضه بطلتها و مش عارفه اخس انا كنت بالعب رياضه يوميا و خسيت 14 كيلو بس رجعتهم تانى و هتجنن و عايزه اخس لان حالتى النفسيه ضايعه جدا من الموضوع ده"
archived = "2009-12-23"
capture_url = "https://web.archive.org/web/20091223072734/http://www.20at.com:80/banat/health-and-beauty/health/12632-2009-07-13-07-43-21.html"

