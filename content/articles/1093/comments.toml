[[comments]]
order = 1
subject = "من فتى بجنوب البحيرة .. إلى أثينا غانية شمالها"
author = "محمد فتحي"
posted = "2006-06-28"
text = "لقد استطاع من كتب عنك و رسم ملامحك في مخيلة القراء أن يقدمك كلوحة تشكيلية متكاملة العناصر المبهرة فاستخدم قلمه كريشة فنان و إزميل نحات و تدابير ثائر.<br />فرأينا أثينا الجميلة بما منحته لها الطبيعه و ما خطتها بها عقول و أيدي عشاقها، ثم لمسنا أثينا الثائرة في وجه أعداء الإنسانية في وجه الاوطان كل الاوطان و خارجها، ثم دهشنا بأثينا الصاخبة بأشكال الفرح و البهجة و الحرية متداخلة مع صخب المهمشين و المطحونين و المتساقطين في قاع المدن جراء دوران ماكينة الرأسمالية المتوحشة<br />ثناء و شكرا لمن ارتحل إليكي أثينا فأحبك و استوعب قدر ما استطاع ما بقلبك و عقلك و أحسن تصوير ما ارتآه في ترحاله إليكي و تمنيات أن تكون تلك الكتابة الوصفية مقدمة لعمل يشبعنا بمزيد من أدب الرحلات."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132139/http://www.20at.com/article2.php?sid=998"
