[[comments]]
order = 14
subject = ""
author = "مش ححبك"
posted = "2008-11-30"
text = "وصف مصر لسيدنا عمر ابن الخطاب من عمرو ابن العاص وهو والي عليها / ولم يقل ابدا نساءها لعب<br />وصف عمرو ابن العاص مصر لسيدنا امير المؤمنين عمر بن الخطاب مصر تربة غبراء وشجرة خضراء طولها شهر وعرضها عشر يخط وسطها نهر ميمون الغدوات مبارك الروحات يجري بالزيادة والنقصان كجري الشمس والقمر له اوان تضهر به عيون الأرض وينابيعها حتى اذا اصلح عجاجه وتعظمت امواجه لم يكن وصول اهل القرى الى بعض الا في خفاف القوارب وصغار المراكب فاءذا تكاملت زيادته ن[ *** ] على عقبيه كأول مابداء في شدنّه وطما في حدته فعند ذلك يخرج القوم ليحرثوا بطون أوديته وروابيه فيبذرون الحب ويرجون الثمار من الرب حتى اذا اشرق وأشرف سقاه من فوقه الندى وغذاه من تحته الثرى فعند ذلك يدر حلابه ويغني ذبابه فبينما هي يأمير المؤمنين درة بيضاء إذا هي عنبر ة سوداء فاءذا هي [ *** ]جدة خضراء فتبارك الله الفعال لما يشاء . 000000<br />ايه يا امة الله المصرية دوري في كتب الاصول بتاعتك وورينا حكاية نسائها لعب دي جت منين"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725073536/http://www.20at.com:80/masr/t7kyk/10458.html"

[[comments]]
order = 15
subject = ""
author = "مش ححبك"
posted = "2008-11-30"
text = "يا امة الله المصرية اللي يكتب كلام لازم يقول مصدره من الاصول لان كلامك دا ما لوش اصول واؤكد انك مسيحية<br />وانتي بتقولي ان الصحابة ما كنوش بياخدوا جنود من مصر<br />طيب بصي النبي محمد صلى الله عليه وسلم قال ايه<br />) اذا دخلتم مصر فاتخذوا منها جندا كثيرين ، فهم خير اجناد الارض وهم في رباط الى يوم القيامة )<br />اذا كانت وصية النبي انهم يتخذوا جندا كثيرا من مصر يبقى ازاي بقا ما كنوش بياخدوا<br />ربنا ياخدك وياخد جميع الاقباط يا شيخة<br />كل الفتوحات الاسلامية اللي حصلت في شمال افريقا واسبانيا كانت القاعدة الاساسية فيها مصر<br />عمر ابن العاص ما قلش هذا الكلام الفارغ واذا كان النبي محمد صلى الله عليه وسلم لم يسلم من الكذب عليه وتلفيق الاحاديث الموضوعة له فهل يسلم عمر بن العاص<br />واذا كنتي مسلمة ما تردديش كلام الاقباط لو سمحتي<br />سلام"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725073536/http://www.20at.com:80/masr/t7kyk/10458.html"

[[comments]]
order = 16
subject = ""
author = "مش ححبك"
posted = "2008-12-01"
text = "ردا على مقولة (نسائهم لعب) المنسوبة لسيدنا عمر بن العاص فاتح مصر المسلمة<br />من كتاب صفحات من تاريخ مصر للدكتور حسن ابراهيم حسن الناشر مكتبة مدبولي 6 ميدان طلعت حرب<br />تحت عنوان عمرو ووصف مصر لعمر بن الخطاب<br />لما تم لعمرو بن العاص فتح مصر ارسل الى امير المؤمنين عمر بن الخطاب رضي الله عنه كتابا يصفهاله فيه ويشرح له السياسة التي سيتخذها فيها.<br />مصر تربة غبراء وشجرة خضراء طولها شهر وعرضها عشر يكنفها جبل اغبر ورمل اعفر يخط وسطها نهر حتى اذا عج عجاجه وتعظمت امواجه لم يكن وصول بعض اهل القرى الى بعض الا في خفاف القوارب وصغار المراكب فاذا تكامل في زيادته ن[ *** ] على عقبه كاول ما بدأ في شدته وطما في حدته فعند ذلك يخرج القوم ليحرثوا بجون اوديته وروابيه يبذرون الحب ويرجون الثمار من الرب حتى اذا اشرق واشرف سقاه من فوقه الندى وغذاه من تحته الثرى فعند ذلك يدر حلابه ويغني ذبابه فبينما هي يا امير المؤمنين درة بيضاء اذا هي عنبرة سوداء واذا هي [ *** ]جدة خضراء فتعالى الله الفعال لما يشاء الذي يصلح هذه البلاد وينميها ويقر قاطنها فيها ان لايقبل قول خسيسها في رئيسها وان لايستأدىخراجثمر ة الا في اوانها وان يصرف ثلث ارتفاعها في عمل جسورهاوتراعها فاذا تقرر الحال مع العمال في هذه الاحوال تضاعف ارتفاع المال والله تعالى يووفق في المبتدأ والمأل (انتهى)<br />وصف عمر مصر لعمر بهذا الكتاب<br />فلما ورد هذا الكتاب علىعمر بن الخطاب رضي الله عنه قال: درك الله ياابن العاص لقد وصفت لي خبرا كأني اشاهده<br />ومرجع هذه المعلومة من كتاب (النجوم الزاهرة في ملوك مصر والقاهرى لأبي المحاسن (جـ 1 ص 33 ـ 34)<br />يا امة الله المصرية او المسلمة الانترنت ما ينفعش في الاستدلال لازم كتب اصول زي ما انتي قلتي<br />انا جبتلك اهو رسالة عمر بن العاص الى عمر بن الخطاب موثقة من كتب الاصول والتاريخ ولم يوجد فيها نسائهم لعب<br />الكلام دا كلام صنفين من الناس (شراميط الاقباط) و(كفرة الشيعة)<br />لان عمر بن العاص حارب سيدنا علي في موقعة صفين فكلاب الشيعة يكرهونه ويفترون عليه<br />وعمر بن العاص فتح مصر وجعلها درة في جبين الدولة الاسلامية واصبحت اكبر دولة اسلامية على الاطلاق وبفضل عمر بن العاص تحولت من القبطية الى العربية ومن المسيحية الى الاسلام بنسبة 94% حسب رواية المخابرات الامريكية بقية وحثابة الاقباط يفترون على عمرو بن العاص بهذا الكلام وللاسف يردده الجهلاء والاغبياء من المسلمين والعلمانيين والمأجورين وخلافه<br />ممكن بقا حضرتك يا امة الله تجبيلي كتاب موثق عن موضوع ان الصحابة لم يأخذوا جنود من مصر وحتى صلاح الدين الايوبي<br />وازاي تم فتح شمال وبلاد افريقيا حتى الاندلس بدون جنود مصر يعني جابولها جيش منين<br />ممكن كتاب موثق عن هذه المعلومة وازاي صلاح الدين اللي كان بيحكم مصر ما كنش بياخد جيش من مصر امال كان بيجيب جيش منين<br />انا منتظر"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725073536/http://www.20at.com:80/masr/t7kyk/10458.html"
