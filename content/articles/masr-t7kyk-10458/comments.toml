author = "ابومحسن غربة 27 سنه"
posted = "2008-11-20"
text = "تسمية الانثى بالمزه في مصر دليل على ان السوقة والدهماء والشوارعية والحوش هما الذين طغوا على المجتمع المصري ودليل قاطع على انهيار القيم والاخلاق والمبادىء<br />من علامات يوم القيامه ان تهول الوعول وتظهر التحوت<br />وها هي لغة التحوت يعني الناس الحوش والحساله واللمامه<br />واللي حصل في مصر ايه بقا ان طبقة السباكين والميكانيكية والعربجية كانت طبقة تحت خالص طبقة فقراء ما لهمش حس ولا صوت وبعد تحديدا نكسة 67 مصر دخلت في عصر جديد اصبح خريج الجامعة وطبقة الموظفين مش لاقيين ياكلوا وظهرت طايفة العيال الكسيبة اللي هما الميكانيكية والسباكين والسمكرية ظهرت كطائفة كسيبة وبدأت تظهر حالات ان بنات الجامعات اصبحوا يتزوجون من هذه النوعية وبدأ خريجي الجامعات يذهبون لتعلم هذه المهن لحل مشاكلهم وظهرت معاهد تعلم خريج الجامعة السباكة والنقاشة والكهرباء حتى فيه حاجه اسمها التعليم المستمر في الجامعة فطغت اللغة السوقية على المجتمع واصبح الصنيعية والعيال الكسيبه والفوريجية هما قدوة المجتمع والميكانيكي والسباك والنقاش وخلافه عنده مقدرة على الزواج لكن خريجي الجامعات ما عندهمش اي فكرة عن هذا الموضوع<br />فالواحد الميكانيكي الفوريجي الكسيب بينقي ويختار لما يتجوز فاطلق على البنت مزه نكاية على انها للمزاج مش زوجة نصف مجتمع لا دي مزه يعني يمزمز بيها<br />لانه مش عايزها نصف مجتمع ولا شريكة حياه لا الميكانيكي بيعتبر الزوجة دي للسرير فقط لانه طول النهار قاعد في الورشة ما بيرجعش غير بالليل علشان خاطر ينام مع المزه وكان الله بالسر عليم<br />وللاسف كل بهوات وبشوات مصر الان اصلهم واطي علشان كده بيتعاملوا مع النساء كانهم مزز يعني سرير فقط اول ما يشوف الواحدة يشوفها هي مزه ولا لأ يعني تنفع للسرير ولا ما تنفعش واتخذهم المثقفين الجعانين قدوة لهم<br />وتوته توته فرغت الحدوته حلوه ولا ملتوته"
archived = "2009-07-25"
capture_url = "https://web.archive.org/web/20090725073536/http://www.20at.com:80/masr/t7kyk/10458.html"

