text = "هذا الكلام مردود عليه بكلام النبي صلى الله عليه وسلم<br />اذا دخلتم مصر فاتخذوا منها جندا كثفيا لانهم خير اجناد الارض واانهم فى رباط الى يوم القيامه<br />صدقت يا رسول الله<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />اذا كنتي مسلمة حقا فلا ترددي كلام الاقباط لو سمحتي"
