text = "طلب عمر بن الخطاب رضي الله عنه من عمرو بن العاص كتابة تقرير عن المصريين<br />فقال ارضهم ذهب و نسائهم لعب و رجالهم يجمعهم المزمار و تفرقهم العصا<br />ارجع للاصول و تحري الحقيقة و ان ثبت خطاي فلدي الشجاعة للاعتذار و ساكون سعيدة اكثر منك ان كان عمرو بن العاص لم يقولها<br />و لكن بالمرة ابحث لماذا رفض جميع الصحابة بل و صلاح الدين الايوبي اخذ جنود من رجال مصر في الجيش الاسلامي"
