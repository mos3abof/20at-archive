text = "عمر بن العاص ما قلتش كده يا الدلاعادي<br />دا مار مرقص لما جه مصر هو اللي قال كده<br />اصل مار مرقص بتاع المسيحيين برضه جه هو راخر من فلسطين مش عمر بن العاص بس هو اللي جه لا يا اختي دا الراجل بتاع المسيحيين جه هو كمان من فلسطين<br />فهو اللي قال هذه المقولة وليس عمر بن العاص<br />سلام"
