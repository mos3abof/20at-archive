subject = ""
posted = "2008-11-24"
text = "كفايا ظلم وظلام<br />دي تروح تقولها يا بابا لزمايلك في نقابة المحامين اذا كنت محامي فعلا شوف زمايلك في النقابة بيعملوا ايه وروح قولهم كفاية ظلم وظلام ما تقلهلناش احنا<br />المفروض الحكومة صرحت بمكاتب المحامين لمساعدة الاخرين في استعادة حقوقهم الضائعة<br />لكن روح بقى يا حبيبي شوف مكاتب المحامين اصبحت للنصب والدجل على اصحاب الحقوق الضائعة واصبحت لتضييع الحقوق واكل الحقوق<br />واذا كنت محامي فعلا روح نقابة المحامين وقولهم هذ الكلام<br />وطبعا هذا لا يمنع ان هناك محامين شرفاء ولكن الغالبية العظمى هم الذين ضيعوا حقوق الناس"
