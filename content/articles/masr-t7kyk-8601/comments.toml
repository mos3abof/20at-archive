[[comments]]
order = 0
subject = ""
author = "د. محسن الجمل"
posted = "2008-03-26"
text = "لا شك أن اللعبة ستغير خريطة الألعاب العالمية وستجعل خبراء الالعاب يفكرون ألف مرة قبل إبتكار وتجديد أى لعبة"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031094210/http://www.20at.com:80/masr/t7kyk/8601.html"

[[comments]]
order = 1
subject = ""
author = "سيف اليزل شوقى"
posted = "2008-03-26"
text = "هذة اللعبة من الالعاب المفضلة جدا لى ولكن الموجود منها فى الجرائد والمجلات لا يكفى استهلاكى حيث أن الجرائد والمجلات لا تنشر الا سودوكو واحد فقط وهو من النوع البسيط ولا يوجد فى اغلبة اى تعقيدات وهناك نوع اخر من اللعبة اسمة ساموراى وهو من النوع الجامد جدا ولكن عندى مشكلة فأنا لا اعرف من اين احصل علية ويوجد ايضا السودوكو الخماسى وهذا موجود ولكن ليس بكثرة<br />رجاء من يعرف اين يوجد الساموراى ياريت يقول لى علشان اخوكم مزنوق فية اوى"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031094210/http://www.20at.com:80/masr/t7kyk/8601.html"

[[comments]]
order = 2
subject = ""
author = "عطوة أبو مطوة"
posted = "2008-03-26"
text = "حرام أن الحكومة سايبة محجوب عبد الدايم دة يبرطع فى الدنيا"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031094210/http://www.20at.com:80/masr/t7kyk/8601.html"

[[comments]]
order = 3
subject = ""
author = "مفقوع أوى من الفاضيين"
posted = "2008-03-26"
text = "الظاهر إنك فاضى أوى وما فيش حاجة شغلاك وما فيش وراك غير السودوكو دة<br />ربنا هو الشافى"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031094210/http://www.20at.com:80/masr/t7kyk/8601.html"

[[comments]]
order = 4
subject = ""
author = "سودوكاوى قديم"
posted = "2008-03-26"
text = "السودوكو من الالعاب الممتعة جداً والتى ستخرج البشر من رتالبة الحياة وضيقها ، وهذا بعكس الالعاب الاخرى التى لا قيمة لها بجانب السودوكو ، فيكفى أن تلعب وتنسى الوقت وتخرج من حالة الضيق التى أصبحنا نحياها"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031094210/http://www.20at.com:80/masr/t7kyk/8601.html"

[[comments]]
order = 5
subject = ""
author = "انا بقى فاضى"
posted = "2008-03-27"
text = "اذا كان يا لوزة هو مش فاضى يا تكتبيلى عنوانك وانا اجيلك ونسلى بعض<br />بالمناسبة انا مش بحب السدووكو دى خالص<br />ياريت بقى نعجب<br />منتظر يا حلوة اذا كنت حلوة انما لو مش كدة رجاءا اعفينى وكأنى مقلتش حاجة واصل"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031094210/http://www.20at.com:80/masr/t7kyk/8601.html"

[[comments]]
order = 6
subject = ""
author = "زوجة مدمن سودووككوو"
posted = "2008-03-27"
text = "ربنا يخرب بيت اللى عمل السزووكو دة طوال النهار زوجى بيلعب اللعبة دى فى شغلة وحتى فى البيت ومبيعدش معايا خالص<br />ياريت تشوفوا لى حل"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031094210/http://www.20at.com:80/masr/t7kyk/8601.html"

