subject = ""
author = "عصام اسماعيل"
posted = "2008-03-29"
text = "لا بد من وضع وقت محدد لانهاء حل اللعبة حيث أن تركها هكذا دون وقت لا يعطى موشرا على التفوق فى الحل فلابد من وضع وقت محدد ومقنن لها وحتى تعطى اللعبة ثمارها"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031094210/http://www.20at.com:80/masr/t7kyk/8601.html"

