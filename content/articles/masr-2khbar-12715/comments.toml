author = "مش ححبك"
posted = "2009-07-21"
text = "دم الشعب هو الحل<br />دم الشعب هو الحل<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ<br />طبعا انتو عارفين ان كل دولة بتعيش على مواردها يعني مثلا في الخليج بيعيشوا على البترول وهكذا كل دولة ليها موارد بتعيش عليها<br />احنا هنا بقا في مصر يا اخوانا مفيش حل الا مص دم الشعب<br />اي والله<br />يعني مثلا الحالة اللي قدامنا دي 5000 تظلم في 100 يعني وزارة التربية هبرت نص مليون جنيه في لعبة<br />فاذا كنت عايز تكسب فلوس مفيش حل الا دم الشعب زي مثلا الممثلين اجورهم اصبحت بالملايين ودا من دم الشعب اللي بيروح يتفرج على افلامهم<br />ومثال اخر قناة موجه كومدي بيجيبوا الغاز زي المفتش كرومبو وسرحان ونفيسه وشبكة العروسة بس شرط تتصل على ارقام تليفونية معينة بتسرق الرصيد وبيعملوا ملايين من دم الشعب"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727202052/http://www.20at.com:80/masr/2khbar/12715-5-.html"

