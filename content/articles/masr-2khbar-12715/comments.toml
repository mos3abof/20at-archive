author = "شي يا حمار"
posted = "2009-07-21"
text = "الاخ اللي طور الموقع دا احب اقوله ان كل قراء ولار البلد هربوا الى مواقع اخرى ودا بفضل حمورية سعادتك<br />عمر التطوير ما يكون هبل وعبط ابدا<br />التطوير دا ليه اصوله يا حمار<br />ومت أخذنيش انا ما بشتمش انت حقيقي حمار<br />سلام يا حمار"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727202052/http://www.20at.com:80/masr/2khbar/12715-5-.html"
