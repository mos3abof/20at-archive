[[comments]]
order = 17
subject = ""
author = "رد من عاقل"
posted = "2009-12-07"
text = "اولا تعليقات الاخوة القراء مردود عليها<br />النبي محمد قال ان الخلافة الراشدة ثلاثون وينقلب الحكم الى ملك عضوض<br />صدق رسول الله<br />ومصر من اول ما بدأت منذ 7 سنه الحكم فيها وراثي ملكي وحتى في العهد الاسلامي<br />مفيش غير الحركة القرعة اللي عملها جمال عبدالناصر وهو برضه جاب انور السادات وفرضه على الناس كولي عهد والسادات جاب حسني مبارك وفرضه على الناس كولي عهد<br />يبقى ايه المشكلة لما مبارك يجيب ابنه<br />وبعدين الملك الحسن بتاع المغرب جاب ابنه يحكم والملك حسين ابنه بيحكم وحافظ الاسد بتاع سوريا ابنه بيحكم والشيخ زايد بتاع الامارات ابنه بيحكم وملك البحرين مات وابنه بيحكم<br />ايه المشكلة<br />مكبرين الموضوع كده ليه<br />وبعدين الحاكم دا وجه فقط اللي بيحكم حقيقة هو مجلس الوزراء الدةولة بتحكم عن طريق مجلس الوزراء والوزراء<br />الحاكم دا بس كده للتشريفات<br />جمال مبارك جاي لا محاله فموقفكم دا حتخلوه يفشل وكلنا حنفشل معاه<br />تفائلوا بالخير تجدوه"
archived = "2009-12-31"
capture_url = "https://web.archive.org/web/20091231031647/http://www.20at.com:80/masr/hot-topics/13749-2009-10-18-13-11-59.html"

[[comments]]
order = 18
subject = ""
author = "الوهابيون الجهلة"
posted = "2009-12-08"
text = "بتوع عدم الخروج على الحاكم حتى وان جلد ظهرك واخذ مالك<br />طيب يا جهلة الملك السعودى اتى الى الحكم ازاى مش خرج على الحاكم اللى قبلة وقاتل وحارب واستولى على البلاد حتى جلس على الكرسى وورثها لعيالة<br />طيب ولو ملك عضوض زى ما بتهبل وتقول<br />الملك بتاعنا موجود وحى يرزق وهو الملك احمد فؤاد ابن الملك فاروق ملك مصر والسودان<br />اذا كنتم عايزين الملكية<br />الملك بتاعنا موجود احمد فؤاد<br />انما ابن حسنى لا<br />لان امة انجليزية<br />وكفاية ابوة خرب البلد"
archived = "2009-12-31"
capture_url = "https://web.archive.org/web/20091231031647/http://www.20at.com:80/masr/hot-topics/13749-2009-10-18-13-11-59.html"
