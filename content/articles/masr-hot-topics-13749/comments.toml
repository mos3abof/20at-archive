subject = ""
author = "مهاتير محمد"
posted = "2009-10-18"
text = "ممكن نوظف رئيس وزراء ماليزيا السابق مهاتير محمد بعقد زى مدربين الكرة الاجانب نجيبة يشتغل بعقد 5 سنين ونشوف الوضع اية وندفع لة بالدولار زى بتوع الكرة<br />والراجل هيعمل لنا خطط بناء مصانع ومزارع ومدارس وتنمية زى ما عمل فى ماليزيا<br />ماهو ابتدا مع نظام مبارك وخلص تعمير فى بلدة وطلع معاش<br />نجيبة نستفيد منة ونشغلة رئيس جمهورية بعقد"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019144801/http://www.20at.com:80/masr/t7kyk/13749-2009-10-18-13-11-59.html"

[[comments]]
order = 2
subject = ""
author = "جيمـي"
posted = "2009-10-18"
text = "مستقبل مصر في أيد الجنرال<br />لسة مظهرش راكب حصانه مستخبي من العيون خارج دايس على الشعب وللشعب بايس مقدر وهامس لامس وحاسس وصل كالهاجس و الشعب شايف شايف وساكت ساكت وعايش كبر وبان وعلى نفسه هان فهان عليه الزمان ولما كان في عز الأوان طلع جبان وفي النا أدان حبس و لام و الشعب برده على نفسه هان مهو راكب الحصان حصان رهوان جري وشرخ وللوريث صان مهو أصله مطلعش فرس ده طلع مهرة غير كسبان … وهنقعد نحكي ونقول كان ياما كان .<br />نتكلم جد بقى ..<br />انا ضد التوريث .. لكن انا عايز حد بياخد خطوات جدية فعالة .<br />يعنى ننزل وسط الناس وأيمن نور بيعمل كدة بس متحجم جداً .. بس ممكن عن طريق أعضاء حزبه يتحرك .. وينشر التوعية فى الناس يخليهم يعملوا بطاقات أنتخابية و يعرفهم حقوقهم و المفروض يعملوا ايه ويروحوا فين لما حد يضغط عليهم .. لما حد يحاول يبتزهم علشان ياخد صوتهم .<br />لكن هنفضل نعمل مؤتمرات ما بينا وبين بعضينا كمعارضة .. طب مهو كلنا عارفين الى فيها .. يبقى مالهاش لازمة<br />الشارع وكسب التأييد هو الحل ومافيش غيره .. بس الشاطر الى يعرف يكسب تأييد إزاى ."
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019144801/http://www.20at.com:80/masr/t7kyk/13749-2009-10-18-13-11-59.html"

