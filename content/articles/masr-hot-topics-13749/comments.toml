[[comments]]
order = 6
subject = ""
author = "لاوضاع العامة"
posted = "2009-10-18"
text = "مثال صغير<br />فى مصر خمسة ملايين مشترك فى تليفونات الهيئة العامة للاتصالات اى لهم تليفون منزلى وخط<br />ثم فجاة يطلب مليون ونصف المليون مشترك الغاء خطوط تليفوناتهم من البيوت هذا الشهر<br />لماذا ؟<br />غلاء الخدمة اولا ثم سوء الخدمة ثانيا ثم الفقر ثالثا<br />الفقر<br />كان حلم المصرى ان يكون صاحب خط تليفون فى شقتة او بيتة<br />الان يتخلصون منة ويلجاوون الى المحمول الرخيص بتاع الشركات الخاصة<br />افقار الشعب هو هدف حكومة الوطنى<br />والحكومة اعلنت ان 70 فى المية من الشعب المصرى يشعرون بالظلم وزير التنمية الادارية اعلن ذلك<br />معنى هذا اية<br />ان يشعر الشعب بالظلم<br />معناة اننا امام حكومة احتلال بوجوة مصرية او حكم امنى بوليسى فاسد يمسك العصا ليضرب راس كل من يتكلم او يخرج الى الشارع<br />الرجل كبير فى السن والذى يحكم من عشر سنوات هو ابنة<br />وهذة هى النتيجة"
archived = "2009-10-19"
capture_url = "https://web.archive.org/web/20091019144801/http://www.20at.com:80/masr/t7kyk/13749-2009-10-18-13-11-59.html"

