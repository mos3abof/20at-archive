[[comments]]
order = 0
subject = "فين المشرفين"
author = "واحد والسلام"
posted = "2006-08-02"
text = "انا مش مصدق إن موقع زى ده ما فيهوش مشرفين<br />كله شتايم و قلة ادب و مسخرة<br />المفروض القائمين على الموقع ده يشيلوا القرون اللى مركبينها و يوقفوا الوساخة و الدعارة اللى بتحصل فى الموقع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113820/http://www.20at.com/article2.php?sid=1117"

[[comments]]
order = 1
subject = "الابتسامة"
author = "ريم بنت السعوديةoooooooo"
posted = "2006-08-02"
text = "العلم الان توه يكتشف ان الضحك له فوائد والنبي صلى الله عليه وسلم قد قال منذ 1427 سنة ابتسامتك في وجه اخيك صدقة وهذ ا يدل انه صلى الله عليه وسلم ماينطق عن الهوى ان هو الا وحي يوحى وهذا يدل على حرص الاسلام على المشاعر واشاعة روح الالفة والضحك بين الناس ;;;;;;;;;;;;; بعدين مالقيتو الا ها الصورة غيروها احنا في فلم والا ايش عطونا صورة تضحك تخلينا نضحك علشان تعم الفائدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113820/http://www.20at.com/article2.php?sid=1117"

[[comments]]
order = 2
subject = "اضحك الصوره تطلع حلوه"
author = "هووووووووبه"
posted = "2006-08-02"
text = "عجبني المقال يا حاجه , وانه هو اضحك وابكي , ولاحزنا ولا فرحا علي راي فيروز<br />شكرا علي المعلومات وعايزه اضيف حاجه<br />شخصيه البنو ادم علي ماقريت مره بتتجه حسب مزاجه للحاجات اللي بيختارها<br />يعني لو كئيب مثلا يختار اغاني نكد في نكد من نوعيه \" امايه يا ماه لو قادره ياما شدي الضفاير عصبني \" و كل رويات السواد لدرجه انها توصل للشيخ بتعهم بمعني كل واحد وحر في شيخه اللي بيهزر اللي بيسخر, الشديد ,اللين حسب توجه فهمنا عليا , الناس السكره التانيه حتلقيهم بردو بيشغلو هي كدا الدنيا يا خلي شوطه بتصيب وشوطه تجلي متخلاهاش كحله<br />يلا شكرا بابتسامه علي المقال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113820/http://www.20at.com/article2.php?sid=1117"

[[comments]]
order = 3
subject = "اضحك قبل الضحك ما يغلى و يتعبى ف"
author = "نيفين نيفى نوفا"
posted = "2006-08-03"
text = "الضحك اجمل حاجه ف الدنيا و لو ان النكد ليه طعم حلو احيانا حاجه ز يبقى بنو ادم كئيب<br />مش كدا و لا ايييييييه<br />وصلنى الميل بتاعك و بعتللم ميل اقرايه و طمنينى<br />طمنينى مش اقلقينى يا هبه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113820/http://www.20at.com/article2.php?sid=1117"
