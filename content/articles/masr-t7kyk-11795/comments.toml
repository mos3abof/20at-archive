posted = "2009-04-19"
text = "موضوع الكحل دة انتهى من 30 سنة فاتت<br />زمان كان انتشار امراض الرمد واحمرار العيون والعمى مرتفع جدا وكان فية اعتقاد اصلة فرعونى ان اللى بيتكحل فى اليوم دة تصبح عينية بعيدة عن الامراض<br />وانا من قرية لا يوجد فيها مسيحى واحد وكانت زوجة سيدنا بتاع كتاب تحفيظ القران هى التى تقوم بتكحيل الاطفال فى الكتاب علشان عيونهم تظل منورة وتشوف طول السنة<br />اما البصل فكان يوضع تحت المخدة ليلة شم النسيم وبعد صلاة الفجر يتم رمى البصل فى النيل مع السباحة فى مياة النيل قبل طلوع الشمس<br />طبعا كل تلك الطقوس الوثنية الفرعونية انقرضت والناس نسيت الخرافة دى"
