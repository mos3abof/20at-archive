author = "ادم المهدى"
posted = "2007-04-06"
text = "سلام عليكم<br />انا مش عارف بيحولوا يأسلموا كل حاجة ليه<br />جواز مصلحة يسموه جواز …انا اعتقد انه يسموه ايجار واحد<br />ده بقا لما يحصل مشكله بين الزرج و الزوجه يحلوها تبع قانون الايجارات مش فى محكمة الاسرة<br />مش عارف بيخترعوا هبل كل شويه و احنا مش ناقصيين<br />انا مش هاتكلم عن الحكم الشرعى بتاعه لانى مش مفتى و لا مجتهد لكن يكفى ان ربنا قال (و اخذنا منكم ميثاقا غليظا)<br />للاسف اصبحت دلوأتى فينكه"
archived = "2009-05-31"
capture_url = "https://web.archive.org/web/20090531080428/http://www.20at.com:80/nashrat-9/3491.html"

