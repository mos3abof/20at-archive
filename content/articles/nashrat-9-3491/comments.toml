[[comments]]
order = 3
subject = ""
author = "علي"
posted = "2007-04-07"
text = "الشعب السعودي ومفتية العجيبين شعب فريد من نوعه وحاله خاصة نتج عن 3 انواع من القوى وهي القبلية والفوقية والنفطية وعدت ذلك فهي عناصر تتأرجح بين هذا وذيك ويا قلب لا تحزن. العربان وفقهاء النفط الاوتوماتيك من امثال شيوخ الغفلة النجدين ازكموا صدورونا قبل انوفنا من هذا التلاعب والهراء الذي كل يوم يثبتوا انهم مفلسين علميآ واخلاقيآ فالفوقية والعنصرية بنتصيب انفسهم حملة الاسلام والرسالة واسلام غيرهم \"واصلهم فوق البيعه\" هو غير حقيقي او هجين او محرف او \"الله بالخير\" وفوق ذلك \"رشة نفط\" و \"حفنة دولارات\" اشترت الاصوات فلا ممكن ان نرى احد يتجرأ ان يرد على هالمتمشيخين وعجبي لمن يفتي بأي شي وبكل شي ابتداء من الذرة ومرورآ بالسلطة وانتهاء باعراض الناس وحياتهم و\"رقابهم\" بفتاوى الجهاز وصكوك الجنة التي لا تشترى بدم انسان بريء بحزام ناسف او رصاصة غدر وبشرط ان تحدث بسوق شعبي او بحي فقراء كما يحدث بالعراق الجريح! نصيحة اخيرة: كفوا ايديكم عن دين ودماء واعراض الناس واكفونا شركم!"
archived = "2009-05-31"
capture_url = "https://web.archive.org/web/20090531080428/http://www.20at.com:80/nashrat-9/3491.html"

