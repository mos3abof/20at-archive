author = "انفلونزا الكلاب"
posted = "2009-08-16"
text = "طيب ومالة<br />واخدت العدوى من اين ؟<br />من عند كلبها بوبى<br />ثم ان احنا مالنا وتهمنا فية"
archived = "2009-08-21"
capture_url = "https://web.archive.org/web/20090821104721/http://www.20at.com:80/masr/2khbar/12953-2009-08-16-21-15-07.html"

