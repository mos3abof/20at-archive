author = "شوطة تاخدهم كلهم"
posted = "2009-08-17"
text = "ما يولعوا بجاز<br />تطلع مين الشحرورة دى<br />فنانة<br />ما الرقاصة والمومس فى شارع الهرم بتقول على نفسها فنانة<br />اية المواضيع البايخة دى<br />وافترض ان جالها الشحار - اية المطلوب - نعيط علشانها"
archived = "2009-08-21"
