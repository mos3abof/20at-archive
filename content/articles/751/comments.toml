[[comments]]
order = 10
subject = "dead man..... :)"
author = "sweet_princess"
posted = "2006-03-07"
text = "ما فيش حاجه حصلت ولا فيه حاجه تستاهل الاعتزار<br />ايه اللي حصل يعني ..... كنت متضايق شويه (وفشيت غضبك فينا)... عادي جدا وبعدين حتى( مصارين البطن بتتخانق ) (((هو تشيبه مقرف شويه ))).... بس هو اللي لقيته يليقع الموقف دا.<br />احنا كلنا هنا زي الاخوات والله وبنتعامل بود وحب (اخوي طبعا).<br />وبعدين دا شيئ عادي اننا نختلف مع بعض في ارائنازكمان ماحدش مننا يقدر يمنعك تدخل على الموقع (ماهو مش بتاعنا).<br />واحب اديك فكره عننا :<br />اولا اكرم :<br />تعليقاته جامده جدا ومستفزه شويه ... بس لذيذه.<br />ثانيا الاستاذ دبدوب:<br />دايما بيديني احساس انه محبط لكن اراؤه هايله.... بس لو يبطل احباط.<br />ثالثا هبهوب:<br />لمضه شويه بس عسوله ومطلعه عينينا.<br />واخيرا الانسه (الست sweetprincess هانم): وزي ما انت شايف كده لمضه جدا ورغايه موت (ورخمه قوييي) بس بحبكم كلكم زي اخواتي والله.<br />وكلنا اتعرفنا على الموقع هنا(مع اني لاحظت انه اكرم ودبدوب اصدقاء من زمان) .<br />واخيرا كلنا بنرحب بيك معانا صديق واخ لشلتنا الغلبانه ( اللي بدورلها على اسم ومش لاقيه.(ايدك معانا يا اكرم ... اختار اسم لفرقتنا دي) مش انت الزعيم...!!<br />بس خد بالك عشان في اول فرصه هنعمل عليك انقلاب ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114956/http://www.20at.com/article2.php?sid=527"

[[comments]]
order = 11
subject = "نفسي أعيط"
author = "أكرم"
posted = "2006-03-07"
text = "بصوا انا هعلق على الموضوع الاول و بعدين اعيط براحتي<br />الصحافة في الانترنت جامدة و شديدة و معليهاش رقابه و اللي مش مصدق يقرا جريدة الشعب بتاعت حزب العمل اللي جمدوه ( زي الفراخ ) و وقفوا الجرنان بس الجرنان نزل على النت و صوته اعلى من صوت المعركه<br />اما عن dead man انا بقولك عادي يا شقيق زي ما قلتلك سويت مفيش اعتذار كل اللي في الموقع اصحاب و حبايب حتى عبد الله مفتاح و دبدوب مع انهم بيخانقوا بعض على طول و مبيتقابلوش في راي خالص الا انهم بيحبوا بعض و كل واحد بيفش غله في التاني<br />اما بقا عن عصابه القط الاسود اللي سويت اقترحت تعملها فانا اقترح نسميها نسميها ايه .. نسيت<br />اما عن الزعامه فانا اقترح نخليها بالاقتراع السري غير المباشر ( لازم تلمس حد قبل ما تخش جون يعني )<br />و السلام لخالو محمد اللي في السعوديه ( اول اسبوع يا ولداه في الغربه )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114956/http://www.20at.com/article2.php?sid=527"

