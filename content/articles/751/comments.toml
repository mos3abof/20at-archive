[[comments]]
order = 7
subject = "بدون عنوان"
author = "Dead Man"
posted = "2006-03-06"
text = "ـ (قلت مش هدخل الموقع ده تاني طالما هما مش قابلنى وفعلا مادخلتش بقالى كام يوم)ـ<br />الحقيقة أنا اليومين اللى فاتوا كان عندي ظروف مدايقاني شوية وغصب عني والله اتنرفزت عليكوا<br />هديت شويه ولاقيت نفسي انا اللى غلطان وقلت لازم أعتذرلكم وبالأخص أكرم عشان انا فعلا غلطت فيه وعلى فكرة الدمايظة أجدع ناس وانا ليا زمايل كتير من دمياط وكرماء جدا<br />بس أنا عشمي ان انتوا تقبلوا اعتذار الرسمي ده لكل من سببت له نرفزة وتقبلونى أخ ليكوا<br />لو مش متقبلين ده أوعدكوا مش هدخل الموقع تانى<br />وأخيرا : عندكوا حق في ان التعليق أكثر من مرة يعطى الموضوع فكرة المناظرة ويوضح الرأى والرأي الآخر<br />ما تستغربوش أنا ما عنيش إنفصام فى الشخصية ولا حاجة بس فعلا كنت بمر بظروف وحشة وطلعت غيظى فيكوا معتبركوا خواتي<br />أرجوا الرد<br />ملحوظة : نشرت كلامي هنا تاني عشان أضمن قراءته من الأعضاء وبالأخص أكرم ، سويب برنسس ، هبهوب ، دبدوب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114956/http://www.20at.com/article2.php?sid=527"

