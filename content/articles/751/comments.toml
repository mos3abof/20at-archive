[[comments]]
order = 1
subject = "أدْعوكم إلى العِـصْيان ..المستشار : طارق البشري"
author = "مصري"
posted = "2006-03-05"
text = "ولا يرد ما يحرك هذا الجمود وهذا الماء الآسن، إلا بفعل شعبى يرد من خارج الإطار الرسمى المرسوم من غير توقع ولا حساب، فيرجح كفة على كفة أو يمسك هو بزمام الأمر حتى يقضى الله سبحانه أمرا كان مفعولا. ورحم الله من قال:<br />إن وقت البذر غير وقت النبات<br />يبذر البذر ويبقى النبات موقوفا على مجيء سحابة ماطرة<br />فتخرج الأرض ما كان فيها كامنا<br />وكذلك<br />تبقى الودائع مطوية فى صدور العباد حتى يحين أوانها<br />ثم قال رحمه الله:<br />لا حجاب إلا الوقت<br />والحمد لله."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114956/http://www.20at.com/article2.php?sid=527"

