[[comments]]
order = 3
subject = "كشف المستور.....!"
author = "sweet_princess"
posted = "2006-03-06"
text = "انا بعتبر صحافة النت افضل بكتيييييييييير جدا من الصحافه العاديه اللي بقت عامله (زيسلطة البتجان)كله على بعضه والكشري جنب المحشي والموضوع بظرميط)ولذلك انا مقاطعاها تماما ... اللهم الا قله ...زي مجلة الشباب اللي بحس ان فيها مساحه شويه من الحريه(ولو كانت محتاجه تزيد شويه).<br />لكن صحافة النت بتفضح وبتكشف المستور عن ناس ما كنتش اتخيل انهم (زباله اوي كده).<br />لكن هي برضه ليها مساؤها لان بعض المواقع ممكن تفتري وتقول كلام مابيحصلش .<br />لكنها برضه اسهل من حيث انك ممكن توصل بسهوله لمعلومات عن اي موضوع يهمك او بيشغل الناس.<br />واخيرا هي برضه سلاح ذو حدين...<br />وسلام بقى عشان اتاخرت ع المحاضره."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114956/http://www.20at.com/article2.php?sid=527"

