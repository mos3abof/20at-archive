subject = "هل انهزمت الأنسانيه"
author = "كيرلس"
posted = "2006-10-14"
text = "الا توجد لعبه كيف نهزم الشر؟الا توجد لعبه كيف تكون انسان؟الا توجد لعبه كيف نعيش فى حب وسلام؟ الا توجد لعبه كيف تسعد الآخرين؟لماذا لا يوجد صراع ونزال بين الخير والشر؟؟؟لماذا تركت الساحه من اجل البحث عن الدمار والأنانيه واصبح الجميع يلهث وراء الفناء والدمار؟؟؟؟؟؟؟؟؟؟؟؟<br />كيرلس"
