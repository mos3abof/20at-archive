subject = "ما باقى الا وجه الله يا ريت نشوف مسلمين بيصرفوا 22"
text = "ما باقى الا وجه الله يا ريت نشوف مسلمين بيصرفوا 22 مليون للاسلام والمسلمين بيتهيالى هيمون الحال أفضل وهيكون عندنا أبحاث علمية متقدمة لعلاج الاعاقة"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018193115/http://www.20at.com:80/article.php?sid=669"

[[comments]]
order = 1
subject = "ما ينفعش أقول ...............الله يرحمه"
text = "كنت باحب أتفرج عليه بس ما ينفعش أقول الله يرحمه لأنه كافر في النهاية ولا أنا غلطان؟؟؟؟ لو غلطان حد ينبهنى وشكرا"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018193115/http://www.20at.com:80/article.php?sid=669"

[[comments]]
order = 2
subject = "تصحيح"
text = "يعدون حسب السي ان ان الأكثر تجربة في هذا النوع من العلاج<br />يعدون حسب السي ان انهم الأكثر تجربة في هذا النوع من العلاج"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018193115/http://www.20at.com:80/article.php?sid=669"

[[comments]]
order = 3
subject = "كفتجي"
text = "ايه موضوع الله يرحمه وكافر ومش كافر دي؟<br />ايه التخلف ده!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018193115/http://www.20at.com:80/article.php?sid=669"

[[comments]]
order = 4
subject = "وائل عباس اكسترا"
text = "وإيه يعني سوبر مان ؟<br />طب ما أنا سوبر وائل عباس<br />ده انا مقالاتي حتكسر الدنيا<br />في عربتايمز وبحزاني ودنيا الوطن وملتقى الحوار العربي<br />ولا أقولكم: روحوا على محرك البحث جوجل وحطوا كلمة وائل عباس في البحث وشوفوا الصفحات الكتيرة عن وائل عباس ."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018193115/http://www.20at.com:80/article.php?sid=669"

[[comments]]
order = 5
subject = "وائل عباس"
text = "نفسي يعدي يوم واحد من غير ما سفيه او نكرة او تافه يتطاول عليا ويقل ادبه<br />ولو ان فيه ناس صحفيين كبار قالولي انت المفروض تفرح<br />لان ليك تاثير<br />وليك خطر<br />وليك اعداء<br />وده يثبت ان ليك وجود وان رجلك ثابته على الطريق<br />فشكرا لاعدائي ..."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018193115/http://www.20at.com:80/article.php?sid=669"

[[comments]]
order = 6
subject = "لا يوجد سوبر سوى الله"
text = "السلام عليكم<br />الله وحده هو القوي ، و قد كسر الله رقبة ذلك السوبر البشري حتى نعرف ان الله على كل شيئ قدير ،و بحب اقول للاخ يا ريت تقول اللهم اهدي البشر جميعا و سيبك من كلمة كافر ..<br />لو شارون شخصيا يعلن الاسلام راح يكون احب الناس الى قلبي ، لان الاسلام يجمعنا و يفرقنا ، و لكن الانسان هو الانسان ان لم يكون مسلم ادعوا الله له ان يكون مسلم و يرفع عنه اذى الاخرة انه على كل شيئ قدير<br />اللهم اهدي البشر جميعا لما تحبه و ترضاه"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018193115/http://www.20at.com:80/article.php?sid=669"
