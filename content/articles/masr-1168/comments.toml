subject = "اة يا بلد"
author = "ايمن المصرى"
posted = "2006-11-16"
text = "اجمد يا ابو خليل . و يا جبل ما يهزك ريح . معلشى يا ابو خليل انت فى زمن ضاع فية الحق فى همجية و ظلم الباطل . و على العموم انت موجود فى لستة الشرفء مع القضاة و زكريا عبد العزيز و مكى و البسطويس و طلعت السادات كمان."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015312/http://masr.20at.com:80/article.php?sid=1168"

[[comments]]
order = 6
subject = "ابن مصر"
author = "ابراهيم عيسى ابن مصر الغالية وهو لا يكتب طمعاً فى منصب فى صحيفة حكومية مثل كلاب السلطة فكان لابد من حربة من كلاب السلطة ولكن هذه ضريبة الشرف والحرية التى تراق من أجلها الدماء ولا تحزن فدائماً المعادن الجيدة تلفظ المعدن الردئ وكل شيء له نهاية"
posted = "2006-11-16"
text = "بصراحة باابو خليل سب رئيس الجمهورية ده نشان على صدر كل مصرى يرفض الفساد وبعدين يعنى هو رئيس الجمهورية دى رئيس شرعى مهى مصر بتتحكم من 26 سنة حكم غير شرعى من رئيس قاتل وفاقد الشرعية بالتزوير والبلطجة وعمال يلعب بالدستور ومخليه حسب المقاس كل لما يزيد وزنه يزيد فى مقاسات القوانيين بتاعت الدستور وكل شيء وله نهاية لكن ابراهيم عيسى صوت الشعب وليس نباح كلب من كلاب السلطة والله مع مصر والمصريين"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015312/http://masr.20at.com:80/article.php?sid=1168"

