text = "انا قراتاالموضوع كويس وعاجبني لانه متوازن لا دفاع مستميت عن الاستاذ ابراهيم ولا تجني علي الامن كلامي كان سخرية من الحقيقة في بلدنا غايبة تماما ليه برنامج تلفزيوني بيخاطب الناس وبيقول انه شعاره المصداقية اكيد صور كل الاحداث والشريط طويل ولكن لمصلحة مين الصورة تصبح كما يريد اصحابها انا راىاذاكانالاعلام مضلل يبقي الامل فينا ضعيف اللى بيستخدموا النت عدد محدود لايؤثر واللي بيقراوا الجرائد كمام عدد قليل لو الاعلام كان حقيقي كانوا شافوا الحقية كما هي لسه في مصر ناس كتير فاهمهىاللى بيحصل من وجهة نظر الدولة"
