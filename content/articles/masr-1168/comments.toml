text = "الشعب المصرى كله معاك وخلفك وربنا معاك لاانك تدافع عن المظلومين وتكشف الفساد ربنا يكثر من امثالك لاتهتز وكن دائما بطل تدافع عن المظلومين لاانك انت وامثالك من الشرفاء فى البلد انتم املنا بعد الله عز وجل فى خلاص الامه من الفساد والاستبداد الله معاك يابو خليل"
