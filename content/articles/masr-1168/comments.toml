[[comments]]
order = 21
subject = "مواطن بسيط بس مش عبيط"
author = "مواطن"
posted = "2006-11-18"
text = "الزعيم الهارب(ظهر بعد ذلك فى حفرة جرذان!!)<br />يا صاحب حزب البعث<br />يا بايع بغداد<br />يا ناسي يوم البعث<br />على مين رسى المزاد<br />بعد ما ضيعت الدنيا بتنادى بالجهاد<br />ضيعت العراق وهربت<br />وبعت الدين والعباد<br />صدام يا ولد حسين<br />هربت ورحت فين<br />سننسى....<br />وسننسى<br />سنمد يدينا للقاتل<br />وسنطلب سلماً<br />لا بأس إن قتل أخانا<br />أو قتل أمنا وأبانا<br />سنعود وننسى<br />سنقبل يده<br />وسنطلب سلماً<br />أحببنا عيش الذل<br />وعشقنا أنات الجرحى<br />ولعقنا دمعات الثكلى<br />ونعود ونطلب سلماً<br />لا نملك غير السلم<br />لا نملك<br />لا نملك حتى الشجب<br />لا نملك غير إدانة كل شهيد<br />وسنقتل<br />سنقتل كل مجاهد<br />وسنطلب سلماً<br />سنرجو عفو الأعداء<br />سنقبل كل الأقدام<br />وسيفعل كل الشعب<br />إن رفضوا فسنذبحهم<br />قربان محبة وسلام<br />عل الأعداء يتركونا أحياء<br />فحب العيش داء<br />ولقد أحببنا العيش<br />حتى لو متنا جبناء<br />قانا(كتبت لقانا الأولى ولم تنشر فأبى الصهاينة إلا أن تنشر مع قانا جديدة!!)<br />أطفال حلوين صغار<br />راجعين من المدارس<br />بيلعبوا فرحانين<br />بدون لا جيش ولا حارس<br />بينهم ولد صغير جميل وأسمه فارس<br />شافوا طيارات<br />شاورولها بالتحية<br />رموا عليهم حاجات<br />أفتكروها هدية<br />أتاريها كانت قنابل<br />تقتل كل حي<br />قتلت صوت البلابل<br />ما فضلش حد حى<br />فينكم يا عرب؟؟؟؟؟؟؟؟؟؟؟؟<br />فينكم يا مسلمين؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />لما أمل حياتنا<br />قتلوه المجرمين؟؟؟؟؟؟؟؟؟؟؟<br />القمة العربية(عبادة الشيطان)<br />فلنرقص رقصة يا ويكا<br />ولنعبد ربنا أمريكا<br />لا غير كلينتون يحمينا<br />نعجات نحن ونتنياهو راعينا<br />لا نرجو غير كراسينا<br />ونرقص رقصة<br />ويضيع الأقصى<br />ولنجلس حول الطا<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
