subject = "انشاء الله منصور"
author = "habiba"
posted = "2006-11-16"
text = "العالم دى لا بتختشى ولا بتحس انسان محترم وطنى شريف حر بيتكلم بصوت مسموع من خلال جريدة لان ده دور كل الصحفيين وهو توعية الناس على المفسدين الفاسدين عايز الناس تاخذ حقها بالعدل ما بيعملش حاوى ويطلع مستندات يساوم بيها ولا صفقات من تحت الترابيزة ولا بيركب الطائرة العجيبة علشان كده بيحربوه ربنا يهدهم واسم النبي حرسه ابو حطب محامي ازاى ده تلاقيه علي ما يروح بيتهم في الوراق يكون عدى علي عشرين حفرة وكام بلاعة دى اساسا مافيهاش صرف صحي اجرى يا راجل قبل الليل ما يليل اشترى من الاخزخانة علبة ايزالو"
