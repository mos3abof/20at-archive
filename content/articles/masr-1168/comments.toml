subject = "هو ابراهيم دة من الزمن دة"
author = "المصرىاوى"
posted = "2006-11-15"
text = "واللة لا اصدق ان ابراهيم عيسى ابن هذا الزمن الردئ00اعوام واحقاب مرت على المصريين حتى تدجنوا 00وتقوقعو وخابو<br />وييجى الاخ دة يتكلم بلسان المناضلين000تعرفو المصطلح دة؟؟؟؟؟؟؟؟؟<br />كانة اتى من زمن اخر ومن عالم اخر ليصرخ ويستنهض000 ولكن صراخ فى خواء القبور0<br />اللة يقوبك يا ابراهيم يا حبيبى00<br />0"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015312/http://masr.20at.com:80/article.php?sid=1168"

[[comments]]
order = 2
subject = "عاشق الحريه ابراهيم عيسي"
author = "حمدي"
posted = "2006-11-15"
text = "الشيء الي بيخليني احب ابراهيم عيسي وفي نفس الوقت بيغظيني منه هو ان لما بشوفه بحس انه انسان حر بمعني الكلمه وبيستمتع بحريته رغم كل انواع الكبت والقهر في مجتمعنا ... وكانه احساسه بالحريه شيء موجود معاه ولا يتاثر بالمحيط اللي حواليه<br />كلامي مش مفهوم مش مشكله ... اصلا وجود صحفي زي ابراهيم عيسي في الزمن ده شيء مش مفهوم"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015312/http://masr.20at.com:80/article.php?sid=1168"

[[comments]]
order = 3
subject = "آخر الرجال المحترمين"
author = "بيبو"
posted = "2006-11-15"
text = "بجد انا اعجابى بالاسطورة التى تسمى عيسى يزداد يوما بعد يوم ... وذلك لان ليس مجرد مناضل أو يسارى فحسب وانما لانه فعلا آخر الرجال المحترمين بكل ما تحتويه الكلمة من معان ... فهو لم يهادن مطلقا وهو فى اشد المحن \" مش زى ناس بقت مليونيرات وبرضه امسهم معارضه \" بكرى وحمودة وسعيد عبد الخالق و ... \" أقول ولا كفاية<br />وعلى فكرة لولا ان النظام جبان خايف من كلمة حق بيقولها الراجل كان سجنه وبالمناسبة مش اول مرة يمزق العلم ولا نسيت يوم الاستفتاء الاسود على الدستور وهتك عرض الوطن وصحفياته والعلم .. نسيتو<br />ولا ايه<br />وفى الاخر عاوز اقول لعيسى ... سر بالقافلة ودع الكلاب تعوى"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015312/http://masr.20at.com:80/article.php?sid=1168"

[[comments]]
order = 4
subject = "حكمت المحكمة بالبرأة على المدعو إبراهيم عيسى لأنه كاتب نقدىومثقف مبدع"
author = "مصطفى"
posted = "2006-11-15"
text = "إن الكاتب و الناقدالعظيم إبراهيم عيسى هو إنسان جميل فى الزمن الردىء. كتاباته الناريةوالصادقة لابد وأنهاضايقت وأقلقت بشدة أعداء الحريةوالكرامةالإنسانية،فسعوا إلى شل طاقته و وضع العراقيل فى طريقه.وأنا لا أفهم كيف يقبل قاضى على نفسه أن ينظر فى قضية سخيفة و خالية من المعنى إلى هذه الدرجة! لو كنت مكان القاضى،لحكمت بالبرأة من أول جلسة."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015312/http://masr.20at.com:80/article.php?sid=1168"

