[[comments]]
order = 13
subject = "العاشرة مساءا"
author = "بسمةا"
posted = "2006-11-17"
text = "استاذ احمد لقد ارتكبت خطا فادحا بالتجني علي الامن وبكرة يظهر لك من شرفاء مصر وهم كثيرون وها يخاصموك من مواد الدستور المصرى المادة الشهيرة الصورة تكذب الغطاس في العاشرةمساءا شوفنا بعيينا اللي ها ياكلهم الدود العلمين الي حضرتك ذكرتهم بل ان المصور ركز عليهما وهما برفرفوا في القاعة واكيد سمعت تعليق ابراهيم عيسي في التقرير الفرق بين تعليقة الصبح في الجزيرة وما سمعناه في العاشرة مساءا والصورة تكدب الغطاس هو انة علي ما غطس من الجزيرة حتي وصل العاشرة مساءا كان نفسه اتقطع كمان ركز التقرير علي ما قاله المدعي العام اللي هو بتوع الدستور لسه ما خافوش ولسه بيكتبوا اللي هما مقتنعين بيه بطلوا بقي كل حاجة الامن الامن ده والله بيتعب علشانكم يا حاقدين ربنا ينصرك عليهم يا استاذ ابراهيم و ينتقم من الظالمين"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015312/http://masr.20at.com:80/article.php?sid=1168"

