subject = "مبدع"
author = "معاذ محمود عامر"
posted = "2006-11-16"
text = "هناك الكثير في مصر من هم مثل ابراهيم عيسى فمصر ولادة<br />لكن ابراهيم عيسى استطاع أن يبرز ويأخذ وضعه في قلوب المصريين<br />فابراهيم عيسى صحفي مبدع<br />بمعنى أنه استطاع أن يصل للناس بجريدته دون الوقوع في فخ الشعبوية<br />وبقيت الدستور جريدة الصفوة المثقفة وجريدة العوام من المصريين وجريدة الشباب أيضا"
