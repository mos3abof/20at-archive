[[comments]]
order = 15
subject = "كفر الباشوات --- ومولانا ابو البركات"
author = "زوبه الكلوباتيه"
posted = "2006-11-17"
text = "اعرفكم بنفسى// ابو الوفا الهريات /المحامى بالا ستئناف ومجلس الدوله وباحث دكتوراه فى القانون المدنى والجنايات// وبعد الظهر سمسار اراضى وعقارات وسيارات/وعندنا المرضعه والمربيه والخادمه للمسنين والمسنات /وقد قررت اناوابناء حتيتى ولاد البلدالمجدع والفتوات// وكمان معانا شوية اغاوات على افنديه وبهوات// نرفع قضية الموسم اللى جاى مش اللى فات//على المدعو ابراهيم عيسى صاحب المقالات والمهاتارات//بدعوى القذف والسب العلنى لصاحب المقامات//مولانا وسيدنا وتاج راسنا عمدة كفر الباشوات //الشريف الحسيب النسيب محمد حسنى ابو البركات// حيث ورد فى جريدة الدستور مانشت من افظع المانشتات//وخبر تحته صوره لطفل هدومه مقطعه وجنبوه واحد شحات// وخبركاذب بيقول ان ده حال اغلب سكان كفر الباشوات //وان المجارى على طول طافحه ولا فى صرف ولافى بلااعات//وان المياه مادخلتش الكفر والناس بتشرب من الترومبات//وان الكهربا مبتدخلش لاهل الكفر غيرباالرشوه والمحسوبيات// وان المسائل كلها ماشيه عندنا على طريقة خد وهات //وياريت على كده وسكت؟لأ؟ده جنى جنايه من اعظم الحرمات// انه جاب بالاسم والصوره--- سيرة مولانا ابو البركات// وادعى انه هوالس%"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015312/http://masr.20at.com:80/article.php?sid=1168"

