text = "السلام عليكم ورحمة الله تعالى وتبركاته .<br />المسجد مكان مقدس يا ناس و له حرمات فبالله عليكم هل يمكن تصور بيت الله عز وجل مكان للرياضة فعلا اذا لم تستحي فاصنع ما شئت .ماذا اقول لا حول و لا قوة الا بالله الله يسامح الجميع"
