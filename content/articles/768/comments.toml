[[comments]]
order = 22
subject = "الدقة في التعبير"
author = "عبد الله"
posted = "2006-08-31"
text = "السلام عليكم ورحمة الله وبركاته<br />أولا : انا مش هفتي هنا بإن الموضوع ده حرام ولا حلال لإني لست أهلا للفتوى ، ويا ريت يا جماعة ما حدش يفتي بوجهة نظره غير لما تسألوا أهل العلم<br />ثانيا : بالنسبة للأخت اللي عرضت الموضوع يا ريت بس تبقى دقيقة في الوصف لإني اعرف مسجد الحصري في العجوة والجزء اللي بيصلوا فيه النساء هو مش المسجد دا مكان ملحق بالمسجد ويكاد يكون منفصل عن المسجد إلا بوجود حائط مشترك<br />ثالثا : أنتو لو تعرفوا يا جماعة ما مدى نشاط المحفظات اللي هناك واد ايه المجهود المبذول عشان يخرجوا نساء خاتمات للقرءان هتقدروا اد ايه كم التعب اللي بيتعبوه يكفي اقولكم إن فيه بعض المحفظات أصابهم بعض المشاكل في الظهر بسبب الجلسة اللي بيجلسوها لساعات طويلة فكان طبيعي إنهم يمارسوا حاجه زي كده من اجل الاستمرار<br />يا جماعة المحفظات تقريبا كل شهر بيخرجوا للمسلمين حوالي 20 خاتمة للقرءان<br />بدل ما ننقد ونتكلم كده نحاول نقدم ما يساعدهم على الاستمرار على الأقل الدعاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123109/http://www.20at.com/article2.php?sid=1150"

