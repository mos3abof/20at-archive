[[comments]]
order = 11
subject = "بطلوا عقد ...دة هو الصح بعينه"
author = "روضه عبد الحميد"
posted = "2006-08-25"
text = "دة صح جدا<br />المسجد اساسا كان ايام الرسول صلى الله عليه وسلم كان للحياة كلها كانوا بيعقد القران فيه يعنى يقيموا الاعراس وكانوا يربطوا الاسرى فى اعمدته يعنى سياسه وكانت الخطب والدروس والخطط واستقبال السفراء والاقوام وووووو<br />يعنى من الاخر الشيخ كان هايل انه مرضاش يرد عشان عارف ان فى ناس مخها تعبان كتير ؛ثم حد قالكم انه جاب لهم راقصه؟؟؟<br />دول بيمارسوا رياااااااااااااااااااااضه<br />والمؤمن القوى خير واحب الى الله من المؤمن الضعيف.<br />ياريت نبطل العقد والتفكير بطرق مغلقه .\"اللهم ارينا الحق حق وارزقنا اتباعه والباطل باطل وارزقنا اجتنابه؛وانر عقولنا للفهم\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123109/http://www.20at.com/article2.php?sid=1150"

[[comments]]
order = 12
subject = "مش احسن من اى حته تانية"
author = "شيماء"
posted = "2006-08-25"
text = "السلام عليكم يا جماعه<br />زى ما قال ربيع ان المسجد كان نقطة انطلاق الاسلام<br />و بعدين دلوقتى مبقاش فيه مسجد لوحده منفرد .. بقى مجمع اسلامى فيه المسججد و هو يعتبر صحن المسجد و مكان الصلاة و اماكن زى مستوصف و اماكن لتعليم القران و الدروس الخصوصية و الكمبيوتر ..مقلناش على دول ليه ؟؟ ايه ده<br />مجوش يعنى فى صحن المسجد و بصوت عالى و قالوا هوب هوب واحد اتنين<br />يا جماعة حكموا عقولكم .. الدين عمره ما منع الرياضة بل فيه امر بالرياضة بتعليم الفروسية و الرمى<br />وزى ما الاخ -انا اسفة مش متذكرة الاسم - كانوا بيتصارعوا قدام الرسول عليه الصلاة و السلام<br />والأخت الكاتبة .. حضرتك كتبتى المقال بشئ من المهاجمه .. ارجو ان نكون موضوعيين اكتر من كده<br />وشكرا جزيلا<br />على فكرة مسجد الصديق فى الشيرتون ..بقاله سنيين فيه جيمنزيوم بيتحدد يوم رجال و يوم سيدات<br />مقلبوش على الناس اللى بتدى دروس فيه زى صبرى عبد الرؤوف (عالم ازهرى ) و لا خالد عبد الله ولا اى حد منهم ليه ؟؟<br />ولا هو هجوم على اى شيخ من الشيوخ و لا الدعاة صغار السن<br />ولا حول و لا قوة الا بالله العلى العظيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123109/http://www.20at.com/article2.php?sid=1150"

[[comments]]
order = 13
subject = "معلومه"
author = "احمد"
posted = "2006-08-26"
text = "هل تعلمون ان الصلاه في حد زاتها رياضه<br />ولكن هل تعلمون ما راي الدين فيما قالته الاخت بدون ان نجعل منها عميله او صهيوني<br />هل تعلمون ان من قال لا اعرف فقد افتى<br />هل تعلمون لما لم يجيب الشيخ على اخر سؤال الي الاخت صاحبه الموضوع<br />ماذا تعلمون؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123109/http://www.20at.com/article2.php?sid=1150"

[[comments]]
order = 14
subject = "لاحول ولاقوة الا بالله"
author = "سليمان"
posted = "2006-08-26"
text = "ابغا اسئل<br />ليش بنيت المساجد !!<br />للصلاة لذكر الله لتلاوة القراءن الكريم<br />غيرهذه الامور مثل التجارة أو السؤال عن شيء ضائع وغيرها فلايجوز<br />المساجد دار عبادة نتفق على هذا وليست دار لعب والعياذ بالله<br />في سورة النور قول الله تعالى ( في بيوت اذن الله ان ترفع ويذكر فيهااسمه يسبح له فيها بالغدو والاصال . رِجَالٌ لا تُلْهِيهِمْ تِجَارَةٌ وَلا بَيْعٌ عَنْ ذِكْرِ اللَّهِ وَإِقَامِ الصَّلاةِ وَإِيتَاءِ الزَّكَاةِ يَخَافُونَ يَوْمًا تَتَقَلَّبُ فِيهِ الْقُلُوبُ وَالأَبْصَارُ ).......<br />ورد في الحديث الصحيح<br />قال عليه الصلاة والسلام: \"من أحدث في أمرنا هذا ما ليس منه فهو رد\" [رواه الإمام البخاري في \"صحيحه\" (ج3 ص167) من حديث عائشة رضي الله عنها]، وفي رواية: \"من عمل عملاً ليس عليه أمرنا فهو رد\" [رواه الإمام مسلم في \"صحيحه\" (ج3 ص1343 ـ 1344) من حديث عائشة رضي الله عنها].<br />وقال عليه الصلاة والسلام: \"وإياكم ومحدثات الأمور؛ فإن كل محدثة بدعة وكل بدعة ضلالة\" [رواه الإمام أحمد في \"مسنده\" (4/126، 127)، ورواه أبو داود في \"سننه\" (4/200)، ورواه الترمذي في \"سننه\" (7/319، 320)؛ كلهم من حديث العرباض بن سارية].<br />بل وورد بالحديث<br />قال رسول الله صلى الله عليه وسلم من سن في الإسلام سنة حسنة فعمل بها بعده كتب له مثل أجر من عمل بها ولا ينقص من أجورهم شيء ومن سن في الإسلام سنة سيئة فعمل بها بعده كتب عليه مثل وزر من عمل بها ولا ينقص من أوزارهم شيء ))......<br />انما جعلت المساجد لماذا !!<br />هذا السؤال ؟<br />للصلاة للصلاة للصلاة ولذكر الله .<br />فلاحول ولاقوة الا بالله<br />ssmo11@yahoo"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123109/http://www.20at.com/article2.php?sid=1150"

[[comments]]
order = 15
subject = "رأي الدين"
author = "مسلم احمد"
posted = "2006-08-29"
text = "كان رسول الله صلي الله عليه وسلم يأخذ عائشة رضي الله عنهاللمسجد لكي تشاهد الحبشه ( الصبيان ) وهم يلعبون بالرماح في المسجد.<br />وبالتالي لا ضرر من لعب النساء او الرجال الايروبكس في المسجد بشرط التزام النساء بالزي الشرعي الاسلامي في المسجد وعدم مشاهدة الرجال لهم وايضا بالنسبة للرجال عدم لبس زي يظهر العورات.<br />لكن هنا امر مهم جدا المسجد ارضه من الموكيت ومصروف عليه مال كثير وبالتالي العرق والروائح المنبعثه منه تثير اشمزاز المصليين فيفضل ( رايي الشخصي ) ان تحصص غرفة في المسجد لمثل هذه الامور."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123109/http://www.20at.com/article2.php?sid=1150"

[[comments]]
order = 16
subject = "يا شباب"
author = "قصيره الجمجمه"
posted = "2006-08-29"
text = "رِجَالٌ لا تُلْهِيهِمْ تِجَارَةٌ وَلا بَيْعٌ عَنْ ذِكْرِ اللَّهِ<br />وَإِقَامِ الصَّلاةِ وَإِيتَاءِ الزَّكَاةِ يَخَافُونَ يَوْمًا<br />تَتَقَلَّبُ فِيهِ الْقُلُوبُ وَالأَبْصَارُ ).......<br />ورد في الحديث الصحيح<br />بالإذن من أخي سليمان بالإقتباس :<br />ع وقت الرسول صلى الله عليه وسلم كان<br />الأطفال يدرسون ب مساجد الله 000<br />الآيروبكس تنشط الروح وتهذب النفس ولا<br />أرى أنها تنطيط ولهو00<br />ولا أرى حرمه في ذلك00 إلا من ناحيه واحده<br />وهي( التجاره ب المسجد وفي المسجد! ! ؟ )<br />فالكاتبه ذكرت أنه يأخذ أموالاً رمزيه ! ! !<br />لا يصح المتاجره في بيت من بيوت الله<br />وإستغلاله ؟<br />وشكراً"
