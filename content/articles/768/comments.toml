subject = "يا ناس أفهموا"
author = "اسكندراني"
posted = "2006-08-25"
text = "يا ناس النبي صلي الله عليه وسلم كان يري الأحباش وهم يتصارعون بالمسجد<br />اليست المصارعة رياضة<br />اكيد الشيخ محمد حامد له وجهة نظر معتبرة بخصوص هذا الأمر<br />فأرجو من الشباب والبنات تكبير الدماغ يعني أعقلوا وأفهموا أمور دينكم لأننا هنضيع إذا ما فهمناش<br />جزيتم خيرا"
