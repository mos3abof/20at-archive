text = "و دي فيها ايه ؟ زمان في عهد رسول الله (ص) كان الصحابة رضوان الله عليهم يتسابقون في المسجد في غير أوقات الصلاة و في حضور رسول الله (ص)و يتغالبون (يلعبوا جودو)يوقع بعضهم بعضا و يتسامرون في أدب كنوع من الرياضة البدنيةفيستفيدون بدنيا و يتعلمون حفظ الأدب حتى في اللعب وطالما المحفظات بيبقوا لوحدهم في المسجد و محدش راجل شايفهم يبقى خلاص فيها ايه ؟"
