text = "اول حاجة صلوا على النبى .<br />اول حاجةالايروبكس دى رياضة واحنا كلنا متفقين على كدة يعنى هما بيمارسوا رياضة فى المسجد والناس اللى بتقول انى كدة هما هيحولوا المسجد لنادى انا عايزة اقولهم حاجة انى الصحابة كانوا بيمرسوا رياضة المبارزة والمصارعة فى المسجد وبعدين العقل السليم فى الجسم السليم يعنى مافيهاش حاجة لما يمارسوا الايروبكس فى الجامع ودة على حد علمى فى الدين والله اعلم"
