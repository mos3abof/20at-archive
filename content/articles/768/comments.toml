subject = "الرياضه غذاء العقل"
author = "جوجو"
posted = "2006-09-02"
text = "الرياضه شى موصى بايه فى الشريعه الاسلاميه وليه نبص للموضوع من نحيه التافه ومش نبص ليه من ناحيه فيما بعض انه يكون تشجيع وكتير من السيدات بضيع وقتها فى نوادى وكلام فادى طيب مضيع وقت فى رياضه مع اخوه مسلمين وكمان تشجيع على التواجد فى المسجد باكبر وقت والنواجد مع اخوات مسلمين يعنى تشجيع على التقرب من الله وانا شايفه انها فكره راعه طلما مفاش شى يغضب الله عز وجل<br />وياريت كل شخص مايتفوهش بكلمه طلما مش فاهم اى شى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123109/http://www.20at.com/article2.php?sid=1150"

