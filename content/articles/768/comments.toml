subject = "اللهم عز الاسلام والمسلمين...."
author = "يارب اكون زيهم"
posted = "2006-08-24"
text = "يا اخوانى واخواتى والله انا شايفة انها حاجة جميلة جدا علشان بكده يشجعونا احنا كمان ويعنى هن لما تعبوا وحفظوا القران ماتكلمتوش وجايين تتكلموا فى حاجة هى اصلا مش حلرام حتى لو سألتوا اي شيخ او مفتى...المهم هما عملوا حاجات فى حياتهم ماشاء الله الدور والباقى علينا احنا عملنا ايه فى حياتنا غير اننا بنستنى نشوف اي حاجة جديدة كويسه او وحشه ونقعد نعلق عليها وخلاص ...ناس فاضية مش ورانا غير كده..حاسبوا انفسكم قبل ان تحاسبوا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123109/http://www.20at.com/article2.php?sid=1150"

