text = "انا يا شوشو مش من الشيوخ ولا حاجه<br />بس لو انتي راجل واللي جابك راجل قول اسمك ايه وخلينا نتكلم وجها لوجه ياصهيوني<br />** احنا عندنا ليك هديه عايزين نوصلها لك<br />ياريت لو انت راجل بشنب قول اسمك ايه<br />*** هو مش المفروض ان اي حد بيكتب موضوع بيسيب اسمه<br />ليه مش كاتب اسمك علي سؤال التصويت يا عميل<br />انت راجل انت ؟؟؟؟؟"
