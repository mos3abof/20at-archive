subject = "ايه المشكلة"
author = "ربيع"
posted = "2006-08-24"
text = "ايه المشكلة ان المحفظات تمارس الرياضة هما مش بشر<br />وايه المشكلة انها تكون في المسجد؟<br />المسجد مش بس دار عبادة؟<br />المسجد هو نقطة انطلاقة المسلم<br />والاخ او الاخت الي قال حراااااااااااام واين انت يا رسول الله؟<br />انت هتفتي طب ايه دليلك ؟"
