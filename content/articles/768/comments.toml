[[comments]]
order = 30
subject = "اللهم اهدينا"
author = "حمادة"
posted = "2006-10-03"
text = "اللهم لا تؤاخذنا ان نسينا او اخطأنا<br />يا انسة الرياضة اللى لا تتعدى حدود الدين والاسلام ليست حرام وممارستها فى المسجد ليس بغريب<br />المسجد هو بيت الله<br />وبيت الله هو بيت المؤمن المخلص لربه<br />وهذا المؤمن من حقه فعل مايريد فى بيته بما انه مخلص لربه ولا يتعدى حدود الله<br />اسأل الله ان يهديكى ويهدينا جميعا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123109/http://www.20at.com/article2.php?sid=1150"
