subject = "انفلونزا الطيور"
author = "محمود مرواد"
posted = "2006-02-21"
text = "والله يا مصري انا خايف عليك بس على فكرة ده وأد للمصريين فعلا وحسبنا الله ونعم الوكيل والحمد لله على كل شيئ وربنا يصبر اهل الضحايا نتكلم على فيلم الطيور ده كمان اللي طلع لينا في البخت والله احلى حاجة قيلت في الموضوع ده وعجباني اوي هو:\"بالبط والوز يبنى الناس أجسادهم، لم يبن جسد من فجل وكرات\" يا سيدى جت على الفرخة اللي الواحد بياكلها ده الشعب المصري ياما شاف وياما هيشوف وزي مابنقول معدة بتاكل الظلت ولا ايام حرق قش الأرز والدخان النقي اللي كنا بنشمه يا سيدي فكك بأى بس أقولك حاول تحافظ على نفسك من الموضوع ده بجد وربنا معانا..........."
