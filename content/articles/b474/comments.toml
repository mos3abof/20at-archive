[[comments]]
order = 0
subject = "وما تلك بالنهاية يا مصري؟"
author = "مصري"
posted = "2006-02-20"
text = "جريمة غرق العبارة السلام 98 وغرق ألف شخص في البحر الأحمر ينطبق عليها وصف: وأد المصريين أحياء في قاع البحار. العدل فيها: الجزاء من صنف العمل. الوأد فعل جاهلي ماضي يقــع في نظام جاهلي حاضر. نظام لا يعرف من التحضر إلا أفخر الثياب، وأطيب الأكل وأفخم القصــــــور، وحسن التعامل مع الصهاينة وخفـــــض الجناح للأمريكان. نظام لا يعرف من العدل إلا إنصاف ذويه، ومن المسؤولية إلا ما يحقق مصالحه، ومن الرحمة إلا محاباة القربي والمحاسيب. وأد المصريين في قاع البحر ليست الجريمة الأولي في نظام مبارك، لكنها الأخطر، لأن حياة المصريين ضاعت بسبب الإهمال المتعمد، وفقدت الجثث بسبب التقاعس والتباطؤ. هل رأيتم في العالم نظاما أكرم من نظامنا؟ يجود بابنائه طعاما لأسماك القرش!<br />كم منا ثار واعتصم وطالب بالقصاص لما حدث وما يحدث؟ وما سوف يحدث؟ وما تلك بالنهاية يا مصري؟ من قبل، وئد المواطن عبد الحميد شتا في قاع النهر، فهو الشريف ابن الفقير غير لائق اجتماعيا لوظيفة خارجية نظام النبلاء الساقطين من أرحام أمهاتهم، وفي أفواههم ملاعق من ذهب، وملتحفين بلباس من سندس وإستبرق. ومن بعد، وئد المصريون الصعايدة في محرقة القطار ألوفا مؤلفة. ومن بعد بعد سقوط الطائرة المصرية في قاع المحيط الأطلنطي بعد إقلاعها من الولايات المتحدة الأمريكية، وعلي متنها أربعون من خيرة قيادات القوات المسلحة. والوأد في عربات الترحيلات وفي السجون وغير ذلك كثير، والذكر هنا علي سبيل المثال لا الحصر، ثم لم يحرك النظام ساكنا ولم يرح متعبا. تبت يد القاتل وتب، فليصل نارا ذات لهب، تحرق فلذة الكبد وتيتم الولد. لو شعر القاتل أن هناك من يحاسبه ما جرؤ علي ارتكاب جرمه. أهو العيب في صاحب الحق الذي فرط فيه بالصمت! أم العيب في حاكم مستبد اغتصب حقوق الشعب!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112643/http://www.20at.com/article2.php?sid=474"

[[comments]]
order = 1
subject = "أنا اتعقدت"
author = "ايه يا مصري عقدتنا في عيشتنا. قول الحمد لله . احمد ربنا انهم سايبينك من غير مايحبسوك و لو إني أشك انهم هيسيبوك بعد الكلام اللى قولته ده (سلومة الأقرع مايعرفش أخوه)."
posted = "2006-02-21"
text = "أنا رأيي تدعى لمصر و المصريين أولا بالهداية علشان يشووفوا النور لبلادهم ، و ثانيا بان ربنا يحمي مصر و البلاد العربية من الأوبئة و الكوارث اللى هي أكيد ابتلاء من ربنا نتيجة لتقاعسنا عن اخوانا في العراق و فلسطين و سائر البلاد التى يهان فيها المسلمون علشن بيقولوا ربي الله ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112643/http://www.20at.com/article2.php?sid=474"

[[comments]]
order = 2
subject = "قلبتو عليا المواجع"
author = "sweet_princess"
posted = "2006-02-21"
text = "والله انتو عقدتوني :<br />((ااااااااه اهئ اهئ )<br />انا هموت على فرخه ماكلتهاش من شهرين ممنوعه من بيتنا من زمان وحشني شكلها لدرجه ان اخويا قالي هجيبلك فيلم تسجيلي عنها تتفرجي عليه وتعيطي براحتك فبل ما يغلي هو كمان زي اللحمه اللي بقت ناااااااااااار ولسه والله انا دلوقتي بالنسبه لي دلوقتيصوت اي ديك بيدن او فرخه بتكاكي احسن ما اي صوت تاني لدرجة اني بفكر اسجل لهم شريط اسمعه كل ما يوحشوني ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112643/http://www.20at.com/article2.php?sid=474"

[[comments]]
order = 3
subject = "الله يا مصرى"
author = "نيفين"
posted = "2006-02-21"
text = "اولا يقول للمصرى عود احمد لان و حشتنا التعليقات الجامده دى<br />و انا علقت قبل كده تعليق كبيييير اوى عن العباره و مش هعيده<br />حسبنا الله و نعم الوكيل و الموضوع هيتنسى زى موضوع بنى سويف<br />امبارح ف القاهره اليوم كل الناس كانت بتتصل بعمرو اديب و تقولله بلاش موضوع النفلونزا دا ينيسينا موضوع العباره بس ابقو قابلونى<br />يا جماعه الموضوع كبير و فيه لعب كتير و تعتيم واضح و متعمد<br />و انا بحب اسمع اغنيه وائل كفورى تبكى الطيور و اهديها تانى لكل الطيور المصابه بالنفلونزا مع تمنياتى لها بالشفاء العاجل<br />محناش ناقصين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112643/http://www.20at.com/article2.php?sid=474"

[[comments]]
order = 4
subject = "يوميات مواطن مفروس"
author = "مصري"
posted = "2006-02-21"
text = "جايز أن السيد الرئيس يري أن هذه السلع خاصة بالأغنياء فقط يعني محدودي الدخل وسخين لا مؤاخذة، لا بيستحموا ولا بيغسلوا هدومهم، عايزين بقي الصابون والمنظفات ليه؟ وبعدين بياخدوا السكر يطفحوا بيه شاي وزفت طول النهار لما قلبهم نشف، وجالهم السكر، وبعدين النسوان بتوعهم بيستخدموه استخدام منيل بستين نيلة، مع أنه المفروض يتعمل بيه جاتوه وآيس كريم وحاجات راقية، أما بالنسبة للزيت ورغم أنه من المواد سريعة الاشتعال، إلا أن النسوان طول النهار تتهبب علي عينها وتقلي بيه طعمية وبذنجان، وبعدين في الآخر تحدف جوزها بيه وكمان بيحطوه في شعرهم مع أنه نعمة ربنا، يعني خسارة في جتتهم.<br />ويبدو أيضا أن تصريح السيد الرئيس لا مؤاخذة يعني يا ريس.. وانت بنفسك قلت أكثر من مرة أنه مافيش قلم اتقصف في عصرك.. صحيح اتقصف رقبة صاحب القلم.. إنما القلم سليم والحمد لله، سليم بينك وبين الحكومة، يعني لما الرئيس يقول محدودي الدخل في قلبي تضربهم الحكومة علي قلبهم وتفقرهم كمان وكمان، ولما يقول انهم في عينه، يقوم العادلي يخزق لهم عنيهم، خصوصا أن الحياة كده كده سودا، أما بقي إذا قال إن محدودي الدخل في قلبه وعنيه، شيعتهم الحكومة علي الآخرة عدل.. ولذلك. نستحلف الرئيس، بكل المقدسات، وبحق جاه النبي.. أنه ما يحطناش في قلب اهتماماته.. وأهه احنا كده كده متنيلين علي عينا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112643/http://www.20at.com/article2.php?sid=474"

[[comments]]
order = 5
subject = "يا ريتني طير و اطير حواليك"
author = "أكرم"
posted = "2006-02-21"
text = "1- يا جماعه انا لحد دلوقتي باكل فلراخ و بدخل اي مطعم و بطلب فراخ بانيه<br />2- الناس هي اللي مهووسه و خايفه لدرجة انهم بقوا يخافوا من الفراخ<br />3- ممكن يكون موضوع الفراخ ده اشاعه لالهاء الراي العام على موضوع العبارة و الفساد ( عشان احنا مش متعودين من الحكومة عن الصراحه في موضوع بالشكل ده )<br />4- و عشان خاطر نيفين انا هحققلك امنيتك و هكتب في تعليقي الجاي قصيدة الطيور لامل دنقل كاملة بس لما اروح البيت عشان مش حافظها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112643/http://www.20at.com/article2.php?sid=474"

