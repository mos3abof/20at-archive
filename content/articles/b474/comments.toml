[[comments]]
order = 9
subject = "اللهم اكشف عنا البلاء"
author = "السلام عليكم"
posted = "2006-02-23"
text = "لماذا كل هذه البلايا التي تقع بنا متلاحقة؟<br />الإجابة: تأمل<br />(ظَهَرَ الْفَسَادُ فِي الْبَرِّ وَالْبَحْرِ بِمَا كَسَبَتْ<br />أَيْدِي النَّاسِ لِيُذِيقَهُم بَعْضَ الَّذِي عَمِلُوا لَعَلَّهُمْ يَرْجِعُونَ {41}‏)الروم<br />( فَبِظُلْمٍ مِّنَ الَّذِينَ هَادُواْ حَرَّمْنَا عَلَيْهِمْ طَيِّبَاتٍ أُحِلَّتْ لَهُمْ وَبِصَدِّهِمْ عَن سَبِيلِ اللّهِ<br />كَثِيراً {160}) النساء<br />(وَلَنُذِيقَنَّهُمْ مِنَ الْعَذَابِ الْأَدْنَى دُونَ الْعَذَابِ الْأَكْبَرِ لَعَلَّهُمْ يَرْجِعُونَ {21}) السجدة<br />ويقول الأمام علي رضي الله عنه(البلاء لا ينزل إلا ذنب ولا يرفع إلا بتوبة)<br />فاللهم اغفر لنا واكشف عنا البلاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112643/http://www.20at.com/article2.php?sid=474"
