[[comments]]
order = 0
subject = "حاجه تكسف"
author = "سوسة المفروسة"
posted = "2006-04-03"
text = "لما انعم ربنا عليا بعمل عمرة قعدت في مرة من المرات في الحرم المكي جنب بنتين من ماليزيا كانوا فاتحين مصاحف و بيقروا القرءان و بعد ماخلصوا حاولت اتكلم معاهم و فوجئت انهم مابيعرفوش و لا كلمة انجليزي و لا حتى عربي ..جالي ذهول لان كان عندي انطباع ان اي حد بيقرا القرءان بالعربي و بيصلي بالعربي لازم يكون عنده معرفه و لو بسيطه باللغه العربيه لكني فوجئت بالعكس ولحد دلوقتي لما باشوف رصة المصاحف الموجوده في بيوت كتير و عليها التراب اللي بيدل على عدم استعمالها اللهم الا في رمضان..بحس انه احنا هنتحاسب على كده اضعاف مضاعفه..يعني شوفوا الناس دي -الماليزيين و الصينيين و غيرهم- بيتعبوا قد ايه عشان يقروا سورة في القرءان او يصلوا صلاة صحيحة و احنا اللي ربنا من علينا باللغة العربيه و تيسر القراءة و الصلاة بلغتنا فيه كام واحد فينا مضيع حقوق ربنا عليه...ربنا يهديهم و يثبتهم على حب الدين...اااامييين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123216/http://www.20at.com/article2.php?sid=656"

[[comments]]
order = 1
subject = "لم يأن للذين أمنوا أن تخشع قلوبهم لذكر الله و ما نزل من الحق"
author = "مناضل أنترنتى قديم"
posted = "2006-04-03"
text = "السلام عليكم ورحمة الله و بركاته<br />و الله عندك حق يا أخت سوسه المصاحف بتشتكى من التراب اللى عليها و للأسف بقت زينه فى العربيات و فعلا الناس ديه بتتعب اوى علشان تتعلم دينها و بتلاقيهم محافظين عليه اوى عكس و<br />للأسف قطاع كبير من العرب اللى القران بلغتهم و اللى الدين فى بلادهم وصلهم أسهل بكتير من المسلم الصينى و لا البريطانى و لا الأمريكى و لا حتى الدانماركى<br />ربنا يهدى الناس جميعا و أنا اولهم ..... أميييييييين<br />يا شباب دعوه بوجهها للشباب تعالوا نتفق على عمل خير و انا بقترح كبدايه مشروع صلاة الفجر كل واحد يصحى خمسه معاه بشرط أن اللى انت صحيته يصحى معاه خمسه<br />و الله المستعان و لاتنسونا من صالح دعائكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123216/http://www.20at.com/article2.php?sid=656"

