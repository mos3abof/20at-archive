order = 3
subject = "أجل تعريف الصينيين المسلمين بدينهم"
author = "bahaa"
posted = "2006-10-17"
text = "أيها اخوة و أخوات الأعزاء<br />تحية طيبة وبعد<br />أمد إليكم عبر المسافات الشاسعة التي تفصلنا يد المصافحة والمحبة والوفاء مهنئا بالعيد الفطر المبارك راجيا من الله أن يعيد العيد عليكم بالصحة والسعادة والسلام ..........,,,,,,,<br />كل عام وأنتم بخير<br />أيها الأخوة وأخوات الأعزاء أشكركم علي ردكم الجميل و القصيرة أما بخصوص المشاركة وللانضمام في عمل الخيرة عليكم بآلاتي :<br />1- ملي هذه الاستمارة وهي تكون وثائق تعارف مهمة جدا ومنها أتعرف عليكم وهي تكون سرية جدا وعدم أحد أو أي شخص الإطلاع عليها<br />أننا نبقي المعلومات خاصّة و سريّة لدينا، ولا نتشارك بها مع أي فريق ثالث من دون موافقتك<br />وهي كآلاتي:<br />الاسم :<br />العنوان:<br />السن :<br />المهنة:<br />الهاتف:<br />المحمول:<br />مستوي الترجمة : متوسط ـــ جيدا ـــــــ ممتاز0000<br />مستوي التدقيق للترجمة : متوسط ـــ جيدا ــــ ممتاز ـــــ عالي<br />مستواي التقديرات الدراسية: مقبول ـــ جيدا ــــ جيدا جداـــــ ممتاز<br />فترة الترجمة للكتاب ,النصوص: أسبوعين ــــ3اسبابيع ـــشهرين<br />الخبرات :<br />أيها الاخوة والأخوات انني أسع الي أعمال الخير من أجل تعريف الصينيين المسلمين بدينهم<br />ولهذا نرجوه من الأخوة الأفاضل أن يقرر أنه متبرع بالمجهود للترجمة أعمال دينية وهي كآلاتي :<br />تترجم مجموعة نصوص للداعية الإسلامي الأستاذ / عمرو خالد أو<br />الخواطر الإيمانية للداعية الشيخ / محمد متولي الشعرواى<br />إذا كان الديك الجهد والمساعدة كل ما هو عليك بالأتي :<br />1- أن تحدد موضوع النص الإسلامي أن كان للشيخ الشعراوي أو الأستاذ / عمرو خالد نص معين من إحدى الكتب وتقول فيها بالغة الصينية يرجع هذا النص إلى كتاب للمؤلفة كذا وهذا يكون مراجع .<br />2- أرسل لنا نسخة منها من المرجع: لي وترسل لنا باللغة الصينية و اللاتينية سطر صيني وسطر اللاتينية مثل 你<br />Ni<br />3- النص في ثلاث خطوط :<br />أ- باللغة الصينية<br />ب- بالغة اللاتينية<br />ت- تقسم الصفحة بثلاث للغات العربي --- الصيني---- اللاتينية<br />ث- تصميم لسيادتكم الافتتاحية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123216/http://www.20at.com/article2.php?sid=656"
