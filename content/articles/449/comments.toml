[[comments]]
order = 0
subject = "يابختك يا حنفى"
text = "يا بختك يا محمح يا حنفى بصاحبك اللى نازلك دعاء<br />عيب عليكوا....روحوا الاول دوروا على شغل<br />شباب اخر زمن<br />هو صحيح فى واحد ممكن كل ما يدعى يدعى لواحد صاحبه بالظبط زى ما بيدعى لنفسه؟!!!!!!!<br />غريبه!!!"
archived = "2004-11-17"
capture_url = "https://web.archive.org/web/20041117131345/http://www.20at.com:80/article.php?sid=755"

[[comments]]
order = 1
subject = "من قبل رمضان بكام يوم"
text = "رمضان كلة شهر جميل و قبلة بكام يوم كمان, كفاية تنزل الشارع قبل رمضان و الناس بتشترى المكسرات و أتفرج على منظرهم و كلهم فرحانين و الكل مبتسم عكس كل أيامالسنة و خصوصا فى القاهرة.<br />كمان أحب أوى منظرنا و إحنا رايحين الصلاة فى جامع كبير وتلاقى جيوش ماشية معاك \" منظر يفرح \" و لا تجد مكان لركن السيارة كالمعتاد و لكن تكون مبسوط!!!! رمضان بقه لازم الكل يكون مبسوط.<br />أما أكثر دعاء تأثرت بة هو طبعا الدعاء لإخواننا فى الفلوجة و العراق عموما. و تلاحظ فى أى مسجد عند الدعاء للإسلام و المسلمين يرتفع صوت آمين من المصلين, و لوأنة مش فارق الصوت عالى ولا منخفض كده كده الله يسمع الدعاء و يستجيب إن شاء الله و لكن اهه الواحد بيطلع الى جواة فى هذا الصوت العالى بآمين.<br />الهم أنصر الإسلام و المسلمين"
archived = "2004-11-17"
capture_url = "https://web.archive.org/web/20041117131345/http://www.20at.com:80/article.php?sid=755"

[[comments]]
order = 2
subject = "رمضان وحشنى"
text = "السلام عليكم و رحمة الله,<br />اكثر دعاء أثر فيا يا واصل المنقطعين اوصلنا اليك,و والموقف : فى صلاة التهجد عدد الناس كان اكثر من صلاة التراوح و المكان مكفاش لدرجة ان بعض الناس كانت بتصلى فى الخارج....و حلقة عمرو خالد عن الرسول صلى الله عليه و سلم اثرت فيابشكل فظيع<br />رمضان جيه و مشى كالضيف الهادىء الذى لا يمل"
archived = "2004-11-17"
capture_url = "https://web.archive.org/web/20041117131345/http://www.20at.com:80/article.php?sid=755"
