[[comments]]
order = 16
subject = "قصة أخرى عن استفذاذ الشرطة للشعب"
author = "ابن البلد"
posted = "2006-10-14"
text = "في ليلة من ليالي زحام المروركانت العربيات راكبة فوق بعض في الشارع الرئيسي و محدش عارف ايه السبب و مشينا تاتا لحدنهاية الشارع أتاري الونش و حملة من ضباط المرور في عز زحمة رمضان وفجأةنط ملازم منهم في نصف الشارع امامي و أوقف تاكسي بالامرفوقف التاكسي قلنا أكيد علشان يشوف رخصته لكن البيه كان بيوقف التاكسي علشان يركب فيه سيدة و فتاة معرفة والشارع كله واقف مستني البيه و الهوانم يركبوا التاكسي و يخلصونالكن طبعا الملازم البارد الحقير وقف يتكلم مع الست شوية و هي على باب التاكسي وولا على بالة...طبعا الناس اتعصبت و رجعت بسيارتي بعصبية للخلف و ثم للامام مرة تانية بزاوية لكن للاسف معرفتش أعدي كل ده و الملازم الكلب لسة بيتكلم مع الهانم وفين وفينمشوا بالتاكسي قام سيادته معدي قدام العربية بتاعتي روحت دايس على الاول جامد وضرب صوت العجل في الارض و قربت منه خالص لكن الحقير ما نطقش... جريت ورا التاكسي لحد ما حصلته...و طلعت من الشباك و قلت للسواق يقول للهانم ان هي و البيه حيوانات فرد السواق و قالي أنا مليش دعوة انا مظلومو مشه في طريقه ...قولولي بقه رأيكم ايه لأني هاموت من الغيظ"
archived = "2006-12-02"
capture_url = "https://web.archive.org/web/20061202144429/http://masr.20at.com:80/article.php?sid=1033"

