[[comments]]
order = 2
subject = "من الاخر"
author = "بنت حميدو"
posted = "2006-10-11"
text = "السلام علي من اتبع الهدى<br />اظن العملية واضحة جدا جدا و مش محتاجة لا تفسيرات و لا تحليلات, اصل مش ممكن كل الظباط ز امناء الشرطة و ظباط المباحث متخلفين لهذه الدرجة او ساديين , و واضح ان مفيش مثلا طار بايت قبل كدة بينهم و بين الناس الغلابة دى, و لا الناس دى عملت اللي يستاهلوا عليه البهدلة دى كلها, يبقى لو فكرنا كدة بهدوء و بتمعن سنجد ان في دافع او حافز لرجال الشرطة , او لنقول افراد الشرطة علي اساس ان من يفعلوا ذلك ليس برجال, حتي يفعلوا هذه الافعال السوداء, و بعد البحث و التحري و السؤال و الاستفسار, علمت و من مصادر موثوقة ان هذه الطرق الغريبة فى التعذيب و هذه القساوة و العنف و الافتراء مل هي الا البوابة الرئيسية للعبور الي المناصب القيادية العليا و الرتب الاعلي و زيادة النجوم و النسور علي الاكتاف, فهؤلاء الافراد (افراد الشرطة) يتنافسون فيما بيتهم علي منصب الزعامة في فن التعذيب و البهدلة و ابتكار الاساليب الجديدة و عدد المحاضر و الاصابات التي يحدثونها, فمن يفوز بهذا المنصب و الجاة و السمعة المدوية تجته يترقي للمنصب الاعلي و ينتقل الي الاماكن الاحسن.<br />اذا هي ليست سادية و لا مرض التلذذ بالتعذيب علي قدر ما هي المجهود المبذول و الثمن المدفوع للترقى, اتعلمون لو جعلوا اسباب الترقي فى الشرطة مثلا السمعة الطيبة للضابط مثلا بين الناس , ستجدون كل افراد جهاز الشرطة و قد تحولوا الي حملان وديعة و عصافير كناريا مع افراد الشعب, لأن كل واحد منا عنده طموح و يسعي بكل السبل و الطرق و المكانيات لتحقيق طموحه, اذا العيب في الاصل يقع علي الكبار في جهاز الشرطة الذين حددوا الية الترقية و المواصفات الخاصة للذين يستحقونها"
archived = "2006-12-02"
capture_url = "https://web.archive.org/web/20061202144429/http://masr.20at.com:80/article.php?sid=1033"

