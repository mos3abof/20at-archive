posted = "2006-10-11"
text = "أجمل تعبير لخص الموضع كله فى جمله انتهت القصة ولم تنته القضية ولن نتتهى طالما ظل حاكمنا وحاشيته فى الحكم فالموضوع لن ينتهى بنقل ظابط او فصله انما ينتهى بفصل نظام حكم واخراجه من الخدمه .<br />مبارك اطلق يد الامن فى كل مكان لانه يعلم ان هذا ملاذه الاخير ويعلم ايضا ان هذا الحل الوحيد للتوريث .<br />لذا متى انتهى حكم اسرة مبارك وانتهى حكم الفاسدين والعملاء الظلمه البغاه ساعتها بس من الشرطة اللى هينصلح حالها البلد كلها انشاء الله ."
