subject = "أنهم سرطان"
author = "حسام على"
posted = "2006-10-15"
text = "جهاز الشرطة فى مصر و جهاز أمن الدولة أصبحو عبارة عن سرطان هذة الامة الامن تغلغل فى كل شىء حتى الانترنت لم يتركوة فى حالة واعتقلو المدونين بتهمة تكدير السلام الاجتماعى فى دولة بهذا الشكل بقالها فى الحالة دى حوالى خمسييييييييييييين سنة وعايزين المصريين يتغيرو فى يوم و ليلة يا راجل حرام عليك"
archived = "2006-12-02"
capture_url = "https://web.archive.org/web/20061202144429/http://masr.20at.com:80/article.php?sid=1033"

