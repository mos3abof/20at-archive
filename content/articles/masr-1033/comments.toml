author = "د/سعيد"
posted = "2006-10-14"
text = "ياإبن البلد<br />انت صح ابن بلد جدع وراجل اللى تصرفت كدا<br />والمفروض اننا كلنا نتصرف مثلك<br />تعرف لو كنت اعترضت بأدب وقلت مثلا هذا لايجوز منك ياحضرة الظابط كان نزل وضربك جوز على قفاك لا مؤاخذه ولكن أن تعترض وبعنف فقد خاف منك هو والسائق<br />حدث معى هذا وهو اننى مررت بسيارتى على اشاره زحمه جدا ووجدت العسكرى مشغول بالكلام مع زميل له فصحت به : شوف شغلك ياعسكرى وبطل كلام مع زميلك , فرد على حاضر ياباشا. ومررت عليه بعد عشرة أيام الساعة ثلاثه ظهرا وجدته فى نفس المكان وتحت الشمس الملتهبه ومتعب جدا صعب على .قلت له بدل الشمس قف تحت المظله .رد على وقال لى خليك فى حالك لأشكك مخالفه<br />هكذا هم شرطتنا . إضربهم بالجزمه يحترموك تعاملهم بضعف يركبوا عليك"
archived = "2006-12-02"
capture_url = "https://web.archive.org/web/20061202144429/http://masr.20at.com:80/article.php?sid=1033"

