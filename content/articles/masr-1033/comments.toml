[[comments]]
order = 7
subject = "انتو دايما فاهمين الناس دول غلط"
author = "ايمن امام"
posted = "2006-10-11"
text = "كل عام وانت بخير يااخوان انتو دايما فاهمين الناس دى غلط يعنى ايه رش مبيد حشرى على الراجل الحكايه بمنتهى البساطه البعوض هناك كتير والراجل خاف على الناس من البعوض قوم شويه رش جم جوه معدته - نعمله ايه يعنى - دى تبقى غلطه الضابط يعنى احنا مديين تعليمات لجميع الاقسام بحس معامله الجمهور وعدم التعدى على اى مواطن - لكن الايدى التى تعبث فى الظلام والتى لاتريد الاستقرارلهذا البلد- تضخم الاحداث وتزيف الحقيقه - ارفعوا ايديكم عن لبنان - اسف عن وزاره الداخليه -الاندر وير - ياجهله- مهما قلنا ومهما كتبنا ومهما ابلغنا المشكله فى الثقافه البوليسيه التى تحرك رجل الشرطه منذ دخوله الى الكليه ونظرهالفرعون التى تخرج من بين اضلعه والجينات الوراثيه الى تتخبط فيما بينها بين الرهبه من السلطه وبين العرق الفرعونى الذى يتلازمان داخله - المشكله ايها الساده ان هؤلاء يتعلمون منذ اليوم الاول - انك مخلوق غير كل من خارج هذه الكليه انت مميز فى كل شىء انت مميزفى انفاقك ولاجل ذلك سنعطيك راتبا يتماشى مع ما سوف تتعلم ان تجنيه من علاقاتك واتصالاتك انت انسان - غير مدان قانونا لو قتلتل رجل او اثنان او اكثر المهم من يكون هذا الرجل - اولا ممنوع منعا باتا عليك ايها الشرطى مهما كانت رتبتك ان تتعرض لاى مسيحى ممنوع منعا باتا ان تناقشه الا وان تسبق النقاش بكلمه حضرتك ولو سمحت ممنك اقبض عليك لان سيادتك فى حاله تلبس بجريمه- فأذا رفض فقم بألقيض عليه ولكن حذار ان تمس تسريحجه شعره لان اهله ها يصحوالبابا من النوم - يقوم يكتب فاكس لامريكا الحقينا احنا مضطهدين وبيخطفوا ولادنا علشان يجبروهم على الاسلام -والضابط مان معاه واحد بدقن وواحده محجبه - ثانيا - ايها الضابط ممنوع التعرض لاى بائع جوال فى المنطقه التى سترأسها - وسيبهم يييييييييي<br />اقرأ بقية التعليق .."
archived = "2006-12-02"
capture_url = "https://web.archive.org/web/20061202144429/http://masr.20at.com:80/article.php?sid=1033"

[[comments]]
order = 8
subject = "ولسه ياما هنشوف يابهية"
author = "فارس _fr"
posted = "2006-10-11"
text = "حسبي الله ونعم الوكيل طالما التشكيل العصابي الموجود فى مصربرئاسة الكابتن محمد حسنى افندى امنحوتب مبارك ومعاه خط الظهر من اليمين للشمال الداخلية وامن الدوله وحبيب افندى رع العادلى .... وبقية التشكيل العصابي لترويع الامنين من اولاد بهية .. انتظروا الكثير والكثير من المتعه والاثارة من عصابة بهية .. انا بيتهيالى ان اغلب الضباط فى مصر شواذ ولا اناغلطان ؟ ....<br />حسبي الله ونعم الوكيل \" اللهم اهلك الظالمين بالظالمين واخرجنا من بينهم سالمين \" اميييييييييين<br />انتظروا العديد والعديد من مسلسلات التعذيب من ظباط الشرطة الشواذ ...<br />انا بيتهيالى الضابط ده محبش يحرمنا من مسلسل تعذيبي نشوفه فى رمضان ...<br />ياااااااااارب اللهم لا تسلط علينا منلا يخافك ولا يرحمنا ...<br />اسف لو فيه اى لفظ خارج"
archived = "2006-12-02"
capture_url = "https://web.archive.org/web/20061202144429/http://masr.20at.com:80/article.php?sid=1033"

