[[comments]]
order = 1
subject = "اكذوبة النظام والقانون"
author = "علي علي محمود"
posted = "2006-09-18"
text = "نحن في المن نعرف اكذوبة الانتخابات والتلاعب بالألفاظ التي يطلقها الحزب الحاكم فما يقولونه عن النزاهة وعن النظام والقانون وعن احترام سيادة المؤسسات وحيادية الوظيفة العامه ومرافق الحكومه والدوله كل ما يقولونه عن هذا عباره عن اكذوبة وأضحوكه ليصدقهم من لا يعرف بهذا الامر<br />فالكل مستغل لصالح الحزب الحاكم ومرشحه من مرافق الحكومه وعلى مستوى محافظي المحافظات ومدراء العموم وحتى مدراء المدارس<br />ناهيك عن التصرفات الهمجيه وتجميع الناس في أماكن معينه لخذ اليمين منهم بترشيح ولي الأمر الآمر الناهي محقق الانجازات و و و إلخ<br />كل هذا صار معروف سلفا أن نتيجه الانتخابات ستكون محسومه سلفا لصالح الحزب الحاكم الذي مثل مرشحه مسرحية التنازل عن السلطه ثم عدل عنها ليدخل في تنافس قوي لم يكن يتوقعه او يحسب له حسابا أمام مرشح المعارضه المستقل النزيه المهندس فيصل بن شملان الذي لم يجدوا عليه مايشينه في مسيرة حياته النزيهة فبدأوا يطلقون الفاظهم الغبيه حوله مثل \" المستأجر \" الكذب المشترك ، المخرف \"<br />وغيرها من الألفاظ التي لا ترقى بالعقلاء حينما ينتقدون الاشخاص<br />مما يدل على مدى الافلاس الذي وقع فيه الحزب الحاكم وقيادته في الشارع اليمني<br />مما حدى بمرشح الحزب الحاكم ان يقوم بحركه مكشوفه أصبحت اضحوكه في الشارع اليمني وهو ان يقوم قبل الانتخابات بثلاثه أيام بصرف مرتب زياده أو اكراميه لكل موظفقي الدولة هذه المرتبات ليست داخله ضمن خزينة الدوله ولا عن طريق وزارة الماليه ولا حتى عن طريق لجان ومكاتب صرف المرتبات لكن عباره عن لجان خاصه جدا<br />وهنا نتسائل من أين صرفت هذه المبالغ الطائله التي لم تمر على موازنه وزارة الماليه من أين ؟؟؟<br />لاشك انه استمرار لسلسله الفساد المالي والاداري والاقتصادي التي يتبعها الحزب الحاكم في كسب الاصوات ولو عن طريق بعثرة المال العام بأي وسيله كانت<br />دمتم بعافة<br />وكل انتخابات وانتم بخير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143108/http://www.20at.com/article2.php?sid=1235"

