[[comments]]
order = 5
subject = "لن نستسلم"
author = "ريحان"
posted = "2006-09-18"
text = "ان ماتقوم به السلطة في اليمن من اعمال تعسفية وقمعية في اسكات صوت الجماهير الهادرة الصادحة بالحرية والتغيير لن يسكتها وما هذه الاعمال الا استمرارية لاعمال سبقتها وسوف تليها تصل الى حد السجن والتصفيات الجسدية، وحجب صوت اليمن لن يمنعنا من الاستماع لفهد القرني وحجب ناس برس بكل شفافيته لن يمنعنا من تصفحه وحجب منتديات حوار وسقفه العالي من الحرية وكتابه من صحفيين وكتاب وباسمائهم الحقيقية والذي لم يمنعهم في السابق التهديد تارة والترغيب تارة اخرى لن يمنعهم ويمنعنا من الاستمرار في الكتابة الحرة بضمير وشرف.<br />وما 20 سبتمبر الا اول الخطوات في سبيل التحرر من هذه السلطة الفاسدة وماحققناه الى الان من مساحه الحرية دفعناه بدماء الكثير والكثير من الشهداء والكثير من ابناء الشعب اليمني القابعون خلف القضبان والكثير من عانوا من كل انواع التعسف والارهاب وسوف نواصل المشوار نعم سوف نواصل عهدا بكل هؤلاء الشرفاء ومن اجل المسحوقين من اكثر ابناء اليمن الوقع باغلبية بنسبة 75% منهم تحت خط الفقر.<br />تحية لكل الشرفاء من حملة مشاعل الحرية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143108/http://www.20at.com/article2.php?sid=1235"

[[comments]]
order = 6
subject = "لن يستمروا"
author = "YeMeNmOon"
posted = "2006-09-18"
text = "مهما حالوا وما هما سيعملوا لن يستمروا على هذا الحال والفاصل بيننا ساعات من هذه الساعة سوف نراهم ونرى ما يعملون<br />لن يكون لا خيرا ولن يستلم زمام الحكم إلا خير الرجال بن شملان ان شاء الله<br />ومن طبيعة الحكومة اليمنية ان تعمل مثل هذه الاعمال ليعبروا لنا عن عجزهم وعن الاعمال التافهة التي يقومون بها فالله موالنا وعليه نتوكل وإليه المصير<br />وبعد 36 ساعة سوف يبدأ الصراح بين أهل الحق وبين اهل الفساد<br />ودعواتكم يا شباب لاخوانكم بالفوز"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143108/http://www.20at.com/article2.php?sid=1235"

[[comments]]
order = 7
subject = "بلاد العجائب بالفعل"
author = "ولد ديمقراطي"
posted = "2006-09-18"
text = "يأتي لنا مدعوا مقراطية من الحزب الحاكم كل يوم بفضائح وعجائب ..<br />شي غريب بالفعل أن يكون ~أجهل القم هم أصاحب النفوذ من هنا تأتي مقولة اليمن بلاد العجائب بالفعل هذا غير حاصل سوا في اليمن..<br />وان كان هذا الحال قبل الاقتراع فالويل للمعارضة أثناء الاقتراع ...<br />وسلملي ع الديمقراطية .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143108/http://www.20at.com/article2.php?sid=1235"

[[comments]]
order = 8
subject = "النظام العسكري"
author = "Anwar"
posted = "2006-09-18"
text = "ماذا تتوقعون من النظام العسكري الذي يحكم اليمن بالحديد و النار ,, و اعتقد بان المعارضة وقعت في فخ النظام العسكري و اعتقد ايضاً بان المعارضة اليمنية عبارة عن قناع أو ( كرت ) في يد النظام ليحصل على الملايين من المساعدات و القروض و الهبات من دول العالم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143108/http://www.20at.com/article2.php?sid=1235"

[[comments]]
order = 9
subject = "نظام مأزوم"
author = "أنور العزب"
posted = "2006-09-19"
text = "أن لجوء الحزب الحاكم إلى حجب المنتديات الاليكترونيه في خضم الإنتخابات الرئاسيه ماهي إلا قطره من غيث الممارسات اللاديمقراطيه والتعسفيه التي يمارسها الحزب الحاكم ودليلا واضحا على أن الحزب الحاكم في اليمن يعيش حاله من الهستيريا التي يعيشها وكما أنها جزء من الشموليه الفكريه التي يعبشها ويمارسها منذ توليه السلطه ولذا تأتى ممارساته هذه بعد فشله في اسكات الأصوات الوطنيه والافلام الشريفه التي حاول غسكاتها إما بالقتل أو السجن أو الضرب ومن هنا نقول للحزب الحاكم بأن محاولاته لحجب الحقيقه لن تجدي فشمس الحريه لابد أن تشرق وتصيبه بالعمى ومن هنا نقول لمنتدى صوت اليمن وحوار وناس بارس نحن معكم من المهره إلى صعده ولن تستطيع ممارساتهم أن تطفئ شمسكم الساطعه<br />وسيروا على الدرب الذي ارتضيتموه لأنفسكم ومن خلفكم حشودا من أبناء اليمن التي لن تكون سعيده إلا بيمن جديد ورئيس جديد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143108/http://www.20at.com/article2.php?sid=1235"

[[comments]]
