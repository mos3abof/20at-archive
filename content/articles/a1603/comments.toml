subject = "اولاد عاقين"
author = "لاولاد الذين قتلوا ابوهم عاقون له كانوا، وامهم كذلك، والظاهر انه ليس ابوهم."
text = "اما حكاية تسريب القاعدة ديت، فهذه ليست مشكلة، لان اهلنا اهل فلسطين هم اكفأ من انتظار اية مساعدة.<br />مواضيع كويسة واتمنى لكم التوفيق"
