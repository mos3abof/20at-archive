subject = "مستقبل افضل لبلدك"
author = "الخلاص من الحكام المستبدين"
text = "بلدك مسجونة ...نفسك تخلصها وتحررها من اياد سجانها ؟ الامر بسيط بل وابسط مما تتخيل لن تحتاج فيه لسلاح وقد لا تدخل المعتقل وقد لا تسيل دماؤك ....كما ان احتمال نفخ مؤخرتك سيكون ضعيفا ....عموما نوعدك بنهاية تسعدك .<br />وطن حر فى الواقع مش فى الحلم ...بس لحظة العملية مش سهلة ابدا،فلن تكون مثل شكة الدبوس لانه جهاد من نوع خاص يحتاج للتخطيط والفكرة مش فردالعضلات ...يحتاج للدراسة والذكاء والجهد والصبر .<br />هذه الطريقة فى استعاده الوطن وضع اساسها عالم سياسة امريكى اسمه (جين شارب ) استطاع من خلال معهده المعروف باسم البرت اينشتين ونظريته المعروفه باسم (النضال اللاعنيف )ان يمهدالطريق لنوع جديد من الثورات ولكنه لايعرف طريق القطن والشاش ! نظرية جين شارب ليست عذراء او حبرا على ورق فلقد طبقتها اكثر من حركة ديمقراطية وحولوا خطواتها وتنظيراتها الى حقيقة ملموسة فى الشارع نتيجتها واحدة....سقوط الديكتاتور .<br />الثورة اللاعنيفة التى تخاصم العنف والضرب والمواجهات العسكرية وتعتمد نظرية جديدة اسمها \" التحدى السياسى\" شرحها جين شارب فى بالتفصيل فى كتابه \"من الديكتاتورية الى الديمقراطية \" وهذا الكتاب الذى قامت على اكتافه اكثر من ثورة ناجحة لم يظهر بشكل شيطانى وليس نتاج تأملات او ساعة عصارى لسيادة المؤلف بل هو دراسة بحثيه علميه متطورة استخلصها الكاتب من بعض تصرفات وتحركات بعض حركات المقاومة فى مواجهة انظمة ديكتاتوريه مثل حركة (لجنة استعادة الديمقراطية فى بورما ) والتى بدأت مقاومتها من داخل غابات \" مانربلو \"<br />وايضا من شجاعة التحدى التى اظهرها بعض الاشخاص اثناء مشوار نضالهم فى بلدان مثل بنما وليتوانيا ونيجيريا ،وما حدث مثلا فى ساحة \"تيانامن\"فى بكين وغيرها من البلاد.<br />كل هذه المشاهدات اتاحت للمؤلف ان يرى حركات وخططا وطرقا نضالية مبتكرة ووليدة لحظتها قام بها بعض المقاومين ضد الطغاة بشكل عفوى ...جمعها المؤلف وطورها علميا وطرحها نظرية سياسية اثبتت التجربة نجاحها فى الخلاص من بعض الانظمة القمعية مثل \"ثورة الزهور \" فى جورجيا ومنظمة\" اوتيور \" فى صربيا وثورة \"مجافت\" الالبانية وغيرها .<br />الكتاب او النظرية التى وضعها جين شارب ظهرت فى وقتها ونحن احوج ما نكون اليها فى الوقت الحالى وقد لا ابالغ اذا قلت ان هذه النظرية هدية من السماء لشعب يفتقد لثقافة التخطيط ولكن فى نفس الوقت لابد ان نعترف ان هناك او بشكل اخر وجه شبه قريب بين ما تفعله حركة كفاية المصرية وما يطرحه الكتاب من خطوات للخلاص من الديكتاتور .<br />فهذا الكتاب يعتمد على فكرة ريئسية تقوم على الاجابة على سؤال واحد هو: كيف تستطيع الشعوب القضاء على الانظمة الديكتاتورية بدون استخدام العنف ؟<br />هذا الكتاب يعلمنا كيف نسعى لنقلص نسبة الخسائر والاصابات ،كما ان\"التحدى السياسى السلمى\" هو الاضمن ،فالانقلابات العنيفة التى تحمل بين طياتها عنف السلاح قد تحرر البلاد ولكنها قد تأتى بأنظمة ديكتاتورية أقوى وأشرس،فالانقلابات غالبا ما تأتى بزمرة من العسكريين يجثمون على قلب الوطن ويحتلون قصوره تصبح الانقلابات فى عهدهم وكأنها شئ مألوف وهذا ما نشاهده فى دويلات افريقيا و موريتانيا دليل حى على ذلك .وغالبا ما ينتهى هذا السيناريو بمواطن ضعيف لا حول له ولا قوة تنقصه الثقة ويملأه الرعب ويضيع الوطن .<br />وفى موضع اخر يقول المؤلف ان استخدام العنف ضد الانظمة الديكتاتورية تقابله رده فعل عنيفة من جانب النظام يتحمل المناضلون خسائرها لان النظام الديكتاتورى غالبا ما يكون اكثر قوة وقمعا ولايؤمن بالقانون ولا الدستور ولا الاحكام القضائية ويتجاهل الرأى العام ،وبذلك يصبح من السهل عليه استخدام القمع والارهاب ضد المقاومة لانه لا يوجد من يحاسبه وهذا ما يحدث فى مصر بالنص .....كل حركة وكل مظاهرة ضد النظام يقابلها بطش من جانب النظام وضرب وسجن واعتقالات .<br />النظام ايضا يسيطر على المؤسسات المجتمعية والسياسية والاقتصادية ويعزل المواطن عن القرار ويقتل لديه الامل .<br />كل هذه المميزات التى يتمتع بها النظام تجعلنا نذهب للسؤال الذى طرحه جين شارب ويقول فيه ما هو الحل اذا كنت ضعيفا وعديم الامكانيات فى ظل دولة دينها القمع والعنف ولاتعترف اساسا بكل ما هو قانونى او دستورى ؟<br />المؤلف يقدم اجابته على هذا السؤال ،فهو يرى ان اختيا العنف لن يكون حلا جيدا لانه يعنى خسائر مادية ومعنوية للمقاومة ولان الرجل فى كتابه لم يترك شيئا فقد طرح الختيار الخير وهو اللجوء الى المساعدات الاجنبية، وهو يرى اسراع المقاومة فى العتماد على الخارج له انعكاسات خطيرة اهما ان الدول الاجنبيه ذات مطامع ومصالح كما انها قد لاتكون على قدر المسئولية وتساعد النظام الديكتاتورى ضد المقاومة لانها ترتبط معه بمصالح مشتركه .<br />نخلص من هذا اذا اردت ان تسقط نظاما ديكتاتوريا بفاعلية واقل تكاليف فعليك فعليك بان تقوم بالمهام الاربع التالية :<br />اولها تعزير الشعوب المضطهدة فى تصميمها وعزيمتها وزيادة ثقتها بنفسها واكسابها مزيدا من مهارة المقاومة .<br />وبالمثل تعزير جماعات ومؤسسات المجتمع المدنى .<br />وثالثها خلق حاله مقاومة داخلية قوية وصبورة .<br />ورابعا وضع خطة استراتيجية حكيمة ،وتنفيذها بمهارة . وان ترفع شعارا واحدا وتؤمن به وهوان التحرر من الانظمة الديكتاتورية يعتمد اساسا على قدرة الشعوب على تحرير انفسها بأيديها .<br />عموما اذا قررت بكامل ارادتك اختيار \" النضال اللاعنيف \" طريقك فى النضال فلابد ان تأخذ لان اول خطأ قد تقع فيه بعد بدء عملية المقاومة هو المفاوضات ،فالنظام الديكتاتورى سيحاول ان يسحبك ايها المناضل الى مائدة المفاوضات وتلك اخطارها كثيرة ،مثلا قد قد يستنتج البعض من الشعب ان مفاوضات المقاومة مع النظام تعنى الاعتراف بالوجود الابدى للنظام ، اضف الى ذلك ان المفاوضات ليست اسلوبا واقعيا للاطاحة بانظمة الحكم الديكتاتورى ، ولعل ما حدث مع الأحزاب المصرية التى جلست لتفاوض الحزب الوطنى خير دليل على ذلك فلقد خسرت الشارع وقضت على الخمسة ستة الذين كانوا يهتفون باسمهم فى الشارع.<br />متى لوكان هناك تفاوض مشروط بال<br />اقرأ بقية التعليق .."
archived = "2006-11-02"
