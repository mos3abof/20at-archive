[[comments]]
order = 16
subject = "سهولة الخط العربى"
author = "يحيى الشافعى \\الشرقيه"
posted = "2006-05-13"
text = "من الممكن ان نتعلم الحط العربى اذا توافرت هذه السمات 1-ان يكون داخليا راغبا فى ان يتقن ويبدع فى مجال الخطوط العربيه 2-ان يتمرن على مقاطع الحروف ويجيدها تماما 3-ايضا التمرين على اتصال الحروف ببعضها 3-تقليد الفنانين لبعض اعمالهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131402/http://www.20at.com/article2.php?sid=10"

[[comments]]
order = 17
subject = "المصلحة وبس"
author = "Mr Hisham"
posted = "2006-05-14"
text = "معظم الخطاطين اصحاب المواقع لا تعنيهم الا المصلحة الخاصة واخر ما يفكرون فية هو مصلحة الخط كما يدعون.نحن نريدان تكون هناك استفادة حقيقية لكل من يدخل على هذة المواقع مع العلم ان هناك الكثير من الذين يريدون الاستفادة من هذة المواقع.وهذا رايى كخطاط مبتدأ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131402/http://www.20at.com/article2.php?sid=10"

