order = 0
subject = "فعلا الخط العربي من اجمل الخطوط"
author = "marwa"
posted = "2005-12-07"
text = "و حد جرب يتعلم الخط هايلاقيه صعب جدا أنا كنت بشارك بلوحاتي على مرسم وكان فيه دورات خط عربي وحاولت اتعلمه وفشلت رغم اني بارسم بورتريهات معقوله وفعلا فعلا الخط العربي مختلف عن كل خطوط العالم اللي ممكن تترسم حتى بمربعات أما الخط العربي أبدا ابدا لازم الروح اللي تحس بيه والخط ده عالم مش حكاية حروف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131402/http://www.20at.com/article2.php?sid=10"

[[comments]]
order = 1
subject = "عاشقه الخط العربى"
author = "شوشو"
posted = "2006-01-04"
text = "الخط العربى من اروع الفنون انا درست الخط العربى لمده 6أعوام وعشقته الى درجه كبيره ولى لوحاتواشترك فى معارض الخط العربى التى تقام فى مدرستنا وبالتاكيد الخط العربى عايز قوه فى الاداء طبعا اداء الحرف وتعرف اماكن ضعف الحرف واماكن قوته وانا ببزل كل جهدى لجعل الخط العربى اهم الفنون الاسميه فى عصرنا هذا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131402/http://www.20at.com/article2.php?sid=10"

