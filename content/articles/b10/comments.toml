order = 2
subject = "نحن معكم"
author = "أسماء البتول"
posted = "2006-01-27"
text = "السلام عليكم و رحمة الله تعالى و بركاته<br />آمل ان كل واحد يقرا هذا التعليق يسعى و بكل قوة لتحسين خطه<br />فاليوم لا يوجد عرب و لا خط عربي<br />فلا تنسوا اخوتي تراثنا المجيد و حافظوا على بعض الشواهد التي بقيت على اننا عرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131402/http://www.20at.com/article2.php?sid=10"

