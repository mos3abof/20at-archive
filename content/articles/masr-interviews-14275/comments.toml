author = "امة الله المصرية"
posted = "2009-12-13"
text = "استعجب<br />اكثر من يصلي و اكثر من يسب الدين<br />اكثر من يتحدث عن الدين و اكثر من يجعل نصف الدين الاسلامي الا و هو الزواج لعبة يتسلي بها علي بنات الناس<br />اكثر من يربي لحيته و يتردد علي المساجد واكثر من ينتشر بينهم داء النفاق<br />اكثر من يثور علي كرامته من اجل مباراة كرة قدم مع الجزائرين و يرتضي هتك الاعراض داخل اقسام الشرطة و في الطرق العامة<br />و في العبارات الغارقة وقتل الاسرائيلين للمصريين علي الحدود!!!!!!!!! !!<br />اخواني ان المجتمع داخله مرض اسمه النفاق وهو يتفشي كل يوم و يولد ظلما عظيما<br />والله لا يهدي القوم الظالمين<br />صدق الله العظيم<br />يجب ان نؤمن فعلا و نكون صادقين شرفاء لتختفي الامراض من داخلنا<br />وليس مظاهر الدين هي من ستخرجنا فرب قارئ للقرأن و القرأن يلعنه"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102070632/http://www.20at.com:80/masr/interviews/14275-2009-12-06-15-04-35.html?utm_source=facebook&utm_medium=facebook-ad&utm_campaign=mont7r"

