subject = ""
author = "محمد عوض"
posted = "2009-12-27"
text = "الضعف من الشيطان<br />او من الوهم ان الدنيا اتقفلت في وشه و انه حياته لم يعد لها قيمة ولا هدف<br />عشان كده لازم يكون دايما لينا هدف و نغيره من فترة الي اخري<br />علي العكس طبعا الشباب في السودي بينتحروا لكن من الرفاهية المطلقة الغير منتهية<br />دا بردك يوضح تلات حاجات انه غياب الدين والتربية و كمان غياب الحلم و الهدف و كمان غياب الحضارة<br />بجد لو كل واحد فينا قرر انه يضيف جزء للحضارة المصرية و يقول انا جزء منها هنلاقي الدنيا اختلفت"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102070632/http://www.20at.com:80/masr/interviews/14275-2009-12-06-15-04-35.html?utm_source=facebook&utm_medium=facebook-ad&utm_campaign=mont7r"

[[comments]]
order = 7
subject = ""
author = "مصري"
posted = "2009-12-29"
text = "أما بأة بالنسبة للتعليق التاني فده اللي كان معضلة بالنسبة لي…<br />حضرتك بتقول \" اخوك اتشنق على يد مشجع جزائري في البحيرة إثر رصاصة طائشة\" !!!!!!<br />اولا: هل البحيرة دي هي البحيرة بتاعتنا اللي في مصر ولا بلد عندهم في الجزائر اسمها زي اسم محافظة البحيرة المصرية ؟؟؟<br />ثانيا انت بتقول شنقه إثر رصاصة طائشة ؟؟؟؟ طب ازاي شنقه وازاي رصاصة طائشة ؟؟؟<br />ثالثا وده الاهم هل المشجع الجزائري ده اللي انت عايز تنتقم منه موجود هنا في مصر ولا مشي وسافر بلده ؟؟<br />يا جماعة انتوا فاكرين الجزائريين دول عالم هبل زينا ؟؟؟ دول بلطجية ومتربيين على شيل السلاح، انت متخيل انك تقدر تروح تضرب جزائري في بلده او تمس منه شعراية ؟؟ دول يدفنوك وانت صاحي ومحدش يعرف لك طريق جرة.<br />اديك قلت انه قتل اخوك في بلدنا هنا ومحدش عرف يعمل معاه حاجة ؟؟ ثم انت بتقول ان الرصاصة طائشة يعني الراجل مكانش قاصد يقتل اخوك، يعني مفيش نية او تعمد قتل يبقى انت هتنتقم منه بأي دليل وبأي تهمة ؟؟<br />انا شايف برضو انك تستعوض اخوك عند ربنا وتحتسبه من الشهداء وربنا بيمهل ولا يهمل واكيد هييجي اليوم اللي يترد لك فيه حقك انت واخوك سواء في الدنيا او في الاخرة."
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102070632/http://www.20at.com:80/masr/interviews/14275-2009-12-06-15-04-35.html?utm_source=facebook&utm_medium=facebook-ad&utm_campaign=mont7r"

[[comments]]
order = 8
subject = ""
author = "مصري"
posted = "2009-12-29"
text = "رداً على التعليق الأول…<br />أولا انا مفهمتش حاجة من كلام سيادتك خالص…يعني ايه \" طعنني رجل في إصبعة قدمي اليمنى\" ؟؟؟؟؟؟؟؟؟ يعني ضربك بسكينة في صباع رجلك اليمين ؟؟؟ طب انهي صباع بالظبط ؟؟؟؟<br />ويا ترى ساب جسمك كله وجه ضربك بسكينة في رجلك ؟؟؟؟ كلام غريب فعلاً !!!!!!!<br />حضرتك مذكرتش الراجل ده جنسيته ايه من الأساس…ده غير ان حضرتك بتقول الجزائر خذلتك وانت عايش فيها ومرجعتلكش حقك، طب مصر خذلتك ازاي ؟؟؟ انت كنت عايز مصر تجيبلك حقك وانت قاعد برا !!!!!!!! يا راجل دي مصر مضيعة حقوق ولادها اللي عايشين فيها ومورياهم الويل والجوع والفقر…<br />بعد كده بتقول انك بطلت تتفرج على كورة خالص ورحت على سوريا واستقريت فيها، جاي دلوقتي تقول عايزكم تساعدوني عشان تنتقم من الراجل الخبيث ده ؟؟؟؟ بعد ما فات الوقت ده كله ؟؟؟؟؟؟<br />انا شايف الحل انك تستعوض حقك على ربنا وتسيبه هو ينتقم لك منه وياخدلك حقك منه سواء في الدنيا او في الآخرة، إرفع ايدك بالدعاء عليه كل يوم وفي اوقات استجابة الدعاء لعل وعسى تسمع خبره من قريب او من بعيد في اي وقت وفي اي مكان…<br />مش بعيد على ربنا…"
archived = "2010-01-02"
capture_url = "https://web.archive.org/web/20100102070632/http://www.20at.com:80/masr/interviews/14275-2009-12-06-15-04-35.html?utm_source=facebook&utm_medium=facebook-ad&utm_campaign=mont7r"

