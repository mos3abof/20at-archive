[[comments]]
order = 27
subject = "اكتر شىء ممكن يعبر عننا"
author = "TOTTI"
posted = "2006-10-22"
text = "عدّى النهار .. و المغربية جايّة<br />تتخفّى ورا ضهر الشجر<br />و عشان نتوه في السكة<br />شالِت من ليالينا القمر<br />و بلدنا ع الترعة بتغسل شعرها<br />جانا نهار مقدرش يدفع مهرها<br />يا هل ترى الليل الحزين<br />أبو النجوم الدبلانين<br />أبو الغناوي المجروحين<br />يقدر ينسّيها الصباح<br />أبو شمس بترش الحنين؟<br />أبداً .. بلدنا ليل نهار<br />بتحب موّال النهار<br />لما يعدّي في الدروب<br />و يغنّي قدّام كل دار<br />و الليل يلف ورا السواقي<br />زي ما يلف الزمان .. و على النغم<br />تحلم بلدنا بالسنابل و الكيزان<br />تحلم ببكرة .. و اللي حيجيبه معاه<br />تنده عليه في الضلمة و بتسمع نداه<br />تصحى له من قبل الأدان<br />تروح تقابله في الغيطان<br />في المصانع .. و المعامل .. و المدارس .. و الساحات<br />طالعة له صحبة .. جنود<br />طالعة له رجال .. أطفال .. بنات<br />كل الدروب واخدة بلدنا للنهار<br />و احنا بلدنا ليل نهار<br />بتحب موال النهار<br />لما يعدي في الدروب<br />و يغني قدّام كل دار"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

[[comments]]
order = 28
subject = "لك الله لك الله لك الله يا بلدي"
author = "رامي"
posted = "2006-10-22"
text = "يا جماعة .. أنا انتخبت اخواني مش ايمانا بان الاخوان أفضل لكن ايمانا انهم الوحيديين الموجودين في المعارضة بقوة حاليا<br />رأيي انهم هيفضلوا فترة هيكونوا فيها رقم واحد وبعدين هينتهوا نهائيا<br />الاخوان المسلمين القراءة في بدايتهم وفي قانونهم وفي اجتماعاتهم وتنظيمهم تخليك تعجب بيهم كونهم أكبر جماعة منظمة عرفتها المنطقة لكن اوعي تغلط وتفتكر انهم الأفضل<br />اقروا تاريخهم واعرفوهم كويس .. لن أذكر شيئا عنهم فهناك الكثير لكن أكتفي بكلمة حسن البنا\"ليسوا اخوانا وليسوا مسلمين\"<br />لوثوا أيديهم بالدماء مبكرا<br />علي كل حال<br />أيمن نور زبالة الزبالة والاخوان ليسوا طوق النجاة وارتدوا عباءة جديدة تماما عنهم طلبا وترييلا علي كرسي الحكم ومبارك ورغم مساوئه اللي نعرفها كلنا أفضل من الاتنين<br />مفيش غير اننا نفضل مستنيين لحد ما نلاقي معارضة محترمة نمسي وراها"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

[[comments]]
order = 29
subject = "بلاش تخلف الله يخربيتكم"
author = "سوزان يهودية!"
posted = "2006-10-22"
text = "ومبارك قتل السادات!<br />والنظام انتقم من نعمان جمعة!<br />ايه العبط ده!!!!<br />موضوع قتل مبارك وعبد الحليم أبو غزالة للسادات اللي قريتوه في المصريون الأحرار متخلف وساذج<br />وبعدين عملتولي سوزان دلوقتي يهودية؟<br />كانت انجليزية وبقت يهودية كمان؟!<br />وليه لأ مهم بيقولوا علي عبد الناصر دلوقتي ان مربيته يهودية<br />يلعن أبو الجهل<br />وايه حكاية سي نعمان جمعة ده راخر .. طب أيمن نور والاخوان أصدق .. نعمان جمعة راخر النظام عايز ينتقم منه؟؟؟<br />مين نعمان ده ان شاء الله .. يهزلهم شعرة؟<br />دي صراعات داخل كل حزب وكيان وترييل علي الحكم .. والا نقول ان مبارك ورا انقلاب الابن علي أبوه في حزب الأمة راخر .. ليه لأ!!<br />عجبي"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

[[comments]]
