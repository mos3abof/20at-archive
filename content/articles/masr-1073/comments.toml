text = "يااصدقائى بدلا من تقطيع الاخوان بالشكل دة ارجو ان يفتكر الاشاوس دول ان فى ازمة القضاة الاخيرة لم يعتقل وينكل به الا الاخوان الجدع يورينا نفسه فى الشارع ولا انتو عاوزين تعارضو التوريث حتى اخر اخوانى اتقوا الله فى البلد يا اشاوس"
