posted = "2006-10-23"
text = "استغفر الله العظيم يا رب<br />ليه نغير اللي حصل ؟ ايه السذاجة حتى في الكدب ده ... اي حد هيقرا الموضوع فاهم ان الكاتبة المحترمة متحيزة ضد كل اللي مش اخوان<br />و يا للسذاجة طلبة الاتحاد اللي هم مننا هيتخانقوا مع بعض و يعوروا بعض عشان الشومة بتاعت مين ؟<br />القصة الطفولية دي عشان المحترمة ما تدخلش طلبة الاخوان في العنف اللي حصل<br />للأسف نسيتوا ان فيه طلبة من عين شمس اكيد هيخشوا الموقع<br />و للاسف الموقع فقد مصداقيته عندي"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

