subject = "إنجازات الإخوان فى 20 سنة"
author = "1 - بفضل مظاهراتهم التى لا تنقطع استطاعوا تدريب مئات الآلاف على فنون المظاهرات وعلى تكتيك الكر والفر فى المظاهرات"
