subject = "الإخوان وحمار جحا"
author = "طبعا اليسارين عمرهم ما يعجبهم الحال... معظم اللي هجموا على الإخوان دلوقتي ولبسين وش الخائفين على مصلحة الشعب المصري هم أول من سيجلس في بيته أيام التوريث.... الإخوان كانوا ومازالوا يدفعون اللأثمان من دلوقتي في حريتهم وأموالهم... وقادتهم هم الوحدين في البلد من القادة السياسين اللي عمالين كل شوية يعتقلوا شوية منهم ...."
posted = "2006-10-21"
text = "لكن هاقول الحمد لله الشعب المصري عارف مين هم الإخوان وأخلاقهم وتضحياتهم وعشان كدة بيختارهم في أي انتخابات حرة نزيهة....<br />كل موتوا بغيظكم"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

