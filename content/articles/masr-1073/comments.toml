[[comments]]
order = 20
subject = "سبب كل هذا الهجوم !!"
author = "سيد مصطفى"
posted = "2006-10-21"
text = "تابعت تلك الحملة ضد الإخوان والتى بدأت فى أكثر من موقع . وأنا أعرف بعض الأشخاص الذين يقفون وراء تلك الحملة . هم ليس ضد الإخوان بل هم ضد محاولات بعض قادة الجماعة لإمرار التوريث بحجة أن الشعب سلبى . هم يعتقدون أن المهندس الشاطر والدكتور حبيب قد اتخذوا قرار بالفعل بعدم الدفع بالإخوان للتحرك ضد التوريث وسوف يتحججون بأن الشعب سلبى . هذا هو سبب الحملة كما شرحها لى أحدهم على الخاص . هم مجموعة من المستقلين من نشطاء الإنترنت ولهم نشاطات عديدة على الإنترنت لمقاومة التوريث . والمعلومات التى وردت إليهم فى الفترة الأخيرة أشارت إلى أن الإخوان بدأوا فى فتح قنوات مع وسطاء من لجنة السياسات . وكان الذى أكد هذه الشكوك هو التصريح المفاجىء والغريب للسيد نائب المرشد بخصوص أن الشعب سلبى ولن يتحرك ضد التوريث ."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

