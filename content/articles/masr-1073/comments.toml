[[comments]]
order = 38
subject = "عيب"
author = "يا إللى أسمك دشم عيب عليكى إللى بتكتبيه كل شوية لو فاكرة أنك كده ها تحبطى الشعب علشان يرضخ للشاذ إبنك تبقى فعلاً مجنونة لأن مصر مليانة كفاءات أمثال الدكتور سعيد عريان اللى معتقلينه لشعوركم أنه خطر على وجودكم وهؤلاء ليس بينهم وبين المتخلف عقلياً هو وأصحابة عصابة حمادة وجيمى أى مقارنه والشعب كله رافض ليكم يعنى بالعقل كده ها يحكموا الشعب بالعافية دى يا ماما سوزان دولة جمهورية مش دولة عبيد وبعدين الشعب كله رافضكم الظاهر إنكم من كثرة لما قعدتم على كرسى الحكم فاكرينه بقى ملككم ولا من كثرة لما نهبتوا فاكرين أنه ها يتنهب ده كمان"
posted = "2006-10-27"
text = "خلاص الشعب رافضكم وعايز يتطهر من دنسكم أفهموها بقى البلد خربت من يوم لما مسكتوا الحكم بعد جريمتكم الشنعاء وقتلكم للرئيس السادات لسه ما شبعتوش<br />لولا تزويركم الإنتخابات كان الإخوان أكتسحوا كل المقاعد والشعب كله معهم وقضيتكم فاسدة وأى هجوم على الإخوان الشعب كله ها يقف بجانبهم"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

