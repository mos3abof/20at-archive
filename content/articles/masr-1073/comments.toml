[[comments]]
order = 3
subject = "جبهة الدفاع عن الأستاذ محمد حماد"
author = "ليعلم الجميع أن كرم جبر عميل لأمن الدولة وأنه المتحدث الرسمى لأمن الدولة وعليه فعندما تقرأون له يجب أن تقرأوا لتعلموا كيفية تفكير أمن الدولة"
posted = "2006-10-20"
text = "نحن مصريون ضد التوريث والإخوان معا . منذ تصريح نائب المرشد والذى هو فى حقيقته رسالة للنظام بمباركة التوريث قررنا أن نرسل رسالتنا للجميع ، لقد تم التوريث فعلا بمباركة الإخوان !!! لك الله يا مصر ، وليعلم نائب المرشد أنه كان واجب عليه بدلا من إتهام الشعب بالسلبية كان عليه إثارة الشعب للوقوف ضد التوريث"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

