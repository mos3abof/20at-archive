posted = "2006-10-26"
text = "انامش قصدى الى انت فهمته ده خالص بالنسبه للى كاتب موضوع حاجه تقرف انا كمان رافضه ان ابن جمال مبارك يمسك الحكم والكل معترض كمان انا كل الى انا بقصده ان احنا بنتكلم وخلاص ومفيش فعل يعنى احنا عمالين بنتكلم ومحدش بيسمعناغير الى زينا وهما هيعملوا الى هما عاوزينه يعنى مش شيفين ان جمال يتسلل للحكم شويه بشويه دا عاد بيمشى فى موكب اكبر من حسنى"
