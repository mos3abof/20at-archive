[[comments]]
order = 0
subject = "بيان من قيادة الإخوان إلى أعضاء الجماعة"
author = "بائس يائس"
posted = "2006-10-20"
text = "هذا بيان من قادة الإخوان إلى أعضاء الجماعة وخصوصا شباب الجماعات . تعلمون جميعا أننا كنا ندرس منذ فترة أفضل وسيلة للتعامل مع ملف التوريث ولكن كل الحلول كانت بها نسبة مخاطرة على بقاء جماعتنا العظيمة وعليه لقد قررنا ألا نعرضكم أو نعرض الجماعة لأى خطر . قرارنا الآن هو مشاهدة فيلم التوريث وكأنه يحدث فى بلد أخرى . لن نتدخل مطلقا لمحاولة إيقافه أو منعه وعليه يجب عليكم الآتى :<br />1 - التقليل من مهاجمة النظام<br />2 - التركيز على نقطة أن الشعب المصرى شعب خانع سلبى وبالتالى لا يستحق تضحيات الإخوان .<br />3 - موضوع الساعة الآن الذى يجب أن تنشغلوا به بدلا من موضوع التوريث هو مساندة إخوتنا فى حكومة حماس ومواصلة حملة المقاطعة وكما تعلمون هذه النشاطات مسموح بها من أمن الدولة ولا خطر عليكم<br />4 - تعلمون أن النظام صعد المواجهة مع أعضاء الجماعة للضغط على القيادة لإمرار التوريث وعدم الوقوف ضده والآن وبعد تصريح نائب المرشد فإن الرسالة قد وصلت لأمن الدولة وفى الأيام القادمة ستعود علاقتنا مع أمن الدولة كما كانت<br />( علاقة القط والفأر )<br />5 - حاولوا أن تقنعوا الناس بأن جمال هو أفضل الخيارات الآن وركزوا على نقطة أن الإخوان يفضلون الحل السلمى ولو استمر 1000 سنة فكما تعلمون نحن لا نتعجل الأمور فنحن منذ 80 سنة ونحن نعمل وعاشت وماتت أجيال بدون أن ترى أى نتيجة ولن يروا أى نتيجة<br />6 - ربما تسألون سؤال عن عائد مجهودكم وتضحياتكم !!!!!<br />يؤسفنى أن أعلمكم أن مجهوداتكم وتضحياتكم ذهبت أدراج الرياح ( هارد لك )<br />المهم ألا تيأسوا ولا تقنطوا ....<br />7 - استرتيجية الجماعة الآن هى إعداد جيل 2100 أى أنكم أجداد لهذا الجيل ، جيل النصر المنشود والتمكين !!!!!!!<br />وكما قلنا لكم فنحن فى القيادة نحافظ عليكم لذا فضلنا مهادنة النظام<br />8 - أما<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

[[comments]]
order = 1
subject = "الإخوان وافقوا على التوريث"
author = "ناصح"
posted = "2006-10-20"
text = "يا ريت الشباب الحلوة الى بتهاجم جمال والنظام يفكروا فى مصيرهم بعد أن ينجح جمال فى الوصول للحكم . ياريت تتعظوا من عقلاء الإخوان الكبار . كنتم تتفاخرون وتتباهون بقوة الإخوان وأنهم سيخرجون كالأبطال لينقذوا البلاد من شر جمال ومحجموعته .. يؤسفنى أن أقول لكم أن نأبكم طلع على شونه !!! الإخوان الآن فى جيبنا الشمال . ويوم التوريث الذى أصبح قريبا جدا سيجلس حبايبكم وأبطالكم الإخوان فى البيت يشاهدون التليفزيون ولو مش مصدقين الكلام ده انتظروا الأيام والأشهر القادمة وستجدوا أن لغة الإخوان تغيرت تماما . طبعا نحن نسمح لهم ببعض الهجوم الكلامى أم الفعل فهيهات . وعليه ياريت الشباب الى نازل شتيمة وهجوم يفكر مرتين"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

