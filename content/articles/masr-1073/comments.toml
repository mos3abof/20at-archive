[[comments]]
order = 33
subject = "ضربوا الشعب بعرض الحائط"
author = "مواطنه مطحونه"
posted = "2006-10-25"
text = "ياجماعه انتوا بتتكلموا فى الفاضى لان الى انتوا معارضين عليه دلوقتى هوتوريث الحكم لجمال هيكون امر واقع ولايام هتثبت لكم كده لانه بدا يتسلل للحكم شويه بشويه اما بقى حكايه الاخوان دى ياجماعه الاخوان دى يعنى ايه مش هما برضه مسلمين وبيدافعوا عن الاسلام يعنى بيدفعوا عننا بس للاسف لاخوان الايام دول بيسوئوا سمعه الاسلام بدلا من انهم بيدفعوا عنهم لان كل حاجه عندهم لاما اضربوه واحرقوه وبقى الاسلام هو الارهاب ياجماعه بالله عليكم هو ده الاسلام وعلى فكره انا مش ضد الاخوان بس لما يكون صح وافعالهم صح ومش يهيجواالشعب على شويه شعارات"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

[[comments]]
order = 34
subject = "كله كلام إدعاء على الإخوان"
author = "أنا شفت فضيلة الأمام مهدى عاكف فى التليفزيون فى أحدى المحطات الفضائية وكذب إنه حصل إى إتفاق بينه وبين الحكومة على توريث الحكم وقال إنه هوه يتمنى أن تتوحد القوى السياسية فى مصر لمناقشة الفساد إللى سببه الحكومة وياريت إللى عمالين يلالوا ويهذوا بكلمات المقصود منها إنهم يخلوا الشعب يكره الإخوان لإن حسرتهم كانت للركب لما شافوا فى الإنتخابات حب الشعب ليهم ياريت يخلوا عندهم نقطة دم ويعرفوا إن الإخوان ناس بتعرف ربنا وعمرهم ما ردوا على الأفعال الحقيرة التى يتصرفها الحاكم وإبنه لتوريث الحكم والتى مقصود بها تفتييت الإخوان بعد أن شوهوا صورتهم أمام أمريكا لكى يظهروا أنهم لا بديل لهم يصلح لسرقة مصر ونهبها"
posted = "2006-10-26"
text = "يارب طهر مصر من اللامبارك وسوزان اليهودية بنت التمرجية الحقيرة وجمال الشاذ المدمن وأخوه الحرامى وأنصر مصر وأحفظها من هذه العصابة اللهم آمين"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

