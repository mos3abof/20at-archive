author = "مواطن مصري"
posted = "2006-10-25"
text = "النظام الي ماشي عليه العميل مبارك وابنه القزم جمال ولجنة السياسات(لجنة الاربعين حرامي) ههو نظام فرق تسد يعني سيب المعارضة تشتم الاخوان والاخوان يخالف المعارضة, والشعب في الاخر هو الي مطحون والحزب اللاوطني واللاديموقراطي جاثم علي الجميع وراكب علي البلد وسرقها هو ومبارك وابنه والاربعين حرامي بتوع لجنة السياسات<br />وطظ في الشعب"
