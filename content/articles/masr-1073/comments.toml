subject = "افهموا ان كنتم عاوزين الحقيقة"
author = "ياسر ابو عمار"
posted = "2006-10-20"
text = "احب اقول لجميع الاخوة الذين يصطادون فى الماء العكر ،يا جماعة ،الاخوان لم ولن يوافقوا على التوريث ،لو قرات تصريحات الدكتور حبيب بشكل من الاريحية وعدم اخذ موقف مسبق هتعرف -لو حبيت -ان الراجل بيقول للشعب المصرى اتحركوا ،الاخوان لوحدهم مش هيقدروا يعملوا حاجة ،اما ان الكل يروح يشرب عصير قصب ويقول ان الاخوان موجودين وهيمنعوا التوريث فهو ده اللى مرفوض ،لازم الكل يتحرك ،اما ان الاخوان يكونوا المسئولين لوحدهم عن مقاومة التوريث فهذا امر غير معقول او مقبول ،التوريث لن يتوقف الا لو تحرك الشعب المصرى كله ،الدكتور حبيب احب انه يقول المعنى ده ،علشان ما حدش يبنى احلام فى الهوا ،اما انه الاخوان وافقوا على التوريث فهذا امر مرفوض ولم يقله اى واحد من الاخوان فضلا عن قادتهم ،ارجوكم افهموا كلام الناس وبلاش مزايدة الله يكرمكم ،احسن الواحد قرب يتجنن من بعض الاخوة اللى لابدين فى الدرة للاخوان ،ينتظرون اى تصريح فيروح رازع الكلمتين اللى عنده على الجهاز ببواسطة كلمة \"لصق \"دون النظر الى القضية او الموضوع ،المهم اشتم يا جدع فى الاخوان ،وكان الشتيمة فى الاخوان هى الطريق الى تحرير الاوطان من الذل والاستعباد الذى تعيش فيه ،احب اوجه سؤال اخير؛ لما الاخوان وافقوا على التوريث امال تسمى القاء الدكتور العريان ومرسى وغيرهم فى السجون لغاية دلوقتى ايه ،واعادة اعتقال الدكتور حسن الحيوان تسموها ايه ،والمطاردات اللى كانت مع بداية رمضان واغلاق المكتبات الاسلامية والاستيلاء منها على بضائع بالاف الجنيهات تبقى ايه ،استراتيجية للتغطية على الاتفاق اللى ابرمه الاخوان مع الحكومة /والله عيب"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

[[comments]]
order = 15
subject = "واهم على ده الحال"
author = "سعيد"
posted = "2006-10-21"
text = "الاخوان دول كالحرباء ياخذون الف لون ولون وبكره يطلحوا تصريح قوى ضد التوريث واهى ماشيه ، والمخدوعين ورائهم من الشعب ماشى كالعميان.<br />فهؤلاء الشباب هم الخشب الذى يلقى فى نيران تريد الاخوان ان تحرق بها البلد وتنيلها اكتر ماهى ، كل من يؤيد هذه الجماعه مهو مخدوووووووووع او صاحب مصلحه<br />الاخوان دول مع اللى يمشيلهم مصلحتهم ويضمن لهم البقاء ولو مصلحتهم مع بابا روما بندكيت هيسموا روحهم الاخوان المسلمين الكاثوليك."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

[[comments]]
order = 16
subject = "الحمد لله"
author = "مهندس صبرى"
posted = "2006-10-21"
text = "الحمد لله ان الشعب المصرى لسه بخير برضه وبدا يتحرر من اوهام جماعه الاخوان وبدا يتحرك نحو الفكر الصحيح والاسلام الصحيح وليس كما يشكله الاخوان على هواهم<br />واحب اقول للشباب اللى تعتقد انها حمله مدبره ضد الاخوان ، اقول له ياليتها حمله مدبره وان كانت فهى لصالحك وصالحى.<br />انما انتم معزورين ، لان الشباب يريد ان يلتف حول رمز صالح يسير وراءه وقد ظن انه وجد ضالته فى جماعه الاخوان المزعومه اقول لهم التفوا حول دينكم الصحيح وسيروا وراءه ولا تدعوا انفسكم التى شخص او جماعه تؤلف من الدين على هواها بل اتبعوا اصول الدين كما يمليه الله ورسوله وليس كما يمليه مهدى وزبانيته.<br />الحمد لله الذى يهدينا جميعا الى ما فيه صالح الامه بعيدا عن الاهواء و المصالح الشخصيه والشعارات الزائفه."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

[[comments]]
