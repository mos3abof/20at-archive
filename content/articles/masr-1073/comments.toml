[[comments]]
order = 5
subject = "المشكلة فى الهبل !!!!"
author = "الهبل هم شباب الإخوان الذين ألغوا عقولهم ولا يزالون يتكلمون عن التوريث ... الشاطر وشركاه أعلنوها صراحة أنهم سيعارضوا التوريث بالبق ولن ينزلوا الإخوان إلى الشارع .. والشباب الأهبل لا زال يدور على المنتديات ويتكلم على ضرورة منع التوريث يعنى نصدق مين بالضبط ، نصدق نائب المرشد الى قال أنى الشعب المصرى سلبى ولا نصدق الشاطر الى قال إنه هيعارض بالبق ولا نصدق الشباب الطيب الأهبل ... يا ريت يا هبل قبل أن تكتبوا يجب أن تذهبوا إلى من يقودوكم واسألوهم ماذا أعدوا لمنع التوريث ؟"
posted = "2006-10-20"
text = "ولماذا لم يضعوا خطة لحشد الناس لمنع التويث ؟<br />فعلا الى اختشوا ماتوا ، منتهى الإستغلال للشباب الطيب ، الكبار يتفقوا على عدم ممانعة التوريث ويتركون الشباب يهاتى على المنتديات .... يلا يا شاطر انت وهو بيتك بيتك روح لعمو المهندس الشاطر واستفهم منه بدل ما توجعوا دماغنا .... سلا م يا هبل"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

[[comments]]
order = 6
subject = "حوار عضو إخوانى سابق مع المهندس الشاطر"
author = "حوار شخصى مع نائب المرشد المهندس خيرت الشاطر"
posted = "2006-10-20"
text = "واحد من الإخوان سابقاً | 10/19/2006 5:17:44 AM<br />فى أحد أيام رمضان فى صلاة التراويح قابلت المهندس خيرت الشاطر فى الصلاة ودار بيننا هذا الحوار: انا:كنت عايز أسأل عن موقف الاخوان من موضوع التوريث علشان تردد كلام حول انه مش حاسم وان المرشد قال شروط قد يتم الالتزام بها شكليا زى خروج جمال من القصر الرئاسى وترشحه بعيدا عن والده وتعديل بعض مواد الدستور وكل دية حاجات ممكن تتعمل بس مش هتغير من التوريث فى جوهره شئ. م.خيرت:بص بعيدا عن اى تصريح صحفى هنا او هناك موقف الاخوان من التوريث واضح، فهم يرفضون التوريث ، ثم عقب قائلا بس برضه احنا مش هننزل الشارع علشان نقف ضد التوريث علشان كل مرة بننزل فيها الشارع بنلاقى الاخوان لوحدهم ومحدش بينزل واحنا لوحدنا بندفع الثمن. أنا:يعنى فى الاخر رفض التوريث نظرى فقط؟ م.خيرت: يعنى هو انكار باللسان وهى درجة، وعندما تستطيع انت (موجها كلامه لى) تجيب 100 واحد من غير الاخوان يمشوا معانا فى مظاهرة نبقى ننزل الشارع علشان التوريث. أنا: بس احنا الاخوان لم نستهدف تحريك الناس فى هذه القضية او فى قضايا سياسية من هذا القبيل اصلا، يعنى احنا كنا فقط نحاول دعوتهم للدين او تجنيد الناس لضمهم لفكر الاخوان، لكن انت بتتكلم عن تحريك الناس بغض النظر عن رؤيتهم للإخوان وهذا لم نحاول فعله من قبل! م.خيرت: طيب يبقى نصلح العيوب اللى عندنا الآول وبعدين نتكلم فى الموضوع ده. هذا الحوار اصابنى بهم وغم لا حدود له، مع انى كان لدى علم بهذا الموقف تقريبا من احد الاخوان قبل هذا الحوار ، لكن زى ما تقول كان لدى امل ان يطلع الاخ اللى اخبرنى مش فاهم قوى وان القيادة لديها كلاماًاخر واذا بالقيادة تصيبنى بالاحباط الشديد. وتعليقا على هذا الموقف وموق<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

[[comments]]
order = 7
subject = "نصيحة لأخى الصغير"
author = "مصطفى الحسينى"
posted = "2006-10-20"
text = "أخى الحبيب رضا<br />تعلم كم نحترمك ونقدر عضويتك فى الإخوان ولكن وبعد أن فرأت حوار العضو الإخوانى السابق مع المهندس الشاطر أقول لك يا أخى .. اتركهم والتفت إلى مصلحتك !! هؤلاء خدعوك .. حاول أن تقرأ رسالة هذا العضو الإخوانى وستعلم كم المرارة التى شعر بها .. اتركهم فهم لا يعرفون سوى الضحك على السذج أمثالك ، لقد أخبرتنى أنكم ستوقفون التوريث وأن القادة لديهم خطة ولكن وبعد أن قرأت الرسالة علمت أنك الوحيد المتحمس فى هذه الجماعة ."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

[[comments]]
order = 8
subject = "مش فاهم"
author = "أنا فعلا مش فاهم الى بيحصل ، انا مش من الإخوان ، بسى أنا رحت انتخبتهم وكنت معاهم على طول أيام الإنتخابات .. أنا مخى اتلخبط ..."
posted = "2006-10-20"
text = "هما الإخوان عاوزين ايه بالظبط ؟<br />عاوز الشعب يصحى ولى يفضل نايم ؟<br />الكلام الى قاله الدكتور حبيب كلام ييئس ..<br />هو فيه إيه ؟<br />يا ناس قولولى لأنى الكلام الى كتبه عضو الإخوان فى حوار مع المهندس الشاطر كلام ييئس يعنى الإخوان مش ناووين يعملوا حاجة وبعدين شباب ساذج يقنعنا بأن التوريث خطر ويجب محاربته .. خلاص مخى اتلخبط ،<br />هما بيضحكوا على مين بالضبط ؟<br />عالحكومة ؟<br />ولا على الناس ؟<br />ولا على الشباب الى بيبعتوهم هنا فى الموقع ده ؟<br />خو فيه ايه بالضبظ ؟"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014348/http://masr.20at.com:80/article.php?sid=1073"

