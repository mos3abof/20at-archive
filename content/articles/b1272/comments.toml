text = "لحلول شهر رمضان الكريم أعادة الله علينا وعليكم<br />وعلى الامة الاسلامية بالخير واليمن والبركات .<br />وكان الرسول صلى الله عليه وسلم<br />إذا دخل رجب دعا الله أن يبلغه شهر رمضان فيقول : (اللهم بارك لنا في رجب وشعبان ، وبلغنا رمضان) . وذلك حباً وكرامة لرمضان ، وينبغي على المسلم – كل مسلم – في هذا الشهر المبارك أن يكون له برنامج عمل ، يحاول بما يستطيع أن ينهل منه ، ويفوز بعظيم ثوابه .<br />وأحب أن أشاركك فى هذا الموضوع ب<br />30 نصيحة فى الشهر الكريم<br />1- التوبة النصوح هي أساس البرنامج وأول بنوده ، ومن شروطها الإقلاع عن الذنب ، والندم عليه وعدم العودة له ، والعمل الصالح مع الإيمان ، ورد الحقوق المادية والمعنوية إلى أصحابها .<br />2- حفظ السمع والبصر واللسان عن المحرمات في نهار رمضان ولياليه .<br />3- المحافظة على السنن والنوافل .<br />4- المحافظة على صلاة الجماعة للفروض الخمسة في المسجد .<br />5- الحرص على شهود الآذان ، وتكبيرة الإحرام مع الإمام ، والوقوف في الصفوف الأولى .<br />6- المحافظة على صلاة التراويح ، وكذلك صلاة الشفع والوتر .<br />7- المحافظة على قيام الليل .<br />8- قراءة جزء من القرآن – على الأقل – يومياً .<br />9- حفظ بعض آيات القرآن يومياً .<br />10- حفظ حديث شريف أو اكثر يومياً .<br />11- صلة الرحم ، ومشاركة المسلمين أحوالهم .<br />12- ذكر الله وتسبيحه في كل وقت ، مع المحافظة على أذكار الصباح والمساء.<br />13- التبرع بإفطار صائم أو أكثر كل يوم ، ولم بشق تمرة .<br />14- تقديم صدقة لمسكين أو محتاج كل يوم ، ولو بأقل القليل .<br />15- المحافظة على صلاة الضحى .<br />16- صلاة ركعتين بعد كل وضوء .<br />17- حضور دروس العلم .<br />18- تعلم باب في الفقه كل يوم .<br />19- قراءة مختصرة في السيرة النبوية والعقيدة .<br />20- محاولة إصلاح ذات البين .<br />21- الدعاء عند الإفطار بجوامع الكلم .<br />22- الكرم والبذل والسخاء ومساعدة الآخرين .<br />23- الدعوة إلى الله والأمر بالمعروف والنهي عن المنكر .<br />24- نصرة المسلمين المجاهدين في كل مكان .<br />25- تعجيل الفطور وتأخير السحور .<br />26- بر الوالدين والأقربين ، الأحياء منهم والموتى .<br />27- اعتكاف العشر الأواخر من الشهر .<br />28- أداء العمرة ، فعمرة رمضان تعدل حجة مع الرسول صلى الله عليه وسلم.<br />29- المحافظة على أداء صلاة العيد مع المسلمين .<br />30- صيام الستة البيض من شوال"
