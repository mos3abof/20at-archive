text = "صاحب السمو الملكي الأمير الوليد بن طلال بن عبدالعزيز أل سعود . حفظة الله ورعاه<br />السلام عليكم ورحمة الله وبركاتة<br />اسعد الله اوقعتك نرجو من السادة الكرام<br />التوجه لى موقع الامير الوليد ابن طلال حفظة الله<br />اخيكم سمل جلال سودانى الجنسية"
