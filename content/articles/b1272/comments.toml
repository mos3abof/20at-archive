text = "منى يا رحلة سنين حلوه وبلسم جراح مرة<br />الحروف تعجز تفيك وصفك وتنحنى هاماتها<br />أسمح أبوح نبضى بالهوى الجياش وأكتب سنين الشوق<br />وأسمح أسافر فيك مشوار العديل والزين وهموم عمر ماشى<br />وأسمح أحاجى الناس عن همسة جمال الليل فى حضنك الدافى<br />وعن صحوة حنين الشوق لما الرحيل يبعدنا<br />وعن فرحة الأولاد لما السمر يجمعنا<br />وعن بردة التحنان لما الهجير يحرقنا<br />وعن فرحا سقانا الريد وأزهر فيافينا<br />وعن حزنا جفانا النوم وأدمع مآقينا<br />عن كل الحصل فينا فى غفلة الأوهام<br />أكتب أقول للناس عن أجمل خصال الناس<br />عن صورة حبيبتى النادرة وملامح الأخلاص<br />أكتب حبيبتى الرائعة بنور حروف قمرية<br />وأسكب فى دروب عشقى ألوانها الوردية<br />وأتحدى العيون الحاسده وكل النفوس الفاسده<br />تسرق جمال الريد وتزرع شواك الفرقة<br />وأحاجى الصغار الكبروا عن أمهم الشامخة<br />كيفن بدينا الريد وزرعنا شتلاتم<br />وكيف شقانا الهم لينالو أحلامهم<br />ياشمس ضواية تخضر زروع القيف<br />ياجنة عمرانة ترسم زهورالورد<br />يا سحابة شايلة الخير تروى شقوق الجوع<br />يا لحنا يهز النفس ونغما يداديها<br />من غيرك يواسينا لما المحن تتطرانا<br />ومن غيرك يمنينا لما الكدور تهزمنا<br />أنت الحروف الشايلة ضي الشمس والنور<br />تزرع شتول النور فى عتمة حوارى الليل<br />وتكتب بالوانها بهجة دروب نمشيها<br />أنت بحور روعة تتوه فى وصفك الكلمات<br />ويبقى المقال فيك سحابة مطر عابرة تطفئ حريق الشوق<br />وخفقة حروف جامدة ترسم خطى الأشعار<br />وتبقى حبيبتى العالية تهزم الكلمات<br />وتبقى كبيرة كتير على أروع الأوصاف<br />وتبقى حبيبة روح دايمه فى الخفقات"
