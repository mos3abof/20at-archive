text = "أولاً : - عشر وسائل لإستقبال رمضان وعشر حوافز لإستغلاله<br />الحمد لله رب العالمين والصلاة والسلام على أشرف الأنبياء والمرسلين سيدنا محمد وعلى آله وصحبه أجمعين أما بعد :<br />هذه رسالة موجهة لكل مسلم أدرك رمضان وهو في صحة وعافية ، لكي يستغله في طاعة الله تعالى ، وحاولت أن تكون هذه الرسالة في وسائل وحوافز إيمانية تبعث في نفس المؤمن الهمة ، والحماس في عبادة الله تعالى في هذا الشهر الكريم ، فكانت بعنوان \" عشر وسائل لاستقبال رمضان وعشرة حوافز لاستغلاله \"<br />فأسأل الله تعالى التوفيق والسداد وأن يجعل عملي هذا خالصاً لوجهه الكريم ، وصلى الله على سيدنا محمد وآله وصحبه أجمعين .<br />*** كيف نستقبل رمضان ؟<br />س: ما هي الطرق السليمة لاستقبال هذا الشهر الكريم ؟<br />ينبغي للمسلم أن لا يفرط في مواسم الطاعات ، وأن يكون من السابقين إليها ومن المتنافسين فيها ، قال الله تعالى { وفي ذلك فليتنافس المتنافسون } [المطففين :26]<br />فاحرص أخي المسلم على استقبال رمضان بالطرق السليمة التالية :<br />الطريقة الأولى : الدعاء بأن يبلغك الله شهر رمضان وأنت في صحة وعافية ، حتى تنشط في عبادة الله تعالى ، من صيام وقيام وذكر ، فقد روي عن أنس بن مالك – رضي الله عنه – أنه قال كان النبي صلى الله عليه وسلم إذا دخل رجب قال « اللهم بارك لنا في رجب وشعبان وبلغنا رمضان » رواه أحمد والطبراني – لطائف المعارف .<br />وكان السلف الصالح يدعون الله أن يبلغهم رمضان ، ثم يدعونه أن يتقبله منهم .<br />فإذا أهل هلال رمضان فادع الله وقل : ( الله أكبر اللهم أهله علينا بالأمن والإيمان والسلامة والإسلام ، والتوفيق لما تحب وترضى ، ربي وربك الله ) رواه الترمذي والدارمي وصححه ابن حبان .<br />الطريقة الثانية : الحمد والشكر على بلوغه : قال النووي رحمه الله في كتاب الأذكار ( اعلم أنه يستحب لمن تجددت له نعمة ظاهرة ، أو اندفعت عنه نقمة ظاهرة أن يسجد شكراً لله تعالى أو يثني بما هو أهله<br />وإن من أكبر نعم الله على العبد توفيقه للطاعة ، والعبادة فمجرد دخول شهر رمضان على المسلم وهو في صحة جيدة هي نعمة عظيمة ، تستحق الشكر والثناء على الله المنعم المتفضل بها ، فالحمد لله حمداً كثيراً كما ينبغي لجلال وجهه وعظيم سلطانه .<br />الطريقة الثالثة : الفرح والإبتهاج ، ثبت عن رسول الله صلى الله عليه وسلم أنه كان يبشر أصحابه بمجئ شهر رمضان فيقول : « جاءكم شهر رمضان ، شهر رمضان شهر مبارك كتب الله عليكم صيامه ، فيه تفتح أبواب الجنان وتغلق فيه أبواب الجحيم ... الحديث » أخرجه أحمد .<br />وقد كان سلفنا الصالح من صحابة رسول الله صلى الله عليه وسلم والتابعين لهم بإحسان يهتمون بشهر رمضان ويفرحون بقدومه ، وأي فرح أعظم من الإخبار بقرب رمضان موسم الخيرات وتنزل الرحمات .<br />الطريقة الرابعة : العزم والتخطيط المسبق للإستفادة من رمضان ، الكثيرون من الناس وللأسف الشديد حتى الملتزمين بهذا الدين يخططون تخطيطاً دقيقاً لأمور الدنيا ، ولكن قليلون هم الذين يخططون لأمور الآخرة ، وهذا ناتج عن عدم الإدراك لمهمة المؤمن في هذه الحياة ، ونسيان أو تناسي أن للمسلم فرصاً كثيرة مع الله ومواعيد مهمة لتربية نفسه حتى تثبت على هذا الأمر ، ومن أمثلة هذا التخطيط للآخرة ، التخطيط لاستغلال رمضان في الطاعات والعبادات ، فيضع المسلم له برنامجاً عملياً لاغتنام أيام وليالي رمضان في طاعة الله تعالى ، وهذه الرسالة التي بين يديك تساعدك على اغتنام رمضان في طاعة الله تعالى إن شاء الله تعالى .<br />الطريقة الخامسة : عقد العزم الصادق على اغتنامه وعمارة أوقاته بالأعمال الصالحة ، فمن صدق الله صدقه وأعانه على الطاعة ويسر له سبل الخير ، قال الله عز وجل { فلو صدقوا الله لكان خيراً لهم } [محمد:21]<br />الطريقة السادسة : العلم والفقه بأحكام رمضان ، فيجب على المؤمن أن يعبد الله على علم ، ولا يعذر بجهل الفرائض التي فرضها الله على العباد ، ومن ذلك صوم رمضان فينبغي للمسلم أن يتعلم مسائل الصوم وأحكامه قبل مجيئه ، ليكون صومه صحيحاً مقبولاً عند الله تعالى { فاسألو أهل الذكر إن كنتم لا تعلمون } [الأنبياء:7]<br />الطريقة السابعة : علينا أن نستقبله بالعزم على ترك الآثام والسيئات ، والتوبة الصادقة من جميع الذنوب ، والإقلاع عنها وعدم العودة إليها ، فهو شهر التوبة فمن لم يتب فيه فمتى يتوب ؟<br />قال الله تعالى { وتوبوا إلى الله جميعاً أيها المؤمنون لعلكم تفلحون } [النور:31]<br />الطريقة الثامنة : التهيئة النفسية والروحية من خلال القراءة والإطلاع على الكتب والرسائل ، وسماع الأشرطة الإسلامية من المحاضرات والدروس التي تبين فضائل الصوم وأحكامه حتى تتهيأ النفس للطاعة فيه ، فكان النبي صلى الله عليه وسلم يهئ نفوس أصحابه لاستغلال هذا الشهر فيقول في آخر يوم من شعبان : « جاءكم شهر رمضان ... الحديث » أخرجه أحمد والنسائي – لطائف المعارف .<br />الطريقة التاسعة : الإعداد الجيد للدعوة إلى الله فيه ، من خلال :<br />1- تحضير بعض الكلمات والتوجيهات تحضيراً جيداً لإلقائها في مسجد الحي .<br />2- توزيع الكتيبات والرسائل الوعظية<br />والفقهية المتعلقة برمضان على المصلين وأهل الحي .<br />3- إعداد – هدية رمضانية – وبإمكانك أن تستخدم في ذلك الظرف بأن تضع فيه شريطين وكتيب ، وتكتب عليه هدية رمضان .<br />4- التذكير بالفقراء والمساكين ، وبذل الصدقات والزكاة لهم .<br />الطريقة العاشرة : نستقبل رمضان بفتح صفحة بيضاء مشرقة مع :<br />أ‌- الله سبحانه وتعالى بالتوبة الصادقة .<br />ب‌- الرسول صلى الله عليه وسلم بطاعته فيما أمر واجتناب ما نهى عنه وزجر .<br />ت‌- مع الوالدين والأقارب والأرحام ، والزوجة والأولاد بالبر والصلة .<br />ث‌- مع المجتمع الذي تعيش فيه حتى تكون عبداً صالحاً ونافعاً ، قال صلى الله عليه وسلم « أفضل الناس أنفعهم للناس »<br />هكذا يستقبل المسلم رمضان استقبال الأرض العطشى للمطر ، واستقبال المريض للطبيب المداوي ، واستقبال الحبيب للغائب المنتظر . فاللهم بلغنا رمضان وتقبله منا إن أنت السميع العليم .<br />• كيف تتحمس لاستغلال رمضان ?<br />لكي تتحمس لاستغلال رمضان في الطاعات اتبع التعليمات التالية<br />ولنا بقية فى الحديث ،،،،،،<br />التحية لك يا صاحب السمو الامير وليد ابن طلال حفظك الله من الشر اخيكم سمل ود الولياب ولاية الشمالية السودان وادى حلفا وبحيرة النوبة<br />dal_429@hotmail.com"
