text = "واريد ان اضيف لفضائل رمضان المعظم مايلى:]<br />الفوائد الطبية لصيام رمضان<br />إن هدف صوم رمضان هو استجابة لله عز وجل الذي قال في كتابه الكريم ( يا أيها الذين آ منوا كتب عليكم الصيام كما كتب على الذين من قبلكم لعلكم تتقون ) فالصيام فريضة بين العبد وربه تكفل سبحانه وتعالى بالمكافأة عليها كما قال في الحديث القدسي ( كل عمل ابن آدم له إلا الصوم فهو لي وأنا اجزي به ) . ومع ذلك فإن للصيام فوائد صحية كثيرة لا يُغفل عنها، فرمضان هو شهر للتدريب الجسمي والروحي مع الأمل أن يستمر ذلك لما بعد رمضان.<br />وفي عام 1994 عُقد المؤتمر الأول لفوائد رمضان الصحية في مدينة الدار البيضاء في المغرب ونوقشت فيه حوالي (50) ورقة بحث من مختلف أنحاء العالم ومن قبل علماء مسلمين وغير مسلمين تضمنت كثيرا من الفوائد الصحية لصوم رمضان .<br />ومن الفوائد الطبية لصيام رمضان:<br />- راحة لجهاز الهضم : رمضان هو فترة راحة للجهاز الهضمي المسؤول عن استهلاك واستقلاب الطعام ، وبالتالي فالكبد أيضا يأخذ فرصة استراحة كونه معمل استقلاب الغذاء الرئيسي في الجسم . ولتحقيق هذه الغاية على المسلمين أن يلتزموا بسنة الرسول -صلى الله عليه وسلم -بعدم الإكثار في وجبة الإفطار وقد قال- صلى الله عليه وسلم-: ما ملأ ابن آدم وعاء شرا من بطنه. وبهذا يُضمن بقاء النشاط وعدم الخمول والاستعداد للتمارين المعتدلة بعد فترة راحة قصيرة ألا وهي صلاة التراويح التي ثبت أن حركة العضلات والمفاصل في كل ركعة تستهلك 10 حريرات. ومن الفوائد الطبية أن يبدأ الإفطار بتناول بعض التمرات ( كما هي السنة النبوية ) فالتمر غني بسكريّ الغلوكوز والفركتوز اللذين لهما فائدة حريرية كبيرة وخاصة للدماغ ، ويفيدان في رفع مستوى السكر في الدم تدريجيا مما يخفف شعور الجوع ويقلل الحاجة إلى كمية اكبر من الطعام .<br />- نقص الوزن المعتدل: خلال الصيام ينقص استهلاك السكريات وبالتالي فإن مستوى سكر الدم ينخفض وهذا يجعل الجسم يعتمد على مخزونه من السكر لحرقه وتأمين الحريرات اللازمة للاستقلاب ، ويأتي مخزون السكر من الكبد بتفكيك مادة Glycogen وكذلك من تحطيم الدهون في النسيج الشحمي لتحويلها إلى حريرات وطاقة لازمة لفعاليات الجسم وهذا بالتالي ينتج عنه نقص معتدل في وزن الجسم ، ولهذا يعتبر الصيام فائدة كبيرة لدى زائدي الوزن ، وحتى لمرضى السكري المعتدل غير المعتمدين على الأنسولين \"Stable non-insulin diabetes \" .<br />- نقص مستوى كولسترول الدم: أثبتت دراسات عديدة انخفاض مستوى الكولسترول في الدم أثناء الصيام وانخفاض نسبة ترسبه على جدران الشرايين الدموية ، وهذا بدوره يقلل من الجلطات القلبية والدماغية ويجنب ارتفاع الضغط الدموي . ونقص شحوم الدم يساعد بدوره على التقليل من حصيات المرارة والطرق الصفراوية . قال-صلى الله عليه وسلم-: \" صوموا تصحّوا \".<br />- استراحة للجهاز الكلوي : بينت بعض الدراسات أن عدم تناول الماء لحوالي 10-12 ساعة ليس بالضرورة سيئ بل هو مفيد في كثير من الأحيان ، فتركيز سوائل الجسم تزداد محدثة تجفافا خفيفا يحتمله الجسم لوجود كفاية من مخزون السوائل فيه ، وطالما أن الشخص لا يشكو من حصيات كلوية فإن هذا يعطي الكليتين استراحة مؤقتة للتخلص من الفضلات، ومع ذلك فالسنة النبوية تقتضي بتأخير السحور والتعجيل في الفطور مما يقلل الفترة الزمنية للتجفاف قدر الامكان . ونقص السوائل يؤدي بدوره لنقص خفيف بضغط الدم يحتمله الشخص العادي ويستفيد منه من يشكو ارتفاع الضغط الدموي .<br />- فوائد تربوية ونفسية: يفيد رمضان في كبح جماح النفس وتربيتها بترك بعض العادات السيئة وخاصة عندما يضطر المدخن لترك التدخين ولو مؤقتا على أمل تركه نهائيا ، وكذلك عادة شرب القهوة والشاي بكثرة . وفوائد رمضان النفسية كثيرة ، فالصائم يشعر بالطمأنينة والراحة النفسية والفكرية ويحاول الابتعاد عما يعكر صفو الصيام من محرمات ومنغصات ويحافظ على ضوابط السلوك الجيدة مما ينعكس إيجابا على المجتمع عموما. قال-صلى الله عليه وسلم-: \" الصيام جُنّة ، فإذا صام أحدكم فلا يرفث ولا يجهل وان امرؤٌ قاتله أو شاتمه فليقل إني صائم إني صائم \" . وقد أثبتت دراسات عديدة انخفاض نسبة الجريمة بوضوح في البلاد الإسلامية خلال شهر رمضان.<br />وكلمة أخيرة بخصوص من يعانون مرضا متقدما سواء أكان سكري شديدا أو نقص تروية قلبية أو حصيات كلوية حادة ، فهم مستثنون من صيام رمضان ولهم أن يأخذوا بالرخصة الشرعية ، قال تعالى :\".. فمن كان منكم مريضا أو على سفر فعدة من أيام أخر يريد الله بكم اليسر ولا يريد بكم العسر\""
