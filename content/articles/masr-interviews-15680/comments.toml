posted = "2010-03-10"
text = "برافوا عليك يادكتور -والله لو فيه زيك الف رجل بس لتغير حال البلد دى<br />وحسبنا الله ونعم الوكيل فيما يسمى بإرهاب الدولة (امن الدولة)<br />ولكل ظالم نهاية وان شاء الله تكون فى القريب العاجل —قولوا امين<br />إ"
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314030603/http://www.20at.com:80/masr/interviews/15680-2010-03-09-18-11-48.html"

