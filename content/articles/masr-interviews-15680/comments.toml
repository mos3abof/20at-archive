author = "الزابط هيترقى"
posted = "2010-03-10"
text = "انتم ناسيين اننا فى دولة فاسدة ومحكومة بالامن<br />ولا احد هياخد من الزابط حق ولا باطل وهيلبسوة تهمة حشيش وهيحطوا فى دولابة حتة حشيش ويتم التفتيش قانونى ويدخل السجن<br />وفى بعض الحالات بيدخلوا احدى قريباتة قضية اداب اذلالا للشخص والتنكيل بة<br />يظهر اننا سنعود الى عصر كل واحد ياخد حقة بايدة<br />ويا ابنى خد لك فرد والبد فى الجبل وطخ لك عيارين"
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314030603/http://www.20at.com:80/masr/interviews/15680-2010-03-09-18-11-48.html"

