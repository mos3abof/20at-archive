author = "hesham"
posted = "2010-03-09"
text = "هل رأيتم كم هم جبناء ؟؟ لقد أحتبسوا الرجل حتى تزول أثار الضرب … لأين الرجولة ، اين الشجاعة فى ذلك ؟؟؟ هل تتحرك نقابة الأطباء لنصرة أعضاءها ؟ هل يتحرك الدكتور حمدى السيد ؟؟؟ هل تسرع النيابة فى التحقيقات وإحالة هذا الضابط للمحاكمة ؟ هل يوجه له النائب العام الإتهام بالقبض والإحتجاز دون وجه حق ؟ هل يوجه له إتهام إستعمال القسوة ؟؟؟<br />ما حدث دليلا قويا على انهم يرتعدون خوفا ويرتعشون … ولن نسكت ولن نيأس ولن نكل … لقد غادر القطار المحطة الأولى … والذى يقف امامه لا يلومن إلا نفسه"
archived = "2010-03-14"
capture_url = "https://web.archive.org/web/20100314030603/http://www.20at.com:80/masr/interviews/15680-2010-03-09-18-11-48.html"

