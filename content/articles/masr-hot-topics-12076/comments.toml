[[comments]]
order = 1
subject = ""
author = "سعيد دوت -نت"
posted = "2009-05-14"
text = "لا يمكن ابدا حجب المواقع عمليا —— دول الخليج حاولت وفشلت - هناك مواقع ت[ *** ]ر اى حظر واى رقابة<br />طيب واذا خلصنا من النت<br />فية قنوات اباحية شديدة الاباحية تبث من على الاقمار الاوروبية وتنشط ليلا ويتبادل الشباب افلامها<br />العملية محتاجة توعية وتربية دينية وقدوة حسنة وشغل الشباب فى اعمال مفيدة بدلا من البطالة وال[ *** ]ل والسهر ليلا والنوم نهارا<br />المشكلة فى اوقات الفراغ للشباب وتأخر سن الزواج<br />فكروا فى حلول عملية لتشغيل الشباب فى اعمال انتاجية وانشطة رياضية تبعدهم عن الوقوع فى تلك المهالك"
archived = "2009-05-17"
capture_url = "https://web.archive.org/web/20090517030203/http://www.20at.com:80/t7kyk/12076-2009-05-14-13-03-26.html"

