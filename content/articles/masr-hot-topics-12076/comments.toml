[[comments]]
order = 3
subject = ""
author = "أحمد القطب"
posted = "2009-05-15"
text = "التوعية، والتربية الأخلاقية والالتزام أسس لا غنى عنها، ولازم نعمل على بنائها في أنفسنا وأبناءنا<br />لكن الحجب كمان مهم… لأن ببساطة.. ابنك ممكن بكون متربي كويس، وزي الفل وماشي جنب الحيط.. ويدخل موقع بالغلط يشوف فيه حاجات ماكانتش تخطر على باله..<br />وممكن واحد ثاني يكون محترم وأخلاقه عاليه.. وتجيله لحظة يضعف… الشق الأخطر من المشكلة، إن المغريات لما بتكون كتير ومتاحة في أي وقت وبكل الصور، بيكون الوقوع فيها سهل جدا.."
archived = "2009-05-17"
capture_url = "https://web.archive.org/web/20090517030203/http://www.20at.com:80/t7kyk/12076-2009-05-14-13-03-26.html"

[[comments]]
order = 4
subject = ""
author = "خطأ فادح في الخبر"
posted = "2009-05-16"
text = "السلام عليكم<br />الاخ كاتب الخبر وقع في خطأ كبير عندما قال في الفقرة الثانية وقد لاقى الحكم تأييداً من جميع الأسر المصرية المحافظة، ثم عاد في الفقرة التالية ليقول ان اكثر من خمسين في المائة من المستطلع ارائهم في استطلاع لعشرينات اكدوا يشاهدون الافلام الاباحية وان النتيجة صادمة<br />فكيف هذا التناقض الغريب بين الفقرتين؟"
archived = "2009-05-17"
capture_url = "https://web.archive.org/web/20090517030203/http://www.20at.com:80/t7kyk/12076-2009-05-14-13-03-26.html"

[[comments]]
order = 5
subject = ""
author = "محمد جمال الدين"
posted = "2009-05-17"
text = "أكيد الخمسين فى المية دول من زوار الموقع<br />وعوضاً عن ذلك فمن خلال جس النبض الأجتماعى فى الشوارع المصرية<br />كانت هذه النتيجة .<br />لا توجد أسرة من الممكن ان تحزن لأجل ذلك الحكم<br />طب لما الأسر تحزن وتزعل … الشباب يعملوا ايه ؟ ينتحروا بقى<br />وليس بالضرورة ان يكون جمهور الموقع ممثلاً للشعب المصري .<br />وشكراً علي أهتمامك ومشاركتك التى نرحب بها دائماً وبجميع أنواع النقض الهادف"
archived = "2009-09-17"
capture_url = "https://web.archive.org/web/20090917014954/http://www.20at.com:80/masr/t7kyk/12076-2009-05-14-13-03-26.html"
