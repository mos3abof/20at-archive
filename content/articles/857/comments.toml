subject = "ايهاالسعودي العجيب"
author = "شريعة بن سعود..يارجل"
posted = "2006-02-26"
text = "ومامن كاتب الا سيمضي ....ويبقي الدهر ما كتبت يداه<br />فلا تكتب بقلمك غير شيئ ....يسرك في القيامة ان تراه<br />يامن تدعي انه لا يقام شرع الله في السعوديه حاذر مما تقول..فمنذ العصور الغابرة ..يسجن الدعاء ويبتلون ويصبرون ..<br />ومامن قائل بأن لا شريعة اسلاميية تطبق..<br />الم تسمع بما حدث للإمام ابي حنيفة مثلا..واحمد حنبل ...وغيرهم كثر..<br />سامحك الله ايهاالسعودي العجييييييـب"
