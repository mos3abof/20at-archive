author = "islam_physics@yahoo.com"
posted = "2006-03-18"
text = "لو انك قرأت كلامي فعلا لرأيت أن ثاني سطر اقول لك فيه حديث الرسول لما سئل عن السمع والطاعة لولي الأمر قالوا لا نسألك عن طاعة من اتقي ولكن نسألك عن طاعة من فعل كذا وكذا وذكروا الشر قال اسمعوا واطيعوا وقال الأمام احمد وهو من حضروا فتنة خلق القرأن وكان ولي الأمر حينها يأتي بالرجل اي العلماء فإن لم يقولوا بخلق القرأن وهو قول كفر يعذبهم او يقتلهم ومع ذلك قال الامام احمد قال لو ان لي دعوة مستجابة لدعوت بها للسلطان<br />ومن ناحية ولي الأمر إن الحجاج اخذ الحكم بالعنوة واستباح الحرم الشريف وقتل فيه صحابي ومع ذلك قال عبد الله بن عمر بن الخطاب واصلي وراء من غلب اي اخذ الحكم عنوة والأدلة كثير<br />وعن ما تقول عن بوش فهو يفرح بك لانك تقلب المسلمين علي وليهم وتهتك ديار المسلمين ثم انك نسيت انه رئيس لدولة كافرة وليست مسلمة فكيف يكون لنا وليا<br />اتق الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

[[comments]]
order = 16
subject = "متى تعود الى رشدك يامسكين"
author = "يا مسكين ، ما تقول به هو ما كان وما هو كائن من قبل ما ينيف على سبعين سنة ‘ فما هي النتيجة؟"
posted = "2006-03-18"
text = "زيادة الكقر ، زيادة الفجور ، تمكن العدو من ديار الاسلام .<br />إذن ثمة خطأ فيما تقول ، الخطأ هو الباس هؤلاء المجرمين لباس ولاة أمر المسلمين الشرعيين .<br />وهذا الذي اصابنا في مقتل ؛ حتى هنا ، وغلبنا العدو.<br />فاتقي الله -يامسكين - ولا تكن سببا في تأخير قيام دولة الشريعة التي يتفيأ ظلالها كل مسلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

[[comments]]
order = 17
subject = "قل هاتوا برهانكم إن كنتم صادقين"
author = "islam_physics@yahoo.com"
posted = "2006-03-19"
text = "أكلمك بالدليل وتكلمني بكلاماتك وأقول لك قال رسول الله -صلي الله عليه وسلم- وتقول لي كذا وكذا من دون علم ولا دليل مرتديا ثوب الواعي الفاهم المدرك لبواطن الأمور أين الدليل علي كلاماتك هل اتبع كلامك ام أتبع كلام رسول الله -صلي الله عليه وسلم-فما لكم كيف تحكمون..<br />والكلام هذه المرة ليس لك وإنما لمن يريدون حقا فهم الدين من العقلاء الذين يغارون علي دينهم فأنت من يقود الامة إلي الهلاك من جراء ما تدعو اليه من الخروج فحرام عليك ...<br />وإليك أيضا قول ابن تيمية-إن كنت تعرفه-<br />لإن تعيش 60 عام تحت حاكم ظالم خير من أن تبيت ليلة واحدة ولا تري عليك حاكم<br />فانظر هنا أثبت انه ربما كان هناك ظلم واقع علي الشعوب المحكومة ولكن علينا بالصبر والدعاء حتي يستريح بر أو يستراح من فاجر<br />وقال أيضا<br />ما أفلحت أمة خرجت - أي خرجت علي ولاتها-<br />شئ أخير<br />هل تظن أني أوافق علي الفجور وأبرر لهم ذلك ولكني أقول لك حكم الله وحكم رسوله فيما نحن فيه<br />ثم متي نخرج علي الحكام؟؟<br />إن الرسول-صلي الله عليه وسلم- قال إلا أن تروا منه كفرا بواحا عليكم فيه من الله برهان صدق رسول الله -صلي الله عليه وسلم - فأين الكفر البواح وأين البرهان علي ذلك ....<br />إسلام عبد السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

[[comments]]
order = 18
subject = "إن الله لا يغير ما بقوم حتي يغيروا ما بأنفسهم"
author = "islam_physics@yahoo.com"
posted = "2006-03-24"
text = "لا زلت تتكلم بلغة العاطفة حتي تجلب القلوب حولك ولكن هذا لن يمر علينا ولن نمرر باطلك الذي تدعو اليه ، فأنت لا تملك دليلا شرعيا واحدا- أي من الكتاب والسنة - علي ما تزعم أنه الحق ( وهو الخروج علي الحكام المسليمن)- وعلية يتضح كذبك الذي تتبجح به<br />فالحمد لله أفصحت عن منهجك تريد ان تخرب ديار الإسلام من جراء ما تدعو اليه فإن ما تدعو اليه يطيح برؤس كثير من المسلمين<br />فحرام عليك<br />ولينتبة المسلمين لمثل هذا<br />أخوكم إسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

[[comments]]
order = 19
subject = "مظلومين في السعوديه"
author = "عمار الفحل"
posted = "2006-04-02"
text = "السلام عليكم والله مظلومين في السعوديهانا والكثير من الناس المغتربين انا اعمل في السعوديه منذ سنتين ولم يعطيني حقوقي وراتبي حسبي الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

[[comments]]
order = 20
subject = "مظلوم في بلاد الحرمين"
author = "عمار الفحل"
posted = "2006-04-02"
text = "انا مظلوم في السعوديه اسمعوني يا ناس والله لا اكذب عليكم ظلمني كفيلي انا وجميع يلي على كفالته اين الحق في السعوديه لا يخاف الله عز وجل سنتين شغل ببلاش اين مكتب العمل اين حقوق الانسان لا اطلب صدقه اطالب بحقوقي مكتب العمل لا يصدقني ولاكن يصدق ابن بلده حسبي الله ونعم الوكيل ولا حول ولا قوة الا بالله (ان للظلم ظلمات يوم القيامه)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

