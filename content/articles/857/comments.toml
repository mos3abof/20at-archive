[[comments]]
order = 10
subject = "مفهوم تطبيق الشريعة"
author = "إن تطبيق الشريعة ليس في اقامة حد على ضعفاء الجنسيات كالبكستانية والهندية وغيرها ، فلم نسع بحد اقيم على أصحاب البشرة البيضاء كالانجليز والامريكان وسواهم."
posted = "2006-02-26"
text = "إن تطبيق الشريعة هو أن تنهج تلك الدولة في جميع اعمالها بما يتفق مع شيريعة محمد -صلى الله عليه وسلم - فلا تخرج عنه قيد أنمله ، وإن أعظم حقوق الاسلام هو موالاة المؤمنين ومعادات الكافرين ، اقرأ :لا يتخذ المؤمنين الكافرين أوليا من دون المؤمنين ، ومن يفعل ذلك فليس من الله في شي .<br />أي معنى لتطبيق الشريعة بعد قتل أولباء الله ، وفتح الاجواء من بحرية وجوية وبرية للكافر؛ ليشن بها الغارات على ديار الاسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

[[comments]]
order = 11
subject = "مصري يحب السعودية والسعوديين في الله"
author = "islam_physics@yahoo.com"
posted = "2006-03-07"
text = "السلام عليكم ورحمة الله وبركاته<br />إن من الغلط الكبير بل الفادح القبيح الذي ينم عن عدم فهم لشريعة محمد -صلي الله عليه وسلم - ذلك في الخلط بين الموالاه وبين المداراه وبين الاتقاء لشر هؤلاء الكفرة كما قال الله تعالي ( إلا أن تتقوا منهم تقاه ) ذلك لما نعيشه الان من ضعف لا يمكننا من أخذ جانب عربي إسلامي يقهر كل الانظمة الكافرة فليست المعاملة الاقتصادية بين المسلمين والكفار من الموالاه فلقد كان النبي -صلي الله عليه وسلم - يبيع ويشتري ويتعامل معهم بل انه مات ودرعة مرهون عند يهودي اليس ذلك من باب المعاملات الأقتصادية وعلي صعيد فتح الاجواء السعودية فهم اعلم منك بالسياسة وعندهم علماء الامه الاسلامية الأفاضل الكبار فهم اعلم شرعيا وسياسيا ولكن لك توضيح عندي عندما استعانت السعودية بامريكا كان ذلك لان الطاغية العراقي كان جبارا عجزت عنه الدول العربية وهذا طبيعي لان الدول العربية تعاني من ضعف في كل شئ وهذا ايضا لا يعارض الشريعة فنبينا -صلي الله عليه وسلم - استعان بكافر ليدله علي الطريق في الهجرة وأيضا تعاون مع اليهود في غزوة الاحزاب فليس ذلك من الموالاه هل قالت السعودية ان امريكا نحبها ونفضلها عن العرب بل كلها امور سياسية تحتاج الي علماء اكابر لا صغار يفتون بما لا يعلمون وحكام السعودية ليسوا انبياء فيمكن ان تكون لهم اخطاء فاتقوا الله ويكفي ان شريعة الله هي ما تحكمهم وإن لم تكن بلاد الحرمين بلاد الصحابة والبيت الحرام ومنبت الاسلام هي بلاد تقام فيها شعائر الاسلام فأين يكون الاسلام إذا واعلم ان في كل زمان كما قال رسولنا الكريم هناك من يكون علي الحق ظاهرا لايضرهم من خالفهم حتي يأتي أمر الله وهم كذلك فأين هؤلاء في وسط المسلمين ان لم تكن السعودية هي هذه البلاد<br />فاتقوا الله في كلماتكم فما يلفظ من قول الا لديه رقيب عتيد<br />والسلام عليكم ورحمة الله وبركاته<br />أخوكم إسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

[[comments]]
order = 12
subject = "اتق الله يا من تجادل عن الظلمة"
author = "يا من تجادل عن الظلمة ، اتق الله في نفسك ، فلا تجادل عن المجرمين ."
posted = "2006-03-12"
text = "تعترف بضعف الامة وتتناسى من سبب هذا الضعف<br />من تلاعب في أموال الامة ، وضيعها على شهواته ؟<br />من حجر على العقول فلا تفكر الا بما يشاء<br />من حجر على الالسن فلا تنطق الابما يشاء<br />من أفسد الشباب ، فشغلهم بتوافه الامور<br />من أخر الامة دهورا متطاولة .<br />اتق الله يا هذا ولا تجادل عن الطواغيت<br />(هَاأَنتُمْ هَؤُلاء جَادَلْتُمْ عَنْهُمْ فِي الْحَيَاةِ الدُّنْيَا فَمَن يُجَادِلُ اللَّهَ عَنْهُمْ يَوْمَ الْقِيَامَةِ أَم مَّن يَكُونُ عَلَيْهِمْ وَكِيلاً )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

[[comments]]
order = 13
subject = "رميتني بما أنت به أحق"
author = "islam_physics@yahoo.com"
posted = "2006-03-17"
text = "لو أنك لك باعا في كتب العلم لعرفت ما هي أحكام ولي الأمر ( الرئيس )<br />قال رسول الله صلي الله عليه وسلم- عليكم بالسمع والطاعة قالوا يارسول الله لا نسألك عن طاعة من إتقي وإنما نسألك عن من فعل كذا وكذا وذكروا الشر فقال عليكم بالسمع والطاعة وإن تأمر عليكم عبدا حبشيا<br />صدق رسول الله صلي الله عليه وسلم والحديث صحيح<br />ارأيت كيف يكون التعامل مع ولاة الأمور فقد نهي كل علماء الأمة الأكابر وأقرأ كتب بن تيمية وبن القيم وأليك الدليل أيضا<br />يقول رسولنا الكريم -صلي الله عليه وسلم-<br />من كان ناصحا لذي سلطان فلا يبديه علانية ليخلوا به وليأخذ علي يديه<br />ارأيت هكذا يكون التعامل والأدلة كثيرة في طريقة معاملة الحكام ولمن أراد الذيادة أغرقته بسيل من الأدلة إن شاء الله ثم إني لم أجادل عن أحد فإني أشهد الله أني لا أرضي أبدا عن الظلم أو علي أي شئ في مخالفة الشريعة ولكن ديننا يمنعنا من الخوض في الحكام وأختم بهذا الأثر عن الحسن البصري كان ماشيا وكان في خلافة الحجاج الذي أخذ الحكم رغم عن المسلمين بعدما قتل سيدنا عبد الله بن الزبير في الحرم وأخذ الحكم -هل بعد ذلك من تجبر - وكان يأتي بالناس فيقولوا بما يريد وإلا قتلهم ومع ذلك كله عندما سمع الحسن البصري رجلا يلعن الحجاج قال لا تفعل إنا نخاف إن رحل الحجاج أن تليكم القردة والخنازير فمن أعمالكم أورثتم وقال أيضا بن عمر بن الخطاب وأصلي وراء من غلب - أي لا أخرج عليه لا بقول ولا بفعل- هذا هو أمر النبي -صلي الله عليه وسلم- وهذا هو سلوك الصحابة في التعامل مع ولاة الأمور فلا نسبهم ولا نلعنهم بل علينا بالسمع والطاعة وإن أردت أن تتكلم في الدين فاستدل حتي يؤخذ منك ما تقول<br />أخوك إسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

[[comments]]
order = 14
subject = "من هو ولي أمر المسلمين؟؟"
author = "إن ولي أمر المسلمين المأمور بطاعته شرعا ، هو القائم بشرع الله المحارب لاعداء الله ، الذائد عن أعراض المسلمين ، المجتهد في نشر الاسلام ."
posted = "2006-03-17"
text = "وهل يعمل هذا ال سعود أو حسنى أو برويز ، حتى تكون لهم الولاية الشرعية .<br />يا مغبون ، أنهم على النقيض من هذا كله ، فهم حرب على الاسلام وأهله ، وسلم على الكفر وأهله.<br />وإن كانت الرئاسة هي دليل الولاية الشرعية ، فأتخذ بوش أماما لك فهو -والله - خير لك منهم ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

