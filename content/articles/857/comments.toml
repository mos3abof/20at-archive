text = "اخوانى واخواتى فلى الله ان علم الانسان بالذنب واصراره عليه هو كبيره والواضح ان الشباب يصرون على فعل المعاصى على امل الذهاب الى عمره لتكفير الذنب الم تسأل نفسك ماسيحدث لو توفاك الله وانت فى طريق الذهاب للعمره"
