[[comments]]
order = 3
subject = "ياسلام"
author = "بقى عندهم اللي يعمل زنب يقوم يروح يعمل عمره وبيستشهدوا بحدبث ((النبي عليه الصلاة والسلام)) طيب المفروض يكملوه لان فيه صغائر ممكن التوبه عنها بطرق كتيره جدا زي الصلاه والاستغفار والصوم لكن حديث النبي كان بيقول ((الصلاة اى الصلاو والجمعة الى الجمعه ورمضان اى رمضان والعمرة اى العمره مكفرات مابينهما اذا اجتنيت الكبائر ))والعمره جات في اخر الحديث لان عندك حاجات كتير جدا تكفر بيها قبل ما تعمل العمره ."
posted = "2006-02-25"
text = "لكن هنقول ايه دي ناس عايشه في رفاهيه ومش حاسيين بالناس اللي بيتجيب قوتها بالعافيه ويمكن في عمرهم كله مابيقدروش يعملوا ولوعمره واحده .... وهما بدال مابيطلعوا كل سنه كذا مره ممكن يساعدوا كام واحد بسيط على انه يطلع عمره ومايخافش لانه هياخد نفس ثوابه برضهمع العلم ان الانسان اللي ممكن يساعدوه دا ربنا يستجيب منه هو اكتر منهم ويكون عندهم دين اكتر منه .<br />لكن هنقول ايه.. دي ناس عايشه في رفاهيه والفلوس بتجيلها سهله .<br />طبعا الاخوه السعودين هيكرهوني دلوقتي ويقولو اني بحقد عليهم ...<br />لكن والله انا عمري مابحقد على حد لان دي ارزاق ناس .....وعموما برضه مش كل السعوديين كده فيه ناس بتعمل خير كتير ومابيعلنوش عنهلانهم عاوزين ثواب ربنا فقط وللناس دي بس انا بقدم وافر احترامي واعجابي باعمالهم الخيريه .<br />بس انا برضه مانكرش ان فيه عالم تافهه كتير ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

[[comments]]
order = 4
subject = "لماذا هذا الحقد؟؟؟"
author = "أنامن أبناء السعودية وكلي فخر"
posted = "2006-02-25"
text = "إخواني:<br />لا تبنو كلاما هامشيا دون ثوابت<br />في بلدي لا نجد الملاهي المختلطه<br />لايوجد مراقص وخمارات<br />لا يوجد سفور وراقصات<br />في بلدي:<br />المساااااااااااااااااااااجد<br />الدعااااااااااااااة<br />الخير بين<br />ومن قال أننا نحتكر بيت الله الحرام<br />سامحكم الله<br />إخوتي<br />شعبنا يحبكم ونحن أهل وإخوان في الدين قبل العروبه<br />إخوتي<br />من قال أنا شعب يعيش في رفاهيه؟؟؟؟؟؟<br />من قال أنا لان حس بمشاكلكم؟؟؟؟؟<br />تعالو وشاهدو ثم أحكمو<br />لاتنسو ماتبذله حكومتنا الغاليه أدامها الله لناوقت النكبات والمحن لكم<br />ولا تنسو ماقدمته للشعب المصري خاصة<br />شكرا لكم<br />وأتمنا أن يزول الحسدمن قلوبكم<br />أخوكم<br />سعودي وكلي فخر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

[[comments]]
order = 5
subject = "امممممم"
author = "امممم في السعودية اذنب و اعتمر ... امممم جميل جدا .."
posted = "2006-02-26"
text = "بس بأمانة ربنا يعني ... الراقصات المصريات الشهيرات بنات البلد و الفنانات المشهورات برضه هما اللي رايحين عمرة كل شوية .. ؟؟؟!؟! مش كدة و لا ايه ..!! يبقى يابابا الكلام ده عندنا وعندهم ..<br />... كل المسلمين بيذنبوا و بيروحوا عمرة .. و انا مش بلوم حد فيهم .. حتى الراقصات .. ربنا يهديهم و يهدينا يا رب .. الانسان لما يخطئ يروح يكفر عن ذنبه باستطاعته ...<br />و انا مع الاخ اللي قال انه لا يصح انه الانسان ينوي يعمل المعصية وينوي انه يكفر بالعمرة ...<br />وربنا يهدينا و يرزقنا زيارة بيته الحرام مرات و مرات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

[[comments]]
order = 6
subject = "اممممم تاني"
author = "نسيت اقول حاجة .."
posted = "2006-02-26"
text = "لا اعتقد انه العمرة هي الوسيلة الوحيدة لمغفرة الذنوب، يا ريت تصححولي لو كلامي مش صح ..<br />من مكفرات الذنوب التوبة ..<br />شروط التوبة لا تشمل العمرة ..<br />النية .. الاقلاع عن الذنب ..رد الحقوق لو كان فيه حقوق للناس .. (يارب ما اكون نسين شئ<br />أما بقى الحاجات اللي تساعد على التطهر من الذنوب / منها الصلوات الخمس (كفارة لما بينها لو لم ترتكب كبيرة من الكبائر )<br />الوضوء . .. التوبة .... الاستغفار... الادعية المأثورة (مثل دعاء الاستفتاح في الصلاة و غيره )..<br />ايه تاني ؟؟؟!<br />اللي يعرف حاجة اضافية يا ريت ينورنا ..<br />جزاكم الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

