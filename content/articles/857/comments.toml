[[comments]]
order = 22
subject = "لكم جميعاااااااااااا اقول"
author = "اماراتي"
posted = "2006-07-01"
text = "لكم جميعا اقول<br />ان السعودية هي بلاد التوحيد<br />وقد قدمت حكومة آل سعود خدمة للإسلام والمسلمين بفضل من الله تعالى لشتى بقاع الارض لخدمة هذا الدين العظيم . وان اهم ماقامت بة وتقوم به هو نشر العقيدة الصحيحة التي قام بها الامام المجدد رحمة الله مع آل سعود عندما كانت الشركيات منشرة كالمزارات و قبور الأولياء والمنتشرة والعياذ بالله في اغلب الدول الاسلامية والعربية للأسف وذلك بجهلهم لهذا الدين العظيم لان الرسالة التى ارسل الله تعالى به نبية صلى الله علية وسلم هي لا اله الله محمد رسول الله ،، والذي لايفهم فاليذهب ليرى شعار الدولة السعودية حفظها الله على علمها الاخضر ،،،،<br />اللهم احفظ امراء وملوك وحكام جزيرة العرب من اهل الاهواء والنفاق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124054/http://www.20at.com/article2.php?sid=492"

