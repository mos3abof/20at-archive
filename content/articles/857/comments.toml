text = "الاخوة السعوديين فهمونا غلط<br />احنا بنتكلم عن عن طريقة التفكير نفسها<br />ان تفعل الذنب عالما انك ستتوب في العمرة<br />اما اننا نخص السعوديين فلانهم بالطبيعة الجغرافية علي الاقل ميسر عليهم الذهاب للعمرة والحج .<br />اخيرا لي تعليقات كثيرة عن المجتمع السعودي لم بجب عنها احد واخرها في موضوع سينماتك ارجو الرد عليها لافهم اين الخلل في تطبيق الشريعة وعنواني هو<br />kokorah@maktoob.com<br />وسلام<br />Dabdoob"
