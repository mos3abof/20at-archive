subject = "منذ خشونه حوافري....."
author = "هووووووبة"
posted = "2006-06-29"
text = "هواياتي رقم واحد افصفص الكتاب واجيب قراره ...<br />عربي عنجليزي ادب شعر قصه متفرقش ....<br />جنب القهوة ,الشاي ,\"ولون بحب الشاي اكتر مع البن فظيع... \"الحلبه الحصي, ينسون, يتفكرون حيتقره يعني حيتقره ..<br />بس مع احترامي لريك متعه القراءة في مسكه الكتاب....<br />افضل الاماكن \" البلكونه\" الهو ايطس الطسه وانسي خصوصاساعه العصاري<br />وقلبتي الموووواجع..."
