[[comments]]
order = 1
subject = "اه يا هبهوب"
author = "نيفين..نيفى..نوفا"
posted = "2006-06-29"
text = "صحيح يا هوبه ايه احسن من مسكه الكتاب ساعه العصريه على السطح بما ان البيت بتاعنا(سيطره راس المال ة الاقطاع)<br />و معاه فنجان القهوه التمام<br />بس مش اى كتاب ياسلام لو حاجه لكامل الشناوى<br />و مش اى قهوه يا سلام و سلم لو قهوه مانو تركى<br />ياااه دا الواحد ينسى الدنيا<br />بالحق يا هوبه فيه حد بيعلق باسم نيفين دى مش انا و علشان كدا هعلق بعد كدا باسم نيفين نيفى نوفا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131552/http://www.20at.com/article2.php?sid=1002"
