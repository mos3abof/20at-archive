text = "لأن كلها كلمات بكلمات، تقرأ في مدخل بيت الرئيس الراحل الآية التي تقول \"ولا تحسبن الذين قتلوا في سبيل الله أمواتا بل أحياء عند ربهم يرزقون\" وتحتها لقبه الرئيس المؤمن محمد أنور السادات، أما صفته فهي بطل الحرب والسلام، وشهرته عاش من اجل السلام واستشهد من اجل المبادئ.<br />3eeeeb, dah Ragel mat, we mat shaheed, ya ret shewayet 2e7teram.<br />3omoman, elkly mesh mesada2 enoh shaheed, ya ret yefteker en elly 2atalooh lesah beye2teloh fena<br />Wala Marwa as usual el sherek el mokahlef?"
