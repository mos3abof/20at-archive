[[comments]]
order = 0
subject = "حقيقة هو موضوع شائك"
author = "رنا"
posted = "2006-10-15"
text = "حقا اني اراه موضوع شائك ...هل المعاصي التي نرتكبها اغلبها بسبب هوى النفس وبسبب ان النفس البشرية بها بعض الصفات السيئة مثل الحقد والغيرة والحسد والانانية؟؟؟<br />فان كانت الشياطين تصفد في رمضان والنفس البشرية مازلت ترتكب المعاصي وتحقد وتحسد اذن في غير ايام رمضان كل هذه المعاصي التي نقوم بها هي بسبب انفسنا والشيطان بريء من هذا؟؟<br />اعتقد ان الشيطان هو المسؤول الاول عن هذه المعاصي والافات البشرية الاخرى فان اتى رمضان وصفدت الشياطين ظل الانسان على حاله قبل رمضان لان نفسه قد اعتادت على هذه المعاصي .<br />لذلك كان رمضان فرصة لتطهير النفس مما خلفه بها الشيطان على مدار عام وليعلم كل انسان انه ايضا مسؤول عن معصيته لله وان الشيطان لا تقع عليه المسؤولية وحده. والله اعلم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124329/http://www.20at.com/article2.php?sid=1351"

[[comments]]
order = 1
subject = "قد افلح من زكاها وقد خاب من دساها"
author = "عمرو"
posted = "2006-10-16"
text = "انا ارى ان النفس اخطر على الانسان من الشيطان فالشبطان يوسوس والنفس هى التى تستجيب فان كانت نفسامؤمنة استعاذت من الوساوس وان كانت غير ذلك استجابت لها وبالتالى فلا يتحجج احدنا بالشيطان وان كان يجب الحذر منه ولكن نفسك التى بين جنبيك هى الاساس فجاهد نفسك حتى يعصمك الله......"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124329/http://www.20at.com/article2.php?sid=1351"
