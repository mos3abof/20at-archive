text = "من مدونى الإخوان المسلمين بعد اعتقال \"عبد المنعم محمود\"<br />أنا إخوان … الكلمة هي السر وهي السبب … وإذا عرف السبب بطل العجب …<br />أنا إخوان … من الجامعة إلي التخرج إلي الإعلام إلي الصحافة إلي كل ما له علاقة بالإعلام …<br />أنا إخوان … في المظاهرات وفي النيابة وفي المحاكم وفي مباحث أمن الدولة وفي سجن المزرعة بطرة …<br />أنا إخوان … كانت مدونته تقولها بوضوح … وللأسف كانت في نظر نظام بلده هي جريمته … لكن له كانت شرفه وعزه …<br />كان الخبر كالتالي …<br />\"قامت قوات مباحث أمن الدولة في ساعة مبكرة من صباح اليوم الجمعة بمداهمة منزل المدون والإعلامي المصري عبد المنعم محمود الصحفي بموقع الإخوان بالإنجليزية ومراسل قناة الحوار البريطانية بمصر ولم يكن وقتها موجوداً بمنزله . \"<br />ولمن لا يعرف مين هو \"منعم\" مثلما كنا نناديه …<br />\"عرف بين الصحافيين والناشطين السياسيين بلقب \" رويتر الإخوان \" أحد أبرز شباب الإخوان المعنيين بالشأن الإعلامي وأحد الأوائل الذين بدأوا نشاط التدوين الإخواني ويعود إليه الفضل في لفت أنظار الكثير من مدوني الإخوان الحاليين إلي هذا المجال وتعد مدونته \" أنا إخوان \" أحد أبرز المدونات العربية في الوقت الراهن .\"<br />عبد المنعم محمود …<br />- أقلقهم قلمه اللي مبيسكتش … ولسانه الي مبيرحمش …<br />- أقلقهم إنه مخفش بعد كل اللي جري له … وراجع يتكلم من جديد …<br />- أقلقهم شهادته عن تعذيبه في السجون المصرية … وفي مباحث أمن الدولة …<br />- أقلقهم بصوته العالي ..وبكلمته الصريحة … زي ما أقلقهم بانفتاحه وتواصله من الآخرين …<br />وكان ردهم اعتقاله … وبالتالي نتقدم إليهم بردنا …<br />مدونو الإخوان المسلمين … واعترافا منهم بفضل \"منعم\" عليهم … واعترافا منهم بجهد كل مدون قال كلمة الحق في وجه الظلمة …<br />وتواصلا مع مسيرتهم … يقررون ما هو آت …<br />باسم العشرات بل المئات من مدوني الإخوان المسلمين …<br />منهم الشباب والشابات… منهم الرجال والسيدات والأطفال …<br />منهم الأسر اللي اعتقل عائلها .. ومنهم الكثير اللي غيب أحبابهم وراء القضبان …<br />الكلمة اللي أقسمنا نحميها ونقولها ونعلنها …لن يوقفها سجن ولا معتقل ولا محكمة …<br />الصوت اللي خرج من وسطنا … لن نسمح له إنه يسكت أو يضعف أو يتردد أو يرتعش …<br />المدونات اللي كتبت حكايتنا وأيامنا …خواطرنا وأفكارنا … يوم بعد يوم حتزيد وتكبر…وتوصل لكل الناس …<br />إحنا اخترنا خطابنا يكون بلهجتنا … وبلغتنا … عشان يوصل باسمنا ويعبر عننا …<br />واخترنا نوصل رسالتنا لكل الجهات … للفضائيات والجرائد والمجلات ولكل الكتاب والصحفيين … وقررنا ننشرها في كل المنتديات … والمدونات … والمواقع …<br />حملة من أجل البلد دي … حملة ضد السكوت والخضوع والخرس, ضد الاستسلام والسلام والهوان, حملة نرفض بيها القضايا المتلفقة وشهداء الزور وأدعياء الثقافة والكتبة اللي كتابتهم كلها تحت أمرالنظام وأسياد النظام .<br />وفي إعلانا هذا لا نفصل أنفسنا عن باقي المدونين أو تجمعا خاصا مقتصرا علينا … بل علي العكس نتقدم فيه بالشكر كل الشكر لكل من ساعدنا في دنيا التدوين, ونعترف له بالسبق والفضل, وكم أسعدتنا صورة \"عبد المنعم محمود\" وهي تملأ عشرات المدونات متضامنة متكاتفة مساندة …<br />- كلنا إخوان …رغم السجون والمعتقلات والقضايا والمحاكمات …<br />- كلنا إخوان … فكرة آمنا بيها وضحينا عشاناها ومستعدين نبذل لأجلها كل غالي وثمين …<br />- كلنا إخوان … طريق اخترناه ورسمناه … وكنا عارفين إنه صعب وشائك ومليان بالصعاب …<br />- كلنا إخوان … وتراب البلد ده بنحبه وبنموت فيه … وأحلي أيامنا يوم ما نشوفه حر وعزيز وكريم …<br />- كلنا إخوان … وبنحب أهلنا وجيرانا وأصحابنا وإخوانا … ومستعدين عشانهم نعمل أي شيء ونضحي بكل حاجة …<br />- كلنا إخوان … برغم كل اللي ظلمنا وحبسنا …وبرغم كل اللي سكت علي اللي بيجري لنا … وبرغم كل اللي حرض وتآمر علينا …<br />نقدر نقولكم مش حنسكت و مش هنبطل … لسانا هو أساسنا … غرباء؟ ممكن … لكن حنفضل من الناس …<br />بنحب النور وبنحب البلد دي …لأنها بلدنا … وبنحلم لها بالحرية … ألم الوطن ألمنا كلنا … وشايفين فيه أحلي ما في الدنيا …<br />\"منعم\" وراه بلد بحالها … نفسها تكون حرة .. وأملها في مستقبل مشرق … ومناها في حياة كريمة من غير ذل أو استعباد …<br />وفي الختام :<br />1- نطالب بالإفراج الفوري عن عبد المنعم محمود وكافة معتقلي الرأي في مصر.<br />2- نطالب المنظمات الدولية لحقوق الإنسان ومنظمات المجتمع المدني بإدانة الإنتهاكات الصارخة لحرية التعبير في مصر<br />3- نرفض التعامل الأمني مع قضايا الرأي والنشر الصحفي والإلكتروني<br />4- نؤكد على تضامننا الكامل مع مجتمع المدونين على مستوى العالم في حرية التعبير عن الرأي بكافة وسائل النشر المتاحة.<br />وفي النهاية … كلنا إيمان عميق… بأن الحق منتصر وأن الصواب هو الحقيقة الوحيدة … وأن لكل فجر ظلمة تسبقه ولكل نصر تضحيات ترسم خطاه .<br />مدونو الإخوان المسلمين"
