text = "رغم انى مش اخوان و لا انتوى ان اكون<br />لا استطيع ان امنع نفسى من الاعجاب بمنعم و كل شخص ليه قضيه او فكره عايش علشانها و بيناضل ف سبيلها<br />منعم يا جماعه و اللى زيه هما اللى بيثبتولنا ان الشباب لسه بخير و ان المحاولات الامريكيه الصهيونيه المستميته لمحو تراثنا و عمليات غسيل المخ اللى بتمارس يوميا على الفضائيات باسم العولمه و السماوات المفتوحه دى مصيرها للزوال<br />اللهم انصر الشرفاء فى هذه الامه"
