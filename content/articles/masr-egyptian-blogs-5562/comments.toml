text = "بسم الله الرحمن الرحيم<br />بيان رقم (1)<br />إنطلاق مدونة \" يا مصري انا زيك عربي…\"<br />www.yamasry.wordpress.com<br />_رسالة الشباب الفلسطيني الى الشعب المصري_<br />نحن مجموعة من الشباب الفلسطيني جمعنا هَمُ الوطن وجرحه,تابعنا ما يحصل في قطاع غزة من حصارخانق قتل الحياة فيه,ناهيك عن القتل اليومي الذي يتعرض له الشعب الفلسطيني في غزة وخاصة الاطفال على يد آلة القتل \"الإسرائيلي ة\" والتي تحاصر الآن القطاع وتمنع عنه الوقود والغذاء والدواء.تابعنا الألم بحرقة ونحن نرى الصمت العربي الرسمي المخجل,والغياب الشعبي المحزن لنصرة غزة وقد إكتوت هذه الشعوب بالقمع والاهانة واليوم بالغلاء والفقر والبطالة.<br />نحن كشباب فلسطيني عربي,نعرف أن محيطنا العربي هو المحيط iالأم لنا والحاضن لنا في مواجهة المحتل لنيل الحرية وإستعادة الأرض العربية المحتلة,ونحن نتابع ايضاً الموقف الرسمي المصري الذي الى الآن يرفض فتح معبر رفح المنفذ العربي الوحيد للشعب الفلسطيني.فهل يعقل أن يكتمل الحصار الصهيوني بحصار عربي,وكيف نريد لأهل غزة ان يعيشوا او ماذا نريد منهم كي يفك الحصار عنهم؟؟كيف لأهل فلسطين أن يطلبوا النجدة من المحتل وأهل العروبة يشاروكون بالحصار.؟؟…<br />إن كل التفاهمات والإتفاقيات والعهود إنما وجدت لتوصون حياة الناس وتحافظ عليها,وهاي هي اليوم فقط في غزة تحاصر الإنسان وتتركه يموت ببطىءً…<br />رسالتنا الى الشعب المصري…<br />لم يعد لنا وبعد الصمت المصري والتضليل الإعلامي الرسمي والتحريض على الفلسطينين سوى أن ننشد الرجاء بعد الله في شعب مصر,بكل مكوناته الاجتماعية والسياسية وفئات العمر من شباب وشيوخ ونساء واطفال ..أن هُبوا لنصرة غزة…<br />أيها الشعب المصري…يا شعب المقاومة من فجر التاريخ…يا عنوان العروبة الأول وكنانة الله في أرضه…ايها الشعب العظيم الذي نصر القضية الفلسطينية منذ بدايات الاحتلال وكان المد الأول للمقاومة المسلحة في وجه,وخضتم حروب وقتال من اجل فلسطين وضحيتم بأبنائكم في سبيل ذلك..أترضون اليوم أن يقتل هذا الشعب جياعاً محاصرين وبيدكم الحل والربط..لقد جربتم الشعب الفلسطيني في إرتمائه الأول الى احضانكم قبل شهربن..كيف كانوا وكيف تصرفوا وكيف عادوا..ألم يجسدوا أخلاق الاخوةالعربية؟؟<br />نحن نهيب بكم أن إنصروا غزة قبل أن تموت..ونعلن في إدارةالمدونة عن فتح ابواب التضامن معنا من قبل نشطاء الانترنت والمدونون العربوخاصة الاخوة المصريين كي نشكل آلة ضغط كي يفتح معبر رفحونحن نقدر إنشغالات الشعوب في قضاياهم لكن فلسطين أم القضايا<br />للمراسلة على الايميل<br />yamasry101<br />gmail.com"
