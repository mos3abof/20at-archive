text = "النقاب فى رايى هو وسيله للتقرب الى الله وانا اجاهد مع نفسى لخلع الحجاب العادى وارتداء النقاب لاننى اتمنى ان لايرانى احد سوى الحرماء فى الدنيا والله ورسوله فى دار الحق"
