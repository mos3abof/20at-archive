posted = "2009-12-18"
text = "لان اقول ان النقاب فرض او سنة لانه العلماء مختلفون فيه ولكن النقاب شىء رائع والتقرير يشير ان معظم المنتقبات مرغمون على لبسه فانا ارتدى النقاب ولم يفرضه على احد من اهلى بل بالعكس قالوا ان هذا من الحرية الشخصية"
archived = "2009-12-19"
capture_url = "https://web.archive.org/web/20091219172747/http://www.20at.com:80/20at/religious/14437-2009-12-17-10-09-18.html"

