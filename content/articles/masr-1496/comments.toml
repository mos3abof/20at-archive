subject = "اصلهم اختلفوا في القسمة"
author = "صيدلي تحت التمرين"
posted = "2007-01-28"
text = "يانفين مش اول مرة يتسرب فعلاً ومعروف ان كل سنة المادة دي بيدخل دكتور توفيق يدس مراجعة فيها سؤلين من الامتحان وبعدها ينولها في مكتبة زيركس انما السنادي مداش المراجعة ونزل الملزمة في المكتبة علي طول او معيد اللي نزلها من وراه<br />والدكاترة اختلفوا مع بعض فقلبوا علي بعض<br />لا وايه واسم المادة بيفكروني بفلم غرام الافاعي مش دكاترة سموم تقولي ايه"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131122254/http://masr.20at.com:80/article.php?sid=1496"
