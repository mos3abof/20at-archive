subject = "وايه الجديد؟ مش اول مرة"
author = "روضه"
posted = "2007-01-25"
text = "يانهااااااااااااااااار<br />اه يابلدنا<br />حتى متى؟<br />والله احد معارفنا مامتة اشترتلة 3 اسئله من الامتحان<br />ايوة 3 ماهو بالكيلوا<br />وكنت اسمع زمان عن واحد بردوا بيشتروا له الامتحانت وبردوا مفلحش فى التعليم"
