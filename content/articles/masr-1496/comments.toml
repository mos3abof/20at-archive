subject = "من هنا يأتي الفساد"
author = "عمر منطاش"
posted = "2007-01-27"
text = "إذا كان يأتي الفساد من المربيين بنفسهم فماذا تنتظر من الدفعات التي تخرج من تحت أيديهم فإذا كان رب البيت للدف ضارب فما شيمة أهل البيت إلا الرقص والطرب فمن هنا يأتي الفساد أنه هو القدوة ولكن قدوة سوء أعاذنا الله منها بارك الله فيك يا أ. محمد عبد العاطي على إظهار هذه المفاسد للناس"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131122254/http://masr.20at.com:80/article.php?sid=1496"

