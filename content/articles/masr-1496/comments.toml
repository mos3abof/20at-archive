subject = "طيب واية يعنى"
author = "طيب ياعالم يا بتاع الحفظ والصم دة فية امتحانات فى العالم كلة اسمها امتحانات"
posted = "2007-01-26"
text = "open book وطبقت عندنا زمان فى الستينات ايام الاساتذة الزائرين من الجامعات المختلفة لجامعات مصر وقتها وخصوصا الامريكان<br />وكان الدكتور بيقول هات معاك كتب ومذكرات واى حاجة تنفعك وحل المسألة بس ممنوع الكلام مع زميلك<br />لانك بعد التخرج هاتبقى قاعد فى البيت وهتتعرض لمشكلة مثل دى اللى فى المسالة وهتجيب مراجعك لحلها<br />عايزين طريقة حلك للمسالة<br />صحيح جيل بتاع حفظ وصم ويعقبها نسيان"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131122254/http://masr.20at.com:80/article.php?sid=1496"

