text = "شو ه الموضوع اللي حاطينو؟؟<br />وما بتخزو من حالكم؟؟<br />هلا مهند ونور اهم من الاقصى ؟؟<br />لا حول ولا قــــــــــــــ ــــوة الا باللـــــــــــ ــــــــــــــه العـــلي العظيــــــــــ ـم<br />اللهم لا تؤاخذنا بما فعل اخواننا"
