posted = "2009-11-17"
text = "هدم المسجد الاقصى يعني نهاية اسرائيل<br />والله انا اتكلم جد جدا<br />لاننا 5 مليار مسلم سوف نمحو اسرائيل ولن تقف امامنا حكومات ولا دول<br />سنحارب العالم كله وسنمحو اسرائيل وامريكا ان شاء الله<br />ولو لاخر قطرة في دمائنا"
archived = "2009-11-21"
