author = "مصرية"
posted = "2009-10-27"
text = "معقولة يا جماعة وصلنا لكده<br />بقى هو ده تفكير العرب و المسلمين دلوقتي في القضية الفلسطينية<br />ازاي ممكن نعيش براحة بال و احنا عارفين ان الاقصى مهدد في كل لحظة<br />المسجد الاقصى اللي استشهد على ابوابه الانبياء و الشهداء<br />نيجي احنا في زماننا ده و نفرط فيه"
archived = "2009-11-05"
capture_url = "https://web.archive.org/web/20091105043520/http://www.20at.com:80/20at/politics/13662-10-.html"

