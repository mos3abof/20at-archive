text = "لا حول و لا قوة الا باللة ربنا يستر على المسلمين و ينصرهم بجد الواحد مش عارف امتى يفخر انة عربى او مصرى حتى فى الشغل بقى اهم حاجة ان يمون معاك لغة او اكتر و محدش يبص للعربى بجد ياجماعة احنا الجيل بتاعنا اللى جاى هانشوف فية مسخرة و قلة قيمة اذا كل واحد فضل نايم كدة بجد بجد ربنا معانا …سلام"
