[[comments]]
order = 10
subject = "السلام عليكم......"
author = "ابو تركي"
posted = "2006-01-28"
text = "بسم اللة وصلاة وسلام علي رسول اللة....وبعد<br />نقول في البداية (اناللة واناإلية راجعون)<br />علي ما صدرا من بلاد الابقار وحرية السب!!!علي إهانة الرسول *صلي اللة علية وسلم*باالرسومات المهينةالتي تدل علي الحقد الدفين في قلوبهم وعلي انتشار الواسع لهذا الدين الحنيف .<br />ثانيا: ماحدث بين مفتي مصر الحبيبة وشيخ الازهر من اختلاف بسيط في موت او عدم موت الرسول*صلي اللة علية وسلم* اعتقد في وجه نظري المتواضعة هو قد اجاب علية من هو<br />افضل من الشيخين الذين نحترمهم وهو ابو<br />بكر الصديق رضي اللة عنةعندماتوفي الرسول<br />*صلي اللة علية وسلم*قال كلمتة (يا<br />ايهاالناس من كان يعبد محمد فأن محمد قد<br />مات ومن كان يعبد اللة فأن اللة حي لا يموت) ...او كما ذكر<br />ثالثا واخيرا:نحن في موقف صعب و الحملات الصليبية متواصلة لا بدا ان نقف صفا واحدا لا ان نسب الشيخ الفلاني والشيخ...ألخ لان هذا يدعوا إلي الفرقا بين المسلمين<br />وفي الختام اقول(لا تنازعو فتفشلوا وتذهب ريحكم) ملاحظة:اقد اعتذري عن اي خظاء املائي<br />اومحوري في الحديث.....شكرا."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152142/http://www.20at.com/article2.php?sid=328"

[[comments]]
order = 11
subject = "رسولنا الكريم"
author = "مسلمة"
posted = "2006-01-28"
text = "بسم الله الرحمن الرحيم<br />اللهم صلى على سيدنا محمد و على آله و صحبه و سلم تسليما كثيرا<br />أخواتى و إخوتى فى الله<br />أولا بالنسبة لموضوع سب الرسول صلى الله عليه وعلى آله و صحبه و سلم تسليما كثيراا فحسبنا الله و نعم الوكيل فى كل من يمس رسولنا الكريم الشريف الطاهر بسوء سواء قولا أو فعلا أو بين نفسه<br />و رد الله كيدهم فى نحورهم و ينتقم منهم ومن أمثلهم<br />ثانيا نرجوا عدم التعرض إلى أى مسلم بغيبةونميمة أو فرض سوءنيةحتى و لو إختلفنا معه فى الرأى أوحدث سوء تفاهم و لا نرمى بعضناا بعضا بإتهامات جزافا<br />و نرجواالآن أن نتريث و نهدأ ونتجنب أى شعيل للفتنة و أن نجمع شملنا و نلم شعثنا و نتقى ربنا ونحسن أعمالنا و نقف معا كالبنيان المرصوص على قلب رجل واحد<br />و نسأل الله الاخلاص فى القول و العمل<br />و السلام عليكم و رحمة الله و بركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152142/http://www.20at.com/article2.php?sid=328"

[[comments]]
order = 12
subject = "شيخنا الدكتور علي جمعه"
author = "حسام كمال"
posted = "2006-02-05"
text = "أرجوا لكل من يتكلم في العلماء سواء كانوا في السلطة أو خارجها أن يلتزم حد الأدب حتى ولو من باب عدم الوقوع في الغيبة وذكرك أخاك بما يكرة وهو يعد إتباع لسنة الرسول المصطفي<br />ثانيا ما العيب في أن يكون الشيخ علي جمعه يطمح في كرسي المشيخة الطموح حق مشروع لكل الناس وهذا شئ لا يعيبة ويكفينا ما نراة من فضيلة شيخ الأزهر الحالي والله يولي من يصلح<br />ثالثا :<br />أري أن نلتزم الصمت ولا نفتى في كل ما نسمعه فموضوع إباحة بيع الخمر هي فتوي والفتوي تتقيد بالزمان والمكان وظروف الشخص ولا داعي لأخذها على أن الرجل يبح بيع الخمر بالمطلق<br />إتقوا الله في لحوم العلماء فليس لنا بعد الله الا علماء الأمة المخلصين وأحسب أن الدكتور علي جمعه منهم ولا أذكي على الله أحد<br />والسلام عليكم ورحمة الله<br />وصلى الله على نبينا محمد وعلى آلة وصحبة وسلم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152142/http://www.20at.com/article2.php?sid=328"

[[comments]]
