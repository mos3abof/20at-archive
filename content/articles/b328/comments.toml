subject = "كفاية اتقى ربنا"
author = "مسلمة"
posted = "2006-02-15"
text = "انا للة واناالية راجعون مش مهم الخلافات الى مع بعضنا المهم مقاتلة العدو الحقيقى المصحف الشريف واترمى فى الحمام وسيدى محمد صلى اللة علية وسلم واتهان يا حبيبىيارسول اللة والعرب كل يوم ضرب واهنة واغتصاب حسبى اللة ونعم الوكيل مستنيين اية اتحركو بسرعة وقاطعوا المنتجات الغربية كلها اناخايفة ربنا يعاقبنا احنا علشان رضينا بالزل اناكل يوم ببكى تحت البطنية ومش عارفة انا ببكى لية من كثرة الهموم العربية نسيت ,,نحن قوم اعزنا اللة باللاسلام فاين العزة الان .سبحانك اللهم وبحمدك نشهد الا اله الا انت نستغفرك ونتوب اليك"
