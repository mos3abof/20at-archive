order = 0
subject = "نفسي أعرف"
author = "محمد علي"
posted = "2006-01-25"
text = "مين العبقري اللي كتب المقال ده و فسر الأمر إنه صراع بين شيخ الأزهر ( اللي ما يسوى بصلة) و مفتي الديار اللي استفزه أسلوب طنطاوي في التعامل مع الدنماركيين زي ما استفز جميع المسلمين<br />تاني حاجة عاوز واحد من موقع عشرينات الخربان ده يقوللي على حاجة...و بلاش أسلوب اللف و الدوران<br />مشفناش موضوع عن إساءة الصحف الدنماركية للمصطفى ( صلى الله عليه و آله و سلم) و لما تم التعرض لهذا الموضوع كان بصورة ثانوية من خلال موضوع متخلف عن صراع على المناصب و الكراسي<br />تاني حاجة...ممكن حد يقولي إيه حكاية فتوى بيع الخمور و الله عزيز حليم<br />و حسبي الله و نعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152142/http://www.20at.com/article2.php?sid=328"

