text = "على فكرة إللي بيتكلم عن الشيخ على جمعة بالطريقة دي يبقي معرفهوش ولا عاشرة، وحتي لو فرضنا إنه نفسة في منصف مشيخة الأزهر وغيه المانع، ليه متعتبروش إنه عاوز يعمل كده عشان يريح الناس من طنطاوي وفتاوية، ولا هو طعن في المفتي وخلاص؟!!!<br />وبالنسبة لموضوع الحجاب وفرنسا إللي ماكنش معترض هو طنطاوي شيخ الأزهر مش سيدي على جمعة المفتي، ولو تفتكروا إن الشيخ على عارض شيخ الأزهر في الموضوع ده هو وكثير من أعضاء مجمع البحوث.<br />أما بقي موضوع بيع الخمور، فللأسف الناس بتقرأ العناوين ومبيتكملش، الشيخ على جه وقال ورد على كل إللي قعدوا يهمبقوا ويتكلموا وهما مش عارفين حاجة ولا قرأو تفاصيل، ومشيوا ورا عنوانين الإثارة - وبما إني صحفي- فالإسلوب ده كثير من الصحف بتستخدموا للإثارة وجذب الناس عشان تشتري الجريدة وتعرف إيه الحكاية.<br />الشيخ على جه ورد وبين تأصيل الفتوي دي وقال يا جماعة الكلام ده مش في بلاد المسلمين او البيع لواحد مسلم ده في بلاد الكفار والبيع للكفار، ومقالش إنها لازم تبيع لهم لكن قال جائز للضرورة، وفيه مسائل في الفقة إسمها العقود الفاسدة ومشهور جداً أكثر في فقة السادة الأحناف والمفتي اجتهد وبني فتوته على أساس شرعي ونصوص وقواعد فقهية مكانش هو أول واحد أخذ بيها.<br />أقرأو تأصيل المسألة وشوفوا التفاصيل إللي فيها تلاقوها في موقع دار الإفتاء ومجمع البحوث الإسلامية، وحتي لو كانت الفتوي غلط - مع العلم أنها بناء على أسس شرعية- فده ميديش الحق للطعن في نزاه الشيخ على جمعة، خاصة وإن الكل شهد له ومن الآخر مالوش سوابق زي شيخ الأزهر في فتاوي من إياها.<br />وكمان حاجة أخيرة فيه قاعدة لازم الكل يعرفها: ( من كثر علمه قل إنكارة ومن قل علمة أصبح منكار).<br />فبلاش تربطوا خلاف في مسائل دينية وتحولوا الموضوع للسياسة وأنا أعتب على صاحب الموضوع في كده.<br />هاني ضوَّه<br />صحفي مصري<br />وتلميذ الشيخ على جمعة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152142/http://www.20at.com/article2.php?sid=328"

[[comments]]
order = 15
subject = "سيدى ومولاى الشيخ/على جمعة لم ترى عينى أعلم منه"
author = "ماجد مصطفى على"
posted = "2006-05-03"
text = "أرى الجهل وقسوة القلب وتسلط اللسان يطل من الكلام فى أغلب التعليقات الموجودة.<br />أمة تجرأ وتطاول أفرادها على الأكابر والأفاضل ،بالاضافة الى الجهل المركب.<br />ثم بعد ذلك يطلبون من الآخر احترامهم واحترام عقيدتهم ونبيهم.<br />بل ويطلبون أن ينصرهم الله .<br />حسبنا الله ونعم الوكيل.<br />سيغنينا الله من فضله ورسوله."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152142/http://www.20at.com/article2.php?sid=328"

