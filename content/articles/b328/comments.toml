[[comments]]
order = 4
subject = "تحريم الخمر في كل الأديان"
author = "علي"
posted = "2006-01-26"
text = "بسم الله الرحمن الرحيم<br />من منطلق حرص الأديان على ما يضر الإنشان منذ بدء الخليقة فإن الله حرم الخمر في كل الأديان السابقة وأن الإسلام جاء مؤكدا على ماجاءت به الأديان السابقة فلا يجوز شرب الخمر أو بيعها في الأديان سواء كانت مسيحية فإن /{ عيسى } عبد الله ورسوله لم يحل الله له في شريعته بيع أو شرب الخمر. وأن نبي الله { موسى } في اليهودية لم يحل الله له بيع أو شرب الخمر وكذا في كل شريعة سابقة على شريعة الإسلام الحنيف . فكيف يغيب على السيد الفاضل مفتي الجمهورية الذي يمثل الأزهر الشريف والدين القويم بأنه يجوز للمسلم أن يبيع الخمر في بلاد الكافرين هل هذه البلاد صرح في شريعتهم بيع الخمور وشربها ؟؟؟!!!! كــــــلا وألف كــــــــــــــــلا .<br />فعلى شيخنا الفاضل الرجوع عن هذه الفتوي التي تنقص من شأنه وشأن الأزهر الشريف الذي ضم الشريعة الإسلامية بين أحضانه وكان مركز إشعاع للعام أجمع .<br />فكيف تخرج منه فتوى تحل للمسلم بيع الخمر ؟؟؟؟؟؟؟؟<br />وأما من ناحية الإهانة برسولنا صلى الله عليه وسلم على يد ولسان شرذمة كافرة لا قيمة لها فهذا أمر طبيعي لماذا؟؟؟؟؟<br />إن الإسلام هو دين لحل كل المشاكل والإجابة على كل التساؤلاتسواء في الإسلام أم اليهودية أو النصرية فهو دين كامل شامل فقد شمل ماجاء في كل الأديان السابقةأما اليهودية والنصرانية فكانت ديانات مستقله لقوم معينين ومكان معين فنجد أن { هـــــــودا } عليه السلام في الأحقاف في اليمن وأن نبي الله { صـــــــالـــــح}<br />عليه السلام في تبوك ولكل واحد منهكا شريعة مستقلة لقوم مين ومكان معين .<br />أما الإسلام فهو دين عالمي بدليل أن الله لم ينزل كتابا بعد القرآن الكريم ولم يبعث بنبي بعد محمــد صلى الله عليه وسلم مما يدل على عالمية دين الإسلام وليس خصوصياته مثل الأديان السابقة .<br />فهذا هو الحقد الدفين في نفوس الكفرة من يهود ونصارى على الإسلام الحنيف وصاحب الرسالة العظيم { محمد صلى الله عليه وسلم - فنحن المسلمين لم نتعرض لأي نبي من الأنبياء السابقين بالإهانة لأننا مسلمون وديننا دين الحق لم يحرف ولم يبدل كما حدث في التوراة والإنجيل من التحريف والتبديل. فهم لم يفهموا حتى ماجاء في كتبهم حقيقة لآنهم أخفوا الحق وأظهروا الباطل فمن هنا هم أساؤوا إلى رسولنا العظيم { محمد } صلى الله عليه وسلم حقدا. ونحن لن نتخذ طرقتهم أن نسيء إلى نبي من السابقين لأننا أمرنا أن نؤمن بهم تفصيلا وإجمالا.. فليس بغريب عليهم حقدهم على غلإسلام والمسلمين . وكان يجب على شيخ الأزهر الشريف أن يبين لهم هذا الفروقات التي بيننا وبينهم ويعرفهم بقيم الإسلام الحنيف الذي أمرنا أن نؤمن ونوقر ونعظم الأنبياء السابقي كدليل على الإيمان بالله تعالى .<br />فلو آمن المسلم بجميع الأنبياء إلا نبيا واحدا لم يقبل إيمانه وهو من الكافرين .<br />فالإيمان بجميع الرسل جملة وتفصيلا من شرط إيمان المسلم بربه .<br />هذا وأختم قولي بقول الله تعالى . ولن ترضى عنك اليهود والنصارى حتى تتبع ملتهم .<br />وقوله تعالى { ولا يزالون يقاتلونكم حتى يردوكم عن دينكم إن استطاعوا }<br />وأن الله تعالى متم نوره ولو كره الكافرون - ولو كره المشركون - ولو كره المجرمون .<br />والسلام عليكم ورحمة الله تعالى وبركاته."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152142/http://www.20at.com/article2.php?sid=328"

