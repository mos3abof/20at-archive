text = "بسم الله والحمد لله والصلاة والسلام على رسول الله.....احبتى فى الله مااصدرته الصحف الدنماركيه من اساءه للرسول الكريم سيدنا محمد عليه الصلاة والسلام وسنسال امام الله وسيسالنا رسول الله مازا فعلنا لنرد كيد الكاءدين الجاهلين ماذا سنقول؟...هذا دليل هواننا وضعفنا وقد لمسه اعداءنا قبلنا...لذا علينا مقاطعة كل المنتجات الدنماركيه من جبن والبان لورباكوسمن وزبد ودانو ولانحقرنا من عمل صغير 2-الدعاء حسبى الله ونعم الوكيل الهم عليك بمن اساء لرسولك الكريم3-اتباع شرع الله وسنة رسول الله نصلح من انفسنا لتقوى عزاءمنا ان تنصروا الله ينصركم"
