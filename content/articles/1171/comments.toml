order = 0
subject = "المسلمين فى كل مكان"
author = "عبدالله عرابى من سنهوت"
posted = "2006-05-27"
text = "الحمد لله ان كل المسلمين فى كل مكان<br />ويريت نتجمع يا رب فى مواجهة<br />الاعداء بقادهم شارون<br />وقائد المسلمين هو عبدالله طارق السيد عرابى دياب من سنهوت"
archived = "2006-11-02"
