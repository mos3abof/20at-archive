[[comments]]
order = 4
subject = "و النبى ده اسمه كلام..حرام عليكو"
text = "انا دخلت الموقع ده لما واحد صحبى قالى عليه<br />وبصراحة اتصدمت ...معقوله ده موقع تابع لأسلام اون لاين<br />ايه التفاهه و السطحية دى..انتو مش لاقين حاجة تقولوها<br />وعرفات مات بالرغم من كل الراجل ده عمله الا ان حالات الموت و المرض لها قدسية و وقار \"عرفات مات آخر خبر فى الرديوهات\" يا خبر ابيض حرام عليكو و على الى مشغلنكو<br />انا من زمان متابع الانترنت والى بيحصل فيه بصراحة اسلام اون لاين فيه حاجة غلط و ماشى من سئ الى اسؤ و نصيحة للقائمين عليه اتقو الله دى امانة ده مابقاش اسلام ده بقى اسلامك ...و ربنا يصلح حالكم<br />واحد مش هيدخل على الموقع ده تانى"
archived = "2004-11-10"
capture_url = "https://web.archive.org/web/20041110061455/http://www.20at.com:80/article.php?sid=738"
