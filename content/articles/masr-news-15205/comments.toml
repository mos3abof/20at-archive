subject = ""
author = "حكم اللواءات اركان"
posted = "2010-02-04"
text = "اخرة حكم اللواء اركان حرب<br />سيادة اللواء اركان حرب المصيلحى وزير التضامن<br />وسيادة اللواء المحافظ<br />وسيادة اللواء حاكم المدينة<br />وسيادة اللواء رئيس الحى<br />وسيادة اللواء سكرتير المحافظ<br />واخرتها هنرجع لوابور الجاز<br />وسيادتة كل يوم بيفتتح محطة مجارى وشارع وهى دى التنمية<br />اخرتها اننا اصبحنا بنهيص للكورة بس ونجرى زى العبط فى الشوارع<br />انا عايز جون جدو وحسن شحاتة يجيب لى انبوبة بوتاجاز<br />انا كفرت باى حاجة فى البلد دى<br />لان العيشة بقت طين<br />وذل<br />وقرف<br />وتوتر اعصاب<br />فينك يا برادعى<br />تعال يا برادعى شوف اللطعة من الفجر للظهر فى الشارع علشان انبوبة بوتاجاز<br />يا ولاد الكلب"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205174152/http://www.20at.com:80/masr/news/15205-2010-02-04-13-43-48.html"

