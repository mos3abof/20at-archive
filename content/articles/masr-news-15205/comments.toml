posted = "2010-02-07"
text = "انا اقترح علي الخ البرادعي لو عاوز ينقزنا من اللي احنا فيه ممكن يسفرنا بره عنده بدل ما هو ييجي هنا ويتعب نفسه<br />او السيد الرئيس المبجل يطردنا من البلد اصل احنا ما نستاهلش يرمينا في امريكا او فرناسا او حتي الصين اهو بالمره يخلص من الشعب الناكر للجميل ويفضي هو بقي لاعضاء الحزب الوطني"
archived = "2010-02-09"
