text = "لنهاجر الى اسرائيل اولا<br />الغاز عندهم توفر و ارخص من سعرة فى مصر<br />بس المشكلة العويصة ان اسرائيل سترفض تواجدنا معها هناك"
archived = "2010-02-09"
capture_url = "https://web.archive.org/web/20100209211111/http://www.20at.com:80/masr/news/15205-2010-02-04-13-43-48.html"

