text = "هذا العمرو غير الاديب انسان استغل ميكروفونه ليكون الفاسق الذى قال عنه تعالى فى كتابه العزيز \" يآيها الذين آمنوا اذا جآءكم فاسق بنبأ فتبينوا ان تصيبوا قوما بجهاله فتصبحوا على ما فعلتم نادمين \" سورة الحجرات و يجب ان يجبر على ترك مكانه لانه ليس اهلا لشرف المهنه و سيأتى اليوم الذى سيكون فيه هو او احد افراد اهله و يكون مظلوما و يشعر بطعم الظلم و لن يعينه احد و يقذفونه فى عرضه . افعل ما شئت كما تدين تدان حسبنا فيه"
archived = "2009-06-26"
capture_url = "https://web.archive.org/web/20090626114722/http://www.20at.com:80/masr/t7kyk/12438-2009-06-22-19-27-57.html"

