text = "عمرو أديب دايما تافه وانا عمرى ما بتبع ليه اى برنامج علشان راجل تافة جدا والمنتخب المصرى دايما رافع رسنا ومعالى مصر وربنا يكرم المنتخب كمان وكمان وعمرو اديب ال عامل نفسة بيفهم التافة دا يبطل كلام على اسيادة ال رفعين راية مصر نفسى اعرف هو بيعمل ايه غير ان هو بيطله يهزر ويضحك وكلامة قذر جدا وتافة جدا ان شاء الله ربنا هينصر المنتخب بتاعنا امين يارب العالمين"
