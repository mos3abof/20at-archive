text = "الأخ الى بيقول الموضوع عمل صحفي ومهني<br />الصحفي لازم يكون محايد سيادتك .. لا يهاجم اللعيبة ويستفزهم بكلام أتكتب فى جرايد عاملة زى جريدة النبأ كدة فى مصر .. الى الكل عارف ان الى بيتكتب فيها فبركة<br />وده حتى لم يترك لنفسه مساحة للتأكد من الخبر ولكم يترك مساحة للاعبين انفسهم<br />المفروض كمهنية بقى الى كان يحصل .. أنه يقرأ نص الخبر ويتصل باللاعيبة و يشوف هما هيقولوا ايه واكيد مدير اتحاد الكرة المصري، و لو عرف يكلم مسئول بجنوب افريقيا من القسم ولا من اتحاد الكورة .. مش تقولى دى مهنية<br />دى مهنية الكفتة سيادتك"
