[[comments]]
order = 3
subject = ""
author = "نبيلة"
posted = "2009-06-23"
text = "عمرو اديب بالكلام اللى قاله ده عليه وزر قدام ربنا أولا … ثانيا هو كده قلل من شعبيته<br />جدا أنا واحدة من الناس كنت باتفرج على البرنامج بتاعه دلوقتى قررت مقاطعة البرنامج<br />وطبعا حاولت اتصل بيه واقول حرام عليك دى أعراض وشرف ناس وأسر لكن ماعرفتش<br />وانا متأكدة ان ربنا حياخد منه حق الناس اللى خاض فى اعراضها … وبعدين انا كنت عايزة اسال سؤال واحد لو مصر صعدت وغلبت امريكا … كان هو حينقل الموضوع بالطريقة البذيئة والمهينة لينا كأسر مصرية بتتفرج على البرنامج …<br />اديه طلع الكلام مش حقيقى والمسئولين ف جنوب افريقيا اعتذروا .. هو دلوقتى بقى شكله ومصداقيته قدام الناس …ازاى ؟<br />حقول ايه … منه لله … وحسبى الله ونعم الوكيل فيه وف هانى شاكر .. واللى اكلم بهذا الشكل عن المنتجب الوطنى اللى شرفنا قدام البرازيل وقدام ايطاليا .. هى دى الكرة … مستديرة … يوم لك ويوم عليك ."
archived = "2009-06-26"
capture_url = "https://web.archive.org/web/20090626114722/http://www.20at.com:80/masr/t7kyk/12438-2009-06-22-19-27-57.html"

