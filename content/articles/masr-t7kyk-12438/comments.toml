subject = ""
author = "عمرو اديب"
posted = "2009-06-22"
text = "من هو عمرو اديب ؟<br />من افرازات الزمن الردىء استغل علاقتة بالرئيس وكون ثروة طائلة وشغل فلوسة فى الاعلام والسينما واصبح كا الاخطبوط ولة صلات متشابكة مع الذين يديرون هذا البلد<br />اظن ان ابوة كاتب السناريو المتواضع جدا فى الستينات عبد الحى اديب<br />ايا كان فهو يعتبر نفسة غول اعلامى<br />ولكن الصادم فى حكاية اللاعبين انة صدم مشاعر الشعب المصرى<br />وحتى لو راى الزفت عمرو اديب اللاعبين يمارسون الزنى ففى هذة الحالات مطلوب الستر عليهم - واذا كان ربهم سترهم يبقى تفضحهم لية يا عمرو<br />هل يريد عمرو اديب افشاء الفاحشة بين الناس كما يقول الدين واذا كان الشاب المشجع المراهق يعتبر اللاعب قدوتة العليا وراة او سمع انة يمارس الفاحشة فسوف يعمل مثلة ويتخذ اللاعب مثالا لة وهيقول لك اللاعب النجم فلان عمل كدة<br />مفروض على عمرو اديب ان يجلس فى بيتهم فترة ويترك الاعلام وبلاش كلام فارغ<br />المفروض امن الدولة يقبض علية بتهمة انة شوة واضر بسمعة بلد على صفحات الجرائد والصحف العالمية واضحك علينا العرب من المحيط الى الخليج<br />والا على راسة ريشة لانة على علاقة بالسيد الرئيس"
archived = "2009-06-26"
capture_url = "https://web.archive.org/web/20090626114722/http://www.20at.com:80/masr/t7kyk/12438-2009-06-22-19-27-57.html"

[[comments]]
order = 1
subject = ""
author = "لا دخان من غير نار"
posted = "2009-06-22"
text = "عمرو اديب لم يخترع القصة وانما نقلها عن جرائد جنوب افريقيا وهو هنا يؤدى عملا صحفيا وذكر مصادرة<br />ثم ان الشرطة فى جنوب افريقيا اكدت الخبر بواسطة مراجعتها لكاميرات التسجيل الموجودة داخل الفندق عندما ابلغ اللاعبون عن السرقات وعرفوا من تسجيلات الكاميرات مين اللى دخل ومين اللى خرج<br />الموضوع عمل صحفى اعلامى وليس لة علاقة بكراهية او حب الفريق<br />ثم ان الموضوع مش جديد<br />فية علماء وخبراء ورجال سياسة [ *** ]لمانيون اول ما بيطلعوا برة عيونهم بتزوغ على اللحم الابيض وفية فضايح ولا ننسى عالم الذرة المصرى الذى قتل بواسطة غانية فى فندق فى باريس<br />الموضوع ضعف ايمان<br />اناس بتفكر ان هذة نقرة اخرى<br />الحرام حرام<br />ولكن شرعيا لا يمكن قذفهم وتناول تلك الاخبار عنهم بدون بينة فبدون بينة يعتبر الحديث عن تلك الواقعة عندما يذكر اى اسماء مارست الفاحشة هو الجلد<br />فقد حدث ان ذهب احد الاشخاص الى سيدنا عمر بن الخطاب رضى اللة عنة وقال — لقد رايت فلانا مع فلانة يمارسان الزنى<br />فقال عمر لة<br />واللة لو ذكرت اسمهما ولم تاتى باربعة شهداء لجلدتك<br />التهمة عايمة<br />لا احد ذكر اسماء لاعبون بعينهم مارسوا الرزيلة<br />بقى تسجيلات كاميرات الفندق"
archived = "2009-06-26"
capture_url = "https://web.archive.org/web/20090626114722/http://www.20at.com:80/masr/t7kyk/12438-2009-06-22-19-27-57.html"

