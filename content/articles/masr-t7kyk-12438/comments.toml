text = "ياأستاذ عمروحتي لو ده حصل عيب انك تشهربلاعيبة بلدك كدة ده الي يستر علي مؤمن في الدنيا ستر الله عليه يوم القيامة أعلن بكل حزن وأسي مقاطعتي للإعلامي عمروأديب الي كان واحد من أهم وأحسن الإعلاميين بمصر ولكن مش هيكون أغلي ولا أعز من لاعيبة كل واحد منهم يمثل روح مصر وأتمني من الله أن يرفع مقته وغضبه ويبين الحقيقة وقلوبنا معاكم وعمرنا ماهنصدق الكلام ده عيب جدا ( يأيها الذين أمنوا إن جاءكم فاسق بنبأ فتبينوا أن تصيبوا قوما بجهالة فتصبحوا علي ما فعلتم نادمين ) صدق الله العظيم"
archived = "2009-06-26"
capture_url = "https://web.archive.org/web/20090626114722/http://www.20at.com:80/masr/t7kyk/12438-2009-06-22-19-27-57.html"

