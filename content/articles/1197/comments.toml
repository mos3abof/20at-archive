text = "الشتيمة أساسا تبقى شتيمة وينال قائلها إثما على ما قال ..<br />لكن إذا واحد شتمني بالانجليزي ما راح يكون وقعها كوقع الشتيمة بالعربي ..لأن الأغلبية عندنا ما عندهم لغة انجليزية ممتازة ..<br />بس إذا كانت تخدش الحياء العام فالأمر مختلف ..!!! وياويل قائلها !!<br />لكن هذا تأثير الغزو الفكري .. يقولونها بالأفلام والألعاب جهارا نهارا ! وكأنها مدحة أو مجاملة !!<br />أظن بعد كم قرن لن تكون للغة العربية مكانة في العالم .. إلا إذا تغيرت الأمور !"
