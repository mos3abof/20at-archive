[[comments]]
order = 11
subject = "السلوك الحضاري"
author = "محمد حسن غنيم"
posted = "2006-09-09"
text = "تعتبر الشتائم و السب و القذف نوع من انواع الإنحطاط الأخلاقي في المجتمعات ولسوء الحظ أن الشتائم أصبحت في المجتمع المصري أسهل من السهولة قد تكون مثلاً مثل السلام عليكم أو اهلا أو كيفك أصبحت الشتائم لبانة في فم كل مصري<br />أنني لا اتكاتل على المصريين بالرغم من كوني مصري إلا ان ظاهرة الشتائم ادت إلى سلوك غير قويم<br />قبل أن تعترض على كلامي اوحتى مجرد تعليقق<br />أسئل نفسك<br />هل اتى عليك يوم لم تسمع فية شتلئم<br />كم مرة خرجت مع امك اختك زوجتك وماسمعتش شتائم تخدش الحياء<br />كم مرة خرجت مع طفك ابنك اوبنتك وسئلك دى !!! معناها ايه يابابا<br />كل هذا ادى إلى إهانة مصر خارجياً في نظر كل شعوب العالم وتدهورها و إنهيارها داخلياً بين شعوبها<br />وهذا هو حال المجتمع المصري الذي يتقهقر للوراء يوم بعد اليوممقارنة بالشعوب الأخرى ولا نتحدث عن الدول الغربية لأنهم سبقونا بمليون سنة ضوئية كما يقولون العلماء العرب<br />ولكن قارن مصر بدولة عربية<br />وأرسلي الإجابة<br />محمد حسن غنيم ghonem777@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134102/http://www.20at.com/article2.php?sid=1158"

