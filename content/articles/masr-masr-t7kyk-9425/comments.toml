author = "معلم ضرب حجر حشيش على الريق"
posted = "2008-06-24"
text = "اولا ماجاء بأن قرش الحشيش ب 90 جنية فدى اسعار قديمة قوى او يمكن من النوع المضروب بتاع خلطة حشيش وشوية ملوخية ناشفة وبعض البانجو - قرش الحشيش غبار نمرة 1 بحوالى 250 جنية<br />وطبعا الحشيش لة مناسبات - ليلة الجمعة مثلا - قعدة فرح ومجاملة - يكون البنى ادم فى حالة اكتئاب وعايز يفك عن نفسة شوية<br />وطبعا الحشيش بييجى مصر عن طريقين<br />طريق اسرائيل والتهريب الى سيناء<br />او طريق البحر جاى من جنوب لبنان بالمراكب الصغيرة الى نقطة معينة فى الساحل الشمالى ومن هناك يتم تهريبة<br />اما عناتيل التهريب فرتب كبيرة سابقة ومسنودة فى الداخلية<br />والسؤال هو<br />الحكومة تقدر تمنع التهريب ؟<br />ايوة نعم<br />طيب مين اللى لة مصلحة فى التهريب ؟<br />الناس اللى بتعمل ملايين وتبنى قصور فى مارينا والقاهرة الجديدة ويركبوا الشبح والبودرة وهى اسماء ماركات حشيش اطلقوها على السيارات المرسيدس اللى بيركبوها<br />ولو لك صديق فى الداخلية هيجيب لك احسن صنف من الحشيش ومعتبر وهتدلع نفسك على الاخر<br />نرجع للفيس بوك<br />اكيد اللى عمل الموقع دة او الجروب دى ولاد الرتب الكبيرة بتوع التهريب"
archived = "2009-07-30"
capture_url = "https://web.archive.org/web/20090730222428/http://www.20at.com:80/masr/masr/t7kyk/9425.html"

