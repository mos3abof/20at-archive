text = "الحشيش حلو بس عاوزلة كنترول مثلا مينفعش اشربة وانا مروح الشغل او وانا بسوق العربية انما يتشرب فى البيت سيجارة مثلا كل اسبوع مع تهيئة الجو من ميوزيك وموزز لتكتمل الطقوس البوذية بمسمار جوى كوباية مع كوباية شاى فى الخمسينة ويتفض الجمع تقولش فص ملح وداب والاسبوع اللى بعدة نفس البرنامج ونفس القروب"
