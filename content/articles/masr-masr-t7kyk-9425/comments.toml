text = "الحشيش اللى موجود فى مصر كلة مضروب برشام ولبان دكر وحنة وعلشان كدة بيصدع وبيعمل دماغ قلق انما فى لبنان بننزل للبقاع نتفسح وناكل ونحشش وناخد شوية على بيروت لزوم الفرفشة تلات ايام وخلاص التذكرة مع الفندق مع كل حاجة متتكلفش اكتر من قيمة فرش من المضروب اللى عندنا دة الموضوع باختصار"
