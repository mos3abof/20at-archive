text = "يبدو ان لأئحة العملاء والخونه علي استعداد دائم<br />ان تستقبل زوار جدد<br />الف مبروك ياخ دحلان يبدو والله اعلم انك الزائر الجديد.........................<br />ياجماعه الأخ دحلان بيحاول يكون نجم جديد سيبوه مزبلة التاريخ جاهزه وبتنادي عليه........"
