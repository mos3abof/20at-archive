[[comments]]
order = 0
subject = "بيرو"
text = "بصراحة شديدة جدا ...<br />كل التصريحات اللي فاتت بتحسسني أني غبي جدا<br />أو إن المقصود منها اني احس اني غبي فعلا<br />موش عارف<br />انا موش شايف فرق كبير بين دحلان وعرفات وحتي بينهم وبين شارون نفسه<br />دي لعبة كبيرة قوي والخاسر الوحيد هو الشعب الفلسطيني<br />أما عن موقف حماس<br />فأنا شايف إن سكوتها شيء كويس جدا<br />وبصراحة برضه انا بتمني إنها تفضل ساكتة عن الكلام علي طول<br />بس عمرها ما تسكت عن الجهاد<br />يا تري ايه الفرق بين عرفات ودحلان<br />ااتنين ميتين أكتر من بعض<br />الاتنين بيكرهوا حماس أكتر من بعض<br />الأتنين بيموتوا في الفساد اكتر من بعض<br />الخلاصة ..<br />الاتنين خونة اكتر من بعض ..!!"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022015031/http://www.20at.com:80/article.php?sid=512"

