[[comments]]
order = 2
subject = "مطر تاني !!!"
text = "ارفعوا أقلامكم عنها قليلا<br />واملئوا أفواهكم صمتًا طويلا<br />لا تجيبوا دعوة القدس.. ولو بالهمس<br />كي لا تسلبوا أطفالها الموت النبيلا<br />دونكم هذه الفضائيات فاستوفوا بها<br />وبوسوا بعضكم.. وارتشفوا قالاً وقيلاَ<br />ثم عودوا..<br />واتركوا القدس لمولاها..<br />ما أعظم بلواها<br />إذا فرت من الباغي.. لكي تلقى الوكيلا!<br />طفح الكيل.. وقد آن لكم أن تسمعوا قولاً ثقيلا<br />نحن لا نجهل من أنتم.. غسلناكم جميعا<br />وعصرناكم.. وجففنا الغسيلا<br />إننا لسنا نرى مغتصب القدس.. يهوديًّا دخيلا<br />فهو لم يقطع لنا شبرًا من الأوطان<br />لو لم تقطعوا من دونه عنا السبيلا<br />أنتم الأعداء<br />يا من قد نزعتم صفة الإنسان.. من أعماقنا جيلاً.. فجيلا<br />واغتصبتم أرضنا منا<br />وكنتم نصف قرن.. لبلاد العرب محتلاً أصيلا<br />أنتم الأعداء<br />يا شجعان سلم.. زوجوا الظلم بظلم<br />وابنوا للوطن المحتل عشرين مثيلا<br />أتعدون لنا مؤتمرًا؟<br />كلا<br />كفى<br />شكرًا جزيلا<br />لا البيانات ستبني بيننا جسرًا<br />ولا فتل الإدانات سيجديكم فتيلا<br />نحن لا نشتري صراخًا بالصواريخ<br />ولا نبتاع بالسيف صليلا<br />نحن لا نبدل بالفرسان أقنانا<br />ولا نبدل بالخيل الصهيلا<br />نحن نرجو كل من فيه بقايا خجل.. أن يستقيلا<br />نحن لا نسألكم إلا الرحيلا<br />وعلى رغم القباحات التي خلفتموها<br />سوف لن ننسى لكم هذا الجميلا<br />ارحلوا<br />أم تحسبون الله لم يخلق لنا عنكم بديلا؟!<br />أي إعجاز لديكم؟<br />هل من الصعب على أي امرئ.. أن يلبس العار<br />وأن يصبح للغرب عميلا؟!<br />أي إنجاز لديكم؟<br />هل من الصعب على القرد إذا ملك المدفع.. أن يقتل فيلا؟!<br />ما افتخار اللص بالسلب<br />وما ميزة مَن يلبد بالدرب.. ليغتال القتيلا؟!<br />احملوا أسلحة الذل وولوا.. لتروا<br />كيف نُحيلُ الذلَّ بالأحجار عزًّا.. ونذلُّ المستحيلا"
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022015031/http://www.20at.com:80/article.php?sid=512"

