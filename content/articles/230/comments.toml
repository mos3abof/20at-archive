subject = "وائل عباس"
text = "كرم جابر قال كلام زي السم عن اتحاد اللعبة<br />وعن الرياضة في مصر<br />وعلى عينك يا تاجر وفي راديو البي بي سي كمان<br />يعني على مستوى دولي<br />لكن جمال مبارك لا يستحي<br />ولا يستحي من وضعوا صورته مع صورة بطل مصري مكافح حقيقي ليس للبلد ومن يعتقدون انهم يمثلونها فضل عليه ...<br />استحوا ايها اللذين لا تستحون"
archived = "2004-09-23"
capture_url = "https://web.archive.org/web/20040923013725/http://www.20at.com:80/article.php?sid=624"

[[comments]]
order = 2
subject = "أحمد خان"
text = "بسم الله الرحمن الرحيم<br />انا أحب أشكر أولا البراء أشرف على الموضوع الشيق وبعد<br />هو طبعا بعد حكايه مرض الرئيس مبارك الاخيره نرى ان كل شىء بقى بيطلع فيه نجله جمال مبارك واحنا المفروض علينا ان احنا ما نستغربش بعد ماعملها الاسد ومسك الرئاسه لابنه بشار لازم هيعملها حسني ويمسكها لجمال ...يعني خلاص من غيركلام كتيير جمال هو الرئيس الجاي ومش عوزين نتعب دماغنا كلام من ده تاني ......وبرضه احب اقول ان كرم كان مرتبه الشهري مئتان جنيه بينما كان في مرتب لاعبين كرة قدم بتوصل الى مئتن الف جنيه ...وشوفه مين بقى احسن؟؟؟؟ ابراهيم سعيد الي طول النهار مشاكل ولا كرم جابر الى والدته واخيه ساعدوه عشان يوصل....<br />وحكايه الضرائب ....الحكومه ما بتسيبش حد في حاله حتى الفقير بياخده لقمه العيش من فمه....وبعدين صحيح راح فين جمال مبارك ايام صفر المونديال ...راح فين مبارك ايام اللجنه التعيسه الي بعتوها عشان تاخد المونديال ...راح فين؟؟<br />وكنت عايز اقول ان جمال ما كنش يسمع عن حاجه اسمها كرم جابر راح بس المطار عشان يتصور معاه ...يا عالم يا مسئوليين اتقوا ربنا"
archived = "2004-09-23"
capture_url = "https://web.archive.org/web/20040923013725/http://www.20at.com:80/article.php?sid=624"

[[comments]]
order = 3
subject = "واحد م الشعب"
text = "بشرت الصحف الحكومية بقرب انعقاد المؤتمر العام للحزب الوطني يوم 21 سبتمبر 2004 والذي سيكون فرصة للإعلان عن مزيد من القرارات الإصلاحية التي صاغتها \"لجنة السياسات بالحزب.\"<br />الحكومة المصرية برئاسة أحمد نظيف تضم سبعة من أعضاء لجنة السياسات بالحزب الوطني التي يترأسها جمال مبارك، والذي يقدم كممثل لـ\"جيل الشباب الإصلاحي\" في الحزب الحاكم، وهم: يوسف بطرس غالي (المالية)، رشيد محمد رشيد (التجارة الخارجية)، محمود محيي الدين (الاستثمار)، أحمد جمال الدين موسى (التربية والتعليم)، طارق كامل (الاتصالات)، أحمد درويش (التنمية الإدارية)، أنس الفقي (الشباب).<br />سؤال مهم ....<br />من يجلس علي عرش مصر<br />من يحكم مصر<br />أتحدي أن يختلف إثنان علي الإجابة ..!!"
archived = "2004-09-23"
capture_url = "https://web.archive.org/web/20040923013725/http://www.20at.com:80/article.php?sid=624"

