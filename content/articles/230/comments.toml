[[comments]]
order = 32
subject = "مجرد وقفه"
text = "فلنقف وقفه مجرد وقفه فكريه مع انفسنا ونتأمل انفسنا سنجد اننا شعب تعود ان يتحدث بسبب وبدون سبب وبدون طائل كما تعود علي يهول الامور وكذلك تعود علي ان يقدم افتاءاته والتي غالبا ما لا تكون مينيه علي قاعدة معرفيه فالجميع يتحدث عن توريث الرئيس مبارك لابنه ويقولون لقد حدث هذا في سوريا فلماذا لا يحدث هنا ونسوا او ربما تناسوا او لعلهم لا يعلمون ان الوضع السياسي والاستراتيجي الخاص بسوريا يختلف نهائيا عن الوضع الخاص بمصر ايها الساده انا لا ادافع عن النظام المصري ولكني اردت ان اقول ان الرئيس مبارك صرح اكثر من مره ان هذا لن يحدث ابدا فكيف يقبل ان يقال عليه بعد وفاته انه رئيس كاذب يخاصة ان ابنه سيكون الحاكم ام ان تصريحات رئيس دوله لها كل هذا الثقل مثل مصر هي تصريحات طفوليه ايها الاخوه الكرام ياابناء وطني مصر ارجوكم تأنوا وفكروا وتأملوا قبل ان تتحدثوا بما تجهلون وربنا يرحمنا والسلام عليكم ورحمة الله"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018134324/http://www.20at.com:80/article.php?sid=624"
