[[comments]]
order = 18
subject = "وائل عباس"
text = "هاهاها<br />ملعوبة يا بتاع المرارة<br />واليكم خبر من صحيفة دنيا الوطن الفلسطينية:<br />شؤون عربية: تعليمات عليا برفع صور جمال مبارك من الميادين العامة في مصر<br />أرسلت في Sunday, September 19 بواسطة donia-alwatan<br />تعليمات عليا برفع صور جمال مبارك من الميادين العامة في مصر<br />غزة-دنيا الوطن<br />نقلت العديد من وكالات الأنباء والصحف العربية والأجنبية القرار الذي جري بمقتضاه رفع صور السيد جمال مبارك أمين لجنة السياسات بالحزب الحاكم التي علقت في عدد من الميادين العامة والشوارع الرئيسية دون علمه.<br />وقالت وكالة اسوشيتدبرس التي بثت الخبر : 'أزيلت صورة ضخمة ارتفاعها أربعة طوابق لجمال مبارك نجل الرئيس حسني مبارك من ساحة رئيسية في القاهرة بعد انتقادات للذين رفعوها ووصفهم بأنهم 'منافقون'.<br />وقالت الوكالة: 'لقد جاء اختفاء الصورة بعد تقارير في وسائل إعلام دولية، بينها وكالة اسوشيتدبرس تناولت تكهنات في أوساط المصريين تفيد بأنها تهدف إلي تعزيز احتمال تقدم جمال مبارك للرئاسة خلفا لوالده الذي يحكم مصر منذ العام .1981<br />وقالت الوكالة: كان رئيس تحرير 'الأسبوع' مصطفي بكري قد كتب 'أن وسائل الإعلام الدولية أساءت استخدام' اللوحة الإعلانية التي يظهر فيها جمال مبارك وأضاف 'اللوحة الإعلانية وضعها منافقون أرادوا التقرب' من نجل الرئيس.<br />وقالت الوكالة: 'إن مبارك الابن هو الوحيد من غير الرياضيين الذين تظهر صورهم في اللوحة الإعلانية الضخمة التي رفعت في ميدان التحرير احتفاء بفوز الفريق المصري في الأولمبياد'.<br />يذكر هنا أن السيد جمال مبارك وعندما قرأ ما نشرته 'الأسبوع' استفسر حول هذه اللوحات التي لم يخطر بها من قبل مما استدعي صدور قرار عاجل برفع هذه الصور من كافة الشوارع والميادين، حيث قامت الجهات المعنية بتنفيذ القرار مساء يوم الاثنين الماضي.<br />وقد جري التنبيه علي شركات الإعلان والجهات المعنية بعدم التصرف فرديا في مثل هذه الأمور التي تفسر تفسيرات غير صحيحة لدي الرأي العام والصحافة ووسائل الإعلام الأجنبية."
archived = "2004-09-23"
capture_url = "https://web.archive.org/web/20040923013725/http://www.20at.com:80/article.php?sid=624"

