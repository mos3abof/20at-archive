subject = "لا للتجديد.. لا للتوريث"
text = "نعم لانتخاب رئيس الجمهورية من بين أكثر من مرشح<br />الحملة الشعبية من أجل التغيير<br />بيان إلى شعب مصر<br />الموقعون على هذا البيان من أحزاب وقوى وطنية من مختلف الاتجاهات السياسية، ومنظمات مدنية وأعضاء نقابات عمالية ومهنية ومثقفين وفنانين ومواطنين من مختلف فئات الشعب المصري، يرون أن النظام الذي يقوم على اختيار مجلس الشعب لمرشح واحد لرئاسة الجمهورية يتم استفتاء الشعب عليه، والحق في تكرار توليه السلطة لعدد لا نهائي من المرات، بالإضافة إلى السلطات المطلقة التي يمنحها الدستور لرئيس الجمهورية، فضلا عن استمرار تزوير الانتخابات والاستفتاءات مما أدى إلى عزوف المصريين عن المشاركة.. كل ذلك قد أصاب النظام السياسي في بلادنا بحالة من الجمود إلى الحد الذي أصبح يدور الحديث فيه في الأوساط السياسية والشعبية عن إمكانية توريث الحكم في مصر!<br />لقد أصبح واضحا بعد 24 سنة من حكم الرئيس مبارك، أن هذا النظام يقف عقبة أمام فرص التغيير والتطوير الذي تحتاجه بلادنا لمواجهة التحديات التي تواجهها من مشكلات اقتصادية واجتماعية أدت إلى استشراء الفساد وتدهور المرافق والخدمات وانفجار غول الأسعار وتردي مستوى معيشة المواطنين وتفاقم مشكلة البطالة، في نفس الوقت الذي تواجه فيه تحديات خارجية تهدد أمنها الوطني تتمثل في استمرار السياسات العدوانية للدولة الصهيونية والاحتلال الأمريكي للعراق.<br />الموقعون على هذا البيان يعلنون عن عزمهم على العمل من أجل إجراء تعديل عاجل للدستور قبل انتهاء الدورة الحالية لرئاسة الجمهورية في أكتوبر 2005، وعلى أن تكون الدورة الحالية هي الأخيرة للرئيس مبارك. ويؤكدون أن التعديل المقترح يجب أن يتم في أسرع وقت ممكن حتى تتاح لكافة القوى الوطنية فرصة المشاركة الحقيقية في الانتخابات القادمة حول منصب رئيس الجمهورية ولكي يستعيد الشعب المصري حقه في اختيار حكامه ومحاسبتهم، وحقه في حياة حرة وكريمة وآدمية لكافة مواطنيه، خالية من البطالة والفساد وتكميم للأفواه والتعذيب في السجون وأقسام الشرطة.<br />إن الحرية والديمقراطية حق أصيل لكل إنسان.. وقد خلقنا الله أحرارا ولن نورث أو نستعبد بعد اليوم<br />عليه فنحن الموقعين أدناه نطالب بما يلي:<br />1. تعديل الدستور بما يسمح بانتخاب رئيس الجمهورية من بين أكثر من مرشح، على ألا تتجاوز فترة رئاسته دورتين، وتقليص صلاحيات رئيس الجمهورية بما يضمن الفصل الحقيقي ما بين السلطات<br />2. إلغاء حالة الطوارئ، وكافة القوانين المقيدة للحريات والإفراج عن جميع المعتقلين والمسجونين في قضايا الرأي.<br />3. تعديل قانون مباشرة الحقوق السياسية بما يكفل الإشراف القضائي الكامل على كافة مراحل الانتخابات.<br />القاهرة في 9 سبتمبر2004"
archived = "2004-09-23"
capture_url = "https://web.archive.org/web/20040923013725/http://www.20at.com:80/article.php?sid=624"

