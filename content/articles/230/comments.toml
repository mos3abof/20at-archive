subject = "فيلم مصري بجميع دور العرض"
text = "الفيلم: 'الرسالة'<br />النوع: رعب<br />الأحداث تدور حول رسالة أراد شخصين إيصالها لجمال مبارك، حيث ساقني القدر الأسبوع الماضي لأستمع لحديثين عن جمال مبارك، الأول في الشارع، وأنقل لكم نص الحديث كما دار بين سيدة مرموقة وبين بائع خضروات فلاح يسوق عربة كارو:<br />السيدة: طب قولي بأه.. تسمع عن جمال مبارك؟<br />الرجل: طبعاً يا مدام..<br />السيدة: أنت عارف أنه ممكن يمسك بعد أبوه؟<br />الرجل: إزاي بس.. ومين قال لك أننا هانسكت؟!<br />السيدة: ما إحنا ساكتين طول عمرنا<br />الرجل: لأ.. بس ده لو مسك.. مش هانسيبه<br />السيدة: هاتعملوا إيه يعني؟!<br />الرجل: مش عارف..!!<br />أما الحديث الآخر، فقد دار بين مذيع في إحدى القنوات الفضائية ومواطن مصري يعيش في أوروبا، سأل المذيع المواطن: \"ترشح جمال مبارك لو دخل انتخابات\"؟!<br />رد المواطن: \"لو هايدخلني الجنة مش عايزه..!!"
archived = "2004-09-23"
capture_url = "https://web.archive.org/web/20040923013725/http://www.20at.com:80/article.php?sid=624"

