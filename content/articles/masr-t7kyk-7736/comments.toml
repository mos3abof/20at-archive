text = "اللى فهمتة من الموضوع ومن جملة- احنا دفنينة سوا - ان فية ناس فقراء وغلابة هم اللى بيدفعوا الضرايب وان هناك ولاد ستين فى سبعين اغنياء والدولة بتنطش عليهم وما بيدفعوش<br />زى الجملة بتاع التراث الشعبى الفلسطينى : من ليس عندة يؤخذ منة ومن عندة يعطى ويزاد وهذا كلام شاعر شعبى فلسطينى ناصح"
