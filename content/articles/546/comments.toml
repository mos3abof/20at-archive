[[comments]]
order = 1
subject = "هلى فكرة عاجبنى جدا"
author = "منى ثانية"
posted = "2006-11-02"
text = "على فكرة انا منى ثانية ومستغربة من رأى منى الاولى ده الموضوع بجد جميل وخلانى ارجه عشرين سنة لورا واحس انى كنت عايزة اقطع كل الكتب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103145/http://www.20at.com/article2.php?sid=1400"

[[comments]]
order = 2
subject = "في الحقيقة"
author = "هشام المصري"
posted = "2006-11-02"
text = "الموضوع مثير فعلا للذكريات ، بس أنا ممكن أرجع ورا خماشر سنة بس مش عشرين<br />وافتكر إني مش بس نكت بأقطع الورق بس .. كنت أحيانا بارمي الكتاب شخصيا ..<br />بس لي تعقيب على موضوع إلغاء بعض الأجزاء من الكتب الدراسية الجامعية ، فالدكاتره كانوا بيحذفوا فعلا من المنهج من أجل التسهيل على الطلبة ، ولكن ماحدش قالي اقطع الورقة قبل كده ، لأن مش معقول أقطع ورقة من كتاب لأنها ملغية .. ولكن بالتأكيد إن الدكاتره كانوا يقصدوا إننا مش محتاجين نذاكرها بس ، لكن مش لازم نقطعها عشان تشويه الكتب..<br />ونقطة مهمة جدا اكتشفتها بعد ما خلصت دراستي الجامعية ، وهي أن الكتب الدراسية مهمة جدا ، والأهم هو الإحتفاظ بها لأن المادة التي بها فعلا مهمة وقد نحتاج إليها مستقبلا في بعض المواقف، وقد لا نجد كتب مماثلة في المكتبات الخارجية تعطي نفس الإستفادة، وندمت من أنني كنت أتخلص من هذه الكتب في الحقيقة، فقد كان الأجدر بي أن أحتفظ بها نظيفة ومرتبة لحين الحاجة...<br />بس نعمل إيه ، حتى الندم أصبح لا ينفع ، والكتب مزقت وألقيت في سلال المهملات ، وتبخرت من الذاكرة<br />موضوع واقعي ، وموفق."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103145/http://www.20at.com/article2.php?sid=1400"

[[comments]]
order = 3
subject = "كتبي وصفحاتي"
author = "وفاء&وليد"
posted = "2006-11-02"
text = "انا بحب القراءه جدا وفي كل المجالات مع اني ادبي بس كنت بحب الكمياء والاحياء ولكن التاريخ عشقي الاول<br />مش الكتب اللي عايزه تتقطع الافكار القديمه هي اللي المفروض تتقطع لان لازم كل طالب يدرس اللي بيحبه ومش هنلاقي صفح لازم تتقطع وكتبي الدراسيه مازلت محتفظه بها وعندي استعداد اذاكر طوا العمر<br />وموضوع حقيقي جميل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103145/http://www.20at.com/article2.php?sid=1400"
