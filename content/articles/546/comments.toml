subject = "أيه الهبل ده"
author = "منى"
posted = "2006-11-01"
text = "انا فى الحقيقة مش متصورة ان الهبل بالموقع يوصل لكده ... انتوا موضوعاتكوا فى حياتنا بقت هايفة كده ليه ...<br />ورقة أيه الممزقة وهطل ايه بس .. عايزين موضوعات تتقرى ... أوف"
archived = "2006-11-02"
