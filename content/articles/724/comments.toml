[[comments]]
order = 7
subject = "مجرد رأى"
author = "عمر الجارحى"
posted = "2006-01-13"
text = "السلام عليكم بداية<br />يعنى انا اصلا معنديش روتانا ولا قنوات art كلها , ولكن احب اقول كذا حاجة سريعا<br />1- القناة ترفع شعار مش هتقدر تغمض عينيك واحنا لازم نرفع شعار هنغمض عينينا فعلا وبدأنا نغمضها بجد , ولذلك اتمنى ان احنا نقاطع القنوات اللى ملهاش لازمة فى الحياة<br />2- لذلك ادعوكم جميعا الى عمل حاجة نسميها ( اسبوع المقاطعة : هنغمض عينينا عن روتانا ) واتمنى ان الجميع يتفاعلوا وينشروا لاصحابهم ميل بالموضوع ولو نجح الاسبوع ده نكرره اسبوع كمان ولو نجح شهر كمان لحد لما نغمض عيونا تماما عنها<br />واتمنى عدم الخوض فى اعراض الناس لعظم هذا الفعل والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114545/http://www.20at.com/article2.php?sid=243"

[[comments]]
order = 8
subject = "تبريرات"
author = "روتشى"
posted = "2006-01-13"
text = "اوفقك الراى فيما قلته كله عن روتانا من قراءتك لجدول افلام القناة ولكنى مختلفة معك فى شيئيين الاول هو انه ليس امراهينا ان يتعامل الجمهور مع القنوات بمبدا النوايا الحسنة و ان يمروا على ما تقدمه مرور الكرام بل يجب ان يتعمق الجميع فى قراءة ما تقدمه القناة من افلام وبرامج تافهة حديث رئيستها هالة سرحان دائما ما تحتوى على عبارات جنسية حتى و لو كان الحديث بعيد عن الجنس هذا بلاضافة الى استضافة الست هالة لنجوم من اصدقائها و اعادة عرض افلامهم مرات و مرات .الشى الثانى هو استحالة اقامة مؤتمر حول ما تقدمه هذه القناة او اى قناة اخرى لانه المبرر موجود و هو انها سياسة قناة ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114545/http://www.20at.com/article2.php?sid=243"

