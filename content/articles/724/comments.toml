[[comments]]
order = 10
subject = "تآمر القنوات على المشاهد العربي"
author = "أبو معاذ"
posted = "2006-01-25"
text = "على المشاهد العربي أن يفطن للحرب غير المعلنة التي تشنها عليه بعض القنوات التي لا نعلم لمصلحة من تعمل. فالمشاهد العربي الساذج يثق فيها لمجرد أنها ناطقة بالعربية لكن أهدافها تظهر أنها تخريبية بعد التمحيص. فهي مدمرة للأخلاق التي قال عنها الشاعر :<br />إنما الأمم الأخلاق ما بقيت<br />فإن هم ذهبت أخلاقهم ذهبوا<br />لذا فتدمير الأخلاق يسهل بواسطة بث البرامج الماجنة البذيئة التي تبعد المرء عن دينه وعن مبادئه وقيمه من التزام وحياء ..... فانتبهوا يا شباب وانتبهن يا ربات البيوت من الاندفاع وراء الأفلام التي تنوون من خلال مشاهدتها التمتع ببعض ما فيها من كوميديافتلك الكوميديا ما هي إلا نقطة عسل في طبق من سم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114545/http://www.20at.com/article2.php?sid=243"

