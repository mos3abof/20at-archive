[[comments]]
order = 4
subject = "BATISTUTA"
author = "روتانا سرحان"
posted = "2006-01-12"
text = "عندما بدأت قناة روتانا سينما فى بث برامجها العام الماضى كنت أعتقد انها ستوقف شبكة ART عن احتكار السينما والافلام وسرقة اموال المصريين خصوصا عينى عينك وستظهر لنا قناة محترمة تحاول منافسة هذا العملاق وكسر شوكته باعتبارها قناه غير مشفرة ولكن يبدو ان الوليد بن طلال وصالح كامل سمن على عسل وشعارهما المصلحة فوق الجميع .<br />ماحدث هو ان راديو وتلفزيون العرب ظل كما هو ،نفس الاسلوب الجشع فى فى حصد الاموال واصبحت روتانا سينما تجاريها فى النصب علينا عن طريق اعلانات المحمول وافيهات الافلام .<br />لقد بدأت روتانا فى جذب المشاهد لها عن طريق عرض اكبر مجموعة من افلام عادل إمام يوميا وشراء افلام جديدة والحقيقة هما فلمان فقط الباشا تلميذ وصايع بحر ثم توقفت القناة عن جذب المشاهد يبدو انها قد جمعت ثمنها وتم فض المجلس واصبحت قناة هالة سرحان ونجومها الظراف خفاف الدم حيث انها تصر على ان يقول كل نجم (روتانا سينما مش هتقدر تغمض عينيك) والحقيقة أننى أغمضتها منذ زمن وانصرفت عنها بعد ان تبين لى تفاهة موضوعاتها بل ويصل الامر الى تفاهة ضيوفها لقد فلت من هذا البرنامج موضوعين فقط الاول عن الدرما المصرية والا خر عن بزوغ نجم الاخوان اما غير ذلك فكله عك فى عك وابتذال الى اقصى حد ولنعقد مقارنه بين برنامج فى حجم العاشرة مساء وهالة شو واضيف انا من عندى البيت بيتك وبيت نيرفانا ولنرى اى برنامج يستحق المشاهدة ايهما يحترم عقل المشاهد ويقدم موضوعات جادة وليس استنطاق النجم والحصول منه على اكبر كم من الفضائح والجمل البذيئة تماما كما يأتى عند الاعلان عن البرنامج واهمها حلقتى يوسف شاهين وايناس الدغيدى .<br />واخيرا من يريد ان يحصل على معلومات قيمة وموضوعات جادة فليس امامه سوى القنوات الاخبارية واهمها الجزيرة افلامها الوثائقية الرائعة ولتعقد عزيزى القارئ مقارنة اخرى بين (الجزيرة هذا الصباح ) الذى يأتى فى تمام السابعة صباحا وبرنامج كل المصريين (صباح الخير يا مصر )ولتحكم انت بنفسك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114545/http://www.20at.com/article2.php?sid=243"

