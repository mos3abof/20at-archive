text = "السلام عليكم<br />الحقيقة ما رايت اغبى منا- المعذرة- الاخت هالة هداها الله ليست وحدها فبرامجها تجد من تستضيفه من التافهين و المنافقين و تجد أغبياء يتفرجون عليه و لكن اسرائيل و العالم كله يضحك علينا و يضرب فينا و تستباح دماء المسلمين في كل بقاع الدنيا فأي حرب و اي شعب مقهور إبحث ستجده مسلما كل الامم متحدة ضدنا ونحن نشاهد في روتانا و في الاخت الفاضلة هالة و لست ادري اي دكتوراة اخذتها في امريكا......."
