subject = "لازم نغمض عنيننا"
author = "اشكرك جدا على الموضوع دة بس الحقيقة انو روتانا مش غلطانة اللى بيتفرج على روتانا هو الغلطان؟ كفاية ان اللى ماسكها اداريا هى السافلة الساقطة هالى سرحان الست دة انا اكاد اسميها ب الداعرةز الست دة مافيش افظع منها فى حواراتها و قلة ادبها فى كلامها و انها بتناقش حاجات لو ناس اعدين فى بيت دعارة مش ح يتكلموا فيها"
posted = "2006-01-11"
text = "انا لما باشوف الست دة باستغفر ربنا باخاف ان ربنا يعاقبنى بمجرد انى بس شوفت صورتها القذرة دة على الشاشة<br />الست دة عايزة تعرى بناتنا و تبوظ شبابناانا واحدة من الناس باتمنى ليها موتة صعبة جدا موتة كدة زى بتاعة سعاد حسنىز و كل لما باشوفها على الشاشة بادعى عليها من جوة قلبى ا ربنا يخلصنا منها و من امثالها امين يارب.<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114545/http://www.20at.com/article2.php?sid=243"

[[comments]]
order = 1
subject = "إحنا كجمهور يجب علينا أن تكون لنا وقفة ضد هذه القنوات"
author = "عبدالله"
posted = "2006-01-11"
text = "شكرا لكم علي هذه المقالة ونظرتكم في محلها فعلا... ولكن إحنا كجمهور مسلم يجب أن تكون لنا وقفة مشرفة ضد ما تقدمه روتانا أو غيرها من الفضائيات. يعني لما بدأت البنات يلتزمن بالحجاب الشرعي أصبحت هناك محلات كثيرة تبيع ملابس المحجبات وأصبحت الممثلة تخشي أن تتعري علشان لا تكون شاذة وسط البنات المحجبات ... كذلك لو أننا كجمهور رفضنا ما تقدمه روتانا وغيرها من القنوات لتأدبت هذه القنوات والتزمت بديننا.. أنا عشت سنوات في أميريكا وحمدت ربنا من قلبي علي نعمة الإسلام والله العظيم ... ولكني وجدت أن المجتمع الأميريكي لا ينشغل بمشاهدت القنوات ... أنا بحس أن هناك من يحاول أن يشغل الشعب المسلم عن قضاياه المهمة بإبعاده عن دينه بهذه القنوات حتي رؤساء روتانا أشوفهم مع رؤساء وزعماء أميريكان بشكل كتير وكأن المسألة فيها مؤمرة علينا وإلا إيه ... لازم نفوق وكفاية أفلام ورقص وعربدة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114545/http://www.20at.com/article2.php?sid=243"

