[[comments]]
order = 21
subject = "إبداء رأي"
author = "Paul"
posted = "2006-06-15"
text = "السلام عليكم, أنا فرنسي الأصل, لكن مسلم و أتكلم العربية \" لغة القرآن الحكيم\"<br />أرجو منكم نشر هذه الرسالة للجميع, وفي كل مواقع الواب,,وشكرا....<br />أما بعد,<br />في الخقيقة, أنا لست ضد العولمة و الإنفتاح على الخارج, لكني أرى أن هذا الإنفتاح لن تكون له جدوى إلا إذا كان في خدمة الإقتصاد و النهوض بمستوى عيش المواطن العربي.<br />لكن ما أراه في شتى البلدان العربية أن المواطنين العرب يهاجرون إلى أوروبا للبحث عن الرزق...أما الوضع العربي الداخلي لا يوحي إلا للفقر و التعاسة...و لكن أرى أيضا أن أغلب العرب أصبحوا يقلدون الغرب, و يقولون أن ذلك من مستلزمات العولمة....فعلى أي عولمة تتحدثون؟ ...إن العولمة هي ما صار في أوروبا عندما إتفقوا أن يخولون عملتهم إلى عملة واحدة ألا وهي الأورو, لمجابهة أمريكا...لمجابهة أمريكا...لمجابهة أمريكا...ولكن نحن..لا..نحن نقلد الغرب لنقتل الإسلام...و لنعتز بأمريكا و إسرائيل..<br />و بحصوص عادل إمام...ذلك الأبله الحقير..ألم ير كيف \"أنوني كوين\" الأمريكي كيف يدافع عن الإسلام في أفلامه....و لكن انظروا كيف هذا العربي الفاسق\" عادل إمام\" يكرس مبدأ العولمة الخاطئة...لماذا لا تكون قنوات العرب قنوات علم و دين..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114545/http://www.20at.com/article2.php?sid=243"

