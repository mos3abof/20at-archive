posted = "2006-07-21"
text = "ارجو من الدكتورة هالة سرحان الا تغضب من تعليقات المشاهدين لانو بصراحةعندهم حق فى كل الى بيقؤلؤة ؤلازم انتى كا اعلامية مشهورة يكون ليكى دؤر فى نشر القيم والاخلاق الى اتعودنا عليهة وتربينا عليهة مش الى شفناهاعا الفضايات ففى ناس كلامك بيحرجهم وناس بتسمعو عادى وناس مش طيقة تسمعو فرجأمنى ان تجعلى كلامك لا يتخطى الممنوع غريب القناوى"
