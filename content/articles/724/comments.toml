[[comments]]
order = 30
subject = "روتانا مش هتقدرتبربش عنيك"
author = "السعودى"
posted = "2006-08-04"
text = "لازم نغمض عنيننا<br />أرسل هذا التعليق بواسطة :<br />اشكرك جدا على الموضوع دة بس الحقيقة انو روتانا مش غلطانة اللى بيتفرج على روتانا هو الغلطان؟ كفاية ان اللى ماسكها اداريا هى السافلة الساقطة هالى سرحان الست دة انا اكاد اسميها ب الداعرةز الست دة مافيش افظع منها فى حواراتها و قلة ادبها فى كلامها و انها بتناقش حاجات لو ناس اعدين فى بيت دعارة مش ح يتكلموا فيها<br />انا لما باشوف الست دة باستغفر ربنا باخاف ان ربنا يعاقبنى بمجرد انى بس شوفت صورتها القذرة دة على الشاشة<br />الست دة عايزة تعرى بناتنا و تبوظ شبابناانا واحدة من الناس باتمنى ليها موتة صعبة جدا موتة كدة زى بتاعة سعاد حسنىز و كل لما باشوفها على الشاشة بادعى عليها من جوة قلبى ا ربنا يخلصنا منها و من امثالها امين يارب.<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114545/http://www.20at.com/article2.php?sid=243"

