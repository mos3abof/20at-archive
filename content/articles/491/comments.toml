subject = "مش مهم المسجد"
text = "مش مهم أنت بتصلي في مسجد ايه ولا بتصلي وراء الشيخ مين , المهم انك بتصلي لربنا وحاول تخشع وياريت الناس مش تروح تصلي علشان خاطر الشيخ فلان انما تصلي وراء الشيخ فلان لأني بخشع ورائه مش أكثر.<br />وربنا يتقبل"
archived = "2005-06-08"
capture_url = "https://web.archive.org/web/20050608083615/http://www.20at.com:80/article.php?sid=713"

[[comments]]
order = 3
subject = "يا عم الحاج"
text = "الناس بتروح وراء الشيخ اللي تعرف تصلي معاه لربنا.. الحكاية مش حكاية أنهم بيروحوا عشان شيخ معين .. لكنهم بيروحوا لربنا.. فتخيل لو أنك عايز تصلي لربنا ولقيت إمام صوته وحش أو زي شعبان عبد الرحيم مثلاً، ده مستحيل هاتعرف تصلي لربنا وراه .. وهاتبقى عايز الصلاة تخلص بدري بدري"
archived = "2005-06-08"
capture_url = "https://web.archive.org/web/20050608083615/http://www.20at.com:80/article.php?sid=713"

[[comments]]
