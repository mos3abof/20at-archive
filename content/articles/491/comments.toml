text = "جزاكم الله خيراًً على هذا الموضوع.. أنا بأه يا إمُّا بروح الرواس علشان درس الشيخ صفوت، أو مسجد التوبة علشان فى درس الدكتور ياسر. بس مسجد التوبة صغير جدا جدا جدا و درس الشيخ صفوت تحفة بصراحة."
