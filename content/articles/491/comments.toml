subject = "emooooooo"
text = "والله انا احسن مسجد بصلي فيه هما فى الحقيقه اثنين لما بصلي فيهم بحس انى مش عايزه الصلاه تخلص من كتر ماانا ببقى خاشعة فى صلاتي<br />1- الشيخ الحصرى فى العجوزه ( للدورس فقط )<br />2- مدينة العبور جامع الشيخ مخلوف وده الامام بتاعه اسمه الشيخ عبد العزيز فى الحقيقه انا متأكده انكم لو جيتو تصلو فيه هيعجبكم جدا صوت الشيخ وادأه وتجويده الله يباركله<br />معلش هو العنوان بعيد شوية بس الموصلات سهلة كل شىء"
archived = "2005-06-08"
capture_url = "https://web.archive.org/web/20050608083615/http://www.20at.com:80/article.php?sid=713"
