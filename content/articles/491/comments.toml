subject = "شيرين مجدي"
text = "شكرا على الملاحظة الخاصة بالفتى الكازاخستاني ومسجد الصديق، واحنا فعلا المعلومة استوقفتنا علشان كده مقلناش في الموضوع انه يؤم الناس، ولكن قلنا ان الناس بتتجمع في المسجد بسبب الإعجاب بصوته. وشكراً مرة تانية."
archived = "2005-06-08"
capture_url = "https://web.archive.org/web/20050608083615/http://www.20at.com:80/article.php?sid=713"

[[comments]]
