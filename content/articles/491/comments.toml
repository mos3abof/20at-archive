subject = "علي عبد المنعم"
text = "لا أملك إلا أن أبدي إعجابي (الزائد عن اللزوم) بهذا الموضوع الرائع للأستاذة الزميلة شيرين مجدي والأساتذة الزملاء محمد الدسوقي ويمنى عاطف، وكذلك على هذا المجهود.. منكم نتعلم..<br />ربنا يجعله في ميزان حسناتكم وينفع بكم وبنا إن شاء الله."
archived = "2005-06-08"
capture_url = "https://web.archive.org/web/20050608083615/http://www.20at.com:80/article.php?sid=713"

