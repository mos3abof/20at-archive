[[comments]]
order = 7
subject = "أحمد فتحي"
text = "إلى يمنى ومحمد وشيرين أصحاب \"البانورما\" الملفتة والمعبرة عن حال مساجدنا في رمضان القيام ،<br />الموضوع ملفت ويستحق وقفة ولانه ملفت ويستحق فأسمحوا لي ببعض التعليقات البسيطة والتي لا تعني بحال من الأحوال ضعف الموضوع أما وهي :<br />1- أرى أن عشرينات تسعى حثيثا ولا أعلم لماذا إلى تجييش جمهور/زوار مصريين للموقع بأكثر من جمهور عربي إسلامي حيث تكثر موضوعات محلية مصرية الطبع والأسلوب والأفيهات، وعليه لما لا يكون هناك بانورما عربية لمساجدنا العربية لإحاطة القارئ علما بالمساجد الكبيرة في محيط عالمنا العربي ولها ملامح خاصة والوصول لها في تصوري ليس بالامر الصعب في وجود انترنت ومراسلين (أصدقاء الموقع) دون تكلفة.<br />2- بخصوص المقال أدخل مباشرة إلى عبارة \"تخشع له الآذان قبل القلوب\" فهل الأذن تخشع أم تسمع؟! فحالها السمع والانصات لا الخشوع حال القلوب.<br />3- لا أعلم لما لم يتم ذكر جامع عمرو بن العاص (الأزهر قبل أن يكون هناك أزهر) في هذه البانوراما؟!<br />وجامع عمرو لا يرتبط بأسم شيخ معين بل يرتبط بدور وتأثير!<br />في النهاية لا يسعني إلا أن أشيد بتسلسل الموضوع وبالعناوين الفرعية التي سهلت من القراءة بشكل كبير<br />وبلغته السلسلة الشبابية السلسلة خفيفة الدم<br />وانوه<br />ولو لم يكن الموضوع علق بذهني ما كنت علقت نقدا أيجابيا.<br />تحية للثلاثي المشارك في البانورما وتحياتي لعشرينات محرريين وزوار"
archived = "2005-06-08"
capture_url = "https://web.archive.org/web/20050608083615/http://www.20at.com:80/article.php?sid=713"

[[comments]]
order = 8
subject = "جوامع أخرى"
text = "السلام عليكم و رحمة الله و بركاتة<br />نسيتوا فى مقالكم الممتع, مسجد النور بالعباسية حيث يصلى الشيخ العشرى و هو غنى عن التعريف طبع.<br />أيضا فى شبرا هناك مسجد التوحيد بجانب نفق أحمد بدوى و يصلى به الشيخ ماجد فاروق و هو بالنسبة لى الآن أفضل صوت فى مصر."
archived = "2005-06-08"
capture_url = "https://web.archive.org/web/20050608083615/http://www.20at.com:80/article.php?sid=713"

[[comments]]
order = 9
subject = "tamer.kiki@gmail.com"
text = "السلام عليكم ورحمة الله و بركاته<br />أوصيكم بالصلاة في الأزهر الشريف خلف الشيخ القدير عبدالحكيم عبداللطيف شيخ مقرأة الأزهر فهذا الشيخ الجليل واحد من المعدودين علي مستوي العالم في علوم القران والقراءات.علي فكرة الشيخ يصلي كل ركعة تقريبا بقراءة مختلفة من القراءات العشر المتواترة عن النبي صلي الله عليه وسلم.<br />نصيحة أبحثوا عن أئمة المساجد المتقنين للقراءة أكثر من الأئمة الأجمل صوتا وياسلام لو أجتمع الأثنين معا."
archived = "2005-06-08"
capture_url = "https://web.archive.org/web/20050608083615/http://www.20at.com:80/article.php?sid=713"

[[comments]]
order = 10
subject = "مسجد الصديق"
text = "جزاكم الله خيراًً على هذا الموضوع الشيق والذي أصبح فعلا سؤال كل من يريد الصلاة باستمتاع وخشوع ولا يعرف أين يصلي ولكن أرجوكم تحروا دقة مصادركم، أنا أصلي التراويح في مسجد الصديق بمنطقة شيراتون يوميا والحمد لله و أحيانا أصلي التهجد وأود أن أصحح المعلومة بخصوص الامام فاننا فعلا سمعنا صوت الصبي الكازاخستانى ذو الثلاثة عشرة عاما مرة بين الأربع ركعات الأولى والأربع ركعات الأخيرة من صلاة التراويح ولكنه لم يصل بنا أبدا وقد علق الامام على هذا بقوله: لقد سألنا عن امامة الصبي ووجدنا أنها لا تجوز لذا قررنا أن نسمعكم صوته دون صلاة وسوف يقف وراء الامام ليرده لأنه حافظ القرآن الكريم.<br />وفي النهاية وفقكم الله لما يحب ويرضى"
archived = "2005-06-08"
capture_url = "https://web.archive.org/web/20050608083615/http://www.20at.com:80/article.php?sid=713"

