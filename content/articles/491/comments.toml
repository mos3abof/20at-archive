subject = "وسام كمال"
text = "وحشتينا يا شرين.. الموضوع حلو قوى وقى وقى .. ومكتوب بشكل جميل ,, بس كنت من فضلك عايزة أسأل سؤال هو دسوقى ويمنى مايقدروش يكتبوا الموضوع ؟ أم أنك ذهبت معهم للمساجد؟..شكرا"
archived = "2005-06-08"
capture_url = "https://web.archive.org/web/20050608083615/http://www.20at.com:80/article.php?sid=713"

