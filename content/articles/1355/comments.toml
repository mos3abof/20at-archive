[[comments]]
order = 2
subject = "الكذبة الكبرى"
author = "مصري"
posted = "2006-02-26"
text = "يبقى أن الكذبة الكبرى التي مارسها الأمريكيون – وسيمارسونها– على العرب والمسلمين هو الإدعاء برغبتهم في دمقرطة العالم العربي، فقد ثبت أن هذه رغبة مزعومة ولا يمكن تطبيقها؛ بل يحذر منها عدد متزايد من الساسة الأمريكيين من كلا الحزبين الجمهوري والديمقراطي، وننقل رأي واحد فقط من أبرز الأكاديميين الأمريكيين وهو ملفين ب . ليفر أستاذ التاريخ : \"الحرب على الإرهاب بحالتها الحالية تجعل من الصعب على الإدارة الدفع إلى دمقرطة العالم العربي. إن شن الحروب الوقائية يتطلب الحصول على حقوق المرابطة العسكرية، ومن أجل تلبية احتياجاتها العسكرية على الولايات المتحدة أن توقع اتفاقات مع أنظمة تزدري المبادئ الديمقراطية، وأن تدعمها أيضاً\"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142749/http://www.20at.com/article2.php?sid=496"

