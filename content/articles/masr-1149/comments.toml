subject = "يعنى ايه"
author = "برنامج يكلف الشيء الكثير ويستضيف عاهرة واولادها لتتكلم لمدة ساعة كاملة عن أصول التربية الحديثة لراقصة مصر الاولى فى كيفية تربية بناتها وكأنها الام المثالية على مستوى العالم ما اهمية هذا الحلقة أن يقدمها مذيع له ثقله وشعبيته الكبيرة وبعد أن أستضاف السيد عمرو موسى فى برنامج اليوم السابع وكانت حلقة رائعة"
posted = "2006-11-16"
text = "أرجوا الا ينحدر المذيع العظيم محمود سعد فى مستنقع الفساد وينجو بنفسه من هذا البرنامج التابع للحزب الواطى بمذيعه المكروه تامر امين"
