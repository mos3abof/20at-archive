[[comments]]
order = 0
subject = "مرضى لا ريب.."
text = "من يقدم في الأساس على فعل المعاكسة مخطئ لا شك،<br />أما من تلبس حجاب الجينز فالله يهديها إن شاء الله، ويجب أن نساعدها لكي تصل لبر الأمان.. لا نعاكسها، ونفتنها ونتسبب في إبعادها أكثر عن شرع الله..<br />أما من يعاكس من تستر نفسها بحجاب شرعي فهو ليس مخطئاً فحسب بل هو يقدم على فتنة إحدى المؤمنات الغافلات المحتسبات عند الله .. اللاتي قدمن رضا الله على هوى النفس والشيطان.. وهذا عظيم عند الله..<br />والله أعلم .. ربنا يهدي الجميع"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033801/http://www.20at.com:80/article.php?sid=388"

[[comments]]
order = 1
subject = "mohammed_elrafei@hotmail.com"
text = "بدلا من سؤال هذه الحفنة الضالة من الشباب اسألوا الشباب المؤمن الموجود في المساجد ، هذا المقال بقدر ما هو يعترف بالحجاب الا انه يحاربه في نفس الوقت و يالها من مفارقة عجيبة !!<br />تدعون ان البنات المتحبات هن اللاتي يعاكسهن الشباب - الساقط في وحل الرزيلة - و في بدء الصفحة اعتراف بفرضية الحجاب ثم تطرحون اسماء و اشخاص يبدو انهم لا يفهمون من الدين الا اسمه , و توضحون وجهة نظرهم - و هم غير مؤهلين الا للتأديب - و هذا يعتبر بلبلة عقلية لكل اخت تنوي لبس الحجاب.. ولسان حال المقال يقول لو اردت ان يعاكسك الشباب فعليك بالحجاب ,, هذه الاولى اما الثانية فاللاتي يعاكسهن الشباب مع لبسهن للحجاب فان حجابهن في الغالب لا يكون حجاب اسلامي فهو حجاب كما هو موضوخ في الصورة حجاب شيطاني حتى تسكت الاخت ضميرها و تشعر انها فعلت المطلوب منها و هذا لعب بدين الله .."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033801/http://www.20at.com:80/article.php?sid=388"

