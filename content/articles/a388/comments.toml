[[comments]]
order = 4
subject = "ارى ان يحذف هذا الموضوع"
text = "لعرض الموضوع إما أن يكون بناء هادف ويحمل رسالة او على الأقل أن يقوم بحمل الصورة والصورة المقابلة بكل حيادية واتاحة الفرصة للرأيين.<br />أنا أعلم أنه ربما يكون عرض الموضوع بهذا الشكل هدف فى حد ذاته لرؤية ردود الأفعال ولكن لا أوافق أن تمس أمور مثل قضية الحجاب بهذا الطريقة وأضم صوتى لمحمد رفعت فيما قال"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033801/http://www.20at.com:80/article.php?sid=388"

[[comments]]
order = 5
subject = "جديد الموقع"
text = "من أحد غايات العمل الصحفي هو عرض الظواهر الغريبة في المجتمع سواء كانت ايجابية أو سلبية، و بصرف النظر عن موافقتناو تأيييدنا لها أو لأ..<br />ليه فهمتوه على انه دعوة لمن تريد انها تتعاكس أن ترتدي الحجاب؟ أنا شخصيا بعد ما شفت هيافة أسباب الشباب إلي بيعاكس المحجبات بس اتمسكت أكتر بحجابي لأني مش حاتخلى عن شيئ أنا مقتنعة بيه عشان شوية شباب هايف زي ده..."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033801/http://www.20at.com:80/article.php?sid=388"

[[comments]]
order = 6
subject = "عاشقة لبنان"
text = "السلام عليكم اخوتي في الله<br />والله لا ادري كيف لشاب مسلم ان ينطق بمثل هذا الكلام والحمد لله ان هذا راي فئه من الشباب اسمحوا لي ان اقول الشباب الذي لايهدف الا الى المعاكسه واحلامه تقتصر على النيل من الفتيات .بعض الاخوات المحجبات هدانا وهداهم الله يبرزون مفاتنهم مما يثير انتباه الشباب ولكن هذا لا يبرر ان يقول بعضهم ان المحجبه تظن بانها شيخه وبانهم يعاكسونها عن قصد واحيانا بهدف لفت انتباه اخرى ,اقول لهم من لا يحترم من صانت نفسها لن يحترم السافرات ,اما الاخ الذي يعتقد بان المحجبه لا تحصل على الاهتمام والى ما هنالك فاقول له والله ليست بحره من تركت الحجاب وان حصلت على انتباه شباب سخيف لا فرق بينه وبين ذئاب الغاب<br />ولا تنسوا اننا مسلمون وعرب ولا نزال نغار على العرض والشرف اتقوا الله في اعراضكم فلكم امهات واخوات وبنات وزوجات"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033801/http://www.20at.com:80/article.php?sid=388"

