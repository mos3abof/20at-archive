[[comments]]
order = 8
subject = "برافو"
text = "المقال بيناقش موضوع مهم جداً ويدل على جرءة الكاتبة في مناقشة مثل هذه المواضيع الشائكة ولكن لي عتاب على الكاتبة أنها أخذت برأي فئة من الشباب لهم وجة نظر واحدة وهي عدم مبنية على انهم غير متدينيين ولم تأخذ رأي فئة أخرى متدينة وهذه هي نقطة الضعف الوحيدة في الموضوع وان ضد من يهاجم الكاتبة على أخذ راي هذه الفئة لاننا يجب أن نعرف أيضا وجهات نظر وأسال الله أن يوفق الكاتبة ويهديها الى مناقشة مواضيع في نفس أهمية هذا الموضوع لانها قضية فعلا حيوية يجب أن تستحوذ على اهتمامنا وشكراً"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926033801/http://www.20at.com:80/article.php?sid=388"

