[[comments]]
order = 1
subject = "عدوان متواصل علي الدستور"
author = "علاء البراز . محام حر"
posted = "2006-06-13"
text = "المتابع لنظام الحكم المصري يجد عدوانا منهجيا علي الدستور. حتي تأكد حنث الرئيس بالقسم و يثبت ذلك مراجعة ما سمي ببرنامج الرئيس مع تصرفاته ز و سماحه لنجله باغتصاب العديد من صلاحيات الرئيس .بالذمه دي دولة"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218162334/http://masr.20at.com:80/article.php?sid=505"

[[comments]]
order = 2
subject = "الثورة"
author = "مسلم"
posted = "2006-06-13"
text = "لا فائدة من محاكمات شعبية او ما شابهها , يجب علينا ان نواجه الحقيقة , ان الحكام هم السادة وابناء الشعب هم العبيد وابحت مبادئ الحكم ومبادى الديمقراطية والدستور الذى يجعل السيادة للشعب لا قيمة لها , هذه الحقيقة , نحن عبيد ولن نسترد حريتنا الا برفض الاوضاع , بالثورة كما ثار ابائنا للتخلص من استبداد ملوك اسرة محمد على , فالحكام المستبدين لا يرجى صلاحهم ابدا ."
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218162334/http://masr.20at.com:80/article.php?sid=505"

[[comments]]
order = 3
subject = "امـــــــــــتـــى يـــــــا بـــكـــره تــيـــجــى بـــقـى"
author = "ان ما يحدث داخل تلك السلخانات المسماه سجون و معتقلات يكشف عن ان النظام المصرى نظام ســــادى غبى المصريين بالنسبه له مجرد هوام و حشرات حقيره لا قيمه لها"
posted = "2006-06-14"
text = "تفتكر لو انت معتقل و حصل لك زى اللى حصل لمحمد الشرقاوى ـ فقط لانها احدث قصه ـ وخرجت بعد ما انتهكوا عرضك وحسيت بحجم الظلم و عرفت طريق كلب من زبانيه التعذيب حتعمل فيه ايه ؟؟؟<br />ما تقلقش اليوم ده قريب اكتر مما تتصور<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأأأااه يــــا بــــــلـــــــدى"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218162334/http://masr.20at.com:80/article.php?sid=505"

[[comments]]
order = 4
subject = "عزبة مولانا وابن مولانا"
author = "اسامة العربى"
posted = "2006-06-20"
text = "مايحدث الان سواء فى المعتقلات او فى اقسام الشرطة ليس بالجديد.فبما ان الشعب لاقيمةله فالشعب ليس الا عبيد فى عزبة مولانا واسرتة.او على اكثر تقدير خدم عزبةمولاناوماهوكائن من هامش حريةراى او خلافةما هى الا حسنة من ولى النعم فهى عزبة ومورثةلابنة ولابن ابنة .فلن تكون هناك حرية حقيقية ولا انتخابات حرة الا بوجود شعب حر .ولن يكون شعب حر الا اذا عاش حياة كريمة وعلم حقوقة الانسانية والصحية والاقتصادية والتعليميةوالسياسية من هنا يخشى الحاكم من شعبة ويعمل من اجلة فبالعلم تبنى الامم وبالجهل تهدم الامم ."
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218162334/http://masr.20at.com:80/article.php?sid=505"

