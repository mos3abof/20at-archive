author = "مصرى"
posted = "2006-06-22"
text = "لن ينصلح حال البلد الا اذا حدث تغيير واذا ما كان التغيير بالطرق الدستوريه هو ضرب من ضروب المستحيل فلابد ان يسور الشعب حتي يغير"
