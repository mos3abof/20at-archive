subject = ""
author = "بقية التعليق السابق"
posted = "2010-02-01"
text = "وواقع المسلمين بعد أن جاءهم كتاب فيه ذكرهم وفيه أسباب هدايتهم,تركوا القرآن ونسوا حظاً مما ذكروا به .ففرقوا دينهم إلى شيع وطوائف ومذاهب.<br />السنة ,تكفر الشيعة, والشيعة تكفر السنة والجهاد يكفر الأخوان ,وحماس تكفر جند الله …وهكذا …تم تفريق الدين الى شيع وطوائف ومذاهب واختلفوا من بعد ما جاءهم العلم<br />لهذا كان لابد من تطبيق القانون الإلهي الثابت والصارم عليهم ,الذي يقول …أيها المسلمون …كونكم فرقتم دينكم …فسيغري الله العداوة والبغضاء بينكم الى يوم الدين ,وهذا ما نراه على أرض الواقع مع كل أسف .ولا حل لهذه الإشكالية إلا بالتغير والعودة الى الذي يستطيع جمع امة الإسلام وتوحيدها ألا وهو كتاب الله عز وجل كتاباً وحيداً. القرآن وكفى.<br />يقول الله عز وجل<br />\" لو أنفقت ما في الأرض جميعا ما الفت بين قلوبهم ولكن الله ألف بينهم انه عزيز حكيم\"<br />(منقول)"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205012808/http://www.20at.com:80/masr/hot-topics/15147-2010-02-01-04-27-10.html"

[[comments]]
order = 2
subject = ""
author = "بقية التعليق السابق"
posted = "2010-02-01"
text = "يقول الله عز وجل:<br />\"ومن الذين قالوا إنا نصارى أخذنا ميثاقهم فنسوا حظا مما ذكروا به فأغرينا بينهم العداوة والبغضاء إلى يوم القيامة وسوف ينبئهم الله بما كانوا يصنعون \"<br />هذه الآية الكريمة ,هي قانون آلهي ,تتحدث عن وضع النصارى الذين نسوا حظاً مما ذكروا به ,وهذا الوضع أدى الى تفرقتهم الى شيع وطوائف ,أي فرقوا دينهم ,واتبعوا أهوائهم ورهبانهم …النتيجة أغرى بينهم الله العداوة والبغضاء الى يوم القيامة .وها نحن نرى مدى صدق هذا القانون الألهي في علاقة المسيحين فيما بينهم , لا بابا روما يعترف به الأرثوذكس ,ولا البروتستانت ,والعكس هو الصحيح . لدرجة أن أحدهم لا يصلي في كنيسة الأخر.<br />لنعد الى موضوعنا الأساس ,ودعونا نطبق القانون الألهي على وضع المسلمين ,وهل الآية جاءت فقط في النصارى أم أن القصد هو تنبيه المسلمين لما سيحدث لهم إذا فرقوا دينهم.<br />\" إن الذين فرقوا دينهم وكانوا شيعا لست منهم في شيء إنما أمرهم إلى الله ثم ينبئهم بما كانوا يفعلون \"<br />\"ولا تكونوا كالذين تفرقوا واختلفوا من بعد ما جاءهم البينات وأولئك لهم عذاب عظيم\""
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205012808/http://www.20at.com:80/masr/hot-topics/15147-2010-02-01-04-27-10.html"

[[comments]]
order = 3
subject = ""
author = "بقية التعليق السابق"
posted = "2010-02-01"
text = "لكنه في الوقت نفسه عالج القرآن حالات الأقوام السابقة ,بشكل قصص قرآني ,أو توجيهات دلت على سلبيات تعاطي تلك الأقوام مع كتبهم السماوية ,وما آلت إليه أحوالهم بعد ما ابتعدوا عن هدايتها لهم ,وكانت النتيجة سلبية وأحياناً كارثية عليهم بالطبع . هذه المدرسة القرآنية لم تعالج هذه الحالات عبثاً ,صحيح أنها كانت تقصد أهل الكتاب وغيرهم ممن سبقوهم …لكنها بالواقع تنسحب على هذه الأمة ,لتكون لهم مدرسة وعبرة."
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205012808/http://www.20at.com:80/masr/hot-topics/15147-2010-02-01-04-27-10.html"

[[comments]]
order = 4
subject = ""
author = "بقية التعليق السابق"
posted = "2010-02-01"
text = "هذه القوانين الاجتماعية ,هي سنن في هذا الكون ,مثلها مثل السنن الكونية ,بمعنى أن الشمس تشرق من الشرق وتغرب غرباً, فمهما دعونا الله عز وجل ,فإنه لا يغير سننه الثابتة من أجل بشر .<br />والقوانين الاجتماعية ,أيضاً كما ذكرت هي سنن ثابتة تحدد مجموعة العلاقات الإنسانية . وحسب تصرف البشر , يتم تحديد مسار تطورهم وتقدمهم .فالله لا يغير ما في قوم حتى يغيروا ما بأنفسهم .أليس هذا القانون الإلهي هو القانون الاجتماعي الثابت الذي لا يتغير .<br />القرآن الكريم عندما تنزل على قلب الرسول(ص) .كان المسلمون آنذاك في بداية التكوين الديني ,وكان الرسول (ص) يقود هذه الأمة في بدايتها ,أي أن بداية تكوين الأمة كانت تدار من السماء,لهذا لم تظهر بعد المشاكل والتأويلات البشرية ."
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205012808/http://www.20at.com:80/masr/hot-topics/15147-2010-02-01-04-27-10.html"

[[comments]]
order = 5
subject = ""
author = "بقية التعليق السابق"
posted = "2010-02-01"
text = "فكرت بهذا الأمر طويلاً ,وصرت أبحث دائماً في كتاب الله القرآن الكريم عن أجوبة محددة لما يجري في عالمنا الإسلامي وعلى من تقع المسؤولية هل تقع على الخالق(معاذ الله) أم على المخلوق.(من قرأ قصة الأخوة كرامازوف ,سيجد أيضاً هذا الحوار الذي شغل العالم بين اخوين ,أخ ملحد والأخر قسيس ,وكان موضوع الحوار ,هو الحرب مابين الأتراك والأرمن آنذاك ,عندما كان الأتراك يقذفون بالطفل الأرمني الى الفضاء ويتلقون جسده بالرماح ,هنا سأل الملحد أخاه القسيس ,أين كان الله(معاذ الله) عندما قُتل هؤلاء الأطفال الأبرياء؟؟؟).هنا يجب التفريق بين فعل البشر وسلوك البشر ,ومشيئة الخالق وإرادته.ومفهوم الثواب والعقاب إما في الدنيا أو الآخرة .أو في الدنيا والآخرة.<br />صحيح أن القرآن كتاب هداية للبشر أجمعين ,لكنه في الوقت نفسه يحتوي على الكثير من القوانين العلمية والاجتماعية خاصة ,والتي تحدد العلاقات الإنسانية بين البشر وخالقهم ,وبين الفرد وأخيه في الإنسانية ,وبين المسلم وأخيه المسلم."
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205012808/http://www.20at.com:80/masr/hot-topics/15147-2010-02-01-04-27-10.html"

[[comments]]
order = 6
subject = ""
author = "بقية التعليق السابق"
posted = "2010-02-01"
text = "\"محمد رسول الله والذين معه أشداء على الكفار رحماء بينهم تراهم ركعا سجدا يبتغون فضلا من الله ورضوانا سيماهم في وجوههم من اثر السجود ذلك مثلهم في التوراة ومثلهم في الأنجيل كزرع اخرج شطاه فازره فاستغلظ فاستوى على سوقه يعجب الزراع ليغيظ بهم الكفار وعد الله الذين امنوا وعملوا الصالحات منهم مغفرة وأجرا عظيما \"<br />, المفترض أن المسلمين يشكلون أمة تدعو الى الخير ,يأمرون بالمعروف وينهون عن المنكر . كما وأن كتابهم القرآن يأمر بحرمة قتل النفس إلا بالحق,كتاب يدعو الى العفو والمغفرة بين الناس ,كتاب يدعو الى السلم ,لن أذكر الآيات في هذا السياق, فكل من قرأ القرآن لابد وأنه مر عليها وتدبرها بشكل واعي."
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205012808/http://www.20at.com:80/masr/hot-topics/15147-2010-02-01-04-27-10.html"

[[comments]]
order = 7
subject = ""
author = "ابومحسن غربة 29 سنه"
posted = "2010-02-01"
text = "لماذا هذه العداوة والبغضاء بين المسلمين<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــ<br />إن المتتبع لأحوال المسلمين في العالم ,يُدهش من كثرة العداء والبغضاء فيما بينهم ,والتي وصلت الى حد التصفية الجسدية ,والقتل على الهوية.المئات من الأبرياء يسقطون قتلى نتيجة هذا البغض الشديد الأسود الذي يغلف قلوب بعض المسلمين بل أكثرهم.<br />والسؤال الذي يطرح نفسه ,هل العلة في الإسلام أم العلة في المسلمين<br />بطبيعة الحال ,الجواب العلة في المسلمين . والمتتبع للشؤون الإسلامية ,سيقول أن ما يجري هو نوع من الصراع السياسي بين المسلمين ,غايته السلطة والمال والنفوذ.<br />كل ذلك صحيح ,وصحيح أن الخالق أرسل نبيه بالرحمة والحق,وأنزل كتاباً يدعوا الى نبذ العنف والتآخي وخاصة ما بين المسلين(الإسلام بمفهومه العام والشامل) ,الذين هم رحماء فيما بينهم وذلك حسب قول الله عز وجل"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205012808/http://www.20at.com:80/masr/hot-topics/15147-2010-02-01-04-27-10.html"
