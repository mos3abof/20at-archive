posted = "2010-02-01"
text = "ماذا ستفعل الجزائر في كاس العالم<br />اذا كان في كاس افريقيا عماله تتمسخر من كل الفرق الافريقية<br />الجزائر على ما يبدو اصابتها لعنة الفراعنه"
