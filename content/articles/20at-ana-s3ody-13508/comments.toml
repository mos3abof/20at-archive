[[comments]]
order = 5
subject = ""
author = "ابوشادي"
posted = "2009-10-08"
text = "للاسف نحن لا نسب الا انفسنا ان كنا مصريين او سعوديين فالبلدين هم بلادنا جميعا ولا يصح الا ان كل بلد له تجاربه وهو يملك مطلق ا لحرية فيما يقرر ويفعل ولايحق لسعودي ان يسب بلدا آخر ولايحق لمصري ان يسب بلدا نعتبره رمز لنا جميعا ونحن نرحب باي خطوة تستطيع ان تخرجنا من ضغوط الحياه مادامت تتسم بكل الضوابط التى تحافظ على بناتنا العربيات والشابات السعوديات اغلبهن مهذبات واصحاب فكر ورأي وهن يعلمن مقدار ما تتمتع به الفتاه العربية بالحرية ولها ان تحصل على ذلك وهى لاتحتاج لتوجيه او تنبيه على بركة الله وموفقين باذنه تعالى."
archived = "2009-10-09"
capture_url = "https://web.archive.org/web/20091009045721/http://www.20at.com:80/20at/ana-s3ody/13508-2009-09-24-10-09-33.html"
