text = "السلام عليكم انا مادري وش دخل المصاريه فينا ليش مايروحن ينقدون بلدهم كلهااللي سرقه ونصب وبعدين لما نفتح جامعه مختلطه احسن من مانفتح شارع هرم عندنا انا اشوف انها خطوه ممتازه والله يخلي المللك ويطول عمره مقصر ابدا بانه يبي يرقا ببلدنا الي احسن مستوى"
