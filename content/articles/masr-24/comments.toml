[[comments]]
order = 1
subject = "قصدك بلد مافيهاش راجل ( دكر )"
author = "كرميلينو"
posted = "2006-03-23"
text = "للاسف بغض النظر عن موضوع الفساد فابراهيم عيسى قال قبل كده في الدسنور ظهر الفساد في البر و البحر و دلوقتي انا بقول في الجو كمان بعد ظهور الطيور المزكومه<br />للاسف تاني اكتر مستخدمي الفياجرا في مصر هما من الشباب ( اللي المفروض يكون بيعرف ) بس للاسف طلع مبيعرفش<br />و ده سر الغلب اللي احنا فيه ؟؟؟<br />اننا مبنعرفش<br />و الصراحه راحه"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021419/http://masr.20at.com:80/article.php?sid=24&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"
