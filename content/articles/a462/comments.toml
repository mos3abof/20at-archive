[[comments]]
order = 4
subject = "ثائر 1"
text = "هل تنفع روبي ان تكون سيدة منزل ... وأم أطفال .... وزوجة<br />صالحة طاهرة عفيفة شريفة.... لا أعتقد سيدي .... وطبعا لن<br />أتكلم عن الدين وانا تعمدت ذلك لأنها بعيدة عنه بعد الشمس أو<br />اكثر فلا نجهد أنفسنا في ذلك<br />و إذا فكرت في الزواج منها (والعياذ بالله)... فما هي الإفادة<br />التي سأحصل عليها؟ .. ما الذي سيميزني عن أي شخص أخر<br />يراها .... فالرجال بصفة عامة لا يحبون الشئ المستهلك (تفهم<br />قصدي)<br />والأخ الذي يقول إنه قد يتزوجها لو لبست الحجاب .. أول له ...<br />أنتظرها لسنوات حتى تهرم ويلقي بها المنتجين جانبا فتتحول إلى<br />الشيخة روبي وأحسب إنك لو رزقت منها بفتاة فسوف تصبح أبا<br />لنجمة ( صاروخ كما يسمونهاوبنت الوزة وزة)في إعلان عصير أو في<br />أغنية وطنية (ولا هو جاني كدى ) طبعا بعد تركها للبيت *** فليس لبس الحجاب هو التطهر من المعاصي ( قال الرسول-ص- تخيروا<br />إن العرق دساس)<br />بلغوا روبي تحيات........... مش تحياتي طبعا<br />*** تم حذف العبارة غير اللائقة<br />* والتعليق منقول من ساحة حوار إسلام أون لاين التي نشرت مداخلة عن نفس الموضوع"
archived = "2004-08-19"
capture_url = "https://web.archive.org/web/20040819201244/http://www.20at.com:80/article.php?sid=462"

[[comments]]
order = 5
subject = "هو ده يا جماعة كلام يتعمل عليه موضوع كامل!!!!!"
text = "مين روبي علشان يتعمل عليهاكل الهلمة دي؟؟؟<br />على كدة بقى حيكون الموضوع الجاي عن نانسي عجرم و اللي بعده هيفاء وهبي ... إيه الهجص ده؟!<br />و الحقيقة أراء الشباب غريبة و خصوصاًالأخ محمود إبراهيم الي بيقول إنه ممكن يعيش معاها في الحرام لكن مستحيل تكون زوجته و أم أولاده و الحقيقة ده أسوأ مثال شفته في حياتي و اللي بيقيد طريقة الرجل الشرقي ( إمشي مع البنات اللي تعجبك لكن اللي حتتجوزها دي حاجة تانية ) إتقوا الله بقى, الحقيقة و مع الأسف نموذج محزن و مقزز للغاية, يا جماعة أرجوكم كفاية كلام عن روبي بقى سيبوا الناس في حالها دي أعراض بنات برضوا و ربنا يتوب عليها و علينا و يستر على ولايانا, يا رجالة كفاية بقى حرااااام!<br />من أختكم في الله."
archived = "2004-08-19"
capture_url = "https://web.archive.org/web/20040819201244/http://www.20at.com:80/article.php?sid=462"

[[comments]]
order = 6
subject = "مساء الخير"
text = "اما لم ارى هذه الوجه من قيل ولا اعرف هذه السحنه ! ولا ارى انه من الضروري اعطاء شخص ليس بهذه الاهميه كل هذا الاهتمام والتجوال بين الناس وسؤالهم ( تجوز روبي ؟ ) هو السباب لاقي ياكل علشان يتجوز اي حد ، وبعدين لما نقولهم تتجوزوا نكلمهم عن روبي ده ايه النكد ده ياربي الشباب هيلاقيها منين ولا منين .<br />وبعدين حد يقولي مين روبي دي يا اخوانا انا معرفهاش !!!"
archived = "2004-08-19"
capture_url = "https://web.archive.org/web/20040819201244/http://www.20at.com:80/article.php?sid=462"

