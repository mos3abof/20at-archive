subject = "لول اللول"
text = "لول اللو اللول اللول<br />زغاريت فرح الرجالة قوي الجدعان قوي<br />وبعدين مين هيتجوز روبي لا مؤاخذة<br />ويا ترى هيكون وضع شريف صبري ايه في العملية؟<br />مأذون مثلا؟<br />ولا ايه؟<br />وبعدين يا جماعة الجواز سكة وروبي سكة تانية خالص<br />أنا هقول<br />أصل الحكاية إن إن .... ولا بلاش<br />مش قادر أكمل معلهش"
archived = "2004-08-19"
capture_url = "https://web.archive.org/web/20040819201244/http://www.20at.com:80/article.php?sid=462"

[[comments]]
