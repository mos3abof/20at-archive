subject = "بيرو"
text = "روبي.....<br />ودي حد يتجوزها دي ....؟؟<br />مفيد فوزي قالها ...<br />لا روبي ولا نانسي ولا هيفاء ولا اي واحدة منهم تصلح للزواج...<br />الزوج هيشوف أيه أكتر من اللي الدنيا كلها شافته ...<br />قال يتجوز روبي قال !!!!!!!<br />عليا النعمة دي تهيسة محصلتش..!!!"
