[[comments]]
order = 12
subject = "مكنتش عايزة أخش"
text = "ياجماعة نفسى أخش مرة و ملاقيش حد بيتكلم عن روبى و مثيلاتها, صدقونى هوا دة اللى عايزينوا من الشباب,هما صدرولنا روبى وغيرها عشان يشغلونا عن كل حاجة, المشكلة مش فيها, و مش الحل ان احنا ننقدها,احنالو بطلنا ننقدها دة هيكون اكبر دليل على عدم تأثرنا بيها,وشوية شوية هى و اخواتها كلهم هىغوروا فى داهية, داتهم القرف ملوا البلد,دة اصلا لو انتوا عايزنهم يغوروا,ولا هوا نقد و خلاص, دة موضوع تانى بقى......... عموما اللى مش متاثر بيها و الراجل الجدع فيكم يلم عزالوا و يمشى من هنا و ميجيش تانى..و لية عندى عروسة احسن و احلة منها مليون مرة.........وروبى نفسها ميهمهاش نقد بس هتتحرق اوى لو ملقتش حد بيتكلم عنها و بينهش عرضها, هتتحرق نفسيا و فنيا ولون خسارة فيها الكلمة,واظن الشباب فهمين و عارفين كل دة,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,ووووووووووفكر شوية يا بو دم حامى....................... بكرة خلاص فى تفتيش,عايزاكوا تخلوا المنطقة,,,,,,,, الهم بلغت الهم فاشهد"
archived = "2004-08-19"
capture_url = "https://web.archive.org/web/20040819201244/http://www.20at.com:80/article.php?sid=462"

