[[comments]]
order = 1
subject = "معلومة وعلامة تعجب"
text = "جمال مبارك هو اللي اتخذ قرار تحرير سعر الصرف العام الماضي وبالتالي ارتفعت الأسعار بالشكل الجنوني الذي نعيشه الآن وعاطف عبيد برئ .. عاطف عبيد برئ والأيام اللي احنا عايشنها دلوقتي بروفة للأيام السودة اللي جاية .. وطبيعي الفقر يسكننا طول ما ولاد الناس التانية تحكمنا والناس التانية .. ناس غيرنا لا تدري بوجعنا وعجبي"
archived = "2004-06-27"
capture_url = "https://web.archive.org/web/20040627102857/http://www.20at.com:80/article.php?sid=366"

