[[comments]]
order = 0
subject = "مصري ...مصري الصراحة"
author = "محمد السيد"
posted = "2006-07-08"
text = "والله المصري ده مفيش زيه أبدا يا جماعة ...<br />مفيش حاجة تقف قدامه أبدا ... حتي الفياجرا ... خلاها فياجرا مصراوي ...<br />عايزين نعلم الدنيا كلها الحركات دي ... خلوا الناس تاكل عيش ...<br />و عشان كده برضه ... مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090750/http://masr.20at.com:80/article.php?sid=625"

[[comments]]
order = 1
subject = "حتى دى كمان"
author = "واحده من مصر"
posted = "2006-07-09"
text = "دا بقى أسمو بيبيع الوهم فى علب.<br />وخلاص ربنا يخلى السيد وزير الصحه الى أدى قرارتو باصنيع الفياجرا فى مصر عشان فايزر طهقت الشعب المصرى أهى حتبقى صناعه محليه.<br />يعنى ما فيش أدويه افيد من كده ومحتاجها الشعب المصرى والله دى حاجه عجيبه.<br />بس على العموم الحركه دى تيجى من واحد دماغه عالى أوى ربنا يخلى تفانين مخ المصريين"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090750/http://masr.20at.com:80/article.php?sid=625"

[[comments]]
order = 2
subject = "الفياجرا و الوهم"
author = "حزين"
posted = "2006-07-09"
text = "لم نسمع شكوى أحد من هذه الفياجرا رغم هذا الكم الهائل الذي بيع بالاسواق !!! حيث أن العملية الجنسية تعتمد بنسبة كبيرة على الحالة النفسية أعتقد أن الناس تعاطوا هذه الحبة المغشوشة و أعطتهم نفس المفعول فقد أعطتهم الوهم الذي يحتاجونه لاكمال الحالة النفسية"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090750/http://masr.20at.com:80/article.php?sid=625"

[[comments]]
order = 3
subject = "فكرة طبيعية"
author = "مصري موجوع"
posted = "2006-07-09"
text = "عندي فكرة احسن من الأدوية والكلام الفاضي ده ... كل واحد يعلق صورة صاحبنا علي صدره وزي مابركاته وقفت حال البلد أكيد برضه ح توقف له ..ـه"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721090750/http://masr.20at.com:80/article.php?sid=625"

