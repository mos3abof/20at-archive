subject = "الفياجرا المغشوشة"
author = "مستشار العشاق"
posted = "2006-07-14"
text = "والله العظيم لو كنا شعب بيفهم ويدقق في كل حاجة ماكان واحد نصاب ذي ده يستغل ضعف النفوس"
