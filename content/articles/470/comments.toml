[[comments]]
order = 35
subject = "مصر .... بتاع البتاع ؟؟"
text = "انا من الكويت ولا تزعلوا من الكلام اللى بقوله لانه حق.. وللاسف ايام الستينات كنا بننظر لمصر بشكل .. والان بشكل اخر ..<br />كلمة مصرى فى العالم تعنى الان : انسان خيالى عايش فى حلم خرافى عن بطولات واوهام واحلام يقظة ..؟؟<br />كل دول العالم تطورت الا مصر تخلفت ؟<br />عندما اذهب الى مصر لا اجد الا غابة وشعب محطم يلهث على العيش بكفاف ... ويمجد رؤساءه واللى مشحتينهم ؟؟<br />تخلف وروتين ورشاوى ولا يوجد اى احترام للضعيف ؟.. لم ارها فى دولة فى اى دولة فى العالم ؟؟؟ والغريب انكم تعتزون بذلك ؟؟ قل ايه قال ام الدنيا ؟؟ واحنا اللى لبسنا البحر مايوه؟! هههه .. خليكم فى احلامكم ... للاسف ضاعت مصر العزة ؟..فى احضان اسرائيل واللى ما يسوى وضاعت انسانية بشر بعد ان تم تمسيخها ؟؟ وعاش الفرعون - مبارك - وشعبها المحطم ؟؟"
archived = "2005-06-26"
capture_url = "https://web.archive.org/web/20050626074822/http://www.20at.com:80/article.php?sid=826"
