[[comments]]
order = 16
subject = "ايمن المصري"
text = "طبيعي ان الواحد يحب المكان اللي اتولد و اتربي فيه، و جي حاجة ما نقدرشي نتحكم فيها. بس الاحوال المتغيرة اللي ممكن تكون سيئة او بشعة - زي دلوقتي - ممكن تساهم في تكوين بذرة كراهية تكبر لحد اما تغطي الارض اللي عليها الحب. عندها نفس المكان-الوطن بيبقي هو اللي بتحبه و تكرهه في نفس الوقت. نجيب سرور قال:<br />ياجنة خضراء سورها نبي<br />يا قضة حمقاء يكتبها غبي<br />يا طاهرة<br />يا داعرة<br />يا قاهرة<br />ولان الاوضاع الفظيعة، فساد، كساد، بطالة، فقر، تخلف، اصولية، تعصب، احباط، اكتئاب، ما حدش فينا راضي عنها و حاسين انهامش احنا اللي متسببين فيها، عايزين حل و مش لاقيين.<br />دلوقتي ما بقيتشي الاقي دفاع ينفع اقوله للي عايز يهاجر عشان اقنعه يصرف نظر.<br />لكن لازم اقول ان مصر الارض غير مصر الدولةوالناس، مش كده؟"
archived = "2005-01-07"
capture_url = "https://web.archive.org/web/20050107090526/http://www.20at.com:80/article.php?sid=826"

[[comments]]
order = 17
subject = "أنا جيجي من السعودية"
text = "الله صور في منتهى الجماااااااااااال!!<br />أنا كمان بموووووووووت في مصر والمصريين ...<br />والله العظيم بأحب مصر وأهلها موووووووت ..<br />انابديت بحب مصر من الثانوية لما تعرفت على شلة بنات مصريين زي العسل وبقوا من اعز اصحابي لدرجة والله العظيم انه فيه بنات كتير عندنا في المدرسة بيقولوا انتي بتكدبي علينا انتي مش سعودية انتي مصرية !!!<br />منيتي أجي ازور مصر إن شاء الله يحصل قريب ...<br />أنا نفسي أجي القاهرة وأشوف الزحمة والمواصلات اللي بتقولوا عليها ونفسي اتمشى على النيل واشوف الناس والزحمة واروح الحسين والسيدة زينب واكل الفول والطعمية والكشري وأقعد على القهاوي :)<br />الله !!!!!!!!<br />بحب اللهجة المصرية اوي اوي ..وليا اصحاب كتير في مصر زي العسل :) ... وربنا يخلي المسلسلات والروايات المصرية والدكاترة المصريين اللي بيدرسوني اللي علموني اللهجة لحد مبقيت زيكم ؛)<br />اقولو يارب انزل مصر قريب عشان اجي ازوركم!!!<br />وحتى مع وجود العيوب في مصر مصر هتفضل عظيمة والمصريين هيفضلوا ناس زي الفل !!<br />ومتنسوش حديث الرسول صلى الله عليه وسلم :( استوصوا بأهل مصر خيرا فإن لنا فيها نسبا وذمة ) رواه مسلم ..<br />ربنا يحفظ مصر واهلها<br />ممكن حد يتوسط لي عند الريس عشان احصل على الجنسية :)<br />جيجي - السعودية"
archived = "2005-01-07"
capture_url = "https://web.archive.org/web/20050107090526/http://www.20at.com:80/article.php?sid=826"

