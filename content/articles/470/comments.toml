order = 25
subject = "بني آدم"
text = "مصر !!!!!!!<br />يعنى ايه مصر ؟<br />يعنى انت وانا وكل المصريين دلوقت و زمان.<br />يعنى تخلف وجهل وسرقةونصب ومحسوبيه ورشاوى وكوسة وبتنجان اسود علينا.<br />يعنى شعب طول عمره مركوب من احتلال خارجى لاحتلال داخلى ياقلبى لا تحزن.<br />يعنى الفهلوه والشطارة والغباء المستحكم ومافيش حد بيحترم حد ومشى حالك واى حاجه فى اى حته وماحدش فاهم حاجه.<br />انتوا يعنى من صورتين ابيض و اسود هاتتغازلوا فى مصر.<br />ماهو طول مااحنا قاعدين على القهاوى والمصاطب نمصمص فى شفافينا ونقول مصر ام الدنيا وفرحانين بالكام صنم اللى عندنا-اللى نصهم مسروقين برا-عمرنا ما احنا مهببين حاجه فى ايامنا دى.<br />قال ايه:<br />مصر الحضاره , مصر العراقه , مصر هبه النيل<br />هههههههه والاخر مصر للمصريين<br />انهى مصريين<br />اذا كانت هى اتباعت اصلا ولسه نازلين بيع فيها.<br />الله يرحمك يايحيى حقى (شعب سمج ثرثار قفاه طول لعابه يسيل ......).<br />والاخت اللى بتقول انها سعودية فرحانه على ايه , على الخيبه, مسلسلات ايه اللى كلها عرى ومفاهيم غلط فى غلط , واللهجه اللى بهدلت اللغه العربيه .<br />مصر يعنى احنا مش مجرد اللى المكان اللى احنا فيه , واحنا كلنا غلط ف غلط والحمد لله على كل شىء"
archived = "2005-01-07"
capture_url = "https://web.archive.org/web/20050107090526/http://www.20at.com:80/article.php?sid=826"

[[comments]]
order = 26
subject = "ابن الإسلام الذى ولد فى مصر"
text = "السلام عليكم ورحمة الله وبركاته<br />باسم الله أقول:<br />موطني حيثما المآذن تسري بنداء التوحيد والإيمـــــــــان<br />كلكم إخوة، فلا جنس يعلـــو فوق جنس بالزيف والبهتـان<br />راية الله وحدتكم جميعـــــــا إن تكونوا موزعي الأوطـان<br />عربي وأعجمي ســـــــــواء أبيض اللون أسود سيـــــــان<br />لا لفرعون أنتمي حين أعزى لا لفينيق أو آشور ومانـــــي<br />نسبي حين أنتمي إســـــــــلام وحد الكون من قديم الزمـان<br />حيث تغدو\"اللـــــه أكبــر\" بدءا لنداء التحرير للإنســــــــان<br />حيث تغدو \"الله أكبر\" بعثـــــــا لضحايا الظلام والطغيــــان<br />حيث يغدو الصديق صنو بلال حيث تمحى فوارق الألـوان<br />حيث تسمو مبادىء، حيث تعلو راية الله، هذه أوطـــــــــاني<br />ابن الإسلام الذى ولد فى مصر"
archived = "2005-01-07"
capture_url = "https://web.archive.org/web/20050107090526/http://www.20at.com:80/article.php?sid=826"

[[comments]]
order = 27
subject = "بحب مصر لكن بكره المصريين"
text = "فعلاً<br />بحب مصر مكان - تاريخ ذكر فى القرآن و التوراة و الإنجيل العديد من المرات<br />لكن فعلاً المصريين او الروتين المصرى علشان ابقى دقيق يخلوا الواحد يكفر<br />ادينى اهه لسة طفشان من البلد لهجرة من اسبوع<br />كنت بالدموع و انا ماشى<br />بس بجد انا هنا حاسس انى بنى آدم<br />و انا فى مصر كنت بتعامل اقل شوية من اللى احنا بنعامله للامؤاخذة الحيوانات هنا - و ليه اقل شوية !! ده اقل كتير<br />تصدق و تآمن بالله منك ليه<br />كسرت اشارة هنا<br />و طبعاً اكيد انتوا عارفين فى انجلترا هنا كسر الإشارة يمكن يكون ابشع من القتل شوية<br />البوليس جرى ورايا و جابنى<br />الراجل فضل يتأسفلى ربع ساعة ان هو مشكلته ان شغلانته انه يدينى نقطة سودة على رخصتى !!!!!!!<br />و ان هو ان كان عليه نفسه يسيبنى بس المشكلة ان القمر الصناعى هو اللى جابنى<br />بيتأسف و انا الغلطان !!!!!<br />سبحان الله<br />كنت راكن على جنب علشان ارد على التليفون فى الطريق الصحراوى<br />جالى واحد عامل زى حلة المحشى قعد ساعة يقل فى ادبة و يتسافل علشان يسحب الرخصة و فى الآخر خدنى مخالفة تليفون محمول<br />بس بجد نفسى ارجع<br />مصر دى فعلاً ام الدنيا<br />بس من غير المصريين<br />واحد طفشان من البلد"
archived = "2005-01-07"
capture_url = "https://web.archive.org/web/20050107090526/http://www.20at.com:80/article.php?sid=826"

