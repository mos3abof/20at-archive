[[comments]]
order = 14
subject = "قصيدة لأحمد فؤاد نجم"
text = "كلمتين لمصر<br />كل عين تعشق حليوة<br />وإنتي حلوه ف كل عين<br />يا حبيبتي<br />قلبي عاشق<br />واسمحي لي<br />بكلمتين<br />كلمتين يا مصر يمكن<br />هما آخر كلمتين<br />حد ضامن<br />يمشي آمن<br />أو مآمن يمشي فين ؟<br />شابه يا أم الشعر ليلي<br />والجبين شق النهار<br />والعيون<br />بحرين أماني<br />والخدود<br />عسل ونار<br />واللوايي فى إبتسامتك<br />يحكوا أسرار المحار<br />يا للي ساكنه القصر عالي<br />إمتى يهنا لي المزار<br />كلمتين يا صبيه<br />طال على الانتظار<br />كلمتين يا مصر يمكن<br />هما آخر كلمتين<br />حد ضامن<br />يمشي آمن<br />أو مآمن يمشي فين<br />قصرك المسحور غيلانه<br />أغبي من دود الغيطان<br />بعد مص الغصن لاخضر<br />ينحتوا عضم العيدان<br />وإللى خلا الارض خضرا<br />وإللى خلا الدار أمان<br />عاش بجوعه ملو جوفه<br />مات بخوفه م الغيلان<br />روح الغلبان ما قالشي<br />عن شقا العمر إللى كان<br />كلمتين لمصر يبقوا<br />هما آخر كلمتين<br />حد ضامن يمشي آمن<br />أو مآمن يمشي فين<br />آدي كلمه من عذابي قلتها لك<br />باقي كلمه<br />من حنيني صنتها لك<br />فى الضلوع من دنيا ظالمه<br />كنت خايف يلمحوها<br />يقتلوها ف سكه ضلمه<br />شقشقت والنور بشاير<br />زهرة الصبار يا سلمى<br />يا نسيم الشوق يا طاير<br />خد لمصر الصبح كلمه<br />طول ما يبقي الركب ساير<br />بالبصاير والعنين<br />يبقي ضامن<br />يمشي آمن<br />يبقي شايف<br />يمشي فين<br />سجن شبين القناطر / 1973"
archived = "2005-01-07"
capture_url = "https://web.archive.org/web/20050107090526/http://www.20at.com:80/article.php?sid=826"

