text = "اتمنى ان ترجع مصر مثل ماكان عبد الناصر بيقودها ويارب يجي رئيس مثله يخيليها اجمل واحسن دوله لانها الان اصبحت اي كلام الخمر يزيد والبلطجه اكتر وحدث ولاحرج وانا بقول كلامي بكل صراحه<br />وعلشان ترجع مصر عايزين حكام ما يخافوش من حد مهما كان ده مثل ايام عبد الناصر لما اتحدي ثلاث دول وهي/بريطانيا واسرائيل وفرنسا"
