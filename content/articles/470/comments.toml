[[comments]]
order = 12
subject = "القيصر"
text = "مع اني بحب البلد دي أوي أوي بس ما فيش مانع نذكر بعض العيوب البسيطه فيها:<br />1-الشوارع زحمه على الأخر.<br />2-سبل الموصلات فيها عامله زي علب التونه.<br />3-مافيش شقق فاضيه الواحد يتجوز فيها ولو في غاليه جدا لو موجوده في الصحراء جنب الديب والثعالب.<br />4-مافيش أي فرص عمل للشهادات المتوسطه ولا حتى الشهادات العاليه الا لو انت جايب امتياز طول فتره دراستك احتمال تلاقي شغل.<br />5-لو انت مصري وماعندكش وسطه يبقى زيك زي شجره الجيميز الي تحت بيتكم.<br />6-نظام تعليم فاشل من أول الحضانه الى الجامعه.<br />7-كل واحد في مصر تيجي تكلمه لازم تحس ان خلقه ضيق أوي أوي ومش طايقك.<br />8-عندنا نظام روتيني معقد جدا جدا وعلى ايه ما تفهمش.<br />9-نهر النيل بقى عامل زي ترعة خط 18.<br />10-المنتج المصري أسعاره مولعه نار وعلى ايه ما تعرفش.<br />من الأخر كده مصر بلد الكوسه والوسطه<br />بس مع ذلك انا بحب البلد دي بحلوها ومرها لو ان مافيش حاجه حلوه فيها"
archived = "2005-01-07"
capture_url = "https://web.archive.org/web/20050107090526/http://www.20at.com:80/article.php?sid=826"

