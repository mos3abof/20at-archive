[[comments]]
order = 6
subject = "نجم الدين"
author = "السلام عليكم معشر الكرام/"
posted = "2006-05-18"
text = "تالله ما جعل المأفون شارون هذا اسطورة وقائدا لايبارى إلا من جعل قزما كالمقبور السادات وتابعه حسني عباقرة الفن الحربي عندنا، والله وملائكته الأبرار وكل ذي قدر من التميز السليم أنهم كاذبون.<br />كرجل يفهم شيئا من العسكرية وربما من السياسة أيضا، أخبركم أن هذا القائد الفذ إحتاج لإجتياح لبنان لأكثر من أربعة آلاف وخمسائة دبابة ومدرعة، علاوة على كل إسطول إسرائيل الجوي والبحري، وجيش جنوب لبنان و قوات وليد جنبلاط والمليشيات المسيحية كلها وهروب الجيش السوري. ومع ذلك فقد تكبد عبقري الحرب هذا خسائرا باهظة، لايزال يذكرها أبناء العمومة ويعيرون بعضهم البعض بأن شلومو أو مناخيم أحدث في سرواله خوفا من الفدائين.<br />عسكرهم ليس خيرا من عسكرنا، وإن تفوقوا علينا بالسلاح والعتاد، ولكن ليس عندهم من خونة الزعماء من عندنا. ألا يكفي بأن تعلمون بأن السادات هذا يتآمر والحرب لم يمض ثمان وأربعين ساعة على نشوبها على قائد أركانه الفريق الشاذلي، ويبلغ كيسنجر بالخطة كلها! أيحدث مثل هذا حتى فى بلاد الواق واق؟<br />الموساد مخترق لكل مؤسساتنا وليس العسكرية منها فقط، ورجاله غالبا القائمون على تلك المؤسسات، وأتحدى أرقى نظام إستخباري عربي إن كان يعرف شيئا عن حارس بوابة الموساد أو الشين بيت.<br />هل تفهمون ما أقول؟<br />السبب أقوله لكم وهو أنهم يحترمون قيمة وآدمية البشر عندهم، ولهذا لايسهل إختراقهم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125157/http://www.20at.com/article2.php?sid=655"

