text = "ولكن ياترى إذا مات طواغيت العرب وعلى رأسهم ، ال سعود و حسنى والاسد وملك الاردن ، هل يأتي بعدهم طواغيت؟؟!!<br />الامر -يا شباب الاسلام - مناط بكم ، أما أن تختاروا الذل ، فيخلف الطاغوت طاغوت آخر ، أو تختاروا الحرية ، فتقيموا بلد الحرية والمؤسسات."
