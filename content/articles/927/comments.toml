subject = "وكان نعم الرجال--"
author = "سنووايت"
posted = "2006-04-04"
text = "لقد فقدت الامة العربية<br />رجلا عزيزا أه عزيزا صعيع يعني \" صلاح عبد الله \"<br />وهيسافر بقى على جهنم الحمرا زي حجر الشيشية اللي بيترص اه<br />وهوه مسافر هيعدي على مقابر شهداء صبرا وشتيلا والناس اللي دبحها بايده -- عامة هوه اخر عملية عملوهالوا انهم استاصلوا نص عظام الجمجمة يعني هيروح مشوه كمان<br />يلا بالشفا وعلى راي صاحب الكلي كوكو اللي كتب على مقبرته - الى جنة الخلد يا كوكو- إلى نار جهنم يا شوشو 0"
archived = "2006-11-02"
