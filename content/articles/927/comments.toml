[[comments]]
order = 2
subject = "كـــلب وراح"
author = "kranshy19"
posted = "2006-04-03"
text = "ازاى مش هنعزى فى الخنزير الكبير<br />دول جيرانا يا جماعة عيب كدة وبعدين النبى وصى على سابع جار<br />ان ماكنش دول كدة جمبنا على طول<br />جمبنا مين دا انا سمعت ان الاكل بتاعنا كلة من عندهم ..هو احنا مايلين من قليل<br />حتى انفلونزا الفراخ سمعت اننا مستوردينها من عندهم<br />طيب بعد دة كلة يباة لازم نقوم بالواجب<br />ونروح نعذى فى الراجل الكبير بتاعهم<br />انا عندى فكرة اية رايكم لو رحنا كدة ال70 مليون هيلة بيلة على اسرائيل نعزى فية وبالمرة نرجع الارض للفلسطنيين<br />كلة طبعا هيقول واحنا مالنا ياعم وانا سامع الواد احمد صاحبى بيقولى من وراى اهو ياعم لما اضبط البت الاول وواحد تانى نفسة يتجوز وواحد نفسة....<br />يالا بلاش نجيب فى سيرة الناس علشان حرام<br />انا عن نفسى هعلف\\ق يافطة كبيررررة اوى فى الشارع وهكتب عليها كلب وراح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125157/http://www.20at.com/article2.php?sid=655"

