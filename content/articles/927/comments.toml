[[comments]]
order = 0
subject = "و لا عزاء للشهداء"
author = "مناضل أنترنتى قديم"
posted = "2006-04-03"
text = "السلام عليكم و رحمة الله و بركاته<br />أنا اتوقع أن يكون نعى شارون باللغه العاميه ليكون اقرب لفهم الناس و يكون نصه كالتالى<br />فقدت عملية السلام المزعومه بوبى و لا كل البوبيهات بوبى من اشجع البوبيهات هو اى نعم دبح فى مصريين و فلسطينين و لبنانيين و لكنه رجل مناضل كان بيدافع عن ارضه و الراجل باين عليه حس بغلطته<br />و عمل معانا سلام فى اخر أيامه و ضحى بنفسه و بمستقبله السياسى علشان السلام يعنى يعملوكوا ايه اكتر من كده انتم شوفتم منظر المستوطنين اليهود اللى كان يقطع القلب و هما<br />خارجين من غزه و فىا لأخر العالم المتحضر تف على وش شارون و كل ده علشان السلام طب بلاش سبكم من كده الراجل ده لما عمل الثغره فى حرب أكتوبر عارفين عملها ليه<br />اقولكم انا لان الثعره ديه تعنى وجود مفاوضات لان العرب لو كسبوا الحرب كانوا هايتنططوا و ده احسن لهم لانهم مش عارفين فين مصلحتهم<br />ولهذاو لتاريخه المشرف كمناضل من مناضلى السلام نهدى لروح شارون البريئه البيئه أغنية شعبولا حبيب الملايين<br />انا بكره أسرائيل<br />ملحوظه البوبى فى لغة رؤساء الجمهوريات هو ابن الدوج اللى بيهوهو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125157/http://www.20at.com/article2.php?sid=655"

