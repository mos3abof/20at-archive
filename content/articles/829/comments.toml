text = "رغم انى ف القران احب صوت لقلبى عبد الباسط بس فعلا من اجمل الاصوات اللى ف التواشيح هو النقشبندى<br />و فعلا مولاى انى ببابك من اروع الحاجات اللى ممكن الواحد يسمعها<br />رائع فعلا"
