posted = "2006-09-25"
text = "الحمد للة ان فى تسجيلات لان احنا فى فرقة جنة مثلا معظم بروفتنا هى جزء من هذاالفن الذى تركة هذا الرجل بارك الة فية وجعلة ذخرا للاسلام ورحمة وجعلة من اهل جنات النعيم<br />الهم امين المنشد الاسكندرانى محمد محمود"
