[[comments]]
order = 0
subject = "لا للتهييس"
author = "أكرم"
posted = "2006-02-06"
text = "اسلوبك مش حلو يا هبه شكلك كان ضعيف في العربي و بالذات التعبير و يا ريت تريحينا من تهييسك شويه لو عايزه تتكلمي عن حسني وولده ( البقالة اللي تحت بيتنا طبعا ) اتكلمي احنا في بلد دمويقراطي ( على رأي احد التعليقات الجامده ) و ياريت تغيري اسم المقال الا التهييس هو الحل و السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112720/http://www.20at.com/article2.php?sid=390"

[[comments]]
order = 1
subject = "شكراً"
author = "هبة ربيع"
posted = "2006-02-06"
text = "أشكرك على التعليق يا أكرم ، ما سبق كان قصة قصيرة وليس مقالا ، لم أقل أنها عن مبارك وولده لكن أنت ما شاء الله عندك فراسة وعرفتها لوحدك ، في القصة وارد جدا الخيال لا أعرف ماذا تقصد بتهييس لان هذه الكلمة لم تدخل قاموسي بعد لأنني كما قلت أنت \"ضعيفة في العربي وخاصة التعبير \"<br />تحياتي<br />هبة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112720/http://www.20at.com/article2.php?sid=390"

[[comments]]
order = 2
subject = "مستفز انا اخشيني"
author = "أكرم"
posted = "2006-02-07"
text = "انا هقرا المقال تاني على انوا قصة و هعلق برضوا بس متزعليش لو قلت رأيي فيها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112720/http://www.20at.com/article2.php?sid=390"

[[comments]]
order = 3
subject = "خنقة"
author = "هبة"
posted = "2006-02-08"
text = "انا معاكى هبة وبس على راية الكلام مفقوش قوى انتى تقصدى مبارك وابنة مفيش داعى انك تغطى كلامك . وعلى راى محمد صبحى شعبى الحبيب الصبور المهاود المطرمخ ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112720/http://www.20at.com/article2.php?sid=390"

