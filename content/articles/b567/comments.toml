[[comments]]
order = 0
subject = "يا سلام على خفة الدم"
author = "عابر القارات"
posted = "2006-03-13"
text = "يا سلام على خفة دم أمك أنت و تشينى .... أنا مش فاهم إزاى الناس دى أصلا بتنام بالليل مش بتضحك بعد ما بسببه بيموت على الاقل 500 - 600 شخص كل يوم إزاى يلاقى نفس أصلا يظهر فى المجتمع ... فعلا اللى إختشوا ماتوا ... و على أيه الاستعجاب إذا كان بوش نفسه بيقول أنه بيعمل اللى بيعمله فى العالم ده بوحى من الإله ... يبقى إضحك يا بوش و هزر يا بوش .... عليه النعمه ده إنتا هتضرب ضرب و ساعتها بقى قول إنه ده وحى من الإله و قابلى لو تشينى كان فاضيلك ساعتها علشان يضحك على اللى بتقوله يا أهبل يا إبن الاهبل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142625/http://www.20at.com/article2.php?sid=567"

[[comments]]
order = 1
subject = "صح"
author = "توتا"
posted = "2006-03-14"
text = "هههه عسل ياعابر القارات<br />بس هما مهما كانو بردو عايشين حياتهم بالطول والعرض<br />يعنى بالرغم من كل اللى بيحصل عندهم لكنهم متماسكين ومترابطين وايد واحدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142625/http://www.20at.com/article2.php?sid=567"

[[comments]]
order = 2
subject = "هزر يا أبو دم خفيف"
author = "عابر القارات"
posted = "2006-03-14"
text = "و الله يا توتا أنا متخيل اصلا انهم مش طايقين بعض لكن هما زى العصابة اللى فيها قتال القتله و الهجام و النشال كلهم بيشتركوا فى انهم مجرمين لكن عارفين ان مصلحتهم مع بعض فلازم يمثلوا انهم إيد واحده و صدق الله العظيم إذ قال \"تحسبهم جميعا و قلوبهم شتى\" و الحلو انهم بيمثلوا على العالم انهم إيد واحده علشان مصلحة شعبهم لكن المجرمين عندنا لا عارفين يمثلوا و لا إيد واحدة الا بس على شعبهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142625/http://www.20at.com/article2.php?sid=567"

[[comments]]
order = 3
subject = "هههههههههه"
author = "Dabdoob"
posted = "2006-03-15"
text = "ايه الكلام الغريب ده<br />انتم تظنون ان الشعب الامريكي يشعر كل يوم بالندم لانه قتل واحتل وووووو<br />هههههههههههه<br />الامر يشبه نظرة النعجة للجزار علي انه رجل قاتل قاس بينما لا ينظر هو للامر سوي علي انه عمله ومصدر رزقه ان يقتلها لا اكثر ولا اقتل<br />بمعني اخر ان امريكا لا تطبق الا ما هو في مصلحتها وهذا هو المعيار الطبيعي لتصرفاتها ولكن المشكلة في من تركها تفعل ما تريد دون ان يحافظ علي مصلحته<br />وارجو ان يكون كلامي واضحا<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142625/http://www.20at.com/article2.php?sid=567"

[[comments]]
order = 4
subject = "الجــــــــــــــــــزار الأمــــــريكــــــــــــــــى بــــــــوش"
author = "Mr . X"
posted = "2006-03-15"
text = "تعليقك حلو قوى يا عابر القارات<br />وانا اقترح على الحاج بوش انه يقلب البيت الأبيض الى البيت الأحمر الملطخ بدماء العرب او يطلق عليه المدبح الأبيض هيكون اسمه اوقع واحسن وربنا يجعلك عبرة الى من لا يعتبر زى الخنزير ابن الخنازير صديقك وحبيب قلبك شارون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142625/http://www.20at.com/article2.php?sid=567"

[[comments]]
order = 5
subject = "صح يا dabdoob"
author = "نيفين"
posted = "2006-03-15"
text = "كلم دبدوب صح يا جماعه و يمكن اللى قرأ كتاب بروتوكولات صهيون يفهمنى<br />الجندى الاسرائيلى اللى بيمسك بندقيه و يصوبها على قلب طفل فلسطينى مش بيحس الا بالفخر لانه كدا بيأدى خدمه لوطنه اللى هو شعب الله االمختار<br />لا دا كمان بيادى خدمه للانسانيه لانه بيحميها من ارهابى بيقتله ف الصغر<br />وعشان كدا بيقتلو الناس بكافه اعمارهم بدم بارد<br />و الجنود اللى كانو بيعترضو و ترق قلوبهم هماغ اللى كانو بيفهمو ما وراء هذا<br />بس دا ميمنعش ان الطفل اليهودى بيتعلم قبل ماما و بابا اسرائيل الكبرى من النيل الى الفرات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142625/http://www.20at.com/article2.php?sid=567"
