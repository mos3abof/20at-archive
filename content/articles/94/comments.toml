subject = "مصـ( الخير )ـعب"
text = "يا سلام يا سلام ...الحقوا يا ولاد , عمكم براء قلب وبقى مخرج......اطردوا الخائن العميل من موقعكم , فقد أتى إليكم كاتبا وتتركونه مخرجاً... لا تدخلوه حتى يدفع نسبة من أرباحه...........على فكرة أنا اقرب صديق ليه في الوجود, لكن طالما فيها فلوس انا غرضي أهدي النفوس"
archived = "2004-08-10"
capture_url = "https://web.archive.org/web/20040810194817/http://www.20at.com:80/article.php?sid=379"

[[comments]]
