text = "الاخ اللي بيتكلم ده انا عارفة كويس ...أكسل شاب في الدنيا ...الحائز علي جائزة الدولة التقديرية في النوم وجايزة نوبل في الاحلام ...الشخص ده هو ...أخوياااااااااااااااااا !!!!!! انا لله وانا اليه راجعون"
