[[comments]]
order = 0
subject = "اريد الاتصال بدكتور نبيل لوقا"
author = "نور خالص"
posted = "2006-06-12"
text = "هل تتكرم بمنحى رقم تلفون خاص لدكتور نبيل لوقا بباوى أو عنوان البريد الالكترونى له أو عنوان اقدر على مقابلته، لأنى اريد ان اقدم الدعوة لزيارة بلدى مع مفكر اسلامى فهمى هويدى، جزاكم الله خيرا كثيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150343/http://www.20at.com/article2.php?sid=40"

[[comments]]
order = 1
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-09-19"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102150343/http://www.20at.com/article2.php?sid=40"
