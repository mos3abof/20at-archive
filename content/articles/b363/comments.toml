subject = "حجتكم مكشوفه"
author = "أولاً الموضع الذي نشرتموه يدل علي انكم وقعتم في حرج لعدم نشر موضوعات عن الهجرة وانكم فكرتم في حيلة (سوفسطائية) للتغلب على هذا الأمر وإلا لما كان العالم كله يحتفل برأس السنة الهجرة وأنتم في وادي اخر. وبعدين هل اكتشفتم الآن فقط أن رأس السنة الهجرية يجب أن تبدأ ببداية شهر ربيع الأول؟! فأين كنتم في شهر ربيع الأول من عام 2005 الذي وافقت بدايته العاشر من إبريل 2005 ؟! والله حجتكم مضروبة يا (مضروبين) ."
posted = "2006-02-01"
text = "وإن كان هذا مبرركم لعدم الاحتفال بالهجرة يا جهابذة فما هو مبرركم لعدم التركيز على موضوع المقاطعة في السعودية...؟! أكيد بكره حتطلعوا علينا (أعوذ بالله من الشيطان الرجيم) بموضوع (عفواً ..لن نقاطع) .<br />من فضلكم الرد علي وجهة نظري عشان أنا اتخنقت منكم ومن ألاعيبكم."
archived = "2006-11-02"
