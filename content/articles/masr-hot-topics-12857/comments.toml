author = "الركشة الهندية"
posted = "2009-08-06"
text = "عربة الركشة الهندية موجودة فى الهند من اربعين سنة وكذلك فى بنجلاديش<br />وهى وسيلة مواصلات قميئة وجربوعة وتنشر الاحساس بالفقر لدى السياح والسكان<br />ولم تدخل مصر فى عصر ناصر ولا السادات<br />ولكن فى ايام الفكر الجديد دخلت مصر عربة الركشة واطلقوا عليها التوك توك ولا ادرى سر تسمية الركشة بالتوكتوك ومين هو العبقرى اللى اخترع الاسم دة<br />وسائقى التوكتوك كلهم من الحرامية والبلطجية والعواطلية وكل الموبقات فيهم"
archived = "2009-12-23"
