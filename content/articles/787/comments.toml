[[comments]]
order = 0
subject = "حسبى اللة"
author = "هند حمدى"
posted = "2006-09-18"
text = "فى السابق كانت الاسائة من بعض الصحفيين دون الخبرة ورغم هذا الاعتداء الا ان كان عزائنا الوحيد انهم ليسواهل علم ولكن هذة المرة للاسف ومن المفترض انهم اهل علم وانهم معصومين فكيف تخرج هذةالاسائةمنهم وانا اتسائل ماذا بوسعى ان افعل الا قولى (حسبى الله ونعمة الوكيل)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123321/http://www.20at.com/article2.php?sid=1229"

[[comments]]
order = 1
subject = "عمرو بن العاص"
author = "عاطف زكى"
posted = "2006-09-30"
text = "اخوانى اقراؤ التاريخ الاسلامى عندما دخل عمرو بن العاص مصر ماذا كان يفعل الرومان فى اهلها وماذا فعل اهلها عندما راؤ المسلمين اليس الرومان مسيحيين واهلها مسيحيين اقراء التاريخ الاسلامى يامايكل هداك الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123321/http://www.20at.com/article2.php?sid=1229"

[[comments]]
order = 2
subject = "المغضوب عليهم والضالين"
author = "عاطف زكى"
posted = "2006-10-05"
text = "الاسلام هواعدل الاديان فى العالم بالقياس الى روايته ودرايته واصوله وفروعه0كما ان الشريعه الاسلاميه {القران الكريم هو كلام الله}هى اعدل الشرائع بين شرائع الاديان بالنسبه الى مسائلها الاصوليه والفرعيه ويمتاز الدين الاسلامى بعدم الغلو والمبالغه واللاافراط واللاتفريط فهو اعدل الاديان بين الاديان الاخرى فالدين الاسلامى يمتاز بعدم التشدد او التقصير انماهو دين العدل والاعتدال ويصح ان يوصف المسلمين بانهم (امة وسط)قال الله عز وجل{وجعلناكم امة وسط لتكونوا شهداء على الناس ويكون الرسول عليكم شهيدا}واعلموا نحن شهداء عليكم يوم القيامه بما فعلتم وبما تفعلون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123321/http://www.20at.com/article2.php?sid=1229"
