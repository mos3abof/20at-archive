text = "طيب لو حد اتمسك من المصريين دول كرهينة زي اللي بيحصل كده كل يوم والتاني في العراق احنا يبقي موقفنا ايه..هي الناس دي تستاهل ولا ايه بالظبط؟؟؟ولا قولولونا نعمل ايه معاهم..ماحدش عارف ياجدع الضرب بييجي منين ؟؟؟؟؟"
