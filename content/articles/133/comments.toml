[[comments]]
order = 17
subject = "مطر"
text = "أحضر سلة<br />ضع فيها أربعة تسعات<br />ضع فيها صحف منحلة<br />ضع (شمعا أحمر)<br />ضع (حبلا)<br />ضع (سكينا)<br />ضع (كلب ينبح بالجملة)<br />يسبق ضلة<br />يلمح اللا أشياء<br />ويسمع دب النملة<br />ثم أخلط هذا كله<br />وتأكد من غلق السلة<br />ثم اسحب كرسيا وأقعد<br />فلقد صارت عندك دولة."
archived = "2004-08-15"
capture_url = "https://web.archive.org/web/20040815222802/http://www.20at.com:80/article.php?sid=438"

[[comments]]
order = 18
subject = "مطر"
text = "حين أتى الحمار من مباحث السلطان<br />كان يسير مائلا كخط ماجلان<br />فالرأس في انجلترا<br />والبطن في تنزانيا<br />والذيل في اليابان<br />- خيرا أبا اتان<br />* أتقثدونني ؟<br />- نعم مالك كالسكران<br />* لا ثيء بالمرة يبدو انني نعثان<br />- هل كان للنعاس ان يهدم الأسنان<br />أو يعقد اللسان<br />قل هل عذبوك<br />* مطلقا<br />كل الذي يقال عن قثوتهم بهتان<br />- بشرك الرحمن<br />لكننا في قلق<br />قد دخل الحصان منذ أشهر<br />ولم يزل هناك حتى الآن<br />ماذا سيجري أو جرى<br />له هناك يا ترى<br />* لم يجر ثيء أبدا<br />كونوا على اطمئنان<br />فأولا : يثتقبل الداخل بالأحضان<br />وثانيا : يثأل عن تهمته بمنتهى الحنان<br />و ثالثا<br />أنا هو الحصان"
archived = "2004-08-15"
capture_url = "https://web.archive.org/web/20040815222802/http://www.20at.com:80/article.php?sid=438"

[[comments]]
order = 19
subject = "ردا على سونيا"
text = "ما الذي جعل أحداث 11 سبتمر عطاء ؟ و ما الذي جعل محمد عطا معطاءً ؟ هل تؤيدين الذي قام به ؟ قتل ثلاثة آلاف برئ . و علام تستندين في هذا التأييد ؟ ثم ما الخير الذي جلبته لنا أحداث سبتمبر ؟ أرجو أن تعدديه لي فأنا لا أرى منه شيئاً؟ بل بالعكس أرى أنها لم تجلب لنا سوى الذل و الهوان و ما يحدث في أفغانستان و العراق و جوانتنامو و في جميع أنحاء العالم العربي من خلال خطة الشرق الأوسط الجديد التي يريدون تطبيقها فيه كل هذا يشهد على الخراب الذي جلبته لنا أحداث سبتمبر .هذا غير موجة العداء لإسلام التي انتشرت في أوروبا و أمريكا و يعاني منها أخواننا هناك . ناهيك عن الاستغلال الشاروني لتلك الأحداث ليشبه أخواننا المجاهدين في فلسطين و في لبنان بأولئك الإرهابيين الذين قاموا بأحداث سبتمبر و شتان بين هؤلاء و أولئك . أرجو أن نفكر جيدا و ألا نندفع في بحثنا عن أي مجد لأمتنا إلى التهليل لكل من يفعل شيئاً باسم هذا المجد دون أن نتأنى و ننظر في هذا الفعل و نحاول الوقوف على حقيقته على مدى مطابقته للشرع و على الاستفادة المزعومة التي حققها ."
archived = "2004-10-22"
capture_url = "https://web.archive.org/web/20041022154930/http://www.20at.com:80/article.php?sid=438"
