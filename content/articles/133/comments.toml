subject = "أنا قرأت عنه"
text = "قرأت مقال روبرت فيسك الذي ذكر فيه عماد نخلة واندهشت، حتى أن فيسك لم يعلق على الشخص، وكأن الأمر طبيعياً، وكأن التعاون المصري الأمريكي أمنياً أمر لا شك فيه"
archived = "2004-07-14"
