[[comments]]
order = 9
subject = "بيرو"
text = "الله اكبر ولله الحمد مصر انطلقت للعالمية ...<br />محققين مصريين طبعا....يا سلام اخيرا لقينا حاجة فيها طلب علينا ...<br />انتظروا قريبا بعد التعديل الوزاري ظهور آخر اقسام وزراة الداخلية....<br />مباحث امن الدولة العالمية...<br />مكتب امن دولة طكيو الخاضع للادارة المصرية ...<br />مصلحة السجون المصرية فرع لوس انجلوس البلد...<br />أخيرا في حاجة برعنا فيها......<br />كفاية ان سجون مصر ذكرت في القرآن وده دليل علي تميزها وامكانياتها\"الجبارة\"!!!!"
archived = "2004-07-14"
capture_url = "https://web.archive.org/web/20040714050438/http://www.20at.com:80/article.php?sid=438"

[[comments]]
order = 10
subject = "بيرو كمان وكمان"
text = "وياتري المحقق أول ما بيبدأ التحقيق بيسأل المتهم برضه في الأول \"تعرف أيه عن الأخوان المسلمين\" وبتصلي فين ...ومين أخر خطيب جمعة صليت وراه ولازم تفتكر كان بيصلي بسورة ايه وياتري وانت في الجامعة\"من 15 سنة طبعا: مشيت في مظاهرات مع التيار الاسلامي ...<br />يا جماعة التحقيق المصري ده خبرة وسمعة وكلام كبير \"وقلق في المنطقة العربية\" علي رأي اللي بيحذف التعليقات ...."
archived = "2004-07-14"
capture_url = "https://web.archive.org/web/20040714050438/http://www.20at.com:80/article.php?sid=438"

[[comments]]
order = 11
subject = "مصـ( الخير )ـعب"
text = "يحضرني الآن قول الشاعر:<br />\"يا صديقي لا تصغ لأبواق الخيانة<br />ربما يشتمك الشرطي<br />من باب<br />الميانة ...<br />هل تسمي<br />ذلك اللطف إهانة؟!<br />ربما يعلقك<br />في مروحة السقف<br />لكي تصبح<br />في أعلى<br />مكانة...<br />هل تسمي<br />ذلك العز<br />إهانة؟!<br />و يجعله عامر"
archived = "2004-07-14"
capture_url = "https://web.archive.org/web/20040714050438/http://www.20at.com:80/article.php?sid=438"

[[comments]]
order = 12
subject = "الباشا الكبير"
text = "يعني مثلاً الوزير عمر سليمان كل امكانياته وكل اتصالاته انه خبير في التعامل مع الإرهاب وانه كان صاحب فكرة مؤتمر الإرهاب اللي هوه اول ضربة جوية فتحت باب الحرية..ويقال ان المخابرات الأمريكية تتعامل معه علي انه المستشار الأول للوكالة الأمريكاني واحتمال يكون بيدي دروس خصوصية..ربنا يوسع عليهم ويرزقهم ونشوفهم احسن ناس<br />بس السؤال دلوقتي لما النفر مننا يخش - لا قدر الله - امن الدولة هنا في مصر الضرب هايكون من الشمال لليمين ولا من اليمين للشمال<br />ربنا يستر"
archived = "2004-07-14"
capture_url = "https://web.archive.org/web/20040714050438/http://www.20at.com:80/article.php?sid=438"

