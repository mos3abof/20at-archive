[[comments]]
order = 1
subject = "طبعاً"
text = "أنتو بتتكلموا في إيه، أدوات التعذيب اللي بستخدمها مصر في التحقيقات داخل الأقسام المصرية كلهامستوردة من أمريكا..<br />ومن هنا أناشد المسؤلين المصريين أن يغيروا الصنف ويستوردوا أدوات التعذيب من أي حتة تانية.. عشان المقاطعة..!"
archived = "2004-07-14"
capture_url = "https://web.archive.org/web/20040714050438/http://www.20at.com:80/article.php?sid=438"

[[comments]]
order = 2
subject = "ولكن"
text = "هل التعاون الأمني هذا برغبة مصرية أم بضغط أمريكي؟؟.. أعلم أن النتيجة الواحدة، ولكن لو أنه برغبة المصرية \"لأن اللي فيه داء ما يبطلوش\" ... تبقى مصيبة"
archived = "2004-07-14"
capture_url = "https://web.archive.org/web/20040714050438/http://www.20at.com:80/article.php?sid=438"

[[comments]]
order = 3
subject = "ليه مستغربين يا جماعة"
text = "ليه الاستغراب ده يا جماعة، عادى والله انه يكون المحققين مصريين ( بالطبع) ما تنسوش ان مصر دولة رائدة، و ادى الدليل يا جماعة<br />و كمان احنا اساتذة فى التحقيق ، و اسألوا كرم الزهيري و مسعد قطب و محمد الروبي، فالسجون المصرية ( و اللهم لا حسد) بها العديد و العديد من اساتذة و خبراء التعذيب<br />مش باقولكم نحن دولة رائدة !!!!!!!!!!!!!!"
archived = "2004-07-14"
capture_url = "https://web.archive.org/web/20040714050438/http://www.20at.com:80/article.php?sid=438"

[[comments]]
order = 4
subject = "فضايحنا بقت بجلاجل"
text = "أنا مش مستغرب إن أبناء ضالون من مصر يتعاونوا مع أمريكا. لكن أنا مستغرب أنهم أصبحوا ماركة عالمية، وياريت كانت في حاجة حلوة ترفع الراس...."
archived = "2004-07-14"
capture_url = "https://web.archive.org/web/20040714050438/http://www.20at.com:80/article.php?sid=438"

[[comments]]
order = 5
subject = "ربنا على المفتري"
text = "انا بيتهيقلي أن أمريكا بتتعلم من المحققين المصريين الخونة دول إزاي يعذبوا، لأنهم بيخدوا دورة تدريبية في سجون مصر، قبل ما يسفروهم برة.<br />لأن مصر متصدرة في عدد اللي قتلو في السجون من التعذيب، وكل يوم الجرائد تكتب عن موت مواطن مصري لأنه مرضيش يعترف، طيب هو حيعترف بحاجة معملهاش... ليه... وعشان أيه... عشان يرضي اللي بيحقق معاه!!!"
archived = "2004-07-14"
capture_url = "https://web.archive.org/web/20040714050438/http://www.20at.com:80/article.php?sid=438"

