subject = "هذا هو المهم"
author = "محمد"
posted = "2006-02-22"
text = "توجد قضيه مهمه جدا من الضروري النظر اليها توجد اشياء مهمه جدا هو الاسلام والاخلاق المسلمون الله اكبر والعزه الله ولرسوله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131526/http://www.20at.com/article2.php?sid=454"

[[comments]]
order = 6
subject = "النحيه التانيه"
author = "كريم راغب"
posted = "2006-02-23"
text = "اولا شكرا جدا لصاحب الموضوع<br />بس انا عايز اروح النحيه التانيه<br />للاسف احنا بنكلم نفسنا<br />عن نفسى انا مش شايف العيب ان واحد يعمل فيلم زى ده<br />انا شايف ان احنا ليه منعملش فيلم فيه الحقائق اللى ذكرها الاخ صاحب الموضوع<br />النحيه التانيه بتقول ان العيب فينا احنا مش فى حد تانى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131526/http://www.20at.com/article2.php?sid=454"

[[comments]]
order = 7
subject = "تحية الى كل شهيد عربي"
author = "ابن شهيد"
posted = "2006-03-13"
text = "انه من المؤسف ان نرى تعليقات من عرب غيرملمين بتايريخ مجازر الصهاينة القديم والحديث والتي لها مبرر بالنسبة لهم، واقتنع البعض منا أن الفلسطيني هو سبب البلاء ولم يعد صاحب قضيه لأن يداه تلطخت بدماء بعض الجنود المشاركين في دورة الأولومبياد والتي احدى مطالبهم كانت تحرير الأسرى الفلسطينيين من سجون اسرائيل0 وسألت نفسي لما بعد هذه السنين الطويلة ظهر هذا الفيلم مع أننا نسينا ميونخ!!! اتعرفون السبب يا اخوتي واخواني من محيطنا والى خليجنا ؟<br />لأن اليهودي لا ينسى أخاه اليهودي ونحن العرب نسينا مذابح دير ياسين في فلسطين ونسينا فظائع وجريمة صبرا وشاتيلا وجنوب لبنان في عملية عناقيد الغضب وفضيحة الأسرى المصريين التي ظهرت في السنوات الأخيرة وما خفي كن أعظم واستطيع ان أستمر بسرد المذابح مذبحة تلو الأخرى ثم بعد كل هذا يتصور البعض منا ان ما فعله الفلسطينيين في ميونخ اجرام في حق الانسانية0<br />حقائق لم يسردها المخرج في هذا الفيلم وكيف يظهرها والهدف من الفيلم انسانية جوولدا مائير والموساد، أحد الحقائق انه في أثناء عملية اغتيال الشهداء الثلاثة قاموا بقتل وبأيدي بارده وخالية من الإنسانية زوجة الشهيد ابويوسف وايضا كمال ناصر المتحدث الرسمي لفتح، وللعلم لم يكن كمال ناصر من منفذي عمية ميونخ، أفرغ الرصاص بمفمه وهو جثة هامدة فما أفظع ما فعلوه00 وكمال عدوان ايضا هو الوحيد اللذي استطاع ان يقتل احد الكوماندوز فداسوا بأرجلهم على المصحف الكريم 0 انصحكم اخواني واخواتي ان تقارنوا بعد كل هذا بين إنسانيتهم وانسانيتنا ويكون التاريخ والأحداث مرجعكم قبل ان تحكموا قبل أن يصبح البريء في نظركم قاتل والقاتل بريء 00000"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131526/http://www.20at.com/article2.php?sid=454"

[[comments]]
order = 8
subject = "لا تقراء ان كنت لا تهتم"
author = "محمد"
posted = "2006-03-26"
text = "تحية للجميع مني سواء من وافق الراي او عارضه القصة معقدة يا اخواني وليست النقطة في ايلول الاسود او ميونيخ طبيعة الصراع الفلسطيني الاسرائيلي مختلفة عن اي صراع اخر بالاضافة ان من ينظر لمنظمة التحرير على انها فاشلة فلينظر ماذا واجهت بالمقابل حتى يستطيع ان يفهم لماذا حصل ما حصل نقطة مهمة الامريكان والغرب رفض الفلسطيني سواء قتل او سالم ولم يكن هناك طرق كثيرة امام المقاومة والدليل الواضح الان في هذا الزمن فنحن ما زلنا مرفوضين سوا بعض التغييرات على الناحية الشعبية في الدول الاوربية التي لم تغير شيئا في مجرى القضية وحتى لو كان كل شعوب العالم معنا ومتفقين معنا لن يغيرو شيئا في سياسات الدول المبنية اصلا على المصالح وليس الفلم سوى مجرد فلم يعرض وجهة النظر الصهيونية لكنه بالنهاية فلم كناحية موضوعية جيد في الاخراج والتمثيل كاي فلم اخر بالاضافة لنقطة مهمة جدا يجلهلها العرب غالبا على النظام العسكري الذي تقوم عليه دولة اسرائيل وكيف ان كل مواطن اسرائيلي سواء كان انثى ام ذكر هم جنود اسرائيليون في الاحتياط بشكل دائم وعلينا تفهم ذلك واعطاء انفسنا القناعة الكاملة بعدالة قضيتنا قبل ان نبداء ان نقنع العالم بها ففاقد الشيء لا يعطيه وليدرس كل منا تاريخ فلسطين ومنظمة التحرير والتاريخ الصحيح عن القضية الفلسطينية حتى نستطيع ان نفهم ما يدور بشكل اوضح وشكرا لكم جميعا لانكم قرئتم كلامي الطويل الممل ومشاركتكم سواء اتفقتم معي او اختلفتم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131526/http://www.20at.com/article2.php?sid=454"
