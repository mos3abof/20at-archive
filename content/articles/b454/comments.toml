[[comments]]
order = 0
subject = "دا شئ متوقع"
author = "sweet_princess"
posted = "2006-02-17"
text = "دا شئ متوقع من واحد يهودي كل افلامه لازم يطلع فيها شخصيه يهوديه بتحب الخير وهي اللي بتغير مجرى الاحداث زي فيلم يوم الاستقلال اللي بيتكلم عن هجوم فضائي واللي بيخلص العالم منه مهندس طيران يهودي وزي فيلم اقاز الجندي رايان اللي لازم طبعا يتكلم فيه عن النزيين ومعاملتهم البشعه لليهود الغلابه ويجيبلك في نهاية الفيلم واحد الماني بيقتل جندي يهودي وهو بيغرس السكينه في قلبه ببطء وهو بيتلزز بتعزيبه لكن طبعا عمره ما هيكلم عن اللي عمله الاسرائليين الكلاب في 48 او 67 او حتى اللي بيحصل في فلسطين لحد اللحظه اللي بتقرو فيها الكلام دا<br />انا شفت فيلم تسجيلي مع بعض الاسرى المصريين في حرب 67 وسمعت منهم كلام ما يصدقهوش عقل ولا يمكن تخيله وطبعا ممكن كتير منكم يكون شاف الفيلم دا وال ايه جولدا مائير ام حنون والله ضحكتوني دي اقل وصف ليها انها غوريللا ما تعرفشي رحمه وعشان كده ربنا مش هيرحمها انشاء الله<br />تصورا الكلبه دي بيسالوها ما حسيتيش بالندم على اللي عملتيه في الاسرى قالت ابدا ولو جتلي الفرصه هكرر نفس الاسلوب عشان اسرائيل تعيش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131526/http://www.20at.com/article2.php?sid=454"

[[comments]]
order = 1
subject = "و الله نستاهل"
author = "سوسة المفروسة"
posted = "2006-02-17"
text = "اصلا احنا الي بنعمل كده في نفسنا حد في الدنيا عايز يكسب تعاطف الناس يقوم يروح في حتة متسلط عليها كل الكاميرات ووسائل الاعلام في العالم كله و يخطف افراد من اعداءه و يحولهم في لحظة من سفاحين لضحايا??<br />و الله حرام علينا اللي بنعمله في نفسنا ده وادي العالم كله مع كل دورة اوليمبية بيفتكر الموضوع ده و يقعد يفتح فيه...كل مرة بنتصرف بيها بغباء بندفع احنا و كل اللاجيال اللي بعدنا التمن<br />حسبنا الله و نعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131526/http://www.20at.com/article2.php?sid=454"

[[comments]]
order = 2
subject = "ألي سوسة المفروسة.علي الله متطلعش جاسوسة."
author = "عقلاني"
posted = "2006-02-18"
text = "بما انك سوسة ومخك أكيد قد السوسة يبقي أكدي رأيك دا وبعد ما قريتي المقال بيدل انه مخ سوسة فعلا.وعشان كدة انا هعيد كتابة جزء من المقال عشان تقدري تفهمي مع اني معتقدش.اقراي كدة ياماما\"<br />فحين قررت أيلول الأسود خطف مجموعة من الرياضيين الإسرائيليين لم تكن نية \"فتح\" في ذلك الوقت مجرد الخطف والقتل. ببساطة تقدمت منظمة التحرير بطلب المشاركة في الأولمبياد مثل سائر شعوب الأرض فتم رفض الطلب بحجة أن فلسطين ليست دولة.<br />الحل الذي فكر فيه قادة الثورة أنه يجب أن تحضر فلسطين بأية طريقة ويجب إما أن نشارك أو لا تشارك إسرائيل. سبيلبرج إما أنه يجهل هذه الخلفية المهمة والتي تدلل على موقف سياسي مدروس وعلى أن الفلسطينيين ليسوا قتلة بل أصحاب حق يبحثون لتثبيته، أو أنه يعرف ولا يريد أن يعرض لهذا الجانب من الحقيقة\"<br />وارد عليها وهي بتقول انه كل سنة العالم بيفتكر ده. وبقولها لان الاعلام اعلام يهودي.مثلا الاعلام دايما بيتذكر المحرقة.يبقي الالمان أغبياء! دول كانو قوه كبيرة مؤثرة هل كانو اغبياء في نفس الوقت!ردي عليا لو سمحتي! انتي حتي متعرفيش ليه هتلر قتل اليهود.وانهم مكانوش ملايين!<br />انا بيفرسني والله الناس اللي زي سوسة .محسوبين علينا عرب او حتي مسلمين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131526/http://www.20at.com/article2.php?sid=454"

[[comments]]
order = 3
subject = "الى الاستاذ عقلاني"
author = "سوسة المفروسة"
posted = "2006-02-18"
text = "اولا لايحق لك او لاى احد على وجه الارض ان يقول عن شخص مسلم و موحد بالله انه ليس مسلما و انه فقط محسوب على المسلمين و لو انك بحق اسم على مسمى لادركت خطورة هذه الكلمة ووزنها عند الله سبحانه و تعالى<br />ثانيا ساتجاوز عن اسلوبك في الحديث الذي يدل على ما وصلنا اليه من اسلوب في الحوار( الى درجة ان تخاطبني بلقب يا ماما و تتهمني بانني مابفهمش)<br />المهم ان اسلوبك هذا هو اللي ماشي في البلد اليومين دول اى حد مش عاجبه راي اى حد تاني يبقى التاني ده كافر...لو مش عاجبني اسامة بن لادن اقى كافرة و لو مش عاجبني ياسر عرفات ابقى ملحدة و لو مش عاجبني اللي عملوة الفلسطينيين في ميونخ ابقى جاهلة و كافرة و ملحدة<br />و بعدين ايه التبرير الهايل اللي انت بتدافع عنه ده -مش عايزين يدخلوهم الدورة قاموا خطفوا الاسرائليين عشان مايبقاش حد احسن من حد!!!!!!!!!<br />اولا المفروض قبل ما يقدموا على اي خطوة يدرسوا نتائجها اولا الرسول عليه الصلاة و السلام كان هو و الصحابة( مع الاختلاف طبعا) لا يمكن يقوموا باى حركة عشوائية بالطريقة دي قبل ما يحسبوا احتمالات نجاحها و هتضر و اللا هتفيد في حالة النجاح و الفشل<br />و بعدين انا مع كفاح الفلسطينيين قلبا و قالبا و اي حد عنده ذرة عقل هيحس بكده لكن مش معنى كده اننا اكمم بقي و اقطع لساني و اوافق على كل شيء و لا اترض على اي شئ ....اسلوب لا تجادل و لاتعترض ده اصبح من عهد الديناصورات و اى عهد و اي حد في الدنيا مش معصوم من الخطا و مش معنى ان احنا مع الفلسطينيين و انهم مظلوميين ان مالهومش اخطاء...لا ليهم و عملية ميونخ دي من اكبر اخطاهم<br />اكرر احترامي لكل الفلسطينيين و كل المجاهدين و لكن قليل من الحكمة الى جانب الالحماس سو ف تاتي بالنصر القريب ان شاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131526/http://www.20at.com/article2.php?sid=454"

[[comments]]
order = 4
subject = "منظمة التخرير الفلسطينية"
author = "أكرم"
posted = "2006-02-18"
text = "انا ارى ان عملية ميونخ الفاشلة هي دليل واضح على فشل منظمة التحرير و معها منظمة الجامعه العربية ( التي لم تجمع حتى اشلائها ) و عملية ميونخ ايضا من اغبى عمليات منظمة التحرير<br />فاذا رجعنا لتاريخ الحركة السياسي فانك لا تجد الا ايلول الاسود شاهدا و تعاملهم مع اللبنانيين و مشاركتهم في الحرب الاهلية بكل حماقة و اخيرا ما بدر منهم اثر غزو العراق للكويت و اخرا مواقفهم البليدة الحالية<br />فاذا كنا منصفين فاننا لا نلوم الا انفسنا و غبائنا و خنوعنا و قنوعنا بالذل و الهوان و التعذيب و الاضطهاد<br />و اخيرا بلاش ندفن راسنا في الرمل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131526/http://www.20at.com/article2.php?sid=454"

[[comments]]
