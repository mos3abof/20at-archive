author = "مفيش اى فايدة"
posted = "2009-09-27"
text = "فى مصر<br />43 الف مدرسة حكومية و 7 الاف مدرسة خاصة —— يعنى اجمالى العدد 50 الف مدرسة<br />ولو كل مدرسة شغلت 3 عمال نظافة يبقى الاجمالى 150 الف عامل هياخدوا مرتبات ويناموا زى اى موظفين<br />وبعدين فية مدارس مفيش فيها دورات مياة شغالة وفية مدارس فيها دورات مياة ومفيش فيها مياة<br />يعنى بعض المدارس مفيش فيها بنية اساسية<br />طيب اية المطلوب<br />ازاى نشتغل وننظف المدارس<br />نعمل شركات نظافة فى كل مركز او مديرية تعليمية - شركات مصرية بعمال مصريين توكل اليها نظافة المدارس والحمامات<br />تماما زى دول الخليج بتجيب شركات نظافة وميكروباص بينزل عند كل مدرسة عامل او اتنين ينظف ويرجع الشركة التانى<br />انما هتوظفوا عمال وهيبقوا موظفين وهيقعدوا جنب مكتب البية الناظر ينقل ورقة او يتخانق مع طالب ومفيش احد من المدرسة هيعرف يشغلة لانة قليل الادب ولسانة طويل فمفيش فايدة<br />والزبالة ستظل كما هى"
