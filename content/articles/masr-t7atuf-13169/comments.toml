text = "في حقيقة الأمر أن محمود عوض من الأجيال السابقة الذين نشؤا على الأخلاق السليمه في البيئة الصحيحة في توقيت مناسب لهذه المهنه مع مواهبه الفطرية. فاجتمعت كلها في شخصية من أروع الشخصيات الصحفية شخصية بنائة شخصية تحب العطاء إنها شخصية محمود عوض<br />مع جزيل الشكر للزميل/ محمد عبدالرحمن"
