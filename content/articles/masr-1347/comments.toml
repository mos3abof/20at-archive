text = "لكل شاب طموح سياسى ونشاط يريد ان يبذلة ليححق ذاتة وحينما يجد الاحزاب صورية ومغلقة على من فيها وليس لها اى نشاط فى الشارع يعمل اية ؟<br />الاخوان فى الشارع بيخدموا الفقراء ويعالجوهم ويوعظوهم والعملية مش محتاجة حاجة<br />انتم اغلقتم العمل السياسى فى وجوة الشباب ---- يعملوا اية ؟<br />اعطوا الشباب متنفس حتى لا يفكروا فى الانضمام للجماعة اياها الذين تكرهونها لانهم يقولون ربنا اللة"
