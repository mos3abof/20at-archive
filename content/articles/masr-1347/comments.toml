subject = "استاذة اميرة"
author = "مارو"
posted = "2006-12-24"
text = "السلالم عليكم<br />كويس<br />استاذة اميرة فودة<br />مقلالاتك في الدستور اكثر من متوازنة<br />واشتهرت (بالنسبة الي)بمتابعتك الدقيقة لاخبار الاخوان بحيادية كبيرة<br />ولكن العدد الماضي اثار حنكي<br />عما كتبتيه عن عصام العريان وتخلي الاخوان عنه<br />كان تقريبا مجرد هجوم او تاليس<br />بالرغم انه ومن طبيعي ما حدش بيخاف علي العيال اكثر من والدتهم<br />ومش من الممكن اننا نرمي ابنائنا ولكن لكل مشكلة رد مناسب<br />ولو كل ما يسجنوا قيادة من الاخوان نوقغ حال البلد الناس كانت اتخنقت مننا من زماااااااااااااان اوي فلكل حادث قدر<br />mohema@forislam.com<br />_____________________________________<br />اتمني ان تكون استاذة اميرة هي من نقلت موضوعها من الدستور وليس انتم وان كان انتم فارجوا ايصال هذه المشاركة لها"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102748/http://masr.20at.com:80/article.php?sid=1347"

