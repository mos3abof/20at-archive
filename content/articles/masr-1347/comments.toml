[[comments]]
order = 7
subject = "إنتبهوا يا شعب مصر .. الطوفان قادم"
author = "مصري وإفتخر"
posted = "2006-12-24"
text = "أنظروا : كيف فعلوا ويفعلون وسيفعلون بشرفاء مصر الكرام ، خيرة وصفوة رجال مصر العظماء ، يكيلوا لهم الإتهمام ويلفقوا لهم القضايا، حثالة السلطة ينظرون لهم كأعداء حقيقون وتناسوا أعداؤهم الوهميون ، نحن تحت حكم طبق من السلطة الملوثة بالميكروبات نحن تحت حكم مسرطن ، حكم فاسق ، حكم واهن ، حكم مرتعش خائف دليل ، منافق ليس له ميثاق شرف وعهد مع شعبه ، نحن تحت حكم طبق من السلطة الفاسدة المقيتة ، نحن رجال مصر ننبذهم نحتقرهم جميعاً العائلة الفرعونية وأتابعهم الهامانيون الجدد ،<br />هل يستحق الشعب المصري الآبي ، الشعب الصبور ، الودود ، الطيب ، المقهور بفعل النظام وحاشيته ولجنة سياساته ، لجنة التخريب والتدمير لجميع مقدرات الشعب المصري ، ما قاموا ببيعه هي أملاكنا الحقيقية لنا ولأجيالنا القادمة ، كلنا سنحاسب من قبل أولادنا ، من منا ليس بينه إبن أو إبنه أو أخ أو أخت أو أب عاطل عن العمل ، البطالة تسد الأنوف ، والفساد أصبحت لدينا كالمستنفعات والبرك تنتشر أمراضها وعللها على الجميع ، يا شعب مصر ، يا أهل مصر ، مصركم مقبرة الغزاة على مر تاريخها ، مصركم صناعة التاريخ القديم والحديث ، مصركم قدوة قارات العالم ، مصركم شرفها الله في قرآنه العزيز ، مصركم أمانة في أعناقكم ، هبوا ، أنتفضوا ، ثوروا ، وأنا قبلكم ، أفيقوا من سبات نومكم ، نحن بحاجة إلى فورة وفورات ، إلى نجدة تأتي من داخلنا بعون من الله ....<br />كل الخراب ، والتدمير والفقر والسلبيات الإجتماعية بمختلف ألوانها ، من المتآمرين في لجنة السياسات التخريبية التدميرية بأمر ومباركة جمال اللا مبارك ، هذا الوجه الشيطاني وأساس الفساد والبلاء ، هذا الشيطان الأكبر الذي من يوم دخل مصر مطرودا مذموماً من بلاد الإنجليز ، هذا الشيطان الأعظم عندما دخل برجليه النجسة القذرة و<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102748/http://masr.20at.com:80/article.php?sid=1347"

[[comments]]
order = 8
subject = "لا راجل حديدي ..ولا وزير داخلية !"
author = "عبدو"
posted = "2006-12-24"
text = "هو الراجل لا هو حديدي ولا هو وزير داخلية ...يا حاجة أميرة عمنا خيرت راجل مفيش أرق منه ولا اطيب منه !!<br />زائد كمان في موضوع مهم وهو إن روزاليوسف منشور فيها تقرير مشابه جداً لتقريرك مع الفارق...<br />بس هنا بصراحة انا مستغرب من غباوة عبدالله كمال ورفيق دربه في النهب والمصلحة كرم جابر وهو إن التقرير المنشور عن الشاطر في روزا حوى نفس المعلومات تقريباًُ إلي في تقريرك ...<br />الراجل ده أكادمية للنجاح تمشي على الارض...كل الشهادات دي ..ده أنا أخدت الليسانس بالعافية وبعد رحلة جهاد في التعليم لمدة سبع سنيين.."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102748/http://masr.20at.com:80/article.php?sid=1347"

[[comments]]
order = 9
subject = "رجل وطني واصلاحي"
author = "مواطن مصري محب لبلده"
posted = "2006-12-24"
text = "اشكر الأستاذ أميرة على هذا المقال وان كنت لا أتفق معها في بعض جوانبه ، فجماعة الاخوان تدير نشاطها بشكل مؤسسي وشوري وليس هناك قوى وضعيف في ظل مجموعة اللوائح والنظم الحاكمة لايقاع عملها ، ولا شك أن المهندس خيرت يعد من خيرة أبناء مصر وهو من الشخصيات الودودة اللطيفة كما وصفها د. سعد الدين ابراهيم حيث تزاملا معا في السجن ، وكل ما هو موجه للمهندس خيرت كلام أمني مرسل يدل على افلاس النظام وضعفه وعدم قدرته على تقديم مشاريع اصلاحية للمحاججة بها ، ولهذا لجا الى أسلوب الهراوة والقمع والاقصاء<br />مع خالص تحياتي استاذة اميرة وكل عام وحضرتك بخير بمناسبة عيد الاضحى المبارك"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102748/http://masr.20at.com:80/article.php?sid=1347"

[[comments]]
order = 10
subject = "ماذا ننتظر"
author = "ماذا ننتظر من حاكم قاتل ومن أبن فاسد ومن زوجة يهودية غير التنكيل بأبناء مصر الشرفاء"
posted = "2006-12-24"
text = "ماذا قدم مبارك من تضحيات لمصر حتى يجلس على عرش مصر بيد ملوثة بدماء السادات<br />ماذا قدم الإبن الحاقد على كل القيم لإنعدامه لها سوى النهب والفساد<br />ماذا قدمت اليهودية الحقيرة التى تنهب آموال الجمعيات الوهمية التى تتزعمها لرعاية الأطفال والأمهات والنتيجة عصابات للأطفال تغتصب الأطفال وتقتلهم ماذا قدمت لهم غير النهب<br />ماذا فعل الإخوان المسلمين حتى يعاقبوا بكل هذه القسوة والإعتقالات والتعذيب<br />هل فعل الشاطر مثل ما فعل مبارك أو أبنه الشاذ الحقير<br />هل نهب الشاطر مصر كما نهبها مبارك أو أبنه القذر المدمن وحثالته<br />لم يرد الإخوان قسوة الإعتقالات والتعذيب فيهم بقسوة ولكنهم ردوها بإظهار فسادهم وتخذير الشعب منهم والتقرب للشعب بالمساعدات<br />هل وقف الشاطر وسب تعاليم الإسلام مثلما فعل حثالة مبارك المحميين بزوجته<br />مبارك وعائلته وحثالته لا ضمائر لهم ولا دين ولا يجب أن تحث فيهم روح الفضيلة والإسلام لأن ما يفعلونه لا يمت للإسلام بصله<br />وحسبى الله ونعم الوكيل وغداً لناظره قريب"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102748/http://masr.20at.com:80/article.php?sid=1347"

