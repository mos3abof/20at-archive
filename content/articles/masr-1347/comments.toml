[[comments]]
order = 3
subject = "لانه شاطر وناجح وبيحب البلد"
author = "ياسر أبو عمار"
posted = "2006-12-23"
text = "خيرت الشاطر نموذج للمسلم الناجح فى حياته العملية والدعوية ،علشان كده الحكومة لازم تقبض عليه لانها لا تحب الناجحين او تعرف النجاح ،النهاردة اتجدد للشاطر 15 يوم ،يا ترى ناويين معاه على ايه ؟وهل دى اخرة اللى بيحب البلد ،البلد اللى اعتقلت العريان والسادات ونور ومرسى واى واحد فى البلد يخرج عن الاطار اللى هما راسمينه هى نفس البلد اللى بتشجع مصطفى بكرى وعادل حمودة وابراهيم سليمان وممدوح بتاع العبارة \"فاكرينه \"اللى هرب ومحدش عرف يحطه فى السجن ولو ساعة واحدة ،اما الشاطر واخوانه يتم القبض عليهم فور ان \"يكح \"اى واحد فيهم فى اخر حته فى البلد ،الف حسرة عليكى يا بلدنا .<br />بتكرهى الناجحين والصادقين فى حبك وبتكرمى الافاقين والمزورين اللى بيستنفعوا من وراكى ."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102748/http://masr.20at.com:80/article.php?sid=1347"

