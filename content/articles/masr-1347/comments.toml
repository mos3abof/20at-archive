[[comments]]
order = 12
subject = "الشاطر"
author = "الشاطر لم يبيع بترول مصر للأمريكان لمدة عشرين سنة قادمة بأبخس الأسعار حتى ترضى عنه"
posted = "2006-12-24"
text = "ولم يبيع الغاز الطبيعى لإسرائيل لمدة 15 سنة حتى تعطيه الرضا ولم يصدر لها الحديد والأسمنت لكى تبنى به جدار عازل يذل الفلسطينيين<br />الشاطر لم يكن خائن للعرب ولا جاسوس عليهم لصالح الأمريكان<br />الشاطر لم ينهب إيرادات قناة السويس والسياحة<br />الشاطر لم يقم بتفجيرات فى شرم الشيخ والقلعة والتحرير حتى يمد العمل بقانون الخزى والفساد قانون الطوارئ<br />الشاطر لم يزور أى انتخابات ليضمن جلوسه فى الحكم وبقاؤه أبد الآبدين<br />الشاطر لا يجعل زوجته سيئة مصر الأولى وتسافر على حساب الشعب وتنهب أمواله ولا أحد يعرف ماذا تفعل غير النهب والفساد<br />الشاطر لم يغرق عبارة ويقتل 1300 مصرى ولم يكون السبب فى محارق بالفساد ولا حوادث قطارات حتى يخصخص السكة الحديد<br />الشاطر لم يبيع المصانع والشركات وينهب آموالها ويطرد المالة التى بها<br />الشاطر لم ينهب مصر فى حساباته فى الخارج<br />الشاطر سيظل شاطر فى نظر الشعب كله ومبارك الفاسد سيظل حثاله مصر كلها<br />وحسبى الله ونعم الوكيل"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102748/http://masr.20at.com:80/article.php?sid=1347"

[[comments]]
order = 13
subject = "صهاينة السلطة"
author = "مقال للإستاذ مصطفى بديوي :"
posted = "2006-12-24"
text = "من خلال متابعتنا لما يكتب في الصحف المصرية والعربية والعالمية عن سياسة النظام الحاكم في مصر وعلمنا بطريقة تفكيره بعد أن سلمت العناصر الفاعلة فيه قيادها للولايات المتحدة والكيان الصهيوني لكي تقودها , فإن التعديلات الدستورية المقبلة ستنص علي متغيرين في منتهي الخطورة علي حاضر الديمقراطية في مصر وعلي مستقبلها، والمتغيرين لا يمكن أن يقدم عليهما نظام وطني يملك بقية من قراره , لكون أن من يقدم علي وضع المتغيرين في الدستور هو أداة تستخدمها واشنطن في حربها المعلنة ضد الشعب المصري منذ ما يقرب من ربع قرن وتستهدف إجباره علي قبول كامب ديفيد السادات والتي لا تزال غالبية شعبنا العظيم تتحفظ عليها وترفضها , نعم ما يحدث هو كذلك وبالمناسبة هو شبيه بما تفعله واشنطن وتل أبيب مع حكومة فلسطين الراهنة من عمليات إرهاب عسكري واقتصادي بهدف إجبار فصيل المقاومة الرئيسي الحاكم في فلسطين علي الاعتراف بالكيان العبري كما اعترفت به منظمة فتح من قبل<br />أما المتغير الأول الذي نتحدث عنه فهو وضع نص في الدستور يحظر قيام الأحزاب علي أسس دينية , وهذا إن تم يعني أن هذا النص سيصطدم بمادة أخري في الدستور تتقدم عليها وهي المادة الثانية من الدستور المصري والتي تقول أن الشريعة الإسلامية هي المصدر الرئيسي للتشريع في بلادنا<br />علي اعتبار أن الإسلام هو دين الغالبية العظمي من أبناء شعبها وهذا يعني أن تلك المادة لو كانت تصطد م بمادة حظر الأحزاب الدينية تلك التي ينوي نظام مبارك إدخالها علي الدستور فإن هذا النظام حسب معرفتنا به لن يتردد في إلغاء المادة الثانية من الدستور لصالح مادة الحظر علي الرغم من نفي فتحي سرور مجرد التفكير في إلغاء مادة الشريعة الإسلامية , إذن ما هو البديل أمام النظام هل ي<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102748/http://masr.20at.com:80/article.php?sid=1347"

[[comments]]
order = 14
subject = "حوار مع المرشد العام للإخوان - حفظه الله"
author = "منقوووول :"
posted = "2006-12-24"
text = "فى طريقى إلى مكتبه فى 20 شارع الملك الصالح بالمنيل، كنت أتصور أننى سأجد الشارع مغلقا بسيارات الأمن المركزى والعشرات من رجال الأمن المنتشرين حول المكان، لكن سرعان ما خاب ظنى، عندما اكتشفت أن باب العمارة بلا حارس أصلا، قبل أن أصعد إلى الطابق الأول لأجد ملصقا ورقيا يحمل اسم الإخوان المسلمين هو كل ما يدلك على أنك فى مقر الإخوان ومعقلهم الإدارى والتنظيمى.<br />قبل أن نبدء التسجيل لفت إنتباهى أن ثمة من يجلس معنا مصطحبا معه أيضا جهاز كاسيت صغير وأوراقا لتسجيل الحوار وهو إجراء اعتمده مرشد الإخوان منذ فترة حتى يقيم الحجة على من يتلاعب أو يغير فى مضمون الكلمات أو سياقها.<br />على كلٍ هذا هو نص الحوار:<br />* كنت أتصور أن المكان يعج بالأمن والشارع مغلق والتوتر يسود المكان؟<br />- على إيه، هم يعرفون جيدا أن الإخوان على أعلى مستوى حضارى من الفكر والتعامل والحوار وليس عندهم ما يدعو إلى تواجد أمنى فالأمن موجود بالصوت والصورة حولى، يعنى الأمن يسجل كل كلمة والتكنولوجيا الحديثة تستطيع أن تصورنى من دون أن يراهم أحد، أنا بابى مفتوح وقلبى وعقلى ولسانى مفتوحين.<br />* هل الاعتقالات الأخيرة هى الخط الأخير للأمن ضد الإخوان أم تعتقد أنك مستهدف؟<br />- لا، من ناحية أننى مستهدف.. الأمن يعرفون من أنا، بمعنى أننى لا شىء فى الإخوان سوى كونى فردا من أفراد هذه الجماعة المنظمة والمتجذرة ولما يذهب مرشد يأتى مرشد آخر ولست أحتكر شيئا أنا اؤدى دورا، صحيح هو دور رئيسى وقوى وكل الناس تنتظر كلمتى لكن كلمتى ليست من عندى بل هى نتيجة لدراسة مع مؤسسات الجماعة، لا أقبل على نفسى أن أقول كلمة دون أكون مستوحيها من وجهة نظر المؤسسات الرسمية للجماعة، هذه نغمة دائما الأمن يقولها حتى يرى رد فعل، الأمن والنظام يعلمان<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102748/http://masr.20at.com:80/article.php?sid=1347"

[[comments]]
order = 15
subject = "التلفيقات إشتغلت - حسبي الله"
author = "قررت نيابة أمن الدولة العليا اليوم السبت 23/12/ 2006م تجديد حبس المهندس خيرت الشاطر- النائب الثاني للمرشد العام للإخوان المسلمين- و15 آخرين من قيادات الجماعة 15 يومًا في القضية التي عُرفت بقضية طلاب الأزهر."
posted = "2006-12-24"
text = "وقد فوجئت هيئة الدفاع بوجود قضايا مختلقة ومدسوسة، بالإضافة إلى \"فبركة\" أوراق ومستندات ضد المتهمين؛ حيث استخدمت النيابة نفس المضبوطات والأوراق التي استُخدمت ضد المهندس خيرت الشاطر في قضية سلسبيل عام 1995 في نفس القضية، كما قرَّرت النيابة ضمَّ قضية طلاب الأزهر إلى قضية (سلسبيل).<br />فيما أرجأت النيابةُ عَرْضَ الطلاب الذين بلغ عددهم 102 طالب إلى يوم الإثنين القادم، ومن المتوقَّع أن تجدد النيابة حبسَهم كما فعلت مع قيادات الجماعة.<br />من جانبه أدان الدكتور محمد السيد حبيب- النائب الأول للمرشد العام لجماعة الإخوان المسلمين- قرارَ النيابة، واعتبره نوعًا من الإفلاس السياسي، مؤكدًا أن الإصرار على إدانة الجماعة في هذا التوقيت أمرٌ مقصودٌ للتعتيم على صعودها في البرلمان والتغطية على التعديلات الدستورية القادمة لتمريرها بشكل يخدم سيناريو التوريث، مشيرًا إلى أن الجماعة ماضية في طريق الضغط السلمي على النظام.<br />وحول ضمِّ النيابة قضية (سلسبيل) للقضية الحالية شدَّد حبيب على أنه دليلٌ قاطعٌ على أنه لا أصلَ لها ولا ترقَى لدرجة الاتهام، مطالبًا بإخلاء سبيل المهندس خيرت وإخوانه؛ لكونهم شخصيات معروفة ولها مكانتها الاجتماعية، وأنه لا خطرَ منهم على سير التحقيقات."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102748/http://masr.20at.com:80/article.php?sid=1347"

[[comments]]
order = 16
subject = "ساعي البريد"
author = "مقال الأستاذ الدكتور كمال الهلباوي :"
posted = "2006-12-24"
text = "لا أرى كيف تتحمل الشعوب هوان حكامها واستبدادهم، وكم يطول ذلك قبل أن تنتفض هذه الشعوب فتثار لكرامتها وتثور طلبا للحريات فيها، أو دفعا للظلم ومصادره والاستبداد وعوامله الخسيسة.<br />قد لا يلتفت كثير من الناس إلى الخبر المعني اليوم بهذا التعليق، وقد يمر عليه الناس مرور الكرام نظرا لوجود العديد من المشكلات البارزة والتحديات الكبيرة التي وضعها النظام المستبد في طريقهم حتى أضحت أعينهم في غطاء عن ذكر بعض أهم تلك التحديات ومواجهة تلك المشكلات.<br />الخبر في قناة الجزيرة يقول: \"بوش يخاطب مبارك بشأن إيصال رسالة إلى سوريا لوقف التلاعب بأمن لبنان\".<br />يا لها من مهانة للشعب المصري بأكمله، إذا رأي مبارك أن يكون ساعي بريد لدى بوش .. فلماذا يصر على أن يحكم مصر طالما فيه عرق ينبض ؟ ولماذا يقبل الشعب المصري هذه الاهانة ، أن يتحول رئيسه إلى ساعي بريد لإيصال رسالة إلى سوريا ورسالة إلى كل دولة شرق أوسطية أو أفريقية يريد الرئيس الأمريكي أن يوصل إليها رسالة.<br />أنا هنا لا أتحدث عن مضمون الرسالة وأهمية الرسالة ومن يتلاعب بأمن لبنان وأمن مصر وأمن فلسطين وأمن العراق وأفغانستان وباكستان وأمن بقية دول العالم العربي والإسلامي والعالم الثالث عموما.<br />سوريا تتلاعب بأمن لبنان بعد أن خرجت منه؟ وإسرائيل تحافظ على الأمن طالما احتلت فلسطين!!.<br />هذه الأحكام الأمريكية الجائرة تحتاج إلى ساعي بريد مستبد ليوصلها إلى مكانها.<br />المهم هنا أن أمريكا –والحمد لله- بحاجة إلى مصر وإلى رئيس مصر ليقوم بدور مهم لخدمة السياسة الأمريكية والإستراتيجية الأمريكية، وكأن أمريكا ليس لها من الإمكانات ما تفعل ذلك وأن البيت الأبيض والبنتاجون والخارجية الأمريكية وغيرها من المؤسسات الأمنية عاجزة عن إيصال الرسالة لسو<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102748/http://masr.20at.com:80/article.php?sid=1347"

