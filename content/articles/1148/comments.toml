[[comments]]
order = 7
subject = "سانحك الله ايها الراء"
author = "حمدى رؤوف"
posted = "2006-05-06"
text = "سامحك الله ايها البراء<br />فقداغفلت حق كل المبدعين فى عرض الملك هو الملك<br />اخى الفاضل<br />ان اعز مايملك المبدع ان تصل رسالته الى وجدان المتلقى<br />لقد قدمنا هذا العرض اكثر من ثمانى مواسم مسرحيه<br />واعيد انتاجة مرتين اخرهم عام1999 من انتاج القطاع الخاص وهو الذى سجله التليفزيون ويذاع<br />وزار عدد من الدل العربيه ونال كل الاعجاب من كبار النقاد المسرحى المتخصصين<br />وبالطبع من الجماهير التى تحتشد يوميا امام مسرح السلام<br />ان ماطرحت انت هو نوع من الانطباع وليس التحليل النقدى وعلى هذا فلا مانع من ان تقول ماتشاء ات كان انطباع<br />ولتكن انت الوحيد بين الالاف الجماهير التى تمتعت واعجبت واندهشت بالعرض<br />وفى هذا تميز ومعرفة بك<br />سامحك الله<br />واشكر لك مدحك فيا برغم ظلمك لعملى الذى اعتز وافخر به<br />لك الحب والمودة<br />الملحن<br />حمدىرؤوف<br />ملحن موسيقى واغانى الملك هو الملك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133209/http://www.20at.com/article2.php?sid=741"

