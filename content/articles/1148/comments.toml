order = 0
subject = "اكيد الملك هو الملك"
author = "ادم ( القاهرة )"
posted = "2006-04-27"
text = "تعليقا على الموضوع السابق:فان الاسقاط الواضح فى العرض المسرحى الذى شاهدته اكثر من مرة وخصوصا العرض الاخير فهو ليس اسقاط على الحال فى مصر فقط بل و فى جميع اقطارنا العربية.<br />اما عن ان العرض احسن الوحشين فانا اختلف مع هذا الراى لان العرض قوى سواء الاداء والقصة للكاتب القدير سعد الله ونوس<br />و فى النهاية فتحية الجمهور لمنير وانا من عشاقه لا تنقص من قدر الفنان صلاح السعدنى ابدا بل ان كل الفنانين المشتركين فى العرض ساعدوا على نجاحه وفى النهاية فانى اتمنى ان اشاهد عرضا جديدايضاهى نصف هذا العرض"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133209/http://www.20at.com/article2.php?sid=741"

[[comments]]
order = 1
subject = "تصحيح واجب"
author = "ميكو"
posted = "2006-04-27"
text = "ارجو تصحيح تلك المعلومة منير لم يكن يغنى من الكواليس فى المسرحية الاولى<br />بل كان يغنى من فوق الخشبة وارجعوا لتسجيل المسرحية القديمة<br />وعلى فكرة موضع ماتفعله الغنية ده مش كويس بدليل انك مثلا لو طلعت مطرب مجهول بجوار السعدنى الناس هتسقف للسعدنى<br />المسالة تتعلق بنجومية منير خصوصا انا معظم رواد المسرحية دخلوا من اجله وليس من اجل شئ اخر اعد التفكير فى تلك النقطة بموضوعية ودون فلسفة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133209/http://www.20at.com/article2.php?sid=741"

[[comments]]
order = 2
subject = "براحه شويه يا جماعه"
author = "حمدي"
posted = "2006-04-27"
text = "الموقع بتاع عشرينات واحد من اغرب المواقع<br />الواحد لو غاب يوم واحد عن الموقع يلاقي كل المواضيع اللي في الصفحه الرئيسيه اتغيرت ووضعوا مواضيع جديده<br />ووالواحد يطلع عينه علي ما يجيب الصقحه من الارشيف لان صفحة الارشيف عايزه الواحد يروح يعمل كوباية شاي علي ما تبقي تفتح براحتها<br />براحه شويه يا جماعه انتوا صحكتم حلوه ولا ايه<br />اعطونا فرصه نتفاعل مع المواضيع والردود<br />او علي الاقل سيبوا روابط في الصفحة الرئيسيه في اي جنب كده بدل ما يطلع عينيا في البحث في الارشيف<br />وربنايديم عليكم الصحه والنشاط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133209/http://www.20at.com/article2.php?sid=741"

[[comments]]
order = 3
subject = "الكباتن اللي فوق"
author = "مسقعة"
posted = "2006-04-28"
text = "إلى آدم (القاهرة) :<br />أتفق معك على إنها إسقاط على جميع أقطارنا العربية، و أحب أن ألفت نظرك أن المقال لم يعلل نجاح العرض بأنه \"أحسن الوحشين\" فقط و إنما قال أنه بالإضافة إلى قوة العرض أنه \"أحسن الوحشين\"، فالسببين مجتمعين هما سبب النجاح الكبير<br />إلى ميكو :<br />أختلف معك (رغم موافقتي الشديدة على نجومية منير و أنا من عشاقه)، إلا أن الفكرة التي أشار إليها المقال في آخره عن ضرورة إعادة النظر في تأثير الأغنية في الناس و كذلك صورة الأعمال الفنية مهمة جدا<br />إلى حمدي :<br />و أنت ليه بتستخدم الأرشيف بس؟!<br />انا جربت البحث و هو حلو جدا و دقيق جدا بس ابعد عن اسم الكاتب مش عارف ايه اللي مبوظها، بس لو فاكر أي كلمة (كلمة واحدة بس) جوا المقال اكتبها و البحث هيطلعها لك في ثواني.. و هيطلع نتايج حلوة أوي كمان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133209/http://www.20at.com/article2.php?sid=741"

[[comments]]
order = 4
subject = "الي مسقعه"
author = "حمدي"
posted = "2006-04-28"
text = "يا سلام فكرتني بالمسقعه مكلتهاش من زمان<br />ونفسي هافه عليها<br />مشكوره علي النصيحه يا مسقعه<br />انا بعمل بحث برده لانه اسهل بس فيه طريقه احسن رحيتني من البحثهو انك تاخد shortcut للمواضيع اللي مهتم بيها او اللي معلق فيها وحاطط الصفحات دي عندي علي الجهازولما اعوز ارجع للموضوع مجرد اضغط علي الصفحه ييجي الموضوع ولا بحث ولا وجع دماغ<br />اصل انا بقيت مدمن عشرينات اعمل ايه<br />سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133209/http://www.20at.com/article2.php?sid=741"

