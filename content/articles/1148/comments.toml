[[comments]]
order = 9
subject = "صوت الفنانين العرب هل يكون له صيت؟؟؟"
author = "أحمد الجيدي"
posted = "2006-08-05"
text = "صوت الفنانين العرب هل يكون له صيت؟؟<br />ــــــــــــــــــــــــــــــــــ<br />فقد تابع المشاهد في الوطن العربي والإسلامي صرخة الفنانين ، والذين يطلق عليهم بالفنانين المتزنين في حوار مفتوح مع مدير موقع الجزيرة (غسان بن جدو) من بيروت مساء اليوم،25.08.2006فكانت المواقف كلها متحدة في ما يجري على أرض لبنان من تدمير ومجازر وتهجير ، ومنهم من كان في موقع الحدث في وسط لبنان،ومن هناك قالت: الفنانة العربية (رغدة)(كلنا في خندق واحد)...واضافت ( انا جئت الى لبنان لأنقل في حقيبتي اللحم والدم العربي الذي يسفك،ولأعيش الحدث ، وانا هنا ليست للنزهة، بل لأعايش مأسات حقيقيةالذي بعيشها الشعب اللبناني،(بتصرف)وهنا ملاحظة عندما صاحت الأطفال في هذه الحديقة وهم يلعبون، إلتفتت يمينا وشمالا هل هنا صاروخ او قديفة صهيونية ، فهي كانت جالة وخائفة من غارت صهيونية على هؤلاء الأطفال النازحين من بيوتهم، إلا ان الفنان الكبير ( صلاح السعدني)كان منزعجا جدا لما يجري للبنان، وانتقد (هيك)عن قولته المغامرة،لأن لبنان لن تهاجم أحدا، وانتقد أيضاموقف الحكومات العربية مما يجري على أرض لبنان، وهنا طمأنه مدير مكتب الجزيرة بلبنان، بأن وزراء الدول العربية ستعقد إجتماعا لها ببيروت يوم الإثنين،27.08.2006وعدلت هذا التاريخ إحدى المراسلات من بيروت في وقت لاحق ان الإجتماع لوزراء الخارجية للدول العربية سيكون يوم الأحد:26.08.2006ووصف الحرب بالبربرية على لبنان،وحيا المقاومةاللبنانية والشيخ<br />حسن نصر الله) ودعا معه بالنصر على الصهاينة في هذه المعركة وزاد (نحن معك)وقد شارك فنان من البحرين( خالد الشيخ)وكان موقفه كبادي الشعوب العربية من الخليج الى المحيط،ثم الفنانة الفسلطينية(سهى البرغوتي) والفنان اللبناني من القاهرة.وحاول الإتصال...<br />(بشناق)من تونس، كموقف للفنانين من المغرب العربي إلا ان هاتفه كان خارج التعطيةأو مسدودا،..<br />لأن المأسات التي تعيشها لبنان إتحدت على إدانتهاكل شرائح المجتمات الإسلامية والعربية والدولية، لأنها حرب جائرة من قبل بوش وبلير والصهاينة، وهذه رسالة من قبل الفنانين الى المجتمع الدولي لإقاف العدوان البربري الهمجي على لبنان. ومطالبة الأمم المتحدة والإتحاد الأوروبي لتحمل مسؤوليته فيما يجري على الأرض.وبعد هذا البرنامح المباشر من بيروتن ، جاء مشروع القرار الذي توصلت اليه قرنسا وابريطانيا والولايات المتحدة مناقضالما تطالب به شعوب العالم، وهو وقف إطلاق النار، قبل مناقشة أي موضوع آخر،لأن فرنسا جنحت الى الضغوط الأمريكية والبريطانية في مسودة هذا المشروع الذي ينص على وقف إطلاق النار فورا،لأن بوش وابلير يتحدثان بلسان الصهاينة، لأنهما عصابةإجرامية في العالم،وجرائمهم في العراق وأفغانستان يجعلهما مجرما حرب حرب بامتياز، لأنهما لم يبق لهم أي إحساس إنساني ،فأصبحا كالحيوانات المفترسة ، يهمها سفك الدماء ، وهما أصحبالا يحسون بالراحة الا في وسط القتل والتدمير ، وان الضمير العالمي لن يسكت على جرائم الإدارة الإمريكية والبريطانية التي أعطت الضوء الأخضر للعصابة الصهيونية بالهجوم على لبنان لإرتكاب المجازر البشعة في حق الشعب اللبناني ، وان الهيمنة الأمريكية وذنبها البريطاني وربيبها الصهيوني، إلا ان جرالموقف الفرنسي الى تلطيخ يده بدماء اللبنانيين جعل المتتبعين لمشروع هذا القرار محل تخوف من قبل الدوائر السياسية والشعبية في الوطن العربي والإسلامي والدولي، ام ان فرنسا فقدت دورها في إدارة الأمم المتحدة بعد إحتلال العراق وأفغانستان،أم أن صفقة ما بين الأطراف الثلاثة على حساب الشعب اللبناني، وهذايجعل الرأي العام متوجس مما يجري على الأرض،فالإدارة الأمريكية والبريطانية والصهيونية تنتظر ان يحدث إختراق في الجبهة اللبنانية لتوسيع نفوذها وتجسيد المشروع الأمريكي الشرق الأوسط الجديد، والغطاء العربي الذي أعطي لهذه الحرب، كما أعطي للحروب السابقة،..<br />لأن الدور العربي والإسلامي أصبح في ثلاجة بوش وابلير وألمرت،لأن المحللين السياسيين في الجانب الأمريكي والبريطاني والصهيوني جعلوا منه في خطاباتهم ومناقشاتهم أدات يتباهون به في وسائل الإعلام، فأفراخ الدجاجةأصبحوا بلا أم ولا أب ،والحرب مر عليها ثلاثة أسابيع وبضعة أيام، والفيتو الأمريكي واقف يدمر الجسور والبيوت ويحرق الأشجار ويذبح الأطفال والشيوخ ..و..و..هذه (قانا) و(القاع) ترتكب بالفيتو الأمريكي، لعل العصابة الإرهابية الصهيونية تحقق هدفها في لبنان المذبوح والسلوخ بالموقف الأمريكي والبريطاني، وهنا قالت الفنانة الكبيرة (رغدة)، احمل في حقيبتي اللحم اللبناني،حتى يعرف العالم حقيقة ما ترتكبه العصابة الصهيونية في لبنان بغطاءالبيت الأبيض والمملكة المتحدة( البريطانية)وسكوت فرنسا،...<br />وكما قال: الفنان الكبير (صلاح السعدني) هذه حرب بربريةعلى لبنان،<br />والذي يبق في الساحة اللبنانيةتحكيه الأجيال،هو إلتحام الفسيفساءحول ( المقاومة اللبنانية)حتى الأطفال الذين هجروا من جنوب لبنان، سؤل أحدهم انت مع من في هذه المعركة،؟ وهل تخاف من العدوان الصهيوني على قريتكم؟فكان جوابه أكبر من سنه، وموقفه ممايجري؟ هل تخاف من الصهاينةفقال، للمذيع الذي حاوره في تلك الإذاعةعبر الأثير،(لا أخاف من الحرب ،بل أخاف من الله فقط) والفنانون هم الذين يتعاملون مع كل شرائح الأمة العربية والإسلامية والدولية،وبلغات مختلفةعليهم ان ينقلوا الحقائق الإجرامية التي ترتكبها العصابة الصهيونية بفيتو أمريكي، ولعل طلب ( صلاح السعدني) في خلق قناة الجزيرة بكل اللغات..لنقل الجرائم الصهيونية للعالم، فكان وعد من قبل مدير مكتب الجزيرة بلبنان....<br />اللهم انصر المقاومة اللبنانية ويؤيدها بجنود لم تروها، وبهذا ختم حديثه الفنان الكبير( صلاح السعدني وبصوت عال ،الله معه ياشيخ نصر الله....<br />25.08.2006<br />مرتيل<br />تحية العرب يابطل العرب في حوار مفتوح."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133209/http://www.20at.com/article2.php?sid=741"
