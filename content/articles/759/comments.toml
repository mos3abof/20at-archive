[[comments]]
order = 6
subject = "عاشق الجزيره"
author = "الراجل الكبير: انت يابني ياشرشر مسئول العوالم والصهلله"
posted = "2005-12-31"
text = "شرشر: ايوه يا باشا اامرني<br />الراجل الكبير: عايزين يابني نرد علي الافتراءات والاكاذيب اللي قناة الجزيره بتقولها علينا<br />شرشر: يا با شا القناة العالميه بتعتنا قناة الفيل للاخبار بتفندكل اكاذيبهم<br />الراجل الكبير:ياشرشر انت عارف وانا عارف ان محدش بيفرج علي قناة الفيل للاخبار الا انا وانت والحاجه سنيه جنح<br />شرشر: لا يا باشا ازاي انا منبه علي الموظفين بعد مايروحوا يتفرجوا علي نفسهم وعلي خيبتهم البني<br />الراجل الكبير: طمنتني ياشرشر<br />مكنش بقي فيه لزمه اخبط الجزيره المهموز ده عند توني بلير<br />شرشر: هو انت يا باشا اللي ...<br />الراجل الكبير : ايوه ياهبل ياابن الاهبل امال انت فاكر ايه هو انا بلعب<br />ده انا بكم 24 ساعه في اليوم<br />شرشر: ربنا يخليك لينا يابا شا ويخلينا افكارك اللي تجنن<br />الراجل الكبير تعيش يا شرشر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115338/http://www.20at.com/article2.php?sid=109"

