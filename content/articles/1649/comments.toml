author = "لحمد لله الذى هدانا والحمد لله الذى جعلنل مسلمين"
text = "اخى القارى انت صوتك جميل اوى وانا بسمع منك بحس<br />فعلن انى امام الكعبه الله يذيدك وادعوا الله ان يجمعنا تحت عرشه ويسقينا من يد رسوله الكريم"
