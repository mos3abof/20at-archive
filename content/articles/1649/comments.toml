[[comments]]
order = 2
subject = "الى الشيخ الفاضل مشاري العفاسي"
author = "لسلام عليكم ورحمه الله وبركاته"
text = "انامن السعوديه<br />احب قرأة الشيخ الفاضل مشاري وخاصةً قرأته المميزة لسورة طه وتمتعي بقرأته له الفضل الكبير على كرهي لسمماع الأغاني<br />فادعوا الله تعالى ان يسعده في الدنيا والآخره ويجزيه خيرالجزاء<br />لااعلم ان كان يصح لإمرأه ان تعلن حبها في الله لشخصكم الكريم .<br />أتمنى زيارتكم للخبر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151339/http://www.20at.com/article.php?sid=838"

