subject = "شبكة المريسي الاسلامية"
author = "سم الله الرحمن الرحيم"
text = "السلام عليكم ورحمه الله وبركاته<br />جزاك الله خير اخوي الشيخ مشاري العفاسي<br />حبيت اوصلك سلام اعضاء اسره منتديات شبكة المريسي الاسلامية والكل يحبك في الله<br />اخوكم في الله<br />جاسم المريس<br />المدير العام لشبكة المريسي الاسلامية<br />البحرين"
archived = "2006-11-02"
