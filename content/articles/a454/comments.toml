[[comments]]
order = 1
subject = "بيرو"
text = "ألو ألو ...سامعين ياللي هنا ولا نايمين...<br />المهم أنيس منصور ليه رأي جربته وهو ناجح معايا لحد كبير..بيقول:<br />لما تكون موش عارف تنام عندي ليك طريقة سهلة وسريعة ..تخيل نفسك في غابة تجري وهناك خلفك أناس كثيرون يجرون خلفك...<br />كل هذا والغابة مليئة بالأشجار ...بل وتهتز في عنف ايضا...<br />جرب وستنام سريعاااااااااااااااااا...!!<br />الحكاية وما فيها ان الاهتزازات تساعد علي النوم بطريقة غريبة ...ولعل هذا هو السبب في ان نصف الشعب المصري ينامون في الاتوبيسات بسبب اهتزازه<br />كذلك العادة المصرية في هز الطفل لينام اسرع ..!!<br />نصيحة أخيرة...<br />كل ما تهتز اكثر تنام اكتر وأكتر !!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926044048/http://www.20at.com:80/article.php?sid=454"

[[comments]]
order = 2
subject = "مطر"
text = "(1)<br />عندما تذهب للنوم<br />تذكر ان تنام<br />كل صحوٍ خارج النوم<br />حرام !<br />وخذ الفرشاة والمعجون واغسل<br />ما تبقى بين أسنانك من بعض الكلام<br />أنت لا تأمن أن يدهمك الشرطة<br />حتى في المنام !<br />ربما تشخر<br />أو تعطس أو تنوي القيام<br />فدع المصباح مشبوبا<br />كي تدرأ عنك الإتهام<br />يا صديقي<br />كل فعل في الظلام<br />هو تخطيط لإسقاط النظام<br />(2)<br />إحترم حظر التجول<br />لاتغادر غرفة النوم<br />الى الحمام ليلا<br />للتبول !<br />(3)<br />قبل أن تنوي الصلاة<br />إتصل بالسلطات<br />واشرح الوضع لها<br />لا تتذمر<br />وخذ الأمر بروح وطنية<br />ياصديقي<br />خطرُ أي اتصال<br />بجهاتٍ خارجية<br />(4)<br />عند إفطارك<br />لا تشرب سوى كوب اللبن<br />قدح البن منبه<br />فتجنبه إذن<br />قدح الشاي منبه<br />فتجنه إذن<br />ياصديقي<br />كل شخص ٍ متنبه<br />هو مشبوه مثير للفطن<br />يبتغي أن يشعل الوعي<br />لإحراق الوطن<br />(5)<br />لك في المطبخ آلاتٌ تثير الإرتياب<br />انتزع انبوبه الغاز<br />ولا تنسى السكاكين ، وأعواد الثقاب<br />و سفافيد الكباب<br />ربما تطبخ شيئا وتفوح الرائحة<br />ما الذي تفعله لو ضبطوا<br />عندك هذي الاسلحة<br />هل ترى تقنعهم<br />أنك مشغول بإعداد طبيخ<br />لا بإعداد انقلاب ؟!<br />(6)<br />قبل أن تخرج<br />دع رأسك في بيتك<br />من باب الحذر<br />يا صديقي<br />في بلاد العرب أضحى<br />كل رأسٍ في خطر<br />ما عدا رأس الشهر<br />(7)<br />إنتبه عند الإشارة<br />لا تقف حتى إذا احمرت<br />إذا كنت قريبا من سفارة<br />(8)<br />لا تؤجل عمل اليوم إلى الغد<br />ربما قبل حلول الليل تبعد<br />(9)<br />أغلق السمع<br />ولا تصغ لأبواق الخيانة<br />ليس في التحقيق ذل<br />أو عذاب أو إهانة<br />أنت في التحقيق موفور الحصانة<br />ربما يشتمك الشرطي<br />من باب \" الميانة \"<br />هل تسمي ذلك اللطف إهانة<br />ربما تربط في مروحة السقف<br />لكي تصبح في أعلى مكانه<br />هل تسمي ذلك العز إهانه ؟!<br />ربما مصلحة التحقيق تضطر المحقق<br />أن يجس النبض من كل الزوايا<br />ويدقق<br />فإذا جسك من ظهرك<br />أو ثبت فيه الخيزرانه<br />لا تظن الأمر ذلا<br />أو عذابا أو مهانة<br />يا صديقي<br />إن إثبات العصى في الظهر<br />إجراء ضروري لإثبات الإدانة<br />(10)<br />لاتمت منتحرا<br />لاتسلم الروح لعزرائيل<br />في وقت الوفاة<br />ليس من حقك<br />أن تختار نوعية أو وقت الممات<br />إنتبه<br />لا تتدخل في اختصاص السلطات (!!!!!!!!!!!!!!!!!!!)"
