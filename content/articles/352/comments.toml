[[comments]]
order = 13
subject = "وائل عباس"
text = "الاستاذة جديدة الموقع<br />والله انا ما شفتش اسئلة<br />لو شفت اسئلة اجاوب على طول<br />وعموما اذا كانت خلاصة استفسارك هو عن اني ممكن اساعد مراتي في البيت فالاجابة بنعم اذا كانت فعلا محتاجة مساعدة ومش بتدلع او انا اعرف حاجة هي ما تعرفهاش ...<br />وبالمناسبة انا باعرف اعمل قطايف ولقمة القاضي وبلح الشام ... بس من اجندة ماما بتاعة الوصفات ...<br />بس ماما مش بتسمحلي ...<br />بتقوللي انت بتوسخ مواعين كتير علشان تعمل حاجة واحدة<br />طب اعملها ايه يعني ...<br />مش العجين بيتسخن في حلة<br />وبعدين يتعجن في طبق<br />وطبعا مش ها اعجنه بايدي ...<br />وبعدين يتفلي في القلاية<br />وبعدين بيتعمل الشربات في حلة اخرى<br />وبعدين اطلعه من الزيت بالبتاعة دي<br />واحطه في طبق التفديم<br />قولولي بقى فين المواعين الكتير دي بذمتكم ؟؟؟<br />وانا مش باحب اغسل مواعين ... بس يمكن ربنا يهديني واكون باحب مراتي اوي وفي الحالة دي يعني ممكن اغسل مواعين واسيق الشقة كمان ... هاهاها<br />ودي كانت اجابتي على الاخت مكسوفة برضه<br />يعني عصفورين بحجر<br />ايه رايك في شروطي<br />لو موافقة قوليلي علشان بس نلحق قبل رمضان<br />والا ها تفوتك الفطايف ...<br />هاهاها"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018150635/http://www.20at.com:80/article.php?sid=635"

