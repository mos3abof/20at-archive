subject = "وائل عباس"
text = "الى ليلي<br />بجد انتي عايشه في الدنيا ليه ؟؟؟<br />ايه لازمتك اصلا !!!<br />لا مالوش حق عصام انه مش متفاهم<br />اخص عليه اخص اخص اخص<br />ازاي يتجرأ ويعوز مراته تطبخله !!!<br />والله خسارة انك اتجوزتي وعندك 25 سنة بس<br />وغيرك لهلوبة في شغل البيت لكن حظها قليل يا عيني<br />اللي زيك كان المفروض تعنس لحد ما تعرف ان الله حق !!!<br />اللهم لا اعتراض<br />حكمتك يا رب<br />ظلموك والله يا قاسم يا امين<br />انا الوحيد اللي عارف انك راجل كويس ومش السبب في اي حاجة من دي !!!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018150635/http://www.20at.com:80/article.php?sid=635"

[[comments]]
order = 4
subject = "جديد الموقع"
text = "وائل عباس..<br />ان جيت للحق بقى و عايز إلي يرضي ربنا؟<br />المهمة الرئيسية للزوجه إلي الشرع كلفها بيها و ربنا حايحاسبها عليها، هيه رعايتها لجوزها و تربية ولادها، لكن \"كل\" شغل البيت هو ملزم انه يجيبلها إلي يعمله، و لكن إن كان مش قادر، ف \"تعاونا\" منها معاه هيه إلي بتقوم بيه... واخد بالك؟ يعني أداء الستات لشغل البيت ده \"تطوع\" منها، و المفروض منك انك تساعدها، مش تتريق عليها.... إرجع للأحاديث الشريفه حتلاقي حديث بيقول ما معناه \".. الزوجة للفراش..\"، يعني مهمتها الأساسية هيه حضرتك و ولادك و بس... مش الطبخ و الغسيل و التنضيف !!<br />سيدنا عمر لما جاله إلي بيشتكي من إن مراته بتعلي صوتها عليه، و لقى إن موات سيدنا عمر صوتها عالي، سيدنا عمر قاله ما معناه \" تحملتني و تربي أولادي و تهتم بطعامي و تغسل ثوبي دون أن يأمرها أحد بذلك، أفلا أتحملها ان رفعت صوتها؟\"...<br />أتقو الله في الستات و اعرفوا حقوق زوجاتكوا الأول و بعدين اتريقوا..."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018150635/http://www.20at.com:80/article.php?sid=635"

[[comments]]
order = 5
subject = "راجل متجوز"
text = "يا جماعة العلاقة من بين الرجل والمرأة (وتحديدًا بين الزوج والزوج) مش علاقة عداء ومنافسة وتحدي..لأ دي علاقة مودة ورحمة وتعاون.<br />وبعدين فترة الخطوبة تتيح لكل طرف التعرف على عيوب ومزايا الطرف الآخر..واللي شايف في الطرف الآخر عيب ما يقدرش يتحمله، يبقى من الأحسن ما يرتبطش بيه من الأول..لكن ما فيش داعي إن احنا ننتقد وخلاص..لأن كل علاقة وليها ظروفها.<br />واللي ينفع مع أحمد وليلي يمكن ما ينفعش ما مجدي وناديه، وفي أزواج مبسوطين مع زوجاتهم بالرغم من أنهن لا يتقن الطبخ.<br />أما عن مشكلة الطبخ نفسها، فأنا أدعو كل رجل وامرأة لمحاولة تعلم الطبيخ ولو الحاجات البسيطة منه، يعني شوية رز على خضار على مكرونة، الحاجات البسيطة دي لأن ده مفيد جدًا \"للجنسين\" خصوصًا إن الطبيخ مش اختراع للذرة (واللي بيطبخوا عارفين كده كويس).<br />ولازم الراجل يتعلم يطبخ برده لأن أكيد في يوم من الأيام مراتك هتكون تعبانه ولازم أنت تساعدها. وأنا شخصيًا باعتبر الراجل اللي ما يعرفش يطبخ ولو صنف أو اتنين بسيطين عنده مشكلة لازم يصلحها.<br />ولازم يكون عندنا شوية تعاطف وتفهم مع بعض لأن مجتمعاتنا اتغيرت والأهل ما بقوش يعلموا الأولاد الطبيخ وشغل البيت وتحمل المسؤلية وده شئ في غاية الخطورة، لأنه بيأثر على الحياة فيما بعد سواء للراجل أو الست. والمهم إن الشخص يكون دايما عنه استعداد أنه يتعلم ويغير من نفسه.<br />وأذكركم في النهاية إن رسول الله عليه الصلاة والسلام كان \"في خدمة أهله\" بشهادة زوجاته نفسهم، يعني كان بيطبخ وينظف ويخيط ثوبة ونعله، وهو الغني عن هذا خصوصًا إن زوجاته لم يكن يعملن خارج المنزل زي الكثير من زوجاتنا اليوم.<br />أرجو إن ده يغير من مفهومنا عن حال سي السيد في البيت اللي ما بيعرفش يعمل لنفسه حتى كباية الشاي ولا يقدر يجيب كباية ميه..ليه؟؟؟!! علشان هو سي السيد راجل البيت.<br />ودمتم سالمين!"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018150635/http://www.20at.com:80/article.php?sid=635"

