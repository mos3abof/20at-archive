subject = "يعني ايه كلمة طبيخ"
text = "هو بس يا حماعة انا اسف اني هقطع حديثكم الجذاب ده بس هو بس كان عندي سؤال يتعلق بمفهوم الطبيخ عند حضراتكم<br />يعني مثلا انا بعرف اعمل مكرونة وزي ما انتم عارفين ان الموضوع سهل جدا لكن هل تعتبر المكرونة في حد ذاتها طبيخا<br />كذلك لدي بعض المعلومات التي تتعلق بالبيض المقلي والاومليت وقد حصلت علي هذه المعلومات اثناء حصولي علي دورة تدريبية في قنا لمدة عام \"ربنا ما يرجعها ايام \"<br />هذا بالاضافة الي اني مقدم علي خطوة خطيرة في حياتي تتعلق بتعلم صناعة الفيشار و\"طهي\" البوم فريت<br />السؤال هو هل يتم أعتبار الأشياء السالفة الذكر تمت بصلة الي فنون الطبيخ وتفتكروا المواصفات دي ممكن تخليني اعرف اتجوز ...؟؟<br />افتونا يرحمكم الله<br />بيرو"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018150635/http://www.20at.com:80/article.php?sid=635"

