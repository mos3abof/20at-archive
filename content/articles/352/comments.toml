text = "الاخت اللي ردت<br />لانها اكيد مش اخ<br />هاهاها<br />لو تلاحظي انا اتكلمت عن اول مثال فقط<br />ولم اتكلم عن باقي الامثلة<br />لانها هي المستفزة تماما ومش بتعرف اي حاجة ومعتدة بنفسها وعاوزة جوزها يتقبلها على كده كمان !!!<br />اتمنى ما تكونيش زيها ...<br />وشكرا"
