[[comments]]
order = 7
subject = "جديد الموقع"
text = "وائل عباس..<br />هوه إلي يقول كلمة حق لازم يبقى متحيز في الزمن ده؟<br />بصرف النظر عن التعليق بتاعك الأولاني .. البنت مش معتده بنفسها ولا حاجه، و بتقول انها بتحس بالإحراج ان جوزها بيعرف يطبخ و هيه لأ.. و بعدين الغلطه أساسا مش غلطتها، لأن التعود على شيئ في الصغر بيصعب تغييره خصوصا لو ظروف الحياة المعاصره كمان مش مدياها فرصه... يعني لو والدة حضرتك عودتك انها هيه إلي ترتب ليك أوضتك و تغسلك و تكويلك هدومك، و بعد عمر طويل اتجوزت و مابقتش بتساعد مراتك في أي حاجه و ده من حقها عليك شرعا طالما انت حالك على قدك و مش قادر تجيبلها إلي يقوم بشغل البيت، مش حتطلب منها و يمكن كمان تعتبره حق ليك عليها انها تستحملك؟؟<br />و بعدين فين الموده و الرحمة بين الزوجين؟ اذا كان عنك نقص تستحملك و تعينك و تكملك و العكس، مش هوه ده الجواز بشرع ربنا؟<br />لو بس الرجاله تبص لنفسها قبل ما تتكلم و تهاجم و تتريق، كان ال الدنيا اتعدل، بس اظاهر ان تخلي الستات عن بعض حقوقها بعلة المشاركه و الحب، بقت الرجاله بتعتبره حق مكتسب ليها...<br />و بالمناسبه، أنا بعرف أطبخ كويس، و ان كنت حاتنازل عن حقي في وجود بنت أو ست تقوم بشغل البيت عني، فده حيكون لو كان جوزي فاهم ان ده تنازل مني عن أحد حقوقي عليه بسبب حبي ليه و مشاركهو مساعده مني له، و يساعدني فيه كمان..."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018150635/http://www.20at.com:80/article.php?sid=635"

