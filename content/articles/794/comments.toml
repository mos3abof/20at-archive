[[comments]]
order = 5
subject = "المفكر فيما يفكر"
author = "omomar"
posted = "2006-10-14"
text = "معذرة اولا احيى النساء المسلمات على الاهتمام بكتاب الله تعالى والمسارعة على حفظه ولكن يجب مع الحفظ العمل بما فيه وهذا هو الايمان ***********ولى تعليق اخر على تعليق مفكر بعنوان واسفاه فليته ماعلق فكيف يصوغ له من ليس له ادنى علم فى دينه ان يتكلم عن الدين ويقول انه مجرد نصوص لاتغنى ولا تسمن من جوع فحياتك ايها المفكر لا تستقيم الا بالقران وقل لنا ماهو الكلام الذى يسمن ويغنى من جوع ايها الضضضضضضضضضضضضضضض"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123435/http://www.20at.com/article2.php?sid=930"
