order = 2
subject = "واأسفاه"
author = "مفكر"
posted = "2006-06-23"
text = "شيء مؤسف للغاية . أفلم يعد لدى الرجال والنساء سوى حفظ وتلاوة القرآن مرارا وتكرارا ؟ الشعوب المتقدمة أصبحت على القمر ونحن لازلنا نعيد ونفتق .. نحفظ ونتلو ونتفنن في التلاوة ! فاضين وراضين . لنرى الى ماذا ستصلون بعد هذا الحفظ لهذه النصوص التي لاتغني ولاتسمن من جوع . نحن نتلوها منذ 14 قرنا وحالنا من سيء الى أسوأ . متى سنتعلم أن نعمل شيئا مفيدا للبشرية ؟ على مايبدو راحت علينا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123435/http://www.20at.com/article2.php?sid=930"

