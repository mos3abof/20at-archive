author = "English Youth"
posted = "2007-02-27"
text = "رؤية الفيلم بصراحة حلوة ولطيفة، أنا لسة شايفاه يوم الخميس اللي فات … بصراحة روعة.. لكن في بعض النقاد الأجانب اللي عابوا على الفيلم أن كريس جاردنر ظهر كشخصية مثالية زيادة عن اللزوم، بس الواقع إن الفيلم ما أظهرش ده ولا حاجة بدليل إنه كان بيتخانق مع جاره علشان ياخد الفلوس اللي عليه له، ومكنش عارف يوفر أبسط حقوق المعيشة لمراته وابنه، ففين الشخص المثالي ده؟!!!<br />هو من الناحية الأخلاقية ملتزم بس غير كده مكنش فيه أي مقومات للنجاح تساعده على المعيشة أو تحقيق حياة كريمة له ولإبنه… طبعاً في ناس بتقول إن واحد غيره كان سرق ولا نهب علشان يعيش … بس ماننساش ابنه … وأعتقد إن وجوده كان نقطة حيوية ومحورية جداً في القصة … وده علشان خلاه يجمع بين إنه ينجح ويكافح علشان الحياة اللي بيتمناها ليه ولإبنه وبين إنه يوطد علاقته به ويخليه يضع كل ثقته فيه وميتخلاش عنه أبداً بالرغم من إنه كان بيزعق ويشخط فيه في بعض أوقات الضيق ومع ذلك الولد كان بينسى على طول وده لأنه طفل وأبوه ليه حسنات تانية كتير.<br />أعتقد إن الفيلم وفق كويس جداً بين نجاح العلاقة الإنسانية ونجاح الحياة العملية (مسكن نظيف وكويس - لقمة نظيفة - هدمة نظيفة) ودي أبسط مقومات الحياة عند الإنسان الطبيعي، مش مجرد بحث عن ثروة أو نفوذ أو صيت…<br />بجد فيلم رائع ورؤية جميلة… وياريت يا عشرينات ترجعوا تاني لكتابة رؤى مختلفة للأفلام الحلوة اللي زي دي … وشكراً."
archived = "2009-05-13"
capture_url = "https://web.archive.org/web/20090513040633/http://www.20at.com:80/klam-rosas/3331.html"

