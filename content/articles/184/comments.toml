[[comments]]
order = 2
subject = "حالم بمستقبل"
text = "حقيقة أنا أرى أن الأفلام الشائعة التي تنتج ويبذل فيها مجهود، دون طائل، سوى الاسفاف والانحطاط، فهي عدم تقدير للمشاه. فالمشاهد عندهم عبارة عن:<br />1 - لاهث وراء الشهوة الجنسية والجسدية...<br />2 - أو يبتغي الشهرة بأي شكل وبأي ثمن....<br />3 - يهوى الضحك... بمبرر أو بدون مبرر...<br />وأنا أشعر أن هذه الأشياء لا تحترم عقل المشاهد، بل تعتبره تافها لا قيمة لعقله ولا لتفكيره...<br />لذا فأنا لا أسقط إلى هذه المنزلة (....)"
archived = "2004-08-24"
capture_url = "https://web.archive.org/web/20040824040834/http://www.20at.com:80/article.php?sid=551"

