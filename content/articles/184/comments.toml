[[comments]]
order = 7
subject = "مجرد كلام"
text = "المشكلة اللي موجودة دلوقتي اننا اصبحنا بندافع عن الافلام لان دفاعنا ده في حد ذاته ما هو الا دفاع عن انفسنا<br />الموضوع ببساطة ان لو كل الافلام اللي بتتعرض طلعت وحشة ودون المستوي ...هيكون المسئول عن ده هو الجمهور لان اللي بيعمل الففيلم بيعمله علشان يرضي الجمهور وبما ان الجمهور عايز كدة بدليل ان الافلام الي من النوع ده بتحقق عائد \"جبار \" يبقي العيب عند الجمهور<br />ومن هنا طلعت فئة تتبني الدفاع عن الافلام حتي ولو كانت تعلم انها هابطة فقط لانها تتدافع عن نفسها وتحاول التنصل من تهمة انحطاط الذوق العام التي يواجهها المجتمع المصري كله الا من رحم ربي<br />اقول هذا الكلام لاني كمشاهد بدأت اشعر بالألفة مع أغاني شعبان عبد الرحيم ورقصات روبي ونانسي وىآهات هيفاء وأليسا ...<br />أشعر اني كمشاهد مسئول عن تفاقم هذه الظاهرة ...فلو اني أمتنعت عن المشاهدة من اول رقصة لما اصبحت الرقصات متعددة وكثيرة<br />نحن من صنعنا العري والابتذال<br />كل واحد منا يحمل عبئا والامر لن ينتهي بمحاولة فرد أو جماعة ...<br />لن يرحل الانحطاط الا لو قلنا له جميعا مع السلامة ...<br />لا نريدك هنا ارحل عن ارضينا وشاشات تلفازنا ..<br />اعتذر عن الأطالة ...<br />واعود للفيلم المذكور والمقال اللذيذ للصديق البراء<br />شد حيلك يا بطل ...<br />ومتعنا كمان وكمان ....<br />أخبار الساندويتشات ايه ؟؟"
archived = "2004-08-24"
capture_url = "https://web.archive.org/web/20040824040834/http://www.20at.com:80/article.php?sid=551"

