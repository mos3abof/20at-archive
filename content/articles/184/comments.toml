[[comments]]
order = 18
subject = "صبووووحه ( صباح الورد )"
text = "سلااام<br />بصراحه شعرت بسخافة الفلم من قرائتي للمقاله<br />لا بل ازيدكم اني كرهت نفسي لاني قرأت تفاصيل الفلم<br />فما حال من شاهده فعلا وامضى من عمره ساعه ونصف الساعه<br />في مقابلة شاشة عملاقه وسماع صوت ضخم ليكتشف في الاخير<br />ان الفلم لا داعي له وانه عليه ان يبحث عن الغبي الحقيقي .. عذرا اخي كاتب المقاله .,, لست انت الغبي الحقيقي .. بل هو المنتج عديم الوعي وقليل<br />الاختلاط بالاعمال الناجحه الذي اخذ على عاتقه انتاج هذا الاسفاف والاستهتار بعقل المشاهد العربي<br />الف شكر لك ولكني بصراحه اجد ان المنتج اغبى عناصر هذا الفلم ولا ضرر ان كان هو بهذا الغباء ان يقوم باقي الفريق بالتمثيل والاخراج من بيتهم<br />دمتم بعافيه<br />صباح الورد.."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018100224/http://www.20at.com:80/article.php?sid=551"

