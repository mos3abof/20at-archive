[[comments]]
order = 20
subject = "مسلم"
text = "الى كل مسلم اذا كان الشيخ القائد *اسامة بن لادن*وجنوده الله فى الارض ارهابيون فماذا نسمى الامريكان والصليبين والصهاينة .<br />اسد الاسلام الشيخ* اسامة بن لادن* زرعت فينا نخوة الاسلام وباذن الله ستحصدة فى جنان الرحمن وبالتوفيق والنصر باذن الله المرسل مسلم"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018100224/http://www.20at.com:80/article.php?sid=551"

[[comments]]
order = 21
subject = "بن لادن ؟؟"
text = "هل لأسامة بن لادن غيرة على الأسلام ؟؟<br />نعم أظن ذلك<br />هل يبتغى وجه الله جل و على ؟<br />نعم , أظن ذلك<br />هل زهد عن الدنيا فى سبيل مرضات الله ؟<br />نعم أظن ذلك<br />و السؤال الأهم .... هل هو على حق؟<br />لا ... لا أظن ذلك<br />فقتل الأطفال ليس حق<br />قتل الآمنين ليس حق<br />أرهاب النساء و الشيوخ ليس بحق<br />حتى و أن كانوا كفار ... حتى و أن كانوا أعداء<br />لا نقتل إلا المحاربين ... لا نقاتل إلا المجرمين<br />و لكن قبل ذلك طاعة ولى الأمر كما أمرنا الحبيب المصطفى صلوات الله و سلامه عليه<br />هكذا أمرنا رسول الله و إرجعوا إلى السيرة النبوية و الأحاديث الشريفة و قبل كل ذلك القرآن<br />و الله سبحانه و تعالى أعلم"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018100224/http://www.20at.com:80/article.php?sid=551"

[[comments]]
order = 22
subject = "مقدام"
text = "السلام عليكم<br />يا جماعة لماذا دائما نضع في الاسلام صورة (الانغلاق) و هذا مرفوض الاسلام دين واسع منفتح على جميع الحضارات اما نحن اتينا لنرسم صورة قوية و هي<br />ان الرجل و المرأة (كائن جنسي تسيره الغريزة والشاب ما ان يرى فتاة يصبح كالبهيمة يريد ان يفعل المعصية و الفتاة ما ان ترى الشاب تصبح كالبهيمة تريد ان تنكح حتى لو بالحرام) يا عالم يا شباب مش هيك الاسلام ... الاسلام جعل الانسان ارقى المخلوقات احنا يا معشر الشباب و يا معشر الفتيات نلتزم باداب الاسلام في الحوار المشترك بين الجنسين و لن يكون هناك اذى باذن الله<br />تحية للعلامة القرضاوي رافضا تصديق الاشاعات عن فضيلته و للشيخ العظيم عمرو خالد<br />و تحياتي و احترامي للاخت مسلمة<br />ــــــــــ مقدام ،،،"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018100224/http://www.20at.com:80/article.php?sid=551"

[[comments]]
order = 23
subject = "خطأ اخر من الكاتب ضد بن لادن"
text = "الي القائل في بن لادن:<br />هل يبتغى وجه الله جل و على ؟<br />نعم , أظن ذلك<br />و السؤال الأهم .... هل هو على حق؟<br />لا ... لا أظن ذلك<br />فقتل الأطفال ليس حق<br />قتل الآمنين ليس حق<br />أرهاب النساء و الشيوخ ليس بحق<br />حتى و أن كانوا كفار ... حتى و أن كانوا أعداء<br />لا نقتل إلا المحاربين ... لا نقاتل إلا المجرمين<br />أفول لك.هل تعرف التضاد وعدم وضوح الرؤية وضبابية الفكر.واغلاق العقل قبل العينين؟ لا أظن ذلك.<br />لأنك في الاعلي اقررت ان بن لادن يبتغي وجة الله اي يريد رؤيته ي الجنة.كيف وانت تقول انه يقتل اطفال وشيوخ ويرهب ويذبح؟ اذا الأجدر ان تقول انه لا يبتغي وجةالله. تقول أو لا تقول.الأمر سيان.فأنالاأجد في قولك حكمة.في حفظ الله."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018100224/http://www.20at.com:80/article.php?sid=551"

[[comments]]
order = 24
subject = "من اين انت؟"
text = "عزيزي يا من تعتقد بابن لادن سوء.انت تمشي مقيد العينين خلف اراء ساذجة.<br />من اين انت.من السعودية!هل تخدم الامريكان وتضايفهم القهوة في بلدك؟ام انت في قطر او الكويت القاعدةالامريكية امام بيتك. هل انت من مصرّّ! القواعد الامريكية في عقر دارك؟ في حكومتك! .هل انت اردني سوري لبناني! حالهم اسوأ. من دول المغرب! اذارئيسك يهودي بلاشك .الادارة الأمريكيةهي رئاستك. اذاانت من هذة الدول لك حق في كرة ابن لادن ,أنه الوحيد الذي جردكم من ثيابكم فرأيتم قبح عريكم"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018100224/http://www.20at.com:80/article.php?sid=551"
