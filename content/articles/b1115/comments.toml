order = 0
subject = "سحق بعوضة"
author = "seven"
posted = "2006-08-01"
text = "إن كان سحقنا نملة فلا بْْئس لأن سحقهم أقل من سحق البعوضة وأتمنى أن أصادف ذلك الحقير في الحرب لأني لن أراعي فيه ربي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142355/http://www.20at.com/article2.php?sid=1115"

[[comments]]
order = 1
subject = "الكفرة الفجره"
author = "مسلمه"
posted = "2006-08-01"
text = "دايما وسائل الاعلام بتاعتنا مبتجبش الحقيقه وبتحاول تخفيها<br />اما الامريكان فبمنتهى البجاحه عادى عمل عملته ايه المشكله<br />هم حقا \"الكفرة الفجره\"<br />اللهم ارنا فيهم يوما كيوم عاد وثمود<br />اللهم عليك بهم وبمن عاونهم<br />اللهم انصر المجاهدين فى سبيلك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142355/http://www.20at.com/article2.php?sid=1115"

