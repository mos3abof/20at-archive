subject = "صحوة"
author = "سلوى"
posted = "2006-08-02"
text = "اتفق تماما مع لوسيلولو .. فلعل مثل هذه الممارسات توقظ ضمائر العرب شعوبا قبل حكاما من غفوتهم الآثمة ..<br />\"نعيب زماننا والعيب فينا<br />وما لزماننا عيب سوانا\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142355/http://www.20at.com/article2.php?sid=1115"

[[comments]]
order = 6
subject = "صدق صدق هذا زمن الغثاء"
author = "مستضعف"
posted = "2006-08-02"
text = "صدق هذا الجندي ‘ن قتل المسملين في بلادهم مثل سحق نملة أو بعوضة<br />لأن هذا زمن الغثائية شباب كثير ولا فائدة، شباب كثير لا يعبد ربه ولكن يعبد جلده<br />شباب مفتول العضلات همه الأكل مثل البهائم والمظاهر واللباس والتزيين مثل الفتيات والسفاد مثل العجماوات.<br />نعم قتل المسلمين أهون من قتل نملة ودعنا بعدها ناكل البيتزا<br />انظروا غلى قنواتنا أنظروا إلى مسلسلاتنا تفهوا ما معنى كونكم جميعا غثثثثثثثثثثثثثثاء غثثثثثثثثثثثثثثثثثثثثاء<br />غثثثثثثثثثثثثثثثثثثثثثثثثثثثثثثثثاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142355/http://www.20at.com/article2.php?sid=1115"

[[comments]]
order = 7
subject = "هكتله و اديك رنه"
author = "نيفين نيفى نوفا"
posted = "2006-08-02"
text = "حكايه نقتل حد و نروح ناكل بيتزا دى بتفكرنى بماجد الكدوانى ف فيلم عسكر ف المعسكر لما قال لقريبه هكتله و اديك رنهو الله ما انا لاقيه تعليق على دا غير دموعى<br />حسبى الله و نعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142355/http://www.20at.com/article2.php?sid=1115"
