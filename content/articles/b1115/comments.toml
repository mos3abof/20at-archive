text = "الا يعتقد هذا الصرصار أنه من السهل سحقه يوما ما.<br />رب لا تذر على الأرض من الكافرين ديارا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142355/http://www.20at.com/article2.php?sid=1115"

[[comments]]
order = 3
subject = "أمركم عجيب"
author = "لوسيلولو"
posted = "2006-08-02"
text = "اتعجب لأمركم وانتم تشتمون هذا الجندي فالعيب ليس فيه بل فينا نحن العرب الذين تسببنا في مجيء هؤلاء الحثالةإلى الوطن العربي,وبالتأكيد أمريكا لن ترسل أحسن جنودها إلينا بل ترسل لمامة المجتمع الأمريكي وسافليه. أرجو أن لا ننسى أن العرب هم السبب فيما يجري في فلسطين والعراق ولبنان فهم مثل تنابل السلطان عبد الحميد لا يملكون أمام أمريكا إلا السمع والطاعة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142355/http://www.20at.com/article2.php?sid=1115"

