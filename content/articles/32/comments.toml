[[comments]]
order = 0
subject = "هل يعقل"
text = "هل يعقل بعد ذلك ان يقولوا عن الحضارة الإسلامية إنها اضطهدت الآخر ؟...<br />وإذا كانوا يستشهدون ببعض التجاوزات التاريخية غير المسئولة من بعض المسلمين فبماذا يعللون حدوث ذلك الآن في قلب أوروبا منارة الحضارة المزعومة وشكرا"
archived = "2004-04-22"
capture_url = "https://web.archive.org/web/20040422181448/http://www.20at.com:80/article.php?sid=113"

[[comments]]
order = 1
subject = "والفلبين أيضا"
text = "قريبا جدا البي بي سي نشرت هذا الخبر<br />تعرضت ثلاثة مساجد في مدينة دافاو في جنوبي الفليبين إلى سلسلة من الهجمات، بعد ساعات فقط من تفجير أودى بحياة 16 شخصا. وأثارت الهجمات على المساجد مخاوف من تصاعد حدة العنف الطائفي في المدينة التي تقطنها أغلبية مسيحية"
archived = "2004-04-22"
capture_url = "https://web.archive.org/web/20040422181448/http://www.20at.com:80/article.php?sid=113"

[[comments]]
order = 2
subject = "وكمان سلوفينيا"
text = "دعا الشيخ عثمان دجو غيتش مفتي سلوفينيا أهل الخير والمحسنين في قطر للمساهمة في تحقيق حلم مائة الف مسلم في بلاده باقامة اول مركز اسلامي ومسجد جامع في العاصمة «لوبليانا»‚ وذكر ان المسلمين في سلوفينيا لا يجدون مسجدا مستقلا يؤدون الصلوات الخمس وصلاة الجمعة والعيدين فيه وقال ان حرص المسلمين على اقامة شعائر دينهم دفعهم لاقامة 12 مصلى في بيوت قديمة تم تحويلها لمصليات ‚‚ وأوضح ان تلك المصليات تضيق بالمصلين وتضطرهم لصلاة العيد في الملاعب الرياضية‚ عن الوطن القطرية"
archived = "2004-04-22"
capture_url = "https://web.archive.org/web/20040422181448/http://www.20at.com:80/article.php?sid=113"
