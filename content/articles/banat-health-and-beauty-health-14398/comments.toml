author = "حساس بهموم الناس"
posted = "2010-01-29"
text = "اقتباس شوشو الشرمووووطة:<br />أنا كسي حساس جدا للنيك أرجو الحل وخرم طيييزي بيحرقني<br />حطي صباعك في طيزك قبل النوم كل يوم لمده اسبوعين حتلاقي نفسك بقيتي حلوه اوى و حتخفي على البعبصه<br />اما بالنسبه لموضوع كسك الحساس فنصيحه منى اقلعى كيلوتك و اقعدى بكسي على بلاط ساقع وحكيه ف البلاط لحد ما ينشف و يجمد<br />وفيه تدريب حلو اوى لو عندك تورئه طويله امشي على كسك وانتى بتحكيه ف الارض من اول التورئه لاخرها مرتين ف اليوم<br />وابقي طمنينا على النتيجه وحياه خرمك"
archived = "2010-02-25"
capture_url = "https://web.archive.org/web/20100225095441/http://www.20at.com:80/banat/health-and-beauty/health/14398-2009-12-14-13-42-34.html"
