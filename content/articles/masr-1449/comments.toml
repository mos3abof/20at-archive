[[comments]]
order = 5
subject = "الدعارة الصحفية هنا كمان"
author = "فارس_fr"
posted = "2007-01-16"
text = "للاسف حتى ولاد البلد انتهجوا منهج الدعارةالصحفية اللى انتهجها كرم زفت جبر والمخبر الصغنن حمدى رزق , وحذفوا تعليقى مش عارف ليه , يمكن عشان ان اكره رئيس هيئة الدعارةالصحفيةبتاعتهم \"روزاليوسف \" .<br />حد يجاوبنى ؟؟ هو اللى يقول راية فى كلب من الداعرين فى البلد يبقى ارتكب جريمة .<br />انا باكره كرم جبر الداعر ايه مشكلتكم انتم ,<br />ليه تحذفوا تعليقى , ولا يمكن كان هيوجه التعليقات لمسار تانى انتوامش عايزينه دلوقتى<br />فهمونى يعنى , اخوكم الصغنن حلاوة وعايز يفهم<br />هو اللى يجي جنب الداعر الاعظم تحذفوا تعليقه ولاايه , مع انى مشتمتهوش يعنى بالفاظ خارجه<br />مع انى اول مابشوف اسمه على المقال ملف الشتايم والوساخةبيتفتح تلقائى ....... لانه منافق وداعر ورئيس هيئة الدعارة الصحفية ياولاد البلد"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118180830/http://masr.20at.com:80/article.php?sid=1449"

[[comments]]
order = 6
subject = "يا عم كرم ارحمنا بقى"
author = "رئيس تحرير"
posted = "2007-01-16"
text = "يا عم ارحمنا بقى من مقالاتك خلاص عرفنا انك بعت شرف مهنتك وبقيت اغا كبير للسلطة مش فاهم ان كل الناس بتستحقرك ومش بتحبك<br />عارف ليه لانك مش بتقول الحق مع الاسف مش باعرف اقول الفاظ خارجة لكن هاكتفى باللى اتقال عنك من اخوانى فارس وابن بهية وان شاء الله عايز اسمع عنك واعرف انت فين لما ربنا يرفع البلاء عنا<br />وحسبى الله ونعم الوكيل<br />mego-mego.blogspot.com"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118180830/http://masr.20at.com:80/article.php?sid=1449"

[[comments]]
order = 7
subject = "أولا ..ليه شح كسر ده ؟ ثانياً .. إكرام الميت دفنه"
author = "إبن بهيه"
posted = "2007-01-16"
text = "أنا بكل صراحة ووضوح لا أدري لماذا يصر ولاد البلد وعشرينات على جلب ذلك العفن إلى موقعهم ؟؟؟!!!!<br />عايزينا نمشي وما نعتبش عندكم تاني يعني؟؟؟<br />راح تقولي خلاف في الرأي وحرية البطيخ في التحول إلى شمام وطماطم .. أقولك فوق وبلاش تهجيص .. لأن المدعو شح كسر ده مش مختلف معانا في الرأي .. لأ ده من الوسخين اللي بيبيعوا شرفهم على ناصية أي حارة للي يدفع .. ده صحفي برتبة مخبر أمن دوله .. طيب يا ريته كان له رأي ونختلف معاه .. لكن البعيد خبؤء بيطرش كلمتين كل يومين حسب أوامر أسياده .. يبقى رأي فين ومنين واختلاف إيه ؟؟؟<br />بجد أنا زي الناس اللي هنا زعلان منكم يا عشرينات .. ارجوكم ارحمونا بقى .. مش كفاية حسني الواطي علينا ..<br />بس شوف الصورة ؟<br />دي كانت في ألمانيا قبل ثلاث سنوات تقريباً .. يعني هتفرج قريب خالص .. أصل ما فيش حقنه ممكن تشحن بطاريته أكتر من كده .. وآديكم شايفينه مفيص وإكرام الميت دفنه يا جماعه .. بس الملعون مصر يقرفنا بالبرعم اللي نبتله من خمس سنين وعمال يتسلق كالنباتات الطفيلية على السناده اللي عملهاله الواطي الأول وبيسموها لجنة الوكوسات<br />سامحونا بقى .. أرق تحياتي للجميع عدا سحت كسر ده واللي زيه اللي لا رأي ولا لازمه في الحياه أصلا ...<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118180830/http://masr.20at.com:80/article.php?sid=1449"

[[comments]]
order = 8
subject = "تعليق على الصوره"
author = "ايمن امام"
posted = "2007-01-16"
text = "يااستاذ كرم/ اختيارك للصوره المصاحبه للمقاله يعنى الكثير ولاتقل لنا انه تم اختيارها مصادفه ماذا ترمى من وراء اختيارك لهذه الصوره - هل تشبه مبارك بزعماء الكرملين ام انك تريد ان تقول لنا شىء لم استطع استيعابه لاننى من الدهماء ولست من المثقفين التنويريين امثالك- استاذ كرم اما- عن موضوع المقاله فحدث ولاحرج<br />ففيها الكثير والكثير<br />ابدأها من حيث اردت ان تخفف حده الاهانه لنا كشعب -<br />من الاحزاب فحقيقه - معظم الاحزاب هى مثال فاضح للديكتاتوريه والهيمنه على الكرسى والبطش بالمعارضين- ولكن لماذا<br />اعتقد لانها كلها صنيعه الدوله - وتستمد حمايتاه من الدوله وسفاره اخرى لها نفوذها فى مصر بل قل وبصراحه انها هى التى تدير الحياه السياسيه وغيرها فى مصر- وطبعا لاننسى دور الكنيسه المصريه ونفوذها فى السفاره الامريكيه<br />لعلك ياسيدى لم تنسى ما حدث فى حزب الوفد -لعلك ياسيدى لم تقدم لقرائك الاجابه عن الاسئله التى ماذالت حائره ومنها على سبيل المثال<br />الزيارات المتعدده لمنير فخرى عبد النور لمن اسماهم اهلى النوبه او من كان يحلم ان يسميهم الاقليه النوبيه المضطهده!!!<br />تزكر هذه الكلمات ياسيدى عندما يحين موعد استخدام هذه الاجنده<br />لعلك ياسيدى لم تنسى ان المسيطر ولو شكلا الان على هذا الحزب رجال صناعه الادويه فى مصر ومنهم رؤساء مجالس ادارات للكثير من هذه الشركات<br />لعلك ياسيدى لاتنسى - ان اغتيال الرئيس السادات قد جاء عقب الخطبه الشهيره والاخيره-- عندما ردد عباره انا رئيس مسلم لدوله مسلمه-<br />السؤال الان لماذا نشعر نحن كشعب ان الدوله تناصبنا العداء<br />لماذا فقدت الدوله ثقتها فى الشعب ولماذا شعر الشعب ان هذه الدوله كأنهاكيان محتل-<br />بقاء الرئيس فى منصبه طوال عمره- قد يكون فى صالح البلاد وقد يكون ضارا بمصلحه البلاد -فما<br />اقرأ بقية التعليق .."
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118180830/http://masr.20at.com:80/article.php?sid=1449"

[[comments]]
order = 9
subject = "احزاب تفصيل وخياطة الحكومة"
author = "معنى الحزب فى مصر ان فية شقة وعليها يافطة مكتوب عليها حزب كذا والشقة دى فيها شوية كراسى ومكتب ومراقبة طبعا مين اللى داخل ومين اللى خارج"
posted = "2007-01-16"
text = "لا اجتماعات ولا لقاءات شعبية ولا مناقشات سياسية<br />مجرد ديكور رائع جدا<br />سيروا الى الامام وحققوا المجد<br />ويجب المحافظة على المكاسب والاستقرار والامن المنشود<br />ان المشعوذين الذين يتلاعبون بامن البلد يجب ان يقمعوا<br />فهمت حاجة<br />ولا انا"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118180830/http://masr.20at.com:80/article.php?sid=1449"

[[comments]]
order = 10
subject = "مبارك: مصر ليست سورية"
author = "مبارك: مصر ليست سورية"
posted = "2007-01-16"
text = "أرسل هذا التعليق بواسطة :<br />مبارك: مصر ليست سورية<br />قال الرئيس المصري حسنى مبارك إن ليس لديه أي خطط للسماح لأبنه الصغير جمال أن يخلفه في تولى الرئاسة<br />وقال مبارك في لقاء مع مجلة نيوزويك الأمريكية إن مصر ليست سورية، مشيرا إلى الرئيس السوري بشار الأسد الذي خلف والده<br />وقد نسب إليه قوله إنه يبحث عن نائب لرئيس الجمهورية ولكنه أضاف أن ذلك أمرا صعبا، غير أنه بصدد دراسة عدة أسماء<br />هذا وينص الدستور المصري على أن يتولى نائب الرئيس منصب الرئاسة لفترة انتقالية في حالة وفاة رئيس الجمهورية<br />غير أن هناك تكنهات واسعة الانتشار في القاهرة أن جمال مبارك يعد لتولى السلطة"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118180830/http://masr.20at.com:80/article.php?sid=1449"
