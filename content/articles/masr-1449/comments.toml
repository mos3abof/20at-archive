subject = "اكيد كلب"
author = "فهد الاسلام"
posted = "2007-01-16"
text = "طبعا انتو عارفين يا جماعة انى زوز اليوسف مجلة عميلة للحكومة انو مستنمين اية من واحد زى دة غير انة يقول كدةوالله يا اخى مش عارف انتو هتقبلو ربنا ازى فعلا منا فقين هو دايما الكلب فى ديل سيدة وبعد كدة احنا ملنة بشرين رضاء ولا غيرة اتحرقوا انتو الا ثنين بجاز وسخ مع انة خسارة فيك والله نفسى انقش امثلاكواعرفهم قدرهمحسبنا الله ونعم الوكيل"
archived = "2007-01-18"
capture_url = "https://web.archive.org/web/20070118180830/http://masr.20at.com:80/article.php?sid=1449"

