text = "حرام عليكم الكلب عنده وفاء و ممكن يحمي صديقة بكل ما يملك من قدرة لكن هؤلاء اللي بيطبقوا مثل اربط الحمار مكان ما يحبه صحبه دول ساعة الجد ما تلاقيهمش اما يسكتوا او ينقلبوا علي اسيادهم خلاص ما حدش بيقراء اللي بيكتبوه غير زماليهم الصحفيين انا شخصيا لما باشوف الاشكال علي شاشة التلفزيون بغير المحطة علي طول"
