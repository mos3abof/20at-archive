author = "شعب متفرنس"
posted = "2009-11-17"
text = "زمان ايام ما كنت طالب كان عندي مدرس وحكى لي هذا المدرس انه ذهب في اعارة الى الجزائر 4 سنوات وبعد سنتين لغى الاعارة ورجع مصر<br />فقلت له لماذا<br />قال لانهم شعب متفرنس<br />يعني انه كان محتل من قبل فرنسا<br />فتفرنس الشعب الجزائري واصبح يشعر انه افضل"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119040159/http://www.20at.com:80/masr/hot-topics/14076-2009-11-17-12-05-56.html"

