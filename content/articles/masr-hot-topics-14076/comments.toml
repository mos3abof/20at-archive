author = "انا شفت الجزائريون"
posted = "2009-11-17"
text = "زمان قوى كنت مجند فى الجيش فى كتيبة على شط القناة بعد هزيمة 67 وايام حرب الاستنزاف وكان الكتيبة المجاورة لنا على شط القناة هى كتيبة جزائرية ارسلها الرئيس هوارى بومدين رحمة اللة<br />كانوا شجعان جدا<br />وكانوا يقومون بعمليات عبور فردى للقناة واصطياد اسرائيليون<br />نعم نعرفكم من زمان<br />انتم اشقائنا<br />وسواء كسبتم انتم او كسبنا نحن فكلنا واحد"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119040159/http://www.20at.com:80/masr/hot-topics/14076-2009-11-17-12-05-56.html"

