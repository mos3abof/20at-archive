author = "كابتن/ حسام السيد"
posted = "2009-11-17"
text = "انا متعرف على اكتر من 8بنت فى الجزائر من شهر 10/2008 واحنا اصحاب اوى ومنهم 2 بيحبونى جدا ونفسهم ينزلة مصر عشان نتجوز يا اسافر لهم بس كل بنت ماتعرفش الثانية بس الصراحة انا كنت بحب وحدة فيهم وهي كمان بتحبنى من ساعة الي حصل باالاشاعات الي حصلت والكلام الي طلع علينا يوم الماتش وبعدة كلهم بعدو عنى عشان انا مصر الا البنت الي انا بحبها تعيط وتقولي انا بسمع كتير بس مش قدرة اصدق عشان انا مش عاوزة حاجة تبعدنا عن بعض وبصراحة انا وهي بنحب بعض من عن طريق النت ممكن تقولة علية مجنون اني احب من النت بس انا مرتاح للموضوع دة والصراحة لحد اليوم والحمد لللة مافيش اى مشاكل بنا ويارب مايكون فية مشاكل بين كل مصرى وجزائرى الي بيحصل دة حرااااااااااااا اااااااام ياجماعة دة ايد الي عملت كدة عشان توقع بين الشعبين بس الصراحة انا بحب مصر اوىىىىى وهي بتحب الجزائر اوىىىىى بس من غير مانعمل مشاكل مع بعض والصراحة يوم ماكسبنا بعتتلي رسائل مبروك وقبلتنى ع النت وفضلت تباركلي وقالتلي انا فرحانة انك فرحان بس كنت نفسى شعبي يفرح زيك وزي شعبك بس عمرنا ما غلطنا فى بعض عشان خاطر الكورة"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119040159/http://www.20at.com:80/masr/hot-topics/14076-2009-11-17-12-05-56.html"
