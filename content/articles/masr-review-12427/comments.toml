posted = "2009-06-22"
text = "لم نرى احد من القيادات السياسة تتصل فى الفريق بعد الهزيمة<br />شاطرين لما يحصل فوز يتكلموا علشان الناس تفتكرهم ولما ينهزم كلة يقفل بقة<br />دعاية يعنى وبروبجندا<br />هزيمة الفريق مسئولية سياسية اولا واخير<br />وزى ماهم بيقولوا انهم بيبقوا وراء الفوز يبقوا كمان وراء الهزيمة والا اية يا بتوع الاخبار والجمهورية والاهرام"
