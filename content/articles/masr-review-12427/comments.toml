author = "مستريح البال"
posted = "2009-06-21"
text = "فريق الساجدين كما يطلق عليه .. والذي رفع رؤسنا امام البرازيل وايطاليا اليوم كان مختلف كليا فمن شاهد المباراة وكيف كان لاعبو مصر يركضون في الملعب بتهالك وتثاقل يشك ان الخبر المتداول في الصحف الجنوب افريقية صحيح ثم مامصلحة هذه الصحف حتى تتناقل مثل هذه الاخبار وللمعلومية الصحف استقت الاخبار من محضر الشرطة يعني المسئلة رسمية تقريبا .. والغريب انه مانسرق الا المنتخب المصري وين بقية المنتخب ثم هل هذا الفندق يملك رجال امن .؟؟ لابد ان يكون هناك مسائلة لشحاتة وزاهر اولا فاليوم افتقدت مصر لميدو وزكي بسبب قرارات شحاته وعدم رضاه .."
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624030851/http://www.20at.com:80/masr/review/12427-2009-06-21-22-08-30.html"

