[[comments]]
order = 4
subject = ""
author = "لعبة الحكشة"
posted = "2009-06-22"
text = "امريكا مصنفة عالميا انها الدولة رقم 17 فى كرة القدم كترتيب<br />ومصر فى الترتيب العالمى مصنفة رقم 40 يعى مستوانا ال 40 عالميا فى الترتيب فى لعب كرة القدم<br />يبقى نحشر نفسنا وسط الكبار لية<br />الهند من الدول الكبرى وعارفة امكانيتها كويس وكرة القدم عندها ضعيفة لذلك ركزت على لعبة شعبية عندها اسمها الكركيت والهوكى وبياخدوا فيهم بطولات عالمية<br />وانا ارى اننا نسيب كرة القدم دى ونلعب لعبة شعبية خاصة بنا زى الهند<br />اية رايكم نلعب حكشة<br />ونجيب المعلم حسن شحاتة بالشومة بتاعتة يدرب تحطيب وحكشة ونلم شوية عيال صعايدة محترمين وفرقة المزمار البلدى وراجل راكب حصان بيرقص بية<br />صدقونى هنكسر الدنيا بالتحطيب وهناخد كاس العالم<br />وكمان ننظم لعبة رمى ودحرجة البلى لمسافات طويلة<br />عندنا مواهب<br />انما كرة قدم والرجالة 22 بيجروا وراء كرة واحدة - احد المسئولين العرب فى الستينات حضر مباراة كرة قدم ولاحظ الرجالة بيجروا فى الملعب بعزم جامد قوى فسال بدهشة هما بيجروا لية فقالوا لة علشان يحصلوا الكرة واللى يحصلها يلعب بيها فزعل الراجل خالص وامر باعطاء كل لعيب كرة مخصوصة لة يلعب بها ويبطل جرى<br />خليكوا فى الحكشة"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624030851/http://www.20at.com:80/masr/review/12427-2009-06-21-22-08-30.html"

[[comments]]
order = 5
subject = ""
author = "سؤال"
posted = "2009-06-22"
text = "لماذا لا تسافر زوجات السادة الاعبون بتوع الفريق مع ازواجهم الى الدول الخارجية حتى من ضمن المشجعين - نعم يشجعوا الفريق فى المدرجات ويشكموا ازواجهم ويقولوا لهم نحن هنا<br />فعلا هتفرق اية لما الزوجات يسافروا مع الفريق<br />محمد على حاكم مصر التركى كان عارف الشعب المصرى كويس - لما بعت بعثة طلبة لدراسة العلوم الى باريس ارسل معهم واعظ وخطيب وامام يراقبهم ويصلى بهم ويمنعهم من الانحراف اسمة رفاعة رافع الطهطاوى<br />اخبار الفضيحة الخلقية للفريق على صفحات العربية ومصراوى ووكالات الانباء"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624030851/http://www.20at.com:80/masr/review/12427-2009-06-21-22-08-30.html"

[[comments]]
order = 6
subject = ""
author = "جبنا الديب من ديلة"
posted = "2009-06-22"
text = "اخبار النهاردة بتقول ان الفريق امتنع عن التدريب لحين اعتذار الاستاذ عمرو اديب حيث انة اذاع ان الفريق اصطحب 5 عاهرات فى الفندق للاحتفال بالنصر على ايطاليا<br />ونحن لا مؤاخذة لا نظن بهم ظن السوء<br />ابدا<br />ولكن نحن نظن وبعض الظن اثم انهم كانوا يتدربون مع العاهرات على اصابة المرمى والتصويب على الهدف من التمانيات والمساكين من كثرة التدريب كانوا مش عارفين يفتحوا عيونهم اثناء المباراة وان ركبهم ملخلخة ونفسهم مقطوع - كتر تدريب بقى - انتم عايزين الرجالة يموتوا نفسهم اكتر من كدة<br />هذا وصرح مسئول رفيع او غليظ ان اجر العاهرات اقتطع من المعونة الامريكية لمصر<br />- وكل مباراة وانتم طيبون<br />يظهر ان فية ناس فى الشعب بتاعنا مخها مش فى راسها ولكن مخها فى راس حاجة تانية"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624030851/http://www.20at.com:80/masr/review/12427-2009-06-21-22-08-30.html"

