subject = "لاحول ولا قوة الا بالله"
author = "سعودي غيور"
posted = "2006-03-19"
text = "السلام عليكم<br />انا وجهة نظري وقد تكون سلبيه لدى البعض وايجابيه لدى البعض<br />لكن المفيد والمهم الذي اريد ان يصل الى اذهانكم<br />هو ان ماكتب او سوف يكتب لاحقا في مثل هذه المواضيع والجرأه هي غزو فكري من الغرب وعلاقات الغرب في مجتمعنا فلو تفحصنا من هي الكاتبه ومن اين هي شهادتها الدراسيه لوجدنا الدم الغربي في مسيرتها<br />لكن ماذا نفعل وماذا اقول غير كما يقال<br />باللهجة العاميه (الشكوى لله)"
