[[comments]]
order = 19
subject = "الشيخ عايض القرني"
author = "ناصر السهلي"
posted = "2006-01-20"
text = "السلام عليكم ورحمه الله وبركاته<br />فيه خبر انفردت به صحيفه الوفاق الاكترونيه.<br />يوم السبت غدا في جامع الملك خالد بالرياض.<br />سوف يقلي الشيخ محاضرة وسوف يتطرق لروايه رجاء الصانع.<br />ولكم الخبر منقول.<br />في حديث خص به (الوفاق) قال الشيخ عايض القرني أن محاضرته التي سيلقيها يوم غد السبت في جامع ا لملك خالد بأم الحمام بالرياض سوف يوجه من خلالها عشرة رسائل الأولى لولاة الأمر في السعودية والثانية للعلماء والثالثة لأهل التكفير والغلو والرابعة لمن يقدحون في ثوابت الأمة والخامسة لرجال الإعلام والسادسة للمرأة والسابعة للآباء والثامنة للشباب والتاسعة للعالم الآخر والعاشرة ستكون عن الحوار.<br />وفي سؤال لـ (الوفاق) عن ما خرج به الشيخ بعد فترة التأمل والمراجعة قال فضيلته \"لقد خرجت بفوائد كثيرة لعلها بإذن الله تعالى تظهر جلية في عملى الدعوي في الفترة القادمة ولعلي اذكر تفاصيل اكثر عن هذا الجانب في محاضرة يوم غد\"<br />وأضاف الشيخ عايض في حديثه لـ (الوفاق) قائلا \"أود ومن خلال صحيفة (الوفاق) أن اتقدم بخالص الشكر والتقدير لصاحب السمو الملكي الأمير سلمان بن عبدالعزيز أمير منطقة الرياض وإلى صاحب السمو الملكي الأمير محمد بن نايف مساعد وزير الداخلية للشئون الأمنية وإلى المسئولين وطلبة العلم والمواطنين \"<br />وكشف الشيخ عايض لـ (الوفاق) أن هناك قصيدة بعنوان (قرار الجماهير) سوف يلقيها غدا في المحاضرة وهي تتكون من خمسة وستين بيتا يقول في مقدمتها :<br />خذ يا صبا نجدفضلا وحي أفكاري<br />فنجد مرفأ ترحالي وإبحاري<br />لبيك (سلمان) إكراما لدعوتكم<br />وللمحبين من بدو وحضار<br />وسوف تنشر (الوفاق) القصيدة كاملة يوم غد ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

