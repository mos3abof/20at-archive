text = "يابنت الشرقيه شفيك انتي الظاهر فيك شي هلي تسبي في بنات الرياض ترا بناات الشرقيه حالهم حال بنات الرياض بل كل بنات السعوديه انا من المنطقه الشرقي شاب عمري 24 والبنات الصراحه بلاوي بس مو كل بنات السعوديه بعضهم وانتي تقولي بنات الرياض يكشفوون اصلا اغلب بنات الرياض العبايه على الراس ولابسين براقع لا تزيدي من عندك كلام بس رجاء بنت الصانع في روايتها ان البنات يعرفو انوااع الخموور يعني يارجااء بنات السعوديه في منهم زاحفين بس مو لدرجة يعرفو انوااع الخمووور ويابنت الشرقيه شفيك على اهل الرياض ترا والله طيبين ترا حتا بنات الشرقيه في مجمع الراشد وجياااااااان بلاااااوي بلاااااااااوي بلااااوي وترا اجرأ بنات في السعوديه بناات الشرقيه والله مره وحده رقمتني وانتي قاعده تسبي في الريااااض يا شيخه كلنا وطن واحد وحالنا واحد وحاال بنات السعوديه وشبابها حااال واحد مافي منطقه احسن من الثانيه مثلا شبااب الشرقيه يووم الخميس 95 بلميه منهم في البحرين حق المراقص والروسياات والخموور من كذا تشوفيهم مايغازلو كثير في السعوديه لأن البحرين قريبه بس شباااب الرياض مساكين والله البحرين بعيده عنهم مالهم الا المعاكساات<br />بس لحظهه حااب اعلق ترا البناات الزحف في السعوديه نسبتهم بنسبه العامه للبناات قليله جدا احنا اشوا بكثير من المجتمعات الأخرى بل احنا احسن مجتمع محافظ وانا درست برياااض 4 سنين والصراحه ماشووف فرق بينها وبين الشرقيه مثلا شبااب الريااض يحبون التفحيط حتا شبااب الشرقيه بعد تفحيط في هااف موون وهجوله وفي نظري انا ارى الخير في بنات الرياض والحيااء بس هلبلاوي هلي تشوفوها من زحمة السكاان وتوجد اجانب كثيره اخذو الجنسيه وسكنو برياض في الفتره لخيره فهمتو ويابنت الشرقيه ترا رجاااء بنت الصانع تقصد بناات السعوديه كلهم مو بس الرياض والدليل قالت هذا حال مجتمعنا السعوديه وترا في شخصية من شخصيات بنات الروايه لوحده من الشرقيه بس هي مغيره لسماء هي اخذت بنت من نجد وبنت من الشرقيه وبنت من الحجااز والرابعه مادري من وين ترا هذي مو شخصيات خياليه تراها حقيقه بس هي غيرت في الأسمااااااااء صدقوني عندي خبره كاااامله عن الموضووووع في تستهدف بنااات السعوديه كلهم وتبي الحريه وشيووع الفاااااااااحشه وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

[[comments]]
order = 90
subject = "المجتمع السعودي يختلف عن باقي المجتمعات الخليجية"
author = "بنت الرياااااااض"
posted = "2006-07-26"
text = "اول شي بوضح لكم ان رجاء اصلها مو سعوديه مادري من وين جايه هذي وانا بنت سعوديه اصيله ومن العاصمة الرياض ومن قبيلة الفضلي الي ترجع لفضل بن ربيعه الطائيه يعني المرجع الرئيسي لحاتم الطائي انا ماقول كذا تفاخرا ولكن احب ابين لكم ان اكثر السعودين لهم افضل الأصوول والشي الثاني الي ابي اوضحهه ان المجتمع السعودي يختلف عن كل المجتمعات الخليجيه الثانيه والعربيه فنحن افضل مجتمع متمسك بلعادات والتقاليد وديننا الحنيف ونفتخر بهذا كثيرا فهمتي يا بنت الكويت لا تربطي مجتمعا المجتمع السعودي بمجتمعكم انتو عندكم انفتااح كبير مرره وانا بنت من الرياض وعمري 22 والله صحيح اني سمعت عن بعض مشاكل عند البنات لكن ماتوصل الى درجت انهم يعرفو انوااع الخموور مثل ماكتبت رجااء بنت الصانع في روايتها او علاقاات شاذه وخرابيط صحيح في بنات منحرفات في المجتمع ولكن نسبتهم قليله جدا بنسبة البناات كلهم ويا اختي بنت الشرقيه ترا والله حراام عليك تسبي بناات الريااض ترا احنا بناات بلدك اعتبرينا مثل خواتك حراام عليك والله حنا نحب اهل الشرقيه كثيرر حتا في نهاية السبووع نجي عندكم وهذا تقوليه انكم تناحشو منا ليه والله زعلتيني وترا مو بس بناات الرياض فيهم ترا انا اجي الشرقيه واشووف في الكورنيش والمجمعاات بلاوي ترا كل بنات السعوديه حالهم وحده بس والله نسبة المنحرفاات قليله جدااا يعني يابنت الشرقيه ليه تسبي بنات الرياض تقولي حنا وصخين ترا كل السعودين يقربوون لبعض اكيد في حد يقرب لك من الرياض واحنا في ناس قرايب لنا من الشرقيه حراام عليك والله واحنا مو مغرورين بس انا احسس ان اهل الشرقيه عندهم عنصريه والعنصريه مرض والله مرض يا اهل الشرقيه كفاااااااااااااااايه عنصريه ترااا كلنا سعودييييييين ويااااا رجاااااااااااااااااء بنت الصانع الله يمهل ولا يهمل تذكري هلكلمه زين وانا والله العظيم ان ماعمري كلمت شااب في جواال او شي انا اعترف واقوول لكم انا شبااب السعوديه اغلبهم اللحين منحرفين الله يهدي شبابنا ورجاااااااااء علمااانيه وتبي شيووع الفاحشه في المجتمع ترااا والله مانبي لا سواااااااقه ولا حرييه ولا شي حنااا راااضين بلي يحكمووه ملوكنا ومحارمنا ورجااااااااالنا ولا نبي الأجانب تطفل علينا سواااااااء كانو خليجين او من بلاد عربيه اخرى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

