author = "سحابة"
posted = "2006-01-27"
text = "عارفين بجد..<br />الرواية أول مرة أسمع عنها قرأتها..<br />عجبتني جدا جدا جدا بشكل مش ممكن<br />أولا البنت دمها شربات وموهوبة جدا وفعلا واصفة الي بيحصل في الحياة بدقة شنيعة، وعلى فكرة هي كدة اتكلمت عن الناس المتساهلة جدا، في ناس أشنع من كدة بكتييييييير، كلنا عارفين الي بيحصل ده، وبالذات مجتمع البنات.. ياجماعة في حجات بتحصل اكتر من كدة في البيوت ومحدش عارف..<br />نفسي وحدة جريئة تكتب بنات جيزان، ولا وحدة تكتب بنات جدة وهتطلع هوايل..<br />لازم نعرف سلبيات مجتمعاتنا عشان نحلها، لازم صوت الشعب يوصل عشان المشاكل تتحل، والي مدايق ان القصيبي اعجب بكتابتها، ده مؤشر نجاح كبير اوي، لأن القصيبي قبل مايكون أديب كبير، هو وزير وليه شأنه في البلد، وده معناه إن صوت البنت دي وصل لناس هي مكنتش في حياتها تحلم انه يوصل لهم..<br />بجد بجد أنا بحييها جدا، قريت الرواية كلها مرة وحدة واستمتعت فعلا بيها، وبقولها متبطلش وتفضل تكتب، وربنا يوفقها يارب ويزيدها علم وبصيرة<br />مش أي حد ياجماعة يقدر يتكلم بالشجاعة دي في مجتمعنا ده، دي بطلة بمعنى الكلمة<br />صدقوني لما تقرو الرواية هتغيرو رأيكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

[[comments]]
order = 26
subject = "هذا هو الواقع المرير"
author = "الواقعي"
posted = "2006-01-27"
text = "لمذا نجري وراء الكاتبة ومعظم ماكتبته صحيح وواقعي وهذا هو الواقع المرير الذي يرفضه المجتمع من دون معرفة الخفايا المستورة من أجل الخوف من المجتمع وليس بالأحرى الخوف من الله سبحانه وتعالى فالذي كتب صحيح وبعزة الله إنه (طعنة في الظهر) ولكن ليس بالأحرى بأن نراجع سلوكيات أبنائنا وبناتنا ومراجعة أنفسنا أولا ..<br />لأن رب الأسرة من الظروري يكون القدوة لأهل البيت فحينما يكون فاسد فلا يلوم أبناءة حينما يجد الفساد منتشر بينهم.<br />بالأخير (إذا بليتوا فاستتروا)<br />فهذا مايجعلني لا أتفق مع الكاتبة أبدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

