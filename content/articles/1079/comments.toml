subject = "تحياتي الي رجاء الصانع"
author = "جالكسي"
posted = "2006-05-18"
text = "استغرب هذا الهجوم علي الكاتبة والرواية<br />فهي بكل صراحة قد ابدعت فيها من كل النو احي فمن يتكلم عن اسلوب الكاتبةالبسيط ينسي ان هذه لغتنا الحقيقية التي نمارسها يومينا وبالتالي لم تاتي رجاء الا باسلوبنا ولغتنا نحن فلما هذا الهجوم<br />اما موضوع الكاتبة واحداثها فهي لم تاتي الا باقل القليل فما يجب ان نكشف عنه ونتحدث به وخصوصاًعن حياة البنت السعودية وماتواجهه في ظل الفكر السائد والذي يفضحه هذا الهجوم علي الرواية الكثير الكثير .<br />ال سعود هم عزنا وتاج راسناوابو متعب حبيبنا ويخسي من يقول غيرهذا الكلام.<br />وتحياتي الي رجاء الصانع وننتظر جديدك ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

[[comments]]
order = 76
subject = "انا مع بنت الصانع"
author = "فهد هزازي"
posted = "2006-05-27"
text = "اول شي اخواني اخواتي يمكن الاخت رجاء معها حق ورويتها جدا واقعيه ..<br />انا بنسبه لي اعمل في احدى شركات الامن او كما يقال بالعاميه (( حارس امن )) الموقع عقارية العليا .. لذلك ياعزائي<br />قد اواجه دائماّمواقف لم يقولها لي احد<br />لا اشوفها بعيني اول شي التبرج يعني البنت ماصارت تحتشم تنزل من الفان اخر موديل لابسه برمودا وتي شيرت كت . . واول ماتدخل السوق تفتح العبايه ووترقيم وحركات والشباب يطارودونها وهي مسويه حليمه بولند .. جد مجتمعنا صار بامزق وين الشيمه وين العيب وين البنت اللي تخجل وين البنت اللي تستحي وين الاب وين الاخ اللي غافل عن بنته واختهوين الام اللي تربى بنتها وتعلمها العيب والشيمه<br />مو ناقصهم شي فلوس سواق بيت ام اخوان ملابس ماركات ليش ماتحمد ربها ليه تتبرج وتظهر مابداخل عباتها ولا بعد تصبغ شعرها ذهبي قدام خلق الله مسويه جنفر لوبيز لا اللي قهرني انها بنت قبايل ..<br />ياناس انا مع بنت الصانع وربي ها البنت ماقالت شي الا وهو يصير لا اللي يقهرني يرفعون عليها قضاياروحو الاسواق وشوفو بعيونكم شوفو بنات الرياض حقكم اللي تدافعون عنهم يمكن انا خرجت خارج الاطار وانا لي روايه حووول ها الاشياء بتصدر قريبا ومع الصووور عشان اثبت للعالم ولناس ولكم انتم ان مافيه حشمه ولاعيب واذا وجد يوجد في بنات الطبقه الفقيره اللي تربت على يد ابوها وامها موعلى يد شغاله ولا سواق ... لي عوده .. فهد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

