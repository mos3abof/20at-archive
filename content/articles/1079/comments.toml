author = "ليما"
posted = "2006-02-19"
text = "انا ما أشوف فيها شي انو الواحد يعبر عن رايه وبعدين ليه نكذب على انفسنا كل حاجه كتبتها فالروايه صحيحه وياما شفنا وسمعنا وهي مجرد انسانه نقلت الحقيقه المره واللي صار لنا سنين نحاول نتحاشها ونرفضها بس لازم نواجه هالحقيقه عشان نقدر نتخلص منها مو ننفيها ونقول انو احنا مانغلط والمشكله انو في ناس تهاجم مع انها متاكده انو هالمشاكل اللي طرحتها الأخت رجاء الصانع هي حقيقه وواقعيه لكن يغالطون انفسهم الى متى واحنا نحاول نتستر على افعال تسيئ لناوتحط من قدرنا لازم ياناس نواجها وبكل شجاعه ولو مره لازم نتحاور مو كل كلام مايعجبنا نتحاشهونرفض وبقوه ومو بس كذا حتى انو نتلفظى بألفاظ لاتنم الا عن شخصيه ضعيفه ومهزوزه ولازم نحترم اراء غيرنا .. وحتى لو الكلام ماعجبنا نحاول على الأقل نتحاورا مع الشخص نفسه خلونا ناس حضاريين وانو يكون عندنا حاجه اسمهااحترام الآراء وصدقوني لو كل شخص منا يحترم راي الغير حتى لوكان طفل صغير كان احنا بألف خير .. واعذروني لوكنت طولت عليكم ..."
