[[comments]]
order = 5
subject = "تكلم حتى اراك"
author = "البراء أشرف"
posted = "2006-01-03"
text = "قد تكون الرواية ليست على المستوى المطلوب من الناحية الأدبية..<br />ونختلف في ذلك أو نتفق إلا أن هذه النقطة ليست هي المهمة .<br />المهم انه هذه الفتاة الصغيرة كتبت..<br />مهم جدا أن يبدأ السعوديين في في الكتابة عن أفنسهم وفي الحديث عن مشكلاتهم وأفكارهم التي لا نعرف عنها شيء<br />ومهم جدا أن نقيم عمل الكاتبة باعتباره ابداع فردي..<br />ومهم جدا ان يكون رد الرافضين للافكار التي تحملها الرواية على هيئة رواية أخرى أو اي عمل فني يرد على السلبيات التي تراها الكاتبة في المجتمع السعودي.<br />الخطوة التالية للسعوديين هي التكلم..<br />وهي للأسف خطوة تأخرت كثيرا، ولا أدري إن كانوا ينون التكلم فعلا أم لا.<br />لكني على الأقل سأظل محتفظا بتحفظاتي على المجتمع السعودي طالما بقى مجهولا بالنسبة لي ولغيري.<br />لا اعترض على النقاب ولا عن منع المرأة من القيادة ولا من تجاوزات هيئة الأمر بالمعروف والنهي عن المنكر ولا عن الكبت ..<br />فقط اعترض على ان تبقى كل هذه الاشياء غير معروفة السبب.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

[[comments]]
order = 6
subject = "اين المشكلة؟"
author = "rehab"
posted = "2006-01-03"
text = "لقدولدت وعشت 17 عاما من عمري في السعوديةوربما استطيع انه يحدث العديد والعديد مما لايمكن تصوره بين الفتيات هناك مع العلم انني لم اقرا هذه الرواية وكنت دوما اعتقد ان المشكلة هي حالة الكبت الذي يعلنيها المجتمع السعودي وخاصة المراة واعتقد ان الرواية صرخة احتجاج برغم عدم رضاي قطعا عن الروايات المبتذلة فنحن نستطيع ان ننتقد اسوء السلبيات بشكل لا يخدش الحياء كما نرى في روايات د.نجيب الكيلاني ولاداعي لامثلة روايات عمارة يعقوبيان و امريكانلي حتى وان كنا ننقاش سلبيات مجتمعاتنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

[[comments]]
order = 7
subject = "قالوا"
author = "عن كوثر"
posted = "2006-01-04"
text = "وصلتني بنات الرياض, وعليها خط الكاتبة الجميل أيضا .<br />منذها, ومنذ الضجة الإعلامية التي خلفتها, وأنا أشعر بهزة عنيفة تكاد تقلب كل<br />طموحاتي ومستقبلي كمبدعة ( \"الكاتب\" يطلقونها على المنشور له, أما كاتب \"نُص كم \"<br />التائه في أروقة الإنترنت فقد تكرموا عليه بـ \" المبدع\" ).<br />الكل يفكر ببنات الرياض, أما مايشغلني فهو زمن مابعد \"بنات الرياض\" .<br />رجاء الصانع التي كتبت بالفصحى البسيطة/ لغة المسلسلات المدبلجة والمسنجر والإعلانات.<br />التي ركزت على شريحة الإرستقراطيات, هل ستسحب البساط من كتاب اللغة ( العيار الثقيل)<br />كتاب الحكمة والفلسفة والحياة ؟<br />هل سنتقبل كاتبة ـ بعدها ـ تهبط للأزقة وتصف الثقوب والرقع في ملابس الأطفال ؟<br />التساؤل الثاني:<br />جائتنا الحداثة, وشطبت الكلاسيكية برمزيتها وغموضها, ثم جائتنا أخرى ممشوقة أسمها \" مابعد الحداثة\" تلك اللغة السهلة الممتنعة, التي خففت من تركيز الرمز وأكدت جمال الفكرة حينما يسلط عليها قليل من ضوء الوضوح .<br />إن أسلوب رجاء لهو أسلوب سهل تتحدث فيه غالبية كاتبات المنتديات, فهل سينهال علينا كتاب فُتح لهم الباب لتغص دور النشر بهذا الأدب الجديد, الذي يجعل كتاب كليلى الجهني والفاران يفرشون البطالة ؟ أم أن \"رجاء عالم\" ستقوم بتخفيف لغتها, مثلما صنعت وردة الجزائرية من المغامرة بـ 12 عملية تجميل, وغناء \" بتونس بيك\" حتى تلائم \" مود العصر\"؟<br />هل سينصرف زبائن منصور العتيق إلى التجمع حول كتاب سينهجون منهج الصانع ؟<br />مالذي سيحل فيما بعد ؟<br />هل اعتماد الكاتبة على العامية المحليّة في بنية الحوار, وعذر النقاد الكبار لها بسبب صغر سنها أخطاء إملائية ونحوية مقابل ريادتها وكسر المألوف, ستشطب الفصحى, كما غزت العاميّة إعلانات الشوارع والتلفاز:<br />( فكّها, غمسها) أو ( مجلسها مع بيبسي) أو ( أنا أحبه / دعاية ماكدونالدز) .<br />وبهذا سنتوقع في الروايات القادمة ظمور العربية إلى أقصى حد, لا أستبعد أن تظهر رواية مكتوبة بالعامية من الجلدة إلى الجلدة !<br />وعيت ما أعجب النقاد في بنات الرياض الذي هو مختلف تماماعن ما أعجب العامة فيها,<br />هل نتوقع أعمال نتنهج بسماجة ماقامت به الكاتبة من عمل جميل, طلبا للشهرة.<br />كما حصل في عالم الكليب, حيث البدء كان جودة الأغنية مع حظور وجه جميل متلازمان , ثم تطور/ تدهور إلى غناء ردي وفتيات عاريات شرط نجاح الأغنية ؟<br />إلا يشغلكم زمن مابعد بنات الرياض؟<br />ألا يقلقكم مستقبنا الأدبي ؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

