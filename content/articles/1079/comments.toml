posted = "2006-05-07"
text = "لا استطيع الا ان اشد على اياديها البارعة التى رسمت وكتبت ولامست شغاف القلب ودخلت دون استئذان منا من كره دخولها ومنا من احبه .. رواية شكلت صدمة لمجتمع لطالما كان منغلقا على نفسه ومتكورا على ذاته .. رواية نفضت الغبار عن الوقائع التى لا تمس بنات الرياض ولا بنات السعودية فرغم خصوصية هذه الرواية الا انها تحكى بلسان حال كل شابة عربية بل وكل شاب عربي ..<br />لا املك الا ان اقول .. رائع.. سنوات مرت ولم تشدنى رواية وتبقينى مفتوح العين طيلة الليل مثل هذه الرواية ..<br />شكرا"
