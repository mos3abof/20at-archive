text = "ماظنكم بسفينة ربانها ال سعود ؟<br />انهاغارقة لا محالة .<br />وما في هذه الرواية ، ان هو الا ارهصات هذا الغرق .<br />والامر بيد عقلاء \"السعودية\": أما أن يجتثوا ال سعود ، فينجوا جميعا ، أو أنه الهلاك المحتم<br />اقرؤا : وتلك القرى أهلكناهم لما ظلموا ، وجعلنالمهلكهم موعدا"
