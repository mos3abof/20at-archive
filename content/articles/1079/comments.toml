text = "انا اشوف ان الكاتبه الشابه رجاء هى وحده من المجتمع السعودى هى لا تمثل المجتمع كله لكن هى موجودة بدخله وانها طرحت فكرة جذا مهمه فى المجتمع السعودى حتى يسطيع المجتمع التغلب على مثل هذه الخطاء واعطاء المراه السعوديه قدرها على اكمل وجه لانى وبكل صدج اشوف ان المراه السعوديه لبد ان تاخذ حقها فى المجتمع كما قال لله ورسوله"
