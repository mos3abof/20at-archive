subject = "هل نحن ملائكة؟"
author = "على فكرة انا قرأت الرواية ومن جد اجمل رواية سعودية قرأتها في حياتي لأنها تقول الحقيقه وطبعا اللي يشوف الحياة بمنظار اسود راح يذكر فقط سلبياتها اما االلي قرأها جد اثنى عليها وفيها ايجابيات كثيرة .."
posted = "2006-10-18"
text = "عالعموم الرواية تتحدث عن نفسها ونجحت نجاح مدوي رغم كل الانتقادات والا لما رأينا كاتبتها في برامج شهيرة مثل خليك في البيت مع زاهي- الحدث في ال بي سي وبرنامج اضاءات مع تركي الدخيل<br />وترى مهما تكتبون تذمون فيها مساكين انتو لأنها مش فاضية لكم لأنها تكمل دراستها بامريكا تخصص طب اسنان<br />واللي رد او ردت فوق يقول: يخسي كل من قراها!!<br />وهل هذا القول يشملك؟؟"
