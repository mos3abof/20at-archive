[[comments]]
order = 87
subject = "ليش الزعل من الحقيقة؟؟"
author = "بنت الشرقية- السعودية"
posted = "2006-07-10"
text = "أنا عاشرت بنات واجد من الرياض، منهم اللي جاو يدرسون بمدارس وكليات المنطقة الشرقية ولاحظت فيهم سلوك سيئ وفوق هذا فيهم غرور.. على ايش؟!.. ما أدري!!<br />بحكم احتكاكي ببنات الرياض أقول أن معظم اللي كتبته (رجاء الصانع) صحيح بنسبة 100%.<br />أنا أيضاً رحت للرياض مرة وكرهتها من اللي شفته هناك، مو بس بناتهم قليلات حياء وعندهم ميل وقابلية للانحراف.. شبابهم أيضاً وقح ومجنون ويتصرف بهمجية... واذا جاو أهل الرياض للشرقية ننحاش احنا للبحرين أو أي مكان ثاني لأنهم اذا جاو عندنا يعيثون في المنطقة فساد.. ترقيم وقلة حيا بالمجمعات ومطاردة البنات وإزعاجهم ولا أنسى القول أنهم يجون للشرقية عشان يدخلون البحرين من خلالها، وطبعاً هم يروحون البحرين عشان الشرب والسهر في المراقص والعاهرات من المغربيات والروسيات اللي محد قوم سوقهم في البحرين ودبي غير عيال الرياض!!<br />أما بنات الرياض اذا جاو للشرقية تشوف كل واحدة منها كاشفة أو شايلة الغطا كله عن راسها وتطلع متبرجة كأنها في باريس أو أمريكا! من الكبت اللي اهما فيه بالرياض!<br />وهالأشكال ما ينفع وياها الا الكبت والحكرة على طول لأن طبيعتهم وصخين واذا انفتح لهم مجال للحرية والانطلاق فقولوا على الدنيا السلام!<br />اللي كتبته الأخت (رجاء الصانع) في الرواية شي بسيط.. والله ما شفتوا عمايل بنات الرياض... وربي انكم مساكين ما تدرون عنهم.. قمة في الانحطاط!!!<br />واقول للي سب بنت (الصانع) لأنها مو قبيلية، يا أخي انت من أي عصر جاي؟<br />ياخي الجاهلية الأولى انتهت والإسلام يوم جاء حارب العصبية القبلية والتفاخر بالأنساب.. ترى كلنا عيال آدم وحواء.. بعدين احنا في عصر العولمة والعلم والتكنولوجيا، المفروض ما تكون عقليتك بهالشكل!!<br />كلنا بشر.. كلنا متشابهين.. كلنا من تراب وبنرجع للتراب.<br />أنا قبيلية ولكن لا أحكم على الآخرين مثلك.. بل أحكم عليهم بناء على عقلهم وطريقة تفكيرهم ومواهبهم وأساليبهم.<br />و(رجاء الصانع) لم تخطئ في وصف بنات الرياض... صح لسانها.. واحنا معاها على طول."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

[[comments]]
order = 88
subject = "الكويت"
author = "خالدة سعد"
posted = "2006-07-18"
text = "كيف تحقق الكثير من الnnn_ennمال من النت بطريقة سريعة وشرعية ( جربتها ونجحت )<br />بسم الله الرحمن الرحيم<br />من فضلك اقرأ المقال لآخره بعناية فستستفيد ان شاء الله<br />كيف تصبح ثرياً خلال أسابيع برأس مال قدره 6 دولار<br />عندى الطريقة السهله والناجحة ان شاء الله.<br />- بدأت مع هذه الطريقة عندما قابلت صديق لى ورأيت معه كمية كبيرة من<br />الدولارات وكانت كلها دولارات مفرده ( كل ورقه بدولار) فسألته كيف امتلك<br />كل هذا المال ، فاجابنى بالأتى :<br />كل ما عليك ان ترسل ( دولار واحد ) لكل عنوان من العناوين الموجوده<br />فى هذه المقالة ، وبعد ذلك تضع اسمك وعنوانك فى المكان السادس من<br />الأسماء ، وتنشر هذه المقاله على الأقل فى 200 مجموعة اخبارية news group<br />او مجموعات المناقشة Discussion groups او مجموعات الدردشة Chat groups<br />أو أى مكان من الممكن أن تنتشر فيه هذه المقالة على الانترنت ( وطبعا<br />هناك الاف من هذه المجموعات على الانترنت ) ، وبعد التفكير قليلا والتحدث<br />مع بعض الأصدقاء الذين قال لى معظمهم أن هذا كله ( نصب ) ، واجتاحنى احساس<br />يمكن ان تكون انت تشعر به الآن وهو ان العملية غير صحيحه ولكنى فى لحظة<br />فكرت وقلت : ماذا سأخسر ؟ كل ما ساتحمله 6 دولارات و 6 طوابع بريديه وبعض<br />الوقت لنشر هذه المقاله على الانترنت .<br />- ولكن خمن ماذا حدث ( ولك ان تصدق او لا تصدق ) :<br />فى خلال 7 ايام بدأت اتلقى خطابات بها الدولارات ، لقد صعقت أولا وقلت<br />انها ستنتهى فورا ، ولكنها بالعكس بدات تزداد ، فى الاسبوع الاول تلقيت<br />25 دولار ، فى نهاية الأسبوع الثانى جمعت تقريباً 1000 دولار فى الأسبوع<br />الثالث جمعت ( والحمد لله أولا) ما يقرب من 10000 دولار وما زالت تزداد.<br />انها والله تستحق ان تدفع فيها 6 دولار.<br />والآن دعنى اخبرك كيف يعمل هذا البرنامج ؟ والأهم لماذا يعمل<br />ان هذه الطريقة شرعيه legal مائة بالمائة وليس بهل اى شىء غير قانونى<br />ولك ان تسأل فى هذا.<br />من فضلك لاحظ :<br />- اتبع التعليمات التى سأذكرها هنا بدقه وستجمع ان شاء الله<br />أكثر من 30000 ( ثلاثون ألف دور) فى خلال 20 الى 60 يوم .<br />- هذا البرنامج يظل ناجحا بسبب أمانة وصدق المشاركين فيه .<br />هذه هى أربع خطوات سهلة لكى تبدأ فى جمع المال ان شاء الله :<br />- الخطوة الأولى :<br />- احضر 6 ورقات منفصله وأكتب هذه الجملة فى كل ورقه :<br />PLEASE PUT ME ON YOUR MAILING LIST<br />وتحتها أسمك وعنوانك.<br />واحضر 6 دولارات وضع كل دولار بداخل كل ورقة ( استعمل ورق غامق<br />اللون واثنى كل ورقة وضع بداخلها الدولار حتى لا يظهر فى المظروف<br />ويسرق فى البريد) ، والان ضع كل ورقه بداخل مظروف واغلق المظروف.<br />والأن أكتب على كل مظروف واحداً من العناوين التالية :<br />1) sami Abdulrahman<br />saudi arabia<br />Buraidah p.o.Box 1505<br />2) Abdulrahman Elsayed Eid Elsahy<br />p.o.Box 26459 U.A.E , Abudhabi<br />3) AYSANS AALiAne<br />P.B 1005<br />Laayoune 70000<br />Maroc<br />4) khaled elsyed sharabas<br />EL-SHARK District<br />Post Code: 42511<br />Post office BOX : 854<br />Port Said<br />Egypt<br />5) nour adam<br />Omar Almktar St. P.O.Box 1564<br />Benghazi – Libya<br />6) KHALIDA SAAD ALSHALEH<br />BOX.32809. Post Code NO. 25559<br />KUWAIT<br />- الخطوة الثانية : بعد ان تكتب الأسماء الستة السابقة على المظاريف<br />امسح الاسم رقم (1) من هذه القائمة ، وحرك الأسماء الباقية كل اسم لأعلى<br />خطوة ( رقم 2 يصبح رقم 1 ورقم 3 يصبح رقم 2 وهكذا)<br />وبذلك يصبح رقم 6 فارغاً ، أكتب فيه اسمك وعنوانك .<br />- الخطوة الثالثة :<br />- (رجاءا لا تغير شيئاً من هذه المقالة حتى يستفيد منها الناس جميعاً<br />ان شاء الله) ، وبعد ذلك أنشر هذه المقاله على الأقل فى 200 مجموعة<br />مجموعة اخبارية news groups او مجموعات مناقشة discussion groups<br />او مجموعات دردشة chat او اى مكان يمكن ان تنتشر فيه، وتذكر<br />انها كلما تنشرها أكثر كلما تلقيت مالاً أكثر وأسرع .<br />و تذكر يا أخى ان هذا البرنامج يظل ناجحا بفضل أمانة وصدق المشاركين<br />فيه .<br />- وسيستمر المال يأتى اليك وهكذا وحتى يصبح أسمك رقم (1) فى القائمة<br />ستجد نفسك تتلقى الاف من الدولارات ( من الممكن ان تحتاج الى انشاء<br />صندوق بريدى خاص بك لتتلقى عدد الخطابات الهائل الذى ستتلقاه ) .<br />كيف تنشر هذه المقالة فى المجموعات الأخبارية ومجموعات الدردشة :<br />انت لا تحتاج لاعادة كتابة هذه المقاله فقط ضع مؤشر الماوس على بداية المقالة<br />واسحب حتى تصل لآخرها ، ثم اختار copy من قائمة edit هذا سوف ينسخ المقاله<br />فى الذاكرة.<br />- افتح برنامج المفكرة note pad او اى برنامج تحرير نصوص وضع المؤشر فى<br />بداية الصفحة ثم اختار paste من قائمة edit . هذا سوف يلصق نسخة من<br />المقالة فى البرنامج ، ثم بعد ذلك يمكنك ان تضع اسمك فى المكان رقم (6)<br />كما شرحنا، ثم احفظ الملف .<br />- استخدم متصفح الانترنت الخاص بك لتبحث search عن مواقع المجموعات الاخبارية<br />news groups او مواقع الدردشة chat او ما يسمى Forums التى يوجد بها مشاركات<br />القراء وابعثها لكل أصدقائك وحفزهم لقرائتها.<br />فى مواقع Forums او الـ messege Boards اختار New messege ثم حدد هذه المقالة<br />من الملف ( بعد تعديل اسمك طبعاً) والصقها واختار لها subject جيدة ، ثم اختار<br />post messege ، وتذكر تذكر تذكر كلما نشرتها أكثر كلما جاءك دولارات $$$ أكثر.<br />أخى انه الوقت لكى تصنع بعض المال بأسهل طريقة سوف تراها ،<br />وهذا البرنامج اثبت لى اننى كنت خاطئا عندما فكرت بأنه غير حقيقى<br />وأذكرك دائما ان كل ما ستتحمله هو 6 دولارات و 6 طوابع وبعض الوقت<br />لنشر هذه المقالة.<br />تذكر تذكر تذكر :أشترك فى هذا البرنامج بأمانة وصدق وسوف ينجح ولا تحاول<br />ان تخدع أحدا لأنك ان فعلت سيفكر الأخرون فى خداعك<br />والله الموفق"
