[[comments]]
order = 21
subject = "ليس هذا بحل !!"
author = "ابو سعد"
posted = "2006-01-23"
text = "إن هذا النوع من المشاكل تصنف من المشاكل الإجتماعية ... وطرحها دون إرادة الحل .. هذا امر خاطئ .. والدليل على ان الكاتبة لا تريد الحل .. او لم تفكر فيه حتى ..<br />حيث انها حددت شريحة معينة وهي .. الرياض<br />ثم حددت طبقة مخصصة وعليها يدور الموضوع وهم .. الأغنياء ..<br />لكن من ادراك أن الفقراء ليس عندهم هذه العلاقات ولماذا تحددين الرياض بالذت مع انه يوجد في بعض المناطق في المملكة تتواجد فيها عوائل الأغنياء اكثر من الرياض ... ما هذه إلا فضيحة وكلام لتههيج الشهوات واستفزاز للغرائز والميولات ..<br />وقد تقع بأن تعلم البنات الحب والغزل .. والعشق والغرام ..<br />إن عرضك للموضوع دوون تطرق لحل او اسلوب يدل على جودة في استخراج الفضائح ..<br />انا ممن يؤمن ان المجتمع ليس له اسرار او فضائح وإنما الأسرار والفضائح للأفراد<br />لأن المجتمع كلمة واسعة لا تتمثل في شخصية واحدة .. او طبقة واحدة<br />بل أن من عوائل الرياض الغنية الفاحشة في الغناء .. من يعف له العففاف بعفتهن..<br />وإن كان الوصف مبالغ .. ولكن هذا من اسلوبك في كل الرواية ..<br />وإذا نظرنا إلى النتيجة .<br />امنه لم يوزع في المملكة .. بل يباع في غير المملكة ..<br />يعني اصبح من هم خارج البلاد يعرفون عن مجتمعنا .. اكثر ممانعرف .. هذا إذا آمنا بأن الرياض وبناتهم كما تقولين ..<br />في آخر مشاركتي ... لا أقول إلا افيدي الناس بما تعلمتي ..<br />من تمريض اسنان الناس ..<br />الداعي لا يدعوا إلا البالحق ....<br />وشكراً .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

