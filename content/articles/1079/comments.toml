author = "العنووووووووود"
posted = "2006-01-19"
text = "انـــامن بنات الرياض والله لم اسمع او أعاصراو اماشي هذهي القصه الكاذبه واعيش بالرياض من صغر سني حتي وصول عمري الان 30بالرغم تدرجي بالمراحلات الدراسي من الابتدئي حتي التحرج من الجامعه ومصادقتي سواء لبنات الطبقع الغنيه او الفقيره وليعلم الجميع اننا جميعآ بالشعب السعودي لدينا تقاليد وعادات وديينا الاسلامي وخوفآ من الفضيحه جلب العار لها ولشرف اسرتنا تمنعنا من القيام بما وصفته وانا اسميها (العلمانيه) الصانع اولا الكل يعرف بالمملكه منين جائة( قبيلـــة الصـــــانع ) والكل يعلم مـــاهي عادتهم الصوانع وهم اذا اتاهم الضيـــف لايستقبله الرجال بل ترحب به المــــــراءه وانهم جميعا ليس باسعودييييين وكل سعودي يعرف هذا الكلام ولذا قامة الصانعــــه بنت الصانع بتغطيـــة فضائحهم المشيته بالاصاق التهم ببنات الاصل والفصل كذبتي وانتي قبل مده تطالبين بقيادة المراءه للسياره خسيتي اولآ من متي والسعوديين والسعوديات يمشين مع اي من الصانع هذا عيب ونقص والله لو يعلم اهلي ومجتمعنا السعودي انني صادقة صانعه ليعتبروني حثاله بمجتمعنا ايام دراستي بالجامعه كانت طالبه اخر اسمها الصامع والله لم اشاهد احدآ يجالسها او يمشي او حتي يتكلم معها وكل ملسئل البنات اقول مسكينه يقلن لا هذهي صانعه يعني من الصنع .. وكيف بالكاتبه الصانعه اصبحة صديقه لؤليك البنات ويمكن الطالبات قبل السنتين يعرفن ذلك ذلك من اي , انني بنت من بنات الرياض بنت من بنات الاصل وليس من مخلفات الحجاج والصنع اطالب الدوله المسئولين من ابقاف مهاترات السخيفات من الصانع وجلبها واثبات ماتقوله عبر الانترنت ورمي المحصنات بكلام واحضار صديقاتها التي تقول عنهن وانني احلف قالله انها لتصبح كاذبه وياليتني رجل ومسئول بالدوله لم اترك الصنع الديوثيين باي وطن عربي علما ان قبيلة الصنع منتشره بجميع دول الخليج ولكن بالسعوديه اكثر وذلك راجع لعطف السعودددددين عليهم وحنه بحالتهم وهذهي اخرتها تتهم منهن اشرف واحصن منها ( اينكم يارجال الشهامه اين انتم يارجل الاصل اينكم ياعصابة الراس وعزوتي لا اعتزية باهلي وناسب وربعي وشعبي السعودي هايم الطالات من تدنيس بناتكم و عاركم من بنت الصوانع التي لاتعلم من ابيها الاتعرفوا قصدها لتصور للمجتمع ان بنات القبائل والمسئولين اخس من نساء وبنات الصوانع ومسح ماضيهم وحاضرهم ( يابنت الصنــــع) اتعرف من حضنك السعوديين حينا طردك اكثر دول الخليج والعرب لينالوا الاجروالثواب من الله وعلي قول المثل علمته الرمايه والما اشتد ساعده رماني . وبطريقتك اعلمي وتأكدي ان المجتمع عارف وفاهم قصدك ونوياك السئه واذا تحولن بنات السعودين الي الصانع او الصنع يفعلن ذلك واكثر ولذي يقول بنات الرياض كشف المستور لا بل كشفة مستور الصنع بالخيام والصحراء 0000"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

[[comments]]
order = 17
subject = "رســــــــــــــــــــــالة من عتـــــــــــــــــــــــــابه"
author = "شبـــــــــاب مسلط العتيبــــــــــــــــي"
posted = "2006-01-19"
text = "نيابه عن فبيلة عتابه اتقدم انا المواطن شـــــــــــــــباب مسلط العتيبي وصاله عن خامسي . اننا نتقـــدم لصاحب السمو الملكي امير الرياض لقد قمت ولازلة باذل قصاري جهدك بمتابعة جميع مايحدث بالرياض ولقد لوحظ هذهي الايــــام كثرة المشاكل بالرياض مثل مشكلة النفق وها لايام نعيش ونعايش مقال كتبتيه تقريبآ الكاسحه وليس بالكاتبه رجــاء الصانع ومثل ماقرئة بمقال بنت الرياض ( الصانع منين اتـــــاء الجيع يعرف انه صلبي ) وهذي الحقيقه واحب ازيد علي تعليق الاخة بوصف دقيق واواضح ( يقال ببعض الدول والمتواجدين لجميع من ينتسب الي الصانع انه كالحيوان لايفرق بين اخة او ام ويري اخته مع محرم وذلك بوجود جميع ماتحمل كلمة ديوث ) اكرمكم الله وهذي تحب تدنس عرضنا وأشرف واغلي شي لدي المسلم وهذي في الحقيقه انهم ليسوا بسعودددييين صاحب السمو هذي تعبر من الحاقدات والصانعة لك مايعكر صفوة وامن دولتنا بل وربما انها مدفوعه من الميعارضين للسعودين وحكومتهم لماذ ماتقدمة بدراستها الفاشله الي العلماء والشيوخ لحلخا انني اقدر احلف انه لكذبة وفترة علي بناتنا الطاهرات قرائة مقال لااحد الاشخاص واعجبني يقول انتي يارجاء عاشتي بالدول الغربيه ولم تاتي السعوديه الي قبل كم شهر ومتي هذا الوقت في عمل دراستك والم تعيش بديار الفسق والسفور ووالنزنا وبلد الكفر تجي الي بلادنا الطاهره وتنتقديها اميــــير الريــــاض املانــــا جميعا بوضع حدأ لمثل السافله وليس الكاتبه لا الرجل المسلم ولو توفي دون عرضه فهو شهيد لدفاعه عن عرضه ولا سوف يحدث ما لا تحمد عقباه بهذي وبغيرها يحاول ذلك وعلمآ انها تقريبا لم تشهر ببمقالها وحده بعينها مثل ذكرها لاسماء البنات كامله بل ذكرة اسم البنت ولقبها او الكنيه وانني وانني بكل اســـاء اقول اين القبائل التي ذكرتها السامجه ايعني بناتهم ذلك والله لن يلمكم احد بل الشد والعون لكم لو قمتم ولوذبحتم سوي رجل اوقبيله او امرئه من يمس عرضكم لن يلومنكم ابدآ بعملكم هذا وايضــــآ ذكرها ان البنات تلك من بنات المسئولين والطبقه الراقيه كذبة اين انتم ايه المسئولن وانت ياأمر الريـــاض واحدآ من المسئولين / واحب ارد علي بعض المقالة بشان هذا الموضوع يقول احد الاشخص انا عشة بالسعوديه واتوقع يعملوها بنات السعودييين لان المراءه مكبوده بالسعوديه . اتحب المراءه لدينا تعمل مثلكم اتجاه السواح لكم لغرض النوم مع اختك وغيره لا بناتنا من سلآلة اهل الدين والعلم والرجوله والكرامه خسي من كان ي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

