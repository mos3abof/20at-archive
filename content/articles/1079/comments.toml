posted = "2006-01-19"
text = "اولا من المستحيل انا ان تكون صديقتهم الصانع تماشيهم وتفشب سرهم بين عشيه وضحاها بعتقادي الشخصي انها اما فعلآ صديقهع لهم وصار خلاف بينهن وقامة بالافتراء علي صديقاتها او القصه من باب الفتراء المزيف من باب الحقد علي الشعب السعودي وقامة بالتمثيل الكاذي والتصوير الكاذب 0000 واحب اقل للكاتبه المحترمه المراء من جليسه واذا هذا الذي ادليتي به حقيقي وانكي مثلهن تفعلين مثل مافعلن وادعوا من الله العلي القدير ان يصلحك الي طريق الصواب وارجعي لربك واستغفري انه تواب رحيم 000000"
