[[comments]]
order = 51
subject = "الخوض في اعراض الغافلات"
author = "dr.agats"
posted = "2006-03-20"
text = "السلام عليكم زاخواني واخواتي في الله<br />انا طبيب مصري زقد قرات هذه الرواية الضعيفة في كل شئواعتقد ان الاخت هداها الله تحكي لنا قصة حقيقية عن بعض البنات في بعض المجتمعات العربية وهي اعتقد انها احدي هولاء الفتيات واعتقد ان هذا الامر وارد الحدوث ولا يحتاج لهذه الضجة حيث ان في المجتمع الاسلامي الاول كان هناك ضعاف الايمان والدين ولا يمكن ان نصف بنات العفة والخدور ونساء المملكة العفيفات بهذه التهم السيئة حيث يوجد في كل بلاد المسلمين تلك النماذج ونعم نحن في مصر نشاهد هولاء البنات الخليجيات اللوات ياتين الي بلادنا بغية الانحلال والتحرر من العفة ولكن هل هذا دليل علي عموم الامر نحن نفهم هذا جيدا وعندما نراهم نقول لا حول والا قوة الا بالله<br />هدانا الله واياكم وهدي الاخت التي نرجو من الله ان يغفر لها وتتبرا مما نسبته لذوات الخدور"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

