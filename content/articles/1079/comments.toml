subject = "يا مسلمين أتقوا الله"
author = "بنت بلاد الحرمين"
posted = "2006-04-07"
text = "أولاً/ يا مسلمين يا أمة محمد كفاكم البغض والشماته في بعضكم والغمز واللمز<br />مصري يسب سعودي وسعودي يسب مصري إلى متى البعض منكم يكون أداة هدم ووسيلة للبغض<br />والله أن نهايتنا قبر وحساب فتذكروا هادم اللذات<br />ما دمنا مسلمين موحدين فلنحب بعضنا وننسى الجنسيات البغيضة التي فرقتنا.<br />ثانياً/ كل من قال أننا في بلاد الحرمين في كبت سيكون خصيمي يوم القيامة فأني والله حزينه على الحرية التي أعطيت للمرأة هنا وأخرجتهامن عفافها وجعلتها مختلطة بالرجال فتقولون أنها في كبت يا دعاة الحرية أي كبت!! والله أن ما يحدث لأي فتاة من علاقات محرمه في أي مكان سببه ضعف الوازع الديني وقلة رقابة الأهل وعدم أتخاذ بعض بنات حواء الصحابيات قدوة لهن<br />فلا حول ولا قوة ألا بالله.<br />ثالثاً/أما بنت الصانع فأقول لها أتقي الله في نفسك وقذفك لكل بنات الرياض وأتقي الله في نفسك وتبرجك وأستري نفسك قبل أن يستركِ الكفن والتراب."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

