text = "نحن اليعروبيون تعودنا دائما على مهاجمه المدعين فلا مجتمعاتنا تحت شعار فارغ اسمه غلب بستيره ولا غلب بفضيخه والشعارات المتخلفه كثيره -------لتسمح لى الكاتبه ان ادعوه لمواصله الابداع وكشف المستور فلا يجب على العربى والعربيه ان تعيش كالعمله بوجهين وهذا اعتبره نقد جريىء وضرورى وان كلف ثمن باهظ احيانا ولكنلا بد من شرف المحاوله فالى الامام دعاء وان لم اطلع على تفاصيل الروايه لا ان ذلك لا يعفى من انضمامى لمؤازره الكاتبه ودعوتها للاستمرار والى الامام"
