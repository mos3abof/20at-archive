posted = "2006-03-23"
text = "لقد قرأت القصه كامله ولم امنع نفسي من ان اكملها في ليلة واحده، اسلوب شيق وحوارات شيقه ومواضيع شتى تناقش. اعتقد ان الكاتبه لم تجرم او ترتكب اثماً حينما توصف واقع مجتمعاتنا.<br />عزيزتي رجاء الصانع ان في حياتي من هن قمرة وميشيل وسديم ولميس وفي حياتهن من هم فيصل ووليد وفراس. لكن مجتمعنا يأبى الا ان يجمل الحقائق.<br />ان كانت الحقيقة تجعل من رجاء آثمه فكلنا آثمين"
