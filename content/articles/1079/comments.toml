subject = "اسخف من هالروايه مافيه"
author = "ليــــــــــــــان"
posted = "2006-03-24"
text = "يالي تتسمين بنت السعوديه مافيه اسخف ولا اوطئ من روايتك السخيفه لما بتكتبي روايتك لاتكتبي عن بنات بلدك الي يسوونك والكل عارف انك مخليه العنوان ( بنات الرياض ) لتلفتين الانتباااااااااه<br />اذا انتي كاتبه واشك والله اكتبي روايات نعتز فيها معشر السعوديين مو تكتبين تسبين بنات بلدك بنات بو متعب<br />لكن والله حسافه اني تعبت عمري وقريت هالروايه السخيفه وضيعت وقتي<br />ونتمنى انك توقفي كتابات لاننا نشك بعد كم شهر تطلعين روايه بنات القصيم او بنات الخبر وجده وغيرهم<br />بس والله حسافه ان الكل معطيك وجه وحبيت اقولك انك اشتهرتي بس اشتهرتي بان اسخف روايه والكل متفق عليها وابشرك بان الاطفال حتى متفقين بان اسخف اسخف روايه قراوها للان روايتك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

[[comments]]
order = 57
