author = "الــــــــــوافــــــــــي"
posted = "2006-03-30"
text = "السلام عليكم ورحمةالله وبركاته<br />انني قرات الروايه كلها التي كتبت الشابه دعاء الرياض وكذالك انا اشكرها<br />على ما قدمت في هذاالموقع الجميل من كلام<br />طيب وارجوان الكل ينتبه على نفسه من اصحاب الحرام وكذالك ارجو من ان يثبت<br />قلب الكل منكم يا اخواني ويا خواتي<br />ويهديكم على طاععته امين يارب وكذالك<br />الله يوفق الكل من الشباب وكذالك الكل من البنات وكذالك اللي يبي اي سوال ارجو من الله ثم مه الاتصال على 0504271807<br />وشكرالكم جزيل الشكر والتقدير<br />تحياتي للجميع بلخير اخوكم الــوافي؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

