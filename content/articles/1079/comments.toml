[[comments]]
order = 85
subject = "شباب الرياض"
author = "حمودي"
posted = "2006-07-01"
text = "لا اجد اي خلل في رواية الدكتورة رجاء ، ربما كان لديها قليل من الجرأة لطرحها<br />بالطريقة التي استطاعت فيها ان تجذب القارئ بمجرد رؤيته لعنوانها ..<br />استطاعت ان تُحضر معظم النقاد والأدباء كبيرهم قبل صغيرهم للمشاركة برأيهم بغض النظر عن مستوى الرواية الأدبي<br />ولعلمهم واقتناعهم بأنها تروي احداث واقعية لفئة معينة من المجتمع ان لم تكن الغالبية<br />ربما البعض غاضب من الرواية لأنها لم تكن اكثر صراحة فمن يجادل في مصداقيتها لابد انه مصاب بشيء من التطرف الفكري<br />او يظن ان مجتمعه لازال يعيش سالف عصوره وكما يريده<br />او يرى ان الكاتبة تطاولت على ملائكة وليس بشر يعيشون معنا<br />ونرى بمدينتها ما هو ادهى وأمر مما قرأناه في بنات الرياض!<br />سلامي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

