text = "حسبي الله على اللي يا بنات الرياض=حطم شعور قلب وسيّل دمـوع عيـن<br />ضاع تالي زمنّا عـز منبـر عكـاظ=بعد ما طال برجه كل غـث وسميـن<br />وللاديبه رجاء الصانع لدينا إعتراض=إعتـراضٍ شديـد وزبدتـه جملتيـن<br />كيف تكتب عن العفه ولون البيـاض=وفاقد الشئ ما يعطيه لو هـو ذهيـن<br />يا رجاء الصانع التعبير والشعر فاض=و فالروايه كلام الصـدق لازم يبيـن<br />ويابنات الجزيره يـا ورود الريـاض=يا شقائق رجـال العـز دنيـا وديـن<br />يا حلا البارق اللي في دجى الليل ناض=يا لباس العفاف ويـا جمـال الثميـن<br />يا شموخ المناير هاجس القلب هاض=ولا بقى دون مسك الحلق غير اليدين<br />انتن الستر كلـه يـا ورود الفيـاض=ولا تهـم العفيفـه بلبلـة حاقـديـن<br />وياحجابٍ ستر فيه السـواد البيـاض=جعل من نال سترك يتبـع الصالحيـن<br />ويا عسى اللي يشذ يصيبه الإنقـراض=قولوا آمين .. ثم آمين يا .. مسلمين ["
