text = "الاخت رجاء حاولت تقريب المسافه من خلال روياتها بنات الرياض بينهم وبين شباب الرياض او المملكه عامه فكون ولد يكلم بنت جريمه وكمان عقول الشبا وعيونهم ماتشوف البنت الا بنظرة واحد وهي النزوة ولكن ماتخذ حقها في الحب والامان من ناحيه الشريك او الرجل لذا فالبنت تعامل الرجل على انه ذئب حتى لو كان ملاك وديع. عموما تحيه من القلب للكاتبه والله يعز بلادنا ويحفظها."
