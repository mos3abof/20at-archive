text = "هذه الرواية تسيء بشكل مباشر الى بنات السعودية وبشكلا غير مباشر لبنات الدول الاسلامية حيث انه ليس من عاداتنا وتقاليدنا مثل هذه التصرفات التي ذكرتها الكاتبة وانما لها اهداف ابعد من ذلك بحيث تقوم بنشر هذه الافكار الغربية التي يمليها الغرب بحيث تؤثر في سلوكيات شبابنا وشابتن. لذا فانني احذر الشباب من التأثر بهذه الروايات التي لا تمت للاسلام باي صفة تذكر<br />وشكرا"
