subject = "لا حول و لا قوة إلا بالله"
author = "أحموش"
posted = "2006-01-21"
text = "بسم الله الرحمن الرحيم<br />إسمي احمد من الاردن, انا بشخصي لم أقرا الروايا و لن أقرأها و لن ادنس يدي و عيوني و فكري بمثل هذه الكلام.<br />فقد علق من علق و انتقد من انتقد, و لكن حسبي الله و نعم الوكيل أسال الله العلي اقدير ان ينزل بهؤلاء اشد العذاب بعلمهم و سلطاتهم و من جهتي سوف اخاصمهم عند الله يوم يلتقي الخصوم بإيذائهم اخواتنا في الله العفيفات الكريمات لشمول الروايه عن جميع بنات الرياض."
