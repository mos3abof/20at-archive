[[comments]]
order = 9
subject = "كل واحد عايز الشهرة قام وشهّر بمجتمعه"
author = "عبدالله"
posted = "2006-01-12"
text = "إيه الحكاية بالضبط ؟ نحن كقراء يجب أن نقف وقفة هنا ... يعني كل واحد أو واحدة عايز الشهرة قام وفضح بعض السلوكيات السلبية المحدودة في مجتمعه وقال دي الحقيقة اللي في مجتمعي علشان يبيع قصصه ... ومن رجاء الصانع علشان تتهم بنات الرياض بهذه التهم وهم بالملايين ؟ فين الدراسة اللي عملتها رجاء الصانع اللي تثبت كلامها عن بنات الرياض ؟ فين الإحصائيات اللي عملتها رجاء الصانع اللي تثبت ما في كتابها عن بنات الرياض ؟ اللي قالته هو رأيها الشخصي بحدوده الضيقة لا يمثل بنات الرياض ولا بنات القاهرة .. وليه الست رجاء لم تتكلم عن بنات الرياض العفيفات والقائمات الصائمات المصليات والمزكيات المتصدقات وهن كثير كثير كثير ... ليه بس الكلام عن الكام بنت اللي ربنا يهديهم ... أنا سهل عليّ جدا أن أكتب كتاب ويسب وألعن وأشّهّر وأفضح فيه بنات بلدنا علشان يتباع الكتاب ... والسؤال: أين الدراسة والأبحاث التي قامت بها رجاء الصانع اللي تثبت ما قالته عن بنات الرياض؟<br />أنا عشت في أميريكا سنين طويلة هو فيه أحشم وأستر من بناتنا وحجاب بناتنا وأخلاق بناتنا وعفة بناتنا وخوفهم من ربناشوفوا بنات مصر وحجابهم وعفتهم وأدبهم وأخلاقهم العالية ربنا يزيدهم ويحفظ بنات الرياض وبنات الأمة الإسلامية وبلاش كل يوم يطلعنا مؤلف علشان يلف دماغنا ببعض الفضايح التي قد تمثل البيئة اللي هو عاش وتربي فيها وعايز يتكلم عنها كأنها واقعنا احنا ... لا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

