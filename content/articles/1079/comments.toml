subject = "بدايه سئيه"
author = "فتاه سعوديه"
posted = "2006-01-26"
text = "اظن ان الكاتبه اظهرت صوره خاطئه عن المراه السعوديه في الوقت الذي تشن فيه الكتب والصحف والمجلات حملات من الغرب ضد المراه السلمه والسعوديه على الخصوص فلو انها سلطة الضوء على شئ اعمق وافضل عن الراه السعوديه العامله او الطموحه لغرض اسمى مماسردة من فضائح لفئه ضييله من مجتمع السعودي والذي فيه من البنات الطموحات لغرض اظن ان الهاويه هي احدى الطموحات ولكن بدات بدايه خاطئه ويمكنها ان تتلافا هذا الامر الا اذا كانت في اصولها ليست سعودية وهدفها غامضه"
