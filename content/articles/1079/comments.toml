subject = "امر غريب"
author = "سعودي ناجح"
posted = "2006-01-19"
text = "يقولون والا ما يقولون<br />عموما غريب امر هذه الرواية<br />رغم ان هناك الكثير من القصص<br />المشاببهة لها في الانترنت<br />ولكنها لم تنشهر مثل ما انشهرت هذه الرواية<br />هل لان هناك علاقة بين الكاتبة وغازي القصيبي<br />احتمال<br />فالاثنين يدعون للعلمانية"
archived = "2006-11-02"
