subject = "بنات الرياض واقع"
author = "نوره"
posted = "2006-01-19"
text = "بنات البرياض كما قراتها صوره من الصور الموجوده في مجتمعاتنا الخليجيه والعربيه باستثناء بعض المجتمعات العربيه المفتوحه نتائج الكبت الاجتماعي للمراه<br />جميع مجتمعاتنا بها صور لسديم ومشاعل والباقيات وشبابنا صور لفيصل وغيره من الذكوره<br />واباؤنا صور لوالد فيصل وغيره<br />لماذا ندفن رؤوسنا بالرمال وكلنا يعلم بهذه الحقائق"
archived = "2006-11-02"
