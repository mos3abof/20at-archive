[[comments]]
order = 2
subject = "لم تعجبني"
author = "نورن"
posted = "2006-01-02"
text = "السلام عليكم ورحمة الله وبركاته<br />أنا قرأت الرواية ، أو بالاحرى قرأت كم فصل منها ثم لم اشعر برغبة في اتمام القصة ، السرد لم يكن ناجحا و كذلك لم اجد ذلك التشويق الذي يجبرني على اكمال القراءة .<br />و ما جعلني اتوقف عن قراءتها بصراحة أن اسلوب الكاتبة لم يعجبني ، لانني و انا أقرأ اشعر و كأنني في جلسة \" غيبة \" أو جلسة نشر فضايح فلان و فلان ، يعني فعلا الكاتبة اختارت لمجموعتها البريدية اسم مناسب لاسلوبها و هو سيرة و انفضحت !!!<br />و الكتاب ملئ بالسخرية و السباب و الغيبة ، و حتى لو كان الاسلوب اللي تتكلم به البنات في الرواية هو الواقع ألا ان الكاتب عليه دائما ان يظهر و لو بالاشارة ان كان ما يفعله ابطال روايته صح ام غلط .<br />لم اعتد على الاستماع الى الكلام البذيئ و هذا ما جعلني اعرض عن اكمال قراءة القصة.<br />أما موضوع كشف الحقائق فاعتقد اننا نعلم عن السعودية اكثر مما قالت الكاتبة<br />الموضوع تم المبالغة فيه بشكل كبير<br />، كلنا نعرف انه في سلبيات كبيرة جدا في كل المجتمع السعودي (و هذا امر عادي و موجود ايضا في كل بلداننا ) ، بينما الكاتبة ركزت على فئة الارستقراطيين فقط و التي في السعودية او غيرها لا نحتاج الى رواية لتكشف لنا ما يحصل في بيوتهم.<br />هذا رأيي في الرواية . قد يكون للكاتبة قدرة على الكتابة الادبية و لكن اتمنى ان تترفع باسلوبها قليلا عن الاسلوب الساخر المستهزئ بكل شئ حتى و لو ارادت بذلك ان تعكس واقعا ما .<br />و شكرا على اتاحة الفرصة لتسحيل رأيي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131852/http://www.20at.com/article2.php?sid=187"

