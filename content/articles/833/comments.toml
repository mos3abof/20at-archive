[[comments]]
order = 0
subject = "جزاك الله خيرا يا خلف .... وشكرا لرجال الشرطة"
author = "عبدالله"
posted = "2006-04-19"
text = "كتابة التجربة بإسلوب الحكاية ثم الحكي ظريف وشيق، وكذلك رصد تجارب يحتذى بها من هذا النوع أمر مفيد للجميع... وللحق خلف وأصدقاؤه نموذج طيب ليس للشباب السعودي فقط ولكن للشباب المسلم<br />كذلك كانت نقطة جيدة أن توفر لهم الشرطة أحد أفرادها للتبرع بالدم، أعرف أن كثير من أفراد الشرطة في أماكن أخرى من الدول العربية يسفكون دماء شعوبهم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123749/http://www.20at.com/article2.php?sid=713"

[[comments]]
order = 1
subject = "بارك الله فيكم"
author = "خالد"
posted = "2006-04-19"
text = "الحمد لله ان يوجد شباباً لهذه الامة الاسلامية يعملون من اجلها فبارك الله فيهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123749/http://www.20at.com/article2.php?sid=713"

[[comments]]
order = 2
subject = "تشكر يا احمد"
author = "عبدالله فرج"
posted = "2006-04-19"
text = "كم يسعد الفرد منا حين يجد مثل هؤلاء الشباب اليافع الطيب الذى يسعى لخدمة المحتاجين المرضى وأقول لهم جزاكم الله خيرا .<br />وأشكرك يا احمد على موضوعاتك الشيفة وننتظر المزيد .<br />عبدالله فرج"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123749/http://www.20at.com/article2.php?sid=713"

[[comments]]
order = 3
subject = "اقتراح لعشرينات"
author = "عبدالله تاني"
posted = "2006-04-19"
text = "أعتقد أن هنك تجارب أخرى مشابهة في دول عربية مختلفة، فلما لا تقوم عشرينات برصد هذه التجارب ونشرها، ثم تتولى بعد ذلك التنسيق بين هذه الجهات لتفعيل التعاون فيما بينهم... علة أن تقوم لاحقا بنشر موضوع عن نتاج هذا التعاون... وهنا يتحول دوركم من مجرد رصد التجارب الجيدة إلى مساعدة القائمين على هذه التجارب وصنع تجارب جديدة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123749/http://www.20at.com/article2.php?sid=713"

[[comments]]
order = 4
subject = "سؤال حائر"
author = "نيفين"
posted = "2006-04-20"
text = "دى فرصه حلوه انى اسال عن موضوع شاغلنى من زمان<br />هل صحيح يا جماعه ان دمنا اللى ممكن نتبرع بيه لبنك الدم او اى مكان معتمد ف الموضوع دا ف الاخر بتشتريه المستشفيات الاستثماريه و الخاصه و بتتحرم منه المستشفيات العامه ام هذا تجنى من بعض الناس<br />و بما ان البلاوى ف البلد كتير احب اعرف من حد<br />متخصص<br />مفيش مانع من مساعده المريض حتى لو غنى بس نبقى عارفين برده دمنا بيروح فين<br />ارجو الردمن اى حد عارف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123749/http://www.20at.com/article2.php?sid=713"
