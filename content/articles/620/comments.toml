[[comments]]
order = 5
subject = "يستحق القراءة"
author = "دودو"
posted = "2005-12-19"
text = "الموضوع بجد حلو جدا ويستحق القراءة أكثر من مرة، وارسل تحية خاصة لكاتبة الموضوع علي اختيار شخصية (زها حديد) لانها تستحق الافتخار بها كأمراة عربية، كما أن اسلوب الكاتبة بسيط ومشوق وفكرة عرض تصميماتها فكرة رائعةجدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112954/http://www.20at.com/article2.php?sid=112"

[[comments]]
order = 6
subject = "شيء ممتاز"
author = "عبد الستار من العراق"
posted = "2005-12-19"
text = "بالطبع ده شيء رائع اننا نجد من يبحث عن ابنائنا ويكتب عن عظمائنا في هذا الوقت، بحيث ان العبقرية العربية لا يعلوها عبقرية اذا تم الاهتمام بها، نشكر الكاتبة ولها كل التوفيق والفلاح"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112954/http://www.20at.com/article2.php?sid=112"

[[comments]]
order = 7
subject = "ليت كل النساء"
author = "رجب المحمدي"
posted = "2005-12-19"
text = "شكراً على سرد هذه القصة وعلى القاء الضوء عليها وان كانت تستحق ان يراها ويعلم عنها بني جنسها جميعاً حتى يروا ان الاجتهاد في خدمة المجتمع البشري ليس بلبس الملابس الثمنية ووضع المساحيق الغالية وانما بالجد والاجتهاد وتقديم النافع المفيد فليت كل النساء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112954/http://www.20at.com/article2.php?sid=112"

[[comments]]
order = 8
subject = "مكناش نعرف عنها"
author = "ام علي"
posted = "2005-12-19"
text = "مكناش نعرف عنها حاجة، يا ريت ذي ما عرفتنا الكاتبة عن جوهرة عربية مكنونة، تعملنا حوار مع الرائعة زها وكيف وصلت الى هذه الدرجة حتى نتعلم وننتفع منها ويعم الخير وجزاكم الله خيراً"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112954/http://www.20at.com/article2.php?sid=112"

