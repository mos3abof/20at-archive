author = "ناشئة معمارية"
posted = "2006-02-23"
text = "انا احب ان اقرأ مثل هذه المواضيع لأنها تغني معرقتنا نحن طلاب العمارة ومن الرائع ان نرى ان هناك معماريين عرب قد وصلوا الى العالمية , واني اتمنى ان اتمكن من احقق شيئا في المستقبل وان اتمكن من اصبح مثل المعمارية زها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112954/http://www.20at.com/article2.php?sid=112"

