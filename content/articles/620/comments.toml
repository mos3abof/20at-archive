posted = "2005-12-18"
text = "فعلا الموضوع رائع انتوا عرفتوا الست دي منين ؟ برافو على المحررة تصميمات رائعة وغريبة وجميلة ييجوا ستات مصر يشوفوا وخصوصا الاخت مشيرة خطاب والمجلس القومي للمراة بتاعها اللي ما بيخرجش غير عاهات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112954/http://www.20at.com/article2.php?sid=112"

