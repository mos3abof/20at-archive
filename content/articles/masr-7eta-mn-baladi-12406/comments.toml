author = "هدم الاضرحة"
posted = "2009-06-19"
text = "لا يستطيع كائن من كان هدم اى ضريح لاحد اولياء اللة الصالحين<br />ففى ايام الانجليز حدثت واقعتين<br />واحدة فى ميدان المنشية فى اسكندرية وكان الانجليز يريدون عمل سكة حديد للترماى وفى التخطيط كانت السكك الحديدية تمر فوق الضريح واراد الانجليز هدمة واحضروا عمالا صعايدة وابتداوا الهدم - وعند ضرب اول فاس حدث لهم ما حدث واضطر الانجليز ليلتفوا بالسكة الحديد حول الضريح<br />والحادث الثانى عند عمل سكة حديد قطارات مطروح وحاول الانجليز نسف احد الاضرحة بالديناميت فلم يقع حجر واحد ومات المهندس الانجليزى فى نفس اليوم واضطرت السكك الحديدية ان تنحنى وتلف حول الضريح<br />اللى عامل راجل يهد ضريح او يهد حتى حجر واحد فية شوف هيجرى اية لة ولاسرتة"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620065209/http://www.20at.com:80/masr/7eta-mn-baladi/12406-2009-06-18-14-23-36.html"

