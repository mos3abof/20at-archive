text = "بأة هى دى حكاية الذوق؟ و الله مقال متميز فعلا و جديد. الذوق خرج من مصر من زماااااااااااان و مواقف الناس كل يوم بتثبت كدة. الاحسن كانوا يقولوا المثل \" الذوق مات فى مصر\" نفسى أشوف بلدنا احسن بلد فى الدنيا و تتملى ذوق زى زمان."
