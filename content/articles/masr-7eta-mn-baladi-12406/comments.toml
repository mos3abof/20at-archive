subject = ""
author = "الوهابيون الجدد"
posted = "2009-06-18"
text = "فى قريتى ضريح لشيخ اسمة الشيخ فلان مكانة بعيد فى وسط الزراعات ومحاط بشجرة جميز عتيقة وضخمة واشجار عنب قديمة<br />وعند هذا الضريح كانت تمارس بعض الطقوس الفرعونية التى ورثها المصريون عن ابائهم قبل الفتح الاسلامى وظلت تلك الطقوس سارية ولكن بصورة اسلامية ومع سماحة المسلمين سمحوا بتلك الطقوس اذ انها لا تضر ولا مانع منها اذا كان فيها فائدة<br />ليونة الاسلام ومرونتة هى التى حولت المصريين الى الاسلام ولم تقف ابدا فى وجة معتقداتهم القديمة واظن ان ضريح هذا الشيخ مبنى فوق معبد فرعونى قديم<br />كانت الفلاحات تاخذ الحليب بعد اول ولادة للبقرة او الجاموسة وتحملة للفقراء حول ضريح الشيخ يوم الجمعة<br />كانوا يزورون الضريح يوم الجمعة صباحا ويضعون النقود فى صندوق النذور او فى يد الخادم الذى يوزعها على الفقراء حول الضريح<br />كانت الجاموسة التى لا تحلب اللبن ياخذها صاحبها لتدور فى الخلاء حول الضريح<br />والاغرب انة فى ارض فضاء خلف الضريح مزروعة باشجار الجوافة كانت النساء اللاتى لا يحبلن يتمرغن ويتدحرجن على الارض من اول جدار الضريح وحتى عشرين متر اسفل<br />عادات فرعونية ورثناها<br />الا ان الوهابيون الجدد فى القرية منعوا تلك الطقوس"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620065209/http://www.20at.com:80/masr/7eta-mn-baladi/12406-2009-06-18-14-23-36.html"

