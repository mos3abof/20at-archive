[[comments]]
order = 1
subject = "..هل حان وقت يقال فيه كفي عنك دموعك جزائر ؟"
author = "خليل الجزائر"
posted = "2006-05-27"
text = ".. تحاك للجزائر كل لحظة وكل هنيهة مؤمرات بداعي النقد لسياتها الداخلية والخاريجية ..وهل من لا تعجبه سكينة الجزئر يدعي انه حاقد ؟ غير انه يبحث عن اي شيئ ولو حركة انتقال ولو جزئي في سياسة الجزئر نحو الرقي ليوجه سهامه ليطعن امن الجزائر ولو بكلمة. وفي ذالك فاليتنافس المتنافسون .. اين القائل وامثاله يوم بكت الجزائر بدموع سخينة ابنائها الذين قتلوا بغير حق ؟ اليس الامس اقرب واحق الى ان ننقد سياسة الجزئر بالفضيلة من اليوم ؟<br />لما نرى اليوم سهام توجه الى الجزائر ومن يرميها يبدو انه خائف وكانما يكاد يتقين من ان سهامه وسهام من يمنحه القوت الحرام لاجل ان يصنع ( لحم اكتافه) كما يقال لن تجدي اليوم في ان تعيد ايام الباس والشقاء الى الجزائر .. وهل يظن هاؤلاء ان الجزائري يظن ان احباب الجزائر اكثر من اعدائها ؟ .<br />وكانما بدل ان يقال ( يتعلق الغريق بقشة) يجب ان يقال ( ابحثوا عن شيئ نقوله حتى نعزف على جراح الجزائر ولو تحركت قشة )<br />كفوا انتم السنتكم وانصاف مثقفيكم واقلامكم الماجورة من خارج الجزائر عن الجزائر فسهامكم لن تجدي.. فالجزائر ان لها ان تمسح دموعها وان وقت يقال فيه كل الغد وبعد الغد للجزائر وحدها دون شريك اخر في الغد.. وغدا لناظره قريب .. وان وقت يجب ان تحب الجزئر من اعدائها رغما عن انوفهم ... قفزة نوعية اليوم في تاريخ الجزئر بهذا التغيير السياسي .. وليد جهد كل جزائري نزيه احب جزئرا انجبت الامير عبد القادر والعربي بن مهيدي و غيرهم .. طوبى للجزائر دون شك كل شهم نزيه احب الجزائر دون ادنى شك ولا اظن ان كل نزيه قد يكون فاقد للشيئ ففاقد الشي لا يعطيه واخص بهذه الكلمة من هم خارج الجزئر وينتقدون سياستها . امتثالا للحكمة اليابانية التي تقول ( لو نظف كل منا عند باب بيته لاصبح المحيط نظيفا ) اقول : نظفو بيوتكم خارج الجزائر عندها قد يتسنى لكم ان تنتقدوا من يعاني من قذورة خاج بيته ليس الا ."
archived = "2006-11-02"
