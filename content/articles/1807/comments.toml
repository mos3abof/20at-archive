subject = "ستبقين شامخة يا قلعة الاحرار"
author = "محمد"
posted = "2006-05-28"
text = "مهما قيل وقيل عن الجزائر ستبقى هي قلعة الاحرار و منبع الثوار المدافعين عن الحرية في كل الاقطار.ان الكلام عن الجزائر في وسائل الاعلام و خاصة العربية يكون دائمافي المواضيع السلبية فهل كل ماهو في الجزائر سلبي الا توجد اشياء اجابية في هذا البلد.انه الاجحاف في حق شعب حر."
archived = "2006-11-02"
