[[comments]]
order = 7
subject = "اللهو الخفي"
author = "أأقل اهانة له من الرسوم الكاريكاتيرية؟"
posted = "2006-04-29"
text = "تحويل بيت الرسول لمرافق عامة وحرق قبر أمه!<br />قامت الدنيا وقعدت عندما تجاوزت صحيفة دنماركية علي شخص الرسول الأعظم (ص) برسوم صورته بالأرهابي وغلي العالم الاسلامي لما حصل واحرقنا سفارات وازهقت أرواح كثيرة كردة فعل لما حصل. ولم تتهاون الصحف العربية والاسلامية وفضائياتها بصب الزيت علي النارولم نهدأ حتي هذه الساعة.<br />أهانة أخري نالت من الرسول الأعظم وشملت أصحابه وأرحامه وآل بيته ولم تتجرأ أي من هذه الصحف والفضائيات علي ذكرها باستثناء صحيفة القدس العربي الغراء التي ذكرت ما يحصل من اهانة لاثار نبينا العظيم في مكة والمدينة وذلك قبل ثلاثة أسابيع في مقالة للدكتور سعيد الشهابي والذي تناول فيها كيف تناولت المعاول والجرافات ما تبقي من التراث الاسلامي في مكة المكرمة والمدينة المنورة من جوامع وبيوت وقبور للصحابة وآل بيت النبوة.<br />وقبل أيام جاءت صحيفة الاندبندنت البريطانية وبتاريخ 19 نيسان (ابريل) العدد 6086 وتحت عنوان ظلال علي مكة عار علي آل سعود حيث تطرق الكاتب دانيال هاودن الي الهدم المبرمج لتلك الكنوز الاسلامية واصفا كيف قامت الجرافات بهدم المباني التراثية والجوامع الأثرية وقبور الصحابة وآل بيت الرسول الاكرم وتم استبدال هذه الابنية التي جاوزت أعمارها الـ1400 عام بفنادق وأبنية لسكن الأثرياء خلال مواسم الحج والعمرة حول الحرم المكي والمسجد النبوي.<br />وما يؤلم حقا أن بيت الرسول الأعظم وزوجته خديجة هذا البيت الذي نزل فيه وحي النبوة أكثر من مرة تم هدمه وتحويله الي مراحيض عامة. كما تم هدم وحرق قبر أم الرسول الأعظم السيدة آمنه بنت وهب والذي تم اكتشافه عام 1998 وبالرغم من معارضة الكثير من المؤسسات والهيئات الاسلامية والأثرية ومطالبة السلطات السعودية للعدول عن ذلك دون جدوي.<br />كما ذكر الكاتب دانيال هاودن كيف هدت الجرافات جوامع وبيوت الخلفاء الراشدين الأربعة وجامع علي العريض ومقابر الصحابة في مكة ومقبرة البقيع في المدينة. وذكر الكاتب أيضا أن السلطات الدينية تنوي أيضا ردم غار حراء وتحويل مكتبة مكة الأثرية الي موقف عام للسيارات.<br />لم تتحرك صحفنا العربية ولا فضائياتنا التي تملأ السماء ضجيجا دفاعا عن الحق والحقوق اللهم باستثناء صحيفة القدس العربي الغراء للرد علي هذه الاهانة التي شملت الرسول وفكر الرسول وآل وأصحاب الرسول! لقد قاطعنا الجبنة الدنماركية كرد فعل علي اهانة فهل لدي صحافتنا العربية وفضائياتنا أن تقاطع دولارات البترول وتنتقد ما يجري في مكة والمدينة؟<br />ان تراثنا الاسلامي ليس ملكا أو حكرا لآل فلان أو آل علان ولا يمكن لأي مذهب أو توجه ديني أن يأتي بعد 1400 عام ويقرر ما اذا كان الاحتفاظ بآثار النبوة بدعة أو وثنية وأن وجود مكة والمدينة في المملكة لا يعطي الحق لآل سعود وأثريائهم ومن دار في هواهم أن يتطاولوا علي الرسول والصحابة والاسلام ويمحوا ذكرهم.<br />ہ كاتب من العراق<br />ABAljawad@aol.com<br />القدس العربي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114019/http://www.20at.com/article2.php?sid=744"

