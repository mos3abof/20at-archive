subject = "بسم الله ما شاء الله عليها"
author = "شيماء"
posted = "2006-08-01"
text = "بسم الله ما شاء الله عليكي يا اسماء . ربنا يبارك فيكي يا رب بجد انتي بتحققي الي نظامنا و حكومتنا بيمنعونا اننا نحققة ربنا يوفقك و يكرمك و يبارك فيكي و تكوني سبب لاسلام الكثيرات في اوروبا و سبب لاحراج المسئولين الاعلامين في الدول العربية.<br />علي فكرة يحضرني مقولة للمذيعة السابقة كامليا العربي لما حببت تتحجب و تستمر في شغلها كمذيعة لبرامج الاطفال رد عليها المسئول انذاك و علي ما اعتقد ممكن يكون صفوت الشريف و قالها اقعدي في بيتك بقي انتي عاوزة تاخدي الدنيا و الاخرة و كأننا في بلد اسلامي زي مصر ممنوع نكسب الدنيا و الاخرة و عجبي."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114019/http://www.20at.com/article2.php?sid=744"

