text = "يا رييتنا نفوق مين الاولى الدانمارك البلد اللملعونة الى ساءت لحبيبنا المصطفى (ص) ولا مصر بلد الاسلام والسلام اصحوا يا مسلمين فوقوا وزارة الاعلام ممنوع فيها المحجبات يطلعوا على الشاشة انا واحده من الناس عندى موهبه لكى اكون مذيعه لكن ما عنديش اللى يأهلنى من ملابس عارية اكثر من ما بتستر لانى محجبة يا/ سيادة وزير الاعلام خاف من يوم للا ينفع فيه جاه ولا سلطه الا عملك الصالح نرجو منك ان نصف الاسلام فى بلدنا وشجعوا اللفتيات المسلمات المحجبات بظهور عللى الشاشه ويكفى ما حدث لديننا من الغرب بسب عدم تماسكنا كأمه اسلاميه واحدة ..."
