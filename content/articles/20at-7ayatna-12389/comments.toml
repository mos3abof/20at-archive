posted = "2009-06-18"
text = "انا محمد سعيد مصرى واعمل فى السعودية<br />ماذا افعل فى هذا الصيف ؟ سؤال كثيرا ما سالته لنفسى<br />ولا كنى اقول لكم سوف افعل كل شئ كنت محروم منة اثناء عملى فى السعودية<br />اولا :-هخرج مع كل اصدقائى لانهم وحشونى جدااااااا والغربة زى ما انتم عرفين مفهاش اصحاب بل شعار الغربة هى نفسى نفسى<br />ثانيا:- الى المصيف على طوووووووووووول<br />يلا انا شكلى طولت عليكم<br />بس انا سعيد بمشاركتى معاكم"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620012708/http://www.20at.com:80/20at/7ayatna/12389-2009-06-17-08-47-15.html"
