[[comments]]
order = 2
subject = "الورد كفابه اسمه عليه"
author = "ابو علي المقدسي"
posted = "2006-06-18"
text = "الله على الورد ما اروعه نعم اخيتى لقد كتبت خاطره بنفس العنوان ونالت رضى العديد من القراء.... وفكره الكتابه استوحيتها من طالبه جامعيه... تهادت بخطوات هوينه..هوينه وانحنت كمن يؤدى صلاه انحنت لتلامس بفمها وانفها المرسومين ويا سبحان الله كيف ابدعهما وتنسمت عبير الورده الجوريهخمريه اللون وتعالت برائسها الى اعلى وشعرها النسدل الاسمر الفاحم تتطاير كفرس عافت العنان للتو وانطلقت حره طليفه تسابق السهووول والمروج.....وبادرتها بسؤال لماذا لم تقطفيها..اجابت والابتسامه تقفز من فمهاانها ليست ملكا لى انها ملكا لكل الناس وليس من حقى قطفها..... وعلمت بعد ذلط ان تلك الطالبه تدرس الفيزياء فةى جلمعه القدس- ابوديس ومن النابغات والاولى ليس على كليتها بل على الجامعه ؟؟؟؟الى هنا التوقيع.. ابو على المقدسى -فلسطين المحتله- القدس الشريف- ابوديس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113556/http://www.20at.com/article2.php?sid=887"

