text = "قمت علي عجل بانشاء حديقة للورد امام المنزل.. واخرى فى العمل...ومع شح الرواتب... فليس بالخبز وحده يحيا الانسان.... وكما انشد ناظم الغزالى حرام تدوس على الورد بيدي سقيته.. بيدي-فلسطين عربيه"
