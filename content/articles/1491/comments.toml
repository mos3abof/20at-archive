posted = "2006-01-11"
text = "انت وهو وهى انتو مين انتو علشان تقولو يارب كذا ولا كذا<br />ربنا هو اللى يتصرف معاة بمعرفتة<br />ايوة هو انسان شرير وشرس لكن هو مريض دلوقتى وبحالة حرجة<br />والمفروض نقول لاى مريض فى حالتة يارب سهل لة وارحمة بس<br />لكن مش من حقنا ندعى علية<br />سيبوة منة لربنا"
