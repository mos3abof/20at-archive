[[comments]]
order = 18
subject = "الى الجحيم يا رمة يا خنزير"
author = "المصرى الأصيل بطل 73"
posted = "2006-07-09"
text = "يا رمة يا أبن الرمة يا خنزير يا زبالة يا شارون يا كلب يا أبن الكلب يا الى ما تعرفش أبوك مين يا ابن الحرام .... البشرية كلها متبرية منك ومش اوزة منك حاجة ... خلى أحمد عز ينبسط لأنك اشتريت منة الحديد بتاع الجدار العازل ... يا أحمد يا عز يا خاين حنيت لليهود لأنك منهم فوالدك فلسطينى خاين عاش مع اليهود وأخيرا أستقر بك المقام فى مصر الى لمتكم وعلكتك وأخيرا بفضل الفساد والمفسدين كوشت على المليارات يا حرامى من أموال هذا الشعب المسكين ... ولازم تعرف قدرك وحجمك كويس وعمر ما حد سمع عنك يا نكرة يا أبن النكرة يا لأجىء ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144712/http://www.20at.com/article2.php?sid=229"

