[[comments]]
order = 20
subject = "الى جهنم"
author = "none"
posted = "2006-07-25"
text = "ألا لعنة الله على شارون وكل اليهود ابناء القردة والخنازير. هذا الخنزير القذر لا رحمه الله بل ليذيقه مر العيش نكالا بما صنعه في أمة الاسلام والعرب. وآخر أخباره أن ابنه رماه مثل الزبالة في مزرعته وحتى البامبرز لا يغيرها له والآن شارون يشخ على روحه ولا أحد ينظفه لأنه خنزير. حتى ابنه يكرهه ولا يسأل فيه . وهذا كلام موثوق من شاهد عيان رآى شارون مثل الكلب مهمل ويشخ على روحه. الله لا يعافيه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144712/http://www.20at.com/article2.php?sid=229"
