posted = "2006-01-10"
text = "انا اصلا مش عارفة مين المقرف اللي هيرضى يكون مشترك مع واحد نتن زي هادا في اي عضو من اعضاءه .... الله لا يقومو يارب ويضل معوق هيك يدوق شوية من الزل ... الله يزلوا هو وامثالو من العرب وغيرهم ...<br />الله بس ينفس كرشك يابعيد ...<br />مع تحياتي<br />فلسطينية كارهة لشارون"
