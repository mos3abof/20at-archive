[[comments]]
order = 9
subject = "بجد لازم تراجع أسلوبك!"
author = "واحد معدي"
posted = "2006-01-12"
text = "الكابتن محمد علي ، بعد التحية و السلام..<br />نصيحة لوجه الله راجع أسلوبك ، لأنه منفر حتى و إن كنت محقا ..<br />يعني شوف الأخ اللي فوقيك \" واحد اتفقع من الاخت\" رد من غير ما يقل أدبه ، و بعدين الدعوة اللي انت دعيتها دي بجد حرام عليك<br />إلى الأخت الرومانسية : الكلام اللي انتي بتقوليه ده غلط خالص ، ده فعلا شيطان من شياطين الإنس و أنا مستغرب جدا انتي ليه متعاطفة معاه ، يا ريت تراجعي نفسك شوية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144712/http://www.20at.com/article2.php?sid=229"

[[comments]]
order = 10
subject = "مالكم خيار إلا الخيار"
author = "إفرام من إسرائيل"
posted = "2006-01-13"
text = "شارون راح يموت لأنه مقرب على الثمانين...ليش فرحانين يا عرب ياحفاة يا أولاد الغنم؟<br />راح ييجي غيره يربيكوا كيف ما شارون ربى المخربين في حماس و الجهاد و فتح في غزة<br />سدقوني...مالكوا خيار غير خيار ستكم و أمكم الرومانسية...هيك أرحم و أحلى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144712/http://www.20at.com/article2.php?sid=229"

[[comments]]
order = 11
subject = "شوف يا عم المعدي"
author = "محمد علي"
posted = "2006-01-14"
text = "واحدة زي الرومانسية خلت الخنازير تتكلم<br />و اسمع يا بتاع باللي اسمك أفرام<br />إنت باين عليك متخلف عقلياعلشان تقول إن إنتم اللي ربيتوا حماس و الجهاد زي ما بتقولوا إنكم انتصرتم في حرب 73...فعلا شعب بتاع ماريجوانا<br />بس أنا اللي أعرفه إن معدل الهجرة العكسية من فلسطين المحتلة زاد و معدل الهجرة إليها من اليهود ف النازل...ده غير إن عدد العرب الفلسطينيين داخل الأراضي المحتلة بيزيد كل شوية<br />و طبعا إنتوا مش قادرين تواكبوا الزيادة دي لأنكم شعب *** و ***<br />و منك لله يا رومانسية<br />*** تم حذفها من قبل الغدارة لخروجها عن الآداب العامة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144712/http://www.20at.com/article2.php?sid=229"

