[[comments]]
order = 7
subject = "الى الاخت الرومانسية"
author = "واحد اتفقع من الاخت"
posted = "2006-01-11"
text = "ا أختى رومانسية انتى محموقه كده ليه هو كان وعدك بعضو من اعضاءه و لا حاجه .... يا أختى من لا يرحم لا يرحم لا من الله سبحانه و تعالى و لا من الناس هذا الخنزي (مع الاعتذار لكل الخنازير فى السكانين فى مستنقعات الطين فى كل مكان) هو من أمر بقتل الالاف العرب من اول اخوانا الشهداء الاسرى فى 67 الى يومنا هذا و ربما الى يوم ان يشاء الله سبحانه و تعالى و يكفى ان تتذكرى الشيخ القعيد الشهيد أحمد ياسين ان من يقتل طفل او شيخ او امرأه هو خنزير ... و على فكرة انا قرأت خبر من جميعة الخنازير لنقل الاعضاء ان هذا الجميعة تنفى نفيا قاطعا انها طلبت من شارون اى عضو من اعضاءه ..... حتى الخنازير تعاف ان تلامس اعضاءها اى عضو من اعضاء هذا المسخ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144712/http://www.20at.com/article2.php?sid=229"

