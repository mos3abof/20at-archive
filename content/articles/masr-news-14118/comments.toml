subject = ""
author = "انتم سبب الاهانة"
posted = "2009-11-22"
text = "الذى يهين المصريين هو جهاز امن الدولة ومعتقلاتة<br />وضباط المباحث فى الاقسام واهانة المصريين واستحقارهم<br />اهانة المصريين فى طوابير الخبز<br />اهانة المصريين حتى فى دفع فواتير التليفون وفى المكاتب الحكومية<br />اذا كان لمصرى معاملة فى اى مكتب حكومى فانة يلاقى صنوف الهوان<br />ارحمنا بقى"
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124154955/http://www.20at.com:80/masr/news/14118-2009-11-22-07-51-11.html"

[[comments]]
order = 1
subject = ""
author = "كل سنه وانت طيب ريس"
posted = "2009-11-22"
text = "كل سنة وانت طيب<br />واحنا مش طيبين<br />كل سنة وانت حاكم<br />واحنا محكومين<br />واحنا مظلومين<br />واحنا متهانين<br />ويا ترى يا حبيب الملايين<br />فاكرنا ولا احنا خلاص منسيين<br />فاكر المعتقلين<br />فاكر الجعانين<br />فاكر المشردين<br />فاكر اللي ماتو محروقين<br />فاكر الغرقانين<br />الله يكون في عونك - ها تفتكر مين وللا مين"
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124154955/http://www.20at.com:80/masr/news/14118-2009-11-22-07-51-11.html"

[[comments]]
order = 2
subject = ""
author = "شكرا يا مبارك"
posted = "2009-11-22"
text = "بس وحياة والدك الكلام دا تقولو للسيد حبيب العادلي وبقية السادة ضباط الداخلية والامن المركزي عدم اهانة المصريين<br />لان اهانة الداخلية للمصريين اصبحت على النت وفيه مواقع متخصصة تفضح اهانة الشرطة المصرية للمصريين<br />علاوة على جهاز الامن المركزي وفضائحه في تفريق مظاهرات الجوعى وتنقلها الفضائيات الى كل انحاء العالم<br />علاوة على المواقف المخزية للحكومة المصرية تجاه الازمات التي يمر بها الشعب المصري على سبيل المثال ازمة الدويقه وفضل الحكومة في السيطرة عليها وازمة الخبز التي تنقل الى جميع انحاء العالم عبر القنوات الفضائية<br />شكرا يا ريس<br />وكتر خيرك"
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124154955/http://www.20at.com:80/masr/news/14118-2009-11-22-07-51-11.html"

