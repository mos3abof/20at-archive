posted = "2009-11-22"
text = "يعنى اية<br />ونقدر نعمل اية<br />اقصى حاجة قطع العلاقات وهى فعلا شبة مقطوعة<br />صباح الروقان<br />رحم اللة امرؤا عرف قدر نفسة"
archived = "2009-11-24"
