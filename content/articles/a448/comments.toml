[[comments]]
order = 1
subject = "حكايتي مع الزمان"
text = "حدث أن قُطِعت الصلة بين أختي وبين بقية أهلي.. لكن لله الحمد واصلت أختي وكنت أذهب لها من وراء أهلي مرة أسبوعياً.. لا تتخيلوا كم البركة والرزق الذي رزقني به الله بعد أن واصلت أختي التي لا تتخيلوا كم الحب الذي تكنه هي لي لوقفتي بجانبها.. فقد كانت بلا أهل أمام زوجها وأهله..<br />أهم شيئ هم إخلاص النية، ولا تجعلوا الشيطان عليكم سبيلاً، ولا تجعلوه يعمي عيونكم كما أعمى بصري لمدة سنة كاملة لم أحدث فيها أختي..<br />الله المستعان.. غفر الله لنا أجمعين.."
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813083209/http://www.20at.com:80/article.php?sid=448"

[[comments]]
order = 2
subject = "نونا"
text = "سبحان الله. فعلا ربنا لما بيشدد في الأمر بحاجة، بيكون فعلا لأن الانسان بيستسهل انه ميعملهاش...<br />يعني أنا مثلا مفيش حد في أصحابي ومعارفي، معندوش مشكلة مع قرايبه. ورغم ان كلهم عارفين عقاب قطع \"ما أمر الله به ان يوصل\"، إلا أن كل واحد منهم بيحاول يجد لنفسه مخرج، زي القول بانه عمل اللي عليه، وان قرايبه هما اللي وحشين، وان اكيد ربنا هيسامحه!!<br />ربنا يهدينا ويسامحنا بقى"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813083209/http://www.20at.com:80/article.php?sid=448"

[[comments]]
order = 3
subject = "كل شخص في حياته و لو قريب غريب !!!"
text = "الموضوع ما شاء الله يا شيرين أكتر من ممتاز و الحقيقة إنه بيمس تقريباً كل بيت عربي و فعلاً مافيش حد كل عيلته تلاقيها كده زي الفل لازم و لو شخص واحدغريب الأطوار أو مريض ( نفسياً و عقلياً) لا أقصد مجنون طبعاًو لكن أفكاره تقريباًغريبة و مسمومة, و لكن فعلاً الواحد لازم يعصر على نفسه لمونة و يوصل أهله حتى و لو كانوا بيقطعوه و بيكرهوه كره العمى, و حتى لو كان قلبه من ناحيتهم ما فيهوش أي حب, لأن طبعاً الحب مش بالعافية, ربنا قالنا نودهم و نوصلهم مش لازم يعني نكون بنموت فيهم, و بعدين إحنا مش حننقص حتة لو عملنا كده بالعكس إحنابندعي يارب نضمن الجنة, و كل ده لوجه الله و رضاه عنا.<br />أما بالنسبة للأم أو الأب اللي بيدخلوا في دماغ أولادهم إن عمتهم أو خالتهم دي ست مش و لابد أو عمهم أو خالهم ده راجل نصاب و المفروض نقاطعه, فالحقيقة أنا عندي مثال و اقعي عن العكس تماماً و هو أن هناك أم كانت طول عمرها بتحبب أولادها في عمتهم و جدتهم ( اللي هي حماتها ) و لما الأولاد كبروا إكتشفوا حقيقة جدتهم و عمتهم و عمهم أيضًا و مدى كرههم لهم و لوالدتهم و والدهم بدون أي أسباب واضحة و بعض الأشياء المشينة التي يخجلون أن يصارحوا بها حتى الأم أو الأب و كانت زيارتهم لهم بمثابة ( شر و لابد منه ) و لكن بعد معرفتهم ثواب صلة الرحم أصبحوا بيداوموا على الإتصال بيهم حتى و لو عصروا على نفسهم مليووون لمونة !!!!!"
archived = "2004-08-13"
capture_url = "https://web.archive.org/web/20040813083209/http://www.20at.com:80/article.php?sid=448"

