text = "جمال سليمان ممثل ممتاز واحية على كل اعمالة فى مصر وخصوصا مسلسل حدائق الشيطان وهو ممثل من جيل العمالقة مثل رشدى اباظة و فريد شوقى ومحمود المليجى وربنا يوفقة كمان وكمان"
