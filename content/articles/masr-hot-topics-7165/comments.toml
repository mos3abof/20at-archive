author = "فنانس"
posted = "2007-09-24"
text = "على فكرة يانجم الممثل السورى مش زى المصرى امثال يحيى الفخرانى والهام شاهين وغيرهم اقصى اجرهم لا يتجاوز المليون ولا يتدخل فى شغل المخرج ولا يفرض شروطه على جهه الانتاج وبيعملوا مسلسلات حلوة جدا سواء فى سوريا او فى مصر"
archived = "2009-12-26"
capture_url = "https://web.archive.org/web/20091226223123/http://www.20at.com:80/masr/hot-topics/7165.html"

[[comments]]
order = 1
subject = ""
author = "اكتب اسمك هنا"
posted = "2007-09-24"
text = "حتى السوريين فهموا اللعبة لعبة الشعب المصري الاهبل الطيب اللي يا ما عمل باشاوات ومليونيرات<br />هو اللي عمل عادل امام ومحمود الخطيب وثابت البطل واكرامي واحمد ذكي وعمل بشوات كتير بفلوسه<br />وبعد ما يعمل الباشا من دول يفرح الشعب المصري بالباشا ويفرحله وهو ساكن في الفيلا وعنده عربيات اخر موديل وبيركب طيرات<br />وبعد كده ولاد البشوان يدوسوا ولاد الشعب بالسيارات الفاخرة"
archived = "2009-12-26"
capture_url = "https://web.archive.org/web/20091226223123/http://www.20at.com:80/masr/hot-topics/7165.html"

