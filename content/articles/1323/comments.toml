subject = "كان هذا الموجز و لديكم الانباء بالتفصيل"
author = "أكرم"
posted = "2006-02-15"
text = "الموضوع جميل و مفيد بس قولولي اعمل ايه عشان اتجوز واحدة تفضل رشيقة على طول ؟؟<br />1- منخلفش عيال خالص<br />2- نفضل مخطوبين على طول<br />3- نكتب عقد بالا يزيد وزن العروسة بعد الزواج عن 10 % من وزنها قبل الزواج و الا سيتم ردها فورا مع الاحتفاظ بالمهر و الشبكة و الذي منه<br />4- اتصل بصديق ( الشحن واقع )<br />5- احذف اجابتين ( او تلاتو زي ما تحب ( مواطن حر في بلد ديموقراطي ( قدي بلد ابوهم )))<br />6- الاستعانة بالجمهور ( حضروا حالكون )<br />الاجابة<br />بسم الله الرحمن الرحيم<br />الاجابة هي طلعت حرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142427/http://www.20at.com/article2.php?sid=440"
