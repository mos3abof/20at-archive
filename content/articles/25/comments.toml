subject = "SLAMAMUSLM"
text = "احبابنا والله نحب المسلمين واحنا مابينا وبين حد صلة دم منهم فالواحد يصيبو اذى من المسلمين بيقطع فى قلوبنا اويصيبوا فرح مثلا اخوانا فى المقاومة لما بيعملوا عملية سواء ففلسطين اوالعراق اواىارض مسلمةوعربية الواحدتغمره السعادة ويتمنى لو يكون معاهم<br />اخوانا فى الفلوجة اهديهم هذ القصيدة ولوانى كتبتها فى حينها لبغداد فلتكن بغداد فيها رمز<br />اليكم القصيدة وهى بعنوان \"قاومى\"<br />قصيدة لى كتبتها حينما كانت بغداد تقاوم الغزو لامريكى- البريطانى<br />عنوانها\"المقاومة\"<br />قاومى قاومى*** بغداد تسلمى<br />يا سليلة الرشيد**ياحضارات الجدود<br />ياخلافة تعود ***بالروح والدم<br />قاومى طغيانهم***وأوئدى احلامهم<br />فاحفرى قبورهم**بالاله استعصمى<br />قاومى واستبسلى**فوق عرشهم اعتلى<br />للعلا هيا بنا***وللفخار تقدمى<br />بغداد فجاهدى***كل كبر المعتد<br />فندى واهى الحجج**نحى لو م اللائم<br />لا اله سوى الذى**يحمى ضعف اللائذ<br />فارتجيه النصرة***فى الخضم القاتم<br />لاتبالى بالحشود***بعض قطعان تبيد<br />اننا نحن الجنود***نقتديك بالدم<br />ياحضارات السنين***ياقلاع الخالدين<br />صالحى رب السما***بالحمى لن تندم<br />لاتبالى بالعدا***لاتهابين الردى<br />ربى بعث محمدا**قائدا للمسلم<br />كى تعيدى للملا***عصر فرسان خلا<br />جددى عهد الاولى**رغموا انف المجرم<br />خطى فى كل البطاح***قصة تروى الكفاح<br />هاتى خالد او صلاح***للصليب الغاشم<br />ادحضى حلم اليهود***لا فى اررضيك يسود<br />بالجهاد وبالفدا *** بالشهيد البـــــــــــاسم<br />ربى يحمى طهرك**فى جهادك مهرك<br />ردى كيد الكافر***من الاله قاصم<br />حملة الصلبان هم***يبغوا تزييف القيم<br />يبغوا نفطك خيرك***يبغوا دينك فافهمى<br />ظنوا انهم يمروا***فى فلاة لاتضر<br />فليروا مالا يسر***من فداء المسلم<br />من تخاذل جانبيه*** ذا التاريخ سيزدريه<br />والنيران ستحتويه***من قوى راجم<br />كونى فى دنيا الشرف**طيف نصر قد أزف<br />غوث قلب قد هتف***من إباء مفعم<br />كونى مقبرة الغزاة*** قيد زل للطغاة<br />أنت بغداد الرشيد***جادك الغيث الهمى<br />يا درارى الجهاد*** تخذى بالدين العتاد<br />شرفينا فى البلاد**امحقى الكفر العمى<br />أرض اسلام الاباء***تسلمى نحن الفداء<br />نحن بوتقة انصهار***للئيم القادم<br />نصرنا فى سيفنا***ثقتنا فى ربنا<br />والكتاب دليلنا****حاكم فى امرنا<br />والرسول امامنا***قدوة للأقوم<br />وارجو من اخوتنا ان يراسلونى على عنوانى الالكترونى<br />SLAMAMUSLM@ISLAM-ONLINE.NET<br />اوali_tan2000@hotmail.com<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417201338/http://www.20at.com:80/article.php?sid=82"

