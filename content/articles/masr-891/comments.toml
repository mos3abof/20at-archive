[[comments]]
order = 3
subject = "حبيبتي ومعشوقتي زنوبة"
author = "حبيبتي ومعشوقتي زنوبة"
posted = "2006-09-08"
text = "جربت نسوان الأرض كلهم بيض وصفر وحتى زنجيات هنا وفي أمريكا ما عجبني في السرير غير المصرية..أموت في عنخ المصريات وحبهم للنيك من وراء وقدام.<br />تعرفي يا زنوبة مستعد أدفع ألف شيكل جديد بليلة تانية معاكي يا حبيبتي، خلاص مبقاليش مزاج في أي مرة تانية غيرك.<br />يا ريت نحتل مصر قريب- وده أبشرك حيحصل أقرب مما تتصوري- وساعتها إنتي وأنا نعيش على طول عشاق، دي أمنية عندي.<br />وبعدين هو مين للي عمل \"عمر أفندي\" ده مش يهود مصر..وبنزيون وعدس وغيره...ليه النطاول وقلة الأدب يا حبيبتي؟ مصر ناصر ماتت من أربعين سنة، ولا عمرك شفتي ميت رجع؟ وبعدين تقدري تنكري إن السادات ومبارك ورءوس الدولة عندكم يهود؟ يا روحي كل حكام المنطقة صبيان ومستخدمين عندنا..وتحت الأمر..وأحسن كده..بعقل اليهود وفلوس رعيان المعيز..نبني شرق أوسط راقي متحضر...."
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925023225/http://masr.20at.com:80/article.php?sid=891"

[[comments]]
order = 4
subject = "حسبي الله ونعم الوكيل"
author = "معاذ محمود عامر"
posted = "2006-09-11"
text = "يعني خلاص مشاكل مصر والأمة العربية والاسلامية كلها اتحلت وعايشين في تبات ونبات ومش فاضل غير هالة سرحان هي المشكلة الأخيرة اللي مدمرة الأمة كفاية تغييب بقى احنا عايزين حرية وقوانين ودستور ووظائف ومش عايزين غباء وهلفطة مشكلتنا أكبر بكتير من السذاجة والحماقة دي واللي مش عاجباه هالة سرحان يقلب روتانا سينما انما والنبي بلاش تخلف وتخدير أكتر من كده يا جدعان فوقوا بقى وحسبي الله ونعم الوكيل في اللي عمل الحملة الغبية دي ربنا ياخده ويخلصنا من أمثاله من الحمقى والسذج. حسبي الله ونعم الوكيل, حسبي الله ونعم الوكيل, حسبي الله ونعم الوكيل, حسبي الله ونعم الوكيل, حسبي الله ونعم الوكيل."
