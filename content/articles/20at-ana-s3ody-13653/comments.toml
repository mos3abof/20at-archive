text = "قاتل الله هذا المجاهر وهذه القناة قال صلى الله عليه وسلم كل امتي معافى الا المجاهرون -ما اراد هو ومن معه الا الفساد والدعارة ونشر الرذيلة -انالله وانا اليه راجعون حسبنا الله ونعم الوكيل هذا حده القتل وليس السجن"
