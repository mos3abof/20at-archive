text = "نعوذ بالله من الفتن ماظهر منها وما بطن…مجاهره مخيفه وعرض شيطاني من هذه القناه اين الرقابه؟؟اين الخوف من الله لماذا تشجعون امثاله على المجاهره بالقنوات خاااااافوا الله اتقوا الله…"
