[[comments]]
order = 2
subject = ""
author = "تنتظر فتى الاحلام"
posted = "2009-06-07"
text = "يا ترى مين هو فتى الاحلام المناسب<br />اسمها الرهيبة والبلدوزر وطولها مترين ووزنها 145 كيلو وواخدة بطولة العالم فى الرست<br />اى زوج يجرؤ ان يسألها تعمل لة كباية شاى - واة لو زنقت علية فى المطبخ وعصرت ايدية<br />ربنا يبعدها عنا<br />هو اللى ينفعها محمد على كلاى او ليستون وحش الحلقة او دراكولا<br />دى داخل اى بيت عبارة عن خطر ممنوع الاقتراب منة والتصوير<br />هنقول اية<br />لا يكلف اللة نفسا الا وسعها<br />وربنا معاها<br />وانا انصحها فى البلد دى انها تبقى تمشى كتير جنب المدابح يمكن واحد زى ابوحة تعجبة"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620135037/http://www.20at.com:80/masr/ebn-balad/12298-2009-06-07-12-28-16.html"

[[comments]]
order = 3
subject = ""
author = "مفرمة بشرية"
posted = "2009-06-08"
text = "هى ممكن تعصرة عصرة واحدة ويطلع السر الالهى<br />الوزن 140 كيلو والطول مترين<br />واظن قوة القبضة زى المطرقة وطبعا لا يفل الحديد الا الحديد واللى يقدر عليها واحد من الابطال الدوليين فى كمال الاجسام<br />ربنا لا تؤاخذنا بما فعلة السفهاء منا لو راح احدهم يتجوزها وانفرم منة حاجة جواها"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620135037/http://www.20at.com:80/masr/ebn-balad/12298-2009-06-07-12-28-16.html"

