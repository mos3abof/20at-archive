[[comments]]
order = 1
subject = "خطأًً آ خراً"
author = "Bassem"
posted = "2006-10-31"
text = "خطأ تاريخي دوما نذكره و ندرسه في المدارس دون الرجوع إلي دراسته, ألا و هو العلم المصري و ألوانه الثلاثة (الأحمر و الأبيض و الأسود)و كما أشــار كاتب المقالة الكريم, الأقرب للصواب أن هذه الألوان الثلاثة تعود إلي دمغرافية مصر الفرعونية,<br />الأحمر : يرمز إلي الوجه البحري , والدليل علي ذلك راجع التاج الفرعوني لمملكة الوجه البحري الأحمر المفتوح والذي دمج مينا نارمر موحد القطرين.<br />الأبيض : يرمز إلي الوجه القبلي و الذي كان يرتديه مينا نارمر نفسه وكما هو موضح في جداريته التي تصور معركته ضد الوجه البحري لتوحيد القطرين, و يظهر جليا كيف دمج التاجين معاحين جلس علي عرش مصر الموحدة, وأبقي علي لونيهما الأبيض والأحمر, وهذا التاج صتار التاج الرسمي لفراعنة مصر (شاهد تمثال رمسيس الثاني).<br />الأسود : يدل عل النوبة وهو العنصر الديمغرافي الثالث الذي يعبر عن شعب مصر , حيث أن النوبة كانت دوما مطمع للفراعنةلضمها إلي حدودالمملكة المصرية , و نجحوا في ضمها فعلاً."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131426/http://www.20at.com/article2.php?sid=1389"

[[comments]]
order = 2
subject = "انتا بجد هايف بشكل"
author = "واحد من الناس بس مش زى كل الناس"
posted = "2006-10-31"
text = "تصدق ياعم أحمد ان امثالك هما اللى جايبين الصحافة لورا ... هو خلاص الموضوعات كلها خلصت ورايح تعمل حاجة عن لون الاعلام.... ايه الهيافة ديه ... تابع يا ابنى وكالات الاانباء واقرا شوية وانتا تجيب شغل كويس .. اما تعمل سيرش على النت أى حمار ممكن يعمله وتنقش موضوع دان الهبل بعينه ... اتعب شوية فى موضوعك وحاول انه يكون آنى وحيوى ... وبطل تعتمدعلى أن القارئ بيعرف كل المعلومات منك .... بس بجد انتا صحفى تعبان جدا ... اتعلم من الهوارى ياعم شوية ... سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131426/http://www.20at.com/article2.php?sid=1389"

[[comments]]
order = 3
subject = "للاسف"
author = "ياسر فتحي"
posted = "2006-10-31"
text = "للاسف التعليق الي قبلي مش مستظرفه خالص أو بالبلدي مش قادر احرتمه .. طبعا انا اقصد التعليق مش الكاتب .. كان نفسي ان اسلوب النقد يكون احسن من كده ممكن النقد يكون لاذع لكن مش لازم يكون في الفاظ غير محترمة او لكنة غير محترمة كان اللي بتكمل ده فوق النقد يعني ...."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131426/http://www.20at.com/article2.php?sid=1389"
