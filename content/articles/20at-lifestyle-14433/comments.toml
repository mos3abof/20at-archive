text = "فكرة حلوة اوي واكيد ناجحة<br />بس مظنش ان واحد مسلم وعنده اخلاق ممكن يعمل كده ولا إيه ؟؟<br />هو ممكن يخدع المدين بس من غير ما يكون في بنات فعلا<br />يعني يخدعه ويكبس عليه من غير ما يقابل اي بنات او اي حاجة"
