subject = ""
author = "غممان نفس"
posted = "2007-11-08"
text = "صحيح مخة زى مخ القط - اسم على مسمى<br />ما ان تطالع سماجتة حتى تصاب بغممان نفس ورغبة فى التقيؤ<br />امثالة من خريجى مراكز التخلف العقلى الوطنى الديمخراطى يحتاجون الى ديتول للتطهير<br />هؤلاء يمثلون نكبة الصحافة فى مصر<br />القط وابوحديد وعماشة فى الطفاشة<br />يا جماعة اختاروا مواضيع مقبولة كويسة<br />كفانا دعارة صحفية"
archived = "2009-10-12"
capture_url = "https://web.archive.org/web/20091012024823/http://www.20at.com:80/masr/t7kyk/7548.html"

[[comments]]
order = 1
subject = ""
author = "ahmad hamdy"
posted = "2007-11-08"
text = "اجد ان ممتاز القط وسيلة رائعه يمكن اضافتها لوسائل منع الحمل،، ما على الرجال الا متابعة مقالاته واحاديثه ويتركوا الطبيعة تأخذ مسارها بعد ذلك<br />والجميل فى تلك الوسيلة انك تستطيع ان تستغنى عنها وتعود اليك قدرتك الحياتيه بعد فترة نقاهه طويلة نسبياً<br />ومن مميزتها ايضا ان ليس لها اعرض جانبيه كثيرة فقط بعض المغص والالم - كثير من الالم- والتلبوك المعوى<br />ربنا يتوب علينا بقا<br />تحياتى للجميع"
archived = "2009-10-12"
capture_url = "https://web.archive.org/web/20091012024823/http://www.20at.com:80/masr/t7kyk/7548.html"

[[comments]]
order = 2
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-04-05"
text = "يا جماعة بزمتكم الراجل مغلطش فى احمد رجب واحمد رجب هو اللى غلط فية والراجل حاول اكترمن مرة معاة بس احمد رجب واخداة العنجهية اوى ثانيا ممتاز القط مش صغير دة بقالة 35 سنة صحفى والراجل اخد اكتر من 20 جايزة صحفية من قبل ما يبقى رئيس تحرير ثالثا مكرم نقيب الصحفيين استحالة يقول الكلام دة واخيرا المفروض انكم متعلمين يعنى تقرة كل حاجة بموضوعية مش تمشوا مع التيار والنبى حد يقد يقولى لو الريس جرالة حاجة البلد هيحصل فيها اية لا الاخوان هيسكتوا ولا المعارضة هتسكت ولا الجيش هيسكت نبقى العراق التانية"
archived = "2009-10-12"
capture_url = "https://web.archive.org/web/20091012024823/http://www.20at.com:80/masr/t7kyk/7548.html"

[[comments]]
order = 3
subject = ""
author = "كريم"
posted = "2008-04-20"
text = "بجد عشان انا خرجت عن شعوري من الراجل الي اسمه القط ده والنجم الي حاطط اخر تعليق بس هنقول ايه البلد اتملت منافقين ومساحين جوخ وانتوا عارفين ان الي اسمه ممتاز القط ده وصل لمكانه الي هو فيه ازاي يبقي تاعبين نفسكم ليه ماهوفي بلدنا الطيبة دي الي بينافق بيوصل متستغربوش ده حال البلد لما يكون بيحكمها عصابة زي عصابة الحزب الوطني<br />وبقول للنجم الي رادد في الأخر :-<br />لكل داء دواء يستطاب به الا الحماقة اعيت من يداويها"
archived = "2009-10-12"
capture_url = "https://web.archive.org/web/20091012024823/http://www.20at.com:80/masr/t7kyk/7548.html"
