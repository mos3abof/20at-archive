[[comments]]
order = 1
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-06-25"
text = "لا يشرفنى ان اكون عضوا بالجزب الوطنى(الغير)دي مقراطى<br />مع تمنياتى وولائى فقط لرئيس الجمهورية/محمد حسنى مبارك<br />ممدوح زكى زخارى جرجس_عضو سابق لا يتشرف بالانتماء لهذا الخزب المتطرف البغيض؟!!!<br />الاسكندرية-مصر<br />أمانة الابراهيمية(باب شرق الاسكندرية)<br />انهة حزب عقيم يضطهد الاقباط المسحيين؟نعم انهة حزب غير ديمقراطى<br />محمول(0121714842)<br />zakhary2000@yah oo.com"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043225/http://www.20at.com:80/masr/2khbar/12465-2009-06-25-06-51-22.html"

[[comments]]
order = 2
subject = ""
author = "مشاريع للحزب"
posted = "2009-06-25"
text = "الحزب هيدرب الشباب الجامعى على ركوب التريسكلات وتوزيع انابيب البوتاجاز ونقل الخضار من سوق الجملة لاصحاب دكاكين الفاكهة<br />وهيدربهم على الهتاف والشعارات وعمل غسيل مخ للشباب - نفس تفكير حزب البعث العربى بتاع العراق"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043225/http://www.20at.com:80/masr/2khbar/12465-2009-06-25-06-51-22.html"

[[comments]]
order = 3
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-06-25"
text = "لابد ان تكون صايع او خطير على الامن العام و لهذا فقط سوف يعينك الحزب الوطنى (الغير)ديمقراطى<br />و سلمى على أغبياء الحزب الوطنى<br />هاهاهاهاهاهاهاه ا"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043225/http://www.20at.com:80/masr/2khbar/12465-2009-06-25-06-51-22.html"

[[comments]]
order = 4
subject = ""
author = "قوارب التهريب"
posted = "2009-06-25"
text = "عايز وظيفة<br />شوف واحد من بتوع التهريب يركبك قارب وتنزل على الشاطىء لايطاليا او اليونان واذا لم تغرق فى البحر ممكن تلاقى شغل هناك"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043225/http://www.20at.com:80/masr/2khbar/12465-2009-06-25-06-51-22.html"

[[comments]]
order = 5
subject = ""
author = "هاهاهاهاهاهاها"
posted = "2009-06-25"
text = "وظيفة خالية<br />انا خريج تربية ورحت اقدم اوراقى فى مديرية التعليم قالوا لى لازم يمضى على الطلب عضو مجلس الشعب عن الحزب الوطنى للناحية<br />رحت لعضو مجلس الشعب عن الحزب الوطنى قال انة عندة اربعة اجولة طلبات توظيف<br />وظائف اية<br />يا ابويا دى من سابع المستحيلات<br />الوظايف دلوقتى - مبيض - بتاع محارة - بتاع بلاط - تشيل رمل وزلط - تطلع طوب احمر فوق سطح العمارة - تشتغل صبى بقال - مساعد بياع فى دكان - بياع فى صيدلية<br />- توزع بانجو - تشتغل بلطجى اذا كانت صحتك كويسة<br />تترازل على مكتب يشغلك بقرف ويطردك<br />هذا هو الموجود"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043225/http://www.20at.com:80/masr/2khbar/12465-2009-06-25-06-51-22.html"

[[comments]]
order = 6
subject = ""
author = "ممدوح زكى زخارى"
posted = "2009-06-26"
text = "لا تصدقوا الخزب الوطنى<br />انهم كذبة كذبة كذبة<br />انهم المنافقين من اجل مصالحهم الشخصية و ليس مصالح الوطن<br />انة حزب الخونة المتاجرين بدم هذا الشعب المضلل<br />اتمنى ان تصل كلماتى هذة الى رئيسنا جميعا السد الرئيس/محمد حسنى مبارك"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043225/http://www.20at.com:80/masr/2khbar/12465-2009-06-25-06-51-22.html"

[[comments]]
order = 7
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-06-27"
text = "انت عاطل<br />انت صايع<br />انت قاتل<br />انت فاسق<br />انت داعر<br />انت معرص<br />انت قواد<br />انت فاسد<br />اذن انت صحيح من اعضاء الحزب الوطنى الديمقراطى المصرى"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043225/http://www.20at.com:80/masr/2khbar/12465-2009-06-25-06-51-22.html"

