[[comments]]
order = 0
subject = "الله يا عشرينات"
author = "نيفين"
posted = "2006-05-08"
text = "لا ان هذا لكثير على راى رايت بتلر ف ذهب مع الريح(هبهوب معايا؟)<br />مكسيم جوركى و فرويد ف يوم واحد<br />برافو يا عشرينات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114536/http://www.20at.com/article2.php?sid=779"

[[comments]]
order = 1
subject = "حياتى"
author = "نيفين"
posted = "2006-05-10"
text = "قرات ايميل انهردا يا هبهوب و انا كنت بعتللك<br />بصى انتى عارفه ان اختك ف المششتير و راكبنى الغباء اليومين دول<br />قوليلى على الاسم اصل و الله ببقى كتير مش مركزه ف التعليقات<br />ابقى ابعتيلى الاسم فى ايميل<br />(يختى)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114536/http://www.20at.com/article2.php?sid=779"

[[comments]]
order = 2
subject = "تحليل النفسي من خلال دراسات فرويد"
author = "رشا"
posted = "2006-05-24"
text = "التحليل النفسى من اهم الدراسات لدى فرويد لكن بصراحة اجد صعوبة في فهمه فلو كان ممكننا ان ترد علي ببعض من هذه الدراسات ولو قليلا كى اجيب عن التساؤلات التى لدى و شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114536/http://www.20at.com/article2.php?sid=779"

[[comments]]
order = 3
subject = "كان بيدرب كوكاييين"
author = "ابوعبيدة"
posted = "2006-06-05"
text = "تعرفوا ان الحج فرويد اليهودى كان بيدرب كوكاين علشان يعالج حالة الاكتأب DEPRESSION<br />اللى كان مصاب بيها<br />بيفكرنى بدل كارينجى بتاع كتاب دع القلق وابدا الحياء وكيف تكسب الاصدقاء اللى مات منتحر<br />لاء وكمان فرويد كان مؤمن ان LIPIDO تولد مع الطفل الذكر مقرونة بغريزة تجاه امه<br />والانثى تجاه اباها<br />يعنى هو اول واحد صاحب نظرية نكاح المحارم<br />وسلملى على علم النفس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114536/http://www.20at.com/article2.php?sid=779"
