subject = ""
author = "هننقط؟"
posted = "2007-03-02"
text = "مفروض نعمل على الموقع فقرة اهداءات<br />من بابا وماما وجدو وتيتة لدعاء الشامى وابراء اشرف بتقولهم مبروك وعقبال الاولاد<br />وكمان على عبد المنهم وعروستة مريم<br />الموقع دة كل مدى بينزل ودة سبب تاخرة فى اليسكا<br />مالنا احنا ومالهم؟<br />متقلبوة موقع شخصى احسن"
archived = "2009-04-19"
capture_url = "https://web.archive.org/web/20090419012749/http://www.20at.com:80/7ayatna/3345.html"

