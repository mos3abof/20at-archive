order = 9
subject = "يانعامة يالي مالك اسم oooooooo السعود تاج راسي احبهم واحد واحد"
author = "ريم بنت السعودية وبكل فخر"
posted = "2006-07-23"
text = ", وانت يا حيوان يالي ماكتبت اسمك في كل موضوع اجيه الا قي فيه ال سعود والخيانه ياحقير لا تتكلم عن اسيادك بها الطريقة والا والله اصابعك هالي كتبت الموضوع نبي نكسرها لك واحد واحد وبتندم وانا احذ رك كل التحذوالا جيدين بالحكي بعدين يانعامة يالي تكتب ومستخفي خلف النت وبدون اسم انكانك صادق بكلامك وهذ ا بعيد طلعه بالجريده وضع اسمك بالكامل وضع صورتك oooooooooooo بعدين مانويت ارد الا يوم شفته بكل المواضيع لكن لست انت وحدك من تتحمل ماكتبت حتى الموقع له نصيب فقد دنا اجله من العقوبة الصارمة ooooooooooooooooooooooooooooooooooooooooooo ونحن السعوديون لا نصدق اي كلام يقال عن دولتنا او حكامنا ولا نسمح لاي احد ان يتكلم عنها فهي مملكة الانسلنية ويكفي انها مطهرة حتى مافيها سفارة لا سرائيل كمصر وغيرها من العملاء فكل ماتحوكونة وتتكلمون عنه ضد السعودية هو من خبثكم ومصدركم صحف اسرائلية مثل يدعوت احرونوت وهي تبث سمومها لناقصي العقل امثالكم وكفى ان اختم بالقران واعظا فهو مصدري كسنيةooooo قال تعالى يا ايها الذ ين امنوا ان جاءكم فاسق بنبا فتبينو ان تصيبو قوما بجهالة فتصبحوا على مافعلتم نادمينooooooooo ومهما كان نحب السعودية ولو تتكلمو الى يوم الدين فهو لا يزعزع ثقة اي سعودي يحب وطنة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133424/http://www.20at.com/article2.php?sid=1088"

