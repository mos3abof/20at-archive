text = "فزيع ولون اتلخبطت , بس حقول حاجه<br />\" سيقولون ثلاثه رابعهم كلبهم ويقولون خمسه سادسهم كلبهم رجما بالغيب ويقولن سبعة وثامنهم كلبهم قل ربي اعلم بعدتهم مايعلمهم إلا قليل فلا تمار فيهم مرآء ظهرا ولا تسفت فيهم منهم احدا \"<br />مع اخذ التشكيل يا جدعان<br />يعني انا سمعت في مره انا سيدنا ادم كان من قاره استراليا<br />وشخص تالت قال من افريقا , زي اللي اكتشف امريكا العرب والمسليمن<br />الحاجات دي صعب جدا البنو ادم يعرف اصلها حتجادل فيها للصبح حتقول شفتها في الجزيره مش عارف مين طلع قال العكس<br />يعني مفيش راي محدد"
