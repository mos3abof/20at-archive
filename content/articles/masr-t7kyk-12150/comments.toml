author = "موظف عند طلعت بيه"
posted = "2009-05-21"
text = "ايه يا جماعة اللي انتو بتقولوه دا<br />دا مش ممكن يحصل ابدا<br />هي البلد سايبا ولا سايبا<br />اعدام ايه دا طلعت بيه يعرف كل الناس الكبار اللي في البلد<br />لا لا ما تخافوش دا طلعت باشا لو رفع سماعة التليفون حتشوفوا ايه اللي حيجرا<br />يلا بأه يا طلعت بيه ارفع سماعة التليفون وكلم المجرمين بتوعك<br />يلا باه يا طلعت بيه ارفع سماعة التليفون يا سعادة الباشا"
