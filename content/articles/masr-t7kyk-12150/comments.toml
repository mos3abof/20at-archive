subject = ""
author = "memy"
posted = "2009-05-27"
text = "فعلا احسن قضاء فى العالم قضاء مصر بس عمر مهيكون عادل زى عدل عمر بن الخطاب او حتى ربعة الناس شمتانه فى هشام علشان خد اعدام فى قتل رقاصة طيب العبارة الى غرقت وراح ضحيتها 1300 شخص وخد براءه هو دة العدل ولا هيا دى سياسة دولتنا الموقرة انا مش بغلط فى الدولة ولا فى حد انا بس بقول رايى لان دة مش حكم عادل وازا حكمتم بين الناس فاحكمو بالعدل بعدل ربا الى زكرة فى كتابة العزيز مش عدل س[ *** ]ونيا الى ماشى فى البلد انا عمرى ماسمعت عن هشام حاجة وحشة حتى لو بيعمل حاجة وحشة بيعملها فى السر مش الى مش هامو حد وبيسرق بيوتنا ومنظف جيوبنا ومستحقر السوق لحسابة بس ربنا مبيسيبش الازمة العالمية الى حصلت دى كان ابتلا من الله عز وجل لان الناس كانت طمعت اوى وكانت خلاص افترت وعلى فكرة انا واثق ومتاكد من براء هشام جدا وربنا معاك يا هشام صدقنى حتى لو انتا خت اعدام فهيكون امر الله ولو انتا بريق هترتاح من الدنيا والى فيها وتقابل وجه كريم ويقال ان القاضى الى حكم فى القضية خارج على المعاش كمان شهرين وهياخد مكافة نهاية الخدمة هدية جامدة جدا زى الحديد والحدق يفهم"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528084739/http://www.20at.com:80/t7kyk/12150-2009-05-21-15-54-19.html"

