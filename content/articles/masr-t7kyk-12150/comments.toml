posted = "2009-05-22"
text = "هشام مصطفى<br />عضو لجنة السياسات فى الحزب الوطنى الديمقراطى الحاكم<br />عضو مجلس الشورى ليس بالانتخابات ولكن باختيار رئاسى يعنى من اهل الثقة جدا<br />الراجل قلبة اخضر<br />بيحب الزهور والورد والنسوان الحلوة وبيحب كمان جمع المليارات - بياخد ارض بالكيلومترات من الدولة ببلاش ويبنى فيلل وبيوت وفنادق ويبيع<br />بيحب يمشى وحولة بطانة او حراسة او موكب او بودى جارد حديدى من ضباط الداخلية السابقين اولاد اللواءات السابقين<br />عايش الدنيا بالطول والعرض<br />تقوموا تعدموة علشان واحدة مطربة<br />لية<br />اية الظلم دة<br />القاضى دة مفترى ومؤجور وقابض من بتوع حزب اللة فى لبنان<br />هشام مصطفى برىء براءة الذئب من دم ابن يعقوب<br />انظروا الى وداعة وجهة داخل القفص<br />يا هشام<br />خللى اولياء الدم يتنازلوا ويقبلوا الدية<br />او تسلم نفسك لحكومة دبى<br />وهناك لو تنازل اهل الدم عن حقهم مش هيعدموك - هتدفع الدية وتروح<br />ادفع مليار جنية دية يا هشام واشترى حياتك<br />ولا تحرم الشعب من مواهبك فى مجلس الشورى ولجنة السياسات فى الحزب<br />اصل سياساتك مبتنزلش الارض ابدا<br />عرفنا سبب و[ *** ]تنا اية<br />ولية رغيف العيش مش موجود"
archived = "2009-05-23"
capture_url = "https://web.archive.org/web/20090523162736/http://www.20at.com:80/t7kyk/12150-2009-05-21-15-54-19.html"

