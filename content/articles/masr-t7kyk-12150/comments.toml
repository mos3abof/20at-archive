text = "ما اراة<br />هو<br />ان النقض سيقبل<br />وستنظر محكمة النقض فى القضية<br />ويصدر حكم بالسجن لمدة 15 سنة مع الاشغال الشاقة<br />بعدها بسنتين<br />سوف يصدر عفو رئاسى نظرا لظروفة الصحية وحالتة المرضية<br />يعنى عفو صحى زى ايمن نور<br />وسلم لى على البدنجان البلدى والبدنجان الرومى<br />ويعيش القضاء النزية قريب خالتى نزيهة بتاعة كوم الشقافة"
