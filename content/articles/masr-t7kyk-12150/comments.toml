text = "للناس الذين يشككون ويدافعون عن القاتل اقول ان ذلك مرض نفسي اسمه البحث عن النقيض فلو الناس كلها اتفقت علي البراءة مثلا لابد ان يظهر ناس يقولوا مجرم والع[ *** ] صحيح<br />وبالنسبه لعلاقته بالسلطه وكيف يضحوا به لان الجريمه وقعت في دبي وعند ناس شرفاء ليس لهم مصلحه فلم يتم مثلا تلف الشريط او تغيير الادله او وجود مخبول يقولون عليه هو القاتل وشهدوا بما يرضي الله فاصبح هناك ادله لكن لو الع[ *** ] مش حقولكم كان جايز اخذ تعويض"
