posted = "2009-05-27"
text = "والله العظيم ده حكم انسان ظالم مش بنادم مسلم بيحكم بكتاب الله وبعدلة فى ناس كتير من مصلحتها ازاحة هشام من سكتها علشان يخللهم الجو ويبرطعو فى البلد الله يخدهم كلهم فاكرين ايام مكان الحديد سعرة وصل 12000 جنية وكان هشام بياخد من حمادة عزو تقريبا تلت انتاج مصنعة وكان حمادة عاوز يبيعلو بنفس الثمن الى فى السوق وراح هشام جاب حديد مستورد ارخص من حديد عزو والسادة الافاضل الحكومة المصرية وقفت الحديد فى الينا وقالت انه مش مطابق للمواصفات الموصفات المصرية ورفع قضية على الدولة و[ *** ]بها دة بقا كان رد الدولة علية بس كان رد سريع اوى وصعب اوى ؟؟؟؟ هو لازم الواحد يكون حرامى علشان يعيش فى البلد دى"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528084739/http://www.20at.com:80/t7kyk/12150-2009-05-21-15-54-19.html"

[[comments]]
