subject = "دارفور.. الدار داركم ياعر ب ويا مسلمين"
author = "حسام الدين صالح"
posted = "2006-05-23"
text = "(عشرينات) مشكورة بعدد انفاسنا التي تقوم وتقعد.. لاهتمامها الواضح لتوضيح مشكلة دارفور للشباب العربي والمسلم..<br />إخوتي..باختصار شديد.. وبإيجاز أشد.. دارفور هي داركم.. دار كل العرب والمسلمين.. فدارفور..الآن.. في طريقها للتقسيم، وقبل أن تقسم أراضيهاعلى الجغرافيا يسعون الآن غلى تقسيم انسانها.. بين عرب وزرقة.. فلا مجال للتقسيم الديني(مسلم/مسيحي)..<br />فيا أيها العرب.. دونكم دارفور.. تحتاج لاهتمام عاجل، ودعم اعجل، إذا لم تقدروا على (الفلوس) فدونكم(الاعلام).. تعالوا وانقلوا ما صح من واقع، ولا تنقلوا انحيازات الوكالات الغربية..<br />دارفور.. تحتاج لبرامج عربيو واسلامية سريعة لاثبات الوجود العربي والاسلامي..<br />لا وقت للكلام.. الوقت للعمل.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125500/http://www.20at.com/article2.php?sid=847"
