subject = "هكذا نحن العرب"
author = "عماد صبرى"
posted = "2006-05-04"
text = "وهكذا نحن العرب لا نستطيع ان نتناقش خرجنا عن الموضوع الاصلى لمواضيع فرعيه اولا ليس المصرى افضل من المغربى او العكس ثانيا ان هذه العلاقات الموجوده فى المغرب موجوده فى مصر ايضا و منتشره ثانيا ان المصريون ليسوا ارهابيين انا مسيحى مصرى كنت فى قلب احداث الاسكندرية لم يقم بها مسلمون بل مجموعة من الصبيه المتشردين الذين لا يجدوا ما ينتمون له ليسوا مسلمين فكل اصدقائى المسلمين قد استنكروا هذه الاحداث وتحيا مصر مسلمين واقباط للابد كما ذكر الكتاب المقدس مبارك شعبى مصر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151430/http://www.20at.com/article2.php?sid=720"

