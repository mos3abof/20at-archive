text = "لما تسىء لمصر وانا علم جيدا انك لم تعلم عنها شىء الى القليل وكلهامن وسائل الاعلام وتتكلم بكل جرائه عنها قائلا انها بلاد الارهاب كيف وهيه التى قال عنها رسول الله (ص)ان اهلها سيظلو على رباط مع بعضهم البعض الى يوم الدين وذكرت فى القرءان ثلاث مرات بشكل مباشر وزارها سيدنا عيسى عليه السلام وتربى وعاش فيها سيدنا موسى عليه السلام وكلم الله عز وجل من على جبل الطور فيهاعاشى فيها سيدنا يوسف اتعلم كل هذا ام تفعل كما يقولون الغرب لاك بكل جهل"
