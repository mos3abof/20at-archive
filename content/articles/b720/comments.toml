[[comments]]
order = 3
subject = "جيل ورا جيل"
author = "عبدالله مفتاح"
posted = "2006-04-21"
text = "من 5 دقائق قرات عن ( مثقفات) سعوديات يطالبن بعدم الاجبار على النقاب<br />طبعا الناس ستقول ولماذا يفرض النقاب ولم يفرضه الدين؟<br />الموضوع ان جيل بيسلم جيل بمعنى انه من 100 سنه كان كل نساء مصر منتقبات ظهر قاسم امين وظهرت هدى شعراوي وغيرهم<br />طالبوا بحريه المراه وكشف وجهها الذي لان لها حق كشفه ثم طالبوا بما هو اكثر<br />وظلت دارة المطالب تتسع وتتسع وكل باسم الدين وبما سمح به الدين<br />حتى جاء جيلنا بعد 100 سنة ظهرت من تنادي بان الحجاب ليس بفرض( اقبال بركة)<br />وظهرت من تنادي( بالحرية الجنسيه)<br />وظهر من ينادي بالصاقه بين الشاب والفتاه<br />يعني كله تم بالتدريج<br />حتى وصلنا الان الى اننا لا نستطيع ان نسد ابواب الفساد فقد كثرت وكتر مغذوها<br />وكما جاء جيل هدى شعراوي وقاسم امين<br />وصل هذا الجيل للسعوديه<br />انتظروا كمان 100 سنه ولا تتعجلوا وستصبح<br />السعوديه مثل مصر<br />وانتظروا 100 سنه حتى تتحول مصر الى المغرب<br />وانتظروا 100 سنه حتى تصبح المغرب فرنسا<br />عفة ايه وبتاع ايه ده احنا في القرن 21"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151430/http://www.20at.com/article2.php?sid=720"

