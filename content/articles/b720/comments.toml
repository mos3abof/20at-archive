author = "احمد"
posted = "2006-04-23"
text = "السلام عليكم ورحمته وبركاته فى الاول انا هاتكلم لسالمه وهاقول ليه انت تعرفى ايه عن مصر اوعى تقولى اعرف الكتير لو تعرفى الكتير طب ايه هوه الكتير الى تعرفيه انت شاكلك بتتكلمى بلاثان الدفع عن نفسى فقد وليس الدفاع عن شعب يحاربه كل الغرب اتعرفين من هم الغرب الغرب هم الذين تقولين عليهم احبابكم او احباب المغرب انت فاكره ان لو هم ضحكم فى وشيك يبقو بيحبوكى لو فاكره كيده تبقى ماتعرفيش اى شىء وتتكلمين عن جاهل وتصبحين فى ذالك الوقت اكثر الاغبياء وانا لن اهينك ولكنى اقول لكى الرد المناسب على عدم فهمك للغير ملا يفهم يصبح غبى او لا يستحق الرد عليه فى اى حوار وانا لم ادافع عن مصر لانى اعرف ما هيه مصر واعرف انها مجد الحضرات ونها اولى الحضرات وانها افضل الشعوب اما من تقولى عنهم ارهاب فا فى الاول ياريت تحفظوم على نفسكم من انفسكم انت فاهمنى انت تعرفى ان مصر هيه الدوله الوحيده التى لم تقم فيها اية حروب اهليه حتى الان يكفيكى هذا ان لم يكفيكى فا ارسلى تعليقق على هذا التعليق سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151430/http://www.20at.com/article2.php?sid=720"

[[comments]]
