[[comments]]
order = 33
subject = "الووووو ياسالمه"
author = "احمد"
posted = "2006-04-24"
text = "السلام عليكم) فى الاول سالمه انا كنت باقولك انك ممكن تبقى غبيه وانك بدافعى عن نفسك كلات داه كان شاك لاكنه اصبح حقيقه انت بتاكديه بكلامك ثم تعالى هنا انت مالك ومال اسكندريه انت مالك ومال ابن عامى انت مالك ومال بلدى معلشى باقيت اقول بالدى وماقلتش بلادنا لان انت وغيرك خلانى احس ان مصر دى بقيت هيه الوحيده بلدى وبلد كل مصرى ومدتم عايزين كيده فائنا ماحبش انك ممكن تقولى انك منا ولا حتى من العرب ماشى لانك لو كنت من العرب كنتم حابيتم لغة العرب ماشى ومدام انت مش من مصر يبقى انت ماتتكلميش عن مصر فاهمه ومدام مش عارفه تفهمى الغرب يبقى مالكيش كلام معان انت بتقولى الغرب احبابكم واحنا بنقول الغرب اعدئنا يعنى انت باقيتى من اعدئنا طيب اذاى تدخلى فى مشاكلنا مش بقوليك غابيه صدقينى بجد غبيه | انا عايزك تردى عليه لاكن لما تردى ياريت اذاى تعرفى تقلى انك من العرب ماشى ولما تغلاطى تعرفى اذاى تخلى الى قدامك لما يرد يبقى غلطان مش يضحك عليكى ويقول شوف طلعت فى الاخر زاى ما توقعت ماشى (السلام عليكم)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151430/http://www.20at.com/article2.php?sid=720"

