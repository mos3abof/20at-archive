text = "ياه للدرجادي (الغرب) قدروا يفرقوا ما بينا (العرب)<br />انا كنت فاكرة ان لسة فيه امل اننا نهزمهم<br />بس يظهر انهم نجحوا بامتياز في الفرقة ما بينا<br />خلاص بقى انا بدعوكم انكم تهنوهم بالفوز ويا ريت تحضروا نفسكم وتستعدوا لاستقبالهم امبارح دخلوا العراق بصعوبة اما بكرة فحيدخلوا اي بلد بمنتهى السهولة<br />يلا روح استناهم علشان لما يجوا يدوكم على قفاكم"
