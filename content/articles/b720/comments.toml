subject = "المجاهره بالمعصيه"
author = "مسلمه"
posted = "2006-04-22"
text = "قال رسول الله صلى الله عليه وسلم \"كل امتى معافى الا المجاهرون\"<br />مش عارفه لو كان الشباب اللى بيعملو كده يعرفو هذا الحديث<br />طب هيقابلو ربنا ازاى وهم يعلمون انه لن يعفى عنهم<br />ملحوظه\"الانسه اللى ماضيه باسم مسلمه معلش ده اسمى هنا وياريتك تغيرى فى اسمك شويه\"<br />اللهم اهدى شباب المسلمين<br />الهم اهدى فتيات المسلمين<br />اللهم اهدنا معهم يارب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151430/http://www.20at.com/article2.php?sid=720"

[[comments]]
order = 23
subject = "الخيار بايديكم"
author = "يا شباب الاسلام ، إن الضياع الذي تعيشه الامة -أمة محمد صلى الله عليه وسلم - سببه التبعية للغرب الكافر والذي يؤسس لهذه التبعية ويسوسها هم الحكام الفجرة الذين باعو الامة وكرامتها لمصالحهم الذاتية ."
posted = "2006-04-23"
text = "الخيار بايديكم لاصلاح الوضع ، فما عليكم الا تحديد الهدف ، والعمل على تحقيقه ، الهدف هو بناء دولة الشريعة الواحدة التي يتفيأ ظلالها كل مسلم من الخليج الى المحيط ، ولن تكون هذه الدولة الا بازالة الحكام الفجرة ، فمعركتنا إذن هي مع هؤلاء الحكام الخونة ، فلبدأ أهل كل بلد بخائنهم (طاغوتهم).<br />وأما الزعم أن الفتاة لا بد أن تتعرف على فتى ، فهذا صحيح إذا كانت الجامعة أو المدرسة مختلطة أما إذا كان الامر غير ذلك فهذا لا يصح ، لذلك إذا أردت من تقليل تغرير الفتيان بالبنات فما عليم الا منع الاختلاط ، وحيث أن هؤلاء الحكام الفجرة ينشرون الرذلية في المجتنع المسلم ، فسيشجعون على الاختلاط ويزينونه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151430/http://www.20at.com/article2.php?sid=720"

