text = "و الله التعليفات اللى فوق دى بتفكرنى بمسرحيه سك على بناتك<br />المغاربه بيقولو احنا الاحسن<br />يردو الفلسطينين لا احنا<br />و هكذا<br />اصله مزاد علنى و مين يزود<br />يا جماعه اعقلو بقى و احسن تعليق تعليق بنت اسكنرانيه<br />سامعانى يا (سالمه)<br />اسكندرانيه من الناس اللى حصلت عندهم المشكله الاخيره<br />من اللى بتقولى عليهم ارهابيين<br />رجاء لو عندك كلمه كويسه تقوليها و لو معندكيش تسكتى"
