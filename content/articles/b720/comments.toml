text = "انا زعلت قوى لما قريت تعليق الأخ المغربى الشقيق بس انا زعلت عليه أكتر من ازعل منه لانه للاسف لسه عايش فى الحدود الموضوعة بأيدى الأحتلال ليس فقط على الخرائط لكن فى العقول فهذا مصرى وهدا سعودى وذاك مغربى....الخ<br />ياخى محدش سيد حد انت سيدى يخدمتك اللى تقدر تقدمها لأمتكوانت افضل منى بإيمانك فقط اذا كنت مسلم لكن غير كده انا اسف سوف اطأ بنعلى افواه الذباب<br />وما يحدث فى المغرب حدث قبل ذلك فى القاهرة وبيروت وسوريا وكل ده مستورد من الخارج عن قيمنا العربية المستمده من الدين<br />فأرجو ان نفيق فقد غرقت مقدمت السفينة بالفعل"
