subject = "بلا وكسة"
author = "مصــegyــري"
posted = "2006-04-23"
text = "و الله العظيم انتوا عالم زي العسل<br />الموضوع ببساطة (كان) عن العلاقات بين الشباب و البنات في الجامعات و المدارس<br />و اتقلب بقدرة قادر عن القوميات و التفاخر الفارغ بها<br />قال يعني احنا ( كعرب ) خلاص قطعنا بقيت الامم .. و فضينا بأه نشوف اي بلد فينا الاحسن<br />فاليكم جميعا ( حتى نتوغل اكثر بعيدا عن موضوعنا الاصلي )<br />اليكم اهدي رائعة احمد مطر ( بلاد لعرب )<br />وطن لم يبق من آثاره غير جدار خرب ،<br />لم تزل لاصقة فيه بقايا من نفايات الشعارات وروث الخطب ،<br />عاش حزب ا لـ...<br />يسقط ا لـخـا...<br />عـا ئد و...<br />والموت للمغتصب ...<br />وعلى الهامش سطر ،<br />أثر ليس له اسم ،<br />إنما كان اسمه يوما بلاد العرب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151430/http://www.20at.com/article2.php?sid=720"

