[[comments]]
order = 35
subject = "بلا وكسة 2"
author = "مصــegyــري"
posted = "2006-04-26"
text = "طيب بمناسبة المغرب بأه ( معلش اصل ايدي بتاكلني ) خدوا دي<br />كتبها احمد مطر بعد ان اعلن ملك المغرب انه خلاص هيبقى هو امير المؤمنين ( حدق يعني )<br />خد عندك<br />إ د عُ إلى دينِـكَ بالحُسـنى<br />وَدَعِ الباقـي للديَّـان .<br />أمّـا الحُكْـمُ .. فأمـرٌ ثـانْ .<br />أمـرٌ بالعَـدْلِ تُعـادِلُـهُ<br />لا بالعِـمّةِ والقُفطـانْ<br />توقِـنُ أم لا توقِـنُ .. لا يَعنـيني<br />مَـن يُدريـني<br />أنَّ لِسـانَكَ يلهَـجُ باسـمِ اللهِ<br />وقلبَكَ يرقُـصُ للشيطـانْ !<br />أوْجِـزْ لـي مضمـونَ العَـدلِ<br />ولا تـَفـلـِقـْـني بالعُنـوانْ .<br />لـنْ تَقـوى عِنـدي بالتَّقـوى<br />ويَقينُكَ عنـدي بُهتـانْ<br />إن لم يَعتَـدِلِ الميـزانْ .<br />شَعْـرةُ ظُلـمٍ تَنسِـفُ وَزنَـكَ<br />لـو أنَّ صـلاتَكَ أطنـانْ !<br />الإيمـانُ الظالـمُ كُـفرٌ<br />والكُفـرُ العادِلُ إيمـانْ !<br />هـذا ما كَتَبَ الرحمـانْ .<br />( قالَ فُـلانٌ عـنْ عُـلا ّنٍ<br />عن فُلتـا نٌ عـن عُلتـانْ )<br />أقـوالٌ فيهـا قولانْ .<br />لا تَعـدِلُ ميـزانَ العـدْلِ<br />ولا تَمنحـني الإ طـمـئنـانْ<br />د عْ أقـوالَ الأمـسِ وقُـل لي ..<br />ماذا تفعـلُ أنتَ الآنْ ؟<br />هـل تفتـحُ للديـنِ الدُّنيـا ..<br />أم تَحبِسُـهُ في دُكّانْ ؟!<br />هـلْ تُعطينا بعـضَ الجنَّـةِ<br />أم تحجُـزُها للإخـوانْ ؟!<br />قُـلْ لي الآنْ .<br />فعلى مُختَلـفِ الأزمـانْ<br />والطُغيـانْ<br />يذبحُني باسم الرحمانِ فِداءً للأوثانْ !<br />هـذا يَذبـحُ بالتَّـوراةِ<br />وذلكَ يَذبـحُ بالإنجيـلِ<br />وهـذا يذبـحُ بالقـرآنْ !<br />لا ذنْبَ لكلِّ الأديـانْ .<br />الذنبُ بِطبْـعِ الإنسـانِ<br />وإنَّـكَ يا هـذا إنسـانْ .<br />كُـنْ ما شِـئتَ ..<br />رئيسـاً،<br />مَلِكـاً،<br />خانـاً،<br />شيخـاً،<br />د هـْقـاناً،<br />كُـنْ أيّـاً كانْ<br />من جِنسِ الإنـسِ أو الجَـانْ<br />لا أسـألُ عـنْ شَـكلِ السُّلطـةِ<br />أسـألُ عـنْ عَـدْلِ السُّلطانْ .<br />هـاتِ العَــدْلَ ..<br />وكُـنْ طَـر َزانْ<br />احمد مطر<br />و هأو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151430/http://www.20at.com/article2.php?sid=720"

[[comments]]
order = 36
subject = "نعيب زماننا و العيب فينا و ما لزماننا من عيب سوانا"
author = "امال"
posted = "2006-04-28"
text = "السلام عليكم و رحمة الله و بركاته اما بعد اخراتى العرب انا فتاة مغربية ادرس بكلية الحقوق و ما قيل فعلا موجود بالجامعات و لكن ليست كل الفتيات مثل ما قيل فأي مكان نجد الطالح و الصالح و الحمد لله اليوم اصبح عدد المحجبات و المحترمات اكثر من عدد السافرات القليلات الاحترام و هذا راجع لوعي الفتيات بضرورة الحد من العلاقات التافهة التي لا تؤتي اكلها فانا و صديقاتي في الجامعة تربطنا علاقة و ثيقة مع الشباب الذين يدرسون معنا و لكن تبقى علاقة محبة في الله و بعلم اسرنا و اهلنا و لسنا نخجل من ذلك لهذا فليس عيب ان تكون علاقة بين شاب و فتاة بقدر ماهية هذه العلاقة و هنا اجع و اقول انما الاعمال بالنيات اما الذين يقولون انها مسؤلية البيت او الاهل او غيرهم فاقول لهم لا تلقوا بفشلكم على الاخرين ففي عصرنا هذا كل مسؤول عن نفسه و افعاله فالحمد لله يوجد اليوم كم هائل من الوسائل التي تساعدنا على تجنب اخطاء الاخرين و صقل شخصيتنا و مساعدتا فلا تلوموا و انتم الملامون و في الاخير اقول الحمد لله رب العالمين و الصلاة و السلام على اخر المرسلين سيدنا محمد عليه الف صلاة و سلام و شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151430/http://www.20at.com/article2.php?sid=720"

[[comments]]
order = 37
subject = "ليه الفرقة دي"
author = "امال"
posted = "2006-04-28"
text = "بسم الله الرحمان الرحيم يا ناس انا مغربية مسلمة عربية و بقولها بكل فخر فيا مصريين و يا مغاربيين سواء جزائر او تونس او ليبيا او المغرب او موريطانيا و باقي الدول العربية كافة ليه بتجرحو في بعض انا و الله العضيم بحب المغاربيين و الشرقيين على حد السواء لانها كلها بلادنا و لو كانوا مصر ارهابيين و بيقتلوا في بعضهم فا المغرب قبلهم كان ارهابي و اولادو قتلوا في بعضهم و لا نسيتو يا المغاربة 16 ماي و الجزائر قبلنا كمان و السعودية و الاردن و لبنان فده مش خطا الشعب ده غلط ناس متعصبين و فهمين الدين غلط فكفاية( معيار الناس رها هاذي هدرة تتحاسبو عليها ) اما اللي بيقول اني الغرب اعداءنا فتذكرو لا فرق بين عربي و عجمي الا بالتقوى فليه احنا حنغلط في بعض و في الناس لازم احنا نقرب من الغرب و نفهمهم احنا مين و دينا ايه زي معمل الاستاذ عمر خالد لما راح لدنمارك و عمل المؤتمر بعد اللي حصل و زي ما عمل برنامج يلا شباب ساعتها فهموا اننا مش متخلفين و حيوانات و ان دينا دين سامي و غالي فيا ريت(ما تشفيوش الناس فيا) يعني بلا كلام جارح بدون لازمة و اللام عليكم و رحمة الله و بركاته و السلام على خاتم المرسلين و لاي رد على اللي قلتو ده ايميليbiba.454@hotmail.com و انا ارحب باي تعليق او رد فحق الرد مكفول"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151430/http://www.20at.com/article2.php?sid=720"

