[[comments]]
order = 54
subject = "مش بس في المغرب"
author = "سرمد من العراق"
posted = "2006-07-14"
text = "رأي في موضوع العلاقات في المغرب انه شئ موجود في كل بلدان العالم منذ الازل ستقولون لي لا انت قلصت الموضوع فنحن نتحدث ونستغفر الله ونسب ونشتم لاننا نتحدث عن العلاقات المكشوفة, فأنتم تريدونها مستورة كما تعودنا نحن العرب عليها فاقول كفانا تسترا فنحن نفعل في الخفاء أكثر مما يفعله الاخرين والذين تسمونهم الكافرون, فبدلا من لعب دور الدعاة في هذا العالم والذي نجيده تماما دعونانسمي الامور بأسمائهاوكفانا، اما الذين يحاولون ان يهدو الاخرين ويقولون لهم كفى نحن جميعنا عرب اقول لهم خطأ نحن نتحدث اللغة العربية جميعنا ولكننا من بلدان مختلفة تجمعنا اللغة كما ذكرت والتخلف وشتم الاخرين والبكاء على انفسنا..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151430/http://www.20at.com/article2.php?sid=720"

[[comments]]
order = 55
subject = "حق رد"
author = "معتزة بديني و عروبتي و مغربيتي"
posted = "2006-07-15"
text = "السلام عليكم ورحمة الله.<br />والله العظيم أنا اتصدمت حين قرأت بعض الردود. فهذا مغربي يقول نحن أسياد المصريين و هذا مصري يقول بنات المغرب كلهم عاهرات و ذاك يقول الفلسطيني سيد الكل!!!!!!!!!<br />مثل هذه الردود تجعلك تحس بالاحباط. متى سيكون شبابنا المسلم و العربي واعي و في مستوى حوار بناء لا يجرح أحد. متى شبابنا المسلم العربي سيرى أن سبب هذه التفرقة بين العرب هي مخططات أعداء الدين ومن المؤسف أن نرى أن هذه المخططات تأتي أكلها فعلا.<br />انا فتاة مغربية أدرس في الجامعة. وصحيح ما جاء في الموضوع عن العلاقات بين الشباب في الجامعات. ولكن أظن أن هذه الظاهرة متفشية في كل البلدان. لكن الحمد لله الشباب الواعي موجود و عدده في تزايد . الفتيات الواعيات بدينهن موجودات و عددهن في تزايد أيضا.<br />لا أنكر أن هناك من يريد ان يجعل المغرب بؤرة للمعاصي. أن يمحي فيه كل طابع اسلامي وعربي.<br />ولكن أقول لكم هناك شباب مغربي لن يسمح بمثل هذا الأمر أن يحدث.<br />ولست أرجو من اخواني و أخواتي في كل البلدان الاسلامية، غير أن لا يساعدوا أعداء الدين فيضعوا بينهم و بين اخوانهم المغاربه أسوار يصعب ات ترى ما وراءها،ويصعب اختراقها.<br />وفي آخر كلامي . أخواني المصريين، أنتم شعب حضارة وعزة نفس و كرامة لا تعيرو اهتماما لشخص يرميكم بكلام ينم عن جهله و قلة عقله<br />لخواني الفلسطنيين ، فلسطين جرح دام في قلب كل مسلم، أنتم شعب أرض النبوه، فجاهل من يرميكم بكلام لا ينم سوى عن قلة عقله.<br />اخواني في الدين والعروبه في كل بلد مسلم<br />تقبلوا احترام و تقدير مغربية لكم.<br />أدعو الله أن يجمع أمة الاسلام يوما."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151430/http://www.20at.com/article2.php?sid=720"

