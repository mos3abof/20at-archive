author = "التحريات والمباحث"
posted = "2010-01-24"
text = "طبعا كلنا عارفين ان فيه حاجه في وزارة الداخلية اسمها التحريات والمباحث الجنائية حتى بالامارة كنا بنشوف ضباط لابسين ميري شرطه وبعدين نشوفهم لابسين ملابس عادية نعرف انهم راحوا المباحث<br />يعني ايه ضباط مباحث وتحريات يعني يزيلوا غموض اي حادث بالتحريات والمباحث وعلى سبيل المثال<br />شرطة دبي<br />في قضية سوزان تميم<br />في خلال 6 ساعات فكوا غموض الحادث بالتحريات والمباحث وعرفوا ان محسن السكري هو مرتكب الحادث بعد ما غادر دبي<br />في مصر بقا على ما يبدو ان السادة ضباط الداخلية بتوعنا ما عندهمش فكره عن هذا الموضوع<br />ضابط المباحث يعني جالس على مكتب وعنده شوية مخبرين ولما يتقبض على واحد يعذبوه يا اما يموت يا اما يعترف على نفسه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــ<br />لذلك ترفع الامر الى السيد حبيب العادلي وزير الداخلية<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2010-01-24"
