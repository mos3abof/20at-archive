subject = "اولمرت بيه"
author = "منتصر صلاح"
posted = "2006-04-16"
text = "انا اقول لاولمرت ده ابقي خلي عندك شوية دم عشان تعرف تتكلم ويا الناس كويس، ولازم تلاقي حد يقدر يادبك ويعرف يرد عليك."
