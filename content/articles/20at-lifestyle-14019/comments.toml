author = "علاء السمادوني"
posted = "2009-11-12"
text = "يا جماعة انحنا لازم ناخذ بالنا كويس من التمثيليات الجميلة اللي هيعملوها الجزائريين في الملعب وحت في الفندق وكمان في الطريق وطبعا التمثيليات فعلا ابتدت من اول لحظ وصله فيها لارضنا الغالية .. انا عارفهم كويس بواقع شغلي في السياحة وعارف اديه هما شعب عصبي قوي وعليهم كميه لئم مش علي حد نهائي .. ممكن تتاكدوا من افعالهم بفرنسا … احنا عايزنهم كأنهم الكلاب التي تعوي عند سيير القافلة ومندهمش اي اهتمام نهائي ولازم نشجع بلادنا كان في زلزال علشان نهز قلوبهم ونلعب باعصابهم قبلما هم يلعبوا باعصاب ابطالنا اللعيبة … واخيرا ربنا معانا ان شاء الله … ادعوا وقولواان شاء الله"
