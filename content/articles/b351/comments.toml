[[comments]]
order = 0
subject = "لا للانقسامات"
author = "قد يكون فوز حماس دافعا لخطة الكيان الصهيوني لفك الارتباط احادية الجانب"
posted = "2006-01-30"
text = "اما بالنسبة للانشقاقات داخل حماس فانااستبعد حدوثه نظرا لتركيبة الصف في حماس(داخل الاخوان بشكل عام )<br />التى تعتمد على السمع والطاعة<br />وبالنسبة للتخلى عن سلاح المقاومة فانا استبعده بسبب حلم حماس (الاخوان) فى استعادة ارض فلسطين كاملة والقضاء على ما يسمى باسرائيل وقيام الدولة المسلمة على كل الاراضي العربية والاسلامية ( عالمية الاسلام )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152117/http://www.20at.com/article2.php?sid=351"

[[comments]]
order = 1
subject = "صدقوا وهم كاذبون"
author = "ابو الدرداء"
posted = "2006-02-01"
text = "نصر حماس بمتابة اختبار لمصداقية الاخوان في طرحهم حلم اقامت دوله اسلاميهولكنهم كانوا يتذرعون دائما بانهم اقليه لكنهم الان اغلبيه فهل سيعلنون الدوله الاسلاميه لا اظن ذلاك على ضوء تصريحات خالد مشعل وقيادات حماس فهل سقطت ورقة التوت ام ماذا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152117/http://www.20at.com/article2.php?sid=351"

[[comments]]
order = 2
subject = "رد علي موضوع حماس"
author = "سلطان"
posted = "2006-04-27"
text = "بسم الله الرحمن الرحيم اعلم اخي حفظك الله ان ما قلت ليس صحيحاوعليناان نفهم ان الاسلام دين وهو كذلك دولة.وما كان العمل للاسلام ابدا يصب في مصلحة اعدائه سواء كان دين او دولة.ونرجوا ان نترفق باخواننا وندعوا لهم بالتوفيق عسي الله ان يجري علي ايديهم ما عجزنا عن تحقيقه منذ قرون.شكرا لكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152117/http://www.20at.com/article2.php?sid=351"
