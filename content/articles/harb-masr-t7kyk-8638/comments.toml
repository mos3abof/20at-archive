author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-04-01"
text = "يا جماعة خلينا واقعيين<br />ونعمل حاجات استباقية قبل ما طوفان المجاعة ما يهجم علينا<br />عايزين جزارين حمير وحصنه وقطط وكلاب"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620064015/http://www.harb.20at.com:80/masr/t7kyk/8638.html"

[[comments]]
order = 4
subject = ""
author = "مش لازم"
posted = "2008-04-01"
text = "حناكل ايه دي حلتها الصين الشعبية والفلبين ودول جنوب شرق اسيا على سبيل المثال وليس الحصر (تايلاند)<br />بياكلوا سحالي وابراص وصراصير وفئران ولحم الحمير ولحم كلاب ولحم قطط<br />بياكلوا اي حاجة تمشي على الارض واي حاجه تطير في السماء يعني ممكن ياكلوا حدايات مثلا<br />اي والله العظيم الناس اللي سافرت هناك شافت هذا الكلام<br />لا وفي افخم المطاعم كمان هناك حتلاقي وجبات من هذا النوع<br />يظهر ان هو دا الحل مستقبلا"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620064015/http://www.harb.20at.com:80/masr/t7kyk/8638.html"
