[[comments]]
order = 1
subject = ""
author = "البقرة الضاحكة"
posted = "2008-04-01"
text = "الخير فى البلد للركب<br />العيش بينباع بالتورة ( التورة اربعة ارغفة ) بلاش - والفول والعدس والرز دى مش مضبوط لانة بيعمل غازات فى المصارين والحكومة خايفة على صحتكم علشان كدة منعتكم من اكلة برفع سعرة<br />اما اللحمة فدى مؤذية جدا وبتزود نسبة اليوريك اسيد فى الدم وبتبوظ الاعصاب<br />يبقى الصالح والمفيد لكم انكم تاكلوا ورق الشجر والحشيش والنجيل ومما تنبت الارض من برسيم وخلافة<br />اما لحوم الكلاب والقطط والحمير فممكن تكفى الدولة من اسبوع الى اتنين<br />وهناك فتوى ستصدر عن الامام شبخ الازهر بتحريم الاكل والاكتفاء بمرة واحدة فى الاسبوع"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620064015/http://www.harb.20at.com:80/masr/t7kyk/8638.html"

[[comments]]
order = 2
subject = ""
author = "مش رضوه حسن ولا دعاء الشامي"
posted = "2008-04-01"
text = "طبعا مصر لازم تستفيد من ثروتها الغذاّية المحلية ونستفيد من الشعوب الاخرى اللي عدد السكان وضعها في موقف حرج زي الصين والهند وخلافه<br />اللي راحوا هناك قالوا ان هناك ثروة حشراتيه زي الفئران والضفاضع والصراصير والسحالي والابراص<br />والله العظيم الكلام بجد ودي فعلا ثورة غذاءية في بلاد جنوب شرق اسيا<br />ولازم نجيب خبراء من هناك يعلمونا ازاي نستفيد من هذه الثروة الكامنة<br />يبقى مش ناقص الا الفتاوي الدينية انا اعرف واحد شيخ وواحد قسيس جاهزين للفتوى بجواز اكل هذه الاشياء<br />واذا كنتوا عايزين تستفيدوا بخبراتي اتصلوا بيا على الفودافون اي رقم حرد عليكم"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620064015/http://www.harb.20at.com:80/masr/t7kyk/8638.html"

[[comments]]
