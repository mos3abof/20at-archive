subject = "تحية الى نهى الزينى"
author = "ابو حمادة الاسكندرانى"
posted = "2005-11-28"
text = "يدة تستحق عظيم التقدير والاحترام من كل مواطنى مصر..لا اجد كلام يوفيها حقها..سوف يكافئها اللة عما فعلتة ولن ينساها شعب مصر..اللة معك يادكتورة ونحن شعب مصر معك .(مواطن مصرى غير منضم لاى حزب او جماعة)"
archived = "2007-08-13"
