[[comments]]
order = 4
subject = "منقول"
author = "hala"
posted = "2005-11-28"
text = "قفت د.نهى وقفة مائة رجل وهي تدلو بشهادتها عن مخالفات قانونية شهدت حدوثها في الرقابة على الانتخابات. تقطعت بها الأسباب لكي تحول دون وقوع الخطأ. ولكنها لم تصمت؛ بل شهدت شهادة حق تكتب لها عند ربها. وأبت أن تسكت على الباطل؛ حتى لا تنعت بوصف بعض السلف: \"الساكت عن الحق شيطان أخرس\". إذ تقف شهادة المؤمن له يوم القيامة، وتكون النجاة والشافعة له يوم لا ظل إلا ظله."
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813233816/http://egyvote.20at.com:80/article.php?sid=82"

[[comments]]
order = 5
subject = "ياريت الرجاله بشنبات يبقوا زيها"
author = "احمد"
posted = "2005-11-29"
text = "للى عملته المستشارة نهى أمر أخلاقى<br />بس الظاهر إننا إتعودنا على قلة الاخلاق<br />ولازم نقف جنب الحق<br />حتى ولو على صوت الباطل<br />أحييكى سيادة المستشارة<br />ووفقك الله وسدد خطاكى"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813233816/http://egyvote.20at.com:80/article.php?sid=82"

[[comments]]
order = 6
subject = "إنها إرادة الشعب......و لا بد من احترامها"
author = "زائر"
posted = "2005-11-29"
text = "ل ما فعلتة سيادة المستشار انها احترمت قانون البلد الذى تعمل بة<br />و بما انها تعمل فى مجال القضاء فكان لا بد لها من احترام القانون الذى هو من صميم عملهاو ضميرها شاهد عماتعملة<br />يا ترى المجلس القومى للمرأة سيفكر مجرد تفكير فى تكريم سيادة المستشار<br />على كل الاحوال رسالة شكر و إمتنان من شاب عشرينى<br />شكرا سيادة المستشار بارك الله فيكى"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813233816/http://egyvote.20at.com:80/article.php?sid=82"

[[comments]]
order = 7
subject = "ألف ألف تحية"
author = "محمد السيد"
posted = "2005-11-29"
text = "بعا ألف ألف تحية للمستشارة نهي الزيني .... في زمن النهاردة .... يندر إننا نلاقي زيها ....<br />الحقيقة من ساعة ماأرسلت رسالتها ... غيرت حاجات كثيرة في واقعنا الأليم ده ...<br />وإن كان التغيير الأكبر... هو نظرة الدولة للقضاء بعد كده ... اعتقد إنها بكده عملت أزمة عند النظام .... مش حيعرف يحلها ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813233816/http://egyvote.20at.com:80/article.php?sid=82"

[[comments]]
order = 8
subject = "مين اللي قال الاخوان بيرفضوا قضاء المرأة؟؟؟"
author = "محمد السيد"
posted = "2005-11-29"
text = "انيا .... الإخوان مرفضوش اشتغال المرأة بالقضاء .... ولو نرجع لكتبهم وتصريحات مسئوليهم حنلاقي ده ....<br />كل الاعتراض علي الولاية العامة فقط ... والدكتور عصام العريان صرح انه مع كده لو اختار الشعب ذلك .... ياريت تتصحح المعلومة ... مش حنكون احنا كمان بنجيب معلومات مغلوطة عنهم .<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813233816/http://egyvote.20at.com:80/article.php?sid=82"
