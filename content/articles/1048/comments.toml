text = "بجد راجل دماغة جامده اوى بس المشكلة انه بجرد كداب كبير بس سياسى محترف ماهى السياسة كده شويه كدب على ابداع ولهم حاجة اسلوب الكلام يكون حلو هو كده بالنسبة الى كداب كبير"
