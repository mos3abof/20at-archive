subject = "فضحتونا"
author = "سمسمة"
posted = "2006-04-05"
text = "والله احنا اتعلمنا ان الكدب حرام كلن فيالسياسة والحرب الخديعة مطلوبة وياريت اي حد من زعماءنا العرب يحسوا على دمهم ويشغلوا مخهم شوية ونشوف اي تكتيكات يعني مش كده الغرب كلوا وشنا يا ناس فضحتونا، معلش يا اخ جوبلز شغلوني عن الكلام عنك انت والله عبقري ربنا يرحمك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131509/http://www.20at.com/article2.php?sid=654"

