text = "هذا التقرير جيد ولكن ينقصه المزيد., فلابد ان يعرف القارئ الكثير عن شخصيته وحياته وعن نظرياته التى تعد نموذجا وتدرس حتى الان , لذا من المؤكد ان لجوبلز العديد من الوجوه التى يجب ان نتطلع عليها وليس فقط قشور المعرفه!!!!!!"
