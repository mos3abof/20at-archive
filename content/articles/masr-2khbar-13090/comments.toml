[[comments]]
order = 2
subject = ""
author = "قصة الفساد فى مصر"
posted = "2009-08-29"
text = "المراة الحديدية<br />المؤهل : الاعدادية<br />تزوجت من ليبى وعملت قرشين من وراة وفتحت شركة مقاولات بعد رجوعها من ليبيا<br />بمساعدة برلمانى كبير من الشخصيات المهمة قوى<br />استولت على اراضى ملك الدولة فى مصر الجديدة وبنت عليها شقق وباعت الشقة الواحدة لاكثر من واحد<br />انفتحت خزائن البنوك لتاخذ منها المليارات<br />كيف هربت<br />بمساعدة البرلمانى الكبير بتاع مجلس الشعب يوم سفرها تم تعطيل الكمبيوترات المسجل عليها قوائم الممنوعين من السفر وسافرت<br />قصة مكررة عشرات المرات<br />وفلوس الناس بتسرق عينى عينك وتطير الى لندن<br />زى حكاية عودة الصيادين بكرة جهات سيادية تؤلف قصص بطولة وهمية عن انهم اللى جابوها وقبضوا عليها<br />يا حنين<br />خليكوا حنيينين عليها"
archived = "2009-08-30"
capture_url = "https://web.archive.org/web/20090830203737/http://www.20at.com:80/masr/2khbar/13090-2009-08-29-07-06-30.html"

