author = "مصطفى"
posted = "2009-08-29"
text = "البنوك الوطنية اللى بيسرقوا فلوسها بتعطى المودعين بالدولار فايدة اقل من واحد فى المئة<br />وبالجنية المصرى سبعة ونصف فى المئة<br />يعنى الحومة مع التضخم بتسرق اموال المودعين لان قيمة الفلوس بتقل<br />شكرا حكومة نظيف"
archived = "2009-08-30"
capture_url = "https://web.archive.org/web/20090830203737/http://www.20at.com:80/masr/2khbar/13090-2009-08-29-07-06-30.html"

