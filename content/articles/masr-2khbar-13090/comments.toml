posted = "2009-08-29"
text = "السيدة الحديدية زكية جدا<br />مضى عشرين سنة على كل الجرائم المالية<br />وطبعا سقطت كل تلك الجرائم بالتقادم<br />ولا عزاء للسيدات<br />شوية اجراءات وهيفرجوا عنها<br />كنتم فين من زمان"
archived = "2009-08-30"
capture_url = "https://web.archive.org/web/20090830203737/http://www.20at.com:80/masr/2khbar/13090-2009-08-29-07-06-30.html"
