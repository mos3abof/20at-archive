subject = "من علامات الكبرى ليوم القيامة"
author = "مصرية"
posted = "2006-09-03"
text = "الله يرحمه ويغفرله ويتولاه وعلى فكرة من علامات الكبرى ليوم القيامة موت الشباب فى سن صغير وهو سن العشرينات وربنا يرحمنا كلنا ويرحم جميع اموات المسلمين"
archived = "2006-11-02"
