subject = "البقاء لله"
author = "عزمى"
posted = "2006-09-02"
text = "البقاء لله فى فقيد الرياضة المصرية ولا أعتقد أن الكاتب يسخر من فاجعةالموت وخاصة أن اللاعب الخلوق محمد عبد الوهاب قد أضفى على نجومية لاعبى الكرة مصطلح جديد و هو الأخلاق قبل المهارة -الأخلاق قبل النجومية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145434/http://www.20at.com/article2.php?sid=1173"

