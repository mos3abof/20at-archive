subject = "اللهم اهللك امريكاااااااااااا"
author = "ريم بنت السعودية"
posted = "2006-09-01"
text = "اسفه اخواني سا اخرج عن الموضوع ................... اليوم القضاء الامريكي حكم على طالب سعودي بحكم قاسي حكم امريكا المعروف بالتلفيق ضد رجل قال الله ربي محمد رسولي والله ماكتبت هنا الا لتنفعلو معي انا لن اكمل قلبي تقطع دموعي لن تتركني ,l الرياض اليوم تضج وتضج شباب وشيوخ ضد امريكا , ادخلو محرك جوجل للبحث ........ موقع حميدان التركي ........."
