posted = "2006-09-03"
text = "اية الخرة بتاعك يا هواري انت ده .<br />جاتك 60 الف نيلة على دماغك بتستهزئ بالموت والعنوان زبالة ..<br />ارحمنا بقة يا اخي وارحم نفسك وروح شوفكل شغل تاني"
