author = "نيفين نيفى نوفا"
posted = "2006-09-03"
text = "صدمت لسماع الخبر و خصوصا انى سمعت يومها خبر وفاه شابين اخرين<br />حزننا كبير و لكن لا نزكيك على الله يا عبد الوهاب<br />الله يرحمه و يرحم وحيد و رامى جمعه<br />البقاء لله"
