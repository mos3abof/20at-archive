subject = "ربنا يرحمك"
author = "زيزو"
posted = "2006-09-05"
text = "الله يرحمك يا محمد .. وربنا يغفرلك ويصبر اهلك ويصبرنا والله زعلان كأنه قريبي .. يلا كلنا لها<br />تعليق علي الاخ اللي كاتب زباله .. اولا لما تيجي تنتقد حد مينفعش اسلوبك .. اكيد في اسلوب محترم عن كده وبعدين هو مش واخد الموضوع بسخريه هو بس مش مصدق بلاش الاسلوب ده يا جماعه بجد كده مش بنستفاد كده بنتخانق سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145434/http://www.20at.com/article2.php?sid=1173"

