order = 0
subject = "يا ريت نكون عرفنا الخلل فين ونسعى إلى إصلاحه من الرأس حتى الذنب."
author = "إبن بهية"
posted = "2006-11-15"
text = "هي دي المشكلة أن مسرح الدولة وأي شيء يعود للدولة وهو في الأصل للمواطن .. أقول أي شيء مملوك للمواطن الغلبان مستباح وماشي على كيف اللي ماسكه لأن الحدوته كلها كده ناس بتمسك ناس وناس بتشيل ناس وأهو كله هباب في هباب في زمن الواطي مبارك ... النهضة تكون عامة وشاملة تطبيقا لنظرية الأواني المستطرقة .. إذا رنت هنا هترن هناك وهناك وفي كل حتة في البلد .. يعني لو ربك سهل وخلص من من مبارك وعصاباته ونظامه الفاسد وجاء إلى مصر نفرين من أولاد بهية بجد راح تشوف مصر دي حاجه تانية خالص .. راح تلاقي مسرح وسينما بجد مش ماركة دينا ونيلة .. راح تشوف كورة بجد مش لعب العيال اللي هارينا بيه ده لأن الفساد يعم عموم النار في الهشيم فيحرق كل خير في البلد .. عندما يفسد النظام من رأسه (يعني حسني الواطي) وحتى أذنابه من أعضاء المجالس المحلية في القرى والنجوع من ماسحي الجوخ والأحذية من بتوع الحزن الوطني لابد أن تجد كل شيء فاسد وخربان .. هذه سنة الحياة وطبيعتها .. يا ريت نكون عرفنا الخلل فين ونسعى إلى إصلاحه من الرأس حتى الذنب.<br />إبن بهية<br />http://ibnbahya.blogspot.com"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015259/http://masr.20at.com:80/article.php?sid=1164"

[[comments]]
order = 1
subject = "الى المسمي نفسه ابن بهية"
author = "لا تنه عن خلق وتأتي بمثله"
posted = "2006-11-15"
text = "عار عليك ان فعلت عظيم<br />يا ابن بهية انت عايز تشتهر وتشهر المدونة بتاعتك<br />غلط كده تستغل الموقع وتقتحم المواضيع وتكتب كلام من عندك علشان خاطر تشهر المدونة بتاعتك وتشتهر على حسها<br />تماما مثلما فعل المدعو/ وائل عباس كان بيقتحم هذا الموقع وادعا انه دخل في المسيحية وشد انتباه القراء لذلك وبعد كده انكر. المهم انه اشتهر بذلك.<br />انت تبغي الشهرة من وراء ذلك<br />مين عارف يمكن يجي اليوم اللي يبقى لك فيه دور كبير (عضو مجلس الشعب مثلا)<br />ما هو الناس الموجودين في الاضواء الان في يوم من الايام كانوا عاملين زي ابن بهية ووائل عباس."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015259/http://masr.20at.com:80/article.php?sid=1164"

