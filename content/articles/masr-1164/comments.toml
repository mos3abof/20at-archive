subject = "مين ما يحبش دعاء"
author = "واحد"
posted = "2006-11-16"
text = "فعلاً اختيارك ومقارنتك هايله يا دعاء وأسلوبك جميل وملاحظاتك جيدة واستهلالك جيد زيدي من التباينات التي تذكريها أما من ناحية الموضوع فالشعب المصري كله كده لما يكون صغير يبدع ولما يشتهر ويبقى شيء يقول أي كلام بالمناسبة مش هند عاكف إنما هي نعيمة عاكف<br />واحد"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015259/http://masr.20at.com:80/article.php?sid=1164"

