subject = "برافو فاطمة وبرافو دعاء"
author = "سلمى"
posted = "2006-11-15"
text = "برافو عليكي يا دعاء فكرة حلوة قوي وفعلا عندك حق الممثلين اللي تعبونا وقرفونا هم اللي مشهورين ولاشباب الصغيرين اللي بيقدموا الكويس فعلا مش لاقيين حد يقف جنبهم الى الامام يا فاطمة انا شفت لها عرض \"ياحلاوة الدنيا مع فرة الورشة وكانت جامدة قوي"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015259/http://masr.20at.com:80/article.php?sid=1164"

[[comments]]
order = 3
subject = "مين ميحبش فاطمة"
author = "مفروسة"
posted = "2006-11-15"
text = "انا مش فاهمة والله ايه علاقة الاخ ابن بهية بالموضوع والاخ كمان اللي بيرد عليه ما يشتهر ولا يقعد في بيتهم احنا مالنا والنبي يا جماعة خلونا في الموضوع<br />معلش يا فاطمة نرفزوني وخلوني اخرج عن شعوري بس انت فعلا بنت حبوبة قوي وطريقتك حلوة قوي انا سمعت صوتك في الاوبرا وربنا معاكي وتوصلي للي انت عايزاه"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015259/http://masr.20at.com:80/article.php?sid=1164"

[[comments]]
order = 4
subject = "ملقوش فى ابن بهية عيب"
author = "فارس_fr"
posted = "2006-11-15"
text = "فى مثل مصري معروف بيقول \" قال ملقوش فى الورد عيب قالوله ياحمر الخدين \" .<br />بيتهيالى حضرتك اول مرة تقرا تعليقات اب بهية او حتىمقالاته لان انت لومتابعها وبتستناها زى اغلب الناس كنت عرفت قيمةكتاباته وتعليقاته وعرفت قيمتها وعرفت اد ايه قيمته !!!<br />طب انت ليه مذكرتش اسمك علىالتعليق ولا خفتمن هجوم الناس عليك ....<br />وبعدين يااخى ابن بهية ولا وائل عباس انت ليه حاقد عليهم ... اعملك مدونة واشتهر انت كمان ... ايه العيب ان الانسان يكون ناجح ومشهور فى مجاله !!!ياريت تراجع نفسك تانى ... واقرا اكترلابن بهية قبل ما تحكم علية"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015259/http://masr.20at.com:80/article.php?sid=1164"

[[comments]]
