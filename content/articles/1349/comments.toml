text = "افتكرت من ذالك الكلام لقطه من الفيلم يقول له السكران محمود الجندى فى مليون فلسطينى وعربى لكن فى ناجى العلى واحد بس وهذا ما تم فعلا<br />يوجد كثير مثله فى فنه لكن الخوف معهم وانا مثلهم لانتقدر على السلطات والى روح ناجى العلى لايوجد غيرك فى العرب"
