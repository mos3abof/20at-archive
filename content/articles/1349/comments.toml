text = "انا بقى مش بس معجبه انا منبهره<br />انا كنت عارفه معلومات بسيطه عن ناجى العلى و قرات قصيده الابنودى لانى عندى الديوان اللى فيه القصيده دى بس ميرسى جدا ع الموضوع لانه فادنى جدا بس قلب علينا المواجع مش كده<br />و ناجى العلى اكبر دليل على ان العرب فيهم ناس زى تشى جيفارا و احسن مش زى ما قال بعض الناس"
