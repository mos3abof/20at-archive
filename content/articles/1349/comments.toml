subject = "مهما دافعت ميت ميت (م د م م )"
author = "محمد حسنى مبارك"
posted = "2006-08-02"
text = "علشان الريس السادات كان راجل من وجهة نظرة التطبيع شىء طبيعى<br />و قالنا انة راجل ديمقراطى بيحترم الراى الاخر و هايخلصنا من اللى الزمن الاسود اللى كنا فية<br />اكيد فى حاجات كتيرة اتغيرت للاحسن<br />بس من الاخر لما اختلفت المعارضة معاه<br />كان حاجة من الاتنين- - - - - -<br />- - 1 - - > القتل<br />- - 2 - - > السجن<br />و هوا دة اللى احنا لسة فية حتى الان<br />و حياة امك يا مبارك بكرة تموت و تتجرس انتا وعيالك فى كل حارة من اصغر خرم لاكبر خرم فيكى يامصر<br />صباحك زى وشك يا مصر<br />( يعنى صباح الزفت و اٌلأرف على دماغك )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142711/http://www.20at.com/article2.php?sid=1114"

