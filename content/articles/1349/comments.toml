[[comments]]
order = 10
subject = "الريشة والموت ناجي العلي"
author = "خالد البربري"
posted = "2006-08-28"
text = "في البداية اشكر كل القائمين على هذا الموقع بما فيه من اعجاب وما فيه من حقائق في البداية انا شاب فلسطيني ملتحق في مؤسسة حنظلة في بيت لحم اود ان اقول لكل من سهر على هذا الموقع ولكل من اراد ان تضهر الشخصية القلسطينية المميزة صاحب الريشة الفقيرة ناجي العلي اقول لهم يجب ان نشير باصابع الاتهام ونقول من هم القتلى الحقيقية ومن هم الذينا قتلوا ناجي العلي يجب ان نسقط القناع عن القتلى الحقيقين اعداء الحرية والوطن اعداء الفقراء والقضية فهم عندما قتلوه قتلو لقمة الفقراء لماذ قتلوا ناجي العلي ؟ لانه اراد كامل التراب الفلسطيني لانه لعن ابناء الكامب الامريكي لان ناجي كان يقوم من النوم ويقول صباح الخير يا بيروت ومساء الخير يا فلسطين قتلوه لانه تهمته الانحياز للفقراء من اجل كل هذا قتلوه !!!!!!!!! ونحن قادرون على هذا العمل لكن نحن نيام اخشي ان ياتي يوم الحساب ونحن نيام ًًًَََّّ!!! واشكركم على هذا الموقع واقول يجب انا نوضع المتهمين اعداء الوطن في هذه المواقع خالد البربري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142711/http://www.20at.com/article2.php?sid=1114"

[[comments]]
order = 11
subject = "الريشة الفقيرة"
author = "رنووووووووووش"
posted = "2006-08-28"
text = "في البداية اشكر كل من اشرف على هذا الموقع وعمل على ان تبقي ذكري وقضية ناجي العلي باقيا في قلوبنا وفي ابداعنا<br />ناجي العلي صاحب الريشة الفقيرة التى لا تعرف الا الوطن العودة القضية الفقراء التى كانت لقمة الفقراء لكن قتلوها وقتلوا القمة!! ناجي العلي الرسام الكركتير العربي الذي كان دائما يقول فاطمة حنظلة العودة الثورة القضية !!!!!<br />والقضية القلسطينية والعربي لا تتحمل الاجتهاد الفقراء هم الذينا يموتون هم الذينا ينسجنون هم الذين يعانون معاناة حقيقية وانا لا اغالط روحي ناجي العلي الذي مات ولم يكتفي من رسوماته ولم يكتفي ما بداخله من ثورة وانحياز وقضية<br />ناجي العلي الذي احتفظ بريشته ولم يستطيعوا المتخاذلين برشقها باموالهم ناجي العلي الذي كان قاتل المتخاذلين كان يقاتلهم بريشته الفقيرة كانت الريشة دائما تتجه نحوا العودة والمتخاذلين وناجي العلي الذي كان يجر السفينة الفقيرة ولكن قتلوه وغرقة السفينة الفقيرة ّّ!!!!! المناضل الحقيقي دائم العطاء وياخذ حقه من خلال الاخرين وليسة على حسابهم ناجي العلي اباك امة الظاد نسية حرفها وباعت دينهاوخانت قضيتها<br />شكرا روان/فلسطين / مخيم الدهيشة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142711/http://www.20at.com/article2.php?sid=1114"

