[[comments]]
order = 13
subject = "الذكري الحبيبة"
author = "خالد البربري"
posted = "2006-08-29"
text = "نلتقي اليوم في الذكرى السنوية التاسعة عشر لرحيل الشهيد ناجي العلي ، لا لنبكيه أو نُأبِّنه، بل لنجدد العهد على مواصلة المقاومة والمضيّ بطريق الكفاح، الذي سار على دربه الشهداء، وقدموا أرواحهم الغالية على مذبح الحرية والاستقلال.<br />نلتقي اليوم لنتذكر الشهيد ناجي العلي، نتذكر قوافل الشهداء الذي قضوا في خضم المعركة والصراع ؟في ذكرى الشهيد ناجي العلي، لم يغب عن ناظرينا ذلك المشهد القاسي حين استهدفته يد الغدر في لندن بكاتم الصوت لم يغب عن ناظرينا الطريقة البشعة التي ابتكرها فاشيون متعطشون للدماء ، مُجرمون تدربوا عقود طويلة على أساليب الإرهاب المختلفة، لم يغب عن ناظرينا ذلك المشهد المروع، ولم تفارقنا المرارات التي غصت بها قلوبنا على فقدانه، وفقدان العشرات، بل المئات من قادة وكوادر وقواعد الثورة الفلسطينية. ولكن عزاؤنا أن المسيرة النضالية لم تتوقف، بل تواصلت !!!وهنا لابد ان نقف لنرفع رؤوسنا من حقول الرمال التي اضطررنا لوضع هذه الرؤوس فيها خشية ان نرى او نسمع، وخشية ان نقول نعم او لا، ونحن نحاول ان نرفع هذه الرؤوس اليوم من الطين او الرمال لا بد ان نشير بأصابع الاتهام نحو هؤلاء القتلة الحقيقيين وهم الذينا اشارا لهم ناجي العلي بانهم اعداء الحرية والوطن والقضية ؟؟يتعين علينا جميعا ان نصرخ بصوت مدو واحد: يجب ان نرفع رؤوسنا من الرمال لانه بلغ السيف الزبى..ويجب ان نحاسب القتلى الحقيقين وهم أولد الكامب الامريكي اقزام اوسلوا واقزام كامب ديفد وجنيف !!! والمتهمين هم كل شخص اشار عاليه ناجي العلي<br />عاشت الذكري ودامت الثورة<br />خالد البربري فلسطين بيت لحم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142711/http://www.20at.com/article2.php?sid=1114"

