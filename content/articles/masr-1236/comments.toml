[[comments]]
order = 0
subject = "تأييد للوزير"
author = "د. أحمد عزب"
posted = "2006-12-22"
text = "غريبة أمر الأسلاميين، عندما يجهرون بأرائهم لا يريدون لأحد ان يعارضهم، ولكن عندما يعبر شخص مصري في وظيفة وزير في مكالمة هاتفية عن نوستالجية لمصر التي كانت حتى نهاية السبعينات بدون حجاب، فهم يعترضون على حريته في إبداء رايه. الذين يعترضون على أبداء الوزير رأيه هم على شاكلة طلبة الجامعة الذين حاولوا قتل نجيب محفوظ وقتلوا فرج فودة."
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127114945/http://masr.20at.com:80/article.php?sid=1236"

[[comments]]
order = 1
subject = "مفاهيم خاطئه"
author = "د. سامى عمران"
posted = "2007-01-21"
text = "المشكله فى فهمنا الخاطى الحجاب هو فرض على المرأه المسلمه لا مجال فيه للاراء الشخصيه"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127114945/http://masr.20at.com:80/article.php?sid=1236"

[[comments]]
order = 2
subject = "حقيقه المشكله"
author = "باحث. حسن مختار-"
posted = "2007-01-21"
text = "المشكله هى قله المعلومات الدينيه لدينا بصفه عامه ان حجاب المسلمه هو فرض مثل الصوم والصلاه وكون ان بعضنا يجهل هذه المعلومه لا نلومه ولكن نلوم الجهات الاسلاميه التى عليها ان تعلم الناس الدين"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127114945/http://masr.20at.com:80/article.php?sid=1236"
