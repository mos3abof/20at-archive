subject = "السلام ده رساله وهيتسال عليع اللى ضيع البلد منه لله"
author = "dddddddddddd"
posted = "2006-03-01"
text = "يعنى هى المواضيع خلصت علشان يعمل اغنيه على قصه سيدنا ادم وازاى يقول ادم هو واحد بيلعب معاه الاصول يقول سيدنا ادم يا ناس ده رسول الله يحمل رساله الينا و وبنلوم الدنمارك اصلا الغلط من المسلمين اللى مش معرفين الاجانب بالاسلام وبدل ما عمل اغنيه يعرفهم بسيدنا ادم قال ينصح حبيبته تسمع كلام اقتداء بهذه القصه ثم لما هو عارف ان الشيطان هو اللى وسوس لسيدنا ادم مش امن حواء بيقول عكس فهمه ليه فى الاغنيه ويقصد ان لما سيدنا ادم سمع كلام زوجته خرج من الجنه ده تناقض فظيع يااما جهل<br />والغلط اصل من الرقابه لانها بتوافق على الكليبات الساخنه مش هتوافق على هذا الكليب هى اصلا فاضيه<br />ربنا ينتقم من اللى ضيع البلد"
