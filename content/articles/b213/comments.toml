author = "علاء"
posted = "2006-08-20"
text = "اريد اسأل كل من تكلم عن مصر اعرفكم ان مصر الدولة الوحيدة التى ذكرها الله بالقران سبع مرات<br />والدولة الوحيدة التى عظمها رسول الله<br />ام انت يا مغربى فانت ابدا لا يمكن تكون من المغرب المغرب بلد يحبه المصرين جدا واهل المغرب يحبون مصر فان كان ولابد فانتم تعرفون اصولكم ونحن نعرف اصلنا نحنا بلد الحضارة قبل الزمان بزمان بلد النور فى عصر الظلم كنتم بالجبال عيشين ومصر كانت تسطر الاسطير<br />اصحوا يا حقودينكرهكم لمصر معروف تذكروا مصر ومساعدتها لكم تذكروا مصر وتضحيتهل لكم الحقد ملاء قلوبكم"
