text = "انا وبكل شرف فتاة من السعودية وللأسف هذا الفنان يسئ سمعة السعودية بذكره انها وافقت على اغنية مثل هذه والله من جد هباله من جد السعودية التي بها البلد الحرام توافق على اغنية بها كلمات تمس الدين والأسوء انها في إطار محرم وهو الغناء خااااااااافو الله يوم العرض تستهين ياواطي بالدين<br />هذا اللي اقدر اقوله لواحد مستهزء بقصة سيدنا وابونا ادم عليه السلام<br />استغفر الله والله لوما الحشيمة كان عرفت كيف اهزئك واعلمك كيف تختار لحرامك من كلام ومن حلالك من كلام يامستهزئ"
