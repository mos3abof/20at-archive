subject = "أأنت كريم إنك بخيل"
author = "الفرعون المسلم :محمد"
posted = "2006-02-01"
text = "يا من تدعي باسم الكرامه إن الله وحده هو الكريم وأنت البخيل هل أنت تصلي وهل أنت تصوم وتزكي هل أنت تعرف الله وأنبيائه هل أنت تعرف دينك؟ جاوبني لو إنتا شاطر وعارف وشكر خاص مني لمن كان يعاقب هذا الرجل البخيل وشكر خاص إلي المسلم:عبد الله أنت أخي في الإسلام والمغربيه الحقيقيه ايضا أختنا وكلنا إخوه في الإسلام وكل عام والمسلمون والإسلام بخير والسلام علي المسلمين فقط الفرعون المسلم :محمد أحمد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

