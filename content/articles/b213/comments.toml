text = "أكيدأحنا كلنا أخوة ولا يصح انا يقول أخ على أخوة مثل هذا الكلام الذى يضم تلميحات سخيفة ولكن هذا المغربى لايمثل المغرب هو حالة نادرة لذلك لا نسطتيع انا نحكم على بلد بسب فرد ولذلك لأاستطيع أن أقول لة: لو كل كلب عواااا ألقمتة حجرا لأصبح الحجر بمثقل دينارى."
