[[comments]]
order = 56
subject = "يا اهل مصر لقد خربتو بتنا نحن المغاربة"
author = "خولة من المغرب"
posted = "2006-06-02"
text = "يا حبايبي يا اهل مصر بكلامكو ده انتو بتخربو بتنا والحمد لله,والسبب ةبكل بساطة لان المغرب بيعتمد اساسا عاى السياحة وطبعا اي واحد هيقرا التعليقات دي اللي من المفروض تكون عن اغنية تفاحة ادم واللي تحولت الى سياسة,باقول الناس دول هيكرهونا وبالتالي ميجوش عندنا وميبقاش عندنا سياحة ومنستوردش بضاعة من الخارج لاننا فلسنا وتيجي بلاد متخلفة تستعمرنا عشان المية ويتمحو المغاربة عن وجه الارض.<br />حد فيكم فهم حاجة؟<br />المهم ان الاخ الكريه اللي تهجم على مصر يبقى زبالة ولو انو خبر قديم,والاخوان المصريين اللي تهجمو على المغرب بسبب الزبالة ده يبقو...لانهم هم كمان تهجمو على المغرب بدون اي سبب مقنع,فيبقى تعادلنا وبالتالي حتى انا من حقي اذكر مساوئ بلدكو يا شاطرين.<br />انتو اولا سبقتونا للحضارة بيجي 100 سنة,وطبعا الحضارة دي فيها عري وجنس وووو...,وحجات كتير مبتفرحش ومبتشرفش وعلى شاشاتكم اللي مشهورة على صعيد العالم العربي,والدليل موجود على شاشة روتانا سينماو ملودي افلام و...ممكن حد فيكم يا مصريين يقوللي انو شاف مشهد فيه جنس في ربع فيلم مغربي؟<br />ممكن حد فيكم يقوللي,الحضارة وصلت عندنا امتى؟<br />انتو اصلا بتفتخرو بحاجة مبترفش,ولازم تكونو متاكدين اننا بنحبكو مع انكو اللي دخلتولنا المصايب والدعارة والمخدرات دي بسبب افلامكو المهببة اللي كل منفتح التلفزيون نلاقي يجي 20 30 واحد مصري بيبوس واحدة!<br />والدليل على اننا بنحبكو ان اي واحد قرا الكلام ده هيفتكر ان اللي كتبو مصري,انا باتكلم مصري احسن من بعض المصريين,والدليل على اني مش مصرية هو النقد اللي كتبتو عن الافلام المصرية واللي مش من مصلحة اي مصري انو يذكر النقاط دي.<br />وفي الاخر بقول ان لكل قوم سلبيات وايجابيات,وان سمعة المغرب زحشة لان اغلب سكان المغرب حاليا اجانب والمغاربة هربو لان الاجانب هجمو علينا,فاسعار العقارات غليت,وبما انهم غنادر(عندهم فلوس)واحنا مفلسين فبقة ايه رحنا سيبين ليهم المكان وخرجنا برةالبلد,والاقلية من المغاربة الباقية خادت عادات سيئة منهم ومن تم اصبحنا مثل المصريين حبايبنا.<br />ولازم تتاكدو ايها المصريون من انني والله لااقصد الاساءة لانني والله والله بحبكو.<br />اما بالنسبة للاغنية اللي كنت هانساها فلو تجاهلنا لباس الموديل في الكليب,فمظنش انها بتسيئ لنبينا الكريم ادم عليه السلام,واوعا تعيدها يا كريم,وتحياتي لكاتب الاغنية,وربنا يخزيك ياشيطان,والسلام عليكم,ورحمة الله تعالى,وبركاته."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

