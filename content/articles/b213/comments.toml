[[comments]]
order = 30
subject = "مصر ام الدنيا وهوليود الشرق"
author = "روحي وعمري ودمي فداكي يامصر"
posted = "2006-02-04"
text = "اولا لاغنية كريم فهي حلوة مووووووت ومش فيها اي اساءة لسيدنا ادم هو مش بيتريق بس مش عارفة مغزاها ايه ثم كريم مغنيها مش كاتبها ثانيا المغربي الزبالة اللي بيتكلم عن مصر يروح يشوف بلده ومش هندخل في البلاد بس لازم نحترم بعضنا كعرب زي الغرب واحنا عارفين احنا اقدم حضارة والمعارف خارجة من عندنا وحررنا ارضنا برجالتنا مش بمساعدات خارجية فتحيا مصر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 31
subject = "عادي"
