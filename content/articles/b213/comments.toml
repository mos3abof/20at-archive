text = "يعني ملقتشي غير نبي الله وتكتب وتغنى عليه هو أبينا وحواء أمناإن كنت مسلم فهل ترضي لأحدأن يغني علي أمك وأبيك جاوبني ياشاطر ربنا بيلعن اللي بيلبس سلسله لأنك تتشبه بالنساء وهذا يدل علي أنك لست كامل لإيمان روح صلي لك ركعتين إستغفر ربن فيهم"
