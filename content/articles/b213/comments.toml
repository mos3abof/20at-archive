author = "بسلة مسلمة مصرية"
posted = "2006-10-26"
text = "على فكرة يا جماعة انا كل ما بشوف قمم الدول العربية افتكر خيبتنا التقيلة وكنت بفكر دايما انا الرؤساء العرب هما السبب فى خيبتنا التقيلة وان الشعوب غير حكمها بمعنى ان احنا على قلب رجل واحد الى الابد اما بالنسبة لكريم فهو ملام والشاعر كمان ولو مكنش على انة غناها والتانى كتبها بس لاء دة كمان علشان جهلة ودة بقى مصيبة اعظم وبعدين دة مش هو لوحدة مش مجد القاسم كمان غنى اغنية اسمها ايوب دى بقى مش اسمها قلة ادب دى اسمها مهزلة"
archived = "2006-11-02"
