[[comments]]
order = 23
subject = "مصر هي من اسباب الحضاره العربيه والاسلاميه"
author = "تيماء"
posted = "2006-01-25"
text = "اولا بالنسبه للاغنيه يا كريم المفروض اننا مهما ادخلنا مواضيع فاغانينا ومسلسلاتنا وغيرها نبتعد كل البعد السلف الصالح كله والانبياء فهم اكبر من ان يكونو موضوع لاغنيه او غيره<br />ثانيا يا من تدعي الكرامه لك لبلدك المجهول يا مجهول الهويه يا مغربي لعنت الله على كل من اساء للمسلمين ولعنت الله على اوروبا التي تعتز انت وامثالك بها بصراحه تواجدك فبلادنا العربيه ماهو الا خزي وعار من انت يا نكره كي تتكلم او تحقر مصر يا تافه بسبب مصر انتشر العلم في كل دول الوطن العربي من مصر وفي مصر وبقادة مصر يا جاهل انتشر الاسلام وكانت اعظم الفتوحات يهياء لي انك فعلا لا تعي لما قلته ان كنت مغربيا حقيقيان اكتب وواجهنا بمغربيتك لنقول لك عيوب بلدك الشهيره باعمال السحر والدجل والدعاره وووغيره (عفوا لكل مكان مساوء ومحاسن وهو من اضطرنا لذكر شيء نكره ذكره)وان لم تكن مغربيا فانت مجرد حشره تافهه وحقيره ونكره لا معنى لوجودك فاذهب للعيش فبلاد الغرب الذين يستحقرونك انت وامثالك من حثالة العرب يا نكره<br />تيماء من السعوديه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

