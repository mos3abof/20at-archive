subject = "الى المغربى اسفه بس انت زباله"
author = "نيفين"
posted = "2006-01-25"
text = "انت انسان زباله<br />يابابا على اسم مصر التاريخ يقدر يقول ما شاء<br />و العرب من امثاللك هما سبب المصايب اللى احنا فيها<br />عيب و احترم نفسك و هى الدول العربيه فيها غير مصر<br />مع تالاحترام للاخوه المغاربه بس اصلا المغرب العربى ببلاده الثلاثه محسوبين غلط عاى العرب لانهم اصلا فرنساويين<br />اسفه للجميع على انى اسلوبى عنيف بس الانسان ده خرجنى عن شعورى لان لحد الكلام عن مصر و نقف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

