[[comments]]
order = 65
subject = "الى الاخت اسلام رياض"
author = "خولة من المغرب"
posted = "2006-07-21"
text = "يا اختي انتي بتقولي وبالحرف:\"يا عربى ارفع ايدك المصرى هوا سيدك\"اوبعبارة تانية:\"انتو متسووش حاجة واحنا اسيادكو\"او:\"احنا مغرورين لان...والحضارو جات من...واحنا...\"ومش عارفة ايه.بصي انتي مغرورة ومتستهلسش تكوني عربية لاننا مش كده.<br />بصو بقا انا زهقت من شتايمكو ومن غروركو،وللعلم احنا مبنفتخرش باننا اول دولة عربية بتبصلها اوروبا،لا،احنا زهقنا منها،احنا بقينا ضيوف فبلدنا وهما اصحاب الارض،وده مبيخليناش نفتخر،وياريت الاخ ال... اللي بيقول انو مغربي يبص على التعليق،احنا يابابا متفرحناش الحجات دي.<br />اما الوليعة الحمارة اللي بتقول احنا معفنين فانتي زي متكوني كتبتي تعليق عن نفسك،لان مفيش حد يفكر يتكلم بالطريقة دي الا اذا كان معفن،اه معفن.<br />واللي عايز يقوللي اني غلطانة او كذبت فحاجة او ان تعليقي كلو زبالة،فده ايميلي:khaoula_khl00@hotmail.com<br />والى خالد الشيباني:ممكن تكتبلي اغنية،انا صوتي اقوى من صوت كريم،دي اغانيه سهلة اوييي،انا بقدر اغني كل الاغاني،حتى ذكرى واصالة وام كلثوم كمان،يعني اقدر اغني،حضرتك عندك ايميلي،ممكن تسجلني او تبعتلي ايميل\"ارجوك انا فعرضك\"وتقللي اذا كنت موافق ولا لا.اوكي؟بااي.<br />وتحياتي لكاتب الاغنية,وربنا يخزيك ياشيطان,والسلام عليكم,ورحمة الله تعالى,وبركاته."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 66
subject = "الاحترام المتبادل"
author = "عطيه"
posted = "2006-07-28"
text = "السلام عليكم ورحمة الله وبركاته<br />فى البداية لا يسعنى الا السلام<br />وهذا عادة ما يبدأ به الانسان الكلام<br />هناك من يسب مصر وهناك من يسب المغرب<br />وهذا ليس من الاسلام من شئ<br />فلنكن امة عاقلة لنتفق أن هناك غلط ولكن يمكن تداركة وليس ان يسب احدنا الاخر<br />حتى يكون كل من يقرأ من موقعنا هذا<br />الاعتراف بأننا محترمين ولسنا بغير ذلك<br />وعلى كل شخص يريد أن يكتب فى هذاالموقع مراجعةضميرة وليخاف الله<br />والسلام علسكم ورحمة الله وبركاتة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

