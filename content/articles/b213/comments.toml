subject = "المطرب كريم ابو زيد يضع نفسة فى محل جدل"
author = "ماجد الشاذلى"
posted = "2006-03-06"
text = "يمكن ان تكون هذة الاغنية جذابة وتتطرق الى فكرة جديدة وتستخدم اسلوب الوعظ بطريقة فكاهية تتضمن الاشارة الى ان البنات دائما ما يصلون بالرجال الى مشكلة وعلى كل بنت ان تتذكر قصة سيدنا ادم وزوجتة حواء ولكن كان على المطرب الشاب ان يتذكر انة فى بداية مشوارة الفنى وانة يجب الا يكون فى موضع نقد فى بداية انطلاقة وهذا هو خطاة فى اختيار الاغنية ولكن الفكرة ليست سيئة وهذا هو رايى المتواضع _ ماجد الشاذلى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 39
subject = "نحن لسنا بصدد الحديث عن مصر او عن المغرب"
author = "ماجد الشاذلى"
posted = "2006-03-06"
text = "انا اسف ان انا بكتب تعليق للمرة الثانية ولكن انا ماقراتش التعليقاي الاخرى الا بعد ان كتبت تعليقى ولكن انا اود ان اقول ان النقد هنا للاغنية وليس للشعب المصرى او المغربى فهاتان الدولتان عربيتان ولو بالانتساب وكفاية ان السياسات بين الدول العربية غير متفقة وهذا هو السبب الاكبر فى ضعفنا فى التصدى للهجوم علينا سواء فى ديننا او فى ارضنا فيجب ان نحاول ان تكون الشعوب متقاربة او لاتحمل غضائن فهذا يجعل التقارب بين الحكومات جائز ولو فى المستقبل البعيد اما بهذا الاسلوب فنحن نوفر على الغرب مشقة تحقيق مبداهم القديم فرق تسد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 40
subject = "ماعدش فى رقابة"
author = "مصرية مسلمة"
posted = "2006-03-07"
text = "أنا استمعت للاغنية من قبل وبمجرد سماعى لها وانا معترضة عليها ولا أدرى هل وصلنا بنا الحال الى هذا الحد ... لم تعد هناك رقابة<br />ولا معايير دينية حتى وان كان هناك اختلاف<br />هل هذه قضية تسمح بالتبرير كيف سيبرر موقفه يوم القيامة امام العلى القدير<br />ملحوظة : لا ادرى لماذا يكيدون المكائد لايقاع المصرييين فى المغاربة ولماذا الان<br />لماذا يتكرر هذا الموقف على منتديات او شات مغاربة ضد مصريين وكأننا ضد اسرائيل<br />فوقوا ياعرب شوية وعيب كدة بقى كفاية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 41
subject = "سلام الله على كل العباد .. الرد من الشاعر خالد الشيباني مؤلف الأغنية"
author = "خالد الشيباني"
posted = "2006-03-09"
text = "الإخوة الكرام<br />السلام عليكم ورحمة الله وبركاته<br />لقد تابعت باهتمام كبير تعليقات الجميع حول أغنية تفحة آدم على مدى شهرين كاملين وأحزنني كثيرا مشادة كلامية دارت بين الأشقاء العرب دون داعٍ أو جدوى .. ولكني تابعت باهتمام الآراء والتعليقات حول الأغنية وأشكر الجميع المعارض والمؤيد<br />فالمعارض تحدث غالبا بدافع الغيرة على دين الله عز وجل وعلى سيدنا آدم عليه السلام أبو البشر وأبو الأنبياء عليه السلام .. وهو من هو في درجات الله العلى .. وللمعارض في الدفاع عنه والدفاع عن دين الله جزيل التقدير والاحترام والتأييد مني ( العبد الفقير للله ) سبحانه وتعالى ومن جميع عباد الله المؤمنين<br />والمؤيد قد وصل إليه المعنى الذي أريده وتطوع للدفاع عنه وله ما للمعارض من التقدير والاحترام والتأييد<br />وهذا تعليقي على الموضوع<br />أولا : ما أثير حول الأغنية ( فرقعة إعلامية ) فالصحفي الذي يهاجم أغنية تفاحة آدم وهى ( في الأساس ) تذكر الناس بالحقائق وبقصة الخلق بشكل مبسط وفكاهي ستجده يمجد ويمدح<br />في مطربات عاريات يغنون أكثر الكلمات إسفافا وسقوطا علانية<br />ثانيا : الحقيقة التي أهملت ( ربما لأن بعض الصحفيين لا يعرفونها إنني والفضل كله لله شاعر فصحى ولي أكثر من ديوان شعر باللغة العربية .. وعضو إتحاد الكتاب المصري ( أي أنني أعبر عن رأيي كشاعر ( والكلمات كشعر ليس فيها أي إساءة بل هى تذكير بالحقائق الثابتة عن طريق الأسطورة الشعبية لتفاحة آدم<br />ثالثا : كان أول نجاح وفقني الله إليه كتابتي لأغنية لون شعرك لنفس المطرب ( كريم أبو زيد ) وقد لاحظت تأثير الأغاني على الأطفال مما دفعني لان أجعل الأطفال تغني وتحفظ كلام له معنى ومضمون يسأل عنه الكبار فيجيبونه بسرد قصة الخلق من القرآن .. في نفس العمل الفني الذي يحبه الكبار وتثير التفكير في الحقائق لديه<br />( وهى معادلة صعبة أرى أن الله سبحانه وتعالى وفقني فيهابنجاح الأغنية جماهيريا )<br />رابعا : مع التدني السائد في - معظم وليس كل - كلمات الأغاني وانتشار الاباحية في الافكار والعري في الكليبات - فوجود أغنية تنجح وتنافس وهى تتحدث عن الحقائق ( مثل تفاحة آدم ) تحدي لطريق الاباحيةويكفيني ما وفقني الله إليه من نجاح ويكفي شرف المحاولة والاجتهاد بهذه النية .. ومن يرى أن ذكر إسم سيدنا آدم عليه السلام غير لائق في أغنية ( فهو يريد أن تصبح الأغاني ملهاة لا ذكر فيها لحق ) والأولى به أن يعترض على ذكر لفظ الجلالة بلا داعي أو جدوى في أغاني العري الراقصة<br />في النهاية أكرر شكري للجميع مؤيدا ومعارضا .. وهذا تعليقي على ما أثير حول الموضوع<br />والله المستعان على ما يصفون<br />الشاعر<br />خالد الشيباني<br />9 - 3 - 2006"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 42
subject = "تفاهه وغباء"
author = "توتة"
posted = "2006-03-10"
text = "الاغنية دى تفهة واللى بيغنى اكثر تفاهه وبعدين ياجماعه موضوع الكليبات دا اصبح ممل اوى وانا شايفة اننا كده بندية اكتر من حقة يطلع مين دا عشان نتكلم علية ويطلع مين دا عشان يتكلم عن ابو البشر سيدنا ادم وبعدين احب اقول ان الاساءة بتيجى من داخلنا مش نتكلم عن برة فى الاساءة للرسول الكريم . غباء بقة بالنسبة للحيوان اللى شتم مصر دا مجرد انسان غبى وحيوان ميعرفش مصر دى تبقى اية وبعدين مغرب اية وبتاع اية هوة فى دولة اصلا اسمها المغرب بجد اول مرة اعرف دى بلد نكرة مالهاش وجود"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 43
subject = "لمادا الأنبياء؟"
author = "محمد المغربي الحقيقي"
posted = "2006-03-12"
text = "تحية طيبة لكل مسلم غيور على دينه عربيا كان أو أعجميامصريا كان أو مغربيالا فرق.<br />في البداية لا أدري لمادا ثارت ثائرة الإخوة المصريين عندما ادعى أحد التافهين _وما أكثرهم_أنه مغربي ويكره مصر ؟لدرجة أنهم حولو الموضوع من النقاش حول مدى شرعية الأغنية الى نزاع مصري مغربي ؟<br />والأغرب من هدا وصلت عنصرية بعضهم الى تعداد مساوئ المغرب والتشبث بالأغنية فقط لأنها مصرية؟أنا هنا سأسأل سؤالا واحدا فقط .لوفرضنا أن هدا المغربي شتم فرنسا هل سيهب الفرنسيين للدفاع عن بلدهم بهده الألفاظ وهده الحماسة الزائدة؟الجواب لا.<br />هم سيجيبون ويجيبون أي إنسان معقد مثلكم وأستثني الواعين منكم وهم كثر والحمد لله بالعلم والعمل وحسن السلوك لا بالعنتريات والكلام الفاضي.ثم لمادا هدا الهجوم الكامل على المغرب؟فكل العيوب التي دكرت عن المغرب هي موجودة وبكثافة في مصر وربما أكثر إحترافية،السحر والمخدرات والدعارة والنصب والإحتيال والنشل بالطرقات ،بل وهناك من إدعى النبوة نساء ورجالا ،وهده الوسخات موجودة في كل دول العالم على حسب أنظمتها ووضعها الإقتصادي ،ولربما كان الفرق بين المغرب وكثير من الدول العربية أن وسخنا يخرج الى الخارج بسبب تهاون مسِؤولينا،ولكن بالمقابل الدباب لا يدهب إلا حيث الوسخ والعفن،لو أن رجالكم يخافون الله ولديهم المروءة لما وجدن لهم طريق هؤلاء الشراميط.وهناك مسألة أخرى،أنا أدعوا أي مصري وأي عربي أن يزور المغرب وبنية الإستطلاع وليس بنية الفساد وسوف يجد أن هناك الكثير ممن لا يعرفن عن الله إلا اسمه وهمهم الوحيد الفساد في الأرض والمال.<br />وطرف آخر حتى ولو كان قليلا ملتزما بمعنى الكلمة وأموال الدنيا كلها لا تزيحه عن مبادئه،بينما في مصر وللأسف مع أغلب المصريين تزيغ أعينهم عندما يرون المال وهدا ما لمسه بعيني،والأهم من هدا كله عيب علينا أن نعمم فالخير موجود في كل مكان وبدلا من أن نصفق لكل من هو من بلدنا حتى ولو كان سيئا علينا أن كون واعين أكثر ونهتم فقط بما هو صح حتى ولو كان ضدنا.أما فيما يخص الأغنية فهي تافهة لا من ناحية المحتوى ولا الشكل ومرة أخرة نكتشف أن فنانينا جاهلين وبعيدين كل البعد عن الدين؟وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

