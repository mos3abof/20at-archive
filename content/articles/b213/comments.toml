subject = "مالكم انتو"
author = "المغربى"
posted = "2006-01-11"
text = "المغرب يالمصرى انت البلدة العربية الوحيدة اللى عم تنظر لها اوروبا<br />نحنا ما نختلف عن اسبانيا والبرتغال وباقى البلاد الاوروبية الرائعة الجمال<br />لكن بلدتكن هيدى سبب عار للبلاد العربية وهلا انتو اللى تنتشر عنكن الدعارة لانكن اهل لهيك بسبب كمون الحرية عنكن ما متلنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 10
subject = "البعض يحاول التعرض للإنبياء للدعاية"
author = "عبدالله"
posted = "2006-01-11"
text = "يعني كل شئ عملوه في الكليبات عري ومياعة فضاقت عليهم الدنيا ولم يجدوا سوي التعرض لأنبياء الله تعالي ... اللهم صلي علي سيدنا محمد وجميع أنبياءك.<br />ملاحظة: الرجاء من أخواني أن يحبوا بعضهم فلا أحد يتعرض بلد الأزهر مصر ولا بلد الطيبة المغرب فكلنا أخوة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
