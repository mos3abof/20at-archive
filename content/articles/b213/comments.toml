text = "لاا<br />اخوة هيدى عند اهلك<br />لكن نحنا نرفض امتال المصريين ان يتشبهو عنا<br />وهذا تحذير للجهال امتالكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 12
subject = "برضه إحنا أخوة يا أخ مغربي"
author = "عبدالله"
posted = "2006-01-12"
text = "ملاحظة يا أخي مغربي : حضرتك بتتكلم بالهجة الشامية ومش باللهجة المغربية ... فهل أنت تتهجم علينا علشان تخلينا نكره البلد الجميل المغرب وإلا إيه؟<br />والعموم احنا برضه أخوة وبنحب المغرب ومش هنكرها مهما عمل العاملون .<br />أخوك عبدالله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 13
subject = "الى المغربى"
author = "الفرعون"
posted = "2006-01-13"
text = "انا عارف انتا جنيتك اية وانتا على العموم راجل زبالة<br />والمغاربة انتا بعرفهم بحكم تواجدى فى السعودية وهما بيحبوا مصر جدا جدا اما انتا فبعد خروجك من بلدك انتا حاقد على مصر علشان مش عاوزين ندخلكم ؟<br />الحل انك تحمل السلاح وتدافع عن بلدك بدل ماتشتم فى مصر ولا عاوزنا نحررهالك يابابا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 14
subject = "\"مغربي\" ليس مغربي"
author = "مغربية حقيقية"
posted = "2006-01-13"
text = "السلام عليكم<br />الإخوة المصريين, أرجو ألا تغضبوا مما قاله السيد آنفا, فحاشا لله أن يكون مغربي, وكما قيل, فلهجته لا تمت للمغربية بصلة , و إلا كنت كنكدب أسي \"مغربي\" كدبني قدام الناس .. أصلا مافهمتش علاش هاد الجبن كله, ما عندكش الشجاعة تهضر بصفتك الحقيقية ؟؟<br />إيوا شغادي نقول, حسبي الله ونعم الوكيل."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 15
subject = "إلي أختنا الفاضلة مغربية حقيقة"
author = "عبدالله"
posted = "2006-01-14"
text = "جزاكي الله تعالي كل خير وإحنا بنعرف المغرب البلد الجميل ونعرف أهل المغرب الطيبين ومش هيجينا واحد ويلخبط علاقاتنا بهذا البلد الإسلامي الجميل ... وأنتي أختنا في الإسلام وعلي راسنا من فوق يا أخت مغربية وربنا يجمعنا بيكي وبأهل المغرب وبكل المسلمين في الجنة عند رسولنا الكريم ... قولي آمين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 16
subject = "شكر خاص من الشاعر خالد الشيباني"
author = "خالد الشيباني"
posted = "2006-01-15"
text = "شكرا للشعب العربي اللي كان بيناقش الغنوة وفجأة مقدرش يمسك نفسه من غير م تسب كل دولة الأخرى<br />والله يا جماعة أنا المفروض أكتب غنوة عن الإخوة اللي بيسمعوا كلام الأغراب ويقتلوا بعض ويتفرجوا على إخواتهم بيتقتلوا<br />تفتكروا الموضوع ده هيعجكبوا ولا هتقولوا ده فيه مساس بالعلاقات العربية<br />ع العموم شكر خاص لكل المشاركات<br />الشاعر خالد الشيباني<br />مؤلف لون شعرك وتفاحة آدم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

