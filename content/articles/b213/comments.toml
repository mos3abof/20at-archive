subject = "مالكم انتو"
author = "المغربى"
posted = "2006-01-09"
text = "انتو هيك جهال يالمصريين<br />كل شىء ما عم تفهموة جيدا وهيك تربطوة بالااديان والانبياء<br />ليش ماعنكن البساطة متلنا ؟؟؟<br />واللة كتير نسمع عنكن انكن جهال وكتير الجهل معكن لكن بهيك اتاكدت بعينى انكو فعلا بلدة عربية متخلفة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

[[comments]]
order = 6
subject = "فينك يا ادمن"
author = "المصري ;)"
posted = "2006-01-09"
text = "يا ريت يا عم مغربي تقدم اعتذار للمصريين<br />لانك غلط فيهم<br />او تعدل من اسلوب كلامك-مع الاعتذار برضه- او الرجاء من الادمن بمعاقبة هذا المغربي<br />اللي بلدهم مليانة مخدرات ودعارة عالمكشوف ومسميين نفسهم عرب<br />ماتغلطش في حد وانتو كلكو غلط<br />والكلام عن كريم مقنع وجيد بسبب انه لا صوت ولا صورة<br />وطالع على الشاشة بمساعدة ابوه لانه مؤلف<br />يبقى احسن مايغنيش ويسيب مكان لحد يستاهل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131840/http://www.20at.com/article2.php?sid=213"

