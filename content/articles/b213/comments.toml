author = "اسلام نصر - الاسكندرية"
posted = "2006-02-03"
text = "على فكرة .. الموضوع مفهوش اى اسأة لسيد البشر ( سيدنا أدم )<br />هذا مجرد حكى للقصة فى شكل اغنية مرحة .<br />وكريم ابو زيد .. او بمعنى اصح كاتب الاغنية .... قال تفاحة ادم ....<br />وانا شايف ان .. بلاش نكبر المواضيع ممكن تكون لمصالح شخصية ....<br />( فرقعة موسم )"
