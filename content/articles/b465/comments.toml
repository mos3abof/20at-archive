order = 0
subject = "ليه مش خير"
author = "اروى"
posted = "2006-02-19"
text = "ليه ولا كتاب كده خالص دا احنا اجازة او دراسة ماما بتطق لان احنا بنسيب كل حاجة ونقعد نقرا فى اى حاجة مع ان ماما هى اللى علمتنا نقرا كل الكتب اللى نشوفها دا احنابنقرا الورق بتاع ساندويتشات الطعميه اللى ما يقراش ده يبقى جاهل وغبى لامؤاخذه"
