[[comments]]
order = 1
subject = "انا دودة قراءه"
author = "sweet_princess"
posted = "2006-02-19"
text = "انا بقى مدمنة قراءه بحبها جدا لدرجة ان اخويا مسميني دودة قرايه لما بمسك كتاب مابسيبوش من ايدي الا لما اوصل لاخر صفحه بجد انا بنسى نفسي مع الكتب لدرجة ان ماما بتقوللي ياؤيت حبي كتب الدراسه ولو حتى ربع حبك للكتب التانيه (لاني بصراحه ودا سر بيني وبينكو بكره كتب الدراسه زي العمي وما بصدق الاجازه تيجي )والحمد لله انا عندي دلوقتي مكتبه معقوله فيها مالذ وطاب من كتب يوسف السباعي عندي كتبه كلها تقريبا وكمان احسان عبد القدوس وانيس منصور واي كاتب ممكن يكون كويس انا بقراء له لاني بحب اعرف ولو حاجه عن كل حاجه وبحب احط منخيري في كل حاجه وعلى فكره كمان ((غلطان اللي مش بيحاول يقراء ))لان القراءه بتديك معلومات اكتر وبتوسع الادراك وبالرغم من كده انا مش بدعي ابدا اني انسانه مثقفه بالعكس انا بحس بجهلي لما بلاقي حد بيعرف معلومه انا ما اعرفهاش وما ارتاحشي الا لو عرفتهاوعملري ما شفت كتاب وعجبني مع واحده من صحباتي الا ولازم اشتريه لاني بحب توكن ليا كتبي الخاصه بيا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115026/http://www.20at.com/article2.php?sid=465"

