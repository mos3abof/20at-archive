order = 2
subject = "القاريء الممتع"
author = "أكرم"
posted = "2006-02-19"
text = "بالرغم من كرهي الشديد لشعراء الحداثة ( مثل ادونيس ) الا انني افضل ان انقل بعض وجهات نظرهم في هذا الموضوع لانها جديرة بالمعرفه<br />القصيدة التي يكتبها الشاعر في حد ذاتها ابداع منقوص لا يكتمل الا عندما يشعر القاريء بما بصدر الشاعر ( اللي بين السطور يعني ) و ينفعل به و بذلك يكتمل الابداع لذلك لا يقرأ شرع الحداثة الا الشعراء انفسهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115026/http://www.20at.com/article2.php?sid=465"
