[[comments]]
order = 2
subject = "أخو الريس"
text = "الفكره (كويسه)<br />المقدمه (ممتازه)<br />الماده (اى كلام من اى كتاب أوز ربع ساعه تفكير)<br />الاقتراحات( عشان مش يبقى نقض هدام)1-كان لازم يبقى فى اراء بنات من الاتجاهين-المعارض والموافق-<br />2- كان لازم يبقى فى اراء شباب فى الموضوع<br />3- من الضروى فى النهايه زى ما عودتونا ان يبقى فى اثاره للقراء انهم يكتبوا اللى جواهم حول الموضوع<br />الخلاصه: بدايه كويسه وممكن يبقى فى افضل"
archived = "2004-09-16"
capture_url = "https://web.archive.org/web/20040916230339/http://www.20at.com:80/article.php?sid=613"
