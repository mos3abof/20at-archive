text = "نداء للاخوة الاقتصاديين في مصر<br />نريد واحد من الاخوة الاقتصاديين يحسبلنا خسائر مصر نتيجة الصراع بين الدولة والاخوان على مدار 80 سنه<br />مليارات ضاعت<br />ولسه برضه الاخوان مش عايزين يرحموا الشعب المصري اللي جاع<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــ<br />مش شريف الدواخلي ولا البراء اشرف"
