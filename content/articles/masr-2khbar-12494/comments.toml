text = "احنا ملينا من الاخبار دى<br />كل كام يوم تلاقى فى الشريط الاخبارى لكل المحطات التليفزيونية اخبار عن اعتقالات للاخوان ثم افراج ثم اعتقال ثم افراج ثم اعتقال ثم افراج<br />دة اسمة خبل<br />او غباء امنى<br />لغاية ما دول العالم بتضحك علينا<br />دول العالم الراقى بتحدد نشاط الفرد وتقول اقعد فى بيتك وبلاش اجتماعات او لقاءات وخلاص<br />انما اعتقالات وتكلفة اكل وشرب وحراسة فى دولة تعتمد على المعونات والهبات والشحاتة من الخارج"
archived = "2009-07-01"
capture_url = "https://web.archive.org/web/20090701003915/http://www.20at.com:80/masr/2khbar/12494-2009-06-28-09-29-55.html"

