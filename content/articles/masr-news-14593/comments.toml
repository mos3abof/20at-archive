author = "احمد"
posted = "2009-12-27"
text = "المترو خلاص بقى خرابه مش وسييله للمواصلات ولو نفتكر زمان ايام لادارة الفرنسيه كان عامل ازاى ودلوقتى مع المصريين عامل ازاى _ دة غير المعامله وشويه البلطجيه اللى حاطنهم يرقبوا التذاكر _ حاجة فى منتهى السفاله وقله الذوق _ دة غير شوف اى محطة زى المرج مثلا والتكدس بتاعها وتلاقى شباك واحد بيخدم كل البشر دى والباقى بقى اللى بيفطر واللى بيضرب شيشه على القهوة _ تعالى بقى شوف العربيات من جوة _ بيقولك ممنوع التجمعات علشان الانفلونزا هههههههه وجوة العربيات كوم بشر تجيب الضغط السريع مش الانفلونزا وبس _ دة غير التراب ولمرواح الخربانه _ وفى الاخر احب اقول هو دة اخر مستوى لادارة المصريين"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229141051/http://www.20at.com:80/masr/news/14593-2009-12-27-07-25-10.html"

