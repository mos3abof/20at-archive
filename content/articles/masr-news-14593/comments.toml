text = "اى نظام مهم مثل القطارات والمترو والمستشفيات يكون لها اكثر من مصدر للتغذية بالتيار الكهربائى من خطوط مختلفة فاذا فشل مصدر تم اخذ التيار من مصدر بديل<br />وفى حالة الاظلام التام على مستوى الجمهورية يكون هناك مولدات الكهرباء الديزل الاحتياطية<br />ولكن يظهر ان التسيب وصل للجذور لانة لا يحاسب احد"
