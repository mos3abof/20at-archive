subject = "أحلـــــــــــــــــــــــــــــــــــــــــــــف بسماها"
author = "مها الشرجبي"
posted = "2006-03-22"
text = "أحلــــــــــــــــــــف بسماها وبترابها<br />أحــــــــــــــــــــلف بدروبها وأبوبها<br />أحلــــــــــــــــــــف بالقمح وبالمصنع<br />أحــــــــــــــــــلف بالمدنى وبالمدفع<br />بولادي بأيامي الجيــــــــــــــــــــة<br />متغيب الشــــــــــــــــــــــــــــــــــمس العربية<br />طول ماانا عايـــــــــــــــش فوق الدنيا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115040/http://www.20at.com/article2.php?sid=494"

[[comments]]
order = 27
subject = "ابن افريقية"
author = "عبد الله"
posted = "2006-03-24"
text = "من ذهب للنقاش و توضيح الموقف من المشاركين و العاة نجلهم ولكن الان اصبحت عاجزا عن فهم اللية الكريمة ( لن ترضى عنك النصارى و لا اليهود...) اذن قبل ان تذهبوا الى النصارى لابداء مواقفكم والوقوع في الاعيبهم عليكم ان تفسروا لنا هذه الايةفربما لا تنطبق هذه الاية على الدنماركيين و غيرهمو ايضا استعدوا و اعدوا حقائبكم لانهم لن يكفوا عن التهجم على الاسلام و الرسول وايضا سيقومون بدعوتكم الاف المرات لتكونوا الوسيلة لذر الرماد في عيوننا شكرا لكم على ذهابكم و اني شبه اكيد انهم بعد ان فهموا منكم من هو رسول الاسلام صلى اللله عليه و سلم سيسيوون اليه عديد المرات لانهم في الحقيقة يعرفون قيمة نبينا الكريم و هذا ما يغيضهم و ما دفعهم لسبه و لكن الفرق بيننا و بينهم انهم يجيدون الحرب و المكيدة ونحن نجيد تصديق الخدع و المكائد فلكم جزيل الشكر يا من قدمتم هدية مجانية الى الدنماركيين و ازلامهم فالرجاء ان تفسروا لنا اللية فقد تكون نسخت وانا لا اعلم عن ذلك شيئا لاني في الحقيقة لا ارى لا اسمع لا اتكلم علمائنا الافذاذ و السلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115040/http://www.20at.com/article2.php?sid=494"

