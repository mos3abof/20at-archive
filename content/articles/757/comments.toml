author = "محمود"
posted = "2006-02-26"
text = "في الحقيقة اعتقد بان الفرصة ديه فعلا فرصة طيبة محتاجين نستثمرها ونكسب من وراها اكبر المكاسب واحسب ان الله عز وجل سوف يجعل من حادث الاعتداء علي النبي الكريم ايذا ببدء نصر جديد للاسلام فان الصحابة كانوا اذا رأوا قوما قد سبوا النبي يعلمون انهم غالبون هؤلاء القوم لا محالة واحسب اننا نغلبهم حين نوقظ حب النبي والاسلام في نفوسنا ونغير الصورة القبيحة التي اوصلها اليهود للغرب عنا<br />أختنا العزيزة مريم احي كل من تفاعل وقدم لك النصيحة فيما ستقولين واضيف عليهم بانك لابد ان تحديثهم باكبر قدر عن النبي صلي الله عليهم وان اخلاقه ومميازته التي حين تمسك الغرب بها ارتفعوا في مدار الحضارة فهو الذي علمنا قيمة العلم ومكانته حين قال بان الحكمة هي ضالة المؤمن اني وجدها فهو احق الناس بها<br />وهو الذي علمنا قيمة العمل وجعله في في فضله علي قدرة العبادة حين يكون ابتغاء مرضاة الله<br />وانه صلي الله عليه وسلم هو اول من دعا الي حقوق المراة حين ظلمها الناس<br />وهو الذي دعي الي حقوق العبيد فقرر ان لهم حقوق كما ان عليهم واجبات<br />وانه صلي الله عليه وسلم هو الذي اعلي قدر الحيوان حين حدثنا عن المراة التي ادخلها الله النار في هرة وعن الرجل الذي ادخله الله حين حن علي الكلب وسقي له<br />واخيرا ان سألكم عن اين اينتم من هذا كله فقولي بان الاسلام قد عاني من قلة فهم المسلمين وان الله نصر العرب حين تمسكوا به وأضاءوا الدنيا وملكوها<br />وان الله اخزاهم حين تخلوا عنه<br />فالعيب ليس في نبي الاسلام ولا دين الاسلام وانما العيب في المسلمين انفسهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115040/http://www.20at.com/article2.php?sid=494"

