text = "أتعجب مما قيل من بعض السطحيين من أمثال صايع هذاالذي يبدو كاللاهث وراء أي شيء يثقل به ميزان سيائته , فإن تلك فرصة واتت مريم ومن سيكون معها من شباب المسلمين للجهاد في سبيل الله , فكل ما سيبذلونه أولا من جهد للإستعداد لهذا الحوار سوف يعظم به الأجر وسيكون في ميزان حسناتهم بإذن الله وسيعود بالنفع انشاء الله على كل الأمة بما فيها صايع هذا فيجب على كل من يستطيع الجهاد بما اتاه الله من علم أن يمدهم بما يراه مفيدا لهم فى جهادهم كي يفوز معهم بثواب الجهاد مثل بعض النماذج الرائعة التي كتبت أعلاه , أما الغافلين من امثال الملقب نفسه بصايع الذي يرتع في غفلته فليصمت مالم يستطع ان يقل خيرا ."
