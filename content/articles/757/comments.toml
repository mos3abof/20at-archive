[[comments]]
order = 18
subject = "الشباب الممثلين للامة الاسلامية"
author = "مصري"
posted = "2006-02-26"
text = "هذا ماتعلمه الشباب الدنماركي عن الأسلام أنه مجموعة من التناقضات ، وأنه دين لا يحترم العقل ، وهو عدو للعلم ، وهو عدو للمرأة ، وهو قد انتشر بالسيف بيد السراسنة الذين حطموا الحضارة في موجة مبكرة من هجرة الأجناس ، وهو قد بني مجتمعه على الطبقية ، والغنائم ، ومجاراة الشهوات ، وأوزار التكاليف ، وأكتاف الرقيق ، وظلم الأقليات ، وأنه على أحسن الفروض مفخرة لعصره الذي تجاوزته العصور ، وخلفه التطور منذ قرون إلخ ، وكأن هذا العبء كله الذي سوف يتصدى له الوفد يمكن أن يدار بمثل ما تدار به مجالس الترقق والتذكر بين جماعة المسلمين ..<br />هذا الحوار يلزمه الاطلاع إن لم يكن التبحر في كتب التاريخ العام والخاص مثل – مقدمة ابن خلدون ،وقصة الحضارة لول ديورانت ، والآثار الباقية عن القرون الخالية \" لأبي الريحان البيروني الخوارزمي ، والتنبيه والإشراف للمسعودي ، وصبح الأعشى للقلقشندي ، والبدء والتاريخ للمقدسي ، وأوروبا في العصور الوسطى، د. سعيد عبد الفتاح عاشور، و تاريخ أوربا العصور الوسطى، د. السيد الباز العريني، وتاريخ الدولة البيزنطية، د. نسيم جوزيف. وتاريخ مصر القديمة للدكتور سليم حسن، و في موكب الشمس للدكتور أحمد بدوي<br />هذا الحوار يلزمه الاطلاع إن لم يكن التبحر في الكتب الحديثة والمعاصرة في مقارنة الأديان – لا في الشتائم الخسيسة - مثل : المسيحية نشأتها وتطورها ل شارل جينيبر ترجمة عبد الحليم محمود ، و\" أسطورة التجسد \" لمجموعة من علماء مقارنة الأديان بالغرب ، ورسالة في اللاهوت والسياسة ل سبينوزا ترجمة حسن حنفي ، ومخطوطات البحر الميت ، واللاهوت النظري تأليف الخوري دكتور الياس جميل ، ونظام التعليم في علم اللاهوت القويم للدكتور جيمس أنس ، وعلم اللاهوت لإيغومانس ميخائيل مينا ، و الوحدة الإلهية في الأسفار الربانية لأدولف سافير، وتجسّد الكلمة للقديس أثناسيوس الرسولي ، و لماذا تجسّد الكلمة للقديس أنسلم ، وكمال البرهان على حقيقة الإيمان للقديس أثناسيوس الرسولي ، ولماذا أنا مسيحي؟ للدكتور ولسن تعريب الاستاذ حبيب سعيد ، ومسيا تعريب القس الدكتور ابراهيم سعيد ، وحياة المسيح بقلم أرنست رينان ، والمسيحية والحضارة العربية للأب د جورج شحاتة قنواتي ولماذا أنا غير مسيحيي لبرتراند رسل ، ودراسات إسلامية مسيحية العدد 20 : صادر عن المعهد البابوي للدراسات العربية والإسلامية عام 1944 روما ، والتنصير : خطة لغزو العالم الإسلامي : صادر عن مؤتمر التنصير الذي انعقد بكولورادو عام 1978 ، وإسرائيل والتلمود لإبراهيم خليل أحمد ، والكنز المرصود في قواعد االتلمود تأليف د روهنج ترجمة يوسف حنا نصر ، والمنارة التاريخية في الوثنية والمسيحية تأليف الاستاذ الكسندر صيفي ، والخريدة النفيسة في تاريخ الكنيسة للأسقف ايسوذورس ، وتاريخ الكنيسة لأندرو مولر تعريب الاخوة بمصر ، وتاريخ الأمة القبطية – لجنة التاريخ القبطي بمصر ، وريحانة النفوس في أصل المعتقدات والطقوس للقس بنيامين شنيدر ، ووثائق دير صهيون بالقدس الشريف للدكتور أحمد دراج ، ودراسة الكتب المقدسة للدكتور موريس بوكاي نشر دار المعارف بالقاهرة وبروتوكولات حكماء صهيون<br />إظهار الحق للشيخ رحمت الله الهندي , ونظرات في العقائد المسيحية للأستاذ مصطفى سعداوي المهر ، والعقائد الوثنية في الديانة النصرانية لمحمد طاهر الثني ، والمسيح والتثليث للدكتور محمد وصفي ، ومعركة الوجود بين القرآن والتلمود للأستاذ الدكتور عبد الستار فتح الله ، والعقيدة اليهودية وخطرها على الإنسانية للدكتور سعد الدين السيد صالح ، والنصوص المقدسة في الأديان الثلاثة للدكتور سيد عبد التواب عبد الهادي نشر عام 1982<br />والنبوة والأنبياء في اليهودية والمسيحية والإسلام- للمهندس احمد عبد الوهاب ، ونقد التوراة للدكتور أحمد حجازي السقا ، وعلى التوراة : كتاب في نقد التوراة اليونانية : تأليف علي بن محمد الباجي الشافعي تحقيق الدكتور أحمد حجازي السقا ، وأقانيم النصارى - للدكتور أحمد حجازي السقا ، ويوحنا المعمدان بين الإسلام والنصرانية للدكتور أحمد حجازي السقا ، والله وصفاته في النصرانية واليهودية والإسلام للدكتور أحمد حجازي السقا ، ونبوة محمد في الكتاب المقدس للدكتور احمد حجازي السقا. والنصيحة الإيمانية تأليف نصر بن يحيى تحقيق أحمد حجازي السقا ، والنبوة والأنبياء لمحمد علي الصابوني ، و بولس والمسيحية للدكتور محمد أبو الغيط الفرت ، وملكوت الله في النصرانية واليهودية والإسلام لعبد المجيد الجندي ، وبين الإسلام والمسيحية لأبي عبيدة الخزرجي ، وهل الكتاب المقدس كلام الله للداعية احمد ديدات ، والوحي والملائكة في اليهودية والمسيحية والإسلام للأستاذ المهندس أحمد عبد الوهاب ، والمسيح في مصادر العقائد المسيحية : خلاصة ابحاث علماء الغرب ، تأليف أحمد عبد الوهاب ، والمسيحية والحرب للدكتور رفيق حبيب ، وتاريخ الرهبنة والديرية في مصر د رفيق حبيب ، والاختراق الصهيوني للمسيحية للقس أكرم لمعي و المسيحية بين النقل والعقل للدكتور عبد الفتاح الفاوي طبعة 1992 ، والرهبانية وموقف الإسلام منها للدكتور احمد علي عجيبة ، والإنجيل والصليب لعبد الأحد داود ، والمسيحية في الإسلام للأب إبراهيم لوقا ، وتأثر اليهودية بالأديان الوثنية للدكتور فتحي الزغبي ، والفكر الديني اليهودي : أطواره ومذاهبه للدكتور حسن ظاظا ، والأسفار المقدسة في الأديان السابقة للإسلام للدكتور علي عبد الواحد وافي ، والقرآن واليهود لمحمد عزة دروزة ، ومحاضرات في النصرانية لمحمد أبوزهرة ، والديانات القديمة لمحمد أبوزهرة ، والجواب المنيف في الرد على مدعي التحريف في الكتاب الشريف للشيخ يوسف أحمد نصر الدجوي ، ونقض دعوى عالمية النصرانية للدكتور فرج الله عبد الباري ، والعقائد النصرانية في ضوء الوحي الإلهي والتأثيرات الوثنية للدكتور عبد العزيز سيف النصر، والنبوات والبشارات بخاتم النبيين بين النصرانية والإسلام للدكتور عبد العزيز سيف النصر ، والمسيحية واليهودية للدكتورأحمد شلبي ، والغارة على العالم الإسلامي تأليف أ . ل شاتليه ، ودراسة الكتب المقدسة في ضوء المعارف الحديثة لموريس بوكاي دار المعارف بالقاهرة 1977 م ، والدين للدكتور محمد عبد الله دراز ، و أصول الصهيونية في الدين اليهودي للدكتور إسماعيل راجي الفاروقي ، و اليوم الآخر بين الأديان الثلاثة للدكتور فرج الله عبد الباري ، وتنزيه نبي الله داود عن مطاعن وأكاذيب اليهود في العهد القديم والإسرائيليات للدكتور فتحي محمد الزغبي ، والخلاص المسيحي ونظرة الإسلام إليه للدكتور أحمد عجيبة . و قصص الأنبياء للشيخ عبد الوهاب النجار نشر دار التراث بالقاهرة ،<br />ومؤلفات الأوربيين الذين دخلوا في الإسلام حديثا<br />وهذا غيض من فيض ذكرناه للتذكرة على سبيل المثال"
archived = "2006-11-02"
