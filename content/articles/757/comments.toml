[[comments]]
order = 10
subject = "انتوا بتتكلموا في موضوع يخص الرسول الكريم"
author = "يا جماعة ايه التهريج ده . مفيش حد بعت رد واحد يتكلم فيه بجد ؟!!!انتوا مش واخدين بالكوا انكوا بتتكلموا في موضوع يخص الرسول الكريم صلى الله عليه و سلم."
posted = "2006-02-26"
text = "أقوللك أنا يا مريم تقوليلهم ايه:<br />قوليلهم في الأول \" السلام عليكم و رحمة الله\" هكذا نحن المسلمون و ها هي تحيتنا أمرنا ربنا و نبينا صلى الله عليه و سلم أن نحيي الناس بالسلام و أن نسعى دائما للسلام ليس مع المسلمين فقط و لكن مع العالم كله .<br />قولى لهم أن النبي الكريم الذي حاولوا الإساءة له لم يؤذي أحدا قط ممن كفروا به و لم يدعوا عليهم و لم يامر أصحابه برد الإساءة لهم بل كانت دعوته دائما لمن لم يؤمنوا به\" اللهم اهدي قومي فإنهم لا يعلمون\".<br />هذا هو نبينا الكريم صلي الله عليه و سلم هذا هو محمد عليه الصلاة و السلام الذي كان يلقبه أعدائه بالصادق الأمين فما بالكم بتابعيه.<br />قول ى لهم أننا لا نرجو منهم مجرد اعتذار مكتوب أو مقروء و إنما نريد منهم دليلا على أنهم يحترمون مقدساتنا كما نحترم مقدساتهم و أن مثل هذه الفعلة سوف يجرم من يحاول تكرارها هذا هو الإعتذار الحقيقى.<br />و في النهاية قولى لهم أن الرسول الكريم صلى الله عليه و سلم كان أول من أرسي قواعد حرية التعبير المسؤلة فقد كان يقول للذين لم يؤمنوا به \" لكم دينكم و لى دين\" أي كل منا حر في معتقداته مالم يؤذي الآخرين و هذه هي حرية التعبير الحقيقية التي يسعى إليها العالم أجمع .<br />و السلام عليكم و رحمة الله و بركاته."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115040/http://www.20at.com/article2.php?sid=494"

