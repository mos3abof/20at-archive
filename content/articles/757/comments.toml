[[comments]]
order = 13
subject = "مصعب أبن عمير أول سفير فى الأسلام"
author = "مناضل أنترنتى قديم"
posted = "2006-02-26"
text = "السلام عليكم ورحمة الله و بركاته<br />أخت مريم جميع الشباب المشاركن فى هذا المؤتمر ... كنت اتمنى أن أكون معكم فى الدنمارك لأنقل لهم صوره جميله عن ديننا لعلها تكون لى فى ميزان حسناتى يوم القيامه و لكن قدر الله و ما شاء فعل و طالما قد وقع عليكم الأختيار فبالتأكيد أنتم أفضل منى أسأل الله العلى العظيم أن يوفقكم لما فيه الخير ولكنى اشدد لى نقطتين هامتين أولهما لكم و الثانيه لشباب الموقع و الذى أحزننى بشده أن يكونوا بمثل هذه السطجيه و أنا لا أقصد الأساءة لأحد و لكن حينما يتعلق الأمر برسول الله صلى الله عليه و على أله و صحبه و سلم فلابد ان يكون كلامنا مغلف بكل جديه فلقد أحزننى بشده أن تكون التعليقات بهذا المستوى وبينما أناأقرا المقال كنت أتخيل شكل التعليقات فتخيلت لوهله أنه ستكون دعوات بالتوفيق ثم قلت لا هى ستكون نصائح من السيره النبويه فى كيفية عرض أسلامنا أمام الغير أو ربما تكون أقتراحات و أفكار و لكن المنى بشده هذا الشكل من التعليقات و لكن ...<br />اما لكى اخت مريم و من هم معكى فى هذه المهمه فاقول لكم انكم أمام مسئوليه عظيمه فأنا أول مره فى حياتى أسمع عن حوار بين الشباب العربى المسلم و الشباب الغربى و اعلموا أنكم مطالبون بأقصى جهد للفوز فى هذه الجوله و التى أعتقد أنها ستكون فاتحة خير للأسلام و المسلمين<br />أنتم مطلبون أن تقولوا لهمأن ديننا و نبينا علمونا ان نصون العهد و الود و الا نعتدى إلا على من اعتدى علينا قولوا لهم ان الأسلام ليس بن لادن و لا الظوا هرى قولوا لهم ان همجيتهم فى العراق و سكوتهم على فظائع ميليسوفيتش فى كوسوفا و على جرائم بوتين فى الشيشان و دعمهم لشارون و عصابته فى فلسطين المحتله هو الذى رزع الكراهيه و الحقد فى قلوب الشباب المسلم قولوا لهم أن نبينا العظيم الذى سخرتم منه كان يقول لجنوده لا تقطعوا شجره لا تهدموا بيتاً ستجدون رهباناً وعباداً فى صوامعهم فدعوهم لما هم فيه قولوا لهم ان تحيتنا فى الأسلام السلام عليكم ورحمة الله و بركاته قولوا لهم ان عندنا فى القران سوره أسمها سورة المائده تبدا بايه تقول \" يأيها الذين أمنوا اوفوا بالعقود\" و انتم لم تفوا ابداً بعهودكم معنا فى العراق او فلسطين او الشيشان او غيرها قولوا لهم أن قرأننا يقول فى سورة الحجرات \" و جعلناكم شعوباً و قبائل لتعارفوا\" فكيف ان الدين الذى يأمر بالتعارف يكون هو نفسه الذى يجعلنا منغلقين على أنفسنا و لا نريد أن نلتقى معكم قولوا لهم ان أيات الجهاد التى تطالبونا بحذفها أنما نزلت لقتال من يعادى الله وليس لنتخذها زريعه كما تقولون لقتل و ترويع و أرهاب الناس أسالوهم من الذى بدء الحملات الصليبيه باسم المسيح و المسيح برىء منها و هو عندنافى ديننا نبى عظيم نوقره و نحترمه كما نوقر موسى وسائر الأنبياء و المرسلين عليهم السلام و تذكرى دائما و أسالى نفسك هذا السؤال ألف مره هل أناأصلح أن أكون سفيره للأسلام سأترك لكى الأجابه حينما أقول لكى أن أول سفير فى الأسلام هو مصعب بن عمير رضى الله عنه و الذى استشهد فى غزوة أحد و كان شاب فتى و سيم من عائله عريقه من عائلات قريش كان يعيش حياه مرفه ولما من الله عليه بالأسلام و عرفت أمه بذلك حبسته فى فى البيت و كانت تؤذيه أشد الأيذاء و لكنه يعلم أن ما عند الله خير و أبقى و لقد أختاره رسول الله ليكون سفيرا للأسلام نظرا لتميزه بين أقرانه و فصاحة لسانه و حسن بيانه و للين جانبه و أرسله مع الرجال لاهل المدينه ليبشر بالدين الجديد و من المواقف الصعبه التى قابلها رضى الله عنه قصة لقائه الاول بسعد بن معاذ رضى الله عنه سيد الأوس وكيف تحول سعد رضى الله عنه من رجل يريد أن يقتل مصعب إلى رجل يناصر مصعب سفير الأسلام و كيف ان دروس دار الأرقم بن أبى الأرقم علمته كيف يثبت عند لقاء رجل عظيم مثل سعد بن معاذ رضى الله عنه و كذلك أنظروا معى إلى جعفر بن أبى طالب (جعفر الطيار) رضى الله عنه و فصاحته مع ملك عظيم مثل النجاشى و كيف عرض عليه الأسلام فى كلمات بليغه وموجزه أثرت فى النجاشى و كانت سبباً فى أسلامه من بعد ..... أخت مريم وفقكم الله أواكم الله نصركم الله فأنتم أمام مهمه عظيمه صعبه تحتاج منكم الجهد و الأطلاع الكثير وتلقى دورات فى فن الحوار و السياسه و كل مجالات الحياه و الأهم من كل ذلك فى سيرة النبى صلى الله عليه و على اله و صحبه و سلم و فى تفسير القران<br />و ختاما لا تنسوا أن توجهوا الدعوه للشباب الدنماركى أن يأتوا لزيارة بلادنا ليروا عظمة الشعوب المسلمه و حب و قدر نبينا فى قلوبنا وكيف أننا نحترم الأديان الأخرى و لا نعتدى على أحد بالقول أو بالفعل إلا من عادانا و ليروا كرم الضيافه عندنا و التى هى من صميم ديننا<br />و الله المستعان<br />اللهم إن كنت أصبت فمن عندك انت وحدك و إن كنت أخطات فمن نفسى فأغفر لى فأنه لا يغفر الذنوب إلا أنت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115040/http://www.20at.com/article2.php?sid=494"

