[[comments]]
order = 3
subject = "احلف بسماها وبترابها"
author = "مصري"
posted = "2006-02-25"
text = "احلف بسماها وبترابها*** لابيع شبابيكها مع ابوابها<br />واخلي خرابها اعجوبة*** ويقولوا الرجل خربها<br />لا ابيع مصانعها وشركاتها*** واغرف اموالها واهربها<br />احلف لاجوع اولادها ***واشحتف من الهم فؤادها<br />وابدد ثروات الامة ***واخلي لصوصي اسيادها<br />وابيع مواردها لاعدائها*** واخليها تغرق في فسادها<br />راح تمشي دايما في النازل ***وها ازيد في<br />ركودها وسوادها<br />احلف بايامي الى قضيتها*** كاتم انفاسها ومهجتها<br />لاضيع شعب المحروسة*** وما اسيب تعريفة ف جعبتها<br />احلف بحياتي لادمرها *** لو حتى ها ارتب خرجتها<br />وامشي انا والحزب واولادي*** نبكي وياكوا في<br />جنازتها<br />الضيعة دي شيء من املاكنا*** ومعانا سند مليكتها<br />لما عبيدها يفتحوا فينا*** ها نقول تخرب من<br />لحظتها<br />لو مات سكان المحروسة*** تحيا الاسرة مع اذنابها<br />الاسرة بنت دولة عظيمة*** والعز اهو ماشي في<br />ركابها<br />احلف بولائي لامريكا*** ورئيسها الى مطلع عيني<br />لاخلي المنطقة دي خرابة*** واضيعها ما بينه وبيني<br />امريكا اولى بثرواتها*** من جدة لحد السكاكيني<br />د ا ولائها معشش ف فؤدي ***مكتوب بالعافية على<br />جبيني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115040/http://www.20at.com/article2.php?sid=494"

