subject = "مش للدرجه دي"
author = "عبدالله مفتاح"
posted = "2006-06-29"
text = "يا جماعه مش للدرجه دي انا حسيت ان الشباب متوحشين وكلهم ملهمش صله بالادميه<br />اللي انا اعرفه ان اتنين متفقين على كده<br />بس ان واحد يكون مش بني ادم كده اسمع عنها بس مش مقتنع اوي<br />وعلى العموم دول شباب معندهمش ضمير ولا اخلاق كانوا ضحيه لمسخرة البنات اللي بيقولوا اللبس مش مهم المهم الجوهر<br />وخلينا بقا نكون منصفين شويه ونقول ان مجموعة الشباب اللي معندهمش ضمير ايه اللي خلاهم يعملوا كده<br />اكيد حالة الاثارة اللي هما فيها والناتجه عن المهازل اللي البنات بيرتكبوها وفاكرين انهم بنات موضه وستايل<br />المشكله ان اللي بيدفع الثمن البنت والمحترمه وغير المحترمه<br />وان كنت اجد صعوبه في اني اصدق ان واحد يعمل كده مع بنت محتشمة الملابس<br />محتشمه الملابس بجد بالمقياس الشرعي مش بمقياس المجتمع<br />وربنا يهدي الجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134442/http://www.20at.com/article2.php?sid=1007"

