subject = "الجانب الآخر"
author = "محمود ابراهيم"
posted = "2006-06-30"
text = "الجانب الاخر من المشكلة هم البنات الا من رحم الله فهناك مشكلة تواجه كثير من الشباب خاصة المتدين ففى بعض الاحيان تكون عربة الميكروباص ممتلئة على الاخر و يكون الشاب عايز ينزل وتكون فى بنت في الممر يقولها عن اذنك تتنح لو سمحت ما فيش فايدة فيضطر يعدى من جنبها فى الممر الضيق ده فاكيد اكيد هيخبط فيها و هيلمسها و هى ولا هنا وهو مضطر والا المحطة هتفوته مبقاش فى حياء الا من رحم الله بقت حاجة تقرف فما تظلموش الشباب كلهم ارجوكم"
