[[comments]]
order = 33
subject = "عمت القلوب ... فانهارت السلوكيات"
author = "أحمد طاهر"
posted = "2006-08-03"
text = "احبائي بنين وبنات ..اخوان واخوتي في الله<br />لا اعرف متي سنتفق ونستفيق مما نحن فيه علا الرغم ان الاختلاف عندي لا يفسد للود قضية ولاكن اي اختلاف ... لا اتفق مع اطلاق العموم علا الاشياء لذلك فالخطا يعم الطرفين بنين وبنات وان كنت اهمس في اذن اخوتي البنات لانهم سيكونوا نواة المستقبل ومسؤلون في المستقبل عن تربية النشئ والمستقبل واقول مظهرك مراََتك ويعبر عن شخصيتك ولا اتفقك مع فكر ان الجوهر هو الاساس لان الاصل اتفاق المظهر والجوهر فهما كالجسد والروح لا يفترقان ان افترق احدهما مات الاخر لذلك لابد وللفتاه ان تحصن نفسها وان تقي نفسها من الشبهات وان لا تضع هي نفسها بنفسها في موقف قد يعرضها لما يحمد عقباه فلا يعقل ان تلبس فتاه ملابس قصيره مثلا وتلوم الاخر انه ينظر اليها فالنفس البشريه ضعيفة واتمني ان تقوي نفوسنا جميعا والفطره في الانسان اكتشاف الشيئ الخفي لا المعلن ولن اوضح اكثر فكلنا شباب وتفهمونني اكيد لا اريد ان اطيل وكلمة للشباب بنين وبنات اقتلوا الفراغ بعمل تحبونه ... فالجنس وااسف للكلمة ولاكنها الحقيقة نهايه الطريق ووقوع في نفق مظلم صعب الصعود منه<br />لكم كل حبي وتقديري شباب العرب من شاب متزوج يحبكم في الله ويريد لكم الخير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134442/http://www.20at.com/article2.php?sid=1007"

[[comments]]
order = 34
subject = "ليست هذه هى الكارثه الوحيده"
author = "زهرة المدائن"
posted = "2006-08-05"
text = "ليس التحرش بالنساء هو الكارثه الوحيده ولكن الاشد هو ان يدافع الجميع عن الجانى ويهاجمون المجنى عليها00 مثلما حدث مع صديقتى حينما ضايقها احد الرجال الكبار السن (الصغار العقل) بصوره مستفزه حتى صرخت فى وجهه فأذا بالركاب يهاجمونها هى بحجه انه رجل كبير فى السن ويقولون بمنتهى الصفاقه (ايه اللى بينزلكوا من بيوتكوااصلا ) والذى يتهمها بالجنون حتى اجهشت بالبكاء00 ولا نقول الا حسبنا الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134442/http://www.20at.com/article2.php?sid=1007"

