text = "رغم انى عندي عربية الا اني اوقات كثيرة بابا بيخودها. فاتبداء الازمة في ركوب المواصلات<br />. بحس اني في كابوس ضخم تعاني منة كل البنات مش بس البنات دا كمان السيدات. مرة شوفت ست عندها بتاع 40 سنة بتضرب واحد بالشبشب. و بتشتم في بطريقة بشعةز بس لما عرفت انة رجل غىر محترم ايدة عيزة قطعها. عظرت السيدة في خروجها عن شعورهاز في النهاية بشكركم علي موضوع الجميل و اقول لكل بنت انها متشلش الشبشب من رجلها او شنطه للظروف ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134442/http://www.20at.com/article2.php?sid=1007"

