subject = "الإختلاط الزايد عن حده إتقلب لضده"
author = "شادي"
posted = "2006-06-30"
text = "أكيدمجتمعناإختلف و الأخلاق اللي كنا بنتكلم عنها إتنخور فيها و الأخبار اللي بيسمعها الشباب يخليه يقول ممكن البنت حتى لو شكلها محتشم يكون ستار أو يكون ليها سكة<br />ده مش دفاع عن نوعية منحطة..ده عرض للحقائق من شاب واقعي<br />علشان كده أنا مع منع الإختلاط بكل الوسائل وزي ما بقول لكل بنات العائلة عندي...حتى التاكسي ماتركبهوش لوحدك<br />ده الواحد مننا بتبقى مراته ماشيةمعاه و محجبها و محترمة جنبه وممكن يضربله واحد شاف فيديو كليب و شعشعت معاه و إتحول لعينتين بتبص لخلق الله كلهم و بتفصصهم ..محتشمين ولا لأ.....مش فارقة معاه<br />يستاهل الضرب ده ولا لأ<br />أصبحت المدام حتى بتريح دماغها و مابترضاش تخرج تتمشى لحد مالواحد طلعله كرش من قعدة العربيات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134442/http://www.20at.com/article2.php?sid=1007"

