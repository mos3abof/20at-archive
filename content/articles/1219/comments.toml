author = "سارة"
posted = "2006-07-15"
text = "انا عاوزة اقول ان الموضوع دة جميل اوى وحاسة انى عاوزة اقول كلام كتيييير لحد بكرة عاوزة اقول اللى حصيلى فى الموصلات من بلاوى وغيرها وعاوزة ارد على كل واحد بعت تعليقة بس اللى هقدر علية هقولو انا بس عاوزة اولا اعلق على بعض ولاد ودى الموصيبة انهم ولاد على ان الموضوع دة مش من منتشر وان دى مبالغة وان الحكاية مش للدرجادى لا للدرجاتى واكتر كمام دة الحكايات اللى مكتوبة دى ولا حاجة وللهى دى بتوصل للتهديد بالقتل ودة حصل مع صديقة لى واعدت شهور مش عاوز تقابل حد وولا تمشى فى الشارع مش معنى كدة ان المجتمع كلة فاسد وان مفيش حد عدل لا فى بس مش وضحين زى الباقى ولا اية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134442/http://www.20at.com/article2.php?sid=1007"

[[comments]]
order = 27
subject = "مش عارفة"
author = "سارة"
posted = "2006-07-15"
text = "اهم حاجة دلوقتى نعرف اية السبب وبعد كدة نقول حل الموضوع دة اية اول حاجة ان كل واحد بيرمى الغلط على التانى البنات تقول ان الولاد منحرفين وقلالات الادب والولاد تقول ان البنات هما السبب لانهم عريانين وانهم مبقاش عندهم حياء طول محنا كدة للبنات هتتعدل ولا الولاد يا جماعة كل واحد يخلية فى نفسة يغير الاول من نفسة وبعد كدة يشوف بلاوى غيرة دة السبب الرئيسى من وجهة نظرى الحل اية بقى الحل الديييييييين اذا رجعنا للدين والسنة واقتدينابالرسول واللة لا المشكلة دى ولا غيرها هيكون موجودة اصلا ان اللة لا يغير قوما حتى يغيروا ما بانفسهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134442/http://www.20at.com/article2.php?sid=1007"

