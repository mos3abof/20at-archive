text = "مره كان واحد سواق بيتظارف فقلت له ممكن حضرتك تبص ادامك فقاللى شايفانى ببص ورايا<br />دا نوع و علاجه التهديد بالنزول ة ساعتها بيحترم نفسهو ممكن يعتذر زى ما حصل معايا<br />نوع تانى كفايه ياخد نظره احتقار<br />نوع تالت اركب الافى المرايه اتظبطت على وشى و الكاسيت على على طول ادى الوش الخشب بيحترم نفسه<br />نوع رابع ةغاى و دا الواحد يسيبه يتكلم فهيسكت من نفسه<br />و كانت هذه مشاهد من فيلم انا و التاكسيات كل يوم"
