subject = "سيادة المحافظ"
text = "عيب قوي يا شباب<br />انكم تتكلموا على اوطانكم بالصورة دي<br />وبالكتابة كمان<br />عيب قوي<br />وبعدين ليه زعلانين م الكوسة .. وموضوع المطرة تمطر صلصة ده .. عيب يا أخي تتهكم على عطايا السماء<br />كلمة أخيرة للباشمهندس بتاع المحشي؟... العزومة امتى من فضلك ولو تسمح يعني تكون الكوسة باللحمة الضاني وحياة والدك وإلهي يجعل بيوت المؤمنين عمار"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616083405/http://www.20at.com:80/article.php?sid=236"

