[[comments]]
order = 21
subject = "رنين الحب"
text = "بسم الله الرحمن الرحيم<br />ياجماعه ايه الفرق بين الاديب لمايكون اديب بس واديب ورئيس فى نفس الوقت ياجماعه كل اللى عايز يكتب يكتب لان الكتابه دى هوايه مش منفذ بيع خبز ياجماعه سيبو اللى يكتب يكتب وانتم كمان اكتبو صدقونى الكتابه دى تعبير عن الراىء بس مش صفقه بنكسب منها فلوس.<br />انا عايز بس انبه على حاجه ماتكتبوش وانتم فى الشارع او وانتم فاتحين الشبابيك لان ممكن والسما بتمطر كوسه بالصلصه تبقع الكتب وبالمناسبه كمان عشان ماتخدوناش فى دوكه العزومه امتى احسن انا جوعت قوى وياريت ماتكونشى الحله بتاعت المحشى دى بالحمه الضانى وياريت كل واحد ياكل فى طبقه وماتبصوش فى محشى اخوك انت وهو وياريت كلنا ناكل واحنا بنكتب عشان الحياه كلها مش اكل والسلام ختام اختكم<br />رنين الحب"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616083405/http://www.20at.com:80/article.php?sid=236"

