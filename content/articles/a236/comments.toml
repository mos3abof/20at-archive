[[comments]]
order = 23
subject = "المهندس ابن عمير = مصـ( الخير )ـعب"
text = "اهو كده وللا بلاش نحس ان احنا لينا لازمة في البلد,<br />هي دي قمة الإبداع من الشباب اللي فاهم نظرية<br />الكينونة المتمثلة في تتبع الشعاع الفكري المنبثقة<br />من المركز الحسي المرتبط بالبؤرة اللاشعورية<br />للمنحني الساقط من قمة الوحي على مستوى قاع المخيخ<br />الأوسط المتصل بالعصب السمبثاوي المتشعب من الجهاز<br />المناعي المنشط للبكتيريا الممرضة المسسبة للوفاة<br />الفورية للإنسان الننتردالي مما يثبت أن الإنسان كان<br />أصله قرد و... , كفاية عليكو كده هاااااااوم عشان<br />عاوز أنام<br />المهندس بن عمير = مصـ( الخير )ـعب"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041718/http://www.20at.com:80/article.php?sid=236"

[[comments]]
order = 24
subject = "يعنى هى جت ع الزعماء"
text = "يعنى هى جت ع الزعماء يا اخوانا بيزنس شراء المنتجات ونسبتها للاقوى موجود فى كل شئ ادبى او فنى فى عالمنا العربى يعنى خد مثلا قصة ابراهيم نافع ومحمد عبد اللاه وموضوع كتاب الصين وبعض الصحفيين الكبار بيمصوا دم الشباب وكل شئ ينسب لهم فى الفن مثلا قصة الامير اياه والشاعر احمد فتحى وقصيدة يا مالكا قلبى ده غير الالحان اللى بيسمعها بعض الكبار من فنانين مغمورين وينسبوها لنفسهم بعد شرائها بثمن بخس انا اعرف مثلا ان الممثلة القرشانة ( س . م ) كانت بتشترى سيناريوهات كاملة من واحد غلبان كذلك فعل الملك من قبل ( الراحل الفريد ) انا احدثكم من واقع تجربة شخصية واقول لكم ان هذا الموضوع قد سكتوا عنه جميعا لان جميعهم من اقدامهم الى رؤوسهم فى الطين ."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041718/http://www.20at.com:80/article.php?sid=236"
