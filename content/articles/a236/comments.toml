[[comments]]
order = 18
subject = "جمال عبد الناصر ... لأ"
text = "بعيدا عن موقف الإخوان المتشفي في عبد الناصر احب أوضح عدد من الملاحظات :<br />فيه فرق كبير بين عبد الناصر وبين صدام والقذافي ، ولا وجه للمقارنة<br />عبد الناصر كتب القصة وهو شاب قبل استلام السلطة وكأي شاب تعتمل في صدره مشاعر كتبها .. وكان صادق فيها .. ثم أه اهتمامه بالأدب والفن كان واضح وله دلالات<br />وبعدين يا اخواننا عبد الناصر زعيم محترم رغم اخطاءه والأخوة الإخوان اللي فرحوا بالنكسة .. وبيلسنوا ع الراجل بيها .. ولم ينس كاتب المقال أن يلسن هو الآخر .. أعود فأقول إن الأخوان لم يقدموا شيئا لهذا البلد واكتفوا بالدعوات الصالحات .. ويا عالم بيدعوا ولا لأ"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616083405/http://www.20at.com:80/article.php?sid=236"

[[comments]]
order = 19
subject = "سيادة المحافظ"
text = "لا مؤاخذة يا أخ ...<br />وانت واخد الموضوع على صدرك ليه؟....<br />يا عم هدي أعضاءك ... كدة<br />دي القعدة حلوة<br />والمعلم مانع الكراسي في الكلوبات<br />انت هتخسر اصحابك وحبايبك في سبيل الحرية؟...<br />وبعدين ده موقع عشرينات يعني بعدالحاج عبد الناصر الله يرحمه ما مات بسنين كتير<br />كلنا جينا بعد القصص القديمة دي<br />احنا ليه غاويين نعيش في جلاليب أهالينا<br />متعمل زي عبد الغفور يا أخي وسلم لي على محمد رياض<br />وفي النهاية لازم أقل لك الكلمة خالدة الذكر<br />إخص إخص إخص"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616083405/http://www.20at.com:80/article.php?sid=236"

