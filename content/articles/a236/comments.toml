subject = "سيادة المحافظ"
text = "على فكرة<br />كدة عيب قوي يا بيرو أفندي انت والبشمهندس عمير ده<br />لان كدة فيه تغيير تكتيكي في خطة العزومة وشامم ريحة شياط في حلة المجشي<br />انتوا بتتلاعبوا بأعصابنا يا أفندية<br />احنا مش صغيرين ده انا مواليد 57 عيب<br />إخص إخص إخص<br />ولا ايه رأي الأستاذ غاندي المحطة"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616083405/http://www.20at.com:80/article.php?sid=236"

[[comments]]
