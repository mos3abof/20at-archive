subject = "غاندي البلد"
text = "بعيداً عن الإساءة التي لحقت شخصي الكريم متمثلة في إلحق اسم غاندي بكلمة أعجمية مثل المحطة، بعيداً عن كل ذلك .. أطالب سيادة المحافظ أن يحترم الشرعية الدولية وأن يمارس أقصى درجات ضبط النفس أثناء التعليق على الموضوعات ..<br />أما بالنسبة للأخوان رايت (بيرو - عمير) فأنا أطالبهما بألا يكون المحشي باللحم الضأن ..<br />i hated from the deepest part of my heart<br />i may love la7m el kandooz"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616083405/http://www.20at.com:80/article.php?sid=236"

