text = "والله صحيح مو لازم نعلق على الاشخاص قبل ما نسال عن حياتهم وانا الى جانبكم انا اسف<br />لانني ساقول انه لايوجد حريه وديمقراطيع ورئساء خونه وملوك طغاه مو بس انتو تعانو والله ناس كتير بس انا اشجعكم على صراحتكو ومشاعركم قطعتو قلبي"
