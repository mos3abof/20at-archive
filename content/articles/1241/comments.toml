[[comments]]
order = 12
subject = "الى كل من هو مستحمر"
author = "محمد:عربي سني مصري"
posted = "2006-07-29"
text = "الى الاخ كاتب مقال بعنوان صايع<br />يبدو انه مستحمر اي تم استحماره مثل ما استحمر النظام السعودي وباقي الدول العربية وسيق-الحمار- في اتجاه ان ايران هي العدو من اول ايام الثورة الايرانية وانه يجب تاييد العراق ضد ايران<br />وسال الاخ المستحمر وبافي المستحمرين هو احنا شفنا من ايران ولا الشيعة حاجة واحشة. لا عمرهم عملوا حوادث ارهابية ولا هم الي ضربوا البرجين ولا فجروا لندن ولا سوؤا سمعة المسلمين<br />ولا خطفوا عربي واحد في العراق فاكر السفير المصري ولا ناسي<br />وبعدين بتقول ان حزب الله ايراني علشان ايه؟ انه شيعي ولا علشان ايران الدولة الاسلامية بتدعمه ضد العدو الحقيقي لينا كعرب ومسلمين العدوالي كل همه يطفشنا يامانعيش حمير زي حضرتك<br />ياخي يارتنا زي ايران الي امريكا بتعمل لها الف حساب<br />ايران الي فيها صناعة وديموقرطية وما فيهاش سياسة الاستحمار ياريت بلدك تبقى زي ايران رافعة راسها و ما بتمشيش حسب السايس .بطلوا استحمار بطلوا نفاق<br />اللهم يا منزل القران انزل الرعب في قلوب اعدائنا و انصرنا على من ظلمنا<br />اللهم لا تجعلنا للمنافقين نصيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

[[comments]]
order = 13
subject = "انا من مثليو الجنس"
author = "امير الجمال"
posted = "2006-07-29"
text = "انا اسف على ما ساقوله ولاكن في هاذا المقال مكتوب اشياء ولاكنكم لم تعلمو ما بداخل الرجال انا مثلا سبب تعاستي انني كنت في زمن صغير واغتصبني رجل اردني كبرت وكبرت وانا مريض نفسيا اصبحت احب القتل من اجل ان انام مع رجل ولاكن لس ذنبي احاول ان اتخص من هاذا الشيء ولاكن ليس بيدي لانني اغتصبت كثيرا ومن الاسباب التي تجعل الرجال يغتصبوني هو اني جميل واسميى على جسمي ولا كنني اعاني احيانا كثيره احس انني اريد ان اقتل من اجل ان انام مع رجل وان لم يردني ادمر حياته ومستقبله حيث انني اتبله عليه بتهمه قذره ولاكن ليس بيدي اريد ان اتخلص من الكوابس المتعلقه بهاذا الشيء ولاكن لا استطيع لانني اعشق الرجال والان انا في علاقة حب مع رجل روسي وهو الان في سوريه بعث لي اموال لكي نسافر ما الى امريكا ونتزوج هناك ولاكن افكر ماذا افعل اصيب بسراع مع قلبي وعقلي وعيوني التي تعشق الجمال ولاكن ماذا افعل قلولي اذ انني ذهبت الى طبيب والطبيب مارس معي الجنس وكان يدابعني بين تلك الفرشه وتلك انا عمري20 فقط فاين اذهب نعم هاذا الزمن المجنون قبل ان تكتبو عنا اسالونا عن ما عشناه والالم<br />لو بدي اقول علي عشتو بدي سنين اقول علي شفتو<br />راعو شعورنا وابحثو عن الاسباب التي جعلتنا هاكذا بعدها ان كنا غلطانين اقتلونا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

