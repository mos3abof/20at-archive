subject = "انا من نام مع ذاك وسرق ذاك"
author = "اليتيم"
posted = "2006-07-29"
text = "انا مثلك يا امير الجمال نمت م رجال لان زوجت ابي طردتني وابي طلق امي مشيت في شوارع السعوديه ولم اجد احد يسمعني سوى رجل غني ومن الوزراء اخذني في بيته ولم يكن متزوج وكان يومها يوم الخميس اه ماذا اقول عندما علم قصتي استغلني بلفلوس وقال انني اسططيع ان ابقى العمر عنده بشرط ان يناكم معي كل ليله ويضاجعني فقبلت من اجل ان اكل طعام نظيف وماء وانا انام عشت مع هاذا الرجل شهرا ونصف اصبحت مريظا والسبب انني التهبت في مكان الذي كان يضع فيه عضوه وبصراحه اصبحت مثل منهلا ايام عديده كان ياتي من العمل عندما كان يرى امرئه جميله كان يتخيلني انا الحرس عليه اعطوني نصيبي من المضاجعه ايضا لانهم هددوني وهددوه فقبلت في ليله واحده نمت مع 3 كنت اتالم ولم يرحموني فعندما حس الجيران بانني اصرخ حاولو اخبار الشرطه ولاكن خبئوني خوف من الفضيحه وانكرو كلام الجيران لانه من الوزراء حملو المسئوليه على الجيران واراد الرجل الذي امكث عنده ان يتخلص منهم لانهم حاولو فضحه لان الجار رئاني مره وحاول ان يكلمني ولاكن كان عليه حارس اذهب الى الحمام معي عشت رعب وحياة قاسيه اشبه بل افلام والقصص هربت من عزرائيل وجدت قباظ الاروح في احد الايام قمت بل اتصال بل جار وقلت له من انا وماذا اعاني فحاول ان يهربني ولاكنني لم استطع الخروج من مذايقةالرجل الذي عشت عنده والذي الى الان لا اعرف اسمه هدد الجيران برحيل ففقدة الامل فاحس صاحب البيت انه اصبح مههد فاراد ان يتخلص مني بعد ما انه قال لي انه يحب الرجال ولا يحب النساء وانه احببني ولاكن دفعت الثمن ففي يوم من الايام كان الحارس المسئول عني يعانقني في المخزن شاهدة زجاجه خمر فعندما قلت انني اريد ان اضاجعه اكثر وان يسمح لي بل وقوف ضربته على راسه ولبسة ملابسي بعد الن اغميه عليه ذهبت الي صور الحديقه الطويل ولاكن لم استطع القفز فذهبت الى البوابه وجدة هناك المسئولون فلو تعلمو كيف خرجت من البيت ياتي دائما في الساعه10 صباحه سيارة المهملات فالقيت نفسي في الحاويه دونما ان يراني احد من الخوف تركت حذائي وصوره لي سقطت على الارض خفت ان يراها احد فلم يراها فهربت كنت اشتم روائح في الحاويه افضل من ما كنت رايته وعانيته كان اريح لي والله ماذا افعل في زماني الان انا اعمل في بيت مسنين متبرع لاكفر عن ذنبي واهم شيء ان اعيش في بيت مستور ولا ارى مشاكل في بيت المسنين بعدما قلت قصتي للمسئوله وبعدما كنت اتعالج على حسابها هذه هيه حياتي من ابي وزوجته وامي التي تركتني الى الرجل الذي اراني الموت الى الميتم انتهت حياتي وعمري الذي لم اتعلم به انا اسف ولاكن هذه حيات شخص عانها وكانت مثل الافلام والاساطير ولاكن هذه الحقيقه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

