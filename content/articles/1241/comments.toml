[[comments]]
order = 0
subject = "كفانا مسخرة!!!!"
author = "عربي أصيل"
posted = "2006-07-27"
text = "يا سيدي كاتب المقال.. ويا سادتي في موقع عشرينات..<br />أرى أن الوقت الذي تمر به أمتنا العربية العظيمة والجهاد الذي يقوده رجال الأمة العربية الشريفة في لبنان وفلسطين لايسمح بنشر أو حتى بكتابة أو حتى قراءة مثل هذه المقالات.. ربما أتفق مع وجهة نظر الكاتب ولكن الوقت الآن للعدوان الهمجي على أمتنا العزيزة.. وكما قال الزعيم الخالد جمال عبدالناصر رحمه الله ألف مليون مرة: \"لا صوت يعلو على صوت المعركة\".<br />ادعو لحزب الله و حماس وكل رجال الأمة المقاومين الشرفاء بالنصر.. فهذا أفضل من مضيعة وقتنا بهكذا مواضيع الآن, مع احترامي لكاتب المقال وللآنسة منى سليم محررة الموقع."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

[[comments]]
order = 1
subject = "الرجولة الضائعة"
author = "الجنوبي"
posted = "2006-07-27"
text = "أتريد الحق الصهيونية العالمية تريد ذلك ! نعم وكذلك حكام العرب!<br />حتى ينغمس الشباب بتوافه الأمور ويصبحوا مترفين رقيقين لا يتحلون حمل السلاح والمشاجرات فقط يريدون السلام الذليل فتراهم لايتحلون الحر ولا حتى اشعة الشمس يتباهون بعمليات التجميل والماركات العالمية وما يحصل من أحداث في العالم لا تهمه كأنهم من كوكب آخر وهذا كله ليهتم الشباب بتوافه الأمور ويكون هاجسهم وتفكيرهم ماذا يلبس غدا وكيف يغيظ فلان وفلان ويعدونهم عن هم الأمة الاسلامية والعربية !!!!!!!!<br />أتدري أين الرجال ؟!<br />الرجال هم من يحارب ويصمد في بلده بلد النار فتحية لكم يا أحبائي في لبنان وفلسطين ونصركم الله فحقا أنتم الرجال حقا<br />أطفالكم رجال وياليت رجالنا يتعلموا المرجلة من أطفالكم<br />حقا وكما قال المصطفي عليه وعلى آله أفضل الصلاة والتسليم : خير رجال أمتي رجال حول بيت المقدس وعلى أطراف أبواب الشام<br />فتحية لكم مصحوبة بالدعاء والنصر بإذن الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

[[comments]]
order = 2
subject = "هايفه و فضه"
author = "نيرمين محمود"
posted = "2006-07-27"
text = "السلام عليكم<br />انا قرأه هذة المقاله و المقاله الاخري التي تحمل عنوان \"الجنس الناعم خشن، والجنس الخشن ناعم! \" من الظاهر ان البعد عن الدين هو السبب في ما اصبحنا عليه وأيضا افتقدنا للقدوة الحسنه فالمجتمع العربي اصبح مجتمع فاضي هش و اصبحنا نأخذ القدوه من النماذج الخاويه في المجتمعات الاخري (ما يسمي المجتمعات المقدمه ) و في الاخر نلقي اللوم علي ان احنا اصبحنا في عالم ضغير مثل القريه و لسه يما نشوف و نسمع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

[[comments]]
order = 3
subject = "عندى تعليق"
author = "الفرعون يتكلم"
posted = "2006-07-27"
text = "الحقيقة ان الموضة اليومين دول خايبة قوى لكن انا ملاحظ حاجة ان الاخوة بتوع المواقع الاسلامية بيرسموا صورة صارخة مش موجودة فى الحقيقة اصلا وان وجدت بتكون فى نماذج شاذة لاتكون قاعدة للارتكاز عليها يعنى شباب بيلبس الوان فاقعة موجود بس مكياج على الوجة واقراط ؟؟؟ الكلام دة فين بقى اكيد فى الحلم اقصد اقول ان لبس الرجال للاوان الفاقعة مش حرام دينيا لكنة عرف وبالتالى مافيش مشكلة<br />عاوزة بس الاخوة بتوع الجماعات الاسلامية يقللوا من المقالات اللى من النوعية دى لان دة يعتبر تحريض<br />اما الاخ اللى زعلان وبيطالبنا نسكت علشان فية حرب مش عارف يعنى المفروض اعمل اية ؟ الحياة ماشية ياحبيبى ولازم نعيش حتى لو كنا شاعرين بالالم لانكسارنا كعرب<br />لكن مع الاسف احنا اللى جبنا الوكسة دى لنفسنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

[[comments]]
order = 4
subject = "علاش؟"
author = "المغربى"
posted = "2006-07-27"
text = "نعم نحنا بالمغرب نصير بهذة الموضة لاننا ما بنكون اقل من الدول المتقدمة بالعكس والدليل ايها المصريين صفر المونديال تبعكم واحنا نفوقكم بالكثيييير من الاصوات<br />وهدا يدل على انكم لاقيمة لكم عند الغرب بينما نحنا كتير لنا قيمة<br />ولو تحتاج ايها المصرى للتقليد اذن افعل ولكن اعتقد انى لو رايتك كتير بضحك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

[[comments]]
order = 5
subject = "اسئلة هامة"
author = "مصرى"
posted = "2006-07-27"
text = "للمغربى<br />هل التقدم يكون بالملابس المخنثة التى تقول انكم ترتدونها؟؟<br />اما صفر المونديال فالحق على الحكومة وليس المصريين<br />و اكيد اهميتنا عند الغرب اكبر بكتييييير من اهميتكم بسبب دورنا فى فلسطين<br />و طبعا الملابس المخنثة حتضحكك على المصرى لو لبسها لانها مش حتليق بواحد مصرى لانه ببساطة\"رااااجل\"<br />سؤال تانى<br />ليه الحقد الغريب اللى عندكم على المصريين؟؟؟؟!!!!<br />كتير قوى بلاقى المغاربة بالذات بيقلوا ادبهم فى المنتديات على المصريين...وحتى الجرايد المغربية...بجد حاجة غريبة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

[[comments]]
order = 6
subject = "امثلة"
author = "مصرى2 \"عشان فى مصرى تانى\""
posted = "2006-07-27"
text = "فى منتدى واحد مغربى يقول\"مصر ام الدنيا.... والمغرب ابوها\"<br />و يوم ماتش مصر والمغرب كتبوا فى الجرايد\"الاسد المغربى يقابل زوجته\"<br />حقول إيه.....الواطى واطى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

[[comments]]
order = 7
subject = "مغربي منصف"
author = "رشيد"
posted = "2006-07-28"
text = "لمادا نتخاصم نحن الشعوب كلنل عرب مسلمين ولكن مشكلنا في حكامنا المصلتين على رقابنا . والغرب الدي يمزق اسلامنا وثقافتنا بسبب تخادلهم وانهماكنا في الشجار مع بعضا ,لننظر الى اليابانيين اين وصلوا دلك بتشبثهم بحضارتهم رغم كونها مجرد بوديات دهبوا الى اوروبا واخدوا العلم والتكنولوجيا ومازالوا ياكلون الطعام بواسطة الاعواد اما نحن اخدنا طريقة اللباس وغيرها من السفاسف وتركنا الدين والتكنولوجيا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

[[comments]]
order = 8
subject = "كوكتيل"
author = "واحد"
posted = "2006-07-28"
text = "بالنسبة للأخ الجنوبي...<br />أول ما ألعن الحكومة السعودية، ثم الحكومات العربية الأخرى. صدقت يا أخي، هناك مسرحية قذرة تلعب بالخفاء.<br />أما بخصوص الموضة، أنتم هنا تتكلمون عن الشباب وعن سبب لبسهم لتلك الملابس، وكأن لبس هذه الملابس في الشارع للبنات أمر عادي.<br />أول شيء، طبعا هي لا حرية ولا بطيخ، هي خناثة وقلة حياء بمن يلبسها، لكن في الطرف الآخر لو جعلتم الحلال أسهل للوصول، لرغبوا فيه، لكن الحرام أقرب وأسهل.<br />بخاطركم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

[[comments]]
order = 9
subject = "سؤال واحد يتيم"
author = "إبن بهية"
posted = "2006-07-28"
text = "لي سؤال واحد يتيم ... الجيش المصري فين ؟؟؟ مش عايزينكم تضربوا إسرائيل .. مش عايزينكم تحرروا القدس .. مش عايزينكم تعملوا حاجات صعبة إلا على الرجال .. عايزينكم فقط تخرجوا العميل الخائن من مصر .. انتم عارفين مكانه كويس .. هتلاقوه في أي خرابة من اللي انتم عارفينها كويس .. في مصر الجديدة أو عابدين أو شرم الشيخ حتى .. مش بعيد عن إيديكم .. مستنين إيه ؟؟؟؟ طيب يا باشا يا لوا انته وهو وهو وهو ... بتحلق ذقنك الصبح طبعاً ... يا ترى بتشوف نفسك في المراية ؟؟؟ عايز أسألك سؤال بسيط جداً .. يا ترى بتحس إنك راجل ؟؟؟ لأ لأ ما اقصدش شوارك ولا شنبك .. انته فهمتني غلط .. الشنب مش هو رمز الرجولة زي ما سعادتك عارف يا باشا الصرصار عنده شنب أطول منك .. لكن بجد بجد كده ومن غير لف ودوران ... بتحس إنك راجل ؟؟؟ حاسس إنك راجل فعلاً ؟؟؟ طيب ازاي ؟؟؟ بأمارة إيه يا باشا .. يا سيادة اللوا انه وهو ؟؟؟ شيل إيدك من تحت .. الصرصار برضه عنده زيك وأحسن منك .. بص لوشك في المراية كده ... شوف نفسك .. عارف أصلاً يعني إيه رجولة ؟؟؟ ولا تغيير المناهج كمان كان في الكليات العسكرية ؟؟؟ علموكم فيها إن الرجولة كده ؟؟؟ علموكم فيها إنك تسيب سينا فاضيه عشان تكون سهلة في إيد العدو لما يخش ؟؟؟ علموكم في الحربية إنكم تسيبوا العرص اللي انتم عارفينه يبيع البلد للصهاينة (إشي مصانع ، شركات ، أراضي وغيره وغيره ) وبكره ييجوا يعيشوا وسطنا غصب عن عين أهلنا ونقطع مصر حتت .. اليهود ياخدوا شبرا والمصريين ياخدوا اللي بالي بالك .. لسه حاسس إنك راجل يا باشا ؟؟؟؟ طيب سلملي على شوارك .. وقلوظ فيهم .. وحفهم (مش حواجبك .. شواربك يا باشا) وزوق نفسك كدهقدام المراية قبل ما ييجي العسكري طلبه يشيل جثة جنابك لمكتبك .. تقعد تنطر وتشتم في خلق الله عشان تحس إنك راجل .. برضه لأ ... الرجوله معروغة يا باشا ... اسأل عنها جدودك .. أكيد إنك جاي من ضهر راجل .. بس نسوك في عهد العمالة إنك تكون راجل ...<br />إبن بهية<br />http://ibnbahya.blogspot. com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

[[comments]]
order = 10
subject = "الرجلين الوحيدين في هذه الأمة .."
author = "إبن بهية"
posted = "2006-07-28"
text = "الحرب على الجميع .. حرب أمريكا والغرب وليس الصهاينة حفنة العصابات التي لملموها من أزقة وحواري وشوارع أوروبا وحملوهم في البواخر التي حطت بهم على ضفاف بلادنا الناعسة على ذراع الحكام المخنثين من بني سعود والهاشميين وأولاد محمد علي في مصر آنذاك ... يشاء ربك أو يشاء اليهود أن يكمل ثلاثتهم المؤامرة .. بقي نظام آل سعود كما هو والهاشميون كذلك وتغيرت أسرة محمد علي في مصر وجاء عبدالناصر فابتكروا له الحيل والمصائب حتى رحل وجاؤنا بخليفة له ليس من صلبه بل هو ابن عار اسمه السادات ومن وراءه مبارك القواد الذي تم تعيينه بالفاكس القادم من السفارة الأمريكية لاستكمال مسيرة النضال ضدنا .. هكذا نرى بأم أعيننا بلادنا وهي تستباح .. المعركة التي يقودها السيد حسن نصر الله في لبنان هي معركة الأمة والله .. أنا سني ولكني بكل جوارحي معك يا سيد حسن .. ووالله سيثبت التاريخ بعد عشرات السنين أن هذه الأمة لم يك فيها غير رجلين يدركان حقيقة الأمور هما السيد حسن نصر الله والشيخ أسامة بن لادن وبقية الأمة غنم وقطعان شاردة لا تدري لها سبيلاً .. غنم يسوقهم إلى المذبح جزار كريه اسمه مبارك وعبدالله السعودية عبدالله الأردن .. وللأسف تساق الأمة إلى حتفها وقدرها المحتوم دون أن تلتفت لرجليها العظيمين أسامة ونصر الله لأسباب كثيرة أهمها إهمال فريضة الجهاد وإسقاطها عبر سنوات الذل والهوان وغسيل العقول بأيدي تاب باعوا ضمائرهم للعدو وبسبب حب الدنيا وكراهية الموت في سبيل الله والوطن والكرامة .. دعنا من رجلي الأمة الوحيدين .. فالإسلام يسبب الحساسية للبعض أحيانا وبسببب نكبة الإعلام الذي يسمي الجهاد إرهاباً والكرامة إرهاباً والعزة إرهاباً ؟؟؟!!! فما الخنوع والخسة والنذالة والخناثة والخيانة والعمالة إذن ؟؟؟ هو رجولة هذا العصر الرديء .. عصر مبارك عبدالله عبدالله ... أليس فيكي يا أمة العرب رجل مثل جيفارا ؟؟؟؟ تشي جيفارا ؟؟ هل سمعتم عنه يا أمة العرب ؟؟؟ هل تعرفون عنه شيء ؟؟؟ لا أعتقد .. سبعون عاماً من غسيل المخ العربي لابد أن تفرز تلك القذارة ...<br />إبن بهية<br />http://ibnbahya.blogspot. com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134744/http://www.20at.com/article2.php?sid=1102"

