[[comments]]
order = 0
subject = "بين الوليمة و الشفرة"
author = "محمد علي"
posted = "2006-06-18"
text = "أعترف أنني حتى الآن لم أقرأ الرواية و لم أشاهد الفيلم و لكن هناك ما أريد التعليق عليه<br />عندما وزعت وزارة الثقافة الرواية القذرة المسماة ( وليمة لأعشاب البحر )بما تحتويه من ألفاظ نابية و اعتداءات سافرة على ذات الله - جل و علا - خرج علينا \" وزير الصفاقة \" أبو شعر منكوش يدافع عن الرواية و حرية الرأي و عدم وجودحدود للإبداع و أن الفن فوق النقد ... إلى آخر هذا الكلام الفارغ و أخذ هذا أبو شعر منكوش هو و شيعته يكيلون الكلام ضد ( المتترفين الإسلاميين الوحشين )<br />لكن اليوم و بالنسبة لشفرة دافنشي فهوشخص مختلف تماما يرفض الإساءة للأديان و الأخلاق<br />اللهم العن المنافقين و أرحنا من وجوههم العفنة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145018/http://www.20at.com/article2.php?sid=954"

[[comments]]
order = 1
subject = "لا ليس منطقي"
author = "محمد علي"
posted = "2006-06-19"
text = "القرآن الكريم و السنة النبوية المطهرة بالفعل لم يذكرا أن سيدنا المسيح عيسى بن مريم (عليهما الصلاة و السلام )قد تزوج و لذا فإننا لا نأخذ من يقول بهذا على محمل الجد خاصة و أن نبي الله عيسى ( عليه السلام ) قد رفعه الله إليه و أنجاه و هو صغير ... معظم الروايات تقول انه لم يتجاوز ال 35<br />و لكن للأخ الذي كتب فوقي : ما علاقة الطهر و النقاء بالزواج؟<br />هل من يتزوج غير طاهر و نقي بينما من لا يتزوج طاهر و نقي ؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145018/http://www.20at.com/article2.php?sid=954"

[[comments]]
order = 2
subject = "حرية نعم .. صفاقة لا"
author = "د.ياسر شلبي"
posted = "2006-06-19"
text = "كلنا مع حرية التعبير لكن من قال ان الافتراء بالكذب على نبي من انبياء الله حتى ان لم يكن بالإساءة هي حرية ؟؟ لا فهي صفاقة و كفر وليست حرية تعبير و ما يدهشني حقا كيف تجرأ صناع الفيلم على نبي الله عيسى عليه السلام بهذا الشكل ؟؟ و كيف انهم اصبحوا لا يحترمون الاديان على الاطلاق ؟؟؟و ما يدهشني أكثر كيف قبل البعض بهذا الفيلم و استنكر منع عرضه؟؟؟؟؟؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145018/http://www.20at.com/article2.php?sid=954"

[[comments]]
order = 3
subject = "غلطان اللي طلب منع الفيلم"
author = "بنت فلسطينية من غزة"
posted = "2006-06-19"
text = "بجد غلطانين الي طالبوا منع الرواية او الفيلم من مصر<br />وانا متأكدة ان العضو البرلمان المسلم اللي طلب منع الفيلم لا قرأ الرواية ولا جرب يعرف هي بتتكلم عن ايه بجد<br />انا قرأت الرواية (500 صفحة قرأتهم في اسبوع ,, مش حتقدر تغمض عينيك ههههه).. وشفت الفيلم (وهو موجود على النت ومترجم كمان) .. وهي حتى لو كان فيها جانب خيالي ومن تأليف الكاتب .. بس اكيد فيها جوانب من الحقيقة .. ويكفي انها بتخلي الواحد يفكر ويشغل دماغو شوية .. ويشوف زوايا في التاريخ والفن بطريقة عمره ما شافها قبل كدة والصراحة بنصح الكل المسلمين والمسيحيين بقرائتها .. وكداب الي بيقول انها بتسيء للإسلام<br />عمرك فكرت ليه الموناليزا اسمها كدة ؟؟ عمرك كمسيحي جربت تتخيل السيد المسيح انه بشر ونبي كريم رسالته كانت رسالة التوحيد؟؟ عمرك سألت نفسك ليه Sunday هو يوم الاجازة عند المسيحيين ؟؟ اسألة كتير<br />انت بنفسك حتكتشف اجابتها وانت بتقرأ الرواية .. والحق ان الفيلم كويس نسبيا بس قراءة الرواية امتع بكتير<br />بس خلاص .. حسيت حالي رغيت كتير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145018/http://www.20at.com/article2.php?sid=954"

[[comments]]
order = 4
subject = "نسيت اقول حاجة"
author = "نفس البنت الي فوق"
posted = "2006-06-19"
text = "الرواية ما فيهاش ابدا اساءة للنبي الكريم عيسى عليه السلام من وجهة نظر الاسلام .. هي بتلغي عنه صفة الألوهية .. وبالتالي بتقول انه كإنسان كان من الطبيعي في ذلك الوقت ان كل شاب بعمره يكون متزوج ..والنصوص القرأنية ما فيهاش ما يدل انه لم يتزوج .. وطالماان ده لم يذكر بالنص .. فالقول انه تزوج بالفعل ليس فيه تكذيب لنص<br />والنقطة التانية .. الرواية بتكشف جانب كبير من التلاعب الي تم على يد الامبراطور الوثني قسطنطين لدمج بعض الرموز الوثنية في المسيحية .. ومنها اعطاء صفة الالوهية لعيسى عليه السلام<br />يا جماعة اقرأوا الرواية الاول بعدين اتكلموا وناقشوا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145018/http://www.20at.com/article2.php?sid=954"

[[comments]]
order = 5
subject = "حرية الفكر و الابداع"
author = "ايمان محمد"
posted = "2006-06-19"
text = "انا نفسى أقرا الرواية علشان احكم عليها بفكرى المتواضع البسيط وانا ضد منع اى شىء غن الناس لازم ندى الناس فرصة عشان يشوفوا و يسمعوا ويحكموا بنفسهم على الرواية والفلم ومحدش يكون وصى على حد و يحتكر آرائة و فكرة ونسيب الناس يقرروا الاى هم عاوزينو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145018/http://www.20at.com/article2.php?sid=954"

