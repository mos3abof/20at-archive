text = "السلام عليكم<br />احياء حيفا جميلة جدا، وكذلك احياء عكا ونهاريا وصفد ويافا، وجميع المدن الفلسطينينة التي يحتلها الاحتلال الصهيوني الغاشم، فهذه ارض فلسطين ومهما حدث ستظل ارضهم."
