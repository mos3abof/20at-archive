text = "بسم الله الرحمن الرحيم اما بعدفي تعليقي علي انا السجائر وكرسي المعسل والشيشه والتدخين لا تبطل الصيام وليست مكروهةاو محرمه شرعافإن النظرالي ما حرم الله والي النساء العاريات وسماع الاغاني والفرجه علي افلام الجنس ايضألا يبطل الصيام لان الصائم هنالا يأكل ايضااذا كان الغيبه والنميمه والكلام الكلام بس يبطل الصياماارجو الرد؟؟؟؟؟؟؟؟؟(المسيح الدجال)"
archived = "2006-11-02"
