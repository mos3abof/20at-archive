text = "بهدوء يا جماعة وبعيد عن الألفاظ البذيئة<br />الراجل محتاج رد من الكتاب والسنة ومن أقوال العلماء في أن التدخين يبطل الصيام<br />وأنا من ناحيتي معترض على قوله ان الدخان عبارة عن هواء وانه لا يمكن التحرز منه فهذا كلام خاطيء ودخان السجائر ليس مثل العطور<br />ومن كان عنده رد أبلغ من هذا فرجاء ألا يبخل به على اخوته"
