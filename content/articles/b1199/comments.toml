text = "اختي الي فوقي[[[[[[[[[[[[[[[ كلامك جميل جدا وفيه غيرة على الاسلام لكن لدي ملاحظة ;;;; وهي تقولين ان من قال الله ورسوله اعلم فقد افتى ''''''''''''' لا لا يا اختي هذا الكلام عهد الرسول صلى الله عليه وسلم في حياته حينما يسال الناس في امور دينهم فيقولون لانعلم الله ورسوله اعلم ............ لكن الان انقطعت الرساله ومات الرسول فلا نقول الله ورسوله اعلم ......... لان الرسول في الحقيقة ميت لايعلم .............. والعلم يكون مع الله حتى لانشرك به شيئ ............ اما اننا نا خذ بما جاء به الرسول صلى الله عليه وسلم من احاديث فا احسن .......................................................................... فلنترك الفتوى لاصحابها من المشايخ والعلماء ............................... ثانيا حينما تذكرين الرسول لا تقولي ص فهو بخل لان النبي صلى الله عليه وسلم قال اتعرفون من البخيل قال الصحابه البخيل من لا درهم له قال لا ; البخيل من ذ كرت عنده فلم يصلي علي .............. فل نقل تادب معه صلى الله عليه وسلم وليس ص ////////////////////////// ومره اخرى احببتك في الله ولم يهن علي ان اقرا ولا ادلك على الصواب كثر الله امثالك"
