subject = "مهاجمة الكاتب ليست الحل"
author = "امالي سودة"
posted = "2006-09-13"
text = "السلام عليكم<br />باديء ذي بدء ارفض رفضا قاطع مهاجمة الكاتب ولكن علينا ان نبين له بالحجه حتي ناخذ ثواب ونكون سببا في هدايته عن رايه باذن الله تعالي<br />واقول للكاتب :<br />الصيام هو امتناع الصائم بامر من الله عز وجل عن فعل الحلا والمباح مثل الاكل والشرب وشهوة الفرج فما بالك بالمحرمات ومنها التدخين والذي استند تحريمه علي قاعدة لاضرر ولا ضرار وهي من اصول القواعد الفقهيه هذه نقطة<br />النقطة الثانيه قال رسول الله ص لاتجتمع أمتي علي ضلالة وقد اجتهد علماء المسلمين واجتهدوا وكان رايهم الفقهي تحريم التدخين وكلامك صحيح ان الاجتهاد ليس منزه عن الخطا ولكني أرد عليك بان لايؤخذ بالاجتهاد في حال جعف الاجماع بعد مرور الزمن ومثلا اصبحت هناك ضرورة لاباحه فعل هذا الشيء هذه نقطه<br />النقطه الثالثه من قال الله ورسوله اعلم فقد أفتي<br />وهناك شروط في الفقيه لكي يكون اهلا للفتوي منها ان يكون حافظا للقران الكريم وحافظا لعدد معين معين من الاحاديث النبوية الشريفه ألخ شروط أخري كثيره ولاتوقع نفسك في هذه الفتنه ز<br />جزاكم الله وإياي خيرا<br />وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123604/http://www.20at.com/article2.php?sid=1199"

