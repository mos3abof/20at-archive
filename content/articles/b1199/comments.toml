[[comments]]
order = 15
subject = "لا تجتمع امتي علي ضلاله"
author = "داليا"
posted = "2006-09-07"
text = "صدق رسول اللع عليه افضل صلاه وسلام اخوتي انا سعيده لاجتماعكم علي رأي هذه هي الامه التي يحبها الله ويفضلها والله يفتحها عليك يا احمد شلبي ادعوكم جميعا لقراءه ما تعليق الاخ احم فكلامه شديد الاهميه وهو جبلك من الآخر واكرر شكري لك واتمني من الله تعالي ان يفهم جميه الشباب والشابات المسلمين هذه الحقيقه هذا كله اسرائيليات ليشوهوا القرآن ولن الله تعالي يقول إن انزلنا القرآن وان إليه لحافظون فنتبهوا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123604/http://www.20at.com/article2.php?sid=1199"

[[comments]]
order = 16
subject = "دعاة على ابواب جهنم"
author = "أبو جهاد المصرى"
posted = "2006-09-09"
text = "لا اله الا الله<br />استغفرك اللهم واتوب اليك<br />حتى لو الكلام منزوع من سياقه وانا قدامى المقال كله اهوه<br />بس ده لا يمنع ان الراجل ده بيستهبل ..... والمصرى اليوم برضه بتستهبل بس دى عادتها يعنى ..... لكن بقى مش عارف ليه الموقع ده رضى على نفسه انه يبقى اهبل ..... ولا يمكن دى عادته وانا معرفش .....<br />استاذ جمال ؟<br />الفتوى الاجتهادية العظيمة دى .... لرضا مين بالظبط؟<br />رئيس الشركة الشرقية للدخان ؟<br />بس دول غلابة بيبيعوا كوك الضعيف ام 2 جنيه ....<br />امممممممممم<br />يبقى بقى اكيد سيادتك قابضلك ارنبين تلاتة خضر من اللى عليهم صورة ابوك جورج واشنطن دول من شركة فليب موريس والخطوة الجاية بقى تحريم الكليوباترا وشرب المارلبورو ....<br />بس بص خليها الاحمر من الضهر للعصر والابيض من العصر للمغرب فى نهار رمضان ومن الفجر للضهر ممكن نشرب معسل ....<br />وبعد المغرب يبقى براح بقى حتى لو عايز تشرب كيلوباترا .. او صاروخ بانجو او تلفلك سيجارة حشيش ....<br />انا شفت ملحوظتك بتاعة انك لا تدخن .... بس اكيد بتشم وبتبرشم ... وبتضرب سرنجات ماكس وبتشرب منقوع صرم<br />يا اخى ارحمونا بقى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123604/http://www.20at.com/article2.php?sid=1199"

[[comments]]
order = 17
subject = "انت عينت نفسك مفتي و لا ايه"
author = "احمد الفقي"
posted = "2006-09-10"
text = "انت تقول كلام غير عقلاني وهزا امر يحصك ولكن ان يصل بك المر ان تطاول على الدين بمحاولة الافتاء دون وجه حق<br />يا اخي لا تغضب من لهجتي القاسية ولكن انت ستتحمل زنب من يتبع فتوتك<br />اما بخصوص فتوتك الغريبة<br />1-- العلم اثبت ان التبغ وهو المكون الاساسي للسيجارة يحتوي علي نسبة كبيرة من انيكوتين وهي مادة مخدرة ازن تعامل معاملة الخمور وعيرهاز<br />2-- التدخين يصيب الجسم بامراض خطيرة من ضمنها سرطان الرئة ازن فهو يهلك جسم الانسان ويمكن بزلك التعامل معها وفقا للقاعدة الشرعية التي تقول لا ضرر ولا ضرار<br />انا خلصت كلامي لوعايز تناقشني كلمني على الايميل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123604/http://www.20at.com/article2.php?sid=1199"

[[comments]]
order = 18
subject = "دعونا نحكم العقل"
author = "أبو كريم"
posted = "2006-09-11"
text = "هناك حديث يقول \" أجرأكم على الفتوى أجرأكم على النار \" وأنا أنصح الأخ الكريم \" جمال البنا \" ان يبحث عن موضوعات تفيد المسلمين ولا سيما أن الموضوع المنشور أراه يضر ولا ينفع ويمكن أن يقتنع به من ضعف إيمانه وسنجد من يدخن فى نهار رمضان تحت حجة أن الأستاذ جمال البنا أقنعه بأن التدخين فى نهار رمضان لا يفطر ولا يبطل الصيام .. ووقتها سيتحمل أ/ البنا وزر من صدقه وأستجاب لدعواه .. أرجوا أن يتدارك الأمر ويعترف بخطأ تناول هذا الموضوع ويصححه منشوراً حتى يبرأ بنفسه من سنه سوف يسنها ويتحمل عاقبتها الى يوم الدين ... وجذاكم الله خيراً"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123604/http://www.20at.com/article2.php?sid=1199"

