subject = "بقلم جمال البنا"
author = "بقلم جمال البنا"
posted = "2006-09-29"
text = "الشائع والمنتشر أن التدخين يبطل الصيام، ومن دخن سيجارة واحدة أو حتي أخذ نفساً اعتبر مفطراً.<br />الغريب أن هذا الحكم وصل إلي حد الإجماع الذي لا يسأل عنه، كأنه بديهية، وأعتقد أن المسؤول عن ذلك هو التعبير العامي الشائع عن «شرب السجائر»، وبديهي أنه مادام شرباً فإنه يبطل الصيام.<br />ولكن هذا التبرير، الذي يبدو بديهياً هو مما لا يصلح في الفقه، فمتي كانت الأحكام تقوم علي تعبيرات عامة؟، والتعبير نفسه غير سليم، ولا يشفع له الانتشار والشيوع لأن الدخان لا يشرب، ولكن يستنشق لأنه ليس سائلاً.<br />مع هذا فيبدو أن هذا السبب هو عدم إشارة الكتب والمراجع الحديثة إلي مبرر تحريم تدخين الدخان، فقد جاز الأمر علي العلماء، كما جاز علي العامة وقد جاء اليوم الذي نحقق فيه هذه القضية.<br />نحن لا نجد بالطبع لا في القرآن الكريم، ولا في السنة، ولا في المراجع التي كتبت في القرون الهجرية الثلاثة أي إشارة إلي تدخين، وهذا أمر مسلم به بالطبع لأن التدخين إنما ظهر بعد نزول الرسالة بأكثر من ألف عام، فلا يمكن أن نرددها نحن الآن.<br />وجاءت النصوص مقصورة علي الأركان الثلاثة: الامتناع عن الأكل، والشرب، والمخالطة الجنسية، والصيام شعيرة من شعائر العبادة، والعبادة لها طبيعة خاصة أشار إليها الفقهاء وتحدث عنها ابن تيمية فقال: «إن تصرفات العباد من الأقوال والأفعال نوعان: عبادات يصلح بها دينهم، وعادات يحتاجون إليها في دنياهم...» فباستقراء أصول الشريعة نعلم أن العبادات التي أوجبها الله أو أحبها لا يثبت الأمر بها إلا بالشرع.<br />أما «العادات» فهي ما اعتاده الناس في دنياهم مما يحتاجون إليه، والأصل فيها عدم الحظر، فلا يحظر منها إلا ما حظره الله سبحانه وتعالي، وذلك لأن الأمر والنهي هما شرع الله، «والعبادة» لابد أن تكون مأمورا بها، فما لم يثبت أنه مأمور به كيف يحكم عليه بأنه محظور؟<br />ولهذا كان أحمد وغيره من فقهاء أهل الحديث يقولون: إن الأصل في العبادات التوقيف، فلا يشرع منها إلا ما شرعه الله، وإلا دخلنا في معني قوله تعالي: «أم لهم شركاء شرعوا لهم من الدين ما لم يأذن به الله» «الشوري ٢١»، والعادات الأصل فيها العفو، فلا يحظر منها إلا ما حرمه الله، وإلا دخلنا في معني قوله تعالي: «قل أرأيتم ما أنزل الله لكم من رزق فجعلتم منه حراما وحلالاً» «يونس ٥٩».<br />ومرة أخري.. إن أصل الإباحة لا يقتصر علي الأشياء والأعيان، بل يشمل الأفعال والتصرفات التي ليست من أمور العبادة، وهي التي نسميها العادات أو المعاملات، فالأصل فيها عدم التحريم، وعدم التقيد إلا بما حرمه الشارع وألزم به، وقوله تعالي: «وقد فصل لكم ما حرم عليكم» «الأنعام ١١٩» عام في الأشياء والأفعال.<br />ولوحظ أن القرآن يندد بكل من يحرم أو يحلل من تلقاء نفسه: «ما جعل الله من بحيرة ولا سائبة ولا وصيلة ولا حام ولكن الذين كفروا يفترون علي الله الكذب وأكثرهم لا يعقلون» «المائدة ١٠٣».<br />«وقالوا هذه أنعام وحرث حجر لا يطعمها إلا من نشاء بزعمهم وأنعام حرمت ظهورها وأنعام لا يذكرون اسم الله عليها افتراء عليه سيجزيهم بما كانوا يفترون. وقالوا ما في بطون هذه الأنعام خالصة لذكورنا ومحرم علي أزواجنا وإن يكن ميتة فهم فيه شركاء سيجزيهم وصفهم إنه حكيم عليم. قد خسر الذين قتلوا أولادهم سفها بغير علم وحرموا ما رزقهم الله افتراء علي الله قد ضلوا وما كانوا مهتدين» «الأنعام ١٣٨:١٤٠».<br />«قل من حرم زينة الله التي أخرج لعباده والطيبات من الرزق قل هي للذين آمنوا في الحياة الدنيا خالصة يوم القيامة كذلك نفصل الآيات لقوم يعلمون» «الأعراف ٣٢».<br />«ولا تقولوا لما تصف ألسنتكم الكذب هذا حلال وهذا حرام لتفتروا علي الله الكذب إن الذين يفترون علي الله الكذب لا يفلحون» «النحل ١١٦».<br />«قل أرأيتم ما أنزل الله لكم من رزق فجعلتم منه حراماً وحلالاً قل الله أذن لكم أم علي الله تفترون» «يونس ٥٩». ويشتد هذا عندما يكون بتحريم ما لم يحرمه الله، لما في هذا من العنت والضيق بالناس.<br />وجاءت السنة النبوية مؤكدة هذا المعني فقال الرسول فيما معناه ما أحل الله في كتابه فهو حلال، وما حرم فهو حرام، وما سكت عنه فهو عفو، فاقبلوا من الله عافيته، وقال في صيغة أخري الحلال ما أحله الله في كتابه، والحرام ما حرم في كتابه وما سكت عنه فهو مما عفا لكم.<br />ومرة ثالثة «إن الله فرض فرائض فلا تضيعوها وحد حدوداً فلا تعتدوها، وحرم أشياء فلا تنتهكوها، وسكت عن أشياء رحمة بكم غير نسيان، فلا تبحثوا عنها».<br />وقال: «إن أعظم المسلمين جرماً من سأل عن شيء لم يحرم علي المسلمين فحرم عليهم لأجل مساءلته».<br />هذه الآيات والأحاديث تعبر أصدق تعبير عن مسلك الإسلام تجاه تحريم ما لم يرد بشأنه نص صريح في القرآن، وإن السكوت عما سوي ذلك لا يعني نسياناً وإنما «رحمة بكم»، ولهذا يفترض ألا يستدرك.<br />ولكن منهج الفقهاء غير ذلك وهم يريدون دائماً الأحكام الجامعة المانعة ويحرصون علي ألا تفلت منها فلتة، وعندما أرادوا أن يقعدوا الأكل والشرب «باعتبارهما ما جاء النص عليه»، قالوا: «وصول عين يمكن التحرز منها إلي جوف الصائم من منفذ مفتوح انفتاحاً ظاهراً يحس مع العمد، والعلم بالتحريم والاختيار». فقولهم «وصول عين» خرج به وصول أثر، فلا يضر وصول الرائحة بالشم إلي الدماغ، ولا وصول الطعم بالذوق إلي الحلق من غير وصول عين من المذوق..<br />وقولهم: «يمكن التحرز عنها» معناه: «يمكن تجنبها والابتعاد عنها، وخرج به العين التي لا يستطاع تجنبها، ولا البعد عنها، فلا يضر دخولها الجوف، ولا تبطل الصوم، منها غبار الطريق، وغربلة الدقيق، والذباب، والبعوض، فإذا دخل شيء منها جوف الصائم فلا يبطل صومه لعسر التحرز عنها» «كتاب الصيام للشيخ عبدالفتاح القاضي ص٤٩».<br />أقول: إن هذا التعريف لا ينطبق علي الدخان لأنه ليس «عيناً» فهو هواء، وهو يمتزج بالهواء الذي لابد وأن يستنشقه الإنسان فلا يمكن الاحتراز منه، فضلاً عن أنهم تقبلوا دخول الرائحة بالشم إلي الدماغ.. «وهل يفعل المدخن إلا هذا»؟.. أو الطعم بالذوق إلي الحلق، أما العلم بالتحريم والاختيار، فلا يوجد تحريم سابق، ولا يعتمد تحريم الفقهاء علي تحريم سابق لأنه ـ كما ذكرنا ـ لا يوجد في كتاب أو سنة أو مرجع قديم.<br />علي أنني لا أريد أن أدخل في مساجلة مع العلماء لأن هذا يخالف منهجي،<br />ولكنني أقول: إن صدور تحريم يسري علي الملايين دون الاستناد علي نص صريح من قرآن وسنة، ولكن علي أساس الاجتهاد بجعل حكمهم قابلاً للخطأ، فضلاً عن أن هذا جاء في أمر عبادي يكون الوضع الأمثل هو التوقيف، فلا زيادة ولا نقصان، كما أنه يخالف روح الإسلام الذي يؤثر التيسير ويعزف عن التعسير والتضييق الذي يوقع الدين في حرج، وقد يجاوز إطار الطاقة والوسع.<br />ونري أنه حكم بني علي اجتهاد بشري في استخلاص الحكم دون وجود نص صريح، بل وجود نصوص صريحة تخالف الاتجاه الذي ذهب إليه الحكم.<br />ولا يقال هنا: إن التدخين ضار بالصحة، وإن من الخير الإقلاع عنه أصلاً فنحن هنا نتحدث عن حلال وحرام أنزله الله، والإسلام لم يطلب من الناس أن يبلغوا الغاية، أو أن يتقوا الله حق تقاته، وإنما رضي منهم أن يبذلوا الوسع وأن يأتوا منه ما استطاعوا وقد دلهم علي طريقة التعامل مع الضعف البشري بأن يقدموا ما يمكنهم لتعويض ما لا يمكنهم.<br />وللقضية جوانب خاصة وسيكولوجية واجتماعية، كما تخضع لروح العصر، لذلك لم تصل الحملات علي التدخين لأن تغلق شركات السجائر أبوابها، فلا داعي لإعنات مجموعات عديدة باسم الشريعة وتحميل الشريعة ما لا تتحمله أصولياً.<br />ملاحظة: كاتب المقال لا يدخن."
