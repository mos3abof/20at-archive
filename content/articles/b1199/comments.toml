[[comments]]
order = 20
subject = "نقاش القش احسن من نقاش اللب"
author = "ايت وكريم احماد"
posted = "2006-09-12"
text = "تحية زكية امازيغية من المملكة المغربية الشريفة<br />اما بعد<br />فلي عظيم الشرف ان اتقدم لكم بردي هدا الدي اتمنى ان يجد لديكمرحابة<br />نتكلم عن الشهوات ونناقش الاسلام شكلا وندع الاهم الا وهو الموضوع<br />الحرام بين والحلال بين<br />نحن على ابزاب رمضان هدا الشهر الكريم الدي فقد كل مقوماته لدى من يدعون الاسلام<br />لاننا نثشبت بالقش ونترك اللب<br />منت اتمنى لو ناقشتم الزور في رمضان والغش في رمضان والزنى النزري في رمضان والرفت في رمضان والمحسوبية في رمضان وغيرها من الافعال التي نراها في هدا الشهر الابرك الدي فرغ من محتواه<br />واصبح مجرد شهرا للبروتوكول الاسلامي<br />معدرة على هده التسمية لكن لم اجد لها بديل<br />العرب اصبحوا مسلمين حسب الموقع الجغرافي لا اقل ولا اكثر الا من رحم رك وهم قلالئل<br />ولكم اسمى عبارات التقدير والاحترام<br />المضطهد الامازيغي بقرية الدعارة بالمملكة المغربية الشريفة<br />وتستمر المعانات في دولة الحق والقانون وتستمر السيبة في بلادي المغرب الحبيب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123604/http://www.20at.com/article2.php?sid=1199"

