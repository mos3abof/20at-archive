posted = "2006-09-06"
text = "يا جماعه هذه الاخبار عباره عن اسرائليات<br />وهى المعروفه بتضليل كل شىء عن القرأن الكريم<br />واشهر هذه الاسرأئليات انهم قد رسخوا فى ذهن الناس<br />ان الشمس ثابته ولكواكب تدور<br />وهذا خطا لان فى الحقيقه ان الشمس هى الذى تدور والكواكي ثايته<br />وقد جاء هذا فى ايه<br />لن اذكرها لاننى لم اتذكرها جيدا<br />ومعنها ان الشمس تدور والفلك والكواكب تدور من حولها<br />الله انى بلغت الله فأشهد"
