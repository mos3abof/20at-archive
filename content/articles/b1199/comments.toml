subject = "افتراءات البنا"
author = "سليط الزهراني"
posted = "2006-09-23"
text = "يا أيها البنا: من قال إن دخان السجائر هواء؟<br />الهواء أكسيجين (بنسبة 21%) ونيتروجين (بنسبة 78%) والواحد في المائة المتبقية ثاني أكسيد الكربون وبعض الغازات النزرة كالهيدروجين والهيليوم والأرجون ... إلخ).<br />ودخان السجائر يتكون من عديد من المركبات الكيميائية التي يصل عددها إلى 4000 مركب، من أخطرها أول أكسيد الكربون، والقار ، والنيكوتين.<br />والفرق بين استنشاق الهواء واستنشاق السجائر أن الأول عمل يتم تلقائياوطبيعيا، أما الآخر فيتم إراديا وبرغبة الشخص.<br />ثم إن دخان السجائر يتسلل أيضا إلى المعدة، وهو يدخل إليها عن طريق الفم فالمريء (بالإضافة إلى الدخان الذي ينساب إلى الرئتين). وقد اتفق الفقهاء على أن أية مواد تدخل الجسم عمدا من الفتحات المعروفة تبطل الصيام.<br />طبعا أنت غير مقتنع بأقوال هؤلاء الفقهاء. فأنت لا تتبع غير هواك. وأنت تريد أن تقول لنا: وإني وإن كنت الأخير زمانه*** لآت بما لم تستطعه الأوائل.<br />والسلام على من اتبع الهدى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123604/http://www.20at.com/article2.php?sid=1199"

