subject = "الرجل المخرف"
author = "المصرى الاصيل"
posted = "2006-09-06"
text = "قال رسول الله صلى الله عليه وسلم(مااجتمعت امتى على ضلاله) صدق رسول الله----- هذا مما اجمعت عليه الامه ثم ان التدخين لا يبطل الصيام فقط بل انه من المحرمات باجماع الائمة ثم ان تفسير الشيخ لايات القران تفسير خاطىء فى غير محله انظر لتفسيره لاية الانعام32 وهل التدخين من الطيبات فالرجل متوهم تختلط عليه الامور ربما لكبر السن او اشياء اخرى لانعلمها هدانا الله واياكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123604/http://www.20at.com/article2.php?sid=1199"

[[comments]]
order = 1
subject = "أنت مخطىء"
author = "احمد شرف"
posted = "2006-09-06"
text = "الأستاذ كاتب المقال<br />بعد التحية<br />أخالفك فى الرأى حول عدم تحريم التدخين كما يلى:<br />1- الصيام ليس انقطاعا عن الطعام والشراب فقط بل انقطاع عن كل الشهوات التى كانت مباحة قبل الصيام واذا فرضنا أن التدخين عادة وشهوة لدى المدخن فإنه يحرم تناولها قطعيا .<br />2- أن التدخين حرام شرعا لأن القاعدة الفقهية تقول :أى شىء يضر بـ: العقل- النفس- النسل - المال - الناس ) فهو حرام فإذا كان التدخين يضر على الأقل ببعض ما سبق فهو إذن حرام شرعا سواء فى الصيام أو غير الصيام وحرمته فى الصيام أشد لأنه تناول لضار ومحرم شرعا فى وقت الصيام .<br />3- أن تناول المدخن للسيجارة لا يكون عبثا وإنما عن حاجة ماسة إليه كما يحتاج إلى الأكل والشرب ولذلك فتناوله يعتبر إطفاء وإشباع لحاجة الجسم الضارة طبعا وكما عوده صاحبه - من الدخان والنيكوتين<br />4- كنت آمل وأتوسم فيك أن تكون أكثر غيرة على دين الله وأن تبتعد عن الفتوى وأن تؤيد الامتناع عن تلك العادة الذميمة التى حرمها الله تعالى ( ولا تلقوا بأيديكم إلى التهلكة )<br />وأخيرا ورغم اختلافى معك فى الرأى إلا أننى أكن لك وللجميع فائق الاحترام والتقدير وأرجو أن نتعاون سويا لرفعة دين الله الذى سيسألنا عن ذلك يوم القيامة<br />وتفضلوا بقبول وافر الاحترام .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123604/http://www.20at.com/article2.php?sid=1199"

[[comments]]
order = 2
subject = "ايه العك ده"
author = "ياسر ابو عمار"
posted = "2006-09-06"
text = "ايه يا جماعة العك المنشور ده ،ان كان الاستاذ جمال سنه كبر فليس عليه حرج وان كانوا فى المصرى اليوم رضيوا ينشروا الهطل ده فلا افهم ليه تعيدوه تانى مع انه كلام واضح اهتراؤه وسذاجته .<br />واضح ان الاستاذ جمال ...للاسف البنا اصبح بيدور على الموضوعات اللى البنى ادمين كلهم اتفقوا عليها من زمان علشان يتحفنا بارائه النيرة فيها ،ليه كده يا عم الحاج ده انت لو سالت اصغر عيل ماشى فى الشارع هيقولك ان التدخين حرام فهل الحرام لا يفطر يا سيدنا ،هل قرات فتوى الشيخ نصر فريد واصل عن تحريم التدخين ولا سيادتك ما بتقراش الكلام الفارغ ده ،اتق الله يا عم جمال وخاف على اخرتك ،والله انا بحبك وبانصحك بس علشا ن خاطر اخوك اللى نور ربنا على ايده افهام ملايين البشر لكن للاسف لم تستفد منه اى حاجة خالص .وعجبى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123604/http://www.20at.com/article2.php?sid=1199"

