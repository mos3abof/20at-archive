text = "عفوا سيدى انت تتحدث عن اشياء تجر الامة الى الخيبة فى شبابها انا مواطن عادى لا افقة شى ء فى الدين ولسيت فقيها وانا من المدخنين انت تحلل التدخين فى اشهر الصيام لن اتحدث عن مساوء التدخين على الصحة فالكل يعلمها لكن ان ابيح التدخين فى الشهر الوحيد اللذى نقاوم فية مادة النيكو تين ونحاول على قدر المستطاع ان نبتعد عنها فى الشهر الفضيل انت تجرنا لسؤال اخر هل يجوز شر ب الشيشة والحشيش متاهة تدخلنا فى متاهة واخيرا جزاك الله على عملك ان كنت ترمى به خيرا فهو لك وان كنت ترمى لافساد الامة فالله غالب"
