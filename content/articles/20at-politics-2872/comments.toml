text = "من الواضح جداً من هو الذي بدأ بهذه الفتنة الداخلية في لبنان بعد انتهائه من الحرب الإسرائيلية الغاشمة التي خرج منها لبنان بدمار هائل حل في بنيته التحتية وخسائره البشرية أولاً والمادية ثانياً, فأصبح الهدف بعد الحرب إسقاط الحكومة, وتخريب الأوضاع الداخلية بين اللبنانيين, و تحولت الحدود الإسرائيلية من الجنوب لتصبح في الشمال بكل أسف, لكن سيأتي يوم سيذل فيه الظالم و العابث باستقرار لبنان سيأتي هذا اليوم إنشاء الله (قولو آمين)"
