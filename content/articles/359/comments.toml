subject = "منى أبوالحسن"
text = "لابد من رؤية الصورة الكاملة، قبل التساؤل عن الحلول، وإلا لن التكون الحلول واقعية أو قابلة للتنفيذ..<br />ليس المقصود تهيج المشاعر ضد الشعب العراقي، و ليس من الإنصاف تجاهل مشاعر الشعب الكويتي.. و لهذا لابد من طرح الصورة الواقعية كاملة، لإيجاد الحلول الواقعية الممكنة..<br />ننتظر اقتراحاتكم و آرائكم حول هذه الحلول"
