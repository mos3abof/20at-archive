subject = "موقع عشرينات"
text = "نرجو من جميع المعلقين الالتزام بآداب الحوار والنقاش، ونتمنى ألا يتطاول معلق على آخر، وألا يجرح بعضنا بعضاً، فهذه ليست طريقة للحوار.<br />والموقع يرجو أن يتركز النقاش على الموضوع المنشور حتى لا تتعرض المداخلات إلى الحذف كاملة."
