[[comments]]
order = 6
subject = "Iraq"
text = "Al Salamu Alaykom<br />First, excellent work from Mona to an important issue indeed. Being an Egyptian myself makes it easy for me to say that it's possible for Kuwaitis to forget about what happened before and start a new life with Iraqis especially after what happened to Saddam, but I am different from them because I haven't experienced or have seen what they saw.<br />But in my humble opinion, we shouldn't generalize any trait about certain people, because people vary from one person to another in the same small family, not to mention a whole country.<br />What Saddam did can never mean they are all like that. I know it's hard for people to forget, just try to forgive.<br />And hopefully, all arabs will unite once again and the future will be bright without hatred towards each other.<br />Thanks Mona, and keep up the good work<br />Sarah Mansour"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018163409/http://www.20at.com:80/article.php?sid=647"

[[comments]]
order = 7
subject = "عراقية"
text = "مشكلتنا ياعرب في التعميم.... نعم هناك فئة من الشعب العراقي فعل جرائم في كويت وفي المقابل كان هناك فئة اخرى ترفض هذه الجرائم ولا تشترك فيه...<br />والان هناك فئة من الشعب الامريكي يفعل جرائم بشعة في اهل العراق وهناك فئة اخرى من الامريكان ترفض هذه الجرائم ولذا انا لا اكره جميع اهل امريكا ولكن اكره فقط الذين يوافقون على الجرائم ويفعلونه"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018163409/http://www.20at.com:80/article.php?sid=647"

[[comments]]
order = 8
subject = "احمد خان"
text = "الي الاستاذ عميد الغول ....انت مجرد واحد بتعلق على تعليقي في سبيل انك تنافق الكاتب ....ايه الصحافه العاريه هذه ..انا عارف ان الكلام الي في المقاله هو الحقيقه بس مش هو ده الي مفروض علينا كعرب واخوان ان نكتبه...كان شو هيصير لو هي كتبته عن ان الكويتين يرضون بعوده العراقيين جيرانهم من جديد اليست هذه حضاره الرافدين ...اصبحت بتهوننا حضاره العم سام...احنا كل نقدر نقوله ان المشكله هذه هيوجد لها حل اجلا ام عاجلا زي فلسطين كده ..صح دخله كده على 60 سنه واحنا ما تقدمنا اي خطوه امام من اجل فلسطين...بعدين المشاهد في الي موجوده كلها حقيقه وما فيش شك في كده ..بس ليه ما يكون التتر الاخير ما يتمناه العرب ان يحدث بين العراق والكويت"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018163409/http://www.20at.com:80/article.php?sid=647"

[[comments]]
order = 9
subject = "عوضي على الله"
text = "الأستاذه منى<br />الموضوع جيد فهو يناقش امر واقع لابد من مناقشته فأنا لست من انصار دفن الروؤس بالرمال وكله عال واحنا اخوه في الوقت الذي نرى فيه ان العكس ما يحدث كما ان الموضوع لم يكن رأي شخصي وانما استطلاع لاراء اهل البلدولكن كان رايي ان يكون السوأل الأساسي عن كيفية التقريب او ما ذكرتييه بقولك \"وما العلاج في رأيك ؟\" ويكون الحوار متمحور حول هذا الموضوع ويطرح هذا السوال على شخصيات الأستطلاع...اما رايي عن التقرييب فهو ممكن فأمريكا واليابان وامريكا والمانيا(اقصد الشعوب والحكومات)كانو اعداء والأن الحب مفيش بعد كده وسمنه على عسل وهذه الشعوب لا يوجد بينها روابط تاريخيه كالموجوده بين بلادنا فأرى ان كلا من الشعبيين في حاجة لأظهار حسن النوايا كما يمكن ان تكون هناك ملتقيات شعبيه يتم التركيز فيها على جوانب الأخوه مع تجاهل الماضي وعدم الحديث عنه او يكون التقارب بمشارييع خدميه بين البلديين او مشروع قومي لربط البلديين بسكك حديد مثلا يشارك فيه شباب من الدولتين او رحلات مشتركه هذه بعض الأفكار ولكن في رأيي الحلول الحقيقيه سوف تأتي من الشعبيين الشقيقين فأهل مكه ادرى بشعابها وانا اعلم جيدا يا أختي ان غرض المقال ليس تهييج المشاعر بين الشعبيين فنيتك خير ان شاء الله<br />والسلام"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018163409/http://www.20at.com:80/article.php?sid=647"

[[comments]]
order = 10
subject = "منى أبوالحسن"
text = "أشكر جميع المعلقين على التفاعل مع الموضوع، و أتمنى منكم المزيد..<br />الأخ أحمد خان:<br />خاتمة المقال يدل على ايماني و اقتناعي بضرورة انتهاء هذه المشاعر السلبية بين شعوب البلدبن، لكن من طول عشرتي للشعب الكويتي علمت و رأيت أن تحقيق ذلك ليس بالأمر السهل، ولولا اصراري على ضرورة ايجاد حل لهذه المشكلة، ما كان هذا المقال.. فالكل يعرف أو يستطيع أن يتنبأ بموقف الشعب الكويتي و مشاعره.."
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018163409/http://www.20at.com:80/article.php?sid=647"

[[comments]]
order = 11
subject = "جهد يستحق الثناء وموضوع يستحق الرثاء"
text = "أود في البداية أن أعبر عن ثنائي على العمل من الناحية المهنية، فهو معد بطريقة شيقة ومبذول فيه جهد وإن كان الموضوع الذي يتناوله يغم ويسد النفس..وعموما ربنا يشفي نفوس من لا زال يشعر بالمرارة، وأود أن أنوه أن الأحكام التعميمية لا تصدق وولا يحب أظن أي شعب فينا أن يسمع ما يصفه به الآخرون، وأظن أن تلك الدعاوى التعميمية هي من دعاوى الجاهلية..عموما ربنا يهدي الجميع، ويعيد للأمة عافيتها النفسية والإيمانية والعملية"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018163409/http://www.20at.com:80/article.php?sid=647"

[[comments]]
order = 12
subject = "حنة"
text = "أولا الموضوع حلو جدا ومنى ليست مسؤولة عما هو موجود فعلا في الواقع ولو سكتنا عنه سيظل كالقيح تحت الجرح ...<br />الكويت امريكية ... هكذا كنا نهتف احيانا في المظاهرات وكان هتافا موجعا للقلب فلا نحن نفرح ولا نتمنى أن تكون أي بقعة ارض من ارضنا امريكية ... لكن هذا هو الواقع الكويتيون يريدون أن يكونوا أمريكان .. يولون وجوههم قبلة أمريكا ويعادون العرب والعروبة .. ويتعاملون بقلب أسود ونظر قصير .. هم فعلا لا يعترضون أن تنتشر القواعد الأمريكية على أرضهم ولا يعتبرون هذا انتقاصا لسيادتهم بينما كونهم جزء من العراق (وهذه حقائق التاريخ) يعتبرونها انتقاصا من سيادتهم<br />الكوايتة يا اخواننا قتلوا فيصل الحسيني لما زارهم انتقاما من موقف الفلسطينيين مع العراق ...<br />الكويتية التي سألت المصريين عن موقفهم من قتل بعض المصريين في العراق أحب أقول لها بصراحة نحن المصريون شعب متحضر وعريق ولا يقبل بالتشفي في شعب آخر وذبحه وتدمير حضارته بدافع الانتقام والثأر .. وحين نفكر تدفعنا مصلحة العرب والمسلمين وكل ما يحدث .. والغزو الأمريكي للعراق الذي انطلق من ارضكم هو عدوان ضد مصلحة الاسلام والمسلمين وضد مصالحكم انتم انفسكم وغدا لناظره قريب"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018163409/http://www.20at.com:80/article.php?sid=647"

[[comments]]
order = 13
subject = "معلش بأه"
text = "ارجو من الأخوة \"الأعزاء الأشقاء المتربيين\" ان يكونوا اكثر تأدبا فى ردودهم ويبطلوا سفالة وطولة لسان , ما هو المعنى الذى يريد \"الاخ اللى مش محترم\" ان يوصله للزوار عندما يستخدم الفاظ تهكمية واسلوب وقح يتهم الكاتبة ويطعن فى من يدافع عن وجه نظره ويرميه بالنفاق .... هلا شققت عن صدورهم , يوجد من امثالك الكثيرون \"وإذا قيل لهم لا تفسدوا فى الأرض قالوا إنما نحن مصلحون , ألا إنهم هم المفسدون ولكن لا يشعرون\" والذين يملئون ساحات (الجدال) فى كثير من المواقع والتى اكثروها للأسف اسلامية واكثر اصحاب الألسنة \"الزالفة\" يتوهمون الشجاعة ويدعون القوة فى الحق واكثرهم من القاعدين الذين يحاولون ان يثبتوا لأنفسهم من خلال اسلوبهم الصفيق ان كل الناس هم من امثالهم قاعدين او مخطئين وانهم هم صوت الحق والمدافعين عن الحقيقة المطلقة, اتقوا الله فقد اذيتمونا كثيرا باصواتكم التى هى اقرب الى انكر الأصوات وكنتم السبب فى تولى الكثيرين عن فوائد تلك المناقشات بسبب نهيقكم المزعج.<br />اسف على رسالتى الطويلة والغليظة , لكن كرهت تحول هذا الموقع الرائع والذى لم ارى له مثيل , الى ساحة اخرى من ساحات الجدال التى يتباهى المشاركون فيها ايهم اعلى صوتا واوقح اسلوبا.<br />ارحمونا بأه"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018163409/http://www.20at.com:80/article.php?sid=647"

