[[comments]]
order = 2
subject = "احمد خان"
text = "السلام عليكم ورحمه الله وبركاته<br />ده يا جماعه الي امرنا بيه ربنا ان احنا نوقع شعوب في شعوب ....طيب دلوقتي لما عراقي يقرا الموضوع ده هيتاكد ان مش ممكن ان الميه ترجع لمجاريها..وان الشعبين هيكون بينهم عداوه مهما حصل من تدخلات اجنبيه<br />ده يا استاذه منى اخلاق الصحفي ...انه يبني شهره على حساب ناس تانيه...طيب اكتبي الموضوع بس بصيغه ان الكويتين يرضون بعوده جيرانهم العراقيين ...بعيدا عن ارض الواقع احنا لازم نقرب بينهم مش نبعدهم اكثر ..احنا مهما حصل احنا عرب<br />وعلى فكره في مثلك كثير يا استاذه منى في احقر مذيع ايمن القاسم و في غريهم كثيير تخصصهم بناء شهره على حساب سياسه دوله<br />شكرا"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018163409/http://www.20at.com:80/article.php?sid=647"

[[comments]]
