[[comments]]
order = 15
subject = "مشاركه على قد الحال"
text = "السلام عليكم ورحمة الله وبركاته<br />تجية طيبة للبنوووته العشرينية كاتبة المقال اولا على الموضوع ثانيا على اسلوب الطرح الشيق .. ومع انها ادخلت نفسها بارادتها عش الدبابير .. فليس هناك مفر من الدخول معها والنقاش بكل وضوح وشفافية اذا اردنا او كان في نيتنا بصيص رغبة لكشف ما يدور حولنا والبحث في كيفية الخروج من هذه المآسي<br />بداية ايضا فالحقيقة اغلب ما قرأت من تعليقات هنا كانت عشرينية الصبغه بمعنى انها تفتقد الى التحليل والرؤية العميقه وكأن الموضوع أخين حدث بينهم خلاف وضربوا بعض ونريد ان نصالحهم . والامر اكبر من ذلك بكثير جدا .. اسمحوا لي ان نتعمق قليلا في هذا الحدث .. واقول<br />يعني ايه كويت؟؟ يعني ايه سعوديه؟؟ ايه الاسماء دي؟؟ بل ايه هومسمى دول الخليج ده؟؟ التاريخ بيقول في حاجة اسمها دول الخليج؟؟ طبعا لا ..نحن نعرف ان اليمن والجزيره العربية والعراق والشام ومصر وبلاد المغرب العربي .. ومعنى كلامي ايه ان كل دول الخليج دي دول منشأة حديثا وكل اهلها كانوا اسمهم سكان الجزيزه العربية .. يعني كلهم شعب واحد وكل اسماء الدول دي اسماء مصطنعه وليس لها وجود في الاساس .. واقرب البلاد كانت للجزيره العربية هي العراق .. حتى في اللغه .. واهل الجزيزة العربية والعراق تحديدا نسيج واحد وقبائل عربية واحده .. فهناك اصهار وانساب بين كل القبائل منتشرين في كل الجزيره والعراق .. وعادي جدا ان تجد عنوز في السعوده والكويت والعراق وتجد دواسر منتشرين في كل البلاد وزهرانين ايضا ومن كل القبائل .. ما اريد قوله اننا بنتكلم عن ناس عايشين في بيت واحد .. الاخوه الكويتين اللى بيكلموا عن بشاعة العراقيين نسوا ان بقية اهل الخليج يعتبرون الكوياته اغلظ اهل الخليح طبعا واقساهم وطبعهم الغرور وما الى ذلك .. وهو ما ينطبق على العراقيين ايضا من وجهة نظر بقية اهل الخليج .. واقصد من ذلك انكم لا يجوز ان تقذفوا العراقيين بالسوء لانكم ليسوا افضل منهم حالا .. دعونا لا نخرج من الموضوع .. واقول ان اقرب شعب الى الشعب الكويتي هو العراقي والعكس وهذا قبل ان تحدث هذه الازمه وعبر الزمن .. ومن هنا ارفض رفضا قاطعا ما يقوله أي كويتي على عراقي او العكس لانهم الاكثر فهما لبعضهم .. اقدر بدون شك مشاعر الكويتين لما حدث لهم اثناء الغزو وطبعا عشت هذه الفترة بكل تفاصيلها ودقائقها هنا في الرياض وعشت وتحدثت مع الكويتين هنا .. بل انني اكاد اجزم ان ما بين الشعب الكويتي والسعودي اكثر بكثير مما بين الكويتي والعراقي .. واذا لم تصدقوا ارجعوا الى مباريات الكره بين الجانبين .. ولكن جاءت حرب الخليج الاولي لتذيب الى حد ما الجليد المتراكم بين السعوديه والكويت .. واصبح الان الجليد بين الكويت والعراق .. من هنا اقول واقر ان ما بين الشعبين من علاقات عائلية ونسب وود يفوق كثيرا ما يحاول بثه وتاصيلة اعوان امريكا داخل الكويت والعراق من البغض والكره والحقد .. حتى صدام نفسه فقد كان في يوم من الايام بطل الابطال وحامي حمى العرب عند الكويتيين وكانوا يحبه حبا يفوق الوصف .. انا باقول كل الكلام ده .. لاني ارى اننا جميعا للاسف نعيش في غيببه كامله أو بمعنى اخر نحاول ان نغيب نفسنا بنفسنا ونقنعها اننا السبب او صدام السبب او الكويتين السبب .. للأسف نحن ليس سببا ولا حتى طرفا في كل هذا البلاء .. ولكننا وادوات فقط .. فنحن جزء من لعبة دولية كبرى .. لعبة مصالح الدول الكبرى .. وكما اقاموا الحواجز وقسمونا سابقا بما يخدم مصالحهم .. فالآن يريدون اعادة التقسيم بما يخدم مصالحهم في الوقت الحالي .. ولأننا اصبحنا كما صدق المصطفى صلى الله علية وسلم من 1424 عام بأننا سنكون امة غثاء كغثاء السيل .. اصبحت الامم تتلاعب بنا كيفما شاءوا .. ولا حول ولا قوة الا بالله..<br />لذلك الحديث عن حلول لأي مشاكل بين العرب في منطقة الشرق الاوسط لم يعد له طعم ولا لون ولا رائحه في الوقت الحالي .. لان الحل الوحيد لكل ذلك هي الوحده العربية وهي لها مقومات عديده ليست متوفرة حاليا .. فلن تحل أي مشكله عربية بما فيها فلسطين بحلول فردية .. ولكن عندما نصبح امه واحده اسمها الولايات العربية المتحده .. ساعتها نقدر نتكلم على الحلول .. مع ان هذه الفرصة كانت مواتية لنا بعد حرب اكتوبر 73 لكي نكون امة واحده .. ولاننا امة الفرص الضائعه .. فقد ضاعت الفرصة وتفرقت الامه وحتى تاريخه .. والى ان يشاء الله سبحانه وتعالى.<br />فانا من وجهة نظري ليس حلا لازمة العراق والكويت فقط ولكن حلا لكل مشاكلنا .. ان يبدأ كلا منا بنفسه وبمن يعول في تربية النفس على التعاون وعلى تقبل الاخر كما هو وليس الاخر التفصيل الذي يريد .. علينا ان نحسن علاقتنا اولا نحن كأفراد بعضنا ببعض وننسى العنصرية البغيضه هذا كويتي وهذا مصري والا سوري والا مغربي .. ونعود الى الله سبحانه ونحسن ايضا علاقتنا معه ونعلم علم اليقين انه لم يصيبنا ما اصابنا الا بما فعلت ايدينا .. وكما قال عمر رضي الله عنه نح<br />Read the rest of this comment..."
