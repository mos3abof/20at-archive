subject = "ايه يا حج احمد؟"
text = "انت مش عايش في الدنيا ولا ايه؟<br />هو الشعب العراقي و الكويتي محتاج الي يوقع بينهم؟ ما هما فعلا واقعين في بعض و ده واضح من كلام الناس في الكويت و كلام العراقيين الي بيحملوا الكويت مسؤلية الي بيحصل لهم من سنة 90 من حصار، يبقى الحل اننا ندفن راسنا في الرمل و نقول احنا اخوات و بنحب بعضناو نتجاهل الواقع؟ و آخرتها؟ الجرح عشان يلتئم لازم ينضف، حتى لو كان تنضيفه مؤلم.. ولا ايه؟"
archived = "2004-10-18"
