text = "زى ما احنا شايفين<br />القرار فية خراب بيوت لناس من الشعب المصرى<br />يعنى قرار عشوائى اتخذة ابو جاموس ووافق علية مجلس الموافقات ومصالح الناس تروح فى ستين داهية وامن الدولة معرض للخطر وجهاز الامن مش عارف يعمل اية مع اصحاب المقطورات والا مع الصيادلة<br />دولة تعتمد فى حل مشاكلها على جهاز الامن لا بد ان تنهار ان عاجلا او اجلا"
