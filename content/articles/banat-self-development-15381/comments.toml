text = "\"لكن بمجرد رؤيتك للنتائج سوف تستمتعين أكثر منه لشعورك بالتفوق عليه\"<br />واضح فعلا انك مجربة علشان مش فاهمة اى حاجة ,, يا حاجة انتى العملية ما بين الراجل و مراته مش حرب او منافسة او سباق ما بينهم مين اللى يتفوق على مين لكن بتبقى على حسب الموقف ,, انا بجد دماغكوا دى غرييييييييييييي يييييييبة"
