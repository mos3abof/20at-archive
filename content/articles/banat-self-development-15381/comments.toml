subject = ""
author = "أحمد المصرى"
posted = "2010-02-22"
text = "يا دودو أنا قصدى ان ربنا قال ان الزواج سكن و مودة و رحمة يعنى مش سباق مين يغلب مين أو مسواة و انعكاس أدوار بالعكس انا شايف ان الزوج و الزوجه بيكملوا بعض و اعترف ان الاتنين مفيش حد فيهم يقدر يعيش من غير التانى لأن الاتنين لو عايشين مع بعض بطريقة صحيحة يبقى هيقدر كل طرف يشبع حاجة الطرف الاخر (العاطفية - الجسدية - المادية) و يقوم بدوره على اكمل وجه لكن المشاكل بتبدأ لما بيحصل خلل فى اداء الادوار او لما بيحصل انعكاس فى اداء الادوار يعنى مثلا ان الست تبقى بتشارك فى مصاريف البيت"
archived = "2010-03-13"
capture_url = "https://web.archive.org/web/20100313173911/http://www.20at.com:80/banat/self-development/15381-2010-02-18-10-36-39.html"

