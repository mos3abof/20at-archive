[[comments]]
order = 2
subject = ""
author = "صحصح يا منير اديب"
posted = "2008-07-20"
text = "كاميليا مذيعة وليست فنانه يا منير اديب (صحصح يا راجل)<br />المذيعة المعتزلة كاميليا العربي<br />منعوني من دخول التليفزيون بالحجاب<br />خيروني بين الشاشة والحجاب فاخترت الأخير<br />القاهرة - مكتب الراية - أمل خضير:<br />كاميليا العربي.. مذيعة تليفزيونية لامعة.. قدمت العديد من البرامج المتميزة فتعلقت بها قلوب الصغار والكبار.. ومما ساهم في نجاحها نشأتها الفنية حيث والدها الفنان الراحل عبدالبديع العربي وشقيقاها محمد ووجدي العربي وزوجة شقيقها الفنانة المعتزلة هناء ثروت وفي أوج نشاطها الفني كمذيعة قررت فجأة ارتداء الحجاب.. مما أسفر عن إبعادها من التليفزيون المصري،"
archived = "2009-06-01"
capture_url = "https://web.archive.org/web/20090601092941/http://www.20at.com:80/t7kyk/9650.html"

[[comments]]
order = 3
subject = ""
author = "مش ضروري"
posted = "2008-07-20"
text = "اخراج وجه المرأة عن دائرة العورة من الاعجاز المستقبلي للاسلام<br />عندما اخرج الاسلام وجه المرأة عن دائرة العورة فذلك لانه دين حضاري ودين اعجاز<br />لماذا<br />لان ربنا قال في القرأن (ويخلق ما لا تعلمون)<br />والخيل والبغال والحمير لتركبوها وزينة ويخلق ما لا تعلمون<br />عندنا ذكر الله سبحانه وتعالى الخيل والبغال والحمير كان يعلم سبحانه وتعالى ان سأتي على الناس يوم فيه سيارات وطائرات وخلافه فقال ويخلق ما لا تعلمون<br />فالله سبحانه وتعالى عندما اخرج وجه المرأة عن دائرة العورة لانه سبحانه وتعالى كان على علم بأن سيأتي يوم على العالم كل واحد لا بد ان يكون معه بطاقة شخصية وجواز سفر وسيكون مثبت عليها صورته ولابد ان يخرجها في أي وقت يطلب منه فهناك امن ومطارات واماكن لابد للمرأة ان تثبت فيها هويتها وشخصيتها وذلك بكشف وجهها<br />فإخراج الاسلام وجه المرأة عن دائرة العورة من اعجاز الاسلام ومن حضارية الاسلام<br />ويخلق ما لا تعلمون"
archived = "2009-06-01"
capture_url = "https://web.archive.org/web/20090601092941/http://www.20at.com:80/t7kyk/9650.html"

[[comments]]
order = 4
subject = ""
author = "مش ححبك"
posted = "2008-07-20"
text = "يا اخ منير اديب<br />الوجه ليس بعورة لكن الصوت عورة<br />يا اخي تلاقي المنقبات مايين الدنيا وبيركبوا ومواصلات وفي كل مكان وتلاقي حسهم طالع وملغلغ ومع ذلك تلاقيهم لابسين النقاب<br />مع ان الوجه ليس بعورة لكن الصوت عورة<br />يعني يا اخ منير وانت بتعمل معاها حديث هي مغطية وجهها علشان خاطر انت ما تشوفوش مع انه حلال تشوفوا<br />لكن حرام عليها تسمعك صوتها وحرام عليك تسمع صوتها<br />لكن كامليا العربي وبقية المنقبات (الا من رحم ربي) بيموتوا في الحركات القرعة<br />فنوجه نداء الى كل الاخوان المنقبات بان الصوت عورة لكن الوجه ليس بعورة<br />فبلاش حركات قرعة والله"
archived = "2009-06-01"
capture_url = "https://web.archive.org/web/20090601092941/http://www.20at.com:80/t7kyk/9650.html"

