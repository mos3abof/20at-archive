posted = "2008-12-29"
text = "حسبنا الله و نعم الوكيل .. أصبح الدين هو الستار و المخرج لسرقة أموال اليتامى و جمع التبرعات التى يتم صرفها على المشاريع الخاصة و القصور ..<br />هذه السيدة كانت تسكن فى عابدين منذ سنوات قليلة و لم تكن تملك من المال شئيا و لكن بعد انشاء دار الايتام و جمع التبرعات أصبحت تركب السيارات الفارهة و لديها 4 قصور فى منطقة جولف القطامية يقدر سعرهم بعشرات الملايين .. اتقوا الله و توبوا الى الله ان عذاب الله شديد"
archived = "2009-06-01"
