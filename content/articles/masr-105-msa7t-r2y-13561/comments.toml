posted = "2009-10-12"
text = "ايه يا محمد عبدالمنعم<br />ايه العك دا<br />فيه حاجه اسمها يا ريتني<br />يا ليتني يا اخي<br />خد جرس عربي عند عبدالله الطحاوي"
archived = "2009-10-17"
capture_url = "https://web.archive.org/web/20091017180834/http://www.20at.com:80/masr/t7atuf/13561-2009-09-29-08-31-01.html"

[[comments]]
order = 10
subject = ""
author = "فى قمة الياس"
posted = "2009-10-13"
text = "حينما اكون فى قمة الياس<br />وافقد اى ضوء فى مستقبل هذا البلد بحكم الواقع المر والاليم<br />اذهب الى باب مدرسة ابتدائى واراقب الصغار وهم يخرجون من باب المدرسة واتفحص وجهوهم جيدا<br />ربما اجد مصطفى كامل جديد او سعد زغلول او حسن البنا او جمال عبد الناصر<br />وارجع ببعض الامل<br />ربما من يخرج من هؤلاء فارس يركب الحصان ويقود مصر الى التقدم والحضارة والنصر<br />ربما<br />ربما<br />ربما<br />ورغم كوابيس التوريث"
archived = "2009-10-17"
capture_url = "https://web.archive.org/web/20091017180834/http://www.20at.com:80/masr/t7atuf/13561-2009-09-29-08-31-01.html"

[[comments]]
order = 11
subject = ""
author = "تدمير البلد"
posted = "2009-10-13"
text = "تدمير البلد يبدأ بتدمير التعليم<br />المعلق اللى بيقول الهندسة ب 50 %<br />طيب اية رايك فى اصحاب الفلوس اللى بيرسلوا اولادهم بفلوسهم رغم ان اولادهم جايبين 50 % فى الثانوية العامة يرسلون ابنائهم لدارسة الطب والهندسة فى رومانيا وبلغاريا وروسيا وبعضهم يرسلهم الى اليمن والسودان وباكستان والهند<br />التعليم فى مصر 3 شعب منفصلة<br />التعليم فى معاهد وجامعة الازهر<br />التعليم الحكومى<br />التعليم فى المدارس الخاصة العربية والجامعات الخاصة<br />التعليم فى المدارس الاجنبية الالمانى والانجليزى والامريكى والجامعات الفرنسية والامريكية والالمانية<br />يعنى تقدر تقول تعليم سمك لبن تمر هندى<br />مفيش هوية للتعليم ولا وطنية ولا انتماء<br />فية مخطط لتدمير البلد<br />ومخطط لافقار البلد يشرف علية اولياء الامر لتمرير التوريث حتى ولو دمرت البلد زى اليمن"
archived = "2009-10-17"
capture_url = "https://web.archive.org/web/20091017180834/http://www.20at.com:80/masr/t7atuf/13561-2009-09-29-08-31-01.html"

