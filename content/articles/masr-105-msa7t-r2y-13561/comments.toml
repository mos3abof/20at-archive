subject = ""
author = "السادات والانهيار"
posted = "2009-09-29"
text = "حينما سمح السادات للاجانب بتغيير المناهج تحت بند عدم معاداة السامية وغرس الكراهية لاسرائيل جاء خبراء التعليم الامريكان شكلا واليهود مضمونا ليفرغوا التعليم من محتواة<br />وهدم ثقافة اى شعب تبدأ من التعليم<br />وانهيار الاخلاق والدروس الخصوصية والتحرش الجنسى والاستهتار واللامبالاة كل ذلك من افراغ التعليم من محتواة<br />حينما سلمنا ذقننا للامريكان حلقوها ونتفوها وتفوا فى وشنا"
archived = "2009-10-02"
capture_url = "https://web.archive.org/web/20091002231428/http://www.20at.com:80/masr/105-msa7t-r2y/13561-2009-09-29-08-31-01.html"

[[comments]]
order = 1
subject = ""
author = "قبلك بعشر سنوات"
posted = "2009-09-29"
text = "كانت المدرسة مدرسة - وكان حضور المدرسين اللى عندهم جدول واللى معندهمش من 7 صباحا الى الثالثة مساءا<br />كان طابور الصباح العسكرى بقيادة ضلبط الفتوة وشاويشية الطابور وزى الفتوة العسكرية والمرور على الطلبة للتاكد من حلق شعرهم وتلميع احذيتهم واداء تمارين الصباح بقوة<br />فى الفسح كانت مباريات بين فريق الطلبة وفريق المدرسين<br />كانت هناك العاب القوى والمتوازيان ورمى الرمح والجلة وتكوين اجسام الشباب القوية<br />كان الطالب الذى ياخذ درس خصوصى منبوذ وياخذة فى السر المطلق ولم تكن هناك مجموعات تقوية وكان المدرس يشرح ويعيد ويزيد ويكرر ويعمل امتحانات واختبارات اما اذا تغيب طالب لحصة واحدة فالدنيا تنقلب ويجيسبوا ولى امرة وفى احدى مرات غياب طالب ابلغوا مركز الشرطة عنة<br />الاول على الثانوية العامة دفعتى كان جايب 87 %<br />طب طنطا قبلت طلاب 59 % وهندسة اسكندرية 65 %<br />طلاب الثانوية العامة كانوا 75 الف طالب نجح نصفهم وكل الناجحين دخلوا الجامعات الاربع<br />كانت الجامعات هى القاهرة وعين شمس واسكندرية واسيوط<br />كان مرتب المدرس 17 جنية وايجار الشقة 4 جنيهات وكيلو اللحم ب 22 قرش<br />تلك كانت ايام ناصر العظيم"
archived = "2009-10-02"
capture_url = "https://web.archive.org/web/20091002231428/http://www.20at.com:80/masr/105-msa7t-r2y/13561-2009-09-29-08-31-01.html"

[[comments]]
order = 2
subject = ""
author = "تحليل البول"
posted = "2009-09-30"
text = "واللة انا معلوماتى غير معلوماتك تماما<br />انت بتقول ان العيال جابوا مياة من الحنفية بدل من البول اللى هيتحلل<br />انا كنت فاكر زى ما عمل واحد بلدياتى ان علية دفع فلوس تكاليف التحاليل وان تدبير البول شغلة الدكتور فى المعمل هو اللى يجيب البول<br />وبرضة فكرة حلوة ان الواحد يجيب مية من الحنفية بدل ما الدكتور يحتار"
archived = "2009-10-02"
capture_url = "https://web.archive.org/web/20091002231428/http://www.20at.com:80/masr/105-msa7t-r2y/13561-2009-09-29-08-31-01.html"

[[comments]]
order = 3
subject = ""
author = "دودي"
posted = "2009-09-30"
text = "يانهار أبيض، تحاليل من مياة الشرب في مدرسة خاصة ومن كام سنة يعني مسخرة شوف دلوقتي بقى.<br />أنا فاكره أيام الزلزلال مدرستنا اتهدت فيه وخدنا أجازة طويلة بس طلع عين أبونا مذاكرة لأنهم ضغطوا المنهج، ومكنش فيه مدرسة تانية نروحها.<br />أما بقى العيال بتوع اليومين دول مبيحبوش التعليم خالص، انا فعلا كنت بازعل قوي لو غبت يوم وكنت باروح حتى لو عيانة ومش قادرة، امبارح باسال بنوتة قريبتي هتعمل ايه لو أجلوا الدراسة النسة دي قالت ياريت، الواحد يرتاح من المذاكرة والقرف ويتفرغ للأفلام وهاري بوتر"
archived = "2009-10-02"
capture_url = "https://web.archive.org/web/20091002231428/http://www.20at.com:80/masr/105-msa7t-r2y/13561-2009-09-29-08-31-01.html"

[[comments]]
order = 4
subject = ""
author = "ابومحسن غربة 28 سنه"
posted = "2009-10-04"
text = "اخر كلمتين في المقال<br />فعلا يا بختهم<br />وانا اقول<br />يا بختهم على المعاهد والكليات الخاصة غير المتوفرة في زماننا<br />على ايامنا دراسة الطب الذين حصلوا على اعلى المجاميع وفي المرتبة الثانية الصيدلة<br />يليهم الهندسة<br />ثم العلوم وهكذا<br />الان<br />ممكن ان تدرس في مصر اي كلية تعجبك وبمجموع 50%<br />طب صيدلة هندسة كل دا بقا ممكن في مصر وباي مجموع<br />يا بختهم على ذلك<br />اما مسالة الاجازات دي مسالة نسبية<br />على ايامنا كان فيه اجازات كتير برضه<br />ففي وفاة جمال عبدالناصر اخدنا اجازة 3 ايام<br />وفي حرب 73 اخدنا اجازة<br />وهنا في الخليج فيه اجازات كتير<br />يعني اي رئيس دولة عربية يموت فيه اجازة 3 ايام واخذنا اجازة في وفاة ملك المغرب وملك الاردن وملك البحرين وملك الكويت<br />ولما الشيخ زايد مات اخذنا اجازة اسبوع<br />واي امير يموت بناخد اجازة 3 ايام<br />وربنا يكتر الاجازات"
archived = "2009-10-17"
capture_url = "https://web.archive.org/web/20091017180834/http://www.20at.com:80/masr/t7atuf/13561-2009-09-29-08-31-01.html"

[[comments]]
order = 5
subject = ""
author = "فعلا يا بختهم"
posted = "2009-10-05"
text = "واللة العظيم يا بختهم<br />ابنتى الغالية فى كلية حكومية فى جامعة اقليمية تدرس الرياضيات - وجاءت يوما يا سيدى لاقرا لها المسائل واشرح معنى المسالة والامتحانات اقتربت<br />فوجدتها حتى مبادىء المادة لا تعرفها ولا تعرف حتى قراءة الاسئلة وصدمت بالنتيجة فقد نجحت بتقدير جيد<br />مع انى وانا فى سنها قد اعدت ورسبت فى تلك المادة 3 مرات وانا فى سنها<br />طبعا هناك انهيار فى التعليم الحكومى<br />من اجل هذا دفعت باولادى الصبيان الى التعليم الخاص ليتعلموا شيئا ما وفى التعليم الخاص هناك كليات غالية جدا وكليات متوسطة فى مصاريفها وتراعى ظروف الاباء متوسطى الدخل<br />وندمت اننى دفعت با ابنتى الى التعليم الحكومى الفاشل ومن سخرية القدر انها اى ابنتى تقدمت لدراسات عليا فى نفس الكلية ونجحت فى الدبلوم<br />مسخرة<br />وفعلا يا بختهم"
archived = "2009-10-17"
capture_url = "https://web.archive.org/web/20091017180834/http://www.20at.com:80/masr/t7atuf/13561-2009-09-29-08-31-01.html"

[[comments]]
order = 6
subject = ""
author = "ابواب جهنم"
posted = "2009-10-06"
text = "التعليم الحكومى المصرى الجامعى راح فى ستين داهية<br />الدكاترة عارفة ان مفيش شغل للشباب وهيطلعوا يشتغلوا فى مجال بعيد قوى عن تخصصاتهم بمعنى ان خريج الحقوق هيشتغل جرسون فى قهوة وبتاع التجارة هيشتغل مساعد مبيض محارة وخريج الهندسة هيبيع فى كشك سجاير وبتاع الطب يمكن علشان التكليف لسة ماسك نفسة وبتاع الزراعة هيشتغل فى محل بيبيع منظفات او فى سوبر ماركت<br />تبقى الدكاترة تعقد لية<br />كلة ينجح وخلاص اذا حضر الامتحان سواء كتب او لم يكتب وخللى ناس من الدفعة اللى بعدة تييجى<br />كل شىء جميل فى الاعلام الحكومى وكلة بياكل رز بلبن مع الملايكة وتلاقى تصريحات وزارية وكاننا احدى دول اوروبا الغربية<br />وبعضهم رفع شعار الجودة فى التعليم - جودة اية وهو من اصلة مفيش تعليم<br />والتانى قال لك التمكن من اجل الاجادة - تمكن اية واجادة اية<br />والتالت قال لك كمبيوتر لكل طالب علشان يلعب العاب علية<br />كلة كلام<br />والحقيقة مرة"
archived = "2009-10-17"
capture_url = "https://web.archive.org/web/20091017180834/http://www.20at.com:80/masr/t7atuf/13561-2009-09-29-08-31-01.html"

[[comments]]
order = 7
subject = ""
author = "كنا زكان"
posted = "2009-10-07"
text = "نحن الجيل العظيم الذى تخرج ويوم تخرجة وجد مندوب التجنيد على باب البيت بيقول لة مصر عايزاك<br />نعم بعد التخرج كان لا بد من يخبط احدهم على الباب بيقول لة ياللة بنا فية نكسة فى البلد وسيناء محتلة والجيش عايزك - مريض سليم بنضارة ما بتشوفش هتروح هتروح<br />كيف كان التعليم ؟<br />فى الاعدادية كانت القصة المقررة فى اللغة العربية هى قصة واسلاماة للكاتب الرائع على احمد باكثير<br />تصور طالب الشهادة الاعدادية يدرس قصة واسلاماة<br />وفى شهادة الثانوية العامة كانت تدرس لنا احدى عبقريات العقاد ودرسنا عبقرية خالد ابن الوليد<br />جيل كلة وطنية واعتزاز بالوطن والقومية والدين<br />رغم ان الحكم كان اشتراكى<br />ولكن التربية والتعليم كان مضبوط وكنا فى الجامعة نحل امتحانات جامعة كمبريدج فى السنوات المقابلة لنا ونفس المقررات البريطانية<br />التعليم هو اساس اى تقدم واى نهضة واى تربية<br />اعيدوا التعليم الى سابق عهدة وانسوا حكاية التطرف التى طلع الامريكان عليكم بها"
archived = "2009-10-17"
capture_url = "https://web.archive.org/web/20091017180834/http://www.20at.com:80/masr/t7atuf/13561-2009-09-29-08-31-01.html"

[[comments]]
order = 8
subject = ""
author = "مهندس بـ 50%"
posted = "2009-10-11"
text = "الجيل العظيم بتاع زمان اللي كان علشان يخش كلية الهندسة يبدأ مذاكرة من اول ما نتيجة تانية ثانوي تطلع اول ما العام الدراسي يخش يكون مخلص منهج الثانوية ويا دوب يراجع طول السنه الدراسية<br />دلوقتي فيه حاجه اسمها اكاديمية طيبة في المعادي<br />بتاخد من 50%<br />وفيها معهد هندسة<br />اي والله<br />عشنا وشفنا في مصر مهندس بـ 505 في الثانوية<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــتتت<br />مش رضوى حسن ولا مروى صلاح"
archived = "2009-10-17"
capture_url = "https://web.archive.org/web/20091017180834/http://www.20at.com:80/masr/t7atuf/13561-2009-09-29-08-31-01.html"

