subject = "قال يعني انتوا اللي هادفين"
author = "صايع وقديم"
posted = "2006-03-16"
text = "اية يا عم الحاج مانتا ناقل الخبر زي ما هوا هما يعني اللي تافهين وانت اللي هادف؟<br />وبعدين علي الاقل هو الاصل و انت اللي ناحت منه الموضوع بس موضوع الاسمو اية الجماعي ده ممكن يجي علي هوا ناس كتير قوي صدقني يابني الشباب تعبانة علي الأخر و ظروفها مش عايز اقولك يعني الشباب بتريل في الشارع<br />و بعدين معتقدش ان دة عبدة شيطان اظن انها موضة ......... ياةةة فين ايام عبدة الشيطان بتوع زمان كان اية يا باشا الكفر بذمة مش اي كلا<br />اللهم تب علينا و اغفر لنا و ارحمنا<br />عم الموزعين الموسقيين<br />sherif_elgalant@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151118/http://www.20at.com/article2.php?sid=578"

