subject = "سبحانك هذا بهتان عظيم"
author = "islam_physics@yahoo.com"
posted = "2006-03-17"
text = "من أين لك كل هذه الإتهامات ومن أتيت لنا بهذه الخرافات التي تقول بها عن ال سعود اتق الله في اقوالك قلي دليل علي ما تقول ام انك تقول عليهم بغير علم ترمي الناس بغير علم ولا دليل وهو رؤساء دولة الوحيدة التي تحكم بشرع الله فيها البيت الحرام ومكة المدينة التي لو مت فيها مت شهيدا ومكة احب بلاد الله الي الله احبها لرسول الله واحبها للمؤمنين فكيف لا نحبها ثم هل ذهبت إلي السعودية ورأيت ما فيهم من خير ايها الحاقد العجيب واريد ان اعرف من هي تلك العصفورة الحقيرة التي اخبرتك عن ان ال سعود هم وراء كل هذا<br />اتق الله<br />مايلفظ من قول إلا لديه رقيب عتيد<br />فإتق الله في قولك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151118/http://www.20at.com/article2.php?sid=578"

