text = "انا احترم عبدة الشطان واتمنى منكم ان لا تعلقوا عليهم كثيرا لانهم يعبدون الشيطان كم تعبدون ربكم نعم انهم لديهم الحريه بان يفعلوا ما يشائوا وانا مع ا----------------------الحريه المتلقه انني احترمهم واتمنى ان احاورهم على الانترنت ليس الا انهم ابطال لانهم يتحدون العالم وانتم ما زلتم تتكلمون برقم الهاتف بامكانكم ان تحاربوا اسرائيل التي اصبحت الصديق العدو لكم وانتم ما زلتم تتكلون على اناس ارادوا ان يكونوا احرار وان يكونوا فوق الطبيعه وشكرا satan_666.lb@hotmail.com"
