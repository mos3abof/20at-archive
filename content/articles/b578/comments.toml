[[comments]]
order = 3
subject = "إلا الشيطان ده معاه خط موبينيل وللا فودافون؟"
author = "عارف"
posted = "2006-03-16"
text = "ممكن يكون الشيطان ما دفعش الفاتورة لأن حد سرق الخط منه!!<br />أو ممكن يكون محتج على أنظمة الدفع الجديدة!!<br />أو ممكن يكون عياله (ولاد الأبالسة) بيتكلموا في التليفون من وراه، فقرر يربيهم!!<br />وممكن تكون العربية بتستهبل وساقت الهبل على الشيطنة، وما اتبعتش الموضوعية والمهنية في النقل ، وراحت ناقلة أي عبط في أي هبل بهدف الاثارة<br />ملحوووووظة: لو زرت موقع العربية \"يوميا\" هتلاقي لازم في الصفحة الرئيسية في خبر \"على الأقل\" مثير على غرار(الفنانة توتو شحبيل: أنا لست فتاة ليل، ولكننى أحب أن اتعرى فقط! ) ، وهكذا .. وهنفضل ناخد على قفانا لحد ما نورم ان شاء الله<br />تصبحوا على خييييير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102151118/http://www.20at.com/article2.php?sid=578"

