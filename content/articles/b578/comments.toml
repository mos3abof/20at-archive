text = "السلام عليكم و رحمه الله<br />الحاجه الوحيده اللي هاتخليني اعلق على الموضوع كله هي:<br />ازاي ان الفاسقين و عباد الشياطين مش بيتكسفوا و لا بيهدالهم بال الا لما ينشروا فسادهم و غيهم على اعلى مستوى و في المقابل تلاقي البنت او الشاب المتدين احيانا\"يتكسف\" يكلم صاحبه اللي بيعمل معصيه!!!!!!!!!<br />يا اخوانا حرام عليكم هي الدنيا اتقلبت<br />المفروض الواحد يدعوا الى الله بكل ثقه و قوه لانه على الحق"
