subject = "الأردن"
author = "امة الله الفقيرة اليه"
posted = "2006-05-20"
text = "انا موظفة وبلسان حالي اعلمكم ان عمل البيت نعمة ونعمة عظيمة جدا ومن فرضت عليهاهذه الحال تحمد الله وترضى ولا تتذمر ولا تشعر بالنقص او الملل بالرغم من اني احب عملي وناجحة به كثيرا الا اني اتمنى ان اكون ناجحة في بيتي وهو ا<br />ا<br />الأهم اختي الحبيبة بيتك ثم بيتك ثم بيتك"
archived = "2006-11-02"
