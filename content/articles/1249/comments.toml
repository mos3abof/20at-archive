[[comments]]
order = 0
subject = "ايه الى خلاه صحى"
author = "اولا المرأه العامله عندنامطحونه ومبيبقاش عندها وقت لا لبيتها ولا لاولادها"
posted = "2006-05-16"
text = "يبقى صحى ايه كفايه كل الشباب والبنات دول اللى ولا لقيين ظبط ولا ربط مبقاش فيه الام اللى تكلم بنتها وتنصح ابنها<br />يبقى صحى فين<br />وياريتها بتبقى شاطره فى بيتها ولا بتخدم جوزها يا بشر انا باتكلم على الاغلبيه اللى موجوده<br />ولو على اروزن الزياده المصريين هما كده مليانين حتى الموظفات<br />ومعتقدش انهم بقى يهمهم التخن ده تلاقيه عاجبهم<br />الكلام ده عند الخواجات لكن عندنا مينفعش<br />يا عم خلو الستات فى بيوتها يمكن الجيل اللى يلاقى امه فى البيت يطلع احسن من اللى احنا فيه دلوقتى<br />اللهم اهدنا الى ما تحبه وترضاه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141352/http://www.20at.com/article2.php?sid=810"

[[comments]]
order = 1
subject = "والاكتر من كده"
author = "عبدالله مفتاح"
posted = "2006-05-16"
text = "الاكتر من كده ان الدراسات والتحاليل الطبيه والتربوية اثبتت حاجات تانيه<br />1- ان الملابس الضيقه للمراة اكثر ملاءمة لطبيعتها الفسيولو جيه والسيكلوجيه وكل ما اخر (جيه).<br />2-ان البنت لازم يكون ليها صديق والا اصبحت معقده ومكلكعة وفقريه.<br />3-الولد اللي ميعاكسش اكيد نفسيته هتتععب لازم يعاكس عشان يحس بنفسه ويكبر على انه قادر على تحقيق ذاته<br />شفتو الدراسات والتحاليل الطبيه والنفسيه والمؤتمرات بتثبت ايه<br />لا وايه كمان اي حاجه عايزين نثبتها ممكن نعمل قعدة عرب ونجيب كريب ناكل ونثبت وتبقى الدراسات اثبتت كده<br />ها حد عايز ييجي نثبتلنا حاجه احنا كمان واهي تبقى دراسه ومؤتمر وتحاليل طبيه<br />لا للتمديد...لا للتوريث...نعم لتعديل الدستور"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141352/http://www.20at.com/article2.php?sid=810"

[[comments]]
order = 2
subject = "شكرا لنشرة 9 ، وصلتلي رسالتي"
author = "واحد من هناك"
posted = "2006-05-16"
text = "احب اشكر موقع عشلاينات وتحديدا نشرة 9<br />لانها بصراحه وصلتلي رسالهل BoBa<br />وصلتك الرساله با بوبا ، تقولي المرأه مكانها في البيت ، اقولك لأا يا خويا ، مكانها في البيت و الشغل والمظاهرات و الجامعهو الجمعيات الخيريه و الحرب لو محتاجاها....<br />تقولي لأا يا سيدي بس انا بخاف عليها وبحبها وكلام بتاع الحبيبه ده ، اقولك ما هوا اي واحد بيحب شريكته في حياته ، بس موش معني انه بيحبها انه يحتكرها لنفسه و مجتمعها يروح في ستين ........<br />لأا المرأه ايام الرسول (ص) شاركت معه في الغزوات<br />والمرأه شاركت في ثورة 1919 ، موش واحده تقولي لما قلتلها تنزل مظاهرة الخميس اللي فات ، تقولي انا هخليني في الشغل ، لأا فوووووقوا يا نبات حوا...<br />لازم ترجعوا من جديد ن بس الاهم انكم ترجعوا صح ..........<br />وموش هوصيكي يا (.....) علي BoBa"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141352/http://www.20at.com/article2.php?sid=810"

[[comments]]
order = 3
subject = "حد عايز يناقش؟"
author = "عبدالله مفتاح"
posted = "2006-05-16"
text = "اللي عايز يناقش بخصوص ان المراة الاصل انها تكون في البيت يجيلي<br />مش بقول انها تتحبس ومتخرجش ابدا لا تخرج وتروح وتيجي وتشتغل لو شغلها مفيد ومش بيبهدلها ومش على حساب بيتها<br />محدش يقول المظاهرات مظاهرات ايه اللي البنات يروحوها ولما تتشد ولا يحلصها حاجه كده ولا كده<br />ايه الكلام الغريب ده<br />هما النساء كانوا بيحاربوا ولا بيضمدوا الجرحي<br />كانوا بينزلوا ساحه المعركه<br />لا طبعا مكنش بيحصل وانا ضد ان البنت تروح مظاهرة عشان متتبهدلش ولو اتاخدت بتتبهدل اوي اوي اوي<br />واللي مش عاجبه يطرح حججه بس من القران والسنه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141352/http://www.20at.com/article2.php?sid=810"

[[comments]]
order = 4
subject = "مروة"
author = "مروة"
posted = "2006-05-16"
text = "المرأة فى الحروب كانت أحيانا بتحارب بجوار الرسول عليه الصلاة و السلام و أرجعوا للسنة مثل السيدة أم عمارة نسيبة بنت كعب ، بجانب انا أمى بتشتغل ولا حد فينا طلع فاشل أو ذو أخلاق سيئة و أحسن من ناس كتير أمهاتهم بتشتغل العيب مش فى الشغل العيب فى الشخصيات نفسها و قدرتها على التربية سواء بتشتغل أم متفرغة و ربنا يتقبل عملنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141352/http://www.20at.com/article2.php?sid=810"

[[comments]]
order = 5
subject = "اخونا بيقول ايه"
author = "واحد من هناك"
posted = "2006-05-17"
text = "استاذ عبدالله مفتاح<br />المرأه كانت تحارب بجانب الرسول ص في غزور أحد ولا اتذكر اسم المرأه التي كانت تدافع عن الرسول الي هنهاية الغزوة<br />يمكن حد من المعلقين يفتكرها<br />شكرررررررا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141352/http://www.20at.com/article2.php?sid=810"

[[comments]]
order = 6
subject = "الى واحد من هناك"
author = "عبدالله مفتاح"
posted = "2006-05-17"
text = "فاكر غزوة الخندق المنافقين مرضيوش يخرجوا للقتال بحجة ان بيوتهم عورة<br />لو النساء كانوا خرجو للقتال مكنوش قالو كده<br />والنساء مكنتش بتنزل ساحة المعركه دي كانت مرات بتضطر انها تقاتل بس الاصل ان الجيش مكنش رجال ونساء ويلا بينا نحارب<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141352/http://www.20at.com/article2.php?sid=810"

[[comments]]
order = 7
subject = "ايه الى خلاه صحى..تانى مره"
author = "مسلمه"
posted = "2006-05-17"
text = "لا الست مكانها الافضل البيت<br />يعنى بعد ما تتعلم وتتخرج من الجامعه وتعمل كمان دراسات عليا تتجوز وتربى اولادها<br />انا بقول كده من خلال تعرفى على بنات كتير امهاتهم بيشتغلو وحالتهم لا تسر لا عدو ولا حبيب<br />هو اه فى بنات كده وامهاتهم فى البيت لكن الفرق ان البنات دول امهاتهم متعلمات ومثقفات لكن التانيين امهاتهم اغلبيتهم دبلومات او حتى غير متعلمين<br />يعنى المفروض الام المتعلمه تبقى ادرى باللى بيحصل حوالين اولادها وعشان كده تقدر تحتويهم احسن وترعاهم وتفهمهم<br />وبخصوص الحرب انا فاكره انى قرات عن صحابيه جليله \"ام عماره\"ولكنها كانت فى الحرب تجب عن رسول الله واصيبت فى الغزوه ولكنها فعلت ذلك عنما مرت وهى تسقى الماء او كانت تداوى الجرحى ولم تجد احدا فى حمايه رسول الله لكن هذا لم يكن دورها الاساسى فى الحرب<br />اللهم اهدى نساء المسلمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141352/http://www.20at.com/article2.php?sid=810"

[[comments]]
order = 8
subject = "واحده من هناك بردو \"فين معرفش \" هبل"
author = "مش شغلك .."
posted = "2006-05-17"
text = "ايه يا با انت وهي مش الباشا اللي فوق دا هو باين اللي قالي \"اللي عايزه الشغل بتشتغل بكررها للمره الالف اللي عايزه الشغل تشتغل ...\" كدا ولاه ايه ..<br />وبعدين هي مش بتطلع ترقص علي المسرح وتعملي فيها كوثر لاه طالعه لهدف حط ميه خط يا باشا<br />والموضوع دا يمكن الرجوع فيه لاراء الشيخ القرضاوي حيعجبك اوي , وبعدين فيها ايه لو مسلمه وبتجيب علم وبتنفع الي حوليها ها فيها ايه فيها ايه .. ومش عايزه حد يجي يقولي \" وقرن في بيوتكن \" عشان دا قصر ديل زيها زي \" لاتقربوا الصلاه وانتم سكاري ...\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102141352/http://www.20at.com/article2.php?sid=810"

