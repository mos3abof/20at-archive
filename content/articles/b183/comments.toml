[[comments]]
order = 7
subject = "حرام شرعا"
author = "رائد بغدادي"
posted = "2006-06-22"
text = "الى كل من قيل عنهم دينهم دنانيرهم اعانه المسلم للكافر على اخيه المسلم حرام شرعا..أما اذا تضنون ان المحتل سوف يحميكم فتعالوا الى بلاد الرافدين لتجدوا رؤؤس من خان قبلكم معلقة على أعمدة الطرق وأختاروا مكانا بينهم ...عجبا لمن يبيع دينه بدراهم معدودات ...أليس من الافضل ان تقاتلوا الامريكان وتطردوهم من بلادكم أولى ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124837/http://www.20at.com/article2.php?sid=183"
