[[comments]]
order = 0
subject = "العراق؟ لا ميرسي"
author = "صايع وقديم"
posted = "2006-01-02"
text = "ببساطة اللي رايح هناك مفقود..... ان مسلمش من ايد الأمريكان مش هيفلت من ايدين المقاومة اللي هيدبحوة و يشفوة و يبيعوة بالكيلو ..... وانتم عارفين اصلا المقاومة هناك مبيهزروش ... و عندهم استعداد غير عادي لدبح المتعاونين مع الأمريكان..... علي فكرة في اعلانات من دي كتير كانت نازلة علي مواقع التوظيف المصريةو بمرتبات 2000-3000 دولار يا معلم يعني الواحد في سنة يتجوز و يجيب عربية و يفتح مشروع كمان ..... صباح الدلع... بس يابا السكينة حامية و العمر واحد... ده غير اصلا ان الموضوع بكل المقاييس يعتبر خيانة للاسلام و المسلمين و تعاون مع الد اعداء الدين امريكا الله يحرقها .... وعموما البلد دي احسن من غيرها<br />hebo_sherif@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124837/http://www.20at.com/article2.php?sid=183"

