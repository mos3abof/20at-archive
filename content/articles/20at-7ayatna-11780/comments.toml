author = "ابومحسن غربة 27 سنه"
posted = "2009-04-15"
text = "كل سنه وانتم طيبين يا عشرينات وعقبال 100 سنه والحقيقة موقع عشرينات هو الموقع الوحيد الذي ربطني بمصر وبيخفف عليا ايام الغربة الطويلة<br />ونخص في تهنئتنا الاساتذة<br />1) عبدالله الطحاوي<br />2) شريف الدواخلي<br />3) البراء اشرف<br />4) ياسر ابو العلا<br />5) احمد الهواري<br />6) رضوى حسن<br />7) مروى صلاح<br />دعاء الشامي<br />9) دعاء حسن<br />وبقية الاساتذة الذين يكتبون في عشرينات<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2009-04-16"
capture_url = "https://web.archive.org/web/20090416230724/http://www.20at.com:80/7ayatna/11780-2009-04-15-13-23-09.html"

[[comments]]
order = 4
subject = ""
author = "مريم المعتصم بالله"
posted = "2009-04-15"
text = "عشرينات… بدايتي وأجمل أيام حياتي سواء من الناحية المهنية أو الناحية الشخصية<br />بجد أجمل مكان اشتغلت فيه حتى وقتي الحالي وأكتر ناس جدعان عرفتهم في حياتي<br />أحب أهني الموقع بجد على العام الخامس وبأرجوه إن المناسبة دي متعديش كده من غير إحتفال لازم فريق عشرينات كله من القديم إلى الجديد والحالي<br />ويكفيني شرفاً بجد إني حضرت الموقع وشغله من قبل ما يطلع أون لاين وكنا من الفريق الثاني للمؤسسين للموقع… بجد بحب عشرينات أوي وبحس إنه ابني الصغير اللي مهما رحت وجيت وسافرت واتغربت في أماكن تانية… بحن و برجعله تاني<br />بحبك يا عشرينات… بس عايزين يا جماعة بللايم وزينة… والكلمة دي خصيصاً موجهة إلى الأستاذة شيرين مجدي"
archived = "2009-04-16"
capture_url = "https://web.archive.org/web/20090416230724/http://www.20at.com:80/7ayatna/11780-2009-04-15-13-23-09.html"

