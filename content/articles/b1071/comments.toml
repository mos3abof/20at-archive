[[comments]]
order = 4
subject = "غنيلى شوى شوى وهدى يا اسرائيل فى الجامع شوى وفى الكنيسه شوى"
author = "مارك"
text = "ياعم انت .. ياعم انت حرام عليك ..احنا لسه حنغنى ..حرام عليكوا.. شبعنا غنا.. شبعنا تصفيق.. شبعنا هتاف ..شبعنا بالروح بالدم ..عايزين مره جد ...عايزين صرخه واحده من قلب واحد - عايزين كلمه واحده من راجل واحد - عايزين قياده واحده من قائد واحد - عايزين مركب واحد ويكون هدفنا بر واحد- عايزين لحظه واحده تجمعنا انشالله تكون اخر لحظه فى عمرنا..بس نتجمع..بس نضرب بايد واحده..بس نهجم هجمه واحده..<br />مش غنييلى شوى شوى وهدى يااسرائيل فى الجامع شوى والكنيسه شوى .. واضربى فى سوريا شوى - ولبنان وفلسطين شوى ..غنى يا عم .. لما نشوف اخرة الغنى دا ايه..بس على فكره ..مافيش لا ام كلثوم تقول وقف الخلق.. ولا عبد الوهاب يقول الوطن العربى.. ولا عبد الحليم يقول قلنا حنبنى وادى احنا بنينا..ولا فريد يقول المارد العربى...لا والله مافى غير الهشك بشك بتاع اليومين دول .. ويوم ما نتكلم جد حتلاقى.. وحبه فوق وحبه تحت.. مع اعتذارى للمطرب الكبير عدويه .. يعنى بالمختصر المفيد اذا ما وفقناش لعقلنا ..حتى الغنى مش حنعرف نغنيه.<br />مارك"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124518/http://harb.20at.com:80/article.php?sid=11"

[[comments]]
order = 5
subject = "ندر عليه"
author = "مارك"
text = "اسف اذا كان مقالى السابق معجبش حد من اصحاب مبدأ التأليف والتلحين والغناء.. فوالله ندرن علي والندر دين .. اذا محى رؤساؤناالعرب اسرائيل من فوق الخريطه كما سبق ووعدونا مما يقرب من مائة عام(( على قد معرفتى ))..لأقوم بتأليف وتلحين نشيد وطنى يجمع الرؤساء العرب جميعا رئيسا رئيسا وقادة الجيوش قائدا قائدا ..فى ملحمة غنائية يتحاكى بها العالم اجمع وان يكون هذا اللحن اسطورة خالده توازى اسطورة قضائهم على اعداء الأيمان واعداء البشريه..والله صادق فى وعدى.. والله صادق فى عهدى.. والله لو يزيح الغناء اسرائيل لأضع بيدى اول مسمار فى نعشها ..وعلى فكره انا ضحيه من ضحايا اسرائيل..فانا ممن قضوا زهرة شبابهم بالجبهة منذ 67 وحتى 1974 ومستعد وانا فى هذه السن ان اكون اول جندى فى جيش العروبة الجرار الذى سيمتد بوماما من المحيط الى الخليج ليقهر اسرائيل ويعيد الأقصى وكنيسة القيامه..<br />مارك"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124518/http://harb.20at.com:80/article.php?sid=11"

[[comments]]
order = 6
subject = "فلسطين المنسيه والجريحه"
author = "فلسطين المنسيه والجريحه"
posted = "2006-07-20"
text = "فلسطين المنسيه والجريحه<br />لماذا يا عرب نسيتو خمسين سنه من عذاب فلسطين<br />وعندما يصاب لبنان باقل مكروه كلكم تنتفضون على وجه السرعه<br />وفلسطين هي اساس الجرح<br />لماذا تنسوها دائما يا ظالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124854/http://www.20at.com/article2.php?sid=1071"
