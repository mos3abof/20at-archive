text = "لبنان انتي لبنان وستبقي لبنان ونحن معكي قلبا وقالبا انتي المثل التي يحتذى به في حب الارض وكوني دائما هكذا جندي مقد استشهد فقد حرر شبر من شبر الارض الغالية اذا كتبت لن يكفيكي لكن ثقي دائما في النصر الذي سيتحقق اجلا ام اجلا فالله معك يا لبنان الوطن الغالي"
archived = "2006-11-02"
