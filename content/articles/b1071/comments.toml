order = 0
subject = "لبنانية وعربية"
author = "عاشقة تراب لبنان"
posted = "2006-07-13"
text = "لا املك غيرها ... ماذا املك ان اقول سوا سلاما لبنان ...<br />سلاما لبنان ... سلاما من اعماق قلبي ... سلاما ورديا هادئا في ظل تلك الفوضى العارمة ...<br />سلام احترام وتقدير ... سلاما حزب الله ... سلاما يا من وقفت بوجع الاعداء حينما هرب الكثيرون ...<br />سلام تبجيل وتقدير وتعظيم ... سلام محبة واخاء ... سلاما محملا بامنيات النصر ...<br />سلاما محملا بدعاء صادق ... سلاما حزب الله ...<br />سلاما الى الاسرى في سجون الاحتلال ... سلاما يا من دافعتم عن شرفكم وشرفنا ...<br />اقامتكم في سجون ذلك الغاصب هي صفعة قوية الى وجوهـ المتخاذلين ... لكني اظن<br />انهم قد حقنوا بابر مخدرة قوية التاثير ....<br />سلاما فلسطين ... سلاما يا ارض الانبياء ... سلاما يا ارض المقدس .. سلاما يا قبلتنا الاولى ...<br />سلام من قلب باك على حالك ... سلام من قبل يرثي ابناءك ... سلام من قلب حاقد على كرسي<br />فرق شملهم ... سلام محمل بورود بيضاء ... لا ... ساحمل سلامي باسلحة اوتماتيكية ... ساحمله<br />بقنابل ... فاظنكم تحتاجونها اكثر من الورود البيضاء ...<br />سحقا اسرائيل .... اعلم ان كلامي لن يحرك فيك جزءا واحدا .. ولن يفجر احدى مدرعاتك الملعونة ...<br />ولن يكسر اظفر احد جنود الانذال .... لكن سحقا لك ... سحقا لكل من ساهم في بقاءك ...<br />سحقا لابناءك واحد واحد .. فردا فردا ... سحقا لكل من رضي بوجودك ...<br />سحقا اسرائيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124854/http://www.20at.com/article2.php?sid=1071"

