[[comments]]
order = 16
subject = "وصيتي الاخيرة"
author = "نوال معزو"
posted = "2006-02-17"
text = "بسم الله الرحمان الرحيم والصلاة والسلام على اشرف المرسلين سيدنل محمد عليه وعلى اله افضل الصلاة واعطر التسليم اخوتي في الله ان اوصيتي التي اتمنى ان اكتبها هي الى اخوتي في الله الا وهي تقوى الله الى كل من لا يصلي صلوا فان الصلاة تنهى عن الفحشاء والمنكر الى كل المدخنين اتمنى ان يقلعوا عن التدخين الى كل من هو بعيد عن الله ارجعوا الى الله فان الله يريدكم ان تتوبوا اليه الله جل جلاله يدعوا عباده اليه بالاستغفار والانابة والصدق في العبادة انه الله انه ارحم الراحمين انه الودود اللطيف الغفور الشكور الدي لا يضيع عمل عامل من دكر او انثى انه الله اما وصيتي انا الامة الفقيرة الى الله فاتمنى ان القى الله وقد غفر لي ما تقدم من دنبي وما تاخر وان اترك في هده الحياة بصمة طيبة يترحم بها علي كل من دكرني كما اتمنى ان اترك في هده الحياة درية طيبة تحمل هم الاسلام من بعدي وتدكر الله وتكون دات شان عضيم في الدعوة الى الله هده هي وصيتي اللاخيرة اختكم الامة الفقيرة الى الله نوال معزو من المغرب والسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114828/http://www.20at.com/article2.php?sid=409"

