posted = "2006-02-17"
text = "مش عارفه اقول ايه بس انا بجد نفسي اموت في الكعبه وانا بزور بيت ربنا دا امل حياتي اما وصيتي بجد فانا نفسي اني ادفن باتلطريقه الااسلاميه الصح اللي كانت متبعه على ايام الرسول صلى الله عليه وسلم وهي انهم كانو بيحفروا في الارض ويدفنو الميت وبعدين يغطوه تاني بالتراب عشان الناس ما تتزاش من ريحته والخيبه اني مش عارفه احنا جبنا طريقة الدفن المتبعه في مصر دي منين عموما دي فعلا امنيتي اما بالنسبه لاموالي التي تعد وتحصى يا ريت لو كان عندي مليم واحد تتبرعو بيه لاي حد محتاج"
