subject = "تقمص شخصية حاكم عربي"
author = "نجوان"
posted = "2006-02-09"
text = "زمان كانت الخلفاء الراشدين و السلف كلها حكم ومواعظ ووصايا للتابعين بحسن اتباع شرع الله و سنة رسوله .وتقوى الله في الرعية و طلب المغفرةمن الله والسماح من الشعب اذا كانوا قصروا في حقهم (رغم انهم لم يقصروا)<br />طيب يا ترى الزعماء و الحكام العرب<br />..بيكتبوا ايه في وصيتهم ...خصوصا ان وصيتهم بتتعدى حدود الاسرة أو العائلة المالكة ..إلى ان تصل لحدود الدولة (المملوكة)<br />تفتكر الزعيم بيكتب ايه في وصيته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114828/http://www.20at.com/article2.php?sid=409"

[[comments]]
order = 8
subject = "هذا رأيي"
author = "في رأيي ان الحاكم يقضي بأن توزع تركته كالاتي"
posted = "2006-02-10"
text = "الدلتا و هي ثمن التركة للزوجة<br />والصعيد للابن لاكبر و الوجه البحري للاصغر (لزوم الاستثمارات)<br />أما الموازنة العامة للدولة فتوزع شرعا على الولدين<br />ويتم تبادل الحكم بين الشقيقين الأول 25سنة و الثاني 25 حتى يتم تاهيل الاحفاد لتولي الحكم<br />ملحوظة يتم التوسع الافقي و استغلال الصحراء الغربية في اقامة السجون و المعتقلات ووضع الزيادة السكانية في الاعتبار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114828/http://www.20at.com/article2.php?sid=409"

[[comments]]
order = 9
subject = "ما زلت طيرا يغنى الحب فى امل ..قد يمنح الحلم ما لا يمنح الاجل"
author = "نيفين"
posted = "2006-02-12"
text = "الى من يقرأ وصيتى الان<br />اوصى بتقوى الله<br />اوصى بالحب ثم الحب ثم الحب<br />حبو الخير و الجمال و الناس<br />حيانتا اقصر من اننا نقضيها ف كره<br />فلانه جارتى متمشيش ف جنازتى يا ماما<br />لبنى و فاتن ممكن يحضرو غسلى<br />و عالشان خاطرى يا لبنى متزعليش ولو جبتى بنت متسميهاش نيفين علشان ميبقاش حظها وحش ف الدنيا زيى و لو جت بنت سميها فريده و لو ولد سيف<br />و فاتن سامحينى على تقصيرى ف حقك كتير بس انتى عارفه<br />عماتى و اعمامى الاعزاءي يا ريت تبطلو شماته خلاص ادينى سبتلكو الدنيا كلها<br />الى خلاتى و خلانى حبيتكو لاخر لحظه ف عمرى<br />برطمان البن بتاعى يا ماما اعملى منه للناس ف العزا دا محوج بالحبهان و الكيلو بأربعين جنيه<br />خواطرى و يومياتى الخاصه اللى فيها اسماء و احداث تروح للبنى و الاشعار و القصائد ادوها للى يحب يقرأها<br />هدومى وزعوها على اللى محتاج و الفلوس اللى كنت بطلعها لشنط الخير كل شهر طلعوها رحمه و نور عليا<br />عماد اخويا المتشدد خير الامور الوسط<br />اختى انوش يللا افرحى السرير كله ملكك دلوقتى و محدش هيشد منك البيطانيه بليل يللا هيصى<br />اينم ابن خالتى بيلاش سجاير يا معلم<br />بسام ابن عمى افتكرنى و اسمع البوم عمرو الاخير كتير يا سمسم<br />اغلى بشر عاغرفه انك هتحصلنى قريب<br />اما .... خلاص الموت بينهى كل شىء<br />اما ثروتى مفيش لانها كانت جمالى و اهو رايح للتراب و اخلاقى و دى اللى انا عشمانه ان الناس تفتكرنى بيها<br />و الى اى حد زعلته سامحنى او سامحينى<br />انوش ابقى اكتبى بعدى على عشرينات و اسمعى فيروز و اقراى لكامل الشناوى و سعاد الصباح و نزار هتحبيهم<br />الوداع يا دنيا<br />يا اسم على مسمى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114828/http://www.20at.com/article2.php?sid=409"

[[comments]]
order = 10
subject = "الدمعه فرت من عيني"
author = "أكرم"
posted = "2006-02-13"
text = "صعب جدا تعلق على وصية اي انسان بس هبهوب هي اللي شجعتني اعلق و بقولك يا نيفين انك مزوداها حبتين اوي يعني كامل الشناوي لوحده كفاية مش لازم سعاد الصباح و نزار كمان<br />و انصح كل اللي بيحبوا الشعر و بيحبوا ناس راحو مع اللي راحو يقرأوا قصيدة بلقيس لنزار قباني و هو يرثي زوجته التي ماتت في انفجار السفارة السورية ( مش فاكر في عمان و لا بغداد )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114828/http://www.20at.com/article2.php?sid=409"

[[comments]]
order = 11
subject = "هبهوب و اكرم سامحونى"
author = "نيفين"
posted = "2006-02-14"
text = "و الله عارفه انى زودتها بس انا تخيلت انى فعلا بكتب وصيتى<br />معلش انى خليتك تعيطى يا هبهوب انا نفسى عيطت و الله<br />و انا عرفه الدعاء بتاعك دا بقوله كتير لانه اسمه سيد الاستغفار<br />صح يا اكرم كامل الشناوى كفايه طبعا لوحده و بالحق لو عندك حاجه لامل دنقل ابقى ابعته فى اى تعليق هنا على الموقع لانى رغم حبى للراجل ده لسه معنديش حاجات ليه<br />و خدى انتى يا هبهوب النكته دى<br />واحد هندى بيسأل مصرى ليه مش احرق جثه قبل أدفن رد المصرى احنا ادفن بعدين ربنا احرق<br />طبعا دى جثه صاحبنا اللى كان نفسك يلاقو جثته بدل الملكه تى<br />مستنيه نكتتك انتى بقى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114828/http://www.20at.com/article2.php?sid=409"

[[comments]]
order = 12
subject = "الى كل من يحب امل دنقل"
author = "أكرم"
posted = "2006-02-15"
text = "مادام الموضوع دخل في امل دنقل و الحاجات دي و الموضوع بيتكلم عن الموت و الووصية ووحدوه ( لا اله الا الله ) مينفعش غير قصيدة الموت في لوحات لامل دنقل و دي اجزاء منها<br />و على فكرة دي اول قصيدة ااقراها لامل دنقل عشان كده حافظها صم<br />الموت في لوحات ( لامل دنقل )<br />معلقة حقائبي على ارفف الذاكرة<br />و السفر الطويل يبدأ دون ان تسير القاطرة<br />رسائلي للشمس تعود دون ان تمس<br />رسائلي للأرض ترد دون ان تفض<br />يميل ظلي في الغروب دون ان اميل<br />و ها انا في مقعدي القانط<br />وريقة وريقة يسقط عمري من نتيجة الحائط<br />فيسقط في بحيرة الذكرى<br />و يلتوي دوائرا دوائرا<br />( عايزين كمان و لا السلام )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114828/http://www.20at.com/article2.php?sid=409"

[[comments]]
