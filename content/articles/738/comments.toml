order = 0
subject = "عد غنماتك يا جحا"
author = "أكرم"
posted = "2006-02-08"
text = "بجد انا فكرت كتير اكتب وصية بس معرفتش حتا لما جالي انفلونزا حادة ايام اشاعة وباء الحمى الشوكية و افتكرت ان انا خلاص بودع فكرت اكتب وصية بس لايه و لمين ؟؟<br />و على راي رسول المغول في فيلم الناظر : لما احب اكلم شعب مصر اكلم مين ؟؟ اتصل ب 140 دليل اجابة منطقية طحن<br />انا بقا كل رسالتي في الحياة معروفه ( و على فكرة انا رسالتي قصيرة sms يعني ) و كل اصحابي و اهلي عارفينها و هي في حد ذاتها وصية اما عن مقتنياتي العظيمة فهي شوية كتب خرسانة و ستركشر و حبة دواوين و روايات و كتب يعني محدش هيستفيد منها الا بتاع الروبابيكيا و في النهاية احب اقول كل موت و احنا في الجنة ان شاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114828/http://www.20at.com/article2.php?sid=409"

