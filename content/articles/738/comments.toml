text = "و الآن يتحدثون عن الوصية ...فلا شيء يدعو للاستخفاف أو السخرية و خفة لدم .فقد عرفت الآن انه لابد من كتابة الوصية<br />وخاصة في امر من سيشهد غسلي و يتصدق على روحي بعد وفاتي ومن سيعاهدني بالدعاء .<br />انا اوصيت اهلي اني مش عايز حد يصوت و لا يندب ولا عاوز صوان ولا نعي<br />فمفيش داعي ان قراء عشرينات يتكلموا عن ثروتهم المعدومة ..لكن اتكلمواعلى الاقل على الوصية الروحانية .."
