subject = "اكيد عايزين كمان"
author = "نيفين"
posted = "2006-02-16"
text = "بالاصاله عن نفسى وبالنيابه عن كل محبى امل دنقل شكرااااااااااااا يا اكرم<br />و ان جيت للحق بقى يا ريت كل ما يكون عندك وقت تكتب لنا حاجه للراجل الجميل دا اللى مخدش حقه ف الادب العربى المعاصر و لو فيه موقع ليه على النت يا ريت تقولهولنا<br />الف شكر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114828/http://www.20at.com/article2.php?sid=409"

