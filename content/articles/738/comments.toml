author = "اميرة"
posted = "2006-02-26"
text = "رسالة من روح تركت جسدها..........<br />خلاص.. راحت روحى للى خلقها.. يا رب انت عارف انا كان جوايا ايه وكان نفسى اعمل حاجات كتير للبلد والناس لكن العمر مقضاش.. يا ماما انا عايزة اقولك انى بحبك قووى وانت كمان يا بابا غصب عنى بحبك ... احمد اخويا .. الحق نفسك قبل ما تحصلنى ... وافتكر كل ما تصحا وتلاقى نفسك عايش ان ربنا بيديك فرصة جديدة ..<br />عايزة اقول لصحابى كلهم انى كنت بحبكم فى الله وبخاف عليكم من اى ذنب تعملوه وبحس انى مامتكم ... دلوقتى ادعو لى وما تخافوش على انا عند حبيبى الحقيقى .. ربنا اللى بيحبنى اكتر ما انا بحب نفسى ... وانا فرحانة عشان ها اقابله.. لأن رؤية وجهه اجمل من الدنيا وما فيها .."
