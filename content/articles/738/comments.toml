posted = "2006-02-09"
text = "وحدتي..آنست بوحدتي ولزمت بيتي فدام لي الهنا ونما لي السرور.)<br />سعادتي...لا أرى السعادة في جمع مال إنما السعادة في رغيف خبز يابس تأكله ، ومصحف تقراه ، هو العفو والعافية في الدنيا والآخرة.<br />تجربتي...إن في إنصاتك للجهال زيادة في الحلم، وإن في إنصاتك للعلماء زيادة في العلم.<br />ما اجمل الوسطية والاعتدال<br />يا نيال الشهداء."
