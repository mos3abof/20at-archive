text = "قلت الموضوع اتأثرت بيه ..ولقيت ان بعض اللي ردوا بمنتهى الحرية و تعددية الفكرو الديمقراطية ..ردوا على الموضوع بشكل هزلي يعني اتصل ب140 و بعضهم طبعا رد بشكل يناسب الكلام عن الموووووت ,اللي النبي عليه الصلاة والسلام تكلم عنه برهبة ,<br />الموضوع بسيط مش مستاهل ان كل شوية حد يقولي انت زعلان ليه ..ودي حرية رأي ...وكلام كده من اللي بنسمعه في القناة الاولى في نشرة 6!!!<br />ربنا يحسن خاتمتنا جميعا"
