subject = "جديد الموقع"
text = "الأخ إلي فوق:<br />أنا كمان بانصحك تقرا، لأن الفكره مش فكرة هجوم أو دفاع سواء على الفيلم أو على عناصر الفيلم، الفكره هنا هيه النقد، يعني رؤية و وجهة نظر و تحليل من زوايا مختلفه.. و الي لفت نظر أحمد زين هنا غير غلي لفت نظر منى أبوالحسن هناك... إقرا ياسيدي عشان تشوف الفيلم أوضح.<br />الأخ إلي تحتيه:<br />حضرتك لماح أوي.. أنا أعرفك قبل كدا؟ شكلك مش غريب عليه:)"
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903183835/http://www.20at.com:80/article.php?sid=475"

