[[comments]]
order = 4
subject = "هايل"
text = "رأت الناقدة في صحيفة الميدان الاسبوعية حنان شومان ان \"الفيلم تضمن التراث العالمي في فن المطاردات مستفيدا من غالبية الافلام الامريكية التي تضمنت مثل هذه المشاهد وتم تنفيذها بحرفية عالية خصوصاً وانه تسرب ان هناك طاقما فنياً وادوات متطورة لتنفيذ مشاهد المطاردات التي ضمتها الأفلام العربية\".<br />وتابعت \"ولكني لا ارى مبررا لكل هذا العنف الذي عرضه الفيلم خصوصاً في مجتمعاتنا العربية التي لم تغرق في هذا النوع من الحياة الاجرامية فهذا العنف غير مناسب تصويره ولا منطق فيه وهذا لا يعني مجتمعات لا تعاني من الجريمة\".<br />وتجد هذه الملاحظات صدى لها في الخطوط الدرامية في الفيلم منذ المشهد الأول فيه عندما يقوم ثلاثة من اطفال الشوارع بخطف حقيبة سيدة يعتقل احدهم فيقوم اكبرهم بطعن الضابط لمساعدة رفيقه على الافلات الا ان شرطيا يعتقله هو وخلال وجوده في السجن يقتل زميلا له حاول الاعتداء عليه وعندما يخرج بعد 16عاماً من السجن شابا يؤدي دوره الفنان احمد السقا.<br />ويدخل فور خروجه من السجن في تناقض يطور الخط الدرامي في الفيلم فهو يتعرف الى احد اطفال الشوارع ويسعى لا نقاذه من المصير الذي ينتظره ويرى فيه حياته وفي نفس الوقت ينضم الى عصابة تعمل لصالح احد كبار ضباط الشرطة الفاسدين كما يتبين خلال احداث الفيلم حيث تقوم هذه العصابة بقتل المجرمين الذين يتعقبهم الضابط ويستولون على الاموال التي في حوزتهم ويقدمونها للضابط الذي يعمل على حمايتهم وتوفير الاهداف لهم فيستولي على غالبية النقود ويعطيهم الفتات.<br />وخلال ذلك يقتل وزملاءه عددا كبيرا من الناس ليتوقف ذلك بعد ان يكون الضابط وفر الاموال التي يحتاجها لبناء قرية سياحية في سيناء مع عدد من كبار الشخصيات في المجتمع ويؤدي تعرف السقا على شاب ثري وطيب \"عمرو واكد\" الى تغيير حياته خصوصاً بعد ان تعرف على صديقة الشاب \"حنان ترك\" وارتبط معها بعلاقة عاطفية الا ان انكشاف امر الضابط امام ضابط من جهاز اخر يغير مجريات الاحداث حيث يطلب الضابط من السقا ان يقوم بتصفية الضابط الشريف ولكن السقا بعد ان نجح في الوصول الى الضابط لم يطاوعه ضميره في تصفيته.<br />فينتقم الضابط من السقا بفضح امره امام الفتاة التي يحبها ويتهمه بانه يقف وراء الجرائم التي وقعت ويدبر امر قتله على ايدي قوات الامن وهذا ماحدث الا ان الضابط يعتقل بسبب الملف الذي تركه السقا واسم الضابط الفاسد لينتهي الفيلم وحنان ترك تقوم باحتضان الطفل الذي تبناه السقا وترك ثروته باسمها كي تقوم بتربية الطفل بطريقة تنقذه من مصير تحوله الى مجرم."
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903183835/http://www.20at.com:80/article.php?sid=475"

