[[comments]]
order = 10
subject = "جديد الموقع"
text = "يا أخ \"أحم\"، مش لازم عشان المقال بيكون بيهاجم الفيلم (ولو اني مش شايفه انه بيهاجمه) او إنه بيناقش عيوبه، تبقى كل التعليقات مؤيده لرأي الكاتب.. لإن الحكايه في الآخر و زي ما قلت هي مجرد آراء و إنطباعات شافها الكاتب ده ممكن غيره يوافقه أو يختلف معاه.. الحكايه نسبية لأن كل واحد و له حلفيته الثقافيه و الإجتماعية و الفكرية الخاصة بيه.. يعني أنا مثلا مش موافقة الكاتب على جزئية \"تلميع الطبقة الغنية\" لأن أنا أعرف ناس من الطبقة دي و رغم الغنى الفاحش و الحياة الناجحة، إلا أنهم ملتزمين و محترمين.. أنا ضد التعميم في أي شيء.. لكن أنا موافقه الكاتب على جزئية \"شكل المباحث و أمن الدولة\"، و طارق العريان هنا هوه و السينارست \"لمعوا\" الصورة القبيحة لأجهزة الأمن بشكل مستفز أحيانا... لكن رغم كل ده، انا معجبه جدا بالفيلم و بأداء أحمد السقا إلي محدش أبدا يقدر ينكره..."
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903183835/http://www.20at.com:80/article.php?sid=475"

