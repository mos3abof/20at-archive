[[comments]]
order = 24
subject = "برافو عشرينات"
text = "الأخوة الكرام انا حابب أتدخل في النقاش لو سمحتم<br />أولا يا أخ فلسطيني انت بتقول ان المحرر متحيز .. يا عمنا متحيز إزاي وهو رأيه انها استشهادية ورغم كة فهو ينشرها احترامأ للرأي الآخر وحرية التعبير.. حرام عليك يا فلسطيني خليك منص<br />ثانيا : بالنسبة لموضوع إسلام اون لاين والفتاوى اللي منه مش عايزين نبقى منحازين وغير موضوعيين لا شك إن إسلام أون لاين مرجعية يا جماعة مش للدكتور القرضاوي لكن فعلا لمدرسة فقهية راسخة اسمها الوسطية وفيها تنوعات مختلفة وكبيرة مش عايزين بقى نلبخ ونقول مشيخة قطر والكلام الفاضي ويا ما دزل صغيرة بمساحتها وتاريخها وسكانها وعملت حاجت كبيرة عن دول تانية عاملة زي الطويل والأهبل<br />ثالثا الأخوة الحنجوريين اللي طلعوا من الموضوع بشوية أشعار بايتة وحمضانة<br />ياجماعة الشعر لا بيودي ولا بيجيب تعالوا نعمل التمربينة بتاعت عشرينات دي على التفكير الحر والإبداعي اللي بتفكرني بالتقسيمات الحلوة بتاعت الكورة اللي بتكطون في فريق واحد<br />والسلام ختام"
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903183835/http://www.20at.com:80/article.php?sid=475"
