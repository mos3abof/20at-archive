[[comments]]
order = 13
subject = "إلى جديد الموقع"
text = "أختي الكريمة ... كلامك كأنه بيأكد على كلام الناقد ... كلامك بيقول: \"<br />يعني أنا مثلا مش موافقة الكاتب على جزئية \"تلميع الطبقة الغنية\" لأن أنا أعرف ناس من الطبقة دي و رغم الغنى الفاحش و الحياة الناجحة، إلا أنهم ملتزمين و محترمين.. أنا ضد التعميم في أي شيء\"<br />انتي بتقولي انك تعرفي ناس لكن هل دي هي القاعدة ولا الاستثناء .. عامة في الفترة الأخيرة لما التدين بدأ يغطي مساحة أوسع من هذه الطبقة أكيد كتير من ظروفها اتغيرت لكن أرجع وأقول أن برده كتير قوي من الطبقة دي سلوكياتها بعيدة شويتين<br />وأنا موافقك تماما على رفض التعميم طبعا .. الفكرة اللي بيقصدها الناقد أن الورنيش كان زيادة حبتين"
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903183835/http://www.20at.com:80/article.php?sid=475"

[[comments]]
order = 14
subject = "جديد الموقع"
text = "أنا فاهمه الكلام ده، لكن الفيلم بيعرض قصه لها ظروف معينه.. كلام الناقد يوحي بان غلي حصل في الفيلم غير واقعي، و الناس ظغلي أنا باتكلم عنهم مش لسه جداد على الطبقة دي ولا هما جداد على السلوكيات دي برضه، و أنا أعتقد ان نوعية الناس دي هي الأصل، و ان معظم السلوكيات الفاسده كانت من محدثي النعمة إلي ظهروا فجأه في فترة معينة من تاريخ البلد دي... لكن طبعا لا يجوز التعميم.. إلي أنا كنت باقوله هو نفسه إلي أحمد السقا و طارق العريان قالوه في أحد اللقاءات، هو إن أصل فكرة الفيلم هو حالة واقعية لطفل نشأ في الظروف دي، و همه تخيلوا له مصير من اتنين، يا الإنحراف بلارجعة و بالتالي السجن (و ده حال معظم الأطفال دول) أو انه يقابل إلي يخليه يغير حياته(و دي هي الحالة الخاصة و الأقل حدوثا) و ده إلي بيقوله الفيلم.. و في الحاله دي يبقى الفيلم (طبيعي) بيعالج حاله و ظروف خاصة، لكنها في الآخر واقعية ممكنة الحدوث!<br />كانت حتبقى ايه فكرة الفيلم لو انه قابل واحد من محدثي النعمة أو الأغنياء بسبب الإنحراف بدل ما يقابل فارس \"ابن الناس\"؟؟ ولا حاجه!<br />فاهم قصدي؟"
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903183835/http://www.20at.com:80/article.php?sid=475"

[[comments]]
order = 15
subject = "الحلف الإليكتروني الفظيع جدا(بيرو)"
text = "السلام عليكم والرحمة<br />الاخ فلسطيني ....أكرمه الله<br />السادة المعلقين الأفاضل<br />يعلن الحلف عن إنسحابه من دائرة النقاش الحاد بينه وبين الاستاذ فلسطيني وذلك لتطرقه لثوابت عقائدية يرفض الحلف طرحها للنقاش علي الاقل بهذه الطريقة المجحفة لعلماء الإسلام وعقيدته ....<br />وهذا ويأمل الحلف ان يلقي الأخ فلسطيني في حوارات أخري إن شاء الله ...<br />والله من وراء المقصد وشكرا...<br />بالنسبة لموضوع البيان التأسيسي للحلف فإليكم الآتي ::::::<br />رفضت لجنة الأحزاب الإليكترونية الطلب المقدم من الحزب الإليكتروني الفظيع بإنشاء حزب مستقل معارض ...<br />وتعلن اللجنة التأسيسية للحزب انها ستعارض وتناضل من أجل البقاء وعن عزمها شن حملة جمع توقيعات للوقوف أمام الديكتاتورية الإليكترونية الفظيعة..<br />مع تحيات الهيئة التأسيسية للحزب....<br />بيرو...مطر ...مصعب الخير"
archived = "2004-09-03"
capture_url = "https://web.archive.org/web/20040903183835/http://www.20at.com:80/article.php?sid=475"

