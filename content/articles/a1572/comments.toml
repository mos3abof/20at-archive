[[comments]]
order = 0
subject = "ليش الغيرة من الاردن دوماً"
author = "السلام عليكم و رحمة الله وبركاته"
text = "التقدم دوماً من سمات الاردن المجاور نحن هنا في السعودية و في بلاد الخليج<br />نادر ما تجد من يتقن الانجليزية بطلاقه و كما عُـرفت عمان / الاردن دوماص بأنها<br />عاصمة الثقافة العربية و حتى مدارسهم متطورة للغاية و مناهجهم صعبة حتى خريجو الجامعات<br />الاردنية دوماً تجد لهم اولوية عندنا لننا نعلم مستوى الثقافه التي يحملونها مما يعني انهم شعب ذكي<br />الاردن بلد قوية بالثقافة ولا تقارن بالبلدان الاخرى<br />ولا نتمنى للبلد الشقيق الا كل خير و وتقدم و ازدهار<br />عُــرفت الاردن بفصاحتها و بلاغتها و دراستها القوية<br />وبلد الشرف و الاصور بارك الله بها و بسكانها المسالمين الاطايب<br />اشهد لكم بكل الخير لإني لم ار بتلك البلد الا كل خير<br />الله يحفظهم و يحفظ بلادنا العربية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102154958/http://www.20at.com/article.php?sid=1572"

[[comments]]
order = 1
subject = "الأردن المسلم أردن العرب"
author = "شكر صاحب التحقيق المتميز طارق ديلواني"
text = "و أشكر من دافع عن الأردن المسلم أردن العرب الفصحاء و كل العرب على الراس والعين ..<br />علي أبوالهيجا"
archived = "2006-11-02"
