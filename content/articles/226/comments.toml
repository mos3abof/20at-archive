[[comments]]
order = 0
subject = "بيرو"
text = "والله علي الكلام ده يبقي المفروض يدوا المشاهد جنية علي كل كليب يتفرج عليه ...<br />والله ىيا جماعة احنا بغبائنا بنأكل الناس دي عيش علي حسابنا وفي الآخر نيجي نقول لازم نحارب العري والإبتذال ...<br />احنا اللي بنتفرج واحنا واللي بنشجع واحنا واللي بنكون في الآخر المتضرر الوحيد وزي ما المثل بيقول ...<br />علي المتضرر اللجوء للقضاء<br />بينا علي حقوق الإنسان"
archived = "2004-09-13"
capture_url = "https://web.archive.org/web/20040913125912/http://www.20at.com:80/article.php?sid=605"

