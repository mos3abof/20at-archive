subject = "اهلا بيكم في المغرب"
author = "مغربية-دار البيضاء-"
posted = "2006-03-19"
text = "المغرب بلد التباين العجيب تنبثق في وسط صحاريها الواحات ويلتقي البحر بالسحاب في الأفق وهي تزخر بجوامعها العظيمة ومناطق القصبة (الضواحي) واسوا قها البديعة وآثارها القديمة وشواطئها الرملية العريضة وفي عالمها الداخلي الأسواق التي تعج بالحركة الدائبة حيث تباع المشغولات الحرفية اليدوية المدن المزدحمة تناطح السحاب ومراكز المدن الصغيرة القديمة يرجع تاريخها لآلاف السنين يحدها من الشمال البحر المتوسط ومن الجنوب رمال الصحراء انها بلد الأريج والأحاسيس وطيبات الحياة<br />اهلا ومرحبا بكم في المغرب الكريم عند زيا رتكم لبلدنا لا تنسو تذوق اطباق شهية ولذيذة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114443/http://www.20at.com/article2.php?sid=531"

