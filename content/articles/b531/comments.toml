author = "maryem"
posted = "2006-07-17"
text = "تعتبر (صومعة حسان) من المآثر التاريخية المغربية الشهيرة بالرباط التي يفد اليها الالاف من السياح الاجانب والزوار المغاربة لما تمثله من رمز معماري واسلامي اصيل وقيمة حضارية وتراثية في ضفة المحيط الاطلسي.<br />وتعد صومعة حسان من المنارات التاريخية الشهيرة في العالم الاسلامي والعربي، وقد تحولت إلى مركز سياحي لما تتمتع به من خصوصية روحية وتاريخية وحضارية مهمة.<br />وتعتبر الصومعة واحدة من المنارات التاريخية الاسلامية القديمة التي تعكس ازدهار دولة الموحدين وامجادها في عهد السلطان المغربي يعقوب المنصور الذهبي عندما كانت امبراطوريته تمتد اراضيها من تونس الى اسبانيا في القرن ال12.<br />واشرف السلطان المغربي على بناء الصومعة المطلة على المحيط الاطلسي ومصب نهر ابي رقراق كما رغب ببناء اكبر مسجد في العالم الاسلامي الا ان اشغال البناء فيه توقفت بعد وفاته سنة 1199.<br />وتشهد الاثار المتبقية الى عصرنا الحالي على ضخامة مشروع المسجد الذي يبلغ طوله 180 مترا وعرضه 140 مترا.<br />وتهدم نصف المنارة التي زينت اطرافها بزخارف اسلامية جميلة توحي برونق الفن المعماري القدم وجمال الابداع الاندلسي الرفيع.<br />وبنيت الصومعة بحجر متين يقاوم رطوبة البحر ويبلغ ارتفاعها حوالي 44 مترا وتحتوي على ادراج كثيرة توصل الى الاعلى كما تنتصب العشرات من الاعمدة الرخامية المنحوتة بشكل دائري في الساحة المحاذية للصومعة.<br />وفي الجهة الامامية للصومعة يوجد مسجد كبير تقام فيه الصلوات ويعد من المساجد الاصيلة في العالم الاسلامي اذ بني على الطريقة التقليدية كما زينت جدرانه وابوابه بالجحر المنحوت والرخام والنحاس وهو ما يجعله رمزا من الرموز الروحية والاسلامية.<br />ويوجد بالقرب من المسجد ضريح العاهل المغربي الراحل الملك محمد الخامس ويرقد الى جواره جثمان الملك الحسن الثاني وشقيقه الامير مولاي عبدالله والضريح مصمم بشكل يعكس الهندسة المعمارية المغربية الاصيلة والزخرفة الاسلامية.<br />وللضريح اربعة ابواب يقف امامه حارس بزي مغربي اما في الداخل فمزين بالفسيفساء والزخرفات الاسلامية.<br />ولصومعة حسان مدخلان رئيسيان عند كل مدخل يقف فارسان مغربيان ممتطيان جوادين اصيلين بلباس مغربي تقليدي كما تحيط بالفضاء التاريخي القديم اسوار طينية قديمة.<br />وتوجد في صومعة حسان العديد من النوافير مزينة باشكال هندسية اسلامية تعكس صورة حية للفنون الاسلامية الراقية.<br />وتحتوي صومعة حسان على حديقة تحوي العديد من الاشجار والزهور والنوافير التي صممت حسب الطابع التقليدي وتشرف على مصب نهر ابي رقراق.<br />ويستمتع السياح الذين يزورون الحديقة بمناظر طبيعية ومشاهدة حي (الاوداية) الذي يعتبر من اقدم الاحياء في العاصمة الرباط وفضاء مدينة سلا القديمة وشاطىء الرباط وسلا وجسر (مولاي الحسن) الذي يفصل مدينة الرباط.<br />وتزين الحديقة مصابيح تقليدية قديمة وتمنح الى جانب مصابيح ساحة الصومعة والضريح والاضاءة القوية الموجهة الى الصومعة في الليل توحي بسحر التراث.<br />يذكر ان اهالي مدينة الرباط وسلا اعتادوا زيارة صومعة حسان والضريح اثناء اقامة حفلات الاعراس عند الفجر وفي الساعات الاولى من الصباح لالتقاط صور تذكارية.<br />تعتبر (صومعة حسان) من المآثر التاريخية المغربية الشهيرة بالرباط التي يفد اليها الالاف من السياح الاجانب والزوار المغاربة لما تمثله من رمز معماري واسلامي اصيل وقيمة حضارية وتراثية في ضفة المحيط الاطلسي.<br />وتعد صومعة حسان من المنارات التاريخية الشهيرة في العالم الاسلامي والعربي، وقد تحولت إلى مركز سياحي لما تتمتع به من خصوصية روحية وتاريخية وحضارية مهمة.<br />وتعتبر الصومعة واحدة من المنارات التاريخية الاسلامية القديمة التي تعكس ازدهار دولة الموحدين وامجادها في عهد السلطان المغربي يعقوب المنصور الذهبي عندما كانت امبراطوريته تمتد اراضيها من تونس الى اسبانيا في القرن ال12.<br />واشرف السلطان المغربي على بناء الصومعة المطلة على المحيط الاطلسي ومصب نهر ابي رقراق كما رغب ببناء اكبر مسجد في العالم الاسلامي الا ان اشغال البناء فيه توقفت بعد وفاته سنة 1199.<br />وتشهد الاثار المتبقية الى عصرنا الحالي على ضخامة مشروع المسجد الذي يبلغ طوله 180 مترا وعرضه 140 مترا.<br />وتهدم نصف المنارة التي زينت اطرافها بزخارف اسلامية جميلة توحي برونق الفن المعماري القدم وجمال الابداع الاندلسي الرفيع.<br />وبنيت الصومعة بحجر متين يقاوم رطوبة البحر ويبلغ ارتفاعها حوالي 44 مترا وتحتوي على ادراج كثيرة توصل الى الاعلى كما تنتصب العشرات من الاعمدة الرخامية المنحوتة بشكل دائري في الساحة المحاذية للصومعة.<br />وفي الجهة الامامية للصومعة يوجد مسجد كبير تقام فيه الصلوات ويعد من المساجد الاصيلة في العالم الاسلامي اذ بني على الطريقة ال