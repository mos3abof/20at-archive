[[comments]]
order = 13
subject = "صومعة حسان"
author = "مهدي"
posted = "2006-04-25"
text = "06/03/2006<br />(صومعة حسان).. حلم لم يكتمل!<br />مريم المعتصم بالله – القاهرة + حسن رباح - المغرب<br />تقف الآثار العديدة التي تعود إلى حقبة ما قبل التاريخ شاهدة على أن المغرب كان آهلا بالسكان منذ عصور خلت، وتنهض صومعة حسان شامخة لتكون دليلاً على شاكلة الحلم الذي حلم به السلطان يعقوب المنصور.. حلم عظيم، ولكنه لم يكتمل.<br />فصومعة حسان، بناء جميل لمسجد كان يتوقع أن يكون الأكبر في العالم الإسلامي، بعد أن أشرف عليه يعقوب المنصور الموحدي، إلا أن البناء فيه توقف بعد وفاته سنة 1199م، ثم تقوض معظم ما بقي منه بعد زلزال سنة 1755م، ولكن الآثار المتبقية تشهد على ضخامة مشروع المسجد الذي يبلغ طوله 180 متراً وعرضه 140 متراً.. أما المنارة التي تسمى (صومعة حسان)؛ فتشهد لعصرها ولبانيها.<br />الصومعة، يبلغ ارتفاعها 44 متراً، ولها مطلع داخلي ملتو يؤدي إلى أعلاها ويمر على ست غرف تشكل طبقات، وقد زينت واجهاتها الأربع بزخارف ونقوش مختلفة على الحجر المنحوت على النمط الأندلسي المغربي.<br />وفي الداخل توجد قاعة مبنية بمعمار رائع على الطريقة الإسلامية التقليدية المغربية، وفي مركز القاعة يوجد قبر محمد الخامس، والقبر مبني من حجر \"الغرانيت\" المصقول كالمرآة، والمغطى بالعقيق اليماني الأبيض، وإلى جواره يرقد جثمان كل من الملك الحسن الثاني، وأخيه الأمير عبد الله.<br />* شاهد في هذا الملف المصور، حلم صومعة حسان الذي لم يكتمل!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114443/http://www.20at.com/article2.php?sid=531"

