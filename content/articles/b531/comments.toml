[[comments]]
order = 7
subject = "اعترض"
author = "عاتقة"
posted = "2006-03-28"
text = "يعتبر جامع حسان من مآثر الموحدين الخالدة التي حققت وحدة الفن الشرقي والفن الأندلسي المغربي، فهو رمز لفخامة الدولة الموحدية ومشاعرها في السمو والعظمة وذوقها في التناسق الجامع بين الفخامة والبساطة .<br />ويقع جامع حسان شمالي شرقي مدينة الرباط على ارتفاع حوالي 30 مترًا فوق سطح البحر، وقد شيده الأمير الموحدي يعقوب المنصور عام592 هـ / 1184م ، وهو الذي شهد عصره ذروة السلطة الموحدية ، ولم يتم بناؤه كليًا سوى منارته التي تعتبر أقرب عهدًا من منارة الكتبية في مراكش، ومنارة جامع اشبيلية المعروف بالخيرلدة وهي كمنارة جامع دمشق , يبلغ عرضها ربع طولها حسب التقليد المعماري 64 مترًا، وهو ما يجعل من منارة حسان أعظم منارة في الغرب الإسلامي .<br />أما الجامع فإنه مربع المساحة تقريبًا هندسي التقسيم لتساوي سواريه الفاصلة بين صحونه الواسعة ,ومحرابه المربع الشكل، على خلاف المحاريب المغربية ،وهو منحرف بعض الشئ عن القبلة مثل جامع القرويين . ويتألف المسجد في قسمه الشمالي من واحد وعشرين بلاطا وسبعة أساكيب، يليه قسم آخر جنوبا يتوسطه أحد عشر بلاطا ، يعترضها أحد عشر أسكوبا ،ويحف به من كل جانب شرقًا وغربًا صحن مستطيل تليه بلاطتان أخريان بطول البلاطات المتجهة من الصومعة إلى القبلة , وسقوفها أكثر ارتفاعًا عن بقية الأسقف.<br />وصومعة مسجد حسان حلقة في سلسلة صوامع المنصور بالكتبية والقصبة واشبيلية ، غير أن مهندسها استعمل الحجر المنجور ، وقد ضاع بفعل الزمن جزؤها العلوي أو أنها لم تتم أصلا ، ولا زالت زخرفتها المعمارية المتنوعة على أوجه الصومعة بعقودها وتوريقاتها تعكس فخامة الفن الموحدي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114443/http://www.20at.com/article2.php?sid=531"

