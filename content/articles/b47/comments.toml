subject = "شد حيلك"
author = "مجنونتسامي يوسف"
posted = "2006-08-31"
text = "شدحلك وابغ اشوف شهتك انا بكون فرحانه لك<br />اناكبيره وتخرجت من الجامعه وفرحت امي ويوي في شهتي وانا عمري 25 سنه<br />توعدني انشالله<br />معه اسلمه<br />وشكرن من مجنونة سامي يوسف"
archived = "2006-11-02"
