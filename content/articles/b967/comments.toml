subject = "فكرتنا"
author = "ياء"
posted = "2006-06-20"
text = "الفلم كان جامد كويس انك فكرتنا بيه<br />وافكركم باهميه موقع الصومال لانها تتحكم فى مدخل البحر الاحمر وطبعا انتم فاهمين اهميه البحر الاحمر يعنى بترول السعوديه وقناه السويس وخليج العقبه مكان الصومال ممتاز جدا جدا<br />http://yehia2784.blogspot.com/<br />yehia2784@hotmail.com"
