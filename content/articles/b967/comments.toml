[[comments]]
order = 1
subject = "تحسين صورة الأمريكان قبل نهاية الفيلم"
author = "علي الشهراني"
posted = "2006-07-30"
text = "أولا أن هدا الفيلم الأمريكي تتعرض للهجوم من قبل المدافعين عن أرضهم وشرفهم وأن الجنود الأمريكيين قاموا بإعتقال الصوماليين جزء من الحـقيقة ، وموت الجنود الأمريكيين سيكرر في العراق وأفغانستان لقد قاموا بعمل بطولي لنصرة دينهم ووطنهم بالقوة وأما أخر الفيلم مجرد للتحسين صورتهم المشوهة ، وهده الفيلم هي دعوة للأمريكيين الغزو الشيطاني على أفغانستان ثم العراق كما فعل أبوه ــ بوش الأب ــ لغزو الصومال بإسم عودة الأمل أو إعادة الأمل ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102130533/http://www.20at.com/article2.php?sid=967"
