author = "تحرش الحكومة بالشعب"
posted = "2010-02-18"
text = "طيب وتحرش الحكومة بالشعب كل يوم دة مش جريمة<br />لما تبقى ماشى فى حالك وتلاقى الاسعار فى السكر مثلا زادت 50 % بدون سبب ولا زيادة فى الاجور - مش دة برضة تحرش وتكدير صفو الناس وتهديد السلم الاجتماعى وتقليل وقريفة مزاج الشعب<br />والا التحرش زى ما كتبت لوحة اعلانات احدى الكليات بفصل طالب لمدة اسبوع والسبب تعرضة لانثى فى الطريق العام<br />وقعدنا نضحك على الجملة اسبوع<br />التعرض لانثى فى الطريق العام<br />وكان حمار شاف حمارة انثى فتعرض لها ولعب ذيلة ونهق وبرطع وجرى حولها<br />اة يا مصر<br />كم فيكى من القوانين على الورق ولكن لا تفعل الا بالمزاج"
archived = "2010-02-20"
capture_url = "https://web.archive.org/web/20100220035426/http://www.20at.com:80/masr/news/15390-2010-02-18-13-55-20.html"

