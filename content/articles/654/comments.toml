subject = "القصاص"
author = "التاريخ : 9/1/1427 هــ"
posted = "2006-02-08"
text = "الموافق : 8/2/2006 م<br />العـدد : 1697<br />حـوادث وجرائم<br />محاولات (العفو) استمرت حتى يوم أمس ولم يكتب لها النجاح<br />تنفيذ القصاص بقاتل الجابري<br />خالد الجابري-واس (المدينة المنورة)<br />تم أمس (الثلاثا) تنفيذ القصاص بالجاني غازي بن رويضي بن صالح الجابري بالمدينة المنورة لاقدامه على قتل عبيد بن عتيق الله بن عبيد الجابري (سعودي الجنسية) وذلك باطلاق النار عليه من بندقية اصابته وادت الى وفاته اثر خلاف حصل بينهما.<br />واوضحت وزارة الداخلية في بيان لها امس ان سلطات الامن تمكنت من القبض على الجاني المذكور واسفر التحقيق معه عن توجيه الاتهام اليه بارتكاب جريمته وباحالته الى المحكمة الشرعية العامة صدر بحقه صك شرعي يقضي بثبوت ما نسب اليه شرعاً والحكم عليه بالقتل قصاصاً وصدق الحكم من محكمة التمييز ومن مجلس القضاء الاعلى بهيئته الدائمة وصدر امر سام يقضي بانفاذ ما تقرر شرعاً بحق الجاني المذكور.<br />يذكر ان الجاني شقيق زوجة المجني عليه وكان الاخير يعمل مؤذنا في احد مساجد منطقة وادي الفرع والتي تبعد عن المدينة المنورة 180 كيلا حينما اطلق عليه الجاني النار قبل 3 سنوات وارداه قتيلا ثم لاذ بالفرار حيث فوجئ المصلون بالقتيل غارقا في دمائه ومن ثم قاموا بابلاغ مركز شرطة الفرع الذي ابلغ بدوره شرطة المدينة المنورة وجرت تحقيقات واسعة اسفرت عن وجود خلاف بين الجاني والمجني عليه.<br />عقب صدور الحكم الشرعي جرت محاولات حثيثة من اهل الخير لرأب الصدع بين الخصوم لحث اهل الدم على التنازل لوجه الله تعالى إلا ان ابناء القتيل رفضوا ذلك رغم ان المحاولات ظلت تتواصل حتى يوم أمس قبيل تنفيذ القصاص.<br />جميع الحقوق محفوظة لمؤسسة عكاظ للصحافة والنشر"
