subject = "أمر غير محمود"
author = "يقول تعالى في كتابه الكريم: {يَا أَيُّهَا الَّذِينَ آمَنُوا كُتِبَ عَلَيْكُمُ الْقِصَاصُ فِي الْقَتْلَى الْحُرُّ بِالْحُرِّ وَالْعَبْدُ بِالْعَبْدِ وَالأُنْثَى بِالأُنْثَى فَمَنْ عُفِيَ لَهُ مِنْ أَخِيهِ شَيْءٌ فَاتِّبَاعٌ بِالْمَعْرُوفِ وَأَدَاءٌ إِلَيْهِ بِإِحْسَانٍ ذَلِكَ تَخْفِيفٌ مِّن رَّبِّكُمْ وَرَحْمَةٌ فَمَنِ اعْتَدَى بَعْدَ ذَلِكَ فَلَهُ عَذَابٌ أَلِيمٌ} (البقرة:178)"
posted = "2006-02-06"
text = "ويقول صلى الله عليه وسلم: «مَن قُتِل لَهُ قَتِيلٌ فَهُو بِخَيْرِ النَّظَرَيْنِ؛ إمَّا أنْ يُفْتَدَى، وإمَّا أنْ يُقِيدَ».<br />أي أن ذوي الدم لهم الحق في الخيار بين بين القصاص أو طلب الدية أو العفو.. ولكني أوافقكم الرأي في ان المبالغة في طلب ديات بالملايين أمر غير محمود"
