subject = "مزادات الدم"
author = "بعد أن حكم بالقصاص في مقتل المهاشير قبل 12 عاماً"
posted = "2006-02-06"
text = "أهالي القطيف يجمعون (6 ملايين ريال) لإنقاذ رقبة الجامع<br />القطيف - محمد الشيخ:<br />ينتظر أهالي محافظة القطيف إطلاق سراح الشاب صادق علي عبدالله الجامع «30 سنة» المحكوم بالقصاص في قضية قتل خالد حمد المهاشير قبل 12 عاماً وبالتحديد في العام 1993م إثر نزاع شخصي بينهما حيث تجري حالياً الترتيبات النهائية لتوقيع صك التنازل من قبل ذوي القتيل بعد إكمال مبلغ الدية المطلوبة.<br />وجاء إكمال قيمة الدية المحددة بخمسة ملايين ريال بعد حملة أهلية نظمتها جمعية القطيف الخيرية منذ يونيو الماضي استطاعت خلالها جمع المبلغ من خلال علاقتها بالجمعيات الخيرية في المحافظة وكذلك من خلال حملة تبرعات شملت شخصيات من رجال أعمال المحافظة وفاعلي خير وسكان محافظة القطيف الذين تجاوبوا بشكل فاعل مع الحملة التي ساهم فيها أيضاً عدد كبير من أهالي محافظة الأحساء.<br />من جهته أثنى عباس الشماسي رئيس جمعية القطيف الخيرية بتجاوب أهالي محافظتي القطيف والأحساء مع الحملة مشيراً إلى أن ذلك يؤكد حقيقة التكافل الاجتماعي الذي يتمتع به أبناء هذا الوطن مقدماً شكره للجمعيات الخيرية في محافظة القطيف على تفاعلها ومساهماتها الجليلة.<br />ونوه الشماسي بدور محافظ القطيف المكلف خالد الصفيان الذي لعب دوراً إيجابياً في جهود التسوية إلى جانب الجهود التي بذلها الشيخ حسن الصفار والراحل الحاج عبدالله المطرود للتوفيق بين عائلتي الجاني والمجني عليه قبل أشهر.<br />الجدير بالذكر ان قضية الجامع تعود إلى العام 1993م حيث كان عمره يومها 17 عاماً حين تسبب في مقتل خالد المهاشير (55 سنة) من سكان بلدة النابية «محافظة القطيف» إثر نزاع شخصي نشب بين الاثنين حيث حكم عليه بالقصاص في العام 1997م وظل طوال تلك الفترة رهن الحبس في سجن القطيف المركزي.<br />بقي من الدين مليون وتسعمائة ألف ريال<br />محمد لا يزال ينتظر مساعدة أهل الخير لإنقاذه من حد السيف<br />جازان - أنور خواجي:<br />متابعة لما نشرته الرياض في العدد 13483 الصادر يوم الثلاثاء 16 ربيع الآخر 1426ه تحت عنوان (مليونا ريال تُنقذ محمد من حد القصاص) فقد تلقى فضيلة الشيخ موسى بن علي خمج خطيب جامع سمو الأميرة صيته بنت عبدالعزيز بجازان تبرعات من أهل الخير بلغت مائة ألف ريال فقط لا غير وقد قام الشيخ موسى بزيارة إلى مكتب «الرياض» بجازان مساهمة منه في دعوة أهل الخير والميسورين بالتبرع من صدقاتهم وزكواتهم لعتق رقبة الشاب محمد بن حمد رياني (22) عاماً الذي أقدم على قتل أحد الوافدين في مدينة جدة قبل أكثر من عام إثر مضاربة حدثت بينهما ولم يكن الشاب يريد قتل الوافد ولكنه كان يدافع عن نفسه فأصابه في مقتل، ويضيف فضيلة الشيخ موسى خمج لقد تم التوسط لدى أسرة القتيل حتى تم تخفيض مبلغ الدية إلى مليوني ريال ونظراً لأن أسرة الشاب محمد الرياني أسرة فقيرة ومعدمة ووالداه مسنان وكبيران في السن وليس لهما عائل بعد الله جل وعلا سواه فإنني أهيب عبر «الرياض» الغراء بالميسورين وأصحاب الأيادي البيضاء وهم كثير في بلادنا ولله الحمد المساهمة والمساعدة في عتق رقبة هذا الشاب من حد السيف حيث لم يبق من المبلغ سوى مليون وتسعمائة ألف ريال وقد انتهت المهلة المقررة وأصبح أولياء الدم يطالبون بالقصاص من الشاب محمد الرياني، وما زالت مساعي أهل الخير متواصلة لتمديد المهلة وأسرته المسكينة كلها أمل في أن يقيض الله جل وعلا لهذا الشاب المسكين والتائب النادم من يعمل على عتق رقبته ابتغاء وجه الله الكريم سائلاً الله أن يجزي جميع من ساهم وسوف يساهم في هذا العمل الخيري والإنساني العظيم والله في عون العب ما دام العبد في عون أخيه.<br />ومن هذا المنطلق فإن صحيفة «الرياض» ضمن رسالتها الإنسانية والاجتماعية النبيلة الهادفة لنشر قيم الخير والتسامح والعطاء والوفاء في مجتمعنا الكريم المعطاء كلها أمل من الله جل وعلا ثم بجهود ومساندة أهل الخير في بلادنا أن يمن الله على الشاب محمد بن حمد بن عبده الرياني بمن يعتق رقبته لوجهه الكريم املين إرسال المساعدات المالية والتبرعات على رقم حساب الجمعية الخيرية بالريان رقم 21335/1 فرع شركة الراجحي بجازان وإرسال صور الحوالات على فاكس رقم 073230020.<br />ولمزيد من المعلومات الاتصال بجوال فضيلة الشيخ موسى خمج خطيب جامع سمو الأميرة صيتة بنت عبدالعزيز بجازان رقم (0505766486)."
