text = "يا جماعه عايزين رأي شيخ معتبر ز عالم جليل في موضوع القتل العمد و الدية ده لانه على حسب علمي فان القاتل يقتل و لو بعد حين<br />و مش حافظ دلوقتي غير ايه سورة الاسراء ( و من قًًًًًًٌٌٌٌُُُتل مظلوما فقد جعلنا لوليه سلطانا فلا يسرف في القتل) و قتل بضم القاف و كسر التاء و يا ريت تفيدونا<br />عندما قتل كليب ابن وائل على يد زوج اخته جاءت ليلى زوجته الى بنتها اليمامه تريد ان تقنعها بالدية فقالت لا اريد الا ابي يمتطي درعه راكبا حصانه يقف امامي و اشتعلت حرب البسوس بسبب قتل كليب غدرا و ليس بسبب ناقة كما يحلو للبعض ان يروج و يصفها بالحرب التافهه"
