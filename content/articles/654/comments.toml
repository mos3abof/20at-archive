author = "abdulaziz alshrief"
text = "بسم اللة الرحمن الرحيم<br />please translate So that Bush's crimes truth and the princes of international Saudi Arabia see (the genies) By + the election fraud is the truth of 9 11 + Shalingr +Their international crimes+And their intervention by the genies is in the world countries affairs And the And the espionage is on the countries and their privacies<br />السادة المكرمين أصحاب الضمائر الحية : جهات الاختصاص بالامم المتحدة والمنظمات والهيئات واللجان والحكومات ووسائل الاعلاام والمعنيين في العالم \"\"\"\"السلاام عليكم ورحمة اللة وبركاتة وبعد::أرجو قراءة رسالتي هذة والتي تحتوي على قضيتي ومساعدتي قدر الامكان فالقضية تهم كل بلد وشخص بعينة القضية كبيرة وخطيرة ومدبرلها منذ زمن من عدة جهات سأوضحها لااحقا وتستحق اهتمامكم ومتابعتكم وانصافي ومن تضرر معي وتجنيب الاخرين الضرر المحدق بهم فقد تعرضت لسجن لسنوات والتعذيب الجسدي والنفسي بكافة الوسائل لسنوات دون ذنب وبلا محاكمات وقتلهم العائلة التي عشت معهم وقتلهم الكثير ممن أعرفهم لاخفاء جرائمهم وطمس كل الشهود و الدلاائل ولكن لدي ما يكشف جرائمهم ويفضح أمرهم عندما تساعدونني في الضغط على الامم المتحدة للتحقيق معي وللعلم فقد راسلت كافة الجهات المعنية بالعالم مطالبا التحقيق الدولي معي دون جدوى أوحتى رد من أحد ابتدأت في المراسلة منذ عام بالتحديد من هذا التاريخ أيها السادة ان من اصغر جرائمهم القتل والخطف مثال تم بتاريخ 1101418 ه خطفالدكتور علوي درويش كيال وزير البرق والبريد والهاتف السعودي السابق من البلد الذي لجأ الية منذ سنوات وهو تركيا أوايران تقريبا وطبعا تم الخطف بواسطة الجن تحضيرا في دقائاق وليس عبر وسائل النقل المعهودة كما تم خطف الفتاة التايلندية وتدعى سوبهى بنفس التاريخ ونفس الطريقة ولها أخت تدعى سوبها ربما خطفت أيضا لست متأكد من خطف سوبها وهما توأمتان ويعيشون في مدينة بانكوك وخطفت سوبها منها كما أن هناك شخص كندي يدعى روبرت يعمل مدربا وسايسا للخيول لدى أحد الامراء لاأعرفة وكان روبرت يسكن في عمائر الخالدية وسط الرياض وقد كان يعرف بعض الحقائق عن القضية فقد لمح لي سابقا قبل أن أعرف أي شىء عنها والان فهمت كل ماكان يقصدة بعد سنوات وقد اختفى منذ سنوات قبل التاريخ المذكور كما أن هناك عاملة منزل هندية الجنسية تدعى محمودة تعمل لدى العائلة التى عشت معهم منذ زمن وتعرف كل ارتباطي بتلك العائلة والكثير من أسرا القضية ولربما تعرف أكثرمما أعرفة عن نفسي وايضا عاملة منزل من الفلبين تعرف الكثير الاولى تدعى محمودة والثانية تدعى د يل ولكونهم يعرفون حقائق الامور فهما محتجزتان هنا وممنوعتان من السفر وأيضا لكونهم قد اغتالو العائلة التى عشت معهم وهي عائلة حسين على الشريف وتقطن في المنطقة الجنوبية من السعودية مدينة أحد رفيدة تحديدا ومن جرائمهم عالميا فقليلة وما أستطيع ذكرة هنا هو الخطف من الخارج+القتل وأغلبة بشكل جماعي لمصالح تبدو لكم غريبة عند علمكم بها ولكنها حقيقة واضحة كما يشعلون الحرائق في العالم في المساكن والغابات وغيرة وقد سمعتم الكثير ورأيتموها عبر وسائل الاعلاام العالمية كما أنهم يساندون أعوانهم في الانتخابات بالتلااعب في احصاءات ونتائج الانتخابات بواسطة الجن وبطرق لايمكن كشفها أبدا الامن قبلي أنا كما يتلااعبون بالارقام الحسابية في البورصات العالمية لصالحهم وللعلم فهم يحضرون للبورصات أعني تلك الشخصيات المسؤلة وسأوضحها لااحقا بطرق متخفيين فلا يراهم أحد أو يشعر بوجودهم وكذلك باستخدام طرق الجن في التنكر وتغيير الملاامح والاصوات وغيرة كما أنهم يجعلون من يدخل معهم في اتفاقات مشروعة أو خلاافة يجعلونة يوافق على شروطهم مهما كانت وهو لم يكن ليوافق عليها أبدا لوكان طبيعيا دون تأثير الجن علية وغالبا عندما يبتعد عنهم لفترة ويعود لرشدة يجد نفسة وافق على مالم يكن ليوافق علية ولكن حصل ماحصل وهم يجعلونها شبة معقولة قدر الامكان لصالحهم كما أن بامكانهم تقريب الوقت الى أبعد من الخيال وكذلك المسافة كما انهم يستطيعون رؤية الماضي والحاضر والمستقبل على الكف وعلى الجدار كالسينما وبشكل عام لديهم القدرة على تحقيق ماهو معجزة كما ان لديهم القدرة على اخفاء ما يحققونة ويقومون بة ولكن بقدرة اللة لدي القدرة علىكشف كل جرائمهم وتقديم كل الادلة لادانتهم بجرائمهم فالقضية مرتبطة باسمي وهذا يطول شرحة سأوجز لكم ماأستطيع أن يكون كافيا لايصال المعلومة لكم كافية أرجو أن تتفهمو ذلك وتفهموني بوعد مني أن أكون واضحا قدرا الامكان وصادقا مع الالتزام بحقي بالتحفض على ما أريد للضغط عليكم انتم أيضا لمساعدتي في طلب التحقيق الدولي وكشف كل مالدي وأن أكون صادقا وأتحمل كافة المسؤلية عن ما أذكرة لكم هنا مالم يقومون بتعديل الرسائل وكل شىء من المؤكد سيتضح كما أن هناك المزيد والاهم الذي لااستطيع ذكرة هنا وستوافقونني الرأى فى حينة أيها السادة أصحاب الضمائر الحية أرجو التحرك وبسرعة لمساعدتي فهم يعد ون العدة لاخفاء ماتبقى من دلاائل وشهود على جرائمهم كما أود أن أبلغكم بأني لاأجيد اللغة الانجليزية واليكم أيها السادة نسخة من الرسالة الموجهة الى الامم المتحدة ولمئات المرات منذ عام تحديدا من هذا التاريخ كما أقر واتعهد بأن كل ما ذكر صحيح وأتحمل مسؤلية خلااف ذلك واليكم الرسالة\"\"\"<br />المكرم السيد كوفي عنانالامين العام للامم المتحدة<br />السلاام عليكم ورحمة اللة وبركاتة وبعد:أفيدكم بان لدي مايهمكم وموجز مأستطيع ذكره هنا لكم هو أن هناك جرائم مختلفة وكبيرة ترتكب ولاتزال في العالم وليس لفاعلها أثر وكثير منها لم ولن يكتشف ومهدد أنا بادانتي بها أو القتل أو تلفيق التهم لادخالي السجن ومن ثم تعلمون ولدي التفسيرات الكافية لها ومعرفة مرتكبيها وعند علمكم بكافة تفاصيلها فستكون من أولويات العمل لديكم لكونها في مضمار الارهاب بل أخطر وتهديدا للامن الد ولى خصوصا لااحقا وتحديا لسلطات الامم المتحدة علما بأنى قد سجنت لسنوات وعذبت كثيرا دون أسباب ولا محاكمات سوى محاولااتى للبوح بهذة الرسالة والدفاع عن نفسي قبل أن تسنح لي الفرصة الان ومنذ عام تحديدا لاول رسالة وجهتها لكم عندما أختلف الاطراف المعنيين بالقضية وانقلبو على بعضهم فمنع كل منهم الاخر من الاقتراب مني وفسحو لي المجال كما ترى لتعلم الكمبيوتر والارسال فكل منهم يتبرأ الان من الاخر وكل يقول لست بوحدي وهذة مشيئة اللة كما ترى ويرى أصحاب الضمائر الحية بالعالم وانت صاحب ضمير حي وموجز ما يهمكم عني أنهم بعد قتلهم العائلة التى عشت معهم لكونى نشأت يتيما بلا أبوين(ستعرفوني) وذلك لاخفاء الادلة على جرائمهم وتهديدا لي بعدم البوح بالحقيقة لاحد خصوصا بعد العروض التي لم يسبق لها مثيل لاحد مقابل سكوتة على شىء ورفضى لكل ذلك وكونى قد حاولت مرارا ابلااغ الامم المتحدة بالامر مرار دون جدوى فقد ذهبت الى مفوضية الامم المتحدة للاحئين بالرياض قبل ما يقارب من خمس سنوات من الان ولكني لم أجد أذن صاغية سوى الاعتذار والتنصل بعد أن انتضرت لمايقارب الساعتين رغم ابلااغي لهم بخطورة الوضع وكذلك منذ عام من الان بابلااغي منضمة العفو الدولية للخليج ولم أجد سوى الاستهتار والتنصل سوى من مسؤلة الاعلاام قدمت لي الاعتذار عن أى اساءة لقد عذبونى بعد عودتى من مفوضية الامم المتحدة للاجئين بالرياض حينها كما اني كنت محاصرا منذ أن عرفت الحقيقة قبل تسع سنوات من قبل الحكومة السعودية وكذلك الجن ومحروم من أبسط حقوق المواطنة فهم يعرفون المستقبل وقد قالو نأخذحقنا منك قبل أن تبوح بالحقيقة فسيأتي يوم وتقولها واللة على ماأقول شهيد وهاأنذا أنتهز الفرصة فرصة صراع الاطراف المعنية بارتكاب تلك الجرائم والمقصود بالاطراف هم قيادات الانس(أل سعود) وقيادات الجن هنا في السعودية وهم يقودون شبكة تمتد عبر أرجاء العالم ويدعمهم بعض الشخصات العالمية لاجل مصالح شخصية من ما يمتلكونة من قدرات يسمونها الطلبات وهي تحقق لهم المعجزات ان صح التعبير ولو لم يرد اللة لما كان وستشعرون بتحرك تلك الشخصيات للدفاع عنهم والتضليل عليهم عند اثارتكم للقضية ومطالبتكم بالتحقيق معي والذي أصبح شبة مستحيلا أنني برىء انهم ارهابيون أكثر من مسمى الارهاب نفسة وللعالم أقول ان وجدتموني مدانا فعاقبوني وأنا من يطلب ذلك والا فأنصفوني وأوقفو الارهاب باسم العدالة الدولية التي أنتم أمناء عليها أكرر طلبي لمئات المرات بسرعة التحقيق الدولي معي وأن لاتحكمون لصالح طرف دون الاخر لمجرد سماع طرف دون الاخر فهذا ليس عدلا بل وعيبا وأنا جاهز بكل الاحوال وتحت أي ضرف كان من أجل تحقيق العدالة وأعلم أنكم تستعجلون السؤال عن الدافع لجرائمهم والجواب الموجز هو أن الرابط بين الجن والانس من هؤلااء الاطراف هواستمرار تلك القدرات المسماة ;بالطلبات وثمنها أرتكاب تلك الجرائم وما خفي كان أعضم ومن أجل بقاءهم أيضاكما أن ليس بمقدور أين منهم النجاة بمفردة وأنهم قد قيدو أنفسهم باتفاقات منذ سنوات طويلة ويستوجب عليهم الاستمرار وللعلم فأن مايرونة من الحاضر والمستقبل بتلك القدرات وبما يسمى عندهم شريط المستقبل فأنه يستوجب عليهم تطبيق مارأوه وأن يتم كما رأوه أين ما كان في العالم والا فانهم يدفعون الثمن غاليا أكثر مما تتصورون ولاأريد أن أخرج عن مفاد رسالتى لاوضح مدى حرصهم وخوفهم من تطبيق مارأوه وما أل الية من كوارث قد حصلت وأن ليس بوسعهم ايقاف ماليس بصالحهم مما رأوة الا اذا توقفوا عند زمن ومرحلة معينةفية وعالجو الامر وليس بسهولة فهم تورطون برؤية المستقبل لزمن أبعد وفية ما ترتب على فلنسميها قضايا من قبل ومع ذلك فهم مستمرون دون رادع أووازع على أمل أن يلفقونها لى أو أن تموت الحقيقة انها أمور غريبة عن بعد ولكن عندما تقترب بمعرفة تفاصيلها دون تدخل الرئيس بوش ووالدة بالنفوذ الامريكي فانها ستكون حقيقة واقعية مؤلمة وثابتة وتثير الغضب والكثير من التسائلاات التى ستضهر الاجوبة عليها تلقائيا أولا بأولا و أمل أن أتمكن من ايصال المعلومة التىأريد لكم بسهولة أما عن فحوى التاريخ 1101418 والذى ابتدأت أعرف فية بعض تفاصيل قضيتي فأبتدىء أقول أنه بتلك السنة أدخلوني السجن بالرياض وبالطبع قد رتبولانطلااقتهم فى الخلااص مني منذ ذلك التاريخ وفي السجن عذبت وأعتدوا على جسديا بعد تخديري وفي صباح يوم عيد الفطر 1101418هجرية يوافق تقريبا 2911998قررت على اثر ذلك الانتحار في السجن وقد كان بالفعل كل السبل متاحة وبارادتي من موس حلااقة الى المجال الى أخرة ولعدم قدرتي على الدفاع عن نفسي فللعلم أنا بقدم واحدة فقد بترو لي قدمي اليسرى من الكعب منذ سنوات بعد أن تركوها دون تنضيف اثرجرح حتى أتت عليها الغرغرينة المهم بقيت أنزف حتى أغمي علي ونقلوني لمجمع الرياض الطبي وعالجوني بخياط الجروح بكل عنف وكانو يستهزأون بي كنت بنص اغماءة ثم نقلوني الى جهة لاأعرفها حتى الان وهناك حضر الاطراف المعنيين بهذة القضية السابق ذكرهم وهم من الانس الملك فهد بن عبدالعزيز وأخوانة عبداللة وسلطان وطبعا سلطان هو الامر بتلك الجرائم والمسؤل الاول والمباشر والممول المادي الرئيس لهم ولتنفيذ تلك القدرات الطلبات لهم ولكل أخوتة كل حسب طلبة منها بتنفيذ الجن وليس بينهم أحد من عامة الشعب كماحضر نايف واحمد وسلمان وسطام وخالد الفيصل فهو للعلم أمير المنطقة التى عشت بها ولهو دور رئيسى في تدميرى منذ صغرى حسب توجيهات ألسعود أعمامة وممدوح بن سعود والكثير من أل سعود سأذكرهم لااحقا وبذلك الموقع والتاريخ أتو بمن سبق ذكرة خطفهم وأصبحو يتصرفون كالمجانين ببل أكثر بالقتل وممارسة شتى أنواع الفسق والرذيلة وأمام بعضهم البعض وأعتدو على نساء عائلة الشريف أمام رجالهم وقتلو منهم من قتلو ومن هنا أرجو قبول سرد القضية عشوائيا وبودي أن أقول أنهم عرفو من خلاال شريط المستقبل أنهم قد انكشف أمرهم وأني سأراسلكم بهذا التاريخ وأخذوبممارساتهم تلك دون حساب للمسؤلية وكان منهم من ينصرف وهو على مقعدة ثم فى محولة يائسة لاصلااح الامر دون جدوى كما حضر رئيس الاستخبارات السعودية السابق الامير تركي الفيصل ومن اقل أدوارة في تدميرى أن كان يأمر بوضع المخدرات في طعامي حتى أدمنت يوما عليها وت<br />25/08/2006<br />اقرأ بقية التعليق .."
