subject = "الشيخ عبدالمحسن الحارثى _جدة"
author = "فارس _fr"
posted = "2006-10-20"
text = "ما شاء الله انا من اول رمضان واناباصللى فى مسجد عليثة وامام هذا المسجد هو الشيخ عبدالمحسن الحارثى والى الذين لا يعرفونه انصحهم بزيارة المسجد فى رمضان او فى اى يوم من ايام الله الاخرى فان الله سبحانه وتعالى وهب هذا الشيخ من حلاوة الصوت وعذوبته الكثير والكثير مما يساعدنا على الخشوع فى الصلاة .. جزاه الله عنا وعن المسلمين خيرا ."
archived = "2006-11-02"
