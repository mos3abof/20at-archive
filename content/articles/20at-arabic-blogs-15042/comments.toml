text = "حاجة صعبة فعلا …كل الناس مكشرة وفى كل مكان …واللى بيضحكوا هم بس المهيسين اللى أصلا مش حاسين بحاجة …يإما القلة القليلة المتفائلة فى الحياة<br />وبما إن احدش بيضحك قولت أضحك أنا"
