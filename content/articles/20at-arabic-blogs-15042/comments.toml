text = "انا شايفه انو فلسطين حتدحك لما بقية الرؤساء العربيه تحس على دمها وتقف معهم وجنبهم مش يقفلو المعبر عليهم وما يدخلوش اي حاجه اي يعني عاوزينهم يموتو.. يدحكو ازاي بقى وكل يوم في حد منهم بموت .. بس مين اللي يحس فيهم واولهم الي مخليهم زعلانين كده الاخ رئيسنا (حسني مبارك)"
