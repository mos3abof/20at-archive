text = "اولا شكرا على ارائكم الجميلة دى انا بقى مش هقول ان انا بحب انغام علشان انا مجنون بيها الشريط الجديد عبارة عن كتاب رومانسى فيه كل حاجة فعلا حركة احسسنا وخلتنا نسقفلها برموش عنيناعلشان الكلام اللى مالوش حل بجد يعنىبغير منالى تكلمة واللى كمان متكلموش نادر عبداللة اكيد كان فى كوكب تانى وهو بيكتب الكلام دة واللاة الحروف هى يعنى الدنيا من غير حب تسوى واللا يعنى الدنيا من غير حب تسو اية قمة الرومانساية دى و بقل رلحتك خلا ص براحتك لالالالاانالو قعدت اتكلم العمر كلة مش هخلص كلامى انغام دى لا ينساها التاريخ الغنائىومافيش فىالدنيا حد هيجى زيها ولا بعدها بس كانت اغنية الحروف احسن كتير هيد للالبوم"
