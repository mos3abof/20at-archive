author = "اكتب اسمك هنا"
posted = "2009-03-17"
text = "اية الروعة دى<br />الواحد عمرة ما قرأ مقال بالحلاوة دى<br />بيانو بيعزف<br />كلامات مرصوصة زى الشعر<br />يروح فين البحترى وابو تمام جنبك<br />دى حتى طة حسين لو كان قرأ المقال دة كان مات مرتاح لانة اطمئن على مستقبل اللغة العربية<br />عزيزى كاتب المقال<br />طز فيك وفى ابنك<br />حمار خلف جحش دى يهمنا فى اية"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003605/http://www.20at.com:80/masr/105-msa7t-r2y/11570.html"

