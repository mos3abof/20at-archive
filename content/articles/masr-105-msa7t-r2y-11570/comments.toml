subject = ""
author = "اكتب اسمك هنا"
posted = "2009-03-17"
text = "شفتوا ميرووووووو اللي هي بالبلدي مروة عبدالفضيل بتقول ايه في التعليق<br />(والتانى ظابط قمر تتخانق عليه البنات )<br />انتي جبتي التايهة يا ميرووووووووو<br />يعني انا كنت صادق في كل تعليقاتي لما قلت العيال بتاخد الثانوية وتجري على كلية الشرطة لييييييييييه<br />هي ميرو جاوبت على السؤال<br />عايزين نيبقو ضباط علشان خاطر البنات تتخانق عليهم مش علشان خاطر الامن<br />علشان كده وزارة الداخلية مش نافعة لان كل الضباط داخلو كلية الشرطة علشان خاطر البنات<br />برافو يا ميرووووووووووو الى الامام دائما<br />ونرفع الامر الى سعادة الوزير حبيب العادلي للنظر في الموضوع"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003605/http://www.20at.com:80/masr/105-msa7t-r2y/11570.html"

[[comments]]
