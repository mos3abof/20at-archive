author = "مش سحس"
posted = "2009-03-17"
text = "منع جيهان السادات من دخول صالة كبار الزوار بالمطار<br />رغم صدور تصريح من الرئاسة<br />كتب ـ عبدالخالق خليفة&—8238;:&—8236; شهد مطار القاهرة الدولي&—8238; &—8236;واقعة سخيفة تكشف عن حالة من عدم اللياقة&—8238;. &—8236;رفضت شركة ميناء القاهرة الدولي&—8238; &—8236;دخول السيدة جيهان السادات أرملة الرئيس المصري&—8238; &—8236;الراحل أنور السادات،&—8238; &—8236;صالة كبار الزوار رغم وجود إخطار من رئاسة الجمهورية بفتح الصالة لها أثناء فترة انتظار إقلاع الطائرة المسافرة الي&—8238; &—8236;فرانكفورت&—8238;. &—8236;كانت السيدة جيهان السادات قد توجهت إلي&—8238; &—8236;الصالة أثناء إنهاء إجراءات سفرها،&—8238; &—8236;وفوجئت بمسئولي&—8238; &—8236;العلاقات العامة بالشركة&—8238; &—8236;يبلغونها بعدم إمكانية تواجدها بالصالة،&—8238; &—8236;ودعوتها إلي&—8238; &—8236;الجلوس في&—8238; &—8236;أحد الصالونات الجانبية&—8238;!! &—8236;توجهت السيدة جيهان السادات علي&—8238; &—8236;الفور الي&—8238; &—8236;صالة الترانزيت لانتظار طائرتها مع الركاب&—8238;.&—8236; حاول المسئولون في&—8238; &—8236;الشركة تقديم الاعتذار لسيدة مصر الأولي&—8238; &—8236;السابقة،&—8238; &—8236;واقناعها بالعودة مرة أخري&—8238; &—8236;إلي&—8238; &—8236;صالة كبار الزوار،&—8238; &—8236;ورفضت بشدة وظهرت عليها علامات الاستياء،&—8238; &—8236;وأكدت أنها ستظل في&—8238; &—8236;صالة التزانزيت حتي&—8238; &—8236;صعودها إلي&—8238; &—8236;الطائرة&—8238;. &—8236;يتضمن بروتوكول صالة كبار الزوار فتح الصالة لزوجات وأبناء رؤساء الدولة السابقين&—8238;.&—8236;"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003605/http://www.20at.com:80/masr/105-msa7t-r2y/11570.html"

[[comments]]
order = 19
subject = ""
author = "مش ححبك"
posted = "2009-03-17"
text = "باختصار الدين الاسلامي ليه فروع على سبيل المثال وليس الحصر<br />1) عقائد<br />2) اداب<br />3) اخلاق<br />4) عبادات<br />5) معاملات<br />ودا على سبيل الحصر<br />اهل السنه والجماعة دي تندرج تحت باب العقائد<br />والموضوع يطول شرحه ما اقدرش احكهولك في تعليق<br />بعد ما تصلي الجمعة<br />اجلس مع الخطيب وخليه يفهمك الموضوع<br />سلام"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003605/http://www.20at.com:80/masr/105-msa7t-r2y/11570.html"

[[comments]]
order = 20
subject = ""
author = "سحس"
posted = "2009-03-17"
text = "نشرت جريدة الوفد ان سيدة مصر الاولى سابقا الست جيهان السادات اشهر من نار على علم كانت مسافرة الى امريكا امس ورفضت سلطات المطار دخولها وانتظارها فى قاعة كبار الزوار - وانها يا عينى قعدت مع الركاب العاديين فى صالة الترانزييت فى انتظار الطائرة<br />الست جيهان التى كان الوزراء ورؤساء الوزراء يقفون امامها يرتجفون من الخوف تمنع اليوم من دخول صالة كبار الزوار<br />اة يا زمن لو رجعت 30 سنة فاتت<br />كانت جيهان اصدرت قرارا برمى الذين منعوها من الدخول فى معتقل الواحات او ليمان طرة<br />ولكنة الزمن<br />زمن الاندال"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003605/http://www.20at.com:80/masr/105-msa7t-r2y/11570.html"

[[comments]]
order = 21
subject = ""
author = "اكتب اسمك هنا"
posted = "2009-03-17"
text = "ان كان دة راى اهل السنة والجماعة ومش عارف اى جماعة هل الجماعة فى البيت والا الجماعة فى الحزب الوطنى والا الجماعة فى النادى - فخلاص يا عم اعتبرنى من اهل الخروج الى الحدائق والمتنزهات<br />وبعدين سنة اية وكلمة سنة يا اخ معناها ايةالكلمة ذكرت لسيدنا ابراهيم كان حنيفا سنيا<br />واحب اقول لك اننا مسلمين لا سنة ولا شيعة ولا قديانى ولا شاذلية ولا بدنجانية"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003605/http://www.20at.com:80/masr/105-msa7t-r2y/11570.html"

[[comments]]
order = 22
subject = ""
author = "مش ضروري"
posted = "2009-03-17"
text = "برافوا يا خباب دا اول عنوان بعد المقدمة (لا للخروج) انت كده راجل سني صح يا خباب<br />طاعة ولاة الأمر وعدم الخروج عليهم<br />ولا نرى الخروج على أئمتنا وولاة أمرنا، وإن جاروا. ولا ندعو عليهم، ولا ننزع يدا من طاعتهم، ونرى طاعتهم من طاعة الله -عز وجل- فريضة ما لم يأمروا بمعصية، وندعوا لهم بالصلاح والمعافاة<br />هذا هو كلام اهل السنة والجماعة"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003605/http://www.20at.com:80/masr/105-msa7t-r2y/11570.html"

[[comments]]
