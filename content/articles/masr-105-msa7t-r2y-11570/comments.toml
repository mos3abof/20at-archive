author = "امينة الشاذلي"
posted = "2009-03-19"
text = "والله يا خباب الواحد من غير نت بيبقى حاسس انه يتيم منقطع عن العالم الخارجي<br />ربنا يحفظ لينا انكل انترنت ويبعد عنه ولاد الحرام ويوقف في طريقه ولاد الحلال ويحفظ الكابلات البحرية والجوية من كل سوء..دا احنا من غير الكابلات دي هنضييييييع..ربنا يهدي سمك القرش وما يقرقضهوش تاني ويقطعه عننا<br />وبجد مرسي قوي يا خباب على المعلومات القيمة دي عن النت<br />لان أغلب الناس بتستخدم النت من غير ما تعرف اصلا يعني ايه انترنت"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003605/http://www.20at.com:80/masr/105-msa7t-r2y/11570.html"

