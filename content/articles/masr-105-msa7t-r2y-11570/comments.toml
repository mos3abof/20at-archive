posted = "2009-03-16"
text = "جمال موقع ولاد البلد في طرح الموضوعات الساخنة والمصيرية وطرح الموضوع للمناقشة والحوار بين القراء<br />وبعدين فوجئنا بموضوع لواحدة اسمها مي حمدي اسمه تلت ابتسامات لا يهم قارىء ولاد البلد في اي شيء سوى انه موضوع س<br />خيف جدا<br />وها هو موضوع اسخف منه هو ان فيه واحد اسمه خباب خلف ولد وسماه ياسين<br />كان عنده بنت ودلوقتي ولد<br />طيبك يا سيدي الف الف الف مبروك لمصر والعرب للمسلمين<br />زدنا واحد والحمد لله<br />مبروك يا عم<br />عايز اعرف دا يهم القارىء في ايه"
