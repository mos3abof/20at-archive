[[comments]]
order = 14
subject = ""
author = "مش قوى كدة"
posted = "2009-03-16"
text = "اية يا اخى الكلام دة<br />مد شيعى اية - وبدنجان اية<br />دى كلها مذاهب سواء سنة او شيعة تعلوا الاسلام عاليا وهم اخوان وليس هناك اى عدوات ولا حروب كما حدث فى اوروبا ومات فيها الملايين واخرها الحرب العالمية التانية بين الكاثوليك والبروتستانت<br />السودان كان طول عمرة 5 ممالك لغاية ما وحدهم محمد على باشا من 200 سنة بس وكل مملكة فيهم قدر مساحة مصر وكلهم مسلمون والحمد للة وحتى الجنوب اللى وجعت دماغنا فية عدد المسيحيين فية لا يزيد عن 15 % ولكنهم متعلمين والباقى وثنيين وليس لديهم اديان<br />اما جنوب مصر فمسلم والحمد للة والاسلام فية اكثر من 94 % من السكان واكثر كثافة للمسيحيين فى محافظة اسيوط فى الصعيد لا تزيد الكثافة فيها عن 12 % مسيحيين<br />ولا ابوما ولا جد اوباما ولا اسرائيل ولا اللى عملوها يقدروا يعملوا حاجة<br />وعلى فكرة فية مؤسسة امريكية قالت من اسبوع ان اسرائيل ستتلاشى خلال 20 سنة وانهم بدأوا هجرة عكسية الى امريكا<br />وسأضرب لك مثالا واحدا<br />لبنان كانت محافظة سورية وكان المسيحيين فيها 70 % من التعداد ايام الاحتلال الفرنسى ففصلتها فرنسا عن سوريا واسست دولة مارونية مسيحية فى الشام<br />اخر تعداد فى لبنان بيقول ان المسيحيين 17 % والباقى مسلمين لان كل المسيحيين هاجروا الى المهجر او خلفتهم قليلة<br />وعمالين يقاوحوا وسيبك من المظاهر الكدابة<br />اخر مؤتمر للكنائس الشرقية من سنتين كان بيناقش انقراض المسيحيين من الشرق الاوسط فى اخر اجتماع لة<br />بلاش تكلمنا عن مخاوف واوهام ليس لها اى ظل على الارض ولا يمكن ان تظهر الى عالم الحقيقة"
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003605/http://www.20at.com:80/masr/105-msa7t-r2y/11570.html"

[[comments]]
order = 15
subject = ""
author = "صباح الخير يا اجندة اوباما"
posted = "2009-03-16"
text = "لابد أن تكون كل المنظمات القبطية في المهجر علي استعداد تام لان تقدم طلب إلي المجتمع الدولي عن طريق الجمعية العامة للأمم المتحدة والقوه العظمي الأمريكية شهادة حق تقرير المصير للشعب القبطي والذي يقدر في مصر بخمسه عشر مليون قبطي يحاربون وتنتهك كافه حقوقهم السياسية والاجتماعية ويعيشون غرباء في ارض الوطن بالإضافة إلي أقباط المهجر والمتنصرين المصريين كلهم يردون العيش داخل مجتمع مسيحي<br />وهذا يعيدنا إلي التاريخ ومطالبات قديمة بإنشاء دوله قبطية في إفريقيا لأنها ستكون بداية ضرب الشرق الأوسط بأكمله والتحكم فيه وتقسيمه فخريطة الشرق الأوسط الجديد ليست لها أي قيمه من دون تقسيم مصر مره أخري بعد ان كانت من الإسكندرية إلي جنوب السودان ولان مصر هي رمانه ميزان للشرق الأوسط ومزايا هذا الموضوع كبيره جدا<br />إنشاء دوله مسيحية في إفريقيا في قلب الشرق الأوسط تكون درع ورمح جديد في قلب الإرهاب من الجنوب<br />وتضعف قوي الإرهاب في شمال السودان<br />ستكون ارض للقواعد الأمريكية الصديقة في إفريقيا والشرق الأوسط وستخفف من ضغط القواعد في الخليج<br />وستجبر المنطقة علي سباق التسلح مما سيفيد الشركات الأمريكية في تصدير السلاح<br />ستعيد تقسيم المنطقة وخاصة عندما تنهار السعودية أمام الأزمة الشيعية القادمة علي الشرق الأوسط<br />وهذا لن يحتاج إلي مجهود إن مشقه سوي ضرب الجيش الثالث وقواعد الجنوب المصري واحتلاله وستنهار الدولة في الجنوب ويتم إعادة الأقباط إلي هذه المنطقة من شمال مصر ومالنا في شمال مصر سيقاضي بما هو في جنوب مصر<br />بالتأكيد سيدخل اليهود إلي سيناء ولن يكون هناك أي مجال للتحدث دوليا عن معاهده السلام بين مصر وإسرائيل لأنها ستكون منتهية بسبب ما تفعله مصر مع شعبها المفكك والمجتمع المنهار هذا سيناريو يطرح<br />أمام المجتمع الدولي كحق تقرير مصير للشعب المصري مع حكومته التي اضطهدته علي أساس الدين والعرق<br />وهو الشعب القبطي ملايين المعتقلين داخل وطنهم علي يد حكومة غاشمة استمرت أكثر من أربعين عاما وهو حكم العسكر المصريين سرقوا من الشعب الوحدة و والتقدم والازدهار وجعلوا مصر منبع التخلف والإرهاب في الشرق الأوسط والعالم وجرائم النظام العسكري في مصر لا تنتهي<br />ولذلك الحل هو تدمير النظام المصري وتقسيم الأراضي كما قسمت من قبل للمصريين السود (السودان جمع اسود وهو اللقب المتعارف عليه تاريخيا) وأصبحت السودان منفصلة عن مصر ومن ثم دخلتها الوهابية لتتسبب في تدمير المجتمع السوداني ووصل به الحال علي ما هو عليه ولكن نشكر الله أن الجنوبيون استطاعوا أن يشكلوا قوه وينفصلوا عن الشمال الوهابي العميل للسعوديين مصدري الإرهاب الإسلامي( السني الوهابي) في العالم<br />حق تقرير المصير ليس خيانة للشعب المصري بمستوطنيه المسلمين والطوائف الاخري فمن خاننا هو من يلعن صليبنا وكتابنا المقدس ويحرق كنائسنا ويخطف بناتنا القاصرات ويغتصبهم ويقتل شبابنا وخان العهد والدماء التي روت ارض سيناء والأمن الذي هو مواطنون مسلمون ممنوعة مناصبهم علي الأقباط ولذلك يتجاهلون مشاكل الأقباط بل ويفرحون ويعتقدون أنهم يقدموا خدمه لله باضطهادنا بهذا الشكل العنيف<br />واكمن من دوله لاتصل عدد سكانها إلي 1% من عدد الأقباط والمتنصرين الآن ولن يكون هناك تواجد أمريكي في المستقبل إلا بإنشاء دوله للأقباط كعرق قبل الدين يمارسون في شعائرهم ويحمون منها المسيحيون المضطهدون في الشرق الأوسط ولن تتحقق هذه الدولة إلا في حاله واحده هي أن يريد الرب أن تتحقق فهو من سيساعدنا علي أن نحددها بعد أن اخذ المسلمون منا كل شيء دولتنا واراضيينا وكنائسنا التي تحولت إلي مساجد للمسلمين السنة المحتلين لمصر ومستوطنيها ولذلك الحل في يد القوي العظمي إما أن تتعاظم وتستخدم كل قدراتها لخلق حدود جديدة في مصر علي غرار حدود مصر والسودان تجمع فيها الأقباط والمتنصرين ومن يرد أن يذهب لها وتنشأ دوله تضع أضخم سفارة أمريكية في العالم وقواعد عسكريه وجيش قبطي مسلح ودوله كاملة تخدم مصالحنا المسيحية العالمية والعلمانية وتدافع عن والأقليات المدمرة في الشرق الأوسط بل وستكون نافذة علي خلق جو جديد وشكل جديد يحدد المستقبل القادم في قلب ما يسمونه العالم الإسلامي الذي يريد أن يدمر لبنان المسيحية ستكون دولتنا قاسمه لظهر البعير وربما تكون هي الأرض الذي سيأتي إليها المسيح بعد أن يذهب إلي أورشليم عند اليهود ."
archived = "2009-04-22"
capture_url = "https://web.archive.org/web/20090422003605/http://www.20at.com:80/masr/105-msa7t-r2y/11570.html"

