text = "الف مبروك يااستاذ خباب وعقبال ماتجيب عشرين ووواحد كمان والعمر مبيقسشى بالعيال وانما بحجات تانية واحسن حاجة انك ممكن تاخد من خبرات التانين وان شاء الة ربنا يعوضك بيهم برزق جديد وحياة سعيدة ان شاء اللة وامستقبل ان شاء اللة فى ياسين وغيرهم من الشباب الواعد اللى مستنى الفرصة علشان يعبر عن نفسة وان شاء اللة يكون منهم<br />ومتنساش الحلاوة اللى احنا مستنينها من زمان<br />والف مبروووووووووووو ووك"
