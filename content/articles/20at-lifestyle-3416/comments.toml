subject = ""
author = "المصرى القهور"
posted = "2007-03-22"
text = "لا حد من البهوات الحكام ولا المسئولين شاف اللى شافوه المصريين فى الغربه دول ناس يحبوا الرقص و الذفه الكدابه كل العرب يجدوا لذتهم و متعهم فى مصر و المصرى اتحكم عليه يعيش غريب حتى فى وطنه. داحنا مسخررررررررررة العالم كلة والادهى من كده يفرسونا بان مصر هو ده قدرها والمثا يقول\" اللى لازم البيت يحرم عالجامع \"و كمان بيقول\" معاك ليك لأ والله , معاك لغيرك يرزق الله\" اتعلمنا ورضعنا زل ومفيش فايده عاملين زى القرع نمد لبره …<br />. الحزبن على بلده"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100517/http://www.20at.com:80/7ayatna/3416.html"

[[comments]]
order = 3
subject = ""
author = "مصرية"
posted = "2007-03-25"
text = "ايه يا جماعة فى كتير من الشعب المصرى مش لاقى ياكل ودى حاجة عادية لكن مش معنى كدة انى نقعد نحسد العراقين علشان معاهم فلوس ربنا يرزق ويا استاذ مصرى مقهور عادى يعنى اننا نعطيهم من خيرات بلدنا اصلى احنا اللى فى جيبنا مش لينا وبعدين مصر طول عمرها شايلة هم كل الدول العربية من اكبر دولة لاصغر دولة اينعم احنا لما بنكون تعبانين مش بنلاقى حد يشيل همنا بس مصر كدة طول عمرها كدة وهتفضل كدة شمعة تحترق من اجل الاخرين لكن مينفعش تحترق ليها دة طبعنا عندنا شهامة لما نلاقى حد فى ورطة على طول بنديله كل حاجة معانا ولو كمان نقدر نبيعله بيتنا وهدومنا علشان مشكلته تتحل ماشى نعملها احنا كدة اصلى مصر معطاءة واهلن بالعراقيين فى مصر واللهى منورين يلا وان شاء الله ربنا يحرر وطنكم"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100517/http://www.20at.com:80/7ayatna/3416.html"

