[[comments]]
order = 5
subject = ""
author = "نجيب"
posted = "2007-04-14"
text = "للأسف هناك بعض المصريين يتكلم بطريقة لا تنم إلا عن جهل كبير بالوقائع وهم عار على مصر العربية فالعراق هو من أستقبل المصريين عندما أنهار السوق المصري والعمالة وبدأت الحكومة بتطفيش المصريين من بلادهم بداية من أيام إنفتاح السبيعينات حينما أبتدى هروب المصريين إلى الخارج فرارا من الأزمة الإقتصادية كان المصريين في العراق فقط يعاملون بصورة خاصة عن باقي الجنسيات الأخرى ولتسأل واحد أو أثنين أو مئة من المصريين الذي كان في العراق في الثمانينات كيف كانو يقدرون المصريين في المصالح الحكومية كانت لهم شبابيكهم الخاصة دون عن أي جنسية أخرى وكانت لهم أحيائهم الخاصة بهم … ومرتبات خاصة … والعراق هي من أستقبلت العلماء المصريين وكرمتهم بعدما طوردو في بلدهم<br />- مصر الساداتية - وشاركو في بناء عراق ما قبل الحصار … وعندما يرسل الميت في صناديق إلى عائلته في مصر تكريما له وتتحمل الدولة - العراقية وليست المصرية - تكاليف الشحن فهم قتلة لأنهم أرادو أن يدفن الميت في بلده التى طردته … فهل يعقل أن يقتل العراقيين شخص ثم يرسلون جثمانة !!!!!<br />كفى الجاهلين بجهلهم<br />عربي مصري"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100517/http://www.20at.com:80/7ayatna/3416.html"

[[comments]]
order = 6
subject = ""
author = "مصرية عربية"
posted = "2007-05-22"
text = "حرام عليك احنا صحيح بنمر بأزمة كبيرة فى مصر لكن هذا ليس له علاقة بالعراقيين احنا فى أزمة ارتفاع الأسعار من 2000 ولغاية دلوقت يعنى همه ملهمش ذنب فى كدة، ويعنى لو احنا إللى فى وضعهم ترضى يكون رد فعلهم زيك كدة أكيد مش هترضى.<br />ادعلهم تتفك ازمتهم وادعلنا تتفك ازمتنا اللى مش هتتحل ابداً وبلاش نعلق خبيتنا على اكتاف غيرنا."
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100517/http://www.20at.com:80/7ayatna/3416.html"

[[comments]]
order = 7
subject = ""
author = "سارة ال"
posted = "2007-06-01"
text = "انا عراقيه و اهنيء المصريين على طيبتهم و كرمهم و اصالتهم و ان كان هناك اقليه بسيطه تستكثر على العراقيين الماوى الأمن و السكينه على ارض مصر فالاكثريه العضمه ابدى من الكرم و الترحاب و الاخوة العربيه الصادقه ما يجعلنا نشعر بان مازالت الدنيا بخير ومازال هناك اخوة بالعروبه و الدين نعم انا عراقيه و اعتبر نفسي من الموسورين المرتاحين ماديا ولا ا[ *** ]ب رزقي من هنا بل جئت لمكاسب اكبر فمصر بلد العلم و الثقافه والجمال و العروبه و الحضاره و التاريخ و م[ *** ]بي الحقيقي صداقاتي و علاقاتي الطيبه و كوني اغترف كل يوم من جعبة هذه الحضاره التي لا تنضب<br />و ان كان هناك غيري يعمل هنا و ي[ *** ]ب من هنا ولم يحضر نقوده معه نعم اشعر جدا مع ابناء هذا البلد و اشعر بمعاناة البعض للسعي للقمة العيش و اعترف ان المصريين اولى بمصرهم<br />وفي ذات الوقت اتعاطف مع ابناء بلدي المنكوبين فأين يرحلون هل نحن و الزمن عليهم<br />و اقول لمصر انت ام الدنيا و شيخة العرب و جامعة الدول العربيه ولذلك تدفعين دوما ضريبة كل هذا<br />احب بلدي ولكن اقسم بالله احبكم بالمثل يا ابناء مصر"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100517/http://www.20at.com:80/7ayatna/3416.html"

