[[comments]]
order = 0
subject = ""
author = "اكتب اسمك هنا"
posted = "2007-03-14"
text = "اعانكم الله يا اهل العراق واعاد لكم ارضكم ووطنكم<br />يؤسفنا ان نرى القدس محتلة مرتين<br />مرة في فلسطين والاخرى في بغداد… ماذا عسانا نقول سامحهم الله الذين كانو سببا في كل هذا<br />وان شاء الله انها غلطة لن تتكرر حين نتحالف على احد اخوتنا العرب وندخل امريكا لتحل الازمه..<br />احاول ان لا اكثر ولكن الموضوع مستفز للمشاعر<br />فكيف يقررون ان يزيحوا صدام ليأتوا للشعب بالحريه والديمقراطيه ، وعلى يد من ؟ على يد امريكا<br />وماذا فعلت امريكا<br />شتت العراقيين، وقتلت الاهالي واغتصبت النساء والاطفال<br />دمرت المنازل وقضت على اي وسيله للسلام والعيش بامان في العراق وحكمت الاكراد في البلاد..<br />حسبنا الله ونعم الوكيل ..<br />بكل الاحوال نتمنى من سائر الدول العربيه ان تتعامل مع اخوانها العراقيين على انهم فعلا اخوانهم فلا نحسسهم بمذلة الهرب ولا قصر اليد ولا نستغل ظروفهم لنستفيد منهم وكم هو رائع منهم اصرارهم وحبهم للحياة واستمرارهم في العيش والعمل .. خاصة ان كانت مصر مأواهم في ظل هذه الظروف فهم قادرون على التألقم مع شعبها لانه طيب بالفطره ومعطاء."
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100517/http://www.20at.com:80/7ayatna/3416.html"

[[comments]]
order = 1
subject = ""
author = "مواطن مصري مفروس"
posted = "2007-03-21"
text = "العراقيين اللي في مصر … صعبانين عليكم؟ والمصريين اللي في مصر ومش لاقيين ياكلوا ومحلاتهم بتقفلها الضرايب والتراخيص..مش صعبانين عليكم؟وولاد مصر اللي رجعوا لأهلايهم في صناديق من العراق قتلى ..مش صعبانين عليكم؟<br />سؤال يطرح نفسه.. من أين جاء العراقيين في مصر بمثل هذه المبالغ لفتح محلات يعجز أهل مصر نفسهم على فتحها بسبب مطاردة الضرايب والتراخيص لهم وعرقلة الاجراءات…وجهاز مدينة اكتوبر اللي بيقل محلات المصريين وسايبها للعراقيين مفتوحة ع البحري … وأمناء الشرطة بتوع اكتوبر اللي لو ما اخدش منك إتاوه يلفق لك قضية بس ميعملهاش مع العراقيين ولا إيجارات الشقق بفضلهم ارتفعت إلى آلاف الجنيهات بعد أن كانت بالمئات…وشهم حلو قوي على مصر والمصريين…اللي بيقول الفلسطنين …الفلسطني ن اللي خرجوا من فلسطين هم أغنى أغنياء مصر ومنهم العجيل والتميمي ودي حاجة معروفة…ده غير اللي اخدوا الجنسية الامريكية …كفاكم عواطف …مصر ليست الدولة الغنية لدرجة انها تحتوي لاجئين يأخذوا من خيراتها التي كثيرا ما تعز هذه الخيرات على ابناؤها<br />كفانا شعارات وكلام ذو صبغة دينية مخدرة للاعصاب والمشاعر مما يجعل تفكيرنا وحكمنا على الأشياء غير موضوعي…<br />الخلاصة:العراقي ين عايشين مبسوطين [ *** ]بانين في مصر … المصريين مش عايشين ومش مبسوطين ومش [ *** ]بانين في مصر ويوم ما راحوا العراق يشتغلوا …اتقتلوا."
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100517/http://www.20at.com:80/7ayatna/3416.html"

[[comments]]
