text = "ما راح اكول شي بس اتذكروا انو كام بالعراق 7 مليون مصري عايشن بالعراق عيشية ما يحلمو بيها عملوا فلوس لو ضلوا يشتغلوا 1000 سنة ميقدروا يعملوها<br />و بعدين العراقيين الي بمصر دخلوا فلوس المصر اكثر من ما دخلوا الخليجين الي جاين عشان … عيب ما اكمل احنا احوان<br />عدكم مثل ايكول زي القطط تاكل و تنكر"
