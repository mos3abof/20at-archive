author = "مواطن مصرى"
posted = "2008-10-02"
text = "رسالة مفتوحة الى كل من كتب فى هذا الموضوع : الى العراقيين الذين يعايرون المصريين على انهم كانوا يتعاملوا فى العراق احسن معاملة ويقبضوا مرتبات احسن من العراقيين انفسهم .. اقول ان المصريين ذاقوا المر وكانوا يعملون نظير الاجولا التى كانوا يأخذونها ولم يكونوا عالة بدون عمل ثانيا من ساعد العراقيين فى حربهم ضد ايران اليسوا المصريين من حمل السلاح واستشهد فى هذه الحرب اليسوا المصريون من زرع ارض العراق ايضا المصريين من ارسل الضباط والخبراء العسكريين هم المصريين وتذكروا دائما ان العراقيين لم يستطيعوا رد عدوان التتار والمغول وايرانيين بمفردهم اصلهم اشاوس ونشامى ونرجع للتاريخ ونعرف ان المصريين هم دائما الذين اوقفوا هجمات الغزاة من جهة العراق التى لم تستطع فى تاريخا الطويل رد اى عدوان الا بمساعدة المصريين<br />اقول كمان والا كفاية … احنا فى الاول والاخير اخوة وعرب ومش مفروض ان ننشر غسيلنا ال… على العالم كله<br />اما الرد على رأى احد الاخوة بأن العراقيين يأملوا فى الرجوع الى بلادهم قريبا فنحن شعب مضياف واهلا با اخواننا من كل<br />مكان ولمن بدون تجريح … اما بالنسبة للنعوش الواردة من العراق فأنا اعمل فى وزارة الصحة وكل التقارير الواردة والخاصة بأسباب وفاة المصريين فكلها بنسبة 95 % موت بسبب طلق نارى-ضرب افضى الى موت يعنى اسباب مقصودة يعنى بعد خدمتنا للعراقيين طوال سنين طويلة تم قتل المصريين ومصادرة اموالهم فى نهاية الثمانينيات بقرار من الطاغية صدام حسين<br />ولنا رجعة اخرى للرد على اى حاقد او حاسد"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100517/http://www.20at.com:80/7ayatna/3416.html"

