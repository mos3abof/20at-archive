posted = "2008-08-30"
text = "اسمع يا حج( مواطن مصري مفروس ) كلامك كلام واحد حاقد على الامه العربية كلها وعلى ارض الخيرات والحضاره العراق خصوصا ارجو وانت تتكلم ان لا تنسى انه هذا البلد العظيم كان مستضيف بده الكريمه اكثر من خمسة مليون من اخواننا المصريين وكلهم عادوا الى مصر يحملون النقود وامتلكوا العقارات والعربيات من فلوسنا وانت الان تتكلم على مائة الف عراقي فقط هم من دخلوا مصر المعموره ولكن دخلوا بنقودهم وبخيرهم بهذا نحن اكرم منكم الاف المرات نحن استقبلناكم وانتم جواعا فاشبعناكم … وانتم لا تريدون استقبالنا ونحن الكرماء ولا تتوقع انه هناك عراقي واحد سيتحمل العيش بعيد عن بلده لولا الامريكان والهيهود لعنهم الله هم من فرقوا شملنا نحن سنة وشيعه امه واحد ذات رساله خالده وسيعود العراق يوما والله والله ونحن الاكرمون ورحمك الله يا ابانا وشهيدنا المفدى يا عز العرب صدام حسين"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100517/http://www.20at.com:80/7ayatna/3416.html"

[[comments]]
