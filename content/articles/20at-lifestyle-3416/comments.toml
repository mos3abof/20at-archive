[[comments]]
order = 10
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-01-10"
text = "انا مصرية عايشة في الإمارات وكان نصيبي اني اتخطب لمصري زي بس عايش في مصر وكنت اول مره اعرف ان العراقيين بالكثرة دي في مصر وان هما السبب الرئيسي لولعة الأسعار في مصر وعرفت كده لما حبينا ندور على شقه والحمد لله الفضل يرجع للعراقيين الشقق مولعه نار وكل مانسأل أصل العراقيين جايين ومعاهم فلوس كتيير وسكنوا في أرقى الأماكن في مصر وولعوا الدنيا بمجيهم والنتيجة مش عارفين نلاقي شقه محترمه نسكن فيها يظهر انهما هايقعدوا في مصر واحنا نطلع منها عشان مش عارفين نتأقلم على الأسعار المولعه دي ونروح بأه بلد تانيه يطلع عينا فيها وربنا يكرم ونرجع بفلوس اكتر من فلوسهم عشان نعرف نجيب شقه ونعيش فيها في بلدنا حسبي الله ونعم الوكيل"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100517/http://www.20at.com:80/7ayatna/3416.html"

[[comments]]
order = 11
subject = ""
author = "سيف العراقي"
posted = "2008-03-08"
text = "السلام عليكم ايها الاخوة المصريين ناسف لمى نرى من تعليقات على العراقيين وهذا طبعا من ايدينا نحن كان العراق سباق في استضافة المصريين وحتى كانوا يعاملون من قبل الحكومة العراقية افضل من مايعاملون العراقين في مصر تستكثر كم الف من العراقيين في مصر العراقيين استضافوا 8 مليون مصري قبل الحصار ولا تنسى العراق اغنى دولة في العالم واذا كنت ترحبون بلخليجيون فان الخليجيون كانو يتمنون العيش في العراق ولحد يومنا هذا هناك مصريون يسكنون في العراق ويتعاملون احسن المعاملة واني لااكثر في الكلام فقط اقول انة الفرج لقريب للعراقيين ليسترجعون كرامتهم من العرب بعدما انكشفوا على حقيقتهم وان سالتو من اين حصلوا على الاموال فان العراقيين في خير دائم مادام هناك انفاس في ارواحهم وهناك خيرات لم تكشف بعد"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100517/http://www.20at.com:80/7ayatna/3416.html"

[[comments]]
order = 12
subject = ""
author = "الوميض"
posted = "2008-03-10"
text = "اولا اوجه شكر لكل دولة عربية ساعدت العراقيين في محنتهم ولكن اود ان اقول لماذا كل هذا التحامل على العراقيين قبل حرب الخليج كان هناك ملايين المصريين في العراقق والان الاخوة المصريين غاضبين من عدة الالاف فقط ثانياً لو جاء العراقيين ومعاهم فلوس هذا بسبب شروط الحكومة المصرية في منح الاقامة التي يستطيع الحصول عليها فقط من قبل ميسوري الحال ولو الظروف ماكان العراقيين يتغربوا ونتمنى تنزاح الغمة قريباً حتى يخلص العراقيين المقيمين في الخارج من كلام ((اخوانا)) العرب."
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100517/http://www.20at.com:80/7ayatna/3416.html"

[[comments]]
order = 13
subject = ""
author = "AHMED FAHIM"
posted = "2008-03-17"
text = "الذنب لم يكن ذ نب المواطن سواء كان عراقيا ام فلسطنيا او أى عربيا كان فالوطن واحدا منذ الاذل والدين واللغه والثقافه والحضاره جمعت بين تلك الشعوب فالفاطميون عاشوا وبنوا في مصر ومن التونيسيون والعراقييون والسوريون وصلاح الدين دافع عنا وعن ثقافتنا ولم يكن الجميع بمصر اغنياء وعندما كانت تضيق بأبنائنا الحاجه كنا نلجأ لتلك البلدان لتحسين دخولنا اما من ماتوا فلكل ظروفه ومواقفه الخاصه في البقاء حتي الموت فلا تعالون في توصيف من اراد الحياه وشق طريقه وكونوا رحماء بالقول فهم منا وعليناونحن منهم وايضا المستفيد الاخر من هذا كله مواطن عربي بدلا من رحيلهم للغرب واتقوا الله"
archived = "2009-05-28"
capture_url = "https://web.archive.org/web/20090528100517/http://www.20at.com:80/7ayatna/3416.html"

