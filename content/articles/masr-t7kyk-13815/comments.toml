author = "جيمـي"
posted = "2009-10-26"
text = "المسئول بيقولك أيه …<br />بيقولك أننا مش المفروض ناخد العياط كنقطة سوداء لحوادث القطارات ومش معنى أن فيه حادثتين للقطارات وقعت بالعياط تبقى العياط فيه مشكلة .<br />يلا … حادثة وعدت وربنا ستر دول 18 بس الى ماتوا .. سبحان الله<br />عربيتين مليانين بشر .. والى يموت 18 بس … قادر يارب على كل شيء ."
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031181042/http://www.20at.com:80/masr/t7kyk/13815-2009-10-25-13-41-54.html"
