[[comments]]
order = 0
subject = ""
author = "تقرير الامن"
posted = "2009-10-25"
text = "الجاموسة اعترفت واقرت بالصوت والصورة بانها هى المسئولة عن الحادث وستقوم النيابة بتمثيل الحادث واخذ الجاموسة الى موقع الحادث لتمثيل ما حدث<br />واوصى التقرير بذبح كل الجواميس فى كل انحاء الجمهورية اسوة بما حدث فى مذبحة الخنازير لمنع تكرار تلك الحوادث مستقبلا<br />كما اقترح بعضهم عمل بطاقات شخصية قومية للجواميس وتركيب لوح ارقام على ظهورها مثل ارقام السيارات لتحديد هويتها ومعرفة صاحبها<br />الحزب الوطنى نفى ان تكون الجاموسة عضوة فى احدى لجانة بينما الوفد يدعوا الى انشاء نقابة للجواميس"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031181042/http://www.20at.com:80/masr/t7kyk/13815-2009-10-25-13-41-54.html"

[[comments]]
order = 1
subject = ""
author = "المهزلة القطارية"
posted = "2009-10-25"
text = "كنت اتفرج على التليفزيون فى قناة الحياة وقت اذاعة صور الحادث وتفرجت على الصور كاملة<br />فجاة وصلت كتيبة عساكر امن مركزى واصطفت بالخيرزانات والدروع لية مش عارف وجايين يعملوا اية واية علاقة الامن المركزى بالحادث<br />وصلت بعض الرتب اخر شياكة وكانهم هيصوروا فيلم او هيعرضوا حلقة برنامج شو<br />ان الاهالى بجلاليبهم هم من كانوا يخلون الجرحى والمصابين<br />كانت عملية بدائية جدا لقطع كمر العربة بمنشار وحجر جلخ مع ان مبادىء العلم بتقول اقطع بلمبة غاز واستلين واكسجين لانها هتكون اسرع وافعل<br />كان هناك ونش او رافعة ضخمة ويجلس بداخلها السائق بدون اى مهندس او مسئول يؤشر لة بالرفع او الخفض او الايقاف<br />المستوى يظهر ان كل شىء فى البلد دى منحط وبيمشى اى كلام"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031181042/http://www.20at.com:80/masr/t7kyk/13815-2009-10-25-13-41-54.html"

[[comments]]
order = 2
subject = ""
author = "فى الهند"
posted = "2009-10-25"
text = "فى الهند السيدات تسوق القطارات ولا مشاكل<br />فى امريكا القطارات تشتغل اتوماتيك بدون سائقين<br />فى دبى مترو الانفاق بدون سائقين<br />انما فى المحروسة وهى تانى دولة ادخلت نظام السكك الحديدية فى العالم بعد انجلترا وقبل امريكا فكما تركها الخديوى اسماعيل فهى كما هى تعمل بالسنافورات والبوابات الحديدية والتطوير الذى حدث تطوير شكلى<br />انها تنتمى الى ايام الخديوى الذى حفر القناة<br />بلا تطوير<br />قطارات بدون دورات مياة<br />قطارات بدون شبابيك<br />واحيانا بدون فرامل<br />واحيانا تمشى بالبركة وبتساهيل ال البيت"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031181042/http://www.20at.com:80/masr/t7kyk/13815-2009-10-25-13-41-54.html"

[[comments]]
order = 3
subject = ""
author = "االبقرة والا الجاموس"
posted = "2009-10-25"
text = "فعلا السبب هى الجاموسة اللى قاعدة على الكرسى<br />ولو الجاموسة عندها زرة كرامة كانت استقالت وتركت المواصلات والقطارات لبتوع القطارات<br />لو الجاموسة اللى ماسكة وزارة المواصلات بتفهم كانت استقالت<br />احنا غلبنا بين الجاموسة والبقرة<br />رجل اعمال بتاع استيراد سيارات اية علاقتة بالقطارات"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031181042/http://www.20at.com:80/masr/t7kyk/13815-2009-10-25-13-41-54.html"

