text = "هذا الملف سخيف جداً<br />وكل موضوع دخلته وجدت أنه يتحدث بظلم عن الأب<br />فأين الإنصاف الذي تتحدثون عنه !!!<br />كنت متابع لموقع عشرينات وأخشى أن تستمر هذه الهفوات ونبحث عن مواقع أخرى نقرأ فيها<br />فكونوا كما عرفناكم"
