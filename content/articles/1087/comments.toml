[[comments]]
order = 26
subject = "قصيده لهاشم الرفاعى"
author = "نمنم"
posted = "2006-06-08"
text = "كتب هاشم الرفاعى قصيده ضد عبد الناصر بيقول فيها:<br />قومى علام تهللون علاما؟ ولمن نصبتم<br />هذه الاعلام<br />ولاى عيد قد اقمتم موكبا أبصرت فيه حرارة وزحاما<br />هل صار وادى النيل حرا بعدان عرف الحياة تعسفا وظلاما<br />هل عاد دستور البلاد يظلها من بعدان الاسى اعواما؟<br />هل قام من بعد التجبر نائب فى البرلمان يحاسب الحكاما؟<br />قد خلت فى دق البشائر انهم نزعوا القيود وحرروا الاقلاما<br />وظننت ان هتاف من هتفوا على انقاض سجن فارقوه حطاما<br />بشرتمونى بالخلاص...ومن يذق مر الحقيقة يألف الاحلاما<br />ياأمة منيت بأفدح نكبة زادت شقى حياتها آلاما<br />من ذلك الصنديد رددت اسمه هذى الالوف وقلدته وساما؟<br />اوليس من فاق الطغاة ضراوة وأحل من حر الدماء حراما<br />أوليس من صب البلاء مضاعفا وأثار للرعب البغيض قتاماأوليس منكر كل حق حوله ولو استطاع لانكر الاسلاما؟<br />قد كان أولى بالبلاد لو أنها منحزنهاخفضت لذاك الهاما<br />هل عاد من باندونج ياقومى سوى من سامنا الاذلال والايلاما<br />قد راح يعلن فى المجامع رايه ويخط للسام المضاع نظاما<br />ويصيح من فوق المنابر صيحة لم تعد يوما ان تكون كلاما<br />أيريد امن الناس من فى ارضه ماشاء عدلا او اقام سلاما<br />عجبا لتلك صفاقة بقيودنا...علم الجميع ولم يزل يتعامى<br />الكل يعرف ما بنا...فالى متى يخفون وجها فى الرمال ..نعاما<br />\"نهرو\"رعاك اللهثائر امة أجلست فى صف الرجال غلاما<br />هونت من شأن البطولةحينما أنزلته للمخلصين مقاما<br />قد كان مؤتمرا يضم من ابتغوا لبلادهم خيرا..يضم كراما<br />فباىحق قد دعوت اليه من لم يرع للشعب الكريم ذماما<br />ما ذقت يامصر التحرر مرة أعليك قد كان العذاب لزاما؟<br />النيل يشكو..والقلوب مراجل والشعب ممتلىء النفوس ضراما<br />والسجن يفغر فاه لاستقبالنا والسوط فوق ظهورنا أحكاما<br />هو لعنة نزلت على قومى..وما زالوا على رغم الهوان نياما<br />أعفيه من كل الملام فانه ذئب راى فى جوعه أغناما"
archived = "2006-11-02"
