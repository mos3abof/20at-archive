text = "شكلي كدا حيقول يا فكيك في السميستر دا<br />بس يلا لازززززم اغتت عليكوا يا بشر ,<br />ولازم ادوخكم كمان بصوا روحوا في \" صداع<br />القهوه والمحمول , الشكولاته \" حتلاقوا<br />تعليقي وربع جنيه \" مصحح\"."
