subject = "قصيدة لشاعر مجهول"
author = "عصرية:"
posted = "2006-03-19"
text = "في هذا الزمان<br />يصير الكذب ....تجارة<br />و الحساس.......دعارة<br />و المدفع في يد الطفلة ...دمية<br />و الدم يجري بين الكفين...طهارة<br />قد أصحو يوما من غيبوبة<br />فأراني فأرا في مختبر أو انبوبة<br />فالأحياء حقول تجارب<br />و أمام عيون التاريخ......حجارة<br />قصيدة لشاعر مجهول لكن من كتر ما عجبتني حفظتها"
