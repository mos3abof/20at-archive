subject = "بلقيس .."
author = "واحد تاني"
posted = "2006-03-22"
text = "شوفوا هنا ازاى مزج بين حزنه والمه لفراقها وسخطه وغضبه على السلطه<br />شكراً لكم ..<br />شكراً لكم..<br />فحبيبتي قتلت .. وصار بوسعكم<br />أن تشربوا كأساً على قبر الشهيدة<br />- وقصيدتي اغتيلت…وهل من أمة في الأرض ..<br />- إلا نحن - نغتال القصيدة ؟<br />بلقيس …<br />كانت أجمل الملكات في تاريخ بابل<br />بلقيس ..<br />كانت أطول النخلات في أرض العراق<br />كانت إذا تمشي .. ترافقها طواويس .. وتتبعها أيائل ..<br />بلقيس .. يا وجعي .. ويا وجع القصيدة حين تلمسها الأنامل<br />هل يا ترى .. من بعد شعرك سوف ترتفع السنابل ؟<br />يا نينوى الخضراء .. يا غجريتي الشقراء .. يا أمواج دجلة ..<br />تلبس في الربيع بساقها أحلى الخلاخل ..<br />قتلوك يا بلقيس ..<br />أية أمة عربية .. تلك التي<br />تغتال أصوات البلابل ؟<br />أين السموأل ؟والمهلهل ؟والغطاريف الأوائل ؟<br />فقبائل أكلت قبائل .. وثعالب قتلت ثعالب .. وعناكب قتلت عناكب ..<br />قسماً بعينيك اللتين إليهما .. تأوي ملايين الكواكب ..<br />سأقول ، يا قمري ، عن العرب العجائب<br />فهل البطولة كذبة عربية ؟<br />أم مثلنا التاريخ كاذب ؟<br />بلقيس<br />لا تتغيبي عني…فإن الشمس بعدك لا تضيئ على السواحل ..<br />سأقول في التحقيق :<br />إن اللص أصبح يرتدي ثوب المقاتل<br />سأقول في التحقيق :<br />إن القائد الموهوب أصبح كالمقاول ..<br />وأقول :<br />إن حكاية الإشعاع ، أسخف نكتة قيلت ..<br />فنحن قبيلة بين القبائل<br />هذا هو التاريخ .. يا بلقيس ..<br />كيف يفرق الإنسان ..<br />ما بين الحدائق والمزابل<br />بلقيس .. أيتها الشهيدة .. والقصيدة ..<br />والمعطرة النقية ..<br />سبأ تفتش عن مليكتها …فردي للجماهير التحية ..<br />يا أعظم الملكات ..<br />يا امرأة تجسد كل أمجاد العصور السومرية<br />بلقيس ..<br />يا عصفورتي الأحلى .. ويا أيقونتي الأغلى<br />ويا دمعاً تناثر فوق خد المجدلية<br />أترى ظلمتك إذ نقلتك<br />ذات يوم .. من ضفاف الأعظمية<br />بيروت .. تقتل كل يوم واحد منا .. وتبحث كل يوم عن ضحية<br />والموت .. في فنجان قهوتنا . وفي مفتاح شقتنا . وفي أزهار شرفتنا ..<br />وفي أوراق الجرائد .. والحروف الأبجدية …<br />هانحن .. يا بلقيس .. ندخل مرة أخرى لعصر الجاهلية ..<br />هانحن ندخل في التوحش .. والتخلف .. والبشاعة .. والوضاعة ..<br />ندخل مرة أخرى .. عصور البربرية ..<br />حيث الكتابة رحلة .. بين الشظية .. والشظية<br />حيث اغتيال فراشة في حقلها .. صار القضية ..<br />هل تعرفون حبيبتي بلقيس ؟<br />فهي أهم ما كتبوه في كتب الغرام<br />كانت مزيجا رائعاًبين القطيفة والرخام ..<br />كان البنفسج بين أعينها .. ينام ولا ينام ..<br />بلقيس .. يا عطراً بذاكرتي .. ويا قبراً يسافر في الغمام ..<br />قتلوك ، في بيروت ، مثل أي غزالة<br />من بعدما .. قتلوا الكلام ..<br />بلقيس<br />ليست هذه مرثية<br />لكن ..<br />على العرب السلام<br />بلقيس ..<br />مشتاقون .. مشتاقون .. مشتاقون ..<br />والبيت الصغير ..<br />يسأل عن أميرته المعطرة الذيول<br />نصغي إلى الأخبار .. والأخبار غامضة<br />ولا تروي فضول ..<br />بلقيس ..<br />مذبوحون حتى العظم ..<br />والأولاد لا يدرون ما يجري ..<br />ولا أدري أنا ماذا أقول ؟<br />هل تقرعين الباب بعد دقائق ؟<br />هل تخلعين المعطف الشتوي ؟<br />هل تأتين باسمة ..<br />وناضرة ..<br />ومشرقة كأزهار الحقول ؟<br />بلقيس ..<br />إن زروعك الخضراء ..<br />مازالت على الحيطان باكية ..<br />ووجهك لم يزل متنقلاً ..<br />بين المرايا والستائر<br />حتى سجارتك التي أشعلتها ..<br />لم تنطفئ ..<br />ودخانها<br />مازال يرفض أن يسافر<br />بلقيس ..<br />مطعونون .. مطعونون في الأعماق ..<br />والأحداق يسكنها الذهول<br />بلقيس ..<br />كيف أخذت أيامي .. وأحلامي ..<br />وألغيت الحدائق والفصول ..<br />يا زوجتي ..<br />وحبيبتي .. وقصيدتي .. وضياء عيني ..<br />قد كنت عصفوري الجميل ..<br />فكيف هربت يا بلقيس مني ؟..<br />بلقيس ..<br />هذا موعد الشاي العراقي المعطر ..<br />والمعتق كالسلافة ..<br />فمن الذي سيوزع الأقداح .. أيتها الزرافة ؟<br />زمن الذي نقل الفرات لبيتنا ..<br />وورود دجلة والرصافة ؟<br />بلقيس ..<br />إن الحزن يثقبني ..<br />وبيروت التي قتلتك .. لا تدري جريمتها<br />وبيروت التي عشقتك ..<br />تجهل أنها قتلت عشيقتها ..<br />وأطفأت القمر ..<br />بلقيس ..<br />يا بلقيس ..<br />يا بلقيس<br />كل غمامة تبكي عليك ..<br />فمن ترى يبكي عليا ..<br />بلقيس .. كيف رحلت صامتة<br />ولم تضعي يديك .. على يديا ؟<br />بلقيس ..<br />كيف تركتنا في الريح ..<br />نرجف مثل أوراق الشجر ؟<br />وتركتنا - نحن الثلاثة- ضائعين<br />كريشة تحت المطر ..<br />أتراك ما فكرت بي ؟<br />وأنا الذي يحتاج حبك .. مثل (زينب)أو (عمر)<br />بلقيس ..<br />يا كنزاً خرافياً ..<br />ويا رمحاً عراقياً ..<br />وغابة خيزران ..<br />يا من تحديت النجوم ترفعاً ..<br />من أين جئت بكل هذا العنفوان ؟..<br />بلقيس ..<br />تذبحني التفاصيل الصغيرة في علا قتنا ..<br />وتجلدني الدقائق والثواني ..<br />فلكل دبوس صغير .. قصة<br />ولكل عقد من عقودك قصتان<br />حتى ملاقط شعرك الذهبي ..<br />تغمرني كعادتها ، بأمطار المنان<br />ويعرش الصوت العراقي الجميل ..<br />على الستائر ..<br />والمقاعد ..<br />والأواني ..<br />ومن المرايا تطلعين ..<br />من الخواتم تطلعين ..<br />من القصيدة تطلعين ..<br />من الشموع ..<br />من الكؤوس ..<br />من النبيذ الأرجواني ..<br />بلقيس ..<br />يا بلقيس ..<br />لو تدرين ما وجع المكان ..<br />في كل ركن .. أنت حائمة كعصفور ..<br />وعابقة كغابة بيلسان ..<br />فهناك .. كنت تدخنين ..<br />هناك .. كنت تطالعين ..<br />هناك .. كنت كنخلة تتمشطين ..<br />وتدخلين على الضيوف ..<br />كأنك السيف اليماني ..<br />بلقيس ..<br />أين زجاجة ( الغيلان ) ؟.<br />والولاعة الزرقاء ..<br />أين سجارة الـ (الكنت ) التي<br />ما فارقت شفتيك ؟<br />أين (الهاشمي ) مغنياً ..<br />فوق القوام المهرجان ..<br />تتذكر الأمشاط ماضيها ..<br />فيكرج دمعها ..<br />هل يا ترى الأمشاط من أشواقها أيضاً تعاني ؟<br />بلقيس : صعب أن أهاجر من دمي ..<br />وأنا المحاصر بين ألسنة اللهيب ..<br />وبين ألسنه الدخان …<br />بلقيس : أيتها الأميرة<br />هاأنت تحترقين .. في حرب العشيرة والعشيرة<br />ماذا سأكتب عن رحيل مليكتي ؟<br />إن الكلام فضيحتي ..<br />هانحن نبحث بين أكوام الضحايا ..<br />عن نجمة سقطت ..<br />وعن جسد تناثر كالمرايا ..<br />هانحن نسأل يا حبيبة ..<br />إن كان هذا القبر قبرك أنت ..<br />أم قبر العروبة ..<br />بلقيس :<br />يا صفصافة أرحت ضفائرها عليّ ..<br />ويا زرافة كبرياء ..<br />بلقيس :<br />إن قضاءنا العربي أن يغتالنا عرب ..<br />ويأكل لحمنا عرب ..<br />ويفتح قبرنا عرب ..<br />فكيف نفر من هذا القضاء ؟..<br />فالخنجر العربي .. ليس يقيم فرقاً<br />بين أعناق الرجال ..<br />وبين أعناق النساء ..<br />بلقيس :<br />إن هم فجروك .. فعندنا<br />كل الجنائز تبتدي في كربلاء ..<br />وتنتهي في كربلاء ..<br />لن أقرء التاريخ بعد اليوم ..<br />إن أصابعي اشتعلت ..<br />وأثوابي تغطيها الدماء ..<br />هانحن ندخل عصرنا الحجري ..<br />نرجع كل يوم ، ألف عام للوراء …<br />البحر في بيروت ..<br />بعد رحيل عينيك استقال ..<br />والشعر .. يسأل عن قصيدته<br />التي لم تكتمل كلماتها ..<br />ولا أحد .. يجيب على السؤال<br />الحزن يا بلقيس ..<br />يعصر مهجتي كالبرتقال ..<br />الآن .. أعرف مأزق الكلمات<br />أعرف ورطة اللغة المحالة ..<br />وأنا الذي اخترع الرسائل ..<br />لست أدري .. كيف أبتدئ الرسالة ..<br />السيف يدخل لحم خاصرتي<br />وخاصرة العبارة ..<br />كل الحضارة ، أنت يا بلقيس ، والأنثى حضارة<br />بلقيس : أنت بشارتي الكبرى ..<br />فمن سرق البشارة ؟<br />أنت الكتابة قبلما كانت كتابة ..<br />أنت الجزيرة والمنارة ..<br />بلقيس :<br />يا قمري الذي طمروه ما بين الحجارة ..<br />الآن ترتفع الستارة ..<br />الآن ترتفع الستارة ..<br />سأقول في التحقيق ..<br />إني أعرف الأسماء .. والأشياء .. والسجناء<br />والشهداء .. والفقراء .. والمستضعفين ..<br />وأقول إني أعرف السياف قاتل زوجتي ..<br />ووجوه كل المخبرين ..<br />وأقول : إن عفافنا عهر ..<br />وتقوانا قذارة ..<br />وأقول : إن نضالنا كذب<br />وأن لا فرق ..<br />ما بين السياسة والدعارة !!<br />سأقول في التحقيق :<br />إني قد عرفت القاتلين<br />وأقول :<br />إن زماننا العربي مختص بذبح الياسمين<br />وبقتل كل الأنبياء ..<br />وقتل كل المرسلين ..<br />حتى العيون الخضر ..<br />يأكلها العرب<br />حتى الضفائر .. والخواتم<br />والأساور .. والمرايا .. واللعب<br />حتى النجوم تخاف من وطني ..<br />ولا أدري السبب ..<br />حتى الطيور تفر من وطني ..<br />و لا أدري السبب ..<br />حتى الكواكب .. والمراكب .. والسحب<br />حتى الدفاتر .. والكتب ..<br />وجميع أشياء الجمال ..<br />جميعها .. ضد العرب ..<br />لما تناثر جسمك الضوئي يا بلقيس ،<br />لؤلؤة كريمة<br />فكرت : هل قتل النساء هواية عربية<br />أم أننا في الأصل ، محترفو جريمة ؟<br />بلقيس ..<br />يا فرسي الجميلة .. إنني<br />من كل تاريخي خجول<br />هذي بلاد يقتلون بها الخيول ..<br />هذي بلاد يقتلون بها الخيول ..<br />من يوم أن نحروك ..<br />يا بلقيس ..<br />يا أحلى وطن ..<br />لا يعرف الإنسان كيف يعيش في هذا الوطن ..<br />لا يعرف الإنسان كيف يموت في هذا الوطن ..<br />مازلت أدفع من دمي ..<br />أعلى جزاء<br />كي أسعد الدنيا .. ولكن السماء<br />شاءت بأن أبقى وحيداً ..<br />مثل أوراق الشتاء<br />هل يولد الشعراء من رحم الشقاء ؟<br />وهل القصيدة طعنة<br />في القلب .. ليس لها شفاء ؟<br />أم أنني وحدي الذي<br />عيناه تختصران تاريخ البكاء ؟<br />سأقول في التحقيق :<br />كيف غزالتي ماتت بسيف أبي لهب<br />كل اللصوص من الخليج إلى المحيط ..<br />يدمرون .. ويحرقون ..<br />وينهبون .. ويرتشون ..<br />ويعتدون على النساء ..<br />كما يريد أبو لهب ..<br />كل الكلاب موظفون ..<br />ويأكلون ..<br />ويسكرون ..<br />على حساب أبي لهب ..<br />لا قمحة في الأرض ..<br />تنبت دون رأي أبي لهب<br />لا طفل يولد عندنا<br />إلا وزارت أمه يوماً ..<br />فراش أبي لهب !!..<br />لا سجن يفتح ..<br />دون رأي أبي لهب ..<br />لا رأس يقطع<br />دون أمر أبي لهب ..<br />سأقول في التحقيق :<br />كيف أميرتي اغتصبت<br />وكيف تقاسموا فيروز عينيها<br />وخاتم عرسها ..<br />وأقول كيف تقاسموا الشعر الذي<br />يجري كأنهار الذهب ..<br />سأقول في التحقيق :<br />كيف سطوا على آيات مصحفها الشريف<br />وأضرموا فيه اللهب ..<br />سأقول كيف استنزفوا دمها ..<br />وكيف استملكوا فمها ..<br />فما تركوا به ورداً .. ولا تركوا عنب<br />هل موت بلقيس ..<br />هو النصر الوحيد<br />بكل تاريخ العرب ؟..<br />بلقيس ..<br />يا معشوقتي حتى الثمالة ..<br />الأنبياء الكاذبون ..<br />يقرفصون ..<br />ويكذبون على الشعوب<br />ولا رسالة ..<br />لو أنهم حملوا إلينا ..<br />من فلسطين الحزينة ..<br />نجمة ..<br />أو برتقالة ..<br />لو أنهم حملوا إلينا<br />من شواطئ غزة<br />حجراً صغيراً<br />أو محارة ..<br />لو أنهم من ربع قرن حرروا ..<br />زيتونه ..<br />أو أرجعوا ليمونة<br />ومحوا عن التاريخ عاره<br />لشكرت من قتلوك .. يا بلقيس ..<br />يا معبودتي حتى الثمالة ..<br />لكنهم .. تركوا فلسطيناً<br />ليغتالوا غزالة !!..<br />ماذا يقول الشعر يا بلقيس ..<br />في هذا الزمان ؟<br />ماذا يقول الشعر ؟<br />في العصر الشعوبي ..<br />المجوسي ..<br />الجبان ..<br />والعالم العربي ..<br />مسحوق .. ومقموع ..<br />ومقطوع اللسان ..<br />نحن الجريمة في تفوقها<br />فما ( العقد الفريد ) .. وما ( الأغاني ) ؟؟<br />أخذوك أيتها الحبيبة من يدي ..<br />أخذوا القصيدة من فمي ..<br />أخذوا الكتابة .. والقراءة ..<br />والطفولة .. والأماني<br />بلقيس .. يا بلقيس ..<br />يا دمعاً ينقط فوق أهداب الكمان ..<br />علمت مت قتلوك أسرار الهوى<br />لكنهم .. قبل انتهاء الشوط<br />قد قتلوا حصاني<br />بلقيس :<br />أسألك السماح ، فربما<br />كانت حياتك فدية لحياتي ..<br />إني لأعرف جيداً<br />أن الذين تورطوا في القتل ، كان مرادهم<br />أن يقتلوا كلماتي !!!<br />نامي بحفظ الله .. أيتها الجميلة<br />فالشعر بعدك مستحيل ..<br />والأنوثة مستحيلة<br />ستظل أجيال من الأطفال ..<br />تسأل عن ضفائرك الطويلة ..<br />وتظل أجيال من العشاق<br />تقرأ عنك .. أيتها المعلمة الأصيلة ..<br />وسيعرف الأعراب يوماً..<br />أنهم قتلوا الرسولة ..<br />قتلوا الرسولة ..<br />ق .. ت .. ل .. و .. ا<br />ال .. ر .. س .. و .. ل .. ه<br />بيروت 15 / 12 / 1981م<br />نزار قباني"
