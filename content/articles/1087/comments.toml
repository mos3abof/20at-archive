order = 0
subject = "و هاشم الرفاعى"
author = "نيفين"
posted = "2006-03-16"
text = "و هاشم الرفاعى يا جماعه اللى كتب<br />ابتاه ماذا قد يخط بنانى ..والحبل و الجلاد منتظران<br />هذا الكتاب اليك من زنزانه..مقروره صخويه الجدران<br />ز نزار مش هنتكلم عنه..نزار اللى كتب القدس و رساله جندى فى جبهه السويس و اللى كتب جميله بو حيرد و اللى قال ف اخر قصيده بلقيس<br />بلقيس ليست هذه مرثيه<br />لكن<br />على العرب السلام<br />اما محمود درويش مين ميرفعلوش القبعه هو و السياب و امل دنقل<br />الموضوع دا كبير يا جماعه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132013/http://www.20at.com/article2.php?sid=582"

