subject = "فعلا يا اكرم"
author = "نيفين..نيفى..نوفا"
posted = "2006-03-23"
text = "فعلا لو كان الراجل دا عاش كان يمكن يبقى زى شوقى كمان<br />تعرف الراجل دا بينطبق عليه البيت بتاع ابراهيم ناجى(كم من زهره عوقبت ..لم تدر يوما زنبها).<br />و بالنسبه لنجيب سرور هتخلينى ابدا اقرأله تانى يا اكرم<br />و الناس اللى فوق دول حرام عليكو فصيده الرفاعى و بلقيس ورا بعض كدا<br />عملتوها و خليتونى اعيط<br />شكراااااااااا للى بعت قصيده الرفاعى<br />رحمتنى من التدوير عليها..و معلش اى حد عنده حاجه للرفاعى يا ريت ميترددش ف نشرها"
