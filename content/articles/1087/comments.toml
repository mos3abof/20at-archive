[[comments]]
order = 5
subject = "أحضِر سلّة ..."
author = "aroundu_4"
posted = "2006-03-17"
text = "الســـــــــاعة<br />الساعة<br />دائرة ضيقة<br />وهاربُ مُدان<br />أمامهُ وخلفهُ يركضُ<br />مخبران<br />هذا هو الزمان<br />لِبان<br />ماذا نملِكُ<br />من لحظات العُمر المضحِك؟<br />ماذا نملِك ؟<br />العمرُ لبان في حلق الساعة<br />والساعة غانية تعلك<br />تِك..........تِك<br />تك........تِك<br />تِك<br />تِك...!<br />دَرسّ<br />ساعة الرمل ِبلاد<br />لاتُحب الإستلاب.<br />كلما أفرغها الوقتَ من الروحِ<br />إستعادت روحهَا<br />.......بالإنقلاب !<br />أحضِر سلّة ...<br />ضع فيها أربع تسعات...ضع صُحُفاً مُنحلّة<br />ضع بوقاً...ضع مذياعاً...ضع طبلة<br />ضع سِكّيناً...ضع حبلاً...ضع شمعاً أحمر<br />ضع قـفلاً وتذكر قفله<br />ضع كلـباً يعقِرُ بالجُملة...يسبقُ ظِله<br />يلمحُ حتى اللا أشياء...ويسمعُ حتى ضحِك النملة<br />واخلُط هذا كُله<br />وتأكد من غلق السلة<br />ثُم اسحب كُرسياً واقعُد<br />فلقد صارت عِندك دولة...!!!!<br />شعر / أحمد مطر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132013/http://www.20at.com/article2.php?sid=582"

[[comments]]
order = 6
subject = "حبة حلوين"
author = "Dabdoob"
posted = "2006-03-17"
text = "نيفين لماذا ركزت علي هاشم الرفاعي؟؟ارجو التوضيح<br />اما بالنسبة لنجيب سرور فانه ليس من الشعراء المفضلين لي خاصة وان له ديوان مشهور سماه باسم لا يقال (لفظ بذئ)<br />اخيرا فان هناك عشرات الشعراء الموهوبين بحق والممتعين امثال محمود درويش ونزار قباني وحبيب قلبي امل دنقل واحمد مطر و احمد عبد المعطي حجازي وكثيرون اخرون من هذا الجيل الذهبي في الشعر المصري جيل الستينات<br />اما الان فان الشعر اندثر تقريبا ولا يقراه الا كتابه للاسف ولكنني اذكر شاعرين معاصرين احبهما جمال الشاعر واحمد غراب<br />واختم بهذه السطور الشعرية :<br />زمن الموت لا ينتهي يا ابنتي الثاكلة<br />وانا لست اول من نبأ الناس عن زمن الزلزلة<br />وانالست اول من قال في السوق<br />ان الحمامة - في العش - تحتضن القنبلة !<br />قبليني,.... لانقل سري الي شفتيك<br />لانقل شوقي الوحيد<br />لك....للسنبلة<br />للزهور التي تتبرعم في السنة المقبلة<br />قبليني ولا تدمعي<br />سحب الدمع تحجبني عن عيونك<br />في هذه اللحظة المثقلة<br />كثرت بيننا الستر الفاصلة<br />لا تضيفي اليها ستارا جديدا<br />من قصيدة سفر لالف دال للشاعر العظيم امل دنقل<br />ولنزار قباني انشر هذه الفقرة المعبرة عن واقعنا والتي اعتبرها عنوانا لافكاري وحياتي:<br />رحلت جنوبا....رحلت شمالا<br />ولا فائده!!!<br />فقهوة كل المقاهي لها....<br />نكهة واحده<br />ونكتفي بهذا القدر<br />والسلام عليكم ورحمة الله وبركاته<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132013/http://www.20at.com/article2.php?sid=582"

