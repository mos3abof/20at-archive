text = "شكرايا مصرى على موقع مطر<br />اه حصل اخيرا رفعو الحصانه عن بسلامته<br />اللى شاف القاهره اليةم امبارح كان حس بال..... و لا بلاش<br />البيه ابن ممدوح اسماعيل لسه بيقول عللى حصل قضاء وقدر<br />هى الناس دى بتستهبل و لا فاكرينا ايه<br />الادهى من دا كله ان الساده ضيوف البرنامج اكدو ليا و لعمرو اديب و لكل الناس اللى مستنيه القصاص ان القانون البحرى لن يدين مالكى العباره و افصى حاجه انهم يدفعو التعويضات و كان الله بالسر عليم<br />و الادهى ان ممكن شركات الاتامين هى اللى تدفع<br />علشان كده عمرو قال انصح كل من يريد مجال بيزنز ناجح بمخال النقل البحرى<br />و كل كارثه و انتم بخير"
archived = "2006-11-02"
