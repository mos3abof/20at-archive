text = "أبتاه ماذا قد يخط بنانى و الحبل و الجلاد ينتظران<br />هذا كتاب اليك من زنزانة مقرورة صخرية الجدران<br />لم تبق الا ليلة احيا بها واحس ان ظلامها اكفانى<br />ستمر يا ابتاه لست اشك فى هذا وتحمل بعدها جثمانى<br />الليل من حولى هدوء قاتل والذكريات تمور فى وجدانى<br />ويهدنى المى فانشد راحتى فى بضع ايات من القران<br />والنفس بين جوانحى شفافة دب الخشوع بها فهز كيانى<br />قد عشت أومن بالاله ولم اذق الا اخيرا لذة الايمان<br />شكرا لهم انا لا اريد طعامهم فليرفعوه فلست بالجوعان<br />هذا الطعام المر ما صنعته لى امى ولا وضعوه فوق خوان<br />كلا ولم يشهده يا ابتى معى اخوان لى جاءاه يستبقان<br />مدوا الى به يدا مصبوغة بدمى وهذه غاية الاحسان<br />والصمت يقطعه رنين سلاسل عبثت بهن اصابع السجان<br />ما بين اونة تمر واختها يرنو الى بمقلتى شيـــطان<br />من كوة بالباب يرقب صيده ويعود فى امن الى الدوران<br />انا لا احس باى حقد نحوه ماذا جناه فتمسه اضغانى<br />هو طيب الاخلاق مثلك يابى لم يبد فى ظمأ الى العدوان<br />لكن إن نام عنى لحظة ذاق العيال مــرارة الحرمان<br />فلربما وهو المروع سحنة لو كان مثلى شاعرا لرثانى<br />أو عاد من يدرى الى اولاده وذكرَ صورتى لبكانى<br />وعلى الجدار الصلب نافذة بها معنى الحياة غليظة القضبان<br />قد طالما شارفتها متأملا فى السائرين على الأسى اليقظان<br />فأرى وجوما كالضباب مصورا ما فى قلوب الناس من غليان<br />نفس الشعور لدى الجميع وإن كتموا وكان الموت فى إعلانى<br />ويدور همس فى الجوانح ما الذى فى الثورة الحمقاء قد أغراني<br />أو لم يكن خيرا لنفسى ان أرى مثل الجموع أسير فى إذعان<br />ما ضرنى لو قد سكت وكلما غلب الأسى بالغت فى الكتمان<br />هذا دمى سيسيل مطفئا ما ثار فى جنْبَىَّّ من نيران<br />وفؤادى الموار فى نبضاته سيكف من غده عن الخفقان<br />والظلم باق لن يحطم قيده موتى ولن يودى به قربان<br />ويسير ركب البغى ليس يضيره شاة اذا اجتثت من القطعان<br />هذا حديث النفس حين تشف عن بشريتى وتمور بعد ثوان<br />وتقول لى إن الحياة لغاية أسمى من التصفيق للطغيان<br />انفاسك الحرى وان هى أخمدت ستظل تغمر افقهم بدخان<br />وقروح جسمك وهو تحت سياطهم قسمات صبح يتقيه الجانى<br />دمع السجين هناك فى أغلاله ودم الشهيد هنا سيلتقيان<br />حتى اذا ما أفعمت بهما الربا لم يبق غير تمرد الفيضان<br />ومن العواصف ما يكون هبوبها بعد الهدوء وراحة الربان<br />إن احتدام النار في وجهه أمر يثير حفيظة البركان<br />وتتابع القطرات ينزل بعده سيل يليه تدفق الطوفان<br />فيموج يقتلع الطغاة مزمجرا اقوى من الجبروت والسلطان<br />أنا لست ادرى هل ستذكر قصتى ام سوف يعدوها رحى النسيان<br />او أننى سأكون فى تاريخنا متآمرا أم هادم الاوثان<br />كل الذى ادريه ان تجرعى كأس المذلة ليس فى إمكانى<br />لو لم أكن فى ثورتى متطلبا غير الضياء لامتى لكفانى<br />اهوى الحياة كريمة لا قيد لا إرهاب لا إستخفاف بالإنسان<br />فاذا سقطت سقطت أحمل عزتى يغلى دم الاحرار فى شريانى<br />أبتاه إن طلع الصباح وأضاء نور الشمس كل مكان<br />واستقبل العصفور بين غصونه يوما جديدا مشرق الألوان<br />وسمعت أنغام التفاؤل ثرة تجرى على فم بائع الالبان<br />واتى يدق- كما تعود- بابنا سيدق باب السجن جلادان<br />واكون بعد هنيهة متأرجحا فى الحبل مشدودا الى العيدان<br />ليكن عزاؤك ان هذا الحبل ما صنعته فى هذى الربوع يدان<br />نسجوه فى بلد يشع حضارة وتضاء منه مشاعل العرفان<br />او هكذا زعموا وجىء به الى بلدى الجريح على يد الاعوان<br />أنا لا اريدك ان تعيش محطما فى زحمة الألام والاشجان<br />إن ابنك المصفود فى أغلاله قد سيق نحو الموت غير مدان<br />فاذكر حكايات بأيام الصبا قد قلتها لى عن هوى الأوطان<br />وإذا سمعت نشيج امى فى الدجى تبكى شبابا ضاع فى الريعان<br />وتكتم الحسرات فى أعماقها ألما تواريه عن الجيران<br />فاطلب اليها الصفح عنى اننى لا ابتغى منها سوى الغفران<br />مازال فى سمعى رنين حديثها ومقالها فى رحمة وحنان<br />أبنى إنى قد غدوت عليلة لم يبق لى جلد على الأحزان<br />فأذق فؤادى فرحة بالبحث عن بنت الحلال ودعك من عصيان<br />كانت لها أمنية ريانة يا حسن أمال لها وأمان<br />غزلت خيوط السعد مخضلا ولم يكن إنتفاض الغزل فى الحسبان<br />والان لا ادرى باى جوانح ستبيت بعدى أم باى جنان<br />هذا الذى سطرته لك يا أبى بعض الذى يجرى بفكر عان<br />لكن إذا إنتصر الضياء ومفزقت بيد الجموع شريعة القرصان<br />فلسوف يذكرنى ويفكبر همتى من كان فى بلدى حليف هوان"
