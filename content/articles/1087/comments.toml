[[comments]]
order = 11
subject = "كلام جميل كلام معقول"
author = "عابر القارات"
posted = "2006-03-18"
text = "السلام عليكم و الرحمة<br />أنا قريت الابيات دى من الشعر و عجابتنى قوى و حبيت تشاركونى فى الاستمتاع بيها لكن للاسف مش عارف مين اللى كتبها ... لو حد يعرف يبقى يقولى و السلام<br />ماذا تبقى من بلاد الأنبياء<br />خمسون عاماً<br />والحناجر تملأ الدنيا ضجيجاً<br />ثم تبتلع الهواء..<br />خمسون عاماً<br />والفوارس تحت أقدام الخيول<br />تئن في كمد.. وتصرخ في استياء<br />خمسون عاماً في المزاد<br />وكل جلاد يحدق في الغنيمة<br />ثم ينهب ما يشاء<br />خمسون عاماً<br />والزمان يدور في سأم بنا<br />فإذا تعثرت الخطى<br />عدنا نهرول كالقطيع إلى الوراء..<br />خمسون عاماً<br />نشرب الأنخاب من زمن الهزائم<br />نغرق الدنيا دموعاً بالتعازي والرثاء<br />حتى السماء الآن تغلق بابها<br />سئمت دعاء العاجزين وهل تُرى<br />يجدي مع السفه الدعاء.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132013/http://www.20at.com/article2.php?sid=582"

[[comments]]
order = 12
subject = "كل الذي اكتبه في هذه الورقه صادرته العسس"
author = "كرميلينو"
posted = "2006-03-18"
text = "نجيب سرور هو مخرج مسرحي و شاعر عاميه مصريه و لكنه اضطهد من الثورة و الحكومة منعوا ابنه من دخول مصر عذبوه و ادخلوه مستشفى الامراض العقليه<br />اكثر المواقف التعذيبية التي تعرض لها هذا الشخص انه لم يذق الماء لمده اسبوع كامل ثم اطلقوا سراحه في ساحة المعتقل فوجد دلو مملوء فحمله على رقبته و شرب<br />عارفين الجردل ( الدلو ) طلع فيه ايه ؟؟؟<br />طلع فيه جاز ابيض<br />اما عن تهكمه عن الاسلام فان ده كان في مرحلة من حياته لانه كغيره من المثقفين كان بيؤمن بالشيوعية زي كتير من جيله<br />و هو في رأيي رقم واحد في قايمة ادباء لم يركعوا للسلطه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132013/http://www.20at.com/article2.php?sid=582"

[[comments]]
order = 13
subject = "لماذا هاشم الرفاعى"
author = "نيفين"
posted = "2006-03-18"
text = "بص يا دبدوب الراجل ده حكايته حكايه و لان الموضوع بعنوان منشور ضد السلطه فهاشم الرفاعى دا شاعر ولد و مات شابا فى ظروف غامضه(حط تحت غامضه دى مليون خط)و كان ده فى عصر المفترى عليه و المفترى علينا عبد الناصر(وهنا تقدر تشيل المليون خط)<br />انا مش عايزه اقول ان الراجل دا لو كان عاش كان ممكن يبقى اعظم شاعر معاصر<br />و بجد الفصيده تحفه هدور عليها و هكتبهاللك يا دبدوب و لكل عشرينات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132013/http://www.20at.com/article2.php?sid=582"

[[comments]]
order = 14
subject = "مش معاك يا اكرم..و دبدوب ممكن خدمه"
author = "نيفين اكشن تانى مره"
posted = "2006-03-18"
text = "اولا هو نجيب سرور مسلم<br />صدقنى انا جالى كتب للراجل دا بس مقريتهاش و بجد خايفه اظلمه بس انا شعره ماثرش ف مخيلتى كمان انا سمعت انه تهكم على الاسلام<br />اكرم لو عندك حاجه ليه نزلها<br />دبدوب لو عندك حاجه لاحمد غراب يا ريت تنزلها و سؤال هو احمد غراب اللى قال عودى لحجمك فانت دون اصابعى طولا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132013/http://www.20at.com/article2.php?sid=582"

[[comments]]
order = 15
subject = "جميله بو حيرد"
author = "حلوه اوى مشاركتك يا AROUND 4 كمان عبد الله حلوه اوى بس خف عن نزار قبانى و عشان تحب نزار و علشان اكرم و هبه هقول:"
posted = "2006-03-18"
text = "الاسم جميله بو حيرد<br />رقم الزنزانه تسعونا<br />السجن الحربى بوهران<br />و العمر اثنان و عشرونا<br />عينان كقنديلى معبد<br />و الشعر العربى الاسود<br />كالصيف كشلال الحزان<br />ابريق للماء و سجان<br />و يد تنضم على القران<br />و امراه فى ضوء الصبح<br />تسترجع فى مثل البوح<br />ايات محزنه الارنان<br />من سوره مريم و الفتح<br />اضواء الباستيل قليله<br />و سعال امراه مسلوله اكلت من نهديها الاغلال<br />اكل الانذال<br />لاكوست و الاف الانزال<br />من جيش فرنسا المغلوبه<br />انتصروا الان على انثى كالشمعه مصلوبه<br />القيد يعض على القدمين<br />و سجائر تطفأ فى النهدين<br />و دم فى الانف و فى الشفتين<br />و جروح جميله بو حيرد<br />هى و التحرير على موعد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132013/http://www.20at.com/article2.php?sid=582"

[[comments]]
order = 16
subject = "بقيه جميله بو حيرد"
author = "نيفين"
posted = "2006-03-18"
text = "نسيت اقول اسمى فى المره الاولى<br />نكمل:<br />مقصله تنصب و الاشرار<br />يلهون بانثى دون ازار<br />و جميله بين بنادقهم<br />عصفور فى وسط الامطار<br />الجسد الخمرى الاسود<br />تنفضه لمسات التيار<br />الاسم جميله بو حيرد<br />تاريخ ترويه بلادى<br />تاريخ امراه من وطنى<br />جلدت مقصله الجلاد<br />امراه دوخت الشمسا<br />حرقت ابعاد الابعاد<br />ما اصغر جان دارك فرنسا<br />فى جانب جان دارك بلادى<br />نزار قبانى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132013/http://www.20at.com/article2.php?sid=582"

