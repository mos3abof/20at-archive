text = "يعني انا بحب اصنف الشعراء وفي شعراء حتى لو اسلوبهم عجبني جدا جدا جدا مش بيقدروا انهم يحوزوا على احترامي اولهم طبعا نزار<br />وبمناسبة الشعر خدوا البيتين دول<br />ان الجراح على الفؤاد تعودت وتعود القلب الجراح فخوني"
