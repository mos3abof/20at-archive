[[comments]]
order = 9
subject = "مش هاين عليا مقلهاش"
author = "عبدالله مفتاح"
posted = "2006-03-17"
text = "الحياة وخداني معاها<br />في كل يوم رحله جديده<br />بدات حكايتي بالتحدي لكل صعب<br />وتخطي اي شيء كل محال<br />اوقات كتير كانت بتبكيني<br />لكن بعود بعديها عنيد<br />ومشيت وتهت في كل سكة وفي كل درب<br />خطوة خطوة لحد فقت ما بين جبال<br />متعتني الدنيا وغربتني<br />وهبتدي في لحظه اواجهها بقوة صبري<br />وهبتدي اشق صريقي لحلمي وهيتحقق<br />وهوصله بقلبي وبسكة المشوار<br />واديني معاها<br />وبس خلاص"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132013/http://www.20at.com/article2.php?sid=582"

[[comments]]
