[[comments]]
order = 19
subject = "آه يا بلد.. العدالة فين؟"
author = "مصري"
posted = "2006-03-19"
text = "أخيرا وبعد تمنع وتسويف طلب وزير العدل من رئيس مجلس الشورى رفع الحصانة عن مالك العبارة المنكوبة السلام 98 والتي ضربت الرقم القياسي كأكبر كارثة بحرية في العالم.<br />ولا أدري ما هي أهمية مثل هذا الإجراء الآن بعد أن خرج ممدوح إسماعيل إلى حيث يقيم في لندن وباريس، وهو ما يذكرنا بقول واحد بلدينا (سرقوا الصندوق يا محمد لكن مفتاحه في جيبي)!!<br />لقد بحت أصوات الناس في مصر وهم يطالبون الحكومة والنيابة العامة منذ أن حدثت هذه المأساة لمنع صاحب شركة السلام ومالك العبارة المنكوبة من السفر حتى تنتهي التحقيقات في هذه الكارثة وتنجلي الحقائق، وهو مطلب متواضع نظرا لخطورة القضية وثبوت إهمال وكذب الشركة المالكة باعتراف المتحدث باسم الرئاسة السفير سليمان عواد الذي قال في 8 فبراير الماضي بأن الشركة المالكة أبلغت سلطات الميناء في السابعة من صباح يوم الحادث أي بعد مرور أكثر من 6 ساعات على غرق العبارة عن فقدان الاتصال بالعبارة ثم عادوا بعد ذلك بثلث ساعة ليقرروا أن العبارة قد غرقت، رغم أنهم كانوا على علم بالمأساة منذ وقت مبكر وقبل غرق العبارة كما ثبت بعد ذلك.<br />لقد زعموا كذبا بأن العبارة لم تتصل ولم يصدر عنها نداء استغاثة فشاء الله أن يفضحهم بعد انتشال الصندوق الأسود اللذين كانوا يراهنون على ضياعه تماما حتى تطمس معالم جرائمهم فثبت من تسجيلات الصندوق الأسود كما نشرت الأهرام في 5 مارس الماضي أن القبطان حاول الاتصال مرارا بصاحب العبارة ونجح في الثانية عشر مساء أي قبل حوالي ساعة ونصف من انقلاب العبارة، وقد نشرت صحيفة الأسبوع العدد الماضي تفصيلات لكل الاتصالات التي أجراها قبطان العبارة بممدوح إسماعيل وتعليماته للقبطان التي أدت للكارثة، وبعدها فرضت الحكومة السرية على محتويات الصندوق الأسود بل وقاموا بتهريب ممدوح إسماعيل فخرج مصحوبا بالحماية من صالة كبار الزوار وهو يخرج لسانه لكل من ظن أن في هذا البلد قانونا يمكن أن ينتصف من الأقوياء الذين يتمتعون بالحماية الرئاسية والحصانة البرلمانية حتى وإن كانت أيديهم ملطخة بدماء وأرواح أكثر من ألف إنسان من ضعفاء القوم ممن تم التعامل مع مأساتهم بمنتهى الاستهانة واللامبالاة خرج ممدوح إسماعيل إلى حيث يستطيع التمتع بأمواله وثروته التي ستزداد وتنمو بفضل دماء الضحايا ومأساتهم.<br />أليس من حقنا وحق الشعب المصري بعد ذلك أن نسأل وأن نقارن بين ما حصل لأيمن نور الذي رفعت عنه الحصانة في سويعات قليلة بينما كانت فرق أمن الدولة تحاصر بيته ومكتبه بل وجرى اقتحامهما حتى قبل رفع الحصانة فعليا عنه وجرى اعتقاله فورا بأسلوب مهين أمام مجلس الشعب وكأنه من عتاة المجرمين وأخذ من فوره إلى السجن.. رغم أنه شتان بين زعمهم بأنه زور ألف ورقة لم يترتب عليها أي شيء أو ضرر أو فائدة له أو لغيره وبين من تسبب بإهماله وجشعه في قتل أكثر من ألف إنسان؟!!<br />لقد قال الرئيس أن المذنبين المتسببين في الكارثة لن يفلتوا من العقاب فلا يوجد في مصر أحد فوق القانون والمساءلة.!! ولكن الحقيقة أنهم افلتوا وهذه التصريحات ليست سوى للاستهلاك المحلي، وممدوح إسماعيل الذي خرج من مصر سيجني من الكارثة المزيد من الأرباح في صورة تعويضات ستدفعها شركة التأمين لن ينفق منها إلا القليل على الضحايا لأن دم المصري ليس له ثمن في بلده.<br />وبعدها سمعنا تبريرات خائبة لخطوة السماح لممدوح إسماعيل بالسفر ومن ذلك ما قاله الدكتور مفيد شهاب وزير الشئون القانونية والمجالس النيابية -لا فض فوه- من أن حكومتنا الرشيدة ليس لها علاقة بسفره وأنها لا تستطيع منعه وأن الدستور المصري يعطي للمواطنين حقهم في حرية التنقل إلا إذا كان هناك قرار بالمنع من السفر.<br />يعني تتسبب في قتل أكثر من ألف إنسان والقانون ليس له بك علاقة منتهى التسيب والفساد!!.<br />!! ولا ندري لماذا يطبق هذا الدستور على أناس ولا يطبق على الآخرين.. فعندما يمنع الدكتور عصام العريان أو الدكتور جمال حشمت من السفر لحضور مؤتمرات سياسية أو نقابية فإن نفس الدستور ونفس القانون يكونا نائمين أو في أجازة ويكون مكانهما قانون الغاب أو شرعة أبو جلمبو!!. وعندما يمنع العبد لله كاتب هذه السطور من الحصول على جواز سفره المصري هو وأولاده رغم حصولي على حكم من المحكمة الإدارية العليا نهائي وبات بذلك فإن الدستور والقانون يتم وضعهما تحت أحذية أمن الدولة وليس لهما وجود !! اوهو ما يدعونا للاعتقاد بصدق بأن الدستور والقانون يتم استحضارهما فقط لحماية الفساد والإجرام والنهب أما حماية حقوق وحريات المواطنين أو من يصنفون كمعارضين فلا قانون ولا دستور يا أسياد.!!<br />هذا يذكرنا بمسلك الكفار في الجاهلية الذين كانوا يحلون بعض الأشهر الحرم عاما ويحرمونها عاما حسب مزاجهم ومصالحهم فوصف الله تعالى عملهم هذا بأنه زيادة في الكفر (إنما النسيء زيادة في الكفر يضل به الذين كفروا يحلونه عاما ويحرمونه عاما ليواطئوا عدة ما حرم الله فيحلوا ما حرم الله زين لهم سوء أعمالهم والله لا يهدي القوم الكافرين))<br />وهو ما حذر منه الرسول صلى الله عليه وسلم عندما حدثنا عن انتقائية العدالة فقال: \"إنما أهلك الله من كان قبلكم كان إذا سرق فيهم الشريف تركوه وإذا سرق فيهم الضعيف أقاموا عليه الحد .. وأيم الله لو أن فاطمة بنت محمد سرقت لقطعت يدها.<br />والشخص الثاني الذي طلب أخيرا وزير العدل من رئيس مجلس الشورى رفع الحصانة عنه هو إبراهيم نافع إمبراطور الأهرام لربع قرن تضخمت فيها ثروته هو وأبنائه خلالها لأرقام فلكية بينما حملت المؤسسة بملايين من الديون، ولا من رقيب ولا حسيب ويأتي هذا الإجراء بعد شهور طويلة من نشر مئات الوثائق الدامغة عن الفساد واهدار المال العام في الأهرام حتى يأس الناس في مصر أن هناك من يقرأ أو يعقل في هذا النظام.<br />في كل دول العالم يتم التعامل بسرعة وجدية مع مثل هذه الاتهامات المتعلقة بالفساد خاصة الموثقة منها كما كان الحال مع فضائح إبراهيم نافع.. ففي بريطانيا رأينا كيف بادرت وزيرة الثقافة تيسا جويل بالطلاق من زوجها فورا بعد أن طالته تحقيقات عن الفساد في إيطاليا وليس في بريطانيا لأن ذمة الأزواج المالية واحدة.. وذلك لمجرد شبهات لم تثبت بعد قضائيا، ففي البلاد التي تحترم نفسها وشعبها شرف السياسي مثل عود الكبريت -كما يقولون- أما عندنا فهو مثل الأستك .. وصدق الحبييب عليه الصلاة والسلام القائل:\"إن مما أدرك الناس من كلام النبوة الأولى إذا لم تستح فافعل ماشئت\""
