text = "والله يا يسر مواضيعك … بتقتح دنيا تانية خالص محدش بيعرف يكتب فيها أساسا وده أجمل حاجة بتعمليها …<br />المهم بس متتقليش علي الناس اللي هنا وتقدمي حاجات كتير من كده … مش لازم يعني كل شهرين موضوع …<br />خاااااااااااااا الص تهانينااااااااا ااااااااااااااا ااااااااااا …<br />وعقبال كل بدلة ياستي<br />بس برضه مش حاسكت<br />لا للتمديد … لا للتوريث … نعم لتعديل الدستور المصري\"لا… بس مش بالشكل ده يعني\"<br />تقدروا تتفضلوا هناك دلوقتي<br />www.mesh7askot.blogspot.com<br />mohamedmat@hotm ail.com"
