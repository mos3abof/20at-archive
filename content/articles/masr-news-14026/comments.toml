[[comments]]
order = 3
subject = ""
author = "كريم"
posted = "2009-11-15"
text = "انا موش متعصب والله العظيم فى الكورة ولا غيرة بس اقسم بربى والله العظيم انا لو قابلت زائرى فى مصر لااكون ضربة ومشرحة ومبقاش راجل لو معملتش كدة ودة رد بيعى وهما البادئين يا رب يا رب اشوف اى واحد من الجزائر ويمين بالله لازم اكسر فية حاجة"
archived = "2009-11-15"
capture_url = "https://web.archive.org/web/20091115211456/http://www.20at.com:80/masr/news/14026-2009-11-14-01-38-32.html"

