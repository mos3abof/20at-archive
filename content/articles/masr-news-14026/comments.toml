text = "و فية اخبار انهم هيضربوا المصريين فى فرنسا وفى لندن - الجاليات الجزائرية كبيرة فى فرنسا وفى لندن وهبهدلوا المصريين دى طبعا غير دول المغرب العربى ابتداءا من ليبيا وتونس والجزائر والمغرب<br />اللة يقرفكم بقرف دخلتم الكورة فى السياسة ودخلتم السياسة فى الكورة"
