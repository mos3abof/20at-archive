posted = "2009-11-15"
text = "احنا ان شاء الله هنكسب بفضل ربنا وان شاء الله هنصعد لى كاس العالم<br />والجزائر دى وحشة جدا على الى بتعملو دا والله ربنا مع كل مصرى فى البلد الغريبة بجد كلنا لازم نقوووووووووول ياااااااااااررر ررررررررررب"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073851/http://www.20at.com:80/masr/news/14026-2009-11-14-01-38-32.html"

[[comments]]
order = 5
subject = ""
author = "حسبنا الله ونعم الوك"
posted = "2009-11-15"
text = "حسبى الله ونعم الوكيل فى صحيفة الشروق اللى عملت الموال ده كله هى اللى قالت ان المصريين اعتدو على الجمهور الجزائرى بعد المباراة وبعدها بيوم قالو ان 6 جزائريين ماتو ليه ده كلو علشان خسرتو مباراة كره فعلا حسبنا الله ونعم الوكيل وانتم يا شعب الجزائر بقيتو دلوقت لا علاقة لكم بالاسلام ولا العروبه ومحدش يقوللى احنا عرب زى بعض لاننا مش زيهم واحنا كمصريين ميشرفناش ان يبقى فى العرب امثال الهمجيين دول ولو حصل لواحد مصرى عندكو حاجه هتتحصرو على اليوم اللى ازيتوه فيه<br />حسبى الله ونعم الوكيل"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119073851/http://www.20at.com:80/masr/news/14026-2009-11-14-01-38-32.html"

