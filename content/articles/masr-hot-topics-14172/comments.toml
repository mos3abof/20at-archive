[[comments]]
order = 4
subject = ""
author = "لعبة الكووورة"
posted = "2009-11-28"
text = "ومن امتى مصر بتلعب كووووورة ؟<br />وكم مرة وصلت المونديال ؟<br />احنا هنضحك على نفسنا<br />ونفترض اننا غلبنا الجزاير هنعمل اية ؟<br />هنطلع لكاس العالم وهنصفى مع مين<br />احنا ناس بتوع كلام ولا بتوع لعب ولا زفت<br />كل اللى بنعرف نعملة اننا نغلب الافريكان التعبانين اللى بقوا دول وعايشين فى الغابات من 5 سنين<br />اتنيلوا جتكم ستين وكسة<br />زعلانين قوى ان الجزائريين حرقوا العلم طيب ما انتم حرقتم علمهم الاول<br />واسرائيل بتموت فى عساكركم كل يوم على الحدود زى الفراخ<br />اتنيلوا وخليكوا فى تخلفكم وفقركم اللى العالم كلة بيضحك عليهم بة<br />فقر وجهل ومرض وعنتظة<br />بتوع الكوورة ولاد الكلب يسكتوا"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201045505/http://20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html"

