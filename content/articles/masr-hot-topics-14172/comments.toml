author = "هاميس"
posted = "2009-12-26"
text = "اقتباس pretty_dolly:<br />كويس كل كلامك اللي انتي قولتيها ولكن دعيني اقول:-<br />- انا لا احترم من لا يحترم بلدي.<br />- استحالة احب ناس حرقت علم بلدي وداسوه بالجزم<br />انا مصرية ولا احب الا مصر وانا مش بكره الجزائر لالالالا انا بحتقرهم شعبآ وحكومة وبلد<br />لا اله الا الله حكومتهم مين يبنتى و الناس اللى قاعدة تقول عروبة عروبة عروبة دول مراعوش حق العروبة ولا واحد من حكومتهم الرشيدة ( على اساس ان رشيدة دى المعزة بتاعة بكار هههههههه) قال يعتذر الا و الكل هجوم علينا يعينى عليهم من الحكومة الى أصغر الأطفال مخهم فى الكورة يا حسرة قلبى على المليون شهيد و بلادهم ."
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229140433/http://www.20at.com:80/banat/variety/14179-2009-11-25-16-25-00.html"

[[comments]]
