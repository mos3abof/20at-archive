[[comments]]
order = 72
subject = ""
author = "هاميس"
posted = "2009-12-26"
text = "اقتباس niso:<br />أيه الفخر ده كله، من الواضح أنك جزائرى أبا عن جد<br />كفاية علينا بقى شعارات و موضوع الأخوة و العروبة و الكلام الفاضى اللى شبعنا منه و محدش مصدقه غيرنا<br />احنا اتهنا و اتبهدلنا و الموضوع أكبر من مجرد ماتش كرة أو ان احنا انهزمنا، لو كان دول ناس محترمة كنا وجهنا لهم التهنئة و ده اللى حصل فعلا، لكن دول نفوسهم شايله مننا كتير و بيكرهونا و حاقدين علينا، ربنا ينتقم لنا منهم و نسمع عنهم أسوأ الأخبار دائما يا رب<br />و اذا كان على أحمد مكى و وردة اللى مأثرين فيك أوى، فأحمد مكى ده أساسا أسوأ ممثل على وجه الأرض أنا مش عارفة بتحبه على أيه، و وردة أساسا ما بقاش ليها أسم الا لما جت مصر يعنى احنا اللى عملناها بس هيه ناس غاوية بطر ع النعمة<br />يبنتى احمد مكى أوك و وردة اللى نست نفسها و اللى بتشجع بلادها اوك بس ميزان العقل عندها خرف شوية و بعدين دى اصلا مولودة فى حارة فى فرنسا يعنى لا تمت لبلدهم دى فى شئ .<br />و أحمد مكى معتقدش انه ساب بصمة فى الفن ولا حاجة عشان تقاطع مسلسل عشانه روح يا شارط العب بعيد يا حبيبى أحسن تتعور"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229140433/http://www.20at.com:80/banat/variety/14179-2009-11-25-16-25-00.html"

[[comments]]
