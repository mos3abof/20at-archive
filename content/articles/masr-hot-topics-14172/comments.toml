posted = "2009-11-28"
text = "انتو بتقولو حاجات غريبه ومن جواكم الناس كلها بتكره بعضهم احب اقول لكل واحد او وحده مصرى او جزائرى ان هناك فى الجزائر كل شخص بيكره التانى ولا حد بيحب بعض وفى كل الدول العربيه والاجنبيه وهناك شى كل العرب نسيوه ان مصر والمصريين اساس العرب تذكرو السيده هاجره والدة اسماعيل عليه السلام"
