author = "niso"
posted = "2009-12-22"
text = "أيه الفخر ده كله، من الواضح أنك جزائرى أبا عن جد<br />كفاية علينا بقى شعارات و موضوع الأخوة و العروبة و الكلام الفاضى اللى شبعنا منه و محدش مصدقه غيرنا<br />احنا اتهنا و اتبهدلنا و الموضوع أكبر من مجرد ماتش كرة أو ان احنا انهزمنا، لو كان دول ناس محترمة كنا وجهنا لهم التهنئة و ده اللى حصل فعلا، لكن دول نفوسهم شايله مننا كتير و بيكرهونا و حاقدين علينا، ربنا ينتقم لنا منهم و نسمع عنهم أسوأ الأخبار دائما يا رب<br />و اذا كان على أحمد مكى و وردة اللى مأثرين فيك أوى، فأحمد مكى ده أساسا أسوأ ممثل على وجه الأرض أنا مش عارفة بتحبه على أيه، و وردة أساسا ما بقاش ليها أسم الا لما جت مصر يعنى احنا اللى عملناها بس هيه ناس غاوية بطر ع النعمة"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224101031/http://www.20at.com:80/banat/variety/14179-2009-11-25-16-25-00.html"

