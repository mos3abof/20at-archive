text = "كويس كل كلامك اللي انتي قولتيها ولكن دعيني اقول:-<br />- انا لا احترم من لا يحترم بلدي.<br />- استحالة احب ناس حرقت علم بلدي وداسوه بالجزم<br />انا مصرية ولا احب الا مصر وانا مش بكره الجزائر لالالالا انا بحتقرهم شعبآ وحكومة وبلد"
