posted = "2009-11-28"
text = "انا عايز اقول ان اللى شتمنى انا واهلى عشان البروفايل بتاعى مصرى …واللى شفت صوره وهو بيهين علم بلادى …هو وحكومته وناسه اللى ساكتين على الاهانات المقززة دى…الناس دى كلها لازم يخدو بالجزمة.<br />انما الجزاير هتفضل فى قلبى غصب عنى وعن عين اهلها…لانها ببساطة مش بس بتاعتهم ,لا دى بتعتى انا كمان انا وكل مصرى عربى مسلم…عايش الحلم اللى جاى…بيدمع لما بيسمع شاب خالد…وبيصرخ من قلبه لما بيشوف فيلم جميلة بوحيرد …عاشت مصر وعاش الجزائر ..وعاش كل عربى شريف"
