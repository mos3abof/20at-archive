author = "الفرعون الكبير"
posted = "2009-12-02"
text = "الى جميع الأخوة الجزائريين المؤدبين نحن لا نستطيع ان نكره الجزائر لأنها ببساطة محفورة داخل قلوبنا ولكننا نكره الصفات السيئة لبعض مشجعيكم الذين أساءو لكل ما هو مصر تماماً كما نكره أى صفة سيئة فى شعبنا ولكنى أحب أن أنبهكم وأنبه إخوتى المصرين أن هناك بعض الحاقدين من جنسيات أخرى يندسوا داخل المنتديات لتأجيج الفتنة بيننا فتنبهوا ومثال على ذلك القحبة السورية التى تدعونفسها هالة المصرى وأصحاب التعليقات 41 و43 وبعض المعرصين الأخرين"
