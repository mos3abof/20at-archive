text = "انتى فعلا قولتيها من الاول انتى ماتعرفيش حاجة عن الكورة وشكلك بتاخدى الامور بسطحية وماتعرفيش ايه ال حصل فى المصريين قبل مايحصل الكلام دهكلنا كنا بنحب الجزائر وزين الدين زيدان وكان عادىخالص لكن بعد ال حصل المفروض بقا نفوق ونعرف ان فيهحاجة فى النفوس خلاص الجزائر بقت بتكره حاجة اسمها مصريين وكمان اجحنا برده مش عاوزينهم احنا بنحترم بس الاجيال ال كانت فى الاول لكن دلوقتى الله ياخدهم ويريحنا منهم عكروا علينا ينتقملنا منهم ربنا"
