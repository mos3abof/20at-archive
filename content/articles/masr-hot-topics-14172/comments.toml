[[comments]]
order = 52
subject = ""
author = "الى هاله المصري"
posted = "2009-12-04"
text = "اقتباس هالة المصري . سوريا:<br />يكفينا …قةله رضي الله عنه<br />( ارض مصر من دهب و نسائها لعب و رجالها مع من غلب)<br />الى هاله المصري<br />هذا الكلام لم يقوله رضي الله عنه<br />هذا كلام مزور منسوب الى عمرو بن العاص فاتح مصر وبحثنا عنه في كتب التاريخ لم نجده وعمرو بن العاص فاتح مصر بعث رسالة الى امير المؤمنين عمر بن الخطاب يصف فيها مصر ولم يقل فيها هذا الكلام موجوده على النت تبقدري تبحثي عنها<br />ولنفترض جدلا ان هذا قيل في حق مصر<br />وعندكم في سوريا النساء حالهم ايه ممكن تقوليلنا<br />والجزائريين يقولولنا النساء في الجزائر حالهم ايه ممكن تقولولنا"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106145109/http://www.20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html?"

[[comments]]
order = 53
subject = ""
author = "أمير صموئيل جرجس"
posted = "2009-12-04"
text = "اولاً : الى كرستين اللى طلعت ماتعرفش حاجة عن المصريين و العرب و المسيحية و القومية العربية … ايه اللى انتى بتقوليه ده ؟؟ ايه الهرتلة اللى انتى بتهرتليها دى ؟؟ انا مسيحى و عربى و مصرى و اخوتى مسلمين قبل المسيحيين كمان .. احنا احباب كلنا , يا جماعة نخلى كلامنا مسئول شوية احنا مش عيال صغيرين على الهبل ده .. اللى حاصل حالياً فتنة كبيرة بين بلدين اخوات<br />أنا باستغل فى الجزائر و اكلت و شربت مع اخواتى الجزائريين .. صحيح اتهنت فى آخر ايامى هناك قبل مانزل مصر مضطراً آسفاً .. لكن ده مايمنعش انى اقول ان اللى حصل ده مش الشعب الجزائرى .. الجزائريين محترمين انما اللى قاموا بمثل تلك الافعال هم اللى مش محترمين … ياريت يا جماعة نفوق مصرى او جزائرى احنا عرب و اللى بيننا اقوى من كرة قدم و كاس عالم . سلام عليكم"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106145109/http://www.20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html?"

[[comments]]
order = 54
subject = ""
author = "مصر فائزه"
posted = "2009-12-04"
text = "مصر هي الفائدة على الجزائر وهي التي يجب ان تذهب الى كاس العالم<br />لان المفروض ان الهدف في مروى الخصم على ارضه بهدفين<br />ونتيجة مباراة الجزائر كانت 3/1 لصالح الجزائر يعني 3/2 لان الهدف المصري بـ 2<br />ونتيجة المباراه في مصر 2/صفر لصالح مصر يبقى مصر ليها اربع اهداف مقابل 3<br />يعني مصر هي الفائزه<br />وتحطيم مكتب مصر للطيران وسرقة محتوياته دليل على همجية الجزائر امام العالم كله عرفوا ان الجزائريين شعب همج لان الامن الجزائري تواطىء<br />اما الامن المصري المتحضر نزل وقام بحراسة المنشأت الجزائرية ولم تصاب اي منشأة جزائرة باي اذى"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106145109/http://www.20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html?"

[[comments]]
order = 55
subject = ""
author = "Max against Algeria"
posted = "2009-12-05"
text = "وبعدين سؤال بسيط اوى ليه عاملتوا جمهورنا كده مع اننا سبنالكم الماتش وخسرنا نفسنا<br />ليه كنتم ناويين على الشر؟<br />حاجة من اتنين<br />اما انكم محروقين مننا علشان احنا اعظم بلد فى الوطن العربى<br />او انكم اغبيا وكنتم متاكدين انكم هتخسروا وماقدرتوش تستوعبوا الصدمة انكم كسبتم<br />ارجوا ان اى جزائرى محترم يرد على سؤالى ليه عملتم كده مع انكم كسبتم المباراه؟"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106145109/http://www.20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html?"

[[comments]]
order = 56
subject = ""
author = "Max against Algeria"
posted = "2009-12-05"
text = "الموضوع بجد بقى بايخ اوى<br />لو رجعنا لبداية الموضوع هنلاقى ان الغلط ولا عندنا ولا عند الجزائريين الغلط فى الاعلام الجزائرى الى صور ان مصر كانت مقبرة للمشجعين الجزائريين فى مباراة القاهرة2/0<br />واللوم على اللاعبين الجزائريين الى كسروا زجاج الاتوبيس وصوروا ان الجمهور المصرى هو الى اعتدى عليهم ولو حد عنده مانع على الكلام الى بقوله يكدبنى<br />وبعد كل ده جايين تشتمونا كل ده انا لسه ما اتكلمتش على الى حصل فى السودان<br />جمهورنا اتهان عن عمد مع تواطؤ الحكومة الجزائرية والحكومة السودانية<br />والجمهور المصرى انضرب على مرأى ومسمع من العالم كله فى مشهد همجى لاقصى درجة فالجمهور الجزائرى كان يشجع بقطع الزجاج والاسلحة البيضاء<br />كما ان هناك مشهد جعلنى اقسم انى لو رايت جزائرى فانى لن اتردد فى قتله وهو مشهد تجمع اثنان من الجزائريين على مشجع مصرى القوه فى الارض وانهالو عليه ضربا حتى فقد وعيه كيف لى ان احب بلدا قد اهانت اهلى واخوانى فى الدين والارض<br />معا ضد الجزائر ولكن باحترام كما تعود الجميع منا"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106145109/http://www.20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html?"

[[comments]]
order = 57
subject = ""
author = "الى الفرعون الكبير"
posted = "2009-12-05"
text = "اقتباس الفرعون الكبير:<br />الى من تدعى أنها هالة المصرى السورية وانا أشك فى ذلك قائل العبارة التى تستشهدين به عندما بارز سيدنا على بن ابى طالب واوشك أن يهزمه إضطر الى إنزال لباسه وإظهار عورته لعلمه بحياء سيدنا على كرم الله وجهه وان أرى أنك طالما مقتنعة بارائه فأبشرى بإنك سوف تخلعين لباسك قريباً ولكنى لا أضمن رد فعلى لحظتها معك .<br />واضح جدا انك قبطي مصري محروق من عمرو بن العاص الذي فتح مصر<br />الكلام اللي انت بتقوله دا ليس له اصل في كتب التاريخ المعتمدة تماما زي مقولة نسائها لعب المردود عليها في تعليق سابق<br />انتا مسيحي مصري ومتهيألي انك اسمك ممدوح زكي زخاري جرجس المحامي"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106145109/http://www.20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html?"

