author = "نادية"
posted = "2009-11-28"
text = "السلام عليكم اخواني المصريين عايزة اقول انو الشعب الجزائري بحب مصر ومش ممكن يقاطع مصر عشان ماتش كوروعيدكم سعيد انا اشكر هذا الكاتب العظيم باسم وباسم كل جزائري بحب مصر ام الدنيا وبلد الانبياء ويكفينا فخرا ان بلد عربي ومسلم مذكور في القراءن وان كان هناك بعض الزعل فهو من الاعلام والحمد لله رغم تشويشو على الشعبيين الا انو القلب الطاهر للامة الاسلامية بيظهر في الاوقات الصعبة انا بتمنى دوام الاخوة بينا والجزائريين كلهم بحب المصريين وبحب فنانيها"
