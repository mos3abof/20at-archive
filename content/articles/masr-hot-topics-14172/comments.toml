[[comments]]
order = 82
subject = ""
author = "mayooya.."
posted = "2010-01-03"
text = "من كان منكم بلا خطيئة فليرمني بحجر<br />احب اولا ان اوضح ان هذا الكلام موجه لكل عربي. من كان منكم بلاخطيئة فليرمني بحجر.<br />انا مصرية احب وطني فمن كان منكم من لا يحب وطنه فليرمني بحجر.<br />أنا مصرية وعندما رأيت علم بلدي وهو يحترق في بلد عربي فار دمي وتملكني الغضب فمن كان منكم بلا نخوة فليرمني بحجر.<br />أنا مصرية وانتقد بلدي وحكومتها وسياستها احيانا ولكني احبها وعندي امل في المستقبل فمن كان من بلا حكومة لها اخطاء فليرمني بحجر.<br />أنا مصرية واحسست بالاهانة لما حصل في السودان من عرب مثلي فمن كان منكم بلا كرامة فليرمني بحجر.<br />أنا مصرية واحسست بالعجز لأنني لم استطع مد يد العون لأخوتي المصريين في الجزائر والسودان فمن كان منكم بلا شهامة فليرمني بحجر.<br />أنا مصرية ومات داخلي الامل في الوحدة العربية فحزنت وتملكني الاسى فمن كان منكم بلا عروبة فليرمني بحجر."
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106152631/http://www.20at.com:80/banat/variety/14179.html"
