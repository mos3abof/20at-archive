subject = ""
author = "اسرائيلى"
posted = "2009-11-29"
text = "برافو مصرى انت فية مزبوط كتير<br />برافو جزائرى انت فية مزبوط كتير<br />لازم فية دم يبقى تمام<br />كلة ما فى تنازل<br />اسرائيل فيها معامل وفابريقة كتير ممكن صدر بضاعة جزائر وممكن صدر بضاعة لمصر<br />اسرئيل مبسوط تمام وفرحان"
archived = "2009-12-01"
