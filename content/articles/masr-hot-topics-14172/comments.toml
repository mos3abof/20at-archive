subject = ""
author = "حمدي سالمان"
posted = "2009-11-28"
text = "وانا كمان والله باحب الجزائر ةانا عمري ما سافرت للجزائر لكن انا شئيت او لم اشأ فأنا عربي والجزاءر عربيه هم اخوتي شئت او لم أشأ ماحدث في السودان او ما حدث في مصر فهو من قله لا تمثل المصريين ولا تمثل الجزائريين سواء اكانت هذه القله من الرباضيين او الاعلاميين او السباسين نحن شعب واحد في ارضين شعب عربي واحد في ارض الجزائز وارض نصر"
