text = "صحيح يرجى اغلاق باب الحوار بهذا الموضوع .. المصريين و الجزائر اخوات و حبايب و رجعوا الجزائر انى يشوفوا شغلهم و الطلبة الجزائريين على دماغنا من فوق فى مصر<br />خلينا فى المصائب و التعليقات الهادفة بشأن القضية الفلسطينية او اى موضوعآخر يمس الامة العربية بسوء<br />احنا عرب مسلمين و مسيحيين .. يد واحدة ضدة الصهيونية و خلافه .."
