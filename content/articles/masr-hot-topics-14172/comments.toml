text = "الكلام دة عشان لو فيه اي حد ايا كانت جنسيته بيغلطنا عشان احنا متضايقين على بلدنا وثايرين عشان كرامتنا يبقى يحط نفسه مكاننا وانا واثقة انه هايعمل اكتر من كدة بكتييييييييير واذا حد ممكن يحصل فيه اللي حصلنا ومش هايتحرك يبقى ساعتها يحاسبنا ويغلطنا ويرمينا بالف حجر وحجر بس ساعتها يبقى من غير نخوة ولا كرامة ولا شهامة ولا … ولا … ولا…"
