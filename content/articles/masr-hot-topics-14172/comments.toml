text = "مالكش دعوه بمصر<br />خليك في خيبة الجزائر<br />فاكر عباس مدني لما فاز في الانتخابات<br />فاكر الشاذلي ابن جديد لما استقال<br />فاكر حصل ايه بعد كده<br />فاكر الجزائريين اللي كانوا بيندبحوا زي الخرفان في الشارع<br />فاكر ولا مش فاكر<br />روح شوف الخيبة بتاعتكم الاول وبعدين ابقى تعالى شجع الكوره<br />وبعدين دا موقع مصري انت داخله ليه"
