posted = "2009-11-29"
text = "كلام علاء عن - لا بد من اخذ حقنا ولازم يعتذروا - راح فين<br />احنا عايزين جدية<br />اللى يتكلم كلمة يبقى قدها والا هو لعب عيال<br />احنا قلنا الجزائر هتسمع كلامة وهتخر ركعا وسجدا قدام كرسى ابوة تطلب العفو والسماح<br />الجزائر يا عم علاء ما اعتذرتش ولا حقنا رجع<br />نعمل اية<br />لو راجل اطلع فى البيت بيتك تانى وقول لهم يعتذروا"
