author = "بلبلة"
posted = "2009-12-27"
text = "ايه التخريف اللى بتقوليه ده اكيد انتى بتهزرى بقى احنا نضرب بالجزم ونطرد من بلدهم اللى نسيوا ان المحرك الرئيسى والمخطط للثورة الجزائرية كان مصرى ويتحرق علمنا ويداس تحت ارجل المجرمين والعصبجية وويرفعوا علينا الاسلحة ويعورونا وينتهكوا حرمة الوطن شعب وحكومة احياء واموات رجال ونساء ويسبونا ويشتمونا ويقولوا علينا خونة وبلد الدعارة ولسه بتحبيهم طب عايزة ايه تانى علشان تحتقريهم لازم يعنى ينتهكوا حرمتك شخصيا ويعتدوا عليكى شخصيا علشان تكرهيهم انا اشك انك اصلا مصرية ده حتى اسبابك اسباب خيبة وهزلية وملهاش اى قيمة خاصة السبب الاول والله انامستغربة جدا من كلامك اللى مالوش لازمة يابنتى بيعاملونا اسوا من اسرائيل مش واخين بالهم اننا عرب ده لو كانت فرنسا لسه سايبة فيهم عرق عربى او حتى لسان عربى لو افتكروا ده واعتذروا اعنذار رسمى ويليق بمكانة مصر فى القران والسنة ممكن ساعتها نفكر نسامحهم بس مش هنسامحك انت"
