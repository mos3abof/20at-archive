author = "مصراوى من ام ادنيا"
posted = "2009-12-02"
text = "ياعنى ياخويا هما مابيفتكروش فلسطين الا لما يكونوا عايزين يطلعوا حقدهم وغلهم على مصر<br />طب ياخويا انت وهو قولولى بلاكم عملت ايه لفلسطين<br />ولو احن خونة وعملاء زى ما اعلامكم العميل بيصورلكم<br />طيب قوموا انتوا ورونا رجولتكم كده وواحد بس يقدر يقرب ناحية كلب يهودى<br />والا انت مابتقبلوش اى حد من كلاب اليهود فى فرنسا<br />انا هاقولك عن تلاتة مصريين بس مش اكتر عغملوا ايه لما جتلهم الفرصة عملوا ايه مع الكلاب اليهود<br />1- السيد نصير<br />تعرفوه ده اللى قتل الكلب اليهودى العنصرى مائيير كاهانا فى امريكا<br />2- ايمن محمد حسن<br />تعرفوه برضة ده اللى قتل 21 كلب يهودى من بينهم كلب فى الموساد داخل اسرائيل<br />3- سليمان خاطر<br />اكيد ماتعرفهوش ده اللى قتل 7 كلاب سياح يهود اخل اسرائيل<br />قولولى بقى اى حد من عند اى حد زى الابطال دى"
