posted = "2009-11-28"
text = "احتجزوا عمال مصريين ومحدش اتكلم<br />اتبلوا علينا ان احنا كسرنا اتوبيسهم<br />بلطجة وهمجية وبربرية<br />وبعدين مصر عملت لهم كتير وساعدتهم في استقلالهم وفي الاخر حرقوا علمنا وداسو عليه حبيهم كتير بقي زي ما بيحبوكي<br />انا عن نفسي بحب كل عربي مسلم لكن عمايلهم فعلا كتير ومش ده جزاء اخوتنا معاهم"
