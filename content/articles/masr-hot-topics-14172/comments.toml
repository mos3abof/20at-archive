subject = ""
author = "ضد التفرق"
posted = "2009-12-03"
text = "الملاحظة اللي عندي ان كل طرف سواء مصري او جزائري مقتنع انه علي حق و الطرف الاخر حثالة<br />المصري يري الجزائري انه ذلك السفاح الهمجي الذي ارهب الجمهور المصري في السودان<br />و دمر ممتلكلت المصريين في الجزائر<br />اما الجزائري فيري المصري انه ذلك الكافر او اليهودي الذي اذي المشجعين الجزائريين و قتل منهم و تعدي علي الصحفيات الجزائريات<br />و انا من وجهة نظر محايدة اري ان الجزائري مخطئ لأن افعاله مثبتة و لا يستطيع انكارها احد في حين افعال المصري من وجهة النظر السابقة مغالية في الخيال و تفتقر الي الاثبات<br />و لكن و لأن المصري و الجزائري لا يمكن تمثيلهم بأي من الصورتين<br />فلابد ان نوحد الصفوف و الاراء كعرب"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106145109/http://www.20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html?"

[[comments]]
