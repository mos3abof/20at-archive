author = "الى المعلق السابق"
posted = "2009-11-29"
text = "خلاص يا عم خلصنا بقا انت حتولعها تاني<br />التعليق 34 والتعليق 35 هدى النفوس وخلصنا<br />حضرتك عايز تولعها من جديد<br />عيب كده<br />خلاص يا اخوانا الجزائريين انتو اخوانا وحبايبنا وانتو اغلى عندنا من ميت كاس عالم<br />ولا يؤمن احدكم حتى يحب لاخيه ما يحب لنفسه<br />ونحن سعداء بصعودكم كاس العالم وانتم سوف تمثلون العرب والمسلمين هناك<br />ونتمنى لكم التوفيق<br />عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الْمُسْلِمُ أَخُو الْمُسْلِمِ لَا يَظْلِمُهُ وَلَا يَخْذُلُهُ وَلَا يَحْقِرُهُ التَّقْوَى هَاهُنَا\" وَيُشِيرُ إِلَى صَدْرِهِ ثَلَاثَ مَرَّاتٍ، \"بِحَسْبِ امْرِئٍ مِن الشَّرِّ أَنْ يَحْقِرَ أَخَاهُ الْمُسْلِمَ كُلُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ حَرَامٌ دَمُهُ وَمَالُهُ وَعِرْضُهُ\"."
