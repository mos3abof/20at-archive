subject = ""
author = "يخرب بيت الجزائريون"
posted = "2009-11-28"
text = "اللة يخرب بيت الجزائريون اللى غرقوا العبارة فى البحر الاحمر وولعوا فى قطار الصعيد وزقوا صخرة الدويقة ووقعوها فوق رؤوس الامنين<br />اللة يخرب بيتهم اللى كوموا الزبالة فى الشوارع وجابوا لنا القمح المغشوش والمبيدات المسرطنة<br />اللة يخرب بيتهم لانهم لم يرضوا ان ينغلبوا لنا ولو كنا كسبناهم كانت كل المشاكل هتنحل"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201045505/http://20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html"

[[comments]]
