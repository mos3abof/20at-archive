subject = ""
author = "هاميس"
posted = "2009-12-26"
text = "اقتباس loza 4 ever:<br />واضح انك مش بتحب الجزائر بس ده انت بتعشقها انا بقى عندى ليك حل مسالى انت تسيب مصر وتروح تعد هناك عند حبايبك بس يا ترى هما لما يعرفوا انك مصرى هيعملوا مغاك ايه ساعتها هتعرف قيمة بلدك وهتبقى اول واحد يقاطع الجزئر<br />و الله يبنتى عندك حق احنا شعب عاطفى و هم بيستغلوا ده<br />و الله حتى اللى كنا نعرفهم على النت و الله ولا علقنا على تصرفاتهم ولا حاجة الا و تلاقى الهجوم علينا .<br />و بصراحة طلع منهم ناس محترميين و ناس لوووووو خالص<br />خليهم مع الكورة و ان شاء الله هيرجعوا بالكاس و هيرفعوا رأس الأمة العربية ههههههههههههههه هههههه<br />و هيحرروا القدس كمان ."
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229140433/http://www.20at.com:80/banat/variety/14179-2009-11-25-16-25-00.html"

[[comments]]
order = 75
subject = ""
author = "هاميس"
posted = "2009-12-26"
text = "هههههههههههههه<br />و الله يبنتى كلامك يضحك يعنى هم اللى ضربونا واحنا نحبهم برضه و سيادتك عددتى العمالقة اللى عندهم يعنى تقليش احنا ناقصنا أعلام من مصر .<br />يبنتى الموضوع مش موضوع ماتش نهائى بالعكس والله معتقدش ان احنا زعلنا على الماتش قد ما زعلنا من تصرفات بعض منهم الهمج ، احنا بقالنها 24 سنة مرحناش كاس العالم و مسمعناش ان حد مات او جتلة سكتة ولا حصلت حرب عشان الحكاية دى .<br />بس واضح قعلا انهم مش لاقيين حاجة يفلحوا بيها غير الكورة خليهم بقه مع الكورة .<br />و متنيسش يا حلو ان مصر ليها يد بيضاء على كل الدول العربية احسن تفكرى انهم بيتفضلوا علينا بحاحة .<br />طبعا كلامى غير موجه للناس العاقلة فى الجزائر .<br />وان تو ثرى فيفا توم جيرى ههههههههههههههه"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229140433/http://www.20at.com:80/banat/variety/14179-2009-11-25-16-25-00.html"

