author = "الى لمياء موراكو"
posted = "2009-12-03"
text = "اقتباس لمياء maroco:<br />مصرائيل تغتصب …و القاهرة استبدلت القاف بالعين<br />وينكم يا شواد…حاشى كل من ينتمي للاخوان المسلمين<br />بقا مصر بقا اسمها مصرائيل<br />انتي نسيتي الحرب بين الجزائر والمغرب من حوالي 30 سنه كده حصلت حرب بين الجزائر والمغرب وحسني مبارك كان ساعتها نائب رئيس جمهورية وهو اللي راح وفضل يتنقل بين الجزائر والمغرب حتى وقفت الحرب اذا كنتي صغيره اسالي ابوكي او جد<br />عيب لما تقولي على مصر مصرائيل خليكي محترمه وبنت ناس وعيب لما تقولي ان القاهرة استبدلت القاف بالعين استحتي دا انتي حرمه عيب لما تقولي الكلام ده"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106145109/http://www.20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html?"

