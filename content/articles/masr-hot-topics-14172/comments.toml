author = "عبد المالك من الجزائ"
posted = "2009-12-02"
text = "والله لو لم اقرا كلماتك لقلت كل المصريين امثال الغندور لكن الحمد لله كين ناس ايعرفوا الاسلام هناك ايطالي دخل الاسلام ثم زار دولة عربية اسلامية . يا ترى مادا قال . الحمد لله عرفت الاسلام قبل المسلمين يا اخي بصراحة بعد الدي حدث كرهت المصرببن و كل فناني العالم و كل صحافيي العالم و كل اولاد الزعماء المستوى انحط و ربي ايجب الخير وربي يهدي الناس اللي راهي تخلط وتهين شخصها قبل اي انسان اخر وشكرا . اليوم بعد هده الاحداث تكدت بان المسح عيسى بن مريم عليه السلام هو من يحرر القدس لا احد سواه العرب اسرى في يد اسرائيل افيقوا يا عرب ."
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106145109/http://www.20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html?"

[[comments]]
