text = "لم يشكك أي جزائري في رجولة المصري ولكن لماذا تعطون الفرصة لأشباه الصحفين الذين باعوا شرفهم لليهود لكي يشتموننا بكل تلك النعوت<br />هل ترضون للجزائرين كل تلك الشتائم وحتى المساس بالشهداء الجزائرين الذين ينتسبون أيضا لكل مصري أو عربي<br />إليك أحي مصراوي من أم الدنيا"
