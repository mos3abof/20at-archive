subject = ""
author = "صلى الله عليه وسلم"
posted = "2009-11-29"
text = "عَنْ أَبِي هُرَيْرَةَ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: \"الْمُسْلِمُ أَخُو الْمُسْلِمِ لَا يَظْلِمُهُ وَلَا يَخْذُلُهُ وَلَا يَحْقِرُهُ التَّقْوَى هَاهُنَا\" وَيُشِيرُ إِلَى صَدْرِهِ ثَلَاثَ مَرَّاتٍ، \"بِحَسْبِ امْرِئٍ مِن الشَّرِّ أَنْ يَحْقِرَ أَخَاهُ الْمُسْلِمَ كُلُّ الْمُسْلِمِ عَلَى الْمُسْلِمِ حَرَامٌ دَمُهُ وَمَالُهُ وَعِرْضُهُ\"."
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201045505/http://20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html"

