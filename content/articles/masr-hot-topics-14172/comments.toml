subject = ""
author = "محمد الجزائر"
posted = "2009-11-28"
text = "انا عربي قبل ان اكون جزائري واعتزبعروبتي واقول لكماننا لانكرهكم وانما يوجد في الجزائر كما يوجد في مر جماعة لاتحب الخير للبلدين الشقيقين فلماذا اخواني لاننى المقابلة ونقوم باخراج الاسرائلين من القدس فانهم الان يضحكون علينا"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201045505/http://20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html"

[[comments]]
order = 9
subject = ""
author = "محمد الجزائر"
posted = "2009-11-28"
text = "انا عربي قبل ان اكون جزائري احب بلادي كما احب كل العرب واقول للمريين والجزائرين كفانا عداوة فانها مجرد لعبة فيها خاسر ومنهزم فلاداعي للكراهية فنحن شعب واحد وما يضركم يضرنا وبالنسبة للمخربين الله يهديهم ولا يديهم فلماذا لانتحد ونقومباخراجالار ائلين من القدس فهم يضحكون علينا"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201045505/http://20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html"

[[comments]]
order = 10
subject = ""
author = "احمد ببيتو"
posted = "2009-11-28"
text = "بسم الله الرحمن الرحيم<br />اولا انتي يا هبه الله انتي اتكلمتي عن الجزائر زمان مش دلوقتي لو انتي جيتي اسباب تحبي بيها الجزائر دلوقتي مش هتلاقي الا افعال جزئريه لا ترضي اي عربي وعشان اعرفك حاجه مفيش جزائري ولا مفربي ولا ليبي ولا تونسي بيحبو مصريين عرفه ليه عشان احنا احسن منهم وسوري في اللفظ احنا اسيادهم وبعدين هما اخدونا علي خوانه احنا لو وخدين بلطجيه زيهم كنا دفناهم في السودان بس احنا وخدين ممسلين ومغنيين ودكاتره لما هما عملو كده وهما كسبانين امال لو كانو خسرو كانو هيعملو ايه فينا احنا اوكي مش هننسا الاسباب الكويسه الانتي اولتيها بس الهما عملو ينسيكي اي حاجه حلوه عملوه (اسبابك) يا بنتي دول هانونا واهانو المصريين اخر اهانه بس ربنا يسامحهم"
archived = "2009-12-01"
capture_url = "https://web.archive.org/web/20091201045505/http://20at.com:80/masr/hot-topics/14172-2009-11-25-15-45-07.html"

