text = "يا هبة احنا فى واقعة معينة فيها ظالم ومظلوم وللاسف الظالم مفترى وحقود وبغل وقلبه ممتلئ بالغل من المصرين مش عارفه ليه ياريت يرحعو لتاريخهم بس وهما يعرفو مين الى عملهم ومين الى صنع الجزائر اييييييا جزائر مصر هى مصر ارض السلام والمحبه يكفى ذكرها فى القرأن الى انتم متعرفوش عنه حاجة يا دعاة الاسلام وايه الحنية دى كلها على فلسطين طيب فين الى الجزائر عملته لفلسطين يا حسالة العرب"
