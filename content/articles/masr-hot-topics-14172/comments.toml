text = "بس دول حرقو علم مصر كانه علم اسرائيل …<br />اكيد مش هنعلق لهم حبل المشنقه ولا هندوس على علمهم ونحرقه بس عاوزين اعتذار رسمى<br />وبعدين ايييييه الوطنيه بتاعتك ديه انتى مش زعلانه على بلادك ده لو كنتى مصريه اصلا؟؟؟؟<br />وبعدين حبيها زى مانتى عاوزه بس المهم تعرفى انهم غلطو فى المصريين وماعتذروش"
