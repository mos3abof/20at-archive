subject = ""
author = "محمود يحيى"
posted = "2009-11-28"
text = "انا بقى مش بحب الجزائر ولا بحب الجزائريين والى انتو بتقولو دول اخوتتنا واشقاء هما بنفسيهم مش عوزين يعرفو مصر ولا المصرين وبعدين انتو مشوفتوش هما عملو ايه فى اخويا واخوكوم المصرى مشوفتوش عملو ايه فى اختى واخنوكم المصريه مشوفتهومش وهما بيضريو ابويا وابوكم مشوفتهومش وهما بيضربو امى وامكم المصريه<br />فوقو يامصريين كفيانا عروبه كفيانا اخوه"
