text = "بسم الله ما شاء الله و الله أكبر أخيرا حد قال كلمة حق بشكر الكاتب وبشكر كل الي علقوا على الموضوع قبلي والله فكرت خلصو المصريين من مصر والجزائريين من الجزائر الحمد لله هما دول الناس الي يفهمو ولله الحمد<br />http://nas.mbc.net/forum/showthread.php?t=543391"
