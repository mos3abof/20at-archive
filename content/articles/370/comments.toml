[[comments]]
order = 5
subject = "الحلم الثائر"
text = "قبل ان اكتب اي حرف اذكركم بايتين من كتابه تعالى<br />قوله تعالى (ما يلفظ من قول الا لديه رقيب عتيد)<br />وقوله ايضا( ادفع بالتي هي احسن فاذا الذي بينك وبينه عداوة كأنه ولي حميم)<br />التفكير العربي سيبقى هو التفكير العربي ونمطه لربما اراه صعب التغيير ... ولست ادرى لم انقلب الاستفتاء من استفتاء الى مشاحنات و شخصنة للموضوع بين اطراف مختلفة وبين شعوب ... شعوب لا تملك من الامر شيئ ومغلوب على امرها حتى في عواطفها تبعا لحكامها الشجعان الاشاوس!!!!!!<br />انا ارى بدايةان يكون هناك موضوع عن موجة الغضب والكره والتنافر الحاصلة بين مختلف الشعوب<br />ولو استعرضت المقال وكنت محايدا لقلت بان مصر ليس احسن حالا ... فان كانت غزة تحتل في غضون يوم (ولمن لا يعرف غزة فطولها 40 كلم وعرضها 17 كلم فقط ) فلا اظن ان احدا نسي ان سيناء بكاملها احتلت في غضون ايام<br />وفي المقابل ايضا فان ليسوا جميع الفلسطينيين سواء فهناك الخائن وهناك المجاهد وهناك الانتهازي مثلهم مثل بقية البشر .... والتفاضل بالعمل واثبات الذات في عالم الذئاب<br />برايي ان العملية التي تمت قد تكون مفتاح تخفيف حمل عن الوضع الداخلي الراهن في فلسطين ... بحيث يقل نوع الضغط المتواصل عليهم ... لكن في نفس الوقت هي امتداد ونشر الصراع على ساحة ورقعة اوسع لتشمل الدول المحيطة (ولا ارى قصورا في هذا ... فالكيان الصهيوني يقوم بهذا دون حرج داااائما ومتى ما اتحيت الفرصة له)<br />الامور متشابكة ومتلازمة الى حد كبير<br />الحركات الفلسطينية اعلنت من قبل انها لن تصدر ازمتها ومواجهاتها الى الخارج.<br />الكيان الصهوني ليس ببعيد عنه ان يقوم بما هو انذل واشد حقارة من قتل مواطنيه الغير شرعيين (في نظري)<br />والقاعدة المدقق في منهجها يجدها تحذوا وتناصر هذه العمليات<br />لكن يا ترى هل قام بها طرف واحد مستقل ؟؟؟ ام ان هناك تسهيل من الاخر او محاباة جزئية لمصلحة سيكتسبها بعد ذلك؟؟؟<br />الله اعلم!!!<br />وشكرا"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018192359/http://www.20at.com:80/article.php?sid=668"
