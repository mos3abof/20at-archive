author = "علمنى الهيافة"
posted = "2009-09-10"
text = "يعنى خلاص كل مشاكل المترو اتحلت ومفيش متسولين ولا باعة جائلين والمكيفات شغالة والقطارات وراء بعض باقى بس حكاية المعزة<br />امبارح حكومة دبى دشنت خط المترو وخط مترو دبى بيشتغل من غير سواق ومية فى المية اتوماتيك يعنى التكنولوجيا من الاخر<br />مش المترو بتاعنا اللى حولناة قطر بضاعة"
archived = "2009-09-16"
