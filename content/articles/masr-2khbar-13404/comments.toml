text = "ههههههههههههههه ههههههههههههههه ههههههههههههههه هههههه<br />حمد لله على سلامة المعزة<br />بس المعزة دخلت التاريخ اتعاملت على انها نفر لازم يدفع له تذكرة مما يعلى من قيمة المعزة<br />ياجماعة بشريييييييييييي ييييييييييييييي ييييييييييييييي ي<br />شكلنا هنبدا نهتم بالحيوان المصري<br />عقبال الانسان المصري يارب"
