posted = "2009-09-10"
text = "يا ولاد [ *** ]<br />طيب لو راكبة خواجاية او من الوسط [ *** ] اياة وركبت المترو ومعاها الكلب بتاعها فية احد من الانطاع اللى اعترضوا البدوية هيقرب منها<br />المعزة على الاقل نظيفة وطاهرة ومش نجسة زى الكلب<br />انما تقول اية<br />زمن الانطاع<br />وكل واحد علية قفا مترين"
