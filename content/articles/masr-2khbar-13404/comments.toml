subject = ""
author = "بدوية تعالج معزة"
posted = "2009-09-10"
text = "شفتم الهنا بتاع المعيز<br />عندها التهاب فى الضرع تقوم الست البدوية تاخدها لدكتور بيطرى فى وسط البلد<br />طيب الدكتور البيطرى قاعد فى وسط البلد لية<br />ولنفترض ان حمار البدوية او الجحش مرض وعايزة تعالجة تاخدة وسط البلد ازاى وكيف يدخل الحمار من باب المترو<br />مش المفروض البيطرى يفتح عيادة جنب الزباين بتوعة<br />وازاى محافظة القاهرة صرحت بفتح عيادة بيطرية وسط البلد واللى وسط البلد مكان صالح لعلاج البعير والناقة<br />اة يا بلد<br />كل حاجة يا بلد ماشية فيكى عشوائى"
archived = "2009-09-16"
capture_url = "https://web.archive.org/web/20090916092815/http://www.20at.com:80/masr/2khbar/13404-2009-09-10-06-25-04.html"

