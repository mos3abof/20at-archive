text = "دي بلد مسخرة .. قال يعني بيطبقوا القانون علي الانسان و الحيوان<br />مش لما يعرفوا يطبقوه علي البنى آدميين الاول<br />وقال ايه … إخلاء سبيل المعزة<br />يا صلاة النبي علي الناس الى شايفة شغلها<br />طب هما اساساً لية ماشافوهاش راكبة من محطة أيه وقاموا بمسائلة و معاقبة المسئول على د[ *** ] المعزة من الأساس"
