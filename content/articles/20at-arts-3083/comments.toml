text = "المشكلة مش في الاعلام المشكلة فينا احنا , مشكلتنا ان احنا بننسى هويتنا العربية المسلمة وبنحاول نجرى ورا الغرب على اساس نبقى زيهم لكن المشكلة ان احنا عمرنا ما هنبقى زيهم عشان هم عندهم حاجات متمسكين بيها لكن احنا لا , احنا بنمشي ورا الموضة وخلاص وتلاقى الناس في الكريسماس بتخرج وتسهر مااعرفش لية والى تلاقيه متمسك بدينه بيقولوا عليه متخلف ولو صام يقولوا لية هو في اية ؟ وكأن صيام النوافل عيب , العيب مش في اي حد غيرنا .<br />sasa_osos@hotma il.com"
