author = "ادم المهدى"
posted = "2007-01-21"
text = "سلام عليكم<br />انا فعلا الاعلام جاب حاجة كويسة عن السنة الهجرية انهم يعملوا animation عن الهجرة و يبين يعنى ايه هجرة و ازاى كل واحد يستفيد من الهجرة فى حياته من تخطيط و تحية من اجل الهدف ، هيقولوا على وزير الاعلام اخوان و مناصر للارهاب و هو المسئول عن عملية كعبلة الرئيس بوش اثناء اخذه دش و ممكن يتشال و على جزانتناموا عدل انتوا طبعا ما يرضيكوش ان عياله يتشردوا سيبوه يسترزق بكلبين حلوين و برنامجين ملهمش لازمه …<br />اما وجهة نظرى للاحتفال المناسب لاعيادنا الدينية اننا نعمل حفلة كبيرة و نجيب فيها القدوات المسلمة مش فى الدين بس لالا نجيب دكتور الجامعة المسلم و الطبيب المخترع المسلم و الفلكى و الفزيائى المسلم و يحكوا قصص نجاحهم و يبقى مثلا الاحتفال ده فى الهرم و يكون فيه light effectو يعرض فيه animation عن الهجرة بأسلوب جميل و نجيب منشدين شباب زى ابو خاطر و سامى يوسف او اشرف زهران ينشدوا نشيدين …و يكون فيها فقرة حبايبنا و هى اننا نلم تبرعات لاخواننا فى فلسطين و نقولهم فيها كل سنة و انتم طيبين ."
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106013438/http://20at.com/20at/arts/3083.html"

