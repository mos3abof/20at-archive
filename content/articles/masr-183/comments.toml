text = "حكومة مصر بزعامة مبارك لا تريد الا وطن علماني بحت..خال من اي رمز ديني ولاجل هذا لابد من تشويه صورة التعايش السلمي بين ابناء الشعب المصري ولو كان باشعال الفتن الطائفية...فقط من اجل نشلا ثقافة ان الحياة بلا دين هي الاريح والاكثر امانا وفعالية..."
