[[comments]]
order = 2
subject = "يا ترى مين السبب"
author = "لميس"
posted = "2006-04-19"
text = "والله الواحد مش عارف مين السبب<br />يا ترى<br />1 الحكومة (ودا أكبر إحتمال)<br />2 الراجل المجنون ( وحسى إنة إختراع )<br />3 جماعات ( معتقدش لية إية مصلحتها)<br />عموما لو الحكومة (فسببها مية بالمية تعمل آآآآآآآآآآآآآآآي حاجة عشان تشغل الناس ،أو ممكن ودا الإحتمال إل أبصم علية بالعشرة .......عيزة توأع الشعب في بعضة )<br />أما بألة لو الراجل إل بيأولو إنة مجنون فطبعا ربنة (المسلمين ) مش هيحسبة لإنة مجنون و المفطرد بردة المجتمع ميحسبوش و بردة يريت الحكومة تيجي على نفسها و تلههم و تحاول تعالجهم ( ولا مش فرقة معاها)أما بأة الجماعات فأنا مبحطهاش في النطاق أبدا .......<br />11سنة بس بحب مصر و عيزة اصلحها<br />البريد<br />mlake_el7ob2010@hotmail.com"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218162358/http://masr.20at.com:80/article.php?sid=183&PHPSESSID=93461b3b6a22c3783b54ac41eeaf755f"

