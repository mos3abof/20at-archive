[[comments]]
order = 5
subject = "كده كتير اوي"
author = "مصري مقيم باجمل بلد ( دبي )"
posted = "2006-04-23"
text = "علي فكرة انا مسلم بس اللي حصل ده حرام ولازم يا جماعة في مصر نغير من فكرنا يعني ايه واحد يدخل علي ناس فس ساعة صلاة ويدبح فيهم وياريت ميقولش زي الحكومة الغبية انه مختل عقلياً لان ده مش مختل انا شايف انه حاجة من اتنين الاولي:انه اصولي وشايف ان اللي عمله ده جزء من عملية الجهاد وهي ديه الكارثة الكبري ,ثانياً:انه يكون مأجور فعلاً من قوي خارجية لإثارة الفتنة بمصر وده شئ وارد بس في النهاية احب اقول ان لازم نغير فكرنا تجاه المسيحين علي فكرة انا عايش في نفس الشقة مع مسيحي ماروني وبنأكل ونشرب ونخرج مع بعض ولا فيه اي فرق."
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218162358/http://masr.20at.com:80/article.php?sid=183&PHPSESSID=93461b3b6a22c3783b54ac41eeaf755f"

[[comments]]
order = 6
subject = "مستحيل"
author = "rody"
posted = "2006-04-27"
text = "مش ممكن مسلم يعمل كده<br />المسلم الصح هو اللي لازم يبقا عارف ان دينا عمره ماامرنا بكده ,لا أننا نظلم حد ولا نعاقب أنسان ملهوش ذنب في أي حاجه<br />ياجماعه احنا همنا ومصيبتنا واحده ،مش ده العدو اللي لازم نقف قدامه، حرب 73 هي اكبر شاهد على اتحادنا يوم ما حررنا بلدنا يوم ما دافع عنها مسلم ومسيحي يوم ما كنا بنهتف بصوت واحد الله أكبر في سبيل اننا نحرر بلدنا ووقفنا كلنا ضد عدو واحد<br />أكيد مش محتاجين نذكر اسمه لان أرضنا لسه مشربتش دم اطفالنا واهالينا اللي ماتوا ساعه الاستعمار"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218162358/http://masr.20at.com:80/article.php?sid=183&PHPSESSID=93461b3b6a22c3783b54ac41eeaf755f"

[[comments]]
order = 7
subject = "حرام فعلا"
author = "ياسمين"
posted = "2006-05-01"
text = "ياجماعة انا مسلمة<br />بس بجد غلط جدا اللى حصل<br />و اللى عمل كده حلال فيه الاعدام<br />لانه قتل نفس بغير حق<br />و كمان حاول يقتل اكتر من واحد<br />بجد شخص بشع<br />و هو مش مختل ده متطرف باين عليه<br />واحد فاهم دينه غلط<br />بجد المفروض يتعدم ف ميدان عام<br />و احنا بنتاسف للاخوه المسيحيين ع اللى حصل ده<br />وربنا يكون ف عونهم"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218162358/http://masr.20at.com:80/article.php?sid=183&PHPSESSID=93461b3b6a22c3783b54ac41eeaf755f"

