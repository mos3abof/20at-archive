[[comments]]
order = 0
subject = "من هو سعد؟"
author = "من هو سعد الدين ابراهيم ؟"
posted = "2006-12-21"
text = "العملاء عادة مايكونون فى المعتقلات وخلف الزنازين ولكن حينما تتخلى عن جنسيتك وتكتسب الجنسية الامريكية فانها تحميك من كل ذلك<br />وانا اعتقد انة على الحكومة المصرية ان تسقط الجنسية المصرية عن كل من يتجنس بجنسية اخرى ذلك مهم جدا بالنسبة للامن القومى المصرى<br />لاتعطوا اذنا للعلمانيين عملاء الامريكان<br />كونوا مع المصريين الاصلاء<br />الموت للخونة وعاشت مصر عزيزة كريمة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

[[comments]]
order = 1
subject = "اسقط الجنسية عن المصريين"
author = "تلميذة"
posted = "2006-12-22"
text = "الشخص اللى كتب التعليق عن من هو سعد بالاحرى يسال عن نفسه من هو حتى يتكلم؟ ده انت حتى ما كتبتش اسمك نكرة والدفاع هنا مش عن الراجل لانى ماعرفوش الا من خلال الصحافة وانه أتسجن رغم انه يحمل الجنسية الأمريكية هو وأيمن نور وبرضه معاه الجنسية انا بسأل ليه الحقد كده على العالم رغم ان كل ما قاله الراجل صح وبحبه لمصر يطلب أن نحتذى بالشعب اللبنانى باعتصام مثلهم وبدل من مهاترات مافيهاش فايدة ونشتم بعض زى ما بتعمل كده انت وغيرك اقترح حل مفيد للجميع قيادة بالشعوب اللي بتفهم عنا شوية لان نسبة المتخلفين عقليا فيهم اقل من عندنا والدليل انك تطلب تسحب من الراجل جنسيته المصرية لمجرد انه معاه جنسية ثانية واتهمته انه عميل وده دليل على انك جاهل تماما وحاقد تماما ومين اللى قال انه ما بيحبش مصر اكتر منك بمراحل لانه اتعلم من الشعوب الاجنبية خارج بلاده قد ايه هيه قيمة بلده اكتر منك انت شخصيا اللى عايش فيها لان مالك الشيء يفقد اهميته بيه ولكن فاقد الشئ يشعر بأهميته وانت بالظبط تفقد احساسك بمصريتك لانك عايش جوى البلد ولا تعرف ماهى قيمة الاوطان الا عندما تعرف الغربة والاضطهاد من الجنس أو اللون او اللغة او الديانه انت لسه اخضر اتعلم وتعالى وبعدين قول تحيا مصر واتهم بس لما تكبر شوية<br />وعايز الحكومة تسقط الجنسية المصرية بكل من يتجنس بجنسية اخرى صحيح حاقد ومهمة للامن القومى ياجاهل اذا كان اللى حاميها حراميها وجنسيتهم مصرية احمى نفسك من نفسك<br />ابقى انزع الجنسية المصرية من كل مسؤول داخل الدولة أولى ياذكى قوى<br />أنت اخضر من بره واسود من جوى<br />امضاء تلميذة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

[[comments]]
order = 2
subject = "احنا شعب تعبان"
author = "المواطن المطحون"
posted = "2006-12-22"
text = "نجحت الحكومة بتقدير امتياز مع مرتبة القرف في الهاء الشعب بمواضيع هايفة لكي يتسني لهم القضاء علي الشعب في غفله منه, فمن موضوع انفلونزا الطيور الي كاس الامم الافريقية الي قضية الحجاب الي قضية ملابس الاخوان واخيرا التوربيني وغيرها من القضايا التي ياتي وضعها وتضخيمها لكي يلهي الشعب فيها وتترك قضايا اخطيرة مثل تعديل الدستور والقضايا الاقتصادية من غلاء مستمر وبطالة متصاعدة وامراض تفتك بالشعب والمتسبب فيها طبعا قتلة الحزن الوطني الواطي, يا جماعة حرام عليكم الكلام في المواضيع غير الهادفة, ليه ما فيش حد جاب سيرة قانون الوظيفة العامة الذي يضعه الان جهابزة الحزن الوطني وطبعا وزير التنمية الادارية احمد درويش (عدو الشباب) , ويهدف هذا القانون الي تصفية موظفي الدولة والاستغناء عن المتعاقدين الحاليين, واخراج الموظفيين الدائميين بالحكومة عن طريق المعاش المبكر, نعم هذا هو فكر دولة الحزن الوطني الواطي الجديد.<br />ولم يجيب احد سيرة قانون التامينات الجديد الذي يطبخ الان بواسطة حرامية الفكر الجديد بالحزن الوطني الواطي وعلي راسهم سارق المعاشات بطرس غالي , ويهدف القانون الجديد الي عدم توريث المعاش بعد وفاة صاحبه, اما من يدخل في الوظائف من الشباب الان فلا معاش له , شوفتوا الفكر الجديد, لقد تظاهر الشباب في فرنسا في سنة 2005 ضد قانون العمل لانه كان ضد مصلحتهم ونجحوا , اماانتم يا شباب فمشغلون بقضية الحجاب الشرعي وغير الشرعي وهل يجوز او لا يجوز وبملابس الاخوان وللاسف نجح النظام في الهاء الشعب"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

