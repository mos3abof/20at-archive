[[comments]]
order = 4
subject = "فلتحيا الحكومة"
author = "ايمن نور وسعد ابراهيم و ووو و كلهم فى سلة واحدة يقبضون من السفارة ويعملون ابحاثا لخدمة الامبرالية الجديدة"
posted = "2006-12-22"
text = "تماما كدور احمد الجلبى فى العراق<br />مالذى عملتة كفاية ومركز ابن خلدون للتجسس<br />بياكلوا كباب وكفتة بفلوس السفارة ويقولوا كم بق كلام والسذج من الناس يصدقوهم وانهم من المناضلين الاشاوس<br />ماركة احمد الجلبى وشركاة فى تدمير العراق<br />على الحكومة ان تتخلص من هؤلاء العملاء ومطلوب منهم ان يهتموا بجنسيتهم الجديدة ويتركوا الشعب فى حالة فللشعب قيادتة المصرية الوطنية"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

[[comments]]
order = 5
subject = "تسقط الحكومة العميلة"
author = "مصري يتمني زوال مبارك وعصابته"
posted = "2006-12-22"
text = "ايه القرف ده , يا عم الوطني باين عليك مصلحجي زي الحزب او من اعضاء البعث الصدامي , مين العميل يا عبيط , مين بيعطي الغاز بربع ثمنه لاسرائيل, مين بيناصر سياسة اسرائيل وامريكا يا عم الوطني في المنطقة ايمن نور ولا حزبك الوطني , مين عامل اتفاقية سلام مع قتلة العرب والفلسطينين , ومين عامل شالوم واتفاقيات زي الكويز وغيرها الي دمرت اقتصادنا مش هما قتلة اسرانا وشبابنا تحت جنازير الدبابات الدبابات هل هو سعد ابراهيم ولا ايمن نور يا وطني يا شريف زي حزبك الواطي العميل الخائن القذر.<br />عموما باين عليك كتكوت ولسه صغير علي فهم الواقع والحقيقة, يلا روح ارضع شوية شوية نفاق وكذب واقول لك بلغة حزب الواطي الحرامي يلا ( شالوم)"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

