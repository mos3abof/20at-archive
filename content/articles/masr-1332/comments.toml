[[comments]]
order = 19
subject = "للشخص اللى مش بيكتب اسمه"
author = "تلميذة"
posted = "2006-12-24"
text = "عايزة اوضح لك لو شكرت فوق واحد كتب عن اننا لازم نحتذى بالشعب اللبنانى وبدافع عنه وشكرت اخر لان ايد نفس الفكرة وبشكر ايضا المواطن المطحون انه بيشجع اننا نتحرك يببقى انا بشجع الفساد لانى مع فكرة الاعتصام ضد الفساد<br />على فكرة ضحكتنى عارف ليه لان اتضح لى انك مش قادر تفهم اللى بتقراه والتمس لك العذر ولانك ظروفك وحشة نفسيا فمش عارف مين اللى بيقول صح ومين اللى بيقول غلط والامور تداخلت اكثر من اللازم معاك اتمنى من الله يهديك<br />تلميذة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

