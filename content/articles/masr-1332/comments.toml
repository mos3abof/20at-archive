[[comments]]
order = 10
subject = "كلام جيد"
author = "معاذ محمود عامر"
posted = "2006-12-23"
text = "أولا أريد ألا ننساق وراء السمعة التي ألصقها النظام الحاكم بالدكتور سعد لأان نظامنا أكبر العملاء الحقيقيين لأميريكا<br />الدكتور سعد لا ينكر علاقته بأميريكا ولكنه ليس عميلا أو خائنا كما يحلو للنظام وأبواقه وبعض القومجيين أمثال مصطفى بكري أن يصفوه<br />بالنسبة لفكرة العصيان فهي تحتاج في رأيي تخطيطا طويلا جدا وتنظيما لأنه عند فشل عمل ضخم كهذا يفقد الناس الأمل ونعود لنقطة الصفر<br />عموما أنا أرى أن فكرة العصيان المدني لو حدثت ستسقط النظام الحاكم في أقل من أسبوع ولكنها بكل أسف لن تحدث على النطاق الواسع الذي يجعل إسقاط النظام سهلا وهذه الاستحالة ترجع إلى أن الخلافات بين قوى المعارضة الوطنية كبيرة جدا جدا ولم يحاول أي أحد منها تجاوز هذه الخلافات وأيضا ربما للسلبية المترسخة في نخاع العامة من الناس وأيضا ربما عدم وعيهم إلى حد كبير بحقوقهم الضائعة أو حتى وعيهم مع عدم الاقتناع بالبديل القادم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

