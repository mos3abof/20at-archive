[[comments]]
order = 12
subject = "التخلى عن الجنسية المصرية"
author = "شلحوف التانى"
posted = "2006-12-23"
text = "الجنسية غير قابلة للتغيير اى واحد بيتخلى عن جنسيتة يبقى مع السلامة يروح يشوف جنسيتة الجديدة ويبعد بقرفة عنا<br />فى الدول المحترمة ممنوع على حامل الجنسية المزدوجة تولى الوظائف العامة لانة ليس عندة ولاء 100%<br />وممنوع عنة الكلام فى السياسة والا اصبح عميل مزدوج<br />وممنوع عن اولادة دخول الكليات العسكرية<br />الاحتفاظ بجنسية اخرى معناة انة باع جنسيتة المصرية او انة احس بالعار منها<br />هذا الشخص يعتبر عار بالنسبة لنا ايضا<br />رجاء من الدولة الغاء الجنسية المصرية لكل حامل جنسية اجنبية<br />ذلك امان للبلد"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

[[comments]]
order = 13
subject = "ايضاح لشحلوف باشا"
author = "تلميذة"
posted = "2006-12-24"
text = "احب اوضح للشخص اللى مزهقنا بحكاية الجنسية المكتسبة علشان بس اصحح له المعلومة اسرائيل نفسها عارف حزب الليكود حاصل على 19 مقعد والاحزاب العربية 10 مثلا بمعنى اخر ان الاجانب العرب اللى يحملوا الجنسيات الاسرائيلية سامحين لهم ان يعملوا داخل الليكود<br />وفي الدول المحترمة اللى بتقول عنها ان لا يدخل الكلية العسكرية من مكتسب جنسية اخرى يعنى يبقى تقصد في الخدمةالعسكرية اصحح لك المعلومة ديه كمان واقولك لو اخدنا امربكا مثلا ح تلقى لو سمعت الاخبار كويس ان معظم اللى ارسلهم بوش في حرب العراق هم من الاجانب اللى وعدهم بوش بمنحهم الجنسية يعنى معناها ايه ديه ؟ انهم اصلا بكرت جرين وماعندهمش الجنسية الامريكية ورغم كده دخلوا الجيش<br />وفي فرنسا وهى بلد مليئة بسكان المغرب العربي وخاصة الجزائريين فاولادهم عند وصولهم السن القانونى يتم استداعئهم للخدمة العسكرية<br />و سويسرا البلد اللى على الحياد الايجابي وعدم الانحياز فالمهاجر المكتسب الجنسية يطبق عليه كالمواطن السويسرى بالظبط قانون تأديه الخدمة العسكرية شهر سنويا بعد ان يكتسب الجنسية الى ان يصل سنه الى الاربعين<br />يعنى الدول المحترمة اللى بتقول عليها لا تطبق القانون اللى انت مخترعه ده<br />الا بلدك انت بس فانت اكيد تقصد بيه مصر لان انت قولت ولا حتى اولاده ده مطبق فعلا في مصر وطبعا يجوز مطبق به في بلاد عربية اخرى لا اعلم<br />المهم صححت لك معلوماتك الخاطئة<br />امضاء تلميذة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

[[comments]]
order = 14
subject = "إنتبهوا يا شعب مصر .. الطوفان قادم"
author = "مصري وأفتخر"
posted = "2006-12-24"
text = "أنظروا : كيف فعلوا ويفعلون وسيفعلون بشرفاء مصر الكرام ، خيرة وصفوة رجال مصر العظماء ، يكيلوا لهم الإتهامات الباطلة ويلفقوا لهم القضايا، حثالة السلطة ينظرون لهم كأعداء حقيقون وتناسوا أعداؤهم الوهميون ، نحن تحت حكم طبق من السلطة الملوثة بالميكروبات نحن تحت حكم مسرطن ، حكم فاسق ، حكم واهن ، حكم مرتعش خائف دليل ، منافق ليس له ميثاق شرف وعهد مع شعبه ، نحن تحت حكم طبق من السلطة الفاسدة المقيتة ، نحن رجال مصر ننبذهم نحتقرهم جميعاً العائلة الفرعونية وأتابعهم الهامانيون الجدد ،<br />هل يستحق الشعب المصري الآبي ، الشعب الصبور ، الودود ، الطيب ، المقهور بفعل النظام وحاشيته ولجنة سياساته ، لجنة التخريب والتدمير لجميع مقدرات الشعب المصري ، ما قاموا ببيعه هي أملاكنا الحقيقية لنا ولأجيالنا القادمة ، كلنا سنحاسب من قبل أولادنا ، من منا ليس بينه إبن أو إبنه أو أخ أو أخت أو أب عاطل عن العمل ، البطالة تسد الأنوف ، والفساد أصبحت لدينا كالمستنفعات والبرك تنتشر أمراضها وعللها على الجميع ، يا شعب مصر ، يا أهل مصر ، مصركم مقبرة الغزاة على مر تاريخها ، مصركم صناعة التاريخ القديم والحديث ، مصركم قدوة قارات العالم ، مصركم شرفها الله في قرآنه العزيز ، مصركم أمانة في أعناقكم ، هبوا ، أنتفضوا ، ثوروا ، وأنا قبلكم ، أفيقوا من سبات نومكم ، نحن بحاجة إلى فورة وفورات ، إلى نجدة تأتي من داخلنا بعون من الله ....<br />كل الخراب ، والتدمير والفقر والسلبيات الإجتماعية بمختلف ألوانها ، من المتآمرين في لجنة السياسات التخريبية التدميرية بأمر ومباركة جمال اللا مبارك ، هذا الوجه الشيطاني وأساس الفساد والبلاء ، هذا الشيطان الأكبر الذي من يوم دخل مصر مطرودا مذموماً من بلاد الإنجليز ، هذا الشيطان الأعظم عندما دخل برجليه النجسة<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

[[comments]]
order = 15
subject = "معليش احنا بنتكلم"
author = "ابن آدم"
posted = "2006-12-24"
text = "إلى كل من يؤيد د. سعد فى فرة العصيان المدنى .انا يست مع أو ضد الفكرة فى الوقتالحالى نظراًًلقياس ظروف البلد والتعام الانتقامى من الحكومة لكل من فكر او حتى حلم يوماً بمعارضتها ... سؤال مهم لكم هل فى حالة الدعوة لعصيان مدنى يتخرجون من بيوتكم معرضين انفسكم للسحق بهراوات الامن المركزى او الاعتقال وكافة أشكال القمع ضد المنادين بالاصلاح السلمى . وكم من المدة التى يحتاجها هذا العصيان المدنى حتى ترضخ له حكومة لا تعرف الرضوخ وترفع شعار ( التار ولا العار ) وسؤال آخر هلى تجدى فكرة الاعتصامات والاحتجاجات والمظاهرات مع النظام الحاكم فى مصر وسؤال أخير متى سمعنا عن نزول د . سعد غلى الشارع فى احتجاجية او مظاهرة ؟ ... أسف جداً سؤال ختامى هل سيتقدمنا د . سعد ليكون فى طليعة الصفوف ... يا سادة المسالة ليست عاطفية حماسية ... الوسيلة غير فعالة نظرا لبيعة كل من الشعب المصرى اللى شارى دماغه وطبيعة النظام الحاكم ... وأتنمى لكل من يحب مصر التوفيق والرشاد"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

[[comments]]
order = 16
subject = "يا إللى مش بنى آدم لكن بنى مبارك"
author = "مش ها تقدر تحبط الشعب المصرى وفعلاً العصيان المدنى هو الحل لإنه ها يشل حركة الفاسد مبارك وعيلته القذره شوفوا حسن نصر الله قد إيه شالل السنيورة"
posted = "2006-12-24"
text = "للى إسمها الدشم ومرة تسمى نفسها تلميذه أحب اقولها إنت أستاذة فى الفساد وإنت كاتبه الكلام ده علشان يعنى إنت وأبنك الشاذ من مزدوجى الجنسية لإن إنت جنسيتك الأصلية أنجليزية من أصل يهودى علشان كده عمالة تبررى لمزدودجى الجنسية حقوقهم وفسادهم فى مصر"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

[[comments]]
order = 17
subject = "الي ابن ادم.. او الدشم.. او من الاخر مبارك ولجنة الحرامية"
author = "المواطن المطحون"
posted = "2006-12-24"
text = "بسم الله الرحمن الرحمن الرحيم ( ان الله لا يغير ما بقوم حتي يغيروا ما بانفسهم) صدق الله العظيم .<br />الي المسمي نفسه (ابن ادم) وللاسف انه اسم علي غير مسمي , لان ادم هو اب الخلق اجمعين , ونحن اولاده جمعيا , ولقد خلق الله صفات في الانسان وميزه عن غيره من البشر , فالانسان عندما يتالم يبكي وعندما يظلم يطالب بحقه وعندما يغضب يثور فلذلك تميز الانسان عن الخرفان مثلا .<br />وعندما يظلم الانسان في بلده ويعامل معاملة غير ادمية وتسلب حقوقه وتهان كرامته يجب عليه ان يقول لا ولا ولا والا اصبح مثل النعاج والخراف , فمن يري ظلم ولا يقاومه يصبح غيرضعيف الايمان, نعم غير ضعيف الايمان, فالرسول الكريم (ص) يقول في حديثه الشريف ( من راي منكم منكرا فيغيره بيده, فان لم يستطع فبلسانه, فان لم يستطع فبقلبه وهذا اضعف الايمان) يعني الرسول وصف ضعف الايمان بالخضوع وبكتم مقاومة الظلم .<br />واخيرا الكلام لك يا بتاع لجنة الكوسات جمال وشلته الحرامية , حركاتك مكشوفة ولن تسني الاحرار الاشراف المناضلين من اجل اعلاء كلمة الحرية والحق والعدل والمساواة بين المصريين جميعا مسلمين واقباط , وانشاء الله نشاهدك قريبا في السجن مثل كل متكبر ومتغطرس من الحكام الخونة العملاء لعنة الله و الشعب عليهم الي يوم الدينز"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

