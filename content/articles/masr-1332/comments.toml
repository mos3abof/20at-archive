[[comments]]
order = 8
subject = "شكرا ......"
author = "إبن بهيه"
posted = "2006-12-23"
text = "شكرا أميره فوده<br />شكرا د. سعد الدين إبراهيم<br />شكرا لعشرينات<br />أشكر الدكتور سعد الدين إبراهيم رغم اختلافي العميق معه ومع مركزه (إبن خلدون) لأسباب التمويل الأمريكاني طبعا<br />لكن كلام الرجل في محله تمام التمام وهذا هو المطلوب حاليا ..<br />والله العظيم رغم حبي الشديد للبنان بلدا وشعبا بكل أطيافه وبقدر كرهي الشديد للسنيورة وشلته الصهيونية أتمنى ألا يكون هناك حل وسط في لبنان<br />أتمنى أن تزيل المعارضة تلك الحكومة العميلة بالأدلة والبراهين وليس الظن والتخمين .. تمام زي حكومتنا العميلة<br />ليه ؟<br />عشان تكون سنه نقتدي بيها في مصر ونحاول نقلدها ونزيل حكومة الطاغية مبارك الواطي وعصاباته من البلد دي وننضفها من تلك القذارة وذيول الخيانة الواضحه كالشمس وبالأدلة والبراهين برضه مش ظن وتخمين .. أدلة وصلت ليد عمي اسماعيل المسكين بتاع الفول ..<br />يا خلق هوهـ هـ ...<br />ده الحل الوحيد في البلد دي .. يا عصيان مدني ومرتب يا إما ثورة ما تعرفش فين أولها من آخرها والبلد تقع في حيص بيص وربك يعلم ساعتها ممكن يحصل إيه<br />العصيان المدني السلمي بات ضرورة حياتية .. حيوية يعني ما فيش مفر منها قبل ما القدر يفور على آخره وساعتها ولا أي قوة تقف في وش الغليان اللي طافح منه وانفجاره هيكون أسوأ من أي نووي على البلد وربك عالم ساعتها ممكن تلاقي الصهاينة والخنازير عندك في دوران شبرا عشان يحموا حدود دولتهم المزعومه من الاضطرابات اللي في مصر وأمريكا تقولك دفاع عن النفس برضه<br />ممكن تكون دي تخاريف .. لكنها سيناريوهات محتمله جدا لو ما اتحركناش بمسئولية وطبقنا العصيان المدني اللبناني عندنا في مصر .. ربك يسهل والناس تفوق<br />وقبل الناس جماعة المثقفين الأشاوس بتوع الخناق مع بعض ومع بقية التيارات وبالذات اللي بيضربوا في الإخوان عمال على<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102253/http://masr.20at.com:80/article.php?sid=1332"

