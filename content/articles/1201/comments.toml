subject = "قرفان من الجواز"
author = "ممكن تفتكروا اني بمثل أو بشتغلكم، بس بجد هو ده اللي حصللي."
posted = "2006-05-26"
text = "كنت معجب جدا ببنت زميلتي في الكليه، أصغر مني بسنة، و هي كمان، و هي اللي خلتني أتكلم، و فساعتها خدت تليفون<br />والدتها و اتصلت بيها و بعد كده قابلتها(بعد ما قلت لأهلي طبعا)..مرتحتش خالص بصراحة لما قابلت مامتها. كنت حاسس انها بتبصلي بقرف!!<br />و بعدها جالي الرد ان انا مستعجل و أحسن اني استني لما أتخرج (كنت في اخر ترم في الكلية)...علي فكرة, أنا كنت الأول علي دفعتي، و الحمد لله اتخرجت..و اتعينت في الكليه معيد..و اذا كان علي الشقة واللهي عندي. و اتصلت تاني بوالدتها، و بعد كام مشوار و تعالي و روح...قالولي انت لسه صغير و الفرق بينكم مش كبير و لسه عندك جيش (علي فكره، بعدها بشهريين خدت تأجيل الحمد لله)...بس خلاص .اتحلقلي يعني...حد ممكن يقوللي ليه؟!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134129/http://www.20at.com/article2.php?sid=774"

