author = "مؤمن"
posted = "2006-05-23"
text = "سلام عليكم انا نفسى افسر بس مشعرف انا محتاج مساعدة انا واحد حسيس بضعف فى كل شى فى حياتة ولا يوجد سقة عندى بسى ضعف عندى وصل بية الى كفرى وايس بقيت افكر اعمل حاجت غلط معرفشى زى بسىبسبب انا دعيف انا مشى مشكلة حب لقة مشكلتى انا معرفشى اتعمال مع ناس بحس همة اكبر منى فى فهم بخاف اكلم مع حد يحس انا صغير فى سن بحول اتجنب ناس وابعد عنهم لحد موصلت ادرجة انا مليشى اصحاب ولة عمرى حبيت ولة اتعملت مع حد بسبب هذة مشكلة فقت سقة فى نفسى احيانا ممكن مكنشى دارى بنفسى بسى بلاحظ ناس كتير تقوال ان حب اساس اى انسان فى حياة انا عمرىمعرفت اى بنت هلى دة مشكلة على راى ناس مشكلتى حقيقة انا بتاعمل بطبعتى ونفسى اختار اصدقاء كويسين وناس يحبونى وحب وسعدونى على عبادة ربنة انا صقتى بية هزت انا مشى عوز حد يزعل منى بسى صدقونى انا حسيس بدعف نفسى كبير جدا عدم سقة يرت حد يسعدنى انا نفسى احب وتحب وحكى مع حد واصحاب بسى مشعرف"
