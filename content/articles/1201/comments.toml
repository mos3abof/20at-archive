subject = "محمد حسن غنيم"
author = "مجنون (مي)"
posted = "2006-09-09"
text = "كلمة تتكرر مراراً وتكراً<br />مش قادر اعيش من غيرك<br />كيف اتخيل الدنيا بدونك<br />انت كل حياتي<br />و العديد و العديد من المصطلحات و المترادفات التي لا تحتمل غير معنى واحد ولكن من وجة نظري يختلف المعنى بنوع العلاقة بين الشاب و الفتاه<br />فهناك شباب مرتبط لا يعنى فكرة الإرتباط ماهى ما أحكامها مااخر العلاقة<br />وهناك من يتسم بالعقلانية يدرس العلاقة عقليا و عاطفيا<br />وهناك آخر واحب نفسي منهم<br />تتغلب عليه الحياه و تتكاتل علية الضغوط ومتطلبات الحياه ليفقد معشوقتة<br />وهذا حال العشاق<br />او حكاية كل عاشق<br />واصبح العنوان<br />عارف اعيش من غيرك مش عارف افكر غير فيكي!!!!!!!!!!!<br />بدون تعليق<br />مجنون مي<br />محمد حسن غنيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134129/http://www.20at.com/article2.php?sid=774"
