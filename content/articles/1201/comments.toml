text = "أنااحمد مصطفى رسام من مصر طول عمرى ارسم وشوش الناس اللى أعرفهم وفيوم رسمت واحدة فى خيالى بس ماعرفتش أرسمها وقابلتها أخيرا فى الجامعه وهى الوحيده اللى حاولت تعرف ايه سبب انطوائى وان ماليش اصحاب والسبب انى متسلط لأبعد الحدودومريض بالاضطراب النفسى وهى حاولت تصلح من عاداتى علشان كده بقول ان الحب له فوايد كتير ...بيريح البنى أدم ويخليه يبوح بكل حاجه لمحبوبه جواه(الحاجات اللى بيخاف يقولهالأقاربه .وشكرا"
archived = "2006-11-02"
