subject = "ندىالصباح"
author = "الحب ،،"
posted = "2006-05-12"
text = "بصراحة كلمة كتير بسمعها وين ما اروح بالتلفزيون بالراديو بالاغاني ، بالحكي مع صاحباتي ، بالجامعة ،،،<br />واغرب شي يا جماعة اني مش عارفة شو معنى هالكلمة ، بصراحة كتار اللي بيجوا يحكولي انهم بحبوني ، بس انا ما بكون بحمل نفس المشاعر عادي ....<br />وبحس انو كل حب هالايام ضحك وغش وخيانة وهبل ...<br />يعني انا ما بقبل انو ينضحك علي باسم الحب ،،<br />وانا لحد الان مقررة اني ما احب الا الشخص اللي راح اتزوجه لان الحب لازم يكون بعقل<br />بس كل صاحباتي بحكولي الا ما يجي واحد ويكسرلك راسك وتحبي وتتبهدلي ..<br />بس اللي مش مصدقته انو ممكن حدا ينتحر عشان اللي بحبوا > بصراحة غريبة <<br />وبس ....<br />سلام ،،،"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134129/http://www.20at.com/article2.php?sid=774"

