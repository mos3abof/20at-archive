subject = "حراام"
author = "مادونا"
posted = "2006-05-07"
text = "الحب دا اجمل حاجة فى الدنيا كلها<br />كفاية انك تكون عايش بتحب حد وحاسس ان حياتك ليها قيمة عند حد<br />كفاية ان كل لحظة تعدى عليك تحس انك شاغل عقل وروح وقلب واحد تانى<br />اهم حاجة ياشباب هو الحب بصدق<br />وبعيد عن اى ماديات او اى حاجة<br />وطبعا اللى بيحب بصدق لايمكن ينسى حبيبة مهما حصل لة<br />انا لا اتخيل انى ممكن اعيش لو حصل لاقدر اللة لحبيبى حاجة<br />لان الدنيا من غيرة لا ليها طعم ولا لون<br />يبقى اعيش لية بقى ؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134129/http://www.20at.com/article2.php?sid=774"

