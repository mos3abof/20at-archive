posted = "2006-05-09"
text = "اولا انا عرفت كده من احساسى ومن الناس اللى حواليا<br />وانا لما قلت ان الحب ييجى بعد الزواج كان قصدى انه علشان الادب<br />وكمان علشان ميحصلش فراق وكل واحد نفسيته تتاثر ويقول\"مش قادر اعيش من غيرك\"<br />والحقيقه يمكن الحب يبقى زى كده ما تقول<br />بكل الجوارح علشان كده العنين تحب والايدين كل حاجه<br />مش عارفه بس انا متصوره كده والله اعلم يمكن النظره التشاؤميه هى الاقرب للواقع<br />ربنا يهدينا جميعا الى ما يحبه ويرضاه"
