text = "امر الان بما يشبه ذلك ولكن ليس الموت ولكن الفراق فأنا احبها وجاء على بالى كثيرا اننى لا استطيع ان اعيش من غيرها وفعلا ما جاء على بالى اننى لن احب غيرها ولن اتزوج فيرها وهذا احساس صادق لا كذب فيه ولمن كلام بعض الاصدقاء ربما يكون صحيحا وانه يجب ان تكتمل الحياه وتسير الى الامام والى الافضل دون توقف ومن الاخلاص ان يكون لها ذكرى جميله لا تنسى"
