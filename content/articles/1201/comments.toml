subject = "مش عارف ليه"
author = "عابر القارات"
posted = "2006-05-07"
text = "أنا بصراحة عندى فكرة ممكن تكون غريبة شوية و لو أنها واقعية و منطقية لو فكرنا فيها بالعقل و أكيد هلاقى تعليقات كتيره ضد الفكرة دى .. الفكرة إن الحب هو وهم كبيييير جدا بيبعوه علينا الشعراء و الممثلين و المطربين كل يوم من بدء الخليقة علشان يكسبوا مكاسب لا حصر لها فتخيلوا مثلا فى السنة الواحدة حجم تجارة الاغنيات بجميع اشكالها الكاسيت و السى دى و الفيديو كليب و اللى كلها بتتكلم عن العشق و الغرام و الهجر و القسوة و الدموع و الشموع و البتوع أكيد فى العالم هتلاقى قيمة التجارة دى بالتريليونات و يمكن أكبر تجارة بعد المخدرات ... أنا طبعا مش بنكر الحب أبدا لكن الحب الحقيقى هو لا يتعدى إنجذاب جنسى بين الطرفين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134129/http://www.20at.com/article2.php?sid=774"

