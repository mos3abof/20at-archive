[[comments]]
order = 8
subject = "حب ايه الى جاى تقول عليه انت عارف قابله معنى الحب ايه"
author = "مسلمه"
posted = "2006-05-07"
text = "اولا مش عارفه ازاى تسالو واحد عنده 13 سنه عن الحب وطبيعى قال حب بابا وماما نونو خالص<br />كمان انا الحقيقه مجربتش قبل كده الحب لانى مؤمنه جدا ان الحب بهدله<br />واكتر انى اتبهدل بعدين من الحب وانا متزوجه مش قبل كده؟؟؟<br />ثانيا يا عم عابر القارات اعتقد الحب مش \"وهم\" بس يمكن هو \"هم\" وايه حكايه جنسى دى؟؟؟<br />اللهم ارزقنا حبك وحب من ينفعنا حبه مع حبك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134129/http://www.20at.com/article2.php?sid=774"

[[comments]]
order = 9
subject = "أيوة يا مسلمة يا أختى"
author = "عابر القارات"
posted = "2006-05-07"
text = "أيوه يا مسلمة أنا بأؤكد إن الحب وهم و لا يتعدى إنجذاب جنسى و ليا أسبابى اللى بتؤيد النظرية دى و أهم أسبابى إن مثلا إيه رمز الحب عند أغلب العشاق؟؟ أكيد هو القبله و طبعا القبلة رمز حسى بحت ثانيا الحبيب لما بيحب يوصف حبيبته على مر التاريخ هل بيوصفها إنها مثلا طيبة و بنت حلال و ست بيت و متدينه .. أكيد على الاقل أنا مسمعتش قصيدة فيها الكلام ده لكن أكيد بيوصف عيونها و خدودها و بياضها و سمارها و قدها و شعرها و طبعا مفيش داعى إنى أوضح إن كل المعانى دى معانى حسية بحتة و ليها أكيد مدلول جنسى بحت ... دى حتى عبله لما كانت بتوصف عنتر كانت بتوصفه إنه غضنفر و وحش كاسر و السبع رجال فى بعض لكن ممكن أقولك أن فى المودة و الرحمة و اللى بيغرزها ربنا سبحانه و تعالى فى قلوب الزوجين من أجل ان تستمر الحياة بينهم و يساهموا فى إستمرار دورة الحياة و تربية أولادهم و طبعا الموده و الرحمة ده شئ ما أنكروش أبدا لأنه من عند ربنا سبحانه و تعالى و على فكرة مقولة \"الحب بيجيى بعد الجواز\" مع أن البعض ممكن يقول إنها دقة قديمة و رجعية لكن أنا بأؤكد أنها 100 × 100 صح من واقع تجارب حيه عشتها و شفتها و السبب بيؤكد نظريتى لأن الزوجين بيكون تخلصوا من هدفهم الحسى لهدف معنوى جميل و هو إستمرار الحياة بينهم و تربية أولادهم و على فكرة فى سبب بيؤكد نظريتى نسيت أقوله و هو أن إحصائيا و واقعيا الزيجات اللى بتم بين إتنين كانوا بيموتوا فى دباديب بعض قبل الجواز نسبة فشلها أعلى بكتير من الفشل اللى بيحصل للزيجات المترتبة (الصالونات يعنى) ... و بعدين إذغ كنتى بتقولى أنك ما حبتيش قبل كده عرفتى منين إن الحب (هم) و ليس (وهم) !! ;-)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134129/http://www.20at.com/article2.php?sid=774"

