text = "من الرائع ان نبقى علىوفئنا و محبتنا وان ندرك في اعمقنا قسوة الفراق فنحاول التمسك باحبائنا الى الابد. ولكن دوام الحال من المحال وان حصل فراق فهو من سنن الحياة فصول السنه تذهب و تعود والايام ترحل ويبى حالنا انا مسافرون فيقطار كل منا ينل في محطه مختلفه و يستمر سفر القطار وكل واحديتابع حياته بامل وبعض من الحنين لغيره من المسافرين"
