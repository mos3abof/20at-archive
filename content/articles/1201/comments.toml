[[comments]]
order = 0
subject = "مشاعر من نار"
author = "islam_physics@yahoo.com"
posted = "2006-05-06"
text = "سلام عليكم ورحمة الله وبركاته،<br />فلو بدأت عن الحب الحديث فلن استطيع ان اوفي ما تعنيه هذه الكلمة من مشاعر هي أقوى من دونها في أن تبقى ما بقى طرفيها فالحب هو قمة العلاقة بين الجنسين وأسماها وأعظمها -وهذا عن الحب الحقيقي- وأنه لما كان لكل منا قلب كان لزاما على الحب أن يعرف إلى قلبه الطريق.<br />فالمرء الذي يحب من قلبه حبا صادقا لا يرى إلا صورة من يحب وكان الدنيا أظلمت ولم تضيئ إلا على وجه حبيبه فإليها يطيل النظر وفيها يرى كمال الصور فلو رآها حلق قلبه في الآفاق.. ولو نظرت إليه بطرف هوى قلبه الخفاق.. ولو رحلت تناثر دمعه الرقراق.. وتنازعه إليها الأشواق.. فيبكي ندما على الفراق، وهذا حالة حين اللقاء ..وحين الفراق فبؤس وشقاء.. وتجهم وإعياء .. وسهد وتلذذ بالداء ،،،<br />أاااااه لو تعلمون الحب .. فيالها من حياة ، فالمحب لا يحب لكون المحبوبة هي اقدر من غيرها على اشباع رغباته الحيوانية وانما يحبها لأن قلبه اختار له ذلك،، فهو يحب الحب في سماها ، يحب النظرة من عيناها.. يحب البسمة من شفتها.. يحب الشروق على رؤياها .. يحب الغروب على ذكرها ..يحب تتبع خطاها .. بل يحب التراب تحب قداماها ..<br />وكثير من ذلك لمن يعرف الحب حقا<br />ولكن وعلى كل ذلك فلا يمكن ان يتصور الانسان ان يتخلص من حياته لفقد طرف من طرفي هذا الحب لانها الدنيا لا تعطي كل شئ يحبه الناس ولما ما كنا نعيش دوما في شقاء منها ولذا علينا ان نكون متعقلين ولأنفسنا متفهمين فلو حدث مثل هذا فتكمل الحياة فلعلك تقابلها في جنات النعيم،، فادعوا لها -او له- وهذا ما ينفعه لا ما ينفعه هو الموت من اجله..<br />واختلاف الليل والنهار ينسي..<br />والكلام كثير ولكن اخشى التطويل،، واسف ان اقترفته..<br />أخوكم إسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134129/http://www.20at.com/article2.php?sid=774"

