[[comments]]
order = 11
subject = "عابر القارات مش كده"
author = "عبدالله مفتاح"
posted = "2006-05-07"
text = "لا يا عابر القارات مش كده<br />التعبير عن الحب مش بالقبله ابدا ده خلط بين حب الافلام والحب الطاهر<br />لا جدال ان في حب لكن ايه صورته وايه شكله هو ده الموضوع<br />اولا:انا متفق معاك ان الشعراء وبتوع الافلام استغلوا الحب واعطوا فكرة خاطئه وتصور خاطئ عنه<br />والدليل ان في حب حديث النبي ( لا اجد للمتحابين غير الزواج ) بس مش عارف سنده<br />وحديث آخر ضعيف والالباني قال موضوع بس هقوله بردو<br />(من عشق فعف فكتم فهو شهيد)<br />باختصار التعبير عن الحب مش بالقبله ممكن بالتضحيه انا لو حبيت وحده وعارف اني مش هسعدها هعبرلها عن حبي باني ابعد عنها ومعترفش بحبي ليها<br />بس دهالليانا عايز اقوله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134129/http://www.20at.com/article2.php?sid=774"

[[comments]]
order = 12
subject = "أخويا عبده"
author = "عابر القارات"
posted = "2006-05-08"
text = "و الله يا أخويا يا عبده نفسى أصدقك بس للاسف أنا ليا أسبابى و فى الأخر كل الاحلام الجميلة الرومانسية ما هى الأ مخدر بيعيشك فى دنيا بعيد عن الواقغ بتحس أنك طاير فى السما و خفيف زى الريشة و إنك إتخلصت من مشاكل الدنيا و متاعبها و أحمالها و ده شعور بالظبط زى المخدرات (عدم المؤاخذه) فبتحب إنك تمارسه و تعيش فيه لكن فى الأخر بتصحى من النوم و تفوق و بعدين خد يا أخى عبرة من أشهر قصص الحب (قيس و ليلى) مثلا فى الأخر إيه قيس كان رومانسى قوى و كان زيك كده و بيضحى للحبيبة و بتاع و فى الأخر إتجنن و أصبح مختل عقليا (طبعا غير بتوع المنيا و إسكندرية ما تودوش الرجل فى داهية) لكن حبيبته كانت أعقل منه و حكمت عقلها و قبلت الواقع و إتجوزت إبن عمها مع إن المفروض إنها على الأقل تنتحر و ترمى نفسها من شباك الخيمة بعد ما رفضوا يجوزوها لحبيبها لكن البنت كانت عاقلة و سابت أخونا المختل ده لابس بيجاما و بيمسح إزاز الجمال فى الإشارات و إتجوزت ... المقصود إنى بأوصف الحب إنه مخدرات بس حلال و لكن للاسف ليها نفس النهاية على الجسم و العقل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134129/http://www.20at.com/article2.php?sid=774"

