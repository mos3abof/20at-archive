text = "انا عندى مشكلة مع حبيبى وهى انى خبيت عنة بيانات على النت يعنى غيرت اسمى وكدا<br />واستمرت علاقتنا فترة<br />واتكلمنا بالموبايل وهو حبنى اوى<br />وانا عشقتة اوى<br />المهم قلت لا يبقى لازم اصارحة<br />طبعا راح اتجنن وخرجنى من حياتة وكرهنى اوى<br />بس واللهى العظيم انا اخفيت بيانات عنة دا علشان احمى نفسى<br />لكن احساسى وحبى لية حقيقة واللهى العظيم<br />نفسى يرجعلى ويسامحنى<br />لكنة مش راضى<br />ارجوكم نفسى حد يرد عليا<br />ارجوكم تانى مرة<br />شكراااا"
