[[comments]]
order = 0
subject = "زعلان"
author = "أحمد"
posted = "2006-04-19"
text = "جزاك الله خيرا على هذا الموضوع<br />ولكن اتمنى ان تشيلى الجزء المتعلق بال سلفية من هذا الموضوع<br />لأن ليس كل سلقى متشدد<br />وأن السلفى أفضل من غيره من الناس العاديين<br />لأنه يحمل هم هذا الدين وليس كما تنظرين إلية أنه متشدد فقط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134803/http://www.20at.com/article2.php?sid=715"

[[comments]]
order = 1
subject = "مش متشدد"
author = "Apple"
posted = "2006-04-19"
text = "ليس كل سلفي متشدد... نحن نعرف هذا<br />ولكن قصة هذا الشاب تقول أن أهله كانوا من النوع المتشدد... ونحن نعرف ان هناك نوع معتدل...<br />كل ما هنالك أن هذا ما ذكره الشاب ليس أكثر.<br />وهو ليس اعتداء من الكاتبة على السلفيين ولا سمح الله أكيد... ليه الظن ده؟!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134803/http://www.20at.com/article2.php?sid=715"

[[comments]]
order = 2
subject = "جعلوني خايب"
author = "عبدالله مفتاح"
posted = "2006-04-19"
text = "الاخ اللي بيقول جعلوني سلفيا ده يكون ليه الشرف انه يكون سلفي<br />بس كتر زن المجتمع جعلوه ( شاب عادي) على حد قوله<br />وطبعا مينفعش شاب يبقى ملتزم ليه وليه بقا يبقى شاب وملتزم لازم يبقى عادي<br />لكن انه يكون من السبعه الذين يظلهم الله في ظل عرشه يوم لا ظل الا ظله(شاب نشا في طاعة الله) مينفعش ليه وليه<br />ده زن المجتمع هو اللي خلاك (شاب عادي)<br />مش زن باباك ماماتك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134803/http://www.20at.com/article2.php?sid=715"

[[comments]]
order = 3
subject = "وادي ووادي"
author = "virus"
posted = "2006-04-19"
text = "معرفش ليه دايما ادخل على اي موضوع الاقي الموضوع فى وادي والتعليقات قفشت فى سطر ووادي تاني .. حاجة تشل .. حلو يا اميرة الموضوع جدا وعرضك ليهناجح اوى .. اتمنى اقرالك كمان وكمان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134803/http://www.20at.com/article2.php?sid=715"

[[comments]]
