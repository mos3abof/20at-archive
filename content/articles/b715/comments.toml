subject = "حلووو يا قميرة"
author = "ممممممممممممممم"
posted = "2006-04-20"
text = "ودي نصيحتي لكل أصحابي يبطلوا ( زننن ) .. سواء ع التليفونات ، أو بالرنات ، أو ع الماسنجر .... !<br />ياريت شوية صمت ..<br />يا أهل الزن دماغنا وجاعنا ...<br />3 أيام سكووووووووت ..!!!<br />لله<br />تحيااااااااتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134803/http://www.20at.com/article2.php?sid=715"

[[comments]]
order = 5
subject = "الززززززززززززززن"
author = "مسلمه"
posted = "2006-04-20"
text = "الحقيقه يا جماعه الزن مبيكونش بس بالكلام ساعات بيكون بالفعل وبالعنين وبيهم كلهم مع بعض<br />زى لما واحده تكون عايزه تلفت النظر ليها وده صراحه اصعب انواع الزن لما يكون كل حاجه بتزن عليك وبتغريك بالحاجه اللى عايزاك تعملها<br />واسالو مجربه<br />اللهم اهدنا الى ما تحبه وترضاه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134803/http://www.20at.com/article2.php?sid=715"

