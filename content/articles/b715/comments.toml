[[comments]]
order = 7
subject = "زززززززززززن"
author = "هبابه او هوبه او هبهوب"
posted = "2006-04-20"
text = "ابتدي من الاخر في ايه السلفيه انا مالي انا مش تابع حد انا مع نفسيتي والسلفيه ناس طعام ولداد علي راي اكرم \" اهي اهي مش ياعيني في الجيش \". والله يا جماعه متعمموش متعمموش الجماعه غير الدعوة خالص مالص . يلا وانازاننه درجه اولي<br />بحب الزن بس لاسف محدش بيسمعلي . كل اما اطلب حاجه لازم ازن تلات الف مره عشان اخدها وفي الاخر مبدهاليش مع حبه لمضه في الاخر بيستسلمو وباخدها بس متعبه اوي.<br />ايه الموقع دا ؟؟<br />اسمه ايه ؟؟<br />منين ؟؟ فين ؟ ازاي ؟؟ شويه زن اهوه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134803/http://www.20at.com/article2.php?sid=715"

