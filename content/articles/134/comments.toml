text = "اللهم ارنا الحق حقا وارزقنا اتباعه وارنا الباطل باطلا وارزقنا اجتنابه.... كيف يكون رجلا يدعى بان ابليس ما كفرش (وهذا كفر صريح)ويقول عن الله جل وعلا انه سهران ينتظر توبت العبد( نسبت الحدوث لله تعالى ووصفه بصفات المخلوقات كفر) ويقول عن المسجد الاقصى انه بنى على ارض يهودى وهو حق لليهود .... هذا غيض من فيض اخوة الاسلام احذروا هذا المدنس لدين الاسلام وحذروا منه فانا امة علينا ان نامر بالمعروف وننهى عن المنكر . واذا كان رسول الله ما سكت للذى يغش بالتجارة فمن باب اولى ان تحذر من الذى يغش المسلمين في دينهم.... هذا رجل ماجور من بنى صهيون ....... الحذر الحذر والله من وراء القصد"
