[[comments]]
order = 18
subject = "عمرو خالد يخطىء احيانا .."
text = "فهو بشر ..وشأنه شأن كل عالم او امام او داعية ..<br />يحكى ان الامام ابن حزم استفتاه احدهم فافتاه وهو لا يعلم من الرجل .. ثم بعد انصراف الرجل .. اعاد ابن الحزم دراسة الفتوى فوجدها خاطئة ..فهل تتخيلون ما فعل ؟؟<br />ارسل فى المدينة مناديا ينادى :ايها الناس من افتاه ابن فان ابن حزم قد اخطأ !!<br />لماذا لا يفعل ذلك عمرو خالد ..لماذا لا يعترف بخطأه ..<br />اقسم بالله اننى لا انكر فضل عمرو خالد علىّ وعلى اخوتى<br />واقول له ذلك من باب خشيتى عليه من هذا الطريق وهى والله اشد من خشيتى عليه عندما كان طريدا مهددا لان ما هو فيه الآن فتنته اشد ..واذكره بحديثه عن الصبر عندما قال ان فتنة سيدنا يوسف عليه السلام مع امرأة العزيز كانت اشد من فتنته فى البئر ..<br />نعم يا استاذى لقد اخطأت عندما قلت ان الاغانى حلال وانها من معتقدات ديننا ..واخطأت عندما قلت ان الرسول صلى الله عليه وسلم كان يكرم الشعراء ويرحب بهم حتى الكفار منهم ..كلامك هذا مناقض لما انزله الله تعالى فى كتابه الكريم..اخطأاخطاء فادحة بسرده احاديثا ضعيفه او مشكوك فيها دون تبيان ذلك ..<br />عرفت هذه الاشياء وتأكدت منها من اعدائه الذين امسكوا له اخطاء لفظية غير مقصودة يستطيع اى احد ان يمسكها على اى احد ولا داعى لذكرها ..<br />كما سمعت ايضا عن موضوع المسجد الاقصى ولكنى لست متأكد منه لذا لم اورده ..<br />ولكن مطلوب من عمرو خالد ان يتوخى الحذر فى كل ما يقول ويفعل بعد ان اصبح مثل وقدوة وامام لكل هذا الجمع من الشباب ...ويرد على من يمسك عليع اخطاء كبيرة ..<br />فمثلا وهو العارف بأحوال الشباب ..مايصحش برده ان يجيب بنات حلوين محجبات نص نص او مش محجبات خالص يقعدهم قدامه وهو بيتكلم ولا هالة سرحان ..<br />وما يصحش انه يروح يقول انه بيكره كلمة فنانة معتزلة .. طب دى تتفهم ازاى !!<br />معلشى طولت عليكم انا دايما كده !!"
archived = "2005-01-02"
capture_url = "https://web.archive.org/web/20050102091704/http://www.20at.com:80/article.php?sid=445"

[[comments]]
order = 19
subject = "ماذا تريد"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم ورحمة الله وبركاته<br />عفوا اذا كنت سوف اوجه كلامي للكاتب علي عبدالمنعم<br />قرأت لك مقالتين واحدة عن حمزة يوسف والاخري عن عمرو خالد ، وللحقيقة اقول ان المقالتين فيهما كثير من الاحصائيات الجيدة والتي اقل ما تفعله ترفع الروح المعنوية المسلمة قليلا في زمن الراس المنكسة ولكن في لهجة مقالاتك نبرة سخرية ، عذرا ان كان كلامي فيه اعطاء حق بالنقد او التشريح ولكن انت كاتب مقروء وتقف علي منبر ويسمعك الملايين وخصوصا من الشباب الذي يبحث عن رمز وهدف وهوية ، نبرة السخرية في مقالاتك تعطي انطباعا باكثر من احتمال هل هو استخفاف او استغراب او تعجب او ماذا لست ادري ولكنك تتعامل مع رموز يسير وراءها الكثير من الشباب اليوم ويحاول ان يتلمس خطاهم في زمن يخرج لنا فيه شيخ الازهر ليعلن ان الحجاب ليس فريضة ، بعد موت الشيخ الشعراوي يبحث الشباب عن من يثق فيه ، ولذلك اذا كان هؤلاء رموز تعتقد انت انها جيدة او حتي تسير علي طريق الاسلام او تعرض وجهه نظر مسلمة ومسالمة في نفس الوقت فلم السخرية ، اسفة للمرة الثانية ولكني اكره ان اري راسا يرتفع واخر يقطعه عذارا وشكرا لسعة صدرك"
archived = "2005-01-02"
capture_url = "https://web.archive.org/web/20050102091704/http://www.20at.com:80/article.php?sid=445"

