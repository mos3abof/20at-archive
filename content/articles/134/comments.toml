[[comments]]
order = 42
subject = "واحدة مستغربة من الأغبياء اللي كتبوا فوق على عمرو"
text = "أشك إنه الناس اللي كتبت الكلام ده على الأستاذ عمرو خالد ناس مسلمة بصحيح<br />لانه مين هما عشان يتكلموا على أي داعية أو عالم بالشكل ده<br />دي أصلاً كلها اجتهادات علماء<br />واللي فعلأ قصدهم خير وفاكرين نفسهم إنهم هما مسلمين بحق ما بيثيروش الفتن بالشكل ده<br />ولو شافوا أي خطأ على هذا الإنسان الرائع ممكن يحاولوا إنهم يوجهوه مش يشهروا بيه ويلفقوا عليه كلام ، بعدين حضرات اللي كتبوا الكلام ده على عمروا خالد ونشروا لنكات الموقع اللي بيهاجمه<br />كانوا عملوا إيه للإسلام والمسلمين غير إثارة الفتن والبلبلة<br />دول ناس بيخربوا وبيحاولوا يعملوا فتنة كبيرة بين المسلمين ، وللناس اللي بيقرأوا الكلام ده<br />انتبهوا دي فتنة بين المسلمين ما تنجروش وراها<br />لا حول ولا قوة إلا بالله"
archived = "2005-02-19"
capture_url = "https://web.archive.org/web/20050219083238/http://www.20at.com:80/article.php?sid=445"

[[comments]]
order = 43
subject = ":: الله يهديكم ::"
text = "مش عارف ..<br />كل واحد خلاص مفكر حاله حامي الاسلام .. وقاعد بيشتم في انشان فعل الكثير والكثير لهداية الشباب ( سبب للهداية بعد الله )<br />وعمرو خالد ليس مفتي ... بل داعية .. ونحسبه من خير الدعاة ان شالله ولا نزكي على الله احدا ....<br />بس انا حابب احكي للي بيجرحوا في عمرو خالد ..<br />تأكدوا قبل ان تكتبوا شيئا ..<br />والبشر مش معصومين<br />كل الناس تغلط .. وكل الناس يتعمل حاجة للاسلام ..<br />والمهم النية<br />اذا كانت نيتكم صادقة وانكم ذكرتم هذا الكلام لغيرتكم على دين الله والخوف على دين الله .. جزاكم الله خير .. مع انكم ما عرفتم تختاروا الاسلوب الصحيح لهذا .. بل اتبعتم اسلوب التجريح والغيبة والقذف ... بدون بينة ...<br />واذا كانت نيتكم غير صادقة ( وهون المصيبة ) .. وبس بتقولوا هيك لانه اسلوبه ما عجبكم .. او لانه انسان كويس .. وانتو ما بدكم هيك ناس ...<br />فالله يهديكم ..<br />باي داعية تحبون ..<br />او باي داعية تحبون ..<br />المهم الله يهدينا واياكم<br />وكلمة اخيرة ...<br />(( ... أحبك في الله يا عمرو خالد ... ))<br />ســـــــلام عــلــيــكــــــــــــــم"
archived = "2005-02-19"
capture_url = "https://web.archive.org/web/20050219083238/http://www.20at.com:80/article.php?sid=445"

