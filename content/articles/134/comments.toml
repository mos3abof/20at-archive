subject = "بيرو"
text = "أدخل علي جوجل....<br />وأكتب أعداء عمرو خالد ......<br />دوس entar<br />الجهاز هيديك erorr<br />ويمكن جوجل يقولك أنه لايستطيع هذا الكم من النتائج في وقت واحد<br />أعداء عمرو خالد كتير ....باختصار اعداء عمرو خالد هما أعداء التغيير<br />هما انصار السبات دون سبات .....<br />دور علي أي واحد بيكره عمرو خالد ...<br />أسمعه ...حاول تقتنع بكلامه...للأسف موش هيقدر يقنعك لأنه هو نفسه موش مقتنع ...<br />آخر واحد سمعته بيهاجم عمرو خالد كان متعصب جدا ومتنرفز وموش طايق نفسه والعفاريت بتتنطط في وشه...<br />شكيت في امره ...بعد ما سيبته سألت واحد صاحبه يعرفه كويس...<br />قالي بتأثر....معلش يا بيرو ....أصله كان بيحب بنت سمعت عمرو خالد سابيته وانت عارف صاحبنا حساس من ناحية البنات..."
archived = "2004-07-14"
capture_url = "https://web.archive.org/web/20040714051457/http://www.20at.com:80/article.php?sid=445"

