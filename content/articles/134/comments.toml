text = "موضوع جميل يا علي و نقطه مهمة لم أنتبه إليها و لم تخطر في بالي مطلقا كلما فكرت في عمرو خالد و نشاطاته.. تقصد إيه بدوره السياسي بالضبط؟<br />الدين الإسلامي شامل لجميع جوانب و نشاطات الحياه و منها السياسيه، و بالتالي أي حد يتكلم في الدين بهدف الإصلاح لابد تكون السياسة جزء من كلامه لا يمكن فصله أو تجنبه.. ف إنت تقصد ايه بالدور السياسي لعمرو خالد و إنك كنت مستنيه؟"
