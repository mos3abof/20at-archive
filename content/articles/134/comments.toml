[[comments]]
order = 31
subject = "طالبه لارضاء الله"
text = "جزاك الله كل الخير يا اخ علي عبد المنعم على هذا المقال واحب ان اقول ان الله يجمعنا مع عمرو خالد في الجنه والله اني احبه في الله واحب ان اعلق على كل من تكلم عن عمرو خالد بسوء احب ان اقول له ان عمرو خالد هو الشخص المثالي وهو الشخص الذي اوعى الكثير من الشباب والفتيات من سباتهم واحب ان اقول اذا الله احب عبد حبب الناس فيه والاستاد عمرو خالد الكثير من الناس يحبوه ويحترموه ونهايه احب ان اشكرك جزيل الشكر يا اخ علي عبد المنعم ."
archived = "2005-01-02"
capture_url = "https://web.archive.org/web/20050102091704/http://www.20at.com:80/article.php?sid=445"

