subject = "عاشقه رهائن الاقصى (من عرب 48) معاويه"
text = "اود ان اقول بدايه اللهم فك اسر المسلمين ورهائن الاقصى الذين فعلوا الكثير لاحل الاقصى ومساعده الايتام والفقراء وندعوا من الله ان يثبتهم ويثبت اهلهم وزوجاتهم وندعوا الله ان يفك اسلاهم قريبا انشاءالله. اما بالنسبه لسامي يوسف انا اعشقه واعشق اغانيه. الاسلام هو الحل"
