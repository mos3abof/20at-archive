subject = "سبحان الله"
text = "السلام عليكم<br />من الطريف حقا أن تقرأ كلماتك على شاشات الرائي و من ثم على مواقع الإنترنت منسوبة لشخص ما<br />عم أتحدث؟<br />لا تفهموني خطاا أنا لا أتكلم عن سامي يوسف<br />أنا أتحدث عن زياد من الإمارات<br />قد تكون مجرد الحماسة<br />أو أن كلماتي قد تكون أعجبته<br />على كل الأمر ليس بالمهم<br />المهم أن الفكرة قد وصلت<br />و أنا فقط أردت أن أبتسم معكم على مجريات الأمور<br />http://nadi.alkahf.com/showthread.php?t=13269"
