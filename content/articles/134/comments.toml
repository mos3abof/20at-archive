text = "جزاكم الله خيراً على تواصلكم معنا..<br />أتفق تماماً مع جاء في كلامك... أما ما قصدته من الدور السياسي لعمرو خالد، هو أن عمرو خالد كان يتجنب الحديث في الأمور السياسية حينما كان بمصر لأسباب نعلمها جميعاً، أما الآن فقد اجتاز خطابه حدود التحدث في الأمور الاجتماعية والدينية ليتحدث في الأمور السياسية.. وأنا كنت أنتظر هذا التطور الذي بدأه ببرنامج \"حتى يغيروا ما بأنفسهم\" لأن الإسلام يشمل السياسة .. فالسياسة في الدين والدين في السياسة، لا كما يعتقد البعض.."
