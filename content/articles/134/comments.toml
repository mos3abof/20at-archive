subject = "تصحيحات"
text = "تعليقي السابق كان من المفروض أن يذهب إلى موضوع سامي يوسف<br />اكتشفت ذلك بمحض الصدفة عندما أردت التعليق على أن المؤتمر حصل بمدينة تورونتو الكندية و ليس بمونتريال كما أن حضوره كانوا قرابة ال10000 و ليس 8000 من الكنديين و غير الكنديين<br />و طابعا كان أغلب الجمهور من الجالية العربية<br />المتابع للترجمة يلاحظ أن المحتوى تضيع قيمته الدعوية عندما ينتقل إلى وسيلة مكتوبة<br />فعمرو خالد تكمن قوته في كونه ملق بارع و عندما تنتفي صفة الإلقاء تنتفي القوة الحقيقة<br />هذا ما رأيته عندما حضرت المؤتمر<br />و الله و رسوله أعلم"
