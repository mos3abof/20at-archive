[[comments]]
order = 33
subject = "عمرو خالد يتاجر بالدين"
text = "ماهو خلاص، صار اي شخص حافظ حديثين و آية و نص مفتي! اذا ماكان مفتي، بصفة ايه بيطلع بالفضائيات؟<br />استحي يا سه عمرو! قول للمسلمين السبب الحقيقي اللي خلاك تسيب مصر!!!<br />هايطلعلي ألف اهبل يقلي الله يهديك بعمرو خالد! يا أغبياء!! الله يقول في القرآن (إنك لا تهدي من أحببت ولكن الله يهدي من يشاء)!!<br />لسة فيه من بيدافع ! البدلة الانجليزي اللي سعادتة لابسها ثمنها أكثر من الراتب السنوي استاذ بجامعة القاهرة! كل ده من فلوس الهبل اللي يشتروا شرايط التنويم المغناطيسي و النحيب و العواء و الكذب على الرسول!!<br />اتقي الله يا سه عمرو"
archived = "2005-01-02"
capture_url = "https://web.archive.org/web/20050102091704/http://www.20at.com:80/article.php?sid=445"

