[[comments]]
order = 2
subject = "نحن أحق بعيسى"
author = "الفارس العربى"
posted = "2006-04-02"
text = "أحب أعلق أن نحن المسلمون أحق بعيسى منهم فهم افتروا على الله الكذب ووصفه بصفات أعوذ بالله من ذكرها فمعنى ان فلم يخرج من مصر لحياة المسيح وهو متناول حياته من وجهة نظر الأرثوذكس هذا خطأ كبير جدا ولازم نتحرك....<br />وبالنسبة للأخ اللى فوق حسب اسلوبه فى الكلام احب ققوله ياريت ياأخى تكتب عربى أحسن مع العلم انى محترف هذا الأسلوب بس يستحسن عشان أخواننا الى مبعرفوش<br />وبعدين انت معتبرها أختلاف فى الرأى ياأخى ده عقيده وافتراء على الله ليس موضوع مطروح للمجادة أين الأنتماء لله ورسوله والقرآن (أه لو كان ده ايام الصحابه ... كنا عرفنا يعنى ايه انتماء)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133409/http://www.20at.com/article2.php?sid=647"

[[comments]]
order = 3
subject = "يا خوفى"
author = "نيفين"
posted = "2006-04-02"
text = "انا بحيى الاخ اللى كاتب بالنجليزى فوق على سغه صدره و عقله الكبير<br />و بقول لصاحب او صاحبه اول تعليق ليه كده<br />انا مسلمه برده بس ايه المشكله اننا نشوف الفيلم زى ما شفنا الام المسيح<br />مش معنى اننا نشوف الفيلم يبقى نصدق كل اللى فيه<br />احنا بناخد اللى يناسب عقيدتنا و نسيب اللى بينافيها<br />معايا يا اكرم<br />كنت ف موضوع الابراج عايزه اقوللك ان ممكن يحصل خناقه زى بتاعه الاخوان ×وحيد حامد<br />هنا اراهنك يا اكرم الخناقه هتكون اكبر<br />ليه المشاكل دى يا عشرينات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133409/http://www.20at.com/article2.php?sid=647"

[[comments]]
order = 4
subject = "نحن أولى بعيسى منهم"
author = "مناضل أنترنتى قديم"
posted = "2006-04-02"
text = "السلام عليكم ورحمة الله و بركاته<br />بدون تعصب او أى تشنج<br />يقول تعالى لقد كفر الذين قالوا إن الله هو المسيح<br />هذا قول الله تعالى من فوق سبع سموات فهل فوق قول الله قول انا لا أعارض أن يتم انتاج فيلم عن النبى العظيم عيسى عليه السلام بالعكس أنا فى غاية السعاده أن يحدث ذلك<br />لنعلم الأجيال قصة المعجزه التى أصطفى الله بها مريم العذراء سيدة الأطهارعلى نساء العالمين لتلد عيسى من غير أب أكرر من غير أب من غير اب<br />و لكن هل هذا الفيلم سوف يرسخ هذه الحقائق بالطبع لا فالكاتب نصرانى و سوف يعضض المفاهيم النصرانيه بأنه عليه السلام قد صلب<br />يقول تعالى و ما قتلوه و ما صلب و لكن شبه لهم<br />و الشىء المحزن فعلا كما أشار الأخوه السابقون أن هذا يحدث فى مصر أرض الأزهر و أحدى قلاع الأسلام<br />أريد أن أقول شىء أخير<br />التسامح من الأخلاق التى أرساها حبيبنا محمد صلى الله عليه و على أله و صحبه وسلم و لكن التسامح لا يعنى أن نتنازل عن ثوابت عقيدتنا و أن نؤكد مفاهيم غير مسلمه مثل صلب المسيح و بنوة المسيح وما غير ذلك إلى الأستاذ محمد عشوب و الأستاذ سمير سيف أتقوا الله<br />و اتقوا يوما ترجعون فيه إلى الله<br />السؤال الذى يفرض نفسه هل يسمح الأستاذ فايز غالى ان يكتب فى السيناريو أن المسيح عيسى أبن مريم لم يصلب و أنه حى يرزق و سوف يهبط إلى الأرض ليقتل الدجال<br />إذا كانت الأجابه لا فلماذا يطلب منا نحن المسلمون أن نقبل غير ذلك بدعوى التسامح الذى لا أعترض عليه أبدا<br />اللهم إن كنت أصبت فمن عندك أنت وحدك و إن كنت أخطأت فمن نفسى و من الشيطان فأغفر لى فأنه لا يغفر الذنوب إلا أنت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133409/http://www.20at.com/article2.php?sid=647"

[[comments]]
order = 5
subject = "تنويه و أستدراك"
author = "مناضل أنترنتى قديم"
posted = "2006-04-02"
text = "السلام عليكم و رحمة الله وبركاته<br />كتبت خطأ فى تعليقى قوله تعالى<br />وما قتلوه و ما صلب و لكن شبه لهم<br />و الايه الصحيحه هى<br />وما قتلوه و ما صلبوه و لكن شبه لهم<br />و نسيت أن أكمل قوله تعالى<br />لقد كفر الذين قالوا إن الله هو المسيح<br />و الصحيح هو<br />لقد كفر الذين قالوا إن الله هو المسيح عيسى بن مريم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133409/http://www.20at.com/article2.php?sid=647"

[[comments]]
order = 6
subject = "الفت نظر السعادة لنقطة"
author = "عبدالله مفتاح"
posted = "2006-04-02"
text = "الموضوع ان مش موضوع اختلاف في الاديان الموضوع ان عيب جدا ممثل يقوم بدور نبي بغض النظر عن الاسلام والمسيحيه<br />بس عيب جدا ممثل يعمل دور نبي<br />انا مش متخيل ان نبي يعمل دوره ممثل<br />عيب جدا جدا جدا<br />وانا متفرجتش على الفيلم الاجنبي لاني مقدرش اشوف ممثل بيقوم بدور نبي<br />يا جماعه ده نبي عارفين يعني ايه نبي يعني ربنا اختاره في فترة لتبليغ رساله<br />نروح احنا مخلين ممثل (مشخصاتي) يعملنا فيها نبي؟<br />عيب جدا الانبياء ليهم احترام مينفعش نعمل الفيلم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133409/http://www.20at.com/article2.php?sid=647"

[[comments]]
order = 7
subject = "بكره ياما نشوف"
author = "sweet_princess"
posted = "2006-04-03"
text = "ياجماعه اللي بيحصل دا عيب اوي ..<br />ولا احنا مابنتحركش الا عشان اهانة النبي وحده ..<br />مش سيدنا عيسى نبي كمان ..<br />ومن صميم ديننا اننا نؤمن بيه وبوجوده كنبي ..<br />ولا الفذلكه والكلام الفارغ وقلة الادب تحت مسمى حرية الاديان هي اللي بقت بتحكمنا ..<br />حقيقي والله حرام .. اما تجيب بني ادم عادي ليه اخطؤه زيه زينا .. وترقى بيه الى مكانة نبي كريم زي سيدنا عيسى ..<br />وانا رايي لو اتعمل فعلا فيلم عن نبي انه يمشي باسلوب الروايه ..<br />يعني يكون فيه راوي بيسرد الاحداث ويتكلم عنها ويشرح اللي كان بيحصل ..<br />لكن تجيبولي عالم جاهله عماللين يقولو انه كان اله وكلام من دا .. يبقى عيب علينا اوي كمسلمين ..<br />انا اول ماعرفت الموضوع دا كنت متاكده انه موضوع فاشل من اساسه ..<br />الهي يارب الموضوع دا يفشل ومايلاقيش اللي يعمله ..<br />وربنا يهدي المنتج اللي جتله لوثه في دماغه ووافق وهو مسلم انه ينتج فيلم بالشكل دا .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133409/http://www.20at.com/article2.php?sid=647"

