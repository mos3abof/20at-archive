text = "السلام عليكم ورحمة الله وبركاته انا بقول ان المسيحيين والمسلمين يعتبرو مصريين بس مش اخوات لية لاان المسيحيينلم يؤمنو بسيدنا محمد ويقولون ان عيسى ابن الرب ويقولون انه صلب لا لا لا لا كل دى مفاهيم خاطئة واعتقد انكم سوف تحاسبون عند اللهحسابا عسيرا ايها السيدة المسيحية ايها السيد المسيحة مفاهمكم دى عليكم انتو بس مش هتقدرو تفرضوها على المسلمين لانهم ربنا هداهم وليس افضل من هدى الله الا هدى الله انما انتم راكبين دماغكموناشفى زى الحجر وساعةما تعرضون على الله يوم القيامة هتقولو ساعتها يارب احنا اتخلقنا لقينا اهلنا على الديانة النصرانية ربنا ههيقولكم ان سيدنا عيسى قال لكم ان فى روسول هييجى من بعدى اسمه احمد وانتم مصدقتوش وكمان اكبر كفر عندكم انكم جعلتم عيسى علية السلام ابن الله الا تعلمو انه بشر من لحم ودم بس ربنا بعثه لقوم بارعون فى الطب فقام الله بئبتلائه معجزات الطب وانتى يا انسة من حق المسلم انه يقولمصر دولة مسلمة فعلا لانها مسلمة وكلنا مسلمين وانتومكانكو فى امريكا اللى بتدينا معونات بس الحمد لله الحرمية الكبار هما اللى بييخدو المعونات دى يعنى احنا بعيد عنهم وخللى امريكا تنفعك ويوم القيامة يارب اقابلك عشان ساعتها اقولك ان الاسلام هو الحق وانتم فى الجحيم الا اذا دخلتم فى دين الاسلام يارب المسيحيين المصريين ينقرضو مدام فى امثالكم ياللى بتعارضو المسلم فى كلامه وانتو عارفين ان ديننا على حق بسمرتاحين فى دينكم عشان مفيهوش عبادات سعنى كوسة عندكم لانكم حرفتووه وسلميلى على البا با"
