[[comments]]
order = 9
subject = "سلام"
author = "السلام عليكم"
posted = "2006-04-03"
text = "احب اضيف نقطة للاخوة اللي بيقولوا لا مانع من مشاهدة الفيلم مادام احنا مش هنصدق اللي فيه<br />للاسف يا اختي و يا اخي ، انا فعلا زيكم بقول نفس الكلام ، و قلت انه المسلمين عارفين قصة عيسى عليه السلام الصحيحة فده مش هيضرنا<br />أتفاجا بعد عرض الفيلم بمدة انه في اتنين من الناس اللي حواليا فاهموا قصة المسيح عليه السلام من مشاهدتهم للفيلم ؟؟؟<br />و في نقاش جماعي ، لما ذكر عيسى عليه السلام اللي قالوه عنه كان اللي شافوه في الفيلم ؟؟؟<br />عرض الفيلم مش حاجة صحيحة ابدا<br />و لا يجب ان نعتمد على فكرة اننا عارفين عقيدتنا و الناس نفسها لازم تعرف عقيدتها صح و خلاص نقف على كده<br />لا ابدا ، العقيدة ممكن تهتز و الناس ممكن عقيدتها تتغير من فكرة او صورة او كلمة تقال امامها و لا ننتبه لصحتها او انها تمس العقيدة<br />و احنا مش لازم نعرض للناس حاجة فيعا خطا او تخالف العقيدة و نقول للناس لا تصدقوها و لا تتقبلوها و التزموا بعقيدتكم<br />ما نعرضوش احسن ، و ده رأيي الشخصي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133409/http://www.20at.com/article2.php?sid=647"

[[comments]]
order = 10
subject = "مالكم انتو"
author = "ماياا"
posted = "2006-04-03"
text = "يعنى انا بجد مش عارفة انتو فية اية ؟؟؟<br />مالكم ؟؟؟<br />سورى يعنى هى مصر مفهاش غير المسلمين ولا اية ؟؟؟ مافيها مسيحيين وكتير كمان<br />وبعدين محدش غصبكم وقالكم احضرو الفلم دا اللى مش عاوز يحضر الفيلم بلاش واللى عاوز يحضرو اهلا وسهلا<br />احنا بردو بشر ولينا نفس يكون تبعنا افلام تتعرض عن السيد المسيح زى مانتو عندكم افلام دينية كتير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133409/http://www.20at.com/article2.php?sid=647"

[[comments]]
order = 11
subject = "الحرية في سبيل الله"
author = "كرميلينو"
posted = "2006-04-04"
text = "هل ناك فرق بين حرية الفكر و حرية الكفر ؟؟؟؟<br />ستولون لي الله تعالى قال ( و من شاء فليؤمن و من شاء فليكفر ) و نسكت على كده زي قوله تعالى ( فوبل للمصلين ) و نسكت برضه<br />يا جماعه مينفعش<br />المسلم الحق لا يؤمن بحرية الكفر و نعود لايه الحرية المزعومة و نقرأها من جديد و لكي نستطيع ان نفهمها يجب ان نقرأ ما قبلها و ما بعدها ( وَقُلِ الْحَقُّ مِن رَّبِّكُمْ فَمَن شَاء فَلْيُؤْمِن وَمَن شَاء فَلْيَكْفُرْ إِنَّا أَعْتَدْنَا لِلظَّالِمِينَ نَارًا أَحَاطَ بِهِمْ سُرَادِقُهَا وَإِن يَسْتَغِيثُوا يُغَاثُوا بِمَاء كَالْمُهْلِ يَشْوِي الْوُجُوهَ بِئْسَ الشَّرَابُ وَسَاءتْ مُرْتَفَقًا )<br />هل يظن اي عاقل ان هناك مجال للاختيار<br />فاذا قلت لك اشرب الدواء او لا تشرب فانك ان لم تشرب الدواء فسوف تموت<br />هل اكون قد اعطيتك الاختيار ؟؟؟<br />ان الايه كما هو واضح من اسلوبها هي اسلوب تحذير بطريقة تهكمية على وضع الكافر الذي يريد ان يهلك باختياره<br />الرسالة واضحة و شكرا لكم جميعا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133409/http://www.20at.com/article2.php?sid=647"

[[comments]]
order = 12
subject = "ايه اللىانا بقراه دة !!!!!!!!!!!!!!!"
author = "هابى"
posted = "2006-05-20"
text = "انا بد بجد مصدومة من طريقة المناقشة و كل اللى قريته فى الصفحة! ايه التعصب دة و كل اللى يقول وجهة نظرة يلاقى اللى مستنيه علشان يشتمه ! انتم كدة فى خناقى مش فى مناقشة! و بعدين ايه الذوق و الأدب اللى كان الأخ بتاع احنا بلد مسلمة و اللى مش عاجبة يمشى من هنا و يروح بلد تانية ! هو احنا قاعدين فى بيتك و بعدين مين اللى قال ان مصر بلد إسلامى هل دى حاجة معلنة دولية و لا احنا بنقى كويسيين لما بنيجى نمد ادينا و ناخد فلوس من أمريكا؟! و بعدين ايوة احنا كمان لينا الحق فى مشاهدة افلام تعبر عن عقيدتنا و لو انت واثق اوى كدة من تدينك يبقى مش حيغير فيلم ولا ايه ؟؟؟ خليك واثق من نفسك احسن بدل ما تحاول تتفزلك علشان تبين خوفك و اعمل زى النبى محمداللى كان متسامح مع النصارى و اليهود و خليه قدوة ليك و لغيرك و لا هو كلام و بس ؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133409/http://www.20at.com/article2.php?sid=647"

[[comments]]
order = 13
subject = "اقرأوني"
author = "نادر"
posted = "2006-08-02"
text = "ياة يا جماعة اية الكرة دة فين المحبة فين التسامح ؟ فين ؟انت كدة صورة لدينك علي فكرة احنا واخدانا السكينة بالاهتمام بالدين و العلاقة المتوترة الي بينا و البلد كلها نزاع و الناس تعبانا و شوية و ممكن نلاقي امريكاو غيرها بيتدخلوا اكتر و اكتر و الاخ الي بيقول ان مصر بلد مسلمة معاك لان الاغلبية مسلميين بس لو قريت في التارخ و شكلك بتقري هتلاقي مصر قبطية و مع ذلك زمان الناس كانت عايشة في محبة و سلام مش زينا بننهش في لحم بعض اية الدنيا دية اية كل الكرة و الحروب .."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133409/http://www.20at.com/article2.php?sid=647"

[[comments]]
order = 14
subject = "؟؟؟؟؟؟؟؟؟؟"
author = "نادر"
posted = "2006-08-02"
text = "عاوزين نبقي بلد متحضرة في طريقة المناقشة و في الحوار انت قريت القرآن و فهمت و اقتنعت ماشي بس لازم تشوف وجهة النظر من الناحية الثانية. انا بحيي الناس المتحضرة الي قالوا يشوفوا الفيلم و الي يناسبنا نقبلوا و الي ماينسبناش نسيبه دة الصح و المسيحية عمرها ما اجبرت حد علي حاجة و لا حتي انه يدخل المسيحية و لا بأي طرق غير مشروعة و ارجو فهم ذلك لان الصح مش الاجبار لا الاقتناع من جوة القلب . اد اية انا برتاح لما بلاقي اخ مسلم او مسلمة قصدي مصري او مصرية خايفين علية و اقفين معايا مش ضدي احنا لية ناس ناسيين هويتنا احنا ولا مسلمين ولا مسيحيين لا احنا مصريين صدقوني دة مش كلام انساء لا دي المفروض الحقيقة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133409/http://www.20at.com/article2.php?sid=647"

[[comments]]
order = 15
subject = "حرام عليكم يا نصارى"
author = "احمد"
