order = 0
subject = "قمة البتينجان...هي نالقصة هبل"
author = "فعلا والله بجد.....قمة المسخرة انك تلاقي مسلمين هبل قاعدين قدام فيلم الام المسيح وهما نازلين عياط وهما شايفين سيدنا عيسى بيتصلب ....وهو بيدعي ابوه وبيقولوا انقذني يا ابي ...وابوه بقى يعيط بدمعة من السما.......طبعا لا سيدنا عيسى هو اللي مصلوب فهذا عكس عقيدة الاهبل اللي بيعيط....ولا ربنا يبقى ابوه زي ما قال القرآن اللي مبتقراهوش الهبلة المسلمة اللي نازلة بكاء."
posted = "2006-04-01"
text = "وتكرار التجربة على رواية الرثوذكس سواء ...وهما كلهم انيل من بعض.....سواء طلعوا سيدنا المسيح اله او ابن الاله او ثلث الاله......كل دا لابد ان ينفر منه ويهاجم....انت بتعمل فيلم يخالف عقيدة معظ الشعب ...يضرب عقيدة 70 مليون مسلم في الصميم.<br />متهيألي الازهر لاز يتحرك....لاما يبقى مؤسسة عفا عليها الزمن وتقعد تستريح بقى."
archived = "2006-11-02"
