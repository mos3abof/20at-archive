[[comments]]
order = 0
subject = "تحابا في الله"
text = "يقول النبي صلى الله عليه وسلم: ((سبعة يُظلهم الله في ظله يوم لا ظل إلا ظله: إمام عادل، وشاب نشأ في عبادة ربه، ورجل قلبه معلق في المساجد، ورجلان تحابا في الله اجتمعا عليه وتفرقا عليه، ورجل طلبته امرأة ذات منصب وجمال فقال: إني أخاف الله، ورجل تصدق فأخفاها حتى لا تعلم شماله ما تنفق يمينه، ورجل ذكر الله خاليا ففاضت عيناه)).<br />**( شاب نشأ في طاعة ربة، و رجل قلبه معلق بالمساجد، و رجلان تحابا في الله اجتمعا عليع و تفرقا عليه..)**<br />انا شخصيا صداقاتي من داخل و خارج المسجد و بعتز بالأثنين جدا...بس مش ملاحظين حاجة في حديث رسول الله \"ص.ا.ع.و.س\"...!!<br />عارفين أحلى حاجة أية..اننا نكون صداقات في أي مكان و نحاول على قدر المستطاع إننا ندخل بيها المسجد..يعني اللي ميعرفش السكة نعرفهاله..و نبقى بأذن الله جمعنا بين الاتنين..( اللهم يجمعنا جميعا تحت ظله، يوم لا ظل إلا ظله)."
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529054058/http://www.20at.com:80/article.php?sid=186"

[[comments]]
order = 1
subject = "مش عارف"
text = "طبعاً موضوع جميل و منسق بس عندي حبة تعليقات<br />اولا مش كل اصدقاء المسجد ملايكة<br />ولا كل اصدقاء الشارع شياطين<br />بس الاحسن ان الواحد يصاحب اللي عايزه و يحط قدامه طاعة ربنا سواء مع الجيران و لا القرايب او في الكلية او في الشغل<br />احنا مش هنقعد طووول اليوم في المسجد فاحنا لازم نصاحب الناس كلها و ناخد بأيديهاللصواب<br />و لو شوفنا حد رايح كده و لا كده لازم نوجهه بس بطريقة كويسة لان لو الطريقة مش كويسة و فيها تهديد ممكن تؤدي الى نتائج سلبية. و ربنا يهدينا جميعاً الي الصراط المستقيم"
archived = "2004-05-29"
capture_url = "https://web.archive.org/web/20040529054058/http://www.20at.com:80/article.php?sid=186"

