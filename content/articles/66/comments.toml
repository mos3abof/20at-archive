text = "بسم الله الرحمن الرحيم<br />طبعا احنا لازم مانفصلشى فى حياتنا بره المسجد او جواه احنا حاياتنا كلها واحد جوه وبره لان فعلا مش كل من يدخلو المسجد شياطين ولا كل اللى بره شياطيناحنا نعرف كل الناس ونتخد الكويسين اصدقاء بجد والباقين نوجهم لو نعرف نعمل معاهم اى حاجه<br />رنين"
