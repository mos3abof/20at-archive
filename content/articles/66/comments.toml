text = "ما هذه العناوين التي تستخدمونها؟؟ أسلوب الإثارة هذا يمكن تقبله في الموضوعات الأخرى، ولكن أن يصل التجاوز إلى اسم الله، فهذا ما لا يمكن ان نقبله."
