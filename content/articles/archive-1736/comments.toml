[[comments]]
order = 6
subject = "حرام"
author = "مصريه"
posted = "2006-02-11"
text = "مبروك والف مبروك و مليون مبروك كفايه انا معاكم هما تعبوا بس لازم نلاحظ ان فى ناس كتييير متفوقه و بتتعب و بتفيد البلد دكاتره و مهندسين و غيرهم و بيفيدوا البلد لكن ما فيش شكرا و لا مبروك ولا اى تقدير من اى نوع و انا سمعت ان الريس كافى الاعبين بمبلغ 3 مليون جنيه<br />طب ما البلد فيها خير و برده فيها غلابه كتييير قوي مش لاقين ياكلوا و ناس بمووت من الاهمال و الحوادث بتاخد عشر الى بياخده واحد بسط الجماهير على فكره انا مش حقوده لانى الحمد لله ناجحه و ميسوره بس ببص حوليا عسان ربنا يكرمنى و ربنا يصبر الالف عيله الى مات عائلهم فى العباره و انا بناشد الدوله بدل التعويض تاخد ولادهم تمرنهم عشان يبقوا لاغيبه كبار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114239/http://www.20at.com/article2.php?sid=412"

[[comments]]
order = 7
subject = "مبارك وولده جمال ( ننوس عين امه )"
author = "أكرم"
posted = "2006-02-11"
text = "يعني مبارك قعد ورا ستار زجاجي مضاد للرصاص و القذائف مش عاجبكم جمال قعد في مدرجات الدرجة الدرجة الاولى هو و علاء و مراته و ابنه العسوله الصغير مش عاجبكوا امال عايزين ايه ؟؟؟<br />يا جماعه الحركة بتاعت جيمي دي خليتكوا مش عارفين تقولوا ايه ؟؟<br />على فكرة انا بكره جمال موت بس الحركة اللي عملها دي عجباني اوي حركة معلم بصحيح و ياريت كنا نشوف المرشد العام و لا جميلة اسماعيل و لا حتى محمود اباظة في الشارع و لا في المدرجات<br />مشكلة كل رجال السياسة انهم فاكرين انهم مع الجماهير بقفاهم بس<br />و بالمناسبة بدام طولت عليكوا استحملوني بقا<br />في مذكرات محمود السعدني في المعتقل في كتابه (الطريق الى زمش) كان بيقول ان زعماء الحزب الشيوعي كانوا دايما بيقولوا الجماهير هتعمل ثورة ضد نظام عبد الناصر الفاشي و هتهجم على المعتقل و تطلعنا زعماء للشعب و لتحيا طبقة البوليريتاريا العاملة<br />و سلملي على جورباتشوف<br />و لما طلعوا من المعتقل في الستينات لقوا الشعب بيغني لعبد الناصر و بيغني للاشتراكية برضوا معجبهمش و قالوا الاشتراكية لا يطبقها البرجوازيون لازم احنا اللي نطبقها رغم ان زعماء الحزب الشيوعي المصري كانوا من عائلات ارستقراطية و باشوات كمان<br />ااقول تاني و لا كفايه ؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114239/http://www.20at.com/article2.php?sid=412"

