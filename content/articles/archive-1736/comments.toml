text = "بسمم الله والصلاة والسلام على اشرف خلق الله اجمعين<br />ارى ان الرئيس المبجل ليس محتاج الى كل هزا ليثبت شعبيتة او ليعين نجلة<br />ولكن هو يوصل الشعب الى مرحلت الاختناق ليثبت لامريكا اننا ارهاب ليجدو مبررا لحتلال مصر بعد سوريا وايران<br />وشكرا والله ادرى واعلم"
