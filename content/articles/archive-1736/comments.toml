[[comments]]
order = 9
subject = "يخرب بيتهم جميعا"
author = "خالد"
posted = "2006-02-11"
text = "ربنا ياخدوهم جميعا بحق جاة النبى الراجل المتخلف قاعد عمال يتفرج على متش كورة و سابي ولاد شعبة يموتوا فى المنيا و ماحدش عارف اية اللى حصل؟ و ساب 1000 نفس تموت فى العبارة و ماحدش سال مين المسؤل و لا حد راضى اهل الضحايا و من قبل كدة الناس تموت فى القطر بتاعالصعيد و لا حد اتحرك<br />اية دة معقول الشعب اصبح هو ارخص حاجة فى مصر كدة؟؟؟؟؟؟؟؟<br />حسبنا اللة و نعم الوكيل<br />و شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114239/http://www.20at.com/article2.php?sid=412"

