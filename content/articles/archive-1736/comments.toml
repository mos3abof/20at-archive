[[comments]]
order = 3
subject = "ستاد العيلة"
author = "BATISTUTA"
posted = "2006-02-10"
text = "عندما ذهب مبارك الى مباراة الافتتاح تمنيت الا تأخذ مصر البطولة لاننا كما نعلم فى كل مناسبية مثل هذه ماذا سيقول المنافقون والأفاقون من<br />ان فوز مصر بالبطولة حدث بناء على توجيهات الزعيم مبارك وولديه زعماء مصر بالباطن كان مبارك هو الذى كان يلعب لذا اتمنى الا تأخذ مصر البطوله<br />بسبب هؤلاء معدومى الضمير الذى لم يتأثر أحد منهم بما حدث للعبارة ولم يتحرك حتى من باب حفظ ماء الوجه بل تركوا الامن المركزى يتولى المسئولية حتى الشعب المصرى لم يعد يبالى هو الاخر<br />وكأنه اصيب بعدوى المسئولين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114239/http://www.20at.com/article2.php?sid=412"

[[comments]]
order = 4
subject = "ولو"
author = "سوسة المفروسة"
posted = "2006-02-10"
text = "اصلا كل العلاقات العامة اللي ورا جيمي دي في منتهى الغباء....زهقونا منه و كرهونا اكتر و اكتر فيه خصوصا فى البرنامج بتاع شوبير ع القناة التانية .كل دقيقتين يجيبوا اغنية نانسي عجرم الجديدة و عند كلمة (انا مصري و ابويا مصري ) يجيبوا صورة جيمي و بابا حسني و في كل الماتشات لازم الكاميرا تيجي عليه 14 الف مرة..مش عارفين ان الموضوع بيجي مع المصريين بالغكس يعني بدل ما نتعود عليه هنزهق منه و نكرهه اكتر واكتر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114239/http://www.20at.com/article2.php?sid=412"

