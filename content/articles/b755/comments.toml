[[comments]]
order = 4
subject = "صفة فطرية"
author = "هشام"
posted = "2006-05-15"
text = "بلا شك ان الفضول هو احد سلبيات النفس البشرية ..<br />ويجب على الفرد منا تلافية او على الاقل<br />التوسط والاعتدال فية<br />فلا تكن فضولى بدرجة تستفذ من حولك<br />ومن المعلوم ان هناك كثير من الاسرار اكتشفت بداف الفضول<br />كاكتشاف علاقة بين فردين<br />وهكذا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133937/http://www.20at.com/article2.php?sid=755"

