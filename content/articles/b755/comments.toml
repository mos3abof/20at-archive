[[comments]]
order = 1
subject = "ليس كل فضولي يموت مقتول"
author = "سنووايت"
posted = "2006-05-02"
text = "الفضول الإنساني هو الدافع الذي حرك كل العلماء لمعرفة الظواهر الطبيعية ودراستها وما نتج عنه من اختراعات افادت البشرية<br />الفنان أيضا يكون فضوليا حيال ألوان الازهار - حائرا تجاه عبقرية الكون في الربيع - وعبقرية البشر وهم يمارسون طقسا كصبغ الدنيا بقلوب حمراء وفوانيس في رمضان المهم الفضول المفيد في أن نعرف - وتبقى الاشكالية كلها في \" كيف نعرف!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133937/http://www.20at.com/article2.php?sid=755"

[[comments]]
order = 2
subject = "فضولى بالفطرة"
author = "Adham & Jamela"
posted = "2006-05-02"
text = "الانسان فضولى بالفطرة ... ولكن يجب ان يضع حدود لفضولة ولا يتدخل فيما لا يعنية, فالفضول مفيد فى المجالات العلمية , ويتغير معنى الفضول تماما اذا كان تدخل فى حياة شخص اخر لمعرفة اسرارة .. فيصبح رخامة<br />بس ممكن يكون الفضول القليل عن حياة شخص معين اهنمام بهذا الشخص وليس فضول لمجرد الفضول .. مش زى القطة يعنى !!<br />ولكن الفضول الزيادة عن اللزوم فعلا وحش وممكن يضر صاحبة ويخلى الناس تكرهة .. انا عن نفسى مش بحب الفضولى الرخم<br />ومش بحب القطط كمان .<br />يأأأأأأه ... نفسى اعرف الراجل اللى فى الصورة دة بيبص على ايه جوة !!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133937/http://www.20at.com/article2.php?sid=755"

