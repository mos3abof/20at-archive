subject = "الفاجومي"
author = "عاشق زنوبة"
posted = "2006-08-30"
text = "عليا الحرنكش يا ريس مبارك<br />في عصر مزركش ملون بنارك<br />لأبايعك وأبايع حكومة حمارك<br />ملعون أبو اللي يقدر يقاطع قرارك<br />نهارك مقندل وليله مبارك<br />فهمبك وهجس وطلع في روحنا<br />اكيد روحنا طالعة تشاهد جمالك<br />جمالك مبارك وسوزانك سوزانا<br />يا محلا حصارك لمصر اللي جالنا<br />أؤيد وأبايع فخامة جلالتك<br />وأؤيد أي واحد بيمسح ريالتك<br />ولأنك سر باتع حننسي هبالتك<br />علي تل مصر يا ريتك تهيص<br />خرابة فسيحة عليها متيس<br />وأأمر تتطاع فشعبك مهيس"
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902114316/http://masr.20at.com:80/article.php?sid=851"

