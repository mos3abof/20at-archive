order = 1
subject = "صحفي تحت التمرين"
author = "أكرم جارك"
posted = "2006-02-16"
text = "كلام صحيح 100 في ال100<br />هي صحيح مصر ام الدنيا بس احنا عندنا الصحافة مهنة للسبوبة و نفاق الحاكم و بوس ايد السلطة و نافق الحزب الوطني هازما و مهزوما<br />اكتر العناوين التي اضخكتني مانشيت جريدة الجمهورية صبيحة يوم اعلان النتيجة للمرحلة الاولى للمرحلة التانية للانتخابات المصرية بعد فوز 11 من الاخوان مقابل 4 للوطني + كمال احمد و دخول 38 اخواني اعاده<br />تخيلوا العنوان كان ايه ؟؟<br />الوطني يتقدم و الاخوان يتساقطون<br />شوف قد ايه الصحفي بقا بيزيف الحقايق و معتمد عل معلوماته من امن الدولة و خططه قبل الانتخابات اصلا<br />انا رايي ان مفيش صحافة في مصر الا المصري اليوم و الدستور و صوت الامة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144918/http://www.20at.com/article2.php?sid=447"
