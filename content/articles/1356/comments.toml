subject = "و الله ربنا يبارك"
author = "ام عزت"
posted = "2006-05-21"
text = "السلام عليكم و رحمة الله وبركاته<br />دايما يا رب السعودية بلد الأطهار دايما طهارة يا بلد رسول الله صلى الله عليه و سلم ربنا يبارك فيكم و يحفظكم يا اهل الحرم ربنا يحفظ بناتكم يا رب و يطهر بلادكم و بلدنا جميعا<br />الى كل اهالي السعودية احبكم في الله<br />مصرية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142753/http://www.20at.com/article2.php?sid=828"

