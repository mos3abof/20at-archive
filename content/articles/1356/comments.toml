[[comments]]
order = 3
subject = "شباب عاطل وعازب ، ماعساه أن يصنع؟؟"
author = "إن القضاء على ظاهرة المعاكسة ، لا تكمن في العقوبة فحسب سواء أقرت من قبل الهيئة او القاضي ."
posted = "2006-05-22"
text = "الحل الامثل هو علاج الظاهرة بتجفيف منابعها(على فكرة ال سعود مشهورين بنظرية تجفيف المنابع ، فلما لم تطبق هنا؟؟!!) ، ومنبعهاهو الفراغ والعزوبية ، إذا الحل يسير ، أشغل الشباب بما ينفع وزوجهم باكرا.<br />المجرم الذي ينبغي أن يطبق عليه أشد العذاب هم ال سعود(أسأل الله أن ينزع ملكهم عاجلا) الذين سرقوا أموال الشعب ، فتركوه عاطلا معدما ، وليت ذلك فحسب بل زادوا عليه بأن أشاعوا الفاحشة في المجتمع المسلم (فلا تسل عن قنوات العهر والفجر المدعومة من قبلهم)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142753/http://www.20at.com/article2.php?sid=828"
