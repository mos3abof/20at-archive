[[comments]]
order = 0
subject = "السعودية تانى ؟"
author = "مش عارف هوا الموقع اشترتة السعودية كعادتها كلما حاولت لجمالاعلام العربى عموما لان موضوعات السعودية بقت كتيرة قوى على فكرة فين السودان مثلا او المغرب او تونس او لبنان"
posted = "2006-05-21"
text = "اشمعنى السعودية<br />نرجع للموضوع السخيف المكتوب ولى ملاحظات<br />1-مالفرق بين المحكمة ( الشرعية ) وهيئة الامر بالمعروف والنهى عن المنكر يعنى على حسب المعلن ان الاتنين يتبعوا شيوخ الدين<br />2-هل المقصود هوا تغيير فى نظام العقوبة او المقصود اعطاء من يقرا دروس فى الاخلاق اقصد ان تغيير نظام القضاء فى اى دولة فى العالم لايستوجب التبرير<br />3- هل التبرير يعنى ان هيئة الامر بالمعروف لم تقم بعملها او ان عملها لم يعطى نتيجة الامر الذى باتتغيير نظام العقوبة معة ضروريا<br />4- مع تغيير وجهة نظر الحكومة السعودية فى معطيات كانت تعتبرها الهيئات الاسلامية فى السعودية رجسا من عمل الشيطان مثل عمل المراءة واختلاطها بالرجال ودعوة الكثير لقيادة السيدات السعوديات للسيارة وظهور منتديات بها الكثير من سيدات الاعمال السعوديات الا يعتبر كل ذللك<br />مناقضا للحديث عن وجوب احتشام المراءة والقضاء على شباب النواصى فكيف نقوم شباب ونحن نسمح لهم بالمذيد<br />4- اخيرا هل الموضوع كلة اعلاميا والمقصود منة التعتيم على الانفتاح المتوقع بعد اتفاقية الجات ( منظمة التجارة العالمية )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142753/http://www.20at.com/article2.php?sid=828"

