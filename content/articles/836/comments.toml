[[comments]]
order = 14
subject = "اوكى يا عبد الله و لكن"
author = "نيفين..نيفى..نوفا"
posted = "2006-06-03"
text = "و الله يا هبهوب مع ان انا ة عبد الله الحمد لله بنتلاقى فكريا كتير برده ساعات مبيفهمنيش<br />عبد الله فيه ناس لسه بيقدروا يبقو اخوات فعلا<br />و ده عن تجربه ادامى و فعلا حاصله<br />ة علشان مدوش الناس معانا انا هبفى ابعت للك ايميل اوضحللك فيه شويه حاجات و اكمل كلامنا اللى مكملش (كالعاده)و بالمره اساللك عن حاجات قى المدونه بتاعتك<br />على فكره المدونه حلوه و عجبنى فيها حاجات"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

[[comments]]
