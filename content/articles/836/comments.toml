subject = "حاجة برضة حصلتلى"
author = "مشمشة"
posted = "2006-06-03"
text = "كنت فى سنة اولى جامعة وكان تانى يوم حيحصل فيه كسوف للشمس فدخلنا واجد وشة منور كدة بس بصراحة مش عارف يتكلم واللى غاظنى اكتر ان كل شويه موبايله يرن ويكنسل ويرن ويكنسل حوال 4 مرات وعمال يقول بقى ان احنا نفتكر قدرة ربنا وان لازم نصلى فى اليوم دة وكلام من دة وفى الاخر ماقلش ازاى اصلا صلاة الكسوف دى بتتصلى!!<br />يالا سلامو عليكو"
archived = "2006-11-02"
