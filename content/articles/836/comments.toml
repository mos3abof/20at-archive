text = "السلام عليكم الى الاخت التي تكلمت عن الصداقة التي يسميها البعض بانها بريئة<br />صدقيني يأختي لا الأن لابعدين راح تكون في صداقة بريئة بين شاب وفتاة وانا أدعوك الى الابتعاد طبيعة التسامح المسيحية<br />والتدقيق في الواقع كنت اسأل اصحابي عن سبب مصاحبتهم لفتياة صفنا فكان الجواب ه التسلية وأنه لا يحترم فيها شيء سوى غبائها ومن ثم يقسم أنه لو كانت أخته لقتلها ..."
