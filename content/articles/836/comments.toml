[[comments]]
order = 17
subject = "مش عارف تعليقي راح فين"
author = "عبدالله مفتاح"
posted = "2006-06-04"
text = "مش عارف يا هبة تعليقي اختفى كنت رديت عليكي لقيته مختفي فهكتبهولك تاني<br />كنت بقلك في التعليق اللي اختفى اخوات ازاي<br />انا لا اقدر اكلمك في المواضيع اللي بكلم فيها اختي<br />ولا اقدر افتح معاكي مواضيع زي اللي بفتحها مع اختي<br />وفي خطوط حمراء كتيرة لو تجاوزتها ابقى بستعبط حتى لو كنت بعتبرك اختي لان اعتبرك حاجه وانتي اختي بجد حاجه تانيه<br />ومن الاول انا قلتلك ان النقاش في الموضوع ده صعب مع بنت شوفيلك بنت تكلمك في الموضوع ده وابعتيلي اتخن ولد اكلمهولك وارجعهولك بيقول ان الله حق<br />ملاحظات:<br />1- انا مش ضايف سوسه المفروسه لاني مش عارف ايميلها<br />2- هقول لنهى (نونه) انك بتقولي عليها مجنونه<br />اديني كتبت التعليق تاني يا ريت ميطرش زي اللي قبليه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

[[comments]]
order = 18
subject = "الاسلام هو الخل"
author = "فاقد يده"
posted = "2006-06-05"
text = "عن عائشة رضي الله عنها , قالت : { قال رسول الله صلى الله عليه وسلم : تقطع اليد في ربع دينار فصاعدا } وفي رواية [ ص: 131 ] لمسلم \" { لا تقطع يد السارق إلا في ربع دينار فصاعدا } .من المؤكد اذا ماطبقنا هذه الشريعة اليوم لهذا المثال فان معظم شبابنا اليوم سيكونون معاقين وعالة وهذا احد الامثلة التي يراد اليوم تطبيقها تحت شعار الاسلام هو الخل ناهيك عن مئات الالوف من الفتاوي التي ستعصف باجيالنا تحت هذا المسمى لذا اقول لكم كفانا استهزاءا بعقولنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

[[comments]]
order = 19
subject = "مش فاهماكم"
author = "الاول موضوع المتدينين اللى فى الجامعه فيهم بنات كويسين وكانو بيقولولنا لازم منخطلتش باشباب وكده واحنا اصلا شلتنا مكناش غير بنات فوجئت بعده بوحده كانت معانا وبعدين لما كملنا دراسات عليا لقيتها بتكلم الشباب وعادى يعنى"
posted = "2006-06-06"
text = "اما بقى عم عبد الله ده اللى يقول مفيش حاجه اسمها اخوه وبعدين ماخد ايميلات البنات وعمال يكلمهم<br />مالك يا عم يعنى غلط ولا صح<br />ولا غلط وانت عارف وبتعمله وعامل علينا ...<br />يالا خلتونى كرهت الموقع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

[[comments]]
order = 20
subject = "مكنتش هرد"
author = "عبدالله مفتاح"
posted = "2006-06-08"
text = "كنتي قلتي واخد ايميلات البنات تكلمهم وعامل فيها شيخ<br />عادي قولي رايك بكل وضوح مش عيب<br />بصي انا لما بقول مفيش حاجه اسمها اخوة ايوة مفيش حاجه اسمها اخوة<br />بس هو انا لما اكلم بنت على النت تبقى اختي؟<br />هو فيه اخوة من النت بردو؟<br />انا عايزك تنتقدي براحتك خالص<br />بس البنات اللي انا بكلمهم عندك اهم اساليهم انا عمري تجاوزت حدودي بدعوى الاخوة؟<br />وبعدين انا لما نيفين اتكلمت عن الاخوة كانت تقصد الواقع مش النت<br />الواقع اللي يكون فيه صعب عض البصر وبيكون فيه اي تجاوزسهل<br />مكنتش تقصد النت<br />واولا واخيرا انا مش شيخ ولا عملت فيها حاجه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

