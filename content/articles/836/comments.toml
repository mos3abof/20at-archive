text = "حيث ان معظم الشباب همه الشاغل ازاى يرتبط با لبنت دى او يخليها تعجب بيه<br />دى مشكله فعلا حقيقيه لان معظم شباب كليتى للاسف اصبحوا فارغى البال الا من التفاهات ولا يوجد اى وعى دينى او سياسى<br />شكرا للموضوع المميز"
