text = "ترجعغ اهمية قراءة القران فى المدرج والتعليق والنصيحة فىبعض الاحيان على الكثير من الموضوعات المهمة جدا فى تذكير كل منا داخل المدرج بان مازل هناك شباب فى مثل سنى مشغولين بقضايا المسلمين متمسكين بدينهم كلماسك على الجمر ويعشون حياتهم ولاكن فى طاعة اللة فلماذا لا اكون بعيدا كل ماهو تافهة واحقق حلم الحصول على الاخرة والدنيا ؟ وباختصار يجعل طلاب الاخوان اى شخص فى ان يفكر فى حياتة مرة كل قبل محاضرة ."
