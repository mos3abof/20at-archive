order = 0
subject = "سؤال انا بطرحه؟"
author = "عبدالله مفتاح"
posted = "2006-06-01"
text = "السؤال يقول هل يصاحب احدكم بالحساسيه عندما يسمع كلمة صداقة بريئة بين الجنسين؟<br />بعيد بقا عن السؤال انا كنت بحب اسمعهم وكانوا شخصيات لطيفه جدا طارق وطلعت وعمرو هما فين دلوقتي مش عارف والله<br />حد يدلني عليهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

[[comments]]
order = 1
subject = "بص بقى"
author = "مهزلة"
posted = "2006-06-01"
text = "الاخت اللى بتقول صداقة ايه وجه نظرها فى الصداقة علشان نبقى اصدقاء لازم كل واحد يفكر انه ميخدش اى مصلحة من صاحبه لكن الصداقة بيم الولد والبنت كلها مصالح خى عندك الولد اللى مقطع السمكة وديلها بيحب تكون البنات حوليه علشان يكون برم والبنات تحب تكون الملكة والرجاله بتجرى وراها<br />وعحبى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

[[comments]]
order = 2
subject = "حرية الرأي والتعبير"
author = "مطرقع"
posted = "2006-06-01"
text = "أريد أن أبدي عدة ملاحظات على هذا الموضوع:<br />1- فعلا انتقاء الشخص المتحدث مهم جداً يا شباب الإخوان، لإن مش كل الناس عندها الحد الأدنى من اللباقة والقدرة على الحديث ومخاطبة الجمهور<br />يعني كان عندنا أخ في الكلية ما شاء الله، أول ما يخش يتكلم في المدرج المكدس بألف طالب أو أكثر، كل الطلبة تسكت وكأن على رؤوسها الطير، ويتفاعلون معه ويستمعون ، ولا أجدع دكتور يعرف يسكت الطلبة كدا<br />لكن فيه إخوة آخرين مش بيعرفوا يتكلموا كويس، وطبعا بالتالي الطلبة مش بتسمع وليس من حق الإخوان طبعا إنهم يجبروا الطلبة تسمع ، فبالتالي الفيصل الوحيد هو نوعية الكلام اللي يجذب الطلبة للاستماع وطريقة إلقائه<br />2- ممكن بعض الطلبة يحس إن كلام المدرجات دا مش من حق الإخوان ، لكن للأسف كل المنافذ الشرعية مغلقة ، الكليات لا تسمح بمنابر حرة ولا تشجع ناهيك عن التمويل ، فكيف سيتحدث الناس ويوصلوا أفكارهم !؟<br />3- أدعوا طلاب الإخوان إلى إتاحة الفرصة للطالبات أيضاً للحديث في السكاشن والمدرجات<br />الدعوة ليست مهمة الرجال فقط ، وبطلوا بقى ثقافة ذكورية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

[[comments]]
order = 3
subject = "مش بس بنسمعهم ...لا احنا بنجري عشان نلحق نسمع كل كلامهم"
author = "مرمورة"
posted = "2006-06-02"
text = "بصراحه كده...انا في كليه عمليه ....يعني نظام خمس محاضرات متواصله ....مبنصدق فراغ بين محاضرتين نطلع نشم هوا برة المدرج ......لكن اول مبنلاقي حد منهم داخل يقول كلمه ...بنجري كلنا عشان نلحق نسمع كل حاجه ومتفوتناش اي كلمه من كلامه ...بصراحه كده بحس انهم من القليلين في الجامعه اللي عرفوا يلاقوا فايده تانيه للحياة الجامعيه وهيه انهم يلموا في حسنات وثواب من كل كلمه او ايه او حديث يولوه للناس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

[[comments]]
order = 4
subject = "نسيت احكيلكم حاجه"
author = "مرمورة"
posted = "2006-06-02"
text = "نسيت احكيلكم حاجه حصلتلي اول سنه جامعه واحنا لسه داخلين طازة وعيال طريه بقي مش فاهمين حاجه<br />الدكتور دخل من الباب اللي ورا في اخر المدرج وكان في اخ من التيار الاسلامي بيقرا قران<br />الطبيعي ان الولد كان هيخلص ويمشي .لكن علي مين الدكتور المحترم نزل السلم وهو بيزعق .اطلع برة يا حيوان اطلع برة يا ,,احنا فين هنا ازاي تسمح لنفسك ازاي تقف تتكلم هنا ...بره يا...<br />انا بس كان نفسي اسال الدكتور ساعتها هو كان حاسس بنفسه وهو بيتكلم وللا كان لسه نايم وللا كان شارب ميه ساقعه مبلوله عالصبح ...الطلبه كلهم بما فيهم اللي مش بيحب التيار الاسلامي تعاطف مع الولد وكره الدكتور<br />نفسي افهم ايه اللي استفاده الباشا الدكتور بزعيقه وشتيمته .حد يفهمني؟؟؟؟؟؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

[[comments]]
order = 5
subject = "انا اسفه جدا"
author = "نيفين"
posted = "2006-06-02"
text = "معلش يا جماعه على المسافه الكبيره اللى اخدتهاو اللى سببها الكمبيوتر الغبى بتاعى<br />بالنسبه لسؤاللك يا عبد الله طبيعلى اننا نصاب بالحساسيه لاننا ف الاول و ف الاخر مجتمع شرقى<br />اى علاقه بين اتنين يا زماله يا حب<br />انا مش متخلفه بدليل انى اؤمن بحاجه تالته اسمها اخوه بس دى بيبقى ليها شروط و مش كل الناس تقدر تعملها<br />اما بالنسبه للموضوع فدا حصل كتير و فعلا الشباب دول بيبقى ليهم فكر يحترم و بيبقو فعلا اصحاب قضيهبيدافعوعنها بحماس<br />و كنت بسمعهم لان على راى عمنا صلاح جاهين اى كلام يتقال بحماس يستحق انه يتسمع بحماس حتىلو كان ريانى يا فجل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

[[comments]]
order = 6
subject = "كلمه ونظرة وخبرة يا نيفين"
author = "عبدالله مفتاح"
posted = "2006-06-02"
text = "الحاجه التالته دي بقا يا نيفين اللي هي اخوة فدي بقا اللي مش تجيب حساسيه بس دي تجيب جدري<br />ليه بقا اقلك ليه لان من خلال معاشرتي لشباب من مختلف الجنسيات والاعمار واللهجات قدرت اناقش اي حد في وجهة نظره بخصوص الاخوة وكلهم بيتنرفزوا عليا مع اني مش بتطاول على حد فيهم وبكون ةهادي جدا<br />المهم ان النتيجه اللي توصلت ليها بعد خبراتي ان اللي بيقول اخوة والكلام ده بيخدع نفسه بيخدع نفسه فعلا وبيكون حاسس بالغلط<br />على فكرة يا نيفين الموضوع ده اقدر اكلم في اي ولد واقنعه لو هو عايز يقتنع<br />لكن مقدرش اقنع بنت ابدا لاني مش عارف هي بتفكر ازاي<br />بس مفيش ولد عدى من تحت ايدي كان بيقول الكلام الفارغ ده وافحمته ليه؟<br />لاني فاهم هو ازاي ممكن يفكر وعارف كل حاجه ممكن تيجي في باله لاني ببساطه شاب زيه<br />ببساطه اقدر اقول اني ولله الحمد تشربت طباع الشباب من كتر التعامل معاهم<br />واقدر اجزم بما لا يدع مجال للشك ان فعلا مفيش حاجه اسمها اخوة<br />وان القران لما قال (ولا متخذات اخدان) كان فعلا فعلا فعلا جمله رااااااااااائعه وفيها كل الحكم وفيها المختصر المفيد<br />وربنا يبعد عننا الحساسيه والجدري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

