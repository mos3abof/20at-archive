subject = "متنرفزنيش يا عبد الله"
author = "هوووووووووبه"
posted = "2006-06-03"
text = "بعد السلام علي نوفا , انت يا بني مش ضايف عندك سوسه المفروسه ونونا المجنونه ونفين وانا طب بتكلمنا علي اساس ايه مش اخوات بردو ولاه ايه هه هه .. مش عايزه افتح الموضوع دا عشان انا بشد في شعري دلوقت لما اتقرعت . ومعلش صاحب المقال لو خرجنا عن الموضوع."
archived = "2006-11-02"
