[[comments]]
order = 28
subject = "الاسلام هو الحل"
author = "السلام عليكم و رحمة الله"
posted = "2006-06-24"
text = "اولا انا اشكر طلاب و طالبات الاخوان , صحيح انهم من المفروض ينتقوا احسنهم للقول , لكن ان حدث غير هذا , فكفى ان هذا الطالب حاول ان ينشر دين الله و احتمل فى سبيل ذلك استهزاء و تريقة الطلبه عليه ,لانه لو طول حياته قال انا مبعرفش اتكلم مع الناس سيظل كما هو , ولكن هذا الطالب الغير قادر على الكلام يكفيه شرف المحاوله لا نه اكيد لما هيحاول بعد ذلك هيعرف ان يتكلم بطلاقه و المفروض علينا اننا نشجعه مش نستهزء من هذا النوع , ثانيا اننى تعجبت جدا عند قرأة التعليقات فاننى ارى ناس تنتقد الاخوان و الان عندما قرأت هذا الحوار رأيت قمة الاسفاف فى هذا الحوار مع اننا من المفروض فى العشرينات على رأى الموقع يعنى عننا عقليه تميزنا عن الاخرين و المفروض اننا نتكلم باسلوب احسن من كده , يعنى لقيت مثلا ناس بتقول \" ياض\" مع احترامى لكم ده حتى لو اخويا انا هكلمه باحترام اكتر من كده , ثانيا مع انه حوار دينى و الناس بتتكلم و ترد على بعض الا اننى وجد فى مشاركه \" الاسلام هو الخل \" محدش فكر يرد عليها , بصراحه الى كتب كده ممكن يكون من وجهة نظره انه عمل حاجه صح لانه للاسف دخل على صفحه وجد ناس بتتخانق مع بعضها فى صوره مؤسفه جدا و الاسم فقط اننا ننتمى الى الاسلام , يؤسفنى ايها الاعضاء الكرام ما حدث فعلا على هذه الصفحه , اما الذى قال ان الاسلام هو الخل , اولا ربنا يسامحه و يهديه , ثانيا الاسلام هو الحل و طول عمره هو الحل و زى ما بيقولوا لو مش فاكر الاسلام عمل ايه فى هذه الامه و اعز الناس ازاى فاحنا ممكن نفكره<br />. www.afkarmisry.blogspot.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

