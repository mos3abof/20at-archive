subject = "اكذوبة اسمها الصداقة البريئة"
author = "مارك سمارت"
posted = "2006-08-01"
text = "الصـــــداقة البريئــــة<br />هى اكذوبة ذلك الثعلب المنافق الذى جلس اسفل الشجرة يتغزل فى صوت ذلك الغراب الممسك بقطعة الجبن فى فمه لكى ما ينـغر ذلك المسكين ويبدأ فى النعـيق ولا يفيق الا وقد سقطت الفريســـــــــــة<br />هذه هى القصة وباختصار شديد فما الغراب المغرورالاضحية ذلك الثعلب وما الثعلب الا متصيد لفريسته وما المصيدة الا تلك الأكذوبة ( الصــداقة البريئـــة)<br />حتى الصداقة البريئة بين اثنين من جنس واحد هى عملة نادرة جدا جدالأنها تحتاج الى...الصدق..الأخلاص..نكران الذات..قوة التحمل..الأمانة..وذلك حتى لا يفشى الصديق اسرار صديقه فى لحظه غضب او وقت خصام...<br />مين الشاطر فيكم اللى بتتوفر فيه كل هذه الصفات مجتمعه؟!!!!اننى فى اشد الحاجه الى مثل هذا الصديق .........<br />مين قـــــــال انـــــا<br />مارك سمارت"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

