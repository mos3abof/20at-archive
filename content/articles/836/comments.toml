subject = "عبد الفتاح وهوبهstop"
author = "ibn el-ikhwan"
posted = "2006-07-04"
text = "اولا ربنا يكرمكم انتو الاتنين حليتو المشكله اخونا عبد الفتاح انت حطيت نفسك في موقف وحش خالص انت مخلصتش كل المناقشات مع الولاد اللي عالهوت والياهوو علشان تناقش بنات اكيد في بنت احسن مني ومنك تقدر تناقشهم وعلى ما اعتقد انت لو دخلت على اختك ولقيتها بتناقش عمرو خالد شخصيا مش عارف بقى هتعمل ايه اما هوووووووبه فاحب اقولك الصداقه والاخوه بين الولد والبنت اخرتها ايه متقوليش عليا رجعي ومتخلف بصي في حياة الصحابه مفيش صحابي شاب قال لواحده احنا اخوات وهنقعد شويه على كافيترية يثرب (الجامعه دلوقتي ) او نروح مع بعض نحضر درس دين دي حاجات جديده علينات اخوه ثم ترابط اخوي ثم حب اخوي ثم اعجاب ثم اخواتي البات كتروا اوىىىى ثم ...اكيد عارفه النهايه ومتنسيش اننا بطبيعتنا وسننا فينا الميل للجنس الاخر وعمرنا ما هنبقى عكس البسدشر ونقول لا دي اخوه بريئه اسف جداااااااا على اسلوبي بس فعلا محتاجين نفهم صح"
archived = "2006-11-02"
