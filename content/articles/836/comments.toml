author = "مارك سمارت"
posted = "2006-08-01"
text = "الحرم الجامعى له قدسيته ويجتمع فيه جميع الأديان..جميع البلدان..جميع الألوان..جميع الجنسيات والعقليات والمبادئ والأفكار..فعندما نقول الأسلام هو الحل فى الحرم الجامعى فما معنى هذا القول..؟واى نوع من الأسلام..؟وحل لأيه بالضبط ..؟ وانا قلنا المسيحية او اليهوديه او البوذيه او اللا دينيه..هى الحل؟؟ فأى نوع من هذه أيضا..؟ وحل لأى مشكلة ..؟اذا كان المقصود هو حل لمشكلة تعدد الأديان فكل واحد ايمانه وعقيدته غاليه عليه وكل واحدشايف ان ايمانه هو الحل..يبقى اللى بيحصل دا مش حل؟؟؟؟ دا اثاره وبلبله داخل الحرم الجامعى...لا هو حل لمشكلة تعدد الجنسيات ولا لتعدد الألوان... لأن ربنا خلق الناس كده ..امم..واجناس..والاوان..وعقائد مختلفه عشان الكل يتنافس على تقديم افضل ما عنده من خلق واعمال حسنه فيأنس اليه الجميع..ما فائدة ان اكون مسيحى ضال ومضل ...؟؟ او مسلم يسب الناس ويسب معتقداتهم..ويعصب عينيه عن فضائل الآخرين؟؟بذلك يكون ذلك البوذى الحسن الأخلاق هو افضل الجميع وعندها يقول لنا ان البوذية هى الحل..؟؟ ولا يستطيع احد وقتها ان يكابر او يتضجر لأن صدق البوذى وامانته واخلاصه لمبادئه تخجل اصحاب الديانات السماوية الذين لا هم لهم الا التناطح والتفاضل والتكابر كل منهم على الأخر...بل وصل بهم الحد الى التناحر داخل العقيدة الواحدة...الحل هو الصدق ..الصدق فى الأيمان...الصدق فى العمل..الصدق فى الحديث...وعندها سنجد الحل..................<br />مارك سمارت"
