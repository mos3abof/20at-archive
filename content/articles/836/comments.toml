subject = "أرجوكم اختاروا صح"
author = "أخ مسلم"
posted = "2006-08-04"
text = "بالنسبة للأخ مارك اللى اتكلم قبلى بصراحة أنا مقدر ربما بعض الحساسية التى قد تشعر بها عند دخول الإخوان لإلقاء كلمة دينية فى المدرج ولكن للأسف هذه هى الوسيلة الوحيدة المتاحة بعد سد كل الوسائل الأخرى .. إنتم كمسيحين بإمكانكم التلقى والاستماع بحرية لاى جهة دينية فى كنائسكم الحرة المفتوحة 24 ساعة بينما مساجدنا محكومة بالحديد والنار من الأمن وصعب جدا وصول الإخوان إليها دعك من أن أغلبيتها الساحقة يفتح قبل الصلاة بخمس دقائق ويغلق بمجرد انتهائها لتفويت الفرصة على أى صاحب فكر وطبعا خطبة الجمعة المنع والاقصاء هو مصير أى شيخ يخرج عن النص الحكومى .. يبقى الإخوان الخيارات المتاحة ليهم لتوصيل فكرهم محدودةجداً ..<br />بالنسبة للاسلام هو الحل فهذا الشعار المسلمون يأخذوه كشريعة وأنتم تأخذوه كحضارة وللجميع مسلمين ومسيحيين حق الموافقة عليه بحرية .. مثلاً يقول الحل الإسلامى أن على البنوك أن تعطى فوائد ثابتة على الأرباح لا على رأس المال .. مثلاً البنك يعطى 70% من الأرباح التى تتغير باستمرار لا أن بعطى 12 % من رأس المال .. كمسلم أقبل هذا لأنه أمر دينى أما كمسيحى فأنت حر تماما فى أن ترى أن هذا الأمر أفضل لك إقتصاديا - هناك دراسات أوروبية تؤيد ذلك - أو أن ترى أنك تفضل النظام الآخر ..<br />بالنسبة للموضوع فرسالتى الأهم لإخوانى أرجوكم اختاروا الشخص الصحيح .. عدم إلقاء كلمة أصلا أفضل كثيرا من أن يلقيها شخص غير فاهم جيدا للفكر الإخوانى أو شخص غير مناسب بيئيا أو ثقافيا أو غير مقبول من الطلاب .. هذا مهم جدا جداجدا .. كان فيه واحد من إخواننا مكلف بإلقاء الكلمة - وهو شخص أكثر من رائع - لكن فى أحدالمرات لم يحضر وحضر أخ آخر مكانه وكان أسلوبه سىء جدا.. بصراحة شعرت أن إلغاء الكلمة كان سيكون أفضل كثيرا .."
