[[comments]]
order = 24
subject = "الف تحية لشباب الاخوان"
author = "ياسر ابو سمية"
posted = "2006-06-19"
text = "الف تحية اوجهها لشباب الاخوان اللى بيحاولوا توصيل النصيحة بكافة الطرق ،كلنا لما كنا فى الجامعة كنا بنسمعهم ونعجب بكلامهم ،جزى الله خيرا كل من يحاول اضافة شئ جيد الى هذا البلد المظلوم او يفيد احدا بكلمة طيبة يمكن تنفعه يوم القيامة ،وبعدين انا شايف اللى ميتكلمش فى الوقت اللى احنا فيه يبقى اكيد فيه حاجة غلط ،اتكلم ،قول اى حاجة، سمعنا صوتك ،بس المهم انتقى الكلام اللى هتقوله.<br />وبعدين انا مستغرب من التعليقات اللى بتقول انهم متضايقين من كلام الاخوان فى المدرجات ،طبعا كل واحد له الحق انه يكره او يعجب باى حاجة ولكنى اسال كم واحد سمع كلام الشباب الحلو ده واستفاد بيه ،يا جماعة انتم عارفين ان فيه ناس نفسها تبقى كويسة بس ناقصها كلمة صغيرة او موعظة تصحى القلب ،فلما واحد ييجى يقول الكلمة دى او ينغز قلوبنا النغزة دى يبقى الواجب نشكره ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

[[comments]]
order = 25
subject = "رأيي"
author = "محمود"
posted = "2006-06-20"
text = "كويس ان التعليق اتفتح<br />بص يا عم مفتاح معلش تحمل كلامي اولا انا ليا ملاحظة وهي انك لما تتكلم مع واحدة اسمها نونا ولا سوسة ولا مش عارف ايه ده فرايي نوع من الاختلاط لكن ممنوعيته او مدى خطأه يعتمد على الحوار اللي بيدور ...اما بقى معلش يعني انك تقلي غض البصر فمعلش بردو لما تكلم واحدة اسمها سوسة ولا اي حاجة تانية طيب ما ده ممكن يسمح بحاجات تانية ..اللي اقصده ان في الاصل ايه هي مادة الحوار..و معلش النقطة دي تحديدا بتثير اهتمامي لان في كتير من المنتديات و تحديدا اللي تبع الاخوان نلاقي الناس في الكلية محترمين و مايعرفوش بعض لما بقى ندخل على المنتدى نلاقي تهريج بالعبيط.و ده بصراحة تاثيره سيء جدا لان دي اسمها ازدواجية و اي حد مش مسلم يشوف الكلام ده ها يقول دول عندهم ازدواجية...النقطة التانية هي حضرتك رافض رفض بات الاختلاط في الكلية مفيش مشكلة متفقين بس لاحظ يا استاذ ان منع الاختلاط ما بيجيش بالفرض لازم ثقافة الناس نفسها تتغير و تفهم بهدؤ ليه نمنع الاختلاط ..هنا عاوز افتكر اللي حصل في طب لما جابو شريط لاصق و فصلوا الاماكن بالعافية طبعا معلش ده تهريج اولا لان مش من حقك ثانيا لان بعد ما المحاضرة ما هاتخلص فلان يلم فلانة و يروحوا يقعدوا في اي حتة تانية.. الخلاصة انا شايف ان مفيش مشكلة ان يكون في حوار بين بنت وولد لكن في ضوابط كلنا عارفنها و مش تحت اسم صحوبية لاني متفق معاك في ده ان مفيش صحوبية بين الولد و البنت.<br />www.afkarmisry.blogspot.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

