[[comments]]
order = 8
subject = "يالهوي يا عبد الله"
author = "هوووووووووووبه"
posted = "2006-06-02"
text = "انت يا كابتن مش لسه قفله معاك الماسنجر من يومين وكل اما اكلمك اقولك اختك الكبيره ياض ؟؟؟؟\"عقده نقص بردو\" وقلت لحمدي لايجوز الاضافه خوفا من الفتنه لما خليتني اقول يا موقع داريني بدل يا حيطه داريني \" بصوا ياجماعه الموضوع دا حسب (البيئه) بمعني اخر انا اعرف شباب بعدد شعر راسي \"باعتبار اني مش قرعه \" بس هل لما اكلم كل واحد يبقي خلاص حبته ودبت فيه لاه طبعا هما بيعلموني وبتعلم منهم فيهم الطيب الخبيث اللي اللي اللي<br />وفي الاخر شوف كل البشر واعرف وفرق بقي انت مش صغنن الكخه من اللي مش كخه , بس خد بالك من حته \"البيئه دي \"الاخوان بقي وانا صغننه بردو بلاش الكليه دي ,كانو بيوزعو ادعيه وفسحه صلاه في المدارس بتعتهم والباص بنقول الازكار واتعلمتها منهم فعلا ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

[[comments]]
order = 9
subject = "تاني؟"
author = "عبدالله مفتاح"
posted = "2006-06-02"
text = "ايوة قلتيلي اختك الكبيرة وايه المشكله انا وانتي لم نتناقش اصلا في الموضوع ده<br />وانا قلت اني اقدر اكلم الولاد في الموضوع ده اكتر من البنات لاني مع الولد بكون واخد حريتي بس مع البنت بكون متربط<br />بس انا مقلتش لحمدي لا يجوز الاضافه خوفا من الفتنه انا كنت بدافع عن الولاد والبنات اللي مش بيضيفوا ايميلات جنس اخر على المسنجر<br />انا يوميها قلت يمكن بيخافوا يضيفوا مش لانه حرام لكن خوفا من الفتنه<br />وبعدين الحيطه مالها دلوقتي؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

[[comments]]
order = 10
subject = "سؤال برئ جدا جدا"
author = "مرمورة"
posted = "2006-06-03"
text = "سؤال برئ جدا جدا<br />انتوا بتتكلموا علي العلاقه بين الشباب والبنات في الجامعه وللا علي النت .....اصل الاتنين مختلفين تماما<br />بالنسبه لعلاقه الجامعه انا اللي اعرفه ان في حاجه اسمها زماله والزماله دي زماله عمل (يبقي بس اللي بيجمعهم عمل ) او زماله دراسه ( يبقي برضه اللي بيجمعهم الدراسه وبس ) يعني متهيالي دي الزماله ومتخرجش عن كده<br />نيجي بقي للصداقه ودي اعتقد ان عبدالله رد وقال الايه ..(ولا متخذات اخدان) مفيش اي كلام تاني ممكن يتقال عن ده<br />نيجي بقي للاخوة .........سؤالي بقي الاخوة دي بالظبط موقعها ايه من الاعراب<br />يعني اللي بيجمعني باي ولد يا اما يبقي دراسه ويكون زميل .........او مواضيع تانيه كتير ومختلفه ويبقي صديق ......لكن ايه اللي يخليه يبقي اخويا ؟؟؟؟؟؟؟؟ايه اللي يكون مشترك ويخلي العلاقه اخوة<br />انا اعرف ناس كتير بدات بكلمه زي اخويا وانتهت بحاجه تانيه خالص<br />لا للتمديد ...لا للتوريث..... .نعم لتعديل الدستور<br />الفرد في بلادنا... مواطن او سلطان... ليس لدينا انسان ......احمد مطر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123816/http://www.20at.com/article2.php?sid=890"

