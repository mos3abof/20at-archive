author = "حمد بن محمد_الامارات"
posted = "2006-08-26"
text = "السلام عليكم ورحمة الله وبركاته<br />اولا انا مش رافضي مثل ماقلتي لأن العدوى هذي الي عندكم في السعوديه ماعندنا في الامارات وبعدين انا مالكي المذهب ونحن في الامارات ماعندنا هذا شيعي وهذا سني لأن الامور هذي انتو الي مصدرينها للدول المجاورة والعربيه ومذهب اهل البيت مايحتاج ترويج مثل مذهب صاحبكم بن عبدالوهاب لأن على مدى السنوات نحن متجاورين ومتعايشين مع جميع المذاهب والديانات بمنطق \" (لكم دينكم ولي دين) بعكس مذهبكم ياتكون معاي اوضدي هذي لغة انتهت من زمان وانا هنا ليس في موقف دفاع عن احد بس تبين الصراحه ماحد رافع راسنا الايام هذي الا حزب الله وحماس اين جماعتكم التكفيرية وفروخكم المصدرة من السعودية تدرين وين في قندهار والعراق يقومون بعمليات انتحارية ضد الابرياء ليعجلوا بالجنة والله انه علامات آخر الزمن واذا تقولين انهم يزحمونكم في وينادون ياحسين وحسن فهولاء احفاد رسول الله ( صلى الله عليه وآله وسلم) والبيت بيت الله وليس خاص بكم انتم واذا على الزحام في الحرم احسن من الي يزحامون العباد وهو على مواعيد مع البنات في البيت الحرام واطهر بقعه على وجه الارض وانتي فاهمه قصدي واذا بغيتي تشوفين زوري الحرم بنفسك شوفي ربعكم شو يسوون ماقول الا ان الله يديم علينا الوحدة الاسلاميه سنة وشيعة ضد اعداء الاسلام ويدوم علينا الخير والعز تحت قيادتنا الرشيدة في الامارات وباقي الدول الاسلاميه<br />حمد بن محمد _الامارات<br />دبي دار الحب دار الامارات دار المحبه<br />والاحترام لجميع الديانات والمذاهب في العالم<br />\"\" يوجد اكثر من 202 جنسية من جميع انحاء العالم يعيشون بحب وسلام على هذه الارض الطيبة\"\" دار زايد الخير\"\"<br />فهل تعتبروا وترجعوا الى صوابكم"
archived = "2006-11-02"
