text = "انا حعمل زى ما قولتيلى و حبلغ عن المداخلات الخارجة حتى مداخلاتى انا<br />\"الذي نفترض أنه أنضج من أن نعين عليه حراساً داخل الموقع، وكفاه حراسه خارجه.\"<br />لو حضرتك دخلتى على صفحة \"الحرب الآن\" حتلاقى شتايم فى المشاركين كتيرة جدا<br />اكيد ممكن الزوار ينفسوا عن غضبهم من الحكام بس ما يشتموش بعضهم بالطريقة دى<br />و فى تعليقات قديمة جدا ما حدش بلغ عنها انا شايف إنه صعب نعتمد على الزوار<br />انا لسة عند رايى فى تعيين مشرفين"
