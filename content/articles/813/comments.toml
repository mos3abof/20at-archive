subject = "اختى كلبة آل سعود"
author = "واحد والسلام"
posted = "2006-08-04"
text = "غلط جدا تلاقى واحد كاتب كلام بالاباحة دى و تشتميه لان رده اكيد حيكون قاسى و فاحش\"دى نصيحة للزمن\" و بالنسبة للموهبة فدى حاجة مش من تاليفى و منتشرة على الموبايلات فى مصر<br />اما إبن مصر فاقول له \"انا مش عايز اغلط فيك لانى مش داخل هنا عشان اشتم حد\"<br />اسرة الموقع<br />نفسى يطلع راجل و يمسح تعليقى الابيح و كل التعليقات الابيحة و نفسى يطلع راجل تانى_او نفس الراجل الاولانى_و يقترح تعيين مشرفين على الموقع ده و ياريت إقتراحه يتنفذ"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123609/http://www.20at.com/article2.php?sid=1121"

[[comments]]
order = 7
subject = "خلط الحقائق بالشبهات"
author = "علي ايمن"
posted = "2006-08-04"
text = "أظن بأن كاتب المقال كتبه من منظور وتيار معين وهو لتيار السلفي الوهابي ولا سيما منظر الفكر الروحي \"ابن تيميه\" ومن شاكله كابن حجر بتسقيط ورفع الروايات بأقوال مجهولين تحت مسمى علماء . ونقل الموضوع بحذافيره من كتيب كان يوزع بالمدينة المنورة ويصدر من مكتب الدعوة والأرشاد ويوزع في هذا الشهر الشريف وهو شهر رجب.<br />ما روي عن النبي الأكرم(ص): إن شهر رجب شهر الله الأكبر، ولا يبلغ شهر فضله وحرمته، وإن القتال فيه محرم، ألا إن رجباً شهر الله وشعبان شهري ورمضان شهر أمتي، ألا فمن صام من رجب يوماً إيماناً واحتساباً استوجب رضوان الله الأكبر، وأطفأ صومه في ذلك اليوم غضب الله وأغلق عنه باباً من أبواب النار.<br />وروي عن الإمام أمير المؤمنين علي (ع): من صام يوماً من رجب في أوله أو في وسطه أو في آخره غفر له ما تقدم من ذنبه وما تأخر، ومن أحيى ليلة من ليالي رجب أعتقه الله تعالى من النار وقبل شفاعته في سبعين ألف رجل من المذنبين، ومن تصدق بصدقة في رجب ابتغاء وجه الله تعالى أكرمه الله يوم القيامة في الجنة من الثواب، وقبل شفاعته مالا عين رأت ولا أذن سمعت ولا خطر على قلب بشر.<br />القاريء الكريم: أيهما نأخذ:<br />كلام النبي الأكرم محمد صلى الله عليه وآله وكلام اهل البيت مقابل كلام ابن تيميه وابن حجر!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123609/http://www.20at.com/article2.php?sid=1121"

[[comments]]
order = 8
subject = "عن أسرة الموقع"
author = "شيرين مجدي"
posted = "2006-08-05"
text = "الأخ واحد والسلام.. أولا أحترم غيرتك على موقع عشرينات من التعليقات الخارجة.. ولكن ألا ترى معي أنك أخترت أسوأ طريقة للتعبير عن هذه الغيرة ؟!<br />يا أخي لسنا هنا لفرض الرقابة على جمهور عشرينات.. الذي نفترض أنه أنضج من أن نعين عليه حراساً داخل الموقع، وكفاه حراسه خارجه.<br />ما قلته لا يعني أننا سنترك عشرينات ساحة لعرض التعليقات الخارجة، ولكننا نقوم بقدر طاقتنا، وبمساعدة القراء العشريناتية المحترمين، بحذف ما نجد أنه قد يخدش الحياء، أو يسء إلى أي أحد.<br />فيا أخي \"واحد والسلام\" لديك طريقتين لا ثالث لهما إذا كنت تريد أن تساعد الموقع في التخلص من التعليقات الخارجة. الأولى هي استخدام خاصية الإبلاغ عن التعليق الموجودة بالموقع، والثانية هي الإبلاغ عما تريده على البريد الألكتروني للموقع.<br />هدانا الله وإياك إلى ما يحب ويرضى..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123609/http://www.20at.com/article2.php?sid=1121"

[[comments]]
order = 9
subject = "اين انتم"
author = "احمد الكودى"
posted = "2006-08-06"
text = "سؤال كاد ان يشل بيه عقلى اين انتم يا<br />سيدى ارجوا ردا على سؤالى , علما بانى مصرى وابن مصرى وعاشق لتراب هذا الوطن ولاكن سؤالى هو<br />لو كان ما يحدث فى لبنان يحدث هنا ماذا سيكون رد فعل الدول العربيه<br />هل ستقول ان الجيش المصرى لحمايه ارضنا وماذا سنفعل بدوم مساعده<br />سيدى المسئول هل تتمنى ان يكون القتيل الذى فى الصور التى نراهااخ لك او ابن لك لكى تتحرك<br />سيدى ما قيمه الدماء العربيه بالنسبه لكم<br />سيدى ماثمن الاهانه التى تحصل عليها لبنان الان وربما تاتى حصتنا فيها غدا<br />سيدى هل تعلم ان ديننا يقول من قتل يهودى دخل الجنه ومن قتله يهودى دخل ايضا الجنه<br />سيدى هل تعلم ان رسول الامه كان يحارب 100000 يهودى ب10000 مسلم<br />سيدى هل تعلم اننا مستهدفين بعد قليل<br />هل تعلم ان اليوم فلسطين ولبنان وغدا<br />سوريا وايران<br />وماذا بعدهم<br />هل تعلم اننا اقوى الدول العربيه جيش واضعفهم ايمان<br />سيدى اسالك بالله عليك<br />ايــــــــــن انتــــــــــــم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123609/http://www.20at.com/article2.php?sid=1121"

