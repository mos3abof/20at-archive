[[comments]]
order = 16
subject = "اتقوا الله فيما تكتبون"
author = "بسم الله والحمد لله والصلاة والسلام على رسول الله وأله وصحبه ومن تبعهم باحسان وبعد"
posted = "2006-08-27"
text = "اخوتى.. اتقوا الله فيما تكتبون.<br />الأخ الذى يلوم على كاتب المقال لاستشهاده بأقوال ابن تيمية وابن حجر رحمة الله عليهما، لا يقر بمصادر السنة التى نرجع اليها أصلا، ولا يعترف بالبخارى ومسلم رحمهما الله وغيرهما من ثقات الرواية والحديث أصحاب المسانيد، فمن رواياتهم يتكلم علماؤنا جميعا وعنهم يأخذون سنة رسول الله صلى الله عليه وأله وسلم. وما ذكره صاحب التعليقات الطاعنة فى علمائنا وما نسبه الى أل البيت من روايات ليس مما يصح عندنا. فلا تغتروا بكلامه ولا طعنه على أئمة أهل السنة، فهو أصلا لا يعترف بمصادرنا الصحيحة، وان أخذ أخذ من موضوعات ومكذوبات تعج بها كتب حديثهم نسبوها زورا وعدوانا الى أهل البيت رضى الله عنهم.. ولن أدخل فى تفاصيل بعرض أدلة كذب الرجال وفساد الروايات عندهم لأنه لن يجد أسهل عليه من أن يكذبها ولو كانت مما اتفق عليه جمهور علمائنا وثقاتنا فى الرجال والحديث.<br />فلا مناظرة مع هؤلاء لأن أصولهم ومصادر تلقيهم كلها عن رجال كذابين وضاعين.. ويكفى الواحد منكم أن يطلع بنفسه على بعض روايات الكافى (أصح الكتب عندهم) ليرى العجب العجاب من الخرافات والطعونات على القرءان وعلى الصاحبة، كلام يندى له الجبين والله !<br />فلا تجادلوهم بغير علم بالله عليكم ولا تخوضوا معهم فيما يقولون، ولا تغتروا بهم.<br />وأوصى من كتب هذا الموضوع، ان كان يرجو الله واليوم الأخر أن يمنع التعليق عليه، لأنه ليس لأحد أن يتكلم فى دين الله بغير علم، ولا أرى فى تلك الموضوعات على هذا الموقع الا الخوض والجدال بغير علم، وكلام للشيعة يملؤه الحقد على علماء أهل السنة وفضلائهم وأعلامهم، ومحاولات رخيصة لتشييع المسلمين.. فاتقوا الله وأوقفوا تلك المهازل، وتعلموا دينكم وعقيدتكم فالفتن قد صارت كقطع الليل المظلم، نسأل الله العافية والمغفرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123609/http://www.20at.com/article2.php?sid=1121"

