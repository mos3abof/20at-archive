[[comments]]
order = 12
subject = "عش رجباا ترى عجباا"
author = "حمدبن محمد"
posted = "2006-08-26"
text = "مساكم الله بالخير والسرور<br />عجباا ياشباب ويااخوة هل نترك احاديث الرسول واهل البيت ونتبع اقوال ابن تيمية وابن عبدالوهاب هل ترون افكارهم ومعتقداتهم انظروا الى افعال طالبان والمرتزقة التكفيريين وتعرفوا من يمثلون<br />اما الاحباب الذين انتقدوا ونقلوا عن فضل شهر رجب المرجب او الاصب فنحن نتبع احاديث رسول (ص) وهي احاديث ليست فيها شك لأنها منقوله عن أهل البيت (ع)<br />عن النبي صلى الله عليه وآله وسلم انه قال \"\" من قال في رجب :استغفر الله الذي لا اله الا هو وحده لا شريك له واتوب اليه 100 مرة وختمها بالصدقها ختم الله له بالرحمة والمغفرة ومن قالها400 مرة كتب الله له اجر مائة شهيد \"\"<br />وعن النبي (ص) قال : من قال في رجب لا اله الا الله الف مرة كتب الله له مائة الف حسنة وبني له مائة مدينة في الجنة \"\"<br />وفي الحديث : من استغفر الله في رجب سبعين مرة بالغداة وسبعين مرة بالعشي يقول : استغفر الله واتوب اليه فاءذا بلغ تمام سبعين مرة رفع يديه وقال :اللهم اغفر لي وتب علي فاءن مات في رجب مات مرضياا عنه ولا تمسه النار ببركة رجب \"\"<br />ولأنكم تكلمتم عن صلاة الرغائب<br />\" ايضا من المأثور قول لا اله الا الله في كل ليلة من هذا الشهر الف مرة وعلم ان اول ليلة من ليالي الجمعه من رجب تسمى ليلة الرغائب وفيها عمل مأثور عن النبي (ص) ذو فضل كثير ورواه السيد في الاقبال والعلامة المجلسي (رحمه الله ) في اجازة بني زهرة ومن فضله ان يغفر لمن صلاها ذنوب كثيرة وانه اذا كان اول ليلة نزوله الى قبره بعث الله اليه ثواب هذه الصلاة في احسن صورة بوجه طلق ولسان ذلق فيقول : ياحبيبي ابشر فقد نجوت من كل شدة فيقول : من انت ؟ فما رايت احسن وجهاا منك ولا سمعت كلاما احلى من كلا مك ولا شممت رائحة اطيب من رائحتك فيقول : ياحبيبي انا ثواب تلك الصلاة التي صليتها ليلة كذا في بلدة كذا في شهر كذا في سنة كذا جئت اليلة لأقضي حقك واونس وحدتك وارفع عنك وحشتك فاءذا نفخ في الصور ظللت في عرصة القيامة على راسك فافرح فاءنك لن تعدم الخير ابداا \"\"<br />واحاديث كثيرة عن النبي واهل البيت في فضل هذا الشهر وتأتي انت لتنقل عن ابن تيمية ومحمد بن عبدالوهاب اساس الفتن ومن اتبعهم امثال طالبان الجهلاء تجار المخدرات وجهل الامة وامثال الزرقاوي والتكفيريين خريجي معاهد النفاق في الرياض والقصيم وفتن نجد اذا اردت الحق فنحن مع الحق مع من يحقن دماء المسلمين سنة وشيعة امثال سيدي السيد حسن نصر الله حفظه الله هذا من متبعي مدرسة الرسول الاعظم (ص) واهل بيته لا امثال متبعي المذهب الوهابي التكفيري الحقود والمؤيد من امريكا والكيان الصهيوني وانت تعرف من صدر فتوى بعدم الجواز للدعاء لحزب الله واين مصدر تلك الفتوى وتقراءمن الكتاب المأجورين السعوديين كيف وقفوا ضد المجاهدين في لبنان وهذا يدل عن افكار مانقلته من مصادر احاديث اسئل الله ان يهينا واياكم وان لا يفرق بين المسلمين كافة سنة وشيعة<br />\" لا اله الا الله محمد رسول الله \""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123609/http://www.20at.com/article2.php?sid=1121"

[[comments]]
order = 13
subject = "الى الاخ حمد"
author = "ريم بنت السعودية"
posted = "2006-08-26"
text = "يا حمد بن محمد وش عرفك بالدين انت حدك مواقع الشيعة فقط هنا لا مجال لنشر دينك الرافضي وابن تيمية لم ياتي بكلام من عنده بل من احاديث صحيحة عن النبي صلى الله عليه وسلم بعدين من ادبك مع الرسول ان لا تقول [ ص [[ بل قل صلى الله عليه وسلم ...... وكما قلت عش رجب ترى عجبا تقولها وانت لاتعرف معناها وهي ان الشيعة لاترى منهم اجتهاد الا في رجب وكان الله لايوجد الا في رجب سبحانه تنزه وانا ارى العجب في الحرم بمكة في رجب فارى الشيعة يزحمونك وكا ان الحرم لهم وحدهم ويزحمونك في الطواف وما ذا يقولون هل يدعون الله الي خلقهم ويستغفرونه لا بل اسمعهم يدعون الحسن وجاه الحسين وكان الحسين ربهم يسمعهم فقد اشركوا بالله في اطهر البقاع ولم يؤدو العبادة للخالق فلا اكاد ارى معهم حجرا صغيرا مكتوب عليه الحسين يسجدون له اهو ربكم اتلك عقيدتكم ........ واياك ان تتكلم عن نجد وعلمائها فهي الحق وانتم الرافضة والباطل وانتم تعذبون السنة في العراق وتقولون نحن ونحن ............................................................................ هل تريد ادلة اخرى انكم على باطل قال صلى الله علية وسلم افترقت اليهود على ثلاث وسبعين فرقة والنصارى على اثنين وسبعين فرقة وستفترق امتي على احدى وسبعون فرقة كلها في النار الا واحدة قالو من هي يارسول الله قال ماكانت ما عليه انا واصحابي اليوم .... اسالك هل حلف الرسول بجاه الحسين او فاطمة لا بل تلك بدعة ابتدعتها الرافضة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123609/http://www.20at.com/article2.php?sid=1121"

