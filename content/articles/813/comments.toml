order = 18
subject = "الاخ حمد بن محمد"
author = "ابو احمد"
posted = "2006-08-28"
text = "اشكر الدكتور والمذيع فيصل القاسم على كلامه الطيب واشكر قناة الجزيرة الفضائية على اختيارها للعناصر والكوادر المؤهلة لادارة القناة ويا ريت تتبع باقي القنوات العربية نفس اسلوب الجزيرة الفضائية كذلك اشكر الاخ حمد بن محمد على اختيارة هذه الكتابات الرائعة.<br />اود القول الخزى والعار في من يكفر مسلما يجب علينا ان نتحد ونترك عنا هذه الامور التافهه والعصبية التي ليس لها اي داعي وعدم تنفيذ السياسة الصهيونية في القضاء على الاسلام والمسلمين اتقوا الله يا مسلمين واخ بالذكر المذهب السلفي الوهابي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123609/http://www.20at.com/article2.php?sid=1121"
