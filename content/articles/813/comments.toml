subject = "وانتم وعلمائكم اتقوا الله فيما تفتون"
author = "حمد بن محمد_الامارات"
posted = "2006-08-28"
text = "مساكم الله بالخير جميعااا انا لن اعلق على كتابة هذا الوهابي السلفي ولكن سيردعليه الدكتور والمذيع فيصل القاسم ولكن اتمنى ان لا تصدر فتوى تكفيرية بحقه كعادتكم يامصدرين الفتاوي التكفيرية ومؤسسين الحقد والفتن بين المسلمين<br />(( جريدة الراية القطرية 27_8_2006 ))<br />لا يمكن للمسلمين أن ينتصروا على أعدائهم ويتخلصوا من نير التخلف والهزيمة إلا بعد أن يوحدوا كلمتهم وعقيدتهم ويوقفوا حروب داحس والغبراء المذهبية فيما بينهم. لا انتصار كاملاً للمسلمين إلا بعد أن يتعاضد الأتراك والإيرانيون والعرب وغيرهم ويدخلوا المعركة تحت لواء عَقَدي واحد. هكذا كانت تحدثنا جداتنا الطيبات قبل عقود. ومع أنهن لم يكن يفقهن بالسياسة كثيراً، إلا أنهن كن يضعن أيديهن على أهم العلل التي يعاني منها الجسد الإسلامي، ألا وهي الفرقة والتنازع والتناحر المذهبي والطائفي البغيض الذي ينزل على الأعداء برداً وسلاماً. لقد تذكرت كلمات جداتنا البسيطة وأنا أرى كيف يحاول بعض العرب والمسلمين إفراغ الصمود الذي حققته المقاومة الوطنية اللبنانية بقيادة حزب الله من مضمونه، لا لشيء إلا لأن الذين حققوه ينتمون إلى مذهب أو طائفة إسلامية معينة. إنه لأمر مؤلم جداً أن يقلل البعض من قيمة ذلك النصر فقط لأسباب مذهبية وطائفية.<br />كم يشعر المرء بغُصة كبرى وحزن عميق وهو يرى كيف تتلاقى بعض المواقف الإسلامية مع الموقف الصهيوني في نظرتها إلى حزب الله. هل يعقل أن تتناغم التصريحات الإسرائيلية مع فتاوى بعض المشايخ المسلمين في الموقف من حسن نصر الله ورفاقه؟ ألم يكن الصهاينة سعداء حتى الثمالة عندما خرج البعض ليكفر المقاومة الوطنية اللبنانية على أسس طائفية مقيتة وهي في عز المعركة؟ ألا يعكس هذا التوجه، كما يجادل أحمد حسن، ولادة حقيقية لتيار «إسلامي» متصهين يرى في إسرائيل اليوم «نبياً» جديداً يخلص المسلمين من كيد المذاهب والطوائف الإسلامية «الكافرة»؟.<br />هل يعقل أن نضع إخواننا من المذاهب والطوائف الأخرى في منزلة الأعداء، بينما يصبح أعداؤنا الحقيقيون حلفاء مقبولين؟ ألم يتحالف بعض التيارات الإسلامية التكفيرية عسكرياً واستراتيجياً مع الأمريكان في فترة من الفترات في أفغانستان دون أن يرمش لهم جفن؟ لماذا التحالف مع من نسميهم «الكفرة» حلال زلال ومجرد الدعاء لحزب الله ومقاتليه من الكبائر في ديدن بعض الفقهاء والشيوخ؟.<br />ألم يقل عليه أفضل الصلاة والسلام: «لا تحاسدوا ولا تباغضوا ولا تدابروا ولا يغتب بعضكم بعض، وكونوا عباد الله إخواناً، المسلم أخو المسلم لا يظلمه ولا يخذله ولا يحقره، التقوى ههنا»؟ هل يعقل أن نجند شبابنا ونبرمج عقولهم على معاداة البلدان الإسلامية المختلفة معنا في المذاهب، بينما نتناسى عداوتنا مع أعدائنا الحقيقيين الذي يستبيحون بلداننا وينهبون ثرواتنا ويدوسون رقابنا بالتواطؤ مع أزلامهم المسلطين علينا من حكام وأنظمة؟ ألم يكن حرياً بنا أن نخرس على الأقل إذا لم نكن نريد تأييد المقاومة اللبنانية؟ هل يعقل أن البعض راح يؤلب الشارع عليها على أسس عقدية ويملأ المواقع الالكترونية بمقالات ودعوات تكفيرية ساقطة تقشعر لها الأبدان؟<br />لا بل إنني أستطيع أن أوكد بأن قائد لواء النخبة «جولاني» الإسرائيلي الشهير كان أكثر انصافاً لبطولات حزب الله من بعض رجال الدين والمشايخ العرب، فبينما راح بعضهم يكفر المقاومة على أساس مذهبي وطائفي أعمى، كان الجنرالات الإسرائيليون يثنون على بسالة المقاومين في جنوب لبنان ويتمنون لو أن جنودهم يتمتعون بعشرة بالمائة فقط من شدة بأسهم وصمودهم وبطولتهم.<br />لماذا عندما يقتل بعض المتطرفين أبناء الإسلام ويعيثون في أراضينا الدمار والخراب والإرهاب تمتلئ بعض صفحات منتدياتنا بالمباركة والتطبيل لهم، وعندما تحارب المقاومة الإسلامية إسرائيل بكل تاريخها الدموي الفاشي يدعو بعض التكفيريين على المقاومين بالموت والهلاك، يتساءل كاتب آخر؟ أليس هذا هو التطبيع الحقيقي، فلا داعي للدولة أن ترضى ببناء سفارة إسرائيلية على أراضيها، بل يكفيها تطبيعاً أن يرى جهّالها الكيان الصهيوني مخلــّصـاً وضارباً بيد الله على رقاب المسلمين من المذاهب والطوائف الأخرى. ولا تستغربوا أبدا لو سمعتم علناً وقريباً «اللهم انصر أبناء عمومتنا اليهود على أتباع المذاهب الإسلامية الأخرى».<br />لماذا لا نتعلم من الصهاينة أنفسهم؟ ألا يتناحرون في السياسة والثقافة والفكر ليل نهار أيام السلم ثم يصبحون صفاً واحداً أيام الحرب؟ ألم يدع بعض حاخاماتهم إلى إبادة العرب في لبنان وتحويل الأراضي اللبنانية إلى صناديق من الرمل؟ ألم ينس الإعلام الإسرائيلي ديمقراطيته المزعومة ليصبح جوقة واحدة في خدمة المعركة ضد حزب الله؟ ألم يتناس الإسرائيليون كل خلافاتهم الفكرية والثقافية والعقدية والطائفية واصطفوا جميعاً وراء رئيس وزرائهم إيهود المرت في حربه ضد لبنان؟ هل سمعتم حاخاماً يهودياً أو مسيحياً صهيونياً واحداً في أمريكا أو الدولة العبرية يدعو لإسرائيل بالهزيمة والاندحار؟ ألم يصبح اليهود السفارديم والاشكناز جبهة واحدة لا تسمح لأحد باختراقها أيام الحروب، هذا في الوقت الذي كان بعض الشيوخ لا يدعون الله أن يذل إسرائيل أو يخذلها، بل كان يطالب أتباعه بعدم الدعاء لحزب الله ويدعو على السيد حسن نصر الله بالويل والثبور والموت. يا سلام! ألا يعني عدم الدعاء للمقاومين اللبنانيين أن صاحب الفتوى يدعو إلى الله بأن ينصر اليهود على المسلمين؟ أي إسلام ينصر اليهود والنصارى على المسلمين مهما كان مذهبهم؟ أليس هؤلاء الدعاة أخطر على الدين الحنيف وأتباعه من ألد الأعداء؟ أليس حرياً بالسلطات أن تحاسبهم وتوقفهم عند حدهم كما تفعل الدول الغربية مع العنصريين والمحرضين والمخربين ومروجي الفتن ومثيري الأحقاد الدينية والنعرات الاجتماعية والطائفية؟<br />من أروع ما سنته الدول الغربية قوانين صارمة تعاقب كل من تسول له نفسه إثارة الفتن العرقية والعنصرية. وقد قام رئيس حزب المحافظين في بريطانيا ذات مرة بطرد وزيرة من الحكومة خلال دقائق لمجرد أنها تفوهت بنكتة عنصرية سمجة بحق الجالية الباكستانية في البلاد. لا تساهل أبداً في الدول التي تحترم نفسها مع الذين يحاولون النيل من النسيج العرقي والديني في البلاد؟ إن هؤلاء مخربون بامتياز ولا بد من منعهم من تخريب الوحدة الوطنية والتنوع العرقي والديني بأقسى العقوبات؟ لماذ إذن يحاسبون العنصريين في الغرب ويضعونهم عند حدودهم بينما يُسمح في بلداننا لرجال دين متعصبين وفاشيين بتكفير ملايين الناس وتجريمهم على أسس عقدية، ومباركة الأفعال الفاشية والنازية التي كانت تلحقها إسرائيل بهم في جنوب لبنان بشكل مباشر أو غير مباشر؟ لقد آن الأوان لسن قوانين صارمة تمنع التمييز الديني والعرقي في بلداننا. كيف تنادي بعض الأنظمة العربية بالعولمة وفتح الحدود بينما تسمح لبعض الدعاة والوعاظ بأن ينشروا الحقد والبغضاء والفتن بين الطوائف والمذاهب والأعراق العربية والإسلامية، فما بالك غير الإسلامية؟<br />هل يجب على المقاومين والمدافعين عن أوطانهم أن يكونوا من مذهب أو طائفة إسلامية معينة كي تصح مقاومتهم ويجوز الدعاء لهم؟ فلو طبقنا ذلك المنطق لظلت كل الأراضي المحتلة في العالم تحت نير الغزاة؟ هل يعقل أن نصفق لتشي غيفارا وهوشي منه وسيمون بوليفار ونلسون مانديلا ولا نصفق لحسن نصرالله ؟ أليس حرياً بنا أن نناصر حتى البوذيين والهندوس والهنود الحمر لو حاربوا أعداءنا، فما بالك بإخوتنا في جنوب لبنان؟ أليس الأقربون أولى بالمعروف حسب كل شرائع الدنيا؟ لقد آن الأوان لأن نتخلص من عمانا العقدي والطائفي والمذهبي وأن نطبق ذلك المثل البسيط على أرض الواقع، وأن نرص الصفوف بدلاً من تفريقها، وأن نتوقف عن تغميس خناجر بعضنا بدماء البعض لإرضاء عـُقدنا المذهبية والطائفية السخيفة. وهذا الكلام ليس موجهاً لمذهب بعينه بل لكل المذاهب والطوائف التي يكفــّر بعضها البعض بعد أن حولت الاختلاف إلى نقمة. لماذا نقلب المثل الشهير «أنا وأخي على الغريب» ليصبح «أنا والغريب على أخي؟». فعلاً هزلت!!"
archived = "2006-11-02"
