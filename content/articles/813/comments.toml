subject = "ريم بنت السعودية"
author = "ابو احمد"
posted = "2006-08-26"
text = "الاخت ريم بنت السعوديةهل تعلمي ان اللي ضيع الدين الاسلامي هذه الامور التافهه التي نتكلم عنها فنقول هذا رافضي شيعي وهذا سلفي متشدد ارهابي ياريت تتركي هذه التفاهات وتهتمي في صلب الموضوع والقضية<br />هل تعلمي ان السيد حسن نصر الله هو الذي رفع روؤس المسلمين عاليه وجميع العرب بما فيهم الذين يدعون محاربة امريكا واسرائيل يتفرجون<br />اعتقد انه بان الان من المجاهد الحقيقي اتركك كي تفكري ويتبين لكي الحق من الباطل"
archived = "2006-11-02"
