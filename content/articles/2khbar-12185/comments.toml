[[comments]]
order = 0
subject = ""
author = "ليتنى كنت سعد الدين"
posted = "2009-05-26"
text = "و لالالالالالالال الالالالا تعليق<br />الدكتور /سعد الدين ابراهيم رئيس دولتة الحقيقى /باراك اوباما؟<br />اما مصر فرئيسها الفعلى هو السيد اللواء الباشا الوزير/وزير الداخلية<br />بمقر رئاسة الجمهورية بميدان (لا ظوغلى)"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530234543/http://www.20at.com:80/2khbar/12185-2009-05-26-07-32-52.html"

[[comments]]
order = 1
subject = ""
author = "المعاملة بالمثل"
posted = "2009-05-26"
text = "و ممكن ممدوح زكى زخارى جرجس_المواطن المصرى القبطى يسمح لة بالسفر خارج مصر أم لالالالالالالال الالالالالالالا ل الالالالالا؟<br />هذة شكوى الى الرئيس مبارك<br />المستشار النائب العام<br />اما اللواء وزير الداخلية فلالا و مليون الف لالالالالا<br />اين حقوق المواطنة ياعالم ناقصة فهم<br />بلد بتحكم من وزارة الداخلية و لبست من القصر الجمهورى بمصر الجديدة"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530234543/http://www.20at.com:80/2khbar/12185-2009-05-26-07-32-52.html"

[[comments]]
order = 2
subject = ""
author = "كرامات زيارة اوباما"
posted = "2009-05-26"
text = "بركات زيارة اوباما بتحول الحكم بالسجن الى براءة<br />تعيش نزاهة القضاء المصرى<br />ودى بتوجيهات من مين<br />قلنا خمسين الف مرة<br />ان الشخص اللى يحمل جنسية غير الجنسية المصرية تسقط عنة الجنسية المصرية فورا علشان نرتاح من حاملى الجنتسية المزدوجة زى سعد ابراهيم الامريكانى واقباط المهجر الامريكان"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530234543/http://www.20at.com:80/2khbar/12185-2009-05-26-07-32-52.html"

[[comments]]
order = 3
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-05-26"
text = "سعد سعد يحيا سعد<br />طبعا أقصد سعد زغلول باشا المصرى<br />موش سعد ابراهيم المستر الامريكانى"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530234543/http://www.20at.com:80/2khbar/12185-2009-05-26-07-32-52.html"

[[comments]]
order = 4
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-05-26"
text = "و اللة العظيم بالثلاث انا ما فاهم شئى بالمرة<br />حبس ثم برائة؟<br />فهمونى يا ناس ياولاد الحلال؟<br />ايهة الحكاية بالضبط<br />هتجننونى هتجننونى هتجننونى<br />و لا علشان هو امريكانى و طويل اللسان و القلم"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530234543/http://www.20at.com:80/2khbar/12185-2009-05-26-07-32-52.html"

[[comments]]
order = 5
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-05-27"
text = "الى كاتب التعليق رقم(11)<br />(أشرب يا زخارى)<br />و انت مال اهللك يابن المرة [ *** ]<br />أنا راضى و أبوها راضى ؟"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530234543/http://www.20at.com:80/2khbar/12185-2009-05-26-07-32-52.html"

[[comments]]
order = 6
subject = ""
author = "أشرب يا زخارى"
posted = "2009-05-27"
text = "هذا هو ثمن و لائك يا زخارى لرئيسك<br />اشرب اشرب اشرب<br />ثمن الولاء لمصر و للرئيس و للنظام<br />( مر مر مر)"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530234543/http://www.20at.com:80/2khbar/12185-2009-05-26-07-32-52.html"

[[comments]]
order = 7
subject = ""
author = "الى عدالة /الرئيس"
posted = "2009-05-27"
text = "[quote name=\"الى عدالة /الرئيس\"][quote name=\"هو دة العدل يا مصر\"][quote name=\"اشاركك الاحزان\"][quote name=\"ممدوح زكى زخارى جرجس\"]الى كاتب التعليق رقم(4)<br />(المعاملة بالمثل)؟<br />لا أحتاج لمن يدافع عنى<br />دفاعى و حصنى الوحيد القضاء المصرى و القانون و الدستور و أخيرا عدل السيد/رئيس الجمهورية حسنى مبارك<br />أما عدل السيد اللواء/وزير الداخلية فالف مليون شكر<br />اللة الغنى و المستعان<br />ألجا شاكينا الى السيد المستشار /النائب العام شاكيا<br />وزارة الداخلية المصرية بانتهاك الدستور و القانون و احتقار احكام المحكمة الدستورية العليا ؟<br />و لنا اللة يا مصر<br />و عنوانى هو(ممدوح زكى زخارى جرجس)<br />149 شارع طيبة_أسبورتنج_ب اب شرق_الاسكندرية_ مصر<br />محمول رقم(0121714842)<br />و انى لعلى ثقة بان عدل و عدالة السيد /رئيس الجمهورية حسنى مبارك أقوى من ظلم و غبن السادة باشوات أمن الدولة المصرى الذى ادرجنى ظلما و بهتانا طوال 17 عاما على قوائم الممنوعين من السفر دون زنب او جريمة او اتهام او تحقيق ؟!!!<br />قرار ادراج على قوائم اللمنوعين من السفر رقم(37152)/1992صادر بتاريخ 11 مايو 1992<br />اللة اقوى من ظلم كل ظالم متكبر أمين"
archived = "2009-05-30"
capture_url = "https://web.archive.org/web/20090530234543/http://www.20at.com:80/2khbar/12185-2009-05-26-07-32-52.html"

