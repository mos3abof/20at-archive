[[comments]]
order = 1
subject = "النصر للقضاة و الذلة والمهانة فى الدنيا و الأخرة للجبابر ة الطغاة"
author = "مصرى"
posted = "2006-05-14"
text = "إن من العجب العجاب ان الذي يداس بالأقدام في مصر أشرف و اطهر واعلى قامةًمن الجلاد . الجلاد الذي رضي أن يكون سوطاً في يد طاغي اول ما أضاع أضاع نفسه فهو ملعون في الدنيا من شعبة و في الأخرة محشور مع الجبارين و بئس المصير قولو أمين.<br />إن الصلاة لقضاء الحاجة و اجبة و مسنونة ولاكن الأوجب و الأفضل أن يسعى كلاً منا في موقعة ان يغير و أن يساند القضاة بكلمة حق في زمن كثر فية المنافقين و الأفكين وكلاب السلطان.<br />نعم الصلاة واجبة وسوف اصلي إن شاء الله ولاكن السعي اولى لتغير الواقع المرير<br />نعم الصلاة هامة و الدعاء اهم لان الصلاة في اللغة تعنى الدعاء<br />ندعو لمصرنا المنكوبة بأن يفك أسرها و يرفع قامتها و يفكها من أغلالها.<br />أدعو و صلوا وأنتم تبكون كما أبكي لربما يغسل بكائنا أقذاراً تراكمت على ثوب مصرنا المعطائه.<br />إبكوا كي تطفي دموعكم نار أشتعلت في قلوب الظلمين و المنافقين.<br />زد بكائاً لعل الله يتقبل و يكون الفجر قريب اللهم أمين."
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909121537/http://masr.20at.com:80/article.php?sid=313&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "إبادة شعب"
author = "أتمنى ألا أكون مصرى"
posted = "2006-05-14"
text = "لا بد أن يعاقب الرئيس حسنى مبارك على أفعاله إن ما يفعله هو إبادة جماعية للشعب المصرى وإغتيال لوجوده فمنذ أن إستولى عن الحكم بدون إنتخابات وهو يعلم عدم شرعية وجوده مما دفعه للإستيلاء على كل مقدرات البلد وثرواته وتزويره الإنتخابات به وتهميش الشعب وهذه نفس سياسة أى مستعمر فى إحتلال أى دوله إبادة الشعب وقهره حتى لا يكون هناك أى قوى تقف فى وجهه ونحن نطالب بمحاكمة دولية لحسنى مبارك على إبادته للشعب المصرى من تهميش وفقر وبطالة ومرض وإستيلاء على كل مقدراته وتزوير كل الإنتخابات لابد أن نقدم جميعاً عريضة محاكمة له على إتفاقية الكويز التى اضرت بإقتصاد مصر وعلى تصدير البترول لأمريكا لمدة عشرين سنة بنصف التمن وتصدير الغاز لأسرائيل وتصدير الأسمنت لها لبناء الجدار العازل وبيع الشركات والمصانع وهى من أملاك الشعب وليست من أملاكه وتهريب الأموال للخارج وإنتشار الفساد أنه مجرم ولا بد من عقابة كمجرمى إبادة الشعوب ولابد من نداء كامل من الشعب كله على ذلك فكيف سينظر العالم للمصريين بعد كل هذه الإهانات التى يتلقاها الشعب من حاكمه والفسدة من حوله العالم الذى كرم المصريين بأرفع الجوائز العالمين كيف سيتعامل اليوم مع المصريين"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909121537/http://masr.20at.com:80/article.php?sid=313&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "هل وصل بنا الحال الى هذا"
author = "ايمن المصرى"
posted = "2006-05-14"
text = "هل اصبحنا شعب مسلوب الارادة . هل اصبحنا لا نملك الا الدعاء على الظالم . هل هذة مصر هل هؤلاء المصريون . الذين يساقون كالخراف من قلة فاسدة . اين ابناء و احفاد الزعماء ( احمد عرابى - مصطفى كامل - سعد زغلول - البسطويسى - مكى - زكريا عبد العزيز ) اين الشرفاء - اين - اين . . ان هذة ليست مصر و هؤلاء ليسوا المصريين . . و ربنا على الظالم و المفترى"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909121537/http://masr.20at.com:80/article.php?sid=313&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "المصرية شرف"
author = "مصرية"
posted = "2006-05-14"
text = "حزنت لتعليق الأخ الذى يتمنى لو لم يكن مصريا هذا هو هدفهم ان نكفر بكل من هو جميل وطاهر ونقى ان نصبح شعبا بلا هويه ولا مبادىء ولا خلق ولا دين حتى يسهل عليهم التحكم فينا كما يشاؤا ان حضارة مصر وتاريخها لن تستطيع حفنة من اللصوص ان تسرقه منا لقد سرقوا الأموال والثروات وعمر اجيال من شباب مصر ونشروا الفساد فى اجهزة الدولة كلها ولكنهم لن يستطيعوا ان يسرقوا الأمل والحلم لدى كل مصرى شريف فى يوم الخلاص من هذه الغمة ان كل يوم يمر على هؤلاء الجبابرة يزيدون فيه من طغيانهم يقربهم من النهايه المحتومه نهايه سوداء بلون اعمالهم القذره ان مصر مليئه بالشرفاء المخلصين ان الوقفة الشريفة لهؤلاء القضاة الشرفاء هى البداية لثورة البركان الذى سيسحقهم باذن الله مهما حاولوا من تلفيق التهم فالحقيقة بوضح الشمس للعالم كله ولا يخادعوا الا انفسهم ويحضرنى قول الشاعر"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909121537/http://masr.20at.com:80/article.php?sid=313&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

