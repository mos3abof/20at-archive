[[comments]]
order = 6
subject = "يا ريسنا ورئيس الكل"
author = "aroundu_4"
posted = "2006-05-14"
text = "واحد اتحشر في زحمة المرور فلقى واحد بيخبطله على شباك السيارة<br />فتح الشباك و سأله عايز ايه<br />قاله : الرئيس حسنى مبارك خطفوه و الفدية 5$مليون دولار<br />و لو الفدية ماتدفعتش .. الخاطفين هددوا يدلقوا عليه بنزين و يولعوا فيه<br />و احنا بنجمع تبرعات .. تحب تشارك ؟<br />الرجل سأل: \" و في المتوسط الناس بتتبرع بكام\"<br />الرجل الثاني : \" من 5 الى 10 لتر بنزين\" !"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909121537/http://masr.20at.com:80/article.php?sid=313&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "وما تنسوش الصيام"
author = "اميه مسلم"
posted = "2006-05-14"
text = "سيدنا النبى عليه الصلاة والسلام بيقول ان للعبد الصائم دعوه عند افطاره لا ترد فايه رايكم نصوم كلنا يوم الاتنين اللى هو بكره ونوحد كلنا الدعاء للقضاه عند الافطار بان ربنا ينصرهم وينتقم من امن الدوله والنظام وكل اللى ظلم قضاة الحق وما تنسوش اخوانا اللى اتظاهروا عشان القضاه يوم الخميس من دعاكم واللى امن الدوله خدوهم من دعاكم هما كمان"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909121537/http://masr.20at.com:80/article.php?sid=313&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

