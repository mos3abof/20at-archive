[[comments]]
order = 9
subject = "الكلب.. يهدد"
author = "مصرية"
posted = "2006-05-16"
text = "وزير الداخلية اليوم اطلق انذاره بعدم التجمع دون تصريح لأن ذلك مخالف للقانون قانون الطوارىء طبعا ...الكلب المسعور الذى يحمى كلابه الضالة يهدد الشعب المصرى ويتوعدهم اذا ما استخدموا ابسط حقوقهم وهى حرية التعبير مجرد اطلاق هذا البيان اعترافا صريحا بردة الفعل الطبيعية لدى الشعب المصرى تجاه مهزلة التعرض للقضاه الشرفاء..وارتعابهم مماسيحدث وابسطه مزيد من الفضيحة لهم امام وكالات الأنباءالتى عرضت بالصور الأحدث السابقة واستنكرتها بشده..كل ذلك ولا زال الرئيس المحترم يشيد بمناسبه وغير مناسبه بترسيخه للديمقراطيه فى مصر متجاهلا أوجاهلا ..والاثنان كارثة..مايحدث من اعتداءات واعتقالات لأبناء الشب..يمكن لأنه مكنتش موجود فى مصر ساعتها مسمعش وياترى على فين العزم يوم الخميس انا عندى اقتراح هايل ..تلموا بعض ياشلة الحراميه واللصوص وتغورا فى ستين داهيه تاخدكم ولو ان مفيش ولا داهيه منهم حترضى بس ربنا كبير قادر يخلصنا منكم<br />لالالالالالالالاللفساد..لالالالالالالالاللتورث ....ونعم ..نعم..نعم لتغيير الدستور..و100مليون لالالالالالمبارك وسلالته وربنا يخلصنا منكم قولوا آآآآآآآآآآآآآآآآآآمين"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909121537/http://masr.20at.com:80/article.php?sid=313&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

