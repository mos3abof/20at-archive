subject = "دعم من يقف بصف العرب والمسلمون أيا كان"
author = "فلسطينية"
posted = "2006-03-30"
text = "يجب دعم كل من يؤيدنا ومناصرته وتركيز عليه من أجل زيادة دعمه والحصول على دعم غيره واظهار أننا نتقبل الافكار الداعمة وايضا الغير داعمة والانفتاح على العالم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133414/http://www.20at.com/article2.php?sid=636"

[[comments]]
order = 3
subject = "عقبالنا"
author = "مفروسة"
posted = "2006-03-30"
text = "بوض مكروه من اهل بلده اي نعم وبيعملوا افلام واغاني ضده ماشي لكن الور والباقي على اللي قاعد على تلها وخربها علينا وعلى اجدادنا ومفيش حد يقدر يقول اي حاجة ضده وكانه نبي والا هايروح في ستبن داهية وعقبال عندنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133414/http://www.20at.com/article2.php?sid=636"

[[comments]]
order = 4
subject = "فين البهوات"
author = "مفروسة تاني"
posted = "2006-03-30"
text = "والله انا مش عتارفه فين دور الفنانين والسينما في الشارع يعني ولا بنشوف الاخ عادل امام في مظاهرة ولا عمنا نور الشريف في اعتصام وكل واحد قاعد يعمل لنا افلام هايفة وافكر عن الادمان والمخدرات وسايببين اصل الفساد ويطلعوا مع الريس ياخدوا الجوايز وخلاص وسلم لي على رسالة الفن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133414/http://www.20at.com/article2.php?sid=636"

[[comments]]
order = 5
subject = "عن تكريم مايكل مور"
author = "سوسة المفروسة(الاصلية غير اللي فوق)"
posted = "2006-04-02"
text = "هو صحيح جورج بوش زبالة و مسيره لمزبلة التاريخ.لكن لازم نعرف كلنا ان المعارضين له في امريكا مش ضروري يكونوا اصدقاءنا...يعني مثلا مايكل مور اللي عبدالله مفتاح عايز حد يكرمه مش صعبان عليه الغراق و لا العرب و لا هو حقاني و لا حاجه ..و لو شفت فهرنهايت 9/11 هتلاقيه بيقول ان العراق ماعملتش في امريكا حاجه لكن اللي لازم تنضرب هي السعودية لانها هي اللي خططت و نفذت 11سبتمبر و بوش بيداري عليهم عشان بياخد منهم فلوس هو و ابوه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133414/http://www.20at.com/article2.php?sid=636"

[[comments]]
order = 6
subject = "كفاية حقد على السعوديين"
author = "دلوعة السعودية"
posted = "2006-07-10"
text = "فعلاً انتي اسم على مسمى يا (سوسة)!<br />السعودية ليس لها علاقة بأحداث 11 سبتمبر بل هي خطة أمريكية ومتورط فيها يهود، وإلا لماذا غاب الموظفون اليهود في نفس اليوم الذي تفجر فيه البرج؟؟!<br />ما هذا الحسد والحقد على السعودية وأهلها الطيبين.. كلما وقعت مصيبة أشار الكل بأصابع الاتهام إلى السعوديين؟؟!!<br />كفاية حسد.. كفااااية ظلم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133414/http://www.20at.com/article2.php?sid=636"

[[comments]]
order = 7
subject = "ولا انت فاهمه حاجه"
author = "سوسة المفروسة"
posted = "2006-07-25"
text = "لو خدتي ثانيه من وقتك و قريتي تعليقي كويس هتلاقي اني باعترض على مايكل مور عشان بيتهم السعوديه يعني مع السعوديه مش ضدها....لو تبطلي تبقي دلوعة و تشغلي مخك شوية هتفهمي اللي انت بتقريه...شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133414/http://www.20at.com/article2.php?sid=636"
