[[comments]]
order = 0
subject = "كويس ان الموضوع اتفتح"
author = "عبدالله مفتاح"
posted = "2006-03-29"
text = "في مخرج امريكي اسمه مايكل مور اخرج حوالي 3 او اربع افلام بينتقد فيها الازدواجيه في السياسه الامريكيه ومتعاطف جدا مع الشرق الاوسط كله.<br />طيب الراجل ده مفيش دولة عربيه تكرمه؟<br />اي حد بس يظهرله ان احنا متعاونين معاه.<br />ولا شاجي وسلفستر ستالوني هما بس اللي ندعوهم للحضور بلادنا<br />انا عايز حد يفكر بس انه يكرم او يظهر لمايكل مور انننا معاه في طريقة تفكيره."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133414/http://www.20at.com/article2.php?sid=636"

