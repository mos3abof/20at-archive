author = "قفلوا الجريدة خلاص"
posted = "2009-10-05"
text = "صفوت بية الشريف قفل الجريدة خلاص<br />وبعدين مين من سلك الفنانين [ *** ] دة فوق الشبهات<br />من شهرين الست صباح اعترفت فى برنامج تليفزيونى انها واثناء زواجها من رشدى اباظة طلبها امير مغربى لتنام معة ففعلت من وراء رشدى اباظة<br />دى وسط كلة قذارة<br />وكل شىء جايز"
archived = "2009-10-08"
capture_url = "https://web.archive.org/web/20091008005454/http://www.20at.com:80/masr/2khbar/13624-2009-10-05-12-53-25.html?"

