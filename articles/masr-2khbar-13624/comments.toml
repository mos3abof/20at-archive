author = "فى جريدة المصريون"
posted = "2009-10-05"
text = "ان الذى ابلغ جريدة البلاغ بالخبر هو لواء شرطة<br />ثانيا ان هناك صورة محضر عندهم من قسم الشرطة بالحادثة<br />ثالثا ان الشرطة اخفت المحضر الاصلى من السجلات لسبب ما<br />ان اغلاق الجريدة ضد الدستور وقبل صدور اى حكم من اى محكمة<br />وواضح ان رئيس التحرير ليس اهبل لينشر اخبار بدون الاستناد الى مصدر ويعرض نفسة للمحاكمة واغلاق الصحيفة الا اذا كان رئيس تحرير يعمل جزماتى بعد الظهر<br />اعتقد شخصيا ان الخبر فية شىء ما من الصدق والحقيقة ولكن هناك من يحاول اخفائة لسبب ما<br />والامر عند القضاء<br />وستظهر بلاوى"
archived = "2009-10-08"
capture_url = "https://web.archive.org/web/20091008005454/http://www.20at.com:80/masr/2khbar/13624-2009-10-05-12-53-25.html?"

[[comments]]
