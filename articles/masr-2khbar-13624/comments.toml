author = "osos"
posted = "2009-10-12"
text = "فى البداية ويصراحة اللهم لا أفتراء على الناس ولكن الحق احق أن يتبع لو كان هولاء الاشخاص مظلمين سيظهر ولكنى عن نفسى أوؤيد ان اشخاص غير طبعيين من يسمح بان تقبل وتحضن زوجته ومن يمثل انه استغفر الله ولان اقول الكلمة لانحطاطها فمن السهل جدا جدا أن يصبح حقيقه فى ثانية وعلى رأى أهل الفن تقمس الشخصية وما خفى كان أعظم<br />والعظمه لله سبحانه وتعالى وحفظ الله أهلينا والمسلمين أجمعين وتاب على الظالمين أنفسهم<br />والله لا أفتراء على الخلق ومسك الختام الصلاو على سيدنا رسول الله خير خلق الله صلى الله عليه وسلم وعلى اهل بيته وأصحابه الطاهرين وسلم اجمعين"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202064450/http://www.20at.com:80/masr/news/13624-2009-10-05-12-53-25.html"
