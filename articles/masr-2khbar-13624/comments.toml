author = "فضيحه بجلاجل"
posted = "2009-10-06"
text = "ده الخير مش جديد وكثير من الناس عارفه بان بعض الفنانين قييز gays من غير بوليس اداب<br />مره بالصدفه كنت بعمل شات مع احد الشباب وقال لي ان قييز و صرح لي باسماء المعروفين في الوسط الفني انهم قييز<br />نور الشريف<br />سمير صبري<br />خالد النبوي<br />خالد ابو النجا<br />هاني سلامه<br />رامز جلال<br />ثامر حسني<br />شريف رمزي<br />حمدي الوزير<br />وياخبر اليوم بمليون بكره ببلاش<br />وبالاضافه اليهم<br />هشام عبدالحميد<br />ومن سوريا<br />جمال سليمان<br />تيم حسن<br />فراس ابراهيم (شقيق اسمهان في مسلسل اسمهان)"
archived = "2009-10-08"
capture_url = "https://web.archive.org/web/20091008005454/http://www.20at.com:80/masr/2khbar/13624-2009-10-05-12-53-25.html?"

