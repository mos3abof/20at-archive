subject = "رجاء خاص"
author = "محمد توفيق"
posted = "2006-07-09"
text = "رجاء خاص يا شباب ان تذهبوا لقراءة المقال على موقعه الاصلي http://mabadali.blogspot.com/2006/07/blog-post.html<br />لتعرفوا وجهة نظر الكاتب كاملة ولا داعي للردود ذات القوالب الجاهزة من نوعية \"انه يهاجم الحجاب .. عليه اللعنة... \"الحجاب فرض\" فهو لا يناقش قضية الحجاب بقدر ما يناقش ردود فعل العلمانيين والمتدنيين تجاه قضية حجاب حنان ترك<br />تحياتي"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124845/http://masr.20at.com:80/article.php?sid=596"

