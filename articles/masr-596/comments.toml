[[comments]]
order = 11
subject = "الحجاب .. الحجاب .. لنخلي ليلتكوا هباب"
author = "أسامه"
posted = "2006-07-07"
text = "الحجاب .. الحجاب .. لنخلي ليلتكوا هباب تلك العبارة المشابهة لعبارة الفيلم المشهور .. واقع الحال ، ما ان ترتدي فنانة الحجاب - و هي حرة - الا و تخرج علينا طيور الظلام لتملأ سماءنا تهليلا و فرحا، و يخرج علينا عواجيز الفرح ليملأوا الدنيا تنظيرا و تحذيرا .. متي ينضج المجتمع ؟ متي نصبح احرارا فيما نفعل و فيما نقول و فيما نعتقد؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124845/http://masr.20at.com:80/article.php?sid=596"

