subject = "اسامة انور عكاشة"
author = "منتصر"
posted = "2006-07-08"
text = "اكثراهل الفن الغاضبين علي حجاب الفنانات<br />هو الكاتب اسامة انور عكاشة اللي كان حاجة كبيرة وفلس فكريا بعد ليالي الحلمية وارابيسك ومش لاقي حجة يقوللها وبيكرر نفسه واصبحت مسلسلاته كلها مط وتطويل . وهو المعادل للملحن اللي فلس برضه . حلمي بكر"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124845/http://masr.20at.com:80/article.php?sid=596"

[[comments]]
