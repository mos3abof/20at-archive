posted = "2006-07-02"
text = "والله انا شايفة ان كل واحدة تتجحب براحتها<br />احنا متفقين ع المبدأ وهو ان الحجاب فرض<br />يبقى اي حاجة تيجي بعد كده مش مهم واللي هتتجحب لنفسها واللي مش هتتحجب لنفسها برضه"
