text = "السلام عليكم :<br />معلش يمكن انا صعيدي شوية مش بفهم وفهمي على قدي كتير قوي بس انا ليا استفسار وتساؤل هو الحجاب بقى عيب ..... وبقى اللي تتحجب بتتحجب عشان الفلوس والشهرة ما أظنش بس يمكن حد ليه رأي تاني وفككوا من الحوارات اللي ما بتجيبش فايدة"
