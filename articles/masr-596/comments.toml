[[comments]]
order = 4
subject = "نحن فى المرييييييخ"
author = "باتيستوتا"
posted = "2006-07-03"
text = "أنا لم أخرج بفكر محدد لهذا المقال الملغم بالألفاظ المركبةحقا لا أعرف هل عدم فهمى لاغلب فقرات المقال عن جهل وتخلف منى ام بسبب نقص بلاغة كاتبه فمن المفترض ان نخاطب الناس على قدر فهمهم وليس على قدر علمنا وحتى لا يكثر الكلام وندخل فى حوارات فلسلفية تضر أكثر مما تنفع الحجاب فرض على كل مسلمة تؤمن بدين الاسلام لذا لا نقول انه حرية وكل انسان حر فيما يفعل نعم حر ولكن فى حدود الشرع والا يترك الشرع والدين ولا يعمل به اصلا .<br />لذا ارجوكم اتركوا المحجبات فى حالهم لا تتكلموا عنهم فى خير او شر وغير المحجبات لهم رب يهديهم الى العمل الصالح"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705103258/http://masr.20at.com:80/article.php?sid=596"

[[comments]]
order = 5
subject = "هي الناس فهمت غلط و لا إيه؟"
author = "محمد السيد"
posted = "2006-07-03"
text = "العجيب إن المقال رائع جدا ... وكلام عمرو عزت فعلا عجبني لما قريته باللينكات ...<br />لكن دلوقتي واضح إن كتير مفهمش هو عايز يقول إيه ؟؟<br />أو مش فاهمين هو مع مين ولا ضد مين ...<br />والناس معاها حق في الكلام اللي بتقوله ...<br />فياريت يا كابتن مصعب تحط اللينكات ... ولا آجي أنا أعملها يعني .؟؟؟<br />وبرضه مش حاسكت ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705103258/http://masr.20at.com:80/article.php?sid=596"

