[[comments]]
order = 3
subject = "دكتور .... ولكن"
author = "أرسل هذا التعليق بواسطة : ابو شريف"
posted = "2006-06-04"
text = "يتحفنا الدكتور سعد الدين ابراهيم من آن لأخر ببعض الأفكار التي لاتعدو عن كونها دعارة ثقافية<br />فالدكتور سعد الدين يدعي الإيمان ويختم مقاله المسموم بلاحول ولا قوة الا بالله وفي المقال يحاول ان يقنعنا بأن نتفهم البهائية ولو مش قادرين فلآنهم مجتهدين وهذا أضعف الإيمان ... القرآن الكريم ونبينا الكريم يعلمنا أن الدين الإسلامي هو آخر الديانات السماوية وهو يريد أن ننحي هذا جانبا ونتعامل مع الموقف علي إنه إجتهاد ... وليس كفر ... الدكتور سعد الدين ابراهيم ومقاله الداعر يخبرنا بأن التاريخ سوف يخلد ويذكر بحروف من نور الدكتور الحناوي والدكتورة زوجته اللذان حاربا من أجل حفيدتهما ومن أجل اعطاء الشرعية للعلاقة التي ربطت بين هند والفيشاوي هي تقول زواج وهو يقول بفخر علاقة غير شرعية (زنا يعني) وتم الحكم بإثبات نسبها متجاهلين النص القرآني الذي يفيد بأن الولد للفراش (بس الفراش الشرعي)<br />عزيزي الدكتور سعد الدين ابراهيم لولا خزعبلاتك الدينية والسياسية التي تتحفنا بها لما تضامنت معك المؤامرات المتحدة الأمريكية ولكني أنتظر عدالة السماء والتي سوف تجعلك عبرة لمن تسول له نفسه بحماية الديانات التفصيل وشئت أم أبيت أنت ودعاة التحرر من كل شئ لايوجد ديانات سماوية سوي اليهودية والمسيحية والإسلام وماعدا ذلك كله احلام شياطين"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

[[comments]]
order = 4
subject = "spider man forever"
author = "حناوي"
posted = "2006-06-04"
text = "اولا:انا حناوي قح جداا ان جاز التعبير,اعتز بشدة بانتسابي الي هذه العائلة الكريمة...ولكن هذا لا يعني ابدا ان اتعصب لحناويتي علي حساب ديني...ماحدث من الدكتور حمدي الحناوي وابنته لا يحسب سوي عليه فقط كشخص عاقل مسؤل عن افعاله ..انا هنا مش بتبري من الدكتور وبنته انا بتبري من اللي عملوه..ظنوا ان الموضوع قاصر علي مشكلة بنت واحدة اسمها لينا وان ندالة شخص واحد اسمه احمد مبرر كافي لتغيير شرع الله..قبل الكلام ما يكبر مني ومنكم تقدروا تراجعوا كلام كل اهل العلم بالدين الاسلامي واهل العقل السليم طبعا اكيد هتلاقوا عندهم السبب اللي يخليني اقول اني بتبري من فعل الدكتور حمدي وبنته..<br />ثانيا:ما يخص الدكتور سعدالدين فاسمحولي اني امنحه ان جاز لي ذلك لقب الانسان العنكبوت ..واضح جدا اني كنت غلطان في ظني ان ديل الكلب ممكن يتعدل !!!انا ظنيت ان موقف الدكتور سعد\"هي ايه الحكايه؟هم كلهم دكاترة ليه؟\"من مسالة التوريث والقضايا الوطنيه ممكن يغفر له شوية من افكاره العلمانيه علي الاقل مؤقتا \"لغايه الهم اللي احنا فيه ما ينزاح\"لكن الظاهر اني كنت عبيط جدااااا<br />لكن انا ليه منحته هذا اللقب الغالي؟؟ اكيدمش بسبب خلاف شخصي بيننا لاسمح الله لاني ببساطة عمري ما شوفته ولا عايز اشوفه السبب الوحيد هو افكار الدكتور الفذ والمقال المنقول عن جريده المصري اكبر شاهد علي كده اقروا المكتوب كويس واحكموا بنفسكم..يا تري انا لو قريت مقال للدكتور المذكور هيكون ليه يعني؟عشان رايه مهم جدا لانه حاصل علي جايزة نوبل في الاداب؟؟؟طبعا لا ,ببساطة لان فجاة رايه بقي مهم لكونه احد ضحايا النظام المبارك لا اكثر ولا اقل..الراجل يا جماعه بيقول انه يعرف ناس خواجات هيساعدونا في الضغط علي الريس متولي..يبقي لازم نسمعه كويس ونشوف بيقول ايه عشان مصر لسه غا<br />اقرأ بقية التعليق .."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

