[[comments]]
order = 6
subject = "آتقى الله با سعد"
author = "زنوبه"
posted = "2006-06-04"
text = "يا دكتور سعد كنت فى الماضى معجبه بآرائك ونحليلاتك آما بعدآن قرآت لك هذا المقال فلقد تغيرت وجهة نظرى فيك تماما وآصابنى الغثيان<br />موضوع هند الحناوى لن آخوض فيه لآنه آعراض مسلمين ولا آملك آربعة شهود لآحكم بنفى آو آثبات آى مما يقال<br />آما موضوع البهائيه فآنت تدافع عن من هم يكفرون برسائل الله السماويه ويكتبون الكتاب بآيديهم ثم يقولون هذا من عند الله<br />آنا مسلمه ومؤمنه بالله ورسوله ولا آرضى آبدا آن تضع البهائيه والنصرانيه فى كفه واحده وتجمعهم فى مقارنه واحده لأن النصارى آهل ذمه. ولكنك بمنتهى الخبث قررت آن تقوم بمثل هذا الامر لآشعال آفكار مريضه تسرى بين آفراد المجتمع الان<br />آقول لك: آتقى الله فيما تكتب قبل آن تقبر ويآتى عليك يوم تقول فيه ربى آرجعون ـ فلا ترجع ولا يستجاب لك<br />هداك الله وهدانا"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

[[comments]]
order = 7
subject = "انا مستغرب!"
author = "أحمد"
posted = "2006-06-05"
text = "1-المسيحيين مش أهل ذمة..لأان معني الكلمة دي إنهم بيدفعوا جرية ومش بيدخلو الجيش..هم مواطنين زيي زيك..<br />2-د,سعد مش بيدافع عن البهائية لطن بيدافع عن حقهم في اعتناقها..بمعني..انا مش مسيحي..لكن من حق المسيحي إنه يؤمن بالمسيحية!!...تقولولي بس البهائية أصلها مش دين سماوي..أقولكم الفركة مش انه يؤمن بدين سماوي أو مش سماوي..الفكرة إن علاقته بربنا حاجة خاصة بيه..وربنا اللي حياحاسبه مش حد تاني..<br />3-او انتم عايزين تعاملو أصحاب الديانات التانية بالمنظر دة ومتعترفوش بحقهم في اعتناقها...تردوا إن الصين ولا اليابان ولا روسيات تطبق نفس الكلام عالميلمبن..وتقول عليهم أصلهم بيتبعوا دين مزيف؟؟؟"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

