[[comments]]
order = 12
subject = "توضيح بسيط"
author = "أنا لن أعلق على مسألة اعتناقهم للبهائية وأنها كالنصرانية، ولكني أحب أن ألمح تلميحا بسيطا...."
posted = "2006-06-06"
text = "البهائية ليست اجتهادا في الدين الإسلامي، والبهائيون لم يريدوها كذلك، وإنما هم أسسوها لتكون ديانة لها شرائعها الخاصة، والدليل على ذلك أن المرزا حسين (البهاء) لم يتوقف عند ادعاء الرسالة، بل لقد ادعى الألوهية، فكيف تكون البهائية اجتهادا في الدين الإسلامي؟!!!!!"
