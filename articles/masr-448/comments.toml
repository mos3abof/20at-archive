text = "اية الى حصل لدكتور دة انهبل انا اعرف الدكتور دة من كتابتة ان كان تعبان اعرف من كتابتة وان كان مضيق اعرف من كتابتة وانا فى المقال الاخير دة طلبت لة مستشفى الامراض العقلية والنفسية دة هوحال من تسلط علية الة البنكنوت الامريكية فلايستطيع ان يسمع او يرى الى ما يراة العقل الامريكى ولاا حول ولاا قوة الا باللة العلى العظيم فى العالم الى بتبس السم فى العسل"
