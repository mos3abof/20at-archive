[[comments]]
order = 10
subject = "اتفق واختلف معك حوار عقلانى"
author = "د.ميدو"
posted = "2006-06-06"
text = "عزيزى الدكتور سعد اعترف انى أحد المعجبين بارائك وجرأتك فى مواقفك ضد الحكومة كحقوقى نشط له مواقفه وتضخياته المختلفة.وانا كأحد المؤمنين بالحرية التى كفلها اسلامنا الحنيف اود ان اقول انى اتفق معك على بعض النقاط وأختلف على البعض الاخر......اتفق معك ان الحكومة دائما وابدا طريقتها واحدة لأشغال الناس عن القضايا المهمةلهم بأخرى ذات طبيعة تمس العواطف مثل ماحدث فى قضية عبدة الشيطان الشهيرة التى طلعت على فاشوش فشغلت الناس بقضية الحناوى والفيشاوى ونجحت فى هذا كالعادة ثم اتبعت ذلك بحكم مشبوه فى توقيته عن البهائيين وبرضه نجحت كالعادة مستغلة الوهج الدينى لدينا لكن اسمح لى ان أختلف معك فى ان ماحدث بين هند والفيشاوى كان اسلاميا خطأ كبير وصل الى حد الزنى باعترافهم فلا يصح أن نكافاهم ونصور اهلهم انهم أبطال الا فى أنهم وقفوا بجوار ابنائهم لأصلاح ما فعلوه.ثانيا بالنسبة للبهائيين فنحن كمسلمين مع حرية العقيدة لأى بشر ولكن شريطة ان لا يتنافى هذا مع ديننا وثوابته فاذا كان هؤلاء غير مصريين لقلنا هم احرار.واذا كانوا يعتقدون بمهدى منتظر أو امام مخلص لهم غير رسول لقبلنا ذلك ولكنهم يقولون بقول يضرب اسس عقيدتنا فى اصولها لذلك لنا حق رفض مايقولون"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

