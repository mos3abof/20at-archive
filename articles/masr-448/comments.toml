author = "mido"
posted = "2006-06-07"
text = "اولا ربنا يرمنا من الاسطى سعد ويارب يتوباو ياخده اخد عزيز مقتدر ويرينا فيه من اياته قول امين<br />ثانيا بالنسبه للست هند اللى بتقول انها متجوزه عرفى حتى لو متجوزه عرفى اقنعنى ايه المانع انها كانت تتجوز شرعى هيا مهندسه واحمد افندى ممثل ومعاهم فلوس ايه المانع اظن باباها كان هايوافق اللى خلاه يوافق انه يرفع قضيه نسب فى حاله زنا بين مش هايولفق على الزواج الشرعى كده ده اثبات ان ما كانش فيه زواج شرعى ولا عرفى وبعدين لما القاضى المحترم يحكملها بالحكم ده مش عارف انه كده ها يخلى كل بنت ليل تحمل تستند الى الحكم وتقول ده ابن فلان ولا بنت فلان واعملوا دى ان ايه ويلا هيصا المفروض نستعد لاستقبال اطفال الزنا فى السنين السوده اللى جايه<br />ربنا يسامح القاضى وهند وكل اللى ساندوها<br />اما بالنسبه للبهائين<br />دول ناس مختلين عقليا المفروض ما نتكلمش معاهم اصلا سواء مسلم او مسيحى<br />لان دو عندهم خلل دماغى عاوزين يتعالجوا منه اللهم اهدنا واهدى ميع الناس لدين الحق وقول الحق"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

[[comments]]
order = 17
subject = "ليسوا موحدين"
author = "ابو عمر"
posted = "2006-06-07"
text = "الاخ احمد عدم دفع النصارى للجزيه لا يخرجهم من اهل الذمه<br />الاخ tuttos النصارى ليسوا موحدين<br />( لقد كفر الذين قالوا إن الله ثالث ثلاثه )<br />و يا ابو هند عرفت تربى ."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

[[comments]]
order = 18
subject = "جهل المثقفين"
author = "abee"
posted = "2006-06-07"
text = "الي كاتب هذه العبارات المسمومة إما أنك تنتمى الى جهلاء المثقفين فى زمانناهذا فأنصحك بالتعلم خاصة لتحددماهى ديانتك وعقيدتك وإما أنك تنتمى الى الآفات المنتشرة فى مجتمعناهذا فأنصح المسلمين أن يفهموا دينهم جيدا حتي لا يشوش عليهم عقيدتهم أمثال هذاالذي يبث سمومه في عبارات العسل<br />قال تعالى( قل يا أيها الناس إني رسول الله اليكم جميعا)<br />وقال(ومن يبتغى غير الإسلام دينا فلن يقبل منه)"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

[[comments]]
order = 19
subject = "سعد الصهيوني"
author = "قرفان من سعد الصهيوين وأمثاله"
posted = "2006-06-07"
text = "أولا أيه الي يخليكو تجيبو مقاله لشخصيه قذره زي سعد ده<br />ده شخص صهيوني ونشاط مركز أبن خلدون(سابقا)ابن صهيون(حاليا) معروف للجميع ولا يخفى على أحد<br />ولا نسينه تفاخره بديموقراطية أسرائيل<br />ولا نسيتوه أتهامه بالجاسوسيه ووالحكم عليه وتدخل ديفيد والش السفيه الأمريكي السابق في مصر وسبه للقضاء المصري<br />وبعد كده طلعوه براءه(قضاء نزيه)!!!!!<br />ولا نسيتو أن أمريكا خصصت له 2 مليون دولار من المعونه التي تقدم لمصر وأذا رفضت الحكومه المصلايه ستمنع المعونه<br />يا جماعه أنا بحب وبحترم عشرينيات (ولا البلد)<br />لكن لو لقيت فيها أقلام قذره مش هقول هكرهها لا<br />هحاربها كمان"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

[[comments]]
order = 20
subject = "لا مواخذة"
author = "علاء"
posted = "2006-06-07"
text = "انا مش عارف ادارة الموقع جابت الدكتور دة منين وهما لقينة فين انا حاسس انهم لقينة فى مقلب ذبالة اصل انا شامم رائحة نتنة فى هذا المقال ريحة ولا بد انتو جيبين كاتب المقال من ين طيب فى منة سائل لتنظيف بلعات الحمامات انا مش عارف هما لقينة فين انا عارفت جيبنة من عربية كلاب ىاو لقينة طافح على وجة بلاعة ولا حول ولاقوة الا باللة العلى العظيم علاء عادل محمد السنبلاوين دقهلية"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

[[comments]]
order = 21
subject = "يا علمانيين مصر...اتوكسوااا"
author = "شايل قلمه"
posted = "2006-06-07"
text = "يا جماعة بلاش تتهموا الدكتور بانه صهيوني او خائن لوطنه...كده الكلام مايبقاش سليم..لان الراجل له فعلا مواقفة الوطنية المعروفة..لكن الواضح جدا ان الدكتور سعد علماني!!تنكر كده يا دكتور؟<br />ما اظنش انه هينكر ده بل اكيد هيتفاخر به..وهيدافع عن العلمانيه وكل الافكار المستوردة اللي اكيد سمعتوا عنها..يا دكتور سعد ليك ولكل العلمانيين اللي بيكرهوا الاسلام وشايفين فيه معاداة لباقي الاديان وحجر علي حرية الراي وتخلف حضاري ووووغيرة من الكلام اللي انت عارفه..ارجوك يا دكتور تقرا كويس عن الاسلام...لالالا..اقرا كويس في الاسلام..اللي هوة القران والسنه الصحيحة ..وبلاش كتابات المستشرقين والمفكرين الاوروبيين اللي بينظروا للدين علي انه افيون الشعوب."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

[[comments]]
order = 22
subject = "يا علمانيين مصر اتوكسواا.."
author = "شايل قلمه"
posted = "2006-06-07"
text = "اكيد وقت ماهتقرا في الاسلام قرايه بسيطة اكيد هتعرف ليه كل الناس اللي فوقي كان بيشتموا في حضرتك وبيتهموك بالزندقه!!!..<br />احب اوضح لحضرتك حاجة اخيرةارجع لتاريخ البهائية اللي هوة لسه بتاع امبارح وانت تعرف وتتاكد انهم عبارة عن حركة سياسية...مش ديانه ولا يحزنزون,شوف مين اللي ساندهم زمان ومين اللي بيساندهم دلوقت. اسال نفسك ...الناس دي عايزة ايه من اعتراف الدولة بيهم بالظبط؟<br />واخيرا احب اعرف حضرتك ان مصر مش دولة علمانيه وعمرها ما هتكون كده..مصر دولة اسلاميه غصب عن عين حضرتك وعن عين اللي بيحكمنا..ولا حول ولا قوة الا بالله!!!!!!!"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

[[comments]]
order = 23
subject = "و من يتقى الله يجعل له مخرجا"
author = "SSASSOOO"
posted = "2006-06-07"
text = "انا مش عارفه ازاى جتلها الجرأه دى لهند؟<br />يا شيخه اتقى الله<br />و من يتقى الله يجعل له مخرجا<br />روحى توبى و اتحجبى ولا صلى لك ركعتين يمكن ربنا يغفر ذنبك"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

