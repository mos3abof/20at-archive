[[comments]]
order = 13
subject = "يا خسارة"
author = "tottus"
posted = "2006-06-07"
text = "انا غير موافقة اطلاقا على ما يدعيه الكاتب من ان هند الحناوى كانت تحظى فى مصر بالتعاطف لقد اذهلنى ان تتحدث هى و اهلها عن الموضوع و كانها تتباهى بما فعلته هى و شريكها الماسوف عليه و الذى كان يجيد جدا تمثيل دور الشام المثالى ان جرم احمد الفيشاوى يفوق بكثير هند لان بعضنا كان يعتبره قدوة للاسف كشاب مسلم<br />\"الزانى و الزانية فاجلدوا كل واحد منهما مائة جلدة \"<br />اما بالنسبة للبهائية فان الكاتب يدس لنا السم فى العسل يجعلنا او يطلب منا ان نتسامح و نسيبهم فى حالهم هى البلد ناقصة خراب ثم ان اخواتنا المسيحيين لا يقارنون بهم لانهم و ان لم يؤمنوا بسيدنا المصطفى محمدفانهم يوحدون بالله الواحدالاحد<br />فنرجو الا تخلط الاوراق<br />افكارك مدسوسة علينا من بره يا دكتور"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

[[comments]]
order = 14
subject = "حرام عليكم"
author = "اسامة"
posted = "2006-06-07"
text = "حرام عليكم كيف نقف بجوار امراة زانية<br />ونجعل قضيتها راى عام<br />ومن ينادى للبهائية اتقى اللة فهل بعد الرسول رسول اتقى اللة قبل ان تصلى نارا جبارة<br />محمد الرسول خاتم الانبياء والمرسلين<br />وما البهائية الا فرقة ضالة ومضلة لا ينبغى ان نذكرهم ونلقى لهم بالا او حتى نناقش ما يسمونها قضية<br />للللللعنههههههههم الة عز وجل<br />وصلى اللى على محمد النبى الامى وعلى الة وصحبة وسلم"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025954/http://masr.20at.com:80/article.php?sid=448"

