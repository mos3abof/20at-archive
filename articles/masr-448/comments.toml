posted = "2006-10-15"
text = "اولا بالنسبة لموضوع هند الحناوي انا بشجع موقفها ووقفتهالسبب واحد وهو انها تفوق كل البنات وتخليهم يفكرو بدل المرة عشر مرات قبل مايتجوزوا عرفي او يمشوا في طريق الحرام وانا بتهيالي ان في بنات كتير فهمت الدرس كويس اوي<br />وانا ان كنت مستغربه من موقف الحقير احمد الفيشاوي واسرته الفنيه من انهم يعلنوا صراحتا ان ابنهم ( زنا )لكن ( لم يتزوج )عمركم شوفتوا حقارة اكتر من كده<br />ام بالنسبه للبهائيون فانا شايفه ان الباشا الدكتور متعاطف معاهم اوي ( هو انت منهم والا ايه ؟) احنا ايه المطلوب مننا اننا نتعاطف معاهم ونشجاعهم علي مخالفه شرع الله بناءا علي ايه ما احنا لو وفقنا علي اللي هما عايزينه نبقي بنعترف بيهم وبدينيتهم ونبيهم المذعوم وبنشجعهم ينشوره دعوتهم وعقائدهم وده مش ممكن نسمح به محمد خاتم الانبياء والرسل ولا نبي ولا رسول بعده وبعدين انا عايزة اسال حضرتك سؤال هو انت مقتنع بافكارهم ومعتقدتهم دي والا انت عميل ليهم ولليهود<br />وعلي فكرة انا بقترح ان كل اللي بيدافع عن البهائيون المفروض يترجموه في ميدان عام<br />نشهد ان لا اله الا الله وان سيدنا محمد رسول الله ولا نبي بعده"
