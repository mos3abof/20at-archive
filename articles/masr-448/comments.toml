text = "البهائيه دين<br />سلطان المجايري<br />لا‏ ‏خلاف‏ ‏أن‏ ‏غاية‏ ‏الدين‏ ‏هي‏ ‏الوفاق‏ ‏والوداد‏ ‏بين‏ ‏البشر‏,‏ومع‏ ‏ذلك‏ ‏جعله‏ ‏الناس‏ ‏منذ‏ ‏بداية‏ ‏الخليقة‏ ‏مصدرا‏ ‏للشقاق‏ ‏والجدال‏ ‏والقتال‏,‏علي‏ ‏الرغم‏ ‏من‏ ‏تناقض‏ ‏ذلك‏ ‏مع‏ ‏الطبيعة‏ ‏الروحانية‏ ‏لجميع‏ ‏الأديان‏ ‏التي‏ ‏يركز‏ ‏جوهرها‏ ‏علي‏ ‏التراحم‏ ‏والبر‏ ‏والإحسان‏,‏فالدين‏ ‏يفرض‏ ‏حسن‏ ‏معاملة‏ ‏الغير‏.‏وقد‏ ‏يكون‏ ‏السبب‏ ‏وراء‏ ‏التحيز‏ ‏والتعصب‏ ‏ما‏ ‏تلقيه‏ ‏قداسة‏ ‏الدين‏ ‏في‏ ‏روع‏ ‏أتباعه‏ ‏من‏ ‏امتناع‏ ‏البحث‏ ‏الحر‏ ‏في‏ ‏معتقداته‏,‏إلي‏ ‏جانب‏ ‏ما‏ ‏يفرضه‏ ‏التقليد‏ ‏المتوارث‏ ‏من‏ ‏أخذ‏ ‏تعاليم‏ ‏الدين‏ ‏عن‏ ‏رجال‏ ‏متخصصين‏ ‏دون‏ ‏تحليل‏ ‏أو‏ ‏تمحيص‏,‏وكلا‏ ‏الأمرين‏ ‏معدوم‏ ‏الأساس‏,‏ومؤداهما‏ ‏ضعف‏ ‏نفوذ‏ ‏الدين‏ ‏ذاته‏,‏وتسلط‏ ‏التعصب‏ ‏علي‏ ‏أفكار‏ ‏الناس‏.‏ولو‏ ‏واجه‏ ‏كل‏ ‏فرد‏ ‏نفسه‏ ‏اليوم‏ ‏باحثا‏ ‏عما‏ ‏حمله‏ ‏علي‏ ‏اعتناق‏ ‏دين‏ ‏دون‏ ‏غيره‏,‏وعما‏ ‏يثبت‏ ‏صدق‏ ‏الدين‏ ‏الذي‏ ‏اعتنقه‏ ‏لأدهشه‏ ‏الجواب‏.‏وقبل‏ ‏أن‏ ‏يفيق‏ ‏من‏ ‏دهشته‏ ‏يأتيه‏ ‏سؤال‏ ‏آخر‏ ‏وهو‏:‏إن‏ ‏كان‏ ‏هذا‏ ‏الدين‏ ‏الذي‏ ‏اعتنقه‏ ‏حقا‏ ‏فلماذا‏ ‏لم‏ ‏يؤمن‏ ‏به‏ ‏الآخرون؟‏ ‏ولماذا‏ ‏يعترض‏ ‏عليه‏ ‏أصحاب‏ ‏الديانات‏ ‏الأخري؟‏.‏<br />إن‏ ‏الناظر‏ ‏في‏ ‏تاريخ‏ ‏الأديان‏,‏والمدقق‏ ‏في‏ ‏تسلسلها‏ ‏يري‏ ‏أن‏ ‏التاريخ‏ ‏يعيد‏ ‏نفسه‏,‏وأن‏ ‏الاعتراض‏ ‏علي‏ ‏الأديان‏ ‏يسير‏ ‏علي‏ ‏نفس‏ ‏المنوال‏ ‏والنسق‏,‏ويدرك‏ ‏أن‏ ‏رؤساء‏ ‏الدين‏ ‏السابق‏ ‏في‏ ‏كل‏ ‏زمان‏ ‏هم‏ ‏أول‏ ‏من‏ ‏يقومون‏ ‏بالاعتراض‏,‏ولا‏ ‏يسعهم‏ ‏إلا‏ ‏تكفير‏ ‏كل‏ ‏من‏ ‏يؤمن‏ ‏بهذا‏ ‏الدين‏,‏فهم‏ ‏يؤمنون‏ ‏فقط‏ ‏بما‏ ‏سبقهم‏ ‏من‏ ‏رسالات‏,‏لأنها‏ ‏جاءت‏ ‏صريحة‏ ‏في‏ ‏كتا<br />اقرأ بقية التعليق .."
