posted = "2006-06-09"
text = "ليس من حرية التعبير ان يكون المجتمع كله فاسد ومنحرف والله اعلم اذ ما كانت علاقة هند واحمد زنا او زواج عرفى وفى كلا الحالتين لم يكن من الواجب ان تبقى هند الحناوى رائدة الحرية والديمقراطية فكان لابد ان يشعر كلا من هند واحمد بخطائهما معا ليس كل شىء نضع عليه اسم الحرية والديمقراطية يكون صحيحا"
