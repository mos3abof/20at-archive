[[comments]]
order = 33
subject = "حسبنا الله و نعم الوكيل"
author = "يا عم ارحمنا بقى و كفاية قرف الكلام ده تقولوه فى الدولة المنحلة اللى انت عميل ليها و انت تعرفها كويس جداً مامتك امريكا"
posted = "2006-06-26"
text = "حسبنا الله و نعم الوكيل فيك و فى أمثالك عارف انت بتفكرنى بمين بتفكرنى بالعملاء العراقيين فى العراق<br />حسبنا الله و نعم الوكيل<br />عايزين تعملوا ايه تانى فى البلد دى عايزين انحلال اكثر من كده لو كنا فى دولة تحكم بشرع الله لكانت قطعت رقبة كل من اشرت لهم فى مقالك القذر فالزنا له حد و كذلك الردة لها حد<br />حسبنالله و نعم الوكيل أسأل الله احدى اثنتين :-<br />اما الهداية<br />او ان يفضحك على رئووس الخلق كما كانت فضيحة ما تسمى هند الحناوى و أحمد الفشاوى او ما يفوق<br />حسبنا الله و نعم الوكيل"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222335/http://masr.20at.com:80/article.php?sid=448&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 34
subject = "شكرا لك هند"
author = "طل الملوحي"
posted = "2006-06-28"
text = "الصراحة انني اردت ان انشر هذه المقالة فقط ولااود التعليق على هند الحناوي:<br />ياشعوب العالم استيقظوااا !!<br />يااخي عندما بدات بكتابة رسائلي لم يكن يخطر ببالي ان هناك اعداء للانسانية بهذا المستوى من الشناعة لم اكن اظن ان هناك من يكره الانسانية ويخدعها بهذا الشكل المخيف !!لقد احببت الانسان واردت له ان يعيش على هذه الارص بسلام فدعوت الى الحرية والمحبة وتفاهم الحضارات وتبادل الثقافات ومكافحة الفقر ورايت ان هذه الدعوة هي امل كل انسان يعيش على هذه الارض لكن الواقع غير ذلك فهناك مجموعة كبيرة من الناس يؤلمهم ويزعجهم ان يروا السلام يعم الارض!!؟وعندما حاولت الرد عليهم هددوني بلغتهم القاسية الباردة التي تشبههم؟<br />ان اشد مااستغرب منه ان تهاجم فتاة لم تكمل عامها الخامس عشر بهذه الشدة وتلك القسوة من قبل شبكة اظن انها كبيرة بما يكفي فتهددها في بيتها بكل صلف ووقاحة من خلال الكمبيوتر لالشيء الا لانها تدعو الى السلام والتقريب بين الامم.<br />ارجو الله ان يحمي العالم من امثال هؤلاء النس الذين يعتبرونمجرد الحديث عن السلم العالمي وعن انسانية الانسان يهدد وجودهم ويستدعي ازالة من يتكلمون به ؟<br />وليعلموا اني لن اخشاهم وساستمر بالكتابة رغم انفهم ورغم تهديداتهم ولن تقف الجدران التي وضعوها حائلا بيني وبين الانسان الحر في هذا العالم !<br />ياشعوب العالم تنبهوا واستيقظوا يااصحاب الصحافة الحرة يااصحاب الكلمة الصادقة استيقظوووو!!"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222335/http://masr.20at.com:80/article.php?sid=448&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

