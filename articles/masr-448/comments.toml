posted = "2006-06-09"
text = "أترك البهائيون في حالهم ياراجل .. دا كلام .. كبشر آه .. إنما بادعائهمأنه دين ظهر حديثا .. دين بلا كتاب .. دين برأي فرد كتب مجموعة مقالات وآراء في كتابه أسماه الأقدس .. لم أكن أتخيل منك يا سعد الدين ابراهيم هذا ؟ حسبنا الله ونعم الوكيل .."
