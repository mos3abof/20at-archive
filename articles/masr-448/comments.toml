subject = "منك لله ياسعد"
author = "المصري"
posted = "2006-06-09"
text = "نفسي أشوفك وأخنقك بإيدي .. وليكن بعد ذلك ما يكون .. حرية الرأي مطلوبة .. لكن التخريف دا شيئ بشع . بشع يا سعد .. دلوقت عرفت وعرف الآلاف ما بداخلك البذيئ .. روح منك لله .. ولن يهدأ لي بال إلا بعد زوالك أو أن أقابل ربي"
