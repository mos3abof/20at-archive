[[comments]]
order = 0
subject = "حضانة"
author = "محمد محمود مدرس مساعد بجامعة الازهر"
posted = "2006-08-29"
text = "ياترى جامعة خاصة ازاى ب 100000 جنية هو سيادته عايز يفتح حضانة ازهرية؟ كمان كل التعليم الازهرى مش هاينفع فيه بزنس غير فى المرحلة ما قبل الجامعية وده لاسباب كتيرة منها ان ناس كثيرة بتحب تعلم ابناءها فى الازهر للحفاظ على هويتهم الاسلامية و العربية و كنوع من انواع التدين. اما فى المرحلة الجامعية، فجامعة الازهر عبارة عن جزئين الاول الكليات العربية و الاسلامية و دى طبعا ماينفعش فيها بزنس لان خريجيها لا بيشتغلوا ولا يقدرو يدفعو مصاريف. والاجزء التانى هو الكليات العلمية ودول بيدرسو مقررات دينية و عربية تمثل حمل كبير جدا هايرفض اي حد انه يتحمله لاسيما مع وجود مصاريف. وعليه فنحن امام امرين اما انه مشروع فاشل واما انه يكون اى شىء اخر لايقبله اى مصرى."
archived = "2006-09-01"
capture_url = "https://web.archive.org/web/20060901132514/http://masr.20at.com:80/article.php?sid=853"

