subject = "محمد رضا"
text = "كان نفسي حد يكتب سطرين تحت كل صورة نعرف إيه ف الصورة بالضبط ومين قام بتصويرها وأين مكان وتاريخ التصوير .. أية معلومة مفيده !!!"
