subject = "أحمد"
text = "نا آسف فعلا يااخونا..حاولت بكل الطرق أن أجد أي معلومة توضيحية علي الصور فلم أجد ولذلك كتبت في تقدمة الصور أنها صور للفرجة و لتنقية الذاكرة ليس إلا..بالطبع المعلومة كانت ستفيد كثيراً ولكن في كل المواقع الموجود بها صور للعراق القديم تعرض الصور بإعتبارها جاليري وبلا تعليق.<br />شكرا"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803040404/http://www.20at.com:80/article.php?sid=350"

