[[comments]]
order = 3
subject = "بيرو"
text = "عندي صور احلي واجمل فيهاالامجاد بحق وحقيقي وبتخلي اللي يشوفها ينسي صدام حسين نفسه موش صوره ... حد عارف صور ايه الي بتكلم عنها؟؟؟؟ اكيد طبعا صور ابطال الفالوجة واللي مخاليين الامريكان (يكاكوا)..صحيح .. أمجاد يا عراق امجاد"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803040404/http://www.20at.com:80/article.php?sid=350"

