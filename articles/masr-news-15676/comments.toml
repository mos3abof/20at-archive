[[comments]]
order = 2
subject = ""
author = "باقى 320 سنة"
posted = "2010-03-10"
text = "هانت باقى 320 سنة<br />فى نكتة اتقالت زمان<br />ان احد المنافقين اهدى الرئيس مبارك سلحفاة<br />فسالة السيد الرئيس<br />اشمعنى يعنى اخترت السلحفاة<br />فرد<br />لانها يا ريس بتعيش 400 سنة وبعدين تموت بعد 400 سنة<br />فرد علية<br />ماشى بكرة اشوف بعد 400 سنة ان كان كلامك دة صح والا غلط<br />فمتقلقوش<br />تهانى اية<br />الراجل لسة فى عز شبابة وصحتة ما شاء اللة والبرادعى هو اللى هيفلسع قريب<br />ترجع بالسلامة ياريس"
archived = "2010-03-12"
capture_url = "https://web.archive.org/web/20100312124056/http://www.20at.com:80/masr/news/15676-2010-03-09-14-12-10.html"
