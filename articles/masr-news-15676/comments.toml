author = "زهير ابن ابى سلمى"
posted = "2010-03-09"
text = "شاعر جاهلى بلغ الثمانين من العمر فكتب قصيدة معلقة درسناها فى المدرسة زمان<br />ومهما تكن عند امرىء من خليقة ——— وان خالها تخفى على الناس تعلم<br />سئمت تكاليف الحياة ومن يعش —————— ثمانين عاما لا ابا لك يسأم<br />رايت المنايا خبط عشواء من تصب ________ تمتة ومن تخطىء يعمر فيهرم"
archived = "2010-03-12"
capture_url = "https://web.archive.org/web/20100312124056/http://www.20at.com:80/masr/news/15676-2010-03-09-14-12-10.html"

