text = "أنا مش عارف إيه اللى دخل شريط جديد وحفلات الموسيقى في ندوات راجل دين او علم<br />كل واحد في الدنيا ليه اهتماماته .. ناس بتحب الموسيقى وناس بتحب الندوات كل واحد حر في اختياراته<br />قبل ما نحاسب الشباب علي حضورهم حفلات لازم نشوف ايه اللي مش بيخليهم يحرضروا الندوات.. مش نتريق عليهم وخلاص"
