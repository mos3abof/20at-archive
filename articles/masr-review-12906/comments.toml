text = "ههههههههههههههه هههه<br />ياسلام عليكي يامصر<br />أهى الاغانى والكره أكبر اهتمامتنا<br />لو قالوا حفله هيحضرها تامر بيه ولا شرين هانم مصر كلها هتيجي<br />ولو قالوا عالم دين ولا حتى راجل هيناقش امورنا وندوة علم وثقافه<br />ابقى قابلنى لو حد سأل مش جه<br />دنياااااااااااا اااااا"
