author = "mohammed"
posted = "2009-07-31"
text = "والله انا عن نفسي في الموقف دة<br />بالرغم من نصائح دية بالمعاملة الحسنة مع المرضي<br />فانا سوف اقطع علاقتي بة فورا وتماما بلاقرف<br />عال مقرفة وبيعملو ما يغضب المولي عز وجل وفخورين وبيعترفو بكد<br />ومش معني انة تعرض لعملية اغتصاب وهو صغير انة يعمل كدة<br />دش مش مبرر نهائي<br />وعموما انا لا املك لة سوي الدعء انة ربنا يهديدة ويشفية"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805083612/http://www.20at.com:80/20at/7ayatna/12799-2009-07-30-13-18-02.html"

[[comments]]
order = 1
subject = ""
author = "رنا"
posted = "2009-08-01"
text = "انا بصراحة حاسة بتعاطف كبير مع الشاب الشاذ<br />يعني شو ذنبو اذا تعرض للاغتصاب و هو صغير"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805083612/http://www.20at.com:80/20at/7ayatna/12799-2009-07-30-13-18-02.html"

[[comments]]
order = 2
subject = ""
author = "عبد الرحمن"
posted = "2009-08-01"
text = "اخوي ابراهيم كان لازم تقطع صداقتك مع هذا\" الشب\" قبل فترة طويلة لما بدا يتشبه بالنساء بملابسه وحواجبه<br />بصراحة أنا لا يمكن أن أقبل بصديق على هذا الشكل"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805083612/http://www.20at.com:80/20at/7ayatna/12799-2009-07-30-13-18-02.html"

[[comments]]
order = 3
subject = ""
author = "لأ طبعا"
posted = "2009-08-02"
text = "دا تحريض و دعوة لانتشار الشواذ المثليين<br />فالمرء على دين خليله<br />و الطيور على أشكالها تقع<br />و من عاشر القوم 40 يوم يا صاروا منه يا صار منهم<br />و معرووووووف جدا نتيجة الاختلاط مع هؤلاء الأشكال<br />دي دعوة صريحة و لكن يرفضها كل انسان عنده دين و أخلاق و هذه النصايح الغالية وفروها فل يتقبلهم المجتمعات العربية مهما قلتم<br />عجبي عليك يا زمن هيجوا شوية عيال يضحكوا علينا بكلمتين"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805083612/http://www.20at.com:80/20at/7ayatna/12799-2009-07-30-13-18-02.html"

