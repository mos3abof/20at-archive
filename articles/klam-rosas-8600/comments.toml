[[comments]]
order = 9
subject = ""
author = "انسان"
posted = "2009-05-09"
text = "قضيت في الاردن تقريبا سبع اشهرعام 1991 وكل يوم كنا نذهب الي الساحة الجميلة لنلتفي بالعراقين وبالحفيفة انها ايام حلوة وكنا نتباحث في كل مجالات الحياة . وخاصة كيفية الحصول على معلومات للخروج الى الاقطار الاوربيه و الغربيه . في حينه لم نرى هذه الاعمال الغير الجيدة . شعب الاردن طيب وكان يحترم الغريب والمحتاج . وفي كل البلدان يوجد قليل من الناس يمارسون الغير الشرعي . اما الجهات الامنيه كانت تصون المنطقة من هذه الاعمال الغير الجيدة . ان الاردن بلد سياحي عريق . نرجو من صاحب الموقع ان لاينشر مثال الكتابات الغير لائفة ببلد عريق وحضاري ونحن العراقيين في ذلك الوقت كنا نشعر اننا في وطننا الثاني وشكرا والله يجعل من كل اللدين يكتبوا في المواقع بالكتابة الحسنه والاسلوب الحلو ويبعدهم من الكلمات البذئة وشكرا ."
archived = "2009-05-23"
capture_url = "https://web.archive.org/web/20090523230220/http://www.20at.com:80/klam-rosas/8600.html"
