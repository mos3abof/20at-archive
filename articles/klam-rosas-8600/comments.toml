author = "askndr"
posted = "2008-07-30"
text = "يتكلمون عن القوادات في الساحة الهاشمية فان في اي بلد عربي ومع الاسف الشديد هناك قوادات وبنات عاهرات<br />ولاتستثنى دولة عربية فليس الكلام يكون على الاردن الشقيق بلد الانبياء والصحابة عبدالله بن رواحة وجعفر الطيار<br />رضي الله عنهم … علما اني عملت في الساحةالهاشمية مدة ثمانية اشهر في معرض للهداية وذلك سنة 1997<br />فلم المس اي شي مما يتكلمن عنه من وجود قوادات وبنات عاهرا ت… فمختصر الكلام ماتبحث عنه تجده امامك<br />فاذا بحثت عن العاهرات وجدتهن واذا بحثت عن العلم وجدته واذا بحثت عن الدين وجدته وهكذا الحال في كل<br />البلدان العربية وللاسف الشديد.."
archived = "2009-05-23"
capture_url = "https://web.archive.org/web/20090523230220/http://www.20at.com:80/klam-rosas/8600.html"

