[[comments]]
order = 2
subject = ""
author = "أبو هزيم"
posted = "2008-04-03"
text = "هل فعلاً يوجد بنات حرام في الساحة الهاشمية _ في وقتنا الحاضر _ ؟؟؟<br />أم أنها مجرد أقوال مكذوبة وإشاعات ليس لها أساس من الصحة والصدق ؟؟؟<br />أم أن هناك بشرٌ يأتون بطرق غير شرعية ( ممارسة الجنس بالحرام ) .. فيصبح مكان هؤلاء _ في أقل الإحتمالات _ متشردين بالشوارع أو في دور مراكز رعاية مثل هؤلاء ( الفئة المهمشة والمضطهدة في عالمنا العربي والإسلامي بالأخص ) ؟؟؟<br />أم ماذا بالضبط ؟؟؟<br />هل هذا هو فعلاً مانريده من الحياة ؟؟؟<br />أم ماذا بالضبط …<br />حكاية بلا نهاية … ( الزنا )<br />أشكركم أجمعين وأخص بالشكر موقع عشرينات ( الوجهة المفضلة عند الشباب ) وعلى كاتب هذا الموضوع الأخ ( تامر الصمادي ) ..<br />شكراً ..<br />ودمتم في حفظ الرحمن الذي لاينام .."
archived = "2009-05-23"
capture_url = "https://web.archive.org/web/20090523230220/http://www.20at.com:80/klam-rosas/8600.html"

