[[comments]]
order = 4
subject = ""
author = "مراد هميسات"
posted = "2008-07-26"
text = "الساحة الهاشمية فيها بلاوي ، حيث تنتشر القوادات التي تقود على بعض الفتيات من اجل الدعارة ومن اشهر القوادات في الساحة الهاشمية ام علاء الغزاوية ونادية حيث يقمن باصطياد الشباب من اجل ايقاعهم كفريسة سهلة مع تلك الفتيات الداعرات ، وايضا ينتشر في الساحة الهاشمية اعداد كبيرة من الرجال والشباب الاردنيين المخنثين والشواذ من اجل ممارسة الرذيلة واللواط مغ غيرهم من نفس الجنس فمنهم من يمارسها كهواية ومنهم من يمارسها من اجل الحصول على النقود"
archived = "2009-05-23"
capture_url = "https://web.archive.org/web/20090523230220/http://www.20at.com:80/klam-rosas/8600.html"

