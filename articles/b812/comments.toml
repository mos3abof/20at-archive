subject = "تيتو الكبو"
author = "ساره محمد"
posted = "2006-06-10"
text = "انا بحب تامر اااااااااااااوي وبتمنه السنه الي انحكمها تمشي بسرعه عليه وعلينه لاننا مشتاقيلو بشكل جنوني ومش قادرين نستحمل مجرد التفكير بانو بمحنه<br />والي قال انو يستحق اكثر من الي انحكمو ده يبقى شاف نص الكبايه المليانه والنص الثاني تركو كلنه عرفين انوا المزور اعترف انو تامر مكنش عارف انو الاوراق مش سليمه<br />والمحكمه قالت انو الاوراق متمسكتش ببيت تامر ده تامر هو الي سلمها دي نص الكبايه الي محدش من الحاقدين عليه او الغيرانين منو عاوز يعترف فيها<br />وبعدين العاملين نفسهم خايفين على اولاد البلد من حبنا لتامر دول مكبرين الحكايه اوي لان حبنا لتامر مش جريمه بس الجريمه لمن واحد مننا يروح ويتورط بالادمان او الاخلاقيات الي انتو عارفيها<br />والي عاوز يحاسب تامر يروح بالاول يحاس الي فاتحين بيوت مشبوهه والي بيخربوا البلد بجد والناس مش ممكن انو يكونو كلهم نفس الاهتمامات لازم يكونو مختلفين للسياسه ناس وللفن ناس<br />والي مبيحبش تامر رجاء خاص ميدخلش على المواقع الي تخصو ويقعد يقول كلام فاضي بلا معنى<br />معا تمنياتي وتحياتي لتيتو الكبو<br />sara21_92@yahoo.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153154/http://www.20at.com/article2.php?sid=812"

