subject = "فكرني ببوسي شلبي"
author = "لما كان معها مقابلة على قناة اقرأ في برنامج قبل ان تحاسبوا عن اغاني العري، ولما اخذت المذيعة تستجوبها فباين ان بوسي شلبي تأثرت وخافت من الله وصارت تعيط! فسألتها المذيعة خلاص حاتوبي يا بوسي وتتحجبي؟ فقالت لها بوسي اه خلاص حاتوب وحاتحجب!"
posted = "2006-05-18"
text = "وأهي بوسي لا تابت ولا اتحجبت ..!!<br />هم أهل الفن فاكرينا هبل ولا عبط؟! هم بيضحكوا على مين؟ ربنا مطلع على النفوس ولا هم نسيوا!"
