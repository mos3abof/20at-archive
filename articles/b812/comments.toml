subject = "والله حرام"
author = "محمد سعودي"
posted = "2006-05-17"
text = "والله حرام ياجماعة دة حتي ميستهلش نتكلم عنةولا نجيب اسمة علي لسانا ..<br />يعني اية انا وشباب كتير بنحب مصر وبنخاف علي ترابها نروح نخدم ونتعب ونسيب اهلناوالناس اللي بنحبهم ونروح الجيش وأحنا كلنا في امس الحاجة لديقيقة في عمرنا نبني فيها مستقبلنا.. والانسان دة بكل بساطة يتنكر من وطنيتة وجنسيتة ويزور شهادة تأدية الخدمة العسكرية يا احساسك اياك في يوم من الايام تحتفل معانا بنصر اكتوبر ولا بتحرير سينا واياك في يوم تغني لمصر الي هية زي ما انت تبارئت من توبها هياالمفروض تلغي جنسيتك وروح دورلك علي بلد تشيلك يا عواد... انت المفروض تنعدم في ميدان عام يا خائن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153154/http://www.20at.com/article2.php?sid=812"

[[comments]]
order = 18
subject = "الله اعلم"
author = "شنعاء"
posted = "2006-05-17"
text = "يا جماعه الله اعلم بالنوايا<br />و ياما فنانيين و فنانات كانوا بيعملوا<br />العن منه و تابوا و لا احنا هنقفل باب التوبة فى وشهم ...<br />وبعدين احنا احسن حل ناخد الطيب و نسيب الخبيث<br />يعنى خبر قراءاته فى الدين يعتبر طيب<br />لكن خبر مظاهرات عصية الاستيك اللى بنات فافى وولاد ديليكاه عملوها ...خبر منيل بستين الف نيلة<br />البلد مليانه احباطات ..فبلاش نقدلها زيادة على نفوخنا<br />خلينا ناخد نص الكباية المليان مع الاعتبار اننا فى اخر الكادر نشوف نص الكباية الفاضى علشان نملاه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153154/http://www.20at.com/article2.php?sid=812"

