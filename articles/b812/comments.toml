posted = "2006-09-25"
text = "ياريت كل واحد يخليه فى نفسه وبلاش نحكم على حد وأحنا منعرف ظروفه ايه وأن الاعمال بالنيات ومن الاحسن نشوف عيوب نفسنا الاول وبعد كده نتكلم ونحاكم غيرنا لو قدرنا نحب بعض اكيد هنسامح اللى بيغلط"
