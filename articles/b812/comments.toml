text = "عادي ياجماعه ربنا يهدي بتحصل في احسن<br />العائلات ..مش قلتلك يابراء حبه حبه يجي عمرو اهو<br />تامر ابتدي ..ومستنين بعد اما تطلع من \"ابوزعبل\"<br />حاجه جامده..مش كخه يعني ...<br />\"نههمممغغفبلاىةوؤر\"ئ<br />دي رساله للحاجه نوفا مش انا خلاص اتشليت<br />مش علي الهوا يابت ..خليها بنا . ماتعرفوش مش انا لسه مكلمتش المحروسه اون لاين ..اقول ايه \"قرب ياختي\"."
