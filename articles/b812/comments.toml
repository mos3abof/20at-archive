text = "يانا اعوذ بالله ليش الحقد الي يقول انااكره تامر والي يقول يارب يعدوموه؟؟؟؟؟؟؟؟؟؟؟؟ايش هاذااعوذبالله ايش سوالكم عشان هاذا كله كلنااخطء واصلا محد ليه حق يتكلم فموضوع انواتاب وكل الكلام ده والصوره الموجوده هناصوره مركبه طبعا انامااكرة انويتوب بس ليش الكذب على الناس؟؟؟؟؟؟؟؟؟ويااصحاب العقول والاراء والكلام الي مالو طعم<br />لودي الصوره حقيقهكيف دخلوالمعسكر او السجن وصوره؟؟واصلا تامر من اول ماتقبض عليه حلق شعرو على الزيرووالصوره دي لاثاره البلبله فقط"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153154/http://www.20at.com/article2.php?sid=812"

