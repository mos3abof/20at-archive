subject = "يا جماعه"
author = "ساره محمد"
posted = "2006-06-04"
text = "يا جماعه بالعقل مش في خبر بقول انو تامر حلقولوشعرو والحيه طب ازي بالقتي بيطلعو دي الصوره بعدين معتقدش ان ده شكلو بالغنيه بتاعت عنيه بتحبك دا شكلو بالغنيت ارب حبيبي فكفايه فترى بقى انتو حاقدين ومش بتحبو بعدين همه قالو انو تامر كان ماسك القران خلال المحكمه وانتو فبركتوها وعملتوها جنايه ومعتقدش السجن جدرانو ملونه ولا ايه؟<br />ربنا ينتقم منكم<br />و الولد الهايف الي قال انو نصر محروس هو الي جمع البنات بالمحكمه اسمحلي اقلك انك متعرفش تكذب لان خارج المحكمه كان في حوالي اكثر من الفين شخص بيهتفو باسم تامر وقفلو شارع العباسيه والمناطق المجاوره بسبب المطاهرات<br />انته واحد سخيف تنفعك نانسي وله روبي اترك تامر القمر بحالو<br />ساره"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153154/http://www.20at.com/article2.php?sid=812"

