[[comments]]
order = 1
subject = "آه يا بلد"
author = "واحد مفقوع"
posted = "2006-05-16"
text = "في الوقت الذي يسحل فيه المتظاهرين في الشوراع ويضرب فيه القضاة بالأحذية يطل علينا بعض السفهاء في وسائل الاعلام مطالبين بالحرية للمزور<br />قاعة المحكمة امتلأت بآلاف المعجبين- جاتهم ستيم نيلة - جاؤوا ليساندوا الأخ تامر وعند صدور الحكم بالحبس لمدة سنة امتلأت القاعة بالصراخ والعويل<br />تقولش القدس اتهد<br />بس الحمد لله يكمل القاضي كلامه معلنا مع وقف التنفيذ<br />فترتج القاعة بالزغاريد الحمد لله وهي الحياة تسوى إيه من غير تامر<br />يتحرق الفلسطينين ويولع القضاة وفي ستين دهية الحريات كل دول في منهم كتير إنما هو تامر واحد بس<br />آآآآآآآه يابلد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153154/http://www.20at.com/article2.php?sid=812"

[[comments]]
order = 2
subject = "صح يا تامر..و لا ايه يا مش شغللك"
author = "نيفين"
posted = "2006-05-16"
text = "و الله يا جماعه و بما انى بثق ف عشرينات اعتقد ان دى اول مره اقرا عن تامر خبر كويس و يعجبنى من سلعه موضوع سجنه دا<br />اللى يقوللك دا عمرو دياب هو اللى وز عليه ال يعنى عمرومحتاج يعمل كدا<br />و الى يقوللك الضباط ف السجن بيقولوله على سبيل الاهانه قوم اقف و انت بتكلمنى<br />و حاجات من دى كتير<br />طبعا الكلام دا كويس لان كلنا بنغلط و طالما تامر معترف بغلطته يبقى خلاص<br />و كلمه لتامرالالبوم تحفه<br />يا مش شغللك انا لسه مش فاهمه حاجه<br />يعنى اضيف المذكور و لا لا<br />عموما انا هدخل الموضوع اللى قلتيلى عليه<br />بس يا رب متكونيش بتبعتينى<br />سلام يختى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153154/http://www.20at.com/article2.php?sid=812"

