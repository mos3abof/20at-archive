[[comments]]
order = 6
subject = "إنسان عقله جاهل"
author = "محمد المعز"
posted = "2006-05-16"
text = "هذا الشخص لا يعتبر فنان علي الإطلاق وهو دخيل علي الفن والطرب...وأخذ حيزا لا يستحقه بتاتا..جاء في غفلة من الزمن وإدعي بأنه فنان؟؟؟؟؟<br />وإنسان مزور ولا يمت إالي وطنه بصلة البته بدليل أنه لم يؤدي خدمة وطنه العسكريه التي يؤديها كل شاب بكل رضا ..<br />أنا لا أدري هل ظن أنه بصوته الحماري فوق الوطن؟؟إنه يستحق سحب جنسيته المصريه لأنه لا يحترم تراب مصر.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153154/http://www.20at.com/article2.php?sid=812"

[[comments]]
order = 7
subject = "فيين المحترميين"
author = "مهاجر بحب مصر"
posted = "2006-05-16"
text = "بلدنا فيها ناس محترميين بعييد عن الشهرة والسلطة والنفوذ بس واللة محترميين يستهلوا بوس الايدى على خدمة الوطن / دخولهم محدودة واسرهم بسيطة واولادهم وبناتهم متربيين وعارفيين ربنا/ مش لازم يكونوا مسلميين ولا مسحيين كلهم اخوات على ارض مصر بيحبوا مصر/ اكيد احنا فى عصر غلط والعقول بتفكر غلط / الصالح منبوذ والمفسد محبوب/ اية الى بيحصل محتاجيين نقعد بينا وبيين نفسنا ونتأمل احولنا/ اية راضيين عنها؟؟!! / راضيين عن نفسنا؟؟/ بنحاول نكون متقدميين زى الغرب/ واللة احنا احسن /بكتير قوى لو اتمسكنا بعاداتنا وتقالدنا/ عايش فى اميريكا من فترة كبيرة وعارف كل سر التقاليع الى اولادنا بيقلدوها على غير علم وواللة لو علموا اصل هذة التقاليع لما ابتعوها من الاصل/"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153154/http://www.20at.com/article2.php?sid=812"

[[comments]]
order = 8
subject = "فكر ورد احكم بنفسك"
author = "مهاجر بحب مصر"
posted = "2006-05-16"
text = "تامر حسنى مطرب مشهور تهرب من الخدمة العسكرية/محمد المصرى الاخ الاكبرغير متعلم يعول اسرة من 5 افراد والدة لايستطيع العمل امة امراءة مسكينة غير متعلمة تعمل فى الارض لجمع الدودة لتلبية احتياجات اسرتها اليومية اختة الصغرى معوقة زهنياو اخية الاصغر فى الابتدائى ومازال محمد يخدم فى الامن المركزى وفى اجازتة القصيرة يعمل لمساعدة امة واسرتة.....................................................!!!!<br />ميين فيهم الى المفروض يهرب من الجيش ؟؟ ميين فيهم الى عندة سبب اقوى لعدم خدمة الوطن ؟؟ ميين الى يتحاسب على التهرب وميين الى نتهاون فى محاسبتةعلى التفصير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153154/http://www.20at.com/article2.php?sid=812"

