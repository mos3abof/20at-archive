subject = "لا تعليق!!"
author = "Keo"
posted = "2006-05-17"
text = "بجد أنا مش لاقى حاجة أقولها على اللى بيحصل!!<br />أنا مش فاهم أيه تامر؟؟ ولا حتى أيه عمرو دياب نفسه اللى شاغلين دماغنا بيهم؟؟!! واحد زور وإتحبس ومتحكمش عليه كمان الحكم اللى يستحقه وشوية بنات وشباب مش لاقيين اللى يبربيهم دايريين وراه ويفط وتشيرتات وكلام فاضى !! أنا عايز أعرف حاجة لو عالم (لو فى أصلا فى بلدنا علماء) كان حصله موقف مشابه -مش هاقول هرب من الجيش - لكن أى تهمة وإتحبس كان حد هايعلقلوا فنلة حملات يقولوا وحشتنا؟؟!!<br />أنا مش عارف بصراحة إحنا (بنحلم) نتقدم إزاى وإحنا عقليتنا بالطريقة دى؟؟!!<br />بس الحاجة الوحيدة اللى عجبتنى فى المحاكمة وكيل النيابة.. قال كلمتين تامر فعلا يستحقهم..<br />وياريت مافكرش إننا نحلم يبقى حالنا أحسن من كدة لأننا مانستحقوش.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153154/http://www.20at.com/article2.php?sid=812"

