subject = "كل سنه وانت طيب يا تامر"
author = "هند a"
posted = "2006-09-27"
text = "كل سنه وانت طيب ياجميل ربنا يغفرك ويغفرلنا كل واحد منا لازم بيتحط في ازمه ومحنه لان ربنا بيمتحنا ويشوفنا في الامتحان ده بس برضه اتقرب اكتر واكتر وياريت تمتعنا باغاني دينيه لان صوتك ده هبة من ربنا مش تستغلها في حاجه واحده وربنا يوفقك"
archived = "2006-11-02"
