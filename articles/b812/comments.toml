[[comments]]
order = 13
subject = "واحد"
author = "اكتر حاجه مضيقاني في الموضوع ده الحمار اللي اسمه محمود سعد-- والمخدر اللي اسمه نصر محروس--- الاتنين قعدوا يدفعوا عن الواد المزور تامر وكانه عمل عمل وطني ----- يا سلام لو حد من الشباب الغلابه كان عمل العمله بتاع تامر دي كان زمانه دلوقتي واخد له خمس ست سنين سجن"
posted = "2006-05-16"
text = "--- انا بس عايز اقول للشباب اللي بيعلقوا علي البنات اللي كانوا في المحكمه بتاع الواد تامر انهم شوية شراميط من بتوع الفيديو كليب جايبهم نصر محروس فعيب لما نقول عليهم بنات مصريات<br />--واما حكاية الخبر بتاع الست اللي طلبت الخلع من زوجها ده نشر في جريدة الشرق الاوسط المملوكه لال سعود اساتذة الدعاره والعري في امتنا وهي جريدة قذره لا ياخد منها اخبار واللي شاغلين فيها اوسخ من نصر محروس المخدر<br />وبالمناسبه الحمار نصر محروس كان نص مخدر لما طلع مع السقعان المخنث محمود سعد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153154/http://www.20at.com/article2.php?sid=812"

[[comments]]
order = 14
subject = "تفاهة"
author = "مريم"
posted = "2006-05-16"
text = "والله الواحد بيتحسر لما يسمع ان شباب زي الفل يروحوا يجروا ورا واحد اقل حاجة تتقال عنه انه مزور، ويقفوا في المحكمة بتيشرتات مكتوب عليها بنحب تامر حسني، ولا واحد اهبل يعلق يافطة علي كوبري اكتوبر\" وحشتنا\"<br />بالذمة دي مش تبقي تفاهة، ناس فاضية ومعندهاش اي حاجة تفكر فيها.<br />وبعدين يطلع علينا الاخ تامر حسني يقول انه بيأم الناس في السجن اعتقد انها حاجة تفطس من الضحك<br />ربنا يهدينا جميعا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153154/http://www.20at.com/article2.php?sid=812"

