text = "للاسف الشديد بنسمي نفسنا مسلمين نسينا الشهداء قي فلسطين وفي العراق والشيشان وافغانستان وفي كل بلاد المسلمين وبقينا نتكلم عن تامر حسني وغيره 0 مين هو تامر حسني عشان نعطيه الاهمية دي كلها الاقصى محتل واليهود كل يوم بيدنسوا فيه وكلها كام يوم وهيقع واحنا بنتكلم في السفاهات وبس ولا الاقصى للفلسطينية بس ولا نسيتو انه حق على كل مسلم ومسلمة ان يدافع عنه ولو بالدعاء كل يوم اطفال رضع بيموتو ومحدش من العرب حتى بيدين ولا يستنكر الاعمال دي لكن لما سمعنا اسي تامر انسجن الدنيا كلها قامت ومقعدتش والحامين كلهم اتبرعوا للدفاع عنه ومشاكل ووجع راس على ايهدا لو واحد مجاهد في غوانتنمو كانوا قالوا عليه ارهابي عشان بيحارب اعداء الله وانا بقولها كلمة واحدة ( عمره ديل الكلب ما ينعدل) وبس وكل اللي مش عاجبوا كلامي يراسلني على الاميل aljehad_605@hotmail.com"
