text = "كبيرة صغيرة .. طخينة رفيعة .. طويلة قصيرة .. حلوة أو وحشة .. سمرا و لا بيضا .. كل ده مش مهم مهما كان شكلك مهما كانت طباعك و صفاتك .. فيه حاجة فيكى مشتركة معانا كلنا .. و هو إحساسك بالحب و إحتياجك له لإنه يمتلك و يملأ عليكى كل حياتك .. و يحاوطك فى كل مكان .. هو ده الحاجة الوحيدة اللى مستحيل تزهقى منها مهما طاردتك .. إحساس جميل بيحسسك براحة غير عادية .. دنيا تانية ما حدش بيتمنى فيها حرية .. بالعكس سجن الحب بيكون أحلى بكتير من حرية الشرود فى لا شىء .. إحساس غريب بأن كل الناس حواليكى مجرد كائنات وهمية .. شخص واحد بس هو اللى حقيقى .. هو كل الحياة و كل الكائنات و كل الدنيا .. كلمة واحدة بس هى مفتاح الأمان و سر الإبتسامة الدائمة على ملامح الوجه كلها .. دنيا الخوف من المجهول تتلاشى أمام لحظة صفا و صدق و حنان .. حرية بلا حدود داخل إطار وردى شوكه لا يؤلم و إنما يذكر دائما بأن لحظة فى هذا الإطار تساوى أيام العمر كلها .. نظرات هادئة تحتوى بداخلها الحنان و كأنه عملاق قوى يلتهم كل مشاعرك لتصبحى فريسة ضعيفة بإراتك لتنعمى بمواساة القطة الصغيرة من قبل ما تحبين .. ابتسامات و همهمات كلها بواعث للبهجة التى تغمر قلبك فالحياة ستصبح فيها حبيب هو كل شىء و المحافظة عليه تعنى المحافظة على الحياة .. أفكار تتدفق فى خاطرك فيقرأها هو من داخل أعماقك و يمليها عليكى فى اذنك .. فتسلمى له كل شىء و تؤمنى بقوته الخارقة فى خلق السعادة و غرسها إلى روحك.<br />أنتى مع من تحبين ملكة متوجة و أميرة عاشقة من السهل أن تتنازلى عن تاج عرشك و تناديه بسيدى فى مقابل أن ترى صورتك لامعة فى ضوء عينيه .. أحضان الأيادى ليس عليها قيود و لم تعد لأى كلمة وجود ، فالأصابع تتكلم بلا أصوات و أنتى تشعرى بكلامها و تردى عليها بضمها و تتمنى فقط أن ترسل أصابعك إحساسها فى أقل من ثوانى .. أوقات كثيرة كثيرة و أيام و ساعات تمر عليكى و كأنها لحظات .. فحبه يسرق منك الحياة و أنتى تهنئينه على سرقته للحياة .. بل و ربما تتمنى أن تنتهى الحياة لحظة فراقه لتعود من جديد عندما تلتقين به .. كلمات تردديها لأول مرة لا تعرفى لها لغة و لا منشأ فهى لغة القلب و منشئها الحب و أنتى تكررى كل يوم معانيها دون أن تخططى لذلك فيتقبلها و كأنه أعلم منك بلغة قلبك و يستكمل ما تنسينه فى حديثك لتفاجئى بأنه هو من أوجد بداخلك هذه الكلمات .. فتتأكدى وقتها بأن ما تشعرين به هو \"الحب الحقيقى\" و لكن للأسف سينتهى كل شىء بمجرد إنتهاء الحلم و إستيقاظك من النوم .. فلا تحاولى أن تبحثى عن هذا الحب فى الحقيقة فلن تجديه سوى فى الأحلام!<br />by bebeto0o0o0o0o0o0"
