[[comments]]
order = 1
subject = ""
author = "نهى سلامه"
posted = "2008-01-01"
text = "أول مرة قابلت مروه و هي بتنضم رسمي للفريق …قالت لي منار اختها …خلي بالك يا نهى : مروه لو مالقتش حاجه تعملها …بتقفش …قلت لها بس كده ؟؟؟ هيه غالبا هتقفش من الشغل …<br />ربنا يكرمك يا مروه ..كنتي نعم العون لنا ف الفريق …و أعتقد أننا عاملين شغل كويس أوي مع بعض …ربنا يديمها نعمه …<br />و ماتخفيش .الروقان إلي عندك دا هنظبطه …و نستفيد من ايجابياته مفيش مانع …<br />المهم كنت عايزه أسألك سؤال : هوه أنتي ساعتها كويتي هدومك و لا نزلتي من غير ما تكويها ؟؟؟؟؟"
archived = "2009-12-05"
capture_url = "https://web.archive.org/web/20091205063753/http://www.20at.com:80/masr/hot-topics/7925.html"

[[comments]]
order = 2
subject = ""
author = "دودو ام ننوشة"
posted = "2008-01-01"
text = "لابجد انا بقى اقول لكم سر عن مروة وهو سر المعذرة يعني زمان كنت لو اي حد مضايقك ومش عارف تاخد حقك منه روح اقف جنب مروة شوية وهي تعتذر لك بالنيابة عنه ههههههههههه طبعا ده من باب زيادة الادب الجامد انا كنت اتشال واتحط جنبها وهي تفضل مكملة برضه بس دلوقتي ما شاء الله بقت تحط صباعها في عين التخين وكل من جراء جلوسها بين العشريناتيه الجامدين<br />مراويتو كما اناديها هي نفسها الاستاذة مروة بتاعة فريق بداية"
archived = "2009-12-05"
capture_url = "https://web.archive.org/web/20091205063753/http://www.20at.com:80/masr/hot-topics/7925.html"

[[comments]]
order = 3
subject = ""
author = "اكتب اسمك هنا"
posted = "2008-01-01"
text = "انا يا جماعة عايزة اشتكلكوا من مروة كل ما اعمل شاى بلبن تيجي و تبقى عايزة تسقى فيه بسكوته لدرجة انها مرة جاتلى بحتة جبنة رومي و عايزه تسقيها يا رب فى 2008 تنسى كوباية الشاي بتاعتي روزا"
archived = "2009-12-05"
capture_url = "https://web.archive.org/web/20091205063753/http://www.20at.com:80/masr/hot-topics/7925.html"

[[comments]]
order = 4
subject = ""
author = "محمد فاروق"
posted = "2008-01-01"
text = "والله أنا تهت.. مين بقى منار ووليد وولاء ومدحت وعمر ونهى.. وإية علاقتهم باللي احنا فيه؟<br />فكرتيني بعادل امام في مشرحية شاهد ما شفش حاجة.. لما كان بيحكي عن عيلة عجوة، ورد القاضي \"ودول إية علاقتهم بالقضية\"؟<br />على العموم مروة يا جماعة لازم أسلم عليها يوميا سلام \"خاص\" لأن فيه بينا معَزة جامدة جدا .. أما بقاي النهار ففيه شوية غلاسات كتيرة، وطبعا لازم أقول انها كتير بتقعدني بعد معادي علشان أدسكلها مواضيعها اللي لازم تخلص متأخرة."
archived = "2009-12-05"
capture_url = "https://web.archive.org/web/20091205063753/http://www.20at.com:80/masr/hot-topics/7925.html"

