[[comments]]
order = 1
subject = "sawaaaa7"
author = "sawaaa7"
posted = "2006-04-12"
text = "ورد الأستاذ عبد المنعم أبو الفتوح عضو مكتب الإرشاد في حلقة من برنامج العاشرة مساء أمس الثلاثاء على ما نشرته الجريدة قائلا: إن المرشد لا يتذكر الكلام الذي نشر في الجريدة، وإذا كان قد قال هذا الكلام فبالتأكيد قد قيل تحت ضغط نفسي واستفزازي من الصحفي وفي سياق مغاير لما نشر فيه في الجريدة فليس هناك داعي إلى الشتم أو التلفظ بمثل هذه الألفاظ دون داع أو سبب.<br />3eeeb ya Dr. Dantah Ragel mo7taram.<br />Mostly, he said it under pressure, we can all say such words under pressure, zay balad bent,.. we el kalam dah<br />we homa 2estadoloh fel mayah el 3ekrah<br />bas el sa7, e3tezar we ne2ool dah 7asal emtah we leh we 2ezay.<br />We bardooh ya ret lama el nas te3agez te2alel men 2a7adetheha el so7afeyah.<br />belzat elly fo2 el sab3een. el 2esbo3een dol wa7ed fehom eshtaghal baltagy, wel tany 2al toz weltalet shatam fel bet wala2 beta3et el 3era2"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212436/http://masr.20at.com:80/article.php?sid=149&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "طوز في مصر وابو مصر واللي في مصر لو قورنت مصر بالإسلام"
author = "محمد الشاذلي (المفروس)"
posted = "2006-04-12"
text = "لما قال المرشد هذا الكلام استغربت وقولت كيف لمرشد الاخوان ان يقول مثل هذا الكلام على مصر ولكن عندما شاهدت برنامج العاشرة مساء امس وسمعت هذا الصحفي (العلماني) عندما قال ان الاترك ((احتلوا)) مصر وعرفت سبب قول المرشد على مصر (طوز) وهو إن<br />البيه بيقول للمرشد هل يمكن أن يحكم مصر ماليزي مسلم قال له المرشد نعم ولم لا ؟؟؟<br />والبيه لم يعجبه وقال أنا ميحكمنيش غير مصري !!!<br />ايوه يحكمنا مسلم ماليزي ولا حتى عراقي ويحكم بشرع الله وبعدله<br />بدل مايحكمنا واحد مصري ((بيحج)) كل سنه في امريكا (على كلامه)<br />ولما الاتراك بقوا احتلوا مصر يبقى كمان صلاح الدين الايوبي (اللي مكانشي عربي اصلا ً) احتلها وسيدنا عمرو بن العاص كمان احتلها ماهو أي مسلم يحكم مصر يبقى محتل<br />واخيرا ً طوز في مصر وابو مصر واللي في مصر لو قورنت مصر بالإسلام"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212436/http://masr.20at.com:80/article.php?sid=149&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "اهلا بعالم طظ"
author = "معاذ"
posted = "2006-04-20"
text = "السلام عليكم<br />مما لا شك فيه ان تضخيم وتهويل هذا الموضوع هو احد وسائل اسقاط الاخوان التي يمارسها النظام الحاكم منذ انتخابات البرلمان . ولكن لنا وقفة هل بالفعل عاكف قد صدر منه هذا الكلام ؟؟ دعونا لا نسبق الاحداث ولكن عاكف بالذات يبدوا من الشخصيات غير السياسية بالمرة وهناك على حد علمي اعتراض من كبار الشخصيات الاخوانية على حواراته الصحفية . ما استطيع تفهمه هو الهجوم على عاكف ان كان قال هذا الكلام لان الامر يستحق ولا اعذر اي من المدافعين عنه ولكن ما لا استطيع تفهمه لماذا الهجوم على الاخوان ومبادؤهم من كلمة قالها احدهم حتى لو كان المرشد . اخيرا لا اعرف لماذا يهاجم الجميع الصحفيون ويتركون المخطا وان كان المرشد قد قال هذا الكلام فانا اطالب مثقفوا الاخوان بوقفه مع مرشدهم لان مصر وشعبها اغلى بكثير من اي شخص مهما كان ."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212436/http://masr.20at.com:80/article.php?sid=149&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "بكل ادب"
author = "ابو الحسن"
posted = "2006-04-20"
text = "الذي يريد ان يعرف الحقيقة يراجع كلام الصحفي المعتوه صاحب الفبركة الصحقية انه من فرط حقده علي الاخوان يقول : (انهم يريدون أن يربوا شعب مصر )يقولها بأسلوب البلطجي المحترف ولا يعرف المسكين ان اسم الوزارة التي منحته شهادة الابتدائية التي يتفاخر بها ( وزارة التربية والتعليم ) وان اي حكومة لابد ان يكون لها تصور عام في توجيه أو تثقيف أو تربية الشعب سمها بأي مسمى شئت ولكن هذا ليس بمستغرب على شخص تعيس مثل هذاالصحفي وهو يجد ان سيده وسيد سيده هو استاذ ورئيس قسم البلطجة اللغوية العصبية والحاصل علي الدكتوراه في التفافة والدكتوراه الفخرية في الكذب والاحتيال والتفاهة والغباء والهبل !! عرفتوه يا حبايبي يا شيوعين وعلمانين يا جزم !!!!!!!!!!!!!!!!!!!!!"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212436/http://masr.20at.com:80/article.php?sid=149&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "100 الف طز"
author = "محمد"
posted = "2006-04-20"
text = "أنامصري ( للاسف ) اقول :<br />100 الف طز في بلد لاتحترم انسانية مواطنيها<br />100 الف طز في بلد تلغى فيه كل القواتين ويعمل فيه بقانون واحد هو قانون الطوارئ<br />100 الف طز في بلد يحكمها مثل هذا الرجل ومثل هذه الحكومة ومثل هذا الحزب<br />100 الف طز في بلد تاتي في المرتبة 156 في معدل التنمية الاقتصادية علي مستوي العالم<br />100 الف طز في اصبح الفساد سمة من سماتها والبلطجة والتسيب رمز من رموزها<br />100 الف طز في بلد الفوضى هي عنوانها<br />100 الف طز في بلد لايحاسب فيه الا الفقراء والضعفاء<br />100 الف طز في بلد لايحكم بشريعة الله<br />100 الف طز في شعب يعيش في ظل هذا الذل والهوان<br />100 الف تحية للاستاذ عاكف واخوانه رمز الرف الوحيد في هذا الوطن المسكين<br />100 الف سؤال كيف أكون عضوا صغيرا في جماعة الاخوان المسلمين"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212436/http://masr.20at.com:80/article.php?sid=149&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 6
subject = "هذا هو الأدب الأخواني"
author = "د.فارس الخياط"
posted = "2006-04-24"
text = "اذا كان المرشدقال كده قبل ما يمسكوا الحكم فماذا لو حدث وأن مسكوا الحكم أنا متأكد أنهم هيكونوا أفظع من الحزب الوطني. وبعدين مش طظ في مصر وأهلها ألف ألف طظ في اللي يستهينوا بها أو بأصغر طفل فيها. شكرا"
archived = "2006-05-24"
