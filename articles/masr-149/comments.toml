subject = "نفسي"
author = "عبدالله مفتاح"
posted = "2006-04-12"
text = "ان المرشد يكون قال الكلام ده هذا شئ وارد وبذلك يكون اخطأ<br />اما اللي نفسي فيه ان الصحفي يكون مسطول ويكون ناسي ولا غلطان ولا الحوار يكون مش حقيقي<br />ساعتها هكون سعيد جدا برد فعل عبدالله كمال<br />الله يهديه"
archived = "2006-05-24"
