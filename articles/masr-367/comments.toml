text = "الموضوع فكرته حلوه بجد، و ناقش أفكار بالفعل كنت أشغل بالي بها في الفترة السابقة، و هي اختلاف البيئة المصرية عن البيئات الأخري، و هذا الزخام الخانق الذي يهدم الشعور بالخصوصية و يولد أمراض اجتماعية خطيرة.<br />لغة المقال متكلفة بعض الشيء، لكن أحسنت"
