subject = "يا له من عظيم !"
text = "سعدت جدا بقراءة هذا المقال عن الفاتح العظيم عطية .. واستأت أيضا من كلامك عنه .. ألا تدرك ما الذي فعله هذا العظيم يا رجل؟ .. لقد فاز في ستار أكاديمي .. على مستوى العالم العربي كله .. لقد رفع اسم مصر عاليًا .. فماذا فعلت أنت ؟<br />أعتقد أنك حاقد عليه لأنه يملك الوسامة الرائعة ، والصوت الأسطوري ، والقبول الكبير .. لذلك أقول لك لا تحقد على أصحاب المواهب .. هم أصالة الماضي .. وقوة الحاضر .. هم مستقبل الأمة .."
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417202630/http://www.20at.com:80/article.php?sid=91"

[[comments]]
order = 8
subject = "الشمحطجى- مصر المحروسة- shamahtagi@hotmail.com"
text = "ايه ياعم انت هاتقلبها مناحه الناس اه زى الفل و مبسوطة على الآخر و مقضينها رقص و مغنى<br />انتم مزعلين روحكم ليه<br />و بالنسبة للأخ الفاضل محمد عطيه دى حاجة تفرحنا فى ظل الحالة الضنك الّى احنا عايشنها و اهو نصر والسلام و الجعان يحلم بسوق العيش و سيب نفسك خالص<br />و احنا فى ديك الساعة لما ابن من ابناء مصر البرره يبقى بارز كده و من براز الناس و يبقى ابرز شاب مصرى فى الفترة الى فاتت<br />يا جماعة بطلو حقد و خلو الناس يكلو عيش و بطلو اثارة البلبة<br />و صباحو قر يا سيدى و اهلاً بأى رأى جرئ على الميل بتاعى ده<br />shamahtagi@hotmail.com"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417202630/http://www.20at.com:80/article.php?sid=91"

