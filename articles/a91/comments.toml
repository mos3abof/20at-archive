subject = "هنعمل ايه"
text = "انت عارف ساعات بحس ان من الابتلاء ان ربنا سبحانه وتعالى قدر بلطفه أن نخلق في هذا العالم النكد... تخيل زملاء محمد عطية افندي في كلية الإعلام العيال المطحونة مذاكرة التعبانين في حياتها .. اللي طفحت أهاليها الكوتة عشان يبقوا في كلية إعلام ييجي الأخ محمد وتعمل له الدكتورة ماجي الحلواني استقبال رسمي في الكلية على فكرة ما هي أم الحبوب حازم إمام ..العيال الغلابة اللي كان محمد منهم ممكن يحصل لهم ايه لما يشوفوه ..."
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417202630/http://www.20at.com:80/article.php?sid=91"

