subject = "الاخ هشام غلطان (ميزو)"
text = "اسمحلى يا عم هشام اقلك انتا غلطان<br />مكنتش انتظر منك كدة<br />على الرغم من انك مشغول جدا وانا اعرف الا انك كنت بتشوف استار اكاديمى<br />واوعا تقول ان السبب هوا ان مفيش كلوباترا فى السوق<br />(متعلقش اخطاءك على الغير) هوا دا عيبنايا مصريين<br />نصيحة- اوعا تلجأ للسوبر عندك بدايل كتير<br />(بن..-وحش...) لكن كلة الاالسوبر (وربنا يوفقنا)"
archived = "2004-04-17"
capture_url = "https://web.archive.org/web/20040417202630/http://www.20at.com:80/article.php?sid=91"

