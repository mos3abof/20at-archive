subject = "الي"
author = "ربيع"
posted = "2006-05-03"
text = "مين ام طارق<br />ده سؤال بس السؤال الاهم<br />تقصدوا مين بتلامذه العم سام<br />وضح افصح أبن"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908172055/http://masr.20at.com:80/article.php?sid=251&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

