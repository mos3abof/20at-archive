[[comments]]
order = 1
subject = "تلامذة العم سام"
author = "مصرية"
posted = "2006-05-03"
text = "اشك فى ان عملية ذهب من صنع تلامذة العم سام حتى تكون ذريعة لتمديد قانون الطوارىء وبالمرة يخلصوا من كام واحد من السبعين مليون ويحبسوا كام الف من الاخوان وطلبة الجامعات وكل اللى نفسهم فيه يعملوه بدعوى مكافحة الارهاب اذا كان التطاول على القانون واحالة القضاة الشرقاء الذين رفضوا السكوت على مهزلة الانتخابات لعدم الصلاحية يبقى مش بعيد ان الشعب المصرى كلة الان فى حلة عدم صلاحية ولهم حق يعملوااكتر من كدة يمهل ولايهمل"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908172055/http://masr.20at.com:80/article.php?sid=251&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "سلامى لام طارق"
author = "مجدى اليمانى"
posted = "2006-05-03"
text = "يا ام طارق 00000 جددو قانون الطوارئ<br />جددوه له مش هما قالو هيلغوة 00يلغو ايه يا ام طارق 00من ساعه ما العدل فارق والعقل فارق واحنا ماشين بالطوارئ<br />يلا ماهى بلد خوارق والكل صاحى نايم سارق فى سارق 000يعنى جت على الطوارئ 000يا ام طارق اللى يسرق والل ينهب واللى يخطف بتحاموا فى الطوارئ 000مدام صاحبنا على العرش بارك وطول مهو الامر طارئ والدل فارق والعقل فارق 0000احنا لن نطاطى ولن نفارق"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908172055/http://masr.20at.com:80/article.php?sid=251&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
