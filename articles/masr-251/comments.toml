text = "اكيد انت بتهزر وفاهم كل حاجه ولا هو الدنيا ربيع والجوبديع ياعم ربيع اذا كنت فعلا مش فاهم يبفى قفل على كل المواضيع وخليك عايش فى طراوة الربيع ويااااابختك ياعم مش شايل للدنيا هم"
archived = "2006-09-08"
