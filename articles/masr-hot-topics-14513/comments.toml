text = "باقى انفلونزا الناموس وانفلونزا الذباب والصراصير - ما تريحونا وتقولوا كلمة واحدة تشملهم جميعا وهى الزكام<br />وكل زكام وانتم طيبون<br />وزورونا تجدوا ما يسركم<br />زكام بيعمل التهاب فى الجهاز التنفسى وكل واحد ومناعتة<br />طيب اية رايكم لو يطلع واحد عبقرى ويقول ياللة بينا ندبح كل المعيز<br />نعمل مذبحة للمعيز وكل واحد ياكل معزتة<br />وطبعا المعزة الكبيرة هتخاف"
