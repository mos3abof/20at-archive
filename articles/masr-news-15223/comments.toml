posted = "2010-02-07"
text = "فى الانجيل اية بتقول على لسان المسيح - سيظهر بعدى انبياء كذبة - وهم يعتبرون محمد من الانبياء الكذبة والقران من تاليف محمد<br />يعنى هم لا يعترفون بالاسلام ولا يعترفون بالاخر<br />يبقى ازاى ينادوا المسلمين بالتسامح وتقبل الاخر<br />ازاى طفل مسلم يلعب مع طفل قبطى ويقول لة ان النبى بتاعكم كذاب<br />انهم متعصبون جدا وجهلة وقذرة<br />ولو عاملهم المسلمون بنفس معاملتهم لما بقى منهم واحد على ارض مصر<br />يتكلمون عن المواطنة والتسامح وقبول الاخر وهم يكفرون اهلينا"
archived = "2010-02-09"
capture_url = "https://web.archive.org/web/20100209211117/http://www.20at.com:80/masr/news/15223-2010-02-06-03-26-33.html"
