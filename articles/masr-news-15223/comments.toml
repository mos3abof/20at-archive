author = "ابومحسن غربة 29 سنه"
posted = "2010-02-07"
text = "النبي محمد صلى الله عليه وسلم حتى نعلم من هو النبي محمد نفعل الاتي<br />نشتري كتاب عن حال الجزيرة العربية قبل البعثة المحمدية لنرى كيف كان يعيش العرب الهمجد<br />ونشتري كتاب عن بعثة النبي محمد صلى الله عليه وسلم والسيرة النبوية العطره ومدتها 23 سنه لنعرف كيف علم النبي محمد هؤلاء العرب الهمج المنهج الرباني حتى انتهت مهمته صلوات الله وصلامه عليه<br />نشتري كتاب عن حال المسلمين بعد انتهاء مهمة النبي وكيف خرج تلامذة النبي صلى الله عليه وسلم لفتح الشرق والغرب وخصوصا معركتي القادسية واليرموك اول الغيث<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />بعد ذلك يشرحون لنا كيف كذب عليهم النبي محم صلى الله عليه وسلم"
archived = "2010-02-09"
capture_url = "https://web.archive.org/web/20100209211117/http://www.20at.com:80/masr/news/15223-2010-02-06-03-26-33.html"

