subject = ""
author = "مش ححبك"
posted = "2010-02-06"
text = "عنوان الفتوى :<br />معنى قول الله في عيسى وأمه: كانا يأكلان الطعام<br />تاريخ الفتوى : 06 محرم 1429 / 15-01-2008<br />السؤال<br />هل يصح أن نقول في قول الله تعالى في عيسى وأمه كان يأكلان الطعام هو كناية على أنهم بعدها يذهبان إلى الغائط.<br />الفتوى<br />الحمد لله والصلاة والسلام على رسول الله وعلى آله وصحبه، أما بعـد:<br />فإن من مستلزمات بشرية الناس أنهم يأكلون الطعام ويهضمونه.<br />وقد ذكر القرطبي في تفسيره: أنه ذكر بعضهم في قوله كانا يأكلان الطعام أنه كناية عن الغائط والبول.<br />ولكنه ينبغي أن يعلم أن المقصود في الآية هو إثبات بشرية عيسى وأمه عليهما السلام وأنه مخلوق. ومن ولدته النساء، وكان يأكل الطعام يدل ذلك على أنه مخلوق محدث كسائر المخلوقات. وهذا يكفي في إثبات كون عيسى عليه الصلاة والسلام مخلوقا وليس بإله. ولا يحتاج إلى حمل الآية على أنها كناية عما ذكر.<br />والله أعلم."
archived = "2010-02-09"
capture_url = "https://web.archive.org/web/20100209211117/http://www.20at.com:80/masr/news/15223-2010-02-06-03-26-33.html"

