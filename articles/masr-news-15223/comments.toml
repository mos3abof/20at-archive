author = "امراض نفسية وهلاوس"
posted = "2010-02-06"
text = "الناس دى عايزة علاج نفسى مكثف - لانهم كلهم بيعانوا القلق والوسواس القهرى والتهيؤات الغير واقعية<br />لية يا خويا انت وهو العذراء لا تظهر فى كنيسة الفاتيكان عند اكبر راس مسيحى فى العالم<br />لماذا لا تظهر فى كنيسة البيت الابيض والا البنتاجون والا الميدان الاحمر فى موسكو<br />لماذا تحب العذراء ان تظهر فى كنائس موجودة فى وسط الزبالة ؟<br />فية هلاوس الناس دى عايشة فيها<br />اى شوية نور منعكس يبقى فج النور بظهور العذراء<br />العذراء روحها عند اللى خلقها وخلاص<br />سيدة من افضل نساء العالمين وماتت زى انسان بيموت<br />فية دكاترة نفسانيون اقباط كتير ممكن يعالجوا الحالة دى وفية حبوب فاليوم ومهدئات واذا لم تجدى<br />فية علاج ناجع للحالات دى<br />الناس دى لازم تاخد لبوس من تحت علشان يعرفوا يناموا وينخمدوا ويبطلوا تهيؤات"
archived = "2010-02-09"
capture_url = "https://web.archive.org/web/20100209211117/http://www.20at.com:80/masr/news/15223-2010-02-06-03-26-33.html"

