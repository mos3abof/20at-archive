text = "السياسى السويسرى وعضو حزب الشعب السويسرى ( دانييل ستريتش ) الذى كان يدعو الى اغلاق المساجد فى سويسرا وكان وراء حملة حظر اقامة ماذن المساجد فى سويسرا وجرى استفتاء بشأنها - هداة اللة الى الاسلام<br />نعم اسلم عدو المساجد والمأذن فى سويسرا<br />واثار اسلامة ضجة كبيرة فى سويسرا<br />وربنا يهدى شنودة واتباعة<br />الخبر منشور فى جريدة الوسط"
