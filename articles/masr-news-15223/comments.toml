author = "رد على قلة ادب"
posted = "2010-02-06"
text = "المعلق رقم 6 بتاع قلة ادب<br />انا قليت ادبي في ايه<br />انا قلت الحقيقة قلت ان النصارى بيحبوا اليهود مع ان اليهود بيقولوا ان الاله بتاعهم ابن زنا وام الاله زنت وجابت المسيح<br />انا قلت حاجه غلط<br />بوش وكلينتون وكل رؤساء امريكيا المسيحيين بيروحوا اسرائيل يبسوا طياز اليهود هناك<br />وبريطانيا احتلت فلسطين وسلمتها لليهود مع انه الارض التي اتولد عليها المسيح وعاش مع ستنا مريم هناك<br />يبقى انا قلت حاجه غلط<br />انا عايز اقول ان الكفر ملة واحدة والكفار حبايب<br />اللي بيقولوا ان المسيح ابن الاله واللي بيقولوا ان المسيح ابن زنا<br />حبايب لانهم كفره والكفر ملة واحدة<br />سلام يا صاحبي وارجو ان تكون فهمت الرسالة"
archived = "2010-02-09"
capture_url = "https://web.archive.org/web/20100209211117/http://www.20at.com:80/masr/news/15223-2010-02-06-03-26-33.html"

