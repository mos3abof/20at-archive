text = "وحيات والدك يا شيخه البابا شنوده عيان ورايح جاي على امريكا يتعالج<br />وحياة والد يا شيخه اظهريلوا هناك وملسي على طيزه يمكن يخف<br />_______________ _______________ _<br />استغفر الله العظيم<br />وذا الكلام ليس موجه لمريم القرانيه<br />ولكنه موجه لمريم التي تخيلها النصارا قبحهم الله"
