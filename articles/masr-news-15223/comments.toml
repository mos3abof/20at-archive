author = "سبب ظهور العدرا"
posted = "2010-02-06"
text = "سبب ظهور العدرا الى الشعب المسيحي انها عايزه تقولهم كلمتين<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــتتتتت<br />يا ولاد الكلب يا شوية صيع عيب عليكم تساعدو اليهود اللي قالوا على ابني المسيح انه ابن زنا وقالوا عليا ان انا زنيت وحملت في المسيح عيب عليكم يا شوية رمم<br />خليكوا محترمين مش اليهود دول برضه هما اللي صلبوا المسيح وانتو اللي بتقولوا كده ليه بتروحوا تساعدوهم يا شوية رمم<br />وقال ايه كمان الارض اللي انا عشت عليها انا وابني المسيح ارض فلسطين تروحوا تدوهالهم هدية<br />المسلمين انضف من ميتين ابوكم على الاقل بيحاربوا اليهود وعايزين يحرروا الارض اللي انا عشت عليها انا والمسيح وعندهم في القران بتاعهم سورة باسمي ياشوية جبنا ومن ضمن اسباب كراهيتهم لليهود انهم قالوا عليا كلام وحش حتى في القران بتاعهم مكتوب وقولهم على مريم بهتانا عظيما<br />وقال ايه عايزين المسيح يخلصهم من ذنوبهم<br />يا اخي دا اهدا روحوا ياشوية كلاب انا متبريا منهم انا وابني المسيح<br />روحوا الى جهنم هي مولاهم زي ما قال القران"
archived = "2010-02-09"
capture_url = "https://web.archive.org/web/20100209211117/http://www.20at.com:80/masr/news/15223-2010-02-06-03-26-33.html"

