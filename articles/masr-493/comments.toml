subject = "lمن ايام الكاميرا الخفيه"
author = "ام محمد"
posted = "2006-07-09"
text = "انا من زمان وانا متغاظه من هذا المدعو اسماعيل من ايام الكاميرا الخفيه اللى كان بيطلع فيها المعتوه ده لان متهيألى انه اول واحد والله اعلم دخل برنامج الكاميرا الخفيه الى مصر وهذا البرنامج لوحده كفايه انه بيحرق دمى بطريقه وبعدها قال اسماعيل بيشتغل ايه ربنا يوقف نموك"
archived = "2006-09-05"
