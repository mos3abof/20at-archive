subject = "الحمد لله"
author = "مفروسة برضه"
posted = "2006-07-16"
text = "الحمد لله الذى عافنا مما ابتلى به الأخرين<br />انا مش بشوف التليفزيون المصرى دا نهائى لكن مرة كده وانا عند اختى شفت موضوع اسماعيل اتفرست والله بس هنعمل ايه ما هى المنظومة كلها خربانة من إعلام وتعليم واسر بتتفرج على الكلام الفاضى وفى الاخر اطفلنا بيحصلهم غباء ليه بعد سن السادسة ما هو من الحاجات دى<br />ربنا يهديهم"
archived = "2006-09-05"
