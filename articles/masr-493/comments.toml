[[comments]]
order = 0
subject = "مش قادرة تصعبي عليا ... إيه اللي خلاك تروحي برجليكي ؟؟ تستاهلي"
author = "محمد السيد"
posted = "2006-06-10"
text = "والله تستاهلي ...<br />إيه اللي يخليكي تعدي علي حاجة زي دي ...<br />طبعا أنا مش عارف إنت بتتكلمي علي غيه ..لأني حارم نفسي من النعمة دي ...<br />الحمد لله ... حرمونا من القنوات المصرية ... وربنا يعينهم ويشيلوا الفضائية والأأولي كمان .. من علي النايل سات ...<br />لكن انسي ..... هم كبييييييييييير وانزاح<br />يارب تخلي لنا أنس باشا ويقفل كله علينا ويزيل نعمتهم دي ...<br />أحمدك يارب ...<br />لا للتمديد ... لاللتوريث ... نعم لتعديل الدستور المصري<br />mohaemdat@hotmail.com"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613030204/http://masr.20at.com:80/article.php?sid=493"

