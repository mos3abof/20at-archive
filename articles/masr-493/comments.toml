text = "إيه يا جماعة هو محدش بيتفرج علي التليفزيون المصري خالص ولا إيه ؟<br />مش معقولة يعني ؟؟؟دي مصر يا جماعة ....<br />مصر ...<br />مصر ...<br />واضح إنك حتضظري تبطلي كمان ...<br />وبرضه<br />لا للتمديد ... لاللتوريث ... نعم لتعديل الدستور المصري<br />mohaemdat@hotmail.com"
