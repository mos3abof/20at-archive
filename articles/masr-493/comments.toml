[[comments]]
order = 2
subject = "انس مش حيمشي"
author = "mezo"
posted = "2006-06-14"
text = "بالعند فيكم !!.....أنس مش حيمشي يا وحشين ... يا حاقدين .....<br />أول امبارح يوم الاثنين يعني كنت قاعد أقلب في القنوات الفضائية بدور على المبارة بتاعة الظهر و الله منا فاكر كانت بين مين و مين ... المهم خير اللهم اجعل خير لقيت قناة على القمر الأوروبي طبعا ... من غير صوت و الصورة فيها كرسي صالون عقبال عندكم من النوع الفاخر جدا فاضي مش غريب علينا و المنظر وراه من النوع الحلوف ( Sory ) المألوف يعني شيافينه قبل كده ؟! .....و وراه سجاده على الحيطه بشبه عليها مكتوب عليها ( القطر المصري ) حد عرف التصوير يبقى فين ؟؟!!! أنا عرفت في مقر رئاسة الجمهورية على رأي الأخت هناء سمري ( موفدة قطاع الأخبار ) !!!! و بعد شويه جه شخص قعد على الكرسي هو مين !؟ ...... لأ غلط مش الحاج يا خويا دي الحاجه ( السيدة الفاضلة ) جات و قاعدت و ظهرت على الشاشة و معاها خمس ست رجاله و واحدة ست شيك برضه (على فكره مكانش في صوت ) ثم قامت الأخت الشيك بوضع أول ميكرفون للسيدة الفاضلة و قام واحد من الواقفين قفاه للكاميرا بتركيب الميكرفون الثاني للسيدة الفاضلة بصراحه أنا كنت بشبه عليه طلع مين ..!؟ أنوس و بعد كده عمل Check على الميكرفون الثاني و الصوت اشتغل أنوس قال للسيدة الفاضلة بعد تركيب Ear peace السماعة يعني : حضرتك حتبصي هنا الصوت واصل حضرتك سمعه الصوت و شويه كلام مسمعتوش ثم تحدثت الست الشيك طلعت أجنبية أيوة و الله و بعدين بدء التصوير واحد سئل السدة الفاضلة عن حاجة كده بالانجليزي و لا أهو إيه و ردت عليه ماشاءالله عليها و بعدين قالت لأنوس أنا مش سامعه حاجه هو اسمه ايه الراجل ده مالوش اسم طيب مالوش اسم .. ( ظريفة و مرحة ) واخده م الحاج أبو علاء برضه ! و جه السد الأستاذ أنوس و قالها هو حيسألك ( حضرتك زي ما قال )نفس Qu<br />اقرأ بقية التعليق .."
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616152949/http://masr.20at.com:80/article.php?sid=493"

[[comments]]
order = 3
subject = "نحو الهاويه"
author = "محمود رفاعى"
posted = "2006-06-14"
text = "انا معاكى فى نقطه هامه جدا<br />ان محدش بيكسب اى حاجه وبيطلعوا واحد كدة لابس قميص كروهات وبنطلون قماش تفصيل قديم بكوسر وعندة كرش<br />وشكله ياعينى كفران وطلعان عين اهله ماسك رزمه فلوس عمال يهوى بيها ويهزها علشان يحنسنا<br />وأهم حاجه لازم يكون شكله غلبان علشان المصداقيه بس<br />بس لامؤاخذة يعنى ؟ هوة مين إسماعيل دة؟<br />أصلى مش متابع تليفزيون مصرى مبطله من زمان"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616152949/http://masr.20at.com:80/article.php?sid=493"

