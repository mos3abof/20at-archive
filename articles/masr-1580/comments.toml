[[comments]]
order = 0
subject = "لسنا اخوان ولكنا مسلمين"
author = "الاخوان المسلمين اكبر قوة معارضة فى مصر"
posted = "2007-02-12"
text = "وليس فيهم الحرامى ولا النصاب ولا الغبى بالوراثة<br />ويحظون بشعبية واسعة لنظافة ايديهم<br />ومهما فعل النظام الذى استعدى الشعب كلة بسياستة التفقيرية والتجويعية فلن يضعف تلك الجماعة<br />والوضع الشعبى الان اشبة بالوضع قبيل الثورة الكل معبأ ضد الملك<br />ومالم تحدث معجزة من السماء تمنع تدفق الدم فان الخراب ات لا محالة"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073011/http://masr.20at.com:80/article.php?sid=1580"

[[comments]]
order = 1
subject = "المركب واحده والغرق للجميع"
author = "إبن بهيه"
posted = "2007-02-12"
text = "منذ زمن بعيد لي رأي مخالف لكثير ممن حولي برغم بساطته ووضوحه كالشمس .. أرى أن تحرير مصر لن يأتي إلا بأيدي الإخوان المسلمين والاشتراكيين معا ، بس الاشتراكيين بجد مش كده وكده يعني .. يا ريت نراجع بس كل الأحداث الماضيه وراح نعرف .. بلاش كل الأحداث .. يا ريت نراجع انتفاضة الخبز التي أسماها نظام كرنب ديفيد انتفاضة الحرامية .. مين اللي كان فيها؟ إخوان واشتراكيين<br />وغيرها وغيرها من الأحداث التي مرت بها مصر .. اشتراكيين وإسلاميين .. طيب في لبنان مثلا الحالة إيه؟<br />نفس الشيء والله .. الإسلاميين تحت قيادة السيد حسن نصر الله ومعهم جميع الحركات اليسارية بلا استثناء ..<br />الحدوته واضحه .. خلونا نختلف فيما بيننا أيديولوجيا كما شئنا .. لكن نتحد لأجل هذا الوطن ..<br />بح صوتنا من الصراخ على الإخوان والاشتراكيين .. يا ناس يالا مع بعض نهب هبه واحده في وش الواطي وزوائده الدودية وعصاباته<br />يا ريت تكون دي بداية الفوقه للتيارين لأنهما وحدهما في هذا البلد يمكن أن يقدما التضحيات الجسام بشهادة التاريخ مش كلامي أنا والله<br />يبقى مستنيين إيه ؟<br />يا ريت يا أستاذ كمال خليل ورجالتك الجدعان تمدوا إيديكم للإخوان وتكونوا يدا واحده ضد الواطي مبارك وعصاباته<br />ويا ريت يا إخوان تراجعوا مواقفكم من الاشتراكيين والناصريين والشيوعيين وكل التيارات الوطنية بصدق وتكونوا يدا واحده في مواجهة الطاغية الجبان مبارك<br />المركب واحده والغرق للجميع<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073011/http://masr.20at.com:80/article.php?sid=1580"

[[comments]]
order = 2
subject = "من يكون"
author = "فهد الا سلام"
posted = "2007-02-13"
text = "ان كان الشعب بجميع طويفة مع الا خوان يسار ويمن وفوق وتحت هو حسنى مبارك ملهوش ملة ولا اية لا هو ثورى ولا وفدى ولا اخوانى ولا اى شى دة جة فى غفلة من الزمن الله يسامح السادات"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073011/http://masr.20at.com:80/article.php?sid=1580"

[[comments]]
order = 3
subject = "الى ابن بهية سباب وشتام حسني مبارك"
author = "واحد من الناس"
posted = "2007-02-13"
text = "من كلام ابن بهية<br />يا ريت يا أستاذ كمال خليل ورجالتك الجدعان تمدوا إيديكم للإخوان وتكونوا يدا واحده ضد الواطي مبارك وعصاباته<br />ويا ريت يا إخوان تراجعوا مواقفكم من الاشتراكيين والناصريين والشيوعيين وكل التيارات الوطنية بصدق وتكونوا يدا واحده في مواجهة الطاغية الجبان مبارك<br />طيب يا ابن بنية طالما انت بتكره حسني مبارك اوي كده متكل على الناس ليه<br />ورينا همتك واكشف عن شخصيتك زي ما غيرك عمل فيه ناس طلعوا رجاله ووقفوا ادام حسني مبارك وما خفوش من السجن معملوش زيك كده استخبوا زي النسوان الشراميط وسمو نفسهم اسماء مستعاره. يستحسن تسمي نفسك بنت بهية من ابن بهية<br />يا حيوان يا غبي حسني مبارك دا رمز لمصر<br />مهما عمل سواء رضيت ام لم ترضى.<br />اكشف عن شخصيتك يا مره"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073011/http://masr.20at.com:80/article.php?sid=1580"

[[comments]]
order = 4
subject = "ربنا يستر"
author = "سيف"
posted = "2007-02-13"
text = "مش عارف التصعيد ده من جهة النظام اخره ايه كلنا عرفين ان جماعه الاخوان سلميه وعمرها ماعملة عمليه ارهابيه اما حكاية غسيل الاموال دي فميصقهاش واحد عبيط حتي اللي النظام بيعمله دلؤت خطر اوي لان الضغط يولد الانفجار والناس دول مهما صبره حيجلهم وقت حيزهقوا وحيكون الصدام قوي اوي والكل حيكون خاسر"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073011/http://masr.20at.com:80/article.php?sid=1580"

[[comments]]
order = 5
subject = "عودة الخائن من جديد"
author = "ابن ناصر"
posted = "2007-02-13"
text = "عودة الخائن من جديد وما أكثر الخونه الأن في هذا الزمان في عصر الفساد, يؤسفني أقول أن أصبح يوجد خونه مثل من يدعي نفسه(واحد من الناس) ويجب أن تغير أسمك ويصبح واحد من الانهزامين المستضعفين أو الاسرائلين فهو اسم مناسب جدا لك فمن بعد ما قرائت لك مقاله تسب فيها رمز الكرامه في هذا الوطن عرفت أنك منالموالين للفاسد الكبير وسأقول لك شيئا واحدا لعن الله أمثالك وأحب أقول أن هذه الثقافه لن تدوم كثيرا,,أو معذره هذا الجهل لنيدوم كثيرا , ولا ترد علي أمثاله يا ابن بهيه فهو أحقر من ذلك بكثير...<br />http://ibnasser.blogspot.com"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073011/http://masr.20at.com:80/article.php?sid=1580"

[[comments]]
order = 6
subject = "بتفور و هتغرق الدنيا"
author = "مسلم صابر يستعد"
posted = "2007-02-13"
text = "الى السيد ( واحد من الناس ) نحن لا نعارض لمجرد المعارضة , نحن نقدم سلبيات و طغيان لقائد لا يتصدى للفاحشة و المنكر والنصب و المحسوبية و شراء المناصب بعقد تمليك و العلمانية و التجريد من الاخلاق ... اصبح المصريون مثل الذئاب بعد ان كانوا متحابون و موحديون حتى و لم يوجد هناك احتواء لهم , و غير ذلك الكثير من الاحباطات الهدامة , هذا منظورنا . فيجب عليك الا تشاركنا مرة ثانية لأنا لا نسب و لا نتقاود ولا نتدايس و لا نوالث و لا نقبل الايدى المدنسة لأنا مسلمون نخاف ااه رب العلمين ."
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073011/http://masr.20at.com:80/article.php?sid=1580"

