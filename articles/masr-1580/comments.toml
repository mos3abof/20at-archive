[[comments]]
order = 8
subject = "واحد من الناس"
author = "انا لا يمكن اكره حسني مبارك ابدا لانه رئيس بلدي واخذ الحكم بصورة شرعية يعني الرئيس اللي قبله عينه نائب رئيس جمهورية بصفته بطل من ابطال حرب اكتوبر ولا نسيتوا يا شعب حرب اكتوبر. ونسيتو يوم ما السادات عينه نائب رئيس جمهورية كلكم كنتو فرحانين اد ايه."
posted = "2007-02-14"
text = "وبعدين الاقباط والاوغاد هما اللي بيكرهوا حسني مبارك علشان راجل مسلم وبيدافع عن المادة التانية من الدستور التي تنص على ان الدين الرسمي للدولة الاسلام والشريعة الاسلامية هي مصدر التشريع.<br />انا لا يمكن حكون قبطي ابدا واكره حسني مبارك."
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073011/http://masr.20at.com:80/article.php?sid=1580"

[[comments]]
order = 9
subject = "تكملة اللي فوق"
author = "واظن كلامي واضح ومفهوم:"
posted = "2007-02-14"
text = "طيب يا ابن بنية طالما انت بتكره حسني مبارك اوي كده متكل على الناس ليه<br />ورينا همتك واكشف عن شخصيتك زي ما غيرك عمل فيه ناس طلعوا رجاله ووقفوا ادام حسني مبارك وما خفوش من السجن معملوش زيك كده استخبوا زي النسوان الشراميط وسمو نفسهم اسماء مستعاره. يستحسن تسمي نفسك بنت بهية مش ابن بهية<br />الراجل يقف كده ويفرد صدره ويقول انا راجل"
