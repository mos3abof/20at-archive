subject = "الى الاخ سخيف جداً"
author = "واحد مصرى"
posted = "2007-02-14"
text = "السلام عليكم اود ان اصحح معلومة صغيرة الى الاخ سخيف جداً هذه المعلومة هى ان الذى تقول عليه مقال هو فى حقيقة الامر خبر صحفى وليس مقال كما ذكرت وارجو ان تسمحلى ام اقول أنك شخص تافه والسلام ختام"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073011/http://masr.20at.com:80/article.php?sid=1580"
