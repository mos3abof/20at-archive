[[comments]]
order = 10
subject = "حاجه غريبه جدا !!!"
author = "ابن ناصر"
posted = "2007-02-14"
text = "انا عايز أعرف يا أخ أنت (الي \"واحد من الناس\" المزيف -معلهش يا علي) انت ايه الي مزعلك وعامل فيك كده أولا الاقباط ليسوا أوغاد وأنا لا اسمح لك بهذا فحسني مبارك يزج بالاقباط والمسلمين في السجون والمعتقلات والمسلمون قبل الاقباط كمان, فهو مكره لكل الشعب ماعدا الفئه المنافقه له سواء من المسلمين أو الاقباط ده شوف مبارك بيعمل ايه في الاخوان مثلا تقوللي الاقباط كارهينوا , احب اؤكد لك كلنا كارهينوا , وبالنسبه للنقطه الثانيه انت ايه اللي مدايقك انت عايز ابن بهيه يكشف عن نفسه يقوموا سجنينه ولا معتقلينوه -بعد الشر- في بلد لا فيها ديموقراطيه ولا حريه وأحب أقولك حاجه تنم عن جهلك الشديد الشجاعه يا أخ ليست معناها الوقوف امام المدفع او ان ترمي نفسك في التهلكه بل تكون بالحكمه والعقل فما الذي يستفاده لو كشف عن شخصيته واتسجن,, التي تتحدث عنها ليست شجاعه بل اسمها حماقه .. وأرجو منك ان تحدثت ثانيا أن تتحدث باسلوب محترم خالي من السباب والشتائم انه الرقي المفتقد لاتباع هذا الخائن الكبير رئيسك http://ibnasser.blogspot.com"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073011/http://masr.20at.com:80/article.php?sid=1580"

[[comments]]
order = 11
subject = "واحد من الخلق (بلاش الناس) علشان خاطر علي"
author = "يا اخي الكريم انا عايز اعرف ابن بهية دا من يوم ما فتح الموقع وهو عمال يشتم في حسني مبارك يصحا من النوم يجلس على الكمبيوتر ويفتح موقع ولاد البلد وهاتك يا سب وشتم في حسني مبارك."
posted = "2007-02-14"
text = "عايز اعرف ايه المغزى من كده<br />يعني فيه ناس شتمت مرة واحدة وخلاص<br />مرتين وخلاص<br />دا عقدني في حياتي كل ما افتح الموقع الاقي ابن بهية اقرأ كلامه الاقيه سب وشتم في حسني مبارك.<br />طيب يا سيدي هو عنده مدونة يكتب فيها اللي عايز يقوله ضد حسني مبارك مرة واحدة وخلاص.<br />يعني حسني مبارك وحش مثلا<br />اعد انا امسك سبحه واسبح واقول حسني مبارك واطي حسني مبارك واطي"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073011/http://masr.20at.com:80/article.php?sid=1580"

[[comments]]
order = 12
subject = "الى الاخ ابن ناصر"
author = "واحد من الخلق بلاش من الناس علشان خاطر علي"
posted = "2007-02-14"
text = "انا دخلت المدونة بتاعتك وهي رائعة<br />انت كده قلت رايك في حاجه تخصك<br />لكن ما تدخلش موقع عام مفتوح لكل الاراء وتسب وتشتم رئيس البلد من غير فايده<br />ولو سمحت يا اخي المعارضين لحسني مبارك لازم يحترموا راي المؤيدين لحسني مبارك<br />لاني لما ايدت حسني مبارك معايا الادلة على ذلك<br />ولو سمحت ما تقلش عليه خاين ولا اللي بيأيدوه خونه واحترم الراي الاخر"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073011/http://masr.20at.com:80/article.php?sid=1580"

[[comments]]
order = 13
subject = "مستفيد من تخريب البلد"
author = "الى واحد من الناس"
posted = "2007-02-14"
text = "اكيد انت واحد من الذين سرقوا اونهبوا او احد اقربائهم سرقوا فلوس الشعب<br />كل الذين استفادوا من حكم هذا الرجل هم الحرامية وتجار البانجوا واصحاب التوكيلات<br />وبتوع توكيلات استيراد السموم لقتل الشعب<br />نحن لم نستفيد ونحن الاغلبية المطلقة من حكم هذا الرجل فلماذا لا نشتمة<br />بل انة افقرنا<br />وجوعنا وداس كرامتنا<br />فاقل شىء ان نشتمة ونشتمك ونشتم كل الحرامية امثالكم"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215073011/http://masr.20at.com:80/article.php?sid=1580"

[[comments]]
