[[comments]]
order = 7
subject = "المصريين فى الغربة"
author = "طارق الجوهري"
posted = "2006-07-04"
text = "آه على المصريين فى الغربة أه يا مليون خسارة انا واعوذب الله من كلمة انا عايش حالياً فى السعودية - مدينة جده اعمل فى مؤسسة اسيت لخدمات التكنولوجيا والمعلومات اتعاملت كتيير مع جميع الجنسيات الغريب هنا ان ابن بلدك ما بيحبش الخير لأبن بلده بسقف ايد على ايد لما نكون مصريين وبنعمل كدا مع بعض يبقى عوضنا على الله ... طبعاً مش معنى كدا انى اقدر ثانيه واحده اقول كلمة وحشة فى حق بلدى مصر... اتمنى المصريين يتحسنوا مع بعض فى الغربة .."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705143031/http://masr.20at.com:80/article.php?sid=606"

