[[comments]]
order = 16
subject = "للمحترم طارق الجوهري"
author = "ميوزة"
posted = "2006-07-10"
text = "تقريبا كده حضرتك الي ناقص عقل<br />الرسول لما قال لنساء المدينة انهم ناقصات عقل ودين كان لاسباب ان النساء بعد الولادة بيحصلهم حالة من عدم التركيز وناقصات دين لانهم في ايام مش بيقدروا يقدوا الفروض لاسباب معروفة وده كان يوم عيد ومش معقول الرسول هيهين النساء او يوجهلهم اي اساء وكمان يوم العيد ولما قلهم كده كان لان مر علي جماعة من النساء مرحوش لصلاة العيد لاسباب قلنا عليها قبل كده وياريت تبقي تكمل العبارة<br />الرسول قال لم أري ناقصات عقل ودين يذهبن بالعقول مثلكن<br />يعني اي واحد من الي انت بتقول عليهم ناقصات عقل ودين دول ممكن يكلوا عقلك ويلعبوا بيك الكورة<br />واتقي كيد النساء لان كيدهن عظيم"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010858/http://masr.20at.com:80/article.php?sid=606"

