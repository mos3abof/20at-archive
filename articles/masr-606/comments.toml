[[comments]]
order = 9
subject = "طبعا المصرية بلامنازع"
author = "واحدة وخلاص ....بس مصرية جدا"
posted = "2006-07-04"
text = "أجمل ما فيها وأهم ما فيها انها وقت الشدة ((( راجل )))<br />- بتحب اسرتها بجد ومبتبخلش عليهم بأي شيء وبتعمل المستحيل علشان اسرتها.<br />- ولما زوجها بيضعف هي اللي بتسنده وتشد ازره لغاية ما يقوم تاني .<br />-ولما بيسافر بتحفظه في غيابه وبتكون هي الاب والام لأولاده.<br />-ولو مات او مرض بتنزل تشتغل مكانه ومبترميش عياله.<br />- قلبها حنين مش قاسية .<br />- لو اتقدمتلها وحست انك راجل حترضى بيك حتى لو كنت فقير.<br />- لا بتطلب وزنها ذهب ولا جمالها جمال مادي.<br />--- هييه حقول ايه ولا ايه---<br />- مين فينا ما شفش امه وهي شايلة هموم ما يقدر عليها جبل .<br />- مين فينا يقدر ينكر ان الست المصرية هي أساس البيت ومن غيرها البيت بيتهد وميبقاش له معالم.<br />---ملحوظة1- الصورة رائعة رائعة رائعة<br />\"هي دي المصرية اجمل ضحكة في اسوأ ظروف\"<br />---ملحوظة2- لو قابلت واحدة مش بالمواصفات دي يبقى اكيد عيلتها فيها عرق مختلط."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705143031/http://masr.20at.com:80/article.php?sid=606"

