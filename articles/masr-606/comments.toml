[[comments]]
order = 18
subject = "يارب ... ارزقني مصرية بجد ... زي اللي مدحها الرسول- ص-"
author = "محمد السيد"
posted = "2006-07-11"
text = "المصرية ....<br />حقيقي ... أجمل وأرق وأحلي وأخلص و أحن إنسانة ممكن تقابلها ....<br />أكثر إنسانة ممكن تتحمل وتشيل هموم كتير فعلا ...<br />طبعا لازم يكون في مشاكل وهموم وكده يعني ... لكن قارنوها بغيرها ....<br />المصرية حتلاقيها أحسن من أي حد في الدنيا ....<br />ربنا يخليها لي ...<br />وبرضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010858/http://masr.20at.com:80/article.php?sid=606"
