[[comments]]
order = 0
subject = "و المصرية (ملاك من الجنة) !!"
author = "عابر القارات"
posted = "2006-07-03"
text = "و لا تتزوج مصرية فقبل الزواج أنت تعشق ملاك و طفل برئ يحب الدباديب و الهدية التى فى ظاهرها هايفة و فى باطنها غالية تستهلك قروشك القليلة التى حوشتها على مدى الشهور و طبعا لا تنسى مظهرها المهندم و عطرها الفواح الذى يبقيك مغيب و تحت تأثير التنويم المغناطيسى حتى تحذبك مسلوب الارادة لتجد نفسك جالس فى صالون بيت و فى يدك علبة حلويات و فى اليد الاخرى علبة الشبكة التى أستدنت حتى تشتريها متوهما بالنعيم المقيم الذى حلمت به فى جميع احلامك سواء يقظة أو منام و هنا يدخل المأذون الى الصالون و انت لا زلت فى غيبوبتك لتصحو تانى يوم مفزوعا لتجد شخص (أقصد شخصه) نائما على السرير لتكتشف بعد معاناه ان التى بجانبك هذه الفتاة التى أحببتها يوما ما و حسبت ان ملاكا قد أقام على الارض بين الناس و طبعا معاناتك فى التعرف على الوجه الملائكى (سابقا) تأتى من زوال المساحيق و الميكأب (النصب سابقا) و حلول رائحة البصل و الكرفس محل برفان (هيوجو فور ويمن) و إنتفاخ الوجه مع باقى الجسم و ولى العود الفرنساوى الى غير رجعه و أستقر فى نصيبك العود الفيومى و أصبحت مثقلا بالاعباء فأنت مسئول مسئولية كاملة من الالف الى الياء عن كل شئ عن شيل العيال و شيل الاغراض من السوق و الوقوف فى طابور الخبز و صدق عليك القول (الزوج طالع شيال و نازل زبال) .... و كل ده و تقولى خد المصرية ... طيب و مالها اليابانية و لا حتى الفليبينة و هم يعاملوا أزواجهم معاملة سي السيد الذى يترحم عليه الرجل و تستقر صورته فى وجدان و عقل كل الرجال و ان اختلفت العصور"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705143031/http://masr.20at.com:80/article.php?sid=606"

[[comments]]
order = 1
subject = "و الله كلامك صح"
author = "أحمد المصري"
posted = "2006-07-03"
text = "فعلا لا يوجد مثيل للست المصرية فهى تساندك لأقصى حد و إذا حبت فإنها أخلص من أحب.<br />و ترضى بالقليل و تتحمل الكثير ومهما كان مستوى جمالها فلن تمتعك أى مرأة أخرى مثلها.<br />هذه كلمة حق من واحد جرب الأجنبية و الآن يندم على كل لحظة ضيعها بعيدا عن المصرية الأصيلة.<br />تحية إلى زوجتى الأصيلة"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705143031/http://masr.20at.com:80/article.php?sid=606"

[[comments]]
order = 2
subject = "سمع هس"
author = "هانيبال"
posted = "2006-07-03"
text = "يا شباب .. يا شباب .. يا شباب ..<br />من فضلكم دقيقة واحدة معايا كده ..<br />كلنا عارفين ان مبارك حرامي وخاين وحقير وفيه ما في الخمر .. وعارفين ان كل اللي حواليه واللي بيشجعوه احقر منه وانتن .. كلنا عارفين كل حاجة .. كلنا من اول رؤساء الجامعات لحد بياعين الطماطم والجرجير .. من فضلكم كفاية بقى نتكلم في عيوب واحد كله عيوب وبلاوي زرقا على دماغه و دماغ اللي خلفوه .. واهو المثل بيقول الضرب في الميت حرام .. هانيبال النهاردة بيقولكم تعالو نتفق كلنا على حاجة واحدة .. ايه هي الحاجة دي بقى ؟؟<br />كل واحد فينا يكتب هو عايز ايه بالظبط وباختصار .. ( باختصار يعني مش عايزين شعر وزجل وحاجات من دي اللي مش جايبة همها ) .. او يحدد الحل من وجهة نظره الشخصية .. بس بشرط .. انه يكون مقتنع مية في المية باللي هو كاتبه .. يعني يكون صادق مع نفسه قبل مايكون صادق معانا .. هانيبال شخصيا شايف ان الحل الوحيد هو ثورة شعبية منظمة تخلع صاحبنا من الكرسي وتحاكمه محاكمة معتبرة وتخوذقه وتحط مكانه نادي القضاة لمدة سنتين وبعدها الناس ينتخبو رئيس جديد .. هانيبال متاكد ان مصر بعد كده هاتدخل السبق من جديد والحال هايبقى معدن وكل واحد هاياخد حقه ..<br />وكلنا نطلب من ادارة الموقع انها ترفع رغباتنا لاي حركة او منظمة او حزب او جريدة محترمة على اساس ان الكلام ده مش مدهون بزبدة وانه مش مجرد كلام .. لا .. ده حلم .. وامل .. ومستقبل ناس ضايعة .. تعالو كلنا نعمل ده النهاردة .. التلات يعني .. هاااا مين قال انا اهو .. ؟؟؟؟<br />عمكم هانيبال"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705143031/http://masr.20at.com:80/article.php?sid=606"

