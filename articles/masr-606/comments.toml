[[comments]]
order = 14
subject = "مصرية بجد"
author = "ema"
posted = "2006-07-10"
text = "الفتاة المصرية فتاة متدينة خلوقة لما بتحب بتحب بجد و لما حد بيغظها او يزعلها بتعرف ازاى تاخد حقها منة زيها زى اي راجل تمام ومتعرفش تكرة و بتسامح وبالنسبة للصورة فانا اعتقد انا صورة لفتاة غلبانة تعانى ظروف قاسية ورغم ذلك قادرة على ان تبتسم هذة الابتسامة الجميلة"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010858/http://masr.20at.com:80/article.php?sid=606"

