author = "يا ابن سعادة اللوا"
posted = "2010-03-04"
text = "يا يا ض يا محسن ياض<br />ابوك سعلادة اللوا ما عرفش يكلملك حد ولا ايه<br />اللهم لا شماته<br />وارجو من بقية الضباط الحوش بتوع وزارتنا الزباله ان يعتبروا"
archived = "2010-03-12"
capture_url = "https://web.archive.org/web/20100312050830/http://www.20at.com:80/masr/news/15588-2010-03-04-12-11-01.html"

