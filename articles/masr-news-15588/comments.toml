author = "طلعت بيه"
posted = "2010-03-04"
text = "ايه يا طلعت بيه<br />ايه اللي بيحصل دا يا طلعت بيه<br />كده برضه تتبهدل كده وتنضرب بالجذمه يا طلعت بيه<br />على كل حال يا طلعت بيه انا اعرف محامي كبير اوي يطلعك منها زي الشعره من العجين<br />اسمه الاستاذ ممدوح زخاري من اسكندرية<br />دا محامي كبير اوي<br />خد نمرة تليفونه اهه<br />خد يا سيدي اكتب عندك<br />0121714842<br />لو القاضي عمل معاك حركه كده ولا كده اتصل بيه على طول<br />وهو يبهدلك امه<br />سلام"
archived = "2010-03-12"
capture_url = "https://web.archive.org/web/20100312050830/http://www.20at.com:80/masr/news/15588-2010-03-04-12-11-01.html"

