author = "تحية عسكرية شرطة دبي"
posted = "2010-03-04"
text = "هو دا شغل الشرطة مضبوط<br />وكمان فيه واحد من حماس اسمه المبحوح اتقتل في دبي بواسطة الموساد<br />ودبي كشفت الجريمة وشرشحت الموساد في العالم كله<br />هي دي الشرطة ولا بلاش<br />مش شوية العيال بتوعنا اللي لابسين بدل علشان يعاكسوا بيها البنات والستات<br />_______________ ___<br />مش زخاري ولا جرجس"
archived = "2010-03-12"
