subject = "مجرد رأي"
author = "علي الرغم من وجود برامج على نفس الطريقة زي ستار اكاديمي (المرفوضة لاسباب كتيرة)الا ان الحاجة الغريبة ليه ديما نهتم بسماع ومعرفة اخبار الغير بل ادق التفاصيل"
posted = "2006-07-05"
text = "ليه ديما عندنا فضول قاتل بمعرفة كل مل يخص الاخرين<br />انا رأي انه كل واحد يهتم بنفسه اولي<br />كل واحد ليه حياه واحدة خاصة به هيعشها ليه يشغل نفسه بغيرها ويضيع وقته بمعرفة تفاصيل لن تفيده في شيء"
