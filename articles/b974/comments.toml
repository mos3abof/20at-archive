[[comments]]
order = 1
subject = "انا عايز البي بي سي"
author = "في صمتك مرغم"
posted = "2006-06-22"
text = "اولا انا هكون خاص بس للبي بي سي, مش عارف السبب صراحة , بس حاسس اني هكون \"مستريح\" معاها , وخصوصا اني بحبها اوى, وناوى اتجوزها لما اخلص دراسة......ز آسف الامر اختلط عليا بينها وبين شخص عزيز عليا....!! المهم<br />حاجة جميلة انك تكون مشهور, والأجمل ان يكون سبب الشهرة جميل ويستاهل , يعني مش عايز اكون مشهور عشان قضية اختلاس ولا حاجة تانية, بس في مشكلة تانية, في لابلد دي اللي هيبقى مشهور عشان بيحب بلده, تاني يوم هيكون في برنامج خلف الأسوار بأي تهمة, حتى ولو كانت خطف \"العيال\"<br />وكمان انا محبش ان حياتي تكون كتاب مفتوح الكل يقراه, كلما زادت مساحة خصوصياتي, كلما ازدادات متعتي في الحياة<br />وأنا حقيقة لن أقبل بأمثالكم ان يشاهدوا \"بعضي\" يعرض أمامهم<br />احنا كنا بنقول ايه ؟!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142020/http://www.20at.com/article2.php?sid=974"

[[comments]]
order = 2
subject = "جاءنا البيان التالي...."
author = "هووووبه ياخفه...."
posted = "2006-06-22"
text = "الي الاخوة الاعذاء المحلوبين....<br />قررت انا بسلامتي هووووبه الاروبه التكرم والعمل لدي نفسي حشغل مسلسل ساره 25 ساعه محدش يسالني اذاي , وخاصه الاغني<br />ه,وكل حلقات الكارتون وخاصه ليون كينج<br />ممكن اتبرع للقناه مش فاكره اسمها..<br />واطلب تشغيل برنامج خلف الاسوارررر واول حلقه تتسجل مع المدونون<br />\" امنيه حياتي بجد\"...<br />اعمل حوار مع مدحت شللي وكل شويه اقطعه واقوله \"يانهار ابيض..يانهار ابيض \"<br />واعمل حوار مع مبيد فوري وازنقه في الحمام واغتت عليه واساله<br />انت ليه نسيت .... .<br />اعمل حوار مع نوال بنت امها و اهديها ضبغه شعر.<br />بس عايزه ابقي ضيفه في برامج اممممم ممكن \" افتح قلبك بس لعشرينات \"<br />انا من هزا المنبر بقول يتك الششلل يانوفا وبعتلك جواب ابقي<br />افتحيه ياختي .<br />اممم التحف بتوع الموقع بطلو حرب الكلام بقي انتو مش قدي ....<br />دوفي النهايه بقول لكل شاب وكل فتاه متاخزونيش لو خبطت في الحللل<br />او جرحت حد يعني من الاخر لامؤاخزه علي راي الشمحطجي."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142020/http://www.20at.com/article2.php?sid=974"

