[[comments]]
order = 5
subject = "اخبار شخصيه يادى الفضايح"
author = "واحده وخلاص"
posted = "2006-06-29"
text = "حكاية الاخبار الشخصيه وماما والجيران وكمان صحباتى اه ممكن اقول ده كله بس هابقى فى حماية مين ؟؟<br />مهما اكيد هيضربوا واقل حد فيهم هيسمعنى من المنقى ..<br />لأ يا عم خلينا كده بلا فضايح<br />وخصوصا لما تبقى الاخبار شخصيه<br />تفتكرو لو بنت ممكن تقول النهارده رحت الجامعه وشفت طالب اول مره اقابله كنت متاخره بس طلع جنتى خالص وقعدنى جنبه اتعرفت عليه يا ختى عليه زى العسل ...وحاجات تانيه كده<br />اللى هتقول كده مش هتبقى رويتر دى عاطف لا عواطف<br />ولا تخيلو لو واحد مثلا قال انه جاب تى شيرت كات بس روش طحن حب يلبسه بس حس ان شكله هيبقى مش اللى هو علشان الشعر اللى تحت ايده يعنى وراح قال بقى هو هيعمل ايه.. ياى<br />لا اخبار شخصيه ممنوع<br />بلاش دى هتبقى فضايح وبجاحه وعيب عيب عيب يعنى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142020/http://www.20at.com/article2.php?sid=974"

