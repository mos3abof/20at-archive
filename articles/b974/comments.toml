text = "عارفه يا حاجه ميوزه انا والبت نوفا ما تكلمناش ولامره اون لاين مع اننا عشره موقع تقريبا 6 اشهر<br />ولسه مفتحتش الماسنجر \" توقيت جرنتش يمكن \" متعرفيش \" مش عايزه تنزل الياهو ماسنجر .... بس الحاجه الحلوه اللي عملتيها انك عملتي علي الياهوووووو<br />علي العموم اميلي اهو عشان محدش يجي يقولي هو فين هو فين هو فين<br />sabarh_egy@yahoo.com<br />وانا مش صبارة"
