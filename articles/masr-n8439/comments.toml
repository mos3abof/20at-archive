subject = "مكتب مكافحة المدمنين"
author = "مصرى"
posted = "2006-12-03"
text = "دى شبكة واطية واطية يعنى بقى بالزمة فى كلام بالشكل ده معاونين المباحث يشغلوا الدواليب وبعدين يمسكوا المتعاطى وهو ورزقه يا تتعمله قضية تعاطى(حظه من السما أمه دعيالو والله) يا امابقى يعملوا معاه واجب ظباطى زى الفل ويزويدولو الحرز شويتين تلاتة وتبقى قضية أتجار وبكدة يبقى الظابط شايف شغله مظبوت وبيجيب قضايا 100 100 ويترقى. صلاة النبى أحسن .وبكده يبقى مفيش حاجة اسمها مكافحة مخدرات ولو عايزين نسمى صح نقول مكافحة المدمنين (ملحوظة :نسبة كبيرة جدا من الظباط يتعاطون مواد مخدرة سواء حشيش أو غير حشيش يا ترى مين بيحاسبهم ولا الحشيش ممنوع على الشعب بسز ملعون أبوك يا بخيت"
