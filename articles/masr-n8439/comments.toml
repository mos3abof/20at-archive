posted = "2006-12-04"
text = "ياجماعه انا عايز اقولكم حاجه مهمه اوى مبقاش في شاب في البلد مش خربااااان الحشيش هو الحاجه الوحيدة اللى بتخلينا منركزش في اللي بيحصل لنا وفي اغنيه كنت مالفها انا وحبيبي midi بتقول<br />خلي الدماغ صاحي<br />لو نامت الدنيا صاحي مع حشيشي<br />حشيشي في ايديا<br />نهار وليل صاحي<br />يا جندي يا خربان<br />عدونا جبار<br />وشكرا يا جماعه ومسا مسا لكل الناس الخربانه الفايقين لا يا عم الحج"
