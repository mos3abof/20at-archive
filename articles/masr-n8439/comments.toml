[[comments]]
order = 2
subject = "لفة بانجو لكل مواطن"
author = "البانجو ..... اخطر مخدر موجود في مصر لانه رخيص جدا جدا"
posted = "2006-06-12"
text = "دي كارثه انا مش عارف الجماعه بتوع مكافحة المخدرات دول بيعملوا ايه<br />والله دول ناس ما عندها ضمير<br />مخدر البانجو انتشر في مصر بشكل رهيب وموجود في كل مكان وبسعر رخيص جدا لذلك كل ضحاياه من الشباب<br />عندنا في المحله الكبري البانجو متوفر لجميع ابناء الشعب وبثمن الفول والطعميه<br />وتتصل بالشرطه مكبرين دماغهم علي الاخر وكان هناك مؤامره علشان الشباب امصري يبقي مدمني بانجو<br />الي كل ضباط مكافحة المخدرات في مصر وخصوصا في مركز المحله الكبري<br />اتقوا الله في بلدكم واهلكم وقوموا بعملكم<br />ولا انتوا بس مش شاطرين الا في التنطيط علي خلق الله<br />اللهم ولي من يصلح يارب وابعد عن الفاسدين والمفسدين"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135340/http://masr.20at.com:80/article.php?sid=503"

[[comments]]
order = 3
subject = "دول بيستهبلوا"
author = "أحمد هندي"
posted = "2006-06-12"
text = "يا اخواننا يتوع مكافحة المخدرات دول بيستهبلوا وهم فاهمين هم بيعملوا اية فى البلد<br />انا ليا واحد صاحبي كان ظروفه المادية سيئة وعيلته مفككة فاتجه للشرب وبعدين هو جسمه كان جامد وتشوفه تقول فتوة واتعرف على البشر اللى شغالة فى المشوار ده واشتغل معاهم فى دولاب مخدرات - ده اسم المكان اللى بيتباع فية المخدرات يعني - فى السيدة زينب فى حارة جوه حارة جوه حارة جوة حارة فى اخر حارة سد والمكان متقفل كله بلطجية وجايب لى صور بالموبايل تشوف البلطجية واقفين منظمين مرور المدمنين فى الحارة بطريقة ولا احسن جمعية تعاونية وتدخل على الدولاب فية واحد واقف ادامه و نفرين جوة الدولاب ده- أوضة صغيرة شوية- بيقطعوا ويرصوا ويعبوا ويلفوا وانت تدخل وتقول عايز 5 ورقات مثلا وتدفع وتاخد وتمشى<br />المشكلة فى كدة ان اللى مشغل الدولاب ده مأجره من رئيس مباحث قسم الخليفة مقابل 60 ألف جنيه شهريا ده غير اللى بيتدفع لصغار الضباط وأمناء الشرطة ولو جت حملة من العباسية - من مقر ادارة المكافحة- يكونوا معاه عالتليفون ويقولوا اقفل يا جعيدي-مش اسمه جعيدي انا بضرب مثل يعني- ولما الحملة ترجع يقولوا اشتغل تاني والحكومة عارفة كدة وساكتة امال تفسروا باية انخفاض اسعار المخدرات فى البلد أيام القرارات السياسية الهامة يعني ايام انتخابات الرياسة البلد كانت غرقانة فى المخدرات وقرش الحشيش كان ب 35 جنية أدام عيني فى باب النصر فى باب الشعرية والحكومة واقفة ومدية الواد الديلر اشارة انه يبيع وبعد كدة ترجعوا تقولوا تم ضبط مش عارف كام؟<br />مش قلت لكم الحكومة دي خاينة ولازم كلهم تتقطع رقابهم ويحاكموا محاكمات عسكرية كمان؟"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135340/http://masr.20at.com:80/article.php?sid=503"

