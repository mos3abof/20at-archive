[[comments]]
order = 24
subject = "كله بيلعب علي كله"
author = "اسامه الجندي"
posted = "2006-10-02"
text = "انتوا عايزين تقنعوني ان الحكومه مش عارفه حاجه عن اللي بيجري ف البلد... هههههههههه ضحكتووووني وانا ماليش نفس... كل قرش بيتباع ف البلد الحكومه<br />عارفه ان اتباع و مين اللي باعه و لمين و بكام و اللي اشتراه ده هيرووح يعمل بيه ايه....<br />يا جدعااااان الموضوع اكبر من ان الشباب مش لاقي شغل او العيشه ضنك او ان البلد بفي فيها فساد.... الموضوع بقي ان خلاص البلد من كبيرها ل صغيرها شغال في المخدرات و اللي مابيشربش يبقي شغال فيها واللي مش شغال فيهاعارف مين بيشرب و مين مبيشربش... الناس كل يوم بتتورط اكتر... طب تخيلوا ان الفترة اللي احنا فيها دلوقتي المخدرات فيها شاحه شويه و غاليه... ولما سألت ليه المخدرات غليت و مش موجوده.. عرفت ان اللي ماسك تجاره المخدرات ف مصر مدفعش المعلوم للمسئول الكبير اللي لا مؤاخذه....بيسهلوا توزيع الشحنه.. ده اللي انا عرفته و ما خفي كان اعظم......<br />نسألكم الفاتحه علي هذا البلد الامين...<br />خلاص بقت مولد و كله بيلعب علي كله..."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124926/http://masr.20at.com:80/article.php?sid=503&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

