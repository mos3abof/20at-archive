[[comments]]
order = 13
subject = "حرام عليكم نفسكم"
author = "كانت دماغ"
posted = "2006-06-19"
text = "فى الاول بقول اتقو الله فى نفسكوم فكر فى بكره<br />انا دلواتى فى الكويت من سنتين كانت فى مصر وكنت بعمل احسن دماغ فى الدنيا ومرتاحومبصوت والحمد لله كانت العمليه مرتاحه وللاسف لما بعت حسيت انها غيبوبه مراهقه لما جيت الكويت حسيت اننا فى مصر مش عيشين لا والله دى مش عيشه دى توهه الناس عيشه عشان تبقى فى احسن حال مش عشان تكيف وتنام وترجع تانى تصحى عشان تتكيف وترجع تنام احنا الشباب عندنا من صحيين الموت ارحم نصيحه من واحد جرب ده وده اصحو من الى انت فيه<br />كل التعليقات جميله وصحيح الى بيقلوه بس للاسف انه صحيح يعنى لما تلاقى حميها حراميها الناس هتعمل ايه يرجع العالم كله يقول ان العيب من الدوله عشان هى مشيه فى فكره غلط يزعلو ما حد يتكلم طب ليه يتبوظ يتتظبط حلينا ايجابين وطبعا ده مش ممكن عشان دى الى بيقولو عليها سيايسه دوله يعنى احنا بنتمنه بس ونقول يا رب<br />ارجع تانى<br />بقول لشباب مصر الحشيش مش عيب ولا حرام انا مجرب بس نشوف المصلحه راحه فين الاول وبعدين نتكيف يريت كل واحد يعيد الحسبه من تانى عشان الحياه حلوه بعيد عن الادمان نعيش وبعدين نتكيف<br />مين فيكم مش بيحلم بعربيه مرسيدس وبيت وشغل مراتب كل شهر ووحده مستنياك بليل وكيفك موجود تحت المخده<br />فكر هتلقيها حلوه انا مجرب<br />المهم انى افكر ابل معمل الحاجه الكيف مش هيخلص ولا يطير الرزق هو الى له معاد خده واعمل الى انت عاوزه وربنا كبير<br />يلا يا شباب جربو<br />انا مش عاوز اطول عليكم عشان متقلوش مجنون اميلى عندكم وعاوز اشوف ناس تسالنى على الى حصل"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908064335/http://masr.20at.com:80/article.php?sid=503&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

