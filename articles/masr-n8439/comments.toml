[[comments]]
order = 0
subject = "توعية ايه بس"
author = "اشغله الشباب بعمل وستغلة المجهود الهتقومة بيه فى حل للبطالة"
posted = "2006-06-11"
text = "فى الوقت دا الشاب هينشغل فى شغلة المقتنع بيه ومش هيتجه للمخدرات<br />ولو سئلتم ليه الشباب بتتجه للمخدرات هتعرفه ان هما عايزين يخرجه من الواقع العيشين فيه الهو كله بطالة وفقر والكبير بيدوس على الصغير وظلم فى البلد , ووسايط , ورشوة وغيره وغيره .<br />ولما بتيجي الشباب تطالب بحقهم بتعتقلوهم وتسحلهم<br />انا مثلا متخرج بقالي سنة اهو , ولحد دلوقتي مفيش شغل مستقر بنسبالي زى ما كنت متوقع وانا بدرس ان هخرج هيكون فى انتظارى الوظيفة او مكان الشغل اليناسب المصريف الصرفتها اهلي فى تعليمي<br />حتي الكورسات الختها والخبره الـ اختها ولا ليه اى لزمة فى البلد دى وفى نفس الوقت الخبرة دى هي المفرود تحقق تقدم للبلد دى , انا كل اصحابي كدا والشتغل منهم حتي فى مجرد وظيفة بياخد فيه 400 جنية فى الشهر دخلها بالوسطة ومنهم السافر ومنهم القاعد مش اشتغل حتي او نزل تدريب فى اى شغل<br />وانا زى ما قولتلكم<br />البطااااااااااااااااالة بتقتل الشباب وهي الهتخليهم يتجه فى اى شىء غلط مخدرات سرقة قتل نصب لو حتي هتوصل لبيع الضمير والكرامة<br />بالمناسبة نسيت اقولكم انا خريج حاسب ونظم معلومات يعني لا تعليق"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613135340/http://masr.20at.com:80/article.php?sid=503"

