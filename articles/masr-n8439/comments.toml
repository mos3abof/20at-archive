[[comments]]
order = 11
subject = "هعهع"
author = "المذهول"
posted = "2006-06-14"
text = "يا ناس ياشر كفاية قر، منكم لله ياجهلة ياكنده ياعدمين الكيف، روحهم وتفرجم على البلاد المتقدمة زي هولندا مثلا، أو هناك بيتباع الكيف علني، ونتيجة ذلك يبقى دماغاتهم رايقة ويعرفوا يفكرو إزاي يعملوا لمصلحة البلد...هعهع!<br />إنتم يالي ميعجبكم العجب إنتم، هو الريس السادات ألف طربة حشيش تمخمخ عظمه المسوس، مش كل أفكاره جت بعد سلطنة الحشيش، الله يازيه الإسلامبولي، خلاص حبكت لازمن ولابد يعني تموت الأقرع النزهي الي كان منغنغنا مخدرات؟<br />لاكن الحمد لله لطف بالغلابة، وحسنية الغزية بقت أحسن من أنوار النورية، وهو الصنف بتراب الفلوس.<br />وأحب أرد على الحاقدين وأتباع الخوميني إبن لادن ده، بتاع الجزيرة، أنا الحشيش الي بشربه شرعي، سامع، وجايبه من القسم، ولو تحب تشتري، العسكري يوصله لحد باب مغارتك، بطل نق. على راى أخونا شعبولا\" واما بنعمة ربك فحدث\".<br />أناأحب أشرب حشيش..<br />يوصلني مع الشاويش..<br />وأدي المأمور بقشيش.<br />يعتقني ويبقى مفيش.<br />عاش الحزب الوطني، عاش السادات...عاشت دولة الباطنية، إديني تعميره ياجدع.<br />هعهع"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010117/http://masr.20at.com:80/article.php?sid=503"

[[comments]]
