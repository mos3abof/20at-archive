text = "كل تجار المخدرات بيعوا بامر من رئيس المكافحة فى اى قسم شرطة وقسم الشرطة كله بيقبض من التاجر اللى بييع وده فى سبيل انهم يعملوا قضايا للشباب الغلبان اللى بيشرب مخدرات وكمان اصحبت الاسعار فى متناول جميع الشباب سعر ورقة البانجو غلى فى خلال اسبوعين 5 جنيه بقت الورقة بـ25 جنيه وممكن اى واحديحيب الكميه اللى هو عايزه من الحشيش من اسكتدريةمن عند سيادة العقيد بتاع المكافحةاسكندرية مفتوحة بحرى وهى بحرى"
