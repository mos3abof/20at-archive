text = "والله ده التفسير الوحيد المعقول<br />** او تكون هناك اوامر من السلطه العليا في البلد انهم يسيبوا الشعب يعيش وينسطل<br />الاخ بتاع اسكندريه البانجو غالي عندكم كده ليه ولا هو بانجو سياحي<br />اجدع باكته بانجو عندنا متجيبش 15 جنيه<br />اصل احنا عندنا وفره في الانتاج ولا يمكن البانجو بتاع المنصوره مغشوش<br />الله يخرب بيتكم يا بتوع المكافحه انا نفسي افهم انتم بترحوا الشغل كل يوم تعملوا ايه<br />البلد كلها اتسطلت يارجاله"
