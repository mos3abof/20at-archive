text = "يا اخوانا الجماعه بتوع الشرطه دول ناس اصلي آآآه,ناس بجد فاهمه الدنيا ماشيه ازاي علشان بيشوفو الشباب بتصبح في المعمل وفي الجناين يروحولهم و مستحيل يشدوهم على الاسم بالعكس نديهم استباحتهم و يتجهو واشطه يا جامد صباح الفل,احنا في ايم سودا ومفيش غير الحشيش هو اللي بيهون على الناس,سيبو الناس تستريح من البهدله بتاعت طول اليوم,بهدلوهم 23ساعه,وريحوهم ساعه واحده!!!!!!!!!!!"
