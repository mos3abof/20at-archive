author = "اكتب اسمك هنا"
posted = "2008-07-11"
text = "بابا يابابا<br />ياما نفسي في دروس خصوصية<br />اقتصادات وعلوم سياسية<br />عايز اكون زي حسن نافعة<br />مش زي بتوع السياسات<br />بس ياخايب<br />مش عاجبك تدريسي يا000؟<br />لأه يابابا<br />بس انت ماعنكش اجابة<br />عن كل اللي محير فكري<br />ايه هو المجتمع المدني<br />ايه لازمة دية النقابات<br />ليه احنا بنحب نزور<br />ونحب كمان الانتخابات<br />ليه الناس عايزة الحرية<br />ليه بيطالبوا بالاصلاح<br />ايه هو الاصلاح اصلا<br />ليه الناس عملوا اعتصامات؟<br />والعمال عاملين اضراب<br />ليه بيقولوا كفاية يابابا<br />ليه الناس رافضة التوريث؟<br />دسترناهم وماهوش عاجب<br />لخبطنا كل القوانين<br />دسنا على المحكمة والقاضي<br />وولاد الرفضي صامدين<br />شوف يابني يازين ال[ *** ]ان<br />اسئلتك مالهومش اجابة غير حاجة واحدة<br />تلاقيها عند الداخلية<br />الشعب عايز ضرب الجزمة<br />ولاتشغل نفسك بسياسة<br />ولاتشغل بالك بالشعب<br />اضرب اسجن عذب اسحل<br />راح تنجح وتسوق الشعب"
archived = "2009-09-02"
capture_url = "https://web.archive.org/web/20090902110317/http://www.20at.com:80/masr/t7kyk/9591.html"

