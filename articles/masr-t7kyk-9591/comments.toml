posted = "2008-07-11"
text = "شعبي حبيبي ياروحي يابيبي ياحاطك في جيبي يابن الحلال<br />ياشعبي ياشاطر ياجابر خواطرياساكن مقابر وصابر وعال<br />ياواكل سمومك يابايع هدومك ياحامل همومك وشايل جبال<br />ياشعبي اللي نايم وسارح وهايم وفي الفقر عايم وحاله ده حال<br />احبك محشش مفرفش مطنش ودايخ مدروخ واخر انسطال<br />احبك مكبردماغك مخدرممشي امورك كده باتكال<br />واحب اللي ينصب واحب اللي يكدب واحب اللي ينهب ويسرق تلال<br />واحب اللي شايف وعارف وخايف وبالع لسانه وكاتم ماقال<br />واحب اللي قافل عيونه المغفل واحب البهايم واحب البغال<br />واحب اللي راضي واحب اللي فاضي واحب اللي عايز يربي العيال<br />واحب اللي يائس واحب اللي بائس واحب اللي محبط وشايف محال<br />واحبك تسافر وتبعد تهاجروتبعت فلوسك دولار او ريال<br />واحبك تطبل تهلل تهبل عشان ماتش كوره وفيلم ومقال<br />واحبك تأيد تعضض تمجد توافق تنافق وتلحس نعال<br />تحضر نشادر تجمع كوادرتلمع تقمع تظبط مجال<br />لكن لو تفكر تخطط تقررتشغلي مخك وتفتح جدال<br />وتبدأ تشاكل وتعمل مشاكل وتنكش مسائل وتسأل سؤال<br />وعايز تنور وعايز تطوروتعمللي روحك مفرد رجال<br />ساعتها حجيبك لايمكن اسيبك وراح تبقى عبره وتصبح مثال<br />حبهدل جنابك وازل اللي جابك وحيكون عذابك ده فوق الاحتمال<br />وامرمط سعادتك واهزأ سيادتك واخلي كرامتك في حالة هزال<br />وتلبس قضيه وتصبح رزيه وباقي حياتك تعيش في انعزال<br />حتقبل ححبك حترفض حلبك حتطلع حتنزل حجيبلك جمااااال"
archived = "2009-09-02"
capture_url = "https://web.archive.org/web/20090902110317/http://www.20at.com:80/masr/t7kyk/9591.html"

