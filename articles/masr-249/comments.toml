text = "ياريت مصر اللي يحكمها يبقو ناس زي الاخوان والله مصر عمر وضعها هيتحسن الا لوطبقت الاسلام على اصوله ويبقى دستورنا اسلامي 100 في 100 على الأقل مش هنلاقي واحد حرامي ماسك الحكم ولا هنلاقي استبدا ولا هنلافي غش والتاريح شاهد على كده فطول عمر المسلمين كانو متقدمين في كل حاجه لما كانو بيطبقو الاسلام صح ولما بعدنا عن الاسلام حصلنا اللي احنا فيه من التخلف والجهل والفقر<br />وطز في العلمانيه على اللي بينادو بيها اللي موديانه في 60 داهيه"
