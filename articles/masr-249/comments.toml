[[comments]]
order = 15
subject = "من يكره الاخوان"
author = "اشرف"
posted = "2006-06-10"
text = "كل متحامل على الاخوان هو واحد من ثلاثة<br />مسلم جاهل بدينه و بتاريخ الاخوان<br />او مسلم بالميلاد بعيد عن دينه ولا يؤدى الفرلئض<br />او مسيحى متعصب فاكر ان المسلمين اغتصبوا مصر ونسى ان المسلمين مصريين زيه لكن اختاروا الاسلام دينهم"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132526/http://masr.20at.com:80/article.php?sid=249"

[[comments]]
order = 16
subject = "القلب"
author = "ابو زياد"
posted = "2006-06-16"
text = "اهم ما فى الموضوع يا اخوه ليس المظهر ولا اللوك الاهم من ده كله كله القلب الابيض والضمير الحى والابيض والصافى والذى لا يؤذى حقوق الانسان فى الشارع ويحترم الادميه ويعامل الناس باحترام ولا يتفنن فى سرقة اموالهم هو الاجدر دائما باحترام الناس وتقديرهم من اللوك والشكل ولهذا انا احترم عاكف وارائه واحترم الاخوان كما اكره كل عضوا بالحزب الوطنى من الصغير الى الكبيييييير"
