[[comments]]
order = 9
subject = "يا ريت نقرأ قبل ان نتكلم"
author = "علاء الكنانى"
posted = "2006-05-05"
text = "يا جماعة ممكن نقرأ عن أى موضوع هنتكلم فيه علشان نكون ملمين بكل نواحى الموضوع ويا ريت ما نقرأش من مصدر واحد ويكون فيه شوية احترام على الاقل علشان سنه وجهاده العظيم والاخوان مش بيفرضوا الاسلام على حد هما بيقولوا نطبق الاسلام صح ونجرب ونعيش فى ظل الاسلام مصر جربت الاشتراكية وفشلت والرأسمالية وفشلت ليه منجربش الاسلام _ الاسلام ده مش عبادات وبس الاسلام ده نظام ربانى من الله اللى خلقنا وهو أعلم بما يصلح لنا_ ده موقع الاخوان www.ikhwanonline.com"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132526/http://masr.20at.com:80/article.php?sid=249"

[[comments]]
order = 10
subject = "هو ده نص البرنامج"
author = "علاء الكنانى"
posted = "2006-05-05"
text = "وهذا هو نص الحوار<br />فى لقاء الليلة على برنامج \" اليوم السابع \" لمقدمه الأستاذ / محمود سعد مع فضيلة المرشد العام للإخوان المسلمين الأستاذ محمد مهدى عاكف تحدث فضيلة المرشد فى العديد من القضايا كما فى التقرير التالى :<br />بدأ البرنامج بتقرير عن مرشدى الجماعة السابقين فضيلة الإمام البنا ومن بعده المستشار الهضيبى ثم الأستاذ عمر التلمسانى ثم الأستاذ محمد حامد أبو النصر ثم الأستاذ مصطفى مشهور ثم المستشار مأمون الهضيبى ثم فضيلة الأستاذ محمد مهدى عاكف ...<br />ثم بدأت الأسئلة من مقدم البرنامج الأستاذ / محمود سعد :<br />لماذا العلاقة بينكم وبين الحكومة متوترة مع أن الإخوان جماعة دعوة ؟<br />نحن رؤيتنا فى التعامل مع الناس واضحة جداً ، وهذه الحرب لأننا نؤمن بالحريات وتبادل السلطة وأن على الشعب واجب كبير نقوم نحن بأدائه ، ولسنا نؤمن بالرصاص والعنف إلا مع العدو والمحتل ، وأتحدى أن يكون للإخوان المسلمين منهج قوة أو عنف مع الشعب بحال من الأحوال .<br />ونحن لا نعتبر أى مواطن مصرى عدو لنا ( مسلم أو مسيحى ) فالكل سواء ونحن تعاملنا مع الجميع واضح جداً جداً .<br />وماذا عن قول ميلاد حنا أنه سيهاجر من مصر لو وصل الإخوان للحكم ؟<br />قول ميلاد حنا أنه سيهاجر من مصر ، نحن نحترم رأيه ، ولكن إذا كان يرى ذلك فليهاجر هو حر فى رأيه وقراراته .<br />الناس تتدين تدين سطحى وحين يرفع الإخوان شعار الإسلام هو الحل فهو انتماء عاطفى ؟<br />لماذا الناس تعتبر أن الشعب من السطحية ومن عدم الفهم لهذه الدرجة ، نحن نحمل دين ونحمل رسالة ومنهج ومأمورين من الله عز وجل أن نبلغ هذا الدين ... والناس فى المقابل تفهم وتعرف ذلك .<br />وما علاقة الدين بالسياسة ؟ تريدون الحكم ؟<br />نحن هيئة إسلامية جامعة فيها التربية وفيها الثقافة وفيها الاقتصاد .... الثقافة ا<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132526/http://masr.20at.com:80/article.php?sid=249"

[[comments]]
