[[comments]]
order = 3
subject = "العلمانية هي الحل"
author = "biggerman2006@yahoo.com"
posted = "2006-05-02"
text = "العلمانية هي الحل لأن في فرض مبدأ الإسلام هو الحل أن تفرض على الناس الدين والله والدين لا يفرض لأنه يتم بحب وليس بخوف من الجزية أو القتل لذلك أنا أرفض لاأن أشاهد هذا المهدي العاكف على الإرهاب والتطرف والقتل بكل أنواعه وهو يلبس قناع من نفس النوع الذي وزعه على أتباعه الجلابيب الصغار الذين قبلوا يديه فرحآ بال88 مقعد .فهو مثل الثعبان الذي يتلوى ويتلون ويتحين الفرصة ليبتلع الفريسة (مصر وشعبها)"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132526/http://masr.20at.com:80/article.php?sid=249"

[[comments]]
order = 4
subject = "نيولووك"
author = "انا مش من الاخوان .. لكن على اي حال احترمت مهدي عاكف جدا في حوار محمودسعد..ومحمود سعد كان جيد و غير مستفز واحترم الرجل..على عكس ذويالنوايا السوداء اللي بيقولوا ان سعد جابه يهزأه"
posted = "2006-05-02"
text = "محمود سعد مش غبي علشان يخسر جمهوره اللي متعاطف مع شخصية بتمثل جماهيرية و شعبية عالية زي عاكف..ومش بقول كده علشان شعبية الاخوان ولكن علشان كره الشعب لكل ما هو حكومي ..و حبهم و عشقهم لكل منيكره الحكومة و يشتمها.<br />طيببالنسبة للجماعة بتوع التعابين ..مهدي عاكف مكنش زي التعبان ولا حاجة..يعني نفسي يا جماعة لما تحكموا على حد تبعدوا هواكم شوية ..أنا مثلا لا يمكن انضم للاخوان ..لكنعلى الاقل بحترمهم<br />يجيلك واحد يقولك العلمانية هي الحل!!و الله حرام اصلا الساحة اللي اخدها في الصفحة دي. ربنايبارك لكم"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132526/http://masr.20at.com:80/article.php?sid=249"

[[comments]]
order = 5
subject = "علمانية ؟؟؟"
author = "مسلم للأبد"
posted = "2006-05-03"
text = "علمانية إيه أكتر من اللى إحنا فيه...هو إحنا مودينا فى داهية غير العلمانية...أمريكا همها الأكبر إن ميكونش فى حاجه إسمها إسلام ولا مسلمين...فوقوا بقى...وبعدين هو من إمتى والأسلام بيفرض الدين على الناس...مهو دى أخرة الجهل...حاول تقرأ شوية فى معاملة المسلمين لغير المسلمين فى الماضى..شوف فى عهد سيدناعمر...والله مانا لاقى كلام أقوله...غير \"حسبى الله ونعم الوكيل\""
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132526/http://masr.20at.com:80/article.php?sid=249"

[[comments]]
order = 6
subject = "عيب يا راجل يا علماني"
author = "صبحي الصغير مدوحس"
posted = "2006-05-04"
text = "يا اخي العزيز عيب اي حد منا يشتم الاستاز عاكف لاننا ما نجيش شعرة وخوصا انت ياللي بتقول (تعبان بكسر التاء او اللي بقول ثعبان )لانكم ابناء الانجليز وما بحطش بذمتي مين ابوكم لانكم مستحيييييييل تكونوا مصرين احنا مش مع الاخوان بس ما بنشتمش اللي عملوا لمصر واللي تعبوا عشان مصر وحاربوا وكانوا يضحوا بدمهم وبتعبهم عشان مصر وقال ايه جاي على اخر الزمن واحد زيك مش معروفة صلعة ابوه منين ويشتم الكبار في بلدنا مصر وبقولك رووووح اتنيل يا ست مش شاراجل وقال علمانيه طيب طبقها على اهل بيتك اولى ولا اقلك اكيد انت مطبقها يا ديوث"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132526/http://masr.20at.com:80/article.php?sid=249"

