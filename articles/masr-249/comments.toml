subject = "مصري مائة بالمائة"
author = "صابر غريب"
posted = "2006-05-01"
text = "لا أستطيع أن أزايد علي مصريتك يااستاذ عاكف فأين أنا القاعد المتقاعس عن خدمةبلدي منك وأنت الذي حاربت الإنجليز في القناة ربيت الشباب علي حب الدين والوطن . دعني أحني غروري خجلا أمام نبلك وتواضعك وأقسم لك أنني أحسست وأنا أراك علي الشاشة أنك أخ لكل مصري وأب لكل مصرية<br />ومن بشاشة وجهك طالعنا ضوء الأمل في عتمة اليأس المطبق...تحية لك .. وتحية للإخوان المسلمين"
