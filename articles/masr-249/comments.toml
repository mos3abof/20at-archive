subject = "ليس نيولوك"
author = "\"نيو لوك مرشدالإخوان\"..عنوان لذيذ وجذاب ، لكنى لا اراه ينطبق على الموضوع ، فمنذ أن رأينا مهدى عاكف وهو يرتدى بدلة وكرافتة شيك ، وأول ظهور له بعد توليه مهام مرشد الإخوان كان فى حوار مع حمدى رزق فى مجلة المصور و كان جالسا يضع ساقا على الأخرى"
posted = "2006-05-01"
text = "و فى أغلب أحاديثه الصحفية يتحدث عن مبارك بهذه الجرؤة ، وقد قال له فى ذات مرة - خلال عزاء المهندس اكرم زهيري رحمه الله الذى توفى داخل المعتقل \"اتق الله يا مبارك فأنا وأنت على أبواب الآخرة\"<br />عموما الموضوع جميل"
