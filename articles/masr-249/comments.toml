[[comments]]
order = 22
subject = "هل الاسلام اكتشاف جديد؟"
author = "عمرو"
posted = "2006-10-10"
text = "قرأت تعليق ليقول تعالوا نطبق الاسلام<br />واريد انا أسأل هل الاسلام اكتشاف جديد اكتشفه الاخوان؟<br />لقد قرأت برنامج الاخوان السياسى واكتشفت ان كل الاقتراحات تعبر عن افكار وتشريعات غربيه ولكن مع اسلمتها(يعنى اضافه بعض الكلمات الاسلاميه) اى انه موقف سياسى معاصر ولكن مع بعض التبرير الدينى واعتقد ان هذا فهم غير صيحيح للاسلام لأن الاسلام قدم قواعد كليه ومقاصد عامه وترك الامور الفرعيه للاجتهاد وبذلك فتح الباب امام اختلاف الافكار والاجتهادات ولم يدعى احد ان سياسته هى الاسلاميه وغيرها كفر وينطبق ذلك على الاقتصاد ايضا بمعنى انه اذا كان من حق الاخوان ان يتبعوا اقتصاد رأسمالى او حتى اشتراكى فليس من حقهم ان يدعوا ان اختيارهم هذا هو الاختيار الاسلامىلأن ذلك يصادر حق الاخر فى الاختلاف معه<br />وبذلك اقول ان من يدعى ان سياسته او اقتصاده هو الاسلامى فقد كذب لأنه افتراء على الله وعلى الاسلام كما انه لو فشلت عذه السياسه وقتها سيقع اللوم على الاسلام وانا اقبل ان تتهم الرأسماليه او الاشتراكيه ولااقبل ان يتهم الاسلام ولذلك ادعوا الاخوان ان يتقوا الله فىذلك"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117204606/http://masr.20at.com:80/article.php?sid=249&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
