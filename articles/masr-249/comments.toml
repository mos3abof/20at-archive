author = "مسلمة"
posted = "2006-07-21"
text = "اين نحن من الاخوان حتى نقول عليهم هذا انهم قوم باعوا حياتهم لله فاشتراها منهم<br />انا لست من الاخوان ولكنى اراهم فى الشارع فى الجامعة وفى العمل وفى شتى الارض يعملون فهم مستيقظين والناس نيام متالمين والناس فرحين لا يريدون الا رضا الله عزو وجل بارك الله فيهم ورزقهم الخير والسداد"
archived = "2006-09-06"
