subject = "سعد زغلول مين؟"
author = "بكيزة هانم"
posted = "2006-05-06"
text = "مصر كانت أكبر من سعد زغلول الذي قال الدين لله والوطن للجميع ولم يكن فاهما للدين ولا أفاد الوطن .. فمصر بقيت بعده محتلة 30 سنة ومات سعد ولا يدري أحد هل أقلع عن الخمر والقمار أم أنه أيضا قال عن نفسه ما فيش فايدة غطيني وصوتي يا صفية.......إقرأوا إن شئتم مذكرات سعد زغلول"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132526/http://masr.20at.com:80/article.php?sid=249"

[[comments]]
order = 12
subject = "تصادم للابد"
author = "مصريه"
posted = "2006-05-13"
text = "ةالله ما فى اطيب من شعب مصر بس لو كل واحد يحاول يتفهم الرأى والرأى الاخرمع وجود شويه حب واحترام بس للاسف احنا فى ظل الظروف الصعبه اللى مصر بتواجههامن بعض المفسدين واللى بوجودهم هنتدنى كمان وكمان وكل واحد يبدا بنفسه بدل ما كل واحد كل همه النقض وحتى ولو نقض بناء اكيد ملوش اهميه ومش هيحل ولا يربط من الاخر ربنا يتولانا برحمته لان الرحمه انعدمت بكل اسف على شعبى الحبيب ونشكو للى لا بيغفل ولا ينام والله اكبر على الظلم بكل انواعه"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132526/http://masr.20at.com:80/article.php?sid=249"

[[comments]]
order = 13
subject = "بهدوء ما هى العلمانية"
author = "احمد شعبان"
posted = "2006-05-27"
text = "العلمانية هى مبدا سياسى وليست مبدا اجتماعى قوامة ان الدولة كنظام سياسى ليس لها دين فهى كائن معنوى تتعامل مع مواطنيها وفقا لمبدا المواطنة فالاساس فى اكتساب الحقوق والتحمل بالواجبات العامة هو اكتساب الجنسية الوطنية دون النظر الى ماتدين بة فهو امرشخصى بحت ومن ثم فازا كانت العلمانية(او اللادينية)لاتعترف بالدين على المستوى السياسى اعمالا لمبدا المواطنة وتكافؤ الفرص القائم على العدالة فهذ لاينال من حق المجتمع فى الاعتراف بالدين كفوى اجتماعية مفاد القول ان العلمانية كنظام سياسى مجرد من الدين لايدعو الى الالحاد بل يدعو التعبير عن الذات والقبول بالاخر ثقافيا واجتماعياوفكريا فتلك هى القيم التى تدعو اليها العلمانيةاو بالاحرى تلك القيم التى عان المجتمع الاوروبى من غيابها مفاد القول ان العلمانية دولة وليست دين"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132526/http://masr.20at.com:80/article.php?sid=249"

