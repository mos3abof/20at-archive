order = 0
subject = "ارهابي ؟؟؟"
author = "هوووبه,هبهوب,هبابه"
posted = "2006-04-11"
text = "نفسي افهم يعني ايه اررهاب يعني ايه كل واحد بدقن يبقي ارهابي<br />كفايه بقي انا زهقت ..كل واحد ارهابي يلبسوه دقن وروح ياعم<br />الارهابي مثل شكلك ماشي مع الدور اصلك لو حلقت حتبقي مش<br />ارهابي .. نصيحه للي مش ارهابين استخدمو معجون حلاقه نضيف."
archived = "2006-05-24"
