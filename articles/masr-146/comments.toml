[[comments]]
order = 1
subject = "الغفله"
author = "مودي"
posted = "2006-04-12"
text = "المسرحيه ماخوذه من الكاتب (محمد سلماوي) اللي قال-ذلك الجلباب القصير قبيح المنظر-<br />واحد بيقول على السنه قبيحة المنظر لازم يكتب كلام فارغ زي ده<br />مع كامل الاحترام الشخصي ليه ككاتب كبير ومثقف"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212358/http://masr.20at.com:80/article.php?sid=146&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "مشكله والله"
author = "عبدالله مفتاح"
posted = "2006-04-12"
text = "آآآآآآآآآه يا بلد<br />كنت فكرت انا وبعض الاصدقاء اننا نعمل مسرحيه بسيطه ونعرضها في الساقيه<br />للاسف لان فكرها كان بناء جدا وكان بيقدم صورة للمسلم الملتزم الملتحي وصورة للبنت الملتزمه<br />المشروع سبحان الله لم يتحمس له احد<br />وباظت الفكرة<br />عارفين بقا لو كنا جبنا واحد ملتحي مجنون<br />او منتقبه سيئه الخلق ميت واحد كان هيرعى الفكرة كنا هنلاقي مليون منتج ومسؤول يرعى الفكرة ويكبرها<br />بس لاسف الفن الحقيقي لا يجد من يرعاه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212358/http://masr.20at.com:80/article.php?sid=146&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "في انتظار ك"
author = "متابع للساقية !"
posted = "2006-04-13"
text = "أستاذ عبد الله في اعتقادي أن عرضك لن يتم رفضه ، وخاصة من إدارة ساقية الصاوي ، لأنه ـ حد علمي ـ يقدم عروض"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212358/http://masr.20at.com:80/article.php?sid=146&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "الساقية"
author = "Dabdoob"
posted = "2006-04-13"
text = "والله يا استاذ عبد الله مفتاح الساقية تقدم عروض راقية جدا ومحايدة ومتنوعة ولم تمنع عرضا من قبل لانه يصور المتدينين بصورة سيئة ....<br />المشكلة ان العروض الفنية التي تقوم علي هذا الشكل (مسلم ملتزم - مسلمة متدينة ) تكون اشبه بالحكم والقصص الدينية التي تصور الناس بشكل احادي حيث المسلم الملتزم هو الطيب والاخر غير الملتزم وربما غير المسلم هو الشرير !!!!<br />ارجو ان لا تعتبر هذا هجوما علي عرضكم المسرحي لانني لم اشاهده او اقراه حتي بالطبع ولكنني استفزني هجومك علي ساقية الصاوي بدون مبرر حقيقي !!!!!<br />وسلام<br />Dabdoob"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212358/http://masr.20at.com:80/article.php?sid=146&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "انا انتقدت الساقيه خالص"
author = "عبدالله مفتاح"
posted = "2006-04-13"
text = "انا لا قلت ان الساقيه رفضضت عرضي ولا هاجمت ساقيه الصاوي يا دبدوب<br />دبدوب يا حبيبي بالراحه عليا ربنا يكرمك انا قلت ان لم يتحمس احد يعني ملقناش متنج ومعرفناش نكمل ستاف الممثلين<br />والقصه اللي كان جزء منها اتكتب كنا متفقين اننا هنوضح شكل المسلم الملتزم والمسلم غير الملتزم وكانوا الاتنين هيكونوا كويسين مش وحشين<br />هنضوضح الفروق والناس اللي تحكم<br />عشان اللي مش ملتزم ميزعلش مننا<br />ولا تبقى عارف ان نقطة زي دي انا واخدها في بالي وانا بكتب يعني مش هتعدي عليا<br />وبالراحه عليا يا دبدوب<br />انا لولا اني عارف ان الساقيه بتعرض كل حاجه مكنتش قلت في الاول اننا كنا ناوين نعرضها في الساقيه"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212358/http://masr.20at.com:80/article.php?sid=146&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 6
subject = "اتقوا الله في دينكم ان كنتم مسلمون"
author = "محمد مهدي"
posted = "2006-04-20"
text = "اتعلمون ان اللحية هي امر من الله عز و جل على لسان نبينا محمد صلى الله علية و سلم و هي من صفات الرجل المسلم و التي يعتبر حليقها في حكم المتشبة بالنساء.<br />لماذا تتحركون بفكر صهيونى يامسلمين<br />لماذا تتحركون بفكر صهيونى زرع في قلوبكم ان من يطع الله و رسوله اصبح ارهابي.<br />ضربونا و احتلونا و ضيعوا نسائنا و شبابنا و اغتصبوا اراضينا و احتلوا فكرنا ثم نحن نتشبه بهم و نتهم السنى بالارهاب.<br />اتقوا الله و توبوا الية<br />اتقوا الله<br />اتقوا الله<br />اتقوا الله<br />حسبنا الله و نعم الوكيل"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212358/http://masr.20at.com:80/article.php?sid=146&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"
