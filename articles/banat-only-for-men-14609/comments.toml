text = "اقتباس ماهر:<br />الكاتب على فكرة بيشتكي من الطريقة يلي بتتعامل بيها الزوجات مع الازواج مش من النظافة بس العتب عال؟؟؟؟ ماعلينا فيكم وحده قالت الاجانب والسوريين واللبنانيات مهما دول بيعرفوا يدلعو رجالتهم صح مش زيكم جوازكم طفشانه منكم ده انتو بقيتو 9 مليون عانس الله يخرب بيتك يلي في بالي…<br />هو الموقع ده مش للبنات ماهر ده بيعمل ايه؟؟؟<br />اللبنانين والاجانب والسووريين مينفعش يتجوزو واحد زيك اصلا<br />ولوحصل هيشغالوك زى … ويبقى ع قلبك زى العسل ولا انت من النوع الى بيشتغل فالبيت عادى؟؟<br />متنساش انك مامتك مصريه واختك<br />وال 9 مليون اللى بقو عوانس اكيد مش بسببهم هما مش لاقين رجااااااااااااا االه فهمت يا اخ ماهر"
