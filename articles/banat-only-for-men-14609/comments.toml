[[comments]]
order = 61
subject = ""
author = "YouKa Parkour"
posted = "2010-02-24"
text = "خامسا واخيرا وليس اخرا تظريه لامؤخذه قاعده الحمام:<br />مهو انتم يا رجاله لو عارفين دنكم مكنتوش قلتم كده ,اولا لازم قاعده الحمام تغلق لان ده بيت الشيطان و المفروض انها تتقفل بعد قضاء الحاجه وباب الحمام يغلق ايضا , وبعدين مش هتموت ولا هتخس لما تعمل كده يعنى بالعكس هتاخد ثواب انك ساعدة زوجتك وريحتها وكمان لو كان عندك اطفال هيطلعو اطفال عندهم نظام مش همجيين فى المجتمع .<br />ده انتم المفروض تدونا وسام على اللى بنعمله عشانكم و عشان نطلع مجتمع صالح و منظم مش مجتمع مهرجل وعديم الثقافه<br />بدل مانتم عماليت تنتقدونا و تقولو عيوبنا و سلبيتنا ,احنا ممكن نعمل مثلكم و نقول عيوبكم و سلبيتكم بس ثقوا تماما ان<br />ه لو حصل هنفضل فى صراع داءم و عمر المجتمع مهيتقدم.<br />وشكرا"
archived = "2010-02-25"
capture_url = "https://web.archive.org/web/20100225095718/http://www.20at.com:80/banat/only-for-men/14609-2009-12-27-15-48-47.html"

[[comments]]
order = 62
subject = ""
author = "YouKa Parkour"
posted = "2010-02-24"
text = "ثالثا نظريه الريموت:<br />ماهو انتم لو بتثبتو على قناه مكوناش اتكلمنا لاكن ليه لازم من قناه لاخرى لما بيجلنا حول واللى يغيظ انك ممكن تتفرج على مسلسل بس تلاقى مراتك جت تقوم تجيب ماتش كره او قناه اخباريه لمجرد انك ترخم عليها لان معظم رجاله مصر بيحبو يشوفو زوجاتهم متعصبينى ومستفزين عشان شكلهم بيبقى حلو ,مش هقولك هات لمراتك تلفزيون بس هقولك زى ما بتحب تتفرج على اللى انت عاوزه هيا كمان ليها نفس الحق ده ونظريه الرموت احسن من انك تغرم و تجيب ليها تلفزيون ,ولما الريموت هيتحط على الترابيزه مش هيضيع لانك لو عندك اطفال ثق تماما انه هيضيع.<br />رابعا نظريه المفروض تساعدنى:<br />المرأه المصريه بشتغل خارج المنزل مثلك تماما ومع ذلك بتجرع بيتها تنضف وتعمل اكل وتغسل الغسيل والموعين وتحضر اكل الغد وانت قاعد باشا بترجع تاكل وتنام وتصحى تتفرج على التلفزيون و تنزل تقعد مع اصحابك وتلعبو بلاى استيشن ومضايق انها تقولك ساعدنى معا انها مش بتقول ده دايما هيا بتقوله لما بس بتبقى تعبانه او مرهقه,ده انتم يا رجاله انانين جدا عاوزين كل حاجه مع ان الدنيا مش بتدى كل حاجه."
archived = "2010-02-25"
capture_url = "https://web.archive.org/web/20100225095718/http://www.20at.com:80/banat/only-for-men/14609-2009-12-27-15-48-47.html"

[[comments]]
order = 63
subject = ""
author = "YouKa Parkour"
posted = "2010-02-24"
text = "اولا نظريه الشبشب:<br />النظام برضو حلو يا رجاله , والمفروض ان شبشب الحمام ده بتاع الحمام بس عشان مينقلش الجراثيم للشقه كلها سيبك من الجراثيم اهو شبشب الحمام ده هيريحك انت ليه بقي عشان لما تتوضى الشبشب هيبقى مبلول هتخرج بيه فى باقى الشقه هتبهدلها مراتك هتقولك نضف مكان مبهدلت ,اذن معنى ذلك ان هيبقى فى شبشب بيت و شبشب خروج فقط<br />اقنعنى انك قبل متتزوج كنت كل مصيف بتاخد من والدك فلوس بحجة انا رايح مصيف و لازم اجيب شبشب والحج يقولك ما انت عندك واحد تقوله لا ده حاجه والتانى ده بتاع الخروج<br />ثانيا نظريه الفوطه:<br />النظافه من الايمان يا رجاله , مفيهاش حاجه لما يكون فى فوطه لكل حاجه اهو الفوطه اللى بتتحط على المخده دى ليها كذا ميزه ليك طبعا,1-المخده مش هتتوسخ ومراتك تقولك عاوزه انجد او انزل تاكى اشترى مخدات جديده,2- مراتك مش هتقولك اصل كيس المخدخ اتوسخ وانت اللى وسخته اتفضل اغسل الغسيل وبالتالى هتنشره ,اهى الفوطه رحمتك من توفير فلوسك و توفير مجهودك اللى كان هيضيع فى الغسيل."
archived = "2010-02-25"
capture_url = "https://web.archive.org/web/20100225095718/http://www.20at.com:80/banat/only-for-men/14609-2009-12-27-15-48-47.html"
