[[comments]]
order = 19
subject = ""
author = "Noha"
posted = "2009-12-28"
text = "اقتباس مهندس مصري اعزب:<br />انا شايف بصراحة انك متحامل تحامل كلي على الست المصرية احسن زوجة في الدنيا في رأيي الشخصي<br />يا اخي واي المشكلة اما يبقى البيت نضيف لدرجة الاهتمام بالتفاصيل اللي انت شايف انها تافهة او صغيرة<br />العملية كلها في انك تتعود على عمل الحاجة الصح وخلاص<br />وبمجرد ما تتعود عمرك ما هتسمع اي تعليق على اي حاجة<br />وموضوع المفروض تساعدني دي حاجة عادية جدا والنبي عليه الصلاة والسلام كان بيخيط ثيابه بنفسه واحنا يعني بنرمي الطبق عالارض ومبنشيلوش<br />كتر خير كل ست مصرية حمالة أسيه وصابرة وراضية<br />وفي النهاية اعتب على الست المرية الخلق الضيق والصوت العالي<br />يعني ممكن توصلي اي رسالة انتي عايزاها في الدنيا بالهدوء والاسلوب الانثوي الناعم اللي يضحك على اي راجل في الدنيا<br />وربنا يوفق الجميع<br />بجد ربنا يجازيك كل خير على كلمه الحق الى قولتها"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229123725/http://www.20at.com:80/banat/only-for-men/14609-2009-12-27-15-48-47.html"

