posted = "2010-01-04"
text = "موضوع زى الزفت و انتا انسان تافه اصلا علشان تتريق على الزوجه المصرية اللى انا شايفها احسن زوجه فى الدنيا و بتضحى فى مواقف كتير علشان زوجها و انا معاك ان صوابعك مش زى بعضها و فيه بعض الزوجات مصرية بتبقى حياتهم نكد لكن مين قالك ان كل الرجاله كويسين و ملايكه؟ كل حاجة هتلاقى فيها الكويس و فيها الوحش زى ما فيه حريم ملايكه و رجاله ملايكه فيه بعض الحريم النكديه و بعض الرجاله المهمله و اللى مش رومانسيه فى تعاملهم مع زوجاتهم. و بعدين يا أخى مين قال ان فيه اى حاجة فى الدنيا كلها سئ او كلها حلو؟ كل حاجة فيها الكويس و فيها الوحش. انتا انسان تافه و شكلك بتحب تعيش زى الحيوانات تعمل حمام مطرح متحب - تاكل مطرح متحب - تتكاثر مطرح متحب - انسان مقرف"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123082303/http://www.20at.com:80/banat/only-for-men/14609-2009-12-27-15-48-47.html"

