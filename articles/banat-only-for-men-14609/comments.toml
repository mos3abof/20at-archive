text = "انا بنت و موفقه جدا على الكلام دا كله فعلا الست المصرية بتعمل كده و فعلا الرجل بيتغاظ بس نرجع و نقول هى مش جبارة علشان دا كلام دينا العظيم النظافة من الايمان فكنها بتعقب على دا لان الدين ادها الحق دا و لان الراجل بيشوف نفسه ملاك<br />لكن لو التزم بالنظافة معتقدش انها هتعمل كدا و بخصوص المشاركة اللى مش عجبة الرجاله العبقرية انت احسن من اشرف الخلق صلى الله عليه و سلم كان بيساعد زوجاته و انشاء الله الراجل المعاصر اشد انشغلا من اشرف الخلق و مغير الامه و سيدنا عمر راضى الله عنه كان شديد فى الحق و معتقدش ان فى دلوقت حد ممكن يبقى حاجة تذكر جنبه و كان بتحمل زوجته فى وقت غضبها.و دا مش محاسب او دكتور دا حاكم دولة اسلامية!!!!!!!! !!!!<br />مش الموضوع زوجة مصرية و زوج مصرى الموضوع الندية"
