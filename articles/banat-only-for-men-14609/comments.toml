author = "RaZaN"
posted = "2009-12-29"
text = "يا جماعة الموضوع ماهوش مستاعل كل الكلام ده<br />كل ما في الموضوع ان اللى كتب الموضوع بيناقش و المفروض اننا نستفيد و ناخد الجانب الاجابي عنه<br />مش كل من هيقول كلمة ولا حاجة هناخدها على نفسنا<br />في مثل بيقول \"اللى على راسه باطحه\"<br />انا شايفة انه موضوع جميل قوي و مش كل الستات كده بس الاغلبية و ان كان ع السورية و لا اللبنانية ولا غيرهم في منهم من نفس النوعية دي<br />احنا في الاول و الاخر بشر…<br />و على فكرة يا بسنت هدى شوية من العصبية اللى انتي فيها احنا بنات و من حقنا ندافع و نرحب باي تعليق لاي شاب برضه هم ليهم راي<br />شكراا لجريدة الدستور و ميرسي لمحمد"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229123725/http://www.20at.com:80/banat/only-for-men/14609-2009-12-27-15-48-47.html"

