posted = "2009-12-27"
text = "قال كاتب ينقلع يكتب في بيتو ويحتفظ بتفهاته لنفسه واي واحد متزوج زوجة نظيفة يحمد ربه على النعمة والوحدة مننا تتعب عشان بيت نظيف وغير محاصر بالجراثيم واحنا مانعيد تربيتهم بس عايزين نكون نظاف في بيتنا قبل الشارع ولو الراجل ماكان نظيف وكان متزوج الناس مش حاتعيب فيه بس حاتعيب في زوجته اللي معاه عشان هيا اللي بتهتم فيه واول حاجة حايقولو مش نظفية وياسيد التزم بالنظام وازا جات ع الشباشب اكرمكم الله ايت ست تستحمل تخل الراجل اللي بيقضي نص يومه في الشارع ويدوس على بلاوي لا ويكمل يتمشى بيه في البيت هوا اللي ناقص مو عاجبك روح فارق شوفلك معفنة مع اني اشك افي الزمن دا في ست مش نظيفة وانا شخصياً اول سنة عذاب مع زوجي لحد ماتعلم وصار مقدر بعد الواحد مابيسمع من امراض وخنازير وقرف … بنات خلكم زي ما انتو وانا معاكم بضم صوتي ع النتن دا ادولو علا دماغو والله يسلم البطون اللي جابتكم من جد بنات رجال الله يسعدكم … وسوا ارفعوا راية النظافة على الرجالة واللي مش عاجبو يقعد عند مامتو احنا مش شغالات عند حد واللي بنعملوا دا من اصلنا مش اكتر"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229123725/http://www.20at.com:80/banat/only-for-men/14609-2009-12-27-15-48-47.html"

