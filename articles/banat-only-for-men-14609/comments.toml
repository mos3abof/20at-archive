[[comments]]
order = 24
subject = ""
author = "kitty cat"
posted = "2009-12-28"
text = "مع احترامى لكل الموجودين ولكل الرجال وياريت البنات ميزعلوش منى بس بجد مش كل البنات وحشين قوى كدا وبيتعاملوا مع ازواجهم بالطريقه دى انا بجد معترضه على الكلام اللى بيظهر ان البنات مسيطره على جوزها وانه بيكون متجوز الهضبه او وحش الشاشه البنت معروف عنها الحنيه والحب والحنان والعطف اكيد مش فى كل الاوقات احيانا بيكون ضغط الشغل والاولاد والحياه بيخليها تتعامل مع جوزها بطريقه ناشفه شويه بس بعد كدا بتعرف غلطها وبتعتذر …وياريت ان الرجاله متنساش ان اساس وجودهم هيا المراه ويتعاملوا ويكلموا عنها باحترام شويه وميمنعش ان يكون فيه شويه تقدير …وصباح الخير"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229123725/http://www.20at.com:80/banat/only-for-men/14609-2009-12-27-15-48-47.html"

[[comments]]
order = 25
subject = ""
author = "datshy"
posted = "2009-12-28"
text = "الكلام اللى انت قلته ده ضدك مش ف صالحك يعنى انا مش متعاطفة معاك بالمرة لان انت فى كلامك السابق كانك بتقول لنا ايه الفرق ما بين شقة العازب و المتزوج. ولو ان فيه بعض التفاصيل السابق ذكرها مبالغ فيها زىمثلا حكاية غسيل المواعين دى… طبعا لا دى مش مفروضة على الزوج لكن المطلوب منه انه لما يشرب ف كوب او ياكل ف طبق انه ياريت ميسبهوش على السجادة بحيث ان الى داخل و الى خارج يخبط فيه ف يدلق باقى الى فيه على السجادة ، تتبقع و تفضل علامة مميزة تفكرك ب الكسل الشديد اللى سيادتك بتعانى منه لان المطلوب منك بس انك ترفعها من على الارض وتدخلها المطبخ للمدام علشان تغسلها بمعنى أدق ان الى مطلوب من الزوج هو المحافظة على بيته مش المشاركه ف الاعمال المنزليه و باكررها تانى بيته بدل ما هو بيشتكى دايما من حاجة واحده هى المصاريف ف أولى بيه انه يحافظ على حاجته.<br />وعلى فكره لو انت مش مقتنع بكلامى فاحسنلك متتجوزش و تبهدل بنات الناس معاك…"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229123725/http://www.20at.com:80/banat/only-for-men/14609-2009-12-27-15-48-47.html"

