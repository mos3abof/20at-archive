text = "اولا مامتي مش مصريه ثانيا لما تتكلمي مع حد حاولي تحترميه (ماهر ده) ثالثا كل البنات العرب بيموتو في الشباب المصري رابعا مين قالك ان مصر مفيهاش رجاله (انتي جربتي؟)<br />اولا موضوع ان مامتك مش مصريه ده ميدكش الحق انك تكلم بالاسلوب ده ع البنات لا وداخل الموقع عشان تتكلم وحش وخلاص<br />ثانيا انت باحترامك لنفسك واللى حوليك تفرض انهم يحترموك<br />بدل ماتقعد تقول احترمونى احترمونى.<br />ثالثا انا بعرف اتعامل مع كل واحد كويس جداا مش هتيجى تقولى اتكلم معاك ازى<br />رابعا انامجعمتش وقولت ان مصر مافهاش رجاله طبعا لا ولاد بلدى االلى ابوهم وامهم مصرين جدعان ورجاله بس دى مش اغلبيه<br />فى ناس كتييييير تافهين ومعندهومش اخلاق وبيرمو كل حاجه ع الستات سبب طفشان اجوازهم النظافه اللى بقيت عيب دلوقتى وحاجه غريبه وسبب عنوستهم اللى هو اصلا راجع لربنا ف الاول وف الاخر دى حاجه اسمها نصيب ع فكره"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123082303/http://www.20at.com:80/banat/only-for-men/14609-2009-12-27-15-48-47.html"

