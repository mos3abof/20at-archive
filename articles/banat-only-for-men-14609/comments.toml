author = "زوجه حديثه لرجل حنون"
posted = "2009-12-28"
text = "اولا يا استاذ محمد فتحي ,, انا اشفق عليك من الهجووووووووووو وووووم ده ,, زنقت نفسك يا ولدااااااااااه ,,<br />اتمنى من ربنا انك تلاقي بنت الحلال وتتجوز وتعيش مبسوط وبعدين تبقى تضحك على المقال دي وخلاص ,, بكل بساطه الحمد لله انا لسه جديده ف الجواز واتمنى ان جوزي يفضل حنين وميتغيرش ابدا واتمنى انا كمان اقدر احافظ على كل حاجه ف بيتي وكمان لجوزي وطول ما انا حاسه انه بيساعدني من غير ما اقوله وكمان لما اقوله وهو مش مضايق بردو هكون حريصه على راحته, لان ده واجبي زي ما هو واجبه انه يساعدني ,, اومااااااال سموها شركه ليه لان كل اللي فيها بيشتغلو علشان تنجح ومش عيب حد يعمل شغل التاني المهم ان كل واحد مخلص وربنا يبارك ف الحياه اللي فيها تعاون ,, على فكره يا جماعه في اختراع اسمه رامو , دي مكعبات بيتحط في الكومبنيشن مع الميه ومش لازم خالص تغطو الحمام لان ريحته هتكون كويسه ومتعقم كمان, الاهم بلاش النقط اللي بره على القاعده \" عدم الامؤاخذه ."
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229123725/http://www.20at.com:80/banat/only-for-men/14609-2009-12-27-15-48-47.html"

