text = "باشا<br />ماهو انت لو مريحها و جايبلها خدامه و جايبلها مكنسه اخر موديل و جايبلها تليفزيون خاص ليها ف المطبخ و مكفيها ماديا مكنتش هتقولك ساعدنى ولا هتقولك متقلبش القنوات<br />الرك عليكو يا فندم الراجل لما يسعد مراته هى تسعدو<br />باللى بتتكلم على اللبنانين و السوريين شوف هو بيعملها ايه عشان يخليها مش شايله هم نضافه و ترتيب لكن انتو يا رجاله مصر اللى كسالنين ومش مكفيين بيوتكم ماديا كويس و بالتالى الست بيبئى عليها عبء النضافه لوحدها"
