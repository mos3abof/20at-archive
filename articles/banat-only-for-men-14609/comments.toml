text = "كلامك اللى انت قلته مافهوش اى حاجة تعيب الزوجة المصريه بالعكس انت بتقول انكم من غير زوجة سورى ياعنى عايشين حياة فوضى ومش نظيفه واشبه بالقرود زى ما انت وصفت نفسكم<br />يالا تحمدوا ربنا وكل ما تشوف بنت انحنى لها ومتنساش اول ماتتجوز تيجى وتغير كلامك .<br />وانصحك انك تتبع التعليمات والنظريات اللى انت كتبتها عشان تعيش يابنى بدل ماترجع بيتكم بشنطة هدومك"
