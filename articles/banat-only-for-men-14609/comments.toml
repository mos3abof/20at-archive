text = "انا بنت وفعلا فى ستلت كتير بتعمل كده بس انا شايفه ان المسأله حكاية تعود مش اكتر يعنى (جوزك على ماتعويديه) يعنى كل الحاجات اللى قلت عليها دى بتبقى ممله فى الاول بس بعد كده بتبقى عاديه جدا ومش بيحس بيها وممكن كمان هو شخصيا اللى يعلمها لاولاده خاصة انه سلوك حضارى ومهم ان كل شخص يعمل كده بس بدون افوره ميرسى"
archived = "2009-12-30"
capture_url = "https://web.archive.org/web/20091230122427/http://www.20at.com:80/banat/only-for-men/14609-2009-12-27-15-48-47.html"

