text = "يضيع الاقصى ويبنى فوقة كنيسة او المعبد اليهودى المزعوم - ماشى<br />الجيل دة جفت الدماء والشهامة والنخوة فى عروقة من الجوع والحاجة<br />وتوقعوا اى شىء<br />وحتى لو تحركت القوات اليهودية واخذت الحرم فى مكة والمسجد النبوى فى المدينة محدش هيفتح بقة وكل واحد هيقول وانا مالى هو كان بتاع ابويا<br />يا عم صحيح واحنا مالنا هو كان بتاع ابونا<br />ولو جات قوات فى ميدان التحرير برضة واحنا مالنا هى كانت بلد ابونا<br />خلاص<br />مالناش فيها حاجة تبقى تولع بجاز<br />للبيت رب يحمية"
archived = "2009-10-11"
