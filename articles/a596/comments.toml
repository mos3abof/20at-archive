[[comments]]
order = 7
subject = "مكسوفة"
text = "الظاهر الموقع كله اتطور إلا مشكلة التعليقات إلي بتروح مواضيع تانية ، أنا بكتب التعليق دا وأنا مش عارفة هيروح فين<br />ياريت معلش المشكلة دي يكون لها حل<br />لأنها بتسد نفس الناس عن التعليقات<br />وباقول لقيصر : إكادمية ولا شطرنج ولا حفرة حتى أحسن من قعدة البيت ربنا مايحكمها على حد<br />أدينا عايشين ، زي قلتنا ، عدد زايد على الدنيا<br />ربنا يفرجها من عنده<br />إلا بالحق ، أنا كنت بقرأ من يومين رواية (رد قلبي) ليوسف السباعي ، كنت بس عيزه أقول : التغيرات الفظيعة اللي حصلت في دنيا البطل مش ممكن تحصل لحد تاني ؟؟ ولا دي من أوهام الكتاب ؟؟<br />ياريت ألاقي حد يفهمني"
archived = "2004-11-03"
capture_url = "https://web.archive.org/web/20041103000422/http://www.20at.com:80/article.php?sid=596"
