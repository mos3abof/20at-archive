[[comments]]
order = 2
subject = "وائل عباس"
text = "تعالوا نضحك سوا<br />فيما يلي مقتطفات من دستور بلدنا الحبيب اللي بيكفل الوظائف للشباب وكمان بيديهم اعانة بطالة ... اه والله هو ده اللي مكتوب في الدستور ... مش عارف ده دستور طبعوه للناس ولا طبعوه علشان بتوع اللب والسوداني يعملوه قراطيس:<br />المادة (13)<br />العمل حق وواجب وشرف تكفلة<br />المادة (14)<br />الوظائف العامة حق للمواطنين<br />المادة (17)<br />تكفل الدولة معاشات العجز عن العمل والبطالة والشيخوخة للمواطنين جميعا ، وذلك وفقا للقانون.<br />المادة (7)<br />يقوم المجتمع على التضامن الاجتماعي.<br />المادة (8)<br />تكفل الدولة تكافؤ الفرص لجميع المواطنين.<br />للاسف ما كتب في هذا المقال ظاهره الرحمة وباطنه العذاب ... فهو يعفي الدولة من مسئوليتها نحو ابناء مصر المتميزين كل على حسب علمه وخبرته ... ويتجاهل الكوسة والواسطة وانعدام تكافؤ الفرص ... والا فلتلغى مجانية التعليم والا ما فائدة ان يتخرج مهندس ليعمل مهندس مبيعات ومحامي ليشتغل فراشا في مكتب محاماة وطبيب ليعمل مندوب ادوية وطبيبة لتعمل مربية اطفال ومحاسب ليعمل على بسكلته في بيع اللبن ... الخ"
archived = "2004-11-03"
capture_url = "https://web.archive.org/web/20041103000422/http://www.20at.com:80/article.php?sid=596"

[[comments]]
order = 3
subject = "لمبة محروقة"
text = "حلو أوي الموضوع دا<br />وجالي في وقت ايه<br />فاتحة مواقع التوظيف كلها بادور على شغل<br />بالمناسبة دي ياريت بقى اللي يعرف مواقع مفيدة يقول عليها الله يخليكم<br />وباقول للمعلق الرائع وائل .. فين البلد اللي حاطه القوانين دي واحنا نروحها صاروخ<br />دي بجد لو موجودة علخريطة أصلا كانت كل الناس هاجرت لها<br />ايوة صح على سيرت الهجرة<br />محدش يعرف مواقع عن الهجرة<br />وسلامتك يلي في بالي"
archived = "2004-11-03"
capture_url = "https://web.archive.org/web/20041103000422/http://www.20at.com:80/article.php?sid=596"

[[comments]]
order = 4
subject = "جهاد"
text = "الكلام سهل لكن الفعل صعب<br />اصل المشكلة لو عامة او ان الكل مش لاقى وظيفة تناسب مؤهلة كلنا هنشتغل اى شغل .. لكن الصعب اوى ان بعد تعبى وكل سنين دراستى يجى واحد اقل منى ويخلوة بالعافية احسن منى...<br />الموضوع حيوى اوى وبداية موفقة ياهوبا و يا ريرى"
archived = "2004-11-03"
capture_url = "https://web.archive.org/web/20041103000422/http://www.20at.com:80/article.php?sid=596"

