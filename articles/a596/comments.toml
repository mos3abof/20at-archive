[[comments]]
order = 0
subject = "زهور"
text = "شكرا على الموضوع الرائع لأنه مهم جدا<br />أنا بصراحة اتعودت إني أدور على حاجه نافعة اعملها تشغل وقت فراغي ولان البلد اللي أنا عايشه فيه سهل انو الواحد يروح يتدرب في معهد أو مدرسه (على حسب مش الكل بيرضى )يا خد خبرة وكمان سهل إني ادخل في عمل تطوعي في مؤسسات خيريه وشويه شويه بيبقى وظيفة ثابته<br />وبكده الخبرة كثرت وبقيت السيرة الذاتية مليانه الحمد لله بأعمال وخبرات وشهادات ،وبقى عروض وفرص من الأعمال في مجال عملي وغيره بتيجي وبتروح<br />واعتقد انو الإنسان الفعال يجب أن يعمل من اجل إن يضيف في حياته أعمال مشرقه ولا أن يضيف إلى جيبه فقط<br />(طبعا جيبه مهم مش هننسى كده لان الظروف متسمحش ان ننسى )"
archived = "2004-11-03"
capture_url = "https://web.archive.org/web/20041103000422/http://www.20at.com:80/article.php?sid=596"

[[comments]]
