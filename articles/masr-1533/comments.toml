text = "انا عايز اقول حاجه بس محدش يفهمني غلط , مش عايزين نقول ليه الاموال والممتلكات بتتصادر لان بصراحه وطبيعي جدا انها تتصادر قانونا لان الجماعه محظورة وطول ماهيه محظوره لازم ممتلكاتها تتصدر ونشاطها يتوقف.<br />لان تاجر المخدرات عشان نشاطه محظور ممتلكاته بتتصادر .<br />انا مش بشبه الاخوان بتجار المخدرات لأ طبعا دول ناس محترمين وانا بحترمهم جدا وبكرر تاني محدش يفهمني غلط , بس انا بتكلم ع المبدأ نفسه.<br />فبدل مانناقش ليه الممتلكات بتتصادر , نقول ونتناقش هي ليه اصلا محظوره.<br />لان مش معقول ندعي اننا بلد ديمقراطي<br />ويخرج علينا كل يوم اعضاء وقيادات الحزب الوثني اللاديمقراطي ويغنو علنا بالاسطوانه المشروخه بتاعه الديمقراطيه.<br />لو احنا فعلا بلد ديمقراطي , نسيب الناس دي تشتغل وتعمل اللي هيه عايزاه (في حدود الشرعيه) والشعب هوه اللي يقرر ويختار اللي هوه شايفه بكل حريه , بس تقول لمين وتكلم مين \"ده احنا في مصر\"<br />وبعدين ده كل رجال الاعمال الفاسدين كانو من الحزب الوثني امثال \"ممدوح اسماعيل ,هاني سرور ,ابراهيم نافع ,ولسه ياما نشوف....\"<br />وللحديث بقيه مادام في العمر بقيه<br />http://zimoo.blogspot.com"
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044543/http://masr.20at.com:80/article.php?sid=1533"

