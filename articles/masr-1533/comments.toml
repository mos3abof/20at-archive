order = 0
subject = "الصبروان"
author = "فهد الا سلام"
posted = "2007-02-02"
text = "كلما قرات هذة الا خبار اتا كد انى اعيش فى عصر الطغاة عصر الكفر والا لحاد عصر الصوت الواحد صوت الجبابرة ان كانت الجماعة تغسل امولاة فى مصر فكيف نبناس تعلم انها فى اى لحظة رهن الا عتقال او الا غتيال وتستثمر امو لا ه فى هذا البلد الا خوان جمعوا امو لهم من حلال مش عارف هما الا خوان دول حرامية ولا بلطجية احنا بنتكلم على فية مثقفة الى ابعد الحدود دكتارة مهندسين محامين رجال اعمال يعنى ناس ليها نظام ولا يمكن ان يكزنوا بيعملوا حا جة غلط ويسيبوا فلوسهم كدة تسرقة الحكومة فكلر غريب فعلا من حكومة غا شمة ومش عارف اى قانون بيحكوا عنة المحقق يبع الحكومة القاضى وما ادرك ما قا ضاة اليومين دول وهم بر ضة تبع الحكومة والا علام الحكومى تبع الحكومة وكل شى فى البلد مسيطرة عليه الحكومة طيب يا اخونا الناس دى هتدفع عن نفسة ازى يقولك جما عة محظورة والله بل انتم المحظورين سيبوا الناس دى تقول ريها وبعد كدة الناس هى اللى تعبر عن الى هى عاوزه دة لو فية ديمقر طية حققية والشعب هو اللى يحكم مش شلة المنتفعين ان شاء الله من بعد الضيق فرج وان الله لا يضيع اجر من احسن عملا ومعا كم الله يا ابناء رسول الله صلى الله علية وسلم"
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044543/http://masr.20at.com:80/article.php?sid=1533"

