text = "بعد ما استيت كل التعليقات دي ..خلال يومين بس ...<br />واللي الحقيقة .. شهد إنها شهدت قدر كبير جدا جدا من الاتزان والموضوعية ...<br />اللي أقدر أقوله ... وحابب أقوله ...<br />بنحب البلد دي ....<br />شباب الإخوان المسلمين ...<br />\"بين قوسين مش إحنا بس لكن الكلام دلوقتي عن شباب الإخوان\"<br />وبرضه مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
