[[comments]]
order = 40
subject = "عادي"
author = "إخوانجي"
posted = "2007-02-08"
text = "فعلا الأموال المصادرة من الإخوان بالبلايين ..<br />الأخ عبد المجيد مشالي كان رئيسا لفرع i2 في مصر وعضوا منتدبا للشركة وشريكا في الفرع الشركة المصري .. وتمت تصفية حساباته من الشركة .. وتم طرد حوالي 40 من الإخوان يعملون في نفس الشركة ..<br />لكن .. نحن الإخوان راضون .. هو ثمن لا من دفعه للنصر .. بعنا أموالنا لربنا وقبلها نفوسنا ونسأل الله القبول .<br />نرى من يخسر عدة ملايين في صفقة يصاب بالأزمات القلبية .. وربما يموت .. وأستاذنا الحبيب يوسف ندا صودرت كل ملياراته دفعة واحدة .. تحول من رجل يمتلك بنكا إلى محاصر في محيط 2 كيلومتر .. لا يستطيع الخروج منها .. والرضا يملئه .. وسيبقى الإسلام هو الحل رغم أنف الحكومة .. ورغم أنف مبارك .. ورغم أنف كل من يكرهون الإسلام ."
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212211222/http://masr.20at.com:80/article.php?sid=1533"

[[comments]]
order = 41
subject = "شعب مش عارف هيفهم امتى"
author = "افضلوا اكدبوا على نفسكم كويس"
posted = "2007-02-09"
text = "معلش معلش هدوا أعصابكم .. انا مواطن مصري عادي وبقول ان كل حاجة واضحة زي الشمس ... والكلاب الحرمية بتوع الحزب الوطني يبطلوا كدب على نفسهم ويسكتوا ..<br />العريان يروح يتغطى .. مش يعري نفسه اكتر ,,<br />عاوزززززززين مصر تكووون ام الدنيا وده مش هيحصل الا لما يرجع عهد الفاروق عمر بن الخطاب ..<br />اما حكاية ان الاخوان يفضلوا جماعة دينية ويسبوهم من السياسة ..<br />مين الغبي اللي بيقول الكلام ده .. اما اللي الرسول كان بيعمله ده اسمه ايه ..<br />صلح الحديبية .. الرسل او السفراء اللي اتبعتوا للحبشة والروم والفرس والمدينة وغيرها .. تنظيم الجيش وتوحيد الشعوب (المؤاخاة بين المهاجرين والانصار) أسس التجارة اللي مكتوبه في الإسلام وغيرها<br />اللي فاكر أن الإسلام رهبنه او عباده بس يشوف له اسلام غير اسلامنا ..<br />سيدنا عمر بن الخطاب هو اول واحد عمل جهاز للشرطة وهو اول واحد عمل دوواوين(وزارات) وهو اول واحد حط قواعد ونظريات للسياسة الإسلامية ..<br />أما الديموقراطية = الشورى عند المسلمين<br />المسلمين طبقوا الديموقراطية من قبل ما تكون في حاجة اسمها امريكا..<br />وبعدين هو دلوقتي الحزب الوطني يحكمنا .. ماشي .. يزلنا .. ماشي .. يسرقنا .. ماشي .. يقتنلنا .. ماشي ..<br />لكن الإخوان اللي عاوزين ينشروا منهج ربنا في الكون دول اللي نقول عليهم لا .. وبقى الحكم ليهم حرااام<br />تخيل واحد عايش حياته بيحفظ عيال قرآن في المسجد .. ويكلم الناس عن الصوم والصلاة ومش معلق على رقبته يافطة اسمها الاخوان علشان الدعاية ..<br />ده يبقى عاوز الحكم ..<br />طيب ما في طريق للوصل للحكم اسرع ومش فيه اعتقالات يتمسح في اليهود وامريكا او الحزبي الحاكم .."
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212211222/http://masr.20at.com:80/article.php?sid=1533"

[[comments]]
order = 42
subject = "فيه فرق"
author = "مبارك قتل السادات المرشد لم يقتل السادات"
posted = "2007-02-09"
text = "مبارك نهب البلد المرشد يدفع من أمواله الجماعة لخدمة البلد والشعب<br />مبارك عايز يورث الحكم للوطى شاذ مدمن إللى هو جمال مبارك الحقير إللى لو شالوا إسم مبارك من إسمه محدش ها يعرفه ولو إن إسم مبارك هو برضوا عار عليه المرشد عايز مصر تبقى حره من عبودية مبارك ولا تعبد إلا الله<br />يا مبارك الشعب كله بيقول لك لا"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212211222/http://masr.20at.com:80/article.php?sid=1533"

[[comments]]
order = 43
subject = "اتق الله يا أخ \"في فرق\"...."
author = "واحد \"وطني\"..."
posted = "2007-02-09"
text = "أخي الفاضل أنا معك في كل اللي قلته ولكن<br />أبدا لم يكن هذا الأسلوب اللاذع الذي يعتمد علي التجريح في الآخر هو أسلوبنا, ولم يكن مبدأ السب و الشتم هو مبدأنا بل هو مبدأ الضعفاء ونحن و الحمد لله لسنا من هؤلاء فأناشدكم إخواني التزام آداب الحديث و جزاكم الله كل خير<br />\"ألا إن حزب الله هم الغالبون\""
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212211222/http://masr.20at.com:80/article.php?sid=1533"

[[comments]]
order = 44
subject = "إلى إدارة الموقع الكريم"
author = "هادى الحبشى"
posted = "2007-02-11"
text = "إلى إدارة الموقع الكريم<br />نرجوا إتاحة الفرصة والتعبير الصادق عن كل المعارضة فإنتم تهاجمون المعارضة فى الوقت الذى تفسحون فيه الفرصة كاملة للحزب الوطنى ولمبارك وإبنه<br />نرجوا تطهير الموقع من اللينكات القذرة التى تضيفها واحدة عجزت عن فرض سطوتها على الموقع فتحاول إلهاء الشباب بهذا الفساد الحقير وهذه السياسة البلهاء<br />نرجوا إتاحة الفرصة لكل المعارضة للتعبير عن أرائها فى هذا الموقع المحبب لنا كشباب والذى نجد فيه فرصة للتعبير عن رفضنا للفساد<br />نرجوا عدم الهجوم على الإخوان المسلمين حيث أنهم المعارضة الأكثر تأييداً من الشباب"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212211222/http://masr.20at.com:80/article.php?sid=1533"

[[comments]]
order = 45
subject = "جندل"
author = "خليل علي حيدر"
posted = "2007-02-11"
text = "ألا يلفت نظرك أن تكون جماعات \"الإسلام السياسي\" والتيارات الدينية، بهذه القوة، وأن تكون في الوقت نفسه بهذا الفقر والسطحية وقلة العطاء والإبداع، في مجالات الثقافة والفكر والرواية والشعر والفن والفلسفة والفنون؟ هل يعقل مثلاً أن تتأسس حركة \"الإخوان المسلمين\" عام 1928، قبل ثمانين سنة تقريباً، وأن تنتشر في كل العالم العربي، وتستقطب الرجال والنساء، والشيب والشباب، والبسطاء والمتعلمين، ولا تعطي الحركة للثقافة العربية مفكراً من عيار محمد عابد الجابري أو شاعراً ينافس أدونيس والقباني والسياب، أو كاتباً من طبقة العقاد وطه حسين، أو روائياً كنجيب محفوظ أو مبدعاً يقارع جبران خليل جبران؟<br />وبالرغم من الطابع الديني والتشريعي للحركة، فإنها لم ترفد الثقافة اللغوية والقانونية وعلم مقارنة الأديان والقواميس الموسعة بالعطاء والإبداع. ويكفي أن نقارن عطاء التيار الديني في مجال الثقافة والإبداع الأدبي والفني بالتيار الليبرالي أو القومي أو الماركسي، لنرى الفارق الهائل بين ما قدمته هذه التيارات للثقافة العربية وما قدمه تيار \"الإخوان\" وسائر الجماعات الإسلامية العربية لها!"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212211222/http://masr.20at.com:80/article.php?sid=1533"

