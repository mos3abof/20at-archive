[[comments]]
order = 5
subject = "مفيش إستثمارات بإسم الجماعة !!"
author = "محمد القط"
posted = "2007-02-02"
text = "الإخوان \"ككيان\" مش اغبية علشان يستثمروا في ظل نظان متربص وعنيف وغشيم...<br />أنهي عاقل من الاخوان يقدر يستثمر في مشاريع يعود ربحها للجماعة مع تاريخ المصادرات والتحفظ إلي تم عرضه في التحقيق..فإ^ستثمارات بإسم الجماعة فكرة انتهت بصدام الاخوان بعبد الناصر<br />مصدر تمويل الجماعة هو الاشتراكات الشهرية إلي تتراوح قيمتها من 3% : 7% من الدخل الشهري للافراد..<br />الاخوان ليسوا في حاجة لعمل استثمارات لتمويل الجماعة لإن اشتراكات الافراد مأدية الغرض وزيادة !!<br />الاعتقالات والمصادرة ليست شئ جديد على الاخوان وكمان النظام !!<br />سبب الاعتقالات هو موقف الاخوان من<br />1- التعديلات الدستورية 2-فلسطين والعراق 3- فساد النظام<br />حاجة مهمة ..الدكتور عبد الحميد الغزالي ليس استاذ للإقتصاد الاسلامي ولكنه إستاذ النظرية الاقتصادية وفروع اخرى آخرها وأقلها الاقتصاد الاسلامي !!!"
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044543/http://masr.20at.com:80/article.php?sid=1533"

[[comments]]
order = 6
subject = "الإخوان هما مصريين خالصين"
author = "هما الأخوان المسلمين دول يهود ولا أعداء دول مصريين من أغلى طبقات المجتمع وهم أساتذة الجامعات والمهندسين والكفاءات النادرة ومشاريعهم يجد فيها أبناء الشعب مصادر للرزق وهل فجأة أصبحوا إرهابيين ويزجون فى المعتقلات التى لم نراها فتحت لمن نهب خيرات مصر فى حساباته فى الخارج ولمن باع مصر ولمن زور الإنتخابات لصالحه 26 سنة ولمن أصبح إنفاقه هو وعائلته بالملايين على حساب الشعب ولمن يمتلك أبناءه المليارات من بيع مصانع مصر وشركاتها وطرد العمالة التى بها هل فعل الإخوان المسلمين شيء من ذلك أم أن وجودهم أصبح آخر حجرة عثرة للتعبير عن أعتراض الشعب على فساد الحاكم وعائلته والمنتفعين من ورائهم مبارك ترك برنامجه الوهمى الإنتخابى وإبنه سخر البرلمان واعضاءه المزورين وسخروا كل وسائل الإعلام لمحاربة طبقة تنال كل تأييد من الشعب وهم يفعلون ذلك لمعرفتهم وثقتهم بإن الشعب كله يرفض مبارك وعائلته وإبناءه الحرمية الفسدة"
posted = "2007-02-02"
text = "لكن مبارك وحزبة وعائلته اوصلوا الشعب لقمة السخط والكراهية لهم فماذا ينتظرون من بعد كل هذه الإعتقالات لقوم يحاربون الفساد ويعبرون عن آرائهم ويخافون الله وهم الأخوان المسلمين<br />يا ظلمة مبارك هو الذى فتح المعتقلات مبارك هو الذى أفسد مصر مبارك وعائلته هم الذين نهبوا خيرات مصر مبارك وعائلته هم العملاء ماسحى أحذية أمريكا وأسرائيل لضمان بقاؤهم الغير شرعى المبنى على القتل والتزوير والفساد<br />إتركوا الشعب هو الذى يعبر عن إختياره لإنه أدرى بمن أفسد مصر ومن يحارب الفساد والتوريث المرفوض هل يعقل أن يورث حكم لإبن شاذ ومدمن وسرق مصر ورصيده بالمليارات ويترك كفاءات مصر التى تريد أن النهوض بالشعب لو كان مبارك صادق فى أى شيء كان ترك ما يفعله بأبناء الشعب وكان نفذ برنامجه الكاذب الوهمى إللى زور الإنتخابات<br />اقرأ بقية التعليق .."
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044543/http://masr.20at.com:80/article.php?sid=1533"

[[comments]]
order = 7
subject = "حل واحد"
author = "الإخوان المسلمين ليسوا فى حاجة للدفاع عن أنفسهم ضد ما يفعله بهم مبارك وعائلته وحزبة وحكومته لإن الشعب يعلم جيداً لماذا يفعلوا ذلك ولكن الحل الوحيد هو"
posted = "2007-02-02"
text = "الثــــــــــــــــــورة على مبارك وحكمه الفاسد والقضاء عليه<br />لا حل غير ذلك وهذا ما أمرنا به الله كيف نترك رجل فى الثانية والثمانون قاتل ومزور وسرق خير الشعب ليستمر أكثر من ذلك فى فساده فى دولة كرمها الله وكرم شعبها<br />الحل هو الثـــــــــــــــــــورة على الفساد وعلى مبارك والقضاء عليه ولا حل آخر"
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044543/http://masr.20at.com:80/article.php?sid=1533"

[[comments]]
order = 8
subject = "دولة بلا قانون"
author = "جماعة الاخوان هى شىء ليس قانونى ولا نظامى ولكنهم اناس تحابوا فى اللة بالشعور ويسعون الى الاصلاح بين الناس ما استطاعوا وليست هناك كشوفات بالاسماء ولا عضوية ولا اشتراكات ولا يوجد اى شيىء تنظيمى اطلاقا"
posted = "2007-02-02"
text = "انة مكتب يضم بضعة افراد يعبرون عن راى قاعدة عريضة متدينة فى المجتمع ويتعاطف معها اغلبية الشعب واذا لم تكن كذلك لكانت اصبحت فى طى النسيان منذ تلقيها ضربات واعتقالات منذ عصر الملك فاروق وحتى يومنا هذا<br />بعض الحكام الضعاف يضربون المتدينون المسلمين ويعتقلونهم حتى يرضى عنهم بوش الصليبى والحبيبة كوندا<br />اما الذى اثار غضبى ليس الاعتقالات وانما مصادرة اموال مواطن مصرى ومنعة واولادة من التصرف فيها - تحت اى قانون يندرج هذا<br />خلاص ياناس ياعالم يا مصريين اللى عندة قرشين وشايلهم لعيالة يحطهم فى بنك خارج الدولة والا هيصادروهم ويمنعوكم من التصرف فيهم- وبطلوا مشروعات واستثمار لا يشفوكم بتصلوا فى الجامع يقولوا عليكم اخوان ويطلع حكم بمصادرة تلك الاموال<br />قرارات غبية وتنم عن السطحية والغباء الامنى اللى عايز يبين للكبار انة صاحى وبيشتغل"
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044543/http://masr.20at.com:80/article.php?sid=1533"

