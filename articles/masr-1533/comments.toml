[[comments]]
order = 10
subject = "عنوان"
author = "واحد مصرى حزين"
posted = "2007-02-02"
text = "اهوه شوفت يا عم فهد اديك قلتها ( كفر ) لما كنت بتحدثنى عن الحريه فى ظل الاخوان ، وانهم لو حكموا هيكون حكمهم حر و عادل ، كان قصدى على النقطه دى ، طيب الاخوان بيحكموا بشرع الله يعنى فكره المعارضه و تعدد الاراء لن تكون موجوده اذ كيف تعارض من يحكم - اوالمفترض انه بيحكم - بشرع الله ، ستكون كافر و مصيرك الله اعلم به ، بلاش دى ، يعنى مثلا افرض بعد ذلك جاءت قياده اخوانيه - و ده وارد ويحدث منذ عصور الخلافه و حتى اليوم - ابتعدت عن شرع الله و فسدت من سيكون هناك لمواجهتها ، مهى المعارضه هتنضرب اول باول بحجه الكفر و التكفير طيب مين اللى هيحكم ساعتها و هيفصل فى الموضوع ده ؟ هتقول لى شرع الله هو اللى هيحكم ، جميل طيب و مين اللى هيطبق الحكم ده ان شاء الله ؟ هيستلزم الامر بقى قيام جماعه مثلا اهل الشرع المسلمين المناهضه لحكم الاخوان المسلمين اللذين ضلوا ؟؟ ... طيب يبقى عملنا ايه ؟؟؟ وشكرا."
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044543/http://masr.20at.com:80/article.php?sid=1533"

