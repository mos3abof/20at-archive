[[comments]]
order = 12
subject = "تو ضيخ"
author = "فهد الا سلام"
posted = "2007-02-02"
text = "اخى العزيز اولا والله مش عاوزك تبقى حزين ثا نيا كلمة كفر هذة لا تعنى شرك با لله وانما هى كلمة اقولها عن الا سلوب الذى تتبعةالحكومة مع الجماعة وبعد كدة اى فية تحكم ولا حتى الجماعة ذات نفسها وفعلت هذا فهى تكون كفارة وضالة لا نى فى اى شى يوجد معا رضة حتى فى عهد الصحا بة راضوان الله عليهم ولكن انا اتكلم على اللا ستباد فى الراى واحتكار راى الا خر اليس هذا كفر وجا دلهم با لتى هى احسن فا نا لا اتهم احد بلكفر الذى هو شرك بالله فهى كلمة متدولة بس احنا عند العامة هى شرك بالله فالكفر لهو معانى كثرة الست مسلم وتكفر مثلا با لوثنية او الشيوعية اليس هذا كفرا وبعدين نعلم جيدا ان فى الحزب الوطنى علماء واطباء وكل فيات المجتمع بس ان كان قصدى ان الا خوان دول مش قطاع طريف لا هم فية من فيات الشعب يوجد بها جميع المجلات عمال وفيات وبعد كدة اتحدى لو فية سرقة او اختلا ف فى جماعة الا خوان انت عارف اية الى وصلنا للى احنا فية دة هو الحزب الوطنى ليست افكار الحزب نفسة لا القيادات والله يا اخى كنت اعمل مع واحد من هولاء وهو امين لجنة شباب ورايت السرقة بعينى والله اتذكر انها فى حرب العراق اى قبل ثلاث او اربع سنوات وكان طبعا فية معا رضة على مستوى مصر تعا رض الحرب وكان الحزب الوطنى على مستوى المحفا ظات يخرج وفود حتى يعبر الشعب عن رايه والله هذا الشخص كان يفتخرانه كسب 5الاف جنية من هذا المو ضوع وعملت معها اكثر من خمس سنوات ورايت ما لم تراه عين من سرقة وكذب من قيادات عليا فى هذا الحزب وللك مثل اخر هل اعطيت رايك فى انتخبات مجلس الشعب هل رايت ما حدث من الحزب نعم لا انكر ان كان هناك تجوز من الا خوان ولكن لماذا لا ن الديمقرطية غا بلية فى ظل هذا البلد الذى حباة الله وهو اعظم وطن فى العالم عندما يضهدك يا اخى احد فى مزل<br />اقرأ بقية التعليق .."
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044543/http://masr.20at.com:80/article.php?sid=1533"

