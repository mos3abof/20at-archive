subject = "قادمون قادمون"
author = "عشماوى"
posted = "2007-02-03"
text = "المستهدف الرئيسى هو الاسلام عن طريق الاخوان المسلمين .. كيف يقضون على الاسلام الذى وبفضل الله ينتشر وكما يقول شنوده بلسانه أن القاهرة وحدها تشهد يوميا أكثر من مائة حالة تحول من النصرانية للاسلام.. الخناق يضيق على الفساد والمفسدين من العلمانيين الملحدين والمحسوبين على الاسلام؛ وبفضل الله كلما ازدادت الهجمة على الاخوان ازداد الالتفاف حولهم والانضمام اليهم ولاننسى الثمانية وثمانون مقعدا رغم محاولات الريس المحروس وزمرته على بابا والأربعمائة ألف حرامى"
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044543/http://masr.20at.com:80/article.php?sid=1533"

