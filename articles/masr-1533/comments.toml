[[comments]]
order = 34
subject = "ليه كده يا دشومة العجوزة"
author = "عمرنا ما سمعنا الإخوان بيشتموا ولا هم سبابين بالرغم من قسوة ما يفعله بهم مبارك وإبنه لكنهم لم يحاولوا رد الإساءة بالإساءة وهذا هو سمو خلق الإخوان ولكن أن يفضحوا فساد مبارك وحزبة وحكومته فهذا ما أمرنا الله به ولو أعتبرتى أن محاربة الفساد هو فساد فهذا يتناسب مع ما تفعلونة فى مصر من نهب وفساد وعمالة"
posted = "2007-02-04"
text = "إنت تقولى لو مسكوا الإخوان ها يحلوها إزاى الم تسألى نفسك من سبب ما وصلت إليه مصر من فساد وفقر وبطالة وعمالة وإنحطاط اليست هذه إنجازات حكم مبارك الغير شرعى المزور فكون الإخوان يسعون إلى تغيير هذا الفساد رغم نهب أموالهم من الحاكم وعائلته كما نهبوا أموال مصر رغم المعتقلات التى يعتقلون فيها خيرة شباب مصر من الأخوان من أساتذة الجامعات والأطباء والمهندسين ورجال الأعمال أعتقد أن من يفعل ما يفعلونه من أجل مصر وخروجها من حجر الفساد المتعفن الذى وضعه فيها مبارك وعائلته ليورث الحكم لإبنه الغير كفء من يفعل هذا من الأخوان المسلمين يحق لنا أن نحملة على الأعناق ونؤيده ومهلاً فالأخوان قادمون قادمون بحب الشعب لهم ورفضهم لفساد مبارك وعائلته وغداً لناظره قريب."
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044543/http://masr.20at.com:80/article.php?sid=1533"

[[comments]]
order = 35
subject = "ربنا يحمي الاسلام منهم ومن امثالهم"
author = "مصري"
posted = "2007-02-05"
text = "ربنا يحمي مصر من الاخوان وغير الاخوان تجار الدين الذين لا يستحون من ان يتحالفوا مع الشيطان مش امريكا ولااليهود وهم بصراحة كالاخطبوط واليعوذ بالله رب العالمين مايعششوش في بلد الا مايجيبوا ضلفها والامثلة بالعالم امام اعيننا واقول لكم لستم اوصياء علينا دينيا وسياسيا لانكم مرضي وجهال وعميان القلوب ادعو الله العلي القدير المقتدر ان ينجي مصر واهلها منكم ومن امثالكم واعوذ بكلماته التامات من شر ماخلق وان يحصننا بعزته وجبروتة ويعصمنا بسر اسمة الاعظم منهم جمميعا انه نعم المولي ونعم النصير"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212211222/http://masr.20at.com:80/article.php?sid=1533"

