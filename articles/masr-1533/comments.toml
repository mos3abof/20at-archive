[[comments]]
order = 27
subject = "بالذمة ده واحد قلبة على البلد"
author = "علموا إيه الأخوان علشان يتعمل فيهم كده ويعتقل منهم كل يوم مبارك وعيلته عشرات ويصادروا مشاريع كان بيشتغل فيها ناس فاتحة بيوتها منها لو كان الأخوان كفرة ولا محتلين البلد يبقى مبارك معاه حق لكن دول خيرة شباب مصر وفخرها وناس عايزه تصلح فساد 26 سنة حكم فاسد نهب مصر كان من الأولى لهم أن يحاكموا من أفسد مصر ونهبها ونشر الفساد بها ولكنهم تحملوا من أموالها عبء إصلاح الفساد وتحملوا المعتقلات من أجل النهوض بالشعب ولكن ما يفعله مبارك فى مصر هو الفساد من نهب وسرقة وعمالة لليهود ومحاولة لتوريث إبنه حسبى الله ونعم الوكيل لإن فيه حديث عن الرسول عليه الصلاة والسلام أنا مش حافظة لكن معناه إن اللى يولى حد ولاية شيء وفيه حد أكفء منه بتحرم عليه الجنة"
posted = "2007-02-03"
text = "مستحيل يكون مبارك رجل مسلم أو حتى مصرى أصيل ده فعلاً عميل فاسد حرامى ويجب محاكمته على ما فعله فى مصر من نهب هو وعائلته وعلى تزويره الإنتخابات لإنه بيحكم رغم رفض الشعب له وعدم شرعيته فى الحكم يبقى كل إللى بيعمله ده باطــــــــــل وربنا المنتقم الجبار اللهم آمين اللهم أرنا فيه يوماً هو وعائلته وأخرجهم أذلاء فقراء من مصر ولا تمتعهم بما نهبوا اللهم أمين يارب العالمين"
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044543/http://masr.20at.com:80/article.php?sid=1533"

