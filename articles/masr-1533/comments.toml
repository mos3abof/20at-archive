[[comments]]
order = 17
subject = "مصر بتخرب خد لك قالب"
author = "وهدان"
posted = "2007-02-03"
text = "اختلط الحابل بالنابل... واتحط في سكتنا قنابل... تطلع تنزل بكره تقابل... بختك دا المكتوب في الغالب... مصر بتخرب خد لك قالب...ـــــــــــــ ــــــــــــ ـــــــ إن كنت موظف في الخدمة... او فلاح طالع في العتمة... او فقي سارح يقرا الختمة... راح تشرب م الحكم مقالب... مصر بتخرب خدلك قالب ـــــــــــــــــــــــــ لما الروم تخبز لك عيشك... والصين تعمل لك قراقيشك... ويهود تحبس تضرب جيشك... وتبات مغلوب مانتش غالب... مصر بتخرب خدلك قالب...ــــــــــــــــ وأما الحاكم يركب فوقك... بالسوط والعسكر بيسوقك... والإعلام بيبوظ ذوقك... ويحط دماغك في القالب... مصر بتخرب خدلك قالب...ــــــــ"
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044543/http://masr.20at.com:80/article.php?sid=1533"

