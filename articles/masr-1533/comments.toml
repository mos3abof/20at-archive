author = "واحد \"وطني\"..."
posted = "2007-02-05"
text = "نظراً لأن النعمة فاقت حدها<br />و لأننا مش قدها<br />و لأن فعلاً إنجزاتك<br />فوق طاقتنا نعدها<br />ولأننا غرقنا في جمايل<br />مستحيل هنردها<br />نستحلفك<br />نسترحمك<br />نستعطفك<br />نستكرمك<br />ترحمنا من طلعة جنابك<br />حبتين<br />عايزين نجرب خلقة تانية<br />و لو يومين<br />إسمع بقي<br />احنا زهقنا من النعيم<br />و نفسنا في يومين شقي<br />عايزين نجرب الاضطهاد<br />و نعوم ونغرق في الفساد<br />بيني و بينك حضرتك<br />دا شعب فقري مايستحقش<br />جنتك<br />أنا عارفه شعب ما ينفعوش<br />إلا شارون و بلير وبوش<br />عايز يجرب الامتهان<br />و يعيش عميل الأمريكان<br />يمد غازه لإسرائيل<br />ويومين كمان و يمد نيل<br />أهو يعني نشرب ميه واحدة<br />ندوب في بعض<br />ماء و ماء وماء<br />و نفض سيرة الانتماء<br />و بلاها نعرة وطنطنة<br />تبقي البلاد مستوطنة<br />متسلـــطنة بالسرطنـة<br />إيه اللي خدناه من الكرامة و الاباء<br />حبة خطب وكلام كلام<br />احنا رهنا ع النظام<br />و رضينا بخيار السلام<br />بخيــــــــــــار<br />حنسد عين الشمس بيه<br />علشان مايطلعش النهار<br />يطلع لمين<br />حبة معارضة مغرضين ؟!!!!<br />و حسب بيان السلطة<br />شلة مأجورين<br />يا عم فضك سيرة<br />وارضي بقسمتك<br />دا شعب مش فاهم أكيد<br />يلا اطرده من رحمتك<br />وإن كنت غاوي الحكم<br />خليك مطرحك<br />هاغطس و أقب و أعود<br />بشعب يريحك<br />راضي و عمره ما يجرحك.<br />أخرس و مابيسمعش<br />وأعميلك كمان عنيه<br />مش كل قرش يبص فيه<br />ما يقولش لأ ، وفين ، وليه<br />يضرب ينفض في السليم<br />و علي الصراط المستقيم<br />كل اللي يعرف ينطقه<br />عاش الزعيــم<br />يحيا الزعيــم"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212211222/http://masr.20at.com:80/article.php?sid=1533"

