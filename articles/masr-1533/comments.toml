[[comments]]
order = 20
subject = "سرقة الفلوس لن تغير النفوس"
author = "ياسر أبو عمار"
posted = "2007-02-03"
text = "العنوان فى البداية غريب ومش معبر عن الموضوع وانا عارف اللى حطه بس المهم النوضوع فكرته كويسة والتناول جيد،واتساءل مجددا عن المدعو فؤاد علام ،يا جماعة لماذ الحرص على استضافته رغم انه مجرم ومحترف تعذيب؟اكيد فيه خبراء امنيين محترمين -مش اكيد قوى الصراحة بس ممكن-بدال الشخص اللى بيدور على دور على كبر ده،فيه تصحيح كمان بالاضافة الى تصحيح روضة وهو ان الدكتور الغزالى مش عضو مكتب ارشاد ،ثم فيه ملاحظة تانية ،ايه علاقة الاستاذ مصطفى مشهور بالموضوع ؟ليه صورته متركبة مع صورة البنا؟ليه مش المرشد الحالى.<br />ما اريد تاكيده أن تلك السرقة للاموال لن تغير من قناعات الاخوان اطلاقا بل بالعكس سوف تؤكد انهم على الطريق الصحيح."
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044543/http://masr.20at.com:80/article.php?sid=1533"

