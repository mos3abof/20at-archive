[[comments]]
order = 12
subject = "نعم كل هذا بيض اعلان"
author = "تعلن جمعية البيض المصرية عن منحها البيضة الذهبية وذلك فى الفئات التالية:"
posted = "2006-05-06"
text = "بيضة الظهور الاعلامى:<br />1-عبد الله كمال<br />2-كرم جبر<br />3-جهاد عوده<br />4-تامر أمين<br />5-مش عارف ايه الليثى بس هو راجل بيتكلم فى السيننما<br />6-صفوت الشريف<br />7-نيرفانا<br />البرامج التلفزيونية:<br />1-البيض بيضك (البيت بيتك)<br />2-جميع زيارات واحاديث وجولات الرئيس<br />3-حديث المدينة<br />4-حالة خوار(حوار)<br />5-اعلانات وزارة الصحة بتاعة تحديد النسل<br />6-البرامج التعليمية<br />7-نشرة أخبار التليفزيون المصرى<br />هذا ونظرا للاقبال الهائل على الترشيح تم قفل الباب واقتصرت التصفيات على 7 مرشحين فى كل فئة"
archived = "2006-05-11"
capture_url = "https://web.archive.org/web/20060511172036/http://masr.20at.com:80/article.php?sid=223&PHPSESSID=ec33fa1cca537e412fdc8df4f551e653"

[[comments]]
order = 13
subject = "يا بيطه انت ...."
author = "انا قررت اخش المطبخ عشان ابسط البشاوات بتوعنا دول امال دي اول مره اطبخلهم بس المره دي افضل المطبخ يكون علي عباره سلااااااام جديده \" من باب الترفيه مش اكتر ..\""
posted = "2006-05-09"
text = "ابتدي الطبخ بالبيض ومكوناته وامانشوف حتدي علي ابيض ولاه اسوود<br />\"حسسسسني اوعي تحوشني\" بمناسبه عيد ميلاده سعاته اللي تجاوز عمره اكتر من اقدم فرعوني عرفه التاريخ حجبلك بيض ملون امال يا ملون انت \" احمر \" اللي هو مفروض علم مصر من فوق لونته بحرق دم شعب وام لضناها في عباره او قطر صعيد او قصر ثقافه , ابيض مفيش الاحمر بهت علي الابيض , الاسود لك الابداع يا ريس لوووووونك المفضل\" حتي لوني اسود لون نيلك يا مصر \" شرحه مع االاحمر باضافه كل الناس اللي حصله حاجه وكانت نتيجتها حزن وكابه فحتلبس اسود بس مش اكتر, شوفت انت بقي البيض زعل وطلع ريحتك اللي هي H2Sاللي هي ريحه البيض المعفن<br />اتفضل ياريسسس\" بالهنا والقفا \" ..<br />نيرفانا\"\" روح قلبي من جوا شكلها عايزه هااتوووووووووه اقصد جاتوووووووه اتفضلي يا ست نريفي\" يعني عصبي \" وبالهنا والقفا ومنتظرين نشوفك بتقدمي برنامج ترفيهي جامد كدا في الغالب عن الطبخ واوعدك اني اول واحده حتتصل وتقفل السكه , وحبعت لك\" البيض \"كمان امال بس غالي اوي اشمعني انتي تخدي كام ملطوش علي كلام ملطوش وهو حد لاقي بيض دلوقتي يلا خير فيكي مش اكتر ,<br />\" مبيد فوررررري \" تسمحلي اغتت علي سعادتك واحرجك وازنقك وادخللك الحمام أقصد المطبخ بتاعي المتواضع في العباره الجامده دي , بس انا قبل ما اخش يا انسه لابد لابد لابد اعمل برنامج جديد وتتفضل السيده<br />نورفونه \" بتقديمه معاياه وسوف يتكلم عن مشكله شم النسيم وعلاقاتها بالانفلونزا الطيور والطيور علي اشكالها تقع تقع من العشه علي الارض وارض الله واسعه في الغرب والشرق وتتخلص مشكله الشمال<br />اقرأ بقية التعليق .."
archived = "2006-05-11"
capture_url = "https://web.archive.org/web/20060511172036/http://masr.20at.com:80/article.php?sid=223&PHPSESSID=ec33fa1cca537e412fdc8df4f551e653"

[[comments]]
order = 14
subject = "كمال الشاذلي"
author = "احمد"
posted = "2006-05-14"
text = "كمال الشاذلي دا مش بس بيض دا كرتونة بيض فيها سته وتلاتين بيضه وكل بيضه فيها بيضتين من جوا ..وكل بيضه من البيضتين الموجودين في البيضه اللي موجوده في كرتونة السته وتلاتين بيضه فيها بياض من غير صفار يعني مليانه بياض .. واحده مهم مسلوقه والتانيه مقليه..المسلوقه فيها كتكوت ميت من سنه والمقليه ممششه...بالذمه في ابيض من كدا؟"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100754/http://masr.20at.com:80/article.php?sid=223&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 15
subject = "المعنى الحقيقي للبيض"
author = "محمود"
posted = "2006-11-21"
text = "لا يا سادة أعتقد فيه خطأ في تعريف البيض..<br />البيض هو تشبيه الشخص بكون يشبه جزء من الجهاز التناسلي الذكري..<br />وهو الجزء الذي لا يشارك بشكل مباشر في العملية الجنسية فلا تتحقق له -من وجهة نظر عملية- أي متعة أو فائدة مباشرة.. لكنه يبقي يحتوي على الحيوانات المنوية طول الوقت..<br />فيقال في المثل المعروف.. انه لا \"يشارك في العملية الجنسية\" ولا يخلو من النجاسة.<br />هكذا هو البيض.. لا بيـ... ولا بيخلو من النجاسة."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041357/http://masr.20at.com:80/article.php?sid=223&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

