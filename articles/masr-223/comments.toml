text = "أحنا كلنا بنتغاظ من اللي بيهتفوا للحكومة عمال على بطال وبينوعوا في أساليب النفاق<br />لكن مش في المقابل نشتم ونهاجم ديما وننوع في أساليب الهجوم والشتيمة<br />خاصة إننا كلنا عارفين أن كلامنا ده مش بيأثر<br />اشغل نفسك أنك تكون الراجل اللي بتتمنى تشوفه دلوقتي في شخص المسئولين<br />لأنهم ماشيين شاء من شاء وأبى من أبى وجيلنا يوم من الأيام إن شاء الله هيبقى عنده 40 50 ولا حتى70 سنة وهيبقى مسئول عن البلد دي"
