text = "الله ينور يا عم فتحى يا عسل و الله خليت للبيض طعم تانى خالص ... و فعلا أنتا جمعت كل البيض اللى أنا بعتبره أنه أبيض بيض فى البيض ..... و يا ريت كانت كلمة بيض دى كلمة جميلة و إلا كنت قلت إن موضوعك زى البيض ... تعيش و تفقسلنا مواضيع عسل زى دى"
