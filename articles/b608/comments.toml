subject = "نائصنا هبل!!!"
author = "يارا"
posted = "2006-08-11"
text = "هلأ من كل عئلكن بالبنات بدكن تلعبوا كرة قدم؟<br />ييييي دخيلكن يعني نحنا شوبئيلنا إزا حتى لعبة الشباب بدنا نلاحئهن عليهايعني معناها هيك الشباب هن شو بئيلهن؟<br />يغسلوا يطبخوا يربو الزغار ويحطو ميك اب ويطلعوا ....<br />في شي غير هيك؟<br />صح نحنا لازم يكون في بينا وبينهن مساواة بس مش بالكرة<br />شو رايكن يالبنات تروحوا تشتغلوا على جرافة أو ميكانيكا سيارات؟<br />انا كنت بدي اختار صناعي بدل العلمي عشان هايدي المهنة الحلوة المناسبة جدا\" ميكانيكية سيارات \" احم احم ما حدا أدي"
