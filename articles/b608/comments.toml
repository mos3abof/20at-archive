posted = "2006-05-01"
text = "من الافضل لكن ان تعملن على نيل رضا الله و ليس لعب كرة القدم و عرض مفاتن اجسادكن للمشاهدين ليتمتعوا بالنظر المجاني و والله انهم بيضحكوا على عقولكن يا هبلات ففكرن بهذا التساؤل . من مصلحة من ان تلعبن كرة القدم امام الشباب الصايع الذي يبحث عن اي شيىء لاطفاء نار شهوته ؟<br />والله اني خايف عليكن من الحرام."
