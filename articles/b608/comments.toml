subject = "بنات مصر .. ايه حرفنه دي"
author = "هبهوب ,هوبه, هبه"
posted = "2006-03-23"
text = "انا لغايه دلوقتي بحب العب طايره مش شرط يعني كره قدم.<br />وبعدين كنت بلعبها في مدارس كلها بنات في بنات<br />حتي المدرسين كان كلهم ستات العقل السليم في الجسم السليم<br />وبلاش\" عنصريه\"ب<br />وبصراحه كدا بستهيف الواحده اللي تلعب سكر فين انوثتها<br />اين حيائك ياامراة علي راي عمرو خالد<br />وبخصوص الموضوع قريت مره ان ايران كانت عامله مسابقه بين<br />الدول الاسلاميه وبشروط ...اسبكم عشان الماتش هيبدا\"اقصد \" المحاضره\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112453/http://www.20at.com/article2.php?sid=608"

