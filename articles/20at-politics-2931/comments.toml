author = "لباني من بنت جبيل"
posted = "1999-11-30"
text = "والله العظيم انكو الاثنين اردنية او شخص واحد حقود الي اصحاب فلسطينية وشكوا كتير من عنصريتكوا وولائكو للملك مش لله او الوطن فمين فيكوا اللي صاحب مبداء الله يهدي الشعب الاردني على الطريق الصحيح فلسطين ولبنان واليد للابد"
archived = "2010-02-14"
capture_url = "https://web.archive.org/web/20100214023249/http://www.20at.com:80/20at/politics/2931.html"

