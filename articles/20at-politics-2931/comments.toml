author = "أنا من غزة"
posted = "1999-11-30"
text = "حبيبي رزان : انتي من غزة و بتعرفي كويس انو شعبنا في نسبة مش بطالة من الي ما عندهم مبدأ في الحياة<br />بس اهل لبنان ناس الها مبدأ في الحياة … مش عنصريين متلنا … مش بتهم المصالح الشخصية متلنا … لاحظي بحكي عن الشعبين مش الحكومتين او الرئاستين … و احنا عارفين الي فيها"
archived = "2010-02-14"
