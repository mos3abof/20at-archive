author = "لولا"
posted = "1999-11-30"
text = "لو نظرنا إلى المشاركين في الاعتصام لوجدنا أن أبناء التيار الوطني الحر يقف إلى جانب ابن حركة أمل إلى جانب الشيعي إلى جانب السني إلى جانب نصير حزب الله والكل تفق على شيء واحد حقيقي هو مصلحة الشعب ومصلحة الوطن وهذا ما لا يمكن أن نراه حتى في الأحلام على الأرض الفلسطينية خاصة بعد هذه المهازل التي أطاحت بتلك الصور الغراء التي رسمتها المقاومة الفلسطينية منذ عام 48 ليوجه السلاح الذي طالما حلم الفلسطينيون بامتلاكه ..وبعد أن أصبح في أيديهم صوبه الفلسطيني لا بل واستفاد منه حقاً .. لكن ضد من ..؟؟؟؟؟؟؟"
archived = "2010-02-14"
capture_url = "https://web.archive.org/web/20100214023249/http://www.20at.com:80/20at/politics/2931.html"

