[[comments]]
order = 1
subject = "حزب التجمع"
author = "مواطن مصرى"
posted = "2005-12-08"
text = "زب التجمع باقى رغم انف الحاقدين ان كبر السن ليس سبه ولا المرض ومن حق اى شخص ان يرشح نفسه طلما قدر علي العطاء وللو اعمال البطجه وبيع الاصوات ماهزم خالد محى الدين كلمة حق"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813223939/http://egyvote.20at.com:80/article.php?sid=98"

[[comments]]
order = 2
subject = "ابناء المناضل خالد محى الدين"
author = "محمد كارم"
posted = "2007-01-15"
text = "ب كان السن قد كبر فالعقل لم يكبر وان كان صحة المناضل حالد محى الدين لم تعد قادرة على النضال فلقد ترك افكارة وبناء حزبة هدية لهذا الشعب الكادح قادرون بازن اللة رفع اسم هذا الحزب مرة اخر عاليا لان حزب التجمع حزب اليسرين الشرفاء"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813223939/http://egyvote.20at.com:80/article.php?sid=98"

[[comments]]
order = 3
subject = "حزب التجمع  البقية فى حياتك"
author = "مصطفى صابر"
posted = "2007-02-12"
text = "لاشك ان حزب التجمع هوحزب الشرفاء فهوالبدرى فرغلى وابوالعزالحريرى وعبدالعزيزشعبان وعلى راسهم الزعيم خالدمحى الدين فالتجمع لن يموت مادامت الرموزباقية اتقوااااااا اللة يااعداء الوطن"
archived = "2007-08-13"
capture_url = "https://web.archive.org/web/20070813223939/http://egyvote.20at.com:80/article.php?sid=98"
