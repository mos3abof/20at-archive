subject = "الله يرحمه"
author = "احد المعزين"
posted = "2005-12-03"
text = "ياتكم الباقية يا جماعة هو انتوا لسه فاكرين تنشروا النعي النهاردة ده الحزب مات وشبع موت وبعده ماتت احزاب كتيرة والعدد في الليمون"
