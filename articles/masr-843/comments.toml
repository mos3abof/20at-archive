text = "هي الديناصورات المنقرضة هاتصحي تاني ةتتجمع يسار ايه وتخلف ايه بس بعد ماخربوا البلاد والعباد في العالم كله وكل شعوب الدول اللي كانت يساريه ثارت عليهم جايين تاني في مصر يقرفونا بنظرياتهم الفاشلة وكلامهم اللي عفي عليه الزمن اذهبوا الي مزبلة التاريخ والنسيان"
