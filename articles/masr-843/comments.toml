[[comments]]
order = 0
subject = "نظرة وتتنيحة!"
author = "قلم جاف"
posted = "2006-08-29"
text = "أول حاجة نجم الكوميديا سعيد الدقاق اللي عايز يفهمنا إن الحزب الوطني البيروقراطي حزب ليبرالي!<br />أضحكتني يا رجل (ضحكة كفار قريش في المسلسلات الدينية القديمة)!<br />شيء تاني ..<br />أيها البشر اليساريون:<br />إيه هية تصوراتكم لمصر؟<br />إزاي بتطالبوا الحزب الوطني البيروقراطي بإعادة سيطرة القطاع العام على الاقتصاد وإنتم مبتثقوش في أي حكومة؟<br />إيه هية حلولكم لأزمة البطالة؟<br />مش حتلاقي جواب..<br />لا عندهم ..<br />ولا عند التيار الديني..<br />ولا عند الحزب الوطني البيروقراطي ..<br />حتلاقيهم كلهم سماااااع هوسسسس.. وينظرولك نظرة (أنا مش حأنساها أبداً - على رأي مسلسل أو فيلم) وهات يا تتنيح!<br />بس برضه التتنيحة اليسارية والناصرية ليها شمخة برضه ، تتنيحة مواطن من القرن التاسع عشر لما تسأله عن رياضيات الكم أو عمل نظام تشغيل كامل متكامل بلغة السي القديمة خالص!<br />يا أبو تتنيحة جنان! .. تنحها كمان وكمان!"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831233535/http://masr.20at.com:80/article.php?sid=843"

