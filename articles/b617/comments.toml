subject = "على فكرة .... ده اختراع دانماركي"
author = "واحد تاني"
posted = "2006-03-26"
text = "هل تعلم …. ان اول من فكر فى هذه التكنولوجى هو مهندس دانماركي يعمل لصالح شركة (Erickson) وده كان سنة 1994 ووقتها واجهته صعوبات فنية يمكن لعدم تطوراجهزة التليفون و الكمبيوتر المحمول وقتها وكمان لعدم توصله لمصدر بسيط لتزويد فكرته بالطاقة المطلوبة لتشغيلها , لكن فى سنة 1997 وبالاستعانة بشركة (Intel) قدريطور فكرته واللى طلعت للنور سنة 1999 , والفكرة ببساطة هى امكانية توصيل الاجهزة لاسلكيا عن طريق موجات الراديو فى حدود دايرة قطرها 10 م (وبيشتغلوا حاليا على توصيلها الى 100 م) والفايدة منها مش بس مجرد نقل الملفات من موبايل لاخر انما دى زي ما بتوصل تليفون باخر هى ممكن توصل تليفونك بجهاز الكمبيوتر الشخصى بتاعك وممكن توصل الكمبيوتر بكمبيوتر تانى او حتى بطابعة او كاميرا رقمية وغيرها من الاجهزة الرقمية اللى كنت محتاج توصلها باسلاك قبل كده , واذا بتنزل فى اى فندق دلوقتى انت مش محتاج اكتر من الكمبيوتر الشخصى بتاعك عشان تدخل على النت تراجع بريدك لان تقريبا معضم الفنادق دلوقتى عندها شبكات انترنت (wireless) بتشتغل عن طريق<br />(Bluetooth technology)<br />ياريت العملية على قد كده وبس , لا دا كمان شركة (Lexus) وغيرها من منتجي السيارات استخدمت التكنولوجى دى بحيث انك ممكن تشغل الكاسيت او تختار السي دى او انك تتصل بحد,كل ده وانت سايب ايدك وعن طريق صوتك . وحاليا فى السويد عربيات الاسعاف بتقيس ضغط دم المريض ونبضه وكمية الاكسجين وتنقل المعلومات لاسلكيا للمركز الطبى اللى بينقلوا له المريض وهو لسه فى الطريق بنفس التكنولوجى .<br />تصحيح<br />بخصوص المعلومة اللى مذكورة فوق بخصوص الاخ اللى سرق معلومات السادة الافاضل فى دقايق انا مش عارف الكلام دا حصل امتى بس لو حصل اكيد كان من زمان , لان مع تطور الموضوع دا ابتكروا طرق للحماية من الاختراق والتلصص وتداخل الموجات منها باختصار حاجة اسمها (Digital Spread Spectrum Technology) ودى بالبلدى كده يعنى استخدام طيف متغير من الترددات اللاسلكية المختلفة بتوصل ل 1600 تردد فى الثانية وبشكل عشوائي ودا بيصعب فهم الاشارات الا للمسموح لهم بالدخول عليها باستخدام اسم المستخدم وكلمة السر اللى هى طبعا غير افتح يا سمسم .<br />يتبقى بس اننا نقول سبب التسمية العجيبة دى ( السنه الزرقه قال) طبعا لان الباشمهندس كان دانماركى من بتوع الدانمارك هى امى وكده فراح جاب الاسم دا من تاريخه بلده العتيد وهى نسبة للملك Herald Bluetooth)) موحد الدانمارك والنرويج واللى حكمهم من سنة 910-940 م ونظرا لان الملك دا كان بيحب التوت البري وبياكل منه كتير ومش بيغسل سنانه بسيجنال تو فطبعا دا كان السبب فى ان سنانه تبقى لونها ازرق والناس تفضحوا اليومين دول ومن هنا يكون الدرس المستفاد من قصة ال (Bluetooth) اللى صدعتكم بيها دى اننا لازم نغسل اسنانا كويس قبل ماننام."
