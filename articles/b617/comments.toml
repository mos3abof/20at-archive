text = "التلفزيون فيه ناس بتسخدمه للخير وفيه ناس بستخدمه للشر ،السكينه ممكن للخير وممكن للشر،الكمبيوتر والبلوتوث ممكن برده للخير وممكن لشر انا عايز اوضح بس ان مش البلوتوث بس انه مش هو الوحيد الوحش والكخه باى باى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114134/http://www.20at.com/article2.php?sid=617"

