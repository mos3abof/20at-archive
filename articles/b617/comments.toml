subject = "إني أرى الملك عاريا"
author = "هل أستطيع أن أجعل من السطور سياطا و أسلاكا مجدولة تنهال على وعي القارئ ليحس بشيء شبيه لما يعانيه الضحايا؟."
posted = "2006-03-26"
text = "وهل أستطيع أن أستعمل بدلا من الحبر الذي دنسته أقلام كثيرة دم الضحايا الذي سفكه الطاغوت الباطش الجبار وسفحه الضحايا..<br />هل أستطيع أن أوقد تحت القارئ نارا، ليحس بما يحس به الضحية وهو معلق كالخروف المشوي فوق النار..<br />هل أستطيع أن أجعل القارئ يقرأ هذه المجلة وهو معلق من قدميه في سقف منزله، أو وهو معلق من رسغيه معكوسا وقد ربطت في كل قدم من قدميه أنبوبة بوتاجاز، أو وهو يسحل على الأرض..<br />هل أستطيع أن أصوغ من تلك الحمم المنصهرة المنثالة من داخلي تمثالا يحرق لامسه ويعمي الناظر إليه، أو أن أرسم بألوانها الدامية لوحة تتحرك فيها الجمادات وتصرخ..<br />هل أستطيع أن أجعل صفحات هذا المقال تشتعل بين يدي القارئ، أو تنوح وتلطم ..<br />هل أستطيع أن أنقل للقارئ عظمة تلك النماذج الشامخة الأبية التي لا تنكسر أبدا مهما مورس ضدها من تعذيب حتى الموت.. ثم هل أستطيع الحديث عن الجانب الآخر.. عن الذين يفقدهم التعذيب بشريتهم ..<br />هل أستطيع أن أبث الروح في تلك الحروف المتراصة الميتة فتنفجر بالحياة من الألم فتنقل للقارئ في نفس اللحظة التي يقرأ فيها صرخة إنسان يعذب، صرخة تلاشى منها كل كبرياء وانهدمت فيها كل إرادة، طويلة مشروخة مذهولة مرتعبة منسحقة يائسة آملة مذبوحة راجية خاضعة ذليلة متوسلة معترفة بما لا تعرف تائبة عما لم ترتكب صاخبة جياشة هادرة مهدورة مرتجفة بالخوف والكهرباء عمياء بما يعصب العينين، غير مدركة من أين يجيئها العذاب ولا سببه، صرخة لا يتخيل أن مثلها يمكن أن يصدر من عضو بشري كالحنجرة و إنما كل خلية في الجسد الإنساني تصرخ صرختها الخاصة فخلايا الحنجرة تصرخ وخلايا القلب تصرخ وخلايا الكبد تصرخ وخلايا الدم تصرخ، وخلايا الجلد التي تقابل خلايا السوط في العرس الدامي تصرخ، وخلايا الجسد كلها تتحول إلى خلايا للألم تستقبله وتعبر عنه مسقطة كل أبجديات اللغة فلا يبقي من كل حروف كل لغات العالم سوي حرفين .. هما: آه.<br />ويذوب الموصوف في الصفة منصهرا تحت حرارة اللهيب فإذا الآه ليست تعبيرا عن الألم بل هي الألم ذاته وقد استدعته نداءاته ليقود كالمايسترو فرقة الخلايا الصارخة مطلقة جميعا في تناغم وحشي سيمفونية الألم المروع التي تعزفها خلايا الجسد الإنساني المعذب الذي فقد ذاكرته ففقدت أفعال اللغة أزمانها ولم يعد لديه ماض ولا حاضر ولا مستقبل، لم يبق إلا فعل الأمر: اضرب، احرق، انتهك، عذّب، اركع، اعترف، انسحق، تلاش، اكفر بالله ، سب محمدا، وهو لا يستطيع وبين العذاب و العذاب عذاب أن يجيب، فخلايا الذاكرة قد فقدت الذاكرة لتطلق هي الأخرى صرختها المجردة من الزمان، فكأنما هزيم الصرخات يغطي الوجود الإنساني عبر كل تاريخه المعذب بين جبروت الجلادين الفجرة وعذاب الضحايا وعجزهم وذلهم..<br />هل يمكن أن يسمع القارئ وعيناه تجريان على هذه السطور صوت سوط، صوت العظام وهي تتهشم، والمفاصل وهي تنخلع، والنفوس وهي تنكسر..<br />هل يمكن أن يرى القارئ ولو لثانية واحدة ضابط الشرطة الذي يعبث بأصابعه وبأدوات أخري في هني امرأة، في عورتها وعفتها، بعد أن أخذوها وهي البريئة رهينة، هل يمكن أن يرى القارئ ذلك و أن يخصف على مشهد العار الداعر في خياله الدامي صفحات هذا المقال..<br />هل يمكن..هل يمكن..<br />و هل تغني هذه الدموع التي يذرفها القارئ الآن وهو يقرأ، وهل تجدي في إطفاء النار المشتعلة في ضحية واحدة..<br />هل أنجح في أن أجعل القارئ يحس بثوان فقط من ذلك العذاب الوحشي الهمجي المجنون الذي يعانيه الآن في نفس هذه اللحظة واحد من آلاف الضحايا في باستيل مصر في لاظوغلي، أو في فروعه المنتشرة كالعنكبوت أوالأخطبوط على ساحة الوطن، أو في مراكزه الرئيسية في جوانتانامو و أبي غريب وفلسطين وسجون المخابرات الأمريكية السرية، هل أنجح في أن أشعره بثوان، ثوان فقط، تجعله حتى، دون أي احتجاج أو تمرد أو ثورة، يلجأ إلى سريره ينشد الراحة من الإنهاك الذي سببه له تخيل الإحساس بالعذاب، وهي راحة لا يظفر بمثلها الضحية، فهناك، في سجون الطواغيت، لا يجد الضحية أي فرصة للراحة من العذاب، فبعد كل عذاب عذاب أشد<br />هل يمكن أن أنقل إلى القارئ شيئا من مشاعر اللهفة المحمومة والأمل الذي يعتمل في نفس ضحية تترقب صحوة الأمة تستجيب للنداء الذي تطلقه الكينونة الإنسانية دونما حاجة إلى صوت تهتز به أوتار الحناجر ولا إلى لغة تقولها بالحروف: وا إسلاماه فتهرع الأمة لإنقاذه من عذابه..<br />لقد خدعونا، ادعوا زورا أن قانون حضارتهم اللاديني يقرر أنه لا يوجد متهم بريء ومتهم مذنب، فكل المتهمين أبرياء حتى تثبت إدانتهم في محاكمة عادلة ، خدعونا، فبالرغم من ادعائهم، فان ضحايا التعذيب والقتل، معظمهم أبرياء لم تصدر بشأنهم أحكام.. يكفي أن يصرح الجلاد أن الضحية متهم كي يسام العذاب أو يفقد حياته.. أو أن تدعي الدولة المارقة – أمريكا وذيولها- أنه مشتبه فيه كي تهدم دولته وتمزق أمته..<br />http://al-shaab.org/2006/24-03-2006/mohamadabbas.htm"
