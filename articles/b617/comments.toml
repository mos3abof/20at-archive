text = "الموضوع بجد ما لوش اي لزمه<br />الإباحيه موجوده في كل حته سواء فيديو او سي دي او تليفزيون او انترنت او او.......<br />كون ان احنا نتهم وسيلة اتصال ممتازه يبقي نتهم كل وسائل الإتصال الاخرى زي اللي انا فاتحه دلوقتي \"النت\"<br />او اولى نتهم الإنفرارد اللي موجوده في نفس التليفونات دي وبينقل برضه اباحيه<br />انتو مش لاقيين حاجه تتكلمو فيها<br />نفسي نتكلم في حاجه مفيده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114134/http://www.20at.com/article2.php?sid=617"

[[comments]]
order = 6
subject = "كلام جميل كلام معقول"
author = "كرملينو"
posted = "2006-03-28"
text = "انا شايف انها تقنية مفيدة و سريعة لنقل المعلومات و بتستخدم للافادة اكتر منها للضرر زي شبكات الانترنت اللاسلكية التي بتستخدم البلوتوث<br />و على فكرةاناموبايلي مدى البلوتوث فيه 100 متر بس للاسف مش عارف استفيد منها لان الاجهزة التانية مش بتجيب الا 10 متر<br />و في الاخر سؤال لواحد تاني ؟؟؟<br />انت واحد معدي و لا واحد تاني ؟؟؟<br />انت بصراحة انسان جامد جدا و انا بحتم ارائك و اسلوبك و علمك المدفق<br />ربنا يكرمك زي ما كرم جابر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114134/http://www.20at.com/article2.php?sid=617"

[[comments]]
order = 7
subject = "شوف يا باشمهندس"
author = "واحد تاني"
posted = "2006-03-29"
text = "بعد ما اشكرك على الاطراء - المدح يعنى سيادتك - على شخص واحد تاني المتواضع , احب اقولك انه واحد تاني , بس بيعدي كل مايكون عنده دقيقتين فاضيين , ونادرا ما هتلاقيه بيرد على تعليق احد السادة المعلقين (زى مابيحصل دلوقتى كده) الا اذا كان شخص عزيز عليه ( او فاضله حبه ويبقى حب العزيز)<br />ويتبقى السؤال... هل انت تعرف ازاى ربنا كرم جابر؟ والا ازاى كرم مطاوع ؟ وقبلهم كان كارم محمود ؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114134/http://www.20at.com/article2.php?sid=617"

[[comments]]
order = 8
subject = "يا كرماتك"
author = "هوووووبه او هبابه او هبهوب"
posted = "2006-04-02"
text = "بص يا كابتن واحد تاني اموت واعرف فين الواحد الاولاني امووووت فين الاول<br />سيبك من المعدي لانه معروف او مقفوش<br />ويكرمكم انتوا الاتنين كرم بورم<br />اما بخصوص البلتوث<br />والله عندي حساسيه من المحلول<br />مبطقهوووووووش معرفش ليه مع اني بحب التكنولجيا<br />وكل اللي بيلبس البتاع دي في ودنه بيفكرني بالمثل \" ودنك من اين يا جحا \""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114134/http://www.20at.com/article2.php?sid=617"

[[comments]]
order = 9
subject = "بارك الله فيك"
author = "سميره"
posted = "2006-04-16"
text = "الاخ او الاخت صاحب الموضوع الذي يحمل عنوان \"اني ارى الملك عاريا\"<br />لقد نجحت في اثاره شجوني و نجحت في تذكيري بما نسيت و لم يكن ينبغي ان انسى فجزاك الله خيرا لانى شعرت ان هناك من يحتاج لاي شىء مني و لو كان فقط الدعاء الذي هو البدايه و النهايه مع سرعه الاقتداء بسنه النبي عليه الصلاه و السلام و ليضع كل منا في مخيلته فقط ان اقرب الناس اليه معتقل او يعذبه احد الكلاب في احد السجون و حسبي الله و نعم الوكيل اللهم انتقم من كل جبار عدوللاسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114134/http://www.20at.com/article2.php?sid=617"

[[comments]]
order = 10
subject = "البلوتوث كسائر الاشياء"
author = "وحيد الرياض"
posted = "2006-04-23"
text = "انا اعتبر البلوتوث كسائر الاشياء فان استخدم في ما يفيدمثل كشف بعض الجرائم الغامضه اوللتسليه بين الاصحاب فهذا جميل اما اذا استخدم للتشهير وفضح الغير ونشر الرذيله فهذا سئ جدا ومن هنا نكتشف ان المشكله ليست في التقنيه وانما في عقول المستخدمينز"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114134/http://www.20at.com/article2.php?sid=617"

[[comments]]
order = 11
subject = "بلوتوث نافع"
author = "peasful girl"
posted = "2006-07-02"
text = "أولا : السلام عليكم و رحمة الله و بركاته<br />البلوتوث ممكن يكون مفيد .. مثلا لما الرسول ( ص ) اتهاجم و اتسب و اتهان سميت موبايلي ( إلا الحبيب المصطفى ) صحيح إنه مش حاجة كبيرة .. بس لو حد من الشباب عمل كده و دخل كافيه و كل الناس الموجودين قرءوا الاسم ذاكرتهم هتنتعش و يمكن دمهم يفور و هيحاولوا يعملوا حاجة أكبر و أكثر تاثيرا ... البلوتوث ممكن يكون مفيد جدا لو استخدمناه بالطريقة الصحيحة .. الناس اللي بيقولوا إن البلوتوث سبب للخيانة أو الفساد أو الرذيلة غلطانين ... لأن الفساد و الرزيلة مكنوش مستنيين البلوتوث علشان يظهروا ... القضاء عليهم مستحيل و لكن ردعهم ممكن لأنهم هيفضلوا موجودين طول مالبشر موجودين على الكرة الأرضية ... و الله المستعان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114134/http://www.20at.com/article2.php?sid=617"

