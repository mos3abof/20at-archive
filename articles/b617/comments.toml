text = "انا شايفة ان اى حاجه جديده فى اى مجال كمبيوتر محمول اى حاجة دا يعتبر شىء كويس والعيب بقة فى طريقة الاستخدام يعنى احنا مش نستخدم الشىء دا بطريقة سيئة ونرجع نقول انتة مع او ضد وبعدين البلوتوث لية استخدمات كتير كويسة جدا وبعدين فى عصر السرعه دا والفضائيات لازم الشىء دا انا عندى فى تليفونى الخاصية دى لاكن بستخدمه استخدام كويس عشان كده مش بيمثلى قلق ."
