text = "انا شخصيا مع وضد..مع البلتوث فحاجات كتير خدم فيها..زي تصوير جريمه أو انك تصور شخص لك زمان ما شفتو يفضل معاك للذكرى..أو تصوير ملفات شخصيه بدل ما تشيلها..او او او؟؟؟<br />لكن للاسف مضار البلوتوث اكتر من نفعه ..خصوصا عندنا فالخليج..اصبحت الجوالات لا تخلو من صور النساء العفيفات..اما بتصويرهم غفلةً فالافراح او المدارس اوالصالونات النسائيه..فاصبحت جميع الاماكن المغلقه تفرض عليك التفتيش ودا للاسف ضد الحريه ولكن اولاد الحرام ما خلو لاولاد الحلال حاجه.الخير يخص والشر يعم"
