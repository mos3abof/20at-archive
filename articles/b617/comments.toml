subject = "تنت"
author = "تتتت"
posted = "2006-03-27"
text = "لم أكن أفهم ما معنى البلوتوث وكيف يستخدم، ولما كانت المرة الأولى التي أستخدم فيها جهازي المحمول الذي يتيح خاصية البلوتوث، فقد تركت (البلوتوث Bluetooth) يعمل، ولم أكن أعلم ذلك، لذا فبطريقة أو بأخرى انتقلت إليه الفيروسات، وعند ركوب المواصلات العامة أو التواجد في أي coffee shop، كانت الفيروسات تنتقل إلى من حولي، مما كان يثير استيائهم، ويجعلهم يصرخون \"مين اللي فاتح البلوتوث\"؟!..<br />وبالطبع لم أكن أفهم ما يقصدون، إلى أن اكتشف أحد المتواجدين حولي مصدر الفيروسات المنتقلة إليه، ووقتها لا أعرف كيف أصف لكم كيف كان شعوري وخجلي ممن حولي الذين جاءتهم الفرصة كي يتهكموا ويسخروا من هذا الذي يمدهم بالفيروسات بإطلاق \"القفشات\" والنكات، مثل \"المحمول فيه سم قاتل\"، \"ابعد فيروساتك عنا\"..<br />لذا فقد قررت أن أعرف ما هو هذا (البلوتوث)؟ وما يدور في عالمه الخاص..<br />اتصال لاسلكي<br />تقنية (البلوتوث) هو أحد أحدث ما وصل إلى أيدينا من ابتكارات التكنولوجيا، مما جعله \"تقليعة\" وهاجس جديد لدى الشباب في جميع أنحاء الوطن العربي.<br />تعتمد الفكرة الأساسية لعمل (البلوتوث) على الاتصال بين الأجهزة المختلفة مثل الكمبيوتر والموبيل والكاميرات الرقمية بدون أسلاك في مدى لا يتعدى الـ 10 أمتار، بحيث تتمكن هذه الأجهزة من تبادل البيانات ونقل الملفات بينها وبين شبكة الانترنت لاسلكياً.<br />نانسي ع البلوتوث<br />لكن خبراء الاتصال يحذرون من المشكلات التي قد تسببها المبالغة في استخدام تقنية بلوتوث على الشباب على أساس أنها تلهيهم عن القيام بأعمال أكثر فائدة، وتكمن خطورتها على سبيل المثال في تبادل المعلومات والصور الإباحية عبرها.<br />فمنذ أسابيع قليلة كان هناك ظهور وانتشار لمقطعين فيديو انتشرا عبرالبلوتوث يخصان نانسي عجرم وهيفاء وهبي، حيث تم فبركة \"صور إباحية\" كل منهما، ورغم أن الجميع يعلم أنها مقاطع \"مزورة\"، إلا أن انتشرت انتشار النار في الهشيم!<br />كذلك يتيح البلوتوث مخاطر سرقة المعلومات السرية والشخصية بسبب سهولة اختراق هذه التقنية، ففي ألمانيا استطاع أحد المهندسين خلال دقائق اختراق هواتف الكثير من السياسيين الألمان المزودة تقنية بلوتوث، ولم يلزمه الأمر سوى مسح إلكتروني بواسطة كومبيوتر مزود بتقنية البلوتوث خبأه في حقيبة ظهره أثناء تجواله حول مبنى البرلمان الألماني..<br />ومن بين المعلومات التي حصل عليها المهندس في أقل من نصف ساعة أرقام هواتف شخصية ومحتويات رسائل قصيرة ومكالمات بين عناصر من قوات الأمن وغيرها.<br />شباب وبلوتوث<br />إذا كنت قد رويت لكم قصتي مع البلوتوث، فما هي رؤية الشباب له وكيف يتعاملون معه؟<br />(أحمد فهمي)، يحكي لنا كيف كان يصل إلى عشرات المقاطع من البلوتوث أثناء السير في الطريق أو عند وجوده في مكان ما يتواجد به العديد من الشباب، منها ما يكون به بعض اللقطات النادرة أو الكوميدية، ومنها ما قد يحتوي على مشاهد خارجة أو متضمنة للفيروسات التي قد تدمر الموبايل، لذا اقتصر استخدامه للبلوتوث في نطاق الأصدقاء فقط.<br />بينما يقول يحكي لنا وائل عن مغامراته مع (البلوتوث) بقوله: \"وصلني عبر البلوتوث مقطاع من فيديو إباحي قيل أنه لنانسي عجرم، وبالرغم من أني لا أحب أن أتلقى أو انشر مثل هذه المقاطع، إلا أني وجدت أصدقائي يتشوقون لرؤيته؛ لأنه يرتبط بشخصية معروفة، لذا أرسلته لأكثر من صديق بناء على طلبهم، الغريب أن هذا المقطع انتشر بين الجميع في أيام قليلة.<br />أما (ميادة) فتؤكد لنا حبها لخدمة البلوتوث كوسيلة ترفيهية، وتكمل: \"عن طريق تلك التقنية، أتبادل الصور ومقاطع الفيديو المصورة والمقاطع الصوتية والنغمات بيني وبين أصدقائي، وأعرف الجديد والحديث فيها، فذلك أعتبره أمر مشوق جدا\".<br />وعلى الجانب الآخر، يرفض (محمد عبد الخالق) هذه التقنية تماماً، حيث يقول لنا: \"البلوتوث أتاح انتشار الصور والألقاب المثيرة بين المستخدمين، ومعه ازدادت المعاكسات والغزل بين الشباب والفتيات، حيث يتم تبادل أرقام التليفونات بينهما خاصة في المناطق المزدحمة مثل المطاعم والمقاهي والمولات، لذا أرى أن البلوتوث يتيح انتشار اللاأخلاقيات\".<br />وأنت كيف ترى تقنية (البلوتوث)، وهل لديك مواقف محرجة أو طريفة حدثت لك بسببه؟!"
