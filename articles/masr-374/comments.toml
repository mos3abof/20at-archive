[[comments]]
order = 15
subject = "لا حول ولا قوة إلا بالله"
author = "نانسي"
posted = "2006-05-27"
text = "المعادلة الشرعية التى تثبت لنا الايام كل يوم عظم خطورتها هي<br />سفور وعدم حجاب صحيح + إختلاط مع الشباب = زني والعياذ بالله<br />وفعلا الناس تتهم الله وتتهم دينه وشريعته ولا تتهم فساد أخلاقهم وتربيتهم<br />تريد أن تحل مشلكة شخصية فتتطعن في أحد شرائع الإسلام والمشكلة مش إنها خانت أبوها ولا إن هما الإثنين زنوا ولا المشلكة إن فى حمل من سفاح ولا إن البجاحة فى طرح المشكلة لأ<br />المشلكة الآن الناس عايزة تغير الشريعة علشان تمشي على هواهم<br />للأسف كل واحد فى القضايا ديه بينظر لنفسه فقط وناسي إن الإسلام نازل لكل العالم حتي قيام الساعة<br />وفعلا لو كل واحد نفذ ال هو عايزه لفسدت السموات والأرض ومن فيهن<br />وصدق الله ال هو خالقنا وعارف تركيبتنا النفسية<br />\") وَلَوْ اتَّبَعَ الْحَقُّ أَهْوَاءَهُمْ لَفَسَدَتْ السَّمَوَاتُ وَالأَرْضُ وَمَنْ فِيهِنَّ بَلْ أَتَيْنَاهُمْ بِذِكْرِهِمْ فَهُمْ عَنْ ذِكْرِهِمْ مُعْرِضُونَ (71) سورة المؤمنون<br />يا جماعة الإسلام بقدم مصلحة المجموع عن الفرد وبيعطي قواعد للفرد علشان ميقعش فى مصيبة<br />يعني الغلط فى مين مش ربنا أمرنا إن الشباب والبنات يتجوزا مبكرا<br />مش الاسلام باح تعدد الزوجات بدل علاقات الخيانة الزوجية<br />مش الإسلام مدح وحبب فى تخفيض المهور<br />مش الإسلام أمر بعدم السفور<br />مش الإسلام أمر بعدم الإختلاط المحرم<br />مش الإسلام أمر بعض البصرللرجال والنساء<br />يا جماعة حرام الامة إشتكت من قرفكم قرفتونا وقرفتوا العالم الإسلامي بدونيتكم<br />وكلمة أخيرة لهند الحناوي يعني إنت فاكرة إن بنتك الناس دلوقتي حتعاملها إنها بنت حلال والله للأسف كل واحد يقشعر من إنه يتزوج واحدة أمها غلطت وزنت وجابتها من حرام وعدين كمان بتعترض على حكم الإسلام وفاكرة إنها كده كسبت القضية ."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

