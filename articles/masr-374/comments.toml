[[comments]]
order = 0
subject = "الموضوع وما فيه"
author = "عبدالله مفتاح"
posted = "2006-05-25"
text = "الموضوع يا اخوة ببساطه ان الاثنين اوحش من بعض لكن المشكله الحقيقيه تكمن في مخالفة الشرع يعني ابن الزنى كده او كده لا ينسب لابيه<br />طيب دلوقتي هند بتقول ان احمد كان اتجوزها وهو بيقول لم اتزوجها الموضوع معقد والله<br />انا مش قادر اقول ان المفروض مكنتش تنسب لاحمد لان ابن القيم وابن تيميه كانوا قالوا لو الاب اعترف بعلاقته بالام يثبت النسب لكن ساعتها الراجل هيكذب ويقول انا تزوجتها<br />باختصار اتفضحنا في وسط العرب و14000 حاله مجهولة النسب<br />وبنت تقول انا اديته كل حاجه مجتش على الورقه يا دي الفضايح<br />بس لا انكر اني كنت متعاطف مع هند ومتغاظ اوي من احمد لاني حسيت انه ندل ومنحرف وهي منحرفه وبجحه<br />بس في الاخر كنت متعاطف معاها ومتغاظ من احمد<br />اللهم لا تفضحنا بخفي اعمالنا واسترنا بسترك يا ستير يا الله<br />لا للتمديد ... لا للتوريث... نعم لتعديل الدستور"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

