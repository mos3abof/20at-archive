subject = "كما تدين تودان"
author = "القط الاسود"
posted = "2006-06-08"
text = "اولا : تحياتي لوالد الفتاة ووالدتها ام لينا جعلتهم في موقف حرج امام المجتمع المصري المتسمك بتقاليه الشرقية ومع ذلك لم يتخلوا عنها في هذا الموقف الحرج الذي يمس الشرف والسمعة .<br />ثانيا : يظهر لكم مدي النفاق الاجتماعي الذي اصبح سمة من سمات هذا الزمن يظهر لكم الفاعل وهو رجل يقدم برنامج ديني يحلل ويحرم ويعترف بواقعة الزنا والمؤسف والمحزن موقف والده الرجل الذي جامل ابنه وترك الحق . الله المستعان"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

[[comments]]
order = 42
subject = "رساله للمخدوعين"
author = "zask"
posted = "2006-06-17"
text = "لكل مدافع عن هند !ياتري انت مصدق فعلا ان هند الحناوي تزوجت أحمدوفي الحاله دي هند هي المسكينه المخدوعه عيله صغيره ياعيني ساذجه بريئه ضحك عليها أحمد الذئب الغدارالكذاب طيب هي هبله وضحك عليها الوحش فين أبوها وفين أمها ياتري لما كانت بتخرج من البيت وهي طبعا مؤدبه وصادقه كانت بتقول لأبوهاوأمها ولا لأ وكانوا بيوافقوا ولا! طبعاالموضوع كده مش منطقي خالص ولا هند ساذجه ولا حاجه ولا ينضحك عليها ولا حاجه دي أكبر من أحمد دي هي اللي تضحك عليه وعلي أبوه مش تقول ضحك علي وخد ورقة الزواج العرفي عرفي إيه ونيلة ايه ياشيخه انتوا وأمثالكم عايزين تودونا فين ولا أبوها وأمها دول أساسا ماينفعش الكلام معاهم إنما القاضي الغريب ده -قاضي ايه بس وبتاع ايه دي حاجه تقرف -طيب أحمد وحش وهندهي اللي ملاك ؟ روح منك لله ياشيخ الخلاصه إذا كان أحمد وحش أكيد هند كمان وحشه وزي الفت هي وأبوها وأمها وأبوه وأمه ناس كلهم عايزين الحرق في ميدان عام وقبلهم القاضي حسبي الله ونعم الوكيل فيكم وفي حكومات بلادنااللي بيدعموا الفساد وبيحاولوا يقننوه"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

[[comments]]
