subject = "أتمنى"
author = "مصرى"
posted = "2006-05-28"
text = "أتمنى الأ أرى وجه هند الحناوى فى أى وسيلة من وسائل الإعلام مرة أخرى<br />أتمنى ألا تقوم هى بتربية إبنتها لأن فاقد الشيىء لا يعطية<br />أتمنى أن يقف شيخ من شيوخ الأزهر ويعترض على هذا الحكم ويقول أن إبن الزنا لا ينسب لأبوه<br />أتمنى أن الأم ترتدى الحجاب وتعرف أن الله المنتقم الجبار<br />أتمنى أنها تكون موعظة لكل بنت أو ولد يسعى إلى علاقة غير شرعية ويتقى الله فى نفسه وفى أهله<br />أتمنى الأ يعمل والد هند فى مجال تنشئة الشباب لأنه فاقد الأهلية للتعامل فى أصول التربية<br />أتمنى السر لكل المسلمين"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

[[comments]]
order = 18
subject = "الناس ده عبارة عن مرحاض متحرك"
author = "هند الحناوي بتقول بنتي زي الفل"
posted = "2006-05-28"
text = "وراح اربيها تربية زي الفل<br />اة ياهند ... علميها لما تكبر تتعلم من تجربتك وتستعمل الواقي الذكري ، الكاندم يعني ، علشان تخلي بالك ومفيش حد يضحك عليها ويحبلها بمزاجه<br />قال زواج عرفي قال ، قال جواز فاسد قال<br />هندي الحناوي كانت بتبات بره البيت بالأسبوع<br />والفيشاوي فضح ابوها على التلفزيون وقاله الكلام ده مكتوب في المحضر في النيابة<br />شوف بنتك بتروح فين ... هههههه<br />قال دكتور جامعة قال .<br />أسرة وسخة ...<br />طبعاً الفيشاوي وعائلته معروفين انهم اوساخ<br />من زمان .. حاجة مفروغ منها .<br />دعارة مخدرات فسق فجور والنتيجة<br />( ولد داعر زي احمد الفيشاوي )<br />اسرة هند الحناوي . اب ديوس<br />امه هبله عبيطه مجنونه وقعت على دماغها<br />وهي صغيرة ..فجالها العبط المبكر<br />جابو هند الزانية ....<br />ولا عزاء للزواني ...<br />اللهم استرنا ولا تفضحنا .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

