[[comments]]
order = 34
subject = "لاحول ولا قوة إلا بالله"
author = "رَوض"
posted = "2006-05-28"
text = "وأتسائل : لماذا نريد أن نحكم الدين فى كل مناحى حياتنا بهذه الصورة المؤسفة ؟؟ الدين لا مكان له سوى داخل قلوب أتباعه وبين جدران دور العبادة ، أما القوانين المدنية العلمانية هى التى يجب أن يحتكم اليها داخل قاعات المحاكم ، وأعتقد أن أبيات نزار قبانى التى ذكرها القاضى أكثر عدلا ورحمة من الحديث المنسوب الى محمد<br />الأستاذ الفاضل صاحب التعليق السابق<br />من قال إن الإسلام يقتصر على دور العبادة بغض النظر عن المسمى نفسه<br />ألم يكن الإسلام وما زال منهاج حياة شامل<br />يصلح لكل زمان وكل مكان<br />وكذلك أما كان من أدب الحديث عدم ذكر سيد الخلق باسمه مجردا<br />(لِتُؤْمِنُوا بِاللَّهِ وَرَسُولِهِ وَتُعَزِّرُوهُ وَتُوَقِّرُوهُ )<br />وهل يتساوى سيد الكونين وسيد الخلق بأحد حتى يتساوى بصاحب القصيدة<br />سبحان الله<br />طيب (وما أرسلناك إلا رحمة للعالمين) نزلت فى مين لما قصيدة الكابتن ده أرحم<br />لا اله الا الله"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

[[comments]]
order = 35
subject = "ماذا حدث بالدنيا"
author = "بنت مصر"
posted = "2006-05-29"
text = "أضم صوتي الي صوت الأستاذين المحترمين عبدالكريم نبيل سليمان و محمد توفيق في ما قالا و اتسائل بمنتهي الحزن و السي و العجب ماذا حدث بالدنيا..... نتخذ من الأديان سببا لظلم العباد و تكدير حياتهم ..... حق يراد به باطل أم جهل و جهالة؟؟؟!!! السيدة الصحفية المحترمة التي نزلت تقريعا لأن القاض أستشهد بقصيدة لنزار في الجلسة ليصف الخسة و الأنحطاط الذي تميز بهم و بجدارة العيل أحمد فاروق الفيشاوي الذي أستكثر عليه لقب إنسان و هو يتخلي عن فلذة كبده لحمه و دمه نكاية في أمها أو تهربا خسيسا من تحمل المسئولية هو كان يريد المتعة فقط دون ان يحسب عواقب أفعاله كما عوده بابا و ماما ننوس عين أمه..... و زاد علي ذلك بأن ركب الموجة و تاجر بالدين و ظهر بمظهر الملاك الطاهر او الحمل الوديع مستترا خلف وجها ربما أوحي بذلك حتي أنكشف هو و من كان يروج له ذئبا حقيرا لا يرقي لمستو الحشرة<br />لا أدافع هنا عن موقف هند و ان سلوكها مرفوضا و غيرمقبول و لكن هذا ليس مبررا ان نكون بهذا التخلف و نصفها بالزانية الي آخر هذه الأوصاف و النعوت التي سيحاسبنا عليها الله قبل القانون و لا نوجه اللوم ذاته للنذل الذي فعل الشئ نفسه....<br />أقول لأحمد الفيشاوي و لكل متشدق بالأديان قبل الأديان و الرسل كان هناك الخلق و الفضيلة و معان للرجولة فقدت للأسف هذه الأيام و كلها تحتم علي هذا الفسل ان يعترف بخطئه و ان يعترف بأبنته و لو كانت من علاقة غير شرعية<br />في الأفلام العربية القديمة التي لا تعجب الست الصحفية المحترمة كان المؤلف ينتصر لهذه القيم و هذه الأخلاقيات فينظر الأب الي أبنته و يتحرك قلبه و تجبره مشاعره أن يقول نعم هي أبنتي معترفا بجرمه و لكن في زمن مثل زماننا نتكلم عن الدين أكثر مما نفهمه ... نمارس العبادات و لا نعمل بشئ منها.... ننافق من<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

