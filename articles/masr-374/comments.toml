[[comments]]
order = 31
subject = "إزدواجية مجتمع"
author = "عبدالكريم نبيل سليمان"
posted = "2006-05-28"
text = "عندما أقرأ التعليقات على هذا الموضوع أشعر بالإشمئزاز الشديد وأوقن حقا أن مجتمعنا هذا على شفا هاوية سحيقة لا قرار لها لعدة أسباب منها أنه لا يقر حق كل إنسان فى أن يقيم علاقة جنسية بعيدة عن قيود الزواج ، ثانيا أنه يرفض نشر الثقافة الجنسية الآمنة التى تمكن طرفى أى علاقة جنسية من تلافى أى مسؤلية مستقبلية قد تنتج عن هذه العلاقة إن أدت إلى الحمل ، ثالثا أنه يحمل المسؤلية عن ذالك لطرف واحد هو الطرف الضعيف إجتماعيا ( المرأة ) وينظر إلى الرجل على أنه كائن لا يخطىء مهما صدر منه !! ...<br />إحدى المعلقات إتهمت د.حمدى الحناوى بأنه ديوث لأنه لم يحذو حذو خال هنادى ويسيح دمها على قوائم الشرف الرفيع لمجرد أنها أحبت شابا من كل قلبها إكتشفت فيما بعد أنه ذئب بشرى ليس إلا ، وبالطبع ستجد هذه الفتاة إن وقعت فى نفس المشكلة التى وقعت فيها هند إما أن تحذو حذو آلاف الفتيات اللاتى تكتظ بهن عيادات الأطباء لإجهاضهن سرا وترقيعهن مرة أخرى ، ولكن هند كانت أشجع وأرقى وأشجع ألف مرة منهم جميعا ، فقد وقفت فى وجه المجتمع وأبت إلا أن تصرخ بحق إبنتها فى الحياة بكرامة ...<br />هند تستحق كل التقدير والإحترام منا جميعا وأستعجب من إستغراب كاتب المقال من إستشهاد القاضى بأبيات شعر لنزار قبانى بدلا من أن يقرأ آيات من القرآن أو نصوصا من الأحاديث النبوية ، وأتسائل : لماذا نريد أن نحكم الدين فى كل مناحى حياتنا بهذه الصورة المؤسفة ؟؟ الدين لا مكان له سوى داخل قلوب أتباعه وبين جدران دور العبادة ، أما القوانين المدنية العلمانية هى التى يجب أن يحتكم اليها داخل قاعات المحاكم ، وأعتقد أن أبيات نزار قبانى التى ذكرها القاضى أكثر عدلا ورحمة من الحديث المنسوب الى محمد ( الولد للفراش وللعاهر الحجر ) الذى ستتحول حياة الناس بمقتضاه الى جحيم لا<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

