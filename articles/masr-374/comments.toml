[[comments]]
order = 39
subject = "صدمتنى التعليقات"
author = "misriya"
posted = "2006-06-05"
text = "صدمتنى التعليقات فمعظمها متطرفة والتعليق المختلف للأستاذ عبد الكريم هو تعليق متطرف فى الاتجاه العكسى لكن هناك عدة نقاط مهمة فى رأيى أولها أن الحكم لم يكن لصالح هند وانما هو لصالح لينا فالعقاب الحقيقى فى مجتمعنا هو من المجتمع نفسه الذى عاقب بل وسيظل يعاقب هند - وأنا هنا لاأناقش قضية هى مخطئة أم لا - ولكن فقط أنبه أنه ليس حكما فى صالحها. ثانيا الكلام أن هذا الحكم سيشجع الزنا والزواج العرفى وما إلى ذلك كلام غير واقعى وكاتبه فى الغالب لا يدرك واقع حال المجتمع المصرى فالمجتمع المصرى المتحفظ والمتدين لن يقبل الزنا والزواج العرفى وأؤكد أن معظم فتياتنا المتدينات لن يقعن فى الزنا لمجرد اطكئنانهن أن طفل الزنا سينسب لأبيه - ولا أعتقد أن هذه مشكلة من أساسه لأن هناك وسائل منع الحمل لمن يريدها وهناك من يرضى بالاجهاض- ولكن معظم الفتيات متدينات وحتى غير المتدينات فهن حريصات أن يجنبن أنفسهن وأهلهن الفضيحة. ولذلك أعتقد أن مثل هذا الكلام قذف فى حق معظم الفتيات المصريات المتدينات. ثالثا الدين روح وحياة ومعاملةوأنا هنا لا أنكر حديث الرسول عليه السلام ولكن فقط أقول لو كنا مجتمعا محترما يطبق الإسلام الحقيقى وليس الشكلى فقط ربما أمكن تطبيق حديث الرسول لكن للأسف نحن مجتمع لا يهتم إلا بالظواهر وسيعاقب لينا على فعل لم تقترفه لذلك فرأيى الشخصى أن الحكم صائب لأنه سيقلل الضرر الواقع على البريئة لينا وكما هو معروف فدرء الضرر مقدم على جلب المنفعة لذا فأنا أرى ان القاضى لم يخطئ وكل ما فعله أنه استفتى قلبه هل الهدف من حديث الرسول عقاب الطفل أم عقاب الزناة -وأنا لا أقصد هند وأحمد تحديدا فالله أعلم ببواطن الأمور- وأنا أرى أن العقل يقول أن الهدف هو عقاب الزانيين وهو أمر لن يتحقق بصدور حكم برفض النسب بل على العكس<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

