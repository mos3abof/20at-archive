subject = "تعرف ان عندك حق يا عبد الله"
author = "نيفين"
posted = "2006-05-28"
text = "اختلفت بينى و بين نفسى عندما قرات تعليق زميلنا عبد الله مفتاح و قلت ليه الشتيمه يا عبد الله لما قال على هند بجحه لانى مش بحب اتكلم اوى لو الموضوع خصوصيات شخص حتى لو الموضوع مطروح اعلاميا للرايح و الجاى زى حكايه هند و احمد<br />بس بجد عبد الله عنه حق<br />و بقولها لاول مره<br />البت اللى اسمها هند دى فعلا بجحه جدااااااااااااااااااااااااااا<br />تخيلو امبارح ف لبقلهره اليوم ف اخر اللقاء بتاعه اللى فاتنى و ملحقتش الا اخره(و ده احسن بدل ما كانت مرارتى تنفقع)تصورو محمود سعد بيقوللها تنصح الناس و تقول ان التجربه كانت سيئه و انها استفادت<br />ترد الهانم تقول لا انا مبسوطه بالتجربه و كانت نفيده و اتعلمت منها<br />محمود يجيبها كدا يجيبها كدا هى مصره و تقوله دا بالنسباللك انت<br />لدرجه ان الراجل اتكسف لها سلف<br />صحيح ان لم تستحى فافعل ما شئت<br />الب"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

