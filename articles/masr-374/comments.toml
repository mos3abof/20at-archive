[[comments]]
order = 11
subject = "مصيبة المصائب"
author = "عفاف"
posted = "2006-05-27"
text = "كل شويه حد يعمل غلط سواء ولد ولا بنت وبعدها يبكي ويكشف عن مصيبته ويجبها فى الاسلاميعني هي زنت واحمد زني باعترافه على الأقل وبعد كده تيجي عايزة تخالف الإسلام وتتباكي وتقول إن ده ظلم<br />أولا ربنا ما بيظلمش ده ربنا بيصبر على بلوينا وانا مستاء من الأتنين زي بعض بس ال أنا مستغربلوا فعلا يا جماعة الديوث ال شهر ببنته على الفضائيات ومعترض على الشرع أبوها وفي رسالة مش لاقي أحسن منها قنبلة تنفجر فى وشه يمكن يفوق من العته ال هو فيه حديث صحيح فى كتاب صحيح الجامع الصغير للشيخ الألباني<br />يقول الرسول عليه الصلاة والسلام<br />\"(ثلاثة قد حرم الله عليهم الجنة : مدمن الخمر والعاق و الديوث الذي يقر في أهله الخبث)<br />والقاضي ال ملاقاش حاجة يستند اليها فاستدل بقصيدة لنزار قباني ال الازهر والعلماء ومفتي السعودية أقروا بأنه كافر متطاول على الله يا فرحتي والله ديه من المضحكات المبكيات حسبي الله ونعم الوكيل"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

[[comments]]
