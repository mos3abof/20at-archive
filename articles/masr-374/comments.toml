subject = "قدوة سيئة"
author = "مليكة"
posted = "2006-06-02"
text = "اناحكتب مصري لاني ضعيقة بالعربي واتكسف اكتب فرنيس وانا عربية انا كنت فاكرة اني المغرب متفتح لدرجة كبيرة اترين مساكين جنبك ياهند لان نوع القضية جديد علينا كعربيات دائما مبدا الستر طاغي علينا وانت فضحتينا وخليت المراهقات يجعهرو بالمعصية ويقولو هند ومامتها ليبراليين بكل ماتحمل الكلمة"
