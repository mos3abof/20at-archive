subject = "شئ محزن"
author = "بصوا يا جماعه الى تقبل على نفسها الزنا والخفا تستحمل اى شئ بعدها لانها فى الى رمت نفسها فى الوحل وابوها الديوث الى كل ما يطلع يفضل ساعتين يدافع عن الحروسه بنته والستات الى شكلها غريب دول بتوع جمعيه النسوان يفضلو يدفعوا عنها وكان احمد الفيشاوى داه الذئب الى اغتصب برائتها"
posted = "2006-05-27"
text = "وهو كمان ما كنتش اتصور انه بالشكل البشع داه ربنا يهديه الى محيرنى ايه الى كان نقصهم عشان يتجوزوا زى خلق ربنا اكييييييد ما كنش لاقى ياكل ومفيش شقه<br />بس ارجع واقول حرام عليكوا البنت الصغيره دى الى حكمتم عليها بالاعدام"
