author = "بطلي خنوع وعبط بقى"
posted = "2006-05-28"
text = "الناس دول اوساخ يستاهلو اكتر من كده<br />والبنت الغلابنة الصغيرة ده<br />سواء اخدت اسم ابوها بالتلفيق زي ما حصل<br />او لم تأخذ اسم المحروق احمد الفيشاوي<br />فربنا هو اللي الذي يكتب القدر والمكتوب<br />يعني ده قدرها ... تكون مفضوحة<br />وممكن عادي قوي قوي ومتوقع انها تطلع<br />زي امها .. بالضبط ...<br />وممكن تكون تقيه ورعه والله وأعلم .<br />ولكن المؤشرات تدل على انها<br />راح تكون زي امها .<br />يعني مين اللي راح يربيها .<br />ام جاهلة بالدين ما تعرفش حاجة في الدين<br />ولا تعرف حاجة عن ربنا<br />وحتفضل كده ، يعني مش راح تتعلم حاجة<br />لان ابوها معندوش دين يعلمها دين<br />وامها ما تعرفش حاجة عن الدين<br />علشان يعلمها دين<br />فيه فرق بين البيت المسلم<br />اللي يترتبي على مائدة الكتاب والسنة<br />وبين البيت المسلم اللي يتربي على<br />الهشك بشك وده غلط وده صح<br />فكل واحد بيشوف الغلط والصح بمزاجه<br />العاهرة هي التي تزوج نفسها .<br />وكما قال الرسول صلى الله عليه وسلم .<br />لا نكاح إلا بولى .. او كما قال الرسول صلى الله عليه وسلم ....<br />وطبعا الحمار اللي ما يفهمش الحديث ومش عايز يفهم .<br />يغور في ستين داهيه تلعنه .<br />اما تروح تنام بالليل والنهار في شقته<br />وتيجي تعمل لنا شريفة وتعيط وتنهق<br />ترسم الكلام ده على حد غيرنا الكلام<br />ده مفهوم قوي قوي ومفقوس .<br />وطبيعي"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

