text = "الى هند وأبيها وأمهاوأحمد لو رجع الزمن بنا للوراء لأقيم على هند وسي أحمدحدا شرعياولكننا في زمن العجايب ولاحول ولاقوة الا بالله اللهم اني أشهدك وملائكتك وحملة عرشك أنني برىء من كل هذاولا أجدأفضل من حديث المصطفى صلى الله عليه وسلم اذا لم تستحي فافعل ماشئت الذنب لايبلى والديان لايموت 0 والى لقاء تحت ظل عدالة سماوية 0"
