subject = "النهاية الصحيحة"
author = "احمدعلى"
posted = "2006-05-27"
text = "نهايةهذه القضيةهى النهاية الصحيحةويكفى ان هند بقت فضيحتها بجلاجل وهى سعيدة بذلك لانها من اسرة تهوى الفضائح والبجاحة وقامت هذه الاسرة بالتشهير ببنتهابل من تربيتهاوللاسف والدها رجل علم ومجتمع ولقدانكشف الذئب احمد الفيشاوى بعد ان كان يخدعنافى الفضائيات باسم الدين والدين منه برىءووالده ابجح منه فبدلا من صفعه على وجههليعيد له صوابه اخذيسانده فى فعلته الشنعاء اذ ان احمد كان يفتخر انه كان على علاقة زنا بهندحسبى الله ونعم الوكيل هل تغيرت المبادىء والمفاهيم والثوابت الدينيةونحن لا نعلم والكاسب الوحيد هو الطفلة البريئة التى ولدت من ابوين اقذر من بعض اب مخادع ليس له دين وام ليس عندها حياء فالاجدر لهذه الطفلة ان تربى بعيدا عن هؤلاء وربنا يسامحهم ويسامحنا"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

[[comments]]
order = 9
subject = "بنتى ..بابا..حكمتك يا رب"
author = "نيفين"
posted = "2006-05-27"
text = "بصو يا جماعه<br />يمكن احمد يكون ظلمها<br />يمكن هى ظلمته<br />بس الاكيد ان هماالتنين ظلمو كائن تالت برىء اسمه لينا<br />المجتمع لا يرحم للاسف<br />و يكفى انها ف يوم من الايام تدعى عليهم هما الاتنن<br />صدقونى التعاطف موجود مع الجميع<br />هو كفنان خسر كتير بالفضيحه دى<br />وهى كبنت فقدت سمعتها<br />و الاهل اللى بردو نابهم من الحب جانب<br />بس ف النهايه هما الاتنين غلطانين<br />و فعلا لا يصح نسب ابن الزنا<br />مش بقولكم البنت اللى اتظلمت"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

