[[comments]]
order = 44
subject = "الله الأعلم..."
author = "بنت دبي"
posted = "2006-08-08"
text = "السلام عليكم ورحمة الله وبركاته ..<br />إنني لا أنكر الفعل الخاطئ لهند بحملها وتهاون أهلها معها ، ولا أنكر خطأاحمد أن كان قد زنا معها ، ولكنني أعترض على بعض التعلقيات اللاذعه التي وجهت لأحمد من حيث أنه كان يتظاهر بالورع والتقوي من أعلم بالنفوس والقلوب أيها الاخوه أنحن أم الله ، من اين جاء لنا الحق بالتجريح والحكم لما في داخله ، وأيضا هند ستر الله عليها صحيح ان العلانيه التي اظهرتها في قضيتها بها نوع من الجرأة وكذلك أهلها الذين استغرب الكثير موقفهم ، ولكن لايحق لنا التجريح والقاء التهم عليهم ، بل يجب علينا الدعاء لهم بالهداية والستر ، فكلنا خاطئون ، وفي الاخير الله الاعلم بالقلوب والنفوس .. وستر الله جميع بنات واولاد المسلمين والمسلمات"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903170920/http://masr.20at.com:80/article.php?sid=374"

[[comments]]
order = 45
subject = "لا للرياء الديني ولا للزواج العرفي"
author = "رباب كمال"
posted = "2006-10-15"
text = "هذا المجتمع يتشدق بالدين يمينًا ويسارًا لكنه لا يفعل ما يمليه عليه دينه ، الحكم الذي أصدره القاضي كان حكمًا عادلًا يرضي ربنا ، هند ثبتت على قصتها من البداية ولم تتغير بينماتغيرت قصة الفيشاوي أكثر من مرة ، بدأها بأنني لا أعرف الفتاة أصلًا ثم قال أنه كان مجرد زميلا لها وكانت تشكي له بعض همومها ( بيحل عقدها يعني) ثم أطلعنا على أنه زاني في برنامج اللت والعجن ( البيت بيتك )<br />المجتمع يحب الفضائح ولم يكترث أن هند قالت ألف مرة أنها زوجة لكنه صدق أحمد الذي غيّر قصته أكثر من مرة<br />هند غلطانة في رأيي لأنها تزوجت عرفيًا لكن خطأ الزواج العرفي ليس كالزنا<br />( لست ممن يؤيدون هذا الزواج السري ولكن المشكلة في الدعاة الذين لا يحرمونه ويحللونه )<br />تمسكت هند بحق ابنتها في الحياة ولم تجهضها كما أراد المجتمع المتحفظ المتدين!!!<br />والدا هند لم يرضخا لهؤلاء المتشدقين بالدين الرافعين لواء الإسلام ، أما أحمد فهو مثال للنذالة والسفالة وكمان له عين يتمسح في الدين ، كان على الدعاة الذي استنجد بهم وأشاروا عليه وعلى هند بالإجهاض وأن هذا حلال ، كان عليهم أن يذكرونه بأن الله هو المنتقم الجبار وأنه لا يأمن مكر الله إلا القوم.الكافرون وألم يقولون له ما حكم المجاهر بالفاحشة<br />أتفق مع السيدة المحترمة صافيناز كاظم حين قالت أنه أعطاها ورقة زواج عرفي بينما يبيت هو نية أخرى<br />ولا حول ولا قوة إلا بالله"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117141049/http://masr.20at.com:80/article.php?sid=374"
