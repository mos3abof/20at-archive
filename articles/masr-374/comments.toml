text = "كان اجمل و اعدل تعلق هو : التعليق بواسطة : عبدالكريم نبيل سليمان<br />شكرا له لانه اضاء للجميع شعله الحق<br />و اضيف عليه انه لو اراد الرجل ان يكسب الاجر في طفلته التي هي من دمه و لحمه لتزوج من هذه الفتاه حتي و ضعت مولودها ثم شك انه ليس الاب ليطعن في ذلك . و سوف تاخذ القضيه مسار اخر .اي مسا ر الدي ان ايه"
