subject = "21/11/2005"
text = "قال تعالى: \" بشر المنافقين بأن لهم عذابا أليما . الذين يتخذون الكافرين أولياء من دون المؤمنين . أيبتغون عندهم العزة فإن العزة لله جميعا\".[النساء138و139]<br />هذا نص حوار نائب المرشد العام للإخوان المسلمين لقناة الجزيرة<br />محمد خيرت الشاطر [متابعاً]: في دائرة وادي النطرون إحنا بندعم مرشح قبطي هناك في مواجهة الوزير اللي موجود مرشح الحزب الوطني، المرشح القبطي مرشح مستقل.<br />أحمد منصور: وادي النطرون وزير الزراعة المرشح فيها.<br />محمد خيرت الشاطر: آه وزير الزراعة إحنا بندعم مرشح قبطي هناك مستقل إتصل بينا ونسقنا معاه ووافقنا على دعمه بشكل واضح وبالتالي مش قاعدة إن إحنا ما بندخلش في كل دوائر الوزراء أو الشخصيات الكبيرة.<br />أحمد منصور: بخصوص المرشح القبطي ما طبيعة العلاقات والتحالفات بينكم وبين الأقباط؟<br />محمد خيرت الشاطر: نحن على قناعة إنه لابد من تمثيل الأقباط في الحياة السياسية، شأنهم شأن أي فصيل آخر موجود في المجتمع المصري بغض النظر عن قضية الدين إنما إحنا بنتكلم عن قضية مصر الآن وقضية نهضة مصر وبناءها بعد حالة التخلف الشديدة وبعد تفشى مثلث التخلف والفساد والاستبداد اللي موجود وبالتالي نحن نرى إنه كل القوى لابد أن تكون موجودة وممثَلة وعلاقتنا بالأقباط علاقات صحية ومستمرة وليست وليدة هذه الأيام وليست مرتبطة بالانتخابات وده أمر بيأمرنا به ديننا أصلا.. يعني المسألة مش مسألة تكتيك ولا مسألة سياسة كما يحاول البعض أن يروج وهمّ الأقباط اللي اتصلوا بينا، إحنا في الانتخابات السابقة تعاونا مع الأستاذ منير فخري عبد النور وتركنا دائرة الوايلي أو دعمناه فيها وهذه المرة أيضا نفس الموقف وكذلك في دائرة وادي النطرون ولا مانع لدينا من التعاون مع أي مرشح قبطي أو أي مرشح من أي قوى سياسية أخرى أو من أي فصيل آخر طالما بيتفق معانا في الحد الأدنى المشترك المتعلق بقضية الإصلاح السياسي في مصر.<br />فهذه نقولات عن أهل العلم تبين حكم مظاهرة الكفار على المسلمين ومعاونتهم بالسلاح أو المال أو الرأي .<br />وقد جاء النص الصريح من كتاب الله عز وجل على أن من اتخذ الكفار أولياء من دون المؤمنين أنه : منافق .. لا يؤمن بالله ولا بالنبي وما أنزل إليه .. وأنه من جملة الكفار الذي والاهم ونصرهم.<br />1- قال تعالى: \" بشر المنافقين بأن لهم عذابا أليما . الذين يتخذون الكافرين أولياء من دون المؤمنين . أيبتغون عندهم العزة فإن العزة لله جميعا\".[النساء:138،139].<br />2- وقال تعالى : \" ترى كثيرا منهم يتولون الذين كفروا لبئس ما قدمت لهم أنفسهم أن سخط الله عليهم وفي العذاب هم خالدون . ولو كانوا يؤمنون بالله والنبي وما أنزل إليه ما اتخذوهم أولياء ولكن كثيرا منهم فاسقون\" [المائدة:80 ، 81].<br />3- وقال تعالى \" ياأيها الذين آمنوا لا تتخذوا اليهود والنصارى أولياء بعضهم أولياء بعض ومن يتولهم منكم فإنه منهم إن الله لا يهدي القوم الظالمين . فترى الذين في قلوبهم مرض يسارعون فيهم …\" إلى قوله \" يا أيها الذين آمنوا من يرتد منكم عن دينه فسوف يأتي اله يقوم يحبهم ويحبونه …\" الآيات ، [المائدة 51-57].<br />4- وقال تعالى: \" لا يتخذ المؤمنون الكافرين أولياء من دون المؤمنين ومن يفعل ذلك فليس من الله في شيء إلا أن تتقوا منهم تقاة \".[آل عمرن:28] إلى غير ذلك من الآيات الدالة على هذا المعنى ، المؤكدة له ، تأكيدا يمنع تأويل الجاهلين ، وتحريف المبطلين."
