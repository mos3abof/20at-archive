[[comments]]
order = 10
subject = "فيه حاجات غلط !!"
author = "عبدالرحمن"
posted = "2006-07-11"
text = "النوبه يا جماعه اتطلمت جغرافيا و تاريخ !<br />ظلم الجغرافياواضح .. فيه ايه بعد الغرق !<br />ظلم التاريخ لو كان بس فى تجاهل الحضاره النوبيه ممكن نبلعه انما الغلط مايتبلعش !<br />أنا درست و ولادى النهارده بيدرسوا ان الفرعون الفلانى أرسل حمله شرقا لصد غزوات الحثيين أو الهكسوس .. أو أرسل حمله لصد غزوات مش عارف ايه ... كويس بعد كده تلاقى فى نفس المقرر أن الفرعون الفلانى أرسل حمله جنوبا لتأديب قبائل النوبه !! ايه شعورك و انت قاعد وسط زمايلك بترس ان المرحوم جدك كان راجل قليل الأدب ؟ و الدروس دى ما وضحتش ايه نوع قلة الأدب اللى كان بيعمله .. كان بيحدف طوب على التجار اللى رايحين يعملوا تجاره ويا بلاد بونت .. ولا كانوا بيعاكسوا بنات الفراعنه ."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072023/http://masr.20at.com:80/article.php?sid=132&PHPSESSID=b92400608b4d872f561b8e7d011bf4c9"

