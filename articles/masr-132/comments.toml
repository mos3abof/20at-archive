order = 0
subject = "محدش قال انك بكار .. انت باسم"
author = "ولله يا باسم انت فتحت نفسي على اسوان اكتر ماهى كانت مفتوحة .. فعلا النيل هناك من اجمل ما يمكن والناس فعلا مرسوم عليها ابتسامة متعرفش منين .. في وشهم بجد تعرف معنى البشاشة."
posted = "2006-04-05"
text = "اما القناة التامنة فهي فعلا قناة القرود مش عشان سود وبتاع اطلاقا .. لان مفيش بني ادم طبيعي يعمل قناة زي دي .. فاللى عملها قرود بحق<br />موضوعك رقيق ع القلب ونيسمه حلو<br />اتمنى اقرالك تاني يا باسم"
archived = "2006-04-15"
capture_url = "https://web.archive.org/web/20060415170825/http://masr.20at.com:80/article.php?sid=132"

