subject = "انا بكاره..."
author = "هووووبه ..هبهوب .. اسمره \"المره دي \""
posted = "2006-04-06"
text = "يا جدعان .. دول عالم اسمره اسسسسسمره<br />عني لوني المفضل ... يعني البت ام ضفاير اللي<br />كانت في فيلم مافيا<br />يعني سيا سيا واه سيا<br />يعني الارض تتكلم نوبي ومهما كان توبها امن توبي ."
archived = "2006-04-15"
