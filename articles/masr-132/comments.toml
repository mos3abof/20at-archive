[[comments]]
order = 3
subject = "مسلمه"
author = "مسلمه"
posted = "2006-04-06"
text = "انا من اسوان لكنى من الناس اللى هاجروا من زمان من سنه 60<br />لكن عائلتنا مكانتش منفصله ابدا عن الصعيد وخصوصا ان امى مازالت ثقافتها اسوانيه 100%<br />وصحيح ان الشباب الصعيد دلوقتى بقوا يلبسوا الحلو كله والبنات بقت اخر موضه\"طيبين اوى\"<br />بس الحقيقه لسه فيه الحمار بجانب العربيات ولسه نسبه الاميه كبيره وكمان لسه عاده الزواج من القبيله او العيله<br />الحقيقه الناس فى اسوان مبقتش زى زمان انفتاح كتيييييييييييييير ودين قليل هى دى الحقيقه<br />اللى فى جزيرتنا والبلاد اللى حوالينا ومش بعمم<br />بس اجمل حاجه فى اسوان البيئه النظيفه والخضراااااااا والضفاير<br />واجمل حاجه لغتنا اللى من الصعب على المصراويه او \"الفلاحين\" زى ما بنقول فى اسوان يفهموها<br />وعلى العموم اتوحشتنى البلد جوى والملتوت والاجراص مع السخينه والجبنه الجديمه<br />اللهم اتنا فى الدنيا حسنه وفى الاخرة حسنه وقنا عذاب النار"
archived = "2006-04-15"
capture_url = "https://web.archive.org/web/20060415170825/http://masr.20at.com:80/article.php?sid=132"

[[comments]]
order = 4
subject = "نخيل النوبه العالى"
author = "مناضل أنترنتى قديم"
posted = "2006-04-14"
text = "السلام عليكم و رحمة الله و بركاته<br />الله يسامحك يا عم باسم أنت قلبت علينا المواجع<br />واحشتينى أوى يا بلدى والله انا مقصر فى حقك<br />تعرف يا باسم انا النوبه عندى هى ما قبل السد و على الرغم ان انا و انت و جيلنا كله ما شافهاش بس كان نفسى اعيش فيها<br />انا جدتى أسال الله ان يسكنها فسيح جناته كانت بتحكيلى عنها و ازاى الناس كانت بتموت من الحسره لما خرجوا منها كانت بتحكيلى عن ليلها و نخيلها والفيضان وعن اعتزاز النوبى بأنه نوبى<br />و للأسف فعلا نظرة الناس للنوبى لسه ضيقه اوى يمكن الاعلام ساعد فى كده و لم يبرز مثلا دور اللغه النوبيه فى انتصار أكتوبر العظيم و لما بتيجى السيره ديه بتكون على استحياء<br />تعرف ان المجتمع النوبى اتغير اوى و شهد أول جريمة قتل بعد بناء السد و تهجير بلاد ما جنوب السد لشماله اتغيرت الناس و ضاعت الاخلاق ولكن يفضل النوبى هو النوبى<br />عامة تشكر يا عم باسم انك فكرتنا بريحة النوبه و بلدى أبو سمبل"
archived = "2006-04-15"
capture_url = "https://web.archive.org/web/20060415170825/http://masr.20at.com:80/article.php?sid=132"

