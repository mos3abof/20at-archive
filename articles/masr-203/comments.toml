subject = "تصحيح بسيط"
author = "هلاعمي"
posted = "2006-04-23"
text = "تحية وشكرا على الموضوع والمعلومات لكن تصحيح بسيط للموضوع اول فيفا ظهرت كانت \"فيفا 94\" (وانا شخصيا لعبتها في ذلك الوقت) على جهاز السوبر ننتندو، واختلف مع الاخ طارح الموضوع واقول ان اجمل لعبة كرة قدم هي \"ويننج الفين\" او نسختها الانجليزية \"انترناشونال سوبر ستار سوكر\" خصوصا اذا بتلعبها على بلاي ستيشن 2"
