posted = "2006-11-09"
text = "اجوكم ان تنصرو شعبنا وان تقفو معة فى كل الظروف وان تدعو لة بانصر وان تدافعو عن حقوق الاطفال فامس كان هناك مجزة فمن من الحكام العرب الجرب قال ان هذة جريمة هزيلة وارهابية ارجوكم الدعاء الى شعبنا الصمود وان تسعو للوحدة الوطنية حيا اللة شعب مصر وفلسطين والعراق والامة العربية والاسلامية ارجوكم الدعاء للقسام وحماس وفتح اخوكم مقاوم من القسام والقوة التنفيذية"
