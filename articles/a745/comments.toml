subject = "الى الأخت هدى"
text = "انا يا ستي هاقولك مين وائل عباس :<br />ده واحد عاطل عن العمل في نهاية العشرينات من العمر عنده حقد غريب المنشأ على الاخوان المسلمين يعني تقدري تقولي زي حقد الأطفال غير المبرر .<br />للأمانة طبعا هو كمان بيسمي نفسه صحافي الكتروني وكاتب مقالات بس لو تقرأيها مش حتمسكي نفسك من الضحك يعني حتفكرك بمواضيع الانشاء بتاعة الابتدائي .<br />طبعا هو بيحاول الحصول على الشهرة من خلال شتم المشاهير وليس مهما نوعية هذه الشهرة فهنالك الكثير من الراقصات مشهورات وهنالك الكثير من العملاء مشهورين يعني مش كل شهرة تبقى محمودة وكويسة .<br />وعشان تعرفيه اكثر روحي الوصلة دي :<br />http://bahzani.org/bahzan%20Ordner/b92.htm<br />طبعا هو حيشتم فورا كالعادة بس مش مشكلة فهو لو شتم فده يدل على التربية .<br />احمد الشاذلي"
archived = "2004-12-12"
capture_url = "https://web.archive.org/web/20041212094103/http://www.20at.com:80/article.php?sid=745"

