[[comments]]
order = 3
subject = "وائل عباس"
text = "انا حضرت الندوة بتاعته في نقابة الصحفيين امبارح<br />الندوة كانت جامدة جدا<br />اجمد ما فيها كان الشاعر احمد فؤاد نجم *****<br />ورجل اعمال شهير كان عضو بمجلس الشعب واستقال وقف وقال بالفم المليان وهتف الصحفيين وراؤه: يسقط حسني مبارك !!!<br />لوحظ في الندوة غياب المشاركة والتواجد الاسلامي والاخواني !!!<br />اه يا جبناء<br />هاهاها<br />تم حذف الكلمات مكان العلامة*** وذلك لأحتواءها علي ألفاظ خارجة"
archived = "2004-12-12"
capture_url = "https://web.archive.org/web/20041212094103/http://www.20at.com:80/article.php?sid=745"

[[comments]]
order = 4
subject = "براحة يا وائل"
text = "يا سلاااااااام المقدم وائل أخيرا ألقى القبض على ذمة الإخوان و الإسلاميييييييييييين و طلعهم جبنا و ولاد 60*70 و الدليل على كده انخهم بيعتقلوا *******<br />معلش يا خويا<br />معاك حق كان لازم ييجي اي واحد اخوانجي و يمضي حضور و انصراف عند خضرة جنابك<br />ياعااااااالم كفاية خنقتونا<br />تم حذف الكلمات مكان العلامة*** وذلك لأحتواءها علي ألفاظ خارجة"
archived = "2004-12-12"
capture_url = "https://web.archive.org/web/20041212094103/http://www.20at.com:80/article.php?sid=745"

[[comments]]
order = 5
subject = "وائل عباس"
text = "والله كان بودي ييجي اي حد منهم يقول نص كلمة حتى مجاملة علشان يخزي العين !!!<br />لكن الان اتضحت معالم الصفقة ...<br />وبعدين ييجي واحد زيك مش اخوانجي *******<br />يهيص في التهييص لمجرد انه عدو لوائل عباس فدي مش موضوعية يا جاهل !!!<br />فلا انت اسلامي ولا حتى متاسلم وبتدعى ... انت واحد شوارعي وجاهل وبس ..."
archived = "2004-12-12"
capture_url = "https://web.archive.org/web/20041212094103/http://www.20at.com:80/article.php?sid=745"

[[comments]]
