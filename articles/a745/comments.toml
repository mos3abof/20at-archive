subject = "على النعمة ... يستاهل"
text = "ايه الى يخليه يلعب مع الاسد<br />وهو ماله و مال الحكومة.. تعمل الى هى عايزاه ...احنا بتوع الحكومة يعنى ملكية خاصة<br />و احسن لكل واحد بعد كده مش يمشى جنب الحيطة لأ يمشى جوه الحيطه و يابا من خاف سلم والى هيمشى جنب الحيطه بعد كده الحيطه هطأع عليه<br />و يحمد ربنا انه ماخدوهوش على المباحس ..هناك مابيرحموش<br />المهم هو اتعلم غلطته ومش هيعمل كده تانى"
archived = "2004-12-12"
capture_url = "https://web.archive.org/web/20041212094103/http://www.20at.com:80/article.php?sid=745"

[[comments]]
order = 1
subject = "غباء الحكومة المصرية"
text = "اللي بيلعب بالنار - ما يزعلش لو حرق صوابعه<br />أنا رأي إن الحكومة بتنفخ في نار هادية عشان تولعها<br />العنف حيكون رد فعله العنف<br />الفتوات الأربعة دول ممكن في يوم يكونوا ضحايا انفجار أو طلقة طائشة من عسكري أمن مركزي نموذجي<br />انفجارات التسعينات ممكن ترجع تاني، والعربيات اللي كل يوم كانت بتنفجر ممكن ترجع من تاني، وحوادث الاغتيال وضرب النار وقطع الطرق...<br />أنا مش متفائل بمستقبل مصر السياسي أو حتى الاقتصادي..<br />لو مصر ولعت من جوة، اللي بره مش حيستنوا علينا<br />في حديث نبوي \"\"قيل عنه أنه موضوع - اسرائيليات - وغير صحيح\"\": من علامات الساعة خراب الشام، وخراب العراق، وخراب مصر\"<br />بهذا الترتيب<br />وقيل أن خراب مصر سيكون بنضوب ماءها<br />اعتقد أن ما يحدث حالياً في العراق هو عقاب آلهي لسكوت الناس على ظلم الحاكم<br />واعتقد أن الشيء ذاته سيحدث لنا شعب مصر<br />وارى أن ذلك امر محمود، فاسترداد فلسطين سيحتاج مجاهدين لا يخافون لومة لائم ولا جور ظالم<br />واري أن ما يحدث في العراق أمر يبدو شراً لكنه خيراً، فكم من المجاهدين سيخرجون لنا من هذه التجربة..<br />الله يستر"
archived = "2004-12-12"
capture_url = "https://web.archive.org/web/20041212094103/http://www.20at.com:80/article.php?sid=745"

