subject = "انا للاسف قريت مقالاتة"
text = "انا و اللة باضرب نفسى علشان اهتميت بواحد زى الحيوان اللى اسمة وائل زفت دة و دخلت و قريت مقالاتة التى تدل على ان ثقافتة اللى بيحاول يبينها ليكم ما هى الا اكذوووبة كبيرة جدا و انة بجد مش فاهم اى حاجة فى اى حاجة و كل اللى هو عايزة هو ان يسوء صورة اسيادة البتاع اللى مش عايز اوسخ الكىبورد بكتبى اسمة مرتين بيقول ان الاخوان هدفهم الحصول على الحكم و انهم يحصلوا على الكرسى بأى شكل و دة اكبر دليل على جهلة و حقدة<br />شوف يا بتاع انت الاوان لو كانوا فعلا بيفكروا بالاسلوب المتخلف اللى بيفكر بية امثالك كان زمنهم انتهوا من زمان لان ربنا مش كان حينصرهم و يثبتهم و يخليهم لحد انهاردة الاخوان كوول اللى عايزينة هو النظاااافة نظافة بلدنا من كمامها الطاغين و المجرمين اللى عمالين يقبضوا على الشباب المسلم لمجرد انهم بيروحوا الجوامع و الحكومة اللى بيترد كوول واحد بيقول كلمة حق و بيقول ربنا اللة<br />انت لو بجد بتفهم او عندك ذرة عقل تتمعن شوية فى دعتوتهم و تشوف اية هى الواصيا العشر بتاعت سيدك و الاستاذ الشهيد حسن البنا كل الواصايا بتاعتة بتتكلم عن الاسلام مش الاسلام لا بتتكلم عن الايمان(ان كونت عارف الفرق بينهم) من الفهم و الاخلاص و الجهاد و ......الى اخرة احسن ليك يا عم المتخلف انت انك تروح و تقرا شوية بدل ما تورى للناس جهلك كدة و لحد ما تتثقف شوية وتعمل زى ما ربنا قالك (اذا بوليتهم فاستتيروا)<br />اة على فكرة بدل ما تفضل تشتم فى ناس افاضل الضفر اللى بيطروة من ايدهم برقبتكم روح اشتم فى الناس الفجار اللى بيضلوا الشباب او الناس اللى بينهبوا فى البلد و رصيتهم فى بنوك سوسيرا عدتت البلاااين"
