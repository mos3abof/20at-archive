[[comments]]
order = 24
subject = "اخوانجي اه ونص"
text = "اسكتوا<br />مش الموقع ده طلع تبع اسلام اونلاين<br />ومعاهم في نفس المبنى<br />وانا اللي كنت فاكرهم شوية شباب محترمين عاملين مشروع<br />طلعت العملية تبع التمويل الخليجي برضه<br />اخص على كده<br />عاوزين يغسلوا عقول الشباب ويلمعوا الرموز بتاعتهم<br />اتقي الله يا قرضاوي<br />دي كلها متر في نص متر اخرتك<br />يعني ها تمسك رئيس جمهورية ياخي<br />اتاري الموقع مليان حسن البنا ورموز الاخوان<br />كنا فاكرينه حاجة نضيفة للشباب بدون ايديولوجيات وبدون غسيل مخ<br />والمهم يا اخي كل واحد يكتب مقال ويمدح في نفسه في التعليقات<br />فاكرين اننا دقينا عصافير<br />حتى شوفوا والنبي التعليقات على الموضوع ده"
archived = "2004-12-12"
capture_url = "https://web.archive.org/web/20041212094103/http://www.20at.com:80/article.php?sid=745"

