subject = "رجعت ريما لعادتها الاديمة"
text = "رجعنا تانى ينزل اى مقال ضعيف او ممتاز ويتخانف وائل عباس مع الناس والناس يتخانقوا معاه والله يلعن ابو القال المهم ان انا مسبش حقى مادام الكلام ببلاش يا جماعة اما ان تتركوا وائل يقول ما يريد لا انتو كده كده مش مقتنعين او الاخ وائل يسكت ويكتب تعليقاته في موقع يرحبون فيه لان ده بكل صراحة وحياه صيامى انا نسيت المقال بيتكلم عن ايه وعمال اقرا ناس بيشتموا فى بعض<br />ادارة الموقع مش فى ايدها حاجة لان سياستها من الاول اللى نفسه فى حاجة يقولها<br />انتوا كده بتدمروا الموقع ببطء<br />وكل عام وانتم بخير وحقكم علية انا وانا اللى غلطان وصافى يا لبن"
archived = "2004-12-12"
capture_url = "https://web.archive.org/web/20041212094103/http://www.20at.com:80/article.php?sid=745"

