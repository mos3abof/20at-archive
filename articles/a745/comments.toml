subject = "وسام كمال"
text = "كيف حالك يادقدق<br />الموضوع طبعا حلو<br />بس متأخر قوى قوى قوى<br />الكلام ده بالنص موجود فى كل الصحف<br />وامبارح أنا حضرت ندوة التضامن مع قنديل فى النقابة<br />وقال نفس الكلام<br />الكارثة الحقيقية كانت فى كلام عبد الله السناوى<br />حتى اننى شعرت أنهم سيغلقوا القاعة<br />ويصفوا كل الموجودين فيها ..<br />بس ربنا نجانى الحمد لله<br />علشان ماليش لا فى الطور ولا فى الطحين.<br />ديه مصــــــــــــــــــــر يادقدق<br />بس أنا واثقة إن بكرة أفضل إن شاء الله<br />wesamkamal@hotmail.com"
