text = "فى اية يا جماعة هو كل موضوع لازم تخروجوا عن نصة كدة اللى عمال يشتم فى الاخوان و اللى عمال يرد علية<br />فى اية الاخوان دول جماااعة عريييقة و ليهم فروع فى كل مكان و مش واحد متخلف او حاقد زى اللى اسمة محتاس دة هو اللى يخلط فيهم محتاس دة لما يجى شراب فى رجليهم يبأة يتكلم عنهم دة ان حصل حتى خيط من خيوط الشراب"
