author = "ابومحسن غربة 27 سنه"
posted = "2009-05-25"
text = "هيفاء وهبي واخواتها من علامات يوم القيامه<br />* إنتشار العازفات والأغاني والمغنيات والراقصات .<br />) قال الرسول صلى الله عليه وسلم : سيكون أخر الزمان خسف و مسخ وقذف قالوا ومتى يارسول الله ؟ إذا ظهرت المعازف والقينات وشربت الخمور.(<br />اما العازفات و القينات، فعدد المغنيات علي القنوات العربية ليس كبيرا مقارنة بعدد العرب، و لا حتي عدد المغنيات في العالم يقارن بعدد الفتيات في العالم، و اما من يعتقد ان هذا شئ يحدث في زماننا هذا فقط، فليفتح كتاب الأغاني للأصفهاني و ليقرأ عجب العجاب."
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527024317/http://www.20at.com:80/t7kyk/12179-2009-05-25-12-56-16.html"

[[comments]]
