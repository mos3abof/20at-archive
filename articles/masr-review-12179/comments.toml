subject = ""
author = "كلمات بوس الواوا"
posted = "2009-05-25"
text = "ليك الواوا بوس الواوا خلى الواوا يصح<br />لما بوستو الواوا شيلتو صار الواواوا بح<br />ليك الواوا بوس الواوا خلى الواوا يصح<br />لما بوستو الواوا شيلتو صار الواواوا بح<br />بقربك خبيني غمرني ودفيني ، أنا من دونك أنا برداني اح<br />ليك الواوا بوس الواوا خلى الواوا يصح<br />لما بوستو الواوا شيلتو صار الواواوا بح<br />واوا…<br />ليك الواوا ليك…<br />اليلة أحلى سهرة عند احبابي<br />بدو اياني البس احلى تيابي<br />بلبس لعيونك يا حبيبي كل جديد ودح<br />ليك الواوا بوس الواوا خلى الواوا يصح<br />لما بوستو الواوا شيلتو صار الواواوا بح<br />بوثق فيك وبدي تبقى حدي<br />انتى بين الناس الأغلى عندي<br />واخر همي شو مايقولوا غلط ولا صح"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527024317/http://www.20at.com:80/t7kyk/12179-2009-05-25-12-56-16.html"

