[[comments]]
order = 10
subject = ""
author = "زخاري والحزب الوطني"
posted = "2009-05-26"
text = "إنذار قانونى لأمين \\\\\\\"الوطنى\\\\\\\" بالإسكندرية<br />الثلاثاء، 23 ديسمبر 2008 - 16:31<br />الحزب أساء التعامل مع عضو قبطى<br />الإسكندرية ـ جاكلين منير<br />تسلم سعيد الدقاق، أمين الحزب الوطنى الديمقراطى بالإسكندرية، إنذارا قانونيا برقم قيد (23630) على يد محضر محكمة باب شرق، حصل اليوم السابع على نسخة منه، بناء على طلب ممدوح زكى زخارى جرجس، بعد أن انضم إلى عضوية الحزب بتاريخ 9/8/2007.<br />كان زخارى قد تلقى اتصالاً هاتفياً من أمين الحزب بالمحافظة فى تاريخ 11/8/2007 طالبه فيه بسرعة التوجه إلى أمانة الحزب، حيث إنه تقرر تنفيذ سياسة الحزب باشتراك 40% من مسيحيى وأقباط مصر بالانخراط فى العمل السياسى بدلا من سياسة التهميش، ثم طلب منه ترك الكارنيه الخاص بالعضوية لعمل إجراءات الانتخاب له على مستوى دائرة باب شرق بالتعيين حسب النسبة المقررة.. ومنذ ذلك التاريخ لم يستطع استعادة الكارنيه ودفع رسوم تجديد العضوية رغم محاولاته المتكررة بعد اكتشاف عدم مصداقية الحزب.<br />الإنذار ذكر أن ما قام به الحزب يعد حرمانا للمواطن من حقوقه السياسية ومخالفة لمبادئ الحزب والدستور والقانون، وهو أمر غير جائز."
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527024317/http://www.20at.com:80/t7kyk/12179-2009-05-25-12-56-16.html"

[[comments]]
order = 11
subject = ""
author = "اعترافات زخاري"
posted = "2009-05-26"
text = "الاسم: ممدوح زكى زخارى<br />العنوان: حقا انمة رجل محترم اما انا فخطير على الامن القومى المصرى كما تدعى على كذبا وزارة داخلية مصر<br />ليتنى كنت ممدوح اسماعيل و ليس ممدوح زكى زخارى المصرى الذى منعت من السفر خارج مصر من 11 مايو 1992 و حتى و قتنا هذا انتقاما منى بسبب زيارتى الى دولة اسرائيل لغرض العلاج الطبى الغير متوفر فى مصر و كل الدول العربية و ايضا قيامى باداء مراسم التقديس بالقدس لكونى مسيحى مصرى؟ يشرفنى حقا ان يكون لى شرف التعرف بالشخصية الهامة التى ساعدت على اخراج السيد ممدوح اسماعيل خارج مصر من صالة كبار الزوار ليخرجنى انا كمان؟ مستعد لدفع مليون دولار امريكى لاى شخص يساعدنى على الخروج خارج مصر و ليعتبرنى ممدوح اسماعيل ولست ممدوح زكى زخارى جرجس المصرى المسيحى القبطى الشريف و لست القاتل؟"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527024317/http://www.20at.com:80/t7kyk/12179-2009-05-25-12-56-16.html"

