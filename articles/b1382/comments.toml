order = 1
subject = "بالله عليكم إخواني \" الشيعة\" ...هل هذه سمات آل البيت (عليهم السلام) ؟"
author = "روي من كتاب المناقب لابن شهر آشوب : أن الصادق عليه السلام, سـُئل عن أبي بكر وعمر . . ."
posted = "2006-10-22"
text = "فقال عليه السلام:<br />{ كانا إمامين قاسطين عادلين كانا على الحق وماتا عليه فرحمه الله عليهما يوم القيامه ! ! ! }<br />فلما خلي المجلس قال له بعض أصحابه :<br />كيف قلت يا ابن رسول الله (ص)؟!<br />فقال (ع)<br />: نعم , أما قولي كانا إمامين فهو مأخوذ من قوله تعالى :<br />(وجعلناهم أئمه يدعون إلى النار)<br />و أما قولي قاسطين فهو مأخوذ من قوله تعالى :<br />( وأما القاسطون فكانوا لجهنم حطباً )<br />و أما قولي عادلين : فهو مأخوذ من قوله تعالى :<br />( والذين كفروا بربهم يعدلون )<br />وأما قولي كانا علي الحق , فالحق علي عليه السلام .<br />وأما قولي ماتا عليه :المراد انه لم يتوبا عن تظاهرهما عليه , بل ماتا على ظلمهما إياه .<br />وأما قولي فرحمه الله عليهما يوم القيامه :<br />فالمراد أن رسول الله صلي الله عليه وآله وسلم ينتصف له منهما آخذاً من قوله تعالى :<br />( وما أرسلناك إلا رحمة للعالمين )<br />سلام الله على أئمتناأئمة الهدى وسفينة النجاة ومشاعل النور<br />الله ما أروعك يا مولاي جعفر ابن محمـّد ( ع )<br />{ الله أعلم حيث يجعل رسالته }<br />وأضيف بقيـّة الآية للتعرّف على مصير أئمة الضلال :<br />{ وجعلناهم أئمةً يدعون إلى النار ويوم القيامة لا يـُنصرون * وأتبعناهم في هذه الدنيا لعنةً ويوم القيامة هم مِن المقبوحين }<br />و أشهد أن الصادق (رحمه الله) برئ مما يفترون عليه"
