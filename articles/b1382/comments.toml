subject = "نصر الله يعترف ...بعد التدمير اهذا مجاهد يا عقلاء"
author = "مندور"
posted = "2006-10-31"
text = "نصر الله .. عندما يعترف!!<br />الخبر:<br />أكد الأمين عام لحزب الله 'حسن نصر الله' - في مقابلة تليفزيونية - أنه لو علم أن عملية خطف جنديين 'إسرائيليين' الشهر الماضي كانت ستؤدي إلى جولة العنف التي استمرت 34 يومًا 'لما قمنا بها قطعًا'.<br />وصرّح 'نصر الله' أنه 'لا جولة ثانية من الحرب مع إسرائيل'، معتبرًا أن قيام حرب ثانية مع 'إسرائيل' 'يخدم إسرائيل بالدرجة الأولى'.<br />التعليق:<br />طوال 34 يومًا هي عمر الحرب الأخيرة بين حزب الله وإسرائيل، والطيبون من بني أمتنا يهللون لحسن نصر الله حتى رفعوه إلى مصاف الأبطال البواسل والفاتحين العظام.<br />طوال 34 يومًا يرفض الطيبون من بني أمتنا الاستماع لنصائح العلماء والالتفات لوقائع التاريخ التي تؤكد أن ما يجرى في لبنان ليس إلا إعادة لمسلسل تكرر قبل ذلك منذ عشرات الأعوام، كان بطل المسلسل القديم 'كمال أتاتورك'، وبطل المسلسل الجديد 'حسن نصر الله'<br />غير أن الطيبين من أبناء أمتنا رفضوا إلا أن ينخدعوا كما خُدع أمير الشعراء أحمد شوقي الذي قال لأتاتورك: يا خالد الروم جدد خالد العرب، وما لبث شوقي حتى بكى الخلافة التي سقطت بأيدي 'خالد الروم' ذاته.<br />طوال 34 يومًا والمصلحون من أبناء أمتنا يجاهدون لتبيان الحقيقة وبذل النصيحة، ولا يلاقون إلا تهم الخيانة والعمالة وهم على ذلك صابرون، غير أنهم كانوا على يقين بأنه ما أن تضع الحزب أوزارها حتى تنكشف الحقائق أمام أعين الناس، وبدلاً من كثرة المقالات جاء 'حسن نصر الله' ليقدم لنا حديثه عن الحرب بمثابة اعتراف يهدم كل خطبه الرنانة وتصريحاته النارية ليس طوال الأيام الماضية فحسب بل طوال السنوات الماضية كلها.<br />اعتراف تأخر طويلاً:<br />استهل 'نصر الله' كلامه بالكشف عن جهل سياسي وعسكري سبق عملية 'الوعد الصادق'، حيث قال 'لم تتوقع ولو واحدا بالمائة أن عملية الأسر ستؤدي إلى حرب بهذه السعة وبهذا الحجم، لأنه وبتاريخ الحروب هذا لم يحصل.. لو علمت أن عملية الأسر كانت ستقود إلى هذه النتيجة لما قمنا بها قطعا'.<br />بالتأكيد إن نصر الله أراد من هذا التصريح الظهور في صورة بطل يخشى على وطنه!!<br />غير أن تصريحه ذلك لم يكن سوى صفعة قوية للمهللين له والمدافعين عنه، أولئك الذين انتقدوا وصف 'الوعد الصادق' بأنه مغامرة غير محسوبة، أولئك الذين رفضوا الحديث عن نوايا 'حزب الله' وأغراضه الحقيقية من 'الوعد الصادق'، ترى ماذا يقولون الآن؟، ترى هل يكذبون 'نصر الله' فيما قال؟، هل يتهمونه بالخيانة لقضايا أمته؟، أم ترى يستمرون في غيهم ويصفقون لبطولة 'نصر الله' المزعومة؟.<br />ولكن أية بطولة تلك وهو بهذا القدر من الجهل السياسي والعسكري؟، أية بطولة تلك وقد قدم لبنان لقمة سائغة لعدو متربص؟، أية بطولة تلك بعد دمار لبنان؟، حقيقة لم يحقق حزب الله سوى بطولة واحدة من وراء تلك المعركة، لقد نجح في استعادة ذكرى هزائم تاريخية يخرج منها المنهزمُ منتصرًا، لا لشيء إلا لأنه حافظ على قيادة حزبه وإن ضحى بلبنان في المقابل.<br />ثم ألا يجعلنا هذا التصريح نتساءل : أين المهللون المروجون للنصر العظيم الذي حققه حزب الله في المغامرة؟! إننا لم نسمع يوما أن منتصرا في معركة تمنى أنه لم يخض تلك المعركة!!!<br />ثم أليس لنا أن نتساءل: هل كان حزب الله يجهل حقًا حجم رد الفعل 'الإسرائيلي' المتوقع، أما تراه كان يعلم وتعمد ذلك، كما أشار نصر الله إلى أنه كان يعلم بوجود مخطط لضرب حزب الله، فهل كان يعلم نصر الله وتعمد ذلك لتشمل الضربة لبنان كلها لا حزبه فحسب، ولتكون تلك الضربة كفيلة بإرباك أية مشاريع سياسية سنية تحاول أن تظهر في الخريطة السياسية اللبنانية.<br />أيًا كان الأمر، فقد قدم نصر الله في تصريحاته تلك هدية لكل من جاهدوا لإثبات أن 'الوعد الصادق' لم يكن سوى 'وهم كاذب'.<br />وعد نصر الله:<br />يحمل تاريخ الصراع العربي – الإسرائيلي أسماء وعود كثيرة من أقدمها 'وعد بلفور'، ونستطيع أن نقول أن من أحدثها 'وعد نصر الله'، حيث شدد نصر الله على أنه 'لا جولة ثانية من الحرب مع إسرائيل'؛ أهكذا تنتهي 'آخر الحروب'، أهكذا تذهب هتافات 'حزب الله يا حبيب دمر دمر تل أبيب' أدراج الرياح، أهكذا تنتهي الآمال والأحلام التي صنعها حزب الله بالتعاون مع جوقة من أجهزة الإعلام، أين ذهبت وعود حزب الله ومن ورائه راعيته طهران بتحرير القدس وتدمير إسرائيل؟.<br />غير أنه يجب علينا أن نشكر 'نصر الله' لأنه ما فتئ يوفر علينا عناء التأكيد على أنه وحزبه لم يسعيان في يوم من الأيام من أجل تحرير فلسطين، حاول الكثيرون أن يثبتوا ذلك، وها هو الآن 'نصر الله' ذاته يؤكد للجميع تلك الحقيقة، غير أنه بدلاً أن يكتفي بإخراج نفسه وحزبه من دائرة المقاومة، سعى إلى إدانة أية حرب مستقبلية لتحرير فلسطين، بزعمه أن أية حرب ثانية مع إسرائيل سوف تخدمها، أليس في ذلك اعتراف بإسرائيل؟.<br />ولنا أن نتساءل عن السر وراء اقتران وعد 'نصر الله' مع تأكيد الرئيس الإيراني 'أحمدي نجاد' على أن بلاده لا تمثل تهديدًا لإسرائيل، فلم يفصل بين التصريحين سوى يوم واحد، ألا يشير ذلك إلى صفقة إسرائيلية إيرانية ترتب في الخفاء؟.<br />محاولة يائسة لاسترداد شعبية مفقودة:<br />حاول 'نصر الله' استرداد شعبية حزبه المفقودة، فزعم أنه لم يرغب في المشاركة بجلسة الحوار الوطني لأنه مستهدف ويخشى على المشاركين في هذا الحوار، ولكن ألا تكن تلك محاولة من نصر الله للهروب من المحاسبة والمساءلة التي تنتظره في جلسة الحوار الوطني؟، أليست تلك محاولة أخرى لإظهار نفسه في صورة البطل الذي يخشى على الآخرين؟، ألم يعد 'نصر الله' جنبلاط وغيره بعدم القيام بأي فعل قبل عملية 'الوعد الصادق' ثم نكث وعده؟، فلماذا لا يهرب 'نصر الله' منهم اليوم، ولماذا لا يظهر في صورة البطل؟، لماذا لا يفعل ذلك وهو يعلم أن من ورائه فضائيات سوف تصفق لبطولته الموهومة، وتغنى لشجاعته المعدومة؟<br />بين مقاومة السنة ومقاومة الشيعة:<br />وفي الختام يجب علينا أن نشكر 'نصر الله' مرة أخرى، لأنه قدم لنا الفرق الواضح بين مقاومة السنة، ومقاومة الشيعة، حيث قال: 'القيادات المعروفة من الحزب بألف خير، كذلك الكادر السياسي التنفيذي، التنظيمي والإعلامي والقيادات الأمنية، فعلى المستويين التنظيمي الأول والثاني لا شهداء ..'، وهذا هو الفرق قادة السنة لا يتأخرون عن التضحية بحياتهم من أجل أمتهم، أما قادة الشيعة فيقدمون صغارهم قبل كبارهم، والأمثلة على ذلك كثيرة، ففي فلسطين لا تسل عما قدمت حماس والجهاد من قادة وزعماء، وفي الشيشان في أشهر معدودة يسقط كبار القادة والرؤساء شهداء، وفي أفغانستان ضحت طالبان بالمنصب والحكم من أجل الحفاظ على البلاد والعباد، الأمثلة كثيرة في صفوف السنة، ولكن أين أمثلة الشيعة، لن تجد، هذا هو الفرق بين مقاومة سنية في سبيل الله، ومقاومة شيعية في سبيل السياسة"
