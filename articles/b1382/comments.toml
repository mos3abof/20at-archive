text = "الهاجس الإيراني من تزايد أهل السنة في الأحواز<br />صباح الموسوي<br />في الثامن عشر من الشهر الجاري أعلنت الصحافة الإيرانية ان سلطات الأمن في مدينة المحمرة الأحوازية ألقت القبض على شخص من أهالي المدينة يدعى\" س- آ \" بعد مداهمة منزله وقامت بمصادرة مائة وستون كتابا تحتوي على أفكارا سنية سلفية على حد تعبير المصادر الصحفية الإيرانية التي أضافت ان دارة الجمارك في ميناء المحمرة سبق لها في أواخر الشهر الماضي مصادرة ثلاثمائة كتاب وكتيب سني وجدت مخبأة في داخل \"لنج\" قادمة من الكويت. مؤكدة ان ظاهرة الانتقال إلى المذهب السني في الأحواز آخذة في الأتساع .<br />هذه الأنباء جاءت متزامنة تقريبا مع أول رد فعل ايراني رسمي على حالة التزايد المتسارع لأعداد أهل السنّة في الأحواز حيث حذّر مسئول محلي كبير من تنامي الفكر السنّي في المنطقة، قائلاً إنها حالة تنذر بالخطر على حد تعبيره . وقد جاء هذا التحذير الإيراني على لسان مدير مكتب ممثل مرشد الثورة الإيرانية في الأحواز، وإمام جمعة المدينة الشيخ 'محسن حيدري'؛ وذلك بعد المظاهرات الغاضبة التي خرجت عقب صلاة عيد الفطر السعيد، والتي توحّد فيها الأحوازيون سنّة وشيعة، وكانت المرة أولى التي تظهر فيها جموع سنّية كثيفة يؤمها إمام سنّي، الأمر الذي فاجئ السلطات الإيرانية التي كانت تشدد على أهل السنّة الأحوازيين إلى الحد الذي منعتهم فيه من إقامة صلاة الجمعة بعد إغلاق مساجدهم. حيث كانت قد مسجد ا للسنة في مدينة \"عبادان \" ثاني أكبر مدن الإقليم، والتي يوجد فيها مسجدان لأهل السنّة، أُغلق أحدهما من قبل الدوائر الأمنية، أما الثاني ـ والذي يقع في منطقة القصبة ـ فقد دُمّر أيام الحرب مع العراق، ورفضت السلطات السماح بإعادة بنائه. أما في مدينة الأحواز التي يوجد فيها مسجدا واحدا لأهل السنّة فقد تم إغلاقه هو الآخر .<br />وفي حملة إعلامية مضادة لظاهرة ما بات يعرف بالسنن في الأحواز فقد قامت وزارة الثقافة والارشاد الإيرانية بالتعاون مع الحوزة العلمية وجهات مسؤولة أخرى بتنظيم سلسلة من الندوات في بعض المدن الأحوازية تحت عنوان ما يسمى \"مكافحة الأفكار المعادية لأهل البيت\". وقد دعي لإلقاء المحاضرات في هذه الندوات رجال دين من دول عربية قيل انهم كانوا من أهل السنة وتحولوا للمذهب الشيعي ومن بين هؤلاء الشيخ الأمريكي \"التونسي الأصل محمد التيجاني السماوي \"، بالإضافة إلى مشايخ شيعية من العراق . و قد تركز عمل هذه الندوات في مدن عبادان والمحمرة و الخفاجية بالإضافة إلى مدينة الأحواز مركز الإقليم وذلك بسبب تنامي النشاط السني في هذه المناطق اكثر من غيرها .<br />لقد كانت مدينة 'عبادان' في الماضي تعد مركزًا لأهل السنة؛ وذلك بسبب أن عددًا كبيرًا من أهلها سنّة في الأساس، وقد أضيف لهم عدد من السنّة الأكراد والبلوش، وغيرهم من الذين جاءوا من مناطقهم في ايران للعمل في مصافي النفط والدوائر الحكومية الأخرى في المدينة، وأصبحوا يتخذون من جامع الإمام الشافعي مركزًا لهم . وذلك قبل سقوط الشاه ومجيء نظام الخميني، الذي زاد في عهده التشدد على أهل السنّة في إيران عامة وفي الأحواز خاصة.<br />ولكن مع اندلاع الحرب الإيرانية ضد العراق هاجر أغلب أهل السنّة من المدن والمناطق الأحوازية الحدودية إلى الموانئ والمدن الساحلية التي يتواجد فيها الكثير من العرب وغير العرب من أهل السنّة كميناء كناوة، أبوشهر، كنكان، كنكون، ديـر، لنجة وبندر عباس وغيرها. و قد أدت هذه الهجرة إلى تضاؤل عدد أهل السنّة في الأحواز بحيث انخفضت نسبتهم إلى الاثنين في المائة تقريبًا. ومع انتهاء الحرب الإيرانية العراقية وعودة بعض المهجّرين من أهل السنّة إلى مدينة 'عبادان' و'المحمرة' عادت نسبة أهل السنة إلى الارتفاع قليلاً. وعلى الرغم من حرمانهم من أي نشاط ديني علني، ومنعهم من ترميم مساجدهم التي دُمر بعضها بسبب الحرب، والبعض الآخر بسبب الهجرة، إلا أن ذلك لم يمنعهم من النشاط وأداء واجب الدعوة، خصوصًا وأن حالة الوعي الثقافي والديني في الشارع الأحوازي بعد انتهاء حرب الخليج الأولى والثانية أصبحت أكثر ملائمة لتقبل الفكر السني كما أن تواجد عدد كبير من الأحوازيين في دول الخليج العربي، وتأثر العديد منهم بخطاب الدعاة وأئمة المساجد، إلى جانب تأثرهم بما تبثه المحطات الفضائية والإذاعات العربية من ندوات وحوارات دينية، جميعها لعبت دورًا في تزايد أعداد أهل السنّة في الأحواز حتى أن مدينة كـ'الخفاجية' التي يبلغ عدد سكانها قرابة مائتين وخمسين ألف نسمة، والتي إلى ما قبل عشرة أعوام لم يكن يلاحظ فيها وجود سن واحد، أصبح الوجود السني فيها اليوم ظاهرة بارزة، وقد حوّل أهل السنّة منزلين في المدينة إلى مساجد؛ وذلك بسبب رفض السلطات الإيرانية السماح ببناء مساجد لهم .<br />وهكذا الأمر في مدينة الأحواز مركز الإقليم، فبعد إغلاق المسجد الوحيد لأهل السنّة فيها؛ فقد تحوّل عدد من المنازل إلى مساجد تقام فيها الصلوات وأحيانًا تقدم فيها الدروس الفقهية، وهذا كله يجري بالطبع بعيدًا عن أعين السلطات الإيرانية. ولكن على الرغم من هذا الحصار فان الإحصائيات الأخيرة تشير إلى أن عدد أهل السنّة في الأحواز تجاوز نسبة الخمسة عشر في المائة، وهذا الرقم يُشكل نسبة كبيرة في مجتمع يعاني من قلة الإمكانيات التعليمية والتثقيفية، ونقص كبير في أعداد الدعاة والمرشدين السنة ، إضافة إلى ذلك الظروف الأمنية الخانقة، التي تسعى دائمًا إلى ربط نشر فقه وعلوم مذهب أهل السنّة بالعمل السياسي، وهذا ما شاهدناه مؤخرًا، حيث أصبح كل من يرتدي الدشداشة البيضاء واليشماغ الأحمر والعِقال سلفيًا، ويُعتقل بتهمة الوهابية، وقد تم اعتقال المئات من الأحوازيين لحد الآن بهذه التهمة؛ وذلك كله نتيجة التخوف الإيراني من تزايد أعداد أهل السنّة. وهذا التخوف عبر عنه صراحة كثير من المسؤولين الأمنيين والسياسيين الذين سعوا إلى الربط بين ظاهرة الحركة السنية بين التفجيرات التي شهدتها الأحواز في حزيران و أيلول الماضي وغيرها من الهجمات المسلحة الأخرى .<br />التخوف الإيراني هذا لاشك يختلف تمامًا عما هو عليه في مناطق الأكراد والبلوش والتركمان وغيرها من المناطق ذات الأغلبية السنّية. والسبب في ذلك يعود إلى كون هذه المناطق كانت في الأساس سنّية هذا أولاً. والأمر الآخر أن مسألة البعدين الجغرافي والقومي المجاور في لتلك المناطق لا يشكل بالنسبة لإيران هاجسًا قويًا بالدرجة التي هو عليها في الأحواز التي تحاط بعدد من البلدان العربية، التي لدى إيران عدوات قومية ومشاكل حدودية معها .<br />ولكن يبقى السؤال ماهي الدوافع التي تقف وراء هذا التوجه نحو الفكر السني من قبل الأحوازيين وبالأخص فأت الواعيين منهم؟ .<br />الجواب يأتي من هؤلاء وبكل بساطة ان الأفكار الخرافية التي أحشت فيها الماكينة الإعلامية الصفوية رؤوس الناس البسطاء من موالي ومحبي أهل البيت عليهم السلام لم تعد مقبولة نهائيا في وسط هذا الفئة. وأن سكوت الحوزة العلمية على الظلم والاضطهاد الذي يتعرض له الشعب العربي الأحوازي على يد السلطات الحاكمة باسمها هو من جعل هؤلاء الأحوازيون ينبذون الفكر الصفوي المشبع بالروح القومية الفارسية العنصرية والذي تتبناه الحوزة العلمية وتنشره تحت غطاء التشيع للأهل البيت والمذهب الجعفري.<br />لهذا فهم يدعون من يهمهم الأمر أن يهبوا إلى دعم تيارهم الساعي إلى نشر الإيمان و المتمسك بحق التحرر من السلطة الفارسية الغاصبة لحقوق الشرعية والمشروعة للشعب العربي الأحوازي."
