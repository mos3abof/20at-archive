text = "هي دي الطريقه المحترمه والفعاله في الرد علي اخوانا من الشيعه<br />وليس من خلال الشتائم والسباب كما يفعل بعض الجهله والمتعصبين ولاسف بعض الشيوخ<br />رد الاخ طيف كان هاديء وعقلاني ومحترم<br />ولكن اكثر مااعجبني هو ردود الشيخ هاني<br />وانا فوجئت ان الشيخ هاني حفص شيعي انا كنت فاكرك هتستعين برد من ردود السلفيين المتشدده لاني من متبابعاتي لتعليقاتك شكلك كده سلفي ... لكن بدات اشكك في الموضوع بعد هذا التعليق<br />علي العموم سلفي ولا مش سلفي انت ردك ممتاز<br />انا قريت كتاب الشيعه في مصر اللي وضعت الرابط بتاعه الاخت نور واللي كاتبه راجل شيعي<br />وقريت ردود الشيخ هاني حفص علي الاسئله وهو شيخ شيعي<br />لكن الفرق كبير بين شيعي وشيعي اخر<br />زي بالضبط الفرق الكبير اللي بين سني وسني اخر<br />انا وانا بقرا ردود الشيخ هاني نسيت في بعض الاوقات انه شيعي لانه ردوده كانت موضوعيه وعقلانيه وتجمع ولا تفرق وبمنتهي الادب والرقي في الحوار<br />ياريت يكون هؤلاء الناس من العقلاء علي الجانبين يتصدرون المشهد بدلا من شيوخ الفتنه<br />وتحياتي اخ طيف-"
