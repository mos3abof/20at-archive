subject = "أين تراث آل البيت ?"
author = "طيف بدر"
posted = "2006-10-22"
text = "الكاتب : أبو عبدالله الحربي<br />الحمد لله والصلاة والسلام على رسوله المختار وآله والأطهار.<br />وبعد:<br />فإن حب آل بيت رسول الله صلى الله عليه وسلم هو جزء من الإيمان فلا يحبهم إلا مؤمن ولا يكرههم إلا منافق ...<br />ومعلوم أن الجيل الأول من آل بيت رسول الله كعلي وفاطمة والحسن والحسين رضي الله عنهم مبشرون بالجنة فهم جزء من أهل السنة والجماعة إن لم يكونوا هم أركان السنة هم وباقي الصحابة .<br />وكل هذا لم يشفع لمن يدعي التعالم أن يوجه بسهامه إلى أهل السنة ، بأنهم ظلموا آل البيت ولم يحفظوا تراثهم ، وغيرها من الشنشنة المعروفة من أخزم ، وليس عبد الحسين الموسوي صاحب المراجعات والنص والإجتهاد بعيد عن هذا.<br />فكان لزاماً على أهل السنة رفع هذه التهمة مع براءة ساحتهم طبعاً، لكن كما يقال رفعت عنه كل معيبة ، وأمنته من كل رهيبة.<br />لنرى الآن كيف يأخذ أهل السنة تراثهم من آل البيت رضوان الله عليهم<br />لقد أعتمد سلف الأمة في تقرير كثير من مسائل العقيدة على أقوال آل البيت كقول جعفر الصادق ( كلام الله ليس بمخلوق منه بدأ وإليه يعود ) ذكره اللاكائي في أصول اعتقاد أهل السنة والجماعة والآجري في كتابه الشريعة وكذا ابن بطه وعند ابن ابي عاصم في كتابه السنة وذكره عنه شيخ الإسلام ابن تيمية .<br />كما اعتمد أهل السنة على روايات آل البيت بشكل كبير فروايات علي بن أبي طالب في البخاري مع المكرر (98) وغير المكرر (34) ورواياته رضي الله عنه في صحيح مسلم (38) حديثا ..<br />وعندما نعمل عملية حسابية يسيرة نرى أن الناتج هو =72 رواية في أصح الكتب عند أهل السنة بينما أحاديث علي رضي الله عنه المرفوعة إلى النبي صلى الله عليه وآله وسلم في أصح كتب الشيعة<br />وهو الكافي =66<br />فهل يقول لنا قائل من هو المكثر من المقل!!<br />هذا بغض النظر عن صحة الروايات في كتاب الكافي وأكثرها كذب على علي رضي الله عنه عند وضع أسانيدها على طاولة البحث العلمي<br />بل وروايات علي رضي الله عنه في كتب السنة أكثر من روايات أبي بكر رضي الله عنه !!<br />بل هي أكثر من روايات عمر رضي الله عنه !!<br />بل روايات علي رضي الله عنه المنقولة في كتب السنة أكثر من روايات عثمان رضي الله عنه!!<br />بل لا أخفيكم حديثاً إن قلت أن روايات علي رضي الله عنه أكثر من مرويات أبي بكر وعمر وعثمان رضي الله عنهم مجتمعين!!!<br />فأي انصاف بعد هذا؟<br />وهل يصح أن نقول أن أهل السنة أعداء لأبي بكر وعمر وعثمان؟<br />وأما فاطمة رضي الله عنها فلها حديث واحد في البخاري برقم (4462)<br />بينما ليس لها ولا حديث واحد مرفوع في كل الكافي وهو عندي 9 مجلدات!!<br />أفلا يصح لنا أن نقول أن صاحب الكافي \" الكليني \" ناصبي لأنه جفا فاطمة الزهراء رضي الله عنها.<br />وأما الحسين رضي الله عنه فله حديثان عن أبيه علي رضي الله عنه عن رسول الله صلى الله عليه وسلم في كتاب الجمعة برقم (1127) وكتاب فرض الخمس برقم (3091) من صحيح البخاري ومثله في صحيح مسلم .. أي أربعة<br />بينما في الكافي رواية واحدة وكذا عن الحسن رضي الله عنه<br />فهل يصح بعد هذا أن نقول: أن صاحب الكافي وهو اصح كتاب عند الشيعة قد جفا سيدا شباب أهل الجنة؟<br />نأتِ الآن إلي الإمام محمد الباقر رحمة الله عليه ذاك الإمام الكبير الفذ المحدث الكبير.<br />فروايته في الكتب التسعة (240) رواية<br />وتعالوا معي نقارن بين مرويات محمد الباقر رحمه الله ورضي عنه وبين روايات من؟؟<br />روايات أفضل رجل بعد الأنبياء والرسل عند أهل السنة إنها مرويات أبي بكر الصديق رضي الله عنه<br />لتعلموا والله إنصاف أهل السنة ولكن الحق عزيز والإنصاف صعب، فما لهؤلاء الناس لا يعلمون وعن الحقيقية يحيدون!!!<br />مرويات محمد الباقر رحمه الله في صحيح مسلم (19) رواية<br />بينما مرويات الصديق رضي الله عنه (9)<br />فأي أنصاف بعد هذا!!<br />بل إن مرويات الباقر رحمه الله وجمعنا به في جنات النعيم في سنن النسائي فقط(56)<br />بينما مرويات الصديق رضي الله عنه (22)<br />فهل يصح لمنصف أن يرمي أهل السنة بالجفاء لتراث آل البيت!!<br />نأتِ الآن إلى مرويات ذاك الإمام الفذ جعفر الصادق رحمه الله ورضي عنه<br />فهي في الكتب التسعة (143)<br />بل قد صُنف في سرد مروياته وجمعها رسالة دكتوراه في معقل ( الوهابية) كما يحلوا لعلماء الحوزات نبذهم به السعودية، فهل هؤلاء يحبون جعفرا أم لا!!<br />ولنا أن نتصور تلك المقولة الذهبية التي تشع إنصافاً وحباً لآل البيت رضي الله عنهم حينما قال المحدث ابن كثير( سني) أن أصح الأسانيد هي جعفر عن محمد عن علي عن الحسين عن علي رضي الله عن هذه السلسة الذهبية.<br />انظر كتابه الباعث الحثيث غير مأمور.<br />وقد أخرج أصحاب الكتب السنة المعتمدة عند أهل السنة ( مسلم وأبو داود والترمذي والنسائي وابن ماجه ) للإمام جعفر الصادق عدا البخاري فقد أخرج له حديثان في الأدب المفرد<br />ولمتنطع أن يقول لماذا لم يخرج البخاري لجعفر الصادق في صحيحه؟<br />فنقول : ولماذا لم يخرج البخاري لأبي حنيفة والشافعي وأحمد ابن حنبل والإمام مسلم وغيرهم من الكبار هل هو تنقص لهم أم هي شروط أراد تطبيقها في صحيحه!<br />معشر السادة النبلاء<br />لقد كتب أهل الحديث ( أهل السنة )كتباً في فضائل ومرويات آل البيت ككتاب فضائل علي أو الخصائص الكبرى للنسائي وفضائل فاطمة للسيوطي بل في البخاري أبواب كثيرة في فضل آل البيت وكذا في مسلم وغيره من كتب السنة وقد اجتمع عندي العشرات من الكتب التي تتحدث عن فضل آل البيت وعلو مكانهم عند المسلمين ، وكتابها سنة.<br />فأين الجفاء الذي يتغنى على وتره الموسوي والتيجاني والقزويني والكوراني وغيرهم ممن طمست شهاوات الدنيا بصيرتهم<br />ولعلي أن أنصح بأفضل ما كتب عن علي رضي الله عنه عند أهل السنة وهو كتاب د. علي الصلابي موسوعة علي رضي الله عنه في (900) ورقة وله كتاب الخليفة الخامس الحسن رضي الله عنه ولم يؤلف في الحسن كتاب مثله ، لا عند السنة ولا الشيعة.<br />وتحت الطبع كتاب الحسين رضي الله عنه للدكتور علي الصلابي وفقه الله<br />وكذا الإمام محمد أبو زهر كتب عن الإمام جعفر الصادق رضي الله عنه ..<br />بل إن ذلك الشيخ المظلوم الذي ما فتئ ينافح ويدافع عن آل البيت رضوان الله عليه ويجاهد بما يملكه من مال ووقت وجهد في الذب عنهم ونشر تراثهم ، ولم يربأ بنفسه أن يخوض هذه الغمار الصعبة حباً لهؤلاء النبلاء الشرفاء العظماء رضي عنهم رب الأرض والسماء ( عثمان الخميس) ألف كتاباً أخذ منه الوقت الطويل والجهد الكبير في استقراء وتتبع مرويات سيدا شباب أهل الجنة الحسن والحسين رضي الله عنه في كتب السنة واستخراجها وجمعها.<br />ثم بعد ذلك يقولون عنه ناصبي وعدو لآل البيت !!!<br />كل هذا من أجل أنه قال يا شيعة العالم استيقضوا كما اطلقها مدوية السيد موسى الموسوي وآية الله البرقعي وغيرهم.<br />وأما في الفقه فالأصل المعتمد في حج أهل الإسلام حديث جابر رضي الله عنه الذي يفصل حجة رسول الله صلى الله عليه وسلم وهي مروي من طريق جعفر الصادق ..<br />أي أن أهل السنة في كل سنة يتعبدون لله في حجهم على رواية يرويها الإمام جعفر الصادق عن جده رسول الله صلى الله عليه وآله وسلم.<br />كيف لا وهو حفيد المصطفى صلى الله عليه وآله وسلم من جهة ابيه وحفيد الصديق رضي الله عنه من جهة أمه<br />حتى قال الإمام جعفر الصادق ولدني أبو بكر مرتين<br />ويقصد بالولادة الأولى أنه حفيد لأبي بكر من جهة الأم<br />ويقصد بالولادة الثانية ولادة العلم الذي أخذه عن القاسم بن محمد حفيد الصديق رضي الله عن الجميع<br />وقد شحنت كتب الفقه بآراء العترة الطاهرة وارجع إن شئت إلى نيل الأوطار للإمام الشوكاني بدأ من كتاب الطهارة ومروراً بكتاب الصلاة والصوم والزكاة والحج والبدع والجنابات والعتق وأمهات الأولاد والقضاء على اعتبار أن آل البيت هم جزء من علماء السنة وفقهائها ، وكذا في المغني لابن قدامة وأخيرا كتاب شيخنا الحبيب العبيكان غاية المرام<br />ويعتمد أهل السنة كثيراً على فتاوى الإمام زيد بن علي رضي الله عنه الذي جفاه وأخرجه الشيعة من أل البيت دون وجه حق.<br />وأما في التفسير فقد شحنت كتب التفسير عند أهل السنة بأقوال جعفر الصادق رضي الله عنه كما في تفسير ابن كثير في سورة الصافات عند قوله ( إذ أبق إلى الفلك المشحون فساهم فكان من المدحضين ) .<br />وفي تفسير القرطبي في سورة آله عمران عند قوله ( لا إله إلا هو العزيز الحكيم ) وعند قوله ( فاستجاب لهم ربهم ) وقوله ( الذين يذكرون الله قياماً وقعوداً )<br />وفي المائدة وفي الأعراف وفي سورة إبراهيم وفي سورة النحل على ما هول مفصل في الجدول المرفق بالجزء والصفحة .<br />انظر الجدول .<br />جدول يبين بعض روايات الإمام جعفر الصادق في كتب التفسير عند أهل السنة:<br />التفسيـر<br />السـورة<br />الجزء<br />رقم الصفحة<br />الطبعة<br />ابن كثير<br />الصافات آية 139<br />السابع<br />34<br />دار إحياء التراث العربي<br />القرطبي<br />آل عمران آية 18<br />الرابع<br />40<br />دار الكتب العلمية<br />القرطبي<br />آل عمران آية 96<br />الرابع<br />137<br />دار الكتب العلمية<br />القرطبي<br />آل عمران آية 190<br />الرابع<br />309<br />دار الكتب العلمية<br />القرطبي<br />المائدة آية 27<br />السادس<br />133<br />دار الكتب العلمية<br />القرطبي<br />الأعراف آية 199<br />السابع<br />344<br />دار الكتب العلمية<br />القرطبي<br />إبراهيم آية 6<br />التاسع<br />342<br />دار الكتب العلمية<br />القرطبي<br />النحل آية 97<br />العاشر<br />174<br />دار الكتب العلمية<br />القرطبي<br />( ن ) والقلم آية 1<br />الثامن عشر<br />223<br />دار الكتب العلمية<br />القرطبي<br />( ن ) والقلم آية 51<br />الثامن عشر<br />254<br />دار الكتب العلمية<br />القرطبي<br />( يس ) آية 1<br />الخامس عشر<br />3<br />دار الكتب العلمية<br />القرطبي<br />مقدمة المؤلف<br />الأول<br />1<br />دار الكتب العلمية<br />وفوق هذا كله كان أهل السنة من أحرص الناس على تراث آل البيت كما كانوا يحرصون على تراث رأس آل البيت صلوات ربي وسلامه عليه<br />فقد كان أهل السنة يتحرزون ويحذرون من كثرة الكذب على جعفر الصادق كما ذكر عن أحد أتباع الإمام جعفر قال كان الإمام جعفر رجلاً صالحاً وكان يأتيه الخلق من كل مكان فيسمعون منه الكلمة ويزيدون عليها تسعاً وتسعين كلمة .. ( وهذا مروي وموثق في كتب الشيعة وهذا الواقع في كتب الشيعة من مرويات يعجز المسلم عن تصديقها والإمام جعفر بريء منها("
