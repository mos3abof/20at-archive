text = "يارافضه ح نذكر حقيقه مش عارفينها انتم بأنفسكم ومن كتبكم<br />وحقيقه لا يعرفها المتعاطفون مع الرافضه والداعون الى التقارب معهم من اجل جهاد الكفار حسب وهمهم وهي ان الجهاد في المذهب الرافضي محرم الى خروج القائم الذي لم يولد لذا لم يسجل التاريخ ولن يسجل جهاد للرافضه ضد الكفار<br />روى تقتهم في الحديث الكليني في الكافي 8/295<br />عن ابي عبد الله عليه السلام قال ( كل رايه ترفع قبل قيام القائم فصاحبها طاغوت يعبد من دون الله عزوجل وذكر هذه الروايه شيخهم الحر العاملي في وسائل الشيعه 11/37<br />وروى محدثكم الطبرسي في مستدرك الوسائل 2/248 ط دار الكتب الاسلاميه طهران<br />عن ابي جعفر عليه السلام قال مثل من خرج منا اهل البيت قبل قيام القائم عليه السلام مثل فرخ طار ووقع من وكره فتلاعبت به الصبيان<br />روى الحر العاملي في وسائل الشيعه 11/36<br />عن ابي عبد الله عليه السلام قال يا سدير الزم بيتك وكن حلسا من احلاسه واسكن ما سكن الليل والنهار فاذا بلغك ان السفياني قد خرج فارحل الينا ولو على رجلك ))<br />في الصحيفه السجاديه الكامله ص16 ط دار الحوراء بيروت لبنان<br />عن ابي عبد الله عليه السلام قال ما خرج ولا يخرج منا اهل البيت الى قيام قائمنا احد ليدفع ظلما او ينعش حقا الا اصطلته البليه وكان قيامه زيادة في مكروهنا وشيعتنا<br />وفي مستدرك الوسائل 2/248<br />عن ابي جعفر عليه السلام قال كل رايه ترفع قبل رايه القائم عليه السلام فصاحبها طاغوت ))<br />وفي وسائل الشيعه 11/36<br />عن علي بن الحسين عليه السلام قال والله لا يخرج احد منا قبل خروج القائم الا كان مثله كمثل فرخ طار من وكره قبل ان يستوي جناحاه فاخذه الصبيان فعبثوا به )<br />وقرر مرجعهم الهالك الخميني ان البدأه بالجهاد لا تكون الا لقائمهم اذ يقول في تحرير الوسيله 1/482 ))<br />(( في عصر غيبه ولي الامر وسلطان العصر - عج - الشريف يقوم نوابه العامه وهم الفقهاء الجامعون لشرائط الفتوى والقضاء مقامه في اجراء السياسات وسائر ما للامام عليه السلام الا البدأة بالجهاد ))<br />فهل نرجوا من هؤلاءالرافضه مجاهده الكفار جنبا الى جنب معنا نحن اهل السنة ؟؟<br />انسينا غدرهم بنا على مر التاريخ !<br />الم يكن الغدر موقفهم احيانا وتخاذلهم ووقوفهم من حروبنا للكفار وقف المتفرج الذي يتمنى ان تدور الدائره علينا احيانا اخرى ؟؟<br />والحق الذي لا محيد عنه انهم لا يقفون موقف المتفرج الا اذا شعروا بقوة اهل السنة اما اذا شعروا بضعفهم فما اسرع انقضاضهم عليهم وفتكهم بهم<br />احذروا لحن قول الرافضه فكل ما يوقفونكم به انما هو من باب التقية<br />الم ينقل شيخهم النجفي اجماعهم على كفر من يخالفهم ؟ الا تعلمون ان الذين يقتلون من اهل السنة في الثغور لحمايه المسلمين قتله في الدنيا وقتله في الاخرة حسب معتقدهم<br />روى الملا محسن الملقب بالفيض الكاشاني في الوافي 9/15 والحر العاملي في وسائل الشيعه 11/21 والنجفي في جواهر الكلام 21/40<br />عن ابي عبد الله بن سنان قال قلت لابي عبد الله (ع) جعلت فداك ماتقول في هؤلاء الذين يقتلون في هذه الثغور ؟ قال فقال الويل يتعجلون قتله في الدنيا وقتله في الاخرة والله ما الشهيد الا شيعتنا ولو ماتوا على فرشهم ))<br />(( ما الشهيد الا شيعتنا )) والقتلى من اهل السنة في حروبهم للكفار من نصارى ومشركين وبوذيين ويهود (( الويل يتعجلون ))<br />قال الشيخ محمد احمد عرفه عضو هيئه كبار العلماء في الازهر معلقا على الروايه السابقه في مقدمه لكتاب الوشيعه في نقد عقائد الشيعه لموسى جار الله مانصه<br />(( فلو كان منا شيعه في العدوان الثلاثي على مصر لتخلفوا عن قتال المعتدين بناء على هذه القاعدة وهذا هو السر في رغبه الاستعمار في نشر هذا المذهب في البلاد الاسلاميه ))<br />وعلى هذه الروايات فالجهاد لدى الرافضه معطل الى قيام القائم الذي لم يولد<br />رأيت الموضوع من أحد الإخوة (المرسال) فأحببت إنزاله هنا<br />لأن حقوق الطبع محفوظة لكل مسلم<br />____________________________<br />صدق جعفر الصادق رحمه الله تعالى حيث يقول : إن ممن ينتحل هذا الأمر (أي التشيع) لمن هو شر من اليهود والنصاري والمجوس والذين أشركوا . راجع رجال الكشي 252"
