text = "يا جماعه رغم انى مسلمه ولكن عندما انظر الى هؤلاء الشيعه عندما يضربون بعض فى احتفالات عاشوراء على الفضائيات ننفسى تشمئز واااقول من اين ياخذو هؤلاء دينهم اكان الرسول وال البيت الكرام يفعلون ذلك ويضربو ا رؤسهم مثل هؤلاء الحمقى اعذرونى على الفاظى رغم انى غير متعرفه على دينهم اكثر الا انى العقل ينفى ذلك على صحه دينهم"
