subject = "فوضت أمرى اليك يارب"
author = "ميمو"
posted = "2006-06-01"
text = "(وَاعْتَصِمُواْ بِحَبْلِ اللّهِ جَمِيعاً وَلاَ تَفَرَّقُواْ وَاذْكُرُواْ نِعْمَتَ اللّهِ عَلَيْكُمْ)<br />ياناس بلدنا جميل وفضل ربنا علينا عظيم<br />وان كان فية قلة من البؤساء الاشقياء فى الدنيا والاخرة فدول اعوان الشياطين عايزين يضعفونا ويضيعونا معاهم وربنا امرنا بالاعتصام بأوامرة<br />{وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُم بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ وَلَا تَعْدُ عَيْنَاكَ عَنْهُمْ تُرِيدُ زِينَةَ الْحَيَاةِ الدُّنْيَا وَلَا تُطِعْ مَنْ أَغْفَلْنَا قَلْبَهُ عَن ذِكْرِنَا وَاتَّبَعَ هَوَاهُ وَكَانَ أَمْرُهُ فُرُطاً }الكهف28"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132856/http://masr.20at.com:80/article.php?sid=413"

