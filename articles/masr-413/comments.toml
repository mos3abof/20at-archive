subject = "مشروع ارهابي عاطل"
author = "عاطل مؤهل جامعي"
posted = "2006-06-01"
text = "اقسم بالله العظيم لو اعرف سر صناعة اي قنبله لكنت بقيت قنبلة بشرية<br />علي فكرة انا بحب بلدي جدا جدا<br />بس انا مش حستني اما ابقي عندي خمسه وثلاثين سنه ولسه مش لاقي شغل<br />او اموت مسرطن باكل فاسد مستورد من رجالة مبارك وحاشيته<br />وعلي راي دكتور نظيف القذر: الي مستني جواب القوي العاملة يستناه لحد اما يموت ومش حيجيله كمان.<br />وكان هذا من تصريحات دكتور نظيف القذر<br />ومش عايزني ابقي قنبله بشرية؟؟؟؟؟؟"
