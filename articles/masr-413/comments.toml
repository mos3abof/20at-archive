capture_url = "https://web.archive.org/web/20060615132856/http://masr.20at.com:80/article.php?sid=413"

[[comments]]
order = 11
subject = "زمن الاقزام"
author = "طارق حسن"
posted = "2006-06-02"
text = "عفوا فهذا زمن الاقزام وفى مثل هذة الازمان ينزوى اصحاب الفكر والرؤى فى كل المجالات ويطفوعلى السطح البزاءات<br />من هنا فمن الطبيعى ان تحتل اخبار مطرب مغمور مساحه من تفكير الناس لانه مزور واخر لانه زانى بينما تظهر الزانيه ووالدها على شاشات التلفاز ويتحدثون عن مدى قصور القانون ليعطيها حقها وتطالب الدوله بكل مؤسساتها للوقوف بجانبها<br />يختفى كاتب فى حجم هيكل وطفو كتاب يعرفون كيف يبيعون هموم الناس للناس ليتربحوا ويتكسبوا منها<br />تختفى امهات فاضلات وتظهر سيدات يطالبن بان ينسب الابن لامه<br />والقياس واضح فى كل المجالات<br />حقا نحن نحيا زمن الاقزام"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132856/http://masr.20at.com:80/article.php?sid=413"

[[comments]]
order = 12
subject = "هم يضحك وهم يكرتك علي قفاك علشان تفوق"
author = "papakimos"
posted = "2006-06-02"
text = "الهم اللي يضحك - لو كان ايمن نور واد روش كده وبيحضن ويبوس في البنات وبيعرف يغني علينا زي سي تاتو الله يفك رقبته كان لقي الموزز اللي تعملو مظاهره في ميدان التحرير او حتي في ميدان العتبه ولكن المسكين كان عاوز ياكل بعقل الغلابه حلاوه ويفهمهم انه ينفع رئيس جمهوريه والبيه تاتو حبيب الولامؤاخذه البنات الكده كده قدر يقنع الناس انه مش مهم يدخل الجيش ولا مهم يزور المهم انه يزرب فن وللفن فقط<br />الهم بتاع القفا بئه دا مصيبه سوده خلاص الاخت الفاضله الشريفه العفيفه بنت الاصول بتعترف بالزنا وعاوزه حق بنتها من الزنا سيبك من ده كله ابوها طلع في التليفزيون وعاوز حق بنت بنته من الزنا واعز من الولد ولد الولد هو مفيش دم خلاص .<br />المهم والخطير في الموضوع ان دي تبقي بدايه لمواضيع زي كده كتير الكتكوته تنام مع الكتكوت ولما تبقي حامل يا تتجوزني يا هبلغ البوليس ولما الندل الجبات عره بني الانسان يرفض تروح الهانم تجري علي بابي وتقولو مش عاوز يعترف بابنه يا بابي قوووووووم بابي يقولها ولا يهمك يا بيبي بكره اجوزك احسن منه وهجيبه من قفي مامته في التليفزيون يقول انه ابنه<br />المصيبه بئه لو هند الحناوي اتجوزت يا لهويتييييييييييييي تبقي مصيبه هتبقي حاجه عاديه بئه ان الواحده من دول تهنكر ولما البيه اللوح يطلب ايديها وفي الليله ايا يلاقيها مستعمله يبقي الموضوع عادي انت البنت تبقي مستعمله من غير جواز<br />دا احنا نبقي ساعتها بلد مستهلكه ومتهربده<br />وفي النهايه لا يغير الله ما بقوم حتي يغيرو ما بانفسهم"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132856/http://masr.20at.com:80/article.php?sid=413"

