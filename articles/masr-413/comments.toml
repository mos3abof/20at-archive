[[comments]]
order = 3
subject = "الهروب من الخدمة شرف لاندعيه"
author = "ز...و...ح"
posted = "2006-05-30"
text = "لا يزال الجميع يسترجعون وبفخر إعلان محمد علي كلاي رفضه للإنخراط في الجندية في جيش بلاده المؤيدة للعنصرية والمستعمرة للشعوب الضعيفة ... وكذلك نستعيد ونتندر برفض خمسة أو ستة أو حتى واحد اسرائيلي عنده ضمير فيرفض الخدمة في جيش بلاده لشعوره بأن قوة هذا الجيش تتوجه لسحق الأطفال والعزل من المدنيين ....... ومع ذلك نشعر لخيبتنا بمشاعر الاستنكار تجاه المتهرب من الخدمة العسكرية عندنا ونعتبره مارقا وخائنا عميلا وغير وطني ومتخليا عن ضريبة الدم...دم...قال دم قال..... جرى إيه ياناس ..أنتو مخكم تعبان وللا إيه .... أي جيش تقصدون .. أتقصدون جيش مصر أم جيش العملاء المماليك ؟؟؟<br />إن الجيش في حقيقته هو تآلف خيرة شباب الوطن ووهبهم أنفسهم في سبيل الدفاع والذود عن حمى الوطن والعروبة والإسلام ...وللا الجيش ليه تعريف تاني .. قولولي .... إنما بقى في الأيام السودة بسواد مقطرن عليه جلة دي اللي احنا فيها ... الجيش بتاعنا بيعمل إيه؟؟ حرب ... حلفنا بالطلاق تلاتة من دراعنا ومن عروبتنا ومن ديننا كل مايحلوا يحرموا إننا ما هانحارب ابدا حتى ولو الصهاينة والأمريكان دخلوا بيوتنا كدة وناموا فيها .... طب عدوان... عدوان على مين يانور العين واحنا مش قادرين نصلب حيلنا... يبقى وظيفة الجيش إيه بقى غير نرمي شوية منه في الكويت يموتوا هناك بلا ذنب أو جريرة بل ليكونوا دروعا بشرية لدخول الأمريكاني فينا للىخر وأهودخل ومش عايز يطلع ولو بالطبل البلدي.... وللا وظيفته يعمل لنا كام كوبري .. ما المقاولين العرب قايمة باللازم .... يبقى ماعادش له وظيفة إلا حماية الولاة المماليك بتوعنا من الشعب ونزول الشوارع زي موضوع الأمن المركزي كدة ... وياخد حتة من الأرض الباقية ويزرعها خيار ينفع لسد الفراغ لما الأمريكان يسيبونا دا إذا سابونا من غير<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132856/http://masr.20at.com:80/article.php?sid=413"

[[comments]]
order = 4
subject = "يا عم الحج"
author = "يحى"
posted = "2006-05-30"
text = "يا جدع انت ملقتش غير نواب الاخوان<br />خلاص مش عاجبك شغلهم<br />مين قال انهم بيتكلموا عن الزفت الافلام<br />تابعوا بقا فى عرض النبى امتا هتفهموا<br />نواب الكتلة البرلمانية للإخوان المسلمين موازنة العام المالي 2006/ 2007، وأكدت الكتلة- في بيان لها تضمن أسباب الرفض- على أن الحكومة تراجعت عن وعودها المتكررة للشعب، وحادَت عن مبدأ الشفافية المفترض، بالرغم من أن الجماهير العريضة كانت تنتظر تحقيقَ آمالها في موازنة العام المالي 2006/ 2007، والتي تتمثل في:<br />- السيطرة على معدلات البطالة المتزايدة والتي تؤرق كل بيت مصري ويعاني منها ملايين الشباب.<br />- مضاعفة الاعتمادات اللازمة لتقديم الخدمة الطبية والعلاجية اللائقة بالمواطنين، خاصةً محدودو الدخل.<br />- السيطرة على جنون الأسعار والغلاء الفاحش الذي أرهق جيوب المواطنين المصريين.<br />- تدبير الاعتمادات اللازمة لتحسين مستوى المعيشة، من خلال رفع الأجور بما يتناسب مع معدلات زيادة الأسعار والتضخم.<br />- تدبير الاعتمادات اللازمة للأنشطة الاستثمارية والتنمية البشرية، خاصة في مجالَي التعليم والبحث العلمي والصحة والإسكان بدلاً من إلغاء هذا الدور على القطاع الخاص المتعثِّر في تحقيق التقدم المأمول في مجال التنمية الاقتصادية حتى الآن.<br />وقد أكدت الكتلة أن الموازنة جاءت لتكرِّس دورَ الحكومة في تجميل الموقف على حساب تنظيم البرامج اللازمة لعلاج المشكلات التي يعاني منها الوطن، وعلى رأسها الدين العام المتنامي، وعجز الموازنة المتصاعد.<br />وأكدت الكتلة أنه \"لهذا كله ترفض الكتلة مشروعي الخطة والموازنة للعام المالي 2006/2007\"."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132856/http://masr.20at.com:80/article.php?sid=413"

[[comments]]
order = 5
subject = "الست مصداقية"
author = "محمود صباح"
posted = "2006-05-30"
text = "المناضل تامر حسنى زور شهاده الجيش وهرب من التجنيد واخد سنة مع ايقاف التنفيذ والقاضى قال علشان سنة صغير ..... لا مؤاخذة المفروض امتى هيتحسب كبير واحد عندة 28 سنة ولسه صغير .<br />المناضل ايمن نور زور لزياده عدد اعضاء الحزب بتاعة ( مع الفرض انه زور بجد ) اخد 5 سنوات سجن مع الشغل ؟؟ شفتوا الشغل ويقولك لا تعليق على احكام القضاء . الناس لسه بتختلف فى تفسير القرأن اللى انزلة ربنا على رسولة صلى الله عليه وسلم واحنا بنقول احكام القضاء معليهاش تعليق يمكن القضاه مش بشر اه يابلد .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132856/http://masr.20at.com:80/article.php?sid=413"

