[[comments]]
order = 0
subject = "أم سلمة"
text = "صدقت يا أخ مجاهد..قالتها لي معلمتي بالمسجد ..ولم انتبه لها لما قالت الا بعد وفاة والدي رحمه الله..قالت لنا في احدى الدروس ( اياك وان يتعلق قلبك باي شئ في الدنيا)..<br />اسلوبك جميل جدا ..مقارنتك بين حال الابن وهو يحمل ابيه وبين الوالد عندما كان يحمل ولده وهو طفلا كانت موفقة جدا ..لعلنا جميعا ندرك ان دموعنا ستصبح ذات يوم نسيا منسيا ودموع اخرين ربما تكون من اجلنا..<br />جزاك الله خيرا على هذه التذكرة"
archived = "2004-11-29"
capture_url = "https://web.archive.org/web/20041129063152/http://www.20at.com:80/article.php?sid=777"

[[comments]]
order = 1
subject = "مــعانى جمــيلة .. لــو لا .."
text = "جزاكم الله خيرا على هذه المعانى الجميلة التى حرص الصديق على تذكيرنا بها بأسلوب قصصى رائع قلل من تأثيره الأسلوب المباشر فى آخر فقرة فى الموضوع إضافة إلى كثرة الأخطاء النحوية والتى يتحملها المشرفون على الموقع فى المقام الأول<br />وأذكر من هذه الأخطاء :<br />\"سيأتى يوما تتوقف فيه الأحزان \"<br />\" تحولت الدمعة إلى نورا \"<br />\" أشرق الوجه ضياءا \"<br />\" بإحدى المساجد \"<br />\" ينطلق بها إلى جنتيهما \"<br />\" أن تخبئ شئ \"<br />أعتقد أنها أخطاء فاتت سهوا على الزملاء المشرفين على الموقع<br />حسين عبد الظاهر - صحفى مصرى"
archived = "2004-11-29"
capture_url = "https://web.archive.org/web/20041129063152/http://www.20at.com:80/article.php?sid=777"

[[comments]]
order = 2
subject = "رنا."
text = "نعم السعادة الابدية ليست هنا انها هناك في الدار الآخرة...في الحنة اسال الله ان يجعلنا من اهلها جميعا<br />صدقت يا اخ مجاهد...<br />وانا احمد الله تعالى على الاسلام واننا مسلمين فإيماننا بالله وتمسكنا بديننا هو ما يهون علينا مصائب الدنيا وهو ما يجعلنا على يقين ان فراق الاحبة ما هو الا فراق وقتي مهما طال واننا بإذن الله نلتقي بالجنة حيث لا فراق هناك ابدا.<br />لذلك يجب علينا ان نربي انفسنا واولادنا على طاعةالله عز وجل حتى نضمن اننا سنلتقي في الجنة واننا على موعد ابدي هناك بإذن الله حتى ان افترقنا في الدنيا .<br />مقالك هذا يجب ان يكون مناسبة لان يتمسك كل منا ببناء الاسرة المسلمة الصالحة وتربية اولاده على الاسلام وايضا فرصة لكل منا لكي يتمسك بهدي الله اكثر وان يحاول هداية غيره من احبته واهله واصدقائه.<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2004-11-29"
capture_url = "https://web.archive.org/web/20041129063152/http://www.20at.com:80/article.php?sid=777"

[[comments]]
order = 3
subject = "أحمد فتحي"
text = "اللهم انا نسئلك حبك وحب من يحبك ,,وحب كل عمل يقربنا من حبك ..اللهم اجعل حبك احب الينا من انفسنا واهلنا ومالنا وولدنا<br />واذكرك ونفسي :\"لا يكتمل ايمان المرء حتى يكون رسول الله احب الية من نفسة ومالة وولدة\"<br />شكرا اخي الحبيب مجاهد على هذه الموعظة أو الخاطرة الايمانية الرائعة.<br />أسعدك الله في الدارين، وجعل الله دائما دمعتك دمعة لقاء لا فراق، دمعة فرح لا حزن، دمعه في سبيل الله تنال بها رحمة الله وعفوه"
archived = "2004-11-29"
capture_url = "https://web.archive.org/web/20041129063152/http://www.20at.com:80/article.php?sid=777"

[[comments]]
order = 4
subject = "اخي في الله"
text = "جزاك الله حيرا اخي مجاهد ولاهي لأنها تذكرة .. لاللهم ثبتنا يا رب ..أسلوبك رائع وجميل ربنا يكرمك ويحفظك ويجعل هذا الموضوع في ميزان حسناتك يا رب ..السلام عليكم"
archived = "2004-11-29"
capture_url = "https://web.archive.org/web/20041129063152/http://www.20at.com:80/article.php?sid=777"

[[comments]]
order = 5
subject = "أسلوب شيق وجميل في تصوير الأحداث"
text = "ما شاء الله مقال متميز في تصوير الواقع وتجليات قدرة الله عز وجل، والأسلوب جذاب وممتتع حيث يعطي لكل قارئ الفرصة لكي يقرأ المقال بطريقته فقد أعجبتني فكرة التوقيتات وأننا قد نجد الموت مع شروق اليوم وقد تولد الحياة بعد العصر ومع الغروب ويكون الفرح في ظلام الليل. ولا يسعنا إلا أن نقول سبحان الله وسعت قدرته كل شيئ.<br />بارك الله فيك يا أخ مجاهد ونرجو أن تستمر في كتابة مثل هذه الموضوعات فقلمك جيد وأسلوبك ممتع"
archived = "2004-11-29"
capture_url = "https://web.archive.org/web/20041129063152/http://www.20at.com:80/article.php?sid=777"

