[[comments]]
order = 7
subject = "عادل (ابوالسيد) المنصوريه"
text = "اذاكان قد قيل (ان عمل رجل فى الف رجل خير من عمل الف رجل فى رجل)فانى اقول ان هذا الرجل يجدر بنا ان نقول فى حقه (انه لم يعمل فى الف رجل فقط بل عمل وسيعمل فى ملايين الرجال من يوم ان بدء دعوته سنه 1928 الى يوم القيامه انشاء الله) وهذا يكفيه والله اعلم"
archived = "2004-11-29"
capture_url = "https://web.archive.org/web/20041129063152/http://www.20at.com:80/article.php?sid=777"
