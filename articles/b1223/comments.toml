text = "ان الهدف منالدراسة في الاردن هو حصول الشاب اوالفتاة غلى وظيفة تكون تاشيرة لزواج من انسانة موظفة وكذلك الشاب فاصبح السعي للوظيفة هو الهدف وليس طلب العلم هكذا هي المعادلة في الاردن"
