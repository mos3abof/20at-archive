[[comments]]
order = 6
subject = "الأخت المفروسة"
author = "خارج نطاق الخدمة"
posted = "2006-07-31"
text = "الأخت المفروسةن مش معنى إن لبنان بتنتهك، وكعكة فلسطين تقسم بين كلاب العالم، أننا سنفقد حياتنا، ونظل في عويل وصراخ، حتى الفلسطينيين لا يفعلون هذا، بل لديهم وقت للمقاومة، ووقت للدرس، ووقت للهو، ثم إن لك الحق في الحزن، إذا كنا نتكلم عن شيء تافه، ومش معنى إن العشريناتية اختاروا مناضل غير عربي، إنها عقدة الخواجة..... بصوا للأمور بعقلانية بقى........."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132237/http://www.20at.com/article2.php?sid=1109"
