subject = "اكتب على الصاروخ"
author = "ما يكتبوا يا حبيبى ........"
posted = "2006-07-31"
text = "احنا برضوا لما نطلع الصواريخ اللى بسلامتة عاينة تحت القصر بتاعة<br />ان شاء الله عموم جيمى هايبقى يخصص لينا احنا المصرريت 5 دقايق نلحق نبصم على الصواريخ قبل ما تفرع فينا<br />لما نبقى نعرف نكتب الاول ....... نبقى نفكر نكتب على الصواريخ"
