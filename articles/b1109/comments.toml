[[comments]]
order = 0
subject = "نماذج من بلدى"
author = "مصرية"
posted = "2006-07-30"
text = "جميل أن نتعرف على رموز الحريةونماذج النضال العالمى حتى فى الموسيقى ولكن الأجمل أن نبحث عن نماذج نضال مصرية وعربية من تاريخنافى جميع المجالات لعلنا نستلهم منها بعض المواقف الشجاعة تفيدنافى المرحلة الصعبة التى نمر بهايكفينا بوب مارلى وجيفارا نريد نماذج مصرية مشرفة بشكل حقيقى ولا يعرفها الكثيرون ففى هذه الأيام تمر ذكرى تأميم قناة السويس فنريد أن نعرف من كان وراء تنفيذ هذاالحدث العملاق فالرئيس جمال عبد الناصر أعطى أمر التأميم ولكن من قام به وعلى من كانت ستقع نتيجة الفشل فى تحقيقه نريد أن نعرف الجنود المجهولة وراء تأميم قناة السويس، نريد أن نعرف كبف قاوم أجدادنا العدوان الثلاثى من أقوى دولتين ومعهم ذيل ... حتى ردوه خائباربما نستلهم منه ويستهلم معه أخواننا فى لبنان روح المقاومة ولنؤكد أننا جميع العرب فى خندق واحد.شكرا لسعة صدركم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132237/http://www.20at.com/article2.php?sid=1109"

[[comments]]
order = 1
subject = "مبارك وأصله الواطي"
author = "http://ibnbahya.blogspot.com"
posted = "2006-07-30"
text = "تعرف يا مبارك يا واطي .. أنا عارف ودارس تاريخ اللي جابوك كويس أوي أوي .. يعني ممكن تعملهم على غيري من الشعب الغلبان لكن علينا احنا لأ يا واطي ... فاكر المسشار سيف النصر ؟؟؟ فاكر لما كنت تقف له غصب عنك وهو وزير بس وانته الريس ؟؟؟ عارف ولا نسيت يا واطي ؟؟؟ لأنه المستشار سيف النصر كان بيشتغل في القضاء في ذات المحكمة اللي كان أبوك المرحوم بيشتغل فيها كاتب بقرشين ... منين جبت المليارات دي يا واطي غير من فلوس العمالة والخيانة ونهب الشعب ... طيب انهب مش مهم .. لكن تنهب وتبيع البلد للصهاينة يا واطي ؟؟؟<br />أهو ده اللي مش ممكن يعدي .. صحيح انته بتضحك على الجيش دلوقت بكام شقه وكام عربية وكام مصيف .. لكن انته فاكر إن جيشنا خلصت الرجاله منه ؟؟؟ تبقى غلطان يا ابن عمي مبارك بتاع الدمغه .. قريباً جداً حيدوسوك بالنعال يا واطي .. لسبب وحيد .. مش النهب ولا السلب ولا السرقه ولكن بسبب بيعك البلد لليهود يا واطي ... راجعوا اللي اشتروا القطاع العام .. راجعوا شركاء المصريين وانتم تعرفوا ازاي هو بايعها لليهود .. كل مستثمر مصري له شريك يهودي بره .. دول رجال الأعمال الجدد الحلوين بتوع الريس وإبن الريس اللي جده عم مبارك بتاع الدمغه قدام باب المحكمة في ......... عارف محكمة إيه يا واطي ؟؟؟؟<br />إبن بهية<br />http://ibnbahya.blogspot.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132237/http://www.20at.com/article2.php?sid=1109"

