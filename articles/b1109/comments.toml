subject = "اتلهوا"
author = "مفروسة"
posted = "2006-07-31"
text = "والنبي تتلهوا مارلي مين ونيلة مين ولبنان محروقة ومضروبة انتوا مش هتبطلوا هيافة بقى وبعدين ما احنا يعني عندنا سمير قنطار واحمد مطر وناس كثيرة قوي تتكلموا عنها ولا هي عقدة الخواجة"
