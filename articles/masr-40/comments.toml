subject = "اظاهر الحكومه مخبيه النسر في علمها اما تموت كل الطيور يبقي علي الحجر"
author = "طارق ياعسل"
posted = "2006-03-30"
text = "زمن العجايب كل الطيور حيصبها انفلونزا الطيور وحتموت الا النسر في العلم المصري وبكدةالعلم المصري الوحيد حيكون علي الحجر وبكده يصبح العلم المصري اثري ومصر تخليه في متحف خاص والدخول حيكون 10 دولار للزائر وبكده نحقق الدخل القومي العظيم وتحيا مصر ونحل مشاكلنا بقي ياه لو يحصل"
archived = "2006-05-24"
