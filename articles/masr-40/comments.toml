[[comments]]
order = 7
subject = "اشهر م النار ع العلم"
author = "كرميلينو"
posted = "2006-03-23"
text = "اولا : في خطأ شائع ان اللي في علم مصر ده نشر فهو لا نسر و لا صقر هو عقاب ( حاجة كده زي الصقر بس على صغير )<br />قولي ليه بقا ؟؟؟<br />عشان في ناس قالوا النسر و الصقر مباكلوش غير الجيفة ( الحيوانات الميته يعني ) اما بقا العقاب فبيصطاد الفرايس ( جمع فريسه ) بذات نفسيته<br />عايزين الصراحه ؟؟<br />نسر ايه و عقاب ايه ؟؟؟<br />مشوها جلدة حنفيه لان العلم الحديث ( لسه من اول امبارح ) اثبتوا ان اصل الانسان جلدة حنفيه و لقوا حفريات في شارع الهرم من مليون و 641 الف سنةو 3 شهور و 4 ايام بتأكد الكلام ده ( رويترز - الفرنسية - اشوشيتدبرس )"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205329/http://masr.20at.com:80/article.php?sid=40&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

