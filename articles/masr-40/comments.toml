[[comments]]
order = 4
subject = "علم .. علم"
author = "فادي اسكندر"
posted = "2006-03-21"
text = "مع ان علمنا مش عاجبني ولا قادر افهم اشمعني النسر يعني اللي في النص وليه مايبقاش صفر مثلا او ليه ميبقاش رمز مهم لمصر ( اصلا احنا معندناش نسور ) .ز<br />الا لو كان مقصود بالنسر هو صاحب الطلعة البهية والضربة الجوية .<br />لكن الغريب فعلا اني بشوف ناس كتير لا تحترم علم البلد ومش قادر افهم ليه<br />يعني انا كنت دايما بسمع عن الجندي العظيم سليمان خاطر اللي اطلق النار علي مجموعه من الصهاينة في سيناء ( بعد الاتفاقية المشؤمة )<br />عشان استهانوا بعلم مصر وبصقوا علية .<br />واتهم وقتها بالجنون ايضا ..<br />اه مهو كل حد ممكن يعمل حاجة محترمة في البلد دي بيبقي مجنون .<br />العلم علمنا .... والبلد بلدنا"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205329/http://masr.20at.com:80/article.php?sid=40&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

