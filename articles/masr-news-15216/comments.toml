text = "والله انتم ناس صح وبتشتغلو صح<br />على فكرة انا بكتب على الانترنت<br />ونفسى اشارك معاكم<br />ياريت تقولو لوى ازاى اشارك معاكم بمجموعة مقالات<br />وعايز كمان … اخد رايكم فى حاااجة كده<br />وبعدين مجلة عشرينات دى بتنزل فين انا عايز اشتريها<br />وياريت تضيفو عندكم فى الموقع امكانية انه يكون فيه اعضاء ومشاركات للاعضاء<br />ليه مفيش الخاصية دى<br />وبعدين مش عايزين تكبرو الموقع بتاعكم ولا ايه<br />احنا عايزن شغل عملى اكثر من كده<br />على فكرة انا ممكن اشارك معاكم فى مشاريع عملية<br />لانى لسه هتخرج جديد وان شاء الله هيبقى حاصل على بكالريوس تجارة وادارة اعمال<br />وعايز اعمل مشاريع بالشكل ده فى مصر السنة دى بعد ما اتخرج<br />فلو حضراتكم عندكم اقتراحات لمشاريع عملية زى دى انا ممكن اشارك معاكم ماديا وعمليا<br />ده تليفونى للاتصال<br />0104883584<br />وده الايميل ايضا للتواصل<br />ahfw88<br />yahoo.com<br />اتمنى انى لااقى رد"
