[[comments]]
order = 1
subject = "حكد تبكي (عفواً .. حقد طبقي)"
author = "مهنـــــــــد"
posted = "2005-12-06"
text = "ا أخي يا كاتب المقال .. ليه الحقد ده بس .. وإيه يعني ما يدلعوهم شويه؟ طيب ما هو الريس المبارك عملها قبلهم .. جات على الغلابه دول يعني .. بطلوا الحقد الطبقي ده .. لو غيران روح اشتغل معاهم.. حلوة الحقد الطبقي دي .. حبة بهارات سياسية من اياها .. أهو كده ممكن أكون عضو في لجنة سياسات المحروس الزغلول .. حضرة فخامة جناب الري الصغنن .. ويحيا سعد .."
archived = "2006-09-26"
capture_url = "https://web.archive.org/web/20060926221420/http://egyvote.20at.com:80/article.php?sid=97"

[[comments]]
order = 2
subject = "بمناسبة الأيمن الماركززي"
author = "مهــــــند"
posted = "2005-12-06"
text = "ب بمناسبة الأيمن الماركززي .. كنت في بلدنا في الصعيد الجواني وشوية عيال غلابه واقفين يصرخوا ويجروا قدام عساكر الإيمن الماركززي (كما ينطقها بلدياتي اللي أنا منهم) والعيال عمال يهاتو في حس واحد .. يا مبارك يا جبان .. جاتك كلب يكون سعران ... يا مبارك يا طرطور جاتك كلب يكون مسعور .. بصراحه أنا اندهشت من صياح هؤلاء بهذه الطريقة .. لأول مرة أسمع مثل هذا .. فمن المعروف أن قرايبينا في الصعيد محكومين بالحديد والنار وحذرة البيه ظابط النقجطه ممكن يبهدل اللي خلفوهم .. بصراحه فرحت جدا بالعيال دول اللي خرجوا على كل أعراف القرية والتي من أهمها وأولاها الخوف الشديد من حضرة البيه الظابط لأنهم كلهم تقريباً عندهم مشاكل مع بعض وثأر وبلاوي وحضرة البيه الظابط ممكن يفوت ويصهين لو هما كانوا جدعان معاه ويا ويله وسواد ليله اللي ما يسمعش كلامه .. يمسح بيه الأرض ويخليه يبيع عياله عشان يجيبله حتة سلاح يسلمها للمركز ويا عالم ترسانة السلاح اللي بتتلم دي بتروح فين .. طبعا بيبيعوها الظباط ويفرقوا ثمنها على بعض ويحطوا مكانها حتة سلاح تانية قديمة .. وبتتباع لمين ؟؟ لصاحبها برضه .. شفتوا شرطة وأمن الحزن الوطني ؟؟ بس اللي محيرني لغاية دلوقتي .. إيه علاقة مبارك .. الراجل السكره ديه بالكلب المسعور ؟؟؟"
archived = "2006-09-26"
capture_url = "https://web.archive.org/web/20060926221420/http://egyvote.20at.com:80/article.php?sid=97"
