author = "ماائة فى المئة"
posted = "2009-06-29"
text = "العنوان خاطىء<br />100 % من الشباب عايزين يهربوا من البلد<br />لا شىء غير الجلوس فى البيت والمقاهى ومطالعة اعلانات الوظائف<br />مفيش اى شغل فى القطاع الخاص<br />الشغل فقط فى مجال المعمار والبناء للمبلط وحداد المسلح واعمال الفاعل مثل حمل الرمل والزلط<br />الوضع صعب جدا<br />9 مليون عانس بسبب البطالة<br />منتظرين اية"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062947/http://www.20at.com:80/masr/2khbar/12499-25-.html"
