text = "لما يكون اكتر من نص شباب البلد كارهها يبقى فى حالة الحرب أكيد ولائه للى بيأكله لقمة عيشة وللبلد اللى خلته يقدر يتجوز ويستقر ويكون انسان ده غير اللى كاره السلبية والمحسوبية والكوسة والله العظيم حرام"
