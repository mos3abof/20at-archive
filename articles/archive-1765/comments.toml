[[comments]]
order = 1
subject = "هبهوب"
author = "عادي يعني المهم يبقي الواحد مخترم في لبسه , وخلاص . والاحترام دي اساسا مساله نسبيه من شخص لشخص , ماشي يعني اللي شايفها خمار اللي شايفها نقاب اللي شايفها ايشارب ."
posted = "2006-02-14"
text = "فا استفتي قلبك ولو افتوك الناس . ومفهاش حاجه لو بقينا مسلمات ومظهرنا كووووووويس ولا ايه يا كاباتن ؟؟ّ!!!"
archived = "2006-11-02"
