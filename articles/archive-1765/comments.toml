subject = "بالله شو"
author = "جوجو الاردن"
posted = "2006-06-07"
text = "والله انتو حاطين ضد عمان الغربيه كلكم ول لشو هيك كل شي الغربيه ول رح تقسموا البلد بعدين يا جماعه المهم الاحتشام ما انتوا شايفين الخلاعه الصايره طيب تلبس شرعي موضه ولا تلبس فرعي موضه لانو الفرعي هاد ما شاء الله وكان ما بيستر منها شي<br />فاهدايه من الله والله يهدينا واياكم الطريق الصحيح قووووووووووووووووووولوا امين امين اللهم امين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115915/http://www.20at.com/article2.php?sid=442"

