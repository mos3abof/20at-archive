[[comments]]
order = 11
subject = "بنت اردنيه من الوريد للوريد"
author = "مرح"
posted = "2006-10-25"
text = "انا مرح من الاردن بس بدي احكي انه ليش كل الهجوم هادا على بنات عمان مع انه بصير في دول تانيه طبعا عربيه اكتر من الي بصير في الاردن ليش ما تحكوا عن بنات مصر ولا لبنان او سوريا وعدا عن ذلك ئستوا الموضوع على مستوى الاردن كله مش على مستوى عمان كونه في بالاردن مدن محافزه كتير كتير متل عجلون والطفيله وجرش ومعان والكرك وغيرهم كتير ارجوا منكم عدم تعميم هادا الموضوع على كل بنات الاردن زي مافي المش منيح في المنيح وشكرا للجميع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115915/http://www.20at.com/article2.php?sid=442"
