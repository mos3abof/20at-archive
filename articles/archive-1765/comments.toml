[[comments]]
order = 2
subject = "الله يسعد كل من قراء تعليقي"
author = "والله محبك:::"
posted = "2006-02-15"
text = "أحبتي والله لمأكتب الا لاني احبكم في الله ..<br />الحجاب مالغاية من الحجاب (الكتاب بين من عنوانة)<br />اي يكون بينك وبين الاخرين ستر وحشمة وعدم انجذابية<br />هذة هي الغاية من الحجاب كما قالت عائشة رضي اللة عنها ان الصحابيات اذا خرجن كانهن الغربان من السوادوالستر .. حيث ان الفتاة درة مكنوة وسط صدفة والا ما الفرق بين الرجل والمراءة<br />وأما النقاب في أيام الصحابيات :كان مختلفا جدا عن ايامنا هذة ...............<br />أحبتي ..أن الدين النصيحة<br />.......والدليل ان الوجة واجب التغطية<br />عن عائشة رضي الله عنها قالت:<br />كان الركبان يمرون بناونحن محرمات مع الرسول صلى الله عليه وسلم فإذا جاؤنا سدلت أحدانا جلبابها على وجهها من رأسها .فأذا جاوزونا كشفناه.رواة أحمد وأبو داود وابن ماجة.<br />ففي قولها ((فإذا حاذونا )) تعني الركبان ((سدلت إحدانا جلبابها على وجهها))دليل على وجوب ستر الوجه إذا كان بحضرة أجانب. و كشفه اذا لم يكن بحضرة أجانب والدليل على ذلك انها قالت ((فإذا جاوزونا كشفناه)) .<br />فدليل ذلك أنة واجب من تغطيتة إذا كان في حظرة أجانب وواجب من تغطيتة أذا لم يكن هناك أجانب فا الواجب لايعارضة الا الواجب<br />فلولا وجوب الأحتجاب وتغطية الوجة عند الأجانب ماساغ ترك ترك الواجب من كشفه حال الأحرام<br />وقد ثبت في الصحيحين وغيرهما :أن المرأه المحرمة تنهى عن القفازان والنقاب .قال شيخ الأسلام أبن تيمية :وهذا مما يدل على أن النقاب والقفازين كانا معروفين في النساء الاتي لم يحرمن وذلك يقتضي ستر وجوههن وأيديهن . منقول من كلا م الشيخ العلامة ابن عثيمين يرحمة الله ..وهناك أدله أكثر من ذلك من يريد يكتب لي إيميلة كي أرسل لة<br />والله على ما أقول شهيد<br />محبكم في الله.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115915/http://www.20at.com/article2.php?sid=442"

[[comments]]
order = 3
subject = "لا تستفت قلبك و استفت العلماء"
author = "أكرم"
posted = "2006-02-15"
text = "اولا احب اقول ان حديث استفت قلبك و لو افتاك المفتون حديث ضعيف جدا ( و لو كان هناك علماء حديث عصريون لقالوا ضعيف طحن ) و للاسف هناك كثير من الناس مثل صدقتنا في الموقع هبهوب تبني عليه افكار كثيرة في الدين و خصوصا في المسائل الخلافيه<br />اما عن موضوع الحجاب الموضة او الحجاب التقليدي فالمهم هو الاحتشام العملي و ليس النظري او البصري اولا ثم بعد ذلك يأتي الدور على المظهر<br />فكل اناء ينضح بما فيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115915/http://www.20at.com/article2.php?sid=442"

[[comments]]
order = 4
subject = "لا حول و لا قوة إلا بالله"
author = "غيور حتى النخاع"
posted = "2006-02-15"
text = "الحمد لله و حده و بعد إن الذي يخضع تدينه لهوى النفس ليس من التدين في شيئ بعض محجبات اليوم ربما هن متبرجات الأمس و لكن قد أقول بأن بعض الشر أهون من بعض إلا أنه يتعين على من تريدأن تتعبد إلى الله بالحجاب ان تقرأ عهن مفهو الحجاب الشامل و تلتزم به إن أرادت رضا الله و إلا فلن تعدوا إلا ان تكون رمز فتنة ينضم إلى ركب فتن النساء التي تعوض الشياطان في كثير من الإغراء و الله لا يضيع أجر من أحسن عملا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115915/http://www.20at.com/article2.php?sid=442"

[[comments]]
order = 5
subject = "قلب المؤمن دليله"
author = "نيفين"
posted = "2006-02-16"
text = "فعلا لا تعارض بين ان الواحد يرضى ربنا و يلبس كويس يعنى مفيش تعارض بين الحجاب و بين اننا نظهر بمظهر كويس<br />بس انت صدمتنى يا اكرم لما قلت لهبهوب ان دا حديث ضعيف طحن لانى ماشيه بالمبدا دا فى حاجات كتير ف حياتى<br />بس دا ميمنعش ان الدين يسر و ليس عسر كما ان قلب المؤمن دليله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115915/http://www.20at.com/article2.php?sid=442"

[[comments]]
order = 6
subject = "الدين يسر طحن برضوا"
author = "أكرم"
posted = "2006-02-16"
text = "فعلا الدين يسر بس للاسف في مفاهيم في الدين ممكن تكون واضحة و سهلة و بسيطة طحن بس الواحد ممكن يفهمها عكس كده خالص و الدليل على ذلك قالوله ( قالوله ايه بقا )<br />كلنا طبعا عارفين ايه سورة البقرة ( لا يكلف الله نفسا الا وسعها )<br />كتير مننا بياخد الاية دي زريعه عشان يعمل اي حاجة على اساس ان دي استطاعته<br />لاكن معنى الايه غير كده خالص<br />و معانها ( مش من عندي طبعا ) ان ربنا في كل اللي شرعوا لنا و انزله في كتابه و على نبيه ( صلى الله عليه وسلم ) في استطاعة البشر اي ان كل تكليف كلفه لنا ربنافي وسعنا عشان كده الاية اللي بعدها ايه ؟؟<br />( ربنا لا تؤاخذنا ان نسينا او اخطأنا ) الى نهاية الايه<br />شفت الدين سهل ازاي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115915/http://www.20at.com/article2.php?sid=442"

