subject = "الخطوة الاولى"
author = "عبدالله مفتاح"
posted = "2006-02-14"
text = "يعني ممكن نعتبر الحجاب العصري خطوة اولى للبنت اللي مش محجبه نحو طريق الالتزام لكن ان بنت المفروض انها ملتزمه وبعدين تلبس الحجاب العصري وتقول يجوز، اظن انها تدايق شويه<br />وربنا يهدي الجميع"
archived = "2006-11-02"
