[[comments]]
order = 5
subject = "تصحيح"
author = "mezo"
posted = "2006-06-15"
text = "على فكرة يا أخ Ali اللي قال الجمله الشهيرة دي كان المعلق القدير ( علاء الحامولي ) نجم الزمالك المؤدب ؟؟؟ هأهأهأ<br />و ليس المعلق المحترم بجد المرحوم علي زيور الأهلاوي القدير الذي أملا شروطه على التليفزيون للتعليق و رفض أن يكون مثله مثل عصام صيام و الثعلبي و الكابتن محمد حسام و آخرون كثير ...الله يمسيهم بالخير و يبعدهم عنه<br />و بالمناسبة بعض المعلقين مثل الدكتور طارق الأدور عفا الله عنه يفضل طول الماتش يقول ( فاكرين حضراتكم ( اصله مؤدب ) سنة 1995 كان اللاعيب ده عنده 12 سنة و لسه كان بيرضع لكن كان معجزه و مين اللي كان بيلعب معاه ابن خالته اللي هو جانبه ده و جاب 160 جون في ماتش الدور النهائي في الدور الرمضانية سنة 63 ) كل ده و الماتش سخن نار و دخل جونين و هو عمال يقول احصائيات و أخبار قديمة كلها<br />و آخرهم في ماتش الزمال و الاسماعيلي الأخير الماتش كان متوسط المستوى لكن البيه الدكتور عامل يقول فريق الإسماعيلي في التسعينات و بعد كده لما خدوا الكاس و مش عارف اسماء اللعيبة لما خده الدوري و يعني جه تبديللازم يعلق عليه قطع عليه الأسامي رح قايل ( لما أكل لحضرتكم اسامي فريق الاسماعيل اللي خد الكاس )<br />و الكابتن عصام صيام و هو بيعلق يقولك ( الشوطه دي 7 من عشرة ) ( الكورنر ده 8 من عشرة ) تقلش إحنا في حصة حساب<br />و لا الكابت محمد حسام يعيني في كل كرة يقول : أخر تعديل من الاتحاد الدولي بالنسبة للكرات الثابتة أن المسافة تكون 9 متر و معرفش كام سنتيمتر مش عشر ياردات زي زمان كان ناقص يرمي للحكم متر و يقوله قيس ياعم عشان الحيطة<br />و زي الأخ مبيقول الحكم سيد قراره و الحكم مبيرجعش في قراره و احنا لا نعلق على قرارات الحكم إلا أنه و بكل برود لازم يعلق على قرار الحكم و خاصة في الاعادة ؟؟؟؟هو لو كان مكان<br />اقرأ بقية التعليق .."
