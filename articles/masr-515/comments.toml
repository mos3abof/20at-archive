posted = "2006-06-14"
text = "الله يمسيه بالخير الكابتن علي زيور كان معلق زملكاوي ممتاز في مرة كان بيزيع ماتش للزمالك وكانت الكورة مع حسن شحاتة وماشي حسن وماشي حسن وماشي حسن راحت الكورة طلعت أوت .. راح قال بالحرف الواحد على مرئى ومسمع الجماهير مباشر ع التلفيزيون ((... يا حسـن)) واتعاقب فيها وكاد يكون مش هايزيع مبارايات تاني"
