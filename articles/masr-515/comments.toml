text = "اللى عايز يتشل يستحمل تعليق معلقين ال art<br />حماس مفتعل و عدم فهم و ضح جدا من عدم نطقهم حتى لاسامى اللعيبه<br />و للاسف مضطرين نتحمل لان مفيش مكان تانى نشوف فيه المونديال<br />حاولت مره اجيب تعليق انجليزى اتشليت اكتر<br />يعنى هو لا حماس زايد يحسس الواحد انه بيشوف النهائى يا تعليق ميت<br />فين تعليق مدحت شلبى<br />فين مجدى عبد الغنى الباشا على راى عبد الله<br />فعلا هيصه و جو كانك ف قهوه<br />ربنا بصبرنا"
