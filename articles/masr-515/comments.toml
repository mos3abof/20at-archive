subject = "والله ياكابتن عندك حق،،"
author = "am00r"
posted = "2006-06-14"
text = "ههههههههه<br />مقال جامد جدا يا كابتن ايهاب، و عندك حق فيه، انت قولت الي الي في قلبي و ساكت و بسر..<br />ياعنى واحد زي الكابتن عصام صيام، الي اول مره اعرف انه لوا، انا ما بكرهش حد فى التعليق قد ما بكره، الكورة تبقى هجمة خطرة جدا و تلاقيه نايم طول الماتش يا ايما مشغول فى الموبايل بتاعه الي عمال يرن و يقرفنا فى المايك، و تلاقيه بيتفاعل مع الاعادة قوى، \"اللللللله، كورة خطرة\"<br />اما بقى مجدي عبد الغنى فدا فعلا حكاية فى التعليق\"D\" طبعا ماتش البرازيل و تركيا كان اول مره اسمعه، و ياعينى عليه و هوا بيقول على لسان سكولاري\"جولا بولا\" ياعنى العب الكوره، صباح اللغة يا ابو الكباتن، و افتكرو كمان فى ماتش لأسبانيا انو قعد تقريبا 5 6 مرات يحاول ينطق اسم راؤوول جونزليو - جونسون - .... لغاية ما جابها، الكابتن راؤوول \"بس\".<br />بس يمكن تكون ظلمت شويه الكابتن مدحت شلبي، بيدي جو للمتش برده، و على رأيه \"يخرب عقلك يا راجل...\""
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218163836/http://masr.20at.com:80/article.php?sid=515&PHPSESSID=bd9c79a3e273b938ff04640135eaf995"

