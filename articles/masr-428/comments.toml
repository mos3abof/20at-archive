[[comments]]
order = 10
subject = "فاروق ولامؤاخذه حسني"
author = "متغاظ"
posted = "2006-06-04"
text = "لازم فاروق ولمؤاخذه حسني (عارفين ولا اقول) بيتهم النقاد أنهم السبب علشان ما اعترضوش علي اقامة الحفل في قصر ثقافة بني سويف علشان النار ح تمسك فيه والناس ح تولع ... طب الصحافة ازاي بتعرف كل حاجة عن الحكومة ومتقدرش تعرف المصايب دي ... واشمعني عرفه انه خواجه (مفهومة دي) مع انه محلف صاحبه انه يكتم خبره<br />فعلا المحروقين السبب عارفين ليه ... علشان مافيش واحد فيهم فكر ياخذه بالحضن علشان يولع ويخلصنا منه"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133402/http://masr.20at.com:80/article.php?sid=428"

[[comments]]
order = 11
subject = "كم تبلغ ثروة \\\"صفوت الشريف\\\" ؟"
author = "طيفور"
posted = "2006-06-05"
text = "تخطت ثروة \" إبن صفوت الشريف \" مائة مليون جنيه من البيزنس فى عشر سنوات !!! ، لكن ما هو البيزنس الذي يربح هذه الأموال الطائلة فى هذه المدة القصيرة نسبيا؟؟؟ خد عندك : وضع اليد على عشرات آلاف الأمتار من اراضي المدن الجديدة المزودة بالمرافق و بيعها بعد ذلك ليرتفع ثمن المتر من 5 جنيه لألف جنيه أو أكثر ( بدون أن يرد اسمه فى أى عقد أو ورقة مكتوبة )، شفت النصاحة، فقط يكفى ان تسمع ( همسا) ان هذه الأرض (محجوزة لفلان بيه ...<br />و الآن جاء السؤال المهم<br />كم تبلغ ثروة صفوت (الشريف ) الأب<br />إذا كانت ثروة الإبن تخطت المائة مليون جنيه ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133402/http://masr.20at.com:80/article.php?sid=428"

[[comments]]
order = 12
subject = "سرقة الملايين فى عهد مبارك واولاده"
author = "جمال محمد حسن"
posted = "2006-07-15"
text = "حسنى مبارك عفوا ابو علاء الله لا يسامحة خرب البلد هو وشوية اللصوص اللى جايبهم من المافيا ان الله منتقم جبار سوف يرا هو واولاده الجحيم العظيم فى الدنيا والاخرة بسبب تدمر الاقتصاد وجر الشعب المصرى الى فقر ليس له مثيل ياسادة انه هو واولاده والكلاب اللى حوالية عايشين على دم الشعب المصرى"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907035028/http://masr.20at.com:80/article.php?sid=428"

[[comments]]
order = 13
subject = "اللواع عبد الفتاح عمر عبيد"
author = "بلدياتة وخايف يعرفنى"
posted = "2006-08-07"
text = "لا استغرب من عضو مجلس الشعب المغروروالجزار السابق بالداخيلية وصاحب التاريخ الاسود بانة يوافق على سحل القضاة كيف هزا يمثل المواطنين الزين اختاروة ولكن السن لة حكمة والتخاريف الايام دى فى مصر كتيرة مرة من الرئيس مبارك وابو شريف وطارق عمنا عبد الفتاح وربنا يستر علينا من اخوة عبدالستار عمر بتاع الفتن وابن عمة فريد وعيالة بتوع الحريم ولكن لابد ياعبد الفتاح من النهاية لان كل ظالم ولة نهاية وجميع البرامج التى ظهرت فيها تدينك وتكرة فيك الناس لانك بتخرف قوى ياابو شريف وحاجة تكسف اللى حصل مع منى الشازلى مرة تؤيد الرئيس ومرة ضد الرئيس ومرة مع الحزب ومرة ضد الحزب وعاوز الناس تسيب البلد اذمكانش عجبها كلامك يااخى كفياك واحترم نفسك بلاش فضايح وسيب اى حد غيرك يبق نايب / عصمت / شريق / طارق / احمد عبداللاة / طب حتى سيبه لزكريا والا اقولك سيبها لابراهيم غزالى صاحبك الجديد / اللة يرحم المرحوم / عبداللاة عمر نائب والا احسن وزير علية رحمة اللة"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907035028/http://masr.20at.com:80/article.php?sid=428"

