subject = "يااااااااااا بق ع الفاضي"
author = "الاستاذشيكو"
posted = "2006-06-01"
text = "المعلم صف صف بق كبير ع الفاضي ايوة والله<br />مش هو امين الخراب الوطني ااااااااسف الجرب الوطني يوووووووة خلاص مش هاكتب اسمه<br />هوة باين عليه كان بيحلم والله ومن كلامه يبان انه كان بيحلم<br />اما بخصوص القنوات الفضائيه فكل اللي يبث من مصر تبع الخراب الوطني والمبارك وجمال واللي في فلكهم<br />وهي كده غصب عن الكل ومحدش ينهض يفتح بقه"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133402/http://masr.20at.com:80/article.php?sid=428"

[[comments]]
order = 5
subject = "صدام حسين"
author = "ابو كرتونة"
posted = "2006-06-01"
text = "كفاية يا صدام<br />اســـــــــف<br />كفاية مبارك<br />التاريخ يعيد نفسه<br />شوفوا صدام عميل الامريكان سابقا كان بيعمل ايه في المعارضة العراقية<br />وشوفوا مبارك عميل الامريكان+ اليهود كمان الان بيعمل ايه في الشعب المسكين الجعان<br />ان التاريخ يعيد نفسه تاني<br />صدام في السجن وعدي وقصي قتلوهم الامريكان<br />الم تتعظ يا مبارك<br />وتلاحظ وجه الشبه الكبير بينك وبين صدام<br />صدام وعدي وقصي<br />مبارك وجمال وعلاء<br />ان الشعب المصري لن يرحمك<br />لا ..للتمديد..لا..للتوريث..لا لمبارك"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133402/http://masr.20at.com:80/article.php?sid=428"

[[comments]]
order = 6
subject = "شعب جعان وعاطل ومسرطن"
author = "ابو كرتونة"
posted = "2006-06-01"
text = "لماذا يتغافل رئيسنا العجوز عن الكوارث التي جلبهالنا في عهده الميمون المليء بالكوارث والمصائب , تحل علينا من كل صوب<br />من شعب فقير ينافس في فقره الصومال وجزر القمر, شعب اغلبه فقير الا من قلة تستحوذ علي نصيب الاسد من الدخل القومي, فلا تتعجب عندما تري بنت صغيرة او ولد (فافي) يستقلوا سيارة ثمنها نصف مليون جنيه وبجانبها امراة عجوز ليس معها عشرة جنية ثمن الدواء او موظف غلبان مش لاقي يجيب الاكل لعياله لدرجه انه بيفكر لا يسرح مراته علشان تيجب فلوس او يحد نفسه تحت قطار علشان يستريح من الدنيا الوسخة بنت الكلب, او شاب عاطل مؤهل جامعي راح لطوب الارض علشان يتعين بــ150 ملطوش علشان يعرف يعيش ومش ياخذ المصروف من ابوه,وكمان مش لاقي شغل طيب الشاب ده يعمل ايه؟؟؟ وهوسنه وصل الثلاثين وشعره ابتدء يبيض ونفسه يجوز ويفتح بيت, ويعيش حياة طبيعية , بس منين<br />مش ليه حق يحقد علي الحمار وهو شايفة بيعاشر الحمارة بتعته.<br />وكمان مش كفايه النسوان وهي ماشيه تهتز كالافاعي بالاحمر والاخضر والوسط المحزء<br />طيب الشباب العاطلين يعملوا ايه وهما قاعدين علي القهوة من سنين وشيفين البنات الحلوة ديه.<br />لازم الشباب بيتعب اوي من المناظر ديه, طيب يعملوا ايه يا مبارك<br />ايوة انا عرفت الحل بتاعك الجميل<br />مبارك يعلن عن بداية تنفيذ برنامجه الانتخابي للتشغيل:<br />مطلوب وظائف فني خياط للمصانع<br />والشروط :1 الحصول علي مؤهلات عليا ويفضل الدكتوراه والماجيستير<br />2 لا يوجد تثبيت<br />3 امكانية الطرد في اي وقت<br />4 والمفاجئة المرتب 250 جنيه<br />ايه الحلاوة ديه (خياطين)<br />بس خياطين ايه بالصبظ<br />وضح يا مبارك"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133402/http://masr.20at.com:80/article.php?sid=428"

[[comments]]
order = 7
subject = "البلد ضاعت"
author = "مهندس/ عبود الشرقاوي"
posted = "2006-06-01"
text = "صدقنى يا سيدى.. حتى لو آل مبارك تركوا الحكم، وجاء حاكم آخر فنحن راضين عنه فمن المستحيل عودة البلد ما قبل 25 سنة.. وإصلاح ما أفسده آل مبارك لسبب واحد.. لأن آل مبارك أفسدوا وخربوا ودمروا البلد لمدة 50: 60 سنة قادمة.. لقد أهلكوا الحرث والنسل، لقد دمروا صحة الإنسان المصرى.. حتى الجنين فى بطن أمه الآن أفسدوا عليه غذاءه.. لقد أصبحنا حقل تجارب للغرب لنفايتهم التى يجلبها آل مبارك لهذا الشعب المسكين.. إنها الحرب الصليبية الصهيونية الباردة على الإسلام.. ولهذا أقول مفيش فايدة لقد ضاعت البلد.<br />وحسبنا الله ونعم الوكيل."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133402/http://masr.20at.com:80/article.php?sid=428"

[[comments]]
order = 8
subject = "مين العبقري اللي كتب التعليق بتاع الرقعه فوق"
author = "مرمورة"
posted = "2006-06-02"
text = "بجد بجد اللي كتب التعليق بتاع الرقعه فوق ده عبقري......... التعليق بتاع تصريحات جمال مبارك اللي مش بتستدعي القئ لكن يلزمها 21 حقنه....... بس هو نسي حاجه ان مش جمال مبارك بس ده كل تصريحات الوطني بتستدعي 21 حقنه وكمان بتجيب قئ ومغص وروماتيزم وسل ودوالي وكل الامراض المستوطنه واللي كانت مستوطنه بس لقت بلدنا مش نافعه فراحت تسوتطن في حته تاني<br />بجد بجد حرام عليهم اللي بيعملوه فينا منهم لله قوموا عليا كل الامراض"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133402/http://masr.20at.com:80/article.php?sid=428"

