text = "من شابه رئيسه فما ظلم , انظروا الى تصريحات مبارك على مدار 25 سنة أشغال شاقة و حجم التناقض إلى فيها..يكفى أن آخرها وعد الصحفيين بإلغاء الحبس فى قضايا الرأى ! ولا وعده بإلغاء الطوارىء الذى ابتلعه على الفور !<br />بس حلوة منك حكاية ترتيب موقع الحزب من أليكسا :)"
