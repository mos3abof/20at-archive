[[comments]]
order = 5
subject = "حسبي الله ونعم الوكيل"
author = "ابو شريف"
posted = "2006-06-25"
text = "كثرت الأمراض السرطانية في مصر وستكثر بسبب مانأكله من مبيدات وما نشربه ولكن هل النفسية المصرية اصابها ورم سرطاني اشد ماالمني هو تخيلي لمشهد العجوز المريضه وتلك الممرضه جالسه علي كرسيها دون حراك ... فلنحبث جميعا عن ازالة الاورام في النفسية المصرية ولابد لنا ان نترابط فالحكومة زائلة والحاكم زائل ولكن الشعب هو الباقي فلنمسك بيد بعض نشد من ازر بعضنا البعض فإننا الآن في أشد الإحتياج لنا"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117144255/http://masr.20at.com:80/article.php?sid=545&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
