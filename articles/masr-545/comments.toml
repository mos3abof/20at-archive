subject = "الصبر على البلاء"
author = "محمد حسن غنيم"
posted = "2006-06-20"
text = "الحمد لله على شيء<br />الحمد لله الذي لا يحمد على مكروه سواه<br />المرض بلاء و البلاء تكفير عن الذنوب<br />ولكن من هنا نتسأئل<br />هل تودى خدمة مريض السرطان في مصر على أكمل وجه؟ محمد حسن غنيم<br />سؤال يفرض نفسة<br />هل من إجابه"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141551/http://masr.20at.com:80/article.php?sid=545"

