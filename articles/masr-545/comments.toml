[[comments]]
order = 0
subject = "لا كرامة لمصري في وطنه"
author = "أمير"
posted = "2006-06-20"
text = "الله يسامحك ... قلبت علينا المواجع.. صدقت و الله لا كرامة لمصري في وطنه..لقد أدمنا إهانة و إذلال بعضنا البعض ...لماذا أصبحنا كذلك و من الذي صيرنا إلي ما صرنا إاليه.أين الشهامه و الطيبه و الرجوله و النخوه و المبادرة إلي نجدة الملهوف و غيرها من القيم التي إشتهرت بها الشخصية المصرية زمان ؟؟ لقد فقدنا كل ذلك . لماذا أصبحنا شعب ليس له قيم أو أخلاق ؟ شاهدت بعيني في مستشفي الزقازيق العام بقسم الطوارئ ( الشرقيه بلد الناس الطيبين ) شاهدت مريضه كبيرة السن مصابة بأزمة ربوشديدة وهي تدخل علي علي الطبيب تكاد تسقط علي الأرض من شدة الأزمه وضيق النفس تقول للطبيب إنجدني يابني أزمة الربو هتموتني ... لم يتحرك الطبيب من كرسيه و لم يكلف خاطره بوضع السماعه علي صدر المريضه للتأكد من حالة المريضه . كل ما فعله أنه كتب ورقه صغيره ناولها للمريضه وقال لها اذهبي إلي الست الريسه خدي الأبره ( يقصد الممرضه بالطبع ). ذهبت المريضه إلي الست الريسه في الحجرة المجاورة وهي تكاد تسقط من طولها من شدة الأزمه.وفي مكتب الريسه كانت نفس المعامله قرف ووش مقلوب وحقنه علي الواقف ودلقت المريضه ( ألف سلامه ياحاجه) اللي بعده.أعتقد أن كثير منكم يلقي نفس المعامله في المصالح الحكوميه...المستشفيات..أقسام الشرطه.المرور..السجل المدني...الشهر العقاري.. وأي مكان في مصر المحروسه يضطرك حظك التعيس أن تلجأ إليه لقضاء مصلحه.حد عنده تفسير لماذا تغيرنا ياجماعه ؟؟؟؟"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141551/http://masr.20at.com:80/article.php?sid=545"

[[comments]]
