[[comments]]
order = 3
subject = "إعترافات طبيب"
author = "اللي شوفتيه ووصفتيه شئ عادي ومتكرر ونوع من الفساد الإداري وأكيد المالي في كل مستويات وزارة الصحة المصرية,بداية بالوحدة الصحية في أي قرية منسية وتلاقى فيهاالطبيب دايمامزوغ,وإذا أقام بالوحدة يتفرغ للصياعة مع الممرضات وسرقة أدوية الغلابة زي علاج البلهارسيا ويبعها والإستيلاء علي حوافز ومرتبات الموظفين و أيضا بعض الأطباء مقابل عدم حضورهم وحكاوي تانية كتير.يجي بعد كدة المستشفيات العامة في المدن وهي صورة مكبرة للإهمال والفساد بكل أشكاله بيشتغل فيها أخصائيين نص لبة وعاملينها مكتب لتحويل المرضي لعيادتهم أو فاكرينها غرفة العمليات الملحقة بها,تلاقي بتاع الجراحةبيفتح ـ متفهمونيش غلط ـ ويحط في جيبه وبتاع النسا بيولدويحط في كرشه.ولما الناس تحتج وتقول معناش ولايفتكرو إن مستشفي عام يعني بلاش والعياذ بالله.يكون الحل هو عربية الإسعاف يعني التحويل وتكبير الدماغ حتي لو حالة ولادة بتنزف أو مصاب في حادثة علي وشك الموت والحجج كتيرومحدش بيحاسب.والتحويل بيكون للمستوي الثالث من الفساد ـ أقصد المستشفيات ـ وده بيكون مثلا زي المستشفيات والمعاهد التعليمية أومستشفيات المؤسسة العلاجية أومعاهدومستشفيات المجالس الطبية المتخصصة ـ نفسي واحد في مصر كلها يقولي إية الفرق بينهم في نوعيةالخدمة الطبية اللي"
posted = "2006-06-20"
text = "بيقدموها.والجايزة؟ عمليةإزالة المرارة اللى أكيد إتفقعت من حكومة النضافة, وكمان متنسوش فيه مستشفيات التأمين الصحي و المستشفيات العامة في المحافظات وكله سبوبة فساد في فساد.المهم,المستوي التالت ,ده مستوي الفساد الكبير والورق المتستف ـزي العبادي بتاع المصل و اللقاح ـ أنا إشتغلت لفترة في المستوي ده وسمعت كتيرأوووي بأمارة مستشفي شرق المدينة بالإسكندرية و غيرها. وطبعا نتيجة البناء المهترئ ـ حلوةأوي الكلمة دى ـ للوزا<br />اقرأ بقية التعليق .."
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141551/http://masr.20at.com:80/article.php?sid=545"

