posted = "2006-05-08"
text = "شباب محدش لقى دوله اسمها مصر ضايعه اصلى بدور عليها من خمسه وعشرين سنه يا ريت لو حد عثر عليها يبلغ الشعب المصرى بسرعه اصله بيدول عليها هوه راخر ملعون ابو العيشه كده انا مش عاوز ابقى مصرى لو دى هى مصر مش عاوز ابقى مصرى لو ده حاكمها مش عاوز ابقا مصرى لو دى قوانين مصر يا رب ابعتلنا الى يقدر يغير"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

