[[comments]]
order = 34
subject = "قرفان قوى من حسنى مبارك"
author = "برضوا قرفان قوى"
posted = "2006-05-07"
text = "على فكرة ده هوه إللى عرى نفسه بنفسه يوم لما باع البلد للأمريكان واليهود علشان يضمن وجوده فى الحكم ويوم لما حط شعبه فى المعتقلات الشعب إللى كان ممكن يستر عورته لكنه هو لم يحاول فى يوم من الأيام أن يحتمى بشعبه ولكنه طلب من أمريكا أن تحميلة لأنه عارف كويس قوى كمية فساده هو وحثالة المجتمع إللى حواليه وعارف إن الشعب مش طايقة من أعماله القذرة ونهبة وسلبه فمثلاً الزعيم الشريف أحمد عرابى قال لقد خلقنا الله أحراراً ولن نورث بعد اليوم عارف قالها لمين يا عميل الأمريكان واليهود قالها للقنصل الإنجليزى والقنصل الفرنسى وكانوا بيحاولوا يرضوه علشان يبقى عميل ليهم لكنه فضل يبقى حر ويدافع عن شعبه دى حته ثقافه بس علشان أنا عارف إنك متعرفش غير النهب والسلب يا حيوان"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

[[comments]]
