text = "اللي شفته النهاردة ... عند نقابة المحامين ...ونادي القضاة...<br />يقول لنا إنه خلاص ... خلع آخر قطعة ثياب مان يغط بيها مفسه ....<br />اللي حضل النهااردة اثبت ....إنه لا لابس هدوم .... ولا معاه هدوم ....<br />ولا يعرف اساسا ... يعني إيه هدوم ...<br />إنه عاري ... وعشان كده ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.vom"
