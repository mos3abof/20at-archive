[[comments]]
order = 13
subject = "حتى لا تستمر الكارثة"
author = "واحد وخلاص"
posted = "2006-04-30"
text = "لابد أن يكون فى مصر رأى عام أكبر وأوعى من ذلك,ان هذا ال0000 لم يحكم هذا الوطن طيلة تلك السنين التى لاتقبلها الحمير الا لأنه لم يجد الا من يفضلوا أن يسيروا داخل الحائط وليس بجواره , لم يذكر التاريخ كله من بدء الخليقة حتى يومنا هذا شعبا نال حريته دون أن يقدم تضحيات مهما كانت فادحة ولا مجال للتضحيات الا من شعب يدرك معنلى الحق والمبدأوالحرية ولا يخشى نباح الكلاب وأنما شعب لا يرى الا هدفه , اننا شعوب تعيش بلا حلم بلا مبدأ بلا روح هانت علينا أنفسنا فهنا على حكامنا , هل يوجد شعب يباع ويشترى على مرأى ومسمع منه على وجه هذه الأرض الا نحن , اذا كنا نريد أن نتحرر من هذه الطغمة فلابد أن تكون لدينا المعرفة الكافية بالحقيقة وأن نكون متقبلين للنتائج"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

[[comments]]
order = 14
subject = "خلاص هانت"
author = "مصرى جداًُ"
posted = "2006-05-01"
text = "خلاص ياجماعة الحمدلله فُُرجت لأن الملك خلاص دق آخر مسمار فى نعشة بغباوته وبسير الأحداث الأخيرة كلها(الأسعار الغير محتملة,الفساد للركب,إبنه ومراته إللى محدش طايقهم,تلفيق تهم أيمن نور,البنك الدولى ومنظمة الصحة العالمية هزأوه وقالواإعلن بشفافية عن أنفلونزا الطيور وإحنا نعوضك وبعدين إديلوه على قفاة بعد ما خرب بيت الناس , العبارة وفسادها وفساد صاحبه الأمين شريك ممدوح, إصراره على العادلى بعد كذا غلطةكلفت مصر مليارات فى حين إن أول غلطة لحسن الألفى فى الأقصر عزله مع إن الحقيقة إن العادلى كان مسئول أمن الدولة وهو المسئول الأول عن أحداث الأقصر وبرغم من ذلك كافأهه وعينه وزير الداخلية, ومروراًبالإنتخابات الرئاسية المهزلة وتزوير إنتخابات مجلس الشعب ثم آخر مسمار فى نعشه الجنان إللى عمله مع القضاةوبكرة أفكركم إنه فى خلال شهر بالكتير حيغور فى داهية هو وعيلته وحاشيته القذرة.ليه فى خلال شهر لأن السادات الله يرحمه لماإتجنن وهاج على كل المعارضين فى سبتمبر مات فى أكتوبر وقلت لكل الناس إللى أعرفهم إن السادات دق آخر مسمار فى نعشة ومات بعدها بشهر أنا دلوقتى بقول لكم إن الملك دق آخر مسمار فى نعشه بحركة القضاء وقابلونى بعد شهر إن شاء الله بعد ماتزول الغمة"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

[[comments]]
order = 15
subject = "مش كفاية"
author = "مصرى"
posted = "2006-05-01"
text = "ليس كافياً أن نسرد كل أخطاءه لا زم نكون إيجابيين أكثر من كده ليه ما نحاولش نعمل إضراب جماعى يعنى كلنا نعمل زى القضاء يعنى عصيام مدنى ده هايشله تماماً أمام العالم كله ليه منعملش نداءات بعدم شرعية حكمه لأنه لم يأتى للحكم بالإنتخاب كما أعلن الدستور ليه ما نقولش أنه مش عايز يخلى له نائب علشان ما يتكررش إللى هو عمله فى أنور السادات لازم يفضح والعالم كله يعرف أنه غير شرعى وإنه ناهب مصر هو وزوجته إللى ناهبة فلوس الجمعيات النسائية الوهمية ونهبة فلوس مكتبة الطفل إللى بيجيلها إعانات كثير قوى وهى بتأخذه كلها فى حساباتها بره ليه منقولش عن فساد إبنه وإن المفروض أنه ميشتغلش فى البزنس طالما يعمل فى السياسة وثروته جابها منين وتفضح صور إدمانه هو وأخوه لا زم تكون حملتنا مش بس آراء وكلام لازم نبذل مجهود إيجابى جماعى أكثر من كده لو أحنا فعلاً عايزين نكون إيجابيين ونعمل حاجة علشان مصر."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

