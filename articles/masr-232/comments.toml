[[comments]]
order = 9
subject = "وايه يعني عاري"
author = "Dabdoob"
posted = "2006-04-29"
text = "يا جماعة ايه فايدة كل الكلام ده<br />حتي لو عاري هيحكمنا عريان مفيش مشاكل<br />مبارك هيفضل يحكم لحد ما يموت او علي اقل تقدير لحد ما ولايته الخامسة تخلص وبعدها هتطلع مظاهرات ( ماجورة طبعاومليانة بلطجية ) تنادي بجمال مبارك وتسمع شوية اراء من مثقفين الحزب الوطني تقول ان جمال هو اصلح واحد دلوقتي لانه طيب وابن حلال وزي القمر وبعدين يظهر صفوت الشريف في التليفزيون او اي حد مكانه يقول ان الحزب الوطني من حقه ان يشارك في الانتخابات بممثله جمال مبارك وليس ذنب جمال ان ابوه حسني مبارك وبعدها تحصل الانتخابات وجمال مبارك لوحده ويفوز !!!!<br />هييييييه<br />شفتوا الحدوتة حلوةازاي<br />وكل الي انتوا بتعملوه مالوش لزمة<br />يلا سلام<br />مفيش فايدة<br />Dabdoob"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

