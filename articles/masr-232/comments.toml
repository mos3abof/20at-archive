subject = "مش عاري وبس ده عاري وبجح ومش هامه"
author = "مصرية للأبد"
posted = "2006-05-04"
text = "عاري عن كل حق عن كل دين عن كل شريعة او قانون ده بلطجي وعارف وبجح ومش هامه وعاري على عينك يا تاجر ويا فلاح ويا عامل ويا غلبان مش لاقي ياكل"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

[[comments]]
order = 23
subject = "يا رب انت العالم"
author = "اسلام"
posted = "2006-05-04"
text = "والله العظيم ما كرهت حد في حياتي قد الراجل ده<br />اسف اقصد جلالة مولانا الملك هدم الله ملكة واسكنه فسيح الدرك الاسفل من النار<br />بس ان شاء الله لو ما اتعزلش ها يموت اعتقد ان عمر الانسان العادي بيبقى من 70 ل 80 سنة بالكتير<br />ولو انه لو يقدر يشتري عمر على عمره علشان يقضي على مصر خالص كان عملها"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

[[comments]]
order = 24
subject = "يخرب عقلكم"
author = "والله لم اتصور بأن يكون هناك من هو جرئ لهذه الدرجة أنا من سوريا وأشيد بكم وبحرية تعبيركم"
posted = "2006-05-04"
text = "فعلا موضوع يشفي الصدر<br />ويخلينا ننام مرتاحين وتاركين همنا على غيرنا<br />ياجماعة المواضيع هذه القصد منها تنويم الشعب في العسل وانو في ديمقراطية وخليكو نايميين لأنو في ناس بتتكلم عنكوا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

