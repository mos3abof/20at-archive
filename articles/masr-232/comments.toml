subject = "عاري عن الصحه"
author = "حمدي"
posted = "2006-04-27"
text = "لا كمان ان نسيت يا محمد الخبر الجديد بتاع اعتقال حسين عبد بالغني مدير مكتب قناة الجزيره هو الحقيقه كان اختطاف مش اعتقال لانهم خدوه بالملابس الداخليه وزقوه جوه عربيه ميكروباس من سيناء لحد مباحث امن الدوله وحتي رفضوا ان الراجل يقضي حاجته ويروح للحمامولولا الجماعه بتوع نقابة الصحفيين لحقوه فعدلوا الاحوال معاه شويه<br />الطريف بقي في الموضوع ان التهمه هو نقل اخبار عاريه من الصحه<br />هو ايه حكاية عاري ده النهارده هي كترت في الكلام كده ليه<br />ياله بقي امشي لحسن الواحد ياخد برد"
