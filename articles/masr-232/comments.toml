posted = "2006-05-06"
text = "باسم دم الف مصري اصبحوا وجبة دسمة لاسماك القرش , ربنا ينتقم منك يا مبارك الفساد مبارك الاهمال مبارك الطواريء مبارك الفقر مبارك الخصخصة مبارك البطالة مبارك الغذاء المسرطن<br />يومك اقترب ياعميل اسرائيل وامريكا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

[[comments]]
order = 30
subject = "بلاش غلط"
author = "دودو"
posted = "2006-05-06"
text = "بسم الله الرحمن الرحيم<br />والصلاة والسلام على اشرف المرسلين أما بعد<br />أود أن يلتزم شباب مصر بحسن الاخلاق والتى اوصى بها رسول الله صلى الله علية وسلم .<br />يا جماعة عمر ما فيه قضية بتتحل بالشتيمة والالفاظ الغير لائقة وخاصة مع ولى الامر . حتى لو اختلافنا مع الرئيس لكن لابد ان يكون هناك أسلوب للحوار وخاصة مع مكانة سيادة الرئيس محمد حسنى مبارك ،وممكن عن طريق موقع زى الموقع دة وعن طريق تعليقاتنا المحترمة يوصل صوتنا للريس يحاول يتفهم مشاكلنا مع مجتمعنا المصرى بدون أهانات بدون خروج عن مبادئ الأدب .......<br />يل ينفع تكلم والدك او مدرسك او معلمك بأسلوب يشبة الاساليب السابقة من الحوار البذئ .<br />كمان الفصاحة فى الحوار ممكن توصل الحق لأصحابة زى قصة القروى الفصيح إللى أكل حمار الملك زرعه وظل يشكو الملك فى كل مكان حتى سمع عنه الملك وطلب منه ان يقول شكوته واعجب به الملك لفصاحة لسانة وأغدقة بالهدايا والكنوز . طبعا الهدف من قصتى مش ان الريس يسمع كلامنا الحلو فيدينا وظيفة أو منحة بس الهدف أن الاسلوب فى الحوار ممكن يحقق ما نحلم به جميعا<br />أشكركم على اعطائى المجال ."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

[[comments]]
order = 31
subject = "الشعب إتخنق خلاص"
author = "مصرى مقروف من الفساد"
posted = "2006-05-06"
text = "أقول لدودو العجيب لا تطلبوا بالضعف حقاً ضائعاً ما للضعيف الحول من أشياع فهل لا يعرف سيادة فخامة الرئيس حسنى مبارك هو عامل إيه فى الشعب وفى الشباب حتى ننتظر أن يتعطف ويتسامح ويسمح بفرص عمل للشباب العاطل وهل لا يعرف الإموال المهربة من مصر الذى زاد بها أرصدته بره هو وإبنه وزوجته وهل لا يعرف كم الفساد الصادر منه ومن الفسدة من حوله يا أستاذ دودو بص للدستور إللى قال أن الحاكم يسهر على مصالح الشعب هو الرئيس بيسهر بس مش على مصالح الشعب لكن على مص دم الشعب وكمان الدستور بيقول إن الرئيس ييجى بالإنتخاب وده عمره ما جاء بإنتخاب الشعب لكن جه بقهر الشعب وتزوير الإنتخابات يبقى وجوده باطل وغير شرعى ويبقى الرئيس بتاعك ده يشوفله مكان تانى يقعد فيه بعيد عننا ولا أحنا هانكلمة ولا أمه تكلم أمنا وكل واحد من حته ومش عايزينه وكفاية عليه كده هو بيحكم مين بالضبط بيحكم شعب رافضه وبيقوله إن الزعيم أحمد عرابى قال لقد خلقنا الله أحرار ولن نورث بعد اليوم يعنى خليه يهدى بقى هو وإبنه المتخلف عقلياً ويعرف إنه عمره ما ها يحكمنا وكفاية علشان أنا تعبت"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

[[comments]]
order = 32
subject = "جيوش العواجيز (من سن مبارك)"
author = "مصطفي"
posted = "2006-05-06"
text = "لن تحل مشكلة البطالة في مصر الي بالتخلي عن جيوش العواجيز اسف قصدي المستشارين الذين تعدوا سن الستين والسبعين ومازالوا يعملوا بمرتبات تصل في بعض الاحيان الي 70 الف جنية شهريا وبحد ادني 3500 جنيه شهريا, فمرتب واحد فقط من هؤلاء المستشارين قادرعلي توظيف العشرات من الشباب في بداية السلم الوظيفي ب250شهري فلماذا تحتفظ حكومة مفيش بكل هؤلاء المستشارين ولا تتاح الفرصة للشباب وهم قاطرة التنمية لهذه البلد بدلا من ان يصبحوا ارهابيين"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

