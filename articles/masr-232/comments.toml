[[comments]]
order = 19
subject = "خادع ومخدوع بنفس الوقت"
author = "نور"
posted = "2006-05-02"
text = "خدع نفسه بنفسه من البدايه وصدق شخص غريب ووثق فيه على حساب نفسه وشعبه<br />والي يكذب عيونه الي فراسه دا مش عارف اصلا هو مين ولازم يعمل ايه<br />لا الوم الشعب حين صفق لانه يرا الملك ملك ب اوبلا ملابس<br />والطفل يرا بعين مجرده من المجامله المجاراه<br />لايحكمه ملك ولاغيره انما الحقيقه والفطره ثم لم تمنعه برائه الطفوله من التصريح بما انكره بصوت عالي وساخر دون اعتبار لما حوله فقد راى الحقيقه بعين الحقيقه وليس من داعي لانكارها<br />واكاد اقسم لوان احد ابويه يدري ماكان سيقول الطفل لقرصه قرصه تطلع روحه"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

[[comments]]
order = 20
subject = "إنه عارى من الصدق"
author = "فهد"
posted = "2006-05-03"
text = "لم يرتدى أى ملابس تسترة فى يوم من الإيام لأن الذى كان يرتدية هو رداء الخزى والعار والكذب الذى إرتداه يوم قتل السادات ولم يخلعه إلى الآن يوم أن قال أنه سيستمر لفترتين وكانت كل الشواهد تؤكد كذبه لأنه لو كان صادق لوضع بند فى الدستور ألا يستمر الحاكم إلا لمدة دورتين رئاسيتين ولكنه كان يستخف بالشعب وإرتداه يوم قتل 16 ظابط وإرتداه يوم أن عين كل الوزراء من حثالة المجتمع حتى يتمكن من سرقة البلد ونهب الثروات وإرتداه يوم أن سمح لزوجته وإبنه بمساعدته فى نهب البلد أكثر وأكثر وإرتداه يوم أن باع مصر لأمريكا وإسرائيل ليضمن بقاءه فى الحكم وإرتداه يوم أن حاول توريث مصر لإبنه المفتقد للأهلية سيء السمعة المدمن الناهب لمصر كلها ولكنه سيبدله بكفن أشد قسوة عليه من هذا الرداء القذر الذى يرتديه."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

[[comments]]
order = 21
subject = "أخطأ من قال أنه عارى"
author = "لؤى"
posted = "2006-05-04"
text = "أنه ليس عارى ولكن ثوبة الفاسد بدأ يتمزق وبدأ يتعرى أمام الشعب ويظهر حقيقة ما تخفيه ملابسه الرثة الحقيرة وأصبح وأضحاً جلياً أمام الشعب فساده ونهبة وحراسته للفسدة من حوله ولتزويره الإنتخابات لضمان بقائه إلى الأبد ومحاولة توريث أبنه المرفوض من الشعب كله ناسياً أن هناك رداء سيرتديه مجبراً وليس له أى جيوب ليضع ثروته معه وهو يرتديه هو الكفن الذى ينتظره وهو يعتقد أنه مازال باقياً للنهب من مصر والقمع والفقر والبطالة للشعب ولن يإخذ معه إلا دعاء المظلومين وأبناء المعتقلين ليلاقى كل ألوان العذاب وحسبى الله ونعم الوكيل."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

[[comments]]
