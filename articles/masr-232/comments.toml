subject = "هذه هي فرص العمل"
author = "alis"
posted = "2006-05-06"
text = "لا تظلموا الرئيس حسني مبارك لاننا الشعب هم المغفليين , فالرئيس مبارك لم يصدق شعبه طوال فترة حكمه , فلماذا ننتظر فرص العمل الوهمية التي وعدنا بها<br />الحق علي الشعب انه ساكت , واذا طال سكوته سيمسك ابنه جيمي مبارك الحكم لفترة 30 سنه اخري , وليذهب شباب العاطلين الي الجحيم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

[[comments]]
