[[comments]]
order = 4
subject = "مش عاري .. ده سلبوته"
author = "واحد منقوط"
posted = "2006-04-27"
text = "جلالة الملك مش عاري .. جلالته ملط بس<br />ودي دلالات التمليط اللي هو فيه:<br />1. ملك مملكة نيبال (مكان في آسيا أصغر من بولاق أبو العلا) استجاب لطلبات المعارضة قبل أن يستجيب جلالة ملكنا لطلبات كل الشعب<br />2. جلالة ملكنا عنده اصرار غريب ان كل حاجة تتعالج بالقوة: أهالي ضحايا عبارة الموت اتطحنوا ضرب من الأمن المركزي .. بدو سينا شبعوا تعذيب واتاخدوا صالح على طالح .. مظاهرات الاخوان وكفاية والصحفيين والمحامين واساتذة الجامعة والقضاة كلها تعالج بالسياط<br />3. جلالة الملك مصمم انه يخلي كل واحد فكر في يوم انه يكون ند ليه مصمم انه يخليه يندم على اليوم اللي اتولد فيه .. فين أيمن نور ونعمان جمعة .. طبعا كلنا عارفين الصباحي راح فين الله يرحمه :)<br />4. جلالته عامل عبيط وبيقول ان اهم حاجة عنده المواطن محدود الدخل .. لكن ماذا عن مهدود الدخل؟<br />................... زهقت .. الله يخرب بيتك يا فرعون انت وهامان وابنك مطرح ما روحتو"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

[[comments]]
order = 5
subject = "البقع"
author = "رابسو من ارض البستان بتاع زمان"
posted = "2006-04-28"
text = "انا شايف انه لابس جلابية بس الجلابية مليانة مليانة بقع بقع بقع, بقع بقع بقع... واخرام كمان<br />وبكرة آوان الغسيل وان ماكانش الجلابية تقع من كتر البقع فلازم تنخلع عشان تتنقع<br />لأن النهاردة ماعادش فيه لبس من غير بقع.<br />بس ولا أى نقع ولا أى مسحوق ممكن ينظف ذى كده بقع.<br />فى قصة آدم وحوا لماعصيا ربهما, ربنا<br />قال:\"فبدت لهما سوءاتهما\"....<br />واضح ان من عقاب المعاصى ان الجلباب ممكن يقع.-هيتعرى هيتعرى-<br />وآه من المعاصى, فى أكثر من ظلم العباد, كل العباد. مش كده وبس ده كمان قضاة العباد.<br />مش كده وبس وبس, ده حتى هامان -مش عارفينه؟!- هامان بن كمان بن شاذان, اترمى فى ارض النسيان عشان نغه ابن نوغان يقعد مكان السلطان<br />وعجبى ......"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071819/http://masr.20at.com:80/article.php?sid=232"

