[[comments]]
order = 4
subject = "أنت يا أخ يا اللي فوق!!"
author = "واحد معدي"
posted = "2005-12-03"
text = "باح البيتنجان!!<br />مش فاهم يعني انتوا تركيبتكم ايه بالظبط ،<br />ما تبص فوق شوية في التعليقات ( و للا ما عندكش سكرول؟!! ) ،<br />هتلاقي في ناس قايلة إن الموضوعين مختلفين<br />و اقرا اللينك اللي سعادتك جايبه كويس ، و الموضوع اللي هنا ، و انت تعرف الفرق ،<br />و بعدين اشمعنى دلوقتي تتكلموا و لما العربية نت تنقل موضوع من عشرينات (لعبة الإخوان و الأقباط) ما حدش ينطق؟!!!<br />على فكرة انا بأحترم موقع العربية و بأحب عشرينات ،"
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234633/http://egyvote.20at.com:80/article.php?sid=102"

[[comments]]
order = 5
subject = "تنويه هام"
author = "مدير التحرير"
posted = "2005-12-03"
text = "لسلام عليكم..<br />بعد التحية الواجبة لكل زوار الصفحة الكرام، وعلى رأسهم الأخ الذي يتهم إيمان بنقلها للموضوع من موقع العربية، يلزم التنوية عن نقطة هامة.<br />أولا..<br />موعد نشر موضوع إيمان سبق موعد نشر موضوع العربية. ولولا صعوبة تأكيد الأمر فإن القارئ للموضوع المنشور في العربية يجد فيه إختلافا واضحا حتى في اسماء البلطجية التي أجرت معهم ايمان حواراتها.<br />ثانيا..<br />لحسن الحظ فإن موضوعا بالعناوين نفسها نشر اليوم في صحيفة المصري اليوم، وهو إن دل على شيء فإنما يدل على أن قضية البلطجة أصبحت اهتماما عاما لكل وسائل الإعلام، والمتابع للقنوات الفضائية يعلم ذلك جيدا.<br />التنوية الثالث والأخير، هو عن سياسة موقع عشرينات التحريرية، وهي تلزم المحرر بالكشف عن مصادر معلوماته وإيضاحها لمسئولي التحرير قبل النشر، وعند الشك (مجرد الشك) في صدق هذه المصادر يتم تأجيل نشر الموضوع لحين يثبت العكس.<br />ولعل القارئ الكريم لا يذكر لعشرينات قيامها لأي نقل من أي وسائل إعلام أخرى إلا بعد توضيح ذلك في ذيل المقال، بل إننا نتمنى أن يتعامل معنا الآخرون بالأمانة ذاته، فعندنا ملفات ضخمة تحوي مقالات واخبار وتحقيقات منقولة (حرفا) من عشرينات دون أي إشارة لذلك..<br />وأخيرا..<br />فأني أأسف للإطالة عليكم وحرمانكم من الإستمتاع بتحقيق إيمان عبد المنعم وهي كاتبة متميزة استطاعت ان تثبت ذاتها في عشرينات وفي صحف أخرى..<br />ولكم جزيل الشكر والاحترام والتقدير<br />للإتصال:<br />contact20at@yahoo.com"
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234633/http://egyvote.20at.com:80/article.php?sid=102"

[[comments]]
order = 6
subject = "ارحمينا يرحمكى الله"
author = "egylight"
posted = "2005-12-03"
text = "**** ويعد أيمن نور رئيس حزب الغد هو أول من أعاد الاستعانة بالبلطجية إلي سوق الانتخابات، عقب استخدمه لهم قبل عشر سنوات وبالتحديد في انتخابات 95 عندما قاموا بإجراء مسرحية هزلية توحي بتربص صبحي وهدان مرشح الوطني في ذلك الوقت بدائرة باب الشعرية، وهو ما جعل البعض يقول أن هذه المسرحية هي السبب الرئيسي في فوز نور، خاصة وأن الأخير اعتاد خلال مشواره السياسي على الاستعانة بالبلطجية للإيحاء لجماهيره بأن هناك من يرغب في قتله!<br />وكان جمال عبد الناصر(البلطجي وليس الرئيس) أشهر بلطجية باب الشعرية فد فضح أمر نور خلال الانتخابات الحالية بعد حدوث اختلاف بينهم، وهو ما استغله وهدان في عمل دعاية عكسية لنور انتهت بخسارة نور وفوز وهدان بعد طول انتظار! *********<br />ده جزء من كلام الأخت ايمان واللى هاعلق عليه بغض النظر موضوع منقول ولا مش منقوش--- وابدأبقول الله عزوجل \" بسم الله الرحمن الرحيم (يا ايها الذين امنوا إن جائكم فاسق بنبإ فتبينوا....)\"الى اخر الأية اللى كلنا حافطينها .<br />فازاى يا اخت ايمان تستدلى على اتهامك للدكتور ايمن نور بشهادة شخص باعترافك واعترافة بالبلطجة شخص غير مؤهل شرعيا للشهادة ,مش كفاية على الدكتور ايمن نور ظلم الدولة والطلمة والمنافقين والمرتزقة له حتى تصدعى انت الأخرى رؤسنا بمثل هذا الكلام (اسف ان اقول)فارغ وتافه وهايف ولا يسعى إلا لجذب القارىء للموضوع تماما مثل الصحف الصفراء التى لا تبغى الا الأثارة المبتذلة,يا اختى سامحك الله كفانا ما حاق بشرفائنا من اعدائنا فلا تزيدى الامنا بمثل هذة الهرطقات المغرضة ولا تتبعى نشر الشائعات بين العبادواسغفرى الله لذنبك ومن ذنب هذا المناضل المسكين الذى تكالبت عليه الذئاب ,ولى فى النهاية سؤال ((( يا ترى عنوانك فينن بالض<br />اقرأ بقية التعليق .."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234633/http://egyvote.20at.com:80/article.php?sid=102"

