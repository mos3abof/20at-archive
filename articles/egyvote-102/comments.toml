[[comments]]
order = 1
subject = "البلطجية"
author = "واحد كارهه الحكومة"
posted = "2005-12-02"
text = "الله الموضوع برغم ما يدقمه من حقيقة قاتمه الا انه دمه زى العسل و فعلا شرة البلية ما يضحك ..... أنا بقترح ان طالما البلطجية مطلوبين فى سوق العمل كده فأنا بنصح الحكومة انشاء كليات للبلطجة فى كل الجامعات و ذلك لتخريج دفعات بلطجية على احدث الطرق العلمية و بأقترح انشاء اقسام مختلفة فى الكلية منها قسم المطاوى السوستة و قسم الشوم و قسم العاشورة و السيف و طبعا دراسات الماجستير فيها هتكون على عينة \"كيفية أستخدام النابوت فى الضرب الذى أفضى الى موت\" و \"مساعدة الحكومات فى تزوير الانتخابات\""
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234633/http://egyvote.20at.com:80/article.php?sid=102"

