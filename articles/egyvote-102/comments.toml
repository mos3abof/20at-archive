[[comments]]
order = 8
subject = "كلاب السيد الرئيس"
author = "محمد عبد المجيد"
posted = "2005-12-12"
text = "لاب السيد الرئيس<br />بقلم<br />محمد عبد المجيد<br />أوسلو في الأول من أغسطس 2005<br />الصورة تكذب.<br />إنها أولى الحقائق التي يتعلمها من يعملون في الإعلام، أما تلك الصورة فهي تجسيدٌ لحقيقة تكاد ترقى لمرتبة الحقيقة المطلقة الواحدة.<br />مواطنٌ مصريٌ مع متظاهرين يظنون أنهم في بلدهم يملكون حقا من الحقوق التي منحتها المواطَنة، فخرج غير مسلح إلا من حبه لهذا البلد السجين الصامت، رافضاً استمرار أعتى طغاة العصر الحديث.<br />خمسة أو سبعة من كلاب السلطة في ملابس مدنية يحيطون به، وتعبيرات وجه كل منهم تكاد تتجمع فيها كل الشرور والكراهية والعنف والسادية، وفي يد كل منهم قطعة من الحديد يهوي بها على رأس وظهر وكتف المواطن المصري المسكين.<br />مشهد مرعب تنزوري بجانبه كل مشاهد التعذيب المنظَم والتعليق من الأرجل في سقف مكتب مأمور القسم، لأنه انفجار وقح لعفن الفاشية المباركية التي يُصرّ رأسُ سلطتها على اغتيال مصرنا ولو أدى الأمر لدفن المصريين كلهم تحت ترابها.<br />تعليمات صارمة من قلب القصر بأن يتم التعامل مع المناهضين لاستمرار نهب الوطن معاملة الحشرات والديدان والجيفة، وأي مستبد ديكتاتور لا يجهد نفسه في العثور على كلاب ضالة من رجال الأمن أو المسجلين خطيرين أو البلطجية يتولون حمايته ويقوم هو بنفسه باطعامهم وفسح المجال لهم وتسهيل أمورهم وبسط هيمنتهم وسيطرتهم.<br />عدة مئات يتحدثون باسم اثنين وسبعين مليونا، ويدافعون عن كرامة وطن، ويرفضون فكرة تفريغ مصر من خيراتها في ست سنوات قادمات كأنهن فواجع ومصائب وكوارث يُعدّها الرئيسُ لتأكل الأخضر واليابس ويترك هو وأسرته مصر وقد تم تحقيق ما بدأ فيه منذ ربع قرن وهو الانتقام من هذا الشعب، وجَعْل أرض الكنانة في ذيل ركب الأمم، وانهاء الدور المصري القيادي ثقافيا واعلاميا وعسكريا وحضاريا واقتصاديا.<br />اقرأ بقية التعليق .."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234633/http://egyvote.20at.com:80/article.php?sid=102"
