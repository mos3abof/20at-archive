text = "طيب انتى اللى كان بيعمل معاكى كده البياعين<br />انا دخلت مره محل انا وبنت عمى واتفرجنا ومفيش حاجه عجبتنا فخرجنا عادى يعنى بتحصل راح صاحب المحل بقى معجبهوش قالنا فليتو المحل ومشترتوش حاجه<br />طب والنبى يترد عليه يتقالو ايه<br />سبناه ومشينه بس محروق دمنا من قلت الزوق هو مدام دخلت محل يبقى لازم اشترى عافيه يعنى"
