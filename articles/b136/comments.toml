[[comments]]
order = 1
subject = "ما اجمل المطر"
author = "نيفين"
posted = "2005-12-25"
text = "و ايه ف الدنيا احلى من فصل الشتاء و ايه ف الشتاء احلى من ان الدنيا تمطر<br />المطر ليه احاسيس بيخلقها ف النفس الرومانسيه بس<br />اخاف ان تمطر الدنيا و لست معى فمنز رحت و عندى عقده المطر الله يا نزار<br />بحب بالمناسبه احيى صاحب تعليق المطر يعبر عن انسانيتنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143859/http://www.20at.com/article2.php?sid=136"

[[comments]]
order = 2
subject = "انتظره طويلا"
author = "ميرفت"
posted = "2006-01-13"
text = "عندماتمطر الدنيا اخرج اليها بارق ثيابي واسمح لقطرات المطر ان تخلل جسدي كاشعة الشمس... وعندها ابدا بالبكاء حتى تمتزج دموعي مع قطرات المطر ونغرق العالم..<br />وعندماتمطر الدنيا تذكرني كم انا فاشلة لان جميع انجازاتي الفاشلة معك ... كانت تحت المطر..<br />ولكني ما زلت احبك واحب نزول المطر...<br />mirvat -دمعة من دموع فلسطين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143859/http://www.20at.com/article2.php?sid=136"

[[comments]]
order = 3
subject = "بلا هُوية، كما المطر..!"
author = "خضر ابراهيم... سوريا"
posted = "2006-02-18"
text = "أحسد المطر لأمر.. أنه بلا هُوية.. يختار الوطن الذي يريد.. وقتما يشاء.. لا رابط ولا مسيّر له.. سوى شرط وحيد أن يكون شتاء الفصول قد حل على أرجاء المعمورة. هنالك رابط بين روح الإنسان والمطر.. حيث أن الروح تنهمر أحاسيسها وتشتد وتصل للعمق في حالات معينة ربما لا تدوم سوى للحظات.. من الحنين، الألم، الغضب، الفرح.... وحتى الحزن. وكذلك المطر له نبض كما الروح.. ينهمر بقوة أحياناً، وبعد ثوانٍ يهطل برقة تتساقط رذاذاً يداعب قسماتك وقت المُضيِّ تحته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143859/http://www.20at.com/article2.php?sid=136"

[[comments]]
order = 4
subject = "مَطَرُ.. مَطَرُ.. وزُجاج شفّاف وروح غائبة!"
author = "خضر ابراهيم... سوريا"
posted = "2006-02-18"
text = "زجاج شفّاف كان يفصل بين عالميهما، ولكن وقتما تسربت قطرة المطر من بين مسامات البلور حدث شيء غريب، جديد، سريع جداً فتك بها!<br />تخاف هي.. أن تُمطر ولا يكون بقربها، نعم تخاف.. لأنها تعلم أنه لن يكون.<br />Iloveyou_syria@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143859/http://www.20at.com/article2.php?sid=136"
