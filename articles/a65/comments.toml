[[comments]]
order = 0
subject = "عابر"
text = "السلام عليكم.<br />شكرا لهذا المقال اللطيف و المهم.<br />و أعتقد أن علينا أكثر من مجرد تعليم الجنس.<br />إن حقبة طويلة من الجهل جعلتنا نعتقد أن الجنس حرام و هذا خطأ منهجي في معرفة الاسلام. إن الاسلام ينظم الجنس و لا يمنعه بل على العكس الاسلام دين الفطرة و الجنس من الفطرة و الذين يعادون الجنس يعادون الاسلام من حيث لا يعلمون. إن تيسير فهم الجنس و تطبيقه بشكل شرعي بشكل يشبع الحاجات الجنسية و العاطفية لهو عمل لا أشك أنه من أعظم القربات الى الله في هذا العصر بسبب حاجة المسلمين الماسة اليه. إن كثيرا من المتدينين يحطمون حياتهم و حياة أزواجهم نتيجة جهلهم بهذه المتعة الحلال و الضرورية للاستقرار النفسي.<br />و لو أننا درسنا الجنس بشكل علمي و بقلب مومن لزاد يقيننا بالله.<br />و ما خلق الذكر و الانثى. ان سعيكم لشتى.<br />و السلام"
archived = "2004-04-18"
capture_url = "https://web.archive.org/web/20040418002052/http://www.20at.com:80/article.php?sid=65"

[[comments]]
order = 1
subject = "شكرا"
text = "المقال فعلا لقي الضوء على مساحا شاسعة من التعامي والجهل المتعمد<br />نسأل الله تعالى أن يكرمكم ويتقبل منكم<br />ملحوظة اجمل ما في الموقع انه خفيف جدا وفي نفس الوقت يعطي معلومات ويتكلم في امور مهمة"
archived = "2004-04-18"
capture_url = "https://web.archive.org/web/20040418002052/http://www.20at.com:80/article.php?sid=65"

[[comments]]
order = 2
subject = "فعلا رائع بس...."
text = "فعلا مقال ممتاز ورائع وممكن نتعلم منه حاجات كتير<br />بس لي ملحوظة أرجو أن تأخذوها في الإعتبار<br />أعتقد أنه لا داعي للصورة الثانية والتي بها إمرأة تلبس ملابس قصيرة جدا وشعرها مكشوف<br />وأري أن هناك تناقض مع فكرة المقال الجميل ومع هذه الصورة<br />شكرا لسعة صدوركم."
archived = "2004-04-18"
capture_url = "https://web.archive.org/web/20040418002052/http://www.20at.com:80/article.php?sid=65"

[[comments]]
