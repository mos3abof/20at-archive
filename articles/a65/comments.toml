[[comments]]
order = 4
subject = "رائع"
text = "اجمل ما فى المراة الحياء حتى ان القران وصف حور الجنة بانهم قاصرات الطرف فمااحسن الثقافة فى ظل الادب والحشمة والخلق الحسن وفقنا الله لما يحبه ويرضاه"
archived = "2004-06-22"
capture_url = "https://web.archive.org/web/20040622155206/http://www.20at.com:80/article.php?sid=65"

[[comments]]
order = 5
subject = "والله زمان"
text = "مبروك يادسوقى الموضوع حلو اتعودت عليك جرئ وراسك نشفه اللى فى دماغك بتعمله بس فى حاجه يمكن فعلا يكون الجنس عنصر مهم فى حياتنا بس اعتقد انه من الصعب ان يتم تدريسه فى المدارس لانها هتبقى عمليه صعبه خاصة في ظل حالة الانحلال التى نعيش فيها"
archived = "2004-08-15"
capture_url = "https://web.archive.org/web/20040815195333/http://www.20at.com:80/article.php?sid=65"
