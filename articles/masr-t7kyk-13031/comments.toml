text = "ازيك يا رغداء<br />اسمك جميل وعربي اصيل ايضا<br />لكن انا عايز افهم حاجة<br />هو امتى هلاقي صحفي شاب يكتب مقاله باللغة العربية<br />خلاص يعني بعد كده كله ماشي عامية<br />ومتقوليلش كاتب ليه تعليقك بالعامية لاني مش صحفي"
