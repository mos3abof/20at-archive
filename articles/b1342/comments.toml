[[comments]]
order = 4
subject = "فن السعادة"
author = "مهتمه"
posted = "2006-10-19"
text = "بعض الناس يتقنون بالفعل \" فن السعادة \" ، وهو فن راقي لمن لا يعرفه يحتاج فهم وإيمان وعطاء ، انهم يعرفون كيف يستمتعون بما في ايديهم - حتى ولو كان قليل - ولا ينظرون لما ينقصهم ويشعرون بالرضا لانهم يعيشون بهذه الطريقة ، وهناك آخرون يملكون كل شئ لا ينقصهم شئ ومع ذلك يشعرون بالبؤس والتعاسة ويتعسون من حولهم ، تشعر انهم كتلة نكد تمشي على الارض ، انهم غير راضين عن انفسهم ولا عما في ايديهم ويحقدون على زهرة مثل رباب .<br />يحقدون عليها لانها استطاعت ان تكون افضل منهم ، استطاعت ان تستمتع بما بين يديها وان تنشر هذه السعادة والرضا والطاقة النفسية العالية على من حولها .<br />الحمد لله ان في هذه الحياة رباب .<br />اللهم اكثر من رباب وامثالها وارزقنا الرضا واجعلنا ضوء ينير للآخرين الطريق ، ولا تجعلنا شمعة نحترق من اجلهم ، ولا ممن يلعن الظلام ، ويلعنه احيانا وهو جالس في النور !!!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102102931/http://www.20at.com/article2.php?sid=1342"

