posted = "2009-09-16"
text = "يا كلب قبل ماتسمي روحك ليبي راجل تذكر ان ذالك هو عرضك كذلك<br />قبل ما تقول حر شوف نفسك فين تعيش<br />ثالثا انا لي اعمال في ليبيا و إنتي عارف ليش تجو لتونس باش تنيكو مرة في السنة؟ علشان نساكم في ليبيا ما تقدروش تلمسوهم يفضلون الأجنبي لإنكم الليبية كسلانين حتي في مباشرة نساءكم<br />أخيرا يا كلب الي يصير في تونس موجود في كل الدنيا الفرق الوحيد أن فيه من تستر و فيه من كشف… ما تعلمتو أي شيء من الدنيا و راح تظلو حمير إلا من رحم ربك..زز"
archived = "2009-09-22"
