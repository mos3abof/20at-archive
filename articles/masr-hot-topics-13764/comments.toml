subject = ""
author = "عاشق مصر"
posted = "2009-10-20"
text = "كفانا جريا وراء مواضيع لا تسمن ولا تغني من جوع وفي ذلك لايمكن أن أقول أن الحديث عن استقالة المرشد أو عدمها ليس بالمهم ولكن يمكن أن يكون خبرا ذو أهمية ولكن بدون إثار الفتن والتهويل الإعلامي لأن هذا وبشكل كبير يساهم في تغييب الأمة عن أمور أخرى مصيرية ومهمة ولا تأخذ نفس ذلك التهويل مثل قضية الأقصى وتهويده وغزة وجراحها التي لم يضمده أحد حتى الآن ومصر الغارقة في فساد لا أول له ولا آخر في اقتصاد كان أو تعليم وصحة ، محمد عاكف أو غيره المهم أن تستمر المسيرة في ااعمل الذي يخدم هذه ألمة وليتعاون الجميع في كل التيارات والأفكار لإنقاذنا"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031135236/http://www.20at.com:80/masr/t7kyk/13764-2009-10-19-22-10-42.html"

[[comments]]
order = 2
subject = ""
author = "الصدمات المتتابعة"
posted = "2009-10-20"
text = "تعريض الشعب المصرى لحالة صدمة نفسية وهيستيريا اسلوب يتبعة امن النظام<br />ماذا يحدث اخيرا؟<br />زرع كمية هائلة من الرعب والفزع بين افراد الشعب من انفلونزا الخنازير بدات بتقتيل الخنازير وانتهت بالمدارس ان الطلبة تدرس يوم وتنام فى البيت اليوم التالى<br />—— زوبعة الحجاب وشيخ الازهر والمدن الجامعية وهلال وكل الهيصة انتهت الى لا شىء<br />—— شوبير ومرتضى وايمن نور والشذوذ وكلام فارغ يتعرض للاعراض والشرف واشغال الناس بطريقة مريبة<br />—- ثم استقالة المرشد وتهليل الاعلام والتهويل والمبالغة<br />هو فية اية فى البلد<br />البلد دى مين اللى ماسكها<br />الشاويش عوكل فى الامن<br />البلد بتموت ؟<br />نفسى راجل فى وشة شنب يطلع يقول اية اللى بيحصل فى البلد دى<br />وان كان مفيش راجل فى وشة شنب فى البلد دى يبقى يطلع عيل من غلمان السياسة يقول لنا اية اللى بيحصل"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031135236/http://www.20at.com:80/masr/t7kyk/13764-2009-10-19-22-10-42.html"

[[comments]]
order = 3
subject = ""
author = "متابع للأحداث"
posted = "2009-10-20"
text = "نظامنا الحاكم ومن يسير فى فلكه من الكتاب ووسائل الإعلام يستغربون أن يقوم مسئول بتقديم استقالته إن صح الخبر مع أن هذا الأمر دليل صحة وقوة فى أى مؤسسة أو هيئة حكومية كانت أو أهلية وليس ذلك إلا لأنهم أدمنوا الجلوس على الكراس حتى يتعفنوا وهم جالسون عليها أو أن تزول هى عنهم لا أن يزولوا هم عنها ، فلقد هال نظامنا الحاكم وحاشيته أن يعلن مرشد الإخوان أنه لن يترشح لفترة جديدة وسيترك المجال لقيادة جديدة تقود الجماعة فى الفترة القادمة بل يتم تحديد مدة المرشد بفترتين على الأكثر، وهو أمر كما نعلم جميعا مستغرب علينا حكومة وشعبا، فأراد النظام أن يستبق الأحداث ليفرغ هذا الحدث الضخم من مضمونه قبل حدوثه ليدعى أن مرشد الإخوان لم يترك منصبه ذهدا فيه ولكن للضغوط الواقعة عليه من أعضاء مكتب الإرشاد والخلافات فيما بينهم ، كما أنه يستدرج جموع الإخوان والشعب ويوهمهم أن هناك تفكك وخلافات داخل الجماعة وخاصة داخل مكتب الإرشاد،وأن هذه الجماعة لا تصلح لقيادة المجتمع بما تعانيه من مشكلات وذلك فى خطوة إستباقية لحل مجلس الشعب وما يعقبه من إنتخابات برلمانية ورئاسية، وإنه لدهاء ومكر تتعلم منه الشياطين والأبالسة"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031135236/http://www.20at.com:80/masr/t7kyk/13764-2009-10-19-22-10-42.html"

[[comments]]
order = 4
subject = ""
author = "الاستقالة مطلوبة"
posted = "2009-10-20"
text = "احيانا تكون الاستقالة مطلوبة وليست عيب - فيها اية لما مسئول يقدم استقالة ويقول يا جماعة خلاص شوفوا احد غيرى انا لم اعد قادر على العطاء<br />هى تكية ابوهم<br />ورثة ورثوها عن اللى خلفوهم<br />لما يغوروا فى داهية الكرة الارضية هتكف عن الدوران<br />فية مكان المرشد الف واحد يصلح يكون مرشد والدماء تتغير والحركة تمضى<br />سيادة المرشد لو كنت استقلت بناءا على الرغبة الشخصية فتحية لك والف تحية<br />فانت تكون صادق مع نفسك<br />متعك اللة بالصحة بعيد عن الجماعة<br />وهذة علامة صحة وحياة"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031135236/http://www.20at.com:80/masr/t7kyk/13764-2009-10-19-22-10-42.html"

[[comments]]
order = 5
subject = ""
author = "ان للجماعة ان تستقيل"
posted = "2009-10-24"
text = "يا فضيلة المرشد الجماعة كلها لازم تحل نفسها ويتحول اعضائها الى دعاه من اهل السنه والجماعة<br />ذلك افضل لمصر وللمسلمين<br />كفاية بقا يا فضيلة المرشد<br />كفاية سجون ومعتقلان<br />80 سنه لا انتو سايبين الحكم في حاله ولا عارفين تخدوا الحكم<br />ارحكونا"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031135236/http://www.20at.com:80/masr/t7kyk/13764-2009-10-19-22-10-42.html"

[[comments]]
order = 6
subject = ""
author = "أبو مالك المصرى"
posted = "2009-11-09"
text = "بسم الله الرجمن الرحيم والحمد لله رب العالمين والصلاة والسلام على أشرف المرسلين لماذا نهتم باستقالة المرشد العام لجماعة الأخوان المسلمين ولماذا نسأل هل الجماعة أصلا لها تأثير فى حياة المصرين وفى حياة المواطن المصرى البسيط لا أظن ذلك أبدا ولن يكون لأن من قضى ثمانين عام فى محاولة يائسة للحصول على الحكم وتغير النظام الملكى وجاء النظام الجمهورى وجأت على مصر تغيرات عديدة ولم يستطيع الأخون الحصول على الحكم وفشلة حتى الجماعة فى الحصول على أى منصب سياسى فى الدولة اكثر من بعض مقاعد مجلس الشعب التى لا تعطى الجماعة أى حق فى التغير لأن الأخوان المسلمين لا يهمهم إلا الحصول على الكراسى باسم الدين وليس لهم أى اهتمام بالمواطن البسيط وعلى هذا فإن أستقالة الجماعة كلها من مصر لن تضر الناس شئ والدليل على هذا أنظر إلى أعضاء الجماعة البارزين الدكتور فلان والمهندس فلان وفلان وفلان أما البسطاء ليس لهم وجود بينهم أصلا لأنهم وكباقى من يريد الحكم فقط لا يهتم بالمواطن المصرى البسيط سوى وقت الأنتخابات فقط وماذ صنع الأخوان لمصر إلا اللافتات والخطب الرنانة التى تقدم شئ ولا تأخر شئ وإنا للة وإنا إلية رجعون"
archived = "2009-11-13"
capture_url = "https://web.archive.org/web/20091113083139/http://www.20at.com:80/masr/hot-topics/13764-2009-10-19-22-10-42.html"

