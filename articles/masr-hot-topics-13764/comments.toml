author = "كريم مُحمد"
posted = "2009-10-19"
text = "تأويل مرفوض لكلام المرشد ، هو مش بيعترض على إهتمام الناس بالإستقالة من عدمه ، هو بيعترض على الخبر (الكاذب) والإعلام اللي فجأة بقدرة قادر بقى مهتم بالإخوان أوي ، وبيعترض على التدخل في شئون الجماعة الداخلية وتأجيج وإفتعال خلافات وهمية بين قيادات الجماعة …<br />فيه حاجة إسمها أخلاقيّات ، دي بديهيات إنسانية ، مالهاش علاقة بإخوان ويسار وليبرال !"
archived = "2009-10-31"
capture_url = "https://web.archive.org/web/20091031135236/http://www.20at.com:80/masr/t7kyk/13764-2009-10-19-22-10-42.html"

[[comments]]
