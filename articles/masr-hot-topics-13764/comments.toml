posted = "2009-11-17"
text = "الاتبكون علي احوال المسلمين<br />الاتبكون علي احوال الامه يامن تدعون بي الاخوان المسلمين<br />لماذا كل هذه<br />اين الانضمام اين الثبات اين القرارات الحاسمه اين انتم من القرارات الحكوميه انا اسفه علي ماسقوله لكم<br />احنا جمـــــــــــــ ــــــــــيلا اوي الكلام طيب فين الفعل<br />احنا الشعب وكل من يويد الجماعه الاخوان المسمين غير راضين علي هذه<br />لابد نم اتخاذ قرارت تفيد الامه وتكون حازمه احنا بش في حرب احنا في حياه ديمقراطيه<br />وسهل عليك اتخاذ موقف<br />اللهم ارحمنا فانت بنا راحم وتب علينا فانت علينا قادر والطف بنا ربنا في ما اتختلف بي المقادر امين امين امين"
