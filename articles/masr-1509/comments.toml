[[comments]]
order = 1
subject = "فين الشغل اللايف ده من بدرى !"
author = "شريف الدواخلى"
posted = "2007-01-29"
text = "انتا مش بس روحت المعرض ووصفت حالته لا .. انتا شرحت المعرض بشكل حلو لحد كبير \" بالعربى \" شردت المعرض .. وذلك باراء من قابلتهم الذى اصبغته فى قالب كتابه جميل يميل للسخرية .. بس عذرا التقرير الاخبارى مش شايفه صغنن حبتين !!<br />بس شغلك حلو يا عم شد حيلك"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131122008/http://masr.20at.com:80/article.php?sid=1509"

[[comments]]
order = 2
subject = "هي ده المشكله"
author = "الاستاذ"
posted = "2007-01-29"
text = "يا عم حسام هي ده المشكلة معرض الكتاب<br />والموقوع مرفوع من الخدمة يا عم البلد كلها مرفوعة من الخدمة ولا حد سائل فيها<br />ياعم حسام انت لسة عايش في وهم الاصلاح والي انت فاهم انة يتحل بالكتابة<br />ياريس المعرض خرة والناس قرف وانا اتخنقت منكم كلكم<br />حرام عليكم<br />خنقتونا"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131122008/http://masr.20at.com:80/article.php?sid=1509"

[[comments]]
order = 3
subject = "شريف الدواخلي 2"
author = "علشان تعرفوا اد ايه الواد دا جاهل"
posted = "2007-01-29"
text = "حتى لو الواحد اتكلم بالعامية عمره ما يكتب انت واخرها الف شوفو كانت انتا اقرأوا في تعليقه فوق<br />وبعدين العنوان بيقول فين الشغل اللايف دا من بدري<br />ال يعني بأه الواد فالح قوي وعايز شغل لايف دي خبتك هي اللي لايف وللا مؤاخذه"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131122008/http://masr.20at.com:80/article.php?sid=1509"

[[comments]]
order = 4
subject = "الهندي"
author = "اه ياجدعان"
posted = "2007-01-29"
text = "يا يجدعان<br />هو انتم عاوز تتخنقوا في الموضوع بتاعي<br />خلاص مش لاقين موضوع تتخنقوا الا في موضوعي<br />لا اله الا الله<br />براحة كدة وربنا يكرمكم براحة<br />ومحدش يزعل شريف الدواخلي<br />الراجل قايل لي كلمتين حلوين<br />شكرا يا عم شريف<br />h_elhandy@hotmail.com"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131122008/http://masr.20at.com:80/article.php?sid=1509"

[[comments]]
