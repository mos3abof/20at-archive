subject = "اه يا بلد"
author = "يلا خير"
posted = "2007-01-29"
text = "اه يا بلد كل الي فيكي مرفوعين<br />علي سن خزوق مرفوعين<br />علي رجل كنبة مرفوعين<br />مرفوعين ومترفين<br />العنوان حلو قوي يا هندي"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131122008/http://masr.20at.com:80/article.php?sid=1509"

