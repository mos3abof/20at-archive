text = "يذكر أن الحدث الأبرز في معرض الكتـاب هذا العام هو صدور الكتـاب الأول لجمـاعة مغامير الأدبيـة ، وهو موجود في دار لبلى ودار ميريت ، صالة (4) ، وبـ 4 جنيه فقط ، يا بلاااااش<br />لمزيد من التفاصيل يرجى مراجعة هذا الرالط : http://anaweana.blogspot.com/2007/01/blog-post_25.html"
