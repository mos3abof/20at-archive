[[comments]]
order = 7
subject = "جزاك الله خيراً يا أستاذ حسام"
author = "عــــــمـــــــار"
posted = "2007-01-29"
text = "جزاك الله خيرا على موضوعك الجميل زي كل مواضيعك الممتازة<br />وأتمنى مش تزعل من التعليقات الغريبة اللي تزعل بجد!!!<br />بس في حاجة كنت مستنيها في الموضوع ده<br />وهي دور النشر اللي اتقفلت واتمنى تكون بتحضرلها موضوع جديد ،<br />أنا مستغرب من التعليقات العجيبة<br />بس أكتر حاجة أستغربت منها<br />\"المعرض دة مش الحكومة دى اللى عاملاة دا معرض من بقايا الزعيم البطل عبد الناصر بس بعد التشوية\" ولا تعليق"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131122008/http://masr.20at.com:80/article.php?sid=1509"

[[comments]]
order = 8
subject = "يالهوي انا هتجنن خلاص"
author = "يا جدعان معلش حد يبلغ شريف الداوخلي ميدخلش يتفزلك حرام والله انتخنقنا مش مبعد ما خلصنا من عايز اعرف رايك يا زنوبة ينطلنا الدواخلي يحرق دمنا"
posted = "2007-01-29"
text = "والنبي ابوس ايديك بلاش تشخ علي مقالات زمايلك ممكن<br />المرة الجاية هشتم ومش مسؤول"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131122008/http://masr.20at.com:80/article.php?sid=1509"

