text = "الاخوان يا جدعان عفريت مش عارف<br />نزلين برضة المعرض ومغيرين اسم اكبر دار لهم \" دار التوزيع \" الس اسماء اخر ي<br />الحكومة خلاص اتجننت من الاخوان مش عارفة تعمل اه"
