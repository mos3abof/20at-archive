text = "لعن الله الكاتب والجريدة وكل من ساهم في كتابة هذا المقال حقا من قال ان صحافة المصريين صحافة تفاهة واشعات وينشرون مواضيع تشمئز منها الابدان ولو شخص متميز لازم يعطوه شويه شكر على الطريقة المصرية"
