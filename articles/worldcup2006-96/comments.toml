text = "انتابني نوعا من الاستغراب وانا اقرأء سطور هذة المقالة حيث لم اتوقع ان اقرأ يوما مثل هذا الكلام على نجم من نجوم التعليق العربي لا يسعني الا ان اقول انكم لا ترمون الا الشجرة المثمرة فحسبه انه الافضل"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208075047/http://worldcup2006.20at.com:80/article.php?sid=96"

