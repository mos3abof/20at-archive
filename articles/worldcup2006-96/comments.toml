subject = "لا هذا و لا ذاك"
author = "bazemus79"
posted = "2006-07-01"
text = "الشوالى رغاى جدا ويشترك مع اشرف شاكر فى المبالغه تبقى الكره ف نص الملعب و هما قاعدين يزعقوا كأنها ف منطقة الجزاء ، و أى شوطه ف المدرجات تبقى خطيره جدا . عامة ، ممكن نعتبر الاثنين دول ملايكه بالمقارنه بالبلوه المسيحه اللى اسمه \\\"هبلان هبل الهبالى \\\" قصدى \\\"عدنان حمد الحمادى\\\" ، آخر تحف art ، اللى واخد التعليق بالدراع و للاسف art بكل عنصريه بتديله اقوى المباريات ."
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208075047/http://worldcup2006.20at.com:80/article.php?sid=96"

