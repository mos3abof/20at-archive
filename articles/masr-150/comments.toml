[[comments]]
order = 0
subject = "بس دول!!"
author = "عابر القارات"
posted = "2006-04-12"
text = "بالذمة هي دي بس الجرائم اللى هيقاضوه بيها هو و العائلة المالكة !! على كلا أنا أطالب بأقصى عقوبة و هى إرغام العائلة المالكة على السكن فى بدروم من بدرومات الغالبة فى الدويقة و إرغامهم على إستخدام أتوبيس النقل العام المنقرض أبو ربع جنيه و التزنيق فى الاتوبيس و الباقى أنتو عارفينه و إرغامهم على صرف مرتب لا يزيد عن 400 جنيه (بعد حوالى 12 سنة خدمة فى أى مصلحة حكومية و لو إن ما يتخفش على الريس لأن بمؤهلاته ممكن كمان يحوش الــ 400 جنيه و طبعا أنتم عارفين الطريقة و البركة فى الدرج الشمال) و إرغامه على صرف الــ 400 جنيه دول على عائلته الكريمة و إبقى قابلنى لو بقى منهم نص جنيه يوم 3 فى الشهر و لو إن الست الأولى مدبرة من زمان و عارفين قصتها مع التدبير من خلال الفيلم إياه بتاع علاء و جمال فى الصندوق و إرغامهم على العمل فى شركة قطاع عام من اللى هيتخصخصوا و بعدها هيترمى فى الشارع بعد ما يعطوه الفتات اللى هيضيعوا مصاريف فى البيت و بعدين فى الأخر طبعا نهاية سعيدة جدا و هوه إنهم هيكسبوا رحلة عمرة علشان يكفروا عن سيئاتهم و المفاجأه اللى فى أخر الفيلم و الكاميرا بتعمل كاوز قبل كلمة النهاية و تركز على إسم العبارة نلاقى العبارة إسمها (السلام ختام) أقصد أى (سلام) لأن كلهم بيجرشوا أخر الليل فى حضن سمك القرش المفترس بتاع البحر الاحمر و ده طبعا أكيد نهاية سعيدة .... و سعيدة جدا ... للشعب المصرى"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212448/http://masr.20at.com:80/article.php?sid=150&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "مش حاسيب"
author = "احمد فؤاد نجم"
posted = "2006-04-12"
text = "مش حاسيب ودة قدر ونصيب اسيب العز والجاة واكل السمك البكلاة دة غير فلوسي اللي من المعصرة لحد الانفوشي دة غير الخدم والصبيان من الوزير الاول لغاية قايد عسكر طربوشي دة غير البرلمان اللي مليان خرس وطرش وعميان والجرايد اللي بتكتب عني من الصبحيةللعصرية والمباحث الصاحية طول النهار عشان حركة كفاية اللي بيقولو عنها حركة شطار لكن علي مين دانا كنت طيار يا اولاد الحمار"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212448/http://masr.20at.com:80/article.php?sid=150&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "مش كفاية"
author = "مصرية"
posted = "2006-04-20"
text = "دى مش بس القضايا إللى إرتكبها حسنى مبارك ده قتل الشعب كله بتهميشه ليه ده نهب مصر كلها ده خلى الشباب كله مدمن علشان ينسى الضياع إللى فيه دى قضى على الديمقراطية بحبسه لرؤساء الأحزاب وللصحفيين ده لازم يرجع كل الفلوس إللى نهبها من مصر ويمنع من إحتلال شرم الشيخ ده صدر البترول لأمريكا بنصف الثمن لمدة عشرين سنه لقدام ده فتح أنابيب الغاز الطبيعى لإسرائيل تحت تصرفها ده خلى قناة السويس تمر فيها الأسلحة علشان تضرب العراقيين ده وقع الشعوب فى بعضها علشان يظهر بصورة المصلح الدولى ده بالعربى كده خــــــــــــــــــــــــــــــــائن ولازم يعدم على أيدى أبناء الشعب كلهم."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212448/http://masr.20at.com:80/article.php?sid=150&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "ده كذاب"
author = "مصرى"
posted = "2006-04-30"
text = "عمرة ما قال حاجة فيها صدق للشعب ويوم لما سألوه إيه البرنامج الإنتخابى بتاعك كان عامل زى ما يكون واحد بيسألوه عن شيء هلامى وقال إن البرنامج بتاعه ماشى وشغال كويس وبعد كده عمل برنامج غير عقلانى علشان يصلح فساده فيه وبدل لما الشعب يحاكمه على الفساد هوة إللى بيحاكم القضاه والصحفيين والشعب على فضحهم لفساده بجد دى بجاحة قوى ومش أى حد يقدر عليها."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212448/http://masr.20at.com:80/article.php?sid=150&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "أنظروا إلى شكله"
author = "مصرى"
posted = "2006-04-30"
text = "هو يكذب فى كل شيء حتى فى شكله فهو يصبغ شعره ويشد وجهه ويعمل مكياج كامل ولا أجدع راقصة حتى يختلس سنوات عمر ليست من حقه ويعيش أطول فترة من التظاهر بالشباب ولكن عندما يطالبه الشعب بإلغاء قانون الطوارىء تظهر عليه كل أنواع الشيخوخة بجد أنا بستغرب هوه ليه فافيش أى مخرج من إللى بيكتشف الفنانيين فكتشفهوش لغاية دلوقى وكان عمله كام كليب كدة زى بتوع روبى وذود ثروته بيهم."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212448/http://masr.20at.com:80/article.php?sid=150&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

