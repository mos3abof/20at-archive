posted = "2006-09-10"
text = "أتوقع ان مايحدث الآن بسبب الانفتاح الهائل والسريع في المملكة بعد ان كانت دولة شديدة المحافظة والالتزام ومايحدث هو اشبه مايكون ردة فعل للتطور المفاجئ ولكن هناك احتمالين لما سيكون في المستقبل والمستقبل علمه عند الله هو اما يعتاد شبابنا على هذا التطور ويحسنوا استخدام آلياته وامايتمادون في ماهم فيه واما بالنسبه للاعلام فحسب توجهه فاذا كان اعلاما هادفا فلا بئس مع انني لا أأيد ان تدخل الفتيات هذا المجال0"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133405/http://www.20at.com/article2.php?sid=1205"

