subject = "السعودية"
author = "السعودية"
posted = "2006-09-09"
text = "75% من المتصلين على قنوات العهر والفساد من السعودية !!<br />كشفت دراسة للبرامج التفاعلية والفضائيات أن ثلاثة ارباع الإتصالات والرسائل التي يتم إرسالها لقنوات فضائية غير محترمة تأتي من السعودية !! يأتي بعد ذلك لبنان ومصر ودول الخليج فقط !!! وتكلفة الرسالة الواحدة ثلاثة ريالات ويصل عدد الرسائل يومياً إلى مليون رسالة لمختلف القنوات الفضائية !! اي اننا نصرف على تلك القنوات ما يقارب من مليونين ونصف مليون ريال يومياً !! ويصل معدل الإتصال على تلك القنوات إلى ما يقارب من مليار ريال سنوياً !!!<br />ومن الأشياء المخجلة لنا أن بعض المتصلين من دول الخليج يدخل على البرنامج وهو لا يدري ماهو الموضوع الذي يناقشه البرنامج ؟ وبعضهم يدخل ليستعرض ثقافته الضحلة ويتغزل بالمذيعات ؟ وبعضهم يدخل فقط من أجل ان يذكر اسمه ثم يقطع الإتصال !! وبعضهم يستخف دمه !!<br />ومن ناحية الرسائل وشريط الرسائل دابت بعض تلك القنوات على طرح اسماء بعض المدن السعودية على شريط الرسائل الذي صار مثل الشات , مقرونه باسماء نسائية مثل عاشقة الجوف او فتاة حائل !! أو معشوقة شباب ...... , لإغراء المراهقين للدخول وإرسال رسائل الجوال للتغزل او للرد او لذكر اسم مدينته مقروناً ب: \" فتى الجرادية أو فتى بريده !!!..... أو صقر عرعر !! ..... والذي يفضح تلك الرسائل وأنها مكذوبة ان بعضها يضع ال التعريف امام مدن ليس بها ال تعريف مثل فتاة البريده أو عاشقة الرفحاء .... وذلك لكي يدخل شاب مراهق ليرد فهؤلاء القائمين على تلك القنوات يمسكون خريطة المملكة ويختارون اسماء المدن ثم يكتبونها لكي يرد المراهقين فتكسب تلك المحطة رسالة بثلاثة ريالات , واكثر تلك القنوات هي قنوات ماجنة فاسدة لا يستفيد منها المجتمع سوى الأغاني والرقص ,<br />هذا جز من ملخص دراسة مشروع تخّرج في احد الجامعات بالرياض بالتعاون مع الإتصالات السعودية<br />للأسف الا نخجل من هذا الوضع ؟؟؟<br />للأمانه نقلته لكم من أحد المنتديات لما رأيت فيه من أهمية !!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133405/http://www.20at.com/article2.php?sid=1205"

