text = "ما شاء الله تبارك الله<br />الصحفي هذا صراحة دائم يمتعنا بمواضيع جبارة<br />هذه ماهي إلا خطوة أولى في سبيل إفساح المجال أمام حواء سيلي ذلك مجالات عديدة بإذن الله ,<br />أرجوا أن لا تفسر بأنها ظغوط خارجية على حكومة خادم الحرمين الشريفين<br />بارك الله فيكم<br />عاشق العمودي"
