text = "خطوة جيدة جدا<br />لكن الاهم ان تكون الطالبات اعلاميات متنزنات في المستقبل<br />ليس كما يفعلن الان الطالبات<br />بعد المنع الشديد في البلد<br />انفتاح غير طبيعي<br />الله يستر<br />موضوع جيد يواكب الحدث"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133405/http://www.20at.com/article2.php?sid=1205"

