subject = "اظن"
author = "ياء"
text = "اظن ان المرحله القادمه ستكون مختلفه<br />اتوقع ان يخفت صوت السلاح وترتفع اصوات الدعايه لكلا الطرفين<br />بدايه فى صراع من نوع جديد اسرائيل ستحاول ان تطلب من المجتمع الدولى والدول العربيه نزع سلاح حركات المقاومه لكى تعيش فى سلام وحزب الله سيقول ان المقاومه هى وحدها قادره ان تبقى الشعوب العربيه على قيد الحياه<br />والكاسب فى هذه المعركه اما اسرائل لا قدر الله او حزب الله اذا استطاع ان يبقى على شعبيته فى لبنان والشارع العربى<br />بلادى بلادى لك حبى وكفاحى<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
archived = "2006-08-30"
capture_url = "https://web.archive.org/web/20060830025309/http://harb.20at.com:80/article.php?sid=102"
