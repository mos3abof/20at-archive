[[comments]]
order = 7
subject = "تعريف بالاخ الدكتور عادل"
author = "أشرف نظمى عبد الحميد"
posted = "2007-02-16"
text = "بسم الله /بالنيابة عن الاستاذ الدكتور عادل نسبه على خير ولا نزكى على الله احدا - اعرف<br />حضراتكم وحضراتكن به علما بان تعريفى لكم ولكن من وجهة نظرى الخاصة -<br />هو حاصل على درجة الماجستير في إصابات الركبة 1987م، و حاصل على دكتوراه في فسيولوجيا التغذية و الرياضة 1993م، كماأنه حاصل على دكتوراه في طب الأعشاب والطب البديل Dr. Of Philosophy In Herbal Medicine<br />تدرج في العمل بجامعة المنيا في جمهورية مصر العربية معيداَ و مدرساَ مساعداَ ثم مدرساَ لفسيولوجيا التغذية و الرياضة من 1983 حتى 1989م<br />عمل مديراَ لوحدة الطب الرياضي و العلاج الطبيعي و الجمنزيوم بالنادي الأهلي بالقاهرة من عام 1981 حتى1989م، و بنادي الشباب بدبي عام 1989م، و بالنادي العربي بأم القيوين كرئيس لوحدة العلاج الطبيعي من1990-1993م، و عمل بالنادي الأهلي بدبي بالعلاج الطبيعي 1994م، و عمل بمركز دبي الطبي للعلاج و البحوث بدبي في الفترة من 1993-1998م<br />أسس المركز الإيطالي للبحوث و العلاج بالأعشاب بإمارة عجمان عام 1995م<br />أسس مركز ستاركيد للتجميل في نفس العام<br />بالإضافة للمركز الأشهر و هو مركز السمنة و النحافة بعجمان حيث بدأ نشاطه في عام 2000 ليصبح من أشهر المراكز على الإطلاق في دولة الإمارات العربية المتحدة و يحظى هذا المركز بالدعم المباشر و الاهتمام المستمر من قبل صاحب السمو الشيخ حميد بن راشد النعيمي حاكم عجمان حفظه الله<br />بالإضافة إلى شهادات التقدير و شهادات التخرج"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217225311/http://masr.20at.com:80/article.php?sid=1556"
