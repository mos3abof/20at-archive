text = "انتو لازم تعقدوني بلاش خالص سيرة القصيرين دي لان انا شخصيا لما بقف جنب خطيبي او اخويا ببقى زي اللي في الصوره دا ( بس مش قزمه يعني ).<br />بس انا بعوض المشكله دي بالكعب العالي وعشان كدا اخويا بيقوللي (انتي نصك كعب جزمه....!!). وانا طبعا بضطر اسكت .. هقول ايه يعني .. وعشان كدا بقى انا من مشجعي جمعية قصار القامه دي ..وكمان هعمل جمعية الحقد ع الطوال."
