[[comments]]
order = 6
subject = "عيب عليك"
author = "مصرى"
posted = "2006-05-04"
text = "عيب عليك يافادى هو إنت مش مصرى وحاسس باللى المصريين حاسين بيه لو مش قادر تعمل حاجة ياريت يكون صمتك أكبر تعبير ماهو أنت صامت أمام إللى عمال ينهب فيك وفى مصر كلها ومهمشك ومش مخليلك لازمة فى بلدك إشمعنى دلوقتى جى يبقى ليك صوت أتمنى أن تكون مصرى مخلص للمصريين الذى جمعهم حسنى مبارك على حب مصر وكراهيته وتمنى الخلاص منه إن شاء الله فى القريب العاجل"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908165925/http://masr.20at.com:80/article.php?sid=272"

[[comments]]
order = 7
subject = "شكرا فادى"
author = "مجدى اليمانى"
posted = "2006-05-04"
text = "شكرا فادى على صراحتك معايا يمكن اكون فعلا مش فاهم حاجه وغبى كمان ومش عارف اتكلم لكن انت عملت ايه دخلت شتمتنىوخرجت على العموم شكرا والف شكر واخيرا اشكر الاخ اللى قاله عيب مع انى ما اعرفوش ملحوظه انا بحب اسمى قوى"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908165925/http://masr.20at.com:80/article.php?sid=272"

[[comments]]
order = 8
subject = "ماله ده"
author = "مالكش دعوة"
posted = "2006-05-04"
text = "ماله فادي ده؟؟ حد كلمه واللا داس له على طرف .. الراجل بيقول رأيه بكل وضوح وصراحة .. تدخل انت بدون مناسبة وتنزل فيه شتايم .. مالهاش تفسير إلا حاجة من تلاتة:<br />1- انك تكون انت مبارك نفسه أو جمال مبارك<br />2- انك تكون مباحث ومش قادر تمسك نفسك أمام النقد والرأي الآخر<br />3- إنك تكون متخلف عقليا ودخلت هنا غلط<br />إحترم نفسك واتعلم ازاي تحترم رأي الآخرين<br />في النهاية أسأل الله لنا جميعا الهداية والمغفرة ،"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908165925/http://masr.20at.com:80/article.php?sid=272"

