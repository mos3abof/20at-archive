[[comments]]
order = 1
subject = "هانت يا ميمون"
author = "بن الكفر"
posted = "2006-05-03"
text = "انت عارف في كام واحد اتولد في عهد حسني ومشفش رئيس غيرة؟؟!!؟!؟!؟!؟!؟<br />أنت ترعف كام واحد مات في عهد ميمون ؟!؟!؟!؟!؟!؟!<br />أنت تعرف كام واحد أتولد في عهد ميمون وماتو في عهد ميمون ؟!؟!؟!؟!؟!؟!؟!<br />أنت عارف في كام واحد طلع معاش في عهد ميمون؟!؟!؟!؟!؟!؟<br />أنت تعرف في كام واحد متلاقش شغل في عهد ميمون ؟!؟!؟!؟!؟!؟!<br />أنت عارف في كا اجنبي جة اشتغل في مصر في عهد ميمون؟!؟؟!؟!؟!؟<br />انت عارف في كام وحد دخل المعتقل في عهد ميمون؟!؟!؟!؟!؟!؟!<br />أنت عارف في كام واحد طفش وطلع اشتغل برة مصر؟!؟!؟!؟!؟!؟!؟!؟<br />أنت عارف أنت عارف أنت عارف ؟؟؟؟!!!!!<br />كل الارقام دي بالملايين"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908165925/http://masr.20at.com:80/article.php?sid=272"

[[comments]]
order = 2
subject = "كام رئيس دوله إتغير وإنت قاعد"
author = "مصرى"
posted = "2006-05-04"
text = "كام رئيس دولة إتغير وإنت قاعد بداية من أكبر دولة وهى أمريكا هل لا زال هناك شيء لم تفعله تريد أن تفعله حتى تستمر وجاى بعد الشيخوخه تصحى من النوم وتقول للمصريين برنامج إصلاح ومين هو إللى حكم مصر غيرك وعمل الفساد ونهب مصر وذلل المصريين...أنت يامبارك حاكم غير شرعى لمصر ... وإقرأ الدستور إللى إنت حاطه تحت جزمتك وإعرف إن الحاكم لازم ييجى بالإنتخاب وإنت لم تأتى فى يوم إلا بالتزوير والبلطجة ... ولأقول لك دوله الظلم ساعة ودولة الحق إلى أن تقوم الساعة وربنا يقصر أيامك معانا ويجعله آخر عيد ميلاد ولا تعتقد أن الزهايمير إللى عندك يخليك تعتقد أننا سنسمح لك بتوريث الحكم لإبنك المختل عقلياً الفاسد وكفاية عليه ميراث الندامه إللى هايورثه من وراك من نهب ثروات مصر."
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908165925/http://masr.20at.com:80/article.php?sid=272"

