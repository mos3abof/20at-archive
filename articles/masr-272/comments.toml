[[comments]]
order = 15
subject = "خايف أموت قبله"
author = "شيبمان"
posted = "2006-05-16"
text = "واحد صديق قاللى بقهر يوم عيد ميلاد الرئيس أنا خايف أموت قبله رغم أن الصديق عمره 39 سنة هو الرئيس حقيقى لا يعلم مدى رفض الشارع له يا ريس والله العملية وصلت لدرجة ان الناس تتمنى موتك والله أنا مشفق عليك التاريخ لا يرحم ليه بتعمل فى نفسك كده ملعون ابو الكرسى ارحل يمكن التاريخ يذكرهالك"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908165925/http://masr.20at.com:80/article.php?sid=272"

[[comments]]
order = 16
subject = "شكرا سيدي الرئيس"
author = "احمد"
posted = "2006-05-17"
text = "بشكر سيادتك يا ريس لنك ساعدتني علي اخذ قراري الصحيح منذ سنة بالهروب من البلد و اللي فيهاوكمان بشكرك علشان خلتني اشوف بلاد برة بيعاملوا البني ادمين ازاي حتي الدول العربية اللي كنا بنقول عليهم بدو طلعوا بيحترموا الني ادمين عندهم يا ريس سواء كانوا ولاد البلد و لا هربنين من بلادهم زيي كدة يا حبيبي شكرا يا حبيبنا يا معلي راية الحرية"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908165925/http://masr.20at.com:80/article.php?sid=272"

[[comments]]
order = 17
subject = "تعليق حر"
author = "شيرين"
posted = "2006-05-23"
text = "بعد قراءة جميع التعليقات وجدت أن الجميع يتهم سعادة معالي الباشا الريس ابونا ومعلمنا ورافع راية الحريه صح يا جماعة مش بيقولو عليها كده برده المهم انتو ظلمينه اوى لانه في الاخر مجرد موظف عند ؟؟؟؟؟؟؟؟؟؟؟؟؟؟ بلاش نذكر الاسامى أصلهم بيطلعو بالليل يجعل كلامنا خفيف عليهم وبعدين الاعمار بيد الله احنا مش هنتدخل فيها واسفة لو كنت طولت عليكم في الكلام وفي الاخر كل سنه وانت طيب يا ريس"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908165925/http://masr.20at.com:80/article.php?sid=272"

[[comments]]
order = 18
subject = "كل عام وأنت بخير يا ريس"
author = "عادل صالح"
posted = "2006-12-18"
text = "الحقيقة ياريس الناس تعبت قوى قوى قوى<br />والحياة أصبحت صعبة جدا وطبعا سيادتك حواليك من يبلغك أن كل شئ تمام وهم يخدعونك ، البلد فى إنحدار رهيب ياريس بس أنت مش عارف الناس عايشة إزاى المواصلات - الأكل - البطالة - التعليم هل فكرت مرة أنك تشترى كيلوا لحمة لولادك؟ ولا رغيف عيش ؟ ولا تدور لأبنك على عمل؟ ولا تدفع فاتورة مياه أو تليفون أو غاز أو أجرة بواب أو بنزين عربية أو قسط علربية أو يقبض على أبنك لأنه قال لاإله إلا الله؟أو تعرف كم هو مرتبك الشخصى ؟أشك فى ها وأكثر<br />أرجع لله وحاسب ضميرك وأتقى الله فى شعبك ودينك ، وأين حجاب زوجتك المحترمه؟<br />حقيقة أنا بحبك جدا وخايف على بلدى منك"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218163316/http://masr.20at.com:80/article.php?sid=272&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
