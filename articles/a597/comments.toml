[[comments]]
order = 0
subject = "سمية عصام العريان -اتصال تليفوني مع عشرينات"
text = "علاقتي بوالدي علاقة طيبة قريبة جدا من الصداقة. والدي يترك لي حرية الرأي وحرية اختيار الطريق لكن في النهاية لابد من سلطة الأب مع الأبناء.<br />أما مناقشاتنا فهي دائما هادئة وهو رجل ديمقراطي نتفق في 90% من المناقشات ونختلف في 10% فقط. أكيد أود أن أكون مثله ولكن ليست كل الأفكار التي يتبناها هناك أفكار أساسية لابد من تبنيها وهناك أراء شخصية نختلف عليها – أرى أبي أنه على حق.<br />ولما سألتها عن لو سألت نفسها ذات يوم لماذا لم يصبح عصام العريان رجلا عاديا أجبت لم أفكر يوما في هذا الموضوع لأني عندما ولدت وجدته هكذا"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926232038/http://www.20at.com:80/article.php?sid=597"

[[comments]]
order = 1
subject = "أسماء عبد الناصر صقر اتصال تليفوني مع عشرينات"
text = "والدي دائما ما يستشيرني في أمور كثيرة أكثر من أمي لأن أفكارنا دائما متفقة.<br />وعلاقتي به علاقة حميمة. أراه بطلا بالطبع لأنه يتعب لتحقيق الهدف الذي يؤمن به وأهم شيء أنه هدف جيد أكثر من أناس آخرين لا تجد لديهم أي هدف أو أن يكون هدفا سيئا.<br />دائما في البيت كلامنا يكون عن كل شيء عن الكلية وعن البيت وعن الأحوال الاقتصادية والاجتماعية والسياسية. طبعا أحب أن أكون في يوم من الأيام مثله ولكن مع الفرق بين الرجل والمرأة \" ما ينفعش التي تكون بره البيت على طول\". ولقد تعودنا في البيت على الفكر الحر. وأبي لا يعارض ما دام هذا في الطريق الصحيح وبعيدا عن غضب الله.<br />لم أتمنى في يوم من الأيام أن يكون أبي ليس هو نفسه هذا الشخص لأنه عاجبني كده."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926232038/http://www.20at.com:80/article.php?sid=597"

[[comments]]
order = 2
subject = "أنا أبويا معارض برده"
text = "السلام عليكم<br />وإن كنت أختلف مع أبى فى أشياء كثيرة، لكنى فخورة به جدا، ولم أفكر يوما أننى أريده شخص عادى على الإطلاق بالرغم من الضغوط التى نعانى منها..<br />الحمد لله"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926232038/http://www.20at.com:80/article.php?sid=597"

[[comments]]
order = 3
subject = "أمي معارضة"
text = "صباح التهييس واللي يحب النبي يخش السجن<br />أنا الحقيقة ابن لأم ديموقراطية جدااا .. بس معارضة كالعادة وأهي فرصة جديدة اضم اسم امي (اسم النبي حارسها) لأسماء المعارضة في بلادي يعني اللي ابوه ابو العلا واللي ابوه عصام<br />أنا أمي اسمها خالتكم (أم....)<br />وأمي معارضة لأي حاجة اعملها .. اذا ولعت سيجارة اولعها في الحمام .. واذا قلت حاجة تسمع من هنا وتطنش .. واي حاجة بتخللي الواحد يفرقع<br />امبارح (يعني بعد بكرة ) نزلت جابت من عم ابو شنب اللي تحتينا فرختين بلدي ..ادته درس في التسعير والتسويق<br />على العموم مش مهم امي معارضة وأنا فخور بذلك"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926232038/http://www.20at.com:80/article.php?sid=597"

[[comments]]
order = 4
subject = "قلة شريرة مندسة"
text = "هذا المقال من صحفيين مأجورين واعداء النجاح وطيور الظلام وحاقدين كاذبين طامعين جعانين...إلخ<br />هذا المقال يحاول النيل من قيادات مصر ورموزها وشعبهاو خالها وعمها .... إلخ<br />هذا المقال يحاول التشهير بمصر على الصعيد الدولى والداخلى والخارجى والصعيد الجوانى .... إلخ<br />مصر تعيش ازهى عصور الحرية والديموقراطية والفول والطعمية .... إلخ<br />مصر لم يقصف فيها قلم ولم تكسر مسطرة ولم تضيع استيكة .... إلخ<br />مصر لا يوجد بها مسجون رأى ولا معتقل سياسى ولا حد ابوه معارض اصلا .... إلخ<br />خلص الكلام ... والسلام .... إلخ<br />إمضاء<br />إلخ"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926232038/http://www.20at.com:80/article.php?sid=597"

