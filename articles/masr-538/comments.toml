author = "مصري"
posted = "2006-06-19"
text = "كفايه كفايه كفايه<br />احنا وصلنا للنهايه<br />هذا أصدق تعبير عن الحالة التي وصلت لها مصر في هذا العهد المبـــــارك !!!!!!!!!!"
