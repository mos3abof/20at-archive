[[comments]]
order = 3
subject = "مصريين شرفاء"
author = "ايمان محمد"
posted = "2006-06-19"
text = "ألف شكر لاعضاء حركة كفاية الذين استطاعوا أن يعبروا عن آلام هذا الشعب ورفضة للظلم و الطغيان باستخدامهم للكلمة المصرية البسيطة و هى كفاية ظلم كفاية استبداد.و أتمنى ان أنضم لهذة الحركة و أن أصبح جزء منها لمفلومة هذا الظلم"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621212625/http://masr.20at.com:80/article.php?sid=538"

[[comments]]
order = 4
subject = "الشكر لا يكفى الثورة الآن"
author = "مصرية"
posted = "2006-06-21"
text = "الشكر وحده لا يكفى لحركة كفاية بل يجب ان نشارك ونتفاعل معها لأنها قضية الوطن وقضية كل مصرى لو تصاعد عدد اعضاء الحركة الى الآلاف ثم الملايين لأستطعنا خلق جبهة قوية فى مواجهة الطاغية القرصان وعائلتة لابد من وقفة حاسمة من كل الشعب والجيش المصرى لانهاء عصر الفساد الذى نعيشه<br />لن يتحقق ذلك بمجرد التعبير عن الغضب<br />بل يجب ان نمتلك الشجاعة حتى نظهره بقوة .. لامجال لمزيد من الصمت والخضوع وألا سنواصل السير فى طريق مسدود ويواصل الطاغية السير فى طريق الأستبداد والتوربث ونلفظ الأنفاس الأخيرة فى دوامة الفساد بامتلاكهم لمصر ومن فيها<br />لاحل سوى بالثورة ..ثورة الجيش والشعب<br />أخى جاوز الظالمون المـــــــــدى<br />فحق الجهـــاد وحق الفـــــــــدى<br />يا كل أبنـاء مصر من الجيش والشعب<br />الثـــــــــورة الآآآآآآآآآآآآآآآآن"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621212625/http://masr.20at.com:80/article.php?sid=538"

[[comments]]
order = 5
subject = "عتاب على كفايه"
author = "سمير المصرى"
posted = "2006-06-24"
text = "اولا السلام عليكم جميعا...اننى ياسيدى ويااسيادى بكتب دائما فى منتداى كفايه لما نحسه من حريه التعبير الوحيده فى هذا البلد المباع للحتلال باى صورة وكنت انتقد النظام وكتبت ما احسه زى اى حد ما بيكتب تلقائى وحماسى واذا بلستاذ العظيم محمد الزهيرى يحزف كل ما اكتبه لسوء سلوكى فى الكلام طب يا اخوانى ممكن نحسس فى الكلام علشان الحكومه بطبطب علينا لما نعيط اى حد يقولى نكتب ايه وهو الكلام عليه جمرك حتى فى حركه كفايه ممنوع الكلام طب نروح فين منكم ومن الحكومه هو كلكم مع بعض ودى تمثليه على الشعب الغلبان.....المهم"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044321/http://masr.20at.com:80/article.php?sid=538&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "عتاب على كفايه"
author = "سمير المصرى"
posted = "2006-06-24"
text = "الناس والشعب خلاص بقى معندهوش فكر الا فى الكورة وحكيايه المقصورة حتى الجذمه وصلت الكورة انااتغيرت زى مصر ما اتغيرت وسوف تتغير الى الاسود طالما لا يوجد شعب يدافع عن كرمته وبلده اى شعب هذا التى تباع بلده امامه ويقف ساكت لاحس ولااحاس باى مسؤوليه...الحقون---------ا الحكومه بتبيع مصر بدل من الحرب والاحتلاال العسكرى بتبيع مصر للامركان واليهود يا ناس يا هو مصر بتتباع عينى عينك بكل ماساستها وحتى ورش الاحذيه الصغيرة بتتباع واخطر من هذا بيع الجامعه الامريكيه لئسرائيل ويرفرف علمك يا اسرئيل على ميدان التحرير الله الله الله واكبر على شعبك يا مصر...يا ناس ان حمار مابفهمش طب ليه حسنى مبارك الله يخرب بيته اجر قناة السويس للامركان علشان ايه مهو من حقه ولا كانت عزبه ابوه يا ناس يا هووووووووو امركا وصلت قناة السويس بدون حرب وبدون بمب هو الناس اللى بتفهم ماتت ولا ايه ولا البلد اصبحت من غير ناس وفضيااااااااا طب مين فين طب ومين هنا ومين راح فين ..حد يقدر يقولى الدوله معروضه للاجار قانون جديد ولا قانون قديم علشان نجيب شعب تانى بيفهم يسكن فيها..طب ليه الشعب لو مجواد ومش نايم مبيتكلمش عن بلده خلاص حتى القضاة باعو القضيه ومش مشكله بعد الشعب ما وقف جنبهم رمو المشكله فى الطين طب نتكلام فين ولا نصرخ اذاى حد يكون بيفهم يفهمنى انا هنا ولاانت فين طب ليه البد مش بتعتى حتى شركات الادويه بتاعه الفقراء اتباعت ياشعب قوم ونهض دافع عن كرمتك دافع عن دينك ودين امكك ودين ابوكم جميعا كفايه خلاص"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044321/http://masr.20at.com:80/article.php?sid=538&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
