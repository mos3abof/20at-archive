[[comments]]
order = 0
subject = "حركه الأمل"
author = "عمر قناوي"
posted = "2006-06-18"
text = "لن تكفي هذه المساحه القليله للتعبير عن حبي وفخري وتقديري العميق لهذه الحركه العبقريه والمدهشه والتي فاجئت النظام الحاكم من حيث لا يحتسب لقد راهن النظام أن هذه الحركه ستكون معارضه كرتونيه مثل باقي الأحزاب لكنها فاجئته بصمودها وقدرتها علي التجديد والابتكار بل والتصعيد أيضا واتصور شخصيا أن هذه الحركه ستلعب دورا كبيرا جدا في التغيير القادم في مصر والمنطقه العربيه لأن مصداقيتها أمام الجماهير أصبحت كبيره جدا خصوصا بعد اعتقال المئات من أعضاءها طوال العامين السابقين والمصداقيه تحديدا هي الشرط الوحيد لالتفاف الجماهير حول أي حركه معارضه"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621212625/http://masr.20at.com:80/article.php?sid=538"

[[comments]]
order = 1
subject = "شكرا"
author = "محمد سمير"
posted = "2006-06-19"
text = "الى اعضاء حركة كفاية المحترمين<br />اولا شكرا لانكم كنتم اول من قال لا شكرا لانكم ايقظتم هذة الامة شكرا لانكم اول من نطق وقال كفاية ولكن<br />لابد من اختيار متحدثين اكفاء جديرين بلقب متحدثين ويجب ايضا حسن اختيار الواجهة التى تمثلكم ولا تقعو فى نفس خطأ الاخوان المسلمين حينما صارو جميعا متحدثين وصارو جميعا يتحدثون من باسم الاخوان ولما كان هناك اختلاف فى الثقافات والعقليات ومستوى التعليم اصبح الكلام غير مفهوم وبه الكثير من الاخطاء واصبحنا لانعلم ماذا يريدون وانا هنا لا اطالب بان يكون هناك فئة معينه هى التى تنضم لحركتكم فالعمل الوطنى للجميع ولكن مااريدة استطيع ان اطلق عليه تحسين الواجههحتى يحترمنا العالم الخارجى ويحترمنا الاخر وهو مهم جدا ان ننال هذا الاحترام حتى يتسنى لنا عرض قضايانا ومرة اخيرة اقول لكم شكرا"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621212625/http://masr.20at.com:80/article.php?sid=538"

