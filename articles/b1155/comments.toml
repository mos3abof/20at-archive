subject = "..& من خلال الإسم يتضح المعنى &.."
author = "..& هيكل الأزهرى &.."
posted = "2006-08-29"
text = "تحية وإجلال للمحترم كاتب المقالة دى , الشخصية كشخصية هى محور التحوار والتفاهم بين الأشخاص وانا عن نفسى احب اقول ان الشخصية دى لازم الإنسان يعتنى بيها كل يوم على الأقل لأنها فعلا اساس ومن ضروريات اسس التفكير لأنها محورها الأساسى وفعلا كتير اوى فاكرين ان الشخصية دى حاجه خيالية وبنقراها فى الكتب وخلاص لكن انا اقترح على عشرينات انه يخصص جزء للتوعية النفسية خصوصا الصحة النفسية واسس التعامل والمناهج التمثيلية .. على العموم مقال فعلا اسمها بس كفاية على انه يبين معناه.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134453/http://www.20at.com/article2.php?sid=1155"

