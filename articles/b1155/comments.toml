subject = "الله أعلم"
author = "الديب"
posted = "2006-08-28"
text = "السلام عليكم .. مقال جميل<br />بس أظن ان الهدف من خلق الحياة على الارض هي:<br />\" ليبلوكم أيكم أحسن عملا \"<br />و الشخصية والعمل وجهان لعملة واحدة وهي الانسان ذاته .. فلو حسنت شخصيته لصلح عمله والعكس ..<br />فلو قدر الانسان يفك اسرار المخ أو ممكن نقول ال parameters التي تصف شخص ما .. لحاول تغييرها وتحسينها .. وهذا ما يتعارض مع الهدف من خلق الحياة ..<br />فلا أظن انه بمقدور اي علم في عصر ما التوصل للحقيقة الكاملة لكيفية عمل المخ البشري و الوصول الى شخصيته بشكل داخلي !<br />والله أعلم و أحكم<br />http://eldeebs.blogspot.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134453/http://www.20at.com/article2.php?sid=1155"

[[comments]]
