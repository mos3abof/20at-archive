subject = "فضايح"
author = "كنيسة أمريكية تدفع 48 مليون دولار للتكتم على فضائح رهبانها"
posted = "2007-01-08"
text = "قبلت كنيسة \"سبوكان واشنطن\" دفع مبلغ 48 مليون دولار على الأقل تعويضا لضحايا الاعتداء الجنسي من قبل الرهبان فيها، وذلك نظير حفظ التحقيق في الدعاوى القانونية المرفوعة من الضحايا ضد عدد كبير من الرهبان التابعين لها.<br />وويتبع كنيسة \"سبوكان\" الرومانية الكاثوليكية نحو 90 ألفا في ولاية واشنطن وحدها.<br />ولا تختص قضايا الانتهاكات الجنسية التي يرتكبها الرهبان بهذه الكنيسة وحدها بل تمتد لتشمل عددا كبيرا من الكنائس داخل الولايات المتحدة وخارجها، حيث أجبر الكم الكبير من الدعاوى القضائية المترتبة عن فضائح جنسية عدة كنائس على دفع ملايين الدولارات للمشتكين."
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115311/http://masr.20at.com:80/article.php?sid=1413"

