order = 3
subject = "البابا يعتذر عن التحرشات الجنسية للكهنة بالراهبات"
author = "البابا يعتذر عن التحرشات الجنسية للكهنة بالراهبات"
posted = "2007-01-08"
text = "قدم البابا يوحنا بولص الثاني اليوم اعتذارا لضحايا التحرشات الجنسية للكهنة وغيرهم من رجال الدين المسيحي في أول رسالة مباشرة يوجهها للعالم عبر الإنترنت. وكانت تقارير صحفية ذكرت أن تحرشات جنسية للكهنة والأساقفة بالراهبات وغيرهن من النساء تجري في أنحاء مختلفة من العالم وهو أمر أقر به الفاتيكان.<br />وقال البابا في جزء من الوثيقة المؤلفة من 120 صفحة “التحرشات الجنسية من بعض رجال الدين سببت معاناة هائلة وضررا روحيا للضحايا”. وشدد البابا على القول “آباء المجمع الكنسي يودون الاعتذار دون تحفظ للضحايا عن الألم وخيبة الأمل التي أصابتهم”. وأشار إلى أن الكنيسة في الأوقيانوس تسعى لما وصفه بأنه “إجراءات صريحة وعادلة” للرد على الشكاوى في هذا الشأن.<br />وجاء الاعتذار الموجه لراهبات في العالم النامي في وثيقة مسهبة أصدرها البابا مستعرضا الموضوعات التي تناولها مجمع كنسي عقد في الفاتيكان عام 1998 للأساقفة من منطقة الأوقيانوس التي تتألف من أغلب الجزر الصغرى في المحيط الهادي ويضم لها أحيانا أستراليا ونيوزيلندا.<br />ولأول مرة منذ تولى منصبه قبل 23 عاما أرسل البابا الوثيقة إلى الكنائس في مختلف أنحاء العالم بالبريد الإلكتروني عبر الإنترنت.<br />وفي مارس/ آذار الماضي نشرت مجلة ناشيونال كاثوليك ريبورتر الأسبوعية ومقرها الولايات المتحدة سلسلة من الموضوعات عن تقارير داخلية في الفاتيكان بشأن التحرش الجنسي للكهنة والأساقفة بالراهبات وغيرهن من النساء في مختلف أنحاء العالم، واعترف الفاتيكان بوجود المشكلة.<br />وقالت التقارير الداخلية إن بعض الكهنة والمبعوثين أجبروا الراهبات على ممارسة الجنس معهم وفي بعض الحالات اغتصبوهن وأجبروهن على إجراء عمليات إجهاض. وأشارت الت<br />اقرأ بقية التعليق .."
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115311/http://masr.20at.com:80/article.php?sid=1413"

[[comments]]
order = 4
subject = "الفاتيكان يعترف باغتصاب راهبات من قبل قساوسة"
author = "الفاتيكان يعترف باغتصاب راهبات من قبل قساوسة"
posted = "2007-01-08"
text = "اعترف الفاتيكان بصحة تقارير صحفية تحدثت عن انتهاكات أخلاقية في صفوف الكنيسة، وقالت إن قساوسة ورجال دين كبارا أرغموا راهبات على ممارسة الجنس معهم، وتعرضت بعض الراهبات للاغتصاب وأجبرت أخريات على الإجهاض.<br />وقال الفاتيكان في بيان له إن القضية محدودة ومتعلقة بمنطقة جغرافية محددة، لكنه لم يشر إلى هذه المنطقة الجغرافية، وكانت التقارير أكدت أن هذه الانتهاكات موجودة في 23 بلدا من بينها الولايات المتحدة الأميركية والبرازيل والفلبين والهند وإيرلندا وإيطاليا نفسها.<br />وأكد البيان أن الكرسي البابوي يتعامل مع القضية بالتعاون مع الأساقفة، والمؤسسات الدينية الكاثولكية الأخرى لمعالجة الموضوع.<br />وأدانت وكالة الأنباء التبشيرية ميسنا ما أسمته مفاسد المبشرين لكنها في الوقت نفسه دعت إلى تذكر أن هؤلاء القساوسة ورجال الدين يظلون بشرا. لكن المتحدث الرسمي باسم المؤتمر الأميركي للأساقفة الكاثوليك قال إن “أقل ما يمكن قوله عن هذا التقرير هو أنه مروع ومزعج”. لكنه أوضح أنه لا علم له بمثل هذه الانتهاكات في الولايات المتحدة.<br />وقال تقرير نقلته صحيفة لا ريببليكا الإيطالية إن بعض الراهبات أجبرن على أخذ حبوب منع الحمل. وأشار إلى أن معظم حالات الاعتداء الجنسي على الراهبات حدثت في أفريقيا حيث “تعرف الراهبات على أنهن آمنات من الإصابة بفيروس الإيدز” المنتشر في القارة السمراء.<br />وكانت الاتهامات قد ظهرت للمرة الأولى في التقرير الكاثوليكي القومي الأسبوعي في مدينة كانساس في 16 مارس/ آذار ونقلته وكالة أنباء أديستا -وهي وكالة إيطالية دينية صغيرة- مما أدى إلى وصوله لأجهزة الإعلام العامة.<br />وقد أعدت التقرير الذي تحدث عن حالات محددة بالأسماء وحالات تورط أصحابها راهبة و<br />اقرأ بقية التعليق .."
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115311/http://masr.20at.com:80/article.php?sid=1413"

[[comments]]
order = 5
subject = "فضائح الراهبات,"
author = "August 20th, 2006 Posted by deedat | فضائح الراهبات, زلزال فضائح 2002م | No Comments"
posted = "2007-01-08"
text = "مازال الأعتداء الجنسي للقساوسه مستمرا<br />كشف تقرير صادر من الفاتيكان عن قيام الكثير من القساوسة والأساقفة في الكنائس الكاثوليكية بالاعتداء الجنسي على الراهبات واغتصابهن وإجبارهن على الإجهاض أو تناول حبوب منع الحمل.<br />وذكر التقرير الذي نشرته صحيفة “لاريبابليكا” الإيطالية الصادرة عن الفاتيكان الأربعاء 21-3-2001 أن هؤلاء القساوسة والأساقفة يستغلون سلطتهم الدينية التي يتمتعون بها في العديد من الدول، خاصة دول العالم النامي لممارسة الجنس مع الراهبات رغمًا عنهن، مشيرًا إلى أنه تم الكشف عن العديد من حالات الاعتداء في 23 دولة، منها الولايات المتحدة، البرازيل، الفليبين، الهند وأيرلندا، وإيطاليا، بل وداخل الكنيسة الكاثوليكية (الفاتيكان) نفسها، بالإضافة إلى العديد من الدول الإفريقية!!.<br />وأشار التقرير إلى أنه تم الكشف عن عدد لا حصر له من حالات الاعتداء الجنسي من جانب القساوسة، الذين يقومون بإجبار هؤلاء الراهبات، إما على تناول حبوب منع الحمل، أو الإجهاض لمنع الفضيحة.<br />وقال التقرير: إن إحدى الراهبات الأم بكنيسة -لم يتم ذكر اسمها- أقرّت بأن القساوسة في الكنيسة التي تعمل بها قاموا بالاعتداء على 29 من الراهبات الموجودات في الأسقفية، وعندما أثارت الراهبة هذا الأمر مع كبير أساقفة الكنسية، تم فصلها من وظيفتها.<br />وفي كنيسة أخرى -وطبقا للتقرير- طالب القساوسة الموجودون بها، بتوفير راهبات للخدمات الجنسية!!.<br />وأشار التقرير إلى أنه وبعد اكتشاف مثل تلك الحالات فإنه يتم إرسال القساوسة المسئولين عن تلك الاعتداءات، إما للدراسة خارج الدولة أو إرسالهم لكنيسة أخرى لفترة قصيرة. أما الراهبات -اللاتي يخشين العودة إلى<br />اقرأ بقية التعليق .."
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115311/http://masr.20at.com:80/article.php?sid=1413"

[[comments]]
order = 6
subject = "طفل ينتحر بعد أغتصابه جنسيا ُ من الكاهن"
author = "طفل ينتحر بعد أغتصابه جنسيا ُ من الكاهن"
posted = "2007-01-08"
text = "الكنيسة الكاثوليكية تبحث الانتهاكات الجنسية<br />يعقد أساقفة كنيسة الروم الكاثوليك إجتماعا لبحث افضل السبل للتعامل مع القساوسة الذين يرتكبون انتهاكات جنسية مع الأطفال هزت صرح الكنيسة في الولايات المتحدة في الاشهر الأخيرة .<br />ويناقش القساوسة في الاجتماع، الذي وصف بأنه أهم الاجتماعات في تاريخ الكنيسة الأمريكية، الطرق الواجب اتباعها مع رجال الكنيسة الذين ينتهكون الأطفال واليافعين.<br />وفي عشية هذه الاجتماعات، عقد الأساقفة جلستين خاصتين لسماع شهادات الأشخاص الذين تعرضوا لانتهاكات جنسية على ايدي القساوسة.<br />ويطالب ضحايا الانتهاكات وعدد كبير من الأمريكيين الكاثوليك الكنيسة بتبني موقف \"عدم التسامح على الإطلاق\" تجاه مثال هذه الانتهاكات، وفصل أي قس ينتهكها وتسليم القضية للسلطات المدنية والشرطة.<br />ويطالب البعض أيضا الفاتيكان بفصل الأساقفة الذين يتغاضون عن التحذيرات التي تشير إلى وقوع مثل هذه القضايا ويسمحون للمنتهكين بمواصلة عملهم في الكنيسة.<br />يذكر أن أربعة أساقفة ونحو 250 قسا تمت اقالتهم أو اوقفوا عن العمل في أعقاب اتهامات بسوء سلوك وتحرشات جنسية.<br />قصص انتهاكات<br />وتحدث ضحايا الانتهاكات الجنسية، بعد مقابلة مع الأساقفة يوم الأربعاء، مع الصحافة في الوقت الذي كان فيه الكرادلة وكبير أساقفة يصغون.<br />الأساقفة: شهادات تحطم القلب ورفع مارك سيرانو، البالغ من العمر 38 عاما، صورته عندما كان بعمر 12 عاما ووصف كيف تعرض للاغتصاب على يد أحد القساوسة.<br />وقال \"إن الإصغاء سهل، والكلام رخيص، لكن العمل الأخلاقي الواجب اتخاذه لا يقدر بثمن.\" بينما عرض زوجان صو<br />اقرأ بقية التعليق .."
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115311/http://masr.20at.com:80/article.php?sid=1413"

