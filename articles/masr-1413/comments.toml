author = "قصة ادم عليه السلام"
posted = "2007-01-09"
text = "وروي الحافظ ابن عساكر عن طريق محمد بن إسحاق، عن الحسن بن ذكوان، عن الحسن البصري، عن أبي بن كعب قال: قال رسول الله صلى الله عليه وسلم: \" إن أباكم آدم كان كالنخلة السحوق، ستون ذراعاً، كثير الشعر، مواري العورة، فلما أصاب الخطيئة في الجنة بدت له سوأته فخرج من الجنة، فلقيته شجرة فأخذت بناصيته، فناداه ربه: أفراراً مني يا آدم؟ قال: بل حياء منك والله يا رب مما جئت به\"<br />ثم رواه من طريق سعيد بن أبي عروبة، عن قتادة، عن الحسن، عن عتي بن ضمرة عن أبي بن كعب، عن النبي صلى الله عليه وسلم بنحوه.<br />وهذا أصح، فإن الحسن لم يدرك أبيا.<br />ثم أورده أيضا من طريق خيثمة بن سليمان الأطرابلسي، عن محمد بن عبد الوهاب أبي قرصافة العسقلاني، عن آدم بن أبي إياس، عن سنان، عن قتادة، عن أنس مرفوعاً بنحوه.<br />{وناداهما ربهما ألم أنهكما عن تلكما الشجرة وأقل لكما إن الشيطان لكما عدو مبين* قالا ربنا ظلمنا أنفسنا وإن لم تغفر لنا وترحمنا لنكونن من الخاسرين} (سورة الأعراف:22ـ23)<br />وهذا اعتراف ورجوع إلي الإنابة، وتذلل وخضوع واستكانة، وافتقار إليه تعالى في الساعة الراهنة، وهذا السر ما سرى في أحد من ذريته إلا كانت عاقبته إلي خير في دنياه وأخراه.<br />{قال اهبطوا بعضكم لبعض عدو، ولكم وفي الأرض مستقر ومتاع إلي حين} (سورة الأعراف:24)<br />وهذا خطاب لآدم وحواء وإبليس، قيل والحية معهم، أمروا أن يهبطوا من الجنة في حال كونهم متعادين متحاربين. وقد يستشهد لذكر الحية معهما بما ثبت في الحديث<br />عن رسول الله صلى الله عليه وسلم أنه أمر بقتل الحيات وقال: \"ما سالمناهن منذ حاربناهن\"<br />وقوله في سورة طه:<br />{قال اهبطا منها جميعاً بعضكم لبعض عدو} (سورة الآية:123)<br />هو أمر لآدم وإبليس، واستتبع آدم: حواء، وإبليس: الحية. وقيل: هو<br />اقرأ بقية التعليق .."
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115311/http://masr.20at.com:80/article.php?sid=1413"

[[comments]]
order = 12
subject = "الى الاخ الى كاتب القصص الجنسيه"
author = "وهذا وان دل على شىء فيدل على انه شخص واطى يعيش فى الدعاره لانى الاناء ينضح بما فيه"
posted = "2007-01-09"
text = "اولا قلت البابا يوحنا بولس الثانى قد قدم اعتذار اليوم البابا يوحنا ازاى ياكداب يالى كل همك تسىء لسمه الكنيسه يانجس البابا يوحنا متوفى من زمان والان هو البابا بندكتوس<br />ثانيا الرهبان لايعيشون فى العالم بل فى الجبل يتعبدون الى الله وبس مش شواذ زى امثالك كل تفكيرهم فى الجنس وبس<br />ثالثاكل القصص التى حكيتها ليس لها اى اساس من الصدق اذا كان هناك مصدر لمعلوماتك قوله لى<br />رابعا الرهبات هم عذارى ندرن البتوليه ويحافظون على طهارتهم مش منقبات وبتمارس الجنس من تحت الخمار<br />خامسا الاناء ينضح بما فيه فانت الذى كتبته هو الذى فى بيتك وفى اسرتك وفيك فابلتالى نضح فى كتابتك"
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115311/http://masr.20at.com:80/article.php?sid=1413"

[[comments]]
order = 13
subject = "الى على (الى الاخ الى كاتب القصص الجنسيه"
author = "اخي الفاضل ومين قالك ان اللي كاتب هذه الفضائح واحد مسلم زي ما انت عارف الموقع مفتوح وكل اللي كايز يكتب بيكتب فلماذا اتهمت المسلمين مع ان دينهم ينهاهم عن ذلك لماذا لا يكون شيوعي مثلا او يهودي او اي ملة اخرى تريد الايقاع بين المسلمين والمسيحيين."
posted = "2007-01-13"
text = "ارجو ان تنتبه الى ذلك<br />واريد ان اذكر ان ضرب البرجين في امريكا صناعة اسرائيلية وكما شاهدت المقصود منها الايقاع بين المسلمين والمسيحيين وخلافه كثير وكثير من الاعيب اليهود عليهم لعنة الله"
archived = "2007-01-15"
capture_url = "https://web.archive.org/web/20070115225943/http://masr.20at.com:80/article.php?sid=1413"

