subject = "عجبا"
author = "عجبا للمسيح بين النصارى ****** والى الله ولـدا نسبـــوه"
posted = "2007-01-18"
text = "أسلموه إلى اليهود وقالـوا ****** إنهم من بعــد قتله صلبوه<br />فلئن كان ما يقولون حقــا ****** وصحيحا فأين كـان أبوه<br />حين خلى ابنه رهين الأعادي ****** أتراهم أرضوه أم أغضبـوه<br />فإذا كان راضيا بأذاهــم ****** فاشكروهم لأجـل ما صنعوه<br />وإذا كان ساخطا غير راضٍ ******* فاعبدوهـم لأنهّــم غلبوه"
