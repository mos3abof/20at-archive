[[comments]]
order = 18
subject = "إلى اخونا الاقباط وإلى عشرينات"
author = "مصرية"
posted = "2007-01-20"
text = "واللهى انتوا ناس غريبة اولا احنا كلنا مصريين سواء كنا مسلمين او مسحيين احنا لسة مصريين وبعدين الدين لله والوطن للجميع وبعدين للناس اللى قاعدة تتكلم دول انا عايزة اقولهم انى الرسول عليه الصلاة والسلام وصانا على اخونا الاقباط وانتوا بصراحة كدة مانفذتوش وصية الرسول لانى الرسول وصانا عليهم ويا بنت يسوع احنا دينا برضو بيدعو للسلام زى مادين المسحية بيدعو للمحبة وبعدين احنا مش اعداء احنا مصريين زى بعض وبعدين يعنى ما احنا طول عمرنا عايشين مع بعض فى مصر فى سلام .اعرفوا يا جماعة انى اى حد بيزرع الفتن دة مش مصرى دة واحد عايز يعمل فتنة مابينا وخلاص لانى اصلن اعداء مصر احتاروا معانا لانهم لاقونا احنا المسلمين مع اخونا الاقباط يد واحدة فقالوا نعمل فتنة لكن احنا اكبر من انى حد يجى يوقعنا فى بعض ويعمل ما بينا فتنة وكمان يعنى تذكروا القس اللى دخل الجامع والقى خطبة فى الجامع ايام ثورة 1919 وكمان الشيخ اللى دخل الكنيسة وقال خطبة وبعدين يعنى افرضوا انى اسرائيل جت ضربت مصر مثلا اسرائيل هتفرق مابين مسلم او قبطى لا دى هتضربنا كلنا لاننا كلنا مصريين .وياريت يا عشرينات انتوا موقع جميل ولكم كل التقدير ياريت يعنى ماتكتبوش مواضيع زى كدة تانى لانى انتوا كدة بتفتحوا مجال من غير قصدكم لاعدائنا لاعداء مصر انهم يدخلوا يعملوا فتنة ويمشوا وللناس اللى بتحاول تعمل فتنة مابينا.و انا بقولهم خليكم متغاظين لاننا هنفضل احنا مسلمين واقباط فى مصر اخوات وهتفضل ايدينايدواحدة ضد مبارك وضد اسرائيل وامريكا وضد اى خاين.<br />موسى نبى وعيسى نبى ومحمد نبى وكل من ليه نبى يصلى عليه"
archived = "2007-01-21"
capture_url = "https://web.archive.org/web/20070121084854/http://masr.20at.com:80/article.php?sid=1413"

[[comments]]
order = 19
subject = "إلى اخىjojo"
author = "مصرية"
posted = "2007-01-20"
text = "اولا الناس اللى بتشتم فى سيدنا عيسى دول مش مسليمن لانى احنا كمسلمين مؤمنين بسيدنا عيسى ومؤمنين بكل الانبياء واسم سيدنا عيسى ذكر فى القران وعندنا سورة كاملة باسم السيدة مريم. واللى داخل يشتم ويعمل فتنة مابينا دة مش مصرىىىىىىىىىى والله دة مش مصرىىىىىىىى لانى دة لو كان مصرة مش هيزرع الفتن بين الناس وكمان يا جماعة لتانى مرة احنا مش اعداء احنا مصريين زى بعض واللهى احنا كلنا مصريين زى بعض .وبعدين يعنى الموضوع كان بيتكلم عن سيدنا عيسى وعن تكريم الاسلام لسيدنا عيسى انا بقى مش عارفة فى ناس حولت الموضوع لفتنة واللهى عيب عليكم اتقول الله دة الرسول وصانا على اخونا الاقباط .وللناس اللى هوايتهم انهم يعلموا فتنة بين الناس انا بنصحهم انهم يروحوا لدكتور نفسى لانى هو كدة مريض وعلى فكرة الدكتور نفسى مش عيب لانى الحالات النفسية دى بتبقى زى اى مرض ولازم يروح لدكتور نفسى.<br />وموسى نبى وعيسى نبى ومحمد نبى وكل من ليه نبى يصلى عليه"
archived = "2007-01-21"
capture_url = "https://web.archive.org/web/20070121084854/http://masr.20at.com:80/article.php?sid=1413"

