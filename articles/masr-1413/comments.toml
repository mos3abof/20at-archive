[[comments]]
order = 16
subject = "ارحمو ا الانبياء"
author = "jojo"
posted = "2007-01-18"
text = "لو سمحت يا ناس يلى بتكتب بلاش شتيمه فى الانبياء شويه اكيد كل واحد مسلم شايف ان المسيحين دوال ناس هبل شايفين ان ربنا قدر يخلف ولد ويسلمه للناس على الارض علشان تعبده بس دة مشكلة كل واحد مسلم علشان هو لما بيحب يقراء حاحة عن المسيحيه بيجيب كتب بتاعت ناس بتشتم فيه او بتقول تخريف اللى عايز يفهم حاجة يقرا للناس بتوع الحاجة دة يعنى عايز تقراء عن الاشتركيه اقرا حاجة لماركس مش لحد من امريكا راس مالى اوكى ....... تانى حاجة على كل واحد مسيحى يدخل هنا يبيان انا احنا بجد ولاد المسيح مش ولاد شوارع بنشتم ونستظرف ونقول تخريف زى ما هم بيقولوا تانى حاجة بردة على كل مسيحى عايز يقرا عن الاسلام يقرا لكتاب مسلمين ويفهم اللى مكتوب ودة مفيش منه خوف عليه علشان هو اكيد مومن بالفداء وبالخلاص اللى المسيح جاه وادهوله فخلاص يحول يقرا ويفهم علشان يتكلم مع الناس دة بالمنطق بتاعهم وارحموا نفسكم ولو حد شتم يا جماعه فين ولا فى البابا ولا فى اى حاجة مش لازم تبقى انت يعنى المدافع عن الصليب والمسيحيه وتبين انك ولاد صايع وبتعرف ترد بشتيمه يا عم اللى يشتم يشتم ربنا يسامحه ولو شتم فى المسيح والمسيحيه ربنا هو اللى هيعرف ياخد حقه مش انت اللى هتعرف تاخده وزى ما الكتاب قال + احبكو اعدائكم باركو لعنيكم +<br />وشكرا للصدركم الواسع ...<br />شاب مسيحى مصرى _ليبرالى"
archived = "2007-01-21"
capture_url = "https://web.archive.org/web/20070121084854/http://masr.20at.com:80/article.php?sid=1413"

