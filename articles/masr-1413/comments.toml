subject = "كلمة الله"
author = "فهد الا سلام البناء"
posted = "2007-01-08"
text = "بسم الله وصلاة وسلم على نبينا وعلى موسى وعيسى وكل الا نبياء المرسلين وبعد فسيدنا المسيح عيس ابن السيدة العذرا لهما كل التقدير و اللاحترام والاسلام قدر سيدنا عيسى وامة وتنزل فى القران سورة بسم السيدة مريم لانهما من احباب الله والسيدة مريم نحن نقول عنه انها سيدة نساء العلمين واللهمن كان من المسلمين من يتهم السيدة مريم او السيد المسيح باى شى بطل فلم يكتمل ايمانة اما مسالة الصلب فهى المشكلة مع الا خوة المسحين هى وانة اله فهو رسول الله وكلمتة فى الارض فان الله يقول للشى كن فيكون وحسبنا الله هو مولانا ونعم الوكيل"
