order = 1
subject = "قبطي يسرق كنيسة العذراء بالقليوبية"
author = "قبطي يسرق كنيسة العذراء بالقليوبية"
posted = "2007-01-08"
text = "أمر أحمد عزوز مدير نيابة الخانكة بحبس سائق القس «يسطس فانوس» راعي كنيسة العذراء بالقليوبية ٤ أيام علي ذمة التحقيقات سرق خزينة الكنيسة وبداخلها ٤٥ ألف جنيه، وادعي أن مجهولين اقتحموا الكنيسة وارتكبوا الحادث كشفت المباحث غموض الواقعة وأدلي المتهم باعترافات تفصيلية في تحقيقات النيابة.<br />قال المتهم غبريال نادر عزيز «٣٥ سنة» إنه يعمل سائقاً للقس يسطس فانوس «بطرس» راعي كنيسة السيدة العذراء «مطرانية الأقباط الأرثوذوكس» بمنطقة ورش أبوزعبل منذ أكثر من ٥ سنوات تزوج قبل عامين وأنجب طفلة، تطالبه الزوجة بمصاريف بالغة تفوق راتبه الشهري، حاول الالتحاق بعمل إضافي إلا أن الوقت لم يسمح له.<br />ذات يوم شاهد السائق القس يسطس ومعه ٣ آخرون من مسؤولي الكنيسة داخل حجرة مبني الخدمات الملحق بالكنيسة وقفوا أمام خزينة حديدية، بابها كان مفتوحاً تظهر المبالغ المالية منه.. وقف السائق علي باب الحجرة اتخذ قراره بالاستيلاء علي تلك الأموال عاين المكان والحراسة الأمنية علي الحجرة حدد طريقة الدخول عاد إلي منزله اتصل بالقس وأبلغه أنه مريض واستأذن في الراحة واستقر القس داخل منزله هو الآخر. توجه السائق إلي الكنيسة غافل حارس الحجرة ويدعي جاب الله غالي سليمان وكسر زجاج الباب الداخلي المفضي إلي الحجرة حمل الخزينة ووضعها داخل حقيبة سيارة القس وعاد إلي منزله خبأ الخزينة في جدار خزان الصرف الصحي بداخل منزله ولم يفتحها.<br />وأضاف المتهم أنه ارتكب الواقعة نظراً لمروره بضائقة مالية كما أن المبالغ التي شاهدها في الخزينة أغرته واعتقد أنها ستحل له كل مشاكله واستمعت النيابة لأقوال حارس الحجرة والقس الذي قام بفتح الخزينة وأكد سلامة الأموال الموجودة بها،<br />اقرأ بقية التعليق .."
archived = "2007-01-09"
capture_url = "https://web.archive.org/web/20070109115311/http://masr.20at.com:80/article.php?sid=1413"

