subject = "crazy nona"
text = "السلاموا عليكم<br />ضحكتني<br />بس في مشكلة يا اخ احمد<br />انك لما هتتجوز العربية هتبقي ليك شيء ضروري و ملح<br />ربنا معاك<br />و موضوع بجد لذيذ<br />و ايوة كده فكوها و روقوا انا عارفة ان كلكوا حزن علي المرحوم محمد صيام و براء و مصعب في امتحانات<br />ربنا معاكوا كلكم<br />اختكم نهي<br />علي فكرة وحشتوني"
archived = "2005-06-15"
capture_url = "https://web.archive.org/web/20050615073825/http://www.20at.com:80/article.php?sid=1196"

