[[comments]]
order = 3
subject = "يا عيني يا ابني"
text = "هذا تعليق على مقال أحمد عبيد ( تشتري سيارة ) اللي المفروض يبقى (تشتري عربيـة !) ، ومش هكتبه تاني ، ومش مسؤول لو نزل ف حتة تانية بالغلط !!!<br />طبعًا يا سيدي دي عيوب اللي بسيب إخواته ، وحبايبه ، وتلاقيك يا عنيا .. كعب داير على محلات العربيات ، وف الآخر افتكرت إن ضغط علي ، بس بجد حراااام عليك<br />تلاقيك إنتا اللي معلي ضغطـها :)<br />وأنا بقول بقالك أسبوعين ما جيتش ليه<br />ــــــــــــــــــــ<br />بالمناسبـة : تحيااتي ليكي يا نهى ، ونحن في انتظاااااااارك :) ربنا يعدي الامتحانات على خيـر ، فين موضوعـ(نــا ) يا أستـاذ أحمد ؟؟؟"
archived = "2005-06-15"
capture_url = "https://web.archive.org/web/20050615073825/http://www.20at.com:80/article.php?sid=1196"

[[comments]]
order = 4
subject = "فكرتني يا ابو حميد"
text = "فكرتني بالقاهرة الحلوة الشقية اللي معذبانا... بس برده بنجري وراها .. كأنها عاملة لنا عمل..<br />كالعادة كتابتك رشيقة وهايلة (حلوة رشيقة دي؟)<br />بس ليه كتبت عربي؟ .. قليل من العامية يصلح المقالة...<br />يا ترى عرفتني؟<br />انا من أيام السوبر بندق<br />والريجيم اللي عمره ما فلح معايا<br />وسلم لي على إمو<br />شوف الأيام ودتنا فين؟"
archived = "2005-06-15"
capture_url = "https://web.archive.org/web/20050615073825/http://www.20at.com:80/article.php?sid=1196"

