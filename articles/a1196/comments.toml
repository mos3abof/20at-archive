subject = "الفياجرا ده محتاجها حسنى مبارك وكلابه"
text = "يا عينى قايمين ب80 مليون يوميا وف كل وقت ربنا يديهم الصحة<br />ويعينهم عالشعب الزبالة دة ...قال وكمان الشعب مش عاجبه<br />سلملى على شيييييييييش الكباااااااااب<br />إنمااحنابقى ناخد فياجرا لييييييييه لا سمح الله!!!؟؟؟"
archived = "2005-06-15"
