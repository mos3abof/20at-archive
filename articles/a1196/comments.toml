text = "لموضوع تشتري عربية ، ومش مسؤول لو نط لموضوع تاني :<br />هاي أحمد باشا ، ما تخااااااااااافش ع الحلل ، كله صواني ..قزاز!!! ـ كويس إنكوا عدلتوا اسم المقال ف الصفحة الرئيسية يا عشريناتيه ، وياريت تعدلوه جوه كماااااااااااااان :)<br />تحيااااااااااااتي"
archived = "2005-06-15"
capture_url = "https://web.archive.org/web/20050615073825/http://www.20at.com:80/article.php?sid=1196"

