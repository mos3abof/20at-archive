[[comments]]
order = 6
subject = "عمرك أطول من عمري"
text = "أنا كمان بفكر في موضوع العربية دي لكن بالأضافة للمشاكل الي انت قولتها أنا عندي مشكلتين تانين :<br />أولا : ان أنا معرفش في شوارع القاهرة غير شارع بيتنا و الشارع اللي ساكنة فيه أعز صديقاتي و الشارع اللي فيه الشغل بتاعي .<br />ثانيا: أني بيتهيألي اني لو قابلني موقف صعب و أنا بسوق يإما هنط من العربية و أسيبها تلقي حتفها لوحدها يإما هغمض عيني و أسيب نفسي .<br />أضف إلي ذلك جميع المميزات و العيوب اللى انت ذكرتها يبقي في رأيك اشتري عربية و لا لأ."
archived = "2005-06-15"
capture_url = "https://web.archive.org/web/20050615073825/http://www.20at.com:80/article.php?sid=1196"

