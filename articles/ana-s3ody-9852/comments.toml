text = "((إِنَّ الَّذِينَ يُحِبُّونَ أَن تَشِيعَ الْفَاحِشَةُ فِي الَّذِينَ آمَنُوا لَهُمْ عَذَابٌ أَلِيمٌ فِي الدُّنْيَا وَالْآخِرَةِ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ)) [النور : 19]<br />أتحسبون يا هؤلاء أننا لا نرى - كوضوح الشمس - كما الحقد الذي في قلوبكم على شباب تلك البلد بالذات، والتي هي أقرب البلاد في الأرض الى دين رب العالميبن؟؟ كلا والله! ورائحة العفن لا تخطئها الأنوف الصحيحة!! عاملكم الله بما تستحقون!"
