text = "ميرسي لالك يا ناصر الموضوع كتير حلو …على فكرة ليش دائما فئة الشباب مظلومة (سيبونـــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــا بحالنــــــــــ ـــــ ـــــــــــــــ ــــا )حلو عنا يا<br />دايما الانتقادات عن فئتنا حرااااااااااااا اااااااام عليكوا ارحمونا كل شي احنا السبب وفرولنا متطلباتنا ما بنعمول شي غلط بس للاسف وينوا الي بدو يوفر متطلباتنا وينوووووووووووو وووووووو؟؟؟؟؟؟؟ …سوري لانو الي بدو يقرا تعليقي راح يقول اني معصبة بس ليش الكزب انا ما شي بكل هالدنيا بعصبني غير انو كل شي بنعملوا منشان وكرمال ما نرفه عن حالنا بتحكوا عنا شواذ…وعلى فكرة في رقصة يونانية اسمها باستا انا كتير بحب ارقصها واكيد الكل بعرفها …هي رقصة لتفريغ الهموم …اول شي بتكون هادية وكل شوي بتسرع وبتسرع عليها حركاتنا وبالاخر بقوموا اليونان بت[ *** ]ير الصحون …بس طبعا احنا ما بن[ *** ]ر فيها لانو نحنا رااااااااااااكز ين حتى لو قمنا بهيك رقصات وانا من مشجعين الرقص الغربي…وعلى فكرة انا وكل عيلتي بنموووووووووووو وووووووت بالراب وما في حد بغلبنا بهاد النوع ابدا مهما حاول حد ي[ *** ]ر معنا …وهاد شي ممتع بالع[ *** ] مو شاااااااااااااا ااااااااااااااا اذ …(اتأسفول نا على هي الكلمة)لانو الشواذ هم فقط الفئة الي ما بتحترم الاذاء كرمال تفيع …وخاصة شباب الي بستنوا البنات على بواب المدارس…ما بتفرق معهوم المهم يعجبونا نحنا البنات مع انو نحنا البنات بنستحقر كل واحد ما بحترم الاذان وكل واحد بيجي بوقف عند المدرسة …<br />مع تحياتي:سنفورة بس كتير امورة."
