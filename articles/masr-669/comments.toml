[[comments]]
order = 0
subject = "الى متى"
author = "ايمن المصرى"
posted = "2006-07-19"
text = "الى متى ينظر الينا كتاب الصحف القومية هذة النظرة البلهاء. الى متى يستخون بعقول القراء . هل هم يستخفون ام متخلفون عقليا. ان اصغر انسان الان فى مصر اصبح يعرف و متاكد من مكانة بلدة التى لا تستطيع حتى قول كلمة الحق . كما انة متاكد من نظامة و حكومتة التى باعت كل شئ حتى الشرف و الكرامة المصرية الغالية . اقول لكتاب الصحف القومية لا تبيعوا ضمائركم و شرفكم من كلام يعرف كل الناس انة باطل و لا اساس لة الا فى خيالكم."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720142127/http://masr.20at.com:80/article.php?sid=669"

[[comments]]
order = 1
subject = "مبارك يسابق الزمن"
author = "عباس الابيض"
posted = "2006-07-19"
text = "هاهاهاهاهاها مش قادر أمسك نفسى من الضحك لأنى بتخيل الصورة بتاعة المانشيت ده \"مبارك يسابق الزمن\" بتخيل حسنى مبارك لابس شورت و عمل يجرى جوه غرفته و كل شوية يبص فى الساعة و يشوف إذا كان الزمن سابق و لا هو اللى سبق الزمن اهاهاهاهاهاهاها .... كفاية بقى يا صحفيين يا هبل إنتوا صحيح لسه فاكرين حد بيصدق الوساخة دى؟؟؟"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720142127/http://masr.20at.com:80/article.php?sid=669"

[[comments]]
order = 2
subject = "اقول ايه"
author = "خارج نطاق الخدمة"
posted = "2006-07-19"
text = "يا جماعة انتوا ما فهمتوش الجمهورية صح...<br />كل ما في الموضوع انها بتغطي الأحداث الجارية في عالم آخر مواز لعالمنا."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720142127/http://masr.20at.com:80/article.php?sid=669"

[[comments]]
order = 3
subject = "عايز اسئل سؤال"
author = "برعى"
posted = "2006-07-19"
text = "نفسى اسئل سؤال وحد يجاوب علية<br />الناس دى عبيطة ولا بيسطعبطوا ولا شكلهم كدة<br />لما مبارك بطل<br />وعلاء شاب مكافح<br />والشازلى نزية<br />والشرظة فى خدمة الشعب<br />والحكومة ناجحة<br />لازم يكون<br />حسن نصر اللة مغامر<br />وحماس ولاد كلب<br />والشعوب مبتفهمش<br />يا خونة حد يجوبنى دول عبايط ولا هبل ولا جنسهم اية؟"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720142127/http://masr.20at.com:80/article.php?sid=669"

[[comments]]
order = 4
subject = "تعليق رائع"
author = "مصراوى"
posted = "2006-07-19"
text = "بجد التعليق بتاع الاخ عباس الابيض يموت من الضحك مع اني بختلف معاه في بعض التعليقات الاخري, لانه خلانانتخيل مبارك لابس الشورط وبيجري في غرفته لان ده اخره, وربنا يسترها عليكي يا مصر, انا في ايران محدش عايز حاجة من هنا بلد كل البنات اللي فيها زي القمر."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720142127/http://masr.20at.com:80/article.php?sid=669"

[[comments]]
order = 5
subject = "سبق الزمن وخرج من الناحية التانية"
author = "لا للتوريث"
posted = "2006-07-19"
text = "الريس يعمل أيه يقطع نفسه يعني عشان خاطر حاجة لا تتستاهل أهو ياعيني سبق الزمن لحد ما خرمه وعدا منه يعني بقى خارج الزمن وخارج الخدمة وخارج من الرجولة وخارج ... وخارج ... وخارج والله يخرب بيوتكم يا صحافة العار"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720142127/http://masr.20at.com:80/article.php?sid=669"

[[comments]]
order = 6
subject = "أجدع مصراوى"
author = "عباس الأبيض"
posted = "2006-07-19"
text = "ألف شكر أخى مصراوى على تعليقك و أرجو الا يفسد الاختلاف فى الرأى أى ود بيننا علشان إحنا كلنا فى الهم سوا ... و ما قولتلكش نتيجة سباق الريس مع الزمن .. إتضح إن الساعة اللى بيبص فيها كل شوية طلعت بترجع لورا و كان مشتريهاله بوش فى عيد ميلاده"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720142127/http://masr.20at.com:80/article.php?sid=669"

[[comments]]
order = 7
subject = "مبارك وساعة الزمن"
author = "مصراوي"
posted = "2006-07-19"
text = "بالنسبة لساعة مبارك اعتقد انها ساعة الزمن اللي بتأخر 1000000 سنة, أكيد يا أخ عباس الأبيض هو فاكر ان المصريين في العصور الحجرية يعني عمرنا ما هنتقدم, يارب استرها علي مصر, وتتقدم ساعة مبارك علشان يحس ان احنا في القرن 21 مش وفي اكتشاف جديد اسمه الديمقراطية مع انه اكيد هيشعر يالغرابة لهذا المصطلح الغريب علي انظمة تعيش في عصر ما قبل الحضارات."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720142127/http://masr.20at.com:80/article.php?sid=669"
