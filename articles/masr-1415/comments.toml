[[comments]]
order = 7
subject = "تنكر الثعلب"
author = "ايمن امام"
posted = "2007-01-11"
text = "ياحمدوف/ بيت شعر قديم فاكر مضمونه بيقول/ تنكر الثعلب يوما فى ثياب الواعظين ومشى فى المصرى يهدى ويسب المرتشين- ماانتو كلكم منكم فيكم ايه الحكايه هانى سرور دم ملوث فتحى سرور تشريع ملوث- عباره قطار طياره - هرمونات- مليارات اتسفت بطاله فساد دعاره سياسيه- خصخصه لغايه لما الواحد بقى خايف يصحى الصبح يلاقى الشارع اللى ساكن فيه اتخصخص ويدفعونا رسم مرور- لكن برضه ياحمدوف لم تجب على كل نداءاتى لك<br />مارأيك فى حجاب الراهبات<br />مارأيك فى المحرقه اليهوديه<br />منتظر ردك ان شاالله بعد ماتطلع معاش-<br />على فكره صديق عمرى سألنى هوا عنوان المحفل الماسونى فى مصر فين قلت له انتظر لما اسأل واحد مثقف- الا ياحمدوف ماتعرفش ايه عنوان المحفل الماسونى فى مصر/ ايمن امام"
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111072102/http://masr.20at.com:80/article.php?sid=1415"

[[comments]]
order = 8
subject = "حمدى شرف المهنة"
author = "زكى الدبور"
posted = "2007-01-12"
text = "إذا كان حمدي رزق بهذة الشجاعة و الجراءة فأتمنى أن يخبرنا سي حمدي( شرف المهنة) ، عن سر صمتة وخرسة و طرشة وعماة ،على الحقائق التالية والتي كان حمدي كالشيطان الأخرس وهى تتم أمام عينية ،وبمباركة منة :<br />1 – لماذا صمتك على بقاء مكرم محمد احمد كاتما على أنفاس اعرق صحيفة مصرية طوال 20 عاما ،بالمخالفة للقانون ، حتى حولها لمجلة ( الحلاقين)؟<br />2- لماذا ذهب إلى مباحث امن الدولة فجرا قبل شهرين بمسودة طبعة روايات الهلال من رواية نجيب محفوظ (أولاد حارتنا) ليحذر من ان مجدي الدقاق رئيس تحرير مجلة الهلال سوف يصدرها بعد ساعات ؟ ولماذا كان مكرم محمد احمد طرف فى هذة اللعبة الحقيرة بتحديد موعد لكلبة حمدي مع امن الدولة؟<br />3- لماذا صمتك ياحمدى على تجارة الاراضى والعقارات وأعمال المقاولات التي كانت ولا تزال تقوم بها المحررة صفاء لويس احد شركاء محمد إبراهيم سليمان في كل جرائمة؟<br />4- لم تتكلم و تعترض و غالى محمد الصحفي بالمصور يقود اكبر عملية ابتزاز اعلانى لشركات قطاع الأعمال بعلاقتة بأحمد عبد الرحمن رئيس هيئة الرقابة الإدارية الأسبق طوال سنوات التسعينيات حتى أصبح غالى مليونير من الحرام ؟ ولماذا تواصل الصمت على ما يقوم بة غالى حتى الآن من توظيف خريجين بقطاع البترول مقابل 50 ألف جنيها وأمام الجميع في دار الهلال؟<br />5- سر حقدك وكرهك لمحمود سعد ، وغيرتك الوقحة من نجاحة؟<br />6- لماذا استغنوا عن خدماتك فى( برنامج البيت بيتك) ؟ ولماذا قدت وتقود حتى الآن مهاجمة البرنامج باسم مستتر فى الصحف الصفراء؟<br />7- هل يعلم يوسف القعيد انك مدبر ومخرج عملية الإطاحة بة من دار الهلال بعد ان قدمت لمكرم محمد احمد تسجيل قمت بة ليوسف في جلسة خاصة يقول فية( كذبا طبعا) أن القيادة السياسية تدرس ترشيحة لرئاسة مجلس إ<br />اقرأ بقية التعليق .."
archived = "2007-01-16"
capture_url = "https://web.archive.org/web/20070116105042/http://masr.20at.com:80/article.php?sid=1415"
