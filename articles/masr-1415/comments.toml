[[comments]]
order = 5
subject = "الا مصباح قطب"
author = "توفيق علي"
posted = "2007-01-10"
text = "لا ادري لماذا في هذا الموقع بالذات اشاهد تعليقات مدمرة، وكأن الذين يتابعونه يعانون من عدد لا بأس به من الامراض النفسية. اعلم ولا شك ان هناك في بلاد صاحبة الجلالة من هم علي استعداد لان يبيعوا امهاتهم في سوق النخاسة. لكن ان يصل الهجوم علي الزميل الفاضل مصباح قطب بهذا الشكل فهو من القلة التي تمسك علي جمر الشرف والكرامة، انه قديس يعمل في الصحافة، فاتقوا الله واعلموا ان الكلمة مسؤولية"
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111072102/http://masr.20at.com:80/article.php?sid=1415"

