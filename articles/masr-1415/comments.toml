[[comments]]
order = 3
subject = "هى دى الصحافة ياهانى"
author = "صحفى يسارى مرتشى بيتوب"
posted = "2007-01-09"
text = "كان اللة فى عون هانى سرور من حيتان الصحافة ، وانصحة يرمى لهم حاجة يمصمصوا فيها ، خاصة وانة مابيدفعش من فترة، للدرجة ان حتى حمدى رزق عايز ومش مكفية الى هبشوة مع عصابة دار الهلال الكام سنة الى فاتوا، ولم يكفية فلوس صلاح دياب و فلوس \"هوفية اية\" ، واية كمان ياعم شرف المهنة.<br />اللة يخرب بيوتكم دمرتم الصحافة وحولتها لدعارة وابتزاز عينى عينك ، دا حتى شيخ الثورجية مصباح قطب الى قرفن اشتراكية و ماركسية بيشارك فى اللعب القذرة دى .<br />ادفع بالتى هى احسن ياعم هانى ، قرشين وخليك زى غبور الى بيدفع فى وقتها ."
archived = "2007-01-11"
capture_url = "https://web.archive.org/web/20070111072102/http://masr.20at.com:80/article.php?sid=1415"

