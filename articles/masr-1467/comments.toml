subject = "التكية وقهوة العواطلية"
author = "3agab"
posted = "2007-01-18"
text = "بسم الله الرحمن الرحيم<br />التكية وقهوة العواطلية<br />الحلقة الاولي<br />بقلم / اسامه قراعه<br />الحكاية دي حكاية اي اهل تكية تسيب مصيرها بدون متابعة او رقابة لاي حد يدير شئونها وهي لاغية عقولها حتي لو كانت تكية في المدينة الفاضلة سهل جدا تحويلها الي تكية في مدينة الذئاب فقط نشيل منها الحق والعدل ونغير اهداف السيطرة والرقابة والتعليم ... حاولت من خلال هذه القصة توضيح العلاقة بين الحاكم والمحكوم واولي العلم وحاشية السلطان وبعض الاعيب الخداع السياسي واستغلال حسن النوايا وطيبة النفوس وكذا اظهار قدرات كل منهم في تحقيق اهدافه بحسب قوته وسلطانه. والحكاية دي حكاية كل اسرة وكل مؤسسة وكل قرية وكل دولة وفي نظري حكاية العالم ككل عبارة عن تكية<br />ولا عجب ايها القارئ الكريم ان وجدت اي اسرة او مؤسسة او نظام او مجتمع محلي كان او دولي ولاحظت فيه غياب الحق والعدل والكيل في القضاء بمكيالين ونصرة القوي والغني علي الضعيف والفقير او لاحظت طول مدة انتظار اصحاب الحقوق امام القضاء والمحاكم المحلية والدولية علي امل رد حقوقهم وتعمد القضاة تأجيل الحكم طوعا او كرها وتفصيل الاحكام والقوانين والحجج والبراهين وفق لاراء القوة العظمي بها لا عجب ان تكون تلك صورة اخري من صور التكية وما يحدث فيها لا يختلف كثيرا عن ما يحدث في هذه التكية.<br />لا عجب ان وجدت قتلي بلا نصير او صريخ بلا مجيب او جائع في سوق الخبز او اطفال شوارع وواحد واقف يقول اقتلوهم دول وباء معدي مميت دول مش مننا ولا ابنأنا واهلنا. وهم يعيني محدش رماهم علي الرصيف الا الراجل الي واقف يقول اقتلوهم وبرده محدش فاهم علشان يقول انصروهم لاعجب ان تكون هي دي التكية<br />ومن هنا نبدا الحكاية<br />كان ياما كان كان فية زمان مش دلوقت, تكية, ويارب تكونوا عارفين يعني ايه تكية و<br />اقرأ بقية التعليق .."
