[[comments]]
order = 2
subject = "لا للفقر..لاللبطالة..لا لقانون الوظيفة العامة الجديد"
author = "بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-01-20"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو السيلة الوحيدة للتوظيف<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />من الاخر ياناس ده قانون ظالم وسيهدم اركان المجتمع الذي يقوم علي الاستقرار الي مجتمع يقوم علي التعاقد المؤقت ثم الي الشارع انت واسرتك ايه الموظف المسكين."
archived = "2007-01-21"
capture_url = "https://web.archive.org/web/20070121190622/http://masr.20at.com:80/article.php?sid=1467"

[[comments]]
order = 3
subject = "التكية وقهوة العواطلية"
author = "el3agab@hotmail.com"
posted = "2007-01-20"
text = "اقدم الاعتزار لكل واحد مش مستظرف الحكاية او اي حد فاهم الحكاية غلط لان المقصود منها هو توضيح حالة اي مجتمع وماذا يحدث لو تعطل فيه الحق والعدل وفشلت العملية التعليمية والتنشيئةالاجتماعية في تحقيق اهدافهاسواء بوعي او دون وعي.<br />ولسه برده هنكمل حكاية التكية ... ‏<br />احنا قلنا المره الي فاتت ان الحراميه قدروا يسيطروا علي خادم التكيه وقلنا ازاي ‏الحرامي الصغير ابليس قدر يخلي باقي الحراميه يفسدوا اهل التكيه بعد ما اشتروا ‏فتوات التكيه وضحكوا عليهم وفهموهم انهم بيصلحوا التكيه .. وقلنا ان الفتوات لما بطلوا ‏يحموا الحق ويحافظوا علي حقوق اهل التكيه ويعملوهم بانسانية... ضاع الحق واصبح مالوش صاحب ... ‏وحنا طبعا عارفين ان لما ما يبقاش فيه حق بين الناس بيزيد الخلاف والصراع والطمع ‏بينهم وتزيد الفرقه بينهم والفرقه اساس الضعف .. هي دي طبيعة الانسان مافيش حد ‏حيقدر يغيرها .. واي اتنين تلاته يجتمعوا لازم يكون بينهم حق ومستحق .. وكل ‏الحضارات العظيمة الي فاتت قامت في بدايتها وطول ما هي محتفظه بقوتها علي الحق ‏‏... وكلها برده لما ضاع منها الحق ضعفت وانتهت . المهم خلاص وصلنا في التكيه ان ‏الحق فيها ضاع وزاد الصراع ... والشكوي زادت لجناب القاضي وبدل ما كان بيحكم ‏كل اسبوع في خناقه او سرقه بقي كل يوم يحكم في مئة خناقه وييجي ميتين سرقه ‏وحكمه الي بينفذه مين ؟؟؟ ها مين ‏<br />شمشون ورجالته عساكر الدرك... وشمشون اصله حرامي ومتوصي من ابليس انه ينفذ ‏حكم ويطنش علي تلاتين حكم .‏<br />وصاحبنا الي كان مستني في طابور القاضي من سنتين علشان ياخد حكم علي خصمه ‏الي نهب حقه ... بعد ما اخذ الحكم حظه طلع من الثلاثين الي شمشون حيطنش عليهم ‏‏...وبرده ضاع حقه ... لكن كده ابليس بذكاءه عطل كمان العدل.‏<br />والقاضي بشر له طاقه وقدره<br />اقرأ بقية التعليق .."
archived = "2007-01-21"
