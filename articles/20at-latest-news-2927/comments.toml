author = "الشيخ تامر"
posted = "2007-02-09"
text = "ايه اللى بيحصل ده هو الكون موازينه اتشقلبت<br />الحريم يحكم البلاد ويمسك مناصب رئاسيه ووزاريه ومش عيب ان البنت تشتغل والراجل عاطل قاعد عالقهوه بيلعب دومينو وطاوله ومش لاقى شغل بسبب ان فرص العمل مشغوله بالنسوان<br />والجديد ان المره وقت ما تحب تطلق جوزها او تخلعه بكل سهوله سبحان الله انا عمرى ماسمعت عن واحده خلعت جوزها قبل كده على ايام النبى لحد وقتنا هذا غير مره واحده ومحصلتش تانى وكانت اصلا منافقه بنت منافق اسمه عبدالله ابن ابى بن سلول الذى كان يظهر الاسلام ويبطن الكفر والذى اشعل الفتنه فى ديار المسلمين<br />عالعموم دى حاجه مش جديده فى الحريم هما كده بيكلو وينكرو زى القطط واسمعوا هذا الحديث عن انبى صلى الله عليه وسلم قال يا معشر النساء اكثرن من الصدقات والاستغفار فانى راءيتكن اكثر اهل النار تكثرن اللعن وتكفرن العشير<br />على فكره اليهود والنصارى نجحو فى تشكيل عقليه النساء على كيفهم عارفين ليه<br />لانهم عايزين المرءه مشغوله فى ميدان العمل وكذلك الرجل فلا يوجد وقت لتربية الاولاد تربيه دينيه ذات دين وعقيده صحيحه وانا ينشاء الاولاد فى ظل ظروف فاشله وتلاهى فياءخذ عنصر تربوى خاطئ من خلال التلفاز او الشارع وليس من خلال بيت مسلم وبالتالى لا يقدم هذا الشاب اى شىء لبلده او موطنه او اسرته لانه تلقى تربيه فاشله وهذا ما يريده الغرب من المسلمين دين عالورق بلا عقيده بلا وحده<br />اما النساء التافهين فرحين بهذه التفاهات والسخافات والترهات التى يسمونها حريه المرءه ونعم لعمل المرءه حيث انهم لا يعرفون ان الدين الاسلامى يعطى المرءه العز كل العز ويحافظ على مكانتها اكثر من اى عقيده اخرى ولكنهم ناقصات عقل ودين"
archived = "2010-02-11"
