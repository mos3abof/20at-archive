[[comments]]
order = 1
subject = "مدح لثرات عظيم"
author = "رهام سالم من مصر"
posted = "2006-07-26"
text = "الى جانب الثرات الفرعوني العريق الجميل الدي ابدع فيه المصريون القدامى بكدهم وجهدهم والدي نفتخر به سواء نحن المصرين او العرب نجد ان في المغرب ثرات اسلامي رائع جدا بناه اعظم اناس بفن اسلامي عريق يفخر به كل المسلمين فانا راي ان الثراث المغربي ياتي في المرتبة الثانية طبعا بعد ثرات بلادي فهو يحي دكرى البناء الاسلامي وهدا رائع وشكرا على هدا المقال الجميل يا اخت ليلى امزير وامل ان تفيدينا بكزا معلومات عن ثرات بلاد المغرب وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133139/http://www.20at.com/article2.php?sid=707"

[[comments]]
order = 2
subject = "مغربية"
author = "فاطمة الزهراء"
posted = "2006-08-12"
text = "فاس<br />وهي أقدم مدينة إدارية في المغرب أسست بعد وفاة النبي ( صلى الله عليه وسلم ) بفترة قصيرة مبانيها الفخمة تعكس نبوغ العرب والبربر مدينة العمارة المدينة فاس القديمة هي أكبر مدينة في العالم محاطة بالا سوار والبوابات القديمة في داخلها متاهة من الشوارع الضيقة تؤدي إلى أسواق مغطاة محتشدة بورش الحرفيين والمدابغ والمطاعم والجوامع لا يفوتك زيارة اكبر مسجد في المغرب جامع القرويين وهو من اقدم الجوامع في العالم ويضم مكتبة من احسن المكاتب الإسلامية قم بزيارة فاس الجديدة ثاني مدينة مسورة بقصرها الملكي المجدد إنشاؤه بإبداع تجول في فوليوبيليس المدينة الرومانية الأثرية ثم مدينة مولاي إدريس. شاهد جميع المدن الملكية في المغرب في رحلة 8 أيام لزيارة المدن الملكية المبينة في الصفحة القادمة . عند زيارتكم لبلدنا لا تنسو تذوق أطباقنا شهية والمغربية شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133139/http://www.20at.com/article2.php?sid=707"
