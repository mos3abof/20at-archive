subject = "غش طبعا!!"
author = "ابن ناصر"
posted = "2007-02-17"
text = "انا شايف ان ده غش طبعا ونفسي اعرف مين اللي ورا الست دي بتقوول حاجات غريبه ودلوقتي بقي الواحد يفتح أي قناه يلاقي مليون فتوي هو فيه ايه يعني ده كفايه فتاوي المفتي بتاعنا احن ناقصين كمان !! ااه وبالنسبه للأخ اللي قاعد يشتم ده ليه الواحد مايتحاورش بأخلاق وبأدب الناس ايه اللي حصل لها ,, وأحب انبهك لحاجه يا ابن بهيه في واحد بيشتمك في كل حته وبيطلع كل مره في المنتدي تلاقييه واحد من جواسيس الحكومه أكييد...<br />http://ibnasser.blogspot.com"
