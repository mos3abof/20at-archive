[[comments]]
order = 1
subject = "اللي احسن من كده"
author = "ان الدولة تطلع قانون يجيز بعدم اهمية هذا الغشاء وان من حق الفتاة ان تتخلص منه وعلى كل شاب الا يهتم بهذا الغشاء اطلاقا سواء كان موجود او غير موجود"
posted = "2007-02-15"
text = "لان الاغنية بتقول<br />وزارات ورا وزارت هتعيش على حلمنا<br />و اللي بيجى يادوب مظبوط على قدنا<br />جايز هيجي اليوم والشبكة تيجى إنما<br />تفضل فلوس الشقة ودة شيء بعيد عننا<br />جايز هيجي اليوم والشقة تيجى إنما<br />هتكون سنانك وقعت قربت على 100 سنه"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073623/http://masr.20at.com:80/article.php?sid=1594"

[[comments]]
order = 2
subject = "الله يخرب بيوتكوا يا علماء اخر الزمن"
author = "مرارة مفقوعه"
posted = "2007-02-15"
text = "انا هتجوز واحده شريفه وتلاته مرقعات عشان الواحد يعرف يطلع من وراهم حاجه<br />يعنى هيه مش محتاجه نباهه اللى كان مخوف البنت<br />عن انها تغلط وتمسك نفسها راح<br />ماعدشى فيه حاجه تخلى البنت تحافظ على نفسها خلاص راح..كله راح<br />داه مش كده وبس داه كمان كان رادع لمعظم الشباب انه يقع فى الغلط ويجر معاه واحده للوحل لأنهم مش هيطلعوا منهم<br />الشباب ذنبه ايه<br />انا ذنبى ايه اللى رافض المس اى واحدة لحد ماربنا يأن بالزواج<br />معنى كده انى اروح ادور على واحده وازنى بها ومافيش خوف هيه هتكلفنى كان يعنى<br />ما خلاص بقت ولاعه<br />الله يحرب بيت الولاعات على الطفايات على البطاريات<br />فين ايامك يا عود الكبريت<br />كان بيفرقع فى الوش بس كان ارحم<br />وفى كل الاحوال بيولع مره واحده"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073623/http://masr.20at.com:80/article.php?sid=1594"

[[comments]]
order = 3
subject = "أن يتساوى الرجل والمرأة في الفضيلة خير من أن يتساويا في الخداع"
author = "إبن بهيه"
posted = "2007-02-15"
text = "في اختلاف العلماء والفقهاء رحمة للعباد .. حكمة قديمة متجددة تعطي الحق لكل أن يأخذ برأي أي النقيضين وهو مسلم أمره لله وعلى ذمة من أفتى ، وكما يقال أيضاً ضعها في رقبة عالم واخرج سالم<br />يعني حطها في رقبة عالم واطلع من المشكله سالم<br />لكن من العالم ؟ هذا أمر مهم جداً وستسألون عنه ، فللعالم مواصفات يجب أن تتوافر لديه حتى نأخذ عنه الفتوى ، وأهم تلك المواصفات التقوى والورع وسعة العلم وفي رأيي أنا شخصيا (من بنات أفكاري أنا) لابد ألا يكون عضواً في أي نادي للروتاري أو الليونز الماسونية أو أية جمعية ماسونية مشبوهه تحت أي مسمى خداع من مسميات الأنسنة والرفق والطبطبة الناعمه دي لأنه لو عضو في أي منها سيكون رأيه مغررا ومخالفا لأسباب ماسونية معرفوة... طبعا اليومين دول يضاف إلى المحافل الماسونية في مصر (الليونز والروتاري) بعض الجهات الحكومية وبعض الحكام.<br />فهل الدكتورة سعاد عضو في أي من هذه النوادي والجمعيات الماسونية ؟ هنا تفرق كتير ..<br />كمان فين قلبك ؟ استفت قلبك .<br />بصراحة لقد استفتيته ووجدت أنني لا أرى رأي الدكتورة سعاد مطلقا لأن عقد الزواج مقدس ويجب ألا يبنى على الغش والخديعة وخصوصا بهذه الطريقة الرخيصة لأن الزوج المغشوش في هذه الحالة سيظلم ظلما شنيعا بسبب زواجه من ثيب وغشاشة ، فلا أعتقد أنها ستكون بداية لزواج صالح لأنه بدأ بخديعة كبرى يمكن أن تستمر فيما بعد بصور أخرى للخداع في رأيي الشخصي .<br />إذن من الأفضل في رأيي أن تكون هناك مصارحة والأفضل منها ألا يكون هناك أي خطأ منذ البداية ، ولا يعني هذا أننا نبيح ذات الخطأ للرجل ، كلاهما خطأ ورزيلة للرجل والمرأة على حد سواء والجديد في الأمر أن دعاة حرحرة المرأة يريدون أن تتساوى مع الرجل في الخداع ، وأرى أن يتساووا في الفضيلة بدلا من التساوي في ا<br />اقرأ بقية التعليق .."
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073623/http://masr.20at.com:80/article.php?sid=1594"

[[comments]]
order = 4
subject = "حرام عليكم"
author = "موللي"
posted = "2007-02-15"
text = "اولا اتقوا الله السيده سعادصالح لمتصدر فتوى باباحه الزنا ديه بتنصح بستر عرض بنت اغتصبت رغم ارادتها وعايزه تتوب وعايزه تفتح بيت .انما البنات اللي يستغلوا الفتوي علشان يغلطوا وبعدين يصلحوا الغلط بالفتوى ديه فاتعتقدوا يعني انهم منتظرين فتوى والا البنت الخاطئه ديه بيفرق معاها توبه اتقوا الله وعموما كل واحد ونيته العمليات ديه بتتعمل كل يوم لاسباب مختلفه وربنا بس هو اللي عالم بالنوايا اتقوا الله وروحو هاجموا اللي بيغتصبوا الفتايات ما تغتصبوش حقهم ف الجواز والستر والتوبه"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073623/http://masr.20at.com:80/article.php?sid=1594"

[[comments]]
order = 5
subject = "وهى سيدة فاضلة"
author = "بنت مصرية"
posted = "2007-02-15"
text = "هى سيدة عالمة وفاضلة ومتخصصة فى فقة النساء<br />والبنات فى مصر والسيدات اولاد اسر وسواء كانت اسر فقيرة او غنية فالمصريون يضعون الشرف فى مرتبة اغلى من الحياة نفسها<br />بنات مصر وسيداتها من اشرف البنات والسيدات من اى دولة اخرى<br />ولكن قليلات جدا ولا يذكرن ولكل قاعدة شواذ كما لكل مجتمع زبالة يوجد بعض السيدات والبنات الزبالة المنحرفات<br />وبما ان باب الرحمة موجود فلماذا نغلق باب رحمة اللة<br />الا تتزوج السيدة المطلقة والارملة وهى بالطبع ليست بنتا عذراء<br />الشرع الحكيم يعالج بالرحمة وليس باقفال ابواب الرحمة والغفران لكل نفس زلت وحادت عن طريق الصواب<br />بنات مصر وسيدات مصر بخير والعينات السيئة التى يظهرها الاعلام المضلل بغرض الاثارة وجذب الناس هو بسوء نية مخططة<br />الدكتورة تريد ان تقول احيانا يكون الستر مطلوب"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073623/http://masr.20at.com:80/article.php?sid=1594"

[[comments]]
order = 6
subject = "شرف البنت زى عود الكبريت"
author = "واحد من الناس"
posted = "2007-02-16"
text = "زمان ايام الشرف والاخلاق مش الايام دى كنا بنسمع ان شرف البنت زى عود الكبريت واضح انه بسبب العولمة وكانوع من التجديد والتكنولوجيا انهم لغوا الكبريت وبقا الاستعمال بالولاعة وده عشان منبقاش عالم تالت متخلف بنستعمل كبريت.ومن هنا ورايح لازم خلى شرف البنت زى الولاعة وفقا لاحدث التقنيات العالمية"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073623/http://masr.20at.com:80/article.php?sid=1594"

[[comments]]
order = 7
subject = "ياجماعة"
author = "احنا عندنا كام بنت بالحالة دى"
posted = "2007-02-16"
text = "خلاص بناتنا كلها فجرت<br />المشكلة بقت قومية بلاش مبالغة فى موضوع هايف جدا يخص بنات وقلة معدودة جدا<br />وبعدين بناتنا فى المدارس والجامعات والبيوت لهم اسر وهم اخوتنا واحنا عارفين اخوتنا شكلهم اية<br />لا تنشغلوا فى امور هايفة لا تودى ولا تجيب"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073623/http://masr.20at.com:80/article.php?sid=1594"

[[comments]]
order = 8
subject = "المو ضوع وما فية"
author = "فهد الا سلام"
posted = "2007-02-17"
text = "المو ضوع يا جماعة وما فية ان احنا وصلنا لمر حلة خطيرة من الا نحلال الا خلاقى يعنى اية لم بنت تعمل عمليت تر قيع هى كدة بتخون الا مانة بس لا دى بتخوان الشخصى الى مرتبط بيها وبتخون ابوها وامها وناسه وقبل كل دة بتخون ربنا سبحانة وتعالى مثل هذة الفتوى بتحلال الزنا طيب البنت كدة مفيش مشكلة اعمل الى انا عاوزة ولما يجى الدغف اسف فى الفظ يبقى اعمل العملية يا ناس اتقو الله فى بنات الا سلام الاختلا ط حرام شرعا واحنا مش احسن من سيدنا النبى الى قال انى الا ختلا ط حرام ومع ذلك بنات الا سلام بخير والى بتتكلم عنهم سعاد صالح هم فية قلية ولكن بنات خديجة وعا يشة وفا طمة وامهات المو منين بخير سال رسول الله صلى الله علية وسلم متى تقوم الساعة قال اذا وسد الا مر لغير اهلة فسعاد دى غير اهلة حتى لو معاه الف دكتورة ربنا يهدى وبعد كدة هى عضو المجلس القومى للمراة يعنى تبع ماما سوزان مش عوزة تعليق"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073623/http://masr.20at.com:80/article.php?sid=1594"

[[comments]]
