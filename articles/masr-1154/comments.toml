text = "انا حر يااخي انت مالك انت<br />وبعدين صفيحة زباله ايه مش عيب تسرق ابداعات غيرك الادبيه... عو عشان الواد مش مهم شتمك تلقط منه اسلوبه وتتكلم بيه<br />طيب نقي حاجه كويسه واسرقها<br />يارب الاهلي ما يكسب بطوله تانيه ابدا في حياته<br />وان شاء الله فريق بلدنا نادي فاقوس الرياضي ياخد الدوري والكاس"
