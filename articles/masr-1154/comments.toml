subject = "قولولو الحقيقة"
author = "يوسف محمد يوسف"
posted = "2006-11-19"
text = "ياجماع قولو الحقيقة وهو اجمل مباراة لعبت بين الاهلي والاسماعيلي 4-4 وكان جوزية مدرب الاهلي ثانيا جوزية علم لاعيبة الاهلي انهم يلعبو خارج الملعب زي الداخل واسئلو الترجي وعلمهم لايوجد لاعب كبير ولاصغير الابالاحترام واسئلو ابراهيم سعيد وافتكرو ان بطولة افريقيا كان مستوي لاعيبة الاهلي رائع واخيرا ياجماعة ريال مدريد يضم اعظم لاعبين في العالم ومع ذلك لايظهر بالمستوي الجيد"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015152/http://masr.20at.com:80/article.php?sid=1154"

[[comments]]
order = 16
subject = "انتوا متغزين من الاهلى عشان كلكم زملاكوين"
author = "اهلاويه طحن"
posted = "2006-11-22"
text = "اسكتوا يازملاكوين انتوا اكيد متغزين ان الاهلى عمال بيكسب وياخدبطولات وانتوا قاعدين عشان هوبدا يغطى على الزمالك بطلوا بقى الحقد الى عندكوه ده وايه بقى الى مضايقكم فى مانول ماالرجل زى الفل اه وبعدين هو المحرك للفريق اهينعم الفريق تمام وعشره على عشره وملوش حل بس لازم حد يوجه ويقوله ده يروح فين وده يجى منين بطلوا بقى الحجج دى ولا انتوا معتوش لقين اى حاجه على الاهلاويه خلاص هطلعوها على الراجل السكره ده"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015152/http://masr.20at.com:80/article.php?sid=1154"

[[comments]]
order = 17
subject = "الاهلى"
author = "فتح الله"
posted = "2006-11-22"
text = "حقيقى ياجدعان اللى مش عاجبه الموضوع ما يسكت بيعلق ليه؟ سبحان الله ، اللى مش عارف كاره الدنيا و اللى فيها واللى دماغه مفيهاش الا الجواز واللى و اللى ... ربنا يهدى<br />وبعدين تشجيع الكوره ده فى الدنيا كلها من اول السعوديه و ايران الى امريكا و الصين ، جت لحد عندنا وحرمت.<br />ثانيا معروف ان فاروق جعفر حقود لانه لا يحقق نتائج جيده عامه فى معظم ما درب من فرق و خاصه من ساعه ما طردوه من تدريب المنتخب فما يصدق يلاقى مدرب حقق نجاح الا و ينزل عليه بالشتيمه بدايه من الجوهرى مرورا بمحسن صالح و حسن شحاته واهو ختمها بجوزيه وفى الغالب بكره الدور على طه بصرى لانه بدا يحقق نتائج ملحوظه فممكن ينوبه من الحب جانب ، ارى ان لا مصداقيه لهذا الرجل."
archived = "2006-11-27"
