subject = "ياللى انت مش مهم"
author = "فارس_fr"
posted = "2006-11-14"
text = "تكون مش مهم تكون مستعجل تكون زملكاوى تكون من امن الدولة حتى !!! هو يعنى لازم المواضيع كلها تكون عن مبارك وعن السياسة عشان تجمع منهامعلومات للباشا بتاعك وتبقى فرحان لم الناس تشتم فى مبارك وفيك هو ده اللى يعجبك وايه العيب اننا نفرح شوية \"الله يلعن مبارك ويلعنك معاه ويحشرك معاه لانك بتحبه \" تمام كده ؟؟<br />وبعدين لو صفيحة الزبالة اللى جواك مسروقه منك !!! ممكن تقول انها ونعم التعبير عنك وعن اللى زيك !!!!<br />مش لازم كل يوم تكتب تقرير للباشا بتاعك !! سيبنا نفرح يوم<br />صفيحة الزبالة مسروقه .... والله ضحكتنى<br />انت اجبرتني انى اتعامل معاك بالاسلوب ده ؟؟ اصل فيه ناس عامله زى البرص ميسكتش اللا لم ياخد على دماغه @@@@@@@@@@@@@@@@@@@<br />اسف لانى استعرت العمل الفنى الادبي الرائع \"صفيحة الزبالة \" من السيد مش مهم ...<br />لله يازمرى ..."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118123208/http://masr.20at.com:80/article.php?sid=1154"

