[[comments]]
order = 8
subject = "مش مستعجل المره دي"
author = "انا كنت ناوي بعد ماقريت تعليقك ياسي فارس امسح بيك الارض خصوضا وان المسلم لا يكون لعانا.ومفيش حاجه تستاهل ردة الفعل العنيفه دي منك ...لكن مادمت اعتذرت لانك بتخاف من ربنا زي ما بتقول يبقي المسامح كريم"
posted = "2006-11-15"
text = "بس معلش فهمني حكاية الباشا ايه اللي بتتكلم عليها هو انا جبت سيرة باشوات ولا جبت سيرة مبارك ولا قولت انا بحبه ولا بكرهه<br />وحياة ابوك يا شيخ انت جبت الكلام ده منين<br />انت بتضرب بانجو يافارس ولا حاجه .. معلش في السؤال ... والنبي تركز شويه وتبقي تقراي كلام الناس قبل ماتعلق<br />وبعدين انا دوست لك علي طرف انا حر يااخي انا بكره الكوره ... وشايف اللي شاغليين نفسهم بالكوره شوية ناس هايفه ..وفاضييه<br />لكن هو حر زي ماانا حر وبعدين ياسيدي انا علقت علي موضوع صفيحة الزباله الي انت استخدمته لانك زعلت من الراجل اللي كلمك بالاسلوب ده فازاي تستخدم اسلوب انت انتقدت صاحبه<br />لا تنهي عن خلق وتاتي مثله<br />مع تحيات فريق فاقوس الرياضي بطل الدوري والكاس المقبل"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118123208/http://masr.20at.com:80/article.php?sid=1154"

