[[comments]]
order = 3
subject = "خلونا في الأهم ...."
author = "إبن بهية"
posted = "2006-11-13"
text = "قرر وزراء خارجية العرب كسر الحصار عن الشعب الفلسطيني .. ووو .. هكذا صرخ أحد الخرفان أو النعاج المجتمعين في قهوة عمرو موسى بميدان التحرير بالقاهرة يوم أمس .. طيب بعد إيه جاي تمأمأ يا تيس ؟؟؟ طبعاً سيقف الآن من يهاجمني قائلاً بأني كغيري من المصريين لا يعجبنا العجب .. وكان لازم نصفق لسرب النعاج الملمومين في قهوة موسى بالتحرير تعبيراً عن الفرح والانشراح الانشكاح بهذا القرار الشجاع.<br />كان يمكن أن نصفق ونفرح لو أن هذا القرار أتى منذ شهور .. أو حتى اليوم ولكن في وجود حكومة حماس وليس بعد إزالة حكومة حماس كما حدث اليوم برضه وبالتحديد #مش صدفة طبعاً# ، فالموضوع مرتب ومتوافق تماماً من الناحية الزمنية ، يتم التوصل إلى اتفاق بين حماس وعباس الأمريكي على ترك الحكومة وتشكيل حكومة بديلة لمن انتخبهم الشعب ويجتمع وزراء خارجية العرب ليعلنوا قرارهم بكسر الحصار في ذات اليوم الذي أعلن فيه التوصل لاتفاق.<br />طيب ما هو طبيعي لن يكون هناك حصار يا نعاج طالما ذهبت حماس ، لماذا كان الحصار من الأساس ؟ أليس حصاراً فرضه المستعمرون على حكومة حماس تحديداً لأنها لا تقبل ببيع الأرض والعرض؟ فإذا ذهبت حماس انفك الحصار أوتوماتيكياً يا خرفان ومش محتاج الموضوع للبقين الحمضانين اللي طلعتم بيهم دول عشان تعملوا علينا رجاله وتضحكوا على شعوبكم بيهم ، قال إيه كسرنا الحصار ؟؟؟ والنبي الناس دي ما عندهاش دم كده خالص ؟؟؟!!!<br />لا دم ولا حيا ولا عقل كمان ؟؟؟ ما هي مهروشة يا حمير ، لو فعلاً رجالة كنتم كسرتوه من شهر واحد بس ، لكن تقول إيه للنعاج؟؟؟ أنا لو مكان اسماعيل هنية كنت في اليوم التالي أعلن أنني لا أوافق على حكومة وحدة وطنية وسأظل أمثل الشعب الذي انتخبني وبخاصة أن إخواني العرب استفاقوا واستيقظوا ووقفوا بجانبي أخيراً وأعلن<br />اقرأ بقية التعليق .."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118123208/http://masr.20at.com:80/article.php?sid=1154"

