subject = "الهداية من الله _ والحقد والغل من الشيطان"
author = "حودة"
posted = "2006-11-24"
text = "أرسل هذا التعليق بواسطة : محمدين<br />بصوا يارجالة همه كلمتين ملهمش ثالث<br />الأخ مانول جوزية مدرب أقل من العادي وهذا الكلام ليس من زملكاوى ولا حاجة ولكن من متابع للشأن الكروى والدليل على كلام مايلي<br />المانول جوزية فى رحلته الأولى لمصر خرج منها مطرودا من الأهلى ويسأل عن مدى صحة هذا الكلام طارق سليم ويرجع إلى إرشيف قناة المحور للتأكد من ذلك ويرجع لمبارة المقاولون والأهلى فى نهائي كأس مصر<br />المهم والله لو أن عامل غرفة الملابس درب النادى الأهلى حاليا لأخذ به نفس البطولات<br />وبعدين الأخ الكفيف والخبراء الأغبياء أرجو منهم أن يسترجعوا ما إستدبروا من أمرهم لمعرفة إن كانت الكرة التى جاء منها الهدف لم تأتى أو أن الحكم الذى أصيب بالعمى لم يحتسب التسلل الظالم وإحتسب الهدف الصحيح للنادى السفاقصي ماهو حالهم<br />المهم خلاصة الكلام فريق الأهلى فريق سفاح<br />ولد من رحم مجلس عصام عبد المنعم ولد من الزنا والتلاعب بالوائح والقوانين<br />وتساندة ألة إعلامية من المنتفعين وسراق المال العام والمفلسين والخنثاء<br />وهذا ليس من عندى وأحيل جميع القراء الباحثين عن الحقيقة لما نشرتة الصحافة المصرية فى العام الأخير عن رموز الأهلي<br />1- حسن حمدي سرق أموال الأهرام وتربح منها بغير وجه حق<br />2- محمود باجنيد<br />سرق أجهزة طبية من قصر العينى الفرنساوي<br />3- محمود الخطيب<br />لم يكن يحضر لعمله فى الأهرام ووصل راتبه 70000 جنيه شهريا<br />4- أحمد شوبير سرق تى شرتات مصر 2010<br />وسرق تذاكر كأس الأمم وباعها فى السوق السوداء وتربح منها بدون وجه حق<br />5-00000000000000<br />هذه بضعة أمثلة للنادى الحقير يأيها النائمون<br />أخيرا هذه ملاهة كوميدية يا أيها الشعب المسمين لقد باعوا الوطن والمواطن لقد سرق الحاكم اللص كل ماهو غالى ونفيس<br />يا ناس إستيقظوا من نومكم<br />اقرأ بقية التعليق .."
