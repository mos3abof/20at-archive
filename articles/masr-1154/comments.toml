subject = "معلش يا كابتن ياللي فوق..."
author = "تعليق جميل جدا يا سيد يا مستعجل..."
posted = "2006-11-13"
text = "والله معاك حق ...بس الموضوع مش مستاهل انك تحرق دمك كده يا عرب...<br />يا سيدي خلينا نفرح شوية ولو حتي كانت الانتصاؤ التاريخي العظيم في الكورة...احنا مش طايلين اي حاجة تفرحنا غيرها...<br />المهم ان الجدع جوزية ده كويس فعلا وان كان مغرور واحيانا بيبقي غبي جدا جدا ....الماتش بتاع القاهرة كان في قمة الغرور والغباوة وكان طبيعي جدا ان كل النقاد يهاجموه علي البلاوي اللي هوه هببها...<br />لكن ماتش تونس كان احسن بكتير فعلا...<br />ويمكن لو كان الاهلي اتغلب كنت شتمت في جوزيه تاني ..."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118123208/http://masr.20at.com:80/article.php?sid=1154"

