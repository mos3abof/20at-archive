[[comments]]
order = 27
subject = "من ال>ي يحارب امريكا بصورة اسرائيل ام العكس؟"
author = "الوهم الحزين"
posted = "2006-07-21"
text = "ايتها الامة ان من يحاربكم هو الشيطان الاكبر في صورة اسرائيل الممسوخة على شاكلتها التي تظهر بها الان .<br />وانظروا الى الشيطان الاكبر مازال يريد<br />ومازال بحاجة ماسة الى دماء العرب وخاصة<br />الاطفال .<br />انه يلعب الان في البحر وفي الجو ولكنه على الارض لايستطيع اللعب كما يشاء .<br />وه>ه هي حالته في كل مكان في اغغانستان والعراق والان لبنان .<br />نعم انه يمثل الدورين كما يريد فهو الحكم وهو الجلاد .ولكننا سنقراء عليه البقرة ويس والمعودات وسيعود خائبا يبحث عن اعدار كعادته في كل المناطق التي دكرتها.وهاهو قد بدا بالترنح يمينا وشمال<br />عندما بداوا رجال الشيخ نصرالله بالقراءة عليه كما يجب عند الحدود الشمالية لاسرائيل والحدود الجنوبية للبنان حتى اصبحت طائراته تتساقط لوحده .<br />ان امريكا تريد ان تخفي خيبتها في العراق بخيبة جديده في لبنان<br />اخواني والله اكاد ان اجزم بان هناك عملا كبيرا في العراق لايريدون منا كعرب ان ننتبه اليه فاافتعلوا هده الحرب وجعلوها بهدا الشكل الكبير .<br />فقد يكون الدق الان هنا في لبنان ولكن من سيفتح الباب هناك في العراق وبشكل مفاجىء<br />انه سيناريو كبير كبيركبير وله خيارات كثيرة وممتدة ..<br />ولكن مايجعل القلب يرتاح لان 75% من هده المخططات قد فشلت وانهارت حتى تدنت سمعة وشعبية الشيطان الاكبر حتى اصبح مؤيدوه لايطيقونه ولايصوتون له ,,<br />وحزب الله قد ينهي على مابقي من نسبة له.<br />قواكم الله ونصركم ياحزب الله ونصرك الله يالبنان واني اشعر بادن الله ان النصر قد اقترب وان اهانت ودل الشيطان واعوانه قد اقترب يارب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

