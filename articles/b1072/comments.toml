text = "والله لو اعرف انت من اين لجيتلك واعرف ...<br />وافضل ان تغير اسمك من ابو العدالة الى شارون احسن حتى تطلع على حقيقتك وانا متاكد انك عميل لاسرائيل عاشت الامة الاسلاميةوعاش العرب الشرفاء وتحية من الاعماق الى المقاومة اللبنانية وعاش البطل المجاهد السيد حسن نصر الله"
archived = "2006-11-02"
