[[comments]]
order = 56
subject = "غيور بعت غيرتي لليهود"
author = "حزين"
text = "منقول<br />الشيعة واليهود والوعد المفعول - امير جابر<br />[16-07-2006]<br />الشيعة واليهود والوعد المفعول<br />امير جابر-هولندا<br />في ايام صباي سألت نفسي لماذا لايتعايش العرب مع اليهود وماقيمة 15 الف كيلومتر مربع يعيش عليها خمسة ملايين من اليهود، وهي لاتساوي نصف محافظة من محافظات العراق، بدل هذه الدماء والحروب التي اهلكت الحرث والنسل ومرت الايام وقرأت القرآن بتدبر وامعان فوجدت ان رب العباد لم يفرد لمجموعة من اصحاب الديانات ويحذر منهم ومن مكرهم مثلما نبه وبين واشار الى خطر اليهود وانهم وراء معظم الفتن، وانهم كلما اوقدوا نارا للحرب اطفأها الله، وانهم ينقضون العهود وان منهم من يبرم العهود ثم يأتي فريق اخر فينقضها، وانهم يرضوننا بالسنتهم وتأبى قلوبهم ،وانهم اهل المكر وان مكرهم تكاد تزول منه الجبال، وان هناك تاكيد الهي يفيد التابيد انهم لن يرضوا عنا حتى نتبع ملتهم اي طريقتهم في المكر والفساد والايات محكمات ومترادفات، ولااستطيع حصرها على الاطلاق وهذه الحقيقة لاتخفى على من قرأ القران الكريم، ثم عندما اطلعت على السيرة النبوية وجدت كيف نقضوا عهدهم مع رسول الله(ص) وتحالفوا بالسر مع كفار قريش لغزوا مدينة الرسول وتدمير الاسلام، وتتبعت تأمرهم في هذا المجال فوجدت باني اعجز من الاحاطة بكل ماعملوه من فتن ومكر، وان هذه مهنة امتهنوها ييتوارثها اللاحقون منهم من السابقين والاحفاد من الاجداد، وانهم لن يتخلوا عنها حتى يأـي اليوم الموعود، ودرست الحروب العالمية بامعان، فوجدت ان السبب الاول في مساعدة الاوربيين اليهود على الهجرة الى فلسطين وحمايتهم وتكوين دولتهم هناك يرجع الى ان الاوربيين اكتشفوا ان حروبهم التي اهلكت الملايين كان المتسبب الاول فيها وفي انطلاق شرارتها هم دهاة اليهود ولهذا حرقهم هتلر واباد منهم الملايين ومنذ ان تخلصت منهم اوربا ورمتهم على العرب وحتى الان لم تنشب اي حرب في اوربا القديمة ، هذه اوربا الذي يشهد تاريخها بانه لم يخلوا عام واحد فيها من الحروب عندما كان ينتشر في اوساطهم اليهود، وقرات قول الرئيس الامريكي السابق ترومان عندما قال الويل لامريكا اذا تحكم فيها اليهود، وشاهدت كيف يتلاعب اليهود بامريكا وكيف جعلوا العالم اجمع يكره الامريكان وكيف حولوا اكثر من مليار مسلم الى اعداء من خلال دعم الحكومات الامريكية لهم في عدوانهم المكشوف والذي لايستسيغه كل انسان شريف، ووصل الامر بمندوب امريكا في الامم المتحدة الى القول ان سياستنا الخاصة بالشرق الاوسط 100% ناخذها من اللوبي الصهيوني ايباك، وتعجبت امريكا وعملت الابحاث بعنوان لماذا يكرهوننا ولو بحثت عن السر لعرفت من يقف وراء هذا الكره والدمار يرجع للانقياد الاعمى لليهود اساتذة الفتن ومدبري كل الشرور والاثام.<br />وعندما اطاح الخميني بشاه ايران الحليف الاول لليهود والامريكان وقال قولته الشهيرة ان اسرائيل غدة سرطانية يجب ان تزول وجعل من ايران قوة مضافة للعرب والمسلمين، رايت بالضبط ماذا فعل اليهود واطلعت على مكرهم المعهود والذي بينه ربنا المعبود بكلام لايقبل التشكيك والردود.<br />ماذا رايت؟<br />فقد اتيحت لي فرصة ذهبية من خلال دراستي العليا في بداية الثمانينيات في العلوم السياسية في العاصمة المصرية ان اعمل متابعة اعلامية لما تذيعه وتنشره الوسائل الاعلامية العبرية، واكتشفت طرقهم الماكرة في اثارة الفتن والضحك على المغفلين، حتى جعلوا العرب يصدقون بان عدوهم الذي سيقضي عليهم هو الخميني والشيعة، وقالوا ان الشيعة قادمون وانهم سياخذون حكام العرب اسرى الى طهران، وفتحوا المعاهد والجامعات في تل ابيب لاثارة الفتنة بين الشيعة والسنة وخرجوا الاف الائمة لهذا الغرض الخبيث، وطبعوا الملايين من الكتب والكراسات وبمختلف اللغات ووزعوها في كل ارجاء العالم الاسلامي وفتحوا الالف من المواقع الالكترونية تعمل على مدى الليل والنهار لاثارة العداوة والبغضاء بين المسلمين ،وابعدوا الفلسطينيين الواعين الذين تحكموا في المساجد في غزة بعد الصحوة التي اثارها الخميني بين المسلمين واعطوا السلاح لمطاياهم من السلفيين الذين استقدموا الكثير منهم من دول الخليج واحتلوا مساجد غزة في يوم العيد، وهذه الامور شرحها بالتفصيل بعض القادة الفلسطينيين ومنهم فتحي الشقاقي الذي اغتاله الموساد في مالطا والكاتب المصري الكبير مصطفى محمود، واشعلوا الحرب بين العراق وايران عندما زودوا صدام الاهبل بتقارير ورسائل من بعض عملائهم من القادة العسكريين الايرانيين الذين جندوهم عندما كانوا يتدربون في قواعدهم في فلسطين ايام حكم شاه ايران حليفهم قائلين لصدام بمجرد عبورك لحدود ايران فاننا سننطلق لاحتلال طهران والقضاء على الخميني، وعندما بدأت تلك الحرب قال رئيس وزراء اسرائيل في حينها مناحيم بيجن لم افرح في حياتي مثلما فرحت للحرب بين العراق وايران ،ومن خلال اعلامهم التحريضي على الشيعة وخطرهم وتقاريرهم السرية للدول الخليجية جعلوا تلك الدول وغيرها تتجمع تجمعا لم يشهده العرب وفتحوا خزائنهم بسخاء يسكبون الزيت لحرق المزيد من تلك الدماء المسلمة، وقال ابراهيم نافع في الاهرام ان الدول الخليجية منحت مصر وخلال عشرين سنة لمواجهة اسرائيل فقط 12مليار بينما منحت صدام في خلال سنة واحدة وهي سنة 1982 مائة مليار دولار، وتحركت ماكينة الاعلام السلفية وصورت الشيعة وكانهم اخطر من الشيطان بل من كل الاعداء وانه يجب القضاء عليهم قبل محاربة اي اعداء ولهذا لم نرى سلفيا واحدا ذهب لنصرة الفلسطينيين او فجر نفسه بالاسرائيليين في حين نرى الالاف منهم يتجهون للعراق لتفجير انفسهم في فقراء الشيعة الابرياء، وحتى الفلسطيني السلفي وهو يرى ارضه وعرضه ينتهك في فلسطين ترك فلسطين ولبنان والاردن وذهب يقاتل بعيدا في افغانستان والعراق. فقد درس المكرة اليهود تراثنا بالتفصيل وعلموا منهم الحمير الذين يحملون اسفار غيرهم ومن هم الذين ضل سعيهم في الحياة الدنيا وهم يحسبون انهم يحسنون صنعا . وحتى بعض قادة حماس من السلفيين رايناهم يقيمون مجالس العزاء على اولاد صدام والزرقاوي وهم يعترفون بظلم اولئك الاوغاد وهم ايضا من ذاق الظلم كاقرانهم العراقيين وهم من ينقل الاحاديث التي تقول ان الظالم لايمكن ان يحقق نصرا للمسلمين. لكن لوسالت اي سلفي الان عن حزب الله الذي يعرض ابناءه وارضه للدمار نصرة للفلسطيينين لانه يعرف ان اليهود وراء كل هذه المصائب لو سالت اي سلفي عن رايه في حزب الله لكفرهم وخونهم وقال يجب ان نحاربهم قبل محاربة اليهود . واستطاع اليهود ان يجعلوا بعض الحكام العرب حراس اوفياء لحدودهم ووجودهم. فالملك عبد الله يحرس لهم اكثر من 600 كيلوا متر ويعجز عن حراسة 90كيلوا متر مع العراق حتى يعبر مطايا اليهود من السلفين كي يقتلوا العراقيين وبقية الحكام العرب القوا اللائمة على حزب الله، في حين ان ودينهم وقرانهم يامرهم بنصرة المستضعفين وهم يشاهدون من خلال تلفزيوناتهم الملونة تقطع اشلاء الفلسطينيين ووصموا نصر الله بالمغامر وانهم العقلاء هؤلاء العقلاء الذين ما امتلك قبلهم احد مثل هذه الترسانات من السلاح الذي يستعرضونه فقط على مواطنيهم ولو فتحوا حدودهم وكما يفعلون في ذبح العراقيين وقالوا لشعوبهم كل واحد منكم ياخذ فقط دلوا من الماء لاغرقوا الاسرائيليين وما ادري كيف سيفسر لنا علمائهم الذين يدعون انهم فقط اهل التوحيد والعقيدة الصحيحة هذا الوضع؟<br />اما العراق وشيعة العراق وهم الخطر الذي قال فيه العميل الاول لامريكا واسرائيل انهم سيشكلون هلالا سيمتد الى جنوب لبنان وسيدمر حبيبته اسرائيل وقال قبل ذلك طارق حنا عزيز في سنة 1984 عندما ساله مذيع البيبي سي كيف اقنعت الغرب كله بالوقوف معكم فقال الامر بسيط فقد قلت لهم انتم واسرائيل هربتم من لبنان في مواجهة نصف مليون من شيعة لبنان فكيف اذا سقطنا وخرج لكم 14 مليون من نفس العينة التي هزمتكم وهم يمتلكون امكانات العراق الهائلة وعندهم الحسين الذي قال لهم هيهات منا الذلة وان الحياة مع الظالمين تافهة وان الموت في سبيل الله هو السعادة. وفي حينها حبك اصحاب المكر من اليهود الاكاذيب وهم ينسقون في الخفاء مع اجهزة مخابرات صدام وقالوا انهم يجهزون ايران بالسلاح حتى يظهروا عميلهم صدام وكانه يشكل خطرا على اليهود وصدقهم عربان هذا الزمان المغفلين وعندما شعروا بنهاية صدام وان البديل حتما سيكون عدوهم المعروف حثوا الامريكان لاسقاط صدام وضنوا ان عملائهم من العراقيين المعروفين سيقيمون دولة من اولى مهامها تطبيع العلاقات مع اسرائيل والوقوف سدا منيعا في وجه عدوتهم التقليدية ايران وعندما شاهدوا الناس اتجهت بالملايين نحو الحسين وكربلاء الشهاة والفداء وانتخبوا قياداتهم الحقيقيين شغلوا ماكنتهم الاعلامية والبسوا رجال مخابرات صدام حلفائهم المخلصين العمائم والدشاديش القصيرة ورفعوا الرايات السلفية وترك الزرقاوي مدينته التي تطل على المسجد الاقصى وذهب ينحر الشيعة ويقرأ البيانات التي كتبت باتقان وتحرض على الحرب بين السنة والشيعة واثارة العدوات والاحقاد، وفتحوا حدود العراق على مصراعيها وذهب رجال الموساد الى بغداد يعلمون اتباعهم من صداميين وتكفيريين كيف يلغموا السيارات ويفجروا العبوات في اسواق الشيعة ومساجدهم وهجروا الالاف منهم وسمت قناة الجزيرة والتي تتحالف معهم بالسر وتشتمهم بالعلانية هؤلاء القتلة بالمقاومة الشريفة ونعتت خصومهم بالعملاء الذين يستحقون القتل، وانهالت عليهم الاموال والرجال ممن يعرف المكرة كيف متى يركبونهم واستحر القتل وبرعاية القوات الامريكية، وبوش اصبح الان يلقي هذا الاجرام على المليشيات الشيعية و يريد نزع اسلحتهم حتى لايزعجوا القتلة المعروفين واستقبل رجال الموساد شيخ المجاهدين وابنه حارث الضاري في عمان والقاهرة واستنبول وكما اظهرت ذلك بعض وسائل الاعلام التركية والامريكية ووعدوا اجهزة المخابرات الصدامية بالعون والحماية، واوقفت القوات المحتلة للعراق اجراءات القضاء واخرجت المجرمين الذين اعترفوا بقتل الالاف من العراقيين البسطاء من السجون وفضحت امريكا نفسها بنفسها في قضية تعذيب السجون، حتى تعطي القتلة المزيد من المصداقية واستمرار تزويدهم بالعطاء المطللوب من العرب المغفلين لاكمال المهمة بالشكل الذي يحقق اهداف اليهود، واعترف اليهود علنا انهم عليهم ان يعملون في بقاء الانظمة العربية في سدة الحكم لانهم اكتشفوا ان اكبر خطر يواجههم هو هذه الشعوب المسلمة. وبعبارة مختصرة ان يدمر ويحكم المئات من المسلمين بالحديد والنار وان يستمر هذا الظلم حتى يعيش خمسة ملايين من شعب الله المختار في امان ورفاه اي ان اسرائيل هي فعلا غدة سرطانية في هذا الجسم الاسلامي كما قال الامام الخميني اي انها لاتكتفي بفلسطين وانما تسعى لتدمير كل المسلمين اي ان الذي يدافع عن اللبنانيين والفلسطينيين انما يدافع عن نفسه بالدرجة الاولى هذه الحقيقة لم تعد تخفى على الناظر المدقق ولهذا سجدت مستغفرا ربي لذنبي القديم عندما كنت صغيرا<br />لكن هل يستطيع هؤلاء المكرةبالاستمرار بهذا التدمير والخراب؟<br />وهل من نهاية لهذا المكر والتضليل ومتى سيكون الخلاص والبشرى لهذه الشعوب المبتلاة؟<br />لقد اخبرنا ربنا في قرآنه المجيد تفصيلا لهذه االحال ووضح لنا طريق الخلاص وفيما يخص هذا الموضوع قال ربنا في سورة الاسراء(وقضينا الى بني اسرائيل في الكتاب لتفسدن في الارض مرتين ولتعلن علوا كبيرا) وهذا الفساد والعلو لايحتاج الى بيان ثم قال لنا( فاذا جاء وعد اولهما بعثنا عليكم عبادا لنا اولي بأس شديد فجاسوا خلال الديار وكان وعدا مفعولا) ثم رددنا لكم الكرة عليهم وامددناكم باموال وبنين وجعلناكم اكثر نفيرا) واعتقد ان تعالي اليهود الان لايحتاج الى شرح وكذلك النفير وخاصة النفير الاعلامي والبشري المؤيد لهم لايخفى على العيان بعد هذا يخبرنا ربنا عن النهاية قائلا( ان احسنتم احسنتم لانفسكم وان اسأتم فلها فاذا جاء وعد الاخرة ليسئوا وجوهكم وليدخلوا المسجد كما دخلوه اول مرة وليتبروا ما علوا تتبيرا) وهذه الاساءة لايجهلها احد فحقا على الله ان يفي بوعده وهو كما قال لايخلف الميعاد، وقد بدأت الحرب وسوف لن تقف على الاطلاق حتى يتحقق وعد الله لكن اهم شئ الان يجب ان يعمله المسلمون الصادقون هو توعية هذه الامة وتعرية المكرة اليهود و<br />18/07/2006<br />اقرأ بقية التعليق .."
