subject = "الرجاء من جموع العرب المسلمين والمسيحيين"
author = "ندى أحمد الصالح"
posted = "2006-07-31"
text = "ندعو جميع المؤمنين والمؤمنات بالتضرع إلى الله وقراءة دعاء أهل الثغور لنصرة المقاومة الإسلامية في لبنان وفلسطين<br />أُوْلَئِكَ حِزْبُ اللَّهِ أَلا إِنَّ حِزْبَ اللَّهِ هُمُ الْمُفْلِحُونَ<br />1. بسم الله الرحمن الرحين : يَا أَيُّهَا الَّذِينَ آمَنُواْ لاَ تَتَّخِذُواْ الْيَهُودَ وَالنَّصَارَى أَوْلِيَاء بَعْضُهُمْ أَوْلِيَاء بَعْضٍ وَمَن يَتَوَلَّهُم مِّنكُمْ فَإِنَّهُ مِنْهُمْ إِنَّ اللّهَ لاَ يَهْدِي الْقَوْمَ الظَّالِمِينَ<br />2. فَتَرَى الَّذِينَ فِي قُلُوبِهِم مَّرَضٌ يُسَارِعُونَ فِيهِمْ يَقُولُونَ نَخْشَى أَن تُصِيبَنَا دَآئِرَةٌ فَعَسَى اللّهُ أَن يَأْتِيَ بِالْفَتْحِ أَوْ أَمْرٍ مِّنْ عِندِهِ فَيُصْبِحُواْ عَلَى مَا أَسَرُّواْ فِي أَنْفُسِهِمْ نَادِمِينَ<br />3. وَيَقُولُ الَّذِينَ آمَنُواْ أَهَـؤُلاء الَّذِينَ أَقْسَمُواْ بِاللّهِ جَهْدَ أَيْمَانِهِمْ إِنَّهُمْ لَمَعَكُمْ حَبِطَتْ أَعْمَالُهُمْ فَأَصْبَحُواْ خَاسِرِينَ<br />4. يَا أَيُّهَا الَّذِينَ آمَنُواْ مَن يَرْتَدَّ مِنكُمْ عَن دِينِهِ فَسَوْفَ يَأْتِي اللّهُ بِقَوْمٍ يُحِبُّهُمْ وَيُحِبُّونَهُ أَذِلَّةٍ عَلَى الْمُؤْمِنِينَ أَعِزَّةٍ عَلَى الْكَافِرِينَ يُجَاهِدُونَ فِي سَبِيلِ اللّهِ وَلاَ يَخَافُونَ لَوْمَةَ لآئِمٍ ذَلِكَ فَضْلُ اللّهِ يُؤْتِيهِ مَن يَشَاء وَاللّهُ وَاسِعٌ عَلِيمٌ<br />5. إِنَّمَا وَلِيُّكُمُ اللّهُ وَرَسُولُهُ وَالَّذِينَ آمَنُواْ الَّذِينَ يُقِيمُونَ الصَّلاَةَ وَيُؤْتُونَ الزَّكَاةَ وَهُمْ رَاكِعُونَ<br />6. وَمَن يَتَوَلَّ اللّهَ وَرَسُولَهُ وَالَّذِينَ آمَنُواْ فَإِنَّ حِزْبَ اللّهِ هُمُ الْغَالِبُونَ<br />7. يَا أَيُّهَا الَّذِينَ آمَنُواْ لاَ تَتَّخِذُواْ الَّذِينَ اتَّخَذُواْ دِينَكُمْ هُزُوًا وَلَعِبًا مِّنَ الَّذِينَ أُوتُواْ الْكِتَابَ مِن قَبْلِكُمْ وَالْكُفَّارَ أَوْلِيَاء وَاتَّقُواْ اللّهَ إِن كُنتُم مُّؤْمِنِينَ<br />الرجاء من جموع المسلمين وأخوتنا المسيحيين أن لا ينسوا المقاومة الاسلامية في الدعاء لينصرهم الله بنصره ولنجعل من اليوم وبعد صلاة الغرب : بأن ندعي بدعاء الثغور وهذا نصه : اللهم صلّ على محمدٍ وآل محمد<br />وحصّن ثغور المسلمين بعزّتك ، وأيّد حماتها بقوتك ، وأسبغ عطاياهم من جدتك ، اللهم صل على محمد وآله وكثر عدّتهم ، وأشحذ أسلحتهم ، وأحرس حوزتهم ، وأمنع حومتهم ، وألّف جمعهم ودبّر أمرهم ، وواتر بين ميرهم ، وتوحد بكفاية مؤنهم ، واعضدهم بالنصر وأعنهم بالصبر ، وألطف لهم في المكر ، اللهم صل على محمد وآله وعرفهم ما يجهلون ، وعلّمهم ما لا يعلمون ، وبصرهم ما لا يبصرون ، اللهم صل على محمد وآله ، وأنسهم عند لقاءهم العدو ذكر دنياهم الخداعة الغرور ، وأمح عن قلوبهم خطرات المال الفتون ، وأجعل الجنة نصب أعينهم ، ولوح منها لأبصارهم ما أعددت فيها من مساكن الخلد ، ومنازل الكرامة والحور الحسان ، والأنهار المطّردة بأنواع الأشربة ، والأشجار المتدلية بصفوف الثمر ، حتى لا يهم أحد منهم بالإدبار ، ولا يحدث نفسة عن قرنه بفرار ، اللهم أفلل بذلك عدوهم ، واقلم عنهم أظفارهم ، وفرق بينهم وبين أسلحتهم ، وأخلع وثائق أفئدتهم ، وباعد بينهم وبين أزودتهم ، وحيرهم في سبلهم ، وضللهم عن وجههم وأقطع عنهم المدد وأنقص منهم العدد ، وأملأ أفئدتهم الرعب ، وأقبض أيدهم عن البسط ، وأخزم ألسنتهم عن النطق ، وشرد بهم من خلفهم ، ونكّل بهم من ورائهم ، وأقطع بخزيهم أطماع من بعدهم ، اللهم عقّم أرحام نسائهم ويبّس أصلاب رجالهم ، وأقطع نسل دوابهم وأنعامهم ، لا تأذن لسمائهم في قطر ولا لأرضهم في نبات ، اللهم وقوّ بذلك محال أهل الإسلام وحصّن به ديارهم ، وثمّر به أموالهم ، وفرّغهم عن محاربتهم لعبادتك ، وعن منابذتهم للخلوة بك ، حتى لا يعبد في بقاع الأرض غيرك ، ولا تعفّر لأحدهم جبهة دونك ، اللهم أغز بكل ناحية من المسلمين على من بإزائهم من المشركين ، وأمددهم بملائكة من عندك مردفين ، حتى يكشفوهم الى منقطع التراب قتلاً في أرضك وأسرى ، أو يقرّوا بأنك أنت الله الذي لا إله إلا أنت وحدك لا شريك لك . اللهم وأعمم بذلك أعدائك في أقطار البلاد ، وسائر أمم الشرك الذين تخفى أسمائهم وصفاتهم ، وقد أحصيتهم بمعرفتك وأشرفت عليهم بقدرتك . اللهم إشغل المشركين بالمشركين عن تناول أطراف المسلمين ، وخذهم بالنقص عن تنقصهم ، وثبطهم بالفرقة عن الإحتشاد عليهم ، اللهم أخل قلوبهم من الأمنة وأبدانهم من القوة ، وأذهل قلوبهم عن الإحتيال ، وأوهن أركانهم عن منازلة الرجال ، وجبنهم عن مقارعة الأبطال وأبعث عليهم جنداً من ملائكتك ببأس من بأسك ، كفعلك يوم بدرٍ تقطع به دابرهم وتحصد به شوكتهم ، وتفرق به عددهم ، وأمزج مياههم بالوباء وأطعمتهم بالأدواء ، وأرم بلادهم بالخسوف وألح عليها بالغضوف ، وافرعها بالمحول ، وأجعل ميرهم في أحص أرضك وأبعدها عنهم ، وأمنع حصونها منهم ، أصبهم بالجوع المقيم والسقم الأليم . اللهم وأيما غازٍ غزاهم من أهل ملتك ، أو مجاهدٍ جاهدهم من أتباع سنتك ، ليكون دينك الأعلى وحزبك الأقوى وحضك الأوفى ، فلقه اليسر وهيئ له الأمر وتوله النجح وتخير له الأصحاب ، وأستقو له الظهر وأسبغ عليه في النفقة ، ومتعه بالنشاط وأطفي عنه حرارة الشوق ، وأجره من غم الوحشة ، وأنسه ذكر الأهل والولد ، وأفر له حسن النية ، وتوله بالعافية ، وأصحبه السلامة وأعفه من الجبن ، وألهمه الجرأة وأرزقه الشدة ، وأيده بالنصر وعلّمه السير والسنن ، وسدّده في الحكم ، وأعزل عنه الرياء ، وخلصه من السمعة ، وأجعل فكره وذكره وضعنه وإقامته فيك ولك ، فإذا صافّ عدوك وعدوه ، فقللهم في عينه وصغّر شأنهم في قلبه ، وأدل له منهم ولا تدلهم منه ، فإن ختمت له بالسعادة وقضيت له بالشهادة ، فبعد أن يحتاج عدوك بالقتل وبعد أن يجهد بهم الأسر، وبعد أن تأمن أطراف المسلمين ، وبعد أن يولي عدوك مدبرين . اللهم وأيما مسلمٍ خلف غازياً أو مرابطاً في داره ، أو تعهد خالفيه في غيبته ، أو أعانه بطائفةٍ من ماله ، أو أمده بعتاد أو شحذه على جهاد ، أو أتبعه في وجهه دعوةً ، أو رعى له من ورائه حرمة ، فأجر له مثل أجره وزناً بوزن ، ومثلاُ بمثل ، وعوضه من فعله عوضاً حاضراً ، يتعجل به نفع ما قدّم ، وسرور ما أتى به الى أن ينتهي به الوقت الى ما أجريت له من فضلك ، وأعددت له من كرامتك . اللهم وايما مسلم أهمه أمر الإسلام ، وأحزنه تحزب أهل الشرك عليهم ، فنوى غزواً أو همّ بجهاد ، فقعد به ضعف أو أبطأت به فاقة ، أو أخره عنه حادث ، أو عرض له دون إرادته مانع ، فأكتب إسمه في العابدين ، وأوجب له ثواب المجاهدين ، وأجعله في نظام الشهداء والصالحين . اللهم صل على محمد عبدك ورسولك وآل محمد صلاة عالية على الصلوات ، مشرفة فوق التحيات ، صلاة لا ينتهي أمدها ولا ينقطع عددها ، كأتم ما مضى من صلواتك على أحد من أوليائك ، إنك المنان الحميد ، المبدء المعيد ، الفعّال لما تريد ، برحمتك يا أرحم الرحمين ، وصلى الله على سيدنا محمد وآله الطيبين الطاهرين ."
