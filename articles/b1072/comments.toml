[[comments]]
order = 42
subject = "الي مسلم مصري وشيخه ياسر"
author = "محمد سالم - مسلم سني -مصري"
posted = "2006-08-01"
text = "لقد اتعبت نفسك كثيرا وانت تنسخ كلام شيخك ياسر البرهامي من صفحه الي صفحه والذي لم اسمع به من قبل وغلب الظن انه سلفي وهابي من اتباع ال سعود ومن شيوخ الميكروباص الذين يحب سماعهم سواقي الميكروباص او ربما كان يظهر علي احدي القنوات المموله بمال ال سعود<br />**** واظن ان شيخك المبجل رغم انه في النهايه اجاز دعم حزب الله ونحن شاكرين له علي تكرمه وتعطفه علينا بهذه الفتوي<br />الا ان الرجل يبدو قدم حيثيات لهذه الفتوي تجعلني اشك في مصداقيته<br />فكان يكفيه ان يقول ان حزب الله مسلمون ويجب نصرتهم ضد اعداء الامه<br />*** لكن كيف يقول سلفي وهابي هذا الكلام<br />وقد اعتادوا علي ان ينعتوا بالكفر او الضلال كل من ليس سلفيا<br />شيخك يتحدث عن غلاة الشيعه ... اين هم هؤلاء وهل حزب الله منهم<br />وما رايه في غلاة السنه من علماء ال سعود واذنابهم في مصر وفي كل مكان<br />** هل يجرؤ شيخك ان يتحدث عن فساد ال سعود وخيانتهم للامه واهدارهم لاموال المسلمين<br />***هل يجرؤ شيخك علي التنديد بامراء ال سعود الذين نشروا الفسق والاباحيه عن طريق قنواتهم الفضائيه<br />***هل يجرؤ شيخك علي الدعوه للجهاد ضد اليهود الان مثلما دعوا الي الجهاد ضد السوفيت في افغانستان<br />***** ماهي قضايا الامه التي تشغل بال شيخك هل يا تري اطالة اللحيه وتقصير الثوب والنقاب وتكفير المخالفين له<br />ام يشغله فساد الحكام ونفاق العلماء وتخاذل الامه عن نصرة المجاهدين** وان كنت شيخا عالما لاتخشي في الله لومة لائم فقل لي ما رايك في كلام فيصل وزير خارجية السعوديه ومارايك في فتوي ابن جبرين ؟؟ !!!<br />اللهم انصر المجاهدين الشرفاء من حزب الله ورجاله وبارك اللهم في سيد هذه الامه السيد حسن نصر اله<br />اللهم دمر الخونه والعملاء والمنافقين"
