[[comments]]
order = 34
subject = "مافهمنا والوا"
author = "el hajej"
posted = "2006-07-22"
text = "السلام على من اتبع الهدى درك فهمونا انتوم عباد ولا حاجة اخرى اتى الشيخ عزام رحمه الله وقلتوا عليه متطرف وارهابي ثم رجعتوا عن الاتهام ثم جاء الشيخ اسامةحفظهالله ورجعتوه عميل للامريكان ثم زدتوا ارجعتوا في كلامكم وقلتوا خاطيه راه الشيخ ايمن الظواهري هو الي مشي فيه وهو العميل الصهيوني ثم زدتوا رجعتوا في كلامكم انا اعلم بخطورة الشيعة واهدافهم واني من محاربيهم سلميا و هاكريا بالاختراق لان معضمهم حفدة اليهود لكن مهما فعل السيد حسن نصر الله قواه الله على اعدائه ان كان مخلص لله القهار فان ارض لبنان تغتصب ليل نهار و انتوا علقوا وسبواوالوقت يمضي ما فهمنامنكم شيء حيث يتغير الاعراب المسلمين بالوراثة الذين هم اشد نفاقاوشقاقا وتغيرا فحاشا العرب الاحرار المسلمين لله الذين لم يبق منهم الا القليل المهم مادخل الشيعة هنا الا تعلموا انهم يقولونا لااله الا الله وان اختلفوا معنا في كل شيء اندعوا اليهود يطبقون حربهم هذه هرمجدون نتاعهم ولا تعلمون ان قتلانا في الجنة و قتلاهم في النار اتفرون من الموت ام اخذتكم العزة بالاثم والفاهم يفهم صاحبوا ايا ربي يهديكم الى التي هي احسن واقوم"
archived = "2006-11-02"
