[[comments]]
order = 24
subject = "قاتلوهم يعذبهم الله"
author = "ابو الوليد"
posted = "2006-07-19"
text = "السلام عليكم ورحمة الله وبركاته<br />من ارض الكرامة والبطولة من ا رض الانبياء<br />فلسطين ومن غزة تحديدا التى تخضع للحصار يوما بيوم وساعة بساعة فلا كهرباء ولا ماء<br />فغدائنا القذائف وشرابنا دم الاعداء<br />وهواء رائحة الموت المنبعث من اجساد الصهاينة<br />يا اخوتى فى لبنان كتب علينا ان نكون وسام شرف على صدر امة محمد عليه السلام<br />والى من يستهزئون بأنتصارات المقاومة فأقول لهم بئسا لكم واستخسر امة العرب فيكم فأنتم ليس الا ادوات فى ايدى الموساد والسى اى ايه والى حسن نصر الله سلام اليك سيدى سلام اليك من الاصابع الضاغطة على زناد الشرف والكبرباء سلام لك من العيون السهرة المترقبة تقدم الغزاة لتصدهم وتدحرهم ... سلام لك ولرجالك الاوفياء لمحمد عليه السلام وعلى كرم الله وجه........ سلام اليك فى زمن الرياء والنفاق..... سلام لك سيدى<br />والسلام عليكم ورحمة الله وبركاته<br />..... قاتلوهم يعذبهم الله بأيديكم ويخزهم وينصركم عليهم ويشف صدور قوم مؤمنين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 25
subject = "مجاهدون مغامرون"
author = "جورج سعادة"
posted = "2006-07-20"
text = "المجاهدون المغامرون:<br />أثبتت الأحداث التاريخية منذ بداية أحتلال فلسطين وحتى الآن , أن أسرائيل ماكانت تستطيع أن تصل إلى ماوصلت إليه لولا تواطؤ وعمالة وجاسوسية بعض الحكام العرب . هؤلاء الحكام يعتقدون أنهم بتعاونهم السري مع اليهود والصهاينة سيحفظ لهم عروشهم وكراسيهم وبالتالي يتصرف هؤلاء الحكام ضد رغبات شعوبهم وكأنهم وكلاء للصهيونية في بلادهم. وهؤلاء الحكام وللأسف كانوا أكثر صهيونية من الصهاينة أنفسهم وقدموا خدمات للدولة اليهودية أكثر مما قدمه اليهود أنفسهم لأسرائيل . وعندما يتحرك شبابنا للثأر من جرائم اليهود بحق أخوتنا في فلسطين , يسارع أولئك الحكام ونيابة عن أسرائيل لتحريك كلابهم ضد الشباب المجاهد المغامر .<br />لقد أن الآوان وأمام جرائم اليهود التي أصابت كل بيت عربي في فلسطين ولبنان ومصر وسورية والأردن والعراق لأن يبدأ شبابنا بانتفاضة شاملة تغطي كل دول العالم وأن يكون كل يهودي في أي بلد في العالم هدف يجب تصفيته .<br />إن الجندي الأسرائيلي الأسير في غزة يحمل الجنسية الفرنسية . ووزير الحرب الأسرائيلي بيرتس يحمل الجنسية المغربية . ومعظم الطيارين الأسرائيليين الذين يهاجمون الآن لبنان وغزة يحملون الجنسية الأمريكية ووزير الخارجية السابق سيلفان شالوم يحمل الجنسية التونسية . إذن كل يهودي في العالم هو في النهاية مواطن أسرائيلي يعمل لمصلحة أسرائيل وسيخدم أو خدم سابقاً في الجيش الأسرائيلي وارتكب جرائم ضد العرب والمسلمين .<br />ياشبابنا لنبدأ الآن مغامرة جديدة ضد اليهود وليكن سلاحنا السكاكين وهي متوفرة في كل سوبر ماركت .<br />إن اليهود منتشرون في كل بلاد العالم وهم الداعمون الحقيقيون والبنية التحتية لدولة أسرائيل , فلنبدأ بهم ولنقضي على موارد حياة أسرائيل .<br />أيها الشاب الذي تريد الجهاد ومساعدة أخوتك المجاهدين في لبنان وفلسطين , إذهب واشتري سكين واطعن أو أذبح أقرب يهودي في منطقتك وبذلك نجفف منابع الدعم لأسرائيل . إن هذا اليهودي إن لم تقتله اليوم سيقوم غداً أو بعد غد بقتل أخ لنا في فلسطين أو لبنان .<br />نحن لانريد أن نقتل أي أنسان أخر ولذلك يجب أن يكون سلاحنا السكاكين حتى نقضي على اليهود المجرمين قتلة الأنبياء والنساء والأطفال ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

