[[comments]]
order = 12
subject = "للهم إنصرهم بنصرك"
author = "ندى أحمد الصالح"
posted = "2006-07-16"
text = "إلى شعب الكرامة العظيم<br />حقا أنكم رجال والرجال قليل<br />لقد خذلنا أشباه الرجال أصحاب بشوت الذل والخزي همهم كراسيهم وجيوبهم<br />اعلموإننا معكم بقلوبنا وندعي لكم ليلا ونهارا بأن ينصركم الله ويمدكم بجنود من عنده<br />وإلى حفيد الإمام الحسين عليه السلام<br />بارك الله فيك ونصرك وصدق جدك عليه السلام حين قال(هيهات منا الذلة)<br />أرجوا تبليغ تحياتي إلى السيد حسن نصرالله ابلاغه بوصول رسالته إلى جموع المسلمين الأشراف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 13
subject = "مرح في جهنم"
author = "أبو أيمن المغربي"
posted = "2006-07-16"
text = "الحمد لله رب العالمين<br />هذه الحمقاء التافهة التي اسمها مرح أقول لها تذكري قول الله تعالى:<br />إذا زلزلت الأرض زلزالها وأخرجت الأرض أثقالها..<br />ماذا ستقولين لله وأنت تسخرين من رجال الله من عباد الله من المجاهدين في سبيل الله نعم هؤلاء هم الرجال أما الذين ترينهم أنت رجال فهم المنافقون الملعونون، لا شك أنك يهودية او من صهابنة العرب لعنة الله عليهم، وأنا أقول له:<br />وقد استحضرت قلبي وجمعت خسوعي :<br />اللهم يار رب الأرباب با خالق الأرض والسماوات أنت القائل اقتربت الساعة وانشق القمر، أسألك بأسمائك الحسنى وباسمك الأعظم الذي إذا دعيت به اجبت أن تنزل على مرح ما انزلته على من هجو رسولك الكريم صلى الله عليه وسلم، وتكبتها وتبقر بطنها وتخرج لسانها وتشل أطرافها، اللهم اجعل لها في كل حركة عذابا، وفي كل سكنة ارتيابا الهم ابعثها مع جالوت وفرعون وهامان واجعلها في الدرك الأسفل من النار، اللهم اسقها من الغسلين، وجرعها شجرة الزقوم يا رب يا رب فإنها طغت وتجبرت واتبعت سبيل المجرمين اللهم آمين اللهم آمين اللهم اجعل عقابها قبل عقاب الصهاينة الملاعين آمين آمين آمين والحمد لله رب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 14
subject = "تعقيب"
author = "كفى يا أبو أيمن جزاك الله خيرا"
posted = "2006-07-16"
text = "ما هاكدا نتعامل نحن المسلمون، فحتى لو أخطأت مرح فيجب ردها للصواب بالتي هي أحسن ان كانت مخطئة ، أو تجاهل تلك المداخلةان كانت متعمدة لأن هدا هو جواب السفيه.<br />فالمطلوب هو مناقشة ما هو أهم وليس التوافه، والأخد والعطاء في الكلام الدي لا يغني من جوع، فلنعد الى موضوعنا ولنفكر حقا فيما يمكننا تقديمه لاخواننا نصرهم الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 15
subject = "بوش بلاعة ارهابية كبيرة"
author = "عبد الرحمان ابن الهيثم"
posted = "2006-07-16"
text = "بوش بلاعة ارهابية كبيرة على العرب .العرب هم المسؤولين عن ما يحدث في كل من فلسطين المهلوكة وفي العراق المزدومة وفي لبنان اليتيمة.يجب وضع حد لما يقع في المدنيين واما اتخاد اجراءات وخيمة على الدول الثمانية.نحن قادرون على تحطيمهم في مدة 16شهرا وذلك في اعماق قلوبهم .حاكمتم ايران لانها ضد الاسود .وتقتلون فلسطنيين لانهم يدافعون عن وطنهم المنصور .واسقطتم دولة زدام المخلوع لانه ضدكم والان تريدون دخول لبنان وسوريا وقناة سويس هذه خطاكم لاكن ستبدأ خطانا ضدكم بتصفية الدم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 16
subject = "ارقام الحسابات"
author = "مصراوى"
posted = "2006-07-16"
text = "شباب ياريت نفكر في مساعدة اخونا المجاهدين ازاي احسن من الرد علي الخونة المنافقين دول, لو حد عنده ارقام حسابات بتاعت اغاثة اللبنانيين ياريت ينشرها ويأكدها القائمين علي الموقع, اصل ان شباب لبناني يقوم بالخرب العظيمة ديه بصراحة الواحد فخور بيهم انهم قادرين يعملوا حاجة كل الحكومات العربية الخونة مش قادرة تتحرك لا وكمان بتنتقد السيد حسن نصر الله ورجالته, اللهم انصر المجاهدين في كل بقاع الارش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 17
subject = "الموقف السعودي"
author = "وائل عباس"
posted = "2006-07-17"
text = "يا جماعة لماذا تتعجبون من الموقف السعودي مما يحدث في لبنان<br />يا جماعة حقهم<br />إنتم ترضوا تبقوا بتصيفوا في بيروت ومقضيين أحلى ليالي حمراء مع المومسات بعد حرمان عام كامل في دولة متزمتة<br />وبعدين ييجوا شوية عيال عاوزين يهزروا زي بتوع حزب الله ويعملولي رجالة ويخطفوا اتنين عساكر صهاينة<br />طب مش كانوا يستنوا لما تتعمل حفلة المطرب المهم محمد عبده اللي كان ها يحضرها أثرى أثرياء بدو الجزيرة وقطاع الطرق وتجار المانيفاتورة سابقا<br />دي قلة أدب<br />هم اللي إستفزوا إسرائيل تعمل كده في بيروت<br />ذنبهم إيه السعوديين المساكين يقطعو أجازتهم ويرجعوا ولا يروحوا يكملوها في سوريا ولا الأردن<br />خمستاشر ألف سعودي<br />مش كفاية طول السنة هاريين نفسهم يتفرجوا على روتانا والآرت والمزز اللبناني المعتبرة<br />ولما ييجي الصيف وقت التطبيق العملي يحصل كده<br />وسبعة آلاف مومس مسكينة ها يقف حالهم ومش ها يلاقوا ياكلوا<br />وكرخانات شارع الحمرا والأشرفية اللي فاتحة بيوت عمرانة ها تتقفل<br />ده إيه النحس ده يا ربي<br />مش معقول كده يا ناس<br />يا جماعة لازم نقدر ونتفهم الظروف الخاصة التي يمر بها السعوديون خصوصا العائلة المالكة والأمراء ورجال الأعمال<br />عاوزينهم يقضوا السنة الجاية كمان محرومين؟<br />ثم إن العيال بتوع حزب الله دول شيعة يعني روافض يعني كفرة وخونة زي بتوع العراق بالزبط ولازم يتبعتلهم واحد زي أبو مصعب الزرقاوي السلفي الوهابي المتسعود أمير الذباحين علشان يخلص على هؤلاء الخونة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 18
subject = "أيها المسلمون اياكم والفتنة"
author = "ندى أحمد الصالح"
posted = "2006-07-18"
text = "إلى الشعوب العربية والآسلامية جمعاء<br />انتبهوا للفتنة الحاصلة والتي ستحدث<br />انتبهوا لما يحصل في العراق من أحداث مؤلمة حيث تشير في حصولها للمسلمين الشيعة وهذا لايخفى عليكم أن من يحدث هذه الفتنة وفي هذا الوقت بالذات هم الأمريكان وبايعاز من اسرائيل وما يحدث بالهند أيضا وآتية بلدان أخرى لتشتيت الرأي العام ولإبعاد الأنظار عما يحدث في لبنان !انتبهوا جموع المؤمنيين فالعراق يحكمه الأمريكان وهم من شاع الفتنة به فهل سمعت من قبل ومن خلال تاريخ العراق عن وجود طائفية رغم وجود أكثر من ديانة داخل العراق فقد كانوا يعيشون بتوافق تام ولكن متى حصلت هذه الفتنة ومن عبد الطريق لها ؟ انتبه أخي العزيز ولا تنفعل بأي خبر تسمعه حتى تحلله وترجع العقل في ذلك اعلم أن الفتنة سوف تكون في أوجها فكن حريصا على توجيه عدائك لليهود وفتش عن أي فتنة في أي بقعة في العالم لتجد اليهود ورائها حيث يجندون ذوي الإيمان الضعيف من كل ظائفة ليكون سلاحهم<br />اتحدوا أيها المسلمون اتحدوا بوجه أعدائكم تنتصروا بإذن الله<br />حفظ الله شعبنا في لبنان وأيده بنصره ووحد صفوفه ونصره بنصره<br />وتحياتنا للمقاومة الإسلامية سدد الله رميكم وحماكم وجعل بينكم وبينهم سدا وغشي على أبصارهموجعل فتنتهم في أنفسهم وأدخل اللهم الرعب في قلوب أعدائك واهزمهم وانصر حزبك واجعلهم مع الحق وأنصار الحق ورافعي راية الحق اللهم انصر الحق واظهره وازهق الباطل<br />ان الباطل كان زهوقا<br />حفظكم الله بحفظه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 19
subject = "رسالة الى الامة العربية جمعا"
author = "عبداللة النهدي"
posted = "2006-07-18"
text = "ياامة الاسلام اسرائيل خربت وطننا العربي لبنان وفلسطين دمرت وقتلت وشردت اين نحن من هؤلا الخونة اين العرب هل يبقى من الامه العربية حسن نصر اللة ابوهادي زعيم الامة العربية اين حكامنا العرب لماذا لايدعمو اخواننا في لبنان وفلسطين احب اقول وبكل صدق اتركو القيادة اية العرب جميعا لزعيم الامة حسن نصر اللة افداك بعمري ياحسن نصر اللة اللة ينصركم ويثبت اقدامكم والى الامام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 20
subject = "الحرب..الحرب"
author = "لبنانية"
text = "الحرب لست كلمة سهلة ولا احد يعرف ما معنى الحرب الا الذي عاشها فعلا ونحن اللبنانيون عشنا الحرب بكل ما في الكلمة من معنى ..طفولتي كانت في الحرب سمعت اصوات الانفجارت والصواريخ في كل مكان ولم انسى صوتها يوما ..واليوم المائساة تتكرر ..نفس الاصوات التي طالما كرهتها اسمعها اليوم ترن في اذني وتدق باب الوطن الحبيب الذي طالما عمل البنانيون طوال سنين على اعادة اعماره حتى امسى ذلك البلد الجميل اما بيروت فهي ست الدنيا ..احبها واعشقها ..مدينة غلبت النور التي غلبت الظلام في وقت كان الناس يموتون والاطفال الابرياء لا تسمع اصواتهم..وكم من مرة تمنيت ان يعدو وطني كما كان ..وكانه حلم لم يكتمل ..اليوم الاسرئليون الحاقدون يدمرون وطني من جديد وما من معين .يا رب ساعدنا سا رب"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124449/http://harb.20at.com:80/article.php?sid=9"

