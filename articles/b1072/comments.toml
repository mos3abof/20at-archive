[[comments]]
order = 6
subject = "خيانة الحكام العرب"
author = "حمدي"
posted = "2006-07-15"
text = "الحكام العرب اختاروا ان يقفوا في خندق اعداء الامه واانكشفت بشكل واضح عمالتهم<br />ال سعود تبا لكم ايها العملاء انتم ومبارك وعبد الله<br />اين علماء ال سعود لماذا لا نسمع لكم صوتا<br />اين علماء الازهر ؟<br />اللهم انصر مجاهدي حزب الله<br />اللهم ايدهم بمدد من عنك<br />اللهم ثبتهم وامنحهم القوة والصبر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 7
subject = "مغامرة"
author = "مغامرة"
posted = "2006-07-15"
text = "للاسف، عموم الشعب العربي لا يفهم ما يحدث و الشباب جاهل و لا يعرف خبايا السياسة و قد يكون بسبب تغييبه اصلا عن الحركة السياسية، و هو لا يفهم شيء عن الحرب لانه لم يعاصرها، قد يحتاج ان تتهدم البيوت على راسه و على راس اسرته وان يفقد اعضائه و ان يرى ابويه اما قتلى او مقعدين او مبتوري الاطراف لكي يعرف معني الحرب . هم فقط يريدون حريقة و يزيدوها نارا و كأنها لعبة جميلة بها انوار و شعل . و هم للاسف ايضا فقدو الاحساس بالاخرين فلم يحسول بما يحدث لاخوانهم في العراق او فلسطين بل يريدونه ايضا للبنان و سوريا و لو طالو الجميع فليكن و لكن بشرط لا يطولهم هم . و انا اتحدى انهم وقت الحرب سيصمدو بل كل منهم سيبحث عن طريقة للهروب . اتعلمون لماذا . لانهم لا يعلمون سبب حقيقي لوجودهم في الحياة ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 8
subject = "غباء مطلق"
author = "ابو العدالة"
posted = "2006-07-15"
text = "ماذا ربحت لبنان من هذة العملية غير الخراب والدمار وما هو النصر حسب مفهوم نصر اللة انتم لاتملكون القوة التي تملكها اسرائيل لماذا الانتحاراليس النبي صلى اللة علية وسلم في بداية دعوتة ولماكانت قوتة ضعيفة لم يحارب بل ذهب الى الحبشة ليسلم على جماعتة ويحفظ دمائهم ثم هاجر الى المدينة ولم يقاوم لانة عرف انة لاطاقة لة بالمشركين في حينة ولما اكتملت قوتةواصبح ندا لهم قاتلهم وتغلب عليهم هذا التفكير الصحيح اما غباء نصر اللة فجلب الدمار والقتل للابرياء ويتحمل وحدة امام اللة هذة الدماء واذا كان النصر بمفهوم نصر اللة هو خراب البلد فنقول لة مبروك والى المزيد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 9
subject = "الي صاحب التعليقين السابقين"
author = "محمد سالم _ مسلم سني"
posted = "2006-07-15"
text = "الي خادم ال سعود وكلبهم الوفي صاحب التعليقين السابقين<br />اسمع ايها الكلب يا خادم اسيادك المطيع<br />نعت شباب امتنا بالجهل والحق يقال انك ومن علي دربك اجهل خلق الله<br />فانتم لا تعرفون معني العزة والكرامه<br />كيف لا وقد تعودتم علي الانحناء وتقبيل ايدي سادتكم<br />اسمع يا مقبل الايدي والانوف<br />الحرب بدات ولتمت بغيظك انت وسادتك<br />ورجال حزب الله لن يفت في عضدهم خيانة امثالك من خدم الحكام العرب<br />فهم قد راهنوا علي ربهم اما انت فعلبي من راهنت ايها الشقي التعيس<br />هم فائزون في الاحوال فهم بين النصر والشهاده<br />اما انت ومن علي شاكلتك من خدم ال سعود<br />فخاسرون خسرانا مبينا وسيلحقكم الذل<br />والعار في الدنيا والاخره<br />مسكين يامن لا تعرف معني الكرامه<br />مسكين يامن لا يعرف معني الحريه<br />اسمع يا كلب ال سعود المطيع<br />رجال حزب الله اشرف من في هذه الامه شئت ام ابيت وشاء سادتك ام لم يشاؤا<br />اللهم انصر المجاهدين في حزب الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 10
subject = "اسد المجاهدين حسن نصر الله"
author = "احمد حلمي"
posted = "2006-07-15"
text = "بدون كتر كلام .. وخطب .. اليك شريط الاخبار الجمعة الساعة الثانية عشر مساء .. أرفع رأسك وأنت تقرأ فلازال هناك بطل يدعى حسن نصر الله :<br />* حسن نصر الله : انظروا الى البارجة التى دمرت بيوت وقتلت الناس انها تحترق الآن وتغرق بجنودها .<br />* الجيش الصهيونى يعترف باصابة البارجة الاسرائيلية نتيجة استهدافها بالصواريخ .<br />* مصدر من الجيش الاسرائيلى : البارجة اصيبت اصابات بالغة .<br />* الجيش الاسرائيلى يعلن اعتبار اربعة من جنوده مفقودين من قوة البارجة المصابة .<br />* عائلة أحد الجنود الاسرائيلين الأسرى تناشد السيد حسن نصر الله الحفاظ على حياة ابنهم .<br />* صواريخ المقاومة الاسلامية تنهمر على مستعمارات العدو واستهداف مستعمرة فى<br />* استهداف مقر قيادة المنطقة الشمالية فى صفد واصابات بالغة فى قيادة جيش الاحتلال .<br />* المقاومة الاسلامية تعاود للمرة الثالثة دك مستعمرة بهاريا بعشرات الصواريخ والتيار الكهربائى ينقطع عنها بعد استهداف محطة الكهرباء .<br />* صواريخ بعيدة المدى للمقاومة الاسلامية على الجليل .<br />* الطائرات المروحية للعدو تحلق فوق البارجة المصابة .<br />* نيران لازالت تتصاعد من البارجة المصابة .<br />هل رفعت رأسك يا أخى ... نزلها تانى بقى وأنت بتقرأ الخبر ده :<br />* مصدر سعودى يحمل حزب الله مسئولية ما يحدث .<br />* مصر والأردن يحذران من مغامرات تتحمل الشعوب نتيجتها<br />* حسن نصر الله فى كلمته للحكام العرب : لم نراهن عليكم يوما .. لا أريد أن أسألكم عن تاريخكم ( بيعايرهم )<br />اخيرا تحية لنضال البطل حسن نصر الله والمقاومة فى لبنان وفلسطين .. وليذهب حكام العرب الى الجحيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
