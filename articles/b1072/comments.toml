[[comments]]
order = 38
subject = "إسرائيل والثالوث العربي المتصهين في عملية إخصاء لما تبقى للفحولة"
author = "أحمد الجزائري"
posted = "2006-07-24"
text = "إن ما يحدث في فلسطين ولبنان هو عملية إخصاء لما تبقى للفحولة العربية في هذا الزمن الردئ فقد ينزع سلاح حزب الله وقد يجهض مشروع حكومة حماس بهذا التآمر الذي لم يشهد مثله في التاريخ القديم أو المعاصر لكن ما يفعله أبطال المقاومة الإسلامية حماس وجزب الله هو عبارة عن ثقب في جدار الصمت المطبق على الرجال الشرفاء في هذا العالم ونحن في الجزائر نقول للإخواننا إن شرارة المقاومة إنطلقت ولن تنطفأ ولكم عبرة في تاريخ الجزائر الطويل الذي حفض الدرس جيدا ففرنسا أخمدت ثورة الأمير عبد القادر ،فجاءت بعدها ثورة الشيخ بوعمامة ، ثم المقراني ، ثم ثورة أولاد سيد الشيخ تتالت التضحيات فكل هذه الثورات مهدت لثورة 1 نوفمبر 1954 فحتى إن هزم حزب الله وأسقطت حكومة حماس كما يروج له في الدوائر الغربية والثالوث العربي المتصهين مصر ، الأردن ، والسعودية فاليعلم هؤلاء ،أن المقاومة باقية ما بين واحد يشهد أن لاإله إلا الله وأن محمد رسول الله والقرآن يتلى فتلحقم اللعنة أيها العملاء وستنتهي عروشكم المتهاوية لكم موعد مع الله يوم الحساب . وفي الآخير حسبنا الله ونعم الوكيل ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

[[comments]]
order = 39
subject = "من أنت ؟"
author = "النهى"
posted = "2006-07-26"
text = "عزيزي القارئ إليك هذه الأسئلة وأجب عليها بتأني :<br />1- من خالقك ؟ ومن تعبد ؟<br />2- ما هو كتابك ؟<br />3- من هو رسولك ؟<br />4- من هو حبيبك ؟<br />5- من هم أعداءالله الذي ذكرهم في كتابك المنزل؟ وأعداء أنبيائه؟<br />6- من هم أقرب إليكم أيها المسلمون رحمة وكما تم ذكرهم في القرآن الكريم ؟<br />1- الله ، الله<br />2- القرآن<br />3- محمد صلى الله عليه وآله وسلم<br />4- محمد صلى الله عليه وسلم<br />5- اليهود<br />6- المسيحيون<br />إذا كانت جميع أجوبتك صح فابتسم فأنت مسلم !<br />هل عرفت مغزى هذه الأسئلة عزيزي القارئ ؟<br />الاسلام واحد شهادة أن لا الله إلا الله<br />محمد صلى الله عليه وآله سلم رسول الله<br />هل فهمت عزيزي القارئ ؟<br />اتحدوا أيها المسلمون ولا يحيدكم زارعوا الفتنة ومروجوها عن الحق فقط كلما شت ذهنك وأثارت التعاليق السخيفة حفيظتك وجعلتك تفكر أنك سني أو شيعي 0<br />فاذهب إلى تلك الأسئلة وجاوب عليها لتعلم أنك مسلم فابتسم00!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

