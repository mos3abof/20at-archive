order = 36
subject = "النصر ات ات ات باذن الله"
author = "معكم"
posted = "2006-07-24"
text = "بسم الله الرحمن الرحيم<br />اخوتي<br />اخوكم من الجناح السني لهذه الامةالاسلامية<br />في البداية احيي احبتي رجال المقاومة الاشاوس و على راسهم القائد المجاهد سماحة سيدي حسن نصر الله حفظه الله<br />لا اخفيكم كنت طيلة الايام الفارطة جد متوتر لا ابارح الشاشة الا قليلا ابكي خوفا الا ننتصر و ابكي ايضا لاني و جدت اخيراأبطال هذه الامة الذين كنت اقرأ عنهم فقط في كتب التاريخ وأشاهدهم في الافلام التاريخية.<br />وكنت اعجب من السر وراء يقين أحبتي في حزب الله بالنصر.<br />ولكني حين قرأت كتاب الله في سورة الاسراء و أواخر سورة المجادلة و في سورة المائدة ابتداءا من الاية 51<br />ادركت السر واطمأن قلبي للنصر<br />الله معكم<br />الله ينصركم<br />ولنبق صفا واحدا سنة وشيعة فقد قال الرسول الاشرف صلى الله عليه و أله و سلم المؤمن أخو المؤمن...<br />و ٌقال الله جل وعلى<br />ولا تنازعو فتفشلو فتذهب ريحكم...<br />يا رجال المقاومة الباسلة<br />أحييكم واشد على أيادييكم و ابوس الارض تحت نعالكم و اقول افديكم<br />أما الحكام الخونة وخصوصا<br />خادم الحرمين أمريكا و اسرائيل ال سعود الخونة<br />ال هاشم الخونة<br />حسني مبارك الخائن وعصابتة<br />فأقول لهم رغما عن انوفكم التي انتفخت في مواخيركم<br />فان النصر ات ات ات ان شاء الله<br />و ارتقبوا انا معكم مرتقبون<br />و الله اكبر<br />والعزة لرسوله وللمؤمنين<br />و يومئذ يفرح المؤمنوم بنصر الله<br />ال"
