text = "يا مرحبا بالمعارك<br />هى دى الرجولة ولا بلاش يارتنى كنت اقدر اروح و احارب ولاد الكلب دول هناك فى لبنان<br />هما دول الرجالة يخطفوا عساكر و يقصفوا بالصواريخ اقصفوا البارجات اسقطوا الطائرات<br />وفققم الله و رزقكم احدى الحسنيين<br />النصر او الشهادة"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124449/http://harb.20at.com:80/article.php?sid=9"

