text = "عزمي بشارة للإسرائيليين: حزب الله لن يهزم<br />قال النائب العربي في الكنيست عزمي بشارة، أمس، أن حزب الله لن يُهزم، مشيراً إلى أن إسرائيل تنفذ مجازر ضد لبنان وعملية إبادة مجتمع ضد الشيعة في لبنان.<br />وفي مقابلتين مع \"يديعوت أحرونوت\" و\"هارتس\" حول الحرب في لبنان، رأى بشارة أن الحرب على لبنان حرب أميركية بأدوات إسرائيلية. وقال في رأيي جميع العواصم العربية معرضة لتهديد إسرائيلي مباشر أكثر بكثير من تهديد حزب الله لإسرائيل. ولقد قرروا في لبنان أن يكون لديهم أسلحة رادعة لإسرائيل، لكن من الذي أوصلهم الى وضع استعمال هذا السلاح.<br />وأضاف بشارة لا يمكن التسليم بوضع تستمر فيه إسرائيل بالتدخل كل الوقت بما يجري في جنوب لبنان. لقد رآكم حزب الله قوة وأقام بنى تحتية من أجل ألا يكون سهلاً على إسرائيل الدخول إلى لبنان كما حصل عام 1982وهذا ما ترونه بالفعل. ولقد عزز هذا لدى اللبنانيين ما يقوله حزب الله من أن الأمر هو استراتيجية دفاعية.<br />وأشار بشارة إلى أن شعبية حزب الله في العالم العربي ما فتئت تسجل أرقاماً قياسية غير مسبوقة. في رأيي، لن تنجح إسرائيل في أن تحقق إنجازات عسكرية، وحتى لو حصل هذا فإنها لن تفلح في أن تترجمها إلى إنجاز سياسي لأنها لن تجد لها شريكاً في لبنان. ستتورط إسرائيل في المستنقع اللبناني، ولذا عليها أن تبحث عن أول سلم للنزول عن الشجرة، فلن يهزم حزب الله."
