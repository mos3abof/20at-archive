text = "حزب الله نصره الله بنصره وأيده بجنوده له شكر غظيم فبالاضافة إلى رفع رؤوسنا وكرامتنا فقد نزع أقنعة وجوه لشيوخ الدين الذين نافسوا الفنانين في الظهور في التلفزيون أو المذياع أو الجرائد أو المجلات وكلامهم عن الجهاد وأعداء الدين والايمان0000الخ<br />وعند حرب لبنان اكتشفنا زيفهم وطائفيتهم البقيضة ونتانة مقالاتهم وجبنهم وما كانوا الا شيوخ للسلاطين تبا لكم ألا تخافون الله !!؟؟<br />انظروا إلى كتاب جريدة الرأي العام الكويتية الشيخ محمد العوضي ووائل الحساوي المتشدقين في الدين وسقط القناع من وجههم والحمدلله اكتشفنا عنصريتهم وكرههم لكل ما هو 000<br />نصرالله المقاومة الاسلامية وأيدهم بجنوده وحفظهم بحفظه"
