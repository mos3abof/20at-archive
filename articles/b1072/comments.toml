[[comments]]
order = 48
subject = "بعد الإخفاق في القضاء على قدرات حزب الله الاعتماد على القوة الجوية يدخ"
author = "محمد سالم -مسلم سني-مصري"
posted = "2006-08-04"
text = "ألقى فشل إسرائيل حتى الآن في كبح الهجمات الصاروخية لحزب الله، باستخدام ترسانتها من الطائرات والمروحيات المقاتلة والطائرات بدون طيار، بظلال من الشك في النظرية القائلة بأن الاعتماد على القوة الجوية هو أفضل السبل للفوز بحرب في العصر الحديث.<br />وقد تضر إخفاقات القوة الجوية في مواجهة مقاتلي \"حزب الله\" الأقل بكثير من حيث القدرة العسكرية بصادرات اسرائيل من أنظمة التسلح التي تعد الميزة الرئيسية في بيعها هي أنه تم اختبارها في معارك. كما تلطخت سمعة الطيارين والمخططين الاسرائيليين التي لم تكتسب بسهولة بسبب سقوط أعداد هائلة من القتلى في لبنان.<br />في الوقت الراهن يتجنب كبار الضباط الاسرائيليين الحساب علناً، حيث أشاروا الى أن القوات الجوية شنت نحو سبعة آلاف غارة، وهو نطاق يعني حدوث بعض الأخطاء لا محالة.<br />لكن الدهشة تعم في الخارج، خاصة في أسواق الأسلحة التي تهيمن عليها الصادرات الاسرائيلية، وتقدر بأكثر من ثلاثة مليارات دولار سنويا، وبين خبراء الاستراتيجية الذين طالما اعتقدوا أن القوة الجوية هي اكثر السبل دقة وأجدرها بالثقة للتغلب على أي عدو.<br />وقال روبرت هيوسون، رئيس تحرير نشرة \"جينز\" للأسلحة: \"نحن نتحدث عن أصعب ما يمكن التوصل اليه في القتال المستقبلي، وقد اجتهدت إسرائيل في بناء أنظمة معقدة تقدمت بها على العالم بناء على فهم أنها كانت محمولة في معارك. هذا بالتأكيد سيجعل الناس يستجوبون مندوبي المبيعات اكثر قليلاً، لأنه يبدو أنه في ساعة الحاجة لا تعمل هذه الأشياء بالجودة التي تشير اليها الدعاية لها\".<br />وتوقعت باربرا اوبال روم، من نشرة \"ديفينس نيوز\" تأثر صفقات التصدير الاسرائيلية الكبرى، ومن بينها صفقة بعدة مليارات من الدولارات لأهم زبون لديها وهو الهند. ووصفت إسرائيل بأنها عضو في نادي الدول المتقدمة عسكرياً والتي تفتخر قواتها الجوية بمكانتها في مجال التخطيط للحروب.<br />وقالت إن \"المتحمسين للقوة الجوية سيلعقون جراحهم وبالتأكيد سيعودون لمراجعة مجادلاتهم\". وأضافت \"أنا واثقة أنه سيكون هناك تواضع اكثر كثيرا الآن\".<br />رئيس أركان القوات الجوية الذي كان فيما مضى يفرط في الإطراء على القدرات عالية التقنية لقواته، دق على وتر مختلف حين حاول شرح قصف قرية قانا هذا الأسبوع الذي أودى بحياة 54 مدنياً.<br />قال البريجادير جنرال عمير ايشيل الذي لام \"حزب الله\" لإخفائه عناصره في مناطق مكتظة بالسكان: \"القدرة محدودة على التعامل مع هذه الساحة بطريقة متجانسة لضرب الإرهابيين وحدهم وفي مرة واحدة\".<br />ويعود استخدام القوات الجوية في القيام بحملة الى الحرب العالمية الثانية على الأقل. ولكن مع التأكيد في الحروب الأخيرة على خفض الخسائر البشرية بين المدنيين والسيطرة سريعا على الأعداء الذين تتم هزيمتهم، فإن كثيراً من المخططين العسكريين الغربيين لا يرغبون بشكل متزايد في الاستغناء عن القوات البرية.<br />فقد استطاعت القوات الصربية الى حد كبير الاحتماء والنجاة من قصف حلف شمال الأطلسي لكوسوفو عام .1999 كما أثار مقتل مئات الأبرياء في الهجمات الجوية رد فعل عنيفاً فيما بعد في اوروبا.<br />القوات الاميركية التي اعتمدت في الأساس على القوة الجوية خلال حرب الخليج الأولى عام 1991 استخدمت دبابات وجنوداً اكثر بكثير خلال غزوها العراق عام 2003 حين أطاحت بالرئيس العراقي صدام حسين. لكن مع تمرد عراقي عنيف منذ ذلك الحين فإن وزارة الدفاع الاميركية (البنتاغون) ما زالت تتعرض للانتقاد لعدم نشرها عدداً كافياً \"من الجنود على الأرض\".<br />وقال هيوسون \"هناك إدراك متزايد أنه بعد الحملة الجوية فإنك تحتاج الى رجال يرتدون دروعاً ودبابات لإنهاء المهمة\".<br />وينظر الى القوة الجوية على أنها وسيلة لخفض المخاطر التي تتعرض لها القوات البرية، وهي مسألة تثير قلقاً داخلياً كبيراً في اسرائيل بالنظر الى اعتمادها على المجندين المراهقين.<br />ويقول المخططون العسكريون الإسرائيليون إن أنظمة المراقبة الجوية المتقدمة والأسلحة التي توجه بدقة تعني أن من الممكن استهداف مقاتلي حزب الله، فيما يستثنى المدنيون في الجوار الى حد بعيد. لكن معظم القتلى اللبنانيين كانوا مدنيين.<br />وقال هيوسون \"ما يهم في موقف مثل هذا هو ألا تقتل الناس الذين تحاول أن تحررهم... هذا هو الإخفاق الاستراتيجي الكبير في الحملة الاسرائيلية\".<br />وأصدر رئيس الوزراء الاسرائيلي إيهود أولمرت هذا الأسبوع أوامره بتوسيع نطاق الاجتياح البري للبنان. ويبقى رؤية كيف سيكون أداء القوات ضد مقاتلي حزب الله الذين شجعهم ما يرون أنه إحجام من العدو عن القتال وجهاً لوجه.<br />الانتكاسات في إخضاع حزب الله قد تكلف اولمرت ثمناً دبلوماسياً كما ستعزز ايران وسوريا اللتين تدعمان الحزب وتنظر اليهما الولايات المتحدة، حليف اسرائيل، على أنهما عدوَّان لها.<br />وكتبت \"وول ستريت جورنال\" في افتتاحيتها يوم الثلاثاء تقول إن \"من الواضح أن جيش الدفاع الإسرائيلي أساء تقدير قدرات حزب الله وبالغ في تقدير قدرته على هزيمته من الجو\".<br />وأضافت \"الدعم الأميركي لاستراتيجية اسرائيل كلف (الرئيس الأميركي جورج) بوش الكثير وعلى السيد اولمرت أن يفهم أنه (الدعم) لن يستمر اذا افتقر للإرادة اللازمة للهيمنة عسكرياً في أسرع وقت ممكن\"."
