order = 47
subject = "لماذا هذا الغضب من الرافضي الارهابي حسن نصرالله"
author = "محمد سالم -مسلم سني-مصري"
posted = "2006-08-04"
text = "كتب : طاهر زعرور<br />ايام زمان ... كان الفن اللبناني مرتبط بوقار فيروز وصوت وديع الصافي ونصري شمس الدين ... وحتى عندما كان اللبنانيون يتدلعون على الشاشة كان اقصى دلع لهم ممثل بطروب وميادة ... كان الدلع يتم بوقار قبل ان تدخل رساميل ال سعود الى لبنان فتعزل فيروز ووديع الصافي وتحول مومسات شارع الحمراء الى فنانات ومطربات ... هذه تبوس الواوا وتلك تمص الواوا<br />المال السعودي هو وراء انشاء جميع الفضايات اللبنانية ... وفضائية ال بي سي مثلا المملوك نصفها للوليد بن طلال والنصف الثاني لحزب الكتائب هي المحطة الوحيدة في الكرة الارضية التي تقدم فيها مذيعة الاخبار نشرتها وهي بقميص نوم ... وبعودة رفيق الحريري الى بيروت بمليارت سعودية اصبح النظام اللبناني يدار من الرياض فأريد للسياسيين اللبنانيين ان يبوسوا الواوا ايضا .. ولا اجد فرقا بين هيفاء وهبي ووليد جنبلاط ... الاثنان يبوسان الواوا ليتمتع بهما امراء ال سعود<br />لبنان هي الدولة الوحيدة في العالم التي تحبل بزعيم خلال 24 ساعة وتشخه وتسلمه مقاليد الحكم وتجعله زعيم اغلبية في البرلمان ... هكذا خبط لزق .... مع ان الولد كل خبرته قبل ان يصبح زعيما كانت في النسوان<br />هل عرفتم اليوم لماذا هذا الغضب من الارهابي الرافضي حسن نصرالله الذي اتهمه عميل المخابرات الاردنية ابو مصعب الزرقاوي بالعمالة لاسرائيل ؟ قبل ان تبيعه المخابرات الاردنية التي دربته ليموت فطيسا في بغداد<br />ان جريمة حسن نصرالله انه خرب المشروع السعودي في لبنان ... وقطع ارزاق الاف المومسات اللواتي يعملن في فنادق وكازينوهات وبارات نصفها لال سعود والنصف الاخر لحكام الكويت الذين مثلهم وزير خارجية لا يحسن التحدث بالعربية رغم انه يحمل لقب دكتور<br />البيان السعودي الذي ندد بحزب الله - ولم يندد حتى هذه اللحظة باسرائيل - وجريدة الشرق الاوسط المملوكة للامير سلمان والتي نشرت اليوم عشر مقالات كلها ضد حزب الله تتحجج بأن حزب الله لم يستشر السعودية عندما اسر الجنديين وسارع ملك الاردن الى اصدار بيان مماثل<br />عجيبة ... اذا كان الملك حسين الذي لم يخبره السادات بموعد الهجوم في اكتوبر قد قام بنفسه بركوب طائرة الى تل ابيب لاخبار اسرائيل بنية السادات فكيف كانت حرب اكتوبر ستنتهي لو ان السادات اخبر الملك حسين فعلا بخططه<br />ومثل هذا يقال عن ابنه عبدالله ... فهل كان عبدالله ملك الاردن يظن ان حسن نصر الله سيتصل به ليخبره بموعد الهجوم لاسر الجنود الاسرائيليين مثلا وهو يعلم ان الملك الاردني ينام ويأكل ويشرب ويشخ في حضن المخابرات الاسرائيلية<br />قد نعتب على حسن نصرالله لانه لم يخبر السعوديين بنيته ... ولكن حسن نصرالله قرأ مثلنا ما نشرته محطة ارملة الملك فهد من ان الشعب السعودي مشغول بعمليات تطويل(----) تكلف ملايين الدولارات ومن غير المعقول ان يتصل نصرالله بهم لاخبارهم بعملية عسكرية قد تفسد عليهم تطويل (----) التي يستلونها بمجرد دخول مطار بيروت ... والا ما معنى وجود عشرات الالوف من السعوديين الذكور في بيروت بحجة السياحة<br />هل يتقاطر السياح السعوديون الى لبنان للتزلج على الجليد او زيارة مغارة جعيتا او المتحف الوطني ؟<br />كل مكاتب السياحة تعلم ان السياح السعوديين لا يغادرون فنادقهم لان الفنادق تؤمن لهم المومسات حتى باب الغرفة<br />من حق الاردن والسعودية والكويت ان يزعلوا من حسن نصرالله لانه اسقط عنهم ورقة التوت فهذا الشاب اللبناني الملتحي يقود حرب عسكرية على درجة عالية من الحرفنة رغم انه لا يحمل نيشان واحد من نياشين الجنرال خالد بن سلطان<br />نصرالله قصف المدن الاسرائيلية واغرق احدث باخرة اسرائيلية وقضى على الموسم السياحي في اسرائيل واجبر مليوني اسرايلي على النوم في الملاجيء حتى يجربوا بعض ما يعانيه سكان غزة الذين لا ملاجيء لهم ومع ذلك لم يخسر حزب الله حتى اليوم شهيدا واحدا ولم يتمكن جيش اسرائيل المجحفل من احتلال شبر في لبنان<br />صحيح ان الطائرات الاسرائيلية تعربد وتدمر الجسور ولكن البركة بشركة سولدير السعودية فهي التي ستبني الجسور بعد ذلك .... وبدل ان يتفلسف ملك السعودية ... لماذا لا يصدر اوامره الى مئات الطيارين السعوديين بحماية اجواء لبنان ... ام ان المساعدة السعودية مقصورة على المومسات وفضائيات التعريص<br />يا اخي ... لا نريد حسن نصرالله .. بلاش ... نحن ايضا لا نريده فهو شيعي رافضي ارهابي ايراني على حد تعبير الزرقاوي صديق الملك عبدالله ملك الاردن ... ولكن الموانيء والجسور التي تدمرها اسرائيل ليست مملوكة لحسن نصرالله وجماعته من شيعة لبنان فالشيعة في لبنان هم افقر اللبنانيين واحياء الشيعة في بيروت وفي الجنوب هي الافقر وليس بين الشيعة في لبنان شرموطة واحدة من شرموطات فضائية رفيق الحريري والامير الوليد .. والشباب الذين يمطرون اسرائيل بالصواريخ كلهم من اللبنانيين الفقراء الشيعة الذين تعلموا فنون النزال دون ان يحملوا نياشين الامير ابو شخة فتوة الصحراء خالد بن سلطان<br />مذيعات تلفزيون شيعة لبنان يظهرن باللباس الشرعي الوقور ... ولن تجد مطربات بوس الواوات على شاشات الشيعة في لبنان او ايران<br />لماذا لا تجرب الجامعة العربية اجراء انتخابات لزعامة الامة العربية بين جميع حكام الدول العربية في كفة ... وحسن نصرالله في كفة اخرى ... النتيجة ستكون بالنسبة لكفة الزعماء العرب : لم ينجح احد<br />المسيحيون العرب في فلسطين ومصر والاردن وحتى لبنان يناصرون حسن نصرالله اكثر من الشيعة انفسهم ليس لان المسيحيين قرروا التشيع وانما لان حسن نصرالله اثبت انه شاب عربي لبناني نظيف ويحمل هموم وطنه ويفكر بالاسرى الاردنيين في سجون اسرائيل في وقت يتبادل فيه الملك وابو مازن البوس ومصمصة الخدود مع اولمرت في العقبة<br />من يقرأ جريدة الشرق الاوسط اليوم يصاب بالغثيان والتقيؤ ... حتى ايطاليا والدانمرك نددت باسرائيل وجرائمها ...<br />بصراحة ... اتفوه على هيك امة عربية ترضى بوجود مثل هذه الحثالات على رأس اجهزة الحكم"
archived = "2006-11-02"
