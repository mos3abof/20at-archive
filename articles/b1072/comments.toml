text = "السلام عيكم<br />اليكم طريقة لتكون في صف المقاومة من مكانك ، باستخدام skype ، حيث نقوم بارسال رسائل الى الاسرائيلين المستخدمين لهذا المشغل نقول لهم فيها اننا مع المقاومة واننا سنذهب للقتال الى صف لمقاومة كقنابل بشرية ، او نطلهم على اخر انتصارات المقامة ، فهذا كما نعلم يؤرق اليهود لانهم شعب جبان وهذا يزداد من خوفة ( لقد استخدمة هذه الطريقةخلال الايام الماضية ويوم عن يزداد قلقهم) .<br />ملاحظة :ارسل الرسائل باللغة الانجليزية<br />اذا كنت تعرف العبرية ساعدنا بعبارات نستطيع ان نعمل لها نسخ وقص .<br />ملاحظة : اذا كنت تريد جملة تريد ان ترسلها او تستفر عن الطريقة ابعث الي على oneway054@yahoo.com<br />ملاحظة : يجب ان نكثف جهودنا لانه سيتم تجنيد المزيد من الجنود يوم الاحد لذلك من الرائع ان نبعثهم للجبه وهم مرعوبون من القتال .<br />شكرا لتعاونكم"
