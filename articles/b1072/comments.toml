order = 44
subject = "العرب والوهم وسطوة الدين"
author = "ابو العدالة"
posted = "2006-08-02"
text = "لا ادري لماذا ومنذ اكثر من 65 سنة ونحن نجعجع ونرعد ونزبد دون جدوى بل بالعكس كل بضعة سنين تهدم علينا بيوتنا وتخرب اوطاننا ويهلك اطفالنا ثم نعود لنفس العربدةهل الخلل في مفاهيمنا ام هي الطبيعة الهمجية اللتي نتمتع بها اصلا واللتي تم تغليفها بالدين من قبل اناس فاشلين لم يستطيعو ان يكسبو عيشهم الا بارتداء العمامة وممارسة الخطب لسوق الاف بل ملايين المغفلين الى مايتماشى مع مصالح هؤلاء الدجالين اليس حريا بنا ان نعيد النظر من خلال قرائة واقعية لما نمر بة شرط عدم الاستماع الى الدجالين من رجال الدين او السياسيين اقول نعيد النظر في حساباتنا المبنية على الخرافات ومبدا العناد وتحمل الظربات تلو الاخرى ونقول بعد كل هزيمة هذا هو النصر المبين اليس من حق اطفالنا ان يعيشو بسلام اليس من حقنا ان نعيش مثل الاخريناذا اردنا ذلك فاول خطوة على الطريق الصحيح هي التحرر من وصاية رجال الدين والقدسية الزائفة اللتي وضعوها لانفسهم وهم اسفل السافلين"
archived = "2006-11-02"
