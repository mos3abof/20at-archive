text = "ان آجلا او عاجلا سيتم وقف اطلاق النار ..دا طبعا بعد كل الطرحات الواقعيه منها والهزليه ..وحنلاقى نفسنا بدل ماكنا بندور ازاى نحل مشكلة فلسطين بندور ازاى نحل مشكلة لبنان...وازاى نرجع اسرائيل الى خطوط ما قبل الحرب...دا غير قوات الأمن الدوليه اللى مش عارفين لأمتى وفين ومنين ..وكل ده عشان احنا بنشتغل غلط....بنبنى عاشر دور قبل ما نحط الأساس...بنعمل قمه عربيه من غير مانعمل قاعــــــــده عربيه لأن مافيش قمه من غير قاعده ؟؟؟؟وعشان نعمل قاعده صحيحه علينا بالآتى<br />1- فترة صمت تام ومراجعه للنفس ثــم تحديد موقف صريح واضح من كل بلد عربى بكل الوضوح والحريه ..بعيدا عن الزيف والمغالاة<br />2-كشف لجميع الأوراق والحقائق بلا مواراه او لف او دوران<br />3-عرض لجميع الخلافات والمنازعات وتشكيل لجنه لحل هذه الخلافات اولا.......<br />4-استبعاد هذا الجيل بما فيه ومن فيه لأنه اصبح جيلا مكشوفا ومدروسا لأسرائيل وغيرها وننشئ جيل جديد قائم على الحب والتسامح والأخاء بعيدا عن اى تعصب من اى نوع ومن اى لون ..جيل ينتمى الى الوطن ويقدسه بكل مافيه ومن فيه..<br />5- هذا الجيل الجديد هو الذى سيتولى اعادة الأمور الى نصابها بعد ان نكون نحن قد افقنا الى نفوسنا وغرسنا فيه ما افتقدناه وفقدناه..<br />المشكلة الآن هل لدينا استعداد لتنشأة هذا الجيل؟؟ ..هل نحن مستعدون ان نقر بأخطائنا ؟؟..هل نحن مستعدون ان نتصارح بمكنون نفوسنا؟؟..هل نحن قادرون على ايجاد حلول لخلافاتنا؟؟...هل نحن قادرون على احتواء مشاكلنا؟؟؟هل نحن قادرون ان نستوعب الدرس بعد كل هذه الدروس التى لم نستوعبها؟؟؟<br />مارك"
