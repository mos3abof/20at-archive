text = "اولا اود ان اوجه الف تحيه الى القائمين على هذا الموقع : منذ 50 عاما واكثر والحكومات العربيه تتبع سياسه ضبط النفس والتعقل وعدم المغامره والتفريط با القدرات العربيه وعدم ادخال العرب في حرب خاسره وما النتيجه ؟؟؟؟؟؟؟ !!!!!!!!!!! ذل وهوان وفقر وحرمان للشعوب العربيه الا لمن ارتمى في احظان الحكام العرب واسيادهم والان الان فقط حان موعد الحساب نعم جاء يوم الحساب وها هم جند الله في فلسطين ولبنان يستعدون لخلعكم عن مقاعدكم التي تخرج منها رائحه العفن انا لا ابالغ ولكن ان غدا لناظره قريب وسيرى الذين ظلموا اي منقلب سينقلبون صدق الله العضيم<br />اخوتكم في حركه التحرير الوطني الفلسطيني فتح"
