text = "فعلا حسن نصرالله اسد المجاهدين وبالنسبة لنا نحن المصريين فقد اثبت نصر الله انة رجل قد كلمتة وليس مثل الزين لا يستطيعو ان يستغنو عن اكل الخروف المشوى وعيشة الخيام والجلوس مع النسوان الحكام البدو الخر واخيرا اللهم انصر عبدك ورجالة الشداد البطل حسن نصر الله ورجالة اميين"
