subject = "الفتنة القادمة"
author = "العربي"
posted = "2006-08-06"
text = "أريد أحد أن يشاركني شكوكي<br />فإننا نعلم من هم أهل الفتنة ونعلم أن أي فتنة يجب أن أبحث على يهودي خلفها فالفتنة لايخلقها إلا اليهود سواء كانت للمسلمين أو المسيحيين أو الأديان الأخرى<br />وحقيقة أنا آرى أن اليهود لكي يخرقوا صف لبنان والتفافهم حول حزب الله أن يشعلوا الفتنة بين الطوائف اللبنانية<br />وأرى أن تصريح الظواهري في غاية الخطورة ويحمل في طياته الفتنة والانشقاق !!!<br />أعلم أن القاعدة أتت بالاسلام إلى الهاوية من خلال الهجمات التي تعرض لها المدنيون وقتل المسلمين الشيعة وتصفيتهم في كل من أفغانستان والعراق<br />وكذلك قتل المسيحين<br />وجاء في تصريحه بمحاربة الصليبيين على حد قوله ، أوليس المسيحيون هم عرب أخوة أعزاء يعيشون معنا في أوطاننا العربية ؟<br />ولماذا هذا الكره عليهم وقد ورد في القرآن على المودة التي يكنها المسيحيين للمسلمين وكذلك الرحمة<br />وفي وجد المغالين منهم أسعى إلى محاورتهم ونيذ الطائفية كما فعل الامام موسى الصدر في لبنان أما معاملتهم بسوء فهذا كبير وكبيرا جدا ويجب على الظواهري وغيرة ممن يدعون أنهم يحملون الاسلام أن يتحلوا بخلق الاسلام !<br />ولا يشقوا صفوف المقاومة الاسلامية في لبنان باثارة الفتنة على المسيحين فينقلبوا على المقاومة الاسلامية وعليه أن يعرف أن أعداء الاسلام والعرب هم الاسرائيليون<br />وإذا أراد محاربتهم فأنه يعلم أين هم<br />وإذا أردت محاربتهم ففتح جبهة أخرى من خلا ل الأردن أو مصر وليس لبنان فعندهم من يدافع عنهم واستطيع أن أقول أنك لا تقدر !<br />وحفظ الله المقاومة الاسلامية في فلسطين ولبنان ونصرهم بنصره وأيدهم بجنوده<br />وكأنني أرى أن القاعدة ما هي إلا أداة زرعها الأمريكان في قلب الأمة الاسلامية ومن يرد أن يشاركني هذه الشكوك فليرجع إلى التاريخ والشخصيات المنتمية إليهم والأحداث التي فعلوها ووقتها وخدمتها للصهيونية العالمية0"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125838/http://www.20at.com/article2.php?sid=1072"

