[[comments]]
order = 0
subject = "بيرو"
text = "اقرأ الموضوع السابق جيدا ثم أجب عن الأسئلة التالية:<br />1- كم واحد من الكراسي يقدر يحدد مكان الدولة المذكورة؟<br />2- كم شبر في خريطة العالم تبقي دون ان يمارس فيه القمع ضد الاسلام والمسلمين؟<br />3- اذكر ولو بمثال واحد أي مجهود يذكر قام به اي مسلم مسئول كان أو حتي مسطول للاسهام باي حاجة في قضية للمسلمين ؟<br />4 - جاهد من اجل ان تثبت انه رغم كل هذا مازال يوجد أمل ؟<br />4- لو أستطعت الأجابة علي اي من الاسئلة السابقة فانا انصحك بالختباء فورا والتخفي عن عيون الجميع والامتناع عن الحديث مع اي شخص مهما كان ...<br />ولا اقولك سافر تركستان<br />علي الاقل اللي هيتعمل فيك هناك أرحم بكتير من اللي بيحصل هنا...!!!"
archived = "2004-09-27"
capture_url = "https://web.archive.org/web/20040927000321/http://www.20at.com:80/article.php?sid=428"

[[comments]]
order = 1
subject = "معلقون بلا حدود"
text = "يقال انه يوما وقفت ذبابة علي انف رجل صعيدي<br />حاول أن يزيحها بعيدا بيده....<br />نظرت له في حدة وقالت....::<br />حتي أنت يا معفن<br />حتي الصين تمارس القمع ضد الاسلام<br />والله هزلت !!!,"
archived = "2004-09-27"
capture_url = "https://web.archive.org/web/20040927000321/http://www.20at.com:80/article.php?sid=428"

[[comments]]
order = 2
subject = "أخوك الصغير حلاوة"
text = "أخطر مافي الموضوع الأرقام ...دة احنا على كده مش عايشين في الدنيا!!!<br />بس كان لي سؤال... هية دي نفس البلد اللي رئيسها عميل لإسرائيل؟؟؟ ولا دي بلد تانية.؟؟؟<br />حلاوة يحيكم من شرم الشيخ"
archived = "2004-09-27"
