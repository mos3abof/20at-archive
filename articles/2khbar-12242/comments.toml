text = "يا عم ارلاجل واضح وصرح بيقولك هنتكلم عن الدين بتاع الدنيا مش بتاع الاخره وبيقولك هيتكلم في الدين اللي مالهوش في السياسه يعني هيطلع الناس بتوع الله حي ومدد والدراويش والحاجات الحلوة دي وكأن النبي عليه الصلاه والسلام مكانش سياسي كبير ومحنك وكأن الدين منفصل جزء للدنيا وجزء للاخره<br />دي حاجه حلوة خالص"
