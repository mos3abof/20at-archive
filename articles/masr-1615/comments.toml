[[comments]]
order = 4
subject = "لا يجب التعميم"
author = "بسمة"
posted = "2007-02-20"
text = "على فكرة برنامج اوبرا يتم اختيارة بعناية و لايدفعون بل يسجلون انفسهم علي موقع البرنامج و المسئولون عن البرنامج يقومون بالتنسيق معهمبالمناسبة يتم انتقادها يوميا في الصحف بل ان احد الصحفيين وصف جمهور اوبرا اللى بالملايين انهم مرضى نفسيون و لم تظهر اوبرا علي الشاشة تقرا بيانا تقول فيه ان الرئيس بوش راعى الديمقراطية في امريكا سيحمينى ويقف الي جانبى علي فكرة كمان برنامج نشوى علي دبى الشباب مش من نوعية هالة شو دول معظمهم طلبة كليات الطب وانا شاهدت صديقات لى محترمات في هذا البرنامج"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025218/http://masr.20at.com:80/article.php?sid=1615"
