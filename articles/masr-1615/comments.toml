[[comments]]
order = 1
subject = "هذا حصاد حكم مبارك"
author = "لقد أصبح إحتياج الشباب إلى المال هو الدافع إلى أن يقحم بنفسه فى تفاهات الأمور رغبة فى الحصول على المال وهذا يرجع للبطالة والفقر الذى يعيش فيه المجتمع المصرى من جراء حكم مبارك الذى قضى على الأخضر واليابس وكان سبب فى فساد الإخلاق"
posted = "2007-02-19"
text = "ما رأيناه فى حلقة فتاة الليل كان يؤكد أن هؤلاء الفتيات هن فعلاً فتايات ليل وكانوا يتحدثون بتلقائية وكان واضح إن الحلقات ليست معد لها الأسئلة ولكن ما أثار جنون الحكومة أنهن أعترفن أن الشرطة تحميهن وكان أعجب الأمور حين ظهر المحامى صاحب القضية فى برنامج اليوم السابع وقال إن فتايات الليل موجودين فى مصر ولكن لا يجب أن نذكر ذلك علشان سمعة مصر طيب وهو إللى بيعمله حسنى مبارك ده فى مصر لم يؤثر على سمعتها وإللى بتعملة الشرطة والأمن المركزى ده مش هيأثر على سمعتها يا جماعة إحنا خلاص طهقنا من الفساد إللى موجود والكذب إللى موجود وفعلاً فتايات الليل ليسوا أماكنهم فى البارات فقط أدخلوا إى جامعة وأنظروا إلى أشكال البنات إللى فيها وعلى ملابسهن وكيف ترخص البنت نفسها أملاً فى الزواج ولكن طبعاً مافيش جواز علشان مافيش شغل علشان مفيش مصانع ولا شركات علشان أتباعوا علشان مبارك وعيلته سرقوا البلد<br />يبقى لما نحاكم لازم نحاكم مبارك وعيلته على اللى بيحصل فى مصر منحاكمش مذيعة عرضة صورة واقعية للفساد إللى بقى للركب<br />اللهم أنت القوى الجبار المنتقم من مبارك وعائلته اللهم آمين"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025218/http://masr.20at.com:80/article.php?sid=1615"

[[comments]]
order = 2
subject = "لم نتغير -- شارع محمد على"
author = "عارفين شارع محمد على"
posted = "2007-02-19"
text = "زمان لما كان واحد يحب يعمل فرح لاخوة والا ابنة كان بيروح يأجر فرقة من شارع محمد على لاحياء ليلة الفرح وكانت الفرقة بتتكون من فرقة موسيقية ومطرب او مطربة ورقاصة ومجموعة من المطيباتية اسمهم كدة<br />المطيباتية دول يقفوا فى الفرح ويحيوا العريس والعروسة ويصفقوا ويهيصوا ىويزعقوا ويصرخوا باعجاب اللة ياست من تانى ياعظيمة ياللى مفيش فى مصر زيك ولا بعدك ووشك نور يالعريس وقمر ومدور يالعريس حاجات كدة العملية كلها بالايجار وفية عشوة كويسة والمطيباتية دول انواع مثلا رئيس بيخطب يطلع واحد منهم فجأة يحى الرئيس ويقول بقين كلام متدرب عليهم<br />ومحافظ فى جولة برضة شوية مطيباتية متأجرين يهتفون يعيش البية المحافظ - انت اللى فيهم والباقى ركش<br />وفى اغانى وحفلات المطربين والمطربات برضة المطيباتية دول لهم دور فظيع ويهتفوا من تانى اللة اللة<br />والعبد للة انقطع نفسة علشان يشتغل مطيباتى لاى حد بس يظهر ان تقل الدم منعنى من اظهار مواهبى<br />محدش عندة واسطة<br />يمكن الحالة تمشى مع القنوات الهلس دى"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025218/http://masr.20at.com:80/article.php?sid=1615"

