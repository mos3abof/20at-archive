[[comments]]
order = 11
subject = "الانتفاضة الشعبية المصرية في 23 يوليو 2006"
author = "محمد عبد المجيد"
posted = "2006-03-29"
text = "بيان<br />الانتفاضة الشعبية المصرية في 23 يوليو 2006<br />القبض على الديكتاتور مبارك وتقديمه لمحاكمة عادلة وعاجلة<br />أخي المواطن المصري،<br />هذا البيان منك إنْ كنت واحدا من الذين انتظروا طويلا محاكمة الرئيس حسني مبارك على مئات الجرائم التي ارتكبها في حق شعبنا.<br />الرئيس هو الذي أمر بنهب أموال المصريين، وقام بتسهيل عمليات النصب والاحتيال والقروض والهروب سواء بأوامر مباشرة أو بصناعة إدارة مالية فاشلة أصر هو على استمرارها طوال فترة حكمه.<br />الرئيس هو الذي قام بحماية مُجرمي الزراعة والري لأكثر من عشرين عاما، عندما علم بكوارث الأمراض والتلوث والمواد المسببة للسرطان والفشل الكلوي مما أصاب أكثر من ربع أبناء شعبنا بها.<br />الرئيس رفض معاملة المصريين إلا بأحكام عرفية في قانون طواريء مما أفقد الشعب حقه الطبيعي في الوقوف أمام محاكم مدنية.<br />الرئيس هو الذي أعطى توجيهاته بامتهان كرامة المصريين في أقسام الشرطة والمعتقلات والسجون، وتعذيبهم، واغتصابهم، وانتهاك حرماتهم، بل وصل الأمر باشعال ضابط أمن النار في أحد المواطنين، ولما علم الرئيس بالأمر استحسنه .<br />في خلال فترة حكمه دخل السجنَ أكثر من ربع مليون مواطن، ولايزال يحتفظ بثلاثين ألفا دون محاكمة اذلالا لهم ولأهلهم وذويهم.<br />هل هناك أحد لا يظن أن المشهد المصري في عصر الطاغية كارثة تنذر بطوفان؟ فشل في كل المجالات الزراعية والصناعية والاعلامية والسياحية والادارية والتعليمية والأخلاقية والتربوية والثقافية والفنية فتراجعت مصر في عهده، وتقدم لصوص صنعهم لسرقة اللقمة من أفواه المصريين، وشهدت البطالة والعنوسة وسكان المقابر والغلاء والأمراض والادمان والفساد والتلوث والتهريب حالة مصرية عامة، ولا يزال يُصرّ على الكذب، ويقوم بتصعيد ابنه ليصبح الوحيد المؤهل ف<br />اقرأ بقية التعليق .."
archived = "2006-04-06"
capture_url = "https://web.archive.org/web/20060406164043/http://egyvote.20at.com:80/article.php?sid=109"

[[comments]]
order = 12
subject = "موضومواطن عمل في الحكومه مرتين واتفصل من هيئه الامن القومي من غير سبب"
author = "سامح"
posted = "2006-11-13"
text = "نت اعمل في وزارة الاتصالات المصريهوعد 5شهور فصلت بناءا علي خطاب من هيئه الامن القومي انني خطر<br />وانا خطر اذاي وانا لم اعمل شي يخاف القانون ولماسافر خارج الابلاد ولم انضمالي اي جماعات اواي حزب<br />وما دام اناخطرعلي الامن فلماذلايحاكموني<br />وانا من هذا الرساله اطالب بمحكامتي علي الملاء لكي اعرف ماذا فعلت<br />وشكرا<br />ولعل هذا الرساله تصل الي ريئس هيئه الامن القومي المصري الذي فشلت في مقابلوتوا مرات ومرات لكي اعرف السبب<br />وانني ادعو كل من يقراء هذا الرساله ان يقوم بتوزيعها الي اكبر عدد من الناس لكي يعرفوا مقدار الظلم الواقع علي<br />انني لا اطلب اكثر من معرفه اسبب الذي من خلاله تم الفصل الصادر من هيئة المن القومي المصريه"
archived = "2006-12-07"
capture_url = "https://web.archive.org/web/20061207080619/http://egyvote.20at.com:80/article.php?sid=109"

[[comments]]
order = 13
subject = "الحمار محمد حسنى مبارك"
author = "مواطن"
posted = "2006-11-26"
text = "لاسف ان السادات وهو الئيس السابق لمصر ترك لنا بهيم أوبقره كبيره تسمى بمحمد حسنى مبارك الذى جعل من مصر التى كانت الجنه ,جعل منها بلدمجاعه وحرمان فسرف منها ونهب كما يريد لا ولم يهدا فاتى باناس اخرى لتنهب معه وهى حاشيته القذره البذيئه اقسد بكلامى هذا السفراء والوزراء والمحافظين ,ادعو كل من قرا هذا الخطاب بالنذول الى الشارع المصرى فيرى المواطن الغلبان الفقير الذى يعانى كل يوم لاطعام اولاده الصغارواكرام مغيشته ,وهذا كله بسبب من انه بسبب الذى لا ضمير له وهو البذئ محمد حسنى مباك الذى جعل فرقا كبيرا بين فئات الشعب اما فقير تخت خط الفقر واما غنى غناء فاحش.<br />ارجو من اصحاب القاوب الرحيمه وجد حل لهذه المأساه.<br />وشكرا"
archived = "2006-12-07"
capture_url = "https://web.archive.org/web/20061207080619/http://egyvote.20at.com:80/article.php?sid=109"

