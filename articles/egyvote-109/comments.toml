[[comments]]
order = 0
subject = "ما هي الانتخابات النيابية ولماذا ؟"
author = "محمود يوسف"
posted = "2005-12-07"
text = "أأعجبني مقال هام جداً للدكتور صلاح الدخيل على موقع قناة العربية وهذا نصه ...<br />ما هي الانتخابات النيابية ولماذا ؟<br />صلاح الدخيل |07/12/2005 م، 9:39 (السعودية)، 6:39 (جرينيتش)<br />ما هي الانتخابات النيابية ولماذا ؟ الانتخابات النيابية كما يعلم إبني البالغ من العمر سبع سنين أنها اختيار الناس أو الشعب لمرشح يمثلهم من بين عدد من المرشحين .. وإن لم يستطع هذا الشعب أن يختار ممثليه بحرية فلا يمكن أن نقول بأن هناك انتخابات . وأما لماذا الانتخابات .. فإبني الآخر ذو العشر سنين يعلم أنها لتداول السلطة (بضم السين) .. ولا يمكن أن تجد على وجه الأرض من يختلف مع أطفالي على هذا إلا الحكومة المصرية الحالية .. لا لأن أطفالي عباقرة ولكن لأن هذه هي الحقيقة والمنطق الذي يعلمه الجميع كعلم مطلق لا يقبل المناقشة وهو قانون الديموقراطية مثله مثل قانون الجاذبية لنيوتن والنسبية لأينشتين .. أي أنه من المسلمات والبديهيات التي تكابر الحكومة المصرية الحالية مدعومة بجيوش الجن والشياطين لمنع دخول مثل هذه القوانين الخبيثة إلى أرض الكنانة .. أو دخولها مشوهة لتكون على مقاس ورسم وشكل حكومتنا المشوهة ومعاونيها من الجن .. فدخول الديموقراطية إلى مصر بشكلها التقليدي أمر مرفوض تماماً من قبل الحكومة المصرية الحالية وشياطينها لأنها ببساطة شديدة ستحولها إلى حكومة سابقة فور دخولها مباشرة ، لذا فلا يتصور عاقل أن يسمح الحاكم الحالي بما لديه من سلطات ونفوذ أن يتخلى عن كل هذا لأجل عيون الشعب أو لأجل عيون مصر .. مهما كانت النتائج ومهما عرض مصر وشعبها للويلات والخراب والدمار والفوضى .. وهي من الأمور المتوقعة حتماً كنتيجة طبيعية ومنطقية لبلطجة الحكومة وذيولها وشياطينها .. برغم أن هناك العديد من تجارب العالم الثالث التي تم فيها تداول<br />اقرأ بقية التعليق .."
