text = "السلام عليكم أخي زائر...خلاصة الكلام أن الشيخ عمرو خالد يمشي بخطي تدريجيه ...هو يريد أن يحدث التغيير بتنمية بذرة الخير ...مثلا أذا رأيت أنسان يدخن ثم أنت قلت له حرام ثم رد عليك المدخن بمقولة عارف بس مش قادر أبطلها. ماذا أنت فاعل؟ لقد وصلت لطريق مسدود... الشيخ عمرو خالد يري أنك تحتاج تقوية أيمان الشخص أولا فهو ضعيف ...كيف؟؟ ممكن أنت تشجعه علي الأنتظام في الصلاه والقرآن وتنمية بذرة الخير داخله ثم سيكون من السهل ترك التدخين بعد أن أصبح الشخص أقوي<br />هل هو أحل التدخين ؟ طبعا لا لكنه أخذ الطريق بخطوات تدريجيه<br />هذا ما أعتقد أن الشيخ عمرو خالد يفعله وأنا أختلف معك يا أخي... والله أعلم"
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234933/http://egyvote.20at.com:80/article.php?sid=109"

[[comments]]
order = 9
subject = "جنازة الرئيس حسني مبارك"
author = "محمد عبد المجيد"
posted = "2005-12-12"
text = "جنازة الرئيس حسني مبارك<br />أوسلو في 19 أغسطس 2005<br />اهتزت أركانُ كل سجون مصر ومعتقلاتها عندما وصل إلى اسماع القابعين بداخلها ظلما وعدوانا نبأ رحيل الرئيس حسني مبارك، وانتفضت المشاعر، واقترب أحدهم من صورة ابنته الصغيرة ليحتضنها فقد غابت ملامحها عنه منذ عشر سنوات إثر القاء القبض عليه، والقائه في نزانة قذرة كئيبة دون أن يُقَدَم للمحاكمة، فقانون الطواريء يضع بين يدي الرئيس أرواح المصريين ليقبضها متى شاء، ويستدعي عزرائيل أينما أراد.<br />وبكى آخر الذي كان وحيد والديه ورحل والده خلال فترة اعتقاله، ومرضت والدته فلا يملك منها إلا صورة قديمة أبيض وأسود يُقَبّلها بين الحين والآخر.<br />انفجرت كلُ مشاعر الفرح والأمل والغبطة في صدور عائلات ثلاثين ألف معتقل، فالسجّان الذي ظن أن الروحَ خالدةٌ لم يدر بذهنه أن عزرائيل الذي تركه في ميوينيخ ليتوب، عاد إليه مرة أخرى غير مكترث بتوسلاته أن يتركه عدة أعوام حتى يسفف المصريين تراب الأرض.<br />كانت هناك مئات من العائلات التي مات أبناؤها تحت التعذيب في أقسام الشرطة بأوامر وتوجيهات الرئيس الراحل محمد حسني مبارك والذي طلب من أجهزة أمنه استعمال كل وسائل القسوة والغلظة وامتهان الكرامة ولو وصل الأمر إلى اغتصاب المصريين وانتهاك أعراضهم وصب الكيروسين على أجسادهم الضعيفة فتنهي النارُ عملَ البلهارسيا وتعجّل موت مواطنين كانوا همّا وكمَدا وثِقَلا فوق كاهل الرئيس.<br />مئات من البرقيات تسلمها القصر وكلها مجاملات بروتوكولية يعزي فيها الزعماء والملوك والقادة والكبار الشعبَ المصري في المصاب الجلل ويستذكرون مآثر ومواقف الرئيس الراحل، طبعا لم يقرأها أحد فلو مات الشيطان نفسه فإن برقيات العزاء ستتم كتابتها بنفس الصيغة، وسيتذكر المُعزّون أفضالَ إبليس ونضاله واصراره على موقفه( لأغوين<br />اقرأ بقية التعليق .."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234933/http://egyvote.20at.com:80/article.php?sid=109"

