[[comments]]
order = 1
subject = "بقية المقال"
author = "محمود يوسف"
posted = "2005-12-07"
text = "ب بقية المقال..<br />سلمي للسلطة إلا أن مصر بتاريخها الطويل وبما أنها أم الدنيا فلابد أن تكون مختلفة ، وهذا ما يبدو واضحاً جلياً في انتخابات 2005 الحالية فالحكومة لم تسمح إلا بمساحة ضئيلة جداً من الحرية .. تلك المساحة التي تستخدمها لتتزين بها أمام العالم موهمة الجميع أنها ديموقراطية وأنها جاءت بتفويض من الشعب ، فلا الشعب يعنيها ولا مصر تعنيها وكل ما يشغل بالها هو كيف تتجمل أمام العالم لكي يظل البيت الأبيض مفتوحاً أمام رئيسها للزيارة كل عام أو عامين لاستعادة الشعور بأنه زعيم وقائد وممثل لشعب لا يريده ولا يريد حكومته الشيطانية تلك .. إن الفكر الشيطاني لتلك الحكومة المتسلطة هو ما دفع بها منذ سنوات إلى تشكيل لجنة سياسات وتشكيل حرس جديد بخلاف القديم المتهالك لكي يتسلم هذا الحرس الجديد كما يسمونه ولجنة سياسات المحروس الريس الصغير مقاليد الأمور لتجديد شباب البلطجة والظلم والقهر والاستبداد وكبت الحريات على الموضة الجديدة .. موضة البلطجة والمسخرة التي شهدها العالم .. واهم من تخيل أن الحكومة تسعى بجد إلى الإصلاح .. فالإصلاح يعني رحيلها كخطوة أولى .. وإن كانت تريد إصلاحاً حقيقياً كما يدعي رئيسها الأفاق لكانت تركت الناس تختار من يمثلها .. لكن أن تأتي لنا بشياطين صغيرة السن لتنصب منها سلاطين وحكام جبابرة على الشعب قبل رحيلها فهذا عين الظلم وعكس الإصلاح تماماً .. إن الإصلاح يبدأ من عند رحيلها هي ذاتها .. فلا إصلاح في وجود مثل تلك الحكومة الغبية .. نعم غبية بكل ما في الكلمة من معاني الجهل والبلاهة .. فمن الغباء تصور استمرار وبقاء الحال على ما هو عليه .. أجيال تولد وتنمو وتكبر في ظل ضياع وخراب وتسلط وظلم واستبداد .. ملايين العاطلين عن العمل .. ملايين العوانس فوق سن الثلاثين لأنهم لم يجدوا أربعة<br />اقرأ بقية التعليق .."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234933/http://egyvote.20at.com:80/article.php?sid=109"

[[comments]]
order = 2
subject = "بقية المقال"
author = "محمود يوسف"
posted = "2005-12-07"
text = "أنهم لم يجدوا أربعة جدران .. وفي المقابل ملايين ملايين الملايين تنهب وتسرق من قوت هذا الشعب لتذهب إلى جيوب وكروش الحزن الوطني وذيوله وشياطينه .. كرامة وسمعة مصر التي ضاعت وبيعت بملايين قليلة .. ضياع المجتمع المصري وسقوط أكثر من 80 % من بنات وشباب مصر في اوحال الرزيلة تحت مسميات الزواج العرفي والسري وما إلى ذلك .. وما يمكن أن يقدمه لنا هذا الجيل المحطم نفسياً ممن يمارسون حياتهم في الظلام بعيداً عن الأعين لأنهم لا يملكون القدرة على فعل هذا في النور بسبب التعطل والبطالة وندرة فرص العمل .. أية مشروعات التي يضحكون بها على الناس ؟؟؟ وأية صحوة وأي تقدم الذي يحدثنا عنه رئيسها منذ جاء على رقاب العباد في عام 1981 الأسود؟؟؟ إن البلد لم يصل إلى حافة الهاوية .. بل إنه سقط في الهاوية بالفعل .. ماذا تنتظر حكومة فاسدة من شباب هكذا حاله ؟؟؟ أن يصفق لأبنائها كما صفق آباؤه من قبل ؟؟؟ إنها حكومة غبية لو توقعت هذا .. وهي بالفعل غبية لأنها تتمنى هذا وتطلبه .. لكن هيهات .. هيهات .. سيسجل التاريخ بحبر أسود على لوحه الأسود رحيل تلك الحكومة السوداء في يوم أشد سواداً من أيام حكمها القذر .. حبر أسود على لوح أسود .. كله أسود في أسود على أسود .. نعم هو كذلك حتى لا يمكن رؤية ما يسجله التاريخ .. لتطوي مصر تلك الصفحة السوداء بكل ما فيها من أسود في أسود على أسود .. وتتجاوزها .. فلا تقرأ الأجيال القادمة منها أو عنها شيء فهي تشهد على ضعفنا وقلة حيلتنا وهواننا على الجميع .. وسيسجل شباب مصر بيده الفتية تاريخ مصر الجديد الذي يصنعه هو بيديه ودمائه .. هل تتوقعون أن ترحل تلك الشرزمة وشياطينها بغير دماء ؟؟؟!!! أنا لا أعتقد ... صلاح الدخيل"
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234933/http://egyvote.20at.com:80/article.php?sid=109"

[[comments]]
order = 3
subject = "وبعد اليوم ما فات !! آدي النتيجة.. والغريب إنها برضه فضيحةللحزب الوطني"
author = "محمد السيد"
posted = "2005-12-07"
text = "لأخبار النهائية للمرحلة الثالثة....<br />نجاح 11 مرشح للإخوان المسلمين ... وكمان في 5 مرشحين أجلت الانتخابات في دوائرهم بأمر قضائي...<br />مخصوص عشان فيها إخوان ... تعرفوا لو مفهاش ؟؟ كانت الحكومة ضربت بحكم القضاء عرض الحائط ....<br />نجاح الأستاذ البطل (حمدين صباحي) رغم كل التجاوزات اللي تمت ضده في الجولة الأولي ...<br />وياعيني عليك يا محافظ كفر الشيخ الغلبان ... يا اللي كنت موعود تتعين محافظ .......<br />نجاح (محمود أباظة) .... الوفدي القديم ..مقابل سقوط أخو زكريا عزمي الجديد أمامه ....<br />خلي الوطني يعيش أفراحه ... حتي الإخوات مش عارفين ينجحوا بعض ...<br />ويا عيني علي سيادة المستشار ... بتاع شاور يا سيدي ..وأنا أفصل ...قصدي يفصل قوانين يعني ... جاهزة ومتظبطة علي مقاس حبايبنا بتوع الحزب الوطني ....<br />(محمد موسي) ... رئيس اللجنة التشريعية في المجلس .... سقوط مريييييييييييع أمام مرشح الإخوان المسلمين ....<br />بينما لم يوفق كل من (ضياء الدين داوود) .... رئيس الحزب الناصري ....<br />و (سامح عاشور) ... نقيب المحامين ...<br />وكمان تكرر لعبة مصطفي الفقي ... ويعلن القاضي خسارة (محمد مرسي) في فضيحة جديدة للحكومة ... وللحزب الوطني ...<br />ده غير دايرة دمياط ... اللي القضاة اعتصموا في لجنة الفرز ورفضوا النتيجة اللي الباشا القاضي رئيس اللجنة العامة أعلنها .... بخسارة مرشح الإخوان (صابر عبد الصادق -عضو في المجلس اللي فات) وفوز مرشح االوطني ...<br />وقالوا إن النتيجة دي عكس نتيجة الفرز ...<br />ومحدش عارف حتوصل الفضيحة دي لغاية فين ؟؟؟<br />الساعة دلوئتي 3 بالليل ... أسيبكم .....وأروح عشان أحلم بيهم ........<br />أحلم بمين؟؟؟؟ بيهم طبعا .... هم مين؟؟؟<br />إنتو مش عارفين ............؟؟ سلام<br />لا للتمديد ... لا للتوريث ..<br />اقرأ بقية التعليق .."
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234933/http://egyvote.20at.com:80/article.php?sid=109"

