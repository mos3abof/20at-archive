[[comments]]
order = 0
subject = "امريكا وعملائها"
author = "لا تظن يوما ان للثعلب دينا"
posted = "2007-02-19"
text = "كان شاة ايران شرطى امريكا فى الخليج ورجلها القوى فى المنطقة وكانوا يمدنوة بالسلاح وكل شىء<br />ولما اطاحت بة الثورة الاسلامية منعوا حتى دخولة الارض الامريكية للعلاج<br />ورحم اللة السادات اذ دعاة ليموت فى مصر ويوارى جسدة فى مقابر الملوك فى مسجد الرفاعى<br />واخلاصة امريكا تحتقر عملائها واخرهم صدام<br />فاى اصلاح تنشدة تلك الصحفية واشباهها من امريكا<br />نحن لا نريد من امريكا شيئا لا اصلاح ولا ديمقراطية ولا شيئا ابدا<br />نحن نعرف طريقنا ونعرف حقنا وكيف نصلح من احوالنا<br />لا نريد امثال الجلبى فى مصر"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025031/http://masr.20at.com:80/article.php?sid=1616"

[[comments]]
order = 1
subject = "اقتراح هام"
author = "إبن بهيه"
posted = "2007-02-19"
text = "هناك عدة أنواع ممن يلجأون إلى الخارج للاستقواء به على الداخل ، ولكل نوع من تلك الأنواع أجندته المبررة سلفاً كي يدافع عن نفسه ، وبالطبع لن نقبل دفاعه مهما كان ..<br />أقل الأنواع خطراً ((بحسب المتخصصين)) ممن يلجأون إلى الخارج هو النوع اليائس القانط من أي تقدم نحو الإصلاح وهؤلاء مرشحون للزيادة كثيرا في الأيام القادمة بعد سيرك الدستور الذي نصبه النصاب الأكبر ، هذا النوع اليائس برغم رفضنا التام لعلاقاته بالخارج حتى وإن كانت بعيدا عن الشيطان الصهيوأمريكي إلا أنها تظل موضع شك لدينا جميعا لسبب بسيط جدا وهو أن أي خارج مهما كان لابد أن تكون له أجندته الخاصة ، ومهما كانت تلك الأجندة تتفق أو تختلف ومصلحة الوطن فستظل أجندة خارجية لا يمكن القبول بها بأي حال من الأحوال .. خلاص نقفل الموضوع ده ونبطل شغل الحنتسه والتبريرات الفارغه لأخطاء أو لنقل خطايا اللجوء إلى الخارج.<br />ربما يأتي من يقول لك وما العيب إذا كان النظام ذات نفسيته في الأساس معين من الخارج وبيستعين بالخارج لكي يقمع الداخل ، يبقى ليه ما نسحبش إحنا منه البساط ؟<br />لأ يا حدق ساعتها مش هيكون من حقنا نقول عنه واطي لأننا هنبقى زيه واطيين .. ولا رأيكم إيه ؟<br />أقول هذا حتى أقطع الطريق تماما على أي رأي يمكن أن يطرح لتزيين اللجوء إلى الخارج ، ليس بسبب أحادية الرأي والصلافة والجلافة وخلافه ولكن لسبب آخر بسيط وهو أن الخارج (أي خارج) سيأتي لنا بنسخ كربونية من الجلبي وعلاوي والمالكي وكل تلك الكائنات الطفيلية القذرة التي ترتديها الإدارة الأمريكية في أقدامها كي تعبر بها أوحال العراق .. والحمد لله لسه ما عندناش أوحال .. لكن ربك يسترها على مصر من الواطي الذي يدوس على رأسها في الوحل هو وننوس عين لجنة الوكوسات وعصاباتهم.<br />ربما هذا الطرح الذي يتبناه<br />اقرأ بقية التعليق .."
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025031/http://masr.20at.com:80/article.php?sid=1616"

