posted = "2007-02-19"
text = "كنت قريت فى الموقع شعار نعم للتوريث ولاستكمال المسيره<br />ولكنى احب ان اعدل قليلا على هذا الشعار فكلمه التوريث لا تليق والافضل<br />نعم لانتخاب ابن الرئيس لاستكمال المسيره."
