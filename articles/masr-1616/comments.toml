[[comments]]
order = 4
subject = "أنا أؤيد"
author = "أنا أؤيد كل مساند لمصر للوقوف بجانبها للخلاص من حكم مبارك نهائياً سواء أمريكا أو الجن الأزرق بس نطهر مصر من فساد مبارك وعيلته ونهبه"
posted = "2007-02-20"
text = "بالنسة للدشم إللى عمالة تغير شعارتها حسب الموضة أقول لها لا للتزوير لا للتوريث الشعب هو صاحب القرار والشعب رافض إبنك اليهودى الجنسية نسبة ليكى ورافضة لفساده ونهبه بالمليارات ورافضة لمشاريع مصر إللى أستولى عليها هو والصيع أصحابة فلا داعى لهذه الشعارات الرخيصة اللى عمرها ما ها تعمل أى شعبية لإبنك ياريت تحترموا مشاعر الشعب الرافض لكم وتتركوا الحكم مصر مش عزبة أبوكم علشان تقعدوا فيها من غير شرعية الحكم للشعب وهو حر يختار المناسب ليه وطبعاً الشعب كله مجمع على حكم الإخوان المسلمين وهم الأكفء ولم نرى منهم ما رأيناه من مبارك وعائلته من قتل ونهب وفساد كفاية بقى الشعب رافضكم غوروا فى داهية"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025031/http://masr.20at.com:80/article.php?sid=1616"

[[comments]]
order = 5
subject = "هم الاخوان دول كفار يعنى ولا ايه"
author = "فارس_fr"
posted = "2007-02-20"
text = "هو كل واحد عنده شوية زبالة فى دماغة ومش عجبه الاخوان يطلع يشتم فيهم !!! ما تقول رايك وخلاص بدون قلة ادب وسفالة ,, محدش فرض عليكم الاخوان او غيرهم ,,, احنا فى وقت المفروض كل القوى تتجمع فيه لاسقاط نظام الواطى مبارك ,, هنقعد نقول الاخوان وحشين والناصريين بيشجعوهم يبقوا وحشين وكل يوم الكلب مبارك ونظامه يعتقل فيهم ,, والله حرام عليكم ,,, كل واحد قاعد على الكيبورد يشتم ويعلق وفيه ناس تانية اعتقلت واتهانت وضاع مستقبله ومستقبل اولادها ,,, دى تقدر تقولى ؟؟؟؟ ليه بيخرج فى مظارهة ولا يعارض ولا يعرض نفسه للخطر من اساسه ,,, مين فيكم ملهوش اصحاب من الاخوان؟؟ مين فيكم يقدرينكر الكفاءات الموجودة فى الاخوان ؟؟ مش شرط ان كل واحد التزم وبقي بيصلى يبقي اخوانجى ومش عيب انه وجد فى الناس دى الاحترام والتنظيم ولا اقولكم بلاش يمشي مع الاخوان اللى بيصللوا<br />لا لا يمشي يضرب مخدرات وبانجو ا ويدخل سينيمات يتحرش بدينا ويرقص لسعد الصغير ,,, مين الاحق بالانصاف :<br />* ضريبة البانجوا والمخدرات اللى ملوا البلد<br />* ولا الاخوان الوحشين !!!!<br />* ولا العلمانيين اللى غرقونا هبل وهرتله !!<br />* ولا الناس اللى عايشه مع اللى عايشين بتجرى ورا لقمة العيش وهمها زيادة فى المرتب 10جنيه واجازة عيد العمال .....<br />***** قولولنا ياافندية مين اللى عجبكم ممكن يكون عنده الحل ؟؟ مين اللى الشعب كله وراه ونفسه انه يخلصه من حكم عصابة مبارك ؟؟؟<br />اخوانجى , ناصري , وفدى ........ هندى ,, المهم نخلص من الوباء اللى عشش فى جسم البلد بقاله 26 سنة ...........<br />حسبي الله ونعم الوكيل"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025031/http://masr.20at.com:80/article.php?sid=1616"

