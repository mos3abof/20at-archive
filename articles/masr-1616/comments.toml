[[comments]]
order = 7
subject = "تستجيرون من الرمضاء بالنار"
author = "ابن الإسلام"
posted = "2007-02-20"
text = "أنا مذهول من الذين يؤيدون الاستعانة بأمريكا على إصلاح أحوال المسلمين المتردية<br />استعينوا بالله عز وجل<br />بسم الله الرحمن الرحيم (ولو أن أهل القرى آمنوا واتقوا لفتحنا عليهم بركات من السماء والأرض ولكن كذبوا فأخذناهم بما كانوا يكسبون)<br />ترونهم صالحين للأخذ بأيديكم؟؟؟؟<br />بسم الله الرحمن الرحيم (لا يغرنك تقلب الذين كفروا في البلاد - متاع قليل ثم مأواهم جهنم وبئس المهاد)<br />بسم الله الرحمن الرحيم (ولا تحسبن الله غافلا عما يعمل الظالمون إنما يؤخرهم ليوم تشخص فيه الأبصار - مهطعين مقنعي رؤوسهم لا يرتد إليهم طرفهم وأفئدتهم هواء)<br />اللهم إنا مغلوبون فانتصر لنا"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025031/http://masr.20at.com:80/article.php?sid=1616"
