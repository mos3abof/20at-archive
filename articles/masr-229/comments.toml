[[comments]]
order = 4
subject = "الى أخى اللى فوق"
author = "كبير البصاصين"
posted = "2006-04-28"
text = "الى أخى اللى فوق صاحب أخر تعليق أنا لا أدافع عن كاتب المقالة فعلا العلماء لا ينتقدهم العلماء و لكن إن كانت المواقف لا تحتاج الى عقل العلماء و يمكن أن يفهمها الشخص العادى و خصوصا أذا تكررت أفلا يدعوك و يدعوا هذا غيرك و غيرى من الناس البسطاء ليحكموا عقلهم !! و أعتقد ان العلماء لا تنتقد العلماء الا فى المور المعقدة علميا و لكن ما يناقض العقل و السنة و ما تربينا عليه و ما فهمناه من قبل لا يحتاج الى دراسه و درايه و خصوا أنك ترى مع كل المفاسد التى تنتهجها السلطة عينا بيانا نهارا جهارا لا ينطق الازهر ببنت شفه و لا يقول هذا حرام و هذا حلال و أعتقد أن هذا أبسط دور لمؤسسه دينية كان يثق فيها الناس قديما و يهرعوا أليها كلما ألمت به ملمه أليس كذلك!! الا تجد أنه عندما ينئ الازهر بنفسه عن التدخل فى السياسه و يقف موقف المتفرج من صنوف الفساد المستشرى و يرضى بدور الديكور الدينى ألا ترى أنه بذلك يعين السلطه على \"علمنة\" الدولة و تأكيد للمبدأ الفاسد \"لا دين فى السياسة و لا سياسة فى الدين\" !! فمنذ متى أبتعد الدين عن السياسة و منذ متى نئت السياسة بنفسها عن الدين!! ألم يكن رسولنا الكريم صلى الله عليه و سلم هو القائد للدولة و السياسى الملهم فى نفسه الوقت و الذى بفضل الله تعالى ثم إنتهاج التابعين لهذا المنهاج القويم بسطت الدولة الاسلامية فى بضع سنوات قلائل فى عمر الامم نفوذها و هيمنتها المحموده على كل العالم القديم فخشى منها القاصى و الدانى و حسب لها متجبروا ذاك العص ألف الف حساب !! الم تكن الكنيسة هي الدولة و الدولة هى الكنيسة فى القرون الوسطى!! الم تخرج ثورات مصر من الجامع الازهر و تدق لها الكنائس أجراسها أيذانا بحلم الحرية و رفع الاضطهاد!! يا صديقى هل ننتظر أن يقول لنا العلماء إن كان شيخ الازهر على<br />اقرأ بقية التعليق .."
archived = "2006-05-13"
capture_url = "https://web.archive.org/web/20060513042906/http://masr.20at.com:80/article.php?sid=229&PHPSESSID=8127d6f08ccc6a47bcbdb74df17c1fa3"

[[comments]]
order = 5
subject = "الرأس الكبير"
author = "مهتمه"
posted = "2006-05-02"
text = "عندما نتكلم عن مكان ما فاننا نتكلم عن الراس الكبيرة فيه وطالما انه قبل او وافق يكون االراس الكبيرة يبقى الطبيعى انه يتحمل مسئوليات وتبعات المنصب اللى هوه فيه ، وزمان قالوا الناس على دين ملوكهم ، الرسول - صلى الله عليه وسلم - قال \" ان الله يزع بالسلطان ما لا يزع بالقرآن \" يعنى فيه ناس لا يرقق قلوبهم القرآن ولا يردعهم الخوف من الله وه}لاء يحتاجون الى سلطه دنيوية عشان تردعهم ، شيخ الازهر بقى من السلطات المفقودة والمرحومه واللى محتاجين واحد يدور عليها فى الشوارع ويمشى يقول \" شيخ ازهر تايه يا ولاد الحلال \""
archived = "2006-05-13"
capture_url = "https://web.archive.org/web/20060513042906/http://masr.20at.com:80/article.php?sid=229&PHPSESSID=8127d6f08ccc6a47bcbdb74df17c1fa3"

