[[comments]]
order = 0
subject = "و فوائد البنوك"
author = "عابر القارات"
posted = "2006-04-26"
text = "و لأخى الكاتب الكريم لا تنسى موضوع فوائد البنوك و التى حرمها جمع غفير من العلماء على إنها ربا و بقية القصة المضحكة موضوع وثيقة التنصير فقد وقع خلاف كوميدى بين الشيخ طنطاوى و الشيخ الزفزاف وكيله السابق فى شأن من وقع على هذه الوثيقة المقيته و كأننا نتعامل مع أفراد يعملون فى ورشة نجارة و ليست أقدم مؤسسة دينية خارج شبه الجزيرة العربية مهبط الوحى و طبعا لأن الفتاوى قديما كانت تصدر بعد مراجعة كتاب الله و سنة رسوله الكريم و مراجع الفتاوى الأخرى فإن الفتاوى فى عصرنا عصر الفتن و عصر بوسي سمير فإن الفتاوى تصدر بعد مراجعة تعليمات الرئيس و تعليمات أمن الدولة و طبعا لا ننسى فى سياق حديثنا ما طلعت به وكالات الانباء على لسان شيخ الازهر فى بداية مسأله محاولة بعض الخنازير الاساءه الى رسولنا الكريم عليه أفضل الصلاة و السلام فقط طلعت علينا بتصريحه الشهير أنه لا يجب مهاجمة شخص ميت لا يستطيع الدفاع عن نفسه .... لك الله يا مصر فقد سقط أخر حصون الدفاع عن الأمه و رحم الله شيوخنا الأجلاء الشيخ الباقورى و الشيخ شلتوت و الشيخ الشعراوى العلامه فقد كانوا رجالا لا يشترون رضى حاكم فانى برضى الله سبحانه و تعالى .... و بالمناسبة إننا لا نغتاب السيد الحبر الأعظم شيخ الازهر لأننا ننشر رأينا و ربما يشاهده أو سمعه بالفعل من قبل و لربما راجع نفسه فهو فى الأول و الأخر عالم و بالتأكيد أعلم من بعضنا و نحسن الظن به أنه قد غرر به و لا يقصد سامحنا و سامحه الله سبحانه و تعالى."
archived = "2006-05-13"
capture_url = "https://web.archive.org/web/20060513042906/http://masr.20at.com:80/article.php?sid=229&PHPSESSID=8127d6f08ccc6a47bcbdb74df17c1fa3"

[[comments]]
order = 1
subject = "شريف وحيفضل شريف"
author = "ميزو"
posted = "2006-04-27"
text = "الأزهر الشريف مؤسسة مظلومة زي بقيت المؤسسات اللي في مصر، يعني لما احنا نختزل القضاء في قاضي مرتشي يبقى القضاء تعيش وتفتكر ولما نختزل الطب في دكتور جزار يبقى الطب تعيش وتفتكر ولما نختزل المعمار في مهندس حرامي يبقى المعمار تعيش وتفتكر ولما نختزل الفن في بائعات الهوى اللي عمالين يسرحوا ويمرحوا في كل حتة يبقى الفن تعيش وتفتكر ولما نختزل الجامعات في استاذ ما عندوش لا زمة ولا ضمير ويسقط اللي ما يعجبوش وينجح اللي دخل دماغه يبقى كمان الجامعات تعيش وتفتكر ولما نختزل مصر في كام واحد شايفين أن هما يا أرض انهدي ما عليكي ادي يبقى كمان مصر تعيش وتفتكر يا سادة يا محترمين لا الأزهر هوه الشيخ سيد طنطاوي ولا الشيخ سيد طنطاوي هوه الأزهر والراجل قال بدل المرة مليون أنا موظف حكومي وباخد مرتب من الحكومة عايزين ايه أكتر من كده"
archived = "2006-05-13"
capture_url = "https://web.archive.org/web/20060513042906/http://masr.20at.com:80/article.php?sid=229&PHPSESSID=8127d6f08ccc6a47bcbdb74df17c1fa3"

