text = "انا تعاملت مع بنوك في دول الخليج كانو يأخذو أموالنا عندهم بدون فوائد و أصحاب البلد يعطوهم فوائد يعني حلال لهم و حرام علي الأجنبي و لا استخصار و بعدين كلام السادة الفقهاء في خانب و التعامل في بلادهم في جانب اخر و كلهم في بلادهم بيأكلو عرق الأجير هل هذا الحلال عندهم"
