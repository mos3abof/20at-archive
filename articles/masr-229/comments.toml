[[comments]]
order = 7
subject = "البعث الازهرى عقيده نوءمن بها"
author = "راجح مصطفى مصطفى هلال"
posted = "2006-08-05"
text = "الازهر له طبيعه تشبه طبيغة هذا الدين انه لا يموت من اجل بعضا من الذين تركوه كلا ان الازهر يحيا فى دورات تشبه البيت الشتوى ولكن ذلك البيات لا يعنى الموت ابدا لعل الاستاذ الامام الاستاذ الامام كان يشعر بغصه فى حلقه وهو يكافح ضد اولائك الذين اسلموا الاسلام للعادات والتقايد الباليه واحلوه طقوسا مثل طقوس الرهبان ولكن تلك الفئه زالت وبقى الازهر يحيا فى تعاليم الاسلام بثوب عصرى وضى اولائك كان لم يغنوا بالامس ومن ثم فاننى اجزم ان طبيعة هذا الازهر سوف تلقى بالسدنه الذين هم على قمته الان فى اكوام التاريخ وسيبقى الازهر رمزا يحمل الاسلام ويحميه وهذا البعث الازهرى عقيده يجب ان تطوى عليها صدور الغيورين عليه من ابناء هذا الدين"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182913/http://masr.20at.com:80/article.php?sid=229&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "انه السلطان ايها الساده"
author = "راجل مسلم"
posted = "2006-08-05"
text = "لم يوجد للاسلام على مدى تاريخه الطويل حكام حكموا باسمه وخضعوا لاحكامه ورفعوا راياته عن اقتناع وحب الاالقليل اما الاكثريه فانها تحمل فى ضمائرها دغلا على هذا الدين لانه يسوى بينهم وبين غيرهم ممن لا سلطان لهم وتلك افه يبغضها ذوو الكبر من حكامنا ان الاسلام يلف كل شىء بصبغته وبالتالى فهو فى الصداره وهذا شىء يبغضونه واذا لجاء هولاء الى الدين فمن اجل ان يسكتوا ثائرة العوام اللتى قد تعصف بهم ولا عزاء للاسلام والوضع الحالى للازهر هو استمرار لهذه الماساه التريخيه"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182913/http://masr.20at.com:80/article.php?sid=229&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

