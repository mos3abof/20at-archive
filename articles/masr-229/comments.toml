[[comments]]
order = 14
subject = "اعلم اهل الأرض ولكن؟"
author = "حماد الرمحى"
posted = "2006-09-02"
text = "كنت اتمنى ان اكون من المدافعين عن الأزهر الشريف اكبر مؤسسة دينية فى العالم ومنارة العلم وكنت اتمنى ان اكون من اول المدافعين عن د/محمد سيد طنطاوى شيخ الأزهر الشريف ولكنه لم يسمح لى بعد اان سيس الدين !!!!<br />ولكنى لن انضم الى جبه الهجوم على الأزهر الشريف مهبط العلم والعلماء فى الأرض<br />استحلفكم بالله لا تتحاملو على ازهر جوهر الصقلى ومحمد عبده والإمام الغزالى وتاج الدين حسين والإمام صالح الجعفرى حفيد سيدنا الإمام الحسين وامام الأزهر الشريف سابقاوازهر د/نصر فريد واصل مفتى الجمهوريه الأسبق وغيرهم العديد من علماء الأزهر الذين شرفوا العالم الإسلامى<br />وايضاٍ ازهر د محمد سيد طنطاوى شيخ الأزهر الشريف رغم اختلافى الشديد مع كل ارائه وفتاويه الا اننى لا انسى له رسالة الدكتوراه التى كشف فيها تاريخ اليهود الوقح وغدرهم بالأنبياء على مر العصور والأزمان ولا ننسى ان شيخ الأزهر الشريف واحدا من اعلم اهل الأرض طبقا للتصنيف العالمى للعلماء<br />ولكن............................؟؟؟؟"
