[[comments]]
order = 1
subject = "\"فشل الحملة الصليبية \""
author = "على حد قول الرئيس الامريكى ان ما تقوم به امريكا فى الشرق الاوسط هو بمثابة حملة صليبية ، فأننا نقول له ان الصليبيين ينهاروا \" يانهار ابيض\""
posted = "2006-10-19"
text = "ونتمنى طبعا المزيد من الانهيار لهم، وبالتالى فإن حملة بوش الصليبية على الشرق قد فشلت والحمد لله ،،، ونحن فى انتظار حملات اى فى القريب العاجل \" لان الامريكيين بصراحة يستاهلوا\""
archived = "2006-10-22"
capture_url = "https://web.archive.org/web/20061022025017/http://www.20at.com/article2.php?sid=1366"

[[comments]]
order = 2
subject = "ولكن"
author = "معاذ"
posted = "2006-10-19"
text = "مفيش شك ان أنا بفرح كل ما بيزيد عدد القتلى الأمريكان من الجنود<br />ولكن<br />ولكن كم عدد القتلى العراقيين<br />للأسف أضعاف أضعاف أضعاف<br />مش بنظر ولا بتفلسف ولكن هي دي الحقيقة للأسف الشديد العراقيين بيقتلوا بعض أكتر ما بيقتلوا في الجيش المحتل"
archived = "2006-10-22"
capture_url = "https://web.archive.org/web/20061022025017/http://www.20at.com/article2.php?sid=1366"
