subject = "انا نص نص"
author = "هوووووبه او هبابه او هبهوب"
posted = "2006-03-20"
text = "ساعات ساعات \" صباح اصلي \"<br />يعني لما كنت في المدرسه هو صحيح كنت شقيه بس مش لدرجه اطلع فوق السور وانط<br />اولا المدرسه كانت فاتحه الباب علي البحري \" خاصه اصلها \"<br />بس بجد المقال دي حلوه ولديده ممكن افكر بيها بطريقه تانيه لو كنت ولد<br />واخيرا<br />سور اللي قدام بيتنا اكتر حاجه بتننرفزز<br />اوف انا كرهت السور ."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021858/http://masr.20at.com:80/article.php?sid=45&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 1
subject = "كشششششط ..!!"
author = "Control Panel"
posted = "2006-03-20"
text = "رب الكيبورد و الماوس ...<br />\"كشششششط ..\" بيفكرني برضه بالبنطلون اللي اتقطع مني بعد أول هروب ليه في حياتي من المدرسة .. بس الفرق بيني و بينك إنه ما كانش على السور .. أصل أنا عديت المرحلة دي سليم ..<br />و ما جاتش من السور و جات من مسمار في كرسي الأتوبيس اللي ركبته علشان أروح!!<br />يللا حصل خير .. على فكرة لسة محتفظ بحتة من البنطلون المقطوع بأمسح بيها المكتب بتاعي :D"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021858/http://masr.20at.com:80/article.php?sid=45&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 2
subject = "ابني في السور وعلي"
author = "فادي اسكندر"
posted = "2006-03-21"
text = "دايما كنت بلاقي سور قدامي ومكنتش بتفرق معايا عشان دايما كنت بنط من فوقه من اعدادي لثانوي وانا عندي هواية اني انط من فوق السور حتي اني كنت بتعمد اروح المدرسة متأخر عشان انط من فوق السور وادخل ( غلس بقي ) وطبعا بعد نص ساعه من دخولي كنت بنط برضه وأطلع .<br />المهم كبرت للأسف ونطيت برضه من سور الجامعة .<br />المهم لحد اول مظاهرة واكتشفت ان السور البشري اسؤ الف مرة من اسوار الطوب علي الاقل سور الطوب واقف مكانهلا بيضرب ولا بيفعص ... المهم قررت اني اتحدي السور ومن ساعتها وانا لسه بتحداه وياانا ياهو ....<br />اه علي فكرة موضوع السور ده اول ما قريته افتكرت حاجتين ...<br />1 - اغنية الشيخ امام ..( بيني وبينك سور ورا سور واانا لا مارد ولا عصفور )<br />2 - هتاف دايما بنهتفه في المظاهرات ( ابني في سور السجن وعلي بكرة الثورة تقوم ماتخلي )"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021858/http://masr.20at.com:80/article.php?sid=45&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 3
subject = "السياج - السور + الجدار + القيد + الطوق و الاسورة"
author = "كرميلينو"
posted = "2006-03-22"
text = "مين بيحب السور ؟؟<br />مفيش عشان كده لقيتها فرصه عشان نشعر مع بعض شويه<br />هي ديباجه لاول ديوان لامل دنقل و هو ديوان البكاء بين يدي زرقاء اليمامه<br />ديباجه<br />امل دنقل 1969<br />آه ما اقصى الجدار<br />عندما ينهض في وجه الشروق<br />قد يضيع العمر حين نثقب ثغره<br />ليمر النور للاجيال مره<br />لو لم يكن هذا الجدار<br />ما عرفنا قيمة الضوء الطليق"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525021858/http://masr.20at.com:80/article.php?sid=45&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

