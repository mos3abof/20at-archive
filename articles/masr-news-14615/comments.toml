author = "احكام فى الهواء"
posted = "2009-12-28"
text = "سبق وان حكمت المحكمة برفع الحراسة عن الجامعات<br />وسبق وان حمكت المحكمة بالافراج عن بعض المعتقلين<br />وعشرات الاحكام التى لا يتم تنفيذها اطلاقا<br />واصل نقابة المهندسين كانت قد ارتكبت فعل فاضح وفى قارعة الطريق فقررت الحكومة الحجر عليها وفرض حراسة مشددة عليها لمدة 15 سنة<br />وتخيل نقابة مهندسين تدار بامن الدولة<br />يا عم بلاش مسخرة<br />انا عايز واحد يذكر ان فى اى دولة من دول العالم المتقدم والمتاخر فرضت حراسة على نقابة<br />النقابة لو فيها واحد اخطأ يعاقب امام المحمة فى يوم او اسبوع او شهر وياخد حكم وخلاص<br />انما نقابة بالكامل توضع تحت الحراسة<br />لية"
