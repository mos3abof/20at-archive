subject = "ياااااااااا ظاااااالــــــــم"
author = "العابد لله المحمد"
posted = "2005-11-30"
text = "بسم الله الرحمن الرحيم<br />الله اكبر ولله الحمد :الله فوق كل شئ .. الله اعلى منى ومنك( يافقى ) ياااظالم......<br />يا من شتت عقولنا بلتفكير هل انتو لسه مشبعتوش .. انتا عوزين ايه بالضبط...<br />سرقتواا فلسنا .. يتمتو اطفال هذه البلد الامنه بالاعتقالات ...<br />والله الذى لا الله الى هو:ان نصر الله قريب..<br />حتى صوتنا حاولتو فى شرائه لكن فشلتووو..<br />من اهل بورسعيد الباسله .. واهل ام خلف .. واهل الابوطى..(تهنئ د\\ جمال حشمت)على المجلس .. رغم انف الظالمين..<br />وفى الختام//<br />فئقول لكم ..(حكمتم فظلمتم . وملكتم فقهرتم .. وما من اكباد اجعتموها.. ولا اجساد اوجعتموهاا..ففعلو ماشئتم ففئنا صابرون .. وسيعلم الذين انقلبو اى منقلبن هم ينقلبون.........<br />والسلام عليكم ورحمة الله وبركاتة"
archived = "2006-10-13"
