author = "تماثيل رخام"
posted = "2009-09-06"
text = "انا كنت طفلا فى تلك المرحلة<br />مرحلة المد الثورى واغانى عبد الحليم وصلاح جاهين<br />كان باغانية يجعلنا نعيش فى الاحلام وفى وسط حدائق وزهور وروائح البنفسج رغم اننا كنا نقف فى الطين<br />استمع الى اغانية مثل بستان الاشتراكية<br />وعبد الحليم بيغنى كلماتة عن المداخن والماذن وعن تماثيل رخام على شواطىء الترع وعن اوبرا او مبنى للاوبرا فى كل قرية عربية<br />وفى النهاية يقول لك دة مش امانى ولا كلام اغانى<br />كان بيزرع الامل فى قلوب الفقراء<br />كان بيقول ان مصر هتبقى عظيمة لو اشتغلنا كلنا لان مفيش احد هيبنيها غيرنا<br />مفيش لا مثتثمر ولا مستعمر هيبنى لنا بلدنا واحنا قاعدين نتفرج<br />وبعدين<br />جاءت نكسة 67<br />واصيب صلاح جاهين بالكابة ومات حزينا مهموما<br />وماتت الاحلام معة<br />لم نعد نحلم فى مصر بعد صلاح جاهين<br />يا واد يا تقيل يا مجننى والجو ربيع والدنيا ربيع والجوبديع<br />وقفل على كل المواضيع<br />تلك كلماتة<br />ومات"
archived = "2009-09-07"
capture_url = "https://web.archive.org/web/20090907171310/http://www.20at.com:80/masr/review/13194-2009-09-06-12-52-53.html"

