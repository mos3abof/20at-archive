text = "كنا نسبق كوريا الجنوبية فى التنمية ولم تكن ماليزيا ظهرت بعد<br />واليوم بفضل السادة اللواءات الذين تقاعدوا من الجيش و امسكوا رؤساء مجالس ادارات شركات القطاع العام وفلسوها وخربوها وباعوها<br />اصبحت بلدنا تجلس على قارعة الطريق تتسول من البنك الدولى ودول الخليج ودول الاتحاد الاوروبى<br />وشبابها تفترسة البطالة"
archived = "2009-09-07"
