text = "التطرف في التحرش<br />في مصر متحرشين متطرفين يعني بيتحرشوا بعنف ودا سببه الياس من الزواج<br />اي والله فيه فئات من المجتمع بسبب ارتفاع الاسعار وعدم وجود مستقبل اصلا لهؤلاء الشباب لا في وظيفه ولا في شقه ولا في مهر فاصبحوا متطرفين في التحرش يعني بيتحرش باسلوب غبي وانتقامي من هذه المرأة او الفتاه التي هو متأكد انه لن يستطيع ان يصل اليها ابدا<br />فاصبح التحرش في مصر فيه تطرف<br />بصو في الصورة ستجدوا صحة ما اقول بيعاكسوا بطريقة غبية متطرفه<br />وطبعا ننتهز الفرصة و<br />نشكر رجال الثورة المباركه الذين قضوا على الاقطاع والزواج في مصر<br />وشكرا"
archived = "2009-12-04"
