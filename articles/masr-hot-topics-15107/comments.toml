author = "سبيت ميت دين"
posted = "2010-01-30"
text = "بقى لى اسبوع دايخ على انبوبة بوتاجاز<br />نفسى اشرب كباية شاى - ومش مهم ام الطبيخ والاكل<br />ها احتفل باية<br />ما كل لعيب لهف ربع مليون جنية فى مباراة واحدة - فى جريدة الشروق كل لعيب لهف ربع مليون جنية عمرى ما اهمسك ربعهم ولا انا ولا عيلتى كلها<br />ها احتفل باية وانا شايل انبوبة البوتاجاز وعمال الف على بتوع البوتاجاز"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131121953/http://www.20at.com:80/masr/hot-topics/15107-2010-01-29-18-32-27.html"

