text = "السلام علي الجميع ..<br />ألف مبروووك للمنتخب المصري<br />ويا أخ ميمون .. أنت محروق ليه .. ده ماتش كورة وخلص وراح لحاله<br />ربنا يقدركم بقى علي كأس العالم .. أحنا أثبتنا بأننا الأجدر .. أثبتوا العكس لو قدرتم<br />حظ أوفر المرة القادمة للمنتخب الجزائري .. وبرغم كل شيء .. هنشجعكم في كأس العالم ."
