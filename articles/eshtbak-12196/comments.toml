author = "عمار فوزي الياسين"
posted = "2009-06-09"
text = "اشكر الاخ الكاتب على هذه المقاله التي لوحظ وجود امور واقعية عالية فيها وتدل على اطلاع الاخ الكاتب على يوميات الحياه وما يجري بها , وما هي هموم العراقيون وماهي ارائهم وتفكيرهم .<br />حقيقة يوجد الكثير بل الكثير جدا من الامور التي يجب على الحكومة العراقيه النضر بها بعين الاعتبار بصورة جديه اكبر وما كتبه الاخ الكاتب هو جزء بسيط من هذه الحالات والتي نتأمل ان توجد لها حلول في الفترة القريبة .<br />شكرا جزيلا"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621134841/http://www.20at.com:80/20at/eshtbak/12196-2009-05-26-14-11-08.html"

[[comments]]
order = 11
subject = ""
author = "ليث كاظم بدن"
posted = "2009-06-09"
text = "الاخ العزيز فواد فليح حسن ان ما كتبتة يعبر عن ما يحتاجة المجتمع العراقي …<br />وانا اقول ان المفسدين من المسوؤلين الحكوميين والمنتسبين الى الدوائر الحكومية هم كالارهابيين الذين يقتلون العراقيين بل اشد خطرا وعلى الحكومة ان تعمل بالقوانين العرفية ضدهم هذا رايي من جانب .<br />ومن جانب اخر اقول ان كل مسوؤل عندما يتقلد منصب معين يجب ان يقول بلسانة وفعلة انا اعمل خادم للشعب اعمل (خـــــــــــــ ـــــــــــــــ ـــــــادم ) واذا لا يليق به موضوع الخدمة للشعب فليترك المسوؤلية . وان الامور والخطوات التي يجب اتباعها من اجل ابعاد من يحب السلطة وجمع الاموال من السلطة هي ان لايكون راتب المسوليين راتب اعلى من راتب رائيس الولايات المتحدة جورج بوش مثلا او ان لايكون راتب عضو البرلمان اكبر من (مجموع رواتب اعضاء بعض البرلمانات) .<br />كما واقول ان رائيس الوزراء هو المسوؤل عن الفساد الموجود في وزارتة كما ان البرلمان مسوؤل عن الرقابة حيث على ريس الوزراء اتخاذ خطوات فعلية لمعالجة ذلك وتفعيل دور المواطن والموظف البسيط من اجل المساهمة بالقضاء على الارهاب الوزاري الغير مسلح والذي هو اخطر من الارهاب المسلح …"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621134841/http://www.20at.com:80/20at/eshtbak/12196-2009-05-26-14-11-08.html"
