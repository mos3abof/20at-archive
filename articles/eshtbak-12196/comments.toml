posted = "2009-06-08"
text = "تحياتي الى القراء الكرام (((((تحيه خاصه للكاتب المثقف اخي وصديقي العزيز فؤاد ))))))) كنت اتمنى ان تكون الحقيقه غير ذالك ولكن للأسف هذا هو الصحيح فا الوزير كا (الحوت) يأكل ولايشبع وكذالك باقي المدراء والمقاولين وهم يعرفون حقيقه انفسهم الجشعه انا اطلب دوله الوزراء اولا بتدخل ومثلما يعدم ويحارب الارهاب ان يحارب الفساد والا لمن نشتكي الى غير الله يأخي عدد الفقراء والايتام والارامل في العراق لا يوجده مثه مثيل في_كل انحاء العالم _ حتى في الصومال والسودان سساعدوهم ساعدكم الله في شبع بطونكم انا اطالب بستجواب كل الوزراء وكل اعضاء مجلس النواب لان حسب تقرير الامم المتحده ان اشتعال الحرب الاهليه في العراق سببها _اعضاء مجلس النواب_"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621134841/http://www.20at.com:80/20at/eshtbak/12196-2009-05-26-14-11-08.html"

