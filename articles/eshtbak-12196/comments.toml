text = "يا أخ فؤاد هذه المآساة لااعتقد انه سيوضع لها نقطة نهايه فالشعب في كل يوم يموت ويغدر ويهان ويطااااااالب بتصفية حسابات قديمه من اقرب الدول متناسين في ذلك جرح العراق ووضعه ال[ *** ]يف الذي شابه الضعف والاهمال من قبل المسؤولين جميييييييييييعا دون استثناء مهملين في ذلك صورة بلدهم الذي يفترض عليهم ان يضهروها بافضل وابهى صوره … واخر القول( انا الله في المرصاد ) انشاء الله سيحاسب كل من اهمل في واجبه وخان الامااااااااانه …زوشكرا"
