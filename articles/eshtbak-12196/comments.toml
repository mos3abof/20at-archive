text = "في البداية تحياتي الحارة لكم<br />انا حسب رأي لا يجوز للوزراء والمسؤولين سرق اموال الدولة ونهبها<br />فهاذا يؤدي الى فقر بلدنا على الرغم من ان بلدنا غنيا بنفطها وثرواتها<br />وانتم برئيكم هل يحاسب المسؤولون والوزراء على فعلتهم هاذا ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ ؟<br />مع جزيل الشكر"
