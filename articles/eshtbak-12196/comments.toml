author = "هارون عمايرة-فلسطين"
posted = "2009-05-26"
text = "الاستجواب اخي الكاتب امر جميل جدا<br />لكنه غير متوقع وغير مجدي في مجتمعاتنا العربية نهائي فماذا وحتى لو تم الاستجواب ماذا سوف يحصل مع هذا الوزير او المسؤول هل برأيك سوف يحاكم بل بالع[ *** ] سوف يعطى صك غفران من الطراز الكاثوليكي الاول على عهد مارتن لوثر<br />وبهذا يزداد المواطن الذي قام بالاستجواب حسرة على عدم تحقيق حلم قرار استجواب الشخص المراد محاكمته<br />نتمنى انه عندما مفكر في الاستجواب ان نذهب الى حدائق ديزني لاند وان نرسم شخصية وزرائنا الذين نرغب في استجوابهم ونستجوبهم بالصور افضل من الواقع حتى لا يجكم علينا بالموت بعدها<br />فالموت خلفنا وتحت امرة غيرنا"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527215417/http://www.20at.com:80/eshtbak/12196-2009-05-26-14-11-08.html"

[[comments]]
order = 2
subject = ""
author = "karim"
posted = "2009-05-27"
text = "تحياتي واعتزازي بك اخي الكاتب<br />ان جميع المسؤلين وبدون أستثناء لايهمهم لا الشعب ولا الوطن تهمهم فقط مصالحهمالشخصيةل يس إلا .<br />فلو يهمهم المواطن البسيط لما حصل ما حصل. انظر ما حدث للشعب العراقي من قتل وتهجير ودمار . لو يشعر الوزير او المحافظ او …بما نعانية من فقر رغم ان العراق من البلدان الغنية. اخي كيف نبني عراقا ديمقراطيا والحكومةتعمل جاهدة على نهب خزينة العراق وإلا مذا تعني الرواتب الشهريةالتي يتاقضونها والعراق في بداية البناء ان القلم عاجز عن شرح كل الامور .اما مسألة استجواب الوزراء عن الفساد المالي والادري فهذة مسرحية كوميدية وبكرة افكرك مع جزيل الشكر والاعتزاز"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527215417/http://www.20at.com:80/eshtbak/12196-2009-05-26-14-11-08.html"

