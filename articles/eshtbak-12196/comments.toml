author = "معين كوع - فلسطين"
posted = "2009-06-02"
text = "عزيزي فؤاد،،،<br />ليس أجمل من الشفافية، والمسائلة،،، فهي من مقومات الحكم الصالح والرشيد يا صديقي، ولا مسائلة دون وجود شفافية.<br />السؤال هنا: هل تنشر حكوماتنا العربية معلوماتها لتتقاسمها مع جمهورها أم لا؟ أنت تعرف الاجابة، لذلك لن تكون هناك مسائلة في ظل غياب الشفافية.<br />مع تمنياتي لك ولكل العراقيين بعراق، مشرق ومزدهر وحر وديمقراطي تسوده الشفافية"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621134841/http://www.20at.com:80/20at/eshtbak/12196-2009-05-26-14-11-08.html"

