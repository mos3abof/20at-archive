text = "لا نطالبكم بمراسلين عباقرة، أقل شيء أشخاص يعرفون الفرق بين رأي فرد واحد ، ورأي شعب(إذا كان المبدأ أصلا موجود)..<br />الشعب لا يميل للمظاهرات والانقلابات لأنه يرى-قديما وحديثا- أناس فعلوا أقل من ذلك وانتهى بهم الأمر إما في السجن أو القبر."
