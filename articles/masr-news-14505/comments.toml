author = "نظير خدمات"
posted = "2009-12-22"
text = "طبعا مش ببلاش<br />اليهود مش بيعملوا حاجة ببلاش ولا هم جمعية خيرية<br />السادات اعطاهم فرص العمر - اول فرصة اثناء حرب 73 منع الجيش من التقدم لخط الممرات الجبلية فى اول 3 ايام للحرب لسد الممرات — مما سهل لليهود اختراق قواتنا والعبور لمحاصرة الجيش الثالث<br />الفرصة التانية هى الاستسلام فى كامب ديفيد ومن نتيجتها ما تاخذة اسرائيل من غاز ببلاش من مصر ونزع سلاح سيناء<br />اليهود عارفين حبايبهم<br />مش جيهان بنت مريانا مراتة برضة"
archived = "2009-12-24"
