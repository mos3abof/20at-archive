author = "القوات فى وضع مكشوف"
posted = "2009-12-22"
text = "ىجرت حرب الاستنزاف كلها والقوات كانت مكشوفة ولكنها متخندقة وكانت الطائرات الاسرائيلة بتعمل حاجة اسمها الساقية فوقهم بمعنى ان سرب يقذف ويمشى ثم يتبعة سرب اخر ويمشى وهكذا فى دائرة اشبة بالساقية ولم تكن هناك خسائر تذكر<br />لا نريد مبررات لاخطاء حدثت"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224161625/http://www.20at.com:80/masr/news/14505-2009-12-22-08-54-51.html"

