subject = ""
author = "كل شىء عن الحرب"
posted = "2009-12-22"
text = "كل شىء عن حرب اكتوبر مكتوب فى مواقع عربية واجنبية وبالصور على النت<br />مفيش اسرار ولا حاجة مستخبية<br />يعنى من الممكن تشوف صور المعبر الاسرائيلى اللى عملوة على القناة فى الثغرة وعبرت دبابتهم علية - معبر عائم بتكنولوجيا الرولر بتجرة دبابة برمائية وتركبة بدون مدافع مياة ولا يحزنزن<br />الحقيقة ان القادة العسكريون لم يستغلوا نجاح العبور ويندفعوا باقصى سرعة الى الامام هذة شهادة جنرال فرنسى - كنا مصابين بمرض الخنادق انتقلنا من الخنادق غرب القناة للخنادق شرق القناة<br />كان اداء الجيش اكثر من رائع والروح المعنوية فى السماء ولكنها كانت قيادات تعبانة وعجوزة وتحارب بتكتيك الحرب العالمية الاولى<br />لو كنا استغلينا نجاح العبور واندفعنا الى الامام كنا وصلنا الى العريش تماما كما استغلت اسرائيل نجاحها فى ضرب الطيران سنة 67 وتقدمت باقصى سرعة الى شواطىء القناة<br />يجب ان نتعلم<br />ونعلم اطفالنا ولا نخجل من اخطائنا<br />كل شىء موجود بالصور وعلى النت<br />ويا ريت يرجعوا تانى تدريس مادة الفتوة والتربية العسكرية فى المدارس والجامعات"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224161625/http://www.20at.com:80/masr/news/14505-2009-12-22-08-54-51.html"

