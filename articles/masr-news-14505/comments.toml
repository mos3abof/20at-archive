text = "ربما كان قرار خاطئ بالتراجع يحتمل أن يكون من اجل الحفاظ على القوات …<br />أما عن مناورة ( الخندقة) فدي تنفع فى باطن الأرض … لكن فى ممر جبلي يبقى هنخسر كتير .. أينعم مش هنخسر مكان ولكن هنخسر أفراد أحنا محتاجين كل واحد فيهم .<br />مجرد نظرية يعني"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224161625/http://www.20at.com:80/masr/news/14505-2009-12-22-08-54-51.html"

