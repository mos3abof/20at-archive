text = "أي علم أنتم رافعوه لماذا لاتستحوا وعلم بني صهيون يرفرف في بنياتكم وفي سماء بلدكم اليوم الذي ترفعون فيه العلم حقيقة وتحسون بالنصر هو يوم طرد السفير الصهيوني وغلق السفارة اللي في العمارة آلك رفع العلم آلك اختشوا الهالم يضحك عليكوا"
archived = "2010-02-04"
