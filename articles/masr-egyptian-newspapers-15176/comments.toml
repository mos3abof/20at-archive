text = "زالله يازكريا انت على حق وكل شريف في مصر يشاطرك الرأي أي أحتفال تتغنون به احتفال الاغبياء السفارة في العمارة والجدار الفولاذي ويبكوا من الجزائريين جردوهم من الكرامه في السودان وانتم اصلا لكم كرامة وعلم الصهاينة يرفرف فووق صدور نسائكم حاشا اشراف مصر وعلمائها الاخيار"
archived = "2010-02-04"
