order = 0
subject = "اللهم تقبل صيامنا"
author = "شيرين عبد الحميد"
posted = "2006-10-05"
text = "يقول الحديث القدسى بلسان رب العزة كل عمل ابن ادم له الا الصيام فانه لى و انا اجزى به و يقول رسولنا الكريم ان هناك بابا فى الجنة لا يدخل منه الا الصائمون, اللهم تقبل صيامنا فما صومنا الا طاعة لك و ايمانا و احتسابا لوجهك الكريم و طمعا فى دخول جنتك برحمتك و مغفرتك و كرمك بعتقنا من النارو صلى اللهم و سلم و بارك على سيدنا محمد و على اله و صحبه اجمعين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123922/http://www.20at.com/article2.php?sid=1310"
