subject = ""
author = "جدة رئيس وزراء سابق"
posted = "2009-12-05"
text = "عمرو خالد بتاع حدوتة قبل النوم سليل اسرة عريقة فقد كان جدة رئيس وزراء لمصر ايام الملك ولكنة ليس اداريا ولا اقتصاديا ولم يكن على راس مؤسسة ليديرها بل داعية ويجذب المراهقين بحكايتة وطريقة عرضة المسلية ويصلح ان يكون وزيرا للاوقاف"
archived = "2009-12-17"
capture_url = "https://web.archive.org/web/20091217183053/http://www.20at.com:80/masr/news/14252-2009-12-05-09-33-51.html"

[[comments]]
order = 1
subject = ""
author = "ارشح عمر خالد"
posted = "2009-12-05"
text = "مصر بحاجه الى رئيس جمهورية شاب وعنده نشاط وحيويه مثل عمرو خالد<br />مصر بحاجه الى نهوض<br />مصر في المرحلة المقبلة بحاجة الى من يحل مشكلة الفقر الذي ضرب في كل انحاء مصر<br />يا جماعة بعد صلاة العشاء فوجئت بالشيخ الجامع بينادي لجمع تبرعات لمريض في المستشفى بحاجه الى عشر حقن ثمن الحقنه 1200 جنيه<br />تصوروا يا جماعة حقنه في مصر بـ 1200 جنيه<br />احنا عايزين واحد زي عمر خالد يحل مشكلة الفقر<br />مش عايزيه واحد بشنب ولا من غير شنب<br />عايزين واحد ينظر الى حل مشكلة الفقر في مصر<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــتت<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-12-17"
capture_url = "https://web.archive.org/web/20091217183053/http://www.20at.com:80/masr/news/14252-2009-12-05-09-33-51.html"

[[comments]]
order = 2
subject = ""
author = "لا شرعية للقادم"
posted = "2009-12-05"
text = "بدون تطبيق المطالب بتاع البرادعى لن يكون هناك شرعية لاى رئيس قادم وهى نفس شروط امريكا لتوريث ابن حسنى - رقابة القضاء - رقابة دولية - دستور او مواد دستورية جديدة تعطى اى مصرى الحق فى الترشيح وطبعا زلزال كبير للنظام<br />انا ارحب بالبرادعى رئيسا لمصر لانة راجل بشنب مصرى اصيل ومن ابوين وجدين مصريين وليس فى دمائة انجليز او يهود"
archived = "2009-12-17"
capture_url = "https://web.archive.org/web/20091217183053/http://www.20at.com:80/masr/news/14252-2009-12-05-09-33-51.html"

[[comments]]
order = 3
subject = ""
author = "مبروك لحسنى"
posted = "2009-12-05"
text = "مبروك لحسنى مبارك وابنة من بعدة<br />والبقاء للة فى مصر اللى هتروح فطيس<br />ولكتبة السلطان الجاهزين بمقالات ذم وقدح فى ادراجهم<br />موتوا بغيظكم<br />فلن يصح الا الصحيح"
archived = "2009-12-17"
capture_url = "https://web.archive.org/web/20091217183053/http://www.20at.com:80/masr/news/14252-2009-12-05-09-33-51.html"

[[comments]]
order = 4
subject = ""
author = "من يشكك فى وطنيتة"
posted = "2009-12-05"
text = "من يشكك فى وطنية الدكتور محمد البرداعى هو عميل وجاسوس فالرجل وصل فى السلك الديلوماسى الى مستشار وزير الخارجية ثم كان رئيسا لاكبر منظمة عالمية وفرض احترامة على العالم والدول الكبرى<br />الشعب عارف مين هو الخاين ومين هو العميل ومين هو الجبان"
archived = "2009-12-17"
capture_url = "https://web.archive.org/web/20091217183053/http://www.20at.com:80/masr/news/14252-2009-12-05-09-33-51.html"

[[comments]]
order = 5
subject = ""
author = "بانوراما"
posted = "2009-12-06"
text = "محمد البرادعى لا يصلح ان يكون رئيسا لمصر للاسباب الاتيه<br />1- لا بد ان يكون عضوا فى الهيئة العليا لاى حزب سياسى مصرى لمدة عام<br />2- من مزدوجى الجنسية حيث انه يحمل الجنسية السويدية<br />3- مش مخربش و لا له فى سياسة بلدى المصون التى هى فوق كل السياسات<br />4- الحزب الوطنى هيدوس اى حد<br />5- مش من نسل الرئيس"
archived = "2009-12-17"
capture_url = "https://web.archive.org/web/20091217183053/http://www.20at.com:80/masr/news/14252-2009-12-05-09-33-51.html"

