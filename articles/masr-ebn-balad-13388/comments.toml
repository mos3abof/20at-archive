posted = "2009-09-21"
text = "اولا كل من شارك فى حرب اكتوبر حصل على وظيفة حكومية بقرار من السادات بعد الحرب مباشرة فانت وظفوك فين ولية تركت الشغل والمفروض لك معاش محترم"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"
