subject = ""
author = "كنت بتحارب"
posted = "2009-09-20"
text = "كنت بتحارب علشان ام البلد تتورث<br />فيها اية لو شارون دخل البلد مش كان بقى احسن من اننا نشعر اننا حضيرة مواشى بتتورث"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
