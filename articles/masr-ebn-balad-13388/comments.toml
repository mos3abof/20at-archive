[[comments]]
order = 0
subject = ""
author = "جتك ستين خيبة"
posted = "2009-09-08"
text = "حاربت يا خويا فى 67 والاستنزاف وحرب اكتوبر واخرتها معاش ب 48 جنية وبتبيع شاى والبلد كلها سرقوها<br />كنت بتحارب علشان تحرر سيناء علشان يعملوا فى شرم الشيخ صالات قمار ومواخير<br />كنت بتحارب لحساب مين<br />واخرتها<br />قسموا ارض البلد على بعض فى الساحل الشمالى واعطوا اسرائيل الغاز وانت اخذت خازوق"
archived = "2009-09-11"
capture_url = "https://web.archive.org/web/20090911090404/http://20at.com:80/masr/ebn-balad/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 1
subject = ""
author = "تستحق ضرب الجزمة"
posted = "2009-09-09"
text = "كلما شاهدت نتنياهو و ولمرت وغيرة ياخذهم المسئولين الكلاب عندنا بالاحضان فى الشرم كلما ندمت على السنين الهدر التى ضاعت على جبهة القتال وبكيت على ارواح الشهداء التى ذهبت عبثا<br />لو كان اليهود دخلوا القاهرة وحكمها شارون لم يكن يخرب الدولة مثلما خربها قيادات الحزب الوطنى والجالسين على الكراسى"
archived = "2009-09-11"
capture_url = "https://web.archive.org/web/20090911090404/http://20at.com:80/masr/ebn-balad/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 2
subject = ""
author = "مواطن مطحون اكيد"
posted = "2009-09-11"
text = "والله حرام بقا الناس اللى حربت وشالت الطين يبقا ده حاله والناس التانية يجعل كلامنا خفيف عليهم عاملين يسرقوا التاريخ واحد راح لحالة وده طبعا رجل الحرب والسلام وكلنا عارفينو والتانى اللى كابس على نفس اللى جابونا صاحب اول ضربة جوية سرقوا البلد وتاريخه والناس اللى حربت بجد مش لاقيه تاكل حسبى الله ونعم الوكيل"
archived = "2009-09-12"
capture_url = "https://web.archive.org/web/20090912050807/http://www.20at.com:80/masr/ebn-balad/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 3
subject = ""
author = "الغلط"
posted = "2009-09-12"
text = "احنا غلطنا لاننا لما الحرب خلصت واللى مات فى الرمل مات واللى رجع من غير ايد واللى رجع من غير رجل - سلمنا سلاحنا ورجعنا<br />رجعنا بلادنا وقرانا<br />كنا فاكرين نفسنا منتصرين<br />لما رجعنا لقينا السادات جاب اليهود ورانا فى الغيطان فى القرى وجايين ومعهم المبيدات المسرطنة والبذور الفاسدة<br />ولقيناهم فى الفنادق والمتاحف والوزرات<br />كنا فاكرين نفسنا انتصرنا<br />انما الواقع اننا بعد الانتصار استسلمنا وركعنا<br />ولم نحمل السلاح تانى<br />قلنا واحنا مالنا<br />لما البلد راحت"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 4
subject = ""
author = "حروب اية"
posted = "2009-09-13"
text = "فى حرب العدوان الثلاثى سنة 1956 كان الشهداء من العسكريين والمدنيين 950 قتيلا<br />وفى حرب سنة 1967 النكسة بلغ عدد الشهداء 7 الاف شهيد<br />وفى حرب 1973 بلغ عدد الشهداء 12 الف شهيد<br />اما عدد القتلى فى حوادث الطرق سنة 2008 فقط فى مصر فهم 63 الف قتيل وهم فى سنة واحدة يعادلوا 3 اضعاف ضحايا جميع الحروب<br />فى ذمتك دى مش مسخرة"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 5
subject = ""
author = "مساعدة من مين ؟"
posted = "2009-09-13"
text = "اذا كان العدو اللى كنت بتحاربة هم الحكام الان عن طريق اعوانهم<br />انت عايز اعدائك يساعدوك<br />كفاية انهم سايبينك عايش"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 6
subject = ""
author = "شفت اليهود"
posted = "2009-09-14"
text = "هيساعدوك بمناسبة اية<br />حصار اسرائيل للجيش الثالث وحصار السويس وتوقف دبابتهم على طريق السويس القاهرة<br />شوية نجاحات فى الاول انتهت بخيبة تقيلة"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 7
subject = ""
author = "حرب المغفلين"
posted = "2009-09-14"
text = "يا مغفل دى حرب كانت مسرحية باتفاق السادات مع كيسنجر اليهودى لتحريك القضية<br />وعمل مفاوضات الاستسلام وانسحاب اسرائيل الصورى"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 8
subject = ""
author = "انت بتعمل شاى"
posted = "2009-09-17"
text = "انت بتعمل شاى فى الشارع ومشرد<br />والملازم اللى كان معاك اترقى وبقى لواء واخر خدمتة عينوة محافظ علشان ينشر الزبالة فى كل مكان"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 9
subject = ""
author = "مش لوحدك"
posted = "2009-09-18"
text = "فاكر مصر ايامها<br />كان الجيش مليون وربع المليون عسكرى<br />كان منهم 126 الف من خريجى الكليات والمعاهد العليا وكان فية 40 الف ضابط احتياط من الجامعيين<br />هما دول اللى صنعوا النصر فى البداية<br />ضباط الاحتياط الابطال والجامعيين<br />انما بتوع ال 50 ثانوية عامة والبصمجية فدول اللى جابونا وراء"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 10
subject = ""
author = "المنوفى"
posted = "2009-09-18"
text = "يا عم فؤاد<br />روح اتفرج على نتائج حربك فى شرم الشيخ<br />واتفرج على المايوهات البكينى وصالات القمار وشواطىء الغطس للعراة وممارسة الجنس تحت الماء<br />روح اتفرج على فندق الفور سيسونز بتاع هشام مصطفى<br />حرب اية يا راجل نص كم<br />مش كانوا بيضحكوا علينا ويقولوا انهم هيعمروا سيناء بعد التحرير بتسكينها خمسة ملايين مصرى يبقوا سد بشرى امام اعادة غزو اسرائيل لسيناء تانى<br />كان كلام<br />كانوا بيضحكوا علينا"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 11
subject = ""
author = "فى العشة صور"
posted = "2009-09-18"
text = "صور لعم فؤاد وهو قدام الدبابة او مع القادة<br />ازاى<br />وهناك اوامر عسكرية بحظر التصوير فى الوحدات العسكرية وعدم اصطحاب كاميرات<br />انت ازاى اتصورت وقت الحرب والعمليات وازاى كاميرا دخلت المعسكر<br />اسكت يا راجل انت ليحاكموك عسكريا وشيل الصور دى"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 12
subject = ""
author = "ابعت شكوى"
posted = "2009-09-19"
text = "ابعت شكوى وعريظة استرحام للباب العالى فى قصر عابدين يمكن ينظروا فى حالك ويعطوك علاوة 3 جنية ولفت نظر"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 13
subject = ""
author = "معاش 48 جنية"
posted = "2009-09-19"
text = "معاش 48 جنية يا مفترى<br />يا ترى بتصرفهم ازاى دا انت تلاقيك بنيت من وراهم عمارات وعقارات<br />هيص يا عم<br />48 جنية<br />اية الهنا دة"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 14
subject = ""
author = "فى الحرم المكى"
posted = "2009-09-19"
text = "فى الحرم المكى الشريف جلست بجوار اتنين مصريين زى عمو فؤاد بيتكلموا عن احوال البلد<br />ويظهر انهم كانوا محاربين قدماء امثال عم فؤاد<br />قال احدهم للتانى<br />يظهر انة بعد فترة وبعد ان نمشى على عكاكيز البلد هتحتل مرة تانية<br />الجيل الجديد مفيش فية اى انتماء او نخوة"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
order = 15
subject = ""
author = "نتيجة الحرب"
posted = "2009-09-19"
text = "12 الف شهيد على الجبهة المصرية<br />6 الاف شهيد على الجبهة السورية<br />الفين 2000 قتيل اسرائيلى<br />حررنا 12 كيلوا شرق القناة واحتل اليهود السويس و20 كيلو غرب القناة وتم حصار الجيش الثالث<br />من اجل هذا السادات عرف ان مفيش فايدة<br />فوقع اتفاقية كامب ديفيد للاستسلام"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105150517/http://20at.com/masr/profile/13388-2009-09-08-12-12-44.html"

[[comments]]
