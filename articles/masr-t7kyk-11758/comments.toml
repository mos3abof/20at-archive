author = "نبيفين نيفى نوفا"
posted = "2009-05-08"
text = "رجاء يا جماعه شيلو الاول صوره البنى ادم اللى فوق ده علشان بجد بينرفزنى<br />فعلا المستوى تدنى فنيا لاقصى درجه<br />و علشان كده الواحد بيدور على الاغانى القديمه و يسمعها<br />و اغانى التمانينات و اول التسعينات<br />نصيحه للى عايز يسمع يستنى الفقره اللى بتيجى على دريم الصبح<br />بس بدرى شويتين"
archived = "2009-05-19"
