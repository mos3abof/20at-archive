subject = "غريبة"
author = "مصري مدحور"
posted = "2006-06-08"
text = "انا مش عارف انت ليه معقدة كده, بتحصل في احسن العائلات اقصد الدول, وايه يعني كام الف واحد يتحرقوا ولا يموتوا كل سنة؟؟ يا اخي زكاة عن العدد الكبي (بسم الله ما شاء الله) ومتبقاش من اياهم بتوع نظرية المؤامرة, اقولك على سر الخطوة اللي جاية حبة كلور مطهر في مية الشرب واهو ممكن نوصل لرقم 100000 في الضحايا الغلابة , قدرهم بقى زي عروسة النيل"
archived = "2006-09-12"
