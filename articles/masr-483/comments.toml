subject = "حريق حريق حريق"
author = "محمود صباح"
posted = "2006-06-08"
text = "الحكومة بتطبق نظرية عم احمد فؤاد نجم اللى قالها من زمان لما قال<br />هتقولى الفقراء ومشاكلهم دى مسائل عاوزة التفانين<br />انا رايئ نحلها ربانى ونموت كل الجعانين<br />طبعا الحكومة عاوزة تتخلص من الشعب المصرى الشقيق على رأى الصديق نصر القفاص علشان كده بدل ما تستنى على الاطفال دول وتكبرهم وتربيهم وتصرف عليهم دم قلبها وبعد كده تموتهم سواء بحريقة او بغريقة ( معلش القافية تحكم ) او باى مصيبة يبقى توفر المصاريف من بدرى بدرى وتخلص منهم .. ولنا الله"
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912043447/http://masr.20at.com:80/article.php?sid=483&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "الحل من المنبع"
author = "فلتذهب الطفوله و الاطفال الى الجحيم"
posted = "2006-06-09"
text = "فمن يعلم غير الله فربما يشبون عن الطوق ويصيروا من اعضاء كفايه او غيرهامن القله المندسه المموله من الخارج فيعارضوا النظام و رجاله<br />وهكذا فان القضاء على المشكلات من المنبع افضل كثيرا من الانتظار<br />\"فالصئبان تكبر فتصير قملا\"<br />ووقوع البلاء ولا انتظاره<br />الى الرضع الضحايا هنيئا لكم يا<br />عصافير الجنه<br />أأأأأأأأأأأأأأأأأأأأه يــــــأ بـــــــلــــــــدى"
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912043447/http://masr.20at.com:80/article.php?sid=483&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "التجاااهل"
author = "سوسة المفروسة"
posted = "2006-06-09"
text = "ان اكثر ما يؤلمني هو التجاهل التام لهذا الحدث..فلم نجد الاب الحنون يتكرم و يزور المستشفى او حتى نسمع انه اصدر تعليماته للتحقيق فى الحادث<br />بل ان وزير الصحة الهمام -اللي الواحد مش عارف بالظبط هو وزير صحة والا اعلام من كتر مابيطلع في التلفزيون- ماكلفش خاطره و راح زار موقع الحدث<br />طبعا ماهو لو كان في الحادثة اجانب كان الاب الحنون راح<br />ولو كان فيها فنانين (احمد زكي- سعاد نصر- يونس شلبي) كان وزير الصحة راح<br />ولو كان احتراق 6 اطفال في مثل اهمية حجاب حنان ترك او بنت احمد الفيشاوي كان (البيت بيتك ) عملهم حلقة<br />وعجبي<br />http://ghadaabdo.jeeran.com"
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912043447/http://masr.20at.com:80/article.php?sid=483&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "خد عندك"
author = "الخارجية الإسرائيلية طالبت سفيرها بالقاهرة بتوخي الحذر وتجهيز الاعتذار المناسب عن الواقعة : مجندة صهيونية تطلق اسم الرسول علي كلبها .. ومظاهرات الغضب تجتاح نابلس"
posted = "2006-06-10"
text = "كتبت دينا الحسيني ( المصريون ) : : بتاريخ 9 - 6 - 2006<br />شهدت مدينة نابلس الفلسطينية مظاهرة عارمة بسبب قيام مجندة بجيش الاحتلال الإسرائيلي ـ تعمل على إحدى الحواجز المقامة بالمدينة ـ بإطلاق اسم الرسول صلى الله عليه وسلم على كلبها ، مما أسفر عن وقوع عدد من المصادمات بين مئات الفلسطينيين المتظاهرين وقوات الاحتلال .<br />اكتشف المواطن أمجد الأغبر ـ من سكان نابلس ـ جريمة الإساءة للرسول الكريم حينما كانت المجندة الإسرائيلية تدقق في هويته على أحد الحواجز التي نصبها جيش الاحتلال بالمدينة ، إذ تقدم كلب المجندة في هذه الأثناء لمسافة قريبة نحو أمجد ، الذي سارع بنهره خوفا من أن يصيبه بأي أذي ، فما كان من المجندة إلا أن عنفته على الصراخ في وجه كلبها ، وراحت تنادي عليه باسم \"محمد\" .<br />من جانبها ، أصدرت رابطة علماء فلسطين برئاسة الشيخ حامد البيتاوي ـ عضو المجلس التشريعي ـ بيانا أدانت فيه بشدة الجريمة النكراء التي أقدمت عليها المجندة الصهيونية ، واصفة إياها بالحقيرة .<br />وأشار البيان إلى أن جنود الحاجز الإسرائيلي لا يكتفون فقط بتأخير المواطنين والتفنن في تعطيل حركتهم ومنعهم من العبور والاستمتاع بإذلالهم ، وإنما دأبوا أيضا على سب الذات الإلهية والإساءة للإسلام ورسوله الكريم .<br />وفي سياق متصل ، كشفت مصادر صهيونية عن أن الحادث دفع الخارجية الإسرائيلية لإصدار تحذيرات مشددة إلى موشيه كوهين سفيرها بالقاهرة ، مطالبة إياه بتوخي أقصى درجات الحذر ة والحيطة خلال تنقلاته بالعاصمة المصرية ، خوفا من تطاير الخبر للمصريين عبر الحدود .<br />وأوضحت المصا<br />اقرأ بقية التعليق .."
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912043447/http://masr.20at.com:80/article.php?sid=483&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

