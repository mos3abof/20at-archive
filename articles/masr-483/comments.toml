[[comments]]
order = 7
subject = "حسبى الله"
author = "ايوته"
posted = "2006-06-23"
text = "عندكم حق جميعا فيما قلتم ولكن فكروا معى لماذا يفعل الرئيس او وزير الصحه ما يفعلونه فى حاله وجود اجانب او وجود ممثلين؟ الا لان يقال الرئيس فعل او الوزير فعل ويشاد بهم فى الخارج لدى دول الاجانب لن اقول الا حسبنا الله ونعم الوكيل فى الحكومه وكل من يرأسها او يعمل بها وفى كل منافق وفى كل شخص ليس لديه ضمير ونحتسبهم شهداء عند الله كل من مات دفاعا عن الوطن وكل من مات نتيجه الاهمال ولن يترك الله الظالم ابدا وسيحاسبه حسابا عسيرا"
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912043447/http://masr.20at.com:80/article.php?sid=483&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "ربنا يهد المفتري"
author = "مصري ضايع ..."
posted = "2006-07-11"
text = "حسبنا الله ونعم الوكيل فيك يا حسني مبارك وعيلتك وإبنك المحروس بتاع لجنة السياسات اللي بيلعب سياسة وبزنسة ويتعلم فينا وينهب فينا.. وذنب المصريين الغلابة في رقبتك يا ريس .. ما تفرحش بالكام ساعة اللي فاضله في عمرك .. صدقني كام ساعه .. يعني هتعيش كام سنة تاني ؟ سنة . اتنين عشره .. ما فيش حد بيتخلد فيها يا باشا .. كل من عليها فان .. بس قبل ما تفنى حرام عليك تفني مصر اللي بقالك خمسين سنة بتنهب فيها .. سيبها بخير واعدل مرة واحده إذا كنت لسه ليك سلطه في البلد مش حاجر عليك جيمي إبن سوزي .. والله خايف يكون حاجر عليك ومحدد إقامتك وبيتمرغ على كيفه هو والمليارديرات اللي حواليه من الكلاب الحرامية اللي مسكتوهم البلد العرصات .. ربنا يهد المفتري<br />http://ibnbahya.blogspot.com/"
