[[comments]]
order = 0
subject = "الحل الوحيد هو ...."
author = "إبن بهيه"
posted = "2007-02-17"
text = "موضوع مؤلم يا ياسر .. رب صدفة<br />طيب خليهم يتدربوا حلاقين .. وبعدين ؟ سيدور في نفس الساقيه للبحث عن عمل عند أي حلاق ولن يجد مهما كان لديه من شهادات ودورات وخلافه ، ليس لأن الحلاق يريد واسطه كي يعينه لديه في المحل ولكن لأن لديه فائضاص كبيراً من الحلاقين .. المشكلة مازالت موجوده .. لا عمل .. لا دخل .. لا شيء على الإطلاق ..<br />الشيء الوحيد المتوفر في زمن الواطي مبارك وعصاباته هو العمل كبلطجي أو حرامي أو قواد في جمعية المستقبل المظلم بقوادة الجرو الصغن جيمي مبارك الواطي الثاني .. بس .. ودي برضه محتاجه واسطه جامده من أي عضو كبير في الحزن الوطني يكون رصيده من السرقة تعدى العشرة ملايين من قوت الغلابه .<br />يا سيدي الفاضل .. قابلت منذ فترة أحد الشباب الطيبين من خريجي كلية العلوم بتقدير جيد جدا ومرتبة شرف ولحاف كمان .. تعرف كان بيشتغل إيه ؟ موظف أمن في شركة حراسه لا يوفر في آخر الشهر أكثر من خمسين جنيه يعطيهم لوالده المسكين كي يساهم في شراء 2 كيلو بصل من باب حفظ ماء الوجه لا أكثر ، وكمان عشان أهله ما يحسوش بأن حياتهم ضاعت هباء<br />ليس العيب في زيادة السكان وزيادة النسل التي جعل منها الواطي مبارك شماعة لكل بلاويه وخياناته ونجاساته هو وعائلته الكريهه وعصاباته<br />الصين ربع سكان العالم لا تشكو مما تشكو منه مصر بهذه الصورة الملعونة وهي أيضا لم تبع ممتلكاتها ومصانعها وشركاتها للعدو .. الهند كذلك ولن أقول ماليزيا وتايوان وهونج كونج ولا كوريا دي بلاد متقدمه دلوقتي وقد بدأت قبل أعوام بسيطه في تشغيل عجلة النمو .. المشكله ليست في السكان والله .. المشكلة في أن مقدرات البلد باتت في يد لص قذر واطي وعائلته وعصاباته .. وكما يقول المثل<br />إذا كان رب البيت بالدف ضارب ... فشيمة أهل البيت كلهم الرقص<br />وخل<br />اقرأ بقية التعليق .."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123327/http://masr.20at.com:80/article.php?sid=1603"

