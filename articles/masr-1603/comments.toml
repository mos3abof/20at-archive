subject = "تستاهل وعقبال اصحابك يا شاروووون"
author = "علاء"
posted = "2007-02-17"
text = "أنا فعلا دخلت الموقع وشفت الصورة ،كويس والله تستاهل يا شارون ،خليك مرمى كده لا انت طايل موت ولا حياة ..الظالمون لهم جهنم ،كل الظالمين ، كلهممممممممممممم،فاهمين يا جماعة ؟يعنى اللى ببظلم الابرياء واللى بيحبس فى البشر من غير ذنب ،واللى بيشرد البنى ادمين تفتكروا انه احسن من شارون فى حاجة ؟؟"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123327/http://masr.20at.com:80/article.php?sid=1603"

[[comments]]
order = 6
subject = "تحيه الى ابن بهيه"
author = "تحيه الى ابن بهيه"
posted = "2007-02-18"
text = "واضح ان فيه واحد .. وتربيه . عامل شغلته شتم ابن بهيه بقاله كام يوم وحسب علمي ان ابن بهيه راجل كبير وحاصل على اعلى الدرجات العلميه ومش هيتاثر بسرسرة كلب زي ده ولا احنا كمان لاننا عارفين انك حثاله .. وابن بهيه اشرف من ملايين زيك يا..وكلنا ضدكم وضد جمي الكلب وكل كلب واطي على ارض مصر وربنا يخلصنا من كل ا;; اللي زيك يا ..<br />ومعذرة يا ابن بهيه انا عارف انك اكبر من الرد على السفاله .. دي لكن اسمحلي بالرد نيابه عنك وعن كتير زيك محترمين<br />وتقبل كل تحية وتقدير وليمت ذلك .. بغيظه<br />كلنا نحب بهيه واولاد بهيه المحترمين امثالك"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123327/http://masr.20at.com:80/article.php?sid=1603"

[[comments]]
order = 7
subject = "عايزين تدخل من ادارة الموقع"
author = "تحيه للمحترمين فقط"
posted = "2007-02-18"
text = "توجد هجمه قذره على الموقع هذه الأيام وعلى المحترمين فيه وارجو من الاخوة في ادارة الموقع تعقب التعليقات القذره التي لا تحمل اي راي وكلها شتايم وسب وقذف في خلق الله اللي كلنا عارفين انهم شرفاء ومحترمين مش زي اللي بيشتموا القذرين دول<br />كمان فيه حكايه غريبه الايام دي وهي شوية اللينكات اللي بتظهر في التعليقات قبل اي تعليق وبقالها فتره<br />طيب ادارة الموقع مش بتشلها ليه رغم انها ما لهاش اي دخل بالموضوع<br />ارجو ان اتلقى ردا من ادارة الموقع سواء هنا على الموقع او على الايميل بتاعي ان امكن<br />tareq_a_777@yahoo.com<br />تحياتي للموقع وللمحترمين فيه والمحترمين من المعلقين ولا تحيه ابدا للي بيهاجموا المحترمين ويقلوا ادبهم"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123327/http://masr.20at.com:80/article.php?sid=1603"

