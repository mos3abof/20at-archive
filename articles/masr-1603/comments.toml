subject = "الى الاخ اللي فوق"
author = "روح للمرشد العام للاخوان المسلمين محمد مهدي عاكف"
posted = "2007-02-17"
text = "لانهم رافعين شعار الاسلام هو الحل<br />روح احكيلوا مشكلتك<br />وشوف الحل الاسلامي ليها ايه<br />وربنا يفتحها في وشك انت وجميع اللي زيك"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123327/http://masr.20at.com:80/article.php?sid=1603"

[[comments]]
order = 4
subject = "الى الاخ مش فاكر"
author = "ابن بهية هو الحل"
posted = "2007-02-17"
text = "طيب ما تعرض مشكلتك دي على الحيوان اللي اسمه ابن بهية<br />اصل ابن بهية دا راجل مفكر كبير اوي اوي اوي ما عندكش فكره<br />حأقولك على سر بس اوعا تقوله لحد<br />ابن بهية عنده مدونه... تتصور دي<br />روحله وان شاء الله هو حيحلهالك<br />دا راجل مفترج بتاع ربنا"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123327/http://masr.20at.com:80/article.php?sid=1603"

[[comments]]
