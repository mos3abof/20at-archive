subject = "الى المعفن اللي فوق (ابن بهية)"
author = "المعفن اللي فوق بيقول ايه"
posted = "2007-02-17"
text = "الإصلاح الوحيد الممكن والمتاح هو زوال ذلك الواطي ونظامه بالكامل من مصر بداية من رأس الشيطان مبارك الواطي وانتهاء بالوله صنقر عضو المجلس المحلي في كفر البدنجان<br />طيب يلا يا جبان يا ابن الحرمه تقدم ونحن من ورائك"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123327/http://masr.20at.com:80/article.php?sid=1603"

[[comments]]
order = 2
subject = "مصرى للاسف"
author = "مش فاكر"
posted = "2007-02-17"
text = "انا مهندس قسم مش موجود كتير فى الجامعات المهم انا نفسى اسافر اشتغل زبال برة بجد او فى اى محل اة بتاع جرايد او اى حاجة انا فى حالة نفسية وحشة جدااا اليومين دول بالذات مش عارف لية اكيد من الفراغ والعمر اللى بيعدى بسرعة الغريبة ان محدش بيحب الخير لحد لما تيجى تكلم حد على شغل يحسسك ان الدنيا مفيهاش وظائف ولما تيجى تسمعو وهو بيتكلم عن نفسو وعن المرتب وعن الموقع تقول اية دة دة اكيد سفير المهم انا مش عارف اعمل اية غير النت والافلام الجنسية والاغانى وطبعا مبصليش خالص ومعظم الوقت بشتم فى نفسى وفى مصر لان باختصار البلد دى مش بلدى انانفسى اطلع برة على فكرة محدش يقول ان برة زى هنا برة بردو مش هيحترمونى عشان انا للاسف مصرى مبحبكيش يا مصرررررررررررررررررر"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123327/http://masr.20at.com:80/article.php?sid=1603"

