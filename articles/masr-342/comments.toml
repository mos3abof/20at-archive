[[comments]]
order = 1
subject = "طبعا جمال"
author = "أحمد"
posted = "2006-05-18"
text = "طبعا جمال هو اللى بيحكم انت يعنى كنت مستنين حاجة تانية والموضوع ده وغيره حاجة من ضمن الحاجات اللى جمال بيه النبى حرسهوصاينه هو اللى بيتحكم فى حياتنا والله يرحم زمن لكا كان العمدة عمدة وشيخ الأزهر راجل محترم وضابط الشرطة بن ناس وربنا يسامح اللى كان السبب"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904122322/http://masr.20at.com:80/article.php?sid=342&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

