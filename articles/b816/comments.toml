author = "احمد فتحى"
posted = "2006-07-23"
text = "وجدنا كيف اثر عمل المراة على المجتمع و الاسرة فى الغرب ووجدنا كيف ان الاسرة العربية متماسكة لقلة النسبة العاملة من النساء.... الحقيقة ان المراة هى عماد الاسرة و عندما تتركها و يتركز إهتمامها على امر آخر تحدث المشكلة....لا يجب ان يكون عمل المراة هو القضية الكبرى التى تشغل بالها فلسن كثيرات من يستطعن التوفيق بين العمل و المنزل....وما سماه هذا المقال بتقاليد قديمة إنما هو فى الحقيقة فطرة إنسانية تؤدى لتكامل الادوار و إنجذاب كلا من الرجل و المراة للآخر لإختلاف العطاء و من ثم علاقة اقوى وتماسك اكبر.....فكيف باكبر شىء يتميز به الرجل وهو العمل الذى يحقق به ذاته و يؤدى إلى تميزه بعطاء مختلف عن المراة..كيف تنازعه المراة فيه لتقول له انا افضل و اهم منك فى كل شىء و الخاسر فى النهاية هو الطرفان و الابناء و المجتمع كله...الاسرة المتماسكة يجب ان تتكون من قطبين مختلفين لينجذبا"
