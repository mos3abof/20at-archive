posted = "2009-12-02"
text = "اقتباس ام الدنيا:<br />انا مش عارف مين صاحب المصطلح دة - مصر ام الدنيا<br />واحد خليجى قال لى مرة ساخرا<br />اذا كانت مصر ام الدنيا يبقى مين ابوها ومين جوز مصر اللى خلف منها الدنيا<br />فعلا مصطلح يغيظ<br />ثانيا - اطلاق اسم الفراعين على اسم المنتخب - فراعين اية - دة كلمة فرعون تحظى فى التوراة والقران باسوا علامات الكفر والعصيان ومصيرهم النار وباس المصير<br />لماذا لا يقولون المنتخب المصرى ؟<br />الجزائر دولة عربية شقيقة ولو هزمتنا ميت مرة او هزمناهم ميت مرة فهذة لعبة مجرد لعبة للتسلية وقتل الوقت وليست معركة حربية او احتلال اراضى<br />مصر ام الدنيا لانها صاحبه اقدم حضاره فى تاريخ البشريه .. بينما كانت كل دول العالم ضعيفه . لهذا استحقت لقب ام الدنيا .. و هذا شئ من المفروض اننا نفخر بيه مش نحاول ننكره<br />الفراعنه : منهم كتير امنوا بوجود الله و اخرين حاولوا الوصول الى فكره وحدانيه الاله .. و منهم من ساعد الانبياء .. السيده اسيا , سحره فرعون , السيده هاجر , ماريه القبطيه . و غيرهم من لم ينصفهم التاريخ<br />و ايضا ارى انه شرف لنا ان يكون اجدادنا اصحاب حضاره عظيمه تدفعنا ان تكون مثلهم فى يوم من الايام"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106163852/http://www.20at.com:80/masr/hot-topics/14152-2009-11-24-10-31-37.html"

