author = "حروب التوريث"
posted = "2009-11-24"
text = "شقيق الرئيس بوتفليقة رئيس اركان حرب الجيش الجزائرى والوريث المنتظر لحكم الجزائر<br />وبتوع الوراثة فى مصر بيتصارعوا<br />احنا مالنا<br />مش كانوا قاعدين فى المقصورة الرئيسية<br />احنا مالناش اى مصلحة فى مصارعة الديوك اللى عايزين يظهروا فى الصورة ويتلمعوا<br />العالم فية مباريات كل يوم وكل يوم فية كسبان وفية خسران - مبيعملوش زى الناس دى لية"
archived = "2009-11-27"
capture_url = "https://web.archive.org/web/20091127092751/http://www.20at.com:80/masr/hot-topics/14152-2009-11-24-10-31-37.html"

[[comments]]
order = 1
subject = ""
author = "ام الدنيا"
posted = "2009-11-24"
text = "انا مش عارف مين صاحب المصطلح دة - مصر ام الدنيا<br />واحد خليجى قال لى مرة ساخرا<br />اذا كانت مصر ام الدنيا يبقى مين ابوها ومين جوز مصر اللى خلف منها الدنيا<br />فعلا مصطلح يغيظ<br />ثانيا - اطلاق اسم الفراعين على اسم المنتخب - فراعين اية - دة كلمة فرعون تحظى فى التوراة والقران باسوا علامات الكفر والعصيان ومصيرهم النار وباس المصير<br />لماذا لا يقولون المنتخب المصرى ؟<br />الجزائر دولة عربية شقيقة ولو هزمتنا ميت مرة او هزمناهم ميت مرة فهذة لعبة مجرد لعبة للتسلية وقتل الوقت وليست معركة حربية او احتلال اراضى"
archived = "2009-11-27"
capture_url = "https://web.archive.org/web/20091127092751/http://www.20at.com:80/masr/hot-topics/14152-2009-11-24-10-31-37.html"

