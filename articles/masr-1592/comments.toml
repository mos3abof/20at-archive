[[comments]]
order = 0
subject = "اعلام الكدابين"
author = "شاهت الوجوة"
posted = "2007-02-14"
text = "شكلة يقطع الخميرة من البيت<br />الاعلام الرسمى من يتفرج علية<br />الاوباش ومراكز التخلف العقلى وبتوع الحزب الوطنى وانصار الفساد<br />اتفرج على الشارع لما يكون احدهم بيخطب ولا واحد بيعبرة لانة هيقول اية جديد<br />الميت ريحتة طلعت وعايز الدفن<br />واكرام الميت دفنة<br />بس محدش يمشى فى الجنازة<br />وانا للة وانا الية راجعون"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218080649/http://masr.20at.com:80/article.php?sid=1592"

[[comments]]
order = 1
subject = "ياعزيزى كلنا ممثلون"
author = "احمدابوصالح_صحفى معارض"
posted = "2007-02-15"
text = "للاسف التمثيل هى المهنة الاساسية فى هذة البلد سواء ممثلين مجلس الشعب او السادة الوزراء او الحزب الوطنى وظباط الشرطة وللاسف كمان الشعب بشارك فى التمثيل بس دورة كومبارس لتكملت الديكور الناقص مهو مينفعش الحبكة الدرامية تتعمل بدون كمبارس(الشعب)فانا لا استغرب اطلاقا من مايحدث فى الاعلام والصحفاة كلة بيمثل على كلة ... وشكراا"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218080649/http://masr.20at.com:80/article.php?sid=1592"

[[comments]]
order = 2
subject = "هوه فيه ايه"
author = "هيه بأت زريبه"
posted = "2007-02-15"
text = "لم نفسم يا بن الخول يا عرس ....<br />ايه الهبل اللى بيحصل داه لما ييجى واحد ويملى مكان التعليقات بالهبل داه<br />هوه فين اصحاب الموقع داه<br />اصحوا انتوا نايمين تحت التراب"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218080649/http://masr.20at.com:80/article.php?sid=1592"
