[[comments]]
order = 4
subject = ""
author = "اللعيبة والممثلين"
posted = "2010-02-02"
text = "لعيبه وممثلين والشعب الاهبل عمال يسقف وهما يحصدوا الملايين<br />الممثل بيمثل الفيلم بخمسة مليون واللعيبة بتكسب في الماتش مليون<br />والشعب عمال يدفع تذاكر السينمات والماتشات وهو مش لاقي ياكل ولا لاقي يتعالج<br />يا جماعة مصر ما فيهاش علاج يا جماعة<br />اللي بيعيا يتعالج اذا كان معاه فلوس معهوش فلوس حيموت يا جماعة<br />ما تشجعوش الكوره وما تدخلوش افلام سينما يا جماعة<br />بفلوس التذاكر بتاعة السينما والكوره اعملوا بيها صناديق علاج للفقراء<br />احسن ما شوية الصيع اللي في الصورة دول يكونوا منها ملايين ويسكنوا في الزمالك ويركبوا زلمكات<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205154222/http://www.20at.com:80/masr/hot-topics/15163-2010-02-01-21-33-00.html"

