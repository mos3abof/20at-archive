[[comments]]
order = 2
subject = ""
author = "افندينا ولى النعم"
posted = "2010-02-01"
text = "طيب ما هو لازم يبوس ايد مولانا ولى النعم<br />يمكن ينعم علية بفيلا فى مدينة الشيخ زايد او فى القاهرة الجديدة<br />او يعطية صرة او كيس من الذهب<br />ويمكن تعليمات الامن اللى كان واقف على الباب وبيفتشهم ويدخلهم واحد واحد ان يبوس القدم ويبدى الندم على غلطتة فى حق الغنم<br />على العموم الرئيس فى سن جدة<br />بس مرة انا شفت واحد باس ايد شيخ من شيوخ بترول الخليج - الشيوخ الكبار قوى<br />فالحاكم ارتبك لما شاف الراجل باس ايدة وعلى الفور جذب ايد الراجل وقبلها هو الاخر ثم طبطب علية وباسة من كتفة ايضا<br />انما هنقول اية"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205154222/http://www.20at.com:80/masr/hot-topics/15163-2010-02-01-21-33-00.html"

