text = "يتم انهاء الاحتلال<br />اسقاط الاسره المالكه<br />عودة دستور يحترم ارده الجماهير<br />مطالب المصرين الان<br />انهاء احتلال الداخليه للشوارع<br />اسقاط الاسرة الحاكمه<br />دسترو محترم ينفذ"
