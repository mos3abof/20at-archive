[[comments]]
order = 0
subject = "الله يخليكم يارب"
author = "شيلوا اللينكات إللى فوق"
posted = "2007-02-18"
text = "أولاً لابد من إنهاء مبنى جيل المستقبل التابع لجمال مبارك من جامعة القاهر فهل باقى الأحزاب ليهم مبانى بالجامعات<br />ثانياً لابد من الصمود على المبدأ وهو أول درجات النجاح<br />ثالثاً لابد أن يكون لكم إتصال بكل المعارضة حتى لا تصبحوا مهمشين"
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222083206/http://masr.20at.com:80/article.php?sid=1607"

[[comments]]
order = 1
subject = "شكرا وربنا يوفقكم"
author = "إبن بهيه"
posted = "2007-02-19"
text = "والله كلنا نشد على أياديكم<br />شكرا يا شباب .. يا أحرار<br />ربنا يوفقكم سواء كنتم إخوان أو ناصريين أو اشتراكيين أو مسيحيين .. المهم من ولاد بهيه الأحرار ومش مركبين القرون بتاعة لجنة وكوسات المحروس الموكوس إبن الموكوس الواطي الثاني<br />شكرا وربنا يوفقكم<br />بجد فكرة الاتحاد الحر دي فكرة أروع من الوصف .. تمسكوا بها .. ربنا يوفقكم<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222083206/http://masr.20at.com:80/article.php?sid=1607"

[[comments]]
order = 2
subject = "حلوه بس الحلو مايكملش!!!"
author = "ابن ناصر"
posted = "2007-02-19"
text = "هي الفكره حلوه وكل حاجه -فكرة الاتحاد الحر- بس ان عن نفسي في الجامعه عندنا قالوا هنعمل انتخابات اتحاد حر قولنا جميا وروحت اشتركتت وصوت والجامعه كلها راحت وصناديق شفافه وديموقراطيه وشفافيه وكله !! ومره واحده لقينا أمن الكليه جه وعينك لا تشووف الا النور ضربوا الاتحاد كله وكسروا كل حاجه ناس ضد الحريه بقي نعمل ايه!!!"
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222083206/http://masr.20at.com:80/article.php?sid=1607"

[[comments]]
order = 3
subject = "لا لمبنى جيل المستقبل"
author = "لا لمبنى جيل المستقبل الخاص بجمال مبارك والذى يريد أن يؤثر به على فكر الشباب وتسلطه على آرائهم"
posted = "2007-02-20"
text = "جميع المعارضة ليست لهم مبانى داخل الجامعة فلابد من إزاله هذا المبنى فوراُ لإنه يعتبر مركز قوى وفرض رأى على الطلبة<br />لا للتوريث لا لجمال مبارك نهائى وبإصرار"
archived = "2007-02-22"
capture_url = "https://web.archive.org/web/20070222083206/http://masr.20at.com:80/article.php?sid=1607"

