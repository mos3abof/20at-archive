text = "السلام عليكم<br />ياجماعة الانتحار مش حل لاى مشكلة مهما كانت فكروا فى الحل وفكروا فى الحلو الى فى حياتكم كل انسان عندة حاجات كتير حلوة بس ممكن يكون مش شايفها وماستعجلوش لان سن الصغير 16 18 20 سنه التفكير بيختلف عن ما الواحد بيكبر شوية فهيلقى ان الحياة احسن بعد الكتير من التجارب الغلط الى حصلت فى سنة الصغير وانه اتعلم منها وانا عن نفسى عملت محاولة انتحار فى سنى الصغير كنت بحاول اطلع شحنة غضب فيها يمكن الاقى الى انا عايزة بس عرفت انى انا الى بغير الحياة حواليا مش الناس واللى حسيتة اكتر ان الموت مش سهل بعد موت حد عزيز على اوى وان الحياة بعدة صعبة فانا اكيد ان كنت انتحرت كنت هسبب الم وحزن شديد لاهلى امى واخواتى ووالدى وهكون كدة ماوصلتش للى انا عايزة يعنى ولا عشت مبسوطة ولا سيبت الى عرفونى يعيشوا حياتهم مبسوطينز"
