[[comments]]
order = 67
subject = ""
author = "مسافر حبيبى **"
posted = "2010-01-26"
text = "الحب فى قلبى ماهو بايـــدى * مشى على دربى وأعمل له ايه ياسيدى * شرد الحبيب شرقى وغـــربى*بنظرة عنيه آه يا وليـدى*أنا قلت أسافر بــلاد*يمكن يكون دواه البعــاد*ويشتاق لهـوى الـوداد*وينول قلبى نظرة مــراد*رجعت لقيته لقلبى هـجــر*وأبقى معاه ألاقيه منى شطر*لسعة نار فى فى عز المطـر*ومين يطفى لهيب القمـر*وشوق حرقنى وأنا معاه تحت الشجر*آه وآه على قلبى اللى انفطــر*ينسمات الهوى دليـنى*ايه اللى غير أحـواله*وينجوم السما ضميـنى*واحكى لى عاللى جـراله*منين أعرف ومنين أرتـاح*بعد هواه مساب فى قلبى جـراح*قلبه تاه منى وراح بعيد عنى*ومين عليه يطمنى بعد هواه مشغلنى"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127082027/http://www.20at.com:80/20at/ana-saudi/8235.html"

[[comments]]
