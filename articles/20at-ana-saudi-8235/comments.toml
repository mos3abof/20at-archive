author = "ياسر 0162747437"
posted = "2009-03-12"
text = "حبيبة قلبى التى لم تراها عينى لو كان صوتى حفيف الشجر لم يكفى اشتياقى اليكى لان صوتك تغريد البلابل ودليل على انوستك الطاغيه فتعالى تلامس يداى يديك او حتى اقبل شفتيك وانقب عن الورد وارتشف رحيق من فوق نهديكى واقتحم الجسور التى بين فخزيكىانا بحب الدوره الدمويه وبحب الهوا والنبض وبحب المداعبه الجنسيه والمممارسه وبحب المداعبه بين الفخزين وبحب المداعبه اعل الفخزين والمداعبه فى جسم المراه كل مكن فى جسمه وبحب ارضع فى الحلمه وبحب تقعدى عليه وتقومى وتقعدى برحت رحتك وبحب ادخل فخزى فى فخزك حت اليل الدامس وبحب المصمص وبحب ابوس بين الفخزين وبحب اعيش فى جسم المراه واعشقه واهزر معه وبحب القمصن القصير وبحب البس البكنى واحب اعيش حيتى مع وحده احبه من كل قلبى قبل كل شيئ حتى احفظ عليه لوحدى وبحب اعيش حيتى معه نيك فى نيك وبحب رفع رجله على كتفى وادخل فيه بكل حنين ورق اه واه بحب دخلت جدا ومن تعيش معيه وبحب المداعبه الجنسيه والممارسه قبل النيك وعايز تدخلنى بين فرجه ابوس فيه والحس فيه بحب مكان الفرج جدا 0162747437<br />sg_2700000@yaho o.com"
archived = "2009-04-30"
capture_url = "https://web.archive.org/web/20090430062344/http://www.20at.com:80/ana-s3ody/8235.html"

[[comments]]
order = 3
subject = ""
author = "عبدالله محمد أبوصالح"
posted = "2009-07-01"
text = "برأيي الخاص أعتقد أن سكن الطالبات أصبح أكثر من مجرد سكن، فهناك العديد من حالات الشذوذ الجنسي بين الطالبات بعضهن البعض ولذلك أنصح أخواتي في الله أن لا يغريهن الشيطان بالعيش في مثل هذه الأماكن من أجل إيجاد المتنفس بعيداً عن الأهل ومن كانت مضطرة لذلك فبإمكانها تجميع عدد من صديقاتها الصالحات واستئجار شقة قريبة من الجامعة خير لها من أن تعيش في مكان مشبوه فتجلب لها ولأهلها كلام الناس. وجزاكم الله خيراً، أخوكم في الله عبدالله \"طالب جامعي\"<br />وعذراً إذا كلامي أزعج أي شخص.<br />لمن يرغب في المناقشة هذا بريدي الإلكتروني: sniperabood@hot mail.com"
archived = "2009-07-30"
capture_url = "https://web.archive.org/web/20090730234958/http://www.20at.com:80/20at/ana-s3ody/8235.html"

[[comments]]
order = 4
subject = ""
author = "krebi krush"
posted = "2009-07-17"
text = "انا في رايي انه البنت النضيفه ما تتاثر بهذي الامور<br />وانه اهلها اذا كانوا مو واثقين فيها ما راح يخلونها تروح<br />وهذا المفروض<br />وانه الناس في هذا الوقت مستخفين واايد وزياده عن اللزوم والله العظيم لو انهم يشوفون عدل الي قاعدين ايسونه ما صار الي صار والمشكله انهم مو معترفين بالغلط الي اهم فيه يعني شنو بنت تصير ولد وولد يصير بنت والوالد مايدري عن عياله ما كان المفروض ايبهم اصلن لما شاف انه ما يقدر يتحمل المسؤوليه ولو كان الاهل علي الاقل يلتفتون علي اولادهم ويعطونهم الحريه المحدوده الي تشبع نفسيتهم وترضيها ما كان الواحد فيهم يفكر فيه انه ينحرف ويترك المكان الي فيه لاقي الي يبيه وتري الموضزع واايد يلوع الجبد صج اتحس في انحراف عقلاني عند الناس الي في امثالهم وانا وحده ما راح اتاسف لاحد علي الي قلته لاني ما غلطت عليكم الناس هذي اهي الي غلطت علي نفسها ويابت الحكي حق نفسها ."
archived = "2009-07-30"
capture_url = "https://web.archive.org/web/20090730234958/http://www.20at.com:80/20at/ana-s3ody/8235.html"

