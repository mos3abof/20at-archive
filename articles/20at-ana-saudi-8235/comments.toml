posted = "2009-02-22"
text = "السلام عليكم والرحمه<br />بصراحه انا اعيش حاليا ف سكن طالبات في دولة الامارات.. وفييه تجاوزااات كبيييره جدا من البنات يعني بصرااحه قبل كذا سنه كان الخراب بسيط بس الحيين الشي في تزاايد مستمر والمفروووض توجد قوانين صارمه تحد من هالانتشار.<br />مثال قبل كذا سنه كان استايل البنت سبوووورت فتلبس اثياب الشباب وتقصر شعرها على انها استااااايل فقط لكن الحيين تغيرت التصرفااات والاخلاقيااات ايضاااا يعني صارت بوووي. بصراااحه انا كثير اخاف من قصة قوم لووط نسأل الله السلامه."
archived = "2009-04-30"
capture_url = "https://web.archive.org/web/20090430062344/http://www.20at.com:80/ana-s3ody/8235.html"

[[comments]]
