[[comments]]
order = 37
subject = ""
author = "احمد سعاده"
posted = "2009-12-30"
text = "وهاي ولاء منصور تافه وضايعه ونفسيتها مريضه<br />اللهم اعز الاسلام والمسلمين<br />والله يريحنا من اهل الفتن<br />وبنسبه لسالي الي بتحكي لو انا شب ما بظيعك من ايدي بحكيلك عيب هاد الحكي من بين قاعده بتدعي وبتحكي عن العيب وقاعده بتحكيلنا عن امثال ابوها الرائعه والمؤثره<br />بحكيلها انو انا شب لو تسحلي بضيعها من بين ادي لانو مش هلئشي الغالي الي راح اظيعو بلعكس اشي اكتير ارخص وتافه وما بنحكا فيه اصلا لانو الي بخاف من ربو بصرخص هيك اشي<br />اما انتي ياسالي فنصيحتي الك روح دوني امثال ابوكي ومجعيهم في كتاب وحتفضي فيهم اللك<br />لا الله الا الله محمد رسول الله<br />اشهد ان لا الله الا الله وحده لا شريك له<br />رضية بالله ربا وبل السلام دينا وبحمد عليه الصلاة والسلام نبيا"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106141821/http://www.20at.com:80/20at/ana-saudi/8235.html"

[[comments]]
order = 38
subject = ""
author = "احمد سعاده"
posted = "2009-12-30"
text = ": بسم الله الرحمان الرحيم<br />اول اشي الفتنه اشد من القتل وهاد الحكي كله فتنه بنسبه لاقمار الصناعيه والنت وغيرو<br />هاي موجوده في كل بيت احنا الي مستخدمها بنقدر نستخدمها بشكل صح او بشكل غلط<br />والي بدو اشي بلاقي اما الي نفسيتو مريضه زي ولاء منصور ولا علي وغيرو من الناس المرضى بحكيلهم اتقو الله فحالكو بكره راح تقابل ربنا وقتها شو بدكو تحكولو هاي الحكي كله هو الي وصلنا احنا العرب لهدا الحكي المواضيع التافه الي بتنطرح قاعده هاي اما بنسبه لشباب كلكم عنكو خوات وما ظنيت واحد برض لاختو هاد الحكي والبنات اتقو الله فحالكو وفي الشباب لا نو في نسبه كبيره منكم بتعمل فتنه واكثر اهل النار من النساء فتقو الله فحالكو وفاهلكو ونتو مش بحاجه لهلموضيع التافه اصلا تحكو فيها وفي النهاية لو في ذرة خوف من ربنا الكريم ما حدا بقرب لهحكي كله الي بخرب دماغ الشباب والحكي الفاضي الي بضيع وقتهم والله اعلم لو وين بوديهم وبحكي للبنات ايحافظو على حالهم لانو هاض اغلى اشي بمتلكو الي هو سمعتهم وشرفم والشب بعد ما يوخد من البت الي بدو اليه او يزهق منها بزتها وما بسال عنها والسلام عليكم ورحمة الله وبركاته<br />الله يشفيكي يا ولاء"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106141821/http://www.20at.com:80/20at/ana-saudi/8235.html"

[[comments]]
order = 39
subject = ""
author = "وردة حبنا"
posted = "2010-01-02"
text = "بالرغم ان مشاكل السكن كثيرررره بس مع ذلك ما شفت الشذوذ الي تتكلمون عنه!!<br />واحتمال لان كان كل اهتمامي بدراستي ما انتبهت للشي هذا .. بس كل شي معقول بهالزمن<br />بس مع كل هالمشاكل واحتمال ان فيه مشاكل اكثر من الي قلتها بس مع ذلك السكن له ايجابياته وايجابياته اكثر بكثييييييييييير من مساوءه<br />لان كل هالمشاكل الي ذكرتها والي غيري ذكرها كلها اختياريه .. يعني البنت عندها امكانيه تختار انها تعيش هذي المشكله او انها تكون بعيده عنها .. محد يضربها على ايدها ويجبرها انها تسوي شي اهي مو راضيه عنه!<br />ايجابيات السكن ان البنت تكون بين بنات في مبنى مخصص للبنات مو اي شخص يقدر يدخله عندها غرفتها او شقتها الخاصه فيها وتنام بأمان بدون خوف.. عندها جو دراسي جدا هادي مع طالبات وجودها في هالاجواء يشجعها عالدراسه وتقدر تستفيد من خبرات البنات الدراسيه الي اكبر منها او تتبادل المعلومات مع بنات تخصصها<br />اخونا في الله الي يقول ان البنت اشرف لها تسكن في شقه مع مجموعة بنات صالحات.. اسألك انت اذا سمعت ان فيه شقة بنات شابات في بنايه شنو هي الفكره الي بتاخذها عنهم؟؟ وكيف تعرف البنت الصالحه عشان تروح تسكنها في شقه مع اختك؟؟"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106141821/http://www.20at.com:80/20at/ana-saudi/8235.html"

[[comments]]
order = 40
subject = ""
author = "وردة حبنا"
posted = "2010-01-02"
text = "والي بنظري اهي ام المشاكل هم المشرفاااااات<br />الله يخسهم على قد ما غيرت السكن الا ان ما مرت علي مشرفه شريفه استغفر الله المشرفات اهما سبب ضياع البنات .. اذا كانت المشرفه شابه صغيره بعد هذي مشكله بحد ذاتها .. بس المصيبه لما تكون المشرفه عجوزه شمطاء و تنحط بين مية بنت وتصير مراهقه في الخمسين ههههههههههههههه ه<br />لما المشرفه تواعد شاب عند السكن او تدخله لمكتبها وكل يوم على نفس الحاله.. طبعا المشرفه هذي مثال سيء للبنات وما تكون لها هيبه بين البنات بالعكس يستحقرونها حتى الحقيره فيهم تستحقرها بس مع ذلك يحاولون يتصادقون معاها و يغرونها بالهدايا لدرجه انها تعطيهم نسخه من مفتاح السكن!! يعني البنت تطلع في اي وقت و ترجع في اي وقت واحتمال كبير ان صاحبها يكون عنده نسخه من المفتاح .. يعني ميانه!<br />او ان البنات اذا مو حابين صداقة المشرفه هذي يسوون الي يعجبهم واذا حاولت تتكلم قامو يهددونها انهم بيشتكون عليها عند صاحب السكن وطبعا بالتهديد المشرفه ترضخ لهم!!<br />وما ادري ليش البنت تجي السكن في اول يوم مع اهلها بالعبايه والحجاب ويمكن متنقبه وصايره نينجا .. وفي اول يوم دراسه تروح الجامعه بلبس يشبه بدلات الرقص!!"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106141821/http://www.20at.com:80/20at/ana-saudi/8235.html"

[[comments]]
order = 41
subject = ""
author = "وردة حبنا"
posted = "2010-01-02"
text = "احلى مراحل حياتي كانت المرحله الجامعيه وبنفس الوقت كانت اصعب المراحل بسبب لجوئي لسكن البنات احم احم :) لا وبعد دراستي كانت في دوله ثانيه يعني اهلي ما اشوفهم الا بالسنه مرتين تهئ تهئ :(<br />المشكله الاولى بنات السكن اغلبهم كانت لهم علاقات عاطفيه وغير عاطفيه اقصد العلاقات الي تكون بدون هدف لان البنات يعايرون بعض ان فلانه ماعندها حبيب و يحسسونها انها معقده فتروح البنت تكلم اي واحد وتألف قصص عشان تكون كبيره في عين البنات وما تفقد صداقتهم!! بس مع ذلك البنت مو مجبوره انها تسمع كلامهم ولو انها تكون معرضه لضغوطات نفسيه بسببهم<br />على فكره جامعتي كانت مختلطه .. بس الحمدلله السكن مو مختلط ههههههههههههه<br />شي طبيعي جدا ان البنت تكلم زملاءها الشباب الي في نفس تخصصها او دفعتها او حتى الي جايين من نفس بلدها .. او عالاقل هذا الشي طبيعي بالنسبه لي انا<br />المهم ان بنات السكن اذا شافو البنت الفلانيه تكلم واحد وبعد شوي يشوفونها تكلم واحد ثاني خلاص قامو يطلعون عليها كلام وانها مسويه فيها شريفة روما وانها ميه من تحت تبن هههههههههههه المصيبه ان نفس النوعيه من البنات التافهات اهما الي يطلعون الكلام على البنت!!"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106141821/http://www.20at.com:80/20at/ana-saudi/8235.html"

[[comments]]
order = 42
subject = ""
author = "وردة حبنا"
posted = "2010-01-02"
text = "احلى شي في الموضوع هي امثال ابو سالي ههههههههههههه الله يحفظه<br />العلم في الصغر كالنقش على الحجر .. الشي الي تعلمناه في بيت اهلنا من واحنا صغار هو المفروض يكون شي ثابت وما يتغير فينا كليا واذا تغير يكون التغير بجزء بسييييط لا اكثر ودايما تبقى اخلاقياتنا متأصله فينا<br />بشكل عام كلنا بنات ناس والحمدلله بس لكل عايله اسلوب غير في التربيه .. واخلاقيات البنت في بيتها هي نفسها اخلاقيات برا البيت .. ما تختلف<br />اللهم الفرق الوحيد هو ان البنت الغير مؤدبه في بيتها مستوره في بيتها و فضيحتها محد يعرف عنها شي واذا اهلها عرفوا مساوؤها ستروا عليها .. بس لما تطلع البنت بين الناس تصير فضيحتها بجلاجلوالبنت المؤدبه في بيتها يحترمونها اهلها في بيتها .. ويحترمونها الناس في خارج بيتها<br />لان \"كل اناء بما فيه ينضح\"<br />احلى مراحل حياتي كانت المرحله الجامعيه"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106141821/http://www.20at.com:80/20at/ana-saudi/8235.html"

