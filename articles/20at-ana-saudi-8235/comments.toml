[[comments]]
order = 19
subject = ""
author = "ابوحواء السوري"
posted = "2009-11-25"
text = "والله السكن الجامعي يجمع فتيات كثيرات فيهن المنحرفة والشاذة وفيهن الشريفة ولكنني اقول90%يكونن عاهرات يجرن صديقاتهن الواحده تلو الاخرة وخصوصا انه في الخليج والسعودية حصرا يوجد كبت لدى الفتيات نتيجة حبسها في في بيت اهلها وعندها الفتاه تحلم انها ترى الشب او فارس احلامها الموعود ..<br />وعندما تتهيء للفتاة الفرصة وتسافر خارج مدينتها وتتعرف على بنات منحرفات وعاهرت في السكن الجامعي رح يحرفنها لو انها شو ما كانت تكون ملتزمة اوغير ملتزمها وهذا كله نتيجه حبس الفتيات في منازل اهلهن بالخليج وخصوصا السعودية حيث ان ابن العم اذا راىء بنت عمه وهي طالبة جامعية خارج مدينته وتكون مع شلة منحرفات وتكون في شقة احد السباب يمارس الزنا معها لانه بالاصل لايعرفها ولم يرىء وجها ابدا<br />والحل العلمانية افظل شي مع احترامي للدين الاسلامي الفظيل"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203031057/http://www.20at.com:80/20at/ana-saudi/8235.html"

