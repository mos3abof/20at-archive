subject = ""
author = "ولاء منصور"
posted = "2009-10-27"
text = "انا هتكلم بصراحة.. انا بنت متربية كويس جدا ومنذ عام دخلت الجامعة بالرياض ودخلت بيت الطالبات او سكن الطالبات وتعرفت على بنتين من حائل واصبحنا ثلاثة صديقات وفى احد الليالى وجدت احداهن فى غرفة النوم عارية تماما والأخرى تقوم بالمسحح علىاردافها بشيى لم اعرفه من قبل وعندما استيقظت اخذو فى الهرولة بالحجرة وعندما سالتهم قالوا فى احراج شديد نحن ضحية الستالايت والقمر الأوروبى نشاهد هذا واتفقنا على عمل مثله وبدا الضحك وراح الكسوف واخذا احداهن بالرقص وعندما سالتها عما بيدها قالت لى هو عضو زكرى صناعى واخذته وانا متعجبة من شكله وقالوا لى شاهدى ما على الموبايل من صور ومقاقع جنسية وضرب عندها الدم فى راسى وذهلت مما شاهدته حيث انها المرة الأولى لى وعاتبتهم على ذلك ولكن ثان يوم وهم بالجامعة اخذت العضو البشرى وحاولت اللعب به عند اردافى وحول عضوى الأنثوى وكرهت ذلك جدا فعلا البنات بتضر بعضها بعضا ولا حول ولا قوة الا بالله"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145134/http://www.20at.com:80/20at/ana-saudi/8235.html"

