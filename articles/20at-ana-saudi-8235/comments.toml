author = "استغفر الله"
posted = "2010-01-25"
text = "أنا مع الاخ نضال لان الطالبة في بعض الاحيان تحتاج الى السكن وتكون مضطرة لذلك لو كان في مراقبة اكثر واهتمام اكثر لتقلصت هذه المشاكل واتمنى ان تزاح هذه النظرة البشعة عن السكنات لانه ليس كل الطالبات من نفس الصنف ونفس الاخلاق والادب ويجب وضع شروط لدخول السكن وشروط وضوابط داخل السكن لمنع مثل هذه اللااخلاقيات ."
archived = "2010-01-27"
