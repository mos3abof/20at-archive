text = "مرحباانا حابب احكي شوي عن الفسادالفساد صار موجود وين ما كان موبس في سكن الطالبات ثلاث ارباع مجتمعنا فساد المشكلة مو بالسكن المشكلة بالبنت نفسها ازا بدها تفسد بتفسد حتى لو بين اربع حيطان والفساد موجود في المدارس في العمل في الجامعاتات اصلا نحنا الان عايشين في عصر الانفتاح يلي بدأ من لما دخل الستلايت على بيوتناقنوات فضائية اغاني فنانات رقص وصارت بعض البنات يقلدو الفنانات في اللباس ولا الموبايل يلي صار وسيلة سريعة للحكي وطق الحنك وللمقابلات والموعيد السرية ومقاطع البلوتوث الفاضحة اما النت فهو اكبر فتنة موجودة في كل بيت ومن غير رقابت الاهل ادخلو على الدردشة وعالشاة وشوفو بعينكون بنات 14سنة وين اهليون يا حرام لا وعندون ايميلات كمان يعني مع مين بتحكي بالايميل الله اعلم هاد هو عصر الانفتاح والله يسترنا من الايام الجايةا<br />الفساد صار شيئ من الفلكلور اليومي ومالو دواء"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127082027/http://www.20at.com:80/20at/ana-saudi/8235.html"

