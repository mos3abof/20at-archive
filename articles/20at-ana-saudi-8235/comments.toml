posted = "2010-02-04"
text = "والله السكن كلو غلط بغلط لانو البنت العاطله بتجر الكويسه وللاسف البنت الكويسه ما بتجر العاطله وبكون المجال قدامهم مفتوح لا حسيب ولا رقيب وكانو بسجن وطلعو منو فالي بدها تخصص ثاني مش موجود بالمنطقه القريبه ماتدرس احسن لانو بغلط بسيط ممكن تضوع مستقبلها وتروح عليها وانشاء الله بتمنى الخير لكل البنات"
