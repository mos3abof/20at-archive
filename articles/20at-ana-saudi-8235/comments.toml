[[comments]]
order = 7
subject = ""
author = "زينب"
posted = "2009-08-05"
text = "من خبرتى فى السكن الجامعى ان الانثى تفسد الانثى كما تبث الافعى السم فى الافعى ففى السكن تنتشر ظواهر الاعجاب وقد يصل الامر للسحاق اللهم احفظنا اما خارج السكن حيث كل شى مباح حيث تعرف الفتيات الشباب بعيدا عن عين الاهل وقد جعلوا الله اهون الناظرين اليهم لذلك انصح من دفعتها ظروفها للسكن الجامعى تقصى الصحبة الصالحة وكما يقولون الوحدة خيرا من جليس السوء انصحك يا اختاة بمراقبة الله والانتباة لدروسك واخفظى نفسك واهلك فهم لا يستحقون منك الا الخير فكم من شريفة ضيعت نفسها وكم من متفوقة اصابها الفشل اطلبى عون الله فهو القادر على حمايتك واتخذى حب الله سفينه نجاتك عسى يرحمنااللة واياكى والسلام عليكم ورحمة الله وبركاتة"
archived = "2009-08-22"
capture_url = "https://web.archive.org/web/20090822223914/http://www.20at.com:80/20at/ana-s3ody/8235.html"

[[comments]]
order = 8
subject = ""
author = "N"
posted = "2009-10-04"
text = "بصراحه مفروض يحطون التخصصات كلها بكل منطقه ووين عايشين حاطين سكن طالبات واللي يقول مافيه خراب هذا كذاب ويبي يسلك الوضع وبعدين صار الشذوذ مو ظاهره وبس الـا صار بأغلب البنات وبالمدرسه اللي دوامها 6 ساعات يصير فيها بلاوي غير طبيعيه وشلون سكن صراحه مفروض ينلغي هالسكن والله يستر وبعدين المضاهر هي اللي خربت البنات والاعجاب اللي هو الحب بين الطالبات واغلبهم ينهدم مستقبلهم ولحد يزعل من كلامي لان اللي بيفكر بهالكلام ويعيش بمجتمع البنات بيشوف العجايب اللي ماصارت واللحمدلله اني حميت نفسي والله ينجي بنات العالم كله"
archived = "2009-11-08"
capture_url = "https://web.archive.org/web/20091108145134/http://www.20at.com:80/20at/ana-saudi/8235.html"

[[comments]]
