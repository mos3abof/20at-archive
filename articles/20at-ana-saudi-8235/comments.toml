[[comments]]
order = 60
subject = ""
author = "مسافر حبيبى **"
posted = "2010-01-24"
text = "وعن طفله الذى بداخله أعرضتى**وعن أنياب الفراق كشرتى**وعن حب النفس ضربتى0أروع الأمثلة فنجحتى*وغدوتى قدوة تحتذى*فى الأوهام والحب المستحيل*والقدر ة الفائقة فى عشق الفتى الجميل* والهجر منكى ليس به عليل*واهانتك ليس فيها مساس بأحساس الحبيب وليس لها دليل*فهنيئا لكى بالوسام*الذى خلعه عليكى اللئام*وهنيئا لكى بالأكاذيب*التى خالت عليكى بالألاعيب*وهنيئ ا لكى بالسعادة*الملوث ة بدماء قلبى*وهنيئا لكى بالنشوة*المدنسة بقتل حبى*وهنيئا لكى بالفرحة المسلوبة منى*وهنيئا لكى بالحياة على أشلاء عذابى*فجسدى النظيف لن تلمسه يديكى*وقلبى الجريح*لن يفو لقلبكى*وعينى الدامعه *لن تدمع لعينيكى*فهامتك الشامخة سقطت لقدميكى*وهالتكى المضيئـة قد خبت أمام عينيكى*والهرم الكبير تهشم حواليى*والصرح العظيم انقض على رأسيكى*والقلب الصامد لن يتزحزح *ولو جثوت على ركبتيكى**"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127082027/http://www.20at.com:80/20at/ana-saudi/8235.html"

[[comments]]
order = 61
subject = ""
author = "مسافر حبيبى **"
posted = "2010-01-24"
text = "ارفعى الأوسمة*فلقد نفضت غبار الحزن عنى*وغسلت بماء الغدر جرحى*ومحوت بنار الألم همى* ومسحت بيدى الجريحة دمعى* وخلعت ثياب العشق منى***فليس غريبا عليكى*ماقترفتيه بيديكى*فهو محفور على كفيكى**ومرسوم على وجنتيكى**يكاد يملأ شدقيكى*وتنطق به عينيكى**وتهتف به شفتيكى**أيكفيكى فخرا أنكى انتصرتى **وزهوا أنكى أنكى لقلبى حطمتى**وعشت وتعايشت*وبالغدر هجرتى**وبقلبى الصغير تلاعبتى**ولحبيب مخلص اليكى **وبسهام عينيكى اليه صوبتى**وبخنجرك المسموم قد أصبتى"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127082027/http://www.20at.com:80/20at/ana-saudi/8235.html"

[[comments]]
order = 62
subject = ""
author = "مسافر حبيبى **"
posted = "2010-01-24"
text = "ياحبيبى هات أياديك*فان لم تأتى فاسمح لى أن آتيك*ودعنى أصعد الى روابيك*فقلبى ضعيف فهات أياديك*لكى تسعد يداى وتهنأ بين أياديك*وتطير الفرحة من تلاقيك*أحتار ياحبيبى ماذا أسميك*وأخاف من الأيام تدمينى وتدميك*ياحبيبى* أريد أن أحيا فى واديك*بين أحضانك*وفى حنانك*وتغلق أهدابك*لأنام فى نآقيك*وكيف تغيب عنى*وأنا بالشوق أناديك**لاتأتى* فكيف تأتى**وأنت هنا فى قلبى*تحيا فى أراضيك"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127082027/http://www.20at.com:80/20at/ana-saudi/8235.html"

[[comments]]
order = 63
subject = ""
author = "مسافر حبيبى **"
posted = "2010-01-24"
text = "أتسمحين ياحبيبتى أن أستظل بحبك*أترضى ياأميرتنى أن أتنفس شذاكى**أن أهتدى بضياكى*أتقبلين يامليكتى أن أكون من رعاياكى**أن أكون نجمة تتلألأ فى سماكى**أن أكون وردة تلثمها شفتاكى**أن أكون كلمة تنطق بها عيناكى**أن أكون نسمة تهب على وجنتيكى**أن أطبع قبلةعلى يديكى**ياحبيبتى *أنا هنا وأنتى هناك*أشتاق اليكى*فماأشقاتى وماأشقاكى*وبالأ قدار ماأدرانى وماأدراكى*فربما تجمعنا الأيام**وربما يوما ألقاكى***"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127082027/http://www.20at.com:80/20at/ana-saudi/8235.html"

[[comments]]
order = 64
subject = ""
author = "مسافر حبيبى **"
posted = "2010-01-24"
text = "اشتقت اليك ياأجمل حلم فى الأحلام*فقد طال غيابك ولم يتبقى لى سوى الأحلام*أريد أن أرى عينيك حتى أشفى من الأسقام*أريدك حتى يكون يومى من أجمل الأيام*فان لم تأتى فأنت فى أفكارى*فأتحدث اليك*وأنا أقرأ أشعارى*فأنت أصل البسمة وسعادتى بك كوصول الأمطارى*ولولاك لجف الحب فى الحقل*وماتت أزهارى*وكل شيئ موجود*الأدب والحب والكره والفساد*وال خير والشر*ولكن؟؟ هل بداخلنا الخير موجود ونحترم آراء الآخرين*هل الايمان بداخلنا حقا"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127082027/http://www.20at.com:80/20at/ana-saudi/8235.html"

[[comments]]
