text = "الحقيقة انا مش عارفة ايه الكلام اللى ممكن ارد بيه على الموضوع ده لكن زى ما قالت سالي وغيرها ان مفيش بنت بتعمل حاجة هى مش عايزاها حتى انتى عملتى زى البنات اللى حكيتي عنهم وكان بعد يوم كامل يعنى اكيد فكرتى كتير قبل ما تعملى كدة وعلى العموم انا بطلب منك انك ما تكتبيش تانى على مواضيع بالشكل ده والاحسن انك ما تكتبيش خالص لان يظهر انك مشغولة كتير بالمواضيع دى وبالله عليكى اذا ما كان عندك كلام ينفعنا يبقي بلاش تكتبى عشان الاخلاق مش ناقصة اللى يفسدها"
