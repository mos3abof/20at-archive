posted = "2009-12-02"
text = "عنجد متل ما قال قيس الي بدها تفلت بتفلت لونها بين اربع حيطان<br />بعدين انتي يا ولاء مو حاسيتك عم تحكي بصراحه او عم تحكي عن الواقع اني عم تحكي عدم المؤاخذه بوقاحه<br />وعم تحكي شغلات انتي بدك الي<br />اياها ورجاءا ما تعملي حالك ما بتعرفي اشي والبنات حرفوكي لانك انتي بتعرفي كل اشي وعاجبك الي بصير وغير هيك يعني قاعده بتحكي هل حكي كله وانتي عارفه انو كتير شباب رح يشوفوه وبترجعي بتحكيلهم ما تراسلوني لانو انتو هيك بدكم تعملو معي<br />طيب ليش تشرحي عن حالك مدام ما بدك اياهم هيك يحكوا والله لوني شب وشفت بنت هيك بدها ما بضيعها<br />فعلا الله يعينهم وليش تحكي هيك بعدين هما ما حكوا انهم هيك بدهم هما قالوا انهم بدهم يراسلوكي بس انتي الي حكيتي هيك بدهم وهاد دليل على شو على انو انتي الي بدك هيك مو هما يعني عنجد انك سخيفه وفعلا متل ما بحكي ابوي اذا الكلبه ما هزت ديلها الكلب ما بلحقها<br />عنجد بنات اخر زمن صار الحكي عن العيب عادي وطبيعي<br />جدا الله يهديكي حبيبتي"
