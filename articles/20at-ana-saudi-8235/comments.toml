author = "سالي ."
posted = "2010-01-02"
text = "احمد هاد رايك انت وانت حر طبعا لانه الكل اعطا رايه وانا حكيت هيك عن الشباب الي قاعدين ببعتلو لولاء على قولتها انهم هيك ببعتولها وانا كان قصدي بهالشغله انو ليش هي مدايقه منهم وهي الي بتجبرهم يعملو هيك والمثال الي قلتله اني لو اني شب ما بضيعها هي عنهم انهم هما ما بدهم يضيعوها مو قصه انو الكل هييك<br />بعدين هيك انت حكيتها بالسانك انو اكثر اهل النار من النساء طيب سالت حالك ليش ؟؟؟<br />لانه النساء اكترهم هما الي بزبطو حالهم وبتهندسو مشان الشباب يطلعوا عليهم وبتعرف الباقي وهاد الي انا قصدته بانو الكلبه اذا ما هزت ديلها الكلب ما بلحقها يا احمد وانا اصلا لو كنت متل ما حضرتك بتحكي ما كان كتبت هل حكي كله يعني ما بطلعلي انصح واتفلسف وانا متلها وانا حكيت وتفلسفت لانو انا مو غلطانه باشي والحمد لله<br />بس العتب على الي ما فهم الحكي منيح وحب ينتقض وبس وبالنهايه هاد رايك وانا بحترمه ان كان معي او ضدي<br />وبالنهايه كمان ببين الي بحكي بهاد الموضوع بنيه سليمه وبنيه انو يصلح ويهدي متل وليد وعماد ومايا وغيرهم وال بحكي بطريقه غير لائقه متل الي انتو شايفينهم شو بكتبوا صح ولا لا ؟"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106141821/http://www.20at.com:80/20at/ana-saudi/8235.html"

