text = "والله يا اخت سالى انا قلت تعليق بسيط على كلامك لولاء المذكور ادناه لعلها تفهم ولا تفعل مثل ما تقول الا اننى ايضا المح فى كلامها الأول بعض من الحقيقة كلنا نعرف ما يبث فى القمر ا؟لأوروبى وهذا يؤثر بصورة رهيبة فى البنات حيث انه يؤدى الآن كما نشاهد فى مقاطع الفيديو على النت بنات ترقص عاريات وغيرها من الأفعال الغريبة عن مجتمهنا العربى ومنها ايضا بعض ما يبث فى الستلايت من امور تؤدى بالبنات والشباب الى حب التجربة باى صورة كانت ومنها ما زكرته ولاء فى كلامها الأول اما كلامها الثانى يثبت انها شقية جدا ومش سهلة وبتفكر بطريقة جنسية شويتين وكلامها قوى جدا وتقول كلام فعلا انا لو اعرف ايملها زى انتى ما بتقولى ما بضيعها من يدى … باى سالى"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106141821/http://www.20at.com:80/20at/ana-saudi/8235.html"

