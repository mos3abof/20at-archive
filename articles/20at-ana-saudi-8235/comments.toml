text = "اهلا بالجميع كل اللى عاوزين يعرفونى من شباب انا لا اقدر على مراسلة اى واحد منكم لأننى عارفة انتوا عاوزين ايه بالضبط . عاوزين تقيموا معى علاقة جنسية . وانا بنت لسه ولا ينفع هذا ومنكم من يريد ان يوصلها الى علاقة من الدبر علشان انا بنت ودة طبعا لا يجوز الا من خلال الزواج فقط . وهو كل ده علشان انا تكلمت بصراحة عما رايته وعشت فيه وكل دة على كلمتين بس ولوا كنت قلت باقى الكلام كان ايش يحصل . باى ولى لقاء للرد"
