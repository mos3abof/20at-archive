text = "انا احيى الأخت سالى على رايها لأنها فندت اقوال المسماة ولاء وانا اشك انها فتاة اصلا حيث ان كلامها قاسى جدا ولا يصدر من فتاة يصدر فقط من واحدة متمرسه على اشياء كثيرة فشكرا عزيزتى سالى لما قدمتيه من ردود انت ومايا اقول لها يجب علينا ان نفهم اقوالها ليكون عندنا الرد والتوضيح للآخرين ويكمن ايضا اخذ العبر والحيطه اخواتى العزيزات"
