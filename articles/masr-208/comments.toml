[[comments]]
order = 0
subject = "ما اجملنا"
author = "HopiZ"
posted = "2006-04-22"
text = "ما أجمل روائح الأصالة.. حين تشمها انوف تعبت من روائح الطفح المحيط.<br />ما اجمل شعورى و انا اقرا المقال .. كاننى موجوده هناك فعلا. يا ليتنا نعود الى موسيقانا الأصيلة و كلماتنا النعبره عن واقعنا.<br />يا ريت لو كنتوا اضفتوا للمقال قطع موسيقية لمارسيل خليفة و اغانى له.<br />مع عدم معلافتى السابقه له. الا انه علم فى ذاكرتى و انعشها"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213853/http://masr.20at.com:80/article.php?sid=208&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "اين اختفت الاصالة"
author = "zina"
posted = "2006-04-22"
text = "حاجة غريبة جدا لما يبقى فى شاعر اصيل محترم بيغنى لقضية مهمة وتمنعو معظم الشاشات العربية انه يظهر عليها وطول الوقت مشغلين اغانى ملهاش معنى لمغنيين صوتهم وحش انا بجد بحب اسمع لمارسيل خليفةاوى وكان نفسى اروح الحفل بتاعه بس للاسف معرفتش انه جى لان طبعا مبيتعملوش الدعاية الكافية لانه شاعر محترم ومع كدة كانت الاوبرا مليانة بالناس الى بيحبوه ويارب يفضل يطربنا كدة دايما"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213853/http://masr.20at.com:80/article.php?sid=208&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

