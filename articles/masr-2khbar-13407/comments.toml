author = "هى فين الحكومة"
posted = "2009-09-10"
text = "المهم الامن مستتب<br />وبتوع الامن المركزى فى الشوارع<br />وبتوع لاظوغلى مراقبين الاخوان كويس<br />والشرطة العسكرية مراقبة التحركات العسكرية<br />يبقى كلة اخر تمام<br />واهو كل دة مهام الحكومة<br />والشعب يشرب من المجارى ويموت نفسة فى طوابير العيش<br />انما جاى تقول زبالة وملوخية هى الحكومة مالها<br />الكبار فى الانعاش<br />ولما بيفوقوا شوية بيسالوا عن شاليط"
archived = "2009-09-14"
capture_url = "https://web.archive.org/web/20090914134644/http://www.20at.com:80/masr/2khbar/13407-2009-09-10-06-52-22.html"

