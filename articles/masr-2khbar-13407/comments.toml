author = "طالما المحافظ لواء"
posted = "2009-09-10"
text = "طالما المحافظ لواء اركان حرب متسرح من الخدمة وجاى يقعد لة سنتين تلاتة منجهة يعمل فيهم قرشين ويمشى وييجى لواء غيرة يبقى مفيش الى فايدة<br />المحافظ لازم يكون من المنطقة ويختار بالانتخاب ويكون شخصية عامة<br />انما اللواء دة اصلح مكان لة بعد الخدمة يمسك نادى رياضى او مركز شباب"
archived = "2009-09-14"
capture_url = "https://web.archive.org/web/20090914134644/http://www.20at.com:80/masr/2khbar/13407-2009-09-10-06-52-22.html"
