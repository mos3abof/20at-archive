[[comments]]
order = 15
subject = "الصمت المخزى"
author = "ابو اسامة"
posted = "2006-07-16"
text = "لم اعد ادرى من نحن هل نحن عرب ؟<br />هل نحن مسلمون؟ام اصبحنا مخنسون بين بين<br />هل من يموتون فى لبنان ليس اسمهم محمد وعلى وحسن ام انها اسما تشبهناهل من يحكموناينطقون بالشهادتين ام انهم بين بين<br />لقد نادت امراة فى زمن المعتصم ومعتصماه<br />فلبى ندائها ولم ينتظر ليفكر وكان اسلامه ورجولته اقوى من اى شىء ولم يصمت لينطق كفرا كما فعل الجبنأ العرب .<br />ايها ألأمة ان لم تخرجى عن صمتك وتلبى ندأ<br />اخوانك من المسلمين فسوف تجنى الخزى والعارولن يكون لكى صوت بعد الأن فلا تخشى شىء واخرجى عن صمتك فلسوف يسئلنا الله عنهم يوم القيامة(اتخشونهم فالله احق ان تخشوه ان منكنتم مؤمنين)"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011002/http://masr.20at.com:80/article.php?sid=657"

[[comments]]
order = 16
subject = "تسونامي"
author = "هند"
posted = "2006-07-16"
text = "انني انتظر تسونامي ليضرب بحكامنا العرب ان كانو عرب و يعجل من نهايتهم التي ستكون في جهنم بادن الله لان الصرا و العويل ة الهتاف من طرف الشعوب لن يفعل شيئ فاما ان نخرج جميعا بدون استثناء من بيوتنا متجهين نحو فلسطين وجنو لبنان او سندهب الى الجحيم و ما استغرب له ليس موقف الحكام النائمون في سبات عميق ولكن لمادا هناك شيء اسمه جيش لبناني أليس للدفاع عن لبنان ام ان الجنوب لا يعتبر من لبنان؟؟ ام انهم يخافون التصعيد؟؟؟ ففي النهاية حزب الله و سكان الجنوب هم من ابناء لبنان وجب للدولة اللبنانية حمايتهم فاين هده الحماية؟؟؟ اما الجبناء الاخرين من بقية الحكام فماواقفهم ليست بجديدة ومن المفروض ان نسميهم معالي مسلحي احدية الصهاينة فهم كلما اجتمعو للتشاور نسوه ولم يتفكرو سوى احتساء كؤوس الشراب و التحلية بالهروين والكوكايين. فلياتي تسونامي او قنبلة ايران النويية لتخلصنا من هدا الدل اما حزب الله فهو حزب الرجال الدين انقرضو مند 1948 وهو اخر ما بقي من المسلمين. و اسال الله ان يتبت خطاهم و يثبت عزمهم والله الموفق و القادر على نصرتهم."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011002/http://masr.20at.com:80/article.php?sid=657"

