[[comments]]
order = 3
subject = "إدمان الفشل"
author = "عابر القارات"
posted = "2006-07-15"
text = "الا تلاحظون شئ عجيبا ... الحكاية من الأول قال السادات إننا سوف نتقدم بالسلام و سوف نعقد السلام مع اليهود (ولاد الجزمة) لرخاء الامم فى السنين المقبلة و قال ذلك طبعا سنة 1977 يعنى من ثلاثـــــــــــــــين سنة و الله يرحمه بقى مطرح ماراح و الله أعلم بنيته ساعة أن قال هذا الكلام ... نييجى بقى لنهاية الحكاية اللى بنعيش فصولها و أرجو من الله أن تكون الأخيرة نيجى نبص على النتائج اللى بشرنا بيها المرحوم نجد لا تحقق سلام و لا تحقق رخاء فأحوال البلد الأن هى أسوأ من أسوأ أيام عاشتها مصر حتى فى أحلك عصورها أيام الحروب سواء فى هزيمة 67 أو إنتصار 73 فبذلك سقطت الغاية التى من أجلها عقدت معاهدة السلام (و ما حدش يقولى الله يخليكوا إن سينا رجعت تانى لينا و مصر اليوم فى عيد فالحداية لا يمكن أن ترمى كتاكيت و إذا كانت إسرائيل قد تكرمت و تنازلت عن سيناء بعد مفاوضات مضنية فقط تنازلت عنها بشروط أى ليس تحرير كامل و من يدرس هذه الشروط يجدها شروط مذلة و أولها أن مصر لا يمكن أن تبسط سيطرتها على سيناء و ليس لها حرية إنتشار الجيش كما تفعل أى دوله لها سيادة على أراضيها بينما يمرح و يلعب الجنود الاسرائليين على حدودنا بل و يقتلوا جنودنا و يصطادوهم كما يصطادوا العصافير بلا دية) أما الوسيلة و هى السلام فلم يتحقق لا سلام و كلام و من يتخيل أن بمثل مواقف إسرائيل القديمة و الحديثة و المخطط المعروف من الفرات الى النيل و بالعكس و الذى فصوله تتجسد أمام أعيينا كل يوم من إحتلال العراق لفلسطين للتنكيل بمن هو عربى أو مسلم و لكن عميان البصائر لا يريدون أن يروا هو أكبر دليل أن المخطط لا يزال حيا و لا يزال البرنامج الموضوع لتنفيذه حتى يسبق كل التوقعات و أقول لا أظن أنى سوف أجد رجلا من بين الحكام العرب لازالت تجرى فى عروقه د<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011002/http://masr.20at.com:80/article.php?sid=657"

[[comments]]
order = 4
subject = "اسألوا ريسنا باعنا بكام ولمين ........."
author = "http://ibnbahya.blogspot.com"
posted = "2006-07-16"
text = "مصر إيه يا عم الله يهديك ؟؟؟ مصر باعها الريس من زمان وقبض الثمن .. مصر اللي كان العالم كله ينتظر كلمتها ليرى موقفها ويحدد اتجاهه وفقاً للرد المصري وتحسباً للدور المصري .. بقت خلاص في البطاطا .. حسني العرص باع مصر .. باع تاريخها وحاضرها وحتى مستقبلها .. أول مرة أشوف رئيس بذلك الشكل المخزي .. يبيع الوطن تاريخاً وحاضراً ومستقبلاً .. وجاي تقولي مصر .. مصر خلاص عليه العوض ومنه العوض .. والله لو ما لحقناش نزيل النظام الوسخ ده مش هيبقى لمصر أي وجود خالص .. يا شباب كلامي مفهوم ولا غامض ؟؟ يا ريت تراجعوا مصر في الربع قرن الذي حكم فيه ذلك الكلب حسني مبارك .. شوفوا مصر كانت فين ودلوقتي فين .. على كل الأصعده .. داخلي وخارجي .. الريس الكلب باعها .. باعها هو وعصاباته وقبضوا التمن سحت في كروشهم .. باع مواقفها باع تاريخها .. باع أرضها .. ممكن تروحوا للمدن الجديدة وتشوفوا المستثمرين مين هما ؟؟؟ ممكن تروحوا للشركات اللي اتباعت وتشوفوا مين اللي اشترى ؟؟؟ ممكن ولا دي صعبه ؟؟؟ شوفوا الصهاينة اشترونا .. وبكام ؟؟ اسألوا ريسنا الخول ...<br />http://ibnbahya.blogspot.com"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011002/http://masr.20at.com:80/article.php?sid=657"

[[comments]]
order = 5
subject = "حاجة تجنن"
author = "المياسة"
posted = "2006-07-16"
text = "السلام عليكم دار قوم آمنين .. هي دي تحيتنا من اليوم ورايح وطبعاً انتوا عارفين ايمتى احنا بنقول التحية دي ( لما نكون فايتين على مقبرة فإحنا بنحيي الأموات وبنسلم عليهم بالتحية دي ) وياعتبار إن إحنا شعوب ماتت خلاص بعد مادفنت بإيدها كرامتها ماتجوزش علينا غير التحية دي .. كده ولا أنا غلطانة. أنا عندي فكرة احنا كل العرب نطلع بمظاهرات نرفع فيها شعار واحد لحكامنا نقولهم إذا كنتوا بتذلونا وتخذلوا سيد العرب السيد حسن نصر الله عشان خايفين على كراسيكم فإحنا بنقوللكم خدوا الكراسي انتوا وولادكم اشبعوا بيها بس انصرونا على عدونا ورجعولنا كرامتنا اللي ماتت وانتصروا للسيد حسن يعني صفقة زي ماتقولوا كده رأيكم إيه؟ ولا أنا اللي باين عليي اتجننت وبخطرف. الله يلعن أبو الكراسي على أبو السياسة الفاتحة على أرواح شهدائنا وأرواحنا مااحنا ميتين كمان"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011002/http://masr.20at.com:80/article.php?sid=657"

[[comments]]
order = 6
subject = "عوده الموتى"
author = "مواطن فى الطريق الى غزه"
posted = "2006-07-16"
text = "عايزين حل مش بكاء علي الاموات لان ايبكي على حالناحان الوقت للتخلص من الكلب مبارك اننا نخاف من الموت ولكن شجره الحريه ترويهاالدماء واليكم حل سريع لما نحن فيه<br />اولا ـ العوده الفوريه الي ديننا الذي هجرناه واتبعناحريات فاشله اوقعونا فيها<br />ثانيا ـ الموت آت لامحاله فيجب الخروج علي هذاالجبان بارواحنا في ثوره الان<br />ثالثا ـ ايجاد البديل متمثل في عده اسماء لم تطلب السلطه وتكون قادره علي القياده ومنها<br />المحجوب محافظ الاسكندريه<br />عادل لبيب محافظ قنا الاسبق<br />محمد ابو العنين رجل الاعمال<br />مرشح الاخوان المسلمين<br />عمرو موسى<br />على ان نخرج جميعا خروج فوري لتحرير انفسنا من الاحتلال الصهيوني المبارك الذي لن يرحل الا بالقوه لان الحريه تؤخذ بالقوه اما انتخابات وقضاه ومعارضه وما الى ذلك فهو مجموعه اكاذيب واستخفاف بنا كشعب وصفه المصطفي صلي الله عليه وسلم بانه خيره اجناد الارض ووصفه مبارك وزبانيته بانه شعب كلب بن كلب ولخوفنا من الموت صدقنا من اهاننا مع علمنا بكذبه صدقنا الانتخابات مع علمنا التام بفوزه لان فشله يعني نهايته هو ومن معه ولاننا نخاف الموت صدقناه صدقنا القضاه مع علمنا التام بان ايديهم هي من زورت صدقنا الصحافيين ونحن نعلم انهم موظفين واجبن من ان يساعدونا وخرج نقيبهم علينا مفتخرا بمكالمه الطاغيه وكأنه كليم الله موسي ولو خرج علينا الآن المسيخ الدجال لصدقنا لاننا ادمنا الكذب وخفنا من الموت وحرصنا علي الحياه حتى لو كانت جنه المسيخ الدجال لشهداء الان هم من"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011002/http://masr.20at.com:80/article.php?sid=657"

[[comments]]
order = 7
subject = "نداء إلى جميع السوريين"
author = "المياسة"
posted = "2006-07-16"
text = "ناصر السهلي<br />هذا النداء العاجل الذي أوجهه للقيادة والشعب السوريين يعتمد على مصادر إعلامية غربية أعرفها معرفة شخصية، آملا أن تصل إلى أصحاب العلاقة.... وبالسرعة القصوى....<br />العدو الصهيوني يحضر من خلال تحشيد صامت لمواقف غربية وعربية لشن عدوان على الجمهورية العربية السورية وذلك في محاولة لإختبار الموقف الايراني الذي أعلن بأنه سيقف مع سوريا حال تعرضها إلى عدوان... هذا الموقف الصهيوني أخذ الضوء الاخضر الامريكي وبعض الدول الاوربية تحت تسمية \"عملية جراحية دقيقة\" تهدف إلى إيصال رسالة مزدوجة للقيادة السورية والايرانية ولقيادات فلسطينية معينة...<br />إنني أوجه هذا النداء بالحذر واليقظة من المناورات التي يقوم بها العدو الصهيوني ... وقد حصلت صباح هذا اليوم السبت 15 يوليو من أحد الزملاء الصحفيين وهو مراسل وكاتب متجول... وخلال حديثنا إستطعت معرفة بعض ما حصل عليه الزميل من معلومات بالصدفة... والمتابعة... وكان هذا الاعلامي قد تعرض في السابق لحملة تنصت من قبل أجهزة إستخبارات وتم جرجرته إلى المحاكم الدانماركية ليبوح بمصادره التي رفض رفضا قاطعا البوح بها...<br />إننا حين نوجه نداءنا للأخوة في سوريا فمن محبتنا لعروبتنا ولهذا الشعب العربي الذي لا نريد أن يصيبه أي مكروه من خلال غدر تجهز له قوات العدو وبصمت عربي متواطؤ مع بعض الدوائر الغربية....<br />عاجل ... عاجل... أيها السوريون الحذر ثم الحذر الرجاء من كل الأخوة الذين يتلقون هذا النداء إخبار أكبر عدد ممكن لعلنا نستطيع ايصال هذه الرسالة التحذيرية إلى أكبر عدد من الناس"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011002/http://masr.20at.com:80/article.php?sid=657"

[[comments]]
order = 8
subject = "ممكن"
author = "مصرى متغرب"
posted = "2006-07-16"
text = "عجبنى ترشيح عمرو موسى لحكم مصر وواحد رشح المحجوب ودة كمان رائع وكمان عادل لبيب الكلام دة طرح سؤال خطير ماكناش واخدين بالنا منه مين هايحكم مصر؟؟؟؟؟؟؟<br />اولا شلة المنتفعين لن تسمح بأى محترم وستقوم بابعادة مثلما فعل النظام الحالى مع ابو غزالة والجنزورى وعمرو موسى وغيرهم وثانيا لابد ان يكون الجالس على الكرسى من نفس النوعية بتاعتهم علشان يقسمو وينصصو مع بعض ويبيعو الى لسة باقى من البلد يعنى قناة السويس والسد العالى و؟؟<br />تصدقو مافيش حاجة تانية تتباع البلد خلصت واتبعات وبابا حسنى قبض على فكرة حسنى مابيحبش جمال عايز يعملو ريس على بلد مافيهاش حاجة للبيع انا شايف ان اكبر عقاب لجمال وابوة ان احنا نسيبة يمسك البلد ههههههههههههههههههههه"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011002/http://masr.20at.com:80/article.php?sid=657"

[[comments]]
order = 9
subject = "تاء التآنيث وتاء التخنيث"
author = "زنوبه"
posted = "2006-07-16"
text = "هناك ما يسمى تاء التآنيث وتاء التخنيث<br />وما تنشره الصحف القوميه فى شآن القضيه اللبنانيه هو تعبير عن حالة التخنيث التى يمر بها النظام<br />نحن نتحدث عن نطام لم يتحرك لمقتل جنوده على يد الصهاينه على الحدود المصريه ونحن متفقين على ما آعتقد آنه هناك حاله من الانفصال التام بين السلطه والشعب<br />ندعوا الله آن ينصر آخواننا المجاهدين وآن يلحقنا بهم وبشهدائنا الابرار<br />همسه فى آذن آخواننا فى الوطن من النصارى إسرائيل تقتل المدنيين الابرياء فى لبنان من جميع الاديان والطوائف والملل ـ ولديهم ماهو آسواء لنا فى مصر ـ لا تجعلوا الفرقه تآخذ مجراها بيننا وبينكم آو بين بعضكم البعض فإن عدونا واحد ـ عدونا هم قتلة الانبياء مغتصبى الشعوب الصهاينه آعداء الله<br />اللهم النصر والشهاده ـ اللهم صلى على سيدنا محمد وآله وصحبه وسلم"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011002/http://masr.20at.com:80/article.php?sid=657"

[[comments]]
order = 10
subject = "هاهاهاهاهاهاها أضحكتنى يا فتى"
author = "سعيد التعيس"
posted = "2006-07-16"
text = "بالرغم من الصداقة المتينة بين حسنى مبارك و أولمرت (و من قبل طبعا بين شارون و أولمرت) فكعادة اليهودة يخونون أباءهم و ربما أنفسهم و تمشيا مع هذه العادة دفعنا أولمرت لمقارنة بسيطه بي جنديين و جنديين و طبعا لم تفهموا شيئا أقول لكم دفعنا للمقارنة بين جنديين مصريين و جنديين إسرائيليين و بالتحديد الجنديين المصريين الذين إستشهدا على يد قطعان اليهود الرابضين على حدودنا الشريفة و جنديين من نفس القطعان أسرهما حزب الله ... فى الحالة الاولى لم تحرك مصر ساكنا و كلبين و راحوا أما فى الحالة الثانية فقد جيشت إسرائيل الجيوش و دكت الحصوت و أراقت دماء الابرياء و جعلت عاليها سافلها فقط لمجرد جنديين لا زالوا أحياء (و كنت لا أصدق أنهم فعلوا ذلك بسبب جنديين و لكن مجرد مقارنة) فهل ترجون من مصر أن تفعل شيئا أو تنتظرون منها شيئا"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011002/http://masr.20at.com:80/article.php?sid=657"

[[comments]]
order = 11
subject = "مواطن منحوت الدخل"
author = "الصحافه المصريه جمعاء على رأي الممثل بتاع زوزوصحافه مرتزقه وانصاف موهوبين"
posted = "2006-07-16"
text = "اخبار اهرام جمهوريه ولنختار اعرقهم الاوهي الاهرام<br />في احداث شرم الشيخ الاخيره وفي احد البرامج الممله خرج علينا اسامه سرايا بموضوع هذامفاده<br />انه تقليدا لاسيادنا الخواجات لابد من موقف مصري حضاري الاوهو الوقوف ساعه حداد على ارواح شهداء الانفجارات فعاجله المفتي ان الوقت من ذهب وخشب والمنيوم ويكفي ثلاثه دقاءق مع ان المفتي بيجي الىالبرنامج متاخر بسبب المواصلات وشر البليه ما يضحك"
archived = "2006-07-19"
