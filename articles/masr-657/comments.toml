subject = "جيد جدا كبداية!"
author = "عاشق فلسطين"
posted = "2006-07-16"
text = "من صميم فؤادي بأحي الإخوة والأخوات اللي تفاعلوا مع الموضوع وأدلوا بأرائهم وأنا بألمس درجة لابأس بها من النضوج. الخازوق اللي السادات وخليفته قعودنا عليه أخطر بكثير مما يتخيل أكثر المتشائمين وأرجوكم تفكروا معايا في لحل لأكبر ثلاث مشاكل تواجهنا، وأؤكد إن إزالة هذا النظام حتمية وواجبة وضرورية:<br />أول مشكلة: أهم مشكلة تواجهنا وتدفعنا للتبعية والعبودية هي الديون الخارجية التي تتجاوز 800مليار دولار، واللي لو حسبانها راح نجدها مجموع ثروة بس عشرة من اللصوص الكبار في البلد زي الريس نفسه وأنجاله وطلعت وعزت السادات وزفت عز ..الخ. هل لو قامت ثورة شعبية أو من الجيش، يمكن تحصيل هذة الأموال المسروقة من الحسابات السرية في الخارج لتسوية الديون، وماتنسوش إن فوائد هذة الديون فلكية وتزايد بإستمرار.<br />ثاني مشكلة: هل هناك رؤيا واضحة لإنهاء التبعية الأمنية والعسكرية لأمريكا؟ إحنا بنحتاج من جديد لحليف قوي يزودنا بالسلاح والعتاد وبغطاء سياسي دولي. مين هو البديل؟ وقبل كده هل إخراج الأمريكان من مراكز السيطرة في البلد وقواتنا المسلحة أمر ممكن؟ هل راح يتم بالسهولة اللي خرج بيها الروس بقرار السادات؟<br />ثالث مشكلة:إحنا مخترقين حتى النخاع من شبكات التجسس الأمريكية والصهيونية وبصراحة رجالتهم ماسكين أهم مفاصل الدولة، وقواتنا المسلحة أضعف من وضعها في سنة ثمانية وأربعين قياسا بالمجمل العام لتوازن القوى. فكروا من فضلكم وقولولي."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011002/http://masr.20at.com:80/article.php?sid=657"

