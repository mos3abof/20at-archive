text = "يا سادة و يا سكر زيادة ان الذى يرجو من النظام المصرى أى موقف صلب يعبر عن ما يشعر به الشعب من إحباط و مساندة غير محدوده للمقاومة فالنظام الذى يضرب رعاياه بالاحذية لن يحس بمعاناة أحد و كأن الواهم فى رد فعل مصرى شهم هو كمن يتوقع أن يحلب ثورا ليشرب منه الحليب"
