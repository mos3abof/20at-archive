[[comments]]
order = 0
subject = "والسعودية كمان أدانت حزب الله"
author = "عاشق فلسطين"
posted = "2006-07-15"
text = "لسه في معرض ردي على أحد أنذال الكويت ذكرت إن مصر الرسمية لاتقل حقارة وعمالة وتآمر عن الكويت، ولولا خيانة النظام المصري بالذات وبيعه مصر ومكانتها وثقلها بحفنة من أموال كويتية وسعودية لما دمر العراق. سويسرا بلد الحيادية الأول فيها ثلاث قوميات ولغات ألماني فرنسي وإيطالي فكان الأسلم تبقى على الحياد بإعتبار الثلاثه دول دايما داخلين حروب. بس مصر تقولي إزاي تبقى محايدة؟ حتى من ناحية عسكرية يعد محور غزة بئر سبع خط دفاع مصر الأول والمضايق الثاني وقناة السويس خطها الثالث وبعده يبقى القطر المصري مفتوح للعدو. السعودية أعلنت إدانة حزب الله وحملته المسئولية والسعودية هي اللي في إيدها مرتب الريس بتاعنا، يعني أعلنوا الخيانة صراحة الوقتي، تصبحوا على خير."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719011002/http://masr.20at.com:80/article.php?sid=657"

