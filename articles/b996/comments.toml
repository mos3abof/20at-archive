[[comments]]
order = 2
subject = "موضوع جامد"
author = "دودو"
posted = "2006-06-27"
text = "موضوع حلو قوي قوي قوي<br />فعلا فيه كم معلومات غير عادي، وكمان باين الروح الجميلة في الكتابه<br />اما بقى بخصوص موضوع الخرافات ففيه كثير قوي وبم اني منالريف فف عدد لا يحصى من الخرافات اشهرها<br />-لا تقومي برمي الماء الساخن على الارض ليللا<br />-لا تقومي بالمرور من فوق الملوخية الخضراء عشان ما تبوظش<br />-لازم تمسحي جسم طفلك بعد الولادة باللبن عشان ميكونش في جسمه شعر كثير<br />وغيرها وغيرها<br />بس الموضوع رائع"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103330/http://www.20at.com/article2.php?sid=996"

