[[comments]]
order = 4
subject = "هذا هو الوقع الذى يعيشه الانسان"
author = "احمد المصرى"
posted = "2006-06-27"
text = "على الرغم من جمال الموضوع الا انى اتعارض معكى سيداتى<br />بنائا على بعض التجارب التى اقامها بعض العلماء الامريكان وهى<br />انهم اتو بكبسوله مكونه من دقيق القمح والسكر واتو بمجموعه من الناس وقسموهم لمجموعتين واتو للمجموعه الاولى بهذه الكبسوله وقالو لهم انها تقلل من احساسك بشكت الدبوس هذا<br />واتو للمجموعه الاخرى بنفس الكبسوله وقالو لهم انها تذيد من احساسهم بالدبوس<br />وبعد انا اقنعو كل ترف اتو بالدبوس للمجموعه الاولى وبدئو بشكهم بالدبوس وقاولو لهم مامدى احساسكم قالو قليل<br />اما الترف الاخر فامنهم من لا يسمح لهم بملامست الدبوس جسده ومن لامسه الدبوس قام بالصرخ مفزوعا من الألام<br />اى انه عندما يكون الانسان مقتنع تماما بشئ فهو يحدث له بلا شك اى انها ليست خرفات<br />بال واقع يعيشه الشخص مع نفسه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103330/http://www.20at.com/article2.php?sid=996"

