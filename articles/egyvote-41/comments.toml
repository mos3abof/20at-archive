subject = "اية قضاة"
author = "اليتامى بعد محمد"
posted = "2005-11-22"
text = "ين هم القضاة وكل ما يحدث بمراى ومسمسمع منهم ولم يحتجوا ولم يظهور اىة عاداء اذاء ما حدث كل ما عليهم على العايمة نشجب فقط وكذلك هم اين انتم ياقضاة العدل بل اين العدل نفسه لك الله يامصرنا الغالية ولنا الله نحن شعب مصر الى ان ياتى بالفرج وهو اتى قريبا حدا انشاء الله"
archived = "2007-08-15"
