[[comments]]
order = 0
subject = "برامج الأحزاب ؟؟؟كان زماااااان"
author = "محمد السيد"
posted = "2005-11-30"
text = "معاك حق...<br />برامج الأحزاب في مصر مش واضحة فعلا .... بمكن زمان كان في برامج حقيقية ... وكان في رموز فعلا ... وكنت تقدر تعمل مناظرة بين التيارات والاتجاهات المختلفة ...<br />يعني الحزب كنت تلاقيه في كل الفئات ... فيه الشيوخ والشباب ... الرجال والسيدات ...<br />كان في حياة حزبية بجد .... الكلام ده كان واضح أكتر ... قبل الثورة وفي فترة السبعينات ...<br />لكن منه لله ... اللي في بالي ... من يوم ما مسكنا ... وقفل علي كل حاجة ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-06-10"
capture_url = "https://web.archive.org/web/20070610030554/http://egyvote.20at.com:80/article.php?sid=85"

[[comments]]
order = 1
subject = "هي فين البرامج ؟؟موجود بس محدش عارفها يا ابني"
author = "محمد السيد"
posted = "2005-11-30"
text = "كل الشخصيات الحزبية الي بتنجح .. بتنجح باسمها وشخصيتها ... مش بأحزابهم ...<br />بعكس الإخوان مثلا ... اللي بينجحوا مع الجماعة وباسم الجماعة .... و سياسيا ده الصح علي فكرة ...<br />ليسارين كلهم انضموا لجانب الدولة ... زنسوا حقوق العمال والحاجات اللي كانوا بينادوا بيها زمان ...<br />القوميين ... وبعد النكسة و حكم عبد الناصر .. انتهي الفكر تماما ... وإن كان البعض بيترحم علي خطب وشخصية عبد الناصر ....<br />الليبراليين ... بداية الوفد أيام الملكية كانت رائعة ... لكن بمرور الأيام بات مشكلته ... وهي اعتماده علي الباشاوات والإقطاعيين ... وبكده كتب نهايته .... وكانت نهايته علي يد نعمان جمعة في انتخابات الرئاسة ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-06-10"
capture_url = "https://web.archive.org/web/20070610030554/http://egyvote.20at.com:80/article.php?sid=85"
