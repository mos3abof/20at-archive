[[comments]]
order = 0
subject = ""
author = "اختلف معك"
posted = "2009-07-16"
text = "معلهش كلامك عن الراسمالية والمدير والموظف والعامل كلة غلط<br />فى الدول الراسمالية سواء امريكا او انجلترا او ايطاليا او اليابان لما بتلتحق فى مصنع او مؤسسة خلاص اصبحت ابن المصنع او المؤسسة وبيجرى تدريبك واعدادك لتكون موظف فيها طوال عمرك الا للضرورة القصوى<br />هناك العمل خبرة وتدريب المؤسسة بتدفع فيها غالى وبتحافظ على موظيفيها<br />انما فى العمل الحر عندنا دة شغل زى شغل الطابونة<br />عمال تراحيل<br />نظام عالم اجرية وبالمقطوعية ومفيش ولاء ولا انتماء لجهة العمل<br />اى كلام وبدنجان<br />وسلم لى على البطاطس المقلية والشيبسى"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718231752/http://www.20at.com:80/masr/2khbar/12676----1.html"

[[comments]]
order = 1
subject = ""
author = "الادارة بالزفلطة"
posted = "2009-07-17"
text = "لما يكون الموظف بيتظفلط تيجى تمسكة من هنا يزفلط من هنا ومش عارف تمسك علية حاجة وكلة كسل وطناش<br />يعمل اية المدير او رئيسة فى العمل<br />يتعلم الزفلطة<br />ازاى<br />فية كتاب رائع مؤلفة وزير التنمية الادارية اسمة الزفلطة والبلبطة والسلبطة فى الحكومة<br />يقول الكتاب فى باب مبادىء الزفلطة<br />بما ان عدد موظفى الدولة بلغ 5 ملايين موظف فهنوقف التعيينات خالص واللى نعينة هيبقى بعقد مؤقت هياخد مرتبة من الدولة ولكن هنزفلطة علشان ما يتحسبش علينا موظف وهنديلة اجر برضة<br />اما الباب التانى فهى زفلطة الموظفين الى المقاهى والبيوت تحت بند المعاش المبكر ونقبضة ونقعدة فى البيت علشان يتزفلط مع المدام فى البيت ومع العيال<br />اما الباب الثالث فبيقول"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718231752/http://www.20at.com:80/masr/2khbar/12676----1.html"

[[comments]]
