posted = "2009-07-18"
text = "الحرامية بتوع القطاع العام سابقا هم اصبحوا الملاك الجدد والمديرين للقطاع الخاص واصحاب الاعمال<br />وطبعا الحرامى بيدير الشغل بعقلية الحرامى<br />عايز يسرق العمال والموظفين اللى بيشتغلوا عندة<br />والاشكال دى لما ترمى الاستقالة فى وشة وطبعا مش هتشوف وشة ولكن هتشوف المدير اللى معينة هترتاح وهتروح تنام وانت مبسوط لانها مش هتفرق كتير"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718231752/http://www.20at.com:80/masr/2khbar/12676----1.html"

