[[comments]]
order = 5
subject = ""
author = "بقية التعليق السابق"
posted = "2009-07-19"
text = "(إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى، فمن كانت هجرته إلى الله ورسوله فهجرته إلى الله ورسوله، ومن كانت هجرته لدنيا يصيبها أو امرأة ينكحها فهجرته إلى ما هاجر إليه )<br />(أحب لأخيك ما تحبه لنفسك)هل هذا صعب عليك يابني آدم..؟؟مقابل أن تسعد براحة نفسية<br />وإن كان هذا صعب عليك فهنئياً لك الأطباء النفسين…وقلة النوم..وعدم الشعور بالراحة والشعور بالإكتئاب<br />ما هي فائدة الضمير…؟؟<br />منبه صغير …ينبهك أن ما فعلته يسعدك رؤيته يوم لاظل إالا ظله وزايد لحسناتك<br />أم<br />يحزنك ويزعجك رؤيته يوم لاظل إلا ظله وسارق لحسناتك<br />وأخيراً إخوتي في الله<br />لا يسعني إلا قول<br />الضمير<br />نعمة …يجب شكر الله عليها<br />وأنصحكم وأنصح نفسي<br />بأن نسمع صوت الضمير …وتنفيذ ما يدعونا به ضميرنا<br />حتى نرتاح في دنيانا ونُرحم في أخرتنا<br />أطيب التحايا وأرقى الأمنيات"
archived = "2009-07-21"
capture_url = "https://web.archive.org/web/20090721154515/http://www.20at.com:80/masr/review/12676----1.html"

[[comments]]
order = 6
subject = ""
author = "ماهو الضمير...؟؟"
posted = "2009-07-19"
text = "الضمير ليس بعضو ولا جهاز بداخل جسمك<br />بل هو أعظم وأرقى من ذلك وهو في رأيي الشخصي<br />مراقب عليك وعلى أفعالك في دنياك<br />يدعوك ويرشدك إلى فعل الخير…ويحذرك من فعل الشر<br />يهمك رضائه ويحزنك غضبه<br />يُرحيك إذا أطمئن …ويُكئبك إذا أنزعج<br />صوته ليس يقاس بقوته<br />بل يقاس بإيمانك بالله سبحانه وتعالى<br />فكلما زاد إيمانك زاد قوة صوته …تشعر به من داخلك<br />أما والأعوذ بالله إذاكان إيمانك ضعيف فلن تسمع هذا الصوت أبداً<br />كيف ترضي ضميرك…؟؟<br />رضائه بسيط وسهل لا يتطلب أكثر من التركيز على ما تقوله وتفعله<br />فكل ما هو مطلوب منك حتى تنال رضائه …هو إتباع منهج الله سبحانه وتعالى<br />وتنفيذ وصايا رسوله الكريم وإجتناب نواهيه<br />وذلك عن طريق<br />أن تضع عقلك أمام لسانك …فتفكر فيما تريد أن تقوله قبل أن يتفوه به فمك<br />وأن تضع هذه الأية الكريمة أمام عينك في كل تصرفاتك وأعمالك<br />قوله تعالى: {فَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْراً يَرَهُ وَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرّاً يَرَهُ} وأن تضع حديثي الرسول صلى الله الله عليه وسلم أيضاً أمام عينيك أيضاً"
archived = "2009-07-21"
capture_url = "https://web.archive.org/web/20090721154515/http://www.20at.com:80/masr/review/12676----1.html"
