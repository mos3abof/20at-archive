subject = ""
author = "استقالة"
posted = "2009-07-17"
text = "استقالة اية<br />المعلم مبسوط من شغلك جدا وفرحان منك خالص وبيقول لك هو مش عايز يشوف وشك من بكرة<br />والراجل من دول يصحى الصبح على صوت مراتة بتصحية وتقول لة اقوم روح الشغل - يشد المحفظة من تحت المخدة ويعد الفلوس جواها اذا لقاهم 10 جنية يروح حالف بالطلاق بالتلاتة ما هو رايح الشغل النهاردة اما اذا لقى المحفظة فاضية ينط يلبس الجلابية ويشيل القصعة ومسطرين المحارة ويتشعبط على سلم اتوبيس ويروح الشغل<br />مش هو دة الواقع<br />مفيش احد عايز يشتغل<br />روح العمل فى البلد دى انهارت<br />كل واحد عايز يبقى بسبس مان ويكسب ملايين وهو نايم على السرير ويطلب من مراتة كباية شاى"
archived = "2009-07-18"
capture_url = "https://web.archive.org/web/20090718231752/http://www.20at.com:80/masr/2khbar/12676----1.html"

