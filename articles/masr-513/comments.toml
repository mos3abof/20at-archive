text = "السلام عليكم<br />بصراحة أنا الموضوع عجبني جدا ...<br />و كمان الردود ( فيها موضوعية في النقد أو الاعجاب )<br />أنا لسة جديد في الموقع بس واضح ان في ناس فاهمة هيا بتعمل ايه ...<br />على العموم تمنياتي بالتوفيق للكاتب و لكل من شارك بالرد ...<br />و ...<br />و بس ..<br />أحمد حلبية"
