[[comments]]
order = 0
subject = "LoNeLy"
author = "ـحمد شاكر"
posted = "2006-06-13"
text = "حقا لا أدرى ما أقول ... فبدون هذين الرجلين كانت لتتغير فى حيات اشياء كثيرة... د.أحمد خالد توفيق و ما أدراك ما أدب دكتور أحمد فهو ليس بأديب للرعب و الخيال و المغامرات فقط... إنه معلم للأجيال فهو أراد ان يسهم فى تثقيف أبناء وطنه بعد أن رأهم تركوا المكتبات و الكتب ... فأخذ يصنع من خلاصة معرفتة و علمه الرائعيين كبسولات للشباب و قدمها لهم مغلفة بكل ما يشتهونه من خير و إثارة و مواكبه... لقد قابلت هذا الرجل من قبل... أقوله بحق إنه أحد عباقرة هذا الكوكب.. إنه رجل منقرض لابد من إحاطته بمحميه ليتنج لنا المزيد من العباقرة أمثاله...حقظه الله لنا و بارك له و هداه على الطريق المستقيم... د.نبيل له دور مشابه فهو وجد أبنا وطنه بلا قدوة بلا أمل يعلقون صور الأجانب فى غرفهم من دون أن يتمكنوا من إستهجاء أساميهم ... فهم لم يجدوا أى قدوة لا داخل البيت ولا خارجة و هم لا يقبلون على قرءاة ثراثنا الملئ بالقيم .. فقرر أنت يحمل على عاتقه أن يحاول أن يصور لهم قدوة جديدة لكى تكون نبراسا للأمل لهم و دعوة للتمير... لكم من كل التفدير أيها السادة و من كل مثقفى مصر"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144128/http://masr.20at.com:80/article.php?sid=513"

[[comments]]
order = 1
subject = "دا مش تخبيط في الحلل .."
author = "هووووووووووووبه"
posted = "2006-06-13"
text = "ححكلكم الحكايه من البدايه الاول ايام ماكان عندي 12سنه , ابتديت بفلاش وشماس لخالد الصفتي وعلي فكره بقي سماش وفلاش بيعلمو الوطن كمان كان مختصر الناس الغلابه في شخصيه \"المواطن مطحون\" او \" منسي \" , واكتر من 20شخصيه متنوعه ,وشخصيتي المفضله كانت \" لماضه \" , اكتشفت ان في روايات تانيه في قفاه الورقه تبع روايات مصريه لجيب<br />قلت يا بت يعني فيه اكتر من فلاش وسماش طب ما تسالي روحت المكتبه وابتديت الادمان بمعني الكلمه كان مصروفي فعلا بحوشه عشان ابدل القصص بتاعت ادهم ومحمود بالخصوص ,\"وياكابتن حاله خوار او اي حد يعرف ادهم لقه ابنه ولا لسه يقول وسونيا ايه اللي جرلها ومني ماتت ولاه لسه ولاه اتجوزت وعمل بإصله ومخلهاش بايره \" وفي اخر الرويات بقي بدء التخبيط في الحلل بمعني خاله كبير وبشعر ابيض وشاب بقي وكدا وعمل فريق المستحيل وخلي ادهم يقع من ضربه\" وقدري كان سكره اوي \" ,<br />وبعدين ايه يا سيدي وماستك الاانا<br />كوكتيل 2000علي فكره دي من احب القصص لنبيل فاروق عن ادهم وملف المستقبل وجسر ما بينه والقراء \" مش كدا يا لولوه \" , اوم ايه يا بشر الاعداد الخاصه بقي تحفه وفي روايات لوحدها ياجدعان عن حرب الجواسيس وكانت قصه مسلسل العميل 1001 فيه انا قريت القصه قبل المسلسل حرقت احداثه وغتت علي اصحابي وقلتلهم علي النهايه من قبل البدايه , اما ارزاق تحفه فعلا وسمعت انهم احمتال ينزلوها مسلسل , ويا كابتن نسيت فارس الاندلس والله سكره هي شبيه لادهم بس كويسه وبحسسك بريحه الاندلس سيبك انت الروايات رائعه قليله احسن من جميس بوندولمت الشباب العربي حوليها , يبقي بقي اميلي اللي في صباره زي صبري سعادتك وبس خلاص ...."
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144128/http://masr.20at.com:80/article.php?sid=513"

[[comments]]
order = 2
subject = "سلامتك"
author = "عبدالله مفتاح"
posted = "2006-06-13"
text = "اقولها بكل وضوح وبلا تحيز او مجامله ان الدكتور احمد خالد توفيق يعد احد افضل من قرات لهم فثقافته الموسوعيه وخفة ظله الرائعه ومرونة تعبيره ورشاقه جمله وجمال تصويره كلها مؤهلات جعلت منه ملكا متوجا على عرش روايات مصريه للجيب هذا بالاضافه الى ان كتابته لا يشوبها اي اثارة للشباب ( الشباب مش عايز كده)<br />باختصار الدكتور احمد خالد توفيق اتشرف بان اعتبرهاحد اهم ينابيعي الذي استقي منه افكاري وله مني خالص التحية والتقدير والاحترام وخالص الامنيات القلبيه بدوام التقدم والرقي<br />اما د نبيل فاروق فسلسله زهور لا ارى انها نظيفه هذا عوضا عن بعض مواقف ادهم صبري التي تتخلى النظافه عن القصة<br />وهنا اسمحوا لي ان اهنئ الدكتور احمد خالد توفيق على سلسلسته النظيفه الرائعه الشيقه العبقريه ما وراء الطبيه<br />واذا كان للابداع عنوان فلن يكون سوى د احمد خالد توفيق"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144128/http://masr.20at.com:80/article.php?sid=513"

[[comments]]
order = 3
subject = "كم أحترمهم وكم أحب د/نبيل فاروق"
author = "محمد أحمد الشيخ"
posted = "2006-06-13"
text = "السلام عليكم ..<br />بالفعل يا اخي العزيز .. انت اثرت نقطة هااامة للغاية كنت اتسأل عنها منذ فترة طويلة .. اين هؤولاء من اعلامنا ؟؟!! اين هم من التكريم .. انهم يستحقون مكانة اعلامية وادبية أكثر من هذا بكثيير .. وما قلل من غضبي هو انني رأيت د/ نبيل فاروق اكثر من مرة والحمد لله في بعض البرامج التليفزيونية على اسحياء ..<br />وقد حاولت ان اتمكن من مقابلته لأصافحة ولو مره مما سيملئنا فخرا طوال حياتي<br />ونهاية .. سعدت جدا بانضمامه لموقع النشر الالكتروني Rewayty.com وكتب هو عن اعجابه بهذه الفكرة ..وأدعوكم لزيارته وأحاول لن اتواصل معه من خلاله ان شاء الله .. من يعرفه منكم يبلغه أجمل وأفضل تحياتي وسلامي :-)<br />محمد أحمد الشيخ<br />المنصورة"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144128/http://masr.20at.com:80/article.php?sid=513"

[[comments]]
order = 4
subject = "عاجبك كده ؟؟ تطلع لنا كام مليون واحد بيحبوا البلد دي ؟ ده اسمه كلام ؟؟"
author = "محمد السيد"
posted = "2006-06-13"
text = "أبدأ بالأستاذ الأكبر سناأولا ...<br />د. نبيل فاروق<br />ده جيل كامل اتربي إيده ولحسن حظي ... ولسوء حظ إخوانا البعدا إني كنت من الجيل ده .....<br />اللي أٌقدر أقوله عنه ... من غير ما أتكلم عن نفسي ... إنه بجد كان له أكبر أثر في تنمية الانتماء للبلد دي وحبها والوقوع في هواها ...<br />يمكن محاولش يدخل نفسه في سياسة حكامنا ... لكن هو قدم لنا البديل النظيف المحترم والحدق يعرف يقارن بينه وبين الموجود في حياتنا ...<br />أظن المفروض مولانا الريس ... وإخوانا البعدا يندموا مليون مرة علي إنهم سمحوا بحاجات زي دي تتنشر في عهدهم<br />يلا ... نقول إيه ؟؟؟<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144128/http://masr.20at.com:80/article.php?sid=513"

[[comments]]
order = 5
subject = "أما بقي طب المناطق الحارة..وناسه وأهله ..المصري بجد"
author = "محمد السيد"
posted = "2006-06-13"
text = "د. أحمد خالد توفيق ...<br />كل ابطاله مصريين بجد ...<br />آه والله.. ده بسهولة حتلاقيه في رفعت اسماعيل ..أو عبير ... ولا علاء عبد العظيم ...<br />الراجل ده بأحس إنه بجد مصري وعاش زينا وسط مصريين ... لا اتكلم علي رجال أعمال ولا فيلات وشاليهات ... ولا أبطاله زي حسين فهمي و مجمعين حواليهم سيدات البلد كلهم ...... ولا حاجة<br />رفعت مريض بكل أمراض الدنيا ...أي نعم كان نفسي يتجوز ماجي .. بس معلش<br />وعبير .... البنت المصرية أوي .. اللي اتجوزت عادي ..وعايشة حياتها عادي جدا بكل مشاكلها مع جوزها وابنها ..<br />وعلاء .... ده بقي اللي حكاية ...خصوصا أيام ما كان بيحب الدكتورة اللي معاه \" برنادت \" والأحلي إنه اتجوزها ...ماهو مش لازم كل حاجة تكون غم ....<br />ورواياته العالمية ..الله ينور ... الحقيقة الوحيد اللي شجعني باسلوبه في الترجمة إني أقرأ روايت عالمية ...<br />ربنا يكرمهم هم الاتنين وينفع بيهم البلد دي ... ويطلعوا لنا أجيال تاني تكون بتفهم وبتتحرك وبتتفاعل ... وبتحب البلد دي ...<br />وبرضه بتقول<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620144128/http://masr.20at.com:80/article.php?sid=513"

