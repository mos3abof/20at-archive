[[comments]]
order = 12
subject = "الاستاذ نبيل فاروق"
author = "هبة"
posted = "2006-12-01"
text = "الاستاذ نبيل فاروق بجد ياجماعة انا مشفتش اديب زى الاستاذ هو اللى علمنى يعنى اية مصر يعنى اية لازم علشان اكسب معركة لازم بالايمان والعلم ثم القوةانا الحمدلله قابلته مرة واحدة بس حسيت انى قدام اسطورة وحلم و مثل اعلى لدرجة انهم قالوا لو حد عايز يسأل يتفضل بس من كتر انبهارى مقدرتش احنا كلنا لازم نقف معاه ونسانده ونشجعه لانه فعلا الاستاذ"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216073217/http://masr.20at.com:80/article.php?sid=513&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
