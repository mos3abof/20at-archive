posted = "2006-06-29"
text = "فعلا الناس دي محدتش حقحها<br />جيل كامل من الشباب اتربوا على فنهم وادبهم<br />زرعوا فينا حاجات كتيير جميلة<br />صدقوني لولاهم مكناش دلوقتي واقفين د التيار وبنقول .. لأ..لأ..<br />كان زمنا مستسلمين لكل حاجة غلط حوالينا<br />والمثالية اللي في كتابتهم هي اللي خلتنا نحلم بمصر جميلة ونسعي لتقيقها عن طريق التغيير ...<br />بجد كلوا عقول جيل كامل واعتقد --انهم شكلزها بكل صحيح جدا--"
