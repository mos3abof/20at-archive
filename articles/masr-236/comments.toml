[[comments]]
order = 0
subject = "مجرد توضيح"
author = "مصطفى احمد"
posted = "2006-04-28"
text = "أستاذى محمد فتحى حياك الله .<br />اتفق فى كثير مما جاء فى هذا الموضوع فالتدين ليس مجرد لحية أو مظهر ولكن سلوك وعمل وأخلاق ومعاملات .<br />ولكن باختصار يمكن ان نتناقش<br />1-ارجوا عدم التبسيط فى الحالة الإسلامية فى مصر عبر العصورالمختلفة لرئساء مصر المحروسة.<br />بمعنى ان الحركة الاسلامبة ليست مجرد رد فعل مثل التعذيب من جمال واطلاقهم كالمارد من السادات ثم قتله وتمردهم فى زمن مبارك ، ولكن عليك بمراجعة ادبياتهم فى كل هذه الأزمنه المختلفة تجد أنه المبادرون المتواجدون قبل هذه الأسماء المطوحة سالفاً.<br />2- لماذ يوضع كل الحركات الإسلامية فى سلة واحدة فعل يعقل كفكر وتاريخ ان نساوى بين الأخوان والجهاد والجماعة الإسلامية والتبليغ ؟!!!<br />من يفعل ذلك أسف جدا فهو غير منصف فكل هذه الأسماء السالفة الذكر كلا له تاريخه وله مواقفه وأسلوبه .<br />3- هل يعقل لمن ينتخب فى اى موقع من المواقع يسمى استيلاء او غير ذلك بالطبع لا يعقل ذلك فضلا لم يدخل الأنتخابات سواء فى النقابات أو مجلس الشعب إلا الأخوان لرفض الجماعات الأخرى ذلك الأسلوب فى الأصل، ولكن هل نقول استلاء وأغلبية صامته وقانون 100 !!!!!!!.<br />أستاذى الفاضل لنا أن نختلف حول ما فعله الأسلامين فى مصر أو الوطن العربى ولكن علينا ان نتفق انهم فصيل له كل الحق فى ممارسة نشاطة فى المجتمع ولا يتعامل معه كملف أمنى بل سياسى ما داموا قالوا انهم مع المواطنة والديمقراطية وكل أساليب المجتمع المدنى.<br />ولكل منى كل الشكر"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904062346/http://masr.20at.com:80/article.php?sid=236"

[[comments]]
order = 1
subject = "للديمقراطية طريق آخر!"
author = "محمد صبري"
posted = "2006-04-28"
text = "ماذكرته استاذ مصطفى يجعلنى اعتقد انك ترى الديمقراطية بمنظور التصريحات المعلنة فحسب والانتصارات الانتخابية مدفوعة الاجر غالبا...<br />مادرسته فى كلية الاقتصاد ومااشاهده فى الدول الديمقراطية يجعلنى اقول:<br />1- الانتخابات ليست دليل على وجود ديمقراطية ، وهى فقط احد مؤشراتها فقط اذا كانت نزيهة ويمارس فيها الناخب مايعتقد هو ذاته انه اختياره الخاص ، اضافة الى ضرورة ايمان الناخب المطلق بإنه كفرد قادر على التغيير.<br />2- الديمقراطية ليست فلسفة تفرض فوقيا على الشعب وهى بالاساس عملية ناتجة عن علاقات بين الافراد ، وبالتالى لا ديمقراطية فى مصر الا بعد ان تحدثنى عن تعليم يلغى الانتماءات الاولية (الدين ، العرق ، القبلية ،...) ويجعل الشعب كله مؤمن بالقومية المصرية (وهذا غير موجود بدليل الفتنة) ثم يتجاوزها كأى شعب عاقل لاحقا ليلحق بركب العولمة.<br />3- الديمقراطية لاتتجزأ ابدا ابدا ابدا ، ولكن مايحدث هو انها عملية تتطور وهناك من يمكنه ايقافها دوما فالحقيقة ان هناك صراع ابدى بين المؤنين بالديمقراطية والرافضين لها حتى فى اعتى الدول الديمقراطية ...<br />4- النظام السياسى فى مصر يوصف بأنه نظام شبه سلطوى شبه ديمقراطى ، لكننا لانعرف لمن ستكون الكلمة الاخيرة لان طبيعة النظام السياسى اصلا تتوقف على الثقافة السياسية لدى المواطنين ، بمعنى:<br />ايمان الشعب بالديمقراطية هو وحده الضمان الوحيد لاستمرارها وليس الدستور او المؤسسات المتواجدة او وعود الاخوان الكلامية هم وغيرهم ايضا.<br />غير الشعب اولا وانظر الى اى اتجاه يسير ثم يمكنك ان تحدد مستقبل مصر بصورة صحيحة.<br />لكن كمعلومة تاريخية سليمة فإن :اللحظات التى يجتمع فيها الدين والسياسة تعنى انهيار المجتمع + كلما زادت مساحة المحرمات ينهار المجتمع<br />هذا مايخبرنا به علم السياسة واستقراء<br />اقرأ بقية التعليق .."
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904062346/http://masr.20at.com:80/article.php?sid=236"

