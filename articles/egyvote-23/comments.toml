[[comments]]
order = 2
subject = "انها فرصتهم الحقيقيه"
author = "عمر"
posted = "2005-11-17"
text = "ستحقون الفوز لأنهم الاكثر تنظيما الأكثر انتشارا ويقدمون انفسهم علي انهم البديل الاصلح في الاخلاق وهي الصفه المنعدمه في الوطني ويرون انهامشكلة مصر ولكن ليس لديهم اي برنامج سياسي مفصل مقنع والمبادره اعتقد انهالاتقدم حلول عمليه ويجب ان يطورا ادائهم بشكل جديد تماما عن قوالبهم و اكلشيهاتم القديمه ويسوقون افكارهم بشكل مقنع وعملي وان يتخلوا عن كلام انهم الاقوي حتي لا يكثروا من المعارضين لهم او الرافضين لهم اذا كان شعار المشاركه لا المغالبه صحيحاواذا كان البرلمان هو احد الوسائل للتمكين للدعوه الي الله وليس استعراض القوة وان يكونوا اكثر ديمقراطيه داخل الجماعه اذا كانوايريدون ان يقتنع بهم الناس واذا كانو يريدون ان يشاركهم الناس فرحتهم ويدعمونهم وياايها الاخوان المسلمون لاتخذلوا الناس وتذكروا يوم حنين"
archived = "2006-10-10"
capture_url = "https://web.archive.org/web/20061010034523/http://egyvote.20at.com:80/article.php?sid=23"

[[comments]]
order = 3
subject = "مش أول مرة الوطني يشتكي ولا حاجة!!"
author = "إسلام لطفي"
posted = "2005-11-19"
text = "لموضوع كويس يا براء بس مكبوس شويتين , عيني تعبت في قرايته . . وده أول هام على رأي العمدة سليمان غانم<br />تاني حاجة مش أول مرة الحزب الوطني يشتكي!! مستغرب وعايز تعرف أشتكى امتى؟ اول مرة الحزب يشتكي من الشعار اللي بيشكل له كابوس كان في انتخابات 1987 وساعتها كان الموضوع جديد وسخن وفضلت المحاكم تشهد صولات وجولات لحد ما وصل الأمر للمحكمة الدستورية اللي حكمت في 1990 بدستورية الشعار وعدم منافاتها لمباديء ثورة يوليو أو دعائم الوحدة الوطنية.<br />ومن ساعتها يا عم براء والحزب الامؤاخذة الوطني بيرفع قضية كل انتخابات ويخسرها<br />خسرها في 87 و2000 و2005 . . شفت غباء أكتر من كده!!!!!!!!<br />سيبك انت الإخوان قادمووووووووووون"
archived = "2006-10-10"
capture_url = "https://web.archive.org/web/20061010034523/http://egyvote.20at.com:80/article.php?sid=23"
