posted = "2006-07-04"
text = "ياما قالوا وننزل الشارع نلاقي حاجه تانيه خالص يعني مثلا في الإنتخابات اللي فاتت قالوإن الجماعه إياهاجايبه بلطجيه بدقون ولمانزلنالقنالحزب الثني هواللي جايب الخلاصه لوكانت الحكومه بتفهم كان زمنا مدحوك علينا ومكيفين وحناطالع عنينه"
archived = "2006-09-06"
