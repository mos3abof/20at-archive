[[comments]]
order = 5
subject = "برافو عليك يا خربوش"
author = "محرم"
posted = "2006-06-05"
text = "موافق تماما مع الأستاذ خربوش<br />معظم اللى بيتكلموا عن الاسلام ما يعرفوش عن الاسلام غير الظواهرى و بن لادن و فيلم الارهابى<br />للأسف مش عاوزين يتعبوا نفسهم و يدرسوا دينهم<br />حسبى الله و نعم الوكيل"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044042/http://masr.20at.com:80/article.php?sid=429&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

