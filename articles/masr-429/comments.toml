[[comments]]
order = 1
subject = "تناقض معاليه"
author = "سعيد أحمد شعبان"
posted = "2006-06-02"
text = "اود أن اسجل اعجابى بقلم الاستاذ عمرو الشوبكى اولا ,ثم اسجل اندهاشى من كلام الدكتور نظيف .معاليه ادلى بتصريح من قبل قال فيه ان الشعب المصرى غير ناضج سياسيا ثم يأتى ويقول ان مصر دولة علمانية ,وهنا التناقض وهوان يكون هناك شعب امى ,غير ناضج,صغير على الديموقراطية يعرف معنى كلمة علمانية اصلا .وارى ان الباشمهندس نظيف اراد ان يظهر الولاء لمنتدى دافوس ومناصريه وهم انصار العولمة الجائرة والعلمانية الشاملة."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044042/http://masr.20at.com:80/article.php?sid=429&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "يااااااااااا بق ع الفاضي"
author = "الاستاذشيكو"
posted = "2006-06-03"
text = "اللي مش نضيف عمال يعك الدنيا وهو مش فاهم حاجه خالص<br />ياا جماعه ده راجل بتاع تليفونات وخلاص ودكتور في المعلومات يعني بتاع نميمه وكلام ع الفاضي<br />وذا كان فيه وصف كويس للحاله اللي عاليها البلد بتاعتنا بوصوا ع اللي مش نضيف بيقول ايه واذا حد فهم منه اي حاجه يبقه يفهمني ويتصل بيه ع 009009009"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044042/http://masr.20at.com:80/article.php?sid=429&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "حسبي الله ونعم الوكيل"
author = "خربوش"
posted = "2006-06-04"
text = "حسبي الله ونعم الوكيل فيك يا سيد عمرو ...وفي كل العلمانيين اللي بقوا مدنيين ومش علمانيين...يا عالم الله يكرمكم اقروا في الدين كويس قبل ماتهاجموه وقبل ماتحكموا علي الاسلام بانه تخلف ورجعيه ومعاداة لحرية الفكر..مين اللي قال ان الاخوان المسلمين هم الاسلام؟؟ومين اللي قال ان التقدم والنهضة في العلمانيه او المدنيه عشان الاستاذ عمرو مايزعلش..ياكل مثقفين مصر ..بالله عليكم اتصالحوا مع الاسلام ..اقروا فيه كويس ..حاولو تعرفوه زي ماانتم عارفين الفرق بين التجربة السوفيتيه والتجربة الصينيه ...بالله عليكم تاني اتصالحوا مع الاسلام او يبقي حسبي الله ونعم الوكيل فيكم كلكم!!!!"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906044042/http://masr.20at.com:80/article.php?sid=429&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

