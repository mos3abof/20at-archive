author = "من أرض القطيف"
posted = "2009-05-10"
text = "والله حرام إلي اسونه والكلام المكتوب هذا قليل<br />من فوق الضرب والإهانة<br />في كثير اغتصابات وقتل<br />صحيح في خادمات تسرق وتهرب<br />وتتعامل بالسحر<br />وهم في ناس تظلم وتغتصب<br />والسلطات ماتدري عن شيء لأن الخادمة محبوسة في البيت مينفع إلا الهرب"
