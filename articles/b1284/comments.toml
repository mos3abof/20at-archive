[[comments]]
order = 0
subject = "جمال البنا والاساءات"
author = "معاذ محمود عامر"
posted = "2006-09-28"
text = "أعتقد يا عشرينات انه كان يجب عليكم من باب الدقة والامانة أن تنشروا آخر مقالين كتبهماالمفكر الاسلامي الأستاذ جمال البنا الأربعاء السابق واربعاء الأمس...<br />فبما أنكم قررتم ان تنشروا مقاله المثير للجدل عن التدخين والصيام, كان يجب أن تكملوا السلسلة المتعلقة بهذا الموضوع...<br />وأعتقد أنه تعرض لكثير من الاهانات على لسان بعض العصبيين أو المتشددين....<br />وأظن أن مقاله الذي كتبه الاربعاء قبل السابق كان جديرا بأن يدفع عنه كثيرا من هذه الاهانات السفيهة التي لا يحكم أصحابها عقولهم قبل أن يطلقوها في وجه رجل جليل ومفكر كبير وصاحب مشروع فكري جيد جدا,<br />وان لم يكن كل ذلك فعلى الأقل هو كبير في السن بدرجة تجعل اهانته من الفحش والسب الذي نهى عنه الرسول صلى الله عليه وسلم,<br />لذا أرجو منكم رجاء حارا جدا جدا أن تنشروا مقالتيه المؤرختين27_9<br />و20_9<br />ولكم الشكر العظيم والاحترام الجم ان فعلتم..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131653/http://www.20at.com/article2.php?sid=1284"

[[comments]]
order = 1
subject = "رمضان جانا"
author = "مروة الابياوى"
posted = "2006-09-29"
text = "اشكرك على متابعتك لرمضان فى اول يوم عشان انا مش قادره اتابعه عشان التراويح وقراءة القران وبرافو عليكى يادعاءانك عرفتى مضمون المسلسلات من اول يوم ده عاوز مشاهد ملم باجداث تاريخيه وخلفيه عن مايدور حوله المسلسلات بس اوعى تتابعى تانى طول اليوم والا هيكون رمضان عندك شهر المتابعه والمشاهده ومش شهر صيام وبجد الموضوع حلو اوى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131653/http://www.20at.com/article2.php?sid=1284"

[[comments]]
order = 2
subject = "كفى!"
author = "قلم جاف"
posted = "2006-10-07"
text = "أسلوب إرسال عدة تعليقات متتالية بهذه الطريقة ما لم يكن بالخطأ هو سوء سلوك في عرف الإنترنت.. هذا أولاً..<br />ثانياً.. لك أن تعتقد أن جمال البنا مفكر إسلامي كبير ، ولي أن أعتقد أن جمال البنا لا هو صاحب مشروع ولا سوبر ماركو،ولا هو كبير ولا هو مفكر ولا يوجد شيء أصلاً اسمه مفكر إسلامي ، وإنما هذا اللقب هو مجرد ضحك على الذقون ابتكرته بعض وسائل الإعلام لخلق \"شخصيات\" تقوم بدور الشيوخ وتنافسهم في احتكار الدين وتفسيره لحسابهم الخاص..<br />هذا العبقري في جريدة الوطني اليوم في تعليقه على تعليق مثير للجدل لمفتي الديار في مسألة الانتخابات نشر قبل أشهر يصف مجلس الشعب - عموماً - بأنه ليس سلطة تشريعية!..أمر يسهل جداً على أي راسب في السنة الأولى لكلية الحقوق أن يرد عليه بالحجة والبرهان.. وفي السابق افترض (رداًعلى مقال للأستاذ الكبير يحيى الجمل) على هامش انتخابات الرئاسة العام الماضي حلاً نسبه - وبغرابة شديدة - للفقه الإسلامي في مسألة اختيار رئيس الجمهورية .. ونسي سيادته أنه لا القرآن ولا السنة تضمنا طريقة أو حلاً مناسباً لاختيار رئيس الجمهورية أو ولي الأمر لأنه شأن دنيوي متروك للمسلمين في ظل ظروفهم السياسية والاجتماعية والاقتصادية .. والمدهش أنه يقول أن الذي يحلل ويحرم هو الله ، ثم هو يبتكر \"ملاحق\" للفقه الإسلامي على طريقته الخاصة!<br />إذا لم تجد ما تفعله فعلاً ، لن أقول لك خذ ورقة كرتون واثنهاوارسم عليها وقسها.. بل أطلق على نفسك لقب مفكر إسلامي ،وتأكد أنه إذا كنت في مصر فمحدش حياخد باله ..<br />ويووووه يوووووه يووووووه هو فيه حد النهاردة بيفتكر .. على رأي سعيد صالح نقلاً عن وردة!<br />وإن كنت تعتقد يا أستاذ معاذ أن كل من ينتقد أو يختلف مع السيد المحترم جمال البنا كذا وكذا فهذا شأنك.. فالسيد المحترم لا يحب النقاش شأنه شأن معظم \"المسكفين\" في بلادنا .. بيطالبوا بالديمقراطية وهمة أسوأ من أسوأ ديكتاتور.. كلهم أقطاي!<br />أما عن المسلسلات فأكتفي بأن التكالب على عرض المسلسلات على القنوات الأرضية في مصر إن يكشف عن شيء فهو يكشف عن فشل التليفزيون المصري في جذب المشاهدين طوال الأحد عشر شهراً الباقية من العام ، ولا يعقل أن تنفق ملايين لأجل مسلسلات يفترض عرضها في ساعات محدودة جداً من اليوم!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131653/http://www.20at.com/article2.php?sid=1284"
