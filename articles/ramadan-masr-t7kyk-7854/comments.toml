text = "انتخابات اية ؟ هى كانت فين ؟<br />يا حبيبى انت وهو احنا مش فى زمن الاشتراكية والمساكن الشعبية والبلوكات والشقق ام 8 جنية ايجار<br />احنا فى عصر السوق المفتوح - يعنى اية سوق مفتوح او السوق الحر او الاقتصاد الحر - يعنى اللى معاة ياخد ممعهش فلوس يحل عن نافوخنا مفيش حاجة ببلاش<br />انتم عايزين تنهبوا الحكومة - اية القرف دة<br />بتتحجوا بالانتخابات والكلام اياة -دة ما ينفعش فى الاقتصاد<br />الحكومة بتبنى بناية -يبقى لازم لها مكسب - انما تفرق بلوشى - دة شغل جهل<br />عالم هم"
