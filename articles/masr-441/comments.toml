subject = "احزاب ورا احزاب 000 بنجرى ورا حلمنا"
author = "الاستاذشيكو"
posted = "2006-06-03"
text = "يا عمنا الاحزاب اللي هاتتعمل في مصر لازم تكون احزاب شعبيه0000 مش الي يقرر يعملها ويدلها التصريح بتاعها صف صف بيه بياع مجلس الشورى ولا ايه؟؟؟!!!!<br />وانا عن نفسي هانضم الي حزب الوسط اللي كان هايتوافق عليه عشان ابو العلا ماضي انشق عن الاخوان وحب يبين للناس ان الحكومه بتتكلم بس فقال نعمل حزب مستوفي الشروط الحوميه زى الحكومه ماهى عايزة ولكن الحومه كانت مفكرة ان ده كلام من ابو العلا ماضي 0000<br />وبعدين قالوا انه عايز يمكن للاخوان بس بطريق تاني وغيرة من المبررات الخايبه للحكومه الخايبه طول عمرها"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211220/http://masr.20at.com:80/article.php?sid=441&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "الغدوبس"
author = "عاشق الغد"
posted = "2006-06-03"
text = "احزاب اية تانى مش كفاية الخيبة الحناء فيها بعد العملتوة الدولة مع اقوى حزب فى مصر بجد كلة شباب بيحب مصر وبيحب زعيم الحزب ايمن نور مين كان بيدافع عن المصرين الغلابة غير ايمن نور مين اتكلم على رغيف العيش والبطالة واحوال شعب مصر الغلبان غير ايمن نور علشان كدة احناء اعضاء فى الغد لن نترك ايمن نور ولن يكون هناك حزب يحقق احلام المصرين غير الغد الغد فين الاحزاب الورقية التى كانت تهاجم الغد وايمن نور من باب الحقد ان الغد هو الحزب المعارض الحقيقى فى مصر والدليل اغلب الذينة تم اعتقالهم دفاعا عن الحرية وعن القضاة والصحافين من حزب الغد لقد احب ايمن نور مصر فاحب ابناءمصر ايمن نور اين الاقصرى حزبة اسمة اية ونبى مافاكر ولاعم ابو طربوش وتركى ولا شلتوت احزب لا نعرف غير اسماء رئيس الحزب بالعافية الحرية لايمن نور وحزب الغد الغد الغد الغد الغد الغد"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211220/http://masr.20at.com:80/article.php?sid=441&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

