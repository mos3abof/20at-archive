text = "عن فضل القرآن وأهله، حُفّاظِه وقارئيه<br />أرجو أن تنال إعجابكم، وأن يجعلها الله في ميزان حسنات كاتبها وناقلها:<br />حُروفُ النور<br />أَكْـرِمْ بقـومٍ أَكْرَمُـوا القُرآنـا<br />وَهَبُـوا لَـهُ الأرواحَ والأَبْـدَانـا<br />قومٌ.. قد اختـارَ الإلـهُ قلوبَهُـمْ<br />لِتَصِيرَ مِنْ غَرْسِ الهُـدى بُسْتَانـا<br />زُرِعَتْ حُروفُ النورِ.. بينَ شِفَاهِهِمْ<br />فَتَضَوَّعَتْ مِسْكـاً يَفِيـضُ بَيَانَـا<br />رَفَعُوا كِتابَ اللهِ فـوقَ رُؤوسِهِـمْ<br />لِيَكُونَ نُوراً في الظـلامِ… فَكَانـا<br />سُبحانَ مَنْ وَهَبَ الأُجورَ لأهْلِهَـا<br />وَهَدى القُلُوبَ وَعَلَّـمَ الإنسانـا<br />يا ختمةَ القـرآنِ جئـتِ عظيمـةً<br />بِجُهُـودِ قَـوْمٍ ثَبَّتُـوا الأركانـا<br />بَدْءاً مِـنَ (الكُتَّـابِ)، أَوَّلِ نَبْتَـةٍ<br />غُرِسَتْ، فأَثْمَرَ عُوْدُهَـا فُرْسَانـا<br />حَمَلُوا على أكتافِهِـمْ أحلامَهُـمْ<br />يَبْنُـونَ صَرْحـاً بِالتُّقَـى مُزْدَانـا<br />لَبِنَاتُهُ اكتملـت بحفـظِ كتابِهـم<br />كَالنُّورِ حِينَ يُتِـمُّ بَـدْرَ سَمَانـا<br />يا ختمة القرآن أهـلاً.. مَرْحَبـاً<br />آنَ الأوَانُ لِتُكْمِـلـي البُنْيَـانـا<br />جُهْدٌ تَنُوءُ بِـهِ الجبـالُ تَصَدُّعـاً<br />وَتَفيـضُ مِنْـهُ قُلُوبُنَـا عِرْفَانـا<br />مِنْ كُلِّ صَوْبٍ جاءَ قَلْـبٌ خَافِـقٌ<br />يَسْتَعْـذِبُ التَّرْتيـلَ والإتقـانـا<br />غُرَبَاءُ مِنْ كُلِّ البِقَـاعِ تَجَمَّعُـوا<br />هَجَرُوا الدِّيَارَ وَوَدَّعُـوا الأَوْطَانـا<br />غُرَبَاءُ لَكِنْ قَـدْ تآلَـفَ جَمْعُهُـمْ<br />صَـارُوا بِنِعْمَـةِ رَبِّهِـمْ إِخْوَانـا<br />يَا رَبِّ أَكْرِمْ مَـنْ يَعيـشُ حَيَاتَـهُ<br />لِكِتَابِـكَ الوَضَّـاءِ لا يَتَـوَانـى<br />يَا مُنْزِلَ الوَحْـيِ الْمُبِيـنِ تَفَضُّـلاً<br />نَدْعُوكَ فَاقْبَلْ يَـا كَرِيـمُ دُعَانـا<br />اجْعِلْ كِتَابَـكَ بَيْنَنَـا نُـوراً لنـا<br />أَصْلِحْ بِهِ مَـا سَـاءَ مِـنْ دُنْيَانـا<br />واحْفَظْ بِهِ الأوطانَ، واجمعْ شملَنـا<br />فَالشَّمْلُ مُـزِّقَ، وَالْهَـوَى أَعْيَانـا<br />وانصُرْ بِهِ قَوْمـاً تَسِيـلُ دِمَاؤهُـمْ<br />فِي القُدْسِ.. في بَغْدادَ.. في لُبْنَانـا"
