[[comments]]
order = 1
subject = "كدبه من عضو مجلس شعب"
author = "بنت طنطا"
posted = "2006-12-26"
text = "انا من مدينه طنطا حيث اقام النائب احمد شوبيربعمل حفل لقرعه الحج وفى هذه القرعه قام بتوزيع تسع تأشيرات للحج وكان والدى من ضمن هؤلاء الذين اختارهم احمد شوبير ولم يوفى الكابتن بوعده الذى وعد به امام الحاضرين يوم الحفل حيث لم يعطى التأشيره لوالدى بعد ان استعد للحج هذا العام وهنئه الاهل والاصحاب ولكن كانت الصدمه الكبرى حيث لم يعطيه الكابتن التأشيره التى وعدنا بها فى الحفله والله على مااقول شهيد<br />يارب كلامى يوصل الى من يهمه الامر ويريد تحقيق العداله"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104070711/http://masr.20at.com:80/article.php?sid=1312"

[[comments]]
order = 2
subject = "ادعو معايا"
author = "بنت طنطا"
posted = "2006-12-26"
text = "انا عايزه كل اللى يقرأالتعليق السابق يدعو ان يصل الى من يهمه الامر وبالمناسبه انا عندى شهودكثيره كانو حاضرين القرعه اللى لم يوفى الكابتن احمد شوبير بما قاله فيها"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104070711/http://masr.20at.com:80/article.php?sid=1312"

[[comments]]
order = 3
subject = "هما دول نواب الحزب الوطنى"
author = "ابن طنطا"
posted = "2006-12-26"
text = "هما دول نواب الحزب الوطنى تلاقيه باعها زى معظم زمايله فى الحزب شكراً لنواب الإخوان الى كشفوهم لأن التاشيرات طول عمرها كانت بتتباع ومحدش يعرف عنها حاجة والناس معرفتس إلا لما نواب الإخوان عملوا القرعة العلنية"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104070711/http://masr.20at.com:80/article.php?sid=1312"

[[comments]]
order = 4
subject = "يعنى ايه شعب"
author = "ايمن امام"
posted = "2006-12-27"
text = "مقاله جميله وبها احصائيه رائعه اسمحى لى ان استعير مجهودك فيها - واستعملها فى عملى - لكن وانا اقراء مقالك سألت نفسى سؤال يعنى ايه شعب- وانتى تعرفين ان الشله الحاكمه فى الفتره الاخيره اصبحت تهاجم الاختيار الشعبى تاره بأن هذا الشعب عاطفى( يعنى عبيط )وتاره اخرى بأن هناك مجموعه تسمى النخبه او الصفوه هى التى لها الحق فى التمثيل النيابى والباقى رعاع لايصح ان يمارسوا هذا الدور -ارجو ان تفسرى لنا معنى كلمه نخبه ومعنى كلمه صفوه ومعنى كلمه مثقف ومعنى كلمه تنوير - لاننى دائما ما اسمعهم يترددون بكثره هذه الايام - ايمن امام- اه نسيت اقولك كل سنه وانتى طيبه - ياترى هاتدبحو خروف السنه دى ولا ها يقولولك ان دا - مخالف لميثاق الرفق بالحيوان - كل سنه وانتى طيبه- ايمن امام"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104070711/http://masr.20at.com:80/article.php?sid=1312"

[[comments]]
order = 5
subject = "هما دول الاعضاء"
author = "بسمة"
posted = "2006-12-31"
text = "يا بنت طنطا العيب فينا لاننا ما نتعلمش وساكتين شوبير ده نموذج للنفاق و الوصولية والالبتزاز واساسا نجاحه في الانتخابات دليل علي اننا ما بنعرفش نختار واحمدى ربنا لان ربنا سبحانه اكيد كاتب لوالدك حجه نظيفة لان اعتقد لوكانت جت عن طريق هذة العصابات كانت ها تكون غير مقبولة الناس دى ما ينفعلهاش حج"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104070711/http://masr.20at.com:80/article.php?sid=1312"

[[comments]]
order = 6
subject = "البؤساء في الارض"
author = "واحد من البؤساء"
posted = "2007-01-09"
text = "الكابتن احمد شوبير حاصل علي الرقم القياسي العالمي الكوكبي المجري ( نسبة للمجرة) في عدد المناصب التي يشغلها فرد فهل معقول انه فاضي اصلا للجمهور يسمع شكواه . و علي فكره لكم في احمد شوبير المثل في قمة النفاق و الوصولية"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112194846/http://masr.20at.com:80/article.php?sid=1312"
