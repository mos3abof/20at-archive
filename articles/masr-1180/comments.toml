subject = "الى ابن بهية"
author = "بصراحة يا ابن بهية من حسني مبارك اللي واطي."
posted = "2006-11-20"
text = "اقتحام الموضوعات بهذه الصورة هو اللي اسلوب واطي<br />وكتابة تعليقات تخالف الموضوع اسبوع واطي ايضا.<br />اهو حسني مبارك بيعمل زيك كده بياخد حاجه من حقه."
