order = 0
subject = "في موريتانيا (فــال) حلو خالص"
author = "إبن بهية"
posted = "2006-11-19"
text = "أستغرب من قلة التغطية الإعلامية لموضوع الانتخابات البلدية الموريتانية رغم خطورة الموضوع .. فهو ربما يكون حلقة (بايلوت) في مسلسل التغيير العربي والإسلامي .. بروفة يعني .. آه لو نجحت تجربة إخواننا الموريتانيين وأتت بحكم ديموقراطي محترم سيكون بكل تأكيد (فال كويس أوي أوي) .. أقصد الإثنين كويسين طبعاً رئيس الحركة العسكرية (المباركة حتى اليوم) العقيد علي ولد محمد فال ، وبرضه فال كويس أوي أوي (من باب الفأل الحسن) لينا في مصر لو أكرمنا ربنا بحفنة عسكر تسري في عروقهم دماء حارة وانتزعوا البلد من براثن النظام الحاكم بأمر مش عارف مين .. تعلمنا قديماً أن الانقلابات والحركات العسكرية في أي بلد في العالم تأتي كنتيجة منطقية لجملة من الأسباب .. تتوفر كل هذه الأسباب في بلدنا الحبيب مصر منذ أكثر من ثلاثين عاماً ويزداد تركيزها كل يوم حتى باتت معتقة جداً لدرجة شديدة المرارة وشديدة العطن والعفن ..<br />لقد أعياني البحث كثيراً في سر عدم قيام أي حركة عسكرية انقلابية في مصر حتى الآن برغم كل ما تعانيه من آلام ومشكلات داخلية وخارجية بسبب ذلك النظام البغيض ؟؟؟ مليارات المليارات تنهب كل يوم وأهل مصر تقطعت بهم السبل في شتى بقاع الأرض طلباً للقمة العيش التي قلما يجدوها ويلعقون كرامتهم اتقاء عضة الجوع التي لا ترحم .. وفي المقابل تجد القطط السمان تزداد تخمة ورفاهية تصل إلى أبعد حدود السفه التي يمكن معها أن يصل مصروف قطيط صغير (قطقوط صغنن) إلى ما يوازي مصروف حي كامل من أحياء القاهرة الفقيرة .. دماء المصريين باتت مهدرة بعد أن أهدرت كرامته وأمسى لا قيمة له ولا ثمن يذكر ..<br />يموت المصريون يومياً في البر والبحر والجو بلا ثمن ولا مسائلة حتى من باب تكريم الإنسان .. يموتون على الإسفلت من جراء سرقة ونهب مليارات مخصصة<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085716/http://masr.20at.com:80/article.php?sid=1180"

[[comments]]
order = 1
subject = "شفتوا بقى إننا محتاجين فال حلو عندنا زي موريتانيا ازاي"
author = "إبن بهية"
posted = "2006-11-19"
text = "أعتذر بداية عن نشر موضوع انتخابات موريتانيا في معظم الموضوعات ولكن السبب كما تعلمون أيها الإخوة أن إعلامنا المعفن من ريحة الأشكال الوسخة اللي كوموها فيه زي الزبالة من مخبري لاظوغلي أمثا ل عبدالله كما وريسه المعفن في روزاليوسف اللي نسيت اسمه لأنه نكره وتافه والدقاق في دار الهلال وكل الألاديش وأكوام القمامة دي .. أقول أن إعلامنا أهمل تماماً هذا الموضوع على أهميته وخطورته لأنه كما أتمنى وتشاركوني بكل تأكيد أمنيتي أن تكون بروفة يمكن تطبيقها في مصر .. طبعا سيضحك من يضحك ويقول ياه .. إبن بهية اتجنن ... آدي اللي ناقص .. نتعلم من موريتانيا .. راح أقولك إهدا كده وخليك عاقل وشوف حسني مبارك الواطي وصلنا فين ... يا بني احنا بكره راح نودي عيالنا يتعلموا في موزمبيق .. احنا بقينا في ديل الدنيا يا طيب .. المهم مش عايز أطول عليكم بس كنت باتمى على أولاد البلد يفردوا صفحة واحدة لموريتانيا وتجربتها الجميلة التي قام بها فال .. هي جميلة حتى اللحظة .. يا عالم ربك يستر ..<br />شكرا يا أولاد البلد على هذا الموضوع الرائع .. ربنا يستر وما يحاربوش المشروع ده كمان .. لأنهم عندهم حساسية من عمرو خال تحديداً بسبب قبوله الجماهيري الواسع وده كلام مش مسموح بيه نوهائيا في بلدنا .. اواي يعني يلتف حواليه الشباب كده ويتدينوا كمان ؟؟؟ وده معقول ؟؟؟ ده ممكن كمان يبقوا شباب كويس وصالح بعد كده ويبطل قعدة القهاوي والتسكع في الشوارع والتحرش .. ياه دي تبقى مصيبة ... طبعا مصيبة لأن الشباب الصالح البناء (مش بتاع الهشك بشك من أي طيف سياسي) راح يقول زي هاني رمزي عايز حقي .. يا دي النيلة .. حقه إيه ده كمان ؟؟؟ لأ يا عم كبر كبر .. شيلوا عمرو خالد .. امنعوه من أي نشاط .. عاجبه يرجع الخلاط ويبقى صباع كفته زي الباقيين أهلا بيه .. مش<br />اقرأ بقية التعليق .."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085716/http://masr.20at.com:80/article.php?sid=1180"

