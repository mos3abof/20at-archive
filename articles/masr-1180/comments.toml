[[comments]]
order = 3
subject = "مشروع الاوت ريتش- المرحلة الثانية"
author = "سارة بدران"
posted = "2006-11-20"
text = "تعليقا علي مقال مصطفي هاشم اردت ان اشارككم معي في التعرف علي المرحلة الثانية من مشروع حماة المستقبل, هي مرحلة الاوت ريتش- outreach ان شاء الله ستتم في فبراير القادم, و سوف يقوم فيها فريق سمابجذب عدد من مدمنين الجامعات, و تشجيعهم علي العلاج, كما انه سيتم تدريب 20 متدرب لمساندة المرضي نفسيا. وان شاء الله سيتولي مسانداتنا مديا راعي من شركات مصر الكبري. امانة لكل من يقراء هذا التعليق ان يدعوا الله لنا ان يوفقنا لما يحب الله و يرضي."
archived = "2006-11-21"
capture_url = "https://web.archive.org/web/20061121085716/http://masr.20at.com:80/article.php?sid=1180"
