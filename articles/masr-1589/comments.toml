[[comments]]
order = 5
subject = "حب ايه؟!"
author = "واحد وخلاص"
posted = "2007-02-14"
text = "حب ايه اللي أنت جاي تقول عليه؟<br />أنت عارف قبله معنى الحب ايه؟<br />وعلى رأي الشاعر<br />حبيبي واقف في البلكونة وبربوره مدلدل<br />قلت له نزل بربور المحبة حبة قال لي ما هو مدلدل<br />جيت أطلع على بربور المحبة غدر بي وعمل \"سنيف\" وقعت مشتنكل!"
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216004005/http://masr.20at.com:80/article.php?sid=1589"

