[[comments]]
order = 2
subject = "ياست دعاء"
author = "زهرة الرمان"
posted = "2007-02-13"
text = "بتتكلمى عن عيد حب ؟<br />حب اية واحنا عندنا حالة اكتئاب عامة<br />حب اية واحنا عندنا اطفال شوارع<br />وورد اية ودبدوب مين وفية ايتام وارامل مش لا قيين الاكل<br />اكتبى للناس الاغنياء يبنوا فصول زيادة فى المدارس<br />يتبرعوا بسراير وملايات لمستشفيات الغلابة اللى ما فيهاش دواء<br />يعملوا ملاجىء ودور ايواء للمشردين والعجزة والاطفال المعاقين<br />دول الخليج بتعلم اولادها ان الامية فى العالم العربى موجودة فى مصر والسودان<br />عيد حب اية هو احنا اصبحنا غربيين عندنا فوائض مالية مش عارفين نعمل بيها اية<br />يااهل الخير تبرعوا للمستشفيات والمدارس التى تخص الفقراء<br />فلم يعد على العظم لحم<br />وليرعانا اللة"
archived = "2007-02-16"
capture_url = "https://web.archive.org/web/20070216004005/http://masr.20at.com:80/article.php?sid=1589"

