subject = ""
author = "هند بنت عتبه"
posted = "2009-09-16"
text = "المرأة التي قالت وهل تزني الحرة يا رسول الله<br />اسمها هند بنت عتبه ام معاوية ابن ابي سفيان<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــ<br />لكن دلوقتي على ما يبدو انقلبت الامور<br />الحرة وبنت الاكابر هي التي تزني<br />اما الفقيره المعدمه هي التي تحافظ على شرفها على ما يبدو"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923221226/http://www.20at.com:80/masr/2khbar/13463-2009-09-16-05-35-57.html"

[[comments]]
order = 1
subject = ""
author = "هل تزنى الحرة ؟"
posted = "2009-09-16"
text = "فى رواية ان الرسول علية السلام كان يعظ النساء ويطلب منهم ان يتعففواولا يزنين<br />فردت علية امراة من قريش لا اذكر اسمها - قالت<br />يا رسول اللة وهل تزنى الحرة ؟<br />فيا معشر الشباب<br />عليكم ببنات الاسر الطيبة ذات الاصل الطيب والتى لها كرامة تحافظ عليها"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923221226/http://www.20at.com:80/masr/2khbar/13463-2009-09-16-05-35-57.html"

[[comments]]
order = 2
subject = ""
author = "الى الشباب"
posted = "2009-09-16"
text = "اللي يتجوز منكم مش لازم يهتم بهذا الموضوع كثيرا<br />موضوع فض غشاء البكاره<br />اسال عن البنت كويس قبل ما تتقدم واتأكد انا بنت كويسه وبنت ناس كويسين وخلاص<br />وتأكد تماما ان الله [ *** ] لا ينكحها الا زان او مشرك<br />فزي ما انت كنت عايش ربنا لازم حيرزقك بواحدة مثلك<br />يعني لو انت مستقيم لازم ربنا حيجوزك واحدة مستقيمه<br />ولو انت ماشي بطال لازم حتقع في واحدة مثلك تماما<br />والجزاء من جنس العمل"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923221226/http://www.20at.com:80/masr/2khbar/13463-2009-09-16-05-35-57.html"

[[comments]]
order = 3
subject = ""
author = "منصور"
posted = "2009-09-16"
text = "يعنى هتقطعوا اكل عيش الدكاترة ومش هيعرفوا يبنوا العمارات<br />اللة يخرب بيت ام الصين"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923221226/http://www.20at.com:80/masr/2khbar/13463-2009-09-16-05-35-57.html"

[[comments]]
order = 4
subject = ""
author = "ابن المرقعة"
posted = "2009-09-16"
text = "على كدة فية ناس كتير هيبقوا ولاد مرقعة بصحيح<br />وبعدين تعال انت وهو<br />ما هو فية حاجات كتير قوى فى الشعب مرقعة هى جت على دى<br />فية ترقيع فى السياسة وترقيع فى الاحتكار وترقيع فى الحكومة<br />وبناء علية اقترح عمل لجنة فى كل حزب اسمها لجنة سياسات الترقيع"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923221226/http://www.20at.com:80/masr/2khbar/13463-2009-09-16-05-35-57.html"

[[comments]]
order = 5
subject = ""
author = "الولاعة"
posted = "2009-09-16"
text = "اللة يرحم يوسف وهبى لما قال شرف البنت زى عود الكبريت ما يولعش الا مرة واحدة<br />دلوقتى تقدر تقول ان شرف البنت زى الولاعة بيولع كل يوم عشرين مرة<br />واغشية البكارة الصينى عبارة عن بالون صغير جديد رقيق الجلد مملوء بالدم بضع نقط من الدم تلصقة المراة داخل الفرج وعند ملامسة الذكر لة يتمزق وتنزل نقط الدم<br />وقد جربة بعض الازواج على سبيل المزاح والمرح وهم ياتون بة من بعض دول الخليج ودبى بالذات ويستخدم فى الاحتفال باعياد الزواج وكان الزوجة لازالت عذراء مع زوجها<br />وهو يباع بسعر 300 جنية حاليا"
archived = "2009-09-23"
capture_url = "https://web.archive.org/web/20090923221226/http://www.20at.com:80/masr/2khbar/13463-2009-09-16-05-35-57.html"

