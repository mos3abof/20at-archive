[[comments]]
order = 7
subject = "أنا من ها البد"
author = "أنا اللى عيش عندهم"
posted = "2006-05-02"
text = "يا مصر يا أرضنا<br />فيكى الحرامي والخبيث<br />فيكى اللئيم والبلطجى<br />وصديق شارون<br />وحبيب وبوش<br />والكل راكب ظهرنا<br />والشعب مسكين منكسر<br />م الفجر واقف في الطابور<br />طوابير كثيرة<br />عا الفول وياخد حصته<br />والعيش مفيش<br />ورغيفه معجون بالنكد<br />والهم مزروع في الطريق<br />والشوك كمان<br />ومفيش ركوبة توصله<br />وكلاب سوادها كالظلام<br />أعداد كثيرة<br />في كل ركن من البلد<br />مشيا ببتلهث يا ولد<br />اوعاك في يوم تعترض<br />على....... كلب مسعور<br />ينهشك<br />والعمده يبنى في السرايا<br />يرعى مصالح الكبار<br />ماهما أصل المشكلة<br />حبيب شارون<br />وصديق لبوش<br />والكل ناهب أرضنا<br />ومفيش غفير<br />ولا فيه وزير<br />ما الكل راكب ظهرنا<br />وقانون مفيش<br />وقضاه معانا في الطريق<br />ماهما أصلا مننا<br />ودعاية تلعن أصلنا<br />مش نافع ياابنى عندنا<br />وولاده ترتع أرضنا<br />أصل الطوارئ حكمنا<br />من يوم ما ركبوا ظهرنا<br />و إذا كنا عاو زين ننتصر<br />لازم نراعى ربنا<br />أوعاك تكون خايف ياصحبى<br />ما الفجر أذن يا ولد<br />أوم بيني ننده على النايم<br />والصاحي ناخده عندنا<br />أصل الكلاب دايما بتنعث<br />لما يأذن فجرنا<br />تحية للشيخ أمين أخويا"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132448/http://masr.20at.com:80/article.php?sid=244"

[[comments]]
order = 8
subject = "البحر بيضحك له وانا نازله ادلع املا القلل 00000اة يا قلل"
author = "محمد او مايكل 00عادى"
posted = "2006-05-02"
text = "البحر بيضحك ليه<br />وانا نازله ادلع املا القلل<br />البحر غضبان ما بيضحكش<br />أصل الحكاية ما تضحكش<br />البحر جرحه ما بيدبلش<br />وجرحنا ولا عمره دبل<br />مساكين بنضحك من البلوة<br />زي الديوك و الروح حلوة<br />سارقاها من السكين حموة<br />و لسة جوا القلب أمل<br />قللنا فخارها إناوي<br />بتقول حكاوي و غناوي<br />يا قلة الذل أنا ناوي<br />ما شرب و لو في المية عسل<br />والبحر بيضحك ليه … ليه<br />وانا نازلة ادلع املا القلل<br />ياما ملينا وملينا<br />لغيرنا وعطشنا ساقينا<br />صابرين وبحر ما يروينا<br />شايلين بدال العلة علل<br />والبحر بيضحك ليه … ليه<br />وانا نازلة ادلع املا القلل<br />في بالي ياما وعلى بالي<br />واللي بيعشق ما يبالي<br />ما يهمنيش من عزالي<br />يا حلوة لو مرسالي وصل<br />والبحر بيضحك ليه ليه<br />وانا نازلة ادلع املا القلل<br />بيني وبينك سور ورا سور<br />وانا لا مارد ولا عصفور<br />في إيدي عود قوال وجسور<br />وصبحت انا في العشق مثل<br />والبحر بيضحك ليه<br />وانا نازله ادلع املا القلل"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132448/http://masr.20at.com:80/article.php?sid=244"

[[comments]]
order = 9
subject = "انا عارف ان تعليقى ما لوش دعوه بالموضوع لكن اعذرونى"
author = "مجدى اليمانى"
posted = "2006-05-02"
text = "ونحن داخل كل هذا الاحباط يجب ان يكون لنا شمعه تضئ لنا دربنا فى طريق الحريه ولتكن البدايه 00000ستظل مصر تنجب الرجال..لن تكون مصر هوليود الشرق ..لكنها مقبرة الغزاة<br />اعرف تاريخ بلدك الحقيقى<br />سيكون هذا الموضوع سجل لشرفاء كنانة الله فى الارض<br />لا تنسو انكم خير جند الارض..وليس هؤلاء اشباه الرجال<br />(ادخلو مصر إن شاء الله امنين)<br />التاسع من مارس هو يوم الشهيد الذي أعلنته السلطات المصرية منذ عام 1969 تخليداً لذكرى رحيل رئيس أركان حرب الجيش المصري عبد المنعم رياض.<br />فبعد نكسة يونيو 1967 أعلن الرئيس الراحل جمال عبد الناصر 8 مارس بدء حرب الاستنزاف ضد العدو الإسرائيلي، إلا أن القدر شاء أن يستشهد عبد المنعم رياض في 9 مارس أي بعد يوم واحد من بدء حرب الاستنزاف، وسط 35 من الجنود والضباط وهم يقومون بواجبهم الوطني القومي على الضفة الغربية لقناة السويس.<br />نزار قباني<br />عبد المنعم رياض<br />في ذكرى رئيس الأركان المصري الذي استشهد على جبهة القتال في السويس 1969<br />لو يُقتَلونَ مثلما قُتلتْ..<br />لو يعرفونَ أن يموتوا.. مثلما فعلتْ<br />لو مدمنو الكلامِ في بلادنا<br />قد بذلوا نصفَ الذي بذلتْ<br />لو أنهم من خلفِ طاولاتهمْ<br />قد خرجوا.. كما خرجتَ أنتْ..<br />واحترقوا في لهبِ المجدِ، كما احترقتْ<br />لم يسقطِ المسيحُ مذبوحاً على ترابِ الناصرهْ<br />ولا استُبيحتْ تغلبٌ<br />وانكسرَ المناذرهْ…<br />لو قرأوا – يا سيّدي القائدَ – ما كتبتْ<br />لكنَّ من عرفتهمْ..<br />ظلّوا على الحالِ الذي عرفتْ..<br />يدخّنون، يسكرونَ، يقتلونَ الوقتْ<br />ويطعمونَ الشعبَ أوراقَ البلاغاتِ كما علِمتْ<br />وبعضهمْ.. يغوصُ في وحولهِ..<br />وبعضهمْ..<br />يغصُّ في بترولهِ..<br />وبعضهمْ..<br />قد أغلقَ البابَ على حريمهِ..<br />ومنتهى ن<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132448/http://masr.20at.com:80/article.php?sid=244"

[[comments]]
order = 10
subject = "ما اخذ بالقوه لا يسترد الا بالقوه"
author = "محمد"
posted = "2006-05-02"
text = "انا شايف ان المظاهرات والاعتصمات و كل الكلام ده مش هيجيب نتيجه الا فى حاله ان نص الشعب اشترك فيه على الاقل غير كده لا<br />وانا شايف ان احنا شعب مالوش لازمه لانه شعب خاضع بيتساق من اى حد<br />حتى تغيير النظام الملكى قام بيه مجموعه ظباط فى الجيش يعنى اقليه ومعاهم سلطه لكن احنا الشعب ناميين فى العسل او ميتتين بالصح واعتراضنا على الطوارئ او غيرها مالوش لازمه لانه مش هيجيب نتيجه<br />و ما اخذ بالقوه لايسترد الا بالقوه والجيش معا النظام يبقى النظام مش هيتغير الا لما الشعب كله يطلب ده لكنه شعب جبان ومش هيعملها يبقى يستحمل الطوارئ واللى مش عاجبه الحدود تفوت جمل وانا اولهو ان شاء الله الواحد يشوف له شعب بيفهم فى حقوقه و ما بيضربش عل قفاه ولا ايه؟"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132448/http://masr.20at.com:80/article.php?sid=244"

