posted = "2006-05-01"
text = "مش قلت لكم ... لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />التمديد .... وممده لسيادته<br />التوريث ... والطوارئ هي الخطوة الأخيرة في طريق سيادته الجديد ....\" ده غير سيادته الاولاني علي فكرة \"<br />الدستور المصري .... ده مفهاش كلام ,لازم يتعدل ويتغير ةيتصلح ... ويتعمل من الأول<br />وبرضه تاني<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
