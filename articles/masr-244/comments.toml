subject = "دمعة على جثمان الحرية"
author = "ammaaly"
posted = "2006-05-01"
text = "أنا لا أ كتب الأشعار فالأشعار تكتبني ،<br />أريد الصمت كي أحيا، ولكن الذي ألقاه ينطقني ،<br />ولا ألقى سوى حزن، على حزن، على حزن ،<br />أأكتب أنني حي على كفني ؟<br />أأكتب أنني حر، وحتى الحرف يرسف بالعبودية ؟<br />لقد شيعت فاتنة، تسمى في بلاد العرب تخريبا ،<br />وإرهابا<br />وطعنا في القوانين الإلهية ،<br />ولكن اسمها والله ... ،<br />لكن اسمها في الأصل حرية"
archived = "2006-06-15"
