subject = "ده مش كفاية"
author = "مصرى"
posted = "2006-05-01"
text = "مش كفاية الإعتراض لازم يكون فيه إضراب عام شامل من كل الشعب لأن إللى يبخلع شجرة بيبذل مجهود جبار وإنت عايز تخلع حاكم تشعب وتوحش وإفترى لا زم يكون المجهود عملى أكثر من كده وليكن لنا فى الحزائر مثالاً عندما قام الشعب كله بمظاهرات وإضرابات من أجل إلغاء قانون الطوارئ الذى به نهب مصر وبه توغل فساده وتوحش وبه سيورثنا لإبنه المتخلف الأهبل ولا تنسى مقولة الزعيم أحمد عرابى لقد خلقنا الله أحراراً ولن نورث بعد اليوم"
archived = "2006-06-15"
