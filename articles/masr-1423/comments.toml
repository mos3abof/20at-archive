[[comments]]
order = 7
subject = "آخرك كيس زبالة يا مواطن"
author = "رئيس تحرير"
posted = "2007-01-10"
text = "الحقيقة العارية اخرك كيس زبالة يا مواطن<br />حاولت جاهدا فى الفترة الماضية ان اكون حذرا فى تشاؤمى من الفترة المقبلة فى مصر ثم افرطت فى التفاؤل حينما اكتشفت المدونات ثم زادت ثقتى عندما انشئت مدونتى لاقول فيها ما اريد ولكن ما حدث خلال الايام القليلة الماضية اعادنى الى الوراء كثيرا فبدأ من تعديلات السيد الرئيس اطال الله بقائه ليزيد من عذابه فى الاخرة تمخض الجبل وولد عصفورا اطلق عليه لقب التعديلات الدستوريه لبدايه عصر الاصلاحات الحقيقية اى كلام يعنى فى حته والله الراجل ده طيب وفاكر الدنيا حلوة والله انا ساعات افتكر انه مش عارف ايه اللى بيحصل معذور عنده حاجة وشبعين شنه.<br />فوجئنا بقى بخبر اكياس الدم الملوثة وده خبر عادى جدا ؟ ايه عادى طبعا هو انتم فاكرين ان فى حاجات سليمة وحاجات مضروبة كله بقى مضروب وكله مغشوش وده اللى موجود مش عاجبك ادامك حل من اتنين اذا كنت غنى تقدر تدور على الحاجات اللى مش مضروبه واشترى باسعار خياليه اذا كنت فقير انتظر سرطان فشل كلوى او كبدى او عته مغولى اللى هيجيلك وساعتها حاجة من اتين يا تحاول تتعالج وابقى اقابلنى ولو اتعالجت هتاخد دوا مضروب او دم فاسد وساعتها يبقى لازم تموت طيب نفسك فى حاجة قبل ما تموت اه نفسى ازور بيت ربنا طيب تركب عبارة السلام لا دى بتغرق حلاص مش عايز احج طيب عايز ايه طيب والنبى ازور اهلى فى الصعيد ماشى ادامك حل من اتنين تركب القطر اللى بيتحرق ولا تركب القطر اللى بيعمل حادثة لا مش عايز اشوف اهلى طيب عايز ايه خلاص انا هاموت بس هادفن فين اه جينا بقى للمشكلة الكبيرة المقبرة دلوقتى تشطيب سوبر لوكس على المفتاح يعنى بتعمل من 30000 الى 50000<br />لا انا مش عايز اتدفن سيبونى هنا لما اعفن وارمونى فى الزبالة<br />ماشى اذا كان كده ماشى"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112213321/http://masr.20at.com:80/article.php?sid=1423"

