capture_url = "https://web.archive.org/web/20070112213321/http://masr.20at.com:80/article.php?sid=1423"

[[comments]]
order = 3
subject = "ربنا يرحمنا برحمته"
author = "إبن بهيه"
posted = "2007-01-10"
text = "أولاً شكراً يا أستاذة أميرة فودة على الموضوع الجيد ده ..<br />المشكلة فعلا يا أخ فارس ليست في وزير ولا رئيس وزراء .. ولا حتى في مبارك الواطي ذات نفسه .. يعني لو ربنا أكرم مصر وفلسع مبارك الواطي النهارده .. تفتكر حال البلد ممكن يتصلح ؟<br />اللي عمله مبارك الواطي من تخريب في مصر طول تلاين سنه من هدم في مصر من سنة 1975 لما الأمريكان عينوه نائب للسادات .. وبعدها موتوله السادات وحطوه هو مكانه صعب يتصلح من غير انقلاب كامل للبلد .. يعني يغور حسني الواطي وعيلته الوقحه وعصاباته من البلد .. ونبدأ ننضف البلد بداية من رئيس الوزراء لغاية الواد سنقر بتاع المجلس القروي في كفر البدنجان .. لأن التخريب المباركي طال كل شيء في مصر .. والأخطر والأسوأ على الإطلاق أنه طال الشخصية المصرية ذاتها .. وهو ما كانت تطلبه وتسعى إليه الماسونية العالمية التي تمارس أنشطتها وتعربد في بر مصر كله بمباركة مبارك الواطي حامي حماها في الزمن الحالي وكل يوم بيفتحلها في المحافل الماسونية في قلب مصر (نوادي الليونز والروتاري وبلا أزرق) ..<br />الكلام ده صعب يغيره وزير ولا رئيس وزارة .. يعمل إيه في وسط موبوء بالكامل ؟ إحنا يا جماعه عايزين ثوره .. ثوره حقيقيه بجد .. ما ينفعش مع صر غيرها والله .. تاني يوم الثوره ممكن نتكلم ونقول إننا عايزين نعمل ونسوي .. وبغير الثوره ما فيش أي أمل في التغيير .. آديكم شايفين العك الدستوري والسياسي طبعا اللي بيضحك علينا بيه مبارك الواطي ..والحزن الوطني بتاعه ..<br />وأما الموضوع الأساسي .. ففي رأيي المتواضع أن البلد تعيش تجاذبات غريبة جدا حاليا ، تضع تلك التجاذبات الغريبة كماً كبيراً من الصعوبة أمام تحليل أي حدث في بر مصر .. ليه طيب ؟ طبعاً بفضل عبقرية مبارك الواطي في شقلبة كيان البلد وتحويلها إلى<br />اقرأ بقية التعليق .."
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112213321/http://masr.20at.com:80/article.php?sid=1423"

[[comments]]
order = 4
subject = "ماهى الخطة ؟"
author = "اى عمل فى العالم كلة يجرى حسب برنامج مثلا انا هعمل كذا وكذا وبعد كدة كذا وكذا وسوف اصل الى كذا وكذا"
posted = "2007-01-10"
text = "اللى عندنا مصابون بمرض العشوئيات<br />لا خطة ولا برنامج ولكن عشوئيات<br />عشوئيات فى السكن والادارة والسياسة<br />اساتذة فى ثقافة الفول والبصل والزيت الحار<br />معلمين فى التهليب والتفنن فى اذية خلق اللة<br />يابلدنا فين الكتور عزيز صدقى بانى صناعة مصر الحديثة<br />هل عقمنا<br />هل البيض الفاسد بيتدحرج مع بعضة<br />العيال اللى عملوا العبور تحت القصف والصواريخ<br />هل اعطانا احد مخدر نمنا كلنا بعدة<br />يابلدنا اصحى بقى زنجبار سبقتنا"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112213321/http://masr.20at.com:80/article.php?sid=1423"

[[comments]]
order = 5
subject = "حسام المصرى"
author = "أزاى رئيس وزراء يقدر يعمل حاجة فى البلد وهو ماعندوش صلاحيات اذا كان أكتر من 60% من الاختصاصات هى من حق الرئيس الفرعون انتو بتحلمو أن رئيس الوزراء يقدر يشتغل من دماغة وبعدين كل يوم تبص فى جرايد الموالسة أنة بناء على توجيهات الرئيس قد عمل رئيس الوزراء كذا و كذا دة كلة فى الهجايص يا أخوانا والله العظيم"
posted = "2007-01-10"
text = "وبعدين الهجمة على الراجل الغلبان حت بعد ما طلعت أشاعات أنة بيسوق نفسة فى الادارة ألامريكية لخلافة الرئيس عشان كدة هما سخنو علية و الغسيل الوسخ ظهر فجاءة ماهو يا أما نبقى أمريكان والريس ورئيس الوزراء ييجو يبوسو رجلينا<br />أو<br />فليمت قيصر<br />على رأى الكاتب الدكتور أحمد خالد توفيق"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112213321/http://masr.20at.com:80/article.php?sid=1423"

