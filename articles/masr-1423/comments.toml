[[comments]]
order = 0
subject = "المعتقلون في مصر"
author = "الحاضر يبلغ الغايب"
posted = "2007-01-10"
text = "المعتقلون<br />انصفوهم<br />المعتقلون في مصر<br />همه مين ؟ وكام ؟ وفين؟؟؟<br />أجلالا لمعاناة الالم و أحزان القهر لدي \" هؤلاء \" الذين اجبروا علي التجرع من كأس الفقد و الفقدان فقد الناس و فقدان الوطن علي ايدي من لا يدركون قيمة العدل ولا راحة الرحمة<br />وإحساسا بمعاناة اهاليهم و احبائهم و احياء للامال و الأحلام في عيون ابنائهم بخروج اخر واحد من \" هؤلاء \" يوم شروق الحرية و ظهور الحق .<br />تعلن جمعية المساعدة القانونية لحقوق الانسان عن رغبتها في مشاركة كافة قوي المجتمع السياسية والاجتماعية التي تتحرك منذ فترة ليست بالقليلة في سبيل الافراج عن وانصاف المعتقلون بمقار الاعتقال و السجون المصرية وذلك من خلال ايجاد اجابات علي قدر من الوضوح و الشفافية والحقيقة فيما يتعلق باعداد المعتقلون , واماكن و ظروف اعتقالهم كخطوة اولية لابد منها قبل او بالتوازي مع التحرك من اجل انصافهم والافراج عنهم و تعويضهم .<br />ما يثير الفزع في قضية المعتقلون في مصر خلاف التجاهل التام من قبل المسؤلين و الجهات المعنية , هو غياب اية معلومات رسمية او موثقة عن الاعداد الحقيقية الهائلة من المصريين الذين تعرضوا , ويتعرضون للاعتقال و السجن بمقار الاعتقال و السجون المصرية , او عن اسباب و ظروف و اماكن اعتقالهم .<br />عشرات الالاف من المصريين قد انتزعوا قسرا من حياتهم وحرموا من حريتهم و من حقهم في الحياة الكريمة ومازال الرأي العام لا يعلم العدد الحقيقي من \" هؤلاء\" الذين قبعوا<br />و يقبعون في السجون وامضوا و يمضون اغلي سنين العمر في غياب القهر و اليأس. ومازالت اجهزة الدولة - المنوط بها كشف الحقائق – لا تكترث بالرأي العام تحت ادعاء إن الوضع في مصر يلخص في \" حاكم رشيد لشعب في طور النمو \" .<br />وقد جاءت رغبة الجمعية<br />اقرأ بقية التعليق .."
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112213321/http://masr.20at.com:80/article.php?sid=1423"

[[comments]]
order = 1
subject = "رئاسة مجلس الوزراء"
author = "رئيس تحرير"
posted = "2007-01-10"
text = "المقال جيد ولكن اسمح لى بالتعليق على بعض النقاط الهامة التى جاءت بها<br />اولا منصب رئيس الوزراء فى مصر يحتاج الى ما نسميه توصيف وظيفى )jop discreption فالمنصب ضعيف و لايسمو الى دولة مثل مصر رئيس الوزراء لا يسيطر على وزرائه وكيف يسيطر عليهم وهم يحتلون مناصبهم كوزراء قبل ان يتولى هو منصبه لا يستطيع ان يحاسبهم لا يستطيع ان يسألهم ولا يجبر اى وزير على الاستقاله اين كان د نظيف فى مسلسل الفضائح الذى كان مستمرا عرضه فى الايام الماضية من وزارة الداخليه الى وزارة الثقافة الى الاسكان الى الصحة حاول هذا الدكتور ان يخدع المصريين فى بيان الحكومة امام مجلس الشعب ( مجلس المهلبية ) وان يحاول ان يتملق الشارع المصرى بان كله تمام<br />سيدى منصب رئيس الوزراء فى مصر ضعيف لان الوزراء لا يحخاسبون الا امام رئيس الجمهورية وهذه مشكلة اخرى<br />فلا جودت الملط ولا الجن ابن العفريت يستطيع ان يفعل شىء فى هذا البلد الذى انتهى ولن تقوم له قائمة مرة اخرى<br />وحسبى الله ونعم الوكيل<br />mego-mego.blogspot.com"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112213321/http://masr.20at.com:80/article.php?sid=1423"

