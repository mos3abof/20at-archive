subject = "يسبح ملط ضد التيار !!!"
author = "فارس_fr"
posted = "2007-01-10"
text = "يا سيدى مشكور على اللى عملته , بس للاسف هتروح فين يا مسكين , دى عصابه وشبكة عنكبوتية من المصالح (وشيلنى واشيلك ) . العيب مش فى نظيف ولا وزارته حتى لو شالوا نظيف وجابوك انت يا ملط بوزراء من اختيارك , للاسف مش هتقدر تعمل حاجه ضد التيار المباركى الللى جالس ومربع علىقلب البلد ومش ناوى يسيبها علىمع اخر نفس فى حياته و يارب يكون اليوم ده قرب بقي عشان خلاص الواحد زهق !!!!!!!! الله يكون فى عونك يا ملط"
