[[comments]]
order = 6
subject = "الفنان الراحل منصور محمد"
author = "ستوديو"
posted = "2007-01-11"
text = "الفنان الراحل منصور محمد كان له سبق فى المسرح الحركى سنه 1990 على مسرح دار الاوبرا وذلك فى المهرجان الاول للمسرح التجريبى بعرض مسرحيه اللعبه والتى ادهشت الجميع من الحاضرين داخل صاله العرض من فنانين عرب ومصريين واجانب لان ذلك المخرج قام بعمل عرض مسرحى من 50 فنان تتفاوت اعمارهم من سن 10 سنين الى 50 سنه وكانت اللغه التى قدمها بليغه وقد ذكرته مؤسسات فنيه عالميه بفنان ولد فى عصر مبكر وانه سبق العديد من المخرجين فى طريقه عرضه لللافكار والاداء الحركى وكنا نحن ستوديو منصور نكمل مسيرة ذلك الفنان الذى لم يقدرة الا القليل من الصحافين والنقاد واحب ان اوضح انه ذلك العرض موجود بصندوق التنميه الثقافيه بدار الاوبرا اذ كان من اهتمام البعض<br />الاستعلام عن الفرقه<br />مدير العلاقات العامة<br />محمود يحيى<br />مدير الفرقه محمد فوزى عصام توفيق<br />actor_dancer@hotmail.com"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113214550/http://masr.20at.com:80/article.php?sid=1403"

[[comments]]
order = 7
subject = "ستوديو منصور محمد"
author = "فوزى"
posted = "2007-01-11"
text = "1- مرحلة أستوديو 90 :<br />- بدار الأوبرا سنه 90 كانت مرحله التدريب والتعرف على تكنيك جديد يقوم عليه المخرج الراحل<br />منصور محمد، وكانت تلك الفترة بمثابة مدرسه صغيرة لنا0<br />- استمرت تلك التدريبات المنغلقة داخل قاعه مجهزه بالأوبرا ما يقرب من سنه وستة اشهر وعلى مدار<br />عشرة ساعات يوميا 0<br />- كانت تدريبان شاقه جدا وتنقسم هذه التدريبات إلي أقسام مختلفة في فروع كثيرة من الفنون، الرقص،<br />الغناء، تدريبات اللياقة، فنون شعبيه، اكر وبات، موسيقي، 0000000<br />- اشرف علي هذه التدريبات نخبه من الأساتذة 0<br />- أثمرت تلك الفترة عن تخرج مجموعه من الشباب المبدعين في فن الإخراج و التأليف والرقص و التمثيل<br />والديكور<br />- وانتهت تلك الفترة بعرض مسرحي من أخراج الفنان الراحل منصور محمد، مسرحية ( اللعبة ) 0<br />- علي المسرح الكبير سنه 1990 وفى افتتاح المهرجان التجريبي الثاني شهدت الساحة ألفنيه ظهور مخرج<br />مسرحي مصري 0 وقد كتب عن ذلك المخرج الكثير في جرائد ومجلات عربيه و أجنبية وقد كفاء الفنان<br />منصور محمد من دول مختلفة بمقالات ذكر فيها انه العبقري والمبدع الجديد وظهور طفرة جديدة في مصر<br />على يد تلك الفنان 0 و ذكرت عن ذلك الفنان انه الناغبه في مجلات فرنسيه ومجلات في بلدان شتى 0<br />2-مرحله ما بعد الأستوديو:<br />- بعد وفاة المخرج منصور محمد استمر أستوديو 90 في ممارسه التدريبات وإنتاج أخر عرض لم يكتمل بسب وفاة منصور محمد وقرر الفريق أن يقدم ذلك العمل وهو مسرحيه ( إضافة بسيطة ) على مسرح الهناجر للفنون بدار الأوبرا 0<br />- وخرج العرض المسرحي للنور بعد معناه شديدة وذلك في الفترة من 1/11 حتى 21 / 1992<br />- وكان فى تلك الفترة يتابع الفريق المخرج الايطالى جاني فيوري ورئيس الأكاديمية الإيطالي ل<br />اقرأ بقية التعليق .."
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113214550/http://masr.20at.com:80/article.php?sid=1403"
