text = "ممكن الواحد يكوت شاذ ويكون كويس مع مراته<br />اصل ممكن الشواذ انواع<br />في ناس شواذ وبتماري<br />وناس شواذ بالتفكير بس لا لا بيمارسوا ولا عندهم استعداد الا اذا اتعرضوا له صراحة"
