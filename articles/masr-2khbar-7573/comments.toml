author = "مثلي"
posted = "2008-03-01"
text = "أنا كشاذ أو مثلي أعتبر أن هذا الأمر هو خروج عن الفطرة الطبيعية شئنا أم أبينا، هذا هو الواقع، فإما أن نعالجه ونمارس حياة طبيعية وإما أن نتعامل معه على أنه شيء طبيعي وعندها علينا أن نعاني الأمرين وهناك حل ثالث أن لا نتعالج وأن لا نمارس الشذوذ وهو بحد ذاته الجحيم على الأرض. أنا شاذ أعيش بفلسطين المحتلة عام 48 أي ما يسمى اليوم \"إسرائيل\" هنا يعتبر الشذوذ أمرًا طبيعيًا وممنوع معالجته، ومن يعالجه يعرض حياته المهنية للخطر بدعوى \"التعدي على أخلاقيات المهنة\"!. لذا أجد أنه من الضروري تشجيع هذا الطبيب وافتتاح عيادات أخرى لمعالجتنا.<br />لي مدونة تتحدث عن الشذوذ من وجهة نظري وهذا هو عنوانها: mithly777.blogspot.com"
archived = "2009-07-05"
capture_url = "https://web.archive.org/web/20090705085627/http://www.20at.com:80/masr/2khbar/7573.html"

