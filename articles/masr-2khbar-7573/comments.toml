posted = "2007-11-12"
text = "العيادة دى مهمة جدا ومطلوبة زى ما بنسمع على القهوة فيها وزراء فى المجلس عندهم شذوذ وبقى لهم فى الوزارة عشرين سنة<br />ومش عايزين يتعالجوا اصل الشذوذ مصدر للرزق وللثقافة<br />وياما كلام بيتقال عن الشذوذ - ومدام دة موجود يبقى الفقر هيركب البلد وهنشحت لان غضب ربنا هينزل علينا<br />اللهم لا تؤخذنا بما يفعلة السفهاء منا"
archived = "2009-07-05"
capture_url = "https://web.archive.org/web/20090705085627/http://www.20at.com:80/masr/2khbar/7573.html"

