author = "محمد"
posted = "2009-03-20"
text = "السلام عليكم انا محمد 21 سنه مشكلتي تتضمن اني عندما اري راجل كبير في السن الي حد ما يصبح جسدي في هيجان ثم يظهر الم شديد في بطني لاني اقاوم هذا الشعور تقريبا وانا طالب طب بشري بعد ما كنت من الاوائل اصبحت بلا هدف قد دمرني هذا الشعور وانا ابقي في قمة السعاده عندما احس بحضن اي شخص حتي لو كان غريب بس تقريبا يكون في سن بابا لاني عمره محضني بابا وانا جالي هذا الشعور عندما كنت اطلع الاول في الثانويه وكان اساتذتي تبارك لي وتحضنني بده لانهم في قمة الفرحه لي بس انا كنت بحس بالاحساس ده حتي اني اصبحت احبهم اكثر من اي شخص لانهم ادوني حاجه انا كنت فاقدها بس انا ملتزم جدا دينيا حتي اني لم اعمل سيئه الا العاده السريه حتي اثبت لنفسي من حين لاخر اني سليم ونفسي في بابا قبل ما اضيع او انتحر ارجو من الله ان يقابلني شخص لم يرزقه الله بالخلفه لاصبح ابنه البار ويعوضني ما فقدته ارجو ان تساعدوني وقولولي ايه اللي عندي ده وساعدوني في علاجه ده اميلي ورقم تليفوني0103574309 mmmm_mm949@yaho o.com"
archived = "2009-07-05"
capture_url = "https://web.archive.org/web/20090705085627/http://www.20at.com:80/masr/2khbar/7573.html"

