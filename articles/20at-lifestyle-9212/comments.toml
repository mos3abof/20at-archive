author = "رامى جمال"
posted = "2008-05-29"
text = "تحية طيبة الاخت هبة اولا اتمنى لك ولجميع الطلاب النجاح والتفوق<br />ثانيا انا ممرت بتجربةالامتحان ايام المدرسة والجامعة بصراحة نحن كنا نستذكر دروسنا قبل الامتحانات بقليل اى عندما تكون على الابواب وطول العام لاهين تشغلنا الحياة ولكن عند اقتراب الامتحانات ينتابنا القلق والعصبية ونعلن حالة الطوارىء القصوى فى البيت لا خروج ولا تلفزيون ..وكنت اواظب على تقسيم وقتى بحيث تتخلل المذاكرة استراحاة لدقائق ايستعيد نشاطه ويواصل وكنت احرص ان لا اسهر ليلة الامتحان حيث كنت انام مبكرا لاصحو مبكرا لاراجع ما درسته بالامس وقبل الدخول على الامتحان ."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105223511/http://20at.com/20at/lifestyle/9212.html"

