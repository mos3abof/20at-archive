author = "سماح {*"
posted = "2008-05-30"
text = "هبة.. ليست هي الكلمات التي تكتب لكِ..<br />تتواضع امامكِ كل مشاعري<br />مزيداً من التقدم غاليتي هبة//<br />أتمنى لكِ التوفيق من كلّ قلبي.. أنتِ وكلَّ الطلبةِ الأحبة المقبلينَ على الامتحانات<br />جميلُ أن يقلق الطالب.. لكن لا يؤثرن هذا القلق سلباً عليه.. حتى يضمن نجاحاً وبعد النجاح تألق..<br />بإذن المولى..<br />ما رأيكِ فيمن تهرب الامتحانتُ منه ويلاحقها<br />ويكره كلَّ كتبهِ ليلة الامتحان //<br />أشكر اهتمامكِ هبة.. وأتمنى لكِ من كل قلبي توفيقاً .. بل وما تمنيتِ يا غالية..<br />كوني بخير من الله<br />على الهامش..<br />اشتقتلك \"|"
