[[comments]]
order = 2
subject = ""
author = "ربيع الحياة"
posted = "2008-05-30"
text = "سبحان الله العظيم ،، مرحلة وعدت من حياة الإنسان منا،، ولكن ما أذكره عن نفسي اني كنت أؤجل عم اليوم إلى الغد، وأجعل المواد تتراكم علي، وفي اغلب الامتحانات كنت اتعرف على مدرس المساق لحظة تقديم الامتحان، واتعرف على كتاب المساق ليلة الامتحان، واذكر في تلك الايام ان شهيتي للطعام كانت تفتح بشراهة، وكان وزني يزداد، ولكن من فضل الله تبارك وتعالى كنت أتميز في تقديم الامتحانات، حتى أن الامتحان كاملا كنت انهيه في اول ثلث إلى نصف ساعة من الامتحان، وبعدها انهي اول طالب واخرج، ودائما ما كنت اجلس في المقدمة، ولله الحمد، ودائما ما كانت درجاتي الجامعية في قائمة الامتياز من فضل الله، مع الإشارة إلى أن التأخر وعدم متابعة الجامعة لم تكن مقصودة أو بغرض التلاعب او الاستهتار، ولكن لأسباب طارئة فرضتها عليا ظروف الحياة الصعبة، ولله الحمد والمنة،، موضوع جميل أعاد لنا بعض الذكريات الممزوجة بين الالام والافراح،، وصياغة رائعة، دعواتي لكي بالتوفيق هبة وقلم متميز ."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105223511/http://20at.com/20at/lifestyle/9212.html"

