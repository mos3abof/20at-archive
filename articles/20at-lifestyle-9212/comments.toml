posted = "2008-05-31"
text = "أولاً أحيي جميع الأخوة والأخوات المرور، والقارئين، والمسجلين تعليقاتهم، ونسأل الله أن يجزيهم خير الجزاء، ( الأخ رامي، والأخت ربيع ، والأخت سماح ( اشتقت لكِ أيضاً ) ، والأخ مجهول الاسم ) كلٌ له التحية بقدر ما يحمل له قلبي من حبٍ وأكثر، والحمدلله ظهرت النتائج، وامتحاناتي لم تكن بالقلق المعتاد بل أقل قليلاً، فجاءت النتائج موفقة ولله الحمد وبمعدل الامتياز الدائم بإذن الله …<br />كونوا جميعاً بخير<br />هبة"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105223511/http://20at.com/20at/lifestyle/9212.html"

