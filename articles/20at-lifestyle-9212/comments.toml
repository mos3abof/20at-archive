text = "رائعٌ يا هبة ما قدمتِ بصورة شيقة ، قلق الإمتحانات أمرٌ طبيعي لا مفرّ منه ، لا سيما أننا نقلق بكلِّ حال ^^<br />لكن التوتر النفسي هو ما يُؤدي بنا إلى الهلاك ، وبرأيي كما ذكر البعض أن الدرسة السليمة المتواصلة من بداية العام الدراسي ، هي الأساس السليم للنجاح والتفوق ، وهناك أُناس من الناحية البيولوجية يفرغون توترهم بالطعام ، خاصةً الشيبسي والمشروبات الغازية ، ربما تفاجأتُ قليلاً بما ذكرتِ من نماذجٍ واقعية ، لكنه الواقع الذي نعيش ^^<br />هيَ فترةٌ وتمرّ على الجميع ^_^<br />حفظكِ الله : )"
