posted = "2009-07-25"
text = "عشان كده انت ممنوع من السفر يا زخاري<br />انت بتسافر اسرائيل تروح مستوطنة زخاريا<br />ايوه يا عم كلهم قرايبينك هناك<br />الله يسهلك<br />لكن على مين دا المباحث مفتحه عنيها كويس اوي اوي اوي<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />مباحث اسكندرية"
