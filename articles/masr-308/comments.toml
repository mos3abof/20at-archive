[[comments]]
order = 0
subject = "مساومة"
author = "معلش أنا حاسس أنها مساومة غير لائقة"
posted = "2006-05-13"
text = "لو الصورة مش عجبانى .. أطفى النور<br />طب أنا مش موافق على الصورة ومختلف معكم فى موضوع طفى النور<br />أرى أنها فكرة تتضمن كثير من السلبية وغير ذات جدوى<br />ارجوكم عالجوا الصورة أو شوف لكم صرفة فيها"
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914030310/http://masr.20at.com:80/article.php?sid=308&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "حين يكون الدم مدادا فلتسقط كل الأشعار"
author = "سنووايت"
posted = "2006-05-13"
text = "لم تسعفني الكلمات ولم اتمالك دموعي وانا اقرأ عن عبير العسكري صحفية بالدستور وما تعرضت له من تمزيق لملابسها وضربهاوهتك عرضهاواتهامها بامتهان الدعارة تلك المهنة التي لا تعرف ان تمارسها إلا تلك الحكومة لتنضم لسلسة امسحيها في مصر يا عبير<br />عايزه اسال سؤال هما الضباط بتوع امن الدولة دول ولا اتباع الحكومة دي ولا حتى عفاريت الحكومة دول ولاد مين استوردوهم من اني بلد عديمة الانسانية والمروءة دينهم ايه لهم اخوات بنات وشباب زي اللي بهدلوهم في الشوارع دول - الحكاية مبقتش شقاوة شعب يا ريس لأ بقت حكومة بتحارب شعب - ايوه دي مصر مش فلسطين ولا العراق وبجد ومن قلبي حسبي الله ونعم الوكيل"
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914030310/http://masr.20at.com:80/article.php?sid=308&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "اي حاجه تانيه"
author = "ضد الحكومه"
posted = "2006-05-13"
text = "معلش يا عشريناتية احنا فعلا محتاجين نعمل حاجه و نقف ضد الظلم بس موضوع نطفي النور معرفش حاسس انه مش مؤثر فعلا ده حتي الحكومه حتفرح ان الناس مش حتشوف الاخبار ولا تعرف ايه الي بيعموله في الشعب بجد احنا عايزين نعمل حاجه اكثر ايجابيه<br />ولغايه ما محمد ما يرجع<br />لا للتمديد ....لا للتوريث ... نعم لتعديل الدستور"
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914030310/http://masr.20at.com:80/article.php?sid=308&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "معلش"
author = "انا طبعا مع الحمله بس عايز اعرف الحمله نتيجها توصل لينا ازاى هل بنعرف نحدد كام واحد طفوا النور فى القاهره حتى"
posted = "2006-05-13"
text = "منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com"
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914030310/http://masr.20at.com:80/article.php?sid=308&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

