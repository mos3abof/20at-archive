subject = "الصوره فيـــــــــــــــــــــــن"
author = "احمد ميدو"
posted = "2006-05-16"
text = "الصورة فين الصورة فيـــــــــــــن<br />انا مش عارف احملها بس كويس عشان انا مبحبش الصور العريانة وربنا ياخدهم"
archived = "2006-09-14"
