[[comments]]
order = 6
subject = "زي ما هي حبها ....."
author = "هوووووووووبه"
posted = "2006-07-14"
text = "يااااااااه يا كابتن , بردو حقول كابتن عارفه المونديال خلص غتاته ...<br />الوطن , الوطـــــــــن , اغنيه بكار المقدمه والنهايه ...<br />الوطن عندي مشاهد في افلام السيما وافيهات بلوجرز ...<br />المشهد االاول : لمحمود المليجي في فيلم الارض وماسك فيها بايده وسنانه ومش سيبها ..<br />المشهد التاني : احمد السقا ومصطفي شعبان ومين اللي وسخ البلد ورما الزباله<br />المشهد التالت : جائنا البيان التالي وهنيدي بسال الناس اللي لسه متجوزش واللي لسه بيسلك البالعه واللي والللي<br />المشهد الرابع : مدبولي ورمزي وعايز حقي , وهو بيقوله انا ابني مات في 73 عشان اللي زيك يعيشوا ورمزي يرد اصل انت راجل عجووووز مش شايف البلد والفقر روح موت احسنلك , ومدبولي يقول كان فيه واحد اسمه عواد ساب البلد وبعها ولما رجع ملقاشهاش والعيال في القريه اتريقه عليه عوووووواد باع ارضه يا عيال , وينتهي المشهد وتيجي النهايه ورمزي يفتكر المشهد ويقول عووواد باع ارضه اوعي تبيع يا عووووووواد<br />المشهد الخامس : المعتقلين في السجون الاخوان الشرقاوي بردو عايز حقي , وغيرهم لا فض الله فاهم"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131258/http://masr.20at.com:80/article.php?sid=653"

[[comments]]
order = 7
subject = "بحلوها بمرها ...."
author = "بنشتمها ونرجعلها وزي ما جاهين قال"
posted = "2006-07-14"
text = "باحبها بعنف وبرقة وعلى استحياء<br />وأكرهها وألعن أبوها بعشق زي الداء<br />وأسيبها وأطفش في درب وتبقى هي ف درب<br />وتلتفت تلاقيني جنبها في الكرب<br />والنبض ينفض عروقي بألف نغمة وضرب<br />وهي بردوووو<br />ما يجيش في بالي هرم ما يجيش في بالي نيل<br />ما يجيش في بالي غيطان خضرا وشمس أصيل<br />ولا جزوع فلاحين لو يعدلوها تميل<br />حكم الليالي ياخدهم في الحصاد محاصيل<br />ويلبّسوهم فراعنة ساعة التمثيل<br />وساعة الجد فيه سخرة وإسماعيل<br />ما يجيش في بالي عرابي ونظرته في الخيل<br />وسعد باشا وفريد وبقيّة التماثيل<br />ولا أم كلثوم في خِمسانها ولا المنديل<br />الصبح في التاكسي صوتها مبوظُّه التسجيل<br />ما يجيش في بالي العبور وسفارة اسرائيل<br />ولا الحضارة اللي واجعة دماغنا جيل ورا جيل<br />قالولي بتحب مصر أخدني صمت طويل<br />وجت في بالي ابتسامة وانتهت بعويل<br />وافهيات بلوجرز<br />\" بنت من البلد دي ونفسي اشوفها فرحانه \" حلوى قوي<br />\" وطني لو شغلت بالخلدد عنه هيتسرق \" جامعه حيوان<br />\" مصر التي في خاطري و في بقي .. أحبها من كل روحي و اللي بيجري في عرقي\" ورك البلد<br />\" كلام من القلب و العقل واحيانا.المرارة\" براحتي<br />\"لعمل مركب من ورق علي المي لرخي وسلامي لاحلي وطن ...\"<br />صبــــــــــــــارة"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131258/http://masr.20at.com:80/article.php?sid=653"

[[comments]]
order = 8
subject = "وطنى"
author = "شيرين عبد الحميد"
posted = "2006-07-15"
text = "ركبت احد الاتوبيسات وبدا الكمسرى يقول اللى مادفعش يبعت فرد احد الركاب وقال هو فى حد من المصريين هيقولك ما دفعتش لم اتمالك نفسى وبدا بسيل من الشتائم فى البلد فما كان منى الا ان قلت له انت قاعد فيها ليه اللى مش عاجباه البلد يسيبها و يمشى اللى مش عاجبه البلد يغير جنسيته و جواز سفره و يفارقنا. يا نحبها زى ماهى يا نحاول نغير فيها بالايجابيات و ليس بالشتائم يا ريت نحاول نبنى مانهدش. الوطن فى القلب زيه زى الاب و الام مهما كان بهما من عيوب و اخطاء فعلينا نحن الاصلاح حتى نعيش. و قد امر الله الانسان بالهجرة ان لم يستطع التكيف مع وطنه. بحبك يا مصر مهما كان"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131258/http://masr.20at.com:80/article.php?sid=653"

