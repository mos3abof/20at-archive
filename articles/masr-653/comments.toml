order = 0
subject = "غريب فى وطنى"
author = "ابو اسامة"
posted = "2006-07-13"
text = "كلمة وطن جاية من التوطن اى المكان الذى اعيش فيه بارضه وبناسه احن ليه لما ابعد عنه واحس ان جذورى مزروعة فيه فيه ابوية وامى وجدودى واهلى الى بحبهم ودى الصورة الجميلة الرومانسية الى بنعشها لمدة معينة<br />بتختلف من شخص لأخر عندى انا انتهت بعد مرحلة التعليم زى كتير من الشباب حسيت<br />بمعنى تانى للكلمة زى ما كنت محتاج لحنان ابوية وامى وانا صغير علشان اشوف الصورة الرومانسية للوطن محتاج لحنان الوطن علشان<br />يفضل انطباعى عن الكلمة زى ما هو مايتغيرش<br />محتاج احس بامان المستقبل محتاج احس ان ده<br />وطنى محتاجنى علمنى علشان افيده بعلمى<br />وكبرت علشان اقول الراءى الى يخليه احسن وطن فى الدنيالكن للأسف لقيت ناس تانية وخداه منى وبيقولولى ملكش حق فى الوطن ده<br />ملكشى انك تتكلم فيه وملكشى حتى مكانة فيه<br />ده وطن ملكية خاصة للبهوات والبشوات ولكل<br />الى يقدر يقطع منه حته ويخدها ولخوفى على الوطن مقدرتش اعمل زيهم وبعد ما راح ابوية وامى كمان ملقتليش وطن وبقيت فى<br />غربة فى قلب الوطن واقف مستنى كل الى زى<br />يقوم يرجع حقه من البهوات والبشوات الى عملوه ملكية خاصة وافسدوه وقطعوه بينهم<br />لازم نرجع الوطن ملكية عامة للجميع<br />علشان الكل يحس يعنى ايه كلمة وطنوميبقاش<br />وطن لناس وناس لأ علشان كده.<br />لا ..........لبيع الوطن<br />لا ..........لتوريث الوطن"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131258/http://masr.20at.com:80/article.php?sid=653"

