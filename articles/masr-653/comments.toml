[[comments]]
order = 2
subject = "الوطن"
author = "سىسيد"
posted = "2006-07-13"
text = "اشكر الاخ اسامة جدآ وانا مثلوة صح كل كلمة بس يا خاسرة على الية فوق انا ماشيت من 30 عاممن مصر ولكن هى على طول فى قلبى لان فعلا فية كل شىحلو من ذكرايات بس وكل مدة انزل خمسة سنين او اكثر ولكن اخر مرة فعلا الوطن حلو او البلد بس حلوة لكن الانسان هو الية مش حلو واللة بكيت كثيرآ على اهل البلد الغلبة الفقراء وقلبى حزين وانظر الى الطابقة الاخرة الناس الي فوق فوق قلبى ياحزان كثر حرم حرم الظلم دة واللة رايت كذة عائلة نئامة على الارض الارض واطفال صغر والاخر ولا هنا ضرير لا يارء وهذ المنظر لم انسة ابدان وشوفت ظلم كتير من البولس وماذا يفعل امين الشرطة وانا حربت فى عام 67 و و73 علشان مين وكل اصدقاء شهداء علشان مين هذة والة الية فوق فوق وشوفت اصحاب المرسيدس وهو يضرب امراء فقيرة ماذآ اقول ,,,, اة اة اة يابلد ولكن هو وطنى ولم انسة وممكن يتغير فى يوم او فى شهر او فو سنة بعد ما اموت وانتم ايضآ مثلى ولم يتغير الظلم والفساد لان الانسان مش كويس طماع فى طماع وليس فى ايمان باللة وللعلم مش مصر بس لا لا كل البلاد العربية واللة مش انتم بس لا ولكن ما هو الحل هل هو وطن الحلم ولية وطن الواقع ؟؟؟؟؟؟ ,,, اللة معكم وهو القدر وارجو منكم قراءت الكتاب الكريم صح صح ولهم يوم قول يا رب .......يارب"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131258/http://masr.20at.com:80/article.php?sid=653"

[[comments]]
order = 3
subject = "وطني ديني وعقيدتي"
author = "احمد هندي"
posted = "2006-07-13"
text = "وطني هو ديني..وطني هو اسلامي..وطني هو عقيدتي..بانتمى للاسلام وبتكلم بلغة الاسلام وبطريقة الاسلام واسلوب الاسلام..انتمى للاسلام وادافع عن الاسلام واحارب فى سبيل الاسلام وابيع روحي وكل ما املك فى سبيل الاسلام..ان الله اشترى من المؤمنين انفسهم واموالهم بان لهم الجنة..وطني مش مجرد ريحة عرق او حتى ريحة مسك..وطني هو رسالة عايش عشانها وهوصلها لكل اللى اقدر اوصلها له وهاحفر فى الصخر بايدي عشان اعلي رايتها للسماء فوق كل شىء..وطني اسلامي"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131258/http://masr.20at.com:80/article.php?sid=653"

