subject = ""
author = "بتاع الخوارج"
posted = "2010-03-02"
text = "المشايخ بتوعك المذكورين بتوع الفكر الوهابى الجاهل اتعلموا فين<br />الشيخ عبد العزيز بن باز - دة بياع عرق سوس والا الشيخ الكفيف اللى بيمجد عصابة ال سعود اللى مستولية على جزيرة العرب<br />والشيخ محمد بن عثيمين دة اللى بينقل الاحاديث من صحيح البخارى ويشرحها بطريقة غريبة<br />والشيخ التالت دة لم يسمع احد بة اطلاقا<br />انهم اسوأ مشايخ فى تاريخ الاسلام<br />ويظهر انك بتقرأ الكتيبات التى تطبع فى المملكة وتوزع ببلاش"
archived = "2010-03-03"
capture_url = "https://web.archive.org/web/20100303020429/http://www.20at.com:80/masr/news/15533-2010-03-01-12-46-36.html"
