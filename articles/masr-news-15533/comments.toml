author = "الاخ بتاع الخوارج"
posted = "2010-03-01"
text = "انت يا ابنى عايش فى انهو عصر<br />انت متحنط - خوارج اية ودواخل اية - يعنى اية خوارج<br />والا قصدك الناس اللى خرجوا على سيدنا على - اية علاقة دى بدى<br />ومش ممكن يبقى خوارج سيدنا على كانوا صح<br />خليك عايش فى العصر دة مش عايش فى عصر انتهى بظروفة وناسة من قرون طويلة<br />ربنا ياخدك لانك متخلف"
archived = "2010-03-03"
capture_url = "https://web.archive.org/web/20100303020429/http://www.20at.com:80/masr/news/15533-2010-03-01-12-46-36.html"

[[comments]]
order = 1
subject = ""
author = "مبتسم"
posted = "2010-03-01"
text = "لا يا اخويا مش حناخد علي قفانا وخلاص …<br />بس الحكومة مش حتعمل أكتر من اللي عبد الناصر (( عامله الله بما يستحق )) عمله فينا .<br />ولو ان مش عارف ممكن يحصل إيه تبقي جاهل (( في هذة النقطة ولا أقصد الإساءة ))"
archived = "2010-03-03"
capture_url = "https://web.archive.org/web/20100303020429/http://www.20at.com:80/masr/news/15533-2010-03-01-12-46-36.html"

