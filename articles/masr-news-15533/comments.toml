author = "يعنى هتعملو اية ؟"
posted = "2010-03-01"
text = "هو كل واحد بيتكلم عن الخط الاحمر اليومين دول لية - بتوع الاخوان - والنظام يقول لك الامن القومى والامن الكروى والامن القروى خط احمر - هو فين الخط الاحمر دة بالضبط ومين اللى عملة وباى قلم - هتعملوا اية يعنى - هتاخدوا على قفاكم وخلاص"
archived = "2010-03-03"
capture_url = "https://web.archive.org/web/20100303020429/http://www.20at.com:80/masr/news/15533-2010-03-01-12-46-36.html"

[[comments]]
