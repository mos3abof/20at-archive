[[comments]]
order = 14
subject = "ممكن نتعرف اوي يا عرص"
author = "هانيبال"
posted = "2006-06-09"
text = "لو تحب نتكلم على امي وامك كفاية انك تعرف اني صعيدي ولو انت من بحري يبقى مفيش داعي تفتح موضوع النسوان ده لان الفلاحين بتوع الدلتا كل جنسيات الارض بتنيك في دين ابوهم من ايام خفرع يعني لو عايز تقل ادبك يا عرص ابعد عن الامهات ..اما ابويا اللي انت بتقول عليه زبال احب اعرفك ان الشغل حتى لو كان زبال فهو مش عيب ولا حرام ولو مفيش زبال ينضف وساختك كنت اكيد انت هاتكون زبال مش كده ولا ايه .. الحاجة الاخيرة اللي احب اقولهالك يا فلاح يا خبيث ان انتو سبب كل التخلف اللي البلد فيه وكل الفقر والجوع وكفاية انكم طلعتو للبلد اوسخ ناس ( بهايم ) السادات وحسني مبارك ابن دين الكلب .. ولسه اللي جاي العن .. وطبعا ده ناهيك عن عنصر الخيانة والغدر المتأصل في دمكم النجس على مر الاجيال والعصور .. ارجعو لحجمكم الطبيعي واشتغلو عمال زي شغالات النحل اصل الموضوع ده هو اللي انتو موهوبين فيه وبس فاهم يا حيوان ؟<br />وبعدين كفاية فضايحكم مع العرب والنسوان اللي بتصدروها برة وتكسبو من عرق كسها .. اه يا قلة قنبلة ذرية تبيد الدلتا باللي فيها .. غور جتك القرف"
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925023558/http://masr.20at.com:80/article.php?sid=462&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

