[[comments]]
order = 8
subject = "الراجل خرف"
author = "أبو أسامة"
posted = "2006-06-06"
text = "الراجل ده بينه خرف والى زيه المفروض يضرب بالنار زى خيل الحكومةيستقبل واحد لسةقاتل ولاده ولا بلاش ولاده للأخ جمال يزعل<br />لا وبيبتسم فى وشه وحاطط ايده ورا ظهره وهو حاطط ايده على قفاه وده ابلغ شىء للوضع الى هو فيه هو يديله على قفاه وهو يضحك<br />مش بقولكم الراجل ده خرف فالح بس يتشطر على ولاد بلده يضرب فيهم ويسحلهم ويحرقهم ويغرقهم والله الأتنين ميفرقوش عن بعض .<br />لا................للتوريث<br />لا................للفساد<br />لا................للتطبيع<br />لا................للعجوز الخرف ولأبنه"
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925023558/http://masr.20at.com:80/article.php?sid=462&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

