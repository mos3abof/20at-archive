[[comments]]
order = 11
subject = "كسم مبارك"
author = "هانيبال"
posted = "2006-06-07"
text = "مبارك فلاح عبد والعبيد لازم يكونو كده .. فيه قوتين بيشتغلو ضد اي حضارة ممكن تقوم في البلد العظيمة مصر عارفين ايه هما القوتين دول ؟؟<br />انا اقولكم .. سكان الدلتا ( يعني الفلاحين ) والمسيحيين ( ودول حكايتهم حكاية ) عندهم مرض نفسي بيصورلهم ان البلد لسه محتلة بالمسلمين وان هما اصحاب البلد الاصليين .. عشان كده عمرهم ما هيكونو شركاء في اي بناء .. سيبك من الشعر المقرف اللي بنسمعه من رجال الدين لما بيتصوروا في التليفزيون وخليك في الواقع ... الواقع المر<br />الجماعة دول شايفين نفسهم في امريكا وكان امريكا هي المسيح المنتظر ( يعني بيتلزقو في الناس وبيشمتو جامد لما تحصل مصيبة في اي مكان فيه عرب .. اقول ايه بس ناس عقد ..<br />اما الفلاحين العبيد فدول مش هاينفعو غير عمال زي شغالات النحل كده انما عمرهم ما هيكونو قادة او زعماء لانهم ببساطة عبيد وتجربة السادات الخول ومبارك العرص الكس اثبتت للجميع ان الفلاحين المفروض يعترفو بالامر الواقع ويبطلو يفكرو افكار هما مش قدها ..<br />ويكفهيم ان الحضارة الفرعونية المحترمة جدا اتمسحت باستيكة واتقفلت بالضبة والمفتاح لما رمسيس الزفت الاول قعد علي<br />عرش مصر<br />وبالنسبة للعرص بتاع الامن اللي كاتب تعليق من غير اسم وبيقول الله يكون في عون الرئيس احب اقوله كسم دين امك يا متناك يا ابن المرة الزانية على كسمين ام سوزان يا ولاد الزنا يا شوية خولات بتتناكو من طوب الارض .. اكيد يا متناك انت فلاح نتن عرص يلعن 3 كسمين امك هههههههههههههههههههههه"
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925023558/http://masr.20at.com:80/article.php?sid=462&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 12
subject = "دودو و المعلم سخسوخ"
author = "دودو و سخسوخة"
posted = "2006-06-08"
text = "أنا مبخافشى وحفضل أقول<br />كلمـة حــق عليها مسئـول<br />إن الريس راجــل طيــب<br />وبشعبه دايما مشغـــــول<br />مشغول انه يلم فلوسنا<br />بره سويسرا يحوشهالنا<br />وف حسابات سريه يشيلها<br />نفسه يأمن مستقبلنا<br />شفتو ازاى بقى قلبه رحيم<br />عنده ايمان وضميره سليم<br />بيجوعكوا لجل تخسوا<br />آه ياشعب يا محتاج لرجيم<br />من جهلكوا بتقولوا بطاله<br />وان الاحوال مش شغّاله<br />دا الراجل نفسه يريحكم<br />هى الراحه تبقى عواله؟<br />أما حكاية المنتجعات<br />ليه تسموها المعتقلات؟<br />ليه الظن<br />وسوء النيّه<br />نفسه يفسحكوا يا بهوات<br />أما الكرسى واللى اتقال<br />دا كلام مش محتاج لسؤال<br />الغلطه دى غلطتنا يا عالم<br />إن مجبناش كرسى تيفال<br />والله انتم ظالمين الراجل<br />ضيّع عمره ومين يستاهل<br />حتى الاكل بياكله بدالنا<br />طالع واكل نازل واكل<br />بعد دا كلّه........ماله الريس؟؟؟؟؟"
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925023558/http://masr.20at.com:80/article.php?sid=462&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

