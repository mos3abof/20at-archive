[[comments]]
order = 0
subject = "نداء عاجل لكل شخص محترم فينا...تعالوا شجعةنا في عرض النيابة النهاردة"
author = "محمد السيد"
posted = "2006-06-05"
text = "اليوم عرض 200 من المقبوش عليهم في يمظاهرة القضاة يوم الخميس 11/5..<br />واللي شرفت برفقتهم ... لكن مش عارف ليه استعجلوا عليا وطلعوني ....<br />لو حد ممكن ييجي يساندهم ... متتخيلوش كان تأثيره إيه علينا منظر مئات البشر اللي كانوا واقفين خارج مبني محكمة الجلاء .... والله ده كفايه يشجعنا متين سنة قدام ...<br />بجد والله ... اللي يفدر يحضر ويتواجد .. ده له أثر محترم جدا علينا جوه ...<br />وبرضه<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925023558/http://masr.20at.com:80/article.php?sid=462&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "دول الناس كانوا أحسن مننا وأرجل في اليوم ده"
author = "محمد السيد"
posted = "2006-06-05"
text = "إحنا يومها كنا مجهزين هتافات وحاجات من دي .. قلنا نشجع الناس اللي جايين يطمنوا علينا .. لكن العكس اللي حصل ..<br />صوتهم وشكلهم وهتافهم .. خلي كتير مننا يبكي ويتأثر جدا جدا ....<br />أنا أسف إني مش قادر أنقل لكم الوصف .لكن حقيقي ... كانت لحظة بالدنيا ...كفيلة كمان إنها تشجع أي واحد فيكم إنه يكمل المشوار ده ...ومايخوفهوش لا سجن ولا سجان ...<br />وبرضه<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925023558/http://masr.20at.com:80/article.php?sid=462&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "العنوان والوقت وياريت تحضروا ومتقلقوش. مفيش اي قلق أو مضايقة أمنية"
author = "محمد السيد"
posted = "2006-06-05"
text = "صحيح ...نسيت العنوان ..<br />شارع الجلاء .. موازي لرمسيس .. هناك المكان معروف جدا .. وحتلاقوه زحمة ...<br />كمان ... العرض طول اليوم لغاية الساعة 5غالبا ... ماهم كتير ... يعني وقت ماتكونوا فاضيين تعالوا ..<br />بس بجد .. متسبوهمش لوحدهم<br />لا للتمديد... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925023558/http://masr.20at.com:80/article.php?sid=462&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "لقطة مهمة"
author = "هبة ربيع"
posted = "2006-06-06"
text = "الموضوع جميل جداً ومخدوم كويس بالمعلومات ولقطة ذكيةجداً<br />ابراهيم عيسى يقول في مقاله الاخير بصوت الأمة أن اسرائيل هي التي تتوسط لمصر عند أمريكا الأن حتى لا تضغط عليهافي أي إجراءات إصلاحية.<br />ما يحدث دليل قاطع على أن النظام المصري أصبح عميلا لإسرائيل ولا يهمه إلا البقااااااااء وحسبنا الله ونعم الوكيل"
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925023558/http://masr.20at.com:80/article.php?sid=462&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "حدث بالفعل"
author = "جمال"
posted = "2006-06-06"
text = "وقد اتفق الطرفان على انه في حاله حدوث ثورة شعبية مضادة للتوريث فتقوم اسرائيل باحتلال سيناء ليلتف الجيش و الشعب تحت راية القائد الجديد لمحاربة العدو الاهم ثم يتم انسحاب اسرائيل تحت ضغط الجيش المصري بقيادة الزعيم جمال مبارك وذلك مقابل مضاعفة حصة اسرائيل في الغاز المصري"
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925023558/http://masr.20at.com:80/article.php?sid=462&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "ياشرفاء مصر..الثورة الآلآلآلآلآلآلآلآلآن"
author = "مصرية"
posted = "2006-06-06"
text = "يكفى أن نرى الصورة المنشورة لنستنتج خلاصة الموقف ..تأملوا هذه الكائنات أنهم شياطين فى صورة بشر.. لم يبخل علبهم الخالق بقبح الشكل.. حتى ينسجم مع قبح المعنى..الحقارة والدنائةوالخبث تتجسد فى كل قسمات وجوههم..ولا أستبعد مطلقا ما ذكره الأخ جمال عن السيناريو القادم المحتمل..هذا الحقير تملأ وجهه القبيح ضحكة عريضة ..مع من قام بقتل أبنائنا وسحبهم الى الأراضى الفلسطينية مع الحدود المصرية..ودمائهم الطاهرة لم تجف بعد ..أيها الخائن القذر ..أنت تصافحه وتحتضنه وتبادله الضحكات و أنت على علم اليقين بأنه قاتلهم..أنت عار على كل مصرى أن تكون رئيسا ولو بالتزوير لمصر ..لانريد لأنفاسك الفاسدة أن تشاركنا هوائها...أرحل عنا أيها الحقير انت وعصابتك وسلالتك<br />آآآآآآآآ ياوطنى كم هنت ورخصت دماء ابنائك فى عيون السفلة الفسدة<br />أخى جاوز الظالمون المــدى<br />فحق الجهـــاد..وحق الفـدى<br />ياكل شرفـــاء مصر الثـــــــــورة هى الحل<br />الثــــــــــــورة الآلآلآلآلآلآلآلآلآلآلآلآن"
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925023558/http://masr.20at.com:80/article.php?sid=462&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "اضربه علي قفاه"
author = "الاستاذشيكو"
posted = "2006-06-06"
text = "والله الخنزير الاسرائلي ده مش بيطبطب علي حسني باين عليه بهبده بالقلم علي قفاة باين عليه زى ماهو باين في الصورة والله العظيم احنا شعب تعبان عشان الحقيقه باينه من الاول وبرضه ساكتين علي الظلمه والخاينين وهما معروفين !!!!!!<br />هو احنا شعب احنا لااااااااااااااا<br />احنا شعب من غير رجول مكسحين يعني<br />وهو الواحد مستني ايه من اعمي بيجر بالحبل مكسح اهو حسني اعمي واحنا المكسحين<br />بلا نيله احنا احسن حاجه نتلهي علي عينا<br />ونقعد كده من غير مانعمل اي حاجه فالحين بس بالكلام<br />بس مفيش مشكله حرامي هايمشي وحرامي هايجي واللي مش عارف مين اللي بيحكم البلد دلوقتي يبقه مخه تراللي ولازم يعرف مقامه جتنا نيله واحنا شعب مكسح ومالوش لزمه"
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925023558/http://masr.20at.com:80/article.php?sid=462&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

