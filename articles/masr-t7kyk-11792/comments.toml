author = "ali"
posted = "2009-04-16"
text = "أنا بالنسبة لي.. مش عايز أقول إني ضد مؤيدي السلام أو ضد من يعادون إسرائيل.. بس الواحد مش عارف يقول إيه.. إزاي يصادق أو يوافق على مقابلة أو استقبال شخص إسرائيلي يمشي في شارع واحد جنب باراك وأولمرت.. ربما أخيه أو جاره أو صديقه شارك في العدوان على مصر في 67 أو ابنه أو جاره أو ابنه صديقه شارك في الحرب على غزة.. كيف أصادق مثل هذا الشخص.. أنا أؤيد أن يتنازل على جنسيته مقابل أن نوافق على استقباله.. فكلمة إسرائيلي في حد ذاتها اغتصاب لحقوقنا وأرضنا.. وهذا ما لا أرضاه أبداً.. ولو دعيت للحفل لن أذهب وسأحارب وجوده في مصر."
archived = "2009-04-21"
capture_url = "https://web.archive.org/web/20090421022027/http://www.20at.com:80/masr/t7kyk/11792--parinpoim-concert-cairo-opera-aginst.html"

