posted = "2009-04-16"
text = "أنا مش مع حكاية تأثير على الرأي العام، يعني يقولك عايزين نستقبله عشان العالم يقول علينا متحضرين.. وعشان الرأي العام العالمي هايكون معانا.. أنا مش مع ده لأن الرأي العام العالمي عمل لنا إيه حرب غزة مظاهرات حول العالم.. عملت إيه؟ ولا حاجة"
