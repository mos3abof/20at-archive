[[comments]]
order = 6
subject = "دهب مع الريح"
author = "Dabdoob"
posted = "2006-04-25"
text = "انت رجعت يا اكرم ....مبروك!!<br />انا بقي لسه مارجعتش لاني شايف ان الكلام خلاص مابقاش بيجيب همه<br />وبالنسبة للاخ محمد السيد باحذرك انك تاخد شعاري (مفيش فايدة )لان دي ملكية فكرية يا حبيبي<br />المهم انا عايز اسال يا تري من الجاني؟سالت ناس كتير وكانت الاجابات كده:<br />1- ربما يكون احد افراد الجماعات الاسلامية الراديكالية التي تري ان السياحة حرام (وليس هذا موضوعنا الان) وهو احتمال مستبعد لان الداخلية قبضت عي كل بشري له علاقة بالدين في سيناء<br />2- اليهود وهو احتمال متعلق بنظرية المؤامرة الشهيرة بالطبع فلو ان قطة ماتت في بني سويف لقالوا ان اليهود قتلوها<br />3- الحكومة !!! بحجة انها تريد تمرير قانون الطوارئ وهو احتمال عجيب بالفعل (سمعته من عدد من الاخوان وغيرهم)<br />4- جهة اخري غير معلومة وهو احتمال كوميدي لانه ببساطة يعني (ماعرفش مين)<br />اما رايي انا فاظن ان الحادث ليه علاقة ببدو سيناء الذين تم امتهانهم لاقصي درجة بعد احداث طابا.<br />وسلام<br />مفيش فايدة<br />Dabdoob"
archived = "2006-09-23"
capture_url = "https://web.archive.org/web/20060923044034/http://masr.20at.com:80/article.php?sid=220"

[[comments]]
order = 7
subject = "يجب على الحكومه ان تناى بنفسها وتحترم عقولنا"
author = "حسام"
posted = "2006-04-25"
text = "الى الاخ دبدوب اذا فرضنا ان الحكومه ليست لها يد فعليها ان تقدم لنا نتائج التحقيق ولا تلجاء لاجبار الف مواطن على الاعتراف تحت التعذيب وعلينا ان نختار من بينهم واحد ونقول هو اللى عملها ونقتل كام واحد ونقول اعوانه. احتمال الموساد يبقى قائما خاصه انه من الواضح ان لدى الاسرائيليين معلومات اكثر من امن الدوله والمخابرات المصريه بدليل ان اسرائيل حذرت رعاياها من السفر الى سيناء فى الاعياد. وربما تكون هذه المعلومات متوفره لدى الداخليه ولكن الداخليه مشغوله اكثر بالقضاه والتوريث مش مهم اى حاجه تانيه وطظ فى مصر \"شوفتى يا فاطمه مين اللى بينفذ ال طظ \" اما عن موضوع البدو فهو احتمال قائم بشده ولكن اذا فرض وكان بعضهم متورط فعلا هل سيكونون هم المخطئون ام الداخليه هى التى جعلت منهم مجرمين. من يتحمل المسئوليه. ارجو من الداخليه اجراء تحقيق يحترم الراى العام ويقنعنا بان الحكومه تعمل لصالح الشعب . واطالب بتغيير وزير الداخليه ومدير المخابرات لفشلهم فى تامين المواطنين واقترح تعيينهم فى وزاره امن الرئاسه لنجاحهم فى تامين الرئيس فقط"
archived = "2006-09-23"
capture_url = "https://web.archive.org/web/20060923044034/http://masr.20at.com:80/article.php?sid=220"

