[[comments]]
order = 15
subject = "سلامتك يا ريس"
author = "محرز"
posted = "2006-04-27"
text = "عليا الحرنكش ياريس مبارك<br />فى عصر مزركش ملون بنارك<br />لابايعك وابايع حكومة حمارك<br />ملعون ابو اللى يقدر يقاطع قرارك<br />نهاره مقندل وليله مبارك<br />فهمبك وهجص وطلع فى ديننا<br />اكيد هو طالع يشاهد جمالك<br />جمالك مبارك سوزانك سوزاننا<br />يامحلا حصارك لمصر اللى جالنا<br />نسيمها فى عصرك بيشوى فى بدننا<br />اؤيد وابايع فخامة جلالتك<br />وايد اى واحد بيمسح ريالتك<br />ولانك سر باتع هاننسى هبالتك<br />فاقعد ياريس ودلدل حمامتك<br />حمامة السلام حمامتك ياريس<br />سلامة الحمامة وسلامتك ياريس<br />على تل مصر ياريتك تهيص<br />خرابه فسيحة عليها تمتيس<br />واامر تطاع فشعبك مفيص<br />احمد فؤاد نجم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142555/http://www.20at.com/article2.php?sid=731"

