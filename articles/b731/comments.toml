text = "أخيرا حد رد عليا .... إيه الجمال ده بس يا ريس اكرم ......<br />بس تفتكر ممكن ... ؟؟؟<br />ممكن يكون مفيش فايده ....<br />وممكن يكون طظ في مصر ..... ؟؟<br />بس برضه حتفضل بلدنا ديه ... بالرغم من كل الحرامية ....<br />وبرضه ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
