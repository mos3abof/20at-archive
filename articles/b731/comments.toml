[[comments]]
order = 0
subject = "حسني مبارك هو السبب"
author = "لا شك أن هذه الاحداث مؤلمة لأنها تس مسلمين ، ولكن يحق لنا أن نتساءل من قام بهذا العمل ، ولما قام بهذا العمل ؟"
posted = "2006-04-24"
text = "وسأفترض هنا أن من قام بهذا العمل هم مسلمون ، فمن الذي أوصل المسلم أن يستبح دم أخيه المسلم ؟؟!!<br />الجواب هو حسني مبارك وال سعود وغيرهم من الطواغيت ، فلولا خيانتهم لله ورسوله وتنكرهم لامتهم وتحولهم الى أداة طيعة بيد الاعداء ما نشأ هذا التناقض بين القمة والقاعدة وأعني به الشعب والقيادة.<br />فالمسلم الغيور عندما يرى أخوانه يذبحون في فلسطين ، ويذبحون في العراق ، والنظام العربي عاجز عن الحراك للدفاع عن هؤلاء ولو بشطر كلمة ، ماذا تتوقع منه أن يعمل؟؟<br />لذلك على كل مستاء من هذا العمل (تفجيرات دهب وغيرها) أن يعلم أن العلة في طواغيت العرب ، وأن ازالتهم شرط في اختفاء هذه الاعمال ،وما دام هؤلاء الطواغيت في سدة الحكم ، فهذه الاعمال ستستمر ، لانها بكل بساطة تعبر عن التناقض الصريح بين هؤلاء الطواغيت وبين الشعوب."
archived = "2006-09-23"
capture_url = "https://web.archive.org/web/20060923044034/http://masr.20at.com:80/article.php?sid=220"

[[comments]]
order = 1
subject = "الله يخرب بيوتكم"
author = "مواطن محروق"
posted = "2006-04-25"
text = "يااخوانى اللى عمل كده فعلا شخص مختل ، ماهو مافيش شخص يروح يموت بشر ويفرتكهم ويخرب بيت البلد ويقطع ارزاقها الا لوكان مختل عقليا فعلا. مافيش سبب فى الدنيا يخللى حد عند عقل يعمل العملة السودة دى. معترض على حكام البلد ، وماله يروح يطلع ديكهم احنا مالنا. زعلان عشان كرامة الاسلام ولا اي كلام من النوع ده، يطلعلى حاجة واحدة فى القرأن بتقول ان اللى يزعل على كرامة المسلمين والاسلام يروح يموت المسلمين. بصراحة ماعنديش كلام تانى اقوله ، ماهو العيب مش عليه العيب على ال **** اللى ماسكين البلد وسايبنها سداح مداح كل اللى عايز يطلع ديكنا ييجى يطلع ديكنا ياولاد ستين **** سيبو البلد بقى خربتوها.<br />الله يخرب بيوتكم."
archived = "2006-09-23"
capture_url = "https://web.archive.org/web/20060923044034/http://masr.20at.com:80/article.php?sid=220"

[[comments]]
order = 2
subject = "صباح الصدف يا وطني المختل"
author = "أكرم"
posted = "2006-04-25"
text = "7 اكتوبر 2004 ( عشية عيد الغفران عند اليهود ) حادث طابا و نويبع<br />23 يوليو 2005 ( عشية عيد الثورة عند ال ......... و لا بلاش ) حادث شرم الشيخ<br />25 ابريل 2006 ( عشية عيد الفصح عند اليهود ) حادث دهب<br />تواريخ وطنية ام اعياد يهودية ام كلاهما<br />ارجو الا تصدر الحكومة احد البيانين الاتيين<br />1- الذي قام بالحادث شخص واحد و هو من ال 4 مليون مختل اللي في بر مصر<br />2- ان الحادث فردي و ليس له علاقة بحوادث سيناء السابقة<br />و سلملي ع الشفافية<br />رسالة اخيرة للاخ محمد السيد الللي ريقه نشف عشان يلاقي توقيع غير لا للتمديد و لا للتوريث و نعم لتغيير الدستور المصري<br />انا اقترح عليك شعارين لاتنين من رموز العمل الوطني و هما اصلح شعارين للامة حاليا<br />1- مفيش فايدة ( سعد زغلول )<br />2- طظ في مصر ( محمد مهدي عاكف )<br />و اخيرا لابد من الشعر<br />قد لا نبالي بالرصاص اذا تهاوى حولنا<br />فانا و انت نفيق اذ ثقب الرصاص رءوسنا"
archived = "2006-09-23"
capture_url = "https://web.archive.org/web/20060923044034/http://masr.20at.com:80/article.php?sid=220"

