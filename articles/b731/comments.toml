[[comments]]
order = 11
subject = "اخ يا بلد"
author = "sara"
posted = "2006-04-26"
text = "انا عايزة حد يصحينى من النوم انا فى كابوس انا مش عارفة هما يدونا اجازة ننزل فيها بعد كدة يضربونا محدش لاحظ انى تفجيرات شرم الشيخ كانت فى يوليو يعنى فى شهر الثورة اللى قام بيها عبد الناصر وتفجيرات دهب فى عيد تحرير سيناء يبقى اللى عاملها اللى حبسنا دمهم فى اكتوبر \"اسرائيل\" الناس اللى عملت كدة وفكرة انى دة علشان ربنا ولا علشان الرسول ولا علشان فلسطين يبقى حمار كبير لان الرسول قال لصحابة لا تدخلو مدينة ليلا حتى لا تفزعوا أطفالها ونسائهاوشيوخها لا تقتلوا طفل,امراة,شيخ واللى عاملوا كدة نفذوا اللى قالوا الرسول بالحرف الواحد ولن يبقى إلا مقولة سعد زغلول ما فيش فايدة وحسبى الله ونعم الوكيل"
archived = "2006-09-23"
capture_url = "https://web.archive.org/web/20060923044034/http://masr.20at.com:80/article.php?sid=220"

