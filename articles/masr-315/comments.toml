text = "كلي ثقة ويقين ان كل كلمة تصدر سواء من صحيفة حزبية او حكومية اوغيرة وكل حديث تليفزيوني وكل همسة في جوف الليل ..هي للترتيب للتوريث..الكل بيخطط والترزية شغالين ليل نهار..والسيناريو يعد بمنتهي الحرفنة.. ويمكرون ويمكر الله والله خير الماكرين...صدق الله العظيم"
