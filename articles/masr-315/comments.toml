[[comments]]
order = 2
subject = "زعلان وحزين"
author = "مهموم أبوحسرة"
posted = "2006-05-19"
text = "المشكلة ان الشعب ابن الكلب الجبان ده اللي هوه شعبنا لو واحد حرامي في الأتوبيس اتقفش بيسرق محفظة مخرومة فيها تلاتة جنيه تلاقي الفتوات من كل حدب وصوب ينزلوا فيه طس وهاتك ياضرب لما يعدموه العافية وبعدين يسلموه للقسم بلا رحمة ولا شفقة وكذلك الأمر مع حرامي الشباشب في الجامع مع إن الشباشب مهرية من المشي والضرب على قفا صاحبها من مراته .إنما بقى اللي يغيظ ويفقع أتخنها بيضة وارمة إن اللي سارقين قوت البلد وخيرها ومالها وأرضها وتاريخها وشرفها وعرضها وأمنها القومي\"حلوة أمنها القومي دي أخت السيرك القومي\" كل ده والشعب الخول ابن الكلب ده ولا من مجيب ولا من شنب يقول بم . سرطان واتسرطن . امراض واتمرضن.فساد واتفسدن. بهدلة واتبهدل. قندلة واتقندل. وبقت دول الخليج الفسكانة اللي كانت بتمشي ماسكة في ديل جلابية مصر أحسن تتوه . تعالى شوف سبحان العاطي الوهاب. حتى ليبيا بتاعة الأخ العقيد قائد ثورة الفاتح رجلية بقت لها حيثية وكلمة وسط الأمم . وإحنا بقى بقينا فين.... تحت ياحبيبي .في الزبالة قول. في الضياع ممكن. في المهانة ماشي. في النسيان أوكيه. في الجهل والمرض وتبرعوا لبناء مستشفى سرطان أطفال مصر اللي أعلى نسبة سرطان في العالم فيها وفي الفياجرا بتاعة ابوالعينين والصفر بتاع هلال والشهادة المضروبة بتاعة تار حسني وضرب النار في حزب الوفد بتاع نعمان والتوكيلات المزورة بتاعة نور وعبلة الكحلاوي والعبارة والقطر المحروق فيه لحمنا والطيارة المخطوفة في صقلية والسفير المدبوح في العراق والميتين وخمسين ألف جنيه شهرية جوزية بتاع الأهلي والخمسة مليار بتاعة ابراهيم نافع وتوحيد الآذان بتاع زقزوق بحيث تبقى الآذان كلها واحدة بتسمع كلام واحد ماتسمعش غيره مع مشكلة الفيشاوي والحناوي مع السؤال المهم لو واحد قال لمراته ياماما<br />اقرأ بقية التعليق .."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043938/http://masr.20at.com:80/article.php?sid=315&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

