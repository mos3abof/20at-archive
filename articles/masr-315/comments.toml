[[comments]]
order = 4
subject = "صاحب اول طعة جوية"
author = "ابو كرتونة"
posted = "2006-05-20"
text = "اليكم نشرة الاخبار: قامت القوات المصرية مدعومة باحدث الاسلحة المدرعة بمهاجمة اماكن العدو الحصينة امام دار القضاء العالي وقامت بقصف اماكن تجمع العدو والحقت بهم اشد الهزائم, كما قامت قواتنا المسلحة بصد امدادات العدو القادمة من شارع رمسيس لدعم العدو , وقامت بسحل العدو في الشارع وخطفهم واعتقالهم وضربهم حتي استسلموا لايدي قواتنا المجيدة<br />وبعض من اعتقلتهم قواتنا كانوا من شباب العدو العاطل , وبناته العوانس , وبعض الفقراء المسلحين, وبعض القضاه الماجورين, وبعض من الارهابين من جماعة الاخوان اليهوديين. وقد قامت قواتنا بمعاملتهم اذل معاملة سواء بالضرب او التحرش او الاهانة, وذلك بسبب اعتدائهم علي مصر ) وانتهت النشرة ...شالوم<br />للعلم اسرائيل ممكن ان تحتل سيناء كاملة الان في ثلاث ساعات فقط( شوفوا مصر كلها ممكن تاخذ في يدها قد ايه بقي) يعني يوم مع الرءافه<br />يا عم حسني بدل كل قواتك الي بعتها تضرب الناس يوم الخميس الي فات والي قبليه, يا ريت تبعد الالوف من العسكر الي ضربوا الناس الغلابة يحموا مناطقنا الي في سيناء من عملاء الموساد, بدل اما تحصل عمليات اخري وبعدين نلبسها في البدو."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906043938/http://masr.20at.com:80/article.php?sid=315&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
