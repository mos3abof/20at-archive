text = "يولد الناس جميعاً أبرياء.<br />فإذا ما دخلوا مختبر الدنيا<br />رماهم وفق مرماهم بأرحام النساء<br />في اتجاهين:<br />فأما أن يكونوا مستقيمين… وأما أن يكونوا رؤساء"
