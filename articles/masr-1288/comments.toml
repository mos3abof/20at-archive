[[comments]]
order = 8
subject = "كفاية او مش كفاية ؟؟"
author = "عبد المنعم المصرى مقيم بالمهجر"
posted = "2006-12-12"
text = "فى هذه الايام والعالم يعد لاحتفالات الكريسماس راس السنة لقيت عندى وقت انى اتصفح المواقع المصرية ؟؟ شيئ جيد ان تجد الوقت لتقرا وتعرف آراء الناس ؟ بس اللى موش جيد ابدا ان مع هذا الكم الهائل من المواقع التى اصبح عددها اكثر من عدد الاحزاب المصرية تجدهم جمبعا وكل يغنى على ليلاه وانا على ليلى اغنى ؟؟ يعنى زى المثل بتاعنا ما بيقول ان العدد فى الليمون ولو ان دا كان زمان لما كنا بنشترى الليمون بالمائة يعنى المائة ليمونة كانو بشلن وفوقهم عشرين كمان ؟ المهم<br />كل هذه المواقع والاحزاب اصبحت زى الموضة النهاردة ماكسى جيب وبعد يومين مينى جيب وكمان يومين ما فى جيب وزود يومين يبقى من غير هدوم زى السيد عادل امام ما قال فى مسرحية شاهد ما شافش حاجة انها لابسة من غير هدوم<br />يا اخوانا يا طيبين حاولوا تجمعوا الكلمة وتتوحدوا على هدف واحد وهو ان مصر تبقى بصحيح حرة يعنى حرة من اى قيد او شخص يقيد حريتها وبلاش ناخد حكاية المواقع على انها فرصة ونتكلم فيها انا اود ان تكون المواقع ساحة لتجميع الاراء الحرة وتحديد هدف معين<br />يعنى مثلا مثلا زى ما بيقول حكيم<br />نتفق ان لا ننتقد وبس بل نشحن الجماهير المسحوقة ونفكر لهم بطريقة ازاى يقدروا ينتزعوا حقهم المنهوب وازاى نعمل علشان نزنق النظام الحاكم فى خانة اليك وما يقدرش يفلت من ايدينا وماشاء الله الشباب العاطل ما اكثره فى المنحوسة قصدى المحروسة مصر هى اتنحست من يوم ما اخدها السادات وسلمها لمبارك وبعدين عمالين على بطالين بيبيعوا البلد حتة بحتة وما فى حد حاسس بالبتاع دا اللى بيحصل .. وكمان العمال اللى المفروض يحموا المصانع اللى هم بيشتغلوا فيها وما فيش واحد يفكر يبيعها لانها موش بتاعة اللى خلفوه وما فيش لا خ<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190724/http://masr.20at.com:80/article.php?sid=1288"

[[comments]]
order = 9
subject = "انتا شردت كفاية يا عم بيبو"
author = "بوسى"
posted = "2006-12-12"
text = "ايه يا عم اللى انتا عامله فى الموضوع ده أنا لولا أنى متأكده انك يسار من الردجة الاولى ونقد لكفاية لتغير من نفسها على اساس ان بداية الاصلاح الاعتراف بوجود فساد كنت قولت عليك حد من روز اليوسف .. بس بغض النظر إنى ممكن اختلف شويى \" مش كتير والله \" بس انتا فعلا كنت موضوعى لاقصى حد والجميل أنك جبت تعقيب اسحاق وعملته عنوان عشان محدش يقولك انك متحيز لحد على حساب حد .. وده موهبة مش غريبة عليك وعلى شغلك ... ربنا يوفقك .. سلام"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190724/http://masr.20at.com:80/article.php?sid=1288"
