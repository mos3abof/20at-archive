[[comments]]
order = 2
subject = "نفكر فى حركة جديدة"
author = "حسين عبد الظاهر"
posted = "2006-12-12"
text = "موضوعك جمييل يا شريف الله ينور عيك<br />بس يا جماعة الخوف ان الحكومة تروج لفكرة \"أهى كفاية اللى كنتم معلقين امالكم عليها طلعوا شوية عالم انتهازيين \"<br />ليس معنى خراب \"كفاية\" من الداخل أن دعوتها - أو بعض أفكارها- كانت خطأ<br />وأنا شخصيا أرى أنه كان من الأولى لحركة كفاية أن تكون حركة مؤقتة (تنتهى بانتهاء ما جاءت من أجله) ترتبط بحادثة معينة وهى مواجهة اعادة انتخاب مبارك .. وقد حدثت المواجهة وإن لم تنجح الحركة لكنها حاولت وحققت قدرا من النجاح يصعب صياغته فى شكل ارقام او سياسات على ارض الواقع .. كان يجب ان تعلن الحركة بعد الانتخابات - هذا رأيّ- أنها حلت نفسها ، ويتم تشكيل حركة أخرى جديدة تحت مسمي جديد يناسب مواجهة قضية أخرى ، وبمجرد انتهاء هذه القضية - بغض النظر عن مدى نجاح الحركة فى التعاطى معها- يتم حلها لتشكل حركة جديدة باسم جديد لقضية جديدة .. وهكذا<br />اعتقد ان هذا ربما كان اكثر فاعلية واكثر نشاطا وتجديدا للتحركات الشعبية، ولا يجعل حفنة من الاشخاص هم الذين يتصدون لكل حاجة : وقف التوريث ، البطالة ، الغلاء ، الفقر ، الاعتداء على الصحفيين ، الاعتقالات .. إلخ<br />خاصة أن هؤلاء الأشخاص لم يكونوا محل اتفاق كثير من القوى السياسية الأخرى ، بل إن موقفهم من \"علمنة\" الحركة جعل أغلب الإسلاميين إن لم يكن كلهم يتركونهم ، كأن تنشر قيادة الحركة بيانا تعرب فيه عن تأييدها لموقف فاروق حسنى من قضية الحجاب ، الامر الذى يستعدي الناس العاديين البسطاء - اللى المفروض الحركة معبرة عنهم- فضلا عن استعداء الإسلاميين أنفسهم.<br />عموما \"كفاية\" فى طريقها لأن تصبح تاريخا .. عايزين نفكر فى اسم جديد لجماعة جديدة"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190724/http://masr.20at.com:80/article.php?sid=1288"

[[comments]]
order = 3
subject = "شكراً للسيد جمال أسعد عبدالملاك .. إبن الصعيد الأصيل"
author = "إبن بهيه"
posted = "2006-12-12"
text = "لماذا ؟؟؟ لعل كثيرين منا يذكرون بدايات كفاية وكيف أننا تأملنا فيها الخير الكثير كحركة وطنية تضم كافة التيارات التي تجمعت بهدف وحيد هو تغيير الوضع السياسي القميء الذي تعيشه مصر بقوادة مبارك الواطي الماسوني .. أنا عن نفسي كنت من أوائل المنضمين لهذه الحركة ، لكن بعد وقت قصير شعرت بأشياء غريبة .. تلك الأشياء تحديداً لم يشعر بها في بداياتها الأولى غير عدد قليل من الناصريين والإسلاميين معا وقليل من الوطنين الآخرين .. رويداً رويداً وجدنا أنها تتزايد .. ما هي ؟ الهوى الأمريكي بالحركة من ناحية ، ومن ناحية أخرى معاداة الإسلاميين في مصر والذي تجلى واضحا في وقوف الحركة ضد الإخوان المسلمين في انتخابات 2005 فكنت تقرأ على موقعها وفي تصريحات ذلك البعض المتأمرك ما يسوء .. طيب ليه ؟؟؟ ما تعرفش ... تلاقيهم بيهاجموا الإخوان وبس وبدون مبرر وبرغم وجود عدد كبير جدا من الإخوان في الحركة .. يعني كأنهم عايزين يعملوا شرخ في الإخوان وده مستحيل .. وأقولها مستحيل بملء الفم عن معايشة تاريخية للإخوان الذين أرى فيهم وأنا خارجهم أنهم أفضل الموجود اليوم على الساحة بلا منازع .. فالمسافة بينهم وبين من بعدهم في الوطنية والوفاء والإخلاص لهذا الوطن والإيثار بعيدة جداً .. لذا تجد الوطنيين الحقيقيين في هذا البلد يساندون الإخوان المسلمين برغم الاختلاف الأيديولوجي .<br />منذ ذلك الحين تأكد لدي شخصياً أنها ليست المكان المناسب ، فما حببها إلينا أنها غير أيديولوجيه وغير حزبيه وغير وغير وغير .. فقد كنا نفهم أنها وطنية وحسب إلا أننا مع الوقت اكتشفنا خطأنا .. لقد خرجت من الحركة في ديسمبر 2005 على أثر هجوم الحركة على الإخوان المسلمين بطريقة غير مبررة وخرج معي كثير من الناصريين والوطنيين لهذا السبب نفسه .. ظللت متابعا للحركة رغم<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190724/http://masr.20at.com:80/article.php?sid=1288"

[[comments]]
order = 4
subject = "مهما عملوا"
author = "محدش يقدر ينكر فضل كفاية فى صحوة المصريين لكن هناك من يحاول أن يدخل فى صفوفها لتفتيتها مثلما حدث مع حزب الوفد وغيره من المعارضة ولكن المبدأ موجود وهو رفض الفساد مهما حاول السرطان إختراق الجسد وإللى بتقول مفيش فايدة وعايزة تحبط المصريين أحب أقولها أمثالك هما إللى ودوا البلد فى داهية وأكيد ها يكون فيه فايدة واحب اقولها نسيتى الكلمة الشهيرة بتاعت التوريث والمسيرة أياها ده بس لمجرد التذكير"
posted = "2006-12-12"
text = "لكن أحب أقول شوفوا المعارضة فى لبنان ليها قيادة وزعامة محترمة وثقة بينها وبين الشعب ومجرد ندائها للشعب بالخروج لروفض الفساد لا يتأخر أتمنى أن تكون المعارضة فى مصر بنفس القوة والتأثير على الشعب<br />على العموم الفساد فى مصر يريد أن يضرب الشعب بكل الطرق حتى يلهية فى مشاكله ولا أحد ينظر إلى فسادهم وبيعهم للمصانع والشركات والنهب لكن نرجوا أن كل مشاكلنا تحل سريعاً ويكون المبدأ الذى نجتمع عليه كلنا فى مصر هو رفض مبارك وعائلته والإطاحة بهم ولا بديل لو ها نفكر فى رفض الفساد والله معناجميعاً ويوفقنا للنصر عليهم اللهم آمين"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190724/http://masr.20at.com:80/article.php?sid=1288"

[[comments]]
order = 5
subject = "والله فعلاً"
author = "والله يا منى مثلك قلته أحسن علشان إللى زيك مش هيأثر فى رفض الشعب لفساد مبارك وعيلته القذرة وأبنه المدمن ومراته المجنونة الحقيرة"
posted = "2006-12-12"
text = "أنا بس نفسى اعرف هما شدين حيلهم للحرب على المعارضة قوى كده ليه بعد لما شافوا المعارضة فى لبنان هما خايفين على كراسيهم إللى ربنا يحرقها بيهم وخايفين على نفسهم لأن نفس الكلام إللى بيتقال على السنيورة ينطبق عليهم بالظبط وإللى على راسه بطحة بيحسس عليها ولا إيه ياسوزى المجنونة اليهودية الحقيرة القذرة هى وإبنها إللى عايزة تلزقة للشعب بالعافية وناسية أن الشعب مليان كفاءات أحسن من المدمن الشاذ بتاعها ده يارب ياخده وياخدها يارب والعجل الكبير طبعا معاهم"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190724/http://masr.20at.com:80/article.php?sid=1288"

[[comments]]
order = 6
subject = "الى حسين عبد الظاهر خلاص خلاص"
author = "نيفين نيفى نوفا"
posted = "2006-12-12"
text = "طبعا خلاص خلاص دى مش ليك يا حسين بس دى اسم الحركه اللى عملها عمرو اديب ف القاهره اليوم<br />و علشان منوديش الراجل ف داهيه بقول ان عمرو مش عاملها حلركه بالمعنى المفهوم و لكتها حركه بالاقوال بس لمشاهدى اوربت من خلال تعليقاتهم على الاوضاع اللى ف البلد<br />فعلا كل حاجه ف البلد خلاص خلاص<br />بالنسبه لموضوع كفايه و من الاول و جورج اسحاق جرى يقول الحركه باقيه<br />و باقيه و لا مش باقيه ايه الفايده<br />للك الله يا مصر"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190724/http://masr.20at.com:80/article.php?sid=1288"

[[comments]]
