text = "مش فاهم .. الخبر بيفيد بنجاح الصيادون فى الهرب من مختطفيهم , و فى منتصفه شىء تانى مغاير بيفيد بتأكيد الخارجية إن جهودها و اتصالاتها أسفرت عن الإفراج عن الصيادين"
