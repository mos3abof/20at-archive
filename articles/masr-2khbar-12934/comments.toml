author = "الخارجية كدابة"
posted = "2009-08-15"
text = "مفيش مسئول مصرى لة اى فضل علشان ينسبوا اى نجاح لهم<br />دول ناس كدابين<br />الصيادين لم يجدوا اى احد يهتم بهم فغامروا<br />وكان منهم مجندين سابقين فى الجيش ويعرفون استخدام السلاح والاشتباك ونجحوا وهربوا<br />تحية للصيادين<br />احنا شعب بلا حكومة<br />يعنى اللى يقع فى مشكلة يخلص نفسة لان مفيش احد هينفعة ولا سفير ولا وزير لانة كلة هايص فى مارينا وبيبطبط فى مياة الساحل الشمالى وبياكل جمبرى فى الشرم وبعدين يسمع ان الصيادين هربوا يجرى يكتب تقرير خرافى وهمى لعنتريات لم تحدث علشان ترضى عنهم القيادات السياسية"
archived = "2009-08-16"
capture_url = "https://web.archive.org/web/20090816222803/http://www.20at.com:80/masr/2khbar/12934--t.html"

