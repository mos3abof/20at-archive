[[comments]]
order = 3
subject = "ال سعود والخيانه"
author = "وزعت ووكالة اسوشييتد برس تقريرا مطولا عن سياسة آل سعود في الاستحواذ على أموال الدولة واعتبارهم الدولة"
posted = "2006-07-19"
text = "إقطاعا خاصاً لهم<br />وهنا ترجمة مختصرة لهذا التقرير<br />نادرا ما يطلع فجر يوم جديد على هذه المملكة الصحراوية إلا ويصل فيه حاج أو معتمر إلى مكة, ويضخ فيه نفط للعالم, وماذا بعد؟<br />يولد مولود ذكر للعائلة الحاكمة آل سعود<br />في انتظار هذا المولود, الذي يضاف إلى الآلاف ممن سبقوه, راتب خيالي وهواتف مجانية وخدمة كهربائية مجانية, وكذلك مقاعد<br />درجة أولى في الخطوط لأي مكان في العالم<br />وفي انتظاره كذلك موقع رفيع في أحد الأبراج العاجية في إحدى الإدارات الحكومية, وحظ وافر من العمولات وشراكة أكيدة في<br />أحدى المؤسسات التجارية الرابحة<br />هذا التكاثر في الأمراء هو باختصار ما سيحول الوضع في المملكة إلى معضلة هائلة<br />تقول صحيفة إيرانية \"أن دورهم غير المحدود في نظام السلطة سيؤدي إلى مصير أسطوري\", ويؤكد ذلك محلل إسرائيلي حيث<br />يتوقع أن تقوم قيامتهم عن قريب حين يموت الملك ويصطرع المئات على العرش<br />على تلك الرمال وتحت وئيد الشمس تحيط بك المخابرات فلا تكاد تسمع كلاما ناقدا لآل سعود, اللهم إلا ما يهرب تهريبا مثل<br />مذكرات الأميرة التي رمزت لنفسها باسم سلطانه<br />تقول سلطانه في تلك المذكرات التي نشرت في كتاب الأميرة , واأسفاه لقد أزاح اندفاع الأمراء الأغنياء كثيرا من أبناء عمومتهم<br />يبدو أننا لن ندرك أبدا بقية المتعة بمال النفط<br />على مدى الطرق الفسيحة وفي شمال الرياض في جو الصحراء الصافي, يبهرك لمعان قصورهم الرخامية التي تراها خلف بوابات<br />يحرسها رجال الحرس الملكي<br />حدائقهم الغناء تسقيها المياه المقطرة التي جلبت من على بعد ثلاثمائة ميل من الخليج<br />وتجوب سيارات الرولزرويس والكاديلاك تلك الشوارع الهادئة, وعلى مسافة قريبة تقف الطائرات الخاصة في المطار على أهبة<br />الاستعداد لرحلات التسوق عبر القارات<br />في جدة وغيرها من المراكز التجارية يتربع أبناء الأسرة وأقاربهم على كراسي رئاسة مجالس الإدارات في520 شركة سعودية<br />حسب إحدى الإحصائيات<br />أما هنا في العاصمة فإن أبناء الأسرة يحتلون كل المناصب الرئيسية في الحكومة, الدفاع, الداخلية, المخابرات, وآخرون لوزارات<br />أخرى<br />وكل منطقة يحكمها أمير أو نسيب للأسرة<br />وكل المناصب الحساسة في الجيش يسيطر عليها الأمراء , إنهم تماما مثل نواب ستالين<br />تقول منظمة حقوق الإنسان , بيت الحرية : أن آل سعود يحكمون البلد تماما كما لو كان إقطاعا أو ملكا خاصا لهم<br />مصدر حكومي رسمي قال إن عددهم2700 أمير وأميرة<br />بينما قدرت إحدى النشريات الأمريكية الرسمية عددهم بـ 4000 أمير<br />أما سعيد أبو الريش, الذي ألف دراسة نقدية عن هذه العائلة, فقد استقر تقديره على7000 أمير وأميرة, وقدّر أنه يولد في العام الواحد<br />عدة مئات من الأبناء الذكور لهذه العائلة<br />لقد كان لبعض أحفاد عبدالعزيز شأن وسمعة عالمية , لكن آلافا أخرى ممن يطلق عليهم لقب أمير يقضون أيامهم في الخفاء الممتع مع<br />صفوة \"النفط\" الخاصة<br />تقول إحدى النساء التي تسمر مع الأميرات: إنهن يراقبن أفلام الفيديو ويقضين وقتا في الاستراحات, ويسافرن لأوروبا للتسوق<br />وتقول كذلك: خلف أسوار القصور تتم ممارسة أمور سيئة , الإسراف في شرب الخمر والإسراف في المخدرات<br />أمور كان يمكن أن يُقتل من أجلها مرتكبها أو يُعاقب عقابا شديدا لو لم يكن من الأسرة الحاكمة: تقول هذه المرأة كذلك: إنهم يدخنون<br />الحشيش و يحبون الكوكايين , ويجلبون كل ذلك بأنفسهم لأنهم لا يمكن أن يُفتشون, والجنس<br />إن خدمة الهاتف مجانية, وهي حق لأبناء الأسرة منذ الولادة, كما هو حقهم في كل الخدمات مثل الكهرباء والماء ومقاعد مجانية في الخطوط الجوية<br />هذا الحق الولادي \"الوراثي\" يتضمن كمية هائلة من النقد منذ اليوم الأول من الولادة<br />إن أقل راتب يستلمه رضيع في الأسرة هو10000 عشرة آلاف دولار في الشهر, كما ذكر لي مصدر مطلع على حساب الأسرة<br />الداخلية<br />عدد كبير من الأمراء يستلم مخصصات أخرى سوى الراتب بصفته من أبناء الأسرة مثل المخصصات التي تصرف لهم كموظفين<br />في الدولة سواء موظفين حقيقيين أو أسماء موظفين فقط لأجل أن يصرف لهم الراتب<br />لكن أموال النفط تصل الأسرة بطرق أخرى غير تلك لقد سجل الملك فيصل كل أراضي الدولة بأسماء أبناء الأسرة ثم عاد هؤلاء فباعوها على الدولة لإقامة الجامعات والمطارات<br />بالبلايين وصنعوا من ذلك مجدا ومالا وفيرا<br />هذه \"الخطوط\" يزداد حجمها من خلال عقود الدولة وغالبا ما تجد الأمير أو قريبه وقد حظي بعقد ضخم وعمولات<br />قال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153316/http://www.20at.com/article2.php?sid=1083"

