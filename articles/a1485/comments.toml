[[comments]]
order = 0
subject = "اللهم صلى على النبى"
author = "صراحة مش لاقى تعليق يعبر عن مدى سطحية وهيافة الاخوة رافضى فكرة التجنيدالالزامى"
text = "انا شايف انهم عديمى المسؤلية وانهزاميين<br />يعنى يبقى افضل لو الاشكال دى ماتدخلش الجيش لان الجيش لا يتحمل وجود عيال فيه<br />كل واحد فاكر نفسه رامبو<br />يعنى الجيش ما هيصدق يلاقى كوتوموتو دخل الجيش يقوم يعلن الحرب على اسرائيل وامريكا علشان يا ناس يا عسل المرعب وصل<br />ايه هو اللى مالوش لازمة يا دفعة؟<br />الجيش؟<br />فعلا مالوش لازمة لأمثالك اللى عايزين يقعدوا فى البيت ينتظروا عريس يستتهم ويهننهم<br />البنات عايزة تخش الجيش والرجالة حماة الأرض والعرض مش عايزين<br />عال والله<br />انا رأيى كمان ان الرجالة تحبل وتولد بالمرة<br />جاتكو خيبة جيل منيل<br />ربنا يسترها على البلد من الجيل التافه ده ابو بنطلون تحت السليب<br />انتم منتظرين ايه من واحد بينزل البنطلون لتحت علشان يظهر ماركة السليب اللى لابسه<br />انا عن نفسى منتظر اليوم اللى نمشى فيه من غير بنطلون علشان السليب كله يظهر<br />وبعدها ربنا يستر والسليب نفسه مايبقالوش لازمة<br />وانا من رأيى ان الموضوع ده افضل انه يتقفل علشان ده مش فى المصلحة ابدا<br />وهايفضحنا قدام الناس ويعرف عدونا نقطة ضعفنا<br />سيدنا النبى عليه الصلاة والسلام قال<br />اذا بليتم فاستتروا<br />صدق رسول الله<br />واللهم ارفع البلاء عنا<br />مجند سابق بيترحم على ايام الجيش ايام الرجالة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143608/http://www.20at.com/article.php?sid=1485"

