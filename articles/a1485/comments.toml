[[comments]]
order = 5
subject = "انتوا بتسموا البتاع اللى عندنا دة ........ جيش"
author = "الله العظيم يا جدع كلام عجيب و غريب مين دة اللى نفسة يدخل الجيش و يتعلم ....!!! حاجة تضحك تتعلم اية هوا هناك غى حد بيعلم التانى حاجة الشباب ذى مادخل ذى ماخرج كل ذى القلة و بلاليص كمان هتقولى مدفعية جوية برية بحرية...... مهلبة كل فشنج و اخرهم مسكوا بندقية يوغسلافى من بتاعة المقاومة الشعبية فى حرب 56 بجد مابهزرش ولا حد اتعلم ولا حد هاينفع البلد لو دخلت حرب الا لو كاموا دروع بشرية"
text = "كل بلاد الدنيا المحترمة بتهتم بتغذية الفرد المقاتل و تثقيفة فى مصر ياكلك عدس و مكرونة مقلية و يبهدلك قال اية ساعة الحرب مفيش اكل لازم تدرب و تلاقى العيال هفتانة و خسة و صحتها فى النازل و فى التدريبات بيجرى يزك دى لو ما زوغش من الطابور و راح قعد فى الكانتين طبعا..... دى كلام فارغ و عطلة للشباب و محدش بيتعلم ولا بيتدرب ولا هاينفعوا البلد<br />و بلاش نشتغل بعض و نصدق كدبة النظام والحوارات دى هيا طبور الصبح و الشخططين اياهم و دمتم لله و الوطن<br />و سلملى على الشرطة العسكرية<br />الحمد للة تأجيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143608/http://www.20at.com/article.php?sid=1485"
