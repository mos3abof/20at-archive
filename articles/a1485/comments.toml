[[comments]]
order = 2
subject = "الجيش وأيامه السودة"
author = "دعو كل شاب إنه مايخشش الجيش"
text = "لأنه هيتشتم بأبوه وامه وهيتمسح بكرامته الأرض<br />وأنا جربت ياجماعه والله ماكرهت البلد دى إلا لما دخلت الجيش وشوفت الأهانه على حق<br />علشان كده بقولك أقعد فى البيت أحسن<br />أخوكم<br />مجند سابق<br />بكالوريوس تجارة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143608/http://www.20at.com/article.php?sid=1485"

[[comments]]
order = 3
subject = "هشتكنا وبشتكنا يا ريس... دا انت والنعمه كويس"
author = "ول حاجه احب اشكر بابا حسنى مبارك بجد والله انه رحمنا من الجيش وعمرى ماكنت اتصور انتى فيوم اترحم من الجيش كان زى الكابوس الواحد مش قادر يفوق منه بس الحمد لله عدت على خير واخدنا تاجيل اكتر من دفعه يعنى من 11/61/82 لحد 25/5/85 بالنسبه للتجاره يعنى ياروح مابعدك روح كده الواحد حاسس براحه وتركيز فى التفكير عن الاول بكتير كان الجيش زى العقبه المستحيل اجتيازها من كل ناحيه شغل, دراسه, دورات. لازم يكون الجيش اختيارى. صوابع الايد مش زى بعضها انا مبحبش الحياه العسكريه فى حين اخويا زعل انه مدخلش الحربيه والجيش يعنى امن الدوله مش فى خطر لو الجيش مبقاش اختيارى. بالنسبه الراجل بتاع السلب احب اعلق عليه سريعا ولو ان كل واحد حر فى رئيه بس فعلا من قرائتى لرئيه يدل على انه دخل جيش ومش عايز اعلق اكتر من كده وشكرا"
text = "تاجيل ورحمه من الجيش<br />slvn_1@yahoo.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143608/http://www.20at.com/article.php?sid=1485"

