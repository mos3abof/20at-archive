subject = "و اعدوا"
author = "محمود ابراهيم"
text = "\\\"و اعدوا لهم ما استطعتم من قوة و من رباط الخيل ترهبون به عدو الله و عدوكم و آخرين من دونهم لا تعلمونهم الله يعلمهم وما تنفقوا من شئ فى سبيل الله يوف اليكم و انتم لا تظلمون\\\" انى ولله لاتعجب من موقف حكامنا و خوفهم من مواجهة العدو الصهيونى رغم ان الله سبحانه و تعالى قد اعطاهم الحل فى هذه الآية الكريمة و المثال امام اعيننا فكلنا يعرف غزوات الرسول و اصحابه و كيف واجهوا المشركين و انتصروا عليهم باذن الله قد تقولوا لى ان هذا كان فى الماضى و ان الرسول كان معهم ولكن اقول لكم ان الآية موجهة للمسلمين فى كل زمان و مكان و ليس للرسول وانظروا الى المقاومة و هى تلقن العدو الصهيونى درسا قاسيا رغم انخا تواجه جيش منظم مسلح باحدث الاسلحة و ذلك لانهم توكلوا على الله و عملوا بالآية فادعوا لهم بالصمود والنصر<br />اللهم اعز الاسلام و المسلمين<br />و اذل الشرك و المشركين وانصرنا على اعداء الدين"
