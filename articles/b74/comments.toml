[[comments]]
order = 0
subject = "وانا عايز"
author = "عايز أطلع السلم"
posted = "2005-12-14"
text = "إعلان رائع لسة فاكره مع انه اتذاع وانا صغير قوي<br />كان عندي 27 سنة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113256/http://www.20at.com/article2.php?sid=74"

[[comments]]
order = 1
subject = "طيارة"
author = "أنا بقى كان نفسي أطلع طيارة و كنت كل ما أقول كده لحد يضحك عليه و يقولى ماتطلعي اوتوبيس أحسن."
posted = "2005-12-14"
text = "و في فترة كان نفسي أطلع عالمة فضاء.<br />على فكرة انا مهندسة معماريه<br />كان لي واحدة صاحبتي كان نفسها تطلع يا دكتورة يا رقاصة."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113256/http://www.20at.com/article2.php?sid=74"

[[comments]]
order = 2
subject = "جميل جدا"
author = "محمد عجم"
posted = "2005-12-14"
text = "فكرة حلوة يامني والتناول افضل<br />بالتوفيق دائما"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113256/http://www.20at.com/article2.php?sid=74"

[[comments]]
order = 3
subject = "ثلاثيناتى"
author = "حسن محمود"
posted = "2005-12-14"
text = "انا كان نفسى اطلع كمسارى<br />ليه<br />لانه زمان كانت له شنة ورنة وكنت باستغرب<br />لما والدى الله يرحمه كان بيبرقلى<br />الاطرف ان واحد صاحبى دكتور اسنان كان<br />نفسه يطلع عسكرى مرور مش ضابط مرور<br />و بسؤاله اجاب بانه كان يشاهد العسكرى<br />بينظم المرور والضابط واقف مش بيعمل حاجة<br />( اصاب من حيث لا يدرى )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113256/http://www.20at.com/article2.php?sid=74"

[[comments]]
order = 4
subject = "حتى أنا، حتى أنا"
author = "عمير"
posted = "2005-12-17"
text = "الصراحة... كنت أتمنى أن أصبح عامل في بنزينة، أطلب من السائق فتح البنزينة، وأسحب \"لي\" البنزين وأقوم بالتعبئة، كم تمنيت أن أمتهن هذه المهنة. إلى الآن يراودني هذا الشعور..<br />لكن لا أدري، عامل البنزينة ماذا يطلق عليه؟؟؟ \"بنزنجي؟\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113256/http://www.20at.com/article2.php?sid=74"

[[comments]]
order = 5
subject = "بتاع العباسية"
author = "أحمد ماجد"
posted = "2005-12-19"
text = "والله فعلا كان نفسي أطلع منادى ميكروباص , وحتى دلوقتى لما بسمع المنادى بحس انى ممكن انادى أحسن منه, اصلى شايف انها موهبة, على فكرة يا منى دة كان سر , بس ربنا يوفقك عشان الموضوع بجد مكتوب حلوو بالتوفيق"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113256/http://www.20at.com/article2.php?sid=74"

[[comments]]
order = 6
subject = "رغاية"
author = "طماطم"
posted = "2006-03-11"
text = "انا بجد كان نفسى اكون مذيعة فى الاف ام لانى بجد رغاية مووووووووووووووووت وطول النهار لوك لوك لوك لوك لوك لوك وبعدين دى موهبة لازم انميها ولا اية رايكو بدل ما اموت واطق ياريت حد يتوسط ليا ويساعدنى عشان ارغى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113256/http://www.20at.com/article2.php?sid=74"

[[comments]]
order = 7
subject = "انا عيزه اكون سواق"
author = "سارة"
posted = "2006-03-22"
text = "بجد مش هزار انا طالبة جامعيه ونفسى اخلص واشتغل على ميكروباص واكتب عليه للبنات والسيدات فقط ايه رأيكمبجد قولولى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113256/http://www.20at.com/article2.php?sid=74"

[[comments]]
order = 8
subject = "حملة تنظيف ومراقبة التعليقات"
author = "موقع عشرينات"
posted = "2006-10-01"
text = "سوف يتم حذف جميع التعليقات المسفة والخارجة عن حدود الأدب والأخلاق.<br />وأيضاً التعليقات الغير متعلقة تماماً بالموضوع الذي تم طرحه للنقاش.<br />وذلك في إطار الحملة التي يقوم بها الموقع للتخلص من جميع التعليقات الخارجة بجانب المراقبة الدائمة عليها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113256/http://www.20at.com/article2.php?sid=74"
