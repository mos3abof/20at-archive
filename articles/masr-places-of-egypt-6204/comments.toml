[[comments]]
order = 4
subject = ""
author = "ابو اسامة"
posted = "2007-06-16"
text = "الاسرائليين فى شرم الشيخ وعرب وافارقة فى كل مكان والى يدفع يلاقى له بلد<br />هى دى مصر معاك فلوس عيش براحتك وطز فى المصريين انا مش ضد ان الصوماليين<br />فى مصر لكن ضد مبداء ان الى يقدر يدفع هو الى يلاقى مكان والاف الشباب مش لاقى خرم<br />ابرة يسكن فيه مع ان الشقق موجودة و تساع من الحبايب الى معاهم فلوس الف<br />ويا مصرى يا غلبان ملكشى مكان وشوف لك بلدلان دى بقت بلد الى معاه والى معهوش يموت احسن"
archived = "2009-12-08"
capture_url = "https://web.archive.org/web/20091208124346/http://www.20at.com:80/masr/places-of-egypt/6204-2009-06-10-09-11-10.html"

[[comments]]
order = 5
subject = ""
author = "مصري قرفان"
posted = "2007-06-22"
text = "ان ماكانش اللي بيحصل في البلد دة احتلال و استيطان يبقى ايه ؟؟؟ حد فيكم فاكر قصة الهكسوس اللي حكموا مصر زمان؟ اهم دخلوا مصر و قويت شوكتهم بنفس الطريقة : هجرات متتابعة و استيطان لحد ما زاد عددهم بشكل كبير و انقضوا على الحكم بعدها. و نفس الشيء حصل مع فلسطين من اليهود. و دة اللي حيحصلنا لو موقفناش موجات الهجرة الافريقية دي عند حدها فورا قبل ما تقع الفاس في الراس."
archived = "2009-12-08"
capture_url = "https://web.archive.org/web/20091208124346/http://www.20at.com:80/masr/places-of-egypt/6204-2009-06-10-09-11-10.html"

