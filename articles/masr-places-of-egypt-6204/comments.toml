[[comments]]
order = 1
subject = ""
author = "اكتب اسمك هنا"
posted = "2007-06-08"
text = "مش ممكن بجد اللي بيحصل في البلد دي حاجة تقرف مش كفاية متكدسين على بعض و عندنا ملايين العاطلين كمان بيسمحوا ببساطة لأي واحد عايز ييجي يقعد براحته و يزاحم الناس في رزقهم و سكنهم لا و كمان بيجيلهم فلوس على الجاهز من برة و يقضوها صرمحة و عربدة في الشوارع؟؟؟… الواحد بقى بيمشي في مناطق مش حاسس انه في مصر من كتر الأفارقة اللي حواليه ايه اللي بيحصل دة يا حكومة اصحوا بالله عليكم و حطوا ضوابط للمهزلة دي قبل ما تستفحل…عدد اللا جئين الأفارقة في مصر بيقولوا بقى 4 مليون مفيش بلد في العالم فاتح حدوده على البحري بالشكل دة . لو استمر الموضوع دة حيوصل لمرحلة تهدد الأمن القومي خصوصا ان الافارقة دول بيتكاثروا و يتناسلوا بسرعة مرعبة. الواحد بقى يخاف على مستقبل ولاده بعد كدة. ***أغلقوا الحدود في وجه اللاجئين و كفاية قوي لحد كدة***"
archived = "2009-12-08"
capture_url = "https://web.archive.org/web/20091208124346/http://www.20at.com:80/masr/places-of-egypt/6204-2009-06-10-09-11-10.html"

[[comments]]
order = 2
subject = ""
author = "نيفين نيفى نوفا"
posted = "2007-06-09"
text = "صوماليين ف ارض اللوا و عراقيين ف مدينه نصر و يا عالم ايه تانى<br />و الاكيد ان تلاقى حد يقوللك بكل عدم فهم لمعنى الكلمه مص ام الدنيا و انا بقول لو كانت الضريبه اننا نتحول لملجأ للاجئى العالم التالت فالجواب مش عايزين مصر تبقى ام الدنيا<br />و الادهى انهم بتلاقى عند معظمهم كميه من التبجح لا رباس بها ..و ف ف القاهره اليوم فتح عمرو من فتره ملف العراقيين فى مصر و فوجئنا بكلام مثل الصاعقه و هما بيقولو يعنى ايه غلينا اسعار الشقق اذا كان اساسا الشقق دى انتو معاكوش فلوس علشان تسكنو فيها و يقصدو طبعا الشقق ف الامناطق الراقيه اللى كتير من المصريين البسطاء ميقدروش يسكنوها<br />حتى لو ده صحيح هل تبقى دى الطريقه<br />بلا افارقه بقى بلا عرب<br />حاجه تقرف"
archived = "2009-12-08"
capture_url = "https://web.archive.org/web/20091208124346/http://www.20at.com:80/masr/places-of-egypt/6204-2009-06-10-09-11-10.html"

