text = "انته قايلين صوماليين وافارقه وعرب وكمان مصر ام الدنيا وانكم فاتحين ملجا شوفوا نفسكم اول انته كلكم لاجيئين في دول الخليج وعاملين تجمعات تقول عايش في مصر شو حلا ل عليكم وحرام على غيرك وبعدين انتو اصلا طبعك زي الزفت صراخ ومشاكل حلو مشاكلكم اول بعدين اتكلمو على الناس"
archived = "2009-12-08"
capture_url = "https://web.archive.org/web/20091208124346/http://www.20at.com:80/masr/places-of-egypt/6204-2009-06-10-09-11-10.html"

[[comments]]
order = 7
subject = ""
author = "فتحية"
posted = "2009-11-11"
text = "الحمدلله إني مش في مصر،مدام هذا تفكير بعض الناس عندهم<br />يا أخي من كرم الضيافة وطيب الاصل انكما تتضاق من اي ضيف يحل عندك او في وطنك<br />ايضا الصومال فيها مصريين وعايشين فيها كما لو انهم في مصر ، وعندنا الكثير من الأفارقة القادمين من كينيا واثيوبيا، ولا احد يضايقهم مع انهم اناس لا يعرفو من الدين عير الاسم ولا يصلون وجاهلون ويتعاملون بالسحر وغيره ويشوهون بعض المدن حيث يبنون العرشان في كل مكان رغم انهم يملكون المال ويعملون، والصومالين رغم هذا لا يتدخلون بهم<br />لماذا انتم المصريون هكذا تخافون على لقمة العيش ؟؟؟؟؟؟؟ ألستم مؤمنين!!!!!!!<br />ألا تعلمون ان الله يرزق النملة السوداء في الليلة الظلماء تحت الصخرة الصماء<br />وان الله رازقك ولو اجتمع اهل الارض كلهم في وطنك<br />قليل من الايمان يعالج مشاكلكم وهمومكم ويعالج القلوب الحاقدة على اخوتها."
archived = "2009-12-08"
capture_url = "https://web.archive.org/web/20091208124346/http://www.20at.com:80/masr/places-of-egypt/6204-2009-06-10-09-11-10.html"
