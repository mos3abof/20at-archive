posted = "2008-10-21"
text = "شكرا لك على هذه التدوينه<br />فعلا صورة ولا اروع من كده ,, واروع يعني ممكن اجمل وممكن اروع من حيث الورع ,<br />والله ما اجملها يكون القران فيها جليسك, تتغنى بالقران ,<br />عجبتني جدا الصورة<br />والله اعلم الراجل ده من 10 سنيين كان حاله ازاى ؟<br />يمكن تاجر او صاحب ورشه , والوادة حواليه ,<br />دلوقت كله اتجوز او سافر<br />ومراته يمكن ماتت<br />ولقى ان مفيش جهد له على التجارة<br />ياه<br />يمكن الصورة حسستنى بالوحدة الى ممكن تحصل لاى شخص<br />يمكن حسستنى بالبرد<br />يمكن بقرب الاجل<br />يمكن بالراحه النفسية<br />يمكن بالخوف<br />يمكن ,,<br />لكن الاكيد انها من اجمل الصور ."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105152307/http://20at.com/masr/egyptian-blogs/10257.html"

