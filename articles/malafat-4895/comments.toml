order = 0
subject = "21 حقنة"
author = "حسين عبد الظاهر"
posted = "2006-12-11"
text = "المفروض الواحد قبل ما يقرأ الملف بتاعكم ياخد 21 حقنة .. هى ليه طلبت كلابي معاكم؟!<br />المهم .. من أطرف ما قرأت فى موضوع الكلاب أن فيه واحد إماراتي اشترى نجم فى السماء (تم اكتشافه مؤخرا من إحدى جمعيات الفلك العالمية) .. اشترى صاحبنا النجم بميالغ طائلة ليطلق عليه فى النهاية اسم كلب الصيد الذى يملكه ..<br />يموت الصحفى فى الإمارات جوعا.....ونجم السما ينسب للكلاب"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045447/http://masr.20at.com:80/article.php?sid=1283"

[[comments]]
order = 1
subject = "يالا نهوهو .. نعض .. نتسعر حتى"
author = "إبن بهيه"
posted = "2006-12-11"
text = "خير اللهم اجعله خير .. بعد الليلة الكلابي اللي قضيتها امبارح مع موقع ولاد البلد واتنبح حسي من التعليق على كل المواضيع تقريباً .. جالي فيما يرى النائم بعض التفسيرات لهذه الهبه العجيبة من ولاد البلد .. طبعا مش صدفه مطلقا ولكنهم مبيتين النيه من فتره عشان يطلعوا علينا كده في الضلمه بالمواضيع ديه .. قصدهم إيه ؟؟؟ أكيد قصدهم كلابي برضه .. بس كل واحد يفكر فيها بطريقته وعلى حسب رؤيته للكلب .. فمن يحب الكلاب ويحن عليهم ويتعاطف معهم سيشعر بأننا كلنا كلاب .. غلابه .. مستنين الكسره تترمي لينا وسيدنا مستكترها علينا .. نعمل إيه ؟ نزلنا هبش في بعضنا زي ما هو حاصل دلوقتي ..الشعب كله بيعوي ويقول جاي ويهوهو وينهش في بعضه وصاحب السيرك واقف يضحك من بعيد هو وعصاباته القذره ..<br />واحد تاني بيحتقر الكلاب وبيعتبر نفسه أرقى منها في السلم البيولوجي بدليل ضمور الذيل لديه فلم يعد بحاجة إلى لفه خلف ظهره ، فهذا الأخير سيرى الموضوع من زاوية زيادة عدد الكلاب المسعوره التي أتت إلينا من كل صوب وحدب لتنهش في بلدنا وفينا برعاية الكلب الأكبر ونجله البايخ .. الجرو الصغنن بتاع لجنة العكوسات اللي جابهولنا من كام سنه يتعلم فينا العضعضه هو والكام جرو اللي كانوا بيلعبوا معاه في الخرابه إياها ..<br />واحد تالت سيكون كالأغلبية التي ترى النقيضين معاً .. مرة الكلب حلو .. ومره إبن ستين كلب ..وستين دي من باب المبالغه في الكلبيه والتأكلب باعتبار أنها شتيمه مركزه أو مكبره ستين مره .. يعني لما يلعنوا حالهم ويلعنوا اللي وصلوهم للحال ده يبقى الكلب هو المعبر عما يجيش في صدورهم من رغبات متوحشه في العض وأكل لحم مبارك الواطي وعصاباته ولو أن لحمهم قذر ونتن وأكيد يجيب تسمم .. ولما يحسوا بالغلب والقرف والعذاب والحرمان من كل شيء حتى رغيف<br />اقرأ بقية التعليق .."
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045447/http://masr.20at.com:80/article.php?sid=1283"

