author = "المتحدث باسم حركة فتح"
posted = "2006-06-17"
text = "انا ابن فتح وارجو انكم تسيبو المونديال وتعالو شوفو ايش بيصير في فلسطين<br />المونديال مو اهم من ابناء شعب فلسطين<br />وتعالو شوفو الحمساوين شو بيسو في ابناءشعب فلسطين اما صحيح انهم كلاب قاعدين بيتفرجو علي المنديال زي البدو الي خاشش لمدينة<br />وبس خلاص<br />المتحدث باسم حركة فتح"
