[[comments]]
order = 0
subject = "الوصله هي الحل"
author = "الاستاذشيكو"
posted = "2006-06-06"
text = "اولا انا بقراء الموضوع وانا مش مهتم خااااالص اصل انا من بتوع الوصلات وعندي وصله بادفع عليها اشتراك 15 جنيه في الشهر وكده اشطه اوى<br />اما حكايه الامن يقوم بحملات ده كلام فاضي لان البيه الظابط عنده وصله بس دي من غير فلوس يعني لو عايزة ART تعمل حمله علي الوصلات تدي البيه الظابط اشتراك سنه واحسبوها انتو بقه شوفوا كام ظابط هاياخد اشتراكومش هو بس لااااا واصحابه وحبيبه ومعارفه اصل كلهم عندهم وصلات ببلاش كده<br />وانبقه سلملمي علي محدودي الدخل<br />الوصله هي الحل<br />والله وعندنا شيخ قالي انها حلال لان الموضوع من الاول مش احتكار علي شبكه واحدة"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025524/http://masr.20at.com:80/article.php?sid=468"

[[comments]]
order = 1
subject = "لا انا دفعت و هتفرج"
author = "إسلام غباشي"
posted = "2006-06-06"
text = "هاها.... في ناس عايشة لسه في الوهم و فاكرة إن التلفزيون هيزيع و أنا بقول لا كانو زاعوا متشات الأهلي في البطولة الأفريقية يا باشا كله بيقبض من كله ... وعلي فكرة أنا كان عندي وصلة بس والله قبل اول شهر ما يخلص كنت غشتركت في راديو تلفزيون العرب لاني لقيت الفرق في المعلقين و مواعيد الماتشات يا رجل ده قبل اللعيبة ما تنزل بيكون الأرسال جي من الملعب مش ولاد ال... ساعت متش السته لمل رضا شحاته جاب الجون و هم لسه في الأعلانات<br />و ارجه ان محدش يزعل مني"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025524/http://masr.20at.com:80/article.php?sid=468"

