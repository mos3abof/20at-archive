text = "بسم الله الرحمن الرحيم<br />انا أبو وديع المونديال حلو كتير كتير ومبارح الفريق الانجلتري نال اعجابي حيث في الشوط الاول حقق 3 أهداف متتالية<br />والفي الشوط الثاني كذالك امام فريق صربياوانا بطالب فيكم انك تدوني تررد محطة بتجيبو مباشر وارجو تلبو الطل وبس خلاص"
