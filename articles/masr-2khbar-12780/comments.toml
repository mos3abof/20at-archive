subject = ""
author = "استطلاع اية"
posted = "2009-07-29"
text = "دة كلة تمام يا افندم<br />وكلة عظمة يا ولى النعم<br />فية بس اتنين مليون مصرى بيعيشوا فى المقابر ودى مشكلة سهلة خالص وجارى التخلص منهم بالتيفود<br />وفية 10 مليون بيعيشوا فى العشوائيات فى وسط الزبالة والخنازير والدويقة وعشش الترجمان ومنشية ناصر<br />وفية 50 فى المية من الناس تحت خط الفقر<br />وفية 9 مليون عانس يا ولى النعم لان ثمن الشقة بقى اكثر من مائة الف جنية علشان اسعار حديد الباشا عز<br />يا ولى النعم مصر وقفت فى طوابير الخبز الحاف<br />هنقول اية يا مولانا<br />انهيار التعليم<br />انهيار الخدمات الصحية<br />الدروس الخصوصية وعدم وجود دواء فى المستشفيات<br />سيارات نقل مرسيدس للامن المركزى كل دى خدمات للشعب الناكر للجميل ا لجاحد<br />شعب متفرعن لا يشكر النعم والخير اللى هو عايش فية<br />احنا والحمد عندنا اربعين مليون خط محمول وعندنا الشوارع مليانة عربيات فاخمة<br />وعندنا الخير للركب<br />ولى النعم السيد المحافظ مش مخلينا محتاجين اى حاجة<br />النتيجة لازم تطلع 100 فى المية فى استطلاع الحزب<br />انما 60 فى المية فدة تزوير واضح<br />الناس مبسوطة وفرحانة والوظايف بالزوفة<br />يعيش الحزب الوطنى بانى مصر الحديثة ورافع راية عزها"
archived = "2009-08-01"
capture_url = "https://web.archive.org/web/20090801005403/http://www.20at.com:80/masr/2khbar/12780-2009-07-29-06-15-56.html"
