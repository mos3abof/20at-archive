author = "mohamed helal"
posted = "2009-11-11"
text = "والله العظيم قمة الهيافة وهم دول المسلمين فعلا بيجروا ورا ماتش كورة - حد يقدر يقوللي االي هيروح الماتش هيصلي اصلا في اليوم ده ولا لأ - لازم طبعا يخش الاستاد من الساعة 12 الظهر او 1 أو 3 مش مهم طبعا الصلاة ولكن مهم الحق الماتش - حد عنده فكرة عن اللي ممكن يحصل في الماتش ده - والله ممكن يحصل قتل من الجمهور الجزائري في الملعب ودول مهما كان مسلمين - هم دول المسلمين فهلا ماتش كورة يجمعهم - حد بيفكر يعبد ربنا في الوقت ده - قد ثبت في صحيح مسلم ان رسول الله صلى الله عليه و سلم قال (عبادة في الهرج كهجرة الي) - ربنا يهدينا يارب"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121352/http://www.20at.com:80/masr/news/13969-2009-11-09-07-13-08.html"

