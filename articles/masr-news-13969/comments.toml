posted = "2009-11-11"
text = "سوف يسطتيع المنتخب المصرى التغلب على الجزائرين نظرا لأكتمال صفوف المنتخب المصرى وهو المنتخب الذى أحرج البرازيل وأكتسح المنتخب الايطالى فهل يعد المنتخب الجزائرى بقوة البرازيل او ايطاليا وبالنسبه لزيدان حقه فى ان يشجع منتخب بلده الاصلى لكن لماذا لم يلعب معه من قبل ان يصبح بلا حيله"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114121352/http://www.20at.com:80/masr/news/13969-2009-11-09-07-13-08.html"

