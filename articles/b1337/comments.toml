subject = "الفرق واضح"
author = "ياسر ابو عمار"
posted = "2006-10-12"
text = "الله ينور يا استاذة منى ،ثم ان الفرق واضح بين العمالة والتبعية وبين الشرف والبطولة \"،هل يمكن ان نقارن الماء بالنار \"،او الشمس بالظلام \"،يا سيدتى شعوبنا تعرف من يقف فى خندقها ومن يقف فى خندق الاعداء او يقف فى خندقها فى انتظار لحظة معينة ينتقل فيها سريعا مهرولا الى الخندق الاخر \".الف تحية لهنية ومشعل وسعيد صيام واخوانهم \"،الف تحية للاخوان المسلمين المناضلين فى كل مكان ضد الظلم والعمالة وبيع الاوطان .المعركة محسومة لصالح الشرفاء والمجاهدين ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124755/http://www.20at.com/article2.php?sid=1337"
