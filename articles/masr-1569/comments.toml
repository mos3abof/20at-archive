[[comments]]
order = 2
subject = "السبب معروف"
author = "كفاية بقى مسخرة وسفاله أظن الشعب كله عارف ليه بيتعمل كده فى الإخوان وطبعاً الهيجان عليهم ده كان مترتب له بعد القضاء على المعارضة واحد واحد فبعد أن أنتهى الصوت القوى الفاضح لفسادهم هو طلعت السادات إبتدوا باللى بعده وهما الإخوان المسلمين من ناحية علشان يقدموهم قربان لأمريكا إللى أبتدت تهمشهم علشان بقوا عبء عليها من كثرة إنفاقها عليهم ومبيقدموش إى جديد ليها وطبعاً كل الدلائل بتقول إنهم أقصوا العميل مبارك من حساباتهم وطبعاً دى ضربة قوية علشان مش هايقدر يورث الحكم للمختل إبنه وخاصة وهما عرفين مدى تأييد الشعب للإخوان وده إللى خلى مبارك يجرى يحتمى بإسرائيل بعد لما لقى الإقبال على صناديق أنتخاباتهم من الشعب لكن كل الكلام ده معروف ومش محتاج إن الشعب يكرره"
posted = "2007-02-11"
text = "الحل الوحيد دلوقتى هو ثورة الشعب وتأييدهم الفعلى للإخوان لو الشعب معملش كده يبقى يتحمل كل إللى ها يحصل له من فساد إبن مبارك الأشد قذارة من أبوه<br />مهما عملوا مش هايقدروا يخلوا الشعب يكره الإخوان ومايؤيدهمش عيب على مبارك القذر ياريت ضميرة يصحى ولو مرة واحدة قبل مايقابل ربنا<br />إحنا كلنا عارفين إنه واقع تحت تأثير اليهودية العميلة مراته والمختل إبنه لكن فى النهاية هو إللى ها يتحاسب والله المنتقم الجبار"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

[[comments]]
order = 3
subject = "إلى إدارة الموقع الكريم"
author = "هادى الحبشى"
posted = "2007-02-11"
text = "إلى إدارة الموقع الكريم<br />نرجوا إتاحة الفرصة والتعبير الصادق عن كل المعارضة فإنتم تهاجمون المعارضة فى الوقت الذى تفسحون فيه الفرصة كاملة للحزب الوطنى ولمبارك وإبنه<br />نرجوا تطهير الموقع من اللينكات القذرة التى تضيفها واحدة عجزت عن فرض سطوتها على الموقع فتحاول إلهاء الشباب بهذا الفساد الحقير وهذه السياسة البلهاء<br />نرجوا إتاحة الفرصة لكل المعارضة للتعبير عن أرائها فى هذا الموقع المحبب لنا كشباب والذى نجد فيه فرصة للتعبير عن رفضنا للفساد<br />نرجوا عدم الهجوم على الإخوان المسلمين حيث أنهم المعارضة الأكثر تأييداً من الشباب"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

[[comments]]
order = 4
subject = "يا مبارك"
author = "إذا دعتك قدرتك إلى ظلم الناس فتذكر قدرة الله عليك"
posted = "2007-02-11"
text = "حسبى الله ونعم الوكيل هو الحكم بالعافية لو كان قلبك على البلد مكنتش تعمل كده فى الكفاءات بتوعها إللى الشعب إتحمل الكثير علشان يوصلوا ليها وبعد كده بتعتقلهم<br />يا مبارك الدكتور الشاطر أكفء مئات المرات من أبنك الذى لا يحتمى إلى بإسمك الذى إختلسته بعد إغتيال السادات وانتم مرفوضين من الشعب فكيف تحكم مصر بهذه الروح الشريرة والتعالى الذى لم تصلوا إليه إلا من النهب والسرقة والإستيلاء على أموال اليتامى والفقراء من الشعب<br />يا مبارك ما تفعله فى مصر هو خزى لك فكفانا منك وكفاك فساد الشعب كله يقول لك إرحل يا مبارك أنت وعائلتك مرفوضين من الشعب كله<br />ربنا ينتقم منك ويرينا فيك آية من آيات إنتقامه وتكون عبرة لمن يعتبر اللهم آمين يارب العالمين"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

[[comments]]
order = 5
subject = "لـ السبب معروف"
author = "فارس _fr"
posted = "2007-02-11"
text = "اولا احب احييك على موقفك وعلى رؤيتك الصحيحة للوضع الحالى اللى وصلت اليه البلد من فساد وفوضي وضياع للحقوق , واحب اضم صوتى لصوتك لعل ربنايسمع مننا وتكون فعلا بداية اعصار من الثورات ,ضد الفساد والمفسدين ضد مبارك وكلابه ضد ابنه الشاذ .<br />رجاء منادارة الموقع الموقر :<br />ارجومنكم حذف التعليقات التى وردتفى التعليق الاول والثانى والثالث , ليس فى هذاالموضوع فقط ولكن فى كل الموضوعات السابقة<br />ولكم جزيل الشكر"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

[[comments]]
order = 6
subject = "الإخوان من الشعب"
author = "الأخوان المسلمين دول من أبناء مصر المخلصين ما يصحش نشوفهم بيتعمل فيهم كده ومن قبلهم أيمن نور وطلعت السادات ونقعد نتفرج لغاية لما مبارك وإبنه يقضوا على آخر نفس فينا"
posted = "2007-02-11"
text = "الأخوان هما إللى بيدافعوا عن مصر ضد الفساد وهما إللى فجروا أكبر قضايا الفساد فى مجلس الشعب ليه نتركهم لوحدهم<br />لازم كلنا ندافع عنهم لإن النهاردة الإخوان وإمبارح كان أيمن نور وطلعت السادات وبكره بقيت الشعب إللى ها يقول لا لجمال مبارك<br />يا شباب مصر أخرجوا للدفاع عن الإخوان هما أبناء مصر المخلصين الرافضين لفساد مبارك وعائلته هل قتل الأخوان 1350 مصرى فى العبارة وهربوه برة مصر هل نهب الأخوان املاك المصريين هل باع الإخوان الأغذية الفاسدة واكياس الدم الفاسدة للمصريين وقتلهم به<br />أخرجوا يا مصريين دافعوا عن قياداتكم من الأخوان المسلمين وأرفضوا فساد مبارك وعائلته العملاء إللى نهبوا البلد وباعو أملاك الشعب من مصانع وشركات إللى أغلى أبناء مصر بينتحروا كل يوم لرفضهم للفساد<br />لا لمبارك لا لزوجته اليهودية لا لإبنه المختل عقلياً المدمن ناهب مصر واللى رصيده اصبح 70 مليار دولار فى حساباته فى الخارج منين جابهم غير من دم المصريين ونهبهم<br />أى حد ها يحكم مصر ها يكون أكفء من مبارك إللى السادات قال عليه إنه ملوش خالص فى السياسه فما بالكم بإبنه الفاسد القذر<br />حسبى الله ونعم الوكيل"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

[[comments]]
order = 7
subject = "افهموها بقى .. ينفع هنا برضه"
author = "إبن بهيه"
posted = "2007-02-11"
text = "بمناسبة قيام قوى أمن مبارك الواطي بمنع الصلاة في الجامع الأزهر .. تعليق ينفع هنا برضه ..<br />إلى إخواننا الكرام من جماعة الإخوان المسلمين الذين يحرمون الخروج على الحاكم مطلقاً طالما لم يمنع الصلاة .. ما رأيكم دام فضلكم ؟<br />أهو منعها ..<br />أفتونا وأفيدونا أفادكم الله<br />ولكم التحية ..<br />ألا يستحق مبارك الواطي أن نخرج عليه وتخرجوا معنا اليوم أم متى ؟ وما هي صورة المقاومة السلمية في رأيكم وكيف ؟<br />بعد كل ما حدث للإخوان المسلمين برغم يقيني من براءة هذه الجماعة الطيبة إلا أنني ألوم صبرهم والله .. إن هذا الصبر يا إخوان هو ما أساء لكم في السابق ومازال وسيظل يسيء لكم كثيراً .. كيف ؟<br />لسبب بسيط جدا تعرفونه يداً وهو أن البعض لن يتمكن من الصبر وسينشق عنكم ويخرج وحيداً لمجابهة الحاكم الفاجر الطاغية بالقوة .. نعم ستتخلون عنه وتستنكرون صنعه وتعزلوه من الجماعة .. نعم قمتم وستقومون بذلك ألف مرة قادمة .. لكن هل أنجاكم هذا من إلصاق اتهامات التنظيم السري لجماعتكم منذ تنظيماتها السرية التي ذهبت إلى فلسطين قبل سبعين سنة ؟<br />أعتقد أنه آن الآوان لإعادة النظر في موضوع صبركم هذا .. وإعادة النظر في موضوع المواجهة مع مبارك الواطي .. صدقوني يد اليسار المصري بكل تشكيلاته أطهر كثيرا من يد مبارك النجسة.<br />افهموها بقى ..<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

[[comments]]
order = 8
subject = "ليه الصمت"
author = "يا اخوان ليه صمتكم هل منتظرين إلى أن يقضى عليكم مبارك وإبنه الفاسد وزوجته اليهودية"
posted = "2007-02-11"
text = "أنظروا إلى حماس وكيف يحاربون اليهود وهل يختلف مبارك عن اليهود فى إحتلاله لمصر بدون شرعية ونهبه وتزويره للإنتخابات بعد قتله للسادات<br />أين أنتم يا إخوان ومتى ستقودوا الشعب للدفاع عنه ضد إحتلال مبارك الفاسد له ونهبه وسرقته لمصر وأخيراً محاولته لتوريث الحكم<br />هل الأدب والإلتزام سينفع الشعب للوقوف ضد فساد مبارك وهل التزم مبارك الأدب مع الشعب حتى نرد عليه بالأدب هل نسيتم ما فعله مبارك فى الأنتخابات وضرب ناخبى الإخوان واغلق صناديق الأنتخابات فى وجوههم<br />ما هو ردكم على تشويه صوركم امام الإعلام الخارجى وهل أخذتم فرصتكم الكاملة فى الإعلام الداخلى لإظهار الحقائق للشعب<br />يا أخوان مصر تغرق فى فساد مبارك متى سنتحرك بعد أن باع مبارك مصر بالمصانع والشركات لليهود<br />حسبى الله ونعم الوكيل"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

[[comments]]
order = 9
subject = "يا استاذ ابن بهية"
author = "ابومحسن"
posted = "2007-02-11"
text = "الوضع لا يسمح بذلك<br />ارجو ان تقرأ تاريخ الخلفاء الامويين والعباسيين وتشوف هما كانوا اشد بطشا وتسلطا من حكام الان ومع ذلك استقرت عقيدة اهل السنة والجماعة على عدم الخروج عليهم اطلاقا لان الخروج على الحاكم يؤدي الى الفوضى والاضطراب وفوضى ساعة يرتكب فيها من المظالم ما لا يرتكب في استبداد سنين ويؤدي الخروج الى طمع الاعداء في المسلمين ولأن الناس يخروج من ظلم الى اظلم وان شق على الداعية اصلاح الحاكم فمازال اصلاح المحكومين ميسرا.<br />لطفا يرجى مراجعة عقيدة اهل السنة والجماعة"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

[[comments]]
