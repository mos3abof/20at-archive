text = "الكلام واضح:<br />الخروج على الحاكم يؤدي الى الفوضى والاضطراب وفوضى ساعة يرتكب فيها من المظالم ما لا يرتكب في استبداد سنين ويؤدي الخروج الى طمع الاعداء في المسلمين ولأن الناس يخروج من ظلم الى اظلم وان شق على الداعية اصلاح الحاكم فمازال اصلاح المحكومين ميسرا<br />(من كلام الحسن البصري)"
