subject = "الخروج على النظام قادم قادم"
author = "اصبروا من يستطيع ان يحكم ويتحكم فى الجياع"
posted = "2007-02-11"
text = "هيملى السجون والمعتقلات طيب وبعدين<br />واللة فية ناس بينبسطوا قوى لما يعتقلوهم على الاقل هيلاقى ياكل من فلوس الوسية اللى بتاخد نصف الميزانية اللى هى الداخلية اللى عندها مجندين لمحاربة الشعب اكتر من المجندين فى حرب اكتوبر لمحاربة اسرائيل<br />حكومة هدفها الاول محاربة الشعب وضربة وتسخير المجندين لتعليمهم الكارتية ليضربوا المظاهرات واى مقاومة للشعب<br />الفلوس اللى بتنصرف على قوات القمع المركزى ممكن تبنى مصانع تشغل العطلانين وتبنى شقق يسكن فيها الفقراء<br />لا تلوموا الاخوان<br />انما يضربونهم تقربا وزلفى للحبيب بوش ليرضى عنهم<br />اما المحاكم العسكرية فليست شرعية لاننا لسنا فى وقت حرب ولا المتهم يرتدى الملابس العسكرية<br />فصبرا ال ياسر صبرا"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

