[[comments]]
order = 12
subject = "ايد لوحدها متسقفش"
author = "فارس_fr"
posted = "2007-02-11"
text = "ياجماعة بالراحة عليناشوية , هى البلد فيها اخوان بس , الاخوتان لوحدهم ميقدروش يعملوا حاجه وبعدين الاخوان ياما اتهروا اعتقلات ومصادرت وكل الجبهات الشعبية التانية موقفهاكان المشاهدة فقط ,,,, ليه بدل ما نقوا للاخوان لازم يكون ليهم موقف ويبتدوا يخرجوا على الحاكم الفاسد ,,, ليه الاخوان لوحدهم ,, فين بقية الشعب ,,, لازم كل الجبهات تتحد فى وجه مبارك مش بس الاخوان ..<br />لان ايد لوحدها متسقفش ياشباب لازم ليها ايادى تانية !!!!!!!!!<br />ردا على الاخ الكريم ابو محسن ,, موضوع الخروج على الحاكم , اعتقد ان واحد زى مبارك ده اللى ماشاء الله سنويا فى عهدة بيموت الاف من ابناء مصر -حرقا غرقا برا جوا شنقا اعتقالا ,, مصادرات لاموال الناس ,, سرقات وخصخصة ووووووووو............. مش معقوله مع كل ده تقولى لا يصح اننا نخرج عليه ,, مش معقول اشوف المسلمين فى فلسطين والعراق ودارفور وكل حته فى العالم فيها اضطهاد لانسان مسلم واللى كانت مصر زمان ليها شان فى الدفاع عن المسلمين ,,, مش معقوله بعد ده كله ميصحش انى اخرج عليه ,,, اقولك ايه ولاايه !! ده تاريخ اسود انكتب بحروف من دم المصريين فى عهد مبارك . واظن انك مش غافل عن اللى حصل واللى بيحصل فى عهد ولى النعم مبارك ....<br />واكيد انت قرات على صلاح الدين ياريت تشوف هو عمل ايه مع الفسدة والقتلة من حكام العرب !!!!!!!!!!!!!!"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

