[[comments]]
order = 23
subject = "نداء الى الحاج خليل"
author = "ياسر أبو عمار"
posted = "2007-02-12"
text = "يا عم الحاج خليل ،واضح انك بعيد حبتين عن الدنيا واخر مرة قريت جرايد مثلا او شفت تليفزيون من ييجى 50 سنة،والنبى يا شيخ سكوتك كان احسن ،اديك كنت متدارى فى الناس ،اما وانك اتشطرت وكتبت تعليق تقول فيه ان الاخوان لم يقدموا ابداعا او مش عارف ايه ،فقط اريد ان اخبرك بان الجهل ليس عيبا ولا حراما وان هناك من هو اكبر منك ويعانى جهلا اكثر ،والله يا عمى مش عيب ،العيب انك مسمعتش عن واحد من المبدعين اللى هقولك على شوية منهم دلوقت ،ركز معايا مسمعتش عن واحد اديب كبير اسمه سيد قطب مؤلف واحد من افضل تفاسير القران المعاصرة ،او عبد القادر عودة مؤلف مرجع (التشريع الجنائى فى الاسلام)او الغزالى او القرضاوى او على جريشة او جابر قميحة او الشاعر بهاء الدين الاميرى او الشاعر هاشم الرفاعى او غيرهم كتير قوى من المبدعين فى مجالات كتير قوى مقدرش اقعد اكتبهالك او اكتب اسماءهم الان علشان مش فاضى .يا عمنا ابوس ايدك الانصاف ده منتج ممكن تلاقيه فى اى سوبر ماركت جنبك ،اسال عليه ومتخليش بغضك للاخوان يعميك عن ادراك الحقائق."
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

[[comments]]
order = 24
subject = "قصيدة( اسد فى السبعين) اهداء للشاعر الكبير امين الديب"
author = "المصرى"
posted = "2007-02-13"
text = "الشاعر الكبير امين الديب ابن قرية نكلا وهو للعلم فى السبعين من عمره تعرض للسجن والاعتقال والاهانه وكل تهمته انه يحب بلده ويكتب قصائد فى حب وطنه ولم يكتب اغانى لهيفاء ونانسى كان زمانه راكب شبح وضيف دائم فى التليفزيون<br />(قصيدة اسد فى السبعين<br />وشوبش زغرتى يا نكلا<br />عشان انجبتى عم امين<br />ما قيمتك بيه بقت مليار<br />اسد مع انه فى السبعين<br />كلامه حامى زى النار<br />ما بيخافشى ولا يهابشى<br />ولو ضربوه بألف عيار<br />سلامتك يا أبن مصر يا زين<br />وعندى رجاء لو تسمح<br />انا والدى ربى يغفر له<br />كان مصرى اصيل زييك<br />ياريت<br />اقرأ بقية التعليق .."
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

