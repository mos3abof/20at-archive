subject = "خليل على حيدر"
author = "انت قريب خليل زلماى ؟"
posted = "2007-02-11"
text = "شعر اية ياراجل نصف كم وادب اية وجهل اية اللى بتتكلم علية<br />الناس دى بتوع ربنا بيخدموا الناس الغلابة<br />وبيقرأوا القرأن مش شعر النهود والصدور بتوع قرايبك الخبل المراهقين الكبار<br />يارجل استحى على دمك وبطل النجاسة وروح اتوضى وصلى لك ركعتين وانت رجل جوة القبر ورجل برة<br />ربنا ياخد امثالك بقايا الاشتراكيين الملاحدة"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

[[comments]]
order = 20
subject = "عدة ملاحظات"
author = "حسام الزمر"
posted = "2007-02-12"
text = "السلام عليكم<br />أولا<br />الخروج على الحاكم ليس حرام أطلاقاَ و لكن له ضوابط و توجد عدة رسائل ماجستير و دكتوراه من الجامعات المصرية في هذه الضوابط<br />فحينما تولى عمر بن الخطاب -رضي الله عنه- الخلافة، وتسلم مسؤولية الدولة الإسلامية، خطب أمام الناس، فقال لهم: «من رأى فيَّ اعوجاجاً فليقومه» فقام رجل من عامة الشعب وقال للخليفة الفاروق، المعروف بالمهابة والحزم: «لا، والله لو رأينا فيك اعوجاجاً لقومناه بسيوفنا». فقال الخليفة قولته الشهيرة: «الحمد لله الذي جعل في المسلمين من يقوم اعوجاج عمر»<br />أرجوا الا يفسر كلامي أني أدعوا للخروج على الحاكم و لكني أوضح المبدأ فقط هذا والله أعلم<br />ثانيا<br />الاخوان لهم اضافات ملموسة في مجال الاداب و الفنون<br />ثالثا<br />اقرأوا حكاية الفيل<br />سلام<br />حسام"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

[[comments]]
