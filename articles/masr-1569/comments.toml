subject = "لكم الله"
author = "فهد الا سلام"
posted = "2007-02-11"
text = "رد بس على الاخ بتاع نداء عا جل الى المرشد والله يا اخى امثالك هم نكبة هذا المجتمع لا تعرف شى عن اى شى وفى الا خلر تسب الدين يا اخى سب الدين خلروج عن الملة اتق الله وان كنت تعيب على الا خوان فى نضالهم ضد الظالم فالعظماء كلهم ذقوا مررة السجون والحرية لا تا تى الا با لكفاح فاتقى الله فى نفسك وكفا كم سلبية لا نى امثاللك هما الى رجعونا لللواراء وحسبى الله ونعم الوكيل وتذكر يا اخى ان الله موجود وهناك حساب وسوف يسالك الله ماذا فعلت فى حياتك واذا خطبك الجهلون قالو سلاما دة لو بتفهم"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

