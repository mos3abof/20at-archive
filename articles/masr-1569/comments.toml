[[comments]]
order = 0
subject = "نداء عاجل الى فضيلة المرشد"
author = "يا فضيلة المرشد يرجى التكرم باصدار اوامركم السامية بسحب اعضاء الجماعة من مجلس الشعب والانسحاب من اي معترك سياسي."
posted = "2007-02-11"
text = "ونضيف:<br />ان اول محنة للاخوان كانت في عهد الملك فاروق وذلك باغتيال حسن البنا واعتقال اعضاء جماعة الاخوان المسلمين.<br />وتكررت ايام جمال عبدالناصر<br />وتكررت ايام السادات<br />وها هي تتكرر بنفس السيناريو امام حسني مبارك<br />وحيث ان الجماعة بقالها ما يقارب من 60 سنه ولم تقدم اي شيء الا السجون والمعتقلات والمحاكم العسكرية والخوف والهلع للمواطنين الابرياء.<br />لذا يرجى الانسحاب فورا وبدون شروط وتحويل الجماعة الى جماعة دينية للامر بالمعروف والنهي عن المنكر دون ان يكون لها اي مطامع سياسية<br />وحل عن دين ابونا بسجونك ومعتقلاتك ومحاكمك العسكرية"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

