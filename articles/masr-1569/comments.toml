[[comments]]
order = 17
subject = "جندل"
author = "خليل علي حيدر"
posted = "2007-02-11"
text = "ألا يلفت نظرك أن تكون جماعات \"الإسلام السياسي\" والتيارات الدينية، بهذه القوة، وأن تكون في الوقت نفسه بهذا الفقر والسطحية وقلة العطاء والإبداع، في مجالات الثقافة والفكر والرواية والشعر والفن والفلسفة والفنون؟ هل يعقل مثلاً أن تتأسس حركة \"الإخوان المسلمين\" عام 1928، قبل ثمانين سنة تقريباً، وأن تنتشر في كل العالم العربي، وتستقطب الرجال والنساء، والشيب والشباب، والبسطاء والمتعلمين، ولا تعطي الحركة للثقافة العربية مفكراً من عيار محمد عابد الجابري أو شاعراً ينافس أدونيس والقباني والسياب، أو كاتباً من طبقة العقاد وطه حسين، أو روائياً كنجيب محفوظ أو مبدعاً يقارع جبران خليل جبران؟<br />وبالرغم من الطابع الديني والتشريعي للحركة، فإنها لم ترفد الثقافة اللغوية والقانونية وعلم مقارنة الأديان والقواميس الموسعة بالعطاء والإبداع. ويكفي أن نقارن عطاء التيار الديني في مجال الثقافة والإبداع الأدبي والفني بالتيار الليبرالي أو القومي أو الماركسي، لنرى الفارق الهائل بين ما قدمته هذه التيارات للثقافة العربية وما قدمه تيار \"الإخوان\" وسائر الجماعات الإسلامية العربية لها!"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

[[comments]]
order = 18
subject = "أيها الجد العزيز خليل علي حيدر"
author = "إبن بهيه"
posted = "2007-02-11"
text = "أيها الجد العزيز خليل علي حيدر<br />آن لأبي حنيفة أن يمد رجله ويخبط بيها شلوت في نظارتك التي تغالظت وكبرت من البحلقة في شيء آخر على ما يبدو غير العلم والمعرفة<br />يا أخ<br />هل صور لك عقلك الجميل أن الإخوان أو أية حركة إسلامية أخرى قد أتت من بلاد تركب الأفيال مثلاً؟<br />هو فيه إيه؟<br />الناس اتهطلت ليه كده؟<br />هم الإخوان مش مننا وفينا ولا إيه بس؟<br />يا حضرة المبجل .. العبقري في بيتنا فقط إخواني وناصري وغيرهما .. إخوة في بيت واحد .. هل اللإخوان جنسية خاصة وبطاقة هوية خاصة بهم كي نصنفهم بتلك الطريقة العجيبة التي تفتق عنها ذهن الأخ الكهل خليل علي حيدر<br />ليت الكهولة تفيد .. خسارة بياض الشعر بغير أن يضيف إلى العقول .. والله خساره<br />يا أفندينا .. يا عمونا ارحم نفسك أولا وارحمنا من افتكاساتك العجيبة دي سايق عليك المصطفى وأهل بيته<br />ولا أسوق عليك جون بول سارتر يعني؟<br />فلقتونا ..<br />الإخوان هم المخزون الاستراتيجي من الأصالة لهذه الأمة شئتم أم أبيتم .. يكفي أننا نرى هذا كشعوب وأنا ممن يرون هذا برغم ما بيني كناصري وبين الإخوان المسلمين من خلاف فكري<br />الخلاف شيء والهطل اللي ماشي الأيام دي وسواقة الهبل على الشيطنه والموسنة شيء آخر<br />كفاية بيع بقى فينا زهقنا<br />لا حول ولا قوة إلا بالله<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-14"
capture_url = "https://web.archive.org/web/20070214063916/http://masr.20at.com:80/article.php?sid=1569"

[[comments]]
