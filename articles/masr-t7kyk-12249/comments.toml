author = "وقوع البلاء"
posted = "2009-06-01"
text = "كان الامتحان بلاء وكارثة سوف تحل<br />المفروض الطالب يكون فاهم المقرر وجاهز للاجابة على اى سؤال فى المقرر<br />والمفروض الامتحان مش تعجيز ولا افشال الطالب باى طريقة<br />المفروض الامتحان يظهر ان الطالب فاهم ودرس المقرر والا لا<br />والمفروض مش امتحان واحد<br />المفروض يبقى كل شهر امتحان وفى نهاية العام يؤخذ متوسط تلك الامتحانات<br />ولو فيىة عشرين امتحان خلال السنة الدراسية يبقى خير وبركة ويؤخذ متوسط تلك الامتحانات"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621065908/http://www.20at.com:80/masr/t7kyk/12249-2009-06-01-13-04-48.html"

