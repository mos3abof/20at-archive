posted = "2006-06-11"
text = "أنا من أشد المغرمين بصوت وفن وأداء علي الحجار، بل من أكثر المتابعين له منذ 20 عاماً، رغم أن عمري لا يتجاوز الثالثة والثلاثين، ولكن الألبوم الجديد (يمامة) لم أجد به سوى أغنيتين فقط لامستا أحاسيسي وإعجابي وهما (الليل يا ناس) و(لو تعرفي).. وأنا أود أن يظل الحجار على مستوى أغانيه الخالدة التي تعيش طويلاُ ولا تفارق الذاكرة.."
