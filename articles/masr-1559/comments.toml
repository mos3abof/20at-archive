[[comments]]
order = 0
subject = "اثار مين والناس نايمين"
author = "محمد صبحى"
posted = "2007-02-07"
text = "منطقة اثار مين<br />كل المناطق دة تفتقر لابسط احتياجات الانسان الادمى مش محتاجة لاثار ولا لغيرة"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212045907/http://masr.20at.com:80/article.php?sid=1559"

[[comments]]
order = 1
subject = "و لو فيها رزاله"
author = "نيفين نيفى نوفا"
posted = "2007-02-10"
text = "معلش يا جماعه سؤال بس<br />هو انا لو قلت انى مش فاهمه الموضوع ابقى غبيه؟؟؟؟؟؟؟؟؟؟؟؟<br />يعنى ايه محميه للتراث الحضارى<br />مش فاهمه"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212045907/http://masr.20at.com:80/article.php?sid=1559"

[[comments]]
order = 2
subject = "لا مافيهاش رزالة"
author = "مصرية"
posted = "2007-02-10"
text = "يا نيفين مش انتى بس اللى مش فاهمة الموضوع انا كمان مش فاهمة الموضوع هو يعنى ايه محمية التراث الحضارى يعنى هما هيعملوا فى الاهرمات ايه وبعدين انا اعرف المحمية دى بتكون لحماية حيونات نادرة او لحماية نباتات نادرة اه يمكن عايزين يحموا الاثار النادرة طيب ويحموها من ايه وبما ان فى الموضوع ذكر كلمة تهديد انا عندى احساس انهم هيعملوا فى الاهرمات حاجة وحشة وربنا يستر"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212045907/http://masr.20at.com:80/article.php?sid=1559"
