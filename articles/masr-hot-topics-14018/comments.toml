subject = ""
author = "طارق"
posted = "2009-11-12"
text = "انا جبت تذكرة درجة اولى .. طبعا انا وقفت قدام نادي الصيد من الصبح وكالعادة مفيش نظام ومفيش تذاكر ..واحد صاحبي راح في احد المنافذ بالبلدي ظبط واحد من اللي بيبيعو التذاكر وادالو تذاكر اغلى من تمنها …<br />يعني الفساد جاي من جوة اتحاد الكورة نفسه ..والله العظيم ومن قلبي حسبي الله ونعم الوكيل<br />انا رايح الماتش علشان بس بحب اسم مصر وعلشان ابوتريكة اللي كان لي بيه معرفة شخصية وهو شخص يستاهل يروح كاس العالم<br />اما اقسم بالله العظيم لو الموضوع بخصوص اتحاد الكورة والسادة المحترمين اللي عاملين فيها واصيين على البلد اقسم بالله ما كنت شجعت وكنت اتمنيت مصر تخسر علشانهم<br />ولكن احنا بنحب بلدنا ..انما الناس دي والله لن يذكركم التاريخ بخير وحسبي الله ونعم الوكيل"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114092254/http://www.20at.com:80/masr/hot-topics/14018-2009-11-12-10-52-59.html"

