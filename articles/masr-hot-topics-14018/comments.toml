[[comments]]
order = 2
subject = ""
author = "يا ريتهم فالحين"
posted = "2009-11-12"
text = "كرة اية<br />والمنتخب حقق اية فى تاريخة ووصل لكاس العالم كم مرة<br />شوية عالم ارزقية وشوية شباب هبل بيعانى فراغ وخلاص<br />هنشوف هتعمل اية الجزائر لو فازت او مصر لو فازت مع دول اوروبا فى التصفيات<br />وبدل الهبل دة مالفلوس نشترى بها عربات سكة حديد جديدة ونعمل اشارات صح ونطور الطرق<br />وبدل الهبل دة والهيستريا بتاع الكورة نصرف شوية على المياة الملوثة ونعمل بها مصنع اسمنت<br />انتم عارفين الحكومة عملت اية بعد هزيمة 67 وضياع سيناء والاقصى<br />عملت دورى كرة بين الاندية سخن جدا والشباب نسيوا المصيبة والاحتلال و قعدوا يهللوا ويتنططوا زى دلوقتى<br />اصحوا يا عالم يا هبل<br />بلاش تعصب قوى وخدوا الموضوع ببساطة<br />مجرد حتة مباراة"
archived = "2009-11-14"
capture_url = "https://web.archive.org/web/20091114092254/http://www.20at.com:80/masr/hot-topics/14018-2009-11-12-10-52-59.html"

