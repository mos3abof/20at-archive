posted = "2009-11-28"
text = "زخاري من اسكندرية واكيد فرحان ان الامن قبض على الاخوان في الاسكنجرية"
archived = "2009-12-04"
capture_url = "https://web.archive.org/web/20091204025504/http://www.20at.com:80/masr/news/14185-2009-11-28-10-28-43.html"

[[comments]]
order = 3
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-11-29"
text = "اقتباس ممدوح زكى زخارى جرجس:<br />اقتباس حمرا يا زخاري:<br />زخاري من اسكندرية واكيد فرحان ان الامن قبض على الاخوان في الاسكنجرية<br />انا فعلا غير سعيد لان الامن لم يقبض على امك الداعرة الفاجرة الماجنة المومس بسبب اعتيادها ممارسة الدعارة و خاصة اثناء اجازات الاعياد و المواسم و اوقات المصايف بابن المومس [ *** ]<br />و امكحمرا من ورا و قدام و ناتفة كمان بالحلاوة<br />و كس امك يابن اتلخول يا عرص و انشاء اللة سوف انيك المومس امك شامى و مغربى كمان<br />و امك حمرا من ورا و قدام"
archived = "2009-12-04"
capture_url = "https://web.archive.org/web/20091204025504/http://www.20at.com:80/masr/news/14185-2009-11-28-10-28-43.html"

