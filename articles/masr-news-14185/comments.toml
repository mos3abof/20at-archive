subject = ""
author = "المعلق السابق"
posted = "2009-11-28"
text = "قال ابن البستكى فى كتابة تعرية المتغطى وكشف المستخبى<br />ان كلمة تكدير وردت بمعنى تقذير ( من القذارة ) اى تقذير الامن وجعلة قذرا<br />وفى معنى اخر<br />تكدير اى وضعة على كادر زى كادر المعلمين وهذا مخالف للاعراف<br />وقال ايضا<br />تكدير الصفو بان يكون الانسان صافى البال وعمل دماغ جامد وراس متكلفة وييجى واحد يصحية ويقول لة بخ<br />والعملية محيرة"
archived = "2009-12-04"
capture_url = "https://web.archive.org/web/20091204025504/http://www.20at.com:80/masr/news/14185-2009-11-28-10-28-43.html"

[[comments]]
order = 1
subject = ""
author = "يعنى اية كدروا"
posted = "2009-11-28"
text = "يعنى اية كدروا<br />مفيش واحد ضليع فى الامن او ضليع فى اللغة العربية او ضليع فى القانون قصدى فى الكانون يقول لنا يعنى اية كدروا<br />انا الشاويش عوكل ايام التجنيد كان بيكدر الطابور بمعنى انة يذنبنا اى يعطينا طابور ذنب اى اذلالنا شوية<br />انما تكدير الامن فكلام مش مفهوم ولا يدل على اى شىء<br />هل الاخوة شكلهم مكعبر وفعلهم مزعبر والامن اخد على خاطرة وزعل منهم<br />تكدير الامن<br />ندور عليها فى جوجل والا فى القاموس المحيط<br />الالفاظ [ *** ] دى بتاع المماليك والاتراك لسة بتستخدم<br />وفى تهمة عقوبتها الاعتقال<br />هل الاخوة تجمهروا او خرجوا فى مظاهرة غير مرخصة مثلا<br />نحب نفهم"
archived = "2009-12-04"
capture_url = "https://web.archive.org/web/20091204025504/http://www.20at.com:80/masr/news/14185-2009-11-28-10-28-43.html"

