subject = "لاغلى واعز الناس"
author = "ابراهيم سليمان- فلسطين- نابلس"
posted = "2006-12-25"
text = "الى اغلى الناس اهديكي قلبي فانتي الحياة كلها فمن عينيك تشرق شمسي .....<br />اهنئك حبيبتي جنان واقول كل عام وانت بخير يا كل الناس يا روح الروح ....<br />اااااااااااااحبك"
