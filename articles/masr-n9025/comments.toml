[[comments]]
order = 0
subject = "يجب أن نستقبل نعمة الله تعالي بالعيد بالله أكبر الله أكبر ."
author = "عبدالرحمن"
posted = "2006-10-24"
text = "العيد نعمة من نعم الله تعالي للعبد أن مكنه الله تعالي من صوم رمضان فلا يجب أن نستقبل نعمة الله بالأغاني والمعازف ولكن نستقبله بالتكبير \" الله أكبر الله أكبر لا إله إلا الله ... الله أكبر الله أكبر ولله الحمد \"<br />كفايانا أغاني ومعازف خلونا نعطر أفواهنا بذكر الله تعالي ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061751/http://masr.20at.com:80/article.php?sid=1092"

[[comments]]
order = 1
subject = "العيد فرحة"
author = "مروان المصري"
posted = "2006-10-24"
text = "بسم الله الرحمن الرحيم<br />أحب أن أقول أولا كل عام وأنتم بخير .......<br />ثم أضف تعليقي على أغنية ليلية العيد فأنها أغنية ترحب بالعيد ولكن كل أغاني الفرحة إلاوهي أغاني عيد........فالعيد ما هو فرحة الأطفال وصلة القرابة وصلة الصحابة ...... وكل عام وأنتم بخير"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061751/http://masr.20at.com:80/article.php?sid=1092"

