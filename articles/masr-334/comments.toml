text = "عاوزه تعرفى يالولو اسامه عمل ايه من بعد ماخلص البرنامج ؟ تفتكرى بيعمل ايه لوقلتلك مش هاتصدقى والله قاقولك ولا بلاش اصل حاجه تكسف والله العظيم قاقولك وامرى لله اسامه القاسمى ياستى بعد ماخلص اليرنامج بيعمل دلوقتى حواجبوة فاكرنى بهرج طب والله العظيم بيعمل حاجبوة لان اسامه القاسمى حواجبوة لازقه فى بعضيها وواخدها بالفتله وعندك شادى راسم حواجبوة ولا اجدعها واحده ست كل اللى كا ن مشترك فىالبرنامج كان بيعمل حواجبوة حاجه تكسف وبلاش يالولو تسالى على حد منهم لانهم مش رجاله عمرك شوفتى راجل بيعمل حواجبوة ياستى دول بيعلموة الشباب ازى يعملوة حواجبهم ينهار اسود دانا بامشى فى الشارع بلاقى نصف شباب العالم بيعملوة حواجبهم وبيخدوة وشهم بالفتله لا وايه اللى ناقص يعملوة حلاوة على شان تكمل اسكتوا حاجه تكسف عاوزين يقلدوا نانسى عجرم وداليا البحيرى اوف حاجه تخنق"
