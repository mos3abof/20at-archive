[[comments]]
order = 37
subject = "برنامج جميل"
author = "نونو"
posted = "2006-08-17"
text = "فى الحقيقه البرنامج كان ممتع وبعدين با النسبه لاراء بعض الناس بخصوص صرف المال على البرنامج مثلا فكل انسان حر فى فلوسه واحنا كا متفرجين ميهمناش غير نستمتع وبس وازا محسناش اننا مبسوطين من اى برنامج مثلا ممكن نقفل ودور على حاجه تانيه ممكن تمتعنا بلاش الحقد دهوده اكيد شغل طبعاوفى نفس الوقت فن دى حاجه مش جديدهوعمر ما استشارنا فى اختياراى نجم فده حدث لم يسبق له مثيل غير انه اعطانا فرصه لاكتشاف مواهب جديده فى الغناء والفن وعلى المستوى الانسانى كمان وبصراحه كل نجوم البرنامج رائعين جدا جدا خصوصا اسامه با النسبه للصوت والاحساس والكارزما والشكل وشادى وشبه عبدالحليم وروحه وكمان شريف وابتسامته وروشنتهوكيوانطيب جدا ورقيق وسيف راجل اوىاوى واحمد جانمافيش كلام وجمال صاحب اقوى صوت وعبدالعالى صاحب اصيب قلب واحساس عالى جدا وداليا جميله اوىاوىوطيبه ودمها خفيف بس فى الحقيقه انا بس معترضه شويه على انها احيانا بتكون متصنعه لسا عايز لها تدريب اكتر من كده فى التمثيل بس انا فى الحقيقهمن اشد المعجبين بيها وبجراتها وفنها"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

[[comments]]
order = 38
subject = "ايه التهريج ده مش معقول ابدا"
author = "الدمعة الحزينة"
posted = "2006-08-20"
text = "ازاى تسمحوا ان كلام وقح وقزر زى ده يتنشر منتهى التسيب مافيش دين مافيش حياء من قل ايمانه قل حياءه ولاى كتب اكلام ده معندوش لادين ولا حياء وواضح انه انسان حاقد وعاطل عن العمل والى سمح بمرور الكلام ده ناس متسيبين وماعندهمش احساس ولا كرامه والموضوع مش مستاهل دا كله دا مجرد برنامج وخلاص وبقول للانسان الى مايستحقش يكون انسان اصلا ان كل شىء نصيب ولكن كان فيه اى وضع فى الدنيا مش عاجبك اعتقد انك مش بعبارات وقحه زى دى هاتصلح الكون وانشاء الله مش هاتتوفق فى حياتك لو كان هو ده اسلوب حياتك وبعدين القنوات الفضائيه والتليفزيون مليان برامج اشمعنا ده وبا العكس البرنامج كان ناجح وانا شايفه انه متصرفش عليه فلوس كتير المفروض كان يتصرف عليه فلوس اكتروكمان انا بصراحه مشتاقه جدا انى اشوف المسلسل انشاء الله يكون مسلسل جمل ونستمتع كلنا بيه مع شادى شامل العندليب الجديد انشاء الله"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

