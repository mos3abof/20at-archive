[[comments]]
order = 0
subject = "العندليب"
author = "سعيد المصرى"
posted = "2006-05-16"
text = "لابد ان يعرف الناس ان هذه البرامج<br />القائمة على التصويت يكون فيها الكثير من التلاعب<br />ومن يراسل ويصوت ويصدق فهو الجانى على نفسة ويتحمل خطأ الضحك علية<br />اما بالنسبة لاحتياجنا عندليب اخر ام دائم اقول ان هذا المسلسل عن قصة حياة العندليب فمن يحضرون<br />ايأتون مثلا ب حسن حسنى او محمد لطفى ليقومون بالدور<br />اذن لابد من وجود الشبة<br />وبالفعل شادى يستحق من ناحية الشبة<br />اما الصوت فمنفذوا العمل قالوا انهم سيركبون الصوت<br />والتمثيل هذا ما سنشاهدة ولا نستطيع استنتاج النتائج الان<br />وعملية الخداع دى شئ معروف وبديهى<br />اما بخصوص عندليب دائم فأنسى<br />كفاية واحد"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

[[comments]]
order = 1
subject = "جميل يا محمود"
author = "أنــا"
posted = "2006-05-16"
text = "فعلاً موضوع العندليب والمتاجرة بيه ده مستفز من أوله لآخره ، هوا صحيح مغامرة بس هما ماديين قووووي<br />موضوع حلو يا محمود وأسئلتك ف الآخر أحلى<br />تحيـة لمجهوداتك<br />وسؤالي للمرة الثانية : هوا أنتا محمود حامد الروائي ؟؟؟؟"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

[[comments]]
