text = "والله البرنامج كان ناجح بس اللى كان مضايقنى العرى اللى كان فيه وفعلا شادى هوة اللى يستحق بس انا عندى سؤال هوة الفلوس اللى هتتصرف على البرنامج والمسلسل والممثلين مش كان اولى يعملوا بيها اى مشاريع تنفع الشباب بس ارجع واقول فى الاخر انه هيجيب فلوس من اخوانا العرب لما يشتروا المسلسل ربنا ميحرمناش منهم ومن فلوسهم ههههههههههههه"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

