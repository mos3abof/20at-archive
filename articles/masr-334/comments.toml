text = "شبيه العندليب السوري احمد حداد<br />في الصدقه شاهت موضوع خيانة العندليب الاسمر ودخلة الرابط الذي مكتوب امامي<br />فوجت صور عبد الحليم امامي وعندما قرئة اللذي مكتوب في مقالك عرفت انها صورك ده<br />شي رهيب كتير بتشبه العندليب الاسمر<br />ليش مااختاروق ده حرام عليهم دي جريمه<br />الفن بس شادي شامل مقبول نوعن مابس تجي الحقيقه انت اقرب بي نظري لانو شادي مع مساعده في المكياج انت مفيش حسب قولك مكياج"
