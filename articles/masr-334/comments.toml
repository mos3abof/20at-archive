[[comments]]
order = 96
subject = "شادي وبس"
author = "حسسن عثمان"
posted = "2006-10-05"
text = "انا عايز اعرف انت بتتكلمو في شغل من المخرج جمال عبد الحميد واحد دارس واخرج قبل كدة مسلسلات ناجحة مثل ريا وسكينة ومسلسل ارابيسك ومسلسل ليالي الحلمية وغيرها و اكيد واخذ بالو من كل حركات الممثليين وخاصة شادي شامل ولو تلاحظو انو بدا يظهر شادي بشكل غلبان اللي مغلوب على امره وما قدرش يوصل للي عايزة وبعد كدة لما بدا الحظ يحالفة بدا يتحسن ولسة كمان لما نشوف الحلقات اللي بعد كدة وبعدين عايز اقول حاجة المسلسل كان بيتكتب من سنة ونصف يعني اللي كاتبة دارس حياة عبد الحليم بكل تفاصيلها الصغيرة يعني موضوع انفعالة او هدوءة المخرج ادرى بية مننا احنا الجمهور وبعدين هو المسلسل لو تفكرو ايه لازمتة اذا كنا احنا هنقول المفروض والمفروض دا المسلسل عشان نعرف اشياء عن عبد الحليم فنان صار اسطورة احنا ما نعرفهاش وبدليل كدا لو لاحظتو ان عبد الحليم كان يحب يهتم بمظهرو من صغرو لو تفتكرو الحلقات واذا ماافتكرتوش شوفو حلقة امبارح كل ما يجي صاحبة ولا واحد صحفي يقول اغير ملابسي واقابلو دا ابسط شيء بالاضافة لاصرارو ووفاؤة لاصحابة وتغير نوع الاغاني في العصر اللي عايش فية يا جماعة قلتلكم قبل كدة شوفو الاحساااااااااااس مش الشبة والتقليد ومامش عارف اية اتفرجو على المسلسل بتجسيد شخصية مش تجسيد شكلي ...........واتمنى تقتنعو بكلامي<br />وبعدين بلاش انا اللي بيقولو انهم شادي عشان انا اعرف صاحب شادي وبيقولي ان شادي بيتعب اوي اوي ومش لاقي اصلا وقت ينام ولاياكل يبقى هيرد على ايميلاتكم ومين اصلا من الممثليين بيفضى في رمضان"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117141025/http://masr.20at.com:80/article.php?sid=334"

[[comments]]
order = 97
subject = "****"
author = "ياسمين"
posted = "2006-10-06"
text = "انا بشوف انه شادي مش بيمثلدور عبد الحليم عشان يكون هو عندليب الحاضر,هوبس بيأدي الدور والبرنامج(العندليب من يكون)كان بيبحث عن شبيه بالشكل لعبدالحليم لانه كان من المعروف انه الصوت حيفضل بصوت حليم واللي حيقوم بالدور بس حيمثل ومن كان من الافضل انهم يسموه من يمثل العندليب وكان من الظاهر خلال التحكيم اللي كان منحازللاقرب اقناع بالشكل من دون النظر الى الصوت ولا للتمثل واللي اظهر امكانت غير شادي و خصوصا من ناحية التمثيل والغناء ,وعلى كل حال مابعني انه اللي ادى الدور انه وصل الى شهره عالميه و خصوصا اذا مااقدر يطلع من الدور اللي قام فيه و يمكن المتانفسين التانين ينجحوا اكتر منه ,فما في داعي للتحامل على شادي لمجردانه قام بالدور.والباقين اكيدفيه كتير فرص ليحافضوا و يزيدوا النجاح و الشهره اللي وصلولها."
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117141025/http://masr.20at.com:80/article.php?sid=334"

