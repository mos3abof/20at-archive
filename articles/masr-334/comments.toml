posted = "2006-09-06"
text = "والله يجماعهانا مش عارف اتكلم قاقول ايه يجماعه انا لما بقرا تعلقاتكم انا ببقى مندهش لان تعلقاتكم زى مايكون ده مش تعلق وده زى مايكون شات للدردشه وعلى العموم يارانيا انا مش فاضى اكلمك لانى زى مقولتلك انى عندى تصوير فى لندن وان شاء الله لما ارجع هابقى اتصل بكى او ارد عالكى من على الاميل اوكى وياريت يجماعه الاقى تعليق فى خصوص البرنامج وعن العندليب وعلى فكرة انا احب قاقلكم انى مش انا لو حدى بقرا تعليقاتكم كمان الفنانه داليا البحرى والاستاز مدحت العدل وكل المشتركين اللى كانوا فى المسابقه وعلى العموم انا الوحيدبس اللى بكتب وارسلكم لانى انا مندهش من الكلام اللى انتم بتكتبوا وشرف عبد المنعم اظنى انوا كتب تعليقوة بنفسوة وارسل اميلوا لكم"
archived = "2006-09-17"
