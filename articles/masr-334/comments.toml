posted = "2006-08-24"
text = "هاي شريف انا سلوى الي حضصرتلك حفله الساقيه كانت اكثر من رائعه واتمنى تقول لنا على حفلاتك الجايه علشان احضرها انشاء الله وانا الي بكتب كلمات وبلحن اتمنى تكون افتكرتني لاني قابلتلك يوم الحفله وسلمت عليك المهم ربنا يوفقك فى كل خطوه تخطوها وفي كل نيه تقوم بتنفيذها وعلى فكره يا جماعه انا لما قابلت شريف في الحفله كان دمه خفيف بجد والله العظيم ومتواضع اوى ومجامل ورقيق جدا وحساس اوى لابعد حد وشكله على الطبيعه نت غير ميديا احلى بكتير وهو انسان رائع وانسان بمعنى الكلمه يا جماعه والله العظيم وانا عاوزه اقوله باي ياشريف ووحشتني حفلاتك وربنا يوفقك ياااااااااارب باااااااااى لا اله الا الله"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

