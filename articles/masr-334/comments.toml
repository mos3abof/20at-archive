posted = "2006-10-11"
text = "اللي فات مات و ماراح ييجي تاني والعندليب مش مجرد شكل وصوت. العندليب ابتسامة لكل فرحان ودمعة لكل حزين ومش يمكن تكرر تاني الا اذا خترعنا آلة ترجع الزمان لزمان العدليب و حتى لو صار هاد الاشي للاسف مش حنكون موجودين معه... بالاختصار العندليب اخسرناه وراح علينا وما منملك اشي الا نحكي مع صوره ونسمع اغانيه...."
