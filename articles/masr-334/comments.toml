[[comments]]
order = 190
subject = "منوعات"
author = "رحل العندليب ولم يعد في وسعنا إلا أن نحتفل بذكراه وفي الغالب نكتفي بالاحتفال على الطريقة التلفزيونية التي تقدم بعض الأفلام القديمة والأغنيات العاطفية التي طالما سمعناها ونزلت دموعنا وانتعشت فينا أحاسيس الحب والوفاء، وترحمنا بعد مشاهدتها على فن الزمن الجميل."
posted = "2006-11-22"
text = "وهكذا كل عام، ولكن هذا العام شهد ظهور شكل آخر للاحتفال وهو الاتجار بعبد الحليم وبفنه وبحب الجمهور له، وذلك عن طريق برنامج مسابقات تلفزيوني بعنوان \"العندليب من يكون؟\" الذي أذاعته محطة mbc الفضائية على مدار الشهرين الماضيين في حلقات أسبوعية، وحاول البحث عن شبيه للعندليب بالرغم من اعتراف الجميع بصعوبة واستحالة العثور على شخص يشبه عبد الحليم حافظ بغض النظر عن المثل المصري \"يخلق من الشبه أربعين\".<br />فالمطلوب شخص يشبهه تماما ليس في الملامح فقط بل في الصوت والملامح والأحاسيس، وهو ما حاولت قناة mbc الوصول إليه، لكي يخرج الفائز منه لتجسيد شخصية عبد الحليم حافظ في مسلسل تليفزيوني تنتجه القناة نفسها ، أي أن المسابقة تأتي في الأول والفائز يخرج ليقوم ببطولة المسلسل كخطوة ثانية ولكن الذي حدث عكس ذلك تماماً لأن الفائز كان معروف مسبقاً بشهادة بعض المقربين.<br />وقد بدأت حلقات البرنامج باشتراك 8 متسابقين تم اختيارهم من بين 17 آلف شاب عربي وهم من مصر والأردن وتونس ولبنان والمغرب، يتمتعون بالشبه بالعندليب الراحل إضافة إلى القدرة على الغناء والتمثيل.<br />وخضع المتسابقين الثمانية لبرنامج تدريبي على يد متخصصين في التدريب على الغناء والتمثيل والاستعراض قبل تقديم فقرات فنية في البرنامج على الهواء، ومع كل أسبوع يخرج متسابق . ومع توالي الحلقات كان الموعد مع<br />اقرأ بقية التعليق .."
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215113147/http://masr.20at.com:80/article.php?sid=334"

