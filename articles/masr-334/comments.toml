author = "محمد ياسين"
posted = "2006-11-05"
text = "والله العظيم اللى بتكتبوة ده هبل دانا تكتب مواصفاتها وعمرها يعنى ايه يوسف لما يلاقى اسمك هايبعت اميلوة يجماعه عاوز قاقولكم ان يوسق وشادى وشريف والله محد فاضى وياريت اصلا ماتتعبوش نفسيكم فى ان حد يرد عاليكم ولو ردو مش وهايبعتوا اميل وهمى ولعلموكم بالنسبه للاميل العنداليب الحزين ده اميلى وانا اللى كنت عامل شادى شامل يجماعه نصيحه مش اى حد يقول انا شادى تصدقوا المهم كتير صدقوا منكم انى انا شادى بالاخص لما الدت صوتوة وكمان لما فتحت الكاميرا انا مش شبه شادى ولاكن انا شبه العنداليب يجماعه ارجوكم ماحدش ينخدع تانى ولا حد يتعب نفسوة فى حكايه ان حد يرد عاليكم وتأكدوا لو كنت انا اخزت دور اولقب العنداليب ماكنت هارد على اى حد اطلاقا لان مش هلاقى وقت افضاة وسلامى للكل mohamed.yassen elandalib_elhazen@yahoo.com"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117141025/http://masr.20at.com:80/article.php?sid=334"

