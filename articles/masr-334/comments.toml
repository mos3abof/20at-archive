subject = "مش عارف اقول ايه"
author = "شريف عبد المنعم"
posted = "2006-07-25"
text = "السلام عليكم<br />انا شريف عبد المنعم انا بجد مش عارف اقولكم ايه علي الكلام ده بجد دا كتير عليا اوي بس كل اللي اقدر اقوله اني ان شاء الله هاجتهد اوي عشان دايما اكون عند حسن ظنكم<br />انا ان شاء الله عندي حفله في ساقيه عبد المنعم الصاوي في الزمالك يوم الاحد 6/8 الساعه 8 وهاتكون اول حفله ليا بعد رجوعي من لبنان والتذكره ب 10 جنيه ياريت تشرفوني"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

