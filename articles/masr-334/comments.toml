posted = "2006-08-17"
text = "شادى شامل شاب مكافح و حب انا يجرب حظة فى الفن و لكنهو مش اول واحد يجرب التمثيل او الغنى فا انا شايفة انه شاب فى منتهى الجذابه و يوجد فى كل ملامح وجهة كل ملامح عبد الحليم و لكن فى اشاعه غلط ظهرت على انا المفروض ان يوسف كيوان انة هو الى يكسب كل دة غلط ما علينا نحن جميعا و محبى الفن الجميل بتاع زمان بنتمنى من شادى بانة لا يتركنا ابدا و يكمل مشارة فى الفن حتى لو انتهى المسلسل انا يغنى لوحدة او مع شريف و يوسف و السلام عليكم و رحمة الله و بركاته"
