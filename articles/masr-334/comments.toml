posted = "2006-05-17"
text = "العجيب فى الموضوع الست داليا هانم<br />اة واللهى دى ملكة جمال ازاى ؟؟؟؟<br />واللهى مافيها حاجة حلوة اصلا<br />ودمها تقيل يلطش كمان<br />ياساتر يارب<br />ايةدا والمصيبة انها فاكرة نفسها حلوة<br />دى نانسى عجرم كانت ماسحاها خالص ياجدع"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

[[comments]]
order = 7
subject = "فوااائد عديدة"
author = "مَـلَـكَـة"
posted = "2006-05-18"
text = "والله يا ابراهيم البرنامج ده ليه فوايد كتير جداً بس الناس هي اللي بتنكرها، منها علي سبيل المثال لا الحصر:-<br />1-البرنامج وسيلة كويسة جدا لتظبيط ضغط أي حد..بمعني ان لو حد ضغطه واطي ممكن يتفرج علي ربع ساعة منه كدة ع الماشي...والنتيجة هتبقي فعالة جدا بعدها باعتباره برنامج بيرفع الضغط (ملحوظة:ذوي الضغط المرتفع يمتنعون لأن المشرحة مش ناقصة قتلة).<br />2-وسيلة مناسبة للناس ذوي الحس الفكاهي عشان يضحكوا ضحك هيستيري علي المسخرة دي واهو برضو نفرح الناس بدل الغم اللي هما عايشين فيه.<br />3-طبعا لا يمكننا نكران الحقيقة الوحيدة اللي المشاهد بيطلع بيها بعد ما يتفرج وهي ان البلد دي اللي ماشي فيها حاجتين:الغنا والرقص!<br />4-البرنامج يعد (سبوبة)محترمة جدا للقائمين عليه...يعني عايزين الناس متاكلش عيش بقي ولا ايه؟!<br />5-للمهتمات من البناتيت بالفاشون والعالم ده هيلاقوا في الاخت داليا البحيري غرضهم وزيادة، هيلاقوا فين كمية الفساتين والتسريحات والمكياج دي غير عند دوللي واخواتها؟؟طبعا البنت من دول ممكن تسيب البرنامج باللي فيه يولعوا طالما انها مركزة علي داليا وفساتينها ولون شعرها ولون المانيكير بتاع صباع رجلها الصغير!<br />6-زي ماقلنا قبل كدة ان البرنامج سبوبة محترمة جدا لكل اللي بيشتغلوا فيه..حتي الضيوف،بدءاً من فلوس شركة الانتاج اللي بتجيلهم عن طريق الرسايل Sms مرورا بالفرقة الموسيقية ثم الاعلانات ونهاية بالحاج مدحت العدل اللي بيسموه دكتور...<br />7-نظرا لان القناة اللي بترعي البرنامج لبنانية فلا يمكن نعدي كدة علي بنات لبنان طياري يعني من غير ما ناخد بالنا ان الموديلز اللي كانوا بيرقصوا ورا أشباه \"عبد الحليم حافظ\" كل واحدة فيهم طبعا شايفة اني دي فرصة العمر بالنسبة لها عشان اي حد يلقطها وتبقي نجمة سيما ولا<br />اقرأ بقية التعليق .."
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

[[comments]]
order = 8
subject = "غلط"
author = "عبدالله مفتاح"
posted = "2006-05-18"
text = "الفكرة والبرنامج والتنفيذ كله خيبه تقييييييييييييييله اوي اوي اوي<br />خلينا احنا مستخرين نفسنا للرقص والغنا والتشخيض واهو كله فن بيسمو بالفرد مش شايفين الناس ساميه ازاي هطيؤ من كتر السمو<br />لا للتمديد لا للتوريث نعم لتعديل الدستور"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

[[comments]]
order = 9
subject = "عاشق حليم"
author = "العندليب واحد فقط"
posted = "2006-05-23"
text = "اقول ايه بس انتم شوهتو صورة حليم عاملين مسلسل اسمه تفاهه مين زى حليم الله يرحمه العندليب واحد فقط واستحالة يكون فى اتنين عندليب احنا خدنا على شكله على احاسيسه على صوته الجميل الذى يربك مشاعرنا فهل يكون عندليب اخر انا اؤكد استحال المحااااااااااال"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

