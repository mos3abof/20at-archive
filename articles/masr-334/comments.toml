subject = "حبيبتى داليا البحيرى"
author = "ساهر الفرعون العاشق"
posted = "2006-08-11"
text = "اه يا ولاد المتناكه عرفين شادى شامل ده لو معملش المسلسل زاى الناس هنك شعب كسمه و خليه يعمل مسلسل معايا و انا بنك فى امه هتى امه كسه معفن ممكن اسال سؤال كان يعنى نفع اخلى زبى يشترك فى البنامج حتى فى شكل من العندليب يا ولاد المتناكه و كان بوقه ايه يا سلام على بوقه و احسيسه و لما هيشوف داليا هيبكى يرنامج ده ابن متناكه كلكم معرصين ولاد وسخه اعمله حاجة تنفع البلد يا ولاد المتناكه كلام هجايص و كله فى التخريف و حيات امك يا شادى يا ابن الخول شامل لو معملتش برده هعيدها تانى المسلسل زاى الناس انا ممكن اغتصبك انت و امك و اخليك زاى داليا تحلم با زبى و زاى المتناكه نانسى بنت الشرموط عجرام و هى بتعمل حلاوه هخليك تعملى حلاوه فى شعرتى و انا اعملك حلاوه فى طيزك و داليا و نانسى يمسكه الفوطه مع تحيات النييك الكبير س م ع"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

