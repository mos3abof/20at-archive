[[comments]]
order = 22
subject = "الفنان يوسف كيوان"
author = "هاني وائل الريماوي"
posted = "2006-07-12"
text = "بسم الله الرحمن الرحيم<br />كان يجب ان يكون العندليب هو الفنان الاردني يوسف كيوان فهو فنان ناجح بكل المواصفات والمقاييس وهو قوي الشخصية<br />واتمنى له مستقبل باهر وبالمناسبة انا اعرف يوسف كيوان شخصيا وانا الان بحكم عملي باحث انترنت اعددت له ارشفا ودراسة ارجو ان تنال اعجابه واشكر اهله الذين ساندوه في مشواره الفني العريق واقول لك يا يوسف كيوان الى الامام فنحن كلنا معك<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

[[comments]]
order = 23
subject = "شادي و شريف و يوسف"
author = "gh"
posted = "2006-07-18"
text = "يا جماعة ليش مو عاجبكم البرنامج و الله حلو و لو بيرجع الرأي ألي لكنت خليت شريف و شادي و يوسف الثلاثة بيستاهلو يكونو العندليب لأنو شادي شبهه و شريف أنا برأيي أحلى شخص شفته بحياتي و بيعرف يمثل منيح و غنيته حلوة كثير و يوسف تمثيله منيح و أنا أتمنى لو يعرضوا أغنية شريف و الناس آراء وأنا هذا هو رأيي و السلام بحبكون يا شادي و شريف و يوسف"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

[[comments]]
