text = "يا جماعة انا مش عارفة ليش عملو فيلم يمثل حياة العندليب احنا ما بدنا حد يمثل شيخصيته او يتمثل فيه لانه ولا حد بيقدر يكون متله ولا مرة وبعدين هدا عبد الحليم حافظ عرفين عبد الحليم بالنسبة لي مش مطرب وبس هو شخصية فريدة من نوعها اه ع شان هيك انا بعشقه فما عاش ولا ان اللي بدو يشبه نفسه في مع احترامي للفنان شادي شامل بس الحق لازم ينقال وع العموم نحنا وشو ما صار وخاصة انا مهما صار ما بتتغير محبتي للساحر حبيب الشعب والله يرحمه يا رب للاسف المرض اخده من محبينه وسلام وبتمنى ما اكون جرحت حد في كلامي واذا حصل فانا اسفة جدا يا جماعة لاني بموت في حليم بعشقه ومع ذلك انا بحترم رايي الجميع **عاشقة العندليب (عبد الحليم حافظ)"
