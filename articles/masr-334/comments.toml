posted = "2006-10-24"
text = "كل سنه وانت طيب ياشادى وكل الى بيقرا التعليقات وكل الامه الاسلاميه والعربيه<br />احب بعدتهناتى بالعيد السعيد اهنى شادى على اداؤة فى المسلسل كان ممتازوانا مش مع الناس الى بيقولوا انه كان اداءه وحش لانه بصراحه ملوش زنب المؤلف هو الى مختار حجات معينه من حياه عبد الحليم كنا عيزين نعرف اسرار اكتر فى حياته ممكن ننبهر بيها بلاضافه ان الاداء كان اكيد على اساس توجيهات المخرج هو اعتقد انه عمل كوس وعمل كل جهده غير انى اعتقد ان المسلسل كان محتاج وقت اطول يمكن عموما انا باموت فى حليم وهو شادى وشادى بجد شخصيته مقربه كتير من شخصيه عبد الحليم وافق بعض الناس فى هزا الراى اعتقد ان حليم كان طيب ورقيق وروش ودمه خفيف تمام زى شادى او شادى هو الى زيهيا ريت تعرفنا اميلك يا شادى باحبك اوى يا ريت تعبرنا يا ريت"
