posted = "2006-10-19"
text = "ياماما ياحبيبتى ياللى اسمك لولو شريف عبدالمنعم او اى ممثل لازم يعامل اموة كده ادام الشاشا يعنى بالعربى كده بيعمل منظر ادام الناس اليعنى مفيش حد بيعمل زىوة مع والدته انتى تعرفى ايه عن شريف عبدالمنعم ؟ ادام الشاشه بيتمنظر وتلاقيه فى البيت حارق دامها وواجع قلب اموة ومش بعيد كمان هو اللى جبلها الضغط وجبلها السكر ياماما دول بشر زينا وبعدين انا معاكى طب تعملى ايه لوشوفتينى انا على الكاميرا مش ممكن يغمى عاليكى؟<br />لا اكيد هايمى عاليكى وتقوليلى اوسخ من الكلام ده الى بتقوليله على شريف وبعدين انا مش محمد سعد اللمبى انا محمد سعد مش كتكون ولا فارخه ولا حوت انا واحد معروف اوى وبحب ارد على التعليقات ديه لان من حقى ارد زى اى اواحد هنا على فكرة كمان انا مالياش دخل فى البرنامج ده انا واحد خارج البرنامج ومفهوم جد ا وانا حاتت اسم محمد سعد لانى انا بحبوة جدا مع تحياتى ك.ع"
