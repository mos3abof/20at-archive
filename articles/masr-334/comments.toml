posted = "2006-05-23"
text = "خلينا عايشين على حليم القديم لأن عمركم ماحاتجيبو زيه بلاش تضيعه الصورة اللى بقيلنا فى الفن او تجددوها لأن ماحدش عايزها تتجدد احنا حابين حليم على كدا بلاش احسن ها بلاش ياخفاف"
