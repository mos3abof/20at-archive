posted = "2006-06-08"
text = "الرفاق حائرون يفكرون يتسائلون يكذبون يتاجرون ينصبون<br />ترى يا عندليبنا من تكون<br />بعد 30 عام من رحيلك عنك يبحثون<br />ترى هل كنت ام لم تكون<br />ام انهم يحاولون<br />من ذكرتنا العندليب الصلى يمسحون<br />والعندليب المزيف فى ذاكرتنا يزرعون<br />لا والف لا لا لا هذا لن يكون"
