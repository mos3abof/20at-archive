text = "يخرب بيت جمالك يا شادى ايه الحلاوه دى انا خايفه يجى يوم واقبلك صدفه بس اكون وقتها مثلا اتجوزت اعمل ايه سعتها بس يا تزى حتحبنى ايه القمر ده طيب عبد الحليم رقمه خمسه وعشريه تلت اربعات وانت رقمك ايه انا بموت فيك ارجوك رد عليه انت بتمثل حلو اوى رائع انا بموت فيك وفعلا شخصيه حليم حاسه انها تشبه شخصيتك الحقيقيه بجد<br />وبجد يا بخت حليم قابل الحب فى حياته اكتر من مره نفسى اقابل الحب ولو مره واحده صدفه"
