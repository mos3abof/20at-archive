posted = "2006-08-11"
text = "اه يا ولاد المتناكه ملكم انتم شيفين نفسكم على ايه بكسمكم الحمار صوته احلى من صوت امكم و هى بتتناك يا معرصن مك شرموطه من طيزه شادى يا شامل اسال امك مين ابوك هتقلك انا يا داليا يا بنت الخول البحيرى انا يا بت مش نكتك قبل كدة و كمان كنتى لابسه الطقم البيج صح ولا ايه لو مش فاكره تعالى هتلاقى الباس بتاعك على السرير سبه للذاكرا يا كسمك و مافيش عنداليب تانى يا ولاد المتناكه مع و من شادى شامل ده ده فى شبه من كس الكلبه و راس زبى مع تحيات فارس الغناء العربى تامر حسنى"
