text = "من اكثر الأشياء التي أضحكتني هدا الاسبوع هو سداجة المسمي نفسه شادي شامل بعنوان(العندليب الحزين)حيث أنه قال لي أنه هو الفنان عينه فقلت له شغل الكامرا ووافق فبدأ يحركها في كل الاتجاهات قال انه اسف ليست واضحة فشغلت كامرتي وناديتاابنة اختي(3سنوانت) فظهرت قلت له اسفة اظهر صغيرة على الشاشة<br />ادا أراد أحدكم ان ينتحل شخصية فليستخدم دهاءه في دلك"
