posted = "2006-07-19"
text = "والله كان نفسى اشارك فى البرنامج ده بس هاعمل ايه ناس ناصحتنى قالتلى يابنى كبلر دماغك دول عالم دخلاها بالفلوس ويعنى انتوا فاكرين شادى شامل ده صوتوا حلو لا يمكن انا صوتى احلى منوة لا وايه كمان كنت جايب شعرى على جمب وعايش فى دور عبد الحليم ويبقى العندليب محمد ياسين"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

