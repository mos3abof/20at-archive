subject = "استنساخ"
author = "أبو أسامة"
posted = "2006-05-23"
text = "ياريت كانوا استنسخوا عبد الحليم لأن اى حد هيجى مكانه محدش هيصدقواحتى لو صدقناه<br />ماهو بعد المسلسل هيرجع لأصله ويغنى اغانى هيفا من بتوع اليومين دولويا ريت المشاهدين يوفروا فلوسهم يشتروابها حاجة تنفعهم فى الأيام السودة الى احنا فيها هما مش شيفين النس الى بتضرب فى الشارع علشان تجيب حقهم دول اولى انكم تصوتوا ليهم وسيبكم بقى من الهيافةاحسن يعملوا لكم نسخة من حسنى بعد ما يموت وتبقى كملت<br />وفوقوابقى من النتوا فيه"
archived = "2006-09-17"
capture_url = "https://web.archive.org/web/20060917132512/http://masr.20at.com:80/article.php?sid=334"

