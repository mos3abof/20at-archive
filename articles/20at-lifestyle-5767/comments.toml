text = "انا بصراحة عندي داهية في غرفتي اسمها سريري و كتير اوي بنام على الأرض و اسيبه فاضي و بصراحة انا مش شايفله لازمة خاالص و عامللي أزمة بس , ده غير انه مش صحي بس اعمل ايه بقى في تحكمات الأم و الأب … انا لو علية نفسي اعمل غرفتي على \"الطراز الياباني الحر\".. ميرسي شكراً"
archived = "2009-05-22"
capture_url = "https://web.archive.org/web/20090522140114/http://www.20at.com:80/7ayatna/5767.html"

