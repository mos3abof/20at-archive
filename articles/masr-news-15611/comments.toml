author = "قناة الناس الوهابية"
posted = "2010-03-06"
text = "الان انا كنت بتفرج على قناه الناس الوهابية<br />شفت اعلانين الاعلان الاول طلب وظايف للعمل في القناه وتركو الاميل بتاعهم اللي عايز يتقدم للوظيفة يبعت على الاميل<br />الاعلان الثاني اسمه كلنا دعاه اي واحد يجد في نفسه الكفاءة ليشتغل داعية اسلامي القناه حتساعده<br />المفروض القناه تسيب الاميل للي عايز يتقدم<br />لا في اعلان كلنا دعاه واللي عايز يشتغل داعية سابت الارقام اللي هي بالفلوس<br />التي تبدأ 0900<br />غلط كده يا قناة الناس اللي شايف انه ممكن يبقى داعية برضه يبعت على الاميل وما يتصلش على الرقم 0900<br />علشان خاطر 0900 دا بقا رقم مشبوه مخصص لسرقة الشعب المصري والضحك عليه<br />وعيب قوي لما قناه وهابية زي قناة الناس تستخدم هذا الرقم المشبوه وتضحك على الشعب<br />ونرجو الرد"
archived = "2010-03-08"
capture_url = "https://web.archive.org/web/20100308004641/http://www.20at.com:80/masr/news/15611-2010-03-06-14-05-29.html"

