[[comments]]
order = 0
subject = "ولماذا تجسس"
author = "حزنبل"
posted = "2007-02-04"
text = "ما الذى دفع هذا الشاب الى خيانة بلدة؟<br />الذى يحاسب عن هذا هو الفقر والهروب الى بلاد اللة وخلق اللة ليجد لقمة عيش لم توفرها لة بلدة<br />انا لا ادافع عن الخيانة فالخيانة جزائها الاعدام<br />ولكن اقول لماذا يخون شاب ؟ولماذا تنحرف فتاة ؟<br />عزيزى انة الفقر وعدم وجود وظائف فى بلدنا بعد بيعنا المصانع والمزارع<br />ثم انة تجسس على ماذا والقمر الاسرائيلى فوق رؤسنا يصور براحتة كل شبر فى تراب المحروسة ويعرف كل شىء تقريبا<br />هل هى ان بعضهم عايز يبين انة صاحى وبيشتغل وكلة اخر تمام"
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208234454/http://masr.20at.com:80/article.php?sid=1536"

[[comments]]
order = 1
subject = "لا للفقر ..لا للبطالة.. لا لقانون الوظيفة العامة الجديد"
author = ":بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-02-04"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو الوسيلة الوحيدة للتوظيف.<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا.<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />5) الغاء الاجازات بدون مرتب , وتقليل الاجازات المرضية لتصبح شهر فقط وبعد ذلك يطرد الموظف المريض اذا تجاوزها ويفصل من الخدمة نهائيا, 2 اجازة وضع لمدة ثلاث اشهر ولمرة واحدة بعد ان كانت ثلاثة في القانون القديم للموظفات .(6) من حق الطرف الاول (الحكومة) الاستغناء عن الطرف الثاني(الموظف) في اي وقت ولاسباب يراها الطرف الاول , دون ان يحق للطرف الثاني الرجوع علي ذلك.ولا استطيع عرض باقي البنود الظالمة من قانون الوظيفة العامة الجديد. من الاخر ياناس ده قانون ظالم وسيهدم ا<br />اقرأ بقية التعليق .."
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208234454/http://masr.20at.com:80/article.php?sid=1536"

[[comments]]
order = 2
subject = "منكم لله يا كلاب كلكم ضيعتوا البلد"
author = "مصرواي"
posted = "2007-02-04"
text = "أمن قومي إيه وبلا أزرق بس ؟<br />طيب هو فين الأيمن القومي ده لما الكلب نازل هو وعصاباته بيع في البلد للصهاينه؟<br />يا ترى إيه أشد فتكا بهذا البلد ؟ تلميذ عبيط غلبان باع نفسه من الجوع ((لو اعتبرناه بصحيح مجرم)) ولا الكلاب لاسعرانه اللي نازله بيع في البلد كلها للصهاينه؟؟؟<br />عايزين يفهمونا ان في مصر إيمن قومي ؟؟؟<br />ويا ترى ليه قومي بقى ؟؟؟<br />كلام عبيط وأهبل ما يدخلش العقل .. روحوا العبوا غيرها<br />لو بجد فيه أمن قومي ولو بجد فيه ناس قلبها على البلد دي كانوا اكيد اكيد ضربوا الكلب بالرصاص هو وعيلته وعصابته الوسخين<br />لكن ما بنسمعش عن جناب الإيمن القومي ده غير لما يتنفخ ويتبعجر ويتنحرش ويمسك حتة قطه خايبه لا تودي ولا تجيب؟؟<br />عجيبه والله<br />يا عم الإيمن القومي فوق بقى .. فوق .. الأمن القومي يتطلب منك في الأساس حماية البلد من لابيع للأجانب وقبض العمولات في بنوك سويسرا للريس وعيلته وعصابته الوسخين<br />ولا سيادة الإيمن القومي شريك في الليله ديه وجاي يقبض على حتة تلميذ معفن عشا يورينا إنه ماشاء الله مفتح وقلبه علينا وعلى البلد<br />يا عم روحوا اجروا<br />احنا نفضنا إيدنا منكم بلا أمن قومي بلا مخابرات بلا جيش<br />منكم لله يا كلاب كلكم ضيعتوا البلد"
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208234454/http://masr.20at.com:80/article.php?sid=1536"

[[comments]]
order = 3
subject = "مستغربة"
author = "مصرية ليبرالية"
posted = "2007-02-05"
text = "انا بصراحة مش شاغلنى ف الموضوع كله الا حاجة واحدة<br />ياترى ايه نوع المعلومات اللى ممكن واحد زيه يديها لناس زيهم !!!<br />وبعدين مش عارفة ليه محسسنى ان مصر فى خطر منها !<br />بالعكس خالص دا الشعب اساسا معندوش وقت يكره فيه اسرائيل من الجرى على لقمة العيش اللى هيزيد اكتر مع عدم الاستقرار اللى هايخلقه قانون الوظيفة العامة الجديد!<br />وبالتالى احب ان اطمئن الاخوة والاخوات فى تل ابيب : ياسادة انشغلوا انتم بعلومكم وديمقراطيتكم وتقدمكم فى شتى المجالات وليس آخرها النانو تكنولوجى ولاتخشوا كثيرا من شعب منقسم الى جزأين:<br />1 - غالبية تركض باستمرار من اجل اللحاق بفتات تركه الآخرون<br />2 - الآخرون بأة .. اللى بيستعملوا الدين ف السياسة ـ والفاسدين - والحرامية - والانانيين اللى كل همهم الكرسى لا الوطن<br />فليطمئن الصهاينة كثيرا ولاينفقوا اموالا باهظة على شباب يائس بائس مجنون"
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208234454/http://masr.20at.com:80/article.php?sid=1536"

