subject = "فى تفسير آخر"
author = "مصرية ليبرالية"
posted = "2007-02-05"
text = "وانا قاعدة بتناقش مع ماما لقيت ان فى تفسير آخر مضحك شوية:<br />تقريبا الثلاث ضباط اسرائيلين قرروا تجنيد الشاب لا لشىء الا لانه (صعب عليهم) واهو من ناحية يعملوا خير ومن ناحية تانية يشغلوه كأنه سكرتير يخفف عنهم بعض العبء اللى لو عاوزين يعملوه كله بنفسهم مكنوش لقوا مشكلة ... تفسير لاسع اوى<br />صح؟"
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208234454/http://masr.20at.com:80/article.php?sid=1536"

[[comments]]
order = 5
subject = "هو فيه ايه ؟"
author = "المصدوم"
posted = "2007-02-06"
text = "ايه ؟؟؟؟؟؟؟؟<br />والله انتو لو شارون قام من نومته و شتم فى نظام الحكم فى مصر هتهتفلوا له<br />بالروح بالدم نفديك يا شارون<br />ايه يا جدعان خلاص الاسرائيليين بقوا حلوين دلوقتى و يا عينى الواد صعب عليهم و الواد برضه معزور .. !!!!!!!!!!!!!!!!!!!!!!!<br />ايه الهبل ده<br />هو الموقع ده تبع مين بالضبط<br />انه موقع ضد النظام القائم و خلاص حتى ولو اتفق مع اليهود<br />الله الله الله<br />ده انتو عاوزين تولعوا فى البلد و خلاص بقى<br />هو ده الغرض الحقيقى الواضح.<br />فعلا على راى اول تعليق القفص لابد ان يتسع لاخرين ... واخرين دول هم انتم"
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208234454/http://masr.20at.com:80/article.php?sid=1536"
