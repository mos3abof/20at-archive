posted = "2007-05-05"
text = "اسلوبك هايل يا مدام دعاء و ياريت تيجوا تسكنوا في المعادي لاني واحد من الواقعين في غرامها ولاني مش متعود اخرج منها فمن راي انها اجمل منطقة في الشرق الاوسط وافريقيا"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519042323/http://www.20at.com:80/masr/t7kyk/5716.html"

[[comments]]
