subject = ""
author = "نيفين نيفى نوفا"
posted = "2007-05-06"
text = "يا صاحب او صاحبه التعليق اعتقد لما نسال حد لازم نذكر اسمنا<br />و بما ان انت او انتى مقولتش او مقولتيش اسمك و دا من حقك (للمذكر ) او حقك(للمؤنث) فمن حقى ان امتنع عن الاجابه"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519042323/http://www.20at.com:80/masr/t7kyk/5716.html"

[[comments]]
order = 7
subject = ""
author = "لؤى"
posted = "2008-01-21"
text = "ان اسكن فى شارع الهرم فى اولة فلا اجد فية اى متعة سؤ الاهرامات وسينما الهرم و شارع العريش غير ذلك لا اجد اى شئ اخر فمثلا الاسعار هنا غالية جدا حتى فى سوق الخضار و الملابس وكل شئ اما من نحاية التمشية فلا يمكن احد ان يتمشى فى الشارع و هو مع العائلة من نساء فسوف يخاف عليهم من المساحات الكبيرة التى لا يوجد بها اى شى سؤ اسوار اراضى مغلقة ولا يوجد بها اى اضائة وايضا فى النهار تخاف على اختك ان تمشى مسافة طويلة لوحدة بسبب المعاكاسات من اصحاب السيارات و المارة ايضا الذين يعتقدون ان اى فتاة او سيدة تمشى فى هذا الشارع هى سيدة غير محترمة وايضا كاريو مول وهو يعتبر المل الوحيد الكبير فى الهرم ولكن عندما تدخلة لا تجد سؤ مقلب زبالة سؤ من حيث النظافة او المترددين علية لنة لا يوجد بة امن ولا عمال نظافة وهذا هو راى واحد ساكن فى الهرم الرئيسى"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519042323/http://www.20at.com:80/masr/t7kyk/5716.html"
