[[comments]]
order = 1
subject = ""
author = "الى دعاء"
posted = "2007-05-04"
text = "هو الموضوع عن حياتك الشخصيه ولا عن الشارع يعنى انا شايف انكم بتدخلوا فى تفاصيل شخصيه فهل هذه هى الصحافه من وجهه نظركم فى الموقع ولا ايه يعنى انا شايف انكم بتحكوا تفاصيل حياتكم ناقص نعرف بتاكلوا ايه فى الموضوع القادم"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519042323/http://www.20at.com:80/masr/t7kyk/5716.html"

[[comments]]
order = 2
subject = ""
author = "الى نيفين"
posted = "2007-05-04"
text = "انا سعيد اني شفتك في الموقع الجديد امال فين صحبك ابن بهية دا هو قال انه ما بيردش على حد من المعلقين ابدا ولكن انتي الوحيدة اللي رد عليكي"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519042323/http://www.20at.com:80/masr/t7kyk/5716.html"

[[comments]]
order = 3
subject = ""
author = "نيفين نيفى نوفا"
posted = "2007-05-04"
text = "عندك حق يا دعاء<br />شتااااان ما بين الحياه ف شارع الهرم بالليل و بالنهار<br />جميله اوى عباره (رابضون يشاهدوننا كشريط سينيمائى)<br />العباره دى كنت كتير بقولها لاصحابى بشكل تانى<br />فعلا هل يا جماعه لو كانو اجدادنا عرفو ما سيؤل اليه الشارع ليلا كانو بنو الاهرامات ف المكان ده<br />سؤال يبدو احمق و لكن ربما يستحق التفكير"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519042323/http://www.20at.com:80/masr/t7kyk/5716.html"

[[comments]]
order = 4
subject = ""
author = "دعاء الشامي"
posted = "2007-05-05"
text = "السلام عليكم ورحمة الله وبركاته الى الاخ صاحب السؤال عن حكاياتنا عن حياتنا في الموضوعات، اشكرك على تعليقك لكن فيه موضوعات تستحق ان تكون شخصية لانها تخصنا فقط كموضوع الشارع ففكرة الملف في الاساس هي فكرة ذاتية احكوا لنا عن شوارعكم وممكن حضرتك كمعلق من ولا البلد تحكي لنا عن الشارع بتاعك وساعتها لن ننتقدك لانه حقك في التعبير اما عن الصحافة فليس من العيب ان نتناول موضوع من وجهة نظر شخصية وكثير من مقالات الرأي فيها ذاتية طبعا لا اقارن نفسي بكبار الكتاب ولكن هذا الموضوع اقرب الى مقال الرأي منه الى التحقيق<br />شكرا جزيلا دعاء الشامي"
archived = "2009-05-19"
capture_url = "https://web.archive.org/web/20090519042323/http://www.20at.com:80/masr/t7kyk/5716.html"

[[comments]]
