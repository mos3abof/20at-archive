subject = "الجامعة البوليسية"
author = "طالبة"
posted = "2006-03-11"
text = "ى كل وقت وصلاة تتعالى اصوات المشايخ بالمساجد (اللة اكبر اللة اكبر) وبعد احداث الدنمارك بدات الاصوات تعلو لنصرة النبى الكريم صلى اللة عليةوسلم وبعد ان تحدثت جميع القنوات والصحف الرسمية والقومية عن الاحداث المشينة عبر كل مسلم عن راية وكل طفل فى مدرستة وكل طالب فى جامعتة عن غضبةوفى جامعة جنوب الوداى وخاصة قنا قام احد الطلاب بلصق بوستر يحمل عنوان قاطعوا المنتجات الدنماركية من اجل نصرة النبى صلى اللة علية وسلم فانهال علية امن الجامعة بالضرب والاهانةهو وزميل اخر وقام بحجزيهما اكثر من ساعة داخل مكتب رئيس قواد الحرس بالجامعة فتجمع حشد كبير من الطلاب امام المبنى مطالبين باخراج الطلاب وتعالت الهتافات (ياحرية فينك فينك امن الدولة مابينا وبينك) فالى متى ستظل جامعتنا بوليسية؟"
archived = "2006-06-15"
