[[comments]]
order = 0
subject = "اليمن ,صنعاء"
text = "علمت أن أجفند تقدم المساعدات لمن يحتاج ذلك وأردت أن تعيشون معي مأساتي وتساعدوني ومشكلتي هي أني إقترضت مالاً من بعض الناس والمبلغ كبير جداًوقدره مايوازي 8000 سعودي وذلك لحاجتي الماسة اليها على أني سأردها في شهر 9م القادم ولكن ضروفي القاسية منعتني من ذلك ولاأدري ماذا أفعل بحثت عن فاعلين خير ليعينوني لكن لم أجد وبالأصح لم أستطع الإقدام على طلب مساعدةفأنا لم أفعلها أبداً وأصبحت الآن في مأزق كبيروأخترتكم أنتم لأملي الكبير بعد الله فيكم فأرجوا الله أن لاتردوني حتى ولو قرض إلى أن يفرجها الله علي وسأردها لكم والله شهيد على ذلك فأنا في كربة لايعلم بها إلا الله وأنا إمرأة أخاف أن أتبهذل أمام الناس أو يكبر الموضوع الى القسم وغيره والله اني لاأستطيع النوم من الخوف والهم كيف أرد المال ولايجد مجال آخرأفعله فأرجوكم بعد الله أن تضعون موضوعي هذا نصب عينيكم والله شاهد أني ماأكذب عليكم ولا بكلمة والله يسخط علي لو أكذب فحارت بي السبل وأغلقت الأبواب أمامي فدموعي لاتقف فأرجوا الله ان لايردني خائبة وأنا يمنية من صنعاء وهذا رقم تلفوني إذاكان في أمل 71764232 وأعطيتكم رقمي لأني لأدري كيف أتوصل معكم لأعرف الخبرولايوجد لدي بريد أو فاكس وسامحوني فقد اضطريت لذلك وهذه أول مرة في حياتي أطلب مساعدة وجزاكم الله خيراً على سماع مقالي ع ط"
