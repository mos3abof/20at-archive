order = 0
subject = "وعلكم السلام ..ايه دا كلوه ايه دا كلوه"
author = "هبابه او هوبه او هبهوب"
posted = "2006-04-02"
text = "\" الدين يسر طحن \"<br />\" سلام يا منطقه \"<br />\"الشيخ دا روش طحن \"<br />كرمله طبعا<br />\" دبدوب اسلامي \"<br />دبدوب طبعا<br />\" خش علي الدش واياك تكش \" انا لما اكون خايفه من حاجه ومش عايزه اعملها .<br />معرفش هو فيه يعني تفرقه عنصريه حتي في الالفاظ<br />اللاخوان ليهم اسلوب في الروشنه والسلفيه ليها اسلوب في الكلام<br />ايه في ايه ما اللي عنده كلام بيقوله وخلاص هو يعني لما السلفي يجيب كلمه من الاخواني يبقي كدا سرقوه مش فاهمه يعني ؟؟<br />وبعدين ايه غيرت الجزمه وخلتها حداء يعني انا لو قلت جزمه ابقي مش ملتزمه<br />مش فاهمه برده ولو قلت يا دادي يبقي مش ملتزمه ؟؟<br />اخيرا احنا بقي بنات روشه طحن برده وبتكلم زي البشر اللي حوليهاعشان ميفتكروهاش ارهابيه ؟ حد فاهم حاجه ايها \" المطحونين \""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

