[[comments]]
order = 8
subject = "اوعي الفتنة ...اوعي السريع"
author = "Dabdoob"
posted = "2006-04-03"
text = "انا شايف الموضوع مهم وحاسسه اوي<br />وفعلا لاحظت ان للملتزمين لغة خاصة شوية<br />وللمتزمتين منهم لغة رهيبة يعني مثلا انا شفت بعيني اولاد من قرايبي بينادوا ابائهم بابي وامي (مش عارف الاولاد بيتفاعلوا ازاي مع المجتمع باللغة دي) واهلهم كالعادة بيتكلموا طول الوقت عن الفتنة وهي كلمة غير محددة المعالم ممكن تطلق علي اي شيئ من الافكار الي الصور الي الشوارع التي توجد فيها malls الي الملابس في الفاترينات ...الخ وبرضه بيتكلموا ويتجادلوا كتير في تفاصيل خلافية صغيرة اوي<br />بالنسبة للاخوة الي شايفين الموضوع عبيط يا ريت يوضحوا ليه ؟؟؟؟؟؟؟؟<br />اما بالنسبة للاخ عبد الله مفتاح فجمهور السلفيين لا يصلون خلف الحليق باعتباره ليس عدلا وقد رايت بعيني هذا الموقف كثيرا ومش جزء بسيط منهم ولا حاجة اللي بيعمل كده (وماتقولش بستقصدك عشان ماضربكش)<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

