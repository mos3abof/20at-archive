[[comments]]
order = 16
subject = "إيه الجمال ده يامروة؟"
author = "محمد السيد"
posted = "2006-04-05"
text = "حكاية... الحقيقة ..الفكرة والمقارنة والإسلوب جميل جدا ...<br />أما بالنسبة للموضوع ...أنا شايف إنه طبيعي جدا إن التعبيرات دي تكون موجودة ... كل واحد بيتكلم بالخلفية اللي عنده .. بثقافته ..بطريقة حياته ..بالمصطلحات اللي اتعود عليها ...<br />لكن الجانب اللي ساعات مش بيعجبني ... أن ساعات المتدينين \" غالبا بيكونوا من الجيل القديم أو الملتزمين جداد أو من المقفولين شوية \" بيصعبوا الحكاية ... ساعات تلاقي الكلام مجعلص وكبير و تحس إنه بيتكلم لغة غير اللي الناس بتتكلم بيها ...<br />طيب ليه يا ابن الحلال ؟؟؟ ده سيدنا النبي لما أرسل لقومه كلمهم وخاطبهم بلغتهم ... بطريقتهم هم ... مش بطريقته هو ....<br />يعني مش لازم كل الكلام يكون بصيغة ... \"الأخ فلان , وإمام الشيوخ \" والألفاب الكبيرة دي \" اللي ساعات إخواننا في الحركة السلفية بيقولوها \" .. كمان ألفاظ من نوعية \" الغافلين ,.الفتنة .... \"<br />رفقا بالناس ....<br />في النهاية بأحييكي تاني يا مروة وبجد فكرتك عجبتني ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

