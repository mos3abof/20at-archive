author = "مها ميهو"
posted = "2006-04-03"
text = "أحيانا بشوف ان محتمع الملتزمين محتاج يتباسط( جاية م البساطة)مع الناس مش لازم يبقى ليهم سمت (على رأي واحده أخت<br />) زي مثلا رنات الموبايل، لو سمعت رنة موبايل نشيد(سنخوض معاركنا معهم مثلا) فتعرف على طول ان ده (أخ) اما لو لاقيته حاطط رنة تانية ومدلع الموبايل ومع ذلك ملتزم فإن من حوله لازم يستغربوا وحاجب ينزل وحاجب يطلع أو يعملوا كده"
