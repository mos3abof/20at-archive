[[comments]]
order = 22
subject = "موضوع جميل"
author = "مسلمه"
posted = "2006-04-16"
text = "معلش انا باين جيت متاخره اوى<br />بس انتى نسيتى حاجات مهمه جدا يعنى الحاجات الشخصيه بتاعه الشباب المتدين<br />زى \"السواك\" السنه النبويه اللى فى كتير منا نسيها<br />وكمان \"المسك\" و\"العود\" لانهم لا يستخدمون العطور المحتويه على كحول<br />كمان \"الاسبال\" الشباب المتدين يسبل ازاره \"هما بيقصرو الجلباب\"<br />لعلمكم حتى الطلبه فى الكليات اللى بيلبسوا بنطلونات برضوا بيقصروها<br />والله حياتهم جميله وحبهم لبعض فى الله واجتماعهم على الصلاه والحلق<br />اللهم اهدى شباب المسلمين اللهم اهدى فتيات المسلمين واهدنا معهم يا رب العالمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

[[comments]]
order = 23
subject = "تصيح"
author = "عمرو"
posted = "2006-04-17"
text = "بسم الله والحمد لله والصلاة والسلام على خير الدعاء إلى الله محمد بن عبد الله صلى الله عليه وسلم<br />اما بعد<br />فأن السلفية أولاً ليس بتيار دينى وانما هو منهج حياة وهو منهج الرسول صلى الله عليه وسلم واصحابه والتابعين باحسان إلى يوم الدين.<br />ويعتبر اى مسلم على وجه الأرض سلفى الى أن يعترف هو شخصياً بعكس ذلك ولا تعتبر الجماعات مثل الأخوان والتبليغ والدعوة من دون السلفين ولكنهم سلفين المنهج واذا وجد عندهم بعض الأخطاء فهذا ليس بعيب لان كلاً من لديه اخطاء ولا احد معصوم غير المعصوم صلى الله عليه وسلم.<br />ولكن يجب على كل مسلم اذا وجد عنده خطأ ان يصححه.<br />اما بالنسبة لبعض الألفاظ التى ذكرت فى المقالة فلى بعض التعليقات عليها:<br />أولاً: ان السلفين لا يطلقون لفظ اخ الا على المتحى فهذا خطأ لانهم يقولون لأى مسلم يا أخى.<br />ثانياً: أنهم لا يصلون إلا وراء المتلحى فهذا خطأ أيضاً لانهم يصلون وراء جميع المسلمين بدون استثناء.<br />ثالثاً: بالنسبة إلى موضوع النقاب فانهم يتمنون لكل اخت اعلى درجات العفاف وكل ملبس تنطبق عليه شروط الزى الأسلامى فهو الحجاب الشرعى.<br />وجزاكم الله خيراً<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

