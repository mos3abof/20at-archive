[[comments]]
order = 4
subject = "شكلك من الاخوان يا مروة"
author = "اخوانجيه 100%"
posted = "2006-04-02"
text = "مش هيعرف التفاصيل دى غير واحده من الاخوان<br />احييكى يا مروة ( انا بحب الاسم ده جدا)<br />وجزاكى الله خيرا<br />بس انتى نسيتى حاجه مهمه جدا ميفهمهاش غير الاخوان وبتوع خوف الدوله ( الاسم المستعار امن الدوله)<br />ال DF<br />شدى حيلك عاوزين مزيد من التقدم ومواضيع اكثر هدفا<br />الكلام الجاى لهبهوبه<br />لا يا هبهوبه مش معنى انك بتقولى كده انك مش ملتزمه<br />بس فى الفاظ معينه منتشره بين الملتزمين وبيحاولوا انهم ينشروها للحفاظ على اللغه العربيه ولانها كانت مستخدمه فى عهد الرسول صلى الله عليه وسلم لان الكلمات البديله ليها كلمات دخيله على اللغه العربيه<br />والكلام ده ينطبق اكثر على المصريين( الكلام المرة دى لسارة) لانهم مش بيتكلموا بالفصحى زى باقى الدول العربيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

