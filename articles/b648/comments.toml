[[comments]]
order = 13
subject = "بلاش كلمة بدعة دي"
author = "هاني ضوَّه"
posted = "2006-04-04"
text = "الأخ أو الأخت إللي كتب تنبية هام بيفرق فيه بين مفوم العقيقة والسبوع كان في هملاحة هامة جداً أحب أنبة ليها وهي إن البدعة في العبادت وليست في العادات.<br />العقيقة سنة (عبادة يعني) كل إللى بيعملها بيكن بيبتغي الثواب من الله وعارف إنها طاعة عبادة بيتقرب بها إلي الله سبحانه وتعالي، أما السبوع فهو عادة يعني مالهاش دخل بالدين يعني لا يقال عنها بدعة هي مباحة ما دامت لا تحوي محرم، فإذا وت شئ محرم صارت محرمة تبعاًً.<br />أما لو واحد عمل سبوع معتقد إن هذا عبادة أو سنة هنا تقدر تقول إنها بدعة إنما غير كده منقولش عليها.<br />فبلاش نضخم الأمور، لأن كلمة بدعة دي بيترتب عليها حاجات كتير معني كده إنها إللي عملها مبتدع ، والمبتدع عنده خطأ عقائدي، يني ممكن يصل للكفر وبالتالي التفرقة بينة وبين زوجتة، ولو أنجب يكون أولادهم أولاد زنا والعياذ بالله.<br />فكلمة بدعة دي كبيرة ربنا يخليكم ماتقولوش على حاجة بدعة إلا إذا كنتم متأكدين وفيه إجماع علماء على كده، مش كتاب ملون ولا شريط من شيوخ النكت يقول عليها بدعة تبقي بدعة.<br />ده كان توضيح بسيط<br />هاني ضوَّه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

[[comments]]
order = 14
subject = "مش متظبط.."
author = "Yahya_Ayash"
posted = "2006-04-04"
text = "هيهيهيهيييييي<br />الظاهر في عركة بين السلفية والإخوان على موضوع السبوع هتقوم هنا..<br />المهم..أنا شايف الحتة بتاعت قاموس الإخوان \"مش متظبط\" شوية، يعني ممكن نقول \"واقع\"، وبعدين انتوا برضو مش واخدين بالكم من حاجه مهمة قوي..<br />انه في إخوان سلفيين، وفي سلفيين إخوان، وفي طرفين فوسطين، وفي إخوان مش سلفيين (يعني مش على مذهب ابن تيمية)..المهم يعني، ده كله بيطلع قواميس جديدة داخل الإخوان..<br />يعني ممكن واحد إخوانجي يبقى عنده صب قاموس غير الصب قاموس بتاع التاني..في قاموس أساسي مشترك بينهم وفي صب قاموس، قاموس فرعي يعني..<br />الموضوع كبيييير يا جماعة!!<br />وبعدين تعالوا هنا..انتوا لم تشيروا إلى تطور لغات الملتزمين مع الزمن ومعدلات التطور مقارنة بالمجتمع العادي كما ونوعا!!<br />أنا رأيي انه كما يعتبر متساوي لأنهم في النهاية نفس المجتمع..<br />انما نوعا..لأ..فرق!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

[[comments]]
order = 15
subject = "so what ...."
author = "هبهوب..هوووبه..هبابه"
posted = "2006-04-05"
text = "بصي يا\"ختي\" من غير الف لو بتتكلمي عن الاخوان<br />احب اقولك من صغري وانا معاهم في مدرسهم اللي هي<br />\"الجيل المسلم\" كنا بنقول علي المدرسه \"استادة\"<br />والفصول باسماء صحابيات وصحابه\" زيد,علي,....\"<br />\"اسماء,حفصه,......\"<br />واالعالم السلفيه بغض النظر عن حليق او مش<br />عمو كان يفقعني بيتين شعر وبعدها بثانيه يضربني<br />علي قفايا .<br />اللي عايزه اقوله من الاخر , اتكلمي بللغه اللي حوليكي<br />سيان اخوان , سلفيه, علمانيه . عشان متحسيش انك<br />غريبه بنهم او العكس فهمتي يا \"بت\""
archived = "2006-11-02"
