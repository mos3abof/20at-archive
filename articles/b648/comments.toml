subject = "أنا مش إخوانجي ولا سلفي - بمفهوم ابن تيمية الحراني-"
author = "هاني ضوَّه"
posted = "2006-04-06"
text = "بسم الله الرحمن الرحيم<br />بداية أنا لست سلفياً -بالمفهوم المعروف الآن بتاع ابن تيمية الحراني- ولست أخوانجياً، فكان التنبية لوجود بعض اللبس فس المفاهيم بالنسبة لموضوع السبوع ده إللى هو من العادات.<br />بالنسبة لموضوع القاموس فأنا أتفق مع مع الأخوة إللي قالوا إننا نتكلم بالمصطلحات المتداولة والمعروفة في المجتمع، لية نعمل نفسنا كل شوية في حزب ولهم مصطلحاتهمالخاصة ولبسهم الخاص.<br />هاني ضوَّه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

