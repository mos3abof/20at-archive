[[comments]]
order = 25
subject = "الله اكبر و لله الحمد"
author = "اختكم سميره"
posted = "2006-04-26"
text = "السلام عليكم و رحمه الله و بركاته<br />من الكلمات اللى تقدر تعرف بيهااذا كان الانسان اللي قدامك ملتزم انك تلاقيه بيقول\"جزاكم الله خيرا\" مش كده؟؟؟؟؟؟؟؟؟؟؟؟<br />وهو مش النبي عليه الصلاه و السلام قال\"من صنع اليه معروف فقال لفاعله جزاك الله خيرا، فقد ابلغ في الثناء\"<br />يعني من الاخر افيد من كلمه شكرا و من كلمه ميرسي و ثانكس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

[[comments]]
order = 26
subject = "تابع الله اكبر و لله الحمد"
author = "سميره"
posted = "2006-04-26"
text = "بالمناسبه بالنسبه للناس اللى بيقولوا ميرسي و غيره من اللغات التانيه<br />انا في حياتي ما شفتش حد من الغرب بيقلدنا في اي حاجه و لا حتى في الكلمات<br />اشمعنى احنا اللي هانتمسح فيهم و ناخد منهم كتيييييير قوي من المظاهر؟؟؟؟؟؟؟؟<br />و هم مع ذلك بيحتقرونا عارفين ليه؟؟؟؟؟؟<br />علشان بنقلدهم وفي الحقيقه احنا احسن منهم باسلامنا و بانتمائنا لامه الحبيب محمد خير البشر عليه الصلاه و السلام و بالتالي لازم كلنالما نحب نقلد يبقى نقلد احب الناس الى الله سبحانه و تعالى نقلده في كل حاجه بالكلام و باللبس و بالتصرفات<br />ولا ايه؟<br />حد عنده اعتراض؟<br />\"نحن قوم اعزنا الله بالاسلام فان ابتغينا العزه في غيره..................\"<br />حد يكمل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

[[comments]]
order = 27
subject = "الموضوع حلو و انا اخوان اخوان و من مستخدمى هذا القاموس الرائع"
author = "akhwan 100"
posted = "2006-04-28"
text = "اولا<br />من رائى نستخدم قاموس اسلامى احسن ما يكون عبرى<br />و الموضوع شيق و كويس و جرئ و بيناقش كلام بين السطور فعلا<br />بالنسبة لسؤالك يا مروة ان الكلام دا نابع منين فانا بقول ان دلوقتى ناس كتير \" ربنا يهدينا و يهديهم \" بقوا بيستخدموا الالفاظ دى عشان يعملوا ستار على نفسهم و عشان تظنيهم ناس متدينين (( دى بتقول جزاكى الله خيرا تبقي متدينة))<br />تانى حاجة انا من مستخدمة جميع هذه الالفاظ فعلا و ذلك لانى اخوان اخوان اخوان<br />و نسيتى بردو تقول ((رع))محدش بردو ميعرفهاش حد غيرنا<br />بس الموضو ع حلو بجد<br />ور بنا يهدينا كلنا بجد وانا اولكوا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

[[comments]]
order = 28
subject = "الكلام يحتاج لكلام"
author = "أبو عبد الله"
posted = "2006-04-29"
text = "السلام عليكم<br />بعض من المكتوب فى المقال خاطئ ويفتقر للدقة<br />وعلى ذلك أدعو الناس كلهم إذا كان يهمهم الأمر إلى معرفة معنى كلمة سلفى<br />أما عن ابن تيمية<br />فهو شيخ الاسلام أحمد بن عبد الحليم بن تيمية لا يحتاج الى تعريف<br />أما كلمة أبى وأمى فلا أعرف ما الضرر من استخدامها أليست صحيحة<br />أما جزاكم الله خيرا فهذا خلق رسول الله صلى الله عليه وسلم<br />أما موضوع اللحية فوالله الأمر غريب جدا<br />اللحية كانت فى وجه النبى صلى الله عليه وسلم<br />وكان عندهم حديدة (موس يعنى ) لماذا لم يحلقها<br />أقول لكم لأن الله أمره بها<br />فخرج الرجلان يُغِذَّان السير الى غايتهما شطر المدينة ، حتى إذا بلغاها علما مما رأيا من تعظيم أهل المدينة للنبى صلى الله عليه وسلم وحبهم له مدى خطورة المهمة التى أقبلا من أجلها حيث إنهما لا يستطيعان أن يأتيا بمحمد إلا إذا أتيا بأهل المدينة أجمعين ، نظرًا للمحبة والفداء التى يصنعها أهل المدينة لمحمد صلى الله عليه وسلم .<br />ولما دخلا على رسول الله صلى الله عليه وسلم ، وقد حلقا لحاهما وأعفيا شواربهما، فكره النظر إليهما، وأظهر ذلك لهما وقد أشاح بوجهه الى الجانب الآخر حتى لا ينظر إليهما وقال: ( ويلكما من أمركما بهذا؟ قالا أمرنا ربنا يعنيان كسرى فقال رسول الله صلى الله عليه وسلم ولكن ربي أمرني بإعفاء لحيتي وقص شاربي )<br />بعد ذلك أيها المسلم سواء كنت عادى أو اخوانى ومعظم الاخوان للأسف الشديد من أهل الحلاقة أترضون أن يعرض عنكم رسول الله صلى الله عليه وسلم<br />أما موضوع النقاب ففيه خلاف بين أهل العلم<br />الألبانى مثلا أجاز كشف الوجه<br />هذا مثال<br />وأنا مع تغطية الوجه<br />أما الألفاظ الجديدة للمتدينين الروشيين فغالبها لا قيمة لها<br />وللحديث بقية ان شاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

[[comments]]
order = 29
subject = "ابن تيمية ينادى"
author = "يا سَائِلي عَنْ مَذْهَبِي وعَقيدَتِي"
posted = "2006-04-29"
text = "( أقرأها كلها للفائدة )<br />يا سَائِلي عَنْ مَذْهَبِي وعَقيدَتِي<br />رُزِقَ الهُدى مَنْ لِلْهِدايةِ يَسْأَل<br />اسمَعْ كَلامَ مُحَقِّقٍ في قَـولـِه<br />لا يَنْـثَني عَنـهُ ولا يَتَبَـدَّل<br />حُبُّ الصَّحابَةِ كُلُّهُمْ لي مَذْهَبٌ<br />وَمَوَدَّةُ القُرْبى بِها أَتَوَسّــل<br />وَلِكُلِّهِمْ قَـدْرٌ وَفَضْلٌ سـاطِعٌ<br />لكِنَّما الصِّديقُ مِنْهُمْ أَفْضَـل<br />وأُقِـرُّ بِالقُرآنِ ما جاءَتْ بِـهً<br />آياتُـهُ فَهُوَ القَديـمُ المُنْـزَلُ<br />وجميعُ آياتِ الصِّفاتِ أُمِرُّهـا<br />حَقـاً كما نَقَـلَ الطِّرازُ الأَوَّلُ<br />وأَرُدُّ عُقْبَتَـهـا إلى نُقَّالِهـا<br />وأصونُها عـن كُلِّ ما يُتَخَيَّلُ<br />قُبْحاً لِمَنْ نَبَذَ الكِّتابَ وراءَهُ<br />وإذا اسْتَدَلَّ يقولُ قالَ الأخطَلُ<br />والمؤمنون يَـرَوْنَ حقـاً ربَّهُمْ<br />وإلى السَّمـاءِ بِغَيْرِ كَيْفٍ يَنْزِلُ<br />وأُقِرُ بالميـزانِ والحَوضِ الذي<br />أَرجـو بأنِّي مِنْـهُ رَيّاً أَنْهَـلُ<br />وكذا الصِّراطُ يُمَدُّ فوقَ جَهَنَّمٍ<br />فَمُوَحِّدٌ نَـاجٍ وآخَـرَ مُهْمِـلُ<br />والنَّارُ يَصْلاها الشَّقيُّ بِحِكْمَةٍ<br />وكذا التَّقِيُّ إلى الجِنَانِ سَيَدْخُلُ<br />ولِكُلِّ حَيٍّ عاقـلٍ في قَبـرِهِ<br />عَمَلٌ يُقارِنُـهُ هنـاك وَيُسْـأَلُ<br />هذا اعتقـادُ الشافِعيِّ ومالكٍ<br />وأبي حنيفـةَ ثم أحـمدَ يَنْقِـلُ<br />فإِنِ اتَّبَعْتَ سبيلَهُمْ فَمُوَحِّـدٌ<br />وإنِ ابْتَدَعْتَ فَما عَلَيْكَ مُعَـوَّلًًًً<br />هذا هو ابن تيمية وهذا أبوحنيفة وأحمد ومالك والشافعى<br />فإِنِ اتَّبَعْتَ سبيلَهُمْ فَمُوَحِّـدٌ<br />وإنِ ابْتَدَعْتَ فَما عَلَيْكَ مُعَـوَّلًًًً<br />هذه هى السلفية ببساطة!!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123431/http://www.20at.com/article2.php?sid=648"

