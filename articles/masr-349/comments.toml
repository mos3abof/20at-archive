[[comments]]
order = 15
subject = "شعب وحش .. ياي ي ي"
author = "http://ibnbahya.blogspot.com/"
posted = "2006-07-11"
text = "بعض المعلقين يقول .. لقد ضاعت كرامة الشعب المصري .. يا راجل ؟ بقى ده كلام ؟؟؟ انته طيب والله .. طيب هو فين الشعب المصري أصلاً ؟؟ ده مات يا بني واندفن .. ولا كرامة لجثة هامدة هدها الجوع والإرهاق والتعب من السعي والكدح على الرزق الذي لا يأتي .. طيب هي فين مصر أصلاً ؟؟؟ باعوها يا بني وقبضوا التمن واتقسمت الحسبة ما بين أفراد العصابة القدام والجداد .. بس تصدق إننا شعب لئيم ؟؟؟ كنا بنصرخ لما يوسف والي باعنا للصهاينة وخدله كام مليون ولا الشاذلي عامل تسعيرة لدخول كليات الشرطة والحربية .. طيب والله دول كانوا غلابة لو قارنا بينهم وبين الغجر الموجودين حالياً من أمثال أحمد عز وحسام بدراوي وكل الكلاب اللي شغالين نهش في بلدنا ...<br />http://ibnbahya.blogspot.com/"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905224230/http://masr.20at.com:80/article.php?sid=349&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

