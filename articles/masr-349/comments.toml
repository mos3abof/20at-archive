posted = "2006-06-08"
text = "مرة واحد بلديتنا ركب الاتوبيس و طلب من الكمسرى تذكرتين فسألة الكمسرى ليه عايز تذكرتين قالة بلديتنا علشان لو واحدة ضاعت يبقى معايا واحدة راح سالة الكمسرى طب لو ضاعوا الاثنين رد علية بلديتنا مش مشكلة ما انا معايا ابونية( أشتراك )"
archived = "2006-06-13"
