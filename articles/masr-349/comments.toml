text = "سمعت \" واحد بلدياتنا \" في مؤتمر له و كان بيتكلم علي الزحمة و حال الشعب \" لما الواحد يبقي مرتبه 100 جنيه و عنده 4-5 عيال , طيب هايأكلهم منين؟ و بعدين هاملكم ايه؟ و عايزين الحكومة تعملكم ايييييييييه؟ \" . طبعا ربنا يكون في عونه و ياخدنا من وشه ..... و يجعله عامر !"
