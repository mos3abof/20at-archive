subject = "اللي علي راسه بطحه"
author = "بحب مصر زي ماهية"
posted = "2006-05-29"
text = "تفتكر لو مكانش معاك غير ربع جنية وانت في الهرم وعايز تروح مصر الجديده يا تري حتفكر في تاكسي العاصمة ولا السي تي ايه ولا يا تري حتاخد ميكروباز ولا حتبقي مضطر غصب عن عينك انت تتلاحم مع الشعب في سيمفونيه زق متبادل .....<br />اقولكم من الاخر الحمد لله ان احنا عايشين في مصر البلد الوحيده اللي لو معكش غير ربع جنيه حتروح المكان اللي انت عايزة ولو معاكش غير ربع جنية حتعرف تجيب رغيف عيش واربع طعميات وتاكل وتحمد ربنا لكن الناس اللي بتشات عالنت وتقرا سايت زي عشرينات لا يمكن تحس بالم الناس دي وممكن تتريق عليهمبل وتقول عليهم يا مساكين اعمل اللي عليك واجتهد وبعد كده حاسب الظروف....<br />وللحديث بقية........"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025727/http://masr.20at.com:80/article.php?sid=349"

