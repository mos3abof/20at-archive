subject = "بلدنا الغالية"
author = "تفاعل كيميائي"
posted = "2006-05-21"
text = "تفتكروا ياجماعة الناس دي بتحب الزحمة للدرجة دي؟ معتقدش .<br />الفكرة كلها ان البلد ليها هدف من الزحمة دي<br />يعني لو كل واحد لقي كرسي فاضي في الاتوبيس و قعد علية و بقي الاتوبيس تمام و فاضي و رايق.<br />دة اكيد هيفرح الناس بس مش هيفرح الحكومة علشان البلد عتنضف لكن محدش عايز البلد تنضف<br />وبعدين الشعب المصري واخد علي كدة من زمان يعني بيحب الشعبطة وبعدين الاغرب من كدة تيجي تشوف سواق الاتوبيس لما الاتوبيس اتملي علي عين امةيقف هو لية بقي؟<br />ماهو من الشعب برضة بس مخة تعبان"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025727/http://masr.20at.com:80/article.php?sid=349"

