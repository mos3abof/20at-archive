[[comments]]
order = 11
subject = "ده من معالم مصر 0000 المخروبه"
author = "الاستاذشيكو"
posted = "2006-06-06"
text = "الاتوبيس ده شبع تريقه من ساعت ما اخترعوا الاختراع ده وه مش عاجب حد تقلش يعني كل حاجه مظبوطه والاتوبيس هو اللي هايبوظها !!!!!<br />ما البلد من زمان كانت وهاتبقي وستظل وللابد كده من غير مقاطعه وتلاقي الراجل محشور في الاتوبيس والمذيعه بتسال المسئول بتاع التصاريح والتريح وهو يقولها اصل احنا ف الصيف الراجل عايز يشم هوا القاهرة ولو ف الشتاء هايقولها عشان الناس لما تتزنق وتتحشر تدفىء بعض وكده يعني<br />الاتوبيس والفساد والاهمال والكوسه<br />من اهم الرموز اللي السايح بينزل عشان يشوفهم ع الطبيعه في مصر<br />اصله محروم منهم في بلدة"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025727/http://masr.20at.com:80/article.php?sid=349"

