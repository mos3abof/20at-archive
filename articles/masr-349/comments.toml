subject = "الشعب الضفيرة"
author = "والله فكرتونى بسمير غانم فى مسرحية فى مسرحايته و هو بيوصف الاتوبيس بشئ من الكوميديا السودا و هو بيوصف معاناتها و اخر معاناه انه ازاى ينزل من الاتوبيس"
