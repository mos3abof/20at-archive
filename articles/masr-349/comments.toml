subject = "مش شغللك يا مش شغللك"
author = "نيفين"
posted = "2006-05-23"
text = "يبقى انت اكيييييييييد ف مصر<br />ايه توارد الخواطر ده يا مش شغللك<br />اصلة انا كنت حابه اعلق هنا و اقول يبقى انت اكيد ف مصر بس لقيتك كاتباها و لسعه معلقه نفس التعليق ف موضوع كباريكى يا مصر<br />القلوب عند بعضها يا جميل<br />ها لسه عايزانى اقول<br />كان بيدور ع اللى يخضر قلب الناس القاسى البور<br />بس انتى ماللك و مال الموضوع دا<br />انتى ف safe side يا باشا<br />يعنى بصراحه مش شغللك الموضوع دا خالص<br />ابقى افتحى ايميللك<br />يختى"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025727/http://masr.20at.com:80/article.php?sid=349"

