[[comments]]
order = 2
subject = "اقتربت الفوضى !!!!"
author = "مواطن !"
posted = "2006-09-04"
text = "لماذا أمريكا وإسرائيل تدفع مبارك دفعا لتنفيذ مخطط التوريث ؟<br />ليس هناك سوى تفسير واحد ألا وهو أن إسرائيل تريد أن تعم الفوضى مصر .. فمن المعروف أنه بمجرد مخطط التوريث سيعمل جمال على تثبيت حكمه من خلال القمع والإرهاب ولن يجرؤ أحد أن يتكلم ... طبعا هذا الوضع لن يدوم طويلا فالإقتصاد المصرى الآن منهار وما هى إلا سنوات قليلة تحت حكم جمال إلا وسنجد مصر قد ضاعت وسيخرج الفقراء والمهمشين وسيهبون كل شىء ، وستغذى إسرائيل هذه الفوضى ولن تعود مصر دولة مركزية مرة أخرى . ولو تأملنا سنجد أننا نستحق تلك النهاية المأساوية ، فعلى الرغم من أن الجميع يعلم حجم الكارثة إلا أن الصمت سيد الموقف . الجميع فى وضع إستعباط ، بدءا بالكتاب والمفكرين مرورا بالإخوان ، الجميع ينتظر أن تحدث الكارثة والجميع لا يريد أن يحاول منعها .. لينظر كل منا حوله ويسأل نفسه هل نحن فعلا دولة أم نحن زبالة ؟ للأسف المصيبة الكبرى ألا وهى الفوضى قد اقتربت والجميع ينظر ويشاهد وكأن الأمر لا يعنيه ."
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925180516/http://masr.20at.com:80/article.php?sid=878"

[[comments]]
order = 3
subject = "الى ابن بهية"
author = "الى ابن بهية"
posted = "2006-09-04"
text = "( الأمر بالمعروف و النهي عن المنكر )<br />- بصراحه لقيت الموضوع ده مهم جدا علشان ابدأ بيه اول درس في الحارة<br />- و قبل ما نتكلم عن الامر بالمعروف و النهي عن المنكر تعالوا سوا نقرأ الآيات القرآنيه دي :-<br />- قال تعالى :- ( و لتكن منكم أمة يدعون الى الخير و يأمرون بالمعروف و ينهون عن المنكر و اولئك هم المفلحون )<br />- و قال تعالى :- ( كنتم خير امة اخرجت للناس تأمرون بالمعروف و تنهون عن المنكر و تؤمنون بالله )<br />- و قال تعالى :- ( يؤمنون بالله و اليوم الآخر و يأمرون بالمعروف و ينهون عن المنكر و يسارعون في الخيرات واولئك من الصالحين )<br />- و قال تعالى :- ( لعن الذين كفروا من بني اسرائيل على لسان داود و عيسى ابن مريم ذلك بما عصوا و كانوا يعتدون , كانوا لا يناهون عن منكر فعلوة لبئس ما كانوا يفعلون )<br />- و قال تعالى :- ( المنافقون و المنافقات بعضهم من بعض يأمرون بالمنكر و ينهون عن المعروف و يقبضون ايديهم نسوا الله فنسيهم إن المنافقين هم الفاسقون )<br />- و قال تعالى :- ( و المؤمنون و المؤمنات بعضهم اولياء بعض يأمرون بالمعروف و ينهون عن المنكر و يقيمون الصلاة و يؤتون الزكاة و يطيعون الله و رسوله اولئك سيرحمهم الله ان الله عزيز حكيم )<br />- و قال تعالى :- ( التائبون العابدون الحامدون السائحون الراكعون الساجدون الآمرون بالمعروف و الناهون عن المنكر و الحافظون لحدود الله و بشر المؤمنون )<br />- و قال تعالى :- ( الذين ان مكّناهم في الارض اقاموا الصلوة و اتوا الزكوة و امروا بالمعروف و نهوا عن المنكر و لله عاقبة الامور )<br />- و قال تعالى :- ( يا بني اقم الصلاة و أمر بالمعروف و انه عن المنكر اصبر على ما اصابك إن ذلك من عزم الامور )<br />- و قال صلى الله عليه و سلم :- ( من رأى منكم منكرا فليغيرة بيده , فإن لم يست<br />اقرأ بقية التعليق .."
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925180516/http://masr.20at.com:80/article.php?sid=878"

