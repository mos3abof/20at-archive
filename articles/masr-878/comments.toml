subject = "الجيش المصري فين ؟؟ وساكت ليه ؟؟؟"
author = "إبن بهية"
posted = "2006-09-04"
text = "الجيش المصري فين ؟؟ ؟؟؟؟؟<br />الرئيس رغم أنف المصريين .. .. العميل .. القذر .. بدأ زيارات متتالية لأفرع الجيش المصري الذي نهبه وبهدله وجعله شخشيخة في إيد عصابات البيزينس بتوع أولاد الكلب .. طبعا المقصود أولاد مبارك .. مش هو الكلب الكبير برضه .. المهم بدأ الكلب في زيارات مكشوفة ومفضوحه للجيش .. لكن هل يفيد هذا نظامه المتهاوي ؟؟؟ طبعاً لأ وكداب يا خيشه .. الغريب أن مبارك نسي مصيبته الكبيرة وعمالته لإسرائيل وتواطؤه معها لضرب لبنان وكان واضحا هذا ن تعليقات ومواقف مصر السياسية التي جعلت الصحفيين الشبان في لبنان يشتمون أحمد أبو الغيط ويبهدلوه في المؤتمر الصحفي .. وجاي سعادة حسني يقول للجيش المصري في القيادة الغربية (على حود ليبيا.. إيه اللي فكره بيهم؟؟؟) بيقولهم أن مصر أدانت بشدة اعتداءات اسرائيل على لبنان ... طيب أدان ازاي وفين الجزمة ده ؟؟؟ أدانها في الحمام يعني ولا في الحلم ... بالذمه مش زودها أوي أوي أوي .. طيب الجيش ساكت ليه ؟؟؟؟ اسألوا القادة بتوع الجيش المهلهل ...<br />منذ أيام صرح أحد أفراد عصابات مبارك (حسام بدراوي بتاع مجزرة \"\"عفواً\"\" مستشفى بدراوي بالمعادي) أن جيمي مبارك وده إسمه الحقيقي البريطاني .. أن جيمي هو من يصلح لقوادة مصر في المرحلة المقبلة .. بدأت اسطوانة التوريث تذاع في وسائل الإعلام بعد سنوات من التسجيل والمونتاج والإخراج ... بدأنا نسمع أولى وصلاتها ... طيب لإمته يا بلد ؟؟؟ والجيش فين من المصيبة دي ؟؟؟ الجيش المصري اللي بياخدوا مرتباتهم من جيوبنا ومن دم مصر فين ؟؟؟ فين القسم اللي أقسموه على أنفسهم بحماية الوطن ؟؟ طيب وفين الحماية دي ومبارك وعصاباته بيبيع في مصر لليهود حتى حتة .. الجيش مستني إيه ؟؟؟ ولا الجيش مستريح ومالوش دعوة تتحرق البلد والناس ؟؟؟ طبعا مبارك ضا<br />اقرأ بقية التعليق .."
archived = "2006-09-25"
capture_url = "https://web.archive.org/web/20060925180516/http://masr.20at.com:80/article.php?sid=878"

[[comments]]
order = 1
subject = "يا ااا ليفى (وإخوانه)"
author = ".زنوبه"
posted = "2006-09-04"
text = "يا ترى يا ليفى إنت وإخواتك معانا فى الموقع النهارده بآسمائكم الحقيقيه واللا بآسماء مستعاره ـ منتحلين آنى إسم النهارده علشان توقعوا الناس فى بعض؟<br />مين يا ترى؟؟!!<br />نفسى آسمع تعليقك الحلو على الموضوع ده يا ليفتى بس بدون آسماء مستعاره<br />يعنى خلينا واضحين مع بعض آحسن وحلوين وبلاش حركات اليهود دى ـ وما تخافش حتكلمك مصرى بالمفتشى."
archived = "2006-09-25"
