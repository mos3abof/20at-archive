[[comments]]
order = 2
subject = ""
author = "عماد حمدى"
posted = "2008-07-27"
text = "وقال المخرج المصري البالغ من العمر78 عاما إنه يشعر بالغضب الشديد عندما يعلو صوت أذان الصلاة عبر مكبرات الصوت في مساجد القاهرة ليقطع عليه حديثه مع الآخرين قائلا\\\\\\' سأشتري مكبرا للصوت أكثر قوة لبث موسيقى أمريكية بصوت عال جدا، أعلى من صوت المؤذن \\\\\\'.<br />هذا هو يوسف شاهين<br />قال رسول الله (صلى الله عليه سلم)<br />(إن العبد ليتكلم بالكلمة من رضوان الله لا يلقى لها بالاً يرفعه الله بها درجات وإن العبد ليتكلم بالكلمة من سخط الله لايلقى لها بالاً يهوى بها فى جهنم) {رواه البخارى}<br />وقال الله عز وجل بسم الله الرحمن الرحيم<br />( ما يلفظ من قول إلا لديه رقيب عتيد ) {سورة ق}<br />(وتحسبونه هيناً وهو عند الله عظيم) {سورة النور} صدق الله العظيم"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094053/http://www.20at.com:80/2khbar/9719.html"

