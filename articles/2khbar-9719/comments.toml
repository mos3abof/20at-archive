text = "الله يرحمه ويقدس روحه .. فنان لم ولن يتكرر .. صحيح مختلف معاه فى حاجات كتير لكن بجد من الناس الى كانت ومازالت رائعه . وياريت الاخوه الى مشافوش افلام ليوسف شاهين ميقولوش رايهم المتشدد المتعصب عشان محدش يضحك عليهم .<br />تحياتى"
