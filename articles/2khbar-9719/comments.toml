posted = "2008-07-27"
text = "رحل جو يوسف شاهين<br />مخرج فيلم الارض وجميلة بوحيرد والناصر صلاح الدين<br />كان رجلا علمانيا ولكنة متمكن من فنة ونال جوائز عالمية كثيرة<br />رحل من الدنيا الفانية<br />وسيقابل وجة الكريم<br />ان احسنتم احسنتم لانفسكم<br />ولا يبقى غير الصالحات<br />وياليت الفراعين يتعظون"
archived = "2009-06-02"
capture_url = "https://web.archive.org/web/20090602094053/http://www.20at.com:80/2khbar/9719.html"
