text = "عَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ الْعَاصِ ، عَنِ النَّبِيِّ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ , قَالَ : \" إِنَّ اللَّهَ لا يَقْبِضُ الْعِلْمَ بِأَنْ يَنْتَزِعَهُ انْتِزَاعًا ، وَلَكِنْ يَقْبِضُهُ بِقَبْضِ الْعُلَمَاءِ ، حَتَّى إِذَا لَمْ يَبْقَ عَالِمٌ حَدَّثَ رُءُوسٌ جُهَّالٌ فَسُئِلُوا فَأَفْتُوا بِغَيْرِ عِلْمٍ ، فَضَلُّوا وَأَضَلُّوا \" . هَذَا حَدِيثٌ صَحِيحٌ ثَابِتٌ مُتَّفَقٌ عَلَى صِحَّتِهِ مِنْ حَدِيثِ أَبِي الْمُنْذِرِ هِشَامِ بْنِ عُرْوَةَ"
archived = "2010-01-14"
capture_url = "https://web.archive.org/web/20100114044414/http://20at.com/masr/review/14865-2010-01-13-16-45-19.html"

