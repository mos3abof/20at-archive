subject = ""
author = "لكل عصر"
posted = "2010-01-14"
text = "لكل عصر رجالة ومفكرية<br />ففى عصر الاستعمار والظلام كان هناك حس البنا<br />وبعد الحرب العالمية الثانية كان هناك على الجندى<br />وايام المد الشيوعى والاشتراكى كان هناك الشيخ محمد الغزالى والامام الدكتور عبد الحليم محمود<br />وفى ايام النكسة والانفتاح الساداتى كان هناك الشيخ كشك<br />وفى ايام البترودولار كان هناك الشيخ متولى الشعراوى<br />وفى ايام الانبطاح امام اسرائيل والدمار الاقتصادى هناك عمرو خالد ومصطفى حسنى ومعز مسعود<br />وكل عصر بيفرز رجالة"
archived = "2010-01-14"
capture_url = "https://web.archive.org/web/20100114044414/http://20at.com/masr/review/14865-2010-01-13-16-45-19.html"

