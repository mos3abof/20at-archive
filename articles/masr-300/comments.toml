subject = "ايه يا سكارلت .."
author = "مش شغلك .."
posted = "2006-05-10"
text = "مش قلنا قبل كدا<br />واه من بكره وعمايله<br />واه من الي الزمن شايله<br />واه من حلم عاااالي لفوق ولسه الكف مش طايله.<br />والله الواحد بيجيله احباط بعد اما يخش علي الصفحه دي بحس اني عايزه ارجع ...بس لاسف انا من البشر اللي عندها \"امل \"<br />يلا اوعو تسمعو لكلام دبدوب \" مفيش فايده \"©"
archived = "2006-05-19"
capture_url = "https://web.archive.org/web/20060519023526/http://masr.20at.com:80/article.php?sid=300"

