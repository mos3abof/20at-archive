[[comments]]
order = 3
subject = "كان زمان"
author = "رضوى اسامة"
posted = "2006-05-10"
text = "احب اضيف علي اللي كتبته احساسي اول ما رحت هناك في البورصه بعد القبض علي معظم اصحابنا في الاعتقالات الاخيرة بتاعة القضاه ..ياااه كان احساس مر قوي ..اكتشفت ان المكان بناسه مش بحيطانه وكراسيه ..لقيت ناس تانيه غيرنا قاعدين وبيحلموا احلام مش بتاعتنا ..ما لفيتش مالك وعلاء وابراهيم ورشا واسماء وندي وشرقاوي ..كلهم كانوا جوه الزنازين ..حتي الحلم ما اعرفتش احلمه لوحدي من غيرهم ..ياااه اتوجعت قوي وانا بقرا اللي كتبته عن البورصه اصله كان من فتره..من ايام ما كان في حرية زائفه في اننا نتظاهر بشكل سلمي واننا نروح البورصه نصيغ احلامنا مع فنجان قهوة وكوباية شاي"
archived = "2006-05-19"
capture_url = "https://web.archive.org/web/20060519023526/http://masr.20at.com:80/article.php?sid=300"

[[comments]]
order = 4
subject = "يعنى ايه كلمه وطن"
author = "نيفين"
posted = "2006-05-10"
text = "يعنى ارض<br />حدود<br />مكان<br />و لا<br />حاله م الشجن<br />و حاله م الشجن دى هى اللى حسيتها لما خلصت مقاللك الاكثر من رائع يا رضوى<br />انا معاكى ان لو بطلنا نحلم نموت و او بطلنا نحلم لمصر و بمصر (تانيه)نموت<br />بس انتى مش معايا ان من الغباء اننا نطلق العنان لاحلامنا لحد ما تبقى حبال طويله نخنق نفسنا بيها؟<br />صدقينى اسفه لو كنت بتشبيهى دا حولت الشجن اللى ف المقال لحزن اسود على راى عمنا صلاح عبد الصبور<br />انا جربت الاحساس اللى بتوصفيه دا كتير على الفيشاوى ومع فنجان القهوه المانو حلمت انا و اصحابى ياما بس كانت الاحلام بتتبخر ف الزحام و مع اول مطالعه لقناه الجزيره<br />عموما المقال رائع و خلانى ابكى<br />و ارجع احلم من تانى"
archived = "2006-05-19"
capture_url = "https://web.archive.org/web/20060519023526/http://masr.20at.com:80/article.php?sid=300"

[[comments]]
