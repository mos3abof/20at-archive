[[comments]]
order = 8
subject = "حقا ما هي إلا أوقات"
author = "محرز"
posted = "2006-05-15"
text = "\"أماكننا المشتهاة ليست إلا أوقاتا\"<br />رغم إني لسة جديد على الناس دي ومعرفش منهم غير كام واحد، عرفتهم عن طريق مالك.<br />كلامك فكرني باليوم اللي قعدت فيه أنا ومالك وعمرو عزت مع بعض، كانت اول مرة اقابل عمرو، وبعدها اتقابلنا تاني في مهرجان أيام اشتراكية.<br />يارب مالك يخرج بسرعة وترجع القعدة الحلوة دي تاني عشان يعرفني على بقية الناس الحلوة دي<br />رغم اني معرفهمش شخصيا واعرفهم فقط من خلال مدوناتهم إلا اني بحبهم بجد ونفسي اعرفهم اكتر على الحقيقة"
archived = "2006-05-19"
capture_url = "https://web.archive.org/web/20060519023526/http://masr.20at.com:80/article.php?sid=300"

[[comments]]
order = 9
subject = "سكارليت معادتش سكارليت"
author = "نيفين"
posted = "2006-05-15"
text = "و الله يا مش شغللك احوال الدنيا و البلد غيرتنى كتير<br />بحس انى معدتش اسكارليت بتاعه زمان<br />بس رغم ان كل حاجه بتمشى عكس ارادتنا<br />مش هنبطل نحلم<br />مش هنبطل نحلم"
archived = "2006-05-19"
capture_url = "https://web.archive.org/web/20060519023526/http://masr.20at.com:80/article.php?sid=300"
