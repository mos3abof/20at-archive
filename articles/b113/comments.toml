[[comments]]
order = 0
subject = "قلوبنا تخفق بالدعاء"
author = "مون مون"
posted = "2005-12-18"
text = "اول ما سمعنا الخبر دعونا وكلنا يقين ان قلوب الملايين عبر العالم تخفق معنا بالدعاء ان لايخرج منها سالم ولوخرج فلايخرج على رجليه انما في تابوت<br />وله في ذلك حكم سبحان الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152138/http://www.20at.com/article2.php?sid=113"

[[comments]]
order = 1
subject = "يللا سكه و طريق"
author = "نيفين"
posted = "2005-12-19"
text = "قبيح وجهك المرسوم من اشلاء قتلانا<br />الخبر ده احلى خبر سمعته من زمان<br />فى داهيه..لا ف 60 الف داهيه<br />الله يحرقه بس يا ريت ربنا يسهلله بسرعه لان ابواب النار التمانيه و كل زبانيه العزاب مسنيينه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152138/http://www.20at.com/article2.php?sid=113"

[[comments]]
order = 2
subject = "فى داهيه"
author = "شيماء وامل"
posted = "2005-12-19"
text = "يارب تموت النهارده قبل بكره<br />وايا كان هتتحرق فى جهنم يا وغد يا سفاح<br />تسعرى واشتدى يا نار ..شارون جايلك على نار<br />والله اكبر ولله الحمد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152138/http://www.20at.com/article2.php?sid=113"

[[comments]]
order = 3
subject = "الموت لك واللعنه عليك يا شارون"
author = "جيل النصر"
posted = "2005-12-19"
text = "اخوات جامعة اسكندريه فى انتظار خبر انتقال القاتل شارون من الحياة الدنيا الى نار جهنم ....قريبا جدا<br />وان غدا لناظره قريب<br />نصر الاسلام قادم<br />وغدا موعدنا القدس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152138/http://www.20at.com/article2.php?sid=113"

[[comments]]
order = 4
subject = "بكره الاهرام ينزل نعي"
author = "هشام حمزة"
posted = "2005-12-19"
text = "مش بعيد تحصل<br />مش هتيجي على دي يعني!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152138/http://www.20at.com/article2.php?sid=113"

[[comments]]
order = 5
subject = "صلاة الغائب أثابكم الله"
author = "محمد علي"
posted = "2005-12-19"
text = "مش بعيد يا جماعة يطلع مرسوم في جميع الدول العربية يلزم المسلمين بتأدية صلاة الغائب على رجل السلام صاحب الفرصة الوحيدة لإحلال الأمن و الرخاء في الشرق الأوسط<br />اللهم احشر شارون و المنافقين من بني جلدتنا في دار واحد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102152138/http://www.20at.com/article2.php?sid=113"

