subject = "تاريخ كنستنا"
author = "بيتر جرجس"
posted = "2006-07-09"
text = "فى البدأ أحب أن أقدم التحية الى راعى<br />كنيستنا البابا المعظم شنودة الثالث الذى طالما ضمنا تحت جناحيه برعايته..<br />وأود أن أوضح ان كنيستنا القبطية طالماتعرضت لمثل هذه البدع ولكنها كانت تظل صامدة فى مواجهةهذه البدع .. ولكن عن حق الانبامكسيموس فى اقامة مجمع مقدس خاص به فهذا لا يحق لانه لا انفصال عن كنيستنا القبطية الام..واودان يرجع الانبا مكسيموس الى حضن كنيستنا"
archived = "2006-07-19"
