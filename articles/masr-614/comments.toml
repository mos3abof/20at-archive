[[comments]]
order = 11
subject = "شكرأ لإحترامكم"
author = "فرعون المهجر"
posted = "2006-07-08"
text = "من المفترض دائماًفى المنتديات والتعليقات أن يكون محور نقاشنا أساسه الإحترام المتبادل بين الأطراف وإلا فسأنسحب من كل المنتديات العربية إذا استلزم الأمر فمن يراجع تعليقى لن يجد فيه أى تجريح لشخص أو أى هيئة أو معتقد إنما وجهت كلامى إلى كاتب المقال كرأى حرّ فى منبر حر أما إذا كنت تقول الأكاذيب فما أكثر الصيتات التى صارت تنقل الصور كاملة ساعة وقوع الحدث والأدلة والبراهين مصورة وملحقة أما أمريكا التى تتكلم عنها فأنت تعلم أكثر منى بأن لتلك الدول مصالحها وأنها المحرك الرئيسى والأول للنظام نفسه فى مصر وهى التى يقف عليها للأسف أيضا إقتصاد مصر وسنظل محتاجين للمعونة بالرغم من عدم إنتفاع الشعب نفسه بها بل إكتفينا أنا وأنت فى الرد فى المنتديات وكله لصالح أمريكا والنظام والسلام خير ختام"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
order = 12
subject = "البحر يحب الزياده يا فرعون المهجر"
author = "الشريف"
posted = "2006-07-08"
text = "الكل يعرف انه لامشكله فى بناء كنائس او ترميمها؟ واخبرك اننى رايت بعينى كنيسه جديده تبنى على بعد خطوات من كنيسه اخرى قديمه ومجدده !وانتم فى زمن اللهو الخفى تضغطون على الحكومه ؟ ولعلمك المساعدات الامريكيه500 مليون $ تصل الى الشعب بما يوازى تلميع جزمه لكل مصرى ! وامريكا لاتساوى( نكله) بدون مصر ونحن لسنا فى حاجه لمعونه امريكا المهببه وانتم تموتون حبا فى امريكا ولن ازيد واشربوا امريكا اللى صفقتم لسفير امريكا اكثر من مندوب الرئيس فى احتفالاتكم الاخيره فى الكاتدرائيه ولن ازيد ايضا"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
order = 13
subject = "الأساتذة فرعون المهجر والشريف"
author = "ياسمين"
posted = "2006-07-08"
text = "أنا مش عارفة ايه اللى خرجنا عن موضوع المقالة ودخلنا فى القصص الجانبية اللى لا بتودى ولا تجيب دى لكن أنا حاقول رأيى فيهم والسلام.الأستاذ فرعون المهجر أنا مصرية مسلمة أحب أقولك ان فيه مسلمين كتير ما بيفكروش زى الأخ الشريف ده. بالعكس أنا أول واحدة بتضايق لما أعرف ان فيه واحد مصرى مش عارف ياخد حقه سواء فى العمل أو العبادة أو أيا كان نتيجة لديانته أو لأى سبب كان. وكمان أحب أقولك ان البابا شنودة على راسنا من فوق وكفاية النفى اللى اتنفاه وكفاية موقفه من زيارة المسيحيين للقدس. وأنا شخصيا باعتبر كل قبطى وكل قبطية أخواتى واللى يمسهم يمسنى. لكن مشكلتى الوحيدة مع البهوات المتحدثين باسم أقباط المهجر بصراحة دول أكبر اساءة للأقباط وكلامهم وأفعالهم هتفضل سبب فى ان يطلع واحد زى الأخ شريف ده يقولك انتم عملاء امريكا مع انه لو فكر مش حيلاقى عميل لأمريكا غير النظام الخائن اللى هو ساكت عليه وجاى يتشطر على اللى معاه فى الهوا سوا. بالنسبة للأستاذ مكسيموس فده شأن خاص بكم مفروض احنا منتحشرش فيه وموقف النظام لا يمثل الا النظام. أخيرا الأستاذ الشريف حاول تخليك موضوعى ومتخليش التعصب يعميك. الناس كلها عارفة ان ترميم جدار واقع فى كنيسة أصعب 100 مرة من انك تبنى مسجد تحت بيتك. فبلاش والنبى مزايدة عشان بيبان انك متعصب ومش موضوعى. المفروض انك كراجل مسلم تقف مع الحق بصرف النظر عن ديانة صاحبه."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
order = 14
subject = "فرعون المهجر ..وياسمين"
author = "الشريف"
posted = "2006-07-09"
text = "للمره المليون الكنائس تبنى وترمم بلا مشاكل واكاذيب المهجر لن تنتهى !هم يريدون امتيازات لان فى وجدانهم حسب ما حفظوه لهم كهنتهم الكدبه الكبرى والمضحكه! انهم اصحاب البلد الاصليين. اما المؤتمرات المشبوهه فهى بدعم من اعداء الاسلام واولهم دانيل بيبس !واضحكنى ان مصر اثرت على الامريكان بارسال مسؤليين !اما الموقع المذكور فى الرابط فانا من متابعيه ورايت زعيم اقباط العالم عدلى المشرشح وهو يستهزأبدماء شهداء الجيش المصرى ؟ انه معتوه فعلا واكاذيب فيه كثيره بل وفاضحه"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

