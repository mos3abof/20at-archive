order = 15
subject = "ايضاح"
author = "وفيق"
posted = "2006-07-09"
text = "الكنيسة القبطية الآرثوذكسية تم تاسيسها علي يد القديس الشهيد مرقص الرسول كروز الديار المصرية وهى كنيسة وحيدة فريدة فى العالم تخص الاقباط الارثوذكس<br />الكنيسة القبطية الآرثوذكسية كنيسة طقسية تقليدية لها طقوسها وتقليدها المتوارثة منذ تاسيسها<br />اختيار البابا البطريرك يتم بترشيح اكثر من فرد ممن تنطبق عليهم الشروط المتوارثة والموضوعة من زمن بعيد بواسطة أباء الكنيسة والشعب ويقوم المجمع المقدس بتصفية كل المرشحين واختيار ثلاثة منهم وبعد صلاة القداس تجرى القرعة الهيكلية لأختبار أحد الثلاثة عشوائيا ليكون البابا البطريرك لانه لأ احد يطلب هذه الكرامة لنفسه ولكن المدعو من الله كما هارون<br />بعد ذلك يصدر قرارا جمهوريا باسم البابا الجديد مما سبق يتضح ان عملبة الاختيار تتم بطريقة ديمقراطية وان اختيار البابا لا يتم بالفرض على الشعب بل الشعب الذى يختاره<br />ان الكنائس الارثوذكسية منتشرة فى انحاء العالم مثل روسيا-اكرانيا-صربيا وبلاد اخرى كثيرة ولكن الكنيسة القبطية الارثوذكسية كما وضحت سابقا فهي ثخص الاقباط الارثوذكس فى مصر وسائر بلاد العالم<br />انه فى الولايات المتحدة والبلدان الغربية من حق اى شخص او جماعة انشاء كنيسة اومؤسسة خيرية وهذا ما حدث مع السيد ماكس ميشيل فالكنيسة التى حصل علي ترخيصها ليست كنيسة قبطية وليس لها علاقة بالاقباط من قريب او بعيد والحكومة الامريكية لا علاقة لها بكنيسة ماكس ميشيل فهى مثل الاف الكنائس المنتشرة فى امريكا وقد لاحظت ان السيد ماكس وصف كنيسته بالارثوذكسية وليست بالقبطبة وهذا يعنى انها لا تمت باى علاقة بالكنيسة القبطية<br />وفيق - كندا"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
order = 16
subject = "الى أخوتى الأعزاء فى الوطن ياسمين والشريف"
author = "فرعون المهجر"
posted = "2006-07-09"
text = "أشكر جيداً الظروف التى جمعت بين أفكارنا فى هذا المنبر الحرّ والخلاف لا يفسد للود قضية فأنا عاشق لمصر وترابها مهما أغتربت عنها..شكرا للأخت ياسمين على تعليقها النبيل الذى التمست فيه الضمير المصرى كما تعودنا فى الأزمات ولكننى لم أقصد أبدا أن أنحرف فى مواضيع جانبية إنما كان مجرد مثل على كيفية تهاون النظام مع المدعو ماكس ومنحه تصريح فى ساعات دون الرجوع لممثلنا الرسمى البابا شنودة فقط لا غير..أما الأخ العزيز الشريف أردت أن أنبهك أنه عندما منحتك الصيت كان فقط لمجرد مشاهدة صور مظاهرات شارع خمسة واربعين بالإسكندرية التى لم يقوم التليفزيون المصرى بعرضها كاملة ولم أقصد أبدا محاولتى لنشر الصيت هنا لأنه معروف وتصحيح أخر ليس للمهندس عدلى أبادير أى صلة به فهو منتدى حر لأقباط كاليفورنيا..تعليق أخير من قال لك بأن الفكر السائد بأننا أصحاب البلاد الأصليين هى كدبة هى بالفعل مجرد نص كدبة والنصف الأخر هو أنت أيضا يا حفيد القدماء أما كونى مسيحى وكونك مسلم فلندع هذا لله العليم بالقلوب فقد تذكر أنك مصرى وأنصف المصرى قبل أن تنصف العربى لمجرد أنه يتحدث بلغتك ويدين بعقيدتك....وشكرا جزيلأ آدام الله المحبة فى قلوبنا جميعا ونصرنا على المتربصين والأشرار الذين باعوا مصر رخيصة لغــيــر الــمــصــرى؟؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
order = 17
subject = "صح النوم يا مسلمين"
author = "الموحد24"
posted = "2006-07-09"
text = "بسم الله الرحمان الرحيم انا لا يهمني ينشق مكسيموس او يموت شنودة بالهربيس و العياذ بالله من هذا المرض الخبيث الذي اصابه.انا كمسلم كل ما اريده ان يعرف احبتي المسلمين ان شنودة ليس حمامة سلام كما يظهر في الشاشات بابتسامته العريضة بل هو شخص يخدم دينه و معتقداته بكل الوسائل و من اهمها المكر فشنودة هو العقل المدبر للهجمة التاتارية الشرسة من قبل الاقباط المرتزقة على الاسلام و خصوصا رسول الله صلى الله عليه و سلم و من يشك في ان شنودة ليس هو زعيم عصابة ما يسمى اقباط المهجر يذهب لمواقعه هؤلاء و يقرأ رسائل الود و الغرام من شنودة لتلاميذه اعباط المهجر كل ما يهمني من هذا التعليق هو ان اوضح للاحبة المسلمين ان من يسب الله و رسوله ليس باخ لنا بل عدو لا كرامة له و اللبيب يفهم"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
order = 18
subject = "أخواتي الأقباط والمسلمون"
author = "ايمن"
posted = "2006-07-09"
text = "أخواتي الأفاضل أذاي بس لانتدخل ده المفروض نوقف وقفة رجل واحد مسلمين قبل المسيحيين ونطرد اي بني أدم عايز يفككنا من بعض وياما شفنا المواقف العظيمة لقداسة البابا شنودة الثالث الرجل العظيم الذي لا تشوبه شائبه ده راجل وطني ومصري بيعشق مصر ويدافع عنها في كل مكان وزاي أستاذنا بتاع المصري اليوم عايز يقارن بين رجل مختاراه السماء وبين راجل طردته الكنيسة علشان بني آدم مهرطق تغلب عليه العظمه وحب الذات ينصب نفسه بطريرك ده السؤال لكل واحد فينا أذاي نسمح لواحد ذي ماكس يكون بطريرك مين اللي سمحله ومين اللي أعطاله الرتيه دي معقول نقارن بين قديس معروف عنه عند المسلمين قبل المسيحيين بالسماحة والمحبة ياماارشدنا بكلماته اللي لمسنا فيها محبته للجميع وشفنا أذاي بيعالج المواقف الصعبة اللي بنتعرض ليها بحكمته السمائيه وعيب علينا ونقول ايه اللي يحشرنا لو متكلمناش كلنا كشعب مصري مين بس اللي يتكلم يا مصريين"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
