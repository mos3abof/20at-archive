[[comments]]
order = 0
subject = "غدا ستدور الدائره"
author = "كيرلس"
posted = "2006-07-05"
text = "السادة الكرام<br />تحية طيبة وبعد<br />الموضوع ليس حق الأب ماكسيموس او غيره فاننى مسيحى ولا اعرفه ولا اعرف مبادئه اوتعاليمه ولكن يقرأ الجواب من عنوانه فهذا الرجل لم يدخل من الباب والذى لا يدخل من الباب هو محل شك وريبه وهذا هو الشئ الخطير<br />اما الشئ الأخطر فمن الذى جاء به ؟ ومن الذى نصبه ؟ وهل هكذا نحن قد اصبحنا ؟ فى ليلة ومساها نجد من يفرض نفسه بابا للمسيحيين ؟ معلوم ان الباباليس بابا الأسكندريه فقط انه بابا الأسكندريه وليبيا والسودان واثيوبيا وسائر افريقياوبلاد المشرق والمهجر - اذن فغدا سنجدفى كل قطر بابا ! انه مخطط لتدمير مصرنا الحبيه وليس لتدميرالأقباط وقد بدأ ب بابا الأسكندريه لأنهم فى رئاسته لم يستطيعوا ان ينشروا الفتن او الضغائن لأن الرجل حكيم<br />اما تدمير الأقباط فلا مكسيموس ولا امريكا ولا اسرائيل ولا كل قوى الشر تقدر ان تمسهم بشئ لأن المسيح قالها ( من يمسسكم يمس حدقة عينى ) ( لا تحافوا انا معكم كل الأيام ) ولينظروا الى اريوس اين ذهب ؟ ولينظرو الى نسطور اين ذهب ؟ ودقلديانوس اين ذهب؟ وغيرهم من الأباطرة - مات الجميع وتوارى - اما المسيح فهو حى لم يمت والخوف كل الخوف من مسيحية مستورده تديرها الأباحية والروك اند رول والمينى جيب والميكرو جيب - وناس أهانو المسيح بكل شكل وكل لون - والكل ساعاتها حينزل الحلبه والكل يرقص على صاجات اورباواللى مايشترى يتفرج ويختلط الحابل بالنابل وقول على الكل الف سلام<br />كيرلس"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
order = 1
subject = "سيادة الكاتب الكبير"
author = "كيرلس"
posted = "2006-07-05"
text = "سعادة الكاتب الكبير<br />اسمح لى وانا الصغيروانت الكبير ان اتحدث اليك معترضا ولكن مهذبا ومقدرا لحجمى بجوارك<br />اولا : انت دافعت عن حق الأب مكسيموس فى الخروج على الكنيسه والأستقلال عنها وهذا مناقض للحقيقه فالأب مكسيموس والكل يعلم ليس من الكنيسةولو كان من الكنيسه لأتبع نظام الكنيسه ولأعترض على البابا بالطرق المشروعه وطالب بتشكيل مجمع مقدس والأعتراض على مخالفاته - هذا لو كان هناك مخالفات من الأساس<br />ثانيا: طالبت الدولة بالوقوف على الحياد وعدم التدخل !! اليس عجبا ان يطلب رجل سياسى مثل هذا الطلب اتقبل ان يدخل غريب بيتك يدير اموره وانت متفرج ؟<br />ثالثا : قلت ان البابا شنوده يدير الكنيسة بطريقة دكتاتورية ويتشدد فى فهم وتفسير الدين المسيحى - بأى منطق وبأى سلطان وبأى منصب دينى تملكه انت لكى تحكم على البابا شنوده بانه دكتاتور متشدد فى تفسير الدين !هل تتكرم وتفسر لنا انت الدين بطريقتك السهلة الديمقراطيه السلسه ؟ ان الحكم على شخصيه مثل البابا شنوده لا تصدر الا من علماء الدين وبعد محاكمته وادانته أما ان رجل لمجرد انه يعمل بالعمل العام وله فى السياسه يصدر قرارا فى رجل مثل البابا شنوده وبهذا الأسلوب والقذف العلنى اسمح لى ان اعترض عليك بصفتى ابن من ابنائه بل واطالب احد المحامين الأفاضل ورجال القانون برفع دعوى قضائية عليك بسب مباشر ليس لرجل دين وانما لرجل سلام - فهل من مجيب ايها السادة رجال القانون المسلمين منكم قبل المسيحيين لأنى اعرف محبتكم وتقديركم لهذا الرجل العظيم !!!<br />رابعا :قلت ان الأب مكسيموس شخصية محترمه له مكانه- هذا حقك فى تقييم الرجل سواء كنت تقول هذا لعشرتك له او لمجرد الترحيب فلا احد يلوم سعادتك على ذلك ولكن اللوم هو انك لا تعارض الطريقة الغير مشروعه التى فرض الرجل نفسه بها على الشعب<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

