[[comments]]
order = 23
subject = "مجرد اقتراح"
author = "مارك"
posted = "2006-07-10"
text = "السادة الأفاضل<br />تحية طيبة وبعــد<br />اقترح (( ان كان ذلك من حقى )) وانما هو مجرد اقتراح<br />ان يتم عمل استفتاء عن :<br />هل حقا رجال الدين فى هذه الأيام يهمهم امور الدين وامور علاقة الأنسان بخالقه؟ وهل حقا هم ينفذون ما يأمرون الناس به ؟ ام انهم يحافظون على تلك الدجاجات السممان التى تبيض لهم ذهباملقين اليهم بوابل من الوصايا والتعليمات وهم ساهون مترفهون عن كل ذلك - من احدث موديلات السسيارات الى اطباق الدش والنت والنايل سات؟؟ وعلى المساكين الطاعه وللمحظوظين التبركات والقبلات والتبجيلات!!!!!<br />بالطبع اذا طرح هذا الأستفتاء سأكون اول المشاركين فيه وان لم يطرح فشكرا لأستماعكم<br />ملحوظه : الأقتراح ليس خارج موضوع النقاش<br />مارك"
archived = "2006-07-19"
