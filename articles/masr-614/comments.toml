[[comments]]
order = 20
subject = "نعم هذا هو رجل اللة"
author = "وفاء"
posted = "2006-07-10"
text = "الذى من اللة يثبت انا ابنة هذا الرجل و هو ابى الروحى و يشهد المسيح ان هذا الرجل يذكرنى بايام البابا كيرلس :نيح اللة نفسةلا تظلموا برى ولا تسفكوا دمة و لا تشهروا بة فلتصلوا يا شعب المسيح والرب يفتح الاعين و القلوب امعرفة الحق و الحقيقة 1_ هو لم ينصب نفسة<br />2_ لم نتلقى دعم لا من امريكا و لا من غيرها كلها من العشور لاولاد هذا الاب العظيم<br />3_ الذى يخدم اللة و يحبة هكذا يبغض و يعامل يا رجال الدين الاردثوكس هل علمكم المسيح الكراهية و التشهير ان اثق ان يسوع قادر ان يعلن اسمة و يعلن حقة للعالم اجمع"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
order = 21
subject = "هل حقا رجال الدين يخدمون الأيمان"
author = "مارك"
posted = "2006-07-10"
text = "الساده الأفاضل - تحية طيبة وبعد<br />طبعا واضح من الأسم انى مسسيحى<br />وعليه فانى اشكر الأخوه المسلمين الذين استخدموا مفردات التوضيح والمديح كما اشكر الذين استخدموا مفردات التلبيخ والتجريح لأنه كما هو معتاد فان لكل عملة وجهان اما استخدام العمله ذاته فانه يرجع لطبيعة الأنسان والأنسان الصالح من كنز قلبه يخرج الصالحات والطالح فمن كنز قلبه تخرج السفاهات والأهانات وكما فى هذا الفريق ايضا فى ذاك<br />مجرد مقدمه بسيطه عز على الا اذكرها..<br />ندخل فى الموضوع : الأب مكسيموس خارج منشق على البابا شنوده وهذاامر لا يختلف عليه اثنان اذن فهو قادم ليغير مفاهيم وضعها المسيح وسار عليها البابا شنوده وجاء الأخير ليغيرها ولنرى سويا<br />* البابا شنوده وقف امام الفتن بين اخوة فى وطن واحد<br />* البابا شنوده احب الشعب المصرى بكل طوائفه وفئاته واشكاله والوانه<br />* البابا شنوده رفض تدخل الغرب بين ابناء الوطن الواحد<br />* البابا شنوده أمر بطاعة الرؤساء وحب الوطن واحب الوطن قبل الجميع<br />* البابا شنوده جمع اقباط مصر مسلمين ومسيحيين على مائدة واحده<br />* البابا شنوده.البابا شنوده احب المسلمين قبل المسيحيين واحبه المسلمون قبل المسيحيون.....كمااحب رجال الدولة وعامة الشعب واحبه رجال الدولةوعامةالشعب..الخ<br />وبما ان الأب مكسيموس منشق اذن فهو رافض لكل مبادئ البابا شنوده اذن ماذا يريد- انه جاء ليغير ويبدل كل تلك المفاهيم - لا لكل ما سبق!!! - لا لكل ما ارسى البابا شنوده دعائمه!! - وانما جذب الناس بامور دنياوية فانيه وترغيبهم بأمور زائله ثم تروعيهم هل هذا ما نرضاه لأنفسنا ولوطننا؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />فى النهايه عتاب لأبن عمى المسلم اللى فرحان لأنشقاق الكنيسه -انا مش زعلان منك انا زعلان عليك زى مانا زعلان على اخويا المسسيحى<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

