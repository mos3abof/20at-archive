posted = "2006-07-06"
text = "الى الاخ الذى يسآل ماذا نفعل إذا آنشق آحد المسلمين<br />آطمئنك آننا لا نتبع بشر الا سيدنا ونبينا محمد صلى الله عليه وسلم آشرف الخلق وآطهرهم<br />فلا يعنيينا آنشقاق آحد لآن (كل نفس بما كسبت رهينه ـ صدق الله العظيم)<br />آرجو آن يتضح لكم مما يحدث الان آن آمانكم مع المسلمين آو ما تسمونه (الغزو الاسلامى) وليس مع آمريكا!!!<br />نحن لا نغدر بآحد وطوال 1400 عام لم نحرض آحد على آحد آو دعونا للآنشقاق ـ بل آتبعنا معكم مبداء (لكم دينكم ولى دين)<br />هدانا الله وإياكم الى ما يرضاه المولى سبحانه وتعالى"
