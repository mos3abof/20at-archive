text = "وأنا كمان يا بسيط مستغرب لمادا يهاجم الاخوه المسلمون موظف الازهر ولمادا تكفرون الداعيه الاسلامى السودانى الترابى --وياليتك لاتتدخل فيما لا تفهم فيه كما حاول من قبلك السادات"
