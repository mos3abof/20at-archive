text = "اذا نظمت الدوله بناء الكنائس تياكوا وقالوا عايزين الدوله ترفع ايها0واذا رفع المسيحيين قضايا طلاق وكسيوها لا تنفذها الكنيسه وقالوا الدوله ترفع ايدها 00واذا نصب مكسيموس نفسه بابا قالوا ده حصل بمباركه الدوله ليضغطوا عليها وقالوا لازم الدوله تحط ايدها 000هما عايزين ايه الدوله تحط ايدها ولا ترفعها 00عموما انا شايف ان ده موضوع ديني والخلاف جايز في هذه المسائل ولا داعي للتحجر"
