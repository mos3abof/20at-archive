text = "الإخوة المسيحيين ... أنا مستغرب انتو ليه معترضين على وجود أكثر من بابا رغم انكم بتقولوا ان فى ثلاث آلهة؟؟ هو البابا يعنى لازم يكون واحد أحد إنما الله ممكن يكون ثلاثة؟؟"
