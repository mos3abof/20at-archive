posted = "2006-07-08"
text = "وهو فى بوتقته ينصهر ويخرج الخبث ! فيظل صلدا قويا ؟ والولد عبد الكريم سليمان دا ملحد وفى دماغه لطشه حتى زملائه فى الكليه اعطوه علقه سخنه ! وهو من كتبه (اتحاد المبرشمين) للشرشحه! ولقد جاء له راى اخيرا بالغاء الزواج واباحه الدعاره!!اما البهائيه فهى كالسوس ! وهم فقط 2000واحد فى مصر !!شوف حالك فى كنيسه ماكس وخلى ابوك( بقلظ) فى فضائيته يتكلم عنه ! فعلا ويمكرون والله خير الماكرين ! ومن اعمالكم سلط الله عيكم ماكس اشربوه هو وامريكا"
