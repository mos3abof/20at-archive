[[comments]]
order = 8
subject = "نهاية قبل البداية"
author = "فرعون المهجر"
posted = "2006-07-08"
text = "تحية الى كاتب المقال ونقل رد فعل الأقباط دون أى انحياز ولكن لنا تعليق من هو ماكس ميشيل ومن هو الذى نصبه بطريرك أيعقل فى العالم أجمع أن يرسم شخص نفسه بطريرك ويرتدى الزى الرسمى للأقباط الأرثوذكس نحن لن نقف مكتوفى الأيدى لنتمتع بهذه المسرحية التى شاركت فيها بعض مؤسسات الدولة أى منطق يأتى بشخص لم نسمع عنه إلا من أيام قلائل ليعلن أنه جاء ليصلح مافشل فيه البابا شنوده محض إفتراء لأن الباب شنودة الراهب الذى ترك العالم ودامت خدمته عقودا وأبناؤه من مختلف الأجيال يكنّون له كل احترام وحب الذى جعل كنيسة واحده فى المهجر فى عهده ماقارب من الأربعمائة كنيسة هذا الوطنى الذى وقف مع العرب ضد الكيان الصهيونى هذا الذى رفض أن يرتبط الدين بالسياسة وله مواقف عدة فى منع التدخل الأجنبى تحت مسمّى حماية الأقليات .. هذا المدعو ماكس سينتهى قبل أن يبدأ إن لم يكن قد إنتهى بالفعل فى الوسط القبطى وإذا إفترضنا جدلاً إعتراف الدولة بمجمعه لن يؤثر هذا فقط على الأقباط بل على مصر كلها بل وسيزداد الملف القبطى تعقيداً..ورداًعلى من علّق تحت عنوان المسيححين عايزين إيه من الدولة ببساطة شديدة نريد أن نتمتع بما تتمتع به أنت من حقوق طالما نؤدى واجباتنا مثلك تجاه الدولة ومن أبسط الحقوق أن تحافظ الدولة على وحدة كنيستنا التى عمرها تسعة عشر قرن من الزمان وكان من باب أولى ألا تتدخل للإعتراف بكنيسة المدعو ماكس سبحان الله دورات مياه الكنايس حتى يومنا هذا تحتاج العديد من التصاريح لترميمها أما المدعو ماكس فقد حصل على تصريح فى عدة ساعات وللقارئ أن يسأل نفسه من وراء هذا الإنشقاق ولماذا؟؟؟؟؟؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

