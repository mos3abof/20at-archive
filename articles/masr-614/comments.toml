subject = "لعب العيال"
author = "سينوت"
posted = "2006-07-13"
text = "أيها الساده ان الدى حدث ما هو الا أن يعض الصبيه أرادوا أن يلعيوا لعبه كنيسه وقام المدعو ماكس بتمثيل دور البابا - ولبس ملابس تشابه ملابس قداسه الباباشنوده - وأنى أسمع صوت أحدالواقفين يصرخ فيهم \"يلا ياولد أنت وهو كل واحد يروح بيته\""
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

