[[comments]]
order = 26
subject = "كلمة نهائية"
author = "مينا القس متري"
posted = "2006-07-10"
text = "إذ1 سمحتم أريد أن أوجه نظركم لعدة نقاط<br />1- ماكس ميشيل ( اسمه قبل السيامة الأمريكية المزيفة ) منشق و غير مطيع لرئاسته الدينية فمن ثم إذا لم يذهب لأمريكا لن يفكر البابا شنودة مطلقاً تعيينه ولو أسقفاً عاماً.<br />2- كونه يدعو البابا بأنه الأسوأ يعد هذا جرما ً لابد أن تحاسبه الكنيسة عليه<br />3- ومن ثم فهو مجرماً ولأن الكتاب المقدس جاء به أن يكون الأسقف بلا لوم فهو لن يصلح ليكون أسقفاًإطلاقاً<br />4- وأنا أطلب منه أن يتحد مع كنيسته وخصوصاً في هذه الأيام العصيبة .<br />5- إن لم يرجع ماكس ميشيل ( اسمه قبل السيامة الأمريكية المزيفة ) عن طريقه لن يهنأ مطلقاً و سيعذبه الله في حياته لسبه لأبينا المعظم الأنبا شنودة الثالث رأس الكنيسة المختار من الله و لن يدخل الملكوت .<br />6- أخيراً أقول له أنه لن يعرف أن يمارس شعائره الغريبة في بلدنا . لأننا شعب مثقف ومجربين كثيراً .<br />7- أطلب من الدولة مواجهته منعاً لحدزث مشاكل فهو من الأخر نازل على المسيحيين والمسلمين ...<br />8- وشكراً لقرائتكم التعليق<br />4-"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
order = 27
subject = "الى الذي يشكك في اسلامي"
author = "الموحد 24"
posted = "2006-07-10"
text = "بسم الله الرحمان الرحيم و الصلاة و السلام على الحبيب الامين سيدنا و سيد الخلق اجمعين محمد بن عبد الله اما بعد<br />و الله انا اكتب ردي و اشك في ان تكون قبطيا متنكرا كما هي عادة الاقباط بثوب المسلم المسالم المستسلم و ليس المسلم العزيز بدينه و ايمانه دعك يا اخي ان صح لي ان اقول بانك اخي من المثاليات التي لم تعد تنفع شيئا في زمن تكالبت فيه الامم على قصعة الاسلام فالحمد لله الذي اكرمني بان جعلني اعرف هؤلاء النصارى الاقباط عن حقيقتهم بالرغم من اني لست مصريا و كل الفضل يرجع لله ان يسر لي الطريق بان دخلت برنامج البالتوك على الانترنيت و اكتشفت كمية الحقد و الكره الذي يكنه هؤلاء الاقباط للاسلام و خاصة رسول الله صلى الله عليه و سلم فيا من تدعو للتسامح هل تعلم بان الله و رسوله يسب 24/24 ساعة و بعلم هذا المدعو شنودة هل تعرف بان ايات القرءان الكريم يعمل لها ريمكس مع موسيقى الروك و الراب هل تعلم بان هؤلاء الذين دافعت عنهم تحت شعار الوحدة الوطنية لمصر هم اكبر خطر على ارض الكنانة الحبيبة بسبب مجاهدتهم لاستصدار قرارات من الامم المتحدة تعترف بانهم اقلية مضطهدة بما يوفر الغطاء لقوى الشر العالمي بالتدخل المباشر و الحمد لله اني لا اتكلم من فراغ فالتسجيلات التي تدعوا للفتنة من قبل قادتهم موجودة يكفي ان اقول لك اننا في الغرف الاسلامية على البالتوك نمتلك تسجيلات يقول في احدها احمق من قادتهم انه حين يستطيع لن يرحم اي احد عجوز و امرأة و شاب و طفل رضيع و انه سيمثل بجتتهم و هذا ليس غريب منهم مادام كتابهم المدعو مقدس فيه اكبر كمية من الارهاب يمكن ان يتصورها بشر على وجه الارض عكس ما يدعون من محبة و تسامح و اننا نشهد الله و رسوله و الامة جمعاء على اننا لن نكل و لن نمل عن فضح دينهم الوثني و و لا كرامة لكبير من<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

