author = "عبد الرحمن جيرة"
posted = "2006-07-11"
text = "في كل دين يحدث الخلاف بين اتباعه، وليس هدا حدثاً فريداً في التاريخ، وهناك أمور يجب إعادة النظر فيها وليكن الكتاب المقدس هو الحكم بين المؤمنين به، وليس الاستفتاء أو غير دلك من أمور هي ليست بعيدة عن الهوى، ومن الامور التي يجب على الكنيسة القبطية أن تبادر إلى إعادة النظر فيها مسألة منع الطلاق، فالإنجيل لا يوجد فيه نص يقول للمسيحين لا تطلقوا، وإنما من طلق امراته إلا لعلة الزنى جعلها تزني يقصد به النهي عن أن يطلق المرء زوجته لأهون الأسباب بل لسبب وجيه، مثل ارتكاب الزنى، ولو تم إعادة قراءة النص بصورة متأنية ربما نتج عنه اتفاق في قضية ضجت مهنها الفنانة هالة صدقي عشر سنوات، وهناك من يزور الشهادات الطبية من اجل ان يقضي له المجمع الملي بالتفريق، المسيحيون ليسوا في حاجة إلى دلك لأن كتابهم المقدس ليس فيه ما يمنعهم من الطلاق، وليحفظ الله مصر بوحدة أبنائها أقباطاً ومسلمين، وليخزي ال>ين يسيئون إلى المسيحية أو الإسلام"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
order = 29
subject = "تعليق بسيط جداً"
author = "فرعون المهجر"
posted = "2006-07-11"
text = "أشكر الأخوة الأفاضل الذين تكرّمواوساهموا معى فى هذا المنتدى الحر ولكن نداء انسانى للأخ الفاضل الموحد 24 عندما قرأت اتهاماتك للبابا شنودة فى وطنيتة والافتراء عليه بشأن تكوينه ميليشيات مسيحية انتابنى الحزن جدا لمجرد تفكيرك فى هذا أو تصديقك لتلك الشائعات وحزنت أكثر لعدم سردك أمام كل من شارك هنا فى المنتدى لأدلتك العملية والمنطقية لاثبات كلامك يجب أن نرتقى كلنا عن هذه التفاهات ونحاول أن نثبت صحة كلامنا الكل يعلم أن الأقباط فى تاريخهم كله وفى فترات أزماتهم الخيرة لم يجرؤ أحدهم على حمل سلاح بالرغم ان هناك الكثير منهم لديه قدرة مالية وموارد متاحة لشراء الأسلحة ولكنهم حاشا ليس خوفا من الآخرين انما خوفا من الله الذى منعنا من نرفع سلاحا فى وجه بنى أدم أو ندينه بأى شئ حتى ولو لأجل ثأر لا ينادى كتابنا بمثل هذا...أما الذى أسعدنى حقا فى تعليقك أنك أوضحك بأنك لست مصرى وأحمد الله لأن المصريين المسلمين اذا كنوا هذا الشعور لنا فستكون نهاية الأيام ... أنت لا تحب مصر أكثر منى لأنى شربت من مياهها واجهت حروبها أيضا مع أخى المسلم.. أما عن تسجيلات البالتوك فهذا ليس بموضوعنا هنا ولك أن تناقشهم أو تعلق فى الحجرات الأخرى التى تسبنا علنا وبرامج التليفزيون المحلية فى الدول العربية اعلم يا أخى أن البابا شنودة ليس مسيطر على الحريات وعلى عالم الانترنت ان هدفه الرئيسى هو خدمة كنيسته وشعبه أما غير ذلك فهو ليس مسئول عنه وقد أوضح فى تصرحاته كثيرا بأنه ليس له علاقة بأى منظمات خارجية فماذا تريد يا أخى الكريم ارحموا من فى الأرض يرحمكم من فى السماء...أما الأخ العزيز عبد الرحمن جبره أشكرك جدا على تعليقك وكما قلت ان هناك أمور دنيويه تتدخل فى تعاليمنا ولكن نسيت انه اذا تهاوننا فى هذه الأمور ستصبح المساجد والكنائس أشبه<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
order = 30
subject = "من انت"
author = "هانى المصرى"
posted = "2006-07-11"
text = "الى الاخ ماكس مشيل لان لا اقدر ان اقول لك انك البابا لاسباب كثيرة انك ليس من اختيار الله و لعلمك انت لو عايز تيبقى البابا ستكون مسئول عن الشعب المسيحى كله وهذا يحتاج صلوات ودموع واسهار وانى اعتقد انك مش فاضى لمسوليتك مع بيتك البنتين وامهم نصلى حميعا من اجل ان ينير الرب يسوع له كل المجد عينيك ويمسح القشور التى امام عينك ويفتح ذهنك وترجع على ماتنوى فعله ليبنر المسيح طريقك وترجع عن عملك"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
order = 31
subject = "الى الاخ الموحد"
author = "سمير"
posted = "2006-07-12"
text = "مين ادالك الحق انك تهين رجل دين زى البابا شنوده ده اطهر من انك تقول اسمه على لسانك وعلى العموم احب اقللك انك خرجت عن الموضوع الى احنا بنتكلم فيه لو سمحت لو عندك تعليك على الموضوع قوله احب اقلك ان انت كمان قبطى ولا انت متعرفش ان قبطى يعنى مصرى ولو انت مش قبطى تبقه مش مصرى مش من حقق تتكلم في الموضوع اصلا"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
order = 32
subject = "ان الدين عند الله الاسلام"
author = "حسن"
posted = "2006-07-12"
text = "ان ما اتبعه الانبا مكسيموس ليس غريبا عن تعليمات الدين الاسلامى فالدين الاسلامى يبح تعدد الزوجات فهذا دليل منكم على ديننا الحنيف"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010910/http://masr.20at.com:80/article.php?sid=614"

[[comments]]
