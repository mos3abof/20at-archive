order = 0
subject = "و الله عندك حق"
author = "مواطن مصري"
posted = "2006-11-30"
text = "الموضوع جميل و علي فكرة عمر ما مشكلة الكنيسة ما هتتحل بالشكل ده و مش الكنيسة بس لا دا مصر و الازهر و العرب و المسلمين المصيبة مش في اللي في ايدهم القرار المصيبة ان حتي المعارضين اي كلام طيب بالذمة الاصلاح هيجي منين ؟"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206024651/http://masr.20at.com:80/article.php?sid=1239"

