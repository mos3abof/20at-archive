[[comments]]
order = 3
subject = "اثناسيوس القرن الحادى والعشرون"
author = "عماد يوسف"
posted = "2006-12-01"
text = "العالم كله ضدك ياسيدنا وستبقى انت وتمضى جميع تلك الأزمات وسيمضى كمال زاخر كما مضى من سبقه وكما مضى ايضا من قام من قام بالغاء قرار تعيين البابا وصفق له وسنبقى معك ونفديك بدمائنا وليعلم كمال زاخر ان كل رئاسة وسلطان هى مرتبه من عند الرب"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206024651/http://masr.20at.com:80/article.php?sid=1239"

[[comments]]
order = 4
subject = "احنا معاكم يا اقباط مصر"
author = "احمد سيف"
posted = "2006-12-03"
text = "لقد اوصانا الرسول عليه الصلاة و السلام باقباط مصر و تزوج منهم السيدة ماريا و لذلك انا اجد ان من واجبنا مساعدة اقباط مصر تنفيذا لوصية رسول الله و اقول ليوسف سيدهم و لجمال اسعد عيب لما تقولوا الامر مكفول للارثوذكس بس احنا برضة اخوات في وطن واحد ."
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206024651/http://masr.20at.com:80/article.php?sid=1239"

[[comments]]
order = 5
subject = "يا عم سبونا نحل مشاكلنا"
author = "صليب عبد المسيح"
posted = "2006-12-03"
text = "يا عم مع احترامنا للرسول و لحضرتك احنا بنتمني تسبونا في حالنا علشان نعرف نحل مشاكلنا لو سمحت . و كفاية اللي الارهابيين بتوعكم بيعملوه فينا ."
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206024651/http://masr.20at.com:80/article.php?sid=1239"

[[comments]]
order = 6
subject = "من لطمك علي خدك الايمن"
author = "مش مهم اسمي"
posted = "2006-12-03"
text = "يا جماعة عيب احنا صحيح بنتظلم كتيير في البلد دي بس ميصحش نتكلم كدة مع ناس عايشيين معانا في نفس البلد السيد المسيح له المجد اوصانا بان نحب اعدائنا فمابالكم بناس عايشيين معانا في نفس البلد و بعدين من لطمك علي خدك الايمن حول له الاخر ايضا ."
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206024651/http://masr.20at.com:80/article.php?sid=1239"

[[comments]]
order = 7
subject = "الله يخرب بيوتكم"
author = "و انت مال اهليكم باسمي"
posted = "2006-12-03"
text = "الله يخرب بيوتكم احنا في اية و لا في اية بدل ما تشغلوا بالكم باصلاح الكنيسة و الازهر الله يرحمهم فكروا هتعملوا اية مع الراجل الحيوان اللي اسمه مبارك بلا قرف و قلبه دماغ و قلبة معدة"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206024651/http://masr.20at.com:80/article.php?sid=1239"

[[comments]]
order = 8
subject = "كفاية حرام"
author = "واحد طهقان"
posted = "2006-12-03"
text = "انا زهت من البلد دي الرئيس فاسد و الحكومة فاسدة و الناس فاسدين و الازهر فاسد و الكنيسة فاسدة و العربيات فاسدة و انا و انت و رقصني يا جدع ( كفاية حرام عليكوا الواحد كفر )"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206024651/http://masr.20at.com:80/article.php?sid=1239"

[[comments]]
order = 9
subject = "كلك علي بعضك حلو"
author = "فهد بلان"
posted = "2006-12-03"
text = "علي فكرة انا بحب كمال زاخر بس يا استاذ كمال اوعي تفكر انك هتصلح حاجة انت كويس بس بتنفغ في قربة مخرومة و الله مخرومة و مش خرم واحد لا دا 72 مليون خرم المهم كان الله في عونك و علي فكرة الاصلاح مش هيحصل طول ما فيه سلطة مطلقة من البابا علي الناس لازم الناس تتحرر و هي اللي تصلح الكنيسة لو عرفوا لان المسلمين ماعندهمش كهنوت و مع ذلك مش عارفين يصلحوا الازهر رغم ان الاسلام دين بيحرض علي الاصلاح و عدم الخضوع و السكوت عن الظلم و ربنا يكون في عون مصر"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206024651/http://masr.20at.com:80/article.php?sid=1239"

[[comments]]
order = 10
subject = "بقي دا كلام يا كمال"
author = "ولي امر"
posted = "2006-12-04"
text = "بقي دا كلام يا كمال يا ابني دي غلطة تقع فيها ما كنتش افكر انك متهور كدة و انا اللي بقول كمال شاطر كمال شاطر و الله لا انا قايل لبابا"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206024651/http://masr.20at.com:80/article.php?sid=1239"

[[comments]]
order = 11
subject = "بداية الشر"
author = "واحد مصؤي"
posted = "2006-12-06"
text = "التعصب المسيحي وزرع الفتنة والشر بين المصريين بدأ وانتشر منذ قدوم شنودة في اول السبعينات نلاحظ أنه قبل شنودة لم تكن هناك فتنة طائفية فلا تلعب بالنار يا شنودة حتي لا تحرقك"
archived = "2006-12-10"
