[[comments]]
order = 0
subject = "سدد اللة رميك"
author = "AyMo"
posted = "2006-04-01"
text = "اللهم انفعنا بما علمتنا.<br />اللهم اجز هذا المؤمن عنا خيرا واحفظة وأنطق لسانة بما ينفع أمة حبيبك المصطفى<br />ياجماعةالاستاذ عمرو هو اول داعية اهتم بالخطاب الدينى. يعنى بيتكلم فى الموضوعات اللى الأمة محتاجة تناقشها دلوقتى ..<br />وارجو من شيوخنا الافاضل ان يحملو راية الدعوة لان قليل من هم يهتمو فعلا بالخطاب الدينى .<br />وان كان عمرو خالد ليس ازهرى لكنة صورة للمؤمن القوى اللى فعلا دافع عن الرسالةاللى المفروض ان كل مسلم من المليارمسلم يحملهاويقوم بيها وهى رسالة التبليغ عن الرسول (صلى اللة علية وسلم).<br />واللة انا حاسس ان ربنا جعل هذا الانسان سبب لان يجتمع خيرة شباب العالم العربى على قلب رجل واحد فى زمن يفتتن المسلم فى دينة وعقيدتة ولا احد يصحح ويدافع.<br />الان بعد مشوار عمرو خالد وما علمةلنا يواجة اعنف الانتقادات . هل هذا جزاء من اوذى وطرد من وطنة لاجلنا؟<br />ياريت ندافع عن اللى دافع عننا.. وميكنش حد فينا أمعة. يحسن اذا الناس احسنو ويسىء اذا الناس اسائو.."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211223/http://masr.20at.com:80/article.php?sid=106&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "احترت في سعد الدين ابراهيم"
author = "عبدالله مفتاح"
posted = "2006-04-01"
text = "مش سعد الدين ابراهيم ده اللي لما اتحبس امريكا هددت مصر بقطع المعونات؟<br />مش هو ده صاحب ابن خلدون اللي بيتلقى اموال من جهات خارجيه؟<br />والله يا عمرو انت عندك من الحكمة الكثير ربنا يوفقك ويزيدك علم كمان وكمان"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211223/http://masr.20at.com:80/article.php?sid=106&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "شُك في نفسك يا عمرو"
author = "عاقل من بلادنا"
posted = "2006-04-03"
text = "بيقولوا إن اللي يمدح فيه الأمريكان يشنق نفسه... واللي يمدح فيه سعد الدين يشنق نفسه...<br />للأسف يبدو أن من بداية برنامج \"صناع الحياة\" عمرو خالد أصبح يخدم الأجندة الأمريكية...<br />الأجندة الأمريكية لن تقدم للشباب السم... ولكن الأسلوب دائما: السم في العسل...<br />اللآن فهمنا من أين أتت علاقة عمرو بجرامين بنك الربوي‍‍‍‍"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211223/http://masr.20at.com:80/article.php?sid=106&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "أؤيد صاحب التعليق \\\"شك في نفسك ياعمرو\\\""
author = "منة الله"
posted = "2006-04-08"
text = "شيء جميل ان نصنع لانفسنا مستقبل بأيدينا لكن للاسف برنامج صناع الحياة اصبح همه ان يجعل من نهضة الامة هي أولى أولوياتنا وهي الهدف الرئيسي ..مع ان الهدف الرئيسي الان هو تحرير الاراضي المغتصبة واسترجاع مقدساتنا المنهوبة والمدنسة من اليهود والامريكان لقد اختفت كلمة \" الجهاد\" من اجندة عمرو خالد واصبح الاهم عنده هو بناء الامة ...لذلك برنامح صناع الحياة يخدم الاجندة الامريكية ..لقد احسنوا توظيف عمرو خالد للاسف..برأيي ان يعود عمرو خالد الى دروسه الدينية فمازال امام شبابنا الكثير للعودة الى الدين الصحيح اولها موضة الحجاب الغريبة التي اصبحت تجتاح بلادنا من فتياتنا وبعض مذيعات القنوات الاسلامية. دعونا لا نحلم كثيرا بنهضة امة الاسلام في الوقت الحالي لانه ليس من المنطقي ان أنشغل انا في بناء امتي وابناء من امتي تهدم بيوتهم فوق رؤوسهم .<br />عيبنا هو عدم قدرتنا على ترتيب أولوياتنا ."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211223/http://masr.20at.com:80/article.php?sid=106&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "الاولويات"
author = "صانع حياة"
posted = "2006-05-01"
text = "اخي الفاضل صاحب التعليق السابق<br />اذا اردنا التحدث عن الاولويات فبالفعل النهضة هي اهم اولوية لسبب بسيط جدا<br />هو لو كانت للامة الاسلامية قوة اي كانت امة ناهضة لما اغتصبت اراضيها ولكن تخلفها هو السبب الذي جعل العالم يتكالب عليها<br />فاذا نهضنا من جديد سيصبح لدينا القوة في رد العدو حينما يصبح غذاءنا من ارضنا سيصبح لنا رايا<br />هذا بالنسبة للاوليات<br />اما بالنسبة لمفهوم الجهاد انت هنا في مصر ما هو مفهومك للجهاد ؟ّ!!<br />استاذي عمرو خالد اني احبك في الله"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211223/http://masr.20at.com:80/article.php?sid=106&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

