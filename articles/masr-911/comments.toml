posted = "2006-10-05"
text = "يا ريت يا براء تقول للناس إية إلى بيكرهوه فى البلد الحكومة ولا الشعب ولا إية بالضبط لحسن أنا سمعت واحد بقول وهوه ماشى فى الشارع \"شعب أبن كلب\" هوة ما فكرش مرة إنه من الشعب ولا إية<br />أه ومروك رجوعك للكتابه بعد الغيبه الطويله دى"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

