subject = "ايمن نور فى قلوبنا"
author = "يوسف المصرى"
posted = "2006-10-08"
text = "بمناسبه الموضوع ده انا كان ليا تعليق بسيط اولا انا مصرى وبحب بلدى واكيد كلنا بنحب بلدنا واسالكم لمازا ايمن نور فى السجن هل لان تقدير الاصوات اللى حصل عليها كانت عاليا على مستواه ام ان الرئيس كان خايف على المحروس ولده من المنافسه القادمه والله ده حرام وافتراء على العموم انا بطلب من كل الناس الحره ان تضم صوتها لصوتى ونقول معاك يا نور"
