[[comments]]
order = 59
subject = "الإعلام السبب.. وجهة نظر"
author = "أبو سليمان"
posted = "2006-10-09"
text = "السلام عليكم أولا، أنا أعتقد أن تفشي ظاهرة العنف سببها الرئيسي الإعلام، وذلك من خلال الأفلام والمسلسلات التي تعتمد هذا الأسلوب وتظهر أن الذي يضرب هو الأقوى.. والذي يسامح ويتنازل عن حقه هو الأضعف.. بالإضافة إلى التدني الخلقي في الأفلام بحيث تبرز بعض السلوكيات الخاطئة على أنها فهولة.. ونصاحة.. وأسلوب عصري متحضر.. وفي المقابل التهكم والسخرية من السلوكيات المحترمة والجميلة، ووسمها على أنها عقلية متحجرة ورجعية..<br />طبعا الشرطة من نسيج المجتمع فهو يتأثر بما يشاهده في الإعلام،<br />الأمر الآخر: أن بعضهم من بيئة غيرة سوية، أو تربى تربية غير معتدلة فيعوض هذا النقص بالاحتماء في وظيفته..<br />فالحل:::....................<br />والله نفكر سويا لأنها مشكلة مش سهلة.. تربى فيها الآباء والأجداد منذ زمن...<br />الله المستعان..."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

[[comments]]
order = 60
subject = "لست حيوانا لأضرب"
author = "ahdaf"
posted = "2006-10-09"
text = "سلام عليكم<br />لا بد أن وراء الصمت عن الاعتداء سبب قاهر أهمه التربية كما تفضلت وقلت .. لذا حل المشكلة لا تعالج إلا في الصغر<br />عودوا فتكاثفوا للتوعية .. والله خير ميسر<br />سلام عليكم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

