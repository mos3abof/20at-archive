author = "طنطاوي"
posted = "2006-09-18"
text = "فكره كويسه .. حلها الوحيد من وجهة نظري بعيدا عن الجعجعة و كتر الكلام اننا نعرف حقوقنا<br />امجد اخد حقه لأنه طالب بيه .. بكل صراحه .. و الناس اللي قلت عليهم في الفيديو محدش عبرهم لأنهم همه محاولوش .. مالآخر .. لو الجمعيات الاهليه و الحقوقيه تتبرع بالمطالبات الحقوقيه و القضائيه لملاحقه كل من يهين مواطن .. اعتقد الموضوع هيتحدد اوي .. و مش هيبقى ضرب مواطن بالساهل .. اكيد الفكره في اولها صعبه لكن لو وصلت لتعميم قوي .. هتلاقي كل مواطن بيتعرض للضرب في الطريق بيطلب بوليس النجده علشان يحرر محضر للضابظ اللي ضربه .. هتقولي ضباط في بعضيهم .. هقولك لو اللي جاي عارف انك عايز تاخد حقك .. و انك مستعد توصل الموضوع لاعلى مستوى .. هيضطر اسفا يسمع شكواك و يسجل محضر بطلباتك دي<br />ربنا يكرمنا جميعا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

