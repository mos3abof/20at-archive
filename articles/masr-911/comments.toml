[[comments]]
order = 46
subject = "حسبي الله ونعم الوكيل"
author = "مصري بيحب بلده"
posted = "2006-09-27"
text = "والله انا تعبت فعلا من التعليقات وقلبي وجعني اوي على بلدي اللي باحبها لكن مطلوب التحرك على عدة مستويات<br />اولا : لابد من عمل لجنة من النشطاء تتولى الاتي<br />1- اعداد الملف بصورة جيدة جدا واستقدام اي ملفات شبيهه<br />2- مخاطبة رؤساء تحرير جميع الجرائد المعارضة بعمل حملة اعلامية صحفية ضخمة جدا جدا<br />3- مخاطبة القنوات الفضائية لعمل حملة اخرى بها ومقابلة رؤسائها ( الجزيرة - العربية - المحور ....الخ )<br />4- مخاطبة الكتلة البرلمانية للاخوان المسلمين والاحزاب المعارضة والمستقلين لاثارة القضية بشكل قوي جدا تحت قبة المجلس واقتراح قانون بتجريم ضرب الشرطة للمواطنين وانشاء مركز متخصص يتم انشاء فروع منه على مستوى جميع محافظات مصر لتلقى شكاوى المواطنين بهذا الشان والبت فيها وكذلك عمل خط ساخن لاستقبال مثل هذا النوع من الشكاوي<br />5- مخاطبة وزير الداخلية وارسال نسخة من الملف له مع اقتراح بتدريس مادة داخل كليات الشرطة عن حقوق الانسان واهمية احترامها<br />في حال فشل هذا يتم مخاطبة الامم المتحدة بعد استئذان اعضاء مجلس الشعب من كتلة الاخوان والمستقلين والمعارضة<br />واخيرا اقول لصاحب الورده الذي استفذني جدا تعليقه ما تحكي عنه لا يكون مع انتزاع الحريات من حكومات مستبدة ومتسلطة ما تحكي عنه عندما اكون قادرا على رد الاهانة ولا افعل ذلك ما تحكي عنه يكون عندما اكون الاقوى ليتفهم الاخر ان الورده ليست عن ضعف ولكن عن مودة<br />وانا على استعداد تام للاشتراك مع تلك اللجنة في حال تكوينها ومساعتهم بكل طاقتي وهذا ايميلي للمخاطبة eng_m.s.a@hotmail.com"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

