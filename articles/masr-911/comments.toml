author = "فية وظيفة اسمها مفتش داخلية وهو غالب لواء ابن ناس ومحترم جدا غالبا لو كان الضرب مش فى قضية سياسية ممكن يساعد المضروب"
posted = "2006-09-19"
text = "ملحوظة اللى اتكلم عن فقع العنين لو الموضوع<br />دخل فى العرض او مهانة جسدية يبقى اقل واجب وبدل مايكسر عنيك افقعلة عنيو شعار حلو اعتقد وياريت نعمل ملف منشور بالأسماء والتواريخ بالجلادين بداية منى<br />مدير مباحث قسم تانى سوهاج<br />مقدم اشرف نصحى التاريخ 2001 ضرب وتعذيب شاب فى القسم افضى للموت العقوبة نقل من موقعة<br />لااسف لايوجد له صورة وانا خلاص سبت المحافظة ولا اعلم اخر اخباره"
