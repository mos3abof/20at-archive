author = "زنوبه"
posted = "2006-09-12"
text = "ربنا على الظالم والمفترى ... وإبن الحراام<br />مقالتك آثرت فى بجد خاصة جزئية إنك ما كنتش بتقدر تدافع عن نفسك وإنت صغير ـ الحاجه الوحيده اللى آنا معترضه عليها إنك قلت عن البنت اللى الضابط بيضربها إن شكلها مش محترمه .. طب والله حرام عليك مش حيبقى الضابط وإحنا عليها ، البنت كان شكلها حقيقى يوجع القلب وهى بتتهان بالمنظر ده مهما كان جرمها فهى لها حقوق ويجب آن يحافظ على إنسانيتها!!<br />آقترح الآتى:<br />كل آب وآم يجب آن يلحقوا آولادهم بتدريبات دفاع عن نفس<br />من تعدوا مرحلة الطفوله يجب عليهم آن يلتحقوا بالمراكز الصحيه التى تقدم هذه التدريبات<br />البنات بقى اللى مصممين يحضروا المظاهرات ـ آنصحكم بإرتداء بادى زى بادى الآيروبك الملتصق بالجسم تحت الملابس حتى إذا قام آى من آفراد الامن بتقطيع ملابسها لآهانتها ، لا يتعرى جسدها آمام الملاء كده!!<br />ولو حد هاجم بنت فى الشارع قدامك حل من إثنين 1. رشى زجاجة البرفان فى عينه بس خليكى عارفة إنه ممكن يتعمى بسبب السبرتو اللى فى البارفان 2. إديلوا شلوت بعزم ما عندك فى المنطقة الحساسه آو آعملى الاتنين مع بعض وإطلعى إجرى بآقصى ما عندك<br />والله العظيم باتكلم جد<br />وآنا صغيره كنت بآلعب تايكوندو وكان تدريب البطولات يختلف طبعا عن الإستريت فايتينج Street-fighting<br />من الاماكن المؤثره فى الجسم * بوكس فى المنطقه بين العينين يؤدى لعمى مؤقت * إمساك جزء الحنجرة آو مايسمى بتفاحة آدم مثل مسكة \"كآس الشمبانيا\" وجذبها للخارج يؤدى للوفاة * شلوت فى المنطقه الحساسه آو الضرب بمقدمة الركبه آعتقد النتيجة معروفة<br />فى البلد دى الواحد لازم يآخذ جقة بإيده لآن ولى الامر مشغول بجواز إبنه وتوريثه العزبه ـ لكن اللى عايز يصفح من باب الاحسان له الآجر والثواب إنشاء الله<br />بإختصار علموا ولادكم وإنتم كمان<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

