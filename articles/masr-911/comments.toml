[[comments]]
order = 22
subject = "حملة جريئة"
author = "أحمد أبو القاسم"
posted = "2006-09-14"
text = "أسجل إعجابي الشديد بفكرة هذه الحملة الجريئة والتي تنم عن تزايد الوعي بشكل مطرود بين أوساط الشباب المصري وهو ما يبشر بمستقبل واعد .. فقبل خمس سنوات فقط لم يكن يجرؤ أحد على مجرد التفكير في المواجهة .. أما ألان وفي ظل هذه الصحوة الشبابية المصرية والتي بث الروح فيها تزايد الشهور بالظلم والقهر والإذلال .. وغذى هذا الشعور الانتهاكات الصارخة المنهجية والمنظمة التي ارتكبها عدد غير قليل من المرضى والمعقدين النفسيين بحق المواطنين الشرفاء الأبرياء .. ونالت وزارة الداخلية التي من المفترض أنها تصون الأمن والحريات نصيب الأسد من هذه الانتهاكات الصارخة والتي تجاوزت في بعض الأحيان كل حدود التعبيرات والتوصيفات الممكنة من جراء البشاعة والقذارة والتدني في أسلوب ارتكاب هذه الجرائم النكراء وهو ما يوجب استقالة وزير الداخلية فوراً ومحاكمة مرتكبي هذه الجرائم محاكمة علنية حتى يكونوا عبره لكل من تسول له نفسه أن يفكر في التعدي بالقول أو الفعل على مواطن أو يفكر في استخدام السلطة كاداه للبطش والتنكيل دون أدنى مراعاة لأبسط حقوق الإنسان التي كفلها ديننا الإسلامي الحنيف منذ 1400 سنه والتي أيدتها كل الدساتير والتشريعات والقوانين حول العالم .<br />من أجل ذلك يتوجب علينا أن نستمر في إيجابيتنا وأن نتحمل مسئولياتنا ونقوم بخطوات فاعله من أجل هذا الهدف النبيل والغاية السامية ألا وهو حماية المواطنين البسطاء من بطش هؤلاء المجرمين الساديين المرضى النفسيين .<br />لذا أقترح :-<br />أولا :- تبني مطالبة وزير الداخلية بالاستقالة كما يحدث في أي دولة صغيرة كانت أو كبيرة بل إن بشاعة هذه الجرائم تحتم على حكومة \"الكوارث\" كلها الرحيل .. مع تقديم المسئولين عن هذه الجرائم للمحاكمة الجنائية العلنية .<br />ثانياً :- جمع توقيعات إليكترونيه<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

