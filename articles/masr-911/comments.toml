[[comments]]
order = 32
subject = "ماذل المللك عياش"
author = "سى سيد"
posted = "2006-09-17"
text = "هذ الضرب ثنا عند العرب وكان ايام المللك والباشا الضرب حتى الان كل فراد يقول لامن الشرطة او ضبابط الشرطة يا باشا وهذ الاحترام لازم ان يضرب لان هى عقدة نفسية وهو ابن باواب او امة غس ,’؟؟؟؟؟؟؟؟؟ افتكر انة باشا صح وانتم يا ايها ؟؟؟؟ الاحترام الذايدة غلط لان هو لة عمل خاص الحراسة والامن بس وارجو ان تنظار الى بلاد اروبة كيف يعمل المواطن وكيف حراس الامن .. وكما قرات من قبل اللة يعطية الصحة الاخت شيماء هذ هو الصح ولكن من يقول الرسول صلية اللة علية وكما يعمل الان ليس هذ اقراء القران الكريم وشوف الجار والصديق بس ليس من الحق ان تسيب حقاق لازام ولبود ننظر الى البلاد المتقدمة لان كل عام وانتم فى التاخير الى عشرين عام من قلات الاحترام الى بعض وعمل الفوحش وليس فى دين ولا اسلام من شعب الى الشرطة والان هى الفلوس بس هى المعملة الوحيد فى اى بلد عربية ليس مصر بس لا لابود كل شى يتغير حتى نفسية الانسان وارجو من الاخوة ان تعلم ان من الحق لرئيس الجمهورية ان يتغير كل خمس سنوات وهو الصح وهى اول نظرية لشعب مصر لان ما هو الفرق بين الرئيس والمللك وعدم كترات الاحزاب وكل هذ نظيم غلط فى غلط,, ولا فرق بين عربى وعجمى او سعبى وشرطى ولبود من الاستقالا ويجب على كل انسان ان يفكر صح واللة معكم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

