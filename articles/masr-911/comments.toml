[[comments]]
order = 62
subject = "اه فعلا"
author = "F"
posted = "2006-10-11"
text = "انا فعلا مع الاخ اللى بيقول ان الشعب لازم يتعمل يحترم بعضه الاول ...لأن كله مش بيحترم بعضه و لو حد قال للتانى شكرا فى الشارع و لا المحلات و لا الصيدليات بتبقى حاجه غريييييبه ...و قليل اللى بيحترم مراته ادام الناس ... لدرجه ان واحد ضرب مراته لأنها مرقصتش ادام اهله .... بقى الموضوع بايظ خالص ... و لو اتعلمنا دينا الاول صح هاتنتهى كل هذه المشاكل لأن دا فى الاخر بيرجع برده لسطحية معرفتنا بالدين .. لان اللى بيضرب و اللى بيلعن دا من غير وجه حق لى جزاء فى الدنيا او فى الاخرة"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

