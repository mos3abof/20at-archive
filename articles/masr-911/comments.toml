text = "ياجماعه بلاش نشتم في رموز الحكومه ده اسفاف واذا كنا بنعترض وعشان كده بنشتم يبقي نستحق الضرب زي ماعلمتنا اهلينا واحنا صغيرين ان الشتيمه عيب وحرام لازم نبقي متحضرين ومحترمين مع انفسنا حتي ننال احترام الأخرين لازم نعترض مع احترامنا لكل شئ حولنا واذا كان الله كرم النسان والأنسانيه رايح انت تقول ابن..... وده بأمارة ايه واذا كان علي الضرب من يتقي الله يجعل له مخرجا ولا نسمح لأحد ان يجعلنا نتتنازل عن ادميتنا مهما كان الثمن"
