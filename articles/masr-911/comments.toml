[[comments]]
order = 10
subject = "المشاركة يجب أن تكون فعالة"
author = "ناصح أمين"
posted = "2006-09-12"
text = "يجب أن تكون المشاركة إيجابيةوفعالة في هذه الحملة التي أؤيدها على طول الخط.<br />يجب توزيع الأدوار<br />فالمضروب يجب ألا يحني رأسه لضاربه فليضرب وهو عزيز وليس ذليل. وكذلك لا يضع نفسه موضع يضرب فيه وأن يسبقه خلقه قبل يده.<br />والمشاهد أدعوه أن يحمل كاميرا أو محمول بكاميرا ويكون جاهز ليرسل الصور فوراً إلى الموقع الذي يتولى بتخصيص مساحة لعرض تلك الصور على أن تكون واضحة بما فيها الكفاية.<br />وعلى كل منا يعرف صاحب الصور أن لا يستحيي من ذكر اسمه وكل شخص معنوي أو طبيعي يقوم بهذه الأعمال المشينة بالتاريخ والمكان ليكون مستنداً يمكن أن يأخذ المضروب حقه.<br />ولا يتكاسل المحامون بمساعدة المضروب لأخذ حقه"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

