author = "أمالي سودة"
posted = "2006-09-20"
text = "السلام عليكم<br />بارك الله فيكم<br />الموضوع رائع بجد وعندي كام اقتراح كده<br />ان احنا نعمل حصر لمكاتب حقوق الانسان في مصر ولجان الحريات في النقابات ويجب التركيز في الشكوي والمعارضه علي شخص معين او هيئه بعين حتي نحصل علي نتائج قوية وهي سياسة اضرب المربوط يخاف السايب يعني الضابط الله لا يسامحه اللي بيضرب المواطن في الكليب لما يتحاكم زملائه الضباط هيفكرو الف مرة قبل اما يعتدو علي اي مواطن<br />وشكرا ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

[[comments]]
