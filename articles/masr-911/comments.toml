posted = "2006-10-05"
text = "لا إله إلا الله<br />الله يكون بعونكم احبتي في مصر<br />انا عارفه إن كثير دول عربيه و حكوماتهاعندهم هوايه وهي \"التعذيب\"<br />بس إن المسأله تكون في في المعتقلات و غير منشوره, بس الضرب يكون بالمصانع وبين الناس على المكشوف كذه !!<br />حكم القوي على الضعيف,, ولكن ممكن تتغير الموازين و التغيير بإيدكم, الله معاكم<br />حسبي الله عليهم<br />حسبي الله عليهم"
archived = "2006-11-06"
