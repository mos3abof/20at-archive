[[comments]]
order = 15
subject = "نحترم بعض بداية"
author = "معتـــــز"
posted = "2006-09-12"
text = "السلام عليكم<br />بالنسبة لموضوع الضرب<br />إيه رأيكم نبدأ من تحت؟<br />أنتم اتكلمتم عن ضرب أصحاب المحلات للعمال وغير ده كتير<br />يعني الشعب نفسه بيضرب في بعضه<br />طب ما نركز على الشعب الأول كمرحلة أولى لأن الشعب يقول أنا محترم مش هنضرب لازم يكون أصلا بيحترم بعضه<br />نبدأ نبين كل حالات ضرب الشعب لبعضه<br />ونتكلم بلغتين في آن واحد<br />لغة غرس الاحترام والفرق بين إنك تجعل الآخر أو العامل عندك يحترمك حبا فيك وبين إنك تقهره ، ،،يمكن نصحي شوية رحمة في قلوب الناس ويمكن يكون في ناس مش فاهمة الفرق بين الاحترام والقهر<br />اللغة التانية<br />لغة التخويف من أثر ده أخرويا طبعا من الدرجة الأولى<br />ثم فضح مثل هذه الأعمال قد تلحق بهؤلاء -اللي أغلبهم هيكونوا تجار ورجال اعمال- خسائر كثيرة على الأقل أدبية<br />وتبين إن مثلا صاحب العمل عند ضربه العامل بيخسر ولاؤه ودي مصيبة في السوق لأن مهما كان كل مكان وله أسراره الاقتصادية واللي أكيد العامل المضروب مش هيحافظ عليها<br />ده رأيي وأرجو أن يكون مفيد<br />والسلام عليكم<br />egypt-student.blogspot.com"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

