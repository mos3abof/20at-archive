subject = "ضربة بناتى"
author = "الحرس الجامعى بجامعة جنوب الوادى بقنا باجبار الطالبات المنقبات على خلهع النقاب بصورة نهائية لا لمجرد الكشف عن هويتها عند البوابة كما هو متبع"
posted = "2006-09-21"
text = "واصيبت العديدات بحالات اغماء ومن تماسكت بحثت عن مسئول وحتى رئيس الجامعة قال \" اوامر عليا \" اما قائد الحرس فرد على طالبة سالت : واذا لبست استرتش وبدى \" بانها فى هذه الحالة هايشيلوها ف عنيهم<br />وبعد هذا نلوم على البابا!!"
