text = "ابدا بنفسك عندما يكف الماطن اللي برة البيت غلبان عن ضرب زوجتة ام العيال علشان اتفة الاسباب و لما الاخ يبطل ضرب في اختة اللي اضعف منه علشان يثبت انه راجل و لما الاب يبطل يضرب عياله لمجرد انه بينفث عن غضبه فيهم و لما المدرسة تحرم الضرب علشان الانسان يتعلم جنب العلم الكرامة و لما العيال يبطلوا ضرب بالحجارة في القطط الصغيرة لمجرد انهم يلعبوا لما كل واحد يتعلم بحترم اللي اضعف منه تبقي الحكومة تحترم الشعب و تبطل ضربة و تبطل امريكا هي كمان تضرب في الاضعف و هلم جرا تقدر تبدا بنفسك"
archived = "2006-11-06"
