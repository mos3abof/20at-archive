posted = "2006-09-28"
text = "كلامك كويس اوى بس احنا منقدرش نعمل اي حاجه من دي الا لما يكون في رغبه من دي داخل كل انسان مش عاوز الموضوع ده الانسان بيغير نفسه من نفسه انا منكرش انه لازم في حد يساعده بس لازم وحتما ان يكون في رغبه وحب لكده وعموما انا اتضامن معاكوا واقول انـــــــــا مــــــــش هـــــتـــــضـــــــرب والقوي عليه ربنا لانه اسمه القوي"
