text = "سلام عليكم بارك الله فيكو اظن ان اكترناس هيستفادو من الحمله ده السياسيين والمواطن المطحون واكتر ناس هتتضر الحكومه والمخبرين ربنا معانا الموضوع محتاج شويه مجهود كفايانا اجيال مهانه شايفه الذل وراضيه وبتتسلب حقوقها وهاديه بس بعد كده نشوف كل انواع الذل مش الضرب بس ونوفر الدم اللي بيسيل في الضرب ليوم ندافع فيه عن بلدنا علي فكره يا بن ادم فكرتك رائعه بس جربناهافي كليتنا مع الامن وجت علي دماغنا الوضع اختلف لاختلاف نوعيه الضارب ده الكوووووووووووووووووووووومه انت بتهزر ورده ايهيلا ننطلق في الحمله بسرعه"
