text = "انا مبدئيا ضد مبدأ الضرب خالص , لكن انا مرة شفت ضابط بيضرب راجل فى الشارع وسجلتها فيديو , بس مش عارف عندى ولا لأ , لكن اللى عايز اقوله فى الموقف ده , انا كنت مؤيد ان الظابط يضرب الراجل ده , لانه كان غبى ويبستغبى كمان , راكن العربية فى ميدان , والضابط يقوله امشى , وهو مش راضى , ولما الضابط راح علشان ياخد المفتاح جرى وراه , وبعدها لما سابه لقاه واقف تانى , فراح على العربية تانى فالراجل شتمه , باختصار الراجل كان بيعمل غبى وبيستعبط على الضابط وهو الغلطان , لكن انا عامة ضد مبدأ الضرب اطلاقا وشكرا"
