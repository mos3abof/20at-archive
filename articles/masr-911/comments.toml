[[comments]]
order = 13
subject = "ببساطة"
author = "مصراوي قديم"
posted = "2006-09-12"
text = "احبائي الكرام<br />احب ان اوضح شيئ بسيط,لكل من يقول ان نبدأ نحن بالسلم و المودة و الحب, نحن لم و لن نبدأ أبدا بالعنف, لأن الشعب المصرى بطبيعته مسالم و طيب و يحب العيش فى هدوء, لكن المشكلة فى هؤلاء الذين يتلذذون بضرب الناس و التفنن فى التعذيب, و السبب بسيط, لا يوجد رقيب او حسيب عليهم سوي الله سبحانه و تعالي, و بالتالي يفعلون ما يريدون, اتعلمون يا اصدقائي, و انا اقول هذا علي مسؤليتي الشخصية و من قريب لى يعمل برتبة كبيرة بمباحث امن الدولة, ان مصر و المغرب اصبحتا اولى دول العالم فى فنون التعذيب و اساليب استخراج الاعترافات, اتعلمون انه يتم ترحيل المتهمين من معظم سجون الدول العربية و الاوروبية الى مصر حتي يتم استجوابهم و هم تحت اشراف كامل من امن الدولة, ليس هذا افتراء و لا مبالغة, و السبب ان السجون الاوروبية اصبحت خالية من الظباط القادرين على القيام بمثل هذه الافعال و الله لانهم يخافون الله, هذا بالظبط ما قاله الظابط الاوروبى الذى كان مرافقا لاحد المسجونين لقريبي ظابط مباحث امن الدولة, اتعلمون ان من ضمن العهدة الرسمية لأقسام الشرطه فى مصر بطاريه مولدة للتيار الكهربائى للاستخدام فى التحقيقات و الاستجوابات, اذا الشرطة و ليست الحكومة و ليس الرئيس اصبحوا يكرهون الشعب المصري, يوجد محاضرات تلقى علي ضباط الامن المركزي, و قد حضرت احدى هذه المحاضرات خلسة مع قريبي هذا, يتم فيها تلقينهم عدة مفاهيم, والله لو ذاهبين لملاقاة العدو الصهيوني ما لقنوهم مثلها.<br />اذا, نحن افراد الشعب المصري فى مواجهه عدو داخلي, عدو من نفس الجنسية و البلد و الدم, فلا تقولوا لى نبدأ بالسلم و المودة, نحن نرغب في ذلك و لكن هم لا يرغبون.<br />لذلك يجب ان تكون هذه الحملة او الحركة جادة و نشيطة, و ان يتولى ادارتها من هم علي دراية كا<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

