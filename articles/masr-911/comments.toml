[[comments]]
order = 41
subject = "الشواذ اولاد ال......"
author = "بسلة مصرية مسلمة"
posted = "2006-09-23"
text = "حقول اية بس الموضوع ممتاز والله انا اتفرجت على الكليبات وبحى الى عرف يعد عدد ال 16 الم على وش الرجل لان بصراحة انا كنت ضعيفة ومستحملتش اتفرج بس حقول اية؟ لو يقدر رجال وسيدات الحزب الوطنى يتفرجوا فى التليفزيون على بناتهم او ولادهم وهما بيتهتك اعراضهم فى الشوارع على شاشات التليفزيون زى يوم الاستفتاء الملعون ولا على ضرب وموت ولادهم على النت فى الاقسام يبقى يا رب نشوف ولادهم بيتعزبو ويدبهدلو زى ولاد الناس الى اتبهدلوا. وبعدين الضرب مبقاش سياسة من اجل الاعتراف لا دة بقى من اجل التسلية دول كانوا الظباط بيهزروا وبيتسلوا على الراجل فى قسم الهرم ( اضرب يا مصطفى ؛ وكلاكيت تانى مرة ) والله دول شواذ"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

