[[comments]]
order = 51
subject = "نحن الخراف"
author = "مصراوي قديم"
posted = "2006-09-30"
text = "نحن الخراف<br />الموقعون أدناه<br />نعلنكم<br />أننا مازلنا أحياء<br />وأن لنا صوتآ<br />يقول ماء ، ماء<br />ونطالبكم<br />بأن يكون<br />المرعى للجميع<br />وهو ما يعني<br />كل أفراد القطيع<br />فليس من النخوة<br />والجدعنة<br />أن تستولوا على<br />كل ما تركه لنا جدنا<br />فأنتم نهبتم<br />كل الحشيش<br />وزعمتم<br />أنه لغيركم مافيش<br />فإن يكن لديكم ألفآ<br />من القرون<br />فإن لنا آلافآ<br />من البطون<br />فإن تبقرون<br />فبعضنا سيموتون<br />وتحيا بقيتنا<br />وتهلكون<br />فلابد أن يكون<br />المرعى للجميع<br />وهو ما يعني<br />كل أفراد القطيع<br />فنحن الخراف<br />المذكورون أعلاه<br />نعلنكم<br />أننا مازلنا أحياء<br />وأن لنا صوتآ<br />يقول ماء ، ماء<br />توقيع: الخراف الصاحية"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

[[comments]]
order = 52
subject = "الخليفة حسني مبارك"
author = "؟"
posted = "2006-10-03"
text = "ولد حسني مبارك (لعنة الله عليه) في الاسكندرية عام 1896 وخلع سنة 2001 بويع حسني مبارك بالخلافة سنة 1899م ومن اهم اعماله تاسيس جمهورية مصر الجديدة ومقاومة اسرائيل حتى فتحت مصر على يده عام1988م وفي سنة 1993م تصدى للاسماعلية والشيعة وكانت اهم معاركه معركة سينا حين تصدى للحركة الصهيونية وانتصر عليهم وتسمى هذه المعركة معركة1999م وفي عام 2001م خلع من منصب الخلافة وفي عام 2002 لقي حسني المبارك حتفه على ايدي الثوار عليه كان لمقتله اسباب عديدة اهمها انه اعتمد في حكمه على الرذيلة والمنكرات وبرغم من اعمل عديدة التي قام بها الا انه كان يفتقر الى العدل وخبرة السياسة."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

