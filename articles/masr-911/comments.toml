[[comments]]
order = 5
subject = "مفيش غير منهج النبي محمد صلى الله عليه وسلم"
author = "ابومحسن المصري"
posted = "2006-09-12"
text = "متقوليش وما تعدليش منهج النبي غيره مفيش<br />أخي... أختي... اجعل النبي محمد صلى الله عليه وسلم نصب عينيك وضعه دائما عن يمينك فى سيرك وتصرفاتك وعامل الناس كما كان يعامل... واطلع على كتب السيرة وأنهل منها... وجاهد نفسك لتسير على خطه وخلقه ومطبق لسنته في أقواله و أفعاله عاملاً بمنهجه و اقرأ القرآن الكريم و كأنه أنزل عليك فأعمل بما فيه لأن رسولنا كأن قرآن يمشي على الأرض... وكان خلقه القرآن الكريم ...فهيا بناء ننهل من النبع الصافي القرآن والسنة... ونضع النبي على يميننا مرافق لنا في حياتنا ومقياس لأي تصرف نود أن نعمله... ومع ايماننا العميق والكبير أن الله بعلمه ورحمته يحيط بنا... ستتغير أحوالنا ... وستنظر للحياة بنظرة جديدة لاتنسينا أحداثها أننا نزرع فيها ما سنحصدها في الآخرة... وإن كل تعب يهون مادام الهدف سام والحفيظ لا تأخذه سنة ولا نوم ... والرفيق هو محمد عليه أفضل الصلاة و السلام."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

[[comments]]
order = 6
subject = "كفااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااية"
author = "معاذ محمود عامر"
posted = "2006-09-12"
text = "يسقط مبارك ورجاله وابنه وكلابه الملاعين<br />يسقط الظلم والظلمة<br />يسقط كل الأنذال والكلاب والخنازير من اول الخنزير الكبير محمد حسني مبارك الى الى أصغر خنزير في رجاله وأجهزته المستبدة<br />يا مبارك<br />لعنك الله<br />لعنك الله<br />لعنك الله<br />لعنك الله<br />لعنك الله<br />لعنك الله<br />يارب لاتسامحهم ولاتجلعهم يردون على جنة الخنازير<br />الأنجاس أبناء الأنجاس<br />الفاجرين<br />العاهرين<br />الظالمين<br />يا كلاب يا ابناء الكلاب يا مبارك ياحقير يا أحقر من وحيد القرن<br />يا مستبد يا ظالم يا قاتل يا سارق الوطن حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل<br />حسبي الله ونعم الوكيل"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

[[comments]]
order = 7
subject = "فعلا مش حتضرب"
author = "شيماء"
posted = "2006-09-12"
text = "السلام عليكم<br />يحضرني الان قصة قصها الدكتور علاء الاسواني في احدي مقالاته تعليقا علي حرب لبنان.<br />يحكي الدكتور انه كان يعرف زوجة دبلوماسي يعيش في القدس و قد حكت له زوجة الدبلوماسي انها يوما ما كانت تقف في شرفة منزلها الذي كان يطل علي منطقة تفتيش اسرائيلية بها جنود اسرائليون يفتشون من يمر من الفلسطينين و كان فيهم جندي اسرائيلي يطلب من كل فلسطيني يمر ان يقبل حذائه تحت تهديد السلاح و كان اغلب الفلسطينين يفعلون ذلك خوفا من السلاح و ذات مرة كان المار شاب فلسطيني صغير السن , رفض هذا الشاب ان يقبل حذاء الجندي الاسرائيلي حاول معه الجندي و هدده فرفض الشاب رفض تام و عندما ايقن الجندي بانه سيفشل في مهمتة تظاهر بانة مشغول بمكالمة في تليفونة المحمول و اشار للشاب بالمرور.<br />اذن فنحن من يئذن للاخرين باهانتنا بسكوتنا عن حقنا و الظالمون اخواني جبناء و ضعفاء النفس و لو انهم اقوياء حقا قوة حقيقية ما لجئوا لهذه الاساليب ليواروا ضعف نفوسهم و جبنهم.<br />ان الرب واحد و العمر واحد و تعددت الاسباب و الموت واحد فلنموت بكرامة خيرا الف مرة من الموت بلا كرامة."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

