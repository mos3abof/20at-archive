[[comments]]
order = 56
subject = "يا فرعون"
author = "مهتمه"
posted = "2006-10-07"
text = "قالوا يا فرعون ايه فرعنك ...... قال ملقتش حد يلمني ، فرعون ما يقدرش يبقى فرعون من غير هامان ومن غير جنوده ومن غير حاشية فاسدة حواليه ، والاهم من كل ده ، ما يقدرش يبقى فرعون من غير شعب مطحون مقهور مغلوب على امره ومحدش عامله حساب .<br />تخيلوا فرعون كده من غير شعب ...... ايه قيمته ؟ طيب ايه لازمه الجنود اذا كان مفيش شعب يطحنوه ؟<br />طب تخيلوا لو الشعب ده رغم الضعف .... والفقر .... وطول القهر والاذلال ، فجأة انتفض وقال لا stoooooop<br />تحول المسكين الضعيف المقهور .... لمارد متمرد قوي وجبار وقاهر ، مستعين بالله حتى لو كان معندوش اي حاجة تانية يستعين بيها<br />\"وكفى بالله وكيلا\"<br />تخيلوا هؤلاء الظلمة الجبناء كيف سيكون حالهم ؟ كيف سيدافعون عن انفسهم ؟ بمزيد من الظلم والقهر؟ طاب وماله ماهي خربانه خربانه ، بس الانسان يموت بكرامة ، ويبقى عنده امل ان جثته تبقى سلمه يصعد فوقها الآخرون ليصعدوا ويرتقوا ويُوقفوا الظلم والظلام ، يعيشوا بكرامة ويربوا ولادهم انهم يعيشوا بكرامة .<br />لا يوجد ما يستحق ان تحتمل قتل كرامتك من اجله .... لتعيش ميت يتنفس ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062436/http://masr.20at.com:80/article.php?sid=911"

