text = "خخخخخخخخخخ بيني وبينكم انا جربتها . يعني على قولتهم نواكب الموضه بس بصرااحه الموضوع فييه ان..<br />يعني لبس الاسكارف شي عادي للبنات لكن انه يكون ( الديزاين) شمااغ بس بالوان مختلفه يخلي الشخص يفكر ليييش وش معنى شماااغ الرجال يعني يقدرووون يسووون سكارفات برسوومات مختلفه ولكن المسأله متعمده لذلك قررت ماالبس علشان ابتعد عن الشبهات واريح نفسي. وبصراااحه احس انه تشبه بالرجال والله المستعان."
archived = "2010-01-05"
