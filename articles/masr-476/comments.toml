text = "لقد اخذنى الشوق اليك وشعرت انك اخى رغم انى لا اعرف عنك غير انك كنت محبوس وافرج عنك لكن اشعر انك مصمم على النضال والكفاح حتى تشرق شمس الغد بالحرية اللة معك ومع كل الاحراروتحية لعلاءوكريم الشاعر والشرقاوى وكمال خليل وكل المحبوسين وتحية خاصة لمن علمناء الحرية وحب الوطن وان نبكى علشان مصر زعيم الغد الدكتور ايمن نور"
