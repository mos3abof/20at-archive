author = "كل حرية ولها وقود لينير الطريق للسائر على طريقها والمعتقلين هم الضوء الذى ينير الطريق لمن سينهض من أجل الوطن فهل من مجيب أم سنترك البلد لمحتل لا يعرف عن مصر سوى نهب أموالها وإعتقال شبابها ولكن يوم الخلاص قريب وسيوضع هذا الحاكم والحثالة من حولة فى مواقعم الحقيقية فى المعتقلات ليذوقوا ما أذاقوه لمصر كلها"
