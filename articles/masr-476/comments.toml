[[comments]]
order = 7
subject = "إنها عصابة"
author = "محمد السيد"
posted = "2006-06-08"
text = "كتب هذ الموضوع : الأستاذ أحمد الزعيم<br />هل توجد حكومة على وجه الأرض تقتل وتنزع الانتماء والولاء لكل ما هو إسلامي من قلوب أفراد شعبها ...<br />نعم ...<br />ما هي ...<br />إنها الحكومة المصرية .<br />هل توجد حكومة على وجه الأرض تبقى ما يزيد عن ربع قرن ولم تحل أي مشكلة واجهتها بل والأدهى هو ازدياد أعداد هذه المشكلات .... نعم ...<br />ما هي ..<br />الحكومة المصرية .<br />هل توجد حكومة على وجه الأرض ظلت عشرات السنين تبحث عن حل لمشكلة البطالة ولم تستطع حلها ...<br />نعم ....<br />ما هي ....<br />الحكومة المصرية .<br />هل توجد حكومة على وجه الأرض ظلت عشرات السنين تبحث عن حل لمشكلة إسكان الشباب ولم تستطع حلها ...<br />نعم ...<br />ما هي ...<br />الحكومة المصرية .<br />هل توجد حكومة على وجه الأرض يظل وزرائها وقياداتها في الحكم ما يزيد عن ربع قرن ...<br />نعم ...<br />ما هي ...<br />الحكومة المصرية .<br />هل توجد حكومة على وجه الأرض عندما تنادي بالتغيير الجذري تقيل وزير إعلامها وتعينه رئيساً لمجلس الشورى الخاص بها ... نعم ...<br />ما هي ...<br />الحكومة المصرية ...<br />أمّال التغيير لو مكانشي جذري كان راح فين ... كان زمانه بقى رئيس الجمهورية .....!! .<br />هل توجد حكومة على وجه الأرض يكون نائب رئيس حزبها متهماً في قضايا فساد ورشوة ...ومع ذلك تتمسك به بل وترشحه في الانتخابات ويسقط سقوطاً مدوياً ...<br />نعم ...<br />ما هي ...<br />الحكومة المصرية .<br />يا أخي ... إن هذه ليست حكومة ...<br />أمّال نطلق عليها ؟<br />... يا أخي إنها عصابة ... !!!<br />و برضه<br />لاتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025309/http://masr.20at.com:80/article.php?sid=476"

[[comments]]
order = 8
subject = "امة الذيل"
author = "محمد عبد الهادى"
posted = "2006-06-12"
text = "امة الذيــل<br />ولما كان الذيل دائما في المؤخرة وأصبحنا نحن في مؤخرة الأمم فبالتالي فالأذيال نحن ولكن اى نوع نحن ؟هل صرنا كذلك بين ليلة وضحاها ؟لا للأسف لقد تمت العملية في شكل تدريجي<br />أولا أذيال جياد ثم بعد فترة ليست طويلة وليست بالقصيرة أذيال حمير إلى أن وجدنا أنفسنا زيل في كلب جرب يلهث بلسانة الأرض من العطش ونحن نتحرك في مؤخرتة (ذيلة)يمين ويسار في منظر يثير الغثيان والآن لم أجد في الكلب ذيل فمن شدة الجوع والعطش ذبل الذيل وقصر إلى أن أصبح ملاصق للمؤخرة ونزل على الأرض مع أخر غائط نزل منة<br />يامة تتمنى أن تكون زيلا<br />لَيْسَ ابْنُ آدَمَ ذا جَهْلٍ بِمَصْرَعِهِ لَكِنَّهُ يَتَنَاسَى الْجِدَّ بِاللَّعِبِ<br />تَراهُ يَلْهُو وَلا يَنْفَكُّ في حَذَرٍ وَرَاحَةُ النَّفْسِ لا تَخْلُو مِنَ التَّعَبِ<br />شعر محمود سامي البارودي<br />محمد فوزي عبد الهادي من محافظة الذيل<br />Mohamedfawzy83@yahoo.com"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025309/http://masr.20at.com:80/article.php?sid=476"

[[comments]]
order = 9
subject = "كذب ونفاق"
author = "مش ولا بد"
posted = "2006-06-20"
text = "بالنسبه للاسم مافيش داعي المهم كذب ونفاق لو قالو قانون البيئه كذب ونفاق لو قالوا مفيش بطاله كذب ونفاق لو قالوا مفيش فقر في البلد فقر ونفاق وعنطذه غبيه لو قالوا مصر فقيره كذب ونفاق لو قالو البد والعد ومافيش رشاوي ولا مجاملات ولا اي شي من سبيل ذلك كذب ونفاق لو قالوا انتخابات نظيفه كذب ونفاق عندما يحاكمون القضاء زور وبطلان ومن القسوه ان يتحاكم رجالا يقولون الحق في بلاد ولا يعاذ بالله اه اه اه اه اه من قلبي الحزين من الرئيس الكئيب الذي شرد الالف المصريين كيف وازاي اعرف ان اكبر بلد ولا بلالش بلاش احراج وكفاي اني اقول فيما معناه حديث من رسول الله صلي الله عليه وسلم عليه افضل الصلاه والسلام ى\" الامام راعي مسئول عن رعيته ومن يكون الامام راع الان الكل يعرفه واسيبكم الوقت علي كلمه واحده هقوله\"حسبي الله ونعم الوكيل من الامضاء مفيش داعي الاميل بتاعي gg_gg_2005@yahoo.com"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621140444/http://masr.20at.com:80/article.php?sid=476&PHPSESSID=99256777aaaf8c6a523badb74c4816e9"

