[[comments]]
order = 0
subject = "مفيش لأي حد بيحب البلد دي افراج"
author = "محمد السيد"
posted = "2006-06-07"
text = "اخ يا بلد ........<br />امبارح رحت عرض النيابة لل164 معتقل اللي اعتقلوا يوم ممحاكمة الفضاة الأول<br />واااااااااااه<br />أخدوا كلهم تجديد 15 يوم تاني .يعني حيكملوا الشهر ونص وهم بعيد عن أهلهم وحبايبهم وشغلهم وكل حاجة ...<br />تخيلوا ؟؟؟ والله انا كنت رايح وعندي امل كبير انهم حيفرجوا عن مجموعة كبيرة وكنت بأفكر مين يخرج ومين حيقعد .لكن<br />اتجدد لكله ....<br />و برضه<br />لاتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025309/http://masr.20at.com:80/article.php?sid=476"

[[comments]]
order = 1
subject = "كانت وشوشهم امبارح أحلي من أي وشوش تاني"
author = "محمد السيد"
posted = "2006-06-07"
text = "أنا من ساعتها بأغلي ... وحأولع ...<br />أنا قابلتهم امبارح . واتكلمنا شوية .وقعدنا نفتكر ذكريات ال15 يوم اللي قضيتهم معاهم .<br />كانوا بجد من أحلي الأيام اللي الواحد عاشها .... واطمنت علي أحوالهم دلوقتي وكل حاجة ...<br />كان علي وشوشهم أمل بإنهم يمكن يخرجوا النهاردة .... ولو تشوفوا الضحك والتهريج اللي كانوا بيعملوه ....<br />ولا الروح اللي كانوا فيها كانت عالية أوي كمان ...<br />كانوا حاجة تاني خالص ... غبر الوشوش اللي بنشوفها برة ... وكلامهم كان حاجة تاني غير الكلام المملل اللي بنسمعه بره ...<br />ساعتها اتمنيت إني كنت أفضل موجود معاهم ...<br />أحسن من إني أخرج و أسيبهم ...<br />لكن كل ده ...كانوا لازم ياخدوا تجديد ... و15 يوم تاني في سبيل البلد دي ...<br />ماهم ولادها ... ولاد البلد ... دي<br />برضه هم بيقولوا جوة ...<br />لا للتمديد ... لا للتوربث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025309/http://masr.20at.com:80/article.php?sid=476"

