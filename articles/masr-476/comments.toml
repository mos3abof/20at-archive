[[comments]]
order = 4
subject = "امبارح وانا قاعد سرحان"
author = "سعيد"
posted = "2006-06-08"
text = "امبارح كنت سرحان في ملكوت الله وخيلت لي نفسي اني كنت مشترك مع المتظاهرين الاحرار لتايد مطالب القضاه في استقلاللهم من احتلال السلطه لهم وتخيلت ان احد زبانية الداخليه قام بالتحقيق معايا وسالني ما اسمك ج انا اسمي مواطن مصري وتهمتي حب الحق وبغض الظلم والظالم فقال انت عامل فيها مصطفي كامل ج قولت ياريت اني اكون مصطفي كامل بس مصطفي كامل كان بيقاوم محتل اجنبي وانا للاسف بقاوم في ولاد بلدي اللي المفروض انهم مصريين"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025309/http://masr.20at.com:80/article.php?sid=476"

