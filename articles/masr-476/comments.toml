posted = "2006-12-11"
text = "اخى العزيز علاء انا لااعرف انتمائك السياسى ولكن اتمنى ان تكون يسارى مثلى مؤمن بانة لاخلاص لنا من سجن استعباد السلطة الا من خلال ثورة شعبية على الظلم على التخلف على البيروقراطية<br />على التجهيل انت محبوس داخل اسوار السجن<br />تعرف حدودة واسوارة ام نحن فنظل نجهد للخروج من سجن لانعرف لة حدود"
