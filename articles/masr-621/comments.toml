[[comments]]
order = 0
subject = "ولسه بنقول \\\"ضحكنا على البهواد"
author = "ديمة"
posted = "2006-07-08"
text = "الموضوع جميل بجد، تسلم ايدك يااحمد، اول ماقريته افتركت الكام الفارغ اللى بيقولول المطبلاتية ان احنا ضحكنا على اليهود خدنا سينا وحافظنا على حقوق الفلسطينيين نقابل شقة فى الجيزة، مع ان كل تفصيلة محتاجة نبكى عليها سنين من الاتوبيس لطلب تغيير النشيد الوطنى والعلم وطلبهم ايضاً بتسريح كل الضباط اللى خدموا فى 73 ولسه جاى اكتر لأن السادات ومن بعده مبارك واى بائع وسمسار ينطبق عليه المثل العربى اذا كان الغراب دليل قوم مشى بهم الى جيف الكلاب"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124946/http://masr.20at.com:80/article.php?sid=621"

[[comments]]
order = 1
subject = "خليك واقعي"
author = "ابو شريف"
posted = "2006-07-08"
text = "يبدأ السيد أحمد بلال مقالته بمقطع لأغنية ام كلثوم \"إلى فلسطين طريق واحد يمر من فوهة بندقية\"..<br />ومؤكدا بأنها هكذا شدت أم كلثوم وقت أن كان لنا كرامة...<br />واريد ان اسأل السيد احمد بلال عن الوقت الذي كانت لنا كرامة هل قبل النكسه ام بعدها ... هل كرامة المصريين مع هزيمة يونيو 67 ام مع نصر اكتوبر 73 ... واضح ان الاستاذ احمد ناصري جدا لدرجة الغليان الأمر الذي جعله يقرن الكرامه بالهزيمة واود ان اذكر السيد احمد بلال ان انور السادات عندما طرق باب السلام من وجهة نظره فقط استطاع بموجب وجهة نظره هذه ان يسترد سيناء اما عبد الناصر وفي ظل عنجهية المتخلف الذي كان يعيش بها ادخل مصر في حرب وجزء كبير من جيشه في اليمن مما اضاع سيناء واعطي مفتاح القدس رسميا لاسرائيل ... اما قصة اتوبيس 100 ولا مليون حتى لاتفرق مع الشعب المصري الذي يرفض هذا التطبيع من 25 سنة فالأمر لايعدو كونه محاولات مستميته من الجانب الاسرائيلي يقابلها رفض وطني شجاع من الشعب المصري ... ودعني ادعوك لحسابات المنطق يا استاذ احمد ... الم يكن في المفاوضات المبدئية لإتفاقية السلام بند خاص بالجولان وبدولة فلسطين ... الم يرتدي قادة هذه الدول ملابس العنجهية واضاعوا فرصة عودة اراضيهم فماذا كانت النتيجة ... الجولان لم تطلب طوبه واحدة من الشعب السوري لتحريرها وانما كانوا يحاربون اسرائيل من الاراضي اللبنانية أما فلسطين فحدث ولاحرج وصل الأمر برئيس السلطة الفلسطينية ان يستجدى السماح له بالجلوس علي طاولة مفاوضات مدريد ولم يسمح له وبالكاد سمحوا لحنان عشراوي بالجلوس بدلا منه ... ياريت نكون واقعيين اكثر ونحسبها بما يخدم مصر والمصريين"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124946/http://masr.20at.com:80/article.php?sid=621"

[[comments]]
order = 2
subject = "التطبيع مش أتوبيس"
author = "التطبيع مش بأتوبيس ولا غيره إحنا لو نظرنا لإنجازات اللامبارك هنلاقى إن ما فعله لإسرائيل أكثر بكثير من اللى عمله لمصر بمعنى:"
posted = "2006-07-08"
text = "1. تصدير الغاز الطبيعى لإسرائيل بخط مفتوح تحت قناة السويس بلا حساب<br />2. الإفراج عن عزام عزام الجاسوس الإسرائيلى<br />3. تصدير الحديد والإسمنت لإسرائيل لبناء الجدار العازل<br />4. تأمين إسرائيل بالقضاء على الإتحادات الطلابية ومنع المظاهرات والأراء المعارضة فى مصر<br />5. السماح لإسرائيل بإقامة مزرعة فى سيناء<br />6. السماح لإسرائيل بدفن نفاياتها الذرية فى سيناء<br />7. التسويف فى الأمور للقضية الفلسطينية والضغط على القادة الفلسطينيين للإعتراف بإسرائيل وغير كده كثير يبقى بقى مش الأتوبيس إللى ها يعمل التطبيع ولا منع الأتوبيس ها يبقى محافظة على عدم التطبيع لو كنا عايزين نمنع التطبيع لازم نقضى على سبب التطبيع ونطهر مصر منه"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124946/http://masr.20at.com:80/article.php?sid=621"

[[comments]]
order = 3
subject = "لأبو شريف الصهيوني"
author = "محب للسلام"
posted = "2006-07-08"
text = "أخونا أبو زيف ده له تعليق طريف يدل على حبه لمصر كاتبه في\"مبارك.. وتصحيح آلاء\" راح أنسخه زي ماهو هناك:<br />أرسل هذا التعليق بواسطة : أبو شريف المصري<br />المرحوم مناحيم بيجن والمرحوم السادات والمرحوم رابين وسيادة الرئيس حسني مبارك وأستاذتي عبد العظيم رمضان وأنيس منصور وبطرس غالي وعبد الستار الطويلة والشيخ الطنطاوي والبابا شنودة ورؤساء تحرير الصحف القومية بالإضافة للدكتور مصطفى خليل وإخوات شهيد السلام الرئيس السادات دول وحدهم اللي تعلمت أحترمهم وأجلهم، لشجاعتهم وإيمانهم بالسلام وكراهية الإرهاب والحروب.<br />كفاية الخداع اللي عشناه في أيام ناصر والحروب اللي خسرناها والفقر اللي تجرعناه، عبد الناصر علشان يبقى زعيم كان لازم يجد له عدو، ووجد ضحيته في اليهود الغلابة، ولو قدر عليهم كان عمل لهم محرقة زي النازيين، هو مش كان عايز يرميهم في البحر؟<br />اليهود أقرب لينا كمصريين من العرب، وهما اللي بنوا لينا الأهرامات وألأثار اللي بنفتخر بيها، وده إعترف بيه المرحوم السادات أمام المرحوم بيجن، لما بيجن قال:\" أجدادنا بنوا الأهرام\" فتبسم السادات وقال: آمين. دي هي الشجاعة الأدبية، سيادة الرئيس مبارك تلميذ السادات الوفي والأمين على مبادئه الوطنية، ومصر بخير طالما حافظنا على خط السادات.<br />عاش الحزب الوطني، عاش الرئيس مبارك، عاش أنصار السلام، الموت للإرهابيين."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124946/http://masr.20at.com:80/article.php?sid=621"

[[comments]]
order = 4
subject = "يلعنك يا بو......"
author = "لعنة الله عليك يابو زفت..اليهود بنوا الأهرامات؟ السادات إعترف بكده؟ وأما يعترف مين هو؟"
posted = "2006-07-08"
text = "هو ده مبادئ الحزن الغير وطني، ملعون أبوك والسادات ومبارك وكل الخونة...عشنا وشفنا واحد بيدعي إنه مصري وبيقول كده، إجري يامناخيم جتك داهية تلمك زي السادات ..الكفر ملة واحده."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124946/http://masr.20at.com:80/article.php?sid=621"

[[comments]]
