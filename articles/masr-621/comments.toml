[[comments]]
order = 6
subject = "مش فاهم ... إسأل"
author = "ابو شريف"
posted = "2006-07-09"
text = "السادة الأفاضل اللي شتموا وسبوا ولعنوا وبإذن الله تعالي اللعنة سوف تصيب الظالم أي كان ... انا كل اللي قصدته في ردي هو ان الشعب المصري رافض للتطبيع فبصرف النظر فيه اتوبيس او مافيش برضه الشعب المصري رافض لهذا التطبيع ... وبرضه وبنفس منهج عنجهية المتخلف يتم الرد بدون قراءة الكلام ... ولن ادعو سوى بأني أحمد الله العلي القدير أن عافاني مما ابتلى به غيري"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124946/http://masr.20at.com:80/article.php?sid=621"

[[comments]]
order = 7
subject = "قال بيشرح مناخيم سبانخ"
author = "الخونة اللي موديل أخينا أبو شريف مناحيم ده، بيسموا حالهم ليبراليين وفي وجة نظرهم الخيانة مجرد وجة نظر، والإنبطاح واقعية والمقاومة عنجهية وغرور وتهور والإستجداء هو السبيل الأمثل للحصول على الحقوق المسلوبة."
posted = "2006-07-09"
text = "السيد مناحيم نسي يقولنا جرينا في طريق السادات الملعون الكافر وصلنا لأيه؟ وإيه اللي إستفدناه مع معاهدة الإستسلام مع أهله في الكيان الصهيوني؟ حيقول سيناء رجعت وقناة السويس و...و...و..<br />طب يا أستاذ سبانخ لو كان ده صحيح والسلام هو الأمثل ليه مصر في السلام ده حالها تنيل قوي وبقت مديونة بأكثر من800 مليار دولار؟ أتمنى تعرف مليار يعني إيه. ليه مافيش صناعة ولازراعة ولابحث علمي ولا حتى رياضة ولا كورة زي الناس وإنت أحسن مفتي في الأهلي والزمالك؟ إنما تتكلم سياسة وإقتصاد وعسكرية يبقى بعينك، مفيش مانع إنك تنافق أهلك الصهيانة، محدش فاضي ليك منسمع الريس وبطانته أفضل، والأصل أفضل من تقليد التقليد يا كوردية سبانخ."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124946/http://masr.20at.com:80/article.php?sid=621"

[[comments]]
order = 8
subject = "شماعة التخلف"
author = "مصري موجوع"
posted = "2006-07-11"
text = "من الممكن ان لاتفهم مايجري حولك ... ولكن ان تدعي انك فاهم لما يدور حولك وأثناء قيامك بالتأكيد علي فهم تثبت إنك حمار هذا ما اكتشفته من الباشا سبانخ اللي بيتهم الاخ ابو شريف بالهودنه ... وانا اسأل المعلم سبانخ وهل اتفاقية عودة سيناء هي اللي منعت التعليم والصناعة والمنتخب مايروحش كاس العالم يامتخلف انت اللي عايز يشتغل وينتج ح ينتج ويشتغل ... العربي اصبح يصنع أجهزة الكترونية مثل الياباني واحمد بهجت غير توكيلات السيارات الموجود تصنيع اجزاء كبير منها في مصر ... انا لا أدافع عن سياسة الحكومة ولكني مقتنع ان معاهدة السلام صحيحة ولكن تطبيقها بعد ذلك اصاب الناس بالوهن والضعف وبعدين سوريا تركت الجولان ولم تقم باتفاقية ولا شئ ماذا فعلوا الأسد الكبير مات حكمهم ابنه الصغير ومافيش فرق الإثنين اسود ولاد اسود ياحبيبي سيبك بقى من كلام نكسة 67 وماقبلها من وعود العسكر اللي ودونا كلنا في داهية بنفس عنجهية المتخلف اللي انت متبنيها حاليا وحاول مرة واحدة تفهم صح ... صدقني ح تلاقيها حاجة حلوة ولو صعبة عليك الفهم اسكت واتعلم ..."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124946/http://masr.20at.com:80/article.php?sid=621"

[[comments]]
order = 9
subject = "لأبوشريف الموجوع من بتاع الحمار"
author = "ياخواجة بطيخ ربنا يخف وجع مؤخرتك من بتاع الحمار اللي فيها ليل نهار..يمكن تقدر تتكلم زي البني آدمين يا صهيوني يابو زفت."
posted = "2006-07-11"
text = "معاهدة الإستسلام ياحيوان هي أس البلاء بلاش نهيق وسيناء يابن الشرموطة ماهياش تحت سيطرتنا وبترولها بيتباع لإسرائيل وطياراتهم ودبابتهم وقودها مصري طبعا كيهودي صهيوني يفرحك ده قوي وقاعد شمتان ياحلوف.<br />إنهي صناعة يابن العالمة غير صاجات أمك؟ بتستهبل حضرتك عالم بتوع إفتكاسات شراميط,"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124946/http://masr.20at.com:80/article.php?sid=621"

[[comments]]
order = 10
subject = "للشريف مناخيم أبو شريف المبهوق"
author = "هامان"
posted = "2006-07-12"
text = "أخونا الصهيوني مناخيم قطران مشرشر مش بس أهبل لا ده سايق يستهبل كمان..إسمع الكلام ده لأول مرة ومش حتسمعه من غيري: في الأصل عبد الناصر ماكانش عايز يرتبط بقضية فلسطين...هو أجبر على ذلك..لأن بن جوريون أزعجه محاولات ناصر بناء إفتصاد قوي وجيش حديث. لذلك كان غارة سنة خمسة وخمسين أولا على غزة، عبد الناصر واللي معاه كانوا عايزين سلاح من أمريكا وعرض عليهم نفس الشروط اللي دلوقتي ورفضوها لأنها تعني التبعية اللي عايشنها إحنا دلوقتي. ولذلك كان الإتجاه للكتلة الشرقية، بقاء إسرائيل وأمنها قضية مركزية في سياسة أمريكا. وإسرائيل يهمها جدا إنها تزعزع إقتصاد الدول المحيطة بيها، وإنت شايف بنفسك حال البلد..رجالها ماسكين كل مفاصل الدولة..وكل شئ في تدهور..ماعدا الفساد والنهب..تقدر تقولي على حرامي كبير واحد في البلد مش مرتبط للنخاع بإسرائيل؟ لن يسمح لمصر أبدا بأن تستعيد عافيتها..إفهم ولا إنت حر ومن السادات للوقتي ديونا بقت 800 مليار دولار؟ ولوحسبتها تلاقيها ثروة عشرة فقط من حيثان الإنفتاح بدون حساب الريس وأنجاله. يبقى ظلم ترمى البلاء على كسل الشعب، فهمت؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124946/http://masr.20at.com:80/article.php?sid=621"

[[comments]]
order = 11
subject = "شالوم صديقي أبو شريف"
author = "جلعاد شمويل"
posted = "2006-07-12"
text = "أبو شريف إنتي راجل كثير عظيم وفاهمة سياسة وحبيب سلام أني معاكي متفق إنه مصري وإسرائيلي بنوا حضارات وأهرام من أقدم عصور سوا. كمان زي إنتي بيقول إسرائيل أرض توراة لشعب إسرائيل. فلسطيني مشكلة لمصري وإسرائيلي لاكن تعاون كبير هناك بين حكومة إسرائيل ورئيس مبارك لحرب إرهاب مخربين فلسطيني. إسرائيل تحب مبارك جدن وقبل السادات موت السادات كبير خسارة لإسرائيل والسلام لذلك إسرائيل أصر على إعدام قاتل سادات إسلامبولي ملعون. إسرائيل وفي لأصدقائه وأنت صديق إسرائيل ترحيب حار تفضل بزيارة قريبا لأجل نشر سلام ومحبة."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124946/http://masr.20at.com:80/article.php?sid=621"
