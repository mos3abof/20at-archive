subject = "اللهم أهلك أبو شريف وأخزه وأذله"
author = "لعنك الله يابو شريف الى يوم يبعثون وأصلاك سقر، ندعو عليك وعلى أمثالك الكفار أتباع الكافر السادات بدعاء نوح عليه السلام:\""
posted = "2006-07-09"
text = "رب لا تذر على الأرض من الكافرين ديارا انك ان تذرهم يضلوا عبادك ولا يلدوا إلا فاجرا كفارا\""
archived = "2006-07-19"
