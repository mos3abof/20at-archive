author = "يا حمار"
posted = "2010-01-27"
text = "معلش مع احترامي لك بانك رئيس جمهورية بس حمار وكشفت نفسك<br />يعني انت قلت العبارة التالية<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />مؤكداً أن مصر ستشهد هذا العام انتخابات برلمانية حرة ونزيهة تأتى للبرلمان بتشكيل جديد يعكس إرادة الناخبين،<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />لما تقول ان مصر ستشهد هذا العام انتخابات برلمانية حرة ونزيهه<br />يعني بتعترف ضمنيا ان الانتخابات السابقة كان فيها تزوير<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــــ<br />ولما قلت انها ستأتي بتشكيل جديد يعكس ارادة الناخبين<br />يعني بتعترف ضمنيا انك حتضرب الاخوان في هذه الانتخابات<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />لازم حد يراجع خطبك قبل ما تقولها"
