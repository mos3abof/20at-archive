text = "الاسلام حجة عتي الجميع و كل يؤخذ من كلامه ويترك الا النبي صلي الله عليه وسلم وجميع دعاة الحق كل عتي باب من ابواب الخير .<br />ولا يجوز التطاول على احدهم بغير حجه<br />ومع اننى قد اختلف مع الداعيه عمرو خالد او حتى مع فضيله الشيخ الشعراوى الا اننى اكن لهم كل الاحترام ...... مع شكرى"
