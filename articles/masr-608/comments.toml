[[comments]]
order = 6
subject = "شبعنا من علماء الدولار واليورو"
author = "كاره النفاق"
posted = "2006-07-05"
text = "عمرو خالد نصاب ومنتحل لصفة عالم الدين، وماحصلش إنه درس لا في الأزهر ولا في أي جامعة إسلامية، يبقى إزاي يحق ليه الفتوى؟<br />الكاتب بيقفز على الحقائق وبتعامى عن السرد التاريخي للأحداث فيما يتعلق بمتولي الشعراوي. الشعراوي كان طول عمره متعلق بزخرف الدنيا وبيحب التمسح بأصحاب السلطان، وكان لايتردد في نقل ولاءه حسب ماتقتضي مصلحته، كلنا سمعنا عن حكاية صلاة الشكر بتاعة هزيمة يونيو سبعة وستين، وألف واحد فسرها لصالح الشعراوي وتفسيرها الحقيقي أبسط من البسيط وهو إنه أراد يبسط الملك فيصل اللي كان بيكره عبد الناصر عمى وقتها. لكن شاء الله إن الملك فيصل يهتدي ويحسن إسلامه بعد هزيمة سبعة وستين، وأبعد الشعراوي الي مصر.<br />غير هام مدى قدرة الشعراوي على تفسير القرآن الكريم ده يقدر عليه كثيرين جدا، إنما في حياته لم يكن قدوة ولم يترك منافقة الحكام أبدا حتى هلك، وحسابه على الله وحده."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

[[comments]]
order = 7
subject = "بعد الشر عليك يا غالى"
author = "طارق الجوهري"
posted = "2006-07-05"
text = "بعد الشر عليك ..حضرتك تتحب فعلاً يا أستاذى لأنك أفادتنى كتيير جداً وببساطة بجد طريقة كلامك وشرحك فى الدروس ممتازة ممتازة بتدخل جوا قلبنا ... ربنا يوفقك ويحميك يا عمرو يا غالى ... وتأكد دائما ان وراء كل رجل ناجح أعداء ... ربنا يعطيك كمان وكمان يا عمرو يا اللى لقينا فيك الأمان ... ومعظم الشيوخ الأفاضل بيتحاورون ويتناقدون على أ. عمرو خالد وللأسف الشديد يرون أن عمرو خالد قائم بنتائج هائلة ويحاولون ان يهبطوا صورتة امام العالم العربى ... بنحبك يا عمرو"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

[[comments]]
order = 8
subject = "الى تعليق مهم جدا"
author = "هدى/العراق"
posted = "2006-07-05"
text = "انا قرات كتابتك كلها واعرفت السبب لانه غير ملتحي واعرف انها سنة مؤكدة وهناك اكثر من داعية بهذا الشكل.<br />أما بالنسبة للغير محجات اتي يجلسنا في القاعة اقول ربما يهدي الله التي جالسة في القاعة بالحظة والدقيقة لان الله يهدي من يشاء بغير حساب فلماذا نعترض لهذا الشيء<br />واقولان الشيخ قد دخل في قلوب الشعوب من خلال دعوته .شكرا هدى"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

[[comments]]
