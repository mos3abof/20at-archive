order = 0
subject = "لـــكـــل جـــواد كـــبـــوه"
author = "عمرو خالد داعيه له ثقله و هذا أمر مفروغ منه"
posted = "2006-07-04"
text = "و لكنها سقطه منه ان يستغل بواسطه شخص لن يجد ما يسىء فى ان يعرض لحمه و لحم اسرته فى سوق النخاسه ما دام سوف يجنى من وراء ذلك المال<br />ارجو من الداعيه المتميز عمرو خالد ان يعيد حساباته<br />و يكفى ان ذلك الشىء المسمى لا شيخ و لا صالح و لا كامل انه سب ملايين المصريين الفقراء الذين رفضوا احتكاره للهواء و ما يحمله من موجات ايا كان مصدرها<br />أأأأأأأأأأأأأأأأأه يــــا بـــــلــــدى"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

