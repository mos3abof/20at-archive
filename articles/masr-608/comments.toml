subject = "يا نهار اسود"
author = "واحد يعرف ربنا كويس"
posted = "2006-07-10"
text = "بقي الوصلة حرام والاحتكار مش حرام<br />اتقوا الله يا بشر<br />الغلابة يستاهلوا من عمنا وشيخنا عمرو خالد اكتر من كدة<br />ولا فلوس الشيخ صالح اتكلمت يا شيخ عمرو<br />وعلي العموم بسم الله وبالصلاة علي رسول الله وبالرجوع لما آتاني الله من علم وفقه احمده عليهما<br />استعين بالله وأفتي بان الوصلة ليست حرام الا في حالة القنوات المشفرة المبتذلة واللا أخلاقية والتي تحض علي الرذيلة وأسأل الله العفو والسماح والله أعلم"
