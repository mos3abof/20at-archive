subject = "كل من بنتقده اقل منه"
author = "محمد الشيخ"
posted = "2006-07-04"
text = "باختصار .. عمرو خالد داعبة جليل وكل من يفكر فب نقضه او التطاول عليه علبه ان يدرك اولا ماذا فعل هذا الرجل من انجازات لم يفعله اقرانه ممن تسول لهم لنفسهم نقده بتجريح واهانه .. لقد صنع فكرا جدبدا للشباب نحو الأخلاق والعبادات والتاريخ الديني -سلاسله الدينية- ومشروعاته القومية ايضا وابرزها صناع الحياة بفروعها .. الله أكبر على هذا الرجل وعلى من في ايديهم السلطة والمال ان يتقوا الله في علماء ودعاة المسلمين .. وليبتعد عن السياسة والمال .. فكلاهما سيأتيان الى من يرفضهما طائعين كما كان لغيره امثال شخنا الجليل الشعراوي .."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

