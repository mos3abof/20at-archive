posted = "2006-07-11"
text = "إستغفر الله يابو محمد النساء ناقصات عقل ودين..بلاش حكاية الطلاق دي يمكن ربنا بعد كده يبتليك باللي أوحش منها وإنت ياست أم محمد إختشي وبطلي معاكسة في جوزك الغلبان حرام عليكي."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

[[comments]]
order = 24
subject = "ارحمونا"
author = "عمرو"
posted = "2006-07-11"
text = "انة رجل بزنس فى المقام الأول واسألوة لماذا طرد من النادى الأهلى وصتة الذى يشبة النساء فرق كبير بينة وبين الشيخ متولى الشعراوى انة يعيش فى شقة فاخرة بلندن انة يأخذ اموال التبرعات لنفسة ويعطى القليل للمحتاجين انة رجل اعلانات وليس كمثل الشيوخ انة يستأجر فى برامجة شباب وشبات ويدفع لهم كى يبكوا ويحاولوا البكاء راقبوهم جيدا انها الدموع مقابل المال حرام عليكم تشبية راجل بزنس برجل دين"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

[[comments]]
order = 25
subject = "إيه تعريف سموك للإسلام الأمريكاني؟"
author = "مسلم بن مؤمن"
posted = "2006-07-11"
text = "ياريت الكاتب العبقري لو يشرح لينا عبارته البليغة \"بل ربما تكتشف أنك كنت من محبي من يروج إلى \"الإسلام الأمريكاني\" !\" .<br />وإيه الفارق بينه وبين اللي بيدعو اليه عمرو والطنطاوي وشيوخ الخليج والسعودية والسستاني بتاع الشيعة؟ من الثمار تعرف الأشجار يا مولانا، الأمريكان وإسرائيل وحتى البوذين ماعندهمش مانع إنا كلنا نصلي ونصوم ونعتكف في المساجد، طالما كان هذا كل الإسلام، الإسلام أكبر من كده بكتير ده دين ونظام حياه ودولة، وده اللي عايزين يلغوه من عقلية المسلمين، سؤالي مرة تانية\"هل عمرو خالد مؤهل للقيام بتوعية المسلمين بحقيقة الإسلام كما أراده الله؟ أو هو وكيل أمريكي سواء برضاه أو غصب عنه؟"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

[[comments]]
order = 26
subject = "يااااااااااااااااااااااااااااااااااه"
author = "باتستوتا"
posted = "2006-07-11"
text = "ايه يا جماعه افصلوا كلام شويه ارحموا نفسكم .<br />كلام عن عمرو خالد والشيخ الشعراوى سباب بصورة تسئ الى الاسلام فلو قرأ غير مسلم التعليقات فسيقول انظروا الى المسلمين ماذا يفعلون ؟<br />عندما يخطئ عمرو لا يجوز ان نسبه فهذا مهما كان مسلم انا لا أؤيد عمرو خالد ولكن السباب ليس وسيلة للاقناع .<br />ثم الحديث عن عمرو خالد ما دخل الشيخ الشعراوى فى ذلك هل يجب ان نخلط الامور ونعمل خلطة ونقعد نغنى يا مسلمين اتقوا الله والله هذه غيبة ونمبمة وحسابكم عند الله وكل انسان حسابه عند الله ولست انت الله يا ايها الملقب بكاره النفاق"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

[[comments]]
order = 27
subject = "صدق الله فصدقه الناس و جعل فيه القبول"
author = "إسلام"
posted = "2006-07-11"
text = "صدق الله فصدقه الناس و جعل الله فيه القبول من الناس و جعله سبباً في هداية كثير من الناس وصدق رسول الله صلى الله عليه وسلم عندما قال لعلى بن أبي طال رضي الله عنه:\"لإن يهدي الله بك رجلاً واحداً خير لك من حمر النعم\" حقاً صدق الصادق المصدوق فهذا خير ممعين لك يا استاذ عمرو فأنت من أمامنا و نحن من خلفك و الله معنا جميعاً"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

[[comments]]
order = 28
subject = "لنقل ما نعلم خير لنا وأجدى"
author = "علي حرحش"
posted = "2006-07-13"
text = "فقه السيدات الفضلات إسلام والمحروشة باتستوتا أشد علينا من ضلال وجهل عمرو فاسد، إيه يا نسوان من إمتى يحق للحريم الإفتاء؟<br />هل لدى أي حرمة منكن التميز بين العالم وغير العالم، هذا إفتاء بغير علم وتشجيع للباطل وإثم كبير.<br />مثل عمرو فاسد كمثل الفيشاوي لولا أن هتك الله ستره بجريمة الزنا لظل للآن بنظر أشباه الحيوانات من العامة داعية الإسلام الهادي الأوحد. لنضع مخافة الله أمام أعيننا ولا ندخل النار بدفاع عن أهل البدع والضلال.<br />لعن الله السادات وكل من رضي عن السادات وقال فيه قولا حسنا، والله لايحب الكافر السادات من كان بقلبه ذرة من إيمان."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

[[comments]]
order = 29
subject = "يامن كتبت هاذا العنوان"
author = "امال"
posted = "2006-07-18"
text = "يامن كتبت هاذا العنوان واثرتهسامحك الله وهداك نقول لك ان كان البعض اصحاب نهضة فأنت صاحب ماذا ان كنت ستجاوب عن هذا السؤال الأمه بخير والى كل م}يد ومعارض نقول لهم لماذا نخوض في اعراض الناس هل تعاملتو معهم من الناحيهالماديه،هل سافرتوا معهم،ام صاهرتوهم،لماذا تهون عليكم انفسكم هكذا ،علموا انفسكم ان تمتلكوها ولا تكونو كطائر ينعق وسط السماء"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

[[comments]]
