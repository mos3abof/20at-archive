posted = "2006-07-05"
text = "الى كاره النفاق اتقى الله فى كلامك مش احنا اللى حنقول رئينا فى الشيخ الشعراوى ولا الاستاذعمر خالد العالم قال رئيه والشخ الشعراوى فى دار الحق اما الاستاذ عمر لاقال انه مفتى ولا قال انه خريج الازهر. وبعيدا عن الاحتكار. الوصله حرام وفكروا فيها بدون تعصب"
