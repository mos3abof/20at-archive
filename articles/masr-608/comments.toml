subject = "افهم يمسلم"
author = "مدحت"
posted = "2006-07-19"
text = "كل من لا ينقل الاسلام بشرطه و شروطه فهو يتظاهر بالاسلام و عمرو خالد اظهر بعض حقائق الاسلام و اخفى الكثير عن عمد او غير عمد كأن يكون للجهل منه بالامر ومن اراد الاسلام بجميع حذافيره فليطرق ابواب العلم المتمثل بمحمد وال محمد"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"
