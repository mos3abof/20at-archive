posted = "2006-07-10"
text = "من اهم وابرز الشخصيات الى ظهرت في العصر دة عمرو خالد حرام عليكو دة هو السبب في هداية شباب كتيرة اوي بسبب بساطة وفهمة لعقلية الشباب وفهمة كمان لدينة انا وكل صحابي من الشباب ظهور عمر خالد هو نقطة تحول في حياتنا اما موضوع الشيخ صالح فدة فعلا حرام وعمر خالد ما جملش حد اقال الي سوف يسال عنة عند ربة ومش عمر خالد الي يقال علية كدة اللة يسامحكم"
