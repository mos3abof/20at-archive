[[comments]]
order = 12
subject = "هيهات ما تنزل الملائكة بدعاء وحده."
author = "كاره النفاق"
posted = "2006-07-06"
text = "عجبا أهل الجاهلية كانوا أشد حمية وأنفة وكرها للضيم من قوم يدعون الإسلام يقطنون وادي النيل، وقد كان حالهم:<br />متى تملك القلب الذكي وصارما***وأنفاً حمياً تجتنبك المظالمُ<br />لاتنصر السماء إلا من عجز عجزا بينا وكان من القعدة والزمنى، فهل نحن هذا؟ لا وحق نبيه المصطفى، بل بأجسام البغال وأحلام العصافير وقلوب الطير، لانستأسد إلا على الضعيف منا، وصدق عمر بن الحطيم:<br />أسد علي وفي الحروب نعامة *** فتخاء تسعى من صفير الصافر<br />هلا برزت الى غزالة في الوغى****بل كان قلبك في جناحى طائر<br />خبروني يا صناديد العرب إن كان خوفكم ورعبكم من خنزير المنوفية المنزوع الأنياب كذا، ما أنتم فاعلون لو كتب عليكم قتال اليهود والأمريكان كما يفعل أسود فلسطين والعراق؟<br />مافيكم من الرجولة درهما، أف لكم، متى تنزل كسفا من السماء تمحق هذا الشعب إلا من آمن منه.<br />إن كان السفيه عمرو خالد أو غيره يوقظ فيكم روح الأنفة والكرامة فمرحى به، وإن كان يخدركم ويزيد من خنوعكم فويل له، أعمى يقود عميانا، وخصى يحرض على الفحولة خصيانا.<br />أعلم أنه ونظام اللامبارك على أتم وئام، وجازت عليكم حيل اللئام، ولا غرو أن يجوز منبوذ الكلام على معشر الطغام. لو علمت لكم جلدا لحملت بكم على عدوكم المنوفي المخناث، ولكني أعلم أنكم جمع من الإناث، وأقسم بالله ثلاثا بعد ثلاث. لاتميزون عالمها من جاهلها، فماذا أصنع بكم؟"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

