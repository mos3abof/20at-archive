[[comments]]
order = 10
subject = "أهلا يا نادية"
author = "كاره النفاق"
posted = "2006-07-05"
text = "ياأخت نادية كون الوصلة حرام ده أمر مفروغ منه، يعد كسرقة التيار الكهربائي أو المية من مرافق البلدية. أو ركوب المرافق العامة بالتزويغ، أي شئ يتم الحصول عليه بدون رضا المالك الأصلي يعد في الدين سرقة بغض النظر عن تقوى أو دين أو جنسية هذا المالك، يعني سرقة الكتابي الغير محارب حرام كسرقة المسلم.<br />أنا مش مع أي إنسان يقرا له كم كتاب وهوب ينزل فتوى في الدين ويسهل ده ويصعب ده لإرضاء الناس. الإمام مالك رضي الله عنه سألوه عن إتنين وعشرين مسألة في الفقه، فأجاب عن مسألتين بس، وقال عن الباقي لا أدري، وإن كان الإمام مالك لايدري فمن يدري؟ فاهمة قصدي؟<br />لابد من دراسة العلم على أصولة، وإن كان عمرو لايحسن لغة القرآن، معقول يفهمه ويفتي فيه؟ بالنسبة للشعراوي أنا لا أشك فيما أقول، ومش رجل بسيط حتى ألقي الكلام على عواهنه، وبأخاف ربنا وحده."
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720131125/http://masr.20at.com:80/article.php?sid=608"

