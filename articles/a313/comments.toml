[[comments]]
order = 3
subject = "كاتب الموضوع: تم انتقاص حقوقي الأدبية"
text = "ورد في مقدمة الموضوع أنه عبارة عن \" استماع للأستاذ الزميل خالد محمد علي\" ، أي أن دوري هو التلقي السلبي لكلام الأستاذ خالد،أو تسجيل حديثه على شريط .. وقمت بتفريغه، وهو مالم يحدث مطلقا ، ذلك أن الموضوع حوار صحفي طرحت فيه عشرات الأسئلة، ولم يكن من الممكن كتابة الموضع في شكل حوار لما في ذلك من ملل ورتابة وقطع لأفكار القاريء، على سبيل المثال سألته عن طريقة سفره للجنوب، فأجاب بالطائرة ، عدت للسؤال عن حال الطائرة ومطار جوبا، ثم سألته عن وجود السكك الحديدية فأجاب بأنها لاتعمل، فسألته عن السبب، فأجاب بسبب ظروف الحرب تخلعت القضبان، فعدت للسؤال عن الطرق البرية، فأجاب هناك طريق واحد هو طريق السلام، فسألته عن حالته من حيث الرصف أو التعبيد ، فأجاب معبد، فعدت أسأله عن إمكانية السفر من خلاله وإمكانية ذلك .<br />وكما يرى القاريء فإن كتابة الأسئلة وهي التي توضح دوري ومجهودي، كان سيؤدي إلى الضرر بالموضوع، فوجدت حذف الأسئلة وكتابة الحوار على شكل الحكي والسرد.<br />أحب أن أوضح أيضا بأن الموضوع الواحد جاء متناثرا في الحوار ، وتم جمع شتات كل موضوع مثل الأوضاع الدينية وغيرها، فضلا عن أن الحوار جاء بالعامية وتم نقله للفصحى، واعتمد على كتابة الملاحظات والابتعاد عن التسجيل. وبكلمات أوضح تم إعادة كتابة الموضوع وبنائه من جديد كي يخرج للقاريء في صورة جميلة أرجو أن تكون نالت إعجاب القاريء، فهو القاضي الوحيد<br />لذلك رأيت أن أنوه عن حقي الأدبي، بحيث لا يدفعني الخجل عن الامتناع عن ذكر حقي<br />صابر مشهور<br />محرر الموضوع"
archived = "2004-09-27"
capture_url = "https://web.archive.org/web/20040927000337/http://www.20at.com:80/article.php?sid=313"
