posted = "2009-09-03"
text = "يعنى اية توعية بالختان<br />طول عمرنا كمصريين من ايام الفراعنة واحنا بنعمل الختان ومحدش قال حاجة<br />انا لن اقبل ان اتزوج واحدة غير مختنة<br />ولن ارضى لابنى ان يتزوج واحدة غير مختنة<br />الختان طهارة وتجميل للعضو الجنسى ويمنع تكون روائح كريهة تنبعث منة اذا لم يكن مختن<br />اية القرف دة<br />شوية الخواجات اللى بيخططوا لبناتنا يروحوا فى ستين داهية<br />بدون الختان يكون العضو منتن وعايز غسيل عشرين مرة فى اليوم كى تمنع هذة الرائحة النفاذة القذرة"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906000706/http://www.20at.com:80/masr/t7kyk/13168-2009-09-03-08-56-41.html"

