posted = "2009-09-09"
text = "واضح اصلا ان الأستاذ غير متزوج وبيقعد علي باب بيتهم يسمع كلام ناس ضعيفة<br />الختان ياأستاذ يمنع منعا كليا استمتاع المراة بالجنس ياراجل ياطيب<br />وفي حال عدم استمتاعها تبتدي ترفض الموضوع كله . يعني لما ربنا يكرمك كدة وتتزوج تلاقي نفسك بتتعامل جنسيا مع المخدة لابتحس بيك ولا تتجاوب معاك وكارهاك جدا .تخيل كده ان بتقبل واحدة مش عاوزاك تقرب منها .فما بالك بانك عاوز اكتر من القبلة<br />الحياة مشاركة والزواج تفاهم وعلاقة جنسية واشياء اخري مهمة ايضا . ونجاح العلاقة الجنسية من نجاح الزواج . هل تعلم ياسيدي الفاضل ان اكثر من 90% من حالات الطلاق بسبب العلاقة الجنسية ( دي ابحاث المركز القومي للخدمات الاجتماعية ) مش من عندي<br />الراجل الضعيف هو من يسعي لاهدار حق المراة في الاستمتاع بالحياة وكبتها وكبت مشاعرها واحساسها<br />لا علاقة نهائيا بتربية البنت او شهوتها ( الشهوة تاتي من العقل وليس من العضو الجنسي )<br />لكن معلوماتك المغلوطة محتاجة تصحيح صحح معلوماتك وتعالي قول رايك"
archived = "2009-11-10"
