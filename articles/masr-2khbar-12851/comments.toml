author = "مصر هتعدى"
posted = "2009-08-05"
text = "طالما فية شباب فى الجيل القادم زى عبد اللة احمد بظاظو يبقى فية امل<br />يبقى الحق هيرجع واللى انباع للاجانب هنرجع نمصرة تانى<br />طالما فية شباب بالنوعية دى يبقى الحرامية هيهربوا قريبا<br />تبقى مصر هتعدى دور انفلونزا الخنازير اللى صايبها من 30 سنة"
archived = "2009-08-06"
capture_url = "https://web.archive.org/web/20090806193648/http://www.20at.com:80/masr/2khbar/12851-2009-08-05-07-43-35.html"

