author = "مسحوق غسيل اسرائيلى"
posted = "2009-08-05"
text = "مسحوق غسيل اسرائيل يغسل اكثر نظافة<br />باعوا البلد<br />وخلوها شوية شركات متعددة الجنسية تتاجر فى الاسمنت والحديد<br />وبياخدوا اسرائيل بالاحضان فى شرم الشيخ واسرائيل بتبنى سدود فى اثيوبيا لمنع النيل عن مصر وخنقها<br />يلعن ابوهم من ساسهم لراسهم ولاد كلب باعوا البلد<br />الطالب فاض بة قال لهم بصريح العبارة انتم ولاد كلب عملاء<br />نظيف نفسة معاة جنسية كندية يعنى باع جنسيتة بدرى"
archived = "2009-08-06"
capture_url = "https://web.archive.org/web/20090806193648/http://www.20at.com:80/masr/2khbar/12851-2009-08-05-07-43-35.html"
