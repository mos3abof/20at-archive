author = "هريدى الصعيدى"
posted = "2009-06-24"
text = "يابوى التقرير مكتوب لمين - ومين اللى هيقرأة - وبعد ما يقراة هيعمل اية<br />كلهم معتوهين يختارون بعضهم بعضا لنصل الى تلك النتائج الكارثية بعد حكم 30 سنة<br />لا زواج ولا عمل<br />يعنى حكم بالاعدام على الشعب المصرى<br />والشوية المعونات الامريكية والاروبية والعربية بنعمل بها شوية مجارى وخطوط مياة<br />انما البلد ماتت من زمان<br />ولا عزاء الا فى الفساجى"
archived = "2009-06-26"
capture_url = "https://web.archive.org/web/20090626022601/http://www.20at.com:80/masr/2khbar/12457-2009-06-24-10-09-43.html"

