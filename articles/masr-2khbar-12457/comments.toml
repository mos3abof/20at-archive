[[comments]]
order = 2
subject = ""
author = "مفيش شغل ولا جواز"
posted = "2009-06-24"
text = "التقرير حكومى وطبعا بيتجمل - انا عايز واحد يدخل اى بيت اى شقة فى اى حى او مدينة او قرية ويشوف على الطبيعة كم شاب وشابة عاطل عن العمل وقاعد مع ابوة وكم بنت بدون زواج<br />هيصدم فعلا<br />اكتر من 80 % من الشباب عاطل عن العمل والبنات بدون زواج واسعار ارخص شقة سواء تمليك او ايجار وصلت الى الاف لا يقدر عليها احد<br />لا فية قطاع خاص ولا فية قطاع عام ولا فية اى حاجة خالص<br />وولاد الكلب قاعدين وملزوقين فى الكراسى بغراء اصلى وعزرائيل مش عايز ياخدهم<br />البلد عايشة على شوية الناس اللى بتشتغل برة<br />انما الوضع كارثى وهينفجر هينفجر<br />وحوادث القتل هتزيد<br />والتحرش الجنسى وجرائم الاغتصاب هتزيد<br />والسرقة بالاكراة وتحت تهديد السلاح هتزيد<br />والدعارة والزواج العرفى هيزيد<br />واحنا قاعدين نشتم ايران وحزب اللة ونصالح فى المنظمات الفلسطينية وفتح وحماس<br />ونقابل باراك وشالوم بن عازر والعسكرى شاليط<br />وسايبين كل مشاكل الشعب المصرى من بطالة وعنوسة وفقر وفضينا لابو عباس وحماس<br />يلعن ابوكم على ابو حماس على ابو ابوعباس على ابو باراك ولاد وسخة"
archived = "2009-06-26"
capture_url = "https://web.archive.org/web/20090626022601/http://www.20at.com:80/masr/2khbar/12457-2009-06-24-10-09-43.html"

