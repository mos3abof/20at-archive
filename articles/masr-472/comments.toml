subject = "مش للدرجة دي"
author = "معتـــز"
posted = "2006-06-07"
text = "الغربة صعبة أكيد<br />بس يعني متكبروش الموضوع أنت متغربين في وسط مصريين ومسلمين لأربع خمس سنوات وبتشوفواأهلكم في الأجازات<br />طبعا واضح إن براء بيتغرب لعدة أيام فقط - أيام الامتحانات<br />فعادي مشوا اموركم وتعايشوا مع الواقع أنتوا لسه شباب<br />أمال هتعملوا إيه في الجيش"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025341/http://masr.20at.com:80/article.php?sid=472"

[[comments]]
order = 12
subject = "و مصر اللى بتتولد من جديد ف ساعه ضلمه ميعلمش بيها الا ربنا"
author = "نيفين ..نيفى ..نوفا"
posted = "2006-06-07"
text = "حلو كالعاده يا براء<br />بس غربه ايه يا ابنى طيب سيب الحكايه دى لهبهوب<br />الغربه جوه الوطن ارحم بكتير من الغربه اللى برا الوطن اللى بتحس فيها ان الناس فعلا حواليك زى ما قالو الاصدقاء الوجوه من تلج و عيون من ازاز<br />اما انت وسط الوشوش السمرا و الضحكه البيضا و الشهامه الصعيديه الاصيله و تقول غربه<br />على راى شاعر زميلنا ف الخليج قال ع البلد اللى فيها و اللى هى السعوديه ف قصيده البلد دى زى حطب الفرن ناشفه<br />يلعن الغربه و سوادها<br />و انا من يوم ما اصحابى راحو واحد ورا التانى و اتغربو و اخرهم نهى اللى مش عارفه اراضيها فين بقول البلد دى احسن من غيرها<br />و بقول للجميع الجهل ف الوطن غربه و العلم ف الغربه وطن<br />مش كده يا هبهوب"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025341/http://masr.20at.com:80/article.php?sid=472"

