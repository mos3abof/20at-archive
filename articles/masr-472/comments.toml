subject = "هيه دى الغربة"
author = "سقراط"
posted = "2006-06-06"
text = "يا جماعة بجدانا عشت ظروف و يمكن أصعب شوية من دى . بس يا جماعة حلو الكلام ده و بجد عاوز المزيكا بتاعتكم دى لو تقدرو تعملو دونلود ليها لى المستخدميبقه تمام اوى .طبعاًغريب ان الواحد لما بيبقه فى بلدو بيشتم فيها و يلعن بس بجد فى الغربة بتحس بقيمة بلدك أوى . نفسى اتكلم و اقول حاجات عن الغربة بس مش هطول . ميه ميه يا رجاله كملوا القصة دى بقه .ربنا يعنكم"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025341/http://masr.20at.com:80/article.php?sid=472"

