[[comments]]
order = 10
subject = "واحدة كانت متغربة في اخر الدنيا برضه........اسوان"
author = "smsma"
posted = "2006-06-07"
text = "اولا المقال تحفة<br />ثانيا انا كنت فاكرة ان البنات بس اللي عيشتهم متبهدلة ومتلخبطة بالشكل ده ........<br />ياه هي خلصت الايام ديه بس بجد وحشاني<br />وحشني الميز والفول ولم الفلوس والسهر والرغي والسنيما اللي ب5 جنيه الفيلمين برضه<br />والنوم والكشري والمطاعم ايام العز<br />والكورنيش الفسحة الوحيدة حتي موضوع الفرد الزيادة ومين ينام جني مين وتكسير ملل السرير والخناقات علي مين حينزل يجيب الاكل ومين حيروق ومين حيغسل ومين حيعمل المواعين<br />كانك بتحكي عن اسوان والله وعن غربتي فيها................ياه والله كانت ايام حلوة ومقدرش انساها<br />واذا كان الناس تعرف هناك ايه??????? في الغالب انا عن نفسي مكنتش اعرف حاجة خاااااااااااااالص معندناش تليفزيون والراديو بهدلة وفي الغالب ارساله ضعيف<br />يعني كنا مقطوعين عن العالم وده في حال اغلب الطلبة المتغربين اللي اعرفهم"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025341/http://masr.20at.com:80/article.php?sid=472"

[[comments]]
