text = "وجهة نظر معقولة جدا يا دكتور ضياء أضاء الله بك ظلمات أوقعنا فيها أعدء النور والحرية مخربو الوطن وناهبو خيراته ..أفادنا الله بعظيم دراساتك وأبحاثك وشكرا على مواقفك الشجاعةوالنيلة تجاه الوطن و قضاياه في زمن الغثائية والنفاق"
