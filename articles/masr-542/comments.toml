[[comments]]
order = 1
subject = "مصر من تانى"
author = "ادهم"
posted = "2006-06-20"
text = "اولا انا فى راى ان الاداره الامريكيه ستفكر كالاتى:<br />1- عليها ان تجد حليفا قوياكما هو الان مبارك<br />2- على الرغم من ان الامريكان يطالبون بديموقراطيه مزعومه (تحقق لهم مطالبهم)<br />3- فان الخوف الامريكى من المد الدينى المتمثل فى الاخوان (وهم اكبر قوه مؤثره فعليا فى المجتمع المصرى)<br />4-ايضا الخوف على اقباط مصر<br />5- هذا كله سيجعل امريكا تفضل التوريث الذى سيتيح لها-مصر علمانيه-تنفيذ السياسات الامريكيه فى المنطقه- كسر شوكة اى حركات اسلاميه حتى لا تصبح مصر ايران اخرى بالنسبه لامريكا"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141400/http://masr.20at.com:80/article.php?sid=542"

[[comments]]
order = 2
subject = "حلم ولا علم"
author = "مظلوم"
posted = "2006-06-20"
text = "خير اللهم إجعله خير<br />إمبارح بعد صلاة العشا لقيتني، قعدت أقرا في المصحف وبعدين طفيت النور ونمت، ورأيت فيما رأيت زوبعة عاصفة إعصار رهيب جدا، ربنا يبعده عنا هب فجأة من كل ناحية والدنيا بقت ظلمة كحل، وبصيت لقيت عربيات كبيرة محملة عساكر طايرة في الهوا زي ورق الشجر في الخريف وبتصدم في بعض، وضابط كبير بيصرخ ويقول الريس إتنسف الريس.<br />هبت مفزوع من الفرحة والخضة، خير اللهم إجعل خير يامحقق رجاء الغلابة يارب."
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141400/http://masr.20at.com:80/article.php?sid=542"

[[comments]]
order = 3
subject = "هل ممكن يكون الرئيس متناك ؟"
author = "هانيبال"
posted = "2006-06-20"
text = "رؤساء البلاد بياخدو القابهم حسب اهم وابرز الصفات اللي بتميزهم عن غيرهم فمثلا كان عبدالناصر ملقب بالزعيم وكان السادات هو الرئيس المؤمن ( على مسئولية رجال الدين ) ولا يزال مبارك هو الطيار ( رغم ان حمار لايقة عليه اكتر ) فهل هاييجي يوم يبقى لقب رئيس الجمهورية المصرية هو ( المتناك ) اذا تحقق لعصلبة مبارك وصفوت عزيزة انهم يقعدو جمال على كرسي فرعون فدي هاتبقى اول مرة في تاريخ مصر اللي هو حوالي 9000 سنة ان الرئيس يسبقه لقب المتناك وربنا يرحم الفراعنة العظام .. وطبعا دي مش اشاعة ولا حاجة دي حقيقة يا جماعة واللي مش مصدق يبص في الصورة بتاعة كسمين امه وهو يتاكد .. وبعدين هو رافع راسه ليه كده ومادد رقبته زي ام قويق ؟؟ هو فاكر نفسه ابوالهول ولا ايه ؟؟ شوفو يا جماعة خلقته مستفزة ازاي .. حاجة تقرف والله ..ايه الحظ الوسخ ده ؟؟ يعني يارب ليه انا ما اتولدش في زمن تاني غير ده ؟؟ مكتوب عليا اعيش اسوأ سنين مصر من يوم سيدنا ادم لحد يوم القيامة .. وفي الاخر فيه سؤال احب اوجهه لرجال الدين .<br />هل الانتحار ممكن يكون حلال لو فيه ضرورة ؟؟<br />واظن مفيش ضرورة اضر من كده<br />ويجعله عامر"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141400/http://masr.20at.com:80/article.php?sid=542"

[[comments]]
order = 4
subject = "مخنث بن خنيث"
author = "داهية العرب"
posted = "2006-06-21"
text = "لاخلاف على صحة المعلومات الي تضمنها تقرير الأستاذ هانيبال، فقط تعليق على حكاية الريس المؤمن، مش عارف بجد هو فعلا السادات الحشاش السكري الديوث نجح فعلا في خداع شيوخنا، وإلا إشتراهم بالمناصب، وأقول أشك في نزاهة أي رجل دين كان السادات راضي عنه، وأتحدى من يثبت العكس!<br />كون إنه جمالات بنت حسنية \"باي سكشوال\" يعني مع الرجاله والستات، دي معروفه خالص، تماما زي إبن السادات الي إسمه كان جمال برضه، والله من حق عيلة المرحوم الزعيم عبد الناصر إنها ترفع قضية أمام محكمة لاهاي لطلب تعويض رد شرف.<br />يا أخي وزير الثقافة حسني يتفاخر إنه \"هومو سكشوال\" لوطي يعني، ويشجع على إنتشار هذه الفاحشة بين الشباب المبهور بالغرب، وماسك لينا مايكل جاكسون وإلتون جونز وعايزنا نقلدهم، والريس يعني فاكره مختلف؟ ياجدع الخول يتعرف من مشيته، وصاحبنا ريسنا ده بيمشى مفرشح رجليه قوي، و إبنه إن كان إبنه زيه!"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141400/http://masr.20at.com:80/article.php?sid=542"

[[comments]]
order = 5
subject = "مفيش حلاوة من غير نار"
author = "داهية العرب"
posted = "2006-06-21"
text = "لأ لو على أمريكا لوحدها موافقة ونص، وده مدعوم إسرائيليا يعني، إنما إحنا بس الي نقدر نسفد تخطيطهم لو كنا على مستوى المسئولية. أمريكا مهي منصبة أرجوزات زيه في كل حته لها فيها نفوذ.<br />إحنا الي لازم نقلب الطرابيزه ونقول كفاية مش معانا، تفضلوا ورونا عرض كتافكم، كفاية ستة وتلاتين سنة قرف وتبعية وإنبطاح وخنوع، في جورجيا عملوها، وقبلها في رومانيا وأعدموا شاوشيسكو ده قبل ما يقول لحرسه إلحقوني، وفي إيران قبل كده. مفيش حلاوة من غير نار.<br />وإلا عندكم عشم في أمريكا؟"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621220847/http://masr.20at.com:80/article.php?sid=542"

[[comments]]
order = 6
subject = "الحمار مبارك البارك والمزرعة"
author = "الطفل الشقي"
posted = "2006-06-22"
text = "دخل حمار إسمه مبارك البارك مزرعة رجل .. وراح يأكل من زرعه الذي تعب في حرثه وبذره وسقيه ..<br />كيف يخرج الحمار؟؟<br />أسرع الرجل إلى البيت .. جاء بعدة الشغل .. السالفة ما تحتمل التأخير .. أحضر عصا طويلة ومطرقة ومسامير وقطعة كبيرة من الكرتون المقوى كتب على الكرتون .. (يا حمار أخرج من مزرعتي) .. ثبت الكرتونة بالعصا الطويلة .. بالمطرقة والمسمار ..<br />ذهب إلى حيث الحمار يرعى في المزرعة .. رفع اللوحة عالياً .. وقف على هذه الحالة رافعاً اللوحة .. منذ الصباح الباكر حتى غروب الشمس .. الحمار لم يخرج ..<br />حار الرجل .. ربما لم يفهم الحمار ما كتبت على اللوحة .. رجع إلى البيت ونام ..<br />في الصباح التالي .. صنع عدداً كبيراً من اللوحات .. ونادى أولاده وجيرانه .. واستنفر أهل القرية .. صف الناس في طوابير .. يحملون لوحات كثيرة .. (أخرج يا حمار من المزرعة) .. (الموت للحمير) .. (يا ويلك يا حمار من راعي الدار) ..<br />وتحلقوا حول الحقل الذي فيه الحمار ... وبدأوا يهتفون .. أخرج يا حمار. أخرج أحسن لك ..<br />والحمار .. حمار .. يأكل ولا يدري بما يحدث حوله .. غربت شمس اليوم الثاني ..<br />وقد تعب الناس من الصراخ والهتاف وبحت أصواتهم .. فلما رأوا الحمار غير مبالي بهم .. رجعوا إلى بيوتهم ..<br />يفكرون في طريقة أخرى ..<br />في صباح اليوم الثالث .. جلس الرجل في بيته يصنع شيئاً آخر .. خطة جديدة لإخراج الحمار .. فالزرع أوشك على النهاية ..<br />خرج الرجل باختراعه الجديد .. نموذج مجسم لحمار .. يشبه إلى حد بعيد الحمار الأصلي ..<br />ولما جاء إلى حيث الحمار يأكل في المزرعة .. وأمام نظر الحمار .. وحشود القرية المنادية بخروج الحمار ..<br />سكب البنزين على النموذج .. وأحرقة .. فكبر الحشد .. نظر الحمار إلى حيث النار .. ثم رجع يأكل<br />اقرأ بقية التعليق .."
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624162027/http://masr.20at.com:80/article.php?sid=542"

[[comments]]
order = 7
subject = "كفى"
author = "أبو الحروب"
posted = "2006-06-22"
text = "قصة طريفة تصور واقع كل بلادنا وفيها عبرة.<br />الحرية ليست سلعة تشترى من بقالة أو سوبرماركت بالنقود، ثمنها يدفع بدم ثائر وطني شجاع، هل نحن على إستعداد لشرائها مهما غليت؟<br />ليجب كل بأمانة أمام ضميره، وإن صدق العزم منا، فموعدنا الشارع، وساعتها يخرجن الأعز منها الأذل.<br />هذا فصل القول، فكلب الروم اللامبارك لا يحاربنا بالقول بل بالفعل!"
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624162027/http://masr.20at.com:80/article.php?sid=542"

[[comments]]
order = 8
subject = "الرئيس الجديد خول"
author = "هانيبال"
posted = "2006-06-22"
text = "رؤساء البلاد بياخدو القابهم حسب اهم وابرز الصفات اللي بتميزهم عن غيرهم فمثلا كان عبدالناصر ملقب بالزعيم وكان السادات هو الرئيس المؤمن ( على مسئولية رجال الدين ) اما مبارك فقد حمل لقب رجل الحرب والسلام ( رغم انه اولا مش راجل ثانيا عمره ما حارب فعليا ثالثا فهو سمسار اسلحة قذر يعني مش بتاع سلام ولا حتى سلام عليكم ده غير انه الوحيد اللي كان مشروعه تدمير روح الرجولة والشهامة والوعي لدى شعب مصر المخصية ) فهل هاييجي يوم يبقى لقب رئيس الجمهورية المصرية هو ( المتناك ) ؟<br />اذا تحقق لعصابة مبارك وصفوت عزيزة انهم يقعدو جمال على كرسي فرعون فدي هاتبقى اول مرة في تاريخ مصر اللي هو حوالي 9000 سنة ان الرئيس يسبقه لقب المتناك فيقال في الصحف او التليفزيون مثلا ( الرئيس المتناك جمال مبارك قام بافتتاح مصنع او عقد مؤتمر صحفي ) والفاتحة على روح خوفو وتحوتمس ورمسيس وصلاح الدين وقطز وعبدالناصر .. وطبعا دي مش اشاعة ولا حاجة دي حقيقة يا جماعة واللي مش مصدق يبص في الصورة بتاعة كسمين امه وهو يتاكد .. وبعدين هو رافع راسه ليه كده ومادد رقبته زي الديك الشركسي ؟؟ هو فاكر نفسه ابوالهول ولا ايه ؟؟ شوفو يا جماعة خلقته مستفزة ازاي .. الظلم والشر بيفطو من عنيه.. حاجة تقرف والله ..ايه الحظ الوسخ ده ؟؟ يعني يارب ليه انا ما اتولدش في زمن تاني غير ده ؟؟ ليه يا رب كتبت عليا اعيش اسود سنين مصر من يوم سيدنا ادم لحد يوم القيامة .. وفي الاخر فيه سؤال احب اوجهه لرجال الدين وخاصة المفتي الدكر ..<br />هل الانتحار ممكن يكون حلال لو فيه ضرورة ؟؟<br />واظن مفيش ضرورة اضر من كده<br />وكسمك يا جمالات عى كسم انجلترا بلد سوسو شرشر اللي قال ايه نفسها في جايزة نوبل زي اينشتين وزويل ومانديلا !!!!! اه يا غلبي ااااااااه"
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624162027/http://masr.20at.com:80/article.php?sid=542"

[[comments]]
order = 9
subject = "الإعتراف بالذنب! إيه يااد ياهانيبال الكلام ده يا كخة؟!!!!"
author = "لابس طرحة زي الحريم"
posted = "2006-06-23"
text = "بالعند فيك أحب أوجه الشكر للرئيس محمد حسني مبارك على اللفتة الكريمة بتبرعه بعشرين مليون جنيه من ماله الخاص للمستشفيات في مصر، وحط ياشيري مليون خط بألوان الطيف كلها ومشتقاتها تحت ماله الخاص.<br />طبعا ماله اللي ورثه عن الفاميليا العليوي قوي، ومن حكم في ماله ما ظلم. عايزنا ياقبيح نحجر على الأقرع النزهي، لأ لشيخ الأزهر يكفرك، ويحلل دمك زي بدو سيناء، شيخ الأزهر؟ سوري ده كان المفتي المرة آدي.<br />إبن المومس جمالات والحلوف أبوه وباقي الحلاليف من علية السادات وزفت مرعي وأخمد عثمان و..و..و..و..و كلهم لوايطه، وفي وسطينا، نفسي أسمع إن واحد منهم إتمسك في الشارع ونفذ فيه حكم الشرع في السارقين والمفسدين في الأرض.. إزى على البرادع دول ماحناش قادرين، حنقدر على حجش بوش وألمرت المدلل؟<br />العيب فينا إحنا نسوان منقولها يمكن ربنا يلطف بينا."
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624162027/http://masr.20at.com:80/article.php?sid=542"

