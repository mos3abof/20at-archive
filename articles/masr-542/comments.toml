subject = "دى بلادنا"
author = "مصرى"
posted = "2006-10-11"
text = "دى بلادنا أحنا مش بلد أمريكا وبعدين أمريكا قالت مين مرة الرأى للشعب والشعب كله بيقول لا للتوريث لأننا بلد جمهورى مش بلد عبيد وبعدين ده معندوش أى خبرات يعنى أى أهبل أحسن منه ده عايز الحكم علشان خايف على أستثماراته جوه البلد وبالمرة هل من مزيد من السلطة والمال لكن ده بعده مصر مليانه كفاءات والنهاردة إللى وراه فى التوريث أمه وهى مكروهه من الشعب بالإضافه إنها يهودية وليست مصرية يعنى مش مستعدين نناسب اليهود فى الحكم وربنا يأخذه ويأخذها ونرتاح بقى من الموضوع المرفوض ده ولا للتوريث ولا لجمال مبارك ونعم لعمرو موسى"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117144231/http://masr.20at.com:80/article.php?sid=542&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
