text = "الاهى جمال اللى يحكمكو يا شعب ملوش لزمة اصل انا كده كده مش فارقة معايا انا مسافر وسايب لكم البلد واتمنى ان جمال هو اللى يمسكها عشان ينشف بيضانكم يا شعب جبان يا ولاد الجبناء"
