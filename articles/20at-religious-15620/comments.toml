text = "أسأل الله تعالي أن ينفع بهذا المصحف أهل الخير من الحفاظ وأن يجعله سببا للإهتمام به وحفظه لكل من لم يسبق له حفظه وجزي الله خيرا من قام وشارك في خروج هذا العمل الجليل ولو حتي بتكثير العدد وجزي خيرا كل من ساهم في نشره وبين كنوزه … جزاكم الله خيرا"
