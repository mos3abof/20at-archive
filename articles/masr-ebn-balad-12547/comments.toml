subject = ""
author = "باقة زهور"
posted = "2009-07-02"
text = "عبد الرحمن الابنودى باقة زهور تفوح عطرا وتنشر الحب فى كل الشوارع والحارات والدروب<br />منة خرجت اعظم الكلمات وغناها عبد الحليم ومحمد رشدى ونجاة وشادية وكل المطربين<br />غنى للسويس وقت حرب الاستنزاف وغنى للصمود<br />غنى للسد العالى وتاميم القناة<br />غنى لعبور القناة سنة 73<br />علم كبير من اعلام الشعر الشعبى فى مصر وبلاد العرب<br />متعة اللة بالصحة واسعدة بقدر ما اسعدنا<br />شكرا للرجل العظيم الابنودى ابن الارض"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727212021/http://20at.com:80/masr/ebn-balad/12547-2009-07-02-10-12-58.html"

[[comments]]
