author = "محمود"
posted = "2009-07-03"
text = "الأبنودي من أعظم الشخصيات اللي بتمنى ان يكون ليا شرف مقابلتها بيعشق كل حتة في ارض البلد دي ولو اتكلمت عنه هي اللي هاتقول فيه شعر"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727212021/http://20at.com:80/masr/ebn-balad/12547-2009-07-02-10-12-58.html"

