subject = "الانبا مكسيموس"
author = "قائد أول انشقاق على الكنيسة المصرية:"
posted = "2006-11-16"
text = "البابا شنودة\"طائفي\" وهو \"الأسوأ\"<br />غضب مسيحي بعد الانشقاق<br />الأنبا مكسيموس أعلن تشكيل مجمع مقدس مرتبط بالأرثوذكس في أمريكا<br />القاهرة- (اف ب)<br />أكد رجل دين قبطي انشقاقه عن الكنيسة الارثوذكسية الأم في مصر، لأن عهد رئيسها البابا شنودة \"هو الأسوأ\" في تاريخ الاقباط كما قال، معلنا عن تأسيس مجمع مقدس مرتبط بالمجمع المقدس للمسيحيين الارثوذكس في الولايات المتحدة.<br />وقال راعي كنيسة المقطم الذي أطلق على نفسه اسم الانبا مكسيموس الأول في حديث إلى صحيفة \"المصري اليوم\" المستقلة \"لا امل في إصلاح كنيسة البابا شنودة فكان من الضروري اللجوء للخارج لإنقاذ الأقباط في مصر الذين عانوا من تسلط هذه الكنيسة\".<br />وأضاف \"عهد البابا شنودة يعتبر الأسوأ على الإطلاق في تاريخ كنيستنا\"، واتهم الباب شنودة بالتحريض الطائفي وقال إن \"تصرفات البابا شنودة كمن يصب الزيت على النار فقد كان يحرض الأقباط على الثأر من المسلمين وحمل السلاح\".<br />وأوضح أن إنشاء مجمعه جاء بقرار المجمع المقدس للمسيحيين الارثوذكس في الولايات المتحدة.<br />وقال \"تحدثت مع المجمع الأمريكي فقررت قيادته إنشاء مجمع مقدس لمصر وكنائس الشرق الأوسط يكون موازيا للمجمع الموجود داخل الكاتدرائية\".<br />وأعرب عن ثقته بان السلطات المصرية ستوافق على قيام مجمعه، وقال \"الخارجية الأمريكية تعتمد كنيستنا لاننا امتداد للمجمع المقدس للمسيحيين الارثوذكس في أمريكا\".<br />من ناحيته نفى الناطق باسم السفارة الأمريكية في القاهرة أي علاقة للولايات المتحدة بهذا الموضوع. وقال جون بري لوكالة الأنباء الفرنسية \"هذا غير صحيح على الإطلاق. ونحن لا نتدخل بأي طريقة\" في شؤون الكنيسة القبطية. وأضاف \"نحن لا ندعم أي فريق هذا لا أ<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127180936/http://masr.20at.com:80/article.php?sid=1166"

[[comments]]
order = 1
subject = "على يدى"
author = "نيفين نيفى نوفا"
posted = "2006-11-16"
text = "كان مودى وحش يوم ما عمرو اديب جاب تقرير عن الانتخابات العماليه<br />بس فعلا وزيره القوى العاملهغيرتلى مودى و خليتنى اموت من الضحك لما سالتها المذيعه عن سبب استبعاد الناس اللى ليها انتماءات سياسيه معينه من قوائم الترشيح و منهم الاخوان<br />فردت الوزيره مين الاخوان انا معنديش حد اسمهم الاخوان<br />و بتتكلم كان الاخوان دول طلعو اول امبترح الصبح<br />اسلوب غبى و متخلف و رخيص اوى منها لارضاء السلطه<br />انا مش مع الاخوان و بكررها<br />و لا عمرى هكون<br />بس فيه برده حاجه اسمها احترام الاخر<br />نفسى يلبقو يشترطو ف اختيار الوزراء غير العماله و التعتيم و التطنيش انهم يكونو بيعرفو يتكلمو بدل ما يجيبوا لنا شلل"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127180936/http://masr.20at.com:80/article.php?sid=1166"

