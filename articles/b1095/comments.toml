subject = "البترول الله ..."
author = "ديمة"
posted = "2006-07-22"
text = "اللى بيتكلم عن الهنود ليس العرب ولكن هم الخليجيين وخاصة السعوديين التى جعل البترول اغلبهم يتعاملوا مع الآخرين بتعالى وكأن العالم كله خدم وما لايعرفوه انهم هم مصدر للسخرية ومصدر لمن يعيشوا مثل الانعام يأكلون ويشربون ولا يتفكرون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132959/http://www.20at.com/article2.php?sid=1095"

[[comments]]
order = 2
subject = "خبرة في الهنود"
author = "كمجي راماداس"
posted = "2006-07-23"
text = "بص يا عم عبدالرحمن<br />ليه عدة ملاحظات على موضوعك او بالاحرى على الهنود<br />الاولى الهندي شخصية خبيثة ولئيمة جداً<br />الثانية الدعايا حوالين الهنود وعقليتهم الجبارة في مجال البرمجيات مش حقيقي او تقدر تقول ان 80% من شهرة الهنود في دنيا البرمجيات هي دعايامش اكتر..<br />متنساش الدعم الي بيقدمه العالم الغربي للهند والتسامح معاها في موضوع الطاقة النووية زائد كمان بالنسبة للطاقة النووية مبقتش بالصعوبة الي الناس كانت بتتكلم عنها زمان<br />الهنود فيهم عدة ميزات اهمها \"قلة الكلام\" ثانيها العمل الجماعي من غير أسفنه بمعنى معندهمش الخبص الي عند المصريين او العرب او تقدر تقول عندهم بس بالصورة الفظيعة الي عندنا<br />وحتة العمل الجماعي دي حط تحتها مليون خط ...وعن تجربة معاهم شخصية ...ممكن يكون فريق عمل من الهنود في مجال البرمجة امكانيتهم كأفرادضعيفة جدا انما بيكملو بعض وبيساعدو بعض وبيعلمو بعض...<br />كان ليه صديق هنا بيقول لو ان مصري شغال لوحده هيكون حالة من الابداع ...لو اتنين مصريين اشتغلو مع بعض في عمل واحد هتكون مصيبة ...لو تلاتة هتتحول حرب !....<br />الهنود عكس كده امكانيتهم كأفراد ضعيفة للغاية ويكاد الهندي يكون شخصية بالفعل عندها بلاهه وبلادة ...انما كفريق عمل ...مفيش زيهم<br />على فكرة انا حالياً في دولة خليجية ...60% من السكان فيها هنود"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132959/http://www.20at.com/article2.php?sid=1095"

