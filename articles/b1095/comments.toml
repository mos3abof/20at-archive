[[comments]]
order = 6
subject = "هنود ... هنود ..."
author = "أبو رمضان"
posted = "2006-07-24"
text = "إلي الاخت ريم,<br />لقد ذكرتيني بمقوله الامام ابن تيميه رحمه الله حينما قال \" قد ينصر الله امة كافرة بعدلها علي امة مسلمة بظلمها \"<br />وبكل اسف هذا واقع اليم نعيشه في كل الدول العربيه وكلنا يعلم ذلك جيدا,<br />بالنسبة للاخ الي اتكلم عن الهنود وخبثهم وغبائهم .. انت عندك حق الهنود معظمهم خبثاء ولو عشت في اي دوله فيها هنود هتلاقي مثلا 2 او 3 هنود واقفين يركبوا لمبة مع بعض وده شئ غريب في حين اي فرد عربي ممكن يركب اللمبه لوحده بس يا تري مش احتمال يتزحلق وهوه بيركبها ويقع تتكسر رقبته وتتكسر اللمبه ويترفد من شغله لو في حد واقف ماسكله الكرسي مكنش ده يحصل, وبعدين في ايه مانت عندك الهنود الي بيطلعوا للدور الاربعين واكتر يمسحوا زجاج البنايات برده ده عمل جماعي ,<br />ما علينا حتي لو هما اغبياء وهما خبثاء , اعتقد ان المحصله النهائيه هيه ان الانسان يوصل لايه .. وبعدين هما خبثاء للغريب مش بينهم يا ريت حتي نبقا زيهم بينا وبين بعض, خليكوا عمليين شوفووا الامم عملت ايه وامشوا وراها شوفوا مهاتير عمل ايه , وغير كده سبب الطفره الهنديه المعلوماتيه هما الساسه علي فكره مش واحد طلع من تحت السلم وقال انا هخلي الهند دوله معلوماتيه, والهند اكبر تجمع سياسي ديمقراطي في العالم فعلا ...<br />يا رب نتعلم الدرس ونبطل فلسفه فارغه وتنقيح اللاخرين ونبص لعيوبنا ابدا بنفسك وكما قال الرسول ص : الدين المعاملة ...<br />والمؤمن القوي خير من المؤمن الضعيف, احنا كعرب كسالي وتنابله مع احترامي للعرب وانا واحد منهم .. كله عايز ياكل وينام ويتفرج علي مسلسلات والدش وافلام غبيه ونقعد نضحك زي البلهاء.. اللهم اكتب الصحوه لهذه الامه النائمة .. أمين!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132959/http://www.20at.com/article2.php?sid=1095"

