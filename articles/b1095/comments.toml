[[comments]]
order = 0
subject = "صنج يطن ونحاس يرن"
author = "مارك"
posted = "2006-07-22"
text = "اننا اعتقدنا ان الذكا هو ان نبحث عن عيوب الآخرين كى نبرر عيوبنا ،وان القوة هى فى اظهار نقاط ضعف غيرناواستعراض عضلاتنا..ولكن الذكاء هو ان نعرف عيوبنا ونعترف بها لكى نصحح اوضاعنا..نعرف نقاط ضعفنا لكى نقويها فلا يستخدمها اعدائنا..ولكن هذا مالم يحدث لنا على جميع المستويات وفى كافة الأحوال..فنحن جلسنا نستعرض امجادنا ..نحن اعظم الأمم...ونحن اصحاب الحضارات ...ونحن ....ونحن...ونحن.. وظللنا ننظر الى نقاط الضعف الموجودة فى من حولنا لنمجدفى نفوسنا...<br />اما من حولنا فقدشعروابفقرهم...شعروا بجهلهم...شعروا بضعفهم...ونظروا الى نقاط القوه التى فينا فحسنوا من احوالهم واوضاعهم الى ان أصبحت الهند والصين وكوريا...تلك البلاد التى لم نكن نسمع الا عن فقرها وجهلها وتخلفهاوبالطبع نحن لا ننسى ( قصة الأرض الطيبه للكاتبه بيرل بك )والتى كانت تحكى عن الفقر المدقع بالصين.. انظر اليوم كيف اصبحت الصين من الدول المتقدمه..بل من الدول العظمى..بل من دول الصداره والتحدى ..كذلك الهندوكورياواليابان..والبقية تأتى<br />اما نحن ..يكفينا ان ننظر اليهم فى حسرة وأسى ..ان حالتنا هذه تذكرنى بسباق الأرنب الكسلان والسلحفاه ، والتى ظل فيها الأرنب يغط فى النوم الى ان فازت السلحفاة بالسباق..لماذا لا نستفيد مما ندرسه...لماذا نعلم الناس الحكمة ونفتى لهم بالموعظه ونحن لا نحرك ساكنا ...لقد اصبحنا صنج يطن ونحاس يرن...ليتنا نفيق الى نقاط ضعفنا..قبل ان ينتهى السباق من حولنا<br />مارك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102132959/http://www.20at.com/article2.php?sid=1095"

[[comments]]
