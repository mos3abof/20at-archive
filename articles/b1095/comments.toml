text = "للاسف اعتاد كل شعب انه ينتقد الاخر<br />الهند دوله كبيره حجما و سكانا و امكانيتا و كفايه برنامجهم النووى<br />و بالمناسبه دى نكته هندى<br />واحد هندى سأل مصرى و قاله:ليه مش احرق جثه قبل ادفن<br />رد المصرى:احنا ادفن بعدين ربنا احرق"
