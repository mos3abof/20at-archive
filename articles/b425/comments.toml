[[comments]]
order = 0
subject = "حرم الله الربا"
author = "omar"
posted = "2006-02-12"
text = "السلام عليكم,<br />هذه الظاهرة هي بالنسبة لي احدى أوجه ابتعاد المسلمين عن دينهم و عدم احترامهم لشريعة نبيهم و قلة ايمانهم وبالتالي هم أهانوا نبيهم قبل أعدائهم, هناك رأسماليون يريدون زيادة ثرائهم بأي وسيلة و لو على حساب دماء الناس فهؤلاء الرأسماليون هم من أتباع ايديولوجية الشر و الشيطان حيث انه يسعى الى استعباد الناس و جعل حياتهم ضنكة و مرة , و الأسلام حذر المسلمين من الوقوع في هذا الفخ و حذرهم من التعامل بالربا و لكن المسلمين الآن لتخلفهم و لجهلهم يقعون في دوامة من المشاكل و الهموم و متاهات لا آخر لها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114417/http://www.20at.com/article2.php?sid=425"

[[comments]]
order = 1
subject = "وغابت فكرة التكافل"
author = "محمود عبد الله"
posted = "2006-02-12"
text = "السلام عليكم<br />يجب ان نقر إنه في حالة غياب مورد ما أو سلعة أو خدمة فإن الطلب يتوجه إلي شيئ بديل يحل مكان الأول ويشبع الرغبات.<br />فقد غابت فكرة القرض الحسن عنا لتصريف الفائض من المال مع ضمان إستردادة.<br />فمن منا لم تمنعة الحاجة إلي المال لقضاء مصلحة أو تجارة أو أي شئ قد يكون ضروري.<br />وجائت البنوك لتقوم بدور الوسيط ( بين المودعين والمقترضين ) لتحقق أرباحها عن طريق فائض الفرق بين نسبة العائد علي الودائع ونسبة منح القروض.<br />فهي تستغل حاجة المودع في إنماء ماله وحاجة المقترض في المال مع ضمان إسترجاع مبلغ القرض بالإضافة لنسبة العائد علي القرض التي أصبحت ملزمة ببعض نصوص القانون في بلادنا العربية التي تلزم المقترض بإرجاع مبلغ الأصل مضافا إليه مبلغ الفوائد.<br />- وفي الفترات الأخيرة تعثر بعض المقترضين في مشاريعهم ومع عدم كفاية الضمنات المقدمة للبنوك لضمان مبلغ القرض وهروبهم - فقد إستحدثت البنوك الإقراض لشراء السلع الإستهلاكية للموظفين بضمان وظائفهم - فمن منا يتخيل انك تشتري مكاواه للملابس بالتقسيط - فيحل البنك محلك في سداد ثمن السلعة ثم تقوم انت بسداد القسط مضافا إليه مبلغ محسوب مسبقا وهو الفائدة. فهل تلك المؤسسات نشإت لتقدم خدمة تقسيط مكواه للملابس؟<br />فمثلا تخيل ان بعض المال المخصص للإدخار قد تم توجيه ما بين القرض الحسن ومابين بيع بالتقسيط لغير القادرين علي الدفع النقدي ومابين القرض الحسن.<br />- البيع بالتقسيط بهذا الشكل قد يميز تجارتك عن غيرك - نعم انا معك انه يعطل الكثير من الاموال - ولاكن نقول حزء من الاموال الموجه للادخار - ويزيد رواج سلعك.<br />- القرض الحسن سيتم انفاقة هو الاخر من جانب المقترض علي سلع وخدمات وغيرها - سوف تعود هي الاخري بزيادة في الناتج. ولاكن قد يتأخر قليلا.<br />- أعتقد ان هذا النظام قد يساعد علي عدم ظهور التضخم وحماية المال كله.<br />وقد عجبت بظهور أحد الأشخاص - من أحد ابرز شخصيات المال والأعمال في عدة مجالات - في أحد الدول العربية من غير المسلمين بانة يدرس القيام بإنشاء بنك الفقراء وللقروض الحسنة - فأين نحن من ذلك...؟ّ!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114417/http://www.20at.com/article2.php?sid=425"

