[[comments]]
order = 3
subject = "فحش يفحش فهو فاحش و هي فحشاء"
author = "أكرم"
posted = "2006-02-13"
text = "هذا ليس ربا فحسب بل ربا فاحش و النوع ده موجود في البيع بالتقسيط فمثلا لو رحت تشتري عربية تمنها 80 الف جنيه ( 16 الف دولار تقريبا ) و حبيت تقسطها على 60 شهر يبقى تدفع فايدة سنوية 6 % و يا ريت حد يقولي ايه الفرق بين الربا و البيع بالاجل مع فايده<br />اما عن انتشار الربا ( الفوائد ) في المغرب فانا ارجع ده الى كثرة اليهود في المملكة و كلنا عارفين ان اليهود هم اول من اخترع الربا بكل انواعه و يا ريت نشوف دور المصرفيين الاسلاميين في انشاء بنوك اسلامية تعاونية اهلية<br />و البنوك دي منتشرة في الامارات و لبنان و بتكسب اكتر من البنوك التقليدية كمان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114417/http://www.20at.com/article2.php?sid=425"

