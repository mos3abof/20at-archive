[[comments]]
order = 0
subject = "والله هاتشل"
author = "فادي"
posted = "2006-03-29"
text = "قال بيقولك جمال نزل الشارع وسط الناس..<br />وبعد كده يطلع يقولك انا رحت كل مكان في مصر<br />طيب ياجيمي ياتري نزلت حكر ابو دومه اللي هدوه عشان سيادتك تبني مشاريعك مكانه وطردته الناس الغلابه ولا روحت بورسعيد وقابلت الناس المضربين عن الطعام اللي هدتوا عليهم البيوت ومات منهم 6<br />ولا اكتفيت بجاردن سيتي ومصر الجديدة"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022815/http://masr.20at.com:80/article.php?sid=89&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 1
subject = "اكرم بعيد عن الموضوع ده"
author = "عبدالله مفتاح"
posted = "2006-03-29"
text = "اكرم يا حبيبي انت جبت منين ان ابن العثيمين قال ان النقاب مش فرض؟<br />ابن العثيمين افتى ان النقاب فرض ولا جدال في المعلومه دي لان ابن العثيمين افتى بذلك من زماااااااااااان<br />وتاني حاجه تفسير ابن كثير ماله هو كمان؟<br />تفسير ابن كثير اغلب الاراء اللي فيه بتقول ان النقاب فرض والموضوع ده خلصان من زمان ايه الحكايه؟<br />محدش يدخل ويقولي انت تقصد ان النقاب فرض لاني مقلتش كده والعلماء لما اللي يقولوا والموضوع ده مختلف فيه وبس"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022815/http://masr.20at.com:80/article.php?sid=89&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 2
subject = "جيمى"
author = "بسمه"
posted = "2006-03-29"
text = "ايه داه جيمى كان بيروح المدرس وعايش حياه طبيعيه ولا المدرسه كانت بتجيلوا القصر<br />طيب سؤال مهم جدا اكل الفول قبل كده اكيد اكله اصله متواضع<br />وكانت اول مره يايا عينى ينزل ويشوف الناس الى فى الشارع<br />بصوا ربنا معانا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022815/http://masr.20at.com:80/article.php?sid=89&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 3
subject = "جمال نزل يلعب في الشارع"
author = "سوسة المفروسة"
posted = "2006-03-31"
text = "انا يا جماعة عايزة اعبر عن اعجابي بالصورة المؤثرة المنشورة مع الموضوع....حقيقي مؤثرة جدا جدا..انا خلاص مش قادرة اتكلم الدمعة هتفر من عيني..استنوا استنوا..اهي فرت خلاص..اهئ اهئ اهئ...عااااااااااااه.(نحيب و شحتفه)..اه يا مامي<br />شفته ازاي واخد الراجل في حضنه و لاكانه بيشتغل عنده و عند ابوه..والله حنين قوي جمال ده ياولاد...حقيقي مفيش احن من قلب الام<br />بيقولك واحد بعت لواحد صاحبه جواب قاله فيه الكلب بتاعك مات..فام صاحبه بعت له جواب قاله يا اخي المفروض تمهد لي تقولي القول مثلا الكلب نزل يلعب قي الشارع بعد كده تقول الكلب خبطته عربيه و المرة الثالثه تقوللي مات..بعد اسبوع صاحبه بعتله جواب قاله ..امك نزلت تلعب في الشارع<br />يمكن جمال برضه نزل يلعب في الشارع..جايز...ربنا كريم"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022815/http://masr.20at.com:80/article.php?sid=89&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 4
subject = "لا تعليق"
author = "ايهاب"
posted = "2006-03-31"
text = "بعد التعليق الاخير اعتقد لا تعليق قفلت خلاص هههههههههههههه , بس اقول ايه مش معقول يا جماعه الجمهورية ترجع مليكة تانيه و نعرف فاروق تاني تبقى مشكلة يعني كل اللي كان زمان كان هبل و استعباط الناس اللي راحت و الثورة و مش عارف ايه مالهش قيمة . احيي التعليق الاخير بشدة"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022815/http://masr.20at.com:80/article.php?sid=89&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 5
subject = "ياسيدى كتر خيرك"
author = "أيمو"
posted = "2006-03-31"
text = "انا مستغرب عالاستاذ اللى بقالة 42سنة مفكرش ينزل الشارع ويشوف الناس ويتفاعل معاهم الا دلوقت<br />هى بداية..بس بداية غلط ..عارف لية؟<br />لانك نزلت اكيد فى منطقة راقية على مقاسك<br />انا لو فى موقفك وعايز حقيقى اغير نظرة الشعب لياوعايز اصلح فى الارض حقيقى.<br />.كنت انزل واشوف الناس فى الشوارع الضيقة اللى بيموتو من التلوث وناس بتاكل الزبالة وناس تحت الكبارى.<br />الناس دى هى حقيقى اللى ممكن تقولك ياسيد جمال . مصر ناقصها اية؟"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022815/http://masr.20at.com:80/article.php?sid=89&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 6
subject = "إلحقوا يا جماعة نزل الشارع حد يلحقه لحسن عربية تخبطه"
author = "عابر القارات"
posted = "2006-03-31"
text = "أنا شفت البرنامج بتاع إتكلم ده و أولا أحب أبشركم إن لو الاستاذ جمال مبارك إتولى حكم مصر بعد باباه و ده بعد عمرا طويـــــــــــل فأبشركم بكارثة و مصيبة يمكن رشها على كل مصايب اللى حلت و هتحل على بلدنا المغلوبة على أمرها ليه بقى!! أولا لأن اللى شاف و بيشوف جمال مبارك و أحاديثه سواء التلفزيونية أو الحزبية يكتشف من أول كلمة بيقولها أنه لا عنده الشخصية الجذابة اللى ممكن تجذب الناس من حواليه و لا عمق التفكير و لا حتى أهم حاجه بيبصلها الشعب الذكى اللماح و ليها تأثير السحر عليه و هيه خفة الدم و سرعة البديهة و ده و الله أنا بأعذر السيد جمال عليه فممكن مثلا السيد جمال يبقى مهندس شاطر أو طبيب ماهر أو حتى محامى ناجح لكن مش لازم يكون رئيس جمهورية و أعتقد أنه هوه نفسه حاسس بكده لكن طبعا ما يقدرش يكسر كلام بابا و ده بيفكرنى بالافلام المصرية القديمة اللى بيكون الولد مثلا عاوز يدخل كلية الفنون علشان يطلع رسام فيظهر فى الفيلم الاب القاسى اللى هيحرمه من الميراث لكنه عاوزه يدخل كلية التجارة علشان يمسك محلات البقالة لأنه شايف إن الفن ما يأكلش عيش و مهنة هايفة ... فتماما ده اللى بأحسه لما بأفكر فى موقف السيد جمال مبارك ... و على فكرة اللى شاف برنامج العاشرة مساءا من كام يوم و شاف جيمى مبارك و هوه بيفتتح مشروح تحسين العشوائيات و بصفته رئيس جمعية المستقبل و شافه و هوه بيتكلم مع الناس و بيسلم على الغلابة قاطنى العشوائيات يحس بالكلام اللى قلته جدا .... عموما يمكن المؤهلات الغائبة عن السيد جمال و اللى هي غائبة عن رؤساء جمهوريات كتير يمكن مش هتكون عائق إنه يدخل كلية التجارة و يمسك محلات البقالة زى ما قال بابا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022815/http://masr.20at.com:80/article.php?sid=89&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

