[[comments]]
order = 0
subject = ""
author = "جمال مبارك"
posted = "2010-02-02"
text = "جمال مبارك ليس اقل من<br />ابن ملك المغرب الذي تولى بعد وفاة ابوه<br />ابن ملك الاردن الذي تولى بعد وفاة ابوه<br />ابن ملك البحرين الذي تولى بعد وفاة ابوه<br />ابن ملك الامارات الذي تولى بعد وفاة ابوه<br />ومصر طول عمرها منذ 7000 سنه الحكم فيها وراثي<br />حتى ايام جمال عبدالناصر جاب السادات وفرضه على الناس كولي عهدـ<br />والسادات جاب حسني مبارك كولي عهد<br />اكبروا بقا وبلاش شغل عيال<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />مش دعاء الشامي ولا دعاء حسن<br />بلاش المرادي مش شريف الدواخلي ولا البراء اشرف"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204230537/http://www.20at.com:80/masr/hot-topics/15180-2010-02-02-18-07-33.html"

[[comments]]
order = 1
subject = ""
author = "عيب يا دودى"
posted = "2010-02-02"
text = "مين اللى قال ان جيمى هيمسك البلد<br />انتى هتفولى فى وش البلد<br />عايزة خراب تانى اية<br />البلد كلها فى حالة غم وقرف مزمن<br />انا سمعت يا دودى تعبير فى اليومين اللى فاتو ان الناس عايزة تفرح او حسن شحاتة جاب الفرح للناس - معنى هذا ان الناس فى غم وحزن وطنى شامل وعميق ونفسها اى حاجة تفرحها<br />كفاية يا دودى<br />اتكلمى زى ما اتكلم عمرو اديب عن الخروج الامن للناس دى برة البلد<br />مش ممكن مصر تستحمل تانى اكتر من كدة<br />ما هو يا يأتى البرادعى يا ا اما الانفجار<br />وربنا يستر"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204230537/http://www.20at.com:80/masr/hot-topics/15180-2010-02-02-18-07-33.html"

