author = "اين اللواءات"
posted = "2010-02-03"
text = "هو مش حسنى لواء زى عشرات اللواءات فى الجيش المصرى<br />لية لواء واحد يحكم طول عمرة وبقية اللواءات على الرف<br />ما يتبادلوا الحكم - يمكن لواء فيهم يطلع بيفهم وخايف على مصلحة البلد<br />اى لواء تانى<br />موافقين<br />بس غيروا الحالة دى"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204230537/http://www.20at.com:80/masr/hot-topics/15180-2010-02-02-18-07-33.html"

[[comments]]
