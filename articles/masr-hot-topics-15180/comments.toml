subject = ""
author = "الا من عدل"
posted = "2010-02-04"
text = "ستحرصون على الإمارة وستكون ندامة يوم القيامة<br />قال رسول الله صلى الله عليه وسلم: إنكم ستحرصون على الإمارة وستكون ندامة يوم القيامة فنعمت المرضعة وبئست الفاطمة رواه البخاري.<br />وهذا يشمل جميع أنواع الإمارات والولايات، ستحرصون على الإمارة وإنها خزي وندامة فنعمت المرضعة وبئست الفاطمة في حديث بن… مالك: أولها ملامة وثانيها ندامة وآخرها خزي يوم القيامة إلا من عدل حديث صحيح،"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204230537/http://www.20at.com:80/masr/hot-topics/15180-2010-02-02-18-07-33.html"

[[comments]]
order = 10
subject = ""
author = "إنها أمانة"
posted = "2010-02-04"
text = "إنها أمانة وإنها يوم القيامة خزي وندامة<br />عن رسول الله صلى الله عليه وسلم قوله (( كلكم راع وكلكم مسؤال عن رعيته ))<br />وقال صلى الله عليه وسلم لابي ذر الغفاري رضي الله عنه عندما طلب منه ان يكون اميرا على احد مقاطعات الدولة الاسلامية<br />قال صلى الله عليه وسلم (( إنها أمانة وإنها يوم القيامة خزي وندامة إلا من أخذها بحقها وأدى الذي عليه فيها ))<br />اي والله انها خزي وندامه"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204230537/http://www.20at.com:80/masr/hot-topics/15180-2010-02-02-18-07-33.html"

[[comments]]
