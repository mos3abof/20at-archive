author = "CIVIL SERVENT"
posted = "2010-02-04"
text = "امارة اية بس اللى بتتكلم عليها فى الزمن دة<br />رئيس الدولة موظف حكومى وفى انجلترا بيسمى خادم مدنى civil servent<br />يعنى رئيس الدولة خادم مدنى للشعب مش ديكتاتور ولا رب الارباب ولا رئيس مزمن واحد متوحد بتزل علية الحكمة<br />افهموها بقى civil servent<br />وصدق سيدى رسول اللة<br />سيد القوم خادمهم"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204230537/http://www.20at.com:80/masr/hot-topics/15180-2010-02-02-18-07-33.html"

[[comments]]
