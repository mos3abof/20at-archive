subject = ""
author = "انجازات الكرة"
posted = "2010-02-03"
text = "فى الوقت اللى كان سيادتة بيكرم اللعيبة - كنت اعمل كانون فوق السطح - كانون بلدى فلاحى - رصيت اربعة قوالب طوب على كل صف بوسع يكفى حلة طبيخ وجمعت الخشب القديم وقعدت مراتى جنب الحلة ومسكت حتة ورقة كرتون وقعدت اهف لها على الولعة - احة يا بلد - مفيش انابيب بوتاجاز - والغاز بيصدرة بكسم امة لاسرائيل<br />وبيكرم كل لعيب بمليون جنية<br />وعايزين يورثوا الحكم بعد ما خربوها"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204230537/http://www.20at.com:80/masr/hot-topics/15180-2010-02-02-18-07-33.html"

[[comments]]
order = 5
subject = ""
author = "للاسف امريكا واسرائ"
posted = "2010-02-03"
text = "مصطفى الفقى مستشار اللواءحسنى مبارك قال ان امريكا واسرائيل هما اللى هيختاروا رئيس مصر - وطبعا اختاروة واختاروا ابن رجلهم جمال مبارك<br />لان حسنى مبارك عمل تجريف لمصر زى تجريف الارض الزراعية وخلاها دولة من الدرجة اللى تحت الارض<br />نجح حسنى مبارك فى القضاء على الزراعة المصرية وعلى محصول القطن واصبحت الزراعة المصرية زراعة السلطة لانتاج الطماطم والخيار والفلفل واقتلعزراعة القطن الموجودة منذ محمد على<br />نجح حسنى مبارك فى القضاء على صناعة الغزل والنسيج من جذورها منذ اسسها المصرى الوطنى طلعت باشا حرب<br />نجح حسنى مبارك فى القضاء على التعليم نجاحا باهرا واصبح الخريجون لا يستطيعون كتابة جملة مفيدة ويجلسون على المقاهى وفى البيوت بعد تخرجهم<br />نجح حسنى مبارك فى القضاء على مستشفيات الحكومة المبنية من عصر السلطان فؤاد زالملك فاروق والنحاس باشا واصبح مصير من يلجأ الى المستشفى الحكومى هو الموت - لان القطن والشاش عملة نادرة فى المستشفيات فما بالك بالدواء<br />تم تجريف مصر<br />ولا بد من مكافئتة<br />بتعيين ابنة رئيسا على المخروصة<br />وابقوا قابلونى لو قعد على راسها شهرين"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204230537/http://www.20at.com:80/masr/hot-topics/15180-2010-02-02-18-07-33.html"

[[comments]]
order = 6
subject = ""
author = "25 مليون جنيه"
posted = "2010-02-03"
text = "متفوقة على روبى وماريا وميس<br />25 مليون جنيه أجر هيفاء فى فوازير رمضان القادم<br />هيفاء وهبي<br />الفن اونلاين - خالد الصالح<br />أربعة ملايين ونصف المليون دولار اى ما يوازى 25 مليون جنيه بالعملة المصرية .. هذا هو الأجر الذي تعاقدت عليه النجمة اللبنانية هيفاء وهبى مع قناة الحياة مقابل القيام ببطولة فوازير رمضان القادم والتي سيتم عرضها حصريا على شاشة القناة وتتعاون فيها مع المخرج سامح عبدالعزيز .<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــ<br />يلا بينا نلطم يا جماعة زي الشيعة كده ما هم بيلطموا على الحسين<br />يلا بينا نلطم على خبيتنا التقيله<br />كل المصريين يلطموا على وشهم"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204230537/http://www.20at.com:80/masr/hot-topics/15180-2010-02-02-18-07-33.html"

[[comments]]
order = 7
subject = ""
author = "مليون جنيه"
posted = "2010-02-03"
text = "جمال مبارك يحكم مصر مش دي المشكلة<br />المشكلة ان كل لاعب في المنتخب المصري حيلهف مليون جنيه<br />مليون جنيه في بلد ما فيهاش علاج اصلا اي واحد ما عندوش فلوس بيموت<br />مليون جنيه لكل للاعب في بلد السكان بتوعها ما عندهمش فلوس يشتروا بيها دوا<br />مليون جنيه لكل لاعب<br />مليون جنيه<br />مليون جنيه<br />مليون جنيه لكل لاعب<br />مليون جنيه للكورة من مال الشعب المطحون المضروب بالجذمه<br />ويا ترى حسن شحاته حيلهف كام"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204230537/http://www.20at.com:80/masr/hot-topics/15180-2010-02-02-18-07-33.html"

[[comments]]
