author = "عماد"
posted = "2010-02-05"
text = "واللة انا رأئى مش مشكلة اسم الريس جيمى او بيكى او حتى ابو حفيظة المهم ان يكون متحمل المسئولية اللى على عاتقه من هموم شعب فاض بيه الكيل وخلاص مبقتش تفرق معاه سينا من سونياعايزين حد ياخد حقهم من اللي بيحصل فى العالم من حواليهم واعتداءات سياسية وفكرية واقتصادية واجتماعيةحتى كمان بقت رياضية يعنى الناس من الأخر عايزين واحد فى جرأة جمال عبد الناصر وقوة ودهاء وذكاء السادات وحكمة وسياسة خارجية زى مبارك يكون جيمى يكون مودى مش مهم الاسم المهم الفكر لان طبعا لما هيبقا ريس الاسم هيبقى ليه هيبته حتى لو دودى"
archived = "2010-02-04"
capture_url = "https://web.archive.org/web/20100204230537/http://www.20at.com:80/masr/hot-topics/15180-2010-02-02-18-07-33.html"

[[comments]]
order = 12
subject = ""
author = "رئيس يعمل اية ؟"
posted = "2010-02-05"
text = "احنا عايزين رئيس يعمل اية ؟<br />ما هى الواجبات الوظيفية لرئيس الدولة ؟ بمعنى يصحى من النوم يعمل اية ويشتغل كم ساعة ويشتغل فى اية ومين يحاسبة ومن هى الجهة المخولة بالرقابة علية ؟<br />نفترض اننا اخترنا رئيس منظر واختار احد البلاجات وقعد هناك يصطاد سمك وياكل جمبرى ويضحك ويناغش فى الحاشية بتاعتة<br />مين اللى هيسألة - انت بتعمل اية - انت سايب شغلك لية<br />مطلوب لجنة من 100 شخصية كبيرة تكتب الواجبات الوظيفية لرئيس الدولة وتكتب لة البرنامج التنفيذى اللى هيعملة واللى هينفذة - مش برنامج يحطة هو من دماغة وبمزاجة<br />تماما زى المانيا او انجلترا<br />ميركل بتعمل اية<br />ماشية على برنامج مكتوب بالمسطرة وبتنفذة حرفيا<br />وبيغيروا المستشار كل اربعة سنين<br />مفيش حاجة اسمها رئيس مؤبد ولا بيسندوة علشان يمشى لانة من ال البيت ومن السلالة العلوية للحسن والحسين ولو ترك الحكم الحسن والحسين هيسخطوة ويحولوة فار والا كلب<br />كل العالم تقدم<br />وحتى الوثنيون فى كوريا واليابان والهند<br />وبقيت امة محمد فى زبالة التاريخ بسبب رؤسائها المتخلفين"
archived = "2010-02-05"
capture_url = "https://web.archive.org/web/20100205173927/http://www.20at.com:80/masr/105-msa7t-r2y/15180-2010-02-02-18-07-33.html"
