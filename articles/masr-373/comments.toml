[[comments]]
order = 8
subject = "لعلهم يعتبرون"
author = "العربي المصري"
posted = "2006-05-29"
text = "أتمنى من كل قاض ذاق المهانة على أيدي قوات الأمن المركزي ومنعه ظابط صغير أن يرعى الله في أبناء مصر المقهورين خاصة وهم يجلسون على منصة العدل مكان الله في الارض، ونلفت النظر إلى وكلاء النيابة العامة الأطفال الذين لاهم لهم إلا ممارسة ساديتهم وطقوس شبقية بالحبس أربعة أيام.<br />أتمنى أن يتعظ القضاة ويعتبرون لأن الزمن أثبت أنه حين ينحرف القاضي عن ضمير الله فكل شيء مباح حتى الإهانة والأمن المركزي والهراوات مثلنا تماما.<br />ألم يقل حسني مبارك أليس لي ملك مصر وهذا النيل لي وحدي وشرم الشيخ؟؟؟؟"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233054/http://masr.20at.com:80/article.php?sid=373"

[[comments]]
order = 9
subject = "اليس لي ملك مصر"
author = "العربي المصري"
posted = "2006-05-29"
text = "حسني مبارك: أليس لي ملم مصر<br />وهذا النيل لي وحدي<br />وشرم الشيخ!!<br />نتابع من سنين عديدة مسرحية هزلية نعاد فصولها كل ست سنوات يقول فيها البطل هذه آخر ولاية، لكن الله يمد في عمره لأسباب عديدة ومنها أننا لابد أن نذل على أيدي هؤلاء لأننالم نعط الله حقه وقد وصفنا سبحلنه وتعالى بالفاسقين في محكم تنزيله وحكم علينا بالفقر وفقر الثروات التي لاتغني من جوع مثل الفول والعدس.<br />يتجدد الفرعون ويسومنا سوء العذاب على أيدي رجاله من الذين لايعرفون لله قدرا ولا خشية، وللأسف كان منهم قضاة، ومن يصدق أن أبو الليل الذي كان محافظا وضج الناس من أفعاله وكيف أن سمك البوري في هذه المحافظة كان يذهب إلية حياًخاشعاً لسلطانه ، كيف هذا الرجل يصبح في مكان عمر بن الخطاب رئيسا لقضاة مصر؟<br />إنها معجزة حسني مبارك الذي أرهقنا من أمرنا عسراً، فإذا فاحت رائحة وزير أبقاه في مكانه حتى يقضي الله فيه أيما الاجلين أن يموت أو تغضب عليه أمريكا، \" يوسف والي - كمال الشاذلي- صفوت الشريف\".<br />ولايهمني في كل مايحدث لمصر إلا أن يرحمنا كل هؤلاء الذين أسقونا مرارة الحنظل ومنهم القضاة؟؟ هل تصدقون؟<br />لماذا لايرحمنا السارقون ويسرقوا فقط مبالغ قليلة- لماذا ؟ السارق يسرق ميزانية جيل كامل من الذين يتسولون لقمة العيش بلاطائل! ألايكتفي كل منهم بمليون واحدويترك لشباب مصر الباقي أو يبني هو مصنعاً؟ لكن المعادلة بهذه الطريقة خاسرة تماما .لأن خلفه طابور من الأفاكين وللأسف منهم قضاة.!<br />لماذا يصفق الناس لجمال مبارك في منتدياته، وبأي صفة يتكلم ، الرجل لاتثريب عليه غير أنه ابن الاكرمين؟ لو كان في المعرضة لكنت أول من يعلن محبته له؟ لكن والده كان مكمن حقدنا عليه!<br />لماذا أيها القضاة لاتحكمون بعدل الله؟<br />هل من العدل ان يقف<br />اقرأ بقية التعليق .."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233054/http://masr.20at.com:80/article.php?sid=373"

[[comments]]
order = 10
subject = "إفهم ياعم عربي"
author = "أبو إسلام"
posted = "2006-06-06"
text = "إذا وقف مجموعة من شرفاء القضاءوطالبوا باستقلال القضاء عن سلطة الحكومة حتي تضمن ياأخ عربي إذا وقع عليك ظلم أو طالبت بحق لك أن تجد قاضيا عادلا مستقلا يقض لك بالحق..فهل من العقل والمنطق أن أندد بالقضاء في هذا الوقت ودون تمييز وأتهمهم<br />بالظلم أم الواجب أن أشد علي أيديهم وأدعوا الناس أن تقف معهم لصالح مصر يامصري؟؟!"
