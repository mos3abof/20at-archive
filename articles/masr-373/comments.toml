[[comments]]
order = 11
subject = "حق القضاء أم حق مصر؟"
author = "العربي المصري"
posted = "2006-06-07"
text = "نحق يااخ ابو اسلام لا نبتغي غير الحق والعدل... الحق الذي أهدروه.. والعدل ألذي أضاعوه..<br />وأود أن أسألك فقط ..<br />- أمن العدل أن يقبل القاضي عشرة آلاف جنيه في يوم واحد عمل نظير ثيامه بالأشراف على لجنة انتخابات؟؟<br />- أمن العدل أن كل قاض لابد أن يتحول أبنه إلى وكيل نيابة؟<br />- أمن العدل أنهم يشاهدون الناس تأكل من القمامة ولايتحركون من زمن.<br />عزيزي إنهم ماتحركوا إلا بعدطالتهم هراوات الأمن المركزي .. وكانوا يظنون أنهم من حاشية الفرعون.. لكنهم طالما قبلوا عشرة آلاف جنيه في يوم واحد يحق أن يفعل بهم الأفاعيل .. أساؤواإلى أنفسهم قبل مصر..<br />هل كانوا يخصبون الذرة حتى يتناولوا هذا المبلغ وغيره في يوم واحد؟<br />كانوا يشاهدون التزوير والضرب والبهدلة ولا يتحركون وهانت عليهم مصر وأبنائها ، فهانوا على ضباط الشرطة وسلومة والعربي وابو الليل!!<br />-هل من العدل أنهم يصمتون على مهازل الثانوية العامة بعد أن ضمنوا لأبنائهم مكانا في سلك القضاه حتى لو كان مجموعه 50 في المائة؟؟<br />- أمن العدل أن تطالبني أن أشد على ايديهمبعد أن حاكموا غالبية الشعب المصري في قضايا تموين لمن باع سبانخ بقرش زائد!! وسجنوه.. أو من لم يضع لافتة بالسعر وطاوع القاضي قلبه وهو يخط بقلمة ثلاثة أشهر للمساكين..!<br />أمن العدل ان أشد على أيدي الذين أفاقوا بعد غفلة على حقيقة أنهم مثلنا فقاموا قومة رجل واحد يقولون لنا الاستقلال..<br />ياعزيزي قل لله الأمر من قبل ومن بعد..<br />وضع الكتاب إلى جوار المسبحة .. واقرأ على مصر الفاتحة طالما هناك هؤلاء.!"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233054/http://masr.20at.com:80/article.php?sid=373"

[[comments]]
order = 12
subject = "يا استاذ عربى انت بتشتغل ايه بالظبط .........؟"
author = "واحد"
posted = "2006-09-08"
text = "يا استاذ عربى انا عاوز اقولك حاجة مهمة جدا انت لازم تعرفها وهى ان الواحد لما ينقد اى شى فى شرطين للنقد علشان يبقى نقد بناء مش اى كلام وخلاص.و الشرطين هما ان يكون هدف هذا النقد الوصول الى الكمال وليس مجرد كلام قهاوى وخلاص ,اما الشرط الثانى ان يتناول النقد نقطة مفيدة فى الموضوع مش مجرد نقد والسلام.<br />ده عن شروط النقد البناء . الما عن الرد على نقدك يااستاذ عربى فهو كالاتى:<br />1-ان القضاة عندما اخذوا اجرهم عن تعبهم فى اشرافهم على الانتخابات لم يشترطوا ان يكون الاجر 10000 جنيه كما ذكرت ولكن الوزارة هى اللى بتحدد المبلغ ولا يستطيع احد الاعتراض عليه حتى ولو كان 100 جنيه فلو بتسال ليه القضاة بخدوا امبلغ ده عن الثلاث مراحل مش يوم واحد كما ذكرت انت . فعليك ان توجه سؤالك للوزير. على فكرة عاوز اقولك انهم فى انتخابات عام 1995 و ما قبلها كانوا ياخدوا اقل من كده بكتير.<br />2-اما عن مسالة تولى ابناء القضاة الغير اكفاء لمنصب القضاء فكان يجب عليك قبل ان تهاجم وخلاص ان تعرف موقف ادارة النادى من هؤلاء . الذى لاتعرفه ان النادى طالب العديد من المرات فى اكثر من لقاء مع المجلس الاعلى للقضاء بالغاء الدفعة التكميلية التى يتقدم فيها الطلاب الحاصلين على تقدير اقل جيد وان النادى قام بتعليق مقال الكاتب الكبير فهمى هويدى فى النادى التى انتقد فيها فهمى الدفعة التكميلية .<br />3-اريد ان اقول للاستاذ عربى ان القضاة كانوا ممكن ان يجلسوا فى الجان الانتخابية دون ان يتعرض اليهم اى ضابط من هؤلاء . ولكن الذى لاتعرفه انت ان القضاة الذين تعرضوا للضرب من الشرطة اما تعرضوا لذلك فقط من اجل ان يحموا صوتك من التزوير يا استاذ عربى.<br />4-اما عن مسالة الثانوية العامة فعيب قوى ان نرمى على القضاة شى من اختصاصنا نحن الشعب لان<br />اقرأ بقية التعليق .."
archived = "2006-09-21"
capture_url = "https://web.archive.org/web/20060921111916/http://masr.20at.com:80/article.php?sid=373"

[[comments]]
order = 13
subject = "أليس لي ملك مصر .. إلى الأخ .. واحد"
author = "العربي المصري"
posted = "2006-11-05"
text = "لسيد واحد<br />تحياتي لك ولردك الغير موضوعي بالمرة، والذي صدرته بالحديث عن كلام القهاوي.. شكراً لك على اية حال لانك توليت الرد وكأننا في حالة حرب رغم أننا جميعاً نحاول أن تعتدل الحياة بنا في مصر..<br />والذي آلمني في الواقع بعد حديثك عن النقد البناء أنك استشهدت بمقال فهمي هويدي.. مما يدل على أن في حديثي شيئاً من الدقة ولست قهوجيا...<br />وياعزيزي طالما أن حال القضاة أعجبك فأنا أحييك وعليك الدفاع عنهم بكل ماتملك ..<br />وليس من العيب أيضاً أن تقول كل فئة فيها وفيها وكأننا نتحدث عن الفئات الإعتيادية في المجتمعات مثل الأطباء والمهندسين وووووغيرهم ...!!<br />لكننا ياعزيزي المحترمنتحدث عن خلفاء الله في الأرض .. ألذين يسر لهم ولم يلتفوا على عدالته ليكونوا قضاة ووكلاء نيابات..!<br />الذي يجلب الحزن والهم هم هؤلاء الفئة من الناس غير الناس .. هم خلفء ولاينبغي لهم أن يتعرضوا بشر لأحد ولا أن يكون منهم مرتشي مثلا.. لأن الساعة لابد أن تقوم حينئذ..<br />من ينصف المظلوم من قبضة الشرطة والعربي وأبو الليل فير أقسام الشرطة المصرية..<br />إلى من نلجأ ..<br />من ينصف من..<br />يا أخي كن موضوعياً وحاول أن تعتذر إلى الله مرة عما دافعت به عن القضاة..<br />هم حائط الصد الأخير لكل مظلوم ولكل مقهور .. أما أن يتحول هؤلاء إلى وحتى لو واحد منهم إلى غير ذلك تكون القاسمة..<br />أنت لاتعرف .. أو تعرف..؟ أو مانت من الذين نذروا أنفسهم للغواية؟<br />أليس هناك قاض مرتشي..<br />أليس هناك وكيل نيابة مرتش<br />أليس هناك محام مرتش<br />ألم يقابك ضابطا غررا في كمين ليجعلك فرجة للعالمين إن أنت اعترضت على معاملته البذيئة التي رباها عليه ذكي بدر والنبوي وغيرهم..<br />لعلك يأخي من رواد الفيشاوي من الذين يرون مصر في الليل فقط..<br />لم تر والدك يهان أمامك من غرر دلف إلى النيابة والشر<br />اقرأ بقية التعليق .."
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111124827/http://masr.20at.com:80/article.php?sid=373&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 14
subject = "الأخ باء"
author = "العربي المصري"
posted = "2006-11-07"
text = "الأخ باء تقريباً لاسع .. بلغة الروشنة..<br />لسة بيقول بلادي بلادي لك حبي وكفاحي<br />حاجة غريبة .. دا لازم يتعالج..<br />هو مادخلش أقسام ولا أيه..<br />مفيش استاذ جامعة حطه في دماغة<br />مفيش وكيل نيابة طفل قاله انت ياد بتشتغل أيه؟؟ لواحد في عمر والده إذا كان له والد يعرفه..<br />ماخدش على قفاه ولامرة من مخبر مباحث ..<br />ما شافش سمير رجب .. ولاشاف سمير غريب حتى!<br />بيقولك بلادي بلادي..<br />حاجة تستحق البحث والتحليل عن كائنات غير منطقية تعيش بيننا.."
