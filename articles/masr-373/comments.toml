posted = "2006-05-27"
text = "ياء :<br />يا رب قريب نشوف مصر كلها حرة ، على فكرة البلوج حلو جداً وبالتوفيق<br />مصراوي :<br />شكرا على الملاحظة ، سنضيف الاسماء إلى الصور .<br />إبراهيم<br />شكرا ، أخجلتم تواضعنا:)<br />قاضيا في الجنة وقاضيين في النار<br />كل مهنة فيها الحلو وفيها الوحش والقضاة نفسهم بيعترفوا بده وإلا ما كانوش طالبوا بالتحقيق مع القضاة المشرفين على الدوائر التي حدث فيها تزوير مثل دمياط والدقي ودمنهور ، واجبنا دلوقت أننا نساند القضاة الشرفاء في مطالبهم بقضاء مستقل يضمنه قانون السلطة القضائية ساعتها كلنا هنقدر نتظلم ونشتكي من الظلم والفساد والتوريث قدام قاضي عارفين انه هيقدر يدينا حقوقنا<br />تحياتي<br />هبة"
