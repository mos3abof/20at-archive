[[comments]]
order = 6
subject = ""
author = "فلسطيني حتى النخاع"
posted = "2009-11-29"
text = "باسمي وباسم كل فلسطيني وانا واثق جدا مما اقول ندعوا للشهيد البطل السيد الرئيس المرحوم صدام حسين الذي يمثل رمزا للقياده المسلمه الصحيحه واقول لكل كلب نبح ضد صدام حسين اذا قام صدام بقتل الاف الكلاب فان الامريكان قتولوا مئات الاف من الشرفاء في العراق انظروا ماذا فعل الغرباء بالعراق الان لا تخلوا بلده من التخريب المنظم لقد كنتم في نعيم من الان .<br />تحية اجلال واكبار الى السيد الشهيد صدام حسين ولمذكراته التي تدل على قوته وعزته<br />خلاف هذا الرأي سيكون تافها ولا ينتمي الى الوفاء بشيء<br />والذي سب الرئيس اقول انت اوقح شخص رات عيني<br />انت احقر وادنى من ان تلفظ اسمه على لسانك النجس<br />تقبلوا مروري فقط كنت اتصفح الانترنت ورايت المقال واحببت ان اشارك ."
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202062022/http://www.20at.com:80/20at/arts/13843-2009-10-27-11-32-35.html"
