author = "دبلومه في الخيبه"
posted = "2009-07-22"
text = "على ما يبدو ان الحكومة المصرية او الحكومات المصرية المتعاقبه على حكم مصر اعطت الشعب المصري دبلومه في الخيبة التقيله<br />اي والله<br />يعني مثلا عم نظيف جه واتفلسف ودمج البنوك وبعد كده نزل الفايده من 10% الى 6%<br />وبعدين حصلت ازمة الخبز<br />وغيره وغيره كتير اوي اوي في دبلومة الخيبة التقيله اللي اصبح الشعب المصري كله متخرج منها<br />ودا برضه تلاحظيه يا اخت مروى ساعة انتشار الامن المركزي في الشوارع واشتباكه مع الشعب<br />وبرضه تلاحظيه في افلام السينما لما الشعب المصري يروح يجري على السينمات وها هو فيلم 1000 مبروك ايراداته مليون جنيه في اليوم يعني الشعب المصري الخيبان بيدفع فلوسه للحراميه بتوع السينما<br />والموضوع يطول شرحه يا مروه سلام وسلميلي على رضوى<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726002243/http://www.20at.com:80/masr/t7kyk/12732--1.html"

