author = "شوف واسطة"
posted = "2009-07-22"
text = "عايز تشتغل شوف واسطة وادفع المعلوم<br />مفيش واسطة يبقى قدامك الفرص التالية<br />بياع فى دكان او فى محل<br />فى قطاع البناء والتشييد ممكن تلاقى وظيفة مبلط نقاش عامل محارة مساعد نجار مسلح تشيل طوب وزلط ورمل<br />هذا هو المتاح فى بر مصر<br />مفيش لا مصانع قطاع عام ولا قطاع خاص<br />ومفيش جواز<br />طيب البنت خلصت البكالوريوس وقعدت فى البيت - تنشغل باية - لازم تدخل وتخرج وتمشى فى الشارع علشان يشوفوها ال[ *** ]ان ومفيش اى مجال شغل لها<br />يبقى تفكر تخرج علشان تعمل دراسات ودبلوم وماجستير لغاية ما ييجى ابن الحلال<br />هو دة اللى ماشى<br />من شدة البطالة تدخل اى قرية تلاقى 10 محلات بتبيع اجزاء الكمبيوتر وبتجمع الكمبيوتر وفية شبكات نت لاسلكية ولها مشتركين بالوصلة<br />وتلاقى فى القرية محلات بتبيع كباب وكفتة ديليفرى ومحلات كشرى<br />الناس تشتغل فى اية<br />وفية فى القرية خريج طب فتح محل بيع ادوات نظافة مكانس ومساحات وقشات وصابون للغسلات<br />الحياة اصبحت مكتومة ومخنوقة والناس بتتصرف بطريقة خانقة<br />مرة قعدت اسال صاحب محل الكباب فى القرية انت بتكسب قال لا انما ها اعمل اية هاقعد فى البيت<br />الحل من عند ربنا"
archived = "2009-07-26"
capture_url = "https://web.archive.org/web/20090726002243/http://www.20at.com:80/masr/t7kyk/12732--1.html"
