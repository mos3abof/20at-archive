[[comments]]
order = 1
subject = "برافووووووووووو"
author = "ابراهيم"
posted = "2006-02-14"
text = "الفكرة دي رائعة بجد تسلم ايدك يا بنتي ، وفعلا احنا ممكن نحتفل يعد الحب مع كل الناس الي بنحبها واللي بنكرهها كمان بس المهم من جوة القلب ابيض وانا كمان عندي قايمة طويلة من المكروهين ومشترك معاكي في كتير منهم يعني اكيد حسني وولاده وكمال الشاذلي واحمد عز واسامة منير وفتحي سرور ومصطفى قمر ودينا الرقاصة وبوش وشارون بس انا مختلف معاكي شوية انا مش ناوي احبهم انا ناوي ازود كرهي لهم النهاردة اكثر من اي يوم تاني اما اللي ممكن احبهم واحد صاحبي ندل او واحدة صاحبتي مستغلة بس بجد برافوووووووووووووووووو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133846/http://www.20at.com/article2.php?sid=437"

