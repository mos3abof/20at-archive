[[comments]]
order = 5
subject = "الله يسامحك"
author = "عبدالله مفتاح"
posted = "2006-02-14"
text = "الله يسامحك يا اللي قلتي اني اهبل وخلاص وبتساليني انا عبيط ولا متخلف؟<br />لا انا لا عبيط ولا متخلف وربنا يسامحك<br />بس يا ريت تكتبي اسمك عشان اعرف ارد عليكي بيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133846/http://www.20at.com/article2.php?sid=437"

[[comments]]
order = 6
subject = "لا دول كتييييييييير"
author = "سوسة المفروسة"
posted = "2006-02-14"
text = "كل مذيعات التلفزيون المصري بلا استثناء و على راسهم سهير شلبي و نيرفانا(قال يعني كنا ناقصينها)<br />نادية الجندي -ايناس الدغيدي-يسرا-هالة سرحان-عادل امام-وحيد حامد-اقبال بركة-هاني سلامة-هندصبري-مفيد فوزي-سمير رجب<br />كمال الشاذلي-فتحي سرور-حسني و سوزان و جيمي و لولو وكل الذرية المفترية<br />اي رئيسة عمل في اى مكان فى الدنيا<br />موظفين القسم (لما تروح تعمل بطاقة انتخابية) صاحبتي اسمها سالي قالها و يسموكي سالي ليه?????<br />كل ظباط الشرطة اللي داخلنها بالرشوة و ب50في المية وعاملين فيها باشاوات<br />و اخيرا و ليس اخرا الدكتور نظيف اللي ساب الناس غرقانين في العبارة وراح يهز العلم في ماتش المنتخب صحيح(طويل و اهبل)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133846/http://www.20at.com/article2.php?sid=437"

[[comments]]
order = 7
subject = "أضف إلى المكروهين"
author = "أميرة"
posted = "2006-03-02"
text = "أحب أضيف إلى قايمة المكروهين كل المطربين الهايفيين والبنات اللى مش بيكملوا لبسهم والممثلين والمخرجين اللى خربوا الدنيا بأعمالهم وخلوا الشارع كله ولاد ماشية مع بنات بسبب أفكار الأفلام الفالصو أهو دوله بقى مش هاحبهم أبدًا إلا يعنى لو تابوا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133846/http://www.20at.com/article2.php?sid=437"

