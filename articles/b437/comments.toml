[[comments]]
order = 3
subject = "انتي بجد فدائيه"
author = "sweet_princess"
posted = "2006-02-14"
text = "بصي يا استاذه دعاء والله انتي بنت ما جابتكيش ولاده واعرفي بقى ان كل اللي ردوا عليكي ومنهم انا خلاص اتملينا عقد وكلاكيع بسبب الكابوس اللي كابس على نفسنا باسم الاصلاح ال اصلاح ال طب تعالو شوفو اللي عمله ابنه علاء في كام شركة غزل في المحله لما خرب بيوت اصحابها وشردهم عشان رفضوا انه يستولى على شقى عمرهم باسم انه بيشاركهم الحرامي دا<br />انا قلت رايي واجري على الله وانا لله وانا اليه راجعون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133846/http://www.20at.com/article2.php?sid=437"

