subject = ""
author = "زوائد لحمية"
posted = "2010-03-07"
text = "تقرير المستشفى اليوم قال ان الوضع مستقر وانة فاق من البنج - وانة استأصل زوائد لحمية من الاثنى عشر - والزوائد اللحمية ترجمة لطيفة لكلمة اورام - وربنا الشافى المعافى<br />يعنى ربنا يستر على عبيدة<br />وطبعا معروف نهاية كل بشر - ولكن احيانا يظن الناس ان حصونهم تمنعهم وتمنع الموت عنهم<br />ربنا يحسن خاتمتنا جميعا<br />صلوا على موتاكم وموتى المسلمين وادعوا لهم بالرحمة"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309102815/http://www.20at.com:80/masr/news/15613-2010-03-06-19-21-53.html"
