subject = ""
author = "حودة ابن مصر"
posted = "2010-03-07"
text = "الف سلامه يا ريس<br />كلنا معاك ويبك انتا بكلاب الى عملة تهوهوة دى دول والله العظيم كلاب<br />ربنا يخليك للينا يارب<br />ان شاء الله هتمسك بردو الرئسة وهترجع ليناا بسلامة وربنا يشفيك يارب ويخليك لينا يارب بحبك يا ريس بنحبك من قلبنا<br />ابن مصر حودة"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309102815/http://www.20at.com:80/masr/news/15613-2010-03-06-19-21-53.html"

[[comments]]
