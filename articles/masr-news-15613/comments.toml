subject = ""
author = "المشير طنطاوي"
posted = "2010-03-06"
text = "الف سلامه يا ريس<br />ربنا يشفيك يا ريس وما تحملش اي هم البلد بخير والحمد لله وقوات الامن بخير<br />وانا صاحي اوي يا ريس صاحي ومفتح عنيه اوي<br />اي حد حيفكر انه يستغل مرض سياتك ويفكر انه يعمل انقلاب ولاحاجه حنصفيه على طول يا ريس ومن غير ما حد يحس ولا ياخد باله<br />اطمئن يا ريس انت سايب وراك رجاله تاكل الزلط وتفوت في الحديد<br />سلام يا ريس"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309102815/http://www.20at.com:80/masr/news/15613-2010-03-06-19-21-53.html"

[[comments]]
order = 1
subject = ""
author = "نحن نحبك ولكن"
posted = "2010-03-06"
text = "احنا بنحبك يا ريس<br />بس يا ريس الانسان لازم يرتاح شوية<br />يا ريت يا ريس تعمل خدمة للبلد دى وتعدل الدستور وييجى عمرو موسى او البرادعى او اى واحد من الناس وانت ترتاح بقى<br />وتخللى غيرك يشيل المسئولية شوية<br />كفاية عليك كدة والحمل تقيل<br />تهمنا سلامتك وراحتك - ارتاح بقى وتفرغ شوية للعبادة قبل لقاء الواحد الديان<br />ارتاح يا ريس<br />نظيف النهاردة تولى المسئولية والحكم بكل سلاسة - اية اللى جرى ولا حاجة<br />تهمنا راحتك وراحتنا ايضا"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309102815/http://www.20at.com:80/masr/news/15613-2010-03-06-19-21-53.html"

[[comments]]
order = 2
subject = ""
author = "المرارة فيها اية ؟"
posted = "2010-03-06"
text = "ايوة محدش قال<br />المرارة فيها اية<br />التهابات<br />حصوات<br />اورام<br />انسداد<br />المهم انضرب مشرط<br />واستئصال المرارة فى مصر مش حاجة صعبة ولا حاجة واى جراح فى اى مستشفى متوسط بيشيل المرارة<br />انما بقى الخوف من المصريين وركوب سيارة مدرعة فى الشارع وسد الشوارع امام الناس وحصار البيوت علشان هيمرليفتتح اى حاجة<br />وعدم الثقة فى الدكاترة المصريين<br />كل دة يروحوا المانيا يشيلوا المرارة هناك<br />ربنا كريم<br />ويشفى مرضى المسلمين الغلابة<br />والناس اللى مش قادرة تروح المانيا"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309102815/http://www.20at.com:80/masr/news/15613-2010-03-06-19-21-53.html"

[[comments]]
order = 3
subject = ""
author = "المعلق السابق"
posted = "2010-03-07"
text = "انت عايز ييجى ابنة المعاق ذهنيا والمحتاج الى رعاية خاصة يمسك مصير 80 مليون<br />هما 80 مليون نفر دول هاموش<br />ناموس او بعوض<br />مفيش فى 80 مليون انسان مليون انسان يصلح للولاية<br />امثالك الاوباش هم سبب بلاء الشعب<br />احنا يا شاطر النظام عندنا مش جمهورى وليس ملكى<br />انة النظام الفرعونى ولا شبية لة فى العالم<br />نظام الحكم الفرعونى فى مصر لا شبية لة فى اى دولة من دول العالم<br />يعنى الرئيس الفرعونى هو رئيس الجيش ورئيس الشرطة ورئيس القضاء ويقيل مجلس الشعب ويقيل مجلس الوزراء ولا توجد سلطات لمجلس الشعب ولا مجلس الوزراء ولا لاى انسان على ارض مصر الا سلطات الفرعون بس<br />انت عايز ابنة يمسك ليستمر النظام الفرعونى فى الحكم<br />يبقى مفيش فايدة<br />المثقفين فى مصر عايزين يغيروا الدستور<br />عايزين يوقفوا النظام الفرعونى ويحولوة لنظام ملكى او نظام جمهورى مش مهم<br />المهم نتخلص من الفرعونية<br />فهمت<br />احنا مش بنقول جمال او الملك احمد فؤاد<br />احنا عايزين دستور زى بقية الخلق<br />دستور يقول للمصرى انت انسان<br />مش جاموسة ملكش راى ولا قيمة فى البلد<br />سلام"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309102815/http://www.20at.com:80/masr/news/15613-2010-03-06-19-21-53.html"

[[comments]]
order = 4
subject = ""
author = "الملكية ارحم كتير"
posted = "2010-03-07"
text = "بالنسبة لحالنا نحن دول العالم الثالث او الدول الشرقية<br />النظام الملكي ارحم كتير اوي من النظام الجمهوري<br />لان النظام الملكي بيبقى فيه حاجه اسمها ولي العهد<br />لما الملك بيخرف او بيتعب على طول ولي العهد بيباشر امور الدولة<br />لكن في الحالة الجمهورية اللي زي بتاعتنا رئيس الجمهورية بيفضل متبت وما بيثقش في حد لغاية ما نشوف الحالة اللي في الصورة دي<br />بصو في الصورة<br />تماما زي ما عمل الحبيب بورقيبه بتاع تونس<br />كان هيكل عظمي بيتنقل لغاية ما شالو الراجل اللي موجود دلوقتي<br />يا حسني مبارك<br />عين ابنك يا ابني وارحم نفسك احنا موافقين ان جمال مبارك يمسك<br />عينه وريح نفسك وريحنا"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309102815/http://www.20at.com:80/masr/news/15613-2010-03-06-19-21-53.html"

[[comments]]
order = 5
subject = ""
author = "مستشفيات المواشى"
posted = "2010-03-07"
text = "سيادة وزير الصحة الجبلى كان من اسبوعين بيفحص نفسة فى مستشفيات لندن على حساب الدولة ب 10 الاف يورو<br />والاستاذ كمال الشاذلى نجم الحزب الوطنى بيتعالج الان على حساب الدولة فى مستشفيات اوروبا<br />ووزير المالية يوسف بطرس غالى اتعالج فى مستشفيات امريكا الشهر اللى فات بمليون جنية على حساب الدولة<br />وحسنى مبارك بيتعالج على حساب الدولة بكم مليون - اللة اعلم - رغم ان ابنة عندة 750 مليون دولار<br />امال المستشفيات والدكاترة فى مصر بيعالجوا مين<br />المواشى والبقر والبهايم<br />هو احنا مش بشر زيهم<br />انا مش عايز واحد ابن منيوكة يعمل اعلان فى التليفزيون ويقول ادفع ضرايب<br />ضرايب لية<br />علشان يتعالجوا بيها برة<br />واحنا نشرب من المجارى<br />الهى يرجعوا كلهم فى صناديق على قرية البضائع ويندفنوا فى مقابر الصدقة"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309102815/http://www.20at.com:80/masr/news/15613-2010-03-06-19-21-53.html"

