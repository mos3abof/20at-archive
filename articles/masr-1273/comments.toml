subject = "جاتكوا فضيحه يا طبقه قبيحه .:. وعامله فصيحه وجايبه العار ...."
author = "إبن بهيه"
posted = "2006-12-11"
text = "مع احترامي للجميع وللأخت هبه ربيع كاتبة الموضوع .. إلا أنني لم أقرأ غير الحرفين بتوع المستشار مرفوع الهامة هشام البسطويسي ((ربنا يحميه ويحمي إخوانه الشرفاء) .. والباقين من كدابين الزفه .. رايح أقولهم بعض كلام عمنا الفاجومي ... جاتكوا فضيحه يا طبقه قبيحه .:. وعامله فصيحه وجايبه العار .:. قروانجيه وكلامنجيه .:. وسمسارجيه وسمساردار<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045730/http://masr.20at.com:80/article.php?sid=1273"

[[comments]]
order = 1
subject = "فتح عينك تاخد جايزه"
author = "محمد المصرى"
posted = "2006-12-11"
text = "لحد وقت قريب كنت فاكر ان الكوسه والقرع من اهم المحاصيل اللى بتتميز بيهم مصر اما بعد ماقريت خبر حصول سيدة مصر الاولى<br />سوزانكو على جايزة حقوق الانسان من برلين بالمانيا قلت فى عقل بالى بركاتك يا مبارك انت ومراتك حلت على الكره الارضيه بحالها وكنت اتمنى ان سوزان هانم تاخد معاها ( رمضان التوربينى ) وكمان بقية الشله بقو .. وبزازه ... وحماطه والسويسى<br />ليكونوا شاهدين وخير دليل على جهودها هى وجوزها والنحروس الصغير جيمى بيه من اجل الشعب المصرى وحقوق الانسان وبالمناسبه كتبت قصيده جديده اهديها برضه لعمنا احمد فؤاد نجم وجميع الشعب المصرى الغلبان<br />فتح عينك تاخد جايزه<br />مليون جايزه كمان لو عايزه<br />بص يا محسن وانتى يا فايزه<br />ماما سوزان قال اخدت جايزه<br />جايزه لحقوق الانسان<br />المصرى المهرى الكحيان<br />هى وجوزها التور ابو ودان<br />ضحكوا على عقل الالمان<br />سافروا على العاصمه برلين<br />على حسابنا يا مستمعين<br />سايبنا عرايا وجعانيين<br />نستنى معونه واحسان<br />ارجع مصر يا ابن الهرمه<br />وهات القرشانه بنت الصرمه<br />خلى فى وشكوا حبة حشمه<br />دا بكره المستخبى يبان<br />وشوبش يا حقوق الانسان"
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045730/http://masr.20at.com:80/article.php?sid=1273"

[[comments]]
order = 2
subject = "هات العدل"
author = "أحمد مطر"
posted = "2006-12-12"
text = "إدعُ إلى دينِـكَ بالحُسـنى<br />وَدَعِ الباقـي للديَّـان .<br />أمّـا الحُكْـمُ .. فأمـرٌ ثـانْ .<br />أمـرٌ بالعَـدْلِ تُعـادِلُـهُ<br />لا بالعِـمّةِ والقُفطـانْ<br />توقِـنُ أم لا توقِـنُ .. لا يَعنـيني<br />مَـن يُدريـني<br />أنَّ لِسـانَكَ يلهَـجُ باسـمِ اللهِ<br />وقلبَكَ يرقُـصُ للشيطـانْ !<br />أوْجِـزْ لـي مضمـونَ العَـدلِ<br />ولا تـَفـلـِقـْـني بالعُنـوانْ .<br />لـنْ تَقـوى عِنـدي بالتَّقـوى<br />ويَقينُكَ عنـدي بُهتـانْ<br />إن لم يَعتَـدِلِ الميـزانْ .<br />شَعْـرةُ ظُلـمٍ تَنسِـفُ وَزنَـكَ<br />لـو أنَّ صـلاتَكَ أطنـانْ !<br />الإيمـانُ الظالـمُ كُـفرٌ<br />والكُفـرُ العادِلُ إيمـانْ !<br />هـذا ما كَتَبَ الرحمـانْ .<br />( قالَ فُـلانٌ عـنْ عُـلا ّنٍ<br />عن فُلتـا نٌ عـن عُلتـانْ )<br />أقـوالٌ فيهـا قولانْ .<br />لا تَعـدِلُ ميـزانَ العـدْلِ<br />ولا تَمنحـني الإ طـمـئنـانْ<br />د عْ أقـوالَ الأمـسِ وقُـل لي ..<br />ماذا تفعـلُ أنتَ الآنْ ؟<br />هـل تفتـحُ للديـنِ الدُّنيـا ..<br />أم تَحبِسُـهُ في دُكّانْ ؟!<br />هـلْ تُعطينا بعـضَ الجنَّـةِ<br />أم تحجُـزُها للإخـوانْ ؟!<br />قُـلْ لي الآنْ .<br />فعلى مُختَلـفِ الأزمـانْ<br />والطُغيـانْ<br />يذبحُني باسم الرحمانِ فِداءً للأوثانْ !<br />هـذا يَذبـحُ بالتَّـوراةِ<br />وذلكَ يَذبـحُ بالإنجيـلِ<br />وهـذا يذبـحُ بالقـرآنْ !<br />لا ذنْبَ لكلِّ الأديـانْ .<br />الذنبُ بِطبْـعِ الإنسـانِ<br />وإنَّـكَ يا هـذا إنسـانْ .<br />كُـنْ ما شِـئتَ ..<br />رئيسـاً،<br />مَلِكـاً،<br />خانـاً،<br />شيخـاً،<br />د هـْقـاناً،<br />كُـنْ أيّـاً كانْ<br />من جِنسِ الإنـسِ أو الجَـانْ<br />لا أسـألُ عـنْ شَـكلِ السُّلطـةِ<br />اقرأ بقية التعليق .."
archived = "2006-12-13"
capture_url = "https://web.archive.org/web/20061213045730/http://masr.20at.com:80/article.php?sid=1273"

