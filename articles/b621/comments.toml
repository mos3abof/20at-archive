[[comments]]
order = 0
subject = "سبحان الله"
author = "ابواليمان"
posted = "2006-03-27"
text = "منذ اكثر من عشرين عاما وانا اسكن مقابل القلعة واتمتع برؤيتها صباحا ومساءا واتأمل في صنع الخالق ..نعم ان القلعة هبة الله لاهل عمان ....لكن التحديثات الاخيرة التي تمت بالرغم من جمالها الا انها اصبحت مؤذية بعض الشيء لما تحول هذا القصر (المسجد)الاسلامي القديم الى مكان للفرق الموسيقية وتصدح فيه الموسيقى من منتصف الليل الى ساعات الفجر الاولى وكأن تنشيط السياحة لا يتم الا باقامة السهرات الليلية الى الصباح..وبرغم هذا فستظل القلعة من اهم ذكريات الطفولة والشباب وسلمت لنا يا عمان."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133334/http://www.20at.com/article2.php?sid=621"

