posted = "2006-03-27"
text = "ياااااااااه هوفيه حد عايز يسافر عمان ، عموما لو ماكنتش عايز دلوقتي عايز اروح اشوف المكان ده وبالمرة ممكن اطلع فوق اي جبل من السبعة وارمي نفسي من اللي بيحصل في البلد دي"
