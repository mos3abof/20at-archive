posted = "2010-03-04"
text = "يااحفاد المحتار ديروا قرار بشن الحرب على الكفار<br />الحرب انديروها مش بالطيارات نبوها امغير احساب نصفوها<br />وخل نتهارمصارفهم وتبقى دمار<br />نعم من الواجب على كل مسلم أن يوقف التعامل مع الدولة السوسيرية تحت أي ظرف من الظرف وسحب كل الاموال الموجودة بالمصارف السويسرية وايقاف التعامل التجاري معها وكذلك الشركات ومهم مهم مهم جدا ايقاف بيع البترول الخام اليها الذي يصدر من البلاد الاسلامية ونعرفهم من نحن المسلمين<br />اليس الغرب من يفرض عقبات على الدول العربية لأتفه الاسباب<br />لماذا لاتقف الحكومات العربية وقفة واحدة تشعر بها الشعوب العربية بأنها وقفة غز واسترداد لكرامة سلبت وعرض انتهك وحرمة دنست من قبل عبدة الصليب<br />ان الإساءات للنبي صلى الله عليه وسلم كثرت والحكومات تتفرج والشعوب لا حول لها ولا قوة ومازال التعامل معهم مستمر لإدارة مصانعهم وخلق مواطن العمل لشعوبهم بأموال اسلامية وعربية<br />أليس هناك نخوة عربية أم انها اندثرت تحت جبروت المال والانبهار بالغرب وترك قيم زمبادي وتراث العرب<br />فله الحق باعلان الجهاد ضدها بل يجب الجهاد ضد اعداء الاسلام اينما كانوا ."
