text = "اخيرااااااااااا ااااااااااااا<br />شفنا فيديو كليب محترم<br />و هادف<br />و اخراج كويس<br />و اخيرا اقتنعوا انها وسيلة لو استخدمت لخدمة الدعوة بشكل احترافي و موجهة بشكل مدروس هتفيد المجتمع<br />اخيرااااااااااا اا<br />صح النوم ياعرب … !!!<br />المصممين و المخرجين و شباب النت بيكلموا في القصة ده من سنين اول ما عرفنا النت و احنا بنعمل كده بس مفيش حد كان مصدق ولا واخد الموضوع بجدية"
