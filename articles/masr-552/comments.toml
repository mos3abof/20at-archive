[[comments]]
order = 0
subject = "حرام عليكم"
author = "يا اخواننا مينفعش كدة هو لسة فيه حد بيناقش الولية المرتدة الكافرة دي ؟ هو احنا ناقصين هبل ؟ بكرة تيجوا تكتبوا تعليق ومناقشة لتصريح من جمال مبارك ماهو ده اللى ناقص"
posted = "2006-06-21"
text = "يا اخواننا الولية دي كافرة من زمااااااااان اوى اوى ومعروفة يعني مش مستنيين حد يعرفنا بيها لا وكمان الموقع بينقل كلامها على انه حرية وشىء جميل وناقص يدعوا يقولوا ربنا يهدي العرب ويسمعوا منها<br />يا اخواننا ربنا فى القران بيقول ( ادعوهم لابائهم) والولية دي بتقول لا انا مش مقتنعة بالكلام ده وعايزة اسمي نفسي باسم امي يعني بتقول لربنا صراحة انت كلامك يارب مش عاجبني وانا هاغيره ومش مقتنعة بية اساسا<br />ونقطة الحجاب .. ربنا بيقول فى القران ( وليضربن بخمرهن على جيوبهن) يعني يا أيها المسلمات المؤمنات بالله غطوا رؤوسكن وصدوركن بالخمار واحتجبن به عن اعين الطامعين و (ولا يبدين زينتهن الا ما ظهر منها) تقوم تيجي الكافرة دي تقولها صراحة انا ضد الحجاب يبقى ننقل كلام عنها لية اصلا؟<br />ياريت لو سمحتم تختاروا موضوعاتكم كويس وتشيلوا الموضوع ده عشان ما ينزلش فى الارشيف<br />والسلام عليكم"
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624161301/http://masr.20at.com:80/article.php?sid=552"

