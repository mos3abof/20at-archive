[[comments]]
order = 2
subject = "نوال ال00 سعد 0000ااااوي"
author = "الاستاذشيكو"
posted = "2006-06-21"
text = "اولا انا مش شايف اي ضرر ان الموقع يشيل كلام الست ااااااسف اقصد الراجل ييييه ااااااااسف والله انا محتار هي ست ولا راجل<br />مااااااااااااعلينا لازم الكلام بياعها يتشال من المقال انا دااااااااخل علي حس عنوان (البورصه 00مرات البورص)<br />مع ان البورصه وهي نواااااااااااااال هي كان نفسها ان يكون التكاثر يكون زاتيا من غير زواج ولا الراجل يحتاج للست ولا الست تحتاج للراجل<br />والله الست دي دماغها تعبانه والله !!!!!<br />فيها صراصير بتجرى في نفوخها وكل ماتتحرك تتطلعلنا بحكايه جديده<br />هى مش عاجبها الحجاب ولا عجبها العرى اما عايزة ايه يا غندورة عايزة تتحرر والله انا فهمي تقيل وعايز افهم هى عايزة ايه بس لا هي مع اليسار ولا مع اليمين عارفين هي عايزة ايه 000000 انحلااااااااال<br />والله هى عايزة كدة مش حاجه تانيه انحلال في كل حاجه القيم والاخلاق والاسرة والمجتمع<br />عايزة اللي هى مقتنعه بيه بس هو اللي يتعمل وغير كده يبقى تخلف ورجعيه وقلت فهماو سلبيه مباشرة من الناس<br />انا مستعد اتجوز الست نوااااااال لو هى محتاجه لعريس ابن حلال واخلاق كويسه مع انها عضمه كبيرة عليا بس مش مشكله انا هاضحي عشان البشريه اصل انا حاسس ان اللي هى فيه ده سببه الفرااااااااغ العاطفي وانا هاملاة"
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624161301/http://masr.20at.com:80/article.php?sid=552"

[[comments]]
order = 3
subject = "ما هذه الحقارة؟؟؟؟؟؟؟؟.. ياكل مصر الثورة الآآآآن"
author = "مصرية"
posted = "2006-06-22"
text = "كاتبة المقال.. هدى وكمان طه ..كنت فاكره ان اسمك حيكون راشيل كوهين تبقى مبلوعه لكن واضح ان مسلمة لكن الظاهر انه مجرد ملىء فراغ فى خانة شهادة الميلاد وان معلوماتك عن دينك لا تتعدى ال kg1..اعجابك الغريب ووصفك لهذه العجوز الخرفه التى عفى عليها الدهر وانفضت الأنظار من حولها وأخذت تحاول جذب الأضواء اليها مرة اخرى بعمل فرقعة اعلامية واسعة بالتطرق الى موضوع يمس الدين الأسلامى وشرائعة..بالأضافة الي تصنيفها الدينى المعروف.. وصفك لها بالمناضلة الجريئة والشجاعة امر يثير السخرية منكما معا ..أى نضال هذا تقصدين؟؟ نضال ضد تعاليم الأسلام؟.؟؟.ام نضال لترك المرأة المسلمة التمسك بدينها والانجراف فى تيار الفساد الفكرى المناهض للاسلام؟؟؟..اذا كانت هذه المرأة الخرفة مثلا أعلى لك فى النضال ومعجبة بها لدرجة ان تطرحى وجهة نظرك على الملأ ..فأرجوك أعفينا منك ومنها الوضع لا يحتمل المزيد من المصائب التى تصيب الوطن ..مصر مليئة بمصائب الدنيا ولا ينقصها مصائب الدين<br />اتقى الله فى دينك وفى وطنك ولا تتبعى الكفرة الفجرة فيكون حسابك عند الله عسيرا اقراى كتبا تفيدك فى الدراية بتعاليم دينك وتقربك من الله وتنير لك الطريق ..طريق الهداية والصلاح بدلا من طريق الهلاك الذى يزينه الشيطان من خلال أمثال هؤلاء الفجرة ..المناضلين الحق هم من فى السجون أو خارجها يكافحون من أجل اقتلاع هذا الفساد من مصر ..وحماية اجيالها الحالية والقادمة من التيارات المدمرة التى يدعوا لها الفاسدون المفسدون فى ارض الوطن..ورجاء ازالة هذه القمامة من الموقع فورا فهو مثير للاشمئزاز والغضب<br />أخى جاوز الظالمون المـــــــــدى<br />فحق الجهـــــــاد وحق الفـــــدى<br />يا كل أبناء مصر ..الثــــورة الآآآآآآآآآآآآآآآآن"
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624161301/http://masr.20at.com:80/article.php?sid=552"

[[comments]]
order = 4
subject = "كل هذه الكراهية"
author = "وليد نصر الدين"
posted = "2006-06-22"
text = "فى البداية احب ان اعرف بالكاتبة هويدا طه والتى تكتب مقال اسبوعى بجريدة القدس العربى وهى من اكثر الكتاب عمقا فى نقد النظام المصرى ومساندة خطاب التغيير ،ثانيا كل هذه الغوغائية فى التعامل مع انسانة مختلفة والسخرية القبيحة من ملامحها تدل على انحطاط حقيقى وعميق ،ببساطة : نوال السعداوى انسانة مختلفة فى مجتمع يكرس الانحطاط واراهن ان يكون احد ممن يسخر منها بهذة الطريقة الفجة قد خرج يوم فى مظاهرة او تمرد حتى على مدرس الالعاب فى مدرسته،عيب هوه مافيش احترام حتى لفرق السن"
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624161301/http://masr.20at.com:80/article.php?sid=552"

[[comments]]
order = 5
subject = "مش عارف"
author = "أن فعلا مش عارف الست دي عايزة إيه"
posted = "2006-06-22"
text = "أنا كل يوم بسمع منها حاجة غريبة ( ده أقل تعبير يقال عن اللي الهانم بتقوله )أن ضد الحجاب و ضد التعري ؟؟؟؟!!!!طب ياريت تشرحي لنا سيادتك عايزة إيه<br />أما حكاية لقب المناضل و المكافحة و المنكوشة و الحجات دي فالالألقاب على قفا من يشيل و على راي أنيس منصور عندما تكون الألقاب لكل الناس تفقد معناها فالعسكري بقى باش و الزبال بقى بيه مع احترامنا لمهن هؤلاء"
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624161301/http://masr.20at.com:80/article.php?sid=552"

[[comments]]
order = 6
subject = "اتقوا الله"
author = "محمود صباح"
posted = "2006-06-22"
text = "الاخ وليد ليا عندك سؤال كم مرة خرجت نوال السعداوى فى مظاهرة ؟؟ بلاش اين هى من انتهاكات الشرطة للصحفيات فى الاحداث الاخيرة التى شهدتها مصر ؟ بلاش كده برضة احنا اتبهدلنا من الامن فى المظاهرات الاخيرة ومع انى معرفكش لكن اعتقد ان اللى زيك فارس على الكيبورد وفقط والا كنت شفتك انا او غيرى فى المعتقل او فى المظاهرة لكن انك تتكلم عن اى واحد ينتقد المدعوة نوال زينب السعداوى وتتفلسف بكلام والسلام ده يبقى عيب وعيب على كاتبة المقال برضه انها تقول على واحده زى دى انها مناضله !!!! بأمارة ايه وفين هو النضال ده اتقوا الله وبلاش قرف ؟؟"
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624161301/http://masr.20at.com:80/article.php?sid=552"

