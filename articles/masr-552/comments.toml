[[comments]]
order = 10
subject = "و ايه يعني؟"
author = "دينا أحمد"
posted = "2006-06-24"
text = "يا سادة، أنا فتاه مش محجبة و مش عريانة، يمكن لبسي أكثر حشمة من الكثير من المحجبات اللاتي أراهن في الشوارع و الجامعات...و أنا فقط من يحكم عليه. أنا أعمل و أدرس و اجتهد و أحقق ذاتي و أعامل الكون بالحسنى، لست محجبة و لكني لست كافرة، لا أرفض السلام باليد على زملائي الرجال، و هم في وجودي، و هذا ثمرة سلوكي، لا يتلفظون بقول أو فعل قد يكون فيه شبهه خروج عن الأدب<br />مش كل من يختلف معك يا عزيزي هو الشيطان، و لا كل من يتفق معك أو يعيد برمجة عقلك هو ملاك، لا تسب الأخر فقط لأنه مختلف."
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624161301/http://masr.20at.com:80/article.php?sid=552"

