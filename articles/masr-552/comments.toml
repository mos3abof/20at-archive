[[comments]]
order = 8
subject = "الى الاستاذ محمود"
author = "وليد نصر الدين"
posted = "2006-06-23"
text = "اتمنى ان اوضح بعض الاشياء<br />بداية انا ادافع عن حق الاختلاف ولا ادافع عن اراء نوال السعداوى فهى يمكنها ان تفعل ذلك،<br />ثانيا : انا مستغرب من حكاية مابنزلش مظاهرات ،هوه حضرتك بتكتب اسماؤهم عندك مثلا ،عموما انا موجود فى كفاية من بدايتهاواسال جورج اسحق عنى ونزولى المظاهرات واجب اراه دينيا ووطنيا ولا احب ان ازايد فى هذا<br />اما مسالة فارس الكيبورد فالكتابة ايضا شجاعة وانا بحترم كل الشباب المصرى الذى يهاجم النظام المصرى على الكيبورد حتى لو تهيب ان ينزل فى مظاهرة<br />نريد وطنا يحترم الجميع فيه الجميع ،هكذا ببساطة وشكرا"
archived = "2006-06-24"
capture_url = "https://web.archive.org/web/20060624161301/http://masr.20at.com:80/article.php?sid=552"

