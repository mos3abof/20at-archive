[[comments]]
order = 16
subject = "قول .. قول كمان"
author = "عمر عباس"
posted = "2006-05-20"
text = "قول كمان .... وحياة ابوك فكرتنى بأيام 1972 كنا عاملين مظاهرات علشان نحارب ...<br />وكانت اشعار واغانى نجم والشيخ امام أكلنا وشربنا ..<br />انت قلب يا أبنى ... قول .... فهذا زمن قل فيه الانسان ... واصبح من على المائدة هم الفتات ....لا تقترب منهم ... احذر شعراء السلطان ... كن من شعراء الشوارع<br />حتى يظل قلبك ينبض بالحب ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131714/http://www.20at.com/article2.php?sid=820"

[[comments]]
order = 17
subject = "قلمي الرصاص"
author = "دعاء الشامي"
posted = "2006-05-20"
text = "ياجماعة احنا شباب يعني الذكاء والفطنة مطلوبين في المرحلة السنية دي والا يعني بعد عشرين سنة هتعملوا ايه عموما موضوع القلم الرصاص والسلام عليكم واشتباك وحياتنا هي مسميات جديدة للاقسام في عشرينات اصلنا بتوع تطوير وبصراحة الحال الواحد مش سكتنا<br />قلم رصاص- القسم الثقافي والفني<br />اشتباك- قسم السياسة<br />السلام عليكم- القسم الديني<br />حياتنا- علاقات ومنوعات<br />وان شاء الله خلال فترة قريبة هتشوفوا شكل جديد للصفحة ويارب تكون المسيات عجبكم وكمان الموضوعات<br />وسلام مخصوص من قلمي الرصاص"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131714/http://www.20at.com/article2.php?sid=820"

