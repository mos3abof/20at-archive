text = "مش معنى انى برد باسم الموقع معني كدة ان انا صاحبه الموضوع .. انا مش محمد ولله العظيم ..<br />عامة الموقع بقى يشرح نفسه ولو ان ممكن تاني اقول انها ابواب حياتنا ده باب المنوعات زي فنون وزي باقي الابواب .. وبعدين ولاد البلد ايه وعشرينات ايه مهو كله بيودي لروما .. صلو ع النبي"
