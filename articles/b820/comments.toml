subject = "\"ها \" عايزين نفهم .."
author = "مش شغلك"
posted = "2006-05-18"
text = "كويس انك اتكلمتي يا سوسه عشان انا حبتدي انقد اهووووو في الموقع ,<br />عمرك اطول من عمري ايه حكايه قلم رصاص وحبر وحياتنا وممتنا وخبر ميت وصاحي والحاجات دي فهمووووووونا قبل ما تعملو حاجه , تاني حاجه بقي في مواضيع بقلها قرن ياريت تشلوها , ويعني انتو بتغيظو فينا حطين \"ايان هيرسي \" من جمالها يا خي مرتين ايه دا, شويه مش نقد يعني مدح<br />اختيركم للصور في الكام يوم اللي فاتو حلوين ... استنوني كل جمعه مع مزيد من التفاصيل \" اما هريتكوا ..\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131714/http://www.20at.com/article2.php?sid=820"

