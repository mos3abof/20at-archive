author = "مصرى"
posted = "2010-01-30"
text = "بهدوء شديد جدا<br />الفريق الجزائرى بيلعب ممتاز جدا وبطريقة رائعة وفيها فن وهندسة واحسن من الفريق المصرى مائة مرة<br />ولكن عندهم نقطة ضعف رهيبة جدا هى ان حارس المرمى الجزائرى تعبان جدا ولو عندهم حارس مرمى شوية صاحى كان غلبوا المنتخب المصرى<br />الفريق المصرى لا يلعب كورة اطلاقا - كل اهدافة فى دورة افريقيا مبنية على الهجمات المرتدة وسرقة اجوان<br />ولكن الفريق المصرى نقطة قوتة الجبارة هى حارس المرمى الحضرى الموهوب<br />ولولى الحضرى لهزم الفريق المصرى شر هزيمة من حتى بنين<br />الفريق المصرى هو الحضرى والباقى اصفار<br />واحسن فريق فى دورة افريقيا هو الفريق الممتاز والذى يلعب كورة اوربية هو فريق الكاميرون<br />محلل رياضى من على مصطبة دشنا البلد"
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131122138/http://www.20at.com:80/masr/review/15108--4-0.html"

