text = "أولا مبروك للمصر.<br />لكن في مباراة نصف نهائي بهذا التحكيم آسف …أردنا أن تكون مباراة رياضية بروح عالية<br />الكل شاهد كيف أخد مدافع المنتخب الجزائري البطاقة الصفراء من غير مبرر.<br />كذلك توقف اللاعب المصري عند ضربة الجزاء.<br />وكيف دخل اللاعبين المصريين منطقة 18متر قبل ضربة الجزاء.<br />زد على ذلك الروح التمثيلية العالية للمنتخب المصري الذي رأيناه يسقط في الملعب بدون مبررات."
archived = "2010-01-31"
capture_url = "https://web.archive.org/web/20100131122138/http://www.20at.com:80/masr/review/15108--4-0.html"

