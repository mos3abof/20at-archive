author = "منديل الحلو"
posted = "2009-10-21"
text = "يكونش دى المنديل اللى غنى لة زمان المطرب كارم محمود<br />منديل الحلو يا منديلة على دقة قلبى لا اغنى لة<br />والا منديل المطرب العطار<br />افرش منديلك على الرملة وانا الف واجيلك على الرملة<br />اة يا زمن المناديل<br />او زمن الدلاديل<br />هو برضة فرصة الاخ بطرس غالى ياخد ضريبة مبيعات 45 % وينعنش الخزينة شوية وخصوصا ان الحاجات دى بيبقى عليها سحب جامد قوى"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022121953/http://www.20at.com:80/masr/2khbar/13776-2009-10-21-07-26-20.html"

[[comments]]
order = 1
subject = ""
author = "الخبر ناقص"
posted = "2009-10-21"
text = "اولا الخبر ناقص<br />المناديل دى بيستخدموها ازاى واية اثرها وبتعمل اية<br />ثم الاهم تباع فين وسعرها كام<br />وبعدين احنا بنشكر حكومة الصين اللى بتعمل حاجات تزبط المسائل وعارفة احتياجات الشعب المصرى<br />شكرا حكومة الصين<br />ويا ترى حكومة نظيف هتوزعها على بطاقة التموين وهتدفع لها دعم والا هتنباع فى السوق السوداء<br />تجربة الجديد برضة كويس<br />شكرا للصين"
archived = "2009-10-22"
capture_url = "https://web.archive.org/web/20091022121953/http://www.20at.com:80/masr/2khbar/13776-2009-10-21-07-26-20.html"
