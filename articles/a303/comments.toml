[[comments]]
order = 4
subject = "مش لازم المزاح يكون بالتجاوز"
text = "يا ريت الناس ترتقي شوية بلغتها وألفاظها.. يعني ضيعتوا جمال الموضوع بتعليقاتكم اللي ملهاش معنى أصلا ولا ليها علاقة.. أنا مستغربة ازاي الموقع يسمح بكده؟؟ ليه الانحطاط ده في مستوى شباب \"عشرينات\" .. ليه الناس حتى في المواضيع القيمة ماتكونش على نفس المستوى في التعليقات.. حتى لو الشباب بيهزر.. بس يا ريت الأسلوب يكون أرقى من كده.. ويا ريت التعليقات تكون إلى حد مناسبة.. ربنا يوفقكم يا عشرينات. ويا ريت توصلوا لناس مختلفة عن قراءكم الحاليين - مع حرصنا على وجودهم - أو يا ريت لو فيه ناس تانية بتقرأ تعلق علشان يكون فيه نوع من التوازن.. ربنا ينفع بالجميع"
archived = "2004-07-06"
capture_url = "https://web.archive.org/web/20040706110615/http://www.20at.com:80/article.php?sid=303"

