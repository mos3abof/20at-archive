[[comments]]
order = 9
subject = "رجاء"
text = "الموضوع جيد .. لماذا لا تكتبون موضوعاً مثله عن الكلامات العربية التي نقلت إلي الإنجليزية .. وآخر أيضاً عن الاكتشافات العربية التي نقل عنها اكاشافات غربية حتى يعي الجميع من هم العرب والمسلمين"
archived = "2004-07-06"
capture_url = "https://web.archive.org/web/20040706110615/http://www.20at.com:80/article.php?sid=303"

[[comments]]
order = 10
subject = "كريم"
text = "الفكرة جديدة<br />الطرح جيد<br />الموضوع هام جدا فما أحوجنا وأحوج الاجيال القادمة للتذكر بأننا كان لنا حضارات أثرت حتى الأن في العالم المتمدين والتذكير بهذا من مثل هذه الموضوعات الهادفة، وما أحوجنا إلى التذكير بفضل الحضارة العربية والاسلامية على الغرب، ومع التذكير أتمنى أن نجد في حاضرنا ما نذكر به أبنائنا من فضل على الحضارة الغربية ولا نريد أن نقول \"كنا\" بل نريد أن \"نكون\"<br />لكن لي تعقيبين إن سمحت لي<br />أولا:موضوعاتك ياشيرين تحمل جديدا مفيدا مع طرح جيد وخاتمة أيضا جيدة لماذا أشعر ان المنظومة غير مكتملة سواء من خلال العناوين موضوعاتك أو من خلال المقدمات أتعبي شوية ياشيرين في اختيار العنوان والمقدمة حتى تكتمل مقومات موضوعاتك تحياتي وإلى الأمام"
archived = "2004-07-06"
capture_url = "https://web.archive.org/web/20040706110615/http://www.20at.com:80/article.php?sid=303"

