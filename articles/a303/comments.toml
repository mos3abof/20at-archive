[[comments]]
order = 13
subject = "الــدوقـلـس"
text = "اصلن الحشيش ارجل حاجه في الحياه والمحششين رجـــال و الحشيش علاج للنفس لاتاخذو فكره سيئه عنو والحشيش 1:شقره وهذي مقطوعين منها. 2:الجميله ومكس فورد رجال وسقاره رهيبه تدخلك جو حلو جربها ودعيلي وانت الكسبان وسلام عليكم ياصوفيه مع تحياتي الدوقلس (*.*)"
archived = "2004-08-03"
