[[comments]]
order = 7
subject = "موقع عشرينات"
text = "*** تم حذف المداخلات التي خرجت عن نطاق مناقشة الموضوع.<br />وموقع عشرينات يرجو من السادة المعلقين عدم الدخول في قضايا جانبية أثناء التعليق على الموضوعات .. وسيتم مستقبلاً حذف أي تعليقات تخرج عن سياق مناقشة الموضوع."
archived = "2004-07-06"
capture_url = "https://web.archive.org/web/20040706110615/http://www.20at.com:80/article.php?sid=303"

[[comments]]
