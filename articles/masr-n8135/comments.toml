text = "صحيح دا اللى ناقص انن نتهم الاسكندر<br />ولا يمكن يثبتو ان الاسكندر كان مختل عقليا و لا حاجه<br />بس دى هتبقى بعيده عم عنيهم يبقو يلاقو مقبرته الاول<br />انا عايزه اقول الموضوع بيكبر و النار بيتنفخ فيها يا جماعه و خدو بالكم و الحدق يفهم بقى<br />و بعدين يا عبد الله انت عندك حق بس و النبى بالهدوء<br />صدقنى الموضوع مش ناقص<br />انا معاك ان ديننا فوق الكل و الاسلام فوق الرؤؤس بس انت فاهم قصدى"
