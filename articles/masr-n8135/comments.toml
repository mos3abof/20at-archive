[[comments]]
order = 20
subject = "القبط"
author = "مصرى"
posted = "2006-09-24"
text = "ياجماعه كلمة قبط يعنى مصرى و ليست معناهانصرانى او مسيحى أو مسيحى مصرى كلمة قبطى معناها المصرى القديم...انا عارف إن بعض الناس هاتقول و ايه يعنى!<br />بس ده خطير جدا...ده معناه ببساطه ان اللى مش قبطى مش مصرى و ان النصارى هم فقط المصريين و المسلمين اللى هم مصر نفسهامش مصريين.....<br />من فضلكم قولوا عليهم نصارى ...مسيحين ممكن...و خلاص...و يكفيهم شرفا اننا نقول مسيحى مصرى<br />ربنا يوفقنا جميعا على نظافة البلد من النظام اللى بيحكمنا انشاء الله"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117140922/http://masr.20at.com:80/article.php?sid=195"

[[comments]]
order = 21
subject = "لا يضر السحاب نبح الكلب"
author = "ناجى عوض"
posted = "2006-10-24"
text = "الى سفله المهجر وخنازير النصرانيه اقول لكم انبحوا يا كلاب ولا يضر السحاب نبح الكلاب وماهوش غريب عليكم الخيانه وقله الحياء ما انتم اتعلمتوه من كتبكم المحرفه المخرفه من اول اناشيد سليمان ثدياك كعنقود العنب الى زنى لوط ببناته الى قصه اهوله واهوليبه التى تستحق جائزه نوبل فى قله الادب والسفاله واخيرا الاسلام عالى فى السماء كالسحاب ولا يضر السحاب نبح الكلاب فانبحوا يا كلاب"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117140922/http://masr.20at.com:80/article.php?sid=195"
