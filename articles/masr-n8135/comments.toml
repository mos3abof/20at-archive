[[comments]]
order = 12
subject = "لا ...للتطاول وقلة الادب ...؟"
author = "مواطن مؤدب قبطى"
posted = "2006-04-21"
text = "ردى على الدكتور ..زلكن بتصحيح الصفة الى الطور ...لان الطور حيوان نطاح ولا يفقة ولا يفهم شىء بالمرة<br />الطور اللى كتب روجتة للمواطن اللى كتب اخر تعليق على اتهامات طائرة<br />يؤسفنى انة ...ميصحش انة يكون واحد بيجلس امام الكمبيوتر...ويكون سفية وغير مؤدب لان الادب فضلوة عن العلم<br />ومفروض حتى لو انة مش متربى ومن بيئة واطية لا يتطاول على واحد مؤدب لن يكون فى تعليقة غلط وانا لا اعرفة لكن متعاطف معة ...فية قانون نزلة السادات اسمة قانون العيب ....صاحبنا لن يعرفة اعزرة ؟<br />واية الفاظة السوقية اللى بيقولها لة انت مسكت سلك عريان ؟دة اكيد عربجى<br />وهو اللى عيان ومختل عقليا زى غيرة اللى بصددة احداث اسكندرية اللى كلنا بنستنكرها ...؟<br />كل واحد لة حرية تعبير عن ما يكون فى داخلة لكن بالادب والاحترام<br />ومن العيب التطاول والسب والاستظراف من قبل المواطن المسلم المعلق الذى لا يعرف العيب ...والفاظة تدل على انة من بيئة حقيرة وواطية وكفاية علية كدة منى"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022644/http://masr.20at.com:80/article.php?sid=195"

