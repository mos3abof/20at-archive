subject = "مصر فعلا فيها اضطهاد"
author = "reda"
posted = "2006-07-17"
text = "صر فعلا فيها اضطهاد، ولكنه ليس اضطهاد مسلمين لمسيحيين علي أساس ديني ، ولكنه اضطهاد أغنياء للفقراء ، انتبهوا وما تقعوا في الفتنة ."
archived = "2006-09-03"
