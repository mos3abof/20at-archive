[[comments]]
order = 2
subject = "ربنا يهدى"
author = "مسلمه"
posted = "2006-04-20"
text = "انا مره دخلت موقع مسيحى عن طريق الغلط من فتره كبيره<br />لقيت المسيحيين هارينا شتيمه واننا متضينهم وانهم مقهورون فى مصر<br />وبيقولو على شيوخنا زى الشيخ الشعراوى انهم ارهابيين وحاجات كده كتير<br />وكمان فى جريده مسيحيه قريت كذا عدد ليها لازم يتكلمو عن الاضطهاد واننا ارهابيين<br />الحقيقه انا طول عمرى فى مدارس وكليه اسلاميه<br />ولما جيت اختلط بالناس التانيين واشتغل معاهم حسيت انى مش قادره اتنفس وفى كل مكان صورهم حقيقى ده كان اول يوم واخر يوم شغل<br />وانا عايزه اقلهم خلينا عايشين مع بعض وخلاص بس من غير تجريح ولا اتهامات واحنا برضه هنسعهم معان هى دى اخلاقنا وربنا يهدى<br />اللهم اهدنا الى ما تحبه وترضاه"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022644/http://masr.20at.com:80/article.php?sid=195"

