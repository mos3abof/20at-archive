author = "ياأخى الفاضل"
posted = "2006-04-22"
text = "المسلم ليس بطعان ولا لعان ولا فاحش ولا بذيء'........<br />ليه كده , ما هوا مش هيغلب<br />و هيرد عليك برضوا و انت هترد عليه<br />و لن ينتهي احد , بالاضافة اى خروجكم بره الموضوع<br />يعنى خسارة من كل حتة ,<br />يعنى ان ابتديت بكلامك الاولاني و سبيته , الى خلاه يسب ديننا و يلعنا ,<br />و نجح المخطط بتاع الحكومة في الوقيعة بين المسلمين و الاقباط ,<br />لتتناسوا الهم الاكبر و هوا السرقة و الفساد و التوريث و الاسعار المولعة و الناس اللى بتاكل من الزبالة و اللى عايشين على الرصيف ...<br />حرام عليك يا اخوانا<br />خليكم في الهم اللى طايل الكل مسلم و مسيحي"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022644/http://masr.20at.com:80/article.php?sid=195"

[[comments]]
order = 16
subject = "أسلوب غير حضارى"
author = "أرى حوارات الأخوة"
posted = "2006-05-07"
text = "المسلمين والمسيحيين خارجة عن اسلوب الجدل السليم فلكل واحد منهج مؤمن بيه.<br />وأحب أن أوضح موقفنا كمسلمين من الكتاب المقدس ,ماقرأتم فى الكتاب المقدس يوافق العقل فأقبلوه وأن لم يقبله فتركوه.<br />وتذكروا أن بذلك الكتاب بعض اسماءالله الحسنى<br />كالقدير..فلا داعى لشتائم<br />أخوكم المسلم<br />عاشق الجنة<br />أرى حوارات الأخوة<br />المسلمين والمسيحيين خارجة عن اسلوب الجدل السليم فلكل واحد منهج مؤمن بيه.<br />وأحب أن أوضح موقفنا كمسلمين من الكتاب المقدس ,ماقرأتم فى الكتاب المقدس يوافق العقل فأقبلوه وأن لم يقبله فتركوه.<br />وتذكروا أن بذلك الكتاب بعض اسماءالله الحسنى<br />كالقدير..فلا داعى لشتائم<br />أخوكم المسلم<br />عاشق الجنة"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022644/http://masr.20at.com:80/article.php?sid=195"

