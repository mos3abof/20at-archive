[[comments]]
order = 18
subject = "الاخوة المسلمين"
author = "قبطي مصري صعيدي مسيحي"
posted = "2006-07-05"
text = "\"\" من فضلة القلب يتكلم اللسان\"\"<br />اذا كان دينك يحثك علي اداب الحديث و لا تحترمه فكيف لك ان تتحدث مع الاخرين و بالاخص من ليسوا علي دينك<br />تتكلم عن السادات و تمدحه لانه \"لبسنا طرح \" كما ذكرت ماذا كانت نهايته ؟ و بيد من ؟<br />هل دعوتك لدينك تبيح لك ان تجرح الاخرين و تتكلم عن دينهم بكل وقاحة ؟؟؟<br />اذا كان ردك بنعم فذه كارثة و ان كان بلا فمعناه انك......"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022644/http://masr.20at.com:80/article.php?sid=195"

