text = "لماذا ينسي النصاري التاريخ بالرغم من استشهادهم به دائماً .<br />اليس المسلمين هم من حرروهم من ذل الرومان واضطهادهم علي ايديهم لمده طويله ، هل اتت لهم امريكا ( التي لم تكن قد ولدت بعد ) أو اي دوله أوربيه ممن يتشدقون بالحريات والحضارات بهذا الحق.<br />او أنقذوهم من هذا الذل ، أم المسلمسن هم من فعل ذلك؟<br />وبعد كده يقولوا مضطهدين !!!!!!<br />صحيح اللي أختشوا ماتوا .وأخرة خدمه النصاري علقه"
