author = "يعنى انت متضايق من شتيمة الاخ اللى فوق و قاعد تقول فيه قصايد و انت عملت العن منه ,,,, الناس تقول عليك ايه دلوقتى !!!"
posted = "2006-04-21"
text = "يعنى ياريت يبقى فيه شوية ادب ( كلامي للطرفين ) عشان كده عيب و ميصحش و سيبتوا ايه للشوارعية ,<br />عايز تقول رايك قول بس بدون ان تسب و تلعن الطرف الاخر لانه على الاقل شئ من مكارم الاخلاق و التربية ....<br />بالاضافة الى ان من يشتم و يسب هو شخص جبان لانه يتخفى وراء جهاز كمبيوتر ..<br />فأستهدوا بالله , و عاوز اقول ان المسلم و المسيحي شركاء في الوطن و الاعداء كثيرون , فلازم نخلي بالنا لان المتربصون بمصر كثيرون"
