subject = "الى الأخ مسلم ومش معقد ومش فاهم لأنة مش دارس"
author = "العلم نورن"
posted = "2006-04-20"
text = "لا أظن ان عمرو ابن العاص والذى كان يمثل الفتوحات الأسلامية انة جة علشان خاطر سواد عيون النصارى لتخليصهم من الروم دة كان عينة على مصر بعد مافتح عمان وبلاد الشام بدليل انة بلط فى مصر بعد ما فتحها والسبب فى انة كان عينة على مصر انة كان تاجر وكان بيتردد كتير على الأسكندرية وومن ساعتها حط مصر فى دماغة لدرجة انة وقع خلاف بينة وبين عمربن الخطاب بيبب فتح مصر لأنة كان مصرًًر انة يستولي عليها وبعد كدة ينشر فيها الدين الأسلامى عنوة سواء عن طريق الأجبار الأقباط ( السكان الأصليين لمصر) على دفع الجزية او مضايقتهم واضطهادهم (خدعوك من قال ان الدين الأسلامى دين عدل وسلام)"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022644/http://masr.20at.com:80/article.php?sid=195"

[[comments]]
order = 7
subject = "ًًًََُُُُُُُإلي العاص أبن العاص"
author = "واحد بيكره الكذب"
posted = "2006-04-20"
text = "سؤال: هل فعلاً عمرو بن العاص دخل مصر علشان يحررها من الرومان؟<br />الإجابة: نعم حرر عمرو بن العاص مصر من الرومان و إحتلها هوَ<br />و فرض فيها الجزية يعني كأنك يابو زيد ما غزيت أحمد زي الحاج أحمد<br />سؤال: هل أستقبل الأقباط المسلمون بالورود؟<br />الإجابة: بالقطع لا<br />لإن مفيش إنسان يرضي بالإحتلال حتي لو كان من نفس دينه أو لغته لكانت الكويت رضيت بإحتلال العراق!!!!!!!<br />و كمان العرب يتكلمون العربية لا يعرفون القبطية يعني لم يكن هناك و سيلة إقناع و مصر بقت 200 سنة لا تتكلم العربية يعني مكانش الغرض نشر الإسلام<br />ألم تسمعون عن ثورة البشموريين بشمال مصر (بالطبع لا لإن المناهج التعليمية لا تدرس التاريخ القبطي)<br />ألم تسمع عن المجاعة التي حدثت بالجزيرة العربية و أرسل الخليفة لعمرو ليرسل له بالأموال و القوت للعرب هناك و إن لم يجد قال له المقوله المشهور ولو يأكل أولادنا أولادهم (و نعم التحرير)<br />ألم تعلم إن عمرو بن العاص بايع معاوية بن أبي سفيان للخلافة بعد وعده له بأن تكون مصر طعمة صائغة له<br />و أولاده لإنه كان خائفاً من العزل مثلما حدث سابقاً و تعيين عبد الله بن أبي السرح.<br />ألم تقرأ الوثيقة العمرية<br />كلام كتير و لكن للأسف الكل بيفتي بدون ما يعرف أبسط الأشياء عن التاريخ القبطي الذي هو تاريخ بلده الذي يعيش فيه<br />و خلينا مع زغلول الفشار بتاع الأنثربولوجي"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022644/http://masr.20at.com:80/article.php?sid=195"

[[comments]]
order = 8
subject = "بس يا كذاب يا من تكره الكذب"
author = "واحد مفقوع"
posted = "2006-04-20"
text = "بس يا كذاب يا إبن الكذاب و بطل هبل و مش هأرد عليك الا بشوية أسئلة بعد كل هذه الاباطيل اللى سردتها و منها طبعا الناس اللى بتاكل عيالها(ما تتفرجش على سبيس تون كتير ده مش كويس على صحتك) ..... انتا بتردد كلام البغبغانات من المغرضين و لأنى لا أريد أن أدخل فى مهاترات طائفية أسألك سؤال واحد فلنسلم جدلا إن عمرو إبن العاص إحتل مصر و مصر منذ فجر التاريخ معروف عنها إنها بتلفظ أى محتل غاصب و إذا كان التاريخ القبطى مش بيدرس فمعلش يا سيد الكذابين راجع التاريخ الفرعونى ... لماذا لم يلفظ المصريين الفتح الأسلامى أو الغزو الأسلامى!!! طيب بلاش دى لما تهجم على مصر غزاة من جميع أنحاء المعمورة من تتار و (قرايبك و أبناء جلدتك) لماذا لم يستغل المصريين الفرصة إن كانوا أكرهوا من البداية على الدخول فى الاسلام تحت ضغط الاحتلال الاسلامى أقول لماذا لم يناصروا أعداء المسلمين (من باب عدو عدوى يبقى صديقى) و أنتفضوا عليهم .. بلاش دى و لا دى .... طبعا بمنطقك الاسلام إحتلال و الاحتلال ظالم فى جميع الاحوال و قهر المصريين , طيب أذا كان بالاخلاق دى ليه يا شاطر زمانك ما قتلش الاقباط و نفذ فيهم التطهير العرقى (اللى نفذه قرايبك الصرب مثلا) و طبعا أذا كان الاقباط دلوقتى مثلا على حد قولهم حوالى 6 مليون فأكيد كنسبة و تناسب يمكن كان عددهم وقتها على أعلى أعلى تقدير حوالى 100000 مثلا فكان من السهل مثلا تقتل حوالى 5000 او 6000 منهم و ده سهل جدا على جيش أخرج الفرس و الرومان من بلادهم فالباقى من نفسه هيهرب و يكت على أى داهيه حفاظا على حياته و بمده ما يبقاش غير المسلمين بس و يريحوا دماغهم من القلاقل زى إنتفاضة مش عارف إيه اللى أنتا ذكرتها دى ... طيب ليه أبقى على الاقباط و أعطاهم الحرية فى التدين !! ... بلاش دى و لا دى و كلاكي<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022644/http://masr.20at.com:80/article.php?sid=195"

[[comments]]
order = 9
subject = "ولاتجادلوا أهل الكتاب إلا بالتي هي أحسن"
author = "مصري"
posted = "2006-04-20"
text = "ولا تجادلوا أهل الكتاب إلاّ بالتي هي أحسن إلاّ الذين ظلموا منهم، وقولوا أمنّا بالذي أنزل إلينا وأنزل إليكم وإلهنا وإلهكم واحد ونحن له مسلمون<br />ردا على القمص مرقس عزيز خليل<br />بسم الله الرحمن الرحيم<br />الحمد لله رب العالمين والصلاة والسلام على سيدنا محمد وعلى آله وصحبه، وأشهد أن لا إله إلاّ الله وحده لاشريك له وأن محمداً عبده ورسوله وأن عيسى ابن مريم عبد الله ورسوله وكلمته ألقاها إلى مريم وروح منه. أما بعد:<br />هذه مناقشة سريعة لما كتبه القمص مرقس عزيز خليل في جريدة الأهرام (عدد 41778 في 25/4/2001) رداً على مقال الأستاذ الدكتور زغلول راغب النجار والذي نشرته الأهرام في 23/4/2001.<br />و أبدأ هذه المناقشة بالتأكيد على أن النقاش بين المسلمين والنصارى ليس جديدا بل يعود إلى بداية الرسالة المحمدية الخالدة، و القرآن الكريم وضع لنا أسس النقاش والمجادلة مع أهل الكتاب وهم اليهود والنصارى وذلك بقول الحق (تبارك وتعالى): \"ولا تجادلوا أهل الكتاب إلاّ بالتي هي أحسن إلاّ الذين ظلموا منهم، وقولوا أمنّا بالذي أنزل إلينا وأنزل إليكم وإلهنا وإلهكم واحد ونحن له مسلمون\" (العنكبوت: 46).<br />حين بُعث رسول الله صلى الله عليه وسلم، كان بعض العرب من النصارى الذين إتبعوا دعوة نبي الله عيسى بن مريم (عليه وعلى أمه السلام)، كما كانت للنصارى دول على أطراف ديار العرب و بالقرب منها كالشام ومصر والحبشة. لذلك كان إتصال المسلمين بالنصارى مبكرا جداً من أول تاريخ الدعوة الإسلامية، وبالذات في مصر التي كان يحكمها المقوقس الذي أرسل له رسول الله (صلى الله عليه وسلم) برسالة يدعوه فيها إلى الإسلام، فرد المقوقس رداً حسناً ولكنه لم يسلم، وأوصى الرسول الكريم بأهل مصر خيراً فقال: \"إذا فتحتم مصرا فاستوصوا بالأقبا<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022644/http://masr.20at.com:80/article.php?sid=195"

