author = "Moshi"
posted = "2009-12-26"
text = "ياريت حد يقولى اقدر انسق الالون عشان دى مشكلتى الوحيده<br />فى شوية قواعد ممكن تساعد فى تنسيق الألوان مثلا :<br />- الأبيض و الأسود بيبقو حلوين مع بعض و ممكن اضافت تتش من لون مفرقع زى أحمر أو اصفر على شكل ايشارب او اكسسوار<br />- ممكن تلبسى كذا درجة لنفس اللون مع لعض زي مثلا روز فاتح و غامق مع بعض و هكذا<br />- فى مجموعات الوان بتمشي قوى مع بعض مثل:<br />درجات البنى مع الكريم و البيج<br />درجات الروز مع الجراى<br />- الأبيض بيليق معاه معظم اللوان بس ابعدى عن البنى مع الأبيض الناصع<br />- في الوان بيكون بنها كونتراست بتمشى مع بعض قوى بس بشرط يكون فى لون هوة الغالب و اللون الثانى بكمية أقل مثل:<br />الأصفر مع الأزرق<br />البرتقالى مع الأزرق<br />الأحمر مع الأخضر<br />البرتقالى مع الخضر<br />الأزرق مع البنى<br />-حذارى و لبس قطعة مشجرة مثلا مع قطعة أخرى مقلمة او مربعات و هذا يشمل الإيشارب.. حاولى يكون الحركة فى قطعة واحدة فقط و الباقى سادة<br />- فى طريقتين حلوين تمرنك على تناسق الألوان و هى انك تبصى على الألوان الموجودة مع بعض فى الطبيعة و تقلديها و إنك تلاحظى دايمان في فترينات المحلات المشهورة على طرقة تنسيقهم للألوان"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227031613/http://www.20at.com:80/banat/how-to/14536-2009-12-23-11-43-47.html?"

