text = "اكيد لو وصل عمرى 85 هقعد اقول الا ليت الشباب يعود يوما فأخبره بما فعل المشيب<br />و لو سن التقاعد 85 يبقى هكتب ف وصيتى لاحفادى ميتعلموش و ميدخلوش جامعات لان اكيد البطاله هتبقى لشوشتها ف البلد<br />بس انا متمناش اوصل للسن دى"
