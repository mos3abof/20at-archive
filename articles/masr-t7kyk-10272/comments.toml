[[comments]]
order = 1
subject = ""
author = "مش كاتب"
posted = "2008-10-18"
text = "حتى كمان زبالة المجتمع اللي بيشتغلوا على الزنا والفجور والدعارة والقواه ليهم نقيب<br />يا ترى دا نقيب حربية ولا شرطة<br />ليهم نقيب في حالة واحدة فقط عندما يقتصر الفن على خريجي معهد السينما ومعهد الفنون المسرحية يبقى كده النقابة ماشية صح والفن بيؤدي دوره في المجتمع من اجل توجيه الناس والنهوض بهم<br />اما الزنا واثارة الشهوات والفشح دا ما اسموش فن يا اسطى"
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715125951/http://www.20at.com:80/masr/t7kyk/10272.html"

[[comments]]
order = 2
subject = ""
author = "مش ححبك"
posted = "2008-10-18"
text = "وكل دا طبعا من فلوس الشعب الاهبل<br />اللي بقفل ساعتين في صابور العيش علشان خاطر ياخد عشرين رغيف بيدفع لروجينا هانم 800 الف جنيه علشان خاطر هز البطن وهز الوسط<br />هي اسرائيل مطلعة ميتين ابونا من شوية<br />من اللي احنا بنعمله في نفسينا<br />المفروض الممثلين دول يبقو موظفين حكومة ياخد مرتب زينه زي اي موظف<br />وح\\تلاقوا والله ممثلين اكفاء من معهد التمثيل يشتغلوا موظفين<br />مش ياخد 800 الف جنيه من دم الشغب اللي مش لاقي الطفح يطفحه"
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715125951/http://www.20at.com:80/masr/t7kyk/10272.html"

[[comments]]
order = 3
subject = ""
author = "مش ضروري"
posted = "2008-10-18"
text = "ايه يا احمد جاداله<br />ايه حكايتك يا ابني<br />هي قنبلة زرية<br />سما الراقصة الشعبية يعني هز يا وز<br />ايه المشكلة عايزلها دكتوراه يعني علشان خاطر تهز وسطها<br />دا انت عجيب اوي يا اخي وكلامك سخيف<br />يا ابني الفنانين دول شوية صيع على شوية شراديح على شوية ععواطلية على شوية حرامية على شوية اونطجية<br />ايه كيف تستطيعين وكيف تتنيلين<br />سؤال سخيف"
archived = "2009-07-15"
capture_url = "https://web.archive.org/web/20090715125951/http://www.20at.com:80/masr/t7kyk/10272.html"

