[[comments]]
order = 0
subject = "بس الأزهر حيرجع أزهر ..زي زمان"
author = "محمد السيد"
posted = "2005-11-30"
text = "زمان لما الآزهر كان أزهر ... كان بيخرج دعاة وسياسين وعلماء وكل حاجة ....<br />والتاريخ يشهد علي إن رجال مصر اللي كانوا بجد \"رجالة\" معظمهم اتخرج من الآزهر ...<br />لكن بعد التأميم ... قصدي بعد ضمه للحكومة ... وبعد ما اختيار شيخه أصبح بالتعيين .... تراجع ... تراجع ... تراجع ....<br />وبدل ما كان أول المدافعين والمقاومين .. ومخرج الزعماء والسياسين ... بيحاولوا يزرعوا جوانا الآن إنه صورة للفشل ولاتباع السلطان والسير علي هواه ... وللأسف كتير واخدين الصورة دي عن الآزهر ....<br />لكن الحقيقة غير كده تماما .... لسة في خير كتير في الأزهر .. وعلمائه وطلابه وخريجيه ... وحييجي يوم إن شاء يرجع لمكانه الطبيعي ويقود الدنيا ... للإسلام وبالإسلام ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-08-15"
capture_url = "https://web.archive.org/web/20070815123230/http://egyvote.20at.com:80/article.php?sid=80"

