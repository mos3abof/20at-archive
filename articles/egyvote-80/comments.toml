subject = "هو لما يتكلموا بمرجعيتهم اللي هي الإسلام يكونوا غلط ؟؟حاجة غريبة والله"
author = "زائر"
posted = "2005-11-30"
text = "كاية الإخوان والخطاب الديني دي ....... خلاص كفاية كده مش حأعلق عليها ...<br />رغم اختلافنا أو اتفاقنا معاهم إلا إن الانتخابات الأخيرة أثبتت إن الناس زهقت من الكلام ده و مش مقتنعة بيه .... وكله عارف الحقيقة دلوئتي ....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-08-15"
capture_url = "https://web.archive.org/web/20070815123230/http://egyvote.20at.com:80/article.php?sid=80"

[[comments]]
order = 2
subject = "هو المرجعية في المباديء اية بالظبط"
author = "زائر"
posted = "2005-11-30"
text = "لماركسي بيكون مرجعيتة اشتراكيين والعلمانيين برضة مرجعيتهم علمانية<br />طيب الاخوان ليهم توجة اسلامي المفروض يعبروا عنة ازاي هل بالمداراة والمواربة<br />بالطبع لا بالاسلام وبمبادئة<br />النبي صلي الله علية وسلم بني دولة الالسلام ولم يبني دولة بلا اسم او معني<br />فهل المقصود بدولة الالاسلام دولة في زمن الرسول صلي الله علية وسلم فقط<br />بالطبع لا والا لكان الصحابة من بعدة لم يستخدموا المرجعية الاسلامية في حياتهم السياسية نعم الاسلام هو الحل سياسة واقتصاد وفن وابداع ورياضة وامن ووطن<br />المطالبين من الاخوان بالتخلي عن مبادئهم عليهم اولا ان يتخلوا عن مبادئهم فالاخوان تعرضوا للتعذيب وقطع الارزاق القتل والتشريد دفاعا عن مبادئهم الاسلامية ليس في مصر فقط بل في انحاء العالم في حين تخلي الاخرون عن المباديء التي طالما نادوا بها واثبتت فشلها ولم يطرحوا حلولا بل طرحوا اخطاء الاخوان التي هي في نظرهم اخطاء وفي نظر الاخرين اراء صحيحة طرحوها للنقد ليس الا والتجريح دون مراقبة اي ضمير عندهم لماذا لم يتحرك اليساريين طيلة هذة السنين وهم طلقاء احرار لم يفعلوا شيئا طيلة هذة السنين سوي الذم في الاخوان والمطالبة بدحرهم في السجون وعدم اعطائهم الشرعية التي هي حق اصيل لكل فرد لم يقتربوا من الناس بل قبعوا في منازلين في ترفهم تاركين الناس تئن من الجوعوالفقر والجهل في حين الاخوان رغم التضييق عليهمورغم كل مايتعرضون لة كانوا هم الاقرب الي الناس قولا وفعلا لذلك شعار الاسلام هو الحل ليس للمتاجرة كما يدعي الاخرون بل هو فعل ولنتذكر تركيا في ظل العالمانيين منذ وقت ليس ببعيد كانت تئن اقتصاديا فماذا فعل حزب العدالة الاجتماعية القريب من الاخوان المسلمين رفع من شان تركيا اقتصاديا وانتصر للشراكة مع اوروبا في وقت قصير جدا حاول قبلهم ال<br />اقرأ بقية التعليق .."
archived = "2007-08-15"
capture_url = "https://web.archive.org/web/20070815123230/http://egyvote.20at.com:80/article.php?sid=80"
