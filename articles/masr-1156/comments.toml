[[comments]]
order = 2
subject = "عنصرية؟؟؟!"
author = "evilHead"
posted = "2006-11-13"
text = "بصراحة الموضوع غريب أوي.. عنصرية في مصر؟؟ إحنا شعب أغلبوا البشرة الأمحية أصلا يعني إحنا مش بيض أوي عشان يبقي عندنا عنصرية السودة.. و فين العنصرية اصلا عشان كام تعليق في كام فيلم!! يعني الفيلم كلوا تفاهة و فشل و كفاية إنوا محمد عطية بمثل فيه.. مش حوار خالص يعني و ده فيلم خسارة فيه النقد أساسا.. وبالنسبة على التعليقات اللي بتطلع على السود لو قولنا إن ده عنصرية يبقى هي ديه العنصرية أصلا.. محنا بنطلع نكت على الصعيده و الأسكندرانية ليه ده مش عنصرية... الخلاصة إحنا شعب بيتريق على كل حاجة الطخين ولا الرفيع الطويل أو القصير (إحم إحم) الأسود و الأبيض و الوحش و الحلو.. شعب بحب الضحك و النكت (وهو شعب كئيب و غاوي فقر ونكد أصلا) .. و العنصرية تبان في المعاملة بين الناس..<br />و يعني علييك ياواد يا عطية يجامد أنت و النيو لوك .. في تميز دائم يا عطعـــوط.. ده منظر!"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015204/http://masr.20at.com:80/article.php?sid=1156"

[[comments]]
order = 3
subject = "اذا كان الفيلم ....."
author = "فارس_fr"
posted = "2006-11-14"
text = "اذا كان الفيلم كله تافه زى اغلب افلام اليومين دول تافه جدا وملهاش اى قيمة \"ايه سعد الصغير وريكوا ومحمد عطيه \" الله يخزيهم الناس عقولها باظت ,,, هم دول فنانين الزمن ده هم دول المبدعين ,, الله يرحم زمان ... وبعدين عنصرية ايه دا احنا عندنا نص الاسكندرانية سود ااو امحى داكن واغلب المصريين كده مش بيض اوى يعنى . بس طبعا انامقدرش اقلل من رايك فى السقطات اللىبتحصل فى الافلام واللى بيركزواعليها اليومين دول كتير ... بس اغلبالافلام بتكونكلها ساقطة وتافهة ... واذا كان الشعب المصري بيحصل معاهفى السجون والمعتقلات اكترمن اللى حصل مع الاخوة السودانيين فلا تحزن انت فى مصر !!!!!!!!"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015204/http://masr.20at.com:80/article.php?sid=1156"

[[comments]]
order = 4
subject = "فعلا يجب محاربه هذه السقطات"
author = "اشرف صا"
posted = "2006-11-14"
text = "دى مشكلة حقيقية في الافلام<br />السخرية من الاخرين اللى موش ملوك جمال زى بتوع التلفزيون ولا حاجه سمبتيك<br />قصير طويل تخينة اسود<br />المقال ما قالشي المصريين عنصرين قال ان فى لعب على تيمه عنصريه وده فعلا شىء مخجل"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015204/http://masr.20at.com:80/article.php?sid=1156"

[[comments]]
order = 5
subject = "تبقي انت اكيد في مصر"
author = "بسمة"
posted = "2006-11-15"
text = "احب اقول لكاتبة الموضوع اكيد احنا كده ومش بس في الافلام في الحياةعامة يعني لوواحد متدين نقوله يا اخواني ولو واحد شيوعي نقولة يا كافر ولو واحد مستواهخ الاجتماعي مش قد كده نقله يا بيئه وتو واحد معاهقرشين نقوله يا حرامي ولو واحد بينتقد الكبار نقول عليه عميل للغرب او نعملة اى فضية يكون طرفها واحدة ست علي الاخوة اصحاب البشرة السوداء الا يتضايقوا احنا الحمد الله بنهبط الي القاع بسرعة الصاروخ"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015204/http://masr.20at.com:80/article.php?sid=1156"

[[comments]]
order = 6
subject = "نعم الشعب المصري عنصري حتي النخاع و الدليل اهو"
author = "سيد أحمد"
posted = "2006-11-22"
text = "انا عايش في الولايات المتحدة و نوبي الاصل و شايف ان تعامل الامريكيين مع السود اكثر تسامحا من تسامح المصريين<br />و الفرق في الثقافة<br />مشكلة الثقافة العربية انها غير متسامحة مع الاخر ايا كان هذا الاخر<br />قبطي<br />شيعي<br />يهودي<br />نوبي<br />اسود<br />اصفر<br />معاق<br />المهم يكون مختلف عنه<br />مع ان الجداريات المصورة في المعابد المصرية من الشمال الي الجنوب تظهر المصري اما بني او اسود بشعر افريقي مجدول<br />يعني الفراعنة كانوا في تسامح مع لونهم الاسود اكثر من المصريين المحدثين اللي شايفين نفسهم بيض اكتر من الاوروبيين مع ان ملامحهم افريقية قحة<br />و دا بيخلينا نطرح سؤال.. هل عدم تسامح المصري مع الاسود راجع للثقافة العربية الوافدة ام لوجود عناصر غير مصرية<br />في امريكا السود تجدهم في كل الميديا و المراكز حتي الوزارات<br />في مصر تخلوا الساحة من الوجوه المصرية السمراء و تسودبالملامح العربية و التركمانية و التركية حتي الابخازية<br />دا مش سبب كافي ان مصر عنصرية و تميز بين الالوان"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015204/http://masr.20at.com:80/article.php?sid=1156"
