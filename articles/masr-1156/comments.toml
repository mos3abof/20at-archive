subject = "الاخ الي بيسأل عن عائلة الطحاوي"
author = "الاتنين ملهومش علاقة ببعض...وأعتقد انك بتسأل عن منى الطحاوي مش أميرة...بس على حد علمي انهم مش قرايب...هو ممكن يكون ليه علاقة بميرال الطحاوي لأن ميرال من الدلتا وهو كمان..."
posted = "2006-11-13"
text = "بس عايز اعرف حاجة..هو عبدالله لقى عروسة ولا لسة؟!..اصل الموضوع ده كان مسبب ليه ازمة من حوالي سنتين تلاتة !!!!"
