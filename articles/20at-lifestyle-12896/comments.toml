text = "كان في مجنون في الشارع الاطفال بتضربوا بالطوب انا قعدت ازعق لهم وقولتلهم حرام وكده وبعدين بصيت بعد شوية لقيته بيضرب راجل بالالم وجري علي راجل تاني عضه من قفاه هههههههههههههه كل ده فجاة طبعا معرفش كان سريع جدا اللي يضحك بقي ان ابن خالي تاني يوم جاي ومتخربش في دراعه بساله بقوله مالك ايه اللي في ايدك ده قالي مفيش ده واحد مجنون امبارح كان في الشارع بيضرب في الناس وخربشني طبعا انا فطست من الضحك وقولتله هو انت كنت من ضحاياه ههههههههههههههه ههههههههه"
