text = "المخ عضو من مجموع اعضاء الجسد لكنه الاهمو الاعقد واننى اعتقد والله اعلم ان وقاية العقل بصفه خاصه ترجع الى درجة الايمان حيث يصادف اى انسان مشاكل يصعب على العقل تحليلها فيحاول الشخص اجهاد عقله مع غضب وحزن وانفعال منحيا جانبا ومتناسيا ذكر الله واليمان بالقضاء والقدر فتتازم الامور امام المخ وهو القائم بالعمليات المتعلقه بالمنطق والعلل والاسباب تما مثل بروسيسور الكمبيوتر اذا تم تحميله ببرامج تتخطى قدراته فتحدث عملية ماتعرف بالتهنيج وهذا تماما مايحدث للمخ اما ذكر الله والايمان يريح العقل ويزيح عنه الشعور بالياس والاحباط وبها تكون وقايته ( الابذكر الله تطمئن القلوب والى لقاء مع تحياتى موبايل 0180671348 مصر02"
