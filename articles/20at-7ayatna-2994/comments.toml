posted = "2009-04-20"
text = "الشكر لكم انكم اتحتم الفرصة لي لاقول ما يخطر ببالي<br />انا .زياد من فلسطين احببت فتاة اسمها( … ) وقد كنت قبل حبي لها اعيش في كمد دائم الى ان وفق الله لهذا الامر ويسر له فتعرفت عليها ععبر الايميلات والدردشة واتفقنا على مسح كل المضافين على ايميلات كلينا وان لا يبقى الا ايميل وايميلها فقط … الآن نتراسل باستمرار ويصلني منها 6 رسائل يوميا وانا كذلك ابعث لها بما يزيد عما تبعث لي وانا احبها كثيرا وهي كذلك وان الآن مرتاح نفسيا اكثر من اي وقت مضى وما ذلك الا بفضل الله الذي يسر لي هذه البدر التي اتصفح وجهها في كل صباح كانها مرآة للروح والجسد …<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2009-11-04"
capture_url = "https://web.archive.org/web/20091104090145/http://www.20at.com:80/20at/7ayatna/2994.html"
