subject = ""
author = "نونى"
posted = "2007-01-28"
text = "احلى رسالة<br />كانت من خطيبى<br />لما كنا زعلانين<br />حئك عليا انا زعلت انك مش بتسمعى الكلام وبتنرفز علشان بخاف على صورتك يا كلبة افهمينى بقى<br />وهى احلى رسالة علشان احنا كنا متخانئين وفعلا كنت مقررة انهى كل حاجة<br />وكمان فى رسالة حلوة انة كان مشغول فى الشغل اوى من 9 الصبح لحد 2 بليل ولقيتة بيبعتلى رسالة<br />وسط الزحمة مش ممكن انساكى<br />تصبحى على خير يا حبيبتى<br />موضوع لذيذ"
archived = "2009-11-04"
capture_url = "https://web.archive.org/web/20091104090145/http://www.20at.com:80/20at/7ayatna/2994.html"

[[comments]]
order = 1
subject = ""
author = "لينا"
posted = "2007-02-06"
text = "طبعا اكيد في عصر التطور والسرعه في التواصل اكيد الرسائل القصيره تحتل مرتبة اولى<br />عن نفسي الرسايل كانت كتيره ومازلت احلى ما يمكن ان يحصل في يوم<br />انا فاكره احلى رساله كانت من صديقي كان بيكلمني في موضوع وقاعد يمهد لي فيه انه عنده مشاعر تجاهي في حين انا نفسي كنت حاسه نفس الاحساس بس مش عارفه اعبر وفجاه وانا بكلمه وصلتني رساله<br />وقالي : وصلتك رساله افتحيها .. و فعلا فتحت الرساله لقيته كاتب فيها ( ممكن تحبيني عشان انا بحبك مش عارفه من امتى )<br />وحاليا مخطوبين و هنتجوز بعد 40 يوم بالضبط"
archived = "2009-11-04"
capture_url = "https://web.archive.org/web/20091104090145/http://www.20at.com:80/20at/7ayatna/2994.html"

[[comments]]
order = 2
subject = ""
author = "مورا"
posted = "2007-02-08"
text = "موضوع الرسائل دة بالنسبة لى كان شى عادى كنت ببعتها لمجرد المجملات و فى وقت المناسبات<br />لاحد ما فى يوم وصلتنى رسالة غريبة جداا من خطيبى (الجواز قسمة ونصيب ) احنا مش لبعض ساعتها ايقنت ان للرسائل دور هام جداا فى التعبير عن حاجات مش نقدر نعبر عنها وجة لوجة<br />وبعدها بحوالى ستة شهور جاءت لى رسالة تانية من خطيبى برضة (انا بحبك وعايز ارجعك ؟؟) احنا بقينا فى عصر السرعة والاتصالات السرعية والرد السريع والبريد السريع والرسائل القصيرة السرعية"
archived = "2009-11-04"
capture_url = "https://web.archive.org/web/20091104090145/http://www.20at.com:80/20at/7ayatna/2994.html"

[[comments]]
order = 3
subject = ""
author = "عماد فايد"
posted = "2007-12-11"
text = "الحب اساسا من القلب وليس من العنين ولان الذي يحب لا يستطيع ان يقول للذي يحبه انه يحبه حتي لو كان يتكلم معه كثيرا فان القلب لايسطيع ان يقول كلمه الحب خوفا من الحرج ومن ابتعاد حبيبه عنه لذلك ان القلب يخاف من الوضوح لذلك الن الحب من القلب وليس من العنين<br />فاذا كان الحب من شخص عن طريق انه معجب بها فان ذلك يكون من العينين وليس من القلب فلذلك يستطيع ان يقول كلمه الحب لان العينين لا تخاف من انسان ابدا بل تنساه عندما يبتعدان عن بعض<br />فالقلب يختلف عن العين<br />فرغم ان العين هي مصدر الحب من القلب الا وانهم يختلفان كثيرا"
archived = "2009-11-04"
capture_url = "https://web.archive.org/web/20091104090145/http://www.20at.com:80/20at/7ayatna/2994.html"

