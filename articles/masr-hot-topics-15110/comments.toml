subject = ""
author = "ممنوع اللمس"
posted = "2010-01-30"
text = "طبعا لازم تبقى بالعربى<br />انا مرة شفت بنت لابسة تى شيرت مكتوب علية بالانجليزى فوق صدرها - ممنوع اللمس - بالانجليزى طبعا<br />وواحدة تانية مكتوب على ظهرها واعلى مؤخرتها - غير قابل للاختراق<br />وبالانجليزى ايضا على اماكن حساسة - المسنى بحنان - واعصرنى بقوة<br />جمل بذيئة جدا والجاهلات بيلبسوها<br />والشباب ايضا بيلبسوا حاجات مكتوب عليها جمل لا داعى لترجمتها لانها بلاوى مسيحة<br />فالعربى مفيش احسن منة<br />ونكتب امثالنا الشعبية زى<br />الحلوة من بولاق وابوها بيضرب بالدقماق<br />بص لى بعين ابص لك بعين ونص<br />يا ناس يا شر<br />قل اعوذ برب الفلق<br />انا جامد ومتين"
archived = "2010-02-01"
capture_url = "https://web.archive.org/web/20100201030251/http://www.20at.com:80/masr/hot-topics/15110-2010-01-30-15-20-43.html"

