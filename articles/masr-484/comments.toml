posted = "2006-06-13"
text = "يعني انتي مش عارفة ايه سر التكشير والنكد والحزن الابدي بتاع المصريين .. انتي مين اللي خلاكي تكتبي اساسا .. ولا انتي مش من هنا ؟؟ موضوع عجيب وغريب ومالوش لزمة ولا .....<br />اهم ملحوظة ليا النهاردة حاجة ان المواهب اختفت من الملعب فى زمن المنوفي النجس اصبح انصاف الموهوبين هم اللي بيلعبو .. مش هاقدر اجاملك .. روحي اتعلمي ازاي تعملي اسرة احسن ليكي ولينا وسيبي الملعب للمواهب اللي يقدرو يعملو حضارة .. مش هاقدر اجامل حد .. وعلى فكرة انا مش امن دولة ولا حاجة احسن تطلع في دماغك اني مبعوت .. باي"
