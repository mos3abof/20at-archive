subject = "أنواع الحزن والفرح"
author = "معتـــز"
posted = "2006-06-08"
text = "الحزن ثلاثة أنواع:<br />-طبيعي معلوم السبب نتيجة حدث مفاجيء (وفاه - مرض -رسوب..)<br />-غم وحزن مجهول السبب:ويكون في الغالب نتيجة التقصير في حق الله( وَمَنْ أَعْرَضَ عَن<br />ذِكْرِي فَإِنَّ لَهُ مَعِيشَةً ضَنكاً وَنَحْشُرُهُ يَوْمَ الْقِيَامَةِأَعْمَى {124})طه<br />-هم عالي لعلو همة صاحبه:مثل صلاح الدين الذي كان لا يضحك والمسجد الأقصى<br />والضحك والابتسام نوعين<br />-محمود:تبسمك في وجه اخيك صدقة -وكان النبي صلى الله عليه وسلم يمزح ولا يقول إلا حقا<br />-تهييس وتفاهة وبمناسبة وبدون مناسبة وهو الذي يميت القلوب والعياذ بالله<br />http://egypt-student.blogspot.com/"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155543/http://masr.20at.com:80/article.php?sid=484"

[[comments]]
order = 1
subject = "مية وحداشر 111"
author = "ali"
posted = "2006-06-08"
text = "موضوع جيد... يا جماعة في الآونة الأخيرة وأثناء مروري بشوارع مصرنا الحبيبة وجدت أناس كثيرين مرسوم على وجوههم علامة 111 مية وحداشر أو تلات واحيد يا ساتر يا رب والله يا جماعة مش حالة ولا اتنين ولا تلاتة أنا مش باحث ولا بعمل كده من صميم عملي وبعمل مسح ميداني لكني مهتم وبتابع أحوال بلادي ... وعلى فكرة الظاهرة دي بين النساء والرجال ومش بس كبار السن فقط ولكن الشباب أيضا وربنا يستر وما توصلش للأطفال الأبرياء .. أكيد الواقع المرير هو السبب .. واضح أن التفكير في المستقبل هو السبب سواء كان بالنسبة لشاب بيفكر يتزوج أو بنت بتفكر تتزوج أو أب بيحاول يوفر متطلبات زواج ابنته أو أب بيحاول العكس يساعد إبنه على نفقات الزواج بأن يستدين من أحد الأصدقاء أو الأقارب وبالتالي لا محالة من التفكير في طريقة السداد أو ممكن في الأخير يذهب بدون شك إلى أحد البنوك ويقوم بالاقتراض - عمل قرض - طيب هايجييب منين .. واه حسرتاه .. هاحكي حكاية مش هاتصدقوهاكان في مرة أنا وأخي راكبين سيارة أخي وطبعا أنا ما بعرفش أسوق ولكن أخي هو اللي كان سايق وبعدين فيه سيدة مرسوم على وجهها هذه العلامات المريبة التكشيرة ومعها ابنتها الصغيرة ممسكين بأيدي بعضهم البعض ويقومون بتخطي الطريق وكان أخي غير مسرع على الإطلاق ولكن السيدة غير منتبه تماماً لتعدية الطريق والنظر يميناً ويساراً وقام أخي بطرق كل وسائل الانتباه - الكلاكس - بشدة ولكن دون جدوى لحد لما العربية صدمت السيدة وابنتها ووقعوا الاثنين على الأرض وكان عامل زي فيلم رعب وقمنا بركن السيارة والاطمئنان عليهما، موقف آخر لرجل مسن تظهر تجاعيد الزمن على وجهه ولكن هذا الرجل مش راسم 111 مية وحداشر ولكن البهجة والسرور تظهر على ملامح وجهه وكان لسة التليفون المحمول طالع جديد في مصرنا الحبيبة وك<br />اقرأ بقية التعليق .."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155543/http://masr.20at.com:80/article.php?sid=484"

