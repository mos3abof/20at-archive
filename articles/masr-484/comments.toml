subject = "يجعله في ميزان حسانتك يا اختشي ..."
author = "هووووووووووبه"
posted = "2006-06-09"
text = "يا\"ميت\" سم وندامه يا ختي ,مش عارفه ايه تبادل الخواطر اللي بيهل عليا دا , من كام يوم كدا خير اللهم ما اجعله خير كتبت تعليق وقلت زي ما تيجي تيجي سبحان الله اصحي الصبح القي المقال لالالالا, بس يا حاجه انتي تعبتي نفسك ليه ولفيتي المنتديات انت لو في الموقع حتلاقي الكابتن \"ميت\" و \" فاقد الروح\" ايه دا بيجيبو الاسامي دي منين شغالين حوانتيه بيجدبوها من تحت الارض يالهوي ايه دا . وكنت ناويه الزق بيتين الشعر<br />مش ححطهم روحو دعبسو في الارشيف مش فاكره كتبته فين ."
archived = "2006-06-15"
