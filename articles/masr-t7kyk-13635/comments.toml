text = "مضى على الحرب 36 سنة وايا كانت نتائجها<br />مصر فى 73 كانت اية<br />ودلوقتى فى 2009 تقدر تعمل اية<br />واسرائيل فى 2009 تقدر تعمل معانا اية<br />هو دة السؤال<br />احنا دلوقتى اية ونقدر نعمل اية وقدرات اسرائيل اية<br />احنا قضينا السنوات اللى فاتت نعمل اية وهم عملوا اية<br />مفيش داعى للاغانى الوطنية القديمة وخلينا فى زمن الحالى نعيط على العمر اللى ضاع"
