posted = "2009-10-06"
text = "كلفة القائد باستطلاع اللواء الاسرائيلى المتقدم على المحور المقابل لنا<br />لم ينتظر اخر ضوء<br />خرج فى عز الظهر<br />امسك حفنة من رمال الارض من رمال سيناء وقرا<br />0( وجعلنا من بينهم سدا ومن خلفهم سدا فاغشيناهم فهم لا يبصرون )<br />ثم رمى حفنة الرمال تجاة العدو<br />وتسلل فى ارض انتشار اللواء العدو المقاتل وعاد بكل المعلومات سليما ولم يرة احدا<br />ومن الغريب انة استشهد بعد انتهاء المعارك فى غارة جوية اثناء تطوير الهجوم<br />تحية لكل الشهداء الابطال"
archived = "2009-10-20"
