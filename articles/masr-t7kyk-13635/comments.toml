text = "بيفكرنى بعز الأجداد وذل الأحفاد<br />بيفكرنى بمجد وبطولة الأجداد وعجز وخضوع الأولاد<br />بيفكرنى بأنتصار عظيم للأباء .. و خيبة ووكسة الأبناء .<br />مش لازم نشوف لقطات كتير من الحرب علشان منولعش فى نفسنا … بالذمة مين يصدق أن جدي الى دفع حياته علشان يحرر ارض سيناء من اليهود وعلشان أقدر أروح هناك وأستمتع بيها فى أى وقت ، فيها حتت ( مدنية ) المصريين ممنوعين من د[ *** ]ها ومفتوحة فقط للأسرائيلين و الأجانب .<br />بالذمة .. لينا حق نكره الحكومة ولا لأ ؟؟"
archived = "2009-10-20"
capture_url = "https://web.archive.org/web/20091020160420/http://www.20at.com:80/masr/t7kyk/13635-6-.html"

[[comments]]
order = 7
subject = ""
author = "هل طبلوا ورقصوا"
posted = "2009-10-07"
text = "هل فى اسرائيل فى ذكرى حرب الايام الستة وحرب 73 غنوا ورقصوا وعملوا هيصة فى التليفزيون بتاعهم<br />ابدا<br />هل الدول زى امريكا مثلا بتعمل احتفالات بغزو العراق واحتلال المانيا واليابان والتليفزيون بتاعهم بيغنى ويقول عاش اللى قال للرجال احتلوا اليابان وعاش اللى قال للرجال احتلوا العراق<br />والا تليفزيون فرنسا بيغنى ويقول عاش ديجول اللى قال للرجال حرروا باريس من الالمان<br />وبعدين ضربة جوية اية وضربة معوية اية<br />الضربة الجوية عملتها اسرائيل ودمرت المطارات المصرية فى 67 وضربتنا احنا دمرت كم مطار اسرائيلى<br />بلاش كلام فارغ واستخفاف بعقول الناس واى شاب ممكن يفتح اى موقع عن الحرب على النت ويجيب الحقائق بالضبط<br />ولكن يبدوا ان الاعلام المصرى عايش فى الخمسينات"
archived = "2009-10-20"
capture_url = "https://web.archive.org/web/20091020160420/http://www.20at.com:80/masr/t7kyk/13635-6-.html"
