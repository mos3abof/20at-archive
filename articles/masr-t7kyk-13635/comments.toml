subject = ""
author = "نعم نذكر وبكل فخر 2"
posted = "2009-10-06"
text = "اذكر اننى قابلت مدرس ابتدائى صعيدى من قنا بيشتغل حكمدار دبابة راجع من معركة دبابات شرق القناة بعد تحطم دبابتة ليشكل تانى ويستلم مع طاقم جديد دبابة اخرى ليعود الى الميدان<br />كان بيعيط بالدموع لانة عايز دبابة باسرع ما يمكن ليعود للميدان ورايتة نايم على دكة فى المؤخرة يبكى كالاطفال لانهم تاخروا علية<br />ورايتة فرحان جدا بدبابتة الجديدة التى متب على مقدمتها بالبوية الكاكى عنتر وودعتة مع دبابتة عنتر وراح الى الخط الامامى<br />اليهود يريدون ان يقتلوا تلك الروح ويزرعوا فينا روح الياس وروح الهزيمة ويفصلوا بين جيلنا والجيل الذى يلينا حتى ننسى تلك الروح<br />فوق ظهر المسجد فى الحرم الشريف قال لى مقاتل اسمع حينما نمشى نحن جيل اكتوبر على عكاكيز سوف يعودون لاحتلال سيناء<br />هل اعددناكم ابنائنا للقتال وحب مصر ؟<br />اظن اننا قصرنا<br />فاحبوا بلدكم مصر<br />ورغم الظروف الصعبة فانتم اقوى وافضل منا تعليما وامكانيات وظروفا<br />لا تدعوا العدو يصيبكم بالاحباط فانتم مستهدفون<br />العدو عينة على الارض<br />فحافظوا على الارض"
archived = "2009-10-20"
capture_url = "https://web.archive.org/web/20091020160420/http://www.20at.com:80/masr/t7kyk/13635-6-.html"

[[comments]]
order = 5
subject = ""
author = "نعم نذكر وبكل فخر"
posted = "2009-10-06"
text = "بعد الهزيمة المريرة فى 67<br />بدأ تجنيد المؤهلات العليا فى القوات المسلحة<br />وقت الحرب فى 1973 وعلى حسب البيانات النشورة والمتداولة فى وسائل الاعلام كان عدد قوات الجيش مليون وربع المليون<br />منهم 140 الف مجند مؤهلات عليا ومتوسطة وهم كل الخريجين من 67 وحتى 73<br />منهم 40 الف ضابط احتياط<br />هؤلاء هم مهندسى خط حائط الصواريخ ومهندسى بناء كبارى المعابر والورش الفنية لاصلاح المدرعات والعربات والاسلحة<br />بدات الحرب باداء يفوق الوصف وخسائر معارك المدرعات دبابة مصرية مقابل 3 دبابات اسرائيلية<br />بطولات تفوق الوصف<br />اذكر الخطأ الاول انة بعد الثلاثة ايام الاولى تجمدنا شرق القناة وكانت لنا بعض الكتائب وصلت الى مضايق سيناء وسدتها فامرت بالعودة الى شرق القناة<br />لماذا ؟<br />ثم بعد اسبوع من الجمود جاءت الكارثة بتطوير الهجوم والتقدم الى الممرات وقد كانت فى ايدينا بدون قتال فى اول ايام العبور<br />وخسرنا كثيرا فى تطوير الهجوم وثبتنا فى حرب خنادق<br />ثم بدأ الهجوم المضاد والاختراق عند الثغرة وعبرت 7 الوية مدرعة الى غرب القناة<br />ماذا لو كانت قيادتنا ديناميكية واحتللنا المضايق من تانى او تالت يوم"
archived = "2009-10-20"
capture_url = "https://web.archive.org/web/20091020160420/http://www.20at.com:80/masr/t7kyk/13635-6-.html"

