text = "اول التخريف فى قرارات السادات بعد انتهاء الحرب بشهرين<br />اقالة كل من<br />اللواء سعد الدين الشاذلى<br />اللواء عبد المنعم واصل<br />اللواء عبد المنعم خليل<br />تم اقالة اللواءات المحاربين المخلصين اولاد مصر الحقيقيين الذين ساهموا بعرقهم ودمهم فى صناعة نصر اكتوبر<br />ليبقى اللواءات النص كم"
