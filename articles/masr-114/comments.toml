[[comments]]
order = 0
subject = "موضوع جميل"
author = "موضوع جميل ورائع بارك الله فيك"
posted = "2006-04-03"
text = "بس فين امن الدوله دول انا عمرى ما شفت منهم امن خالص<br />دول اقل ما يطلق عليهم هو ارهاب الدوله او خوف الدوله<br />مينفعش ابدا يتسموا غير كده انا قصدى على الناس الكبيره<br />لكن يا عينى الغلابه التانيين اللى مش فاهمين حاجه فى البطيخ<br />والله بيصعبوا عليا لما باشوفهم واقفين فى عز الحر فى الشارع وهما ولا فاهمين ايه اللى بيحصل اصلا<br />بيملوا دماغهم بشوية افكار تخليهم يطحنوا اللى قدامهم بس معرفش دا ذنب مين انهم متعلموش ولا ايه بالظبط<br />عموما الحمد لله اننا متعلمين والحمد الله الذى عافانا وفضلنا على كثير ممن خلق<br />ربنا يسلمنا من شرهم"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211417/http://masr.20at.com:80/article.php?sid=114&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "ربنا يهدهم"
author = "مراويييييييتو"
posted = "2006-04-04"
text = "فعلا عندك حق يا محمد وانا باقرا الموضوع عماله افكر في فيلم البريء حاسه اني بشوفه تاني الناس دي مزدوجة الاحاسيس والمشاعر لكن الدولة والحكومة همه السبب همه غلابة مش فاهمين لان مفيش حد فهمهم والدولة بتستغل قصر فهمهم وتملا عقولهم بكل الاكاذيب، لكن بشوات امن الدولة طبعا واكلنها والعه ومقطعين السمكة وديلها اكل فلوس وهبر مليونات وكمان تعذيب في الناس ربنا ع الظالم"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211417/http://masr.20at.com:80/article.php?sid=114&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "مسلمه"
author = "الامن المركزى بقى ديكور امام الجامعه وكل يوم بلاقى العربيات بتكتر"
posted = "2006-04-05"
text = "بس الحقيقه انا شفت حاجه جميله فى الامن اللى قاعد ليل نهار ده<br />شفت مجموعه منهم وقت الصلاه عاملين جماعه وبيصلوا<br />مش عارفه يمكن كان وحشهم ضرب المظاهرات وبيدعوا؟؟؟؟ الله اعلم<br />و ربنا يهدى"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211417/http://masr.20at.com:80/article.php?sid=114&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "دولة عسكر وحرامية"
author = "حائر في دنيا الله"
posted = "2006-04-05"
text = "موضوع جميل بصراحة<br />وما لفت انتباهي بالفعل هو هل هؤلاء الجنود مظلومين أم نحن المظلومين<br />وأعتقد أن هذا الجواب لدى حكومة الحزب الوطني المركزي الذي حولت هؤلاء المساكين بارادتهم أو رغم عنهم إلى أداة تستخدم العنف وهم يستخدموهم بالعنف...."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211417/http://masr.20at.com:80/article.php?sid=114&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "موضوع جميل"
author = "أنا مصري وابن مصري"
posted = "2006-04-06"
text = "موضوع جميل ورائع بارك الله فيك<br />لكن اناشخصيا اعتقد ان الجنود مظلومين لانهم لايسمعون الا كلام القائد بتاعهم (لو رأوا هؤلاء الجنود وزير الداخلية لضربوه ان لم يكن يعرفوه)لعل المشهد من فيلم جواز بقرار جمهورى يشهد على ذلك)<br />يارب خلصنا من الحزب الوطنى ورجاله<br />قـــــــــــــــولـــــــــــو يارب"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211417/http://masr.20at.com:80/article.php?sid=114&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "خراب الدوله"
author = "سمسمه"
posted = "2006-04-09"
text = "السلام عليكم<br />امبارح كان عندنا في النادي في احدى بلاد محافظه الغربيه حفل للايتام قمنا بتجميع ملابس و اطعمه و حلوى و جيبنا دي جي علشان نفرح الولاد و البنات الايتام<br />المهم<br />تفتكروا ايه اللي حصل؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />يتوع امن الدوله اقصد خراب الدوله هلوا كغربان البين و مشونا و حتى كان الولاد فى الوقت ده بياكلوا ما صبروش عليهم و مشوا في الشارع و الاكل في ايديهم<br />و في الاخر لازم نفهم كلنا ان الدوله بتاعتنا دي مش عايزه حد يخرب البلد الا الحكومه بتاعتها"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211417/http://masr.20at.com:80/article.php?sid=114&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 6
subject = "ما تردش"
author = "انا"
posted = "2006-04-12"
text = "يا استاذ وليد حسن ما تردش على الاشكال القذرة دى وما تقلش لحد على مواقع زى دى تانى لان اللى ما شفش بيروح يشوف وانت اللى بتشيل ذنبه وعلى العموم ربنا قال (ولا تقعدوا معهم حتى يخضوا فى حديث غيره ))<br />واذا نطق السفيه فلا تجبه فخير من اجابته السكوت<br />وبعدين يروحوا يصلحوا الانجيل بتاعهم الاول وبعدين يبقوا ييجوا يتكلموا<br />وارجوا القراءة لاحمد ديدات واى حد عاوز مناظرات احمد ديدات ممكن يكتب على الاميل وانا ابعتهاله<br />taweel_20@yahoo.com"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211417/http://masr.20at.com:80/article.php?sid=114&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 7
subject = "مش هيتفعك صدقى يمدريه امن القليوبيه"
author = "رداج"
posted = "2006-07-18"
text = "صدقونى يجماه ناو يخليها نار انتو ليه مش مصدقنى والله معاة متفجرات هو زاصحابه الى عملنها ومعاهم اسلحه ناريه وعملين تنظيم سرى اسمه الظلام وانا كنت واد منهم وبعدين خلاص صدقونى يجماع الوقت بدء ينفز منى ومنكم الدليل على كلامى دة منزل محمد فيصل مليان بلمتفجرا والاسلحه الناريه مش هتخصرو حاجه لو فتشتشو مش عارف مش عوزين تسمعو كلامى ليه"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022527/http://masr.20at.com:80/article.php?sid=114&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

