[[comments]]
order = 0
subject = "جائنا البيان التالي"
author = "هبهوب او هوووبه"
posted = "2006-03-14"
text = "الحته بتاعت هنيدي لما بيسال الراجل تعمل<br />ايه في السنه الجديد وسنه حلوه عليك ولاه<br />التاني اللي كان علي القهوه ولسه<br />منتجوزش من الاخر خلي الطابق مستور عشان<br />الحلقه تتداع والجمهور \"اللي فوق ميزعلش\""
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204332/http://masr.20at.com:80/article.php?sid=1&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "الملك"
author = "طارق ومحمد"
posted = "2006-05-06"
text = "ان محمد منير هو افضل مغنى فى مصر والعالم العربى وهو الكينج بعد الله سبحانة وتعالى وهو الوحيد اللة بيشرف مصر دايما فى الخارج بدليل انة هو سفير مصر فى المانيا والنمسا وانتوا عرفين اكيد والبلاد العربية ومبحبش يغنى فى البلاد العربية عشان العرب جررررببببببببببببببببببببببببببببب وشكرا واتمنى المذيد من النجاح والحفلات المستمرة والنبى يا كينج<br />شكرا ومت تلميذك الاتينين محمد محمود الدكاوى<br />وطارق محمد عوض الله كشتمنة باشا وانا بحب بلدك على فكرة والف شكر يا كينج باااااااااااااااااااى"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204332/http://masr.20at.com:80/article.php?sid=1&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"
