text = "السلام عليكم ورحمة الله وبركاته<br />ازيك يا أستاذ عبيد والله أنا حاسس ان حضرتك زعلان من المنايفة شويتين<br />ولكن أنا أؤكدلك على الرغم من انى مش مولود فى المنوفية إن المنايفة ممتازين جدا وتعاملهم حلو وكل حاجة وأنا فخور بكده<br />والناس فيها قلوبهم على قلب بعضهم البعض<br />مش زى اللى بالى بالك<br />خليها فى سرك<br />تحياتى لك ولكل المنايفة<br />اخوكم الفقير الى الله / وائل حسين<br />wael_huwwein_1@hotmail.com وشكرا لكم"
