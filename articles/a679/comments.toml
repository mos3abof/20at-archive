text = "في احد فنادق الخمس نجوم بالقاهره و التى تعج بحياه حافلة على مدار الأيام .. و بشكل أكثر خصوصاً فى ليلة الخميس ..<br />كان فندق هيلتون رمسيس ..<br />يعيش لحظات فريدة .. و استثنائية .. فقد تزين الفندق .. و تجمل .. لا ليستقبل احتفالاً بمناسبة عادية .. أو بزفاف خاص .. أو ببهجة كتلك التى تحياها قاعاته كل ليلة .. بل كان الجو المحيط يُوحى بشئ غريب ... لم تعتده الأعين .. و لم تلمسه العقول .. و لم يخطر على عقل بشر .<br />انتشرت الزهور .. و الورود .. و أُطلق البخور .. و استعدت فرق الرقص و الغناء .. لتنشد نغمات جديدة .. على وقع أهازيج .. تتمايل رياحينها هذه المرة بشكل لم تشهده مصر منذ حباها الله بدين الإسلام و المسيحية ..<br />و قف الجميع مشدوهين . و هم يشهدون ( رجلين ) يترجلان من سيارة فخمة .. مزينة بالورود و الزينة .. توقفت عند باب الفندق ليهبطا منها .. و فى لحظات كان الرجلان يتأبطان بعضهما بعضاً و يتقدمان وسط فرقة الموسيقى التى راحت تزفهما فى مشهد غريب .. أثار كل الموجودين داخل الفندق .. و فى قاعات استقباله .. و فى ردهاته الرئيسية .<br />توجه ( الرجلان ) بخطوات وئيدة إلى حيث موقع الإحتفال بهما ... فى حفل الزفاف الذى تقرر فى تلك الليلة الغريبة ..<br />(رجلان يتزوجان بعضهما البعض على أرض مصر ).<br />* كان الجواب كالصدمة التى أصابت من تواجدوا مصادفة و من راحوا يرقبون مجريات ما يحدث .. و الغيظ يأكلهم .. و قلوبهم تتمزق .. و راحوا يسألون أنفسهم عن هذا الهوان .. و الإجتراء على الدين .. و تجاوز المقدسات .. و السماح بالمحرمات فى بلد الأزهر الشريف .. الذى تجرى على أرضه وقائع زفاف اثنين من الشواذ .<br />كان الزوج - أو من أُطلق عليه هذا اللفظ .. ممتلئ الجسد .. ضخم الملامح .. و كان شعره يتدلى على ظهره و كأنه شعر فتاه .. أرادت أن تطلق شعرها لجذب مفاتنها للناظرين .. أما الآخر الذى اُطلق عليه الزوجة فكان ذا قوام نحيف .. رشيق بعض الشئ .. و إن كان شعره أقل من شعر الزوج ، كان الجميع يراقب نظراتهما . و ابتساماتهما .. و مغازلاتهما لبعضهما البعض .. كانا يتهامسان .. ثم تكسو وجهيهما ضحكة عريضة .. و فى مشهد لا يخلو من دلالات .. راح كل منهما ينظر إلى الحاضرين .. و يوزع ابتساماته عليهما ..<br />صوت الموسيقى يعلو .. و الجو يزداد سخونة .. أغان خليجية ... و أخرى أجنبية .. يتردد صداها فى أجواء القاعة .. يدعو منسق الفرقة الموسيقية العروسين .. الرجلين .. للتقدم إلى منتصف الصالة .. و على انغام الموسيقات المختلفة .. الصاخب منها .. و الكلاسيكى الهادئ .. راح كلاهما يستعرض مفاتنه فى وصلات راقصة .. لم تخل من إيحاءات بعينها .. حتى أن الرجل العروس كان يرقص و كأنه ينافس أشهر الراقصات ... أما ( العريس ) ضخم الجثة فكان يهز جسده بالكاد ... و يسعى قدر جهده لتوفير طاقته لاستخدامها فى الوقت و اللحظة المناسبتين .. فبعد ساعات قليلة سوف يكون على موعد مع ليلة العمر .<br />و حين راح ( العروسان الرجلان ) يواصلان وصلات الرقص على مختلف الموسيقات ... اندفع العديد من الشباب الخليجى إلى قلب القاعة .. يتمايلون و يرقصون .. و يرددون أغانى شاذة . و نشازاً ، و كانت اشكالهم جميعاً و ملامحهم تكشف عن طبيعتهم و تركيبتهم .. و كانت نظراتهم تحمل من الإيحاءات .. ما يتجاوز حدود الكلام .<br />* هكذا استمرت الرقصات الشبابية لأكثر من نصف ساعة .. وسط حالة من الفرح و البهجة الغريبة .. و فى لقطة درامية راح العريس يحكى وقائع قصة العشق و الوله التى ربطته بمحبوبه و عروسه الرجل .. نظر إلى الحضور .. و أمسك بسماعة الحضور ليروى .. بإثارة و تشويق وقائع الغرام الذى ربط بين قلبه و قلب الرجل الذى أحبه منذ سنوات طوال .. قائلاً إنه صعد فى مواجهة كل الضغوط التى تعرض لها .. لكى يظفر بمحبوبه .. و عشقه الأول فى الحياه .. و راح يحكى بألم عن بلده و أهله فى الكويت الذين ضنوا عليه بالحنان .. و رفضوا أن يسمحوا له بإقامة حفل زفافه من حبيبه على أرض بلاده .. مُبدياً تأثره الشديد بهذا الموقف غير المبرر - حسب وصفه - و لكنه يحمد الله أن مصر .. الكبيرة .. و الحنونة قد فتحت له ذراعيها .. و قبلت أن يُقام حفل زفافه على حبيبه فوق أرضها .. و من هنا فقد قرر أن يأتى و يحتفل بزفافه فى مصر أرض الأهرامات و التاريخ و الحضارة .. ليستمتع هو و حبيبه بشهر العسل على ضفاف النيل الخالد .. ليعيش لحظات السحر المصرى فوق ربوع هذا البلد الذى فتح لهما ذراعيه .. و احتضنهما .. بعد أن تجاهلهما أهلهما هناك فى الخليج .<br />و بعد وصلة من التصفيق الحار الذى قوبل به كلام العريس ( الرجل ) .. راح العريس الرجل يحكى من جانبه قصة الذكريات السعيدة ... و لحظات الإرتباط الأولى التىجمعته بحبيب القلب .. و يروى وقائع الكبت و الحرمان و القيم البالية فى بلاده التى منعته من الإرتباط بأعز إنسان لديه فى الوجود .. و يوجه الاتهامات لما وصفها ( بالعادات الذميمة ) التى تحرم الغنسان ( الذكر ) من أن يمارس الحب مع حبيبه ( الذكر ) .. و لم ينس أن يشكر مصر ذات القلب الحنون التى جمعت المحرومين .. و المطاردين على أرضها و منحهما حبها لقبول زواجهما على أرضها .<br />* و ما هى لحظات حتى كانت القاعة التى ازدحمت بالحضور تعلن عن بدء فاصل جديد من الرقص .. إذ تسللت إلى منتصف القاعة راقصة شابة .. كان المجون بادياً على وجهها . اتجهت صوب العروسين الرجلين و راحت تتمايل بينهما فى تؤدة .. و تعبر عن محبتها لشجاعتهما .. و راحت تدعو الفتيات الموجودات فى القاعة لكى يشاركنها فرحة الزفاف .. فاندفعن فى مساخر زاعقة .. يحيطن بها من كل إتجاه .. و هنا يتقاذفن ذات اليمين و ذات الشمال .. ليعربن عن سعادتهن بهذا الحدث الذى سيفتح الطريق أمامهن .. لكى تتزوج كل منهن من تحب من بنات جنسها .<br />و وسط السخط الذى عم المكان .. تقدم أحد العاملين بالفندق .. يدفع بتورتة كبيرة أمامه ( متر × 2 متر ) كتب عليها اسم الزوجين الرجلين ( الرجلين ) .. و كما يفعل فى حفلات الزفاف العادية .. راح يقدم لهما سكيناً ، و طلب منهما قطع تورته الزفاف .. إعلانا<br />اقرأ بقية التعليق .."
