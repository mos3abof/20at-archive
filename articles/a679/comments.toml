subject = "رمضان كريم مطلوب القبض علية"
text = "السلام عليكم ورحمة الله وبركاتة<br />انا شاب تحت 18سنة من المنوفية<br />سامح ملهط<br />رمضان السنة دى غير اى سنة خالص<br />انا عشت كتير وقليل ولم يظهر الانترنت بهذة الطرقة الا خلال هذا العامين السابقين ودة من ملاحاظتى للبية الى بعيش فيها بس ولاكن للاسف الانتر نت فى رمضان ضيااااع بمعنى ضياع لان الشباب لم تتعلق بالانتر نت لا للشات والماوقع الاباحية ولاكن اى صاحب سيبر او مقهى نت يحاول منع ذلك ولاكن لم يمنعة تماما ولا يمكن ان يمنعة من الشات ففى الشات بلاااااااوى الومن كلة وناس اعوز بالله اى حد من الاخر هيخش شات هيكون فاااطر<br />ولاكن فى اللاخر يقولون ربنا كريم بيسامح بس طبعا انا مش معاهم فى النقطة دى لان مش للدرجة دى طبعا"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024123509/http://www.20at.com:80/article.php?sid=679"

