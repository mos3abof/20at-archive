subject = "الأنترنت في المنوفية"
text = "السلام عليكم ورحمة الله وبركاته<br />أولا أتقدم للأمة الاسلامية بالتهنئة بمناسبة حلول شهر رمضان الكريم .... أعاده الله علينا وعلى الأمة الاسلامية بالخير واليمن والبركات.<br />ثانيا اقول أن الانترنت فى مدينة منوف أصبح راق جدا ولكن مع كثرته قى المدينة ولكن أن ليس الجميع يقدموا الخدمة بشكل صحيح<br />فيوجد من هذه المقاهى الكثير والكثير***وشكرا وكل عام وأنتم بخير<br />تم حذف الكلمات مكان العلامة(*)<br />وذلك لان الموقع لا يسمح بأستخدام التعليقات كوسيلة أعلانية<br />وشكرا<br />إدارة الموقع"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024123509/http://www.20at.com:80/article.php?sid=679"

