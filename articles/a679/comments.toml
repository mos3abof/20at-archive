subject = "أقبل ..... ياترى هل يكون آخر رمضان لنا ؟؟؟"
text = "أقبل ..... ياترى هل يكون آخر رمضان لنا ؟؟؟<br />ياترى مين عاش لرمضان الجاى ؟<br />انا سامح ملهط من منوف بصراحة انا شايف ان فى ناس طالعة برة الموضوع بتاعناخالص فا الان:-<br />يصبح المصريون اليوم صائمين عن الطعام والشراب, متمنين الشراء, ومنهمكين في المسلسلات, وناقمين على الأوضاع. إنه شهر رمضان المبارك الذي اصطبغ هذا العام بالجو السائد من شات الانتر نت<br />الذى هوا من راءى انة حراام لان اى شاب اليومين دول بيدخل على النت مش علشان يسمع عمرو خالد<br />ولا الكلام دة كلة لا علشان الشات الى ملوش اى لزمة ولا اى فايدة والبعكس دة بيضيع الصيام لانى عمرى مادخلت شات ومحدش شتم ومش بقول كدة على عمى السبيل لا انا استاذ شات والله لاكن فى رمضان لا ببقى عيل من الاخر اة عيل احسن ما اكون فاطر<br />فبقول لاى حد مسلم بلاش شات فى رمضان<br />بس مش معنى كدة بقول بلاش نت فى رمضان دة النت دة احلى وسلة تسلية فى فى الحلال وفى الحاجة المفيدة ومنة تضيع وقت وفراغ<br />وربنا يكرمنا كلنا<br />سامح ملهط<br />منوف منوفية<br />sameh2090@yahoo.co.uk<br />تم حذف رقم الهاتف"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024123509/http://www.20at.com:80/article.php?sid=679"

