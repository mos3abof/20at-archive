subject = "الانترنت فى المنوفية"
text = "أنا وائل حسين القاطن بالمنوفية<br />مدرس حاسب آلى<br />أتقدم إلى سيادتكم بالتعليق على موضوع مقاهى الانترنت<br />أقول ان الانترنت حاليا أصبح لا غنى عنه فى أى مكان<br />وأتمنى أن يتماشى هذا الموضوع مع قيمنا الأخلاقية<br />وأقول لجميع قارئى هذه الرسالة<br />كل عام وأنتم بخير<br />رمضان كريم أعاده الله عليكم وعلى الأمة الاسلامية بالخير واليمن والبركات"
archived = "2004-10-24"
capture_url = "https://web.archive.org/web/20041024123509/http://www.20at.com:80/article.php?sid=679"

