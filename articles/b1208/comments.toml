[[comments]]
order = 0
subject = "ناس رايقة"
author = "مزعج"
posted = "2006-09-12"
text = "والله انتوا ناس رايقة عمالين تفكروا عندنا كام حاسة خمسة ولا واحد وعشرين ...<br />الدور والباقى على الحكومات والانظمة العربية اللى مش عندهااى احساس بمعاناة شعوبها لانهم فقدوا كل حواسهم الا حاسة الخوف من امريكا ورجائها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114335/http://www.20at.com/article2.php?sid=1208"

[[comments]]
order = 1
subject = "حاسة اللخبطة"
author = "أحمد حربية"
posted = "2006-09-12"
text = "شريف جامد كعادته وبيكتب حلو أوي بس انا عايز ازود علي الأحاسيس اللي هوه كاتبها حاسة اللخبطة اللي انا حستها بعد ما قرأت الموضع بتاعه علشان الموضوع عجبني وال(مزعج)اللي معلق علي الموضوع قايل كلام صح جدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114335/http://www.20at.com/article2.php?sid=1208"

[[comments]]
order = 2
subject = "لا ناس بتخرجنا شويه من اللى احنا فيه"
author = "نيفين نيفى نوفا"
posted = "2006-09-12"
text = "انا مش فاهمه الناس اللى بتعترض على اى موضوع ترفيهى ايه وجهه نظرها بالظبط<br />يا جماعه احنا شئنا او ابينا الهم و الحزن و القهر السياسى و الفساد ف الانظمه العربيه موجود و صدقونى و الله الموضوعات دى مش هتهرب<br />مفيهاش حاجه لما نطالع شويه من اللى احنا فيه و نقرا موضوع خفيف<br />و بالمناسبه الموضوع لذيذ يا شريف بس انت نسيت حاسه مهمه و هى الشفافيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114335/http://www.20at.com/article2.php?sid=1208"
