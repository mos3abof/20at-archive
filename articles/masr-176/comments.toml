[[comments]]
order = 8
subject = "ربنا يقدر مبارك على فعل الخير"
author = "محمد ابراهيم"
posted = "2006-04-21"
text = "يااجماعة الريس مبارك ربنايخليه لينا وللعالم اجمع انتو نسيتو اهم حااجة الريس عملهالشعب مصر والحااجة دى فى كل محافظة وفى كل شاارع بمعنى اصح الريس عمل الى محدش عمله فى العاالم كلهخلى الابن والاب والجد يقعدو ع القهوة مع بعض الابن من البطاالة والاب من الخصخصة والجد من الجمال والحياة الحلوة الى الشعب عايشها .. وربنا يخليك لينا يااريس"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213058/http://masr.20at.com:80/article.php?sid=176&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 9
subject = "الريس والقلب الحنون"
author = "محمد ابراهيم"
posted = "2006-04-21"
text = "الريس مبارك الله يخرب بيته .. ااااااااااسف يعمر بيته محدش شاف الريس فى البرنامج الانتخابى بتاع معاليه لماا كان قاعد مع جماعة فلاحين وطبعا بعد مافلاحين غسلو هدومهم وحطو (جيل) امال هما حاايقلو مين ده الريس المهم محدش شااف الريس وه بيقول لفلاح انت محتاج حااجة وكله حنان واخوة الفلاح د عليه قااله عاوز 500 جنيه عشن اجيب سماد فرد الريس بااستغراب شديد ( معقولة انت ممعكش 500 جنيه الفلاح رد قاال لا والله ياريس قام الريس قال ازااى فى ااستغراب شديد برضه الريس معزور اصل ه ميعرفش ان فى بيوت فى مصر م فتوحة ب150 جنيه بس ... وربناا يخليك لينا يااريس"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213058/http://masr.20at.com:80/article.php?sid=176&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

