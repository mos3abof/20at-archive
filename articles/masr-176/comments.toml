subject = "حقيقه مش خيال"
author = "معارضة"
posted = "2006-04-20"
text = "السلام عليكم<br />الموضوع رائع و ان كنت متوقع ان الريس بيقول طظ في مصر دي كتير وده باين من افعاله يعني مش تخيل و لا حاجه<br />ارجو بس من شباب عشرينات ان يختاروا الفاظ اكتر احتراما من كده في التعليقات يعني يعبروا بحرية بس بدون الالفاظ دي<br />جزاكم الله خيرا"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213058/http://masr.20at.com:80/article.php?sid=176&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

