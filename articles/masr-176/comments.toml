text = "اقول عزرا سيدى الرئيس لم اكن اعرف انك من يوم توليك الحكم الى هزا اليوم المشؤوم فى عهدك واسئل الله ان ينتهى على خير انك يا دوووووووووووووووووووب بتامن للاولاد حياتهم اقصد على ما قدرت تجيب للاستاز(جمى) الشبكه الله يكون فى عونك ولى سؤال اخير ارجو الا يفهم عن طريق الخطا(من اين لك هزا)هل سمعت عنه قبل زالك"
