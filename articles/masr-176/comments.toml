[[comments]]
order = 15
subject = "ليس حوار وهمى"
author = "مصرية"
posted = "2006-05-04"
text = "لماذا تعتبروه حوارا وهميا وهومنذ ان حكم بيقول طظ وما معنى الفساد والسرقة والستب والنهب والاستبداد وفتح البلد لليهود على مصرعيهاوالكوارث والمصائب التى تنزل بنا كل يوم من عدم احترام ادمية الشعب والسير فى ركاب امريكا مثل الكلب حتى يضمن البقاء فى الكرسى ومليون طظ لكل مواطن ووجودة غير الشرعى بعد التزوير فى الانتخابات والتطاول على القضاة الشرفاء الذين هم الان امل مصر الوحيد بعدان فقدنا الامل فى الجيش ليس المهم ان يلفظ بها ولكنه يقولها على السبحة لو كان يعرفها لقد اوجد فى مصر نوع جديدمن الاحتلال هو اقذر وابشع من الاحتلال الاجنبى لكن الطمع والجشع اعماه عن مصيرة المحتوم الذى ينتظره وياله من مصير له هووشلة الحرامية اللى معاه وان غدا لناظره قريب وحسبنا الله ونعم الوكيل"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213058/http://masr.20at.com:80/article.php?sid=176&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

