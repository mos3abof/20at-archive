subject = "واللة بنحبك يا مبارك"
author = "كلابوش"
posted = "2006-04-20"
text = "مهما يقولو عليك احنا بنحبك يا ميارك الناس الا بتكتب دى بهايم ومش عارفين حاجة وفاكرين لما هيكتبو الاهيبقى وزير ولا مدير وطز فيهم كلهم وتحيا مصر"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213058/http://masr.20at.com:80/article.php?sid=176&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "كفاية نفاق"
author = "مصرى"
posted = "2006-04-20"
text = "يامصرى عمرك ما كنت منافق ولا كذاب ليه بتنافق الرئيس وبتقول أنك بتحبه هو أنت عايش فى بلد تانية ولا مش حاسس بالفساد إللى الشعب بيعانى منه بسبب حكمه هو إنت عايش فى مجتمع مافيهوش بطاله ولا فقر ولا مرض ولا نهب ولا سلب علشان تقول أنك بتحبه حبه زى مانتى عايز الله أعلم باللى بينك وبينه لكن اللى بين الشعب وبينه فجوة كبيرة قوى ولازم ها تنكسر وتنتهى بإنتهاء حكمه الفاسد قريباً جداً وياريب هو من نفسه إللى يسيب البلد علشان مش ها يقدر على إللى جى."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213058/http://masr.20at.com:80/article.php?sid=176&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

