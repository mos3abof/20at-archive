[[comments]]
order = 1
subject = "الله"
author = "اسامة /الغربية"
posted = "2006-04-20"
text = "لله يسامحك ياريس<br />خاف من الله<br />استحلفك بالله ان تتفرغ لله ساعة واقرأ سيرة النبى محمد وعمر بن الخطاب<br />انتى راعى ومسؤل عن رعيتك ياريس خاف من عزاب القبر<br />والنبى ياريس إرجع للة . والله ياريس انتى قلبك طيب بس تزكر ربنا عز وجل لأنك لاتعلم متى ستموت والله ياريس الدنيا مش مستهلا<br />وعلى العموم احنا مسمحينك على كلمت طظ<br />يااااااااااااااااااااااااااااااااااااااااااااااااااااااااااااارب سمحة"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524213058/http://masr.20at.com:80/article.php?sid=176&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

