[[comments]]
order = 2
subject = "بصراحة"
author = "اصل يا اخونا المسيحي لما بيحط رجله في حته يبقى عليه العوض حتبص تلاقي كل الحته اللي هو فيها كلهم مسيحيين."
posted = "2007-02-01"
text = "يعني مثلا واحد مسيحي اشتغل بتاع عصير قصب ولما لقاها شغله حلوه وبتكسب بصينا لقينا كل بتوع عصير القصب مسيحيين في مصر.<br />وتجار الدهب والصياغ مرة واحد مسيحي راح اشتغل عند واحد صايغ وبعد فترة بصينا لقينا كل تجار الدهب والمجوهرات كلهم مسيحيين.<br />وصدقوني والله لو واحد مسيحي اصبح دكتور في الجامعة حتلاقو كل دكاترة الجامعة بعد فترة مسيحيين."
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203075850/http://masr.20at.com:80/article.php?sid=1529"

[[comments]]
order = 3
subject = "الزموا أمر الله"
author = "ابن الإسلام"
posted = "2007-02-01"
text = "السلام عليكم ورحمة الله وبركاته<br />الإخوة والأخوات المسلمين أدعوكم جميعا - وأنا أقلكم قدرا - إلى الإلتزام بأسلوب الدعوة إلى الله تعالى<br />فإن هذا من شأنه أن يحبب الإسلام لغير المسلمين ويدفعهم لدراسته<br />أذكركم أن الإسلام انتشر في أربع أخماس الأرض بأخلاق المسلمين لا بسيوفهم<br />قال تعالى في سورة يوسف بسم الله الرحمن الرحيم \"قُلْ هَـذِهِ سَبِيلِي أَدْعُو إِلَى اللّهِ عَلَى بَصِيرَةٍ أَنَاْ وَمَنِ اتَّبَعَنِي وَسُبْحَانَ اللّهِ وَمَا أَنَاْ مِنَ الْمُشْرِكِينَ\"<br />و قال تعالى في سورة النحل بسم الله الرحمن الرحيم\" ادْعُ إِلِى سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُم بِالَّتِي هِيَ أَحْسَنُ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَن ضَلَّ عَن سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ\"<br />و قال تعالى في سورة العنكبوت بسم الله الرحمن الرحيم \" وَلَا تُجَادِلُوا أَهْلَ الْكِتَابِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ إِلَّا الَّذِينَ ظَلَمُوا مِنْهُمْ وَقُولُوا آمَنَّا بِالَّذِي أُنزِلَ إِلَيْنَا وَأُنزِلَ إِلَيْكُمْ وَإِلَهُنَا وَإِلَهُكُمْ وَاحِدٌ وَنَحْنُ لَهُ مُسْلِمُونَ\"<br />وقال النبي صلى الله عليه وسلم \"إنما بعثت لأتمم مكارم الأخلاق\"<br />وقال صلى الله عليه وسلم \" إن من خياركم أحاسنكم أخلاقا\"<br />اللهم اهد نصارى مصر وائت بهم"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203075850/http://masr.20at.com:80/article.php?sid=1529"

[[comments]]
