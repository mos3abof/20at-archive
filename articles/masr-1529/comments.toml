subject = "عذرا نسيت هذه الآية"
author = "ابن الإسلام"
posted = "2007-02-01"
text = "السلام عليكم ورحمة الله وبركاته<br />قال تعالى في سورة الأنعام بسم الله الرحمن الرحيم \" وَلاَ تَسُبُّواْ الَّذِينَ يَدْعُونَ مِن دُونِ اللّهِ فَيَسُبُّواْ اللّهَ عَدْوًا بِغَيْرِ عِلْمٍ كَذَلِكَ زَيَّنَّا لِكُلِّ أُمَّةٍ عَمَلَهُمْ ثُمَّ إِلَى رَبِّهِم مَّرْجِعُهُمْ فَيُنَبِّئُهُم بِمَا كَانُواْ يَعْمَلُونَ \"<br />اللهم اهد نصارى مصر وائت بهم"
archived = "2007-02-03"
