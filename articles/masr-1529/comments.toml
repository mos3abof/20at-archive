[[comments]]
order = 5
subject = "حرااااااااااااااااااام"
author = "نيفين نيفى نوفا"
posted = "2007-02-01"
text = "افعل ما شئت كما تدين تدان<br />و فعلا الظلم ظلمات يوم القيامه<br />مسيحى او مسلم الظلم حرام جمله و قولا<br />بس هما الكوادر العلميه دى مصائرهم للاسف<br />نظام عقيم و نفسيات مريضه و عقول مغلقه و للاسف ف ايديها مصائر الناس و مستقبلهم"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203075850/http://masr.20at.com:80/article.php?sid=1529"

[[comments]]
order = 6
subject = "الظلم ظلم"
author = "محمد النقيب"
posted = "2007-02-01"
text = "اولا انا ضد الظلم بكل انواعه وما حدث مع المعيدة حدث بسبب سوء النظام الاداري الذي لا يجد وسيلة للتعامل مع الشكاوي<br />مع احترامي الشديد لكل ما قيل عن الوحدة الوطنية وما الى اخره هناك بالفعل اضطهاد لمسته انا شخصيا من ناحية الاقباط ضد المسلمين..تجد ان الدكتور المسيحي يعطي الطلاب المسيحيين اعمال السنة كاملة وتجد ان الوحيدين الذين ينالون تقدير الامتياز في مادته هم من المسيحيون مثل احد دكاترة هندسة بورسعيد والذي يدرس للسنة الاعدادية مادة الستاتيكا ..<br />كلا الناحيتين ظلموا ولو كان هناك نظام سليم لمحاسبة التربويين لما حدث هذا منذ البداية ..لكن ان يتم فصلها تماما فهذا شيء خاطيء يجب ان يكون له وقفة فليس كل شخص تقدم ضده شكوى ما (قد تكون حقيقية او لا تكون) يتم فصله ..بدون تحقيق حتى .."
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203075850/http://masr.20at.com:80/article.php?sid=1529"

[[comments]]
order = 7
subject = "الوضوع ليس دينيا"
author = "فى فساداستان الموضوع مش دينى طول عمرنا فى المدارس المدرسين مسلمون ومسيحيين واتعلمنا كلنا على اديهم ومفيش اى مشكلة"
posted = "2007-02-01"
text = "انما المشكلة مثلا لو واحد عندة واسطة حلوة وعايز يشتغل يقوموا يفضوا مكان لة بنقل واحد شغال او انهاء خدماتة او او او<br />الموضوع موضوع فساد ادارى<br />موضوع انهيار قيم مجتمع<br />الموضوع ليس لة علاقة بالدين"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203075850/http://masr.20at.com:80/article.php?sid=1529"

[[comments]]
order = 8
subject = "الى اعتذار هانم"
author = "برافو يا ست يا اعتذار الف الف مبروك على الخطبة دية تصقيفه كبيرة للمعلمة اعتذار"
posted = "2007-02-01"
text = "وانا لسه مصر على رايي المسيحي لما بيحط رجله في حته تبقى مصيبه سودا يعني مثلا كل مدرسين الرياضيات والانجليزي ايام ما كنا في المدرسة كلهم مسيحيين وكل تجار الدهب والمجوهرات مسيحيين وكل بتوع عصير القصب مسيحيين وكل ما بيخشوا في كته بيسيطروا عليها وكل الصيادلة مسيحيين وكل الاندال مسيحيين وكل الخونة مسيحيين ومتحالفين مع اسرائيل ضد المسلمين وهتفوا في العباسية لشارون وبيحرضوا امريكا علشان خاطر توقف المعونة لمصر علشان خاطر مصر تشحت<br />عدوك هو عدو دينك<br />كانوا زمان ايام البابا السابق المدعو كيرلس رافعين شعار<br />لله المجد في الاعالي وعلى الارض السلام وفي الناس المسره<br />ولما جه البابا شنوده ولقوا مصر اتجهت لامريكا رفوا شعار النار النار على المسلمين.<br />علاوة على سب وشتم النبي محمد صلى الله عليه وسلم في كل مواقع الانتر نت بتاعتهم عليهم لعنة الله<br />فيا ست اعتذار ما تتحمقيش اوي كده لحسن تنزلك اليطه ولا حاجه صحتك بالدينا وخليكي في الوهم اللي انتي عايشه فيه كده لغاية ما السكينة تمشي على رقبتك"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203075850/http://masr.20at.com:80/article.php?sid=1529"

[[comments]]
order = 9
subject = "الي الأخ بتاع اعتذار"
author = "مهدي"
posted = "2007-02-01"
text = "هييييييييييييه برافو ايه الواد المتحضر بتاع اعتذار سقفه للحاوي يا عم والنبي تعرف تطلعلنا ارنب من ........<br />بص ياعم العلق لما المسلمين مرميين في المعتقلات بدون تهمه وولاد الكلب قاعدين يصرخوا بأسم اسرائيل في الشوارع ومايحصلش حاجه يبقي في حاجه غلط والنبي شوفت النبره التهديديه بتاعت ابوها ماسمعتش ياروح امك واحد مسيحي ابن قسيس خول بيقول لمسلم انا ابلغ عنك امن الدوله انت وحياه امك عاوز تعمل متحضر ارقد في حته ناشفه او سرح مراتك ولم ايرادها وقولها انا مسامحك يا حياتي انا متحضر اي موضوع اشغل نفسك فيه بس تيجي تعمل فيها بتفهم احب اقول لسيادتك بكل احترام انت حمااااااااااااار وعاوز تعمل نفسك بني ادم"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203075850/http://masr.20at.com:80/article.php?sid=1529"

[[comments]]
order = 10
subject = "هو فية اية"
author = "فهد الا سلام"
posted = "2007-02-02"
text = "الكلام دة فى مصر معقول الا خوة المسحين متهضين متهيلى انى احنا فى مصر ولية دة كلة علشان معيدة فى المو سيقى امال لو معيدة فى الذرة ولا حا جة تنفع البلد مش عارف مش مصدق المقال خا لص ومش عارف اعلق عليه بس عاوز اعلق على حا جة تانى يا ريت يا اخونا بلاش الا لفاظ الناية لا نى كل واحد بيتكلم بيبين بيتة ومتهيالى انى كل الناس الى موجودة معا نا محتر مين يعنى الى يقول رايها يعبر با حترام لا نى من اكبر الكبار ان يسب المراء اى الشخص اب الشخص التزموا بيتعليم الدين والا صول وبعد اذان ادارة المو قع ان تحذف اى رد خارج عن نطاق الا دب لانى دة بيجرح مشاعر المو جودين فى المو قع ويا ريت الا هتمام وشكرا"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203075850/http://masr.20at.com:80/article.php?sid=1529"

[[comments]]
order = 11
subject = "مهدى ؟؟؟؟؟؟؟؟؟"
author = "مافيش فايدة ؟"
posted = "2007-02-02"
text = "ادى واحد من الاخوان كلامة فى منتهى السفالة وكل دة علشان اعتذرت للاخوة المسيحيين ياخى افهم انا ساكن فوقى عائلة مسيحية فى منتهى الاحترام بنزور بعض فى المناسابات واولادهم متعطلين عن الشغل زينا بالظبط<br />هما بيروحوا الكنيسة واحنا بنروح الجامع لو حضرتك شفت نماذج تانية من المسيحيين اكيد كمان فية نماذج تانية من المسلمين ومتنساش ان الاغلبية مسلمين يعنى بلاش التعصب الغبى دة وبعدين لو حضرتك واللى زيك مسكتوا البلد حتعمل اية حتموت المسيحيين ولا فورا حتطبق العدل الاسلامى الجميل<br />طيب يااخى طبق العدل دة فى كلامك الاول<br />وشكرا"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203075850/http://masr.20at.com:80/article.php?sid=1529"

