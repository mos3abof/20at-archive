text = "لا يا كسمك اوريك زفاره اللسان ولا اقولك اللي احسن واقولهولك يا ابن الشرموطه ياللي زمان امك نامت تحت راهب دير المحرق لحد مافسخت يا عرص احنا اشرف منكم احنا مش بنشكك في شرف اي واحده علشان سابت ديننا احنا مش قرنيه وخولات يا ابن الشرموطه مش عارفين بناتنا بيروحوا فين وبعد كده نقول اصلهم اتخطفوا تحب تسمع زفاره تاني يا ابن الزانيه اتكلم تاني وهتسمع تاني يا مسيحي يا نجس"
