[[comments]]
order = 0
subject = "السياحة كلمة مطاطة"
author = "كبير الطباخين فى فنادق الدعارة"
posted = "2007-02-23"
text = "معنى كلمة سياحة فى مفهوم الناس الطيبين او ما يقال احيانا عنهم السذج هو قدوم اجانب من الخارج للاقامة فى الفنادق وشغل غرف ودفع ايجار وصرف على الاكل والشرب ثم زيارة الاثار الفرعونية وقلعة صلاح الدين ومسجد السلطان حسين وخلافة<br />هذا شق ظاهر ولكن الشق الخفى هو وجود الساقطات والعاهرات من اسرائيل وروسيا واكرانيا وقبرص فى تلك الفنادق واصطياد الزبائن وفتح زجاجات الخمر وقضاء الليالى الحمراء والزرقاء والعودة بزكريات الفجر والعهر عن مصر ونساء مصر اذ لا يخلوا الامر من وجود بعض الساقطات المصريات فى تلك الاماكن للرقص والعرى وعمل اشياء نابية ومنافية للاخلاق والذوق العام<br />كما يتواجد الكثير من العرب الذين ملوا نساء بنكوك فجائوا لتجربة النساء الاسرائيليات على الارض المصرية المباحة لاعمال الدعارة<br />تلك هى مراكز شرم الشيخ والغردقة النجسة التى هى من مراكز الدعارة بالدرجة الاولى<br />الم تنجح وزارة السياحة المصرية فى ذلك<br />النظام فرحان خالص بها<br />واى مليم يدخل الخزانة العامة من تلك الاموال هو مال نجس يطرد البركة من البلد<br />ويستفيد من الملايين التى جمعت الفقراء المصريين لبناء تلك المهاجع الساقطات الروسيات واليهوديات ام مصر فيعينى على مصر"
archived = "2007-02-24"
capture_url = "https://web.archive.org/web/20070224105727/http://masr.20at.com:80/article.php?sid=1625"

