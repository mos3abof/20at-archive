author = "سفير من الشرفاء"
posted = "2009-06-26"
text = "من الرجال المحترمين<br />مش افاق زى مصطفى الفقى ولا فرقع لوز ولا بهلول<br />من الشرفاء على ارض هذا الوطن<br />لم يرضى ان يسكت على الظلم وراى منكرا فاراد ان يغيرة ولو باللسان<br />شكرا سعادة السفير"
archived = "2009-06-27"
