author = "االغاز المصرى"
posted = "2009-06-25"
text = "قصة الغاز المصرى بكائية شديدة<br />فى ظل البطالة الرهيبة والشديدة بين شباب مصر وتدهور الاقتصاد ارسل اللة هدية للشعب المصرى هو اكتشاف الغاز<br />فى الدول التى اكتشفت الغاز استغلتة فى عمل صناعات البتروكيماويات وافتتحت عشرات المصانع لانتاج مركبات البلاستيك واليوريا والاسمدة والصناعات الكيماوية وكسبت اموالا طائلة ووظفت ابنائها وفتحت مجال الرزق امامهم<br />والمثال القريب السعودية وقطر<br />اما الغاز المصرى فاعطيناة لاسرائيل حاجة كدة ببلاش لتعمل منة صناعات كيماوية وتشغل معامل حيفا وتنتج منة وقود الصواريخ والمبيدات المسرطنة التى تصدرها الينا<br />فى رايى الشخصى ان قصة تصدير الغاز بكائية كبيرة من ناس جهلة مش عارفة قيمتها<br />اما سعادة السفير<br />اسف جدا فانت علامة انة لا زال بعض المصريين يفهمون وليس كلهم عندهم عتة كالقاضى الذى حكم علية<br />لا حول ولا قوة الا باللة"
archived = "2009-06-27"
capture_url = "https://web.archive.org/web/20090627135903/http://www.20at.com:80/masr/hewarat/12475-2009-06-25-12-53-13.html"

