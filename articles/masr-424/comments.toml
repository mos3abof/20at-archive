[[comments]]
order = 0
subject = "الراجل كان كويس"
author = "عبدالله مفتاح"
posted = "2006-05-31"
text = "الراجل احمد نظيف كان كويس اول ما مسك الوزارة انا مش عارف ايه اللي غيره<br />كل شويه يطلع بكلام فارغ<br />اكتر كلام فارغ قاله ان مصر علمانيه انا ساعتها حسيت انه معندوش فكرة عن اي حاجه ( في الطراوة) زي مبيقولو"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133311/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 1
subject = "يا سلام"
author = "م . ن"
posted = "2006-06-01"
text = "يعنى سيادته بيقول 88 نعم و 88 لا مش عاجبينه ...أمال 280 نعم و 280 لا هما الى عاجبين قوى !<br />تصريحات خايبة من رجل نظيف سياسياً"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133311/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
