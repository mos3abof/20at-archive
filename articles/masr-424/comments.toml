subject = "ظلمك يا نظيف"
author = "طه"
posted = "2006-06-01"
text = "ظلمك اللي خلاك رئيس وزراء"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133311/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 3
subject = "وزير عصر المعلومات"
author = "على"
posted = "2006-06-01"
text = "يمكن علشان سيادته وزير من عصر المعلومات وبيعترفش الا بالمعلومات فممكن يدخل على النت ويفتح جوجل ويكتب الاخوان المسلمين ويشوف النتيجه وممكن يكون هو عمل كده ومطلعلوش نتائج خالص فصرح التصريح ده وبعد شهرين اكتشف ان الكمبيوتر بتاعه مش واصل على النت وبيشتغل اوف لين"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133311/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 4
subject = "لا يا راجل"
author = "ياسر ابو سمية"
posted = "2006-06-01"
text = "لا والله يا عمنا ،ايه الافتكاسات المستحدثة دى ،اعتقد ان الاخ نظيف لان طوله غير طبيعى فهو لا يستطيع ان يعيش معانا فى نفس الوطن ،واتحسر ان تصريحات تخرج من رئيس اكبر (او المفروض يعنى )دولة عربية .لا استطيع وصف التصريه الا بانه (اهبل )وغير مسئول .لان اى عيل فيك يا مصر عارف الاخوان تمام ،وعارف شغلهم ايه مع الناس ،والخدمات التى يقدمونها لهم ،والتى يبخل السيد نظيف ووزارته على المصريين بتوفيرها .فى النهاية ارجو اعادة التركيز فىوجه البيه نظيف فى الصورة التى تعلو الموضوع وانتوا هتعرفوا سبب التصريح الخرافى له."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133311/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 5
subject = "سلم لى على بلد المليون كوبرى"
author = "شيش بيش"
posted = "2006-06-01"
text = "الموضوع يا اخوانى مش موضوع الاخوان المسلمين بس نظيف زعلان علشان المحور بيبقى زحمة كل يوم عشان كده متنرفز وانا بطمنه ان الكوبرى فى ميدان لبنان قرب يخلص والطريق هيبقى سالك"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133311/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 6
subject = "اتكلم علشان اعرفك"
author = "احمد"
posted = "2006-06-01"
text = "الراجل كان ساكت و كان طويل و ليه هيبه<br />و كنا فاكرينه بيفهم اكتر من القصير<br />لما بدا يتكلم ظهرت الحقيقه<br />رحم الله احد امراء المؤمنين والذى طلب من رجل ان يتكلم لكى يعرفه<br />و رحم الله احد شيوخنا عندما دخل عليه شخص اعتدل فى جلسته و لما سال الرجل سؤال وتكلم اتكا الشيخ مره اخرى<br />الخلاصه فيه مثل بيقول البيض الممشش بيتدحرج على بعضه<br />و الحدق يفهم"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133311/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 7
subject = "الى الدكتور / أحمد نظبف"
author = "أبو العربى البورسعيدى"
posted = "2006-06-02"
text = "عندك حق يا دكتور .. الأخوان المسلمون حقية موجودة وتورق مضاجع الصهيونية والأمريكان وتقف حجر عثرة ضد مخططات أسرائيل وأمريكا وأعوانهما من الأنظمة العربية العميلة .. والحل : 1- القبض على كل الأخوان المسلمين وأيداعهم السجون 2-تعديل الدستور بحيث لا يسمح بترشيح أى نائب مالم يكن عن طريق حزب ينتمى الية وطبعا الأخوان ليس لهم حزب فلن يترشح أحد منهم وبذلك تضمن عدم وصول الأخوان للمجلس 3-أن تسمح بأنشاء حزب شرعى للاخوان . أن اختيار أحد البدائل الثلاث سيضمن لك أحلاما هادئة بلا كوابيس ."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133311/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 8
subject = "نظيف مخه وسخ"
author = "a3mw"
posted = "2006-06-02"
text = "نظيف و مخه وسخ من الغسيل الامريصهيونى ستون عاما رغم القهر والسجون والاعدامات من الزبانية واعوانهم والاخوان يزدادون قوة وهذا الفرق بين الدعوةلوجه الله والدعوة لعملاء الشيطان وحسبهم الله ونعم الوكيل"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133311/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 9
subject = "كيف تأتينا النظافه؟"
author = "ammaaly"
posted = "2006-06-02"
text = "العِرافه<br />جثة مشلولة تطوي المسافه<br />بين سجن وقرافه<br />والحصافه<br />غفوة ما بين كأس ولفافه!<br />والصحافه<br />خرق ما بين افخاذ الخلافه<br />والرهافه<br />خلطة من أصدق الكذب<br />ومن أفضل أنواع السخافه<br />والمذيعون .. خراف<br />والإذاعات خرافه<br />وعقول المستنيرين<br />صناديق صرافه<br />كيف تأتينا النظافه؟!<br />غضب الله علينا<br />ودهتنا ألف آفه<br />منذ أبدلنا المراحيض لدينا<br />بوزارات الثقافه<br />أحمد مطر"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133311/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 10
subject = "ليه زعلنين"
author = "كتيبه"
posted = "2006-06-02"
text = "انا مدهش يا شباب من الغضب العارم فى تعلقكم علي المقال البلد محتاجه مليون صلاح غير الصلاح السياسى يريت تعملو حاجه اي حاجه غير الغضب المصتنع اتجهات كتير جدا محتاجه بلدنا نتحرك فيه تحيا مصر"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133311/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 11
subject = "الأخوان"
author = "محمد"
posted = "2006-06-21"
text = "الى كل من يقول كلاما جيدا على الأخوان ، اريد ان اوضح ان ظافر احمد نظيف احسن من رقاب الأخوان كلهم وخصوصا الكلب الى اسمه محمد مهدى عاكف .... واحب اقول ان الأخوان فى منتهى السوء انتوا الى متعرفوش حاجه."
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911051837/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 12
subject = "الشعب المصري مع الاخوان"
author = "خالد"
posted = "2006-06-21"
text = "والله مافي كلب الا اللي بيسب الاخوان والله يامحمد أنا شكك في ديانتك وفي اسمك محمد ازاي تشتم في ناس بينادو بتطبيق الاسلام على أصوله والله العظيم بلدنا عمره ما حاله يتصلح الا لو اطبق الاسلام<br />وأحب أقول أن رغم العقبات اللي كانت قدامهم في انتخابات مجلس الشعب من بلطجه وتزوير ووقوف الاعلام الزفت بتاعنا ضدهم الا أت الغالبيه العظمى منهم نجحت وياريت مصر بعد كده اللي يمسكها واحد من الاخوان"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911051837/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 13
subject = "الاسلام هو الحل"
author = "أحمد علي"
posted = "2006-06-21"
text = "الاسلام هو الحل غصب عن أي حد<br />واللي مش عا جبه يخبط راسه في اوسخ حيطه"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911051837/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 14
subject = "عيب عليك"
author = "أبوأحمد"
posted = "2006-06-21"
text = "يبدو إن المدعومحمداللي شتم مرشد الإخوان بإنه محروق أوووووووووي معرفش ليه يمكن يكون مرشد هو الآخر بس لأسياده اللي بيأكلوه عيش أوكلب من كلاب أمن النظام المسمون زورا بأمن الدولة وعشان كدة محدش يستغرب قلة أدبه وتفاهته وخيبته التقيلة أووووي والعبرة بالخواتيم وعموما أختم بقول الله عزوجل قل موتوبغيظكم0000 والبقاءللأصلح"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911051837/http://masr.20at.com:80/article.php?sid=424"

[[comments]]
order = 15
subject = "المستقبل للإسلام"
author = "مهندس (مغترب)"
posted = "2006-06-21"
text = "أتمنى على الدكتور نظيف أن يهتم بعمله ويوفر وظائف للشباب اللى خلص تعليم ويسيب الإخوان يقومو بدورهم الإيجابي في المجتمع اللي لايستطيع أي حدعاقل وبيفهم إنه ينكره وسيبوالشعب هواللي يختار وكفاية بقة مهاترات ومغالطات مالهاش لازمة لأن شكلكوبقى وحش وفضحتونافي كل الدنيا حرام عليكم ( استقيلويرحمكم الله ويرحمنا معاكم )"
archived = "2006-09-11"
capture_url = "https://web.archive.org/web/20060911051837/http://masr.20at.com:80/article.php?sid=424"
