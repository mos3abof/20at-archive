author = "وائل الغزاوي"
posted = "2009-10-06"
text = "اقتباس جورج:<br />رائع يا غزاوي لتاني مرة، استمر في البساطة دي وحاسب الموضوع يكلكع منك، او تخش في قضايا تانية، استمر على اللقطات البسيطة دي، سواء كان ليها دلالة ومعنى أو ملهاش<br />اشكرك يا جورج بس احب اعرف انت جورج اللى في بالي وله حد تانى<br />عموما اشكرك انت وجميع القراء على استقطاع وقتكم لقراءة هذه اليوميات واتمنى ان اظل عند حسن ظنكم"
archived = "2009-10-15"
capture_url = "https://web.archive.org/web/20091015133345/http://www.20at.com:80/masr/t7kyk/13626--2.html"

