text = "من قرأ منكم رسالة الشرقاوي من سجن طره هيعرف ان احنا مش هنتحرر طول ما في واحد بيضحي بنفسه و احنا في بيوتنا نايمين متهنيين<br />فعلا صدق عمرو بن العاص : فلا نامت اعين الجبناء<br />هو صحيح دي مقولة عمرو بن العاص و لا خالد بن الوليد"
