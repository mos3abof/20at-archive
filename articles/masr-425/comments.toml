[[comments]]
order = 9
subject = "التغيير يبدأ من داخلك"
author = "من ظن أن السماء تمطر ذهبا أو فضة ، فقد منى نفسه بالاماني الكاذبة ، كذلك من ظن أن زوال الظالم وبناء دولة المؤسسات ستبنى من دون جهد ولا تضحيات ، فقد أوهم نفسه بالسراب."
posted = "2006-06-01"
text = "إت الامم الحرة لم تنل حريتها الا بشلالات من الدماء ، والاف من الضحايا من الذين ارخصوا أنفسهم ؛ لتعيش أممهم حرة أبية.<br />ومن ظن أن الظالم السارق المتقلب في خيرات البلاد ، سيترك كل هذا اختيارا ، فقد أوهم نفسه بالاباطيل.<br />أخي الكريم ، هل تريد الاصلاح ، وبناء دولة الحق والعدل ؟ إذن عليك:<br />1. أرد التغيير.<br />2. اعمل من أجل التغيير.<br />3. ضحي من أجل التغيير"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133323/http://masr.20at.com:80/article.php?sid=425"

