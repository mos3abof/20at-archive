text = "يا هبهوب مش معنى انى قلته فى حكايه يبقى دا مبداى بالعكس انا مبداى الصراحه و الشجاعه<br />بس دا كلن سمعته و ذكرته مره بس<br />اللى يعيش نمله ينداس<br />بالنسبه لحلقه المدونون انا زعلانه موووووووووووت علشان مشفتهاش<br />متحسرونيش بقى"
