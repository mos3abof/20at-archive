[[comments]]
order = 16
subject = "عيش فرخه 0000 تندبح ف الاخر"
author = "الاستاذشيكو"
posted = "2006-06-03"
text = "انا بقه ابويا مش عارف هوة مع مين بالظبط بيدافع عن الحكومه بكل قوة ولما اقوله يا با با ايه الكلام ده يقولي هيا بلادنا كده وهاتفضل كده<br />الكبير بيالكل الصغير وهكذا000000<br />ولما تيجي سيرة عبد الناصر يتغير ويتنرفز ع الاخر من غير اي حاجه ويقول كلام من عينه ده برقبه حسني وابنه 00000<br />وبعدين اقوله يابابا عبد الناصر ده هو اللي غير نظام بلد بغض النظر عن ان فيه اخطاء ولا لاء بس هوة غير النظام اللي كان ماشي<br />والله يا جماعه انا مش عارف اعمل ايه ف الراجل ده00000 هايجنني<br />المهم سيبكم من ابويا انا عايز اعرف ليه كلنا كده مانتقابلش في يوم معين لتعارف والنقاش بس لنعارف والنقاش وبعد كده نفكر نطور من الاسلوب الحالي ان شالله نوزع منشورات ضد الفاسدين اللي ف البلد<br />ونرجع الناس ايام الملكيه اللي انا مصر علي اننا رجعنا ليها وسيبنه الجمهوريه اللي حاول يعملها عبد الناصر<br />ويكون اللقاء كلا في المحافظه بتاعته عشان انا من كفر الشيخ يعني فلاح اصيل والله<br />ومن المحافظه نخرج للمحافظه اللي جنبنا وكده يعني<br />لازم نكون فاعلين ومش مفعول بينا"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133323/http://masr.20at.com:80/article.php?sid=425"

