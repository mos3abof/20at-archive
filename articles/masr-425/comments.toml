[[comments]]
order = 1
subject = "نصيحة"
author = "محمد"
posted = "2006-05-31"
text = "نصيحة لكل شاب او بنت ناويين ينخرطوا في العمل السياسي او حتى يعملوا مدونة...اعملوا الحاجات دي من سكااااااااااات، زي ما بنعمل الف حاجة في حياتنا من سكات من غير ما اهلنا يعرفوا. لان انا اهلي حتى فاهمين وربوني على اني ارفض الظلم والكلام ده كله، بس وقت لما ببقى نازل مظاهرة بيركبهم 100 عفريت... فبنزل المظاهرة واتصل بيهم من برة ابلغهم اني في مظاهرة.<br />ولو اي حد ناوي يعمل مدونة بلاش يقول لأهله، مش عشان حاجة...بس عشان يكتب براحته :)"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133323/http://masr.20at.com:80/article.php?sid=425"

