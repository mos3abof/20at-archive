[[comments]]
order = 13
subject = "العيله كلها كده........احمدك يا رب"
author = "مرمورة"
posted = "2006-06-03"
text = "مش عارفه ليه اول ما قريت المقال افتمكرت حاجه حصلتلي في ثانوي ........كانت مدراس الثانوي وقتها بتخرج مظاهرات ...( الشهيد محمد الدرة ) ...كانت مظاهرات علي خفيف كده بس اهو الواحد كان بيتدرب برضه ..المهم مدرسه جميله كده دخلتلنا بتقنعنا قال يعني وقعدت تشتم في المظاهرات وتقول ايه الهبل ده ...حرقتلتي دمي ....قمت اناقشها وارد عليها.. .بصتلي بثقه وقالتلي يعني اهلك لو هنا دلوقتي هيرضوا انك تطلعي مظاهرة ؟؟؟؟؟؟؟؟؟؟؟.....كان متهيالها انها كده بتسكتني ....<br />لكن رديت وقلت ....اهلي لو هنا كان زمانهم طالعين معايا في المظاهرة ...الست معرفتش ترد<br />المهم......كانت اول مرة وقتها احس بنعمه ان اهلي ليهم نفس الافكار الثورجيه بلغتنا<br />بصراحه بافرح اوي وانا رايحه معاهم مؤتمر وللا اعتصام وللا مظاهرة .........ياه مقولكمش احساس تاني خالص واحنا ماشيين باعمارنا المختلفه من ماما وبابا ...مرورا بيا انا واخواتي اللي في جامعه ...انتهاءا باخويا الصغير اللي في ابتدائي .والله بييجي معانا<br />باحمد ربنا صبح وليل علي النعمه دي<br />الفرد في بلادنا مواطن او سلطان ليس لدينا انسان ....احمد مطر<br />لا للتمديد لا للتوريث .نعم لتعديل الدستور"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133323/http://masr.20at.com:80/article.php?sid=425"

[[comments]]
order = 14
subject = "علي الجانب الاخر بقي"
author = "مرمورة"
posted = "2006-06-03"
text = "موقف بيتكرر كل مرة بحذافيره<br />انا: انا رايحه المظاهرة جاية معايا<br />صاحبتي :لا يا ماما.. ..الحاجات دي ممنوعه عندنا ...باوامر عليا من بابا وماما ....انا مش عارفة اهلك سايبينك تعملي الحاجات دي ازاي ....ازاي سامحينلك بكده<br />بصراحه نفسي اسالهم ...هو انا باعمل حاجه غلط ...هو ايه اللي ازاي سامحينلك ....حسسوني اني باعمل حاجه عيب وللا غلط ...لا والجميل ان كلهم بلا استثناء بعد الكلام ده يقولولي والله بجد كان نفسي اكون معاكي بس اعمل ايه بقي<br />معني الكلام ده ان مش بس الاهل اللي يقولوا اه لاولاد غيرهم لكن ولادهم هما لا ...<br />كمان نص شبابنا بيبقي نفسه ويؤيدك في وقوفك ويتمني يكون معاك لكن عند الجد .ميقدرش يقف..جايز باختيارة لانه خايف ....اوبسبب ضغط اهله ...او جايز لانه مجربش<br />المهم ان العدد اللي واقف في كل مظاهرة بيبقي واقف حواليه وفي نفس المكان اضعاف عدد المظاهرة ناس بتتفرج واحيانا بتردد نفس الهتاف بس من بعيد يعني مش جوه المظاهرة ....منهم لله اللي خلوا الناس تبقي واقفه وبتردد وبتعمل نفس اللي بيعمله المتظاهر لكن من بعيد لانها خايفه<br />الفرد في بلادنا مواطن او سلطان ......ليس لدينا انسان.احمد مطر"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133323/http://masr.20at.com:80/article.php?sid=425"

[[comments]]
order = 15
subject = "مش مبدأى يا هبهوب"
