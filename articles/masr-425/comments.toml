text = "الموضوع جميل تسلم ايد اللي كتبه<br />بس انا حسيت ان المدونة مصيبه لا مش كده خالص<br />المدوننة ابسط من كده بكتييييير<br />كل الليعايز يعمل مدونة يعمل وميحطش في ياله حاجه خالص ويكتب كل اللي هو عايز يكتبه خلي الواحد يفضفض"
