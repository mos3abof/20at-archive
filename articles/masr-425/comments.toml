[[comments]]
order = 3
subject = "ربنا معاكو بجد دعوه بت في ساعه امتحانات"
author = "هووووووووووووبه"
posted = "2006-05-31"
text = "يا جدعان اسداجه بادال اللي عليها نقطه يخرب بيت كدا الواحد اتلخبط , بص يا جدعان انا بحب اتفرج من بعيد علي الرغم من كرهي لمبدا البت نوفا \" عيش نمله تاكل سكر \" وعيش ديناصور تنقرض \" خلوه \"عيش اسد تاكل لحمه \" , ولون يعني جربت مره اعمل بلوووووووووج بس مش سياسي \"وحزفته \" غتاته , السوال بقي ابويا يرضي يخلني اعمل واتكلم عن السياسه اه اه اه اه اصلوكو مش عارفين ابويا متبرع بيا , بمعني اخر نفسه يشوفني في معتقل \" جوا\" تناموا\" طبعا \" فاهمين<br />هو اساسا خليط علماني علي يساري علي اشتراكي يلا ربنا يخليك يا بويا , كل شويه نتكلم عن السياسه ومختلفين في كل حاجه ولما اتكلم عن مصر او مشكله سياسه يقولي \"مش شغلك\" ومع\" زلك\" ولاد البلد مش مخليه في نفسي حاجه و00000000000 علي راي الكابتن شيكــــــــــــــــو."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133323/http://masr.20at.com:80/article.php?sid=425"

