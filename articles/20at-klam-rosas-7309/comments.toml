author = "نيفين نيفى نوفا"
posted = "2007-10-19"
text = "ليه يا دعاء الكل ناسى مسلسل من اقوى المسلسلات ف رمضان و هو سقف العالم<br />و المسلسل رائع و التتر اكتر روعه و كمان كان بصوت محمد الحلو<br />عموما بالنسبه للباقى عجبنى جدا تتر النهايه لمسلسل قضيه راى عام و على فكره تتر البدايه برده كويس<br />و لو هنفنفن شويتين طبعا يتربى ف عزو اللى قارفانا على كل الموبيلات"
archived = "2009-09-13"
capture_url = "https://web.archive.org/web/20090913123056/http://www.20at.com:80/20at/klam-rosas/7309.html"

