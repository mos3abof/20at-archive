text = "لماذا تحدثتم عن تترات المسلسلات فقط ؟؟؟؟؟؟؟؟؟ ماذا عن البرامج الهادفة<br />تتر برنامج (الطريق الصح ) لمعتز في قناة اقرأ و برنامج (مع الله) للداعية نوارة في قناة الرسالة رووعة بصراحة جامدة جدا<br />و برضه تتر برنامج مصطفى حسني"
