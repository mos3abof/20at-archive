text = "اقسم باللة لو ترشحت لاعطيتها صوتى<br />انا مرة وانا راجل عجوز كبرة عملتها تحت كوبرى وخلف كشك كهرباء لان مفيش حمامات فى الشوارع ولا فى الميادين وساعتها شعرت بالمهانة واننى اشبة بحيوان او كلب ضال يفعلها على قارعة الطريق<br />ما هو لازم نبدأ بالحاجات الصغيرة دى<br />حمام عام فى الشارع - حديقة اطفال - ملعب للاطفال"
