text = "بدعى ليا و لماما و خطبتى و خويا و اختى و بابا (الله يرحمه)<br />و كمان بدعى لصحابى و الاهلى و اخوانى فى فلسطين<br />و بعدين بدعى للمسلمين كلهم<br />علشان كده للأسف مبلحقش ادعى على حد<br />بس نفسى ادعلى على<br />انتوا عارفين مين سبب البلاوى كلها و مش الشيطان ده استاذه"
