posted = "2006-03-03"
text = "بس انا ليا عتاب رقيق ع الباش مهندس (م.ح.م) .<br />لما انت من مشجعي الطرب كده وسميع قديم ماخدتش وانت معدي شريط من ابو جنيه ونص اللي بيتباع الرصيف في العتبه لورده<br />اسمعووووووووووني بقولكو ايه اسمعوني ) يمكن حد كان عبرك مع اني اشك في كده لانك بتبقى رايح بركه في القعده وخلاص .<br />واخيرا انا بهديك القصيده دي ...(اسالك الرحيلا .. لنجاة )..."
