subject = "يأمرون الناس بالبر......"
author = "نيفين"
posted = "2006-03-05"
text = "و الله يا sweet princess ضحكتينى باساللك الرحيلا و فكرتينى بروح قلبى هبهوب اللى الموقع مضلم من غيرها<br />و نفسى اقول كلمه للراجل اللى فوق يعنى ننصح نفسنا الاول<br />و ردا على التساؤل اللى بتطرحه عشرينات ف نهايه الموضوع و دلالته<br />و الله يا جماعه الجمله اللى قالها رئيسنا الموقر و السيد المبجل ان دلت فانما تدل على انه بيقول كدا كل مره و الناس بتنفضله"
