[[comments]]
order = 3
subject = ""
author = "فاتح"
posted = "2008-11-19"
text = "الست علياء ابو شهبة — صانك اللة ورعاك وامد فى عمرك<br />طيب لو الكاميرات دخلت مدارس البنات<br />واحدهم بحسن نية ولمراقبة بناتنا حط كاميرا فى حمامات المدرسة وحمامات السادة المدرسات بهدف طيب جدا وهو مراقبة البنات<br />وطبعا هيسجلوا ويعملوا افلام ويبيعوها بملايين وبكدة العملية التعليمية تنشط ويطلع بتاع وزير الاستحمار او الاثتثمار يقول لك دى عملية اثتثمارية مردودها جيد وان التنمية فى البلد زادت من 5 % الى 10 % فى المية<br />كاميرات اية يا ابلة<br />وقانا اللة شر الكاميرات<br />وعلى فكرة - فية بعض المولات الكبيرة جدا والفخمة جدا والفنادق بيحطوا الكاميرات دى فى حمامات السيدات<br />المهم يا ست علياء ابقى خدى بالك<br />وربنا يستر على ولايانا"
archived = "2009-10-06"
capture_url = "https://web.archive.org/web/20091006044205/http://www.20at.com:80/masr/t7kyk/10537-2009-10-04-13-27-34.html"

[[comments]]
order = 4
subject = ""
posted = "2008-11-19"
text = "كل المصالح الحكومية منهارة او على وشك الانهيار لان الموظف الحكومي يا دوب مرتبه يكفيه اسبوع واحد وبالعافية كمان فكل الموظفين بيشتغلوا على اد فلوس الحكنومة<br />مرة رحت شركة المياه في المنطقة اللي انا عايش فيها رحت الساعة 12 وبعدين بكلم الموظف شخص فيه وقالي تعالى بكره يا استاذ الشغل عندنا من 9 الى 11 بس<br />تتصوروا ان الموظف هو اللي حدد معاد العمل من 9 الى 11<br />على اد الفلوس اللي بياخدها<br />يا خوفي من اوباما"
archived = "2009-10-06"
capture_url = "https://web.archive.org/web/20091006044205/http://www.20at.com:80/masr/t7kyk/10537-2009-10-04-13-27-34.html"

[[comments]]
order = 5
subject = ""
author = "وزير التربية مهندس"
posted = "2009-10-04"
text = "من سخرية القدر او من سوء الحظ او من تدبير حكماء صهيون للقضاء على التعليم فى مصر ان لا يوضع الرجل المناسب فى المكان المناسب ليتم التخريب عن جدارة<br />فالسيد وزير التربية والتعليم الموقر ليس رجلا تربويا<br />فهو خريج كلية الهندسة قسم كهرباء قوى جامعة الاسكندرية دفعة 1968<br />اى انة مهندس كهرباء<br />وكل ابحاثة فى الطاقة النووية<br />واشتغل بالتدريس فى كلية الهندسة ومعامل القوى الكهربائية<br />ما علاقة رجل مثل هذا بالتربية والتعليم<br />هل دكاترة وخبراء التربية ماتوا<br />انا على ثقة انهم ممكن المرة الجاية يختاروا عجلاتى للاشراف على العملية التعليمية"
archived = "2009-10-06"
capture_url = "https://web.archive.org/web/20091006044205/http://www.20at.com:80/masr/t7kyk/10537-2009-10-04-13-27-34.html"

[[comments]]
order = 6
subject = ""
author = "كاميرات مراقبة"
posted = "2009-10-04"
text = "اة طبعا الكاميرات هتخللى الحياة لونها بمبى<br />وخصوصا فى حمامات مدارس البنات الثانوى وحمامات الست الناظرة والمدرسات<br />هتشوفوا اللى عمركم ما شفتوة<br />هتكرهوا حياتكم<br />وهتتعقدوا من الجواز<br />فكرة بديعة<br />وفية كاميرات لاسلكية بتنقل الارسال عن بعد - بمعنى انك تراقب وانت فى بيت قريب من المدرسة وعلى شاشة التليفزيون<br />يعنى ممكن واحد مخبول يتسلل الى المدرسة ليلا ويركب الكاميرا فى الحمام بتاع البنات ويروح وتانى يوم يسجل ويبيع<br />هتفتحوا باب الشيطان مفيش احد هيعرف يقفلة"
archived = "2009-10-06"
capture_url = "https://web.archive.org/web/20091006044205/http://www.20at.com:80/masr/t7kyk/10537-2009-10-04-13-27-34.html"

[[comments]]
order = 7
subject = ""
author = "المدارس الاهلية"
posted = "2009-10-04"
text = "سيبونا من الحكومة ومدارس الحكومة لان الحكومة ماتت من زمان<br />والشعب يشوف مصالحة بقى<br />نعمل مدارس اهلية يعنى كل حى يؤجر كم شقة ويعملهم فصول ويعين مدرسين يشتغلوا فيها وبرسوم محدودة جدا كانهم بياخدوا دروس خصوصية<br />ونعمل اجهزة حماية اهلية ونؤجر شوية عيال اجسامهم كويسة يحرسوا الحارات والشوارع ويضربوا البلطجية<br />ونعمل ورش ومصانع اهلية ونشغل عيالنا<br />ونمتنع عن دفع الضرايب لان الحكومة لا تقدم اى خدمات مقابل الضرايب<br />احنا بندفع ضرايب علشان الصحة والتعليم والنظافة والامن هما فين<br />الحكومة ماتت وشبعت موت<br />وشوية العيال بيتصارعوا على الكرسى<br />وبعدين<br />ارمى ورا ضهرك"
archived = "2009-10-06"
capture_url = "https://web.archive.org/web/20091006044205/http://www.20at.com:80/masr/t7kyk/10537-2009-10-04-13-27-34.html"
