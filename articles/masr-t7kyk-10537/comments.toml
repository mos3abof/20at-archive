subject = ""
author = "دة اسمة كان"
posted = "2008-11-18"
text = "فريكيكو لا تلمنى<br />اقسم باللة العظيم ان كتاب سيدنا والعريف كان بيعلم احسن من مدارس الجمل<br />الطفل الصغير يتعلم لغتة القومية ومبادىء الحساب وتنمية جسمة رياضيا وشوية مهارات زى الاشغال والكمبيوتر كمهارة وليس كمادة دراسية<br />وبعدين لما يطلع الاعدادى نعلمة لغة تانية<br />ولما يطلع الثانوى نعلمة لغة تالتة زى زمان<br />انما التخبط فى المقررات افشل العملية التعليمية تماما<br />وبيطلع طفل تعبان دراسيا واخلاقيا ويعمل تحرش لما يكبر ولا يحترم اهلة او والدية<br />التعليم يا جماعة منهار<br />منهار<br />واللى مش مصدق يروح يدخل اى مدرسة حكومية الساعة 10 صباحا مش هيلاقى احد"
archived = "2009-10-06"
capture_url = "https://web.archive.org/web/20091006044205/http://www.20at.com:80/masr/t7kyk/10537-2009-10-04-13-27-34.html"

