[[comments]]
order = 3
subject = "عمار يا مصر"
author = "صايع وقديم"
posted = "2006-06-04"
text = "في الممنوع<br />بقلم مجدي مهنا<br />وصلتني هذه الرسالة من معتقل سياسي سابق:<br />السيد/ ......<br />قرأت مقال حضرتك بتاريخ ١٠/٥/٢٠٠٦، وقد انتابتني نوبة هستيرية من الضحك، وشنفت أذني بحديثك العذب البريء، وكان ذلك عندما كتبت عن حقوق المعتقل السياسي، فاسمح لي أن أشنف أذنيك، وأفزع حنايا قلبك، وألهب ثنايا جوانحك، ولتمسك بقايا جوارحك.<br />قد كنت معتقلاً سياسياً وخرجت للتو منذ شهور، بعد اعتقال دام ثلاثة عشر عاماً، منذ عام ١٩٩٢، لم أتهم بأي تهمة، ولم يتم عرضي علي نيابة أو محاكمة، ولم أقترف عنفاً قط، ولم أحرض عليه قولاً أو فعلاً، ولدي كل الأحكام القضائية بالإفراج عني، والتي بلغت ثمانية وعشرين حكماً، وأقيم بصعيد مصر (طالب بكلية الإعلام)، فماذا تعلم عن أساليب هذا النظام الذي يمور في حمأة وبيئة ومستنقع آسن من الأكاذيب، ويهوي إلي درك هابط، وهوة سحيقة من التضليل، سوف أحكي لك نذراً يسيراً جداً، مما تشيب له الولدان وتقشعر له الأبدان، و يفزع له الوجدان، فلقد رأيت وذقت تعذيباً لا يخطر علي قلب بشر، إي وربي.<br />كنا خمسة من المعتقلين (م) طالب بالسنة الأولي بكلية الطب، و(أ) طالب بالفرقة الثانية بدار العلوم، و(أ) مهندس، و(س) مدرس ثانوي، وأنا خامسهم، في زنزانة عرضها متران وطولها متران ونصف تقريباً، وارتفاعها أربعة أمتار، جدرانها منقوعة في الكيروسين إمعاناً في عدم تنفس الهواء الجيد، وإعدامنا بالبطيء بخراب الصدر والرئتين، وأرضيتها من الأسفلت، ولا يوجد في الزنزانة أي نوافذ أو فتحات للتهوية، إلا كوة صغيرة قطرها (١٠ سم تقريباً) في سقف الزنزانة لمراقبتنا، ولسوف أضحك كثيراً إن سألتني عن النور والكهرباء والشمس، فتلك أمور ترفيهية، بل لا أبا<br />اقرأ بقية التعليق .."
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920203425/http://masr.20at.com:80/article.php?sid=449&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "مسؤوليتنا تجاه التعذيب"
author = "إن كل انسان مسلم أو حتى غير مسلم يعذب ، تقع مسؤولية تعذيبه على المجتمع عامة ؛ لأنه رضي بالظلم وتواطأ مع الظالم بسكوته وخنوعه."
posted = "2006-06-04"
text = "ولو أن كل مظلوم نصر ، وانتفضت الامة من أجله ؛ لم تجرأ الظالم أن يظلم.<br />والامر لايزال بأيدينا -نحن المجتمع- فما علينا الا أن نتكتل ضد الظالم ونقيم دولة الحق والعدل التي لا يظلم فيها انسان.<br />والبداية -اخوتي- انما تكون بالاستجابة لكل دعوة للمظاهرة او الاعتصام من قبل دعاة الاصلاح.<br />انشروا ثقافة الجرأة ضد المستبد ، وبينوا للناس حقوقهم في اختيار ومحاسبة امراءهم ، وأن على كل فرد في المجتمع صغر أم كبر مسؤولية اقامة دولة الحق والعدل."
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920203425/http://masr.20at.com:80/article.php?sid=449&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "جبت اخري خلاص ومعدش فيا نفس"
author = "saber"
posted = "2006-06-04"
text = "قد اسمعت إذ ناديت حيا....ولكن لا حياة لمن تنادي<br />حسبي الله ونعم الوكيل في اللي بيحصل<br />انا خلاص...كرهت البلد ديه ومش عاوز اعيش فيها.....<br />كل الظروف بتجبر الواحد انه يمشي منها<br />امته يجي اليوم اللي ربنا يكتبلي النجاة منها....واخد اي جنسية تانية غيرها....بدل جنسية الفشل والكبت والذل....مش شرف لأي واحد انه يكون مصري...متضحكوش علي نفسكم وتقولوا بلدنا وانتمائنا والكلام اللي كنت بحبه اوي وديما بقوله....الظروف مش هتتغير ولا احنا هنتغير....يبقي نخرج بقي ونتقدم ونبدع بعيد عنها"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920203425/http://masr.20at.com:80/article.php?sid=449&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "هوة ايه بالعافيه00000"
author = "الاستاذشيكو"
posted = "2006-06-05"
text = "الناس كلها عارفه ان البلد دى بايظه من ايام الملك وهاتفضل بايظه بارضه بعد مبارك<br />انا بصراحه خلاااااص اصبحت ياااااااااااااس ومش عارف اعمل ايه<br />انا باين عليا هافكر في السفر بالطرق المشروعه والغير مشروعه<br />دي حاجه تعقد بجد ان الواحد يعيش فب بلد واكله ناسها ايوة مصر بلد طول عمرها واكله ناسها<br />واكله ناسها<br />واكله ناسها<br />4 مرات عشان الشرع قال 4<br />ايه القرف ده دي حاجه تقرف بجد"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920203425/http://masr.20at.com:80/article.php?sid=449&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "انا مشعاوز حاجه من البلد غير انها تجوزني"
author = "مسجل في أمن الدوله"
posted = "2006-06-08"
text = "يا مصر يلي كنت ام الدنياانا مش عاوز منك غير انك تجوزيني جايز لما اتجوز اتلم واعقل شويه \" دى كلام كل شباب جيلي انا يا ىجماعه شاب مغترب في الكويت اللى بشوفه هنابيخلي العقل يشت بجد الناس هنا او الحكومه بتاع البلد دي بتعامل شعبها معامله ياسلام اللى عاوز يتجوز بيقدم طلب للدوله والدوله بتدفع عنه المهر وبتديلو بيت مش شقه اللى هي كل امنيات الشباب شقه وكمان بتوظغه وهو مكملش اعدادية حتى وبياخد قد منا باخد 50 مره ومع انه لا يفقه شئ ...ابص للعالم دى وابص لشبابك يا بلدي الحصره بتاخودني والزعيم بتعنا لسه شادد الحزام فكه بقى يا اخي ربنا يفكها عليك يا يفكنا منك لا وظيفه ولا فلوس ولا راتب ولا شقه احمدك يارب كفايه علينا الصحه ولا عاوزها يا زعيم خدها وكفايه علينا نموت اهو نبقى اترحمنا<br />بس انا كل اللى بتمناه تدفعلي الشبكه اللى بقت ب15 الف جنيه وتدوني شقه غرفه فيها المطبخ والحمام والصاله والسلم بتاع العماره اهو حتى ناخد حقنا في حاجه مش هيبقا من كله انا ساعات بتيجي عليا لحظات بحسد الحيوانات على النعمه اللى ربنا مديهلهم !!!!!! حتى يازعيم مخلتناش نحصل الحيوانات والله يرحمك الف رحمه ونور تنزل عليك يا عبد الناصر<br />بس سؤال صغير انا على ما اعتقد في دراسه كنت قرتها قبل كده ومحدش يعرف الدكتور اللى عملها فين لحد دلوقتى ناس بتقول انو تحت الارض وناس بتقول انو معتش نافع نفسه المهم الراجل دى قال ان لو كل مواطن مصري حد نصيبه في ايراد قناة السويس 75% من المشاكل اللي في البلد هتخلص ومش هيكون لها وجود والراجل كتر خيره كان واضع حلول كتير ونتايج الحلول دي كانت جواز الشباب وفلوس يفتحو بيها مشاريع وكلام زي كده بس إظاهر الزعيم محبش حد يشاركه في السبوبه اللى بياكل منها عيش فدفن الراجل دى واكيد قالو \" اللى هيقطع عليا اك<br />اقرأ بقية التعليق .."
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920203425/http://masr.20at.com:80/article.php?sid=449&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
