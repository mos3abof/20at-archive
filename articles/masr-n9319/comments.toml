text = "السلام عليكم<br />رغم اختلافي الشديد مع شيخ الازهر إلا أني لا أوا فقكم في السخرية منه بهذه الطريقة.<br />الدعاء مخ العبادة فلا يصح استخدامة كوسيلة للسخرية.<br />\"وقل لعبادي يقولوا التي هي احسن ان الشيطان ينزغ بينهم ان الشيطان كان للانسان عدوا مبينا\"<br />سلام<br />حسام الزمر"
