author = "اذا كنت انت كاتب هذا المقال فانت انسان سافل ومنحط اخلاقيا وكل المعلقين الذين ايدوك ومشيو على الخط ناس لا اخلاق لهم ولا دين ولا ضمير واولهم الفاشل ابن بهية وكان يجب ان نتعلم من المسيحيين في مشارق الارض ومغاربها كيف يحترمون رجال دينهم."
