text = "ان شيخ الازهر عالم جليل متفهم الظروف تماما التي تمر بها امتنا الاسلامية<br />ان اهانة علمائنا هي بداية النهاية يا شوية بقر<br />اتفوووووووووووووووووووو عليهم يا شوية زباله<br />اتفوووووووووووووووووووو عليهم يا شوية زباله<br />اتفوووووووووووووووووووو عليهم يا شوية زباله<br />اتفوووووووووووووووووووو عليهم يا شوية زباله"
