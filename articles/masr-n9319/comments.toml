[[comments]]
order = 5
subject = "الـــثـــقــــة بالنفس وعدم القدرة ؟؟"
author = "A_ToTTi201"
posted = "2007-01-01"
text = "الثقة بالنفس تدل على ان انا واثق من نفسى فى اعتناقى لدينى بمعنى انى مقتنع بكل ما فى /<br />اما عدم القدرة على الاقناع:<br />مثال بسيط لما يكون فى شخص يريد ان ينتقد شخص اخر ولكن ليس لدية من ادلة كافية حتى يضع النقد فى مكانة الصحيح!!!! فا يعمل اية علشان يعينقدوة يقوم بالاستهزاء بية وذلك فى اى شى حتى ولو كان هذا الاستهزاء ليس فى محلة ما هو مش قادر ان يجد ادلة كافية فا يتخذ هذا الاسلوب !!! وهذا ما حدث !! كــل سنة وانتم طيبين جميعن مسلم ومسيحى!"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104070617/http://masr.20at.com:80/article.php?sid=1386"

