[[comments]]
order = 9
subject = "انتو مش فاهمين حاجة"
author = "حسني مبارك"
posted = "2007-01-04"
text = "انتو لسه بدري عليكم جدا لما تفهمو الدنيا ماشية ازاي, انتو فاكرين الاعتقالات والغلا والخنقة دي راضيانا. ابدا الامور دي كلها بتقطع في قلبي الحنين بس المضطر بقى لأن الشعب المصري زيه زي كل الشعوب العربية مينفعش معاهاالا الاسلوب دا والا كانت البلد خربت, لو مش مصدقين شوفو الحرية والديموقراطية عملت ايه في لبنان والعراق وفلسطين. احمدو ربنا واشكروه على النعمة اللي انتم فيها لا تزول وسيبوا القيادة لأهلها"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104070617/http://masr.20at.com:80/article.php?sid=1386"

[[comments]]
order = 10
subject = "كدة حرام"
author = "فهد الا سلام"
posted = "2007-01-04"
text = "معلش انا هتكلم بعيد عن المو ضوع بس اصلة حا جة تغيظ وتبين ان احنا وصلنا لحد فين فى التخلف الدينى انا ملحظ ظا هلرة غريبة فى العيد ان النساء والر جال بيصلوا مع بعض فى مكان واحد والله دة حرام ازى يعنى وقد قال رسول الله علية واهلة السلام ان خير صفوف الرجال الصف الا ول وخير صفوف النساء الا خير حتى فى ابسط الا شياء نخلف النبى حسبنا الله ونعم الوكيل"
archived = "2007-01-04"
capture_url = "https://web.archive.org/web/20070104070617/http://masr.20at.com:80/article.php?sid=1386"

[[comments]]
order = 11
subject = "معلش"
author = "أصله منافق وهو عارف موقع المنافقين فين والله ما كان قادر يطلع السلم علشان يلقى الخطبة ومع كلاً مش راحم نفسه ولما جه يدعى لولى نعمته إللى بيفصل له التشريعات الدينية حسب مقسة راح مقرب قوى على الميكروفون علشان يسمعه أنا باستغرب الناس دى عايزة إيه أكثر من إللى حققته فى الدنيا دى حتى إسمها دنيا يعنى من الدنو ليه ما يترفعوش بأخلاقهم ويبقوا فعلاً أهل للدعوة وربنا ها يرزقهم من خزائنه التى لن تفرغ أبداً"
posted = "2007-01-04"
text = "اللهم ولى علينا خيارنا ولا تولى علينا شرارنا"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010451/http://masr.20at.com:80/article.php?sid=1386"

