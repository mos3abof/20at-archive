[[comments]]
order = 2
subject = "الشباب شباب القلب"
author = "محمد"
posted = "2005-11-24"
text = "لسلام عليكم ورحمة الله وبركاته<br />للاسف الشباب اتعمل فى مدارس الحزب الفاسد اتعلم على ايدهم ازاى يقوم حاضر ونعم وبس<br />اتعلم ازاى يشوف الحرامى ويساعده<br />اتعلم يسكت على الحق ويتكلم مع الباطل<br />اتعلمنا حاجات كتير اوى اتمنى ان الروح الجديد والحزب الجديد<br />يدور على الشباب اللى هيطلع وينضف عقولهم ويعملهم حاجات كويسة عند كده<br />وعلى فكرة انا واحد من الشباب اللى عرفت معياد استخراج البطاقة الانتخابية<br />بس ساعتهامكنتش اعرف ان هيبقى فى جديد<br />وان الاخوان راجعين بجد لو كنت اعرف كنت عملت بطاقة وكنت رحشت عضو الاخوان عندنا"
archived = "2006-09-30"
capture_url = "https://web.archive.org/web/20060930004550/http://egyvote.20at.com:80/article.php?sid=42"

