text = "هى دى مصر يا رجاله يعنى حتى مستكترين علينا الكلام والرغى ما احنا صايعين وخلصنا جامعات ومش لاقين شغل لا ويطلعلك عالم يا اخى تقرف بس برضه هنعمل اللى احنا عايزينه"
