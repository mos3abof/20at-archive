subject = ""
author = "كلنا صايعين"
posted = "2009-07-26"
text = "كلنا والحمد للة صايعيين ومعاش مبكر ومفيش لا شغلة ولا مشغلة بامر الدولة<br />مفيش لا قطاع خاص ولا قطاع عام بيشغل<br />قاعدين فاضيين للكلام<br />برخامة اهلك هنتكلم وهنشتم اللى احنا عايزين نشتمة ولو جدعان يحبسونا<br />احنا صايعيين وضايعين ومعانا مؤهلات من كليات القمة وقاعدين"
archived = "2009-07-30"
capture_url = "https://web.archive.org/web/20090730213233/http://www.20at.com:80/masr/2khbar/12744-2009-07-26-06-22-58.html"

