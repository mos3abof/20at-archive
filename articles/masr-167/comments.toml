subject = "مفقوع من المفقوعه"
author = "المفقوع"
posted = "2006-05-26"
text = "انا موافق على كل كلمه اتقالت لك ..ومن رأى ياجماعه لا تعطوها ولا لكلامها أى أهميه فهو لم يخرج عن كونه نباح كلاب ضاله وكلامها مش حنقص من قيمة مصر ولا المصريين وخليها تموت وتروح فى ستين داهيه بفقعتها وساعتها مش حتلاقى غير تراب مصر يلمها"
