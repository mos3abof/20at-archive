[[comments]]
order = 2
subject = "دفاع فاشل"
author = "عبد الله"
posted = "2006-04-16"
text = "الحقيقة دفاع الشرنوبي ضعيف وساذج ولو كان محامي كان ودى المتهم في أبو نكلة والحقيقة مهما كانت درجة استفزاز الصحفي للمرشد العام للاخوان فما كان يجب أن تخرج هذه الكلمة من فيمه مصر الوطن أعز وأغلى من ان يقال فيها مثل هذا اللفظ ومصائب وكوارث وفساد النظام الحاكم ليست مبررا للإساءة لمصر العظيمة وشعبها العظيم رغم أنني ضد الضجة الكبيرة التي عملتها روزا اليوسف"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212851/http://masr.20at.com:80/article.php?sid=167&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "رد علي الاستاذ عبدالله"
author = "مصري مقيم باجمل بلد ( دبي )"
posted = "2006-04-19"
text = "الاستاذ عبدالله محسسني انه بيكلم عن حاجة مهمة يعني بيقول ازاي مرشد الاخوان بيقول الكلمة ديه عن مصر يا سيدي الفاضل ارجوا من الله ان تون خرجت عن حدود مصر لتري ان كلمة طظ المذكورة يجب ان تكتب بمطار القاهرة وعلي مكتب كل موقع مسئول بمصر سيدي الفاضل كفانا شعارات واهية كفانا قومية وعروبة وياريت يبقي انتمائتنا واضحة يعني لو اسلاميين يبقي انتمائنا اسلامي بس يكون فيه انتماء لقضية حقيقية علي فكرة دور مصر لو تلاحظوا بيتراجع بسرعة رهيبة علي كل المجالات أولا:اسلامياً طبعاً منبر الازهر تحت يد السيد طنطاوي حدث ولا حرج ثانياً:اقتصاديا وطبعاً الحالة انت عايشنها اكتر مني انا بسمع بس ثالثاً:فنياً ادني مستوي فني هو اللي بيخرج من مصر ماعدا الفتات ايه تاني لو فضلنا نحصر السلبيات مش هنخلص أرجوا من اي حد عنده موضوع العروبة والقومية ده سخن حبتين يرد عليا احنا هنا بنتعامل مع 5000 جنسية وعقلية وديانة وشكراً جزيلاً لسعة صدركم"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212851/http://masr.20at.com:80/article.php?sid=167&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "يا مصرى اجمل بلد مصر"
author = "نيفين"
posted = "2006-04-19"
text = "و مش بقولها شعارات<br />اغلى بلد مصر و احلى بلد مصر و دا اولا<br />و بعدين يا جماعه فعلا زى ما قال عبد الله كلمه طز مرفوضه و لا هو كل واحد عاوز يعمل فرقعه ف اللى كاتبه يشتم<br />كفايه بقى وبعدين عارفين و الله البلاوى اللى ف البلد بس مش<br />هنشتم بلدنا كمان<br />المرشد قصده و لا مش قصده متتقالش الكلمه دى<br />و روز اليوسف عايزه جنازه و تشبع فيها لطم<br />و يا ريت يا عشرينات نقفل الموضوع دا بقى"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212851/http://masr.20at.com:80/article.php?sid=167&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

