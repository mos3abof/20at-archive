[[comments]]
order = 0
subject = "جامد يا عبدالجليل يا شرنوبى !!!"
author = "الشمحطجى"
posted = "2006-04-15"
text = "مقالك جامد يا عبده<br />بقى سايبين البلد الى اتنهبت حتى اللباس سرقوه منها وماشية دلوقتى بلبوص وماسكين فى كلمة لا هتودى ولا تجيب خرجت من واحد بلغ من الكبر عتيه وبصراحة لما قريت الحوار بتاعه لقيت الراجل مغلطش جامد وبيقول ان إنتمائه الاول للاسلام ومش عارف إيه وانه معدوش مشكلة فى انه يحكمه ماليزى ولا مش عارف اندونيسى المهم انه يحكم على مبادئ معينة الراجل مؤمن بيها \"مغلطش قوى \" ما هو لو كان بيحكمنا واحد محترم انشالله يكون من ديارى كفر ولا حتى من نيكاراجوا ويكون امين ومحترم احسن من شلة الوساخة الى طبقو على نفس البلد بقالهم اكتر من خمسين سنة شافطنها فى كروشهم الواسعة.<br />حال البلد خلاص وصل لمرحلة اللاعودة وربنا يستر الفترة إلى جاية من ولاد الأحابى الى فى قصر القبة وشرم الشيخ ....<br />اطزز واحد فى مصر<br />الشمحطجى"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212851/http://masr.20at.com:80/article.php?sid=167&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

