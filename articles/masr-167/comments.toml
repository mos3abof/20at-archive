subject = "تحيا مصر قوية عزيزة"
author = "مصرى عايش بدبى"
posted = "2006-07-16"
text = "مصرية مفقوووووووووووعة عايشة في أحلى بلد (دبي) دانة الدنيا<br />للاسف سمة كلاب يقولون هذا الكلام .. هل بدبى سيحترموك على اهانه بلدك يا كلبة يا لقيطة .هذا أكبر العقوق. مصر هى اللى ربتك وربت أهلك.. بس للاسف العيب لما يطلع من أهل العيب مش عيب..<br />لعنة الله عليك .. لأ بلى طز فيكى انتى وفى اللى جابوكى..<br />انا لى الشرف حين يسألنى أحد انت من وين.. مفتخرأ أقول مصرى ابن مصرى.."
