[[comments]]
order = 6
subject = "مفقوعة دبى"
author = "مصرية اخرى"
posted = "2006-05-20"
text = "الى مفقوعه دبى (وان شاء الله يديم عليكى الفقعةويزيدها)..مفيش شك أن دبى بل جميلة جدا ..وأهلها ناس طيبين .. لكن متنسيش نفسك وتفتكرى انك مدام عيشه هناك بقيتى مواطنه .. أنت مجرد مقيمه بالأجره ويوم ماتنتهى مده خدمتك مش حتلاقى مكان يلمك غير بلدك اللى مش عجباكى..اوعى تكونى فاكره ان بتعليقك الحقير حيدوكى الجنسية الاماراتية ..لأ..حتفضلى برضه هناك مواطنة درجة ثالثة..وحصلت بكلامك على احتقارهم واحتقار أولاد بلدك ..وقبل ما خيالك المريض يهيأ لك ان كلامى نوع من الغيره ..احب اقولك انى كنت عايشه فى الكويت درة الخليج..البلد الى كانت بتدفع مرتبات الموظفين عندكم قبل ما ربنا يفتحها عليهم..يعنى عارفه اد ايه الحياة فى هذه البلاد سهله ومريحه من الألف للياء..وكتير جدا أشتاق للكويت ..للبلد ..والأصحاب..وبتابع كل أخبارها..ولكن الحب الحقيقى لبلدى ..لمصر..مهما كان الفرق فى سهوله الحياه وامكانيتها ...فيكفى اننى أحمل شرف جنسيتى المصرية..مصر التى كرمها الله بذكرها فى القرآن الكريم..وأوصى رسولنا الكريم بأهلها خيراووصفهم بأنهم خير أجناد الأرض..ان كانت مصر تعيش فترة انتكاسة..فهى بسبب المرتزقة من امثالك .. الطفيليات التى سيلفظها الشعب قريبا.. ونطهر مصر الحبيبة منها ...لا أعلم كم عمرك..لو كنتى صغيرة السن فأنتى ناقصة تربية و أخلاق و إذا كنتى كبيرة فأكيد خرفتى و إفتكرى إن مصر هى اللى حتلم جثتك لما ربنا يفتكرك و خسارة فيكى و فأمثالك ترابها.و فى كلا الحالات..كبيرة أو صغيرة فإنت قليلة الأصل و رحتى هناك و أنبهرتى باالى هناك عشان محدثة نعمة...1000000000000<br />مليون طز فيكى و فى أمثالك.<br />اولاد"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212851/http://masr.20at.com:80/article.php?sid=167&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 7
subject = "الى مفقوعه هانم الشغاله فى دبى"
author = "مصرى مقروف منك"
posted = "2006-05-21"
text = "خسارة فى أمثالك الوقت اللى حضيعة معاك وحروف اللغة العربية أشثرف من أن يكتب بها لأمثالك ..لكن لازم تعرفى انك حقيرة..وأكيد كنت زبالة أو شحاتة.. وحتى وصفك بأدنى الكلمات خسارة فيك ..ولو انت..شجاعة عرفى نفسك وقولى انت ناويه تيجى مصر امتى عشان استناك فى المطار مع فرقة لمكافحة الآفات يطهروا هواء مصر منك..لأنك أنت وأمثالك حشرات يجب الخلص منها..ومليون طظ فيك يا جرثومة حقيرة"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212851/http://masr.20at.com:80/article.php?sid=167&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 8
subject = "الىالمفقوووووووووعة"
author = "مصرى مفقووووووووووع منك"
posted = "2006-05-22"
text = "fبالذمه أنت واحه معنداهش ريحة الدم ولا الأخلاق ولا الأصل وكل الكلام الى قالوه فى التعليقات السابقه انا معاهم فيه ولولآ أن فيه حريم بتقرا التعليقات كنت قلت لك كلام متنقى يناسبك ..الواحد فى الغربه لو حد مس بلده بحرف غير لائق ياكله أكل ده لوعنده شويه أصل أو أخلاق..أنا مش عارف أنت من أى داهيه فى مصر .. روحى فى ستين داهيه أنت واهلك اللى معرفوش يربوكى..يارب تتفقعى لحد ما تموتى أنت والحثاله اللى زيك"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212851/http://masr.20at.com:80/article.php?sid=167&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 9
subject = "يارب تطقى يابتاعة دبى"
author = "منكادومفروس من حيوانه دبى"
posted = "2006-05-23"
text = "البلاوى اللى زيك هما اللى بيفضحونا ويسوؤا سمعة المصريين..لأن مفيش ايان محترم يشتم فى بلده مهما كان ..الظاهر انت كنت جعانه وعريانه وشبعتى ولبستى هناك يعنى محدثة نعمه..المفروض يا غبيه متتكلميش بالطريقه دى لأنك مفضحتيش غير نفسك ..لاأنت ولامليون من عينتك الواطيه ممكن ينقصوا من قيمه مصر والكلام مع أمثالك خساره لأنك مجرد حيوان جاهل اللى يرمى له لقمه يبقى سيده.."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212851/http://masr.20at.com:80/article.php?sid=167&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

