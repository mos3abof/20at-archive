[[comments]]
order = 12
subject = "المفقوعة"
author = "مصرى لوشافك حيديكي بالجزمه"
posted = "2006-05-26"
text = "ياشيخه روحى فى داهيه..دانه فوق دماغك تجيب أجلك ..واضح انك من حثالة البشر اللى يجيبوا العار لبلدهم ..مصر بريئه منك ومن أمثالك..المرتزقه اللى يبيعوا أصلهم عشان لقمه عيش مهما كانت هى أرخص من بلدك حتى لو كنت شحاته فيها أنا شخصيا نفسى أضربك بالصرمه القديمه لحد ما أقطع نفسك..ونخلص من منك يا قليله الأصل"
