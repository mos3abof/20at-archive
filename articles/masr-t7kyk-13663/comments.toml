subject = ""
author = "انفلونزا الفساد"
posted = "2009-10-09"
text = "الحكومة تثير ضجة كبيرة ومخاوف لا داعى لها من انفلونزا الخنازير<br />انا عن نفسى لا اهتم<br />اعتبرها حاجة كدة زى الزكام<br />وعلاجها عادى زى اى زكام<br />مفيش داعى لبث الفزع بين الناس ونشر الرعب وعمل ارهاب وتخويف للناس لا داعى لة من انفلونزا الخنازير"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170728/http://www.20at.com:80/masr/t7kyk/13663--3.html"

[[comments]]
order = 1
subject = ""
author = "يا خوفى يا بدران"
posted = "2009-10-09"
text = "يا خوفى يا بدران<br />ليبقى العطس جريمة امن دولة<br />فاذا عطست فى مكان ما هجم عليك مباحث امن الدولة بتهمة الاخلال بامن ادولة وتعكير الصفو العام وقلب نظام الحكم<br />وانا اعتقد انة سيصدر تعليمات الى خطباء المساجد بتجريم العطس وان العطاسين سوف يذهبون الى الدرك الاسفل من النار وهم اشد خطرا من شيعة ايران واكثر ضررا من حماس وحزب اللة<br />وقانا اللة شر العطس"
archived = "2009-10-10"
capture_url = "https://web.archive.org/web/20091010170728/http://www.20at.com:80/masr/t7kyk/13663--3.html"
