text = "الدور المصرى فى غزه هو ببساطه عباره عن اعطاء الفرصه للعدو الاسرائيلى للخروج من أرض الموت وتركيز تواجده فى باقى الأراضى تحت حماية الغطاء المصرى والذى سيكون مطالبا بمنع تعرض المستوطنين المغتصبين للأراضى الفلسطينيه لأى مقاومه من الأبطال الفلسطينيين مما يفرض الاصطدامبين المصريين والمقاومه الفلسطينيه ويكون الخاسر الوحيد هو الوحده العربيه الاسلاميه"
