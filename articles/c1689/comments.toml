subject = "الحمد لله \"\"\""
author = "بنت الأصايل ـ السعوديه ."
posted = "2006-03-16"
text = "الحمدلله<br />كم كانت فرحتتتتتتتتتتتتييييييييي عندما تواصلت معنا<br />كم أتمناأنتعرفي أنني أأأأحبك أحبك كثيررراكم انا أحبك ياميس والله إنني أحبك أكثر منصديقاتي أنني أحبك جددددددددااااااااوأمنيتي أن أراك أو أقابلك أسأل الله ان يجمعني بك في الجنهأنني اكتب هذا التعليق على أمل أن تعرفي أنني أحبك ككككككثيرا<br />والله ياميس أنني أحس جيدأبما تحسين به وكم بكيت عندما سمعت ولأول مره أنشوده لعمل مركب أتمنى أن تحبيني في الله كماأحببتك فيه أنني أحبك وتأثرت بصوتك كثيراأنا تقريبا في سنك وهذا السبب أنني أعرمشاعرك<br />غاليتي مييس إلى اللقاء في جنان الله<br />محبتك التي أحببتك كثيرأ amani<br />اتمنى أن تعودي ألى فلسطين ونلتقي على عتبات ألأقصى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

