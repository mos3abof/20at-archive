[[comments]]
order = 105
subject = "الى المتشددين"
author = "إياد"
posted = "2006-06-01"
text = "الى كل المتشددين الذين يطالبون بتوقيف ميس عن الغناء لأن صوتها عورة أقول:<br />1- غنت نساء كبيرات في بيت عائشة امام الرسول صلى الله عليه وسلم وضربن على الدف ولم يمنعهن.<br />2- أعتقد أن صوت المرأة يكون فيه فتنة ومغريا أمام المرضى النفسيين والشهوانييين فقط بينما اذا تربى المسلم تربية صحيحة لا يغريه الصوت، وإذا كان تفكيره سليما فإنه يتفكر في معاني الكلمات وتنتفض روحه حبا في الله والوطن.<br />لذا لا يسعني الا أن اقول: اتقوا الله يا مشايخنا فينا وكفاكم اطلاقا لأحكام شرعية وضعت لضبط المنحرفين والمرضى، الخير في وفي امتي الى يوم الدين."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 106
subject = "احلا فلسطين"
author = "سفير الحب"
