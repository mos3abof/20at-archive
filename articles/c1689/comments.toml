[[comments]]
order = 100
subject = "من ميس شلش"
author = "ميس شلش"
posted = "2006-05-18"
text = "لكم التحية الفلسطينية المعطرة بدماء الشهداء كلا بأسمه واخص بألذكر ابناء الجليل الفلسطيني واحيطكم علما انني عدت من الجزائر بلدالشعب العظيم . اريد ان احيطكم علما ان موقعي على الأنتر نت يأسم shlsh.com<br />بأمكانكم سماع كافة اعمالي وهذا الموقع تبرع به شباب فلسطين في غزة مشكوريين واخيرا لكم مني كل التحية والحترام اختكم ميس شلش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 101
subject = "فلسطيني"
author = "وسام فلسطين ابو وسام"
posted = "2006-05-25"
text = "جزاكي ا لله كل خير ميساء انتي حركتي النبض في قلوبنا ومشاعرنا تحرك الدم والبدن والجسد يرجف والقلب يحن لفلسطين ووتوجعات فلسطين انتفضنا باناشيدك وتعلمنا منك الصمود والكبرياء والمضي علي نهج المقاومه والتحدي لكي كل التحيه من ابناء فلسطين كل فلسطين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 102
