text = "لقد سمعت عدة اناشيد رائعة لميس شلش من اسطورة جنين و اعرف موقعا لها.<br />من يريدها فليقلها لي حتى اكتب اسم الموقع.<br />المهم احب صوت ميس و ايضا احب اصوات اخرى..هالة الصباغ و رشا رزق ايضا اصواتهم جد حلوة."
