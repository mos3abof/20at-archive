text = "حبيبتي الغالية ميـس ، أنا أحبك جدااااا<br />و أعشق صوتك جداااا ، و أرجو لك مزيداا<br />من التقدم في مجالك ، و لي طلب منك و هو أن تخرجي لنا أنشودة تتحدث عن الانتخابات التشريعية لتشدي أزر أخوتنا في حركة حماس ولك مني خالص حبي<br />أرجــــو الرد"
