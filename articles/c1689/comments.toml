[[comments]]
order = 13
subject = "كل الاحترام من قلب فلسطين"
author = "ميس شلش الى الامااااااااام ارسل لك كل تحيات ابناء فلسطين، هنا من قلب فلسطين، من قلب الجليل الصامد..."
posted = "2005-12-17"
text = "ميس..اكتب الان هذه الكلمات البسيطة والمتواضعة في اخر ساعات صباح فلسطين فالساعة الان الحادية عشر وبضع دقائق...<br />\"صباحيّتك\" - صباح الخير يا بلادي- زادتني تفاؤلا واملا بمستقبل زاهر لكل ابناء الشعب الفلسطيني...<br />رغم انك نبشت الجراح وايقظتها من مضاجعها الا انني اشد على اياديك...<br />اتمنى ان ان احضر ولو حفلة لك على شاشة التلفزيون على الاقل!!!!<br />اين هي القنوات الفضائية؟؟؟ لماذا تنشغل ببث الفن الساقط فن هيفا ونانسي واليسا ...وتهمل هذا الفن العريق والاصيل والشريف والمكرّس لحب الوطن !!!!!!!<br />الله يهديكو...<br />وبارك الله فيكم عشرينات انا من اشد المعجبات بموقعكم ومواضيعكم المثيرة<br />هكذا نريدكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

