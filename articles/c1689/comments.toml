author = "عبدالله"
posted = "2006-01-11"
text = "ماذا تستفيد نجمة الأردن من كل هذا إذا ماتت فقد قيل عن أم كلثوم أكثر من هذا وماتت ولم ينفعها الكلام بشئ.<br />عموما نجمة الأردن ليست مغنية وإنما نجمة الأردن هي الأم الأردنية المجاهدة الصابرة علي تربية أبنائها والمكافحة في سبيل الله تعالي بكل عفة وصبر وطاعة لله تعالي ... و عموماأهل الأردن (أحسبهم والله حسيبهم) أهل عفة وشرف وإلتزام ولقد قابلت الكثير من الأميريكان الذين أسلموا بعد زيارتهم للأردن أو لعلاقتهم مع أردنيين ... بارك الله تعالي لنا في الأردن وفي مصر وفي كل بلاد الإسلام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

