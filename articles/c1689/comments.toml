subject = "امنية"
author = "داعية"
posted = "2006-02-28"
text = "اتمنى ان لاتتوقف ميس عن الغناء ولا اظن بان صوتها فتنة ط فان ما يكون مفتنا ذلك الصوت الذي يتقعر في الصوت ويخرجه عن طبيعته ويتكلم بكلام فاحش يثير المشاعر والشهوة ط ولا ارى في اغاني ميس مثل هذه الاشياء<br />اتمنى لك التوفيق يكل ما تفعليه لخدمة هدفك في الحياة والاخرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 60
subject = "ميس بحبك ولله بحبك"
author = "عاشق ميس شلش"
posted = "2006-02-28"
text = "ولله انا بموت في ميس من اول ما سمعت اناشيدها وبتمنى انو ما توقف عن الاناشيد<br />والاخوان الي بحكو يا ريت تشوفو شو صاير بالدنيا وبعدين تحكو<br />اما بالنسبة لحبيبتي الامورة ميس شلش حبيبتي واختي في الله تعالى طبعا<br />يا ريت تضلها تقدم لبلدها فلسطين دايما<br />مشان تضل نور ينور تا يشوفو العالم<br />نصيحة الى كل بنات العالم<br />ازا بدك احسن طريقة لتصبحي جميلة<br />وافضل وصفة مشان كل الشباب يحبوكي<br />وافضل وفصة للجمال<br />وافضل بنت في عيون الدنيا<br />تكون متل ميس شلشششششششش<br />ما شاء الله عليها<br />يا ريت لو اشوفلها صورة ولله كل ما بمسع اناشيدها ببكي<br />ولله تركت الدردشة والنت والمنتديات وكلشي<br />وعم بسمع باناشيدها<br />ميس الله يوفقك يا بنت فلسطين<br />وبعدين ميس نجمة فلسطين مش الاردن<br />ونجمة العرب كلهم<br />تحياتي الك يا احلى ميس"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

