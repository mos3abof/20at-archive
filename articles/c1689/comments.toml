posted = "2006-01-18"
text = "مرحبا يا ابنةارض الرباط كلنا بفلسطين فخورين بك وباناشيدك الذي ليس لها مثل ونتمنى من الله ان يجمعنا بارضنا المقدسةواخيرا وليس باخر اتمنى لك مزيد من التقدم في حياتك العلمية والعمليةلانه فلسطين بحاجة الك وبامثال موسى مصطفى"
