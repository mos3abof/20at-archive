subject = "إلى متى..!"
author = "ام الفاروق"
posted = "2005-12-28"
text = "حسناً .. لاأخالفكم ان قلت ان صوتها أخاذ<br />لكن إلى متى ..!!<br />الفتاه كبرت ويجب ان تتوقف حالا عن الإنشاد<br />فإنشاد المرأة مالفرق بينه وبين غناءها<br />صوت يفتن الرجال ..!<br />هذا يعني انه معيب ومحرم<br />لاادخل في نية ميس واقول انها تنوي فتنة احد<br />لكن عليها ان تتوقف فصوتها الآن اصبح صوت<br />امرأه ..<br />ثم ان اناشيدها لم تعد محافظه<br />فقد اخ\\ت بإدخال الموسيقى المسماه بـ (إيقاع)<br />وهذه لاتدخل في الانشاد الإسلامي<br />تقبلوا تحياتي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
