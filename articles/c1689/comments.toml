[[comments]]
order = 56
subject = "غناء المراة في الكبر"
author = "ورد في ورد"
posted = "2006-02-16"
text = "الحمد لله والصلاة والسلام على رسول الله<br />اخواني اخواتي<br />اول شي احنا هنا ناس المفروض انها ملتزمة او اقلها تحترم نفسها<br />الغناء 3 امور:<br />صوت وكلمات والات<br />الصوت المنهي عنه هو الصوت المتكسر الذي يخضع ( ولا تخضعن بالقول فيطمع الذي في قلبه مرض)<br />طيب لو ما كان الصوت متكسر، ولا شهوة فيه<br />؟؟؟؟؟<br />واعتمد الملحنين صوت لا تكسر فيه وكان الصوت جميل وطبعا وفق شروط صارمة<br />اما الكلمات فالجائز هو الكلام الجميل الذي لايصف ولا يهبط اما غيره فجائز اذا ما كان فيه مخالفة<br />اما الالات فقد احل الشيخ يوسف القرضاوي هذه القضية فلتقرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

