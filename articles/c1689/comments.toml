subject = "حضرت امس لك حفلة"
author = "ola"
posted = "2006-07-13"
text = "انا سكان الاردن استمع الى اشرطتك يا ميس اول باول يعجبني كلكاتها القوية الموثرة المعبرةو حضرت امس حفلة اقمتيها في نقابة المهندسين في عمان<br />وكانت فعلا رائعة و الاجمل انها كانت للنساء فقط ومن زمان كنت حابه اشوفك .<br />و رايتك و ما شاء الله فانت صبية كبيرة وعمرك 18 سنة فلا يجوز ان تقبلي على نفسك ان تغني امام الرجال او تباع اشرطتك بالاسواق<br />لماذا لا تعملي حفلاتك دائما هكذا (للنساء فقط)."
