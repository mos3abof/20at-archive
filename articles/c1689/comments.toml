[[comments]]
order = 90
subject = "ميس ..استمري ..."
author = "صفوءة"
posted = "2006-05-01"
text = "تحية الى أختي الحبيبة والغالية ميس:<br />لازال الفن الملتزم في عالمنا الاسلامي والعربي حبيس العقلية الذكورية في التخطيط والممارسة ولم تتجاوز مساهمة المرأة سوى الاستماع والتصفيق<br />أود القول أن التجديد في مجال الأنشودة أو الأغنية الملتزمة عموما رهين بالاجتهاد والتجديد في المجال الفقهي الذي غدى مسدودا منذ زمن معروف ..لذا فان من الحتمية ان تستهجن أي مبادرة ابداعية في هذا الاتجاه مادام علماؤنا الأفاضل لم تبلغ الجرأة عندهم المستوى المطلوب لتشجيع المبدعات وهن كثيرات مادام صوتهن يخدم الوطن ويعلي كلمة لا إلاه إلا الله<br />أنا من اللواتي يشجعن المبادرات الفنية الراقية والمبنية على أسس وليس بالتالي فتح المجال لكل من هب ودب من الفاشلات<br />ميس استمري ولاتركني للمحبطات فلعلك تكوني اول من تخطو وتفتح الباب نحو التجديد والابداع النسائي الذي يخدم هذه الدعوة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

