text = "انا اشعر ان صوتك العذب الجميل لابد ان ينشيء اجيلا تحيا على حب البطولة كما انشئت الامهات سابقا اعظم الرجال فمن الجميل ان يتربى على هذا الصوت جيل النشئة الا انني وكما اعلم ان غناء المراة حرام ولكن ممكن ان يكون جائزا بين النساء<br />فلما لا تكوني طائرا صداحا بين النساء تحيين فيهن ما قد مات"
