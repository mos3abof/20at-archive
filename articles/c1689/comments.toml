subject = "الى اختى الغاليه ميس"
author = "اخوك ابراهيم عباس _ مصر _المنيا"
posted = "2005-12-29"
text = "اختى العزيزه ميس اتكنى من الله ان يديم عليكى التوفيق _ واتمنى الى جانب الانشاد الرائع ان نسمع منك كلام الله (القران).. فوالله لكم نشتاق الى ذلك.فقد اثرتى فينا بانشادك ونتمنى ان تؤثرى فينا ايضا بتلاوتك لاى الذكر الحكيم.... وفقك الله وسدد خطاكى. ابراهيم عباس .. مصر .. محافظة المنيا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

