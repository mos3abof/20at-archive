[[comments]]
order = 162
subject = "اللهم ارنا الحق حقا وارزقنا اتباعه"
author = "أم الشهيد"
posted = "2006-09-29"
text = "السلام عليكم ورحمة الله وبركاته:اختي الحبيبه ميس نفع الله بك الاسلام والمسلمين وبارك لك حرصك علي خدمة الاسلام بكل ماتملكين...ولكن لي رأي أتمني أن تسمعيه:ان كل عمل نعمله لا بد فيه من شرطين أساسيين:اولهما ان يكون خالصا لله عز وجل والثاني المتابعه بمعني ان يكون قدوتنا في ذلك حبيبنا المصطفي أو نساء الصحابه ....وانا اتوسم فيكي ان شاء الله ان نيتك خالصه لله وهي خدمة الاسلام ولكن اهمس في اذنك انه لم يرد اطلاقا ان احدي الصحابيات كانت تنشد وما قاله احد الاخوه في التعليقات من ان امراتان كانتا تغنيان انما كانتا جاريتين ونحن نعلم جيدا ان الاماء تختلف احكامهن عن الحرائرفلم نسمع عن حره في عهد الرسول كانت تنشد.<br />ثانيا قال احد الاخوه ان المرضي النفسيين هم من يفتنون بصوتك ولكني اقول ان المريض النفسي هو من لا يفتن بصوتهاذلك ان الله خلق في كل جنس الميل للاخر فما بالك اذاكان رقيق الصوت مثلك.<br />انظري الي تعليقات الشباب وسوف تعرفين قصدي فما الداعي الي ان يقولو نتمني ان نري صورتك اذا كان المقصد صحيحا ..<br />اختي الحبيبه انا اري ان تتوقفي عن الغناء امام الرجال ولكن لا تدفني موهبتك فما المانع من ان تقومي بعمل حفلات ومهرجانات نسائيه حتي يكون عملك مرضيا لله عز وجل..حبيبتي مادفعني الي الكتابه الا حبي لك وكما قال رسولنا الدين النصيحه وخوفا من ان نكون ممن قال عنهم الله عز وجل قل هل ننبئكم بالاخسرين اعمالا الذين ضل سعيهم في الحياة الدنيا وهم يحسبون انهم يحسنون صنعا....<br />واخيرا لكي مني احر التحيات والسلام عليكم ورحمة الله وبركاته.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

