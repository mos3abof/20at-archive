posted = "2006-06-04"
text = "السلام عليكم ورحمة االله وبركاته اما بعد انت لا تفكري في اخوانك الفلسطينييين الدين الان يتضورون من الجوع والمعانات ولدلك انا اطلب منك ومن جميع المنشدين ان تقوموا باعانتهم مادياومعنويا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 108
subject = "انا هي انا و احب ميس شلش"
author = "انا هي انا"
posted = "2006-06-05"
text = "اولا اريد فقط ان اعرف يا اخ اياد هل انت تتكلم معي عادي او انك تسبني...فقط انه سؤال<br />تانيا انا يا اخي اقرا القران والسنة و كل ما اعرفه كتبته<br />تالتا انا فتاة مغربية وعمري 16 سنة و ادرس العلوم و اريد فقط ان اضع رايي هنا اما انا ايضا اجيد الغناء و انتمي الى جمعية و اتمنى ان اصبح متل ميس لكن الناس يقولون لي حرام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 109
subject = "الى انا هي انا"
author = "إياد"
posted = "2006-06-05"
text = "أختي الكريمة أنا هي أنا،<br />أعتذر عن شدة اللهجة التي اعتبرتيها سبا وشتما ولكنني لا أحترم من يغالي في حكم الله،<br />إن الغناء يكون حراما إذا اثار في النفس معان خبيثة ومحرمة، أما إذا ِشجع مشاعر كحب الله والوطن والوالدين والمجتمع فإنه لايكون محرما بغض النظر عمن صدر وما هي الالات الموسيقية المستعملة به.<br />وكما قلت سابقا غنت نساء الصحابة في بيت عائشة في يوم من ايام عيد الفطر ولم ينهرهن الرسول عليه السلام وعندما هم عمر بنهرهن اوقفه عليه السلام عن ذلك.<br />أما عن حديثه عليه الصلاة والسلام عن تحريم المعازف فهو حديث صحيح ولكن للأسف مشايخنا لم يفهموا معنى هذا الحديث، فالمعازف في اللغة العربية ليس الموسيقى، المعازف هو اسم مكان (مفاعل في اللغة هو اسم المكان) والمقصود من الحديث هو اماكن العزف والملاهي التي كانت معروفة في الجاهلية بسوئها لكثرة ما تستباح فيها من حرمات.<br />وسامحيني إن اسأت فهمي فأنا لم أكن انوي السب ولا الشتم،<br />والسلام ختام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 110
subject = "ارجو المسامحة من الاخ اياد"
author = "ايمان"
posted = "2006-06-05"
text = "انا اسامحك يا اخ اياد من كل قلبي و اتمنى بدوري ان تسامحني ايضا لانني تدخلت بطريقة غير محترمة ارجوك سامحني لانك كما تعلم فهدا يرجع لقلة معلوماتي لكوني لازلت صغيرة 16 سنة<br />و اسمي الحقيقي هو ايمان و ليس انا هي انا ها ها ها<br />و احييك على علمك الدي اعجبت به. و قد سالت امي عن هدا الموضوع لانها تدرس التربية الاسلامية و اجابتني بنفس جوابك<br />احييك و ادعو الله لك بالتوفيق و ان ياجرك على كلامك المعقول<br />السلام عليكم و شكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 111
subject = "الى ايمان"
author = "إياد"
posted = "2006-06-06"
text = "لا شكر علىواجب يا أخت إيمان، وأعتذر مرة أخرى على انفعالي ولكن اتعجب من بعض المعلقين احيانا الذين يتكلمون عن غير درايةويتكلفون بصغائر الأمور بينما هناك الكثير من كبائر الأمور التي تكون اولى ان نهتم بها ونعلق عليها.<br />وفقك الله لما فيه الخير وبارك فيك، وأنصحك دائما بتحليل الأمور بالعقل والمنطق، فالله عزوجل قد أعز بني ادم بالعقل وكرمه على كل مخلوق حتى يستعمل هذا العقل ويفكر فيه.<br />والله من وراء القصد."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 112
subject = "بارك الله في امثالك يا اخي اياد"
author = "ميس شلش"
posted = "2006-06-06"
text = "بسم الله الرحمن الرحيم<br />التحيه والاحترام وبعد<br />الاخ المحترم اياد اشكرك على ما ذكرت وجازاك الله كل خير -- مع تحياتي لكل من قال رايه سوا كان سلبا ام ايجابا-<br />مع انني سالت العلامه الشيخ القرضاوي وقال لي ما قاله الاخ اياد<br />تحياتي -- اختكم ميس شلش"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 113
subject = "عفوا يا ميس"
author = "إياد"
posted = "2006-06-06"
text = "الأخت ميس،<br />لا شكر على واجب وسدد الله خطاك على طريق الخير في خدمة دينك وبلادك.<br />ولا تأبهي مهما قال القائلون، فما دامت النية صافية في سبيل الله ومادام العمل خالصا لوجه الله فالله وليك يوم الدين.<br />لقد وضع الله في كل منا موهبة وقدرة ابداعية في مجال ما، ولكن المهم ان نستغلها لخدمة دين الله، وهذا ماتفعلينه انت في وجهة تظري، لذا لاتقلقي مهما قال القائلون فالمهم أن تكون العلاقة مع الخالق صحيحة ولا يشوبها شائبة.<br />وسؤالي للمغالين: من منكم عنده الجرأة أن يعبر عن رأيه وعن الحق بصراحة كما تفعل ميس؟<br />من كان عنده ذلك فليتفضل ويتحفنا برأيه.<br />والله من وراء القصد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 114
subject = "الى ميس شلش اين انت ارجوووووووووووووك"
author = "ايمان"
posted = "2006-06-07"
text = "اين انت يا ميس شلش انا اريد ان اتحدت معك لانني احبك و اعتبرك كاخت لي<br />فانا فتاة في متل عمرك<br />ارجوك لنعين وقتا محددا لنتكلم فيه هنا ارجووووووووووووووووووك و اعطيني ايمايلك ان كان امكن<br />انا دائما استمع لاغانيك و اغنيها و اتمنى ان اصبح مغنية متلك و اريد ان اسالك كيف فعلت لتصبحي منشدة<br />واحييك على كلماتك المقنعة التي قلتها في قناة الجزيرة للاطفال و قد كنت في حوار مع مغنية<br />انا احبك يا ميس واريد ان اصبح متلك و انا ايضا محجبة متلك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

