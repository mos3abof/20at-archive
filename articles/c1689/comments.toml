text = "السلام عليك ورحمة الله وبركاته يا ميس,<br />انا اميمة وعمري تسعة سنين.اعيش في هلندا. شاهدتك اول مرة على قناة دبي في برنامج نشوة. لما رئيتك اول مرة اعجبت بك وبأغانيك. وخصوصاأغنيتك الجميلة صباح الخير التى احبها كثيرا. والله ينصر فليسطين. ونسيت ان اقول لك اني مغربية الأصل..<br />إبقي على هذا النحو... الى القاء"
