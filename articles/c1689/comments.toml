text = "في كل يوم استمع فيه الى شدوك يستيقظ في صدري حنين يملئني املا والما فاستزيد من صوتك عزما وقوة تدفعني للمضي قدما وابتهل الى الله ان يحميكي يا ملاكي الصغير فقد اشعلت املا لا يخبو وامالا في جيل الغد الاتي فامضي في طريقك بارك الله بك"
