posted = "2006-06-14"
text = "ال الأخت ميس<br />انا احاول الدخول الى موقع منتديات ميس شلش، ولكن الموقع غير مفعل خلال اليومين الأخيرين علما بانه كان مفعلا قبل ذلك، وهو موقع رائع وجميل،<br />هل عندك فكرة عن سبب ذلك؟<br />ارجو الإفادة"
