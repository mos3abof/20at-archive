[[comments]]
order = 43
subject = "الى الذي بعت كل الاحترام من قلب فلسطيني"
author = "زكزك"
posted = "2006-01-24"
text = "نحن معكم لم ولن ننساكم ان شاء الله ولا تحزن اوتحزني ا اختي بالله ان تفتحت جراحك عند سماعك اناشيد عن اععمالكم الاستشهاديه الرائعه التي تقومون بها فنحن جميعا نفخر بكم وباعمالكم الرائعه التي تستحقون عليهااكثر من الانشاد ......<br />تستحقون النصر باذن الله ..ابقوا على حالكم هذا ولكم النصر باذن الله ....... كلنا معكم هنا في الاردن ..وكلنا نحبكم كثيرا وحماكم الله يا ابطال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 44
subject = "الى ميس مع التحيه"
author = "بنت الاصايل"
posted = "2006-01-26"
text = "أنا من السعوديه واحب ميس وانا مع بنت فلسطين {أتمنى أن تطلع أناشيدك في المجد الفضائيه} يـــــــا ميس إذا كنتي تبين نصر فلسطين فكيف تعصين الله والله أمر وقال إن صوت المرأة عوره النصر لايتحقق إلا بل رجوع الى الله .بارك الله فيك وفي خنساوات فلسطين الأبيه.أختكم >"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 45
subject = "سفيرة الوطن الجريح"
author = "محمد"
posted = "2006-01-29"
text = "السلام عليكم والرحمة والاكرام<br />ان كان الموضوع وجميل التعبير واسلوب السرد متقن فهذا دليل على ادب القلم وحامله, وان جاز التعليق لميس فاني اذكر الأمة الاسلامية بالقلم أما ميس فتذكر بقلبها وبهدية الله لها صوتها الوطني, إذا كان يجوز لنا سماع العلم من النساء فلم لا يجوز لنا سماع التذكير والتحفيز من عالمة الوطن ..وهذا أقل ما أسمي به هذه الوطنية (سفيرة الوطن الجريح)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

[[comments]]
order = 46
subject = "استمر - و توقف"
author = "محمد شلش"
posted = "2006-01-29"
text = "السلام والرحمة والإكرام على الأمة الاسلامية جمعا وعلى أخواني واخواتي هنا ومبارك لحماس الاسلام الفوز في انتخابات الدنيا وادعو الله النجاح في انتخاب الآخره لجميع المسلمين<br />أختي سفيرة الوطن الجريح يروى أن ثلاث ضفادع تسابقت للخير فوقع احدهم في حفرة فالتفت عليه من طرف الحفره اصدقاؤه ومحبيه قائلين له لا تقفز فالحفره عميقة وستكسر قدمك الا أن هذا الضفدع قفز ثم كرروا ما قالوه ثم اصر وقفز مرة أخرى وقفز وقفز حتى خرج وذهل أصدقاؤه وهذه حال الدنيا الجميع يقول لا تفعل المحب وغير المحب إلا أن الله كرمنا بالعقل واستفت قلبك ولو أفتوك واستخيري الله في كل عمل ثم لا تترددي أتعلمون السر كيف استطاع الضفدع الخروج من الحفره رغم جميع الاحباطات من الجميع لأنه كان ضفدع \"أصم\" لا يسمع العبره بالقصدة للجميع وأنا أولكم اذا أقدمت على عمل استخر الله ثم لا تتردد واستمر فانه لا ينجح إلا المجاهد المجالد في طلب رزقه من الدنيا والآخره واحترامي لجميع الاخوان والأخوات علما أني لا أعرف ميس إلا من خلال سماع صوت الحرية وأتمنى أن أعرفها في الآخره في جنة نعيم فهذا خير وأعظم أما الموضوع السابق لهذا فهو قبل أن أقرأ التعليقات ارجو من كل مسلم مدرك لمقصده من الدنيا الدعاء لله بتوفيق كل مسلم مجاهد في سبيل الله بروحه أو ماله أو عقله أو صوته أو قلمه أو حتى قلبه ولكل من حدثته نفسه بطاعة الله ولو لحظة أن يثبت أقدام الاسلام ويعيد عز الاسلام في الأرض ويهدي الضالين .. اللهم آمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

