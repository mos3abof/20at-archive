posted = "2006-03-14"
text = "بسم الله الرحمن الرحيم<br />ميس شلش أنا لا أنكر أنها ذو صوت جميل وجميل جدا صوت رقيق وحزين ومناسب لما تنشده وخصوصا الأناشيد الوطنيه التي تنشد عن فلسطين ولاكن هذا لا يبرر أنها تنشد لأن صوت المرأه فيه فتنه وهناك قاعدة مشهورة عند أهل العلم أن درأ المفسده مقدم على جلب المصلحة فدرأ مفسدة أنشاد ميس شلش من الفتنه مقدم على جلب مصلحتها أنها تنشد للوطن<br />هذا ما أردت أن أقول فإن كان صواب فمن الله وإن كان خطأ من نفسي والشيطان والسلام عليكم ورحمة الله وبركاته<br />لزيادة التواصل<br />mosab-hmdan@hotmail.com<br />نفرح بأي أضافه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102103334/http://www.20at.com/article2.php?sid=53"

