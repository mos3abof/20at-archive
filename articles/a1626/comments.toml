author = "اتم فهمى بشع؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟"
text = "ازاى ؟؟؟؟؟؟؟ ازاى تقول علية بشع انت مجنون؟؟؟؟؟؟<br />دة شكلة وسيم جدا وكل البنات بتموووت فى وسامتة وجسمة الرائع<br />اكيد 100% انت غيران منة واكيد سورى يعنى انت شكلك ميتشفش اصلا؟؟<br />واوعى تقول على حبيبى حاتم كدا تانى اوعى"
