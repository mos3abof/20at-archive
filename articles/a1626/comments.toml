[[comments]]
order = 0
subject = "Bent Al-islam/USA"
author = "لسلام عليكم"
text = "لو أتيحت لي هذه الفرصة لتغير وجهي لاخترت مااناعليه<br />يقول الله عزوجل\"ولقد خلقنا الانسان في احسن تقويم\"<br />يعني هذه احسن ماخلقك الله عليه بما يناسب طبيعتك النفسيه والشخصيه.الله عليم بما في النفوس ممكن يعطي الجمال لاحد ويستخدمه خطآ مثل الأخت اللي عاوزة \"أصالة\" صوت وصورة اكيد راح تغني مثلهايعنى ربنا رحيم بنا وخاصه إننا ذوي نفوس ضعيفه وسوف نستغل النعمه ونقلبها الي نقمه(عافانا الله و إياكم)<br />يا ريت (والكلام موجه لي معكم)نعمل Face ofلقلوبناو نفوسنا ونصلح حالنامع الله.<br />اسفه للإطاله و رمضان كريم<br />والسلام.............بنت الاسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153703/http://www.20at.com/article.php?sid=1626"

[[comments]]
order = 1
subject = "اللهم بلغنا رمضان"
author = "لسلام عليكم و رحمه الله و بركاته"
text = "في رايي ان اي انسان عايز يغير من شكل جزء من جسمه( طبعا استثني من ذلك الحالات الضروريه مثل الاشياء التي تسبب الم او تشوه) يبقي مش راضي باختيار ربنا ليه و في الواقع ان الانسان مننا لو فكر بصدق مع نفسه لازم هايحس ان ربنا اللي خلقه و عالم بيه و بكل شىء عنه و عالم باللي هاينفعه اكتر من اي حد و ربنا بيحبلنا الخير لانه ارحم بينا من ابائنل و امهاتنا ساعتها الزم يبقى راضي باى حاجه ربنا اعطاها ليه و يحمد ربنا انو خلقه بني ادم جميل احلى من الكثير من المخلوقات الاخرى مهندسه جيولوجيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153703/http://www.20at.com/article.php?sid=1626"

[[comments]]
order = 2
subject = "احسنت الاختيار"
author = "و كنت ذو جبروت لاحكم العالم لاخترت صورة بوش"
text = "لوكنت صعلوك اتكفف الناس لاخترت صورة (دول العالم الثالث)<br />لو كنت اقتصاديا لاخترت صورة اليورو والدولار<br />لوكتت اجتماعيا لاخترت صورة الجمل<br />لوكنت حاكما لاخترت صورة صدام حسين<br />لو كنت محكوما لاخترت صورة الافغان<br />لو كنت مجاهدا لاخترت صورة شهر رمضان<br />لو كنت عبدا لاخترت صورة الحق سبحانه وتعالي<br />لو كنت ضعيفا لاخترت صورة كونداليزا رايس لارعب الناس<br />لو كنت قويا لاخترت صورة كلاي في عز جبروته<br />وطبعا كل علي شاكلته فوجدت نفسي ان اكون بنفس وجهي وشكلي الذي خلقني الله به منافقا كذابا ثعلب محياص كل الصور التي خلقها الله علي الارض لاري وجوه الاخرين ولكن الصور السابقة كلها احلام اليقظة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153703/http://www.20at.com/article.php?sid=1626"

