author = "ا حول و لاقوة إلا بالله !!!!!!!!!!!!!!!!!"
text = "من حاتم فهمي هذا اللي بتاخذوا سيئات علي قفاه؟؟؟؟؟<br />اليوم اول رمضان يا ناس بدل ما نعبد ربنا احسن ما يكون, فاتحين جبهة دفاع عن سي حاتم هذا<br />اتقوا الله و راجعوا صيامكم اليوم<br />اللهم اهدي قومي فهم لا يعلمون......<br />رمضـــان كريم..........سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153703/http://www.20at.com/article.php?sid=1626"

