[[comments]]
order = 5
subject = "اللهم اكفينا شر الفتن ما ظهر منها وما بطن"
author = "قد نهى الرسول صلى الله علية وسلم عن التغيير الطفيف والبسيط فى الوجه( لعن الله النامس والمتنمسه)فما بالنا بتغيير الوجه بالكامل ان فيه نوع من عدم الرضابخلق الله وحتى فى الحالات الإستثنائية فذلك يكون بلاء من الله عز وجل واختبار للصبر والرضا ونوع من تكفير الذنوب عن الانسان"
text = "سبحان الله ربنا يعطى لنا كل النعم التى لاتعد ولاتحصى وحتى فى البلاء تكفير للذنوب ( اللهم اعوذ بك من زوال نعمتك ، وتحول عافيتك، وفجاءة نقمتك، وجميع سخطك.<br />وبعدين الواحد مش ممكن يتخيل نفسه على صورة غير التى خلقه الله بها.<br />يعنى ممكن الواحد يخرج من البيت بشكل ويرجع لزوجته انسان تانى ولو قعت تحلف الى اخر عمرك انك انت زوجها مش هتصدق الا اذا كنت مختار وجه من بتوع السينما . ربنا يرحمنا<br />tarkyz@yahoo.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153703/http://www.20at.com/article.php?sid=1626"

