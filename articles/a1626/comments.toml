author = "بعدين, إنتي يا ست حسنة إزاي توصفي في راجل و تقولي وسامته وجسمه وهباب ,هتقولي إيه لربنا لما تقفي قدامه بالكلام ده؟؟؟؟"
text = "لا اعتقد إنك او اي واحدة معجبة بالنكرة دا دافعت عن الرسول او الصحابة في اى موقف؟؟؟؟!!!!!!!!!<br />يا اخت حسنة اجعلي لك من اسمك نصيب ولا تفقدي حسناتك في هذا الشهر الكريم علي من لا يستحق...<br />رمضان كريم....سـلام"
