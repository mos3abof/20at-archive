[[comments]]
order = 1
subject = "تعليقا على شكلها غير الجميل"
author = "بتنجان"
posted = "2006-05-22"
text = "ربما ساهم نص كيلو البودرة في اظهارها بهذا الشكل.. لكن الشيء الملاحظ أن الصورة الحالية هي اول صورة لخديجة بالجنب.. يعني وشها جاي موارب مع العدسة، في حين كانت كل الصور السابقة تنظر خديجة للكاميرا بتركيز وكأنها عارفه إنها هتتصور.. (وهو في حاجة تخفى على الحكومة)..<br />بنظرة سطحية للمقارنة بين الصور ربما يقول قائل أن خطيبة جمال جميلة لو تم النظر لها من الأمام، لكن بنظرة عميقة من الجانب نكتشف الحقيقة.. لكن الواقع والنظرة العميقة التحليلية للأمور تقول أن خطيبة جمال جميلة من كل النواحي.. وإن \"ديفوهاتها\" من الجانب لم تكن إلا \"كاموفلاج\" فقط .. تمويه يعني عشان تخزي العين.. (آه يا عيني)!"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173357/http://masr.20at.com:80/article.php?sid=357&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

