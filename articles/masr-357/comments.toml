order = 20
subject = "إنها نظرة وطنية تعبر عن الانتماء"
author = "حسين عبد الظاهر سابقا .. عبد الله كمال حاليا"
posted = "2006-05-23"
text = "أصحاب النفوس المريضة فقط - من عينة براء - هم الذين يرون أن هذه النظرة مش ولا بد وأنا أهو وانت أهو يا سي براء افندى أن ما رحت هناك .. وهناك أيه سلومة الاقرع ما يعرفش ابوه<br />أنا عن نفسي شايف ان النظرة فيها احترام وتبجيل من سيدة مصر الأولى - فى المستقبل بمشئة الله - لسيد مصر الأول - فى المستقبل برضو- تدل على مدى التفاهم والانسجام بين الطرفين الأمر الذى يبشر بمستقبل باهر لمصر المحروسة خلال العقود القادمة.<br />وأطالب السيد جمال والسيدة خديجة بالإكثار من مثل هذه النظرات التى تنم عن عمق الرؤية وبعد المعرفة وتؤطر لأطر جديدة من حياة المصريين على أكثر من صعيد سيكولوجى و سيسيولوجى فى مواجهة جحافل البرجماتيين والماركسيين الجدد.<br />أعتقد أن هذه الصورة العبقرية بما تحمله من دلالات رمزية معبرة عن مدى التعلق بتراب مصر - مصر اللى هى أمك يا ميدو وامك انت كمان يا براء- لو أن هذه الصورة علقت فى متحف اللوفر أعتقد انها سوف تضرب لوحة الموناليزا بالبلغة( استخدمت لفظ البلغة بدلا من الجزمة لأن البلغة نابعة من البيئة المصرية)<br />أنا عن نفسي سوف أضع وردا يوميا أتطلع خلاله لهذه الصورة لأتعلم منها معنى الوطنية والانتماء معنى البذل والتضحية<br />و أطالب بجعل هذا اليوم الذى التقطت فيه هذه الصورة الأكثر من عبقرية عيدا قوميا لكل المصريين يحتفلون به كل رجل وزوجته وكل خطيب وخطيبته يقفون امام المرآة وتحاول المرأة جاهدة- وسوف تفشل حتما- فى تقيد هذه النظرة الوطنية لزوجها أو خطيبها<br />عموما أردعوك يا براء يا صاحب النفس المريضة أن تعيد النظر للصورة بعقلية متفتحة وبروح وطنية بعيدا عن هذه الخيانة التى انت غارق فيها، وتلك العمالة للقوى الخارجية<br />حسين عبد الظاهر سابقا<br />عبد الله كمال حاليا"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173357/http://masr.20at.com:80/article.php?sid=357&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 21
subject = "مص رولادة"
author = "الزينى بركات"
posted = "2006-05-23"
text = "يا جماعة محدش يزعل على البراء<br />لأن مصر و لادة لو البراء راح فى 60 داهيه حيجى غيرة الف<br />و زي ما شمس سوزان قربت على الغروب و ظننا ان مفيش حد<br />فجأة لاحت فى الافق شمس خديجة و زي ما كان القلق حيقتلنا علشان مفيش حد يمسك البلد بعد الريس فجأة ظهر جمال<br />المهم يا جمال اتجدعن كده ةعلشان تجبلنا مبارك الصغير و بعد كدا الحكم يورثه الاكبر من ذرية علاء ثم ذرية جمال بالتناوب"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173357/http://masr.20at.com:80/article.php?sid=357&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 22
subject = "إتقي الله يا كاتب المقال !!!"
author = "مجد الإسلام"
posted = "2006-05-23"
text = "السلام عليكم ورحمة الله وبركاته<br />لا أعلم إن كنت مسلما أو غير ذلك , لكنني سأتحدث وأمري لله ..<br />يا أخي هل الصور التي وضعتها صور حلال أم حرام ؟؟؟؟؟<br />يعني هتشيل عليها وزر ولا هتاخد حسنات ؟؟؟؟<br />الناس هتفضل تبص للصورة وتتمعن في اللي فيها وممكن ناس نسرح في عين اللي موجودة فيها<br />بالله عليك لو كنت مسلم ساعد إخوانك على غض بصرهم وغض بصرك قبلهم<br />بالله عليك لو كنت مسلم ما تأخرش النصر بعصيانك لأوامر الله وزيادتك للمعاصي الموجودة<br />الصور الموجوددة حرااااااااااااااااااااااااااااااااااااااااااااااااااااااام<br />وهتفضل تشيل في وزر كل واحد شاف الصور , بمعادلة بسيطة ممكن لو إنت صالح وأعمالك صالحة , المقال ده يحدفك في جهنم !!!!!!!<br />نقطة تانية : أنا برضه مطحون زيي زي أغلب الشباب المصري , إستفدت أنما إيه من مقالك ؟؟؟؟؟؟<br />مالي أنا ومال خطيبة جمال مبارك يا أخي ,<br />لو عندك نقد ليه لازم يكون موضوعي بأدلة , إحترموا عقولنا شوية الله يكرمكم<br />لأن طول ما إحنا ماشيين بعواطفنا هنروح في داهية<br />اكتب مقال قول فيه جمال غلط في كذا وكذا وكذا , عشان نتناقش فيه نقاش موضوعي مثمر , ويزود من سعة أفقنا , مش موضوع عن العيون والرموش والحواجب !!!!!!!<br />يا أخي ربنا يهديك ويهدينا"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173357/http://masr.20at.com:80/article.php?sid=357&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

