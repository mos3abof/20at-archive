[[comments]]
order = 28
subject = "الله يسامحك"
author = "معتـــز"
posted = "2006-05-24"
text = "السلام عليكم<br />بعد حرمة وضع صور متبرجات -أيا كانوا- والنظر إليهم(واللي أنت دبستنا فيها) لي تعليق بسيط<br />مش عايزين ضيقنا من احوال البلد وظروفها هيخلينا نخرج عن المعقول والمفيد<br />ولا يخلينا (نفش غل وخلاص) زي اللي بيحط صورة اللي بيكرهه على الحائط ويضربه بالنار وفي الآخر هيبقى عليه تصليح الحيطة ويظل المكروه كما هو<br />نظرة خطيبة جمال له ولا نظرته لها ولا هي أصلا تعنينا<br />والوقت اللي راح في تأمل نظرتها له - اللي أظن ممكن تواجه مشاكل مع خطيبتك عشانه- كان ممكن نعمل في حاجات كتير قوي تنفع البلد دي والشباب الطيب اللي بيحبوك وبيقرأوا لك ومستنيك من أصحاب الأقلام كل مفيد ونافع"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173357/http://masr.20at.com:80/article.php?sid=357&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

