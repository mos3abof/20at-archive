[[comments]]
order = 8
subject = "ارحم نفسك يا بني"
author = "ماميا"
posted = "2006-05-22"
text = "ياريت يا براء تأجل الشجاعة دي لوقتها لان اخوانا في اللي بالي بالك زهقوا من التفكير و مش بيفرقوا بين حرية الراي و محاولة قلب نظام الحكم و بدأوا بتجريم المظاهرات و لسة ياما ح نشوف افتكاساتهم لحفظ الامن و الامان وان شاء الله حييجي يوم نحتاج لشجاعة كل مصري بيحب بلده فياريت تحوش كل ده لما ييجي ميعاده"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173357/http://masr.20at.com:80/article.php?sid=357&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "ليه كده يا براء؟؟"
author = "سوسة المفروسة..(الاصلية)"
posted = "2006-05-22"
text = "مش عارفة ليه يا براء حاسة انك محروق م البنية دي قوي...هي صحيح بضب و الخالق الناطق (امينة شلباية) و هي صاحية م النوم..بس انت شاكلك كده واقع<br />عمال تعمل مقارنات و تقول انا خطيبتي مش ممكن تبصلي كده رغم اني جايبلها دبلة و محبس مش خاتم ب 30 الف دولار<br />و بتتك قوي على انك خطبت بعد ما هي اتخطبت بفرق ايام..و نازل تلطيش فيها و ف شكلها<br />( انت كنت بتروح الجامعة الامريكية كتير؟؟)...عموما الراجل فرحان بيها و بضبها..و هي فرحانة بيه عشان هيعملها اشهر ست في مصر و عشان اكبر منها ب 20 سنة و يمكن يموت و تورث هم مايتلم اكتر م اللي على قلبها و قلب ابوها (الهابلة مش عارفة ان العيلة كلها مظبطه مع عزرائيل و مديهم فترة سماح طويلة بعد ما الصلاحية تنتهي)<br />المهم يعني خليك في طبقك و ماتبصش لطبق غيرك....يتجوزها ..ياكلها..المهم يحلوا عن سما اهالينا..و يغوروا في ستين سلامه بعيد عننا"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173357/http://masr.20at.com:80/article.php?sid=357&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

