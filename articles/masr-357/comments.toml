[[comments]]
order = 18
subject = "عشان بس مخنوق منه"
author = "بتاع الأتوبيس"
posted = "2006-05-23"
text = "عذرا على الخطأ الفني!! أنا كنت متوقع ألاقي صور أكتر للخطيبين. بس أنت يا براء مركز على صورة واحدة وماشاء الله بتطلع كل أحاسيسك الجميلة تجاه جيمي عليها. أما نشوف هايجرالك ايه من الموضوع ده، كل الشباب عمالين يترحموا عليك!! بس حاجة جميلة والله لما نتابع أخبار وصور حاكم مصر المقبل والسيدة الأولى زي ما بنتابع أخبار بتوع الفن والرياضة. هما دول نجوم المجتمع ولا بلاش. وعلى رأي المثل، العروسة للعريس والجري للمصريين المتاعيس."
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173357/http://masr.20at.com:80/article.php?sid=357&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 19
subject = "تدريب الرئاسة"
author = "ابن النيل"
posted = "2006-05-23"
text = "إخواني الموضوع في غاية الاهمية ليس من أجل شكليته وسطحيته الواضحة كما يبدو ولكن لان الموضوع في مضمونة يتعلق بمستقبل البلد،إن جمال مبارك يعد نفسه ويعدخطيبتة ليحلا مكان الاب والام وهذا ما يستطيع أن يراه أي انسان لديه ذرة عقل ومن شواهد ذلك أختيار جمال لعروسة من عائلة رفعت الجمال البطل المصري في إسرائيل ومحاولةإعدادهاو تلميعها لتكون سيدة مصر الاولى وهو أن شاء الله لن يحدث وان حدث فعلى جثثنا.فلن يحق لعاطل وفتاة تافهة أن يحكما كنانة الله في ارضه بلدنا أم الدنيا مصر."
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173357/http://masr.20at.com:80/article.php?sid=357&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

