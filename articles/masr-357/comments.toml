subject = "تستاهل"
author = "محمد عبد الرحمن"
posted = "2006-05-22"
text = "على اعتبار أننا حذرنا براء كفاية من مغبة التعرض لنجل الرئيس ، فلا اعتقد انه من واجبنا تعليق يافطة على كوبري اكتوبر تقول \"وحشتنا يا براء\" أولا انه مش تامر حسني، ثانيا لاننا حذرناه زي ما بقول، عشان كدة انا شايف اننا نحط صورة براء اللى بيحطها ع الماسينجر وهو باصص للامام ونكتب عليها كلمة واحدة \"تستاهل\""
archived = "2006-09-10"
