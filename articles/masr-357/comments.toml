[[comments]]
order = 15
subject = "يا عريس الدولة !"
author = "أم تهانى بتاعة التموين !"
posted = "2006-05-23"
text = "يا عريس الدولة<br />مبروك يا عريسنا<br />يا أبو شنة ورنة<br />يا واخدنا وراثة<br />أطلب وإتمنى<br />وأخرج من جنة<br />أدخل على جنة<br />مش فارقة معانا<br />ولا هارية بدنا<br />ولا تاعبة قلوبنا<br />ولا فاقعة بيضاننا<br />يا عريس الدولة<br />إفرح وإتهنى<br />ما احناش كارهينك<br />لكن هارشينك<br />حا تكمل دينك<br />وتطلع ديننا<br />احمد فؤاد نجم"
archived = "2006-09-10"
