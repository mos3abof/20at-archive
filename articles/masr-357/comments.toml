[[comments]]
order = 11
subject = "إعقل يا واد يابراء"
author = "إنت اتهبلت يابراء وللا جرى لمخك حاجة ؟؟ إنت عايز تفهمنا إن جمبري اللي مطلع ديننا على رأي ابوالنجوم اللي شايفينها في عز الضهر .وإن اللي بيطلع من البيت قصدي من القصر وماحدش عارف بيروح فين ولا بيسهر فين وبيشيل وزراء وبيجيب وزراء وبيضرب وزراء وبيضرب كمان أسافين وبيهرب اصحاب الاسافين لبره البلد وبيمد الطوارئ وبيمد رجليه في وش أتخن شنب فيكي يامصر المقهورة وبيرمش منه الأمين العام والأمين الخاص واللي مش أمين خالص واللي بيقول آمين في كل صلاة .. بعد ده كله يا واد يابراء عايز تفهمنا إن خوخة بتنظر إليه شذرا واجتراء بنظرات ساحقة ماحقة من بتاعة بوريس بيكر بتاع التنس ..وإن جمبري كان مخضوض ومتقوقع وعمل زاوية ارتداد عكسية بان فيها رعبه من أول ما بان ..طب نقول إيه للشعب المرعوب ..طب نقول إيه للمعتقلين المتاخدين في انصاص الليالي ..طب نقول إيه للمسحولين والمضروبين في كل كمين . وهما عارفين إن جمبري هوه اللي ورا كل ما حاق بهم وما يحيق وما سيحيق...والمساحيق أذابت جبروته .والنظرة النارية كشفت ضعفه الإنساني ..وفكرتني بالمبدع القصري الله يرحمه لما قال أنا لما أقول كلمة في دفوس لا ممكن تنزل الأرض أبدا .وأول ما تقول له حنفي؟؟ يقول خلاص هاتنزل المره دي لكن يكون في معلومك .. في دفوس الجاي لاممكن تنزل أبدا...وعلى رأي عمك علوان في فيلم الأرض \"آه يابلد\" . أنا مش عارف ليه ياواد يابراء طالبة معايا أفلام ؟ هل ترى اللي بيحصل ده أفلام وللا سيمه أونطة وخدوا فلوسنا همة وممدوح اسماعيل وايهاب طلعت وساويرس وعز ونافع وسليمان والحبل على الجرار ... طب وبعدين يا براء ..احنا خايفين من التداعيات الخطيرة للموضوع ده حيث انه لم تتطابق وجهات النظرة ولم يتم الاتفاق على رؤية واحدة للأحداث اللي همة أقل من تمنتاشر سنة ..واحنا"
posted = "2006-05-22"
text = "اقرأ بقية التعليق .."
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173357/http://masr.20at.com:80/article.php?sid=357&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 12
subject = "قلى ادفع فيا"
author = "ياء"
posted = "2006-05-23"
text = "براء بجد حبتدى اشك فيك<br />انت اكتر واحد بتكتب عن جمال فى الموقع<br />ايه فى ايه انت شكلك بتحسد الولد<br />سيبو يا حبيبى يعشلوا يومين قبل ما يمشى هو وباباه فى ستين الف 00000<br />اما على النظره<br />متبسليش بعين راضيه بص للى دفع فيا<br />انتى تتحكمى فيا وانا اتحكم فى البلد<br />مسكه عليه حاجه<br />عشريناتيه وقادره<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
archived = "2006-09-10"
capture_url = "https://web.archive.org/web/20060910173357/http://masr.20at.com:80/article.php?sid=357&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

