text = "انا يا جماعة عايز اقول ان الموضوع ميستهلش ده كله<br />واحدة وبتبص لخطيبها ومش عاجبها حاجة<br />حد خاطب يقدر يقولى انه متبصش له بالطريقة دى<br />الفرق الوحيد ان الصورة اتلقطت هنا<br />وبعدين يمكن واحدة حلوة عدت وجمال بصلها بطريقة مش اقد كده<br />وبالتالى يستاهل ولا ايه ايه رايكوا<br />سلام"
