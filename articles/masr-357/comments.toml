subject = "تانى يا براء"
author = "نيفين ..نيفى ..نوفا"
posted = "2006-05-23"
text = "يعنى بعد بيخطر على بالى و بعد لو فى مكانه تكتب الموضوع دا<br />و الله يا براء النوعيه دى من المقالات اللى على شاكله بسلامته بيخطب غلط<br />تعرف ليه علشان انت كدا بتتكلم على خصوصيات جمال<br />يا ابنى احنا اللى لينا امور البلد لكن حياته الشخصيه حلوه و حشه ليه<br />و بعدين النظره دى لاتدل على شىء<br />و كتير منا بتتلقط ليه صور مش شرط تدل على شخصيته<br />انا مش شغللك فهمتها و جهه نظرى خلاص اما انت يا عبد الله مفتاح بصراحه متوقعتش منك التعليق دا<br />حتى انت يا عبد الله"
