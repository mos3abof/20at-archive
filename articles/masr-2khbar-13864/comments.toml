author = "على بونجو"
posted = "2009-10-30"
text = "الجابون بتاع الرئيس الابدى السرمدى مبعوث العناية الالهية العليم الحكيم الخبير عمر بونجو وبعد ان نفق زى الحمار جلس ابنة بالانتخابات الشرعية والقانونية الدستورية على كرسى السلطنة الجابونية واسمة على بونجو ليضع الفكر الجديد والقيادة الشابة المتوثبة فى خدمة الجابون<br />وبكدة الجابون هتتقدم بيهم وعلشانك يا مواطن يا جابونى<br />ولا عزاء لغير الجابونيين"
