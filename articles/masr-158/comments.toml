text = "ما يحدث لنا الان هو لاننا افترينا علي جمال عبد الناصر الدي مات مفلسا ومن بعدة اسرتة تكافح ما عدا شريك السادات مروان لقد تعلمنا واتنيلنا اكلنا وشربنا ببلاش ثم شتمنا خاصة في السبعينات ولم نرحم الاموات وحرمة القبور واخرجنا احقادنا فكان مصيرنا الوراثة"
