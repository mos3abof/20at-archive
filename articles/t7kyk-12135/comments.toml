text = "كم طفل فى مصر مات لان اهلة مش لاقيين دواء وكم مصرى باع اعضاء جسدة وباع كليتة علشان ياكل<br />دى رسالة من ربنا بتقول للناس دى اصحوا<br />ان كانت القوة الغاشمة تحميكم فان باب القبر مفتوح<br />ولو كنتم فى حصون مشيدة فان عزرائيل يصل اليكم"
