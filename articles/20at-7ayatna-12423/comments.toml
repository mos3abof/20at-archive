author = "ابو حنين الكريماوي"
posted = "2009-06-21"
text = "والله حيرة…مشاكلنا هوايه…بخصوص موضوعك المهم جدا…يا ما ايام تشتد فيها الحراره حتى انك تشعر وكانك في عز الظهر انت نائم على السطح…ويا ما ليالي لا تستطيع ان تنام من شدة الحراره…الله يعيننا على الصبر…ومن حقنا ان نسمي اولادنا ((أيوب))…"
archived = "2009-06-24"
