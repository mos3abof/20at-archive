text = "تحياتي للاخ الكاتب وتحياتي للقراء<br />اعتقد اننا لسنا في حاجه للكهرباء لان الطاقه الكهربائيه ملوثه للبيئه ونتبرع بها للسيد الوزيرلكي يشبع بها<br />اما نحن فتحياتنا للبك والحرمس واما الذبان فلم يعد يزعجنا لان مألو ف هوه والمردان وباقي الحشرات الجميله الاخرى"
