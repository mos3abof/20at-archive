subject = "معلومه ع الماشى و ببلاش"
author = "نيفين"
posted = "2006-03-15"
text = "و لو انى مش محتاجه انقاص الوزن بس اكيد عشرينات يشكرو<br />ممكن الواحد يحتاج المعلومات دى برده ف يوم من الايام<br />بس انا عايزه اقدم نصيحه لكل اللى نفسهم ينزلو وزنهم<br />يا جماعه فيه حاجه اسمها<br />life style<br />بمعنى انك متعملش ريجيم بس الواحد ياكل كل حاجه بنسب<br />سواء يحددها هو لنفسه او يحددهاله دكتور<br />ودى بتنفع مع الناس اللى مبتقدرش على الريجيم<br />ايديكو على الفوزيته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153507/http://www.20at.com/article2.php?sid=569"

