subject = "الموضوع كبير كبير"
author = "Dabdoob"
posted = "2006-03-15"
text = "موضوع الجسم المثالي وفقد الدهون فيه كلام كتير قوي<br />واظن ان الموضوع كان هيكون اقوي لو تناول تاريخ برامج انقاص الوزن من اول رجيم اللبن في العشرينات وحتي رجيم low carb diet بتاع اتكينز (اشهر نظم الريجيم في العالم) وريجيم موجات السعرات الحرارية<br />وعموما لو فيه حد عايز معلومات عن انقاص الوزن والدهون يبقي يقول لي<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153507/http://www.20at.com/article2.php?sid=569"

