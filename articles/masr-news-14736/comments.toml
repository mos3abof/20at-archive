author = "شكل النظام مقزز"
posted = "2010-01-04"
text = "امس كان فية مظاهرة امام السفارة المصرية فى بيروت<br />وايضا مظاهرة امام السفارة المصرية فى الاردن<br />ورفعوا لافتات مكتوب عليها شتائم وصور لحسنى مختومة بنجمة داوود<br />والحكومة استغلت الازهر ليطلع بيان تاييد للجدار استغلال الدين فى الشعارات زى الاخوان<br />والصورة داخليا كئيبة<br />تخبط فى كل حاجة<br />طيب اية لزمة الجدار<br />ما نفتح المعبر يدخل لهم الطعام والاكل والشرب وخلاص يعنى المواد الغذائية فقط علشان العالم حتى اوروبا لا تاخذ مننا موقف وكاننا شركاء فى الحصار<br />لو فتحنا المعبر من ناحيتنا واسرائيل منعت من الناحية الاخرى يبقى عملنا اللى علينا<br />ولكن الغباء السياسى للنظام بيخلق كل يوم اعداء لة<br />حتى بعثة الاغاثة اللى منعناها وبعدين سمحنا لها بالدخول من العريش كان اية لزوم التماحيك ومظاهرات الاجانب فى القاهرة<br />غباء سياسى وجهل واناس مش عارفة تحكم دولة<br />انت فين يا برادعى<br />تعال وارحمنا من الغباء"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105172823/http://www.20at.com:80/masr/news/14736-2010-01-04-09-40-54.html"
