text = "كنا هنبنى وادى احنا بنينا السور العالى<br />اغنية الموسم<br />شارك فى التخت<br />ابو الغيطان - شيخ الازهر - سرايا - وممتاز القط - وفرقة انشاد الحزب الوطنى<br />كنا هنبنى وادى احنا بنينا السور العالى<br />بايد عمالنا بايد اولادنا<br />كنا هنبنى وادى احنا بنينا السور العالى"
