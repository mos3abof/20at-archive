text = "حمله موافقه ولكن هل هناك حمله اخرى في لبنان وسوريه وغيرها من الدول العربيه التي تعامل السيلانيات والافارقه معامله العبيد ان المعالمه في تلك الدول اشد سوء ومرراه من معامله الخدم الخليج هي معامله اشبه ماتكون بالمتعتقلات العسكريه"
