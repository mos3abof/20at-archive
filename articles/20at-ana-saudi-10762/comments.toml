text = "بعد مدة وجيزة من الزمن، ستطالب هذه الاقليات عفوا الاكثريات بحقوق المواطنة كاملة ،وهي مطالب مشروعة طالما العرب والمسلمون يحصلون على المواطنة في الدول الاروبية، اما نظام الكفيل وغيره فلن ولم يحم صغار وشباب اهل الخليج من تاثير الحدم والعمال الاسيويين، الشيء الذي يظهر في اللباس والموسيقى بل وحتى المعتقدات الدينية وكنت قد اطلعت على تقرير يقول بان هناك منظمات منظمة تسفر عنوة الى الخليج الاف من الخادمات قصد الترويج لديانة معينة..ويكفي انك في دبي مثلا لايمكن ان تقضيا اغراضك اليومية بدون اللغة الانجليزية لانها لغة الاغلبية الاسيوية"
archived = "2010-01-05"
