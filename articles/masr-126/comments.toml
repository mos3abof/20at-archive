[[comments]]
order = 0
subject = "طب وحبايبنا الحلوين ؟"
author = "sweet_princess"
posted = "2006-04-05"
text = "عرفنا ان دي اعمار الفنانين ...<br />طب وحبايبنا الحلوين بقى ؟<br />فنانين و مهرجين السيرك القومي المصري المسمى بالسياسه ...<br />مش لازم يكون لهم حظ مكعانا برضه ؟!!!!!!!!!<br />الناس يا عيني بتشقى و تتعب في خراب بييوت اللي خلفونا وضياعنا اكتر ما احنا ضايعين .....<br />لالالالا انا زعلانه ...<br />وعشان كدا هفتتح الجلسه باول راس م اللي عاوزه قطعا ..<br />الباشا الكبير اوي اوي اوي ...<br />ماشاء الله عمال يحكم فينا احنا واللي جابونا بقاله بتاع 26 سنه يعني في جيل كامل طلع على ايديه ..<br />فخامته مواليد سنة 1928 .. حسب بيانات البطاقه ..اللي واضح انه شافط منهم سنتين تلاته ..<br />مش غريبه ماهو شافطنا بقاله سنين ..<br />المهم:<br />اذن عمره (اطال الله بقاؤه)..(78)سنه<br />ماشاء الله ع الشباب .. شاب عنده 78 سنه ..<br />ماهو يحق له يعمل اللي هو عاوزه بعد (العمره) .. بفتح العين اللي بيسافر يعملها في باريس كل سنه .. ويظهر كله شباب ..<br />وكل دا من دمنا ...<br />حسبنا ونعم الوكيل"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211752/http://masr.20at.com:80/article.php?sid=126&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

