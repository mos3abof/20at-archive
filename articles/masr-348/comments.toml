posted = "2006-05-20"
text = "لو كنت رئسه الموقع دا اشيل \" اسرار البنات يتكم القرف المعلقين طبعا \" مع احترامي لبوبي<br />لو كنت مكان حسني اوعي تحوشني كنت قتلتكم يا ولاد \" البلد طبعا \"ازاي تتكلومو علي ابني جيمي كدا ها انتو ماكلو يخطب اللي يخطبوه<br />لو كنت خديجه المحروسه مراته كنت ولعت في نفسي بجاز<br />لو كنت حاكم دوله عربيه الحمار اللي قالي يا عربي اشيله فوق راسي<br />ولو لم اكن مصريا لوددت ان اكون بنيما \" علي راي\" واحد معدي \"غير \"واحد تاني \"<br />لو كنتي تدرين ما القاه من شجن لكنتي ارفق ما اسي ومن صفح<br />لو كنت طهقان من الموقع دا اضغط \" X\""
