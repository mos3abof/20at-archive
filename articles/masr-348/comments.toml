text = "سيدي الرئيس .. أنت جبان<br />أراك تلتصق الآن في مقعدك الوثير، وتثبّت عينيك على الشاشة الصغيرة، وترتعش يداك وهما تتعّرقان حول سمّاعة الهاتف، وقد جاءك صوتٌ من أحد كبار الكبار يطمئنك بأن كل الأمور على ما يرام، وتمام يا أفندم، فقواتك الباسلة، يا صاحب الضربة الجوية الأولى، اخترقت بشجاعة منقطعة النظير جيشاً عرمرم من شباب صغير ومرهَق من السهر استعدادا للامتحانات، ثم لبى نداء قضاته الشرفاء.<br />كانوا عشرة على الرصيف، وجنودك الأبطال أكثر من تسعمئة يحاصرونهم. القانون يقول بأنه يتم القبض على مخالفيه، ثم يُعْرَضون على النيابة. أما قانون الجبان فيطلب من كل ثلاثين أو أربعين كلبا محاصرة مواطن واحد، ثم القائه أرضا، وركله بشدة في كل أنحاء جسده حتى يتورم، وتنفجر من مساماته دماء حمراء قانية.<br />أراك هاربا في ايطاليا أو ألمانيا أو المغرب أو شرم الشيخ، وأتحداك أن تخرج في موكب مخترقا شوارع العاصمة ولو كنت في حماية أمريكا واسرائيل وكل كلابك الذئبية المفترسة.<br />أقدم اعتذاري الشديد لكل الطيارين الأبطال الوطنيين الذين رعتهم سماء مصر في السادس من أكتوبر عام 1973، وأقول لهم بأن هذا الرجل ليس منكم وليس مِنّا.<br />لعلك كنت تستلقي من الضحك على غضروفك الذي آلمك عندما بلغك نبأ تحرش ضباطك وجنودك بفتيات مناضلات أصغرهن أكثر منك شجاعة، وأعمق حبا للوطن، وأقرب لروح السماء منها لتراب الأرض.<br />انتقدتك كثيرا، وكتبت عنك ما ظننت أنه يفجر الماء من الصخر، ولكنني هذه المرة أحمل لك رسالة من سبعين مليونا من المصريين، ومعهم ستة ملايين مغترب منعهم ظلمك أن يدلوا بأصواتهم في الانتخابات الأخيرة خشية أن يكون الوعي قد أصابهم، والخوف من زائر الفجر قد زال عنهم في الغربة.<br />الرسالة التي أستطيع أن أختصر لك فيها ربع قرن من حكمك العفن والت<br />اقرأ بقية التعليق .."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

[[comments]]
order = 18
subject = "خد عندك"
author = "زعلان وحزين"
posted = "2006-05-25"
text = "أنا بأقول آهو لاسرائين .. العين بالعين والسن بالسن واللابالم باللابالم..والعالم كله سامعيني .أنا الإجز بتاعي مفقوع من زمان .. يعني من الآخر نفيش حد فيك ياعالم هايصيع علينا إحنا المصريين ..إحنا اللي راضعين لبن الحزن والسواد الاسود من يومنا فكل شعب يحترم نفسه ويلزم داره .. أنا بأقول أهوه... كانت هذه فقرةمن خطاب السيد الرئيس أحمد فؤاد الفاجومي .. وحيث اهتمت وكالات \"الأمباء\" العربية والعالمية وأذاعت فقرات مطوله منه.. بينما استنكر رئيس الوزراء الاسرائيلي عامير شارون تصريحات الرئيس المصري الفاجومي واعتبرها تحريض على كراهية اسرائين وانها بمثابة تهديد بالحرب .. وفي تعليق على الخطاب صرح السيد / بلال فضل رئيس الوزراء بأن الحكومة ستضع خطاب الرئيس الفاجومي على حجرها وتعتبره خطة للمرحلة القادمة في صفحة قلمين اللي لو مضحكتش فيها على الحكومة مش هاتضحك عليك.. هذا وقد أشاد الأستاذ/ بوتاجاز القط رئيس تحرير صحيفةالخيار بحلاوة بيان وجمال سنان الرئيس الفاجومي وكشف سر الخطاب أن الرئيس الفاجومي دعاه إلى القصر الجمهوري في المقطم وطلب منه أن يمسك له السلم الخشب \" أي والله حصل\" علشان الرئيس يطلع عليه إلى سطح الأحداث الساخنة وأنه كان مرافقا لسياته وشاهدا على كتابته الخطاب بعد ما رزع طبق البامية المقمعة وحبس بسيجارة محشية ووراها كوباية شاي مغلي والجلالة نزلت عليه ونتش الخطاب بعدها...وحيث قارن الأستاذ/ عبدالله السروال رئيس تحرير مجلة بربسكول بأن الله كان رحيما بالبلد حينما أزاح عنها الكابوس الذي ظل جاثما على وركها وانكشح الحزب البطني ولم عزاله بعد طول معركة كفاح قاده وحده وسط الزلازل والأعاصر والعصير هو وزملاء الكفاح المشلح بوتاجاز القط وابوفاضلة والرعيل الأول ابو الأنفاع وأبو الأرجاب وابو الأسعاد من قبل<br />اقرأ بقية التعليق .."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

[[comments]]
order = 19
subject = "لو أنا كنت مكاني....ولو أنت كنت مكانك"
author = "واحدة وخلاص ..واحدة وخلاص"
posted = "2006-05-26"
text = "اعتقد ان كل انسان محطوط في مكانه الصحيح<br />ومحدش يقدر يكون مكان حد<br />يعني انت لو مكانه واسمك حسني ومولود في المنوفية وعندك79سنة حتعمل زيه بالظبط<br />ولو اسمك نظيف وماسك الحكومة من سنتين وورئيسك اسمه حسني والوزراء بتوعك هم ....و.....و...<br />حتعمل زيه برضوا<br />الاحسن من كدة ان كل واحد يحاول يصلح نفسه ويغير نفسه .....<br />لأن محدش يقدر يجيي مكانك دلوقتي او يصلح اللي انت بتعمله...<br />انت اقدر واحد على تصليح وضعك...<br />ولو ده حصل ...الدنيا كلها حتتصلح<br />ملحوظة :<br />انا معرفش الاخت اللي كتبت فوق ان اسمها \"واحدة وخلاص\" ....<br />\"\" ويا ريت تغير اسمها\"\""
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

[[comments]]
order = 20
subject = "ماذا تفعل لو كنت مكاني"
author = "الاستاذشيكو"
posted = "2006-05-26"
text = "هوة فيه حد من الشعب المصري ينفع يكون مكان البهوات اللي فوق ولا الناس باين عاليها اتجننه عشان واحد زى يحلم يكون مكان المبارك !!!!ليه هوة انا مجنون طب والله لو اتعرضت الوزاره لالالالالا الوزارة ايه لو الرياسه كلها ما هاوافق ده وجع دماغ يابا اوعه حد يفتكر الرياسه بتاعه المبارك لالالالالالالاوالف لالالالا ده غير قابل للتحقبق اساسا ولا حتي للحلم اقصد رياسه الكتاكيت ما اصل انا حاطط نفسي مكان ديك رزل ورخم علي الكتاكيت والفرخه بتاعتي عايزة ابني يمسك مكاني"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

[[comments]]
order = 21
subject = "ماذا تفعل لو كنت مكاني"
author = "الاستاذشيكو"
posted = "2006-05-26"
text = "اصل انا واخد مكان ديك عايز كل اللي حواليه فراخ من غير انفلونزة الطيور والفرخه العتقييه مراتي يعني عايزة الكتكوت جي ده ابني الرخم التاني ما هو اصل انا الاول وبعدين هوة التاني وفيه التالت والله لو ما الكتاكيت اتلمت وخلو ابني جي التاني ياخد مكاني لاكون مخلف كتكوت تالت علي كبر وياخد الرياسه من بعد التاني وبكده يكون عيله الكتاكيت والديك الاكبر المبارك فازوا بالعشه كلها بس من غير كتاكيت ولا فراخ عشان كلهم ماتو فداء للكتكوت جي ونجله الكتكوت 0000 اي حاجه واللخ ما اجعله خير"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

[[comments]]
order = 22
subject = "أسكن بلد تانية"
author = "د/ المتولى محمد"
posted = "2006-05-26"
text = "يا عم مافيش حد ممكن يكون مكان حد كل واحد بيمثل مصالحة فقط. النظام كدا مافيش قواعد ولا قوانين تحكم العلاقات بين الناس. قانون انا ومن بعدى الطوفان هو السائد.<br />عشت 4 سنين من حياتى بجد فى الخارج عمرى ما حسيت بالغربة...انا هنا غريب جدا...<br />لو رجعت الأيام مرجعش تانى ابدا....<br />كنت سكنت فى بلد تانية غير البلد اللى ساكنة جوايا....<br />على فكرة الحل مش فى تغيير المسؤليين بس الحل فى تغيير طريقة ادارة البلد كلها...."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

[[comments]]
order = 23
subject = "ياااااااااااااااااااااااااااااااة"
author = "طارق حسن"
posted = "2006-05-26"
text = "يااااااااااااااااااااااااة<br />داحنا عبط عبط وهبل هبل<br />تخيلوا يا جماعه انى قطعت يوم الخميس مسافه600كم هى المسافه من بلدنا للقاهره رايح جاى علشان اشارك واشاهد ذلك اليوم المفصلى فى تاريخ مصر<br />ذلك اليومالذى دعت اليه جميع قوى المعارضه فى مصر<br />وكان عزائى الوحيد لما وصلت التحرير انى لقيت هبل كتير زيى صدقوا كلام الجماعه الجورنالجيه اللى شنفوا اذانا عن اتحاد وتلاحم جميع قوى الشعب فى هذا اليوم المهم لا انكر انى خرجت من هذا اليوم بمجموعه حقائق كانت هى عزائى الوحيد ولازم تعرفوها مع القسم بالله العظيم ان كلامى بامانه يا جماعه<br />1-الاخوان المسلمين عبارة عن كارت بتلعب بيه الحكومه فى الوقت المناسب انما ليس لهم اى دور فى واقعنا السياسى فى البلد وهما عارفين كدة كويس وللاسف مش عاوزين اكتر من انهم يكونوا كارت<br />2-الجماعه الجورنالجيه بتوع جرايد المعارضه ناس شغلتهم الحقيقيه انهم يبيعوا هموم الناس للناس بس ويكسبوا منها ولا يهمهم اى شيىء اخر والدليل انى رايت بنفسى اطول اقصر مسافه فى العالم وهى مسافه ال15م الفاصله بين سلم نقابه الصحفيين(حيث مظاهرة الهبل اللى انا كنت منهم ) وقاعه الاجتماعات حيث اجتماع الصحفيين تلك المسافه كانت اكبر بكتير من المسافه بين القاهرة وبلدى<br />3-الشعب دة شعب غلبان اوى ونفسه يعيش دونما اى استعداد للتضحيه علشان كدة اللى بيحب الشعب دة يسيبه يعيش من غير ما ينغص عليه حياته<br />4-محمد حسنين هيكل اول كاتب محترم فى مصر والوحيد اللى قال الحقيقه فى الفترة السابقه وان لم يشارك فى اى خطوة بنفسه<br />5- الف الف مبروك للوريث القادم وربنا يبارك لنا فيه ويحنن قلبه علينا<br />سلمولى على كل قوى المعارضه فى مصر"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

