[[comments]]
order = 0
subject = "كنت عملت كتير"
author = "عبدالله مفتاح"
posted = "2006-05-19"
text = "لو كنت مكان عصام العريان كنت دعيت لمناظرة مع اتخن راس يساري في البلد<br />لو كنت مكان فهمي هويدي مكنتش سبت اي كاتب عبيط يشكك في معتقداتي<br />لو كنت مكان دكاترة الجامعة كنت خليت نص المحاضرة قيم مبادئ ومثل والنص التاني منهج دراسي<br />لو كنت مكان عبدالله كمال كنت ولعت في نفسي<br />او رميت نفسي من الشباك لاني مش هطيق نفسي وانا منافق اوي كده<br />لو كنت مكان عماد متعب كنت بعد كل جول بينت فانله تحت الفانله مكتوب عليها ربنا يكرمك يا بابا ويا ماما<br />لو كنت مكان تامر حسني كنت اكسفت اوي<br />كفايه كده لحسن انا طولت<br />لا للتمديد ...لا للتوريث...نعم لتعديل الدستور"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

[[comments]]
order = 1
subject = "لو كنت مكان ؟؟؟؟"
author = "د . محمود"
posted = "2006-05-20"
text = "لو كنت مكان القضاه لاضربت عن العمل حتى عزل وزير العدل .<br />لو كنت مكان اعضاء مجلس الشعب لاحترمت نفسى وموافقش على القوانين سيئة السمعة عمال على بطال زى الاهبل .<br />لو كنت مكان وزير الداخلية لانكسفت على دمى ده لو عندى دم اصلا من اللى حصل من الامن وضربهم للمتضاهرين بطريقة همجية واستقلت من الحياه كلها .انتحار يعنى<br />لو كنت مكان حسن صقر لقدمت شوبير وشلتة بتوع تذاكر بطولة افريقيا للنيابة .<br />لو كنت مكان جودت الملط لاعلنت التقرير السنوى على الهواء فى مؤتمر صحفى عالمى واتقدم باستقالة مسببة حتى يتم تقديم المسئولين عن الفساد للمحاكمة .<br />لو كنت مكان حسنى مبارك اعمل حاجة من اتنين اما استقيل واريح الشعب منى او أأمر باعدام 90% من الشعب المصرى اللى واجع قلبى ومسبب لى الصداع علشان ارتاح واسيب الحكم لابنى وانا مطمئن عليه هو واولاده من بعدى لانى لو معملتش كده الشعب هيبهدل اللى جابونى انا وعيلتى علشان كده لازم اختار الحل التانى وهو اعدام الشعب المصرى علشان الدنيا تبقى رايقة وهاديةومفيش مشاكل واولهم البراء اشرف هو وبتوع ولاد البلد علشان بيقولوا عليا كلام مش مريحنى وبيفتحوا عين الشعب على كل اللى بعملة انا والمدام وعيالى"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

[[comments]]
order = 2
subject = "لا أتمنى أن أكون هؤلاء"
author = "كنت مصرى"
posted = "2006-05-20"
text = "لو كنت مكان حبيب العدل كنت قرأت قرأن علشان أعرف إللى مثلى ها يكون عقابهم أيه على دعوة المظلومين عليه<br />لو كنت مكان حسنى مبارك كنت إستكفيت بهذا القدر من الحكم المخزى والنهب والتهريب وكراهية الشعب ليه وعرفت إيه إللى إتعمل فى فرعون لما طغى وكنت سبت البلد وأخذت الحرمه معايا والعيال علشان أريح مصر كلها من أى أثر ليه<br />لو كنت مكان جمال مبارك كنت إستكفيت بإللى نهبوا أبوية ليا وإللى أنا نهبته والعز والجاه إللى أنا عايش فيه وسبت مصر إللى أصلاً ليس لك أى ولاء لها أو لشعبها وعشت فى بلد أمى إنجلترا<br />لو كنت مكان رئيس مجلس الشعب كنت إنتحرت من تأنيب ضميرى على القوانين الفاسدة إللى بيمررها والتجاوزات والنصب على الشعب<br />لو كنت مكان نفسى كنت هارفض كل هذا الفساد بكل الطرق وأطلب العون من الله أن يريح مصر ويطهرها من فسادهم اللهم أمين آمين يارب"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

[[comments]]
order = 3
subject = "لو كنت مكان حسنى مبارك"
author = "أتمنى ألا أكون مصرى"
posted = "2006-05-20"
text = "لو كنت مكان حسنى مبارك كنت هابطل أصبغ شعرى وأشد وشى وكنت هاعتبر أحلى شد وش أنى أرى مشاكل شعبى وأحلها وأعمل مشاريع للشباب وأتقى الله فى شعبى وساعتها ها شوف مدى حب شعبى ليه وإللى يشوفنى هايلاقينى أحلى واحد ساعتها وها يتمنى أنى أكون شباب علشان أحكمه أكثر وعلى فكرة كمان مكنتش ها أخلى إبنى يحكم علشان أدى فرصة للشعب إنه يختار إيلى هوه عايزه"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

