[[comments]]
order = 11
subject = "لو كنت مكان"
author = "مصرى"
posted = "2006-05-21"
text = "لو كنت مكان الإخوان المسلمين كنت عرفت أنهم الوحيدين إللى أنتخبوا من قبل الشعب بحب الشعب ليهم وبدون تزوير ولولا تزوير الإنتخابات لصالح الحزب الوطنى كانوا إكتسحوا كل مقاعد مجلس الشعب وكنت عرفت إن ثقة الشعب فيهم كبيرة علشان يخرج من فساد الحاكم وحكومته وإنهم لا زم ميخزلوش الشعب فيهم أبداً ويكونوا أقوى من كده فى أدائهم فهم صوت الشعب كله وأمله والشعب كله ملتف حولهم ولا يخشوا إلا الله<br />ولو كنت مكان حسنى مبارك كنت هادعو ربنا ليل نهار إنه يغفر لى كل إللى أنا عملته فى شعبى وهاترك الحكم فوراً وأرجع كل إللى نهبته من ثروة مصر وأقضى باقى عمرى فى الإستغفار والعبادة لعل الله يغفر ذنوبى<br />ولو كنت مكان عمر موسى ما كنتش سبت مصر كده وكنت سمعت صوت الفساد إللى موجود فى مصر للعالم كله علشان يعرفوا إيه إللى بيحصل فى مصر من فساد<br />ولو كنت مكان كل عالم دينى وشيخ كنت طلبت مساحة فى التليفزيون علشان أعرف الناس كلها تعاليم الإسلام السمحة ليهتدوا جميعاً"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

[[comments]]
order = 12
subject = "واغنى لمصر اللى بتتولد من جديد ف ساعه ضلمه ما يعلم بيها الا ربنا"
author = "نيفين..نيفى ..نوفا"
posted = "2006-05-21"
text = "اولا الله عليك يا براء<br />لو كنت من مذيعات التليفزيون اللى من ايام الهجره كنت اعتزلت و سبت فرصه للوجوه الجديده(الحلوه)<br />لو كنت من اساتذه الجامعه المساعدين كنت اتقيت ربنا ف طلبه الدراسات العليا\"(خصوصا المششتير)<br />لو كنت بشتغل ف قناه الجزيره كنت فجرتها و ريحت الناس منها<br />لو كنت مكان البيج بوس كنت انتحرت على مراى و مسمع من الشعب كتكفير عن سنين الحرمان<br />لو كنت مكان جمال مبارك كنت اتبيريت من ابويا و وقفت فى التحرير و قلت هذا ما جناه على ابى و ما جنيت على احد<br />لو كنت من نواب مجلس الشعب كنت انام ف بيتنا بدا ما انام ف الجلسات<br />لو كنت زملكاوىلوددت ان اكون اهلاوى(الاهلى حديد)<br />لو كنت بدال الظابط(المحترممممممممم)اللى هزق محمد عبد القدوس كنت قلت له الشوز بتاعتك على راسى يا استاذ<br />لو كنت من البراء اشرف كنت اخاف على نفسى(اهللك عايزينك يا ابنى)<br />و اخيرا<br />لو كنت منك يا مش شغللك مكنتش اجرح ف حياه الناس<br />يا بنتى ميصحش نشتم حد ملوش دعوه بالموضوع<br />مالها خديجه يا مش شغللك علشان تشتميها<br />مش قلنا بلاش خصوصيات الناس"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

[[comments]]
order = 13
subject = "لو"
author = "مصرى"
posted = "2006-05-21"
text = "لو كنت مكان تامر أمين كنت سبت برنامج البيت بيتك علشان مقرفش الناس فى عيشتها أكثر وأكثر بمنظرة المستفز<br />لو كنت مكان سوزان مبارك كنت بطلبت أظهر فى أى مكان علشان شكلها عاملة زى الساحرة الشريرة<br />لو كنت مكان مديرى فى العمل كنت مسرقتش زيه<br />لو كنت مكان حسنى مبارك كنت عشت زى الشعب وفى نفس مستواه علشان أشعر بيه<br />لو كنت مكان الشعب كله كنت أتمنيت الخير لمصر كلها علشان أنا بحبها"
