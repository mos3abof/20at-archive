[[comments]]
order = 6
subject = "حنكسف من نفسي طبعا"
author = "ابو كرتونة"
posted = "2006-05-20"
text = "لو كنت مكان الريس : كنت طبعا حنكسف من نفسي علي الي عملته في البلد من خراب وضياع , وكنت هطلب من مجلس الشعب ومجلس الشوري الانعقاد لاعلن امام 73 مليون مصري اني اتقدم بالاستقالة الفورية والغير قابلة للطعن فيها او العدول عنها, لاني كبرت خلاص واصبحت غير قادر لاتولي دفة السفينة المصرية التي اوشكت الي الغرق الي قاع البحور المظلمة , وحتي اتيح الفرصة العادلة والديموقراطية لرئيس يخلفني انتخبه الشعب وبدون ادني تزوير سواء كان الرئيس القادم من الوفد او الناصري او الغد , او حتي تيار الاخوان او حتي رئيس قبطي المهم يكون اولا عادل,ثانيا ديموقراطي واخيرا يرعي مصالح الشعب المصري بموجب الدستور والقانون."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

