[[comments]]
order = 16
subject = "لو أقدر"
author = "مصرى نفسه يسيب مصر"
posted = "2006-05-22"
text = "لو كان بإيدى كنت منحت كل شاب فرصة عمل علشان أقدر أوفر له دخل وكنت شعرت أن الشباب ثروت مصر ولا زم أحافظ عليها وكنت أعطيت الصحراء كلها للشباب علشان يزرعوها ويبنوا بيوت ليهم يعيشوا فيها بقروض ميسرة بعد توفير الإمكانيات ليهم<br />لو كان بإيدى كنت أعدمت كل واحد حاول فى يوم من الأيام يهمش الشعب ويزور الإنتخابات لأنه ده قتل لآراء الشعب كله لمصلحة قله فاسدة<br />لو كان بإيدى كنت أقلت كل العواجيز الذين شاخوا وكانوا سبب فى فساد مصر<br />لو كان بإيدى كنت عقدت إجتماع شهرى فى مكان عام مع الشعب علشان أسمع منه من غير أى وسيط وأشعر بمشاكله وأحلها<br />لو كان يإيدى كنت سبت مصر كلها علشان مش هاقدر أعمل حاجة من الحاجات دى فى الوقت الحالى ومش طايقة الحياة بالصورة دى فى مصر"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233029/http://masr.20at.com:80/article.php?sid=348"

