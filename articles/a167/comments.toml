[[comments]]
order = 1
subject = "هؤلا هم الرجال"
text = "السلام عليكم روحمة الله وبركاته<br />لن اقول شى ولن ازيد او انقص غير اننى سوف اذكر ما قاله رسول الله صلى الله عليه وسلم\" من سن سنة حسنة فله اجرها واجر من عمل بها الى يوم القيامة ومن سن سنة سيئة فعليه وزرها ووزر من عمل بها الى يوم القيامة \" او كما قال رسولنا الكريم<br />وقال ايضا تركت فيكم ما ان تمسكتم به لن تضلو بعد ابدا كتاب الله وسنتى \" او كما فال<br />فسيرو الى الامام"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053606/http://www.20at.com:80/article.php?sid=167"

[[comments]]
order = 2
subject = "سلام كبييييييييييير لأفضل ام"
text = "ما شاااااااااااااء الله على هذه الام،وياليت كل الأمهات تفعل ذلك<br />سلام كبييييييييير أوى<br />و ياريت اللى على راسه بطحة يحس على دمه شوية، و يبطل العمايل السودا اللى بيعلها، احنا عايزين نربي اولادنا تربية حسنة"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053606/http://www.20at.com:80/article.php?sid=167"

[[comments]]
order = 3
subject = "أسوأ ام"
text = "سبحان الله في خلقة..سيدة بسيطة زي ما جاء في الخبر تصلح من ابنها بمنتهي البساطة..وعلي العكس سيدة مثقفة زي مابيقولوا تساعد ابنها علي الغلط..ياتري العيب فين..؟؟ لما بنت ابوها شخص مهم ومثقف برضوه تخرج كليبات لواحدة زي مروة..سيبك انها بتخرج كليبات او غيره من الأصل..والله سبب بلوتنا النوع ده من المثقفين..ناس ماعندهاش دم!!"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053606/http://www.20at.com:80/article.php?sid=167"

[[comments]]
order = 4
subject = "ثبتهم الله ، وعوضهم خيرا مما تركوا"
text = "الحق أني لا أملك إلا أن أنحني تحيةُ لما فعل هؤلاء الشباب ، الذين ضحوا بالعمل ، وبالراتب الذي نستطيع أن تقول عنه محترما في هذا العصر... تركوا كل هذا من أجل الله، ألا ثبتهم الله ، وعوضهم خيرا مما تركوا رزقا وفيرا وبركة في الدين والجهد والرزق، وأشد على عزيمكتكم جميعا إذ أذكركم بقول الرسول صلى الله عليه وسلم: \"من ترك شيئًا لله ؛ عوضهٌ الله خيرا منه\"<br />أجنادين<br />ajnadeeny@hotmail.com"
archived = "2004-05-06"
capture_url = "https://web.archive.org/web/20040506053606/http://www.20at.com:80/article.php?sid=167"

