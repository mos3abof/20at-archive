[[comments]]
order = 6
subject = "نكتة الموسم"
author = "الريس عايز يزود شعبيته فقال لرئيس الوزراء"
posted = "2006-06-29"
text = "يعلي الأسعار فالناس تتضايق يقوم هو ينزلها،<br />فعلا رئيس الوزراء زود الأسعار، بس الناس<br />ما اتكلمتش، عادي خالص،<br />الريس استغرب قوي، وقاله: طب خلي الضرايب<br />على المرتبات خمسين للمية. زود رئيس الوزراء<br />الضرايب خمسين فى المية، الناس هزت دماغها<br />وسكتت.<br />الريس اتجنن وقال لرئيس الوزرا بص، طلع أي<br />قرار غشيم من عندك يخلي البلد تولع، رئيس<br />الوزرا عمل ضريبة اللي يعدي كوبري يدفع عشرة<br />جنيه، الناس نفخت و ضربت كف بكف ودفعوا،<br />فقام رئيس الوزرا خلى اللي يعدي يدفع عشرة<br />جنيه وهو طالع، وعشرة جنيه وهو نازل من الناحية<br />التانية، الناس قالت اللهم طولك يا روح و<br />أمرنا لله و دفعوا.<br />رئيس الوزرا كبرت فى دماغه، وأمر إن اللي<br />يعدي بعد ما يدفع عشرة جنيه، و هو خارج من<br />الكوبري ياخد على قفاه، و نزل الريس بنفسه<br />متنكر يتابع الموقف، الناس تدفع وهية طالعة<br />الكوبري عشرة جنيه، و عشرة جنيه و هية نازلة<br />و تاخد على قفاها وتمشي،<br />شوية و لقى واحد بيزعق و متضايق، وطى على<br />ودنه قال له \"مالك؟\" قال له \"حاجة<br />تقرف! أنا متعطل هنا بقالي خمس ساعات..ما ينفعش<br />كدة ..لازم يزودوا الناس اللي بتدينا على<br />قفانا!!!!!!!!\""
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

