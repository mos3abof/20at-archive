author = "هانيبال"
posted = "2006-06-30"
text = ":وحياة ابوكي يا شيخة تبعدي انتي وتروحي تتعلمي الطبيخ او روحي شوفي الغسيل شكلو محتاج فمين من ايديكي اللي عاملين زي قمعين سكر من بتاع مصانع نجع حمادي .. لما الثورة مش هي حل لمشكلة مصر الابدية الازلية يبقى ايه هو الحل يا ماما؟؟؟ .. انتي شكلك كده جاهلة وجاية تتفلسفي بس انا برضه هاكون حنين معاكي وافهمك واحدة واحدة يمكن ربنا يسهل .. مصر محكومة بعصابة ( فعلا عصابة ) او مجموعة لصوص منهم مبارك اللي انتو مش شايفينه ده .. مشكلة مصر مش مبارك لوحده ولا كمال الشاذلي ولا صفوت عزيزة ولا جمال ولا اي واحد ابن وسخة لواط من عصابة مبارك لعنة الله عليه وعلى اهله الى يوم الدين .. المشكلة ان اي حاكم لمصر بيطمع في الناس ومش بيحترمها وبيعمل اللي هو عايزه سواء اللي هو عايزه ده كويس او مش كويس .. لو كان كويس اهو الناس بتستفيد ولو مش كويس اهي الناس زي مانتي شايفة كده .. ده مرض في الارض المصرية زي البلهارسيا كده يا اختي لو كنتي سمعتي عنها يا روح ماما يا نوغة .. وعلاجه مش انقلاب عسكري زي بتاع الخمسينات كده وادينا شوفنا نهاية الحكم العسكري ايه سواء في مصر او في اي بلد تانية .. ولا احتلال امريكي زي اللي حصل مع صدام واديكي شايفة يا حبيبتي ان العراق حالها يصعب على الكافر مبارك .. ولا اغتيال الحاكم زي ما عملو في السادات لان السادات اتظرف من هنا جه مكانه واحد العن منه ييجي خمسين الف مرة بدون مبالغة .. الحل هو ان الناس يقلعو كل خوفهم وينفخو عضلاتهم ويقفو كلهم في يوم ماطالعلوش شمس على دماغ مبارك ويقولو احنا مش عايزين دين امك .. بالذوق او بالعافية هاتسيب العرش وتتحاكم زي احقر تاجر بانجو او سمسار اعراض نتن .. اي حاكم هاييجي بعد كده هايكون عارف نهاية الظلم ايه .. وهايكون مبارك عبرة لكل من يحاول انه يلعب بديله في ال<br />اقرأ بقية التعليق .."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

