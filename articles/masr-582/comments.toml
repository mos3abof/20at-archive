[[comments]]
order = 4
subject = "الحقوناااااااااااااااااااااااااااااااااااااااا"
author = "سمير الزفت المصرى"
posted = "2006-06-28"
text = "نفسى اصرخ نفسى ابكى اصوت زى النسوان ليه ماهو الشعب كله نسوان ..قالوا لفراعون ايش فرعنك وفرعن اللى جبوك قال ملقتش حد يلمنى ....كذالك فى مصر لا يوجد شعب لا يوجد ناس ولا احساس ..والاستاذ اللى بيطلب ثورة شعبيه انا معاك بكل قلبى لكن دور على شعب بيفهم معنى الحريه ومعنى حقوقه فين ..هنا فى مصر نصف الشعب فلاحين والاخر صعيده لا دول بيفهمو ولا دولا بيعرفوا ..اما باقى الشعب وهم القله الحراميه النصابين الحكام..صرخنا وقلنا الاسعار محدش سال وصوتنا زى النسوان وقلناباعوكى يا مصر جمله وقطاعى محدش اتحرك ...وبكينا لما باعو كل شبر فيكى يا مصر حتى ورشه اجذم بتاعه الواد حكشه باعوها ولم يسال احد ...وترجع تقولى ثورة ..ثورة ايه يا استاذ ده شعب تاه من زمان..طب اخر شئ باعوا قناة السويس باعو قناة السويس باعو قناة السويس ..تحت مسمى الاشراف الامريكى عليها...ولم يكتب عنها فى حتى مجلد ميكى...ثورة ثورة ايه يا اخ...حسنى مبارك باع سيناء لسرائيل قال ايه اجاروها اسرائيل اجرت سيناء ..هو فيه ايه بلظبت هو مين هنا ..هوكام فين ولا ايه راح....يا هووووووووووووووو هو فيه دوله للاجار ياشعب قوم فوق انهض دافع عن نفسك ضد الغلاء اللى اكل بدنك يا شعب قوم من النوم ودافع عن دينك ودين امك ودين ابوك...اففففففففففففف"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

