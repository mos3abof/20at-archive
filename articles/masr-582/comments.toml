[[comments]]
order = 15
subject = "بكره حسنى مبارك"
author = "إيه حكاية إللى عمال يدينا درس فى الأخلاق ده هو ده مش مصرى ولا قيه وبعدين أخلاق إيه إللى ها نتكلم بيها مع وآحد نهب مصر وخربها وقاعد فى الحكم من غير شرعية والنبى تقولى الدستور بتاعك بيقول إن الحاكم ييجى بالأنتخابات وده مجاش بأى إنتخابات وبيقول إن الإنتخابات يشرف عليها القضاء والقضاء مأأشرفش على الإنتخابات ومزور لكل الإنتخابات يبقى مالوش أى شرعية فى حكمه يبقى هوه محتل لمصر ولازم يتعامل معاملة المحتل لغاية لما يخرج من غير رجعه من البلد ثانياً إيه إللى عمله لمصر نهبها وخربها وباع شركاتها ومصانعها حتى قناة السويس رهنها هى الحاجات دى كانت أملاكه دى أملاك الشعب وقايمة بمجهود الشعب وهو الوحيد صاحب الحق فيها ومش من حقه يبيعها ثانياً هو بترول مصر ده ملكه علشان يروح يبيعه لأمريكا بنصف الثمن ولا الغاز الطبيعى إللى العالم بيقوم بحروب علشانه يفتحه لإسرائيل ولحسابها زى ماهية عايزه وبعدين أفرج عن عزام عزام ومرضيش يفرج عن الدكتور العظيم أيمن نور إللى حاسس بالشعب وبمشاكله وبعدين الإتفاقيات إللى عمال يعملها مع إسرائيل هل إستفتى الشعب فيها هو بيحكم بلد ولا بيحكم عزبة من عزبه إللى ملهاش عدد وبعدين حاطت إبنه ليه فى السياسة وهو عارف إنه حمار ومابيفهمش حاجة غير فى السرقة والنهب هو والمجنونة مراته يبقى بعد كدة مطلوب مننا نكلمة بأنهى إسلوب وهو خارب البلد ومهمش شعبها من فقر وبطالة ومرض وده الإسلوب الوحيد إللى بيتعامل بيه المحتلين والخونة وفى الحالة دى عقابة عقاب المحتل وهو الثورة ولا بديل لو كنتم فاكرين إنكم بإعتقالكم لبعض الشباب ها تقدروا تخوفوا الشعب تبقوا غلطانين لأن الشعب كله بيكره حسنى ومبارك وعيلته والوسخه ومتمنى يخلص منه وده إللى ها يدفعه إنه يخرج وميخافش وربنا يريحنا منه يارب ونشوفه زى شارون ول"
posted = "2006-07-01"
