subject = "من فضلك كفاية شعر بقى"
author = "هانيبال"
posted = "2006-06-29"
text = "مش عايزين نشتت نفسنا والنبي وكل من له نبي يصلي عليه ..<br />اولا ..<br />مطلوب التخلص من قادة العصابة الاتي اسمائهم..<br />1 صفوت الشريف ( عزيزة سابقا )<br />2 جمال مبارك ( عشان نشطب ونخلص بقى )<br />3 احمد عز ( عشان نحرم جمال من كيفه )<br />4 عاطف عبيد ( مع ملاحظة منظر شفايفه )<br />ثانيا..<br />يجب الدعوة لثورة شعبية شاملة في كل محافظات مصر ومهما تكن النتائج وعشان تستريحو يعني من الاخر كده حسني مبارك لابد وتابت ومش هايطلع ولا بالطبل البلدي يعني الكلام مفيش منه فايدة ولا عايدة .. القوة هي اللي هاتغير البلد دي وتغير شخصيتها الازليه الابدية المكتوبة على قفا اهالينا من ايام سيدنا عكروت .. وبالنسبة للاخوة اللي بيكتبو شعر وهجاء وكده .. احب اقولهم ان الكلام مع الاشكال الكافرة دي مالوش لزمة .. يعني لا بيصد ولا بيرد وده عبط وهبل وقلة حيلة .. عايز تعمل حاجة يابابامنك له بطل تكتب شعر خالص اليومين دول واحسن ليك ولينا تلم اصحابك وحبايبك وجيرانك وتشرحلهم وتعرفهم وتبصرهم وتسخنهم عشان هوب كرسي في الكلوب الليلة تتلم ونحصد مصر في اوانها قبل ما الغلة تموت وتعفن واحنا نموت من الجوع او ناكل بعض ( رغم اننا بقينا بنكره بعض لدرجة العمي من الجوع الحرمان ) .. وواحدة واحدة نمسح الايام السودا باستيكة والرئيس اللي جاي واللي بعده يعملو حساب الناس ويعرفو ان الله حق وانهم مش بيصرفو من جيوب اهاليهم ( مع ملاحظة ان جميع اهالي رؤساء مصر كانو على فيض الكريم ) .. يا رجالة مين موافق على الكلام ده .. ؟؟ طيب اللي موافق يرفع ايده ..<br />عمكم هانيبال"
