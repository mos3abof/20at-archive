[[comments]]
order = 2
subject = "هانيبال يتحدى مبارك وحرمه"
author = "هانيبال"
posted = "2006-06-28"
text = "مش عايزين نشتت نفسنا والنبي وكل من له نبي يصلي عليه ..<br />اولا ..<br />مطلوب التخلص من قادة العصابة الاتي اسمائهم..<br />1 صفوت الشريف<br />2 جمال مبارك<br />3 احمد عز<br />4 عاطف عبيد ثانيا..<br />يجب الدعوة لثورة شعبية شاملة في كل محافظات مصر ومهما تكن النتائج وعشان تستريحو يعني من الاخر كده حسني مبارك لابد وتابت ومش هايطلع ولا بالطبل البلدي يعني الكلام مفيش منه فايدة ولا عايدة .. القوة هي اللي هاتغير البلد دي وتغير شخصيتها الازليه الابدية المكتوبة على قفا اهالينا من ايام سيدنا عكروت .. وبالنسبة للاخوة اللي بيكتبو شعر وهجاء وكده .. احب اقولهم ان الكلام مع الاشكال دي مالوش لزمة .. يعني لا بيصد ولا بيرد وده عبط وهبل وقلة حيلة .. عايز تعمل حاجة يابابا منك له بطل تكتب شعر خالص اليومين دول ( اجل الشعر شوية مش هاتموت يعني ) واحسن ليك ولينا تلم اصحابك وحبايبك وجيرانك وتشرحلهم وتعرفهم وتبصرهم وتسخنهم عشان هوب كرسي في الكلوب الليلة تتلم ونلحق نحصد مصر قبل الاوان ما يفوت والغلة تموت وتعفن واحنا ناكل بعض من الجوع ( رغم اننا بقينا بنكره بعض عمى من الجوع الحرمان ) .. وواحدة واحدة نمسح الايام السودا باستيكة والريس اللي جاي واللي بعده يعملو حساب الناس ويعرفو ان الله حق وانهم مش بيصرفو من جيوب اهاليهم ( مع ملاحظة ان جميع اهالي رؤساء مصر كانو على فيض الكريم ) .. يا رجالة مين موافق على الكلام ده .. ؟؟ طيب اللي موافق يرفع ايده ..<br />عمكم هانيبال"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

