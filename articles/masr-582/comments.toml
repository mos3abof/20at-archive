[[comments]]
order = 20
subject = "هانيبال يحدد ملامح الثورة"
author = "هانيبال"
posted = "2006-07-02"
text = "يا جماعة الثورة بتاعة مصر لازم تكون شعبية يعني المدنيين هما اللي يتحركو مش الجيش .. وانا هاتكلم بصراحة وعلى المكشوف واللي شايف حاجة غلط في كلامي يقول من غير كسوف يعني ..<br />اولا<br />احنا عندنا كام صحيفة محترمة ( الدستور والعربي والكرامة والغد والوفد والفجر ) الصحف دي يركزو مع بعض شوية ( يعني مدة شهر واحد ) ويقومو عاملين سلسلة تحقيقات صحفية لكشف حقيقة العصابة بتاعة مبارك .. يعني يرصدو البلاوي السودا اللي حصلت خلال ربع قرن من حكم اللي ما يتسمى وطبعا كل المعلومات متوفرة وجاهزة .. المهم ان يكون فيه تكثيف في الحملة الصحفية دي واتفاق بين الصحف على هدف محدد اللي هو كشف حقيقة وضعف اخطر لصوص القرن العشرين والواحد وعشرين اللي سايب البلد تضرب تقلب وهربان في شرم الشيخ<br />ثانيا<br />قادة الثورة هما القضاة .. يعني هما الرمز اللي الناس تتحرك حوالين منه .. والمطلوب في البند ده عمل اتصالات مع القضاة والتنسيق معهم والصحف المحترمة اللي ذكرتها كفيلة بتوصيل الرسالة .<br />ثالثا<br />بالنسبة لبداية الثورة .. انا اقترح ان البداية تكون بجماعة ليها تنظيم وعدد كبير زي الاخوان المسلمين ( عددهم يقدر بالملايين بدون مبالغة ) هما اللي يتحركو الاول ومعهم طبعا شباب وقادة الحركات الوطنية المحترمة واهمها حركة كفاية ..<br />ده بقى هايضمن لنا ان الثورة تكون منظمة وان الثوار مش هايخربو او ينهبو او يدمرو تدمير عشوائي زي اللي حصل ايام السادات ( مع الاعتذار لطلعت السادات ).<br />رابعا<br />بؤرة الثورة .. التجمع يكون في القاهرة والثورة تبدأ من القاهرة ..<br />خامسا<br />اتجاه الثوار .. فريق يمشي في اتجاه مصر الجديدة .. القصر الجمهوري .. وانتو طبعا عارفين ليه .. وفريق تاني يروح مجلس الشعب .. وفريق تالت يطلع على ماسبيرو .<br />سادسا<br />تسليح الثوار<br />اقرأ بقية التعليق .."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

[[comments]]
order = 21
subject = "الحل في الثورة او عمليات فدائية تضدهم"
author = "شاب عاطل مؤهل جامعي"
posted = "2006-07-02"
text = "البلد ضاعت يا ناس<br />حنفضل ساكتين لامتي<br />الحل في ثورة شاملة علي هذا العميل الخائن وابنه الشاذ<br />لازم نتحرك<br />فين الشباب , فين احفاد سعد زغلول ومصطفي كامل وجمال عبد الناصر<br />يجب ان نرمي هذا المنوفي الحقير الخائن وزوجته العاهرة وابنه الشاذ في مزبلة التاريخ قبل ان تضيع البلد اكثر من هذا<br />شوية ارقام عن حالة مصر الان:<br />650 مليار جنيه ديون داخلية<br />200 مليار جنيه ديون خارجية<br />انهيار في معظم المجالات الداخلية<br />60% من الشعب المصر تحت خط الفقر<br />22 % من الشعب المصري لا يجد قوت يومه<br />يعني نسبه الفقر عموما:22+60=82% فقير في مصر المحروسة(احصائية الامم المتحدة)<br />8 مليون عاطل في مصر معظمهم خريجي جامعات ومعاهد.<br />الغاء التعيين الحكومي وقصره فقط علي اصحاب النفوذ والواسطة (وكس ام الشباب الذي لايمتلك واسطة).<br />بيع كل ممتلكات الشعب المصري للاجانب من اليهود وغيرهم وتحكمهم في البلد(عمر افندي وغيرها من شركات ومصانع البلد التي كانت تشغل الشباب ايام جمال عبد الناصر الزعيم الحقيقي لمصر) ولم تكن هناك اي بطالة في مصر الي في عهد هذا الخائن العميل حسني مبارك المنوفي القذر البخيل<br />10 مليون عانس في مصر<br />السرطان زاد عشرة اضعاف المعدل العالمي بسبب المبيدات الفاسدة(يوسف والي)<br />والدليل اكبر مستشفي للسرطان في الشرق الاوسط<br />الالتهاب الكبدي :14% من الشعب المصري مصاب بالالتهاب الكبدي (سي)<br />الفساد اصبح للركب في كل شيء في مصر (كلمة زكريا عزمي ) العضو في الحزب الوطني<br />اقسم بالله ان الحل الوحيد هو في الثورة الشاملة علي هذا العميل الخائن وابنه الشاذ<br />وانا مستعد انا اكون اول من يشارك حتي ولو فقد فيها روحي لان الله لا يحب المتخاذلين الضعفاء.<br />كما انهم اضعف من ثورة الشعب عليهم لانهم خونه وعملاء وكلاب نجسة."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

