[[comments]]
order = 29
subject = "سمع هس"
author = "هانيبال"
posted = "2006-07-03"
text = "يا شباب .. يا شباب .. يا شباب ..<br />من فضلكم دقيقة واحدة معايا كده ..<br />كلنا عارفين ان مبارك حرامي وخاين وحقير وفيه ما في الخمر .. وعارفين ان كل اللي حواليه واللي بيشجعوه احقر منه وانتن ييجي مية مرة كده .. كلنا عارفين كل حاجة .. كلنا من اول دكاترة الجامعة لحد بياعين الطماطم والجرجير .. من فضلكم كفاية بقى نتكلم في عيوب واحد كله عيوب وبلاوي زرقا على دماغه و دماغ اللي خلفوه .. واهو المثل بيقول الضرب في الميت حرام .. هانيبال النهاردة بيقولكم تعالو نتفق كلنا على حاجة واحدة .. ايه هي الحاجة دي بقى ؟؟<br />كل واحد فينا يكتب هو عايز ايه بالظبط وباختصار .. ( باختصار يعني مش عايزين شعر وزجل وحاجات من دي اللي مش جايبة همها ) .. او يحدد الحل من وجهة نظره الشخصية .. بس بشرط .. انه يكون مقتنع مية في المية باللي هو كاتبه .. يعني يكون صادق مع نفسه قبل مايكون صادق معانا .. هانيبال شخصيا شايف ان الحل الوحيد هو ثورة شعبية منظمة تخلع صاحبنا من الكرسي وتحاكمه محاكمة معتبرة وتخوذقه وتحط مكانه نادي القضاة لمدة سنتين وبعدها الناس ينتخبو رئيس جديد .. هانيبال متاكد ان مصر بعد كده هاتدخل السبق من جديد والحال هايبقى معدن وكل واحد هاياخد حقه ..<br />وكلنا نطلب من ادارة الموقع انها ترفع رغباتنا لاي حركة او منظمة او حزب او جريدة محترمة على اساس ان الكلام ده مش مدهون بزبدة وانه مش مجرد كلام .. لا .. ده حلم .. وامل .. ومستقبل ناس ضايعة .. تعالو كلنا نعمل ده النهاردة .. التلات يعني .. هاااا مين قال انا اهو .. ؟؟؟؟<br />عمكم هانيبال"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

[[comments]]
order = 30
subject = "هايبال يرد على ال ..........."
author = "هانيبال"
posted = "2006-07-03"
text = "على فكرة .. الاخ اللي كاتب اتحاد الكورة ومعرفش ايه .. والاخ التاني بتاع الاشاعات .. احب الفت انتباه القراء الى ان الاتنين دول من امن الدولة ( اقذر جهاز في تاريخ الانسانية ) .. طيب هما عايزين ايه المعرصين دول ؟؟ عايزين يقلبو الجد تهريج عشان الشباب دماغهم تونون والغزالة تلعب والبانجو يسرسع في النافوخ وانساني وخد عنواني وانتو<br />عارفين الباقي بقى ..<br />.. والمستفيد الوحيد من ده هو ( تخيلو هايكون مين يعني ) .. المهم ماعلينا .. انا بطالب ادارة الموقع بحذف اي تعليق تكون فايحة منه ريحة الكلاب بتوع الامن اللي قاعدين ليل نهار بدافعو عن انتن كلب في الكون ..<br />هانيبال انضف من كده يا شوية معرصين .. والثورة جاية جاية .. يعني ايامكم قرب اوي اوي .. هانيبال بيقترح عليكم تحضرو طيازكم للخوازيق انتو والكلب الجربان بتاعكم اللي بياخد فيها من طوب الارض يا جزم .<br />عمكم هانيبال"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

[[comments]]
order = 31
subject = "اتحاد الكورة و هانيبال"
author = "الاخ العزيز قائد ثورة التصحيح هانيبال"
posted = "2006-07-04"
text = "شكرا يا اخي علي سبابك بدون وجة حق و هذا للاسف ناتج عن التربية القذرة نتيجة النظام الفاسد الذي لا يقبل الراي و الراي الاخر الاخ مسمي نفسة هانيبال انت عارف هانيبال يعني اية يا استاذ بلاش اقولك . طلب يالوحديد من قائد الثورة الكلمنجي يقولنا اية بالظبط اللي عاوزة و بيحلم بية بعد اسقاط النظام الفاسد.يقولن بسلامتة عمل اية لخدمة اسرتة و الحي اللي بيسكن فية يا جماعة ان اللة لايغير ما بقوم حتي يغيروا ما بانفسهم اخي العزيز هانيبال ابدا التغير من داخلك اولا"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

