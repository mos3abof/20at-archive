[[comments]]
order = 25
subject = "مصري (صناعة صيني)"
author = "ابو كرتونة"
posted = "2006-07-02"
text = "شفت اخر نكته(الشباب العاطل رايح يشتغل في الصين<br />بس ديه مش نكته ده حقيقي<br />لا تكاد تخلو دوله في العالم الا وتجد بها شحاتين مصريين بيشحتو عقود عمل<br />نحن كمن نبيع المياه في حارة السقايين.. شبابنا العاطل عن العمل يتوجه إلي الصين للبحث عن فرصة وكأن بلد المليار و200 مليون مواطن أقفرت من العمال والفنيين. ونحن المصريين الذين يبلغ عددنا سبعين مليونا سوف ننقذهم ونحل لهم أزملة العمالة!! أي منطق هذا أو أية نكتة.. لكن المثل الشعبي يقول: \"إيه رماك علي المر؟! قال إللي أمر منه\"!! ضاقت بشابنا السبل وأوصدت في وجهه أبواب دول الخليج البترولية التي تفضل العمالة الآسيوية من الهند وباكستان والفلبين. فبدأ يذهب أو يجرب دولا جديدة.<br />حاول شبابنا الهروب إلي الدول الأوروبية عبر ليبيا ومنها إلي ايطاليا ففشلت محاولاتهم وماتوا غرقا في البحر أو سيقوا إلي السجون.. ومع الفشل المتكرر الا انهم مصرون رغم أنهم يعلمون مصيرهم مقدما.. يبيعون ما لديهم من متاع أو يقترضون لدفع عشرة آلاف أو 15 ألفا لتاجر النخاسة الذي ينصب عليهم.. يأخذ فلوسهم ويتركهم في عرض البحر أو تضبطهم السلطات الليبية.. وهكذا!!<br />الشباب المتعلم ذوو الخبرة الذين يجيدون اللغات الأجنبية والذين تتوفر فيهم شروط صعبة هم الذين يسمح لهم بالهجرة إلي أمريكا أو كندا وكلتا الدولتين تستقبلهم بترحاب ومع الخبرة الموثقة يحصلون علي فرص عمل مناسبة.<br />الحكومة تتحدث عن توفير فرص عمل للشباب وتعلن كل يوم أرقاما. وحتي لو صحت هذه الأرقام فانها لا تمثل قطرة من بحر.<br />لماذا؟<br />لأن عدد العاطلين غير المؤهلين يزداد كل عام.. فالجامعات والمدارس والمعاهد المتوسطة تدفع إلي السوق سنويا مليون شاب دون تدريب. أو تأهيل وبالتالي ينضمون إلي العاطلين.<br />ما لم يكن هناك برنامج مخطط ومدروس لتدر<br />اقرأ بقية التعليق .."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

