[[comments]]
order = 10
subject = "انتوا بتتكلموا فى ايه؟"
author = "بنت البلد دى..!!"
posted = "2006-06-29"
text = "انا مش فاهمة انتوا بتقولوا ايه كده...؟<br />اولا الاخ اللى عايز يعمل ثورة ده؟<br />انت عايز الناس تخرج تعمل مظاهرات علشان يقتلوهم وفى الاخر نرجع كلنا بخفى حنين ونقول ياريت اللى جرى ماكان<br />ولا الاخ سمير اللى مش عاجبه الفلاحين ولا الصعايده<br />ليه هو انت منين يا اخ؟<br />اتحداك ان قدرت تقول ان اصلك لاهو فلاح ولا صعيدى<br />اسأل ابوك ولا جدك ياشاطر هما مين وبعدين ابقى تعالى اتفلحس علينا<br />وبعدين شكلن نسيت ان الفراعنة اللى عملوا الحضارة العظيمة دى كلها كانت مهنتهم الزراعة فلاحين يعنى<br />ولا عايز تقوللى انك مش عارف ان سعد زغلول ومصطفى كامل وطلعت حرب ومحمد فريد وغيرهم وغيرهم كانوا فلاحين واولاد فلاحين<br />طب سيبك من دول<br />خليك ياسيدى فى احمد زويل ومجدى يعقوب والعقاد وطه حسين ونجيب محفوظ<br />ولا مش عارف الناس دى كمان؟؟<br />ها..لسه مصمم ان الفلاحين والصعايدة مابيفهموش"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

[[comments]]
order = 11
subject = "هانيبال يرد على بنت البلد"
author = "هانيبال"
posted = "2006-06-29"
text = "وحياة ابوكي يا شيخة تبعدي انتي وتروحي تتعلمي الطبيخ او روحي شوفي الغسيل شكلو محتاج فمين من ايديكي اللي عاملين زي قمعين سكر من بتاع مصانع نجع حمادي .. لما الثورة مش هي حل لمشكلة مصر الابدية الازلية يبقى ايه هو الحل يا ماما؟؟؟ .. انتي شكلك كده جاهلة وجاية تتفلسفي بس انا برضه هاكون حنين معاكي وافهمك واحدة واحدة يمكن ربنا يسهل وتفهمي حاجة .. مشكلة مصر مش مبارك ولا كمال الشاذلي ولا صفوت عزيزة ولا جمال ولا اي واحد ابن وسخة لواط من عصابة مبارك لعنة الله عليه وعلى اهله الى يوم الدين .. المشكلة ان اي حاكم لمصر بيطمع في الناس ومش بيحترمها وبيعمل اللي هو عايزه سواء اللي هو عايزه ده كويس ولا مش كويس .. لو كان كويس اهو الناس بتستفيد ولو مش كويس اهي الناس زي مانتي شايفة كده .. ده مرض في الارض المصرية زي البلهارسيا كده يا اختي لو كنتي سمعتي عنها يا روح ماما يا نوغة .. وعلاجه مش انقلاب عسكري زي بتاع الخمسينات كده وادينا شوفنا نهاية الحكم العسكري ايه سواء في مصر او في اي بلد تانية .. ولا احتلال امريكي زي اللي حصل مع صدام واديكي شايفة يا حبيبتي ان العراق حالها يصعب على الكافر مبارك .. ولا اغتيال الحاكم زي ما عملو في السادات لان السادات اتظرف من هنا جه مكانه واحد العن منه ييجي خمسين الف مرة بدون مبالغة .. الحل هو ان الناس يقلعو وينفخو عضلاتهم ويقفو كلهم في يوم ماطالعلوش شمس على دماغ مبارك ويقولو احنا مش عايزين دين امك .. بالذوق او بالعافية هاتسيب العرش وتتحاكم زي احقر تاجر بانجو او سمسار اعراض نتن .. وبكده يبقى الحاكم عرف ان دي نهاية الظلم ويبقى عبرة لكل من يحاول انه يلعب بديله في المستقبل يا شاطرة .. مبارك بذل كل الجهود والاموال والدماء اللي يمكن بذلها في سبيل انه يوصل الناس لحالة الخنوع والضع<br />اقرأ بقية التعليق .."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

[[comments]]
order = 12
subject = "لو عايز مصر تبقى أحسن بلد يا ابن البلد .. يبقى مش دة اسلوب الكلام المن"
author = "Samirium"
posted = "2006-06-30"
text = "أولا احب اعرفكم بنفسى .. أنا اسمى سمير محمد نجيب وبحب مصر زى ما اى واحد تانى بيحبها وعموما دى حاجه لا يوجد اختلاف عليها .. انما الموضوع وما فيه ان ما ينفعش علشان اخد حقى لنفسى او لبلدى انى اتكلم باسلوب يضيع منى حقى دة يعنى مثلا لو واحد فى خناقة علشان خبطتة عربية وهوة راكب عربيتة جابتلة فانوس ورفرف انة يقعد يزعق ويشخط وينطر وينتهى الحال فى القسم والظابط يقفل الدنيا ولادة يدفع حاجه ولا اللى عربيتة باظت ياخد حاجه غير انه ضيع وقته لذا فقد رايت ان اسلوب ابن البلد المحترم \"هانيبال\" لا يقال علية الا اسلوب هتلر يا عم ده يمكن هتلر كان احسن منك شوية على الأقل ما كنش بيشتم زيك ودة اكبر دليل على اللى بشتكى منة \".. مشكلة مصر مش مبارك ولا كمال الشاذلي ولا صفوت عزيزة ولا جمال ولا اي واحد ابن وسخة لواط من عصابة مبارك لعنة الله عليه وعلى اهله الى يوم الدين \" وخد دى كمان..\"الحل هو ان الناس يقلعو وينفخو عضلاتهم ويقفو كلهم في يوم ماطالعلوش شمس على دماغ مبارك ويقولو احنا مش عايزين دين امك .. بالذوق او بالعافية هاتسيب العرش وتتحاكم زي احقر تاجر بانجو او سمسار اعراض نتن\" والموضوع دة مكتوب فى رد على مقالة \"صباحك عسل يا ريس\" وأظن انه من المفروض حذف الرد دة وكمان اتخاذ قرار بالنسبة للأخ اللى كتب الرد علشان دى اسمها اذية لولاد البلد كلهم لأن ممكن اكون اول مرة ادخل الموقع اقرا الرد دة ما خشش الموقع تانى ولا ايه يا ولاد البلد ... وعلشان ما هضمش حقكوا انا من وجهة نظرى الشخصية الموقع دة من احسن المواقع اللى موجودة على الأنترنت حاليا ويا ريت نشوف احسن من كده كمان وكمان ... بالتوفيق"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

