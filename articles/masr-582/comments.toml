subject = "الى هانيـبـــــــــال..انت100%"
author = "ssss"
posted = "2006-07-03"
text = "الأخ الكريم هانيبال انت مصرى وطنى100% وكلامك فى الصميم وسليم 100% بس لى رجاء عندك بلاش الألفاظ الخارجة المحرجة عشان تبقى المتعة فى قراءة تعليقاتك 100%..اوعى تزعل انا مش قد زعلك ياعم..الرجاء التانى اكتب تعليقاتك اذا كانت طويله على مرحلتين حتى نتمكن من قراءتها كلها لأن الموقع فبه مشكله فى استكمال التعليقات ولا يظهرها<br />لكن بجد انت رائع ويعجبنى كل ما تقوله لأنه بيعبر عن شعورنا كلنا"
