[[comments]]
order = 16
subject = "الثورة .. الثورة .. الثورة .. مبارك مفاصله سايبة والنعمة"
author = "هانيبال"
posted = "2006-07-01"
text = "والنبي يا جماعة وكل من له نبي يصلي عليه ..<br />اولا ..<br />مطلوب التخلص من قادة العصابة الاتي اسمائهم..<br />1 صفوت الشريف ( عزيزة سابقا )<br />2 جمال مبارك ( عشان نشطب ونخلص بقى )<br />3 احمد عز ( عشان نحرم جمال من كيفه )<br />4 عاطف عبيد ( مع ملاحظة منظر شفايفه )<br />ثانيا..<br />يجب الدعوة لثورة شعبية شاملة في كل محافظات مصر ومهما تكن النتائج وعشان تستريحو يعني من الاخر كده حسني مبارك لابد وتابت ومش هايطلع ولا بالطبل البلدي يعني الكلام مفيش منه فايدة ولا عايدة .. قوة الشعب هي اللي هاتغير البلد دي وتغير شخصيتها الازليه الابدية المكتوبة على قفا اهالينا من ايام سيدنا عكروت .. وما تخافوش لان مبارك اللي عامل فيها اسد هو المحروس ابن امه كان هربان يوم الخميس بتاع القضاة والخميس اللي بعده بتاع القضاة برضه .. كان هربان برة البلد والله العظيم .. وما رجعش غير لما اطمن ان الموضوع عدى على خير .. وبالنسبة للاخوة اللي بيكتبو شعر وهجاء وكده .. احب اقولهم ان الكلام مع الاشكال الكافرة دي مالوش لزمة .. يعني لا بيصد ولا بيرد وده عبط وهبل وقلة حيلة .. عايز تعمل حاجة يابابامنك له بطل تكتب شعر خالص اليومين دول ( مش هاتموت يعني لو ماكتبتش شعر ) وعشان اريحكم ماينفعش تقول لواحد عنده هبوط حاد من الجوع ( ولا وردة بلدي فيها عطر مصر ) واحسن ليك ولينا تلم اصحابك وحبايبك وجيرانك وتاخدهم في احضانك وتشرحلهم وتعرفهم وتبصرهم وتسخنهم ( ممكن مثلا تشتري الجرايد المحترمة وتديها للناس دول يقروها .. ده لو انت مش بتعرف تتكلم ) عشان هوب كرسي في الكلوب الليلة تتلم ونحصد مصر في اوانها قبل ما الغلة تموت وتعفن واحنايالله حسن الختام نموت من الجوع او ناكل بعض ( لاحظ ان الناس مش طايقين بعضهم وكله من الحرمان ) .. وواحدة واحدة نمسح الايام السودا باس<br />اقرأ بقية التعليق .."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

[[comments]]
order = 17
subject = "لغة حوار ولاد البلد"
author = "ابو شريف"
posted = "2006-07-02"
text = "هل اصبحت لغة حوار ولاد البلد تحمل كل هذه الشتائم والسباب بالفاظ لاتصلح الا لأولاد الشوارع وليس لأولاد البلد ... ياسيد هانيبال من حقك ان تعترض علي سياسة الحكومة وسياسة حسني مبارك وانا معك ولكن ليس من حقك ان تكيل الشتائم والسباب وكأن هذا الموقع اصبح عبارة عن حارة في منطقة الباطنية .. وبعدين ايه حكاية ان اللي مش معاك يبقى مش بيفهم حاجة خالص يعني انت اصبحت فهمي بتاع مصر كلها وانت المرجع الاساسي في السياسة والاقتصاد وبعدين تلوم علي حسني مبارك وقانون الطوارئ بتاعه اعتقد لو الزمن جار علي المصريين اكثر وظلمهم اكثر واكثر وجعلك انت رئيس للجمهورية ستجعلنا نتندم علي ايام العز بتاعة حسني مبارك علي الأقل هو سامح فإختلاف الرأي بصرف النظر عن انه بيعمل بهذا الاختلاف او لا لكن المهم انك تقول رأيك فياريت يا اخي الفاضل تنتقى الفاظك شوية ، وبالنسبة للأخ اللي بيقول ان الفلاحين والصعايدة مابيفهموش ياريت يقولنا هو اساسا منين في مصر - إلا إذا كان الباشا واخد الجنسية المصرية قريب -"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

[[comments]]
order = 18
subject = "هانيبال يرد على ابو شريف"
author = "هانيبال"
posted = "2006-07-02"
text = "انا مصري حاسس هموم الناس .. شايف الدنيا كلها بتجري واحنا بنرجع بضهرنا .. طلعنا برة كل كل حاجة وقلعنا كل حاجة ومش فاضل غير اننا نتحول كلنا لتجار اعراض عشان نقدر نلاقي لقمة ناكلها .. اذا عرف السبب بطل العجب .. بص يا اخويا في صورة ابن المرة المتناكة اللي فوق وانت تعرف مين السبب .. بص فيها كويس وانت تعرف ان كلامي ده مش عيب والفاظي اللي مش عجباك هي اللغة المناسبة للكلام عن العرص ابن العرص اللي صورته فوق .. احنا مش محتاجين رئيس جمهورية ولا زفت ولا محتاجين نفكر الرئيس اللي جاي هايعمل ايه ولا هايهبب ايه .. احنا محتاجين ثورة .. ثورة .. واسال شعب رومانيا وغيرها من البلاد اللي غيرت حكامها بالارادة والفعل .. بالثورة .. طيب انا راضي ذمتك .. مش الثورة هي الحل ؟؟ يا رجالة كل واحد يجهز نفسه الثورة جاية قريب اوي .. وكل الناس هاتعرف مبارك على حقيقته لما يهرب من البلد زي الفار الغرقان واحتمال كبير يعمل لجوء سياسي لاسرائيل مش لامريكا حتى .. مين بقى شايف ان الثورة هي الحل ؟؟<br />هانيبال"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705074558/http://masr.20at.com:80/article.php?sid=582"

