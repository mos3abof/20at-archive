author = "مسلم و كلى فخر"
posted = "2009-06-17"
text = "\"ياخسارة.. استيقظنا فى الدقيقة 95 من حلم جميل\"<br />ده فعلا اللى حسيت بيه بعد الماتش ما خلص و على الرغم أنى خرجت بعد الماتش مع أصحابى علشان أشترى حاجه إلا إنى كنت طول الوقت متضايق جدا و مافقتش إلا بعد وقت طويل<br />أنا طالب مصرى فى أمريكا و معايا طلبه برازيلين … تخيلوا يا جماعه انهم بعد الماتش ما حاولوش حتى يفتحوا السيره معايا لأنهم حاسسين إن إحنا كنا عاليين أوى عليهم<br />فى ادقيقه 88 المعلق فى التليفزيون الأمريكى بيقول أنا مش عارف مبن اللى ممكن يكسب و ده دليل إن إحنا كنا ند قوى للبرازيل<br />ربنا يوفقكم يا رجاله ياللى رفعتم راسنا أدام كل الناس<br />و أن شاء الله نشوفكم فى 2010 … على فكره ده كلام أصحابى الجنوب أفريقيين اللى بيدرسوا معايا هنا"
archived = "2009-12-31"
