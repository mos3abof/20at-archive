author = "ابن السعودية"
posted = "2008-11-15"
text = "يا ريم يا بنت السعودية يا بنت بلادي من نجد الابية<br />بلاش عنصرية فبنت الحجاز ايضا سعودية … وبلادنا اسمها المملكة العربية السعودية وليست ( مملكة نجد السعودية )<br />عقليات من العصر الحجري للاسف ما زالت تعيش بيننا وحسبي الله ونعم الوكيل"
archived = "2009-04-16"
