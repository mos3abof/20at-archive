subject = "طلاب الازهر"
author = "طلاب الازهر المعتقلون اعتقلوا تقربا للحبيب بوش يعنى علشان يظهر الحاكم انة بيكرة الاسلام والمسلمين"
posted = "2007-02-09"
text = "وانة علمانى<br />يقوم يبقى من المرضيين عنة<br />عيال وبتلعب كراتية طيب ماهو فرق من الداخلية عددهم لا يقل عن 50 الف باللباس المدنى بيلعبوا كراتية وجاهزين لضرب المظاهرات فى الشوارع<br />طيب هما الامريكان حموا شاة ايران الكلب بتاعهم<br />لعبة خسرانة خسرانة<br />والنصر فى النهاية للشعب"
