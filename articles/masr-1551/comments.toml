subject = "هكذا يحكموننا"
author = "مقهور"
posted = "2007-02-07"
text = "هكذا تحكم مصر بالدولة البوليسية العسكرية .. والله مايحدث حرام.. وسيحابهم الله على كل هذا .. انهم طغوا فى الارض وعاثوا فيها فسادا فسبحان المنتقم الجبار .. انهم يفعلون الموبقات فىظل حماية الحكام .. ولكن دوام الحال من المحال.. ومصيرهم اسود باذن الله ..ولن تدوم هذه الامور .. وكفاناظلما .. انهم لايشعرون بنبض المواطن ولا مشاكله التى فاقت كل حد .. لنا الله .. وسنرى فيهم يوما قريبا ان شاء الله .. .. .."
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208164318/http://masr.20at.com:80/article.php?sid=1551"

