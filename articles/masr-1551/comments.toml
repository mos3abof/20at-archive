[[comments]]
order = 14
subject = "ليه ليه ليه"
author = "ليه مبارك مش عايز يسيب الحكم ويبقى فيه تداول سلمى للسلطة يعنى النهاردة مبارك عنده 83 سنة وطبعاً شكله باين عليه بين الحيا والموت لو الراجل ده كان قلبه على البلد كان ها يعين نائب ليه أو يعمل تداول سلمى للسلطة هو كرسى الحكم ده من أملاك أبوه علشان يفضل قاعد عليه رغم تزويره للإنتخبات والشعب كله عارف إنه غير شرعى فى الحكم وبيستهبل وعايز يورث الحكم للإهبل منه المدمن هما يعنى علشان قدروا يسرقوا البلد وينهبوا خيرها فاكرين أنهم ممكن يورثوا الحكم"
posted = "2007-02-10"
text = "العيب والعيب والعيب على الإخوان إللى سايبين مبارك وإبنه ومراته يعملوا فيهم كده وساكتين مش عارف ليه الشعب كله بيقول لهم إحنا إختارناكم قيادتنا ليه الصمت على إللى بيحصل مستنيين لما مبارك يصفيكم نهائى ويبقى الشعب مالوش قيادة بعد كده علشان يورث الحكم للإهبل إبنه<br />لا لمبارك الغير شرعى لا للتوريث نهائياً نعم للتداول السلمى للسلطة"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210053215/http://masr.20at.com:80/article.php?sid=1551"

[[comments]]
order = 15
subject = "الشاطر فى حماية الله العلى القدير"
author = "الشاطر أمام القضاء العسكرى وتنهب فلوسة وتغلق مشاريعه ويعتدى على حرمة منزله وممتلكاته الشخصية واللى غرق العبارة يهربوه بره مصر بفلوسه ويعيش متنعم فى إنجلترا بلد الهانم سوزان وطبعاً كده معروف مين إللى هربه ودفع كام علشان يتهرب"
posted = "2007-02-10"
text = "الشاطر امام المحكمة العسكرية واللى ضرب الناخبين وقتل منهم 11 لازال حر طليق ومحمى طبعا كلنا عارفين بمين بسوزان مبارك بعد لما بقى مناسبها<br />الشاطر امام المحكمة العسكرية واللى سب الأسلام والمحجبات محمى طبعاً كلنا عارفين بمين بسوزان مبارك التى لا تمت للإسلام بصلة والتى تنتمى للإنجليزية من أصول يهودية<br />الشاطر اما المحكمة العسكرية ونصف أعضاء مجلس الشعب مزورين وتجار مخدرات وتجار بضائع فاسدة ومحميين طبعاً كلنا عارفين بمين بسوزان مبارك وأبنها إللى بياخد منهم نسبة على تركهم يفعلون ما يشاء<br />طبعاً كده كلنا عارفين إن نكبة مصر هو مبارك وعائلته وزوجته على وجه التحديد وإبنه والحل الوحيد هو الثورة على هذا الفساد والإطاحة به ثم حكم إنتقالى وإنتخابات جديدة ودستور يحمى للمصرى كرامته<br />اللهم طهر مصر من مبارك اللهم كما رأينا فيه حلمك أرنا فيه آيات غضبك بما فعل فى المصريين الذين أوصيت عليهم فى كتابك العزيز اللهم آمين يارب العالمين"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217224959/http://masr.20at.com:80/article.php?sid=1551"

[[comments]]
order = 16
subject = "إلى إدارة الموقع الكريم"
author = "هادى الحبشى"
posted = "2007-02-11"
text = "إلى إدارة الموقع الكريم<br />نرجوا إتاحة الفرصة والتعبير الصادق عن كل المعارضة فإنتم تهاجمون المعارضة فى الوقت الذى تفسحون فيه الفرصة كاملة للحزب الوطنى ولمبارك وإبنه<br />نرجوا تطهير الموقع من اللينكات القذرة التى تضيفها واحدة عجزت عن فرض سطوتها على الموقع فتحاول إلهاء الشباب بهذا الفساد الحقير وهذه السياسة البلهاء<br />نرجوا إتاحة الفرصة لكل المعارضة للتعبير عن أرائها فى هذا الموقع المحبب لنا كشباب والذى نجد فيه فرصة للتعبير عن رفضنا للفساد<br />نرجوا عدم الهجوم على الإخوان المسلمين حيث أنهم المعارضة الأكثر تأييداً من الشباب"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217224959/http://masr.20at.com:80/article.php?sid=1551"

