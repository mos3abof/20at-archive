[[comments]]
order = 1
subject = "هو الشاطر احسن من مين"
author = "هو الشاطر احسن من مين ؟"
posted = "2007-02-06"
text = "احسن من ايمن نور والا احسن من عصمت السادات والا احسن من الاف غيرة<br />المحكمة جاهزة والقاضى اياة بتاع نزاهة القضاء جاهز بالحكم وكلة ماشى<br />وفى السجن هيعلموة ينام ساعة ويصحى ساعتين ويقف فى الطابور ساعتين علشان يحصل الجراية واليمك<br />ويغسل الحمامات والطرقات بجردل ومقشة<br />ابتسم انت فى مصر"
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208164318/http://masr.20at.com:80/article.php?sid=1551"

[[comments]]
order = 2
subject = "الابيض والاسود"
author = "ياء"
posted = "2007-02-06"
text = "هناك فرق بين من يرتدى اللون الابيض وبين من يرتدى اللون الاسود<br />اكتر حاجه بكرها فى حياتى اللون الاسود<br />سعات ينزل على قلوب الناس وعقولهم يخليهم طغاه<br />صلاح جاهين ليه رباعيه بتقول<br />فتحت شباكى لشمس الصباح<br />مادخلش منه غير عويل الرياح<br />وفتحت قلبى عشان ابوح بالالم<br />ما خرجش منه غير محبه وسماح<br />اهو الاخوان كده<br />النهارده لما مكتب الارشاد اعلن ان برنامج الحزب المدنى حيصدر خلال الشهر الحالى اتحول الاخوان اللى افرج عنهم القضاء الى محاكم عسكريه<br />حسبى الله ونعم الوكيل ... نعم المولى ونعم النصير<br />انا كل يوم اسمع ... فلان عذبوه<br />اسرح فى بغداد والجزاير واتوه<br />ما اعجبش م اللى يطيق بجسمه العذاب<br />واعجب من اللى يطيق يعذب اخوه<br />وعجبى<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/<br />لا مواخذه يا جوليت مينفعش ابقا روميو ممكن تقبلينى عنتر"
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208164318/http://masr.20at.com:80/article.php?sid=1551"

[[comments]]
order = 3
subject = "احنا بتوع الاوتوبيس"
author = "ميدو"
posted = "2007-02-06"
text = "الواحد حاسس انه بيشوف فيلم احنا بتوع الاتوبيس بس المرة دي مش سينما والا فيديو داحنا انتقلنا من مقاعد المتفرجين الي ممثلين كل شعب مصر ينتظر دوره للتمثيل فى الفيلم كمعتقل طبعا مش سجان وحسبنا الله ونعم الوكيل"
archived = "2007-02-08"
