[[comments]]
order = 4
subject = "ها يروح فين"
author = "الشاطر امام القضاء العسكرى طيب مبارك يروح أمام أنهى قضاء اللى:"
posted = "2007-02-07"
text = "قاتل السادات<br />زور الإنتخابات ويحكم بدون شرعية ولا قبول شعبى له ولا لعائلته<br />نهب أرصدة مصر من سياحة وبترول وعاز طبيعى وقناة السويس<br />عمالة لليهود والأمريكان<br />نهب خيرات مصر وباع المصانع وأنتشرت البطالة<br />أفرج عن عزام عزام الجاسوس الإسرائيلى ويتشفى فى سجن أيمن نور وطلعت السادات وقيادات الإخوان المسلمين<br />أمواله كلها وأموال عائلته من النهب والفساد والمتاجرة بقوت الشعب<br />لم يظهر الفساد والوحل مثلماً كان عصر مبارك الفاجر<br />نريد محاكمة مبارك أمام محكمة من كل فئات الشعب ليأخذ منه كل أبناء الشعب حقوقهم المنهوبة<br />حســـــــــــــــــــــــــــبى الله ونعم الوكيل"
archived = "2007-02-08"
capture_url = "https://web.archive.org/web/20070208164318/http://masr.20at.com:80/article.php?sid=1551"

