text = "سمعت مره(اللى يبص للقمر كتير ينسا كتير)!!!!<br />انا نفسى ربنا يرزقنى بقمره سواء زوجه اوبنت…<br />انا بحب القمر جدا بلونه الابيض الرمادى الصافى…او بلونه المعتم الذى يدل على الغموض والهيبه<br />ومش هنسا اقول لكو ان القمر مازال اسطوره ملموسه فى حياتنا…"
archived = "2010-02-17"
capture_url = "https://web.archive.org/web/20100217174654/http://www.20at.com:80/20at/lifestyle/8118.html"

