[[comments]]
order = 3
subject = ""
author = "فتاة مصرية"
posted = "2008-01-27"
text = "من زمان ومشهور واللى سايد فى المجتمعات المصريه ان القمر ابيض وصفاء وده لاننا بننظر له من على الارض وهو على بعد ولكن لو قربنا له مش هنحب اننا نتشبه بيه لكن عموما الناس بتشبه البنت بالقمر على انه ابيض واغلبيه المصرين يروا ان الجمال فى الوجه الابيض وايضا فى النفس النقيه زى(البفته البيضه) وده من وجه نظر اغلبيه المصرين وخصوصا القرى والمناطق الريفيه والفلاحين بيحبوا يشبهوا البنت بالشكل ده وده على ما اظن له علاقه بالفراعنه لان زمان كانوا لما بيحبوا يشبهوا حاجه كانوا بيرسموها"
archived = "2010-02-17"
capture_url = "https://web.archive.org/web/20100217174654/http://www.20at.com:80/20at/lifestyle/8118.html"

[[comments]]
order = 4
subject = ""
author = "نيفين نيفى نوفا"
posted = "2008-02-04"
text = "اولا يا منى الموضوع تحفه و فعلا خدت منه معلومات اول مره اعرفها<br />و بطبعا احلى و اغلى سلام لهوووووووووووبه<br />هوبه انتى وحشانى و عايزين نتكلم علشان تحكيلى تفاصيل الموضوع الاخرانى اللى فرحنى ده..عارفاه طبعا ..اللى بالى بالك<br />مستنيه صدفه حلوه تجمعنا و نبقى اونلاين كالعاده<br />بالنسبه للموضوع يا منى انا عن نفسى لما بسمع كلمه يا قمر اكيد بفرح لانها مرادف طبيعى عندنا لكلمه يا جميله<br />بس ف مره غيرت رايى بعد ما قرات خاطره كتبها كامل الشناوى و قال فيها انه كان بيغازل واحده جميله جدا فقال لها :اراهنك ان الشمس ف شنطه ايدك فقالت له ازاى فقالها انتى فى شنطتك مرايه فقالت له طبعا فقالها بصى ف المرايه هتشوفى الشمس<br />و فعلا لاننا لو عرفنا ان القمر اللى سر جماله ف نوره انه بيستمد نوره من الشمس يبقى المفروض ان الجميله تتوصف بالشمس اولى..و اكيد كلنا فاكرين اغنيه صباح شمس و قمرين لما كانت بتغنيها على بنت وولدين اخوات<br />بس على راى هوبه محدش متعود يقول لواحده جميله يا شمس لكن كتير بيتقال يا قمر<br />مساله تعود مش اكتر"
archived = "2010-02-17"
capture_url = "https://web.archive.org/web/20100217174654/http://www.20at.com:80/20at/lifestyle/8118.html"

