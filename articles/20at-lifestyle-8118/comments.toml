order = 0
subject = ""
author = "اضيع من قمر الشتاء"
posted = "2008-01-26"
text = "امممممم بصي انا اول مره اخد بالي بحكايه الشمس دي والتشابه بيها والعفه وسمو الاخلاق زي ما بتقولي<br />بس علي اعتبار ان وراء كل عظيم امراءه فالشمس هي الراجل والقمر هو الست فاهمه اقصد ايه ما علينا<br />بردو القمر ليه حلوته القمر بنبصله في الشتاء والصيف وبنحب نبصله اما في الحر مبنصش للشمس ولاه بنطقها سيان في الشتاء او الصيف , كمان الرسول قال للسيده عائشه تعوذي بالله من شر هذا الغاسق اذا وقب \" القمر \"لكن لما كان يشوف هلال او قمر كان يقول \"اللهم اهله علينا باليمن ولايمان والسلامه والاسلام ربي وربك الله \" وبعدين لما اجي اوصف واحده اقولها انتي زي الشمس شكلها بايخ<br />انا مش عارفه الصراحه انا مع مين كل واحد وليه معني بس القمر الناس اتغزلت وفيه اكتر علي العموم سلام يا قمر<br />هووووووووووبه"
archived = "2010-02-17"
capture_url = "https://web.archive.org/web/20100217174654/http://www.20at.com:80/20at/lifestyle/8118.html"

