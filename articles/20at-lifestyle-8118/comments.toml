text = "هاي يأحلى صبايا وأحلى شباب عنجد ما في شي أحلى من القمر وخاصة بس تشبه حبيبتك بالقمر بتكيف ولا لأ ؟ أكيد بتفرح لأنو ما في شيي أحلى من القمر صح هيه كلمة من زمان بيقولها بس أحلى كلمة غزل هيه كلمة (يا أحلى قمر )حتى بالأغاني كتير بيستخدمو كلمة القمر"
archived = "2010-02-17"
