author = "كلام فارغ"
posted = "2010-01-14"
text = "اية حكاية النوبة دى<br />اسرائيل بتنفخ فيها لية من خلال اقباط المهجر<br />النوبيون 100 % مسلمون وموحدون باللة وبيتكلموا عربى كويس جدا ونسوا اللهجة القديمة بتاعتهم<br />والحكومة ما قصرت وقالت اللى عايز يرجع يرجع على ضفاف بحيرة ناصر تانى<br />الحكومة سمحت بالعودة<br />ولكن ولا واحد عايز يرجع يعيش تانى على ضفاف البحيرة فى وسط العقارب والثعابين<br />كلهم مبسوطين جدا فى نصر النوبة وفى القرى الجديدة التى بناها ناصر لهم فى ادفو واسنا وفى كل قرية مدرسة ووحدة صحية وكهرباء من الستينات وقبل وجة بحرى<br />اللى بيتكلموا باسم النوبة دول شوية عيال متحالفين مع اقباط المهجر واسرائيل وبياخدوا تذاكر طيارات من مخابرات دول معينة وبينزلوا فى فنادق 5 نجوم ويهيصوا فى اوروبا وامريكا ويحضروا ندوات ويتكلموا عن القضية النوبية ويعملوا تشويش وخلاص<br />اللة يرحمك يا صلاح نصر<br />لو كنت عايش كنت جبت العيال دول فى اشولة وزكايب وصناديق ورمتهم فى سجن الواحات<br />احيانا بتبقى القسوة مطلوبة وخصوصا مع الاوباش"
archived = "2010-01-16"
capture_url = "https://web.archive.org/web/20100116015600/http://www.20at.com:80/masr/news/14877-2010-01-14-14-07-15.html"
