[[comments]]
order = 6
subject = "خربوكى يا مصر"
author = "مظلوم"
posted = "2006-12-04"
text = "الجرائم البشعة التى وقعت فى مصر مؤخرا والتي ارتكبتها عصابة من المشردين باغتصاب وقتل أطفال الشوارع بطرق بشعة وصلت لدرجة إلقائهم أحياء من فوق اسطح القطارات المسرعة!! هذه الجرائم وأعداد الضحايا الكبيرة، لو حدث هذا فى بلد يحترم آدمية الإنسان لقامت الدنيا ولاستقال وزير الداخلية فورا بل والحكومة كلها ولان وزير الداخلية فى مصر مشغول بما هو اهم من فض المظاهرات بالقوة والأمن السياسي وحبس المعارضين، فكل ما يحدث خلاف ذلك لا يعنيه والدليل انه على بعد امتار من مكتب سيادته بوسط القاهرة يوجد اكبر تجمع للمشردين ومراهقين من الجنسين يعيشون حياتهم على الارصفه بل تفاصيلها والفتيات منهم يحملن اطفال رضع.<br />سلوى الكيال- القاهرة<br />نقلا عن صفحة اراء حره بموقع bbc<br />فضيحه ومصيبه بكل المقاييس ولو كان للمصريين تمن لقامت الدنيا على راى الاستاذه صاحبة الرساله ولكنهم عبيد الاحسان فى عزبة الحراميه والسفاحين عليه العوض ومنه العوض"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206023946/http://masr.20at.com:80/article.php?sid=1246"

[[comments]]
order = 7
subject = "اقدم مستوطنه في التاريخ"
author = "اعتقد ان اول تعليق يسخر من المقال و هذا واضح لمقارنته بما يفعل اليهود ب \"أرض الموعد\" و صراحه عنده حق، العرب \"المسلمين\" كانوا يدخلون البلاد \"التي يفتحها الله لهم\" بالجهاد يعرضون ثلاث خيارات ١- الإسلام ٢- الجزية ٣- الحرب"
posted = "2006-12-06"
text = "الفقراء في مصر وقت ان فتحها العرب \"المسلمين\" اختاروا الإسلام، الأغنياء اختاروا الجزية ليتمكنوا من البقاء مسيحيين لان مصر كلها في هذا الوقت كانت مَسيحيين \"قبط\" بالرغم من ان الجزية كانت مبلغاً كبيراً من المال يدفع لل \"الخليفة\" في مقابل التمتع بحماية ال \"فاتحين\" و هذا الكلام مثبت تاريخياً .<br />ارجوا ان يتسع صدر مسئولي المدونة و لا يقومون بحذف تعليقي و أن كان لن يلقي ترحيب بعض زوار المدونة. و شكراً"
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210222815/http://masr.20at.com:80/article.php?sid=1246"

[[comments]]
order = 8
subject = "خفيف الدم"
author = "اي جزية كبيرة يا خفيف الدم اللي بيدفعها أغنياء الأقباط"
posted = "2006-12-06"
text = "اذا قارنت يا خفيف الدم بين مسلم عنده 10000 دينار ونصراني عنده 10000 دينار : الجزية كانت دينار واحد (هأقول حتى 50 دينار عشان خاطرك يا خفيف الدم ( لكن المسلم هيدفع زكاة هتاخدها منه الدلوة حوالي 250 دينار<br />واذا كان كل واحد منهم عنده 100000 دينار : برضه النصراني هيدفع 50 والمسلم هيدفع 2500 يا خفيف الدم<br />يبقى الأرخص انه يفضل على نصرانيته مش يخش الاسلام يا خفيف الدم"
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210222815/http://masr.20at.com:80/article.php?sid=1246"

[[comments]]
order = 9
subject = "طيب ليه"
author = "السؤال هنا هو ليه الجزيه من الاساس ، هو ربنا بياخد فلوس مقابل ان الانسان ميدخلش فى دينه !!!!!! ايه رشوه يعنى لا سمح الله"
posted = "2006-12-08"
text = "وبعدين فين الاختيار الحر هنا طيب افرض حد معندوش الخمسين ولا الدينار حتى اللى بتقول عليه ده وعاوز يفضل على دينه يعمل ايه ، ولا هيقتلوه ، هى دى بقى الحريه ؟؟<br />ووحياتك متقولش الرد الياه اللى سمعته كتير ان الجزيه دى مقابل عدم اشتراك غير المسلمين فى الجيش و خلافه ، طيب ليه عدم الاشتراك فى الجيش من الاساس ولا ( الفاتحين) غير واثقين فى اهل البلد التى فتحوها؟ ، واذا كانوا فتحو البلد لنشر الامن...الخ اذا لم عدم الثقه ، بالعكس عدم الثقه هذه تعكس ان العلاقه بين الفاتحين و اهل البلاد التى دخلوها لم يكن على ما يرام."
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210222815/http://masr.20at.com:80/article.php?sid=1246"

[[comments]]
order = 10
subject = "طيب ليه - تكمله"
author = "ايه علاقه الدين بالفلوس من الاصل حد يفهمنى ، وحتى فى كلامك ليه المسلم المفروض انه يدفع زكاه تاخدها الدوله ، مش المفروض ان دى يدفعها المسلم طواعيه و تبقى بينه و بين الله. وكما يدفع النصارى و اليهود العشور."
posted = "2006-12-08"
text = "مش فاهم دين ايه اللى بحسابات المكسب و الخساره ، الرد فى مجمله غير منطقى يا عزيزى و يسىء للمسلمين باكثر مما يدافع عنهم."
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210222815/http://masr.20at.com:80/article.php?sid=1246"

[[comments]]
order = 11
subject = "موضوع مؤسف للغايه"
author = "مجدى سمعان"
posted = "2006-12-08"
text = "ارى ان الموضوع موجه بصوره ما الى زاويه محدده ، فالموقع بشكل غير مباشر يريد ان يوصل صوره للمسلمين تقول انظروا الاقباط يكرهونكم الاقباط ينظرون لكم كغزاه<br />ولا داعى للتحزلق بالكلمات الرنانه من نوعيه الامانه فى نقل الخبر او الحياديه فى نشر الموضوعات بصوره مجرده ، لماذا يطل علينا الموقع بمثل هذه الموضوعات من وقت لاخر والتى ثبتت بالتجربه انها لا تفيد اللهم الا مشعلى الفتن و العداءات الدينيه<br />ومع الاسف نجحت هذه المساعى الى حد ما فاشتعلت نيران التعصب بين القراء و اندفع كل يدافع عن وجهه نظره سواء بصوره محترمه ام لا.<br />مع الاسف الموقع الذى يدعى الوطنيه و يبغى الاصلاح يعمل على نشر الفتنه الدينيه بين اهل الوطن الواحد<br />الا اذا كان هذا هو هدفه المستتر ، واذا كان الامر كذلك فارجو ان يغير الموقع اسمه الى جماعه ولاد البلد ويجعله بالتسجيل وفقا لشروط محدده كاحترام دين وفكر واحد وازدراء كل المعتقدات والاديان الاخرى كى يرحمونا و يرحمو انفسهم من الردود و القيل و القال.<br />ارجو ردا مقنع حول هذه النقطه."
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210222815/http://masr.20at.com:80/article.php?sid=1246"

