[[comments]]
order = 16
subject = "رد مؤسف للغايه"
author = "مجدى سمعان"
posted = "2006-12-08"
text = "خساره كنت فاكر ان هناك اصحاب عقول ممكن الكلام معاهم و النقاش ولم اجد الا المتعصبين و الكارهين و الجهلاء الذين يرددون كلام لقنه اياهم اصحاب المصالح من جماعات متطرفه فيا صاحب( مصر لم تكن فى اى يوم مسيحية ) كفى مغالطات اى معمار الذى تفوق به العرب على الفراعنه انظر الى اثار الفراعنه و انظر الى شبه الجزيره العربيه و التى لولا الثروه النفطيه لظلت حتى الان تعيش فى الخيام ، واى طرز يا جاهل التى تتحدث عنها انظر حتى الى الصوره المرفقه فى المقال اهذه اقرب الى كنائس الغرب ( والتى اشك انك تعرف شكلها حتى تتحدث عنه) ام اقرب الى تصميم المساج القديمه ، لان الاصل الذى بنى و صمم الاثنين هو المصرى و ليس العربى ساكن الخيام ، معروف يا جاهل ان الفن و المعمار فى الامبراطوريه الاسلاميه كانت مراكزه فى بغداد و دمشق و مصر و هى من الاصل بلاد صاحبه حضارات قديمه و متقدمه فى فن المعمار من قبل ان يسمع العرب عنه ، عموما الكلام معك لا يفيد"
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210222815/http://masr.20at.com:80/article.php?sid=1246"

[[comments]]
order = 17
subject = "سفاله"
author = "اقروا هذا المقال وجدته لشىء اسمه صلاح الدين محسن بعنوان ( اختبار جديد للحريات في مصر ) :"
posted = "2006-12-09"
text = "ميعاد الاختبار هو يوم 16 من ديسمبر القادم .. لنري نتيجة حكم القضاء في حق احدي الأقليات الدينية في مصر في التواجد ، أو منعها من حقها !! انها طائفة البهائيين .. وهم بضعة آلاف من المصريين يعدون علي أصابع اليد الواحدة .. من اجمالي 77 مليون مصري .. ولكنهم يسببون حالة من الهياج والجنون للاسلاميين لشدة خوفهم علي الاسلام .. ربما لأنهم يدركون تماما أن الاسلام من الصعب أن يبقي بينما يوجد دين آخر يمكن أن يكشف حقيقته بسهولة ويؤدي الي ذوبانه وتبخره ..! لذا فالاسلام منذ بدايته يعمل علي القضاء التام علي أي دين آخر وان وجد فانه يلزم أتباعه بالعيش محصورين مذلولين مهانين كي لا يتزايدون وانما يتناقصون باستمرار ..<br />وقد وصلنا بالبريد الالكتروني تلك الرسالة عن ميعاد نظر المحكمة الادارية العليا بمصر يوم السبت 16 من ديسمبر الجاري في دعوي حق معتنقي الديانة البهائيةفي الحصول علي أوراق رسمية دون الاضطرار الي نفاق المجتمع بزعم أنهم مسلمون أو مسيحيون (!) فهذا ما يريده منهم جماعة الاخوان المسلمين بمصر !! وباقي الجماعات الاسلامية الارهابية ..<br />فتري ماذا سيكون قول العدالة والجالسين علي منصتها ؟ وهل يعيشون معنا بالقرن الواحد والعشرين عصر الحريات الدينية وحقوق الانسان والعلاج بأشعة الليزر؟ أم<br />يعيشون عصر محمد ، الذي كان يقاتل ويقتل الذين كفروا كما قال بقرآنه، ويقول أيضا بقرآنه : لكم دينكم ولي دين (!!!!!)محمد المعالج ببول البعير وحبة البركة ..(!)<br />.. وهل سيكون سيادة القاضي ، أحد الأعضاء أو المتعاطفين مع جماعة الاخوان المسلمين ؟!!! أم سيكون من القضاة الذين كانوا من قبل ضباط شرطة يعذبون الشعب<br />ويسبونهم بأفحش وأقذر ال<br />اقرأ بقية التعليق .."
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210222815/http://masr.20at.com:80/article.php?sid=1246"

