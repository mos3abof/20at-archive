[[comments]]
order = 14
subject = "مصر لم تكن فى اى يوم مسيحية"
author = "مين اللى قال ان مصر فى يوم دخول عمرو بن العاص كانت مسيحية"
posted = "2006-12-08"
text = "اللى كانوا مسيحيين هم الرومان المحتلين وبعض اليهود<br />بقية الشعب كانت تعبد امون ورع وايزيس وازوريس<br />وعندما طلب عمرو بناء جامع بنى لة المصريين جامع عمرو على شكل معابد الشمس فى 95% من البناء فى ماعدا المأـذنة والمحراب<br />كانوا وثنيين يعبدون الاديان القديمة وكانوا يسموا بالاقباط اى المصريين ولا علاقة لكلمة قبطى بالدين المسيحى انما كلمة قبطى تعنى مصرى<br />ادعاء المسيحيين انهم اولاد الفراعنة كذب صارخ فية فرعون كانت عيونة خضراء كما نشاهدهم الان فى الكنائس<br />هؤلاء بقايا الرومان ظلوا مسيحين بعضهم عاد الى بلاد الرومان بعد الفتح والبعض ظل باقيا ليعمل طابور خامس كالمعلم يعقوب اثناء الحملة الفرنسية وكان مصيرة ان القاة الفرنسيون فى البحر عندما هرب معهم ربما لقذارتة ورائحتة الزفرة حيث انهم لايستحمون الا فى عيد الغطاس<br />واسلم اتباع رع وامون الموحدين بالدين الاسلامى ودخلوا فى دين اللة افواجا<br />وظل بقايا الرومان مسيحيين يبنون كنائسهم على الطراز الرومانى حتى يومنا هذا انظر الى طراز بناء الكنائس الان<br />وانظر الى المساجد الطاهرة تراها متطورة عن معابد شمس الاجداد الفراعنة باحة المسجد مكشوفة وتدخلها الشمس<br />فيا بقايا اليهود والرومان انتم لستم مصريين انتم ادعياء<br />انما المسلمون المصريين هم اولاد الفراعنة وهم السكان الاصليون فى هذا البلد<br />ومصر لم ولن تكون يوما مسيحية وليبحث شنودة وزعبوطة وخصوصا عندما يلبس زية التهريجى كانة لاعب فى سيرك ويضع شيئا مضحكا على راسة واسود يجيب الاكتئاب<br />بلاش مسخرة كل قبطى كلب مش عاجبة البلد يغور فى ستين داهية"
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210222815/http://masr.20at.com:80/article.php?sid=1246"

