subject = "تحول غالبية المصريين الى الاسلام"
author = "محمد"
posted = "2006-12-04"
text = "ياجماعة نحن مصريون ابا عن جد وبدخول الاسلام على يد العرب كان خير معين لنا على ظلم الرومان فى ذلك الوقت ورساله الاسلام رساله كامله لايشوبها شى ولا تقدس وتدعى على الله ماليس به سبحانه وتعالى عما يصفون ومن التسامح اننا نتعايش مع كل الاديان وما يدعيه البعض من استعمار<br />هو جهل بالحقيقة فنحن دخلنا فى الاسلام طواعيا دون ادنى اكراه وانصح اخواننا ان يحكموا العقل ويتعرفوا جيدا على حقيقة الاسلام بدون تعصب من قبل ان ياتى يوم لاينفع مال ولا بنون الا من اتا الله بقلب سليم ولا يقبل الله الا من اسلم وجهه لله هداكم الله الى الرشاد"
archived = "2006-12-06"
capture_url = "https://web.archive.org/web/20061206023946/http://masr.20at.com:80/article.php?sid=1246"

