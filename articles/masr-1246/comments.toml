[[comments]]
order = 23
subject = "قصيدة فتح عينك تاخد جايزه"
author = "محمد المصرى"
posted = "2006-12-10"
text = "لحد وقت قريب كنت فاكر ان الكوسه والقرع من اهم المحاصيل اللى بتتميز بيهم مصر اما بعد ماقريت خبر حصول سيدة مصر الاولى<br />سوزانكو على جايزة حقوق الانسان من برلين بالمانيا قلت فى عقل بالى بركاتك يا مبارك انت ومراتك حلت على الكره الارضيه بحالها وكنت اتمنى ان سوزان هانم تاخد معاها ( رمضان التوربينى ) وكمان بقية الشله بقو .. وبزازه ... وحماطه والسويسى اشهر عصابه لقتل واغتصاب الاطفال والمراهقين<br />ليكونوا شاهدين وخير دليل على جهودها هى وجوزها والمحروس الصغير جيمى بيه من اجل الشعب المصرى وحقوق الانسان وبالمناسبه كتبت قصيده جديده اهديها برضه لعمنا احمد فؤاد نجم وجميع الشعب المصرى الغلبان<br />فتح عينك تاخد جايزه<br />مليون جايزه كمان لو عايزه<br />بص يا محسن وانتى يا فايزه<br />ماما سوزان قال اخدت جايزه<br />جايزه لحقوق الانسان<br />المصرى المهرى الكحيان<br />هى وجوزها التور ابو ودان<br />ضحكوا على عقل الالمان<br />سافروا على العاصمه برلين<br />على حسابنا يا مستمعين<br />سايبنا عرايا وجعانيين<br />نستنى معونه واحسان<br />ارجع مصر يا ابن الهرمه<br />وهات القرشانه بنت الصرمه<br />خلى فى وشكوا حبة حشمه<br />دا بكره المستخبى يبان<br />وشوبش يا حقوق الانسان"
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210222815/http://masr.20at.com:80/article.php?sid=1246"

