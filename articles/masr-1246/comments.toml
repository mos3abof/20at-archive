[[comments]]
order = 19
subject = "الي العربي القذر اللي مسمي نفسه مسلم واللبنانية اللي اسمها فاطمة"
author = "سيدكم المصري"
posted = "2006-12-09"
text = "لا نقبل منك ايها الأعرابي الكلب اي تطاول وسب للشعب المصري الذي علمكم الحضارة من أي بلد عربي متخلف أنت روح أتشطر الأول عل الحكم اللي في بلدك ما سمعناش حد من شعوبكم المتخلفة بينتقد حكامه زي ما أحنا بننتقد مبارك مع أن حكامكم أكثر سرقة ونهب والست اللبنانية فاطمة ما تروحي الاول طالبي با لغاء الطائفية المقيتة اللي عندكم وعمل ديمقراطية حقيقية ولية ما بتتظاهروش ضد رئيسكم لحود اللي عينته سوريا خليكي في حالك وبلاش قلة أدب اذا كنا أحنا شعب نعاج زي ما بتقولي فانتم شعوب أقل من الفئران والحشرات ولعلمك مصر كان فيها مجلس شوري وانتخابات منذسنة 1866 قبل معظم دول أوروبا وقبل ما يكون في التاريخ دول الخليج وموريتانيا ولبنان بتاعتك واللي أخر الديمقراطية عندنا أنقلاب 23 يوليو اللي بنعاني من أثاره المدمرة للان مرة أخيرة ياريت تتكلموا أيها الكلاب العرب علي أنظمة حكمكم قبل ما تتطاولوا علي الشعب المصري اللي أنتم أقل من نعل جزمته"
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210222815/http://masr.20at.com:80/article.php?sid=1246"

[[comments]]
order = 20
subject = "خفيف الدم 2- ليه كانت الجزية اساسا"
author = "الصارم الحاسم"
posted = "2006-12-09"
text = "بص والله اعلم بس ده اكثر تفسير منطقي للجزية لقيته : مش مجرد لانهم لا ينضمون للجيش وان كان ده سبب ... كنوع من الضريبة يعني<br />وان هذه الضريبة دي في مجملها اقل بكثيييييييير مما كان يأخذه سواء الرومان او حتى الفرس ممن يستعمرونهم<br />ولكن السبب الأهم للجزية والله اعلم هو اعلان فرض سيطرة..... بالبلدي وعالمكشوف<br />بمعنى انه من لا يريد الاسلام فلا مشاكل على الاطلاق .. ولكن بمن ان الإسلام دين منطقي وعقلاني يؤمن به كل ذي لب وعقل يريد الحق ولا شئ سواه بدون اهواء شخصية .. وبعد كل هذا لا يريد ان يؤمن ( كما حدث في الحديث الذي دار بين مجموعة من نصارى نجران والرسول صلى الله عليه وسلم... وكانت الحجة في النهاية للرسول وكان الرد الأخير لهم انهم لا يستطيعون ترك دين ءابائهم .. اي يعلنون انهم مصدقون لكنه دين ءابائهم فلا يريدون غيره ) .... لا مشاكل على الاطلاق وليبقوا على ما يريدون ولكن ان يخضعوا لدين الله بدفعهم الجزية ...<br />هي علامة للخضوع ... ليس لاشخاص بعينهم فدين الله به العدل والمساواة واحترام حقوق الآخرين...<br />ليس المقصود منها جباية المال في حد ذاته لان المال على عهد الخلفاء الراشدين ومن صلح ممن جاء من بعدهم كان يرد على شكل خدمات للبلاد التي تؤخذ منها نفسها ..وما يفيض هو ما يرسل للخليفةليستعين به على شئون باقي الولايات<br />طبعا هذا الكلام قد نراه الآن مخالف لحقوق الانسان ومجاف لطبيعة العالم الان ... ولكن ده ظاهريا فقط<br />لأن البديل ان لم تفرض شريعة الله سيطرتها على الأرض - اقول فرض الشريعة والعدالة التي تمثلها وليس فرض الاسلام كدين للايمان به ... البديل بالنفوس البشرية التي خلقها الله وهداها السبيلين معا ..الخير والشر...الصلاح والفساد ... العدل والظلم ...هيكون البديل ان يصد الظالمين الدعاة عن عبادة<br />اقرأ بقية التعليق .."
archived = "2006-12-10"
capture_url = "https://web.archive.org/web/20061210222815/http://masr.20at.com:80/article.php?sid=1246"

