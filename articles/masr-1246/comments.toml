author = "باسم حمودة ـ قبطي ـ مسلم ـ علماني ـ يحب الله"
posted = "2006-12-10"
text = "يا اهل مصر , مصرفي منأى عن اي فتنة ولا داعي للتطاول ع الاديان فكلٌٌ واحد بيتكلم من مصادر دينه , وان مش عايز مصر تكون لبنان اخر او عراق .. يقول الله في سورة سبأ الاية 24 \" قل من يرزقكم من السموات والارض , قل الله , وانا اواياكم لعلى هدى او في ضلال مبين \" وهكذا يكون العرض ولاداعي للجزم في تلك الامور, لاداعي للاهانات او التجريح سواء من المسلمين او المسيحين .. وارجو غلق التعليقات .. وشكرا للجميع بالرغم من ذلك ......"
