subject = "شوية عقل وبلاش هبل .."
author = "مسلم مصري عربي"
posted = "2006-12-03"
text = "العرب دخلوا بلادهم فاتحين وليسوا غزاة .. ولو ذهبت إلى الصعيد ممن يحتفظون ويؤصلون لتاريخ جدودهم حتى ألف عام خلت ستجد أنهم أعراب ومصريون وخليط من كل مكان .. ولو ظن البعض بأنهم بهذا العته سيصلون إلى شيء غير تدميرهم فسيكونوا واهمين .. ربما ستجني على نفسها براقش وغدا لناظره قريب .. رجاءً انتبهوا إلى خطورة ما تتحدثون عنه . ممكن نتحدث أكاديمي بس لكن ييجي مشلول في عقله ويفهم غلط تبقى واقعته وواقعه ناسه طين وزفت وقطران .. شوية عقل وبلاش هبل .. كلامي مفهوم ولا لأ ؟؟؟"
