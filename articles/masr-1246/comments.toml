text = "كانت تفرض الجزية علي غير المسلمين في الدولة الاسلامية مقابل عدم دخول غير المسلمين في الجيش الاسلامي لأن القتال كان يتم لرفع راية لا أله الا الله محمد رسول الله فهل عندك استعداد للانضواء والقتال تحت هذه الراية اذا كانت الاجابة نعم فلا يوجد مشكلة فقد أصبحت مسلما"
