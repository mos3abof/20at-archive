text = "هى العملية كتر فلوس - واذا كان عندهم فلوس كتير يصرفوها فى عملية توعية للشعب فى نظافة الشوارع والبيوت وفى عادة التغذية الجيدة والسليمة اذ ان عدد كبير من الاطفال عندهم انيميا من سوء التغذية رغم وضع اسرهم الجيد ماديا - يصرفوها لتوعية الناس فى عدم وضع الفراخ فى غرف النوم والمعيشة ايام الشتاء توعية الناس فى اى مجال انما الانفاق فى ابهار شوية مراهقين يجلسون امام الشاشات فى بلاهة يراقبون المعجزات التى لا يمكن ان تكون واقعية<br />lol:"
