[[comments]]
order = 1
subject = "بيرو"
text = "اعدام جوال قليل الادب...!!!<br />والله فكرة رمزية جميلة جدا خصوصا ان فيه فعلا حاجات كتيرة جدا في حياتنا اصبحت قليلة الادب بفظاعة ...<br />حاجات كتيرة زي اللي ذكرتها الكاتبة الفاضلة ويمكن اكتر...<br />عندك مثلا اعدام قرار قليل الادب....(منع الحجاب في فرنسا)<br />اعدام مفكر قليل الادب ...(هما عارفين نفسهم)<br />اعدام قوات قليلة الادب...(امريكا بتكاكي في العراق)<br />اعدام مجلس قليل الادب ..(مجلس الحكم الانتقالي بالعراق)<br />اعدام رجل بيفضح قلالة الادب( سيد قطب ومروان خوري واحمد ياسين وعبد العزيز الرنتيسي وعمر المختار ...والقائمة طويلة...<br />اعدام الاشياء:<br />اعدام زجاجة قليلة الادب...زجاجة الخمرة<br />اعدام كرسي قليل الادب ...كرسي في الكلوب ...(وهوا يروح الكلوب ليه ...قلة ادب )<br />واخيرا اعدام كرسي قاعد فوق كرسي قليل الادب...(لا داعي لذكر الاسماء وانتوا عارفين وانا عارف )"
archived = "2004-08-25"
capture_url = "https://web.archive.org/web/20040825101026/http://www.20at.com:80/article.php?sid=434"

[[comments]]
order = 2
subject = "الي بيرو"
text = "انت شايف معايا ان المفروض اننا نضيف الي قايمتك السابقة :اعدام معلق قليل الادب؟<br />تقصد مين يا ولد انت بالكراسي اللي قاعدة علي الكراسي ...<br />هنخبط في الكبار كمان ...قلة ادب!!!"
archived = "2004-08-25"
capture_url = "https://web.archive.org/web/20040825101026/http://www.20at.com:80/article.php?sid=434"

