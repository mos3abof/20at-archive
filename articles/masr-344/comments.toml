order = 0
subject = "من غير الحكام الاهلى = صفر على الشمال"
author = "احمد ميدو"
posted = "2006-05-17"
text = "هوة دة الاهلى والله ديما ياخد بطولاته كدة بالحكام مش كرة يد بس وقدم كمان وربنا يكون فى عونا فى البلد دى بلد الاهلى حكام اهلى واعلام اهلى وصحافة اهلى والظلم على عينك يا تاجر ارجع واقول ربنا ياخد كل واحد مش بيراعى ضميرة وبيظلم حد صاحب حق"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120858/http://masr.20at.com:80/article.php?sid=344&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

