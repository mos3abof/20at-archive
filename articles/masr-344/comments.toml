subject = "المدفعجي"
author = "رضوى نبيل"
posted = "2006-05-27"
text = "ليه دايما لما نتكلم عن الاهلي ونجومه نقول بركات - متعب - ابو تريكة - الحضري . وننسى محمد عبد الوهاب انا بقول ان محمد دة واحد من اهم اللاعبين في الاهلي زيه زي ابو تريكة وبركات . وانا بتمنى له التوفيق ."
