order = 2
subject = "مع احترامي"
author = "dead man"
posted = "2006-05-18"
text = "مع احترامي للجميع الاهلي مش محتاج حديجامله لانه اصلا فريق بطولات والكلام عن مجاملة الحكام ده باعتبره انه شماعه الناس يتعلق عليها حسدها علي الاهلي وان فريقهم مش عارف يبقي زر الاهلي"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120858/http://masr.20at.com:80/article.php?sid=344&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
