subject = "dead manالردعلى"
author = "zamalkawy"
posted = "2006-05-18"
text = "يا عزيزى لولا تدخل الحكامن فى جميع اللعبات لن و لم يحصل الاهلى على اى بطوله , بدليل كرة القدم فنحن نرى ان فى كل مباره يجب ان يتم احتساب ضربة جزاء للاهلى والامثله كثيره, وعندما ذهب الحمير اقصد الحمر الى اليبان شوف ايه اللى حصل"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120858/http://masr.20at.com:80/article.php?sid=344&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

