[[comments]]
order = 5
subject = "المؤامره"
author = "محمد صابر"
posted = "2006-05-24"
text = "الى الاخ احمد ميدو ردك ينم عن عقليه رياضيه فذه فعلا لان فعلا الحكام كلهم و اتحاد الكره و اليد و الاتحادات الاخرى و كل العاملين فيها و جميع الصحفيين و الاعلاميين خونه و جواسيس لصالح الاهلى وهمه السبب فعلا فى ان الاهلى بيكسب كل البطولات وبدونهم كان الاهلى مش هيكسب ولا ماتش وكان الزمالك هيكتسح كل البطولات لانه يملك احسن لعيبه فى مصر على رأى مرتدى و احسن اجهزه فنيه فى العالم و اكثر اداره مستقره ولكن المشكله فى الحكام اللى بيخسروا الزمالك و يكسبوا الاهلى و حتى لما الزمالك بيفوز باى بطوله بيكون كل الناس اللى متفقين اللى ذكرتهم فى الاول من حكام و صحفيين و اعلام انهم ميظلموش الزمالك و ميجملوش الاهلى عشان ياخد البطوله ده عشان ميتكشفوش لان مش معقوله يسيبوا الاهلى ياخد كل البطولات"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120858/http://masr.20at.com:80/article.php?sid=344&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "الاهلي فوق الجميع"
author = "رضوى نبيل"
posted = "2006-05-25"
text = "لما قال المرحوم صالح سليم الاهلي فوق الجميع مكنش قصده لعبة كرة القدم وفريقها بس لكن كان بيتكلم عن الاهلي بكل الالعاب ، يد قدم طائرة كله . والحدق يفهم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120858/http://masr.20at.com:80/article.php?sid=344&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "تجى نحسبها"
author = "سالم العازمى"
posted = "2006-05-25"
text = "تجى نحسبها الاهلى لية عظيم الاهلى لية فوق الجميع علشان فى مجلس رائع مجلس فاهم مجلس متفاهم فى كل شى فى كل الالعاب مش كرة القدم بس الاهلى لما مخدش الدورى كام سنة مسمعناش مرة ان المجلس فية مشاكل لكن وقف وقفة معا نفسيهم وخدو قرار انا الدورى لاازم يرجع تانى لبيتة مفيش لااعب بيتكلم على مزاجة فى امور الكورة غير بستزان مفيش لاعب يدلى بحديث صحفى الا بتصريح من النادى محدش سامع اى شى عن الاهلى غير الانجذات والبطولاات والارقام القياسية وهو دة الكبير وبحبك يابوتريكةيافنان وبحبك يابركات ياساحر وبحبكم يالاعيبة الاهلى وبحبك يااهلى يانادى البطولاات"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120858/http://masr.20at.com:80/article.php?sid=344&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "الاهلى فوق الجميع؟؟؟؟؟؟؟؟؟"
author = "vip"
posted = "2006-05-27"
text = "الاهلى فوق الجميع ؟؟؟؟؟<br />و لكن من هم هؤلاء الجميع؟؟ هل هم الاهلوية ام هم شعب مصر ام العالم كله ام من<br />ان كان الاهلوية فانتم ارتضيتم لانفسكم الهوان ليكون نادى كورة و لعب فوقكم<br />و لكننا لن نرضى بذلك فان القرءان و الاسلام فوق الجميع وليس نادى لعب<br />يا جماعة كرة القدم ما هى الا لعبة لا يوجد منها اى مكسب سوى الالهاء عن كل ما هو مفيد"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120858/http://masr.20at.com:80/article.php?sid=344&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

