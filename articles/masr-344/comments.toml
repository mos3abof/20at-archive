subject = "بلاش كلاكيع"
author = "selim"
posted = "2006-05-18"
text = "والنبي بلاش العقد والكلاكيع اللي عندكم دي من الاهلي، الاتحاد قرر تعليق البطولة لحين ورود تقارير الحكام يعني مافيش حد مع الاهلي."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120858/http://masr.20at.com:80/article.php?sid=344&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

