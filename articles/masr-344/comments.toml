[[comments]]
order = 12
subject = "الحقد و الغل الزملكاوي"
author = "محمد فكري"
posted = "2006-06-11"
text = "كفاية غل و حقد يا زملكاوية و الاهلى مش محتاج حكام و لا غيره لان تاريخ الاهلى العالمي هو اللي بيحكي و بيقول ان الاهلى سيدكوا صاحب 31 دوري مقابل 11 للغلابة يبقى مين الاحق بلقب بطل مصرو اقريقيا و بلاش كده هو الاهلى في افريقيا برضه بحكمله حكام من مصر عشان كده بيفوز بطلو حقد و شوفوه فريقكم يمكن ربنا لاقدر الله يبعتلكوا بطوله تفكوا عن نفسكو بيها شوية . و لاعزاء للحاقدين ههههههههه"
archived = "2006-09-05"
