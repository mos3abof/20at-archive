subject = "كلب و راح"
author = "عابر القارات"
posted = "2006-03-31"
text = "إيه الدوشة اللى إنتم عاملينها دى إيه يعنى كلب و راح أقصد طبعا الشهيد و ليش الكلب لكن الشرطة خادمة الشعب لا تفرق بين كلب بيهوهو و كلب بنى أدم ... و لا عزاء للشهب المحتل لا فى العراق و لا فلسطين و لا مصر ة العزاء فقط لوالد و والدة الشاب اللذان فقدا نور عيونهما مع إنطلاقة رصاصة جبانة من رجل شرطة أجبن"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216231607/http://masr.20at.com:80/article.php?sid=99&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

