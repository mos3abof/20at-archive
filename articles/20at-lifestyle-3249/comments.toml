text = "مش عارف لما قريت الموضوع اتفقت واختلف بس انا شايف ان الحب شيئ رائع وليس من العار ان يحب الرجل امرأه ولا انت تحب امرأة رجل ولكن ارى ان كشف المشاعر هو الحاسم في هذا الامر لان المكاشفه اما ان تولد حب متبادل واما ان تنهي حب يتيم .<br />بس الله يكرمك لما نسال حد الحب نسأل حكيم واعتقد ان الناس اللى انتى اتكلمتي عنهم من كامل احترامي لهم كلهم هواه وليس منهم طبيب ليعطي الدواء ."
