author = "نجلاء"
posted = "2007-02-15"
text = "الحب ده كلمه كبييييييييييييي ييره قوى , مليانه مشاعر و مليانه رحمه , مليانه ود , ومليانه تسامح تسامح<br />المشكله مش فى الحب المشكله فى من يحملون الحب داخل قلوبهم البريئه وهم لا يقدروا قيمته ومعناه<br />لو اتكلمت عن الحب انا ممكن يكون كلامى زى الضلع المشروخ لانى مريت بتجربه حب فاشله ! بس ممكن اقول ان فشل التجربه دى اللى عايشه جوايه ومحفوره جوه ضلوع قلبى علشان واحد منا مفهمش معنى الحب اللى شيلينو فى قلوبنا<br />وجوه عيونه لانه كان امانه واحنا معرفناش نحافظ عليه لانه كان رمز لكل طيب واساس كل خير<br />يمكن كلامى مش كامل !!!! بس انا عايزه اقول ان فى حاجه اسمها حب مش بس حاجه موجوده لالالا<br />دى اسمى شعور ممكن يحس بشر وتدمع له عين<br />بس علشان انا انجرحت وربنا الحمد لله لم يرد لى العيش مع من اخترته بقلبى وكان كل كيانى وما زلت ابكى واتألم لفقدانه حتى وان فاتت شهور عديده مش هقدر اقول غير بلاش تظلمه الحب فالحب براء من حاجات كتير قوى بتحصل الايام دى<br />لو حبيت روح اخطبها عالطول لان ده تصرف الرجاله ومابيحبش غير الرجاله"
archived = "2009-12-26"
capture_url = "https://web.archive.org/web/20091226222835/http://www.20at.com:80/20at/lifestyle/3249.html"

