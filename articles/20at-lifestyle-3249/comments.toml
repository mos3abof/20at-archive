text = "الحب دة اجمل حاجة في الدنيا بس للأسف مفيش حاجة اسمها حب اليومين دول ، كله بيقضى وقت وخلاص صدقيني يا اخت ايمان حكاية الحب الطاهر دي ضاعت وسط الانحلال الى فية الشباب اليومين دول تعالى انزلى القاهرة انهاردة بمناسبة الفلانتين وخدي بالك انى بقولها بالفـــــــــــ ـــــــــــــــ ـاء استخفاف وشوفى الشباب والبنات الى سوري في الكلمة لا عاملين حساب لربنا ولا لأهاليهم تعرفى ان العالم الحالمة زيي وزيك موضة بطلت من زمـــــــــــــ ــ ـــــــــــــــ ــــان والولاد بيبصوا ليهم كأنهم كائنات من الفضاء الخارجي لكن الأمل في ربنا كبير لأن الطيبون للطيبات ."
