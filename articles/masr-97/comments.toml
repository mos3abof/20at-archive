[[comments]]
order = 0
subject = "الله عليكى يا حماس"
author = "عارفين النشيد ده"
posted = "2006-03-30"
text = "الله عليكى يا حماس تسلم اديكى يا حماس<br />رفعتى راسنا كلنا من بعد خوفنا وذلنا<br />ثبت خطاكى ربنا واحنا معاكى وكل الناس"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023001/http://masr.20at.com:80/article.php?sid=97&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 1
subject = "مسلمه"
author = "الحقيقه بس انا كنت عايزه اقول ان سواء عمر افندى كان ملكنا او خصخصناه كده كده مسروق ومنهوب"
posted = "2006-03-31"
text = "العاملين فيه من اكبرهم لاصغرهم بينهبوا فيه بشكل اجرامى وساعة الجرد كان بيتم تلبيس التهم فى الشباب اللى شغال بصفه مؤقته ولسه معرفوش اللى فيها وهكذا<br />لكن اللى بيحصل فى البلد ده طبيعى خلاص..... احنا ربنا يرحمنا وينجينا منهم ومن شرهم وفساده<br />اللهم ردنا الى دينك مردا جميلا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023001/http://masr.20at.com:80/article.php?sid=97&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"
