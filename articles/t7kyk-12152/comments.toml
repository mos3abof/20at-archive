text = "الاخت الفاضلة كاتبة المقال - لغتنا هى العربية ويجب ان نكتب بالعربية وليس بالعامية<br />كل الشعوب تحترم لغتها<br />رجاء الكتابة بلغة عربية مبسطة مثل لغة الجرائد<br />عنوان المقال مكتوب بالعامية - لماذا ؟<br />مع وافر احترامى وتقديرى لكتاباتك المتمزة - وفقك اللة<br />مع وافر احترامى"
