author = "جميله"
posted = "2009-07-08"
text = "انا كل اللى بقدر اعمله انى اجلس لوحدى وابكى جدا واشعر وكانى نفسى احطم الشخص اللى ضايقنى وبيبقى نفسى اضرب حد اوالحائط ولكن مش بقدر غلشان ماحدش ىحس بيا لانى مش بحب حد يعرف انه قدر يكسبنى بانى وصلت للحاه دى بسببه اصلى دمعتى غاليه عليا جدا جدا لمجرد ماحد يشوفنى وانا بغيط بحس انى ضعيفه وبتخنق اكثر ومش بحكى لحد من عائلتى او اصحابى علشان بحاف يفتكرونى ضعيفه ولانى ما تعودتش على انى احكى مشلكلى لحد ودى اول مره احكى مشاكلى لحد يمكن علشان معرفكوش عايزه حل ارجوكم وطبعا زودت خنقتكم"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123150944/http://www.20at.com:80/masr/hot-topics/9939.html"

[[comments]]
order = 8
subject = ""
author = "علاء خلف احمد - قنا"
posted = "2009-10-13"
text = "انا لما بكون مخنوق بضحك . بدور على اصحابي اللي بحبهم والناس اللي بيحبوني علشان لما بكون معاهم برتاح بحس اني فأمان معاهم . بحب أرجع للطبيعه للهدوء . كمان انا ممكن أمشي في الشوارع اشوف الناس بتعمل ايه ؟. بص وانت ماشي على الناس البسيطة وشوف هما عايشين حياتهم إزاي . شوف البساطة بتاعت شعب مصر اللي فعلا بيحب مصر وانت اكيد هترتاح كتير وهتعرف انك انت عايش في نعيم وكل الخنقة ديه ولا حاجة دول بس شوية دلع شوية علشان تشوف في حد مهتم بيك ولا لأ ."
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123150944/http://www.20at.com:80/masr/hot-topics/9939.html"

