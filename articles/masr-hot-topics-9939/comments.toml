posted = "2008-08-27"
text = "باعتبار ان معظم الوقت خنقه من المجتمع ومشاكله من جهة ومن المشاكل اليومية من جهة اخرى فلا بد لتناسي الحزن والكابة معظم الوقت الا ان يطفح الكيل وفي هذا الوقت اتجه الى قراءة القران او الصلاة او الجلوس على الشاطئ لالقي ما على عاتقي في اجواء البحر الذي هو بمثابة الام الهائجة<br />محمد علاء الدين"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123150944/http://www.20at.com:80/masr/hot-topics/9939.html"

[[comments]]
order = 5
subject = ""
author = "مش عارف اقول ايه في اخوة الوطن"
posted = "2008-08-27"
text = "صلعم = صرمة لكل عربي مسلم<br />وفي قول آخر<br />صلعم = صابونة لكل عربي مسلم<br />والله أعلم<br />ظهر الحق<br />وحدوه<br />لا أللات إلا هوووووو , حموشي اتجوز مرات اخوه هههههههه<br />وادي كمان وحده<br />صلعم = صدمه لكل عربي مص لم هههههههه<br />صلعم = صحيفه لكل عربي مص لم<br />صلعم = صهريج لكل عربي مص لم<br />صلعم = صاروخ لكل عربي مص لم<br />صلعم = صحن لكل عربي مص لم<br />صلعم = صخره لكل عربي مص لم<br />حد ايزود يا اخون هههه<br />_______________ ___<br />وقال لها ملاك الرب ها انت حبلى فتلدين ابنا و تدعين اسمه اسماعيل لان الرب قد سمع لمذلتك وانه يكون انسانا وحشيا يده على كل واحد و يد كل واحد عليه (تك 11:16)"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123150944/http://www.20at.com:80/masr/hot-topics/9939.html"

