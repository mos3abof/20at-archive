author = "الى مدير موقع عشرينات"
posted = "2008-08-26"
text = "الى القائمين على هذا الموقع<br />كلمة (صلعم) تكثر في مواقع سبابين وشتامين النبي محمد صلى الله عليه وسلم كمواقع اقباط المهجر<br />ويقولون الرسول صلعم الله عليه (عليكم لعنة الله)<br />فكلمة (انتبهوا الى هذه الكلمة) ويرجى حذفها واليكم فقرة من موقع معاني للنبي محمد صلى الله عليه وسلم<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />كله بسبب الرسول محمد (أصلع = صلعم) الأرهابي الجاهل الأهبل الي (الذي)ما يعرف إلا القتل وتقطيع الأعضاء و الخمر واللبن و الجنس مع الغلمان والحريم (النساء) ذوات العيون السود الوساع. والله لو أنه شاف(رأى) الأوروبيات وعيونهم الزرق والشعر الأشقر كان غير مواصفات حور العين الي(التي) وصفهم في قرآنه الخرافه تقول أنه يصف بدو يـات في بلاد الرمال. جنـته كلها خمر وسكر وجنس وخلاعة وعربده مع حور العين والورعان (الغلمان)، و يـن الأخلاق يا محمد الأصلع = صلعم!! جنـته فقط للرجال نسى الغبي يلفق (يؤلف)جنه للنساء<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــ<br />يرجى من الاخوة في موقع عشرينات الانتباه لكلمة (صلعم)<br />وشكرا<br />وشكرا"
