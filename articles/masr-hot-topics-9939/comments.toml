posted = "2008-08-26"
text = "زميلى العزيز<br />لا نقصد اية اهانة لاى رسول او اى دين<br />لكن لو رجعت لكتب و زارة التربية و التعليم لوجدتهم علموننا هكذا و كانو يكتبونها هكذا ايضا<br />العيب ليس منا و لكن العيب و كل العيب لوزارة التربية و التعليم التى علمتنا الخطاء<br />مرة اخرى تقبل عميق اسفى لك و لجميع الاخوة مما اسائوا الفهم<br />و اشكرك على تعليمى المعنى الصحيح<br />انا حقا اسف فسامحنى باللة عليك<br />وليغفر لنا اللة و سامحنا انة غفور رحيم كريم مستجاب للدعوات"
archived = "2010-01-23"
capture_url = "https://web.archive.org/web/20100123150944/http://www.20at.com:80/masr/hot-topics/9939.html"

