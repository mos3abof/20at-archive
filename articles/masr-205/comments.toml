[[comments]]
order = 5
subject = "اللعبه"
author = "ربيع"
posted = "2006-04-28"
text = "هل يلعب احدكم الشطرنج<br />اللاعب المحترف في هذه اللعبه يحسب كل احتمالات الخصم<br />واحيانايعطيك نقله معينه لها رده فعل معينه هو يدفع خصمه لها حتي ينقل نقله اخري تؤدي ال كش مات<br />اعتقد ان هذا ما فعلته الحكومه<br />فهؤلاء الصبيه في المعتقل من قبل احداث الاسكندريه<br />معلش اشطحوا معايا بخيالكم<br />واعتبروني مختل عقليا<br />مش ممكن الحكومه هي اللي مدبره حكايه اسكندريه<br />تحصل زوبعه يحصل قلق<br />تتطلع الداخليه بيان ترعه المنصوريه<br />الناش تتلخم اكتر<br />ومش قللناكم يا جماعه<br />لازم نمد قانون الطوارئ<br />شوفتم البعبع هيكلكم لو مكنش في قانون طوارئ<br />تخيلوا في واحد صحبي قللي مش ممكن تكون احداث دهب صنيعه الحكومه<br />ليه؟<br />برضه عشان قانون الطوارئ<br />الظاهر ان البلد كلها لسعت معاهم<br />يا تري في مكان فاضي في العباسيه"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120244/http://masr.20at.com:80/article.php?sid=205&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

