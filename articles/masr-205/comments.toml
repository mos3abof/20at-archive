[[comments]]
order = 0
subject = "اين الفائده"
author = "مسلمه"
posted = "2006-04-20"
text = "والله انا مش شايفه اى فايده فى الموضوع ده<br />كل اللى هيحصل انهم هيزودوها ويقولو اهه الداخليه بتقول على المسلمين انهم ارهابيين وبتوع تنظيمات<br />تفتكر ليه مفهمش حد مسيحى<br />دول بيولعوها زياده وهى مش ناقصه<br />اللهم انصر المسلمين فى مشارق الارض ومغاربها"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120244/http://masr.20at.com:80/article.php?sid=205&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

[[comments]]
order = 1
subject = "ميش شفافية"
author = "مواطن مطحون"
posted = "2006-04-21"
text = "احب اطمن الشعب المطحون واقوله ان مفيش حد هيصدق بيانات الحكومة لان حكومتنا المباركة عمالة تتكلم عن الشفافية, الشفافية لحد ما احنا كرهنا الكلمةوبرضه ماحدش مصدق حاجةولازم احنا كلنا نكون فاهمين ان كلام الحكومة كله فشنك وان الجماعة اللى بيقولوا عليهم ارهابين دول شايلنهم فى جراب الحكومة كل ما يحتاجوهميطلعوهم يخضوا بيهم الناس وبعد شوية بقدرة قادر نلاقيهم سيطروا عليهم وقبضوا على كل اعضاء الجماعة ويطلع المسئول يقول الامن مستتب"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120244/http://masr.20at.com:80/article.php?sid=205&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

[[comments]]
order = 2
subject = "الطائفة المنصورية...وترعة المنصورية"
author = "ابو ابراهيم"
posted = "2006-04-22"
text = "والله يا حاج حسين يا ابن عمي انني لم اعد افرق بين الطائفة المنصورية , وترعة المنصورية , ولا بين سلوك الحكومة الطارىء ومفاجاتها التي تخرج لنا كل يوم من الكوارث والنكبات ما هو بطارىء , فالحكاية طويلة ولم تعد تنطلي حتى عوام الناس , فالخالة تفيدة بتاعة الجرجير بشارع كراته تعلم علم اليقين ان حكومتنا لا حماها الله ولا ابقاها لا تتورع عن الكذب , وانها تفوقت على ابو لمعة الاصلي , بعد ان استوردت لنا- كمان- ابو لمعة التايواني وابو لمعة الامريكاني عملا بتعميم الكذب الدولي , وقانون تفشي الكذب المزمع اقراره من هيئة الامم العامة للكذب , لتدويله وعولمته وتسويقه .<br />وحكاية الطائفة المنصورية - ان صح لسانحكومتنا - الله اعلم الله ...اعلم... انه ينتمي لجماعة من صيادين السمك اللي كانوا قاعدين يترزقون على باب الله على ترعة المنصورية , واظنهم - والله اعالم ببطن حكومتنا ووزير داخليتنا - ينتمون الى بلدة كرداسة- وما ادراك ما كرداسة وناسها - الذين اضنتهم البطالة , واعياهم السؤال عن العمل , واكيد انهم كانوا يمرون على الترعة املا في صيد كيلو او اتنين كيلو من القراميط التي لاتكون الا في هذه الترع الصغيرة , وكانوا يقومون با فعالهم الخفية ساعة الفجرية , الامر الذي جعل قراميط المنصورية يتقدمون بشكوى جماعية يشتكون فيها هؤلاء من ازعاجهم في الساعات الصباحية التي يحلو لهم النوم فيها حتى العصرية , وخاصة ان وزير الوقاف - والذي يقف دائما باوقافه الغنية مع الداخلية - امر بوقف اذاعة اذان الفجر في الميكروفونات حتى لا يزعج البشوات والسوبر باشوات , ولذلك استجاب وزير الداخلية لشكوى قراميط المنصورية , وامر جميع قواته النايمة والقايمة والنص نص , بالقبض على صيادي المنصورية , والاستجابة لشكوى القراميط , لاننا بنحب ح<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120244/http://masr.20at.com:80/article.php?sid=205&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

[[comments]]
order = 3
subject = "فصبرا جميلأ"
author = "أسامة الكفراوى"
posted = "2006-04-26"
text = "بسم الله الرحمن الرحيم (فصبرا جميلا والله المستعان على ما تصفون) فى ظل الظروف الصعبة التى يعش الشعب المصرى اظلم سنوات حياتة فى ظل حكم مستبد لا يعرف لا صوتة المغرور ولا يمسع باراء الشعب نقوال لكل اخواننا المصرين لا تحزنم فان بعد الضيق الفرج ودائما مهما طال الليل لابد من طلوع النهار نحن جميعا نشعر بالاسى والحزن فى ظل نظام استبدادى لا يهمة الامصالح ابناءة وشركائة من المرتشيننقوال لا اخواننا فى السجون لا تحزونا فقريبا الفرج ونقوال لمن قتلهم النظام الحاكم اما بعملية خسيسة مدبرة والله لن يضيع دمائكم هباء وماذا ننتظر من رئيس اتى السلطة عن طريق الخيانة والغدر بمن امنة وهو السادات اصبروا ياشعب مصر فتحريينا اتنى لا محالة وسحاسب المسئوال اين كان عن السنوات الظلماء فى حياة مصر انا معكم اننا نسير من ظلمة الى ظلمة اكثر وان الوضع فى مصرنا يزدا سواء ولكن مصر اكبر من كل ذلك سنفديكى يامصر باروحنا وابنائناوكل جزء منناوانا متاكد ان الشباب المسمى بالطائفة المنصورة ما هم الاكبش فداء لاافعال حسنى رفاقة واعلموا ياشباب انتم لستم الاوائل من ضحيا ء النظام ونود ان تكونوا اخرهم واخيرا لا نقوا الا حسبنا الله ونعم الوكيل فهو اعدل من الكل وهو اقوى من الكل اذا لايضيعنا الله ابدا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120244/http://masr.20at.com:80/article.php?sid=205&PHPSESSID=e287e911e8f20a53edc33dc3449af170"

