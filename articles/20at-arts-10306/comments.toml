text = "اثني على كل الجهود الرائعة بس اقترح ان تنصب عاضات تلفزيونية كبيرة توزع في زوايا بارزة من الموقع تعرض مشاهد من المسلسل ليستمتع الجمهور ويعيش الواقعية بكل جوانبها وانا زرت مع عائلتي ثاني يوم وصولي دمشق الحبيبة<br />اكررالثناء وهيك سوريا بلد الانجازات والابداعات عامرعمران العراق بغداد"
