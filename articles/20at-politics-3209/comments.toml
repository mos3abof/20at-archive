[[comments]]
order = 2
subject = ""
author = "بحريني"
posted = "2007-02-11"
text = "هناك العديد العديد من الاغلاط الفادحه في الفلاش :<br />اولاً: الذي ارسى المسجد الحرام هو ابراهيم عليه السلام و ليس آدم و هذا مذكور في القرآن و أي حديث يتعارض مع القرآن يكون موضوع بطبيعة الحال ( و يسمى اسرائيليات)و هذا الامر معروف.<br />تاريخياَ لم يكن هناك مساجد قبل النبي محمد (ص) فكيف يمكن ان يبني سليمان (ع) او يجدد مسجد<br />اذا كان هناك تحويل للمسجد الأقصى فالقصد من ذلك بناء مبني و ليس بقعه لذلك فالمسجد المحول هو المسجد الاقصى الذي تسمونه المسجد القبلي و اذا المذبح فوق الصخره فلم الحفريات بأسفل المسجد و البقعه المباركه.<br />هذه كل ملاحظاتي"
archived = "2009-07-10"
capture_url = "https://web.archive.org/web/20090710023153/http://www.20at.com:80/20at/eshtbak/3209.html"

[[comments]]
order = 3
subject = ""
author = "كاتب الموضوع"
posted = "2007-02-12"
text = "الاخ الكريم بحريني<br />السلام عليكم ورحمة الله وبركاته<br />ما ورد في القرآن حول سيدنا إبراهيم عليه السلام قول الحق سبحانه \" وإذ يرفع إبراهيم القواعد من البيت وإسماعيل\" وهذا معناه أن قواعد البيت كانت موجودة \" بمعنى اساسات الكعبة\" وسيدنا ابراهيم رفعها مع ابنه اسماعيل عليهما السلام<br />وهذا ما يؤكده حديث النبي صلى الله عليه وسلم ، فعن أبي ذر الغفاري رضي الله عنه قال: قلت: يا رسـول الله: أي مسـجـد وضع في الأرض؟ قال: المسجد الحرام. قلت: ثم أي؟ قـال: المسجد الأقصى. قلت: كـم بينهما؟ قـال: \"أربعون سنة\" رواه البخاري ..<br />وقيل في تفسير الطبري : إن آدم أول من بناها، وقـيل: شيث بن آدم، وكانت قبل بنائه خيمة من ياقوتة حمراء يطوف بها آدم.<br />أرجو ان تكون الصورة واضحة الآن ."
archived = "2009-07-10"
capture_url = "https://web.archive.org/web/20090710023153/http://www.20at.com:80/20at/eshtbak/3209.html"

