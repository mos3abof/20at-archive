text = "يعجبني في مصر طبقة الفهلوية اللي ظهرت جديد كده وبتعرف تجيب القرش وبتستغل تغفيل الشعب المصري وهبله وعبطه ونخص بالذكر ما يجري على قناة موجه الفضائية واستغلال حاجه الناس وسرقة نقودهم عن طريق الاتصالات<br />وعلى سبيل المثال المفتش كرومبو وسرحان ونفيسه وبايره اللي حتجوزكم كلهم وشبكة العروس<br />بص اتصل على رقم (…) من اي تليفون ارصي<br />او رقم (…) من اي تليفون محمول<br />سرقة الشعب المغفل بطريقة مبتكره وفريدة<br />وعلى ما يبدو ان مفيش حكومة تقول عيب كده"
archived = "2009-05-26"
