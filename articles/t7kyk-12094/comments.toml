subject = ""
author = "مخيمر السيد - دقهلية"
posted = "2009-05-17"
text = "كلة مات او بيطالع فى الروح<br />النهضة اللى عملها محمد على واولادة وطلعت باشا حرب ابو الاقتصاد المصرى الذى انشأ بنك مصر ومصانع المحلة واستوديو مصر ثم خلفة ايام عبد الناصر ابو الصناعة فى مصر المهندس عزيز صدقى ——- كل ذلك ضاع ايام الحزب الوطنى ولجنة السياسات التى تضم اولاد الباشوات سابقا وكبار المحتكرين - كل اللى عملتة الاجيال ضاعت<br />النشاط الوحيد الباقى فى مصر هو المعمار<br />النشاط والتنمية فى مصر كلها ماتت الا فى قضية المعمار فالمعمار يلزمة سراميك وعندنا عشرات الشركات فى السيرميك - وصناعة الطوب الطفلى والرمل والزلط ومصانع الاسمنت ومصانع الحديد - حديد التسليح وطبعا بعنا مصانع الاسمنت ثم تاتى صناعة الابواب والشبابيك والخشب والالمنيوم وادوات الحمامات والخلاطات<br />اى نهضة فى مصر ماتت<br />باقى انشطة المعمار<br />وزارة الصناعة تم الغائها والحقت بالتجارة<br />لا توجد اى تنمية<br />كلة فى المعمار<br />واعلانات الجرايد عن الشقق حول ملاعب الجولف وطبعا للاثرياء العرب<br />مصر ايها السادة استلمها مقاول هدد شغال بالهدد والازالة لكل الصناعة فى مصر وتفرغ للمعمار<br />مصر تحت ايدى مقاولى الهدد<br />خليهم يهدوا فيها"
archived = "2009-05-26"
capture_url = "https://web.archive.org/web/20090526215132/http://www.20at.com:80/t7kyk/12094-2009-05-17-13-37-19.html"

