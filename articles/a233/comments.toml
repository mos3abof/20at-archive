text = "ايوة هو ده اهم شئ ان نراقب انفسنا و ان نحاسب نفسنا الاول و بعد كده نقول مين الغلطان و مين المقصر و مين اللي بيتحكم في رأيناو ايه اللي مضيع وقتنا<br />رقابة ايه و بتاع ايه المهم اننا نفكر في المستقبل و التطور اللي مش عارفين هانلحق به امتى!!!"
