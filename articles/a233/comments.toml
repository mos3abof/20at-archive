[[comments]]
order = 1
subject = "محتاجين رقابة ذاتية"
text = "أظن أننا لو اتعلمنا منذ الصغر، فى المدارس و البيوت ازاى نعبر عن اراءنا بحرية، و اتعلمنا الصح من الغلط، طبعا مش اقصد ايه الصح و الغلط من وجهة نظر الحكام، أكيد مش هانكون محتاجين رقابة من حد، يعنى ماينفعشي تشيعوا السطحية فى مناهج التعليم، و يطلع الواحد من الجامعة ليقف فى طابور البطالة، و لما يوصل للاربعين يبكي على فوت قطار الزواج بلا رجعة، وبعدين تقولوا عايزين رقابة علشان دول ما ينحط أخلاقهم، تفتكر أنت لو عندك فراغ ، و ما حدش علمك الصح من الغلط، هتقضي يومك ازاى، اللى عايز يتفرج ادامه الدش، و الافلام الاباحية التي تباع دون رقيب أو حتى السديهات اللى بتتسرب و تتنسخ بدون رقابة<br />يا خلق هو، ربوا اولادكم كويس و اطلقوهم بعد كدة، وصدقونى، مش هنحتاج لاي رقابة و لا يحزنون<br />و سلام"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616082850/http://www.20at.com:80/article.php?sid=233"

[[comments]]
order = 2
subject = "الحرية"
text = "الحرية تصحح نفسها ، بمعنى إن إلغاء الرقابة يفتح الباب لوجود تيارات إبداعية محترمة تنمي الذوق العام ؟ ثم غن فيه اعمال فنية قدمت بذكاء لا يخدش الحياغء مشاهد المشاعر الانسانية وده مش عيب .. لكن الرقابة ستحد من الإبداع .. وستجعل الطريق واحد من اتنين يا إما تغطية يا إما انحلال والابداع هو خيار ثالث له عدد لا حصر له من الاختيارات اللي ممكن تكون محترمة"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616082850/http://www.20at.com:80/article.php?sid=233"

[[comments]]
order = 3
subject = "رنين الحب"
text = "بسم الله الرحمن الرحيم<br />ياجماعه لازم رقابه لان الشىء بدون رقابه يبقى سايب فى سايب يعنى اللى عايز الرقابه تتشال يبقى نشيل الحكومه ونشيل الام والاب من البيت والمدرسين من المدرسه والمديرين من الشركات ياجماعه كل شىء له حدود ولازم كمان نبقى مراقبين لانفسنا وبكده مش هانتعب .<br />رنين الحب"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616082850/http://www.20at.com:80/article.php?sid=233"

