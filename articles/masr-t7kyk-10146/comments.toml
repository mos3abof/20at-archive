author = "متغاظ"
posted = "2008-09-25"
text = "الاخت مروة والله حرام عليكى انك تقرانى صوت النقشبندى بصوت شرين شتان والله بينهما فالنقشبندى هو او ما نسمية نحن النور المسموع فكيف يقارن بهذة المطربة او حتى عبد الوهاب نفسة اما عن الموضوع عادى يعنى لان احنا اكيد فى مصر زى ما بتقول شرين فعلا كل الموزان والقيم انقلبت فى هذا البلد وبقيت قدوتنا شرين والهام وغادة ومنى وكل هولاء الفاسيدن فى الارض ونسينا دينا وشيخوخنا العظام امثال محمد رفعت والنقشبندى وطوبار وغيرهم كثيرا ممن انارو الدنيا بكلام الله العظيم حسبى الله ونعم الوكيل"
archived = "2009-10-12"
capture_url = "https://web.archive.org/web/20091012024712/http://www.20at.com:80/masr/t7kyk/10146.html"
