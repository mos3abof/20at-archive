author = "احمد"
posted = "2008-09-25"
text = "اولا دول مش داعين انما دول ادعياء وان ربك لبالمرصاد وكل بتوع التلفزيون المصري دول حسابهم عسير<br />الحاجة بقى اللي منتبهتوش ليها ان كل الادعية دي بتتقال على خلفية موسيقية<br />طي ازااااااااااي حد يفهمني<br />اللي عايز اقوله بقى ان بعد المسخرة دي ميجوش يزعلوا ويقولوا الغزو الوهابي والاسلام السعودية<br />على الاقل مش مسلمين دينهم للنسوان يحطوا قوانين وبعدين يدعوا دلوقتي<br />مش ناقص غير نلاقي فيفي عبده بترفع الاذان"
archived = "2009-10-12"
capture_url = "https://web.archive.org/web/20091012024712/http://www.20at.com:80/masr/t7kyk/10146.html"

[[comments]]
order = 1
subject = ""
author = "سعد الدين"
posted = "2008-09-25"
text = "الداعية عبلة الكحلاوى اطال اللة عمرها ومتعها بالصحة حينما تدعوا اللة فى وجل وفى خشوع وبلا تصنع وعلى سجيتها غير التى تدعوا اللة وهى سمراء البشرة ومركبة عدسات لونها اخضر فى عينيها وعاملة عمليات تجميل لنفخ الخدود والشفايف<br />هى المطربة عايزة تعمل انتشار لنفسها حتى فى الوقت المخصص للدعاء<br />ثم من قال ان ان دى تنفع مطربة اصلا<br />دى صوتها عامل زى الصوت اللى بيزيق عند فتح الباب<br />استغفر اللة العظيم<br />ناقص الست فيفى عبدة تعمل لنا وصلة ادعية"
archived = "2009-10-12"
capture_url = "https://web.archive.org/web/20091012024712/http://www.20at.com:80/masr/t7kyk/10146.html"

