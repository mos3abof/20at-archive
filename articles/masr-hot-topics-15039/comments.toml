posted = "2010-01-25"
text = "ومين قل أنها ممكن توصل أساساً<br />ده بمجرد أنه يكون فيه توق بس ولو 1% .. أول حاجة هيعملوها هيخلوا قصر الرئاسة و الموجود فى الكوربة ..<br />تانى حاجة أنهم هيمنعوا السيول توصل للمنطقة بأي شكل حتى لو يحولوا مسارها لأماكن أخري .. وكله علشان الباشا الكبير .<br />دى شرم الشيخ لو رحتها دلوقتى مش هتلاقى فيها أي أثر للسيول … فما بالك بقى بالحي اللى ساكن فيه الريس .<br />يارب أكرمنا يارب …"
