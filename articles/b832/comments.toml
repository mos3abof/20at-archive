subject = "بيروت"
author = "ريان آل غور"
posted = "2006-07-02"
text = "بسم الله الرحمن الرحيم<br />امة عربية واحدة ذات رسالة خالدة هي الوحدة الحرية الاشتراكية ايها الشعب العربي المذلول المضطهد من هو السبب في هم وذل هذا الشييخ المسكين ومن هو السبب في اغتصاب اعراض المجيدات العربيات في العراق وفلسطين السبب المباشر هو الا حتلال والسبب الغير مباشر هو عدم وجود الحامي وتخلي الزعماء العرب وتآمرهم على شعوبهم وامتهم الزعماء والحكومات العربية هي عدوتنا جيوشها هي التي تقمعنا مخابراتها تسهر من اجل مصلحة الاعداء و قهر الشعوب العربية سياساتها الاقتصادية تجوعنا هم الاعداء هم وهم ليسوا زعمائنا بل ولاتا للاستعمار الامبريالي على امتنا العربية وعرقنا العربي"
archived = "2006-11-02"
