subject = "شيء لا يصدقه عقل"
author = "الاستاذشيكو"
posted = "2006-05-26"
text = "كل الدنيا زهقت من الراسماليه العفنه والخربه التي تاسست في الغرب والعرب عايزينا نعمل زييهم مع الفارق في الامكانات والقدرات والعادات والتقاليدوهذا ما اكتشفته امريكا اللاتينيه اخيرا وتسعي الي نظام خاص بها يراعي مصالحها كما فعلت ايران وتفعل الان كل الدنيا تعرف ماذا تريد وتبدا في التنفيذ الا عندنا في مصر والعالم العربي ناتي باحد غيرنا ليخطط لنا كل شىء من الزباله الي الفضاء اللي عمرنا ما هانطلعه ابعد من النيله سات واخوة التاني"
