text = "طبعا نحى سكان امريكا الجنوبيه بس لا ننسى ان الاحتلال الغربى دمر فى بلادنا اكثر مما كانبفعل فى بلادهم كما ان الغرب لديه من المصالح فى بلادنا مما يشجعه على التدخل<br />لكن برغم كل شى نحن المسؤولين فى الاول والاخر عن تخلفنا<br />ولكن المبشرات بدات تظهر والحمد لله<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
