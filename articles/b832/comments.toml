order = 0
subject = "لاتحسبن المجد ثمرا أنت آكله ***** لن تدرك الشهد حتى تلعق المرا"
author = "نجم الدين"
posted = "2006-05-21"
text = "أيها السادة/<br />نحن العرب حقيقة أشد ماخلق الله إهدارا لمواردنا، مادية وبشرية، نعطي مفاتح كنوزنا لأعداء الأمة، ثم نرتمي على عتباتهم ونمرغ جباهنا بتراب نعالهم نستجدي الفتات. نضيق العيش على النوابغ من أبناء الأمة حتى يهجرونا، ونتسول بعدها السادة الغربيين أن يرسلون لنا خبراءا من لدنهم يصلحون لنا أمور حياتنا ويخططون لنا مستقبلنا، وما وأيم الحق هم بفاعلين. إن يرسلون لنا إلا أفاع وحيات ولصوص وعلل قاتلة، ويحتفظون هم بأصحاب الرأي والمشورة والخبرة، فهل نتقدم ونلحق بركب الحضارة أو ذيلها وهذا حالنا؟<br />لايصلح الأمم غير غيرة أبنائها على رفعتها وتكاثفهم على نهضتها وأن يعلموا أن العمل وحده هو طريق الفلاح.<br />لدينا كل مقومات العزة، لكنها مبعثرة هنا وهناك وبأيدي أشحاء جهلة خونة علوج لئام، نصبوا علينا حكاما لايبرحون ولا يشبعون ولايرحمون ولا يقولون إلا ما لايفعلون.<br />العربي غريب ببلاده ولاكرامة له فيها أبدا، والأجانب هم أهل الرأي بكل بلادنا وهم من يحدد لحكامنا الصالح منا والطالح والأمين والخائن والمؤمن والكافر.<br />حكامنا ياسادة على هوانهم أباحوا لأنفسهم إحتكار فهم كل أمر دق أو جل، والله وملاؤوكته الأبرار يشهدون بأنهم أشر من الحمر، هم وذرياتهم فقط من إصطفى الإله وصلى عليه وسلم، أما نحن فلنذهب الى حيت ألقت بأم عامر.<br />إنظروا كيف نعامل ببلادنا وكيف نعامل إخوانا لنا من جلدتنا، وقارنوا ذلك بمعاملتنا لسائح أجنبي وجدناه يجول شوارعنا، ألا نتبارى في إبداء الحفاوة والكرم العربي الفوق حاتمي عندها، ونمطره بوابل من إنجليزية مكسرة حافلة بتهتة يحسدنا عليها السادات وعرفات والبقرة الضاحكة المنوفية لارحم الله عظام أي جدث منهم.<br />لن أعرض هنا لحثالات الخليج ولا نفايات الجزيرة العربية، علم الله أنى نفضت منهم يدي إلا نفر قليل منهم، منذ نصف قرن. ولو قدر لي أن أخطط لمعركة فاصلة مع العدو، فأنني أدعو الله فقط أن يكفنى مكر وشر هؤلاء القوم فقط. ولكن سادتي هيهات، والله فى سالف حكمته وإرادته أراد لهذه الأمة أن تكون أمة واحدة، ألا ترون كيف وزع الثروات على إختلافها بأرجاء وطننا كله، ولم يمنح لأي قطر منها وحده أن ينهض دون الآخرين. هذا أمر حاولناه وبذلنا دونه الغالي والرخيص فلم نجن سوى الحسرات والخسارة.<br />أبهؤلاء النفر من الذيول يرفع لنا رأس وتعلو لنا قامة؟ أبتشردمنا وتفرقنا يحسب لنا حسابا أبدا؟ أبستقدام الأجنبي لبلادنا نحصن حدودنا؟ أبإضاعة مقدراتنا سخفا وهدرا نؤمن مصير الأجيال؟<br />أقول لكم حقا وصدقا إن لم يتادركنا الله برحمته أكلتنا تلك الجرذان القادمة من وراء البحار. إن لم نصلح مدراسنا أولا سنظل هكذا كما مهملا، متى نوجه النجباء من أولادنا لدراسة العسكرية ولدراسة الدين، إنظروا هنا قلب المشكلة ولبها. لايتبقى للعسكرية وللإرشاد الديني ببلادنا غير المتردية والنطيحة وما عاف السبع إفتراسه، وهؤلاء وهذا شرع الإستعمار ببلادنا يولون علينا، ويتحكمون بمصائرنا فلا يبرحون يخربون البلاد ويهلكون الحرث والنسل ويصادرون الحريات ويقتلون أو يطردون ملكات وخبرات نحن بأمس الحاجة لها، فكيف نتقدم؟ ومن نلوم العدو الخارجي فقط؟ ومتى كف العدو الخارجي عن الكيد لنا؟<br />إن أردنا أن نهض علينا أن نغير واقعنا المرير بأيدينا، ولا نستعين بالأجنبي كما فعل خونة العراق من أكراد وشيعة وآل قباح وقرود باقي سادتنا الحكام جميعا.<br />لاتحسبن المجد ثمرا أنت آكله ***** لن تدرك الشهد حتى تلعق المرا<br />سنبنى نحن وسيهدمون هم وذيولهم من حكامنا الأرذال، وفي كل مرة سنقوي بناءنا، حتى يشاء الله أن يستعصي على مكرهم هدمه، والله عزيز قدير."
