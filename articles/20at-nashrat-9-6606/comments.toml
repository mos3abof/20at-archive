order = 4
subject = ""
author = "اكتب اسمك هنا ابو عجره"
posted = "2009-01-22"
text = "اقتباس//وأكد أهالي المنطقة وجود مبالغة كبيرة من الجامعة في متطلبات تعديل لائحة القبول الجديدة، باعتبارها الجهة التي تولَّت الإشراف على هذه الكليات بدلاً من وزارة التربية والتعليم، التي انفصلت عنها أخيراً.//<br />اذا هنا حتى المدرسين والمدرسات تنفصل الخدمة من وزاره التعليم اذا لابد من عمل اداره خاصه بالجامعه. او الاوراق ترفع<br />الى الرياض وما تدخل ادارة التعليم اذا ليس لها دور نهائي واشراف النسوي اذا يغلق حيث انه تابع للتعليم<br />2/ اذا رواتب المدرسات والمدرسين تتبع الجامعه التي ليس لها اثر حاليا اذا لابد من ان ياتو بالصور وليس فقط الطاللبات اذا حيتضخم الامر الا ان يوضع اشاراف نسائوي للجامعات نسوي 0والمعلمين والطلاب اشراف تعليمي واوراق الطالبه وليه ينحط لها صوره اساس الصوره لتطبيق الشكل فقط وحين يكتب صوره متحجبه<br />اذا انتم عارفين الصد المواطنين 0 والمتحجبه هي اللي تغطي وجهها كامل 0 تقول لا انا اقولك لا لان التوابع النسائيه يكتب متحجبه مكان الصوره 0 ام تحجب الصلاة هذا امر من الله نزيد النساء جمال وبها للامتثال اما الله<br />في هذا التحجب والمفروض بعد التحليل اللي تحتاجها صحيح المدرسه فقط وارشيف المدرسه وهي تخالط بقية البنات<br />المدرسه ولو اشتبه في اختبار بالبنت تراجع المديره الارشيف وتتاكد ان كان هذي البنت ام لا حنا ليس على بوابة جوازات<br />وليس البنت في خلط مع الموظفين وهذي وقت دراسه مرحله ومنتهيه وجميع اوراقها لديكم لاغيه حين صدور (النجاح )<br />او الشهادة اذا لابد من تفصيل من قبلكم الى المواطنين الصور وطريق اتجاها والا ليس كل من استلم منصب وقام يدلي بامور ولا يعرف عقباها"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727115524/http://www.20at.com:80/20at/nashrat-9/6606.html"

