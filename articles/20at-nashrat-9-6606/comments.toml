text = "والله او مره اشوف التعليم يخط اراء اللي يبي بنته تسجل يبي يجيب واللي مايبي بكيفه ولا تبشون روسكم بالدوخه اللي يبي تسجل تجيب جواز السفر كلهم بناتهم عندهم جوازات سفر وكل وحده لها ملف بصوره بس اخاف يوم التسجيل يسير فل ومافي مقاعد وتسير واسطه والله يوم التسجيل يمكن يجبون 10 او 12 صوره اذا للعلم يقولون لا واذا على التمشيات<br />خارج المملكه وش شطرهم متفتحين حيل"
