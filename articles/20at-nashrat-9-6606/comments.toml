author = "عمك ياورع أنت وياه"
posted = "2009-01-16"
text = "أخس يالورعان<br />صاايرين أرجال<br />يكلاب توكم تبلغوون ياجحلط وجتكم فترت المراهقه ياكلب أنت ويااه<br />أجل تبووون صور الطالبات ألي بحدود شمااليه<br />بس نسيتو شرط أنكم الصور تجي مكياج خخخخخخخخ<br />خخخخخخخخخخخخخخخ خ تفووووووووووو<br />على أبن جابكم يكلاب x كلاب<br />أستحووو على وجيهكم أستحوو وربي عيب<br />شوي وتقلبوون المدن المملكه مدن جنسيه نفس فرنسا وأمريكا<br />ياااخي مافيكم حيااا أستحووووو أستحووووو أحترم شيباتك ولا صح<br />أنتم تحلقووون شيباتكم وجتى شنب ماعندكم<br />يعني مراهقه X مراهقه<br />والله أي كليه توااافق على هذا شرط وربي<br />لنقووول عوافي ياعرعر"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727115524/http://www.20at.com:80/20at/nashrat-9/6606.html"

