subject = ""
author = "ابو شاكوش"
posted = "2009-01-22"
text = "اقتباس//نفى عميد كلية التربية في عرعر الدكتور خلف بن رشيد الحربي وجود هذا الشرط ضمن شروط القبول، على رغم أنه موجود على الموقع الخاص بالجامعة، مؤكداً أنه لا يجب على الطالبة تقديم صور شمسية للقبول في الجامعة//اقتباس<br />والله مايدرون الا بعد ماتجيهم الاوراق التقديم اخر من يعلم هو الشمال ليش ماادري منسيين وسويتو مشكله ممكن من دون شي وهل باقي الجامعات تاخذ صور او لا ؟ معلزماتي صوره واحده كملف في المدرسه وحين التخرج يرد الملف للكالبه<br />هذا كل الكليات والجامعات اما اذا هو تطبيق جديد في امور ثانيه نسويها ونتبعها لحل المشاكل"
archived = "2009-07-27"
capture_url = "https://web.archive.org/web/20090727115524/http://www.20at.com:80/20at/nashrat-9/6606.html"
