[[comments]]
order = 0
subject = "يا بخت من كانت صاحبته زوجة الرئيس"
author = "إبن بهية"
posted = "2006-11-28"
text = "أعتقد أن معظم من نادوا بإقالة أو استقالة الزير الفنان فاروق حسني ليسوا مصريين ولا يعلمون عن هذا البلد الكثير .. منذ قيام الأزمة واشتعالها كان في عبي شوال فئران بتلعب وتتنطط وتضحك على سذاجة شعبنا الطيب .. فاروق يمشي ؟؟؟ ياهـ ؟؟؟ ليه انتم فين هنا ؟؟؟ دهـ بتاع الست يا مصريين يا عبايط .. فاروق أبو خازوق ده بتاع الست هانم سوزان وزي ما حضراتكم راسيين وعارفين سوزان وإبنها الواطي إبن الواطي هم اللي بيقودوا البلد دلوقتي بعد ما الواطي الكبير بدأ يخرف وعاملين عليه حجر أهلي من غير حكم محكمة .. مش عشان الفضايح لأ لا سامح الله دول خميرة فضايح وواخدين عليها .. ولكن عشان يفضل قدام الناس كده فاسوخة لغاية ما أهل سوزان بتوع إنجلترا وولاد عمها بتوع بوش الأمريكان ((على فكره الكلام ده مش من باب التريقة .. سوزان بريطانية وفي شهادة ميلادها البريطانية اسمها سوزي)) باقول على ما حبايب سوزي يكونوا فاقوا شوية من العراق وأفغانستان ويظبطولها المحروس بتاع لجنة السياسات .. ساعتها مبارك الواطي راح ياخد بالجزمة ويترمي زي الكلب وننوس عين امه سوزي يحكم بجد ويحصل على لقب رئيس ...<br />كما أكتب الآن كنت متأكداً من انتصار فيفي ((آسف أقصد فاروق .. طيب وماله فيفي .. تصدق أحلى وراح يعجب معاليها أوي .. آسف تاني أقصد معاليه .. يووهـ هـ غلبتنا يا سونسون .. إنته دكر ولا نتايه ياله؟)) ، انتصرت فيفي أو انتصر فاروق ((اختاروا اللي تعجبكم)) والشعب يضرب دماغ أهله في الحيط بقى هو من إمته يعني كان له رأي في حاجه ؟؟؟ آدي اللي ناقص كمان الشعب الرعاع .. الدهماء .. الغوغاء .. ييجي في آخرتها وعايز يمشي كلامه .. وعلى مين ؟ على أم المحروس سوزي هانم ؟؟؟ ياهـ دي هزلت .. أما إنكم شعب بايخ بصحيح .. مش لاقيين غير حبيب الست وروح قلبها وتقلوا أد<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073252/http://masr.20at.com:80/article.php?sid=1218"

[[comments]]
order = 1
subject = "سبق صحافي لموقع جبهة إنقاذ مصر"
author = "متابع"
posted = "2006-11-28"
text = ".. انفردنا بنشر خبر نجاح سوزان مبارك في اجهاض محاولة لإقالة فاروق حسني<br />بفضل من الله سبحانه وتعالي حقق موقع جبهة إنقاذ مصر الإخباري سبقا صحفيا عندما انفرد قبيل أيام وفور تفجر أزمة فاروق حسني نقلا عن مصدر برئاسة الجمهورية بخبر نجاح سوزان مبارك في إجهاض محاولة نظمها الحزب الوطني للإطاحة بفاروق حسني حيث قال لنا المصدر أن السيدة الأولي تلقي بكل ثقلها إلي جوار فاروق حسني مبررا ذلك بجهوده في وضع خطة دولية لها بالاتفاق مع منظمات أوروبية لتفوز بجائزة نوبل للسلام. وعبر تلك الخطة بدد فاروق حسني قطع أثرية كهدايا علي من يعتقد أنهم سيساهمون في فوزها وللأسف فعلي الرغم من هذا التبديد ونحن نقصد بالأسف هنا علي تلك الآثار فإن سوزان هانم لم تترشح حتى للأدوار التمهيدية للجائزة.<br />وعلمنا أن مبارك بادر أمس بالاتصال بفاروق حسني وطيب خاطره وأمره بالعودة إلي مكتبه وبعد اتصال مبارك تلقي فاروق مكالمة اسعد أتته هذه المرة من سوزان هانم وقالت له بالنص \" متخفش محدش هيقدر يمس شعره منك طالما أنا موجودة \" وعاد فاروق بعدها منتصرا للوزارة علي كل مصر<br />والمدهش أن مبارك أمر قيادات الحزب الوطني التي هاجمته بالاعتذار إليه وبالفعل اصطحبه وزير الإسكان إلي مقر الحزب الوطني حيث كانت الهيئة البرلمانية مجتمعه هناك تم تطييب خاطر فاروق وقيل له أنهم فعلوا ذلك من اجل امتصاص تعاطف الناس مع الإخوان وركب الموجه بالمفهوم الصحيح.<br />وأصدر فاروق حسنى وزير الثقافة أمس قراراً بإنشاء \"لجنة للثقافة الدينية\" تابعة للمجلس الأعلى للثقافة، تضم في عضويتها رجال الفكر الديني ومجموعة مختارة من علماء الدين الإسلامي والمسيحي.<br />جاء ذلك في تصريحات لوزير الثقافة خلال مؤتمر صحفي عقب عودته لمكتبه وإنهاء اعتكافه الذي دام قرابة الأسبوع، على خلفية أزمة<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073252/http://masr.20at.com:80/article.php?sid=1218"

