subject = "تحياتى لولاد بهية"
author = "فارس _fr"
posted = "2006-11-28"
text = "الملاحظ فى اغلب الكتابات \"الحكومية\" . الصادرة عن جرائد الحكومة وابواقها ,, هى المحاولات الجادة والمستميته لتحويل البلد الى بلد علمانية تفصل الدين عن الدنيا , نحن بلد اسلامى اه لأ ده فى الصلاةبس , لم نيجى نتكلم عن اقالة الزير فيفى على راى ابن بهية ,, يقولوا كان بيعبر عن راية ودىحرية شخصية ,, قبلها الفناس حسين فهمى برده يعلق على المحجبات ,, قبلها الست سعاد صالح تقولك المنتقبات مش عارف ايه ...... \" انا احترت والله مع الناس دي عايزين المسلم فى البلد دى مسلم فى البطاقة بس وغير كده يبقى \"ديوس \" يعنى \"عر..\" عصري ,, مدندش روش طحن ,,, الله يخزيكم ويخزى امثالكم ماللى عايز منهم يمشي مراته ولااخته عريانه ..يخليه فى حاله وبلاش طلق الزبالة على الناس ... ياعلمانيين يا زباله !!!!!"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073252/http://masr.20at.com:80/article.php?sid=1218"

[[comments]]
