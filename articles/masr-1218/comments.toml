subject = "هى فعلاً"
author = "ليس جديداً هذا السلوك من سيئة مصر الأولى ولكنى أتسأل أين رجال البلد حتى يتركوا هذه السيئة تفعل ما تفعله فمن السابق كانت لها أياديها السوداء مع الدكتور أبراهيم سليمان وكانت السبب فيما وصل إليه الدكتور ممدوح حمزة وهى السبب فيما وصل إليه حال الشباب فى المعتقلات بعد القرابة التى تربطها بحبيب العدلى وليس غريباً ما فعلته مع فاروق حسنى فهو نفس فصيلة أبنها المخنس ولكنى أقول أين رجال البلد ليوقوا هذا السيدة اليهودية الأصل عما تفعله وصدق من قال"
posted = "2006-11-28"
text = "إذا كان الغراب دليل قوماً مشى بهم إلى جيف الكلاب"
archived = "2006-12-05"
