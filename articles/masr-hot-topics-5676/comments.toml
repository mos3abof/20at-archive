posted = "2008-03-04"
text = "انا معاق بس ممكن اعرف لو المعاق معهوش فلوس علشان يجيب السيارة المجهزه خاصب عنو بيبيع السيارة مع العلم هو محتاج السيارة ترورى جدا لزم الحكومة لو لقت سيارة مجهزة مبعها تروده الى المعاق من الشخص الذى دفع لهو مبلغ من المال علشان يتنازل عنها وده يكون اكبر غرامة الى يستخل المعاق بفلوسو"
archived = "2009-10-11"
capture_url = "https://web.archive.org/web/20091011000911/http://www.20at.com:80/masr/t7kyk/5676.html"

[[comments]]
order = 5
subject = ""
author = "احمد حلاوة"
posted = "2008-06-17"
text = "لاو ماخزة انو لازم الى ياخد العربية يكون معدى الفقر ولا انتو مش معاااااى تقدرو انو المعاق الفقير يخد عربية من فان ودا معاق ودا معاق بس الى هيجيب العربية لازم يكون معة فلوس بدام معا فلوس ممكن يقدر يجيبالعربية من غير الموضوع دة صدقونى انة الموضوع المعاق دة معمول مش لجماعة المعاقين هو لو معمول لجماعة المعقين وعيزين يخدمهم يدور على المعاق الغالبان ونا جيبت اخرى فى الكلا م اهو انا معاق بس انا يمكن اكتر واحد لازمة اى وسيلة موصلات بس انا نفسى فى عربية اجيب من فان فلوس انا لو معااااااااااااا ااااااااااااااا ااااااااااااااا ااااااااااااااا اااااااااى فلوس اجيب عربية واكل منة عيش وممكن الرد على كلامى عشان انا محتاج اى واحد يعبرنى انا مسنى واحد"
archived = "2009-10-11"
capture_url = "https://web.archive.org/web/20091011000911/http://www.20at.com:80/masr/t7kyk/5676.html"

