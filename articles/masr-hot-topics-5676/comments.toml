[[comments]]
order = 3
subject = ""
author = "يونس أحمد عبد اللطيف"
posted = "2007-10-04"
text = "ـأصبح الحصول على سيارة مجهزة أمر فى غاية الصعوبة - فبالرغم من الإجراءات الكثيرة السابقه إلا أن الأمر كان عادلا لأن من كان يتقدم بالحصول على سيارة مجهزة كانوا هم الجاديم فعلا ولكن الآن أصبح الأمر ذات صعوبة بالغة فميعاد القومسيون الطبى أصبح ما يقرب من عام كذلك إستغلال التجار بالمناطق الحره وخصوصا ببورسعيد ومطاردة رجال المرور لنا دائما جعلتنا وكأننا عملنا جرم كبير والأعجب من ذلك أن من له إعاقة فى رجله الشمال لا يصرح له بسيارة أوتماتيك مع العلم بأنه هو الأحق بهذه السيارة وأخيرا مدة السماح لا بد وأن تختصر إلى ثلاثة سنوات بدلا من خمس لأن السيارة تكون قد هلكت لأنها بالطبع سيارات مستعمله فى بلادها قبل شرائها وأخيرا لا بد من تدخل الحكومه فى إستيراد وبيع هذه السيارات وبدون ربح وكفانا ما بنا من إعاقات وربنا يشفى كل مريض"
archived = "2009-10-11"
capture_url = "https://web.archive.org/web/20091011000911/http://www.20at.com:80/masr/t7kyk/5676.html"

[[comments]]
