posted = "2009-03-28"
text = "ايه ياجماعة هو فيى ايه دى منحه من الدوله للمعاق وهو وظروفو ومفيش فيها اجبار ولا تحايل واحد لايملك ان يشترى عربية فى الوقت الحاضر بيبيع الورق ويستفاد احسن مايعدى عليه خمسين سنه من غير مايعمل حاجة وهو دة الصح وبكدةتبقى الحكومة بتساعد المعاق بطريق غير مباشر وحكومتنا عارفه كل حاجة وهو المعاق بيسترزق والمرور بيسترزق وصدقونى الوحيد اللى بيخسر اللى اشترى الورق دة المرور لما بيقفشة كانه قفش فرخه ويتلمو عليه ينتفوا ريشه ريشه ريشه عساكر وعمدة ولواءات كمان… وربنايستر علينا كلنا …مش كدة ولا ايه ايييييييييييييي ييييييييييييييي ييييييييييييييي ييييييه"
