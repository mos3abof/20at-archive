text = "السلام عليكم ورحمة الله<br />انا معاق ولا يوجد معي مال من اجل شراء عربيه ماذا افعل والجواب قارب علي الانتهاء مع العلم انا عامله مستعجل 500 جنيه<br />طيب ايه الحل ابيع الورق ولا أعمل ايه انا علي اد حالي طيب لو ابيع الورق ايه الاجرائت وبكام ابيع الجواب ارجو الرد عليه ياناس العارف يقولي اعمل ايه انا عايز حل ارجوكم"
