[[comments]]
order = 10
subject = ""
author = "السعيد المتولى السيد خالد"
posted = "2009-03-27"
text = "هو احنا كدة الكحكة فى ايد المعاق عجبها اة مهما لما يحرموا الناس المعاقة من التعيين بقالهم سنين الناس تتخرص وميتكلموش خلاص يموتوا ولا يغرقوا دول معاقيين ملهمشى حقوق على الدولة ولما القانون يدهم نقطة مية من بحر العطش الى الدولة عملاة فينا من حرمنا من كل شيى ابسط حاجة هى التعين والمصيبة ان المعاقين الان اصبحوا اسر كاملها ليس لها دخل والدخل هو مصدر حياة اى انسان ويتكلمو على الاعفاء الجمركى اة يعن كام الف ينسرفوا فى كام يوم وباقى ايامه يعملوا اية وعلى فكرة ناس كتير من المعاقيين تقدر تجيب عربية والعربية هى عصب الحركة لكل المعاقين وكان المفروض تبقى مجانا لكى يستفيد بها كل المعاقيين وميفرتش حد فيها ولا اية ياابن بهية"
archived = "2009-10-11"
capture_url = "https://web.archive.org/web/20091011000911/http://www.20at.com:80/masr/t7kyk/5676.html"

