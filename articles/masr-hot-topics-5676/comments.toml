[[comments]]
order = 1
subject = ""
author = "رامز عباس"
posted = "2007-05-01"
text = "الاخ المحترم ابن بهيه انا معاك بالنقط العادله اللي انت ذكرتها بس بقولك كله بسبب الجمعيات التعبانه اللي كلت كل حاجه باسمنا تصور جمعيه شموع بالقاهرة خدت فلوس من هئيه المعونه وعملونا لجنه دفاع حقوقي وبعدين قالوا ميعرفوش عننا اي حاجه يبقي لما بتوع الجمعيات يشيلوا ايدهم عننا بهايم البلد هيعملولنا ايه حسبنا الله هو مولنا وخلقنا ورزقنا ومش عايزين من حد حاجه"
archived = "2009-10-11"
capture_url = "https://web.archive.org/web/20091011000911/http://www.20at.com:80/masr/t7kyk/5676.html"

