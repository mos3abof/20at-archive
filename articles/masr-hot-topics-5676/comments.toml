text = "الاول تميم سامى عايز اقول حرام عليكم احنا الناس االناس العاديه نعمل ايه فى الاسعار دى الغليه نار ما هى العربيه دخلت البلد بنفس السعر ولا عشان اصحاب التوكيلات بيستفيدو وانت وانتم كمان بتستفيدو من الجمارك : حسبى الله ونعم الوكيل فيكم"
