[[comments]]
order = 0
subject = "العض الذيذ"
author = "مسلمه"
posted = "2006-05-07"
text = "الحقيقه لما تكلمتو عن العض فكرتونى بزمان<br />وانا فى الابتدائى كنت بالعب انا وواحد صاحبى واتفقت معاه لو سبقته \"هاعضه\"<br />والمسكين كان شايل هم العضه دى اوى<br />وكان عمال ينهج وعايز يستريح لكن مين...<br />بس يا جماعه العض ده يمكن يكون سلاح للاطفال لكن الكبار؟؟؟ صعب اوى لما يبقى الانسان زى الكلب<br />اللهم اتنا فى الدنيا حسنه وفى الاخرة حسنه وقنا عذاب النار"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134811/http://www.20at.com/article2.php?sid=776"

[[comments]]
order = 1
subject = "عضة في الخد"
author = "Apple"
posted = "2006-05-07"
text = "الحقيقة أنا اتعضيت وأنا بيبي صغيرة وكانت الست العضاضة واحدة من صاحبات جدتي العواجيز... وأنا كنت طفلة مكلبظة أوي وخدودي كبيرة فمسكتني وقعدت تبوس فيا وقالت لماما... بنتك طعمها يجنن... وفجأة (هاااااااااااام يا جمل) راحت عضاني من خدي جامد.. وروحت أنا مصرخة وقعدت أعيط... طبعاً الكلام ده اتحكالي لأني كنت صغيرة مووووت... وده بيثبت إن في ناس كبار عضاضين وكمان ستات.... يماااااااااه.<br />مفيش حد اتعض قبل كده؟؟!!<br />يللا سلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134811/http://www.20at.com/article2.php?sid=776"

