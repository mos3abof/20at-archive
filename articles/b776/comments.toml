subject = "عض قلبي ولا تعض رغيفي"
author = "batates"
posted = "2006-05-08"
text = "ممكن الواحد يفرغ طاقة العض اللي عنده في الأكل<br />ويقعد يعض في اللعب اللي معمولة من المطاط أو يعض في بالونة لغاية ما تفرقع في وشه... نياهاهاهاهاهاهاهاها."
archived = "2006-11-02"
