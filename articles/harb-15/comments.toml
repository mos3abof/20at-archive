[[comments]]
order = 0
subject = "ال سعود والخيانه"
author = "محمد سالم"
text = "ال سعود كانوا دائما خونه وهذا ليس جديدا عليهم<br />ولكن فقط رفعوا برقع الحياء<br />العماله والخيانه شرط بقاء ملكهم"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720130952/http://harb.20at.com:80/article.php?sid=15"

[[comments]]
order = 1
subject = "كلاب الباشا"
author = "مسلم حتى الموت"
text = "لا أرى سبب للاستغراب فى موقف الحكام العرب فهم مثل الذى تم إغتصابه أول مرة و بعد ذلك أصبح مخنثا يستلذ بل و يسعى لأن يغتصبه أحدهم فكلهم مخنثين فلا شعوبهم ترجو منهم شيئا و لا حزب الله سعى لشئ عندهم أبدا و بدأ فعلا أن أصدق فعليا و واقعيا أنه مخنثين و ليسوا رجالا فلا أدرى لماذا يلبسون لبوس الرجال الا أمامنا فقط أما أمام إسرائيل و أمريكا فيستقبلونهم و هم عرايا مستعدين لأن تفعل فيهم الفاحشه يا له من واقع شاذ أسود"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720130952/http://harb.20at.com:80/article.php?sid=15"
