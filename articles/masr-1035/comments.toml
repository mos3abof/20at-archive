[[comments]]
order = 16
subject = "حاله حرب"
author = "حربى نصر الفاتح"
posted = "2006-10-15"
text = "لماذا المسلمين دائما فى حاله حرب؟؟؟؟؟؟<br />دائما يخرج من يقول ده النصارى اقليه يعنى لو قمنا عليهم هنعمل ونسوى وكانه المفروض والمنتظر ان تقوم معارك بين الفئتين؟<br />ليه دائما المسلمين فى حاله استعداد - ان لم يكن عملى فهو نفسى - للحرب ، حرب اليهود والنصارى فى حرب ضد اوروبا والفاتيكان فى حرب ضد امريكا فى حرب ضد الكفار (لعل الدور ياتى على الصين و الهند والعالم دى)<br />هل دور الدين الاسلامى ان يدعو للحرب و الحرب والحرب حتى يبيد البشر بعضهم؟؟؟؟<br />الله لم يجبر الانسان على شىء بل ترك له الحريه والاراده ام ان هذا كان حتى جاء الدين الاسلامى؟؟؟؟<br />قبل ان تنهال الشتائم ، انا طبعا غير مسلم ولكن لم اسمع عن الاسلام او من المسلمين غير اخبار الحروب واللهم دمر اللهم شتت اللهم احرق اللهم يتم وكل هذه الدعوات المميته التى نسمعها بدايه من المسجد القريب فى صلاه الجمعه حتى مواقع النت هذه.<br />واسف للتعليق ولكن الموضوع فعلا اجده غريب."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061604/http://masr.20at.com:80/article.php?sid=1035"
