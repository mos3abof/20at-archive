[[comments]]
order = 9
subject = "الخير فى مصر و لكن...."
author = "نيفين نيفى نوفا"
posted = "2006-10-12"
text = "اولا عايزه اشكر عشرينات على الايميلات الحلوه دى وانا دايما بقول الخير فى مصر و لكن ما يحدث كل عام هوضحك على الذقون زى ما بيقولو<br />اه عايشين مع بعض<br />اه بنحترم بعض<br />لكن بيفضل افطار الوحده الوطنيه شكل مبالغ فيه لاظهار عكس بعض الحقائق امام العالم يعنى كأننا بنقول للعالم كله احنا معندناش فتنه و لا حاجه و الحوادث اللى حصلت دى حالات فرديه ودا حتى لو غلط كويس علشان صورتنا برده ادام العالم<br />بالنسبه للبابا انا بحس ان احاديثه كلها صبت فى قالب واحد مع تغييرات بسيط<br />ه تبعا للموضوع بس دا ميمنعش ان كلامه مرتب و بينم عن ثقافه و شخصيه<br />و الكلام عن شوبير معروف يا جماعه<br />معروف انه متسلق كبير و من احاد الكوره لعضو مجلس شعب لمذيع اذاعى لمذيع تليفزيونىو بيقولو صاحب بالين كداب<br />طيب يبقى صاحب مليون بال يبقى ايه<br />يبقى منافق(اللهم انى صائمه)<br />هتفطرونا يا عشرينات<br />اما جمال مبارك فهو لا يزيد عن ديكور بيكمل الشكل كله<br />و انتو فاهمين بقى"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061604/http://masr.20at.com:80/article.php?sid=1035"

