[[comments]]
order = 6
subject = "فوق يا شيخ الازهر"
author = "ميدو"
posted = "2006-10-11"
text = "قد يبدو عنوان تعليقى غريبا ولكنه ما اشعر به انها مرارة الاحساس بفشل اكبر مؤسسة دينية فى مصر بل فى العالم الاسلامي فى ادارة شئون المسلمين وتوجيههم التوجيه الدينى الصحيح بعيدا عن مصالح القيادات السياسية مرارة ممزوجة بالخوف على رئيسها ( فضيلة الامام الاكبر ) الذى بلغ من العمر عتياماذا يقول عند لقاء ربه ، ياشيخ طنطاوى قلت لصحفى عشرينات (اسأل البابا عن تقييمة للوحدة الوطنية ) ردا على سؤال وجه لفضيلته حول تعليقه لكلام البابا من انه غير راض عن الوحدة بين المسلمين والاقباط والتى تقتصر فقط على مائدة الافطار الرمضانية امال انت حضرت ليه والا علشان تكتمل منظومة القيادات فى البلد من سياسيين ودينيين واقتصاديين وغيرهم والا يمكن لاضفاء الشرعية على توريث جيمى للحكم اختم تعليقى بقوله تعالى ( قُلْ إِنْ كَانَ آبَاؤُكُمْ وَأَبْنَاؤُكُمْ وَإِخْوَانُكُمْ وَأَزْوَاجُكُمْ وَعَشِيرَتُكُمْ وَأَمْوَالٌ اقْتَرَفْتُمُوهَا وَتِجَارَةٌ تَخْشَوْنَ كَسَادَهَا وَمَسَاكِنُ تَرْضَوْنَهَا أَحَبَّ إِلَيْكُمْ مِنْ اللَّهِ وَرَسُولِهِ وَجِهَادٍ فِي سَبِيلِهِ فَتَرَبَّصُوا حَتَّى يَأْتِيَ اللَّهُ بِأَمْرِهِ وَاللَّهُ لا يَهْدِي الْقَوْمَ الْفَاسِقِينَ )"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061604/http://masr.20at.com:80/article.php?sid=1035"

