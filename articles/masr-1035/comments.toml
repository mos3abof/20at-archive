subject = "الشعار"
author = "مطلوب فوري"
posted = "2006-10-14"
text = "اللي صمم هذا الشعار راجل مش ولا بد وما كنش يصح يتوافق عليه لانه ابرز ان الاصل هو الصليب والفرع هو الهلال وهذا خطا فادح<br />لان الاصل هو الهلال هو الذي يجب ان يشتعشره الناصر للشعار اما عندما تنظر الى هذا الشعار فلا ترى الا الصليب وبالتدقيق تكتشف عن هذه الدائرة هلال<br />ومافيش حاجه اسمها وحدة وطنية في حاجه اسمها دولة اسلامية بها اقلية مسيحية لا تتجاوز عشر السكان باي حال من الاحوال"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061604/http://masr.20at.com:80/article.php?sid=1035"

