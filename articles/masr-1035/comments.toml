[[comments]]
order = 3
subject = "اقباط مصر"
author = "مسلمون لا نصارى"
posted = "2006-10-11"
text = "أقباط مصر مسلمون لا نصارى !!<br />وإليكم الأدلة<br />بقلم<br />أبوإسلام أحمد عبدالله<br />Abuislam_a@hotmail.com<br />الحمد لله ، والصلاة والسلام على رسول الله 00 إن القضية التي سأتحدث عنها مباشرة، هي تلك الفِرية التي سموها (( فتنة طائفية )) ، والتي تموت وتحيا ، تم تموت ، ونحن لا نملك أي قدر من المعرفة حول مَن يُصدر القرار بموتها ، ثم مَن الذي يتولى ـ في كل مرة ـ مخاضها ؟‍‍! 0 إنها أزمة يعانيها سبعة وستون مليوناً من المسلمين المؤمنين بإله واحد ، وكتاب واحد ، وسُنَّة نبوية واحدة ، ينهل منها ملايين الفقهاء والعلماء والدعاة والمفكرين وطلبة العلم والدارسين والعوام في علاقتهم بأربعة ملايين نصراني ـ على أفضل تقدير ـ بنسبة 87,5% تقريبا من إجمالي السكان ، وينقسمون ـ فيما بينهم ـ إلى ما لا يقل عن أربعين ملة عقَدية في مصر وحدها !<br />وفي البداية ، أرجو رفْع التكاليف والحواجز النفسية والحساسيات المرهفة ـ تكتيكاً أو استراتيجيةً ـ إن أردْنا الوصول إلى حلول عملية لمشكلة تؤرِّق مضاجع السياسيين منذ غاب الإسلام العقَدي 0<br />تلك التي وجد فيها اللادينيون ( العلمانيون ) وسَقَط متاع الشيوعية وبقايا الماركسيين مستنقع ماء آسِن ، غاصوا فيها حتى أذقانهم ؛ ظناً منهم أن بها صفاءً أرادوا تعكيره ، ووجد فيها بعض العابثين من النصارى ـ المتطلعين إلى النجومية والشهرة ـ سيوفاً على رقبة الحاكم وحكومته ، يغازلونهم بلمعانها بين الفينة والأخرى؛ إثارة للرعب، أو لهواً بما هو ليس بلهو !0<br />نربأ بالعقلاء أن يزايدوا أو يروا في دفن الرؤوس كالنعام منجاةً من الخطر ؛ ففرض الحقائق ليس بحال طعناً ، أو إساءةً لاحد ، والحديث عن النصارى والنصرانية ليس مِنطقة ألغام كما يروجون فى أسماعنا ؛ لتخلو لهم ساحة الأم<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061604/http://masr.20at.com:80/article.php?sid=1035"

[[comments]]
order = 4
subject = "ارض التفاق"
author = "ايمن امام"
posted = "2006-10-11"
text = "ارض النفاق - هذا هو انسب تعبير لما رأيناه فى هذا الحفل - لماذا لم تذيع الكنيسه اذان المغرب ومن المسئول عن البروتوكول المنظم للحفل - ولماذا لم يحضر السفير الامريكى هذا الحفل بينما لو كان حفلا لطائفه منشقه او تطالب باى هلاوس سمعيه او بصريه ما كان سيتأخر لحظه واحده عن الاحضور - البابا شنوده يريد فتح حوار مره اخرى على ماذا انه يلمح الى ان الامور ليست جيده وانه ينبغى -الوقوف بجديه امام بعض ما يراه نقاط خلاف- لنعود الى الاسطوانه المشروخه التى سمعناها الاف المرات والتى تزكرنى بما كنت اعمله مع ابى وانا طفل صغير كنت اهدده بعدم ذهابى الى المدرسه لاجبره على تنفيذ طلباتى - او ادعى المرض - لكى اكسب عطفه نحوى - ايام البابا ولت وانتهت لان هذا النظام لايملك ان يعطى للبابا شىء اخر لانه بدايه صدامه بالخطوط الحمراء التى لايستطيع لاهذا النظام ولارب الاقباط ( امريكا)ان يقترب منه اقول مجرد الاقتراب منه - امام محاولات الضغط على النظام التى اتبعها صاحب مصنع المربى بأقامته قنوات اتصال مع بعض البوابين من اصل نوبى ( مع كامل احترامى وتقديرى لنعل البواب النوبى )وذلك كمحاوله منه تحت غطاء من جهات دينيه - ان يجعل النظام يدخل فى متاهه دارفورد المصريه-ولكن كل محاولاته بائت بالفشل وهل تعرفون لماذا لان التمويل انقطع عنه بعد الوقيعه التى حدثت بينه وبين اشخاص على الساحه الدينيه للاقليه فى مصر- والى لقاء اخر / ايمن امام"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128061604/http://masr.20at.com:80/article.php?sid=1035"

