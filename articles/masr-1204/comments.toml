text = "ما يسمي بالقومية العربية والوحدة العربية هو اكذوبة كبري روجها البعثيين والناصريين المسيطرين الي الان علي وسائل الاعلام وعند التعامل مع العرب تصطدم بالواقع وكراهيتهم وحقدهم علي مصر وقدتعاملت مع كل الجنسيات العربية ولمست ذلك سواء من السلطات أو الشعوب نكتة سخيفة حكاية الوطن العربي وكذبة كبري"
