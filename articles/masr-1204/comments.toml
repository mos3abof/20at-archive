text = "مش عارفه احنا ليه اتحولنا لناس بتهاجم فى اى حد و اى حاجه كده يعنى البنات اللى مش متحجبين يقال منساقين ورا الغرب و مالهمش هويه و اللمحجبات يبقوا بيوفروا الكوافير او موضه او شعرهم وحش و كل دى حجج مالهاش لزمه لان مافيش اسهل من السشوار ولا ارخص منه و اغلبية البنات دى كانت تقدر تلبس اللى عايزاه وكمان بتقابلهم مشاكل كتيره فى الشغل و احيانا فى دخول بعض الاماكن اما انهم بيقدروا يوفقوا بين المظهر الكويس و الحجاب فدا مش عيبو الاولى اننا نبص على البلاوى اللى احنا فيها بدل ما نقعد نتكلم فى الاسبانش و الطرح"
