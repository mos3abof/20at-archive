subject = "يامصري مصري"
author = "محمد الاسكندرية"
posted = "2006-11-28"
text = "لما قلت ان السعوديين ياكلو باديهم زي الحيوانات نسيت أن الرسول صلي الله عليه وسلم كان يأكل بيديه الشريفه؟؟<br />حسبي الله ونعم الوكيل انا بشك أنك اغلب اللي بيكتبوو في الصفحة دي هماا فلسطينيين لان عندهم حقد على السعودية دفين وعشان كده ربنا مش هينصرهم الا لما يتوقفو عن الحقد بتاعهم ده<br />انا عايش في السعودية ياجزمة وهي اطهر من امك وابوك<br />وبعدين اي جميل بتتكلم عنوو انتا نسيت ان شعب مصر هو اكبر شعب حرامي بالعالم ؟؟<br />والله كسفتونا قدام السياح انا مش عارف بييجو عندنا ليه كل مرة بيتسرقوو بس ده اكبر دليل ان انتو اللي ناكرين الجميل"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

