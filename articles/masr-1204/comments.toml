subject = "مسلم سنى"
author = "فوقوا من الكلام الخايب اللى انتوا بتقولوه الواد الخايب اللى النصارى افضل منه عرف يوقع المصريين مع السعوديين يا جماعة كلنا مسلمين انسوا موضوع ان انا مصرى وانت سعودى كلنا مسلمين وانا مصرى على فكرة لكن باحب السعودية اكتر من اى مكان فى الأرض لأن بها مكة والمدينة المنورة ومكة احب البلاد الى الله والى الرسول فكيف احب مصر اكثر منهما؟؟؟؟"
