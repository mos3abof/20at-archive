text = "مع الاسف كلنا عرب سواء مسلمين او اقباط لازم نكون ملتزمين من داخلنا قبل خارجناوبدل اهانتنا لبعض كل واحد يبدا بنفسه و من رايى ان الاحتشام بداية كويسة اكيد نهايتها احسن ولا داعي لاى مصرى اهانة اى عربى لان دى مش اخلاقنا"
