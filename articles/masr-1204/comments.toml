[[comments]]
order = 0
subject = "مقال جميل"
author = "شيماء"
posted = "2006-11-23"
text = "مقال جميل اختي الكاتبة<br />جزاكي الله خيرا و لو ان موضوع الارقام واسعة شويتين صعب ان واحدة تدفع في ربطة حجاب 1000 جنية الا لو كان فلوس اهلها حرام.<br />الي غايظني اكتر موضوع الميني جيب و الميكرو جيب الي تحته بنطلون بجد حاجة تقرف البنات عاوزة تقلد باي طريقة و السلام .<br />للاسف البنات مبقاش عندها شخصية و لا هوية مشتتة ما بين تقاليد المجتمع و مش حقول الدين ( لان الي يهمة الدين ميعملش كدة) و بين الموضات الغربية الي لا تناسب دينا و لا تقاليدنا و لا ازواقنا.<br />صراحة لما الظروف تضطرني اروح اي جامعة بروح بيتنا متنكدة من اوضاع البنات و الشباب و خاصة اني حاسة ان كل جامعة مصرية بقت مجموعة من الملاهي النهارية . ممكن الولد و البنت يعملوا اي شئ الا انهم يتعلموا او يتثقفوا.<br />احب اهني وزراء التعليم و التعليم العالي و المنيل علي عينه بتاع الثقافة , فعلا اصبتم الهدف و نفذتم الخطط كما خططت سيدتكم العليا اسرائيل.<br />و حسبي الله و نعم الوكيل."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

