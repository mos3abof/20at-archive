text = "كمان بتضرب مثال بالفايد اللي متجوز سعودية ههههههههه وليه عمرو دياب اتجز سعوديه انتو هتموتو تبقو سعوديين مش لايقين بس ده بعدك انتا واللي زيك<br />مسكين ياعبيط مهما قلت وممهما عدت مش هقول غير الله يشفيك من حقدك ومرضك ياغبي لانك بتحرق نفسك عشان تثبت حاجه هيا مش حقيقيه وراح تظل السعودية سبب بعد الله في اكل عيشك يامتخلف<br />على فكره دي اخر مره انزل من نفسي وارد علي واحد بهيمة زيك واخر مره افتح الصفحة دي لان مفيش فايده اتكلم مع حشرة حاقده<br />وروح كل فول وانتا ساكت عشان معندكش فلوس تاكل كبسة ولما يبقى عندك شوية فلوس هتاكل مره في الشهر كشري بس برضو مش هتدوق اللحمة اللي لماا تيجي السعودية ههههههههههه باي"
