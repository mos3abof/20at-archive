[[comments]]
order = 21
subject = "روحوا موضوع بدلة سيادته وترجموا التعليق العبري للعميل الصهيوني واتكلمو"
author = "مسلم مصري عربي"
posted = "2006-11-25"
text = "يا ريت أي حمار ما فهمش كلام إبن بهية يروح صفحة الموضوع بتاع بدلة سيادته .. الكي بورد الظاهر كان مقلوب عبري والعميل الصهيوني اللي كان مسمي نفسه مصري للأبد كتب تعليقه بالعبري يا ريتني كنت باعرف عبري عشان أترجمه لذا ارجو من أي واحد من اخوانا هنا يروح على موضوع بدلة سيادته ويترجم لنا الكلام اللي قاله هناك الكلب ابن الكلب الصهيوني ده وكفاياكم عبط وجهل وتخلف انا ما شفتش واحد من اللي شتمو الكلب العميل اللي مسمي نفسه مصري للابد شكر ولا قال كلمة حلوة في حكومة السعودية الكلام كان على شعبنا السعودي اللي هيفضل اخ لينا مهما عملوا الصهاينة الكلاب واتباعهم من اقباط وصهاينة اريكا الكلاب زيهم مصر والسعودية شعب واحد والسعودية يا صهيوني فيها مقدسات المصريين المسلمين اللي هم 95% من سكان مصر فهمتوا يا حمير / واا الحكومة السعودية كحكومة برضك حوش زي حكومتنا الوسخه لكن شعبنا المصري والسعودي الطيب مالو ومال كده"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

