[[comments]]
order = 23
subject = "خليكم بالموضوع الاصلي"
author = "ساميه"
posted = "2006-11-25"
text = "بسم الله الرحمن الرحيم<br />السلام عليمم<br />كنتم تتناقشوا بموضوع الحجاب وهو موضوع جيد والكلام فيه مفيد والاصح وبتردوا علي الاخ اللي الله يعلم جتسيته ايه تجاهلوا لان مشكله الحجاب اهم بالوقت الحالي لان اللي لبسه الحجاب دي لازم نكون قدوه محترمه وواجهه مشرفه لدينها دلوقتي انا سيده مسلمه اعيش بامريك ولدي بنت محجبه والله لما بنسافر مصر وتشوف البنات المحجبات بالقصه اللي من تحت الايشارب والنصف كم علب الحجاب والتي شيرن الملازق علي الجسم والجينز والصدر المفتوح علشان تظهر السلسله بتقرف الغريب هما لبسينه ليه دول كشفين اكثر مما سترواوبرضوا كل ده يرجع لللاهل اللي شيفبن بناتهم خارجين من بيوتهم ازاي حقيقي احنا بالغربه معظم الناس محافظه علي بناتها اكثر من مصر لازم الاهل بفوقوا شوايه لبناتها-<br />وشكرا"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

[[comments]]
order = 24
subject = "مرة ثانية الموت للسعودية الوهابية"
author = "مصرى للابد"
posted = "2006-11-25"
text = "يبدو ان السرطان الوهابى اصابكم جميعا<br />فاصبحتم تدافعون عن السعودية اكثر من مصر بلدكم الحقيقى<br />الى هذا الحد انتشر السرطان الوهابى فيكم ؟<br />انا لست صهيونيا بل مصرى وللابد<br />ولو اننى صيهونى حقا لشاركت فى نشر الوهابية فى مصر<br />حتى يصبح المصريون مجموعة من الهمج يسهل لاسرائيل سحقها<br />كما فعلت امريكا مع حركة طالبان التى جعلت الافغان يعيشون حياة القرون الوسطى<br />انتم اصبحتم لا تتبعون الرسول الكريم \"محمد بن عبد الله \" بل تتبعون نبى الوهابية \"محمد بن عبد الوهاب\"<br />هل يعرف احدكم شئ عن الخطة التى يجرى تنفيذها بدقة و التى تعرف باسم خطة \"مصرستان\"؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />افيقوا يا مصريييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييين<br />نعم انا اتمنى ان تقوم امريكا بسحق السعودية وازالة الوهابية من الوجود<br />قد لا يحدث ذلك فى عهد الرئيس الغبى بوش<br />فهذا الرئيس شديد الغباء يتحدث عن العراق كمحور للشر و لا يذكر دولة الارهاب الاولى فى العالم السعودية الوهابية<br />ومرة ثانية كمصريين ماذا يجب علينا ان نفعل لمحاربة السرطان الوهابى فى بلادنا ؟<br />التوقيع<br />مصرى للابد"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

[[comments]]
order = 25
subject = "عظيمة يامصر"
author = "لينا-السعودية"
posted = "2006-11-25"
text = "انتا يامصري للأبد أشك انك مصري<br />لأني انا سعودية وشربت من مية النيل مستحيل أني أقول كذا عن العرب بصفة ويامثقف لاتنسى بدو سيناء ولا تنسى أن الرسول صلى الله عليه وسلم كان يرعى الغنم واللي ينسى أصله ماله مستقبل واحنا نفتخرر بأصلنا ان احنا من البدوو فهم رمز الكرم والصدق والأمانة الا اذا كنت تشك في هويتك العربية هذا شيء ثاني<br />وأحيي كل الاخوة والاخوات المصريات لان مهماا قيل ستبقى مصر بحضارتهاا وثقافتها وطيبة أهلهاوكل مميزاتهاا في قلبي وقلب كل السعوديين .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

