subject = "لالا موضوع جامد"
author = "khaled"
posted = "2006-12-23"
text = "هاهاهاي ..اصل انا كمان مكنش عندي اي فكره عن موضوع اللفات دي وكنت فاكرها افتكسات بنات وان علاقته بالاقتصادو بالاعمال تقتصر علي ان الصين هي الي بتصنع الايشاربات دي و احناالي بنشتريها, علي كل حال ممكن نعمل كتلوج فعلا زي ما البشمهندس قال واهي تبقى سبوبه<br />ويجعله عامر"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130010311/http://masr.20at.com:80/article.php?sid=1204"

