subject = "لالامانة اقول"
author = "مصرى حتى النخاع"
posted = "2006-11-25"
text = "عندى مشكلة انا مصرى مسلم وعارف طبعا ان الحجاب فرض على كل بنت بالغة وكل المصريين المسلمين عارفين كدة<br />فين المشكلة الحقيقة المقال دة هوا المشكلة اللى صاحبتة برضة وبتصميم غريب عاوزة تحسسنا انهم ناس غيورين على الاسلام واحنا لا<br />انا مصرى ومش عامل حساب قوى للكلام المعقد بتاع الوهابيين اللى عاوزين اى حاجة علشان يظهروا فى الصورة امى واختى ومراتى محجبات ومافيش حاجة اسمها لفة ب20 ولا حتى بخمسة جنية يبقى اية لازمة الموضوع دة<br />اما الاخ اللى بيتكلم عن البترو دولار هوا طبعا فية ظاهرة المد السعودى مش فى الدين وبس دول بيشتروا البلد كلها وبكرة كلنا حيبقى عندنا كفيل<br />اما اللى ماشى ورا الدين الوهابى فالعيب مش فى السعوديين العيب فى الماشى وراهم<br />وربنا يستر"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

