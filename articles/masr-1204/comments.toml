subject = "يسلم فمك"
author = "LOLO"
posted = "2006-12-09"
text = "جزاك الله خيرا. فلو نظرت الآن حولك لوجدت أغرب من الخيال.أجمل ما قرأت من كلامك هو أن الحجاب معناه الإحتجاب عن الفتنة وليس جعله وسيلة للنظر إليك. ولذلك قال النبي الكريم أن الله تبارك وتعالى لا ينظر إلى صورنا ولكن إلى قلوبنا."
archived = "2006-12-12"
