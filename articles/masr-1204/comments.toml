text = "افتخر واعتز اني ولدت بالسعودية كما اعتز بوطنيتي تماما , والي كل حقود وعميل وخائن ان يلزم الادب في الحوار لان شعب مصر يحب بلد الاسلام السعودية كما ان السعوديين بيحبوا مصر ولن يفرق احد هذه المحبة ابدا واللعنة علي الاقباط الحاقدين."
