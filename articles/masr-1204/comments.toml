[[comments]]
order = 2
subject = "يا سلام"
author = "محمود"
posted = "2006-12-22"
text = "يا سلام , أنا ما كنتش أعرف ان الحكاية بقى ليها سوق قوى كده , كنت فاكر ان السوق مقتصر على بيع الايشاربات , انما لفها كمان !! ده شئ عظيم و الله<br />بس بصراحة ماقدرش أنكر انى عايز أشوف اللفات دى , خصوصا انى ما بحضرش أفراح كتير و ما باخدش بالى من الحاجات دى , فياريت تعملى مقالة كده زى الكتالوج اللى بييجى مع الشامبو و فيه توضيح لكل ربطه و كدة , و تبقى عملتى فى الشباب خدمة عظيمة"
archived = "2007-01-30"
capture_url = "https://web.archive.org/web/20070130010311/http://masr.20at.com:80/article.php?sid=1204"

[[comments]]
