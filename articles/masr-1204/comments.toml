text = "والله شغلتونا وشغلتوا الناس بموضوع الحجاب مش كفايه بقى دوروا على حاجة ثانيه .. اقول لكم اتكلموا عن الخمار .. بتشغلونا عن همومنا ليه .. هو يعنى البلد بقت على الصراط المستقيم ماناقصش الا الحجاب وجلابية الرجل القصيرة وتطويل الذقن و.... الخ والله كل واحد يعرف عندينه اكثر من اللى بيتاجروا بالدين فى الفضائيات واخرهم الوزراء .كفايه الموضوع اخذ اكثر من اللازم"
