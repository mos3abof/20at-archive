text = "ياسااااااتر على الغل بتاع السعوديين 00مكنتش متوقع انهم بيكرهونا للدرجة دى00<br />دانا ابويا اللة يرحمة ضيع عمرة من<br />بداية الستينات00يعلم فى التلاميذ البقر<br />الاغبيا اللى جابو لة السكر والضغط وامراض<br />الدنيا00وراح شهيد العلم هناك فى بلد<br />مناخها مميت قبل النعمة ماتحل عليهم ويركبوا00تكييف فى الدشداشة000<br />ومات اللة يرحمة ولم يترك لنا الا شقة مؤجرة00وسيرة طيبة 00ومبادئ اغلى من الماس<br />هودة جزاء المعروف والاحسان يهينونا00ويحقرونا؟00اللة يحرقهم بجازهم0"
