text = "طبعا واضح من شتيمتك في الشعب المصري ووصفه بانه حرامي وناكر لجميل السعودية وبتستهبل وتسمي نفسك الاسكندراني واضح أنك سعودي<br />مين اللي علمك وعالجك وخلاك شبه بني ادم مش المصريين وبعدين مين بيسرق مين ده انتو سارقين الاف المصريين اللي بيساعدكوا في تنمية بلدكم ومعظمهم بتاكلوا حقوقهم انت ها تحاول تخدعنا وتعمل نفسك مصري وبعدين بتقول ان الرسول كان بياكل بيده طب ماالرسول كان بيركب جمل ما تسيب السيارة وتركب الجمل يا"
