subject = "الحجاب فرض فى الاسلام"
author = "ما تفعله بعض الفتيات فى حجابهن من الاشياء التى ذكرتها الكاتبة ليس عيب الحجاب وانما عدم فهم من هؤلاء الفتيات لحكمة وجوب الحجاب وبكده بيحولوا أشياء فى الدين الى موضة والسلام ."
posted = "2006-11-23"
text = "هؤلاء يقدمن سورة سيئة للحجاب فتصبح فرصة لاخواننا البعدا عشان يتكلموا عن الحجاب بما لذ وطاب .<br />اما البنت اللى بتلبس الحجاب عشان شعرها مش كويس او بتوفر تمن الكوافير اعتقد ان الموضوع مش منتشر زى ما الكاتبة بتصور لان الموضوع فى الاساس دينى مش منظر للبنت ."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

