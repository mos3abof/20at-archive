[[comments]]
order = 51
subject = "نقاشات رائعة"
author = "مصرى حتى النخاع"
posted = "2006-11-27"
text = "الاخ يحيى رجل فاضل واضح انة عايش فى امريكا وعايش فى جو الوحدة العربية او الوحدة الاسلامية كلام جميل ياعم يحيى عشاناة طول عمرنا فى مصر لما كنت عايش فى مصر صفوت الشريف كان مفمنا اننا محبوبين من كل العرب وان الناس وخصوصا الخليجيين بيدوبوا فينا عشق وسافرت السعودية واكتشفت الحقيقة المرة الناس دول بيكرهونا جدا وحاولت احلل باعتبار انى باحث اجتماعى فى الاول افتكرت علشان فكرة الفهلوة الغبية اللى مالية عقول المصريين المغتربين وخصوصا الفلاحين واسمها الحقيقى السرقة من الكفيل لكن بعد فترة<br />اكتشفت اننا اقل الاجانب اثارة للمشاكل واكتر الاجانب تعرضا للبهدلة<br />الكفيل السعودى لايحلو لة الا بهدلة المصرى تحديدا باعمال دنيا واذا عرف انك مثلا عاوز تسافر يطلع عينك من القلق علشان يوافق مع ان دة حقك<br />عاوز اسال حضرتك اية المطلوب بالظبط نعمل زى عديم الكرامة اللى بيقولك السعوديين بيبهدلونا مش مهم احنا وهما حبايب<br />ماهو المطلوب من شعب بيكرهك وبيبهدلك<br />عاوز اقول انة كان فى موقع على الياهواا اسمة فضيحة كلة عبارة عن اخبار ملفقة زى صورة هبلة لمجموعة بنات وبيقولوا تحتها المجندات المصريات يهربن خلال دورة تدريبية فى اسرائيل وتحت صورة تانية لواحدة ومكتوب تحتها الفلاحة فاطمة فى احضان حبيبها كوهين<br />المثير ان الاعلامى عمرو اديب قال بالحرف الواحد ان الموقع دة كان يخص احد الخليجيين وتحديدا من القصيم وان وزارة الخارجية المصرية تدخلت مع الخارجية السعودية لقفل الموقع ؟<br />هوا الدين بيقول اننا نتشتم من اخرين ونسكت ؟<br />معتقدشى"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

