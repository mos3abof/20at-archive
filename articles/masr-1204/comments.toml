[[comments]]
order = 79
subject = "مصرى قومى اشتراكى"
author = "انا قرءت بعض التعليقات و ده ردى وياريت مايتقالش انى صهيونى"
posted = "2006-12-14"
text = "بالنسبة لمصرى جدا يا ريت ماتشتموهوش لان الجو العام العربى مصاب بنوبة جهل شديدة طويلة المفعول<br />بالنسبة لانى ضد نظام السعودية الوهابى فده لانى مش معترف بفرضية الدين الدولة بتاعة الوهابيين وغيرهم<br />لكنى طبعاضده فى حكاية ان امريكا(العدو الاكبر لنا) تضربهالان الراى يرد عليه بالراى<br />و بالنسبة للموضوع الاساسى فانا مش مع الوزير و لا ضده للدرجة بتاعتكم<br />انا كمسلم شايف ان الحجاب فرض لكن كانسان فلو غرضكم ان الحجاب يصبح قانون فانا ضده تماما فهذا امر بين الله و خلقه ليس لنا فيه شان<br />و بالنسبة للاصوات التكفيرية اللى بتخرج من العمم الفارغة من العقل فطبعا ضدها لان الرد لا يتم الرد عليه بالموت ولكن بالراى"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217100740/http://masr.20at.com:80/article.php?sid=1204"

[[comments]]
order = 80
subject = "عائم ضد التيار"
author = "فلاح مصري"
posted = "2006-12-16"
text = "نلاحظ في كل موقع تعليقات إن فيه واحد يطلع يعوم ضد التيار .<br />أعتقد إن الموضوع مقصود منه معرفة اتجاه الناس ورد الفعل لديهم .<br />أما تعليقات فهى سخيفة وغير مقبوله .<br />------------- فلاح مصري---------------"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217100740/http://masr.20at.com:80/article.php?sid=1204"

[[comments]]
order = 81
subject = "يا جمعه دول صهينه متنكريين."
author = "مصريه بتحب كل العرب"
posted = "2006-12-17"
text = "يا جمعه دول صهينه متنكريين...عملييين نفسهم سعوديين عوزين يفرقوا بيين العرب .المصريين هيفدلوا طول عمرهم بيحبوا كل العرب مهما حاول الحاقديين ان يفرقوا...اولا قاروق حسنى ده كل مصر عرفه انه gay شاذ جنسيا و مش متجوز يعنى مينفعش يتكلم فى الديين والحجاب..ثانياالمسحيين والصهينه كمان فى دينهم الحجاب ذى الراهبات و الصهينه كمان بيلبسوه...خلينا بس عندنا شويه شخصيه..على رأى المثل الكلب لما يهوهو محدش يرد عليه.."
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217100740/http://masr.20at.com:80/article.php?sid=1204"

