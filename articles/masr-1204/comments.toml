text = "الي لينا المريضة نفسيا<br />اولا:لو تعرفي الحقيقة لسوف تقولي ليا يا بابا<br />ثانيا: مصر انظف منك<br />ثالثا:الم تعلمي اسم مصر ذكر كام مرة بالقرأن<br />رابعا: الم يذكر الرسول محمد عليه الصلاة والسلام عن خير جند مصر واهل مصر, وتزوج الرسول محمد بماريا القبطية وكانت مصرية<br />مصر يا لينا هي قلبك العالم الاسلام ولولاها لانهارت الممالك الاسلامية."
