text = "الحجاب بقى اخررجعنا زى العرب بالظبط ايام الجاهلية كانوا يغطوا شعرهم ويظهروا رقبتهم علشان كدة امرنا اللة بالحجاب لكى ندارى عوراتنا واخ جاجة الاستاذة اكبال بركة طلعة تقول مش حتت الاقمشة دى اللى هاتدخلى الجنة وبتقول كمان انها هاتفضل لاخر يوم من عمرها تحارب الحجاب فينكم يا مسلمين ازاى تسمحوالكلبة زى دى انها تقول كدة على فرض ربنا فين بنات الاسلام الذين يخافون اللة فينهم يثبتوا ان الاسلام موجود فى قلوبنا ومنعملش زى تونس اصدرت منع ارتداء الحجاب يا حسرة على الاسلام والمسلمين"
archived = "2006-12-08"
capture_url = "https://web.archive.org/web/20061208024325/http://masr.20at.com:80/article.php?sid=1204"

