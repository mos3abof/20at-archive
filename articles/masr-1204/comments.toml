text = "و النعمة و حيات ربنا انت بنت سكر يا مى لانك قولتى كل الى انا عوزة اقولة من زمااااااااااان قوى مش من ساعة فاروق حسنىو زير السخافة ما اتكلم لا دة من ساعت ما الست مديحة يسرى ما قالت فى احدى القنوات الفضائية نفس الكلمة دى ان الحجاب مش فرض دة هبل و ان البروكة هى الى الفروض تتلبس علشان الشعر الاصلى ما يبانش بالزمة دة يبى اية ............. متهيئلى بدون تعليق احسن<br />اه يااااااااااااااااا بلد اه"
