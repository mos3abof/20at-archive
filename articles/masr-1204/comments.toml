[[comments]]
order = 12
subject = "أريد التعليق على ذلك الصهيوني المتنكر في شخصية معلق مصري"
author = "إبن بهية"
posted = "2006-11-24"
text = "أنا عمري ما علقت على أي تعليق لأي شخص ولكني أعلق بشكل عام ، أما اليوم وفي هذه المرة تحديداً أريد التعليق على ذلك الصهيوني المتنكر في شخصية معلق مصري وأخذ يسب ويلعن السعودية .. طبعا كلكم تقريبا فاكرين القضية التي أثيرت في عام 1999 و 2000 عندما كشفت بعض المصادر عن قيام الموساد الصهيوني بتدريب وإعداد الآلاف من شباب الصهاينة الناطقين بالعربية والقادمين إلى إسرائيل من المغرب ، مصر ، اليمن ، فلسطين ، لبنان ، سورية ، وغيرها من الدول العربية ولكن أكثرهم من المغرب طبعا بسبب كثرة اليهود هناك ..<br />المهم قام الموساد بتدريب ذلك العدد الضخم لكي يؤدوا عدة أدوار هامة كما يلي:<br />1 - تأسيس مواقع عربية وإسلامية بكل اللغات لإعطاء العالم صورة مغلوطة عن العرب والمسلمين.<br />2 - تأسيس مواقع عربية وإسلامية باللغة العربية لإعطاء العرب والمسلمين أنفسهم معلومات مغلوطة جدا عن دينهم وهويتهم وصولاً إلى حالة من الشك لدى الشباب العربي في تاريخه وأمته وحتى دينه.<br />3 - الدخول إلى المواقع الحوارية العربية والإسلامية لبث الفرقة والخلاف والفتنة بين أبناء الأمة من العرب والمسلمين.<br />يدخلوا على المواقع العربية الحوارية تحديداً بغرض بث الكراهية والحقد بين أبناء الأمة ، لذا تجد مصري يلعن أبو كل العرب وفلسطيني يسب السعودية وسعودي يلعن أبو الكويتي وهكذا .. طبعا هؤلاء كلهم في الأغلب الأعم من تلك الآلاف التي جندها الموساد لتفريق شباب الأمة وتشتيت تفكيرهم في مصيرهم الواحد وقدرهم الواحد ..<br />لا أستبعد أن يكون ذلك الأفاق الذي شتم السعودية واحدا منهم ، لأننا مهما اختلفنا مع حكومة السعودية سيكون اختلافنا كما هو مع حكومة مصر ولا يمكن أن نكره السعودية لأننا نكره حكومتها ، فهل كرهنا مصر بسبب كراهيتنا للواطي حسني مبارك وعصاباته ؟؟<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

