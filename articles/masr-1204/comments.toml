text = "مجرد ما واحد مصري هاجم النظام السعودي لقي هجوم كاسح من التعليقات من عملاء السعودية الذين أخترقوا كل الفضائيات والنت بشراسة واحد بيقول المصريين وحبيبتهم السعودية من أنتي السعودية حبيبة المصريين اللي ما شفوش منها غير كل وساخة داخل مصر من السعوديين وداخل السعودية بنظام الكفيل الاستعبادي نشطين فعلا عملاء السعودية في كل مكان"
