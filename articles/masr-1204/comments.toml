[[comments]]
order = 8
subject = "قبطي يسرق كنيسة العذراء بالقليوبية"
author = "قبطي يسرق كنيسة العذراء بالقليوبية"
posted = "2006-11-24"
text = "أمر أحمد عزوز مدير نيابة الخانكة بحبس سائق القس «يسطس فانوس» راعي كنيسة العذراء بالقليوبية ٤ أيام علي ذمة التحقيقات سرق خزينة الكنيسة وبداخلها ٤٥ ألف جنيه، وادعي أن مجهولين اقتحموا الكنيسة وارتكبوا الحادث كشفت المباحث غموض الواقعة وأدلي المتهم باعترافات تفصيلية في تحقيقات النيابة.<br />قال المتهم غبريال نادر عزيز «٣٥ سنة» إنه يعمل سائقاً للقس يسطس فانوس «بطرس» راعي كنيسة السيدة العذراء «مطرانية الأقباط الأرثوذوكس» بمنطقة ورش أبوزعبل منذ أكثر من ٥ سنوات تزوج قبل عامين وأنجب طفلة، تطالبه الزوجة بمصاريف بالغة تفوق راتبه الشهري، حاول الالتحاق بعمل إضافي إلا أن الوقت لم يسمح له.<br />ذات يوم شاهد السائق القس يسطس ومعه ٣ آخرون من مسؤولي الكنيسة داخل حجرة مبني الخدمات الملحق بالكنيسة وقفوا أمام خزينة حديدية، بابها كان مفتوحاً تظهر المبالغ المالية منه.. وقف السائق علي باب الحجرة اتخذ قراره بالاستيلاء علي تلك الأموال عاين المكان والحراسة الأمنية علي الحجرة حدد طريقة الدخول عاد إلي منزله اتصل بالقس وأبلغه أنه مريض واستأذن في الراحة واستقر القس داخل منزله هو الآخر. توجه السائق إلي الكنيسة غافل حارس الحجرة ويدعي جاب الله غالي سليمان وكسر زجاج الباب الداخلي المفضي إلي الحجرة حمل الخزينة ووضعها داخل حقيبة سيارة القس وعاد إلي منزله خبأ الخزينة في جدار خزان الصرف الصحي بداخل منزله ولم يفتحها.<br />وأضاف المتهم أنه ارتكب الواقعة نظراً لمروره بضائقة مالية كما أن المبالغ التي شاهدها في الخزينة أغرته واعتقد أنها ستحل له كل مشاكله واستمعت النيابة لأقوال حارس الحجرة والقس الذي قام بفتح الخزينة وأكد سلامة الأموال الموجودة به<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

[[comments]]
order = 9
subject = "في اجتماع خلف"
author = "في اجتماع خلف أبواب مغلقة"
posted = "2006-11-24"
text = "البابا يناقش فضائح جنسية مع كرادلة أميركيين<br />بابا الفاتيكان<br />يوحنا بولص الثاني<br />إدوارد إيغان<br />كاردينال في نيويورك<br />يجتمع البابا يوحنا بولص الثاني اليوم الثلاثاء مع كرادلة أميركيين لإجراء محادثات طارئة لم يسبق لها مثيل بشأن فضائح متكررة تتعلق بممارسات جنسية مع الأطفال.<br />وتواجه الكنيسة الأميركية اتهاما بحماية قساوسة لهم علاقات جنسية مع الأطفال ونقل قساوسة معروفين بالفساد من أبرشية إلى أخرى، في محاولة تستر هزت ثقة أتباع الكنيسة من بوسطن إلى لوس أنجلوس.<br />ولمواجهة انتقادات متزايدة لرد فعله الذي بدا بطيئا على هذه الضجة، استدعى البابا الأسبوع الماضي كبار رجال الدين الكاثوليك بالولايات المتحدة إلى الفاتيكان لإجراء مناقشات تهدف إلى وضع سياسات موحدة للتعامل مع القساوسة الذين يتورطون في ممارسات جنسية مع الأطفال. وقال رئيس مجلس الأساقفة الكاثوليك الأسقف ويلتون غريغوري للصحفيين قبل الاجتماع \"يحدونا الأمل أن تضمن هذه السياسة الطمأنينة\".<br />ويأمل بعض أعضاء الوفد الأميركي ألا تقتصر المناقشات على حدود الضرر الذي وقع، وأن تتناول أيضا موضوعات محظورة مثل إنهاء حرمان القساوسة من الزواج ومنح النساء دورا أكبر وفحص الشواذ المرشحين للعمل كقساوسة.<br />ووجهت الدعوة إلى جميع الكرادلة الأميركيين وعددهم 13 لحضور الاجتماع الذي سيعقد خلف أبواب مغلقة في الفاتيكان لمدة يومين، ولم يتخلف سوى كبير أساقفة واشنطن المتقاعد جيمس هيكي الذي قرر عدم الحضور لأسباب صحية.<br />وسيتركز جل الانتباه على كردينال بوسطن برنارد لو محور الفضيحة إذ يواجه مطالب متزايدة بالاستقالة بزعم أنه سمح لرجال دين معروف عنهم ممارساتهم الجنسية غير المشروعة بالهرب من العقاب عبر تغيير الأ<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

