posted = "2006-11-24"
text = "انا مستغرب جدااااااااا ان تعليقات بتتكلم على كون الحجاب عادة ولا موضه ولا اسهل من تظبيط الشعر والكل نسىامر مهم هو الدين<br />والاخت اللى من السعوديه اللى سعيده جدااااا ان السعوديات شعرهم ناعم وانهم بيتحجبو بس عشان التقليد ما اضعف هذه الامة التى حولت امرها من الاحتكام والعودة للامر الشرعى والدين اللى امر عاده وتقالد<br />لا حول ولا قوة الا بالله<br />العراب"
