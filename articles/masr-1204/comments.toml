subject = "تكملة للينا السعودية"
author = "مصري مصري"
posted = "2006-11-26"
text = "نسيت أقولك ان انا عارف السعودية بتفاصيلها أكتر منك وشفت القري والتخلف اللي عندكم مئات القري مفيهاش لا كهرباء ولا مياة طبعا الصرف الصحي مش موجود عندكم حتي في معظم جدة وشوارع كتير طافحة والتليفونات لا تصل الي هذه القري لا موبيل ولا ثابت و قمة في التخلف مش عارف حكامكم ال سعود دول بيودوا فلوس البترول فين علي الأقل مصر مش دولم بترولية بس كل البيوت في المدن الغاز واصل في المواسير للبيوت وما بنشتريش أنابيب بوتجاز زي التخلف اللي عندكم الغريبة أن اي عضمة يرموهالكم حكامكم اللي ناهبين كم تفرحوا أوي بيها وما حدش يكم يقدر ينتقدهم زي ما حنا بننتقد حكامنا كل اللي تعرفوه الله يطول في عم الملك وده لأن الوعي والثقافة عندكم منخفضة جدا وأخيرا كلي كبسة وأقعدي ساكتة"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

[[comments]]
order = 42
subject = "لينا مين والناس نايمين"
author = "مصري"
posted = "2006-11-26"
text = "ارجو من لينا ان تتفهم انها للاسف حماره بدويه متعلمة لانها لو تعرف الحقيقة لسوف تبوس يد كل مصري بالموقع.<br />للعلم فقط:<br />1)الم تعلمي يا لينا المريضة ان القطاع الطبي السعودي يعمل به اكتر من90 بالمائة من الاجانب اغلبهم مصريون.<br />2)الم تعلمي يا لينا التعبانه ان القطاع الهندسي عندكم اغلبه مصريون.<br />3)الم تعلم لينا المتخلفة ان القطاع الزراعي يعمل به المهندسون والعمال المصريون ولولاهم لكنتي اكلتي البلح واللبن فقط يا بدوية.<br />والمدرسين المصريين ايضا يعملوا بالمملكة وتخرج علي ايديهم ملايين السعوديين من امثالك.<br />سؤال ليكي يا لينا العبيطة( من بني مدينة دبي واسسهامع حاكمها وجعلها من احسن واغني مدن العالم؟؟؟؟؟<br />مش هو المليادير المصري محمد الفايد<br />خلاص بقي انا زهقت من الكلام واقولك يا لينا الغنم عايزك.<br />باي"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

[[comments]]
