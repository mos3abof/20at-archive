[[comments]]
order = 65
subject = "تعليق علي التعليقات"
author = "مصري يعيش بالكويت"
posted = "2006-12-05"
text = "في البدايه احب اعلق علي المقال بوجود شئ من الحقيقه في طريقه استخدام الحجاب بمصر بطرق غريبه بعيده كل البعد عن تعاليم الدين الحنيف وان كان في اسلوب المقال شئ من التهويل الا انه مقبول كأحد اساليب التعبير لتوضيح حجم المشكله<br />الا ان تعليقات الساده الزملاء قد تحتاج لتعليق اكثر من الموضوع الحقيقي للمقال فقد تخطي كثير منهم حدود الادب واللياقه وراح يرد علي كل من يستفذ مشاعر المصريين او مشاعر المسلمين بكلام دخيل دون التروي فما يقول بل وقد يعتقد البعض بهذه الردود السافره قد انضم لركب المدافعين عن الوطن والاسلام الا ان هذه الردود انما تنم عن ثقافه سطحيه للبعض ولم يأخذ في الاعتبار ان هناك كثير من الجنسيات والثقافات قد تطلع علي هذه التعليقات وتاخذ انطباعا سيئا عن المصريين ولا عجب اني اذكر هذا الموضوع لاني اعيش بدوله خليجيه واري مدي تاثير الامثله المسيئه لسمعه المصريين بالخارج الا ان البعض يتناسي ان كل ارض بها الطيب وبها الخبيث.<br />اما بالنسبه للاخت السعوديه والتي اصف بعض تعليقتها بالاندفاع ايضا وراء الرد علي التعليق الشيطاني الدخيل وتعرضت لوصف العناله المصريه بوجه عام دون النظر للامثله الطيبه والتي افنت نفسها لتقديم كل مهارتها من اجل ايصال ما تعلمناه بالجامعات والمدارس المصريه العريقه لكل ابناء الوطن العربي والارتقاء بمستوي التعليم دون اللجوء للبلاد الغربيه والتي لا تسعي الا لحقن عقول الناس بالفكر الغربي."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

[[comments]]
order = 66
subject = "غيرت رأى"
author = "تلميذة"
posted = "2006-12-06"
text = "اضحكنى تعليقاتكم الحلوة كلها بصراحة سينما هزأت السيدة لينا او الانسة وطبعا ده مش اسمها وطبعا لن اضيف لها تهزئ يكفى انها سعودية في حضانة لسه ما كبرتش وعندك حق يامصرى حتى النخاع فقد قمتم بالواجب معها واوضحتم لها واوضحتم لانفسكم ان خسارة فيهم فلوس العمرة والحج لانها اغنت هذه البلاد وناسيين انها فلوسكم اللى صرفتوها عندهم بالعملة الصعبة كمان ساكتفى بتلات اركان فقط من اليوم وهو الحل الامثل وسوف اعطى فلوس العمرة للغلابة بمصر احسن ما اديها للسعوديين ويشتمونى اديها لواحد محتاج عملية ولا ليتيم محتاج مساعدة ولا لدار أيتام ولا مستشفى السرطان اولى وربنا اكيد ح يسامحنى لانى بساعد بلدى اولى ولا ايه؟؟؟<br />والمثل بيقول اللى يحتاجه البيت يحرم على الجامع ولو كل واحد عمل كده سيل الفلوس ح يقل عندهم اصرفوا فلوسكم في بلدكم احسن واولي الغلابة عندنا على رأى لينا اولى بيها وبكده يمكن يجى اليوم وناكلهم اللحمة اللى بتقول عليها<br />امضاء تلميذة"
archived = "2006-12-08"
capture_url = "https://web.archive.org/web/20061208024325/http://masr.20at.com:80/article.php?sid=1204"

