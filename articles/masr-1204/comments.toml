[[comments]]
order = 37
subject = "الي لينا السعودية"
author = "مصري مصري"
posted = "2006-11-26"
text = "يا لينا أنتم محتاجينا اكتر ما أحنا محتاجينكم ده دور مصر من زمان انها تساعدكم ال الان وأظن لو انسحب المصريين من عندكم وانا رحت السعودية وعارف كويس 90% من اساتذة الجامعات مصريين و90& من الاطباء والصيادلة مصريين و95% من مدرسين المدارس الخاصة مصريين يعني لو انسحب المصريين لأغلقت جامعات ومستوصفات ومستشفيات وصيدليات ومدارس ومكاتب هندسية تعتمد علي المهندسين المصريين ومفيش اي دولة عربية اخري غير مصر عندها كوادر فنية تغطيكم العيب عيب حكومتنا اللي سمحت للمصريين بالعمل في السعودية في ظل نظام الكفيل الجائر لو حكومة وطنية ولو حسني مبارك عنده دم كان منع المصريين وكوادرهم الفنية من العمل في السعودية في ظل هذا النظام وكنتوا هاتحتاسوا وترضخوا لالغاء هذه التخلف هتقولي طب المصريين سافروا وجم عندنا ليه كل واحد له ظروفه وبيعمل حج وعمرة وبينظر لفترة السعودية علي انها أيام زفت وتعدي وبعد كده يرجع مصر وينساها اتمني تكوني فهمتي"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

[[comments]]
order = 38
subject = "مسكين"
author = "لينا-السعودية"
posted = "2006-11-26"
text = "اديك اعترفت انك انك منافق وحاقد :(<br />عدد سكان مصر 70 مليون بينما عدد سكان السعودية 20 مليون فمن البديهيات أن يكون عندكم عدد أكبر من الاطباء والمهندسين والمدرسين<br />عل فكرة انا بكالوريوس لغات اجنبية- ُEnglish department ولا مصري درسني كلهم سعوووووديين دارسين في هارفرد وكامبردج وغيرها مع كم دكتور اردني وواحد بريطاني وصراحة افضل السعودي لأن أفضل من ينطق the American & the British accent هما من السعوديين فقط:)<br />وبصراحة ايضا عمري ماوثقت في دكتور مصري الا مرة واحدة فقط للامانه برضوو افضل الجنسيات التانية<br />كان عندي مدرسة واحده مصريه درستني وبصراحه مكنتش بفهم حاجه منها ههههه بس لما غيروها وحطوو سعودية فهمت بسهولة لأن احنا بتهمنا برضوو حكاية الضمير في الشغل اللي مش بشوفها من ناس كتيرر عندكو<br />وبصراحة شديدة انا كنت بشتغل في مدرسة خاصة وراقية جدا وطبعا كنت بدرس لغة انجليزية تخيل يا اخي الكريم وتقدر تتصل بنفسك وتسأل ممنوع منعا باتا التعاقد مع مصريات بسبب عدم اتقانهاا اللهجة الاجنبية<br />وبعدين انتا بتقول لو كنتو مش موجودين في بلدنا كان احنا قفلنا مدارسنا وكلياتنا لا احلف ههههههههههههههه احنا عندنا ناس كتيرة بتشتغل غير المصريين عندناا كل الجنسيات بس انتا حاقد عليهم عشان بياخدو رواتب مننا وانتا لا الحقد مش كويس يا اخي العزيز بعدين هتتعب متبصش فوق<br />انا مش بعمل زيك وبشتم بس دي حقايق لازم انتا واللي زيك يعرفها لان شكلك الظاهر مش عارف ايه هو الوضع وشكلك بتقول كده لما ملقيتش عقد عمل في السعودية وأحسن عشان السعودية مش ناقصه قر وحسد قل اعوذ برب الفلق<br />كل دولة فيها الجيد وفيها السيء بس مش لدرجة اني اكره بلد عربي مسلم عشان فيها سلبيات لا حتى احنا وكل دولة في العالم فيها<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

[[comments]]
order = 39
subject = "الي لينا السعودية"
author = "مصري مصري"
posted = "2006-11-26"
text = "ما تحاوليش تعضي اليد اللي أمتدت لكي وليكم بالمساعدة لأن دي صفة ناكري الجميل ده الكلب عنده وفاء اكتر من كده علي كل حال انا بتكلم عن حقائق تاريخية موثقة وأسالي ابوكي سابقا كا كل المدرسين عندكم والموجهين والمديرين في المدارس مصريين بل الي الان لسه مناهجكم قريبة من مصر اللي حطتها لكم ولما مشي المصريين من المدارس الحكومية باعتراف السعوديين أنفسهم انهار التعليم لأان المدرس السعودي ماعندوش ذمة وناجح أصلا كسياسة دولة عندكم لازم الكل ينجح عشان بسرعة نسعود الي الان أمامكم 300سنة عشان تسعودا القطاع الطبي وعلي فكرة بتقولي أنكم بتنطقوا لغات كويس تعرفي هما مأنعين دراسة اللغة الفرنسية في المدارس عندكم ليه عشان لسانكم البدوي التقيل أستحالة يعرف ينطقها وبعدين بتقولي انتم 70 مليون واحنا 20 مليون بس دي مش حجة ان ميبقاش عندكم كوادر فنية وترفوا تعتمدوا علي ا نفسكم وتشغلوا بلدكم علي سبيل المثال تونس أصغر منكم بكتير في عدد السكان ومكتفية ذاتيا كل ما في ألار أنكم شعب بليد وفاشل ثانيا لا يوجد ما يستدعي للحقد عليكم طبعا الحياة في مصر احسن واسلس من عندكم 100مرة ولو مكانش السعوديين عارفين كده مكانش في 300000 ثلثمائة الف شقة وعقار اشتراها سعوديين في أنحاء مصر للاقامة شبه الدائمة واخيرا لا تحاولي مرة أخري التطاول علي أسيادك المصريين حتي لا يدعسوكي تحت أقدامهم"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

