text = "مصري اصيل<br />Don't talk about Saydna Muhammed and What God said in Qur'aan while calling someone you haven't met bad names.<br />STOP THE HATE ARABS, LEMO NAFSOKO GATKO NEELA, People in the EU unite when they don't share the same language/religion/race like we do<br />Ette2o Allah, o mosh kol balad te3ish fe door Sha3b Allah el mokhtar<br />The one who would start the apology is far better<br />LEARN, BEHAVE, UNITE, WORK TOGETHER, COLLABORATE, PRODUCE, SHARE YOUR POWERS AND STRENGTHS<br />And come on, Saydna Muhammed never called someone a Mul7ed, why do you ?"
