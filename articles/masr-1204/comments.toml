[[comments]]
order = 47
subject = "الاخت لينا .... والحقد"
author = "مصرى حتى النخاع"
posted = "2006-11-27"
text = "الاخت لينا السعودية كالمعتاد داخلة تتكلم عن الحقد والغيرة والحسد على السعوديين والغريب فى الموضوع ان كل السعوديين دايما بيتكلموا فى نفس الموضوع ........ طيب<br />1-واضح ان فية سوء فهم كبير لما الاخ المصرى كلم حضرتك عن وجود مدرسين وموجهين مصريين انتى قلتى ان مافيش حد درسلك من المصريين وتهكمتى على ان المدرسة المصرية مفهمتيش منها والحقيقة الاخ بيتكلم عن السعودية مش عنك اقصد تفهمى او متفهميش مش مهم فية ملايين غيرك فهموا وحبوا المدرس المصرى بدليل استجلابهم سنة ورا سنة لغاية ............<br />2- انا عايش بالسعودية والاخوة السعوديين شعب انطباعى بمعنى انهم فجاءة الجيل الجديد منهم مبقاش يحب المصريين ودى حقيقة لابد نعترف بيها بل بالعكس بيتفننوا انهم يضايقوا المصريين وراجعوا كلام لينا تتاكدوا المشكلة لما شعب زى المحترمة لينا يشترى فى ارضك ويستثمر فى بلدك حتتعامل معاة ازاى........ واحد شايفك غبى وهوا حسن منك ومستواة خدام عندة ازاى حتتعامل معاة<br />3-مش بس السعوديين اللى عندهم مشكلة مع الاسف احنا كمصريين بقينا نتكلم كتير ونعمل قليل فى مجتمع تغيرت موازينة تماما ........ امريكا حولت الدنيا لراسمالية فاصبح من يملك هوا السيد واصحاب التاريخ والقيم باى باى<br />4- السعودية ولينا عبارة عن نموذج للعربى لما يفهم او يتخيل انة فهم<br />ممكن مرة واحدة فى حياتنا كمصريين نقفل علينا الباب ونبطل تفاهات ونقاشات عقيمة ونعمل حاجة لصالح بلدنا قبل ماييجى لينا واصحابها ويحكمونا"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

