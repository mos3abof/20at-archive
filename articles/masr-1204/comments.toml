text = "المرة لسعودية المهجنة بدوى على غربى مسز الشيخة لينا000 اللى بترطن بلغة اسيادها00عارفة ومقرة من جواها انها عبارة عن صرصارة حقيرة جنب هرم عالى اسمةمصر والتلاتة ابيض اللى مسكتهم هى واهلها من بيع الزيت الوسخ اللى شبة وشوشهم رايحين فى الكازوزة وحيخلصوا وهم يا مولا ى كما خلقتنى لا زرع ولا ضرع ولا حضارة ولا تكنولوجيا00 وبراميل الزيت الوسخ اللى فى ارضها بالكامل 00ماتساويش نقطة من نيل مصرولا ترابة من دلتاها 00<br />ولم يعدى الزمن والبدوية يبقى اسمها لينا وتقول للمصريين بلاش تبصوا لفوق وروحو كلو فول 00ولما تبقو سعوديين تكلو لحمة 00لما يلف الزمن ونسمع كدة 00نطمن ان ان دى نهاية الدورة 00وان الامور حترجع تانى زى اصلها و ان المقشفين والهمج من جرذان الصحراء حيرجعوا لاصلهم اللى هم عارفينة كويس ومش عايزين يفتكروة000قريب اوى يا لبنا00حتسرحى بالغنم تانى<br />وابوك المعفن اللى عامل كفيل وبيتطنطط على اسيادة00حيشحت تانى جنب الحرم0<br />والحقدوالغل مش من طبعنا 00اللى نعرفة ان الاعراب اشد كفرا ونفاقا00 وموتى بكفرك ونفاقك00 وخلى الدبلومة الاميركية تنفعك0"
archived = "2006-12-05"
