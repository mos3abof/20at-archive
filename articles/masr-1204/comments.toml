posted = "2006-11-24"
text = "الفنان يكون حساس وشفاف وعندة نظرة وسيادة الفنان الوزير محروم من هزا الوصف وانما يكون فنان لو لعب فى الطين كالاطفال على شط الترعة وياكل من الطين كالسفهاء والمجانين ووزير الكوسة فى عهد الكوسة اللى بتطغى على البلد فى هزة الايام وربنا يخلصنا من هزة الشزمة"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

