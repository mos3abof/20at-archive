text = "اولا انت من موقع المبرشمون متحدون والذى يديره المشرشح عدلى ابادير وهو المطعون فى وطنيته وسبق ان سجن لاتهامه فى قضيه الفساد الكبرى للصناعه للورق بقوس وهو استهزأ بدماء الشهداء فى حرب 73 وموقعهم يضم غجر المهجر وهم منبطحين تماما وهم يعملون خدم لدانيال بيبس وهم استضافوا فى موتمرهم لبيع الشرف النائب الامريكى الذى طلب ضرب مكه بالنووى ..وهم يفرغون حقدهم على السعوديه وفى الحقيقه على الاسلام ! وهم ضلوا بشريعه المسيح تجدوهم مبرشمون مهاويس !وعدلى يدفع ايضا لبعض الاوساخ امثال عبد الكريم نبيل...ومن يدعى انه مصرى للابد هو على استعداد ان يبيع شرفه من اجل العماله للاجنبى وهم من الطابور الخامس الذى سيرحب باى اجنبى يغزو مصر ودا فى المشمش وخيالهم المريض المبرشم"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

