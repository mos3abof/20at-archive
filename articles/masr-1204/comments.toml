subject = "الزى الاسلامي"
author = "بسمة"
posted = "2006-11-23"
text = "النقطة الاخيرة في موضوعك مهمة جدا وهي عدم اباز المفاتن وده الغرض الاساسي من الحجاب ان لاتلفت السيدة او الفتاة نظر الاخرين لجسدها وعموما مافيش زي اسلامي مود في السودان و موريتانيا واعتقد بلاد اخرى زيهم مختلف عننا المهم زى ما قولتي انه لايشف ولايظهراى شيء انا راى ان البنت ممكن في البداية تجرب اسياء متنوعة لغاية ما بالتدريج ها تلاقي نفسها مش راضية و غير مكتفية بالحشمة بس كمان لازم نراعي ان الزى لايكون عائقا علشان يكون سهل في الحركة و كمان ما يجرجرش نكس للدولة الشوارع يعني برضه يا مي لازم يكون فيه تطور"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210305/http://masr.20at.com:80/article.php?sid=1204"

