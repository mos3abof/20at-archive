posted = "2006-11-28"
text = "قلت لك انا أعرف السعودية أحسن منك وأنتو أكتر ناس بتاكلوا فول وعيش تميس وروحي اقفي امام أي محل فول عندكم تلاقيمعظم اللي بيشتروا سعوديين وعلي فكرة كنتوا لحد قريب عايشين علي التمر وحليب الابل بس وكان الرز ده بتعتبروه نوع من العلاج وأسالي أبوكي وعمك وانت تعرفي حقيقة أصلكم وعيشتكم طبعا دلوقتي بتاكلوا رز الكبسة بأيديكوا زي الحيوانات روحي يابت أغسلي ايديكي وقلبك من الوساخة وبعدين أتكلمي مع أسيادك المصريين يا ناكرة الجميل"
