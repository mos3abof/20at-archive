author = "لماذا انا منقبة ؟"
posted = "2010-02-07"
text = "غض البصر فضيلة اسلامية وهناك احاديث شريفة واضحة تأمر بغض البصر<br />ولكن بجاحة الاولاد وضعف التربية وانعدام الوازع الدينى وسوء الخلق احيانا تجعل الرجل او الشاب يجلس امام المرأة او الفتاة يقتحمها بعينية بنظرات جريئة وقحة واحيانا يركز بنظراتة على جزء معين من الجسد مع ظهور علامات الاشتهاء والحيوانية على وجهة مصحوبة بتعليقات جنسية او بهيمية تجعل الفتاة او المرأة تحس بالحرج وكأنها تريد ان تقول يا ارض انشقى وابلعينى<br />بل ان بعض العواجيز من الرجال من يتلصص بعينية فى محاسن النساء<br />من هنا ولشدة حياء بعض الفتيات او السيدات يلجأن الى النقاب<br />وحين يتأدب المجتمع ويتقيد باخلاق وفضائل الاسلام يحق للفتاة ان تمشى امنة مطمئنة<br />فى الحديث الشريف<br />نهى الرسول عن الجلوس فى الطرقات<br />فرفضوا<br />فقال لهم ادوا حق الطريق<br />سالوة - وما حق الطريق<br />قال<br />رد السلام وغض البصر<br />لحمنا ليس مستباحا لكل متطفل يقتحمنا بنظراتة الوقحة - هدانا اللة وياكم جميعا"
archived = "2010-02-09"
