subject = ""
author = "دبلومه في الشحاته"
posted = "2009-07-29"
text = "دي بقا دبلومه سهله خالص بس محتاجه شوية حداقه<br />تخطفلك شوية عيال ما هو اصل العدد بقا في اللمون واصبحنا 80 مليون والحكومة مش عارفه تأكلهم<br />المهم<br />تخطفلك شوية عيال وتعمل فيهم عاهات مستديمه وتسرحهم ويجبولك كل يوم اخر النهار الغله<br />او لو كنت قلبك رحيم شوية سرحهم بمناديل كلينكس<br />او يشحتوا كده بدون عاهات زي ما بنفوش في مترو الانفاق<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــ<br />مش دعاء الشامي ولا دعاء حسن"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805112544/http://www.20at.com:80/masr/t7kyk/12789--2.html"

[[comments]]
order = 1
subject = ""
author = "دبلومه في الدين"
posted = "2009-07-29"
text = "دبلومه مهمة جدا سواء كان دين اسلامي او دين مسيحي<br />ـــــــــــــــ ـــــــــــــــ<br />مصر دي اصلها مسيحية والمسلمين اغتصبوها ولازم نرجعها مسيحية تاني واديلوا جمع تبرعات جمع تبرعات والحسابات في بنوك سويسرا اصبحت بالملايين والمسيحيين الهبل عمالين يدفعوا<br />ـــــــــــــــ ــ<br />الحاكم فرعون ووزير الداخلية هامان والجيش جيش فرعون<br />ان فرعون وهامان وجنودهما كانوا خاطئين<br />اعلنوا الجهاد ضد فرعون اجمعوا تبرعات واعلموا جرايد ومجلات وبيعوا كتب ورشحوا نفسهم في مجلس الشعب<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــ<br />مش احمد الهواري ولا عبدالله الطحاوي"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805112544/http://www.20at.com:80/masr/t7kyk/12789--2.html"

[[comments]]
order = 2
subject = ""
author = "دبلومه في التمثيل"
posted = "2009-07-29"
text = "التمثيل بقا دا مش محتاج شهادة خالص زي الصحافة دي مسالة موهبة<br />ازاي يا حبيبي تعرف تمثل وتبقى واحد اهبل كده وتعمل حركات علشان الناس الهبل يضحكوا زي عادل امام كده واحمد حلمي<br />وانتي يا اختي تعرفي تمثيلي وتعملي مشاهد ساخنه يبقى تمام اوي<br />يبقى كله في التمام والاجرة 5 مليون وانت طالع<br />يلا بقا انت وهو وهي اديلوا مشاهد ساحنه زي فيلم كده احكي يا شهر زاد واهو الشعب اهبل وعبيط وحيكسر شبابيك التذاكر<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــ<br />مش رضوى حسن ولا مروى صلاح"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805112544/http://www.20at.com:80/masr/t7kyk/12789--2.html"

[[comments]]
order = 3
subject = ""
author = "دبلومه في الفهلوه"
posted = "2009-07-29"
text = "هي دي الدبلومة اللي تأكل عيش تمام<br />اذاي يا واد تعمل فلوس على الطاير وتطلع الفلوس من جيوب الناس<br />ناخد مثال<br />العيال بتوع قناة موجه كومدي قالوا نعمل قناه نضحك فيها الناس الهبل وعملوا فيها فوازير<br />1) بايره الخطبه<br />2) سرحان ونفيسه<br />3) المفتش كرومبو<br />4) والغنية دي تبقى بتاعة مين<br />وشوية الغاز اخرى<br />ودي بقا تعتمل على الاتصال اه يا حبيبي اتصل بينا علشان خاطر تقولنا الحد او ابعتلنا ماسج وقولنا الحل<br />ودا كله علشان خاطر سرقة الرصيد والشعب الاهبل عمال يدفع<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــ<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805112544/http://www.20at.com:80/masr/t7kyk/12789--2.html"

[[comments]]
order = 4
subject = ""
author = "دبلومه في السمسره"
posted = "2009-07-30"
text = "دي بقا شغلانه حلوه اوي تشتغل سمسار<br />ومش محتاجه راس مال ولاحاجه<br />اعلان في الجرايد كده ولا حاجه<br />وتكتب فيه نبيع ونشتري اراضي في جميع انحاء الجمهورية<br />ويجيلك الزباين لحد عندك<br />وتلطشالعملة بتاعتك<br />ما هي العمولة 10%<br />والشقق التمليك كذلك<br />ودي عايزه واحد يكون بلطجي ومش لاقي شغل وحبذا لو يكون خارج من الجيش<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــ<br />مش ححبك"
archived = "2009-08-05"
capture_url = "https://web.archive.org/web/20090805112544/http://www.20at.com:80/masr/t7kyk/12789--2.html"

