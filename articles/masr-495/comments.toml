order = 0
subject = "كويس"
author = "ياء"
posted = "2006-06-10"
text = "كويس ان الحكومه المصريه لم نقدم اعنذار بسب الازعاج قلى عملناه لئسرائيل<br />فكرونى بتهمه كانوا وجهوها لبعض الشباب من قبل وهى الهتاف ضد دوله صديقه وهى اسرائيل<br />http://yehia2784.blogspot.com/"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909121321/http://masr.20at.com:80/article.php?sid=495&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "لا حول و لا قوة إلا بالله"
author = "مصطفى"
posted = "2006-06-11"
text = "في رثاء جنودنا او في رثاء انفسنا لا ادري<br />لقد تم ضربنا بالنعال هنا في مصر و تم اهانة المصري في بلده فمن الطبيعي ان يقتل جنودناالإسرائيلين ولا عزاء للأحياء<br />ولا املك إلا ان احتسب موتانا من الشهداء<br />وان ادعو الله ان يرحمنا من هؤلاء المعتدين في الداخل و الخارج"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909121321/http://masr.20at.com:80/article.php?sid=495&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "على راي المثل"
author = "عبدالله مفتاح"
posted = "2006-06-11"
text = "طيب حتى لو بينا شجب واستنكار شكلنا وحش اوي<br />ايه المصريين ملهمش ثمن؟<br />اي منظر اي حاجه متسبوش الناس تموت كده وتسكتوا<br />فضحتونا"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909121321/http://masr.20at.com:80/article.php?sid=495&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
