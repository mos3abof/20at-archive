author = "هارون عمايرة/ فلسطين"
posted = "2009-06-25"
text = "تعليقي هنا على هذا التقرير يأخذ شاكلتين<br />الاولى في الدولة الحديثة التي تسكح بذلك وتزيد من انتشاره حتى اننها تقلل من الضرائب الفروضة عليه حيث اصبحت علبة البيرة ارخص من علبة الكولا<br />والثانية في دور افتائنا المنتشرة على طول طرقاتنا ونحن ذاهبون للمسجد والتي ما زالت تتمجد في بطولات اسلافنا رضوان الله عليهم جميعاً ولا تتمجد في بطولات مشايخنا في نشر ثقافة الابتعاد عن المنكرات مهما كان شكلها نوعها<br />بارك الله في كاتب هذا التقرير واجزاه عنا وعنكم حسن الثواب"
archived = "2009-08-25"
capture_url = "https://web.archive.org/web/20090825184240/http://www.20at.com:80/20at/7ayatna/12448-2009-06-23-10-46-24.html"
