posted = "2009-06-25"
text = "تحياتي الى الاخوه القراء والاخ الكاتب الاستاذ فؤاد<br />لا أعتقد ان فرض القوه وان كانت شي يذكر في هذا المجال هي الحل بل توعيه الشباب ثم توعيه الشباب ولا اعتقد ان هنالك سيطره دينيه في الشارع العراق بل سيطره اعلاميه دينيه والمهم والاخير وكما يتداوله الشارع العراقي (((( المايسوكه مرضعه سوك العصا ماينفعه)))) تحياتي"
