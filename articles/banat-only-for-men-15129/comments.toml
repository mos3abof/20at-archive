text = "اقتباس master:<br />تهنئه منى ليك ع الكلام الجامد ده يا اخى انتا قولت كل اللى ف قلبى وعلى فكره انا من اسكندريه واخدت خطيبتى الحسين واشتريت الشبكه انا وهى من هناك وعلى زوقى وزوقها وكلام ف سركو كده اقل من ماكنت عامل حسابى عشان هى اللى يخليهالى قالتلى لا ياخطيبى —- كفايه كده وباباها قاللى انتا تعبت نفسك ليه كفايه اننا بنشوفك ومامتها قالتلى تعيش وتجيب بس والله مكنش له لازمه التكاليف دى واخوها قاللى عاوز فلوس واخواتى الاولاد والبنات جمعو من بعض وجابو شبكه تانيه وعملنا حفله عائليه كان فيها 7 اشخاص بس ف البيت عندهم ودلوقت انا متجوز من شهرين وعندى عمر ومريم زى القمر هههههههههههه سامحنى يارب<br />هههههههه ولحقت ما شاء الله تجيب عمر و مريم في شهرين 2 بس<br />ربنا يخليهملك وتفرح بيهم ان شاء الله"
