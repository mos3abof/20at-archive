text = "كدا كدا فى النهاية<br />الدهب دا هيبقى فى بيته بعد كدا يعنى لو حب يتصرف فيه هيجيبلة ضعف التمن اللى دفعه فيه وقتها وفعلا دا حقيقى<br />والبنات كلها مش كدا<br />ولو الشاب كويس ومحترم والله الواحد بيراعى فى كلللل حاجة<br />المهم الشخص بجد<br />ولو البنت كويسة والشاب كويس واهلهم محترمين<br />يبقى والله مايفرق اى حاجة لا دهب ولا خطوبة تتعمل بالشئ الفلانى<br />المهم التقدير<br />عيد النظره تانى<br />عشان دا ظلم صعب اوي لكل بنت واهلها"
