[[comments]]
order = 19
subject = ""
author = "بستانة"
posted = "2010-02-21"
text = "اقتباس بستانة:<br />ع فكرة بعض الكلام صح وحصل مع اصحابى ان الاهل يشطرتوا ان لو بنت الخالة جالها مثلا شبكة ب10البنت الى تتخطب بعديها تكون اكتر والله ده حرام لان ظروف كل واحد مش ذى التانى والله انا مخطوبه واهلى قالوا لخطيبى دى هديتك ليها ومحدش حدد مبلغ هو الى قال التمن واهلى قالولوا يابنى التمن الى انت محدده مش هيزيد عليه جنيه واحدو ويوم شراء الشبكة انا وهو بس الى نقينا الشبكة دون تدخل حد من اهلى او اهله وع فكرة والله مش بالدهب ولا العفش ولا اى حاجة من دى كفايه انه يكون بنى ادم محترم يراعى ربنا فى الواحدة وموضوع الشبكة تكون عند مين اعتقد انها تكون عنده وهديته دى تتقدم يوم الخطوبة انا حصل معايا كده"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309065624/http://www.20at.com:80/banat/only-for-men/15129-2010-01-31-14-53-47.html"

