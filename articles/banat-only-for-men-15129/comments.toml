text = "على فكره بقى انا مخطوبه واهلى قالوا ديه هديه منه ليها ومفيش حاجه من ديه حصلت بالعكس روحت عند الجواهرجى اللى تبع اهل خطيبى وعادى خالص انا عرفت امكنياته وجبت على اساسها وعملت خطوبه ازيد من ثمن الشبكه نفسها وعادى خاااالص ولا حد فكر يسال جبتى منين ولا بكام ولا عملتى خظوبه بكام محدش ليها عندى ولا عند اهل خطيبى حاجه وكل واحد فى حاله"
