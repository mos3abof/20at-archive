posted = "2010-02-17"
text = "هههه يا سلام ده ياعينى البنات دلوقتى لا بيتشرطوا ولا غيروا ويجى العريس حاطط رجل على رجل ويقول هو فى [ *** ]ان اليومين دول وامه تبقى حاسة انها مخلفة توم كروز ومافيش احسن من مواصفات ابها حتى ولو كان كله عيوب وانه فرصة بالنسبة للعروسة وخسارة فيها وتقعد تتشرط هى وابنها وترسى فى الاخر على دبلة وتبقى عايزة ام العروسة تنهار لما تشوفها وتفرح بيها ياعم ده انتوا حاجة تفرس"
