[[comments]]
order = 16
subject = ""
author = "master"
posted = "2010-02-18"
text = "تهنئه منى ليك ع الكلام الجامد ده يا اخى انتا قولت كل اللى ف قلبى وعلى فكره انا من اسكندريه واخدت خطيبتى الحسين واشتريت الشبكه انا وهى من هناك وعلى زوقى وزوقها وكلام ف سركو كده اقل من ماكنت عامل حسابى عشان هى اللى يخليهالى قالتلى لا ياخطيبى —- كفايه كده وباباها قاللى انتا تعبت نفسك ليه كفايه اننا بنشوفك ومامتها قالتلى تعيش وتجيب بس والله مكنش له لازمه التكاليف دى واخوها قاللى عاوز فلوس واخواتى الاولاد والبنات جمعو من بعض وجابو شبكه تانيه وعملنا حفله عائليه كان فيها 7 اشخاص بس ف البيت عندهم ودلوقت انا متجوز من شهرين وعندى عمر ومريم زى القمر هههههههههههه سامحنى يارب"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309065624/http://www.20at.com:80/banat/only-for-men/15129-2010-01-31-14-53-47.html"

[[comments]]
order = 17
subject = ""
author = "emy_moon"
posted = "2010-02-19"
text = "على فكره كلامك حلو اوي بس انا اتخطبت لابن عمي والمفروض ان نجيب الدبل وبعدين اكتشفت اني مش ها اروح معاهم وفعلا اخته اتصلت تقول ميعاد الخطوبه اللي تناسبهم واللي تناسبنا غصب عنا<br />ماما قالت اوك قولتها انا اساليها عن الدبل قالتلها مامه ها تجبهم معاها قالتلها طيب خدو العروسه اللي هي انا علشان تعرفو مقاسها قالت لا ها نقيس على يد اختي وفعلا لبسوني الدبله وتونز وخاتم بس بجد الدبله كانت مش حلوه خالص ورضيت وسكت علشان دي هديه<br />ما سكتوش اكتشفت انهم جابو الانتريه وغرفة النوم قبل الخطوبه سكت<br />واكتشفت انهم بيدهنو الشقه اللي مفروض تكون شقتي ومن ما يخدو رايي سكت<br />وفي الاخر جابو السفره من غير ماياخدو رايي ولا راي العريس وكمان فهمت انه ضعيف الشخصيه وفسخت<br />انا رايي لما العريس والعروسه يكونو متفاهمين مالهمش دعوه الاهل هم اللي يختارو ويجيبوا علشان دي حياتهم هما"
archived = "2010-03-09"
capture_url = "https://web.archive.org/web/20100309065624/http://www.20at.com:80/banat/only-for-men/15129-2010-01-31-14-53-47.html"

