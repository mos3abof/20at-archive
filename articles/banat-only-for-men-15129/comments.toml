text = "حلو اوى الموضوع على فكرة<br />بس كنت خد خبرات بناتى معاك<br />يقولوا لك ان في بلد زى كفر الشيخ الجواهرجى بيدى العروسه شفشق بلاستك تملاه دهب<br />اه والله<br />ولازم يروح مع العروسة ميكروباص كامل<br />والعريس يلبسها الشبكه عند الجواهرى (بدل حفله للشبكة)<br />وان الناس اللى بتجيب شبكة ب15 الف والله منهم الفلاحييين ويجيبوه عيار 24<br />اما الطبعة المتوسطة خريجة المدارس اللغات بس مش من الأثرياء بيجيبوها ب5<br />والناس بتفتكر ان اللى ب5 ولا 7 دول فقرا مش فاهمين الفوله<br />تحياتى لك"
