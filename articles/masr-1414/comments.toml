subject = "هو شعب مصر كده"
author = "تيموووو"
posted = "2007-01-08"
text = "اولا احب اقول انى اهلاوى جدا ولو لم اكن اهلاوى لوددت ان اكون اهلاوى .. اما اخوانا بتوع الزمالك اللى من ساعة متش الاهلى والاسماعيلى مخولص وهما هاتك يا ردح وشماته وهذا يدل على ان الاهلى كان فارسهم وغايظهم وهو شعب مصر كده يحب اى جنازة ويشبع فيها لطم<br />يظهر انا اخوانا بتوع ميت عقبه نسيو متش الحرس 5 صفر ونسيو المصرى 2 صفر ونسيو الرجاء 3 صفر ونسيو الاوليمبى 1 1 عموما الاهلى يوم ما خسر بعد 71 مباراة خسر بشرف من الاسماعيلى وصيف الدورى مش خسر من فريق عمرة 3 سنين زى الحرس كتكو وكسسه"
archived = "2007-01-26"
capture_url = "https://web.archive.org/web/20070126092101/http://masr.20at.com:80/article.php?sid=1414"

