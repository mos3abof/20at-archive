posted = "2007-01-08"
text = "اولا تحية تقدير للاعبي النادى الاسماعيلى اللى فعلا ادوا مباراة جامدة جدا استحقوا عليها كل التقدير والاحترام .<br />طبعا يا مصري انت مستنى تعرف انت ليه حمار .<br />هو فيه حاجة اسمها الاهلى القاهرى يا حمار ؟؟؟؟<br />فكر فيها كده وانت هتلاقي نفسك حمار كبيييييييييييير .<br />تحياتى لبرازيل الكرةالمصرية"
