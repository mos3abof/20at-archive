text = "مع تحياتي لكل مشجعي العرب والانديه المصريه بس في نقطه زمان كان اللي للامتاع لعيبه وجمهور الان اللعب بيزنس وكمان اللعيبه فقراء ومكنوش لاقيين ياكلوا فدى ووظيفه ليهماوبلاش العصبيه لو في حد عاوز يلعب يروح النادي ولو معندوش اماكانيات يغطي نفسه كويس قبل ما ينام الكورة بقت زى الفديو كليب"
archived = "2007-01-26"
