subject = "ايه الحقارة دي؟؟"
author = "انتوا يا زمالكوية يا ولاد ال ....."
posted = "2007-01-08"
text = "يا بنى محناش هنا في مدونات عشان تستخدم الالفاظ الوسخة دي .... تعلالي برة وانا اوريك شوغلك ....<br />المهم سيبنا من الشتايم وقلة الادب ... الزمالكوية في مطشهم خدوا بالجزمة و رايحيين زي اللامؤاخذة يتمسحوا في لامؤاخذة بتاعة الاسماعيلي .... بقى ده كلام؟؟<br />عموما اساسا ام الدوري بتاعكوا ده مش لازمنا يا بتوع ... كفايا علينا تالت عالم السنادي و كمان كاس افريقيا ... ههههههههه مع العلم اساسا ان المنتخب هو الاهلى ..... فبطلوا صداع ووجع دماغ<br />كلامكم مالوش لازمة"
archived = "2007-01-26"
capture_url = "https://web.archive.org/web/20070126092101/http://masr.20at.com:80/article.php?sid=1414"

