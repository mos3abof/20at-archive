subject = "اجهاد اهلاوى وجهداسماعلاوى"
author = "احمدالفيومى"
posted = "2007-01-08"
text = "الاهلى بلا شك انه افضل فريق مصرى عربى افريقى فى عام 2006 ولكن اجهاد اللاعبين طوال الموسم ولعب 4مبارات متتالية من العيار الثقيل حيث لاعب حرس الحدود انبى الزمالك طنطا ادى الى ان يكونوا فريسة سهلة الى الاسماعيلىفهزم الاهلى ولكنه سوف ياخذ الدورى المصرى انا شاء الله احمد المصروى الهلاوى الفيومى"
archived = "2007-01-26"
capture_url = "https://web.archive.org/web/20070126092101/http://masr.20at.com:80/article.php?sid=1414"

