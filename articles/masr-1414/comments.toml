subject = "رد على الاهلاوي"
author = "علاء"
posted = "2007-01-08"
text = "الاخ اللي رد على مصري يبدو انه لم يكلف نفسه حتى مشقة القراءة .. الاخ مصري كتب الاهلي القاهري لانه قبلها قال ان الزمالك فاز على اهلي جده .. وطبعا رد الاخ الاهلاوي عن طريق الشتيمه يدل بما لايدع مجال لاي شك انه انسان ينقصه الادب والتربيه ولياقة الحوار واحترام الاخر حتى لو اختلف معه في الرأي .. طبعا من السهل جدا ان تشتم عن طريق الانترنت وطبعا الاناء المملوء بالقذاره بماذا ينضح ؟؟؟؟"
