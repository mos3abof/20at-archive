subject = "ما برشلونة خسر 4 عادى"
author = "هش"
posted = "2007-01-08"
text = "يا جماعة عادى لو تفتكروا كل مباريات الاهلى والاسماعيلى مبيبقاش فيها ندية<br />فريق مستسلم وفريق مبدع والحظ ماشى معاة<br />لو تفتكروا الستة صفر الاهلى ضيع ساعتها<br />8 اجوان غير الستة اللى جابهم<br />وماتش ال4 صفر للاسماعيلى فى البطولة العربية<br />ضيع زيهم<br />الاهلى كان سىء جدا<br />والاعيبةمهيسة من اول تريكا لغاية شادى وعماد دة ربنا يسامحك"
