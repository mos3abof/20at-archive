[[comments]]
order = 16
subject = "صحافه صفراء و سوداء"
author = "شوفتم اللى جرا فى الاسماعيليه و لا كان الاسماعيلى خد كاس افريقيا ، ولا الجرايد و الكلام اللى كتباه ، انهيار الاهلى ، الاسماعيلى ذل الاهلى ... وغيره"
posted = "2007-01-10"
text = "وكل ده على مجرد مباراه فى الدورى العام النايم بتاعنا<br />يعنى الفرق اللى غير الاهلى و الزمالك تخسر يقولوا فين المنافسه الدورى ضعيف ، الفرق دى تكسب يقولوا سوء الاداء وانهيار الاهلى و الزمالك ، واهو كله بيع جرايد<br />والله الصحفيين دول .. ولا بلاش ، ومع احترامنا للاخوه المحررين هنا بس فى جرايد فى بلدنا عاوزه الحرق .. بس مش الجرنال هو اللى يتحرق لا مبنى الجريده نفسه عشان منشوفش وشهم تانى ، الصحافه احد اسباب تدهور الرياضه فى مصر<br />لانها تراعى كل شىء الا المصلحه العامه ، تراعى الاعلانات و المكاسب و المجاملات و الخلافات الشخصيه و الرشاوى و الفساد و المنافسه غير الشريفه و و ... حاجه تقرف"
archived = "2007-01-26"
capture_url = "https://web.archive.org/web/20070126092101/http://masr.20at.com:80/article.php?sid=1414"

[[comments]]
order = 17
subject = "رساله عاجله"
author = "ابراهيم سعيد"
posted = "2007-01-10"
text = "الاخ الشقيق ليفى<br />بعد التحيه و السلام ،<br />كنت اود مناشده سيادتكم بالتكرم ومخاطبه فريق مكابى تل ابيب العامر بغرض الحصول على عقد احتراف لديهم<br />مع العلم ان السى فى بتاعى ميت فل و اشرف اى فريق بالانضمام اليه فانا لاعب صاحب شخصيه قويه سواء فى الملعب ( فانا اشتم الجماهير و اللاعبين كلهم سواء اللى معى او ضدى ) و خارج الملعب ( مسبتش اى مدرب مصرى كان او اجنبى الا وعملت معاه مشكله) ، بالاضافه الى انى لن اجد مشكله فى اللغه فلدى مهارات خاصه فى استعمال الايدى و الاصابع ، وايضا انا اللاعب الوحيد الذى خاض تجربتى احتراف فى انجلترا صحيح كل مره كنت برجع قفاى يقمر عيش و مكنتش بكمل شهر الا ان لى السبق فى هذا ، وعلى فكره ممكن اروح انجلترا تانى مانا اصلى معنديش دم بعيد عنك و عن الساده الاسرائيليين كلهم ، وايضا انا لا اختلف فى مساله المقابل المادى لانى اساسا اى مبلغ هقبضه مش هلعب بنصفه ، يعنى انا الكسبان برضه فى الاخر ، ولكن اطمئن مع كل اللى قلته ده فالجماهير تتعاطف معى دائما فى النهايه و هذه هى النجوميه الحقيقيه ، وتاكد انى ساكب فريقكم شعبيه هائله ولا يهم اذا كان ده بلعبى او بمشاكلى المهم انها شعبيه و خلاص<br />وشكرا ،<br />هيما الجن"
archived = "2007-01-26"
capture_url = "https://web.archive.org/web/20070126092101/http://masr.20at.com:80/article.php?sid=1414"

[[comments]]
order = 18
subject = "لو لم اكن اهلاويا لوددت ان اكون اهلاويا"
author = "نيفين نيفى نوفا"
posted = "2007-01-10"
text = "بقول للزماكاويه اللى ما صدقو و اللى كانو قاعدين ف الماتش بيشجعو مع الاسماعيلى بلاش تكدبو الكدبه و تصدقوها<br />انتو و الناس كلها عارفين ان الفرقه تعبت الفتره اللى فاتت ب لاضافه الى نسبه الاصابات و كفايه اللى حصل لابو تريكه اللى ميكفيناش قصاده ميت دورى لان الراجل دا لو قعد لاخر يوم ليه ف الملاعب ميجيبش اهداف مش هنقوله حاجه<br />و كفايه علينا تالت عالم السنه دى<br />و كفايه اننا جمهور كنا مغلوبين 3 صفر و قاعدين نقول العب يا اهلى<br />و مش عهمل زى ما واحد قريبى قاللى لو زملكاوى كلمك بصى للسما و اقعدى اتاملى و اعملى نفسك فنانه تشكيليه<br />لا لو زملطاوى اتكلم هقولله باعلى صوت عيب عليك"
archived = "2007-01-26"
capture_url = "https://web.archive.org/web/20070126092101/http://masr.20at.com:80/article.php?sid=1414"

