text = "مبروك للزمالك فوزه على أهلي جدة , وهارد لك للأهلي القاهري الهزيمة من الدراويش , وكلمة ( صدقونى يا جماعه بالرغم من انى اهلاويه حتى الموت لكن مزعلتش على الاهلى النهارده خلوه مره واحده من نفسه يخسر اصل نفسه جزعت من كتر الفوز ) معلش دي كبيرة شوية , الواحد ميزعلش لو الاهلي لعب , لكن الأهلي اتمسح بكرامته الأرض ."
