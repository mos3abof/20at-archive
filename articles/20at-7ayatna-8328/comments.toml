text = "انا الي عايز اعرفه انت عايز ايه بعد القصة الي مش ظريفة دية و ايه مشكلتك يعني و عايز توصل لإيه بعد قصة متفبركة اوي و يعني قصة سيدنا يوسف هي العملت فالواد كدة والتلفزيون و الشارع والانترنت مابيعملوش حاجة و كمان الواد اصر انه مايخدش الدرس الي موجود فقصة سيدنا يوسف عليه السلام وإزاي الإنسان يكون عفيف و شريف … كفايا سفالة بقى وكل واحد يحترم نفسة وبدل مايكتب كلام فارغ يروح يشوفلوا حاجة يعملها"
