text = "يا مصطفى فتحي…<br />دي مش سطحية…<br />السطحية ان تأخذ ما تريد من القصة فتعظمه، وتنبذ ما تريد فتغفل عنه…<br />اليس موضوع حساسية ولا حاجة…بل موضوع منطق…<br />إزي قصص القرآن الت علمنا المثالية والأخلاق الحميدة وتزرع فينا صور العفة والطهارة…اتحرضنا امسوي معصية؟!!!!<br />أو تكون سبب بفعل شنعية مرفوضة مجتمعاً وعرفاً وإي حاجة بتحبها!<br />عيب…عيب كدا"
