[[comments]]
order = 4
subject = ""
author = "emy"
posted = "2008-02-29"
text = "احنا لية يقينا حساسين اوى من اى كلام عن الدين .و عن الملتحين كانهم ناس معصومين من الخطا و ميصحش اننا نتكلم عنهم باى حاجة تسىء ليهم . فيها اية يعنى عن واحد كتب مقال عن مدرس غبى للاسف بيدرس المادة الدينية للاطفال و هو مش فاهم اهم اساسيات الدين و هى السماحة و اليسر . و كمان مش عارف كيفية التعامل مع الاطفال فى هذا السن الخطير و الحرج .و انفترض ان التلميذ اخطا او انة تمادى فى خيالة شوية عن شخصية مينفعش اننا نتخيل عنها شى او نصدق شىء عنها غير المكتوب فى القران الكريم كان واجب هذا المدرس اخذة باليسر و الحديثمعة بطريقة صحيحة انة يفهمه غلطة مش يعاملة بالطريقة الديكتاتورية الغبية الحقيرة دى .و بالنسبة للناس اللى بتهم على الكاتب انتو مش حاسن انكو بلغتو شوية لانة مغلطش فى النبى يوسف علية السلام او القران الكريم . بل بالع[ *** ] وصف شىء ممكن يحصل فى اى مدرسة و مع اى حد .وكمان الكلام عن الملتحين مش خطيئة لانهم مش معصومين من الخطا و اللحية ليست دليل على التدين او الفهم الصحيح للدين .وكمان مش كل اللى فى القران نقدر نشرحة للاطفال فى اى سن لانهم ممكن يزودوا علية كلام تانى او ميفهمهوش الفهم الصحيح المقصود من الايات الكريمة .وشكرا ."
archived = "2009-06-15"
capture_url = "https://web.archive.org/web/20090615050311/http://www.20at.com:80/20at/7ayatna/8328.html"

