text = "كلام رخيص ومبتذل وتجارة راكده من فكر يريد ان يسوقه صاحبه على حساب بيع مبادئه والمتاجرة بالدين هذا من يقال له انك تتاجر بالدين وليس فنانات التتزمن وفضلت الدعوة الي الله ولو على حدود علمهم وهم ماثابون باذن الله<br />اما عن النكرة الذي يسعى الي ربح زائف فاقول<br />انا اطالب جميع من اشمئز من هذا الكلام مثلي ان يقاطع موقع عشرينات حتى يحذف هذا الخبث والقذارة ويعتذر ويصحح لنا اسلوبه حتى نعرف لمن نقرا ومن يدخل لعقولنا والي ان يحدث هذا فانا مقاطعة هذا الموقع"
