text = "ياترى لو كان المعلم ده شخص ليس ذو لحية وكان مدرس تقليدي وعمل في الطالب كده ، ياترى هل كان سيتم نشر هذه القصة أو تأليفها أو هل كان هناك من يهتم بها؟؟؟… اعتقد ان الجواب في الغالب لا … طيب لمذا لكون الشخص له لحية فالمفروض انه يحاسب على كل حركة يعملها ؟؟ … ممكن يكون مش عارف ازاي يتصرف … زي المدرس التقليدي لكن الكل يحكم عليه لانه محسوب على الناس الملتزمين …<br />… ليس جديد عليكم ان تستمروا في محاولاتكم لتشويه صورة الاسلام او المسلمين"
