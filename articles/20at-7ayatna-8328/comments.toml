text = "دي مش حساسية ولا حاجة…دا تقزز خارج أن الطبيعة البشرية نفسها…الأنبياء واالحوادث التي بتحصل معاهم هي لنتعلم منها ونقتضي بها …الربط الموضوع دا بقلنا إن قصة يوسف هي مشهد جنسي ساكن ومنحط اقتضى به …ولو وقف هنا لكنا صمتنا…ولكن الكاتب تعدى إلى ما بعد ذلك بتصوراته التي أدت به إلى العادة السرية بدلاً من يعمد للخروج من حبكة الموضوع بالعفة النبوية لدى يوسف عليه السلام"
