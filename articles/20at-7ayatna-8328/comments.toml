text = "أنا كاتب هذا الموضوع على مدونتي، اولا اشكر موقع عشرينات على نقله للموضوع ثانيا اشكر كل من علق على الموضوع .. هنا اسجل اني لاحظت ان اغلب التعليقات سطحية بشكل غريب وهنا احب ان اوضح<br />هذه قصة حقيقية حدثت بالفعل انا فقط تخيلت مشاعر الطفل وانا اكتب بمعنى اني اكتب من منظور هذا الطفل<br />اعرف جيدا اننا لدينا حساسية مفرطة من الحديث في الدين لكن لو قرر كل واحد ان يقرأ بعمق سيعلم ان الموضوع مختلف تماما<br />تحياتي للجميع<br />مصطفى فتحي<br />http://shababshow.blogspot.com/"
