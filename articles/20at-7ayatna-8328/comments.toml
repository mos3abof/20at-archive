text = "لا حول ولا قوه الا بالله العلي العضيم<br />ايه الكلام يلي بتكتبو<br />انا اول مره امر بالموقع واخر مره كمان<br />بس راجعو نفسكم كويس يعني مش معقول كدا نتكلم عن الدين والانبياء ونربط بين الجنس والدين بهيدي الطريقه<br />الدين بيتكلم عن الجنس بكل صراحه بامكانكم تكتبو بس مش بالتشويه ده<br />استغفر الله العضيم<br />ربنا يهدي الجميع"
