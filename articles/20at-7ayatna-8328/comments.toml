text = "اولا انا مش عارفه الناس الي معلقة على الموضوع معقدين ليه!! من الطبيعي ان احنا و احنا بنقرأ القرآن بنتاخيل شكل الجنه و من الطبيعي نتخيل يوسف في الموقف ده , و الي حياولي ان ده مبيحصلش معاه يبئى كذاب.<br />احب اقول ان فعلن موضوع اللحيه حاجه سطحية و بتتعمل بشكل مقظظ!! و يا ريت نركز على الجوهر مش المظهر!!<br />ثانيا المفروض كانو ينقشو معاه موضوع العادة السريه مش يضربوه! و ده خلاه يعند!!<br />بس و شكرا على الموضوع ده"
