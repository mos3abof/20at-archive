text = "أول تجربة جنس؟؟<br />أولا : أوجه نداء إلى الإخوة أصحاب الموقع بحذف المقال سريعا لأننا بالحقيقة سنفقد الثقة بالموقع تماما ..إذا لم نكن فقدناها بالفعل وأنا والله آسف وحزين أن ينشر الموقع هذه البقعة الفكرية العفنة؟؟<br />وعلى فكرة أنا من أقادم الناس التى تعلق على موضوعات بالموقع ولكن مررت بفترة إنقطاع( لظروف خاصة )وحزين أن أواجه بعد عودتى للموقع الذى أحبه وأنصح أصدقائى بالدخول عليه هذه المهزلة..وأضم صوتى لصوت الأخ الذى علق أول تعليق ..لا يدفعنا حب الشهرة وحب الظهور بمظهر الوسطية والإعتدال أن ننافق ونغير مبادئنا وننسى هدفنا الذى نعمل لأجله..<br />ثانيا : أرد على الأخ الفصيح بتاع الإيدين الحمرا ده اللى بيكتب وهو عرقان ومبلول من العرق ..ويقول بصوا على المشكلة نفسها..؟؟!!<br />ما هى المشكلة مش فى الموضوع يا نفسه يا عم الأمور ..المشكلة فى طريقة عرضها.. … يعنى إيه واحد يكتب مقال على موقع أحسبه محترم..ويقول..<br />&—61607; كان مدرس مادة التربية الدينية ذو لحية عجيبة الشكل .. غير مهذبة .. ودائماً غير نظيفة ..<br />&—61607; نبي جميل الشكل وبالتأكيد كان مشعر لأن \\\\\\\"البنات\\\\\\\" \\\\\\\"بتتجنن\\\\\\\" من الرجل المشعر<br />&—61607; بينما هو - \\\\\\\"يوسف\\\\\\\" النبي- بدأ يستجب لها .<br />&—61607; لماذا ينتصب جزء من جسده هكذا؟<br />&—61607; وبقسوة- ربما لم يكن ليتحملها يوسف - النبي - نفسه..<br />وبقول لأميرة وأحمد هيما ومش عارف مين ومين ..سأظن بكم خيرا علشان كده هنصحكوا تبقوا تغسلوا عنيكوا كويس من (العماص) والحاجات دى قبل ما تقروا أو تعلقوا على أى موضوع..<br />أما الكائن اللى هو مصطفى فتحى (إذا كان دا فعلا إسمه يعنى) فميستهلش إنى أتعب نفسى وأرد عليه؟!!<br />oosaamaaa@yahoo"
