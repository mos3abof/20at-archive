posted = "2009-10-20"
text = "إلى الأشقاء فى الجزائر و الأهل فى مصر<br />ىسف لما يحدث من بعض القلة الفاسدة فى الجزاءر و مصر على حد السواء و التى وصلت للتطاول على الأوطان بل وصلت فى بعض الصحف لإستخدام آيات الذكر الحكيم القرآن الكريم و تحريفها للإستهزاء و السخرية من الطرف الآخر -حسبنا الله و نعم الوكيل-<br />انها فى النهاية رياضة و يجب ان تحاط بجو من الأخلاق و إلا فلا داع لها وبدلا من أن نحمد الله على أن التأهل عربى اصبحنا و كأننا فى معركة<br />و الله ان تأهلت الجزائر لأهتف لها و كأن المصريين هم من يلعبون وأتوقع نفس الشىء من االأخوة فى الجزائر فى حالة تأهل منتخب مصر فكلنا عرب و كلنا مسلون<br />و اخر دعواى ان الحمد لله رب العالمين<br />خالد حسن<br />مصرى مقيم بدبى"
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107112519/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
