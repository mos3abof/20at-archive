author = "جوجو"
posted = "2009-11-23"
text = "حسنا يمكن القول ان بعض الشباب الطاءشة من الاشقاء المصريين تشاجرت مع بعض الشباب الجزائري و لكن لماذا لم يقتصر الحديث عنهم حتى امتد الى الاجداد و سب الثوار و الشهداء و انتم اعلم منا بالعلاقات المصرية الجزائرية ابان الاحتلال… و لكن الكل يلاحظ ان الاعلام المصري يثير مشاكل لا اساس لها بدلا من الاعتراف بالهزيمة و تهنئة اخوانهم العرب بهذا الفوز فكلنا عرب و سنمثل العرب يعني مصر و الا الجزائر شئ واحد من المفترض ان تفرحوا لنا مش تظهروا لنا الكراهية الغير متناهية …<br />اذا اتقوا الله يا شعبين و حدهما الاسلام فلقد اصبحنا اضحوكة لاعداء الاسلام"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203040547/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
