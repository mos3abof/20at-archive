author = "وصال عاشقة تراب مصر"
posted = "2009-11-19"
text = "احب الفت نظرك لحاجه يااخى فى الله ان المسلم من سلم الناس من لسانه وان شعب مصر كلو موحد مسيحى او مسلم بل كلهم اخوه ولا يستطيع اى عدو تفرقتنا ولا يستطيع احد ان يعمل علا فتنه بيننا بل وايضا ان المصريين يحترمون اى دخيل فى بلدهم العزيزه حتى انتم احترمناكم وحافظنا علا طلا ب الجامعات الجزائرين فى مصر وحافظنا علا جماهيركم بل احتفلنا بفرحة منتخبنا بفوزه علا منتخبكم بكل احترام ولا ولعنا فى علم الجزائر ولا سبينا فيكم ولا غلطنا عليكم هى فى الاول واللخير كورة قدم بل لعبه لكن انتم حاربتونا فين اخلاق الروح الرياضيه انتم تتهجمون علا المصريين عنكم فى الجزائر هل هذا احترام للأدميه قبل احترام العروبه<br />هل هذا هو احترام للدين هل هذا هو خوف شعب جبار من الله عز وجل ولك ان تتخيل ماحدث فى نساء واطفال المصريين وفى النهايه اننى اعشم فى عدالة السماء ان يرد لنا حقوقنا وليس المصريين ان يردوا حقوقهم بالاسلحه والخناجر وحسبى ربى ونعم الوكيل"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203040547/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
order = 44
subject = ""
author = "وصال عاشقة تراب مصر"
posted = "2009-11-19"
text = "قبل ماتقولى ان المصريين اتهجموا علا منتخب الجزائر احب اعرفك انو قسم بالله العلى العظيم ماحصل من الشعب المصرى عمرنا ماعملنا فى ضيوفنا كدا كم من الشعوب دخلت بلادنا كم من البلاد لعبت معانا كرة قدم كم من المنتخابات العربيه والاوربيه لعبت معانا اذكريلى اى بلد قالت عنا اننا همج او اننا غجر احب اعرفك ان اهل مصر كرما ء لضيوفها مهما كانوا ولكنم اختصبتم العروبه هل انتم عربيون ام انتم اعداء صهاينه ليه تولعوا النار فى علم مصر الحبيبه ليه تسبوا فينا والله والله والله ان رد فعلكم لا يليق بأى ديانه بأى حق تنزلوا تشجعوا منتخبكم بالاسلحه البيضاء بالهمجيه بالحقد والغل<br />ولكى ان تتخيلى انكى تحاربى مع عدو بدون اى اسلحه بدون اى اداة للدفاع عن النفس وهل هذا رد فعل للكم الهائل من المساعدات التى قدمها لكم الرئيس المصرى الراحل جمال عبد الناصر والله والله والله ولا مخلوق جزائرى توفى فى مصر نعم هى اشاعه بل هى مكيده مدبره من اشخاص هم اعداء لكم ولنا وفى النهايه احب اقولك ان رب العزه لايضيع اجر من احسن وعمل عملا صلحا"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203040547/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
order = 45
subject = ""
author = "هدى"
posted = "2009-11-19"
text = "ولكن كل هذا لم يؤثر بصفة كبيرة في الجزائريين ولم يهز من شخصيتهم إلا أن تعرض الفريق الوطني لهجوم مصري اقل ما يقال عنه وحشي فقد اشعر الشعب الجزائري باهانة لا تتصور ورغم ذلك حاول الصمود ولكن بالاعتداء الموالي على مناصريه والذي سجل كليا في حين حاولت السلطات المصرية إخفاؤه تفاقمت الأمور وشعر الجزائريون عامة بحقد وغل نحو المصريين الذين استقبلوهم بأبشع الصور في حين كان عدد الجزائريين لا يتعدى 2000 مناصر. أوليس هذا إجرام في حقنا أم ان رد الجزائريين هو الوحيد الذي يعد إجراما؟؟؟؟؟ بالطبع انا لا أؤيد ما حصل في السودان ولكن لا يمكن ان نتحدت عما فعله الجزائريون دون ذكر ما فعله المصريون بادئ الأمر ولكم انتم المصريون النظر في هذا الأمر …"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203040547/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
order = 46
subject = ""
author = "هدى"
posted = "2009-11-19"
text = "السلام عليكم جميعا<br />انا هدى من الجزائر اولا اود ان اهنيء الشعب الجزائري على الفوز وان اشكر الفريق المصري على المجهودات المبذولة من اجل الفوز<br />اما فيما يخص المباراة والاعلام فان كلا من الطرفين قد اخطا في حق الاخر سواء المصريين او الجزائرين ولكن ما اود ان اشد الانتباه اليه ان الاعلام الجزائري المقصود هو الاعلام المكتوب فقط اي الجرائد على عكس المصريين الذين استعملوا كل الوسائل الاعلامية لتشعيل نار الفتنة وهاذا ما اوضحته مختلف القنوات فكلما اتجهت الى احداها وجدت حوارا رياضيا حول ما قالته الصحيفة الفلانية او ما قاله الشخص الفلاني في حين ان الاعلام الجزائري المرئي اكتفى بالتشجيع والحديث عن فريقه"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203040547/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
order = 47
subject = ""
author = "محمد"
posted = "2009-11-20"
text = "بسم الله والصلاة والسلام على رسول الله<br />أيها المصريون والجزائريون أليس فيكم رجل رشيد أليس في رؤوسكم عقول كيف يجركم إعلاميون يقصدون مايقولون ويفعلون إلى هذا المستنقع العكر هناك من يريد أن يرمي الكرة في ملعب المواطنين الأحرار من المصريين والجزائريين ويصدهم عن الحقائق والكوارث التي يعيشها البلدين.<br />وفبركو هذه القصص والتمثيليات علما أن البلدين في مرتبة واحدة 111 من ناحية الفوضى والفساد حيث دبرو في مصر تمثيلية المناصرين اللذين ضربوا بالسيوف والسواطير واحتجزوا في المطار وفي المقاهي مع أن السلطات الرسمية في السودان الشقيق نفت قطعا هذه الأخبار ولم تسجل أي شيئ من هذا ولم يجد المواطن المصري الحر إلا أن يدافع عن كرامة إخوانه ,خدعوكم فقالوا… كل هذا من أجل أن لايلتفت الموطنون إلى عدم تأهل منتخبهم إلى المونديال لأنهم لو تركوهم لوقعت كارثة في القاهرة وفي مصر<br />ونفس السيناريو يدور في الجزائر لولم يفز المنتخب الوطني لعدنا إلى 21 سنة ماضية"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203040547/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
order = 48
subject = ""
author = "عربي"
posted = "2009-11-21"
text = "يا مصريين يا من تدعون الحضارة<br />هل من الحضارة ان تدوسوا وتحرقوا علم بلد مسلم<br />هل من الحضارة الطلب بطرد السفير الجزائري<br />هل من الحضارة تكسير السفارة الجزائرية<br />بل انه من الاولى فعل هدا بعلم اسرائيل الدي تحترمونه اليس كدلك<br />هل من الحضارة التبلي على الشعب الجزائري الشقيق باشياء انتم فاعلوها<br />هل من الحضارة عرض صور و فيديوهات مفبركة حتى الاعمى يكتشفها<br />هل من الحضارة ان يكدب السياسيون الفنانون<br />هل من الحضارة ان تكدبوا قنوات الاعلام كلها \"الزيرة.العربية.ال بي سي\"وتصدقون الراقصات<br />في الاول والاخير انه ماتش كورة تقبلوا الواقع ام انكم تدعون الروح الرياضية في حالة فوزكم فقط<br />كفاكم مسخرة ضحكتوا وشمتوا العالم فيكم وسودتم صورة العالم العربي<br />اختشوا على دمكم"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203040547/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
order = 49
subject = ""
author = "العربي عبد القادر"
posted = "2009-11-22"
text = "السلام عليكم ياعرب ويا مسلمين لقد استجبتم نداء عدو الله وعدوكم انه اليهودي الغادر الذي لا يريد الا قضاء حاجته فقد قضاه ولايذال يسعى للجديد وعلى ماذا ؟ انهم العرب المسلمون (الجزائر ومصر الشقيقة) تقبلوا من اخيذم الدكتور العربي عبد القادر من الجزائر اسما عبارات الاحترام والتقدير والسلام ختام"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203040547/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
order = 50
subject = ""
author = "جزائري"
posted = "2009-11-22"
text = "الله يحيي اصلك يا عربي مهما كانت جنسيتك<br />احب ان اقول للمصريين لا تكدبوا على انفسكم ولا تنكروا العنف والارهاب الدي مارستوه علينا في القاهرة .<br />فانا ضحية لهده الاعتداءات التي اسفرت عن اصابتي بجروح على مستوى الظهر استلزمت 18 قطبة وكسر في الدراع بالاظافة الى كدمات وجروح على مستوى الراس ولولا تدخل اسرة عراقية وانقدتني انا ورفيقي لكنا متنا من شدة الضرب<br />فانا ممتن الى عائلة \"ع.ن\" العراقية التي ضمضت جراحنا واطعمتنا بعد ان جوعونا كما قدم لنا رب العائلة ملابس رياضية للمنتخب العراقي واوصلنا الى المطار فهدا يدل عن كرامة العراقيين وحضارتهم فانهم ليسو كالمصريين الدين اتبتوا انانيتهم وحقارتهم"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203040547/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
