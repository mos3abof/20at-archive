text = "هل تعلم أخي المصري …هل تعلم أخي الجزائري …<br />حسب تاريخ المواجهات بين الفريقين الجزائري و المصري من سنة 1963 إلى غاية 2009 جرت عدة لقاءات بين االشقيقين العربيين حسب رزنامة fifa<br />- التعادل في القاهرة …02 مرات<br />- التعادل في الجزائر …08 مرات<br />- فوز الجزائر في مصر …03 مرات<br />- فوز مصر في الجزائر …00 مرة<br />- فوز مصر في مصر…05 مرات<br />- فوز الجزائر في الجزائر …06 مرات<br />أما عن أكبر نتيجة مسجلة بين الفريقين كانت كالأتي :<br />- الجزائر 3-مصر 1 سنة 1984<br />- مصر 5- الجزائر 2 سنة 2001<br />-الجزائر 3-مصر 1 2009<br />والمقابلا تال متبقية كانت جاها بين ألصفر و الهدفين…و السلام يإخوت العرب …"
