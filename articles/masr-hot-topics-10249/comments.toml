author = "بنت الصحراء الجزائر"
posted = "2009-12-10"
text = "احمل كل ما حذت الى وزير الاعلام المصرى و رئيس لجنة الاعلام فى مجلس الشعب المصرى . لانهم لم يضعو حد للغندور و شلته من حجازى الى الذئب و الثعلب شوبير<br />ان مصر خسرت المعركة الاعلامية .و على الدول العربية ان تنتظر دورها من الاعلام المصرى اليوم الجزائر و غدا السعودية و الكويت و الامارت فى الطريق و قطر باء الهجوم ليها مثل السودان . على العرب من اليوم التفكير فى صناعة قمر ينافس نايل سات . و اليكن قطر سات . و تتوقف الدول العربية علة دفع الاموال لهذه الشركة التى تسب العرب بدون استثناء من الخليج الى المحيط . باموال العرب يسب الاعلام المصر العرب . الغدور اجرته من اشتراكاتكم ياعرب . و هوعميل للموساد"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106142415/http://www.20at.com:80/masr/hot-topics/10249.html"

