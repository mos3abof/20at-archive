text = "استغراب لما قرأت فضاعة التعليق رقم 5 وهو نفسه 6<br />أنا جد متأسف لكن جد مستغرب من الجريدة<br />يعني كل مايكتب ينشر شيء غريب و أنا أعتقدت العكس هو يعني الحق هذي الجريدة يعطى لها 10/10 و أعتبرها الأولى عربيا من حيث النشر من دون حذف وهو شيء غريب و الله لأول مرة أرى ذلك لكن أنا جد محرج بما تفوه به المتعصب رقم 5<br />أرجو حذف التعليقات التي تزيد التوتر بين البلدين كما أتمنى لبلدي التاني مصر الرقي و الازدهار أكتر أنتي فعلا أم الدنيا . للأسف لم تسنح لي الفرصة لزيارة مصر ربما لأن الرحلة مكلفة جدا مكلفة لكن انشاء الله سأزورها .<br />و لتواصل : benino_cool@yah oo.fr"
