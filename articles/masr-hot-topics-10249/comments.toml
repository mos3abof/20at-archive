subject = ""
author = "سلمى من الجزائر"
posted = "2009-10-22"
text = "مافيش فيكم فايدة يامصريين كما تقولون - نقول ثور تقولوا احلبوه- نقول مسلمين تقولوا فرعون اعلموا أن فرعون الذين تفتخروا به في نارجهمنم و هو عدو الله ، و في حديث لرسول الله صلى الله عليه وسلم : المرئ يحشر مع من يحب -<br />و أظنكم أنكم تريدون لقاء فرعون ، اتقوا الله اتقوا الله اتقوا الله و استغفروه إن الله غفور رحيم ، رغم كيد عمرو و الإعلام فنحن نحبكم جدا جدا و خاصة أن دمكم خفيف أما مقالبة 14 فهي سحابة عابرة و سلامي إلى كل مصري يعتز بالإسلام و فقط لا بفرعون ."
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107112519/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
order = 16
subject = ""
author = "بن عيسى : الجزائر"
posted = "2009-10-22"
text = "- ن بن عيسى : الجزائر<br />يُحكى أنّ كرة عشقت الحياة، فراحت تجول في ربوع عالم خلاب، وأسرت بقلبها الذهبيّ جمعا من الشباب، فراح بعضهم في تنافس ليكون لها من الأحباب، في سباق أسال الكثير من اللعاب، دون دراية إن كان ذلك خطآ أم صواب<br />وكان من بين المتنافسين بعض الأشقاء، في سباقهم لكسب الودّ يطمحون للبقاء، رغم صعوبة مهمتهم يرفضون البكاء، أمانيهم أن يصبحوا يوما بالمجد أغنياء<br />ولم يخل السباق من الأشقياء، في صراع لنشر الفتنة بلا حياء، فزرعوا حقدا و عداء، فماتت الحكمة و نبت البلاء، و تلاشت كل معالم الشفاء<br />وبات سلاح القلم يقذف بلا رقيب، وفي التجريح أضحى الكل نجيب، ولعمري إنّ عمرا للكره حبيب، ويا ليت لأديب من الأدب قريب، فهل للأخوة و المحبة طبيب، وهل لنداء عربي من يجيب"
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107112519/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
order = 17
subject = ""
author = "أشرف من الجزائر"
posted = "2009-10-22"
text = "ياأخي أنتم تصادرون حقنا في مساندة الفريق الجزائري و تشجيعه ، هل هذا غريب أما الشعب الجزائري فلا تهمه المباراة بقدر الإهانة و التجريح من بعض الإعلاميين و خاصة عمرو أذيب الذي جرح الشعب الجزائري و خدش كرامته ، في الأول كان الشباب فقط وراء المنتخب الجزائري و كان المواطن الجزائري يعيش يومياته عادية مع مشاغل الدنيا و لكن الآن و بعد الإهانة و التجريح الذي أفرغهما عمرو أذيب في وجه الشعب الجزائري أصبح الكل صغارا و كبارا أطفالا و نساء ، همهم الوحيد هو تشجيع الفريق الجزائري و مساندته لكسر هذا الغرور و هذه العجرفة و هذا التعنت الإعلامي ياإخواني إلا إلا إلا …الكرامة و تحيا الجزائر و المجد و الخلود لشهدائنا الأبرار"
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107112519/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
order = 18
subject = ""
author = "حسابات مهمة و واقعية"
posted = "2009-10-24"
text = "الجزائر في المونديال : في كل مرة تفوز مصر على الجزائر تكون نتيجة الذهاب هي التعادل مثل 89 كانت النتيجة في الجزائر 0-0 و في 2001 كانت 1-1 لكن دائما سعدان يكسر الحسابات والأرقام مثل ماحدث في 2004 لما فزنا 2-1 و هذه السنة فزنا على أرضنا بثلاث أهداف يعني الأمر ليس يسيرا عليكم وهو مستحيل حقا أربع انتصارات للجزائر متتالية تدل على شيء واحد و هي القوة هكذا تقول الأرقام وكذلك التحليل .<br />شيء آخر سيلعب اللقاء مماثل للقاء زامبيا واعتمادنا طبعا على الدفاع والهجمات المرتدة وكذلك لا تنسو المخالفات فلاعبين الجزائريين يتفوقون في ذلك خاصة المدافعين منهم مثل بوقرة الذي سيحظر اللقاء على فكرة و كذلك عنتر يحي وأضيف الضربات الثابة لزياني و نذير بلحاج و الهجومات السريعة لكريم مطمور و لا ننسى اللاعبين الجدد الذي لم يتعرف منتخبكم عليهم بعد مثل مغني الذي أضهر مهارات فائقة في المراوغات و البنية الجسدية للاعب يبدة كما لاننسى مشاركة عبدون الماهر في التسديد و هو هداف فريقه في الحقيقة الأهم النتيجة في صالحنا لكن التحظير النفسي للاعبين سيكون على أساس أننا يجب علينا الفوز لصعود ."
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107112519/http://www.20at.com:80/masr/hot-topics/10249.html"

