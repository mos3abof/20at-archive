text = "و إذا أتتك مذمتي من ناقص ** فهي الشهادة لي بأنني كامل<br />فأنت ناقص ياعمرو أذيب و قليل الأدب تبحث عن الشهرة بسب أسيادك ، المرة السابقة<br />ادعيت على لاعبين مصر و الآن على الجزائر رأسك فارغة فملاتها بفضلاتك أيها الرخيص القواد لليهود ، حول قلمك إلى أصحاب الكراسي الذين استعبدوك لخدمة مصالحهم<br />الجزائر و مصر فاقوا بيك ، افتح معبر رفح إذا كنت راجل أتحداك أن تسب اليهود<br />روح استر على مراتك اللي دايرة على حل شعرها سوف نفضحك كل دقيقة لقد فتحت على نفسك نار جهنم و أبواب لا توصد ياخنزير روح الله يعطيك قنبلة في فمك ، لو تقع في يد جزائرية ليقطعون لسانك إربا إربا."
