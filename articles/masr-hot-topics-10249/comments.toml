author = "نادية بنت الجزائر"
posted = "2009-10-19"
text = "أصبح الغندور يتنفس جزائر… يأكل جزائر … ينهض جزائر …ينام جزائر و كل يوم يفكر يقول ايــه للجزائر … مالك خايف .. مالك مرعوب و مفزوع ماتخافش هي مبارات فقط في كرة القدم مش حتوصل مصر و لا الجزائر للقمر و لا المريخ لو ذهبت للمونديــال العرب كلها تضحك عليك و على عقلك الصغير ترفع و ارفع قامتك و اصلب طولك و ناصر غزة و شعب فلسطين و تكلم عن اليهود و التطبيع؟؟؟؟؟؟؟؟ ؟؟ و الله فخر لنا أن لايجد بيينا أشكالك و عاشت الجزائر و مصر بالرجال الأحرار و العلماء الأطهار ."
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107112519/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
