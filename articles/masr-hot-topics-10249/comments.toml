text = "يا أيها الذين آمنوا اذا جاءكم فاسق بنبأ فتبينوا أن تصيبوا قوما بجهالة فتصبحوا على ما فعلتم نادمين<br />عمرو الذئب اتقي الله اتقي الله اتقي الله أيها الفاسق من قال أن الجزائريين يكرهون المصريين اعلم أن من وحد بينهم الدم لن تفرق بينهم همساة الشياطين التي تنطق على لسانك<br />وبعد المقابلة ستتأكد من كلامي هذا ان شاء الله"
