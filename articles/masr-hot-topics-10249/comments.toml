text = "ثمَ أنشد الجزائري يقول:إني رأيت دجاجة بيضاء تجقجق بصوت عالي وعلى<br />ساقيها رقائق فتات الخبز وبمنقارها تنقب بعض حبيبات القمح المنتثر<br />بفناء منزل تحت ظل شجر القرقد فخرج من غار يشبه قفرٌ لفقراء فأرٌ<br />فقير الحال قد اشتدَ به الجوع حتى رأته الدجاجة وأقرت في قرارة<br />نفسها أن تنقره بمنقارها ثمَ بعد دقائق قليلة قرَرت فعل الجريمة بعدة<br />نقرات على الجمجمة فسال دم الفأر الفقير جماً على الثرى وما رثا<br />حاله الغفير الدي رأى الجريمة وما أنكر المنكر حتى أنًَه رآه طريحاً<br />مستصرخاً إيَاه فأدبر وكأنه ما أبصر، وكيف يبصر من لا يفرُق بين<br />اللقالق واللآلء وشتان بينهما… وقال الجزائري قلْها قبل أن<br />تغادر المكان ولا تركب العربية لأنها لا تُرْكبْ فإن من يغْدر بالإخوان لا<br />يركبْ إلاًَ العبْرية يا من لا يفرق بين أًَََمَرْ وقَمَرْ"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106142415/http://www.20at.com:80/masr/hot-topics/10249.html"

