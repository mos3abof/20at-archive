posted = "2009-11-30"
text = "السلام عليكم اما بعد فابتدئ كلامي بفاقد الشئ لا يعطيه لانهى لو كنا عقلاء و مثقفين ما وصلنا الى هذا الحد سواءا من نحن الجزائريين او من اخواننا المصريين فنرجوا من كل الاخوة حفظكم الله ان ترجعوا لله و تقدروا المصالح و المفاسد و تجعلوا كل شئ في مكانه فكرة القدم لعبة لا اكثر و ما يجمعنا مع اخواننا المصريين اعلى و اسمى و لو نلاحظ اننا لم نغضب لحرمات الله التي تنتهك كل يوم سواءا في البلدان الاسلامية او الاجنبية ففي كل يوم نقرا عن تعدي الغرب على الشعائر الاسلامية و لم نتحرك له اصلا فمر مجرد كلام لا غير و ما يجري مع الاسرائليين هو عقوبة من الله لنا لا اكثر سواءا منا الجزائريين او المصريين هدانا الله الى الحق وثبتنا عليه و اصلح بيننا و بين اخواننا المصريين ثبتهم الله على الهدى و الحق و السلام عليكم و رحمة الله"
