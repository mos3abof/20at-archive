text = "كنت با اتفرج على قنوات النايل سات<br />تصوروا<br />لقيت اربع قنوات تليفزيونية اسرائيلية بتذيع من على النايل سات<br />نعم شفت قنوات اسرائلية بتذيع من على النايل سات<br />يعيش نصر اكتوبر العظيم وتعيش كامب دافيد وتعيش جمهورية مصر العربية<br />ولقيت الاطفال معجبين جدا بالتقدم الاسرائيلى ومعجبين بتلك القنواتى خالص<br />هو وزير الاعلام الاسرائيلى اسمة اية - عايز ابعت لة جواب شكرا على امتاع الشعب المصرى بقنواتة اللذيذة<br />بالمناسبة<br />هى جريدة اديعوت احرانوت هتتوزع فى القاهرة امتى<br />شكرا<br />شكرا"
