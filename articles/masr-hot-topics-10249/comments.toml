text = "إلى الخائن /عزمي عوض/<br />الى علاء..عفوا الى هبوط ا لبارك، إقرأها فأطْ<br />جقجقة مصري<br />عربيةُ مصري..نقنق كالدجاجة فتأتأ وجقجق ثم اشتد على اخوانه<br />الجزائريين متطاولا وقائلا:ان الامصار عٌربُ تفقَهوافي لغة الضاد،<br />وكان معه شمعون وشارون ومقارون ثمَ راحوا يفظفظون مستفزين<br />إخوانهم الجزائريين.. فقال الجزائري رأيت<br />دجاجة,وقال المصري رأيت دقاقة,وقال الجزائري هدا قمر وقال<br />المصري هدا أمر،وقال الجزائري ثََلاثُ ثُلَل مُسْلمَة ملثَمَة إثتثيرت<br />فثارت وسارت وصارت من الثوَار، وقال المصري سلاسُ سلل مسلمة<br />مُلسَمة استسيرت فسارت وسارت وصارت من السُوار وقال الجزائري<br />فلنقعد في الظلَ بعيدا عن الظلم وقال المصري فلنأعد في الزَلَ بعيدا عن<br />الزُلم…يتبع"
