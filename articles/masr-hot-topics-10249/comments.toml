text = "\\\\\\\"وقد يكون هؤلاء على غير دراية بأن المصري اليوم هي الجريدة صاحبة أكبر مصداقية في مصر حالياً. \\\\\\\"<br />الموضوع كله راااااااائع … الا اخر جملة … اللي مش عارف جابها منين؟؟<br />المصري اليوم .. الجريدة الأمنية الأولي في مصر..<br />المصري اليوم ..الجريدة صاحبة الاراء المتناقضة الاولي في مصر كسياسة تحريرية<br />المصري اليوم ..الجريدة الاولي في التقارير الأمنية في مصر<br />المصري اليوم … لا تعليق<br />مش حاسكت …"
