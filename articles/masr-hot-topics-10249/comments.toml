posted = "2009-11-23"
text = "السلام عليكم<br />مبروك علي الخضرة<br />انتم يا مصريين اعترفتم انكم ضربتونا و اهنتونا و لكن لا تريدون ان تعترفوا ان الله نصرنا عليكم اتقوا الله و كفوا عن هذه المهزلة التي لا تجدي نفعا لكم فالمقابلة انتهت و النصر كان لنا باذن الله و انتم ما زلتم تطحنون الطحين و هو طحين ان كنتم تدعون انكم مسالمون و محبون حقا فلما لا تبيضون قلوبكم و تهنؤوننا بهذا النصر العظيم و الحمد لله و تكفون عن السب و الشتم الذي لا يجلب لكم الا الكره في كل اوساط العالم فكل العالم يرئ و يشوف و يعقل الظالم من المظلوم فلما كل هذا … انصحكم بالهدوء فلن تربحوا شئ من هذه الحملة مثلما خسرتم المباراة."
