posted = "2009-10-31"
text = "…أقترح من الذين يحبون الخير للشعبين مصر - و الجزائر إلغاء هذه المبارة في كرة القدم لأن ماهو في الدنيا فهو باقي للدنيا و لاصالح له في الأخرة ، أو تقنين قانون يحد من التعدي على حريات الغير و هذا لأنني أشم رائحة إحتراق الخيط الذي تخاط به مكيدة للشعبين …وشبابنا المتحمس هو السلاح المستعمل للهدف و للأسف بعض الأسلحة مستعملة عبر بعض القنوات لذى فإنني أدعوا من هذا المنبر قادة البلدين بالتدخل لوضع النقاط على الحروف…أدعوا شبابنا للتريث و أن لا ينساقوا وراء ما يخاط حولهم …و أن يسيروا جنبا إلى جنب فهذه رياضة فقط و الفريق المصري مثلنا في العديد من المحافل وشرفنا كعرب كما أن الجزائر مثلتنا في العديد من المحافل و شرفت العرب و الفريق الجزائري أو غيره قد يكون غاب في بعض المحافل لعقد من الزمن و لكن عمل على إسترجاع رجاله بالتجديد و لكن الفريق المصري أبقى على نفس الفريق منذ عقد من الزمن و هكذا دواليك وإن الشاء الله من فاز و ثبت أحقية تأهله فله ذلك و المهم أن يشرفنا بين الأمم…أخوكم بوعلام حامل الإسم الجزائري …والسلام…"
