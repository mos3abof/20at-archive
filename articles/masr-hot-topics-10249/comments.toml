[[comments]]
order = 77
subject = ""
author = "أيوب - الجزائر"
posted = "2009-12-22"
text = "أين كانت أصوات الحق والعقل لقد حوصرت ومنعت من أن تدلي بدلوها فيما يحدث وكان بإمكانهم التحرك قبل كل الأحداث ومنع كل ما حدث … ترهات يا سادتي وأكاذيب من كل الأطراف هنا وهناك لا تسمن المواطن ولا تغنيه من جوع حركات بهلوانية أضحكت العالم علينا وأمتعته لبعض الوقت لكي ينسى همومه والحقيقة يا إخوتي ها هي المآذن تمنع أن يذكر فيها اسم الله في سويسرا وها هو جدار العار يدك في الأرض دكا وها هم سادة العالم يلوثوننا ويزعونا فينا أنفلوانزا أمثالنا الخنازير والكلاب والذئاب ،، تصيح جميلة أم العرب ويبكي سعد زغلول في عز النهار ،، والويل لكل من أشعل النيران ،، حشا أن تكون كرة القدم بقدر ما هي لعبة فاقدي الهمم .<br />معذرة إخوتي القلب يدمي ولكل المخلصين كل المحبة والمودة والأخوة"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106142415/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
order = 78
subject = ""
author = "أيوب - الجزائر"
posted = "2009-12-22"
text = "إلى الإخوة المتصفحين رجاء اقرأوا التعليق 102 ثم 103 ثم 104 ثم 105لأنها لنفس المعلق<br />الصحف الجزائرية هي الأخرى لم تترك السبيل والفضاء وحده لوسائل الإعلام المصرية الأثقل طبعا وبكل تأكيد لتأخذ دور المدافع بعدما أصبح الأمر لا يطاق ولا يمكن السكوت عنه بحيث أن بعض المحسوبين على الإعلام المصري ذو المصداقية العالمية والمتبوئ درجة رفيعة هم الذين ملأوا الشاشات وسيطروا على زمام الأمور بمباركة من آل مبارك وأمر منهم وخير دليل على ذلك صمتهم أمام انتهاك أعراض الجزائريين وانتهاك مقدساتهم ورموزهم وحرق رايتهم ممن يفترض أنهم علية القوم وعقلاءه ليصبح بذلك رد الجرائد الجزائرية دفاعا عن كرامة الجزائر ولكن ياسادتي الكرام تصوروا معي الكارثة حينما يضحك الأبناء على الآباء وينساق رئيس جمهورية مصر ويشارك في لعب العيال ويعلن اجتماع المجلس القومي وهو مجلس الحرب وليطلع بعده أمام البرلمان ويعلن أن كرامة المصريين هي من كرامة مصر ولتنقل الكاميرا نبرته الجهورية وكأنني بصلاح الدين يحرر بيت المقدس ، ومحمود ياسين يقرأ بيان الطز في الطز ومحامين يحرقون راية أرض المليون ونصف المليون شهيد …"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106142415/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
order = 79
subject = ""
author = "أيوب - الجزائر"
posted = "2009-12-22"
text = "وبعدما ظن الجميع أن النصر بات مؤكد تمت تعبئة من يحسبونهم الشرفاء في سلمهم الإجتماعي وهم الذين فروا بجلودهم مباشرة بعد الهزيمة تاركين أبناء الشعب الذين يتكلمون باسمه وراءهم غير آبهين بهم لأنهم كانوا قد برمجوا في حال تأهل مصر الدخول في موكب جماهيري عظيم حاملين جمال مبارك فوق الأعناق مهللين مطبلين راقصين على مقام توريث العرش ولكل أبناء مصر البررة أقول لقد خدمكم فريق الكرة أكثر مما تتصورون فنأى بكم عن كارثة كانت محيقة بكم لنعود الآن إلى وسائل الإعلام التي ومن أجل امتصاص غضب الشارع المصري المسكين وضعت خطط دنيئة لتوجيه الرأي العام نحو الجزائريين ولتمرير ذلك تم إعداد تركيب سينمائي بديع ومؤثر في قناة الحياة وغيرها وتم تأثيث البلاطوهات بأبرز وجوه التمثيل وشرعوا في نسج السيناريوهات ليضحكوا بها ويستخفون أولا بأبناء بلدهم ثم الآخرين ولكنهم في النهاية لم يجنوا سوى اللعنة والإحتقار من كل الإعلاميين عبر العالم ولم يزد ذلك الجزائر إلا علوا وإكبارا ومع مرور الوقت سطعت شمس الحق وبدا للعيان ما كان يصنعه المرتزقة وشعراء البلاط ولحفظ ماء الوجه طالعتنا نفس الوسائل بلهجة جديدة عفى الله عما سلف واحنا أشقاء ."
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106142415/http://www.20at.com:80/masr/hot-topics/10249.html"

