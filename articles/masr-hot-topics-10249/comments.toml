subject = ""
author = "ابنة الشهيد"
posted = "2009-12-18"
text = "رسالة إلى كل من سب الشهيد<br />أنا ابنة الشهيد و لدت بعد استشهاد أبي بشهر ، و لم أر صورة الأب ، و لم أذق حنان الأب ، رضعت اسم الشهيد في حليب أمي و بكيته دموعا في عيون أمي و لم أعرف اسما لأبي غير الشهيد كنت أحسبه اسما و ربتني أمي بكل حنان الأم و شدة و قوة الأب و أصرت أمي على دخولي المدرسة و في كتاب المدرسة قرأت أن الأم في البيت و الأب في العمل ذهبت إلى أمي و قلت لها أين أبي و حكت لي أن أبي كان يكره الإستعمار الفرنسي و لما جاء صوت الجهاد لبى النداء و قال لها بالحرف الواحد إما خروج فرنسا أو الإستشهاد في سبيل الله و الوطن و استشهد أبي كما استشهد الكثير و في كل بيت جزائري إما شهيد أو مجاهد < و لا تحسبن الذين قتلوا في سبيل الله أمواتا بل أحياء عند ربهم يرزقون> و اليوم رأيت إعلام مصر يسب و يهين من قدر الشهداء بسبب كرة القدم و هذا هو المخزي – كرة قدم- أقول لكم أبي في الجنة و أنتم في النار بإذن الله سوف أحاسبكم يوم الحساب على اسم الشهيد ،و لن أنسى.. و لن أنسى ..و لن أنسى …أن مصر الحبيبة صارت رهيبة !!!"
