posted = "2009-11-19"
text = "انتى حقا علا حق يااختى ندى ان كل مايحدث وان كل ماسيحدث سيبقى الى مصلحة الصهاينه واحنا واقفين نتفرج عليهم ولكن انتى تعلافين ان المصريين كم من المرات اتهانوا من الجزائريين فى الجزائر وفى كل مكان ولكن ان المصريين شعب طيب لا يفعل ويعامل الجزائريين بالمثل انتى تحملين الاعلام المصرى المسئوليه بل وتنسين اعلا الجزائر اتدرين ان بنت من المشجعات الجزائريه هنا فى استاد القاهره بمصر عملت حركه قبيحه لا يتجرأ اى مصرى ان يفعلها ولكن الرياضه بريئه من فعل ما فعله الجزائريين فى مشجعينا انتم كسبانين يعنى كان المفروض انكم تفرحوا بأخلاق عاليه ولكنكم رايحين تحاربوا طبعا وماعليكى الا انك تقفين فى صف بلدك لأنك تنتمين اليها بل ولكن عليكم جميعا ان تتقون الله فى اخوه عرب"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203040547/http://www.20at.com:80/masr/hot-topics/10249.html"

