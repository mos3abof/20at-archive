subject = ""
author = "أشرف من الجزائر"
posted = "2009-10-21"
text = "إلى الفنان الكبير محمد منير<br />أشكرك على مبادرتك الطيبة و ذلك بقرارك رفع العلم الجزائري إلى جانب ملك الراي خالد في حفل كبير و هذا إن دلت فتدل على معدنك الطيب الأصيل ، و دمت رفيعا محترما نزيها يابن النيل يامصري ياأصيل و متى تأتي مرة ثانية إلى بلدك الثاني الجزائر لكي نتمتع بفنك الراقي و روحك الطيبة و أقول لك إنت زرت الجزائر فماذا وجدت<br />هل صحيح اننا نكره المصريين ؟ …<br />نحن نحب كل من يحبنا و لكن ندافع على كرامتنا و عروببتنا و جزائرنا بأرواحنا و نقدم النفس و النفيس في سبيل الجزائر و العروبة و الإسلام و ننتظر منك زيارة في أقرب وقت إن شاء الله و السلام عليك و حوة الله و بركاته ."
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107112519/http://www.20at.com:80/masr/hot-topics/10249.html"

