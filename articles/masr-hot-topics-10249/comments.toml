subject = ""
author = "منى من أوراس الجزائر"
posted = "2009-10-19"
text = "ياغندور احترم نفسك و خليك رياضي و فقط فأنت دون المستوى فمرة لاعب ومرة في المزرعة مع هيفاء و مرة بترقص و تغني …ايه المستوى ده ؟ ايه التفاهة دي ؟<br />كنت تتكلم و أنت تقول سنفوز على كوستاريكا و احنا …و احنا …و الآن تنسوا الجمهور المصري هزيمتكم في نهائي كأس العالم شباب …و تلهونه بالكلام التافه و الشعارا ت الكاذبة التي لا تخدم الشعبين العربيين حلل أسباب الهزيمة …ارفع مستواك و ترفع عن السقوط في المتاهات … و أخيرا شيل الماكياج اللي هداتولك هيفاء في الوادي و أخبار البنوتة نانســي إيـــه ؟"
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107112519/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
