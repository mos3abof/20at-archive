author = "أيوب - الجزائر"
posted = "2009-12-22"
text = "سلاما واحتراما للجميع لقد حز في نفسي كثيرا ما قرأت وما سمعت وما فتئت أسأل نفسي عما حصل وحاولت استرجاع بعض ما علق في ذاكرتي من بداية أيام القرعة وتحديدا المجموعة التي ضمت الجزائر ومصر ولا أريد أن يتقول علي أحد مهما كان موقعه لينعتني أو يتهمني بالتحيز لأن الأمر موثق بداية المجرم الأكبر كان النظام في مصر الذي كان يحمل ملف التوريث تحت إبطه ليجاهر به يوم الإنتصار بالقاهرة وسلاحه كان بعض الوسائل الإعلامية بكل أطيافها وخاصة الخسيسة منها التي بدأت تروج منذ البداية لتأهل مصر حتى نقشتها في عقول أبناء مصر ولكن ومع حلول موعد المباريات وبداية الوقوف على بعض الحقائق منها تركيبة الفريق الجزائري الشاب وانتصاراته المحققة مقارنة مع مردود الفريق المصري بدأ الشك يخالج المسؤولين على الفريق المصري ورقابهم تحت مقصلة آل مبارك وإرضاء لعرابهم خططوا لموعد القاهرة وكادت تكون الضربة القاضية ولكن يد الله كانت هي العليا رحمة بمن كانوا ضيوفا فوق أرض الكنانة وكانوا في حمى إخوانهم في الدين الذين فرحوا بما آتاهم بعد مقابلة القاهرة وتعزز في ظنهم الإنتصار وتيقن الجميع من أن الأمور تسير كما خطط لها وبات مؤكدا النصر …"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106142415/http://www.20at.com:80/masr/hot-topics/10249.html"

