subject = ""
author = "عربي مسلم"
posted = "2009-10-30"
text = "السلام عليكم ورحمة الله وبركاتة أشكركم على هدا الموقع أنا عربي مسلم غيور علي الأمة العربية المتفكك والمنهزمة في هدا العالم مازال المواطن العربي لم يرتقي ولم يفهم بعد أنا القدس هو همونا وإنشغالنا وسوف نسأل يوم القيامة مادا فعلنا لإخواننا في غرة هدا كلام لجميع العرب وبقينا نحن في إنشغالنا لتحضير والسب والشتم من كل الأطراف التي تريد تفكيك أمة محمد*ص* بمبارات مصر الجزائر كأنها موعد لجهاد في سبيل الله إخواننا في فلسطين يقتلون ونسائهم غنيمة لصهاينة وأطفاهم معوقون وضائعون ونحن نتكلم عن مبارات رياضية والله لاإنها الهزيمة الكبرى لنا يا عرب مصر والجزائر. لقد لعبة أسرائيل دورا كبيرا في إثارة هده الفتنة في جميع المواقع ونحن نصدق كل ما يكتب ويقال لو كان جمال عبد الناصر حيا والهواري بومدين لأعدم هؤلاء الفتانين وأعداء رسول الله .مادا نجيب عندما يسألنا سيد الخلق محمد*ص* يوم القيامة هل نقول لقد فزنا في المونديال يا رسول الله أين العقل أين المثقفون والعلماء وأصحاب رسول الله القدس اللهم ما إني بلغت فأشهد والفتنة أشد من القتل فاتقوا الله يا عرب وإلى الإتحاد"
archived = "2009-11-07"
capture_url = "https://web.archive.org/web/20091107112519/http://www.20at.com:80/masr/hot-topics/10249.html"

