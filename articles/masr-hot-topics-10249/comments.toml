posted = "2009-12-14"
text = "نقول لاخواننا الاعزاء في مصر انتم تحاولون النيل من الشعب الجزائري ارد عليكم واقول ان الشعب الدي تريدون الاتصال به متاهل الي المونديال او جنوب افريقيا .فالرجاء اعادة الاتصال بعد اربع سنواتتتتتتتتتتت تتتتتتتتت. وكمان الكبير كبير والصغير صغير الكبير بيلعب مع الكبار في المونديال والصغير يقعد في بيتو احسنلوووووووووو وووو .كمان ابو الدنيا في جنوب افريقبا وام الدنيا تقعد بالبيت اصلها متعودة ديماااااااااااا ااااااااااااااا ا<br />احنا بلد المليون ونصف شهيدددددددددددد ددد مش بلد المليون ونصف رقاصةةةةةةةةةةة ةةة ورقصنا يا جدع .سحقا لبلد تنوب فيه الرقاصات والعاهرات وتتكلم بدال وزراؤو ورؤساؤو وهو اصلا انتم عندكم رجال دول اشباه رجال مخنثين بس. يلعن ابو الزمن الحقير دا تحيا الجزائر وفلسطين .والموت والدمار للجبناء المخنثين. يا ناشر انشر من غير مقص"
archived = "2010-01-06"
capture_url = "https://web.archive.org/web/20100106142415/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
