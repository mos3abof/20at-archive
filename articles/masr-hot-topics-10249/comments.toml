author = "وصال عاشقة تراب مصر"
posted = "2009-11-19"
text = "انتى تتكلمين عن الفراعنه وتصفيهم بأنهم ملاعين احب اعطيكى معلومه علشان لما تيجى تتكلمى علا شعب مصر تكونى فاهمه الاول .<br />اختى ان الفراعنه هم مخلوق خلق علا ارض مصر بدون دين ولكن اصلا وقتها ماكانش فيه اى ديانه لكى ينتموا اليها بل انهم عظماء فعلوا مالم ولا يقدر ان يفعلو احد بل تلعنينا وتدعين ان الله يطردنا من رحمته هل انتى رب هل انتى رسول لا فبأى حق تحكمين علا بشر وتصنفيه انو ملعون وكافر انتى تحكمين بل قبل ماتتكلمى عن الفراعنه فأ‘رفى واسألى اهل الفقه والدين فى بلدك بل ولكن الفراعنه اجدادنا ولكننا مسلمون بل وفينا اخوه مسيحين وفى النهايه احب اوصلك ان المسلم مش كلمه ان المسلم من سلم الناس من لسانه"
archived = "2009-12-03"
capture_url = "https://web.archive.org/web/20091203040547/http://www.20at.com:80/masr/hot-topics/10249.html"

[[comments]]
