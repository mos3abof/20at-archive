posted = "2010-02-04"
text = "لا يزال قلبي يبض حبا لك يا مصر لا ما يسمع لا يبشر بالخير فالواضح ان اسرائيل تريد ان تضرب الجزائر بمصر لاننا كرهها كما كتم تكرهونها ولازلتم تكرهونها رغم الجدار هناك مثل فرنسي يقول خض عدوك بالاحضان كي يسهل عليك قتله والواضح ان اسرائيل بدات تاخذكم بالاحضان يا مصريين ارجوا ان كلامي هذا يصل الى قلوبكم لان من القلب الى القلب حب وورود<br />وارجو ان يعفو الله عما سلف لان ما سيخلفه هذا الشجار سيتلف كل من ينبض قلبه حبا لدين محمد والفتنة اشد من القتل<br />ارجو من الاخوة الجزائريين ان لا يسقطوا في الشرك الدي نصب لهم من الاسرائيليين الصهاينة الدين يقودون معرك ضارية ضد اخواننا الفلسطينيين امر العداب ويلهوننا في مع معارك سيتالم التاريخ منها والشعوب<br />احبكم في الله"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304185116/http://www.20at.com:80/masr/hot-topics/10249.html"

