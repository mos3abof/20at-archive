text = "تليفزيون قناة النيل بيذيع كل يوم الصبح فقرة رياضية اروبيك تفطس من الضحك<br />جايبين واحدة رياضية عروق رقبتها بارزة ولابسة باروكة وبتنهج ومش قادرة تتنفس ومعظمة وعندها فقر دم وانيميا مزمنة ومنظرها يدل على مدى المجاعة فى بر مصر ومومياء خارجة من القبر تتفسح شوية وتظهر فى التليفزيون وترجع تانى<br />هى الاشكال دى قريبة مين فى التليفزيون<br />دى اشكال تخللى الناس تكرة الرياضة<br />وتقولى اعلام وصحف وتليفزيون<br />بلاش قرف"
