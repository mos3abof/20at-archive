text = "إخواني أقول لكم بصراحة أنني أقيم في غرفة نحن اثنين مصريان و اثنان جزائريان و نعيش أسرة واحدة و نهتم لمشاكل أمتنا العربية و أنا أعيش منذ أربع سنوات بالجزائر لم أجد الكره الذي يتكلم عنه البعض بل بالعكس فهم يحبوننا و أنا كل ماأدخل مقهى أو مكتبة أو أي سوق لاقتناء مشتريات و عندما يعرفون أنني مصري يفرحون بي كثيرا و ألقى محبة و طيبة و كأنني في مصر فلا تنجروا وراء إعلام البلدين و تحيا الأخوة العربية مع تمنياتي الفوز للفريق المصري ."
