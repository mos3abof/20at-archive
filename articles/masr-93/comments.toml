text = "بس للاسف بيحصل اكتر من كدا كمان<br />حسبى الله ونعم الوكيل فى اللى ماسكين البلد<br />ربنا يريحنا منهم ويجعلهم عبره لمن يعتبر<br />لك الله يا مصر<br />موضوعك قلب علينا المواجع كفايه الكوارث اللى مبتخلصش"
