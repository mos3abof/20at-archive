[[comments]]
order = 2
subject = "شكرا للحكومه"
author = "ayat"
posted = "2006-04-01"
text = "يا جماعه الحكومه شافت ان عددنا بقه اكتر من 70مليون فكان لازم حل سريع للحد من الزياده السكانيه وطبعا مش هيمشوا فى الشارع يموتوا فى الناس فصادف مع مناقشه هذه المشكله الخطيره خيبه الاطباء المصريين. حد يعرف كام دكتور اتعرض للمحاكمه بسبب اهماله فى اداء واجبه؟؟؟؟<br />كله بيرجع للقضاء والقدر لا مستشفيات بفلوس نافعه ولا ببلاش نافعه<br />وراحت عليك يادنيا وراح زمن الشهادات"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121808/http://masr.20at.com:80/article.php?sid=93&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "شكر وتقدير"
author = "هشام علام"
posted = "2006-04-22"
text = "فى البدايه بشكر جدا هايدي ابراهيم على متابعتها الجيده والتغطيه اللى قامت بيها للموضوع.. اما ردود الافعال اللى حصلت بعد نشر التحقيق فلاننا كنا متوقعينها فكان لازم تحقيقنا قدار انه يخرس اى لسان قد يخرج ليزيف الحقائق ويقلبها ويجمل القبيح..احنا كنا 3 مغامرين وحبينا ندخل عالم صاحبة الجلالة لكن من باب الكل كان بيخاف منه ..باب املخاطره والمغامره باعز واغلى ما يملكة شاب فى بداية حياته..المستقبل ..والحمد لله كانت معركة شرسه مع المسئولين وعلى راسهم رئيس مجلس الشعب اللى اقسم على الملاء انه لازم يحبسنى لكن ويمكرون ويمكر الله والله خير الماكرين..وبجد اى انسان شايف حاجه غلط فى البلد دى يعمل جهده عشان يصلحها وماتخافوش من حد وافتكروا قول الله تعالى \"الذين قاله لهم الناس ان الناس قد جمعوا لكم فاخشوهم فزذادتهم ايمانا وقالوا حسبنا الله ونعم الوكيل فانقلبوا بنعمة من الله وفضل لم يمسسهم سؤ\" دوعاتكوا لينا ولو فى اى حد شايف حاجه ويحب اننا نشاركه فى معالجتها فا الايميل بتاعى متاح ورقم تليفونى كمان لاى حد فى اى وقت وربنا معانا كلنا<br />هشام علام..صحفى غلباوى<br />manymoreuneed@hotmail.com<br />0125865835"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121808/http://masr.20at.com:80/article.php?sid=93&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "الساكت عن الحق شيطان اخرس"
author = "منى نادر"
posted = "2006-04-26"
text = "فى البداية اتقدم بكل الشكر لموقع ولاد البلد وتعليقة الرائع على الموضوع .كما اشكر كل من تفضل بالتعليق علية وكم اسعدنى كثيرا احساسى باننا لازلنا على قدر عالى من الوعى يسمح لنا ان نميز بين الصالح والطالح وبين المجنى والمجنى علية.ياولاد البلدى : دى بلدنا احنا, احنا اللى هنبنى ونصلح احنا اللى هنعمل بكرة ومحدش هيفرضة علينا. من راى منكم منكرا فليغيرة لان الساكت عن الحق شيطان اخرس وليعلم الجميع كبارا وصغارا ان اولاد هذا البلد لن يكفوا عن الدفاع عنها ولو دفعوا جميعا الى السجون"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121808/http://masr.20at.com:80/article.php?sid=93&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "مش كل مرة"
author = "خالد عبد العزيز"
posted = "2006-05-13"
text = "ازيك ياعم هشام طبعا و ان كنت انا بحييك بعض الشئ الا انى بقولك مش كل مرة تسلم الجرة يا عم هشام لان زى ما انته عارف ان الحسنه بتعم لكن السيئة بتخص واهم شئ تنتبة لدراستك الوقتى لانها اهم من كل شئ على الاقل الوقتى . يا ابنى دة انتة كنت هاتروح فى شاربت مية .مع تحياتى/خالد عبد العزيز النادى"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904121808/http://masr.20at.com:80/article.php?sid=93&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "ضربة معلم"
author = "للاسف انا قريت الموضوع بتاعكم متاخر بس انا سمعت عن الضربه الجامده بتاعة الصحفيين التلاته دول..بس صدقونى انا كان نفسي اسال هشام انت جالك قلب ازاى تعمل كده وتدخل برجلك العناية المركزة..وكمان صورتوا..وفى الخار جايين يقولوا انتهكتوا واتعديتوا.. ده الصور اللى نازله ماشاء الله تسد عين الشمس يعنى مش بكاميرا موبايل ولا بخدعه عملوها..احنا امتى هايبقي لنا قيمه..مش سعر..وبمبدا الحكومة"
posted = "2006-05-27"
text = "اللى تعرف ديته اقتله..يبقي كلنا نستحق القتل..ودمتم"
