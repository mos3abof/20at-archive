order = 5
subject = "لا جديد"
author = "ابو درويش"
posted = "2006-12-21"
text = "ما ذكره محرر هآارتس عن القاهرة يفجر في قلوبنا السعادة فمصر البلد الوحيد في العالم الذي تتفاعل داخله جميع الفئات ليظهر وكأنهم نسيج واحد بالرغم من الظروف التي تمر بها حاليا اما عن مطامع الصهاينة فأستطيع ان اعلق علي هذا بأنهم لا يكفون عن حلمهم البالي وهو قيام دولة اسرائيل الكبري التي تمتد من المحيط الي الخليج وهذا ليس بغريب علي شعوب جائت من وراء الجبل الخيانة في دمائهم منذ فجر التاريخ والقرآن ينص علي ذلك في العديد من مواقعه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102430/http://masr.20at.com:80/article.php?sid=1335"

