[[comments]]
order = 3
subject = "عدو عاقل خير من صديق جاهل"
author = "أحمد القماش"
posted = "2006-12-21"
text = "الاستاذ/ احمد بلال السلام عليكم ورحمته وبركاته في البداية اشكرك علي هذا الموضوع واعلق لحضرتك عي الموضوع ان فوبيا كراهية اليهود جاءت من امجاد عساكر الحركة الاشاوس الذين جروا مصر الي ثلاثة حروب مع اسرائيل وهي 56 وهزيمة 67 وكان من نتائجهما القيام بحرب 73 بطريق اللزوم هذه الحروب وخصوصا نعرة عبد الناصر في 56 لماامم قناة السويس بقرار منفرد دون تدارك عواقب قراره مع ان فترة الامتياز كانت ستنتهي في 1968 الا انة اممها واغلقها بالضبة والمفتاح لمدة 25 حتي فتحها السادات عام 1975 وفي 1967 قال في البحر خنحدفهم وان واسرائيل ومن ورا اسرتئيل وان معجبهمشي البحر الاحمر يشربوا من البحر الابيض فردت علية الادارة الامريكية قائلة في تصريح اننا سنلوي زراع جمال عبد الناصر حتي تنحني راسة ونسقية من ما بولة يااخونا هذة الحروب الناتجة عن النعرة الكذابة اضرت بمصر والقضية الفلسطينية تحديدا وبلسان الفلسطينيين ابان حرب 48 قالوا للعرب لا تتدخلوا بجييوشكم هذا الدولة ناشئة والعالم متعاطف معها وهي عبارة عن عصابات وميليشيات ولا ينفع معها الحرب النظامية ساعدونا بالمال والسلاح فقط لكن حطينا مناخيرنا ودخلنا حروب عديدة المستفيد منها اسرائيل والدول العربية التي تغتني علي الازمات بارتفاع سعر البترول وبعدين وصلت الي ماوصلت اليه من الغني والبذات في حق المصريين وكان عند السادات حق عندما وصفهم بالاقذام وتدليلا علي ذلك بعد فض الاشتباك الثاني مع اسرائيل ذهب السادات الي السعودية ودول الخليج والكويت في اطار زيارة عربية وطلب منهم اموال لشراء سلاح وذخيرة وكان لايطلب صدقة فحرب اكتوبر رفعت برميل البترول من 5 دولار الخمسة وخمسين ماسالوش عنه السعوديون والكويتيون لم يستقبلوه وال استقبلة بمطار الكويت سيارة السفارة المصرية وكان وقتها فص<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102430/http://masr.20at.com:80/article.php?sid=1335"

[[comments]]
order = 4
subject = "حرام عليك"
author = "فطوطة"
posted = "2006-12-21"
text = "الى الاخ احمدالقماش مش معقول الكلام دة اولا علشان الدين الاسلامى بيقول غير كدة ثانيا ان ولادالكب دول الى هما الصهاينة مش عدو عاقل زى ما انت بتقول بلعكس دول اشرس عدو يجب ان تتقى شرة ولا تامن خيرة وعلى العموم بلنسبة للجماعة العرب ومعملتهم للمصريين هناك احب اقول لك بان دة ناتج عننا احنا وعن دور الحكومة المصرية وسيبين البلد ماشية مش عرفين على فين ولو خير بلدنا بقى لجميع افراد الشعب وليس فئة معينة هيبقى الوضع مختلف تماما وساعتها هنقدر لان الذى لا يملك قوتة لا يملك حريتة وبعدين دة اسرائيل بتصدرلك كل ما هو مدمر وغير صالح والعيب عندنا لان دة مصالح عليا ورجال اعمال وسلملى على البزنز وعلى احمد عز وحديدة اللى بيروح هناك علشان الجدار العازل برجا الرد"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102430/http://masr.20at.com:80/article.php?sid=1335"

