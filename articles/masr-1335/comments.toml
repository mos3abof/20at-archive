subject = "لماذا العرب المسلمين قلوبهم سوداء"
author = "قبطي"
posted = "2006-12-22"
text = "الي اصحاب تعبيرات الدم والثأرلماذا انتم دائما قلوبكم مملوءة بالكراهيةعلي ايصاحب حضارة اخري ولا تقبلون التعايش السلمي المانيا حاربت انجلترا وامريكا وفرنسا وقتلوا من بعضهم البعض الملايين والان الشعوب والحكومات متعايشة وزي السمنة علي العسل ومفيش في قلوبهم السواد الرهيب ده وبرضه اليابان وامريكا ليه اليابانيين مبيقولوش الثار من امريكا وعلاقتهم اكثر من ممتازة مع امريكا ي يا مسلمين أمتي قلوبكم هتبقي طاهرة ونقية لكل العالم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102430/http://masr.20at.com:80/article.php?sid=1335"

[[comments]]
order = 11
subject = "من المواطن المطحون الي لؤلؤة"
author = "المواطن المطحون"
posted = "2006-12-22"
text = "مش ملاحظة ان الموقع شغال مية مية في نقد الاخوان زي الحكومة ما بتعمل لدرجة اني حسيت ان الموقع ده جريدة حكومية او مجلة روزليوسف تابعة للنظام الحقير او برنامج (حالة حوار) للديوس عمرو عبدالسميع , ولو تلاحظي ان هناك 3 مواضيع علي الاقل في نفس الوقت بتنتقد الاخوان او علي الاقل مركزة عليهم.<br />مشكلة النظام انه فاكر انه اذكي من الشعب المصري وانه بالهجوم علي الاخوان هيبقي منتصر او لتشويه الاخوان امام الشعب لكن للاسف ده بيخدمهم اكبر خدمة مجانية لانه بالطبع بالفكر الجديد بتاع ننوس عين امه جمال برايز البلد اكيد رايحه في ستين الف داهية .<br />للعلم( انا مش اخواني)"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102430/http://masr.20at.com:80/article.php?sid=1335"

[[comments]]
order = 12
subject = "فاتت عليك يااحمد يا بلال"
author = "ايمن امام"
posted = "2006-12-22"
text = "استاذ احمد بلال / فاتك اهم شىء من المقال - هذا الصحفى الصهيونى تحدث عن كتاب خاص بالمعمار المصرى القديم وان هذا الكتاب سرق منه - واكررها سرق منه - ياترى اللى سرقه مين بالضبط - الشعب المصرى ولا صديقته الوهميه المسماه شبماء والاسم هنا له مغزى- واختياره لاسم حى السيده ذينب - ثم محل الجحش للفول والطعميه - باختصار انا ارى ان المقال له مغزى اخر غير ماكتب تصريحا ولكنه يحمل تلميحا - ايضا اشارته الى سوريا واختراعه لسبب فى المقال لكى يشير اليها - باختصار - الفول من الجحش والسيده زينب وسرقه الكتاب وزياره سوريا - مش عارف قدرت اوصلك اللى شعرت به ام لا/ ايمن امام"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102430/http://masr.20at.com:80/article.php?sid=1335"

