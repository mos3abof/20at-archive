[[comments]]
order = 15
subject = "السم ... فى العسل؟"
author = "امل ضائع"
posted = "2006-12-23"
text = "ليس بامكان اي واحد هنا ان يقول ان اليهودى علي مر الزمان فى العصور او الديانات السماوية كان انسان صادق امين.<br />اذا الموضوع يتطلب منا وقفة؟<br />لماذا هذا ال شالوم فى القاهرة؟ ولماذا يذهب هنا وهناك؟ اهتمام هذا الشالوم بالعمارة المصرية القديمة؟ علاقاته مع الناس العاديين؟ وهل يجعلهم يعرفون انه يهودى( اشك) بل من المستحيل؟<br />الناس دى بتكره كل البشر حتى نفسهم؟<br />كان لى الفخر ان ابي وخالي وعمي كانو من المحربين القدماء فى اكتوبر<br />وقد كنت فى السبعة من العمر واذكر ان ابى اطال الله فى عمره اول مره رجع لينا من الجبهة بعد الحرب احضر لنا بعد الاشياء الخاصة بالجنود اليهود . والله يا اخوانى كانهم فى فسحة او رحلة وما ذلك ليس لهم هم الا تامين انفسهم وحياتهم شغلهم الشاغل<br />ومع ذلك فى غاية الجبن.<br />يبقى الشالوم هذا يذهب فى القاهرة هنا وهناك ويتفاخر بانه يهودى والله مستحيل.<br />الموضوع فى ان........<br />واعتقد ان بائع الفول لو عرف بان كلب يهودى حياكل الفول بتاعه لو رامه فى الزبالة والله ما كن يرميه. حتى ياكل الناس اللي دمره اقتصاد بلده. وبيحربه شباب بلده<br />ودمنا اللي راح فى 67 والاسري اللي ذبحوا كما النعاج؟<br />عليه اللعنة.. اما الفول بالسم الهاري يا ابن ( )"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102430/http://masr.20at.com:80/article.php?sid=1335"

[[comments]]
order = 16
subject = "מוות"
author = "klo"
posted = "2006-12-31"
text = "الموت لليهود واذيالهم في كل بلد عربي حر عاشت فلسطين عاشت العروبة عاشت الوحدة العربية وليسقط كل عميل جبان الموت لكل رئيس عربي متعامل مع الهيمنة الامريكية رحم اللة صدام واعلموا يا عرب ان كل نساء العرب لو اجتمعن ليلدن مثل صدام لما استطعن اللهم ارحمة واعف عنة واكتبة في عليين واحشرنا معة ومع نبينا محمد (ص)ومع كل الشرفاء الذين ماتوا لاجل وحدة العرب والويل لكل اذيال الاحتلال كان في فلسطين امثال ابا مازن ام محمد دحلان ام عبد اللة الثاني ملك الاردن ام مبارك ام امراء الخليج بفئاتهم الماجنة الذين باعوا ارضهم ونفطهط بثمن بخس ولا حرج اللهم اهدهم الى سواء السبيل او لا تجعل منهم احدى ولا تذر منهم باقية افيقوا يا عرب والان دور من من العرب ولا حراك سوريا ام مصر !!!!!!!!!!!!"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102430/http://masr.20at.com:80/article.php?sid=1335"
