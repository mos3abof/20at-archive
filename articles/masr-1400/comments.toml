text = "نعم انه اقذر من المدمنين والشواذ , لانه يسرق بلد بها 70 مليون ويغتصب ارادة الشعب المصري كله لان الشعب المصري بيكره مبارك وابنه المدمن الحقير بتاع النووي اياه , طب يا معرص يا مبارك قبل اما تتكلم علي النوويروح صلح مشاريعك الفاشلة الاول في توشكي وشرق التفريعة............ الخ, من المشاريع التي ضحك علينا بيها , وعلشاننوس عين امه جمال برايز يمسك الحكم طلعوا علينا دلوقتي بالنووي ..يخي احا.<br />لا للتوريث ... لا للتهليب .. لا لمبارك وجمال"
