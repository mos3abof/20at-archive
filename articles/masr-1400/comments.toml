[[comments]]
order = 13
subject = "تصبحوا على ثورة ..."
author = "إبن بهيه"
posted = "2007-01-06"
text = "أولا شكرا لعشرينات<br />وشكرا للأخ أحمد على هذا الموضوع الجيد الذي طالما تحدثنا عنه وعن كيفية تعيين الرئيس المصري من قبل الإدارة الأمريكية والناس برضه كان عندها شك .. حتى بعدما عرضت الفضائيات صور المراسلات التي أفرج عنها مؤخرا بعد مضي 25 سنة حسب لاقانون الأمريكي والتي دارت بين سفير أمريكا في مصر ووزارة خارجيته في واشنطن سنة 1975 حين أرسل سفيرهم في القاهرة إلى واشنطن فاكس مستعجل يبلغهم فيه بخطأ السادات في تعيين حسني مبارك رئيسا للوزراء<br />وأبلغهم بأن حسني مبارك هو الرجل المطلوب للمرحلة القادمة ليكون رئيسا لمصر وتعيينه رئيسا للوزراء سيحرقه كرئيس وربما لن يتمكنوا من تعيينه رئيسا لمصر فيما بعد<br />الكلام ده كان الصبح .. وبعد الظهر وصل فاكس من أمريكا للسفير بتاعهم في القاهرة .. يقول الفاكس للسفير الأمريكي .. إذهب إلى السادات وأمره بتعيين مبارك نائبا له .. وبالليل تم الإعلان عن تعيين حسني مبارك نائبا لرئيس الجمهورية .. هاهاهاههههه<br />آدي ريسكم اللي عامل دكر وهو حتة هلف أمريكاني قذر متعين بورقه فاكس بتلاته تعريفه<br />بس فالح يستعبط ويعمل رئيس علينا وعلى مخاليق ربنا الغلابه هو الأنجاس الكلاب بتوع الحراسه بتوعه ..<br />من كام سنه وقف الدهل الواطي ده وقال بقين حمضانين .. قال لو كانت أمريكا دولة كبرى في العالم فمصر دولة كبرى في المنطقه .. الناس هللت وكسب الجبان شوية تعاطف .. بس اللي عارفين لافوله وفاهمين ألاعيبه الأمريكانية عارفين .. وكنا بنقول في سرنا وجهرنا .. كداب يا خيشه .. كداب يا موظف لابيت الأسود يا واطي ..<br />طبعا المتابع لزيارات إبن الواطي جيمي بتاع لجنة الوكوسات السرية لأمريكا والتطورات المصاحبة لها على صعيد نشوء وانتشار المسيحية الصهيونية والمرحلة الماكسيموسية في البلد هيعرف إنها ك<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103326/http://masr.20at.com:80/article.php?sid=1400"

[[comments]]
order = 14
subject = "لابد من"
author = "لا بد من سقوط مبارك وإنسحابه نهائياً من الحكم وحكومة إنتقالية من القضاه لحكم مصر فترة إنتقالية يحدث بعدها إنتخابات حرة."
posted = "2007-01-06"
text = "وبالمناسبة جمال مبارك مش مصرى لأن أمه إنجليزية من أصل يهودى وهى ليست مسلمة وهو بالطبع ينتسب للإم حسب القانون الإنجليزى يعنى لا يصلح لحكم مصر نهائياً<br />وبعدين أمريكا بتخاف من الشعوب علشان عارفة إصرارها لكن كل إللى هى بتعمله إنها بتاخد الحكام عملاء ليها والشعوب هى إللى تقدر تسقط الحكام الخونة يعنى شوفوا حسن نصر الله عامل إيه علشان يسقط السنيورة ويعنى أمريكا عملت إيه للسنيورة فى النهاية الشعوب أقوى وبأصرارها على الحق لن تستطيع أمريكا الوقوف فى وجهها ومصر دى بلدنا إحنا مش بلد الخائن ولا مراته اليهودية ولا إبنه الغير شرعى فى الحكم وبرضوا ها أقول تحيته المعروفه الشاذ المدمن الحقير باشكاتب البنك القذر الطماع<br />اللهم أسقط مبارك كما أسقط شارون وصدام اللهم آمين يارب العالمين"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103326/http://masr.20at.com:80/article.php?sid=1400"

[[comments]]
order = 15
subject = "نقلا عن كاتبه فى احد المواقع"
author = "عباس فجل"
posted = "2007-01-06"
text = "· توصلت إلى أننا لكي نكون عادلين كمعارضين أو كبشر ، فانه علينا أن نربى أنفسنا على رؤية الأشياء الإيجابية ، والاعتراف بها ، مثلما نرى السلبيات ونعريها 00 فلقد تعودت المعارضة المصرية أن لا تتحدث إلا عن السلبيات الحكومية ، وقد يكون لها عذرها في كثرة وضخامة السلبيات ، ولعلى واحدة من هؤلاء لسنوات مضت ،<br />· لكنني ولأول مرة لا أستطيع أن أمنع نفسي من ضرورة إعلان رأيي وشعوري ببساطة تشبها ببساطة وبذكاء أراء الرئيس المصري مبارك ، في المؤتمر الصحفي الذي ضمة ورئيس الوزراء أو لمرت في شرم الشيخ ، لدرجة أن رؤيتي السابقة بالتأكيد بدأت في إخضاعها لمزيد من التفكير والتأمل ، ولعلى انصح الرئيس مبارك بأن يكثر من التحدث بنفس البساطة مع شعبه والاستماع إليه بنفس البساطة ودون وسطاء ، لأن ذلك كفيل بحل إشكاليات كثيرة داخلية ، كما انه وسيله ليلمس معانات الشعب بصدق ، يوصله لحلول سريعة وفاعلة لوضع حد لألام الناس والعمل على دعمهم ليتحقق النجاح داخليا مثلما هو خارجيا 0<br />· فبرغم أن عملية الاجتياح الإسرائيلي لرام الله في نفس توقيت اللقاء بين الرئيس المصري مبارك ورئيس الوزراء الإسرائيلي أو لمرت ، ألقت ظلالها على اللقاء بلا شك ألا أنني تبسمت رضاءا حين فاجأتني البساطة ودرجة العملية والذكاء والعمق التي قال بها الرئيس مبارك رأيه في المؤتمر الصحفي عقب اجتماعه مع رئيس الوزراء الإسرائيلي أو لمرت : فيما لو طرحت سوريا رغبتها الكاملة في السلام مع إسرائيل ، ورفض إسرائيل ذلك بحجة عدم الجدية ، حين قال مبارك : إذا رغبت في ذلك سوريا فعلى إسرائيل الجلوس على طاولة المفاوضات لاختبار الجدية ، لآن الشكوك موجودة لدى الطرفين السوري والإسرائيلي ، وانه لا سبيل لاختبار الجدية إلا البدء في التفاوض ، ليثبت الشك أو الجدية ، أدركت انه ط<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103326/http://masr.20at.com:80/article.php?sid=1400"

[[comments]]
order = 16
subject = "معلش فى ده الكلام"
author = "عباس فجل"
posted = "2007-01-06"
text = "معلش يعنى انا عارف ان المقال اللى نقلته من احد المواقع ده يمكن يحبس دمكم بعض الشىء بس الصراحه يعنى فيه كلام منطقى خاصه اول كام سطر منه ، بعيدا عن الصراخ و الصوت العالى و الاتهامات الهبله بالخيانه و العماله<br />ووحياه ابوكم يا شيخ منك له ما تقولوا على شغال فى الوطنى الديموقراطى ولا انا من بقيه اهل صفوت الشريف ولا الكلام الاهطل ده لانه بصراحه مش بيضايق اكتر ما بتفرس من غباء اللى بيقوله."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103326/http://masr.20at.com:80/article.php?sid=1400"

[[comments]]
order = 17
subject = "مين إللى قال"
author = "مين إللى قال أننا ها نقبل واحد شبع من نهب الشعب وبعدين الحرامى عمرة ما بيشبع ومبارك حرامى ونهب الشعب كله نفسى بس يقول لنا هو وعيلته كلها لما مسك الحكم كان رصيده كام ودلوقتى رصيده كام ومنين؟ أنا مش بسأل علشان مستنى إجابة لإن الإجابة معروفه وهى من النهب وبيع المصانع والشركات والعمالة القذرة المقبوضة الثمن من أمريكا وأسرائيل فيعنى إللى بيتكلم عن إنه شبع ومشبعش إن شاله يارب يطفحة بالسم الهارى كل إللى نهبة هو وعيلته من مص دم الشعب. لكن الأهم إنه أصلاً غير شرعى فى الحكم يعنى مالوش أنه يقعد فى الحكم ولا ثانية لإنه جاء أثر إنقلاب قتل فيه السادات يعنى ده لازم يعاقب ووجوده فى الحكم غير قانونى وما بنى على الباطل فهو باطل يعنى حكمه كله باطل ولا بد أن يرد لمصر كل إللى نهبة وبخصوص التوريث فهو يوعد بما لا يملك لمن لا يستحق وهو يعلم جيداً ذلك بدليل محاولته المستميته للقضاء على المعارضة مثل الدكتور أيمن نور والدكتور نعمان جمعة والسيد طلعت السادات وأعتقاله لرؤوس الإخوان المسلمين علشان يلهى الشعب ومحدش يقرب منه وعلى فكرة ده جبان وأكبر دليل مراته إللى عمالة تتنطط فى الموقع وفى مواقع كثير علشان تحبط الشباب وتخليلهم يرضوا بفساد إبنها إللى رحته وحشه والغير كفء فى دولة مليئة بالخبرات وهو يا دوبك كبيره يرجع لإصله موظف فى البنك يستنى مرتبه أول الشهر وكفاية عليه نهب بقى"
posted = "2007-01-07"
text = "اللهم أرحم مصر من مبارك وطهر أرضها من دنسهم اللهم آمين"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103326/http://masr.20at.com:80/article.php?sid=1400"

[[comments]]
order = 18
subject = "هو إيه بالظبط"
author = "إيه إللى عمال يتكلم عن البساطه والبطاطا بتاعة اللامبارك إللى إتكلم بيها مع أولمرت يعنى يقتلوا الفسلطينيين فى غزة وتقولى بساطة يعنى يبيع مصر والعرب وتقولى بساطة نفس أعرف عمل إيه للفلسطينيين غير أنه بيماطل ويمط علشان يوهم أمريكا بأهمية وجوده بعد لما إبتدت تشعر إنه عاله عليها وبيكلفها كثير زى كده لما هو عالة على مصر وناهبها."
posted = "2007-01-07"
text = "مبارك عنده 82 سنة يعنى ما تقوليش بيتكلم ببساطه وهو كان باين عليه الإعياء والإرهاق ومكنش أصلاً قادر يتكلم من بابه.<br />وبعدين هى فين البطاطا بتاعته دى فى حكمه لمصر ودكتاتوريته وهو بيعتقل أيمن نور ولا الإخوان المسلمين ولا بيهمش المعارضة إللى رفضه وجوده بالتزوير ورفضه نهبة وبيعه لأملاك الشعب يعنى بالعربى كده أكتب فى قضية مش خسرانه والشعب أجمع على فساده وكذبه من 26 سنة والنشاط المفتعل إللى بيعمله واحد عنده 82 سنة ده معروف كويس قوى ليه وهو لتوريث الإبن المدمن الشاذ إللى العالم كله أتكلم عن فساده وطبعاً مطلوب أنه يحلى نفسه معتقد إن الشعب ناسى فساد العيلة كلها. حسبى الله ونعم الوكيل."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103326/http://masr.20at.com:80/article.php?sid=1400"

