[[comments]]
order = 4
subject = "الموضوع غريب"
author = "مبارك ومراته وإبنه بيتنططوا على أمريكا وعلى الشعب وبيلعوا على كل حبل علشان يوصل موظف البنك معدوم الخبرات للحكم لكنى أرجع وأقول إرادت الشعب أقوى وأمريكا بتخاف من رفض الشعوب لسياستها وطبعاً شايفين تراجعها فى العراق بعد لما خدت علقة محترمة هناك، لكن إنه يروح يأخذ الأوكية من بابا بوش أو مراته تجرى بقطع الآثار وتهادى بيها زعماء العالم علشان يوافقوا على الباشكاتب بتاع البنك يحكمنا فإحنا إللى ها نتحكم والرفض لازم يكون مننا يعنى هى أمريكا عملت حاجة لإسرائيل لما حسن نصر الله إداهم على دماغهم"
posted = "2007-01-05"
text = "ياجماعة الموضوع موضوع الشعب وهما يبحاولوا يحبطوا الشعب علشان يضعف وبيعتقلوا رؤوس الإخوان علشان هما أقوى معارضة موجوده دلوقتى بعد طبعاً لما أعتقلوا أيمن نور وطلعت السادات وهمشوا كل الأحزاب. ياجماعة شوفوا التلفزيون المصرى وإنتم تحسوا إننا فى مجتمع عبادة الأصنام يعنى مالوش شغلة غير أخبار مبارك وعيلته وطبعا مدفوع الأجر من دم المصريين لكن إرادتنا أقوى ورفضنا هو المؤثر والشعب هو إللى ها يعين مش أمريكا يعنى الحاكم العثمانى هو إللى كان بيعين الولاه لمصر ورغم كده قامت ثورة يوليو وأطاحت بكل الفساد ده. إرادة الشعب أقوى وأظن إحنا شايفين إرادة الشعب فى لبناء عاملين إيه علشان يسقوا عميل من عملاء أمريكا وقضوا العيد كله فى الشارع من أجل الوصول للحفاظ على حرية بلادهم عايزين إعتراضات قوية من الشعب ورد فعل عنيف يوقف مبارك الجبان هو وعيلته عن إللى بيعملوا العيلة دى أصلاً غير شرعية فى الحكم دول قتله ونهبوا البلد ولو كان عندهم ضمير ولا حب للبلد كانوا ها يحاولوا يورثوا الشعب للإبن المفتقد لكل الخبرات فى بلد مليئة بالكفاءات. إرادة الشعب هى الأقوى والشعب هو إللى ها يقول لهم لا ولا أمريكا ها تنفعهم ولا إسرائيل هاتدافع<br />اقرأ بقية التعليق .."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103326/http://masr.20at.com:80/article.php?sid=1400"

[[comments]]
order = 5
subject = "ومال ام امريكا"
author = "احنا شعب غلبان لا نختار اى رئيس يحكم بلدنا"
posted = "2007-01-05"
text = "انما ما تاتى بة المقادير<br />واحيانا بطريقة اقرب الى العشوائية وضربة حظ مجهولة التوقع<br />نحن لم نختار جمال عبدالناصر ولا كان حتى مجرد تخيل ان يحكمنا السادات<br />سلموا امركم الى اللة وارضوا بمن تاتى بة المقادير فهذا هو قدرنا ولا رد لقضاء اللة<br />وعسى ان تكرهوا شيئا وهو خير لكم<br />لا تتعبوا انفسكم بمناقشة مثل تلك المواضيع لانها غير مجدية"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103326/http://masr.20at.com:80/article.php?sid=1400"

[[comments]]
order = 6
subject = "الحمد لله"
author = "يا سيدى ومن امتى المصريين اختاروا حكامهم منذ ايام الفراعنه"
posted = "2007-01-05"
text = "ده انت فى نعمه اساسا انك قادر تكتب كده و تعترض ده فى بلاد تانيه اصلا مينفعش تدخل على موقع كده و تكتب هتلاقيه محجوب من الاساس<br />بس الشهاده لله يعنى المصريين مره اختاروا حاكمهم والظريف ان هم ساعتها برضه ملقيوش واحد مصرى يسد فاختاروا الالبانى محمد على<br />فيعنى كده لو عمك المرشد العام قال ممكن واحد ماليزى يحكم مصر يبقى مجابش حاجه جديده ده بالعكس انت حتى لو جيت تشترى قطع كمبيوتر ناس كتير هتنصحك بالماليزى!!"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103326/http://masr.20at.com:80/article.php?sid=1400"

[[comments]]
order = 7
subject = "بص ياعم الامور انتا وهوا ؟"
author = "مصرى حتى النخاع"
posted = "2007-01-05"
text = "اولا ياست فوزية ممكن لو سمحتى تدينى لنك الموضوع دة علشان اتاكد ان سعادتك مبتالفيش من عندك اى كلام والسلام<br />ثانيا بالنسبة لموضوع امريكا ومصر اللى يقرا الموضوع كدة يفتكر ان امريكا سايبة الدنيا كلها وجاية لمصر مع العلم ان العصر دة مع كل اسف عصر امريكا بتعمل كل اللى هيا عايزاة مش فى مصر بس من اول امين عام الامم المتحدة لغاية سياسات الحكومات وتصوروا انها بتتدخل فى سياسات الدول الاوروبية وكلنا فاكرين مشكاة فرنسا امريكا اللى خلت وسائل الاعلام الامريكى تحث الناس على السخرية من البطاطس المقلية لمجرد ان اسمها فرنش فرايس مما حدا بالسيد رئيس فرنسا الى مراجعة نفسة ؟<br />السؤال بقى ياترى دة جديد فى الدنيا ؟ الاجابة لا لان من فجر التاريخ كنا احنا الفراعنة اهم مملكة على وجهة الارض وكنا بنقهر اهل الحبشة مثلا ونستولى على انتاج ارضهم لصالح المملكة الفرعونية<br />قصد فى النهاية ان امريكا مرحلة فى عمر البشرية حتعدى وحييجى الصينيين وحنقعد هنا نتكلم نفس الكلام اللى لايجيب ولا يودى"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103326/http://masr.20at.com:80/article.php?sid=1400"

