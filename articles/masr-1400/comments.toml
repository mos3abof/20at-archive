[[comments]]
order = 2
subject = "ملاحظه"
author = "عم صبحى البقال"
posted = "2007-01-05"
text = "بالمناسبه و على ما اعرف ان مساله المعونه هذه يتحمل مسؤليتها الرئيس الراحل السادات و هى جزء من اتفاق السلام<br />هذا بخلاف ان حديث الدول العربيه عن المعونات احيانا يكون بشكل مستفز<br />كمثلا فى فتره سابقه لرئاسه حماس للوزاره وقت ما كانت المعونات تصل لفلسطين وصلت لهم معونه يابانيه او صينيه لا اذكر المهم انها كانت اسيويه والسلام ، ولكن اذكر التصريح الصادر وقتها من قيادات فلسطنيه هو انهم كانوا يرغبون ايضا فى دور فعال للقوى الاسيويه فى عمليه السلام وتحدثوا عن الصمت الاسيوى .... الخ<br />المهم ان المساعده الاسيويه قوبلت بالاستهجان!!<br />يعنى دوله لا ناقه لها ولا جمل فى الموضوع قررت المساعده فقوبلت السب لا بالشكر!<br />ولا تقل لى ان العالم كله مسؤل و مشارك بصمته فى المشكله ، الحقيقه هى ان الشعب هو المسؤل الاول عن حل مشاكله ، فمن ساعد اليابان عندما ضربتها امريكا نوويا ، ولكن قيادات شعب تتقاتل فيما بينها و تتصارع حول اطماع فى الحكم ثم بعد ذلك يطلبون من الاخرين حل مشاكلهم ، هذا غريب.<br />ولا ايه؟"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128103326/http://masr.20at.com:80/article.php?sid=1400"

