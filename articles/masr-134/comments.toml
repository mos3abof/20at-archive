[[comments]]
order = 7
subject = "سورى يا جماعة"
author = "max"
posted = "2006-04-16"
text = "انا خرجت عن سياق الموضوع بصراحة محدش يحول انا يتعرف على بنت او ولد عن طريق حدتانى انا طبعا اقصد لو كان حد معجب بشخص معين مثلا ممكن تكون النت صاحبتك بتحب الولد ده بس لسه محصلش نصيب والعكس صحيح وطبعا فى حاجات تانية كتير وومكن يقلك مثلا ان البنت ديه ماشية مع الجامعة كلها او ان الولد ده ملوش لزمة او عبيط او بيلعب بالبنات على فكرة فى حوارات كتير فى المجال ده بس كفايه كد النهاردة ويريت يا استاز الصحفى انا مش عارف اسم حضرتك بس يا ريت تكتب موضوع عن الكوسة فى الدوارت بتاعت الجامعة انا عشت معظمها واعتقد ان عندى تعليقات كتيرة وحاجات حقيقية حصلت فعلا وشكرا لك وكل التيم الجميل"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423182850/http://masr.20at.com:80/article.php?sid=134"

