text = "دا حاجة غريبة يا ناس<br />كل متسأل أي حد يألك بحب ،في الشارع ،في المدرسة ،حتى الجمعة ،..............<br />وكل مكان<br />يترى السبب عمرو دياب ولا تامر ولا ياترى شرين<br />معتش في حد مبيحبش...........و الغريب إن سن المرهقة بأه بيبدأمن 11سنة<br />هوى الحب بيكون من أول نظرة ؟؟؟<br />ولا من أول إبتسامة (كانت الإبتسامة صدقةبس للأسف دلواتي إعجاب وحب وغيرو)<br />والله لو البلد كلها مشية على نظام عمرو دياب وغيرو............لكانةالبلد خربة"
