[[comments]]
order = 2
subject = "يحدث احيانا"
author = "سنووايت"
posted = "2006-04-08"
text = "جوليا روبرتس عملت الفكرة دي في فيلم \" زواج صديقي\" لو كنتم شفتوه<br />كانت الطرف الثالث بين صديقها الانتيم اليل بقالها معاه 10 سنين وبين حبيبته وفجاه وهي بتلعب الدور ده بتحس انها كانت بتحبه من زمان وهي متعرفش ويفضل الفيلم يصور المقالب والافكار الشريرة اللي بتحاول جوليا بطريقه كوميديا التفرقه بين الحبيبين<br />اللي عايزه اقوله ان العلاقات الانسانية الطيبة شئ جميل بس خصوصية العلاقه الزوجية حاجة تانية طبعا لازم نكون ممتنيين للناس اللي بنقابل شريك حياتنا عن طريقهم لكن ده ميدهوش الحق انه يكون متعهد توصيل المشاعر دليفري بينهم<br />لان ده بيفسد العلاقه على المستوى الثلاثي<br />الرجل بيكره الكاميرا اللي بترصد علاقته وتقيمها المتمثلة بالطرف الثالث والطرف الثالث بيحس باهمية بايخه ووهمية في العلاقه ولو كان شرير شوية صغيرين يقدر يحول حياة الزوجين لشئ بايخ اوي<br />انا بعتقد ان الناس اللي بتعمل بيت لازم تكون قد مسئولية انها تكون طرف متكامل بس مع الاخر يعرف يحتوي مشاكلهم وخلافاتهم الصغيرة اللي بتبتدي في بدايةالحياة والمتمثلة في اختلاف الطباع ومرورا بالمشاكل التانية وشكرا"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423182850/http://masr.20at.com:80/article.php?sid=134"

