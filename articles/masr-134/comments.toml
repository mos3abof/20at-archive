text = "انا ببص للموضوع من وجهة نظر تانية خالص وهى ان اللى بيحصل ده يعتبر خيانة , وباتالى مشى هيبقى فى ثقة فى اى حد تانى مما يؤدى الى ان كل واحد وواحدة تقفل باب بيتها عليها علشان خايفة لجارتها تخطف جوزها اوالعكس , وسعتها يبقى عليه العوض ومنه العوض مشى هيبقى فيه جيران ولا يحزنون. والسلام عليكم ورحمة الله وبركاته"
