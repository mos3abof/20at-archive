author = "محمد زكريا"
posted = "2009-11-10"
text = "أنا اعتقد مصر هتجيب جون فى الدقيقة 13 وبعدين هتهاجم وتجيب جون تانى فى الدقيقة 39 وبعدين قى الدقيقة 44 الجزائر هتجيب جون وينتهى الشوط الأول .<br />وييجى الشوط التانى اول 5 دقايق مصر هتجيب جون … تيجى للجزائر ضربة جزاء وطبعاً الحضرى يصدها ولاعبى مصر يموتو على الدفاع وضغط فى نص الملعب مع هجمة مرتده لمصر الكورة تيجى فى العارضة وتيجى ركنيه ابو تريكة يلعبها يطير الطائر زيدان ويرشقها فى الجون ونكسب 4 -1<br />وكتية الإعدام تصدر قرار باعدام مجيد بوقرة، وكريم زياني، ورفيق الصايفي، وعنتر يحيى، وكريم مطمور."
archived = "2009-11-13"
capture_url = "https://web.archive.org/web/20091113013416/http://www.20at.com:80/masr/hot-topics/13991-2009-11-10-16-03-16.html"

[[comments]]
order = 7
subject = ""
author = "محمد محسن"
posted = "2009-11-10"
text = "هيبدء الماتش بدايه هادئه من المنتخب : تسليم من رجل لرجل تنظيم في وسط الملعب والدفاع<br />وبعد خمس دقايق بالتمام … هتبدء الهجمات زي موج البحر… وهيتالق قوووي محمد شوقي وسيد معوض وحسني عبد ربه ومن اوفر من سيد معوض في الدقيقه 17 هاني سعيد هيجيب اول هدف بالرأس - تسير المباره هجمه هنا وهجمه هنا وتضيع من الجزائر هجمة مأكده ينقذها الدفاع والحضري وقبل نهايه الماتش في الدقيق 43 عمرو زكي هيولع الاستاد بهدف صاروخي من تمريره ذكيه من زيدان اللي يريحه له علي حدود المنطقة ويتمكن زكي من احراز الهدف الثاني<br />يحتسب الحكم 3 دقايق وقت بدل ضائع وتكون الجزائر هي اللي بتهاجم واحنا متمركزين<br />ويخلص الشوط الاول<br />الشوط الثاني هيلحب حمص مكان شوقي - وهتبقي المباره سيجال بين الفريقين لحد الدقيقه 27 من الشوط الثاني عندما يخترق زيدان من الجنب الشمال ويخش المنطقه ويتعرقل وتحتسب ضربه جزاء ويشوطها حسني ببراعه ويجيب الهدف الثاني<br />الجزائر تعمل كل حاجه عشان تقلل الفارق<br />ولكن من هجمة مرتده لمصر يلعبها احمد حسن لابوتريكة اللي يحطها ببراعه من لمسه واحده شمال الحارس المتقدم ويولع الاستاد ومصر كلها تقوم ترفع ايديها شكر لله"
archived = "2009-11-13"
capture_url = "https://web.archive.org/web/20091113013416/http://www.20at.com:80/masr/hot-topics/13991-2009-11-10-16-03-16.html"

