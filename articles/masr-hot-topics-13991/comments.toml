author = "أبو يحيي"
posted = "2009-11-11"
text = "المبارة باصرار المصريين ستكون لنا بعد 90 دقيقة<br />الجزائر ستلعب في نصف الملعب الخاص به لمدة 90 دقيقة<br />وان شاء الله سنكسب 3/0 ونصعد<br />ام المبارة فستكون هجومية جدا من جانب المنتخب المصري<br />وسعتمد المعلم حسن شحاتة علي اوراقه الرابح<br />محمد بركات يمين<br />سيد معوض شمال<br />ابو تريكة وزيدان في الوسط<br />عمرو ذكي في الهجوم<br />ام المدفاعين فيجب ان يكونوا في اشد الحذر من الهجمات المرتدة والا يندفعوا لامام<br />هناك 6 لاعبين في الهجوم وهو عدد كافي ومع مساندة خط الوسط حمص و احمد حسن<br />ان شاء الله سيكون لنا الغلابة علي منتخب كان يحلم بالصعود لبطولة افريقية وهو يلعب الان مبارة علي نهائيات كاس العالم"
