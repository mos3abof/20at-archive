text = "انا فالحقيقه مش متفائل بسبب غياب وائل جمعه من ناحيه والمدفعجي حسني عبد ربه من ناحيه الاتنين لاغنى عنهم وملهمش بديل فعلي ..بس انشاء الله الامور تسير لصالحنا..اتوقع ان الماتش حيبتدي باندفاع شديد جدا من كلا الفريقين خصوصا منتخبنا لانهم منتظرين الماتش من شهور طويله ده حيكون عامل ايجابي وسلبي ممكن فالدقايق الاولى نجيب جون ممكن اتنين زي محصل مع تنزانيا بعد كده الجزائر حتظغط لما تلاقي ثغراتنا الدفاعيه المعهوده واللتي لم تعالج حتى الان وكل الحذر من الركنيات والضربات الثابته بيجيدوها ومن اللاعب كريم زياني اتوقع الماتش يبتهي بفارق هدفين لصالحنا انشاء واهدافنا حتكون موزعه على زمن المباره ومش مركزه فتايم او اتنين واتوقع العكس بالنسبه للجزائر لو جابت اجوان"
