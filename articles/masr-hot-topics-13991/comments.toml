text = "انا اولا اتوقع فوز مصر 6-2<br />اولا الجزائر هتجيب جون فينا<br />وبعد كده احنا هنتعادل براس زيدان<br />وهنجيب الجون التانى بقدم متعب<br />وهيتم طرد لاعب من الجزائر<br />ثم ابو تريكه سيحرز الهدف الثالث والرابع<br />والجزائر هتجيب جون<br />وحسنى هيجيب جون وعمرو ذكى جون<br />وتنتهى المباراه بفوز منتخب مصر وتاهله لكاس العالم باذن الله تعالى"
