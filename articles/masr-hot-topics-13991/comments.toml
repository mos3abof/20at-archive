text = "يبدأ الماتش بهجوم ضاري شاري فاري ناري من منتخب مصر يسفر عن هدف في الدقائق الأولى ، يتواصل الهجوم من مصر و دفاع ضاري شاري فاري ناري من الجزائر إلى أن يتم إحراز الهدف الثاني لمصر .. يتسرب الإحساس بالارتياح للاعبينا و نفاجأ جميعاً بهدف جزائري في نهاية الشوط الأول الذي ينتهي 21 لمصر<br />يبدأ الشوط الثاني بهجوم ضاري شاري فاري ناري مصراوي فيحتسب لمصر ضربة جزاء يسددها حسني عبد ربه على يمين الحارس ..<br />و يستمر تبادل الهجمات و تحرز الحزائر هدفها الثاني وسط غفلة من مدافعينا<br />ثم نرد بتسديدة مباغتة تنهي المباراة على نتيجة 42 للمنتخب المصري<br />ثم نتقابل في السودان و عليكم خير .."
