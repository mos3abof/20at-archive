author = "MEDHAT"
posted = "2007-05-16"
text = "بسم الله الرحمن الرحيم والصلاة والسلام على رسول الله صلى الله عليه وسلم<br />كان من الأولى من الأخ كاتب المقال ان يكون اسلوبه مختلف فى تناول هذه الظاهره الشاذه فالمتصفح لهذ ا الموضوع يشعر ان المعاكسه شىء عادى ولا ضير فيها فلابد ان نعلم ان هذه الظاهره هى سلوك خارج عن العرف العام فى مجتماعتنا خاصة فى أرض الحرمين فأنا والحمد لله اعتمرت اكثر من مره ورأيت بأم عينى الالتزام على اصوله فى هذه البقاع المقدسه ليس هناك اختلاط بالمره وفى رايى إذا كانت هناك هذه الصور فهى خروج عن القاعده العامه ويكفى ماتقوام به جماعات الامر بالمعروف هناك أما فى بعض الدول الاخرى فللأسف هذه الظاهره ليست بمحرمه بل احيانا تشجع الدوله على المعاكسات واكثر من ذلك لكى تلهى الشباب عن قضاياه الملحه فأنظروا الى ماحدث فى وسط البلد فى القاهرة فى العيد والحكومه تجاهلت الامر وكأن شيئا لم يحدث أما اذا تظاهر بعض الطلبه او بعض اسر المعتقلين فى قضايا سياسيه او بعض طلاب الازهر قامت الدنيا ولم تقعد وليذهب من لايصدق الى الحدائق العامه فى القاهرة ليرى اين وصل تردى الاخلاق فى مصر ولاتأخذنا العصبيه الحاهليه عن معالجه الواقع الذى نعيشفه وللعلم انا مصرى فالإعتراف بالحق فضيله<br />والسلام عليكم ورحمة الله وبركاته"
archived = "2009-04-26"
capture_url = "https://web.archive.org/web/20090426134150/http://www.20at.com:80/7ayatna/5875.html"

