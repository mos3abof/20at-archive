subject = ""
author = "يمنى"
posted = "2007-05-18"
text = "المعاكسات أصبحت واقع لايمكن الهروب منه ونهايتها دايما إن الفتاة تخسر شرفها من الذئاب البشرية اللي ماتخاف الله لاكن البنات أيضا يفرحون لما يعاكسها أي واحد حتى لو كان البقال والحارس المهم رجل معجب بجمالها والمفروض إن الواحد ينأى بنفسه عن مواطن الشبهات .أنا مقيمة بالمملكة وما خرجت إلا مرة واحدة مع الوالد واتعاكست وإتسببت له بمشكلةز وشرطة وحكاية. منيومها عشان أحترم نفسي ووالدي كبير السن ماخرجت إلا للمطار عشان أرجع بلديز المعاكسات خطيرة على المجتمع بس في السعودية ودول الخليج الموضوع زايد حبتين"
archived = "2009-04-26"
capture_url = "https://web.archive.org/web/20090426134150/http://www.20at.com:80/7ayatna/5875.html"

[[comments]]
