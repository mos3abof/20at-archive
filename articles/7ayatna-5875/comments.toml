subject = ""
author = "Dr Mohamed Mokhtar"
posted = "2007-05-18"
text = "أود لفت النظر لأي شاب أو فتاة يقعان في الحرام سواء من باب التسلية أو المعاكسة أنهما في يوم ما قد يتزوجا و يرزقا ببنت و تكبر البنت و تخرج الى الشارع و يحدث معها مثل ما فعلا في شبابهما … ما أود توضيحه هو أن الحياة ( داين تدان) و عقاب الله في الدنيا حسرة وفي الآ’خرة عذاب أليم… ويكفي عذاب الضمير و انتظارك الدائم لشكل عقاب الدنيا فقد يكون حادث سيارة أو مرض شديد أو فقدان ابن أو مرضه فأسرع بالتوبة قبل أن تدور الأيام و يأتي الدور عليك"
archived = "2009-04-26"
capture_url = "https://web.archive.org/web/20090426134150/http://www.20at.com:80/7ayatna/5875.html"

