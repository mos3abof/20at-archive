text = "حسبنا الله ونعم الوكيل طيب وفيها ايه من الاول لو كانوا اتجوزو وابنهم اتربى فى حضنهم لكن دايما الاب او الاهل لازم يكونو<br />شايفين ان هما الصح وهما اللى عارفين كل حاجه بالعكس طيب كان ممكن انه ميحصلش بنهم معاشره جنسيه ولا حمل ولا الكلام ده كله وكانت العلاقه هتفضل برده بنهم بدون علم الاهل واكيد البنت كانت هترفض اى عريس يتقدم لها وخلاص.<br />المهم… قال الرسول الكريم .اذا جائكم من ترضون دينه وخلقه فزوجوه صدق الرسول الكريم… وشكرااااااااااا اااااا"
