posted = "2007-05-21"
text = "هذولا المتنقبات مابالكم بالمتلثمات<br />اذكر مره رحت سوق لفتتني وحده متلثمة بس شفتها قلت يابخت من بياخذها جننتني بجمال الجزء الظاهر من وجهها مع المكياج طبعا. أجل وش سوت بقلوب الشباب.!!؟<br />بعد شوية شفتها داخلة الحمامات قلت يا اشوفها يا اشوفها واصريت على الوالدة اننا ندخل الحمامات<br />بس فتحت البنت اللثمة كانت المصيبة .!!!!!! خرجت اضحك بعدها<br />عموماً اعتقد اي بنت تخرج متبرجة بشكل مبتذل .. ناقصة ثقة<br />والقصة مو قصة منقبة او كاشفة القصة قصة قلب نظيف ونية سليمة<br />والله ياما شفت بنات كاشفين وجههم عفيفات وقلوبهم نظيفة .. واحسن من اللي تلبس عباية ع الراس وكلها عطور ومكياج وبخور<br />والله يهدي بنات المسلمين… آمين"
