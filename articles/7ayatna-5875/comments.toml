subject = ""
author = "رجل الحسبة"
posted = "2007-05-15"
text = "في أحد الأيام دخل رجل إلى احد مراكز الشرطة يبلغ عن اختفاء إبنته البالغة من العمر أحد عشرة عاماً سجل البلاغ وبعد ساعة رجع الرجل إلى المركز ومعه ابنته ذكر أنها تعرضت للإختطاف سئلت الفتاة وذكرت أنها عندما كانت في طريق المدرسة قابلها شخص وقام برش وجهها بالبخاخ كما تقول وأنها سقطت في الشارع ولم تدري عن نفسها إلا وهي في أحد الشوارع إكتشف المحقق أن هذا الكلام ملفق وأنه عاري من الصحة بدأ المحقق بالتضييق على الفتاة ومحاصرتها بالأسئلة فاعترفت بالحقيقة كلها<br />أنها كانت على علاقة حب بشاب يسكن بجوارهم في ذلك اليوم خرجت الفتاة مع الشاب عندما كانت ذاهبة إلى المدرسة لكنها تأخرت في العودة فانكشف أمرها…<br />بعد التعرف على الشاب وبعد أيام قُبض على الشاب ثم أحيل إلى التحقيق…<br />في البداية أنكر الشاب التهمة وبعد جلسات التحقيق إعترف بالحقيقة ذكر الشاب أنه على علاقة سيئة بالفتاة تقدم لوالدها بطلب الزواج منها فرفض تزويجه نظراً لقلة دخله كان الوالد يريد شاب له دخل عالي فرفض أن يزوج هذا الشاب تم تصديق إعتراف الفتاة والشاب وأحيلت القضية للشرع يقول المحقق بعد أيام وردني خطاب من دار الفتيات التي تقضي فيها الفتاة العقوبة خطاب مؤلم يفيد أن هذه الفتاة مع كل أسف حامل سفاحاً يقول المحقق كان أمامى مهمة شاقة وهي إخبار والدة الفتاة بهذه الفاجعة كان الوالد في إجراءات القضية يظن أن المسألة مجرد خروج مع الشاب …<br />ولم يظن أنها وصلت إلى هذه الدرجة استدعيت الوالد إلى المركز وبدأت أفاتحة في الموضوع عندما اكتشف الأمر والحمل أصيب الوالد بصدمة نفسية شديدة ثم أغمي عليه في المركز يقول المحقق سارعنا إلى تهدئته وتذكيره بالله وصبره على هذه المصيبة..<br />إنتهت إجراءات القضية وصدر الحكم الشرعي بحق الشاب والفتاة حد الزنا الزاني غير المحصن الجلد مئة جلدة والتغريب لمدة سنة كاملة لم تنتهي القصة يقول المحقق بعد انتهاء مدة العقوبة أعيد لي ملف القضية بدأت أقلب أوراق هذا الملف الأسود فإذا بالمشهد المحزن…<br />يوجد في الملف صورة المتهمة الصغيرة يقول كانت صورتها في دار الفتيات ..<br />وهي تحمل بين يديها لفافة بيضاء تكاد تعجز عن حملها وفي داخل اللفافة رضيع برىء لسان حاله يقول ما ذنبي وأين أبى وكيف أتيت إلى هذه الدنيا هكذا كانت أحداث هذه القضية .<br />من شريط من ملفات التحقيق للرائد سامي الحمود"
archived = "2009-04-26"
capture_url = "https://web.archive.org/web/20090426134150/http://www.20at.com:80/7ayatna/5875.html"

