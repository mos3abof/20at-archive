author = "نواف"
posted = "2007-05-15"
text = "حول الموضوع هذا يقول الشيخ عبدالرحمن بن عبدالله السحيم عضو مركز الدعوة والإرشاد بالرياض:<br />إن كثيراً من الشباب الذين يُحاولون إيقاع الساذجات من الفتيات في شباكهم عبـر خدعة الحب أو وعود الزواج أو الأحلام الوردية ، يستدرجونهن مِن خلال تلك الوسائل وينصبون لهن شِباك الهاتف وتسجيل الصوت وأحيانا الاحتفاظ بالصور ، فإذا حَصَلَ على مُراده ، وأخذ من الفتاة أعزّ ما تملك ، ما يلبث أن يُكشّر عن ناب المكر والخديعة ، ويبحث عن ساذجة أخرى ، وهكذا ، وقد تبكي دماً أو تعضّ على يديها ندمـاً ، ولكن بعد فوات الأوان .<br />أما الشاب فيقول بلسان حاله ومقاله : لو لم يبق في الدنيا سوى تلك المُغفّلة ما تزوّجتها ! وهو الذي كان يضعُ لها الشمسَ في يد ، والقمرَ في الأخرى !<br />هل تُصدّق الفتاة أن ذلك الشاب المعاكس فعلاً يُريد الزواج بها ؟<br />أو أنه لا يستطيع أن ينساها ؟ ولا يستطيع أن يعيش بدونها ! وكأنها الماء أو الهواء !<br />وهو الذي يتهددها ويتوعّدها إن لم تخرج معه ، هذا حبٌّ بِلَوي الذراع !<br />إن المسلمة يجب أن تبتعد عن مواطن الريبة ، وأن تجعل بينها وبين الريبة والفاحشة خندقاً بحيث لا يطمع فيها طامع ، ولا يلتفت إليها كلّ ساقط وضائع .<br />لا أن تجعل بينها وبين الفاحشة شعرة ما تلبث أن تنقطع ، ويكون ذلّ المعصية وعار الجريمة يُطاردها طوال حياتها ، وربما بعد مماتها إن لم تندم وتتُب .<br />ولذا كان عمر بن الخطاب يكتب إلى الآفاق : لا تدخلن امرأة مسلمة الحمام إلا من سقم ، وعلموا نساءكم سورة النور . رواه عبد الرزاق .<br />وذلك لما اشتملت عليه من الآداب التي يجب أن تُراعيها المرأة ، وأن تبتعد عن مواطن الشُّبُهات.<br />وأن تبتعد عن كلّ ما يُثير الغرائز ، فإن أعداء الإسلام ما يَودُّون لها خيـر ، ويُريدونها أن تكون لقمة سائغة ، وفريسة سهلة المّنال ، فهم يُتاجرون بالغرائز ، ويتفنّنون في عرض الصور والأفكار التي هي سبيل وطريق للفاحشة"
archived = "2009-04-26"
capture_url = "https://web.archive.org/web/20090426134150/http://www.20at.com:80/7ayatna/5875.html"

