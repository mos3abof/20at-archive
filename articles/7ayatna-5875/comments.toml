text = "السلام عليكم والله شيء محير هل صحابيات النبي صلي الله عليه وسلم كن متنقبات ام ماذا؟ وهل كل من يرتدي النقاب الان يخاف من الله ؟ وهل كل الفتيات التي لاترتدين النقاب ليست بمسلمات ؟ هي في الاخر حريه شخصيه ونرجو من الله ان يهدي الجميع وسلام الله عليكم"
archived = "2009-04-26"
