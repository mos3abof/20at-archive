text = "أخي الكريم موضوعك جميل وحساس .. لكن من وجهة نظري أنك سهلت على الناس طريقة الغزل بل عرفتهم على جميع الطرق التي تستخدم في عالم الغزل عند الشباب ..<br />فلو مررت على الطرق مرور الكرام - فالغرض من موضوعك هو ذكر الحدث وليس الشرح - وختمت موضوعك بحل لهذه المعضلة بكلام أحد الفضلاء من علمائنا الأجلاء وكلام بعض الأخصائيين لكان أفضل وأحسن .. حتى نصل في النهاية إلى الحل .. وشكرا جزيلا لك أخي"
