subject = ""
author = "محمد من امة محمد صلى الله عليه"
posted = "2007-05-15"
text = "بدل ان نبحث عن اسلوب المعاكسات ينبغي ان نطرح سؤالا لماذا الشباب والشابات في العالم الاسلامي نزل بهم الحضيض الى هذا المستوى المتدني من الاخلاق؟؟اما سؤال صاحب المقال. وانت ما اسلوبك في المعاكسات فاني اعتبره من وجهة نظري تشجيعا منه على ما يمكن ان يلحقه من اذى في اهله فان يوم لك ويوم عليك.انما الامم الاخلاق فان ذهبت ذهبوا وانا احب ان تبقى بكرامتك وشرفك بلهىعن شرف غيرك."
archived = "2009-04-26"
capture_url = "https://web.archive.org/web/20090426134150/http://www.20at.com:80/7ayatna/5875.html"

[[comments]]
