text = "لسلام عليكم<br />والله ياجماعه لوعرف اولاد الى بيسببه للبنات من احراج مكان حيبقى فى معكسات<br />وبعدين بيستفاد ايه الولد لما يتعدى على شخصيه البنت<br />وخاصه المنتقبه والله المفروق يتقوا الله لان ليهم اخت وبنت وزوجه<br />وكمان مش بنقول ان الغلط كله على الولد البنت كمان لوكانت ملتزمه عمر مافى ولد هيقدر يكلمها ياريت مكنش تقلت عليكوا"
