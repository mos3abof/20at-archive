posted = "2007-05-15"
text = "أنا الحمد لله لا بعاكس ولا بحب المعاكسة من أساسها لأني بعتبرها تعدي علي حرية شخص تاني غالبا بيكون رغما عنه (اكن ساعات بيكون بإرادتهها) زي البنات اللي بيعلو صوتهم بالضحك او يمشو يهزرو مع بعض هزار ملفت … حاجة تقرف أنا مرضاش طبعا إني أتعرف علي واحدة من النوعية دي<br />و السبب الرئيسي في المعاكسات هوة الحرمان بعيد عنكم يعني مثلا البنت بتكون محبوسة في بيتها مش عارفة تعمل حاجة و الولد يكون بيتنشق علي أي واحدة حتي لو كانت منتقبة و الحمد لله إن ظاهرة معاكسة المنتقبات دي مش موجودة عندنا و إلا كانت خربت أما المعاكسات في المجتمع السعودي أحب أوجه كلمة للشباب التعبان هناك و أدعي له بالهداية لأنه لما يشوف واحدة متنقبة و يعاكسها أمال لو شاف واحدة لابسة ترحة قصيرة أو حتي بشعرها يعمل اييييييييه؟؟؟؟؟ ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ ؟"
archived = "2009-04-26"
capture_url = "https://web.archive.org/web/20090426134150/http://www.20at.com:80/7ayatna/5875.html"

