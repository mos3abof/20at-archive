text = "فعلا هي تحتاج لتأديب .. يستحيل أن يقنعني أحدهم بأن الهدف من هذا البرنامج هو إيجاد حل لمشكلة ما ، هراء ..<br />هدفه هو تسليط الضوء على بعض الأمور وتحويلها إلى ظاهرة وبالتالي تعميم معرفتها على المجتمع ومن ثم اعتيادية أن يصبح أحدهم شبيه هذا أو ذاك من قصص البرنامج<br />الغريب أن القناة هي ملك للوليد بن طلال ، وهنا ليتنا نسأله شخصياً : ما هدفك من دعم برامج هذه القناة سمو الأمير؟"
