[[comments]]
order = 41
subject = "ليه الشماته دى فى اخونا المسلم"
author = "انسان"
posted = "2006-05-18"
text = "اولا السلام عليكم ورحمة الله وبركاته<br />الزيكم ياشباب<br />انا عايز اسال سؤال ليه بنشمت فى بعض<br />عايزين مصيبه ونفرح فيها المفروض ان دينا بيقول ان احنا منشمتش فى بعض مهما حصل لحد مننا لان ممكن نكون فى الموقف ده ممكن اى واحد يكون فى الموقف ده ولو غلط يتعاقب ولو غلط ومتعاقبش ربنا يغاقبه واذا لم تعدل عداله الارض فعدالة السماء موجوده لكن منشمتش وكل واحد يفضل يقول احسن ويستاهل والى يستم فى التانى احنا فين انا حاسس ان انا فى جنينة حيوانات بل جنينة الحيوانات احسن وارحم<br />المفروض ان لو لقينا اخونا المسلم فى شده نقف جمبه ونساعده مش نشمت فيه اما بالنسبه للناس الى راحت المحكمه وهملو الشعارات والهتافات دى اكيد شباب مراهقين وكل همهم ان تامر يخرج من الازمه دى علشان يغنلهم كلام فى الحب وده اكبر دليل انهم مراهقين والمراهقين دول نصف عقلهم مختل والمفروض ان احنا ننصحهم<br />فى حاجه عايز اقوله قبل مانهى كلامى انا بقضى الخدمه العسكريه حاليا ولسه نازل اجازه والصدفه الغريبه ان تامر كان معايا فى مركز التدريب قعد اربع ايام وارتحل على السجن انا مقولتش الكلام ده علشان اتقابلنا فى مركز التدريب لا والله الراجل بيموت فى الثانيه ميت مره واكبر دليل شكله الى انتو شايفينو لا ده الصوره متخناه شويه حالته النفسيه وحشه جدا ياريت نقف جمبه وندعيله ومنشمتش فيه حتا لو هوا غلطان ده واجبنا كمسلمين يييييييييياريت الناس تفهم كلامى<br />وشكرا على قراءة كلامى<br />ولالسلام عليكم ورحمة الله وبركاته"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155224/http://masr.20at.com:80/article.php?sid=317"

[[comments]]
order = 42
subject = "حدثين من مصر"
author = "مليش اسم لغاية ما يبقالي بلد الاول"
posted = "2006-05-19"
text = "للأسف الشديد ان فيه حدثين متناقضين غاية ف الاهمية حصلوا يوم الخميس اللي فات<br />أول حدث هي مظاهرة ف قلب \"المحروسة\" من أجل مناصرة الزعيم الوطني تامر حسني<br />لأن بسلامته مزور أوراق شخصية والظاهر ان غناؤة من أجل عيون مصر قد غفر له<br />ما تقدم وما تأخر - لكن الناس خرجت ف مظاهرة للمطالبة ببراءة تامر<br />براءة؟؟؟ ماشي !!! بس من ايه يا ناس هوه عمل حاجة<br />ده الواد الحليوة ميعرفش حاجة ده لسه \"صغنن\" قطة مغمضة<br />الاهم من كل ده ان من بشائر العهد الذي نعيشة ان من حق الحبوبين محبي الزعيم<br />المدعو تامر ابن الحاج حسني (ربنا يصبره على ما ابتلاه) من حقهم يعملوا مظاهرة<br />يطالبوا بحقهم وكمان يعلقوا صوره ف اكبر ميادين القاهرة مكتوب عليها وحشتنا يا تامر<br />لأن دلوقت مسموح التظاهر من أجل المجرمين والمزورين المهم التغييب والسلام<br />هذه الحملة الإعلامية تؤكد بالفعل مدى الخلل الذي نعيشه هذه الأيام<br />وكيف تم غسل أدمغة الشباب لدرجة جعلتهم يتهافتون على ألبوم شخص متهم بالتزوير<br />أخبار من الجرايد حول الموضوع<br />نموت نموت ويخرج تامر<br />سنة مع الإيقاف لتامر حسني في قضية التزوير ومظاهرة أمام المحكمة تطالب بالإفراج عنه<br />الحبس سنة مع الإيقاف لتامر حسني .. ومحبوه يتظاهرون داخل وخارج المحكمة<br />في مصر صور المجرمين بتتعلق ف الشوارع<br />وصور الأبطال بتترمي برضه ف الشوارع<br />أما الحدث التاني مش هاقدر اتكلم عنه لأن لو اتكلمت عنه يمكن ادخل السجن<br />وكمان الصور كفاية تتكلم<br />اما متظاهرين من أجل تامر فلهم كل الحريات ان يفعلوا ما يشاءوا<br />ربنا معاهم يا رب وينصر الننوس تامر واللي زيه<br />وعلى رأي صلاح جاهين وعجبي"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155224/http://masr.20at.com:80/article.php?sid=317"

