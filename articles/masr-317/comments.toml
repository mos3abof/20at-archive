subject = "الحمد لله"
author = "عاشق تامرحسنى"
posted = "2006-11-07"
text = "الحمد لله اهو تامر خرج بس عاوز اقول حاجه ياريت مجحدش يزعل منى فيها ايه فيده اننا وقفنا وعملنا مظاهره نموت نموت وتحيا تامر اوكى كلنا بنموووووووت فيه دى حاجه معروفه بس لو كنا مثلاا كل واحد صلاله ركعتين ودعاله كان هيبقى احسن من الى انتم عملتوهو المهم اهو تامر معانا بس لاسف مش هيقدر يكمل الفليم الجديد عشان الجيش وتامر عمل مندتى جديد وبيخشه كل يوم يتكلم معانا فى شات واهو عايش ومبسوط الحمد لله"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124528/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

