text = "في الشام نموت على تامر حسني ونتمنى له ان يخرج في وقت قريب ليش اخدو تامر حسني لانو زور وما اخدو روبي او اي مطربة استعراضية بتهمة الدعارا"
archived = "2006-09-05"
