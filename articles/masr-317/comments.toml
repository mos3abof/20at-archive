order = 101
subject = "بحبك يا تامر ومش عارفه لو شوفتك هعمل فيك ايه"
author = "اسراء"
posted = "2006-11-11"
text = "والله العظيم بحبك يا تامر انا نفسي اكلمك او اشوفك انت وحشتني موت انا لو شوفتك يالهوي يالهوي علي هيحصل انا ممكن اموت ساعتها والله مش هقدر استحمل اني اشوف جمالك يا قمر والله انا لو شوفتك ممكن افضل ابوس فيك قرن بحبااااااااااااااااااااااااااااااااااااااااااااااااااااااااك"
