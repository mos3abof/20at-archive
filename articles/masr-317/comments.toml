[[comments]]
order = 48
subject = "تامر حسني .. مبارك_ عليك البراءة"
author = "لميس"
posted = "2006-05-21"
text = "بفضل تكاتف وتضافر جهود الشباب والشابات والمراهقين والمراهقات معجبي تامر حسني والمعجبات... تم الإفراج عن الفنان المبدع تامر حسنى..\"حيث حكم عليه سنة مع ايقاف التنفيذ\" .. ومن تابع منكم روتانا وهي تنقل وقائع الجلسة والنطق بالحكم...كان أكيد جاله الضغط ..القاضي بيقوله..المحكمة اخذت في الاعتبار حداثة سنك (البيه عنده 26 سنة تقريبا ) ..وانك المفروض قدوة للشباب والمفروض ماكنتش تعمل كدة (ياوحش..ماتعملش كدة تاني...كدة عيب)..<br />والأجمل بقى الجمهور الكتيييييييييييييير أوي اللي ثار وهاج وماج عند النطق بالحكم \"قبل ما القاضي ينطق ب \"مع إيقاف التنفيذ\" والست زينة اللي بتقول..أصل مافيش في مصر كلها غير تامر واحد بس!!!<br />سؤال : لو تامر دة ماكانش تامر حسني كان هايعملوا معاه إيه؟<br />ويعني إيه فنان قدوة..قدوة في إيه...وقدوة لمين؟<br />ويعني إيه ..صورة تامر بيه حسني المستفزة اللي موجودة في شارع مكرم عبيد قبل صيدلية أفريقيا ومكتوب عليها..وحشتنا.<br />فعلا.....كنا رجالة ووقفنا وقفة رجالة...مع تامر وأمثاله!!<br />ومن المفارقات الجميلة في نفس يوم الخميس الماضي<br />*مظاهرات أمام محكمة شمال القاهرة لتأييد تامر..ومظاهرات في وسط البلد لتأييد القضاة<br />*مؤيدي تامر يخرجوا من أمام المحكمة وأعينهم تفيض من الدمع ..دموع الفرح طبعا<br />*مؤيدي ومناصري القضاة الشرفاء هم أيضا أعينهم تفيض من الدمع..من الألم السحل والضرب والإهانة<br />*تامر يتم الإفراج عنه...ويتم تأجيل النظر فى قضية القضاة الى الخميس القادم.<br />**الشريف والنزية وصاحب الضمير الحي يحال لمجلس تأديب..واللي يخالف القانون نعمله بطل وقدوة..<br />mlake_el7ob2010@hotmail.com"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155224/http://masr.20at.com:80/article.php?sid=317"

