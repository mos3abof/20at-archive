[[comments]]
order = 102
subject = "هو انا مش من هنا ولا ايه؟"
author = "GoodMan"
posted = "2006-11-16"
text = "واضح كده ان انا مش معاكوا فى البلد دى<br />انا بجد مستغرب اوى ....... تامر صوته حلو اوى واغانيه جميله جدا دى مفيهاش شك وانا بحب صوته وبحب اغانيه بس مش بحبه هو<br />هو هربان من الجيش واتمسك ....... زيه زى اى واحد لو عرفنا انه هربان من الجيش هنبصله بقرف مش هنقول نموت نموت ويحيا تامر<br />والاخ اللى معترض على المظاهره عجبنى فى الاول بصراحه وبعد كده بيقول نصلى عشانه ركعتين ...... هو فعلا انا مش من هنا"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124528/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

