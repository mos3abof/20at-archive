text = "ايه في عيال مصر لو كنتوا بتحبو مصر بجد مكنتوش غلطوا في ابنها الي ياما رفع راكم يره على فكرة كل واحد كاره تامر دا معناه انو غيران منه.<br />اه غيران منه ولد ربنه رزقه و عيش اهله احسن عيشه و معلق بنات الدنيا الانسات و المتزوجات عيب على فكره اي حد يبص للفنان الكبير الشاب المصري و الحنون البصه دي دا يبصله ان اجمل و لرق و اجمل انسان في الدنيا .<br />و على فكره تامر اجمل و ارق انسان غصب عن الي يرضى و لاي ما يرضى فهمين و انتوا لو كنتوا بتكرهوا تامر دا مش هياصر لانكم ولا حاجه فهمييييين يا حصاله المجتمع"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 76
subject = "تامر حسني"
author = "عاشقة تامر"
posted = "2006-07-29"
text = "والله حرام الوحه البريئ والجمال يروح في المكان إلي هو في دحين ربنا معاك ياتامر وربنا يخرجج أمين أنا أمووووووووووووووت"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 77
subject = "اخرج ياتامر وحشتنا ياتامر"
author = "اسراء عاشقة تامر"
posted = "2006-08-02"
text = "ربنا معاك ياتامر تخرج لنا بالسلامه وان شاء الله تخرج انسان تاني علشان خاطري ياتامر وعلشان خاطر الناس اللي بيحبوك اوعى تعتزل بئولك ايه بحبك"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 78
subject = "اقيمت الحرب على عمرو"
author = "اسراء محمود عبدالعزيز"
posted = "2006-08-02"
text = "تامر انا نفسي اقتل الحيوان اللي اسمه عمرو دياب علشان انا حاسه ومتاكده انه بيكرهك ياتامر مع ان انت مينفعش حد يكرهك انت احلى حاجه حصلتلي في حياتي عمرو كلاب ده خصاره فيه اسمه يبقى على اسم عمرو بن العاص امر ياجميل وانا اقتله بئولك ايه بحبك"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 79
subject = "بحباااااااااااااااااااااااااااااااااااااااااااااااك ياتامر"
author = "اسراء عاشقة تامر"
posted = "2006-08-02"
text = "تمور حبيب قلبي وحشتني اوي والله العظيم على فكره انا ابقى بنت بنت عمت دينا ورام اللي في رمسيس اللي بعتتلك غدا هناك على الرحاب امل حياتي واكتر حاجه في الدنيا عايزاها انت نفسي اشوفك انا بحبك اكتر من نفسي وبخاف عليك اكتر من روحي بئولك ايه بحبك"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 80
subject = "اموت اموت لو ما حبتنيش"
author = "اسراء مجنونة تامر"
posted = "2006-08-02"
text = "انت بجد اول انسان حبيته في حياتي وعمري ما حبيت ولا هحب حد غيرك ياكل حياتي ولا عمري حبيت ولا هحب حد في جمالك وجمال عينيك واللي احلى من كده صوتك الحنون العاطفي واللي احلى واحلى حنيتك وقلبك الطيب واحساسك الرائع بئولك ايه بحبك"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 81
subject = "هيا بنا نسعى لتحطيم عضم كلاب ونحطمه ليه ماهو محطم خلقه ولا يهمك ياتمور"
author = "اسراء حبيبة تمور"
posted = "2006-08-02"
text = "ولا يهمك ياتمور بالطول بالعرض هنجبهولك الارض الزباله اللي اسمه ولا بلاش ما يستاهلش اني انطق اسمه على لساني هو فاكر نفسه ايه ده لااحساس ولا دم ولا مشاعر ولا صوت ولا صوره ده فاصل شحن لكن انت ياتامر عمري كله وقلبي وعقلي وكل حاجه في حياتي يانور عيني نفسي اشوفك بئولك ايه بحبك"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

