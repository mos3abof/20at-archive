[[comments]]
order = 97
subject = "ميحرمنيش منك"
author = "شهد"
posted = "2006-10-01"
text = "حبيبي وانا جمبك تعرف بحس بايه وانا بحضن قلبك ببقة عايز اقلك ليه يا محلا الدنيا وانا جمبك يا كل منايا محتاجلك يا محلا الدنيا وانا جمبك يا كل منايا محتاجلك حبيبي ياعمري متسبنيش وحياة اغلى حاجة عندك . تامر ز النهاردة لازم تعرف حبك عاملي جنان انا بحبك بحبك حب محبوش انسان وااااااه يا حبيبي وحياة اغلى حاجة عندك اهداء الى احلى واعز انسان تامر حسني ربنا معاك يا حبيبي الحمد لله على سلامتك وبحب اقول للناس الي بتكره تامر ربنا ياخدكو ان شاء الله بحبككككككك يا تامر. باي"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124528/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 98
subject = "الله يهديك يا تامر"
author = "رنا الي تحب تامر"
posted = "2006-10-21"
text = "انا اتمنى من رب العالمين اني يهدي هذا الشاب لاتي احبه اكثر ميتصور اي احد واحبه اتمناله كل الخير واتمنى ان تكون الجنه من نصيبه ويترك الغنا لانه شيطان وحرام يتعذب على الغنا والله حرام واني اضل ادعيلها الي الابد ان شاء الله واذا مكان في يوم من نصيبي ان شاء الله يكون في الجنه من نصيبي اتمنى له الهدايه من رب العالمين قولو جميعا ان شاء الله"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124528/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
