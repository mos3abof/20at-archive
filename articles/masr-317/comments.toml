[[comments]]
order = 17
subject = "مرآة نرى فيها انفسنا!!!!!!!!"
author = "حسام سيف النصر"
posted = "2006-05-14"
text = "يا جماعه ما يحدث هو مرآه حقيقيه نرى فيها الى مدى وصل حالنااو بالاحرى حجم كارثتنا القادمه...تصوروا يا جماعه ماذا سيكون حالنا بعد 10 او 15 سنه من الان ..او دعونا نفكر ماذا سيكون حالنا اذا حدثت حرب مثلا مع اسرائيل !!!!!!!! وماذا سيكون حال او موقف مثل هذا الشباب الرخو الذى نجح النظام الفاسد المفسد ان يوجده ويشجعه على مزيد من الرخاوه ووالمزيد من النعومه واللا مبالاه ..بينما نحن نتعذب ويقتلنا الاسى لاخوة لنا كانو اكثر منا رجوله وتضحيه وهم يواجهون القهر بصدر رحب ورغبه فى العطاء والمقاومه ....اذا هؤلاء الذين هم ليسوا ذكور ولا هم اناث ينباكون على شخص لا وزن له ولا معنى ..ولك الله يا مصر كم بك من المضحكات المبكيات"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155224/http://masr.20at.com:80/article.php?sid=317"

