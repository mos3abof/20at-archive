author = "حمدي صديق"
posted = "2006-05-16"
text = "ماذا لو كل واحد فينا وضع نفسه في مكان تامر حسني والله كان هيموت ومش هيستحمل, والله يا جدعان احنا اللي غلط مش هو ولا الشعب ماهو احنا الشعب واحنا بنغلط كده ف نفسنا, علي فكره اللي بيتكلم عن هيافة الشعب ده يبقي اكبر غلطان الشعب ده حارب اسرائيل وانتم عارفين النتيجه الشعب ده بقالوا الف والف سنه بيتسرق وعايش ومستحمل الشعب ده هو كان أول شعب يندد بموضوع الدنمارك ووقف لله ورسوله ياجدعان حرام تامر حسني له مستقبل ولا أحنانسميها بقي حقد وغيره, انا عارف كل واحد كتب تعليق ماعندهوش وظيفه ثابته ومعندهوش حياة مستقره كل اللي حصل انه بيحقد علي تامر وبس ف هقول كلمه واحده بس لكل التعليقات الحقوده,<br />هو أحسن منكم ميت ألف مره"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155224/http://masr.20at.com:80/article.php?sid=317"

