text = "امبارح تامر والنهار ده تامر وبكرا تامر وكل يوم تامر هي ايه الحياه تامر حبيت تامر بجنون يااااااااااا يا للي يا للي ياللي تاااااااااااااااااااااااامر بحبك"
archived = "2006-09-05"
