[[comments]]
order = 21
subject = "بغض النظر عن تفاهة و إفساد تامر في الارض...بس التهرب من التجنيد مش عيب"
author = "بغض النظر عن تفاهة و إفساد تامر في الارض..."
posted = "2006-05-15"
text = "بس التهرب من التجنيد مش عيب!<br />بقولها و انا جندي مجند و لسه باقي على الجيش 6 شهووووور بحالهم!<br />و أؤكد لكم أن التجنيد ليس إلا صورة من صور السخرة!<br />فقط ليسير الجيش مشروعاته بأيدي عاملة رخيصة جدا (82.5جنيه في الشهر!)<br />ولا يدرب المجند على القتال..بل مستوى التدريب لا يؤهل الجنود لأن يصبحوا دروعا بشرية!<br />و اعتقد ان امريكا او اسرائيل لو قررت غزو مصر لن تستغرق اكثر من 3 ساعات!<br />2.5 ساعة علشان يقدروا يمسكوا نفسهم من الضحك على مستوى الجيش و نص ساعة فتوحات!<br />و حسبي الله و نعم الوكيل!"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155224/http://masr.20at.com:80/article.php?sid=317"

