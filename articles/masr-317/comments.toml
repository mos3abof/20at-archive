[[comments]]
order = 74
subject = "stop please"
author = "dind"
posted = "2006-07-13"
text = "اولا عيب اللي انا بقراه على التعليقات<br />اولا الموضوع ليس تافه لانو متشعب<br />انا لا مع الينات اللي قاعدة تقول قمور وبيغيروا منك يا حبيبي وما بعرف شو ولا مع السباب والشتايم اللي نازلة واللي للاسف لا فيها احترام ولا ريحة النضج اللي عم يهللوا فيه<br />ولا اكيد مع الخطا اللي ارتكبه تامر<br />ولا ننسى القول الماثور والمعروف وهو قول نبي (من كان منكم بلا خطيئة فليرجمها بحجر) والقصة طبعا كانت لامرأة زانية<br />اذا تامر ليس مخنث وليس شاذا ولم يقبض عليه في وكر دعارة او مخدرات او او تهرب من الجيش ok خطا انا معكم بس خلص يعني لما بنزعل وبنغار عالدين وبنفس الوقت بنشتم الشرف والعروض وو عيب<br />كل انسان الو رايه وحر بمحبته لنجمو والتعبير عنا<br />بس مشكلتنا الرئيسية مش تامر ولا هيثم ولا بنات بيغمى عليعا ولا شباب غيرانين من الامور<br />المشكلة اكبر العرب لا يؤمنوا للاسف بمبدأ بنفس الوقت لم نتعلم ان تحترم راي الخر اما رايي او لا الكل ويالله ندخل لعبة السباب وبرافو<br />الدنيا مش بس سياسة<br />الدنيا دين وسياسة وفن (راقي) واقتصاد وعلم واجتماع اذا ما كنا قد هالشي نسكت احسن واحفظ لماء الوجه<br />ولا يختلف اثنان ان تامر فنان ذو حس راقي وباعتراف كل الفناني الكبار(لال اذا كانوا كل الكبلار حمير كما تعودنت عيوننا ان تقرا التعليقات اناس مفروض(واشك انهم مثقفين وغيرانين عالقضية الفلسطينية و و ) اطلع من دول على قول تامر<br />الحقيقة لست مهووسة مطربين واقسم بالله على هذا ولكني بنت موضوعية تعلمت ان اناقش من كل الوزايا<br />تامر فنان يلحن يكتب ويغني ويؤلف اما اذا كانت البنات تافهات فهيدي مش مشكلة اي فنان والدليل متلي كتير احترم واسمع واحب ما يقدمه بس مش قاعدة اشد بشعري وو<br />sorry بعرف طولت بس جد دخت من الكلام وحجم السباب المكتوب احنا كاسلام اتعونا نسامح ن<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
