subject = "العيب علي المنافقين"
author = "واحد وخلاص"
posted = "2006-05-16"
text = "اكتر حاجه مضيقاني في الموضوع ده الحمار اللي اسمه محمود سعد-- والمخدر اللي اسمه نصر محروس--- الاتنين قعدوا يدفعوا عن الواد المزور تامر وكانه عمل عمل وطني ----- يا سلام لو حد من الشباب الغلابه كان عمل العمله بتاع تامر دي كان زمانه دلوقتي واخد له خمس ست سنين سجن<br />--- انا بس عايز اقول للشباب اللي بيعلقوا علي البنات اللي كانوا في المحكمه بتاع الواد تامر انهم شوية شراميط من بتوع الفيديو كليب جايبهم نصر محروس فعيب لما نقول عليهم بنات مصريات<br />--واما حكاية الخبر بتاع الست اللي طلبت الخلع من زوجها ده نشر في جريدة الشرق الاوسط المملوكه لال سعود اساتذة الدعاره والعري في امتنا وهي جريدة قذره لا ياخد منها اخبار واللي شاغلين فيها اوسخ من نصر محروس المخدر<br />وبالمناسبه الحمار نصر محروس كان نص مخدر لما طلع مع السقعان المخنث محمود سعد"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155224/http://masr.20at.com:80/article.php?sid=317"

