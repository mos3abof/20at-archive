subject = "المهزلة"
author = "علاء الدين عبد الفتاح"
posted = "2006-05-14"
text = "هدا ما تريدة الدولة بالضبط تغيب الشباب الدولة تشجع كل تافة وتضخم كل هايف وتخلق جو وميديا لكى يعيش الشباب فية فهيا تشجع المغنين والكورة وكل تافة وبطريقة مبالغ فيها وتترك العلمان والابحاث والعلوم وتترك كل قيم ولا تنشرة ولاتشجعة حت يندثر ويغيب لان كل جاد ضد الدولة كل علم ضد الدولة كل العلوم ضدها فلا ينتشر الا الفساد وتفريغ العقول وكيفلنا ان ننهض وكيفلنا ان ننتصر على اعدائنا حسبنا اللة ونعم الوكيل غدا ان شاء اللة سيرحل الطغاة سيرحل النظام الفاسد الزى يعمل مع الاعداء بادا اللة"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155224/http://masr.20at.com:80/article.php?sid=317"

[[comments]]
order = 6
subject = "التفاهة .. السطحية # وهو المطلوب اثباته #"
author = "واحدة وخلاص"
posted = "2006-05-14"
text = "تفاهة وهيافة وسطحية تفكير .... هذا هو المطلوب<br />حتقولولي مين اللي عايز كدة .. معروفين طبعا<br />الناس اللي عايزة الشباب يغيب وميصحاش واللي عليزة الشباب يبقى اعمى مش شايف اي حاجة<br />اما وسائلهم<br />اغاني هابطة .. ومسابقات غبية .. ومنافسات على العبط<br />وده عن طريق القنوات الفضائية ..<br />بذمتكم في واحدة تغني تقول \"انا فرفورة\" يا نهار اسود<br />او عن طريق برنامج زي استار اكادمي ده الي هبل الشباب<br />كل ده بيخلى الشباب اللي المفروض انه اكبر قوة وعزيمة وحماس في المجتمع .. اللي المفروض انه هو اللي بيحرك المختمع ... يبقى شباب تافه كل افكارة منحصرة في زاوية ضيقة تافهة<br />طيب والناس دي عايزة الشباب يبقى تافه ليه؟<br />طبعا علشان ميفوقوش ويطالبه بحقه<br />الناس دي غرضها انها تسرق وتنهب ..وعلشان محدش يعترض ولا يمنعهم من اللي هم عايزينه لازم يغيب الشباب ويخليه مش شايف<br />وطبعا النتيجة<br />انهم نجحوا في اللي هم عايزينه<br />الشباب بيعمل مظاهرات علشان واحد مزور وملهومش دعوة بالقاضي الل اتهان وانضرب<br />وملهومش دعوة بأكتر من 1000 واحد مات واللي موتهم سرق فلوسكم وهرب<br />ماهو لو الشباب ده فاق البلد حتتصلح وهو ده اللي هما خايفيين منه<br />انما طول ما الشباب تافه بيسرقونا بأمان<br />الشباب التافه عددهم بيزيد<br />المصيبة انهم دلوقتي بيسربوا البرامج التافهة دي للقنوات الارضية كمان واحدة واحد<br />علشان اكتشفوا ان الناس الغلابة اللي معندهاش قنوات فضائية مش تافهين<br />وطبعا وصلوا للي هما عايزينه<br />تفاهة .. هيافة.. سطحية<br />## وهو المطلوب اثباته ##"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155224/http://masr.20at.com:80/article.php?sid=317"

