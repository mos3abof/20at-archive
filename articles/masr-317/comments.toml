[[comments]]
order = 10
subject = "من غسل الأدمغة"
author = "معتز"
posted = "2006-05-14"
text = "قَالَ رَسُولُ اللهِ صلى الله عليه وسلم:<br />(سَيَأْتِي عَلَى النَّاسِ سَنَوَاتٌ خَدَّاعَاتٌ. يُصَدَّقُ فِيهَا الْكَاذِبُ وَيُكَذَّبُ فِيهَا الصَّادِقُ. وَيْؤْتَمَنُ فِيهَا الْخَائِنُ وَيَخُونُ فِيهَا الأَمِينُ. وَيَنْطِقُ فِيهَا الرُّوَيْبِضَةُ (قِيلَ: وَمَا الرَّوَيْبِضَةُ. قَالَ: الرَّجُلُ التَّافِهُ) فِي أَمْرِ الْعَامَّةِ<br />فنحن في عصر انقلاب الموازين<br />وتعليقا على عملية غسل الأدمغة<br />فمن غسل الأدمغة؟<br />إن الإعلاميين هم أقدر الناس على غسل أو تفعيل وتحسين هذه الأدمغة<br />فلو ترك الإعلاميون تلميع التافهين ووضعوهم بأقلامهم في مكانهم الصحيح أظن لم نكن لنرى مثل هذه المظاهرة التي تقطع القلب كمدا<br />ولو سار الإعلاميون ببرامجهم وأقلامهم مع التيار من باب( أن الفن والتفاهة هم اللي بيجيبوا فلوس واحنا عايزين نعيش) واستمرت البرامج تحدثنا عن التافهين وتصدعنا بأغانيهم ولقاءاتهم وبيأكلوا أيه وبيشربوا أيه وسباق التوب تن والتوب طين<br />يبقى<br />حسبنا الله ونعم الوكيل في الكل"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155224/http://masr.20at.com:80/article.php?sid=317"

[[comments]]
order = 11
subject = "لسه فيه أمل"
author = "أشرف"
posted = "2006-05-14"
text = "أولا اشكر الصدفة التي قادتني لهذا الموقع الفاعل و الفعال - بخصوص تعليقي - لن أعلق علي التافه بل انا سعيد بردود شباب مصر و ان احزنني ردود شاباتها - لكن الجميل اني شايف ردود افعال صحيحة - لا يزال في مصر رجال - أناس محترمون و هو ما كنت اعتقدت عدم صحته<br />المطلوب من كل الاخوة المحترمون تفعيل ردود افعالهم وآرائهم الي ما هو ايجابي - بمعني لا تلعنوا الظلام و اشعلوا شمعة - و من مجموع الشموع لا شك اننا سنري اوضح و نجعل للمغيبين فرصة للرؤية<br />انا مسلم معتدل - لكن باللله انظروا الي حديث المصطفي علية الصلاة و السلام \" من رأي منكم منكرا ... \" لم يطلب منا ان نتجنبة او ننتقدة بل طلب منا ان نغيره - كل باستطاعته<br />ارجوكم ابداوا و صدقوني فيه امل"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155224/http://masr.20at.com:80/article.php?sid=317"

