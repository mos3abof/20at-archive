subject = "لا يجب انا ينحبس تامر حسنى"
author = "جمال"
posted = "2006-05-17"
text = "تامر انت مضلوم وانت مترب لا يجب انا تنحبس فى السجن انت مطرب مشهورة فى كل العالم انتى مضلوم وبقول لا الشعب المصرية كلوها انوه يعاض فى محكامة تامر حسنى لانه رجل من اشهر العالم لا يجب انها مطرب لا يستحق انا يخدمة فى الجيش لمازا هكزا تعملون اني احبك يا تامر الى الابد وناشالله الشعب يدلو يحكى فى قديت تامر حسنى والسلامة عليكم ورحمت الله وباركته"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615155224/http://masr.20at.com:80/article.php?sid=317"

