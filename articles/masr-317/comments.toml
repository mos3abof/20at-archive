[[comments]]
order = 83
subject = "سيبك منهم دول مابيفهموش في العيون"
author = "اسراء روح قلب تمور"
posted = "2006-08-02"
text = "عينيك فيها سحر بيجزبني ليك وقلبك فيه صفاء وعاطفه وحنان بيضمني الساعة دلوقتي 4:02 في اي وقت واي مكان بقول بحبك لازم اقولك بحبك اوي والله العظيم حلمت بيك 8 مرات صدئني كل مره بشوفك فيها ببقى نفسي اه اهابوسك واحضنك واضمك للابد ياجامدانت ياواد يا معدي انا في عزاب من غيرك ياحبيب قلبي يانور عيني والله العظيم بحبك يا احلى تامر في الدنيا كلها"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 84
subject = "ازاي يعملوا فيك كده"
author = "اسراء مجنونة تامر حسني تمور"
posted = "2006-08-02"
text = "بحباااااااااااااااااااااااااااااااااااك يااحلى تامر في الدنيا الله عليك ضحكة عينيك بيها بنسا الدنيا ديا انت كل الحياه ياتامر لو يوم تغيب انا بموت اه ياتامر حرام عليك تعزبني بالشكل ده ولا يهمك فرتكني المهم انت وحشتني اوي"
archived = "2006-09-05"
