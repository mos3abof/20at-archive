subject = "يبقي انت اكيد في مصر"
author = "أحمد عوض"
posted = "2006-05-14"
text = "علينا ان نكف عن الغناء لشعب مصر ووطنيته وعظمتة لااننا في عصر الغيبوبه عندما يموت منا الف شخص في البحر في موته بشعه ويذهب 100 الف شخص لمبارة كره قدم ويحتفلون بينا ولا يبهون باهل الضحايا يبقي انت اكيد في مصر عندما يقوم قاضيان امبرطورية الفساد وتنتهك اعراض بنات مصر لدفاع عنهم بينما شباب مصر يدافع عن مطرب مذور يبقي انت اكيد في مصر لك الله يا مصر"
