[[comments]]
order = 86
subject = "بحب كل حاجه فيك ياتمور"
author = "اسراء عاشقة تامر"
posted = "2006-08-02"
text = "اوعى تنساني ياتمور وربنا معاك وانا بدعيلك من قلبي والله هشوفك قريب في اي حفله هتغني فيها بئولك ايه بحبك"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 87
subject = "تيمو أغلى الناس"
author = "رولا مجنونة تامر حسني"
posted = "2006-08-03"
text = "بموووووووووووووووووووووووووووووت فيك يا تامر مهما عملت لأنك مطربي المفضل ولو ماكنتش موجود كان زماني مابسمعش أغاني خالص يا عمري يا رب تطلع لنا بالسلامة يا حبي الوحيد<br />عندي ملاحظتين :<br />1-شكر خاص جداً لكل اللي وقفوا مع تامر في محنته الصعبة وخاصةً البنات وبعدين الشباب<br />2- طز في كل اللي بيكرهوا تامر هو مش محتاج حبكم لأنو عنده معجبين كتير أوي ياناس يا حقودين يا اللي غيرانين منه ومن شهرته"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 88
subject = "بحبك ياتمور"
author = "اسراء"
posted = "2006-08-03"
text = "انا شايفه ان التعليق اللي فات مظبوط تماما وان الناس فعلا الي بيكرهوك رئيهم مش مهم خالص بالنسبه لك والناس اللي بيكرهوك ناس احقاد وعايزين ينموا وخلاص ولا يهمك ياتمور كلنا بنحبك وربنا معاك يا حبيب الملايين يانور عيونا كلنا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 89
subject = "كفايه صوتك بالحياه يا تمور"
author = "اسراء مجنونة تمور"
posted = "2006-08-03"
text = "حبيبي وانت بعيد مشتاقه انا للمسة ايدك ياحبيبي تامر انت احلى حاجه حصلتلي في حياتي يانور عيني خد بالك من نفسك يا تامر ربنا يخليك لينا وتخرج بالسلامه"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 90
subject = "مجرد ما عينيك تيجي في عينيا بنسا الدنيا ديه"
author = "اسراء عاشقة تمور"
posted = "2006-08-03"
text = "اه منها الايام واه منه الزمن مش عارفين مخبي ايه المهم ان تامر برئ ومظلوم انا حاسه كدة انا بحبك اوي ربنا معاك ياتامر وتخرج بالسلامة"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 91
subject = "كل مره بشوفك فيها ببقى نفسي اه اه اقولك بحبك"
author = "اسراء عاشقة تامر"
posted = "2006-08-03"
text = "لا تشغل بالك ياتمور بالكلام البارد والتعليقات السخيفه اللي كاتبينها المهم انت لما تخرج هتعمل ايه كل يوم ياتامر حبي ليك بيزيداكتر من اللي قبليه تصدقني لو قولتلك ان كل كلامي فعلا في سيرتك وانا والله عايشه مش شايفه غير صورتك وصوتي ياحبيبي ما ينطقش الا اسمك والله العظيم بجد عينيك فيها حنيه وانا كل مره بشوفك فيها ببقى نفسي اه اه ابوسك واقولك بحبك"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 92
subject = "ربنا بيسامح وبيغفر انتواياناس مش هاتسامحوه"
author = "اسراء مجنونة تامر وحبيبته"
posted = "2006-08-03"
text = "هو تامر عملكوا ايه علشان كل الكلام ده يتقال عليه ولا انتوا نمامين واحقاد على كل مشهور اعتوا تئولوا وتعيدوا وتشتموا على الناس حرام عليكوا ده حتى مصري ومسلم زينا انتوا ما بتزهئوش ده انسان زيه زينا وتامر هيبقى تامر وهيفضل تامرحسني بيكوا او من غيركوا ورغم انف اي حد في الدنيا معلش ياتامر هم كده ما ورهمش غير انهم يشتموا في الناس ومش عندهم استعداد حتى يعرفوا اللي بيشتموه ده كويس ولا وحش هو ده الجهل بعينه ولا يهمك ياتمور بئولك ايه بحبك"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 93
subject = "عمرو كلاب غيران ليه"
author = "اسراء حبيبة تامر"
posted = "2006-08-03"
text = "عمرو ليه غيران وليه ما بيسئلش على تامر وهو في المحنه ديه انا لاحظت انه مش غيران من تامر بس لا ده شكله عايز يحتل المركز الاول في كل حاجه انارائ انا المركز العاشر خصاره فيه هو غيران من تامر علشان تامر امور وصوته احلى منه بكتير واحساسه رائع في الاداء وحداثة سنه لكن عمرو لا امور ولا صوته حلو ولا حتى احساس ولا مشاعر وطبعا كبير اقصد كبير في السن عندنا كلب في البيت اسمه بابسي ساعات بغلط في اسمه واقول عمرو بصراحه اخر نيو لوك لعمرو كلاب كان زباله حتى ولو عمل في نفسه ايه باين ان عنده 55 سنه هو انت فاكرنا هبل مثلا على الاقل تامر عارفين سنه ومغشناش هو انت فاكر نفسك نغه يراجل عيب عليك وانت في السن ده تفضل تئزي في زمايلك وتعمل فيهم كده المفروض خلاص كده حسن الختام بئه وبعدين المفروض تحترم نفسك وتعتزل بئه ما حدش بيحبك راحت عليك ياخويا والبنات اللي بتجبهم في الفيديو كليبات بتوعك دول ازاي رضيوا انهم يقفوا قدام راجل عجوز زيك انت فاكر الناس هبله فاهمين ان عندك 19 سنه ولا حاجه يا اخي اكسف على دمك شويه وفاكر نفسك اجنبي اوي يا شيخ اتلهي ده انت شكلك من عشش الدويئه تامر احسن منك بكتير اقصد بمراحل نفسي اشوف اللي اسمه عمرو كلاب ده كنت اقتله ومش بس كده وازبحه وافرمه ليه انت فاكر نفسك ما حصلتش ياشيخ روح بلا عمرو كلاب بلا راجل عجوز هييييييييييييييييييييييييييييي ولايهمك ياتمور اديني هزئتهولك على الاخر ده لو كان عنده دم وبيحس يابارد"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 94
subject = "عمرو كلاب انا عايش"
author = "اس اس مجنونة تمور"
posted = "2006-08-03"
text = "قال عمرو كلاب بيغني وبيقول انا عايش المفروض الاغنيه تبقى طبيعيه المفروض يئول انا ميت ايه الئرف ده تامر خيره عليك مالفلك كام اغنيه المفروض انك تشكره مش تبلغ عنه انت ما وركش شغلانه غير انك تئزي في الناس هو انت مريض نفسيا ولا ايه انت بصراحه احقر انسان اقصد حيوان في الدنيا تامر احلى منك ياحقير تامر ده نسمه ربنا يخليه لينا وربنا هيحميه منك يامجرم يا بارد انت غيران منه علشان البنات كلها بتحبه وكمان علشان امور وصوته حلو احلى منك يا جاهل انت بالسلوب بتاعك ده اسلوب همجي واسلوب الجهله والمنحطين ولا يهمك يا تامر امر ياجميل اوامرك مجابه يا جامد يا كيدهم بكرا ان شاء الله بدون مقاطعه ربنا هيبتليك يا عمرو يا بن ستيته بمصيبه هتجيب خبرك لو كنت ازيت تامر بحبك يا تامر"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 95
subject = "والله العظيم بدعيلك يا تامر"
author = "اسراء (اس اس ) حبيبة تامر (تمور )"
posted = "2006-08-04"
text = "صباحاوظهرا ومساء وفجرا بدعيلك والله يا تمور يا حبيب قلبي يا نور عيني ربنا معاك يا تامر وتخرج لنا بالسلامة مستنينك يا احلى تامر في الدنيا كلها ومش هنسيبك ومش هنتخلى عنك ابدا يا حبيب قلبي كلنا هنقف جنبك ونساعدك يا روح قلبنا كلنا وسيبك من الناس اللي بيكرهولك الخير ولا يهمك حد المهم انت والناس اللي بيموتوا فيك بنحبك ياواد يا جامد انت يا قمر بحبك وحيات ربنا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120843/http://masr.20at.com:80/article.php?sid=317&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

