[[comments]]
order = 0
subject = "أكيد"
author = "قرفانه"
posted = "2006-12-19"
text = "أكيد يا بنتى الدولة تطلب منك التزوير لأن دى الحاجة الوحيدة التى تتقنها وتجيد فيها وعلشان بتحبك وتموت فيكم بتنصحكم بنيه خالصه لوحه الله اللى عمرها ماعرفته. حسبى الله ونعم الوكيل، لكم رب اسمه الكريم، الرحيم الحنون. الصبر من عندك يا أرحم الراحمين"
archived = "2006-12-22"
capture_url = "https://web.archive.org/web/20061222094810/http://masr.20at.com:80/article.php?sid=1319"

[[comments]]
order = 1
subject = "الحكومه على حق"
author = "لاول مرة انا مع الحكومه"
posted = "2006-12-19"
text = "الحكومه لاول مرة تحسسنا انها فهمه فى الدين و بتخاف عليه و عرفه انه لا دين بعد الاسلام واللى مش عاجبه يسيب البلد بلا بهائى بلا هباب<br />و اللى يقول الدين لله و الوطن للجميع على شرك والعياذ بالله لانه لا دين الا دين الله الاسلامو التعايش اللى بتقول عليه الكافرة بسمه اللى الرسول ارساها فى المدينه كان مع اليهود والنصارى اى اديان الله الاخرى فى الارض التى جاءت قبل محمد عليه الصلاة والسلام و محدش قال ان الرسول جعل كافر يعيش مع المسلمين"
archived = "2006-12-22"
capture_url = "https://web.archive.org/web/20061222094810/http://masr.20at.com:80/article.php?sid=1319"

[[comments]]
order = 2
subject = "القصاص من المرتدين"
author = "مروان محمد"
posted = "2006-12-24"
text = "أود ان الفت نظركم ان الشعب المصرى لم ولن يقبل بالاعتراف بكم اما بالنسبة لموقف الحكومة فأنه موقف سلبي فيجب التعامل معكم معاملة المرتدين وهو القصاص."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010152/http://masr.20at.com:80/article.php?sid=1319"
