author = "حسين"
posted = "2009-11-11"
text = "بكل امانه لابد ان نتعترف جميعا مصريين وجزائرين ولا حتي زامبيين ان المنتخب المصري هو افضل من يشرف العرب وافريقيا والشرق الاوسط هذا الفريق اللي نقارنه بالبرازيل وايطاليا بدون مبالغه من هو المنتخب الجزائري هذا كي يكون في [ *** ] المونديال يا شيخ لا تفضاحونه صوت العقل بيتكلم انسحبوا اكرملكم ولابد ان يعلم هذا المنتخب العقيم كله علي حده ان دخول مصر ليس كالخروج منها وانكم لن تواجه اي نوع من البشر انهم (الفراعنة) عليكم (الساجدين) لله وان شاء الله المنتخب الوطني المصري صاحب افضل القاب وارقام علي المستوي الافريقي بيكون في وضعه الصحيح مع عمالقة العالم ليس مع منتخب ما حتي قدر يخش كأس افريقيا لول … بلادي بلادي لكي حبي وفؤادي… وهررررررر يابني انت وهو من هنا قال جزائر قال ده حتي شكل التيشرت بتاعم يقرف الكلب"
archived = "2009-12-12"
capture_url = "https://web.archive.org/web/20091212210718/http://20at.com:80/masr/hot-topics/13940-2009-11-05-16-22-51.html"

