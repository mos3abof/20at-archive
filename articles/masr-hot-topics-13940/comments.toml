posted = "2009-11-08"
text = "نصيحتي للمنتخب<br />من المعروف أن المباراة القادمة تمثل ضغطا عصبيا و توترا كبيرا على لاعبينا فنصيحتي لهم هي أن يقوموا قبل بدء المباراة بخمس دقائق بالوضوء بالماء الدافئ لما هو معروف أن الوضوء ينشط الدورة الدموية ويذهب التوتر والضغط وبعد ذلك يسجدوا على أرض الملعب - إن لم يكن هناك مانع من الفيفا- فإن وجد ففي أي مكان ويتحدثوا في أي شيئ شاؤا لما هو معروف ان الجود يفرغ شحنات التوتر والتشنج العصبي ويبعث على الطمأنينة.<br />والله الموفق."
