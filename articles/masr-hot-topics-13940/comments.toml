text = "احنا هنكسب ان شاء الله لأكثر من سبب<br />أولها الإهانات اللي سمعها منتخابنا المحترم واللي ردينا عليها بقمى الاحترام والواقعية<br />ثانيا عشان اللعيبة المصرية متستاهلش ده كله<br />ثالثا هيكسبو عشان احنا وراهم وبنشجعهم قعلا من قلوبنا<br />رابعا عشان احنا أبطال القارة ان شاء الله<br />ونصعد لكاس العالم ونعمل احلى شغل"
