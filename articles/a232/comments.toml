subject = "عاوز أفهم"
text = "اولا جهد كويس يا ياسمين<br />بس انا شعرت انه مقال تعليمي اكثر من مقال توضيحي<br />يعني انا راجل هاخد بالي من الحركات دي مع اي واحدة تكلمني فلو وجدت منها حركة كده ولا كده اعرف انها مهتمة بيا والعكس .....<br />كمان هذا المقال بيعلم البنات كيف يعبروا عن مشاعرهم واظن ان طريقة العرض قد خانت ياسمين<br />فين كل الحركات دي من الحياء ...<br />فين كل الحركات دي من شعور الرجل ان المرأة تحافظ على احلى ما فيها من خجلها وحيائها<br />انا شايف ان المقال خاص بولد وبنت عايزين يمشوا مع بعض بس الولد مش عارف اذا كانت هي موافقة ولا ايه<br />فلما يقرأ المقال ويشوف الحركات ويطبقها على ارض الواقع هاتكون فرصة كويسة وهي كمان تتعلم تبرز الحاجات دي بشكل واضح ...<br />بصراحة مقال سيء إلا غذا وجه الى الزوجة والزوج"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616074217/http://www.20at.com:80/article.php?sid=232"

