[[comments]]
order = 10
subject = "خطأ في المعالجة"
text = "الموضوع فعلا جميل ياياسمين..وهو موضوع شائك وشيق في نفس الوقت لكني أعتقد ان طريقة المعالجة ظلمت الموضوع وكاتبته فكان ممكن مثلا نعرض الموضوع بالشكل ده وفي نفس الوقت نلفت نظر القراء على ان دينا دين جميل وحفظ البنت قبل الولد من أي شك او شبهه تحوم عليها فمثلا في قضية غض البصر سدت علينا الذرائع وقفلت علينا باب دة بص لي ودي ركزت في عنيا.... كان محتاج لمحه او مزج بشكل مناظرة مابين اللي بتقوله النظريات دي ومابين تعاليم دينا السمحة.<br />انما في الآخر برجع وأقول جهد طيب يا ياسمين وحاولي تعرضي من نفس الزاوية ردود أفعال الرجل لكن من المنظور اللي قلنا عليه سابقا."
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616074217/http://www.20at.com:80/article.php?sid=232"

[[comments]]
order = 11
subject = "موضوع شيق"
text = "الاخت ياسمين<br />موضوعك ممتاز جدا واشكرك كثيرا على هذه المعلومات<br />وبالنسبه للاخوة والاخوات اللي تعليقهم كان سخيف اسمحولي اقول لكم<br />انتو جهله يعني لا تفهمون شيئا والاحسن ما تشاركورش<br />وخليكم من السخافات اللي تقولوها ومالهاش معنى<br />مرة اخرى مشكورة اخت ياسمين"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616074217/http://www.20at.com:80/article.php?sid=232"

