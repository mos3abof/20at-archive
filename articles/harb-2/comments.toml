[[comments]]
order = 0
subject = "أكيد .... عمري ماأطلق سراحه طبعا .."
author = "محمد السيد"
text = "لأت لو ده حصل معني كده إني خسرت كل الشهداء والبينة التحتية وكل الدمار ده من غير أي مكسب ...<br />زائد إني كده خلاص ... بأكون لغيت السلاح أو الإسلوب ده نهائيا بعد كده ... علي الرغم من فعاليته<br />وبرضه مش حاسكت ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamemdat@hotmail.com"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720130928/http://harb.20at.com:80/article.php?sid=2"

[[comments]]
order = 1
subject = "دى اكيد غلطة"
author = "ema"
text = "مكنتش حعمل زى ما الراجل دوة عمل لية لان مش عشان اخلص الاسرى فى سجون الاحتلال الاسرائيلى اروح اخلى العدوان يقتلى اصدهم مئات الالوف من الاحرار"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720130928/http://harb.20at.com:80/article.php?sid=2"

[[comments]]
order = 2
subject = "يعني"
author = "محمد"
text = "أنا شايف أن أسائي ش هت قوي علس أسترجاع الجندي فهي دلوقتي تقتل وتدمر وتهدم البنية التحتية التي تكلفت مليارات بعذر واحد وهو البحث عن الجندي المخطوف وأقطع دراعي أن ما كانت تقدر تجيبه في خلال 24 ساعة لكنها من الأخر بتتلكك وكل اللي بيحصل ده علي هواها<br />أهي لزقت الموضوع في لبنان ومنه في سوريا وبعدين قال أيه الجنود أتهربوا ألي أيران وأهو يضربوا كله مرة واحدة والحجج موجودة"
archived = "2006-07-20"
capture_url = "https://web.archive.org/web/20060720130928/http://harb.20at.com:80/article.php?sid=2"
