[[comments]]
order = 2
subject = "الحقيقه"
text = "أرسل هذا التعليق بواسطة : ابو عدي<br />اقوووووول الف مبروك للفرسااااان ورفعتو رووووس ديرتكم وكس امكم يالشيعه يا عيال المتعه كس امك انت وياااااه بعدد شعراااات ذقن الخميني ابوول على قبر الخميني للعن ابووووك شيعي نجس انجس من بووول الكلب امشي للعن بووووك لا بو ستين كلب وتبقااااااا السعوديه السنيه عزيزه شامخه هاينه الرافضه بكل مكااااان وزمااااان ابو درع شكلي بخل الدرع بكس عرضك اقول ممكن اختك ابي اتمتع معهااا يقلون انهاااااا تكل الزب من ورى مكروه عندكم هههههههههه للعن شف يالشيعي انت ويااااه ترى الشيعه بالسعوديه فتولهم باب التوضيف مهما يكون حنا نقدر شعبنااا وضايفهم كلاب جمااااارك تعرف ما عندنا كلاب بالسعوديه الى هم ووضفوهم كلاب جمارك يشموووون الجزم وحفايض البزرين كح كح كح"
archived = "2007-10-16"
capture_url = "https://web.archive.org/web/20071016105159/http://doha2006.20at.com:80/article.php?sid=4548"

[[comments]]
