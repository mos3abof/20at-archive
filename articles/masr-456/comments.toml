author = "يا جماعة بالراحة، المشكلة إننا طيرنا من الفرحة بعد الفوز بكاس الأمم، ونسينا إن دي مش نهاية العالم، وانشغلنا في الحفلات، وكل واحد راح لحاله، وبعدين في مشكلة ثانية إن التجارب الأوروبية لينا قليلة جدا، كما أن احتكار الأندية المصرية للاعبين أكفاء زي محمد أبو تريكة بيقلل من كفاءة المنتخب."
