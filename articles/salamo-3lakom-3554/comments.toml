text = "اعتذر عن العبارة التالية في ردي السابق: \"وكما هو معروف مدى العداء بين الأمويين و العباسيين ، فكانوا يبحثون عمّن يطعن في هؤلاء فيملؤون هذه الكتب بالأكاذيب .\" فقد يكون فيها تحامل على العباسيين، رحم الله الجميع.<br />وهذا مصدر ما نقلته في منقبة يزيد رضي الله عنه: http://arabic.islamicweb.com/shia/yazid.htm"
