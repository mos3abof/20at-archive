posted = "2007-04-07"
text = "لا اعرف متى نما كل هذا الحب داخلى له .. لم يكن موجود دائما . وانا صغيرة عجبتنى فكرة الصلاة وتفصيل ملابس للصلاة خاصة بى ومناداتى بالحجة وبعدها بدأت دورة الحياة فبعدت واقتربت وبدأت اسئلة كثيرة تنهش عقلى ثم عدت عودة لاهث يبحث عن الامان ومازالت التجربة مستمرة.<br />خلال كل هذا هناك امران خرجا تماما من مرحلة الجدال داخلى، الاول هو المواظبة على الصلاة والثانى هو شعور خفى ظل بنمو داخلى عن من يكون هذا الرجل الذى حمل الرسالة ونذر نفسه لهدايتى فى الدنيا والشفاعة لى فى الاخرة، واى مكان يحتل داخل قلبى؟<br />اتذكر سؤال شبيه وجهته لى صديقة سابقة هجرت دينها: انتى بتحبيه فعلا ولا اعتياد كالجميع؟ صمت يومها ولم اجاوب ونظرت للنتيجة التى اشتريتها وعليها اسمه كنوع من المشاركة فى حملة تبرع .<br />واتذكر اكثر هذا الموقف الذى يتكرر حين انتظر صلاة الفجر جوار الراديو واذاعة القرآن الكريم وتنتهى الابتهالات كل مرة بنفس الجملة \"الصلاة والسلام عليك ياامام المجاهدين ياسيد المرسلين ييا شفيع العالمين ياسيدى يارسول الله .. الله اكبر \" ، وهنا وفى كل مرة ابكى كما لم ابكى على شىء من قبل واتمنى الا يكون.<br />الطحاوى شكرا لانك تستطيع بقلمك ان توقفنى امام نفسى وتخرجنى من دوامة قلقى ، والغريب ان كل مرة تتمكن كتاباتك منى اكثر دون ملل او كلل، و تعبت من كثرة الانحناء لكتاباتك، فاضم صوتى بلا انقطاع لاحمد زين لأؤكد على رشاقة كلماتك وانك بين قلة قليلة جدا تستطيع ان تسرق من يقرأ لك وقد تكون كلماتك ابالفعل ختبار لمن عرفوا القراءة والكتابة ومن فهموا سرها."
archived = "2009-05-09"
capture_url = "https://web.archive.org/web/20090509191750/http://www.20at.com:80/salamo-3lakom/3554.html"

