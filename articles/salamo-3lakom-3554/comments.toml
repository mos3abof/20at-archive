posted = "2007-04-08"
text = "هناك امران يحتاجان للتعليق:<br />الاول: الاستغاثة من العبادات القولية والقلبية، والعبادة لا تكون الا لله سبحانه، ولا يجوز الاستغاثة بغير الله حتى لو كان نبيه صلى الله عليه وسلم، نعم تجوز الاستغاثة بالاحياء من البشر فيما يقدرون عليه كطلب النجدة من حادث، لكن الاستغاثة بالعباد فيما لا يقدر عليه الا الله، والاستغاثة بالاموات من الاولياء والانبياء فهو من الشرك، نعوذ بالله من ذلك.<br />الثاني: قال كاتب المقال: \"…حيث يشهر السيف الأموي ويسجن الحسين…\": وهذا فيه لمز لبني امية رحمهم الله، وهم الخلفاء الفاتحين المنافحين عن الاسلام، وان وقعت منهم هنات، فحسابهم على الله…<br />وفي هذه العبارة ايضًا ما يشير الى تشيع الكاتب او تأثره بأقوال الشيعة عن بني امية رحمهم الله والحسين رضي الله عنه، والحق ان تاريخ بني امية لم يكتب الا في عهد منافسيهم \"العباسيين\" وبيد الكثير من اعدائهم من الشيعة المحرفين للدين والقرآن والتاريخ، فلينتبه لذلك، ولا بصدق قول الناقمين على بني امية من اذناب الفرس المجوس لان بني امية هم من فتحوا بلادهم، وادخلوا فيها الاسلام، وازالوا دولتهم الفارسية المجوسية، فما كان من اعدائهم الا انهم شوهوا صورتهم في التاريخ بالكثير من القصص الملفقة."
archived = "2009-05-09"
capture_url = "https://web.archive.org/web/20090509191750/http://www.20at.com:80/salamo-3lakom/3554.html"

