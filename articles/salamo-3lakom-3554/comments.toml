text = "السلام عليكم<br />نعم جزى الله خيرا صاحب تعليق ان التوسل او الاستغاثة برسول الله صلى الله عليه وسلم لا تجووووز، بإجماع العلماء، والاستغاثة تكون بالله والنجدة منه والتوكل عليه وحده، فالمرجو تغيير العنوان، لان الاستغاثة بالرسول الكريم لا تجوز وقد تكون ضربا من الشرك بالله تعالى<br />وثاني ملاحظة ان الكاتب حين يكتب اسم محمد لا يردفها بالصلاة عليه، فهل هذا هو الاحترام والحب لهذا النبي الكريم صلى الله عليه وسلم،، فالمحبة ليست في القول ومن علامات المحبة الصلاة عليه صلى الله عليه وسلم<br />اللهم اني قد بلغت الاخ الكاتب فالللهم فاشهد"
archived = "2009-05-09"
capture_url = "https://web.archive.org/web/20090509191750/http://www.20at.com:80/salamo-3lakom/3554.html"

