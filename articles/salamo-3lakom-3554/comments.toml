subject = ""
author = "مسلم"
posted = "2007-04-09"
text = "يزيد بن معاوية – رحمه الله – لم يكن بذلك الشاب اللاهي ، كما تصوره لنا الروايات التاريخية الركيكة ؛ بل هو على خلاف ذلك ، لكن العجب في المؤلفين من الكتاب الذين لا يبحثون عن الخبر الصحيح ، أو حتى عمّن يأخذوه ، فيجمعون في هذه المؤلفات الغث و السمين من الروايات و الكلام الفارغ الملفق ، فتراهم يطعنون فيه فيظهرون صورته و يشوهونها ، بأبشع تصوير .<br />و للأسف فإن بعض المؤرخين من أهل السنة أخذوا من هذه الروايات الباطلة و أدرجوها في كتبهم ، أمثال ابن كثير في البداية و النهاية ، وابن الأثير في الكامل ، وابن خلدون في العبر والإمام الذهبي في تاريخ الإسلام و في غيرها من الكتب .<br />و المصيبة في هؤلاء الكتاب المعاصرين أنهم يروون هذا الطعن عن بعض الشيعة المتعصبين أمثال أبي مخنف و الواقدي و ابن الكلبي و غيرهم ، و غير هذا أن معظم هذه الكتب ألفت على عهد العباسيين ، وكما هو معروف مدى العداء بين الأمويين و العباسيين ، فكانوا يبحثون عمّن يطعن في هؤلاء فيملؤون هذه الكتب بالأكاذيب .<br />و هناك أمور و أشياء أخرى و طامات كبرى في غيرها من الكتب ، رويت لتشويه صورة و سيرة يزيد رحمه الله و والده معاوية رضي الله عنه ، و كان على رأس هؤلاء الطاعنين بنو العباس وأنصار ابن الزبير حين خرج على يزيد و الشيعة الروافض عليهم غضب الله ، و الخوارج قاتلهم الله و أخزاهم .<br />منقبة ليزيد بن معاوية :<br />أخرج البخاري عن خالد بن معدان أن عمير بن الأسود العنسي حدثه أنه أتى عبادة بن الصامت و هو نازل في ساحة حمص و هو في بناء له و معه أم حرام ، قال عمير : فحدثتنا أم حرام أنها سمعت النبي صلى الله عليه وسلم يقول : أول جيش من أمتي يغزون البحر قد أوجبوا ، فقالت أم حرام : قلت يا رسول الله أنا فيهم ؟ قال : أنت فيهم . ثم قال النبي صلى الله عليه وسلم أول جيش من أمتي يغزون مدينة قيصر مغفور لهم ، فقلت : أنا فيهم قال : لا . البخاري مع الفتح (6/120) .<br />فتحرك الجيش نحو القسطنطينية بقيادة بسر بن أرطأ رضي الله عنه عام خمسين من الهجرة ، فاشتد الأمر على المسلمين فأرسل بسر يطلب المدد من معاوية فجهز معاوية جيشاً بقيادة ولده يزيد ، فكان في هذا الجيش كل من أبو أيوب الأنصاري و عبد الله بن عمر و ابن الزبير و ابن عباس وجمع غفير من الصحابة ، رضي الله عنهم أجمعين .<br />و أخرج البخاري أيضاً ، عن محمود بن الربيع في قصة عتبان بن مالك قال محمود : فحدثتها قوماً فيهم أبو أيوب الأنصاري صاحب رسول الله صلى الله عليه وسلم في غزوته التي توفي فيها ، ويزيد بن معاوية عليهم – أي أميرهم - بأرض الروم . البخاري مع الفتح (3/73) .<br />و في هذا الحديث منقبة ليزيد رحمه الله حيث كان في أول جيش يغزوا أرض الروم ."
archived = "2009-05-09"
capture_url = "https://web.archive.org/web/20090509191750/http://www.20at.com:80/salamo-3lakom/3554.html"

