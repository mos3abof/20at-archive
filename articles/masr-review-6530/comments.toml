subject = ""
author = "معلقة دائما.."
posted = "2007-07-02"
text = "السلام عليكم الموضوع باين جدااااا يا أستاذ التعليق الأول طول عمرنا متعودين على مواضيع غير مضروبة من الاستاذ محمود ،وبتمنى من اي حد قبل ما يصدر احكام جزافية على حد يتحقق من صحة اللي بيقولو واللي دايما بيقرا موضوعات الأستاذ محمود يعرف ان ده أسلوبو وانو اصلا مش محتاج أنو يضرب موضوع المهم ده مش موضوعنا الموضوع هو التعليق على الفيلم وقصتو، قصة الفيلم كل واحد فينا لازم بيتعامل في حياتو مع ناس كدابين وللاسف ده أغلبهم بس للأسف ان في ناس بتكون بجد صادقة بس بتتاخد بذنب الكدابين ،انا عرفت ان القصة دي قصة الفنانة نهى العمروسي بس للاسف انا شايفة انها متمثلتش صح يعني الفكرة كويسة جداااااا لكن كأداء فني وعملي مش حلو من وجهة نظري ان موضوع زي ده ميستحملش انو يبقى في اطار كوميدي بس ده رايي وانا لاناقدة ولا حاجة بس اقول خسارة الفكرة ..go a headيا استاذ محمود ..معلقة دائمة"
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719234458/http://www.20at.com:80/masr/review/6530-2009-06-09-12-13-10.html"

[[comments]]
order = 1
subject = ""
author = "إنسان مسلم"
posted = "2007-07-02"
text = "بجد انا لا أدرى من هو هذا الشخص المتربص للأستاذ محمود التركي ولماذا تتهمونه دائما بإنه بيضرب الموضوعات رغما إني لم في حياتي شخصا يتصف بالمصداقية مثله وللعلم أنا أعمل في جرية أسبوعية وفي قسم الفن أيضا وكافة المصادر التي يستعين بها الأستاذ محمود متاحه أي إنه ليس في حاجه الي الضرب كما يدعي الأستاذ المبجل السابق تعليقة لكن أعلم إنه إنسان من داخل عشرينات أنفسهم ونظرا لجودة موضوعات التركي فهو حاقد والحقد بين في كافة كلماته وأفعاله فأنصحك نصيحة يا أستاي المبجل لا ترمي الإتهامات جزافا على زملائك بل نشط ذاتك وإجتهد لأن النظر إلى أعمل الغير بكل هذا الحسد فهو حسد مزموم لإنك تتمنى زوال فكر الأخرين وأفكارهم وأستعيذ بالله من الشيطان الرجيم يجعل لك مخرجا ولا تضارب الناس في لقمة عيشهم لأن الله عز وجل يقول بسم الله الرحمن الرحيم من إتق الله يجعل لة مخرجا صدق الله العظيم"
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719234458/http://www.20at.com:80/masr/review/6530-2009-06-09-12-13-10.html"

