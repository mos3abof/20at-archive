author = "اكتب اسمك هنا"
posted = "2007-07-02"
text = "يا ترى الموضوع ده كمان مضروب ولا اتعمل بجد<br />لأنك مبئاش عندك اي مصداقية<br />بس عايز انصحك نصيحة<br />لما تضرب موضوع بلاش تبقى تقول لحد على انك ضربته<br />عشان ميفضحكش<br />خصوصا لو كان الطحاوي عايز يتصل بمصدر الموضوع"
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719234458/http://www.20at.com:80/masr/review/6530-2009-06-09-12-13-10.html"

