text = "مش عارف ليه حاسس ان احمد ادم ملهوش حظ مع ان دمه خفيف جدا والارتجال عنده عالي بس مش محظوظ<br />وانا لسة مشوفتش الفيلم علشان الامتحانات بس خلاص خلصت وح اشوفه قريب ان شاء الله<br />واديها سينما"
