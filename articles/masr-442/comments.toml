author = "أبوزيد الفلاح الفصيح"
posted = "2006-06-06"
text = "يا عيني عليك يا ولدي<br />يا عيني عليك يا أخويا<br />قتلوك ولاد الخنازير<br />و ريسنا حبيبنا يقابل الخنزير الكبير بتاعهم و الله ربنا أكيد غضبان علينا و مسلط علينا أسافلناو لكن يا أخواني خلينا صاحيين"
