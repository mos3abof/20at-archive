[[comments]]
order = 0
subject = "خلي السلاح0000نااااااااايم نايم"
author = "الاستاذشيكو"
posted = "2006-06-03"
text = "انا مش عارف ليه احنا واجعين دماغنا 0000<br />اللي اسرائيل بتعمله في الفلسطينين مش هاممنا يعني نحن كامصريين ولا ايه ؟!!!!<br />لازم اللي يموت يكون مصري عشان نكتب ونسال ونتحرك ولا ايه<br />الحكومه ماعملتش حاجه لما مات قبل كده مصريين كانوا تلاته علي مااعتقد<br />ومش هاتعمل حاجه لو كان اللي مات المرة دي 10او 100 او1000والله ماهاتعمل حاجه ودة يمين اتحاسب عليه يوم القيامه<br />ولو فيه حد معتقد ان الحكومه حتي بتهتم يفسر ليا حكايه التليفزيون بتاعنا اللي مازعش الخبر حتي لو بالكذب وحتي الجرايد كاتبه الخبر بتريقه كان اللي ماتوا دول ارهابيين ولا حتي مش مصريين وكان فيه تعمد ان الحكومه تبان وكانها مش مهتمه للموضوع دة وبكرة هانشوف<br />دى مش اول مرة تاخد الحكومه علي قفاها عشانتحس ولا تتحرك لغايه مابقه حكومه منحسه من كتر الضرب ع القفاه<br />وبكرة هاتلاقي الجرايد هايطلعوا القطط الفاطصانه في اولادنا اللي استشهدوا<br />وزى ما قالوا زمان<br />فاليرجع عصر الشهداء من تاني"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922154950/http://masr.20at.com:80/article.php?sid=442&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

