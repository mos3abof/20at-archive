posted = "2006-06-05"
text = "وتفوق اسرائيل و الدول الغربية بامر الله طبعا<br />والسبب ببساطة ان الدول دي ماحدش بيسجد ويسبح بحمد مخلوق زي عندنا<br />مش مصدق شوف الحزب الوطني والشرطة هما بيعبدوا ربنا بس ولا بيعبدوا الحاكم<br />انما في اسرائيل ما حدش بيعبد الحاكم"
