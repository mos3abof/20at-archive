subject = "مفيش فايدة"
author = "الدكتور"
posted = "2006-06-06"
text = "ياجماعة سعد باشا زغلول قالها وهو على فراش الموت مافيش فايدة ده حتى ملحقش ينطق الشهادة لان مافيش فايدة قالها ومات.علشان كدة ابقى ابن كلب لو همنى امر اى حد فى السلطة سواء جيش او شرطة او حكومة ان شاء الله يولعو كلهم .وبعدين واجب وطنى ايه اللى بتقولو عليه .هو حماية اسراءيل وحصار الفلسطينيين بقى واجب وطنى يااخى ا...... هريها"
archived = "2006-09-22"
