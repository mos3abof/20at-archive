[[comments]]
order = 2
subject = "آآآآآآآآآآآة ياوطنى"
author = "مصرية"
posted = "2006-06-04"
text = "ولسه ..حيقتلوهم تانى وثالث..فما أرخص الدم المصرى فى عيون السفلة الفسدة..الكلب الذى سيجلس مع السفاح الجديد اولمرت اليوم..(يارب ما يوعى) ..لبحث ودفع عملية السلام..يسقط يوميا العشرات من الشهداء منذ توقيع معاهدة الاستسلام مع اسرائيل وهو لايزال يبحث فى دفع عملية السلام ..التنازلات تقدم فى العلن والسر ..الكرامة العربية تسحق.. المسجد الأقصى يدنس ..الحدود العربية مع اسرائيل تخترق ..وهو لا يزال يستجدى السلام من اسياده اليهود..لعنة الله عليهم جميعا..كم هان الدم المصرى فى نظر هؤلاء الكلاب..لوعنده ذرة من الكرامة أو احترام الذات لألغى هذا الأجتماع حتى ولو ذرا للرماد فى العيون.. كان أشرف له أن يفعل.. وخاصة انه يعلم تماما أنه لاطائل ولا عائد منه..أو أضعف الأيمان يؤجله احتجاجا على ما حدث...ولكن كالمعتاد اذا كان هناك ما يمس الكرامة أو الشرف للأنسان المصرى ..فهو ليس فى الحسبان..<br />ايها المسخ القبيح ارحل ..ارحل واحفظ لنفسك القليل من ماء الوجه قبل أن يأتى اليوم الذى سترحل فيه أنت وكل كلابك..بأقدم وأحقر حذاء فى مصر<br />أنتم أحقر الكلمات فى قواميس كل لفات الدنيا..لالالالالالالالالالالالالا للقرصان الطاغية وسلالته وعصابته ..ونعم..نعم..نعم لثورة الجيش والشعب على الظلم والفساد ..اللهم اجعله يما قريبا..آآآآآآآآآآآآآآآآآآمين"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922154950/http://masr.20at.com:80/article.php?sid=442&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

