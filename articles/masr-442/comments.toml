[[comments]]
order = 13
subject = "الله يرحمك يا سادات"
author = "أحمد"
posted = "2006-06-07"
text = "الله يرحمك يا سادات ، ماكنش أي كلب يجرؤ على المساس بأي مصري سواؤ مدني أو عسكري.<br />السادات إللى موت مناحم بيجن بحسرته، إللى قال عنه في مذكراته \" أخذ أرضه مقابل ورق لا أكثر \" ، الله يرحمك يا سادات وربنا ينتقم من إللى فرطوا في الدم المصري سواء من الخارج أو من الداخل."
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922154950/http://masr.20at.com:80/article.php?sid=442&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

