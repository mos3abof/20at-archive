subject = "المراءة عفة وحياء زينة المراءة الحياء والفعة"
author = "امينة"
posted = "2006-08-05"
text = "السلام عليكم<br />فكرة رائعة ان يكون كافي النت خاص بالبنات ووتاني خاص بالشباب<br />وعايزة ارد عليBATISTUTA واقولة لك عندك حق في شباب كثير متدين وبحترموا في في كمان شباب سافل واسفة علي الفط ده بس ده الحقيقةومش كل البانت ضحايامش كل الشباب جناة وعندك حق في اللي بتلبس مضيق واللي مش سترة نفسها بس قول الله يهدي الجميعوشكرا لك بس لو كل شباب مثل استاد خالد وكل البنات يكون محترمين كان الله نصرنا من زمان<br />بس بجد يا استاد خالد فكرة جميلة ياريت الكل يعمل مثلها وشكرا لك"
