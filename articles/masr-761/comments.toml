[[comments]]
order = 15
subject = "نعم للاختلاط لا للاختلاط"
author = "فارس"
posted = "2006-08-10"
text = "الموضوع ده طبيعى يا شباب ويا بنات<br />ده تطور المجتمع الطبيعى<br />واللى مش مصدق يراجع التاريخ<br />هاتلاقو ان مثلان افلام الثمنينات اغلابها افلام عريانه ويمكن لو طلبو من الرقابه عرضاها فى وقت تانى كانت رفضت<br />ولو رجعنا لوره شويه هانلاقى المجتمع كان مجتمع محافظ قوى وكان صعب انك تلاقى بنت لابسه مينى جيب وبعدين الموضوع اتفتح على البحرى ؟....<br />وده اللى بيحصل دلوقتى .<br />مجتمعنا بعد الثمنينات رجع محافظ مرة تانيه واستمر الوضع فترة وبعدين بداء المجتمع يتغير تانى ويحصل فيه بعض التغيرات<br />وانا مش هاقول بسبب امريكا او العولمة<br />فا تعددة الاسبابا والموت واحد<br />الموضوع راجع لينا احنا وتغيرات طبيعيه فى المجتمع<br />ولازم نعرف ان ده طبيعا وان المجتمع ها يفضل يتغير مرة يدعو للمحافظه واحترام التقاليد ومره اخرى يدعو الى<br />--> مش عاوز اقول الحرية<br />(لان الحرية ملهاش دعوه بالتعارى)<br />بس اللى يضحك<br />ان المجتمع حارب كل اللى كان بيدعو للفصل بين الجنسين والغريب ان هوه ده نفس المجتمع اللى فصل ما بينهم(موضوع الكافى نت المنفصل للبنات)<br />وهوه ده اللى بكلمكم عنه التغيير الطبيعى<br />فى المجتمع (دورة الحياه الاجتماعية)"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065109/http://masr.20at.com:80/article.php?sid=761"

