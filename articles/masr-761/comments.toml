text = "انا كنت متأكد بنسبة 100% ان واحد من المعلقين هيقول ان انا متعقد وواحدة ضربتنى بمبة وخانتنى مع صاحبى بس انا بطمنك مافيش حاجة من الكلام ده انا بعترض فقط على التمييز فى معاملة المجتمع لافراده على ان دول ملايكة ودول شياطين.<br />انا يا استاذى الفاضل مش ناوى الاقيها دلوقت الايقها ساعة الجواز بس .<br />بس انت بتستغل الموضوع علشان تحقق شوية مكاسب شخصية بنات يراسلوك وكده يعنى زى موقف الشهم فى الاتوبيس او المترو والبنات واقفة وهو قاعد وانت قارينى .<br />انت شكلك شاب روش وحلو وانا والله معجب بتعليقك المحترم وشكرا"
