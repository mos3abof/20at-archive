text = "متستعجلش ياعم خالد علي كون فكرتك هتنتشر لا البنات والسيدات مهما يعملولهم بردك بتحلالهم الحته اللي في ايد الشباب زي مقوله اللقمه في ايد اليتيم عجبه وعندك مثال مترو الانفاق مخصص فيه عربه للسيدات وتلاقيهم متكربسين معانا وعربيتهم فاضيه متعرفش ده احساس بان العربيات التانيه احسن من عربيتهم ولا ايه وبكره هيحسوا ان النت كافيه المشترك عليه العين عن بتاع للبنات فقط وهيطلعوا اي مبرر وبكرة نشوووووووف"
