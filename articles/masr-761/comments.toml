order = 0
subject = "هم الضحايا ونحن الجناة"
author = "BATISTUTA"
posted = "2006-08-03"
text = "صحفى موقع عشرينات مصرون بموضوعاتهم النارية الجبارة على ان الشباب وباء دائما يضايقون الجنس الاخر .<br />هذا التحقيق تحقيق جيد ولكن كان من المفروض بعد كده اظهار وجه نظر اخرى ان فى شباب محترمين مهذبين لا بيضايقوا ولا بيفكروا فى كده من الاصل .<br />يا جماعة بلاش التحامل الشديد على الشباب انا متأكد ان فيه شباب سافل بس مش هى دى الاغلبية .<br />زى ما فى بنات مش محترمة سلوكها ومظهرها هو سبب المشاكل .<br />واذا كانت ظاهرة الشباب الوحش دى مضايقة ناس كتير يبقى نعمل وطن جديد للبنات فقط وشكرا"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065109/http://masr.20at.com:80/article.php?sid=761"

