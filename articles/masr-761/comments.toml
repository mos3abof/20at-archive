subject = "مسؤولية مشتركة"
author = "مش مهم"
posted = "2006-09-25"
text = "يا جماعة المسؤولية مشتركة محدش بيلوم الولاد ولا البنات خصوصا على كده.. البنات بتلبس لبس اخواتها الصغيرين كمن لبسها مش لاقياه و الولاد بتقل ادبها الى درجة مقززة فى بعض الاحيان..<br />دى فئة من الشباب و فى فئة تانية محترمة نفسها من الجنسين..<br />خلاص محدش يقول المسؤولية على طرف واحد..<br />و خالد عمل الموضوع ده عشان اكل عيشه مش اكتر..<br />بس بامانة انا بنزعج اوى لو رحت اى نت كافيه الولاد يبقوا بيلعبوا جيمز مع بعض و نازليش شتيمة و الفاظ.. و ريحة سجاير و مواقع مش ولا بد و حاجة تقرف.."
archived = "2006-11-06"
