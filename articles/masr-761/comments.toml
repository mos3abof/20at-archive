subject = "اعتقنا يا عم باتيستوتاااا !!"
author = "نور اللهnourallah_nourallah2yahoo.com"
posted = "2006-08-06"
text = "ايه يا عم انت حبيبتك اداتك بمبه ولا لسه مش لائيها ولا مش ناوي تلائيها ولا مش عارف تلائيها.... :)<br />م-الآخر كدا انت متعقد...لا وايه الحالة صعبة أوي..أنصحك تعرض نفسك على طبيب نفساني..<br />وأما البنات..متفرحوش أوي كدا..هو كان عندو حق بس زودها حبتين..<br />ياااا بناااااااات..<br />اسمعووووووووووووووونيييييييييييي....<br />انتو في غفلة كبيرة انتو مش وحشين i sure<br />لكن للأسف الغرب عرف ازاي يضحك عليناويئلعنا حجابنا بطريئته اللئيمة المعروفة عنه، خليكو واعيين..الغرب لما لئوكو مش عايزين تئلعوا حجابكو آلو خلاص خليهم لابسينوه بس كأنهم مش لابسينو..فاهمين...فاهمات..<br />غطوا جسمكوا بس (بدي) (استرتش)...<br />وهحده تئوللي أنا الحمد لله بلبس واسع أ}لها..طب مافيهوش زينة؟؟؟؟؟<br />عارفين يعني ايه زينه؟؟<br />يعني تبئي معديه تلائي أمة لا الاه الا الله بتبص عليكي..والمعاكسات بترفرف من حواليكي زي الورد اللي بيتحدف على العروسه.<br />لو دا بيحصل معاكي يبئا لازم تراجعي نفسك وتسألي نفسك..أنا اتحجبت ليه؟<br />كل واحده وضميرها..<br />بالمناسبة..اللي اتحجبت عشان شعرها وحش..الكلام موجه ليها...واللي اتحجبت عشان أهلها أجبروها عليه..بردوه الكلام موجه ليها..ونفس الكلام للي اتحجبت عشان دا بئا عرف من أعراف المجتمع.<br />ماتزعلوش مني والله الكلام دا لمصلحتكم.وعموما الحجاب جزء من الدين مشكل الدين زي ما ناس كتير فاكره، لكن مافيش شك إنه جزء كبير من الدين.ولا أيه؟!<br />لو عايزين أكتر راسلوني وأنا تحت أمركم.<br />صحيح يا أستاذ خالد هو السايبر دا فين ياريت تئوللي المحافظه والمنطقه.<br />thank you.<br />nourallah_nourallah2yahoo.com"
archived = "2006-08-21"
