subject = "بلا خيبة"
author = "عبدالله مفتاح"
posted = "2006-08-06"
text = "النت كافيه لما يبقى للبنات بس كل البنات يداروا على بعض والاخ اللي واقف يداري بردو<br />لكن لما الشباب يبقوا موجودين هيشوفوا المصايب ومش بيداروا<br />هي دي الفكرة من وجود نت كافيه للبنات بس<br />بلا شباب بيايقونا بلا كلام فارغ<br />مهو الشباب في كل حته مش هيدايقوهم الا في الكافيه<br />والنادي لا ليه؟"
