text = "انا شاب صحاب سيبر اعمل فى جهد متوصل على ذلك السيبر توجد بجورنا جامعة العمنية والحمد لله يتى كل شاب وكل بينت دون ان يحدث اى شىء مما اسمع بها اتعرفون لماذا لن صحاب كل سيبر لم يضع قونين تحث على احترم الزبون ام انا الحمد لله الزبين عندى لم يشاكى احد واختا فى الجامعة ابدا علماا انهم من البينت والشبات قد اعطونى بريدهم لكى اطمن عليهم والحمد لله حيث انى قد قمت بعمل شيق الى الغية وهو بيناء موقع اسلامى وكل من يريد القران ابعت لة فيها اخوكم نور الدينnor_elden22@yahoo.com"
