text = "الى ابوبهيه اول سؤال ليك انت اكيد مش مصري لانك لو مصري هيكون فيك خير في الريس انت واحد مدسوس علينا اول حاجه الريس برقبت الرؤؤساء كلهم واول الخونه الي انت بتتكلم عنهم هو الرئيس الفلسطيني السابق والحالي هم اكبر خونه وبايعين بلدهم والي بعده الرئيس العراقي الي باع ارضه<br />وانت شخصيه متطرفه انك تشتم في رئيس بيخاف على شعبه<br />والجزء الثاني انك تهين ابنه جمال وتوصفه بالتخلف ده المتخلف الي يسمع واحد زيك وانت واحد جبان ومن اسمك انت جبان لانك مش قادر تقول اسمك الحقيقي<br />واخيرا مهما الرئيس مبارك هيعمل فالي زيك هو الي مايستهلووووووووووش وانا لو منه هعدمك في ميدن عام لتكون عبره<br />ااتقي الله في بلدك ياابن البلد؟؟؟؟؟؟؟؟؟؟<br />وفي رئيسك وابنه لان هو الوحيد الي يستاهل يكون الرئيس لانه حكيم ودبلوماسي<br />واخيرا طز فيك ياابوبهيه وفي الي زيك من شرذمة المجتمع"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062500/http://masr.20at.com:80/article.php?sid=761"

