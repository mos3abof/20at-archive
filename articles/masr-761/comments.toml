text = "عزيزي ابن العزيزة جدا علينا ( ابن بهية) عندما تفكر في اطلاق الشتائم على جلاله المغفور له الملك حسن ابن طلال يجب ان تعد وانت في انتظار العزيزة بهية في العودة في الصباح الباكر لل 100... لانك ابن مره عزيزة على قلوبنا بهية المتناكة...<br />ولك يا ابن المره الوسخة يكفي ان المفور له الملك حسن لم يعدم او يسجن اي مواطن وطيله فترة حياته يا ابن المرة اللبوة....<br />فاهم يا كسمك"
