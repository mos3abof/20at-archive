subject = "من فضلكم اسمعونى"
author = "إيمان"
posted = "2006-08-19"
text = "كثيرا من الشباب يعتقدون اننا ضدهم ,لا, نحن لم نقصد ذلك .يا شباب اقسم بالله فى شباب كتير كويس و زى الفل لكن بصوا للاغلابيه .كل اللى هأقدر اقوله لحضرتكم هو انكم تخافوا على اخواتكم البنات او زوجات حضارتكم او امهات حضارتكم لأن لو البنت جميله و بص عليها الرجال اصبحت فتنه واصبح ذنب واحب اقول لكم انى البنات المنقبين كمان بيتعاكسوا إيه رأيكم فى كده لأنى انا شوفت بنت قبل كده منقبه و اتعكست مجرد ما شاف عنيها .يا جماعه المسأله مساله حمايه للبنت مش اكتر.و ربنا يهدى الجميع"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065109/http://masr.20at.com:80/article.php?sid=761"

[[comments]]
order = 20
subject = "تحذير .. من جوة الزير"
author = "الفكرة فى حد ذاتها كويسه"
posted = "2006-08-20"
text = "بس أنصح اى مزة متتكلمش من النت اصلا<br />ولو أتكلمت يبقه للضرورة القصوى ومش من ايميلها الاساسى<br />حدش عارف الواد بتاع السيبر دة محترم غيرة يكون عامل ازاى<br />وانا أعرف اصحاب سيبر يعزوا قوى اى واحدة تيجى تكلم جوزها المسافر وياخدوا الايميل ويشاغلوها ( طبعا الغرض مفهوم)<br />الست تعبانه وزهقانه<br />ربنا يستر على ولايانا"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065109/http://masr.20at.com:80/article.php?sid=761"

[[comments]]
order = 21
subject = "بيسيبوا عربيات السيدات ليه ؟"
author = "راكب مترو"
posted = "2006-08-21"
text = "ببساطة لأن اللي بتركب عربة السيدات غالبا بتاخد المشوار بطوله واقفة , انما اللي بتركب اي عربية تانية غالبا بتلاقي شاب يقوم و يقعدها مكانه , خصوصا كل ما كان سنها اكبر و كل ما كان المترو أزحم , و كل الستات عارفين كده , و كلام خدته من على لسان اكتر من واحده انها بتتعمد تعمل كده , و بلاش نقول ان البعض بيتعمدوا يحرجوا أي رجل أو شاب قاعد عشان يقعدهم مكانه , و حصلت معايا شخصيا مرة , و قدامي أكتر من مرة , مش كده و بس دا انا مرة شفت واحدة ساحبة امها المتقدمة في السن و بتقول لها بالحرف \"تعالي لما نقعدك مطرح حد\" , و طبعا فعلا قعدت فورا , مش كده و بس دا نفس اسلوب الاحراج استعملوه لحد ما بقية العيلة قعدوا , كبار صغار , شباب بنات ... احتلال بسيف الحياء يعني...<br />حق كل كبيرة في السن ان تجلس مكان اي صغير في السن , كما انه حق اي رجل عجوز , لكن من ناحية هما بيعملوا كده عشان مش هايعرفوا يحرجوا حد في عربة السيدات ... ليه ؟ الله أعلم"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065109/http://masr.20at.com:80/article.php?sid=761"

