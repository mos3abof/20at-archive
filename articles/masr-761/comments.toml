[[comments]]
order = 3
subject = "مواقف سفهاء الأمة ؟؟؟"
author = "إبن بهية"
posted = "2006-08-04"
text = "طبعاً وثق العالم أجمع وأجمع أجمع على أن ثلاثي الخيانة في الدول العربية هم حسني مبارك زعيم ماسونيي العرب بعد هلاك حسين بن طلال والد الخائن رقم إثنان وأما الخائن الثالث فهو عبدالله بن عبدالعزيز سليل يهود خيبر وبني النضير إن كان ينفع. لكن هناك زعماء عرب آخرين لابد من ذكرهم إن سلباً أو إيجاباً لما ظهر منهم من ردود أفعال لها دلالاتها .. فالرجل الفقير المسكين البطل عمر البشير رئيس السودان هو أحد القلائل ممن يمكن أن نذكرهم بالخير ، الرجل يصطلي منذ سنوات بنيران الفتن الصهيونية في الجنوب ودار فور وربما قريباً في الخرطوم لولاً أن عصابات بني صهيون مشغولة اليوم في حزب الله الذي لطخ شرفهم .. عمر البشير صرخ وندد ولكن لأنه فقير فلم يسمع له أحد ولأنه أيضاً يعتبر ضمن محور الشر الذي حددته أمريكا بصورة ما .<br />زعيم آخر من الزعامات الورقية يدعى الشاويش علي صالح يحفظ منذ سنوات عبارة وحيدة يصدر بها المشكلة إلى الدول ذات الجوار مع فلسطين المحتلة في كل موقف مماثل حيث يقف يولول كل مرة متعللاً بأن بلاده ليس لها حدود مع فلسطين ولولا ذلك لجيش الجيوش وأصرع أبواب الجهاد للشباب اليمني الحر .. بالطبع كلام مكرر وهايف لا معنى له كتلك المظاهرة المليونية التي نظمها رجاله لإرغامه على ترشيح نفسه لفترة رئاسة جديدة .. فيلم هندي سيء السيناريو والإخراج وبطله خرف ، ربما لا يمكنك أن تستخلص من خطاب الأخ علي غير كلمة واحدة صادقة وهي وصفه للشباب اليمني بأنه حر مجاهد ، نعم هو كذلك ولكن هذا الشباب الحر المجاهد بدأ يتلاشى في الشارع اليمني بعد أن ملأ بهم الأخ علي سجونه إبتغاء مرضاة أونكل بوش.<br />الزعيم الآخر الذي يجدر الوقوف عنده طويلاً هو الأخ العقيد معمر القذافي .. رجل الشتائم والسباب ورفع الأنف عالياً خفاقاً إلى عنان السما<br />اقرأ بقية التعليق .."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065109/http://masr.20at.com:80/article.php?sid=761"

[[comments]]
order = 4
subject = "هوجو تشافيز"
author = "BATISTUTA"
posted = "2006-08-04"
text = "لقد اذاعت قناة الجزيرة حوارا مسجلا للرئيس الفنزويلى هوجو تشافيز من لم يسمع الحوار فقد فاته الكثير ليسمع ويعرف من هى فنزويلا وماذا يفكر رئيسها وما هى نهجها مع بلاد العالم النامى.<br />فنزويلا بلد مصدرة للبترول وعضو فى منظمة الاوبك ولعل وفرة مواردها هو ما جعلها تتزعم دول قارة امريكا الجنوبية.<br />فى بداية الحوار تحدث الزعيم المحترم تشافيز عن عميق حبه للعرب ومدى سعادته بوجوده على ارض الجزيرة .<br />ثم انتقل الى انتقاد اسرائيل واصفا ما تفعله فى لبنان وفلسطين بمذابح النازى .<br />ثم انتقل الى الحديث عن تجربته الديمقراطية فى بلده وكيف ان الشعب هو الذى يحكم وكم المخاطر التى تهدد بلده من العدو اللدود امريكا التى تحيك له ولدولته المؤمرات فى الظلام حتى انها شجعت بعض الضباط الخونه على التمرد وقاموا بنفى تشافيز الا ان الشعب خرج فى مظاهرات مليونية مطالبا بعودة رئيسه المنتخب واخيرا تحت وطأة الضغوط الشعبية عاد تشافيز الى الحكم مرة اخرى .<br />وانتقل الى الحديث عن صفقة اسلحة دفاعية من روسيا لمواجهة الامبرالية الامريكية التى تسعى الى فرض حظر تصدير السلاح اليه .<br />وفى النهاية طالب اسرائيل بالكف عن العدوان والنسحاب من لبنان وفلسطين ولم ينس ان يشكر قناة الجزيرة على سعيها فى نشر الحقيقةوصمودها رغم كم الضغوط التى تتعرض لها دوله قطر والتفكير فى قصفها .<br />ان تشافيز مثال حى لرئيس يتحدى امريكا ويسخر من رئيسها جهارا نهارا .<br />مثال لن تجد فى حكامنا البواسل حاكم مثله يقوم بسحب سفيره من تل ابيب فى خطوه لم يفعلها الزعيم العربى والمسلم .<br />تشافيز ماروعه حاكم!"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065109/http://masr.20at.com:80/article.php?sid=761"

[[comments]]
order = 5
subject = "الفتاة الرقيقة تستسلم"
author = "raghad"
posted = "2006-08-05"
text = "السلام عليكم انا اشكرك يا اخ خالد على هذا العمل الرائع الذي قمت به فالشباب هذه الايام تتصرف مع البنات وكانهم منافس حتى لما تمشي البنت على الرصيف يحاولون انزالها في وسط الشارع كما انهم يجلسون في اماكن مخصصة للبنات فقط مما يؤدي الى منع بعض البنات من الجلوس فيها لانهم يقومون ببعض التصرفات الغير لائقة اتمنى لو يفهم الشباب ان المراة هي لها حقوق ولا يمكن ان يتاجوزها اي شخص"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065109/http://masr.20at.com:80/article.php?sid=761"

[[comments]]
order = 6
subject = "حلوة تستسلم دى"
author = "BATISTUTA"
posted = "2006-08-05"
text = "فتاة رقيقة وفى الزمن ده أشك!!!!<br />كفاكم تظاهرا بالبراءة وبان الشباب مصاصى الدماء يسلبونكن جميع الحقوق.<br />وانظروا قليلا الى حالكم (معذرة سوف استخدم م الجمع لان امل بسرعة من استخدام نون النسوة)مظهركم اذا كان الشباب اخر ما تفكرون فيه وهم دائمى التطفل عليكم كما الذباب فليه بقى بتلبسوا اللى على الحبل كل خروجه وكانكم رايحين عرض ازياء .ولا دا حجة عشان ابقى جميلة طب جميلة لمين لنفسك .<br />ارحمونا انتم بلبسكم المهذب .وانا والله مش معترض ان كل شى فى البلد دى يبقى فيه عبارة للبنات او للبنين فقط لان ده هيريح ناس كتير اولهم الشباب"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065109/http://masr.20at.com:80/article.php?sid=761"

