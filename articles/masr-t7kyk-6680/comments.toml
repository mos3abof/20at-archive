text = "والله يا جماعة انا بقالي سنين بامارسها وفعلا الفوائد لا نهائية وبالنسبة للتخوف من علاقتها بالدين فانا عايزة اقول ان الامام الغزالى رحمه الله قال مثال حلو قوى معناه ان الانسان ممكن يقرف يشرب العسل من اناء الحجامة حتى لو كان معقم وهو بكدة بيحرم نفسه من فايدة العسل والمعنى اللى عاوزة اوصله ان مش كل علم من ديانة مختلفة يبقى مرفوض الكونغ فو والكاراتيه ومعظم الفنون القتالية اصلها انواع من العبادات الوثنية لديانات قديمة لو فضلنا نفكر بالطريقة دي لا حيبقى فيه تدريبات جيش ولا نصر ولا اي حاجة وما دام فيه عقل يميز بين الصواب والخطا يبقى نستفيد باللى يتوافق مع ديننا ونسيب اللى العقل ما يقبلوش بجانب ان التفكير العلمي بيفيد فى الحالات اللى زى دى لاني لما قريت عن اليوجا قريت فى كتب علمية بتشرح تاثير كل وضع على الجسم وسبب التاثير من الناحية العلمية فى الدورة الدموية وذبذبات المخ …الخ<br />ونبعد بقى عن الخوف والخرافات الموضوع ملهوش صلة بالسحر ولا الشعوذة ده علم..ونتاج حضاري والاعمال بالنيات..انا لما امارس رياضة قتالية للدفاع عن نفسي او رياضة استرخاء للعلاج النفسي مش معناه انى خرجت عن دينى ما دمت بعمل ده بوعى تام بجانب ان الطب فى مصر القديمة كان مرتبط بالدين عموما الديانات القديمة كانت بتربط معظم نواحى الحياة بالدين علشان تضفى عليها روح القدسية حتى الرقص كان لية معنى دينى وكان بيستخدم كنوع من التعبد ومادام احنا عارفين انها اصلا ديانة وثنية يبقى الجانب الانسانى الاكيد هو نوع من التطور الحضاري ونقدر نستفيد منه وهو العلوم والفلسفة<br />والفنون والرياضات والباقى خرافات لا يعتد بيها .<br />العقل والعلم هما اللى بيساعدوا فى الحكم علي الاشياء وياريت نزود معارفنا ونبطل ناخد بالسمع لوحده لانه غير كافى."
