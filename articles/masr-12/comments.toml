subject = "اضغاثراحلام"
author = "مصرية"
posted = "2006-04-28"
text = "ايها الحاقدين موتوا بغيظكم استقالةالرئيس المبارك على قول عرفات رحمة الله وسيرحم كل المصريين الا مبارك يعنى مين حيضمن لاحفادنا المستقبل المشرق مثل اللذى نعيشة الان ثم ان السبعين مليون مصرى لا يوجدبينهم من يصلح لحكم مصر الراجل بيدور مش لاقى واحد يقدر يعمل اللى هوه عملة مش كفاية الراجل مستحمل كل المصايب والكوارث والفقر والسلب والنهب والفساد والجهل والفساد وتهريب والاموال والملايين اللى تحت خط الفقر ولسة من البلاوىوما خفى كان اعظم صحيح مين يقدر يستحمل كل ده غيرك يا مبارك ياحبيب الملايين ربنا يخليك لينا ولاولادنا ولاحفادنا ولاحفاد اولادنا وليموت كل المصريين الحاقديين بغظيهم"
