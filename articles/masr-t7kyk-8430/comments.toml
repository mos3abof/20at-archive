text = "ايا الحب والجمال<br />لما كان الرغيف ب 5 مليم<br />وكيلوا الرز ب 5 قروش<br />والجريدة بصاغ<br />وازازة البيبسى ب 10 مليمات<br />فى طفولتى ايام ناصر العظيم - قضيت الابتدائى والاعدادى والثانوى والجامعة وهى نفس الاسعار - لم تتغير الى اعلى مليم واحد<br />وكانت فرقة رضا - محود رضا وعلى رضا وبنت استاذ الجامعة استاذ الهندسة فى هندسة القاهرة السيدة فريدة فهمى<br />ومحمد العزبى والاقصر بلدنا<br />وشفنا فرقة ساعة لقلبك والدكتور شديد وفؤاد المهندس - انت فين يا محمود - وفرقة المدبوليزم عبد المنعم ابراهيم<br />وعاصرنا بناء السد العالى<br />وتمصير الاقتصاد المصرى<br />وبناء القطاع العام - ثم الهزيمة والان[ *** ]ار - ثم حرب الاستنزاف والعبور ونصر اكتوبر ومحمد افندى رفعنا العلم<br />وبدا الانحدار - كامب دافيد - ثم الانفتاح<br />ثم الضياع<br />وفرقة رضا من علامات الزمن الجميل - كانت تسافر الى موسكو وباريس والهند<br />وكانت بشهرة فرقة البولشوى الروسية وكانت الدولة تستدعيها واقامت عروض فى برلين والنمسا وامريكا<br />الرقص بدون اسفاف<br />تابلوهات جميلة - لا تتصور مدى الانبهار عندما تتفرج على تابلوة رقصة عروسة المولد فى اجازة نص السنة المصور فى مديرية التحرير - الارض الصحراوية التى استصلحها ناصر واضاف محافظة الى محافظات الجمهورية"
archived = "2009-05-30"
