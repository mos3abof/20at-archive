author = "مصر المحبوسة"
posted = "2009-12-26"
text = "لاول مرة تصدر فى مصر المحروسة اسف قصدى المحبوسة انتخابات حرة ونزيهة مفيش فيها بلطجية ولا امن مركزى ولا محترفى تزوير<br />يارب تتعمم التجربة فى كل الانتخابات"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227183530/http://www.20at.com:80/masr/news/14587-2009-12-26-10-22-42.html"

[[comments]]
order = 1
subject = ""
author = "حزب ال 1500"
posted = "2009-12-26"
text = "الحزب الغير وطنى حزب ال 1500 نفر بتوع رجال الاعمال مزدوجى الجنسية - المستوردين من برة علشان يحكمونا من اول رئيس الوزراء الحاصل على الجنسية الكندية الى المغربى والجبلى حاملى الجنسية السعودية الى جيمى حامل الجواز والجنسية البريطانية - كلهم مستوردين من برة زى استيراد القمح الفاسد واكياس الدم الفاسدة والمبيدات المسرطنة<br />الاخوان رغم كل مساوئهم وعيوبهم مصريين زينا اساتذة فى الجامعة دكاترة طب شخصيات عامة قوية ونظيفة ومحترمة"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227183530/http://www.20at.com:80/masr/news/14587-2009-12-26-10-22-42.html"

[[comments]]
order = 2
subject = ""
author = "جماعة محظوره"
posted = "2009-12-26"
text = "امال فين الحكومة<br />سايبه الاخوان يعملوا انتخابات ويجتمعوا في المكتب بتاعهم في المنيل<br />ما بيقبضوش عليهم ليه<br />مش هما جماعة محظورة"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227183530/http://www.20at.com:80/masr/news/14587-2009-12-26-10-22-42.html"

[[comments]]
order = 3
subject = ""
author = "مش اخوانى ولكن"
posted = "2009-12-26"
text = "مش اخوانى ولكن اشهد ان وكلات الانباء ووكالة بريطانية شهدت ان انتخاب الاخوان هى اشرف انتخابات تمت فى مصر فى الخمسين سنة الماضية<br />صحيح فية شفافية ونزاهة وامانة فى الانتخابات<br />امتى انتخابات مصر هتبقى عشر انتخابات الاخوان<br />صحيح الاخوان قدوة للفاسدين والمزورين والجالسين على مقاعدهم بالتزوير"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227183530/http://www.20at.com:80/masr/news/14587-2009-12-26-10-22-42.html"
