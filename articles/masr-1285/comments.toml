subject = "تكملة كمان"
author = "المسكين"
posted = "2006-12-11"
text = "انا مش ناسي اول مقال انت كتبته في الاخبار والله انا كنت هرجع من اللي انت قولته فاكر ولا افكرك يقط فاكر لما قلت ان الرئيس ما بيقدرش ياكل محشي ولا باذنجان زي اي مصري .ليه ياروح امك ياريت ياكل زينا عشان يوفر الاكل اللي بيجي من فرنسازوقلت انم مايقدرش يتفرج علي سينما او يتفرج علي ملابس ايه يقط الهبا اللي انت فيه ده هوانت من المريخ يقطزالله يخليك ابعد لان مصيرك هيبقي السجن والله اعلم يوم القيامة هيبقي ايه"
