[[comments]]
order = 3
subject = "\"الحجاب مسألة تمس الأمن القومى!!\""
author = "نقلا عن موقع الشفاف للكاتب سامي بحيري"
posted = "2006-12-12"
text = "أخبركم عن نكتة الإسبوع ، ففى وسط مولد سيدى \"فاروق حسنى\" وزير الثقافة المصرى والذى تجرى \"شرشحته\" الآن فى مصر لأنه تجرأ وأدلى برأيه فى أهم مسألة تشغل بال العالم اليوم ألا وهى مسألة \"الحجاب\" ، فلقد صرح السيد عضو مجلس الشعب المصرى ورئيس لجنة الشئون الدينية والإجتماعية الدكتور أحمد عمر هاشم (الرئيس السابق لجامعة الأزهر) تعليقا على تصريحات فاروق حسنى :\"هذه مسألة ليست خاصة بالمرأة أو المؤسسات الدينية ولكنها تمس الأمن القومى\"!!<br />... والدكتور أحمد عمر هاشم هو زميل فاروق حسنى فى الحزب الوطنى وليس فى صف المعارضة ، ورئيس لجنة هامة فى مجلس الشعب المصرى ، لذلك فلا بد وأنه مطلع على كل المسائل التى تمس الأمن القومى وعلى رأسها \"الحجاب\" ويليها \"الجلباب\" ثم \"النقاب\" ثم \"الكباب\" !! اما المسائل الأخرى الهايفة فلا تمس الأمن القومى ولا تستطيع حتى الإقتراب منه ، فعلى سبيل المثال لا الحصر:<br />وجود ملايين الشباب العاطل عن العمل فى مصر مسألة لا تمس الأمن القومى ، فالحجاب أهم .<br />عجز ملايين الشباب والشابات عن الزواج بسبب غلاء السكن ، مسألة لا تمس الأمن القومى فالحجاب أهم .<br />تدهور مستوى التعليم فى مصر إلى حد مخجل مسألة لا تمس الأمن القومى ، فالحجاب أهم .<br />تهديد إسرائيل بضرب الحدود المصرية لوقف تهريب الأسلحة إلى غزة مسألة لا تمس الأمن القومى ، فالحجاب أهم .<br />وجود خلايا إرهابية فى صحراء سيناء مسألة لا تمس الأمن القومى ، فالحجاب أهم .<br />إختلاط مياة المجارى بمياه الشرب مما أدى إلى تسمم بعض المواطنين مسألة لا تمس الأمن القومى ، فالحجاب أهم .<br />ديون مصر الخارجية بلغت 30 مليار دولار مسألة لا تمس الأمن القومى ، فالحجاب أهم .<br />عجز الميزان التجارى المصرى م<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216185931/http://masr.20at.com:80/article.php?sid=1285"

[[comments]]
order = 4
subject = "كلمة في حوار عبثي!- بقلم : فهمى هويدى"
author = "فضحنا الجدل الذي ثار في مصر حول الحجاب مرتين، مرة لأنه كشف عن أننا لا نجيد ترتيب أولوياتنا وشواغلنا، ومرة ثانية لأنه أثبت أننا أعجز من أن نجري حوراً موضوعياً ومسؤولاً حتى في قضية بذلك القدر من التواضع."
posted = "2006-12-12"
text = "(1)<br />لا أخفي انني رفضت المشاركة في ذلك الجدل طيلة الأسبوعين الأخيرين. واعتذرت عن الكلام لمن سألني في الموضوع، معتبراً أن لدينا هموماً أخرى داخلية وتحديات خارجية أولى بالاهتمام، وأنه من العبث وعدم المسؤولية أن نصرف الرأي العام عن تلك الهموم، ونشغله بقضية الحجاب. لكني وجدت أنه بمضي الوقت أخذت القضية حجماً مبالغاً فيه، في الداخل والخارج. إذ اصبحت مادة للتعليق في كل الصحف المصرية، وموضعاً للمناقشة في اغلب البرامج الحوارية و\"الثقافية\" في التليفزيون، ومحلاً للغط داخل لجان مجلس الشعب. بل واصبحت مثاراً للجدل في مختلف الملتقيات والندوات التي عقدت خلال الأسبوعين الماضيين. اخطر من ذلك وأهم أن الموضوع استدعى إلي السطح الحرب الأهلية الثقافية الدائرة في مصر منذ عدة عقود بين المتدينين والعلمانيين. وهي التي تهدأ حيناً ويشتد أوارها في أحيان أخرى، حتى بدا البلد منقسماً بين معسكرين متراشقين، احدهما ضد الحجاب والثاني معه.<br />وما كان لصخب من هذا القبيل أن يحدث في مصر، دون أن يكون له صداه في الخارج، الأمر الذي نقل المناقشة إلي مختلف وسائل الإعلام العربي، ومعها برامج هيئة الإذاعة البريطانية. وصفحات الرأي في الصحف البريطانية والأمريكية التي أتابعها. حتى أن مجلة \"نيوزويك\" جعلت من قضية الحجاب موضوعاً لغلاف عددها الأخير (28/11). وفتحت الباب لتصويت قرائها من خلال موقعها على الإنترنت، عما إذا كان يجدر بالحكومات حظر الحجاب أم لا (للعلم: تونس بادرت إلي حظره، وجددت الحملة عليه خلال الشهر الماضي، واصفة ال<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216185931/http://masr.20at.com:80/article.php?sid=1285"
