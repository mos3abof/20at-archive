[[comments]]
order = 9
subject = "لا ..مش حتفقد حاجة ....إحنا كلنا مع بعض ضدهم ..بس أشوفكم هناك.ماشي؟"
author = "محمد السيد"
posted = "2006-04-26"
text = "أظن جت فرصة بجد .. كلنا نقف وقفة واحدة ...<br />أنا هنا في اسكندرية دلوقتي ...<br />بعد ساعتين في وقفة ومؤتمر في نادي المحامين لدعم القضاة ...<br />وفي القاهرة في مؤتمر مشابه في نقابة الصحفيين ....<br />وبعدها اعتصام لغاية بكرة ... الجمعة .... لمساتدة القضاة ضد حكومتنا النظيفة ونظامنا المبارك ...<br />ياتري لما نقول إننا نحضر ده أو ده ...اسكندرية او القاهرة ؟؟<br />لما نقول نحضر بكرة الاعتصام اليوم كله ؟؟<br />لما نقول نبات في الشارع حتي للي يقدر بس ؟؟؟<br />لما نشوف القضاة الناس المحترمة دي وهي بتتبهدل ...وإحنا كل الي بنعمله إننا قاعدين في بيوتنا نقرا مفالات ونعلق ونتغاظ شوية وبعدين نهدا تاني ؟؟<br />ساعتها ممكن أطلب منكم أشوفكم هناك ؟؟<br />والله بجد ؟؟؟ ممكن ....<br />انا ناوي احضر النهاردة في اسكندرية وبكرة اروح القاهرة ...<br />وده والله ولا حاجة .... بس إحنا نبقي عملنا حاجة ...<br />أي حاجة<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />مش مغيره .... هه<br />mohamedmat@hotmail.com"
archived = "2006-05-02"
capture_url = "https://web.archive.org/web/20060502172658/http://masr.20at.com:80/article.php?sid=222"

