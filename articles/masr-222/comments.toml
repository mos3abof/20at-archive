[[comments]]
order = 1
subject = "علاش؟"
author = "مغربى"
posted = "2006-04-25"
text = "مرحبا لكم<br />انا مغربي وبالذاف تعجبت من اموركم يالمصريين ليس انا بل كل المغاربة هن<br />تعجبت جدا لان تقولو ان ماحدث باليكزانريا للمسيحيين تصرف فردى<br />علاش تعجبت ؟؟؟؟ لانى قراءت عن احداث الكشح ورايت ان مرتكبى مذبحة الكشح براءة اذن مالذى تنتظرونة ايها المسيحيين من مختل عقليا ؟؟؟؟<br />مابعرف لما تفعلو هكذا لهن ؟؟؟<br />اليس هؤلاء شركاء وطنكم ايها الارهابيين القتلة<br />واللة عم بعرف بالذاف انو بيصير مصرى اولا واخيرا مرتكبى انفجارات دهب"
archived = "2006-05-02"
capture_url = "https://web.archive.org/web/20060502172658/http://masr.20at.com:80/article.php?sid=222"

[[comments]]
order = 2
subject = "خسئتم جميعا؟"
author = "المصرى الشريف"
posted = "2006-04-25"
text = "خسئتم ياموقععشرينات حينما حملتم الاية الكريمة التى تتحدث عن مصر بلد الامن الى نظام ما فكفا تلاعبا بالالفاظ فمصر كانت وستكون بلد الامن رغم انوفكم سنكسرها لكم ومن ورائكم ممن يزعون الياس فى قلوب شباب مصر<br />ياشباب مصر البطل اذا كان هناك مشاكل فى بلدنا فلسنا وحدنا مما تعانى من ذللك ولكن اياكم ان تستمعوا الى هؤلاء الكلاب الذين يحضونكم على التظاهر وعلى الفتنة داخل بلدكم العظيم مصر ايتها الطيور السوداء المسماة عشرينات اغربى عن شبابنا فنحن نعرف كيف نحل مشاكلنا بدون تدخلكم<br />اما الشاب المغربى فلا تعليق؟"
archived = "2006-05-02"
capture_url = "https://web.archive.org/web/20060502172658/http://masr.20at.com:80/article.php?sid=222"

[[comments]]
order = 3
subject = "نعم"
author = "المغربى"
posted = "2006-04-25"
text = "بالطبع لابد من قول لاتعليق<br />لانك وامتالك من المصريين مايقدرو الرد على من هم اعلى منهم شانا ومكانة<br />بالعالم العربى كلة<br />لقد سببتم لنا العار والاسى"
archived = "2006-05-02"
capture_url = "https://web.archive.org/web/20060502172658/http://masr.20at.com:80/article.php?sid=222"

[[comments]]
order = 4
subject = "احييك جدا"
author = "فلسطينى"
posted = "2006-04-25"
text = "هههههه<br />مرحبا انا من فلسطين واسكن بكندا<br />وارعض على مصر ان نرسل لها جيوش لتحميها<br />هههههههه<br />مادمتم غير قادرين على حماية انفسكن<br />وماتقولو امن واللة<br />انتو ماتعرفو معنى هدا الامن"
archived = "2006-05-02"
capture_url = "https://web.archive.org/web/20060502172658/http://masr.20at.com:80/article.php?sid=222"

