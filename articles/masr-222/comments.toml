subject = "نحن من اكثر شباب العالم احتراما للنفس"
author = "احمد"
posted = "2006-05-18"
text = "الاخوة الاعزاء الشامتين من الدول العربية الشقيقة الشامتين في اختكم الكبيرة مصر خصوصا الاخ الفلسطيني و الاخ المغربي<br />ارجوكم كفوا ايديكم عنا و لا نحتاج لكلامكم عن الاوضاع في مصر فشعب مصر اقدر علي حل جميع مشكلاتة بنفسة بدون شماتة من الاخوة الاشقاء شباب مصر من اذكي شباب العالم العربي فبدلا من رد الجميل من الاخوة الذين احتضنتهم ارض مصر يشمتون فيها ولكن علي راي المثل المصري ان طلع العيب من اهل العيب ما يبقاش عيب"
archived = "2006-09-22"
capture_url = "https://web.archive.org/web/20060922154846/http://masr.20at.com:80/article.php?sid=222&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

