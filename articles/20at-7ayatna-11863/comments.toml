text = "انا من طفولتي بحلم اكون ممرض وشاءت الظروف اتخرج ممرض مشارك لكن الان بندم ع الساعة الي تخرجت فيها ممرض مشارك من كلية خاصة في الاردن بمعدل شامل 73.9 بس ع الفاضي الي سنة كاملة قاعد بدون شغل حتى الخاصة بدها واسطة اوبنات عشان يداومو في هاي المستشفيات والديوان المدني بس عليه يسجل اسماء وعيش ياقديش اسف ع التعبير بس هاد الواقع السيئ لطلاب التمريض المشارك جميعهم والكليات الخاصة لسه فيها هاد التخصص والشباب المساكين لسه مندفعين للتسجيل … وين ياخوانا ع البطاله رايحين وشكرا"
