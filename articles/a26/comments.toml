subject = "كنتم خير امة اخرجت للناس"
text = "الكل يعلم تكملة الاية ..وقليل من يعمل بها..مبادرة طيبة للامر بالمعروف والنهي عن المنكر..لكن المنكر لا يتجزأ..فالاسماء والاغاني المذكورة لا تشكل الا واحد على الف مما يمكن ان يمنع من على الشاشة الصغيرة حجما الكبيرة تاثيرا..عليكم يا اخوتي واخواتي فى الله اتباع سياسة ضبط النفس..قاطعوا ما يغضب الله حتى يجعل لنا ولكم مخرجا"
archived = "2004-06-17"
capture_url = "https://web.archive.org/web/20040617173740/http://www.20at.com:80/article.php?sid=26"
