[[comments]]
order = 0
subject = "مقال جميل ولكن"
author = "عبدالله مفتاح"
posted = "2006-06-12"
text = "اشك في صحة الخبر اللي بيقول ان الاخوان اللي في المعتقل بيوقظوه بالركل ليصلي الفجر مما دفع المسيحي لان يصلي الفجر خوفا من ركلات الا خوان<br />واسعة شويه"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010130/http://masr.20at.com:80/article.php?sid=506"

[[comments]]
order = 1
subject = "ما إنت كنت بتتكلم كويس ...لا حول ولا قوة إلا بالله"
author = "محمد السيد"
posted = "2006-06-13"
text = "إيه يا عم .... مش كده بالراحة شوية ....<br />أخوان إيه وركل إيه ؟؟؟ وضرب وبتاع ؟؟<br />إيه ده إحنا كنا جوه ومشفناش حاجة من دي خالص ....<br />سيادتك لما تجرب تدخل حاجة زي دي ممكن تحكي لنا عن تجربتك ...لكن الكلام من غير دليل كده ...اسمه دجل ونصب .... وضحك علي الناس اللي مش عارفة والمفروض انها تصدقك علي طول ...<br />خصوصا إني لسة قاري لسيادتك مقال عن الحجاب وحنان ترك ...... منرفزني إلي الآن .....<br />وياعالم يا بتوع ولاد البلد ...... رجاء تراعوا الكتاب اللي بتجبوهم ... مش كل واحد نشر كلمتين تنقلوا مقاله ...<br />لا للتمديد ... لا لتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010130/http://masr.20at.com:80/article.php?sid=506"

[[comments]]
order = 2
subject = "و الله هما احرار"
author = "journalista"
posted = "2006-06-13"
text = "انا شايفة انهم احرار<br />يجبوا الى هما عاوزينه<br />والكاتب نفسه حر يكتب الى هو عاوزه ....واعتقد ان القارئ من غبي<br />ولا عندوش عقل عشان ياخد كل حاجة علي علاتها ...<br />يا جماعة فكرة منع النشر خلاااااااااااص<br />المفروض اننابنتكلم عن الحرية<br />وزى ما قولت جمهورك مش غبي ومش بياخد الحاجات علي علاتها ولو كان غبي وبياخد الحاجات علي علاتها ....يبقي ما يستحقش حتي نسمة حرية"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010130/http://masr.20at.com:80/article.php?sid=506"

