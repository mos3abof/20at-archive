[[comments]]
order = 5
subject = "الحرية يارب"
author = "مقال رااااااااائع فعلاً اعجبني كثير هذا المقال"
posted = "2006-06-17"
text = "بنسبة للكاتب استمر فى كتابتك وبحرية<br />وبنسبة للناس الزعلانة انت لو حاسس ان الكلام دا فى تشكيك فقتنع بيه كل انسان بيكون راي بناء على استيعابة وتأكدة من الفعل الشافو استمررررررررر فى الكتابة بحرية<br />ويارب اكتبلنا الحرية"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222826/http://masr.20at.com:80/article.php?sid=506&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "طيب دي اسمها حرية ولا إيه؟"
author = "محمد السيد"
posted = "2006-06-17"
text = "journalista<br />بصي أنا مش ضد نشر أي رأي أو أي رؤية ....<br />لكن أنا ضد الكذب في نقل الأحداث ... يعني لما أجي أحكي عن حاجة - وحاجة متتحتملش اكثر من وجه زي اللي قالها الكاتب مثلا - وهي محصلتش ميكنش اسمها .... رأي او حرية أو ....<br />ده اسمه كذب .... وكذب صراح .... كمان<br />وأنا مبحبش أتكلم عن نفسي ... لكن الدليل تعليقاتي كلها قبل كده وآرائي كلها مع كده ....<br />وبالنسبة لولاد البلد .... طبعا حرين ينشروا اللي عايزينه ... بس يتأكدوا إن الكلام المكتوب ده حصل أو موجود ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222826/http://masr.20at.com:80/article.php?sid=506&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "في مثال لولاد البلد كنت شايله جوايا من بدري ..."
author = "محمد السيد"
posted = "2006-06-17"
text = "أقولك حاجة ؟؟<br />يوم ما نشروا مقال هل خذل الإخوان القضاة ؟ .... للأستاذ جمال سلطان من موقع المصريون .. وفي ناس وافقت وناس موافقتش ....<br />في واحد أرسل رد لموقع المصريون ونشروه .... وقام واحد علق هنا ونقله لولاد البلد ..هل نشروه في مقال مستقل ؟؟؟<br />تاني يوم نفس الكاتب في نفس المكان ... بعد يوم محاكمة القضاة ... ونزول الإخوان لمساندة القضاة .... الكاتب اعتذر وكتب مقال اعتذار كامل ينفي كل اللي قاله قبل كده .... وبرضه واحد بعثه في تعليق هل اتنشر في مقال مستقل ؟؟<br />علي فكرة أنا مش بأدافع عن الإخوان ...<br />وإن كانت دي مش تهمة ... بس لازم نكون منصفين كلنا ....<br />وبرضه....<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907222826/http://masr.20at.com:80/article.php?sid=506&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
