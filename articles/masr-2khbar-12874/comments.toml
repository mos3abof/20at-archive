author = "يمنى"
posted = "2009-08-09"
text = "نعم، هناك فلسطينيو 48<br />وليس كلهم خونة<br />هناك من يكافح من الداخل لخدمة القضية الفلسطينية (حتى وإن كان بطرق سلمية،أمال إسرائيل عايزة تطردهم ليه)<br />ولكنى لم أسمع عن مصرى يكافح من داخل إسرائيل من أجل القضية الفلسطينية<br />السبب الرئيسي وراء سفركم هو الأسباب الاقتصادية، خاصة أثناء الفترة الحالمة الوردية بعد اتفاق أوسلو فى التسعينات<br />واسمح لى أن اختيار كاديما خطأ استراتيجى، روحوا انتخبوا اليمين أو أنصار السلام العادل فى إسرائيل وهم بالفعل يحتاجون لدعم فى ظل صعود اليمين الإسرائيلى"
archived = "2009-08-11"
capture_url = "https://web.archive.org/web/20090811070936/http://www.20at.com:80/masr/2khbar/12874-2009-08-08-08-10-04.html"
