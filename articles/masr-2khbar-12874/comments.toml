author = "ملعون ابوك"
posted = "2009-08-08"
text = "من هم عرب 48<br />اغلبيتهم من العرب الدروز الذين يجندون فى جيش الدفاع الاسرائيلى كجنود وصف ضباط<br />ولقد حكى الجنود المصريون العائدون من هزيمة 67 ان كل الاذلال والمهانة تلقوة من اؤلئك الجنود الدروز<br />بل انهم قتلوا الكثير والكثير من الجنود المصريين الاسرى وبدم بارد بعد ان امروهم بحفر قبورهم بانفسهم<br />عرب 48 اية يا ابن الكلب<br />كلكم تستحقون الاعدام وسحب الجنسية لانكم كلاب مرتزقة وعندكم بجاحة وسياتى اليوم الذى نحرقكم فية بجاز وسخ لانكم خونة"
archived = "2009-08-09"
capture_url = "https://web.archive.org/web/20090809145935/http://www.20at.com:80/masr/2khbar/12874-2009-08-08-08-10-04.html"

