subject = "يعنى ..... مش بطال !!"
text = "بالنسبه ليك كصحفى ناشئ ولسه بتتعلم تاتا تاتا يعتبر كويس ، شد حيلك وبكره تكبر وتبقى صحفى معقول!!<br />عامه لازم تحاول يمكن ربنا ينفخ فى صورتك .<br />هبه ياسين"
archived = "2004-06-16"
