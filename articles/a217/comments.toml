[[comments]]
order = 3
subject = "اقوال خاطئة"
text = "بالنسبه ليك كصحفى ناشئ ولسه بتتعلم تاتا تاتا يعتبر كويس ، شد حيلك وبكره تكبر وتبقى صحفى معقول!!<br />عامه لازم تحاول يمكن \"\"ربنا ينفخ فى صورتك \"\"<br />مفيش حاجة اسمها ربنا .....فى صورتك اتقى الله فى كلامك واعلم انك محاسب على كل كلمة<br />\" ما يلفظ من قول الا لديه رقيب عتيتد \""
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616071835/http://www.20at.com:80/article.php?sid=217"

[[comments]]
order = 4
subject = "رنين الحب"
text = "بسم الله الرحمن الرحيم<br />استاذ محمد عزام الموضوع مش بطال بالعكس هو محاوله طيبه منك انك تحل مشكله وهى البطاله. بس ماتنساش ان مش كل الشباب معاهم تكاليف هذا المشروع .كل الشباب اللى هايشتغلو هايشتغلو فى المجال ده على كده كل واحد هايبقى عنده سيبره الخاص ومش هايحتاج يروح سايبر تانى وبكده هاتكون الشوارع كلها سيبارات او مقاهى انتر نت . ومش هاناكل ولانشرب ولا نعمل اى حاجه غير اننا نتبادل الاراء ياااااااااافرحتى .<br />اسفه عن التعبير بس كلمه فى بالى استاذ محمد ياريت تقول مشروع كمان عشان بس البلد ما تخربش.<br />وياريت يكونو مشروعين.<br />رنين الحب"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616071835/http://www.20at.com:80/article.php?sid=217"

[[comments]]
order = 5
subject = "كده بكل بساطة"
text = "انت بتكلم مين يا حاج<br />انت بتكلم ناس غلابة معهاش تمن العشا<br />جاى تقوللى مشروع سهل وبسيط<br />حاجة تكلف بالميت اللى مات من زمان اوى ييجى خمسين ستين الف اهيف<br />يا اخى اصحى بقى وشوف انت بتكلم مين"
archived = "2004-08-25"
capture_url = "https://web.archive.org/web/20040825095247/http://www.20at.com:80/article.php?sid=217"

