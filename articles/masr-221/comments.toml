[[comments]]
order = 14
subject = "الضرب في كل اتجاه"
author = "امين حجازي"
posted = "2006-04-25"
text = "شخص واحد فقط هو الذي يضرب في كل اتجاه طبعا عارفينه لقد فقد البقيه الباقيه من عقله هذا النظام المتخلف الذي لم يعد هناك احد من فئات الشعب المصري لم يذق ادوات تعذيبه المستورده من بلاد العم سام وخد عندك<br />الاخوان وهؤلاءهم اصحاب الكوم الاكبر لانه لايري منافسا له غيرهم<br />الناصريون قنديل وداوود<br />الصحفيون وما حدث لهم يعلمه كل العالم<br />الوفديون ويحي القزاز عن اساتذة الجامعات واخيرا وليس اخرا القضاه فهل بقي لديه شيئا يفعله والله ياشعب مصر هانت وفاضل علي الحلو زقه ويرحل يلا زقو معايا"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094331/http://masr.20at.com:80/article.php?sid=221"

