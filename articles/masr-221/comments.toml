[[comments]]
order = 8
subject = "شعر لعمنا احمد فؤاد نجم"
author = "خالد البرماوى"
posted = "2006-04-25"
text = "عليا الحرنكش يا ريس مبارك<br />>>في عصر مزركش ملون بنارك<br />>>لابايعك وأبايع حكومة حمارك<br />>>ملعون أبو اللي يقدر يقاطع قرارك<br />>>نهاره مقندل وليله مبارك<br />>>فهمبك وهجص وطلع في ديننا<br />>>أكيد هو طالع يشاهد جمالك<br />>>جمالك مبارك سوزانك سوزاننا<br />>>يامحلا حصارك لمصر اللي جالنا<br />>>نسيمها في عصرك بيشوي في بدنا<br />>>أؤيد وأبايع فخامة جلالتك<br />>>وأيد أي واحد بيمسح ريالتك<br />>>ولأنك سر باتع هاننسى هبالتك<br />>>فأقعد ياريس ودلل حمامتك<br />>>حمامة السلام حمامتك<br />>>ياريس<br />>>سلامة الحمامة وسلامتك يا ريس<br />>>ياريس حمامة ياريس كويس<br />>>على تل مصر ياريتك تهيص<br />>>خرابة فسيحة عليها تمتيس<br />>>وأأمر تطاع فشعبك مفيص"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094331/http://masr.20at.com:80/article.php?sid=221"

