subject = "هذا يكفي"
author = "موش لازم أسم"
posted = "2006-04-25"
text = "حسنا يقولون أن كل حركة تحتاج إلي شهدائها و أنه توجد لحظة يدرك الجميع معها أن العرض قد أنتهي و أظن أن حادثة ضرب القاضي رمز النظام هذه يمكن أن تكون هي اللحظة المنا سبة إذا أحسن إستغلالها تماما كما فعل الزعيم مصطفي كامل عندما أستغل حادثة دنشواي و نجح في إقالة كرومر و لهذا فإذا أضاعت الحركة المصرية للتغيير هذا الأمر أو جعلته يمر كحادث إعتداء من مختلف حوادث الإعتداء الأخري فإنها تكون قد خسرت كثيرا ببساطة إن هذه الفرصة لن تتكرر لقد حان الوقت للعالم بأجمعه لكي يري حقيقة هذا الديكتاتور و عصابته من مصاصي دماء هذا البلد."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094331/http://masr.20at.com:80/article.php?sid=221"

