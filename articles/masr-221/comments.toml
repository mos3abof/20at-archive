subject = "بصراحة"
author = "محمود محمود"
posted = "2006-04-25"
text = "من حق الشرطة نعمل ما تراه لضباط الامن فى<br />الشارع المصرى خاصتا ونحنوا نوجه الارهاب<br />الغدر ونراه من المصرويون من يسبون بلادهم<br />والقاضى هو اللى اخطا عندما تدخل فى عمل<br />الشرطه واشتباك معه وما حد عرف هو كان عايز يصور ليه ممكن يكون عايز يشوه سمعة مصر"
