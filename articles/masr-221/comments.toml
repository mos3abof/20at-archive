author = "الي البني ادم المتخلف اللي اسمه محمود محمود اللي بيقول من حق الامن يعمل اللي عمله"
posted = "2006-04-28"
text = "لما تعرف ياحمار انت بتتكلم عن ايه ابقي اتكلم انت مصري ياله ولا يهودي ولا ملة امك ايه<br />انت اصلا متابع الموضوع وعارف اعتصام القضاه ليه و لاانت زي الحمار بتكتب وبعدين تسال<br />انت عايش في مصر بتاعتنا ولا عايش في مصر تانيه ومش واخد بالك<br />ياتك القرف انت واللي زيك من الجهله"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094331/http://masr.20at.com:80/article.php?sid=221"

[[comments]]
order = 23
subject = "ده احسن حل"
author = "سمير المصرى"
posted = "2006-04-28"
text = "ساهموا فى خلع مبارك من الحكم<br />رسالة مفتوحة الى حسنى مبارك<br />السيد/ محمد حسنى مبارك<br />بعد التحية<br />نرجو أن تستقيل أنت و حكومتك فورا و أن تتنازل عن الحكم الى لجنة مؤقتة تتألف من رؤساء الأحزاب و بعض الأعضاء المستقلين بمجلس الشعب لحين تعديل الدستور و اجراء انتخابات حرة مفتوحة يختار الشعب من خلالها رئيس الجمهورية و نائبة و رئيس الوزراء و أعضاء الحكومة<br />و أسباب استقالتك هى<br />أولا: انك تفتقر الى الشرعية فلم تجيء الى الحكم من خلال انتخابات حرة مفتوحة كما أن الظروف التى أدت الى تبؤك السلطة فى البلاد مشكوك بها و مثيرة للجدل<br />ثانيا: انك تخطط لحكم البلاد مدى حياتك عن طريق تزوير ارادة الشعب فى الوقت الذى لا توجد فية وسيلة سلمية متاحة للشعب لتغييرك<br />ثالثا: أنك تخطط لأن تورث الحكم الى نجلك جمال مبارك<br />رابعا: انك خدعت الشعب طيلة 21 عاما باخفائك عنة سببك الحقبقى لعدم تعيين نائبا لرئيس الجمهورية و الذى تبين بأنك كنت تخطط و تعدابنك جمال مبارك ليرث الحكم من بعدك<br />خامسا: انك عرضت أمن البلاد و سلامتها للخطر طيلة فترة حكمك بعدم تعيينك لنائبا لرئيس الجمهورية و كان ذلك بسبب مأرب شخصى لك و هو توريث الحكم لنجلك من بعدك<br />سادسا: انك حكمت البلاد باستخدام أبشع اساليب البطش و التنكيل و الارهاب تحت وطأة و نير الأحكام العرفية و قانون الطوارىء و قوانين و قرارات أخرى كبلت بها الحريات و كممت بواستطها الأفواة بمصر دون مبرر صحيح والتى فرضتها على الأمة لتستعيض بها على انعدام شرعية وجودك و انتهكت بمقتضاها حقوق الانسان و نكلت بخصومك و معارضيك أبشع تنكيلا و هى أفعال مؤثمة و خسيسة أدانتها و شجبتها الحكومات و المنظمات الدولية.<br />سابعا: انتشر الفساد فى عهدك بصورة لم يسبق لها مثي<br />اقرأ بقية التعليق .."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094331/http://masr.20at.com:80/article.php?sid=221"

