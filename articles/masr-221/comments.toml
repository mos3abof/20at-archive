subject = "هذه بداية حتمية للنهاية !"
author = "محمد صبري"
posted = "2006-04-28"
text = "وكيف اذن يخرج لنا العظماء وننضم لهم ونحارب بجانبهم ضد نظام غبى اخرق من دون ان يضربون اولا؟؟؟<br />النظام يخلق بنفسه من سيثبت له قريبا ان مكانه الحقيقى والاجدر به هو مزبلة التاريخ ... عالم عفنت ف مناصبها فإن لم يسقطوا بحكم عوامل السياسة والذى منه سقطوا بحكم العامل الزمنى والبيولوجى...<br />وسلملى على تضاريس وش الباشا ورجالته!"
