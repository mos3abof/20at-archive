subject = "احنا اللى عملنا كده فى نفسنا"
author = "حسام"
posted = "2006-04-25"
text = "مع كامل احترامى للجميع احنا اللى فرعنا الفرعون\" فظن اهلها انهم قادرون عليها\" وافتكر انه خلاص هو الحاكم بامره يرمى ده فى السجن يضرب ده يقتل ده يخطف ده مش مشكله ومفيش حد يقدر يحاسبه ولا حتى يشير اليه لو كان مع اول حادثه هتك عرض للصحفيلت وقف الكل وقفه واحده واعترض الكل مانيموش الموضوع ماكانش بقى فيه بلطجه فى الانتخابات وماكانش فيه ضرب للقضاه . عموما انا شايف ان كل ده كويس ده معناه ان النهايه قربت وما ضاقت الا ما فرجت"
