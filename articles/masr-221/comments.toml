text = "في مصر ديما يدعونا للعلم والمدارس وغيرو .........<br />لاكن إحنا مش شيفين إن مصر بتستعمل الإسلوب دة يترا راح فين إسلوب (الدمقراطية) على رأي سي حسني<br />يعني إستعمال مصر للضرب يدل على العفوية والجهل و التخلف ....<br />يعني مصر متخلفة ؟؟؟؟؟؟؟؟؟؟ طبعا<br />يعني مين إل عمل الجرايم في إسكندرية؟؟؟؟<br />مسألتش نفسك (أشك في كدة)<br />يا جهلك يا ...........مصر<br />ربنة يصبرك يا مصر على بلويكي<br />mlake_el7ob2010@hotmail.com"
