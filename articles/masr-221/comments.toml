posted = "2006-04-25"
text = "يا ساكن قصر العروبه مصر بقت مخروبه<br />ابنك وصحابه خلوها منهوبه<br />تحيه الى الشرفاء<br />الى الرجال<br />الى القمم<br />مش هنخاف مش هنطاطى<br />احنا كرهنا الصوت الواطى<br />كلنا معاكم يا شرفاء مصر"
