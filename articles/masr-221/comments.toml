posted = "2006-04-25"
text = "اننى اتحدث من من وجدان قلبى ان هذا القاضى رمز للمصرى الصحيح وانه ابن ناس محترمه واتصرف عليه من حلال وان فى مصر قضاه لا يخشون الا الله فالماذا يتمنى الموت فانه رمزا للحريه والاستقلال فاكمل المشوار واحنا معك يا ابن الحلال"
