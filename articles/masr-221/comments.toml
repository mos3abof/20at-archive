text = "حتى عمده قريتنا بقى نسخه من الحكومه ومثل للظلم والطغيان يستولى اى اى شىء ولا يهمه لانه محمى من الشرطه ويدير قريتنا بالبلطجيه نتحد مع العدل فى اى مكان ارجوكم انقذونا ونحن معكم"
