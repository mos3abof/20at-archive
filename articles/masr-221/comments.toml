subject = "خلوها طلمة"
author = "مصطفى ياسين"
posted = "2006-04-28"
text = "ولعوها دمرها هما الى بيدهم خربوها اية المشكلة اية المسئالة تموت حريق تموت غريق تموت مطقوق ولاعوهالهم اخربوهلهم وبكرة لينا ولا لعيلهم احنا اتعبنا احنا اتنساسينا والقضاة حصن لينا ادى القاضى عسكرى فاضى بى الجزمة ادالو وانت يا شعب ياغلان ناوى تتحرك ولا ح تفضل زى زمان مستنى اية ساكت بعدالقاضى فاضل اية خايف خايف على رغيف العيش خلاص بقة مسوم خايف على ابنك بقة مهضوم خايف على اختك اغتصابوها خايف على شغلك خلاص باعوة اخر كلمة بيع فى المزاد العلنى ابو الهول يا ناس للبيع من7000 سنة شاهد خافة منة يوم يتكلم خلاص ابو الهول يا ناس اتئلم ابو الهول والقاضى اتعلم جاانا اليوم ياناس نتكلم"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094331/http://masr.20at.com:80/article.php?sid=221"

