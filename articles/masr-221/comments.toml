[[comments]]
order = 20
subject = "و يستمر الاعتقال"
author = "جو"
posted = "2006-04-28"
text = "1- الدكتور يحي القزاز أستاذ جامعي/ حركة 9 مارس لاستقلال الجامعات ( أطلق سراحه )<br />2- محمد عبد القدوس الاخوان المسلمون و عضو مجلس إدارة نقابة الصحفيين ( أطلق سراحه)<br />3- كمال خليل القيادي بحركة الاشتراكيين الثوريين<br />4- مالك مصطفى حزب الوسط<br />5-إبراهيم الصحاري صحفي / حركة الاشتراكيين الثوريين<br />6- خالد علي مهندس<br />7- أكرم الإيراني القيادي بحزب العمل<br />8- محمد الدريدري القيادي بحزب العمل<br />9- بهاء صابر شباب من أجل التغيير<br />10- ياسر بدران<br />11- ساهر جاد صحفيون من أجل التغيير<br />12- كريم محمد حزب الغد<br />13- محمد عادل الإخوان المسلمون/ شباب من أجل التغيير<br />14- إسلام حنفي حزب الغد<br />15- سيف عبد الله حركة الكرامة<br />16- محمد فوزي طلبة اليسار الديمقراطي<br />17- محمد عبد الرحمن<br />18 - حسين محمد حزب الغد / شباب من أجل التغيير<br />19 - كريم محمد شباب من أجل التغيير<br />20 - سامح محمد سعيد<br />21- جمال عبد الفتاح<br />22 - سامي دياب<br />23 - حسن من أسيوط<br />و هناك أنباء عن اعتقالات أخري في الإسكندرية و حصار مماثل لنادي القضاة هناك ."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094331/http://masr.20at.com:80/article.php?sid=221"

