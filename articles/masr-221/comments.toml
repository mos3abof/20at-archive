subject = "مبروك يا عريسنا"
author = "فيفي"
posted = "2006-06-05"
text = "مبروك يا عريسنا<br />يا بو شنّه و رنّه<br />يا واخدنا وراثه<br />أطلب و اتمنى<br />أخرج من جنّه<br />أدخل على جنّه<br />مش فارقه معانا<br />و لا هاريه بدنّا<br />و لا تاعبه قلوبنا<br />و لا فاقعه بيضانّا<br />يا عريس الدوله<br />افرح و اتهنى<br />ما حناش كارهينك<br />لكن هارشينك<br />حتكمل دينك<br />و تطلع دينّا"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094331/http://masr.20at.com:80/article.php?sid=221"

