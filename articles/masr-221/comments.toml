[[comments]]
order = 2
subject = "خواطر يائسة"
author = "dodo"
posted = "2006-04-25"
text = "خواطر يائسة<br />مصر خلاها في الأسفلين<br />هو و حكومة غير الراشدين<br />و المسلمين محبوسين<br />و المسيحيين بيقولوا مضطهدين<br />والوظائف للمحسوبين<br />و المنايفة حاكمين<br />والصعايدة منسيين<br />و العمال مطحونين<br />والأمريكان حاشدين<br />والكل عايز يسافر مع المغتربين<br />عشان شايف الأمرين<br />و كل ذي رأي سجين<br />والمصانع مقفولين<br />بأمر حاكم تاجر غبين<br />والأسد محبوس في العرين<br />و مش هايصحى الا بعد سنين وسنين وسنين<br />الشعب أسد دفين<br />لازم يصحى يدافع عن حقه ويكون من الباسلين<br />ولجنة السياسات جالسة في عليين<br />مش راضية تنزل لا تكون من الجائعين<br />نزلها يا أسد الى اسفلين<br />والممثلين فاتنين<br />عاش الملك مات الملك عايشين عايشين<br />لا ليهم رأي ولا ملة إلا المصلحة مع السمين<br />والإعلاميين طبالين<br />بيحطوا السم في العسل وزمارين<br />حتى الشاشة للمحتالين<br />بيروجوا للحاكم ما كلهم كدابين<br />والمدرسين محرومين<br />مع الحكومة الرشيدة بقوا شحاتين<br />والضباط في الحكم محشورين<br />بيدافعوا عن الشر واللعين<br />الشعب بيكره الحاكم حتى الجنين<br />قال في اعلانه (حتى الجنين في بطن أمه يؤيدك )<br />بقى ده كلام راجل رصين<br />زهقتونا بحكمكم ربع قرن وكلكم نصابين<br />وأخرتن<br />اقرأ بقية التعليق .."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623094331/http://masr.20at.com:80/article.php?sid=221"

