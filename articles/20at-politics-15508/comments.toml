text = "ان شاء الله عايزين يوم االاثنين القادم ا صيام جماعى و عند الفطار دعاء موحد للمسجد الأقصى و للمسلمين و لنصرة الاسلام و الانتقام من اليهود.<br />تالت حاجة: ليلة الاثنين بإذن الله \"يعنى االاحد بالليل\" صلاة ركعتين لله فى جوف الليل و الدعاء بردو لنصرة الاسلام و المسلمين و حفظ المسجد الأقصى و مقدسات المسلمين.<br />رابع حاجة: بداية المقاطعة الجماعية للمنتجات الأمريكية و الاسرائيلية لمدة شهر واحد فقط… See More<br />خامس حاجة: عايزين نعمل نشر للخطوات دى عشان يشترك معنا اكبر عدد ممكن من المسلمين.<br />سادس حاجة: عايزين كل دة يتعمل بنية الجهاد فى سبيل الله و نصرة الاسلام و المسلمين و نصرة المسجد الأقصى و عدم خذل الاسلام وهو فى أشد الحاجة لينا و عايزين نخلص النية دى لله سبحانه و تعالى و ندعى بإخلاص و من قلبنا بجد."
