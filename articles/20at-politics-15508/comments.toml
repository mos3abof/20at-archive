posted = "2010-02-28"
text = "فضل كل تصرف هنعمله باذن الله<br />1- صيام يوم واحد وكلنا ندعو قبل الفطار مباشرة لفلسطين ولكل المسلمين ودعوة الصائم لا ترد باذن الله<br />فضل اليوم ده كما قال الرسول صلى الله عليه وسلم<br />(( من صام يوما فى سبيل الله باعد الله وجهه عن النار سبعين خريفا )) يوم واحد بس مش كتير انك تضحى به عشان اعراض بنات بتنتهك واطفال كل يوم بتموت وشيوخ بتتزل وشباب حاسه بالعجز ومعندهاش غير شوية حجارة اودام احدث الاسلحة و الدعوة عند الافطار لا ترد ان شاء الله<br />2- نتفق كلنا على ركعتين فى جوف الليل كلنا نصليهم مع بعض ونقول يااااااارب متقولش وانا مالى لان ده دينك ودينى ودين كل مسلم ومش بطلب منك غير المستطاع ويارب تكون اسرع لكل خير من غيرك<br />3- المقاطعة وده حل رائئئئئئع لانك هتحاربهم فى اقتصادهم وفكر كده انت بتدفع فلوس عشان هما يحارب دينك بتبتقى بتساعدهم ولا لاء ؟؟<br />متقولش مفيش بديل لاء فيه وخلينا بقى نقف وقفة جد ونحترم نفسنا ودينا ونرجع للاصول الى نسيناها"
