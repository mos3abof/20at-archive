[[comments]]
order = 0
subject = "انفلونزا التزوير"
author = "أبو أسامة"
posted = "2006-05-28"
text = "يبدواان الحكومة قد اصابتها انفلونزا التزوير فاصبح التزوير يجرى فى دمها<br />لم تعدتستطيع ان تعيش بدونه لكن بدام مفيش حسيب ولارقيب يديلهم خمس سنين سجن زى ايمن نورولا سنة حتى زى تامر حسنى الونى مش<br />عارف ايه الفرق بين التزورين واحد يخد خمس سنين وواحد ياخد سنةامال الى بيزور على طول المفروض ياخداعدام ويا رب يجي<br />لكل واحدتابع لهذا الحكم وللحكومة انفلونزا الطيور ويريحنا منهم<br />لا...........للتوريث<br />لا...........للتزوير<br />لا...........للأستعباط<br />يارب يغرقوا فى البحر"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218221014/http://masr.20at.com:80/article.php?sid=396&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "الحكومة المرعوبة"
author = "العطار"
posted = "2006-05-28"
text = "اذا كانت حكومتنا السنية مرعوبة لهذة الدرجة من الأخوان حتىوصلت الحالة الى مايشبة الأرتيكاريا (فوبيا الإخوان )فإن الامر على ما اعتقد يحتاج إلى زيارة طبيب أمراض نفسية لعل وعسى ربنا يشفيهم وإلا فما قيمة ان يفوز واحد او إثنين من الإخوان فى الغرفة ربنا يشفى 000"
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218221014/http://masr.20at.com:80/article.php?sid=396&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "الاحتضار"
author = "فاهم"
posted = "2006-05-29"
text = "لا تلومو على النظام فهو الان يحتضر يحتضر وسيكون ذكرى بالنسبة لنا ولكنها ذكرى سيئةوسنتذكرهم بالسوءلقد رايت فى الاسكندرية ما لا استطع ان اوصف جحافل من الداخلية تقدر بالالف جاءو للتزوير ابتسمت وقلت معذرة انهم يحتضرون"
archived = "2006-12-18"
