[[comments]]
order = 0
subject = "موضوع رائع"
author = "معاذ محمود عامر"
posted = "2006-10-05"
text = "الموضوع رائع ومفيد جدا<br />وعندي نصيحة صغيرة لأي حد عايز يعرف معلومات جيدة وشاملة ويكون فهم محكم للسينما عليه أن يحاول تجميع الأعداد التي صدرت من المجلة المتوقفة الفن السابع<br />واذا كان معندوش صبر على كل الأعداد<br />ممكن يقرأ كتاب السينما فن للأستاذ صلاح أبو سيف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131812/http://www.20at.com/article2.php?sid=1312"

[[comments]]
order = 1
subject = "تعليق"
author = "قلم جاف"
posted = "2006-10-07"
text = "أحياناً يكون من الخطأ نشر مقال بتلك الدسامة في جريدة ، فرغم أن الجريدة وسيلة إعلام شعبية تصل للجميع إذا كانت كيومية الشرق الأوسط على سبيل المثال فإن المساحات بالصفحة محدودة ، الأمر الذي يختزل كثيراً من محتوى المقال تحت ضغط التحرير ويسطحه ، كما حدث في مقال سابق في تلك الجريدة عن الكوميديا السوداء وفيلم دكتور ستراينجلوف لستانلي كيوبريك مثالاً.. سطرين وصورة وكان الله بالسر عليماً.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131812/http://www.20at.com/article2.php?sid=1312"
