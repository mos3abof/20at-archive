subject = ""
author = "القسامى المصرى"
posted = "2009-11-10"
text = "بجد انا نفسى اعيش فى العصر الى بحلم بيه والمفروض انه يكون حلم كل واحد فينا العصر الى ننصر فية الاسلام بجد ويبقى القران هو منهج حكمنا الى نحكم بيه عصر يكون اغلبية الناس متعلمه وتقدر تنتج وتطلع وتعمل حاجه لاسلامها العصر الى نكون فيه رافعين فيه رااسنا لفووق منعزة الاسلام العصر الى نكون فيه كلنا خايفين على بعض عايشين فى امن وامان الى لما البنت تمشى فى الشارع ابوها ميخفش عليها العصر الى يكون الى من كتر خيراته يبقى الفقير ماشى فى الشارع مش مادد ايه لحد لانه معاه ومع كل ده حيكون فى العصر ده ناس وحشين بردوا علشان كه ربنا خاق الجنه والنار علشان يبقى فى الصح وفى الغلط انا متيقن الى حيجى يوم ونحقق فيه الكلام ده (نتقابل فى الجنه)"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202215307/http://www.20at.com:80/20at/lifestyle/13887-2009-11-01-14-39-38.html"

