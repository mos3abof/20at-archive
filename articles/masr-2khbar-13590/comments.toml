text = "امريكا ام الديمقراطية<br />فيها نائب رئيس وبيقوم بعمل الرئيس وقت الطوارىء ووقت المرض ويقود البلاد حتى اقرب انتخابات كما حدث عند اغتيال الرئيس الامريكى جون كنيدى<br />تولى النائب للرئيس الحكم فى الحال<br />فى حارتنا المسدودة<br />توجد طابونة يديرها الحاج شلاطة وللحج شلاطة نائب يجلس فى الطابونة لما يكون ابويا الحاج شلاطة بعافية او غارز مع امراة من نسوانة<br />ازاى دولة زى مصر 80 مليون انسان الرئيس مالوش نائب<br />امارة عجمان وامارة ام القيوين تعداد كل امارة 40 الف انسان وكل امير لة نائب<br />احنا مش هبل يا سيد نظيف<br />لا مؤاخذة انت اكبر اهبل وابو طويلة وكلامك يدل على غبائك"
