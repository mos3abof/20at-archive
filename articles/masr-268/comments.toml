order = 0
subject = "هدية الباشا"
author = "بن الكفر"
posted = "2006-05-03"
text = "هدية الباشا عندي انا لو قلولي هاتلة هدية هجبلة الميلة المصرية يتاعة الفراعنة الطوية اللي مدببة من فوق دي ومش عايز حد حدق يقولي هتجبلة المسلة لية طبعا هقولة علشان............. نرجع الاثار اللي هربان برة وندخلها جوة....."
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517235616/http://masr.20at.com:80/article.php?sid=268&PHPSESSID=fb66a5fa9182b3f9089d474ba57ec931"

[[comments]]
order = 1
subject = "و كنت ناسى افكرك"
author = "مجدى اليمانى"
posted = "2006-05-04"
text = "سيدى اهديك وبكل فخر دعوات اهالى العبارة المنكوبه السلام وهالى قطار المت قطار البدرشين لو حد ناسيه واهالى الطيارة التى كانت تحمل ظباط الجيش وصرخات المعقلين وهم تحت سياط زبانيتك والام النساء وهن يغتصبن فى ابو غريب واليك يا سيدى الرئيس اهدى صرخات محمد الدرة وهو فى حضن ابيه ماذا اهديك0000 اهديك لعنات الفقراء ودعوات الارامل والثكالى والايتام000سيدى الرئيس الله يخرب بيت اهلك"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517235616/http://masr.20at.com:80/article.php?sid=268&PHPSESSID=fb66a5fa9182b3f9089d474ba57ec931"

[[comments]]
order = 2
subject = "قنبلة نووية"
author = "مش فاكر"
posted = "2006-05-04"
text = "انا لو وزير الانتاج الحربي اديله قنبلة نووية تفرقع فيه وهومجتمع مع كل الوزراء عدا وزير الاعلام علشان يعرف يذيع الخبر على الناس ويفرحهم"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517235616/http://masr.20at.com:80/article.php?sid=268&PHPSESSID=fb66a5fa9182b3f9089d474ba57ec931"

[[comments]]
order = 3
subject = "هدية حبيب قلبي"
author = "اسلام"
posted = "2006-05-04"
text = "طبعا مافيش قبل الهدية حاجة احسن من الدعاء ان ربنا ينور بيته وبيت اهله بحريقة على راى المسرحية اللى مش فاكر اسمها<br />نيجي للهدية<br />ها احجزله على حسابي فى افخم دار مسنين فى مصر كلها وطبعا مش ها انسى اقدمله مع الهدية حاجة يستلى بيها<br />راديو علشان يسمع ها يجرى ايه فى البلد بعد ما يغور سعادته<br />وبلاي استيشن عليه لعبة مبرمجه ليه خصيصا وهي حكم الشعب المصري علشان ما يحسش بفراغ"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517235616/http://masr.20at.com:80/article.php?sid=268&PHPSESSID=fb66a5fa9182b3f9089d474ba57ec931"

[[comments]]
order = 4
subject = "مصر ام الحراميه"
author = "المواطن المطحون"
posted = "2006-05-04"
text = "و الله انا مش عارف اديله ايه بس احسن هديه نبيع له مصر و ندهالوا او انديله حقه ناشف و انا احب اهدى للريس اغنيه ... \"يا تعابنى \" بتقول ايه مفيش اغنيه اسمها كده يا عم طنش اشمعنا دى اللى مش هطنش عليها"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517235616/http://masr.20at.com:80/article.php?sid=268&PHPSESSID=fb66a5fa9182b3f9089d474ba57ec931"

[[comments]]
order = 5
subject = "زهقناااااااااااا"
author = "طبعا اهديله تورتة مليانه بالسم بس يكون سم بيموت بالبطئ لحد مايشوف المسلمين وانتصارهم ويموت بحسرته هو واللي حوليه لانهم ماعملوش حاجه غير انهم باعونا وقاتلونا وشردونا ونجحوا فعلا فاننا ندعيلهم باللعنه والعذاب ان شاء الله في جهنم مع فرعون كده لو ماتابش ورجع عن اللي هو بيعمله"
posted = "2006-05-04"
text = "وطبعا ماننساش وثيقه التنصير اللي وقع عليها الطنطاوي وكمان ودعوات وزرائه راس تتطاطي والقلوب تلعنه"
archived = "2006-05-17"
