author = "علمنى الهيافة"
posted = "2009-12-01"
text = "والنبى مش دة محافظ تافة ومخة فاضى وابيض يا ورد<br />بقى هى مشاكل المحافظة كلها خلصت والناس عايشة فى تبات ونبات وبيخلفوا صبيان وبنات وبقى بس اسم قرية بيحرقة وعايز يغيرة من شهادات الميلاد الناس ووثائق امتلاك البيوت والعقارات والاراضى ووثائق الدولة<br />يعنى واحد مولود فى قرية مبارك المصريين وهو الاسم الجديد بتاعة وابوة مولود فى قرية الجزائر<br />انا مش عارف بيفكروا ازاى<br />طيب ما فية بلد اسمها زفتى<br />هل بتوع زفتى يقدروا يغيروا اسمها الى كلونيا الشبراويشى مثلا<br />والا دة اسم داخل فى كل الوثائق والشهادات وحجج الارض<br />بطلوا مسخرة بقى<br />ونفترض ان مصر والجزائر اتصالحوا بعد شهرين نقوم نرجعها تانى باسم الجزائر"
archived = "2009-12-04"
capture_url = "https://web.archive.org/web/20091204025519/http://www.20at.com:80/masr/news/14196-2009-12-01-08-41-54.html"

