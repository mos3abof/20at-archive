posted = "2009-12-01"
text = "الفضيحة بتاع عائشة عبد الهادى وزيرة العمل وهى تقبل يد الست سوزان فى قاعة ختام مؤتمر الوطنى<br />وادى محافظ تانى بيقرع وهيغير اسم قرية علشان يرضى علاء وجمال مبارك<br />وكلة بيقرع علشان كانت طلعت اشاعة تغيير وزارى وتغيير محافظين"
archived = "2009-12-04"
capture_url = "https://web.archive.org/web/20091204025519/http://www.20at.com:80/masr/news/14196-2009-12-01-08-41-54.html"
