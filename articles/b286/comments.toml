[[comments]]
order = 1
subject = "ابقوا قابلونى"
author = "BATISTUTA"
posted = "2006-01-19"
text = "يا ايها الشعب المصرى البائس الذى يهرب من الفقر والظلم وقهر الحياة ليجد متنفسه فى الكورة ابقوا قابلونى لو المنتخب فلح وصعد للدور التانى حتى صدقوا او لا تصدقوا هى دى الحقيقة وانشاء الله هتعرفوا الحقيقة المرة فى مبارة مصر وساحل العاج"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112542/http://www.20at.com/article2.php?sid=286"

[[comments]]
order = 2
subject = "فوز مصر بالبطوله هيبقى من عجائب الدنيا مع الأهرامات و ابو الهول"
author = "خالد مصطفى على"
posted = "2006-01-19"
text = "انااتوقع فوز واحده من الدول التاليه:<br />تونس,الكاميرون,ساحل العاج,نيجيريا<br />اما بالنسبه لمصرفلا حول لهل ولا قوه,فصعودها من المجموعه الأولى الحديديه يعتبر انجازا بحد ذاته,اما الفوز بالبطوله,فلنا هنا وقفه ولنكن صرحاء مع أنفسنا,فانها صعبه ,بل أشبه بالمشتحيل(احنا محتاجين جيمس بوند معانا عشان ناخد البطوله)...و هذا راي المتواضعزز"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112542/http://www.20at.com/article2.php?sid=286"

[[comments]]
order = 3
subject = "\"يبقى انت اكيد في مصر\""
author = "مصــegyـــري"
posted = "2006-01-19"
text = "قال ايه<br />وانا رايح الكلية في امان الله عشان امتحن<br />وراكب المكروباص<br />الاقي لجنة بتوقفه و الامين بيقول ( معلش يا جماعة .. هناخد من وقتكم 5 دقايق )<br />و ابص الاقي عسكري عنده انيميا<br />ماسك فرشة و دهان اسود و بيلون الأرقام البهتانة اللي على اللوحة بتاعت المكروباص<br />قام السواق سأله ( دي اجراءات اية النضيفة دي )<br />قام الامين رد عليه .. ( عقبال املتك عشان منظرنا مايبقاش وحش قدام الاجانب في الكاس )<br />و بالفعل .. الراجل ده قال الخلاصة<br />احنا الدورة دي مش عايزين منها غير منظرناكمنظمين قدام الاجانب , حتى ولو كانوا جايين من مجاهل افريقيا<br />برضو نفس الحاجة تلاقيها في المراكز الصحفية اللي اتعملت على سنجة عشرة عشان (منظرنا قدام الصحفيين الاجانب ) على رأي اسمه اية بتاع وزارة الاعلام<br />لكن نكسب فيها .... معتقدش!<br />اخيرا كان في واحد صاحبي واقف معايا قدام لجنة الفرز في الجامعة العمالية في مدينة نصراثناء فرز المرحلة الاولى<br />و بعد اعلان فوز السلاب تاجر الحشيش بتاع الوطني قال<br />( احنا لسالنا 20 سنة على مانبقى.. حمير)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112542/http://www.20at.com/article2.php?sid=286"

[[comments]]
order = 4
subject = "؟؟؟؟"
author = "المغربى"
posted = "2006-01-20"
text = "يااللة على ها الانتماء الرائع لبلادكن يالمصريين ؟؟؟ ههههههه<br />كيف تقولو هكذا ؟<br />كنت منتظر هذا الحديث من مغربى متلى او تونسى او غيرهن لكن منكن ؟؟؟؟<br />علاش ؟<br />علاش ها السلبية علاش ؟<br />وقبل النهاية بنحذركن ان المغرب بتكسب على مصر وتوقع بها هزيمة ساحقو<br />فنحنا قاادمون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112542/http://www.20at.com/article2.php?sid=286"

