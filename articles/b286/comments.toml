subject = "الا مصر فعلاً"
author = "منى سليم"
posted = "2006-01-19"
text = "لأن لكل جماعة ميزتها، فقد وصلت الى سر مجمتع السع آلاف سنة ، فهو يهوى دائماً الفرجة والتهليل فقط اما الافعال والانجازان فلا تندرج فى قاءمة تفضيلاته"
archived = "2006-11-02"
