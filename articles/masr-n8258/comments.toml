[[comments]]
order = 40
subject = "اعتذار باب ا الفاتيكان"
author = "ابراهيم حمدى"
posted = "2006-09-19"
text = "هل كما يقولون أن إعتذار بابا الفاتيكان كافياً ؟؟<br />سؤال به شيء من الحيرة ولغز شديد .<br />فكيف يعتذر عن شئ مقصود ومتعمد ؟ وكيف نكتفى بهذا الاعتذار فقد تساهلنا من قبل في إساءة الصحف الدنماركية للرسول الكريم- صلى الله عليه وسلم-ثم يأتوا ثانيةبإساءة الاسلام ونأتى نحن ثانيه بل والمره المئه ونكتفى بإعتذار هل هذا كافى؟<br />ونحن نعرف جيداًأنها مقصوده والدليل على<br />كلامى انا البابا كلامه مكتوب وليس حاضرا من ذهنه وانه خطاب ومراجع اكثر من مرة.<br />وارى انه يجب تدخل شديد من رؤوساء الحكومات العربيه الاسلاميه لوقف مثل هذه الاهانات."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062448/http://masr.20at.com:80/article.php?sid=320"

