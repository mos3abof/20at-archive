[[comments]]
order = 43
subject = "نداء لشرفاء الوطن"
author = "سعيد غريب سليمان"
posted = "2006-10-03"
text = "أرسل هذا التعليق بواسطة : ابو اسلام<br />:انا مواطن عمرى 47 عام طول عمرى اسافر واقدح حتى ابنى مستقبل لااولادى بنيت منزل مكون من اربع طوابق وكنت اعيش انا واولادى فى المنزل فى الوراق وجاء المدعو حمدى عبد العزيز عامرواخوتة ببناء ثلاث ابراج سكنية بدون عمل خوازيق ولا دراسة ولا جسات للارض بارتفاع ثلاث عشر طابق مخالفين لكل قوانين البناء بناء على تقرير مركز البحوث والتفتيش على اعمال البناء من سنة 2001 وانا اقدم شكاوى لجميع المسئولينفى البلد اكثر من 200 شكوى وتلغرافات لرئيس الجمهورية حتى اصغر موظف فى محافظة الجيزة وقابلت محافظ الجيزة السابق المستشار محمود ابو الليل واصد قرارات ولاكن بدون تنفيذ ولا يوجد متابعة لتنفيذ القرارات وتم تحرير عدة محاضر ولا فائدة ويتم التحايل على القوانين وارسلت للرقابة الادارية مشكورة قامت بالمعاينة وتم ارسال القضية للنيابة العامة فى سنة 2003 وارسلت للنيابة الادارية وعملت قضية وارسلت للنيابة العامة بخصوص المسئولين فى مجلس مدينة الوراق وتم اخذ اقوالى فى النيابة منذ ثلاث سنوات والاى الان لم يتم عمل اى شيء لاان بناء هذة الابراج مخالفة تسببت فى اضرار جسيمة فى عشرة منازل ومنهم منزلى كثر فى الكمرات وشروخ نافذة فى الحوائط والعمدان وهبوط فى الارضية فى الاربع طوابق كل ذالك تم بالرشاوى داخل مجلس مدينة الوراق اصحاب الابراج معهم محامين يتحايلون على القوانين ويساعدوهم فى ذالك بتوع مجلس المدينة والى الان لم يتم التوصل لنتيجة وتركت منزلى خوفا من الانهيار على اولادى واسكن فى سكن قريب من المنزل واصحاب الابراج يعملو على محاربتى فى عمل محاضر كيدية لكى اكف عن الشكاوى واخرها هم واقارب لهم اتفقو مع جزار يتعامل معهم محلة امام العقار الذى اقيم بةقا م بالتعدى علية بالضرب هو وابية واخية<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062448/http://masr.20at.com:80/article.php?sid=320"

