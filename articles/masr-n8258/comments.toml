[[comments]]
order = 88
subject = "افيقو ياحزاب مصر وماذا عملتم لبلدكم الا العار والفضائح على الجرائد"
author = "دالى55"
posted = "2007-02-16"
text = "رد على الضمير الحى<br />من هم الامناء وما هى مواصفاتهم ومن اين نجدهم ومن يصعدهم اعلم يا اخى انه لا يمكن اى انسان امين يصل الى السلطه ولن يصل الييها الا المنافقين والغشاشين والحراميه والحشاشين هم دول بتوع السلطه واولهم الاحزاب النكبه الكبرى للبلدهم الفساد والمفسديين لنا الله وربنا يطول فى عمر زعيمنا حسنى مبارك"
archived = "2007-02-20"
capture_url = "https://web.archive.org/web/20070220173513/http://masr.20at.com:80/article.php?sid=320"

[[comments]]
order = 89
subject = "بعد فضيحة عمال الكويت أخرى بالرياض (انقذوا كرامة المصريين)"
author = "مائة سائق مصري يأكلون الفضلات بالرياض"
posted = "2007-02-17"
text = "مائة سائق مصري أو أكثر ينتظرون فضلات وبقايا الطعام بالرياض بالمملكة السعودية ، والموضوع انهم تعاقدوا بمكاتب تشغيل العمالة بالخارج مقابل ثمانية آلاف جنية ليعملوا لدى شركة النقليات الشهيرة بالرياض والمسماه (البسامي) مقابل ثلاثة آلاف ريال وحينما ذهبوا لم يجدوا عمل ، وأًخبروا أن هناك سيارات مستوردة في الجمارك سوف يعملون عليها ، وبعد طول انتظار فاجأهم مسئول الشركة بأنه من يريد العمل سوف نستبدل عقده بعقد آخر يكون راتبه فيه ألف ريال فقط ، فرفضوا وطلبوا الرحيل الى مصر ، حينها طالبهم مسؤل الشركة بدفع ثمن التأشيرة ورسوم الاقامة ورسوم استخراج رخصة القيادة أي ما يعادل أكثر من خمسة آلاف ريال ، وبعد أربعة أشهر قضوها في المفاوضات لم يجدوا حلاًَُّّّ هرب عدد أربعة منهم الى مصر بدون جوازات سفر وذهب الباقون لمكتب العمل ثم الامارة ( امارة الرياض ) دون جدوى في تلك الأثناء تصادف وجود وزيرة العمل والهجرة المصرية بالمملكة وعقدت لقاء بالجالية المصرية في السفارة المصرية بالرياض ، وقام أحد السائقين يشتكي اليها ويطلب التدخل فوعدتهم الوزيرة بحل مشكلتهم في خلال 48 ساعة ومرت اسابيع ولا بارقة أمل والآن بعد ما يقرب من ستة أشهر ترى من أين يأكلون هؤلاء ؟ وأين يعيشون ؟ انهم ينتظرون أمام قصور الأفراح هناك ليحصلوا على بقايا وفضلات طعام المدعوين لتناول العشاء ، هل هذه هي الكرامة المصرية بعد أن علمت الوزيرة بمأساتهم ولم تحرك ساكنا.<br />ان من بين أبناء هؤلاء من ترك التعليم وخرجوا الى الشوارع والباقي يعلمه الجميع ماذا يفعلون أطفال الشوارع ، وكيف تعيش نساؤهم في مصر بدون أي مورد للدخل ؟ هل من غيور على ما تبقى لنا من كرامة ."
archived = "2007-02-20"
capture_url = "https://web.archive.org/web/20070220173513/http://masr.20at.com:80/article.php?sid=320"

