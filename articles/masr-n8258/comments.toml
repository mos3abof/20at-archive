author = "مــــــــــ مطحون ـــــواطن جدااااااا"
posted = "2006-07-18"
text = "اولاًً لا اخفي شعوري بالاستفزاز كلم سمعت او قرأت عن مهازل يقوم بها المسئولويين في مصر لكن وللأسف الشديد ورغم شعوري بهذا الاستفزاز الا انني اختنق واكأد اجن ممايطلقون علي انفسهم دعاة الحرية الذين يقضون كل اوقاتهم في السب واللعن في الحكومة والمسئولويين وبالتالي اصحبنا كــ مواطنين مطحونين لا نجد امامنا سبيل الا التعجب والاستغراب مما يحدث .. فريق يخطئ وفريق يشتم والنهاية لا جديد .. امنيتي ان اري صحافة حرة ولكن مهذبة فانا دائما ما اري انني اذا كنت اري في نفسي الصلاح والافضلية فعلية اثبات ذلك بالعمل الصالح والقول المهذب .. لا انكر ان مصر بها مشاكل كثيرة مفقود الأمل في حلها لكن ماذا تفعل الشتائم والسب واللعن في اذان لم تعد تسمع المشكلة يا سادة ان الفساد الذي طال مصر لم يستثني الصحافة الحزبية منها والمستقلة قبل القومية .. اقول ذلك وانا قريب جدا من الوسط الصحفي الذي اصبح مبتذل واصبح البحث عن الشهرة والمجد هو الطريق الذي يبحث عنه 99% من صحفي مصر فريق اخذ طريق لعق احذية المسئوليين علي شاكلة غالبية المحظيين بالجرائد القومية وفريق اخر لم يجد له طريق الا الهجوم والسب واللعن كـأحد اصعب الطرق للوصول للشهرة والمجد وهو ما ينطبق علي 9\"99% من الصحف المستقلة والحزبية كلامي عن تجربة واقعية ومريرة مع اغلب هذه الصحف التي تمارس دأيمقراطية جديدة أسميها ديمقراطية الوصول للهدف التي تعمد علي شكل خارجي للعامة يظهر عكس ما يبطن وإليكم نموذج صارخ يحدث مثلا في جريدة الفجر التي يرأس تحريرها صحفي مهني عالي المستوي بمقايس المهنة يعد من ابرز الكتاب الذين يملكون حرفيه شديدة في الكتابة ولكن استاذي الفاضل عادل حموده عنده الدأيمقرطية خارج كيان الجرنال بمعني اكتب وقول زي ما أنت عايز بشرط تكتب في اطار سياسة الجرنال ه<br />اقرأ بقية التعليق .."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124600/http://masr.20at.com:80/article.php?sid=320"

