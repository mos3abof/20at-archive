[[comments]]
order = 85
subject = "من هم الامناء عليكى يابلدى"
author = "غزال2"
posted = "2007-02-15"
text = "هل الاحزاب التى لم اعرف عددهاهى اللى هاتبنى مصر لايوجد حزب واحد يعرف يبنى مصر كل الكلام على جمال مبارك حماه الله واعطى له الصحه والعافيه ليكون زعيم لبلدى بعد الهرم الاكبر سعادة رئيس الجمهوريه القائد اللزى اعطى مصر كل الكرامه والعزه فى حرب 73 وخرج بمصر سالما من حرب الخليج واعطى الامان لكل شاب وليس للاحزاب الا المعارضه وبدون وجه حق واتحدى ان اى حزبى ليس وراءه الا شويه حشاشين وحراميه لكى يحموه بارك الله فىيك يامبارك واعطى لك الصحه والعافيه ووفق جمال مبارك بالنجاح والتوفيق علما باننى لم انتسب الى اى حزب ولا ارغب بذلك للاننى تعاملت معاهم وهم لا يحبون مصر بل يرغبون فى خابها من النقد الكذاب والاقاويل الكاذبه بارك الله فيك يامبارك واعطى الله لك العمر المديد مواطن مصرى يخاف على بلده من الفساد والمفسديين من ارباب الاحزاب المشبوه مواطن مصرى مقيم بالسعوديه"
archived = "2007-02-20"
capture_url = "https://web.archive.org/web/20070220173513/http://masr.20at.com:80/article.php?sid=320"

[[comments]]
order = 86
subject = "يحميكى يابلدى"
author = "دالى55"
posted = "2007-02-15"
text = "كل الصحف والمجلات يهاجمون جمال مبارك ويدعون انهم وطنييون اين الوطنيه هل جمال مبارك هو اللى جعل النواب يسرقون البنوك ويسرقون اموال الامه هل مبارك هو اللى يخلو النواب يتلاعبون بمصير الشعب من النهب والسلب والاختلاسات يا احزاب مصر افيقو وخلو كلمتكم واحدة امام الفساد جمال واحد منكم وطنى ويحب بلده وصادق وليس له هدف الا الخروج بمص الى بر الامان ملايين الجنيهات تضيع على الصحف فى مهاجمة جمال مبارك الله يرحم كلا الاحزاب الغرضه التى تضيع وقتها ومالها فى النقد غير البناء مواطن يخاف على بلده منكم مقيم بكندا"
archived = "2007-02-20"
capture_url = "https://web.archive.org/web/20070220173513/http://masr.20at.com:80/article.php?sid=320"

