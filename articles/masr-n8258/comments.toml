text = "ليه نفترى على الناس ونشتمها ونكثر حسنتها ما تيجى ندعيله عشان ربنا يخليه ويخلى الاسره الكريمه الى هتحكم مصر 50 سنه جايه تعالوا معايا بصوت ماحد نقول اللهم اديله على قد نيته الى بهدلنا ومخلينا قاعدين على الارصفه ومش لقين القمه الناشفه ناكلها الهم اديله طحينه الهم اطحن الرئيس وكتر من سلطاته الهم اديله جرجير وجرجره على وشه الهم خرطه للشعب ( عمال يقول انا مع محدودى الدخل طب الشباب الى مش لقيه شغل دول من اى صنف محدود يا ريس والا عديم الدخل ) ربنا يخليك ويخلى العائله الكريمه ومبارك لمصر عليك يا مصر ) عيد مبارك وجمال وكمال وكله سرور وعز وسوزان ولو فى حد ناسيه ابقى كمله انتم<br />مع تحيات مواطن غير شريف خمورجى صايع مش لاقى شغل ولو لقيت شوال بانجو او حشيش هبيعه واكسب فيه وابقى مليونير ذى انكل عز حبيبى الى جاب 40 مليار جنيه فى ست سنين امال العائله المحترمه معاها كام ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ ههههههههههههههههههههههههههههههههههههههههههه عالم مجنوننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننننون يا نعيمه"
