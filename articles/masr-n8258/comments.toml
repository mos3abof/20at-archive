author = "مصطفى احمد مختار"
posted = "2007-02-03"
text = "التحكيم فى مصر هو مشكلة المباريات امس فى لقاء الاوليمبى والزمالك واحتسبت دربة الجزاء للزمالك با الخطا من الحكم المساعد الرجاء الرد على هذا الموضوع من المسؤلين وشكرا لمنت يرسل الموضوع والسلام عليكم ورحمة الله وبركاتة"
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044006/http://masr.20at.com:80/article.php?sid=320"

