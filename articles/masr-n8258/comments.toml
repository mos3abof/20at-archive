text = "السلام عليكم حينما يحتسب الحكام ضربه جزاءخاطاءه للزمالك تقف الدنيا ولا تقعدوعندما يحتسب ضربات جزاء للاهلى يؤيدون الحكام كانه فريق اسرائيلى فلما؟"
