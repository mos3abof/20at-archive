[[comments]]
order = 31
subject = "ارحم المرضة ياوزيرالصحة"
author = "خالد"
posted = "2006-08-06"
text = "الى سيدى الفاضل انى ابعث بهذة الرسالة من كثر العبى على المواطن المصرى والاخص المريض المحروم من العلاج لانة ليس معة مال يمكن ان يعالج نفسة بية او يذهب الى الطبيب فى عيادة خاصة وهذة الماساة التى تتكرر فى هذة الايام كثيرا وخصوصا فى محافظة المنوفية ومركز منوف بعد ما صدر القرار فى جميع المستشفيات الحكومية بانها تكون استسمارية واتفاع ثمن التدكرة الى ثلاث اضعاف والعلاج اصبح على حساب المريض من الخارج واذا تم حجز المريض داخل المستشفى يقوم المريض بدفع 50 جنيها واذا قام بجراء عملية يدفع نصف ثمن العملية وطبعا العلاج على حساب المريض واما ادراك ما هو العلاج وكم تكلفة العلاج وخصوصا بعد اتفاع اسعار العلاج فى السماء من اين يدفع المريض كل هذا ؟؟؟؟؟؟؟؟؟؟ وهذا بجوار المعيشة واسعارها المرتفعة كل يوم ومن المسئول فى اتفاع الاسعار بهذا الشكل المخيف ؟؟؟؟؟؟؟؟؟ انى اوجة هذة الرسالة الى المسئول الاول وهو وزير الصحة ارحم المرضة يرحمك اللة من الاسعار فى المستشفيات الحكومية واسعار العلاج حتى يتمكن المواطن المصرى من دفع ثمن العلاج وان يعيش فى بلدة وهو يعلم ان المسئول يعمل على توفير الراحة لة وليس العناء اين كلام رئيس الجمهورية وهو انى اعمل لتوفير المعيشة للمواطن المصرى الكادح ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟ واقول لكم كل شىء يزيد الا اثنان هما رغيف العيش والعلاج وقد ترتتب على ارتفاع اسعار المستشفيات الحكومية ان الاطباء رفعوا اسعار الفيزيدة الى الدبل واخر كلامى انى مواطن مصرى ومن حقى على الحكومة توفير العلاج مجانا الى وهذا شعارى كتبها لكم وكلى امل فى نشر هذة الرسالة حتى يترا<br />اقرأ بقية التعليق .."
archived = "2006-09-02"
capture_url = "https://web.archive.org/web/20060902113726/http://masr.20at.com:80/article.php?sid=320"

