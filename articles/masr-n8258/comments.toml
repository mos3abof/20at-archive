subject = "يا جماعة هي معارضة و خلاص"
author = "marowlogy"
posted = "2006-11-12"
text = "بصراحة أنا مش مصدق كل الجرايد دي سواء المعارضة ( الدستور - الفجر- صوت الأمة - الأسبوع ) أو اللقومية ( أخبار - أهرام - جمهورية ) ، ليه بقى ؟؟؟؟؟؟؟؟؟؟؟ لأن كل جريدة منهم بتكتب اللي تمليه عليها اتجهاتها، دون حياد ، يعني مثلاً تلاقي المعارضة ( شتيمة على طول الخط ) والقومية ( انجازات على طول الخط ) لذا فما أفعله هو الاستمتاع بمشاهدة و قراءة الأعلام الغربي المحترم ( خاصة الـ bbc , cnn , وغيره من وسائل الاعلام المحترمة و المحايدة و بالنسبة للجرائد المصرية فلا أحترم سوى جريدة واحدة وهي ( المصري اليوم ) و عليه العوض في الباقي<br />و يجعله عامر"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117205244/http://masr.20at.com:80/article.php?sid=320&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

