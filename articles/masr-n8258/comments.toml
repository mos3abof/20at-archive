subject = "الاخوان والنظام الاثنيين مجرمون"
author = "بحب مصر"
posted = "2007-02-02"
text = "اخوانى المصريين اريدكم تفكرون بعقلكم وليس عقل غيركم من اصحاب الشعارات الدينية و غيرها الكاذبة هل تعرفون ان حكام مصر السابقين امثال عبد الناصر والسادات ومبارك من الاخوان المجرمون واساليبهم فى الحكمهى اساليب الاخوان وليس بجديد ان الذى يمسك منهم السلطة لابد وان ينقلب على جماعته المجرمة صاحبت الفكر الذى لايرضى عليها رسول الله صلى الله عليه وسلم الذين يقدسون المجرم صاحب الملذات حسن البنا او حسن زعبولة الذى قضى حياتة بالطول والعرض فى اوروباواخوه حسين البنا صاحب فتوة التدخين فى الشهر الكريم ما افظع الفكر فنعم لى كلنا مسلمون وليس اخوان مجرمون الله اكبر ولله الحمد الاسلام دين عقل وفكر ومحبة الاخرين وسلام للعالم وفرجاء من كل مسلم ان يفكر فى فكر كل جماعة تضحك على العالم"
archived = "2007-02-05"
capture_url = "https://web.archive.org/web/20070205044006/http://masr.20at.com:80/article.php?sid=320"

