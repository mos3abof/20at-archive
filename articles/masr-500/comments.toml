[[comments]]
order = 0
subject = "ازمة بلد"
author = "سارة"
posted = "2007-01-04"
text = "دة بقى حال البلد تدنى الاوضاع والاخلاقيات ورسم دستور على مذاج الريس وابنة بس العيب مش فيى النظام العيب فى سكوتنا المستمر واهو الحال كل ما حد يكلم عاوزين يسجنوة ولكن اللة هو المخلص واللة هو الناصر على القوم الظالمين وحسبنا اللة ونعم الوكيل"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042457/http://masr.20at.com:80/article.php?sid=500"

[[comments]]
order = 1
subject = "لا تستسلم الى الضغوط سير على بركة الله"
author = "خالد احمد محمود"
posted = "2007-01-14"
text = "بسم الله الرحم الرحيم<br />ان شائف انك صحفى بتقول الحق فى كل حاجة ومش بتخاف غير من ربنا وانا عايزك تسير على هذا الننهج على طول وربنا معاك ومتخافش خالص ان اجرك عند ربناكبير واستمر فى المسيرة والافراج ان شاء الله من نصيب متعملش زاى ناس كتير بدات فى الحق وتنزلت عنه علشان مناصب او علشان ترقيات زاى ناس كتير ان شائفها اتنزلت مثل عمرو خالد ومحمود سعد ومصطفى بكرى بس انت ان شاء الله هتكون احسن منهم ويارب كل ولاد البد يكونوا زيك والسلام امانة"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042457/http://masr.20at.com:80/article.php?sid=500"
