subject = "شعب مصر مع وائل الابراشى"
author = "ابو اسلام الغد"
posted = "2006-07-21"
text = "اتمنا من الشعب المصرى الوقوف مع وائل الابراشى ومن معة من الشرفاء لاانهم هم صوت الشعب والامة وهم من يدافعون عن الشعب والمواطن الغلبانومحاربة الفساد الذى اصبح سرطان داخل مصرنا الحبيبة والتاريخ لايرحم كل شريف فى البلد او الامة من هو شريف ومن هو فاسد متخاذل اتمنا من الشعب يوم الجلسة يكون بجانبهم حتى لايتم القضاء عليهم مثل شرفاء اخريين مثل ماوقف الشعب مع القضاة الشرفاء"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023212/http://masr.20at.com:80/article.php?sid=500&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
