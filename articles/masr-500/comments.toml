[[comments]]
order = 6
subject = "تحياتى لكل الشرفاء"
author = "ياسر ابو سمية"
posted = "2006-06-11"
text = "تحياتى لجميع الشرفاء فى بلدنا العزيزة ،تحياتى للمناضلين من اجل استرداد الكرامة ،واتذكر قول الشاعر\" وللحرية الحمراء باب بكل يد مضرجة يدق \"<br />لا تنسوا اعزائى 600 معتقل للاخوان وكفاية فى المعتقلات حتى اليوم منذ احداث القضاة ،لا تنسوا العريان ومرسى ورشاد البيومى وعمر عبد الله وابراهيم الزعفرانى وكمال وحلمى الجزار وكمال خليل وغيرهم من مخلصى هذا الوطن ومحبيه الذين تتشرف بهم السجون خلف قضبانها ،لكننا نفضل ان نتشرف نحن بهم بين احضاننا .<br />كما الفت نظر الجميع الى ان الابراشى ليس المتهم الوحيد فى قضية القوائم السوداء بل معه زميلى الحبيب عبد الحكيم الشامى \"مدير تحرير افاق عربية \"والذى يعرفه الجميع بوطنيته الجارفة وابتسامته التى لم تغب عنه حتى فى احلك المواقف ،بالاضافة الى عضو مجلس نقابة المحامين النشط جمال تاج الدين ،والصحفية هدى ابو بكر ،اتمنى ان تدافعوا عن الجميع والا تقتصر المسالة على شخص الابراشى _مع احترامى الشديد له_وعاشت مصر خالية من اسلحة الارهاب الحكومى الشامل ."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025249/http://masr.20at.com:80/article.php?sid=500"

[[comments]]
order = 7
subject = "الصحافه المستقلة"
author = "بسمه"
posted = "2006-06-12"
text = "الصحفي وائل البراشي واحد من اصحاب الاقلام المستقلة التي تكشف الحقيقه اوبعض منها من خلال جو صحفي عام مسيطر عليه النفاق والموالسه والتضليل وتغييب الوعي وتحقيق سر الطبخه في الاعلام وهو سر البقاء والالتصاق بكرسي السلطه اى كان الوسيله والطريقه والنتيجه والخروج عن الهدف الاساسي لمهنه الصحافه وهو كشف الحقيقه للمواطن وليس ان تكون مخبرا او مبرراتي لاصحاب الكراسي وهذا لا يعجب المسئؤل لذلك اسهل وسيله عند الجماعه اياهم هو محاربه شرفاء الكلمه وتلفيق التهم لهم واغلاق صحفهم كما حدث مع ابراهيم عيسي والصحفي وائل الابراشي يقدم افضل برنامج في التلفزيون وهذا يقلقهم لان كل هدفهم ان نصبح قطيع صامت خائف كل همه العلاوه يا ريس يجب علي نقابه الصحفيين ان تدافع عن كل الصحفيين الشرفاء و تبتعد عن اسلوب الحسابات الذى يثبت فشله كل يوم والمثل بيقول الي متغطي بالحكومه عريان"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025249/http://masr.20at.com:80/article.php?sid=500"

[[comments]]
order = 8
subject = "سيناريو التوريث"
author = "محمد المصرى"
posted = "2006-06-12"
text = "اسمحو لى ان ارسل لكم سيناريو التوريث كما تخيلة شاب مصرى مهموم مطحون زى شباب مصر كلهم<br />* مشهد رقم واحد:<br />مبارك في صالة بيته، يجلس على سجادة صلاة بشكل علم مصر، ويمسك في يده مصحف، وعلى الأرض نسخة من قانون الضرايب الجديد، تركز الكاميرا على الساعة التي تشير عقاربها إلى الرابعة AM، ويعلو صوت مبارك بالتسبيح..<br />مبارك: يا رب، يا رب الواد جمال ربنا يهديه كدة ويكمل نص دينه، ويارب أشوف ابنه ييجي يصلي معايا العصر ونبقى أنا وهو أكيد في مصر.. يا رب أشوف ابنه بيشجع معايا مصر في بطولة كأس أفريقيا 2030.. يا رب..<br />صوت الباب يفتح، ويدخل جمال وهو يمشي مترنح..<br />مبارك: إنت جيت يا حبيبي<br />جمال: إحم.. بابا.. إنت إيه اللي مصحيك لحد دلوقتي..<br />إنت موش وراك حكم الصبح، كدة تروح الرئاسة متأخر..<br />مبارك: يا ابني.. أنا من ساعة ما حكمت البلد دي وأنا موش شايف شكل النوم، الأمانة اللي في رقبتنا تقيلة قوي، يلا بقى عشان تيجي تشيل معايا الحمل<br />جمال (وهو يقبل قانون الضرايب): ربنا يخليك لينا يا بابا<br />مبارك: يا أبني بقى موش ناوي تعقل وتكمل نص دينك<br />جمال: وهو أنا عرفت أجيب النص الأولاني<br />مبارك: بتتريق حضرتك، طيب اتفضل أدخل أوضتك، محروم من لجنة السياسات لمدة أسبوع، ومفيش مؤتمرات ولا مناكفة مع عمك صفوت غير لما تتجوز، يلا أمشي من وشي، جتكوا نيلة.. مليتوا الحزب<br />جمال: والله ده ظلم<br />مبارك: بتبرطم بإيه يا ابن الـ......<br />* مشهد رقم اتنين:<br />أمام الجامعة الأمريكية، الطريق واقف، عربات مصفحة على اليمين والشمال، يقف جمال في وسط الشارع أمام باب الجامعة، يرتدي بنطلون جينز وتيشيرت أخضر مكتوب عليه \"فكر جديد\"، ونضارة شمس مرسوم عليها صورة مبارك، وفي فمه لبا<br />اقرأ بقية التعليق .."
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025249/http://masr.20at.com:80/article.php?sid=500"

[[comments]]
order = 9
subject = "اخر نوكتة"
author = "ميدو"
posted = "2006-06-12"
text = "ذهب جمال مبارك الى شيخ الازهر ليسائلةفى مدى شرعية وراثة الحكم.<br />اية راى الدين فى وراثة حكم مصر بعد بابا؟<br />فاجابة الشيخ لايجوز شرعا؟<br />فغضب جمال وقال لة وماالسبب؟<br />فاجابة الشيخ بالاية الكريمة<br />(ولاتنكحو مانكح ابائكم) صدق الله العظيم"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025249/http://masr.20at.com:80/article.php?sid=500"

[[comments]]
order = 10
subject = "وائل يا إبراشي يا محترم جدا"
author = "ابو احمد"
posted = "2006-06-12"
text = "الله معك يا أستاذ / وائل يا شجاع الصحفي فعلا كالقاضي لا بد وأن يقول كلمة الحق العمر سيمر وسنلاقي ربك كريم يومها ستجد نفسك إن شاء الله مرفوع الرأس لأنك قلت كلمةالحق في وجه الطغاة مش زي المطبلتية والزمارين أصحاب الأقلام الصفراء أمثال عمر أديب وأخوه الرخم التلم اللطع وأمثال أحمد موسى وغيرهم كثير لكن الشرفاء قلائل وعلى المستوى الرياضي أمثال محمود معروف وغيرهم وعلى مستوى التمثيل أمثال هاله سرحان وغيرها وعلى مستوى الديني شيخ الأزهر والأمثلة كثيرةعلى أبواق الصلته ولكن أنت وأمثالك هم من يرفعوا راس المصريين وسيأتي يوم ليس ببعيد ترفعوا رؤسكم بهذا البلد وأبنائة قريبا جدا"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025249/http://masr.20at.com:80/article.php?sid=500"

[[comments]]
order = 11
subject = "لا استسلام"
author = "نور الغد"
posted = "2006-06-12"
text = "على كل القوة الوطنية ان تقف صف واحد الغد و العربى الناصرى والتجمع رغم ان رئيس الحزب هو اضعف شى فى الحزب لكن نحن نحب اعضاء الحب الناصرى والكرامة لهم كل الاحترام من اعضاء الغد والاحرار والوفد رغم ان اعضاء ليس اهم دور فعال فى الشارع المصرى كما يفعل الغد والكرامة وكل الاحترام لااخوان رغم هجوم الدولة عليهم لانناء نحترم اختيار الشعب كما علمنا الزعيم وسجين الحرية ايمن نور يجب ان نقف جميعا خلف الرجل الذى قال كلمة حق انة البطل وائل الابراشى وكل الكتاب العظماء الذين معة نقول لة نحن نحبك ونحن معك ويجب ان يقف كل الناس معك لانناء لانعلم غدا الدور سيكون على مين لقد بدا الدور بزعيم الغد الدكتور ايمن نور ولا نعلم من سيكون اخر ضاحياء النظام الحرية لزعيم الغد وكل الاحرار من كفاية ومن الغد ومن الناصرى ومن الاخوان"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025249/http://masr.20at.com:80/article.php?sid=500"

[[comments]]
order = 12
subject = "هو السبب"
author = "ابو شريف"
posted = "2006-06-12"
text = "ليه الشعب المصري يحلم برفاهية الديمقراطية ... من امتى يعني بنعرف نفكر احسن من الحكومة<br />بالذمة لو كان وائل الابراشي بدال مايكتب في السياسة مش احسن له يشوف ايه احدث اغاني نانسي عجرم ومتابعة الحالة النفسية للنجم الشاب تامر حسني ورصد الحركة الرياضية وأحداثها المثيرة والمتمثلة في صراع الأهلي والزمالك علي اللاعبين من أجل الجلوس علي دكة الإحتياطي وماهو الفستان القادم للمطربة هيفاء وهبي والتصريحات النارية للمستشار حسن سبانخ بدل من الديمقراطية والحقيقة والحرية والكلام الفاضي ... يعني ياعم وائل انت ح تعرف احسن من رئيس سيد قراره ولا من الدكتور نظيف اللي عايز ينظف دماغنا ويخليها زي الفل ولا من صفوت الشريف وتعالوا مع بعض نحسبها بالأسماء<br />حسني (مبارك) من يومه ناحس البلد<br />احمد (نظيف) أقذر حكومه مصرية<br />فتحي (سرور) منكد علينا بقوانينه<br />صفوت (الشريف) قواد قديم<br />ياعم وائل خليك ف نانسي وتامر حسني وروبي أما مصر والمصريين فمعانا ربنا ينتقم لنا من ولاد .... دول"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025249/http://masr.20at.com:80/article.php?sid=500"

