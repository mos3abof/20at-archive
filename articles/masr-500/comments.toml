posted = "2006-06-19"
text = "لم تمتحن الجماعة الصحفية الا فى أزمة وائل الابراشى, واصبح المستفيدون من عطايا النطام كثر, وذهب البعض منهم الى حد الحقد على وائل تحت حجة أنه الاكثر شهرة داخل الجماعة الصحفية, بل الاكثر نظافة وكرامة ووجاهة. والادهى فى هذة القضية ان ذهب البعض منهم الى حد السعى الى دخول وائل السجن والخلاص من اخر الرجال المحترمين,<br />احذر يا وائل فان قلوب الصحفيين عليك.. يل وسيوفهم أيضا<br />صعيدى"
