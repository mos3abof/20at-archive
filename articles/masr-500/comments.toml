order = 72
subject = "سا عدو اسرة من الانهيار"
author = "رحاب مظلوم المنسى"
posted = "2006-12-05"
text = "اتمنى ان يقرا رسالتى الاستاذ وائل الابراشى او الذى يقرئها يساعدن فى وصولها الية فى اقرب وقت ممكن لاهميتها انقذواسرةمنالانهيارالحقوها قبل ما تتفكك وتضيع اقرو رسالتى للنهاية ارجوكم تركنا ابواب كثيرة لم نلقى المساعدة لم يعدهناك وقت امامنافهناك اكثر من مشكلة هذةالاسرةمكونة من خمسة اولادوام واب هذا الاب اشترى بثمن الغربة2فدان تركهم مع اخودون عقد ايجارمرض الاب بالفشل الكبدى بعداستقرارةفى مصرفضاقت بهمالحال فطالبو بالايجارفيردالاخ الارض مابتجبش فيردالاب اتركهاولكنةردملكش عندىارض استغلومرضةوحرفوفىالارض والجرن وفى او خرايام الاب زورواوراق للارض ومات الاب واستولى العم على الارض كوضع يدومازلت الام تذهب للمحامين دون جدوى الا مصاريف المحامين اماالابناءفلديهااثنين منهم مصابين بضمورفى العصب المركزى للعين الاول مجتهددخل كليةالهندسةببورسعيدونجح فى اعدادى بمادة واراد ان يدخل قسم كهربالانة اقل الاقسام رسمولضعف عينةخاصة فى الرسم فوجدنفسة فىقسم انتاج الاصعب فى الرسم ولم تسمح لة الكلية بالتغيروالاخرفى اولى اعدادى وهو من اوئل المدرسةفى الشهادة الابتدائية اماالابن الاكبرفكان فى كلية الهندسةفى قسم اتصالات فى السنة الاولى رسب رسوبااجبر الام ان تحولة لكلية التجارة للمصاريف التى كانت تدفعهالة اما المسكلة الاكبرفهى عمر 2الثانوى فقدتعرض للايزاء من بقل احدزملائة فىالدرس بالتحرش الااخلاقى من الخلف فقال عمر للمدرس المدرس ضرب الولدولكن لم تنتهى القصة ولكن اخذ زملائةيطلقون علية الفاظ بذيئة ويقولون له خدبتارك استمر الموضوع شهروفى تلك الاثناء كان الولد ينظر الية من فوق لتحت ونظرات احس عمربالذل انتهى الشهرومات الاب ولم تكن الاسرة تعلم بالواقعةحتى بعدوفات ابوة بثلاثة ايام وفىاخر ايام الدرس ضرب عمرالولدبالكترفى وج<br />اقرأ بقية التعليق .."
archived = "2006-12-18"
capture_url = "https://web.archive.org/web/20061218220559/http://masr.20at.com:80/article.php?sid=500&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

