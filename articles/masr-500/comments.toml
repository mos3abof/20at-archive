subject = "الله على ولادك يا بلدى"
author = "محمد"
posted = "2006-06-11"
text = "ولادك يا بلدى قرروا يحاربوا الفساد فى كل مكان ، ربنا ينصرهم ان شاء الله ، وائل الابراشى من الناس دول ، شايل روحه على كتفه علشان الحقيقة وعلشان يوصل صوت الامة ، ربنا يجعله دائما سيف للحق ومايجعله زى ابواق الفساد النتنة التى تددافع دائما وابدا على هذا النظام الجائر الفاسد"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025249/http://masr.20at.com:80/article.php?sid=500"

