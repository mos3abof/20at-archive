posted = "2006-11-25"
text = "لا تعليق على قضية وائل الابراشى ولا غيره<br />و غيره من الشرفاء الا بالدعاء لولاة امورنابالهدايةو صحوة ضميرهم من الغفلة التى يعيشونهاوالانتباه الى ماوجدوا من اجله فى مناصبهم و علاج اشكال الفسادالتى انتشرت على ارض الكنانة مصر الحبيبة:الرشاوى-التزوير-البطالة-ضياع المبادىء و الاخلاق-ضياع التعليم و المتعلمين-الزواج العرفى-الاغتصاب فى الميادين العامة-الربا باشكاله-حبس مترددى كلمة الحق<br />كل هذاشىء وسياسة البلد شىء تانى شوية وزراء تم تعيينهم و لاعلاقة بين عملهم و بين مناصبهم<br />وزير التربية والتعليم بجلسة واجتماع قرر<br />ان يوم السبت اجازة قائلا انه من وراء هذا القرار تم توفير ملايين الجنيهات للوزارة.<br />هل هذا القرار فى صالح التعليم ولاهو بيحسبها كامور مالية فقط(معلش اصل هو فى الاصل رجل اعمال ولاعلاقة له بالتعليم)<br />مصطفى جاهين"
