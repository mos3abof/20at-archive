[[comments]]
order = 30
subject = "إن مصر تموت بين أيدينا فهل من منقذ."
author = "بسمة"
posted = "2006-06-23"
text = "اذا كنت ممن تضامن مع وائل الإبراشي فانت إذن تبحث عن الحرية والحق والحياه السياسية النظيفة. ولكن إذا كان تضامنك هذا لوجهه الله وليس من أجل (إدعاء الوطنية) فعليك اذن ان تتضامن مع تلميذة (أولى ثانوي) ألاء فرج مجاهد والتي ألغي امتحانها للغة العربية وستجبر على إعاده السنه الدراسية فقط لانها عبرت عن رأيها وكتبت في موضوع الإنشاء (أن السياسة هي أحد أسباب التلوث البيئي في مصر).<br />ذكرت جريدة الاهرام بتاريخ 20/6 هذه الواقعه فأستشعرت أن القضية ليست قضيه وائل الابراشي, فهناك ألاف تضامنو معه – وانا منهم- ولا يوجد من يتضامن مع هذه الفتاه التي مثلها مثل وائل عبرت عن رأيها بكل جرأه وشجاعه وبالتأكيد لم يخطر ببالها وهي تكتب هذه الكلمات أنها ترتكب جرما من وجهه نظر المصحح ووجهه نظر وكيل وزارة التربية والتعليم بالدقهلية وأن هذا الجرم سيعود عليها بإضاعه عام كامل من عمرها في إعادة هذه السنه الدراسية مره أخرى.<br />انا أشعر بالاحباط وأشعر بأن مصر بمثابه الجندي الذي يحارب من أجل الحريه والحق والعدل ولكن سرعان ما أنغرست في قلب هذا الجندي سيوف الاعداء, هذا يحاول قتله وهذا يحاول ذبحه وهذا يحاول تشويه وجهه ونحن –المطالبون بالحرية- بمثابه الاطباء كلما عالجنا جرح من جروح مصرنا الحبيبة ظهر جرح أخر وكلما أنخفض أنين عضو من أعضائها أرتفع أنين عضو أخر.<br />إن مصر تموت بين أيدينا فهل من منقذ."
archived = "2006-06-27"
capture_url = "https://web.archive.org/web/20060627152604/http://masr.20at.com:80/article.php?sid=500"

