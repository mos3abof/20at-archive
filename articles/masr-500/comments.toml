text = "انا بعتب عليك يااستاذ وائل في حاجةوده طبعا من عشمي فيك.ليه معملتوش الضجة الاعلامية دي لاستاذ ابراهيم عيسى.ليه مااعلنتوش التضامن معاه زي محصل مع حضرتك.انا شخصيا معرفتش الحكم اللي عليه غير لما القاضي نطق بالحكم.والحكم فعلا اتنفذ سنة.ازاي واستاذ ابراهيم رئيس تحرير صوت الامة .انا بس مستغربة من رد الفعل الغريب ده وياريت توضحه لنا"
