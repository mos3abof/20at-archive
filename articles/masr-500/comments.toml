subject = "عزيزي وائل الابراشي ربنا معاك ويعينك"
author = "رحاب صالح"
posted = "2006-10-21"
text = "عزيزي المبجل وائل الابراشي يعلم الله اني اكن لك الكثير من الاعجاب وانحني لك احترام وتقدير وذلك لكل ماتبذله من جهود فكريه وذهنيه وبدنيه والتي تحملك بطبيعتها جهودا وضغوطا عصبيه وكل هذا حتي يعلو صوت الحق فوق كل الاصوات ولاني تعلمت منك اناقول الحق اولا اقل فإنه من تواضعكم الشديد ان تسمح لي ان اقول لك ان تمضي فيما انت فاعل واني اعلم جيدا انك لن تنكسر اوتهتز لتلك الاستنزافات التي تضعك في شتات الامور ولكن الله دائما مع الحق وانت تعلم جيدا انك دائما علي الحق لذلك ادعو من الله ان تنكشف الغمه وتزاح الغمه وربنا سبحانه وتعالي معاك ويزيدك قوه ومثابره رحاب صالح"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061548/http://masr.20at.com:80/article.php?sid=500"

