text = "على قد ما انا مبسوطة وبحمد ربنا سبحانة وتعالى ان فية ناس شرفاء كتير كل همهم حماية البلد وتنقيتها من الفسادواصلاح ما فيها من مساوىء فكرية او عقائدية او حتى اجتماعية الا انى خايفة قوى منقدرش على الفساد دا كلة بس اكيد بكرة افضل طالما فية ناس مثل الاستاذ وائل الابراشى استاذ وائل ربنا يثبتك ويكرمك ويرضى عليك ويقدرك على محاربة الفساد فى بلدك"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023212/http://masr.20at.com:80/article.php?sid=500&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

