author = "ايمن"
posted = "2006-11-30"
text = "اولا اقدم الشكر الي وائل البراشي الذي منحني لاول مرة ان اقول راي بصراحة .<br />في البداية اقول ان وائل الابراشي هو رجل اتي الينا من زمن اخر وهو زمن الشرف, زمن الوطنية<br />فبالتلي هو مجرم أشد الجرم لماذا ؟<br />كيف يقوم رجل شريف بين رجال لم بعرفوا معني للشرف والوطنية والنبل<br />لم بعرفوا له معني .<br />في النهابة ..........<br />اقول لجهور وطني الحبيب ان تخليناعن وائل الابراشي نكون قد تخلينا عن مصر لان الابراشي رجل نبيل من شعب مصر الطيب"
