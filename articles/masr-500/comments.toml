author = "مواطن بيعشق تراب مصر"
posted = "2006-11-30"
text = "فى بلد تزهق فيه الحريات فلا مستقبل<br />فى بلد تنتهك فيه أدميه الإنسان فلا مستقبل<br />فى بلد ينتشر فيه الفقر و الجهل والتخلف فلا مستقبل<br />فى بلد تنهب فيه الثروات فلا مستقبل<br />فى بلد تزور فيه الإنتخابات فلا مستقبل<br />فى بلد تورث فيه السلطه فلا مستقبل<br />فى بلد تنتشر فيه المحسوبيه فلا مستقبل<br />فى بلد معطله فيه طاقات الشباب فلامستقبل<br />فى بلد يهمش فيه العلماء بينما تسلط الأضواء على الغانيات فلا مستقبل<br />ولكن أين الخلاص ......أين.....؟<br />والله لن يكون إلا بثوره ثانيه<br />والله ..إنهم يرونه بعيدا ونراه قريبا .. صدق الله الغظيم<br />فلكل بدهيه نهايه ودائما ما تكون النهايه لصالح الشعوب ، قد يتجمل الشعب المصرى الظلم حتى أن الحاكم لظن أنه إستكان فإذا به يتفجر كالبركان الخامد غضبا ثائرا منتقما<br />فتحيه لكل لكل الشرفاء"
archived = "2006-12-03"
capture_url = "https://web.archive.org/web/20061203012317/http://masr.20at.com:80/article.php?sid=500"

[[comments]]
order = 69
subject = "هو بكم قد إنتصر...بفضل الله!!"
author = "حمدى شجيع"
posted = "2006-12-02"
text = "بسم الله الرحمن الرحيم<br />الإخوة والأخوات كل من تضامنوا مع الأستاذ الفاضل الصحفى الجرئ الشريف المناضل من أجل الحق وائل الإبراشى..<br />انتهينا أمس يوم الخميس بمجمع المحاكم بالتجمع الخامس بالقاهره الجديده من أخر جلسات تلك الملحمة الشعبية والوطنية التى شهدتها قاعات محاكم مختلفه ...<br />تلك الملحمة الشعبية التى كونتها كافة فئات الشعب وطبقاتة وأفرادة ومنظماته ونقاباته وانتم أولاً...<br />أمس خرج الأستاذ وائل الإبراشى ومن معه منتصراً رافعين معهم راية نصرة الحق على الباطل..نصرة الشفافية على التزوير...<br />وفور انتهاء الجلسة بإعلان الحكم بتنازل المدعى بالحق المدنى عن القضية..<br />تحدثت مكع الأستاذ وائل عن ماذا بعد..<br />قال لن نكون كالطاووس او نهلل بالإنتصار على أحد...كى نترك الباب مفتوحاً لأى من أخطأ فى حقنا بالتراجع دون خوف منه او شهور بالإنهزام...<br />وقال الأستاذ وائل انما النصر الحقيقى فى تلك القضية هم هؤلاء الناس الذين أتو من كافة محافظات مصر للتضامن معنا والوقوف بجانبنا طيلة الجلسات الماضيه حتى الآن..<br />هم هؤلاء نصرنا الحقيقى بأن ظلوا مع الحق ولم يتخلوا عنا لحظة واحدة...وكان ظننا بهم كذلك..أبناء مصر الشرفاء<br />صحفى ومدير مكتب جريدة صوت الأمة بالغربية"
archived = "2006-12-03"
capture_url = "https://web.archive.org/web/20061203012317/http://masr.20at.com:80/article.php?sid=500"

