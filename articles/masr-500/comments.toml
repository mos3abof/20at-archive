posted = "2006-07-26"
text = "شوفوا يا جماعة انا بحترم وائل الابراشى جدا جدا لكن يفيد باية الاحترام واحنا قاعدين فى امكنا زى محنا وكل شريف يفتح بقوا يضيع واحنا بنمصمص شفايفنا ونقول يا عينى كان شريف واللة لازم نقوم نتضامن نعبر نصرخ نعتصم مش مهم نغتصب او نضرب علشان اخوتنا فى المستقبل علشان ولادنا يعيشوا صح لازم نموت احنا واية يا عنى<br />انا عندى اخت بحبها جدا مستعدة اضحى بحياتى علشانها علشان تعيش صح وبكرامة فما بالكم بمصر"
