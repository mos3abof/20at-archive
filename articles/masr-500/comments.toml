[[comments]]
order = 37
subject = "سؤال"
author = "محمد علي"
posted = "2006-07-02"
text = "سؤال للظالمين: ماذا تقولون لربكم يوم أن تلقوه ؟<br />ما الدافع الحقيقي وراء ظلمكم للشرفاء أمثال الإبراشي وعصام العريان ومحمد مرسي وغيرهم ... أهو حب المال ...( فالمال وسيلة وليس غاية ) أم حب الكرسي ( لو دام لأحد ما وصل إليك أيها الظالم) ام التكبر والرياء .. أم غير ذلك .<br />أيها الظالمون : مهماطال ظلمكم لكم نهاية مأساويةإن لم ترجعوا عن ظلمكم فالله عز وجل عجّل للظالم بالعقوبة في الدنيا والآخرة ..<br />كم من أطفال يرفعوا أيديهم إلى الله بالدعاء عليكم بسبب حبس أو اعتقال أبائهم<br />وكم من زوجة فقدت زوجها سنين وراء القضبان بسبب كلمة حق قالها وكم من أم إحترق قلبها ألماً لبعد فلذة كبدها عمها بسبب أنه شريف في الوقت الذي يترك تاجر المخدرات ، بيوت الدعارة ، ... خارج السجون... أهذا عدل ....<br />آه لو قابلتم الله وأنتم على ظلمكم ستندمون ساعة لا ينفع الندم ساعتها تقول بلسان حالك ( رب ارجعون لعلي أعمل صالحاً فيما تركت ) فيرد عليك ( كلا إنها كلمة هو قائلها ومن ورائهم عذاب غليظ )<br />قال رسول الله صلى الله عليه وسلم ( إن الله ليملي للظلم حتى إذا أخذه لم يفلته ) صدق رسول الله<br />ياأيها الظالم مهما طال عمرك فلابد من دخولك القبر ومهما طال ظلمك فلابد من بزوغ شمس العدل .<br />إتقي الله ماذا تقول لله غداً"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023212/http://masr.20at.com:80/article.php?sid=500&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 38
subject = "يوم المحاكمة"
author = "دينا عبد الوكيل"
posted = "2006-07-06"
text = "لو كنتو جيتو المحكمة 18-6 وشفتو اللي انا شفته كنتو عرفتو ان مصر واهل مصر لسه بخير.كانت ملحمة شعبية في حب مصر .ناس من جميع الفئات والاعمار ومن جميع انحاء الجمهورية.لدرجة ان القاضي معرفش ينطق بالحكم عشان القاعة كانت مزدحمة جدا.انا باعتبر ان اليوم كان بدايتي الحقيقية لاني من يومها قررت اشتغل مع الراجل الشريف دهوبالفعل وبتوفيق من ربنا تمكنت اني اكون معاه في نفس الجريدة .واتمنى اني اسير على نفس خطاه"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903023212/http://masr.20at.com:80/article.php?sid=500&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
