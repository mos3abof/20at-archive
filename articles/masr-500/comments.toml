text = "بغض النظر عن اختلافي فكريا مع وائل الابراشي الا اني بحترمه جدا جدا<br />راجل محترم ومش بيحشر نفسه في اللي ملوش فيه زي ابراهيم عيسى<br />تحية تقدير واحترام لوائل الابراشي"
archived = "2006-06-13"
