text = "الاستاذ المناضل -وائل اولا مبروك انتصارالحق ان الباطل كان زهوقاواحيى شجاعتك وجراتك انت ومن كانوا معك ولا ادرى الى متى سننحنى للراقصات على اعلى المستويات فى الدوله ونطرد كل من قال/قال الله وقال السول.الى متى سنظل مسجونين داخل وخارج بلدناولكن لا بد لليل الطويل ان ينجلى واتينا او اولادنا صباح افضل منه بارك الله فيكم وانتم الاعلون ان كنتم مؤمنين ."
