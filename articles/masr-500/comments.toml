posted = "2006-10-20"
text = "الى شعب الغيور سبب واضح زى الشمس هوة المنصب او الفلوس بغض النظر عن الاتيكيت المصطنع ذو الطابع الرومانى الابراشى مهما كانت عيوبة وانا لا ارى اى عيوب هو مثال للصوت الحر الذى لا يهاب السلطة وليس كلب من كلاب السلطة نحن نريد ان نحذوا حذوة فلقد فاض وطفح الكيل ولا تتعجبوا ان يتم تلفيق تهمة فارغة مفتعله تؤدى الى نهاية حياة الابراشى فتلك سيرة الاحرار فى بلاد قد بيعت فيها الشعوب مقابل السلطة الله يحرسك يا وائل وما اجمل هذا الموقف من النقابة زى تعديل الدستور ...هيتعدل قانون الصحافة .....ومصر بمثل هذة التعديلات بترجع وتتاخر 100 سنة وربنا يرحمنا من ترزية القوانين والطبالين والزماريين وكلاب السلطة ومن كل هؤلاء الذين يصنعون فرعون مصر ويجبرون الشعب على عبادتةالله يحميك يا وائل"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061548/http://masr.20at.com:80/article.php?sid=500"

[[comments]]
