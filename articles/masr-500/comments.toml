[[comments]]
order = 1
subject = "تحية"
author = "محسن"
posted = "2006-06-11"
text = "تحية تقدير واحترام لكل الصحفيين الشرفاء الذين يواجهون الفساد والاستبداد بصدورهم العارية وكذلك المزورين ومن علي شاكلتهم وتحية خاصة جدا لوائل الابراشى علي قيادتة لصحيفة صوت الامة وبرنامجه الحقيقة في النهاية<br />يسقط الطاغية<br />ويسقط ابن الطاغية<br />والله لن نورث ابدا"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025249/http://masr.20at.com:80/article.php?sid=500"

[[comments]]
order = 2
subject = "ازهى عصور التزوير"
author = "أبو أسامة"
posted = "2006-06-11"
text = "يبدو اننااصبحنا فى ازهى عصور التزوير عصر<br />اللى أختشوا ماتوافها هوالتزوير بقى عينى عينك والراجل فيكوا يتعرض لى هذا طبعا هو<br />شعار الحزب الوثنى اللاديموقراطى واصبح فى<br />هذا العصر مصير الشرفأفى أيدى مجموعة من<br />البلطجية تسمى نفسها حزباوسط صمت من شعب<br />قضى حياته فى حروب ومعارك استفاد منها غيره من حكاما طغاة ليس لهم اى انتمألهذا الوطن فهاهى حربك القادمة تسعى اليك ايها الشعب البطل فللتحرك لتفتك بهؤلأ الطغاة<br />وتخلص شرفأ هذا الوطن من براثن الشيطان<br />الذى يسمى نفسه رئيساو الا ستلقى مصير من سبقك من الشعوب المستكينةالتى سلمت نفسها لحكام قتلوها وقضوا عليها وليكن العراق<br />وما يلاقيه اليوم هو درس لكم.<br />واخيرا اقول للأخ صاحب التعليق السابق<br />هو ودانا فى داهية غير اننا بنقول ملناش دعوة ومنحشرش نفسنا فى الى ملناش فيه<br />وبعدين الأخ وائل برده حشر نفسه فى الى ملوش فيه بس الوطن كله له فيه ويا ريت نتعلم بقى كل ما يجرى فى هذا الوطن لنا دعوة بيه و شكرا<br />مزيد من الفساد<br />مزيد من التزوير<br />مزيدمنالغرقى والحرقى فى عصر السيدالرئيس<br />اخذه الله"
archived = "2006-06-13"
capture_url = "https://web.archive.org/web/20060613025249/http://masr.20at.com:80/article.php?sid=500"

[[comments]]
