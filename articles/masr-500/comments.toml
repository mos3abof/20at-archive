subject = "مش كفاية نتعاطف"
author = "دينا رسمي"
posted = "2006-06-16"
text = "جميل بل و رائع جدا كل هذه التعليقات و هذا الكم من الحب والتقدير و التعاطف مع الاستاذ وائل الابراشي لكن هل يكفي هذا لكي لا نصبح قطيعا من الاغنام كما يريدوننا ، اعتقد ان التعاطف شفاهة لا يكفي ، الواجب علينا ان نكون جميعنا متواجدين يوم 18 يونيو على ابواب محكمة جنوب في باب الخلق لنقول كلمة حق بأسم كل المصريين تدين الفساد و تؤيد هؤلاء الشرفاء . قوم يا مصري<br />مصر دابما بتناديك<br />قوم لنصري<br />نصري دين واجب عليك"
