posted = "2009-12-26"
text = "اقتباس محمد:<br />Quote:<br />اختي بسلة المسلمة<br />انصحك ان لاتقولي أشياء بغير علم من قال لك ان الشيعة يسبو أمهات المؤمنين أو يقولون بتحريف القرآن … الشيعة مسلمين مثلهم مثل السنة والإختلافات تجديها في الفروع<br />إذا تريدي معرفة الحقيقة إسألي علماء الشيعة ليوضحو لك الشبهات التي تقال من هنا وهناك بكل أريحية رحابة صدر … فعلمائنا لا يجبرون الناس على اتباع مذهبهم<br />الله يغفر لنا ولكم وللمسلمين جميعا<br />ووفقك الله لكل خير<br />أولاً رأي في المسلسل الذي اثار الجدل انه صفر على الشمال واقل من صفر بعد , ومن الحكمة ان نكبر عقولنا عن مشاهدة مثل تلك من المسلسلات , يعني الحين ضاقت عليهم القصص ما خذوا إلا قصة نبينا يوسف وإن كان مطلوب تمثيل القصة فمن الواجب عدم تقمص شخصية الانبياء وبعدين معروف إن نص جمال البشر كان ليوسف فمن لدية مثل ذلك الجمال لا يكون القرد اللي حاطين صورته في بداية الموضوع , واخيرا ً ردا ً على السيد محمد اضم صوتي لصوت بسلة مسلمة يامحمد انت عندك شك 1% ان الشيعة مايسبون السنه لا تحاول تدافع عن شي حتى الجاهل عنده علم فيه ,,,"
