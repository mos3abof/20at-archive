posted = "2009-10-01"
text = "السلام عليكم<br />مسلسل رائع والى الامام لنظهر للعالم الاسلام ولنبهر العالم كيف يصور الاسلام ويحترم انبيائنا عليهم السلام. (في الغرب الكفار يصورو مشاهد خلاعية عن النبي يوسف عليه السلام وزليخة) والعياذ بالله.<br />الى الاخوة المعترضون لايوجد حكم ولانص شرعي وحتى في السنة النبوية الشريفة يحرم تجسيد او تمثيل الانبياء.<br />اما الاخوة المعترضون كون الممثلين شيعة فاقول قبل ان ترمو الناس بالبهتان وتحريف اقرءو جيدا لانكم محاسبون<br />والسلام عليكم"
archived = "2009-11-20"
capture_url = "https://web.archive.org/web/20091120081412/http://www.20at.com:80/20at/lifestyle/13389-2009-09-08-12-15-41.html"

