posted = "2009-10-03"
text = "اقتباس بسلة مسلمة مصرية:<br />يا على اتق الله بالعقل كدة ينفع بردو ناخد معلومات عن نبى الله من الشيعة اللى سبوا امهات المؤمنين وشككوا فى نبوة الرسول الكريم<br />ينفع ناخد معلومات ونثق فيها عن طريق الشيعة اللى قالوا ان القران الموجود واصدق كتاب على الارض محرف وان فى قران تانى لسة حينزل<br />دة عقل وانت بتشجع الناس على مشاهدتة<br />وانا حابة اقول للاخ الكريم محسن اللى عاوز يفرج ولادة على المسلسل مش دة المصدر الموثوق فية الللى تخلى اولادك ياخدو منهم اعتقادتهم<br />خلاص كمان ياناس حنتبع الروافض<br />اختي بسلة المسلمة<br />انصحك ان لاتقولي أشياء بغير علم من قال لك ان الشيعة يسبو أمهات المؤمنين أو يقولون بتحريف القرآن … الشيعة مسلمين مثلهم مثل السنة والإختلافات تجديها في الفروع أما هذا الكلام فهو مكرر<br />إذا تريدي معرفة الحقيقة إسألي علماء الشيعة ليوضحو لك الشبهات التي تقال من هنا وهناك بكل أريحية رحابة صدر … فعلمائنا لا يجبرون الناس على اتباع مذهبهم<br />الله يغفر لنا ولكم وللمسلمين جميعا<br />ووفقك الله لكل خير"
archived = "2009-11-20"
capture_url = "https://web.archive.org/web/20091120081412/http://www.20at.com:80/20at/lifestyle/13389-2009-09-08-12-15-41.html"

