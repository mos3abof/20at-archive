[[comments]]
order = 10
subject = ""
author = "بسلة مسلمة مصرية"
posted = "2009-09-29"
text = "يا على اتق الله بالعقل كدة ينفع بردو ناخد معلومات عن نبى الله من الشيعة اللى سبوا امهات المؤمنين وشككوا فى نبوة الرسول الكريم<br />ينفع ناخد معلومات ونثق فيها عن طريق الشيعة اللى قالوا ان القران الموجود واصدق كتاب على الارض محرف وان فى قران تانى لسة حينزل<br />دة عقل وانت بتشجع الناس على مشاهدتة<br />وانا حابة اقول للاخ الكريم محسن اللى عاوز يفرج ولادة على المسلسل مش دة المصدر الموثوق فية الللى تخلى اولادك ياخدو منهم اعتقادتهم<br />خلاص كمان ياناس حنتبع الروافض<br />ازاى احنا مش اخدين بالنا من المصيبة العظمى ان قناة عراقية بتبث مسلسل ايرانى يعنى العراق تشيعت بعد ان كان يحكمها حاكم سنى والمسلمين السنى يقتلون على يد الشيعة وينكل بهم فبدل ان يهم المسلمون الى نصرتهم لاء بنشجع اولادنا على مشاهدة ما هو افتى بة انة حرام<br />وهل اصبحنا نجاهر بفعل الحرام<br />الله المستعان<br />اللهم اغفر لى و لوالدي واخواتى والمسلمين جميعا<br />اشهد ان لااله الا الله وان محمد رسول الله<br />اتمنى التعقيب من على"
archived = "2009-11-20"
capture_url = "https://web.archive.org/web/20091120081412/http://www.20at.com:80/20at/lifestyle/13389-2009-09-08-12-15-41.html"

