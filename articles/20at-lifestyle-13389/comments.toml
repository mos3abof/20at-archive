author = "زهرة من المغرب"
posted = "2009-10-06"
text = "بكل صراحة مسلسل سيدنا يوسف عليه السلام مسلسل رائع و اكثر من رائع متكامل ومتقون سواء قام بتجسيده شيعيون او سنيون لان القصة ماخودة من القران الكريم اعتبر هده التعليقات غيرة من اخواننا في ايران لا حسد لا سامح الله لان المسلسل نجح ويستحق المزيد من النجاح ارجو ان تشاهدوه اولا مادا كان سيكون تعليقكم لو قامت بهدا العمل دولة اخرى كتركيا او سوريا او مصر مثلا مع العلم ان كل هده الدول تجمع بين ديانتين على الاقل وابدا لا نعترض ونقول لا نشاهد هدا العمل لاننا مسلمون ويقوم بتجسيد الادوار غير مسلمين فبالاحرى اخواننا الايرانيون نفس الدين لمادا هدا الحقد هدا ما يريده اعداء الله ان لا نتوحد ابدا ولا نكون يد واحدة اعود واقول لا يمكن ان تحجبو ضوء الشمس بايديكم ومسلسل سيدنا يوسف عليه السلام ممتاااااااااااا ااااااز"
archived = "2009-11-20"
capture_url = "https://web.archive.org/web/20091120081412/http://www.20at.com:80/20at/lifestyle/13389-2009-09-08-12-15-41.html"

