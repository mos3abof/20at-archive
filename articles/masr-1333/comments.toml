subject = "استهدوا بالله يا اخونا .. قول حاجة يا زين"
author = "حسين عبد الظاهر"
posted = "2006-12-21"
text = "يا اخونا صلوا على النبي واستهدوا بالله ، حاسس أن الدنيا كلها شبكت فى بعض براء على الطحاوى على هانى على عبد المنعم على محمد حسين .. فيه ايه يا اخونا وحدوا الله وصلوا بينا على النبي .. وعايزين نصفى نفوسنا لبعض ونخلي صدورنا واسعة.<br />ادعو الحاج احمد زين كبير عائلة العشريناتية يفتح المندرة ويكتب موضوع يهدى بيه النفوس ويطيب خواطر الناس ويلم المواضيع بدل ما نلاقى نفسنا بناكل فى بعض<br />يا زين رد عليا بجد ومتهرجش وحاول تهدى الأمور من عندك."
