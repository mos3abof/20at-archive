subject = "شعر الرقباء"
author = "أحمد مطر"
posted = "2006-12-21"
text = "فكرت بأن أكتب شعراً<br />لا يهدر وقت الرقباء<br />لا يتعب قلب الخلفاء<br />لا تخشى من أن تنشره<br />كل وكالات الأنباء<br />ويكون بلا أدنى خوف<br />في حوزة كل القراء<br />هيأت لذلك أقلامي<br />ووضعت الأوراق أمامي<br />وحشدت جميع الآراء<br />ثم.. بكل رباطة جأش<br />أودعت الصفحة إمضائي<br />وتركت الصفحة بيضاء!<br />راجعت النص بإمعان<br />فبدت لي عدة أخطاء<br />قمت بحك بياض الصفحة..<br />واستغنيت عن الإمضاء!"
