[[comments]]
order = 0
subject = "نرحب بالنقد ونرفض"
author = "عبدالمنعم محمود"
posted = "2006-12-21"
text = "في البداية أنا لن أعقب علي موضوع الذي سماه البراء مقالا عن انتقاده المرشد فقد أبلغت انطباعي الشخصي عنه لأصداقائي المسئولين عن الموقع<br />ما أود التنبيه عليه هو أمر هام للغاية<br />ان الاخوان لا يطالبون اعتذار احد عن مجرد أنه انتقد المرشد لان اولا المرشد مواطن مصري مثله مثل اي حد فهو غير معصوم من الخطأ , الإعتراض يكون علي استخدام ألفاظ بذيئة بحق أي أحد مرشد كان أوشبلا صغير<br />ففرق كبير بين الانتقاد واستخدام ألفاظ التطاول والسبب والانضمام ( لجوقه ) المزيدين باللفظ لا بالنقد<br />الامر الثاني الذي أحب أن أوضحه للقارئ الكريم أن حملة مطالبة المصري اليوم بالاعتذار ليس لكونها نشرت صور ( العرض الرياضي ) لا فالامر كان علني والاعلام كله كان مدعو لتغطية هذا الحدث<br />المطالبة عن بالاعتذار هي عن توصيف الطلاب بأنهم ( مليشيات ) وهومصطلح يستخدم في العراق لقوات غير وطنية تقوم بقتل العراقيين ووهو ما لم يقم به شباب الاخوان وأيضا وهو ما لم يصدر عنهم حتي ولو بجرد الشكل فهم لم يكونوا يحملون في ايديهم اي سلاح أو حتي أي رمز لسلاح ولا حتي عصاية مكنسة وهذا ما شهد به مصور الجريدة نفسه عمرو عبدالله حتي أنه وصفها بأنها لعب عيال في شهادة أرسلها للزميلة ايمان عبدالمنعم محررة موقع يلا طلبة<br />فالتوصيف كان خطير لسبب أن محضر تحريات أمن الدولةقدم هذا التوصيف للنيابة ووصف عرض الطلاب الرياضي ب \" المليشيات \" والسؤال هنا هل تم استخدام المصري اليوم لتكون أداة التسخين والتشهير بالطلاب قبل القبض عليهم وهذا مالا نتمناه أبدا من المصري اليوم<br />أم أن الامن استغل توصيف غير دقيق نشرته الجريدة وجعلته تكأه للقبض علي الطلاب وترويج المصطلح لدي كافة وسائل الاعلام<br />وفي الحالتين فالمصري اليوم وسياسته التحريرية تجاه هذه القضية قد ساهمت وبشكل كبير<br />اقرأ بقية التعليق .."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

[[comments]]
order = 1
subject = "تشرفنا بالسيرة الذاتيه لسعادتك"
author = "واحد فاهم"
posted = "2006-12-21"
text = "مبروك يا عم المهم ...<br />عرفنا أن الأستاذ اللي مش عارف مغمور مين اتكلم عن حضرتك في مقال مغمور في جرنال أغمر منه ..<br />وعرفنا كمان السيرة الذاتيه لسعادتك وإنك كنت مدير تحرير .. مبسوط يا عم .. يالا انشكح بقى ..<br />يا إبني يا حبيبي .. يا حبيبي يا إبني ..<br />لا حد قالك ما تنتقدش المرشد ولا حاجه من كل ده .. كل اللي الناس قالته إنك تكون مؤدب في طرحك مش تستهبل كده ..<br />وإيه حكاية اسكتش والإنتاج الفني ده .؟؟؟ عايز تتكلم خليك في الموضوع بدون استخفاف وخفه يا خفه ...<br />لا المشد نبي ولا مقدس .. اتكلم عنه براحتك بس من غير تسفيه لأنه مش حرامي ولا لص زي جمال مبارك يا خفيف ..<br />ده راجل بتختلف معاه مش مشكله .. لكنه لم ولن يكون حرامي كجمال مبارك اللص ..."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

[[comments]]
order = 2
subject = "اصحى يا كابتن"
author = "واحد فاهم"
posted = "2006-12-21"
text = "ثم إيه حكاية الإخوان عايزين اعتذار على انتقاد المرشد ؟؟؟<br />منين جبت الكلام ده يا براء ؟؟؟<br />ثم مين حضرتك عشان يطلبوا منك اعتذار ؟؟؟<br />فيه إيه يا عم انته ؟؟؟<br />زودتها ليه كده ووسعتها وعرضتها .. أعرض من ذكية وزكريا ..<br />ما تفوق يا عم وبلاش عبط .. فوق ..<br />واتهامات ومش عارف إيه .. فيه إيه يا عم .. مين حضرتك يعني ..؟؟؟<br />لهو جنابك هيكل واحنا مش داريين ولا إيه ؟؟؟<br />يا عم اصحى .. فوق .. باين عليك نسيت نفسك لما موضوعك أخذ تعليقات كتير حبتين ..<br />يا حبيبي ده كان بسبب سخونة الموضوع من جانب وقلة الأدب التي عرضت بها الموضوع .. بس مش أكتر<br />كمان كثرة التعلقات لا تعني أنك أصبحت هيكل ولا مصطفى أمين .. صحصح يا كابتن ..<br />أنا بس بافوقك لأنك لو ما فقتش بكره تخبط موضوع في أمريكا وبعدها بيومين تقولنا بوش اتصل بيك وطلب مناقشة الموضوع معاك ..<br />إيه لعب العيال ده ؟؟؟؟<br />بصراحه العيب على ولاد البلد اللي نشرولك العك ده اللي واضح إنه عك في عك والدليل أن ولاد البلد ترأوا منه وكتبوا تحت كلامك إنه رساله من جنابك ..<br />اصحى يا كابتن"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

[[comments]]
order = 3
subject = "انت ليه عملت من الحبة قبة !"
author = "شريف الدواخلى"
posted = "2006-12-21"
text = "بص يا عم براء .... قد اختلف معك فكريا تماما ولكن لنتحدث عن الارضية المشتركة بيننا وبشكل موضوعى ...<br />أولا : يعنى ايه مش رأى عشرينات .. ويعنى ايه مقال رأى براء حر فيه \" هل نفهم من ذلك ان عشرينات تعارضه .. طب ما كانت تقول .. أو أنها معه ولكن عاوزه النقد كله يصب عند براء .. المهم ماعلينا..<br />هو موضوع عاكف للانتاج الفنى كان مثير صحفيا و يدفع الواحد انه يعرف ايه المكتوب جواه .. لكن لتعترف أن الجلالة خدتك شوبة فى التريقة على المرشد \" وانا مش بعارضك فى كده \" انتا حر بس انا بعارضك فى انك تحقر أقوى فصيل معارضة فى مصر \" شئت أو أبينا - اختلفنا معهم أو وافقناهم \" هو أمر واقع ..<br />ثانيا : انتا اخدت مقال كامل \" لا توجد به أى اضافات او معلومات جديدة يا عم براء \" مقال كده من بابه عرض بشكل غير مباشر لنفسك يا استاذ وشهرة .. والمفروض لو كنت شايف أن بتاع الكرامة ظلمك وانتا صحفى وعارف دنيا ابعتله رد وهو كان ها ينشره .. أما انك تاخد مساحة يفترض انها عامة لحسابك الخاص \" عفوا هذا لا يمكن قبوله \" ... على الاقل من وجهة نظرى<br />ثالثا : احنا عارفين دايما ان الكرامة والغد والفجر من الجرايد اللى معدهاش مبدأ الاولى بتاعت القذافى والتانية بتاعت امريكا والتالتة بتاعت النظام .. فمتجيش تعمل من الحبة قبة .. مش هى ديه الكرامة اللى لسه نشره موضوع عن عنبد المنعم ابو الفتوح تم تفريغه من محتواه ان الاخوان لو وصلوا للحكم \" لا قدر الله \" ها يخلوا الاقباط يلبسوا حجاب ! يعنى بقت مع الاخوان قوى دلوقتى .. خلاص<br />رابعا : بجد حرام عدم احترام كل منا لرأى الاخر \" كل الناس يؤخذ كلامهم ويرد إلا النبى محمد يا جماعة \" مين المرشد ده اللى الدنيا تقوم علشان مجرد واحد مهم للاخوان بس ولباقى مصر ولا يفرق .. يعنى الموضوع فلصوه<br />اقرأ بقية التعليق .."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

