[[comments]]
order = 37
subject = "انا بتاع ..لن اعيش في جلباب ابي"
author = "حسام كمال"
posted = "2006-12-21"
text = "بينى وبين براء ايام عديدة من العشرة عشرة ولاد البلدالجميلة ثلاث اسابيع كامله ربما لم تتوافر لكل هؤلاء الذين كتبوا تعليقاتهم فقد جمعتنا غرفه واحدة في قطر الدوحة<br />انا صاحب تعليق \" براء ...لن أعيش في جلباب ابي \"لم اكن اعرف ان التعليق سيكون مرا على الرجل بهذا الشكل على الرغم من اني لم اقصد بيه اهانه او اقصد بيه تجريح لشخص عايشته واعرف كم هو طيب القلب وصحفي صاحب رؤية_ تحتاج لترشيد _ وصحفي يعمل فكرة وعقله<br />وهذا الموضوع بالذات ناقشناة امام صينية كباب وكفته في \" مطعم تركيا المركزي\" بالدوحة المرشد وتصريحات المرشد وكان نقاش جاد وهاد ولم نتطرق الي هذه الالوان من التجريح التى طالت براء وشرفه ووطنيته وفكرة ولا اقول ان هذا ليس دفاعاعن براء ولكنه دفاع عنه بالطبع ضد من خونه وكفرةوجعله صديق حميم لعزام عزام ؟!!!<br />انا لم يزعجنى على الاطلاق انتقاد المرشد وكم منا لم يعلق او ينتقد بعض تصريحات الاستاذ عاكف الكثير منا فعل وهو لابالنبي المرسل ولا بالقديس وليس لدينا تقديس للهيئات والشخصيات كما قال حسن البنا<br />وانما ما ازعجنى هوا ان نفقد هدؤنا يابراء وان يتحول نقدنا الى تلك السخريه الجارحة التى اقف انا اليوم في صفك ضدها وليس معها على الاطلاق فهؤلاء الذين تعمدوا ان يردوا عليك ويسخروا منك ويتهكموا عليك اخوانا كانوا ام غير اخوان نسوا في غمرة حنقهم وسخطهم ان هذا الاسلوب من الحوار لن يؤدي الي شئ وان المرشد ليس في حاجه الي دفاعهم عنه وان براء ليس في حاجه الي شتيمتهم اكثر من حاجته الى توجيه اخ منصف محب<br />ولا اقول ان براء اخطابل اقول خانه التوفيق كما اقول ايضا اننى من هؤلاء الذين لم يعجبهم تعليق المرشد على الحدث بانه اسكتش و_ وهذا ما قاله كل الاخوان _ فلم يكن اسكتش بل كان حركة متهورة من اخ لم يستأذن وظن نفسه<br />اقرأ بقية التعليق .."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

[[comments]]
order = 38
subject = "لا تنه عن شيء وتأتي بمثله .... عار عليك إن فعلت عظيم"
author = "ahmoss"
posted = "2006-12-22"
text = "يا سادة براء هنا مثل أي سجين للإخوان أو الليبراليين أوغيرهم .. أنا لا أعرفه لأدافع عنه لكني أدافع عن الحرية.<br />كفانا شمولية في التفكير يعني المرشد حلو في كل اللي بيقوله حتى لو غلط وفلان وحش في كل اللي يقوله حتى لو صح.<br />كل الناس بتتهم الراجل علشان إسلوبه وأنا شايف إن دي مراوغة ,انتم مش عاجبكم المضمون قبل الإسلوب.<br />يعني لو كان نفس الإسلوب ده وأسخم لكن على واحد من أعداء الإخوان كان حد هيؤله عيب يا براء ده راجل ليه وضعه.<br />لازم نشجع أي حد يتكلم طالما لم يرهب أو يصادر الأخر.<br />لك الله يا حريات إذا كان هؤلاء المنادون بها"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

