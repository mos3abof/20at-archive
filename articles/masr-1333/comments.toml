author = "بصراحة فكرتي بالاستاذ عبدالله كمال في بداياته..كان نفس الوضع يكتب مقالات شتيمة وقباحة في الاخوان وبعده يتوهم ويولول ويلطم \"كفروني كفروني\"...من هنا اقولك استمر واتوقعلك الوصول خلال الخمس سنين الجايين ..يلا يا عم ماشية معاك"
posted = "2006-12-21"
text = "النقطة الاهم وهي انتماء والدك للأخوان وهو امر غير صحيح بالمرة \"لأن والدك يا براء ملوش علاقة بالاخوان من زمان لظروف \"أعتقد إنك عارفها كويس\"...<br />إنت بس استمر وخليك في إلي انت فيه...لأنك بجد صحفي ناجح وبصراحة الصحفي الناجح اليومين دول لازم يجمل كتاباته بشوية بهارات وتوابل \"أغلبها كدب وتلفيق\" وبصراحة انت عندك كل امكانيات الصحفي الناجح !!<br />شد حيلك كده واطلع من الموضوع من غير مزايدة على الاخوان والنبي لأن بصراحة مش البراء اشرف ولا حتى خمستاشر براء اشرف هيسببو للأخوان مشكلة \"يا راجل ده التلفزيون والاذاعة وجميع جرايدك يا مصر نازله شتيمة في الاخوان ومأثرتش فيهم..لأن الواضح إن جتتهم نحست !!\"<br />كمل مسيرتك وهتنجح وتوصل ...بس الله يبارك في عمرك ...علشان يبقى لنجاحك طعم وريحة ولون وعلشان يبقى نجاح محترم تقدر تفتخر بيه قدام ولادك واحفادك ...بلاش النجاح ده يكون على قفى الاخوان زي ناس تانية...هيبقى جميل جداً ومحترم جداً إنه يبقى نجاح مجرد من أي شبه أو تسلق...مش كده ولا إيه !!"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

[[comments]]
order = 14
subject = "صبي العالمة ,, !!!!!"
author = "فارس_fr"
posted = "2006-12-21"
text = "اولا بعد اللى انا قراته من بعض التعلقات اللى فى الاول , بصراحة الناس قالوا واتكلموا وغطوا اغلب النقاط ,, بس اناهسالك نفس سؤالهم هل انت فعلا كنت بتنتقد تصريح المرشد باسلوبك ده ؟؟؟؟ ولا كنت بتنتقد شخصة وعمالتسخر وتتهكم عليه ؟؟؟؟ اعتقد انك محتاج تقرامقالاتك تانى وتعرف انت كتبتت ايه , شكلك بتنسي ..<br />بعيد عن الاخوان ومش الاخوان ,, ليه دايما مفيش شكل موضوعى لكلامنا دايما سخرية وتهكم على الناس فى سبيل الشهرة ,,, يعنى \"الاخ معاذ عامر\" و \" احمس افندى \" بيشجعوك على الاستمرار فى السخرية والتهكم ,, واللعب على وتر الاخوان ,,, اولاانا لا انتمى للاخوان ولا لغيرهم انا مع اي واحد بيحب مصر فعلا ,, مش هدفه الشهرة بس لم اتكلم على شخص وانقد تصرفه لا انتقده هو شخصيا ,,, ولاسف هم بيشجعوك على الاستمرار فىنفس الاسلوب اللى هم استخدموه فى تعلقاتهم من الاستخفاف بعقول شباب الاخوان ,, ولا المرشد اللى قالوا عليه صنم ,, طب ليه تقول كده ما تنتقده باسلوب محترم ,,, ياريت يكون فيه احترام لعقول الناس .....<br />بيتهيالى يا معاذ يا عامر فيه حد قاللى قبل كده ان انت اللى كنت بتدخل تحت اسك \"ليفي كوهين \" وتعلق وتسخن الجووتشتم فى المصريين والعرب ,,, هو انت فعلا ولا لأ؟؟؟<br />عموما ياريت نحترم بعض"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

