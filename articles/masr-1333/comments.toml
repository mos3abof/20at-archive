text = "طز فى مصر<br />مهدى عاكف<br />انا مستعد ارسل 1000 مجاهد للبنان<br />مهدى عاكف<br />فلوسنا تحت البلاطه و تمويلنا سرى<br />مهدى عاكف<br />العاقل بقول ان جماعه محترمه زى الاخزان لازم ليها مرشد اجدر بيها من كدا<br />اين كوادر الاخوان المشرفه المعروفه<br />لماذ1ا الاصرار على ابقاء عاكف بحجه انق افنى شبابه ف السجون<br />ليه ميفسحش المجال لدماء شابه<br />ملحوظه:لست من الاخوان و لا انوى"
