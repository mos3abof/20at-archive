subject = "رد وحيد وقصير على شخص واحد هو اسلام لطفي"
author = "البراء أشرف"
posted = "2006-12-21"
text = "اسف يا اسلام لو كانت الكلمة (مبررة) جرحتك..<br />وانا طبعا لا اقصد ان اقف في صف الامن لان شخص واحد هو الذي من حقه ان يفعل ذلك وهو الأهطل..<br />ونظرا لاني لم اصب بالهطل بعد فسأقول لك اني طبعا ضد الاعتقالات وخصوصا للطلبة لأني على الاقل مازالت طالب وسيسوئني أن يتم اعتقالي..<br />اقصد بكلمة المبررة هي انهاكان لها سبب.. يعني اعتقالات سابقة كثيرة للاخوان وغيرهم لم نكن نعرف سببها.. لكن هذه المرة فان الامن ربما يكون يملك فرصة مناسبة للاعتقال وتوجيه الضربات.. ولو لم يضرب الامن في فرصة كهذه فمتى يضرب..<br />ما اقصده انه في المرات السابقة كنا نعترض على الاعتقالات لانها بدون سبب.. وكان الامن يخرس لانه يعلم جيدا انها بدون سبب.. لكن هذه المرة من قه ان يتكلم لانه يملك السبب (من وجهة نظره هو لا من وهة نظري).. ومن حق الامن ان يستغل الفرصة لانه امن وهذا دةره الذي ننكره عليه جميعا وانا أول الناكرين.. ويعلم الله أني بكيت لحظة سماعي بنبأ الاعتقالات لأني اعلم ما يحدث لهؤلاء الطلبة الذين هم زملاء لي قبل أن يكونوا من الاخوان<br />عموما اعتبر ان عدم التوضيح لمعنى الكلمة هو خطأ مهني لي وسقطة مهنية فعلا كما تقول حضرتك ارجو ان تسامحني عليها وها انا اعتذر عنها وارجو تقبل اعتذراي عن هذه الكلمة فقط بين القوسين.. لا عن المقال كله ولعلك فهمت ما اقصده.. وانت تعرفني وتعرف اني استحالة اقف في صف الاعتقالات ايا كان شخص المعتقل.<br />البراء أشرف<br />baraa_ashraf1@yahoo.com"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

