[[comments]]
order = 8
subject = "نعيش أزمة"
author = "حسين عبد الظاهر"
posted = "2006-12-21"
text = "الأخ والصديق العزيز الأستاذ براء .. يعلم الله أنى أكن لك قدرا كبيرا من المودة والاحترام ، وما كنت أرغب فى أن تأخذ الامور هذا المنحى من التأزم والاحتقان ووقوعك تحت شعور المضطهد أو من تدبر ضده محاولات الاغتيال المعنوى.<br />الموضوع ببساطة يا براء أن البعض - وأنا منهم - لم يعجبهم أسلوب السخرية المشبع بكثير من الاستهزاء برجل فى مكانة الأستاذ مهدى عاكف مع التأكيد على ما سبق وأن ذكرته فى تعليقي على الموضوع .. بغض النظر عن الاتفاق أو الاختلاف مع الرجل .. كان وجه الاعتراض هو السخرية الزائدة وليس النقد فى حد ذاته ، وأقسم بالله سبق لى وأن كتبت مقالا انتقدت فيه الإعلاميين فى مكتب الإرشاد أنفسهم .. ونشر المقال على \"موقع إخوان أون لاين\" .. إذن النقد فى ذاته لم يعترض عليك فيه أحد إنما وجه الاعتراض الإفراط فى السخرية من رجل - نحسب أنه بذل زهرة شبابه داخل السجون والمعتقلات إيمانا منه بما يعتقد أن فيه الصلاح لوطنه - فلا يليق أن ننزل به هذا القدر من السخريةوالاستهزاء ، ولو رجعت إلى التعليقات لوجدت -مثلا- الزميل محمد حسين يذكرك بسن الرجل الذى هو فى مقام جد بعضنا .. يعنى من قبيل حتى احترام سن الرجل ، إن كنا لا نحترم فكره.<br />أما بخصوص الحملة الالكترونية التى يقوده الزميلان ياسر أبو العلا وعبد المنعم محمود - رغم أننى لم أشارك فيها - لكن أرى أن هذا حقهما .. أليست حملات جمع التوقيعات من الأساليب المتحضرة فى الاعتراض عما تراه مجافيا للحقائق ؟!..هل يكون من حق الصحفى النشر ، وليس من حق القارئ الاعتراض ؟ أليس الاعتراض نوعا من أنواع حرية التعبير عن الرأى؟!<br />وأظن أنهما لا يعترضان على النشر .. إنما على توظيف الحدث بما يخدم توجهات الامن أو يمهد الطريق لمحاكمة الطلبة عن خطأ اعترفوا به واعتذروا عنه.<br />وعمو<br />اقرأ بقية التعليق .."
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

[[comments]]
order = 9
subject = "إنت اللي غلطان"
author = "معاذ محمود عامر"
posted = "2006-12-21"
text = "بص يا حاج براء إنت اللي غلطان وستين غلطان إزاي واحد زيك يتجرأ وينتقد الإمام النبي محمد مهدي عاكف قدس سره وعظم علمه وجل شأنه<br />إنت كده تبقى بتجدف يا حبيبي<br />عد إلى رشدك أحسنلك لحسن بكرة السادة الإخوان هيمسكوا السلطة وهينفخوك إنت وأمثالك من الصحفيين الملاعين المأجورين الزنادقة<br />صحيح افتكرت حاجة<br />دايما الإخوان لما يكون فيه حد بينتقدهم أو بينتقد مرشدهم صلى الله عليه وسلم بيقولوا على اللي انتقده ده وصف لذيذ أوي<br />مجرم<br />كلمة سمعتها من عشرميت إخواني وأولهم أبويا الإخواني<br />يعني كده يا حبيبي بقيت مجرم<br />مجرم<br />مجرم<br />مجرم<br />نياهانيهانياهههههههه"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

[[comments]]
order = 10
subject = "الاصنام"
author = "ahmoss"
posted = "2006-12-21"
text = "يا أستاذ براء أنت بنقدك للأستاذ المرشد بتنتقد الصنم الجديد الذي يعبده الكثيرون.<br />أيوا الطلبة غلطوا ومحدش مصدق إنهم عملوا إستعراض رياضي ,ولو هو إستعراض فين بدلة الكرتيه و ليه مغطيين وشهم.<br />ما إحنا كنا في الجامعة و عمرنا ما شفنا كدة.<br />وبعدين كل المبجلين المحموقين للمرشد ما حدش فتح بقه لما شتم مصر و ناس مصر ليه و لاإنتم موافقين هو يدوس عليكم بالجزمة<br />إحنا بقى مش موافقين و لنا حق إنتقاده وبعدين أنا عندي سؤال مهم<br />لما الإخان لحد دلوقتي جماعة محظورة و المرشد بتاعها شتم مصر و شبابها إرهابيين و جمهورها رافض أي نقد بأي صورة أمال لو حكمت مصر حاتعمل فينا إيه؟<br />بلاش تحسوا إن أي هجوم على الإخوان هو هجوم على الإسلام و إلا تبقوا بتصنعوا أصنام جديدية و هاتودوا البلد كلها في داهية"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

