author = "مجاهد شرارة"
posted = "2006-12-24"
text = "الاخوة والاخوات الكرام<br />ربما ما كتب من تعليقات على مقال البراء يحتاج الى نقطة نظام والى توضيح اقرب منه للتحليل ...<br />بدء الأمر بتصريح فضيلة المرشد أن ما حدث من عرض رياضي هو جزء من اسكتش وقتها جاء مقال البراء وهو انتقاد صريح لتصريح فضيلة المرشد وجاءت الردود على المقال تحمل لونين فاقعين ولنا بينهم باهت<br />اللون الاول : اتهام البراء بأشياء كثيرة أقلها أنه مخبر<br />اللون الثاني: الدفاع عن البراء<br />اللون الثالث الباهت : قبول مبدأ النقد والاختلاف على كيفية النقد لأنه يروا أن الامر وصل للتجريح ...<br />ولنا هنا وقفة مع أصحاب الآراء<br />يرى فريق أن قدر فضيلة المرشد وتضحياته وسنه لابد من احترامها وعدم السخرية منه بأي حال من الأحوال وأسداء النصح له بطريقة مهذبة ومحترمة ويرى هذا الفريق أن مقال براء به تجريح لفضيلة المرشد وهذا ما أدى إلى الهجوم الضاري ...<br />فريق آخر .. اخذ يدافع عن البراء ويهاجم الاخوان وبعضهم قال أن المرشد طالما اصبح رمزا سياسيا معارضا للنظام فلابد ان ينتقد مثلما انتقد البراء نفسه جمال مبارك<br />وفريق ثالث ... قبل مبدأ النقد ولكنه اختلف في الاسلوب ...<br />وهنا وقفات ..<br />طالما ان فضيلة المرشد رضي ان ينزل للساحة السياسية فنقده أمر مباح كاي سياسي في البلد فكيف نسمح لأنفسنا أن ننتقد تصريحات جمال مبارك ومبارك وأيمن نور وغيرهم ولا نرضى بنقد تصريحات المرشد ...<br />ثانيا .. كيفية النقد قد نرى انها المشكلة الحقيقة .. فالتهكم والسخرية منهج صحفي معروف ومعمول به ولا اختلاف عليه لكن السؤال هل وصل النقد والسخرية في هذا المقال لحد التجريح الشخصي أم لا<br />النقطة الاخيرة<br />اعتب على البراء أنه ذكر في هذا المقال فريقين ولم يذكر الثالث<br />ذكر الهجوم والدفاع ولم يذكر فئة وان كانت قليلة قلبت منه النقد<br />اقرأ بقية التعليق .."
