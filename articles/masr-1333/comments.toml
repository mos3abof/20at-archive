[[comments]]
order = 31
subject = "الكارثة"
author = "إسلام لطفي"
posted = "2006-12-21"
text = "السلام عليكم يا عم براء يا صحفي يا قدير \"ودي مش تريقة بالمناسبة\" . . كون انك تتهكم على المرشد فده لن يُقل من قدره وكون انك تتناوله هو أو آراءه بالنقد أو حتى التجريح فهذا ايضاً قد يكون مباحاً بأعتباره الشخصية السياسية العامة الأهم خارج منظومة السلطة . . وانا شخصياً بأحترم حرية الصحافة؛ بس السؤال هل تحترمها انت؟!<br />قد يكون السؤال صادماً وكذا اجابته التي هي بالتأكيد (لا)<br />واكررها ثانية يا صديقي العزيز انك (لا) تحترم حرية الصحافة<br />ذكرت لك منذ قليل اني غير مهتم بما كتبت سابقاً؛ ولكن ما غمني وأهمني الجملة التي سامحني ان وصفتها بالحمقاء السخيفة التي قلت فيها:<br />(الآن أنا لا أكتب لمهاجمة الإخوان.. ليس خوفا أو تراجعا.. ربما هو تعاطف معهم بعد حملة الأمن (المبررة) عليهم..)<br />منذ متى والحملات الأمنية مبررة يا سيد براء<br />منذ متى أصبح البطش والارهاب والتعدي على الحرمات تجد لهانصيراً من اصحاب الأقلام<br />احب ان اذكرك أخي براء ان الحملات الأمنية (المبررة) تطال الصحفيين والاعلاميين والسياسيين والمثقفين والقضاة حالياً وانا متأكد انك يمكنك ان تملاء القائمة افضل مني<br />انا فعلاً صُدمت من وصفك للحملة الأمنية بالمبررة وانا أرى انها كارثة ان تصدر ممن هو مثلك"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

