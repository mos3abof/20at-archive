text = "لا فض فوك سا سيد أحمس إنت جبت المفيد هو صنم جديد صنعوه وعبدوه من زمااااااااااااااااااااااااااااااااان جدا كل البمرشدين عندهم أنصاف آلهة لا يخطئون أبدا<br />ولا يقبلون عليهم لاسخرية ولا حتى نقد منهجي دقيق ومحترم<br />مش أنصاف آلهة وللا إيه؟"
