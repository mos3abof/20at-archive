[[comments]]
order = 44
subject = "ما زال حملة الدعوة يحبونكم"
author = "محبة للاخوان"
posted = "2006-12-23"
text = "اخوتي على الرغم من ضيقي مما قلتم وعلى الرغم حزني على ما آل اليه اهل بلدي من اسلوب الا ان الاخوان علموني انه ليس المؤمن بالسباب ولا اللعان ولا الفاحش ولا البذيء لان الاخوان هم حملة فقط لمنهج وهو منهج اسلامنا بكل صغيرة وكبيرة فيه حملنا فرض الكفاية على عاتقنا على الرغم من خطورة الطريق ونتحمل من اجل اعلاء كلمة الله عز ووجل ولماذا نتحمل كي ينتشر العدل وينجلي الظلم ولا اعرف عنهم جزاهم الله كل خير عنا جميعا فكم ذاقوا من العذاب والاعتقالات وخرجوا منها اعزاء وخرجوا اكثر صلابة وخرجوا وما زالوا يحبون حتى من عذبهم لانهم يدركون (اللهم اغفر لقومي فانهم لا يعلمون) وكلنا في يوم لم نكن نعلم وقرأت من الرسائل ان الامام حسن البنا قال :كم فينا وليسوا منا وكم منا وليسوا فينا ويعني هذا ان هناك اشخاص ليسوا اخوان ولكننا نقدرهم وهم اخواننا المقربون لحملهم الدعوة وهناك من الاخوان من اهمل واساء لموقفه والكل عندنا هم احباؤنا المسلم والمسيحي والانسان لانهم اخواننا كما علمنا رسولنا الكريم وكم اتمنى ان نعمل في اتجاه واحد وهو مصلحة مصر ومصلحة امتنا ولن يأتي هذا الا بتصحيح الافكار وتصحيح الاخلاق وجزاكم الله كل خير"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

[[comments]]
order = 45
subject = "إلى المحبة للإخوان"
author = "معاذ محمود عامر"
posted = "2006-12-24"
text = "مبدأيا كده كلامك شديد الاستفزاز والعنصرية والعنجهية<br />تتكلمين وتقولين اللهم اغفر لقومي فإنهم لا يعلمون<br />هخل هذا على أساس أن سيادتكم تحملون رسالة نبوة جديدة أم أننا نحن قومكم كفرة ومشركون وأنتم تصبرون على أذانا لكم؟<br />هل نحن المجتمع الجاهلي الذي سيضئ بدعوتكم المباركة وأنتم الأنبياء حملة المشاعل الطاهرة والأضواء التي ستجلوا الفساد الذي نحن فيه<br />وبعدين إيه قومنا دي على أساس إن إنتوا دولة تانية أو ملائكة<br />وبعدين جنابك بتقولي:<br />لان الاخوان هم حملة فقط لمنهج وهو منهج اسلامنا بكل صغيرة وكبيرة فيه حملنا فرض الكفاية على عاتقنا على الرغم من خطورة الطريق<br />حضرتك بقى بسلامتك مين اللي قاللك إن منهجكوا هو الإسلام بالضبط وبكل حذافيره؟<br />معنى كده إن أي حد معارض لمنهجكوا يبقى معارض للإسلام بحذافيره<br />وللا إيه<br />أنا مثلا شايف منهجكوا أحمق ومتطرف وبراجماتي<br />يبقى أنا كده مثلا معارض للإسلام<br />مش ده معنى كلام سيادتك<br />لأ فوقي والنبي وبطلوا تعيشوا دور الشهداء والأنبياء اللي بيبذلوا من أجل قومهم وقومهم الكفرة ولاد الكلب اللي هما احنا مش حاسين<br />عيب الخطاب العنجهي المستعلي الإلهي ده<br />عيب وقلة أدب واحتقار للمخالفين وبعد كده تقوله بتحترموا أدب الخلاف<br />هو إنتوا خليتوا فيها خلاف<br />بلا نيلة"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

