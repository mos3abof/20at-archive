[[comments]]
order = 42
subject = "بلا كاراتية بلا زفت"
author = "احمد غانم"
posted = "2006-12-23"
text = "سبحان الله تقول قلبي كان حاسس مراتي عماله تزن على دماغي من شهر تقريبا عايزين نودي الواد نادي السواح قلتلها خير يا وليه قالت الواد بيجيني كل يوم عايط من الحضانة (كي جي تو) ولازم نقدمله في النادي عشان يتعلم كارتيه ويضرب العيال قلتها حاضر بكرة ان شاء الله انزل اقدمله ولما جه بكرة خدت يوسف افندي ورحت ومن ستر ربنا اللى تاكدت فعلا انه بيحبني لقيت الموظف بتاع النادي مش موجود قلت بركة يا جامع وخدت الواد وروحت من سكات ومن ساعتها وكل يوم مراتي تسالني يا راجل هتدوي الواد امتى تاني شوية وبفتح التليفزيون لقيت عمنا الشيخ الطيب اللى كان طيب لما كان مفتي بيحذر وبيقول اياكم ولعب الكارتية فانه مفسدة للعقل والجسم وبيودي في ستين داهية خاصة كاتا واحد واتنين قلتها شفتي يا نوجة يا حبيبتي ربنا بيحبنا ازاى كنا هنروح في ابو نكلة قالت خير اللهم اجعله خير قلتها الازهر حرم لعب الكارتية ووزير الداخلية قال يا ويله يا سواد ليله اللى هشوفه في اى نادي بيتنطط ذي عفاريت العلبة ساعتها جبت يوسف ابني وقلتله شوف يا حبيبي تيجي كل يوم مضروب وعايط ولا تيجي متلقناش لا انا ولا امك ولا اختك يارا"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

[[comments]]
order = 43
subject = "رد على واحد ماشى؟"
author = "انا سالت سؤال مش عارفة وانتا كعادة الاخوان اتفلسفت وعملت فاهم ومجوبتش على السؤال"
posted = "2006-12-23"
text = "يعنى اية بنات الاخوان ؟ خللى السؤال واضح ........ يعنى اية اخوان مسلمون طيب انا بصلى كل الفروض وحجيت مرتين والحمد للة يوم القيامة بقى هاجى على جنب بعيد عنكم علشان انتم من الاخوان ؟<br />ولا اصل التنظيم دة بدعة<br />وياترى المرشد دة احسن من الشيخ الشعراوى مثلا او السديس مثلا ؟ نبى يعنى واحنا مشواخدين بالنا ولا المرشد هوا وظيفة سياسية يعنى مواهبة اساسا سياسية واقصد بالسياسية هيا الخطابة مثلا والهاب مشاعر الناس<br />وشكرا"
