[[comments]]
order = 20
subject = "اظاهر زيارتك لامن الدولة اثرت عليك"
author = "زعلان عليك يا براء"
posted = "2006-12-21"
text = "واضح يا براء ان زيارتك الاخيرة او الكام زيارة اثروا عليك جداً لدرجة انك بقيت تتكلم اكنك واحد منهم ولغيت عقلك وفكرك<br />اختلف مع المرشد او غيرة انقده اشتمه دا انت حر فيه<br />انما متشتركش في مؤامرة قذرة من النظام علي الطلاب وتخون ضميرك الصحفي وترمي شرف مهنتك تحت رجليك وبكدا تتحول من صحفي الي عميل وكلب وتابع للحكومة<br />ودا وضع محبش اشوفك فيه"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

[[comments]]
order = 21
subject = "بلاش لعب عيال"
author = "هانى صلاح الدين"
posted = "2006-12-21"
text = "عيب عليك ياحاج براء ان تسن قلمك بهذه الصوره البجحه على رجال افنوا اعمارهم فى خدمه الاسلام فمن ادبيات العمل الصحفى ان تنقد فى اطار الايجابيه لا فى اطار تصيد الاخطاء وركوب الموجه ايه الصحفى الهمام لابد ان تعلم حقيقه الامور اولا قبل ان تتناولها بقلمك الذى ارى انه انحرف عن المعالجه الواقعيه وادبيات العمل الصحفى فعندما وصف الاستاذ مهدى عاكف ماحدث فى جامعه بانه مجرد اسكتشات فانه لم يقيم فرقه مسرحيه او حاول ان يبتكر قصه للتغطيه على ماسماه معاليك وغيرك عن جهل ميلشيات ياسيد براء ماقام به طلبه الازحر فعلا لم يخرج عن اطارمجرد فقره فى برنامج مطول من الاناشيد والفقرات التمثيليه وهذا الموقف ليس بالجديد فعلى مدار الاعوام الاربعه الماضيه شهدت جامعه الازهر مثل هذه الفقرات الرياض"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

[[comments]]
order = 22
subject = "وكفايه حركات عيال"
author = "هانى صلاح الدين"
posted = "2006-12-21"
text = "ولكن لم تقوم الدنيا فى الاعوام الماضيه كما شهدنا هذا العام ياسيد براء تسيس القضيه هو الهدف ومن هم على شاكلتك وشاكله عبد الله الطحاوى الذى تستشهد بكلامه يسيرون على خطى ابواق النظام كان الاحرى بك ايها الصحفى الهمام ان تتحرى الحقائق وتسن قلمك للدفاع عن هؤلاء ال<br />طلاب الذين سامهم الامن وبلطجيتهم سوء العذاب العام الماضى ويكفى ان تعرف ان هؤلاء الطلاب تعرضوا لمعركه بالاسلحه البيضاءترتب عليها جرح العشرات واصيب طالبان باصابات خطره هددت حياتهم ولم يقوم طلاب الاخوان بالازهر بالرغم من هذه الاعتداءات برد العنف بالعنف لانهم يحكمهم حكمه العلماء وخبره 70 عام من العمل الدعوى الذى قام على الدعوه بالحكمة والموعظه الحسنه<br />بطل يابراء شغل المراهقه الصحفيه وسامحنى ان كان كلامى به مرارة لكن ماكتبت كان اكثر مراره ووغلفه الافتراء المحض<br />الوقائع التى سردتها من واقع عملى الصحفى فى مجال التعلين حيث انى اعمل محررا تعليما منذ 7 اعوام مضت<br />معذره على غلظه الاسلوب ولكن اردت ان ارسل لك رساله غليظه لعلك تفوق من التوهان انت وكاتبك القدوه عبد الله الطحاوى"
archived = "2007-01-08"
capture_url = "https://web.archive.org/web/20070108010049/http://masr.20at.com:80/article.php?sid=1333"

