text = "السلام عليكم<br />انا رأيي ان الجزم الحقيقية هي عساكر الامن المركزي ربنا يريحنا منهم من الي انيهم و متقولوش انهم بيعملوا كدة غصب عنهم لان محدش بيضيع كرامتة غصب عنه."
