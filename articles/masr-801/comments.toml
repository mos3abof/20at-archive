[[comments]]
order = 1
subject = "حسني العميل بيبيع مصر للصهاينة ..."
author = "إبن بهية"
posted = "2006-08-13"
text = "يسقط .. يسقط حسني مبارك وعصاباته القذرة .. يسقط من يبيع الوطن للصهاينة كل يوم تحت مسميات الخصخصة والمسخرة .. اسألوا عن المشتري لكل مصانع وشركات وأراضي مصر .. ستجدون أقلهم مصريون وأكثرهم مستثمرون أجانب .. حتى المصريين اسألوا عن من ورائهم ومن أعطاهم المال ليشتروا نيابة عنه .. اسألوا عن مصر لمن تباع في عهد القواد القذر حسني مبارك عميل الصهاينة .. اسألوا عن بلدنا يا أولاد البلد ... ده من الآخر أهم كثيراً من أي موضوع آخر .. لأنها مصر يا ولاد البلد .. مصر بتتباع للصهاينة وحسني وعصاباته بيقبضوا الثمن .. وبكره نلاقي الصهاينة ساكنين معانا في نفس العمارة وماليين الشوارع .. هم سائرون في مخططاتهم لبناء دولتهم الكبرى من النيل إلى الفرات وللأسف الحكومات العميلة تساعدهم وتبيع لهم الأوطان ... الحل في العصيان المدني أو العسكري .. لو فيه لسه عساكر رجاله في مصر ...<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065135/http://masr.20at.com:80/article.php?sid=801"

[[comments]]
order = 2
subject = "رجاء حار جدا جدا جدا إلى مشرفي الموقع"
author = "مصري"
posted = "2006-08-13"
text = "التعليق المسمى \" وافقتي ولا لسه \" حرام كده ياشباب أرجوكم شيلوا هذه التعليقات وكنت سمعت أن الإدارة فيها خدمة التبليغ عن أي تعليق يخدش الحياء فأين تلك الخدمة أرجو أن تزيلوا هذا التعليق والتعليقات المشابهه لحسن والله ستقلل مثل تلك التعليقات من تعامل الناس من ذلك الموقع حرام . هل تلك ألفاظ وعبارات يمكن أن تليق بمصر وأهل مصر؟؟؟"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065135/http://masr.20at.com:80/article.php?sid=801"

[[comments]]
order = 3
subject = "نخلص من عصابات حسني مبارك الأول ... والنبي ركزوا هنا ..."
author = "إبن بهية"
posted = "2006-08-13"
text = "في أحيان كثيرة يكون تعليقي خارج نطاق الموضوع المطروح نهائياً .. السبب في ذلك أنني أريد جذب انتباه إخواني هنا إلى القضية الأصيلة والأم والجذور لكل مشكلاتنا وهي النظام المصري المباركي الفاسد الذي أوصلنا إلى ما نحن فيه اليوم من مصائب وكوارث في كل المجالات .. الجذور واحدة .. نظام حكم فاسد وعميل ولا يهتم مطلقاً بأمر أبناء البلد فتتفاقم المشكلات لتصير معضلات وإشكالات يصعب حلها .. لذا تغيير النظام بالكامل هو الحل .. عندما تأتي حكومة وطنية حقيقية مش همبكة وضحك على الذقون ساعتها ممكن نبدأ في حل مشكلاتنا ولكن قبل مجيء هذه الحكومة الوطنية لا يمكن حل أي من مشاكلنا لأن القرار بأيدي نظام حسني العميل الذي يريد إغراقنا بالمشكلات والقضايا الجانبية حتى نتلهى بها عما يفعله في البلد هو وعصاباته من تخريب وبيع للصهاينة .. هنا مربط الفرس ... تخلثوا أولاً من نظام مبارك العميل بكل ذيوله وبعدها كل شيء هيتصلح لوحده أو بإيدين أولاد البلد الحقيقيين مش العملاء ..<br />عشان كده راح أقول من تاني ...<br />يسقط .. يسقط حسني مبارك وعصاباته القذرة .. يسقط من يبيع الوطن للصهاينة كل يوم تحت مسميات الخصخصة والمسخرة .. اسألوا عن المشتري لكل مصانع وشركات وأراضي مصر .. ستجدون أقلهم مصريون وأكثرهم مستثمرون أجانب .. حتى المصريين اسألوا عن من ورائهم ومن أعطاهم المال ليشتروا نيابة عنه .. اسألوا عن مصر لمن تباع في عهد القواد القذر حسني مبارك عميل الصهاينة .. اسألوا عن بلدنا يا أولاد البلد ... ده من الآخر أهم كثيراً من أي موضوع آخر .. لأنها مصر يا ولاد البلد .. مصر بتتباع للصهاينة وحسني وعصاباته بيقبضوا الثمن .. وبكره نلاقي الصهاينة ساكنين معانا في نفس العمارة وماليين الشوارع .. هم سائرون في مخططاتهم لبناء دولتهم الكبرى من النيل إ<br />اقرأ بقية التعليق .."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065135/http://masr.20at.com:80/article.php?sid=801"

