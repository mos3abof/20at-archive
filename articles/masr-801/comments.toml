[[comments]]
order = 6
subject = "مظاهرات من زمن فات"
author = "ابو اسامة"
posted = "2006-08-18"
text = "عندما ارى المظاهرات فى مصر اعتقد انها مظاهرة من الثلاثينات ارى النجليز وهم يحاصرون الناس مع البوليس المصرى العميل<br />وعسكر من الأغبيأ لايعرفون الفرق بين بين<br />ولاد البلد والأنجليز فقد عمتهم بعض القروش<br />البسيطة التى يأخذونها عن التمييز بين ابناجلدتهم وبين اعدائهم فما زال الحكم الى الأن تحت سيطرة الأنجليز بالأضافة الى الأمريكان والصهاينة وعملائهم من مبارك<br />وحاشيته الذين يمثلون الملك والأقطاعيين<br />فأفيقوا يا اهل مصر انكم ما زلتم محتلين<br />فما هى الا الأسمأ قد تغيرت ولكن الأحتلال ما زال كما هو واسألوا الصومال اللى كانت بتتظاهر فى الشوارع والحكومة بتأيدها<br />وبتشجعها لأنها ليست حكومة أحتلال فقد استقلت الصومال ولكنكم لم تستقلوا فالى الأن نحن فى قبضة الأحتلال وعلشان تعرفوا ان كلامى صحيح شوفوا فيلم القاهرة 30 هتلاقوا<br />الصورة زى ما هى ."
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821065135/http://masr.20at.com:80/article.php?sid=801"

[[comments]]
order = 7
subject = "جزم لابسه جزم"
author = "نحن الان داخل احد مناطق التجنيد لتصنيف الاسلحه و الجنود الذين سيلتحقون بها"
posted = "2006-08-21"
text = "يصرخ الشاويش المسئول<br />المؤهلات تيجى على اليمين واللى مامعهوش مؤهل ييجى على الشمال......اتحرك.....<br />جزء يتحرك لليمين و اخر لليسار و للغرابه لاتزال مجموعه لم تنتقل لليمين و لا لليسار<br />هذه المجموعه المحايده التى لم تفهم ما يجرى تذهب مباشره الى الداخليه<br />ليس هذا كل شىء و لكن يشترط على من تختاره وزاره الداخليه ان يكون جاهلا لا يقرأ و لا يكتب<br />هما دول اشاوس الداخليه الذين يسحلون صفوه هذا البلد المنكوب من المطالبين بحياه افضل<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأه يـــــــا بــــــلـــــدى"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821105113/http://masr.20at.com:80/article.php?sid=801"
