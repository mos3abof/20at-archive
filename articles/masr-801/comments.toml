subject = "من راي منكم منكرا"
author = "هند"
posted = "2006-08-13"
text = "قال رسول الله صلي الله علية وسلم (من راي منكم منكرا فليغيره بيد فمن لم يستطع فبلسانة فمن لم يستطع فبقلبة وذلك اضعف الايمان) ونحن سلكنا اضعف الايمان والظاهر ان دورنا جاي لا محالة وربنا يسترها معانا بقي"
archived = "2006-08-21"
