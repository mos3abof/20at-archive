subject = "كلام عجيب"
author = "أكرم بس"
posted = "2006-01-30"
text = "مش عارف اللي كاتب المقالة كان شارب و لا أنا اللي فهمي على قدي<br />ازاي بنت حلم حياتها تدخل الكلية الحربية<br />حد يفهمني يا جماعه<br />اما عن الموضوع فهو كويس بخلاف النقطة السابقة فالحياة كلها مطبات و حفر و لازم نهدي عند كل مطب و نسمع كلام ماما و بابا عشان نخش الجنة و ربنا يستر<br />و رسالة اخيرة لاخي اللحوح ( متبقاش لحوح )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102115935/http://www.20at.com/article2.php?sid=352"
