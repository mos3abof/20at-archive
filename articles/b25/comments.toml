subject = "الفرق بين فنان و فتان"
author = "ابو سارة"
posted = "2006-06-05"
text = "الافلام المصرية ليست الا باب من ابواب الفساد فالاغراء و الاسفاف فيها مباح و هدا من اغرب التصرفات التى تحدث فى بلد مسلم فمقاطعة الافلام ان امكن و اتلافها افضل من تقييدها بالرقابة لكثرة السموم و لدا انا لا ارى هؤلاء نجوم و فنانين اكثر من ان اراهم فتانين و مفسدي * وادا قيل لهم لا تفسدوا فى الارض قالوا انما نحن مصلحون*"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133340/http://www.20at.com/article2.php?sid=25"

