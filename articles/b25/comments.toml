subject = "الإخوان أمل وإبداع"
author = "الصحفي/رداد السلامي"
posted = "2006-01-13"
text = "الإخوان شعلة متقدة من الفكر والإبداع حركة إسلامية جماهيرية ممتدة ..تؤمن بالتعدد والإختلاف الذي يؤدي إلى إثراء الحياة..والحياة في فكر الإخوان وتصورهم لوحة فنية جميلة رائعة وسيمفونية عذبة تجتاح الحس الإنساني وتحرك شجونه ووجدانه وتلهمه سر الحياة وتقوده من خلال ما فيها من ألون ومخلوقات متنوعه إلى المدبر الأعلى والقدير القادر ..فلا خوف على الفن من الإخوان لأن الحياة كما قال مصطفى مشهور رحمه الله نغمة موسيقية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133340/http://www.20at.com/article2.php?sid=25"

