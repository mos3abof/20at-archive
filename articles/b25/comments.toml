text = "أعطر تحيةوأجمل الامنيات الى قمر الشاشة المصرية.....الفنان عمر الشريف....أنا بحبك....أوي.....أوي...أوي..وأدعو من رب الكون ان يحفظك من كل مكروه....دمت في حفظ الله ديما\" ياحياتي.<br />أرجو من الفنان عمر الشريف ان يرسل لي موقعه الالكتروني لكي اراسله....وارسل له قصائد شعريه من مؤلفاتي أهديها له خصيصا\"مع ارسال رقم الموبايل بتاعه كمان.......مع فائق شكري الجزيل له.....RAJAA"
