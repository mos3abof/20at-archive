[[comments]]
order = 11
subject = "حقيقة الابداع"
author = "ابو سارة"
posted = "2006-05-30"
text = "الابداع الحقيقي هو انشاء عمل فنى راق خال من دغدغة الغرائز او يحرك النوازع الحيوانية بل يسمو بفكر المشاهد و يفيض على نفسه شعور الانتشال من بؤرة الجمود و الملل و يخلق فيك احساس الانتعاش الدهنى و الاخوان لما يسيرون فى هدا المضمار يحققون دلك *فليس من الفن كل ما مر عبر التاريخ من تمثيل الاثارة الجسدية و هى كثيرةفى ادوار الفلام القديمة وهى مثل عصارة الخمر ضررها اكثر من نفعها وما اسكر كثيره فقليله حرام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133340/http://www.20at.com/article2.php?sid=25"

[[comments]]
order = 12
subject = "نجم الضلال و نجم الاهتداء"
author = "ابو سارة"
posted = "2006-05-31"
text = "الافلام نوعان فيلم تجارى وفيلم هادف -اما الاول فلا يخلو من اغراء واثارة و هو وصمة عار فى جبين كل نجم و نجمة و هدا النجم هوى حينما اتبع الهوى و حين رضى باداء لقطة تخجل منها كل انسان دون الحيوان هدا باسم الفنو الفلم الثانى الهادف هو ما يتماشى مع العراف و مقدسات الامة و كل نجم حافض على هدا الدور دون ان يقربه الفساد من قريب او بعيد فهو علامة و نجم به يهتدى و الاخوان ينوون اتباع المسار الثانى ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133340/http://www.20at.com/article2.php?sid=25"

