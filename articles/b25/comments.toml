[[comments]]
order = 0
subject = "شوفوا في اسلام او لاين ملف الإسلاميين والفنون...فيه تأكيد لنفس الرأي"
author = "محمد السيد"
posted = "2005-12-07"
text = "آراء جيدة جدا .... أعتقد إن التجربة حتثبتها ... و كلنا في انتظار الأيام القادمة تقدم لنا الدليل علي وجهة نظر الإخوان ....<br />موقع إسلام أون لاين كان عامل ملف جيد جدا عن الإسلاميين والفنون ... وأثبت فيه اشتغال الإخوان بالفن من بداية نشأتهم ...<br />وإن الإمام حسن البنا كان أسس فرق مسرحية تابعة للجماعة ... وكانت بتقدم مسرحيات كويسة جدا وحققت جماهيرية في وقتها ...<br />الحقيقة كانت مفاجأة لي ...إنه كان من ضمن فنانين فرق الإخوان عبد المنعم مدبولي وحسين رياض وكثير من الفنانين المشهورين كمان ...<br />وتأكيدات علمائهم كمان بتسير في نفس الإطار (مثلا... الشيخ الغزالي والدكتور يوسف القرضاوي وكثيرين ) ...<br />لا للتمديد .. لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133340/http://www.20at.com/article2.php?sid=25"

[[comments]]
order = 1
subject = "نعم للفن الأصيل"
author = "عبدالمنعم محمد"
posted = "2005-12-10"
text = "جماعة الإخوان المسلمين لا خطر منها على الفن والإبداع طالما كان فناً نظيفاً<br />أما الفن المبتذل الذى نراه على الشاشات المصرية هذه الايام والمتاجره بجسد المرأه تحت مسمى الفن فهذا سبب ضياع شباب الأمة<br />ونحن جميعاً مع الإخوان ومع شعارهم ( الإسلام هو الحل )<br />ونعتبر ما حدث فى البرلمان خطوة فى طريق الإصلاح وسنرى الفن المحترم ان شاء الله"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133340/http://www.20at.com/article2.php?sid=25"

[[comments]]
order = 2
subject = "هو احنا عندنا اصلا فن يتخاف علية"
author = "منى مصطفى"
posted = "2005-12-21"
text = "بسم الله الرحمن الرحيم<br />انا مثل الكثيرين فى حيرة من امر الجماعة ولكنى اجد فى اعطائهم الفرصة ليثبتوا انفسهم خاصة ان ما نراة من فن مؤخرا لايمس للفن ولو ذرة فقلة وجودة احسن وياريت لو الاخوان فكر يعمل فن فاذكرة بقضايا الشباب المصرى المسكين والمحترم وليس الشباب السكبر الدخيل على مجتمعنا انا نفسى اشوف فن بمعنى الكلمة مش كلام فاضى فاضى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133340/http://www.20at.com/article2.php?sid=25"

[[comments]]
order = 3
subject = "الإخوان منفتحون"
author = "محمد حسين"
posted = "2005-12-23"
text = "أولاً أشكركم على الموضوع وثانياً أحيي الممثل العالمي عمر الشريف على نزاهته وجرأته فإن من يقول كلمة حق في الإخوان اليوم لابد أنه يمتلك قدراً كبيرا من الشجاعة بحيث يخاطر بمكانته من أجل كلمة حق.<br />وثالثا أؤكد أن الإخوان منفتحون على الفنون والآداب وهذا شأن من لديهم برنامج متكامل لإدارة دولة عصرية مثل مصر المحروسة التي لها مكانتها عربيا وإسلاميا وعالميا، فنحن في الإخوان لدينا فنانون وممثلون ومن أراد التأكد فعليه الرجوع إلى أدبيات الجماعة المنشورة منذ مرشدها الأول وحتى الوقت الحالي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133340/http://www.20at.com/article2.php?sid=25"

