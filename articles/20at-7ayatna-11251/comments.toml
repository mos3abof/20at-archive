author = "محمد عبد المقصود"
posted = "2009-02-10"
text = "التقديم رائع والمعلومات طيبة ولكنها مقدمة لتجربته كشاب نموذج حي للشباب البابض صاحب الهم والقضية<br />كنت اتمنى أن اسمع تجربته في حرب غزة وأثارها عليه كامراسل وعليه كانسان<br />كذلك تجربته في معايشة معاناة الأطفال والجرحى والقتلى<br />ورؤيته للعمل الاعلامي العربي والمسلم<br />ومقارنته بين العمل في الجزيرة والمواقع الأخري<br />ومقارنته بين العمل الميداني الملتهب والعمل في الأجواء العادية<br />هذه وغيرها اسئلة تحتاج إلى اجابة ليستفيد منها الشباب الطموح التائق للعمل بمهنة البحث عن المتاعب"
archived = "2009-06-26"
capture_url = "https://web.archive.org/web/20090626124756/http://www.20at.com:80/20at/7ayatna/11251.html"

