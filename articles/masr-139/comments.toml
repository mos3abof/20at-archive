[[comments]]
order = 8
subject = "حكاية"
author = "الشاعر"
posted = "2006-07-22"
text = "الجمال من الجمال والبشر ذى البهايم بابا قال ان الحكم مالوش نهايه واحنا واحنا راسنا لسه مطاطيه لسياده والعزايم هو ياكل عيش ولحمه والكلاب ليها العضايم سيبوا مصر تعيش فى حالها مصر حلوه بدون جمالها دى العيال ركبت كراسى راحت سارقه منها مالها"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907034849/http://masr.20at.com:80/article.php?sid=139&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
