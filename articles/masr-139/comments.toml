[[comments]]
order = 6
subject = "هاى جيمى..قررت انتخبك رئيس...لو؟؟؟؟"
author = "مصرية"
posted = "2006-06-03"
text = "الحل الوحيد لك يا جيمى لفض الأشتباك بينك وبين رفض الشعب لك هو أعلانك لميثاق شرف مع الشعب المصرى ..بنوده محددةوواضحة..تلبى فيهامطالبه<br />1- التخلى عن الجنسية الأمريكية اليهودية..واعلانك الاخلاص لجنسية الفقراء المصرية<br />2-التبروء بشكل كامل وتام من كل أفراد عائلتك وخصوصاالوالد الغير محترم..ومن كل الجرائم التى ارتكبوها طوال عهدهم الغابر وايداعهم السجون بعد محاكمة علنية<br />3-اعادة كل أموال الشعب المسروقة فى الداخل والخارج الى خزانة الدولة الخاوية ..وتجريد الأخ علاء وأمثاله من كل ممتلكاتهم ومصادرة ثرواتهم التى كونوها من دم المصريين<br />4-ادانة كل من سرق أموال الشعب وفضحهم بالأسم ومصادرة ثرواتهم لصالح الشعب<br />5-انهاء قانون الطوارىء..وتعديل الدستور المصرى ..وفق مطالب الشعب<br />6-الأفراج عن المعتقلين السياسيين..وادانة كل من قام بعمليات التعذيب وانتهاك حقوقهم ..وايداعهم السجون وعلى رأسهم حبيب العادلى..واغلاق هذا الملف الأسود الى الأبد<br />7-انهاء الفساد والمحسوبية وتطهير كل أجهزة الدولةمن عملاء والدك السابق (باعتبار أنك سوف تتبرأ منه)<br />8-حل مجلسى الشعب والشورى والحزب الوطنى ..وتطهيرهم من كل الهتيفه والبصمجيه والبلطجيه.. والتعهد باقامة انتخابات نزيهه<br />9-وضع استقالتك أمام مجلس الشعب الجديد لقبولها فور اخلالك بأحد هذه الشروط<br />10-اعلاء سيادة القانون والكل أمامه سواء<br />اذا قبلت هذه المطالب ..مستعده أنتخبك رئيس لمصر...<br />لكن ده معناه انك تسلخ جلدك على يد هندى أحمر ...وللأسف أصحابك الأمريكان خلصوا عليهم...وعندنا فى مصر ياجيمى مثل مشهور بقول (ديل الكلب لا ينعدل )..هارد لاك..يعنى برضه مفيش فايده<br />أنتم أحقر الكلمات فى قواميس كل لغات الدنيا...لالالالالالالالالالالالا للقرصان وسلالته وعصابته...ونعم..نعم..نع<br />اقرأ بقية التعليق .."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907034849/http://masr.20at.com:80/article.php?sid=139&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

