order = 7
subject = "خربوها وقعدوا على تلها"
author = "مواطن مصرى لا يجد قوت يومة هو واسرتة"
posted = "2006-06-24"
text = "حرام عليكم ياظلمة واللة العظيم لااجد قوتى انا واولادى واكاد ان اتسول لاطعمهم حسبى اللة ونعم الوكيل فيهم البلد فى ركود تام ياحرمية"
archived = "2006-09-07"
