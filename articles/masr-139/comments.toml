[[comments]]
order = 0
subject = "الازوزة في الكازوزة"
author = "احمد فؤادنجم"
posted = "2006-04-12"
text = "الازوزة في الكازوزة والعبارة في الدوبارة ونظيف في الوزارة وبابا في الرياسة وابن بابا في الوراثة والمدام اخر شياكة والفلوس في البنوك والبزنس للتيوس والبوليس عندة اوامر اضرب الشعب المعارض اللي بيقول كفاية احنل وصلنا للنهاية مش باقول الازوزة في الكازوزة والعبارة في الدوبارة"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212105/http://masr.20at.com:80/article.php?sid=139&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "لا للتوريث"
author = "مصرى"
posted = "2006-04-24"
text = "لا للتمديد ولا للتوريث ونعم لتعديل الدستور ولا لجمال مبارك لأنه لا يملك أى خبرة سياسية ولا فى أى شيء هو عمره عاش زى الشعب هو عمرة نزل ومشى فى الشارع علشان يشعر بما يشعر به الشباب ده أتولد فى برج عالى ده وجوده إعلان صريح عن فقر الشباب وبطالته ولن يورث مصر وكفاية عليه كده هو وأبوه وأمه وباب مصر مفتوح على البحرى وبيقولهم أطلعوا برة الشعب لم ينتخبكم فى يوم من الأيام أنتم محتلين مصر."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212105/http://masr.20at.com:80/article.php?sid=139&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "شرعية الحكم"
author = "د.فارس الخياط"
posted = "2006-04-25"
text = "الحكم الحالي يمثله مبارك الأول وهوأب بنصف شرعية ولكن بلا أي تاريخ سياسي أما الحكم القادم للوريث مبارك الثاني فيمثله ابن بلا أدني شرعية أو تاريخ الا تاريخ ميكي وسمير وشرشر نط. يا حلاوتك يا بلدي"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212105/http://masr.20at.com:80/article.php?sid=139&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "مصر بلد العراقة"
author = "ام عمر"
posted = "2006-05-05"
text = "و الله مش مهم يجي مين في الكرسى الملعون اللممغنط ( اللى بيشد صاحبه للنهاية) المهم فقط ان نحب بلدنا و نخاف علي ناسهاو نحاول نعيد لأم الدنيا مكانتها و زعامتها و نحترم الإنسان المصري اللى اصبح ارخص سلعة سواء داخل بلده او خارجهااي واحد يجي يمسك الحكم لازم يحب البلد و يصمم على رفع شان المصرين و رفع مكانتهم"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212105/http://masr.20at.com:80/article.php?sid=139&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

