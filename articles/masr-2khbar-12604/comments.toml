order = 0
subject = ""
author = "خزي وندامه"
posted = "2009-07-09"
text = "سمعت درس في المسجد قريبا اتذكر منه ان احد من الصحابة رضوان الله عليهم جاء الى الرسول وطلب منه ان يكون اميرا<br />فقال له الرسول صلى الله عليه وسلم ما معناه ابتعد عنها<br />انها خزي وندامه يوم القيامه"
archived = "2009-07-11"
capture_url = "https://web.archive.org/web/20090711211835/http://www.20at.com:80/masr/2khbar/12604-2009-07-09-06-35-20.html"

[[comments]]
order = 1
subject = ""
author = "وما تشاؤون"
posted = "2009-07-09"
text = "وما تشاؤون الا ان يشاء السميع العليم<br />وكان اسرائيل تختار لنا رئيسا وكان الشعب المصرى صفر على الشمال"
archived = "2009-07-11"
capture_url = "https://web.archive.org/web/20090711211835/http://www.20at.com:80/masr/2khbar/12604-2009-07-09-06-35-20.html"

[[comments]]
order = 2
subject = ""
author = "حديث شريف"
posted = "2009-07-09"
text = "قال رسول اللة صلى اللة علية وسلم :<br />اذا اراد اللة بعبد خيرا استعملة<br />قالوا :<br />كيف يستعملة ؟<br />قال : يوفقة لعمل صالح قبل موتة"
archived = "2009-07-11"
capture_url = "https://web.archive.org/web/20090711211835/http://www.20at.com:80/masr/2khbar/12604-2009-07-09-06-35-20.html"

[[comments]]
order = 3
subject = ""
author = "تعيين نائب"
posted = "2009-07-09"
text = "مطلوب فورا تعيين نائب لرئيس الدولة كما كان مع كل الرؤساء السابقين<br />نائب رئيس الدولة يقوم بالاعمال وقت الضرورة والمرض ويكون هناك انتقال سلس للقيادة<br />فاى شركة صغيرة لها مدير ولها نائب مدير واى نادى رياضى لة مدير ونائب مدير<br />فما بالك بمصر الدولة<br />لماذا لا يوجد نائب للسيد الرئيس كما كان هو نائب للرئيس السادات"
archived = "2009-07-11"
capture_url = "https://web.archive.org/web/20090711211835/http://www.20at.com:80/masr/2khbar/12604-2009-07-09-06-35-20.html"

[[comments]]
order = 4
subject = ""
author = "كل الناس عارفة"
posted = "2009-07-09"
text = "هو فية حاجة بتستخبى على الناس<br />ما كل الناس بتتكلم عن الموضوع وبتشوف الصور فى التليفزيون واللقطات اللى من بعيد وطريقة الكلام<br />يعنى العملية مش محتاجة اسرائيل ولا مخابراتها<br />وبعدين دى سنة الحياة<br />وفى السن دة لاى مصرى سواء جد او ابو الجد فى السن دة بتبقى ظروفة اية<br />بس الناس تعتبر وتدعوا ربنا بحسن الخاتمة<br />فالدعوة بحسن الخاتمة مهمة جدا"
archived = "2009-07-11"
capture_url = "https://web.archive.org/web/20090711211835/http://www.20at.com:80/masr/2khbar/12604-2009-07-09-06-35-20.html"

[[comments]]
order = 5
subject = ""
author = "ويقال ايضا"
posted = "2009-07-10"
text = "ان اول من نصح مبارك بالتوريث هو الشيخ زايد شيخ الامارات سابقا"
archived = "2009-07-11"
capture_url = "https://web.archive.org/web/20090711211835/http://www.20at.com:80/masr/2khbar/12604-2009-07-09-06-35-20.html"

[[comments]]
order = 6
subject = ""
author = "تخطيط سعودى وهابى"
posted = "2009-07-10"
text = "ما يجرى على الساحة فى مصر تخطيط سعودى وهابى انتقاما من ثورة يوليو التى هددت عروشهم<br />فالهدف الاول للسعودية هو اعادة الملكيات القديمة فى مصر وسوريا وليبيا واليمن حماية لعرشها<br />والسعوديون يسيطرون على الاعلام والاقتصاد المصرى ف 70 % من الفنادق فى مصر يملكها سعوديون<br />حتى مقتل السادات كان بتخطيط سعودى وانفصال سوريا عن مصر<br />انها سطوة دولارات البترول"
archived = "2009-07-11"
capture_url = "https://web.archive.org/web/20090711211835/http://www.20at.com:80/masr/2khbar/12604-2009-07-09-06-35-20.html"

[[comments]]
order = 7
