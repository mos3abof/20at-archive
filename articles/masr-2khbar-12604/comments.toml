author = "شرب ماء اللفت"
posted = "2009-07-11"
text = "على الريق قبل اكل طبق الفول تضرب كباية عصير اللفت واذا لم يتوفر اللفت تضرب كباية عصير بطيخ لمدة شهر وانا ابشرك انك ستكون حصاوى بديل طويل قوى<br />من كتاب الفكر الجديد فى مصر والكتاب الاخضر فى ليبيا"
archived = "2009-07-11"
