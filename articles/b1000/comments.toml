[[comments]]
order = 1
subject = "لا إله إلا الله محمدا رسول الله"
author = "عابر القارات"
posted = "2006-06-28"
text = "لا إله الا الله محمد رسول الله و ما شاء الله و لا قوة الا بالله العلى العظيم .... مثل هذه الاحداث تؤكد لكل ذى لب يعى أن فى قلب بلاد الكفر و الانحلال و \"اللأ إله\" يبزغ نور الفجر مشرقا و مؤكدا للغافلين الذيت يريدون أن يطفئوا نور الله بإفواهم إن جهودهم الحثيثة ستتبدد و ستذهب نفوسهم حسرات بعد ان تدور الدائرة مرة أخرى و يصير الاسلام هو سيد العالم مرة أخرى و الى ان يرث الله الارض و من عليها بإذن الله بعد أن أذاقوا المسلمين الذل و الهوان و لكن هذه طبيعة الباغى الظالم المغتر فهو أعمى و أضل سبيلا و لا إله إلا الله و جزى الله كل القائمين على مثل هذه المراكز خير جزاء و نفع الامة الاسلامية بهؤلاء الانقياء الاتقياء حفظة القران و الذى لم يمنعهم عدم نطقهم باللغة الضاد أن يحفظوا كتاب الله الكريم و أن يوصمونا خجلا نحن ناطقى العربية منذ الجدود بإهمال و عدم مواظبتنا و نحن الاولى على حفظ كتاب الله الكريم ... و أدعوا الله أن يغفر لنا و ان يفتح علينا فتحا مبينا كما فتح عليهم إن شاء الله إنه ولى ذلك و القادر عليه أمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145626/http://www.20at.com/article2.php?sid=1000"
