text = "لازم نفرح ونهيص لاننا مش هنقابل الدول التى تعتمد على الاستفزاز و تضيع الوقت والضرب بدون كورة وصاحبة الجماهير الزباله طبعا ده لايخص المغرب وتونس ولكن اقصد جماهير الجزائر الزبالة"
