subject = ""
author = "اقيموا الافراح"
posted = "2009-11-20"
text = "افرحوا وهيصوا واطلعوا بكرة فى مظاهرات علشان مش هتقابلوا الفرق اللى عقدت المنتخب المصرى تونس والجزائر والمغرب<br />خليكم مع افريقيا جنوب الصحراء<br />يا اللة جهزوا اغانى العبور ويا حبيبتى يا مصر<br />يا امة ضحكت من جهلها الامم"
archived = "2009-11-23"
capture_url = "https://web.archive.org/web/20091123122003/http://www.20at.com:80/masr/news/14111-2009-11-20-20-25-08.html"

[[comments]]
order = 1
subject = ""
author = "الامم الافريقيا هاها"
posted = "2009-11-20"
text = "بيقول لك الامم الافريقية<br />الدول اللى عايشة على الهبات والمنح والمعونات وغرقانة فى الفساد والتخلف<br />هنكسبهم<br />وطبلى يا مزيكا<br />وارقصى يا ام عنتر"
archived = "2009-11-23"
capture_url = "https://web.archive.org/web/20091123122003/http://www.20at.com:80/masr/news/14111-2009-11-20-20-25-08.html"

