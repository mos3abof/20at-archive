[[comments]]
order = 2
subject = "انه مخطط لأزاحة كل الشرفاء..ياكل مصر الثورة اللآن"
author = "مصرية"
posted = "2006-06-21"
text = "امعانا فى الفساد والقهر لكل من يحاول أن يكون شريفا من أجل مصر ..مخطط لأزاحة كل الأصوات النظيفة حتى لا تعكر عليهم صفو التدابير المرتبة ..المرشح الأقوى أيمن نور فى السجن بتهمة لو فرض أنها صحيحة فيجب أن يكون رأٍس الأفعى اول من يدخل السجن لفجوره واستيلائه على الحكم باكبر عملية تزوير فى تارخ مصر ..نعمان جمعه رئيس اكبر حزب معارض وقع فى شباك التدابير لأزاحته من الساحة السياسية بفعل النسخة المصرية من السى آى ايه المسخرة لحماية القرصان..نبيل الهلالى رحمه الله توفى اثر حادث ؟؟؟؟؟؟؟؟؟؟ ويعلم الله خفاياه .. أمتلأت السجون بالمناهضين الشرفاء الرافضين لهذا الظلم .. والبقية تأتى مادامت الأغلبية فى صمت وخضوع ..<br />أخى جاوز الظالمون المدى<br />فحق الجهاد و حق الفدى<br />ياكل أبناء مصر من الجيش والشعب<br />الثورة هى الحل ..الثورة الآآآآآآآآآآآآن"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622151139/http://masr.20at.com:80/article.php?sid=550"

[[comments]]
