subject = "صعبان عليا"
author = "طارق أبو بكر المحامى"
posted = "2006-06-21"
text = "أنا من المحامين الإسلاميين وأشهد للأستاذ نبيل الهلالى أنه كان رجلا وأستاذا وخدوما وكنت أحب أن أستمع له لكن وللأسف لم أسمعه يوما يبدأ كلامه ببسم الله والآن ماذا بعد إن نبيل الهلالى فى الآخرة بين يدى الله لاتعليق<br />أرجوا من الموقع أن يقدر حرية الرآى وينشرالرد"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622151139/http://masr.20at.com:80/article.php?sid=550"

