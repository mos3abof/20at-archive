subject = "اقنعتنى ان احب هذا الرجل"
author = "عبير شاهين"
posted = "2006-06-20"
text = "غريب امر هذا الرجل ولكن هكذا يكون الرجال حقا فقلما يجود الزمان بمثله فنادرا ما نجد من يشعر بالام الشعب من هذه الطبقه او يفكر فى امر الفقراء ولكن هنا نلتقى برجل مختلف بكل المقاييس رجل كما ينبغى ان يكون الرجال رجل ضحى وصارع من اجل كل فقير رجل تعذب وسجن ولم يبالى و ندعو الله ان يتغمده برحمته وان يرزقنا بمن يكملون المسيره من بعده"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622151139/http://masr.20at.com:80/article.php?sid=550"

