[[comments]]
order = 6
subject = "الأخ المحامي ( الإسلامي ) !!!!!"
author = "محمد فتحي"
posted = "2006-06-22"
text = "الاخ المحامي ( الاسلامي ) !!!!!<br />إخوانك .. الاسلاميون في نقابتك طعنوا كل قيم النبل و الحرية و الديمقراطية و كل ما اراده الله من خير للبشرية و هم يلهجون باسم الله ليل نهار<br />المأمون الخليفة العباسي ( أمير المؤمنين ) جلد و سجن الامام أحمد بن حنبل و هو يلهج باسم الله ليل نهار<br />السادات الذي أخرجكم من غياهب السجون ثم قتلتموه لم يكن يبدأ خطاباته السياسية إلا و يسمي الله حتى في برلمان الصهاينة نطق بها و هو يصافح الايدي الملطخة بدماء المصريين و العرب و المسلمين<br />الجهاز الخاص في جماعة الاخوان كان يقتل الابرياء و هو يسمي \"الله\"<br />أخي ( الإسلامي ) جاء في الاثر أن الله قد قبل شكر الاعرابي له حين حصل على بعيره و من شدة فرحته تلعثم و قال أشكرك يا ربي فأنا ربك و انت عبدي<br />أرجوكم يا اخي كفاية تفيقه أضر بالوطن و الأمة و المسألة مش مستحملة تفاهاتكم"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622151139/http://masr.20at.com:80/article.php?sid=550"

[[comments]]
order = 7
subject = "يا ريت نصف سكان مصر يكونو ا مثله"
author = "أيمن محمد"
posted = "2006-06-22"
text = "أولا أرجوعدم أقحام الدين و التهكم بالدين في أي تعليق فالأسلام دين السلام والسماحة وهو برئ من اي تهمة ولكن نحن من نستهزئ به ونسينا سنة خير الأنام رسولنا الكريم محمد عليه السلام ..<br />ثانيا من حبي في وطني وكرهي الشديد لما وصل اليه الحال الأن أتمنى أن يؤخذ هذا الأنسان قدوة فكما ينادى أن يؤخذ من الغرب الجيد ويترك الردئ فلنا أن نأخذ القدوة ممن نرى فيهم ولو جزء يسير من قدوتنا الحسنة الرسول الكريم عليه الصلاة والسلام.<br />فهذا الرجل يطلق عليه (أنسااااان) بمعنى الكلمة وياليت يكثر أمثاله في زمن كثر فيه الطامعين ومن يسيسون الدين حسب أهوائهم؟!! وعموما نطلب له ولنا الرحمة من رب العباد.. ولن تفرق معنا التسمية سواء قديس أم غير ذّلك؟!!"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623144420/http://masr.20at.com:80/article.php?sid=550"
