text = "بجد الراجل ده كنت بحبه أوي وبحب أشوفه بيشجع في المدرجات<br />الله يرحمه بجد ويجعل مثواه الجنة إن شاء الله لأنه أدخل السعادة والفرح على قلوب ناس كتير أوي.<br />شكراً لعشرينات ولأستاذ محمد فاروق إنكم كتبتكم عن الراجل ده بجد وافتكرتوه<br />بجد حنفتقده أووووي"
