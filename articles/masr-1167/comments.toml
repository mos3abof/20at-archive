[[comments]]
order = 2
subject = "قائد أول انشقاق"
author = "قائد أول انشقاق على الكنيسة المصرية:"
posted = "2006-11-16"
text = "البابا شنودة\"طائفي\" وهو \"الأسوأ\"<br />غضب مسيحي بعد الانشقاق<br />الأنبا مكسيموس أعلن تشكيل مجمع مقدس مرتبط بالأرثوذكس في أمريكا<br />القاهرة- (اف ب)<br />أكد رجل دين قبطي انشقاقه عن الكنيسة الارثوذكسية الأم في مصر، لأن عهد رئيسها البابا شنودة \"هو الأسوأ\" في تاريخ الاقباط كما قال، معلنا عن تأسيس مجمع مقدس مرتبط بالمجمع المقدس للمسيحيين الارثوذكس في الولايات المتحدة.<br />وقال راعي كنيسة المقطم الذي أطلق على نفسه اسم الانبا مكسيموس الأول في حديث إلى صحيفة \"المصري اليوم\" المستقلة \"لا امل في إصلاح كنيسة البابا شنودة فكان من الضروري اللجوء للخارج لإنقاذ الأقباط في مصر الذين عانوا من تسلط هذه الكنيسة\".<br />وأضاف \"عهد البابا شنودة يعتبر الأسوأ على الإطلاق في تاريخ كنيستنا\"، واتهم الباب شنودة بالتحريض الطائفي وقال إن \"تصرفات البابا شنودة كمن يصب الزيت على النار فقد كان يحرض الأقباط على الثأر من المسلمين وحمل السلاح\".<br />وأوضح أن إنشاء مجمعه جاء بقرار المجمع المقدس للمسيحيين الارثوذكس في الولايات المتحدة.<br />وقال \"تحدثت مع المجمع الأمريكي فقررت قيادته إنشاء مجمع مقدس لمصر وكنائس الشرق الأوسط يكون موازيا للمجمع الموجود داخل الكاتدرائية\".<br />وأعرب عن ثقته بان السلطات المصرية ستوافق على قيام مجمعه، وقال \"الخارجية الأمريكية تعتمد كنيستنا لاننا امتداد للمجمع المقدس للمسيحيين الارثوذكس في أمريكا\".<br />من ناحيته نفى الناطق باسم السفارة الأمريكية في القاهرة أي علاقة للولايات المتحدة بهذا الموضوع. وقال جون بري لوكالة الأنباء الفرنسية \"هذا غير صحيح على الإطلاق. ونحن لا نتدخل بأي طريقة\" في شؤون الكنيسة القبطية. وأضاف \"نحن لا ندعم أي فريق هذا لا أساس ل<br />اقرأ بقية التعليق .."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118123509/http://masr.20at.com:80/article.php?sid=1167"

[[comments]]
order = 3
subject = "ألجموا الكلاب"
author = "ألجموا الكلاب المسعورة قبل أن تتوحش"
posted = "2006-11-16"
text = "عفواً عزيزي القاريء لا تنزعج سريعاً، فإني أعرف أن آلافاً مؤلفة منكم سوف يضايقهم هذ النهج، وسوف يرفعون علينا بسذاجة شديدة، سيف الآية الكريمة (ادعو إلى سبيل ربك بالحكمة والموعظة الحسنة)، ذلك لأن مثل هؤلاء يعيشون في غيبوبة الجهالة، أسارى معارفهم المبتورة، ومعلوماتهم المحدودة، قصرت أنظارهم عن تصور الواقع الذي يعيشون فيه ولا يعلمون مايجري من حولهم.<br />وبذلك أصبحت الجبهتان ثلاثة، جبهة أعداء الله (الكلاب المسعورة)، وجبهة الحارسون على أمن البلاد ولا يعنيهم غير استتباب الأمن الظاهري (أجهزة الشرطة والأمن)، والثالثة هم هؤلاء المسلمون المغيبون عن إجرام المشركين وعبدة الأصنام، الجاعلين لله شريكاً، والجاعلين لله ابناً، والجاعلين لله أماً ترضعه وزوج أم يكفله.<br />ولأن الجبهة الأولى هي قضيتي والثانية لا أملك حيالها غير الدعاء أن يسخرهم الله لحماية دينه، وألا يكونوا خصوماً لربهم، وأن يكونوا عوناً للمسلمين بعدلهم بين عباده، ورحمتهم بمن يزودوا عن دينه الذي ارتضاه لنا ولهم، وألا يجعلوا منا ضحايا لسياسات جنود الشر في الشرق أو الغرب، وألا أكون يوم الحشر الأكبر، حُجَّة على واحد منهم يسأله الله عني، أو يصيبه أذىً من ربه بسببي في الدنيا أو الآخرة، فإني والله لا أحب لنفسي ولا لأحد من المسلمين أن يُحرم من رضا ربي، ولا الفردوس الأعلى من جنته.<br />لذلك فكل رجائي من أصحاب الجبهة الثالثة، ألا يكونوا عوناً علينا مع أهل الباطل، وألا ينساقوا وراء جبنهم وخذلانهم وإيثارهم السلامة في الدنيا، والغنيمة بالراحة والاطمئنان الزائف، أن مجرد التعبد في المساجد هو رسالة محمد صلى الله عليه وسلم، فإنه صلى الله عليه وسلم (واللهِ) لم يرتض الذلة، ولا المهانة، ولا الصغارأبداً، وأخبرنا<br />اقرأ بقية التعليق .."
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118123509/http://masr.20at.com:80/article.php?sid=1167"

