text = "ارسل هذا التعليق الي الكلب الذي فقد كل الشعور والاحساس اللص الذي نهب ثروات الشعب أقول له قد اقترب يومك بإذن الله وسوف تعدم يا رمه في ميدان التحرير حيث يتحرر الشعب من عائلتك القذرة النجسة سيقوم الشعب في مواجهتك انت وكلابك المسعورين ليسترد كرامته قبل ثروته وسلطته شلك الله وأعمي بصرك اللهم آمين"
