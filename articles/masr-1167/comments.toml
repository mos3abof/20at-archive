text = "الوضوع لذيذ ي محمد بس عايز شويه دقه<br />ومش هقوللك شويه صلصه لانالطماطم غليت<br />نتكلم بجد بقى<br />الموضوع جميل فعلا<br />و مش عارفه لحد امتى هتستمر مهزله الاسعار دى<br />الماساه يا جماعه انها بقت بتمس السلع الاساسيه للناس البسيطه<br />ربنا على الظالم"
