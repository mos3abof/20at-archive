[[comments]]
order = 3
subject = "الخطر المزدوج"
author = "باحث عن الحق"
posted = "2006-04-27"
text = "يا جماعه انا أرى من وجهة نظرى المتواضعة جدا ... أن الخرافة المنتشرة بين بلاد الإسلام هذه الأيام ذات خطر مزدوج<br />أولا : هى خطر على عقيدة المسلم كما أوضح من علق مسبقا<br />ثانيا : هى خطر على قوتنا كوحدة علمية وللاسف فقد أصبحنا فى ذيل قاطرة التقدم العلمى بعد أن كنا مصابيح هدى للغرب وسل التاريخ عن كل علمائنا الأفذاذ ... ولكن مايجرى الآن اننا أصبحنا نعول على الخرافات والابراج وما الى ذلك حتى أصبحنا لانحرك ساكنا ولا نسكن متحركا ولا حول ولا قوة الا بالله العلى العظيم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133950/http://www.20at.com/article2.php?sid=620"

[[comments]]
order = 4
subject = "انا بعرف اقراء الكف"
author = "ملاك"
posted = "2006-05-28"
text = "السلام عليكم ورحمة الله وبركاتة انا ملاك من مصر انا واحد بعرف اقراء الكف واقراء الفنجان وبعرف كمان اقراء نظرات العيون<br />ولكن انا عمرى ما قولت لى واحد او وحدة حاجة عن الغيب يعنى حاجة هتيجى فى المستقبل لانى مبعرفش حاجة هتيجى فى الغيب ولا اعرف حاجة عنها خالص انا هديكوم سر قراة الكف وهو انى زى ما اكون بعمل لل انا بقرارة الكف دة تحليل نفسى من خلالة بعرف عنة كل حاجة عن طريق احساى بية وومن خلال نظرات عنية وحركاتة ولكن انا معرفش حاجة فى الغيب دة عبارة عن هبة من الله انة مدينى احسا زيادة عن الناس وفى ناس كتير كدة او او مدينى نظرة فى الانسان ال قدامى من خلال نظرة ممكن اعرف شخصيتة و اقولة انتى كذا وكذا وكمان لازم اوهمه انى اعرف كل حاجة عشان ميكدبش واقولة مثلا انت انسان بخيل يرد ويقولى صح<br />قراة الكف عبارة عن تحليل نفسى<br />ومش اى حد ال يقراء الكف ال لو اتعلمة من واحد بيعرف يقرا ولازم يكون انسان حساس جدا<br />لكن لو واحد قللك انت مثلا عمرك طويل او ما شبة هذا من حاجةفى علم ربنا عز وجل قولة انت راجل كذاب لانة لا يعمل الغيب ال الله<br />وقال رسول الله صلى الله علية وسلك كذب المنجمون ولو صدقوا صدق رسول اله صلى الله علية وسلم<br />ولو حد عاوز يشوف الكف فيكم يجى اوانا هشوفهولة من خلال الكاميرا بس<br />وعشان تعرفوا قراة الكف دى مفهاش ال سر واحد بس ولو فكرتوا فيه هتلقوة سهل جدا وقريب اوى منك وبعيد اوى عنك<br />وشكراااااااااااااا<br />والسلام عليكم ورحمة الله وبركاتة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133950/http://www.20at.com/article2.php?sid=620"

