[[comments]]
order = 0
subject = "حرام"
author = "dark angel"
posted = "2006-03-27"
text = "الموضوع اللى انتوا طرحتوا عن الكف فى ناس بترجح تقول حرام وفى ناس مؤمنه انه مافيش مشكلة انها تقرا الكف بس المشكلة ان نص الحديث واضحعندما قال رسول الله<br />\" كذب المنجمون ولو صدقوا\"<br />يعنى بمعنى اصح انهم حتى المنجمون دول لو قالوا حاجة صح يبقى هما اصلا مجرد تخمين او استاعنه بالجن ليتكلم مع القرين بتاع الشخص الى بيقراله الكف علشان كده هو حرام اصلا غير كده ليه الانسان دايما مشغول باللى هايحصله بكره مانسيب بكره لبكره احنا ليه دايما نعد نقول انا نفسى اعرف الىهايحصل بكرهفى حديث عن الرسول بتقول<br />\"اعمل لاخرتك كانك تموت غدا واعمل لدنياك كانك تعيش ابدا\"<br />احنا ايه اللى شاغلنا احنا هانموت امتى ونعيش لحد امتى مانموت لما القدر يجلنا<br />مش مشكلة بكره اهم حاجة انهارده نعيش اليوم ومالناش دعوه لبكره"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133950/http://www.20at.com/article2.php?sid=620"

[[comments]]
order = 1
subject = "الموضوع خطير طحن"
author = "كرميلينو"
posted = "2006-03-28"
text = "الموضوع اخطرمن كذب المنجمون و لو صدقوا<br />لان الجديث التاني صريح و يقول الرسول صلى الله عليه و سلم : من أتى عرافا و صدقه فقد كفر بما انزل على محمد<br />فيا ريت نشيل موضوع التنبأ و الكلام ده من دماغنا<br />انا عارف ان في ناس كتير زي دبدوب بيقولوا ان الكواكب دي العلم وكلام من ده بس برضوا الواحد مبيحظش نفسوا في شبهات و اسيبلكوا دبدوب يعترض على كلامي<br />ممكن تبقا في خناقة ساخنة زي بتاعت الاخوان وحيد حامد"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133950/http://www.20at.com/article2.php?sid=620"

