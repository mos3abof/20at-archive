text = "منذ ما يقارب 15 سنة قراءت كفي شابة في امريكا و قالت لي امور ستحدث في حياتي في بداية الامر لم اهتم لاني لم اكن اقتنع بتلك الامور ونسيت الامر كلة ولكن حدث ما تنبات بة القارئة فاصبحت اومن بعض الشىء في علم قراءة الكف رغم ايماني دائما باللة"
