[[comments]]
order = 113
subject = "عودة الشاعر الاول لسحق كل الشعراء"
author = "محمد زكي"
posted = "2006-12-09"
text = "اخيرا قرر امبراطور الشعر الغنائي مصطفى كامل بالعودة لكتابة الاغاني للفنانين الكبار مثل هاني شاكر و عمرو دياب و ايهاب توفيق هذه العودة بالتاكيد ستحقق الانهيار لجميع الشعراء و الصدمة احن لهم يلعبوا بعيد بعد عودة الامبراطور للكتابة او يخليهم يكتبوا اغني زي وشهم في الافلامو على رأي المثل غاب القط العب يا فار عارفين انا اقصد مين ايمن بهجت قمر و امير طعيمة و هاني عبد الكريم و بهاء الدين محمد اللي بيتفشخرو بوليد سعد و ميعرفوش ان الامبراطور هو من قدمه كملحن هو و عصام كاريكا و عصام اسماعيل و الراحل الموهوب احمد شاهين و شريف حمدان انا فرحان بعودة امبراطور الكلمة للكتابة و حتشوفوا ازاي الشعراء حيتكيفوا قامه مرحبا بعودتك يا امبراطور"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215040441/http://masr.20at.com:80/article.php?sid=84&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

