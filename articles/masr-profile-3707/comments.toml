text = "معلش , ياريت ما تزهقوش مني أصل أنا بموت في مصطفى كامل قوي ........... نجاح البومات مصطفى كامل دليل على حب الناس ليه . مش مهم بقى مين بيشتري الالبوم , سواق حداد نجار حرامي سفاح , المهم ان واحد بطلع من جيبه فلوس علشان يدفعها ويسمع مصطفى كامل وده شرف كبير لفنان عظيم زي ده . ولو مش مصدقني اسمعوا البومطول الوقت او رحله عمري او اقوى من الايام او حكايتي انا او دقت الساعات او اكرهيني او البوم صور ,,,, بصراحه كل اتلالبومات احسن من بعض<br />ده دليل على نجاحه ... ما تنسوش , اللي عاوز يكلمني على ايميلي ده . وشكرا لكم , معلش طولت عليكوا قوى<br />hamada_ahmed464@yahoo.com"
