archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117141627/http://masr.20at.com:80/article.php?sid=84&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 85
subject = "لو تسمحوا يا جماعة"
author = "التهامى حليم"
posted = "2006-11-16"
text = "يا جماعة انا عايز اقول حاجة بل مجمعة اراء 1)ان مفيش حد بينجح وهوه معندوش موهبه 2)ان لو الراجل ده وحش ومش فناااان محدش كان فضل يكلم ويشتم كدة يا جماعة الراجل دة ثابت نفسة على الساحة بادئه المتميز فى الشعر استاذ بدليل تاسنرا جامد فى كل اغنية بيكتبة مع كل المطربين منه يارتنى لهانى شاكر والحب الحقيقى لمحمد فؤاد وبخاف لحمادة هلال واخرين يا جماعة سيبه الراجل يشتغل"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117141627/http://masr.20at.com:80/article.php?sid=84&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 86
subject = "ابن البلد"
author = "انسان عاشق"
posted = "2006-11-19"
text = "اولا السلام عليكم و رحمة الله وبركاتة<br />انا يا جماعة من محبى الامير مصطفى كامل<br />انا معاكم فى كل كلمة انتو قلتوها انو بدأ غنى و مثل و ألف و مش عرف اية زى ما انتو قلتو من الواضح ان الى كاتب المعلومات دى من محبى سعد الصغير و عماد بعرور انت بتتكلم على الفن الجميل بهذا الاسلوب ازاى و سايب الى يغنى للعنب و الى يغنى للحمار يعنى مع احترامى للرأى بس انا بقول يا جماعة الى مش بيحب مصطفى كامل ياريت يسيبة فى حاجة<br />و فى ناس بتقول ان السوقين و عامة الشعب هما الى بيسمعوة<br />طبعا اكيد لية علشان هما دول الى فعلا مصطفى كامل بيحس بيهم هما دول الى عندهم شوية الفول باليزت احسن من الفراخ و الحمة<br />الى فعلا بيحبوا الانسان مش علشان مظهرة او علشان هوا مين او ابن مين او مشين بالكوسة فى كل مكان الى شايف نفسة بيعمل الحجات دى بصدق لازم غطب عنة يحب مصطفى كامل<br />انا لو اسف اسف انى انى فى قربتك منى كان احساسى فى بعدك عنى ظلمة و رعد و برق و خوف<br />الله على الكلام الجميل يا جماع انا عايز الناس تحس بالكلام انا معاكم ان مصطفى كامل صوتة مش حلو بس كلامة جميل و احساسة عالى<br />و فى الختام ياريت محدش يزعل منى<br />لكن بردو الى اقدر اقولة<br />بحب يا مصطفى كامل"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215040441/http://masr.20at.com:80/article.php?sid=84&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

