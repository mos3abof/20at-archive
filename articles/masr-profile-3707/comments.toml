subject = "انتوا ناس ما بتفهمش"
author = "قلب مصطفى كامل"
posted = "2006-12-03"
text = "على فكره اللى كاتب الموضوع واحد حقير جداااا وقليل ادب كمان وواطي ومنحط عشان بيقول كلام وسخ زي وشه على الفنان حبيبنا كلنا غصب عنك يا كلب وكل الناس اللى قالت عليه كلام وحش بيكونوا مبيفهموش حاجه خالص وربنا ياخد كل واحد مبيحبش مصطفى كامل وربنا يخليكوا يا اجمل ناس ردت رد جميل زيكوا انا حبيت اقول حاجه مش لازم انا اقول اد ايه احنا بنحب الامير حبيب قلبنا واد ايه شكله وصوته وكله على بعضه بيتحب غصب عنك يا حقير انت"
