text = "مصطفى كامل ده بصراحه أفضل فنان في مصر , لانه قدر يثبت نفسه في ظل الزحمه اللي احنا فيها دي , وله طبع خاص في الغناء ومحدش يقدر يعمل زيه خالص حتى عمرو دياب. وبلاش بقى حقد وقله ادب لان ده مالوش لزمة من موقع فاشل وحقود زي ده . مع تحيات عاشق مصطفى كامل / أحمد ، وده ايميلي ياريت اللي بيحب مصطفى كامل يكلمنى عليه علشان اقوله على اخر أخبار امير العذاب hamada_ahmed464@yhaoo.com"
