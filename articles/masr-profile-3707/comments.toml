author = "صايع وقديم"
posted = "2006-03-28"
text = "بما اني موزع موسيقي جامد اقولكم الحكاية بدات ازاي<br />اصلا مصطفي كامل في الأصل شاعر و كاتب كلمات لكن بياع شاطر ممكن يبيع اي اغنية لا حد و كان لية نظام غريب في بيع ألاغاني كان بياخد اللحن من الملحن و يسمعة للمطرش بصوتة هو و يلبس الزبون السلطانية و يعمل احلي مصلحة و يما انة مصري من الجذور راضع الفتاكو والاستنصاح و سياسة صرف نفسك وفي وجود جمهور عندة استعداد لاي حاجة مختلفة --- الشرط بس انها تكون مختلفة و هو عندة جزئية معرفة الناس محتاجة اية<br />معلومة تانية ان مصطفي كامل معظم كلماتة كاتبينها شعراء غلابة بيسترزقوا و هو يحط اسموا علي اغانيهم............."
