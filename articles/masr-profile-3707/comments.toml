[[comments]]
order = 4
subject = "قشطه يابا ... دا اسم فيلم و لا منتج زبده !!"
author = "sweet_princess"
posted = "2006-04-03"
text = "هو فعلا مصطفى كامل من حوالي 12 سنه كدا كدان بيكتب اغاني الى حد ما معقوله ..<br />وكان بيغنيله مغننين كويسين زي هاني شاكر مثلا ..<br />لكن المشكله ان في حد ضحك عليه واقنعه انه مطرب ..<br />وتلاقيه اختبر نفسه في الحمام فلقى انه صوته مش بطال .. فقال اشمعنى انا ..<br />لازم اركب الموجه انا كمان ..<br />وكل دا جه على وداننا احنا .. لكن للاسف انا مش عارفه بيجيب كم النكد ووجع القلب دا منين ..<br />والله انا بستغرب ازي دا له جمهور !! وعلى اي اساس ..<br />انا شفت الفيلم الغبي اللي عامله مع ممثله ربع كم وعملهالي بطله ..<br />نكد من الاول للاخر .. لحد ما تعبت وجالي اكتئاب ..<br />يا عم الحاج ..خف علينا الله يخليك ..<br />كفايا اللي بنشوفه وبنسمعه .. ما تبقاش انت كمان .."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022706/http://masr.20at.com:80/article.php?sid=84&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

