[[comments]]
order = 97
subject = "مصطفى كامل انسانة بتحبك"
author = "فلسطينية وافتخر"
posted = "2006-11-29"
text = "رحلة عمري ..بفرح ..بجرح .. حلو .. بمر<br />رحلة عمري ... لازم غصب عني تمر...<br />هي حياتنا .. نقط وحروف .. حبت حب .. وحبت خوف<br />نحزن ... تكسرنا الضروف ... والانسان<br />مش دايمن حر...<br />عمال أقابل ناس ...عمال أودع ناس<br />وناس تاخدني في حضنها ... وناس بحس بحزنها<br />وناس هواية عندها ...<br />حرق القلوب بالنار ... أن الامال تنهار<br />انك تبيع وتخون ... انك تكون غدار<br />وأرجع وما أتعلمتش... وكأني ماأتعلمتش<br />وأحب ناس ثانيين ... واغرق في بحر حنين<br />والبحر يطلع فاضي ...الحزن مالي الماضي<br />والجرح اصبح عادي... وبرغم كل ألامي<br />عايش حياتي وراضي... وادي رحلة عمري<br />أوقات بموت من الخوف ... عطر السنين بيطوف<br />كل ما أقابل طير وفي ... دمعت عنيه بتختفي<br />أول ما شمعي بينطفي ...<br />كل القلوب بتببع... كل القلوب بتخون<br />عشرت زمان بضيع... حب السنين بيهون<br />وامشي الطريق وحديه... ومطر الدموع في عنيه<br />وأنوي الرحيل بمعاد... وأرحل وألف بلاد<br />توحشني شمس بلادي ... صوت الحنين بينادي<br />راحل وجاي في معادي... حفضل لأخر عمري<br />الطير الحزين الشادي... راضي برحلة عمري<br />رحلة عمري.... تحياتي انسانة بتحبك"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215040441/http://masr.20at.com:80/article.php?sid=84&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 98
subject = "عاشقة الاحزان مصطفى كامل بحبك موت"
author = "فلسطينية وافتخر"
posted = "2006-11-29"
text = "الاسم: عاشقة الاحزان<br />العمر :لا يوجد لهو معنى<br />تاريخ الميلاد:يوم التعاسة يوم الدموع م.<br />المدرسة :تلميذة في مدرسة الاحزان<br />المدينة:مدينة الاحلام والاوهام<br />مطربي المفضل : امير العذاب<br />اجمل عيون : عيون الحزين<br />اجمل دمعة :دمعة الحزين<br />الاغاني المفضلة:اكرهيني _ رحلة عمري _ حكايتنا _<br />الشارع :شارع التعاسة والاحزان اخر الشارع<br />امنية حياتي: امنية حياتي وعمري لاخر دقيقة فعري اموت بس اموت بلادي<br />اجمل يوم في حياتي : يوم ما بموت<br />من انا مازلت اسال نفسي من انا؟<br />انا عاشقة الاحزان انا من ليست لها معنى في الحياة انا من اعشق الاحزان من تعاسة حياتي انا من احب الناس وناس يعلبو في مشاعري من انا انا من احلم 24 ساعة في حياة احلى وافضل<br />(عاشقة الاحزان)"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215040441/http://masr.20at.com:80/article.php?sid=84&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

