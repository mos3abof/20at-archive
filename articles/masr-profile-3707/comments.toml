text = "بجد انتوا موقع مش محترم والى بيغلط فى مصطفى كامل مش بيفهم اى حاجة والله ياجماعة ده فنان محترم ويريت محدش يغلط فيه_ يريت الى بيحب مصطفى كامل يكلمنى على الايميل بتاعى وانا هبعتلو اى اغانى او اى كمليبات او اى صور هو عايزها انا عندى كل اغانى مصطفى كامل وعندى كمية صور كثيرة جدا الى عايز اى حاجة يكلمنى على الايميل ده disko_akraheny@yahoo.com"
