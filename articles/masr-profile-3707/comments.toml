text = "حـــرام اللى بيتقال على مصطفى حرام....<br />انتوا ملكم وماله هو احسن مطرب احسن شاعرتقدروا تقولوا مين بيقدر يوصل الكلمات زى ماهو بيوصلهامين..ياريت بحلفكم بأغلى حاجة عندكم تسيبوه فى حاله وياريت اقبل ماتحكموا عليه تشوفوا اغانيه وتسمعوها ولو فعلا بتعرفوا ايه هو (الاحساس)هتعرفوا مين هو مصطفى كامل..."
