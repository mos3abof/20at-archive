[[comments]]
order = 15
subject = "امير العذاب"
author = "اسلام فوزي"
posted = "2006-06-15"
text = "بصراحه بقي كده انتم كلكو اثبتو انكو فعلا مبتفهموش حاجه ... لان الانسان اللي انتو اعدين تشتموا فيه ده هو اللي طلعلنا مطربين بنعتبرهم دلواتي من زعماء الاغنيه وابسط مثال علي ده هو محمد فؤاد ... ارجعو كده لاغاني فؤاد القديمه (اللي هي كانت سبب في شهرته اساسا) هتلاقوها كلها كلمات امير العذاب اللي انتو بتشتموا فيه ده ... اللي انتو بتتكلمو عنه ده اكتر شاعر كتب اغاني للمطربين وكلها اغاني ملهاش حل ... هقولكو شويه امثله بسيطه ... اغنيه سالتك ودموع ودار الزمان والحلم الجميل وعمر عيني ومتدمعيش ياعين والايام الحلوه وعشان خاطري وووووو... اغاني كتيرة جدا ملهاش حل وفي الاخر تقولو عليه كده . انتو كده اثبتوا ان انتو فعلا مبتفهموش حاجه"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100915/http://masr.20at.com:80/article.php?sid=84&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

