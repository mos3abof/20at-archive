author = "سعيد السوهاجى"
posted = "2009-05-16"
text = "كلما مشيت فى خان الخليلى وشفت شوية التماثيل الفرعونية الصغيرة المقلدة والصوانى واشكال على شكل جمل ووش نفرتيتى واشغال الالباستر اشعر بحسرة<br />اقارن بين شارع فى مدينة خليجية تبيع الكاميرات الاليكترونية الحديثة وجديد عالم شاشات البلازما والاحظ انبهار السياح الغربيين بالتكنولوجيا الحديثة القادمة من شرق اسيا والاحظ مدى انبهارهم بسوق الذهب فى البحرين ودبى وتصل مشترياتهم فى العام الى الاف الاطنان<br />السائح هيعمل اية بشوية المساخيط هيرميهم فى اول صندوق زبالة فى صالة السفر فى المطار<br />الناس بتنبهر بالالكترونيات الرخيصة بتاع شرق اسيا<br />انما تقولى صينية مشغولة بالنحاس المكفت والكلام الفارغ دة ممكن تشوفها فى اسواق بغداد ودمشق وتورابورا<br />ارتقوا شوية اصلح اللة حالكم وسيبوكم من شوية التماثيل الهبلة اللى بتعرضوهم للبيع"
archived = "2009-06-07"
