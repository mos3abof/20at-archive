[[comments]]
order = 1
subject = "يا جماعة لا تلقوا بالا"
author = "عابر القارات"
posted = "2006-04-02"
text = "يا جماعة أرجوكم لا تكتبوا أو حتى تناقشوا أى خبر عن هذه المخبولة هدانا و هداها الله سبحانه و تعالى فهل نأخذ على كلام هذه المخبولة و قد قالت من قبل إن الطواف حول الكعبة المشرفة من بقايا الوثنية و أنها أحست بالقهر (ربنا يقهرها) عندما كانت تقرأ القرأن و قرأت قول الله تعالى \"للذكر مثل حظ الانثيين\" و أحسنت هنا أن الانثى مظلومة إذا أردنا أن نكتب عنها فلنكتب أيضا عن مجانين الشوارع شفاها و شفاهم الله و الذين تقابلهم فى إشارات المرور :) تخيلوا أن أى واحد فينا يبقى إبنه إسمه \"محمد روان زكية وفاء\" :))))) عليا النعمة الولية دى مهيسه و عليا النعمه إن اللى جبلها جوان البانجو ضحك عليها و إداها جوان ملوخية"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525020042/http://masr.20at.com:80/article.php?sid=110&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

