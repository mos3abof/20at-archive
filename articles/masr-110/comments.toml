subject = "يالهوييييييييي .. تبقى البت وامها"
author = "sweet_princess"
posted = "2006-04-02"
text = "اااه ماهي ناقصاها هي روخره...<br />تبقى البت وامها ..<br />ولعلمكوا هي كمان لاسعه زي امها ..<br />طلعالي في كلمة الزواج نظام فاشل والمراه احسن من الرجل ..<br />مخها اتكل من زمان اوي ..<br />ياللا .. ربنا يهديها<br />على فكره ... الموقع كان وحشني اوي"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525020042/http://masr.20at.com:80/article.php?sid=110&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

