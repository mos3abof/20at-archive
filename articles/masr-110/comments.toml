[[comments]]
order = 6
subject = "احترام الاسلام للمرأة"
author = "Maha ahmad"
posted = "2006-05-31"
text = "حقيقى أن كلنا نقدر دور أمهاتنا فى الحياة والاسلام من أكثر العقائد التى كرمت الام فقد كرمها الله سبحانه وتعالى فى القران الكريم كما كرمها الرسول صلى الله عليه وسلم فى سنته فلو أن حملنا لاسم امهاتنا نوع من التكريم لها فالاسلام كان اول الشرائع التى أقرت ذلك ولكان رسولنا الكريم أمرنا به تكريما لها وفى حين أنه لم يحدث ذلك فانه لا يعتبر من التكريم لها لانه مع تقديرنا لدورها لا يمكننا منع الاب من جعل أولاده يحملون لقبه وأما عن رأى أمهات الشارع المصرى فلا يحتاج لإستفتاء لمعرفة رأيهم لأن كلنا نعلم مدى استياء أمهات الشارع المصرى مما يحدث"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111123213/http://masr.20at.com:80/article.php?sid=110&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "لنكن عقلانيين"
author = "أبو منى"
posted = "2006-06-16"
text = "أبدت د. منى حلمي استغرابها من الاستنكار الذي واجهته قائلة \"أنا لم أحذف اسم والدي إنما أضفت اسم والدتي، وهي قضية تخصني، كما لم أقدم دعوى أطالب فيها أحدا بالاقتداء بي.<br />وما يهمني هنا هو رأي المفكر الاسلامي جمال البنا الذي أعلنه على الهواء مباشرة من خلال محطة الاوربت في حلقة خاصة بهذه القضية، قائلاً \"أحيي د.منى على هذه الخطوة نحو العدالة بين الأم والأب، فالأم أولى بالنسب لأنها تعاني وتتحمل عبء الحمل والولادة والتربية، وانا موافق على هذه الخطوة\"."
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111123213/http://masr.20at.com:80/article.php?sid=110&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

