[[comments]]
order = 4
subject = "فلافيو هيروح الزمالك"
author = "فلافيوزي"
posted = "2006-06-24"
text = "يا اخوانا انا مش مصدق نفسي ان فلافيو جاب جون. انا كنت فاكر ان ده من المستخيلات زي العنقاء والخل الوفي. اقترح ان الاهلي يديه هدية للزمالك اولا لتدعيم العلاقات وثانيا عشان يضمن ان الزمالك ينزل الدرجة الثالثة على ايد نجم نجوم انجولا"
archived = "2007-12-08"
capture_url = "https://web.archive.org/web/20071208074652/http://worldcup2006.20at.com:80/article.php?sid=76"
