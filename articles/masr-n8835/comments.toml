[[comments]]
order = 17
subject = "احييكم"
author = "عبدالله مفتاح"
posted = "2006-09-11"
text = "لما وائل يمسح اي تعليق بينقده عنده من الموقع يبقى هو مش قد الحوار<br />لما يشتم اي حد يقوله انت غلطان بابوه وامه يبقى مش مثقف<br />لما يطرد اي حد يصححله معلومة من موقعه يبقى مصر على الخطا<br />لما تحتوي اغلب كتاباته على الفاظ تخدش حياء قليل الحياء يبقى مش اد المسئوليه<br />لما ينتقد الداعيه عمرو خالد ويشتمه هو وزغلول النجار ويتطاول عليهم وميعملش اعتبار لعلم زغلول ولا لانجازات عمرو خالد يبقى هو عايز يفضل طول عمره غلط<br />وفي الاخر مكنش المفروض ان براء يعتذر لان ولاد البلد مغلطتش في حاجة<br />وفي الاخر اخ بيقول الهجوم عليك دليل نجاحك<br />مهي بوسي سمير ناجحه ويتقول الهجوم عليا سبب نجاحي بردو<br />يا خسارة المثل والقدوة<br />بئس المثل وبئس القدوة"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

[[comments]]
order = 18
subject = "المصريون حمير وبقر"
author = "ليفى معازيير"
posted = "2006-09-11"
text = "لما أجدادي حبوا يخرجوا من مصر في عهد رمسيس الثاني..كس أمه خول..حبوا يفقعوا المصريين زمبة سخنة تتطلع منهم القديم والجديد..<br />سفر التكوين الإصحاح الثاني عشر \" .. ثم قال الرب لموسى ضربة واحدة ( أخيرة ) أجلب على فرعون وعلى مصر بعد ذلك يطلقكم من هنا.. تكلم في مسامع الشعب أن يطلب من المصريين كل رجل من صاحبه المصري وكل امرأة من صاحبتها المصرية، أمتعة فضة وأمتعة ذهب.وأعطى الرب نعمة للشعب في عيون المصريين .. وقال موسى هكذا يقول الرب اني نحو منتصف الليل اخرج في وسط مصر فيموت كل بكر في ارض مصر من بكر فرعون الجالس على كرسيه إلى بكر الجارية وكل بكر بهيمة .. ولكن جميع بني اسرائيل لا يستن كلب لسانه إليهم لا إلى الناس ولا إلى البهائم لكي تعلموا ان الرب يميز بين المصريين وإسرائيل .. وفعل بنو اسرائيل حسب قول موسى وطلبوا من المصريين أمتعة قضه وأمتعة ذهب وثيابا وأعطى الرب نعمة للشعب في عيون المصريين حتى أعاروهم فسلبوا المصريين .. \".<br />وبعدين السادات ومبارك أهدونا مصر علشان نصلحها ونجر أهلها البهايم، ده جزاء المعروف يا زنوبة شبشب؟ إخص عليكي يا عانس يا قرشانة."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

