[[comments]]
order = 42
subject = "كل اناء ينضح بما فيه"
author = "مهتمه"
posted = "2006-09-18"
text = "كل اناء ينضح بما فيه<br />يعني ايه؟<br />يعني اللي جواه هم وفكر ودين وحق وخير وحب وفرح وحزن ، بتطلع الحاجات دي منه ، في كلامه وتصرفاته وحتى نظراته.<br />واللي جواه سباب وشذوذ وقبح وقذاره وقرف برضة مش بيشوف ولا بيتكلم ولا بيعرف غير اللي داير جواه<br />بغض النظر عن وائل ، وبغض النظر عن كل اللي مخنوق في كلمتين وداخل هنا عشان يقولهم، المهم ان الحريات المتاحة للناس لا تتعدى حرية الناس اللي بيقرأوا<br />بقولوا حريتك تتوقف عند حدود حريات الآخرين ،والشتائم التي تفوق الوصف والخيال والاحلام ، واللي مش عارفة اصحابها طايقين نفسهم ازاي سواء وهما بيخرجوها او لما بيحتفظوا بيها جواهم حرام عليهم احنا !!!!!!!<br />يشوفوا حد زيهم يتلموا عليه ، ويطلعوا الحاجات دي سوا براحتهم ، وان كان الله شاهدهم ، وناظر اليهم ، ومطلع عليهم ، بس المهم يبقوا بعيد عننا<br />واذا بليتم فاستتروا<br />ويا دعاة الحرية احموا حرياتنا من متعدي الحرية واحمونا من كلامهم اللي زي الفل ، حسبي الله ونعم الوكيل في كل من في يده وفي سلطته انه يحافظ على شعورنا من هذه التعليقات الفظيعة ولم يفعل شئ<br />لا حرية للسباب والفحش والقذارة والشذوذ"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

