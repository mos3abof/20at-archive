[[comments]]
order = 29
subject = "وائف محتاس"
author = "سعاد المزيونة"
posted = "2006-09-13"
text = "الواد وائل ده انا اعرفه من بداية ما كان يلقح جثته على الصحافة الالكترونية ، واذكر فيما اذكر ان واحد مرة سماه \" وائف محتاس\" وطبعا الواد وائل ده عنده عقده اسمها سعاد المزيونة وكان يتصور اي حد بينتقده هو نفسه سعاد المزيونة وان اللي بيكرهوه هم الخلايجة بس ، المهم ، ما علينا نرجع لموضوعنا بقى ، الواد وائل زي ما وصفه كاتب اسمه علي عبد العال حسبما اذكر قال عنه ده واد عواطلي ابوه اشتراله كمبيوتر وهو ولد قليل الأدب ولو تلاحظوا كل كلامه شتايم وقلة ادب على الآباء والامهات فأنا استغرب ازاي فيه ناس لسه مخدوعة بيه ، حتى منهم بنات وده ان دل على شيء فإنما يدل على ان من يعجب به او تعجب به هي من نفس شاكلته وبيئته."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

[[comments]]
order = 30
subject = "عن وائل وأشياء أَخرى"
author = "أبو دم تقيل"
posted = "2006-09-13"
text = "مش ملاحظين حاجة يا جماعة ان الاخ وائل رغم كل الكلام الكبير اللي بيقوله على الريس والمباحث وامن الدولة وبيروح يصور في المظاهرات والمباحث بتوع امن الدولة بيطاردوه ومعاهم الامن المركزي والمهلبي من شارع لشارع وقال ايه يطلع سليم الوله ومحدش يقدر يمسكه هع هع هع ، يعني انا عاوز افهم هم امن الدولة دول بيلعبوا بخراهم ما يعرفوش يجيبوه يحضنوه شوية من غير كل المطاردات البوليسية دي ؟ فعلا غريبة ازاي مسكوا علاء سيف ومحمد الشرقاوي وهو طلع من المعركة دايما سليم ولا حتى خدش في خدشه الاصلي!ّ<br />حبيبك يا وائل ابو دم تقيل"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

