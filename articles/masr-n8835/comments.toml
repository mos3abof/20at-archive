posted = "2006-09-11"
text = "أخى وائل كل ماكتب وما سيكتب ضدك فهو دليل على نجاحك وارجوا منك الصمود ضد كل هذه الادعئة البطل وسنستمر معاك<br />أم بالنسب لشيماء وليفى ألاهرامات اللى انتو بتكلموا عليها ده وواحده عاوز تبعاه وواحده بتنسبه ليه فوقوا من اللى انتوا فيها وكفايه الاهرمات ديه ملك لمصر وبس ومحدش يجى يقول تل ابيب ولاغيروها وكفايكم تفاها"
