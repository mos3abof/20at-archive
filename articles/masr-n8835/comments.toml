[[comments]]
order = 14
subject = "ميثاق شرف لعشرينات"
author = "حسين عبد الظاهر"
posted = "2006-09-11"
text = "أقترح على الأساتذة الأفاضل فى عشرينات أن نتحاور جميعا - المشرفين على الموقع والكتاب والمعلقين - فى إعداد ميثاق شرف للكتابة فى عشرينات سواء كتابة الموضوعات الصحفية أو التعليقات<br />لأن للأسف الشديد فى بعض الأحيان نجد لغة الحوار بين المعلقين تنحدر إلى الدرك الأسفل من الإسفاف والابتذال.<br />ربما يكون ميثاق الشرف هذا واضح ومحدد بشكل جيد لدى العاملين بالموقع لكن على ما يبدو أنه غير واضح لدى بعض المعلقين.<br />والمشكلةأن الذي ينقل خبرا أو كلاما مكتوبا فى الموقع يقول أن قرأت \"كذا وكذا فى عشرينات\" وينسب الكلام بحلوه ومره للموقع .. دون التفرقة بين ما يكتبه صحفيو الموقع أو ما يكتبه المعلقون .. لذلك أرى أن مسئولية المشرفين على الموقع ليست قاصرة على الموضوعات المنشورة إنما تمتد لتشمل كل كلمة أو حرف يكتب فى الموقع بما فى ذلك التعليقات<br />لست من أنصار استخدام أساليب حجب التعليق أو حذفه - وإن كان هذا الأسلوب هو الأمثل مع بعض النوعيات - إلا أننى اعتقد أنه من الأفضل أن تكون الرقابة ذاتية والالتزام نابع من داخل كل واحد منا<br />لماذا لا نجرب فكرة ميثاق الشرف هذه فإن لم تجدى .. نستخدم مقص الرقيب<br />حسين عبد الظاهر<br />husseinzaher@hotmail.com"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

[[comments]]
order = 15
subject = "الشجرة المثمرة دائما ما تلقى بالطوب."
author = "زنوبه"
posted = "2006-09-11"
text = "الشجرة المثمرة دائما ما تلقى بالطوب.<br />آنا لا آعرف وائل عباس ولم آقابله فى حياتى ولكنى رآيته يتحدث بثبات فى برنامج المدونون على قناة الجزيرة , من يخاطر بحياته لنقل ما يحدث من مصادمات وآحداث فى الشارع المصرى لا يمكن آن يكون مسنوى عقله متدنى ليكتب البذاءات التى يكتبها منتحل إسمه ـ ولذلك فمتذ آول يوم بداء نشر هذه الخزعبلات آرسلت لوائل عباس على ال CBOX الموجود على مدونته ورد على آنه لا يكتب فى آى موقع آخر وآن هناك من هم ينتحلون إسمه من مرضى العقول<br />آما ليفى بواسير هذا فإنه منتحل شخصية وائل عباس وشخصيات آخرى من ضمنها العربى الذى قام بسب نساء مصر فى مقالة \"العبايه فين\" يمكنكم ملاحظة إسلوب كتابته وبذءاته بمنتهى السهوله ـ إسلوب كتابة آى شخص مثل بصمة الاصابع من السهل تمييزها بتتبع ما يكتبه الشخص نفسه مهما قام بتغيير اللهجه وهذه مظريه معروفه فى علم النفس ـ كما آن هذا الشخص المريض هو آيضا معاذ ـ وعلى ما آظن هو آيضا عاشق زنوبه لآنه كرر إحدى المفردات فى إجدى سفاهاته \"معشوقتى\"<br />هذا الشخص المريض آتحفنا بقوله عن نفسه \"هذا راجع لثقافتى\" !!!!<br />فعلا ثقافتك باينه من كتاباتك ، ثقافة المجارى والمراحيض تتدفق من خلال كتاباتك"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

[[comments]]
order = 16
