subject = "lتاليه الذات"
author = "بسمه"
posted = "2006-10-31"
text = "معقولةانتممصدقين ان ليفي ده يهودى للدرجةدىاحنا وصلنا من السذاجة والسطحيةللاسف انتم شركاؤه لانكم بتردوا عليه وهو كده يكون نجح في استفزازكم وكل ما شتمتوه ازداد فرح واحساس بالانتصار عليكم هذة النوعيةمن البشر علاجها الوحيد هو اللامبالاة واحساسه انه غير موجود اساسا اما الموضوع التاني انا دخلت موقعه مرتيين و لي ملحوظة واحدة انه مصرى فرعوني عربى الهوى الموقع لا يخلو من اى قصاصة ورق ذكر فيه اسمه سواء جريدة او موقع او محطة فضائيه او وكالة انباء محلية او خارجية انه مهووس بنفسه زى كل الفراعنة بالاضافةللصفة التي يتمتع بها كل اصحاب الجلالة والفخافة الملوك والروساء العرب الا وهى استخدام ابشع صور الهجوم علي من يختلف معه في افكاره وخلط العام بالشخصي الحرية ليست شخصية ولكن للجميع و هو ما يتناقض في اسلوبه في الهجوم على الاخوان او هيكل او جريدة الدستور او اي من يختلف معهم في الراى التشويه صورة بائسة في بلاد وصلة درجة تاليه الذات الى اللا محدود"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

