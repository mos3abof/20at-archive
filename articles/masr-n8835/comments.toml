subject = "يوم خيبر ليس من حفلات الجنس"
author = "صعيديه"
posted = "2006-09-13"
text = "الاخ مصرى انت غلطت غلطه كبيره فى الرد على ليفى ده لانك قلت ان يوم خيبر وغزوة بنى قريظه وبنى قنيقاع من حفلات الجنس لاحبيبى دى ايام شهدها الرسول الكريم صلى الله عليه وسلم وما يصحش تقول عنها الكلام اللى قلته ده كلام مرفوض وجايز انك ما خدتش بالك من اللى بتقوله وانت بتكتب ردك على ليفى خنازيير اتمنى ان تستغفر الله على زلة اللسان دى وربنا غفور"
