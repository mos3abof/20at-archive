text = "على ما يبدو انها كانت حملة مهمة وذكية لرفع اسمك والتعريف به كصحفي وله موقع وانا متأكد ان الذي كان يكتب هذه المقالات هو انت شخصيامقالات الدخول في النصرانية والبهائية وما هي الا حملةمقصودة لكي يرتفع اسمك وموقعك في عالم الصحافة<br />يلا يا عم ابسط حتنهال عليك العروض والعقود من كل المواقع ودور النشر للكتابة فيها وقريب ان شاء الله حتضرب عادل امام بالجذمه"
