subject = "تحياتى من تل ابيب"
author = "ليفى معازيير"
posted = "2006-09-10"
text = "الى زنوبه انا لست معاذ مش عارف باقى اسمه ولاتحاولى انك تكونى ذكيه وانتى اغبى انسانه فى الوجود وكل اللى كتبتيه عنى تخيلات انسانه عانس واقولها للمره المليون انالا اكتب باسم مستعار ابدا لانى فخور باسمى وبوطنى وبديانتى وما بيغير اسمه الا اللقيط وبالنسبه للهجتى شاميه او مصريه هذا راجع لثقافتى وللعلم انا زرت مصر كثير ووقفت عند الاهرامات اللى بناها اجدادى لكم ولولاها ماحدا عرف مصر"
