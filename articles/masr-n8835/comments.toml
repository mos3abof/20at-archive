subject = "الحل بسيط جدااااااااااا"
author = "نيفين نيفى نوفا"
posted = "2006-09-13"
text = "اولا انا شيفه ان من حق البراء يكتب اللى هو عايزه فبلاش يا جماعه نحجر على حريه الناس الفكريه<br />ثانيا اقتراحى يا براء اان يتعنل شويه رقابه على الالفاظ النابيه من غير ما نحجر على الافكار برده<br />ثالثا و الله يا جماعه اى حد عاقل مش هيصدق ان دا وائل عباس و مش معنى كدا انى متفقه معاه بس لان محدش عاقل يكتب الكلام اللى اتكتب باسم وائل عباس و اعتناقه للمسيحيه و الحاجات دى<br />و طلب اخير لزنوبه و الناس اللى بترد على ليفى ارجوكم يا جماعه كبرو مخكو شويه و محدش يرد عليه<br />عايزين نعلى فكريا عن التفاهات دى بقى"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

