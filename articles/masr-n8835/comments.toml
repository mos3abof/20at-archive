text = "بيفكروني بمثل بيتقال في الحواري الاتنين عاملين زي راجل عيَان أغتصب جثة لراجل ميِت !<br />هو المثل شعبي وقبيح وأنا حاولت إني أعيد صياغة المثل لأن المثل قبيح حبتين !<br />شخصيتين برانويت عندهم جنون عظمة مش عارف على إيه ؟!<br />وللعلم ..الصحافة لمت زبالة الناس والعواطلية وقليلي الموهبة<br />عالم زبالة الله يقرفكو !"
