[[comments]]
order = 23
subject = "ارجع للجيتو تاني يا ليفي"
author = "مصري"
posted = "2006-09-11"
text = "الأستاذ ليفي المثق حسب ثقافته اللي صدعنا بيها<br />عاوز أعرف الأول هي ثقافة الجيتو ولا ثقافة الشتات و لا ثقافة الاحتلال و الجدار العازل و لا ثقافة قتل الأطفال و لا ثاقفة الذل و المهانة ...فاكر تاجر البندقية .. و بتشهد من توراتك أن انتكم اليهود سرقتم المصريين و أخذتم الذهب و الفضة منهم يعنى بشهادة التورات بتاعتك أنتم من يومكم شعب حرامي و نصاب ... و بتقول على نفسك و اليهود أخوانك أن انتم ملوك الجنس في العالم زز طيب أفكرك بآخر حفلات الجنس الممتعة ليكم<br />1- يوم الغفران 1973<br />2- جنوب لبنان 2000<br />3- جنوب لبنا تاني مرة 2006<br />***** وقبل ده كله<br />1- يوم خيبر<br />2- يوم بني قريظة<br />3- بني قينقاع<br />أقولك يا عم ليفي سيبك من موضوع الأهرامات و الجنس ده و أزرع شجرة غرقد أحسن لك أنت و اهلك . ... عارف ليه<br />علشان يومكم الأخير قرب !!!!!"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

