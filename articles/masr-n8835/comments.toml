text = "بالنسبة لموضوع الرقابة اعتقد انه مهم لأني قريت تعليقات كتير جدا ومقصدش الاخ وائل انا لسة معرفوش كويس انا بتكلم على اسأت الادب لقد قرأت تعليقاتبها الفاظ نابية واقل مايقال فيها انها قليلة الادب فياريت ننضج وناقش بموضوعية وادب علشان الكل يستفاد ..........<br />وحزاري حزاري من دعاة الفتنة ومثير التعليقات المقصودة"
