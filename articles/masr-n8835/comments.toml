[[comments]]
order = 20
subject = "So Pathetic"
author = "زنوبه"
posted = "2006-09-11"
text = "ليفى آبتدا يدلق خرى من عقله الى شاشة الكومبيوتر ـ مش قلت لكم ثقافة المجارى والمراحيض<br />وبعدين إنت جايب كتاب محرف بتستشهد بيه ـ كتابك المحرف ده تبله وتشرب ميته لآن توراة موسى راحت من زماااان ـ ضيعتوها بتحريفكم وجهلكم، طيب حرفة حاجه وآلفتها من عندك إسبكها بقى؟ نسيت تكتب لنا عن النصوص التوراتيه اللى بتتكلم عن معاشرة الانبياء والمحارم!!! إتفوااا عليكم شعب نجس ـ لم تتركوا حتى آنبياء الله وحاولتم النيل من شرفهم ، إدعيتم على نبى الله إبراهيم وشعيب ...الخ<br />ثم قمتم بتآليف كتاب آخر وهو التلمود ، كتاب ملىء بالعنصريه والحقد المريض على كافة الاجناس. يبدوا آن الحقارة جين يهودى<br />حتى حل عليكم غضب الله وسخطكم قرده وخنازيير ـ صنف ملعون وفنائكم سيكون على يد المسلمين بإذن الله<br />الثقافة اللى إنت جاى منها واضحه جدا جدا ، وضوح الشمس وبنشم ريحتها كل ما بنقراء تعليقاتك ـ الفراعنه كانو بيختموا قفا آجدادك علشان ما يختلطوش بالمصريين! وفى آوروبا كنتم تعيشون فى جيتومنبوذين وكان مفروض عليكم لبس هباب لونه آحمر على دماغمكم لتمييزكم بين العامه ، طوال تاريخكم صنف مرفوض وملعون ويتآفف منكم كافة الاجناس.<br />للآسف هتلر لم يكمل مهمته النبيله فى تنظيف الكره الارضيه منكم ـ ولكن نحن سننهى هذه المهمه بإذن الله<br />ومالك كده حتموت علشان تعرف آى حاجه عن حياتى الخاصه إذا كنت متجوزه آو لآ , ما تتعبش نفسك مش ح آوضح آى حاجه عن حياتى الخاصة.<br />يا ترى إنت الى بعت شتايم لوائل عباس بالعبرى على الموقع بتاعه برضه؟؟!<br />واضح قوى من ردك الاخير إنك متغاظ ومتنرفز علشان إتكشفت !! للدرجه دى مقهور؟؟!!<br />وبعدين ده إنت كده بتدمر نفسبا ـ طول النهار قاعد قدام الكومبيوتر بتكتب فى شتايم آو تعليقات تحاول تضايق بيها الناس آو ميتنى ردود<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

