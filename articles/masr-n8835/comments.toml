[[comments]]
order = 5
subject = "إلى ليفي معازير"
author = "مواطن مصري أصيل-مش يهودييييي"
posted = "2006-09-11"
text = "لو كنا بنبيع مصر ماكناش خرجناكم منها براس مطاطية وقلب متحسر والدمعة على خدكم بعد ما سيحنا دمكم على ترابها الغالي ...اللي لسه بننضف فيه لغاية دلوقتي منه.<br />وبعينك يا ليفي انت وهماان مصر تكون ليكم وطن...عموماً تشجيعاً للسياحة في مصر هنسيبكم تتفرجوا على آثار أجدادناأو أجدادكم ما تفرقش بس هيا على أرضنا،ولازم تدفعوا تمن الفرجة-ههههههه-.<br />قال ربي الله العلي العظيم:-\" وقضينا إلى بني إسرائيل في الكتاب لتفسدن في الأرض مرتين ولتعلن علواً كبيراً - فإذا جاء وعد أولاهما بعثنا عليكم عباداً لنا أولي بأس شديد فجاسوا خلال الديار وكان وعداً مفعولاً\".<br />نسأل الله أن نكون نحن -أهل مصر-بارك الله في أرضها وفي شعبها ونيييييييلها وسماءها.......وسيناءها-ابتسامة-."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

[[comments]]
order = 6
subject = "حسبى اللة ونعم الوكيل"
author = "حكمت على احمد حسن"
posted = "2006-09-11"
text = "لاحول ولا قوة الا باللة العلى العظيم وائل واللة ماتقول ربنا يسامحهم ربنا يخلصنا منهم هما والحكومة والبية وولادة ومراتة فى يوم واحدانا من اشد المعجبين بفكر وائل عباس وبشجاعتة واحترامة لنفسة ودينة وعمرى ما اصدق ان وائل يغير ديانتة علشان بنت ولا حتى اورطة بنات اللى زى وائل عباس مش بيبع قضيتة بالسهل كدة ودة سر اعجابنا بية من زمان من اول مابدء الكتابة وانا متابعة كل كتاباتة وعارفة اسلوبة كويس وعارة ممكن يقول اية وميقولش اية وائل انسان محترم جدا وحسبى اللة ونعم الوكيل فى اى حد يحاول يهدة لو يشوة صورتة هو حرام يبقى فية بنى ادم يقول كل اللى نفسنا نقولة ما دومنل احنا مش قادرين نقول لا عتبارات كتيرة كمان عايزين يشوهو البنى ادم اللى بيعبر عننا<br />ولسة يا وائل بتقول اللة يسامحهم اللة ياخدهم جملة ان شاء ويريحنا من زبانية جهنم الخونة الزبالة اللى لا عندهم دين ولا ضمير ولا دم واللة العظيم يبقو ا يورونى هيقفو بين ايدين ربنا ازاى ولاد ولا بلاش ناهيك عن الغلط"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

[[comments]]
order = 7
subject = "انتة اغلى من زفت دة"
author = "حكمت على احمد حسن"
posted = "2006-09-11"
text = "انتة اغلى عندنا من مايكل جاكسون على الاقل انتة مسلم وراجل واحنا عارفين كدة لاكن صاحبك دة فية شك انة يكون راجل يبقى ازاى يا وائل تشبة نفسك بيةدى حاجة الحاجة التانية البلدى بقت زى ماقريت فى مقالة محتلة من كل من هب ودب يبنىولسة بتدورو لية موديلات 1980ولا1981 يا عم دع الملم لصحابة واصحاب البدى احنا غلابة فبهاواللة العظيم انا خايفة ييجى علينا يوم ويقولو اننا احنا خلاص موديلات وخلصت وراحت علينا من كتر الهم بس بقولك سيبك المقال بتاع السادات هايل واللة العظيم اللهم قوى ايمانك يبنى احنا معاك قلبا وقالباوكمان الصور بتاعت ايران هما عندهم قهر وقمع زى عندنا بردة دا انا كنت فاكرة اننا فى الصدارة فى المواضيع دى يا ترى الخناقة بتاعة النسوان دول كانت لية حد يعرفلو حد عرف يقولى والنبى علشان هموت واعرف يلا هما هيروحو من ربنا فين"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

[[comments]]
order = 8
subject = "مصر ايه الي حنبيعها"
author = "شيماء"
posted = "2006-09-11"
text = "يا جماعة الله يكرمكم مصر ايه الي حنبيعها بس هتتباع اكتر من كدة ايه مش كفاية الحكومة . القصة و ما فيها ان اونكل ليفي بيحلف بكل الايمانات انه يهودي اسرائيلي من تل ابيب فاضل شوية و يحلف علي دليل التليفونات ماشي يا عم ليفي اسرائيلي اسرائيلي جاتك داهية انت و كل الاسرائيلين امثالك و بيقولكم الاهرام بتاعتنا و بتاععت اجدادنا خدوه علي قد عقله و قولوله تعالي خدها هي مش بتاعتك و لو نهر النيل بتاعك كمان تعالي خده ياخدك ربنا و يريحنا .<br />رغم كل خطط اليهود لافساد شباب مصر سواء فساد اجتماعي او اخلاقي او اعلامي او سياسي و كل دة لاضعاف مقاومتة لما اسرائيل تحب تحارب مصر الا ان رسولناالكريم صلي الله عليه و سلم قال و قوله الحق \" اتخذوا من مصر جنودا فان جندها خير اجناد الارض\" يعني مهما خططتوا و نفذتوا و خطتكم بانت انها ناجحة علي المدي القصير لازم خططتكم تفشل لان الفشل انكتب عليها من اكتر من 1400 سنة.<br />اونكل ليفي اذا كنت فعلا اسرائيلي يبقي انت راجل فاضي و موراكش شغلانة اما اذا كنت مصري و بتمثل دور اسرائيلي فتلك هي الكارثة و شر قدوة اخترت."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062359/http://masr.20at.com:80/article.php?sid=901"

