text = "وشرف ماما الطاهره الطيبه الحنونه ام ليفى معازيير التى انجبت اعظم شخصيه فى الوجود وهو انا لبفى معازيير التى تتمنى نصف نساء تل ابيب صداقته.. اننى لست واحد ممن ذكرتى بازوزو وانا لااتشرف بوائل عباس المزيف ولامعاذ ولا ولا ولا ولا لانه انا انا ولا ااتمنى ان اكون انسان آخر وكل ما تقولينه عنى تخيلات امرأه عانس.. ما تتجوزى يهودى وترتاحى وتحسى يالمتعهلاننا معشر اليهود اسياد الجنس فى العالم"
