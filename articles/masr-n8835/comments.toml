text = "أحييكم ولاد البلد على هذا المجهود الرائع وأحييى كل الاخو الذين شاركوا بالردود التى لاتحتوى على ألفاظ خارجه وتحيه خاصه لزنوبه على ردودها الاكثر من رائعه على ابن القرده والخنزير ابن ام ليفى مش عارفه ليه لماقريت ردودك يا زيفى تذكرت وش خالتك جولدا خنزير وهى بتستمع لكلمه القائد العظيم السادات بعد ما اسيادك المصرين قعدوكم على الخازوق فى 73 انت عارف مشكلتكم أيه يا زيفى انكم مش عايزين تصدقوا أنكم شعب جبان حقير وان لولا اسيادكم الامريكان كنا دوسنا عليكم بالجزمه زى الحشره من زمان ويا ريت تسمعنا سكاتك ولا اجيبلك نصرالله يابن المستخبيه"
