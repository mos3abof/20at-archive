text = "ابوها قال مفيش داعى منها قلت انا لأ دا حق من حقوقها ودى الأصول وطلبت منة كتابتها وبعد يومين طلبنى عشان اوقع عليها و الله من غير ما ابص فيها اية لكن بعد كدة أكتشفت أن حتى الهدايا الى حائتنى من أهلى و أصحابى كانت ضمن القائمة هو ده مقابلة المعروف"
