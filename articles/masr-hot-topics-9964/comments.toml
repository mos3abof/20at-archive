text = "السلام عليكم<br />انا رأئى ان قائمة المنقولات حق شرعى وجنائى للزوجة لكن لازم كلا الطرفين يراعوا ضميرهم والمنقولات يتم كتابتها بما يرضى الله يعنى بدون مغالاه ولا ظلم للزوجة . والف مبروك لكل عريس وعروسة"
