text = "لم تحدث ولكن على وشك الحدوث لان حماتي اشترطت 100 الف جنيه في القائمة وكل ما طلبته منهم تحديد الاشياء التي تم شراءها بالفعل وكتابتها في القائمة حتى لو وصلت الي 150 الف جنيه مفيش مشكلة طالما الحاجات ديه هتدخل شقتي<br />وشكرا"
archived = "2009-06-19"
