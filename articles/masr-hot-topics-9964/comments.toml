posted = "2008-10-11"
text = "مبروك لكل عروسة و عريس و بصراحة موضوع القائمة ده مهم ما حدش ضامن حد انهارده و لكن بلاش اهل العروسة يعملوا مشكلة خليها فى المعقول يعنى نكتب الحاجة الموجودة بالفعل و بعدين فى ناس بتعرف تاخد حقها لو لا قدر الله حصل حاجة بطرق كتير غير القائمة المهم يكون العريس يستاهل العروسة و الف مبروك لكل العرايس"
archived = "2009-06-19"
capture_url = "https://web.archive.org/web/20090619075713/http://www.20at.com:80/masr/t7kyk/9964.html"

