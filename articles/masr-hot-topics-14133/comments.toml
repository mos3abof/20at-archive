author = "محمد الجزائري"
posted = "2009-11-29"
text = ". والله لما كنت أتفرج على القنوات كنت أتمنى أن يخرج علينا صوتا عاقلا ويعارض كل ما يقال صراحة، لقد كانت رؤيتنا هنا في البلد الحبيب الجزائر أن هناك تواطا مقصودا من الجهات الرسمية في بث هذه الأحاسيس ،وهنا أتحدى أي واحد أن يأتينا بدليل للسب أو القذف في المقدسات المصرية من طرف الصحافة الجزائرية قبل مبارات 14 نوفمبر، وبالعكس عندنا عشرات التوثيقات على اليوتوب من قنوات مصرية نزلت هتكا واباحة لكل ما هو جزائري ،كنا سنقبل لو أنه طلع واحد من المذيعين قبل المباراة ،وقال اعتذر عن ماقلته وفهمه أخواني الجزائريين غلط .كان حتى أخواننا المصريين سيفهمون بانه خطا ولم يكن في ذاك الاتجاه … يتبع ."
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130044034/http://www.20at.com:80/masr/hot-topics/14133-2009-11-22-14-50-20.html?"

[[comments]]
order = 20
subject = ""
author = "محمد الجزائري"
posted = "2009-11-29"
text = "والله لو في بيننا انسان حيادي حقيقي بغض النظر عن أنو مصري أو جزائري ويعيد النظر في الأحداث من بدايتها سيتأكد من أن بعض القنوات المصرية أقول بعض هي اللي بدأت في تهييج الشارع المصري واللي ممكن أني أعذره في تلقي ذاك السيل العرم من أن الجزائريين لايحبون أن تفوز مصر وأنها لديهم ضغينة تجاه كل مصر .والعجيب أن مصادر معلوماتها كانت جس نبض من النت ،عمركم شفتم منبر أعلامي ياخذ مصداقية بثه من النت ،هذا النت مباح لأي واحد يتكلم منه .ومستحيل لما يكتب فيه أو يصور عليه بعض عشرات من الناس جزائريين أو يدعو أنهم جزائريين ،نأخذها كمصدر يمثل شعبا كله …يتبع"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130044034/http://www.20at.com:80/masr/hot-topics/14133-2009-11-22-14-50-20.html?"

