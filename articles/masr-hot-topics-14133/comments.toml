subject = ""
author = "ششناق"
posted = "2009-11-29"
text = "يا مصريين اصحوا … نحن الجزائريين اي الامازيغ حكمنا مصر قبل الميلاد من طرف ششناق ثم جاءت الدولة الفاطمية و بنت القاهرة و الازهر ففضلنا نحن عليكم .اما بعد<br />لبد ان تفهموا ان نجل حسني مبارك دخلكم في دوامة لكي يربح شعبية و يورث من طرف ابيه خائن الامة . و لقد اصبحت عادة عندكم الرئيس يورث ابنه و الممثل يورث ابنه لكن ابن الفلاح يبقى فلاح فالمشكل ليس بكرة قدم فالمشكل الحقيقي داخلكم . ولقد مضى عهد البطولات مع عبدالناصر و كرهكم العرب منذ اتفاقية كامب دايفيد و انتم تعلمون ذلك فيقوا بقة تتركون محمد البردعي الرجل العالم الكمل و تذهبون وراء خنفس ابن الخائن للامة حسنية …اما بالنسبة للخرطوم فانتم من اختار المكان و نحن قبلن به لانه بلد الاشراف و قلنا لكم ستدفعون الثمن غالي للدم الذي سال في القاهرة و انتظرناكم في الخرطوم و لم تأتوا لأنكم جبانا و نحن اتينا من اكثر م 6000كلم لانكم كالكلاب تنبحون و تنوحون امام دياركم . و الله سنضربكم في اي مكان في العالم و البادي اظلم لاننا نحن الجزائريين رجال و الذكي يربحنا [ *** ]ديق و لا يخسرنا كعدو فويل لكم يا ابناء فيفي عبده 123 viva l'algerie"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130044034/http://www.20at.com:80/masr/hot-topics/14133-2009-11-22-14-50-20.html?"

