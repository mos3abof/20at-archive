text = "ياجماعه انتو بتتخنئو على ايه الجزائر سمحت لليهود ان تحمل الجوازات الجزائريه ويشجعو فريق الجزائر وهم على شاشات التلفاز يلوحون بايديهم للجمهور المصرى باوضاع غايه فى قلة الادب فهل يعاتب المصرى الجزائرى الذى تحالف مع الشيطان ليكسب المباراه فانا اقولها على المثل المصرى عتاب الندل اجتنابه وعاشت مصر فوق الجميع"
