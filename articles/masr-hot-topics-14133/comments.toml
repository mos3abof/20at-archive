posted = "2009-11-28"
text = "انا بقول اسمى الحقيقى مش دى الخيفين وكتبين اسامى غير اسميهم الى بيقول اسمه سمسم ومواطن مصرى اصيل وميدو مشاكل ولى كاتب اسمه بالانجليزى مدام هو مصرى ميكتب اسمه باللغهالانجليزي ه ليه (مصطفى) انا مش خيفه من حاجة مصر بلد دمقراطية وانا مواطنة مصرية يعنى انا حره اقول الى انا عوزاه انا عندى 13سنة انا اخدة فى الجغرفية ان احنا من الوطن العربى و الجزائر من الوطن العربى ومن قارة افريقيا بس انا كنت فهمة الوطن العبى غلط انا كنت فكرة ان احنا اخوة و الله حسنى مبارك احسن رئيس في الوطن العربى كلة راح ساعد الفلسطين باكل وشرب وغطا ومسمعتش عن اى بلد ساعدة الفلسطين وادى جة يوم الاخوة تتخانق مع بعضها و هم الغلطنين خلو اسرائيل تخش في وسطينا وحولو متش كرة الى معركة و الله لو كانت الجزائر كسبت بدون اى شئ من الى عمالوا كنت هشجعهم لكن انا دلوقتى هشجع الى بتلعب دضها"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130044034/http://www.20at.com:80/masr/hot-topics/14133-2009-11-22-14-50-20.html?"

