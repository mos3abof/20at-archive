[[comments]]
order = 26
subject = ""
author = "خالد التونسي"
posted = "2009-11-29"
text = "أرجو عدم التفاعل مع الموضوع لأنه وبكل بساطة كذب في كذب<br />بدل أن يعترف المصريون الظالمون على التعدي وما يزال التعدي على أبناء الجزائر في القاهرة لطلبة مسالمين جاؤو إلى مصر لطلب العلم لا غير<br />فبدل أن يعتذر المصريون من حماقاتهم ها أنتم ما تزالون تفترون وتكذبون ووو بكل الطرق لإدانة الشعب الجزائر<br />وعلى فكرة الشعب الجزائري يحتفل وما يزال يحتفل بنصره الكبير ولا يلتفتون إلى مثل هذه الخزعبلات<br />أرجوكم اعترفوا انكم خسرتم مبارات في كرة القدم لم تخسروا الدنيا يا مصريين<br />المكالمة مفبركة ولا دليل على من يتكلم جزائري ولمذا يعتذر الجزائر والله عجيب<br />كل العالم أدان ما فعله المصريون من اعمال ارهابية ضد المنتخب الجزائري<br />أدخلوا المواقع العالمية وتقرؤون بأنفسكم سخط العالم كله ضد مهزلتكم<br />الله يهديكم<br />خالد التونسي"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130044034/http://www.20at.com:80/masr/hot-topics/14133-2009-11-22-14-50-20.html?"

