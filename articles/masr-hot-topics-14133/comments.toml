author = "أمحمدحجازى"
posted = "2009-11-29"
text = "عملتوا لهؤلاء البلطجيه الجبناء قيمه أيه الجزائردى شعب همجى بربر وفى غاية السفاله والأنحطاط( **ج— جزم ولادجزم / ز— زبالة العرب / ا— أرخم وأوسخ خلق الله / ئ — أ أتم شعب فى العالم / ر— رمة العرب ) الأغلبيه منهم أما حرامى أوبلطجى أوقواد بيتمسحوا فى العرب دول شعب خليط لايفقه شئ عن العروبه أو الأسلام فى كل مكان يذهبوا أ ليه يدنسوه دول مش بشر دول شوية بقر أن كان العرب بالشكل ده أتبرأ من عروبتى أقل مايقال عنهم وصمة عار فى جبين العروبه بؤره سرطانيه يجب أستئصالها"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130044034/http://www.20at.com:80/masr/hot-topics/14133-2009-11-22-14-50-20.html?"

[[comments]]
order = 13
subject = ""
author = "رحمه رفاعة الطهطاوى"
posted = "2009-11-29"
text = "طارق بجد كلام حقيقى بس انت عارف احنا اكبر غلط بنعمله اننا بنرد عليهم بالكلام دول المفروض محدش يرد عليهم لاننا شعب متحضر وفيه تربيه زى ما انت قولت لاننا علشان مؤدبين بنقول دول قله غير محترمه لان في كتير من الجزائيرين محترمين لكن القله دى كتير قوى عليهم اننا نرد لايمكن ينزل مستوانا لكدة دول يا بابا مجموعه حقودة علينا واكيد ربنا مش هيسامحهم فى اللى عملوه دة<br />كرامه المصرى فوق اى اعتبار وفوق الجميع ومحدش يقدر يمسها بكلمه حتى<br />وحلوة قوى النكته دى"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130044034/http://www.20at.com:80/masr/hot-topics/14133-2009-11-22-14-50-20.html?"

[[comments]]
order = 14
subject = ""
author = "طارق الفرحان مصري"
posted = "2009-11-29"
text = "السلام عليكم يا مصريين<br />انا شاب مصري واول مره ادخل الموقع ده بس انا فعلن فرحاب لاني شوفت التعليقات الي موجوده انا بس عايز اقول حاجه مش هي الجزائر فعلن منتخبها راح المونديال انا بقي قاعد مستني اشوف هيرجعوا منها بايه من هناك اكييييييييييييي يييييييد هيرجعوا وقفاهم بيقمر عيش<br />والبكا علي وشهم وساعتها انا هكون اول الفرحانين بس ياريت ساعتها يفوقوا لنفسهم<br />وبالنسبه للتعليق الي قايل ان الجزائريين دخلوا مصر قبل الفاطميين فانا اقوله روح شوف بدلك اما دخلها الفرنساويين وشوف كمان مين الي طلعهم من عندك يااستاذ يا متعلم علي ما يبدوا ان الخمر لحس عقلك والي اكتر من كده شوف ماتش الجزائر وفرنسا وشوف عملتوا ايه هناك والي جايين يتعملوا هنا في مصر ماعندناش تعليم لان عندنا التربيه بيتسبق التعليم فين بقي تربيتكم ؟ مافيش<br />سمعتوا ياجماعه اخر نكته؟ بيقولك واحد جزائري نام حلم انه بيوزع فلوس صحي قال وحياه امي ما هنام تاني"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130044034/http://www.20at.com:80/masr/hot-topics/14133-2009-11-22-14-50-20.html?"

[[comments]]
order = 15
subject = ""
author = "رحمه رفاعة الطهطاوى"
posted = "2009-11-29"
text = "احب الاول اقول كل عام وانتم بخير للآخوة المسلمين انا حقيقىمزهوله من اللى بيحصل دة بين العرب انا حاسه بجد القيامه قربت فى الوقت المفروض فيه العرب يتحدوا ضد اليهود للاسف الشديد بنقطع فى بعض دة شىْ محزن بجد<br />حسبى الله ونعم الوكيل فى اللى كان السبب فى الفتنه دى معقول لعبه تعمل كدة فينا<br />ربنا يسامحهم على عملوا فينا اه ربنا غفور رحيم بس معتقدش ممكن يسامحهم لان ربنا والرسول الكريم عليه افضل الصلاة واذكى السلام وصاهم على ارض مصر وقالوا<br />ادخلوا مصر أمينين"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130044034/http://www.20at.com:80/masr/hot-topics/14133-2009-11-22-14-50-20.html?"

[[comments]]
order = 16
subject = ""
author = "محمد الجزائري"
posted = "2009-11-29"
text = "جيناكم للسودان من بعد 6000كلم وأنتم بينكم والسودان ما بين محافظة وأخرى على حسب ما تغنيتم به ، وأن لكم بالسودان جالية تقدر ب 40000مصري يعني تريدون أن تخوفونا لكن ذلك زادنا أصرارا على الذهاب وهذه صفات الأبطال ، وعلى فكرة لو كنتم تحسبون أن الدولة نقلتنا مجانا فأنتم مخطئون لقد صرفنا من جيوبنا سعر التذكرة التي خفضت حقا حتى تكون بنفس قيمة التذكرة من مصر وهنا لما تساوت الأمكانيات والفرص ظهر جليا من له النخوة وحب الوطن والكرامة -يعني حتى فنانيكم الذين لهم الامكانيات للتنقل من جيوبهم نقلتهم الدولة أما البقية ففضلت لقمة العيش في الديار على شرف الدولة الذي كانت تنوح وا مباركاه .اذن أفيقوا نحن قوما نكرم من أحبنا وويل لمن تطاول علينا ..وكنت حسبتكم فهمتم مغني من عندنا يقول الجزائريين رأس واللي يخرب فينا باصا .يعني يندم"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130044034/http://www.20at.com:80/masr/hot-topics/14133-2009-11-22-14-50-20.html?"

[[comments]]
