author = "محمد الجزائري"
posted = "2009-11-29"
text = "لكن العكس هو الذي حدث .كل يزيد صبا للزيت على النار.وأنا من جهتي كجزائري وبمتابعتي لما كان يبث من مصر الشقيقة على مسمع ومرأى الكل. فهمت أن الجمهور المصري أستقبل الرسالة كما بثت له ونزل يقارع الجمهور الجزائري على جوانب الطريق ويفعل فيه ما لا يفعل بعدو . الذي أخذ بغدر من أخ كان يظن به خيرا حتى لو نفخت أبواق الفتنة في أذنيه . ولما أرادها الله أن تحسم في السودان لم تكن عبثا -هنا أسجل مثلا جزائريا في ما معناه لما يضرب أحد في غيرحومته -قريته- يقول للمترجل عليه أخرج لبعيد واريك من الرجل .وذاك ما حدث فعلا لما ترجلتو علينا في بلادكم وبين أهليكم 80 مليون وهذه ليست صفة حسنة …"
