subject = ""
author = "انفلونزا كرة القدم"
posted = "2009-11-22"
text = "للدول المتخلفة التى لا تعرف ان لعبة الكرة مجرد لعبة<br />وان اللعبة ليست مجال للفخار والانتصار اذ ان اللعبة ليست ميدان قتال ولا فية احتلال اراضى<br />اللعبة نهايتها winner or looser ومفيش فيها victory احنا مش فى ميدان قتال<br />احنا لعبنا مع الجزائر وخسرنا امامها - خلاص<br />مفيش حاجة تستدعى قطع العلاقات ولا طرد المواطنين ولا ايقاف اثتثمارات<br />ان ما يحدث خبل<br />ولو اتصل بى جزائرى هقول اهلا وسهلا<br />ما حدث اشبة بالفزع الذى اصاب الناس من انفلونزا الخنازير"
archived = "2009-11-23"
capture_url = "https://web.archive.org/web/20091123164945/http://www.20at.com:80/masr/hot-topics/14133-2009-11-22-14-50-20.html"

