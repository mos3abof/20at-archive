subject = ""
author = "محمد علي سعيد * مصر"
posted = "2009-11-28"
text = "بسم الله والصلاة والسلام على رسول الله ( يا أبناء الدين الواحد كفاكم هتك الاعراض على شاشات الكمبيوتر لأنها أعراض نساء فاضلات فهم امي وأمك وأختي وأختك وبنتي وبنتك ان اسرائيل الان في قمة سعادتها مما تسمعه وتقرأه من أبناء الاسلام على شاشات الكمبيوتر انهم الآن وعلى صفحات جرائدهم ينشرون للعالم اجمع يقولون هؤلاء هم العرب هؤلاء هم المسلمون * يا أبناء الدين الواحد ياأشقاء * نقول للجزائريين مبروك لكم وأقول لأبناء بلدي خيرها في غيرها وما حدث من الطرفين فقد حدث من قلة متعصبة لا تمثل بأي حال من الأحوال شعب البلدين بأكمله ولنترك ورائنا هذا اليوم المشئوم ولنتصافح ونتسامح فهذا هو اسلامنا دين التسامح والعفو عند المقدرة ولنتمسك بهذا الدين ولنقول لأعدائنا لن نفترق لن نعطيكم الفرصة وسنتمسك بديننا وسنتحد سويا ونقف أمام كل من يريد فرقتنا وسنعمل بكلام الله سبحانه وتعالى( واعتصموا بحبل الله ولا تفرقوا ) وستجتمع قوة الأسلام وتضرب بيد من حديد كل من تسول له نفسه لزعزعة الأمة الأسلامية ومهما حدث نحن اخوة وسنظل اخوة"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130044034/http://www.20at.com:80/masr/hot-topics/14133-2009-11-22-14-50-20.html?"

