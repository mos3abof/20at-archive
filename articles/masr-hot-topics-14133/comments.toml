text = "باالتا كيد انا مؤيد لجميع الاصوات التى تحاول ان تعمل على تهدئه الاجواء بين الشعبين المسلمين الشقيقين فكفى ما تعا نيه الامة من خلافات و حتى لا ننسى من هم الاعداء الحقيقينن<br />ومهما يحدث بين الاخوة فسوف يظلون اخوة رغم انف الحا قددين"
