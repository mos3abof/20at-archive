posted = "2009-11-28"
text = "ماشي اكيد مش هنحت الجزائرين كلهم في سله واحده بس المشكله ان الحكومه هي المسؤله في كل ده وكلب السفاره اللي لازم يضرب بالجزمه قبل مايسافر بالجزمه وغير كده ان السفاره المصريه هي المسؤل الاكبرفي اللي حصل بجد انا قرفانه من اللي حصل والله انا مش زعلانه علشان انا مصريه بس ولاكن لاني عربيه حزينه اذا حصل في اي بلد احنا عرب ازاي يحرقوا اعلامنا مع اليهود اللي بينتهكوا حقوق العرب والمسلمين بجد عيب عيب عيب اوووويوالله المصري غالي بس حكومتنا اللي مرخصاناا علشان كرة يحصل كده بعا ده مش سبب اكيد في سبب تاني وكلنا عرفين والاستاذ الجزائري اللي بيكلم بيقول لمحمد لو جيت محديش هيعملك حاجه امل ليه المصرين اللي هناك اضربوا وحرقوا الشركات المصريه حد يفهمني"
archived = "2009-11-30"
capture_url = "https://web.archive.org/web/20091130044034/http://www.20at.com:80/masr/hot-topics/14133-2009-11-22-14-50-20.html?"

[[comments]]
