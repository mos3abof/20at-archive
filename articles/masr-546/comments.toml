posted = "2006-06-20"
text = "انا معنديش خبره فى النقدبسس ان حأول إحساسى وهو ان صيف فيه افلام كتير فأنا طبعا مش حخوش فلم لا دعيتوة شدتنى ولا خلتني حتى افتكر اسم الفلم و\"شفرة دافنشى\" كانت دعيته اكبير من جودة الفلم ذات نفسه فالدعية الضعيفةتعنى فلم ضاعيف و لا تعنى فلم قوى ."
