[[comments]]
order = 0
subject = "حسبنا الله و نعم الوكيل"
author = "واحد معدي"
posted = "2005-12-11"
text = "لا تحزن معاك الله يا أعظم شعب<br />لا تحزن بعون الله يهون الصعب<br />و لا تبكي يا فلسطين على حالك<br />حقك ترفعي راسك بأبطالك"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114917/http://www.20at.com/article2.php?sid=55"

[[comments]]
order = 1
subject = "الله بعين"
author = "معاذ مسعود"
posted = "2005-12-11"
text = "السلام عليكم ورحمة الله وبركاته<br />اخوتي الكرام في فلسطين الصمود والتحدي ما هي الا ايام معدودة حتى يندثر هذا الاحتلال من الارض الفلسطينية...صبرا اهل فلسطين صبرا اسرى فلسطين صبرا اليكم جميعا والله ينصركم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114917/http://www.20at.com/article2.php?sid=55"

[[comments]]
order = 2
subject = "صبراً آل \"فلسطين\"..."
author = "احمد عمر"
posted = "2005-12-11"
text = "هذا الجبن و الخوف الكائن في صدور هؤلاء الشرذمه الأوغاد , لا يسيل من أعينهم و يظهر علي أطرافهم ,إلا من رعبهم من إخواننا المجاهدين.<br />فواله لا يزيدهم الله غلا فوق الثبات تمكين و فوق التضحية إقدام.<br />فإثبتوا و النصر لكمو لنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114917/http://www.20at.com/article2.php?sid=55"

[[comments]]
order = 3
subject = "عم تتحدثون"
author = "Dabdoob"
posted = "2005-12-12"
text = "لا اعرف حقا عم تتحدثون عن قسوة الاسرائيليين في معاملة الاسري!!!!<br />او ليس هذا طبيعي كما اظن<br />ثم من اين ياتي الذين علقوا قبلي بكل هذه الثقة في عودة فلسطين<br />فلسطين ضاعت وانتظروا البقية في الاعداد القادمة<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114917/http://www.20at.com/article2.php?sid=55"

[[comments]]
order = 4
subject = "الخير باق"
author = "علي يوسف"
posted = "2005-12-12"
text = "الخير باق في امتي الى يوم القيامة وان شاء الله سنحقق نصر فلسطين رغم كيد الكائدين، واسرائيل ستنكسر شوكتها بعون الله.<br />والله اكبر والنصر للاسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114917/http://www.20at.com/article2.php?sid=55"

