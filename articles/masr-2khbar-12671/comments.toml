author = "مصرى"
posted = "2009-07-16"
text = "انما الزكاة للفقراء والمساكين هكذا نص عليها شرعا<br />انما المفتى والفذلكة بتاعتة واللعب بالتفسيرات وحديث عمر بن عبد العزيز فهذا يمكن قبولة فى حالة واحدة اذا لم يوجد فى المجتمع فقراء ومساكين<br />الزواج لا يحتاج الى مال<br />شرعا قليل من المهر وميسور وقليل القليل من الاثاث<br />يعنى ناكل زيتونة ونتعشى بطاطا<br />انما الفقير المحتاج الى طعام وزكاة فالزكاة لة<br />الغير قادر على الزواج حسب الحديث يا معشر الشباب الخ الخ فعليكم بالصيام<br />فتواك غير مقبولة يا شيخ"
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719234453/http://www.20at.com:80/masr/2khbar/12671-2009-07-16-07-21-55.html"

[[comments]]
order = 1
subject = ""
author = "االزواج بالصدقة"
posted = "2009-07-17"
text = "ولما الشاب يتزوج بالصدقة<br />يبقى ياكلها باية<br />يمشى فى الشارع ويقول للة يا محسنين عندى عروسة وعايز اطعمها واشربها واجيب لها خدامة فلبينية<br />اية قلة الحياء دى<br />الزواج للقادر ماديا واللى يقدر يفتح بيت ويصرف على زوجة واطفال<br />والموضوع مش هنساعدة ببطانية والا بسرير<br />الزكاة للفقراء والمساكين لاطعامهم وسد حاجاتهم<br />وبعدين المفتى مش حاجة مقدسة دة شخص موظف عند الحكومة ومفيش قداسة فى الاسلام ومن حقى اسمع راية ومن حقى ارفضة ولو غلط من حقى اشتمة زى الحمار اللى افتى برضاعة الكبير وشرب بول البعير وضحك علينا امم الارض من شرقها ومغربها<br />مفتى ال<br />يروحوا فى ستين داهية شوية عالم متخلفة"
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719234453/http://www.20at.com:80/masr/2khbar/12671-2009-07-16-07-21-55.html"

[[comments]]
order = 2
subject = ""
author = "بنت مصرية ف الإمارات"
posted = "2009-07-17"
text = "أنا من رأيي أولا منقولش على مفتي مصر بيتفزلك<br />لأن الكبار علمونا منغلطش في حد سواء صغير أو كبير<br />ممكن نتناقش بصورة حضارية وكل واحد يثبت رأيه<br />وأنا من رأيي إن الزكاة للناس إللي مش لاقية تاكل فعلا بس من ناحية الزواج الرسول قالنا اللي مش قادر يصوم<br />ومع ذلك تجوز فيهم الصدقة يعني اللي عايز يتصدق على واحد بيحاول يجيب عشان يتجوز عادي مفهاش حاجة<br />وجزاه الله ألف خير<br />أصلا اللي بيساعد في زواج مسلم ومسلمة أجره كبير جدا عند ربنا<br />لأن الزواج زي ما بيتقال دائما هوا نصف الدين<br />بس لازم يكون فيه تكافؤ بين الطرفين<br />يعني مش أروح أتجوز واحدة أهلها مبسوطين ومعيشين البنت في مستوى كويس وأرجع اقول أعشيها ببطاطا ولا زتونة<br />ربنا مقالش كدة أصلا<br />كل إنسان عاقل لازم يبص للي في مستواه عشان ميظلمش نفسه ولا يظلم البنت اللي هيتجوزها وفي النهاية كل المعاملات بيننا بالمعروف"
archived = "2009-07-19"
capture_url = "https://web.archive.org/web/20090719234453/http://www.20at.com:80/masr/2khbar/12671-2009-07-16-07-21-55.html"
