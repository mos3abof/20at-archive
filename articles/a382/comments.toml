[[comments]]
order = 0
subject = "الزي الشعبي لا يعني انفصالاً"
text = "عندماذهب الرئيس الصالح علي عبدالله صالح الى قمه الدول الثمان بزيه اليمني المعروف ( الجنبيه ) فهذا لا يعني انفصالا على الاطلاق وانما هو رفع لمميزات الشعب اليمني واحتراما لتراثه الذي ليس من العيب اظهارها امام العالم . اما عن الذين يقولون غير هذا الكلام من كتاب ومحللين فهو كلام لا ينبغي قوله في ظل حكم عادل مظلته الوحده والجمهوريه وطريقه الكتاب والسنه,فبنظري ان هذا الكلام ليس له ايه فائده سوى غلغله البلابل في اوساط الشعب اليمني الذي من المستحيل ان يفكر بمثل هذا التفكير الرجعي"
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025110325/http://www.20at.com:80/article.php?sid=382"

[[comments]]
order = 1
subject = "خسأة وإن كنت شيعيا (فلسطينياً ) !"
author = "السعوديه ستبقى شامخه رغم انفك وانوف الحاقدين امثالك"
text = "انت كنت ذات يوم تدعي الفلسطينيه فهي مجرده منك تماما<br />نعم<br />لأن الشعب الفلسطيني دائما وفي لمن وقف معه<br />فالسعوديه في كل الايام وعلى مر الازمنه لم تبخل يوما قط على الشعب الفلسطيني بحكومته<br />دعمت وساعدت في شتى المجالاات<br />سياسيا ومعنويا وماديا<br />فالفلسطيني يبقى دائما وفيا على كل من اقدم على<br />مد يد العون له ...<br />لست سوى صعلوك اعطيت له فرصة الحديث ...<br />ففي المرات القادمه عسى ان تكون فيك روحه الشجاعه وانت تكون وفيا لمن اقدم على مساعاادتك<br />وان كنت ذات يوم \"فلسطينيا \" فهي مجرده منك !!!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143041/http://www.20at.com/article.php?sid=382"
