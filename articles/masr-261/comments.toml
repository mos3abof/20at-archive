[[comments]]
order = 21
subject = "مصر لشعبها وبس"
author = "مصرى"
posted = "2006-05-09"
text = "دى مش جمهورية الرئيس دى جمهورية محتلة بالرئيس ولازم تتحرر من المغتصب للسلطة إللى ماجاش بالإنتخاب ولا برأى الشعب وترشيحه لكن جاء بالسطو على ثروات مصر ونهبها ولا زال يسرق فيها هو وزوجته وإبنه يعنى هو جاب منيين أرصدته الطائلة فى بنوك العالم ولا زوجته ولا إبنه معلش بقى أصل البابى بتاعه مكنش غنى ولا حاجة ده كان حاجب محكمة أمال العز المنهوب إللى عايش فيه جابه منين حسبى الله ونعم الوكيل فيه وفى زوجته وأولاده وربنا يريحنا منه ويحرر مصر منه يارب بس محتاجين ياشباب نكون أدينا كلنا مع بعض ولازم نكون عمليين أكثر من كده وإيجابيين أكثر من كده"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223814/http://masr.20at.com:80/article.php?sid=261&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

