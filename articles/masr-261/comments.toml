[[comments]]
order = 30
subject = "ماذا أصابك يامصر؟!!!!"
author = "وفاء اسماعيل"
posted = "2006-11-03"
text = "ماذا أصابك يا مصر..؟!!<br />ماذا أصابك يا مصر؟!!!<br />إنهيار القيم الأخلاقية فى مصر وفى بلدان العالم العربى ..هل أصبح ظاهرة أم حالات فردية ؟ !!<br />نشرت صحيفة المصريون هذا الخبر ( تقدم النائب الدكتور أكرم الشاعر ووكيل لجنة الصحة بمجلس الشعب بسؤال عاجل لرئيس الوزراء الدكتور أحمد نظيف، حول الخبر الذي انفردت \"المصريون\" بنشره، بشأن فضيحة مشاركة مصرية في مسابقة دولية لاختيار ملكة جمال المخنثين جنسيًا. وطالب الشاعر، نظيف بسرعة الرد على سؤاله بهذا الخصوص، خاصة وأن مشاركة مصر جاءت مع دول أخرى هي المكسيك وأمريكا واستراليا وماليزيا والفلبين، بعد خوض المتسابقين تصفيات أجريت في بلدانهم قبل توجههم إلى تايلاند.) ويبدو ان النائب أكرم الشاعر ليس لديه علم بأن مصر هى احدى الدول ال186 التى وقعت على ( بنود وثيقة بكين + 10) التى تم التوقيع عليها بالاردن و كان من اهم قراراتها :<br />الأول: إقرار مؤتمر الأمم المتحدة للمرأة (بكين+10) -الذي عقد في الفترة من 28 فبراير إلى 11 مارس 2005 دون اعتراض من جانب الدول العربية والإسلامية- بنود اتفاقية \"بكين\" التي تتضمن بنودا خطيرة تسعى لإباحة الشذوذ والإجهاض.<br />الثاني: تعيين الرئيس بوش \"إليزابيث ديك تشيني\" ابنة نائب الرئيس الأمريكي ديك تشيني لتعمل كمساعد أول لديفيد وولش مساعد وزيرة الخارجية الأمريكية لتحقيق خطط الإدارة الأمريكية في المنطقة العربية، وتحديدا بشأن تغيير واقع المرأة العربية و\"إصلاحها\" كما يقولون!. وما دامت مصر وافقت ووقعت على تلك البنود دون اعتراض وبمحض ارادتها لايجوز للدول الموقعة على بنود الوثيقة ان تعترض على اى رد فعل يتوافق مع ما ايدته ودعمته تلك الوثيقة .<br />ورغم ان بنود هذه الوثيقة جاءت شاذة كل الشذوذ عن عقائد الإنس<br />اقرأ بقية التعليق .."
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117204920/http://masr.20at.com:80/article.php?sid=261&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
