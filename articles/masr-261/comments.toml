[[comments]]
order = 15
subject = "لا تنتظرالحريةالتي لا تاتي بالكلام"
author = "ابو كرتونة"
posted = "2006-05-07"
text = "سمير رجب وامثاله من ابراهيم نافع وغيرهم من رؤساء الصحف الحكومية التي جعلوها كان الصحف سيارتهم الملاكي , فجعلوها صحف لبث الكذب والنفاق والخداع علي الشعب , فنادرا ماتجد جريدة حكومية تنتقد النظام او تبث معلومات صحيحة, فجريدة الاخبار بتاريخ 4\\5\\2006 تقول في افتتاحيتها ( انخفاض البطالة من 10% الي 9,5%) وتوفير 150 الف فرصة عمل الشهر المقبل .<br />فهذا الكلام لايصدقه المجنون قبل العاقل ,<br />فكل الاحصائيات تقول ان طابور البطالة اخذ في التمدد والمصانع تقفل ويشرد العاملون بها ,والمعاش المبكر يحصد الالاف من الموظفين العاملين بالحكومة شهريا, والسياحة انضربت , والاستيراد في زيادة والتصدير تعبان<br />وغير ذلك من الكذب اليومي في الصحف الملاكي التابعة للنظام الفاسد<br />فمثلا تخيلوا ان ابراهيم نافع رئيس تحرير جريدة الاهرام لفترة طويلة كان راتبه يتعدي الثمانون الف جنيه شهريا ده طبعا غير الحوافز والمكافات لزوم الكذب والنفاق وللعلم ان ثروة نافع وصلت الي قرابة 900 مليون جنيه مع شركائه وهم طبعا اولاده<br />وان سكرتيرة ابراهيم نافع كانت تتقاضي مرتب يتعدي الثلاثون الف جنيه شهرياوهي لم تتعدي الثلاثين من عمرها (ليه علشان حلوة حبتين)<br />وبعد كده بنقول في بطاله في البلد في وقت شباب تعدوا سن الخمسه وثلاثين ومازالوا يبحثون عن وظيفة 200 جنيه شهريابس؟؟؟؟؟ وسكرتيرته تاخذ 30000 الف جنيه شهريا مش عارف<br />وبنقول في بطاله<br />لا تنتظرالحريةالتي لا تاتي بالكلام<br />ولكن تاتي الحرية بالـــــــــدم<br />في الغالب"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223814/http://masr.20at.com:80/article.php?sid=261&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 16
subject = "دى قضية مصر كلها"
author = "مصرى"
posted = "2006-05-08"
text = "أعتقد أن الإعتصام حق للإنسان فى دولة حرة ولكن مصر دولة تحت الإحتلال ولننظر كيف كان الزعماء فى عصور الإحتلال لمصر يتعاملون مع المحتل والدفاع عن مصر وعن شرعية وجود المحتل على أرض مصر الغالية وهم جميعاً من الحقوقيين مثل مصطفى كامل ومحمد فريد وسعد زغلول وغيرهم كثير. فنظام الحكم الموجود فى مصر ليس نظام شرعياًلأن الرئيس حسنى مبارك لم يأتى للحكم منذ تولى الرئاسة بإنتخاب الشعب كما ينص الدستور وكان وجوده فى الحكم طوال هذه السنوات بالتزوير وما بنى على الباطل فهو باطل. ثانياً كيف للقضاء أن يرتضى لنفسه هذه الوقفة المستجدية فى دولة محتله كان من المفروض المطالبة بتحرير مصر وليس الإنتظار من المحتل أن يعطيهم حقوقهم التى سلبها منهم الذى هو من وجهة نظر القضاء المتهم الأولى على قتل السادات وكل الأدلة تشير إلى أصابعة الخفية فى ذلك وكان لا بد أن يسقط القضاء شرعية الحاكم فى وجوده فى الحكم. وأيضاً لما أصاب مصر من فساد وتدهور وإخلال بكل مؤشرات الحياة من بطالة وتعليم وصحة وقتله للحياة الديمقراطية لكى يضمن سيطرة على الحكم وهذه نفس سياسة المحتل ولكن الحل الوحيد الذى لا بديل عنه هو الثورة على هذا الفساد وخاصة أن الشعب كله مؤيد لكم وملتف حولكم ولكنه ينقصه القيادة وأنتم القيادة الصالحة التى يتمناها المصريين جميعاً فماذا تنتظرون هل تنتظرون أن يقضى عليكم الحاكم كما فعل فى الحياة الحزبية وبذلك تفقدوا حتى أحترام الشعب لكم لا امل الأن إلا بالثورة والشعب كله معكم وفى إنتظار شرارة البداية على أيديكم يا شرفاء مصر لنطهرها من هذا الفساد المتسرطن"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223814/http://masr.20at.com:80/article.php?sid=261&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

