author = "كل سنة وانت طيب يا ريس..يا مهنينا ..ومدلعنا..و مخلينا مرتاحين في بيوتنا مبنشتغلش..و معندناش مشاكل اجتماعية ..علشان مبنتجوزش...و ومش شايلين هم العيال علشان جالنا عقم ..ومش خايفين على المال لأنه اتسرق من زمان ..انت عارفنا و عارف نفوسنا الخبيثة ..كل ما جالنا فلوس هنتبغدد و نتدلع ونصرفها في كلام فارغ..خليها معاك يا ريس..احنا مستأمنينك عليها انت و الورثة .."
