text = "يا حاكم بلا إنتخاب ويا محتل للسلطة ويا من لا تمتلك الشرعية لوجودك أقول لك لقد تيقنا جميعاً أنك وصلت على أبواب الثمانين ولازلت عندك المقدرة للتحرك بدون كرسى كهربائى أو عصا كما يتحرك من فى سنك وأنك لا زلت تعرف أسمك كما لا يعرف كثير ممن فى سنك أسمائهم ولكنك للأسف الشديد لا تعرف أنك تحكم مصريين أحرار لن يرضوا بالذل والطغيان ويقولون لك أقرأ الدستور لتعرف كيف يجيء الحاكم للحكم برضا الشعب والإنتخاب وأنت لم تنتخب من قبل الشعب فى يوم ما إذا أنت غير شرعى للحكم فى مصر وأنصحك أن توفر المبالغ الطائلة التى تدفعها على مكياجك وصباغتك لشعرك وشد وجهك الكرية بالنسبة للمصريين كلهم وأقول لك عيش باقى عمرك بما نهبت من مال ولكن بعيداً عن مصر التى حتى ترابها سيلفظ جثمانك بعد مماتك ولن نسمح لك بتوريث الحكم لإبنك المفقد للشرعية فى وجوده بسبب إفتقادك أنت أصلاً للشرعية ونقول لك كما قال الزعيم أحمد عرابى لقد خلقنا الله أحراراً ولن نورث بعد اليوم"
