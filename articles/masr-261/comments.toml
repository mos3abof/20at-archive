text = "الله يخرب بيت كل منافق وكذاب ومرتشى ووصولى وانتهازى ضيعتم البلد وضيعتم الناس وضيعتم القيم والمبادىء ونشرتم الفساد فيها يارب تروحوا فى ستين داهيه ونشوف فيكم يوم اسود زى اعمالكم السوده اللهم ارنافيهم تأرنا واشف غل صدورنا اللهم بدل السفهاء مناوالمفسدين بالصالحين المصلحين اللهم لا تعيد علينا هذه الذكرى الحزينه الا وهم فيما يستحقوه من عقابك اللهم اكشف عنا هذه الغمة اللهم تقبل دعاء الملايين المصريين المطحونين بين انياب الجشعين اللصوص يارب اجعلها آآآآآآآخر احزاننا"
