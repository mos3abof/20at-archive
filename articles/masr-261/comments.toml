author = "طهقان زهقان مضايق"
posted = "2006-05-08"
text = "و الله انا اول ما قريت الكلام ده كنت عايز ارجع و جريت على الاجزخانة طلبت حبتين برشام للترجيع بس يا خسارةلقيت الاجزخانة مقفولة بيقولوا واخدين اجازة عشان عيد ميلاد الريس<br />سألأت نفسى عيد ميلاد انهو ريس هو فى ريس فى مصر زى اللى فى البلاد التانية هى مش مصر تم اعلانها انها ملكية من 25 سنة<br />بعدين قعدت افكر فقلت لنفسى اكيد هما قصدهم اما الريس حنتيرة او الريس متقال<br />وبص عالحلاوة حلاوة دى بلدى و نجاوة نجاوة"
