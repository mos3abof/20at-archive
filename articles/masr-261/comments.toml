author = "مخنوق مشنوق مش رايق"
posted = "2006-05-08"
text = "عسل يا طهقان<br />على العموم ... الله يخرب بيت أبو النفاق والمنافقين ... ونشوف فيهم يوم جميعا وعلى رأسهم أعلام النفاق (على سبيل المثال لا الحصر):<br />أحمد شوبير - عبدالله كمال - كرم جبر - ممتاز القط - أسامه سرايا - مكرم محمد أحمد - سمير رجب - احمد نظيف - مصطفى الفقى - نبيل لوقا بباوي - عمرو عبدالسميع - عماد أديب"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223814/http://masr.20at.com:80/article.php?sid=261&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 19
subject = "Enough is enough"
author = "أبو نهى"
posted = "2006-05-08"
text = "للأنجليز قول مأثور يقول يكفي ما يكفي (Enough is Enough) ، وأعتقد أن أحنا وصلنا الى هذه النقطة..<br />فأما أن نتفق جميعا على يوم نخرج فيه للشارع ولا نعود لبيوتنا الا بعد أن نقلب هذا النظام (الزبالة) في صندوق زبالة التاريخ ، وأما علينا أن نوطن أنفسنا على الهوان والرضوخ لهذا للنظام السرطاني والصهيونية والأمبريالية اللتين تستعبدانه.<br />هذين هما الخيارين الوحيدين أمامنا .. ويؤسفني أن أقول أنه لا ثالث لهما! على جميع القيادات الوطنية أن تعي ذلك وتجعله هدفها المعلن مثل قرص الشمس وتسعى اليه علانية وبلا مواربة وأن لا تستشعر في ذلك عيبا ولا خوفا من عواقبه.<br />وأن لم تستطع القيدات الوطنية أن تستقطب وتشحن وتجند ما يكفي من الجماهير للخروج الأول وأشعال الشرارة التي تجعل بقية جموع الشعب تفيق وتلتحق بها ، فأن فشلها هذا يعني أنتهاء مصر الحرة الى ما شاء الله.<br />أبو نهى"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223814/http://masr.20at.com:80/article.php?sid=261&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

