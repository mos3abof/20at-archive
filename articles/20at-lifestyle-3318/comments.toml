[[comments]]
order = 13
subject = ""
author = "رحاب فاروق"
posted = "2007-03-01"
text = "بسم الله الرحمن الرحيم<br />السلام عليكم ورحمة الله وبركاته<br />الأخ المحرر: سامحك الله وغفر لك . لا أدري ما الفائدة من هذه المعلومات التي اوردتها في مقالك؟<br />أخشى ان يقراها بعض المراهقين فتثير غرائزهم ويبحثون عما ذكرته ليشاهدوه .<br />اخي الكريم اتق الله وتذكر ان عملك هذا أمانة سيحاسبك عليها الله عز وجل ، وأدعوك لكتابة جزء ثاني من الموضوع توضح فيه راي الدين فيمن يدخل لهذه المواقع الخطيرة وماذا يفعل من يريد ان يتوب منها ، وما تاثيرها على صحة الجسم والأعصاب عافى الله شباب وبنات المسلمين والمسلمات من كل سوء .<br />وأخيرا اذكر بقوله تعالى: ( والذين لا يدعون مع الله الها آخر ولا يقتلون النفس الي حرم الله الا بالحق ولا يزنون ومن يفعل ذلك يلق آثاما . يضاعف له العذاب يوم القيامة ويخلد فيه مهانا. الا من تاب وآمن وعمل عملا صالحا فأولئك يبدل الله سيئاتهم حسنات وكان الله غفورا رحيما)<br />وجزاك الله خيرا"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624014544/http://www.20at.com:80/20at/7ayatna/3318.html"

[[comments]]
order = 14
subject = ""
author = "درويش"
posted = "2007-03-02"
text = "السلام عليكم..بداية اريد ان اسال هدا الشريف الدواخلي وعلى فكرة فهو دواخلي فعلا ..والدواخلي نطلقها في المغرب على كل المتطفلين_ مع كامل احترامي _مثلك..يمكنك ان تجيبني.. ما الدي دفعك الى الكتابة في هدا الموضوع..اليست هناك مواضيع تهم اكثر المتصفحين لهدا الموقع الدي لا نريده ان يفقد احترامه فينشر بدل الوعي الجهل…موضوعك سيدي الدواخلي كان عليه ان يمنعك من نشره لانه بحاجة الى فحص تقني حتى يكتب له القبول …صحيح ان الجنس يعتبر من الطابوهات في كثير من العالم العربي..لكن خطا ان نستغل المحضور فنقدمه بسداجةلترغيب القراء…مع احترامي"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624014544/http://www.20at.com:80/20at/7ayatna/3318.html"

