[[comments]]
order = 10
subject = ""
author = "المحرر"
posted = "2007-02-26"
text = "\" الطبخة بتاعة الموضوع متكلفة والمقادير كويسة بس الموضوع مششط شوية<br />التركيب البنائى للموضوع يفتقد الى عناصر الغمز واللمز<br />بس فيه شغل صحفى عالى<br />عموما انا بحييك وبقولك اجتهد وخلى بلك من مقادير الموضوع واوعى تقتبس \"<br />ولو ان الموضوع لا يستحق الرد عليه لرداءة الاسلوب الذى تم به التعليق وضعف معناه انما انا هارد عليه عشان الاخ اللى \" خاف يقول اسمه \" قالى اوعى تقتبس وباقوله .. لو انتا شايفتى اقتسبت حرف واحد من الموضوع من اى مكان صحرا كان او بستان فلما لم تذكره لاحراجى امام القراء .. ولا هو كلام وبس .. انا اخر حد فى الدنيا ممكن يقتبس حرف من اى مكان و ما يقولش .. اوك ولو عندك اللينكات انا مستنها !<br />أما بقى اسلوبك التحفة فى التعبير فده لوحده مشكلة .<br />- ناقد صحفى هكذا تكتب وليس ناقوود صحافى حتى لو كنت بتدلعها طيب قولنا انتا من انهى مدرسة وصحفى فين عشان نتعلم . .. ولو حتى شئون الطبيخ لان من الواضح ان ليك باع كبير فيها …<br />- بجد الموضوع فيه شغل صحفى عالى بس يفتقد للغمز واللمز \" معلش اصلك مش واخد بالك انها مش قاعدة شباب على قهوة او حديث نساء يلزمه الغمز واللمز …<br />- لو الموضوع مشطشط عليه ابقى بلعه بشوية ميه يمكن يهدى شوية<br />- انا فى غاية الشكر من تشجيعك ليا يا استاذى المجهول بس ليه ما قولتليش على المقادير اللى اخلى بالى منها عشان الشيف ما يزعقلكش … بعتبار انه افتكرك انك لسه فى شغلك فى فندق بيراميزا وما روحتش لسه ..<br />لا انتا روحت و فتحت موقع عشرينات وبتقرا موضوع .. موضوع الطبيخ حاول تتعالج منه بقى مش كل واحد شغال شغلانه ينظر لكل من حوله من خلالها<br />- وانا ما زلت اؤكد انا فى انتظار كل ردودكم لانى قادر على الرد عليها ان شاء الله"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624014544/http://www.20at.com:80/20at/7ayatna/3318.html"

