text = "انا اسمى ريم عندى 15 سنه بصراحه انا كنت بكلم ولد على النت صحبى وبعدين طلب يعرف انا لبسه ايه قلتله عادى انا لبسه لبس البيت بس بعد كدة قالى قؤمى قلتله ليه وقالى تخيلى انى بقلعك البس وعملت زى ماطلب وبعدين قالى قلعينى قلعته بس وعملنا الحوار كله انا كنت مش عايزة بس كان بيقؤلى ان معملتيش انى هقتلك انا كنت خايفه منه لانه بجد ممكن يعمل كدة بس عملت خفت يكون لها تاثير عليا فى الحقيقه لما عرفت انه بيبقى من صنع الخيال سكت انا بنصح ك بنت اوعى تعملى انا كرهت الرجاله وسيرتهم وكل حاجه عنهم مش عايزة اعيش فى عالم فى رجاله خالص عايزة اعيش فى عالم كله بنات اوعى نصيحه منى ليكى اوعى تعملى كدة ابدا ارجوا نشر القصه علشان كل بنت تستفيد ومتقعش فى الغلطط الى وقعد فيه انا و متحاولوش تكلمونى على لايمال"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624014544/http://www.20at.com:80/20at/7ayatna/3318.html"

