text = "صدقنى الموضوع مهم جدا ومن الصعب اننا نلاقى اللى يقدر يفهم الشباب او يوصلهم الخطر الناجم عن استعمال النت كويسلة لممارسة الجنس انا بس عايز اضيف لك حاجة الشاب بعد ما بيمارس هذا النوع من الجنس رغم انة بيحس برضا الغريزى الانة انة بيكون غير راضى عن نفسة فى فعل هذا العمل ولذلك لابد من عمل نشرات توعية فى كل الاماكن واقامة المحاضرات لتوعية الشباب لان الشباب هم امل المستقبل<br />وفى النهاية احب اشكرك للكلام فى هذا الموضوع"
