[[comments]]
order = 16
subject = ""
author = "حياة بن تامو"
posted = "2007-03-12"
text = "السلام عليكم…اريد في البداية ان أبدي اعجابي الشديد بالمقال,ففيه من الجديد ما أدهشني حقا وكما يقال .في كل جديد دهشة.وهذا حقا ما أصابني اثناء قرائتي لهذا الموضوع,وتمنيت حينها لو أن جميع زملائي في الجامعة أن يتطلعوا على هذا الموضوع الذي يحمل في طياته معاني عديدة…فطوبى لك يا أستاذشريف الدواخلي فقد اتيت بموضوع يساير شباب القرن الواحد والعشريين لمل يعرفه من ادمان الشباب عاى الأنترنيت وكذا آستغلاله بطريقة سلبية.وما اطلبه منك أن تأتيا دوما بالجديد في مثل هذه المواضيع حتى يتمكن لآباء ولآمهات من التطلع على هذه الحقائق ومعرفة اولادهم في أي طريق يسلكون…"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624014544/http://www.20at.com:80/20at/7ayatna/3318.html"

[[comments]]
order = 17
subject = ""
author = "شاب تعبان فى حياته"
posted = "2007-05-06"
text = "السلام عليكم<br />انا شاب من المفتونين بنوع فظيع من انواع الجنس ومش عارف اتخلص منه (متخافوش مش شذوذ) نوع انى لما اشوف الستات مربوطين وبينضربوا احس بمتعة كبيرة جدا<br />وعلشان اتجنب الفرجة والانغماس اكتر فى مشاهدة الموضوع ده نقلت الكمبيوتر بتاعى فى الصالة امام العائلة واعطيت رامة الكمبيوتر لابى وقلتله يخبيها اما يكون مش موجود<br />والموضوع ده نفع خلانى بدأت انسى الموضوع من خيالاتى وادعو الله ان يخلصنى منه تماما وشكرا<br />واتمنى انكم تتبعوا نفس الاسلوب"
archived = "2009-06-24"
capture_url = "https://web.archive.org/web/20090624014544/http://www.20at.com:80/20at/7ayatna/3318.html"

