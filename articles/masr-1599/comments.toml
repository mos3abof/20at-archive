text = "الملك فاروق قتل السيخ حسن البنا فزال ملكة بعد قتلة بسنوات قلائل<br />وجمال عبد الناصر قتل الشهيد سيد قطب فحدثت النكسة بعد سنة من مقتلة<br />والسادات اعتقل الاخوان سنة 80 فقتل سنة 81<br />واعتقال الاخوان الان هى بشرة خير<br />استبشروا بالخير تجدوة"
