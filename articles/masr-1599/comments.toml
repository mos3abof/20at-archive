subject = "تحية الى ابن بهية"
author = "القاهرة الان اشبة بالقاهرة سنة 1930"
posted = "2007-02-16"
text = "الفساد والجوع والبطالة وعهر الحاكم واسرتة والوزراء<br />وانت يابن بهية اشبة باحمد طة الثائر المناضل فى الفيلم<br />انت تيقظ النيام وتخبط على ابواب الكسالى ليستيقظوا لانقاذ مصر<br />احييك واحيى الشباب المناضل بالكلمة حتى تاتى ساعة الفعل فيهب الجميع من انقاذ مصر من عملاء وكالة المخابرات الامريكية واعوانها فى مصر<br />تحياتى"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219021537/http://masr.20at.com:80/article.php?sid=1599"

[[comments]]
order = 9
subject = "كلما ضاقت حلقاتها"
author = "ايمن امام"
posted = "2007-02-16"
text = "السلام عليكم/ كلما ضاقت حلقاتها واستحكمت<br />مهما حدث ومهما صار الظلم عنوان للحقيقه - المفروضه بالبطش والقمع والتعذيب فالاسلام باق باق مابيقيت الدنيا - ونحن فى هذا اليوم الذى فيه ساعه اجابه ارفعوا ايديكم الى السماء وادعوا المولى عز وجل اللهم عليك بهم اللهم انى مغلوب فأنتصر - هل هذه دوله هل هذا حكم = كل من يعارض يلقى فى السجون كل من يحاول ان يفهم يلقى فى السجون =من هو الارهابى من هو الخارج عن الشرعيه = هل الشرعيه ان اغتصب شعبا باكمله هل من الشرعيه ان اسفك دماء شعب هل من الشرعيه ان احول البلاد الى معتقل كبير هل من الشرعيه ان احمى الفاسدين والمفسدين هل من الشرعيه ان احمى من خرب اقتصاد البلاد هل من الشرعيه ان احمى من اصاب الشعب بالامراض = ماهى الشرعيه اذن= سيقولون لك الشرعيه الدستوريه وماهى الشرعيه الدستوريه سيقولون لك اتخاذ الدستور منهجا للعمل والتشريعات والحريات ومن يضع الدستور سيقولون لك مجلس الشعب ومن يأتى بمجلس الشعب سيقولون لك يتولى الشعب انتخابهم= ومن يراقب الانتخابات سيقولون لك نحن ومن يضمن نزاهه الانتخابات سيقولون لك نحن - ومن يفصل فى صحه العضويه وبطلانها سيقولون لك نحن = ومن ينفذ القوانين سيقولون لك نحن - ومن يراقب اداء الحكومه سيقولون لك نحن = احنا زهقنا منك انتا طلعت بتفهم - اعتقلوه وعذبوه واسحلوه واسجنوه - وياسيخ الازهر طلع تصريح قول اللى مش عاجبه يبقى خارج عن الحاكم واللى يخرج عن الحاكم دمه حلال وعرضه حلال- وياسيخ الافتاء يافضيله المفتى افقع بقين = على طول يقول يلا يااوباش - مش كفايه بتخشوا الجامع ببلاش من غير تزاكر ولاضريبه مبيعات= والتعلب فات فات وقاعد على الكرسى سبع دورات- ايمن امام"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219021537/http://masr.20at.com:80/article.php?sid=1599"

