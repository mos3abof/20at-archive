subject = "الحكومة"
author = "مواطن غلبان"
posted = "2007-02-19"
text = "الحكومة بتاعتنا بتحسسنا انا احنا مش مصرين بجد والله بتعاملنا زي الاسرائيلين والله دة حرام احنا بنتبهدل جامد والله في البلد دي عشلشان كدا بنهاجر من وش الحكومةاحنا بجد زهقنا منهم عايزين تغير في النظام كلو وشكرا علشان انا مخنوق بجد"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219021537/http://masr.20at.com:80/article.php?sid=1599"

