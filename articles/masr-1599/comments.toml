[[comments]]
order = 7
subject = "رائحة الجزائر"
author = "إبن بهيه"
posted = "2007-02-15"
text = "لقد قلت هنا منذ أكثر من عام ، بعيد انتخابات 2005 وما شابها من تزوير وبلطجة وووو إلخ كما تعلمون .. قلت أنني أشم رائحة الجزائر تختلط بالسحابة السوداء .. هكذا حدث حين انقلب الجيش على الديموقراطية والصناديق واختيار الشعب بإعاذ وأمر من فرنسا ، ثم حدث ومازال ما نعلمه جميعاً<br />اليوم نشم نفس الرائحة في مصر ، ومهما كان الإخوان لدينا مختلفون ووقورون وطيبون وصبورون ومحتسبون ووووو وملائكة .. فلا يمكن أن تسلم كل ملايين الإخوان من حفنة شباب ثائر يخرج على الجميع سواء الإخوان أو نظام مبارك الواطي ويطلق شرارة البدء لتحتل مصر موقعها في سباق التتابع نحو الجحيم ..<br />طبيعي أننا لم يعد لدينا ذرة ثقة في مبارك الواطي العميل الماسوني ولا عصاباته التي تنهب رزق أبنائنا ليل نهار ولكني مازلت أحتفظ ببعض الثقة في صغار ضباط جيش مصر (دعك من كبار الظباط لأنهم متظبطين أوي من مبارك الواطي)) ، أين شباب القوات المسلخة ؟ أين ؟<br />ألا يحزنهم حال هذا البلد ؟ ألا يخشون عليه من ذلك المجهول الذي يلقينا فيه الواطي مبارك وكلاب حراسته من بوبيهات العادل القذر ؟<br />حسبنا الله ونعم الوكيل<br />كلما طال الليل .. اقترب الفجر .. وليل بهيه طال خالص .. طال أكتر من ربع قرن من حكم ذلك الواطي في قصر العروبة .. يا رب لطفك ...<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219021537/http://masr.20at.com:80/article.php?sid=1599"

[[comments]]
