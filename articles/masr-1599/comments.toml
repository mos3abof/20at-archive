[[comments]]
order = 4
subject = "مستنيين إيه"
author = "هل إنتظر عمال مصانع النسيج فرج الله ليأخذوا حقوقهم أم خرجوا فى إضرابات لماذا لا يخرج الشعب كله فى إضرابات إلى إن يرفعوا أيديهم عن الإخوان المسلمين"
posted = "2007-02-15"
text = "ترك الإخوان وحدهم فى هذا الجحيم جريمة فهم مصريين وما يفعله مبارك بهم جريمة فى حق مصر كلها ولابد من الخروج للدفاع عن أبناء مصر الذين يعذبون فى المعتقلات من أجل المصريين جميعاً وتصفيتهم ضعف للشعب كله وتركهم جريمة سيتم بعدها توريث الحكم للوطى دكتاتور فاسد طاغى مثل أبوه أنظروا إلى أرصدته ومشاريعة وإلى حال الشعب الفقير وأنتم تعرفون لماذا يتكالب على الحكم لكى يبيع باقى مصر وينهب أموالها<br />لا للخوف نعم للدفاع عن الإخوان نعم للدفاع عن مصر ضد فساد مبارك وعائلته الذى لا يقل عن فساد اليهود فى فلسطين والإحتلال فى العراق<br />نعم للدفاع عن الإخوان حتى لا تقع مصر فريسة لجمال مبارك الشاذ المدمن الذى لا يفكر حتى أن يأتى للحكم عن طريق لجان إنتخابات لإنه يعمل علم اليقين أن مفيش أى حد ها ينتخبه ولكن يأتى بالدكتاتورية وإغتيال إرادة الشعب فهل هناك فرق بينه وبين أبوه<br />نعم للاخوان المسلمين ولا لمبارك وعائلته<br />يسقط حسنى مبارك يسقط العميل القذر مبارك يسقط الفاسد الشاذ المدمن مريض السرطان جمال مبارك ربنا ياخذه يارب"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219021537/http://masr.20at.com:80/article.php?sid=1599"

