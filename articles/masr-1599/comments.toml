[[comments]]
order = 13
subject = "مطبخ ابن بهية/لحم باللفت"
author = "اعداد ابن بهية"
posted = "2007-02-17"
text = "لحم باللفت<br />مدة الطهي :ساعة<br />المواد الضرورية<br />1 كلغ لحم خروف<br />كلغ و نصف لفت<br />حببة بصل<br />ملعقة كبيرة من السمن<br />ربع ملعقة صغيرة فلفل أكحل<br />ربع ملعقة صغيرة قرفة<br />ملعقة صغيرة ملح<br />كمشة حمص مبلل<br />بيضة حبة ليمون<br />ربطة معدنوس<br />كيفية ألإعداد:<br />إقطع اللحم هشم البصل فوقه ،أضف السمن و الفلفل ،بلل بكأس ماء صغير واطهي مدة 10 دقائق ثم غطي بالماء و أضف الحمص واستمر في الطهي مدة 10 دقيقة، ثم أضف للفت بعد قطعها بصورة مستطيلة إلي اللحم ،واستمر في الطهي مدة 30 دقيقة، وفي هذه الأثناء حضر خليطا من المعدنوس المهشم و البيضة وعصير الليمون وأضفه إلى المرق واطف النار.<br />قدم الأكلة مصحوبة بقطعة من الليمون."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219021537/http://masr.20at.com:80/article.php?sid=1599"

