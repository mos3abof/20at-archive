subject = "الحكومة"
author = "مواطنة غلبان"
posted = "2007-02-19"
text = "لو في حد عندو حل يقول ويتكلم علشان مصر دي غالية علينا اوي وحرام كل اللي بتعمل فيها والله عايزين نعيش وخلاص بس اظن دة مش كتير يا ريت يخلونا نعيش انا منتظر الرد مواطن"
archived = "2007-02-19"
