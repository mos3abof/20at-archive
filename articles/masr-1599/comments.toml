[[comments]]
order = 17
subject = "هل فقد النظام عقله صحيح"
author = "الدشم"
posted = "2007-02-17"
text = "ما يفعله كلاب النظام فى الموقع يؤكد بما لا يدع للشك أن النظام فقد عقله أمام منافسة الأخوان القوية وتأييد الشعب كله له ورفض فساد حزب لم يترك فساد إلا وقدمه للشعب من نهب وعمالة وتزوير ومتاجرة فى المخدرات وتهريب أموال وقتل الشعب بالمبيدات وفى العبارة وغيره كثير<br />أعتقد القذر إللى عمال يشتم فى إنسان غيور على بلده زى إبن بهية عيب عليه ومش ها ينفعله الحزب الوطنى فى حاجة تأييد الشعب هو الأبقى له والشعب مع الإخوان المسلمين فلا داعى لهذه السفالة<br />هل أنهى مبارك برنامجه العجيب وأصلح التعليم وحل مشكلة البطالة وأعاد لمصر ما نهبه هو وعائلته حتى يفكر فى حربه للإخوان بهذه الوقاحة<br />آن الأوان لمبارك أن يترك الحكم ويحاكم على ما فعله فى مصر وفى شعبها الذى لن يقول له غير لا لمبارك ولا لإبنه العبيط مصر مليئة بالكفاءات التى لن ترضى بما يفعله مبارك وعائلته بها وغداً لناظره قريب"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219021537/http://masr.20at.com:80/article.php?sid=1599"

