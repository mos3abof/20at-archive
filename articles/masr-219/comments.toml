author = "أبي الحبيب حسني مبارك"
posted = "2006-06-02"
text = "مقدمــه لسيادتكــم برعــم نشــأ فى عهدكــم وتربّــى فى كنفكــم وشرب من بحــر علمكــم وحكمتكــم التى أذهلــت العــدو قبل الصديــق<br />تسمـحلي أقــولّك يابابا ؟<br />بابا أنا تعبــان أوي ....لأ مــش سنانــي دي ودانــي !!!...أيــوه ودانــي ..أصلي سمعــت كتيــر أوي عن حاجــات حلوة حتحصــل لنا وما حصلــش منها حاجــة ...حقول لك شويــة حاجــات منها واخواتي هنا يمكــن يحبــوا يزودوا عليها شــوية حاجات تانيــة جايز أكــون نسيتها ... بابا مــش عايزك تزعــل منى علشان فتحــت لك قلبــي<br />(1)<br />بابا...مصــر فى السياســة والإقتصــاد وحتى فى الرياضــة بقت في الحضيض.. بقينا في آخــر القايمــة يابابا صــدقنى<br />(2)<br />الدول اللى كان محــدش بيسمع عنــها خالــص بقت أحسن مننا بكتيــر أوي يعنــى دول زي الهند...الفلبين...حتى تايــلاند عندهم إيــدز وبرضه بيشتغلــوا وبيصدّروا كمــان....إنت نمــت يابابا؟ .....لسه صاحي... طيب أكمــل<br />(3)<br />بتشــوف قناة الجزيــرة والعربيــة ودبى يابابا....شوف همّه وصلــوا وبقوا إيه واحــنا بقيــنا إيه....الإعــلام بتاعــنا بقه زبــالة بصراحــة يابابا...تفتكــر ده من إيــه؟<br />(4)<br />المصرييــن اللى عايشيــن بره محــدش بيســأل فيهم خــالص يابابا....تصــوّر لو حــد منهم مات ...السفــارة مابترضــاش تبعت جثته إلا لــو الناس لمّــت من بعضها ودفعــت المعلــوم......ده غير إن سفــاراتنا بتعاملهم بطــريقة أخر جليطــة وقلّة حيا بصــراحة<br />(5)<br />إحنا مابنزرعــش قمــح ليه يابابا ؟؟؟....أنا عــارف إنــك بتحب الكنتلــوب علشــان طعمــه أحلــى ....مش مهــم<br />(6)<br />بابا...بيقولــوا إن إسرائيل ممكــن ترجــع تحتلّنا تانى عل<br />اقرأ بقية التعليق .."
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100027/http://masr.20at.com:80/article.php?sid=219&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 21
subject = "أريد الحصول على شرائط الشيخ أمين الديب"
author = "نصر الدين بن حديد"
posted = "2006-06-03"
text = "السلام على جميع القراء<br />أنا في تونس، وليس بإمكاني الحصول على الشاعر الفاضل أمين الديب. الرجاء ممّن يملك منها، موافاتي بها ـ مع جزيل الشكر مقدمًا ـ على بريدي الإلكتروني أو موافاتي بعنوان موقع أجد فيه هذه التسجيلات."
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100027/http://masr.20at.com:80/article.php?sid=219&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

