text = "طيب ماهو لازم ...<br />ما هو الشعر كلام... والكلام في بلادنا ممنوع بامر السلطان ...<br />والسلطان نايم نعسان ....<br />يبقي مين الغلطان ؟؟؟<br />إحنا طبعا .... إحنا ولاد ...... اللي عايزين الحرق .....<br />قال مش عاجبنا قال ...<br />جتنا القرف ملينا البلد ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />مش مغيره ...... هه .<br />mohamedmat@hotmail.com"
