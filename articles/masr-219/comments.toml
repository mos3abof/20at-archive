[[comments]]
order = 19
subject = "كمين لأبن زاهية"
author = "نبيل ابوالسعود"
posted = "2006-05-19"
text = "الصديق الفلاح أمين الديب البالغ من العمر سبعين عاما إبن قرية نكله من أعمال محافظة الجيزة شاعر عامية يعزف على أوتار الهم الوطني والوجع القومي بشكل محبب وبسيط يصل بسرعة الى قلوب مستمعيه .. قبض عليه مؤخرا بتهمة خايبة وهي قوله اشعارا تكدر الصفو العام وكأن الصفو العام مش متكدر خلقة ومتنيل بستين نيلة من زمان .. وبعد زيارتي له في معتقله بطره كتبت هذه القصيدة [ كمين لأبن زاهيه ] وابن زاهيه هذا هو أحد أهم شخصيات قصائد الشاعر الديب الذي يفتعل معه حوارا في جلسات المصطبة يتناول فيه الاحداث الجارية بشكل فني رائع وعلى طريقة فلاح كفر الهنادوة لأحمد رجب .<br />[ كمين لا بن زاهيه ]<br />بعد حَبس الشيخ أمين<br />رُحت أشوفه جا له مين<br />التقيت الواد سلامه ابن ابراهيم<br />عند باب السجن فارش له يومين<br />العيون حمرا وخايف<br />والمرار فوق الشفايف<br />وفْ إيديه ماسك كيسين<br />كيس جوافه وكيس هدوم<br />والسجاير داستتين<br />قلت له جاي لمين ؟<br />قال لعم الشيخ أمين<br />قلت له : عَمى الدبب !!<br />فز قوم ..<br />اِمشي غور ما انتو السبب<br />داهية تخدك انت وامك<br />يا ابن زاهية الله يغمك<br />وديتوا الراجل في داهية<br />وفْ طـُره له جمعتين<br />التقيت الواد سلامه انتطر<br />والدموع ع الخدود زي المطر<br />صابني منهم دمعتين<br />قولت له : إيه ياسلامه<br />شدة وتزول يا ابن والدي<br />قال دا كان ناوي يناسبنا يا افندي<br />كات عينيه ع البت خضره<br />اخر العنقود لابويا اسماعين<br />قولت له : شوف ياسلامه<br />بالسلامه بكره يطلع ..<br />بكره يرجــع .. والفرح يعلى<br />ويبقى فرحتين<br />فرحة برجوعه لصباه<br />فرحة لرجوعه الحياه<br />وبلدكو هتخش التاريخ<br />ونكله تبقى بدولارين<br />علشان عيون الشيخ أمين<br />قال لي : عارف يا لافندي<br />مين يكون الشيخ أمين ؟<br />قولت مين ؟<br />قال دا واحد مننا<br />ياما دافع عَـننا<br />شال حمولنا وهمنا<br />قول<br />اقرأ بقية التعليق .."
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100027/http://masr.20at.com:80/article.php?sid=219&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

