subject = "فكر وشوف"
author = "ايمن الكفراوى"
posted = "2006-11-14"
text = "اناسمعت كلام الشيخ امين وفكرت وشفت<br />زى ما قال:-<br />واسمع كلام شيخ من زمان<br />قال بحترحروف الخوف وصون<br />واوعاك تخاف<br />واوعاك تخون اوتخون"
