[[comments]]
order = 16
subject = "مصر"
author = "يا مصر يا أرضنا"
posted = "2006-05-02"
text = "فيكى الحرامي والخبيث<br />فيكى اللئيم والبلطجى<br />وصديق شارون<br />وحبيب وبوش<br />والكل راكب ظهرنا<br />والشعب مسكين منكسر<br />م الفجر واقف في الطابور<br />طوابير كثيرة<br />عا الفول وياخد حصته<br />والعيش مفيش<br />ورغيفه معجون بالنكد<br />والهم مزروع في الطريق<br />والشوك كمان<br />ومفيش ركوبة توصله<br />وكلاب سوادها كالظلام<br />أعداد كثيرة<br />في كل ركن من البلد<br />مشيا ببتلهث يا ولد<br />اوعاك في يوم تعترض<br />على....... كلب مسعور<br />ينهشك<br />والعمده يبنى في السرايا<br />يرعى مصالح الكبار<br />ماهما أصل المشكلة<br />حبيب شارون<br />وصديق لبوش<br />والكل ناهب أرضنا<br />ومفيش غفير<br />ولا فيه وزير<br />ما الكل راكب ظهرنا<br />وقانون مفيش<br />وقضاه معانا في الطريق<br />ماهما أصلا مننا<br />ودعاية تلعن أصلنا<br />مش نافع ياابنى عندنا<br />وولاده ترتع أرضنا<br />أصل الطوارئ حكمنا<br />من يوم ما ركبوا ظهرنا<br />و إذا كنا عاو زين ننتصر<br />لازم نراعى ربنا<br />أوعاك تكون خايف ياصحبى<br />ما الفجر أذن يا ولد<br />أوم بيني ننده على النايم<br />والصاحي ناخده عندنا<br />أصل الكلاب دايما بتنعث<br />لما يأذن فجرنا<br />تحية للشيخ أمين أخويا<br />مصر"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100027/http://masr.20at.com:80/article.php?sid=219&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

