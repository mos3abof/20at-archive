[[comments]]
order = 13
subject = "اللهم احمى مصر من الاخون وانفلونزه الطيور"
author = "مواطن مصرى بحب بلده"
posted = "2006-04-27"
text = "فى الوقت التى يطل الارهارب على مصر لصلح من نقف ضد قانون الطوراى وهيا بنا نتخيال لو لم يكون قانون الطورى موجود لوقعة مائة العملية الارهاربة واذا هذا القا نون موجود تحدث العمليات الارهاربية فماذا لو قامنه بلغاه هيا بنا ندعى جميا<br />اللهم احمى مصر من الاخوان وانفلونزه الطيور"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100027/http://masr.20at.com:80/article.php?sid=219&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 14
subject = "اللهم احمى مصر من المغفلين"
author = "مصطفى احمد"
posted = "2006-04-27"
text = "اضم صوتى للاستاذين عبد الله وحسام مع اضافة تعليق اخر بعد الجهد المشكور من فخامة الرئيس صاحب الضرب الجوية وعائلة المبجلة رئساء مصر فى المستقل بعد هذا الجهد المضنى للأصلاح ما خربة المخربون من قبل ومن بعد.<br />نداء الى جموع الشعب المشاغب إلا ما يعجبة العجب على الشعب بالرحيل من مصر المحروسة علشان سيادة الرئيس وعائلة وحكومته تعرف تحكم البلاد فى سلام.<br />للبيقول اللهم احمى مصر من الأخوان :<br />اخى الحبيب الله عزوجل ارسل سيدنا موسى وهارون صلى الله عليهم وسلم وقال لهم (قولا له قولا لينا لعله يذكى ) لم يقل اضربوهم واعتقلوهم وشردوهم .<br />سيدنا عمر بن عبد العزير حينما ارسل له احد الولاه مستأذنا ان يسمح له بعقاب الشعب حتى ينصلحوا فارسل اليه عمر ( اذا اردت ان ينصاعوا فعاملهم بالعدل )<br />فالعدل اساس الملك لا حالة الطوارئ لمدة 30 سنة كبيسة"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100027/http://masr.20at.com:80/article.php?sid=219&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

