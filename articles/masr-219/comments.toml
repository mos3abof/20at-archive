[[comments]]
order = 7
subject = "اعوز بالله من السلطان"
author = "ammaaly"
posted = "2006-04-26"
text = "شيطان شعري زارني فجن إذ رآني<br />أطبع في ذاكرتي ذاكرة النسيان<br />وأعلن الطلاق بين لهجتي ولهجتي ،<br />وأنصح الكتمان بالكتمان ،<br />قلت له : \" كفاك يا شيطاني ،<br />فإن ما لقيته كفاني ،<br />إياك أن تحفر لي مقبرتي بمعول الأوزان<br />فأطرق الشيطان ثم اندفعت في صدره حرارة الإيمان<br />وقبل أن يوحي لي قصيدتي ،<br />خط على قريحتي : ،<br />\" أعوذ بالله من السلطان \""
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100027/http://masr.20at.com:80/article.php?sid=219&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "الشعر و الرقابة"
author = "ammaaly"
posted = "2006-04-26"
text = "فـكرت بـأن أكتب شعراً<br />لا يـهدر وقـت الـرقباء<br />لا يـتعب قـلب الـخلفاء<br />لا تـخشى مـن أن تنشره<br />كــل وكـالات الأنـباء<br />ويـكون بـلا أدنى خوف<br />فـي حـوزة كـل القراء<br />هـيـأت لـذلك أقـلامي<br />ووضـعت الأوراق أمامي<br />وحـشـدت جـميع الآراء<br />ثـم.. بـكل رباطة جأش<br />أودعـت الصفحة إمضائي<br />وتـركت الصفحة بيضاء!<br />راجـعت الـنص بـإمعان<br />فـبدت لـي عـدة أخطاء<br />قمت بحك بياض الصفحة..<br />واسـتغنيت عـن الإمضاء<br />احــمــد مــطــر"
archived = "2006-09-20"
capture_url = "https://web.archive.org/web/20060920100027/http://masr.20at.com:80/article.php?sid=219&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

