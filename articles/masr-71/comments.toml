[[comments]]
order = 2
subject = "مـــــــاشي"
author = "سوسة المفروسة"
posted = "2006-03-26"
text = "وانا وانا وانا...ماليش نصيب في الموضوع ده واللا اييه?<br />كده يا اخ عبدالله تفتكر الكل حتى اللي بتشجع فادي و انا لا..مقبولة منك يا عم<br />عموما انت مادام بدات في التشكيل كده يبقى مفيش غير اننا نعتبرك فتحي سرور ...ياللا يا عم الف مبروك فيها بتاع عشر سنين مش هتتحتح من مكانك..او عشر سنين سجن.انت و نصيبك"
archived = "2006-05-24"
