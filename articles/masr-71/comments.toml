[[comments]]
order = 4
subject = "حزبي الاهبل"
author = "هوووووووبه او هبهوب"
posted = "2006-03-26"
text = "اولا يا بشر اللي يمسك علاقات الشرق بالغرب<br />\" دبدوب \"<br />اللي يمسك القواعد النحويه ولاملايه للحزب<br />\"مفتاح \"<br />اللي يمسك \"طاحونه \" الحزب كرمله<br />اللي يمسك علاقات الحزب \" البت سويت \" عشان راغيه<br />اللي تمسك قسم المخبوزات \" سوسه المفروسه \" عشان عقده النقص للي عندها<br />\" فسم الموده والمصالحه \" البت نفين<br />\"عابر القارات \" لما يبقي يستقر في قاره ابقي احدد<br />يا حزب اهبل بكره الاجتماع الساعه \" فاي \"<br />عند عزبه النخل \" اوعي البلح \""
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210329/http://masr.20at.com:80/article.php?sid=71&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 5
subject = "اقتلوهم اقتلوهم انهم وحشين"
author = "Dabdoob"
posted = "2006-03-27"
text = "مادمت انا خالد يوسف<br />يبقي عبد الله مفتاح ينفع يكون محمد حسين يعقوب او ابو اسحق الحويني (شيخ سلفي لدرجة تبا لك) واهي فرصة يا عم تزعق لك شوية وتقول علي كل الناس يساريين براحتك وتحرم لك حاجتين تلاتة (ماتنساش تحرم الفول لانه بيتعب لي بطني مع اني باحبه)<br />اكرم باه ينفع فعلا محمد صبحي ده حتي رفيع زيه<br />هبهوب تنفع تكون اقبال بركة<br />قبل ما اخلص كلامي احب اقولكم اني حاولت العب كورة يوم الجمعة وفششششششششلت<br />ااااااااااااااااااااااااه<br />س ل ا م<br />Dabdoob"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210329/http://masr.20at.com:80/article.php?sid=71&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

