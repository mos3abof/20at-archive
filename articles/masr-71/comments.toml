[[comments]]
order = 7
subject = "دبدوب حبيبي"
author = "عبدالله مفتاح"
posted = "2006-03-27"
text = "دبدوب مفيش فايده فيك انا مش كلمتك كتير على المسنجر وحاولت اقنعك مفيش فايده يا قلبي.<br />يا سيدي الفاضل انت بتقول (فرص تحرم لك) زي ميكون الشيخ اللي بيحرم حاجه بيرمها من دماغه او بمزاجه من غير ميكون عنده سبب للتحريم.<br />وبعدين محمد حسين يعقوب بيزعق اه بس دمه خفيف وابو اسحق الحويني مش بيزعق الا قليل اوي<br />وابو اسحق بقا ايك تقول عليه حاجه لانه من اكبر علماء الحديث اللي في العالم<br />وبعدين يا سيدي الفاضل ان الشيخ يكون بيزعق دي مش ازمه ولا مصيبه ولا حاجه تؤخذ عليه ونعتبرها سلبيه كبير لدرجه اننا نقول نسمع لاي حد الا اللي بيزعقو<br />هقلك بقا على حاجه لازم تكون عارفها قبل ما تتريق على الشيوخ اللي بيزعقوا<br />النبي صلى الله عليه وسلم لما كان بيخطب كانت تحمر وجنتاه<br />لازم يا حبيبي دبدوب متقلش كلام اليساريين قبل ما تعرف صح ولا غلط<br />وبحبك يا دبدوب"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210329/http://masr.20at.com:80/article.php?sid=71&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 8
subject = "تعليق الملابس"
author = "Dabdoob"
posted = "2006-03-28"
text = "يا بني ارحمني من حكاية اليساريين دي<br />انت عليك عفريت اسمه شمال<br />انا مش يساري (لاني بالعب باليمين)<br />والرسول كان بيخطب كده لان طريقة الخطابة كانت ساعتها كده ليه بيزعقوا دلوقتي<br />انا ضد الصراخ والزعيق عموما سواء كان اللي بيزعق شيخ او شرم الشيخ<br />اما اسحق الحويني ومحمد حسين يعقوب فهم علي عيني وراسي وعلمهم لا شك فيه لكنهم للاسف يودون لو يطلبون منا ان نرجع الي البادية لان الرسول كان يعيش فيها!!!!<br />اما بالنسبة لموضوع التحريم فانا قلت لك برضه انهم بيدوروا علي الشبهات مش بيتجنبوها وانا اعرف واحد كان محرم المحشي لان (لا مؤاخذه يعني ) كان فيه ايحاءات وحشة!!!!!!!!!<br />والناس اللي قالت علي الاسلام اشتراكي مثلا كان عندها ادلة برضه من الدين !!!!<br />الموضوع موضوع تفسير وفهم مش موضوع مزايده<br />و<br />و<br />و....سلام<br />Dabdoob"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210329/http://masr.20at.com:80/article.php?sid=71&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 9
subject = "لماذا سقط حزب الغد في اول اختبار ؟؟"
author = "كرملينو"
posted = "2006-03-28"
text = "تعرفوا ليه حزب الغد فشل ؟؟؟<br />لان ايمن نور كان عايز يعمل حزب و خلاص جمعلوه حبة يساريين على حبة ناصريين على حبة ليبراليين على اسلاميين على شوية مثقفين و سطيين يعني عمل مقلوبة<br />قامت مقلوبة فوق دماغه<br />اما انا بقا فاحب العب كورة ( شراب )<br />حارس المرمى : واحد معدي ( واحد تاني )<br />الليبرو : مصري<br />خط الظهرمن اليمين للشمال<br />كرميلينو ونج يمين<br />دبدوب ونج شمال ( يساري بقا )<br />عبد الله مفتاح مساك ( الله يكون في عون المهاجم اللي هيمسكه )<br />عابر القارات مساك<br />خط النص بقا كله جنس لطيف<br />هبهوب نص يمين<br />نيفين نص شمال<br />سويت برنسس صانع العاب<br />المهاجمين او الفراوده<br />سوسه المفروسه<br />مينا ( عشان الوحدة الوطنيه )<br />الاحتياطيين : كل اللي نسيت اسمائهم<br />و الوداع"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210329/http://masr.20at.com:80/article.php?sid=71&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 10
subject = "تيجي نروح الحفله ....."
author = "هووووووبه خط النص"
posted = "2006-03-28"
text = "ايه رايكن نرزح الحفله ايها التنكريه<br />ولون انا مش حابه اكون \" اقبال بركه \"<br />بس ممكن نغيرها<br />اول ما اخش الحقله تقولوا \" اقبال \"<br />وانا اقول \" بركه يا جامع \"<br />وبكدا اكون خلصت منها اوف<br />دبدوب يمسك الكره وكل اللي يتخانق معاه<br />يقوله \" مفيش فايده ويبقي كدا هو \" الفايده \"<br />اشفكوا هناك يا بشر<br />واللي عايز يلبسني حاجه تاني يقول \" الاكسسورات عليه \""
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210329/http://masr.20at.com:80/article.php?sid=71&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

