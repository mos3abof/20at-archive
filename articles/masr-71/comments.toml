[[comments]]
order = 0
subject = "تجي بجد نعملها"
author = "عبدالله مفتاح"
posted = "2006-03-25"
text = "والله الفكرة حيويه جدا تعالوا نعملها مع بعض والله بتكلم بجد واحنا مش اقل من اللي عملوها بس احنا بقا نعمل مجمع البحوث الاسلاميه او جامعة الدول العربيه ونضمله ناس من برة<br />يعني مثلا اكرم يدي جدا على محمد صبحي (فنان ومثقف) ده اهملنا في ميوله البن لادنيه<br />ودبدوب يدي على خالد يوسف<br />اما هبهوب تدي علي شاهيناز النجار عضو مجلس الشعب(دائرة المنيل)<br />اما نيفين تدي على د.زينب رضوان عضو مجلس الشعب بردو(معينه من الريس)<br />اما البنت اللي بتشجع فادي فدي تمثل ايناس الدغيدي<br />حد بقا يقلول انا ادي على مين.<br />فكروا كده وعايزين نعمل الموضوع ده"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210329/http://masr.20at.com:80/article.php?sid=71&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

