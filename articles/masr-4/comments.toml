subject = "زرغوده"
author = "هوبه او هبهوب"
posted = "2006-03-14"
text = "ياه عليكي يا بوبي لو مكنتيش تحلفي<br />اولا \"المهر\" عايزها غااااالي لو شاطر يعملي دركولا وانا متاكده انه يعرف اوي اصلي شفت الفيلم بتاعه من اخراج ابوه ياما شرب من \"دم\"<br />شعب . كان حلم عمره يصلي الفجر ويعيش .<br />\"الشبكه \" عايزها غاليه هو مش عارف انا بنت مين , و\"الصايغ\" يكون وزير التعليم \" العالي\".<br />\"الموخر\".... مش عايزه كتير كل اللي عايزه حسابه في \"البنك \"وبس<br />شوفتي انا متواضعه ازاي .<br />اه ه الفرح عند امه جنب شجره المشمش"
