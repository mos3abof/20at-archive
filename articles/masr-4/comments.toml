[[comments]]
order = 3
subject = "ده مش راجل"
author = "مصرى"
posted = "2006-05-09"
text = "إزاى واحدة تتجوز واحد قد أبوها وبعدين كل الظواهر بتقول عنه أنه مش راجل يعنى زى أختى بالظبط وبعدين ده فلوسه من حرام لأنها فلوس الشعب إللى إتنهبت منه وثمن بطالة الشباب وثمن الأمراض الفتاكة إللى أصابت المصريين إزاى واحدة بتخاف ربنا زى ما هما بيقولوا أن أبوها راجل متدين وتقبل وضع زى كدة بالإضافة أن أمه أصلاً مش من الحسب والنسب إللى يليق نسب عيلة زى عيلتكم لأنه أمه أمها تمرجية إنجليزية ومش مسلمة وطبقاً للقانون الإنجليزى الولد ينسب للأم يعنى بالصلاة على النبى إبنها يبقى مش مسلم وإسمة هناك جيمى يعنى كده ها تضمنى إن ولادك ها يطلعوا فاقدين الجنسية والأهلية بالإضافة إنه مدمن وتاجر مخدرات وتاجر آثار كبير يعنى بيتاجر فى الممنوع بالإضافة إنه إبن أمه ومش ها يسمع كلامك فى يوم من الأيام يعنى كده على بلاطه دى جوازة سوده وهوه لو كان لقى كلبة ترضى بيه كان أتجوز من زمان لكن محدش كان راضى بيه خالص وذنبك على جنبك وعقلك فى راسك يعرف خلاصك"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204415/http://masr.20at.com:80/article.php?sid=4&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "عقبال كل المصريين"
author = "ابو كرتونة"
posted = "2006-05-13"
text = "مبروك والف مبروك كمان يا جيمي حسني مبارك الكلام ده مش من قلبي بس اعمل ايه انا بحب الخير لكل الناس حتي لو سارق البلد زيك وحرامي كمان بس اعمل والف مبروك كمان خديجة<br />وعقبال التسعة مليون عانس من شباب وشبات مصر الي مش متزوجين ولا حيتجوزو في عهدكم السعيد<br />بس لي طلب عندك يا جيمي:- يا ريت مش تسمي ابن تامر والنبي بلاش تامر ولا وائل كمان<br />ليصبح خليفة مصر القادم الرئيس تامر جمال مبارك"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524204415/http://masr.20at.com:80/article.php?sid=4&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

