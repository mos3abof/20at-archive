posted = "2007-01-26"
text = "سلام عليكم<br />يا جماعة انا اعرف رجالة متزوجين بآلهم كذا سنة و لسه علاقتهم مع زوجاتهم جميلة و رائعة و اغلبهم بيبؤا متدينين لدرجة ان واحد صحبى كاتب اسم زوجته على الموبايل جنة الدنيا<br />يا جماعة دى صورة و دى صورة و اى واحد ممكن يحط نفسه بين الصورتين<br />دا طبعا بالاختيار الجيد جدا و الاستخارة ثم الاستخارة ثم الاستخارة"
archived = "2009-07-30"
capture_url = "https://web.archive.org/web/20090730014221/http://www.20at.com:80/20at/7ayatna/3116.html"

[[comments]]
order = 6
subject = ""
author = "just person"
posted = "2007-01-27"
text = "السلام عليكم و رحمة الله وبركاته<br />موضوع لذيذ بس للاسف كل واحد بيتكلم فيه أو واحدة بيتكلم من منطلق الحياه اللي اللي شايفها وعايشها<br />الموضوع ابسط من كده بكتير وما حدش يفتكر ان الحياه هتمشي بمبي ومافيهاش اي مشاكل<br />لأ لازم من المشاكل احنا عايشين في الدنيا لسه ما دخلناش الجنه ( اللهم ارزقنا الجنان العلى يا رب )<br />بس اي مشكلة بقى ترتبط بتفاهم الزوجين مع بعض ولازم برده كل واحد يكون قايل عيوبه للتاني بكل صراحه عشان بعد كده ما يقولش يا ريت اللي جرى ما كان وكمان لازم نعدي لبعضنا الحاجات الهايفه اللي ما تستاهلش نتكلم عليها دي<br />اي حاجة ما لهاش لزمة خلاص عدت مش لازم بقى ننخور فيها ونغوس في الحلل عشان توصلوا للرومانسية اللي عايزنها على طول . ثم ما تنسوش ان الراجل برده محتاج اكتر للرومانسية من البنت . الراجل ما هو اللي طفل كبير محتاج للي يدلعوا و يطبطب علبه وياخده في حضنه ولا إيه؟<br />وللأخت اللي بتقول اننا بنتجوز عشان نوفر فلوس الخدامه عايز اقولها أتقي الله في الرجال مش هما دولا اللي بيطحنوا ويتبهدلوا عشان خاطر بيتهم ولا إيه ؟ اهوه انتي كده باعتبارك للفكرة دي انتي اللي بتسعي للعكننه وان ده مش واجب عليكي بتعتبريه تفضل<br />عايز اختم بس بكلمة بسيطة ان طبيعي ان يحصل مشاكل بين الازواج ولو كان في رجال او ستات مش هيعملوا مشاكل مع بعض كان أولي بيها سيدنا محمد ( صلي الله عليه وسلم ) و زوجاته ولا إيه؟<br />أرجو إني ما كونش طولت عليكم"
archived = "2009-07-30"
capture_url = "https://web.archive.org/web/20090730014221/http://www.20at.com:80/20at/7ayatna/3116.html"

[[comments]]
order = 7
subject = ""
author = "مهيب"
posted = "2007-02-06"
text = "طبعا أكيد نفسنا نعرف رأى هانى فى الموضوع .. انتى اللى عندك نافذة للكتابة و زى ما كلنا ملاحظين مبينة انك ملاك رقيق يمشى على العشب فلا يكسره .. لكن الحقيقة ان نسبة المتحولات بعد الجواز أكتر بكتير من نسبة المتحولين .. ذلك لأن الأمر فيه هرمونات و جينات و مشاكل .. البنت الرومانسية بجد رومانسيتها لا تشوبها شائبة بعد الجواز .. أما البنت اللى (بتترمنس) يعنى بتبين انها رومانسية قبل الجواز طبيعى انها تبطل ده بعدين .. ده بالاضافة الى ان الشكوى الدائمة ضد أى سعادة زوجية .. و انتى شكوتك فى صورة يوميات .. طبعا ممكن يكون كل الكلام ده مجرد افراز أدبى مش أكتر .. لكن فى النهاية لو قريتى كتابات يوسف عوف أو أحمد رجب هتعرفى ازاى تكون السخرية ثنائية الجانب .. مش على غرار : \"يا ناس .. أنا ملاك لسه نازل من السما حالا .. حتى لسه محطيتش الشنط .. أما جوزى فكرسيه فجهنم محجوز باسمه .. ارجوكم حبونى و اكرهوه \""
archived = "2009-07-30"
capture_url = "https://web.archive.org/web/20090730014221/http://www.20at.com:80/20at/7ayatna/3116.html"

