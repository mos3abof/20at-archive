posted = "2009-12-18"
text = "لاإله الا الله<br />حسبي الله ونعم الوكيل من كل ظالم جبان<br />مامن يدإلا يد الله فوقها ومامن ظالم إلا سيبلى بظالم<br />أمامنا الدعاء فاللهم انصر الاسلام والمسلمين واحمي القدس والفلسطنيين<br />اللهم آمين آمين آمين"
