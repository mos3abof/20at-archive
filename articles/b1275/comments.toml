subject = "حكايات جدة أحفادي"
author = "إبن بهية"
posted = "2006-09-27"
text = "يذكر أنه كان في بلاد مصر شيخاً جليلاً مجلجلاً مدجناً يقال له طن طاوي ، لمع نجمه وعلا علواً كبيراً فيما كان يعرف قديماً بدار الإفتاء .. حيث لم يذكر لنا التاريخ أن عالماً وصل به العلم إلى ما كان عليه السيد طن طاوي الذي تغلب على الكلاشنكوف في سرعة إطلاق الفتاوي الطازجة .. عادة وسبايسي .. فبرع في فنون الإفساء براعة الثعالب .. بل أشد رائحة وغيلا ((مش عارف يعني إيه غيلا .. بس عديها)) لدرجة تسببت في العديد من الحوادث المرورية للسيارات التي كانت تعبر الطريق من أمام دار الإفساء التي يتبوأ فيها مكانة المفسي ..وصل صيت الرجل في الإفساء إلى القوادة السياسية فققرت مكافئته وجعلته يتبوأ ((في خرابة أخرى)) مكانة أخرى عظيمة هي مشيخة الآزهر .. فبهر الرجل بالأضواء والشهرة العالمية ولم يدخر وسعاً في إطفاء لمساته وأفكاره النيرة على المكانة الجديدة التي تبوأها فراح يحسن من أدواته ويجود في الإفساء الذي تطور مع الفيديو كليب وموسيقاه الراقصة إلى مرحلة الضراط .. واستطاع السيد طن طاوي في سنوات قليلة تحويل مشيخة الأزهر إلى مشخخة بدرجة معفن جداً جداً .. وهي مكانة لم يصلها قبله إنس ولا جان .. وتحولت مشخخة الأزهر في العصر الطن طاوي المشحون بالضراط إلى مجرد كتاب سيدنا كعبول في كفر كعبلون بحري .. فتم في عهد الشخاخ الأكبر إغلاق كافة المكتبات والإرساليات التابعة للمشخخة في دول أفريقيا وبعض الدول الأجنبية الأخرى توفيراً للشخاخ والضراط لوقت عوزه .. راجل فهمان طبعاً .. مش يستحق لقب الشخاخ الأكبر برضه ؟ وفي عهد ذلك الشخاخ الأكبر أيضاً تضائل .. تضائل .. تضائل دور الأزهر على كل المستويات والأصعدة ، محلياً ، إقليمياً ، وعالمياً وجلس صاحب الفضيلة المعفنة على تل كتاب سيدنا كعبول يستقبل الوفود الأجنبية التي لم تأت لإشهار إسلامها كما كان في الماضي وإنما أتت للفرجة على القرد أبو صديري المتصدر على رأس المشخخة بأمر القوادة السياسية الخكيمة .. في الختام نسألكم الفاتحة على روح فقيد الأمة الأزهر الشريف"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102123352/http://www.20at.com/article2.php?sid=1275"
