subject = "حسبي الله ونعم الوكيل"
author = "فارس"
posted = "2006-09-25"
text = "حبيت اعلق على الكلمة دى \"هناك انحراف عن هذا الاتجاه\" .... معلش هترك الموضوع الاساسي . تقدر تقولى ايه فى مصر مفيهوش انحراف .. اولا رئيس عميل ومنحرف .. ابنائه على نفس درب الاب مشوا \"سرقه بلطجة انتخابات نزيهه اه نزيهه ... واحتمال يكون فى عندنا نووى قريب بجهود جيمى ميارك \" حكومة عملاء وحرامية ... ايه اللى عندك فى مصر مش منحرف عن مكانه ؟ ايه.....الدعة اللى انت بتقول عليهم ان الشهر ده بالنسبه لهم شهر السبوبة .. ده مرتبه هيكون كام يعنى وشوف بقى عنده كام عيل يعنى لازم يودروا على رزقهم يا اخى . مش كده ولا ايه .. وحسبي الله ونعم الوكيل فيك يا حسنى انت وولادك وحكومتك \" اللهم اهلك الظالمين بالظالمين واخرجنا من بينهم سالمين \"<br />امييييييييييييين<br />وحسبي الله ونعم الوكيل"
archived = "2006-11-02"
