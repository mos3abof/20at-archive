[[comments]]
order = 0
subject = "تنبيه"
author = "كيف إذا كانت هذه الوسائل لا تجدي نفعا إلا لمدة محدودة ثم سرعان ما ينهار الشخص مع أول إغراء، نرجوا أن تبحثوا معنا في هذه المسألة."
text = "وهذا في الحقيقة إنما يحصل للذي وقع في هذه الجريمة، أما الذي حفظه الله من الوقوع فيها فهو قادر بإذنه سبحانه على التزام هذه الوسائل، ويكفيه منها أن الله أمر بغض البصر."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145130/http://www.20at.com/article.php?sid=1539"

[[comments]]
order = 1
subject = "arabe@arabe.com"
author = "لسلام عليكم"
text = "لا مشكلة عندما يتزود الانسان بشحنة ايمانية عن طريق :<br />الصلاة،الأذكار،القرآن،الصدقة ،الصحبة الصالحة،<br />لكن عندما يفتقد المؤمن هذا كله لم يبقى إلا الدعاء<br />يا سميع يا عليم يا بصير أعنى على غض البصر و حفض الفرج و خفف عنا بفضلك و منك يا أرحم الراحمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145130/http://www.20at.com/article.php?sid=1539"

[[comments]]
order = 2
subject = "تذكر"
author = "و امر بسيط جدا"
text = "فتذكر انك مهما نظرت الى الفتاه او الشاب فان هذه الفتاه او هذا الشاب سيرحل عنك سيرحل ولكن الذنب سيبقى<br />وتذكر انك اذا نظرت الى فتاه او نظرتى الى شاب فى المواصلات مثلا وبعد كده نزلت فماذا تتذكر منها تجد انك قد نسيت الموقف تماما نسيت الفتاه او الولد ولكن الذنب هو الذى يبقى<br />ففى هذا الموقف تذكر الذى سيرحل وتنساه والذى سيبقى وتفتكره"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145130/http://www.20at.com/article.php?sid=1539"
