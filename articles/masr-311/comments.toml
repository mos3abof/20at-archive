[[comments]]
order = 1
subject = "البركاااااااان"
author = "مصرية"
posted = "2006-05-13"
text = "لااصدق مايجرى فى بلدنا الحبيب مصر لا اصدق ان الفساد والافساد وصل الى هذه الدرجة المخزية. رجال الامن اصبحوا رجال السلطة الفاسده اصبحت الايادى الشريفة التى كانت تحمى اداة بطش واعتداء على الشعب .الاعلام يتغنى بالانجازات الفذة فى عصر الديمقراطية التى لم تشهدها مصر من قبل .اقلام النفاق تملا الصحف واخش من يأس الاقلام الشريفة وسط هذاالفساد الذى نغرق فيه. كل من يعارض او يقول لا يطبق عليه قانون الطوارىء وكأنه ارهابى الديمقراطية المباركيه هى حرية التعبير عن امجاد وانجازات الحكم المبارك كل حسب مدى مقدرته على النفاق وكل من يتعدى هذا الحد هو خارج عن القانون وانت وحظك فى التهمه المنسوبة اليك والمصيبة الكبرى عندما تستمع الى تصريحات اىمسؤل من القمة الى القاعدة نجدهم يتحدثون عن بلد اخرى غير مصر وعن شعب آخر غيرناوعن احوال اخرى غير احوالنا هل يخدعوننا او يخدعون انفسهم او يخدعون العالم . ان فضائحكم امتلات بها كل وسائل الاعلام فى كل الدول انكم فى النزاع الأخير لأسوأ واسود صفحة من تاريخ مصر. واقول للمصرى من رجال الأمن اوالشرطة الذى سمح لنفسه ان تمتد يده ل بالأعتداء على ابناء شعبه: الذى<br />يعطيك هذا الأمر اليوم ربما غدا لن يكون فى مكانه ليسكت ضميرك اويحميك .لاتشرك نفسك مع الفساد والظلم لأنه حتما الى زوال مصر اليوم فوهة بركان وحتما سيثور وسياتى يوم الحساب والى كل الأقلام المنافقة قريبا ستتوقفون عن النفاق وابدؤا بالبحث عن بديل للكتابة لان الشعب سيلفظكم معهم وسنظل نقول لالالالالالا للفساد ولالالالالالالالالالا للتوريث ولالالالالالالالالالا لكل افراد عصابة السلب والنهب والبطش والقهر البركان قااااااااااادم<br />ا"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904191328/http://masr.20at.com:80/article.php?sid=311&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

