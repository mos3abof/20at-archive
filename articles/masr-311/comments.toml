[[comments]]
order = 9
subject = "التطهير لن يترك ظالم"
author = "ميدو مشاكل"
posted = "2006-05-17"
text = "شكرا ياعم بلال ودايما معانا<br />على الرغم من كل ما يحدث فى البلد الا انى والله متفائل لايام القدمة وحاسس ان خلاص هانت وقربت جدا<br />واعطى نصيحة اخوية صادقة لكل من يتعاون مع الفساد من كافة الهيئات سواء داخلية اوقضاة او اعلام ان التطهير لت يترك احدا والمحاسبة من الشعب يومها سينال منكم جميعا فاحترسوا من هذا اليوم لأنه قرب جداجدا.ويومها لن ينفعكم ظالم لأنه هايكون بين يدى ربه وتذكروا ماحدث لزبانية صدام جميعا فالقطار قد طلع من المحطة خلاص ومحدش هيقدر يوقفه فالخيارات امامكم حاجة من تلاته<br />الأول.ان تركبوا القطار مع الشرفاء<br />الثانى.ان تقفوا على الرصيف مع المنتظرين<br />الثالث.ان تقفوا فى وش القطر فيدوسكم كالمجانين"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904191328/http://masr.20at.com:80/article.php?sid=311&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

