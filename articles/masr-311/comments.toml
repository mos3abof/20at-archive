text = "اسمعوا عم احمد قال عليكم ايه من زمان<br />إنتوا دود الارض<br />والافه المخيفه<br />إنتوا ذره رمل<br />فى عيون الخليفه<br />إنتوا كرباج المظالم<br />والماسي<br />إنتوا عله ف جسم بلدي<br />إنتوا جيفه"
