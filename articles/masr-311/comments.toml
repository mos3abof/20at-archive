text = "هى دى قمه المساواه بين المناضل والمناضله<br />مفيش تميز كله تحت جزمه الظابط سواء<br />كله<br />المواطن وحتى الوطن<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com"
