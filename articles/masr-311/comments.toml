[[comments]]
order = 3
subject = "يحيا العدل"
author = "أحمد رحال"
posted = "2006-05-13"
text = "يا سلام يا أخي , شوفت العدل و المساواة .. كله هيتم إغتصابه على العموم ؛ ست راجل مش فارقة .. يا عم روح اشترك في مركز شباب جنب بيتكم و العب كرة ماء ولاّ حاجة.. ايه اللّي عاجبكم في السياسة للدرجة دي ؟؟ روح صاحب واحدة و اعمل الصح بعدين تعالى قول سياسة و مسياسشي .. مش كفاية الشرطة بتحميكو من شرور أنفسكم و أفكاركم الهدامة .. مش إنت باباك كان بيضربك و إنت صغير لمّا تعمل حاجة غلط ؟؟ أهو بابانا كلنا بيقول لقوات الأمن تضرب اللّي يعمل حاجة غلط"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904191328/http://masr.20at.com:80/article.php?sid=311&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "إذا لم تستحى فاكتب ما شئت"
author = "حسين عبد الرحمن"
posted = "2006-05-13"
text = "يا سيد بلال يا فضل ، هل الكتابة الساخرة لا تحدث إلا إذا إستخدمت آيات القرآن فى كتاباتك بهذا الأسلوب ، لا أفهم لماذا تصر على هذا الإسلوب ، كلما قرأت مقال لك وجدت نفس الأسلوب ونفس الطريقة ، ألا تعرف أن عنوان مقالتك هذه مستفز ،"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904191328/http://masr.20at.com:80/article.php?sid=311&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "مصر لسه فيها رجالة"
author = "واحدة وخلاص ....... لكن مصرية جدا"
posted = "2006-05-14"
text = "الرجالة مش حيسكتوا<br />ومصر كلها رجالة<br />وكل اللي بيحصل ده في مصلحة الشعب مش ضده<br />لانه بيصحي الرجال ويفوقهم ولأن الامور زادت عن حدها قوي قوي قوي وخلاص مسكنات الحكومة مبقتش تنفع مع الناس<br />الناس بتقوم بتفوق وده معناه ان النهاية قربت قوي قوي<br />وبضم صوتي لوصت مصرية<br />انا اخشى يأس .. (اصحاب الضمير).. في كل مجال في مصر<br />واقول لهم \" انتم على حق ..ارجوكم لا تيأسوا ارجوكم لا تضعفوا وتخضعوا للشيطان .. فأنتم املنا.. انتم نواه الاصلاح في كل مكان ومجال ..\"<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور"
archived = "2006-09-04"
capture_url = "https://web.archive.org/web/20060904191328/http://masr.20at.com:80/article.php?sid=311&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

