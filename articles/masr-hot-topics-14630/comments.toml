posted = "2010-01-06"
text = "بصوا بقى الى بيقول عمرو موسى حرامى وابن مش عارف ايه وعايز جمال مبارك انا بقوله اتقى الله وحسبى الله ونعم الوكيل احنا يا سيدى الفاضل من اسوء الدول على كافه المجالات مافيش طوابير عيش وانا بيب غير عندنا مافيش عبارات بتغرق والمسئول عن ده بيهربوا بره البلد الا احنا ما فيش فساد ومحسوبيه ورشاوى الا عندنا اه فيه فساد فى كل حته بس مش زى هنا احنا الفساد عشش جوه البلد كل تقارير الامم المتحده بتقول ده بس علشان احنا نظام بوليسى وما فيش اسوء مننا مش عارفين حتى نحاب اى حد ابراهيم سليمان بيساعدوه علشان يهرب من جرايمه اكياس دم ملوثه وكل دول رجاله النظام ايه تانى حرام عيكوا بقى انا والله نفسيتى تعبت وما بقتش حتى عندى اى امل املى فى ربنا يصلح حالنا ويغفرلنا ذنوبنا ويشيل الغمه عنا الناس مش لاقيه تاكل والله ناس كتير اوى كده تعليم بايظ ومتاخر شوفوا اسرائيل بيعملوا ايه بيصرفوا قد ايه على البحث العلمى واحنا بيصرفوا فلوس الشعب على منتجعتهم وقصورهم وطقم الحراسه للاولاد وبعد كل ده تقولى جمال انا عايز اكتب كتير اوووووووى بس للاسف المساحه هاتخلص اللهم ارفع الهم والكرب عن مصرنا يا رب العالمين"
archived = "2010-02-01"
