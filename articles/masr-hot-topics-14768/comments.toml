author = "بقية التعليق السابق"
posted = "2010-01-07"
text = "2. ما هو سبب تسمية الجدار المزعوم بالجدار الفولاذي؟<br />أطلقت الصحافة الإسرائيلية هذا الاسم في محاولة منها للوقيعة بين مصر والأخوة الفلسطينيين واستثارة الرأى العام الداخلي في مصر، وذلك من خلال الإشارة الضمنية إلي أن مصر تقوم بنفس الإجراءات التي قامت بها إسرائيل عند بناءها الجدار العازل في الضفة الغربية، والتي حكمت محكمة العدل الدولية بعدم مشروعيته. وللأسف انساق عدد من وسائل الإعلام وراء هذه التسمية المشينة."
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112125400/http://www.20at.com:80/masr/hot-topics/14768-2010-01-05-23-33-25.html"

[[comments]]
order = 9
subject = ""
author = "الجدار الفولاذى"
posted = "2010-01-07"
text = "الجدار الفولاذى المزعوم بين الحقيقة والخيال<br />س+ ج<br />ما هى حقيقة الجدار الفولاذي المزعوم؟ وما هو الدافع من وراء إثارته في الوقت الحالي؟ ومن المستفيدين؟ وهل يضر ذلك بالقضية الفلسطينية ودور مصر التاريخي فيها؟ كلها أسئلة مشروعة يطرحها الرأى العام وتتناولها صفحات الجرائد والمجلات في الصباح وشاشات الفضائيات في المساء.<br />نحن هنا نلقي الضوء على حقيقة ذلك الجدار المزعوم، ونفند المزاعم المثارة حوله.<br />1. كيف بدأت قصة ذلك الجدار المزعوم؟<br />بدأت القصة التي تناقلتها وسائل الإعلام بدون وعي وتمحيص عن جريدة هآرتس الإسرائيلية التي أدعت أن مصر تقوم بإقامة جدار فولاذي يضرب في عمق الأرض لقطع الطريق على أنفاق التهريب الفلسطينية. وإذا كان الهدف النهائي للإنشاءات المصرية على حدودنا الوطنية هو منع التهريب بالفعل، إلا أن صياغة الصحيفة الإسرائيلية، وكعادتها هدفت إلي بث السم في العسل من خلال الإيحاء بأن مصر تقوم بهذه الإجراءات لتجويع الشعب الفلسطيني ولمعاقبة حركة حماس."
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112125400/http://www.20at.com:80/masr/hot-topics/14768-2010-01-05-23-33-25.html"

