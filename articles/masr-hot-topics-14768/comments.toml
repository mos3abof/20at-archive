author = "الطريق الى ابو حصير"
posted = "2010-01-05"
text = "اليهود يدخلون مصر ان شاء اللة امنين راكبين اتوبيسات سياحية فخمة وامامهم وخلفهم سيارات شرطة تحرسهم وتخلى لهم الطريق وتمنع المارة المصريين - ليصل اليهود فى النهاية للاحتفال بمولد ابو حصيرة او ابو طيز عريانة<br />انما بتوع غزة الكفرة الملاحدة فلا بد من ضرب كل من يساعدهم او يمد لهم يد العون"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107091031/http://www.20at.com:80/masr/hot-topics/14768-2010-01-05-23-33-25.html"

[[comments]]
order = 1
subject = ""
author = "عايزين نتصور معاهم"
posted = "2010-01-05"
text = "وبتوع الوطنى رايحين يقابلوهم لية<br />قافلة اغاثة تريد دخول قطاع غزة بريا<br />مرافقة من سيارات الشرطة لتامين المسار وينتهى الموضوع - انما محاصرة الناس بقوات امن مركزى وعمل سور بشرى من القوات حولهم وكانهم عصابة تهريب - القوات نفسها تستفز الناس - هى العملية كتر عساكر واركب يا ولة انت وهو وحرك لى كتيبتين لمقابلة شوية مدنيين<br />اى نعم القوات المبالغ فيها بتستفز الناس بمنظرهم الغبى والمتخلف<br />صدقونى التصرفات الامنية بتظهر اننا دولة عايشة فى القرن الثامن عشر ايام المماليك"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107091031/http://www.20at.com:80/masr/hot-topics/14768-2010-01-05-23-33-25.html"

[[comments]]
order = 2
subject = ""
author = "غزاوي"
posted = "2010-01-06"
text = "يا حلاوتك يا مصر وانتي مشرشحة في الإعلام ,<br />كده يرضيك ؟<br />يا جماعة انتو ما بتعرفو حكومتكم ازاي مستغفلاكم .. والله انكم طيبين كتير يا شعب مصر<br />وطيبتكم مودياكم في ستين داهية ,<br />خلص بقى اصحو وشوفو الي بيحصل بجد ,<br />ذنبي ايه اتحجز في المعبر 14 ساعة واترحل ترحيل واضلني بمطار القاهرة 16 ساعة عشان بالاخر اسافر السعودية !<br />يعني هيحصل ايه لو كل شي مر بسهولة ؟ ولا خلص انا فلسطيني يبقى يتلعن ابو ابويا في المعبر وكل شي !<br />بينما ست يهودية لما فاتت المعبر كل الضباط مشيو وراها يحرسو كلبها ! يعني مشهد مؤلم وجداً كمان واحنا شايفين العروبة أمامنا كده ,<br />بحكي وبعيد وبكرر , بجد حكومتكم مستغلة طيبتكم ومستغفلاكم , الي بيحصل ضد غزة كبير , وكبير كتير .. بعيداً عن حماس وغيرها , في 1.5 مليون فلسطيني طول عمرهم أهل عزة ونخوة وما رح يجي اليوم الي يتذلو فيه , يعني خسارة تخسروهم وتخسرو النخوة يا حكومة مصر وخليني اقول يا شعب مصر لأجل إرضاء محور الخراب في العالم<br />وتصبحون على عروبة"
archived = "2010-01-07"
capture_url = "https://web.archive.org/web/20100107091031/http://www.20at.com:80/masr/hot-topics/14768-2010-01-05-23-33-25.html"

