subject = ""
author = "بقية التعليق السابق"
posted = "2010-01-07"
text = "6. هل يعد ذلك الجدار بداية لتغيير سياسة مصر تجاه القضية الفلسطينية؟<br />بالتأكيد سياسة مصر لن تتغير، فمصر ملتزمة بعدة مبادئ تحظى باجماع بين النخبة السياسية وقطاعات الرأى العام على اختلاف الانتماءات الحزبية والأيدلوجية، وأبرزها:<br />• أن مصر ملتزمة بالقضية الفلسطينية حتى يتم تحقيق السلام الشامل والعادل والإعلان عن الدولة الفلسطينية المستقلة وعاصمتها القدس الشرقية.<br />• أن مصر ترحب بكافة أنواع المساعدات الغذائية والوقود والمتطلبات التي يحتاجها الشعب الفلسطيني في غزة، وهى على استعداد تام للمعاونة في توصيلها طالما تم الالتزام بالضوابط القانونية المنظمة لذلك.<br />• أن قيادة مصر واعية بكل أبعاد العلاقات المتشعبة مع إسرائيل، ولا يوجد ما يدعو إلي إعطاء من حارب وقاتل وفاوض وعرف إسرائيل داخلها وخارجها دروسا في حماية الأمن القومي.<br />• التزام مصر الأصيل بحماية أمنها القومي وأمن المواطن المصري، فالأصل هو حماية حدود الوطن من أى انتهاك..<br />القاهرة في 06/01/ 2010"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112125400/http://www.20at.com:80/masr/hot-topics/14768-2010-01-05-23-33-25.html"

[[comments]]
order = 5
subject = ""
author = "بقية التعليق السابق"
posted = "2010-01-07"
text = "5. هل الانتقادات الموجهة إلي الإنشاءات المصرية على الحدود في محلها؟<br />الإجابة بالقطع لا، وذلك لثلاث أسباب ، هى:<br />• أن مبدأ السيادة الوطنية ومسئولية كل دولة عن أراضيها هو حق قانوني أصيل، ومبدأ مترسخ في العلاقات الدولية، لذلك فأنه من الغريب أن تنتقد بعض الأقلام مصر في إجراء هدفه حماية حدودها الوطنية من الانتهاكات المتكررة والتي كان أخرها الاجتياح السكاني لرفح في 22 يناير 2008.<br />• أن معبر مصر مفتوح للأفراد وفق الاتفاقيات الدولية، والضوابط المنظمة، والتي كثيراً ما تتساهل فيها مصر مراعاة للطابع الإنساني وحرصاً على العلاقات الأزلية مع الشعب الفلسطيني.<br />• أن مصر لن تسمح أبداً بأن يتم تجويع الشعب الفلسطيني، وفرض الحصار الإسرائيلي الغاشم عليه، وأنها تسعى بكل الطرق الدبلوماسية إلي ضمان وصول المساعدات الإنسانية إلي أهالينا في فلسطين."
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112125400/http://www.20at.com:80/masr/hot-topics/14768-2010-01-05-23-33-25.html"

[[comments]]
order = 6
subject = ""
author = "بقية التعليق السابق"
posted = "2010-01-07"
text = "4. من هى الجهة التي تقوم بالإنشاءات؟<br />القوات المسلحة هي التي تقوم بتنفيذ الإنشاءات الهندسية تعزيزا للحدود المصرية وليس أى طرف أجنبي آخر كما تردد. لماذا هذا التوقيت بالذات؟<br />كانت تراهن مصر على فكرة تحقق المصالحة الفلسطينية، وأن هذه المصالحة سينتج عنها حال تحققها إعادة الهدوء إلي منطقة غزة ووضع آلية أمنية لمنع حالات التهريب، لكن مع إطالة الجانب الفلسطيني لمدة التفاوض وإصرار كل طرف على موقفه، وجدت مصر نفسها أمام خيارين أما ترك حدودها منتهكة على أمل تحقق المصالحة وهو أمر غير واقعي وفيه تهديد للأمن المصري، أو التحرك بنفسها لحماية حدودها وأمنها القومي، فاختارت مصر الحل الأخير."
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112125400/http://www.20at.com:80/masr/hot-topics/14768-2010-01-05-23-33-25.html"

[[comments]]
order = 7
subject = ""
author = "بقية التعليق السابق"
posted = "2010-01-07"
text = "3. ما هى حقيقة الإنشاءات المصرية على الحدود المصرية؟<br />الإنشاءات المصرية التي تقوم بها مصر على طول الحدود مع قطاع غزة ليست جديدة‏,‏ بل تطوير لأوضاع كانت قائمة من قبل‏,‏ وهى شأن داخلي الهدف منه وقف عمليات التهريب غير المشروعة التي تقوم بها بعض العناصر الفلسطينية والوسطاء الدوليين، والقضاء على بعض العناصر الإجرامية التي تسعى للقيام بعمليات إرهابية في مصر وتتسلل عبر الحدود وتقوم بشراء الأسلحة التي تستخدم في قتل المدنيين المصريين والسياح الأجانب مثلما حدث في تفجيرات طابا وشرم الشيخ ودهب.<br />أضف إلي ذلك أن السلاح الذي كان يتم تهريبه من خلال الأنفاق ليس بالضرورة أن يوجه إلي صدور المحتل حيث تم استخدامه ضد الفلسطينيين قبل غيرهم."
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112125400/http://www.20at.com:80/masr/hot-topics/14768-2010-01-05-23-33-25.html"

[[comments]]
