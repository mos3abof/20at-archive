text = "فى النهاية اية اللى حصل<br />القافلة دخلت غزة بشروطها ورغم التماحيك الامنية والاستفزازات<br />ودم العسكرى راح ببلاش<br />كان لزمة اية دة كلة من الاصل<br />ما كنتم تركتم القافلة تمشى بهدوء وبلا ضجة<br />والا نعمل عنتر والاخر ننخ ونبقى زى الارانب<br />صحيح ناس جبناء تخاف ما تختشى"
