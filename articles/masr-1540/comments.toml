order = 0
subject = "عايزين الناس تقرأ اية"
author = "الناس تشعر انها فقدت الدنيا لا فلوس ولا وظائف ولا اى شىء وهم معدمين مقهورين المساجد مغلقة وممنوع الدخول وتفتح خمس دقائئق للصلاة"
posted = "2007-02-04"
text = "الناس مش عايزة تخسر الدنيا والاخرة<br />خلوا لنا الاخرة علشان ربنا يتقبل منا<br />قفلتم الجوامع بناقش الدين فى البيوت<br />بنعلم العيال معنى الشرف والكرامة فى غرفهم بعيدا عن مباحث امن الرياسة<br />مش عايزين الناس تقرأ كتب دينية لية<br />عايزينهم يقرأوا عن الخصخصة وبيع البلد لليهود والارمن<br />عايزينهم يقرأوا مقالات النفاق للسلطة فى الجرايد من الصحفيين بتوع سوق الكانتوا<br />عايزين اية بالضبط"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206032647/http://masr.20at.com:80/article.php?sid=1540"

