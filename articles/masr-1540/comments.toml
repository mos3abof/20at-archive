[[comments]]
order = 8
subject = "معرص الكتاب"
author = "أحمد المصري"
posted = "2007-02-06"
text = "معرض الكتاب كان زماااان دلوقت معرض الكشري والهامبورجر وكمان ممكن تلاقي أبو رامي بتاع الشاورما.<br />كتب دينية مجهولة المصدر و مجلات سكس و عربيات و كورة في سور الأسبكيه.<br />أما الكتب المحترمة ففوق طاقة أى مصري متوسط الحال خاصة الكتب العلمية ذات الأسعار الخيالية.<br />ممكن تلعب كورة أو تاكل و تفسح عيلتك لكن الثقافة و العلم غير موجودين بالمعرض.<br />و ذلك حسب توجيهات السيد الوزير الراجل أوي فاروق حسني حبيب الست (عامة و ماله ماهو زي أختها بالضبط).<br />فقط تذكر المعرض و رواده من 15 سنة و قارن ذلك بحاله الآن."
archived = "2007-02-13"
capture_url = "https://web.archive.org/web/20070213143229/http://masr.20at.com:80/article.php?sid=1540"

[[comments]]
order = 9
subject = "واحد"
author = "كتب- أحمد رمضان"
posted = "2007-02-06"
text = "تبحث أسرتا الناشرَيْن أحمد محمود صاحب دار بدر للنشر ومحمد أبو عجور صاحب دار الكلمة للنشر، عضوي اتحاد الناشرين المصريين، عن محل وجودهما بعد أن قامت مباحث أمن الدولة باختطافهما في معرض القاهرة الدولي للكتاب الذي اختتم فعالياته الأحد الماضي 4/2/2007م.<br />وقد وجَّهت أجهزةُ الأمن إليهما تهمة طباعة كتاب عن الإمام حسن البنا (لأحمد محمود)، كما وجَّهت تهمة طباعة بوستر الإمام البنا (لمحمد أبو عجور).<br />وكان ذلك قد تمَّ في اليوم الأول من المعرض؛ حيث تمَّت إحالتهما إلى قسم ثاني مدينة نصر وجرى تحرير محضر أشغال طريق!! ورغم قرار النيابة بالإفراج عنهما بضمان محل إقامتهما إلا أنه لم يتم تنفيذ القرار، وتقرر إحالتهما إلى جهاز مباحث أمن الدولة بلاظوغلي ولا يعرف أحد مكانهما حتى الآن.<br />ومن جانبه أدان المهندس عاصم شلبي- سكرتير عام اتحاد الناشرين المصريين وعضو مجلس إدارة اتحاد الناشرين العرب- ما حدث، مؤكدًا أنَّ الناشر محمد أبو عجور لم يأخذ معه الأدوية الخاصة به، كما لم يصطحب معه أي متعلقات شخصية، ولم يتم عرضه على أي جهةٍ رسميةٍ حتى الآن، معتبرًا ما حدث اعتداءً على حريةِ النشر، خاصةً أنَّ الكتبَ المنشورة مُوثَّقة، وهو ما يُمثِّل اعتداءً على معرضِ الكتاب ..الثقافي في القاهرة الذي لا تُمنع فيه حتى الكتب الإباحية.<br />وأوضح شلبي أنه سأل عن الناشرَيْن في كل مكانٍ يمكن أن يجدهما فيه، إلا أنَّ الجميعَ أنكر معرفة مكانهما، مشيرًا إلى أنَّ اتحادَ الناشرين المصرين تلقَّى مذكرةً من عائلاتِ الناشرين المعتقلين لبحث هذا الأمر، كما ستقوم لجنةُ الحريات باتحاد الناشرين المصرين ببحث الموضوع الذي سيُحال بدوره لاتحادِ الناشرين العرب واتحاد الناشرين الدوليين"
archived = "2007-02-13"
capture_url = "https://web.archive.org/web/20070213143229/http://masr.20at.com:80/article.php?sid=1540"

