[[comments]]
order = 5
subject = "ملكوش دعوة بالهندي"
author = "السيد"
posted = "2007-02-05"
text = "ملكوش دعوة بالهندي يلا يا هندي كمل ملكش دعوة بيهم وشريف اه الي دخل المطبخ<br />وبتاع اه يا عم ريح علي جنب هو الراجل لا<br />غلط في الاخوان ولا حاجة الراجل جاب لقطة<br />حلو ويمكن محدش لاحظ ان الاخوان لمين<br />نفسهم ياليومين دول<br />كمان هو جابهم هما بنفسهم يتكلموا يعني<br />البطل والمتفرجين<br />موضوع جميل<br />بس يا هندي اه اخبار الفيل"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206032647/http://masr.20at.com:80/article.php?sid=1540"

[[comments]]
