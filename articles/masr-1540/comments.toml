subject = "تابع الى الهندي"
author = "يا هندي الاخوان شعبيتهم زادت لانهم قالوا الاسلام هو الحل والناس بتدور على الحل"
posted = "2007-02-05"
text = "حل مشكلة الاكل لان شوية كمان والناس مش حتلاقي اكل<br />الناس عايزه تاكل يا هندي<br />فتح مخك وخلي بالك من حكاية الطبيخ دي"
archived = "2007-02-06"
capture_url = "https://web.archive.org/web/20070206032647/http://masr.20at.com:80/article.php?sid=1540"

