[[comments]]
order = 0
subject = "في إيه ياعم أحمد ؟؟"
author = "محمد السيد"
posted = "2006-07-13"
text = "وانا مع النواب في طلب حذف المشاهد دي ....<br />لأنها بمنتهي الصراحة ملهاش أي لازمة .... وخادشة فعلا لكل عادتنا وتقاليدنا ... ده غير ديننا .. اللي هو الأساس ...<br />ومش معني إنه في أفلام كانت أكتر من كده مشاهدها .... يبقي ده حلو خالص وجميل جدا وغير متجاوز ... والنغمة دي ....<br />وبعدين أنا مش شايف اي سببب يخلي \" الأستاذ \" أحمد يتكلم بالسخرية دي عن النواب ولا عن الطلب ذاته .... لأنه طلب مشروع جدا ومفهوش أي حاجة ....<br />وبرضه مش حاسكت ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091221/http://masr.20at.com:80/article.php?sid=651"

[[comments]]
order = 1
subject = "إنفصام فى الشخصية"
author = "كريم الشناوى"
posted = "2006-07-13"
text = "أعتقد أنه من غير المنطقى على الإطلاق أن يهلل مصطفى بكرى و يعلو صوته دفاعا عن حرية الصحافة ، ثم يقدمفى اليوم التالى استجواب يطالب فيه بمصادرة أو قطع مشاهد من فيلم أجازته الجهات المختصة ... أليست الصحافة و السينما يقعان تحت بند حرية التعبير... حتى و إن اعتبر السيد النائب المحترم أن الفيلم سىء فيجب ألا يصدر منه طلب حذف مشاهد لإنه ببساطة يمكن أن يعتبرها تحت بند مفيش حلاوة\"حرية صحافة \" من غير نار\" أفلام وحaة و قليلة الأدب!!!!\"... و ربنا يخليلنا بقى أtلام لخمة راس و الغواص و فرقة 16 إجرام و الأفلام التقيلة دى....<br />ملاحظة أخيرة:- يبدو أن النائب مصطفى بكرى ماشى بنظام اليوم بيومه ... يعنى هو ليس مسئولا عما قاله أمس و لن يكون مسئولا غدا عما قاله اليوم... ما علينا...."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091221/http://masr.20at.com:80/article.php?sid=651"

