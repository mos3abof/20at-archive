[[comments]]
order = 4
subject = "يابشر"
author = "هووووووووبه"
posted = "2006-07-14"
text = "راي بقي شوفوا كريم دا بيفهم في السيما, وكتب عن الفيلم قبل كدا كلام جامد جدا ومئلست عليه متزعلش , ومتقفه مع راي الكابتن ماجد\" بجد ماشيه \" في ضجه جامده فعلا كل اما اروح حته يعقوبان يعقوبان . انا مشفتش الفيلم صراحه , بس بالعقل كدا انتو بتشفو مناظر خارجه مش شرط في يعقوبان وبس اجنبي ....<br />يعني تعددت الرؤيه والجريمه واحده<br />فبلاش هرش مخ مع احترامي لريك يا محمد."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091221/http://masr.20at.com:80/article.php?sid=651"

[[comments]]
order = 5
subject = "بلا قرف"
author = "مجرد رأي"
posted = "2006-07-14"
text = "مش فاهم ليه كاتبالموضوع المحترم بيسخرمن مصطفى بكرى و النواب اللي طالبوا بحذف المشهد..هو لا مؤاخذة الجهات المعنية اللي سمحت بعرض الفيلم بدون حذف مش جهات نظيفة أو محترمة .انتو بتتكلموا على 11 دقيقة شذوووووووووووذ<br />هي دي حرية و لا قذارة من منتجين الفيلم ومخرجه و اللي اشتركوا فيه؟<br />بالمناسبة كتيرمن اللي دخلو الفيلم اكدوا انه ممل ومفيهوش ترابط بين الاشخاص و لا ذروة احداث ..يعني مفيش قصة اصلا و الفيلم باختصار بيتعرض بالكامل في في الاعلان<br />يا سلام على الحرية والابداع لما ييجي سي عادل امام اللي بلغ من العمر ارذله و هو فاهم نفسه شاب و بيصورمشاهد ساخنة في الفراش ..و ايه حريةالابداع دي لما نعرض مشاهد الشذوذ<br />يا جماعة لو عايزيين تكشفوا الفساد ..ميتعرضش الموضوع بالتلذذ اللي بيعرضه بيه اصحاب الابدااااع المزعوم"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091221/http://masr.20at.com:80/article.php?sid=651"

[[comments]]
order = 6
subject = "موضة افلام"
author = "مصري متغرب"
posted = "2006-07-16"
text = "جرت عادة السينما المصرية انه عندما تنجح فكرة فيلم ما ان يتم تناولها في اكثر من عشرين او ثلاثين فيلم ... تخيلوا لو فكرت المخرجة العبقرية ايناس الدغيدي في اخراج فيلم مشابه لعمارة يعقوبيان وكانت البطلة فيه الهام شاهين وفيفي عبده ويسرا وروبي وغيرهن بالإضافة الي الشباب من الجيل الصاعد واقترح ان يشترك في الفيلم الوزير الفنان فاروق حسني علي ان يقوم بدوره الحقيقي في الحياة لمزيد من الواقعية ... تخيلوا الفيلم ممكن يكون ايه ولو حد طلب حزف المشاهد الخارجة تفتكروا ح يتبقى حاجة من الفيلم القادم<br />ربنا يستر"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091221/http://masr.20at.com:80/article.php?sid=651"

[[comments]]
order = 7
subject = "ايه دول 20000000 جنيه"
author = "ابوبلطه"
posted = "2006-07-16"
text = "يا اخوانا دول 20000000 جنيه انتو بتهرجو لازم تحصل الضجه دى على الفيلم حتى يثير الفضول الجماهير وتذهب لمشاهدة الفيلم ومن ثم يغطى تكاليفه ثم يجنى الثمار يعنى الناس دى تشتغل لوجه الله والوطن لا سامح الله دا احنا مفتريين بشكل لاحول ولا قوة الا بالله وحسبنا الله ونعم الوكيل"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091221/http://masr.20at.com:80/article.php?sid=651"

[[comments]]
order = 8
subject = "حسبنا الله و نعم الوكيل"
author = "للاستاذ كاتب الموضوع ..ليه السخرية في كلامك من مصطفى بكري ..و سخرية كمان من الفيلم و اللي عملوه .."
posted = "2006-07-16"
text = "أنا شايفة إن صناع الفيلم دول جاهلين بدينهم اللي مكتوب في البطاقة ..المفروض يعرفو يعني ايه مسلم ..بدل ما هم عاملين يتفزلكو و يعملو فيها مثقفين و هم مش عارفين القرآن بيقول ايه ؟ ..خليهم يبدعو و ربنا لما يسألهم عن الفساد ده ..يقولو أصلنا كنا بنبدع ..عادي .."
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091221/http://masr.20at.com:80/article.php?sid=651"

[[comments]]
order = 9
subject = "مش هى دى البلد اللى كان نفسى اعيش فيها"
author = "تيفا"
posted = "2006-07-17"
text = "كان نفسى اعيش فى بلد جميلة عندها قيم واخلاق وصح وغلط وتطور واقتصاد وتاريخ قديم ومستقبل جميل وماضى مبهر ولا اقصد الفراعنة انا لم اكن اعيش فى ذالك الوقت ولاكن منذ 25 سنة لا ولم اعرف او اسمع عن شىء جديد مشرف نستطيع ان نفتخر بة داخل مصر شىء حديث التعليم بايظ الاقتاد تعبان السينيما ههههههههههههه خيبة الشعب جاهل بجد احنا اهم مشاكلنا ان معظم الشعب جاهل ياريت اللى موجود معانا من الاعضاء يقول وجهة نظرو فى ان معظم الشعب بتاعنا جاهل وممكن اكون انا من ضمن الجهالة احنا لازم نختلف مع بعض ولا نتفق ولا نعلم ما هو الصح للجميع ولاكن نعلم الصح لنا فقط انا بجد بكرة مصر جدااااااا جدااااااااا جداااااا مصر بجد بقة قاسية علينا جدااا مش هى دى الحياة اللى كان نفسى اعيشها ليا وليكم يا ريت الرد بعقل من غير اختلاف من اجل الاختلاف"
archived = "2006-07-21"
capture_url = "https://web.archive.org/web/20060721091221/http://masr.20at.com:80/article.php?sid=651"

