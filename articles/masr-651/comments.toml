subject = "عمارة يعقوبيان الأي كلام"
author = "محمود ماجد"
posted = "2006-07-14"
text = "انا مش عارف ليه الضجة المفتعلة دي على الفيلم ده<br />الفيلم مش قد الضجة اللي معمولة عليه ابدا الفيلم مجرد فيلم عادي جدا ويعاني مشاكل كتير في القصة والإخراج .<br />لكن إحنا اللي شعب ممكن ينط في اي حاجة ويتعلق فيها"
archived = "2006-07-21"
