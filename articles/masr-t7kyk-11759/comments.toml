text = "عندك حق يا دعاء الخروج دلوقتى بقى مش للشراء بس<br />وعلى فكره حكاية إن الشراء من المولات الكبيرة زى هيبر وكرفور بيوفر ده كلام مش مظبوط خالص بالعكس الواحد بيكون عامل حسابه على رقم وبيصرف أكتر منه بكتيييييير جدا<br />أنا أنصح أى حد يدخل الأماكن ده أنه يكون مركز ومجهز ورقة كاتب فيها احتياجاته كلها ولا ينخدع أبدا بأى عروض موجوده لأغراض مش كتبها فى الورقه ماهما كانت العروض ده مغريه.<br />وخروجه سعيده للجميع"
