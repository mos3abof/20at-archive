[[comments]]
order = 0
subject = "عشت وشفت"
author = "سعادتي بمقالك لا توصف .. عشت وشفت مقال بالشكل ده والفكرة دي والكلام ده .."
posted = "2006-04-05"
text = "لسه سعيدة بمقالك بشكل مش طبيعي ..<br />نفسي كل الناس تقراه ..<br />انت صحفي محترم بجد لك خالص احترامي"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211842/http://masr.20at.com:80/article.php?sid=130&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "ملفت"
author = "عبدالله مفتاح"
posted = "2006-04-05"
text = "عجبتني اوي جملة (تقسيم الصحفيين الى قياده وموهوبين)<br />جملة رائعه وفعلا صاحبها موهوب تكفيك موهبتك و......<br />واحترام الناس"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211842/http://masr.20at.com:80/article.php?sid=130&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "كلنا هذا الرجل"
author = "محام / ياسر حجاج"
posted = "2006-04-06"
text = "( طائر محنط على جدار )، كانت عبارة إختزالية رائعة لكامل المقال ، لا عليك يا عزيزي ... كلنا هذا الرجل ."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211842/http://masr.20at.com:80/article.php?sid=130&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 3
subject = "كلنا هذا الطائر المحنط احيانا"
author = "نيفين"
posted = "2006-04-06"
text = "المح ف المقال نبرات صدق نفتقدها كثيرا<br />يكفيك انك تكلمت<br />ووجدت من يقرا<br />كلنا هذا الطائر احيانا<br />و القيود كثيره"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524211842/http://masr.20at.com:80/article.php?sid=130&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 4
subject = "ادعى عليه بس ماحدش يقول آمين"
author = "هشام علام"
posted = "2006-11-24"
text = "لم أقرأ مقال الاستاذ الكردوسي وقت نشره ولكن حدث موقف ما جعلنى أسخر من جريدة الاهرام فقال لى \"احنا بس اللى من حقنا ننتقد الاهرام لاننا ولادالاهرام..بننقدها زى الام اللى بتدعى ابنها لكن تكره اللى يقول آمين\" ونصحنى بالرجوع لهذا المقال.استاذ محمود \"شابو يا ريس\""
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041001/http://masr.20at.com:80/article.php?sid=130&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
