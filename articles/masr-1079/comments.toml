subject = "الله يحرقك يا بعيد"
author = "xizoaziz"
posted = "2006-11-04"
text = "كل الكلام الطويل ده وفي الاخر مفيش كلمه مفيده غير ان عمرو خالد بيقتبس كلامه من سي موريس افندي ياراجل بقي مسلم يدعو الي الاسلام يقتبس كلامه من واحد تبشير وكمان ف الاخر عمرو خالد تقليد,, وكمان الننوسه بتاعة روزاليوسف افشل المجلات حاليا عايزه تقابلك وتنشر الكلام ربنا ياخدكم ويريحنا من اشكالكم الي بتجيبنا للخلف در ياراجل اكتب عن حاجه عدله والنبي ياشيخ فهمني ايه فايدة الهيافه الي انت كتبتها دي"
