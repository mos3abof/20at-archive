[[comments]]
order = 76
subject = "الحقيقة فى امريكا"
author = "عشرينى"
posted = "2006-11-05"
text = "عجبى على تعلقا تكم - كله بيشتم ويتشنج ومفيش حد عايز يفكر بهدوء-- اولا مفيش اتنين يختلفو على اسلوب الاستاذ عمرواسلوبه جميل لكنه اسلوب مختلف تماما عن اسلوبنا الشرقى المعتاد فى الخطاب الاسلامى مش ضرورى انه يكون بيقلد حد لكنه دخل البيوت بطريقة مستوردة زى انه ممنوع من مصر وانه ممنوع من التلفزيون المصرى وبكده الناس تجرى وراء الممنوع وهما مش عارفين ان ده الاسلوب المستورد المفروض علينا من هناكاتضحت الصورة ولا لسه ونفس الكلام بالنسبة لتغير المناهج وكل ما له علاقة بالقرأن فى المناهج وده من هناك وعلشان تتضح الصورة اكتر عارفين ايه تانى بيتغير وبمعرفة هناك اسمع ياسيدى قال ايه اخونا العلماء فى السعودية وبموافقة ا لازهراكتشفو ان اسماء الله الحسنه فيها اكثر من 25 اسم مش مناسبين \\ بعد 1400 سنه \\ وكلام فى سركم الكلام ده بداء التفكير فيه بعد حلقة فضائيه للقسيس اياه بتاع قناة الحياه ذكر فيها ان اسماء الله فى الاسلام مفهاش اسم المحب وطبعا هيكون المحب اول الاسماء المتغيرة \\وكل ده من هناك\\ واحنا هنا قاعدين نشتم المحرر شويه والمسحيين شويه \\ معليش انا مضطر اقولكم قاعدين ليه متقومو ترواحو !!!!"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

