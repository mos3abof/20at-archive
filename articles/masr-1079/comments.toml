text = "ان هذا الموضوع لا يستحق كل هذا لأن موضوع ليس لة فائدة ولن يجتمع المسلمين والمسيحين نهائيا وهذا فى كتاب الله (قل لن ترضى عنك اليهود ولا النصارة الا لو اتبعت ملتهم)وهذا الكلام الموجود فى المقال معناة اننا نقاربين وهذا يؤدى الى مزج الافكار وهذا معناة ان نحب بعض وهم لن يفعلوة هذا ونحن لن نفعل هذا هم يعتقدون ان ما يفعلوة صحيح ونحن متأكدون ان ما نفعلوة صحيح وأنا أقول لا يجب المقارنة بين مسلم ومسيحى......"
