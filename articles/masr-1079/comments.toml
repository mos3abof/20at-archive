subject = "شكرا جدااااااااااااااا"
author = "دودو"
posted = "2006-12-07"
text = "ف البداية انا متاسف جداااااااا يا استاذ عبداللة عن التعليقات الساذجة وحتا الغير موضوعية ف الانتقاد. دة مش لانة متفق معاك لا انا عاجبنىالمقال جدا ويمكن دى اول مرة ف حياتى اكتب تعليق عن مقال.بداية المقال من الناحية الهيكيلية والنظرية جيدة.لاكن انت جبت شخصيتين لا مقارنة بينهم دة ف طريق ودة ف طريق.زعلت منك جدا ف عد الامانة اللى قلتها لما قلت ان الاسيس سامح نسخة طبق الاصل من عمر خالد يارجل حرام عليك اعكس والعكس هو الصح.ثانياعمر خالد مش بس بيقلد الاسيس سامح بصفة خاصة لا دة بيقلد الانجيلين بشكل عام .ثالثا سامح موريس مهواش رائد بروتستانتى جديد لا هو دة الفكر البروتوستنى اتفرج وشوف علىكل السس والخادم.وبجد انا متشكر سواء انت مختلف معايا او متفق ولازم على المعليقين ان يكون فى حد ادنى من الادب العلمى سلام ونعمة."
archived = "2006-12-14"
capture_url = "https://web.archive.org/web/20061214170509/http://masr.20at.com:80/article.php?sid=1079"

