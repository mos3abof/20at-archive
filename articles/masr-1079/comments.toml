subject = "الفتنة اشد من القتل"
author = "مسلمة"
posted = "2006-11-20"
text = "انا مصدومة من الكلام اللي قالوة بعض الاشخاص انا يوم بعد يوم بتعرف على اسباب الانحطاط الذي نحن فية،مافي تقبل لأفكار الاخرين ،وفية شتم واهانات ،ياخوة يامصريين انتو بلد واحد (مسلم ومسيحي)خذوا عبرة من اللي صاير في العراق فالفتنة اشد من القتل احترموا بعض هيك النبي محمد صلى الله علية قال وأمر، هو كان يعود المريض اليهودي اللي كان يأذية والقران يقول ( ادفع بالتي هي احسن)خذوا الاخلاق من خير معلم من النبي محمد صلى اللة علية وسلم"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 146
subject = "الى متبري من هذة الامة والسلفيين قادمون"
author = "مسلمة"
posted = "2006-11-20"
text = "أولا اوجة كلامي للمتبري من هذة الامة القذف حرام حرام حرام واذا كنت شاهد على شيْ هات معك شهداء صادقين بحيث يكونوا أربعة، وبعدين الأنسان المسلم يعبد الله مش عمرو خالد واذا كان كلام عمرو خالد يقربة الى الله فالخير يعود الى هذا الشخص سواء كان عمرو خالد كما زعمت أم لم يكن الشخص هو المستفيد، وببساطة الحكمة ضالة المؤمن اينما وجدها فهو بها .<br />أماالى السلفيين فادمون من وين جايب هذا الافكار نذبح ووووو؟؟؟؟؟؟؟<br />الله قي القران الكريم يقول( أدع الى سبيل ربك بالحكمة والموعظة الحسنة) أخي الله يهديك والله ليس الامر بالكيفية التي وضحتهابأعرف حلو أن نحب ديننا ونسعى لخدمتة ولكن وفقا لأوامر الله لذا ينبغي أن نقرأ السيرة النبوية ونجعل الفران والسنة هي المنهاج الذي نسير علية."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 147
subject = "نظرة الكسندر"
author = "مسلمة"
posted = "2006-11-20"
text = "الكسندر من حقك أن تبدي رأيك لكن في حدود اللياقة والادب والاحترام وهذا من حق جميع الناس من الانسانية ،نحن المسلمين لسنا ابدا ابدا أنذل ماخلق على هذة الارض ، لان الله قال( ولقد كرمنا بني أدم) ، وانا مندهشة لأنك تصف المسلمين بالحيوانات والله الذي يقرأء كلامك يعتقد ان نساء ورجال الغرب شرفاء ليسوا شهوانيين ألا ترى افلامهم يدعون الى الجنس والزنا، مايصير عمر البنت 16 سنة الا وعاشرت كم شاب وجربت كل انواع المخدرات وكل الفواحش و من كثر ماملت صار شي عندها اسمة الشذوذ الجنسي,شوف اوبرا شو ودكتور فيل وتايرا وسترى مدى (العفة والشرف) .<br />في برنامج دكتور فيل واحد متزوج خان زوجتة مع اكثر من30 مرأة، وبرنامج اوبرا ذكر انة حدث اغتصاب جماعي لاطفال ونساء كانوا في ملاجئ بعد حدوث اعصار كاترينا، اما برنامج تايرا فانها في اكثر من حلقة استضافت مراهقات عاشرن اكثر من 10 رجال وجربن المسكرات والمخدرات وغيرها.<br />هولاء هم من تتغنى بهم ، وبنهضتهم، اخشى انك تسير على نهجهم، كن مسيحيا انما عفيفا أو ابحث عن ماهو أفضل.<br />اما بحكاية القتل في الاسلام وانا مسلمةذكر القران الكريم الذي هو كتابي ( ولاتقتلوا النفس التي حرم الله الا بالحق)نحن لسنا قتلة والقاتل المجرم يقتص منة،<br />والذي يقراء كلامك يتساءل عن ماقام بة المسيحين والصهاينة في هيروشيماوناغازاكي وفي الحرب العالمية الاولى والثانية ومن قبل ومن بعد والى يومنا هذا ، هولاء الذين يصنعون الاسلحة المحرمة دوليا لأبادة الأنسانية يصنعون اسلحة نووية وبيولوجية وقنابل عنقوديةوغيرها، هولاء هم من يسعون في الارض الفساد.<br />وبعدين اين الانسانية في مانراة في غوانتامو وابو غريب وغيرها من الاماكن التي لانعلم عنها؟؟؟؟؟؟؟؟؟؟<br />على فكرة اذا قام اي مسلم بهذة الامور فهو ظالم وعذابة شديد ع<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 148
subject = "الكنيسة تبيع ممتلكاتها"
author = "الكنيسة تبيع ممتلكاتها لتدفع تعويضات"
posted = "2006-11-21"
text = "100 كاهن في كنيسة دبلن اعتدوا جنسيا على 350 طفلا<br />دبي- العربية.نت<br />كشف تقرير جديد أن أكثر من 100 كاهن في الكنيسة الكاثوليكية في دبلن على الأقل متورطين خلال الـ 66 عاما الأخيرة بالاعتداء الجنسي على أكثر من 350 طفلا .<br />وقال تقرير أصدرته مطرانية دبلن أن أكثر من 100 كاهن تورطوا منذ عام 1940 في سوء معاملة الأيتام والاعتداء الجنسي على الأطفال ، وهذا ما وصف بأنه أخطر اعتراف في الكنسية الكاثوليكية بدبلن حتى اليوم. وقدمت المطرانية التقرير للجنة التحقيق القضائية.<br />ويقول رئيس الأساقفة ديرموند مارتن، في تصريح لـ\"الغارديان\" البريطانية، إن الكنيسة ستبيع ممتلكاتها لكي تدفع تعوضيات معتبرا أن هذه الخطوة هي تضحية من الكنيسة تكفيرا عن أخطاء الماضي.<br />وأشار إلى أن ماجرى خلال السنوات الماضية في هذه الكنيسة كان صعبا جدا بالنسبة له مشيرا إلى معظم الكهنة لم يتورطوا في هذه الأعمال.وكان تم الكشف عن فضيحة مشابهة في أبرشية بوسطن منذ 3 سنوات.<br />وأشار مارتن، الذي يرأس المطرانية منذ 2003، أن 105 إجراءات تم اتخاذها ضد 32 كاهنا في دبلن ، وتمت مراجعة ملفات شخصية لـ 2800 كاهن بين عامي 1940 و 2006 وتم الإدعاء على 91 كاهن فيما تحوم الشكوك حول 11 كاهنا.<br />وأشارت \"الغارديان\" إلى أن إيرلندا، البلد الكاثوليكي، اهتزت بعد الفضائح الجنسية في الكنيسة خلال العقد المنصرم حيث تورط الكهنة في سوء معاملة الأيتام والاعتداء الجنسي على الأطفال.<br />وفي أواخر العام الماضي كشف تحقيق أجري على نطاق ضيق في مقاطعة ويكشفورد وجود اكثر من 0 0 1 ادعاء بالتحرش ضد 1 2 راهبا."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

