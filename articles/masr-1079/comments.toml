text = "انا شايفة ان عرض موضوع زى ده<br />فيه غرض منه<br />ان يشككوا فى عمرو خالد<br />بغض النظر اذا كنت معاها ولا ضده<br />هو مجرد هجمة ضد انسان مسلم<br />انا ممكن اسمع القس ده ككلام عادى<br />لكن التشبيه غرضه سيئ للاسف<br />جرى ايه يا عشرينات"
