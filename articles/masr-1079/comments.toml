text = "واضح إنكم تحملون ذنوب بعدد شعر راسكم لانكم لا تراقبون التعليقات قبل نشرها<br />وعلشان كده إتفو عليكم يا إدارة موقع عشرينات<br />واوعدكم إنى اتف عليكم كل ما الاقى شتايم ولغة حوار متدنية وادعو القراء مشاركتى التف والبصق على ادارةالموقع<br />وإتفففوووو عليكم كمان مرة يا ادارة عشرينات"
