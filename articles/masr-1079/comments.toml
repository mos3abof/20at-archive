author = "أوجد فائدة واحدة من المقال تكسب مرسيدس!!!"
posted = "2006-10-24"
text = "هل تدرك ياسيد عبد الله طحاوى ان كل ما خطيته بيمينك ستسأل عليه؟<br />اول سؤال اسأله لك....<br />مــــــا هى الفائـــــدة التى عادتنا علينا من مقالك؟ إيه وجى الإستفادة؟<br />1-مين قال ان عمرو خالد بيقولاذكر الله تكسب مرسيدس..<br />المدهش في القصة أنه ـ أيوة بالضبط ـ يماثل عمرو خالد\"إتق الله وتذكر يوم تقف امام عمرو خالد بين يدي الله وله الحق ان يقتص منك<br />3- بجد إستفدت انا إيه من السيرة الذاتيه بتاعه موريس؟ عشان لما أدخل برنامج مسابقات؟ هو شىء يذكر للدرجة دى؟<br />4-هل لاحظت ياسامح أوجه التشابه بينك وبين عمرو خالد ؛قائلاً \"أناس كثيرون أكدوا لي هذا الأمر، وأن أسلوب عمرو خالد قريبمنأسلوبنا(الإنجيليين)..\"حسبنا الله ونعم الوكيل ؛لاحظ انك اسردت فى هذا المقال مساحة ضخمه لموريس ومساحة ضئيله لعمرو خالد كأنك تعمل لموريس دعائيه ؛وتعمل لعمرو خالد تهميش!! خبرنى يا راجل هل ترغب فى تغيير المله ؟ ارى إنك ترى موريس الفارس المغوار وربما المهدى المنتظر وربما تتمنى ان يكون مهدى عاكف!!!<br />5-وأن ربنا يحبك وعاوزك.. إلى غيرها من المصطلحات التي اعتقد أنها ليست مشهورة في الخطاب الديني الوعظي الإسلامي.. ولا أعلم هل هي موجودة في القرآن أم لا ؟ ودعني أؤكد مرة ومرة أن الكثير من أفكاره تتشابه مع أفكارنا وهو أمر يمثل لي علامة استفهام غير مفهوم\".\" حسبنا الله ونعم الوكيل فيك<br />6- \"الياباني والتيواني\" فى الآخر بقى عمرو خالد هو المقلد!!!<br />7- واضح ان دة تخصصكم كما قال زميلك ياسر<br />8-هو عمرو خالد عندة وقت اصلا انه يبص فى المرايا؟ علشان خاطر يروح يسمع لموريس رضى عيسى عنه!!!<br />9-\"قرب لحفلة شاي أو \"بارتي\" وبجلسة واحدة فكل ما يقدم هو من عناصر الجمال\"<br />الرسول لما راج للروم لبس الثياب الرومانيه ولما جيه حتى يتوضى خلع كم<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

