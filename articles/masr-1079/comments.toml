subject = "قل تعالوا إلى كلمة سواء"
author = "مصري"
posted = "2006-12-01"
text = "لحمد لله إن في ناس لسة بتفكر<br />كلامك كويس وأنا معاك<br />بس أنا نفسي أعرف ليه الهجوم<br />ممكن نختلف في جانب بس ليه منشوفش الجانب الكويس<br />يا مسلمين ويا مسحيين كلكم بتعبدوا الله<br />لكن ربنا أراد إننا نختلف<br />وهو وحده اللي هيحكم بينا<br />قال تعالى : يـأيها الناس إنا خلقناكم من ذكر وأنثى وجعلناكم شعوبا وقبائل لتعارفوا إن أكرمكم عند الله أتقاكم<br />ولو شئنا لآتينا كل نفس هداها<br />الدين هدفه الصلاح والإصلاح<br />خلينا بعيد عن تجار الدين لمصالحهم الشخصية من كلا الجانبين<br />وبلاش العنصرية الدينية أقولها للكل<br />وبلاش العنصرية المذهبية أقولها للكل<br />وأحط ميت شرطة تحت المذهبية"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205072718/http://masr.20at.com:80/article.php?sid=1079"

