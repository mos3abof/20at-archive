subject = "مصر العزيزة لي وطن"
author = "رموززززززززززززززززززززز"
posted = "2006-11-21"
text = "قال تعالي يا يها الذين امنوا اتقوا الله حق تقاته ولا تموتن الا وانتم مسلمون شبابنا الحمله شرسه والا هم ان الله يحب يكون همه اعلاء كلمه الله<br />وبعدين الرسول صلي الله عليه وسلم اتهان محدش رد جامد كدة<br />تاني حاجه صلحوا نفسكم<br />3- حاجه الكاتب اللي كتب المقال استفاد انتم ايه اللي استفتوة بلاش جاهل كفايكم<br />الاعداء بالداخل ولكن العدو الممول بالخارج احزروهم<br />انا بصراحه فقدت الثقه بمصر قيادة وشعبا وانتظر فرج الله بقبض روحي والارتياح منكم<br />ومن بلاويكم كلكم واقول للكاتب معلشي هنشتريلك ببزازة وبمبز علشان تكتب بروقان واقول لعمرو خالد انت فين يا عمرو واهتمامك بكل مسلم في خطبك ولا انت كمحاسب وعضو نقابه التجاريين مش فضيلي<br />واقول لنائب مجلس ادارة جريدة الاحرار اللي موقع عشريينات منها بطل تستغل الصم والبكم"
