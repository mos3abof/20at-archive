[[comments]]
order = 97
subject = "كاهن: ذهبت مع فولي عاريا للساونا"
author = "روما، إيطاليا (CNN) —"
posted = "2006-11-09"
text = "أقر كاهن الخميس أنه اعتاد على التوجه عارياً إلى حمام الساونا مع النائب الجمهوري السابق مارك فولي، قبل عقود، عندما كان الأخير صبياً في فلوريدا، غير أنه أنكر وجود علاقة جنسية بينهما.<br />ووصف الكاهن أنطوني ميرسيكا، الذي تحدث عبر الهاتف من منزله بجزيرة غوزو المالطية، التقرير الذي اوردته صحيفة “سارسوتا هيرالد تريبيون” بأنه “مبالغ فيه.”<br />وقال “لقد كنا أصدقاء ونثق بعضنا ببعض كإخوة، وأحببنا بعضنا البعض كإخوة.”<br />وحول سؤال عما إذا كانت العلاقة بينهما جنسية في طبيعتها، رد الكاهن “لا لم تكن كذلك”، بحسب الأسوشيتد برس.<br />وجاء تعليقات الكاهن ميرسيكا بعد أن نشرت صحيفة فلوريدا تقريراً صحفياً الخميس مقتبسة عنه قوله في مقابلة صحفية إنه كانت له علاقة “غير سوية” لمدة عامين مع فولي في عقد الستينيات من القرن العشرين، من ضمنها إجراء تدليك للصبي عارياً.<br />وقال محرر الصحيفة، مايك كونللي الخميس إن التقرير الصحفي صحيح ودقيق، بما في ذلك الإشارة إلى ما قاله ميرسيكا ذات ليلة من أنه كان في حالة ذهول جراء تعاطيه لدواء بسبب انهيار عصبي كان قد أصيب به ولا يذكر ما حدث في ذلك الوقت.<br />وقال كونللي إن المراسل الصحفي تحدث إلى الكاهن أربع مرات بالأمس وراجعا معاً الحكاية بعناية، وبخاصة ما حدث تلك الليلة”، مشيراً إلى أن الصحيفة سردت الحكاية بدقة كما قالها الكاهن.<br />وكان السيناتور الجمهوري السابق مارك فولي، المتهم بالتحرش الجنسي بقاصر، قد قال عبر محامية إنه كان ضحية لاستغلال جنسي من قبل رجل دين أثناء مراهقته، غير انه أكد تحمله المسؤولية كاملة تجاه الرسائل المعيبة التي أرسلها إلى بريد احد المراهقين الالكتروني.<br />وكالة الأسوشيتد برس نقلت عن محامي فولي دايفيد روث قوله، إن موكله تعرض ل<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

