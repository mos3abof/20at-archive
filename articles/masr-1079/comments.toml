author = "عمر أفندى اتسرق يا مينز"
posted = "2006-11-04"
text = "تحية للشعب المصرى المنهوب<br />و مبروك سرقة ( عمر افندى ) اقصد بيعه<br />احد اهم الاسباب التى تعوق تقدمنا هى عدم قبول الاخر<br />اذا اختلفت معى فى الرأى فانت اقل شىء متخلف و و و و تنتهى كالعادة بتهمة الكفر و عبادة الشيطان<br />نحن نملك عقول ميزنا بها اللة فلنخضع كل شىء للحوار و احكام العقل<br />و اذا اعتقدنا ان هذا الاخر قد يتطاول على المقدسات فحل التجاهل رائع و عملى<br />أما ان نتشابك بالسباب على صفحات المواقع و اذا نتلاقينا فسنتشابك بالايدى و تسيل دماؤنا نحن المصريون بايدى انفسنا و هكذا تسيد الأمريكان العالم و احتلوا اغلب العالم العربى و يعيثون دمارا و خرابا فى اغلب اقطار الوطن العربى"
