[[comments]]
order = 59
subject = "الوهابيون قادمون"
author = "طيب اللي زعلانين ان المقال انه بيشبه واحد مسيحي بواحد مسلم هو كان الرسول صلي الله عليه وسلم بيخاطب المسيحين وبيقولهم ياكافر ياابن الكافر .. فيه حد عنده دليل من السنه علي طريقة التخاطب الفجه وقليلة الذوق دي .. هل تدافعون عن الاسلام باهانة الاخرين"
posted = "2006-11-02"
text = "*طيب هو الكاتب اجري اي مقارنات بين الاديان في مقاله .. هل اعلي الكاتب من شان موريس علي حساب عمرو خالد .. وهل المقال ينتقص من عمرو خالد<br />* مش ملاحظين ان كل اللي شتموا للاسف مسلمين واساؤا الي دين سماوي اخر هو المسيحيه ونحن لسنا في معرض مناقشات فقهيه للمقارنه او التفضيل بين الاديان... اليس من الحكمه في التعامل ان نطلق عليهم لقب المسيحين او الاقباط او غير المسلمين بدل من لفظ كفار... اليس لكل مقام مقال<br />** ثم اذا افترضنا ان الكاتب اخطا .. فهل نتعامل معه بالسخريه والاستهزاء والتقليل من شانه انه وكيل الاتهامات له<br />اهذه اخلاق المسلمين ام اخلاق الوهابيين"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 60
subject = "ربنا يهدى الجميع"
author = "القرآن هو من كفرهم والله هو الذى كفرهم ولكن انا متفق معك انه لاي يجب ان ننعته بكافر بن كافر وان كانت صحيحة لذلك يجب ان تفرق بين الوهابى المنتشر غالبا فى السعودية والسلفى مثل جماعة انصار السنة هل سمعتهم يسيرون فى الطرقات يكفرون ويقتلون احدا ارجو عدم المبالغات ."
posted = "2006-11-02"
text = "وارجو من المعلقيين الا يختلط عليهم الامر فمن يسب الاخرين وهو مسلم هذا يرد عليه ولا ينقص من الاسلام فى شئ فالاسلام لا يأمر بسب احد \"ولا تسبوا الذين يدعون من دون الله فيسبوا الله عدوا بغير علم \".<br />الاسلام يأمرنا بالمعاملة الحسنة لاهل الكتاب وان كنت لا افضل التشبيه بيننا وبينهم فلكم دينكم ولى دين ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
