[[comments]]
order = 139
subject = "ما سبب تخلف العرب والمسلمين"
author = "الكسندر"
posted = "2006-11-19"
text = "ما سبب تخلف العرب والمسلمين<br />إن الكلام عن تخلف العرب والمسلمين يطول، وله شجون، فالعرب والمسلمين هم من أدنى شعوب الأرض، وهم من أنذل ما خلق على هذه الأرض، وصحيح أنهم يتشربون الذل والمهانة والعار والخزي واللعنة، من حليب أمهاتهم.<br />فكيف يمكن أن يكونوا شعوباً متقدمة، وشعارهم الله أكبر والنصر للإسلام؟<br />وكيف يمكنهم أن يتقدموا وهم يقولون الإسلام هو الحل؟<br />والجواب على السؤال لماذا يتخلف العرب عن غيرهم؟ فنقول وبكل تأكيد: أنه الإسلام فهو عدو الشعوب، وعدو التحرر، وعدو التقدم.<br />وإن الإسلام هو السبب في التقهقر والتخلف والرجعية والتي تعيشها الأمة العربية والإسلامية.<br />فكيف يمكن لنا أن نعزل الدين عنهم وهم لا زالوا يتداوون ببول البعارين؟<br />وكيف يمكن عزل الدين عن التخلف والقهر والظلم وهم ينكحون أربعة نساء ويجمعوهن في بيت واحد؟<br />فهل هناك فرق بينهم وبين الحيوانات، التي تتناطح وتتعاشر جنسياً، وعلى مرأى الجميع وفي الشارع؟ دون اعتبار لنواحي أخلاقية وإنسانية أو كرامة للمرأة؟<br />العرب والمسلمون هم كذلك أصحاب الدين الإسلامي، الذي طلب منهم دينهم عن زعيمهم محمدهم بقتل أنفسهم وقتل الآخرين للحصول على وهم الجنة والنساء من حور العين ومن الغلمان ( اللواط )؟ وهم كذلك الذي لا يتوارون في ذبح الإنسان ومنه البريء كما تذبح السخلة والماعز والجدي، بلا رحمة أو شفقة؟<br />وهم كذلك الذين رفضوا الآخر، بسبب قولهم: أن الدين عند الله هو الإسلام؟<br />وهم وهم وهم، الكثير من العيوب والمساوئ التي تظلل دينهم ونفوسهم وعقولهم والتي تشربوها من إسلامهم، لذلك الخطأ ما هو إلا في منهلهم ومنبع ثقافتهم وهو إسلامهم.<br />فماذا تريدون أن نعدد لكم عن خزيهم وعيوبهم، وعارهم وقذارتهم، وحقدهم وكراهيتهم لغيره<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

