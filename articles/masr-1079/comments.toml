subject = "أوعى وشك"
author = "المحتار"
posted = "2006-11-02"
text = "الموضوع مش خالد ولا موريس-الموضوع فى تعليقات الناس المهاويس \\ واحد يوصف قوم موسى بالقردة والخنازير والتانى يتهم اهل عيسى با لمغضوب عليهم والضالين والثالث يفتى ويقول ان كلهم كفرة ويدعم كلامه بايات من القرأن - طب ما هو فى القرأن ايات تانى بتقول ان الناس دول كويسين وانهم اهل الكتاب واننا لو فى شك نرجع لاهل الكتاب --طب اصدق مين فيهم يعنى كده 80% من سكان الارض قردة وضالين وكفرة وال 20% الباقين دول ملائكةلهم أجنحه طيرين فى السماء بيجاهدو ضد بعض من السنة والشيعة وطالبان منتظرين الشهادة حتى ينالو القصور فى الجنه المملوئه بحوووور العين\\ واوعى وشكككك"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 62
subject = "ربنا يهدى"
author = "انت مش محتار انت تعبان فى دماغك ومتفلسف ومتجادل فى اى شئ وللاسف نهاية الجدال والتفلسف فى مسلمات الدين نهايتها سيئةوبدون مجاملات اى تفلسف فى مسلمات الدين بتكون نهايتها الالحاد والعياذ بالله ... لما ربنا سبحانه تعالى يقول\" لقد كفر الذين قالوا ان الله ثالث ثلاثة ...\""
posted = "2006-11-03"
text = "وفى موضع آخر وتكثر المواضع فى ذلك \" بديع السموات أنى يكون له ولد ولم تكن له صاحبة....\" كذلك فى صورة الاخلاص .<br />وبالنسبة لقوم موسى ليس كلهم قردة وخنازير بل من عصوا الله فقط فى امر محدد امرهم الله به وهو الا يصيدوا حيتانهم يوم السبت ولن ازيد فى ذلك حتى لا افتى فى امر ليس لى به علم.<br />اما من يقول لا فرق بين السلفية والوهابية الوهابية حركة نشأت فى الحجاز بقيادة محمد بن الوهاب تدعو للعودة الى احكام الاسلام خاصة مع اتجاه محمد على فى مصر للحضارة الاوربية .<br />والسلفية هى دعوة عامة للعودة الى حياة السلف وما كان علية الرسول وصحابته .<br />انا اعتقد ان السلفية اقل تشددا وان كانت لا تعجبك فلا شأن لك بها اعتقد فيما تشاء انت حر فى ذلك كذلك هم احرار فالعودة الى الدين ليست بالسوء الذى يحاول البعض تصويره على انهم اناس متجهمين يحملون سيوفا يقطعون بها رقاب الخلائق لذا اطلب منك طلب واحد اخرجوا من دنيا المبالغات وصورا الاشياء بواقعية بعيدا عن الخصومات والتعصب للاراء ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
