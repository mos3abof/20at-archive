[[comments]]
order = 34
subject = "ليست ناجية من الحرب الأهلية في العراق"
author = "ليست ناجية من الحرب الأهلية في العراق"
posted = "2006-10-23"
text = "ليست ناجية من الحرب الأهلية في العراق<br />ولا الإقتتال الداخلي في فلسطين<br />ولا القصف الإسرائيلي لبيروت<br />ولا عبارة أو قطار الموت في مصر<br />إنها خادمة أندونيسية كانت عائدة إلى بلادها من المملكة العربية السعودية<br />إشتبه ضباط المطار في حالتها الصحية برغم أنها كانت مغطاة بالسواد<br />ليكتشفوا ما كانت تفعله بها مخدومتها السعودية<br />كما ترون كدمات وتورمات وإنتفاخات<br />ليس في الوجه فقط<br />لكن في كل أنحاء جسمها<br />إلى جانب الحروق !!!"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 35
subject = "ثقافة الننوس والكتوموتو"
author = "BATISTUTA"
posted = "2006-10-23"
text = "معذرة قبل ان انتهى ابعث برسالة خاصة للمستر بتاع ننوس كوتوموتو وثقافة الحوارى لما بجرح فى الناس انت بتعمل معايا ايه مش بتجرح فيا يعنى منافق بتعاملنى باسلوب انت بترفضه واخر حاجة انا لا بن حنبل ولا هصلح الكون ولما اختلف معاك تانى ياريت ما تنفعلش اوى كده صحتك ياراجل"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 36
subject = "شكرا لكل المعلقين على لغة الحوار"
author = "BATISTUTA"
posted = "2006-10-23"
text = "فعلا الحوار تطور وبس اخر سفالة لمجموعة من البشر اللى مكتوب فى خانة الديانة مسلمين وان كنت لا استبعد وجود مسيحيين بيسبوا الشيوخ يلا هو حد عارف حاجة .<br />ربنا يسامحكم ويهديكم وان شاء الله دا اخر تعليق ليا فى الموضوع دا يعنى اللى عايز يشتمنى انا مهما حصل مش هنزل لمستواه وحسابه عند ربه ان كان بيؤمن بوجوده اساسا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

