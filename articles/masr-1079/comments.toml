author = "قمح مصر"
posted = "2006-11-01"
text = "شكرا لكاتب هذا المقال جدا السيد الاستاذ الداعيه عمرو خالد يتحدث عن الله والدكتور القس سامح موريس يتحدث عن الله و الكاتب كان يحاور احدهم ولم يتطاولوا على الاخر او على الاسلام ولكننى اندهشت عندما قرات تعليق كل الاخوة الاحباء المحبطة والمفشله لخطوة جريئه وهى ان نبدا نتحاور بالمحبه فى موضوع الخطاب الدينى"
