text = "ياجماعه الراجل رئيسى هتقطعوا عيشى<br />الراجل قالنا انه تااااااااااااااب وانااااااااااااااااب<br />طبعا انا بمزح معكم<br />ولكن هو هيدخل لما يفضى يشرح وجهة نظرة<br />اللى لازم تسمعوا بحياديه ونقد مهذب وبناء"
