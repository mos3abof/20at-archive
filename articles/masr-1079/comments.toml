posted = "2006-11-05"
text = "سبحان الله<br />ما لكم بس الراجل ميقصدوش اللى انتوا فهمتوه ده .. ايه المشكلة انه سشبه عمرو خالد بواح مسيحى ما دام كويس ويدعو لحاجة كويسة يا جماعة الاتنين يدعو للأخلاق الحميدة ولربنا هوا مشبهش عمرو خالد بشعبان عبد الرحيم آه ده مسلم وده مسيحى وبس المقصود ان احنا نطلع جيل خلقه كويس هوا لما المسيحى يبقى اخلاقه كويسة ده هيضرنا احنا المسلمين في ايه بالعكس ده هينفعنا وممكن كمان المسيحى اللى اخلاقه كويسه ربنا يهديه للاسلام من المدخل ده يبقى مش عيب ان احنا نقول ان الاسلوبين متقاربين ... انا بس معترضة على عنوان المقالة رغم انى ممكن احسن الظن بكتابها اقول انه قصده ان الراجل ده او عمرو خالد بيدعو للآخرة وبيقول للناس عيشوا برضه بس انا محبتش العنوان<br />وفى الآخر بقول لصاحب المقال<br />\" اجتهاد مشكور\""
