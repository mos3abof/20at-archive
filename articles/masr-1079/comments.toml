[[comments]]
order = 50
subject = "ادى جزاء اللى يمشي مع اقباط روز اليوسف"
author = "ميدو حبيب الطحاوي"
posted = "2006-11-01"
text = "بالرغم من العلاقة الوثيقة التى تربطنى بكاتب المقال ( الاستاذ عبد الله الطحاوي) وبالرغم من معرفتي الجيدة لميوله الصحفية القبطية وعلاقته الوطيدة بقيادات الكنيسة بدءا مما دون البابا الا اني استطيع ان اؤكد ان مقالته خدمت الاقباط 100% بدليل ان كل المتفقين معه اقباط ليس هذا فحسب بل ان من نتائج ما كتب اعلان احد المعلقين انه يهودى ؛ سامحنا يارب فبدلا من ننشر دينك الحنيف فى الارض نتحول لاسباب تخرج الناس عن ملتهم الى ملة القردة والخنازير ؛ واذا تحدثنا بصورة صحفية مهنية بحتة خاصة انى اعمل فى المجال الصحفي فان الموضوع غير متوازن فى الحديث عن المصادر الموجودة فيه حيث تحدث الطحاوى عن موريس باسهاب شديد بينما شار الى عمرو خالد فقط فى نقاط التشابه مع هذا الموريس ولعل ما يفسر ذلك علاقات كاتب الموضوع الكنسية كما سبق وان ذكرنا .<br />خلاصة القول اننا ننسي احيانا الرسالة التى نعمل من اجلها فى مجال الاعلام خاصة الصحافة وندعى اننا نمارس عملا مهنيا بعيدا عن اي ايديولوجيات وكاننا خلقنا لنعمل صحفيين من اجل الصحافة وليس من اجل رسالةاسمي خلقنا اله من اجلها ؛ مارأيكم دام فضلكم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

