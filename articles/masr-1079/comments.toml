subject = "انصر نبيك احسن"
author = "غاده فتوح"
posted = "2006-11-22"
text = "ياأخى أترك عمرو خالد فى حاله هو عملك ايه ادام بيتكلم فى حاجه ترضى ربنا و بيتكلم عن النبى الكريم بكل صدق خلاص هو يعنى لازم يلبس جبه و افطان علشان يبقى رجل دين و كمان ان بعد الظن اثم يا أخى لا تطعن فى الناس من غير دليل ستحاسب على كلامك هذا تكلم احسن عن سماحه هذا الدين العظيم او انصر نبيك او هاجم المتخلفين عقليا الى بيشككوا فى السنه و القرأن و جزاك الله خيرا"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

