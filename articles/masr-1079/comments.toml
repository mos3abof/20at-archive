author = "متبريء من هذه الامه"
posted = "2006-11-12"
text = "انا اثق الان ان الشاعر المتنبي كان كما قال عن نفسه انه نبي جديد فهو قد شخص حال هذه الامه قبل اكثر من 1000 عام عندما قال عنها<br />ياامة ضحكت من جهلها الامم<br />المقال رائع ويجب قراءة مابين السطور ولاتفكرو من خلال الحجاب الموضوع على عقولكم وقلوبكم المعتمه فهذا يرى فيه مقارنة بين الاسلام والمسيح واخر يراه كاسلوب ادبي جيد وغيرها من التحليلات مع الاعتذار على تسميتها تحليلات<br />لانها اقرب للتفاهات ولاتليق ان توضع بجنب مقال كهذا<br />يامن تنتمون الى الامة التي اضحت اضحوكة حتى للامم المتخلفه ان المقال لايوحي بخلاف بين فتى الشاشه عمرو خالد والاخر الوسيم<br />المقال يقول لكم انهم خريجو نفس المدرسة وبنفس الاسلوب وظهرو بنفس الوقت والمرحله بل ويستعملون نفس الجمل والكلمات وبعبارة ادق هم من نفس المجموعه وخريجو نفس المصنع الذي انتج النسختين المسيحيه والمسلمه لذلك كان عليكم التساؤل عن هذا المصنع الذي انتج هذه النسخ وغاية ادارة المصنع واين يريد ان يوجه المجتمع الاسلامي والمسيحي بانتاجه هذه النسخ المضحكة والتي تضحك على عقول السذج من كلا الدينين<br />انا ازيد على وجه التشابه بين الرجلين واكاد اجزم انه حتى نوع البدله التي يلبسوها والوان ربطات العنق متشابهه وان نفس الشخص يختارها لهم ونفس من يسرح شعر عمرو خالد قبل الظهور يسرح شعر الاخر<br />لانهم يعملون لمؤسسه واحده تريد افراغ الناس من عقولها لتفكر بمسائل اخرى ليتسنى للمؤسسه التي يعملون لديها اكمال مخطط مسبق سنفيق يوما لنرى انفسنا غارقين فيه وقد نعلم ساعتها اننا كنّا منومين بسبب هؤلاء وان كنت اشك ان امة بعقول سلفية او اخوانية او قبطيه او اي تسمية اخرى تستفيق يوما من نومتها ولا ارى امة كهذه الا مستحقة للمهانة التي وصلت اليها بغباءها واتباعها للوسيمين عمرو خالد وموريس<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 110
subject = "ياأمة ضحكت من جهلها الأمم"
author = "متبريء من هذه الامه"
posted = "2006-11-12"
text = "على فكره موجود في موقع عرب تايمز حكايات<br />لطيفه عن عمرو خالد وقصصه مع النساء ومع<br />السياسيين العرب المعروفين بتوجهاتهم وانحلالهم<br />الخلقي وقصصه مع زوجات الاثرياء المشهورين<br />بمغامراتهم وكمان موجده ملف القضيه اللي<br />رفعتها عليه البنت الاماراتيه اللي حاول<br />يغتصبها في فندق بدبي ورقم وملف القضيه كلها<br />وموجود له صور كثيره بمغامراته \"وهو يدعو لله\"<br />واكيد موجود موقع ثاني منشور فضائح لخريج<br />نفس المدرسه موريس لانهم نفس الصنف ونفس الدراسه<br />ولااعلم متى تستفيقون من جهلكم<br />فهل ستفيقون يوما<br />انا اشك"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 111
subject = "لحظه يامعاذ"
author = "نيفين..نيفى..نوفا"
posted = "2006-11-12"
text = "معاذ انا مقصدتش التعليق اللى انت ذكرته دا انا قصدت التعليق اللى فوق اللى بعنوان الاسلام دين اجبار و اجرام اللى مبعوت باسم ميمون مسعود عرام -معاذ محمود عامر سابقا<br />و كمان تعليق تانى اتذكر فيه لفظ فظيع و اتقال من اللى بعته معلش انى قلت كده<br />على فكره خد باللك لان ممكن حد يكون بيعلق باسمك لان دا حصل قبل كدا لناس كتير محترمه ف الموقع<br />و صدقنى انا لا اشك لحظه فى مصداقيتك و احترامك لينا و للموقع<br />عموماحصل خير"
