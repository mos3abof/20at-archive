[[comments]]
order = 47
subject = "مسلمه وملتزمه"
author = "بحب الخيرومصر مهما كانت!!"
posted = "2006-11-01"
text = "ا/عمرو خالد اخي في الله وايضااخي د/سامح في الوطنيه ليه لأنه ليس من السفه ان يكون هناك تشابه بين شخصين في الدنيا هذا يحدث كثير جدا واقسم لكم اذا سمعتم د/سامح بعيد عن المسيحيه لن تعلموا انه مسيحي ام مسلم لأن مايخرج من القلب يصل الي القلب نعم كما يقول ديننا نحن خير امه اخرجت للناس يقول ايضا الدين الحنيف لتجدن اقرب الناس اليكم من يقولون ان نصاري وكمان لكم دينكم ولي ديني ومن ظلم ذمي فهو خصيمي الي يوم الدين وليس من الجرم ان يكون المسلم والمسيحي يدعوا الي حب بلدهم والالتزام الديني اي كان نوعه فحسابنا عند الله اهم حاجه في الدنيا هي صحوة الشباب عشان خاطر بلدنا وتقل الجرائم علي اسوا الافتراضات هو عندي وعند مصر كلها علي ما أعتقد خير وأفضل ومحبا لبلده عن الصعلوك (مايكل منير)وديننا الحنيف ينهانا عن تسفيه الأخرين وحسابناعلي الله"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 48
subject = "مسلمه وملتزمه"
author = "بحب الخيرومصر مهما كانت!!"
posted = "2006-11-01"
text = "ياجماعه ا/عمرو خالدمعروف جدا ومش محتاج حد يعمل ليه دعايه لأن المسلمين اكثر من اخواني المسحيين وبالتالي انا شايفه ان المساحه الكبيرةللدكتور سامح عشان بس نبقي عارفين احنا بنكلم علي مين ومع اعتراضي علي بعض الكلمات من د/سامح طبعا الكل خد باله منها ولكن اخوتي في الله ابعدوا عن الألفاظ النابيه فهي بعيد عن اخلاقناالدمثة ورساله لأخي معاذ ادعوا الله لك ان يهديك الي الطريق القويم وتعلم اين هو الله حتي لا تتجرأوتقول ما قلته مره ثانيه"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

