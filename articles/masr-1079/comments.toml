subject = "الانبا مكسيموس"
author = "قائد أول انشقاق على الكنيسة المصرية:"
posted = "2006-11-16"
text = "البابا شنودة\"طائفي\" وهو \"الأسوأ\"<br />غضب مسيحي بعد الانشقاق<br />الأنبا مكسيموس أعلن تشكيل مجمع مقدس مرتبط بالأرثوذكس في أمريكا<br />القاهرة- (اف ب)<br />أكد رجل دين قبطي انشقاقه عن الكنيسة الارثوذكسية الأم في مصر، لأن عهد رئيسها البابا شنودة \"هو الأسوأ\" في تاريخ الاقباط كما قال، معلنا عن تأسيس مجمع مقدس مرتبط بالمجمع المقدس للمسيحيين الارثوذكس في الولايات المتحدة.<br />وقال راعي كنيسة المقطم الذي أطلق على نفسه اسم الانبا مكسيموس الأول في حديث إلى صحيفة \"المصري اليوم\" المستقلة \"لا امل في إصلاح كنيسة البابا شنودة فكان من الضروري اللجوء للخارج لإنقاذ الأقباط في مصر الذين عانوا من تسلط هذه الكنيسة\".<br />وأضاف \"عهد البابا شنودة يعتبر الأسوأ على الإطلاق في تاريخ كنيستنا\"، واتهم الباب شنودة بالتحريض الطائفي وقال إن \"تصرفات البابا شنودة كمن يصب الزيت على النار فقد كان يحرض الأقباط على الثأر من المسلمين وحمل السلاح\".<br />وأوضح أن إنشاء مجمعه جاء بقرار المجمع المقدس للمسيحيين الارثوذكس في الولايات المتحدة.<br />وقال \"تحدثت مع المجمع الأمريكي فقررت قيادته إنشاء مجمع مقدس لمصر وكنائس الشرق الأوسط يكون موازيا للمجمع الموجود داخل الكاتدرائية\".<br />وأعرب عن ثقته بان السلطات المصرية ستوافق على قيام مجمعه، وقال \"الخارجية الأمريكية تعتمد كنيستنا لاننا امتداد للمجمع المقدس للمسيحيين الارثوذكس في أمريكا\".<br />من ناحيته نفى الناطق باسم السفارة الأمريكية في القاهرة أي علاقة للولايات المتحدة بهذا الموضوع. وقال جون بري لوكالة الأنباء الفرنسية \"هذا غير صحيح على الإطلاق. ونحن لا نتدخل بأي طريقة\" في شؤون الكنيسة القبطية. وأضاف \"نحن لا ندعم أي فريق هذا لا أ<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 123
subject = "بندكيت"
author = "بنيديكت:"
posted = "2006-11-16"
text = "أرسل هذا التعليق بواسطة :<br />بنيديكت: الكنيسة تعرّضت لأذى كبير بسبب فضائح القساوسة الجنسية<br />قال بنيديكت السادس عشر بابا الفاتيكان إنه يتعين على الكنيسة الكاثوليكية اتخاذ كافة الخطوات الضرورية لمنع وقوع المزيد من حالات الاستغلال الجنسي للأطفال من قِبل رجال الدين.وقال بنيديكت أمام مجموعة من الأساقفة من إيرلندا يزورون الفاتيكان إنه حتى يتم تحقيق مثل هذا الأمر لا بد أن تتوصل الكنيسة لمعرفة ما الذي حدث في الماضي بشأن حالات الاستغلال الجنسي، بحسب موقع \"بي بي سي\" الإخباري.وأقر البابا بأن الثقة في رجال الدين المسيحيين تعرضت لأذى كبير، وقال إن إعادة بناء الثقة يُعد واجبًا ملحًا, مشيرًا إلى أن فضائح الاستغلال الجنسي خلّفت جروحًا عميقة في جسد الكنيسة.وأنهى كلامه قائلاً: \"فوق هذا كله، من المهم أن نعمل على تضميد جراح الضحايا وكل من تأذّى بهذه الجرائم الفظيعة الفاضحة\", وشدد على أن فضائح الاستغلال تلك يجب ألا تطغى على عمل قساوسة أيرلندا.تأتي هذه التصريحات في ظل توجيه انتقادات شديدة لرجال الدين المسيحي بسبب فضائحهم الأخلاقية, وخاصة في أيرلندا التي شهدت فضائح استغلال جنسي تعود لعدة عقود مضت، وقد جلبت ضررًا بالغًا لسمعة الكنيسة. وكشف تقرير صادر عن أبرشية رئيس الأساقفة في دبلن أن أكثر من 100 قس وكاهن كاثوليكي في المدينة كانوا محل شبهة إقدامهم على استغلال الأطفال جنسيًا خلال الأعوام الـ66 الماضية. وفي الولايات المتحدة الأمريكية أدت الفضيحة التي اكتشفت في مدينة بوسطن عام 2002 إلى ملاحقات قضائية للعديد من القساوسة، كما دفعت مبالغ مالية طائلة للعشرات من الضحايا وصلت إلى 18.2 مليون دولار لتسوية اتهامات قانونية من قِبل أشخاص تعرضوا لاعتداءات جنسية على أيدي القساوسة, وعلى إثرها تم حذف<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 124
subject = "الكلب موريس اسة عايش الله يهلكك انت والى زيك"
author = "واحد بيكرههك وعايز رقبتك على جيفة حمار"
posted = "2006-11-16"
text = "سامح موريس واعظ بروتستانتى.. يلفت نظرك لأول وهلة.. وإذا ظللت تنظر إليه لمدة طويلة لن تحسبه رجل دين.. فهو رياضي.. أنيق وسيم عصري في أفكاره وفى ملابسه.. تجول في وعظه بكنيسة قصر الدوبارة البروستاتنية الشهيرة.. إضافة إلى بعض الفضائيات.. كل هذا جميل.<br />المدهش في القصة أنه ـ أيوة بالضبط ـ يماثل عمرو خالد.. يمكن أن تقول أنه الطبعة المسيحية منه.. أوجه التشابه تداخلت للحد الذي آثار دهشة سامح نفسه حيث تعدت الشكل والطريقة واقتربت من المضمون الروحي المصالح للحياة والحريص على إذابة المسافة بين كلمات الله والرفاهة الاجتماعية بمعنى أخر أنه يرفع نفس الشعار.. اذكر الله تكسب مرسيدس..<br />فيه الحياة .. وباسمك نحيا<br />قبل معرفة أوجه التشابه بين الواعظين.. من المهم أن نقترب قليلاً من سامح موريس وعالمه.<br />البداية كانت من المنيا حيث مولده، ثم القاهرة والتي انتقل إليها بعد حرب 1967 في المرحلة الثانوية. تخرج في كلية طب قصر العيني عام 1976 وحاصل على الماجستير في الجراحة العامة ينتمي إلى عائلة ميسورة ومشهورة متزوج وله ثلاثة أولاد. وهو شخص بسيط يعيش وسط الناس كما يقول عن نفسه حاول أن يفهمهم ويشعر بهم حتى يستطيع الاقتراب منهم لذا فهو ليس خيالياً وإن كان عاطفيا مستغرقاً في الروحية يجيد استمالة القلوب والعقول بألفة وبساطة.. إنه أحد مؤسسي (واخدين بالكم يا جماعة).<br />خطابه الديني مبني على النصوص المقدسة التي يزاوجها بالقصص الحياتية ولكن الأبطال.. أنا وأنت.. وليس قدسيين.. النصوص لديه تفسر الحاضر ويستولد منها الإجابة على كل شيء.. وكله في إطار المتفق عليه لا مجال لفلسفة أو حيرة.<br />حديثه دائماً مرتبط بالله بالمفهوم المسيحي يعتبره مركز الكلام وليس الإنسان ويرى أنه نقطة البداية والنهاية ومصدر الحياة والراحة والإعانة<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

