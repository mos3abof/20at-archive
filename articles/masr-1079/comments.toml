text = "انتو مالكو انتو يا جهلة بالدعاة بتوع المسحيين انتو لية مستخسرين يكون ليهم دعاة يدعو الناس لربنا ويحثوهم على الاخلاق اشمعنا يعنى المسلمين عندهم دعاة زى عمرو خالد و غيرو و لا هو حلال عليكو و حرام على غيركم و بعدين كاتب المقال مكنش بشبة عمرو خالد بموريس بس هو قصدة ان زى ما المسلمين عندهم دعاة كمان المسحيين عندهم دعاة و دى حاجة متزعلش و مالناش دعوة و المفروض اننا نشجع الطرفين<br />طالما انهم بيدعو للاخلاق القويمة و دة فية فايدة لصلاح المجتمع بكلا قطبية و سواء عمرو ولا موريس مايهمش فالدين للة والوطن للجميع و شكرا"
