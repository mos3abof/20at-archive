text = "مخزي ان انظر اليكم يا معشر الاسلام وانتم تعجبون بموريس واناقتة تتركون من هو خير منة عمر خالد عن النبي الاعظم محمد خير من مشى على قدم(ص)كانكم بذلك نسيتم الى من تنتمون الى الة الشرك ام الى سفينة النجاة واحسبكم بابتعادكم عن اوامر اللة ستهلكون واي هلاك استغفروا ربكم الذي خلقكم من نفس واحدة والية ترجعون فمجرد الفكير بصيغة اسلوبة في التعبير يقربكم الية والى فلسفتة المعروضة للاقناع بالطبع عمرو خالد يوفوقة ليس لانة بارع بل لانة من اتباع المصطفى(ص) واللة اكبر وللة الحمدوالعزة للمسلمين اخوكم من عرب48 ام الفحم"
