text = "اخى الفاضل ماالفائده من هذه المقارنه فى اول المقال احسست انك تشكك باسلوب ناعم فى عمرو خالد وتسئ للرجل بمحاولة مقارنته بالقساوسه..سبحان الله اتحب ان تكون انت من يوصف بهذا وهل مايقدمه عمرو خالد لشباب الامه ومسلميهانفسه مايقدمه من ادعيت اسلوب ملتوى او كما يقال كلمة حق وهى ليست بالفعل حق يراد بها باطل وفى اخر المقال تلملم الموضوع على مفجاه لما لانكون وحده وطنيه \"عمرو خالد يحضر دكتواره فى التعامل مع الاخر\"<br />وصدقنى اخى اسوة عمرو خالد هو رسول الله \"صلى الله عليه وسلم\"لاهذا الذى تتكلم عنه فاستحى يااخى ووفر اسلوبك التحليلى فى الكتابه لشئ ينفع الاسلام والمسلمين ..او يصلح من شأن الناس......"
