[[comments]]
order = 120
subject = "قبطي يسرق"
author = "قبطي يسرق كنيسة العذراء بالقليوبية"
posted = "2006-11-15"
text = "أرسل هذا التعليق بواسطة :<br />:أمر أحمد عزوز مدير نيابة الخانكة بحبس سائق القس «يسطس فانوس» راعي كنيسة العذراء بالقليوبية ٤ أيام علي ذمة التحقيقات سرق خزينة الكنيسة وبداخلها ٤٥ ألف جنيه، وادعي أن مجهولين اقتحموا الكنيسة وارتكبوا الحادث كشفت المباحث غموض الواقعة وأدلي المتهم باعترافات تفصيلية في تحقيقات النيابة.<br />قال المتهم غبريال نادر عزيز «٣٥ سنة» إنه يعمل سائقاً للقس يسطس فانوس «بطرس» راعي كنيسة السيدة العذراء «مطرانية الأقباط الأرثوذوكس» بمنطقة ورش أبوزعبل منذ أكثر من ٥ سنوات تزوج قبل عامين وأنجب طفلة، تطالبه الزوجة بمصاريف بالغة تفوق راتبه الشهري، حاول الالتحاق بعمل إضافي إلا أن الوقت لم يسمح له.<br />ذات يوم شاهد السائق القس يسطس ومعه ٣ آخرون من مسؤولي الكنيسة داخل حجرة مبني الخدمات الملحق بالكنيسة وقفوا أمام خزينة حديدية، بابها كان مفتوحاً تظهر المبالغ المالية منه.. وقف السائق علي باب الحجرة اتخذ قراره بالاستيلاء علي تلك الأموال عاين المكان والحراسة الأمنية علي الحجرة حدد طريقة الدخول عاد إلي منزله اتصل بالقس وأبلغه أنه مريض واستأذن في الراحة واستقر القس داخل منزله هو الآخر. توجه السائق إلي الكنيسة غافل حارس الحجرة ويدعي جاب الله غالي سليمان وكسر زجاج الباب الداخلي المفضي إلي الحجرة حمل الخزينة ووضعها داخل حقيبة سيارة القس وعاد إلي منزله خبأ الخزينة في جدار خزان الصرف الصحي بداخل منزله ولم يفتحها.<br />وأضاف المتهم أنه ارتكب الواقعة نظراً لمروره بضائقة مالية كما أن المبالغ التي شاهدها في الخزينة أغرته واعتقد أنها ستحل له كل مشاكله واستمعت النيابة لأقوال حارس الحجرة والقس الذي قام بفتح الخزينة<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 121
subject = "أحيك .........مع التحفظ"
author = "عابر سبيل"
posted = "2006-11-15"
text = "الأخ الكريم / عبد الله الطحاوى<br />أولاً دى أول مشاركة ليا على الموقع لأنى لقيت الموضوع ليه قيمة<br />بشكرك على المقال إللى بيوضح فعلاً أننا كمجتمع مصرى محتاجين لفكر دينى صحيح ليس متخاذل متساهل أو متشدد منغلق سواء كنا مسلمين أو مسيحين لأن أى أنسان الدين بيشكل ركن أساسى من حياته لو ملقاش الدين إللى يقدر بيه يعيش وينتج ويحقق هدفه من الوجود على الكون وهو عباداة الله سبحانه وتعالى وإعمار الكون والخلافة فى الأرض<br />بسم الله الرحمن الرحيم<br />\"وإذ قال ربك للملائكة أنى جاعل فى الأرض خليفة\"<br />طبعاً أنا مش موافق على حجات كتير حضرتك ذكرتها فى مقالك من أول أستخدامك لتعبير \"أذكر الله تكسب مرسيدس\" لغاية ربطك مابين عمرو خالد والسياسة<br />عمرو خالد زكى مش غبى<br />وهو عارف أن لعبة السياسة هاتخلى ليه أعداء وهو فى مرحلة عايز يجمع أكبر عدد حواليه<br />بالإضافة أنك لازم تخلى بالك أنك بتتكلم عن شخصية دينية وده مش تحيز لعمرو خالد والله ولكن لازم يتم تناولها بشئ من الإحترام لأنها شخصية ذو قيمة فى نفوس ناس كتير<br />ده مش معناه أنى أخش أهاجم المقال وأكتب الكلام الأهبل إللى قريته من شوى ده<br />أو فى نفس الوقت أنصب نفسى قاضى أو محامى<br />مش عارف<br />أمتى يا مصريين<br />وأمتى يا عرب<br />وأمتى يا مسلمين<br />هانتعلم نتكلم ونختلف ونتفق مع بعض<br />تحياتى أخى الكريم"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

