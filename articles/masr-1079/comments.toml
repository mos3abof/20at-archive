[[comments]]
order = 112
subject = "حركه فكر وليس حركه جهاد"
author = "ماردونا"
posted = "2006-11-13"
text = "اولا انا احى هذا الكاتب الرائع فى تحليله للنقاط ارئيسيه والفرعيه بشكل ممتع وشيق وأأسف لعدم معرفتى لهذا الكاتب ولكن اسلوبه ومصدقيته جعلنى اقراء النقال حتى النهايه لذلك احييه على هذا المقال<br />ثانياً هذا الكاتب قلت عنه انه صادق وهذا ليس مجامله ولكن لاسباب واقعيه وهى ان كل ما قيل عن سامح موريس بالحرف كلام صحيح لانى اعرف سامح موريس شخصياً بحكم انى مسيحى واحضر اجتماعات قصر الدباره<br />وايضا بحكم انى من الذين يحبون متابعة كل مجريات واحداث الحياه فبالتالى تابعت الشيخ المحترم الراقى عمرو خالد<br />وشعرت بمصدقيه الحديث عن التشابه بينهم وان افهم راى الكاتب انه عن تشابه الاسلوب العقلى الفكرى لكل منهما فى عمله الدينى وليس كما فهما اخوتى المسلمين الاحباء انه تشبيه كافر بمؤمن واعمى ببصير او ميت بحى<br />ومع ذلك انا احترم فكر الكاتب العميق ، وارحب بالنقد المفيد ، واشكر اخوتى المسلمين على رايهم فى اخواتهم المسيحين كما يقولون انهم اخوتهم بانهم كفار واموات وعمى ولا ينبغى التشبيه بهم كما جاء فى نص سوره الفاتحه كما قال احد المعلقين ."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
