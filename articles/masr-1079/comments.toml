text = "ايه يا عبيط ده فين اوجه التشابه يا اهبل يا بن الهبله<br />والله انا لو فايق كنت مسحت بكرامه الي ... الارض بس كفايه عليك كلمتين اديك ترفص<br />والاخت بتاعت روزليوسف دي رقم موبايلها اتنشر خلاص طب انا عايز انشر صوره البتاع ممكن هو اي حاجه تتنشر يا ولاد الهبله<br />مابلاش بقي كلام عبيط وناموا<br />وانت يا طحاوي تاني مره بقولهالك<br />اديـــــــــــــك ترفــــــــص"
