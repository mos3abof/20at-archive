subject = "ok every one take a rest"
author = "no0ne"
posted = "2006-11-13"
text = "بسم الله<br />ابدا كلامى باسم الله كلغة تعارف الى الجميع من مسلم و مسيحى بكافة مذاهبهم<br />اعذرونى و لكنى لا اقصد ان اعيب اى شخص هنا و لكن لما لا نحترم حرية الراى و الراى الاخر فلا عيب ان يرى احدنا ان المقال جيد و لا عيب ان يرى احدنا ان المقال سىء فان كنت ترى ان الكاتب اصاب<br />فلتشكره موضحا له نقاط قوة مقاله و نقاط ضعفه<br />و ان كنت ترى انه اخطا فلتشكره ايضا فلربما كان ينوى ان يصل اليك بخير و لكن لم يوفق و لتوضح له ما اسائك من مقاله<br />لا حاجة لنا لان نسىء الى بعضنا فلا احد منا كامل و انا اقلكم<br />كلنا من مسلم ومسيحى نحاول ان نصل الى الجنة وكلا يجتهد بطريقته لن ينفعنى صواب غيرى ان كنت انا المعيب و لن يعيبنى خطا غيرى ان كنت انا المصيب<br />اللهم اهدنا جميعنا اليك و اغفر لنا<br />جزاكم الله خيرا و عذرا لكونى مملا"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

