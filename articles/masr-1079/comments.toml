text = "فى البداية انا مسلم<br />الموضوع من وجهة نظرى غير مهم<br />ليكن فلان شبه فلان فما الافادة ؟<br />بس المهم كانت فى التعليقات . والله وجدت فيها مصائب .<br />مثل المسيحى الذى سب القرضاوى و الشعراوى و عمرو خالد . لماذا نصل فى معاملاتنا الى هذا الحد الجارح<br />والله الذى لا اله الا هو اننا نحبكم و ما نريد لكم الا كل خير فارجوكم لا تاذوننا فى ديننا ارجوكم .<br />و السلام عليكم و رحمة الله"
