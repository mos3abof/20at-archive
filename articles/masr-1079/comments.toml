[[comments]]
order = 107
subject = "ضمن سلسة الفضائح الجنسية للقساوسة"
author = "::استقالة زعيم الاتحاد القومي للطائفة الإنجليكانية في الولايات المتحدة بعد اتهامه بممارسة \"اللواط\" الشذوذ الجنسي"
posted = "2006-11-12"
text = "اتهمت السلطات الأمريكية القس تيد هاجارد، زعيم الاتحاد القومي للطائفة الإنجليكانية في الولايات المتحدة، وأحد أشهر القساوسة وأكثرهم تأثيرًا في الولايات المتحدة، بممارسته للشذوذ بصفة دورية مع رجل نظير أجر مالي. وبحسب \"بي بي سي\"، دفع هذا الاتهام القس إلى الاستقالة من منصبه كزعيم لهذه الطائفة، والتي تضم 30 مليون عضو، حتى انتهاء التحقيقات معه فيما نسب إليه. وقال هاجارد إنه قرر أيضًا التنحي مؤقتًا عن رئاسته لكنيسة الحياة الجديدة التي تضم 14 ألف عضو، ونفى القس الذي يعلن دائمًا أنه معارض لزواج المثليين الاتهامات الموجهة إليه. وكانت تلك الادعاءات قد ذكرها رجل خلال برنامج إذاعي في دينيفر بولاية كولورادو. وقال \"مايك جونز\" إنه مارس الشذوذ الجنسي مع القس هاجارد مقابل أجر مالي كل شهر تقريبًا خلال السنوات الثلاث الماضية. وأكد جونز (49 عامًا) أن موقف هاجارد من زواج الشواذ دفعه للكشف عن تفاصيل علاقتهما الشاذة. وقال\"ما جعلني أشعر بالغضب أن هناك شخصًا يقدم الموعظة حول زواج الشواذ ولكنه يمارس الشذوذ من خلف الستار\". وتأتي تلك الفضيحة في الوقت الذي يتوجه فيه الناخبون إلى صناديق الاقتراع في \"كولورادو\" والعديد من الولايات الأمريكية الأخرى للتصويت على إقرار قوانين زواج المثليين. جدير بالذكر أن بابا الفاتيكان قد صرح منذ أيام قليلة أنه يتعين على الكنيسة الكاثوليكية اتخاذ كافة الخطوات الضرورية لمنع وقوع المزيد من حالات الاستغلال الجنسي للأطفال من قِبل رجال الدين المسيحي ، والسعي لوقف الفضائح الأخلاقية للقساوسة. وأكد البابا أن الثقة برجال الدين قد تعرضت لأذى كبير، وأن إعادة بناء الثقة<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 108
subject = "مش فاهم"
author = "معاذ محمود عامر"
posted = "2006-11-12"
text = "الى نيفين<br />أنا لا أعرف متى شتمت أو سبيت أحد<br />الا لو انتي شايفة التعليق ده شتيمة<br />مش لاقي عنوان<br />أرسل هذا التعليق بواسطة : معاذ<br />يا أستاذ حمدي لا تتعب نفسك بالرد عليهم فانهم مهما فعلت ومهما قلت لن يحترموا حتى ما تقوله لأنهم يضعون تحت فراش كل واحد منهم خزانة يظنون أن بها كل الحقائق والبداهات ولا مجال للخلاف معهم ولا لمناقشتهم<br />ان النقاش والجدل يكون مع من يحترم هاتين القيمتين العظيمتين أما الذي لا يحترمهما فلا يستحق أن تجهد عقلك وأعصابك معه وليس في ذلك اي مخالفة لآداب النقاش والجدال ولا المنطقية والعقلانية<br />لأنه ببساطة \"من لا يحب طعاما لا يستحق أن يتذوقه\"<br />وبعدين في نقطة مهمة جدا أنا لا أرقى أن أكون حتى تابعا لك فأنت أستاذ وأنا ما زلت في طور التكوين ولم أنس ذلك لحظة<br />22/10/2006<br />وعلى فكرة أنا من ساعة التعليق ده معلقتش تاني على الموضوع ده خالص لأني لقيت ان المستوى انحدر بشكل فج<br />وتحياتي"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

