subject = "أستاذ عبدالله أرجو الإتصال بي"
author = "ديانا الضبع"
posted = "2006-10-30"
text = "أهلا أستاذ عبدالله.. أنا ديانا الضبع,, أظنك تذكر الإسم.. أنا من فجرت هذا الموضوع في مجلة روزاليوسف.. قد أحتاج أن أنشر جزءا من مقالتك في المجلةلأنك تتناول الموضوع من زوايا جديدة.. أرجو أن تتصل بي على تليفوني 0124013077<br />حاولت البحث عن أي وسيلة إتصال بك و لم أجد فأرجو أن تتصل بي أو ترسل لي كيفية الإتصال بك.. أرجو أن يكون ذلك خلال ساعات وشكرا"
