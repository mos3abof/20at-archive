[[comments]]
order = 53
subject = "ايه دا يا جماعة"
author = "عموره"
posted = "2006-11-02"
text = "مش معقول يا جماعة يكون مستوى الكلام بالشكل ده. الأستاذ عبد الله صحفي مثقف ولو كانت له وجهة نظر مخالفة لازم نناقشه فيها بالعقل والذوق مش بالطريقة الفجة دى. التعليقات الخارجة ضايقتني اكثر من المقال لأنها بصراحة تنم عن ثقافة الذين علقوا بكلمات تخش الحياء والذوق. لا.ز مش كده أبدا يكون الكلام بيننا وأرجو أن تتدخل إدارة الموقع لمراقبة التعليقات ولا نجعلها ساحة للمزاح الثقيل وغير المقبول حتى لو كانوا قاعدين على القهوة.. لو كان شباب العشرينات كله في مصر بالشكل ده يبقى نقرأ الفاتحة ونكبر أربع تكبيرات"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 54
subject = "مقال لاأخلاقى"
author = "أبو مؤمن"
posted = "2006-11-02"
text = "هذا مقال لاأخلاقى بالمره يشبه الكافر ابن الكافر بالرجل المؤمن الذى يقول الله واحد لااله الاهو ان كاتب المقال رجل ضال لأن الذى يذكر الله هو المسلم وهذا يكسب أكثر من المرسيدس بتاعته يكسب الجنه ان شاء الله التى لايدخلها الاالمسلمين ان شاء الله 00000وفيه مثل عربى يقول عشمان حنا يخش الجنه000"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 55
subject = "وا اسفاه"
author = "حزين"
posted = "2006-11-02"
text = "لا حول ولا قوه الا بالله ان تعليقات بعض الاخوه الافاضل توضح مدى الجهل والامية والعناء الذى وصلت الية الامه العربية عموماً والاسلامية خاصه وقد قال رسول الله صلى الله عليه وسلم ( سياتى على امتى زماناً تتداعى عليهم الامم كما تتداعى الاكله على قصعتها) وما اره من تعليقات وجيمه تحلل مدى فراغ العقول الكاتبه لها ما هى الا تصديق لقول رسولنا الكريم من تدهور لحال الامه يا امه اقرا هل نسيتم القراءه ام تجاهلتم اياها اقراو ما بين السطور من جوانب ايجابية اسردها الكاتب عبد الله لتفهمو معنى ومغزى الحوار عندما كان يكتب حاسبا انه يكتب لعقلاء وانما للاسف اكثركم سفها لا تعلمون شيئا عن القراءة مثل (الاستاذ كمسلم والاخ حستفيد ايه من الموضوع والاخ الاخر الذى يدعو بالشفاء للكاتب والله انا ادعو بالشفاء لكل من قراء المقال ولم يفهمه).<br />للعلم ايها الكاتب هذه اول مرة اقراء فيها لك وان شاء الله لن تكون الاخيره طالما استمررت فى الكتابه الجاده وفقك الله.<br />والسلام عليكم ورحمه الله وبركاته"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

