text = "و هو عمرو خالد بيقول : أذكر الله تكسب مرسيدس ؟<br />المسلمون يذكرون الله لأن الله قال \" و ما خلقت الإنس و الجن إلا ليعبدون\"<br />نحن نعبد الله أملا في جنات عرضها السموات و الأرض<br />و إني أستغرب هؤلاء الذين احتكروا العقل لأنفسهم .. أنتم تمثلون نوعا آخر من التطرف مفاده أن العقل هو التمرد على الإسلام فقط"
