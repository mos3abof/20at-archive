[[comments]]
order = 25
subject = "السلفييون قادمون"
author = "السلفييون قادمون"
posted = "2006-10-23"
text = "انا اقترح علي اخوتنا من المؤمنين ان نقتل الكاتب وكل من ايده في طرحه علي الطريقه الزرقاويه المباركه وذلك بان نسن سكين كبير ثم نقطع رقبته امام الشاشات حتي يكون عبرة وعظه لامثاله ثم ناتي بكل من ايدوه ثم نحرقهم احياء...لالالا لايصح الحرق يخالف الشرع ... اذن فلنقتلهم بالسكين ولنحسن الذبح ثم لنرقص علي جثثهم رقصة النصر المبين... فنحن حماة الدين واهل السنه والجماعه ومن خرج عن جماعتنا فقد خرج عن الاسلام وجب قتله وقطع رقبته وتطليق زوجته قبل استتابتها .. نحن سيف الله البتار علي كل من له قلب شك او احتار ولتلقوا بميه النار علي كل من تلبس الخمار و لا تلتزم بالنقاب حتي تكون عبرة لناقصات العقل والدين ولتذهبوا الي هؤلاء الشباب الفاسدين غير الملتحين فلتفتكوا بهم وتجلدوهم مائه جلده حتي يرجعوا الي امر الله ولا تاخذكم بهم شفقة ولا رحمه واقتلوا كل مرتد اثيم ينادي بالديمقراطيه او العلمانيه من عملاء الغرب الكفار الملاعين الشياطين الفاسقين الهدامين اعداء الدين // اقتلوهم حتي لاتكون فتنة ويكون الدين كله لله فلنظريات المستورده هي سبب فساد امتنا وضياع هيبتنا وتداعي الامم علينا<br />نحن المسلمين ونحن الاسلام ونحن اصحاب الحق ولا حق غير الذي معنا ومن اعوج عن طريق الحق الذي معنا قومناه بسيوفناحتي نلقي الله في جنة الخلد التي اعدها لنا نعم لنا نحن المؤمنين السلفيين المسلمين اهل السنمه والجماعه اهل الحق ولا حق غير الذي معنا<br />نحن قادمون ايها الفاسدين حتي نعيد الناس من حبال الشرك الي طريق الايمان الواحد الذي لا طريق غيره انه طريقنا طريق الله طريق السلف الصالح طريقنا ولا طريق غيره ولا طريق غيره ولا طريق غيره ولا طريق غيره ولا طريق غيره ولا طريق غيره ولا طريق غيره ولا طريق غيره و<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 26
subject = "اناس بعقول ولكنها فارغة الا من التفلسف فى كل شئ"
author = "BATISTUTA"
posted = "2006-10-23"
text = "ايها الافاضل اعداء السلفيين من المتهكمين والروشيين اوى انا لم اعقد مقارنا وخرجت من موضوع المقارنات سريعا حتى لا يتصيد امثالكم فى الماء العكر .<br />كل ما سألته فائدة المقال بالنسبة للجميع لذا اجيبوا بعيدا عن اظهار ان السلفيين سفاحيين وقاطعى رقاب وهذا ليس موضوعنا هناك فرق بين القاعدة والسلفية ايها الرجل المثقف الواعى ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 27
subject = "عندهم حق"
author = "NEW DAY"
posted = "2006-10-23"
text = "انا متفقة مع كل اللي انتقدوا المقال ، لأن اسلوبه مستفز والمقارنة مش منطقيةاصلا هو فين الفكر والتحليل والكلام الكبير اللي الناس قالوه ده ، ده تمييع لقضية دينية اساسية فاذا كان صاحب المقال متبني حكاية التقريب بين الاديان والكلام الفارغ ده ما يفرضش علينا وجهة نظره<br />اما الشخص الظريف اللي بيتهكم على السلفية واسلوبه اقل من انه يترد عليه فلن اقل له الا<br />حسبنا الله ونعم الوكيل<br />قال تعالى: (إِنّ الّذِينَ أَجْرَمُواْ كَانُواْ مِنَ الّذِينَ آمَنُواْ يَضْحَكُونَ، وَإِذَا مَرّواْ بِهِمْ يَتَغَامَزُونَ، وَإِذَا انقَلَبُوَاْ إِلَىَ أَهْلِهِمْ انقَلَبُواْ فَكِهِينَ، وَإِذَا رَأَوْهُمْ قَالُوَاْ إِنّ هَـَؤُلاَءِ لَضَالّونَ، وَمَآ أُرْسِلُواْ عَلَيْهِمْ حَافِظِينَ، فَالْيَوْمَ الّذِينَ آمَنُواْ مِنَ الْكُفّارِ يَضْحَكُونَ)"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 28
subject = "لا حول ولا قوة الا بالله"
author = "BATISTUTA"
posted = "2006-10-23"
text = "حكمت على بالانغلاق الفكرى والجهل وسوء الادب لا افهم هل قمت بسب ام احد هنا كى اصبح سئ الادب ام ان اسلوبى به الفاظ سوقية هذا من ناحية سوء الادب لذا فعد ببصرك مرة اخرى لعلك كنت اعمى .<br />انغلاق فكرى لمجرد الاختلاف فى الرأى فمن المفترض ان امجد المقال كى اصبخ منفتح فكريا كذلك جاهل لانى قلت فى المقال عكس مايريد جنابه اى ارهاب فكرى هذا يوصم كل من يرفض اراء المتعلمنين والليبراليين والشيوعيين والمتثقفين بانه وهابى وسلفى وقاعدى وطالبانى وبالمرة حماسى واخوانى اى ضيق افق هذا أمن المفترض ان اكون مثلك اعتنق نفس فكرك لولا اختلاف الرأى يا محترم إلا ان الاختلافى مع اناس محدديين بعينهم من امثالكم المتحررين ذوى الحرية و المنظريين لها يدفعنى احيانا الى التهكم والسخرية .<br />لذا هل رآنى احدكم من شاشته هل رآنى احمل سيفا واضرب عنقه هذا لغو وكلام باطل يراد به فقط تهويل الامور ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 29
subject = "هناك فرق !!!"
author = "مسلم عربى"
posted = "2006-10-23"
text = "ياساده واخص باذكر الأخ المتهكم على السلف والأخ الأخر ( دون ذكر اسماء ) البعيدعن فهم المقصود من احتجاجنا على الكاتب ومقاله00 نعم نحن نتبع اثار السلف00 نعم نحن فى الصف مع الجماعه00 ولكن !! لسنا( خوارج )!! لتعرف المعنى والفرق بين هذا وذاك !! قال خير البريه عليه وأل بيته وصحبه الصلاة والسلام \" لاتزال طائفه من أمتى ظاهرين على الحق لا يضرهم من خالفهم حتى يأتى أمر الله \"0"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 30
subject = "الإسلام دين إجبار وإجرام"
author = "ميمون مسعود عمرام- معاذ محمود عامر سابقا"
posted = "2006-10-23"
text = "تعبت منكم ومن قباحتكم ووعظكم وحقارتكم وجهلكم وغباوتكم يا مسلمين. ليه يارب ما خلقتنيش يهودي في غير بلاد العرب الجرب؟ مش كنت دلوقتي أدي أجعص جعيص في البلد الوسخة دي بالشلوط ولايهمني؟<br />غلطة أهلي أنا حأصلحها ومن النهارده أعلن إني يهودي بالعند فيكم يا ولاد الجزم."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 31
subject = "السلفييون قادمون"
author = "السلفييون قادمون"
posted = "2006-10-23"
text = "الاخت بتقول المقال بيدعوا اللي تقريب الاديان والاخ التاني بيقول المسلم لايقارن باي شيء<br />حقيقي معجب بستواكم العقلي ... اللهم بارك فيكم واجعلهم علي طريق مسعد انور<br />طبعا المقال ليس في نفس مستواكم العقلي ولا حتي النفسي ... انا عارفكم وعارف مقالاتكم المستنيره واسئلتئكم التي تدعو الي نهضة الامه .. وبالمناسبه هل يجوز الاخذ من اللحيه بحجم القبضه او لا يجوز .. سؤال عميق عايز واحد سلفي<br />طوبي للغرباء من السلفيين طوبي للغرباء من السلفيين طوبي للغرباء من السلفيين"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 32
subject = "السلفييون قادمون"
author = "السلفييون قادمون"
posted = "2006-10-23"
text = "واحد بيقول علي اني بعيب علي السلف الصالح ...ياراجل اتق الله ... اتق الله .. الكذب حرام<br />ولايكون المؤمن كاذبا ..<br />وانا لم اقل انكم من الخوارج بس اللي علي راسه بطحه بيحسس عليها علي راي المثل<br />اما هذا الباتستنوتا ننوس امه السلفي اللولو بيقول هو مش من حقنا ان احنا ننقد المقال ... لاياننوس عين اهلك من حقك طبعا ومن حق اي حد /// حق الاختلاف حق مقدس لكن مش من حقك يا كوتوموتو انك انك تجرح في غيرك او تتهمه في دينه ولا انت فاكر نفسك ابن حنبل<br />لازم ياعم المتقي تعرف ان الناس ممكن تتختلف من غير ما يكون حد فيهم كافر ولا فاسق ولازم تعرف ان الجنه مش الارض الملك بتاع محمد يعقوب او ابو اسحاق الحويني .. لا يا حبيبي دي ملك ربنا اي والله ملك ربنا!"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

