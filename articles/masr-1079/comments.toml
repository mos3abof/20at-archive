[[comments]]
order = 105
subject = "عن الموضوع المسلم والمسيحى"
author = "سى سيد"
posted = "2006-11-11"
text = "شكرآ الى الاخ الكاتب المقال واللة شى عظيم بس ليس فى اى مصر عندة عقل كما يقول زمان عقلك فى ؟؟؟؟ للاسف ما فيش فيدة فى شعب مصر ,,, الا التفها والنكت ـــ؟؟؟ ولو المسيحى ما كنش انكتب فى القراءن الكريم وسيدنا عيس علية السلام يا ايوة الغبى افهم وتكلم او احسن روح على القهوة والمصخة واللة كلم حلو وفية تشبيه بين الدين لان اللة وحد والمسحيى يقول اللة واحد والمسلم يقول واحد وفى نهيت الصلاة كل واحد يقول اة اة يا غبى ــ امين افهم واقراء القراءن الكريم هو كانت زمان سياسة وحصل هذة التفرقة واقراء سيرة الرسول الكريم والمسحيى وما هو عمر خالد وما هوسامح رجل متعلم وعرف دينة حق ولو عمر بس ينسة الفلوس شوية يكون احسن وبلاش مرسدس اهم شى حب اللة وحب الاب والام والاخواة ولا تنسة صليت الرحم لان دين اللة واحد واللة يهدى كل مصرى من الشعيبات الزى فى راسو يا شعب تفها كل يوم وانتم الى الوراء واحسن شى شوفتة هذة الصورة صورة المراء وهذ حق من بلد الاسلام والف خسرة الى هذة البلد الارض طيبة بس الزى فوق نجس والكل يعلم هل هذ هو الاسلام الزى يقول لا فر ق بين خالد وسامح انا عندى سامح لان رجل دين وليس علشان الفلوس وانا عن نفسى ولا هذ ولاهذ عندى الكتاب الكريم والشرح او التفسير وبعض من سيرة الرسةل الكريم بس والحمد اللة وارجو يا ايوهة الغبى لا تضحك اللة يضحك عليك قريبا واصحو يا شعب ,, عليكم العوض"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

