text = "نعم التشابه كبير بين أسلوب عمرو خالد و اسلوب سامح موريس.فخطاب كل منهما مغرق فى العاطفية و يعتمد على إثارة الوجدانات ،و يخلو من العقلانية،و يتجنب من الناحية السياسية اية لغة صدامية.و أود أن اضيف ان بعض التعليقات تتسم بقلة الأدب وقلة الحضارة.فإذا لم نكن على مستوى احترام حرية الرأى المخالف الذى قد يتحدى اعتقاداتنا و يثير نفورنا،فاننابذلك نكون غير مستحقين للحياة."
