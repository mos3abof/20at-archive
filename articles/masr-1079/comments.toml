subject = "فائده المقال"
author = "resha"
posted = "2006-11-03"
text = "السلام عليكم:<br />لكل من تسال عن فائده كتابه هذا المقال<br />الفائده الوحيده تصب فى خانه قسيس مسيحى يظهر فى احدى الفضائيات لا شغله له الا سب المسلمين والاسلام وفى احدى حلقات البرنامج التى خصصها للنيل من عمرو خالد<br />ذكر هذا الموضوع وقال ان عمرو بيقتبس كلام مسيحى للدعوه للاسلام<br />عل عرفتم الفائده<br />الحلقه عندى لمن يريد التاكد<br />ارجوكم ارحمو شبابنا يا مسلمين ولا تحاولو النيل ممن يعتبر قدوه صالحه"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 64
subject = "إلي ان يثبت العكس"
author = "ياسمين مجدي"
posted = "2006-11-03"
text = "الأستاذ كاتب المقال لقد اقنعتني بشكل منطقي وعميق برؤيتك للتشابة ما بين كل من عمرو خالد وسامح موريس ...وعلى الرغم من اني لم اكن أعرف شيء عن سامح موريس كما لم أشاهده من قبل إلا أن أسلوبك في طرح القضية بشكل راق اقنعني نظرا لأنك تلعب بغنسانية علي نقاط التشابه الحياتي ولم تفعل كما يقول البعض بالترويج لسامح موريس إنما انت رصدت التشابة<br />وإلي كل الذين فهموا خطأ أقول يجب ان تكون عقولكم اكبر وأرحب من ذلك إن الإسلام دين حرية وغخاء ...وحتي لو كان عمرو خالد حضر في الكنيسة درس لموريس فليس ذلك ما يقلل منه و لابد أننا نعرف الحديث القائل (أطلبوا العلم ولو في الصين ) وهي الدولة الملحدة<br />إن كاتب المقال طرح أوجه تشابة فرضت نفسها ما بين عنصرييين يلعبوا نفس الدور كل في ملعبه<br />وإذا كان قد تطاول سامح موريس على الإسلام او على عمرو خالد فإن هذه نقرة أخري تخص مضمون حديثه والموضوعات التي يبثها وإن كان التشابه بينهما في اسلوب الطرح والموضوعات الحياتية<br />أيها المؤمنون أن ما طرحه كاتب المقال يؤكد على شيء واحد هو ان الديانات السماوية كلها من اله ..كلها تدعو للحب والإيمان والحياة الحلوة<br />تحياتي لكاتب المقال إلي أن يثبت عكس ما طرحته"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 65
subject = "إستيضاح"
author = "ياسمين مجدي"
posted = "2006-11-03"
text = "إستفسار حول بقي الموضوع<br />لقد علقت حول التشابة ما بين عمرو خالد وسامح موريس<br />لكنني الان لن أستطيع تأييدك حينما اتحدث في نقطة أخري فماذا تقصدبـــ\" لماذا ظهرت هذه الظاهرة عند المسيحيين قبل المسلمين والمعروف أن النهضة الإحيائية ظهرت لدى الفريقين في ذات التوقيت؟ \"..هل اغفلت ان الدعوة موجودة منذ فترة طويلة جدا قبل عمرو خالد بكثير<br />وإن كنت قارنت بينه وبين موريس فبمن تستطيع أن تقارن الشعراويالذي كان يطرح التفسير والوعظ الديني بشكل سلس وبسيط"
archived = "2006-11-06"
