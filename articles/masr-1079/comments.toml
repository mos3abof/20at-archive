posted = "2006-12-29"
text = "مش عارفة لحد امتى هانعلم المصريين الاحترام؟<br />ومش عارفة لية كل المسلمين اللى كاتبين مشاركاتهم مش بيتكلموا باحترام لما انت وهو ماتعرفوش موريس بتعيبوا فية لية<br />صحيح كل حاجة بتنضح باللى فيها<br />وكل يوم تقريبا باشوف حد مش محترم اقول يبقى دينة هو اللى معلمة لان بصراحة الدين لية اكبر بصمة فى المصرين<br />يابتوع المبادئ والاسس والاخلاق احترموا بعض شوية يا مصريين<br />فضحتونا وبهدلتوا البلد"
archived = "2007-01-02"
capture_url = "https://web.archive.org/web/20070102063901/http://masr.20at.com:80/article.php?sid=1079"

