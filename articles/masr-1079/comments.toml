[[comments]]
order = 23
subject = "لا حول ولا قوة الا بالله العلي العظيم"
author = "فيه ايه ياسيد انت وهو .... ايه الغباء المستحكم اللي انتوا فيه ده الراجل بيتكلم عن اسلوب دعوة كل واحد الي دينه"
posted = "2006-10-23"
text = "ايه اللي دخل المقارنات بين الاسلام والمسيحيه هو حركة طالبان نقلت نشاطها الي مصر مش معقول حجم التطرف اللي وصلنا له واللي باين من خلال التعليقات والله العظيم انت تمثلون خطرا اكبر من مبارك وزمرته الفاسده تطرف وانغلاق فكري وسوء ادب وتطاول في الرد علي كل مخالف واستعلاء ممزوج بجهل مركب<br />ولا حول ولا قوة الا بالله العلي العظيم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

