[[comments]]
order = 19
subject = "الاتنين اللى تبع بعض"
author = "BATISTUTA"
posted = "2006-10-23"
text = "ارجو ان تكون تاكدت انى لست سلفى فاسلوبى لا يوضح ذلك وان كنت اتمنى ذلك وهذا شرف لى .<br />فأنأى بنسفى بعيدا عن المتعلمنين و الليبراليين الذين يظنون ان الله اعطاهم عقلا كى يتجادولوا فى امور بقصد الفرقعة الاعلامية فانت تعلم ايها المعاذ ان هناك اختلاف جذرى بين المسلمين والمسيحيين واليهود وان كنت نقرأ القرآن فلابد وانك ستعرف ان القرآن قد كفرهم ليس معنى كلامى هذا ان اقاتلهم ولكن الاسلام امرنا كما ارجو ان تعلم ان نتعامل معهم بالحسنى ووضع لذلك شرط وهو الا يحاربوننا ويحاربون الله ورسوله ومع ذلك هذا ليس موضوعى فالتشبيه بين شخص منا واخر منهم مستحيل حتى لو كان فى الاسلوب كما يقول الكاتب وبل ويدعى ان عمرو خالد يحضر جلساته هذا تلفيق اذا لم يظهر سند او دليل ومعنى هذا الكلام عظيم عند البسطاء الذى من الممكن ان تثيرهم مثل هذه الكلمة وتتشتهم .<br />انا لا ادافع عن عمرو لانى لا استمع له وانما اردت ان اوضح ان حتى عمرو خالد صاحب الشأن من الممكن ان يضيق صدرا بذلك هذا ليس تأكيد وانما مجرد ظن وليسمحوا لى الاخوة الافاضل اصحاب العقول المنيرة الخفاقة فى سماء الفكر والرقى ان يوضحوا لى الهدف من مقال مثل هذا بالنسبة للمسلم وللمسيحى ايضا اجيبونى اصحاب العقول افادكم الله فلربما ذهب عقلى فى نزهة اجيبوا ولا تنشغلوا بالرد والتعليق ؟"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

