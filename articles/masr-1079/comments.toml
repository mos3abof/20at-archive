[[comments]]
order = 66
subject = "الوهابيون واتباعهم للسلف الصالح"
author = "سعودي يروي لأول مرة تفاصيل تفريقه عن زوجته لعدم كف"
posted = "2006-11-03"
text = "تنفرد \"العربية.نت\" بأول حوار مع الزوج الذي قررت محكمة سعودية تفريقه عن زوجته وأم طفليه لعدم كفاءة النسب، وتم توقيفهما \"حبسهما\" بعد صدور الحكم بتهمة الخلوة غير الشرعية، ولا زالت الزوجة محبوسة في سجن الدمام مع طفليها منذ أكثر من ثلاثة شهور.<br />وينتظر هذا الزوج السعودي ومحاميه قرار محكمة التمييز في الرياض بنقض حكم التفريق بينه وبين زوجته التي تزوجها قبل ثلاث سنوات بعد أن تقدم بلائحة اعتراضية على الحكم الذي استند على عدم كفاءة النسب.<br />وقد تمسكت الزوجة بالبقاء في السجن إذا لم تعد لزوجها، ورفضت الذهاب مع أخوتها لبيت أهلها. وكانوا قد كسبوا دعوى قضائية ضد زوجها \"منصور التيماني\" رفعوها بعد سبعة شهور فقط من الزواج، يطلبون تفريق أختهم التي تنتسب إلى قبيلة، من زوجها لعدم كفاءة النسب لأنه ليس قبيليا مثلها، واتهموه بالتغرير بأبيها والكذب عليه عندما تقدم للزواج منها بأنه من قبيلة شمر.<br />وترفض بعض القبائل في السعودية تزويج بناتها من غير القبيليين ويطلق عليهم مسمى \"الخضيريين\". لكن الزوج منصور التيماني قال إن والدها لم يطلب منه اثبات نسب، وكل ما طلبه شهادة من امام المسجد أو العمدة بأنه متدين ومواظب على الصلاة ويتمتع بأخلاق عالية، مشيرا إلى أنه قدم اثباتا موثقا للمحكمة بأنه من أبناء قبيلة شمر.<br />وكانت الزوجة \"أم سليمان\" قد فرت مع زوجها من بيتهما في مدينة الجوف إلى مدينة جدة بعد صدور الحكم المشمول بالنفاذ المعجل، خشية أن يأخذها أخوتها بالقوة، وقال زوجها منصور التيماني لـ\"العربية.نت\" إنهم كانوا ينوون تزويجها بآخر بعد انقضاء العدة.<br />وقد ألقت شرطة جدة القبض عليهما ومعهما طفلاهما في مدينة جدة واتهما بالخلوة غير الشرعية، بعد تعميم من أخوتها بأنها لم تعد زوجته وأصبحت حسب اللفظ الشرعي المتداول \"أ<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 67
subject = "تابع المقال"
author = "وأصبحت حسب اللفظ الشرعي المتداول \"أجنبية\" عنه بعد صدورحكم التفريق."
posted = "2006-11-03"
text = "تم ترحيلهما إلى مدينة الخبر، وخرج الزوج بكفالة بعد أسبوع، بينما رفضت هي الخروج مع أخوتها وتمسكت بالبقاء في السجن أو الذهاب مع زوجها.<br />ويقول عبد الرحمن اللاحم المحامي والناشط في حقوق الانسان لـ\"العربية.نت\": أرسلنا لائحة اعتراضية على الحكم إلى وزير العدل وعن طريقه رفعت إلى محكمة التمييز في الرياض وإلى الآن لم يصلنا الرد عما إذا كان الحكم قد نقض أم لا.<br />وحول الوقت الذي يستغرقه ذلك قال: ليس هناك معيار محدد، لكني في النهاية متفائل خيرا، مشيرا إلى أنه بمعيار النظام القضائي جاء الحكم بالتفريق أسرع من المعتاد، ففي مثل هذه القضايا المعقدة التي تتعلق بمصير العلاقة الزوجية بين الزوج وزوجته، يفترض أن تأخذ وقتا أطول لاستكمال كافة الاجراءات القضائية، لكن هذه القضية لم تأخذ الوقت الكافي.<br />عودة للأعلى<br />دعوى عدم كفاءة النسب<br />وحول ملابسات حكم التفريق أوضح إن أخوة الزوجة غير الأشقاء رفعوا دعوى أمام القضاء تطالب بفسخ عقد زواج اختهم من زوجها \"منصور\" لعدم كفاءة النسب وأنه لا ينتمي إلى قبيلة، وبعد مداولات في المحكمة أصدر القاضي الحكم بفسخ العقد على اعتبار أن الكفاءة النسبية شرط معتبر، وأن هناك عرفا قائما في البلد بأن غير القبيليين لا يتزوجون من القبيليات. و أورد الحكم مجموعة من المقولات لفقهاء الحنابلة (أتباع المذهب الحنبلي) حسب المحامي عبد الرحمن اللاحم.<br />وأضاف: الحكم اعتمد على عرف قائم ولكننا دفعنا أمام محكمة التمييز بأنه عرف فاسد لا يعتمد عليه من الناحية القضائية الشرعية أو النظامية، فالمفترض أن يكون عرفا صحيحا متوافقا مع الشريعة الاسلامية، إضافة إلى أن القاضي لا يستند إلى العرف إلا في حالة عدم وجود نص.<br />وأشار عبد<br />اقرأ بقية التعليق .."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

