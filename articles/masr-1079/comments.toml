[[comments]]
order = 135
subject = "بعيدا عن النقد الهدام"
author = "رضوانة"
posted = "2006-11-18"
text = "اقول لكل من تطاول على الكاتب بدلا من ابداء رأى سخيف لا ينفع ولا يضر واستخدام الفاظ لا تدل ازا دلت على شئ الا ضآلة ثقافة وادب المعلق..اقصد اى معلق لا يجد الحجة او المنطق فى مجادلة صاحب المقال.......فانة باستخدام الفاظه وهتافه الذى لا يجدى يقدم نفسه للناس بصورته الحقيقية التى يعرفها جيدا ولا داعى لزكرها ....القراء يعرفونها جيدا.......<br />اشكرك ايها الكاتب على هذا التحليل الرائع واعتقد انى لمست وجهة نظرك....ولكنك ايضا لديك غيرة على الاسلام وهذا الزى جعلك تدخل فى فكرة وجود تشابه بين سامح وعمرو خالد فهناك فعلا من يصطادوا فى المياه العكرة ولا مانع يا استاز ان تكون هناك حزكة قومية وطنية توحد الجهود لمستقبل البلاد وتثرى مرة اخرى الروح الدينية لدى الشباب طالما لم تمس اى حركة دينية عقائد الديانات الاخرى وازكر ان فى عصر الدولة الاسلامية كانت هناك مناظرات تحدث فى قصر خلافة المأمون بين المسيحى والمسلم......بدون اى تعصب مثلما كان يحدث بين احمد ديدات وسويجالرت.........<br />وكان هناك مستشارون مسيحيون ووزراء فما المانع طالما لم تمس العقيدة .سبحان الله فعلا على مصر<br />فلسطين بها المسيحيون والمسلمون وكانت نسبة المسيحيين قبل اسرائيل اكثر قليلا من المسلمين .....وبدات حركة التحرير بمسلمين ومسيحيين..هناك فرق بين الوطنية او القومية وبين العقيدة .ارجو من ضعاف الفهم الا يساء فهمى ......انا لا اتكلم عن الوحدة الوطنية فهى فى مصر مقولة حق اريد بها باطل .ولكنى اتكلم عن المصريين كلهم وارجو ان تنظروا الى لبنان الان .......بها حرية دينية ولا تمس اى عقيدة......فازا تم توحيد جهود الحركات لتتلاقى ويختفى هذا الانفصام ساعتها ستتضاعف الفائدة.هذا راى وارجو توجيه نقد بناء ......."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 136
subject = "نقد بناء"
author = "أنا لا أوافق على طرح هذا الموضوع لأني لا أري اي فائدة تعود على المسلمين من قراءة هذا المقال , و لي بعد التعليقات على المضمون :"
posted = "2006-11-18"
text = "أولا : من الطبيعي وجود بشابه بين المسيحية و الإسلام في بعض الأفكار مثل التوبة و العودة إلى الله فكلاهما ديانات سماوية و المسلم لا يكون مسلم الا إذا آمن بوجود الرسالة اليهودية و المسيحية . و هذا التشابه لا يعني تشبه عمرو خالد بالداعية المسيحي . و اسمع باقي الدعاه المسلمين مثل محمد حسين يعقوب , أو متحمد حسان و غيرهم ستجد ان نفس افكار التوبة و العودة الى الله .<br />أما استخدام عمرو خالد لمصطلح ( ياجماعة) فأعتقد انك تعرف ان كل المصريين و الشباب في الجامعات يستخدم هذا اللفظ و بما ان عمرو خالد يتكلم بلسان الشباب فمن الطبيعي ان يتكلم مثلهم . أما ما عرضته من تحليل فأعتقد انه يجب ان تراجع أفكارك و لكن لا تبذل مزيدا من البحث لأنه لا فائدة من وراء ذلك لا على المسلمين و لا المسيحيين ."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

