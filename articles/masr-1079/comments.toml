text = "بسم الله الرحمن الرحيم اما بعد كان رسول الله صلى الله علية وسلم يتعمل مع كل البشر ووقال اللة تعالى لكم دينكم ولى دنيى فى مش عارف انا اية هى المشكلة ما كل واحد يخليه فى نفسة او كم يقول الاسلام ادعو الى سبل ربك بالمو عضة والحكمة الحسنةومن يتقى الله يجعل لهو مخرجا فا دعو كل الاخوة مسلمين ومسحين انة كل واحد يلتزم بنفسة وان الله يهدى من يشاء وشكر وهدانى الله وهداكم وعلى فكرة الكلمة دى للمسلمين قبل المسحين الا سلام دين علم وفكر ومنقشة فبلاش التعصب الى واثق من نفسة عمرة ما يتعصب والسلام عليكم ورحمة الله"
