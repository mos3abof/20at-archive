[[comments]]
order = 155
subject = "خبر طازج"
author = "خبر طازج : قس أغتصب طفلا في السلفادور ..."
posted = "2006-11-23"
text = "أرسل هذا التعليق بواسطة : عبدالله<br />السجن 20 عاماً لقس اغتصب طفلا في السلفادور<br />أصدرت محكمة في السلفادور حكما بالسجن 20 عاما على قس كاثوليكي لاغتصابه صبيا عمره 11 عاما وهذا الحكم هو الاول من نوعه في تلك الدولة الواقعة في أميركا الوسطى.<br />وكان قضاة المحكمة الثلاثة اصدروا الحكم على خوسيه دانييل ريفاس البالغ من العمر 60 عاما لارتكابه الجريمة العام الماضي في بلدة سان كريستوبال على بعد 35 كيلومترا شرقي العاصمة سان سلفادور.<br />وقال مسؤول في المحكمة «حتى الآن لا يوجد سجل لعقوبة من هذا النوع في البلاد».<br />وفي الولايات المتحدة اقيمت مئات الدعاوى القضائية منذ تفجرت فضيحة اعتداءات جنسية لقساوسة في عام 2002. وأظهرت وثائق للكنيسة في اميركا نشرت منذ ذلك الحين ان بعض الاساقفة عمدوا الى اجراء تنقلات لقساوسة لهم تاريخ في الاعتداءات الجنسية بين الابرشيات بدلا من إحالتهم الى الشرطة.<br />وأنا عبدالله أقول : ما شاء الله علي تمسك القساوسة بالدين المسيحي ... لو كان هذا الدين له أي تأثير إيجابي علي النفوس لما رأينا أكابره من القساوسة يتخصصون بالاغتصاب والزنا والسفاح ... المسيحيين يزعمون بأن دينهم دين رحمة وتسامح , طيب لماذا لا يرحم القساوسة الأطفال من الأغتصابات التي يقومون هم بها ضد براءة الأطفال؟"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 156
subject = "lما احلى الحياة فى وطن ملئه الحب والوئام"
author = "بدريه"
posted = "2006-11-23"
text = "تحلو الحياة فى وطن ينعم بالحب والتناغم بين ابنائه حتى لاتترك فجوه يدخل منها المفسدين فى الارض خرجنا الى الحياة وجدنا بلدنا تعيش فى نسيج مترابط لايعرف مسلم من مسيحى فالكل سواء خير البلد ولاقدر الله شر ع البلد يعم على الجميع لاينتقى فرد دون اخر ليتنا نعود كما كنا لانذكر تلك الكلمه هذا مسلم وهذا مسيحى بل نقول هذا مصرى فقط الدين لله والوطن للجميع لان العيش من مأكل ومشرب ونسمة الهواء وكل الوان الحياة مشتركه شاء المفسدون ام ابوا هكذا نحن الشعب المصرى لانعرف بيننا الفرقه وسنظل هكذا بأمر الله الى ان يرث الله الارض ومن عليها"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 157
subject = "الى بدرية"
author = "احنا كنا عايشين كويس لما كل واحد كان عارف حجمه كويس وعارف قدرته."
posted = "2006-11-23"
text = "لما كان اخونا رافعين شعار<br />لله المجد في الاعالي وعلى الارض السلام وفي الناس المسره.<br />كان فيه حب ووئام وسلام.<br />لكن دلوقتي اخونا عمالين يقولوا يا شر اشتر"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 158
subject = "فينكم ياعرب"
author = "عبد اللة"
posted = "2006-11-23"
text = "فينكم ياعرب الأساءة واضحة وصريحة وانتم واقفين كلب شتمنا واحنا واقفين عمال يقول مجرمين واحنا سامعين وساكتين افتكروا من كام سنة ماكنش ليهم صوت اسألوا نفسكم يامصريين لية صوتهم على ولاد الخنازير اولاد ابو جهل انا على فكرة احب واحترم جميع اخواننا المسيحين المحترمين لكنى بوجة كلامى لكل خنزير يسى الى الأسلام وكل اعمى واصم من المسلمين واردد فيييييييييينكم ياعرب"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

