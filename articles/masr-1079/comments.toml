[[comments]]
order = 91
subject = "قبطي يسرق كنيسة العذراء بالقليوبية"
author = "أمر أحمد عزوز مدير نيابة الخانكة بحبس سائق القس «يسطس فانوس» راعي كنيسة العذراء بالقليوبية ٤ أيام علي ذمة التحقيقات سرق خزينة الكنيسة وبداخلها ٤٥ ألف جنيه، وادعي أن مجهولين اقتحموا الكنيسة وارتكبوا الحادث كشفت المباحث غموض الواقعة وأدلي المتهم باعترافات تفصيلية في تحقيقات النيابة."
posted = "2006-11-07"
text = "قال المتهم غبريال نادر عزيز «٣٥ سنة» إنه يعمل سائقاً للقس يسطس فانوس «بطرس» راعي كنيسة السيدة العذراء «مطرانية الأقباط الأرثوذوكس» بمنطقة ورش أبوزعبل منذ أكثر من ٥ سنوات تزوج قبل عامين وأنجب طفلة، تطالبه الزوجة بمصاريف بالغة تفوق راتبه الشهري، حاول الالتحاق بعمل إضافي إلا أن الوقت لم يسمح له.<br />ذات يوم شاهد السائق القس يسطس ومعه ٣ آخرون من مسؤولي الكنيسة داخل حجرة مبني الخدمات الملحق بالكنيسة وقفوا أمام خزينة حديدية، بابها كان مفتوحاً تظهر المبالغ المالية منه.. وقف السائق علي باب الحجرة اتخذ قراره بالاستيلاء علي تلك الأموال عاين المكان والحراسة الأمنية علي الحجرة حدد طريقة الدخول عاد إلي منزله اتصل بالقس وأبلغه أنه مريض واستأذن في الراحة واستقر القس داخل منزله هو الآخر. توجه السائق إلي الكنيسة غافل حارس الحجرة ويدعي جاب الله غالي سليمان وكسر زجاج الباب الداخلي المفضي إلي الحجرة حمل الخزينة ووضعها داخل حقيبة سيارة القس وعاد إلي منزله خبأ الخزينة في جدار خزان الصرف الصحي بداخل منزله ولم يفتحها.<br />وأضاف المتهم أنه ارتكب الواقعة نظراً لمروره بضائقة مالية كما أن المبالغ التي شاهدها في الخزينة أغرته واعتقد أنها ستحل له كل مشاكله واستمعت النيابة لأقوال حارس الحجرة والقس الذي قام بفتح الخزينة وأكد سلامة الأموال الموجودة بها، أمرت النيابة بالتحفظ علي الخزينة لحي<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 92
subject = "معرفة أوجه التشابه بين الواعظين.. من المهم أن نقترب قليلاً من سامح مو"
author = "amira"
posted = "2006-11-08"
text = "معرفة أوجه التشابه بين الواعظين.. من المهم أن نقترب قليلاً من سامح موريس وعالمه.<br />البداية كانت من المنيا حيث مولده، ثم القاهرة والتي انتقل إليها بعد حرب 1967 في المرحلة الثانوية. تخرج في كلية طب قصر العيني عام 1976 وحاصل على الماجستير في الجراحة العامة ينتمي إلى عائلة ميسورة ومشهورة متزوج وله ثلاثة أولاد. وهو شخص بسيط يعيش وسط الناس كما يقول عن نفسه حاول أن يفهمهم ويشعر بهم حتى يستطيع الاقتراب منهم لذا فهو ليس خيالياً وإن كان عاطفيا مستغرقاً في الروحية يجيد استمالة القلوب والعقول بألفة وبساطة.. إنه أحد مؤسسي (واخدين بالكم يا جماعة).<br />خطابه الديني مبني على النصوص المقدسة التي يزاوجها بالقصص الحياتية ولكن الأبطال.. أنا وأنت.. وليس قدسيين.. النصوص لديه تفسر الحاضر ويستولد منها الإجابة على كل شيء.. وكله في إطار المتفق عليه لا مجال لفلسفة أو حيرة.<br />حديثه دائماً مرتبط بالله بالمفهوم المسيحي يعتبره مركز الكلام وليس الإنسان ويرى أنه نقطة البداية والنهاية ومصدر الحياة والراحة والإعانة والتشجيع وعندما سألته عن سبب ذلك أجاب: (لأنني عندما أتكلم عن الله سأعرفه والمعرفة تعطيني السعادة لأنني سأحبه وسأثق فيه وسأجيد الحديث عنه لأني مش سامع عنه وهذه العلاقة تجعلني استمتع بربنا والاستمتاع به يعطيني الشبع ويجعلني أحبه وأحب الحياة ويجعل الدافع في الحياة كله مبني على الحب و شعاري دائماً فلتكن فيه الحياة).<br />حياتك أحلى مع الله.<br />ظهر سامح مع بدايات الإحياء الديني الإسلامي والمسيحي في السبعينات. وهي المرحلة التي انطلقت فيها الحركة الروحية البروتستانتية عبر المعسكرات والمؤتمرات التي كانت تقيمها الكنيسة الإنجيلية من أجل الشباب في بيت السلام بالعجمي والذي لعب دوراً كبيراً في هذه الصحوة، حيث كان يخ<br />اقرأ بقية التعليق .."
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 93
subject = "الهيافة"
author = "تامر"
posted = "2006-11-08"
text = "الآن فقط عرفت لماذا حدثت تحرشات في الشارع المصري وعلى الملأز ببساطة لأن شباب مصر لا يعرف آداب الاختلاف! أنا إنسان مسيحي تحولت عن المسيحية إلى الإسلام سنة 2001. لم أكن إنجيليا ولكني كنت أرثوذوكسيا. أما عن أوجه التشابه بين الأستاذ/ عمرو خالد وبين جناب القس/ سامح موريس فهو واضح لكل ذي عينين. فما هو الخطأ في محاولة تشغيل الدماغ؟ ما جريمة كاتب المقال التي يستحق الترقية لأجلها؟ ألا نستطيع الاختلاف في أتفه الأمور دون تفاهة وهيافة؟"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

