[[comments]]
order = 7
subject = "اعقل يا عبد الله"
author = "ياسر ابوعمار"
posted = "2006-10-22"
text = "اعقل يا عبد الله يا حبيبى ،ايه اللى انت كاتبه ده،واضح انه مكانش عندك موضوع تكتبه مثلا فرحت جايب الموضوع ده واهو يسد وخلاص ،مش عارف يا طحاوى اقول لك ايه ،مين يا عم الحاج موريس ده ،واحنا مالنا هو بدا فى كنيسة العذرا ولا مش عارف ايه ،احنا مال اللى خلفونا يا حبيب قلبى ،ارجع يا عبده لرشدك ،وفكر فى حاجات مفيدة ،وبطل المشاوير بتاعة التخصص المنيل اللى انت اخترته ده .<br />ياللى اتحرمتم من التعليم الفرصة لسة قدامكم."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 8
subject = "ارجع يا طحاوى"
author = "ياسر ابو عمار"
posted = "2006-10-22"
text = "ارجع يا طحاوى لاهلك وناسك ،متخافش من حاجة ،الفلوس اللى وقعت منك انا هدفعها ،مكانتش 5 جنيه يا سيدى اللى تخليك تهرب من البيت وتكتب الكلمتين دول ،متخافش يا عبده انا ضامن ان محدش يضربك بس لازم يا ابنى ترجع لعقلك ،اللى بتعمله ده مش فى مصلحتك ،وبعدين فين الموضوعات بتاعتى ،فالح تكتب عن الكنيسة وتطنش الشغل بتاعى ,الموضوعات لو منزلتش فى ظرف يومين مش هيحصلك طيب ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 9
subject = "واحد تعبان من الكلام البيضان"
author = "اعذروه يا جماعه هو فاكر انه كده بيتميز ويختلف عن الصحافيين التقليدين وانه جاب التايهه موضوع فذ نادر الوجود ."
posted = "2006-10-22"
text = "كمسلمين نحن نرفض التشبيه بين مسلم ومسيحى وحتى المسيحيين يرفضون ذلك .<br />وبعيد عن شعارات الوحدة الوطنية انا لست متعصب ولكنى بحسابات العقل ما الفائدة لى من هذا الكلام كمسلم ان يطلع شبه بينهم ولا ما يطلعش وبالنسبة للاخوة بتوع انتقدوا الجوانب البنائية والحوار الرصين والمعرفش ايه كفايه انتم يا مثقفين انتقدوا حد حايشكم بس متحجرش على رأى حد انا المقال مش عاجبنى وفيه اجماع على كده فاسكتوا وارحموا نفسكم"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 10
subject = "للأسف"
author = "معاذ محمود عامر"
posted = "2006-10-22"
text = "لا أعرف لماذا أنتم تجلسون أمام الشاشات متحفزين لمهاجمة وتسفيه كل من لا يروق لكم كلامه<br />الأفضل لكم أن تنتقدوا دون سخرية ودون اهانة للكاتب فهذا لا يصح<br />لا أعرف ما الذي يجعل المقال ينال كل هذه السخرية والاهانة والتجريح الأحمق الأرعن<br />وبغض النظر عن كل ده فالأستاذ عبدالله الطحاوي كاتب متمكن وجامد جدا وبصراحة أنا أحب ما يكتبه وأحترمه جدا<br />وان اختلف بعضكم مع بعض ما يكتبه فليحترموا على الأقل حرفيته وتمكنه ومواضيعه الجادة الجديدة الغير تقليدية<br />عذرا بالنيابة عن كل الذين أهانوك"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 11
subject = "تسلم يا عبد الله"
author = "حمدي"
posted = "2006-10-22"
text = "مقال رائع وفي العمق ... وشيء طبيعي ان يثير انتقادات... واحمد ربنا ياعبد الله ام محدش فيهم ذكر لك حديث الرويبضه كنوع من الاسقاط عليك كعادتهم... اصل طلعه موضه اليومين دول عندهم اي حد يختلف معاهم يبقي من الرويبضه<br />وكل عام وانت بتفكر وبتكتب وتمتعنا بمقالاتك"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 12
subject = "طلع المفيد"
author = "BATISTUTA"
posted = "2006-10-22"
text = "معاذ وتابعه حمدى المقال عجبكم هييييييه الف مبروك .<br />يا امور منك له بتتنقدى باسلوبى يعنى انا باسخر من الكاتب تسخر انت منى طب بذمتك ياشيخ اصدقك انا ازاى وعموما الله يرحم مؤسسة كان اسمها الازهر كانت بتطلع شيوخ شوفوا دلوقت بتطلع ايه بتطلع معاذ.<br />بصرف النظر عن تمكن وعمق وارتفاع الموضوع اكيد كل موضوع له مغزى طلعلى هدف المقال معلش استحمل غبائى وخدنى على قد عقلى .<br />بس قبل ما تصد احكامك الاختلاف بينا مش على مقال دا على فكر بمعنى المقال اللى يعجبك مش هيعجبنى الا نادرا يعنى عمرنا ما نتفق مستقبلا. لذا افدنى باهداف المقال بالنسبة للمسلم والمسيحى ."
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 13
subject = "الله يبارك فيك"
author = "حمدي"
posted = "2006-10-22"
text = "الله يبارك فيك يا باتيستوتا ... وعقبالك ان شاء الله لما تعرف ان ربنا منحنا عقلنا علشان نفكر بيه ..اما بالنسبه ااني تابع لمعاذ زي ما حضرتك اتهمتني فهذه تهمه لا انكرها وشرف لا ادعيه .... وعلي الاقل هو بيستخدم عقله وليس مثل الاخرين الذين يسقطون عقدهم النفسيه علي الناس متصورين انهم هيئة الامر بالمعروف والنهي عن المنكر في عشرينات<br />وسلاما"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 14
subject = "ربنا يشفي فعلا"
author = "لازم تتشتم يا عبد الله ول ما تشتمتش لازم تزعل بجد والله"
posted = "2006-10-22"
text = "الحكاية ببساطة أننا مجتمع يعادي التفكير لأقصى درجة وبيعتبره خطر<br />فلما تنزل انت وتفكر وتحلل وتعمل شغل ييجي واحد يقول انا كمسلم- واخد بالك- ايه يعود عليا من الموضوع ده<br />ده نقول له ايه؟<br />وآيات القرآن بتاعت التفكر والتدبر يا كمسلم؟<br />والباشا التاني اللي قاعد ع الكنبة أو المصطبة وبيقولك ربنا يشفيك<br />تخلف مركب مع جهل وإصرار بالغ عليه<br />غباء بامتياز ومتعوب عليه كمان<br />اتشتم وكمل كتابة<br />وفكر وحلل وقول رأيك للجهلة يمكن يفوقوا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

[[comments]]
order = 15
subject = "مش لاقي عنوان"
author = "معاذ"
posted = "2006-10-22"
text = "يا أستاذ حمدي لا تتعب نفسك بالرد عليهم فانهم مهما فعلت ومهما قلت لن يحترموا حتى ما تقوله لأنهم يضعون تحت فراش كل واحد منهم خزانة يظنون أن بها كل الحقائق والبداهات ولا مجال للخلاف معهم ولا لمناقشتهم<br />ان النقاش والجدل يكون مع من يحترم هاتين القيمتين العظيمتين أما الذي لا يحترمهما فلا يستحق أن تجهد عقلك وأعصابك معه وليس في ذلك اي مخالفة لآداب النقاش والجدال ولا المنطقية والعقلانية<br />لأنه ببساطة \"من لا يحب طعاما لا يستحق أن يتذوقه\"<br />وبعدين في نقطة مهمة جدا أنا لا أرقى أن أكون حتى تابعا لك فأنت أستاذ وأنا ما زلت في طور التكوين ولم أنس ذلك لحظة"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106062141/http://masr.20at.com:80/article.php?sid=1079"

