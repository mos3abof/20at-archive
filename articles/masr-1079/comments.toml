subject = "كـــــــــما تــــــــــحـــــب أن تكون"
author = "AMX"
posted = "2006-11-09"
text = "إننا إن نظرنا إلى موريس فهو في الواقع غير متدين بالحد الكافي فضلا عن عدم تعلمه على يد من لهم مصداقية قداسية حقيقية<br />أما عند المسلمين فأعلم أن عمر خالد ليس بالرجل الذي تؤخذ من العلوم الدينية ولكنه مجرد مذكر فقط وإن كان الكثير منهم قد بدأوا يستمعون لمحمد حسين يعقوب<br />وبالتحديد سلسلة أشرطة أصول الإلتزام<br />وشرائط القلوب . فقد استمعت لكثير منها<br />ووجدت أنه لو كان نصرانيا لجمع الأمة المسيحية تحت يده.<br />كما أن له أسلوبا وعظيا رهيبا مثل قول<br />\"قلبك فين\" \" إنتا مع ربنا ولا مع حد تاني\"<br />فهو أحد عمالقة مصر وسبب في رجوع الشباب للدين بشدة أما هنا وقريبا من الكنيسة صعب تلاقي حد يشدك بسهولة وعموما نتمنى الخير لنا وللمسممين"
archived = "2006-11-28"
capture_url = "https://web.archive.org/web/20061128214011/http://masr.20at.com:80/article.php?sid=1079"

