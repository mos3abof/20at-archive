posted = "2006-11-22"
text = "بسم الله والصلاة والسلام على رسول الله<br />انا شايف ان الكاتب بيتكلم من منظور ان الاتنين فى وجه تشابه فى الشخصية وبس والرجال مقلش مين احسن او اسواء يعنى كلام موضوعى مش كلام تقييم انا احترم رايه راى من لا يعجبه الموضوع<br />وشكرا على انى عرفت معلومة مكنتش عارفها قبل كده."
