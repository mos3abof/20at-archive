[[comments]]
order = 0
subject = "على كيفك"
author = "محمود صادق"
posted = "2005-12-06"
text = "لسلام عليكم ورحمة الله وبركاته<br />ايه يا ده يا عشرينات اخيرارجعتم بصفحتكم المميزة وكتاباتكم الرائعة<br />الوضع تما م عندنا، بس ارجو الا يكون هناك اي تعطيل تاني، مبروك يا دغلس ، اكتب تاني عن ريحة فلسطيني الابية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114228/http://www.20at.com/article2.php?sid=4"

[[comments]]
order = 1
subject = "جوعتوني!"
author = "واحد معدي"
posted = "2005-12-08"
text = "جوعتيني يا جماعة أكتر ما انا جعان<br />استمروا في مواضيعكم الحلوة ، بس من غير ما تجوعونا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114228/http://www.20at.com/article2.php?sid=4"

[[comments]]
order = 2
subject = "الطابون رائع"
author = "محمد ياسين"
posted = "2006-06-19"
text = "ازكى اشي الخبز اللي على الطابون وبدون اي نقاش<br />تذوقوه مرة مش حتنسوا الطعم بالمرة<br />مشكووووور على الطابون<br />على فكرة كتبت الرد وانا جيعان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114228/http://www.20at.com/article2.php?sid=4"

[[comments]]
order = 3
subject = "ولا يعلى على خبز الطابون"
author = "محمد عمرو"
posted = "2006-07-17"
text = "لقد قرات موضوعك الرائع و انا أشتم رأحة طابوننا الذي أعتبره أهم من الماء وشكرا لك على هذا المضع الذي حرك مشاعري و لكن لم أجوع لأن رغيف خبز الطابون تقاسمته أنا و أخي قبل قليل ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102114228/http://www.20at.com/article2.php?sid=4"

[[comments]]
