text = "اهو كلام فعلا … انتشرت اوي الكتب دي في الفترة الاخيرة .. والصراحة اني بعد ما بقرأها بحس اني مستفدتش اي حاجة ..<br />اي كتاب تلاقي مكتوب عليه اسم مصر واي تريقة جنبه ويبيع شوية وخلاص<br />مفيش غير كتاب احمد العسيلي الجديد اللي يعتبر فيه خروج عن النمط اللي كلهم اتبعوه بعد عمر طاهر الللي محدش عرف يعمل زيه …"
