text = "طبعا المانيا خلصت الماتش فى الفورتى فورتى مع ان السويد حاولت فعلا<br />علشان كدا كان الممتع ماتش المكسيك و الارجنتين و اللى خيب ظننا لان الكل كان متوقع فوز مبكر للارجنتين و لكن الماتش كان حلو فيما عدا المعلق اللى صدعنااااا بارجنتينا و ارخنتينا و باموس ايه باموس دى و طبعا الحكم اللى كان فرحانبالكروت الصفرا و ان شاء الله الحكام هيجيبو ضرف المونديال بعمايلهم دى و اخرها عدم احتساب جول الارجنتيت امبارح<br />يا رب ريحنا من المعلقين و الحكام"
