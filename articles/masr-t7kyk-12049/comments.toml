[[comments]]
order = 7
subject = ""
author = "البطاطا الصينى"
posted = "2009-05-28"
text = "عارفين ازاى البطاطا بتنشوى عند بياع البطاطا - بياع البطاطا عندة فرن بيولع فية فحم لما يسخن قوى وبعدين يحط كوز البطاطا داخل الفرن<br />احيانا بيبقى الفرن حامى قوى وبيحرق زر البطاطا فى الحال ويشعوطة واحيانا الفرن بيبقى مولع نار انما مش حامى قوى ودى البطاطا بتغيب شوية لما تستوى انما الفرن لما يبقى بارد زر البطاطا لما يدخل بيقعد ساعة على ما يستوى وتحس ان طعم البطاطا زى الزفت رغم جمال الفرن<br />والنسوان مش بالطول والعرض ولا البياض ولا السمار - ابدا - ولا حتى بخفة الدم<br />وانا اعرف ان الفرن الصينى لا يعلوا علية بيشعوط البطاطا ويخللى صاحب البطاطا يتنطط طول الليل<br />على بركة اللة هاتوا صينيات"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621012757/http://www.20at.com:80/masr/t7kyk/12049-2009-05-12-11-26-53.html"

[[comments]]
