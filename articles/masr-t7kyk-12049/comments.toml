author = "جلد الثعابين"
posted = "2009-05-30"
text = "حينما تتحسس جسد الفتاة الصينية تجد انة املس ناعم ذو ملمس خاص كانك تلمس ثعبان مثلا<br />ورائحة العرق لديهم غريبة وكريهة<br />ورغم ضئالة حجمها بتضرب بونيات فى الاسنان جامدة اذا لزم الامر<br />لا تصلح زوجة اطلاقا لانها تعاشر من تستلطفة رغم انف زوجها فدينهم وعادتهم تسمح بالزنى للمتعة ولا يوجد اى حرام او حلال عندهم"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621012757/http://www.20at.com:80/masr/t7kyk/12049-2009-05-12-11-26-53.html"

[[comments]]
order = 10
subject = ""
author = "غير محصن"
posted = "2009-05-31"
text = "سيدنا ابراهيم تزوج مصرية اسمها هاجر<br />وسيدنا محمد تزوج ماريا القبطية<br />وسيدنا يوسف تزوج امرأة العزيز بعد موتة وهى مصرية<br />وقال بعض الحكماء وعلى ما اظن الشافعى ان من لم يتزوج مصرية فهو غير محصن<br />بمعنى ان من يتزوج المصرية يشبع كل رغباتة ولا يصبح لة فى النساء رغبة بعدها ولا ينظر الى اى امرأة غيرها ولا تزوغ عينة فهو اصبح محصن<br />من لم يتزوج بمصرية فهو غير محصن ولم يشبع من النساء<br />او ربما تفسير هذا الكلام ان المصرية هتنسية اسمة واسم ابوة وهتطلع النجوم فى عينية فى عز الظهر وهتخللى عيشتة سواد لو بص لواحدة غيرها<br />تقوموا تسيبوا المرأة المصرية دى وتدوروا على الصينية<br />انتم اتهبلتم<br />فية احلى من البلدى وطعم البلدى والبنت المدملجة الملفوفة<br />فية احلى من السيقان المصرية الملفوفة اللى غنت لها المطربة وقالت العتبة قزاز والسلم نايلون فى نايلون<br />طبعا السلم نايلون فى نايلون اللى هو السيقان وبعدها العتبة<br />فية احد يسيب كل دة ويروح لشوية عظم صينى<br />عجبى<br />بنت مصرية من بولاق"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621012757/http://www.20at.com:80/masr/t7kyk/12049-2009-05-12-11-26-53.html"

