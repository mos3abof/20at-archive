text = "بالعند فيكي يا بولاقيه الصينيه زي الفل ومؤدبه ولسانها نظيف مش رغايه ولسانها زفر زي بنات مصر كمانمطيعه ومش ها تخلع جوزها لما تلاقي الي اللي اغني منه طمعا في فلوسه ولا لما يزرجن ممكن تعبيه في كام كيس بعد ما تقطعه وتشفيه يا مفتريات يا بنات مصر وطالعين فيها علي ايه ما اعرفش ربنا ياخدكم .."
