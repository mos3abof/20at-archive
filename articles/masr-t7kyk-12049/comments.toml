posted = "2009-06-07"
text = "عجبتنى الفكرة جدا<br />قابلت فى الشارع بنت بياعة متجولة صينية فى شوارع الزقازيق وعرضت عليها الزواج<br />هى بتتكلم عربى م[ *** ]ر وكلمات للشغل فكلمتها انجليزى وقلت لها عايز اتجوزك<br />قالت جواز يعنى اية<br />هى مستعدة تعيش فى شقة معايا وتخرج الصبح تبيع البضاعة الصينى وترجع اخر النهار ونعيش زى الازواج عادى جدا ولكنها تطلب اجر يومى 100 جنية وتكون الشقة خاصة بها فقط وليس سكن مع اى احد<br />يعنى زوجة مكلفة جدا اغلى من اى زوجة مصرية"
