posted = "2009-05-29"
text = "بقى فى ذمتكم البلد فيها اربعة ملايين عانس وتخطوا سن الزواج ومحتاجين الستر وبتتكلموا عن فتيات الصين<br />يا اخويا انت وهو - جحا اولى بلحم ثورة<br />ما هو احنا قدامكم وزى الفل ومتعلمين وجامعيات ولنا احلام وعندنا شعور الامومة وبتدوروا على فتيات من برة<br />انطسيطوا فى نظركم<br />عندكم عمى الوان<br />جتكم القرف"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621012757/http://www.20at.com:80/masr/t7kyk/12049-2009-05-12-11-26-53.html"

[[comments]]
