text = "دى فكره مجنونه البنات دلوقتى بتعنز فى بيوتها والاهل مش فارقه معاهمالفلوس والمديات بصراحه مش كلهم<br />وهنروح بعيد ليه الفلاحين زى القمر وهتفهم لغتهم والعمليه مش هتكلفك كتير<br />الصنين مش فالحين غيرفى التصدير وحاجتهم زى وشهم<br />كمان هيصدروا عوسه هو ده الى ناقص<br />انا برفض الفكره رفض نهائى شوفوا بنات بلدكم بعدين دوروا على الغرب"
