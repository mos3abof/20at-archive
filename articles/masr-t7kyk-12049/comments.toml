text = "اولا احب رد علي الاخت صاحبة التعليق رقم 11<br />وهاقولها بكل بساطه انتوا الي عملتوا كده لان كل واحده فيكم بتقول انا عايزه وعايزه وعايزه ويسلام بقه لو ام العروسه المبجله يكون ليها كلمه مسموعه في البيت<br />بتحسسك ان بنتها السفيره عزيزه وتقعد توجع دماغ اهلك.<br />مالها الصينيه زي الفل<br />وعلي الاقل بيحافظوا علي جسمهم بعد الجواز مش زي معظم المصريات بعد الجواز تاكل وتقعد لحد ما حسمها يضرب من كل حته.<br />وحاجه تانيه<br />الاكل الصيني صحي جدا انا فعلا جربته اكتر من مره<br />بس انا عايز اسال سوال مهم<br />هل ممكن تبقي الزوجه الثانيه ولا لا<br />والله تبقي حاجه جامده موووووووووووت"
