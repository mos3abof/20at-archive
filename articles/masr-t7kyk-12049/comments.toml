author = "osman"
posted = "2009-05-23"
text = "انا شفت فى دبى واحد صعيدى مصرى سواق نقل ثقيل متزوج من واحدة صينية بتشتغل بياعة فى سوبر ماركت<br />وطبعا زواج غربة وتسلية وقضاء حاجتة الجنسية<br />وللاسف حملت من اخونا الصعيدى والدكاترة قالوا - لازم الجنين يخرج بعملية قيصرية لان حوض الست الصينية ضيق واكتاف الجنين المصرى الصعيدى عريضة ولا يمكن ان يخرج بولادة طبيعية ولا بد من عملية قيصرية<br />وطبعا الزوجة الصينية بتاكل عينات بمعنى انة فى الفطار بتسلق بيضة واحدة وتقسمها نصفين وتعمل سندوتشين واحد لها والتانى للزوج مع كباية شاى<br />وطبعا هناك فرق اللغة والثقافة والتعبير عن العواطف صعب<br />يعنى تقدر تقول جواز من اجل الجنس فقط وليس لتكوين اسرة فيها رحمة ومودة"
archived = "2009-05-24"
capture_url = "https://web.archive.org/web/20090524041929/http://www.20at.com:80/t7kyk/12049-2009-05-12-11-26-53.html"

[[comments]]
order = 5
subject = ""
author = "احمد رضا"
posted = "2009-05-24"
text = "بمناسبة البيض واكل البيض فقد عزمنى زميل صينى على الغداء<br />قال انة سيطعمنى وجبة شهية جدا<br />وذهبت الى بيتة<br />كان الطعام عبارة عن بيضتين وصلوا من الصين حديثا مع رفيق لة<br />انهم يتركون البيض تحت حضانة الفرخة حتى يتكون الكتكوت داخل البيضة وقبل ان يفقس ويخرج من البيضة بايام يأخذون البيضة للاكل<br />وحينما فتح البيضة امامى واخرج الكتكوت الشهى من داخلها اخرجت كل ما فى بطنى وهربت<br />يشاركهم فى هذة العادة القذرة الفلبينيون سكان الفلبين<br />اما الكوريين فاساتذة فى اكل لحم الكلاب<br />وحينما يسند الى شركة كورية تنفيذ اعمال فى منطقة فى الخليج فان الكلاب الضالة سرعان ماتختفى الى فخذ وقطع على ارفف ثلاجات الكوريين"
archived = "2009-06-21"
capture_url = "https://web.archive.org/web/20090621012757/http://www.20at.com:80/masr/t7kyk/12049-2009-05-12-11-26-53.html"

