text = "اقتباس sara:<br />انا بقي شايفه ان زواج الشباب المصريين من الصينيات مش هيخلي نسبه العنوسه تزيد ولا حاجه<br />وده لان مش السبب في العنوسه هي تكاليف الزواج وبس لاااااااااااا<br />وده لان ماعدش في شباب نقدر نعتمد عليهم ورجاله بجد ويقدروا يتحملوا المسؤليه بجد<br />علي راي ناس… الرجاله ماتو في الحرب فسواء راحوا اتجوزوا من صينات او من فلبينيات هما اصلا مش هيخسرونا كتير<br />طظ فيهم<br />ما فيش اى راجل رد على ااخت سارااااااااااا ليه دا بتقول مافيش رجاله<br />لا الرجااااااااااا اااااااااله موجودين باذن الله بس هم مسجونيين من ايام الحرب و ادعبلهم يفك سجنهم"
