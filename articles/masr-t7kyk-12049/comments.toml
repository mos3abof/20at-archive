author = "تامر"
posted = "2009-05-12"
text = "االفكرة منتشرة فى الخليج فى الزواج من فلبينيات واندونسيات والبنات من شرق اسيا عموما لاسباب سنشرحها اما الصينيات فمستحيل الزواج منهم لانهم عملة نادرة فى بلادهم فقانون الانجاب فى الصين يصر ان انجاب مولود واحد وعدد البنات يقل كثيرا عن الصبيان يعنى كل ثلاث شباب من الصين يتصلرعون على فتاة واحدة<br />اما ميزة الزواج من بنات شرق اسيا حسب المفهوم الخليجى فهى ضيقة ومثيرة جنسيا<br />فهمت حاجة"
archived = "2009-05-14"
capture_url = "https://web.archive.org/web/20090514135041/http://www.20at.com:80/t7kyk/12049-2009-05-12-11-26-53.html"

[[comments]]
