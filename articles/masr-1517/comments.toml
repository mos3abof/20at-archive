subject = "الفكره حلو وجديدة"
author = "شريف الدواخلى"
posted = "2007-01-30"
text = "اممممم ... خيالك فى اللقطه بتاعت ازاى الاساتذه بيقضوا اجازتهم كان جامح قوى و حلو ما شاء الله .. وخصوصا انك نوعتى كذا كلية ... بس كل ده كوم وكون انك بطلتى قال احمد واوضحت منى ده كوم تانى .. وعشان مش عملتى كده الموضوع طلع حلو كده .. ربنا يوفق"
archived = "2007-02-02"
