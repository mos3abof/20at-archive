subject = "ايام صعبة"
author = "فعلا اصعب ايام على دكتور الجامعة هى ايام التصحيح لأنها عملية مرهقة جدا ودقيقة جدا."
posted = "2007-01-30"
text = "انا دكتور فى كلية الهندسة صدقونى انا محبوس فى البيت من 3 ايام لا صوت يعلوا على صوت القلم الأحمر.<br />تحياتى موضوع جديد لم اتصور ان يتكلم عنة احد."
