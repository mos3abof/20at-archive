[[comments]]
order = 1
subject = "عن شريف الدواخلى"
author = "اية القرف دة - كتاب اخر زمن - ودا مقال والا نعى فى الاهرام - الافكار سايحة وغير مترابطة وكل فقرة فى المقالة بتتكلم عن حاجة تانية خالص يعنى سمك لبن تمر هندى"
posted = "2007-01-30"
text = "الكتابة دى ما يكتبهاش الا واحد صبى سباك او واحد من بتوع اليومية اللى بيسرحوا بالجرايد<br />حد يقول ان الافكار الر اسية فى المقال تتقاطع مع الافكار الافقية لينشأ ديمواجية عبثية غير ملتزمة بالافكار السيبوية المتخندقة فى خيشوم التعبير الاعلامى"
archived = "2007-02-02"
capture_url = "https://web.archive.org/web/20070202031729/http://masr.20at.com:80/article.php?sid=1517"

