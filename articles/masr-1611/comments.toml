[[comments]]
order = 2
subject = "الى كل من سبقني"
author = "انا من البلد دي"
posted = "2007-02-19"
text = "الأخوة اللى فوق اللى قال ان الموضوع ميستاهلش .. واللى نعت الكاتب بأنه \"زريف\".. واللى قال يخلو الموقع اسمه \"ولاد الزرف\"..<br />مصر مش كلها مبارك وجمال وتوريث ولجني سياسات وتزوير انتخابات واخوان اعتقلو واخوان افرج عنهم..<br />مصر فيها حاجات كثير حلوة.. حاجات تخلي قلبك يتنفض لما تفنكرها.. تمشية علي كورنيش النيل .. قعدة علي البحر في اسكندرية..<br />بنات وولاد بيجبو بعض.. اطفال بيلعبو حجلة.. واستغماية.. وحتى عريس وعروسة..<br />الزرافة اللى ماتت ومش عاجبك الموضوع عنها كلن ليها ذكرى حلوة في قلب ناس كثير أوي كان أطفال .. واعتقد انك هتستعجب لو عرفت في كام واحد لسه بيبتسم لما يشوف صورته وهو صغير مع الزرافة<br />مع كل احترامي"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025125/http://masr.20at.com:80/article.php?sid=1611"

[[comments]]
order = 3
subject = "وعجبى"
author = "10 مليون مصرى عندهم الكبد بى وسى وبيموتوا كل يوم"
posted = "2007-02-19"
text = "نبكى على الانسان والا<br />نبكى على الحيوان<br />يمكن الزرافة كان فية اللى بيهتم بها ويديها الدواء<br />ولكن ملايين الغلابة اللى مش لاقيين الدواء يعملوا اية غير الموت فى صمت<br />اعظم حاجة مؤلمة للنفس انك تبقى مريض ومحتاج الدواء ومش قادر<br />ماتت زرافة ومات الف انسان<br />رخيص قوى ياانسان فى بلدنا<br />وبتموت ببلاش<br />وربنا يرحم الجميع"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025125/http://masr.20at.com:80/article.php?sid=1611"

