[[comments]]
order = 13
subject = "اسلوب موفق:)"
author = "المجاهدة"
posted = "2007-02-19"
text = "اسلوب حضرتك المرة دي بجد رائع.. حاسه فيه بتحسن و تقدم شديد.. الاسلوب جميل و لذيذ و يشد القارئ انه يقراها للنهاية..<br />اما بالمنسبة للموضوع نفسه.. اتفق مع اختنا ان الكاتب الشاطر يكتب في كل حاجة.. و حضرتك ليك كتابات في كذا موضوع اخر و كذا حدث اخر.. ان حضرتك تكتب عن حاجة شايفها البعض \"تافهة\" ده لا يقلل ابداً من قيمة حضرتك ككاتب..<br />بالنسبة للاخوة المعترضين.. فيه نوعين من النقد.. نقد يخلي الي قدامك يسمعه للاخر (حتى و ان كان نقد شديد) و نقد يخلي الي قدامك مش عاوز يسمع اي حاجة ولا يعرف اي حاجة جاية منك ، لغلظة اسلوبها (حتى و إن كان عندك حق)<br />هدانا الله و إياكم للتعاملات الصحيحة السليمة..<br />و ادعو لك اخر الكريم بمزيد من التفوق و التميز:)"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025125/http://masr.20at.com:80/article.php?sid=1611"

[[comments]]
order = 14
subject = "مقالة طريفة"
author = "اعماق السكون"
posted = "2007-02-20"
text = "انا شايفاها مقالة طريفة جدا وزي ما قال اخ لينا ممكن ناخدها قصة رمزية على شعب مصر اللي بموت من غير ماحد يحس بيه<br />او حتى الشعوب العربية كلها !!<br />الزرافة دي كانت رمز لاطفال كتير ماتت ومكانها اتاخد من غير ولا همسة<br />والادهى من كدة ان العمال يتذمرون من الاجابة على اسئلتنا يعني ماتت وماتسألوش ازاي وخلاص !!!<br />الله يكرمك يا اخ محمد اسلوبك جميل :)"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025125/http://masr.20at.com:80/article.php?sid=1611"

[[comments]]
order = 15
subject = "استغربت"
author = "شاب اخوان"
posted = "2007-02-20"
text = "انا استغربت جدا من الموضوع ومن افراد ليه صفحة ومقالة ...........<br />ولكن<br />لما قريته قلت لحد امتة مش هنفضل نقرا الا عن الاعتقالات والعبارات واكياس الدم<br />نخفف شوية ونقرة عن الزرافة لان فعلا انا حاسس انها قيمة كبيرة جدا في حديقة من اقدم حدائق العالم وكانت تعد من افضل حدائق الحيوانات في العالم<br />وبجد لازم نحزن على وصول الحديقة لهذا المستوى من الاهمال وعدم الاستطاعة على شراء زرافة جدية<br />وبجد كنت بحب اروح اتفرج ليها اوي"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025125/http://masr.20at.com:80/article.php?sid=1611"

[[comments]]
order = 16
subject = "الهندي"
author = "مش قادر"
posted = "2007-02-20"
text = "مش قادر هموت من كتر الضحك<br />الزرافة ماتت<br />ازي<br />المشكله مش في ان الظرافه ماتت ولا عايشة بس هما له خلو النعامة بدل من الزرافة<br />النعامه الي بتحط راسها في الارض بدل \\<br />من الظرافه الي راسها<br />مرفوعه<br />والموضوع مش منقول ولا حاجة<br />لان موضوع الدستور كان موضوع تاني غير ده<br />وتجربه صحفيه ظريفة يا استاذ محمد"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025125/http://masr.20at.com:80/article.php?sid=1611"

[[comments]]
order = 17
subject = "الشعب المصرى"
author = "ناس استهجنوا قوى الكلام عن زرافة وقعدوا يحطوا كل مصايب الدنيا قدام عينينا شريط يفكرنا بالكوارث وبالاخرة كمان وناس قعدت تدور على الرمز من ورا القصة وواحد قال ان الزرافة مرفوعة الراس كناية عن الشعب المصرى"
posted = "2007-02-20"
text = "الكل مش مصدق ان الدنيا فيها حاجة تانية غير مصايب الشعب المصرى<br />انتوا عارفين ان نص شعوب الكرة الارضية ميعرفوش فين مصر دى اصلا<br />رفقا بنفسكم الحياة حلوة؟"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025125/http://masr.20at.com:80/article.php?sid=1611"

