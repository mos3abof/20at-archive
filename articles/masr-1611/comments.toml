[[comments]]
order = 5
subject = "قصة موت الزرافة هي قصة كل مصري"
author = "واحد مصري"
posted = "2007-02-19"
text = "في كام مصري بيموت في صمت وتنتهي حياتة من غير ما نحس بيه زي الزرافة<br />بلاش مصري في كام بني ادم بيموت وميكنش حد موجود يقف جمب اههلة او يكونه لحد ياخد العزا فيه زي الزرافة<br />كام مرة سمعنا خبر موت حد وعدي علنا زي ما بيعدي خبر موت زرافة<br />في حيتنا كام واحد ممات ونسينها بعد موته ونسينا البسة اللي قدمها لينا وبقيت كلمة دا مات لو حد سالنا عنه<br />مشهد موت واحد وبمجرد موته وقبل ما يدفن يكون كلة بيدور از يورثة وهيستفيد ازاي من موته وازاي هحط ايدي علي شقتة وازي همسك مكانة في الشغل وازي هشارك ولادة في المعاش<br />زي ما حصل في بيت الزرافة<br />سعات بيكون في شخص طول عمرة في مكانتة ومركزة راسة مرفوعه لفوق زي الزرافة ولما يموت يجبوا حد تاني مكانة يحب الانبطاح ويدفن راسة في اطين زي النعامة<br />يعني قصة موت الزرافة بتمثل حقائق كتيير في حيتنا احنا البني ادمين"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025125/http://masr.20at.com:80/article.php?sid=1611"

[[comments]]
order = 6
subject = "البقاء لله"
author = "نيفين نيفى نوفا"
posted = "2007-02-19"
text = "على فكره يا محمد عبد العاطى مش قصدى من اعنوان اتعليق لنى اسخر لان فعلا موضوعك حلو<br />و انا مع روضه ..ازيك يا روضه وحشتينى<br />انا مع روضه ان مفيش اجه اسمها الموضوع هايف<br />الكاتب الشاطر يكتب ف اى حاجه<br />مثلا انا درست قصيده لشاعر انجليزى اسمها the flee يعنى البرغوت<br />المهم موضوع الزرافه جه قبل كدا ف القاهره اليوم<br />و الدليل ان الموضوع يستحق الكلام ان بلد عريقه زى مصر معهاش فلوس تشترى زافه بدل اللى ماتت<br />و جه واحد مسئول محترم قال انهم عايزين يعقدو لجان علشان يعملو ميزانيه لشراء زرافه جديده<br />دا غير ان فعلا كام واحد يحب يشوف صوره ليه مع زرافه و هو طفل و دى حاجه تتعلق بالمشاعر يعنى مش حاجه هايفه<br />ها يبقى الموضوع هايف"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025125/http://masr.20at.com:80/article.php?sid=1611"

[[comments]]
order = 7
subject = "كنت بحب الزرافة"
author = "مهتمه"
posted = "2007-02-19"
text = "كنت بحب الزرافة بجد, وزعلت اما قريت الموضوع عشان ما كنتش اعرف انها ماتت.<br />الانسان اللي بيلفت نظرة حاجة مش بتلفت نظر اغلب الناس هوانسان حساس .<br />تحياتي لكاتب الموضوع وتمنياتي بمزيد من التوفيق، ووالله عجبني الموضوع ولو الناس المعترضة شايفاه تافه كملوه للآخر ليه؟ وكمان كلفوا نفسهم انهم يردوا عليه<br />يبقى الموضوع اثر فيهم واستفزهم انه يردوا عليه"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025125/http://masr.20at.com:80/article.php?sid=1611"

[[comments]]
order = 8
subject = "رفقا يا جماعه"
author = "منى"
posted = "2007-02-19"
text = "السلام عليكم..<br />انا مش شايفه سبب لكل الهجوم ده على الكاتب لانه من الاخر انا شايفاه متفق عليه من كذا حد ممكن اللى مش عاجبه الموضوع يعلق بهدوء بدون تجريح فى حدانما الاسلوب اللى انتوا علقتوا بيه ده غير لائق بشباب مثقفين كبار"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025125/http://masr.20at.com:80/article.php?sid=1611"

[[comments]]
order = 9
subject = "الموضوع هجوم على أى موضوع فى الموقع"
author = "محمود"
posted = "2007-02-19"
text = "فى ناس بتحب تهاجم و تنقد و تبهدل عمال على بطال بدون موضوعية أو تفكير هو عبارة عن ماكينة نقد و تقطيع بسبب و بدون<br />عادى إيه يعنى لما يكون فى مواضيع ترفيهية أو أخبار خفيفة أو حاجات متنوعة<br />ماحدش ينسى إن معظم رواد الموقع عايشين الواقع المؤلم و طلعان عينهم (نفسيا أو ماديا) أو كلااهما من الحياة فى مصر فمن الطبيعى بل من الجيد أن يكتب موضوعات تتكلم عن أشياء من الزمن الجميل زمن كلنا نتمنى أن نعود له و نتخلص من هذا العصر المباركلى الذى أزكم أنوف الجميع و أفسد عقول الكثير و قضى على مستقبل و حاضر الكثيربن من أبناء مصر و الوطن العربى"
archived = "2007-02-21"
capture_url = "https://web.archive.org/web/20070221025125/http://masr.20at.com:80/article.php?sid=1611"

