text = "و الله مش عارف اللي كاتبه المقال ده عايزه تقول ايه بالظبط<br />عايزه تقول ان شباب مصر اللي بيروحوا سينما جاهل و امي ( مش امي انا طبعا )<br />و لا عايزه تقول ان السينما جاهله و اميه ( مش اميه بن خلف طبعا )<br />و لا عايزه تقول ان السينما ما بيروحهاش غير الوحشين و اللي بيلعبوا في التراب<br />يا جماعة كفايه تسطيح بقى و اتكلموا بجد و بجرأه<br />و بلاش السم اللي في العسل ده"
