[[comments]]
order = 5
subject = "وجهة نظر الغرض منها انى اقولك انتا عندك احسن عاوزينه يخرج !!!"
author = "شريف الدواخلى"
posted = "2007-02-01"
text = "لا اله الا الله ... ايه يا استاذ هندى الكلام ده .. انا لو قلت الكلام ده عليك ان كلامى بيوجع بطنك وربنا ما يحرمك من الحالة اللى انتا فيها ديه يبقى انا لا استحق انا اعمل فى الصحافة لانى افتقد لابسط معانى الزماله مع شركاء المهنة الواحده واجع كده للكلام هتلاقى ان الكلام على اللى مكتبش اسمه .. وبعد ما رديت على سذاجته بالاسلوب اللى يناسبه<br />قولت المهم \" اللى هو موضوعك انتا \" يبقى انتا ايه علاقتك بالكلمتين اللى فى الاول ..<br />وعلى العموم الف شكر على ادبك و عاوز اوضحلك حاجة \" مش معنى انى بقول ان الموضوع مش حلو .. يبقى خلاص لان رأيى مش الاهى بس هى وجهة نظر الغرض منها انى اقولك انتا عندك احسن عاوزينه يخرج .. بس يا سيدى والله عليم بالنيات وانتا عارف انى شكرت فى موضوعك بتاع مظاهره الغد لا كان حلو جدا .. وعلى العموم ابقى انتقدنى زى ما انتا عاوز وهاتشوف انى مش هازعل وهاتحترم رأيك وهارد عليه كمان ... يارب الصورة تكون وضحت !!"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203050758/http://masr.20at.com:80/article.php?sid=1528"

