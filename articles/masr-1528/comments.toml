subject = "مبروك"
author = "مبروك"
posted = "2007-02-01"
text = "الموقع في تقدم والموضوع لايت قوي اكثر من الازم<br />لكن انا شايف فية احوال المجتمع من حوالينا الناس الي معهاش فلوس والناس الي كل همها الفسح والفسيخ في المعرض<br />والناس الي مخنوقة من حيتها<br />والناس الي كل حياتها سياسة<br />والعامل الي بيشتغل وخايف يتحسد والواد الصغير الي فاكر نفسة كبير والاب التعبان في الشغل<br />يعني موضوع يبدوا انة عادي لكن شايف انة بيناقش مشكلات بلد في حاجة عادية زي الطفطف"
archived = "2007-02-03"
