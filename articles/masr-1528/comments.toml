text = "عفوا بس انا قرات الموضوع كلو وحاولت استنتج هو ايه الطفطف ومقدرتش ... لو رجعت لاول المقال حتلاقي تعريف مش محدد للطفطف<br />انامش مصرية فبالتالي في اشيا ممكن ما اكون مش شيفاها او الها عندنا اسم تاني<br />يعني لوجيت حكيتلك انو (الششوة) لسة بتستعملها ستي وطعم اللبن فيها بجنن.. حتقدر تفهم هيا ايه؟.. و حتكون غلطان لو تسالت انا بتكلم عن ايه؟<br />و على اي حال تشكر و مش عايزة اعرف هوايه"
