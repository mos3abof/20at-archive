[[comments]]
order = 7
subject = "مطبخ شريف الدواخلي/متبل الكوسا"
author = "متبل الكوسا"
posted = "2007-02-01"
text = "المقادير:<br />أربع حبة كوسا متوسطة الحجم<br />علبة زبادي<br />ملعقة كبيرة طحينية<br />ملعقة صغيرة ملح<br />عصير ليمون (ليمونة واحدة)<br />نصف فص ثوم مدقوق<br />الطريقة:<br />- قطعي الكوسا الى دوائر , اقليها الى أن يصبح لونها ذهبي .<br />- اطحني الكوسا مع جميع المقادير في الخلاط الكهربائي لمدة دقيقة واحدة .<br />- رتبيه في صحن التقديم و زيني الطبق بزيت الزيتون و البقدونس المفروم و قدميه .<br />\" أفكار الشيف \"<br />- لصنع متبل الكوسا بطريقة ثانية :<br />- اسلقي الكوسا ثم اهرسيه مع الثوم و الملح .<br />- اضيفي الطحينة و القليل من اللبن الزبادي و القليل من عصير الليمون و قلبي .<br />- رتبيه في صحن التقديم و رشي عليه زيت الزيتون و القليل من الكمون و الفليفلة الحمراء البودرة و قدميه ."
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203050758/http://masr.20at.com:80/article.php?sid=1528"

