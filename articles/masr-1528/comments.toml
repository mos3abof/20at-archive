[[comments]]
order = 13
subject = "لا للفقر ..لا للبطالة.. لا لقانون الوظيفة العامة الجديد"
author = "بعض من بنود ما ينص عليه قانون الوظيفة العامة الجديد"
posted = "2007-02-01"
text = "1) الغاء فكرة التعيين نهائيا واقرار مبدأ التعاقد فقط وهو الوسيلة الوحيدة للتوظيف.<br />2) العقد يحرر كل خمس سنوات وفي نهاية مدة العقد (يعمل كشف حساب) يعني يجدد له العقد ام لا.<br />3) توسيع سلطة الجهة الادارية في التحقيق والفصل من العمل (يعني التحقيق في نفس مكان العمل) وتلغي فكرة التحقيق مع الموظف في النيابة الادارية (الجهة المحايدة والمختصة قانونا في التحقيق مع الموظفين طبقا للقانون الحالي لسنة 1978) ,يعني من الاخر دلع المدير بتاعك وهشكة احسن يغضب منك ويزعل ويقوم بفصلك في اي وقت وبدون ابداء الاسباب,وحتي لو الموظف مش عمل اي غلط.<br />4) ابقاءالموظفين الحاليين المعينين الدائمين في وضعهم الحالي بمزايا القانون القديم 1978 والقانون سيطبق فقط علي المتعاقدين الحاليين في الحكومة ومن سيدخل مستقبلا في الجهار الاداري (يعني انت في الشغل تشتغل زيك زي الموظف المعين ويمكن اكتر منه ولكن هو قاعد لحد سن المعاش وانت بعد انتهاء مدة العقد الخمس سنوات وبعد اكسابك الخبرة الوظيفية واستقرارك الاسري تروح في ستين الف داهية) من الاخر كده فين مبدأ المساواة في الدستور وتكافؤ الفرص بين المواطنين, وحق العمل.<br />5) الغاء الاجازات بدون مرتب , وتقليل الاجازات المرضية لتصبح شهر فقط وبعد ذلك يطرد الموظف المريض اذا تجاوزها ويفصل من الخدمة نهائيا, 2 اجازة وضع لمدة ثلاث اشهر ولمرة واحدة بعد ان كانت ثلاثة في القانون القديم للموظفات .(6) من حق الطرف الاول (الحكومة) الاستغناء عن الطرف الثاني(الموظف) في اي وقت ولاسباب يراها الطرف الاول , دون ان يحق للطرف الثاني الرجوع علي ذلك.ولا استطيع عرض باقي البنود الظالمة من قانون الوظيفة العامة الجديد. من الاخر ياناس ده قانون ظالم وسيهدم<br />اقرأ بقية التعليق .."
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203050758/http://masr.20at.com:80/article.php?sid=1528"

