subject = "الي شريف الدواخلي"
author = "احذر يا شريف هذا المقال فية سم قاتل اهرب بحياتك وانجو من السم الزعاف"
posted = "2007-01-31"
text = "ارجوك لا تعلق هنا حتي لا يسري السم القاتل في دمك فتتاثر افكارك وترتعش يداك ولا تستطيع ان تتحفنا بعملك الصحفي البارع الذي لا يدانيك فية احد ولا تغامر بكتابة نقد عن المقال فكما نعرف جميعا ان لا احد في مصر بل في العالم اجمع يدانيك البراعة الصحفية والاسلوب المبتكر والافكار الخلاقة فنحن لا نريد ان نفتقد قدوتنا الصحفية البارعة<br />ارجوك لا تعلق ."
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203050758/http://masr.20at.com:80/article.php?sid=1528"

[[comments]]
order = 1
subject = "الموضوع مش قد كده"
author = "شريف الدواخلى"
posted = "2007-02-01"
text = "هههههههههههههههه ....... للدرجة ديه خايف من تعليقى<br />للدرجة ديه تعليقى بيوجعلك بطنك وبتخليك فى الحالة ديه طيب ربنا ما يحرمك منها ...<br />المهم ... انا عاوز اقولك حاجة يا عم هندى مبدئيا انا مبعلقش على موضوع مرتين .. اوك .. وبالنسبة لموضوعك انا نفسى اعرف انتا رحت المعرض تعمل شغل فيه ولا روحت حديقه او ملاهى !!<br />طفطف ايه يا عم هندى بس !! مش ممكن المعرض كله مالاقتش فيه حاجة تاخدها لقطه غير الطفطف ..امممم لا مش لاقى فيه حاجة تستاهل ولما عرضت الفكره قولت ايه هاعمل حاجة عن الطفطف ...... واسمه تحقيق فى الاخر طيب ازاى !!<br />وبعدين انا اعتقدت انك كان فى حاجة معينة استفزت حاستك الصحفية تعمل صراع فى موضوعك انما فين الصراع هنا<br />لو كان على كده يبقى نعمل حاجة عن تعارف البنات والاولاد فى المعرض و استغلال المعرض كفسحه و عدد ابواب المعرض و الباعة الجائلين فى المعرض و ان كل الناس بتتفرج ومحدش بيشترى .. بس هى ديه صحافة يا عم هندى<br />انا بقيم الموضوع بالاضافة اللى بيضفهالى .. الموضوع ده انتا ضفتلى بيه ايه ...<br />لا الموضوع مش قد كده"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203050758/http://masr.20at.com:80/article.php?sid=1528"

