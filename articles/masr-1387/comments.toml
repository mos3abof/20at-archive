text = "كس ام ام امك انت وباقي الغنم الخليجيين بتستهبل يابن الوسخة انتوا عارفين كويس ان بلادكم الخليجية أصبحت أكبر مراكز الدعارة في الفنادق والكازيونات انتم شعوب مالهاش أي فائدة ولا ومعتمدين علي الاجانب في كل شيء المفروض يرموكوا في البحر لانكم زي تنابلة السلطان وعالة علي البشرية ومصر بتحاول تنضفكم لكن مفيش فائدة فيكم المفروض ترجعوا تمشوا ورا الغنم تاني لان ده اصلكم ونهايتكم يا بدو ياولاد الشرموطة"
