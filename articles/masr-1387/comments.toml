[[comments]]
order = 12
subject = "كذبت ورب الكعبه"
author = "ابن ابيه"
posted = "2007-01-11"
text = "كل اناء بمى فيه ينضح<br />وعموما مع فائق احترامي لاخواننا وحبايبنا الاخوه المصريين الشرفاء منهم فقط وهم كثر ولله الحمد اقول من يكن في قلبه حقد لاخوانه العرب ولنقول مجازا الخليجين ليس على ذنب اقترفوه ليس الا ان اضهر الله في ارضهم البترول الذي عمت خيراته كافه الاراضي العربيه وماينكر ذلك الا جاحد<br />نحن كخليجين نحترم ونقدر علاقتنا باخوتنا العرب كافه ولكن الاتجدون لنا العذر ان ياتي الينا اخ مصري نفتح له قلوبنا قبل بلدنا ثم نتفاجاء بانه اول من يسرقنا ويغدر بنا انا لا اقول كلهم ولاكن على مضض اقولها وللاسف نسبه كبيره<br />ارض الكنانه هي حاميه العرب والمسلمين وقلعتهم الحصينه وستضل كذالك حتى وان ابتلاها الله بكثير من المتلبسين بالدين والحاقدين من النصارى الذين لاتخفى علينا محاولاتهم بالوقيعه بييننا وبين اخواننا المسلمين جمع الله شملهم واصلح ضالهم<br />واخيرا لا اقول الامثل قول الشاعر:<br />لاتأسفن على غدر الزمان<br />لطالما رقصت على جثث الاسود كلاب<br />لاتحسبن برقصها علت اسيادها<br />الاسد اسدا والكلاب كلاب"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112163647/http://masr.20at.com:80/article.php?sid=1387"

[[comments]]
order = 13
subject = "كل اناء ينضح بما فيه"
author = "عربي والسكن مصر والديانة مسلم"
posted = "2007-01-16"
text = "والله حرام الى بنكتب ده سب ولعنات على الشرفاء كل بلد فيه الكويس والوحش واذا كان الله جعل في الخليج البترول وعلشان كده اقصادهم نما وظهر الغنى عليهم فده مش معناه نسب باقي الشعوب واحب اقول للاخ ال بيسب نساء مصر ونساء والاخ الى بيسب اخواننا في دول الخليج اذا كنا احنا شايفين بعض كدة طيب الى في الخارج هيشوفنا ازاي بالله عليكم خافوا الله وحاسبوا انفسكم والاخ الى بيقول ان دين المصريين ظاهري لست انت بالله علشان تحكم على مسلم ام ان الجراة وصلت بيكم للمرحلة دية فوالله ما تتكلم الا عن جهل ولما الله خاطبانا قال وتمسكوا بالعروة الوثقى ما قالش اتمسكوا بالعادات والتقاليد والاوطان وانما نتمسكن بدينا واخلاقنالان هذا ما يحسدنا عليه الغرب وللجميع اتقوا الله"
archived = "2007-01-17"
capture_url = "https://web.archive.org/web/20070117213105/http://masr.20at.com:80/article.php?sid=1387"

[[comments]]
order = 14
subject = "إلى اهل الخليج"
author = "مصرية"
posted = "2007-01-19"
text = "اولا انا اشكر الاخ الكويتى على تعليقه المحترم واشكر اى مصرى وخليجى على تعليقاتهم المحترمة ثانيا احنا كلنا عرب وللاخ اللى بيشتم فى بنات مصر وبيقول انى دينا ظاهرى واللهى يا استاذ انت مدخلتش فى قلب كل واحد علشان تعرف اذا كان دينه ظاهرى ولا لا وكمان فى اى بلد فى الدنيا هتلاقى المحترم والغير المحترم زى ما بنلاقى الابيض والاسود وزى ما بنلاقى الطيب والشرير وبعدين يعنى بصراحة دة مش وقته اننا نشتم فى بعض ال يعنى احنا الحياة عندنا بمبى بمبى وفاضيين اوى ومعندناش شغلة غير اننا نشتم فى بعض واللهى لما فلسطين والعراق يتحرروا ولما كرمتنا كعرب ترجع نبقى نعمل اللى عايزينه فى بعض مع اننا كلنا عرب ولازم نتوحد بس للاسف العرب اتفقوا على ان لايتفقوا وبعدين الناس اللى قاعدة تقول وتشتم فى اهل الخليج وتقول عليهم رعاه غنم انا عايزة قول انى الرسول عليه الصلاة والسلام كان راعى غنم يعنى رعاية الغنم دى مش شغلة عيب ولا حرام علشان نشتم بعض بيهاوللاخ اللى بيقول لعنة الله على كل مصرى وعلى مصر يا استاذ مصر ذكرت فى القران وكمان الرسول عليه الصلاة والسلام تزوج من مارية القبطيةالمصرية وكمان سيدنا ابراهيم اللى هو ابو العرب تزوج السيدة هاجر المصرية يعنى السيدة هاجر ام العرب وكمان سيدنا عيسى والسيدة مريم جائوا إلى مصر ووجدوا فيها الامن والامان وسيدنا موسى ولد فى مصر وسيدنا يوسف عاش فى مصر يعنى مصر مر عليها الكثير من الانبياء ودة يدل انى مصر مش ملعونة ولا ربنا يلعن مصر بالبعكس دة يدل على انى مصر ارض مباركة وياريت يعنى اى واحد عايز يتكلم عن مصر ياريت يرجع للتاريخ ويقرأعن مصر وعن تاريخ مصر قبل ما يتكلم"
archived = "2007-01-22"
capture_url = "https://web.archive.org/web/20070122235501/http://masr.20at.com:80/article.php?sid=1387"

