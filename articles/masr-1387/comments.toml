[[comments]]
order = 8
subject = "إيه العك ده ؟؟؟"
author = "إبن بهيه"
posted = "2007-01-06"
text = "لا أدري هل إخواننا في عشرينات مبسوطين مما نراه هنا من نجاسة وقلة أدب ؟؟؟<br />كل يوم بتطلعوا علينا بموضوع تحسسونا فيه إنكم ناس فاهمين وواعيين .. طيب ليه مش عارفين موضوع آلاف الصهاينة في إسرائيل اللي بيعملوا مع الموساد وشغلهم مركز على المواقع العربية بس ؟؟؟<br />يعني لا مطيري ولا سعودي ولا كويتي ولا بطيخ من ده خالص .. ده أكيد خنزير صهيوني بيتقمص شخصية واحد خليجي ويلعن في مصر والمصريين وبالتالي يرد عليه ألف مصري آخر ..<br />الموضوع ليس مقصودا منه ما يشاع بين بعض الشباب من أنه لشد الانتباه في اتجاه آخر .. لأ .. الموضوع الأساسي والهدف الرئيسي هو خلق حالة من الكره الشديد بين أبناء البلاد العربية .. لأن ده المكسب الوحيد لهم من اتفاقية كامب ديفيد المرزولة .. عزل مصر عن شقيقاتها العرب .. وعزل العرب عن بعض<br />يا جماعه الموضوع مش مجرد تخمين من ناحيتي .. الموضوع تم الكشف عنه قبل خمس أو ست أعوام وكان الحديث عنه كثيرا آنذاك لو تتذكرون ..<br />فاكرين الهوجه اللي طلعت في أيام الياهو ماسنجر ما بدأ يحسن طرق الاتصال الصوتي؟ فاكرين بدايات الألفين ولا لأ ؟<br />أيامها دي كان بيدور الحديث عن قيام الموساد بتجنيد خمسة آلاف شاب عربي يهودي في إسرائيل .. مهمتهم الأساسية فقط هي الدخول في حوارات مع العرب بأسماء عربية وهمية .. تلك الأعدام كانت مقسمة إلى فئات كثيرة<br />فئات تدخل للشتم والسب وبث لابغض بين أبناء العرب فيما بينهم<br />فئات متخصصة في تأييد السياسات العربية التي في مصلحة الصهاينة .. يعني تلاقي مصري أو أردني بيتكلم بهدوء وأدب ويقنعك بأن هذه القرارات المصرية أو الأرنية جيده وفي مصلحة بلدنا ووو إلخ .. ودول بياخدوا راحتهم أوي أوي على موقع لاعربية نت بتاعهم ..<br />فئات تهدم الدين ودي معروفه ليكم خالص ومش محتاجه<br />اقرأ بقية التعليق .."
archived = "2007-01-06"
capture_url = "https://web.archive.org/web/20070106170338/http://masr.20at.com:80/article.php?sid=1387"

[[comments]]
order = 9
subject = "صفر"
author = "ابراهيم عازر"
posted = "2007-01-06"
text = "اخى ابن بهيه ، اولا هذا ليس دفاعا عن اليهود طبعا واعتقد اننا متفقين فى هذا ، ولكن ما تقوله يشوبه بعض المبالغه ، وحتى وان كان صحيحا ، لو لم يكن هناك جزور للخلاف و التعصب بين العرب و بعضهم لما استطاعت جهه خارجيه فعل ما تفضلت بقوله.<br />يا عزيزى الشواهد تقول ان الموضوع اكبر من هذا بكثير ففى اى موقع من مواقع المحادثات تجد مثل هذه النوعيه من الكلام ، حسنا ، حتى ولو سلمنا بان هؤلاء المجندين الاسرائيليين يتنقلون ليلا نهارا بين المواقع المختلفه لنشر التعصب و الفرقه بين العرب ، لنخرج قليلا عن النت و نرى حال العلاقات العربيه العربيه على المستوى الشعبى فى كافه المناسبات الفنيه و الرياضيه ( وما يحدث فى الرياضيه هذه خاصه) فلا تقل انهم قله بان يقوم استاد ستعه 30 او 40 الف قومه رجل واحد لسب فريق عربى اخر ضيف ام ان هؤلاء كلهم من اليهود ايضا ، ولا تندفع حول المغالطه المعتاده هنا ومقوه ان هذا يحدث فى كل العالم بل بين ابناء البلد الواحد ، لا يا صديقى معروف ان اللقاءات العربيه العربيه من اكثر اللقاءات تعصبا و عرضه لحدوث تجاوزات<br />دعنا من هذه النقطه ماذا تقول فى ممارسات العرب القادمين الى مصر سواء للدراسه او السياحه و الامر الذى زاد عن مجرد حوادث فرديه و تحول الى ظاهره ، وحتى ان الموقع (ولاد البلد) قد تطرق لهذه المشكله من قبل و حظى الموضوع ساعتاها بنسبه من التعليقات بل ان البعض كان يذكر بعضا من تجاربه الشخصيه<br />وماذا تقول فى مشاكل العماله المصريه فى الدول العربيه و خاصه اصحاب الحرف اليدويه وما يلاقونه فى الدول العربيه دونا عن اى بلاد فى العالم<br />ولو تحدثنا حتى على المستوى السياسى ( وان كنت اتوقع ردك حول هذا الموضوع بشان القاده العرب هههه) ولكن حتى على المستوى العام تسمع اشياء عجيبه فهناك ترس<br />اقرأ بقية التعليق .."
archived = "2007-01-06"
capture_url = "https://web.archive.org/web/20070106170338/http://masr.20at.com:80/article.php?sid=1387"

[[comments]]
order = 10
subject = "الي ابن بهية"
author = "مصري صميم"
posted = "2007-01-06"
text = "يبدو أنك مازلت تدفن تعيش في اوهام الشعارات القومية بتاعة الستينات البعيدة كل البعد عن الواقع وهذا واضح من اتجاهك الناصري وعلي فكرة عبد الناصر عمل زعامتة العربية بسب الحكام العرب وتخويفهم فكان يقول علي بورقيبة بوالخيبة وعلي الملك حسين ابن زين وعلي الملك فيصل هانتف له دقنه بل انه لم يتورع عن ضرب السعودية بالطائرات في جيزان وابها وكانت سوط العرب بلسانها الطويل تصف حكام الخليج بانهم عملاء للانجليز والامريكان وهذا كله شكل زعامة عبد الناصر العربية لو كان بيتشتم ويسكت زي ما هو حاصل الان من حسني لحد ما بقت مصر ملطشة لهؤلاء الاقزام العرب يابن بهية احوال مصر وخنوعها حكومة وشعبا مع هؤلاء الاعراب اصبحوا يتطاولون علي المصريين ويبدو انك لم تخرج من مصر لقد عملنا في دول الخليج ورأينا كراهيتهم وحقدهم علي كل ما هو مصري وسوء معاملتهم للمصريين وللاسف كلامك ده واوهام أسرائيل كل ده كلام غير واقعي ومش اسرائيل السبب في كده لكن السبب الحقيقي هو تهاون الحكومة ومبارك في الدفاع عن حقوق المصريين وتواطؤ معظم الصحفيين والصحافة المصرية اللي بيقبضوا من السعودية ودول الخليج سيبك من الشعارات الوهمية الكاذبة ولا داعي لدفن الرؤوس في الرمال نكتة سخيفة جدا حكاية ما يسمي بالوطن العربي بعد اللي شفناه من أهلهم"
archived = "2007-01-06"
capture_url = "https://web.archive.org/web/20070106170338/http://masr.20at.com:80/article.php?sid=1387"

