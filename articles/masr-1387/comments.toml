posted = "2007-01-24"
text = "اشكر كل من كان لة كلمة طيبة و اقول لصاحب الموضوع انة لايستحق التعليق علي موضوعة لانه شخصية تافهه فبدلا من التحدث عن مشاكل العرب الحقيقية يتفرغ لمهاجمة اخوانة العرب و الله انه لعار علي كل العرب و انسان غير محترم و كل من يتحدث عن الاخر بسوء فهو يتحدث عن ما بهه هو و ارجوا ان يهتم بنفسه ويصلح عيوبة قبل ان يتهم الاخرين فالبلاد العربية ظهرت بها موضة اسمها الشواذ يروحوا يعلجوا نفسهم من الفساد و الانحلال و التخلف قبل التحدث عن الاخرين واعتقد ان صاحب المقال شاذ في الاساس"
