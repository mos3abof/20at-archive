text = "الاخ صاحب التعليق الاول و اللى فضل يشتم فى مصلر و المصريين اقول له و الله العظيم لولا البترول يا اهل الخليج عليكم كنتم لسة رعاه غنم و بدو . و الله ما انت عارف قدر مصر يا مغفل .. مصر و اولادها هم اصحاب فضل عليكم و اسأل التاريخ و الحضارات . المدنية و التحضر و القيم و المبادىْء و الدين و العلم هو مصر . عملتم انتم ايه بفلوسكم يا غنم . والله بكرة اميركا تضربكم بالنعال"
