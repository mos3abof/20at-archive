subject = "الخليج موطن الدعارة"
author = "الغريبة ان الترتيب البحث في كلمة (سكس) فيه حوالي 5أو 6 دول عربيةاسلامية ... منهم مصر..والسعودية أرض الحرمين..و تركيا مثلا وهي المشهورة بأكبر عدد مساجد على مستوى العالم ..و باكستان البلد المسلم ..وايران البلد الشيعي المحافظ بل المتشدد...و الترتيب كالتالي..."
posted = "2007-01-03"
text = "Pakistan<br />2. Egypt<br />3. Morocco<br />4. India<br />5. Iran<br />6. Viet Nam<br />7. Saudi Arabia<br />8. Turkey<br />9. Algeria<br />10. Serbia and Montenegro<br />واندهشت لأني لم اجد من بين تلك الدول الامارات و الكويت و قطر و البحرين و هي مواخير الدعارة في الوطن العربي ..واظن الجميع على يقين من نسبة الدعارة في الكويت والامارات مثلا.. ففتيات الليل في الشوارع ب10 دولار ..أو حتى بساندويتش و علبة بيبسي ...والجميع يعرف ايضا ان تجارة الدعارة منتشرة بشدة في الامارات و هي جزء من اقتصاد الامارات ...وكله بالقانون !!!<br />لذلك فهم لسوا في حاجة للبحث عن الجنس على الانترنت ..فهو موجود لديهم على اعتاب منازلهم دون رقابة ..دون عناء"
archived = "2007-01-06"
capture_url = "https://web.archive.org/web/20070106170338/http://masr.20at.com:80/article.php?sid=1387"

