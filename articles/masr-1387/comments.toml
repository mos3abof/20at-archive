[[comments]]
order = 0
subject = "صفر واحد صفر واحد"
author = "ابراهيم عازر"
posted = "2007-01-02"
text = "احب اولا ان احيي الكاتب على هذا الموضوع فهو بالتاكيد يهم كل الموجودين باعتبار ان من يدخل و يقرا ولاد البلد فهو ضمنيا يتعامل مع النت و مهتم به ( عرفت الحكايه دى لوحدى شفتم الشطاره)<br />المهم.. من الاحصائيه ومن خلال اسلوب كاتبناالساخر الذى وصل الى ان نسبه ما - ولا اريد التعميم - من المصريين يدخلون على النت للبحث عن السكس ثم السكس المصرى و اخيرا افلام السكس المصريه الى جانب تنزيل بعض المواد الاخرى طلبا فى الحصول على خدمات مجانيه<br />نجد ان هذا يتعارض مع ما تحاول حكومه الديجيتال الجديده تسويقه من خلال ارتفاع عدد اصحاب الكمبيوتر و ارتفاع نسبه الدخول على الشبكه ، ان مصر دخلت عصر تكنولوجيا المعلومات من اوسع ابوابه ، فى حين ان الحقيقه ان اهتمامات ومشاكل المصريين لم تتغير فقط تغير شكلهافمشاكل الشباب الجنسيه مثلا و طرق التنفيس عنها تغير من افلام الفيديو الى السى دى ، والمشاكل الماديه فى الحصول على سلعه ما تحول من شرائط الكاسيت المضروبه الى مواقع التنزيل المجانى<br />اى ان الشباب يدخلون عصر المعلومات ليس من اجل تطوير صناعه البرمجيات مثلا كالهند لا سمح الله و لكن مازال الشباب يدورون فى نفس فلك البطاله وما ترتب عليها من نقص فى الموارد الماليه والاعتماد على الاعانات (المصروف يعنى) و ما يترتب عليه من مشاكل تأخر الزواج .... الخ فلا تطلب من شاب لا يجد متطلباته الاساسه ابداع خارق للمألوف قد يحدث من البعض ولكن ليس على المستوى العام ، ولكن كل هذا لا تهتم به حكومه وزير الاتصالات السابق ، فما هى الا ارقام تقال فى المناسبات المختلفه وانتهى الامر<br />ماهى الا محاوله لخلق حياه اخرى تخيليه ووهميه لدى الراى العام تشبه تماما الحياه التى يعيشها الشاب وهو يقضى الساعات امام صفحات النت ، والتى جعلت من مقاهى<br />اقرأ بقية التعليق .."
archived = "2007-01-06"
capture_url = "https://web.archive.org/web/20070106170338/http://masr.20at.com:80/article.php?sid=1387"

