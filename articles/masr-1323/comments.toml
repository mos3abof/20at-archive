text = "الموضوع حلو اوى واكيد فى حاجات كتير هتتغير لما الولد يكبر غير مكان كرسى السواقة دة اذا افتر ضنا انه على مايكبر هيكون في عربية اساسا<br />بس التعليقات مفقودة فى كل المواضيع هو انتوا حذفتوها ليه عموما بما ان فى امكانية للحذف ياريت فيما بعد تحذفوا التعليقات الخارجة"
