[[comments]]
order = 3
subject = "ديفلوبر على ما تفرج"
author = "مناضل انترنتى قديم"
posted = "2006-04-13"
text = "السلام عليكم ورحمة الله وبركاته<br />هو فعلا مبرمجى الكومبيوتر هم الاعلى دخلا فى العالم ولكن ..........<br />وهنا نتوقف كثيرا فالشخص الكويد اى المبرمج فى أمريكا يعامل معاملة العالم اللى عندها ربع ضارب فلا تقبل له شهاده فى المحكمه لأنه ايش ضمن القاضى ان الشاهد الكويد ده لما شاف الجريمه ما كانتش دماغه سرحانه فى حتة كود قرفاه ولا يمكن كان متقمص دور نيو فى فيلم ماتركس<br />علاوه على ان كثرة الجلوس أمام شاشات الكومبيوتر يؤثر على الكفاءه الذهنيه للعالم الكويده اللى زى حالاتى و الأنقح من كده أنهم بعد فتره معينه الرجل الكويد ده بيتركن على الرف لانه خلاص الهارد اللى فى دماغه اتفرمت خلاص و الرامات أتحرقت ومابقاش عارف يجيب افكار جديده يعنى من الأخر كده بقى عامل زى خيل الحكومه كده و بيخيروه بين حاجه من اتنين اما يقضى باقى عمره بعيد عن الكود (صعب اوى الموضوع ده) أو انه يقضى اجازه فى جوانتاناموا<br />و علشان كده يا مصعب نحمد ربنا اننا ناس كويده فى مصر أم الدنيا<br />المشكله دلوقتى يا مصعب يا أخويا و أحنا ولاد كار واحد لو انت فى امريكا هاتختار ايه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145315/http://www.20at.com/article2.php?sid=692"

[[comments]]
order = 4
subject = "الكلام أخذ و عطا يا عم مصعب"
author = "مناضل أنترنتى قديم"
posted = "2006-04-14"
text = "السلام عليكم ورحمة الله و بركاته<br />أيه يا عم مصعب انت واخد الأمور كده ليه الكلام اخذ وعطا كلامك ده صحيح فى اى حته إلا عندناو للأسف نحن فى مصر المحروسه<br />على كل حال متشكرين جدا على المعلومات القيمه ديه و بلاش النظره العنصريه ديه العلم مش حكر على حد<br />الموضوع مش كده خالص ممكن تبقى مبرمج جيد و انت لم تدرس فى الهندسه او الحاسبات<br />وربنا يوفقك يا سيدى لما يحب ويرضى"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145315/http://www.20at.com/article2.php?sid=692"

[[comments]]
order = 5
subject = "ايه يا عم؟!!"
author = "مصعب"
posted = "2006-04-14"
text = "أنا ما قصدتش خالص نظرة عنصرية ..<br />أنا كان قصدي أوضح الفرق ..<br />و على فكرة الفرق ده كمان موجود في مصر المحروسة .. بس في حتت قليلة أوي ..<br />و انا عمري ما قلت العلم حكر على أحد ..<br />بالعكس أنا من أشد مؤيدي حركة(أو مجتمع) المصدر المفتوح ..<br />و من أشد المؤمنين بالمقولة اللي بتقول \"إذا كانت زكاة المال جزءا منه ، فزكاة العلم العلم كله\"..و بالذات في مجالنا..<br />و كان قصدي حاجة كمان نسيت أوضحها التعليق اللي فات ..<br />إن الهنود فعلا محتلين المجال لأنهم فعلا عمالة رخيصة و لأنهم مهرة \"كصنايعية\" و معروف إن أفضل مطوري حلول هم المصريين و الأمريكان و بعض الكنديين..<br />و بالنوسبة لك أخي الفاضل مناضل انترنتي،<br />الجملة اللي أنت قلتها :<br />\"أنهم بعد فتره معينه الرجل الكويد ده بيتركن على الرف لانه خلاص الهارد اللى فى دماغه اتفرمت خلاص و الرامات أتحرقت ومابقاش عارف يجيب افكار جديده يعنى من الأخر كده بقى عامل زى خيل الحكومه كده\"<br />انا بقى هأتكلم بشكل عنصري شوية لانك أجبرتني على ده :<br />أولا: كل ما بتدخل في المجال أكتر كل ما بتلاقي أفكار أكتر .. و خبرات أكتر ..<br />ثانيا: \"الكويد\" هو آخر حد في الهرم البرمجي، يعني عملية صناعة المنتج البرمجي الصحيحة بتمر بخمس مراحل :<br />1) Requirements analysis<br />2) Design phase<br />3) Implementation<br />4)Testing and debugging<br />5) Delivering the product to the client<br />و زي ما أنت شايف مرحلة التكويد دي المرحلة التالتة من الموضوع<br />و هي straight forward أوي لو أنت عامل design كويس لحل المشكلة..<br />و نرجع تاني لأختنا هوبة الهنود متفوقين في المرحلة دي و اللي بعدها بس.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145315/http://www.20at.com/article2.php?sid=692"

