text = "وماهي متطلباته ؟ وهل يلزمه مستوي تعليمي معين او دراسه معينه وهل لازم الواحد يبدا وعمره صغير ولا ممكن في اي سن<br />وهل فيه مؤسسه او جهه متخصصه او جامعه جيده الواحد يقدر يدرس فيها التخصص ده<br />ياريت ياجماعه واحد من الاخوه الكرام اللي عنده فكره يشرح لنا الحكايه دي"
