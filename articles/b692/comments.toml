[[comments]]
order = 1
subject = "غريبه ؟؟"
author = "هبابه او هوبه او هبهوب"
posted = "2006-04-13"
text = "غربيه ؟؟<br />اللي وصلني غير كدا وصلني مثلا ان الدكتور هو افضل مرتب هناك ؟؟<br />دا غير ان مجال التكنولوبيا دا سهل ان الواحد يغشوه ومعظم الامريكان فيه<br />فا اللي بتخرج بردو مابيلقيش شغل لسبب بسيط ان الشركات بتدور علي الخريجين الجدد مش القدامي في التخصص دا بالدات , فبعد كام سنه يركنوك ويدور علي حد تاني , والبقاء لاحدث , دا غير ان الهنووووووود هما اللي محتلين المجال دا لسببن اولا مهره ثانيا سعرهم رخيص . ليه اجيب امريكاني واشغله والهندي يقوم بالدور وافضل كمان دا مش احباط للكابتن مبرمج الموقع بس\" وجهه نظر\" اخت كانت بتفكر في موضوع شبه كدا. سيبكم من الابحاث وارقامها عشانننننن الواحد زهق من الكلمه دي ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145315/http://www.20at.com/article2.php?sid=692"

