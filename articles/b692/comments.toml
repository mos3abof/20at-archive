[[comments]]
order = 15
subject = "لنك"
author = "الي ذئب العراق الغالي والي الاخ مناضل اهدي هذه القصيده"
posted = "2006-04-18"
text = "ساقــــت الأقدام يوما حمـــــــــــلاً<br />قــرب نهر ينثني بين التــــــــــلال<br />فرآه الذئب فاســتســــمنــــــــــــه<br />فلحـوم الضأن أشهى ما ينــــــــال<br />قال : مـاعــذرك إذ تشــتـمـنــــــي<br />منذ عام دون حــرب أو قتــــــــال<br />قال : يا سِرحانُ عذري واضـــح ٌ<br />عمري الماضي شهور ٌ وليــــــال<br />قال : إن أنكرت شتمي جاحـــــداً<br />فأبـوك هو خصمي لا محــــــــــال<br />وإذا كنـت اليـتـيـــــم المـبـتـــــــلى<br />فذنوب الجد تسري في العيــــــال<br />وإذا أنكـــرت شتمي جاحـــــــــــداً<br />كيف في تعكير المـــــــــاء الذلال<br />قال : يا سِرحان مائي قـــــــــــادم<br />من أعالي الأرض من فوق التلال<br />أنت فوق التل في الأعلى فهــــــل<br />تصعد الأمواه في أعلى الجبــال ؟<br />قال أُعطيت جوابا مقنعــــــــــــــاً<br />من جمال الثغر يستحلى المقـــــال<br />فادن كي ألثم ثغــــــراً مشـــــــرقا<br />فيه ينبوعٌ من السحر الحــــــــلال<br />ودنا المسكين يعلو وجهـــــــــــــه<br />رونقُ البشرِ وأطياف الخيـــــــــال<br />عضه الذئب وما أمهلـــــــــــــــــه<br />أكل اللحم ونحو العظم مـــــــــــال<br />منطق الأنياب هذا شأنـــــــــــــــه<br />شرعه مكر وغدر واحتيـــــــــــال<br />فاحذر الغدار لا تركن لـــــــــــــــه<br />واسمع النصح ودع قيلاً وقـــــال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145315/http://www.20at.com/article2.php?sid=692"
