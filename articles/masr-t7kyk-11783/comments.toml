text = "آه القرف ده<br />هي نقصاهم هم دول كمان<br />اتقوا الله يا مشايخ الازهر شباب مصر امانه في رقابكم<br />اتقوا الله يا شباب ولازم نرجع الى ربنا شويه وكفايه كده شويه الايمو وشويه عبدة الشيطان حرام عليكم وكفايه تقليد للغرب احنا بس نقلدهم في الحاجة الهايفه"
