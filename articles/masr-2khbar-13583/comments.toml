text = "اللى قتل جمال عبد الناصر<br />اللى قتل انور السادات<br />اللى قتل ضباط قيادة الجيش فى حادث الهيلوكوبتر<br />اللى قتل سعاد حسنى<br />اللى قتل اشرف مروان<br />نفس قتل سوزان تميم<br />كلهم قتلوا من جهة واحدة<br />قتلهم العملاء<br />عملاء اسرائيل وامريكا<br />وهم فى هذا الزمن كثيرون<br />ويعملون بالريموت كنترول<br />ولكن عين اللة لا تنام"
archived = "2009-10-04"
capture_url = "https://web.archive.org/web/20091004222309/http://www.20at.com:80/masr/2khbar/13583-2009-10-01-07-16-05.html"

