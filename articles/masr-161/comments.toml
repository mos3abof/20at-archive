[[comments]]
order = 4
subject = "ايش تعمل الماشطة ؟"
author = "المصرى افندى"
posted = "2006-04-20"
text = "العبارة اتقالت وانتهت ، وعلى فكرة الاخوان دخلوا التاريخ بالطظ دى ، زى كلمة سعد زغلول \" مافيش فايدة \"،ووبلاد العرب عمار ، فيها الجمهورية وراثية ، والمرشد مصر ضاقت عليه ، والوفدطلع كاوبوى ،والتجمع مغيب ، وباقى الاحزاب فاقدة الاهلية ، وملناش غير ربنا ينجدنا منهم كلهم."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023336/http://masr.20at.com:80/article.php?sid=161&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 5
subject = "الله يفتح عليك"
author = "عبد الله"
posted = "2006-04-22"
text = "ارجو ان يقول لى احد العقلاء ايه الكويس فى البلدعلشان ابقى عارف وعلى فكره اى واحد هيقول ان البلد دى كويسه يبقى من الناس اللى فوق الى هما بيكسبوا بالملايين على حساب الغلابه المطحونين اللى مش لقيين ياكلو ده حتى الدعم استخصرو سيادته فى الشعب المسكين الفقير تقولشى هو بيدفعه من جيب ابوه دى بقت حاجه تزهق وشكرا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023336/http://masr.20at.com:80/article.php?sid=161&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"
