[[comments]]
order = 1
subject = "ايه مش عاجبك قصدي ايه اللي عاجبك"
author = "كتكوتة"
posted = "2006-04-14"
text = "اتمنى بعد كل هذه الاحداث المبكية والمضحكة من تواليها وكثرتها وعدم معقوليتها الا في بلدنا مصر<br />اتمنى ان ارى استفتاااااااااااااء على موقع اولاد البلد على غرار ( حلوة غرار دي مش كدة) على غرار البلاد الكويسة ايه اللي مش عاجبك في البلد عشان نغيره بس انا بقى الاستفتاء بتاعي هايبقى دور كده وقول لنا ايه اللي عاجبك في البلد عشان نغيره اتمنىىىىىىىى من الموقع ان يضع هذا الاستفتاء لاننا اكيد هنشوف العجب<br />وشكرا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023336/http://masr.20at.com:80/article.php?sid=161&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 2
subject = "ايه اللى مش عاجبك"
author = "كتكوتة"
posted = "2006-04-14"
text = "طبعا اللي هايغير هي الحكومة مش احنا<br />لان شعار الحكومة برئاسة مبارك هو قلة راحة الشعب حتى الممات<br />فانتم شوفوا ايه حلو واحنا نغيروا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525023336/http://masr.20at.com:80/article.php?sid=161&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

