text = "ايه ياجماعة اسلوب الكتابة التعليمية ديه<br />انا ملاحظ ان استايل الموقع كله ماشي على طريقة النقط<br />هو امتحان تاريخ<br />وفين مسئول الموقع اللي المفروض انه فاهم يعني ايه كتابة صحفية<br />وبعدين ايه طريقة نصيحة تهمك ديه اصلا<br />انتوا ما بتقروش جرايد ولا ايه<br />هو فيه اي تحقيق خلقه ربنا بيتعمل في نقط<br />انتوا فاكريين نفسكوا بتعملوا التوقعات المرئية"
