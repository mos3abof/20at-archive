text = "فية عيال دلوقتى ما بتعرفشى جنس<br />اعوذ باللة - دول بيعرفوا اكتر من ابويهم<br />المدرسة بتشرح لصف رابع الفيتامينات ووجودها فى الخضار - واثناء حضور الموجة وقف الطالب وقال الفيتامينات موجودة فى الجرير ولو عرفت النساء قيمة الجرجير لزرعناة تحت السرير - دول جيل كمبيوتر وجيل الدش وعيونهم دايما على الشاشات وبيشوفوا بلاوى"
