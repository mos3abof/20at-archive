text = "جميلة اوى كتابتك، هى دى طريقة التعبير عندما نتأثر ، فلو كتب كل منا عن مايحبه فعلا ويؤثر به لرسمنا المزيد من اللوحات الجميلة كلوحة جينيه ، واعتقد انه سيشكرك يوماولو فى حياة اخرى على تلك السطور، احلى كلمة هى الاخيرة فعلا يملك اى منا الحال الذى يأتى عليه الدنيا ولكنه بالطبع يختار ما يختم به هذا لمشوار."
