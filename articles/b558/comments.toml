posted = "2006-03-13"
text = "مش عارفه اقول لكم ايه يا جماعة بس الموضوع هائل فعلا انا مش مصدقة نفسي هي عشرينات بقت بتعمل موضوعات وترسم لوحات حلوة كده، عموما ربنا معاكي يا اخت دعاء وربنا يكرمك وتقدم لنا مموضوعات حلوة دايما بس انا عندي سؤال هو انت مش كنتي بتعملي موضوعات الصوت بس خلاص دخلتي في الكتابة لو كده يبقى انتي بجد متميزة"
