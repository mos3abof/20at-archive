posted = "2006-03-18"
text = "الموضوع هايل , ربنا يكرمك يا دعاء والناس تفهم وجهة نظرك ,حقيقي جان جينيه راجل هايل ,كل واحد تقولو شوف أخوك ساعده أي ان كان نوع المساعدة تلاقيه قال وانا مالي أ ول ما قريت الموضوع حسيت اني عايز أقول كلمه واحده لكل واحد مش بيبص الا لنفسه وبس \"دي الامثله اللي لازم الواحد يقتدي بيها \""
