posted = "2006-03-13"
text = "أولا ياعم المحافظ صورة الراجل موجودة على الصفحة الرئيسية، أنا بقول تطلع من اللي تحت البلاطة وتغير النضارة. ثانيا بقى الصورة اللي جوا الموضوع دي أحلى صورة شفتها على عشرينات من فترة طويييييييييلة.. صورة مقبرة الراجل، وكمان عاجبة أمة لا إله إلا الله.. بس أقول ايه بقى.. لازم نتقبل الرأي.. والرأي الآخر... ;)"
