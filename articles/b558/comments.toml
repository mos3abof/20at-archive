[[comments]]
order = 17
subject = "عشرينات رجع يارجاله"
author = "العائدة الى النت"
posted = "2006-03-21"
text = "مش ممكن انتو بجد جامدين موووووووووووووت الظاهر اني هارجع لعشرينات تاني بصراحة \"جان جينيه\" انسان عظيم ورائع لانه زي ماقالت دعاء رغم انه اووروبي الا انه بيحب العرب جدا وله صولات وجولات وع القضية الفلسطينية ومذبحة صابرا وشاتيلا بالذات انا قرات كتابه اربعة ايام في صايرا وشاتيلا وكان رائع وكمان شفت البلكون النص المعر لمسرحية الشرفة لجينيه وهي بتعرض في الهناجر لو حد حابب<br />بجد برافو عليكي ايدعاء عشرين مرة كمان وشغلك حلو مووووووووووت<br />بس ياريت فعلا تركزي على النماذج الي زي جينيه في الادب او في الفن او في الحياة عموما بس بصراحة انا عندي سؤال ايه قلم رصاص اللي مكتوبة فوق جنب الاسم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131546/http://www.20at.com/article2.php?sid=558"

