[[comments]]
order = 13
subject = "الازمات ترهف المشاعر وتولد الابداع"
author = "مروة الابياوى"
posted = "2006-03-19"
text = "كنت اتمنى لو ان هذا الرجل موجودا على ظهر البسيطه لانحنى له اعجابا وتقديرا وحبا ان ادى نيجرى الشاعره الالمانيه قالت ان الفقريرهف المشاعر وانا اضيف اليها قول فيلسوف ان الازمات تقوى العزيمه وتولد الابداع حيث يقول الفيلسوف الالمانى ان الطفل الصغير فى مرحلة التسنين يدربونه على اكل العيش الناشف لتقوى اسنانه كذلك جان جنينيه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131546/http://www.20at.com/article2.php?sid=558"

[[comments]]
order = 14
subject = "لاتقول انا لقيط بل قل انا مبدع"
author = "مروة جابر الابياوى"
posted = "2006-03-19"
text = "ان جان جنيه قابل اليأس بالتحدى ومن قصته هذه ادعو كل من وجد نفسه فى الدنيا دون ارادته واشارت اليه اصابع الناس بانه لقيط الا يخجل فهناك نمازج مشرفه من نظرائه المبدعين امثال جان جنيه ارجو فى مصر الا نقول اطفال الشوارع وانما نقول اولادنا العصاميون فأنا ارى ان جان جنيه هو رجل عصامى بالدرجه الاولى هل ستصدقينى اننى احببت الرجل ورسمت شكله من كتبتك عنه دعاء فمقالك وكانه تمثيل حى لحياة الرجل فلاداعى للصورة لان من الناس من يعرف الكتب من حديثهم<br />وليس من اشكالهم او صورهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131546/http://www.20at.com/article2.php?sid=558"

