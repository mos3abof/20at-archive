[[comments]]
order = 10
subject = "عن الصورة والمقال"
author = "عدنان العيادي"
posted = "2006-03-16"
text = "وأنا أطالع هذا المقال, شدتني الصورة المرفقة فقد ذكرتني بأيام وسنين أمضيتها بين الطفولة والشباب.<br />والصورة للعلم هي لمدينة العرائش بشمال المغرب حيث أوصى جون جنيه بأن يدفن.<br />بهذا المحيط الأطلسي كنا نبحث عن أبعد الشواطئ الخالية من المعارض الجسدية المعلومة أو كنا نقصد الشاطئ في أولى ساعات الصباح بعد صلاة الفجر قبل أن يسيطر العري عليه بعد ساعات فننعم بلحضات من السباحة والتمتع ببعض نعم الله في رضاه. نيأل الله العافية.<br />ذكرتني الصورة بالقصبة والصنارة بالسردين المشوي, بمخيمات حركة التوحيد والاصلاح التي قضيناهاغير بعيدين بشاطئ سيدي عبد الرحيم.... بالكثيير.<br />لن يكون جون جنيه أكثر حبا لمدينتي مني, حيث لم يفرقني عنها إلا أمر طلب العلم والعمل اللذين وجدتهما بالدار البيضاء, لاتردني إلي العرائش إلا أيام قليلات أقتطفها من شجرة السنة لزيارة أبوي, أسرتي ثم إخواني وأصدقائي وأستنشق هواء مدينتي.<br />العرائش الأن تعيش التهميش والفساد والأمل معقود على أبنائها وأعضاء حزب العدالةوالتنمية بالمجلس البلدي الذين يمثلون المعارضة للمساهمة في الإصلاح والتنمية.<br />معذرة على هذه اللفة بتعبير إخوتنا في مصر. سأعود....<br />...عدت: ناضل جون جنيه من أجل العرب والمسملين و أحبهم. واستدر أغلبنا نحو الغرب وبايعهم.<br />مقال جميل يستفز المواطن العربي المسلم للنضال من أجل وطنه ودينه وأمته والناس أجمعين. فالناس عيال الله أحبهم إليه أنفعهم لعياله. تحية خاصة لصاحبة المقال للقائمين على موقع عشرينات ولكل الزائرين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131546/http://www.20at.com/article2.php?sid=558"

