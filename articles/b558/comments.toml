text = "لقد كان جان حنييه بالفعل شخصية محيرة والى الان ايضا فهو شخصية مليئه بالمتناقضات وهو اقرب الى شخص مريض نفسيا<br />جان جينيه ... الكاتب الغامض والملعون في الادب الفرنسي، ذلك اللص العنيد المتشرد .. الذي ملأت فضائحة اسماع الناس طالما تساءل مع نفسه .. لماذا قذف به الي هذا العالم الموبوء لقيطاً .. رغم انفه، اثر نزوة عابرة؟ (القديس جان حينيه) كما كان يحلو لسارتران يسميه.. كان ثملا بخمر التشرد والفاقه والعوز، سعي جاهدا لرد الصاع صاعين.. بسبب ما تلقاه من اهانات عميقة طيلة حياته منذ ان كان طفلا لقيطا متروكا لرعاية الجمعيات الخيرية بعد ان هجرته امه.. تبنته احدي العوائل الفلاحية، التي سرعان ما اتهمته بالسرقة، واودعته اصلاحية الاحداث .. ليتجرع هناك قساوة اليتم بمعناه الحقيقي .. وليعرف معني الحرية المفقودة ومعني ان يشير اليه الاخرون.. الذين سماهم سارتر بالجحيم.. علي انه افاق ولص محترف .. عاش في البيوت المشبوهة، مشردا بين هذه الغرف المهملة وذلك الزقاق المهجور وتلك الحانة عاش في ذلك العالم السفلي .. عالم الجناة والمختلسين والشذوذ والقتله والمجرمين واصحاب السوابق وقطاع الطرق واللصوص والنشالين وكل الحثالة التي تسكن في دهاليز باريس المظلمة ومن ذلك المكان المرعب .. المجنون الذي تقطنه شياطين الانس والجن، خرج جان جينيه باعماله الادبية الرفيعة.لقد جعله وضعه الملتبس كونه ابناً غير شرعي وسط ابناء شرعيين ان ينحاز الي الجريمة في مجتمع خاضع للقوانين وهكذا اختار طريق الشر والجريمة مصحوبا بمشاعر شهوانية حاول من خلالها ان يجعل من الحرية ومن السوقية ومن الرجس شيئا انيقا غنائيا شاعريا ، وراقت له فكرة قلب النظام المستتب والبحث عن هوية نفسه البطولة عن طريق اللااخلاق والمنفي والمعارضة التامه لكل ما هو مالوف ومتفق عليه.<br />وادراك بسرعة انه لن يقدر ان يكون اكثر من متشرد اولص .. لص سيئ بالتأكيد، وكان هذا نجاحه الوحيد في عالم المجتمع فلم يرق له ان يكون مفتش باصات مثلا او مساعد جزار او شيئا من هذا القبيل، لان هذا النوع من النجاح كان يثير قرفه علي حد وصفه ((اعتقد بانني مذ كنت صغيرا جدا، دربت نفسي علي امتلاك احاسيس لايمكن ان تؤدي به الا الي الكتابة .ولكن كتابه من نوع غريبه وشاذه مثله حيث اثرت فيه بلا شك بيئته وعالمه الخاص به .<br />لذلك لا ارى سببا لأعتبار جان جنييه نموذجا لفنان ثائر ومناهض للأستعمار ومدافع عن حقوق الشعب المغتصب وكنى اراه - وذلك ضمن اعماله المسرحية -انه وبلا شك قد تأثر بحياته الفاسدة والمفسدة وانعكست على اعماله ومن هنا ادعوا الى نبذ تلك الشخصية المريضة مهما كانت قمة ابداعاته الفنية واسهاماته الوطنية بل والتركيز على شخصيات اخرى مؤثرة ولها تاريخ نضالى حقيقي ومتصالحه مع نفسها حيث لا تؤثر تأثيرا على جيل كامل يبحث عن القدوة الحقيقية."
