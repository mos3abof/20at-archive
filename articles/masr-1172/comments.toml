subject = "يا راجل ؟؟؟؟"
author = "إبن بهية"
posted = "2006-11-16"
text = "يبدو من العنوان والسياق أن أخانا الكريم مستجد في اللعبة .. عموما ربنا يوفقك ويا ريت تكثر من القراءة لتحسين اللغة ((ما يغركش الكلام العامي اللي باكتبه هنا .. أخوك لغته العربية مية مية)) المهم كان لازم نتفزلك عليك بالكلمتين دول يا درش لما عرفنا بخبرة السنين إنك مستجد وكل مستجد لازم نلبه .. ده سلو بلدنا ولا إيه ؟؟ مش نظام حسني مبارك الواطي علمنا كده ؟؟؟<br />المهم يا عمنا الأزهر لا بدأ يفوق ولا ناوي يفوق ومش ممكن يفوق غير لما الواطي يشيل إيده من عليه ويكون تعيين شيخ الأزهر بالنتخاب الحر من مشايخ الأزهر وليس تعيينا من رئيس الجمهورية الموكوس اللي ما بيعرفش يعين لنفسه عسكري يحرسة ولا حتى ينشه عيارين ونرتاح من خلقته العكرة ...<br />هنا الخلاص وهنا نهضة الأزهر بجد ... الأزهر قديما كان منارة العلم ومفرخة لاعلماء في كل أرجاء المعمورة .. مكتبات وبعثات الأزهر كانت تملأ العالم شرقا وغربا .. أيما ذهبت وجدت إرسالية للأزهر الشريف (أيام ما كان شريف بقى) ومكتبات في أدغال افريقيا .. لم يكن يقتصر دوره على تعليم العلوم الدينية فحسب بل وتعليم اللغة العربية وآدابها لغير الناطقين بها من كافة أرجاء الأرض في بلادهم .. هذا كان شأن الأزهر قبل الوكسة المباركية ..<br />استطاع مبارك الواطي تقزيم الأزهر وتحطيمه حتى صار ككتاب سيدنا دعبول في كفر البطيخ .. لا مكتبات في الخارج ولا بعثات ولا أي نشاط من هذا .. في عهد مبارك الواطي مات الأزهر تماماً .. الذي سافر منكم إلى بلاد بعيدة في أوروبا أو أفريقيا سيلاحظ هذا بوضوح شديد .. لم يعد للأزهر وجود هناك .. سحب الأزهر كل ذلك ربما للتوفير أو لسداد ديون مصر ولا مش عارف إيه .. ربنا ينتقم منك يا حسني يا واطي .. طبعا كان الأزهر الشريف يحمل راية مصر ويجوب بها الآفاق .. بات الأزهر<br />اقرأ بقية التعليق .."
