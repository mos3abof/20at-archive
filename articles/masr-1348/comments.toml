subject = "و لا يهمك يا فارس خد راحتك"
author = "نيفين نيفى نوفا"
posted = "2006-12-25"
text = "قول كمان يا فارس<br />و الله وفرت على ناس كتير اللى عايزين يقولوه<br />تعرف<br />عندى انا كمان كام لسه<br />بس و الله حاله البلد خلت الواحد ساعات ملوش نفس يكتب حرف واحد<br />لك الله يا مصر"
archived = "2007-01-07"
