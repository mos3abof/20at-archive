[[comments]]
order = 0
subject = "فضفضه واجرى على الله"
author = "فارس_fr"
posted = "2006-12-24"
text = "اه خطاب ولا بيان عنترى من اللى الحكومة بتطلعه كل فتره ,, واعتقد ان مفيش ولا رقم من الارقام دى صحيح بدليل :<br />- لسه رغيف العيش غالى وحالته تعبانه<br />- لسه الطماطم ب6جنيه والبصل ب4 جنيه<br />- لسه المواصلات زحمة واتوبيساتها تعبانه<br />- لسه التعليم حالته لا يرثى لها من سئ الى اسوا .<br />- لسه فيه على حد علمى 8 مليون عاطل عن العمل .<br />- لسه فيه كام عانس فى البلد متجوزتش<br />- لسه فيه تزوير فى الانتخابات<br />- لسه فيه تعذيب فى السجون واغتصاب وانتهاك لادمية المصري .<br />- لسه مبارك وزبالته مستمرين فىحكم بهية<br />- لسه ابواق الفساد والاقلام الفاسدةامثال حمدى رزق وكرم خبر\" بتضمضم وبقبق\" للحكومة وانجازاتها .<br />- لسه عندنا جرائد زى الاهرام والجمهوريه<br />- لسه الغاز الطبيعى بيصدر لاسرائيل ببلاش<br />- لسه البترول فى جعبة امريكا لننال الرضا السامى .<br />- لسه فيه فضائيات زى العربية وروتانيات<br />- لسه البلد مليانه علمانيين وليبراليين ومدعى الثقافه .<br />- لسه الاثار بتتهرب خارج مصر<br />- لسه الخصخصة شغاله وسرقه المال اعام<br />- لسه الحوادث شغاله ويروح معاها الالاف من الغلابه .<br />- لسه امين الشرطة والعسكرىالمعفن له قيمه فى البلد وبيتعالى على خلق الله .<br />- لسه فلسطين محتله !!!!! لسه العراق محتله !<br />- لسه علاء بيسرق وينهب ويشارك على كل قهوة وكشك سجاير .<br />- لسه جمال عينه على الكرسي .!!<br />ولسه ... ولسه ... ولسه ..........!!!<br />مستنين ايه يا ناس والله حرام ,, معلش طولت عليكم بس الكلميتن كانوا واقفين فى ظورى ,,<br />تحياتى لكل قلم حر فى مصر ...!!!"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224708/http://masr.20at.com:80/article.php?sid=1348"

