subject = "ولية اصلا الاعتقالات"
author = "ولية اصلا يكون فى بلدنا اعتقالات فى القرن الواحد والعشرين"
posted = "2007-01-29"
text = "منظرنا بقى وحش قوى قوى قوى كدولة من العالم السابع تحت الارض<br />ممكن تحديد اقامة الفرد داخل منزلة وعدم ممارسة اى نشاط اذا كان خطر على الامن بصحيح<br />ممكن نصحة بالطريقة الصح<br />ممكن نقولة ااقعد فى بلدكم متسبهاش<br />ممكن حاجات كتير<br />انما التخلف انك تعتقل واحد وتلفق لة تهمة كدابة<br />حكمت المحكمة بالبراءة<br />طيب مين هينفذ<br />ابقوا تعالوا قابلونى فى سوق الاستهبال"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203061616/http://masr.20at.com:80/article.php?sid=1518"

