[[comments]]
order = 17
subject = "من الاخر -كلامك غريب قوى"
author = "ياسر أبو عمار"
posted = "2007-02-01"
text = "مين يا عم الحزين قالك انه لا حرية فى ظل الاخوان ؟بالعكس والله الحرية عند الاخوان سواء بينهم داخليا او فى مبادئهم اعتقد انها لا تعادلها حرية تانية والله ،يا عمى الواحد فى الاخوان اللى ميعجبوش راى او قرار يقدر انه يوصل لغاية المرشد شخصيا ،اى والله باكلمك بجد وعن معرفة كمان ،مش باهلس يعنى ،انما حضرتك بص لاى قوة سياسية فى بلدنا العظيمة ،من اول الحزب الوطنى الى حزب الخضر -ايوة فى حزب فى مصر اللى مش راضية تعترف للاخوان بحزب سياسى اسمه الخضر ومعرفش بيعمل ايه فى البلد والله العظيم- ما علينا .المهم ان الاخوان عمرهم ما هيكونوا ضد الحرية ابدا ،اولا لان دى المبادئ اللى بيربوا ولادهم عليها ،ثم ان اللى داق الظلم من سنة 1928 لغاية الان عمره ما يظلم ابدا ،وبرضه يا سيدى هو فى سبيلالله ثم فى سبيل مصر ،انت متخيل يا اخى ان جماعة بالتضحيات دى تكون تضحياتها لصالح مين يعنى ؟؟؟؟؟ شوية منطق ابو س ايدك."
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203061616/http://masr.20at.com:80/article.php?sid=1518"

[[comments]]
order = 18
subject = "امرهم شورى"
author = "فهد الا سلام"
posted = "2007-02-01"
text = "السلام عليكم الا خ امحترم المصرى الحزين ابعد الله عنك الحزن وشكرا على تعليقك بس والله ليس كلاموخلاص زى ما بتقول ل بد ان يكون المسلم مجاهد بغض النظر عن جهاد السلاح ولكن جهاد النفس اقوى الا سلام لا يقول شعارات وانما فعلا كم من العظماء دخلو السجون والمعتقلات فى سبيل قضية امنوا بها وان كنت تسال عن لا حرية فى وجود الا خوان ادعوك الى ان تقراء شوية ولو قلية عن الا خوان الا خوان يعملون بشرع الله وقا ل الله امرهم شورى بينهم ان كانت لا حرية بدون الا خوان فاى حرية التى تتكلم عنه ولعلم سيادتك انا والله لا اعرف احد من الا خوان المسلمين ولا احد من قيادتهما بس انا قر يت فكر الا مام الشهيد حسن البناء وسيد قطب ادعوك ان تقراء وتميزا اقرا سنة رسول الله واقراء قبل هذا كتاب الله واعرف الا سلام على حقيقتة وليس اسلام الا ذعة والتلفزيون اقراء ار اء الا ماة والشيوخ اى حرية اخى العزيز التى تتحدث عنها سياسة السجون والمعتقلات ولا سياسة الفقر والتعجيز كفانا علما نية وكفانا اراء لا نمت للا سلام من شياء وشكرا ليك على نقدك الجميل وربنا يشيل عنك الهم والغموعلى كفاة المسلمين وشكرا"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203061616/http://masr.20at.com:80/article.php?sid=1518"

[[comments]]
order = 19
subject = "تعبنا رفض"
author = "تعبنا من رفض الفساد تعبنا من رفض مبارك عايزين نطهر مصر منه ده فعلاً بقى عامل زى فرعون لما طغى وفعلاً وصل لقمة الدكتاتورية والطغيان وفاكر إنه بالطريقة دى ها يورث الحكم لإبنه المعدوم الكفاءة والسيرة الحسنة إللى كل يوم يكتشفوا فساد جديد ليه ونهب خير مصر"
posted = "2007-02-01"
text = "أخى جاوز الظالمون المدى فحق الجهاد وحق الفدا<br />عايزين ثورة عايزين حكم جديد من ناس بتخاف ربنا زى الأخوان المسلمين الشعب كله موافق على الأخوان ومبارك وعيلته اليومين دول عاملين زى السعرانيين علشان يهدموا الشعب والإخوان بالذمة دول ناس قلبهم على البلد لما كل وسائل الأعلام إللى الشعب بيتحمل تكاليفها من جرائد وإذاعة وتليفزيون مسخرة مدفوعة الأجر لمحاربة الإخوان مش ده أكبر تأكيد إن الشعب كله مؤيد ليهم وهو فاكر إن الشعب فى يوم من الأيام ها يقبل توريث الحكم للأهبل إبنه إحنا عايزني الأخوان ومش ها نوصل لكده إلا بالثورة على مبارك والقضاء على حكمة الغير شرعى الفاسد إللى وصل مصر لقاع الشعوب وحسبى الله ونعم الوكيل فيه"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203061616/http://masr.20at.com:80/article.php?sid=1518"

[[comments]]
order = 20
subject = "عنوان"
author = "واحد مصرى حزين"
posted = "2007-02-02"
text = "يا سلام على الحديث لما يبقى محترم و موضوعى ، بارك الله فيكم فهد و ياسر<br />لكن المشكله ان كلام الاخوان و حتى كتبهم متضاربه و مختلفه و قول اللى انت عاوزه ، يوم يطلعوا كتاب و بعد كده يقولوا لا و الله دى كانت افكار قديمه و تطورت ، يقولون تصريحات ثم يكذبوها ،<br />يعنى مثلا حكايه الازهر الاخيره بعد ما حدثت لم يعلق عليها الاخوان فى الاول و بعد كده خرج المرشد العام و قال ان دى كانت تمثيليه و مفيهاش حاجه و بعد كده خرج نائبه او احد قيادات الجماعه و قال لا ده خطا غير مقصود و بعد كده قال نواب من الاخوان ان القياده مكانش عندها علم مسبق اصلا بالحكايه ، وبعضهم قال كالعاده ان دى مؤامره محبوكه من الداخليه ، وطبعا انا بكلمك عن التصريحات التلفزيونيه المعروفه المصدر ، لان طبعا التصريحات الصحفيه تحتمل التكذيب. وده مثال واحد اخير فقط.<br />فماذا اقرا انهى كلام و انهى كتب ؟؟؟<br />ثانيا: انتم دخلتونى فى نفس طريقه الاخوان فى الدعوه لانفسهم عندما قال الاخ فهد اقرا كتاب الله و سنه رسوله ، لا يا عزيزى انا لا اسأل اين الاسلام من الحق و الحريه و العدل بل اسأل اين الاخوان من الاسلام ، طيب ما اللى كانوا بيقتلوا فى المصريين فى التسعينات كانوا بيعملوا ده باسم الاسلام و محاربه المجتمع الكافر ؟؟<br />الحقيقه يصعب الامساك بمنهج ثابت للاخوان على الاقل من خلال تصريحات قادتهم.<br />نقطه قالها الاخ ياسر عندما سخر من احزاب المعارضه ، لكنى ارى ان فى ضعف احزاب المعارضه لهى نقطه لا تصب فى صالح الاخوان ابدا فمعنى هذا ان من اراد المعارضه ليس امامه الا الاخوان فانت هكذا لا تضع الاخوان كاختيارافضل بل اختيار اوحد وهذا لا يدل على قوه الاخوان بقدر ما يدل على ضعف احزاب المعارضه الاخرى<br />نقطه اخرى ، هل الاخوان يستمدون شعبيتهم من مجرد م<br />اقرأ بقية التعليق .."
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203061616/http://masr.20at.com:80/article.php?sid=1518"

[[comments]]
order = 21
subject = "الاخوان"
author = "الاخوان يستمدون شعبيتهم من حب الشعب لهم وقناعته بهم وصناديق الإنتخابات تشهد على ذلك ومبارك وإبنه الذين أستنجدوا باليهود بعد أن رأوا أقبال الشعب على ترشيحهم يشهدوا على ذلك وهذا ما جعهلم أكبر مصدر أزعاج لنظام بنى على النهب والتزوير والفساد وضم إليه أصحاب رؤوس الأموال المسروقة والمنهوبه من الفقراء ليحمى نفسه ولكن حب الشعب هو المقياس وليقف الأهبل المدمن فى مناظرة مع الإخوان ليعرف حقيقته وليعرف الشعب أنه مدمن وشاذ وحقير"
posted = "2007-02-02"
text = "ما يفعله مبارك بالأخوان معروف للشعب أسبابة وهى أنه يحاول أن يهرب من برنامجه المضحك الذى لم ينفذه منذ 26 عاماً والذى به أضاف مزيد من كذبه الذى يعلمه الشعب جيداً وأيضاً ليستطيع توريث أبنه معدوم الكفاءات ولإنه يحارب قوم أصحاب فكر وكفاءات علمية فهو لا يملك إلا سلاح الإعتقال الذى يعتقد أنه به سيهزم الإخوان ولكن ثقة الشعب بهم وحبه لهم هو الذى سينقذ مصر مما يفعل بها مبارك وعائلته وغداً لناظره قريب."
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203061616/http://masr.20at.com:80/article.php?sid=1518"

