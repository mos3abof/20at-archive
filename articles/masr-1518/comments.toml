text = "أنا كواحد من عامة الشعب اللي 95 في المائه منه مسلمين أتمنى كما يتمنى الغالبيه العظمى من الشعب تطبيق شرع الله على أكمل وجه لأنه أحسن طريق للقضاء على الفساد والدكتاتوريه اللي موجوده في البلد وإن شاء الله هو ده اللي هيحصل غصب عن كل كلب علماني شاذ فكرياورأيه لا يمثل إلا نفسه ومجموعه قليله جدا من العلمانيين الشواذ فكريا والتي تتوافق أفكارهم تماما مع أعداء الإسلام<br />وأحب أقل لكل اللي بيكره مصر من أعداء الإسلام الإخوان قادموووووووووووووووون والناس هي اللي عايزه كده وأنا واحد من الناس"
