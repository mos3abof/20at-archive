[[comments]]
order = 6
subject = "الى صاحب اول تعليق"
author = "فارس_fr"
posted = "2007-01-30"
text = "انا مستغرب من تعليقك وانت بتسال \" وليه اصلا اعتقلات \" . انت نسيت ان احنا عايشين فى ازهى واحسن عصور حكم مصر - حكم الطاغيةمبارك - نسيت قانون الطوارئ , نسيت التعديل الجديد وقانون مكافحة الارهاب . فى ظل كل الديموقراطية دى وبتسال ليه ؟؟!! لولا هذه الديموقراطية المباركية التى يمارسها على شعبة لم استمر مبارك فى حكمه اكثر من يوم واحد , ياراجل دا الناس باعت ولادها من الجوع .<br />بالنسبة للاخ اللى مش عجبه ان الموقع فيه اخوان كتير ,وعلى فكرة انا مش اخوانى وطول عمرى بجتنبهم . تقدر تقولى مين اكثر الجبهات السياسية حاليا فى مصر تنظيما او شعبية او استحوذت على حب الناس من كل الطوائف وفد على تجمع على ناصري ؟؟؟؟<br />تقدر تقولى حاليا مين اللى واقف فى طريق الخطط المباركية غير الاخوان ؟؟؟؟؟ مين بيقول لا فى البلد دى غيرهم ؟؟؟ مين بيكمل لنهاية المظاهرة ؟؟؟؟ ياريت نتكلم بموضوعية شوية كفاية انهم قالوا لأ لمبارك ,, غيروامبارك الاول ارحمونا منه ومن قرفه دااحنا محصلناش الصومال !!!!!!"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203061616/http://masr.20at.com:80/article.php?sid=1518"

[[comments]]
order = 7
subject = "الأخوان قادمون"
author = "مبارك يحارب كل إصلاح ولا ينوى عليه فمن أفسد عن عمد ومن نهب وباع أملاك الشعب ومن شرد العمال ونشر البطالة ونهب ثروات مصر من سياحة وقناة السويس وباع البترول لأمريكا والغاز الطبيعى لإسرائيل بنصف الثمن لمدة 20 سنة قادمة ومن كان عميل لأمريكا وأسرائيل لن يفكر فى يوم من الأيام وخاصة بعد بلوغه الثانية والثمانين فى أصلاح فساد26 سنة زور خلال الإنتخابات لضمان إلتصاقة جيداً بكرسى الحكم ويحاول أن يورث أبنه الدكتاتور والطاغية الصغير الذى نشأ وترعرع فى بيت الطغيان والنهب والدكتاتورية ويسير على نفس درب الفساد بدليل أنظروا إلى أرصدته هو وأخوه وأمه فى البنوك وصلت لكام ومنين وهو كان موظف بنك يادوبك"
posted = "2007-01-30"
text = "بعد ذلك سنعرف الفرق بين ناس يضحون بأموالهم وحرياتهم ويلاقون ويلات العذاب فى المعتقلات من أجل مصر ومن أجل الآصلاح ومهما حاول مبارك بطغيانه أن يشوه صورهم للشعب فالشعب مدرك جيداً ولم نسمع عن أى فساد لهم ولا نهب وكل ما نراه هو رفضهم لكل النهب والتوريث الذى يرفضه الشعب أيضاً فمن حق الشعب أن يختار الآخوان وهو يرى فيهم خيرة الشعب والقيادات النظيفة لمصر<br />بالأمس كان الدكتور سعيد العريان يتحدث فى دريم 2 رجل فعلاً صادق وواثق فى ضرورة النهوض بمصر من الفساد وفعلاً راجل قيادى بمعنى الكلمة فهو لا يقف ليكذب على الشعب أو يهبل بأى كلام وهذا ما يقلق مبارك وإبنه المدمن من وجود الأخوان<br />لو كان مبارك جاد فى الإصلاح كان عرف أن الإخوان هم مصريين ومن أكفء كفاءات مصر من أساتذة الجامعات ومن رجال أعمال يتقون الله وكان سينهض بهولاء مش بالفسدة الحرامية بتوع الحزب الواطى إللى جايين زيه بالتزوير والبلطجة ولكن مبارك سيظل يكذب ويكذب ويكذب إلى أن يكذب<br />نعم للإخوان المسلمين نعم لكل مصرى شريف يحارب مبارك وفساده وعائلته التى خر<br />اقرأ بقية التعليق .."
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203061616/http://masr.20at.com:80/article.php?sid=1518"

