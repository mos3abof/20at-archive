subject = "النصر من عند الله"
author = "فهد الا سلام"
posted = "2007-01-29"
text = "هو حسنى مبارك دة مسلم اشك فى ذلك رجل يحارب ناس بتقول ربى الله وعا يزة تحكم بشرع الله فيها اية محنا جلربنا كل حا جة شيوعية اشتر كية ما ركسية وحا جات كتير لا تمس الشعب المصرى من قر يب او بعيد كل واحد قراء كتا ب فى البلد صنف نفسة ما ركسر بوذى هندوسى وحا جات غر يبة منعر فش عنها حا جة ولكن الا سلام هو دين الله ودين الدولة والدولة هى عا مة الشعب الى بيختار الى هو عا يزة لكن لا حسنى ولا غيرة وصى على هذا الشعب نعلم انكم طا غة وحقدين وعلمنين ولا يمكن لمصر ان تكون علما نية لا ن مصر بطبيعته شعب متدين يحب الله ورسولة فكفكم عنا ايها الطغاة واتركوا هذا البلد فى حالة كفا كم الم تمتلى بطونكم اعرف يا حسنى انك ميت وسوف تقابل اللة وسوف تحسب على كل هذا الا تستحى عندما تقبال رسول الله ويساك لماذا فعلت هذا تذكر انهو يوجد شى اسمة اخارة وحساب اتركو مصر التى ذكرة الله فى جميع الا ديان ولا للعلمنية ونعم لاخوان والف مليون مبروك للشاطر واخوانة والله هنوزع شربات على الناس"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203061616/http://masr.20at.com:80/article.php?sid=1518"

