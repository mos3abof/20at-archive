[[comments]]
order = 9
subject = "يعنى اموال مبارك وعيلته مش محتاجة غسيل"
author = "أموال الشاطر والأخوان المسلمين محتاجة غسيل أمال أموال مبارك وعلاء وجمال وسوزى مش محتاجة غسيل دى محتاجة حرق هى وأصحابها إللى جمعوها من نهب الشعب ومص دمه إللى جمعوها من بيع المصانع والشركات وتسريح العمالة إللى جمعوها من العمالة لليهود والأمريكان ومن المعونة الأمريكية مقابل العمالة دى يعنى بقى مش محتاجة غسيل إللى عمالين ينهبوا فيها فى حساباتهم فى الخارج"
posted = "2007-01-30"
text = "يعنى أموال الطبال احمد عز إللى محتكر حديد عز دى مش محتاجة غسيل ومكوى كمان<br />يعنى أموال الراجل إللى غرق 1400 مصرى مش محتاجة غسيل<br />يعنى أموال التجارة فى أكياس الدم الملوثة مش محتاجة غسيل<br />يعنى اموال سرطنة الشعب بالمبيدات بموافقة مبارك دى مش محتاجة غسيل<br />هى الجراثيم مش بتقف غير على أموال إلناس إللى أتبهدلوا علشان مصر وإللى كل أموالهم لتشغيل الشباب ورعايتهم وإللى إتبهدلوا فى المعتقلات من مبارك وإبنه ربنا ينتقم منهم يارب ويذوقوا إللى بيعملوه فى الشعب اللهم آمين لكن فى النهاية رأى الشعب هو الأقوى والشعب كله مؤيد للإخوان وواقف معاهم وهو مقياس الحكم على رفض مبارك الخائن العميل وأبنه المعتوه العبيط الأهبل"
archived = "2007-02-03"
capture_url = "https://web.archive.org/web/20070203061616/http://masr.20at.com:80/article.php?sid=1518"

