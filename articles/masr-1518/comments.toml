posted = "2007-01-31"
text = "احييك على شجاعتك فهد الاسلام بس ده لهو فى سبيل الله و لا هو فى سبيل مصر ، ودى وجهات نظر ، واذا كنت مش قادر تحتمل مجرد كلمات تنتقدك او تعارضك يبقى ياريت بلاش شعارات ونحن لها و بتاع ، فلا حريه فى ظل الاخوان ، والايام خير دليل على كلامى ، الا اذا كنت زى ما بيقول اخينا ده واحد من كوادرهم فالموضوع مصلحه ليس الا ، والله اعلم."
