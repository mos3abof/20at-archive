text = "نفس الاسطوانة من اكترمن تلاتين سنةنفس البيان القبض على ناس حتسرق الحكم وتوزع منشورات يعنى لوصحيح نفس الوشوش وبعديهم اولادهم وولاد حارتهم ياريس انا نفسى اشوفك ريس وبس وسيب الوطنى لحالةبدون دعاية المستفيدين وانظمام المنسحبين نفسى اجرب حكومة غير المفروضة علينا بحكم ان ريس كل المصريين انحاز لحزب دون الاخر بالطبع ياريس كل موظفين القطاع العام واللى ياخدمرتب من الحكومة عاوز ياكل عيش ويترقى ويهبش زى غيرة ادى الديمقراطيةاللى انت عاوزها ياريس انا مااعتقدش"
archived = "2007-02-03"
