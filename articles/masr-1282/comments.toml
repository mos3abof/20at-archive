order = 0
subject = "إيه الحملة السعرانه دي ؟؟؟"
author = "إبن بهيه"
posted = "2006-12-11"
text = "إيه الحملة السعرانه دي ؟؟؟ فيه إيه ؟؟؟ كل المواضيع مكلبه ليه كده ؟؟؟ كل ما افتح صفحه تهوهو في وشي ؟؟؟ يكونش يوم الكلب العالمي النهارده بمناسبة الجوله الأوروبيه لكبير السرب ؟؟؟ عموماً يا ولاد البلد نطه جريئه منكم دي اللي ملت الدنيا صويت .. وأهنيء منى سليم على الموضوع الجميل ده .. صحيح الكلاب داخت معانا .. في الشتم والسب واللعن وحتى في الهزار .. أيام ما كنا لسه بنهزر .. مره صديقي سأل صديقنا الثالث عن إبنه قائلا .. إلا صحيح عامل إيه إبن الكلب ده ؟ فما كان من صديقي الفكهي إلا أن هوهو وقام يعضه استكمالا للحالة الكلابية التي وصفه بها .. وضحكنا لما كنا لسه بنضحك .. وكنا لسه فاكرين أن الحال ممكن يتعدل والكلب يطلع صادق ولو مره .. ومرت السنين ورا السنين واتفرقوا الصحاب .. قصدي الكلاب .. ولسه الكلب على حاله .. لا صدق مره في هوهوه احده ولا طبعا ديله ممكن يتعدل ولو ربطوله فيه أبو الهول واللي حواليه .. مصمم ما يتعدلش غير في الصندوق .. أيوه عليك نور يا فاهمني انته يا عسل .. ربك يسهل ويرجع في السندوء .. الله يكون في عون الخشب ؟؟؟<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216185905/http://masr.20at.com:80/article.php?sid=1282"

