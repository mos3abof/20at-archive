posted = "2006-12-11"
text = "ارجو من كاتب الموضوع اختيار الفاظه بدقه و انه يحترم نفسه لان زي منتى بتقول عليهم كلاب و عندهم كلاب ممكن انا اقولك انك كلب و عندك كلاب تابع لهم و بتاخذ منهم فلوس بس مش من دم الغلابه في الشعب المصري لالالا من الي في الشعب الامريكي"
