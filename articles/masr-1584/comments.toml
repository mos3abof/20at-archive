[[comments]]
order = 12
subject = "مفروض ان نحرقها بجاز لا ان نذبحها فقط"
author = "ابو خالد"
posted = "2007-02-13"
text = "هاله سرحان ..كمذيعة ..هى انسانه فاشله بكل المقاييس ويشهد على ذلك طردها من الاى ار تى وطردها من دريم<br />هالة سرحان كانسانه فاشلو فقد طلقت من رجل محترم فى مكانة عماد اديب<br />هالة سرحان كسمعة وشرف معروف عنها انها صديقة الممثليين الشبان<br />هالة سرحان امرأة لاتستحى ولا تعرف للحياء اسم<br />هالة سرحان تعيش فى بؤرة فساد وتتحكم فى مجموعات ادوات فساد متعددة<br />كروتانا سينما وزمان وطرب وخليجى وهلما جره<br />الله ينتقم ممن يملك اسطول الشر هذا<br />وينتقم من هاله سرحان ويحرقها بجاز<br />العجوز الشمطاء"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 13
subject = "اذبحوها . في ستين مصيبة"
author = "مواطن مغترب"
posted = "2007-02-13"
text = "هالة سرحان تمثل القنوات الصفراء او البرامج الصفراء علي الفضائيات والتي تعتمد علي الاثارة مثل بعض الصحف الصفراء التي تعتمد علي الصور الجنسية في الترويج لها .<br />اولا كمقدمة برامج واحترافيا اتثبت الاحداث الاخيرة انها مجرد فقاعة وفقدت كثيرا من مصداقيتها التي كان يعتقد فيها البعض لانها مزورة برامج من الدرجة الاولي<br />ثانيا اخلاقيا طبعا هالة سرحان لا يختلف اثنان علي انها عديمة الاخلاق لانها تقدم حلقات مثل فتيات الليل وبهذة الطريقة التي فعلا تشوه الشعب المصري باكملة من نساء ورجال وطبعا هناك البعض الذي يقول انها الحرية واعتقد ان ما تقدمة هو ترويج للدعارة والا ما هو الهدف من البرنامج<br />ثالثا لماذا لا تتصل علي البرامج حتي تدافع عن نفسها ان كانت برئية او لها وجهة نظر مختلفة ام انها لا يهما الشعب ولا الراي العام<br />رابعا هل تستطيع ان تقدم نفس الحلقة عن اي دولة خليجية مثل السعودية ( زي ما بيقول الاستاذ مجدي ان فتيات الليل موجودين والدعارة موجودة بس احنا بنقولة ومش موجودة بس في مصر . فلماذا فتيات مصريات فقط"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 14
subject = "هاله تدمــــيـر"
author = "أبو أحمد المصري"
posted = "2007-02-13"
text = "والله ما رأيت برنامج بيدمر عقول الشباب زي برنامج هاله سرحان مش عارف الحكومة المصرية ليه ساكته على كل مشاهد الخلاعه والمجون وحلقات الدعارة .<br />على رأي مصطفى بكري ده مش برنامج ده كباريه . منها لله ."
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 15
subject = "أمال نسألها إمتا؟؟؟؟؟؟؟"
author = "الأخ مجدي بيقول:"
posted = "2007-02-13"
text = "\"خطأ هالة سرحان لا يستدعي أن نسن السكاكين، ولا يتطلب إبلاغ السلطات ضدها، واتهامها بأنها خدعت هؤلاء الفتيات غير البريئات.<br />أمال خطأ إيه اللي يستحق سن السكاكين يا بتاع؟<br />أكيد ورا مقالك ده مصلحة وغرض في نفس يعقوب<br />فعلا أن باتفق مع الأخ اللي بيقول \"واحد كان بيحترمك\" لأني فعلا فقدت احترامي لك إلى غير رجعةوهذا بالفعل ما حدث مع كثير من الذين \"كانوا\" يكنون لك \"بعض الاحترام\"<br />نذبحها إمتا يا عم مجدي لما تجيب سمعة مصر في الحضيض ونتعاير بين خلق الله بإننا بلد الدعارة يعني هيه كانت ناقصة؟؟؟؟<br />سلملي عالوليد وفلوسه يا عم مجدي \"مهنا\" وخلاص ولسه هيهينا كمان وكمان<br />اشجينا يا عم الكتكوت"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 16
subject = "الأخ الجورنالجي مجدي مهنا.. نرجو الإيضاح"
author = "واحد جاي في الأيام السودا"
posted = "2007-02-13"
text = "لا تذبحوا هالة سرحان؟؟ إلى من وجهت هذا النداء ؟؟<br />هل إلى أوركسترا الإعلام الساحب وراة الشعب من ديله وعمال يلف بيه على المواخير والكباريهات والعنب العنب والبلح البلح والرقص في نص البلد والنط على المحصنات الغافلات في عز الزحامات؟؟؟<br />أم أنك توجه هذا النداء لكبراء المسئولين اللي ماحركشي فيهم شعرة غرق العبارة بمئات الغلابة ولا حريق قطر الصعيد بآلاف الغلابة ولا حريق مسرح بني سويف بعشرات الغلابة ولا الدم الفاسد الملوث لأجساد آلاف الغلابة ولا حديد عز اللي ..ملايين الغلابة ..وجاي بس يحرك كل الشعر اللي فيهم موضوع الأخت الست الفاضلة المربية الشريفة العفيفة الطاهرة الحاجة هالة سرحان ( نظرة ياست ومش هاتقدر تغمض عنيك)؟؟؟<br />أم أن النداء كان لأهالي الفتيات المجرمات اللاتي لا عذر لهن لأنهن قبضوا وجبة وفلوس وهن بكامل الإرادة . فالمفروض ألا يذبح هؤلاء الأهالي هالة سرحان وأن يترفقوا بها لأنها أرسلت لهم مع بناتهم فضلات طعام زيادة لهم فهل جزاء الإحسان إلا الإحسان ؟؟<br />أم أن النداء أخيرا موجه إلى الشعب ...علشان كل عيل فيه اتعلم له كلمتين وبقى جورنالجي ولا مذيع مش عايز حد يغمض عنيه ولا ظابط شرطة عنده عقدة السادية والنقص ولا لعيب كورة طول ما راكب عربيته يظرب عسكري مرور على قفاه ولا وزير رمة بيبع في عضم البلد ولا ولا ولا كل واحد بقى لا مراعي حرمة دين ولا عرف ولا أخلاق ولا انسانية ولا كرامة ولا عفة ولا أخلاق .. وكله بيخدم كله على قفا الشعب ..آه ياقفا"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

