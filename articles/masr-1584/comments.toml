text = "اتفق مع الاخ محمد سالم تماما<br />يبدو ان مجدي مهنا ظن انه يتحدث الى مجموعه من البلهاء<br />مجرد كلماتك يا استاذ مجدي هي اهانه لعقولنا<br />يا صحفي يا كبيبر"
