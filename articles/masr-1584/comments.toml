[[comments]]
order = 1
subject = "هاله و هاله"
author = "نيفين نيفى نوفا"
posted = "2007-02-13"
text = "انا شايفه ان هاله سرحان هى المسئوله الاولى و الاخيره ف انهيار مستواها و بالتالى مستوى برامجها الى الحضيض<br />هاله سرحان الصحفيه افضل من هاله سرحان الاعلاميه<br />و هاله سرحان الاعلاميه زمان افضل من هاله سرحان دلوقتى<br />للاسف هى بتهدر قدراتها كمذيعه ذات صوت رنان و حضور اسر مميز ف موضوعات رخيصه و هايفه ممكن اى قناه فضائيه بتعرض كليبات تقوم بيه<br />بالتالى هى المسئوله<br />كان ممكن تبقى اقوى من كدا بكتير لو استغلت قدراتها الاعلاميه ف اختيار محتوى برامجى افضل<br />بس الظاهر ف العبث الاعلامى من السماوات المفتوحه هو دا اللى بيعجب الناس<br />يمكن"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 2
subject = "عيب عليك يا مجدي تدافع عن التلفيق والفبركه .."
author = "واحد كان بيحترمك- محمد سالم"
posted = "2007-02-13"
text = "اولا ::ارجو من ادارة الموقع حذف هذه اللينكات الغريبه<br />ثانيا:: عيب عليك يا استاذ مجدي لما تقلب الحقائق وانت صحفي اظنك محترم..تلفيق وفبركة المشاهد ليس من العمل الصحفي في شيء...هذا كذب ودجل واستهتار بعقول الناس ويجب ان يعاقب صاحبه ويمنع من ممارسة العمل لصحفي....وهناك فرق كبير جدا كما بين السماء والارض عندما يستعين بمشاهد تمثيله لكي يوضح للناس موقف معين مع اخبارالمشاهدين بان هذا مشهد تمثيلي..وبين فبركة موضوع كامل علي اساس انهم اشخاص حقيقين باستخدام المال والنفوذ مع هؤلاء الفتيات...وهم طرف في الجريمه ..لكنهم ليسوا بقوة هاله سرحان ونفوذها لذلك لن تجد من يدافع عنهم<br />ثالثا...نعم الدعاره موجوده والشرطه الفاسده موجوده لكن هل هذا مبرر لاختلاق الاكاذيب والحكايات المفبركه ..ومن اجل ماذا؟؟<br />استحلفك بالله هل تصدق يا مجدي مهنا ان غرض هاله سرحان هو كشف الفساد والرذيله؟؟<br />هل عندما تلقن هاله سرحان احدي الفتيات انها تكسب عشرة الاف جنيه في اليوم من ممارسة الدعاره...هل تقصد هاله سرحان نشر الفضيله..ما رايك عندما تسمع فتيات فقيرات لا يجدن قوت يومهم ان العمل في الدعاره وبيع شرفهن سيحقق لهم هذا المكسب الخرافي في اليوم<br />*** استحلفك بالله يامجدي يامهنا ...احترم عقولنا ...ولا تصغر من نفسك بالدفاع عن هذه الساقطه<br />****الم تسال نفسك يا مجدي لماذا رغم ان القناة سعوديه ويملكها الامير الروش الوليد ابن طلال ..لماذا لم تناقش ابدا سلبيات المجتمع السعودي...وهل تستطيع هاله سرحان ان تتناول سلبيات المجتمع السعودي المتخلف وما اكثرها ...هل تستطيع ان تتكلم عن الطلاق لعدم تكافؤ النسب مثلا ... وتجيب اصحابها العواجيز من امثال ايناس الدغيدي ويسرا علشان يعلقوا علي الموضوع ..ويعطوا نصائهم للمجتمع السعودي....او تتكلم<br />اقرأ بقية التعليق .."
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 3
subject = "بقية التعليق السابق"
author = "محمد سالم"
posted = "2007-02-13"
text = ".او تتكلم مثلا عن استعباد العماله المصريه في السعوديه وما يلحق بهم من ظلم ومهانه<br />مفيش الا مصر بس..بقت كلها دعاره وممارسة عاده سريه ,,,ومجتمعات الملائكه الخليخيه مفيش كلمه عنها<br />*** وعلي العموم اطمئن يا مجدي...هاله بنفوذها ونفوذ الامير الروش الامير بن طلال ولوبي الفساد في مصر هتطلع منها زي الشعره من العجينه وهليلبسها البنات التلاته...بس يستاهلوا...متزعلش اوي علي الست هتطلع وتنشر فكرها الراقي وتحارب الفساد معاك يا سي مجدي<br />وسلملي علي مكافحة الرذيله ونشر الوعي الاباحي بين اركان مصر المعموره"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 4
subject = "بالعقل والمنطق--- بطلي كذب ياهاله"
author = "محمد"
posted = "2007-02-13"
text = "هل المومس التي دخلها 10000 جنيه بحاجه الى 200 جنيه من هاله سرحان؟ ما الذي يجبر واحده دخلها عشرة الاف لتقبل بيتزا و 200 جنيه من هاله سرحان ؟؟؟؟؟؟البنات بسطاء مغلوب على أمرهم لا شك"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 5
subject = "ردا على الاخ محمد سالم / ياريت لو تذبحوا هالة سرحان"
author = "فارس_fr"
posted = "2007-02-13"
text = "اولا سلمت يمينك وصح لسانك , بيتهيالى مفيش احسن من الرد اللى انت قلته . واتمنى ان اغلب الناس تكون بنفس وعيك وتكون فاهمة ايه اللى بيحصل حوليها .<br />بالنسبة للساقطة هالة سرحان فهى بالنسبة لى ليست الا انسانه سافله وضيعة تستخف يعقول الناس تدير لقاءاتها وحواراتها بسخافة وقلة حياء .لا تستطيع ان تنطق بكلمة نقض واحدة فى حق \"براميل الجاز \" . اولياء نعمتها !!!!<br />ولكنها تبث سمها فى حق ابناء وطنها . ولم اعتقد ان الغرض من حلقاتها عن بنات الليل كان التقويم او التعديل ولكن ومن المؤكد انه الدعايات والاعلانات فمنذ متى تخرج لنا هالة سرحان اى قيمة او فضيلة بداية من استضافة الراقصات - امثال دينا- ومغنيين ال السبكى -سعد الضغير _ هل هؤلاء من نستقى منهم القيم والمبادئ .<br />وياريت لو تذبحوها فى ميدان عام وتريحونا منها ومن امثالها ."
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 6
subject = "تلك التى لاتعرف الحياء"
author = "زهرة الرمان"
posted = "2007-02-13"
text = "المصرية العفيفة الشريفة ذات التربية الطيبة تعرف الحياء حتى مع زوجها<br />اما تلك المرأة الفجة ذات الوجة والجلد السميك الذى لايخدشة حياء ذات الالفاظ الوقحة والتى تسميها جراءة وفى راى بنات الاسر والناس الذين يبغون الستر هى وقاحة وقلة تربية<br />الا تعرف الفضيلة المصرية التى تطلب بستر مالم يفضحة اللة<br />ان التلفظ باقوالها داخل بيوتنا ممنوع اخلاقيا وادبيا واستمعوا اى جلجلة ضحكتها المشروخة كضحكات شاربى الخمور والصايعين من بنات قارعة الطريق<br />ان تختار المواضيع فى حلقاتها التى تناسب تربيتها المنحلة كى تنشر فسادا فى المجتمع وتفتح عيون البنات الصغيرات على مواضيع الانحلال الاخلاقى والفحش اللفظى بكل مفهومة<br />انها ليست قدوة لبنات بلادى بل هى نقمة<br />وتحض على نشر الرزيلة والخلق السىء<br />فعليك لعنة اللة ويالك من امرأة فاسدة سوأت سمعة بنات بلادك"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 7
subject = "هاله سرحان .. والظلاميين من امثالي انا وفارس"
author = "محمد سالم"
posted = "2007-02-13"
text = "اخيرا اتفقنا عي حاجه يافارس<br />ههههه طيب دي لازم بركات الست هاله...شوفت طلع ليها فوائد ازاي..الست هاله اما تعدي الازمه دي بمعاونه الاخوه المستنيرين في مصر ...هتطلع بطله وشهيدة العمل الصحفي<br />وامثالنا من الظلاميين والرجعيين يخبطوا دماغهم في الحيط<br />فيه اخره وفيه حساب بدون تدخل نفوذ ولا معارف ولا وساطات ولا امراء"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 8
subject = "لا ياسي مجدي"
author = "ابن النيل"
posted = "2007-02-13"
text = "يا مجدي يا مهنا اتق الله ولا تدافع عن فساد وعن امرأة فاجرة موضوعاتها وحلقاتها تمثيل في تمثيل كما تعرف ولكن لا تمثل هذه الساقطة علي حساب سمعة مصر وبنات مصر اولا مهنة الدعارة موجودةفي كل دول العالم سواء علنا اوسرا واقسم بالله انها منتشرة في السعودية وخاصة ف جدة وهناك بعض الاماكن والاحياء معروفة بالاسم فهل تستطيع ان تعمل برنامج وشو علي الدعارة في السعودية مثلا او الامارات والبحرين وهي هناك علنا في معظم الفنادق لا يوجد سوي مصر لانها عارفة كويس ان مصر في عهد حسني بقت ملطشة حومة وشعبا للي يسوي واللي ميسواش وهي امن تماما من اي رد فعل جاد حتي لوسبت وزير الداخلية لانها تعمل تبع الوليد بن طلال اللي ممكن يشتري سكوت الحكومة وحسني الجبان باي مبلغ ووجود امثالك ممن يدافعون عن المعلمة هالة سرحان يا مجدي اتق الله وخليك مع شعب مصر للفظ امثال هذه القاذورات"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 9
subject = "لا اختلاف فى الحق ....ا محمد سالم"
author = "فارس_fr"
posted = "2007-02-13"
text = "عندما تنطق كلمة حق من فم احد منا لابد لنا ان نتفق عليها جميعا ولا نختلف ,,, واعتقد ان كل الشرفاء واصحاب الضمائر اليقظة متفقين على عدم اهلية هالة سرحان لتسوق لناالقيم والفضيلة . مثلما ينادى بعض الليبراليين والعلمانيين , ومن المؤكد انهم سيسعون لاخراجهامن هذا المازق .<br />لا اختلاف فى الحق مادمنا متفقين على انه الحق كل حسب وجهة نظره ."
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 10
subject = "اذبخوها و ابصقوا على جيفتها"
author = "طيف بدر"
posted = "2007-02-13"
text = "بالطبع هناك من الفاسدين و شواذ الفكر من سيدافع عن الساقطة هالة سرحان .<br />إنها الحقيقة ... و لا أحد يجادل فيها ... هالة سرحان كاذبة أساءت إلى سعب مصر بالكامل و جعات نساءه بنات ليل و مومسات مثلها... هي كاذبة ولا يستطيع ليبرالي ابن زنا سلولي معادي للإسلام أن يجادل في ذلك<br />شئء طبيعي ممن أصابه شذوذ عقلي و فكري أن يدافع عن كاذبة و لكنه مستعد لذبح الدعاة إلى الله و الذين يأمرون بالإصلاح بين الناس و أن يتهمهم بالإرهاب و التطرف و الرجعية<br />يا كاتب المقال : أي فندق قضيت فيه ليلتك مع هالة ؟"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

