[[comments]]
order = 18
subject = "اذبحوها"
author = "فهد الا سلام"
posted = "2007-02-14"
text = "هالة سرحان دى عاوزة الدبح بس فى ميادان عام كفانا قلة اداب مين هالة سرحان دى اللى عطينة اكثر من حقة ما هى الا دعارة وامرة شاذة لية منتكلمش على ناس محترمة من امثال الدكتورة عبلة الكحلاوى وسيدات كثرات فى مجتمعنا يستحقوا الا حترام ولا احنا مش بنعرف نتكلم غير فى الكلام الفاضى يعنى لما تحب تسال عن هالة سرحان ومين صحابهاهتلاقى يسرا ايناس الدغيدى عبير صبرى وناس ملهاش دعوة بلا حترام كفانا دعارة جسدية وفكرية البلد فيهة ناس محترمة كتير بس الى عاوز يشوف"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 19
subject = "ارحمونا يا كلاب"
author = "مصرى فى الخليج"
posted = "2007-02-14"
text = "وكأن الحكاية كانت ناقصة هاله زفت سرحان . يا اخ مجدى مهنى يا صحفى يا كبير كان نفسى تعيشلك فتره كده تشتغل فى الخليج ولا فى اى دوله عربيه وتقول رأيك بعد الحلقه . ...هاله سرحان خلت سمعتنا فى الوحل الفاجره . بقى هيا دى مصر ودى بناتها كل اللى يعرفوه الدعاره والفجور والبارات والقرف انت لو تعرفو المصريين اللى عايشين بره مصر حاسين بأيه كنت شنقت نفسك يا مجدى ده لو كان لسه عندك كرامه وعموما فعلا لو هاله سرحان اعلاميه ويهمها الحقيقه تيجى تعمل موضوع عن الدعاره فى الخليج وتشوف الدعارة بجد تيجى تشوف دبى واللى بيحصل فيها علننا فى الشوارع والسعوديه والكويت وقطر وكل الخليج لكن الظاهر اننا فعلا بقينا ملطشه بسبب ا.. اللى زي هاله وامثالها ـ بس الحق مش عليك يا مجدى ولا على الفاجره الحق علينا احنا المصريين اللى سايبين واحد فاجر زى حسنى يحكمنا لحد ما خلى راسنا فى الوحل"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 20
subject = "حالة البلد و حالة البلاده !!!"
author = "احمد"
posted = "2007-02-14"
text = "فى حاله فى مصر غريبه هى ان الاعلام بيحاول يفرض على الناس نجوم بالعافيه، زى هاله هانم و زى الامور تامر حسنى - ماهو نفس الموقف البائس و النذل<br />الغريبه ان تامر حسنى تذاع له اعلانات عن الحفله و كأنه بطل يستقبلوه باكليل الغار<br />، و كمان الفرق اللى عمال يزيد بين الفقر و الغنى فى مصر ، الواحد بقى بيحس ان الناس اللى بتحكم و هم الحمد لله ينتمون لطبقة رجال الاعمال لا يعرفون شئ عن الفقراء<br />و ان كان يعرفون فهم لا يحركون ساكنا<br />زى الملكه اللى قالولها الشعب مش لاقى العيش ، قالت ياكلوا جاتوه !!<br />الحكومه سايبه الدنيا تولع و كل همها الاخوان المسلمين اللى الاعلام برده بيحاول على قد ما يقدر انه يخوف الناس منهم<br />كل حادثه بتحصل فى مصر صغيره و لا يلتفت لها<br />انا كان ليه اخ عمره 19 سنه كل ذنبه ان ربنا هداه و ابتدى يصلى الفجر شهر واحد و الامن حامى الوطن حطوا علينا فى البيت و خدوه ولا اعتى مجرم وسط ذهول ابيه و امه المريضين الساعه 2 بالليل<br />حسبنا الله و نعم الوكيل"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 21
subject = "سؤال ؟ وأريد الإجابه"
author = "فلاح مصري"
posted = "2007-02-14"
text = "( ياريت كل واحد يسأل نفسه ) هذا السؤال<br />ليه كل شيء تغير في مصر من السوء للأسوأ<br />ليه كل الدول بتتقدم في مجالات العلم وإحنا بتقدم في البرامج التافهة والمسلسلات والأفلام الهابطه . كان ممكن واحده زي هاله سرحان تكون مثل وقدوه في تقديم برنامجها وحلقات فتيات الليل بأسلوب علمي ومناقشه جادة تفيد الشباب دون المساس بسمعة مصر .<br />مش هاله سرحان بس هى إللي أساءة سمعة مصر<br />فيه ناس كتير أساءو .<br />منهم الرئيس مبارك . بسياسته العقيمه التي لا تتغير ولن تتغيير .<br />ورئيس الوزراء بتاع اللب مش هامه مصلحة البلد طالما إنه شبعان .<br />رئيس مجلس الشعب أحمد فتحي سرور صاحب مدرسة المشاغبين .<br />ووزير الثقافة<br />وشيخ الأزهر إللي فضحنا على قناة الجزيرة لما سألته المذيعه عن دور الأزهر في مسألة القدس وقال في فيه أيه في القدس .<br />ومعتقلات الاخوان وأصحاب الرأي الحر الشريف<br />كل شيء في مصر متبدل .<br />الأوضاع في مصر محتاجه لثورة .<br />أسف على التطويل<br />السؤال هو إلى متى يبقي الحال في مصر كما هو ؟"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 22
subject = "قال ثورة قال"
author = "مصرى فى الخليج تانى"
posted = "2007-02-14"
text = "ثورة مين يا فلاح يا مصرى يا .. أصيل مين اللى هايعمل الثورة الناس اللى مستحمله الظلم والهوان والفقر والمرض والتعذيب والاهانه خمسه وعشرين سنه ولا الاخوان المسلمين ولا الاحزاب اللى زى قلتها ولا المثقفين بتوع التنظير والكلام الحنجورى من غير افعال ولا الجيش اللى بيتطهر اول بأول ولا الشباب العاطل اللى حكومة حسنى الكلب خلت نصهم مدمنين ..... انت بتحلم بمعجزه فى زمن مفيهوش معجزات لما .... لكن جايز الناس تصحى بعد السنين دى كلها ... بتمنى ... وجايز اكون بحلم"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 23
subject = "لا تياسوا"
author = "نفر من انفار مصر"
posted = "2007-02-14"
text = "ان بعد العسر يسرا<br />ضاقت فلما استحكمت حلقاتها فرجت وكنت اظنها لا تفرج<br />الحل سيأتى من عند اللة<br />وربنا سيأخذهم اخذ عزيز مقتدر<br />وكل الحقوق ستعود لاصحابها<br />والحرامية سيودعون السجن<br />والخونة سيعدمون<br />اصبروا انتقام اللة قادم<br />لقد كثرت دعاوى المظلومين<br />اتقوا فراسة المؤمن فانة يرى بنور اللة"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 24
subject = "موتوا او انفجروا"
author = "برضه مصرى فى الخليج"
posted = "2007-02-14"
text = "لا...لا...لا أملك إلا أن أتكلم<br />يا أهلَ مدينتنا<br />يا أهل مدينتنا<br />هذا قولي<br />انفجروا أو موتوا<br />رعبٌ أكبرُ من هذا سوف يجيء<br />لن ينجيَكم أن تعتصموا منهُ بأعالي جبل الصمت...أو ببطون الغابات<br />لن ينجيَكم أن تختبئوا في حجراتكمو<br />أو تحت وسائدِكم...أو في بالوعات الحمَّامات<br />لن ينجيَكم أن تلتصقوا بالجدران<br />إلى أن يصبح كل منكم ظلا مشبوحا عانقَ ظلا<br />لن ينجيَكم أن ترتدُّوا أطفالا<br />لن ينجيَكم أن تقصر هاماتكمو حتى تلتصقوا بالأرض<br />أو أن تنكمشوا حتى يدخل أحدكمو في سَمِّ الإبرة<br />لن ينجيَكم أن تضعوا أقتعة القِرَدة<br />لن ينجيَكم أن تندمجوا أو تندغموا<br />حتى تتكون من أجسادكمُ المرتعدة<br />كومةُ قاذورات<br />فانفجروا أو موتوا<br />انفجروا أو موتوا"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 25
subject = "ما تخافش يا استاذ مجدى"
author = "بسمة"
posted = "2007-02-14"
text = "انا مش عارفة هل الاستاذة الصحفيين اللي بتنزل مقالاتهم على الموقع ده بيتابعوا تعليقات الناس والا هما في وادى والناس في وادى تاني اتمني ان تتابع يا استاذ مجدى راى الناس علشان لاتكون اعلامي منفصل عن الجمهر العادى الذى يمثل الغالبية الساحقة من الناس لاننى ما زلت احترمك كصحفي واعلامي انا بضحك جدا لما اسمع معتز الدمرداش وهو بيقل عندنا حرية اعلام ولما منى الشاذلي تقول ما عندناش سقف في المحطة وعمرو اديب وهو بيقول احنا ما حدش بيقول لنا حاجة ومحمود سعد في ال ام بي سي يقول انا عمر ما حد فرض عليا اقول ايه واخيرا هالة سرحان شعارها احنا في عصر السوات المفتوحة وكله مفتح علي بعضه كل التصريحات دى كذب وخداع لان الاعلام العربي كله توجهات وانا استغرب ان الحتقة دى بس اللى عملت ضجة الحقيقة ان كل ما قدمته هالة سرحان يدعو للغثيان بل انه بعيد كل البعد عن الاعلام او حتى التسلية انها الاثارة الفاجة بلا هدف وموضوع فتيات الليل كان ممكن قوى تستعين بالارشيف السنمائى الذى تملكه روتانا وفيه اعترفات ومشاهد فيلميةوحتي انحرافات بعض رجال الشرطة موجود وهذه هى المهنية اما حكاية ان مصر مستهدفة اعتقد ان المصريين اللذين يعملون بالخليج يعلمون ما لانعلمه نحن هنا في مصر ما يحدث وبخصوص ان الخلجيين او الاخوة العرب بيجوا مصر علشان بنات الليل دى نكتة جامدة قوى لانهم عارفيين ان مصر في ذيل قائمة الدول التى ياتوا اليها لهذا الغرض والحقيقة يا استاذ لو هالة سرحان او غيرها من الاعلاميين عايزين يعرفوا سبب الدعارة والفساد وكل امرضنا فعليهم فتح ملفات اموال الحكام والروساءلعرب علشان نعرف مين السبب في اللى احنا فيه"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 26
subject = "هاله هى الفجور بعينه"
author = "احمد منصورى"
posted = "2007-02-14"
text = "بصراحه البنات دول مساكين ووقعوا ضحيه للست هاله اللى غرضها تعمل فرقعات اعلانيه وخلاص ومش مهم السمعه والكرامه. اللى عرفناه ان البنات كانوا بيمثلوا وان الست هاله اعطتهم وعد بان صورهم واصواتهم لن تظهر وغلطتهم انهم وثقوا فيها. الحلقات تسئ فعلا لمصر وهاله تستاهل انها تتحاكم وتاخد جزائها. البنات هن ضحيه الفقر والبطاله والقنوات التليفزيونيه الداعيه للفجور. بنات غلابه مساكين فى زمن ممسوخ فيه هاله سرحان مثل لامثالهن. لكن مصر بخير بشبابها الخلوق الى بيعرف العيب وبشعبها الطيب اللى بيلفظ فى النهايه الشواد امثال هاله وغيرها. رفقا بالبنات لانهم استدرجوا بواسطه واحده من شياطين الانس بل واحده من اعوان الشيطان نفسه ليس عندها ضمير ولااخلاق وغلطتهم انهن وثقن فيها وسرن ورائها ولايعلموا انها من بنات ابليس."
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215080221/http://masr.20at.com:80/article.php?sid=1584"

[[comments]]
order = 27
subject = "تموت الشريفة ولا تأكل بثديها"
author = "أ.د.عوض عباس رجب"
posted = "2007-02-22"
text = "الشرف أمر هام في حياتنا ولقد قيل قديما(الذين أختشوا ماتوا)(تموت الشريفة و لاتأكل بثديها)<br />اذا كانت هالة سرحان اخطأت في حق المجتمع المصري قيراط فان الفتيات الشاكيات قد أخطأن في حق أنفسهن و أسرهن مليون قيراط<br />وهذا ما جناة شعب مصر الحضارة من هالة سرحان و أمثالها من الداعرات بدعوة الحرية و الحضارة<br />أعتقد اعتقاد جازم أن سبب الشكوي هو الأختلاف علي قيمة بيع شرغ و عرض البنات الشاكيات"
archived = "2007-02-23"
capture_url = "https://web.archive.org/web/20070223100607/http://masr.20at.com:80/article.php?sid=1584"
