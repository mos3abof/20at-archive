author = "هيثم"
posted = "2009-05-11"
text = "والله يا جماعة انا شايف ان التاكسي الابيض ظريف جدا ومريح وبيبعدني عن المناهده مع السائقين ده من وجهة نظري كزبون , لكن بصراحه الله يكون فعون اصحاب التاكسي الابيض لانهم ارغموا علي تبديل التاكسي القديم بتاعهم وحسابه بـ خمسة الاف جنيه بس , مش بس كده لأ وكمان يدفعو الاقساط مع البنك , يعني الحكومه بتنضف البلد علي حساب اصحاب العيال , سواء كانو سائقين او زباين , احنا البلد الوحيد اللي بيدوس علي ناسه حتي واحنا بننهض بالمظهر الحضاري بندوس عالغلابه اكتر واكتر , المشكله دلوقتي مش اني هركب الابيض ولا الابيض فسود , المشكله ان ميجيش يوم يرغموني ابدل شقتي القديمه بشقه 50 متر في اخر الدنيا وكمان ادفع اقساطها !! ,, يا حبيبتي يا مصر !!"
archived = "2009-07-08"
capture_url = "https://web.archive.org/web/20090708113120/http://www.20at.com:80/masr/t7kyk/12006--x-.html"

