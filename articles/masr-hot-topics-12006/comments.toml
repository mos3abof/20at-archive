text = "المشروع جميل و لكن للاسف اصحاب بعض التاكسيات من هذا النوع يقومون بالتلاعب فى العداد ركبت من الجيرة لمنتصف شارع الهرم عدة مرات بتكلفة 7 جنهات تقريبا و اليوم ركبت مع تاكسى رقم 629 fmr نفس المسافة بتكلفة 11.5 جنيه سوف تضيع سمعة هذا التاكسى سريعا بسبب الغش الذى يحدث من خلال بعض اصحاب هذه التاكسيات فيجب ان تكون هناك مراقبة دورية على العداد و تغريم كل من يحاول التلاعب به"
