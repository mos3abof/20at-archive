text = "وحياة ابوكم<br />صغروا الخط شوية لحسن دا كبير اوي<br />حرام كده الخط يبقى بهذه الصورة<br />صغروه شوية حرام عليكم<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــت<br />مش شريفك الدواخلي ولا البراء اشرف<br />مش رضوى حسن ولا مروى صلاح<br />مش احمد الهواري ولا عبدالله الطحاوي<br />ـــــــــــــــ ـــــــــــــــ ـــــــتت<br />صغروا الخط شوية بأه"
