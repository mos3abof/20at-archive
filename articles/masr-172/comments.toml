[[comments]]
order = 0
subject = "لا هنتكلم ف السياسه"
author = "نيفين"
posted = "2006-04-20"
text = "السياسه:حاليا مهنه من لا مهنه له<br />فلسطين:الخنجر المزروع ف قلب كل عربى (حر)<br />مصر:البنت اسمرا الجميله اللى عمرها 7000 سنه<br />اللى شافت كتتير و لسه هتشوف و صابره لما ولادها ياخدو حقها ف يوم من الايام<br />تغتنى الحزب الوطنى:اقذر لعبه بتتلعب على الشعب<br />ضحك ع الدقون<br />سلامات يا حزب"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907035357/http://masr.20at.com:80/article.php?sid=172&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "مليش في السياسه"
author = "داليا"
posted = "2006-04-20"
text = "كان هناك اعلان كنت اشاهده وانا صغيره يدور حول استطلاع الناس حول سلعه ما يعني جودتها متانتهاعلي ما اتذكر ولما سألت المذيعه أحد الاشخاص رد وقال انا ما بتكلمش في السياسه! فكان مثار ضحك وشر البليه ما يضحك لأن السياسه بتدخل في كل شيئ"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907035357/http://masr.20at.com:80/article.php?sid=172&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

