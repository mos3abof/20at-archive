author = "جورج المصري"
posted = "2006-09-19"
text = "دعونا من نبرة الاعتذار او عدم الاعتذار ثمت شيئ في صورة الاسلام معطل بسسب ممارسة اتباعه والعالم يرانا هكذا فهل نجبره ان يغير رأيه من اجلنا.. العالم الاسلامي متخشب ومتعب وفي زيل الامم وهناك نصوص تحتاج ان نفهما من جديد ولدينا مشهد دموي حافل في سجل التاريخ مثل امم كثيرة وولغت الحضارة الاسلامية في دماء ابرياء مثل حضارات اخرى"
