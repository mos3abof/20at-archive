posted = "2010-02-13"
text = "على فكرة الإحساس دا طبيعى بس اللى مش طبيعى طريقة التنفيس عنه<br />انتى ممكن فعلا ترقصي بس فالبيت او مع اصحابك البنات او زوجك لو كنتى متزوجة<br />وممكن تدخلى المطبخ وتعملى أكلة جديدة وتفاجئي بيها الناس<br />ممكن تنزلى تمشي في أماكن غريبة انتى مرحتيهاش قبل كدا او تمشي بسرعة على البحر او الكورنيش وانتى فاتحة ذراعاتك وبتبتسمى للسماء<br />او تسافرى رحلة لمكان جديد وممكن موضوع البحر دا بس طبعا مع الإلتزام بالزى الشرعى<br />وربنا يهدينا"
archived = "2010-02-14"
