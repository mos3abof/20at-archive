subject = ""
author = "مصري صميم"
posted = "2009-11-21"
text = "أيه الكلام إل مالوش طعم ده … يعني واحد بمكالمة تلفونية لبرنامج تلفزيوني نرشحة لرأسة مصر؟؟ !!! عجيب والله … صحيح الرأسة رخصت ومبقلهاش قيمة زي العمدية دلوقت مقارنة بزمان … بس مش للدرجة دي … على كده أطلب من كل من يريد أن يكون رئيس لمصر بأن يتصل على البرامج التلفزيونية ويسجل أكبر عدد ممكن من التعليقات ويقول رأيه ي الأحداث الساخنة … طبعاً بعد التدريب على دموع التمسيح وكيفية اللعب بنبرات الصوت… وبالمره أكون أول الممثلين … أسف أقصد المرشحين … وعجبي على سذاجتنا المفرطة … وفي النهاية أحب أن أوجه سؤال واحد وجيه او وقح … من هو جمال حسني مبارك؟ ومن هو علاء حسن مبارك ؟ومارصيدهم كي يكونوا مرشحين لرأسة مصر؟ بل من هو أبوهم حسني مبارك ؟ فهل يتوازى مافعله مع حكم لمدة … هو بقاله قد أيه في الحكم أصلي تعبت من العد…!! متفوقوا بقه."
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124105707/http://www.20at.com:80/masr/hot-topics/14115-2009-11-21-10-41-13.html"

[[comments]]
