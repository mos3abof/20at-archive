text = "علاء مين ياعم! هو يعني لازم يفضل مبارك وأولاده راكبين غلي ضهورنا؟ ايه التخريف و التخلف اللي احنا فيه؟؟؟؟؟!!!! يا ريت كان عند مبارك و الجوقه بتاعته نفس الحماس و النخوه لما تأكدوا ان اسرائيل أعدمت الجنود المصريين بعد أن أسرتهم سنه1967 اوقامت بدفنهم أحياءز فين كن النظام؟ مين حباخد بتار الشهداء؟ اصحى يا شعب!!!!!"
