text = "طب انت ما سمعتش اتصاله بالبيت بيتك الصبح امبارح 9-10 صباحا<br />و اول امبارح الجمعة بالليل اتصاله بالبيت بيتك و اتصال جمال مبارك بالبيت بيتك<br />ماهو انت لو كنت سمعت بقية المكالمات كنت هتشرحه رئيس للامم المتحدة مش رئيس لمصر بس<br />تاني نقطة : انا استغربت قوي لما قال انه بيحترم ابراهيم عيسي ..<br />لان اخوه لا يحترم اي حد خصوصا منافسيه و عنده استعداد يسلخهم احياء المهم يوصل"
