text = "الوباء دة بمكالمتة عمل اية<br />الجزائر كشت<br />خافت<br />ماتت فى جلدها<br />قالت يا مامى<br />وابوة نفسة يقدر يعمل اية للجزائر<br />وقيمة مصر اية دلوقتى<br />دا احنا بنبوس ايدين السودان وليبيا علشان يروحوا يصالحونا على الجزائر<br />بطلوا هبل<br />واللى بيقول خير اجناد الارض دة جاب الكلام دة من اين<br />ما احنا كل معركة بنجرى ونقول يا فكيك"
