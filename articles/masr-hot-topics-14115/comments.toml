text = "يا جماعة حاجة كويسة ان ابن الريس يحسس الناس العاديين انه زيه زيهم …انسان بيحس و يغضب و يثور و يكون له ردة فعل و غيرة على كرامته و كرامة بلده… لان ببساطة هو ده رد فعل اى مصرى سواء كان ابن الريس او ابن غفير… من الاخر مصرى … و منكرش ان شعبيته و محبته فى قللوب الناس زادت بعض موقفه الاخير…انا من الاخر مبسوطة بجد."
