text = "كان فية نكتة زمان متداولة بتقول<br />ان فية سايح امريكى نزل مصر واخد تاكسى من المطار الى الفندق ولاحظ السائح ان سائق التاكسى معلق 3 صور فى التاكسى فسال السائق من هذا ؟<br />فقال لة الاول دة صورة جمال عبد الناصر صاحب ثورة 23 يوليو<br />والثانى دة صورة الرئيس انور السادات بطل العبور وحرب 73<br />وسال السائح —— والصورة الثالتة لمين<br />فقال سائق التاكسى<br />دى صورة ابوعلاء شريكى فى التاكسى<br />رئاسة اية يا عم دة راجل مشارك كل واحد فى البلد دى على نص رزقة"
