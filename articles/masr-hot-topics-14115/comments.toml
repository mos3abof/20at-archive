text = "قالوا : مصر الحضارة والحضارة هي 7000 سنة !! … وقالوا : مصر التاريخ ، ومصر مقبرة الغزاة !!! ، وقالوا : مصر هبة النيل … ؟؟ .. ثم قالوا : مصر الشقيقة الكبرى ، ومصر أم الدنيا !!!! … ثم قالوا : مصر بلد الأزهر الشريف ، وبلد العلم والعلماء ، مصر بلد الخمس والثمانين مليون نسمة ، وقالوا : مصر قلب الأمة النابض والوامض ، ومصر العروبة ، ومصر هي العرب ؟؟؟ … هكذا قالوا … !!"
