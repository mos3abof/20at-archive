author = "مصرية قوى"
posted = "2009-11-27"
text = "وقت مكالمتة مع خالد الغندور لقينا نفسنا بنصفق لية ولينا اتكلم ببساطة وتلقائية وقال كل اللى كان فى نفسنا وفى قلبنا موضوع ترشيحة للرئاسة مش وارد حتى بفكرة هو شخصيا بذلك مكالمتة رفعت اسهمه واسهم والدة بصوره كبيرة ربنا يحفظ مصر والمصريين رغم كيد العدا"
