posted = "2009-11-24"
text = "بعد المداخلة التلقزيونية ظهر الاستاذ علاء مبارك على الساحة الشعبية بدون اى دعاية حزبية اوسياسية ودخل قلوب معظم الناس بدون برنامج انتخابى ووعود بالعبور الى المستقبل وخفف علينا شوى من وقع المهزلة اللى حصلت فى السودان انا فى رايى الشخصى بااشوف انة علاء مبارك اصدق فى الاحساس والمشاعر من اخوة الاستاد جمال اللى كان بيتهيئلى انة بيمثل وعايش الدور"
