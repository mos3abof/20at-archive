text = "لا عادي ماتخودش في بالك<br />الكره هي الي في النفوخ<br />مع ان العالم بره بيهتم بكل حاجه<br />احنا للأسف الكره بقيت حرب عندنا<br />قالك ان شاء الله ننتصر<br />و الي يحرق والله دمي لما ألاقيهم كتبين ايه قرأنيه علي موضوع هايف زي ده<br />كلام ربنا بقي للكره<br />و كابتن محمود انا و انت اكيد عارفين ان ju-jutsu و الجودو و الأيكيدو فن قتال بأخلاق و احترام<br />افخر بنفسك ثم بنفسك"
