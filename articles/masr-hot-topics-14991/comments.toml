subject = ""
author = "الافريكان"
posted = "2010-01-20"
text = "انا ابويا مصرى ومش عارف اية مصرى اغانى وطنية بتتذاع مع مباريات الافريكان<br />واحنا بنحقق انتصارات على دول عمرها 10 سنين<br />ولكن الحقيقة المرة ان اوسخ فريق فى افريقيا بيلعب كرة احسن من المنتخب بتاعنا<br />انا شفت ازاى اللعيبة الافريكان بيلعبوا كرة بحرفية وفن<br />ولكن المنتخب المصرى فنان فى سرقة الاجوان - حرامى اجوان وبدون اى فن<br />وانا اتوقع ان الدورة القادمة للامم الافريقية الدول دى هتحترف اكتر وهتتقن اللعب اكتر والمنتخب المصرى هيترمى فى الزبالة والعنجهية الكدابة دى على مفيش واللى دول افريقيا كلها بتحتقرها<br />ومرة تانية انا ابويا مصرى وستى مصرية"
archived = "2010-01-24"
capture_url = "https://web.archive.org/web/20100124052402/http://www.20at.com:80/masr/hot-topics/14991--240-.html"

