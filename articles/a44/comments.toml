subject = "لماذا حذفتوها؟ مصر سبقت اسرائيل في اعتقال الشيخ"
text = "لا يلام الذئب في عدوانه ** ان يكن الراعي عدو الغنم<br />نعم يحق لنا ان نخجل من حكوماتنا (الراعي) التي بررت لإسرائيل (الذئب) عدوانه ولكن لا يحق لأحد ان يخفي الحقيقة او ان يصدق تباكيها عليه لمجاراة شعوبها!!؟؟<br />فالأمانة تقتضي ان تنقلوا التقرير كاملا كما نشر في كل المواقع لا ان تحذف منه العبارات التي توضح ان اجهزة المخابرات المصرية كانت اسبق الى اعتقال الشيخ احمد ياسين من اجهزة الأمن الأسرائيلية مع ملاحظة انه كان مشلولا حين اعتقلته المخابرات المصرية للأسف!!!<br />مع توضيح انها ازدادت بشاعة وسوءا في العهد الحالي عن العهود البائده.<br />وفيما يلي الجزء المحذوف مع فقره مما قبله وفقرة مما بعده لإيضاح موقعه من النص.<br />• عمل مدرسًا للغة العربية والتربية الإسلامية، ثم عمل خطيبًا ومدرسًا في مساجد غزة، أصبح في ظل الاحتلال أشهر خطيب عرفه قطاع غزة لقوة حجته وجسارته في الحق.<br />• شارك \"أحمد ياسين\" وهو في العشرين من العمر في المظاهرات التي اندلعت في غزة احتجاجًا على العدوان الثلاثي الذي استهدف مصر عام 1956م، وأظهر قدرات خطابية وتنظيمية ملموسة؛ حيث نشط مع رفاقه في الدعوة إلى رفض الإشراف الدولي على غزة، مؤكدًا ضرورة عودة الإدارة المصرية إلى هذا الإقليم.<br />• كانت مواهب \"أحمد ياسين\" الخطابية قد بدأت تظهر بقوة، ومعها بدأ نجمه يلمع وسط دعاة غزة، , الأمر الذي لفت إليه أنظار المخابرات المصرية العاملة هناك، فقررت عام 1965م اعتقاله ضمن حملة الاعتقالات التي شهدتها الساحة السياسية المصرية، والتي استهدفت كل من سبق اعتقاله من جماعة (الإخوان المسلمون) عام 1954م، وظل حبيس الزنزانة الانفرادية قرابة شهر ثم أفرج عنه, ، وقد تركت فترة الاعتقال في نفسه آثارًا مهمة لخصها بقوله \"إنها عمقت في نفسه كراهية الظلم، وأكدت فترة الاعتقال أن شرعية أي سلطة تقوم على العدل وإيمانها بحق الإنسان في الحياة بحرية.<br />• عمل رئيسًا للمجمع الإسلامي في غزة."
