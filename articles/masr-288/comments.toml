author = "الاخوه الافاضل محررين وكتاب موقع اولاد البلد المنكوسه بدل ماحضراتكم عمال تتريقوا على خلق الله ياريت تتابعوا احوال البلد وتركزا شويه فى مجالكم الى انتوا موهمين بيه وتقولو عليه سياسه واصلاح وووو البلد بتنتهى اكلاكنيا وانتوا عمالين تتيرقوا على شباب البلد وعلى خلق الله طبعا فى مواضيع كتيره ليكم وده موش نقدر ننكره بس فى حاجه صغننه كدا ممكن اقولها ليكم ولزوار الموقع هذا اغلب مواضيعكم بنسبه 85فى الميه منقوله من المواقع الاخرى واغلبها لناس لها وزنها السياسى ياريت ياجماعه تركزوا شويه فى مجالكم وبلاش تريقه على الناس والى ينقل حاجه ياريت يذكر المصدر موش كفايه عليا كاتب سياسى مخضرم وانتا اثاثا متعرفش حاجه عن بلدك"
