subject = "عذرا"
author = "محرر ولاد البلد"
posted = "2006-05-13"
text = "الأخ الفاضل المعترض على هيافة موضوعاتنا..<br />نعتذر بشدة لو كان هذه هو حالنا من وجهة نظرك المحترمة<br />لكن نختلف معك في أن الاهتمام بالشأن العام المصري هو الغالب في الصفحة وهو ماىشتكي منه أكثر من زائر للصفحة ويطالبون بالتخفيف من الجرعة السياسية..<br />على كل تلك وجهة نظرك التي نحترمها..<br />لكن ما نؤكد عليه هو أن مواد الموقع لا ينقل منها غير الموضوعات الموجود في زاوية تخاطيف وهي زاوية قائمة في الأساس على النقل من المواقع والصحف الأخرى<br />ونشكر لك اهتمامك، ونعتذر عن إذا ما كنا تسببنا في ضيق لك<br />ولك الشكر مرة أخرى<br />محرر ولاد البلد"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517235432/http://masr.20at.com:80/article.php?sid=288"

