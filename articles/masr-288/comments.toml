subject = "يا جماعة بتحرجونى"
author = "اللى وشه زى القمر فى المقال"
posted = "2006-05-09"
text = "و الله يا جماعة انا شايف ان الماسنجر اصلاً ارسى ثقافة و سلوك بين الناس مختلف تماماً عن الفترات اللى فاتت و ارسى لغة كمان ...يعنى ممكن واحد من الناس بتوع العلم و الدكتوراه و الماجستير يعمل رسالة فى الماسنجر و تأثيره على سلوك الافراد زى اللى عمل دكتوراه فى حتى قبل كده ...<br />يعسداً عن الكلام الفلسفى انا شايف ان براء و مصعب من اكتر الناس اللى بيهتموا جداً جداً ب nick nameبتاعهم على الماسنجر مما وصلنى الى انى بقيت كل يوم اول حاجة بعملها اول ما بفتح الماسنجر انى بروح اشوف هما كاتبلنا ايه النهاردة ..يوم سياسة و يوم رومانسية و يوم هبل و يوم تلاقى مصعب كاتبلك حتة من كود php ..هرتله يعنى بس لذيذة..<br />الموضوع لذيذ و شكراً عشرينات"
archived = "2006-05-17"
capture_url = "https://web.archive.org/web/20060517235432/http://masr.20at.com:80/article.php?sid=288"

