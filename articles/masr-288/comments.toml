subject = "صورة تمثل حزب الله"
author = "الشيماء"
posted = "2006-07-26"
text = "السلام عليكم و رحمة الله و بركاتة<br />موضوع جميل و يعبر عن الثقافة السائدة عند الشباب اليومين دول.<br />صراحة بعد الحرب علي لبنان احتراما و حبا لحزب الله و شجاعتهم حطيت صورة تمثل الحزب و جعلت النيكنيم جزء من انشودة اسلامية جميلة تسيطر عليا اليومين دول اغلب الوقت و علي فكرة الانشودة بتقول:<br />سنخوض معاركنا معهم و سنمضي جموعا نردعهم.<br />و نعيد الحق المغتصب و بكل القوة ندفعهم.<br />بسلاح الحق البتار سنحرر ارض الاحرار.<br />و نعيد الطهر الي القدس من بعد الذل و ذا العار.<br />لن نرضي بجزء محتل لن نترك شبرا للذل<br />ستمور الارض و تحرقهم في الارض بركين تغلي<br />انشودة جميلة بتدينا امل في الحياه و في النصر و علي فكرة اللينك دة فيه فلاش للانشودة كاملة يا رب تعجبكم<br />http://saaid.net/flash/1128053774.htm<br />اشكركم"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113309/http://masr.20at.com:80/article.php?sid=288"

