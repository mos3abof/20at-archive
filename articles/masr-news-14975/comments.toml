author = "رزق من السماء"
posted = "2010-01-20"
text = "الحمد للة على نعمة المطر<br />خير من عند ربنا<br />ورزق كبير للناس الغلابة<br />المطر الغزير فى الصحراء هيملىء ويزيد المخزون الجوفى والابار سوف تفيض بالماء<br />والعشب سوف ينمو فى الصحراء طعام الرعى للغنم والابل والجمال<br />واشجار الفاكهة من الخوخ والبرتقال والليمون والنخيل سوف ترتوى<br />كلة خير<br />ورحمة من عند ربنا<br />اللهم ارزقنا الغيث<br />واطعم الجائعين المحاصرين فى غزة<br />وانصر امتك يارب<br />مصرى"
archived = "2010-01-22"
