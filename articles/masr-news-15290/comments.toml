author = "بعد اربعين سنة سلام"
posted = "2010-02-11"
text = "اقسم باللة وانا رجل عجوز اننى عاصرت نكسة 67 وكنت طالبا جامعيا وقتها وعاصرت حرب 73 وكنت مقاتلا على الجبهة وقتها - لم ارى وقتها طابورا على العيش ولا رايت عجزا او نقصا فى انابيب البوتاجاز ولم ارى يعنى اية بطالة ولا عنوسة - كان الخريج بعد تخرجة ب 3 شهور ياتية خطاب القوى العاملة ليشتغل ويتجوز وينتج - لم تكن مصر عليها ديون لاحد وكان لا يوجد حرامية ولا استيراد كان الحذاء فى ارجلنا من انتاجنا والتليفزيون من انتاجنا وتلاجة ايديال المصرية<br />اية الخراب اللى حصل للبلد<br />اية السبب<br />لية الناس عايشة فى ضنك وقهر واذلال يومى فى المعيشة<br />لية<br />بيعاقبوا الشعب المصرى لية<br />هل هى غباوة قيادات ام ان الامور مترتبة لافقار الناس وقهرهم<br />انا عجوز واخرف"
archived = "2010-02-15"
capture_url = "https://web.archive.org/web/20100215164605/http://www.20at.com:80/masr/news/15290-2010-02-11-12-34-48.html"
