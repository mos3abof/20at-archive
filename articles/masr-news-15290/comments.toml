author = "صورة معبرة"
posted = "2010-02-11"
text = "هى دى مصر بتاع ال 7 الاف سنة ذل وعبودية<br />شايفين فى الصورة امين الشرطة او الزابوط وهو ماسك ورافع العصا ليضرب الستات الكبار الغلابة وواحدة ست فى الصورة على وشك ان تبكى<br />هو دة اسلوب الحكم<br />العصايا لضرب الناس<br />فين بتوع حقوق الانسان ليشوفوا ضرب الناس فى الشارع وفى عز النهار<br />صورة بتقول هى دى مصر يا عبلة<br />هل من الممكن ان ترى مثل هذة الصورة حتى فى موزمبيق او تورا بورا<br />ويتكلموا عن الكرامة والمواطنة وحقوق الانسان والمرأة والنتيجة كما ترى فى الصورة العصى"
archived = "2010-02-15"
capture_url = "https://web.archive.org/web/20100215164605/http://www.20at.com:80/masr/news/15290-2010-02-11-12-34-48.html"

