author = "مباركة رزوق"
posted = "2007-12-26"
text = "السلام عليكم تحية احترام وتقدير لكل من يسهر على هذه الوزارة صحيح ان هناك مجاهدون مزيفون لكن هناك مجاهدين حقيقيين لم يبخلوا بشيئ إبان الثورة الجزائرية لكن اليوم و في ظل الاستقلال لم يتلقوا حتى كلمة شكر لأنهم كرسوا حياتهم ابان الإستقلال لخدمة الوطن في الثقافة و العلم و لم يسارعوا لتسوية وضعيتهم الإدارية منهم السيد أحمد قدودة -مدير متحف سيرتا- سابقا بقسنطينة الذي أحيل على التقاعد ورجع الى مسقط رأسه بالأغواط و هو لا يجد مسكا يأويه هو وأولاده الخمسة و زوجته علما أن له 3 أولاد مازالوا يتمدرسون كما أنه لحد الساعة لا يبخل علينا نحن الباحثين في مجال التراث و التاريخ و الثقافة فياليت تتكرم وزارتنا الغراء و تلتفت الى مثل هؤلاء الناس و تعوضهم و لو بقليل من حقهم المحفوظ لهم طبعا في الآخرة لأنهم مجاهدون حقيقيون جدا جدا بل و فوق العادة و شكرا"
archived = "2009-11-11"
capture_url = "https://web.archive.org/web/20091111134056/http://www.20at.com:80/20at/latest-news/2317.html"

