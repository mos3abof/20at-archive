text = "والذين سجنو اذبان الاستعمار الفرنسي أليس لديهم حق نعم نحن نملك كل البيانات ولاكن بقراركم لاحق لنا<br />اننا عائلة امنا معوقة ونحن خمسة أولاد أبونا توفي سنة 1988 كان مسبلا خدم بلاده بكل نزاهة<br />ودخل سجن فرنسا مايقل عن أربع سنوات وعدب كثيرا والان حقه غير موجود"
