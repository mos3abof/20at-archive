[[comments]]
order = 1
subject = "انا"
text = "النور كمان بيعمل سرطان اومال ايه اللي مابيعملش مش بالطريقه دى يا جماعه ارحمونا بئه الواحد خلاص تعب كل حاجه ملوثه و كل حاجه فيها سرطانات و كل حاجه بتموت و كل حاجه بتقصر العمر دى بئت عيشه تقصر العمر . و علي رأى المقوله الشهيرة للشاعرة الشهيرة اللي هى انا<br />الحياة لا تستحق الحياة<br />و الحدق يفهم"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018143740/http://20at.com:80/article.php?sid=334"
