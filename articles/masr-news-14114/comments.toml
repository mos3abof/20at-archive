posted = "2009-11-21"
text = "مش عايز اسمع عن مظاهرة ولا اي حاجة قام بها الشعب لانو دلوقتي السلطة هي الي بتستغل الكرة عشان تربح شعبية في بلدها..خلي الشعوب في حالها احنا نعرف المصريين الحقيقيين والجزائريين الحقيقيين بيسوو ايه وبيفكرو ازاي مش شوية لغط وغوغاء تعمينا في 90 دقيقة"
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124090319/http://www.20at.com:80/masr/news/14114--80-.html"

[[comments]]
order = 3
subject = ""
author = "الحق حق"
posted = "2009-11-21"
text = "- ان البلبلة بشأن تضرركم من الاخوة الجزائريين على |أرض اشقاءنا السودانيين اكبر طعنة في ظهور السودانيين انفسهم وهذا اثبات على فشلهم في توفير الامن لكم يا اما انكم لم تتعرضو لشيئ وتهديد الجزائريين لكم بعد تعرض لاعبيهم للضرب في ارضكم \"مش ارض الناس\" هو الس خلاكم تخافو وتحدثوا فوضى من شدة الخوف ويا اما اخوانكم السودانيين ما قدروش يحموكوه وده شي مستبعد لانو كلنا شفنا حجم القاوت العسكرية الي كانت مسيطرة مش معقول 2 بلطجية يغلبوهم وكمان القضية كلها قضية بلطجة مش معقول تخلينا نكره بلد بحاله عشان اتنيي بلطجية موجودين في كل حتة من العالم<br />- كمان ازاي نروح لمجلس الامن وهيئات دولية تحلينا مشاكلنا؟ هي حصلت نستدعي قوات وهيئات المفروض هي هدفنا الموحد عشان تحمينا من بعض بدال ما نحمي بعض من شرها للدرجة دي هاين عليكم نفسكم ومهانش علينا اخواتنا في فلسطين يوم المذابح بتاع غزة"
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124090319/http://www.20at.com:80/masr/news/14114--80-.html"

[[comments]]
order = 4
subject = ""
author = "الحق حق"
posted = "2009-11-21"
text = "- بعد بسم الله اولا ازاي نصدق واحد معندوش جرأة يدي اسمو..والفيفا لو كانت عملالو حساب كانت اجلت مباراة 14 لما طلب روراوة ذلك…وبلاش نغلط في الناس ونشكك في ايمانهم والي ما يعلموش الا الله.<br />- الجزائر قدمت تسهيلات رهيبة لشعبها عشان يروح يشجع فريقوا في خلال 4ايان كان العدد هائل لما استصعب الامر استعانت بطائرات عسكرية لنقل المدنيين واستغرب كيف تعرف ان شخصا مجربا عن القتال من خلال النظر اليه<br />- الصحفي حساني د مجهول ونكرة ازاي ناخد بكلامو وهو اساسا مش معروف حتى فبلدوا يعني حتى ان صاحب المقال ماقلش الجهة الي بيعمل فيها الصحفي ده من غير كدة كلام الصحفي المجهول ما نبنيش عليه علاقتنا ببلد بحالو<br />- اكد المستشار الطبي للفريق المصري انةو مافيش فنان واحد شاف حاجة بعينه واسألو محمد فؤاد وايهاب توفيق والباقيين لان المستشار الطبي المصري لما سألهم عن خوفهم قالو \"سمعنا ان في جزائريين بيقتلو …\" سمعنا…<br />- ما اعتقدش اني في واحد مثقف بيقول الي بيقول سعد لانو مصر الله اكبر فيها نخبة لاتحتاج للتذكير سمعتها واعمالها تتكلم عنها وليس افلام وغناء …كركر؟"
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124090319/http://www.20at.com:80/masr/news/14114--80-.html"

