subject = ""
author = "حملة التهييج"
posted = "2009-11-21"
text = "وراء حملة التهييج فى التليفزيونات وبالذات المملوكة لرجال الاعمال المنتسبين للجنة السياسات نجلى السيد الرئيس<br />وبعد حملة التهييج هتقدروا تعملوا اية للجزائر<br />اية اللى فى مقدور مصر تعملوا للجزائر<br />تقطعوا العلاقات<br />طيب واية يعنى<br />اية اقصى حاجة ممكن تعملها مصر للجزائر<br />ولا حاجة<br />شوية صبيان بيدخلوا كرة وكورة فى السياسة<br />وعاملين البلد لعبتهم<br />دى حتة ماتش زى اى ماتش"
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124090319/http://www.20at.com:80/masr/news/14114--80-.html"

[[comments]]
