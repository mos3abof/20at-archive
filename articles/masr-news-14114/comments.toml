subject = ""
author = "وضربوهم يستاهلوا"
posted = "2009-11-21"
text = "مصر ارسلت شوية رقعاء ومخنثين وراقصين ومغنى افراح ومطربى صالات فندق وممثلات عواجيز وشوية هلافيت من بتوع الحزب الوطنى من بتوع نوادى الروتارى فى مصر الجديدة والجزائريون ضربوهم بالجزمة — يستاهلوا<br />نحن الشعب المصرى الفقير والعامل والمطحون مفيش احد منا انضرب ومبسوطين انهم ضربوا ولاد الكلب بتوع نوادى الروتارى والمخنسين وشواذ الفنادق"
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124090319/http://www.20at.com:80/masr/news/14114--80-.html"

[[comments]]
