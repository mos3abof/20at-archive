text = "المفرةض ناخد حقنا بالعقل والمفروض ان البرامج الي مفروض انها كروية تقول حقائق مش هبل وقصص فردية عشان العالم ميضحكش علينا كفاية بهدلة وغباااااااااااا ااااااااااااااا ااااااااااااااا ء لازم تصرف بعقل ,وبعدين ميييييييييييييي ييييييييييييييي ييييين اللمبي ده الي بيشبه بالمصرين ايه التفاهة دي ده احنا خير جنود الارض ياأستاذ لمبي (محمد سعد)"
