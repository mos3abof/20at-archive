subject = "الرحمه بالمصريين"
author = "فاتن"
posted = "2006-03-24"
text = "بجد حرام كده همه ليه مش بيحسوا بالشعب ودفع الفواتير ده مين الى لازم يدخل ويحلها ارجو ان حد واصل ويكلمهم ويقنعهم ان كده حرام الشعب هيلاقيها من ايه ولا لايه ارحمو الناس ارحمونا ارحمونا الرجاء ان حد يتتدخل فى هذا الموضوع احنا كنا بندفع 25 كل 6 شهور دلوقتى الفتوره جتلنا 60 فى 3 شهور ليه و من فين الزياده ده كلها مش حرام بالله عليكم للدخل فى الاسعار ده استحلفكم بالله و<br />السلام عليكم الرحمه"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423182619/http://masr.20at.com:80/article.php?sid=65"

