[[comments]]
order = 6
subject = "احسن من غيرنا كتير!"
author = "في لقاء ما حصلش مع السيد الرئيس عن الزيادة الأخيرة في فواتير التليفون تخيلناه بيقول:"
posted = "2006-04-20"
text = "فعلا أنا مش شايف أي مبرر للاحتجاجات الغير مبررة دي! احنا -كاعادة- أحسن من غيرنا كتييير. مثلا في النيجر الناس مش لاقية تاكل وانتو زعلانين عشان فاتورة التليفون! وللا زماااان أيام هيركليز حصل زلزال مات في ناس كتيييير وانتو بتقولو فاتورة تليفون! وللا القنبلة الذرية على راس هيروشيما واللي خلفو هيروشيما وبتقولو فاتورة تليفون<br />وديني دانا حايش أمريكا عنكم يا حبة رعاع ، أنا غلطان .. بكرة هخلي أمريكا تحتلكو وابقوا اطلعو في مظاهرات عشان فاتروة التليفون يا شعب جهوول<br />انتو لسة شفتو حاجة! الايام اللي جايو اسوو وأسود من الجزمة اللميع"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423182619/http://masr.20at.com:80/article.php?sid=65"

