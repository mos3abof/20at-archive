subject = "اصل انتو مش عارفين"
author = "medo_pataya"
posted = "2006-06-08"
text = "ياجماعة اصل انتو مش عارفين حاجةواللى ميعرفش يقول قطيعة...ع الاتصالات وصحابهاالموضوع انه الناس دى عايزه تعيش وتتفسح وتروح تصيف فى شرم الشيخ وتشتى فىالاقصر واسوان وبعدين هما غلابة مش عارفين يجيبوا فلوس منين وعندهم تلت اختيارات يس كانت حكومتنا ناصحة وقدرت شعبها فاستعانت بالجمهور فيها حاجه دى؟"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022829/http://masr.20at.com:80/article.php?sid=65&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "لك الله يا شعب مصر"
author = "أبو أحمد"
posted = "2006-06-12"
text = "لك الله يا شعب مصر الكل تكالب عليك عصابات منظمه تأكل في جسد شعب منهك جريح ليس له حامي إلا الله سبحانه وتعالي عزبة ومات صاحبها والكل وقسموها كل حسب سلطته وإلي هيتكلم من الشعب بالجزمة على رأي الأستاذ وائل الإبراشي اسمعوا الكلام ولا الأمن المركزي موجود وأمن الدولة<br />انتم عارفين ، إحمدو ربنا إن التعليم مجاني وإن انتم عايشين في البلد شوفوا أمثالكم في الصومال وبنجلادش وأفغانستان وفلسطين إحمدوا ربنا ده شعار حكومتنا العبور للمستقبل وأي واحد هيتكلم عن أحمد عز أو ممدوح عباس أو التوريث بالجزمة البلد بلدنا وإلي مش عاجبه يشوف له بلد تانية إحنا ناقصي قرف شوية رعاع على موظفين معفننين بقولكم بالجزمه يا شعب حسالة ولمامة فرعون قبل كده إنتم عارفين عمل فيكم ايه وربنا يخلي لنا أمريكا حميانا إحنا ورجالتنا با جزم"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022829/http://masr.20at.com:80/article.php?sid=65&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

