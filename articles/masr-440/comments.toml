text = "المقال بيتحلم عن نمط معين يا لوردكاش<br />وبلاش كل حاجه تتفهم من الظاهر<br />كل الناس عايزة تنجح وكلها بتنجح وفي الاااااخر ف الشارع<br />العلم 0000 العلم0000<br />هاهاهاها00000 هاهاهاها<br />كل حاجه بالفلوس دلوقتي مش بالدح"
