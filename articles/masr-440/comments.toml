[[comments]]
order = 4
subject = "الواحد نفسه يبقي سوسه بس معرفش .شكل الموضوع محتاج تدريب وا"
author = "اوعوا تفكروا ان الموضوع بالساهل .........ده مجهود سنين عشان تبقي سوسه محترف وبعدين مش اي حد يقدر يبقي سوسه... دي محتاجه ندريب ثم تدريب ثم تدريب"
posted = "2006-06-02"
text = "وبعدين المجتهد حاجه والسوسه حاجه تانيه خاااااااااااااالص ......يعني مش كل مجتهد سوسه ...طبعا في مجتهدين كتير الاولويه عنهم اللي حواليهم وبيساعدوهم ويتمنوا لو الكل شاطرين زيهم بس احنا هنا بنتكلم علي السوسه اللي بيداري وبيخبي لغايه يوم النتيجه اللي هو يوم الدمه بالنسبه لنا ....ايه ده هو الواد المهيس ده هو الاول طب ازاي ومين وفين وليه ....حد يفهمني<br />انا فاضلي سنه في الكليه هاحاول جاهده اطبق القواعد اللي قلتوا عليها لعل وعسي تصيب المرة دي ..احسن الواحد مش عارف يبقي سوسه خااااااااااالص"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183057/http://masr.20at.com:80/article.php?sid=440&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "ياسيدي بالراحه"
author = "عبدالله مفتاح"
posted = "2006-06-02"
text = "يا عمي بالراحه ليه بس الاسلوب ده ؟<br />على اد فهمي للمقال محستش انه فرق بين المجتهد السوسه والمجتهد المحترم لان اصلا لم يذكر ان في مجتهد محترم فانا حسيت ان اي حد بيذاكر يبقى سوسه ودحيح<br />وملهاش لازمه (انتو بتفهموا ازاي بس ) هو الكلام مينفعش الا بتطاول<br />والاخ اللي بعديه هو انا خدت حاجه بجد انا كل اللي قلته ان في اعتقاد خاطئ وفي الاخر بتقول حلوة يا مي؟<br />طيب منا كمان بقول حلوة يا مي هو انا قلت انهاحشه؟ كلامي نقد عادي خالص"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183057/http://masr.20at.com:80/article.php?sid=440&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 6
subject = "سوسة المفروسة"
author = "تجربتي في التسوييييس"
posted = "2006-06-02"
text = "اييييه ده ...كل ده نم عليا و انا مش موجوده...ماكانش العشم يا جماعه<br />عموما انا برضه سووسة قديمة.ايام الثانوية العامة.بس كنت بسوس اخر 3 اشهر في السنة ..و جيبت مجموع كبير كان ممكن ادخل بيه طب.بس قصرت و دخلت صيدلة<br />في الكلية بقه قلت امشي عادي يعني من غير تسوييس .بعيد عنكم كنت على مرمى حجر من السقوط<br />فلسعت الشلة اللي معايا و لزقت لشلة تانية و هاتك يا دح و في الاخر عدينا الحمدلله<br />انا قلت اشارككم بتجربتي لمصلحتكم ...اكتبوها يمكن تنفعكم"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183057/http://masr.20at.com:80/article.php?sid=440&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 7
subject = "السوس انواع"
author = "مهندس بيطرى"
posted = "2006-06-02"
text = "طبعا بما انكم اتكلمتم عن السوس فكان لازم تاخدو راى خبير بس مش مشكلة نعديها المرة ديه:<br />السوس النكوس::وده سوس بس المشكلة انه حظه وحش بعد كل التسويس اللى بيعمله برده مابينجش<br />السوس المفروس::وده سوسو ولاعياذ بالله على كل التسويس اللى بيعملوا بيحسد السوس اللى زيوا<br />السوس الكوسة:: وده سوس مانتخ بس مسنود وده النوع يوجد فى منطة واحدة<br />مصر<br />ahmed_commrs@yahoo.com"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183057/http://masr.20at.com:80/article.php?sid=440&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "انـــــــت ............تـــــــانى"
author = "كم انامشفق عليك ـ مى ـ لقد غرس فيك هذا الزمن الردىء الكثيرمن المعايير الخاطئه"
posted = "2006-06-02"
text = "فكما اعتبرت الفقر سبه و مثارا للاشمئزاز و التعالى على خلق الله فى مقالك ـ البيئه ـ السابق اراك الان و انت تعتبرين الاجتهاد و الحرص على التفوق وعدم مد يد المساعده لخامل كسول يقضى وقته مابين كافيتريا و رحله على اعتبار انه بقليل من البحث سوف يجد من يعطيه حصاد سهره و اجتهاده بهذه السهوله التى يصورها له عقله الخاوى<br />أيها المجتهدون فلتغيبوا و ليأفل نجمكم و الا فليضع كل منكم ما سهر و اجتهد فى تحصيله تحت اقدام من هم على شاكله<br />حفيده اباطره الهند و السند وبلاد تركب الارانيب مـــــى كــــامـــــل<br />ياريت يا أخت مــى ترحمينا<br />أأأأأأأأأأأأأأأأأأأأأأأأأه يــــــأ بــــــلـــــدى"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183057/http://masr.20at.com:80/article.php?sid=440&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "الموضوع مش كدة"
author = "سوسة (على رأيكوا)"
posted = "2006-06-02"
text = "بفضل الله أنا طالب متفوق، وبفضل الله أيضا لم أجد في تلك الصفات التي تحدثتم، فأنا لا أكتم أمر مذاكرتي على أحد بل أعلنه للجميع صراحة، وعندما أخرج من الامتحان أراجع مع أصدقائي، وأخبرهم بدرجاتي الحقيقية؛ لأني مقتنع تماما أن الطالب الذي يذاكر ويوهم زملاؤه بعكس ذلك هو طالب مخادع....<br />أتمنى التفوق لكل أصدقائي"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183057/http://masr.20at.com:80/article.php?sid=440&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "روشتة الامتحانات"
author = "بسم الله الرحمن الرحيم"
posted = "2006-06-03"
text = "كل امتحانات وأنتم بخير<br />ملحوظات سريعة حول الامتحانات<br />1- تذكر جيدا أن لا المحاضرة ولا السكشن ولا الدرس ولا والورق ولا حتى مجهودك فقط هو الذي يعلمك إنما هي أسباب<br />وإنما الأصل<br />(وَاتَّقُواْ اللّهَ وَيُعَلِّمُكُمُ اللّهُ وَاللّهُ بِكُلِّ شَيْءٍ عَلِيمٌ {282}‏)سورة البقرة<br />فاتق الله<br />وانتهزها فرصة للتوبة والرجوع ..ففي أيام الامتحانات تكون مشغولا فقد يكون ذلك عونا لك على ترك المعاصي (وبالتأكيد أن لا أعني أن تتوب لأجل أن توفق في الامتحانات أو أثناء مدة الامتحانات فقط وإنما أنوي ذلك من الآن وإلى الأبد فأنت لا تعلم متى سيأتيك الموت)<br />وطبعا لا تكن من الذين يقللون من طاعاتهم في الامتحانات بحجة الانشغال<br />فقد قلنا أنه ليس بجهدك وحسب وإنما بالاستعانة بالله التي تستلزم طاعته<br />2- إذا كنت قد ضيعت وقت والمذاكرة تراكمت إلى حد مميت فلا تيأس وابذل ما بقي في استطعت وتذكر(وَلاَ تَيْأَسُواْ مِن رَّوْحِ اللّهِ إِنَّهُ لاَ يَيْأَسُ مِن رَّوْحِ اللّهِ إِلاَّ الْقَوْمُ الْكَافِرُونَ) سورة يوسف ..وأيضا (قَالَ وَمَن يَقْنَطُ مِن رَّحْمَةِ رَبِّهِ إِلاَّ الضَّآلُّونَ {56}) سورة الحجر<br />3- أكيد كي تستطيع المواصلة وتعويض ما فات محتاج جهد كبير وسهر وقوتك لا تستوعب<br />تذكر (وَيَا قَوْمِ اسْتَغْفِرُواْ رَبَّكُمْ ثُمَّ تُوبُواْ إِلَيْهِ يُرْسِلِ السَّمَاء عَلَيْكُم مِّدْرَاراً وَيَزِدْكُمْ قُوَّةً إِلَى قُوَّتِكُمْ وَلاَ تَتَوَلَّوْاْ مُجْرِمِينَ {52}) سورة هود<br />4- لا تكن أنانيا وخذ بيد زملائك بقدر ما تستطيع وتعاونوا (طبعا الزملاء مع بعض والزميلات مع بعضهن) وتذكر<br />قال رسول الله صلى الله عليه وسلم \"من نفس عن مؤمن كربة من كرب الدنيا، نفس الله عنه كربة من كرب<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183057/http://masr.20at.com:80/article.php?sid=440&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
