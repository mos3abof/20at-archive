[[comments]]
order = 2
subject = "لا مؤاخذة يا مي"
author = "لور دكاش"
posted = "2006-06-01"
text = "ألا هو انتي دخلتي كلية الإعلام ازاي يا أستاذة مي؟ ما هو طبيعي لازم تكون الصفات اللي انتي كاتباها في مقالك منطبقة عليكي، لأن كليتك مبتاخدش غير السوس !!<br />لا بجد فعلا.. كلمة سوسة دي من أكتر الكلمات اللي بكرهها، ومبيقولهاش غير كل فاشل وحاقد.. ده بجد<br />وبجد برضه أنا مش شايفة أي غلط في ان الواحد يتقطع للمذاكرة، لو عاوز يتفوق.. لكن طبعا من غير \"تأنين\" بلغة الكورة.<br />وكمان تصحيح بسيط، المتفوق عمره ما بيكون بتاع بنات.. لأنه لو كان كده عمر ما ربنا هيباركله.. ولو ذاكر من هنا للسنة الجاية مش هيفلح...<br />معلش.. التعليق قلب مني خطبة عصماء.. اعذروني أصلي سوسة قدييييييييييمة !!"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183057/http://masr.20at.com:80/article.php?sid=440&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

