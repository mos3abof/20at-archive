text = "سواء فازت مصر او فازت الجزائر هيعملوا اية بالفوز<br />هيطلعوا يصفوا مع الدول الاروبية ومع او مقابلة مع الدولة الاروبية هيتهزموا هزيمة منكرة ويطلعوا برة<br />بلاش تخاريف العملية مبارة زى اى مبارة وهتكون مباراة هايفة وسكة ومفيش فيها لعب وانما تكسير وخناقات"
