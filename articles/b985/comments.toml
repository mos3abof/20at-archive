[[comments]]
order = 1
subject = "ما فاز إلا الجُهلُ"
author = "هزازة البزازة"
posted = "2006-06-24"
text = "يا اخوانا دول عايزين يتعلموا لغة عربية من أول وجديد علي الطلاق بالتلاتة دول لو بيقرؤا القرآن مرة واحدة كل شهر بس كان لسانهم أحسن من كدة، إمال لو كانوا اتعلموا في مدارس لغات كان حيبقى شكلهم الزاي.دول الأول لازم يتربوا عشان ما يعملوش اللي عملوه أيام الدنمارك تاني وبعدين يرجعوا اولى ابتدائي يحفظوا جدول الضرب اصدي الحروف الأبجدية.<br />وبعدين الكابتن بتاع اقرأ اللي بيقول انهم عرفوا يتعاملوا مع التولز يعني الأدوات العصرية يضحك بيها على حد تاني لأن كل واحد من دول وراه واحد تقيل بيموله عشان يوم ما يحتاج فتوى زي فتوى التشفير يلقيها جاهزة لأن احنا غنم ونستاهل يسوقنا شويت ..........."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144544/http://www.20at.com/article2.php?sid=985"

[[comments]]
order = 2
subject = "التوبيخ لمن يطلب العلم لغير الله"
author = "أخبرنا ‏ ‏سعيد بن عامر ‏ ‏عن ‏ ‏هشام صاحب الدستوائي ‏ ‏قال ‏"
posted = "2006-06-24"
text = "‏قرأت في كتاب بلغني أنه من كلام ‏ ‏عيسى ‏ ‏تعملون للدنيا وأنتم ترزقون فيها بغير عمل ولا تعملون للآخرة وأنتم لا ترزقون فيها إلا بالعمل وإنكم علماء السوء الأجر تأخذون والعمل تضيعون يوشك رب العمل أن يطلب عمله وتوشكون أن تخرجوا من الدنيا العريضة إلى ظلمة القبر وضيقه الله نهاكم عن الخطايا كما أمركم بالصلاة والصيام كيف يكون من أهل العلم من سخط رزقه واحتقر منزلته وقد علم أن ذلك من علم الله وقدرته كيف يكون من أهل العلم من اتهم الله فيما قضى له فليس ‏ ‏يرضى شيئا أصابه كيف يكون من أهل العلم من دنياه آثر عنده من آخرته وهو في الدنيا أفضل رغبة كيف يكون من أهل العلم من مصيره إلى آخرته وهو مقبل على دنياه وما يضره أشهى إليه ‏ ‏أو قال أحب إليه مما ينفعه ‏‏ كيف يكون من أهل العلم من يطلب الكلام ليخبر به ولا يطلبه ليعمل به ‏"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144544/http://www.20at.com/article2.php?sid=985"

[[comments]]
order = 3
subject = "بلاش فتاوي"
author = "مسلم بدون واسطة"
posted = "2006-06-26"
text = "انا ارى انه من الافضل منع ظهور اي شيخ او رجل دين او اي انسان يريد ان يتكلم عن الدين عموما وذلك لسببين : اولا - لانه لاكهنوت في الاسلام , والعلاقة بين العبد والخالق علاقة مباشرة لاتحتاج لا الى وسيط ولا الى مفتي يحلل ويحرم .<br />ثانيا - لان ظهور صورة رحل الدين بحد ذاتها في التلفزيون هي مخالفة لحوهر الاسلام ولتعاليم الدين الحنيف . فالاسلام لايسمح لا بالتصوير ولا بالرسم ولا بالنحت ... الخ . فكبف يجيز رجل الدين لنفسه معالجة قضايا الدين وهو اول من يخالف جوهر الدين . تناقض اوقع رجال الدين انفسهم فيه . اليس كذلك ؟<br />26/06/2006"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144544/http://www.20at.com/article2.php?sid=985"

[[comments]]
order = 4
subject = "رد على مسلم بدون واسطة"
author = "هزازة البزازة"
posted = "2006-06-26"
text = "طب ما إيه رأيك يا حبيبي كمان نلغي السنة والقرآن ونروح نقعد في الجبل كل واحد يعبد ربنا على كيفه، ده لو حضرتك بتصلي ولا بتصوم ما ينفعش تقول كده لأن كل أحكام الإسلام نزلت في القرآن من غير تفصيل آم الرسول محمد فصلها آم العلماء اللي اتبهدلوا علشان يبلغوا العلم حملوها لحد ما وصلوها لحضرتي وحضرتك وبعد كدة كل واحد حر (فمن شاء فليؤمن ومن شاء فليكفر) أما الواسطة اللي ممنوعة هي إن رجل دين يجي يفتري على ربنا ويقول ان هو غفر لفلان أو حيعذب فلان أو حيرزق فلان ويمنع علان.<br />أما موضوع التصوير والنحت والرسم فانت دخلت زيد على عبيد على نطاط الحيط لأن التصوير اللي منهي عنه مش التصوير الفوتوغرافي ولا التلفزبوني ولا السينمائي وإنما التصويراللي يكون نية صاحبة أنه يحاكي الخالق ويدعي ان هو زي الخالق يستطيع أن يصنع مثل الله فيقال له يوم القيامة انفخ فيها الروح ولذلك النهي عن التماثيل لا جدال فيه بإجماع المتقدمين والمتأخرين أما الرسم فإذا كان أشجار وأنهار وطبيعة ربنا، فرسمه حلال أما لو رسم انسان أو حمار أو معزة فله ذلك بشرط ان يكون رسم غير كامل يعني يرسم راس الحمار من غير بقيت الجسد، وبعد كل ده يكون تعليق صورة أي كائن حي في البيت منهي عنه لأن الرسول يقول((إن الملائمة لا تدخل بيتاً فيه كلب أو صورة)) ودمتم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102144544/http://www.20at.com/article2.php?sid=985"

