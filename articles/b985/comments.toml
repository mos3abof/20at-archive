subject = "صباح الخير"
author = "عبدالله مفتاح"
posted = "2006-06-24"
text = "الشيخ خالد الجندي ازهري ودارس ومؤهل للفتوى<br />والشيخ صفوت حجازي تلقى العلم واطلع على الكثير من الكتب وعلمه واسع<br />والشيخ عمرو خالد مش بيفتي<br />يبقى الثلاثه محدش ليه دعوة بيهم"
