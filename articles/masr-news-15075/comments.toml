subject = ""
author = "حقيقة مؤلمة"
posted = "2010-01-27"
text = "واحد صعيدى زميلى اخر جدعنة واخر رجولة - صديقى دة من قنا - والجنس عند الصعايدة او الكلام فية قلة ادب ومسخرة والمعلومات هناك سطحية خالص<br />صديقى لما كان شاب سنة 18 سنة راح لخالة يطلب منة ان يتزوج واحدة من القرية بتاعتة<br />فخالة قال لة - انت عايز تفضحنا عند الناس - الانتصاب عندك زين وراجل ملو هدومك<br />فرد علية - كلة تمام يا خالى<br />فاحضر خالة قالب طوب احمر وقال لة شوف اذا خرقت القالب دة ببتاعك ابقى تعال وانا اجوزك فى الحال<br />فصاحبنا لم يكدب خبر وقعد ينطح قالب الطوب الاحمر لما جالة تسلخات وجروح علشان يحاول يخرقة انما ما فيش فايدة<br />الجهل موجود<br />وطبعا لما حكى لزمايلة بعد كدة ما حدث فطسوا فى الضحك علية<br />الجهل موجود"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130181137/http://www.20at.com:80/masr/news/15075-2010-01-27-14-23-13.html"

