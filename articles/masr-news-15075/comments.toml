author = "تانى يا بديع"
posted = "2010-01-27"
text = "هو لية يا بديع الحكومة عايزة الشعب صحتة الجنسية مية مية - والبتاع مش منحنى وواقف زنهار - حبا فى الرجالة والا النسوان<br />هو اية العبارة يا بديع<br />ومالة البانجو يا بديع<br />والا نص قرش حشيش<br />ما هو بيوقف النايم ويعدل المعووج<br />والا لازم صورة بتاع سحس صاحبى المتنى فوق علب السجاير"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130181137/http://www.20at.com:80/masr/news/15075-2010-01-27-14-23-13.html"
