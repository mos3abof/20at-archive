subject = ""
author = "نكتة هندية"
posted = "2010-01-27"
text = "مرة واحد هندى راح لدكتور اعصاب بيعيط ويقول لة - الحقنى يا دكتور - انا فقدت ذكورتى ومعنديش انتصاب خالص<br />الدكتور سألة - مفيش انتصاب خالص - تبقى تجيب مراتك معاك المرة الجاية<br />راج كابور بعد اسبوع راح للدكتور ومعاة مراتة<br />الدكتور قال لها نامى فى السرير واقلعى هدومك ملط<br />ونفذت الزوجة<br />وبعد 5 دقائق قال الدكتور<br />مستر راج كابور انت سليم مية فى المية ومفيش مشاكل عندك<br />عندما خلعت زوجتك ملابسها لم ينتصب قضيبى انا ايضا<br />نكتة مترجمة"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130181137/http://www.20at.com:80/masr/news/15075-2010-01-27-14-23-13.html"

[[comments]]
order = 2
subject = ""
author = "نكته"
posted = "2010-01-27"
text = "اسباب ضعف إنتصاب القضيب<br />عندما يشعر الرجل بالإثارة الجنسية، يقوم الجهاز العصبي بتوصيل تلك الإثارة إلى القضيب بإصدار إشارة من المخ إلى الأعصاب الموجودة بالقضيب، فتبدأ الأوعية الدموية في القضيب بالامتلاء بالدم فيحدث الانتصاب.<br />تكمن المشكلة تحديداً في إحدى خطوات هذه العملية وهي تدفق الدم للقضيب.<br />ومن الأسباب التي تعوق تدفق الدم للقضيب أو بمعنى أكثر وضوحاً الأسباب التي تعوق هذه العملية السابقة الذكر:<br />نقص كمية الهرمون الذكرى (التستوستيرون) \"أحياناً\".<br />الإصابات والجراحات مثل إصابات العمود الفقري والحوض.<br />الجراحات مثل جراحة سرطان البروستاتا، والمثانة، والمستقيم.<br />العقاقير: بعض العقاقير الطبية مثل العقاقير المضادة للاكتئاب ومضادات الهستامين والعقاقير التي تعالج ارتفاع ضغط الدم.<br />إدمان الكحوليات، والمرجوانة، ومختلف أنواع المخدرات.<br />التدخين حيث إنه يتسبب في انسداد شرايين القضيب.<br />الشد العصبي والإحباط والقلق."
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130181137/http://www.20at.com:80/masr/news/15075-2010-01-27-14-23-13.html"

