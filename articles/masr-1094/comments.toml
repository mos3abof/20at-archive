[[comments]]
order = 8
subject = "البقر كتير فى بلدنا"
author = "ALKMIK"
posted = "2006-10-26"
text = "مبارك افسد كل شىء فى البلد ولم حواليه عصابه من المنتفعين كل منهم بيهبر على مزاجه ما الراس الكبيره شغاله الله ينور والاخ اللى مسمى نفسه الدشمه ولا مش عارف ايه اقولله ان سياسه السادات الله ****** عملت على تعيين الفاسدين والمفسدين على راس المنشات الاقتصاديه الكبيره لتخريبها وبدل ما ابو الضربه الجويه يحسن اختيار القيادات لهذه المشاريع اذا به يواصل سياسه ولى نعمتهوبالتالى خربت وفلست بعدما كان اقتصاد البلد كله قايم عليهاوالمصيبه خص نفسه بعمولات السلاح"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095723/http://masr.20at.com:80/article.php?sid=1094"

[[comments]]
order = 9
subject = "ما فيش سياسه خالص"
author = "alkmik"
posted = "2006-10-26"
text = "لا فيه سياسه لا فى عيد ولافى احزان حتى فقدت مصر اعتبارها وسط الاممالمتقدمه والغير واصبحت مصر صفر فى كل حاجه بفضل البقره اللى بتحكم فى البلد من تلاتين سنه وعلى راى المحلل الاسرائيلى اللى وصف وضع مصر فى عهد اللى مايتسمى بانه من اسوا اى اسوا وما فيش بادره امل لا فى جيش يتحرك ولا شعب يتنحرروفاقد الشىء لا يعطيه ازاى مبارك اللى بيقوم بدور المحلل والظاهر مالهوش الا فى الدور ده وبس يطور من الخطب فى المساجد ويسمحلها انها تواكب اللى بيحصل على الاقل خارجيا من الاخر يا خوانا مصر رزات بالالف بمبارك واسرتهوالنتيجه ما فيش حاجه نافعه غير النهب والسرقه البطاله من ناحيه والفساد من ناحيه والعيله الغير محترمه ما بتشوفشى غير مؤشر ارصدتها فى البنوكو ما فغيش قدامنا الا اننا نطلع بالقسر على المنابر ونفلع راسنا وندعى عيهم وعلى اللى جابهم كان راجل خمورجى صحيح - كل سنه وانتم طيبين"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095723/http://masr.20at.com:80/article.php?sid=1094"

