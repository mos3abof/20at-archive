subject = "تعليق"
author = "الدشم"
posted = "2006-10-25"
text = "الاخ واحد اللى عمال يتكلم على البنوك وكأنه خبير اقتصادى ، ايش عرفك ان البنك ناجح واخر فل او ان كده غلط ، واللى يدور على الاخ يلاقي بقاله فى كليه التجاره 9 سنين.<br />كفايه فتاوى بقى بدون علم ، وهو دلوقتى يرد ويقول ان الكلام ده مصدره جريده مش عارف ايه المعارضه من اللى بينطبعوا فى بير السلم دول.<br />نعم للتوريث ولاستكمال المسيره."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095723/http://masr.20at.com:80/article.php?sid=1094"

