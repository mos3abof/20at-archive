[[comments]]
order = 0
subject = "كل عام وأنتم بخير"
author = "مروان المصري"
posted = "2006-10-24"
text = "أود أن أقول كل عام وأنتم بخير ......<br />عندما نستيقظ في الصباح ونسمع زقزقة العصافير، وانشقاق السماء ......نسمع صوت التكبيرات وحينما تخرج للحاق بالصلاة، وحينما يقابلك شاب أو طفل صغير بابتسامة رقيقة وتذهب إلى المسجد المهم فتلتقيه ملئ بعربات الأمن وذلك لأن المصليين يتحدثون عن السياسة ولذلك فإن المصليين لا يتحدثون عن السياسة .......<br />لا أعلم صراحتا لماذا لا يتركوا التحدث في حكم بلادنا هذا أفضل من أن يتحدث غيرنا عن حكم بلدا لايرعاها"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095723/http://masr.20at.com:80/article.php?sid=1094"

[[comments]]
order = 1
subject = "البلد هتضييع ومين غيره هو السبب"
author = "واحد مصري أسمه مروان"
posted = "2006-10-24"
text = "أكيد السبب حكم مصر واللي بيحكم مصر ....<br />مصر دي المفروض أسمها بلده .............<br />المفروض يحميهاويحافظ عليها.............<br />المفروض يخلي بالوه من شعبها الطيب الأمير<br />اللي معندهوش فرصة حتى يعبر عن رأيه.....<br />هيكون من غيره و أوسخ منه ..............<br />مبارك اللي هيضيع البلد.................<br />الي هيوديها في دهية....................<br />ويخلي الوساخة اللي أعقل منه يحتلوها....<br />زي ماأحتلوا العراق وفلسطين.............<br />أرجوكوا اللي يقرأ موضوعي يرد عليا .....<br />علشان أعرف أنا لوحدي اللي في مصر بيكره.<br />ولآ في غيري؟؟؟؟؟؟"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095723/http://masr.20at.com:80/article.php?sid=1094"

[[comments]]
order = 2
subject = "يا مروان"
author = "واحد"
posted = "2006-10-25"
text = "يا مروان لما بدأوا الخصخصة قالوا اننا حنبيع الشركات الخسرانه لانه عبء على الدولة قلنا ماشي وبعد كده خلصوا الشركات الخسرانه ودخلوا على الشركات الكسبانه ولسا بايعين بنك اسكندرية مع انه كان بنك وطني وناجح<br />افهم باعوه ليه<br />هي عذبة ابوكوا يا ولاد النضيفه"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127095723/http://masr.20at.com:80/article.php?sid=1094"

