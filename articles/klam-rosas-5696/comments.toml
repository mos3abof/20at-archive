posted = "2007-11-14"
text = "على الرغم من الشهرة و المجد الذي حققته الفنانة العالمية داليدا >; إلا أنها لم تعرف يوما معنى السعادة الحقيقية الذي يتمناه الجميع ، داليدا إستطاعت تحقيق حلم الشهرة و الأضواء لكنها لم تستطع أن تجد المعنى الحقيقي للحب<br />داليدا أدخلت البهجة و الفرح في قلوب الملايين من الناس لكنها لم تستطع إدخال البهجة في قلبها<br />أغانيها لم و لن تموت و ستبقى داليدا خالدة في حياتنا و في قلوبنا و سيبقى الجميع يحبها جيلا بعد جيل"
archived = "2009-05-31"
