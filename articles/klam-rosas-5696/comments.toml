text = "السلام عليكم داليدا ذات الصوت الجذاب الذي لم ولن يتكرر طول من انا عايشة خارج مصر وكنت بحب اسمعلها لما كانت مصر بتوحشني كنت بجد بشوف فيها مصر الحلوة .طبعا ده كان زمان بس الغريب انها لغاية النهاردة فيها شيء غريب يخليني اسمع الاغاني بتاعتها كلها داليدا دايما بتحسسني ان لسة في امل ..هل مازال هناك أمل يا داليدا .. داليدا رمز من رموز مصر انا اعتبرها كذلك ..لم يأخذ حقه في اعتباري"
archived = "2009-05-31"
capture_url = "https://web.archive.org/web/20090531064706/http://www.20at.com:80/klam-rosas/5696.html"

