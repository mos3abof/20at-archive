text = "داليدا فعلا يا جماعه كانت ظاهره و متهيالى مش هتتكرر<br />مين فينا ميحبش يسمع احسن ناس و حلوه يا بلدى<br />انيس منصور بيحكى عن داليدا و بيقول انها انتحرت لانها حققت كل الاشياء اللى كانت بتتمناها الشهره و المال و الانتشار غير العادى و حاجات كتيره كانت بتحكيله عنها و بتتمناها لما كانت لسه بنت صغيره و بتحلم<br />و انا شايفه ان الكلام منطقى لانها شانها شان مارلين مونرو و غيرهم من الناس اللى حياتهم ادام الكاميرا بتكون الع[ *** ] خلف الكاميرا"
archived = "2009-05-31"
capture_url = "https://web.archive.org/web/20090531064706/http://www.20at.com:80/klam-rosas/5696.html"

