posted = "2005-11-16"
text = "لسلام عليكم و رحمة الله<br />أهنىء جميع الشباب بهذة الهزيمة المزلة للحزب الوثنى ( الوطنى ) و رئيسة منتهى الصلاحية<br />الحزب الوطنى ألان هو حزب الآقلية بنسبة 41%<br />و لكن فرحتنا لن تدوم طويلا طالما سينضم كل المرشحين المستقلين لقائمة الحزب كما يحدث كل مرة<br />طبعا دة انتهاك للقانون و ارادة الناخب"
