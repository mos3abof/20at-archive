[[comments]]
order = 9
subject = "مينا"
author = "مينا"
posted = "2005-11-19"
text = "ا جماعة مع كامل احترامى لكم و كامل احترامى لجماعة الاخوان المسلمين الا انى شايف ان<br />فوز الاخوان المسلمين فى الانتخابات شىء عادى و متوقع<br />اولا لان الاخوان المسلمين هى اكبر كتلة معارضة للنظام من حيث العدد و هى ( جماعة الاخوان المسلمين ) مش راضية تنصهر فى اى اتحاد معارضة وعايز تفضل مستقلة بنفسها عشان تستفاد لوحدها من كبر عددها<br />يبقى وقتها يعمل الناخب نفسه ذكى و يختار مرشح الاخوان لانها فعلا اقوى و اكبر جبهة معارضة للحكم ( مع ان الموضوع مش محتاج ذكاء الناخب اساسا)<br />ثانيا الشعار الدينى ( الاسلام هو الحل ) كافى جدا جدا لحصد الاف الاصوات حتى لو الناخب مش فاهم برامجهم الاصلاحية ( ده اساسا لو عارف يعنى ايه برنامج اصلاحى ) وده مع كامل احترامى للشعار و الاخوان المسلمين و المسلمين عمتا يدل على<br />سطحية و تخلف بلدنا وان الهاجس الدينى متوفر و بكثرة و يدل ايضا على تسيس الدين او تديين السياسة او بمعنى اوضح ادخال نزعة دينية فى النشاط السياسى و دى طبعا اساليب رخيصة بيستغلوا جهل الناس عشان تحقيق مصالح شخصية<br />ومع احترامى للى هيقراء مقالى و يضايق وو يرد عليا بكلام خارج انا بقله<br />ان على الاقل 11 مرشح من اللى نجحوا من الاخوان المسلمين جدد و منضمين حديثا للجماعة<br />بمعنى انهم تستروا بالجماعة و لبسوا ثوبها<br />اقرأ بقية التعليق .."
archived = "2006-09-26"
capture_url = "https://web.archive.org/web/20060926222016/http://egyvote.20at.com:80/article.php?sid=17"

[[comments]]
order = 10
subject = "ابقى قابلني"
author = "نجوان"
posted = "2005-11-20"
text = "لأخ مينا ...لا ادري ان كان هذا اسمك الحقيقي ام لا ، ولكن على العموم ان كنت مسلم أو مسيحي مرحبا بك في عشرينات ،ولكن لي أكثر من نقطة أود التعليق عليها<br />و اضيف على اتهاماتك اتهام آخر و هو الفتنة الطائفية ..أي ان البعض يروج بأن شعار الاسلام هو الحل هو شعار يثير الفتنة الطائفية ولا أدري ما علاقة الفتنة الطائفية بأن ترفع شعار ديني ..هل رفعنا شعار الاسلام هو الحل للقضاء على اليهودية مثلا؟أو الاسلام هو الحل ضد المسيحية؟ وهل اتهم الاخوان باقي المرشحين أو غيرهم من خارج جماعة الاخوان بأنهم ملحدين او كفرة !! مستحيل فلماذا تلك الحرب الضروس التي يشنها البعض ضد هذا الشعار!!وضد الاخوان ؟!!<br />الاسلام هو الحل ليس شعارا يستغل جهل أو سذاجة الناس ، بالعكس هو شعار يعيد ثوثق علاقتهم بدينهم ، أليس من الاستخفاف بعقول الناس و استغلال ظروفهم و فقرهم وجهلهم هو ما يحدث في الانتخابات الان ..حتى لو فرضنا ان تستخدم النزعة الدينية لدى المواطنين ،أليس أفضل من استغلال فقرهم ..بعشرين جنيه أو كيلولحمة أو كيس رز!! اليس الاسلام هو الحل شعار افضل من اطعم الفم تستحي العين!<br />اليس الحزب الوطني -الاغلبية !!- هو من مرر قوانين تخدم افراد بعينهم!!و هو من تستر على تجاوزات البعض..و شاهد باستمتاع تهريب الاموال و القروض خارج مصر!!اليس هو من يدلل رجال الاعمال (كما قالها نصا رئيس الوزراء السابق عاطف عبيد-علينا ان ندلل رجال الاعمال-)وهم من شردوا العاملين بالمصانع تحت شعار الخصخصة!!!<br />كل شباب مصر هيشتغلوا ..وبكرة تشوف بعنيك!!!<br />شعار رفعه الحزب الوطني ..ولكنهم نسوا او تناسوا ان يكملوا الشعار بأغنية روبي \"ابقى قابلني\"!!!"
archived = "2006-09-26"
capture_url = "https://web.archive.org/web/20060926222016/http://egyvote.20at.com:80/article.php?sid=17"
