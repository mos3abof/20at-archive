[[comments]]
order = 7
subject = "الله محبة"
author = "جربس"
posted = "2006-06-14"
text = "سعيدة الأول!<br />إيه ياحضرات حنقلبها حرب صليبية هنا وإلا إيه بالضبط، مش فاهم. أي واحد منا المسيحين بيظن إن المسيحي الغربي أقرب له من جاره المسلم، يبقى إما غلطان ومش عارف حاجة أو له غرض خبيث وعايز يولعها نار ويخربها ويقعد على تلها. مين له مصلحة في ده كله؟ ماما أمريكا وكل المامات في الغرب لايهمهم يسوع ولا العذرا ولا الإنجيل من أصله، وهما لما بيحتضنوا جماعات زي دول للأسف مصرين بيدربوهم إنهم يكونوا عملاء ليهم، ودول لايهمهم غير الكسب المادي، وعندهم ماتولع بجاز مدام حسابنا في البنوك بينمو. لازم نكون أوعى من كده، ونعرف إننا أهل وشركاء في هذا الوطن.<br />ياريت نشوف ونتعلم من تجربة الفلسطينين، مهما عايشين طول عمرهم سمن على عسل، وكلنا نعرف المناضل المطران كبوشي وغيره، وجورج حبش وكمال حنا ناصر، دول كلهم كانو في صفوف المقاومة الفلسطينية. القنبلة الي بترميها ماما أمريكا في العراق، متسألش إنت ديانتك إيه؟ وإحنا شفنا في أحداث سبتمبر إنهم كانو بيقتلوا الأقباط في أمريكا، فقط لأنهم مصريين، كفاية بقى أرجوكم.<br />الرد على كاتب المقال يكون بالحجة والمنطق ومش كده، ولا هو قال إنه متحدث بإسم المسلمين، ده حرام وعيب."
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

