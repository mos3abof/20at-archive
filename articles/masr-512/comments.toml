[[comments]]
order = 19
subject = "الأدب نعمة"
author = "أحمد السيد علي"
posted = "2006-06-15"
text = "إيه ياسي فاجومي بتتريق وتقول نكت ياروح أمك؟ إتلهي وإتلم أنا مش عايز أغلط.<br />قسما بالله العظيم العظيم إن البابا شنودة أنظف من شيخ الأزهر ومن مفتي الجمورية عندنا ومن الريس ذاته وكل طقم الخولات الي في الحكومة. إستنى يابتاع إنت، هو مين الي راح زي الكلب مع المجحوم السادات على إسرائيل، شنودة ولا بيصار؟<br />شنودة حرم على المسيحين زيارة بيت المقدس، علشان شاف الي بيعملوه في إخوانا الفلسطنين، تعاله شوف طنطاوي شرابة الخرج بقى ولا مفتي الحمهورية، إتلم يامحترم.<br />ولما شنودة شايف مصلحته مع الأمريكان، نلومه، والرياسة عندنا بتبوس الجزم والعتبات هناك، برافو عليه راجل عقر، وإلا حرام على شنودة بس، وحتما عليه يبقى وطني أكثر من الريس؟<br />بلا مؤاخدة مين يلوم العيال لو رب البيت كان ديوث والعياذ بالله، كفاية؟"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

