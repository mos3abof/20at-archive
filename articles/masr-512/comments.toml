[[comments]]
order = 5
subject = "مرحبا"
author = "سمسم"
posted = "2006-06-14"
text = "الأخت العزيزة ماريان تحية طيبة وبعد/<br />ماتقولينه لايخدم إلا أعداء الأمة، وهو يكرس ويعمق الشرخ الموجود فعلا بسبب سياسات خائن كالسادات، بين أبناء الأمة الواحدة. إسمحي لي أن أخاطبك كأخت في العروبة إن أردت، وأصدقك أني أبعد الناس عن إتهام المسيحين بصفات ليست فيهم، وأنا لا أعمم حيث مكان التخصيص، ولا أسدل بساط كاذب من الوئام على بركان هائج من الفرقة وأسمي ذلك الوحدة الوطنية، لابد من تطهير الجرح جيدا قبل تضميده.<br />قبل لعن جدود العرب حبذا لو إسترجعنا شيئا عن تاريخ مصر قبل دخول المسيحية، ماذا كانت؟ كانت على ديانة الفراعنة أليس كذلك؟ وثنية كلها.<br />والآن أسأل هل جاءتها المسيحية مباشرة من فلسطين، أو بطريق الرومان؟ الإحتمال الأول هو الأرجح، جاء أفراد قلائل من معتنقي المسيحية ودعوا سكان مصر العليا للإيمان بدعوة يسوع، فمنهم من قبل ومنهم من فضل أن يبقى على معتقدات الآباء والأجداد الوثنية.<br />وحتى الدولة الرومانية ذاتها وبرغم إتخاذ المسيحية ديانة رسمية بعهد قسطنطين، وبغض النظر عن أنه ذاته ظل على وثنيته طوال حياته، كانت خليطا من ديانات شتى، ولم تكن الديانة المسيحية مسيطرة فعليا بل إسميا، كمثل حال البلاد المسماة اليوم بالإسلامية، ظاهرها الإسلام وباطنها لايعرفه إلا خالق الكون.<br />أقول إن كان هذا حال دولة ذات قوة مسلحة جبارة وحضارة لاينكرها إلا مغالط لنفسه، وقد إحتلت مصر لحقب طويلة، فهل تصديقين فعلا أن بعض الدعاة جاءوا خلسة وأقاموا بصعيد مصر قد إستطاعوا تنصير كل الوثنين فبها بهذه السهولة؟<br />لو قلت لي أن الدولة الرومانية ساعدت وشجعت المصريين على دخول المسيحية بما تملكه من قدرات ومغريات، لكان أقرب للمعقولية أن نسبة معينة من السكان قبلت دين المسيحية الوافد (تماما كدين العرب) لهذا السبب أو ذاك، أم تراك تزعم<br />اقرأ بقية التعليق .."
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

