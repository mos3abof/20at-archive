text = "معلهش لو ممكن حد يصلح لى معلوماتى<br />العرب والاسرائليين من نسل سام<br />والمصريين من سل حام<br />ممكن آعرف نسل باقى الاجناس ـ الافارقه والاسيوين الاروبيين<br />وشكرا على التصحيح"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 37
subject = "طيب يازينب"
author = "العفريت"
posted = "2006-06-19"
text = "ياست زنوبة كبري مخك شوية الله يخليك، طوفان نوح كان عقاب لقوم نوح وحدهم من البشرية كلها، وده عدل من الله، وبعدين ده كان طوفان محدود جغرافيا بحدود نهر الفرات، أو في الدلتا الي بين دجلة والفرات.<br />يعني لاغطى جزيرة العرب ولا اليمن، كويس يعني العرب كانوا موجودين دايما، قبل سيدنا نوح وبعده، وقبل سيدنا إسماعيل، وإسماعيل أبو فرع من العرب مش كل العرب.<br />المشكلة إنتي متصوره إن البشرية أعادت تكوين نفسها من ولاد نوح الثلاثة ده غير صحيح إطلاقا.<br />لايعلم إلا الله سبحانه وتعالى آباء باقي الأجناس، دول من نسل آدم وحواء، ومن يدعي علم ذلك يكذب على الله، ولو تصدقي حسابات التوراة يبقى عمر الأرض لايزيد على خمس آلالاف عام، فهمتي؟"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 38
subject = "الكنيسة المعذبة"
author = "عبد المسيح"
posted = "2006-06-19"
text = "سلام المسيح يكون معكم جميعاً<br />ربنا يسوع المسيح لة كل المجد قال فى الكتاب المقدس (الانجيل) احبو اعدائكم فما بالكم اذا كان المسلمين جيران لنا فاولى بنا ان نحبهم دى حاجة الحاجة التانية فى العالم سيكون لكم ضيق فمن اين ياتى الضيق لو لم ياتى من جيرانا<br />الحاجة التالتة اعتقد ان المسلمين بيتضايقو على مسلمين الشيشان و افغانستان وكمان بتساعدوهم وتسافرو علشان تجاهدو معاهم فهل حرام على اقباط المهجر ان يدافع عن ابية او امة او اخوة او اختة ولا الكيل بمكيالين من صفاتكم حرام عليكم اما بالنسبة لسيدنا قداسة البابا فهو رجل وطنى غصب عن عين اكبر واحد فيكم بل بالعكس فهو يمتص بحكمتة غضب المسيحيين ابنائة ونحن نثق فى ابوتة<br />ولولا حكمتة ووطنيتة لانقلبت الامور اما بالنسبة لاى كاتب الاحسن لية انةيكون عارف بيقول اية مش مزقوق من السعودية علشان اكل عيشة عليهم واخيراً نعمة المسيح تكون معكم جميعاً"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 39
subject = "Noso Nanosoooooooo"
author = "مصري مقيم بدبي"
posted = "2006-06-19"
text = "القارئة نوسو (المحترمة) ياريت تسقينا من علمك الواسع, لأنك بتحكمي علي الناس يبقي انتي احسن منهم, بالنسبة لمعرفة الدين او لأ ديه حاجة متهمش حد غيري انا, لاني لم اقم باصدار فتوي او قمت بتكفير اي مسلم, انا بقول رأييء الشخصي بس وللأسف علشان احنا في مصر مفيش عندنا حاجة اسمها الرأي الاخر لازم يطلع حد زيك ميعجبوش الكلام, وانتي بتواجهي حد واجهي بحرفية اكتر وبيني نقاط الضعف اللي انت شايفها, مش الكلام العام اللي مش مفهوم ده, واتمني رد حضاري ,وفي كل مرة هكرر شكري للشباب المذهل القائم علي الموقع ده."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 40
subject = "الكنيسة المعذبة 2"
author = "عبد المسيح"
posted = "2006-06-19"
text = "اكمل كلامى علثان ماكنتش قريت الموضوع كويس جايبلى اسماء ناس اللة اعلم اذا كانو مسيحيين ولا لا زى جمال اسعد والتانى اللى مش فاكر اسمة و اضف عليهم نبيل لوقا بباوى و ميلاد حنا وكمان لوحبيت شيخ الجامع بتاع منطقتنا اللى جمعة واخدها وعظ وشتيمة فى اليهود والجمعة اللى بعديها النصارى دة يقول راية فى المسيحيين و البابا رايهم صح حرام عليكم هنفضل لغاية امتى نسمع كلام الجهلة ولا تجادل ولا تناقش يا اخ على لكن بالنسبة لامور الكنيسة ياريت نناقشها مع المستشار نجيب جبرائيل و الاستاذة هالة المصرى او ابونا زكريا اللى عمال بيبعت اسئلة و بيتمنى حد من الافاضل شيوخ الازهر يرد علية مش كفاية تزوير تاريخ البلد وتقولو رحب الاقباط بالغزو العربى حرام عليكم ولا نسيتوا مكتبة الاسكندرية الى اسسها البطالمة وحافظ عليها الاقباط وحرقها عمر لما بعت رسالتة لعمر ابن الخطاب يستاذنة فى حرق المكتبة العظيمة وكان رد عمر لعمرو لو وجدت فيها كتاب اعظم من القران احرقها ولم وجد بها الانجيل فقام بحرق المكتبة واتهم فيها الاقباط سلام لغاية ما افتكر حاجة تانية"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 41
subject = "من قال ذلك؟"
author = "وديع حداد"
posted = "2006-06-19"
text = "أخي الفاضل عبد المسيح سلام الرب معك، لست مصريا ولا قبطيا، بل عربيا مارونيا، وأتمنى ألا أكون من الجهلة بعد كل ما درست.<br />من أين تأتي بمعلوتاتك هذه؟ عن موقف الأقباط من الغزو العربي كما تسميه؟ ثم عن مكتبة الإسكندرية؟ ليتك توضح لنا مصادرك؟ هل هذا موثق بشكل لا يرقى اليه الشك؟ أم سمعته فقط أو قرأته بإحدى المواقع الشبكية؟<br />منطقيا طالما كان عمرو بن العاص يملك القوة العسكرية، ويزمع حرق الإسكندرية كلها لامكتبتها فقط، سيفعل دون الحاجة لإتهام أحد، وقتها لم يكن هناك صحافة ولامحطات بث تيلفزيوني لتنقل للعالم.<br />وأيضا لاتصدق لو أراد العرب المسلمون أو من توالى على حكم مصر من قوميات أخرى مسلمة إجبار المسيحين على الإسلام، كان يبقى للآن مسيحي واحد. قد نختلف و المسلمون دينا وعقيدة كل الإختلاف، لكن أن نلصق ببعضتا البعض أكاذيب روجها فينا المستعمرون هذا حرام وجهل.<br />شكرا لإصغائك"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 42
subject = "مش موافق علي كلام عبدالمسيح"
author = "مصري مقيم بدبي"
posted = "2006-06-19"
text = "عبدالمسيح كلامك كله هجوم بجد ياريت تدينا معلومات صحيحة رداً علي الكاتب لكن مش تهاجم كده للكلام وبس, ياريت تسأل وتخلي حد يقول رأي علي الكلام, بكده هتعلن عن صحة كلامك, انا مسلم والميزة اني لم اعيش جو الطائفية والحمد لله, انا هنا عايش وبشتغل مع سني وشيعي وارثوذكسي وماروني وكاثوليكي وفيه السيخ كمان وفيه من غير دين, يعني موضوع الديانة ده محدش بيفكر فيه خالص.شكراً"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 43
subject = "مصري مقيم بدبي - كفاية نفاق على عبط"
author = "عبد الصليب حبيب"
posted = "2006-06-20"
text = "ياريت واحد بغل زي حضرتك ينقطنا بسكاته، بدل ما كل شوية يقرفنا بكلامه المعجون عباوة. إنت منحاز وطائفي وعامل نفسك وطني وحريص على المسيحين وتعرف مصلحتهم أكثر منهم، ده معقول يا منافق!"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 44
subject = "بزياده ياأخي هريت وبره"
author = "الفريد ميخائيل"
posted = "2006-06-20"
text = "الأخ عبد الصليب الرب يعوضك<br />بزياده بأه وحياتك كفاية هريت وبر أخينا أبو العريف، أتفق معك في كل حاجة، لكن مش أفضل يكون منافق وغبي؟ بكده يبقى مكشوف للكل، وكل من يسمعه يقوله إخرس ياحيوان ويتف في خلقته. النوع الطفيلي ده للأسف هو الي واخد فرصه في البلد، تلاقيه مع اليهود يهودي أكتر منهم، ومع المسيحين ومسيحي أكتر من المسيح ذاته، وهلم جرا. ولو سألته عن إي حاجة حيجاوبك: \"أتهم تنظيم القاعدة بالوقوف خلف وباء أنفلونزا الطيور بالتعاون مع الفلسطينيين\"."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 45
subject = "مش هرد عليك باسلوبك"
author = "مصري مقيم بدبي"
posted = "2006-06-20"
text = "للمرة المليون مش هنزل لمستوي الرد الغبي اللي هيخليني اغلط في اي بني آدم, يا بتاع انت انا لا خايف علي المسيحية لاني مش منهاوكذلك اليهودية ولا الاسلام حتي لأني بمشي ورا كلام عقلي ,بس ليه منكلمش بصراحة و علي المكشوف كله عايز يشيل من التاني وخلاص, من ناحيتك بترد علي الكلام بتاعي معندكش الجراءة او المعرفة انك ترد علي الكاتب, وبالنسبة للتاني نفس القصة بتاعتك, طيب بدل ما تغلطوا في الناس اللي كاتبة رد يا اخي علي المقال الاول, انا مشفتش حد قادر يرد بحرفية علي الكاتب يبقي كلامه صح 100%,ولو عندك رد ياريت يكون بعقلانية مش شغل عيال صغيرة( يا توتووو)."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 46
subject = "ياعدمات التقافة والأدب"
author = "فرعون موسى"
posted = "2006-06-20"
text = "ههيهة!<br />\" ولو سألته عن إي حاجة حيجاوبك: \"أتهم تنظيم القاعدة بالوقوف خلف وباء أنفلونزا الطيور بالتعاون مع الفلسطينيين\"\".<br />يجازيكم ياولاد الإية حقيقي ولاد نكتة وحظ! بس مش تخلونا في الموضوع، حيفدنا إيه نقول للبهيم إنته ولا مؤاخذة مبتفهمش؟ ولا لأبو مليون وش ياوحش؟ خصوصا لما يكون جلده متمسح وضد راجمات الصواريخ.<br />ياولاد عيب ده باشمهندس قد الدنيا وبيعرف\" كومبي يوطر- زي مابينطقها هو\"، بعدين يقول عليكم عديمين التقافة، كويس؟ سيبوه، الضرب في الميت حرام، وبعدين بجد هو مفيش غيره جبلة وعديم إحساس ومنافق؟ كفاية خصام..ده والله حرام!"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 47
subject = "شوية شوية هو الإسلام ناقص روبيضات!"
author = "طارق"
posted = "2006-06-20"
text = "عيب يامصري مقيم بدبي<br />يعني حضرتك ملحد وكافر بكل الأديان \"لا خايف علي المسيحية لاني مش منهاوكذلك اليهودية ولا الاسلام حتي لأني بمشي ورا كلام عقلي!\".<br />ولاعقلك أحسن من رسالات السماء؟ إذا كنت في دبي وبتقول كده؟ تعمل إيه لو عشت في أوروبا ولا أمريكا؟ أكيد حتشارك في طعن الإسلام، إن مكنتش بالفعل.<br />لعنة الله على عديم الإيمان والولاء والعقيدة!"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 48
subject = "السفينة تغرق بالجميع"
author = "تلسكوب"
posted = "2006-06-20"
text = "بداية اشكر فرسان هذا الحوار مسلميين ومسحيين..لي تعقيب بسيط نحن جميعا فى سفينة واحده هى مصر الوطن وثمة موجة مدمره اسمها الاطماع الخارجية انا اسأل الجميع سؤالا واحدا لماذا الان الاهتمام الخارجى باحوال المسيحيين في مصر ولماذا مصر بالذات مع ان هناك دولا وافرادا في كل بلدان العالم يعانون معاناة حقيقية اولها التعذيب ونهايتها الموت ...المسيحيون المصريون هم هموم المسلمون المصريون والعكس صحيح ..في المترو انا اقف لأمرأة كي تجلس لايهم اكانت مسيحية او مسلمة وادافع عن صاحب حق في عركة لايهم أكان مسيحيا او مسلما...الحملة الصليبية دخلت القدس باسم الرب واغتصب جنودها الراهبات العذارى فى الاديرة التي قابلوها ...وقام الحجاج المسلم بقتل من عارضه حتى من علماء المسلمين...أرايتم الحق حق والباطل باطل بغض النظر عن صفة صاحب الحق ومرتكب الباطل."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 49
subject = "إكذوبة إحراق مكتبة الإسكندرية"
author = "جميل حاوي"
posted = "2006-06-20"
text = "هذه الأكذوبة قد فندها منذ أمد طويل الغربيون قبل المسلمين والعرب وإليكم تفصيلات ذلك.<br />احترقت مكتبة الإسكندرية القديمة عدة مرات قبل دخول العرب إلى مصر:<br />1. الحريق الكبير زمن يوليوس قيصر: ذلك الحريق الكبير الذي شب على أيام يوليوس قيصر 47 ق. م. والراجح أن يوليوس قيصر هو الذي أحرقها، حين انطلقت قذائفه تجاه دار صناعة السفن القريبة منها فاحترقت وأحرقت المكتبة يقول بلو تارك أنه احترق زهاء 400000 لفافة في هذا الحريق ونحن نضيف أنه بقي بها من خمسين إلى مئة ألف، وأن أنطونيو قد وهب زوجته كليوباترا – التي تخرجت من هذه الدار وكانت تحمل في أعماقها كل ما يحمله التلميذ لجامعته – أهداها ما يقرب 400 ألف لفافة من الرق كان قد نهبها من مكتبة برجامون) (الدكتور خالد الحديدي - مكتبة الإسكندرية).<br />2. حرقها خلال الثورات ضد البطالمة:<br />3. حرائق رجال الدين المسيحي للمكتبة: (وفي إحدى الصدامات العنيفة والثورات الجامحة بين المسيحيين والرومان قام مسيحيو الإسكندرية عام 303 م بأعمال عنف ودمروا تماثيلهم وآلهتهم، وقضوا على ما بقي من الجامعة والمكتبة).<br />(وفي عام 323 م تولى حكم الإمبراطورية الرومانية قسطنطين الأول (280 – 327 م) الذي آمن بالمسيحية… وانتهز بطريق الإسكندرية ثاوفيس هذه الفرصة، فقام ومعه العديد من المسيحيين بهدم ما بقي من معابد الرومان ودمر معبد السيرابيوم … كما أحرق المكتبة الصغرى وقضى عليها، وأقام مكان ذلك كنيسة)."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 50
subject = "سؤال مهم جدا!"
author = "سليم"
posted = "2006-06-21"
text = "عبد المسيح بيظن إن صفحات الإنترنت نت مصدر هام لإحتكار كتابة التاريخ، وكل واحد يقول ما يشاء، من باب محدش بيدقق، والمصريون لا يقرأون ولا يفهمون، ربما عنده حق في نسبة، بس مش الكل.<br />سؤال: هل كان في يوم من الأيام دولة قبطية حكمت مصر؟ سواء مستقلة أو تحت الإحتلال الروماني شبيهة بمصر النهاردة؟<br />رجاء الإجابة مع ذكر مصادر ومراجع عالمية، مش القسيس فلان قال.<br />سؤال: هل كانت أراضي مصر أملاك بما فيها ومن عليها من بشر وحيوان ونبات، ملك خالص لقيصر، وإلا للأقباط؟<br />العرب هم الذين أعادوا ملكية الأرض لسكان البلاد، وفرضوا على الأغنياء فقط جزية ضئيلة جدا، تستخدم في الدفاع عن البلاد، وهذه الجزية كانت لاتذكر مقارنة بالضرائب التي تدفع للرومان.<br />حريق المكتبه أجاب عنه الأخ الي قبلي وأظنه مسيحي!<br />في إنتظار الرد."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 51
subject = "فرعون ابو العريف"
author = "مصري مقيم بدبي"
posted = "2006-06-21"
text = "انا هعصر علي ايدي ليمونة وهرد عليك ومش هغلط فيك برده, بس انت بتهاجمني في شخصي ومش بترد خالص علي الكلام اللي انا كاتبه, لو مش عاجبك انت مالك بيا غبي ولا ذكي ولا حتي كيس جوافة, بالنسبة (للكمبي بوطر) زي ما انا بقول عايز اقولك يا..... اني مهندس كمبيوتر, وياريت تتحفنا انت بقي ايه في الحياة يا ابو العريف, اما بالنسبة لطارق انت حكمت عليا اني ملحد وباقي كلامك ,انا عايز اعرض عليك كام موضوع بس رد بصراحة من غير تظاهر مثلا موضوع الصيام عند المسيحين يعني لو كل حاجة فيها روح كده عمل خطيئة مثلاً و موضوع الكحول تقدر تقولي ليه حرام علشان بتسكر العقل طيب انت بتبقي مبسوط بده ممكن يكون الافراط فيها غلط بس ليه بتلعن اللي شايلها واللي شاربها والخ.. انا لما بشرب كحول مش بحس انه حرام, وموضوع تاني موضوع الجنس انا عايز واحد عاقل وعنده شجاعة ويرد بصراحة ويقول انه لم يمارس الجنس ولو حتي كعادة سرية لإن الاتنين المفروض حرام بس انت علشان مش متوفر لك بنات بتقول ان الزنا ده وحش اوي وذنب كبير ,وانت شغال في الحمام ليه بتنافقوا نفسيكوا وبتنقدوا الناس, الجنس عبارة عن احتياجات بالفطرة يعني ربنا خلقها فينا وانت مش بايديك تمنعه فلازم تديله مساحة في حياتك مش نفضل نخلي عند الشباب والبنات كبت للأبد ومينفعش اقول ان ممارسة الحب ديه حرام, ديه كلها مواضيع عقلية ليست لها علاقة بالكتب السماوية ,واحد هيطلع يقول كل تفكيرك في الكحول والجنس ومش عارف ايه, ده جزء من الموضوع ومش كله وفيه تاني بس عايز رد."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 52
subject = "إنت لقطة يامصري مقيم"
author = "الفرعون الأصلي"
posted = "2006-06-21"
text = "مصري مقيم بدبي سيبك إنت منهم دول معقدين ومتخلفين، ما حد فهمك غيري، وطالما إنته رأيك كده في موضوع الكبت الجنسي، ياريت تكمل معروفك وتديني عنوانك في مصر، أتعرف على إخواتك البنات ونبقى نطبق نظريتك ونوري الجهلة دول معنى التحرر، وديه كلها مواضيع عقلية ليست لها علاقة بالكتب السماوية، أتفق معاك ساعتها 100%.<br />قلت إيه ياأستاذي، عدل هالشي لو لأ؟ زين نطيني العنوان بعد، وآني راويك شلون أساوي، كلام إماراتي صح؟<br />أوعى ترجع في كلامك خليك راجل، متخليش كلام المتخلفين يأثر عليك، واهو متعه لي ولإخواتك، ده إنت لقطه."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 53
subject = "كلها بقت فراعنة"
author = "مصري مقيم بدبي"
posted = "2006-06-21"
text = "طيب ممكن قبل ما اديلك عنواني في مصر,علشان انت بقي الواد الفتك اللي هيروح يعرف اخواني البنات معني الكبت الجنسي وقبل ما تعيش في دور الشاب الذكي , لو راجل وبتفهم رد علي الكلام بتاعي, اصل احنا كده مش فالحين غير في الفهلوة والفتاكة اللي علي الفاضي."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 54
subject = "حنرجع في كلامنا"
author = "فرعون الأصلي"
posted = "2006-06-21"
text = "عيب دحنا بقينا كده نسايب بين قوسين، سيبك من الكلام والوعظ والإرشاد أنا لو إنت مرجعتش في وعدك أصغر ثلاميذك ومريدك، ولو تحب أرشحك لرئاسة الجمهورية، إحنا مصدقنا نلاقى فكر منفتح، خلي الشيوخ مع القساوسة مع الأحبار يولعوا بجاز.<br />خليك ثابت على مبدأك النبيل، سيبك إنته من ولاد الحواري دول الفانتكز والفندامنتلسز دول، أنا فري ليبرال، أوعى تخلى بيه، وتعشمني بالبوسي وبعدين تقول سوري آم كدنج، ولا بولشت أند ستف، يعيش مصري مقيم بدبي، يسقط الكبت!!"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 55
subject = "طب وإحنا يا أناني"
author = "نمرود"
posted = "2006-06-21"
text = "الله دي حلوت قوي، إيه يافرعون عاوز تهيص لوحدك، طب وإحنا؟<br />سيبك منه يامصري مقيم دبي، ده بتاع كلام وبس وبيفقع البنات زمبه ويهرب الجبان، وبياخد فياجرا مش محوقة فيه. إيه يافرعون علشان عندك مرسيدس فاكر خلاص يعني، البنات عايزه راجل مش بس عربيه، ومالها يعني الفيات بتاعتي؟<br />ولا أقولك علشان تبقى عدالة وإنت الي طلبت الأول ومهدت نبقى شركاء؟<br />كويس كده يامصري بيه، بيه بس يا باشا، ياخديوي، ادينا العنوان بأه!"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

