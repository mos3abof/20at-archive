[[comments]]
order = 9
subject = "لماذا هذا الحقد علي المسلمين من اخوانهم المسيحيين"
author = "أحمد محمد محمود"
posted = "2006-06-14"
text = "يا أيها الأقباط المتطرفون : لآ داعي للشعور بعقدة الأضطهاد من المسلمين فأنتم تحصلون علي حقوقكم أكتر من المسلمين ولكنكم لآ تكتفون ولآ يعلم أحد ماذا يدور في نفوسكم والمسلمين لآ يفكرون فيكم فهم مهمومين بمشاكلهم ولا وقت لديهم في اضطهادكم فالدين لله والوطن للجميع"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

[[comments]]
order = 10
subject = "مجرد تاملات"
author = "مرتيروس المصرى"
posted = "2006-06-14"
text = "السلام لكم جميعا<br />مش عارف لية كل ما حد يجى يكتب تعليق يروح شاتم التانى ؟؟ يا جماعة ياريت نخلى النقاش هادى<br />احب بس اعلق على نغمة غبية مش احب اسمعها تانى وهيا ان البلد بتاعة المسيحيين 0احنا يعنى ) وان المسلمين اغراب من شبة الجزيرة ولازم يمشو منها!!!! نغمة غريبة عبيطة ومالهاش لزمة لان مفيش حد بيطرد حد من البلد<br />المطلوب بس ان المسيحيين يا خدو حقوق المواطنة كاملة زى المسلمين تمام وبس احنا مش عاوزيين اكتر من كدة<br />اما الاخ اللى بيقول ان المسيحين واخديين حقهم بزيادة فانا عاوز منة يعدد لى اية هيا الحقوق اللى حصل عليها المسيحيين والمسلميين مش طايلينها؟<br />اذا كان الكنايس مش عارفيين نبنيها؟ واذا بنينا واحدة جرى بسرعة يطلع جنبها جامع عظيم ويوجة الميكروفونات ناحينها وتدخل الكنيسة اى وقت تصلى تلاقى صوت الصلاة فى الجامع يغلوش عليك !! يحب الاخ المسلم ان يحصل العكس؟<br />المسيحيين اللى استشهدو فى الكشح والزاوية الحمر وغيرها وغيرها<br />يحب الاخ المسلم يحصل لة كدة ؟<br />انا شخصيا خريج احدى الكليات العملية وكثيرا ما سالت عن اسمى فى الامتحان الشفوى وعند الاجابة يتغير وجة الممتحن وكانة شاف استغفر الله العظيم 0 لية كدة ) وطبعا المحصلة النهائية اسئلة فى منتهى الصعوبة والسقوط المتين طب لية كدة ؟<br />تحب يا اخونا المسلم يحصل معاك كدة ؟<br />دى بس نماذج مش تعديد لان الباقى كتير<br />يا جماعة يا اخواتنا المسلمين احنا مش عاوزيين حاجة غير المساواة هوة مش احنا بندخل الحرب زيكم وبيتاخد مننا ضرايب زيكم ؟ طب ما تعاملونا زيكم !!<br />سؤرال اخير للتامل<br />واحد مسيحى اترشح لاى موقع<br />يسقط مباشرة لو اى حد مسلم اترشح ضدة حتى لو المسيحى اكتر كفائة ؟<br />ليييييييييييييييية؟؟؟؟<br />طبعا لانىة مسيحى .. طب واية يعنى ؟؟<br />السبب<br />اقرأ بقية التعليق .."
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

