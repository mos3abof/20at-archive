[[comments]]
order = 75
subject = "ماهو واجب المسلم بالنسبة الى غير مسلم"
author = "صليحة"
posted = "2006-10-14"
text = "السلام عليكم يا اخواني المسلمين يجب ان تعرفو نقاط مهمة الواجب المسلم بالنسبة الى غير مسلم الدعوة الى الله عزوجل وهي ان يدعوه الى الله ويبين له حقيقة الاسلام ونصيحته لقوله عليه الصلاة والسلام لعلي رضي الله عنه لما بعته الى خبير وامره ان يدعو اليهود الى الاسلام قال فو الله لان يهدي الله بك رجلا واحدا خير لك من حمد النعم فدعوته الى الله وتبليغه الاسلام ونصيحته من اهم المهمات<br />2_لا يبداه بالسلام ولكن يرد فالمسلم لا يرد الكافر بالسلام<br />3_ادا كان جاره غير مسلم فاليحسن الجوار ويحترمه<br />4_يعزيه ولا يحضر حفلاته ولا شئ من دلك<br />هده نقاط يجب ان يعرفها المسلمومنن اراد التعليق ام المناقشة فهدا بريدي اللالكترونيsolenelove16@hotmail.com"
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111125632/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 76
subject = "انقذونا من الكنيسة"
author = "ريمون"
posted = "2006-10-23"
text = "احنا عايزين حرية بجد ..<br />مش من الدولة ..<br />لكن من الكنيسة ..<br />تهديدات منهم لنا و مطاردة ..<br />مش عارفين نعيش ..<br />و الدولة مش بتعمل حاجة ..<br />ولا بتحمينا من اطهادهم ..<br />ولا من مطاردتهم لينا ..<br />و قصص اللى قدرت الكنيسة توصلهم مشهورة و محدش يعرف عنهم حاجة زي دكتورة وفاء قسطنطين ..<br />التعذيب و التنكيل فى اديرة ورا الشمس لكل من يقول الشهادة ..<br />و الباقي اختفى و غير اسمه و بلده عشان يهرب بدينه زي دكتور وديع احمد ..<br />فلازم نفضل مسيحيين بالاسم و الفعل .. مسلمين بالقلب عشان مفيش حد يتعرضلنا لانه من الاخر مفيش حد بيحمينا منهم ..<br />لان مش كل المسيحيات الاتى تريد دخول الاسلام لها زوج مسلم يحميها و يحمي عقيدتها زي ماريان ..<br />هي دي مطالبي ..<br />الحماية للمسيحيين الذين يريدون دخول الاسلام فقط ..<br />و غير ذلك لا اجد مطلب اخر .."
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111125632/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
