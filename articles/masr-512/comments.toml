[[comments]]
order = 1
subject = "التغيرات فى المجتمع وليس فى الكنيسه فقط"
author = "جورج اسكندر"
posted = "2006-06-14"
text = "كاتب مقال التغيرات فى الكنيسه كيف تعطى لنفسك الحق فى التدخل فى شئون الكنيسه وانت غير مسيحى ومنذ متى تهتمون اساسا بالهموم القبطيه؟ الا عندما حدثت الحوادث المؤسفه على يد المدعون مختلون عقليا من قيل الحكومه وانه لامر مؤسف ان تدعى على الاقباط الماجرون انه يريدون فتنه ومؤامرات لمصر؟ ياعزيزى اولا انى ارفض لقب اقباط المهجر وهناك ايضا مسلمون المهجر؟ اليس كذلك واخطرهم الذين يعملون فى دول النفط والذين من بينهم من رجع الى مصر بافكار وهابيه من دول الخليج تكفر كل ماهو ليس مسلم؟ اليس كذلك ان للاقباط حقوق والدوله لا تستجيب لشىء وعندما اصبح للاقباط صوت مسموع عبر وسائل الاعلام المختلفه الان تدعون بكل كذب وافتراء مؤامرات اقباط المهجر؟؟ اى بهتان وزور فى ادعاءكم الباطل واين ياعزيزى المدعى مختل عقليا؟ من احداث الاسكندريه الاخيره؟ اسمعت عنه شىء وقد مر شهرين على الحادثه؟ ام انه التعتيم الحكومى على كل مايمس هموم ومشاكل الاقباط؟ اليس من العداله ان يقدم هذا القاتل للمحاكمه؟ ام دم الاقباط وهذا مؤكد ليس له ديه فى البلاد المحكومه بالدين الاسلامى اليس هذا ظلما؟ واذا حدثت مثل هذه الحاثه على العكس لاناس فى يصلون فى مسجد وكان القاتل قبطياا بالله عليك فكيف سيكون التعامل معه؟ ارجو ان تجاوب وبضمير؟ وستعرف الاجابه سيحكام وبعد ان تقوم الدنيا ولا تقعد هذا هو نموذج الحياه الغير عادله التى يعيشها الاقباط فى وطنهم الاصلى وفعلا كما قال المثل العامى (البيت بيت ابونا والغرب يطردونا) وعلى فكره ان الله الذى حمانا منذ الازل ومنذ دخول وغزو العرب لمصر هو الذى سوف يحمينا الى الابد وان اكبر معجزه تدل على صحه كلامى اننا مازلنا نحن المسيحيون ندين بديننا رغم دخول الاسلام لمصرمن اربعه عشر قرن ولم يستطع الاضطهاد والقتل والنهب وط<br />اقرأ بقية التعليق .."
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

[[comments]]
order = 2
subject = "رد على مقال التغيرات فى الكنيسه"
author = "ماريان"
posted = "2006-06-14"
text = "ليس لك اى حق ان تتحدث عن الكنيسه يا كاتب هذا المقال وليس لك اى صفه اساسا حتى تقول عن اقباط المهجر انه مروجى مؤامرات وانت تقول فى مقالك ان ذلك سوف يضر بالمسيحين المصرين؟ اهذا تهديد او ماذا؟ ليكن فى علمك اننا نحن المسيحين او كمان تدعونا اقباط وانت لاتعلم ان كلمه قبطى معناها مصرى فى اللغه القديمه وفعلا نحن المصريون المسيحيون وانت وامثالك من العرب الذين دخلوا مصر غزاه كلامك ليس له اى صفه وسوف يبقى المسيحيون هم اصحاب البلد شئت ام ابيت وسوف نحصل على حقوقنا ولك من السودان خير مثال ولتذهب انت ومن على شاكلتك الى الجحيم"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

[[comments]]
order = 3
subject = "لحظة صدق"
author = "ابو شريف"
posted = "2006-06-14"
text = "الي السادة الرافضون المقال بسبب اسلام كاتبه اقول ... إن قبطي في اللغة المصرية القديمة تعني مصري وهذه حقيقة لاخلاف عليها ويتم دمجها بصورة مغلوطة بالدين المسيحي الذي نؤمن جميعا كمسلمين به وهذه حقيقة مؤكده لاخلاف عليها ... ولكن الخلاف الذي بيني وبينكم هو حلمكم بإندحار الاسلام عن مصر - ولنا في السودان اسوة كما يذكر الاخ الكريم - فهذا هو الحلم المستحيل تحقيقه - مصر المذكورة في القرآن ، وصدقني يا اخي الفاضل ان الاسم والمسيحية أو المسيحية والاسلام الحقيقيين هنا في هذاالبلد الطيب الذي لانعرف من ينفخ في نار الفتنه لعنه الله ، أما المجانين اللذين يتهجمون علي الكنائس والذي تستغرب منه فإنت كمسيحي مصري أو مصري مسيحي (حتى لاتفهم كلامي خطأ) من حقك تتبع خط سير التحقيق والقضية عن طريق محامي عن طريق الكنسية عن طريق عضو مجلس الشعب عن دائرتك عن اي طريق وستجده إن شاء الله ولابد أن ينال عقابه ... أما قولك إن المجرم لايحاسب في ظل قوانين مصر الاسلامية فياسيدي الفاضل الشريعة الاسلامية لاتفرق في الحقوق والواجبات بين المسلم وغير المسلم ... فليس في القرآن أو السنة المحمدية ما يقول السارق المسلم اتركوه والمسيحي اقطعوا يده فقد قال رسولنا الكريم والله لو سرقت بنت محمد لقطع محمد يدها هذا هو الاسلام ... الاسلام الذي منع الفاروق عمر بن الخطاب أن يصلي داخل كنيسة حتى لايفعل مثله المسلمون ويقولون هنا صلي أمير المؤمنين ... الاسلام الذي منع عمرو بن العاص من هدم بيت إمرأة مسيحية عجوز عندما اراد بناء مسجده هذا هو الاسلام ... أما ماتقول من تجاوزات تصدر من مسلمين فهؤلاء أخي الكريم لايمثلون إلا أنفسهم فقط وإلا كان المسليمن قد حملوا إخوانهم المسيحيين جرائم المؤامرات المتحدة الأمريكية وما تفعله بالشعب العراقي المسلم ولك<br />اقرأ بقية التعليق .."
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

