subject = "ليس كافرا بل منحلا ديوثا أعوذ بالله"
author = "طارق"
posted = "2006-06-21"
text = "أستغفر الله العظيم من كل ذنب<br />إستاذ (مصري مقيم بدبي) إن كان فيك بقية من عروبة، لن أقول إسلام فهذا أنت نفيته قطعيا، فإسمع من فضلك لما أقول:<br />عن أبي أمامة أن فتى شابا أتى رسول الله صلى الله عليه وسلم فقال: يا رسول الله ائذن لي بالزنا، فأقبل القوم عليه فزجروه، وقالوا (مه، مه) فقال: ادن، فدنا منه قريبا.<br />قال: فجلس.<br />قال: أتحبه لأمك ؟<br />قال: لا والله، جعلني الله فداءك.<br />قال: ولا الناس يحبونه لأمهاتهم.<br />قال: أتحبه لأختك ؟<br />قال: لا والله جعلني الله فداءك.<br />قال: والناس لا يحبونه لأخواتهم.<br />قال: أتحبه لعمتك؟<br />قال: لا والله ، جعلني الله فداءك.<br />قال: ولا الناس يحبونه لعماتهم.<br />قال: أتحبه لخالتك؟<br />قال: لا والله، جعلني الله فداءك.<br />قال: ولا الناس يحبونه لخالاتهم.<br />قال: فوضع يده عليه وقال: \"اللهم اغفر ذنبه، وطهر قلبه، وأحصن فرجه\".<br />فلم يكن من الفتى بعد ذلك يلتفت إلى شيء. رواه أحمد<br />وأيضا قال تعالى: وَلاَ تَقْرَبُواْ لزّنَى إِنَّهُ كَانَ فَاحِشَةً وَسَاء سَبِيلاً [الإسراء:32]، وهذا الفاسد يقول :\"ديه كلها مواضيع عقلية ليست لها علاقة بالكتب السماوية\". ومع ذلك يدعي إحتراف الهندسة ولا منطق بحديثه.<br />اللهم حصن شباب الامة عن الزنا وارزقهم الزواج الصالح !<br />وقبل أن تشتم هؤلاء السذج تعلم كتابة الإنجليزية خصوصا هول، وفكنج، مهندس إيه ده؟fuckin' and hole"
