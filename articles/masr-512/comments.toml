text = "ان عمر بن العاص لم يكن اول من غزا مصر وليس آخر من غزا مصر اقرأوا التاريخ قبل عمر بن العاص وبعد عمر بن العاص ولكن الغزو الوحيد المبارك من قبل الله هو عمر بن العاص وهو فتح اسلامي وليس غزو كما يحلوا للفاشلين ان يسموه"
