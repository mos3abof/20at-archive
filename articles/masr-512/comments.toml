[[comments]]
order = 65
subject = "لاإله إلا الله سيدنا محمد رسول الله"
author = "طارق"
posted = "2006-06-25"
text = "الحمد لله، هذه والله أعظم النعم والهدايا، وعسى الله أن يثبت على الحق فؤادك وإيانا، وأن يقيض لك صحبة عباده المؤمنين. أخي، الأصل قي الأشياء أن تقضى بالتراضي والإقناع وإقامة الحجة والبرهان، وهذا خلق الإسلام وخلق رسوله صلى الله عليه وسلم وهو إسوتنا. قال تعالى:\"فبما رحمة من الله لنت لهم، ولو كنت فظا غليظ القلب لانفضوا من حولك، فاعف عنهم واستغفر لهم وشاورهم في الأمر.\"<br />فرق الإسلام بين معرض عنه جاهل به، وبين محارب له مبغض له عن علم وخبث طوية، والجاهل ترجى هدايته بإذن الله إن صحت طويته، وتاب عن غيه.<br />إنظر أشقى الخلق قاطبة المنافقون، لأنهم بعكس المؤمن الحق والكافر الصريح في صراع داخلي وخارجي مقيم، يظهرون غير ما يبطنون، ويتلونون مع كل محيط ومذهب ودعوة، ومآلهم الخزي والبوار. وأعدي أعداء هذه الأمة هو النفاق، أما الكفار من خارجها فكيدهم بإذن الله في تضليل.<br />نعوذ بالله أن يصبح الدين عندنا مجرد طقوس وشعائر، سليمة المظهر خالية الجوهر:\" ألم يئن للذين آمنوا أن تخشع قلوبهم لذكر الله وما نزل من الحق، ولا يكونوا كالذين أوتوا الكتاب من قبل فطال عليه الأمد فقست قلوبهم وكثير منهم فاسقون \".<br />إنظر حال الإسلام في بلاد الإسلام:\"أجعلتم سقاية الحاج وعمارة المسجد الحرام * كمن آمن بالله واليوم الآخر<br />* وجاهد في سبيل الله لا يستوون عند الله * والله لا يهدي القوم الظالمين\".<br />من قال أن الإسلام أن يعامل المسلم عند من يدعوه، معاملة العبيد والرقيق، وبمناسبة وغير مناسبة وعند أهون سبب يقال له\" ياجاحد يامنكر للنعمة، يا مصري أو يا فلسطيني أو..أو، كيف تنتقد طويل العمر فلان بن علان..\" ثم يطرد بعد أن يؤكل حقه ويجرس ويؤذى ويعذب. أسألك بالله أليس هذا هو المعمول به في كل بلاد الإسلام؟<br />كرمهم وتسامحهم لايظهر إلا مع من يك<br />اقرأ بقية التعليق .."
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626005208/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=bd9c79a3e273b938ff04640135eaf995"

[[comments]]
order = 66
subject = "ربنا يعطيك المزيد من العلم"
author = "مصري مقيم بدبي"
posted = "2006-06-25"
text = "ربنا يخليك يارب وانا اتمني ان شباب ولاد البلد يخلوا حد كويس زيك يبقي ليه مقال ديني اسبوعياً, اصل بصراحة يا طارق احنا محتاجين حد يكلمنا في الدين عقلانياً شوياً مش زي بعض الشيوخ اللي يطلع يسود الدنيا في وش الواحد, بجد ياريت نشوف شباب واعي بيتكلم في الدين لأن ده بيوصل للقلوب علي طول, انا عايز اقولك يا طارق ان انا ابتديت اقرأ من المصحف الشريف وبصراحة انا طاير من الفرحة."
archived = "2006-06-26"
capture_url = "https://web.archive.org/web/20060626005208/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=bd9c79a3e273b938ff04640135eaf995"

[[comments]]
order = 67
subject = "الحمد لله رب العالمين"
author = "طارق"
posted = "2006-06-26"
text = "والله يثلج فؤادي ما أقرأه، الهداية أخي أعظم منة من الله لعبادة، والقرآن الكريم هو نبع الحكمة الصافي، والحق المطلق والنور اليقين، وإن أردت أن يستقيم لسانك فاقرأ القرآن، وتعلم ترتيله كما ينبغي، فلا يمر عليك زمن طويل حتى تنمو فيك ملكة فريدة تمكنك من تبين الخلل في تركيب عبارة ما ولو وردت على لسان أفصح الفصحاء. القرآن فريد في هذا، ومن يستوي له فهمه وأسلوبه، يسطيع بلا عناء كبير أن يتبين كلمة غريبة في آية ما، تلاها أحد الناس وأبدل سهوا لفظا بلفظ.<br />الإسلام دين التيسير، وما حرم فيه شئ إلا وكان من وراء ذلك حكمة، يعود نفعها على المجتمع كله، والإسلام يراعي حقوق الأفراد ويكفلها على أصلح وجه، ويراعي ألا يتعارض ذلك مع حقوق الجماعة، وهذا ما يجعله يظهر على كل نظريات وضعها البشر كالرأسمالية والإشتراكية وغيرها، مما لامجال فيها لضمان هذا التوازن.<br />الترغيب بدون شك خير من التنفير أو الترهيب ، و تتجلى أهمية إستخدام هذا النهج في حالة نشر الدعوة في أوساط غير المسلمين.<br />قال تعالى: \" ادْعُ إِلِى سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُم بِالَّتِي هِيَ أَحْسَنُ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَن ضَلَّ عَن سَبِيلِهِ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَ [ النحل الآية 125]\".<br />أما بين المسلمين فيكون إسلوب الذكرى، قال تعالى: \"وَذَكِّرْ فَإِنَّ الذِّكْرَى تَنفَعُ الْمُؤْمِنِينَ [ الذاريات الآية 55]\" والتذكير إنما يكون بالترغيب أو الترهيب أو هما معاً ، إذ أن تخويف المسلم من العقوبة ينطلق من ثبوت إيمانه حيث لا ينتفع به الا المؤمن.<br />كان رسول الله صلى الله عليه وسلم إذا بعث أحدا من أصحابه في بعض أمره قال بشروا ولا تنفروا ويسروا ولا تعسروا<br />حدثنا أبو بكر بن أبي شيبة وأبو كريب واللفظ لأبي<br />اقرأ بقية التعليق .."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903172116/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 68
subject = "شكراً يا طارق"
author = "مصري مقيم بدبي"
posted = "2006-06-26"
text = "الف شكر يا طارق علي الآيات والاحاديث المحكمة ديه, وانا إزاي اقدر اقرأ القرأن بفهم وبطريقة صحيحة, ارجوا النصيحة ممكن اشتري اسطوانات معينة او اشتري كتب مثلاً."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903172116/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 69
subject = "إسأل في المكتبات عندك"
author = "طارق"
posted = "2006-06-26"
text = "لاتشكرني ياأخي فما فعلت ما يستحق الشكر، أفضل الوسائل أن تتلقى أصول الترتيل على من يحسنونه، وعادة تجد هؤلاء في المساجد، ويرحبون بمن يأتي اليهم ولا يطلبون أجرا على ذلك.<br />لا أعرف إن كانت المساجد بدبي تقدم مثل هذه الخدمة، لم أزر بلاد العرب أبدا، ولا أعرف سوى بلدي وبلاد الغرب الناطقة بالإنجليزية.<br />كتب تفسير القرآن كثيرة جدا، أنصحك بأن تبدأ بتفسير إبن كثير فهو أيسرها وأقلها حجما، ولعل من الإخوان العاملين بالمكتبات هناك من يرشدك لما يوافقك أكثر، وإن لم تك ضليعا في الدين، فتجنب تفسيرات وكتب الشيعة، لإحتوائها على كم مهول من الإسرائيليات، تعج بها عن سهو أو عمد. هذا للأسف حقيقة يميزها من قرأ لغيرهم من أعلام أهل السنة والجماعة، ولذلك رجاءا تحقق مما تشتري.<br />وإن وجدت إسطوانات مدمجة تعلم التلاوة، فلا بأس بها ولعلها أنسب لك إن كان عملك لا يتيح لك دروس المسجد.<br />نقطة أخرى هامة وهي أن تأخذ الأمور بالهوينى وبالتدريج، فهذا أفضل لك وأضمن للمداومة على الدرس والتحصيل.<br />أدعو الله أن يوفقك وأن يشد من عضدك وعزمك وأن ينير بصيرتك. والسلام عليكم ورحمة الله."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903172116/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

