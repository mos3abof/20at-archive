subject = "ايها الكاتب المتشفق على المسحيون"
author = "انت لا يحق لك ان تقوم بكتابة هذا الكلام عن المسحيون فما يخصك ان يتدخل البطريرك فى السياسة فهل السياسة للمسلمين فقط فيجب على كل انسان ان يتحدث عن سياسة بلده مهما كان مسلم او مسيحى فنحنو المسحيون لا نؤمن ببعض ما يقوله المفتى (مع كل احترامى له )فى برنامج البيت بيتك و ان التغيرات التى حدثت فى الكنيسة تغيرت بسبب تغير العالم ولا تنسى ايها الكاتب و ايها المسلم انك وحدك فى العالم فهناك المسحيون و اليهود وهم لهم حقوقهم وانا مع كلام (ماريان)و(جورج اسكند) و من يعترض فى كلامى يستطيع ان يتصل بى من خلال الايميل و له كامل احترامى"
