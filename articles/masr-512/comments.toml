[[comments]]
order = 32
subject = "نحن كلنا من مصرايم ابن حام"
author = "ندا"
posted = "2006-06-19"
text = "ان شؤن الكنيسه ليس حكرا علي احد حيث انها تؤثر علي مصرين و ان تاريخ الكنيسه ليس حكرا علي احد فهو تاريخ مصري ملك لكل المصريين فلا يوجد تاريخ كناءسي في العالم مشرف كتاريخ الكنيسه المصريه فهي لم تبيع صكوك الغفران لم تحرق احد هذه هي الكنيسه المصريه<br />-لكل دين غلاته و متطرفيه فكثيرا ينسي مدعي الاسلام الرحمه و ينسي مدعي المسيحيه المحبه اين الرحمه عندما نمنع مسيحيا من الصلاه و مكان للصلاه اين المحبه عندما نحتكروطن و نحرمه عن اخارين<br />ان المصرين ينتموا كلهم لمصرايم ابن حام ابن نوح عليه السلام مسلمون ومسيحيون فمن يستطيع ان يدعي غير ذلك ؟و البينه علي من ادعي"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 33
subject = "متسرايم بن خام؟"
author = "صباح"
posted = "2006-06-19"
text = "أخت ندا/<br />لا القرآن ولا العلم الحديث وما ينبثق عنه من البرديات التي بحوزتنا، ولاعلم الحفريات، يثبت أن طوفانا عاما أتى على كل مافيها من حياة ، تجددت بنوح وماكان معه، حتى إذا ظهر إبراهيم بعدها بثلاثمائة سنة بحساب أنساب التوراة، كانت الأرض عامرة مجددا بحضارات نقلت أطلالها لأجيال تالية.<br />ومسألة مصرايم الذي هو ولد حام كما تقول الأسطورة التوراتية هي مربط لاهوتي اخترعته عبقرية الذهنية العبرانية حتى يكون لهذا الشعب \"شعب إسرائيل\" والذي خرج بإله وتشريعات بعد طول إقامة في مصر أيام ازدهار الحكمة المصرية في معابد هليوبوليس ؛ حتى يكون له سابق قدم في أرض مصر ويكون \"إسرائيل\" الذي نزح إليها إنما نزح صوب أرض أجداده \"مصرايم وأبنائه\" حيث إسرائيل من نسل \"سام\" ومصرايم من نسل \"حام\" وكلاهما يخرجان من نوح حسب هذا التصور الأسطوري.<br />وأنصح بقراءة كتاب موريس بوكاي\"التوراة والإنجيل والقرآن والعلم \"، حيث عالج الموضوع بحرفية تامة. بالمناسبة دكتور بوكاي ظل على مسيحيته، وليس كما روج أنه أسلم.<br />واسم متسرايم بن خام عبري، ولا يوجد مايثبت أن نوح ومولده بأرض الرافدين ومن أهلها، كان يتحدث لغة لايفهمها أهل البلاد الذين بعث فيهم. وشكرا."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 34
subject = "مصري مقيم بدبي- بطل هبل"
author = "NoSo"
posted = "2006-06-19"
text = "كلامك غبي خالص<br />ممكن تمسحوا أحسن لو ينفع علشان ده بيدل على إنك متعرفش ولا حاجة في أمور الدين جرستنا الله يجرسك بين أربع مفارق ياحمار."
