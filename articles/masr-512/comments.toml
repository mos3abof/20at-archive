text = "لماذايشعر الاقباط بذلك؟<br />عندم يرغب مسلم بسب مسلم اخر<br />بماذايسبه؟<br />يابن( )الكلب<br />اعمل بشركة محترمةوعندمايريد المديران يثنى على يقول لو مكنتش مسيحى<br />وترجع تقول ماذا يريد الاقباط<br />والاسلام متسامح فكربهدوء"
