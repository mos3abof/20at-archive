[[comments]]
order = 30
subject = "الدين النصيحة"
author = "جمال الدين"
posted = "2006-06-19"
text = "بسم الله الرحمن الرحيم<br />إخوتي في الله/<br />أعوذ بالله أن أدعي علم الكتاب أو قراءة مكنون قلوب البشر، ما أقول هنا هو حسب فهمي المتواضع جزى الله بكل خير من علم وأرشدني لما فيه من الزلل.<br />قال تعالى:\" كيف وإن يظهروا عليكم لا يرقبوا فيكم إلا ولا ذمة يرضونكم بأفواههم وتأبى قلوبهم و أكثرهم فاسقون * اشتروا بآيات الله ثمنا قليلا فصدوا عن سبيله إنهم ساء ما كانوا يعملون\".<br />نص صريح واضح لاتأويل فيه ولا موضع لإجتهاد، مبين من رب العالمين.<br />لست من دعاة الفرقة والطائفية، وأجهل الناس من يجلب لبيته فتنة داخلية، فيأخذه العدو الخارجي أهون مأخذ. لا أحب أصنع من النصارى هنا عدوا، وأعلموا أنهم يرون ويسمعون ويعرفون تفرق المسلمين وإتحادهم فقط على أذية بعضهم البعض، وقد رأوا بجلاء كيف أضاع المسلمون فلسطين ومن بعدها العراق وبذلوا من أجل ذلك كل عزيز وغال. إذن سيتخلص حتى أبلههم وأغباهم أن قيام دولة نصرانية على جزء من مصر، ليس صعب المنال، طالما كان في الحكم أمثال من يحكمونا.<br />إن صلح حكامنا وتنبهوا للأولويات ستختفي النعرات الطائفية، هذا ما عندي."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 31
subject = "المضطهدون فى مصر"
author = "زنوبه"
posted = "2006-06-19"
text = "والله مشكلة مسلم و مسيحى فى مصر ما بدائتش إمبارح ـ دى بداءت فى عهد عبد الناصر لما محطش آى مسيحى فى مجلس قيادة الثورة<br />وعلى العموم الحكومه الحاليه بتضطهد المسيحيين و..المسلمين برضه<br />عدد المسلمين اللى فى المعتقلات آكثر بكثير من المسيحيين ومالهمش بابا يعتكف علشان يخرجهم ـ على فكره ده مش كلامى ده نقلا عن جريده فرنسيه وآنا بدورى آتمنى من مولانا شيخ الازهر الاعتكاف والصيام من آجل محمد شرقاوى والستات اللى آنتهكت آعراضهم فى الشارع<br />عرفتم بقى مين اللى بيعانى الاضطهاد فى مصر"
