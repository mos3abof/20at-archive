order = 0
subject = "فين التغيير ده"
author = "واحد معدي"
posted = "2006-06-13"
text = "أنا لا أرى أي تغيير في موقف الكنيسة بالعكس فأنا أرى نفس الموقف تتخذه الكنيسة ضد البيزنطيين في أوائل عصور المسيحة عندما حاولوا فرض معتقدات مختلفة عن معتقداتهم فاتخذ الأنبا أثانسيوس دورا سياسيا للدفاع عن المعتقدات الدينية ، و هذا هو نفس الموقف الذي اتخذه الأنبا شنودة عندما تعرضت سلطة خارجية (المحكمة الإدارية العليا) للتدخل في معتقدات الكنيسة"
archived = "2006-06-16"
