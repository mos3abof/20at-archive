subject = "من يهده الله فهو المهتد"
author = "طارق"
posted = "2006-06-22"
text = "علم الله ما أحب الي من أن يهدينا الله وإياك رشدا، وأدعو لك مخلصا أن يوسع عليك من فضله ونعمائه، وأن يغنيك من حلاله عما فيه شبهة.<br />قلب إبن آدم بين أصابع الله، يلقبه كيف يشاء، وطوبى لمن سمع القول فإتبع أحسنه، ولم يجعل هواه وشهواته في الحياة قائده.<br />نستغفر الله من شرور أنفسنا وسيئات أعمالنا."
archived = "2006-06-26"
