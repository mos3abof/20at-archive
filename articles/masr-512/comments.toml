author = "كلمات ضد الرصاص"
posted = "2006-06-16"
text = "تواجه الأقباط آلاف الذين حصلوا علي أحكام من محاكم الأحوال الشخصية بالطلاق‏,‏ لكن أصحابها لا يستطيعون تنفيذها‏,‏ لأن الكنيسة ترفض الاعتراف بهذه الأحكام ومنح تصاريح زواج مرة أخري لهؤلاء المطلقين بأحكام قضائية‏,‏إلا اذا كان الحكم يستند الي علة الزنا فقط‏.‏<br />والأمر يحتاج الي توضيح‏,‏ فحتي عام‏1971‏ كانت هناك‏9‏ حالات يجوز فيها الطلاق للأقباط هي‏:‏ الزنا ـ اعتناق أحد الزوجين ديانة غير المسيحية ـ صدور حكم باثبات غياب الزوج ـ الحكم علي أحد الزوجين بالأشغال الشاقة أو السجن أو الحبس ـ مرور ثلاث سنوات علي اصابة أحد الزوجين بالجنون ـ اعتداء أحد الزوجين علي الآخر اعتداء جسيما يعرضه للخطر ـ سوء سلوك أحد الزوجين وانغماسه في الرذيلة ـ إساءة أحد الزوجين للآخر واستحكام النفور واستمرار الفرقة بينهما‏3‏ سنوات ـ اذا ترهبن أحد الزوجين‏.‏<br />ولكن في عام‏1971‏ بعد تعيين البابا شنودة بطريركا للأقباط أعلن أن الطلاق لغير علة الزنا يتعارض مع الانجيل‏,‏ وأصدر قرارا بذلك‏,‏ ومن هنا بدأت مشكلة الأقباط الذين حصلوا علي أحكام بالطلاق ولا تصرح لهم الكنيسة بالزواج‏.‏<br />وقد لجأ بعضهم الي تغيير ديانته وبعضهم لجأ الي الزواج المدني يسجله في الشهر العقاري‏,‏ وبعضهم لجأ الي الزواج العرفي‏,‏ ولكن الكنيسة تعتبر هذه الزيجات باطلة‏,‏ لأن الزواج يعتبر بالنسبة للكنيسة القبطية أحد أسرارها السبعة‏,‏ ولابد أن يتم بطقوس معينة لا يتم بها الزواج العرفي أو المدني‏.‏"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 23
subject = "ياريت نتناقش باسلوب متحضر"
author = "مصري مقيم بدبي"
posted = "2006-06-16"
text = "بصراحة ردود (أحمد سيد علي) ديه بتنم عن ثقافة متدنية المستوي (مع الأسف) لاننا اتعلمنا اني لو عندي قضية عاوز اتناقش فيها حتي مع عدوي مينفعش اتكلم باسلوب همجي كده, الموضوع المكتوب مهم جداً واللي بيتكلم غير مسيحي يعني لازم حد مسيحي يرد علي النقاط اللي هو بيقولها مش اهاجمه واهاجم الاسلام يا شباب احنا محتاجين نفكر بعقلنا قبل التسرع والرد العنيف هو الولد بيتكلم عن وجهة نظرة, بالظبط زي وجهة النظر بتاعت كاتب فيلم دافنشي كود اكيد كل المسيحين حضروه, ده مثلاً بينسف العقيدة المسيحية هل كلام الكاتب صح؟ لازم تفكر بعقلك وتسأل وتعمل ابحاث يعني منفكرش بدماغ شيخ او قس لازم افكر بعقلي شكراً وياريت حد مسيحي يرد علي نقاط الكاتب بعقلانية اكتر."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 24
subject = "معقول يافاجومي"
author = "سمير"
posted = "2006-06-17"
text = "والله كلام الأخ الفاجومي فيه وجاهة، يعني إيش لم الشامي على المغربي بلا مؤاخذة؟ الله أعلم إنهم من أتباع المسيحية الصهيونية السائدة في أمريكا، الي بوش أبرز رموزها.<br />الكلام المذكور عن فلاح ده للأسف حقيقي ومنشور في الجرايد ، لكن ربنا أمر بالستر، في سويسرا مش إيطاليا يا بو شريف. لكن ده موضوع غير مهم هنا.<br />أنا لما قريت مقال الدكتور عوض هنا، صراحة شعري وقف، وأنا أتفق معه إنه فيه مخطط ممول من جهة أجنبية لتأليب النصارى على المسلمين، لكن بأعتقد إن شنودة والستاف الي حواليه، أمكر من إنهم ينزلقوا الى فخ الإنفصالية تحت مظلة أمريكية، لأنهم يعرفوا أن العاقبة حتكون وحشة يوم حساب العملاء.<br />شخصيا لا أعتقد بجدوى حوار هنا، مع كل الإحترام كلنا هنا من الناس العاديين، مش صناع قرارات وسياسات وتوجهات، والحاجات الي ذكرها النصارى هنا، حتسمعوها حتى من أطفال المدارس عندهم، هما بعلموهم كده!<br />الحل ياجماعة إن البلد تكون في إيدين ناس وطنين نظاف عندهم دين،<br />بمعنى لما النصارى بيشوفوا إزاي ريس بيدعي الإسلام بيعامل المسلمين، يبقوا يخافوا للدور يلحقهم، ولأخونا الي محروق قوي على شيخ الأزهر، هو مين الي أحل الربا؟ مين الي قعد يحرف في آيات الله علشان يرضي السادات، فين صوت شيخ الأزهر من الظلم الي واقع على المسلمين في كل مكان؟ ليه مابيحرمش إلا كل مايضر النظام العميل؟"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 25
subject = "شفرة دافنشى والمؤسسة الكنسية"
author = "بقلم : د. زينب عبدالعزيز"
posted = "2006-06-17"
text = "المتابع لأخبار رواية \" شفرة دافنشى \" لا بد وان يصاب بالدهشة والفضول من كثرة ما أثارته من ردود أفعال فى الساحة الإعلامية الدولية بعامة، وخاصة فى المجال الإعلامى للمؤسسة الكنسية الفاتيكانية ، التى انتابها رد فعل كاد يصل - وفقا لما يقال فى الصحف والمواقع الإلكترونية - الى درجة الهلع بين رجالها.<br />وعلى الرغم من أن رواية دان براون قد ظهرت عام 2003 إلا ان ردود الأفعال التى أثارتها ، خاصة فى المجال الكنسى، لم تبدأ إلا بعد ان انتشر توزيعها و تعددت ترجماتها وتناولتها أقلام النقاد بالتعريف والتعليق على أهم ما جاء بها كقضية قادرة على أن تهز أركان الكيان الكنسى إن لم تكن قادرة على أن تأتى عليه برمته - على حد قول العديد من النقاد.. أى أن الرواية ، فى بداية مشوارها ، قد أفلتت من لجنة محاكم التفتيش ، المعروفة حاليا باسم : لجنة عقيدة الإيمان ، الخاصة بمراجعة ومتابعة كافة الإصدارات لكى تتصدى لمن يحاول المساس بما فرضته المؤسسة الكنسية عبر المجامع على مر العصور .. ويرجع سبب إفلات الرواية إلى العنوان الذى لم يكن يدل على أن محتواه قادر على هدم أوصال ذلك الكيان العتيد..<br />وقد تمت ترجمة الرواية إلى 44 لغة ، وبيعت منها ست و أربعين مليون نسخة ، بحيث أصبحت تمثل اكثر الروايات بيعا فى العالم ، أو لعله رقم لم تحققه أية رواية أخرى .<br />واذا ما تأملنا كمّ ما أثارته من ردود أفعال لرأينا انه قد صدر بشأنها بالفرنسية فقط ودونا عن اللغات الأخرى أكثر من عشرة كتب ، ثلاثة منها على الأقل بأقلام كنسيين ، ومنهم القس كلود هود الذى أصدر كتابا بعنوان : \"أكاذيب شفرة دافنشى\" ، والباقى لأشخاص تابعين للكنيسة أو كتبوها بإيعاز منها .. وتعدت المداخلات الإلكترونية المليونين مداخلة وموقع على ش<br />اقرأ بقية التعليق .."
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 26
subject = "عبده الفهيم"
author = "ابو شريف"
posted = "2006-06-18"
text = "ايوة ابو شريف ياسيد أحمد السيد علي عندك اي اعتراض ... وبالنسبة لسؤالك واتهامك بالكفر للرئيس الراحل انور السادات او الرئيس الحالي حسني مبارك اقولك ياسيدي الفاضل ان كنت مسلم فسيدنا رسول الله صل اللي عليه وسلم امرنا بأن لا نتهم مسلم بالكفر وإلا إرتدت إلينا وأمرنا بأن نشهد لمرتادي المساجد بالإيمان هذا هو الإسلام أما إن كنت غير مسلم فهذه المعلومة لك والان الرئيس السادات في دار الحق ونحن في دار الباطل كيف تتهمه بالكفر<br />وهات ماعندك ياسيدي من اشعار خلينا نضحك عليها شوية اصل انت باين عليك زي المستشار اياه - حسن سبانخ -"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

[[comments]]
order = 27
subject = "رجاءا نرجع للموضوع ياناس"
author = "بهاء"
posted = "2006-06-18"
text = "إيه يا إخوانا/<br />عيب ياأستاذ سيد علي، ده مستواك؟ بجاه النبي عليك إن كان حبيبك ما تكتب ولا ترد تاني، إخينا باين عليه ساداتي للنخاع ويمكن مخبر كمان، هو حيفهم شعر ولا نتر، دور على ناس من مستواك. وزي الشافعي مابقول الإمام:<br />بلاء ليس يعدله بلاء ******* عداوة غير ذي حسب ودين<br />ينيلك منه عرضاً لم يصنه ** ويرتع منك في عرض مصون.<br />إنته حتعمله شهرة كده، ويطالب بعلاوة من رؤساءه، سيبك منه. وبعدين الموضوع الأصلي كده إتنسى.<br />خلاص يابو قديس سيدك السادات ومبارك من المبشرين بالجنة ومن أهل الشفاعة كمان، ممكن نناقش الموضوع الأصلي؟ ياباي!!"
archived = "2006-06-22"
capture_url = "https://web.archive.org/web/20060622031901/http://masr.20at.com:80/article.php?sid=512&PHPSESSID=934702193d066a26d50d4203c1bd685b"

