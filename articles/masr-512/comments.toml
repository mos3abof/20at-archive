text = "انت عارف يا طارق انا بقالي 3 سنين مصليتش اوقرات قرآن الله , بجد انت انسان عاقل وكتير فاهم في الدين والحياة, واكيد انا ربنا بيحبني علشان انت كتبت ليا كلام الرسول وبعدها صليت لأول مرة من 3او4 سنين, بحد انا محتاج انك تدعيلي, شكراً طارق ويارب يكون كل الشباب في مصر علي مستوي الوعي بتاعك ده."
