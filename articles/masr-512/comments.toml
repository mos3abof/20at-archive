text = "سؤال بسيط لما قالته الفاضلة ماريان, هل كل المسلمين الموجودين في مصر قادمون من جزيرة العرب؟؟ إنها حقا جزيرو مزدحمة أو على الاقل من أكثر المناطق كثافة في العالم!! أعتقد أن سؤالي واضح, ولكن أغلب المصريين المسلمين لهم أصول مسيحية لا أحد يستطيع الإنكار, فهذه بلد من إذن؟؟"
