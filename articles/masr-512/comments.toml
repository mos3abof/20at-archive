text = "لم تسطتع امريكا دخول مصر عن طريق الكنيسة<br />بحجة الاضطهاد وحقوف الاقليات الموجة ضد المسيحين .لان قداسة البابا شنودة دائما يقول شعب مصر شعب واحد ولانريد اى تدخل خارجى فارسلت العميل المدرب مكس والغريب الحكومة المصرية تساعد العميل ماكس لكى يدمر مصر"
