text = "شكرا على شرحك لموقف بهدوء . أنا معاك ده بيحصل وأنا كمسلمة أنكره. لكن تعالوا نعالج المشكلة من جذورها..<br />الذى يتهض المسيحى لأنه مسيحى .. يضطهد المسلم اللتزم لأنه إخوانى .. وآخر لأن والده كان فى الاتحاد الاشتراكى .إاخ.<br />بمعنى للأسف دلوقتى إحنا ثقافتنا الديكتاتورية . شربنها من فوق .. وكذلك مؤثرة على علاقة الأبناء بولديهم والمدرس بلطالب إلخ..<br />وبالمناسبة فى دكاترة مسيحين يضطهدوا المسلمين (فى الصعيد تحديا) هما صحيح قلائل ولكن ذلك يرجع لنسبة المسحين قليلة أصلا<br />طيب حل المشكلة دعوة لتخلىعن الديكتاتورية.. مسلمين ومسيحين..<br />يا جماعة مش عايزين نقلب المشكلة شخصية أو لأقلية . بل للأمة .. لمريين..<br />أرجو ألا أكون أثقلت عليكم<br />ياسمين<br />(شكرا على رابط الحروف العربى)"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

[[comments]]
order = 13
subject = "فعلا كلام الكاتب ! اين هم من مسيحى الامس"
author = "كلمات ضد الرصاص"
posted = "2006-06-15"
text = "قد يطلق الورداني النار علي بطرس غالي لموالاته للانجليز، لكن هذا لايمنع ابنه واصف باشا غالي من مغادرة باريس علي عجل لمجرد سماعه بان سعد باشا ضمه للوفد وليشارك في الثورة. وعندما يسأله الانجليز مذهولين: كيف تنضم لقتلة أبيك؟'' يجيب بكبرياء الشعب العريق: ''أفضل أن انضم لمن قتلوا أبي علي أن انضم لمن قتلوا وطني''. بل انه عندما يختلف سعد مع عدلي يكن حول ''مشروع ملنر''، ينفض السبعة المسلمون من حول سعد ولايبقي معه متمسكا بالحق الوطني غير واصف غالي وسينوت حنا بك. وعندما ينذر سعد بضرورة ايقاف نشاطه أو النفي (7 ديسمبر 1921)، لايرفض الإنذار غير مصطفي النحاس وويصا واصف وسينوت حنا وواصف غالي ومكرم عبيد صاحب مقوله (انا مسلم الجنسية مسيحى العقيدة)و."
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

[[comments]]
order = 14
subject = "لا بد من التصارح وأن يلزم كل واحدٍ حَدّه"
author = "بقلم: إبراهيم عوض"
posted = "2006-06-15"
text = "لا بد من التصارح وأن يلزم كل واحدٍ حَدّه:<br />المسكوت عنه فى المسألة الطائفية بمصر<br />(المقال كاملا)<br />بقلم: إبراهيم عوض<br />http://ibrawa.coconia.net/ الموقع المشباكى:<br />متى تنبهتُ إلى حكاية \"مسلم ونصرانى\"؟ بطبيعة الحال كنت، فى طفولتى، أعرف أن هناك نصارى فى مصر، لكن قريتى فى الوجه البحرى بوسط الدلتا كانت وما تزال تخلو تماما من أى وجود نصرانى، اللهم إلا من يَرِد عليها بين الحين والحين من الموظفين الأقباط مثل الأستاذ جرجس مدير مكتب البريد الذى كان أهل القرية يكرمونه ويستضيفونه عندهم على العَشَاء فى كثير من الليالى نظرا لعدم وجود أحد من أفراد أسرته معه، وكطبيب الوحدة المجمعة الذى كان لقب أسرته لوقا إذا لم تكن الذاكرة قد عبثت بى، والذى ما فتئت أستحضر بسهولة شديدة منظره وهو يمثل أحد الأدوار المضحكة مع بعض الطلبة الأزهريين فى مشهد هزلى على مسرح الوحدة المجمعة بالقرية يقوم على ترديد كل واحد من الممثلين لهذه الجملة مع زيادة عدد \"البرابيخوهات\" كل مرةٍ واحدا: \"برابيخو مات ومَوِّت معاه واحد (اتنين/ تلاتة/ أربعة...) برابيخو\". لكن عندما انتقلتُ إلى المدينة لأواصل تعليمى فى المرحلة الإعدادية أخذت أرى الكنائس فى طنطا، وقد أشاهد أيضا مواكب الجنائز النصرانية وهى تشق شوارع المدينة تصدح منها موسيقى جنائزية حزينة، ويتقدمها حصانان يجران عربة التابوت مما كان يشد انتباهى ويستهوينى. وأبرز ما بقى فى ذاكرتى من هذه المناسبات الجنائزية ذلك الموكب الذى انطلق ذات عصر فى أوائل الستينات من الكنيسة الموجودة بشارع القنطرة فى سُرّة المدينة. بل لقد دخلتُ كنيسة، وأنا فى المرحلة الإعدادية، قرب البيت الذى كنا نسكن فيه على أطراف طنطا بجوار السكة الحديد التى تؤدى إلى شبين الكوم فى نهاية شارع الحكمة، ورب<br />اقرأ بقية التعليق .."
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

[[comments]]
order = 15
subject = "العنف النصرانى فى التاريخ"
author = "بقلم: فنسينزو أوليفيتى :ترجمه د. إبراهيم عوض"
posted = "2006-06-15"
text = "العنف النصرانى فى التاريخ<br />\"القول بأن الإسلام المعتدل خرافة هو الخرافة\"<br />بقلم: فنسينزو أوليفيتى<br />(مؤلف كتاب \"مصدر الإرهاب- العقيدة الوهابية السلفية وعواقبها\")<br />ترجمه عن الإنجليزية د. إبراهيم عوض<br />فى مقال نُشِر مؤخرًا فى مجلة \"السِّبِكْتِيتَرْ\" البريطانية يهاجم الزعيم الأنجليكانى باتريك سوكْدِيو المسلمين ودينهم هجوما عنيفا. ترى هل يَثْبُت ما كتبه المؤلف فى ذلك المقال على محك التمحيص؟<br />الواقع أن مقالة باتريك سوكديو: \"خرافة الإسلام المعتدل\" فى \"السبكتيتر\" اللندنية بتاريخ 30 يونيه 2005م تعكس اتجاها خطيرا فى الحرب على الإرهاب، إذ تحت ستار الرغبة فى تعريف الغربيين بالإسلام نجده ينشر نفس التضليل الذى تقوم عليه الكتابات العدائية لذلك الدين على مدار أكثر من ألف عام، وهذا من شأنه أن يكون أداة مباشرة فى يد أسامة بن لادن وأبو مصعب الزرقاوى وغيرهما، لأنه يشجع فكرة \"صراع الحضارات\" التى يرغبون فى دوامها على نحوٍ جِدِّ مَقِيت. وإنه لمن المهم جدا أن نعرف الإسلام على نحو أفضل مما نعرفه الآن وأن نكافح وباء التطرف بكل ما فى أيدينا من إمكانات. بيد أن سوكْدِيو وأمثاله يفسدون القضية بطريقتهم التى يَسْعَوْن من ورائها إلى خدمة أغراضهم هم، وذلك من خلال تحويل الحرب على الإرهاب إلى إشعال حرب دينية على الإسلام ذاته.<br />العنف الإسلامى:<br />ويتضح انحياز سوكْدِيو منذ البداية، فهو يزعم أن الإرهابيين يمثلون الإسلام حقا، إذ يقول: \"ينبغى علينا أن نصدقهم إذا قالوا إنهم يفعلون ذلك باسم الإسلام. أليس من الغطرسة الشديدة والتنكر التام لليبرالية أن ننكر عليهم الحق فى تعريف أنفسهم بأنفسهم؟\". أما فى باقى المقالة فهو يبذل جهدا مكثفا لإنكار حق التعريف الذاتى على<br />اقرأ بقية التعليق .."
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

[[comments]]
order = 16
subject = "السلام على من إتبع الهدى"
author = "سمسم"
posted = "2006-06-15"
text = "تالله إني لسعيد بما قرأته للأخويين جريس ومتريوس، وفي حديثهما يشتم العقل والحكمة.<br />آخواي في الإنسانية والوطن، إنا لنبرأ الي الله من كل حاكم وإمام يظلم، ويستوي عندنا إن ظلم كتابيا يهوديا أو مسيحيا أو ظلم هندوسيا أو سيخيا أو ظلم مسلما، بعقيدة المسلم الظلم حرمه الله تعالى على نفسه، فكيف يستحله عبد من عباده؟<br />قد وعد الله أن يستجيب لدعوة المظلوم وأن ينتصر له ولو بعد حين طال أو قصر العهد، ولايوجد مسلم واحد يعتقد أن نصر الله مقصور على المظلوم من المسلمين.<br />واسمعوا إلى هذه الآيات التي تحكي قصة لاتعرف لها الأرض نطيرا , ولاتعرف لها البشرية شبيها .. وتشهد على مطلق عدالة هذا الدين وسماحته , يقول ربنا سبحانه وتعالى مخاطبا نبيه الكريم : ( إنا أنزلنا إليك الكتاب بالحق لتحكم بين الناس بما أراك الله ولاتكن للخائنين خصيما * واستغفر الله إن الله كان غفورا رحيما * ولاتجادل عن الذين يختانون أنفسهم إن الله لايحب من كان خوانا أثيما * يستخفون من الناس ولايستخفون من الله وهو معهم إذ يبيتون ما لا يرضى من القول وكان الله بما يعملون محيطا * ها أنتم هؤلاء جادلتم عنهم في الحياة الدنيا فمن يجادل الله عنهم يوم القيامة أم من يكون عليهم وكيلا * ومن يعمل سوءا أو يظلم نفسه ثم يستغفر الله يجد الله غفورا رحيما * ومن يكسب إثما فإنما يكسبه على نفسه وكان الله عليما حكيما * ومن يكسب خطيئة أو إثما ثم يرم به بريئا فقد احتمل بهتانا وإثما مبينا * ولولا فضل الله عليك ورحمته لهمت طائفة منهم أن يضلوك وما يضلون إلا أنفسهم وما يضرونك من شئ وأنزل الله عليك الكتاب والحكمة وعلمك مالم تكن تعلم وكان فضل الله عليك عظيما )<br />إنه في الوقت الذي كان اليهود في المدينة يطلقون كل سهامهم المسمومة ، التي تحويها جعبتهم اللئيمة ، على الإسلام<br />اقرأ بقية التعليق .."
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

[[comments]]
order = 17
subject = "خلينا إخوات زي محنا"
author = "مصري"
posted = "2006-06-15"
text = "إخوانا المسيحين أمانة عليكم تكونوا أوعى من الي بيحاك ضدنا، ومتصدقوش كل حاجة بتتقال على المسلمين، ولازم نفرق إن النقد موجه لأشخاص بشر زي أنبا بذاته أو خوري أو حتى بابا الفاتيكان، أو للديانة المسيحية أو لشخص المسيح عليه السلام، الي مفيش مسلم مهما كان دينه مهزوز يقدر ينكر لا نبوته ولا مكانته المميزة، وإلا بيخرج من دائرة الإسلام، الإيمان بالله وكتبه ورسله وبالقدر دول أساسيات في القرآن. وبرغم إنه مفيش مسيحي واحد بيصدق إنه سيدنا محمد رسول يعني، إلا إن المسلمين عمرهم ماتدخلوا وقالم إنجيلكم عايزين إحنا نصححه، لأنه محرف، إحترام حرية الأديان مبدء إسلامي.<br />بالمقابل دور النشر الأمريكيتان<br />Omega 2001و wine Press<br />طلعت علينا بقرآن مزيف سموه الفرقان الحق. وهو ليس سوي الكتاب المقدس للقرن الحادي والعشرين! قرآن جديد أمريكاني يتألف من 77 سورة مختلقة وخاتمة.<br />ومن أسماء تلك السور المفتراة<br />الفاتحة -المحبة - المسيح - الثالوث - المارقين - الصَّلب - الزنا - الماكرين – الرعاة -الإنجيل - الأساطير - الكافرين - التنزيل - التحريف - الجنة - الأضحى – العبس-الشهيد.. إلخ .<br />ويفتتح بالبسملة الطامة بقولهم:<br />(بسم الأب الكلمة الروح الإله الواحد الأوحد. مثلث التوحيد.. موحد التثليث ما تعدد). وفي سورة السلام المفتراة حشو للإفك والباطل وتلفيق واضح، ومن آياتها:<br />(والذين اشتروا الضلالة وأكرهوا عبادنا بالسيف ليكفروا بالحق ويؤمنوا بالباطل أولئك هم أعداء الدين القيم وأعداء عبادنا المؤمنين). ثم يأتي التصريح بالنصرانية ليكشف عن مكنون صدورهم في السورة ذاتها بقولهم<br />افتراء علي الله:<br />(يا أيها الناس لقد كنتم أمواتا فأحييناكم بكلمة الإنجيل الحق. ثم نحييكم بنور الفرقان الحق).<br />ودي نقطة من محيط إنحطاط وسفاله وإستفزاز<br />اقرأ بقية التعليق .."
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616031938/http://masr.20at.com:80/article.php?sid=512"

