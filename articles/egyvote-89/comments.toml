[[comments]]
order = 0
subject = "اخر بيان المعتقلين"
author = "زائر"
posted = "2005-11-30"
text = "لشرطة تعتقل أكثر من 850 من قيادات ومسئولي الحملات الانتخابية لمرشحي الإخوان المسلمين وتداهم العديد من المنازل<br />في إطار السياسة الاستبدادية التي ينتهجها النظام وحزبه الحاكم في مصر لمحاربه مرشحي المعارضة في الجولة الثالثة للانتخابات التشريعية وعلى رأسهم جماعه الإخوان التي أحرزت تقدماً يعادل ربع أعضاء البرلمان المصري في الجولة الأولى والثانية قام ضباط مباحث أمن الدولة ورجال الشرطة بمداهمه منازل ما يزيد عن 1000 شخص من الجماعة أسفرت عن اعتقال 504 من وكلاء ومندوبي المرشحين في المرحلة الثالثة إضافة ل 350 مازالوا محتجزين حتي الآن علي ذمة المرحلة الثانية<br />الدكتور عبدالمنعم أبو الفتوح عضو مكتب الإرشاد وصف هذه الاعتقالات بعملية التزوير المسبق حيث يتم القبض علي المندوبين والوكلاء لتسهيل عملية التزوير والقيد الجماعي لصالح الحزب الوطني<br />المهندس خيرت الشاطر النائب الثاني للمرشد العام أكد أن الشرطة في هذه المرحلة ألقت القبض علي مندوبين المرحلة الثالثة بالإضافة لعدد من الإخوان في محافظات انتهت فيها الانتخابات لمنعها من مساعدة محافظات المرحلة الثالثة القريبة منها , كما أكد الشاطر أن هذه الاعتقالات محاولات مستميتة من النظام لتقليص نجاح الإخوان .<br />عدد بالمقبوض عليهم على ذمة انتخابات المرحلة الثالثة<br />المحافظة العدد<br />الدقهلية 101<br />دمياط 75<br />الشرقية 83<br />العريش 20<br />سوهاج 80<br />كفر الشيخ 37<br />الإسماعيلية 16<br />القليوبية 35<br />السويس 7<br />أسيوط 12<br />قنا 4<br />البحيرة 28<br />الغربية 5<br />الإجمالي 504"
archived = "2005-12-28"
capture_url = "https://web.archive.org/web/20051228234721/http://egyvote.20at.com:80/article.php?sid=89"

