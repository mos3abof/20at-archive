subject = "ما يسيبوا الحكم وخلاص ؟؟"
author = "محمد السيد"
posted = "2005-11-30"
text = "اااااااااه .. هم الإخوان عاملين رعب للدرجة دي ...<br />طيب .. لما الحزب عارف انهم أصحاب الأغلبية و الشعبية الأولي ...<br />ما يسيب الحكم ليهم وخلاص .... عجايب عليكي يا بلد ..<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
