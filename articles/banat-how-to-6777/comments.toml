posted = "2007-11-02"
text = "ارحمونا بقي ولا كأن في ناس عايشه في المقابر او مش لاقيين ميه يشربوها او يستحموا بيها ولا ثمن الدواء ولا ثمن التذكره بتاعة القطار المتهالك اللي ممكن يتحرق بيهم وهم في رحلة العوده للصعيد<br />أرحمونا بقي من موضوعات بدل السهره والا[ *** ]سوارات وقصات الشعر … علموا الناس حاجه مفيده لله"
archived = "2009-05-15"
capture_url = "https://web.archive.org/web/20090515115234/http://www.20at.com:80/7ayatna/6777.html"

