author = "منى وهيب"
posted = "2007-12-15"
text = "رواقه رواقه بجد الموضوع ده مهم لفئة قليلة جدااااااااااااا اا وهى زوجات الدبلوماسيين وبعدين يا جماعة الكلام ده انقرض النهاردة فيه عولمة وانتهت الثقافه الاوروبيه والفرنسيه اللى بدعت الكلام ده النهاردة الدنيا كلها اتامركت يعنى الواحد يمسك ساندويتش البرجر اللى عاوز فم ثور باديه الاتنين ويهبره ويشر على هدومة من الصوص والكاتشاب ويبقى كده الراجل ماشى مع احدث صيحات الاكل فى العالم كده غلط وبرضه الايتيكيت منتهى المبالغة والتصنع مفيش احسن من الوسطيه ناكل بشكل رقيق ومهذب وبرضه بطريقه معتادة وبسيطة"
archived = "2009-05-15"
capture_url = "https://web.archive.org/web/20090515115234/http://www.20at.com:80/7ayatna/6777.html"

