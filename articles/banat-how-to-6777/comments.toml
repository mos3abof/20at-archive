text = "يا جماعه الموضوع حلو جدا والى مش عاجبه ما يدخلش ولا يقرا ولما انتم متضررين بالشكل ده ليه بتعملوا سرش عن الموضوع وتقروه اسمحولى ده غير لائق الاولى بنا اننا نشكر الى قام بجمع المعلومات عن الموضوع مش نهاجمه واحنا الى نستحق المهاجمة لاننا دخلنا نقراه الى مش عاجبه ميقراش"
