author = "يا سلام عليك يا عمرو"
posted = "2010-03-06"
text = "يا سلام عليك يا عمرو خالد وعلى جمالك<br />شوفو الراجل عامل ايه علشان خاطر انا بقول هو يبقى رئيس جمهورية احسن لانه حاسس بالغلابه وحاسس بالعيشه واللي عايشينها<br />بصو شوفو<br />_______________ _______________ ______<br />السلام على من اتبع الهدى وخشى الرحمن بالغيب<br />المشروع العام:<br />تطوير العشوائيات<br />المكان العام :<br />جمهورية مصر العشوائية<br />الهدف العام :<br />جمعية لكل عشوائية<br />www.ashwaeya.com<br />من موقع الاستاذ عمرو خالد دوت كوم<br />علشان كده هو اللي ينفع رئيس جمهورية لانه حاسس بالشعب يا جماعة<br />حاسس بينا حاسس ان فيه فأر في مصر<br />هو دا اللي ينفع رئيس<br />لا البرادعي ولا جمال مبارك<br />عمرو خالد والله العظيم هو اللي ينفع"
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307073324/http://www.20at.com:80/masr/interviews/15597-2010-03-04-17-48-29.html"

[[comments]]
