subject = ""
author = "اسرير"
posted = "2010-03-05"
text = "اشارت دراسة لوزارة الاسكان ان عدد سكان المقابر وصل الى حوالي نصف مليون في القاهرة وحدها، منهم 1150 اسرة تستأجر احواش المدافن التي تقيم فيها و3088 اسرة ليست لديهم مطابخ و1233 اسرة لديهم دورات مياه مشتركة.واكد تقرير للجهاز المركزي للتعبئة والاحصاء ان 1.5 مليون مصري يعيشون في مقابر البساتين والتونسي والامام الشافعي وباب الوزير والغفير والمجاورين والامام الليثي وجبانات عين شمس ومدينة نصر ومصر الجديدة.<br />واشارت التقرير ان سكان العشوائيات حوالي 8 ملايين مواطن، موزعين على 794 منطقة سكنية بكافة انحاء البلاد، الا ان النسبة الكبيرة منها حول القاهرة الكبري."
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307073324/http://www.20at.com:80/masr/interviews/15597-2010-03-04-17-48-29.html"

