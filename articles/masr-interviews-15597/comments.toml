author = "يقطع العيشة واللي..."
posted = "2010-03-06"
text = "يحيط القاهرة الكبرى حزام من المناطق العشوائية يبلغ عددها حوالي 76 منطقة يسكنها أكثر من مليوني نسمة، وتظل الدويقة المنطقة الأبرز فيه. ففي الشمال تحتل العشوائيات عدة مناطق في شبرا الخيمة وعين شمس، وجنوباً تنتشر في منطقة دار السلام والبساتين وحلوان، بينما تتركز شرقاً في منشأة ناصر والدويقة، أما في وسط العاصمة فتمتد إلى منطقة الفسطاط وأسطبل عنتر وحكر أبو دومه.<br />_______________ _____________-<br />شد حيلك يا حسن شحاته لو جبت كاس افريقيا اللي جاي حندي لكل لاعب اثنين مليون جنيه<br />بس شد حيلك انتا"
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307073324/http://www.20at.com:80/masr/interviews/15597-2010-03-04-17-48-29.html"

[[comments]]
order = 5
subject = ""
author = "العيشه واللي عايشينه"
posted = "2010-03-06"
text = "أحوال المواطن المصري الآن وما أصابه من عقد وأمراض نفسية وما يتهدده من مخاطر عدم الانتماء والانحراف والتطرف جراء تفاقم المشاكل والسبيل إلي تحسين هذا الوضع ، كانت محور حديث د. أحمد عكاشة في ندوته التي حملت عنوان (رؤية نفسية لأحوالنا ) وأقيمت بمنتدى الحوار بمكتبة الإسكندرية وأدارها د. قدري حنفي ، وقد وجه خلالها أستاذ الطب النفسي ورئيس الاتحاد العالمي للأطباء النفسيين بعد رصد وتحليل عميقين رسالة نصح وإرشاد وإنذار مؤكدا علي تفاقم المشاكل والمعاناة في المجتمع المصري ، ورغم ذلك لا يزال المجتمع حتى الآن عاجزا عن الاتفاق على حلول، وقال : إن أبشع ما يصيب الإنسان إحساسه بالعجز.كما أعرب عن أسفه لوجود ثقوب واسعة في الضمير العام المصري ،لكن مسئولية الإصلاح وتدارك الأخطاء وإيقاظ الضمير العام ليست مسئولية فرد وإنما هي مسئولية جماعية تضامنية."
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307073324/http://www.20at.com:80/masr/interviews/15597-2010-03-04-17-48-29.html"
