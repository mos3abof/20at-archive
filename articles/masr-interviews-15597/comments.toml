author = "يا سلام عليك يا عمرو"
posted = "2010-03-06"
text = "العيشه واللي عايشينها مع عمرو خالد<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــ<br />الكلام دا في موقع الاستاذ عمرو خالد<br />تطوير العشوائيات بداية النهضة الحقيقة<br />الأهداف العامه:<br />على مستوى الفرد<br />التعليم ومحو الأمية<br />التوعيةالدينية والعامه<br />الصحة والعلاج<br />العمل والتوظيف<br />الدعم المالي والعيني<br />توفير الاحتياجات<br />اكرام الموتى (بناء مقابر)<br />على مستوى العشوائية<br />المسكن المناسب<br />توفيرالمدارس<br />مركز طبي<br />توفيرالمياه<br />الصرف الصحى<br />الكهرباء<br />الطرق والمواصلات<br />النظافة والتشجير<br />نادى اجتماعى<br />اللنك اهه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />http://forum.amrkhaled.net/showthread.php?t=130301<br />وحياتك يا مروى عبدالفضيل ابقي قولي لساره اسامه دي غلط كده الواحد يعمل برامج يعرض فيها المشاكل وبس<br />اتعلموا من عمرو خالد يشوف المشكلة ويحلها بنفسه<br />يا اخي اذا ما كنش ينفع يبقى رئيس جمهورية على الاقل يبقى وزير<br />وزير الشئون الاجتماعية مثلا"
archived = "2010-03-07"
capture_url = "https://web.archive.org/web/20100307073324/http://www.20at.com:80/masr/interviews/15597-2010-03-04-17-48-29.html"

