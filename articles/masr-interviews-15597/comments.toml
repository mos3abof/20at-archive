text = "معقولة موضوعك ما فيهوش تعليقات<br />يا خبر ابيض<br />لا لا انا حروح اصلي العشا وحرجع املاهولك تعليقات حاضر<br />الموضوع اللي قابلك خلصت عليه<br />ولا تزعلي<br />انتظريني بعد العشاء"
