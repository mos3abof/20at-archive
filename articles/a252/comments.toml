[[comments]]
order = 0
subject = "سيادة المحافظ"
text = "يا ولد انت وهو<br />عيب تتكلم عن أحوك كدة<br />يا عاااالم أعمل ايه بس<br />ربيتهم أحسن تربية (تربية حلوان)<br />علمتهم أحسن تعليم (كل واحد يعرف صاخبه ويعلم عليه)<br />أكلتهم أحسن اكل (أكلة هنية تكفي مية)<br />شربتهم أحسن شرب (لغاية ما اتسطلوا)<br />ومع ذلك جاي يقول إن أخوه فيه وعليه<br />يا عاااالم<br />إخص<br />إخص<br />إخص"
archived = "2004-06-25"
capture_url = "https://web.archive.org/web/20040625070250/http://www.20at.com:80/article.php?sid=252"

