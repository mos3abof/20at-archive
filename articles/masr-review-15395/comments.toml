author = "بقية التعليق السابق"
posted = "2010-02-20"
text = "و قد ظهر بوضوح أن الجلسات الصامتة لم يكن لها أي تأثير مهدئ وسجلت الأجهزة نتائج إيجابية بنسبة 56 % خلال جلسات القراءة القرآنية. وهذا يدل على أن الجهد الكهربي للعضلات كان أكثر انخفاضاً وهو دليل مؤكد على حدوث تأثير مهدئ لحالات التوتر العصبي والنفسي، بينما ظهر هذا الأثر بنسبة 30 % في جلسات القراءة غير القرآنية. وإذا كانت الأبحاث الطبية الحديثة قد أكدت أن حالات التوتر والقلق تؤدي إلى نقص المناعة الطبيعية في الجسم ضدّ أي مرض، فإن من المنطقي أن نفترض أنّ التأثير القرآني المهدئ لحالات التوتر والقلق يمكن أن تؤدي إلى تنشيط وظائف المناعة في الجسم والتي ستحسن بدورها من قابلية الجسم لمقاومة الأمراض. وإن لصلاة الإنسان المسلم فاعلية كبيرة، وبما فيها من تلاوة للقرآن، لحماية جهازه العصبي عند التعرض للضغوط النفسية والتوترات العصبية وإكسابه حالة من الهدوء النفسي والصفاء الذهني والاستقرار البدني."
archived = "2010-02-20"
capture_url = "https://web.archive.org/web/20100220041657/http://www.20at.com:80/masr/review/15395--q-q.html"

