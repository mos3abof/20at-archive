posted = "2010-02-20"
text = "و الإعجاز الإلهي في القرآن أنه مؤثر في كل نفس، سواء أكانت مؤمنة أو كافرة وسواء كان صاحبها عربياً يفقه ما يسمع، أو أعجمياً لا يفهم أي معنى لما يتلى عليه، وفي كتب السيرة النبوية شواهد كثيرة عن رجال من كفار قريش، كان سحر القرآن وتأثرهم به يخرجهم من بيوتهم في أعماق الليل، ليتسللوا إلى جوار بيت محمد صلى الله عليه وسلم، ليجلسوا إلى محمد صلى الله عليه وسلم وهو يقرأ القرآن في جوف الليل.<br />و جاءت الدراسات الحديثة الطبية، التي تستخدم أجهزة الكومبيوتر العجماء لتؤكد الأثر البين لسماع القرآن على النفس البشرية. فلقد قامت مؤسسة العلوم الطبية الإسلامية في مدينة \" بنما سيتي \" في أمريكا بدراسة الأثر الشفائي لسماع وتلاوة القرآن. وأكد الدكتور أحمد القاضي _ رئيس القسم الإعلامي في المؤسسة _ بأن هذا البحث التجريبي حاول إثبات ما للقرآن من تأثيرات على وظائف الأعضاء وقياس هذه التأثيرات بواسطة أجهزة إلكترونية، تراقب وتسجل أية تغيرات غريزية _ فيزيولوجية _ عند عدد من المتطوعين الأصحاء أثناء استماعهم لتلاوة القرآن أو قراءتهم له"
archived = "2010-02-20"
capture_url = "https://web.archive.org/web/20100220041657/http://www.20at.com:80/masr/review/15395--q-q.html"

