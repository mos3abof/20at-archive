posted = "2010-02-20"
text = "و تبين الدراسة أن للقرآن أثر مهدئ بنسبة 97 % على شكل تغيرات فيزيولوجية تدل على تخفيف درجة توتر الجهاز العصبي. وتهدف المرحلة الثانية من الدراسة معرفة ما إذا كان أثر القرآن المهدئ للتوتر وما يصاحبه من تغيرات غريزية عائداً فعلاً إلى التلاوة القرآنية وليس لعوامل أخرى مثل الصوت أو النبرة العربية أو لمعرفة السامع لمعنى ما يتلى _ وبكلمة أخرى _ التحقق من أن كلمات القرآن في حد ذاتها لها تأثيرها الخاص ولو كانت غير مفهومة لدى السامع ( السامع غير العربي ة غير المسلم ).<br />أجريت 210 جلسات تجريبية عند خمسة متطوعين أصحاء، غير مسلمين، ولا يعرفون العربية وقد تليت على المتطوعين قراءات مجودة للقرآن، وأخرى عربية غير قرآنية، مجودة ومطابقة للقراءات القرآنية من حيث الوقع على الأذن، كما أجريت على المتطوعين جلسات مريحة فيها لأي قراءة ( 40 جلسة )."
archived = "2010-02-20"
capture_url = "https://web.archive.org/web/20100220041657/http://www.20at.com:80/masr/review/15395--q-q.html"

