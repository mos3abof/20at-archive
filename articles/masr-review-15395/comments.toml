author = "سماع القرآن وتلاوته"
posted = "2010-02-20"
text = "أثر سماع القرآن وتلاوته على النفس<br />_______________ _______________ ___________<br />قال تعالى: { وإذا قرئ القرآن فاستمعوا له وأنصتوا لعلكم ترحمون } [ سورة الأعراف: الآية 132 ].<br />و قال: { إن قرآن الفجر كان مشهوداً } [ سورة الإسراء: الآية 78 ].<br />و قال: { وننزل من القرآن ما هو شفاء ورحمة للمؤمنين } [ سورة الإسراء: الآية 82 ].<br />و قال: { وأمرت أن أكون من المسلمين وأن أتلو القرآن } [ سورة النمل: الآيات 91-92 ].<br />و قال: { لو أنزلنا هذا القرآن على جبل لرأيته خاشعاً متصدعاً من خشية الله } [ سورة الحشر: 31 ].<br />و قال: { فاقرؤوا ما تيسر من القرآن } [ سورة المزمل: الآية 23 ].<br />و قال: { أأعجمي وعربي، قل هو للذين آمنوا هدى وشفاء } [ سورة فصلت: الآية 44 ].<br />و قال: { يا أيها الناس قد جاءتكم موعظة من ربكم وشفاء لما في الصدور } [ سورة يونس: الآية 57 ].<br />و"
archived = "2010-02-20"
capture_url = "https://web.archive.org/web/20100220041657/http://www.20at.com:80/masr/review/15395--q-q.html"

