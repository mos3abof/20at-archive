posted = "2010-02-20"
text = "عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: \" وما اجتمع قوم في بيت من بيوت الله يتلون كتاب الله ويتدارسونه بينهم إلا نزلت عليهم السكينة، وغشيتهم الرحمة وذكرهم الله فيمن عنده \" [ رواه مسلم ].<br />القرآن ذكرٌ، بل هو أعظم الذكر، وهو ترديد لصفات الخالق سبحانه وشرح لمعاني أسمائه الحسنى. والمؤمن حين سماعه للقرآن أو تلاوته له، وهو موقن أنه هو المخاطب به من قبل رب العالمين، لا شك أن نفسه ستصفو وتسمو، وتهدأ وتطمئن ويزول ما بها من انفعال. ولن نكرر هنا، فلتلاوة القرآن أو سماعه والإصغاء إليه نفس الآثار على النفس التي ذكرناها في بحث الذكر."
archived = "2010-02-20"
capture_url = "https://web.archive.org/web/20100220041657/http://www.20at.com:80/masr/review/15395--q-q.html"

