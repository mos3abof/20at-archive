[[comments]]
order = 1
subject = "والله والله والله والله والله والله انا مسلم من دب"
text = "ولله عارف انك بدور على العرب وانا سمعتك وانا والله زعلت وايد عليه ولكن هذا القضاء وشكر الله سعيكم"
archived = "2004-11-12"
capture_url = "https://web.archive.org/web/20041112192615/http://www.20at.com:80/article.php?sid=746"

[[comments]]
order = 2
subject = "شكرا لاخونا المسلم من دبي"
text = "شكرا لاخونا المسلم من دبي الذي تعاطف معناوشكر الله سعيكم و سعي كل من شارك الشعب الفلسطيني في هذا المصاب الحلل و كسر الله عظم النائمين الذين لا يهتمون بامر المسلمين اخوانهم"
archived = "2004-11-12"
capture_url = "https://web.archive.org/web/20041112192615/http://www.20at.com:80/article.php?sid=746"

