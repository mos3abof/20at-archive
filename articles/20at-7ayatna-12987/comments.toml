text = "متبرع غاية في الأهمية حيث أن الكثير من الكلاب يحتاجون إلي عمليات نقل دم إما لأنهم يعانون من الأنيميا أو يتعرضون لحادث سير أو لأنهم مصابون بالسرطان.<br />ماذا عن الناس التى تقتل بطرق سير غير صالحة والكل يتفرج على هذا العبث بل يزيدوا حالة الطريق سوءا والله ينتقم من الظالم الذين يقتلون الناس"
