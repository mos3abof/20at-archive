[[comments]]
order = 18
subject = ""
author = "خمسين جهة امنية"
posted = "2009-09-05"
text = "قوات الامن المركزى 800 الف عسكرى زى القمل او دودة القطن بتاكل الاخضر فى البلد<br />مباحث امن الدولة<br />نيابة امن الدولة<br />المباحث العامة<br />الشرطة العسكرية<br />االحرس الجمهورى<br />القوات الحراسة الخاصة<br />تشكيلات مكافحة الشغب<br />المحاكم العسكرية<br />النيابة العسكرية<br />كمائن المرور والطرق<br />و<br />و<br />و<br />و<br />وعايزين البلد تصحى او تفوق<br />دلع يا عم نفسك بالمكيف الامريكانى قبل امين شرطة ما يتبلى عليك"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906155719/http://www.20at.com:80/masr/105-msa7t-r2y/13144-2009-09-01-13-27-30.html"

[[comments]]
order = 19
subject = ""
author = "الى المعلق السابق"
posted = "2009-09-05"
text = "تعليقك ممتاز<br />ودا كله من كلاب الثورة او عساكر الثورة<br />طبعا العسكري دا بيشتغل في ثكنه عسكرية او مطار عسكري زي صاحبنا<br />اهم حاجه في الثكنه العسكرية او المطار العسكري الامن<br />فحولوا مصر الى مطار عسكري كبير مليان امن<br />طول ما انت ما شي في الشارع تلاقي فرق امن عماله تتنطط<br />على ايه ما تعرفش<br />بدل ما يبنوا مصانع ويزرعوا الارض البور علشان الناس تاكل وتشتغل<br />نام يا ابني في المكيف نام وفرشح رجليك البلد تحت سيطرة الامن المركزي"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906155719/http://www.20at.com:80/masr/105-msa7t-r2y/13144-2009-09-01-13-27-30.html"

[[comments]]
order = 20
subject = ""
author = "لو انت صينى"
posted = "2009-09-05"
text = "لو انت صينى ومعاك قرشين كنت بثمن المكيف اشتريت ماكينة تريكو او دفعت مقدم ماكينة تريكو واشتريت خيوط صوف وانتجت فى الشهر 30 بلوفر وموزع البضائع اشتراهم منك بمكسب 20 جنية فى الواحد يعنى دخل اضافى 600 جنية وبنفس استهلاك الكهرباء<br />علشان كدة الصين بتتقدم وبتصدر لنا المسبحة وسجادة الصلاة وفانوس رمضان<br />انما انت لو غالى بتاع الضرايب عرف هييجى يخرب بيتك ويدفعك ضريبة مبيعات وضريبة دخل وضريبة عقارات<br />لكن للاسف انت مش صينى<br />يبقى دلع نفسك<br />ونام وفرشح رجليك وخللى المكيف يضرب فى الالية علشان بلدك عايزة كدة"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906155719/http://www.20at.com:80/masr/105-msa7t-r2y/13144-2009-09-01-13-27-30.html"

