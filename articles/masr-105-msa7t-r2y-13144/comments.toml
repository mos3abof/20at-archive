text = "ا رب ان عظمت ذنوبى ——————-فقد علمت بان عفوك اعظم<br />ان كان لا يرجوك الا مؤمن —————- فبمن يلوذ ويستجير المجرم<br />اادعوك يا رب كما امرت تضرعا ————————- فاذا رددت يدى فمن يرحم<br />ما لى اليك وسيلة الا الرجا —————————— وجميل عفوك ثم انى مسلم"
