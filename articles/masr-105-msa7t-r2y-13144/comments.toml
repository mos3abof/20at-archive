[[comments]]
order = 12
subject = ""
author = "الحر وكشف العورات"
posted = "2009-09-04"
text = "عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: ((صنفان من أهل النار لم أرهما: قوم معهم سياط كأذناب البقر يضربون بها الناس، ونساء كاسيات عاريات، مميلات مائلات، رؤوسهن كأسنمة البخت المائلة، لا يدخلن الجنة، ولا يجدن ريحها، وإن ريحها ليوجد من مسيرة كذا وكذا)) رواه مسلم.<br />وعن أبي موسى الأشعري رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: ((أيّما امرأة استعطرت فمرّت على قومٍ ليجدوا من ريحها فهي زانية)) الترمذي ، والنسائي، وقال الترمذي: \"حسن صحيح\". .<br />وأما إطلاق البصر نحو العورات فهو محرم شرعا لقول الله تعالى: {قُلْ لّلْمُؤْمِنِينَ يَغُضُّواْ مِنْ أَبْصَـٰرِهِمْ وَيَحْفَظُواْ فُرُوجَهُمْ ذٰلِكَ أَزْكَىٰ لَهُمْ إِنَّ ٱللَّهَ خَبِيرٌ بِمَا يَصْنَعُونَ * وَقُل لّلْمُؤْمِنَـٰت ِ يَغْضُضْنَ مِنْ أَبْصَـٰرِهِنَّ وَيَحْفَظْنَ فُرُوجَهُنَّ} [النور:29، 30]."
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906155719/http://www.20at.com:80/masr/105-msa7t-r2y/13144-2009-09-01-13-27-30.html"

