[[comments]]
order = 4
subject = ""
author = "جهنم اشد حرا -5"
posted = "2009-09-03"
text = "قال تعالى : ( وما خلقنا السماء والأرض وما بينهما باطلا ذلك ظن الذين كفروا فويل للذين كفروا من النار)ا<br />قال تعالى : ( قالوا ربنا من قدم لنا هذا فزده عذابا ضعفا في النار)ا<br />قال تعالى : ( لهم من فوقهم ظلل من النار ومن تحتهم ظلل ذلك يخوف الله به عباده يا عباد فاتقون)ا<br />قال تعالى: ( وإذ يتحاجون في النار فيقول الضعفاء للذين استكبروا إنا كنا لكم تبعا فهل أنتم مغنون عنا نصيبا من النار)ا<br />قال تعالى : ( وقال الذين في النار لخزنة جهنم ادعوا ربكم يخفف عنا يوما من العذاب)ا<br />قال تعالى : ( ذلك جزاء أعداء الله النار لهم فيها دار الخلد جزاء بما كانوا بآياتنا يجحدون)ا<br />قال تعالى : ( وقيل اليوم ننساكم كما نسيتم لقاء يومكم هذا ومأواكم النار وما لكم من ناصرين)ا<br />قال تعالى : ( هذه النار التي كنتم بها تكذبون)ا<br />قال تعالى : ( يوم يسحبون في النار على وجوههم ذوقوا مس سقر)ا<br />قال تعالى : ( والذين كفروا وكذبوا بآياتنا أولئك أصحاب النار خالدين فيها وبئس المصير)ا"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906155719/http://www.20at.com:80/masr/105-msa7t-r2y/13144-2009-09-01-13-27-30.html"

[[comments]]
order = 5
subject = ""
author = "جهنم اشد حرا -4"
posted = "2009-09-03"
text = "قال تعالى : ( وجعلوا لله أندادا ليضلوا عن سبيله قل تمتعوا فإن مصيركم إلى النار)ا<br />قال تعالى ( سرابيلهم من قطران وتغشى وجوههم النار)ا<br />قال تعالى : ( ورأى المجرمون النار فظنوا أنهم مواقعوها ولم يجدوا عنها مصرفا)ا<br />قال تعالى : ( لو يعلم الذين كفروا حين لا يكفون عن وجوههم النار ولا عن ظهورهم ولا هم ينصرون)ا<br />قال تعالى: ( تلفح وجوههم النار وهم فيها كالحون)ا<br />قال تعالى : ( لا تحسبن الذين كفروا معجزين في الأرض ومأواهم النار ولبئس المصير)ا<br />قال تعالى : ( ومن جاء بالسيئة فكبت وجوههم في النار هل تجزون إلا ما كنتم تعملون)ا<br />قال تعالى : ( وأما الذين فسقوا فمأواهم النار كلما أرادوا أن يخرجوا منها أعيدوا فيها وقيل لهم ذوقوا عذاب النار الذي كنتم به تكذبون)ا<br />قال تعالى : ( يوم تقلب وجوههم في النار يقولون يا ليتنا أطعنا الله وأطعنا الرسولا)ا<br />قال تعالى : ( فاليوم لا يملك بعضكم لبعض نفعا ولا ضرا ونقول للذين ظلموا ذوقوا عذاب النار التي كنتم بها تكذبون)ا"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906155719/http://www.20at.com:80/masr/105-msa7t-r2y/13144-2009-09-01-13-27-30.html"

[[comments]]
order = 6
subject = ""
author = "جهنم اشد حرا -3"
posted = "2009-09-03"
text = "قال تعالى : ( أولئك مأواهم النار بما كانوا يكسبون)ا<br />قال تعالى : ( والذين كسبوا السيئات جزاء سيئة بمثلها وترهقهم ذلة ما لهم من الله من عاصم كأنما أغشيت وجوههم قطعا من الليل مظلما أولئك أصحاب النار هم فيها خالدون)ا<br />قال تعالى : ( أولئك الذين ليس لهم في الآخرة إلا النار وحبط ما صنعوا فيها وباطل ما كانوا يعملون)ا<br />قال تعالى : ( فأما الذين شقوا ففي النار لهم فيها زفير وشهيق)ا<br />قال تعالى : ( ولا تركنوا إلى الذين ظلموا فتمسكم النار وما لكم من دون الله من أولياء ثم لا تنصرون)ا"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906155719/http://www.20at.com:80/masr/105-msa7t-r2y/13144-2009-09-01-13-27-30.html"

[[comments]]
order = 7
subject = ""
author = "جهنم اشد حرا -2"
posted = "2009-09-03"
text = "قال تعالى : ( والذين كذبوا بآياتنا واستكبروا عنها أولئك أصحاب النار هم فيها خالدون)ا<br />قال تعالى : ( قال ادخلوا في أمم قد خلت من قبلكم من الجن والإنس في النار كلما دخلت أمة لعنت أختها حتى إذا اداركوا فيها جميعا قالت أخراهم لأولاهم ربنا هؤلاء أضلونا فآتهم عذابا ضعفا من النار قال لكل ضعف ولكن لا تعلمون)ا<br />قال تعالى: ( ونادى أصحاب النار أصحاب الجنة أن أفيضوا علينا من الماء أو مما رزقكم الله قالوا إن الله حرمهما على الكافرين)ا<br />قال تعالى : ( ذلكم فذوقوه وأن للكافرين عذاب النار)ا<br />قال تعالى : ( ما كان للمشركين أن يعمروا مساجد الله شاهدين على أنفسهم بالكفر أولئك حبطت أعمالهم وفي النار هم خالدون)ا"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906155719/http://www.20at.com:80/masr/105-msa7t-r2y/13144-2009-09-01-13-27-30.html"

[[comments]]
order = 8
subject = ""
author = "جهنم اشد حرا -2"
posted = "2009-09-03"
text = "قال تعالى : ( سنلقي في قلوب الذين كفروا الرعب بما أشركوا بالله ما لم ينزل به سلطانا ومأواهم النار وبئس مثوى الظالمين)ا<br />قال تعالى: ( كل نفس ذائقة الموت وإنما توفون أجوركم يوم القيامة فمن زحزح عن النار وأدخل الجنة فقد فاز وما الحياة الدنيا إلا متاع الغرور)ا<br />قال تعالى : ( إن المنافقين في الدرك الأسفل من النار ولن تجد لهم نصيرا)ا<br />قال تعالى : ( إني أريد أن تبوء بإثمي وإثمك فتكون من أصحاب النار وذلك جزاء الظالمين)ا<br />قال تعالى : ( يريدون أن يخرجوا من النار وما هم بخارجين منها ولهم عذاب مقيم)ا<br />قال تعالى : ( ولو ترى إذ وقفوا على النار فقالوا يا ليتنا نرد ولا نكذب بآيات ربنا ونكون من المؤمنين)ا<br />قال تعالى : ( ويوم يحشرهم جميعا يا معشر الجن قد استكثرتم من الإنس وقال أولياؤهم من الإنس ربنا استمتع بعضنا ببعض وبلغنا أجلنا الذي أجلت لنا قال النار مثواكم خالدين فيها إلا ما شاء الله إن ربك حكيم عليم)ا"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906155719/http://www.20at.com:80/masr/105-msa7t-r2y/13144-2009-09-01-13-27-30.html"

[[comments]]
order = 9
subject = ""
author = "جهنم اشد حرا -1"
posted = "2009-09-03"
text = "قال تعالى: ( والذين كفروا وكذبوا بآياتنا أولئك أصحاب النار هم فيها خالدون)ا<br />قال تعالى : ( بلى من كسب سيئة وأحاطت به خطيئته فأولئك أصحاب النار هم فيها خالدون)ا<br />قال تعالى : ( إن الذين يكتمون ما أنزل الله من الكتاب ويشترون به ثمنا قليلا أولئك ما يأكلون في بطونهم إلا النار ولا يكلمهم الله يوم القيامة ولا يزكيهم ولهم عذاب أليم)ا<br />قال تعالى : ( الذين يأكلون الربا لا يقومون إلا كما يقوم الذي يتخبطه الشيطان من المس ذلك بأنهم قالوا إنما البيع مثل الربا وأحل الله البيع وحرم الربا فمن جاءه موعظة من ربه فانتهى فله ما سلف وأمره إلى الله ومن عاد فأولئك أصحاب النار هم فيها خالدون)ا<br />قال تعالى: ( إن الذين كفروا لن تغني عنهم أموالهم ولا أولادهم من الله شيئا وأولئك هم وقود النار)ا<br />قال تعالى : ( إن الذين كفروا لن تغني عنهم أموالهم ولا أولادهم من الله شيئا وأولئك أصحاب النار هم فيها خالدون)ا<br />قال تعالى : ( واتقوا النار التي أعدت للكافرين)ا"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906155719/http://www.20at.com:80/masr/105-msa7t-r2y/13144-2009-09-01-13-27-30.html"

[[comments]]
