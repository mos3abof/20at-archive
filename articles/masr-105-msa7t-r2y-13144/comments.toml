text = "لو انت المانى وتوفر معاك قرشين<br />بتروح تشترى شوية اسهم لشركات انتاجية صناعية اسهمها غير مطروحة للمضاربات فى البورصة - بتشترى اسهم من مكتب الشركة مباشرة وبتعطى عائد على حسب ارباح الشركة نهاية السنة واحيانا العائد بيوصل عشرين فى المية وبتعطى دخل اضافى حقيقى من الانتاج وليس المضاربة وبالارباح تقدر تحسن مستواك<br />والسهم سعرة ثابت لا بيطلع ولا بينزل والعائد على حسب الارباح"
