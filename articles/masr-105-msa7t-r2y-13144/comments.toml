text = "المشكلة مش فى الحصول على المكيف<br />دى حاجة سهلة قوى وخصوصا مع التقسيط<br />انما الخاذوق الكبير هتلاقية فى فاتورة الكهرباء لان الاستهلاك تصاعدى وهتدفع كتير قوى وهتعيط<br />وبعدين تبتدى الخناقة مع زوجتك واطفالك الذين سيتعودون على التكييف ويريدونة شغال على طول وانت تصرخ من فاتورة الكهرباء"
