subject = ""
author = "ومنين يجيبوا كهرباء"
posted = "2009-09-03"
text = "استهلاك مكيف واحد من الكهرباء يعادل استهلاك 5 شقق سكنية فيها استهلاك عادى<br />تخيل بقى لو كل واحد ركب مكيف - الحكومة هتجيب كهرباء من اين وسعر محطة الكهرباء اصبح بالمليارات<br />وبعدين المكيف فى مصر بيشتغل بدورة مزدوجة يعنى فى الصيف بيبرد الهواء وفى الشتاء بيسخن الهواء ويعمل تدفئة<br />بالعربى هيشتغل صيفا وهيشتغل شتاءا<br />وعلشان امثال الناس اللى بتحب تقلد الاغنياء الكهرباء بتنقطع كل شوية فى البيوت<br />واحيانا اسلاك الكهرباء داخل الشقة غير مصممة لتحمل احمال عالية زى المكيف وبالتالى عند تشغيل المكيف السلوك بتسخن وتولع وتعمل التماس كهربائى وتولع فى الشقة<br />وكثير من حرائق الشقق بتكون بسبب المكيف"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906155719/http://www.20at.com:80/masr/105-msa7t-r2y/13144-2009-09-01-13-27-30.html"

