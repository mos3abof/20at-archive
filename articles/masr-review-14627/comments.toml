text = "ماكامش العشم ليه نفهم البعد القريب للفيلم ومانفهمش ابعد بعد ممكن انت توصلو بتفكيرك حتى لو كنت ماشفتش الفيلم (زيى)كل اللى عاوز اقولو ان ممكن ده يكون انذار انه الحاجات دى لو حبتحصل قليل لازم تتبطل عشان لو كترت ممكن تضيع اخرتنا وممكن الواحد مننا يموت وهو بيعمل حاجة من دول هيبقى شكلو ايه قدام اللى خلقه سبحان القدير الرحيم ذو العفو والجلال والاكرام ووحده علينا هو الكريم<br />قادر يبعدنا عن كل ده بحق اشهد ان لا اله الا الله وان محمد (صلى الله عليه وسلم )رسول الله"
