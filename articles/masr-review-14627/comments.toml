author = "هانى"
posted = "2010-01-20"
text = "على فكرة الفيلم جامد جدا ومش عايزين تخلف والفيلم جايب كلية الفنون الجميلة كنموذج لكل كليات الجامعة وانا اتحدى اى حد فى اى كلية مفيهاش دكتور بينام مع طلبة او طلبة بتنام مع بعض فى الكلية او بنات بتعمل حاجات مش كويسه مع بنات او مخدرات او او او او الى اخرة يعنى كفايه هبل بقى ونبطل شعارات كدابه عايزين السينما تبقى نضيفة لازم الواقع يبقى نضيف يعنى الكاتب ده اى كان اتجاهه او ميوله او رغبته فهى نابعة من مجتمع هو عايش فيه ومن حاجات بيشوفها وبتنعكش على كتاباته ابوس ايديكو بطلوا الفشخرة الكدابة وشغلوا مخكو بقى<br />وكل بئر ينضح مما فيه<br />وعلى فكرة للمرة المليون الفيلم بجد جامد جدا وانا كنت مستمتع بكل لقطة فيه الصورة كانت حلوة والإخراج رائع والتمثيل رائع والمزيكا خرافيه والجرافيك جامد جدا<br />وياريت عشان خاطرى لو فى ناقد فنى عايز يتكلم عن فيلم يتكلم عن فنيات اما لو انت مختلف فى الأفكار بتاعة الفيلم فدى حاجة لازم تناقشها مع اللى كاتب الفيلم شخصيا عشان يقدر الراجل يدافع عن افكارة<br />اه انا هخش الفيلم ده تانى وهدفع فبوس فيه تانى ولما ينزل هشترية اورجينال<br />سلام"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130094603/http://www.20at.com:80/masr/review/14627-2009-12-28-11-25-57.html"

