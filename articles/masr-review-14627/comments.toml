text = "زي ما قلت زمان حاقول دلوقتي<br />كل واحد بيفكر في مصر ازاي يتخلص من الفار وما فيش حل الا استهبال الشعب والضحك عليه علشان خاطر يدفع<br />والمقدمه بتاعة الموضوع تؤيد ذلك<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ<br />حيث احتوى الفيلم على علاقات غير شرعية ومشاهد جنسية وحمل سفاح وألفاظ يعاقب عليها القانون<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />الحجات اللي حتشد انتباه الشعب الاهبل علشان خاطر يجري على السينمات ويكسر شبابيك التذاكر والفيلم يجيب بسرعة وكل واحد يا خدله مليون<br />هي دي عقلية العيال الكسيبه بتوع مصر دلوقتي<br />ازاي تطلع الفلوس من جيب الشعب اللي هو ما عندهوش فلوس اصلا<br />مفيش غير اللي مكتوب في المقدمه<br />سلام"
