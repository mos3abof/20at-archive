author = "واحدة وخلاص"
posted = "2010-01-01"
text = "انا واحدة كنت في كلية فنون جميلة - قسم عمارة .. ومن ساعة ما دخلت الكلية حتى بعد ما اتخرجت واشتغلت .. ما قبلتش ناس أكثر أحتراما من زمايلي أو دكاترة الكلية دي .. ولا عمري شفت فيها مناظر خارجة ولا عمري سمعت فيها ألفاظ خارجة .. على عكس كليات تانية \" كليات نظرية \" لما دخلتها حسيت إني في شارع مش في كلية … بجد الدراسة في كلية الفنون الجميلة بتسموا بالفكر والاحساس وبالتالي مش بتخلي فرصة للشباب أنهم يفكروا ولا في الانحراف ولا في التطرف … أنا مش ضد فكرة الفيلم أنه يناقش فكرة النحت والتصوير حلال ولا حرام .. أنا ضد قلة الأدب والبجاحة السينمائية"
archived = "2010-01-30"
capture_url = "https://web.archive.org/web/20100130094603/http://www.20at.com:80/masr/review/14627-2009-12-28-11-25-57.html"

