[[comments]]
order = 31
subject = "هذا ظلم !"
author = "مي"
posted = "2006-08-07"
text = "هذا غير جائز بتاتا ! لكل انسان الحق في أن يشاهد الفيلم!! ولا يملك احد اي حق في التحكم ب إرادة الانسان!! فهذه حريه شخصيه !!<br />واستغرب انهم منعوا عرض فيلم الذي يجسد روايه في غاية الروعه في اسلوب الكتابه وطريقة جذب القارئ .. في حال لم يتم منع عشرات الافلام التي تمس بشكل او بآخر باخلاقنا ك عرب !<br />وكما قالت ماجده موريس ان الذي سوف يشك بدينه بعض مشاهدة الفيلم فهو ليس مؤمن ! وهو اصلا غير مقتنع بدينه !<br />وعلى خلاف مع بعضكم .انا اجد ان الفيلم من اروع الافلام التي شاهدتها .. ولكنه يحتاج الى مشاهد ذو فكر تحليلي وقادر على ربط امور و توقع الاحداث القادمه..وذلك كله ليشعر بروعة الفيلم<br />وشكرا !<br />مي ..فلسطين المحتله"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905183316/http://masr.20at.com:80/article.php?sid=536&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 32
subject = "هذا العبقري"
author = "د.ياسر شلبي"
posted = "2006-10-17"
text = "هل نحن منتظرين هذا العبقري مؤلف الرواية حتى ندرك أن المسيح عيسى بن مريم عليه السلام بشر؟<br />أنصح من يريد أن يقرأ الرواية أو يشاهد الفيلم بأن يقرأ القرآن الكريم بدلا منها وسوف يعرف كل ما يكفي معرفته عن نبي الله عيسى ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145018/http://www.20at.com/article2.php?sid=954"

