subject = "غلطان اللي طلب منع الفيلم"
author = "بنت فلسطينية من غزة"
posted = "2006-06-19"
text = "بجد غلطانين الي طالبوا منع الرواية او الفيلم من مصر<br />وانا متأكدة ان العضو البرلمان المسلم اللي طلب منع الفيلم لا قرأ الرواية ولا جرب يعرف هي بتتكلم عن ايه بجد<br />انا قرأت الرواية (500 صفحة قرأتهم في اسبوع ,, مش حتقدر تغمض عينيك ههههه).. وشفت الفيلم (وهو موجود على النت ومترجم كمان) .. وهي حتى لو كان فيها جانب خيالي ومن تأليف الكاتب .. بس اكيد فيها جوانب من الحقيقة .. ويكفي انها بتخلي الواحد يفكر ويشغل دماغو شوية .. ويشوف زوايا في التاريخ والفن بطريقة عمره ما شافها قبل كدة والصراحة بنصح الكل المسلمين والمسيحيين بقرائتها .. وكداب الي بيقول انها بتسيء للإسلام<br />عمرك فكرت ليه الموناليزا اسمها كدة ؟؟ عمرك كمسيحي جربت تتخيل السيد المسيح انه بشر ونبي كريم رسالته كانت رسالة التوحيد؟؟ عمرك سألت نفسك ليه Sunday هو يوم الاجازة عند المسيحيين ؟؟ اسألة كتير<br />انت بنفسك حتكتشف اجابتها وانت بتقرأ الرواية .. والحق ان الفيلم كويس نسبيا بس قراءة الرواية امتع بكتير<br />بس خلاص .. حسيت حالي رغيت كتير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145018/http://www.20at.com/article2.php?sid=954"

[[comments]]
order = 15
subject = "نسيت اقول حاجة"
author = "نفس البنت الي فوق"
posted = "2006-06-19"
text = "الرواية ما فيهاش ابدا اساءة للنبي الكريم عيسى عليه السلام من وجهة نظر الاسلام .. هي بتلغي عنه صفة الألوهية .. وبالتالي بتقول انه كإنسان كان من الطبيعي في ذلك الوقت ان كل شاب بعمره يكون متزوج ..والنصوص القرأنية ما فيهاش ما يدل انه لم يتزوج .. وطالماان ده لم يذكر بالنص .. فالقول انه تزوج بالفعل ليس فيه تكذيب لنص<br />والنقطة التانية .. الرواية بتكشف جانب كبير من التلاعب الي تم على يد الامبراطور الوثني قسطنطين لدمج بعض الرموز الوثنية في المسيحية .. ومنها اعطاء صفة الالوهية لعيسى عليه السلام<br />يا جماعة اقرأوا الرواية الاول بعدين اتكلموا وناقشوا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145018/http://www.20at.com/article2.php?sid=954"

[[comments]]
order = 16
