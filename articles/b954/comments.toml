text = "انا نفسى أقرا الرواية علشان احكم عليها بفكرى المتواضع البسيط وانا ضد منع اى شىء غن الناس لازم ندى الناس فرصة عشان يشوفوا و يسمعوا ويحكموا بنفسهم على الرواية والفلم ومحدش يكون وصى على حد و يحتكر آرائة و فكرة ونسيب الناس يقرروا الاى هم عاوزينو"
