subject = "لا ليس منطقي"
author = "محمد علي"
posted = "2006-06-19"
text = "القرآن الكريم و السنة النبوية المطهرة بالفعل لم يذكرا أن سيدنا المسيح عيسى بن مريم (عليهما الصلاة و السلام )قد تزوج و لذا فإننا لا نأخذ من يقول بهذا على محمل الجد خاصة و أن نبي الله عيسى ( عليه السلام ) قد رفعه الله إليه و أنجاه و هو صغير ... معظم الروايات تقول انه لم يتجاوز ال 35<br />و لكن للأخ الذي كتب فوقي : ما علاقة الطهر و النقاء بالزواج؟<br />هل من يتزوج غير طاهر و نقي بينما من لا يتزوج طاهر و نقي ؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145018/http://www.20at.com/article2.php?sid=954"

[[comments]]
