subject = "حرية نعم .. صفاقة لا"
author = "د.ياسر شلبي"
posted = "2006-06-19"
text = "كلنا مع حرية التعبير لكن من قال ان الافتراء بالكذب على نبي من انبياء الله حتى ان لم يكن بالإساءة هي حرية ؟؟ لا فهي صفاقة و كفر وليست حرية تعبير و ما يدهشني حقا كيف تجرأ صناع الفيلم على نبي الله عيسى عليه السلام بهذا الشكل ؟؟ و كيف انهم اصبحوا لا يحترمون الاديان على الاطلاق ؟؟؟و ما يدهشني أكثر كيف قبل البعض بهذا الفيلم و استنكر منع عرضه؟؟؟؟؟؟؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145018/http://www.20at.com/article2.php?sid=954"

