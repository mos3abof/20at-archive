[[comments]]
order = 0
subject = "بلد الحريات"
author = "أحمد المصري"
posted = "2006-06-18"
text = "عشان تبقى الحكومة تمام و بتراعي مشاعر \"الأقليات\" و تحترم الأديان السماوية.<br />مجرد سؤال لماذا إذا تم عرض فيلم آلام المسيح مع مخالفته الصريحة لرأى الدين الإسلامي؟<br />الذي يستطيع فيلم أو عمل أدبي هز عقيدته إسلامية كانت أو مسيحية فالمشكلة في ضعف إيمانه."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623005946/http://masr.20at.com:80/article.php?sid=536"

[[comments]]
order = 1
subject = "بين الوليمة و الشفرة"
author = "محمد علي"
posted = "2006-06-18"
text = "أعترف أنني حتى الآن لم أقرأ الرواية و لم أشاهد الفيلم و لكن هناك ما أريد التعليق عليه<br />عندما وزعت وزارة الثقافة الرواية القذرة المسماة ( وليمة لأعشاب البحر )بما تحتويه من ألفاظ نابية و اعتداءات سافرة على ذات الله - جل و علا - خرج علينا \" وزير الصفاقة \" أبو شعر منكوش يدافع عن الرواية و حرية الرأي و عدم وجودحدود للإبداع و أن الفن فوق النقد ... إلى آخر هذا الكلام الفارغ و أخذ هذا أبو شعر منكوش هو و شيعته يكيلون الكلام ضد ( المتترفين الإسلاميين الوحشين )<br />لكن اليوم و بالنسبة لشفرة دافنشي فهوشخص مختلف تماما يرفض الإساءة للأديان و الأخلاق<br />اللهم العن المنافقين و أرحنا من وجوههم العفنة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145018/http://www.20at.com/article2.php?sid=954"

[[comments]]
order = 2
subject = "فيلم غريب"
author = "مصري مقيم بدبي"
posted = "2006-06-19"
text = "فيلم غريب ومش شيق, بس زي ما الناقدة ماجدة موريس قالت ان لازم الفيلم يتعرض ومش معقولة يعني علشان فيلم واحد يغير عقيدته, كل الشباب اللي معانا هنا مسيحين,بس سمعت كلمة حلوة اوي من واحد فيهم زي ما قال توم هانكس في الفيلم سواء كان المسيح بشري او إلاه لازم يكون فيه حاجة بتؤمن بيها يعني انت بتؤمن بالمسيح علي اي صورة, شوفتوا ازاي يا جماعة احنا لازم نستمع لوجهة النظر الاخري, موضوع فيلم آلام المسيح يا أخ أحمد انا بصراحة كرأي شخصي السينما او الميديا مش لازم خالص المؤسسات الدينية تدخل فيها, اقولك ليه لان نقطة الخلاف الرئيسية بين الاسلام والمسيحية هي صلب المسيح والفيلم بيكلم عن الاحداث ديه فانت ازاي هتقول ان ده مش متماشي مع الدين الاسلامي مع انه اكبر نقطة خلافية, وانا كل مرة هكرر شكري للشباب الجميل القائمين علي هذا الموقع."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623005946/http://masr.20at.com:80/article.php?sid=536"

[[comments]]
order = 3
subject = "محاكم التفتيش فى مصر"
author = "زنوبه"
posted = "2006-06-19"
text = "الكنيسه المصريه آعادتنا الى عهد محاكم التفتيش ـ لكن عندما يصدر كتاب به تطاول على الذات الالهيه تلاقى صويت وعويل إيه ده إنتم عايزين ترجعونا 1400 سنه لورا؟!! كاتهم خيبه هو إحنا نطول نرجع 1400 سنه لورا ـ ياريت<br />المهم عوده الى عهد محاكم التفتيش الذى إعادتنا اليه الكنيسه المصريه فهى سباقه وقامت بما لم يقم به الفاتيكان نفسه ـ وبعدين المسرحيه المسيئه التى عرضت فى الاسكندريه ـ يا ترى هما فاكرينها .<br />علشان نكون برضه حقانيين ـ مستوى التدنى الثقافى فى مصر قد يؤدى الى وصلة ردح دينى بين طبقات معينه فى المجتمع إذا عرض هذا الفيلم آو الكتاب مع العلم آن الكتاب بالنسخه الانجليزيه والعربيه كان يباع فى مكتبات مدبولى وبعض المكاتب الكبرى الى آن تم وقف طباعته فى لبنان ونفاذ النسخ<br />وتقدرو تحملوه من على النت بالعربى وبآى لغه تانيه لو عندكم برنامج آكروبات 6<br />بما إننا من الطبقه المثقفه آحب آفكركم إن موضوع آلوهية المسيح محسوم لدينا منذ 1400 عام ولا نحتاج الى فيلم آو روايه لتآكيده<br />بقى آن آذكركم بشىء لوجه الله وآنتم تقرآون الروايه آو إن كنتم نجحتم فى تحميل الفيلم من النت إن نبى الله عيسى عليه الصلاة والسلام لم يتزوج ومن المعروف آنه من آكثر عباد الله ذهدا"
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623005946/http://masr.20at.com:80/article.php?sid=536"

