[[comments]]
order = 7
subject = "هما كده حلال عليهم حرام علينا"
author = "العفريت"
posted = "2006-06-19"
text = "فاروق حسني بقى له رأي في الأديان؟ سبحان القادر على كل شئ. أنهنو الي حرام يالوطي، بجد وزير ثقافتنا لوطي، عرض فيلم زي ده، وإلا نشر رواية \"وليمة للأعشاب\" الي أخف ما كتب فيها أستغفرك وأتوب اليك يارب \"القرآن خراء!\"، ولا كلمة من شيخ الأزهر الوقور، والإستاذ عادل حسين الله يرحمه يتحبس وتقفل جريدة الشعب من ورا الحكاية دي، ويموت الأستاذ عادل من القهر.<br />الفيلم عندي من أكثر من شهر، وبصراحة ممل أس مليون، وبصراحة الكنيسة مزوداها قوي، يعني دي وجة نظر مش زيادة على كده، لما العقيدة المسيحية صحيحة، حيأثر فيها فيلم؟<br />هما كده، مسموح لهم يشرشحوا الإسلام، ده حرية، ولما نرد نبقى همج وإرهابين وبتوع القاعدة، ويحبسنا مبارك أو يعدمنا.<br />لما صحيفة النبأ نشرت خبر عن الراهب الفاسد الي بيمارس الجنس مع الستات في الدير، وبيعمل أفلام فيديو بيصورها ويبعها، والنبأ حصلت على نسخة ونشرت، ليه تتقفل النبأ ويتسجن المحررين بدل الراهب راسبوتين ده، بالمناسبة البابا شنودة رفض حكم الإستئناف القاضي بتبرئة النبأ، وطبعا إستمر حبس الصحفين؟ إيه المسخرة دي؟<br />الدكتورة زينب عبد العزيز استاذة الحضارة الفرنسية، ليها مقال رائع عن الموضوع راح الحقه."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623005946/http://masr.20at.com:80/article.php?sid=536"

[[comments]]
order = 8
subject = "شفرة دافنشى محاكم التفتيش والمؤسسة الكنسية !"
author = "بقلم : الدكتورة زينب عبد العزيز"
posted = "2006-06-19"
text = "بقلم : الدكتورة زينب عبد العزيز<br />استاذة الحضارة الفرنسية<br />dr_zeinab@menanet.net<br />ان ما يدور بالساحة الإعلامية والإجتماعية ، فى مصر ، بحاجة إلى وفقة لتأمل ما بها من خلط فى المفاهيم . وبغض الطرف عن كل ما كتب أو اُثير حول المؤلف الأمريكى دان براون وروايته المعروفة باسم \"شفرة دافنشى\" ، والفيلم المأخوذ عنها ، فإن ما تم اتخاذه من قرارات سواء أكانت كنسية أو برلمانية يثير العديد من التساؤلات و يستوجب شىء من التوضيح والمراجعة.<br />ففى يوم الأربعاء الموافق 31/5/2006 نشرت جريدة الأهرام فى صفحتها الأخيرة خبر يقول : \" أن رؤساء الكنائس بمصر يصدرون بيانا حول فيلم شفرة دافنشى \" . ويقول البيان وفقا لما هو منشور فى الجريدة : انهم اتفقوا على ان الفيلم يزيف التاريخ وعلم الآثار وبنيت قصته على اباطيل ليس لها اساس من الصحة العلمية. وقد اثبت العلماء هذا التزوير بصورة وثائقية. وان الفيلم وراءه فكر صهيونى يهدف الى الإزدراء بالدين وقيمه الأخلاقية والروحية. وان الفيلم ينتهى بنجمة صهيون ويروج للفكر الصهيونى وان الفيلم يغلب عليه العنف والقسوة ..<br />ولم يصدر بهاذا البيان المنشور اى تلميح أو اشارة لمنع عرض الفيلم، وانما مجرد اتهامات.<br />ويوم الأربعاء الموافق 14/6/2006 نشرت نفس الجريدة فى صفحة المتابعات خبر افترش نصف الصفحة تقريبا عن ثورة غضب واعتراضات واسعة من جميع النواب على دخول الفيلم والكتاب الى مصر ، وان وزير الثقافة قد اعلن عدم السماح بعرض الفيلم وتعهد بمنع الكتاب ومصادرته !! وقبل تناول الموضوع تجب الإشارة الى الصورة الرئيسية المنشورة مع المقال من جلسة مجلس الشعب ، وان عبارة \" جميع النواب\" تثير بسمة لها مغزاها فالصورة ليس بها إلا بضعة افراد لا يتعدوا أصابع اليدين و<br />اقرأ بقية التعليق .."
archived = "2006-06-23"
capture_url = "https://web.archive.org/web/20060623005946/http://masr.20at.com:80/article.php?sid=536"

