[[comments]]
order = 27
subject = "بصراحه محدش فاهم حاجه"
author = "عاصم مصطفى"
posted = "2006-06-24"
text = "بصراحه موضوع دافنشي كود قديم جدا و كان معروف من الاول ان الحكومة مش هتوافق على عرض الفيلم مع ان اكيد ان محدش شافه ولا فاروق حسني و ولا مجمع الكنايس بس كالعاده هنا بنحكم على العمل الفني بمعاير ملهاش اي دعوة بالتقييم الفني للفيلم و غريب جدا انه يكون السبب ان الفيلم يحمل معلومات مغلوطة و كمان هيسبب بلبله ده يعبرش على اي حاجة غير ان الحكومه مش فاهمه حاجة بالاضافة الا ان الفيلم اصلا عمل غربي و اجنبي و ماخوذ من روايه موجوده في مصر من سنه فاتت و الغريب اصلا انها نفذت كمان من اكتر نت اربع شهور و بتتباع في السوق السوده بميه و عشرين جنيه تقريبا و اذا كنا هنا خايفيين فا البلاد المنتجه للفيلم و الممثلين المسيحيين و الجمهور اللي عارض الفيلم و شافه كله اجنبي و تلت اربعه مسيحي تقريبا بس في الاخر اتفقوا او اختلفوا بس سمحوا بعرض الفيلم لانه في الاخر فيلم و ابداع ولازم يتحكم عليه من الزاوية دي بس مش اكتر و المضمون ده تابع لدان براون مؤلف الروايه و كانوا يمنعوا الروايه من ساعة ما نزلت مصر مش بعد الهنا بسنه طبعا رغما عن انف اي حد الفيلم بيتسرب و اكيد كل من يهمه الامر هيتفرج عليه"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170631/http://masr.20at.com:80/article.php?sid=536"

[[comments]]
order = 28
subject = "ابوا العريف كاشف النصابين والهوايل"
author = "مصري مقيم بدبي"
posted = "2006-06-24"
text = "كاشف النصابين العبيط انت عامل نفسك الواد اللي محصلش, يا غبي فيه واحدة اسمها ايمان بتكتب ومش نفس الشخص وخد بالك الاول يا ابو العريف من اسلوب الكلام, فيلم دافنشي ده واحد طالع بيقول رأي او اكتشاف معين وعلي فكرة كان فيه فيلم تسجيلي من يومين علي قناة ناشيونال جيوجرافيك علي الموضوع ده وبيسألوا بصراحة: كان ايه دور فرسان الهيكل وليه خدوا الصلاحيات المهولة ديه وفي الاخر تم احراق بعضهم واتهامهم بالهرطقة, لو عندك اجابة ياريت تقولهلنا, بالنسبة لموضوع الإساءة ديه عايز اقولك يا سيد جرجس انها إهانة للرسول, ده واحد بيقول ان الرسول (ًصلعم) ارهابي ومصور قنبلة في رأسه يعني الرسام ده يستاهل الموت, مش موضوع حلوة ليكوا ووحشة لينا, خليك منطقي شوية وبص للموضوع بعقلانية, وخد بالك اللي عامل الفيلم ده واحد مسيحي لكن الرسومات مين اللي رسمها......"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170631/http://masr.20at.com:80/article.php?sid=536"

[[comments]]
order = 29
subject = "نهارك أبيض مصري مقيم"
author = "الكاشف"
posted = "2006-06-25"
text = "مش عايز أفتحها معاك هنا وصلة سب وشتيمة تذكرنا بالسادات، وبعبد الله والقذافي. ميهمنيش حقيقي كام إسم مستعار إنت عندك، طالما إتعدلت وبقيت تتكلم مضبوط، أكتر من كده مش عايز.<br />إحنا لاعجبنا الفيلم ولا موافقين عليه، ولا ساهمنا فيه لاإنتاج ولاتصوير ولا مشاهدة، ده ماما أمريكا اللي عملته، منكم ليها يانصارى إخلصم، مش بتقولوا هي حبيبتكم وبتديكم مليار في السنة؟ وعايزه تعمل لكم دوله مستقلة زي الأكراد، نطلع إحنا منها؟<br />وعود ماما أمريكا ما وراها غير الخراب، شوفوا العراق، أو شوفوا مصر ذاتها، كنا فين وبقينا إيه من يوم أمريكا ما جت.<br />نارنا بينا وبين بعض ولاجنتهم، وشكرا."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170631/http://masr.20at.com:80/article.php?sid=536"

