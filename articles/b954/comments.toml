[[comments]]
order = 21
subject = "بلاش الوهم"
author = "جرجس المصرى"
posted = "2006-06-22"
text = "اى واحد مسلم هنا شوف عمل ايه لما كاتب سخر من الرسول وعمل رسوم مسيئه ليه وانتم كلكم ثورتوا وعملتوا همايل كتير ومظاهرات ولما حد يتعرض للدين المسيحى تقولوا لا مفروض يعرضوا الفيلم طيب كويس جدااا ومفروض برضه يعرضوا الصور المسيئه للرسول ولا حلال عليكم وحرام على غيركم؟ بلاش تعصب اعمى وحقد وربنا يرحمنا من المتعصبي اللى مثل بعضكم ولازم تبصوا للموضوع منك كل الجهات مش يبقى نبيكم يتعمل عليه رسومات وتزعلوا وانياء الديانات الاخرى حلال عليهم انهم يتشتموا وعشان تعرفوا ان الغرب اساسا معندوش فرق بين محمد او المسيح كله واحد وعشان متزعلوش اوىى وتقول ان الغرب مضهد المسلمين اهو كمان مضطهد المسيحيه ياريت تفوقوا من التعصب الاعمى اللى بياكل فيكم وبلاش تفتكروا انكم احسن ناس على وجه الارض وباش وهمكم ده يا مسلمين"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170631/http://masr.20at.com:80/article.php?sid=536"

[[comments]]
order = 22
subject = "مصرية مقيمة بدبي"
author = "ايمان"
posted = "2006-06-23"
text = "بصراحة انا مشوفتش الفيلم بس ليه راى ان الاعلام ليه دور اساسي فى التأثير على الناس بغض النظر ايمانه ضعيف ولا قوى. انا بصراحة مع الاخ اللى قال اشمعنى لما اساءوا لرسولنا الحبيب الدنيا قامت ومقعدتش لكن لما فليم زى دا يتمنع نعترض !"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170631/http://masr.20at.com:80/article.php?sid=536"

[[comments]]
order = 23
subject = "جرجس إيمان مصري مقيم خنثى"
author = "كاشف النصابين"
posted = "2006-06-23"
text = "عايز إيه يابو قريف؟<br />خليك راجل مرة في عمرك، وإتثبت على مبدأ مهما كان، مرة جرجس المصري ومرة مصرية مقيمة، ياشاطر ياحذق يا مهندس كومبي يوطر، مفيش مسيحي في العالم يمكن يقول عن محمد (صلعم) رسول، والمسيح عند كل المسيحين إله وإبن إله، وهما قدامك وإسألهم. وإتعلم من فضلك حبك الأدوار ودراستها قبل الظهور على المسرح هنا، فيه كلام لايقوله إلا مسيحي، وكلامك كلام مسلم منحل يا مصري مقيم. وإلا إنت خنثى؟ قال جرجس قال...<br />صدقم والله حمار!"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170631/http://masr.20at.com:80/article.php?sid=536"

[[comments]]
order = 24
subject = "خلاص بقى"
author = "عبد الله الحداد"
posted = "2006-06-24"
text = "فيه حساسيه طائفيه جامده جدا بين المسلمين و الاقباط و اقل مشكله او كلمه ممكن تولع الدنيا<br />مفيش حد يقدر ينكر ان فيه مسلمين متطرفين لكن المتطرفين فى المسيحيه اغلبيه و ده بيتأكد كل يوم<br />بدليل ان شتايم الاقباط فى سيد الخلق سيدنا محمد عليه الصلاه و السلام أفظع و اخر قله ادب ولكن المسلم مايقدرش يشتم المسيح بن مريم عليه السلام لانه مؤمن بيه كرسول وبعدين عاملين مشكله على فيلم مع ان فيه افلام كتير ممكن تلاقى ممثل بيقول انا الرب زى \"بروس اولميتى\" وعادى ولا علشان الفيلم ده جه على جرح ان سيدنا عيسى عليه السلام كان بشر"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170631/http://masr.20at.com:80/article.php?sid=536"

[[comments]]
