text = "السلام عليكم<br />يعني بجد فالحين اوي الحكومة ,, و فاكرين ان كدة بيقدروا يمنعوه مهو مليان عالنت و اي حد عنده دي اس ال ممكن سنزله بكل سهولة و ثانيا بدل ما احنا فالحين نمنع و نرفض بلا خيبة نروح نعمل حاجة عليها القيمة اسمها فيلم مش اللي بيعرضوه في السينمات ده و يسموه أفلام أصلا مفيش اي عمل مصري يستاهل يتقال عليه فيلم لانه كله مسخرة و قصص مكررة , و يا ريت بلاش دوشة ...."
