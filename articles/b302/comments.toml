text = "الى الاخ العزيز عبد المنعم يااخى الفاضل احبك فى الله واحب كل مسلم يدافع عن دينه يااخى العزيز والله تغمرنى سعاده لاتوصف عندما اجد رجل اوفتاه محترمه يغارون على دينهم ويغضبون لما يرونه من معاصى مثل هاله تلفان وللعلم انا لااكتب اسمها خطأ بل هو المفرود ان يطلق عليها هذا الاسم (هاله تلفان) بدلا من سرحان لانها تتلف اخلاق الناس 0000 ومره اخرى تحيه طيبه للاخ المحترم/عبدالمنعم شومان"
