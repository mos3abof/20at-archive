[[comments]]
order = 44
subject = "خاسئوووووووووووووون"
author = "maya"
posted = "2006-11-02"
text = "انا قريت كل ارائكم عن الدكتورة هاله سرحان ووجدت ان كل تعليقاتكم عنها ما هي الا دليل واحد علي نجاحها ونجاح برامجها الجريئه الهادفه<br />انتم بشر كيف تسمحون لانفسكم ان تحاكموا بشرا مثلكم هل نسيتم الله رب العباد الذي يغفر لمن يشاء ويعز من يشاء ويزل من يشاء<br />اذا اردنا ان نعترض علي البرنامج من حقكوا بس يكون نقض مشروووع وليش انتهاك لحريات الاخريين<br />بسم الله الرحمن الرحيم<br />يا ايها الذين امنوا لا يسخر قوم من قوم عسي ان يكونو خيرا منهم ولا نساء من نساء عسي انا يكن خيرا منهن<br />صدق الله العظيم<br />اذا دعتك قدرتك علي ظلم الناس فتذكر قدره الله عليك<br />فكيف تلقون بالعبارات الخارجه الجارحه علي البشر<br />حراااام<br />فكروا في شئ اعمق من كده<br />فكروا فيما يحدث لنبينا وما يحدث لديننا<br />فكروا بما يحدث في فلسطين والعراق<br />فكرووافي مصالحه انفسكم اولا<br />فكرووووا في الاخرة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"
