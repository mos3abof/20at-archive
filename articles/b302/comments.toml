[[comments]]
order = 34
subject = "شكرا لله وحده"
author = "عبالمنعم شومان"
posted = "2006-10-14"
text = "الحمد لله وحدة ولا نبي بعد سينا محمد رسول الله.. الحمد الله الذي جمعني بالاخ الفاضل مروان .. والاخت الفاضلة عاشقة الورود..علي كلمة واحدة وهي كلمة التوحيدفنحن الان في زمن لايعلمه إلا الله وحدةفكل واد منا غي قطعة مب بقاع الارض بعدا ان القياة السياسية في الدول العربية منحدين .. اين زمن عبالناصر الذي كان يجمع العرب ( الحكام العرب) في اجتماعات القمة العادية والغير عادية ولن يتخلف احد منهم عن هذة الاجتماعات اين نحن اليوم من حكامنا الذين همهم بطونهم وقبلتهم نساؤهم..نحن في زمن منحل تماما وانعدمت القيم والاخلاق.. مثلما تفعل هاله هانم تلفان المرأة المتصابيةالمنحلة لعنة الله عليها وعلى امثالهل..اللم الطف بنا جميعامما جرت به المقادير إنك علي كل شئ قدير .. واشكرك باخي الحبيب مروان وأشكرك يااختنا الغالية عاشقة الورود.. واشكر الظروف التي جمعتنا سويا .. فالى الامام والله يوفقنا جميا .. وشكرا لكل انسان شريف في وطننا العربي والسلام عليكم ورحمة الله وبركاته."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 35
subject = "الى سمو الامير"
author = "مروان"
posted = "2006-10-16"
text = "الى سمو الامير الوليد بن طلال دخلنا الى احدى المواقع التى انفردت بسرد السيره الذاتيه لسموكم وعلمنا ان سموك من اغنى اغنياء العالم فقلنا ربنا يزيدك وتمنينا من الله عز وجل ان تنفق اموالك فيما يرضى الله ورسوله لا ان تاتى لنا بامراة لاتعرف الله ولاشيء عن دينها ووضعتها لنا على قنواتك الروتانيه هذه القنوات التى تتسابق فى اظهار الفواحش ماظهر منها وما بطن وتركز دائما على عرض الافلام المثيره التى تخجل العين ان تراهاومما زاد الطين بله جئتم بزهرة الفواحش الا وهى السيده هاله تلفان التى تتفنن فى الاسهزاء بالدين الحنيف واستضافة اهل الفسق والضلال ماعدا علمائنا الاجلاء الذين بوماضع السخريه والتهكم من المذيعه المتالقه فى غضب الله المتامركه هاله تلفان وبمناسبة ذكر امريكا رضى الله عنها علمنا من نفس المصدر بان سموكم ذهبت للتبرع لعمدة واشنطن ب10ملايين دولار بعد الحدثه التى وقعت فى 11 سبتمبر ولم يقبل منك التبرع اثر ضرب ابراج التجاره العالميه فى امريكا والله نود ان نشكرك على مناصرتك للاخوه الامريكان فى محنتهم وربنا يكثر من امثالك هنيئا للامه الاسلاميه بك ياناصر دين الله وهنيئا لك بالسيده هاله تلفان نشكرك يامن تقيم على اطهر اراض الدنيا الارض التى بها الحبيب محمد صلى الله عليه وسلم يافرحة سيدنا محمد بيك ياسمو الامير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 36
subject = "اكبر شرموطه على وجه الارض"
author = "أبو أصاله"
posted = "2006-10-16"
text = "هاله سرحان اكبر شرموطه على وجه الارض<br />هي اصلا ما تسوى كذا الا علشان تدور واحد ينيكها ويكيفها<br />وانا جاهز لهذه المهمه<br />وهذا رقم جوالي علشان تتصل عليه هاله واوريها الشغل المضبوط<br />0501626689<br />مفتاح الدوله السعوديه 009662<br />انا انتظر اتصالك يا هاله يا شرموطه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 37
subject = "اللهم اغفر لنل ولها"
author = "البلبل الأسير"
posted = "2006-10-17"
text = "يا جماعه ما يصح انو نحن نشتم ونسب فى (هاله سرحان)بهذا المنظر نحن ما بيدنا شىء نعمله غير انو ندعى لها بالهدايه ونقول اللهم اهدها واغفر لنا ولها اللهم ماامين وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 38
subject = "إلى الامير الوليد بن طلال"
author = "عبدالمنعم شومان"
posted = "2006-10-20"
text = "الحمد لله ربن العالمين والصلاة والسلام على أشرف المرسلين سيدنا محمد عليه أفضل الصلاوات والتسليم... أما آن الآوان لتتخذ موقفا حاسما لانقاذ المسلمين من البرامج السئة التي تبثها قنواتك الفضائية برعايه الاعلامية المنحلة معدومة الشرق والضمير هالة سرحان.. أما آن الاوان لتغار علي دينك الاسلامي مما تبثة قنواتك الفضائية من بث الرزليةوالانحطاط...فلقا ناشدناك كثيرا بطرة المفسة في الارض هاله سرحان انها تفسد الارض بعد إصلاحها...نسأل الله لك بالهداية والرجوعالى صوابك ... فالهادي هو الله سبحانه وتعالي."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 39
subject = "الى امير روتانا الهلاليه السرحانيه"
author = "مروان"
posted = "2006-10-20"
text = "اتق الله ياسموالامير فيما تقدمه انت وهاله تلفان يكفيك الفنادق التى تملكها حول العالم والاسثمارات المنتشره فى جميع بلدان العالم واموالك التى لاتعد لن تكون اغنى من قارون الذى خسف الله سبحانه به وبامواله الارض نحن لانحسدك ولكن ياريت ياسمو الامير تراجع نفسك وتعلم ان الدنيا زائله حتى امريكا رضى الله عنها ستزول وتوفى يومئذ كل نفس بما عملت ياسمو الامير اخلو الى نفسك ساعه وتذكر الله وعقابه المؤلم يارجل نستحلفك بالله وبكرامة النبى محمد صلى الله عليه وسلم ان تمنع هذه المراه التى لاتخاف الله هاله سرحان وان توجه اوامرك للاخوه الذين يديرون قنوات روتانا بان يستحوا من الله شويه والاقلال من عرض الافلام المثيره والاغانى الجنسيه التى تعرض على قنواتكم 000لو قالوا ان مالك هذه القنوات ملياردير امريكى اوفرنسى او المانى اوبريطانى كنا سكتنا 00لكن المصيبه ان المالك رجل مسلم ويقيم على اطهر بقعه فى الارض وينطق بالشهادتين لااله الا الله محمد رسول الله ارجو ان تتذكرها دائما00"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 40
subject = "شريف يتكلم عن هالة سرحان"
author = "شريف"
posted = "2006-10-21"
text = "بسم الله الرحمن الرحيم بخصوص الهجوم على هالة سرحان فهى امراءة صريحة وتتكلم فى مواضيع مغلق عليها فى مجتمعاتنا العربية وهى تتكلم بحرية فى مجتمع لا يعرف الحرية وازا كانت غير مرغوب فيها للجمهور ما شهدها ولو فى انسان مش عاجبة طريقتها مايتفرجش عليها لانها مبترغمش حد انة يشوفها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 41
subject = "اتقوا اللة فيما بينكم"
author = "شريف"
posted = "2006-10-21"
text = "بسم الله الرحمن الرحيم.وبعدلكل انسان ينتقد هالة سرحان<br />اتقوا الله يجعل لكم مخرجا اتشطروا على الكليبات الاول ايها المنافقون ودع الخلق للخالق"
archived = "2006-11-02"
