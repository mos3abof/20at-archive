[[comments]]
order = 21
subject = "هاله سرحان والجنس"
author = "ع.م.م.شومان"
posted = "2006-10-07"
text = "اناشد الوليد بن طلال بضرورة طرد الساقطة هالة سرحان من قنوات روتانا لخروجها المعتاد عن الزوق العامواحترام مشاعر المسلمين في الشهر الفضيل ... ان مسئوليتك امام الله كبيرة ان لم تتخذ موقفا حاسما من تلك المهانرات.. استحلفك بالله ان تتخذ موقفا شجاعا لطردها كما فعلت صفاء ابو السعود وكذلك المسئولين عن قنوات دريم ..اللهم مإن بلغن اللهم فأشهد"
