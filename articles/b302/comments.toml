subject = "مديع دون مستوى"
author = "عاشقة ورود"
posted = "2006-09-28"
text = "السلام عليكم ورحمة الله تعالى وبركاته<br />بشكر كاتب محمود حامد على موضوعيته في طرح هدا نقد<br />بانسبة لهالة سرحان هي مديع لكن لاتحترم مهنتها تبالغ في كل شيء<br />ملاحظ انها تسعى لتشويه صورة مصر من خلال مواضيع التي تطرحها<br />للعلم انا لست مصرية<br />لكن من متتبعين لtv<br />رمضان كريم"
