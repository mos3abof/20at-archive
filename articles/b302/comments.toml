subject = "هاله سرحان والعفن الفني"
author = "شـــــــــومان"
posted = "2006-10-06"
text = "امان آن الاوان لتكفي عن برامجك العفنة القذرة التي فاح رائحتا انتنةالتي ازكمتنا جميعا اين انتي من الاسلام والمسلمين توبي الى الله يجعل لك مخرجااهيب بالمسئولين على قنوات روتاناالفضائة ان يتخذوا موقفا منها مثلما حدث معها علي قناة A R T بقرار جرئ بفصلها من القناة وجازاكم اللع عنا خيرا ... ارجوكم ارحمونا منها ومن سفالتها"
archived = "2006-11-02"
