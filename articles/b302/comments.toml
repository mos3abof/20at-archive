subject = "تحذير"
author = "شادى"
posted = "2006-09-14"
text = "هاله هذه قذره وما عندها حياء من الله ولا من الناس وان لم تتب فانى احذرها بقول الله عز وجل (ان الذين يحبون ان تشيع الفاحشة فى الذين امنوا لهم عذاب اليم فى الدنيا والاخره والله يعلم وانتم لا تعلمون) ولابد انها تذوق من هذا العذاب الان فى الدنيا قبل الاخره لانها لاشك تشيع الفاحشه باسئلتها العفنه فى الوسط الفنى العفن لا ادرى اليس لها بنات او بنين يسمعون هذا الكلام الا تخاف عليهم من الفتنه اسال الله ان يهدينا ويهديها الى الطريق المستقيم هى ومن يسمعها ويشجعها على ذلك امين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

