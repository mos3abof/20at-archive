posted = "2006-09-28"
text = "تحية من قلب لكل اخوان محترمين<br />الي بكتب كلام فاحش بعبر عن محيط عيشو<br />بنسبة للاخ مروان وباقي اخوة محترمين ردودكم جميل كتير تدل على مدى سمو اخلاقكم وغيرتكم على اسلام الله يكتر في امتالكم<br />رمضان كريم<br />عاشقة ورود"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 11
subject = "رد على رساله"
author = "مروان"
posted = "2006-09-28"
text = "بسم الله الرحمن الرحيم الى الاخت الفاضله عاشقة الورود اولا لقد وصفتى نفسك بصفة جميله ورقيقه تدل على رقة احساسك وكرم اخلاقك واتمنى من اى صديق او صديقه يغار على وطنه ودينه ان نتبادل الكلمات المحترمه لنرتقى بافكارناونناقش قضايانا وليس التفاهات التى نكتبها مضيعة للوقت ةلاتاتى علينا بفائده الا انحطاط اخلاقنا وغضب المولى علينا سبحانه وتعالى 00ومره اخرى للاخت المحترمه عاشقة الورود اقول لها اكثر الله من امثالك صدقينى لو قلت لك اننى اتحاور على النت منذ سنين وقلما اجد انسان او انسانه محترمه والله لقد فرحت بكى واسمحى لى ليس هذا غزلا ولكن احترام من اخ لاخته والله على مااقول وكيل وربنا يوفقك ودائما نقرأ كلامك الطيب والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

