[[comments]]
order = 30
subject = "الى الاخت عاشقة الورود"
author = "عبالمنعم شومان"
posted = "2006-10-11"
text = "اشركرك يااختنا العزيزة على تعلقاتك وانا أعرف جيدا ان الوليد بن طلال لايهمه الا المال والكفن يااختانا العزيزة ليس له جيوب هل سيأخذ الامةال معه..لاياخد الاعمله فقط كلما نفوله اللهم اهديه وأرجعة الى رشدة الدنيا فانيه.واهدي هاله سرحان..الانسان يخاطب ابناؤة بعد مماته ويقول لهم ياابنائي ويا اهلي وخلاني لقد جمعت المال من حله وحرامة وتركته لكم ولم يسال احد عنه الا انا وحدي فسوف يسال الله الوليد بن طلال وكل انسان عن امواله الةي جمعها ...اشكرك اختي الفاضله واستاذنك باضافت الاميل الخاصل بك عندي وجزاكي الله كل خير والسلام عليكم ورحمة الله وبركاته ورمضان كريم.."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 31
subject = "إلى DOAA"
author = "شومان"
posted = "2006-10-11"
text = "لا اعرف من تكون انت ومن اي الاجناس امنت أذكر ام انثى.. وايش تكون انت لتتدافع عن هالة تافان كما سماها الاخ العزيز مروان اعتقد انك من الجنس الثالث..فلو كنت انسان او انسانة محترمة ماكنت دافعت هاله تلفان وبرامجها الفاسدة ياخي او باختي اتو الله يجعل لكم مخرجا وكفانا دفاعا عن الباطل..وعن الفسق والفجور .. بالامس فقط اخذت احمد القا بالقبلات والاحضان ايليق هذا في الشهر الفضيل ولا انت مالك ومال الشهر الفضيل مش فارقة معاك.اللهم اريحنامنك ومن امثالك ."
archived = "2006-11-02"
