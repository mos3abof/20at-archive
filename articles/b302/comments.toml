[[comments]]
order = 14
subject = "مع هاله سرحان"
author = "DOAA"
posted = "2006-10-01"
text = "كفاية قلت اداب والفاظ مش كويسه على من الزملاء على هاله سرحان خصوصا انهم بهجموها علشان الاخلاء وهما فين القهم وهما بيقولوا الفاظ بشعة ذى ديه ويكلموا عليها بالطريقة الوحشة ديه هاله سرحان احسن واشرف منكم كلكم و على فكرة لو مشعجبكم البرنامج ومش عجباكوا هاله ما تتفرجوش اصلا ما حدش بيجبلكوا القناة بالعافية وواو بمعنى اصح جماهيرية وثقافة وحب الناس لهاله مش هيقف عليكوا وياريت بقى تحتفظوا برايكم لنفسكم أو طالما انتوا اخلاء قوى كده الغوا الدش اصلا ولا ايه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 15
subject = "الى DOOA"
author = "مروان"
posted = "2006-10-01"
text = "الى الذى يصف نفسه بالاسم الاجنبىDOOA لانعرف اذا كنت او كنتى بنت او ولد فى الحالتين لايشرفنا معرفتك اولا لابد انك من الماجورين او المنافقين فنحن الان فى زمن النفاق وردا على كلامك بخصوص الدش ان نمنعه من البيوت اذكر خمسة بيوت بالوطن العربى ليس بهم دش وليس معنى ان اركب عندى ستالايت او دش ان تفرضوا علينا انسانه معدومة الضمير والاخلاق من باب اولى ان اوجه الدش الى الاقمار الاباحيه ولكن اخبرت اسرتى بان هذا القمر عربى وبرامجه عربيه اتعلم او تعلمين ان العربيه هى التى نزل بها القران الكريم لذلك اترك اهلى يقلبون فى قنواته بلا حرج حتى قنوات الاغانى الخليعه لانراها ويشاهدون من ضمن القنوات قناة روتانا الفاسده ووجدت ابنى كلما يقول كلمه يصفق ويهلل مثل هاله تلفان وعندما اغلقت التلفزيون امامه بكى وقال انت مش بتقول ان دى قنوات عربيه محترمه صدقنى ياصاحب او ياصاحبة الاسم الاجنبى اننى اخجل عندما اشاهد هذه المراة العجوز التى تحاول ان تعيش فى دور الشباب الذى لايليق بها ولا بسنها وتقول ان هاله تلفان احسن منكم كلكم صدقنى نتنمنى ان تكون احسن منا كلنا ولكن فى الخير وان تكون قدوه محترمه للشباب بدلا من السفه وقلة الادب التى تقدمه للناس (اتقوا الله) 0000000 وبالمناسبه اقدم خالص شكرى واحترامى للاخت الفاضله عاشقة الورود من المغرب الشقيق 000000000 وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 16
subject = "هالة سرحان ليست مديعة"
author = "عاشقة الورود"
posted = "2006-10-02"
text = "كفاية قلت اداب والفاظ مش كويسه على من الزملاء على هاله سرحان خصوصا انهم بهجموها علشان الاخلاء وهما فين القهم وهما بيقولوا الفاظ بشعة ذى ديه ويكلموا عليها بالطريقة الوحشة ديه هاله سرحان احسن واشرف منكم كلكم و على فكرة لو مشعجبكم البرنامج ومش عجباكوا هاله ما تتفرجوش اصلا ما حدش بيجبلكوا القناة بالعافية وواو بمعنى اصح جماهيرية وثقافة وحب الناس لهاله مش هيقف عليكوا وياريت بقى تحتفظوا برايكم لنفسكم أو طالما انتوا اخلاء قوى كده الغوا الدش اصلا ولا ايه<br />مع اسف كلام الي قلتيه في هالة سرحان قليه في مكان تاني دافعي على اسلام ومسلمين انصري حبيب محمد صلى الله عليه وسلم احسن من اني ادافع على وحدة لاتمت اي صلة بالاسلام<br />نحن كمسلمين لازم نتكلم في شيء نافع<br />ادى دافعت على شخص لازم يكون يستحق<br />هالة سرحان مديعة دون مستوى .ضحكاتها متعالية سخرية مستمرة من ضيوفها خصوصا شيوخ دين حرام عليها في حقيقة ماتقدر توصل لمرتبتهم مشرفة<br />وفي اخير تحية لكل اخوة محترمين وبالخصوص اخ مروان كل سنة ونت طيب<br />عاشقة الورود"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

