subject = "سفالات هاله سرحان"
author = "شومان"
posted = "2006-10-06"
text = "ماهذا الذي نشاهدة في الشهر الفضيل والعام باكمله شروج عن الادب والحياء كل انسان غيور علي دينه لايريد ان يري هاله سرحان صاحبة البؤامج الخارجة على حدود الادب ... ايردى ذلك الامير الوليد بن طلال ارجو من سموكم اتخاذ موقف حاسم منهرحمة بديننا واولادنا والامة الاسلامية جمعاء وجازاكم الله خيرا والسلامعليكم ورحمة الله وبركاته.. شومان"
