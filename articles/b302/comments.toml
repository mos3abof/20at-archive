[[comments]]
order = 32
subject = "الى الاخوه العرب"
author = "مروان"
posted = "2006-10-11"
text = "شكرا لهاله تلفان التى جمعت بعض الاخوه العرب على مشكله واحده وهى تحررها الزائد واستهانتها بدينها وشعوبهااشكر الاخ عبدالمنعم شومان والاخت عاشقة الورود لاننا بدءنا نجتمع على راى واحد واخص بالشكر ادارة هذا الموقع التى اتاحت لنا ان نعبر عن ارائنا بحريه فياريت نجتمع دائما على مايرضى الله سبحانه وتعالى والله انا سعيد بتلقينا على شيئ فيه ارضاء لله عز وجل وياريت نكون يد واحده دائما بعد مافرقتنا القيادات السياسيه نتحد من خلال شبكة الانترنت ولعل الله يوحدنا على تطهير امتنا التى قال فيها المولى سبحانه(كنتم خير امة اخرجت للناس تامرون بالمعروف وتنهون عن المنكر) صدق الله العظيم شكرا للاخ عبد المنعم وللاخت عاشقة الورود وياريت يكون لدينا اصدقاء اكثر ممن يخافون الله تبارك وتعالى ويحرصون على تطهير هذه الامه العظيمه من الخونه والعملاء 0000 والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

