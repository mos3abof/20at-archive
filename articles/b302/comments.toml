capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 22
subject = "اتقي الله ياهاله سرحان"
author = "عبدالمنعم شومان"
posted = "2006-10-07"
text = "بيسم الله الرحمن الرحيم الى الساده العاملين فى المحطات الفضائيه ويحملون الديانه مسلم نرجوا ان يكون اسم على مسمى وليس مسلم بالاسم فقط نرجوا من اى رجل مسلم غيور على دينه ان يسكت هذه المراة الفاجره التى تسمى هاله تلفان هذه المراه التى تامرك الدين وتجعله على الطريقه الامريكيه التى تستخف بالدين وتجعله على احدث الطرق الامريكيه هذه المراه التى يدفع لها ببذخ لكى تضل شباب الامه اكثر مما هو فيه اريد ان اعرف صاحب هذه القنوات الروتانيه الجنسيه الذى لايخشى الله وعلى حد علمى ان اصحاب هذه القنوات من السعوديه بلد الحبيب محمد صلى الله عليه وسلم يارجل الاتغار على دينك ان هذه المراه تعمل فى هذه القنوات زاعمة التحضر والنهوض باالامه كذب والله كذب اليست هى التى استضافت بعض الصحفيين الماجورين واخذت تندد بمقاطعة الدنمارك التى سبت المصطفى وجعلت الدنمارك صاحبة فضل على العرب فى الغذاء والدواء انا اريد ان اعرف هذه المراه تدين باى دين مستحيل ان تكون مسلمه اليست هىالتى تستضيف علماء المسلمين وتحاول ان تستهزء بهم وتجعلهم موضع سخرية الناس ياهاله تلفان اتق الله وعلمى ان الدنيا فانيه وانك راجعة الى الله تبارك وتعالى لن تنفعك قناة روتانا ولا اصحابها ولا امريكا وللعلم ياهاله تلفان ان هذا الكلام ليس من قناه اخرى منافسه لانكم جميعا اوساخ الفضائيات التى دمرت وتدمر الشباب كل يوم اتق الله ايها العجوز المتصابيه احترمى سنك على الاقل فانت لست صغيره واحتشمى فى لبسك واستضيفى ناس يخشون الله فكل المواضيع التى تتحدثون فيها فرعيه جدا ولاتمس هموم الامه تحدثى فى شيئ يحفذ الهمم يقرب الشباب الى الدين اتق الله فانت ممن ينطبق عليكى قول الحق سبحانه (والذين يعيثون فى الارض فسادا) اكملى الايه ان كنت تعرفيها واعلمى ماجزاء المفسدين واقول للانسان الغير محترم اطرد هذه المراه من القناه ان كنت تخاف على دينك ارحموا من فى الارض يرحمكم من فى السماء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 23
subject = "الى الاخ عبدالمنعم شومان"
author = "مروان"
posted = "2006-10-08"
text = "للاخ المحترم عبدالمنعم شومان لقد كنت اطالع الصفحه من اولها واعجبت بكلامك وعندما نزلت الى اسفل الصفحه وجدت مقاله قديمه كنت ارسلتها للموقع ووجدت عليها اسمك فهل يصح هذا يااخ عبد المنعم ان تكتب اسمك على ماليس من حقك عموما كلنا نتكلم فى قضيه واحده ولكن من الافضل ان تضع اسمك انت وللعلم ان حديثك لايقل جمالا عما نكتبه بل ربما يكون الافضل وربنا يخلصنا من (هاله تلفان) وتحيه خاصه للاخت الفاضله (عاشقة الورود)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 24
subject = "تعليق على ردود السابقة"
author = "عاشقة الورود"
posted = "2006-10-09"
text = "سلام عليكم ورحمة الله تعالى وبركاته<br />اريد تعليق على اخ شومان انا متفق معك في ناحية انحطاط قنوات روتانا امير وليد بن طلال هدفه والوحيد ربح اموال سواء من خلال sms او رنات اغاني او عائدات فيدو كليب يعني انه انسان مادي لايهمه الى نفسه<br />اما هالة سرحان هي مديع دون مستوى تتقمس اضوار شباب عمرها يناهز 60 وعمل نيولك<br />في اخير تحياتي لكل اخوة وخصوصا اخ مروان اتمنى ان اتواصل معك على امسن<br />ihsase2020@hotmail.com<br />رمضان كريم على كل موجودين كل سنة وانتم طيبون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
order = 25
subject = "الي الاخ الحبيب مروان"
author = "عبدالمنعم شومان"
posted = "2006-10-09"
text = "اشكرك ياأخ مروان علي ماكتبته فكلنا غيورين على الاسلام والمسلمين ...وربنا يخلصنا من هاله سرحان وامثالها انهم جميعا مفسدون في الارض.. وخوفنا وحرصنا على ديننا الحنيف يجعلنا جميعا نتحد علي كلمة واحدة انه لا إله إلا الله محمد رسول الله ... اللهم إهدي كل عاصي واهدي هالة سرحان وامثالها.. فإن كان كتب في علمك انها لم تهدتدي هي وامثالها فخذهم أخذ عزيز مقتدر كي يريحوا ويرحنا منهم ومن فسادهم انك علي كل شئ قدير آمين يارب العالمين..ومازلت اناشد الوليد بن طلال بضرورة اتخاذ موقف حاسم منها.. إن مسئوليتك امام الله كبيرة.. اللهم اني قد بلغت اللم فاشهد."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

[[comments]]
