[[comments]]
order = 5
subject = "الى وزيرى الثقافه والاعلام"
author = "مروان"
posted = "2006-09-19"
text = "الى الساده الوزراء المسئولين عن الثقافه والاعلام المصرى لقد شوهتم صورة مصر ارض الاسلام والامان كما قال المولى سبحانه وتعالى 0000 لان غالبية الامه العربيه الاشقاء صور لهم اعلامكم المحترم ان مصر بها الزنا وبها السرقه والاغتصاب والمخدرات هذا هو الذى تركز عليه افلامكم ومسلسلاتكم هذه الايام وللاسف معظم شباب الامه العربيه يصدقون مايشاهدوه حتى اذا نزل احد الاخوه العرب لزيارة مصر يضع لنفسه برنامج لزيارة مايراه على الشاشات الفاسده ويصور له خياله للاسف ان مصر كلها كما يراها اسئل الساده الوزراء ومن المفرود انهم مسلمون انتجتم كم فيلما منذ 30 عاما يوضح صورة الاسلام يتحدث عن مشاكل الامه وهمومها ايها الاخوه العرب هذا الكلام من اخ صادق يخاف الله صدقونى ان مصر ليست بهذه الصوره السيئه كما تصورها انما للاسف ان الاعلام دائما يظهر الفئه الضاله التى لاتعرف الحرام والحلال ويسلط عليهم الاضواء الا وهم الفنانين الذين لا يخشون الله تجد الرجل منهم يحضن امراة صديق له فى فيلم والاخر على العكس فى فيلم اخر هؤلاء الذين يظهرون صورة مصر هؤلاء الذين يسمونهم فنانين هؤلاء الذين يحضنون ويقبلون ماحرم الله عليهم من علية القوم المثقفين المتحضرين اما نحن فمتخلفين رجعيين ايهاالاشقاء العرب ان%99 من شعب مصر ناس طيبين مسالمين يخافون الله يعرفون العيب يعرفون الاصول ومنهم لله الذين يشوهون صورة مصر وحسبى الله ونعم الوكيل"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

