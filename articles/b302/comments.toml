[[comments]]
order = 42
subject = "الى المسمى /شريف"
author = "مروان"
posted = "2006-10-24"
text = "تقول ان اسمك شريف ولكن للاسف لاتعرف معنى الشرف كلمة الشرف معناها كبير جدا ولو تعرفه تماما ماكنت دافعت عن هاله سرحان يامن تنادى بالحريات 00اى حريات التى تتحدث عنها 00هذه المراه استضافت بعض الصحفيين والضيوف الماجورين واخذت تندد بمقاطعة المسلمين للدنمارك التى استهانت بقدر اشرف الخلق سيدنا محمد صلى الله عليه وسلم (هذه حريه) هذه المراة تكلمت فى قضيايا الثار فى صعيدمصر فقال لها رجل لو تركونا نطبق شرع الله لن نتقاتل فقالت له السيده الحره اتريد ان ترجع بنا الى قوانين التخلف (هذه حريه) هذه المراه اخذت تتكلم مع احد علماء الدين عن مسالة الرضاعه فى الاسلام ولم تعطى فرصه للشيخ ان يكمل اجابته وقالت بصوتها المستفز وبضحكاتها العاليه يعتى ممكن ارضع العاملين معى فى الاستوديو(هذه حريه) هذه سخريه من الدين ومن رجاله 00 استضافت واحده من الفنانات الساقطات وقالت لها عاوز اعرف انت بتلبسى ايه لزوجك فى البيت (هذه حريه)وهذا كلام يذاع على الهواء ليدخل بيوت المسلمين (هذه حريه) وكثير كثير من كلامها الذى لايرضى الله ولا المسلمين يااخ شريف قول كلمة حق واجرك على الله (ان الساكت على الحق شيطان اخرس) كل يوم تستضيف فنانين وفنانات ناشئين جدد على الساحه وتتكلم معهم فى اشياء لاتمت الى الامه الاسلاميه بصله (هذه حريه) قول لى ياشريف كم مره ذكرت شيئ عن رسولنا الكريم او عن اصحابه 00طبعا هذا الموضوع ليس باهميه كبيره بالنسبه لك ولها انا اسف00ومن العجيب ان قنوات روتانا العميله عندما ترسل لهم رساله على الشريط الموجود فى اسفل الشاشه وتكتب عليها مثلا بحبك يافلانه كلمينى على رقم كذا 00تجدهم يكرروا الرساله اكثر من عشر مرات على الشاشه 00 وعندما تكتب لااله الا الله لايظهروها على الشاشه 00جرب وشوف بنفسك حتى ترى الحريه على طريقة هاله سرحان"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

