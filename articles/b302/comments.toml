subject = "مفيش احترام خالص للناس .."
author = "kapo el3asheq"
posted = "2006-10-10"
text = "يا جماعه متحاكموش الانسانه دى لانها مننا ولازم نعرف اسباب الضحك دة ايه واسباب الاسئله المخجله دى للفنانين دى ليه .. يمكن تكون عايز تشهر بنفسها ممكن .. او عايزة تكون تعرف حاجات مش من حقها او يمعنى اصح حاجه شخصيه ..<br />ليه انتو بتشتموا بالفاظ سوقيه كدة ليه .. انا من رائى يا جماعه اننا نقول ربنا يهديها ويهدى امثالها .."
