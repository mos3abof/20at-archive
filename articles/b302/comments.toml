text = "أنا الحلوة المتناكة / تهاني بنت محمد حسن آل عطاء عسيري / طالبة<br />بجامعة أم القرى قسم الأدب سيكسية حارة أحب أشعار النيك<br />وأحب النيك من كسي ومن طيزي وهذا رقمي 0507099211<br />وهذا رقم ماما 0568932113 لأن ماما كمان سيكسية مرة<br />وبتحب النيك ومشتاقة لأن بابا متوفي وهذا إيميلي<br />tota-1405@hotmail.com<br />وهذا الإيميل الثاني<br />sosom85@hotmail.com<br />وهذا أيميلي الثالث<br />ereek3@hotmail.com<br />أرجوكم يا شباب ريحوني ولا تتأخروا علي بالاتصال أو الرسايل على الإيميل مع أي صور نيك ممكنة أو رسايل نيك على الجوال وشكرا"
