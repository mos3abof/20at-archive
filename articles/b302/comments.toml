[[comments]]
order = 7
subject = "الى ادارة الموقع"
author = "مروان"
posted = "2006-09-21"
text = "ايها الساده العاملين على هذا الموقع كيف تسمحون للسفله ان يكتبوا هذا الكلام الجارح المهين الذى نراه على صفحاتكم كن نظن فى موقعكم كل الخير فهو متنفس لكل ذى هم وضيق ان يقول كلمته ويدلى برايه بادب واحترام ولكن للاسف اصبحنا نجد كلامنا فى نفس الصفحه التى يكتب فيها كلام وسخ اين رقابة الموقع ياساده كيف تسمحون بنشر هذا الكلام المؤلم ام انكم اصبحتم مثل باقى المواقع التافهه على النت ياساده نامل ان يظل موقعكم برونقه كما عهدناه وان يكون الاحترام سمته الرئيسيه 000والى السافل الذى يكتب هذا الكلام الجارح المهين كيف تسمح لنفسك بكتابة هذا الكلام اذا كنت لاتستحى من الناس اما تستحى من الله اتقبل ان تقرا امك او اختك او قريبة لك هذا الكلام ياناس اتقوا الله (مايلفظ من قول الا عليه رقيب عتيد) اسف اذا كنت اخطات صدق الله العظيم واللوم كل اللوم على ادارة الموقع التى تسمح بنشر هذا الكلام 00ياساده نرجوا منكم كل الرجاء الا تسمحوا بنشر هذا الكلام 00000وشكرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131330/http://www.20at.com/article2.php?sid=302"

