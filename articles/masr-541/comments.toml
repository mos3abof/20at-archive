[[comments]]
order = 4
subject = "غاليه علينا يا مصر"
author = "ايمن امام عبد الحكيم"
posted = "2006-06-21"
text = "السلام عليكم- بأختصار شديد هؤلاء الشرفاء اختاروا الطريق الصعب من اجل مصر هم يعلمون جيدا نتيجه الوطنيه ادعوا لهم - اللهم هؤلاء خيارنا يظلمون لانهم قالو قوله حق عند امام جائر اللهم انزل بأسك بمن ظلمهم اللهم انزل الهدايه على من سيحاكمهم اللهم بصر القاضى بالحق اللهم لاترسل لهم قاضى كقضاه دنشواى"
archived = "2006-06-21"
capture_url = "https://web.archive.org/web/20060621141538/http://masr.20at.com:80/article.php?sid=541"

