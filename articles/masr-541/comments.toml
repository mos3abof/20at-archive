text = "والله كل مرة الواحد بيفقد الامل فى البلد دى بيلاقى صورة مشرقة وبصيص من نور ولو كان حتى بسيط بس بيساعده يقابل يوم جديد بامل جديد..يزداد احترامى لك يا استاذ وائل كل يوم"
