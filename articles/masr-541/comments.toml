[[comments]]
order = 7
subject = "إلي الجحيم يا مبارك"
author = "أمير"
posted = "2006-06-23"
text = "إلي وائل و تاج و هدي و عبد الحكيم ... الله معكم و قلوبنا معكم ...إن شاء الله منصورين .<br />و إلي قضاة مصر العظام بسطويسي و مكي والخضيري و جميع قضاة مصر ( الشرفاء)<br />و إلي أسد مصر الهصورالمستشار زكريا عبد العزيز<br />و إلي سيدة مصر الأولي ( بحق و حقيق مش بالباطل )السيدة نهي الزيني<br />إلي كل هؤلاء أقول أنتم اخر أمل لنا في بحر الفساد الذي تعيشه مصر"
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912174419/http://masr.20at.com:80/article.php?sid=541&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 8
subject = "ايها الجبناء"
author = "محمدعبدالعليم"
posted = "2006-06-23"
text = "الى الصحفيين المنضمين لجوقة المنافقين والمنتفعين والذين اصبحوا مقررين علينا فى القنوات الرسميةمن غير الذين يحاكمون<br />على قول الحق يقول الشاعر<br />يانصف أميين ياأعبدا فى غير ذل مالكم ذكر<br />مهماكثرتم مالكم قيمة مليون صفر قدرها صفر"
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912174419/http://masr.20at.com:80/article.php?sid=541&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "تحية من مصر"
author = "أبو أسامة"
posted = "2006-06-23"
text = "تحيةمن كل مصر لأولاد مصرلاتخشوا شىء الا<br />يكفيكم ان تكون مصر كلها معكم ان صوتكم هو صوت الشعب كله فلا تخشوا قلة قليلة من<br />المنافقين وكلاب الحراسة الذين اصبحوامعروفين على الملأ فقد باعوا اخرتهم بدنياغيرهم ولن يجدوا لهم نصير فى الدنيا او فى الأخرة فقد اعتمدوا على رجل يموت ونسوا ان الله حى لا يموت فاذا مات هذا الرجل فلن يجدوا وراءهم احداماانتم<br />فمعكم مصر كلهاوان ينصركم<br />الله فلا غالب لكم"
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912174419/http://masr.20at.com:80/article.php?sid=541&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "لسه فيه رجالة"
author = "الشرقاوى"
posted = "2006-06-24"
text = "اهى قامت مصر بتقلع توب الذل<br />اهى صحيت مصر يا ناس قدام الكل<br />ربنا معاك يا استاذ وائل"
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912174419/http://masr.20at.com:80/article.php?sid=541&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 11
subject = "لك الله يا مصر"
author = "مصرى دمه محروق"
posted = "2006-06-25"
text = "لك الله يامصر . والله يا شباب مصر دى عظيمه جدا و حنينه جدا بس إحنا الى ضعاف وسمحين لشويه حرميه و بلطجيه بحكم بالبلد لحد امتى هنفضل سكتين . الحرامى والمرتشى يكرم و الشريف و المسكين يقتل هل هذا هو الوهن الذى تحدث عنه الرسول الكريم . لنا الله أرجو من كل من يقرأ هذا أن يحاول تغيير نفسه أولا ويعيد تقييم أوضاعه لأن الله لا يغير ما بقوم حتى يغيروا ما بأنفسهم . ولعل الله يتقبل منا ويزيح عنا الغمه أو على الأقل يوم مايسألنا يوم القيامه نقدر نقول إننا حاولنا أن نغير ما بأنفسنا"
archived = "2006-09-12"
capture_url = "https://web.archive.org/web/20060912174419/http://masr.20at.com:80/article.php?sid=541&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
