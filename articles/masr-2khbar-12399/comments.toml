[[comments]]
order = 1
subject = ""
author = "تقارير مضروبة"
posted = "2009-06-18"
text = "الخارجية الامريكية كتبت التقرير دة عن مصرولم تذكر عدد المشردين ولا النساء الشراميط عندهم ولا اللى بيناموا فى الشوارع هناك والملايين الذين يولدون لاباء غير شرعيين<br />الرئيس كلينتون لا يعرف مين ابوة واتربى تبنى وامة ما تعرفشى مين ابوة<br />امريكا بتنتقد الدول التانية وسايبة البلاوى اللى عندها<br />عندها 3 ملايين طفل مجهول الاب<br />عادل سرحان ————- الحزب الوطنى الديمقراطى المصرى"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620065158/http://www.20at.com:80/masr/2khbar/12399-2009-06-18-07-31-05.html"

[[comments]]
order = 2
subject = ""
author = "مليون طفل كتير"
posted = "2009-06-18"
text = "فين برامج الرعاية الاجتماعية<br />والكلام الكتير عن رعاية الاطفال<br />والسفيرة الوزيرة مشيرة خطاب وغيرها من الكبار اللى بيطلعوا فى التليفزيون ويعملوا اجتماعات ويتم تكريمهم مرة كل اسبوع فى اوروبا<br />لما يبقى فية مليون طفل من مجموع شعب 80 مليون بيشتغلوا فى التسول والدعارة يبقى على مصر السلام<br />مش الاطفال دول هيجندوا فى الجيش والامن المركزى لما يكبروا<br />المليون طفل دول مش هييجى وقت يبقوا عساكر ويقفوا على الحدود<br />احنا رايحين فين<br />اية اللى بيحصل فى البلد دى<br />الفقر<br />الفقر هو اللى بيعمل كدة<br />يبقى فين برامج التنمية<br />كل سنة وانت طيب وغطينى يا صفية وصوتى<br />اخبار تسد النفس<br />يلعن ابوكم ولاد كلب على الصبح"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620065158/http://www.20at.com:80/masr/2khbar/12399-2009-06-18-07-31-05.html"

[[comments]]
order = 3
subject = ""
author = "هذة هى السياحة"
posted = "2009-06-18"
text = "طبعا انتم فاهمين يعنى اية سياحة ؟ زيارة الهرم والقلعة والاثار والمساجد بس ؟<br />ابدا<br />السياحة هى الاسم المؤدب لكلمة دعارة ومسخرة وخمر وسهر وشذوذ جنسى وبلاوى مسيحة<br />العرب ياتون الى مصر للزواج الوقتى يعنى عواجيز الخليج ينزل ويتلقفة السماسرة ويذهبون الى الاسر الفقيرة ويدفع عشرين تلاتين الف جنية ويكتب ورقة كدة زى الجواز العرفى ويقعد يتمتع بالبنت فترة اجازتة ويسيبها ويرجع بلدة<br />وهناك دعارة مستوردة نساء من اوكرانيا وروسيا واسرائيل واثيوبيا ياتون الى الغردقة وشرم الشيخ والفنادق الفخمة فى القاهرة ويتصيدن السائحين وبعد ذلك يعودون الى بلادهم<br />سياحة<br />يا حلاوة على السياحة"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620065158/http://www.20at.com:80/masr/2khbar/12399-2009-06-18-07-31-05.html"

[[comments]]
order = 4
subject = ""
author = "التقرير لمن"
posted = "2009-06-19"
text = "الخارجية الامريكية كتبت التقرير لمن ؟<br />موجة لمن فى بر مصر<br />ومن يجيد القراءة من المسئولين لقرائتة<br />وهل الامن يسمح للمسئولين بقراءة تلك التقارير ليقلب مزاجهم ويخرجهم من المود اللى هم فية<br />كلام فى الهواء<br />زى الكلام اللى بنكتبة دة لا بيودى ولا بيجيب ولا بيحل ولا يصلح اى حاجة<br />اصبحنا زى الايتام فى موائد اللئام<br />من هو ولى امرنا<br />فية احد رد على التقرير دة"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620065158/http://www.20at.com:80/masr/2khbar/12399-2009-06-18-07-31-05.html"
