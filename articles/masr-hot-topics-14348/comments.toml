author = "النوم ثم النوم"
posted = "2009-12-10"
text = "الاجازة للنوم ولو امكن تناول الفطار فى السرير لفعلت<br />اصحو قبيل صلاة الجمعة فاستحم والبس ملابسى واذهب لصلاة الجمعة ومن المسجد مباشرة الى بيت الحاجة امى فاتغدى معها واخرج قبيل العصر الى حى الحسين اقعد فى مقهى هناك اشرب شاى واتعشى فتة ولحمة راس ثم اصلى العشاء فى مسجد سيدنا الحسين واعود لانام لابدا اسبوع جديد من العمل واسبوع صراخ جديد مع مذاكرة الاولاد - ولكن اجازة الجمعة خاصة بى لوحدى بعيدا عن صداع الاسرة"
