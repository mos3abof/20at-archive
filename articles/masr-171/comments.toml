[[comments]]
order = 0
subject = "كنت بدور على قرض"
author = "galal"
posted = "2006-05-27"
text = "انا اصلا كنت داخل على النت بدور على قرض اعمل به مشروع صغير وقبلت موقعقم ده صدفه عن طريق كلمة البحث.وبعد الاطلاع على معظم صفحات الموقع بقيت عامل زى الى خد ميت قلم على سهوه بجد لو الى مكتوب على الموقع ده حقيقى من فساد فى الحكومه يبقه اسافر احسن وخساره فيكو المشروع الى كنت ناوى اعمله وعموما حسبى الله ونعم الوكيل على فكره انا مش بقول كده علشان انا مش وطنى لا والله انا عندى انتماء للبلد دى كبير جدا بس خايف الموضوع يتحول بعد كده لكلام على النت وخلاص"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182823/http://masr.20at.com:80/article.php?sid=171&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "البحث عن العمل"
author = "المشاغب"
posted = "2006-07-24"
text = "والله انا عايز اشتغل وبس كفاية الى بسمعة فى البيت مرة الصبح ومرة اخر النهار وبعدين هما رجال الأعمال صغير كان اوكبير محتاج قروض من البنوك ولا هوة استعجال الرزق وبقولك لو لقيت لى فرصة عمل فى إيطاليا راسلنى مع العلم انى من السهل انى احصل على تأشيرة اهم حاجة فية هناك شغل ولا زى مصر الى هناك قالو كدا والله تعالى اعلم لو عندك حل راسلنى"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182823/http://masr.20at.com:80/article.php?sid=171&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "عايز اعمل حاجه"
author = "احمد"
posted = "2006-09-01"
text = "ياجماعه ارجوكى انا عايز قرض من الروض الاجانبيه دى عشان اان خالص تعبت من الروتين المصرى والارف المصرى نفسى فى كلام صدق حقيقى اقدر اخد قرض واشتغل واتعامل اعيش زاى الناس ومش افكر فى السفر بره مصر يياربت لو تقدرو تساعدونى بيكون شاكر جدا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905182823/http://masr.20at.com:80/article.php?sid=171&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "بطب من ربنا شغل"
author = "نادر عبد العزيز جودة"
posted = "2006-09-18"
text = "انا طالب من سيا دتكم فرصة عمل<br />وطالب من ربنا سبحان وتعالي التوفيق<br />شكرا جدا"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118183220/http://masr.20at.com:80/article.php?sid=171&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
