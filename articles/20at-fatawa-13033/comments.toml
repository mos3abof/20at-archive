text = "اقتباس aramco:<br />انا اعمل في معمل لانتاج الغاز في منطقة صحراوية وعملي يتطلب مني العمل تحت اشعة الشمس ساعاااات طويلة فما حكم الفطر؟<br />أنا أفطرت يوما من رمضان الكريم و أنا بدأت العمل و لا أستطيع أن أتوقف لأنه لو توقفت لخسر العمل و أنا أعمل منذ الساعة السادسة صباحا إلى حد الساعة الرابعة مساءا"
