[[comments]]
order = 8
subject = "اغبى انظمه العالم"
author = "انتم فاكرين ان مبارك هو اللى بيحكم ده كويس انه لسه فاكر اسمه"
posted = "2006-06-14"
text = "بيقولوا وقت تسجيل الحلقه اللى سجلها مع قناه العربيه ان التعليمات ان الاسئله تكون بسيطه وواضحه لاقصى درجه علشان مايتوهش منهم<br />وحتى لوكان هو اللى بيحكم ازاى اللى طلب التنكيل بايمن نور هو اللى ينجيه فيخرج و يهدد المحروس الصغير مبارك جونيور<br />ولما يحكم جيرى ـ قصدى جيمى ـ يبقى يعفى عنه جايز الشعب القرفان منه يفكر يحبه<br />خالص تقديرى للمجاهدين من اجل الحريه مصر المخروسه<br />ااااااااااااااااااااااااه يـــــــا بــــلــــــدى"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614142546/http://masr.20at.com:80/article.php?sid=504"

[[comments]]
order = 9
subject = "اه يا حكومة وسخة"
author = "دلوني علي بتاع الحشيش"
posted = "2006-06-14"
text = "شالوا الدو....جابو شاهين<br />وهشتكنا وبشتكنا ياريس<br />بلدكم هتفضل وسخة طول ما انتم ايدكم ولا مؤخذه في........<br />والا بلاش...خلينا مؤدبين احسن<br />ايه فايدة الكلام الكتير وفردة الصدر من غير ما نشوف تغيير.....<br />هيجي ايمن نور وهيمسكها هو والمدام جميلة...ايه اللي هيتغير في بلدكم الوسخة؟؟؟<br />الحرمية هيتوبوا وهيصلوا في المسجد؟؟<br />الرقاصات هيلبسوا نقاب؟؟<br />يوسف والي والكلب ابن الكلاب بطرس غالي هيتحكموا والشعب هترجعلوا فلوسه وصحته تاني؟؟؟؟<br />هيهات.....مصر اتكتب عليها انها تتسلم من ايد فرعون لأيد فرعون....والفرعون الجديد اي كان اسمه.....برضوا فرعون<br />ناموا في بيوتكم واقعدا ساكتين....وانتي يا ام العيال ...انتي عندك عيال تربيهم...سيبك انتي من الهجص والكلام الفراغ......ودلوني علي بتاع الخشيش"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233403/http://masr.20at.com:80/article.php?sid=504"

