[[comments]]
order = 15
subject = "خواطر المذهول"
author = "المذهول"
posted = "2006-06-22"
text = "ياجماعة الكلام الكثير يستهلك الطاقة اللي إحنا محتاجينها في كنس القرف والوسخ المتلتل.<br />والله عارف إن أم سوزي يهودية وأم جيهان يهودية ومرات بطرس غالي يهودية، ويوسف والي يهود، مش ضد اليهود كديانة أو بشر، لكن دول بيعملوا لصالح إسرائيل بس، وبيخربوا البلد عن سبق إصرار وترصد.<br />فيه عندنا حاجة غير الكلام؟ نقدر أضعف الإيمان ننظم إضراب شامل يومين كل إسبوع؟ علشان حلوفنا يعرف إن الشارع مش طوع حوافره."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211539/http://masr.20at.com:80/article.php?sid=504&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
