[[comments]]
order = 12
subject = "تمام يا دلوني"
author = "المذهول"
posted = "2006-06-14"
text = "عمر شيشتك يابني وقول..<br />عاش الريس المسطول..<br />سعر الصنف بقى معقول.<br />ماركة سوزي يامذهول<br />ماركة حسنية على طول<br />تفتح مخك..... المقفول<br />عليك نور يا دلوني/<br />العنوان سهل مايتوهش تعرف قسم السيدة، تروح هناك وتسأل عن المأمور،الي هو العبد لله، وإحنا في الخدمة، هو الشرطة في خدمة مزاج الشعب؟<br />إخوانا هنا طيبين زيادة عن اللزوم يعنى بلا مواخذه...... عيب دلول زباين القسم برضه، والزبون ملك زي ما أوروبا بيقولم..<br />لانور ولاكلوب هباب حيقدر يعمل حاجة حتى لو كان ناوي، طالما إحنا سلبين كده.<br />والله عيب علينا، بكره الأجيال حتلعنا، وتقول تفوه عليهم خوافين ولابسين طرح، أقول لكم مفيش حد حب مصر زي عبد الناصر، لكن كان لوحده، ريس ومفكر ومراقب مشروعات، وإنتم إكتفيتم بالفرجة وتمام ياريس وإنتم شايفين الغلط.. وبعدين جالنا الي نستاهله مع الكلب المنوفي الأول والثاني، وبقى الشرفا أقلية عندنا، والواحد منهم حتى عياله يقولوله ياقفل، بالذمة مش كده؟<br />يعني أختنا أم العيال متصوره واحد عميل تاجر مخدرات مباشرة من إسرائيل، وحرامي كبير جدا وثروثه بقت فوق السبعين مليار، وهو مامعوش إبتدائية حتى، بقى رمز الحرية والديمقراطية. هي البلد أمحلت بقاش فيها رجاله غير نور ده؟<br />إن كان كده يبقى شوية علينا الى بيحصللنا وأكثر، نبقى نستورد رجاله ماركة إكس إكس إل، من بلاد الله ونلبس إحنا الطرح في بلد فيها حسنية وجمالات بيربطم وطلعت هانم بتحل. عايز والله تعميره دوبل."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233403/http://masr.20at.com:80/article.php?sid=504"

[[comments]]
order = 13
subject = "ههعهع"
author = "المذهول"
posted = "2006-06-15"
text = "يا ناس ياشر كفاية قر، منكم لله ياجهلة نكده يامعقدين ياإرهابين ياحنبية ياعدمين الكيف، روحهم وتفرجم على البلاد المتقدمة زي هولندا مثلا، أو هناك بيتباع الكيف علني، ونتيجة ذلك يبقى دماغاتهم رايقة ويعرفوا يفكرو إزاي يعملوا لمصلحة البلد...ههعهع!<br />إنتم يالي ميعجبكم العجب إنتم، هو الريس السادات ألف طربة حشيش تمخمخ عظمه المسوس، مش كل أفكاره جت بعد سلطنة الحشيش، منه لله الإسلامبولي، خلاص حبكت لازمن ولابد يعني تموت الأقرع النزهي الي كان منغنغنا مخدرات؟ وعلى كل لون؟<br />لاكن الحمد لله لطف بالغلابة، وحسنية الغزية بقت أحسن من أنوار النورية، وهو الصنف بتراب الفلوس.هات القزازة وتعال لاعبني....دي المزة طازة والحال عاجبني......<br />وأحب أرد على الحاقدين وأتباع الخوميني إبن لادن ده، بتاع الجزيرة، أنا الحشيش الي بشربه شرعي، سامع، وجايبه من القسم، ولو تحب تشتري، العسكري يوصله لحد باب مغارتك، بطل نق. على راى أخونا شعبولا\" واما بنعمة ربك فحدث\".<br />أناأحب أشرب حشيش..<br />يوصلني مع الشاويش..<br />وأدي المأمور بقشيش.<br />يعفيك ويبقى مفيش.<br />بلا مظاهرة ولاتهويش<br />ولا ضرب ولا تلطيش<br />إضربها طنبجة وعيش<br />مفيش أجدع من التحشيش<br />طلعها من النخاشيش<br />إوعى تروح للملاطيش<br />عاش الحزب الوطني، عاش السادات...عاشت دولة الباطنية، إديني تعميره ياجدع.<br />ههعهع"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906211539/http://masr.20at.com:80/article.php?sid=504&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

