text = "من المعلوم ان النظام بتاعتنا مبيعملس أسد الا على الغلابه المصريين بس وبيروح برة ياخد على قفاة .<br />طبعا ايمن نور مش هيطلع الا لما جمال بيه يمسك البلد فى أنتخابات الست نزيهه<br />زى كل مرة<br />وسنحتفل معا بعودة الملكيه من جديد"
