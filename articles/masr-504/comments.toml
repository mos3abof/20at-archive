text = "طب ولو طلع.. خلاص يارجالة ايمن نور اتكسر.. حيعمل اية وهوة واقف قدام غول اسمه حسني مبارك..واقف وكنا وراة..ولما اتمسك..جرينا بص وراة لاقاة لوحدة مع دراكولا..وراح في الرجلين..<br />ونموت نموت وتحيا مصر<br />ياعزيز عزيز كبة تاخد كل ظالم ومفترى<br />شمرواوادعوا"
