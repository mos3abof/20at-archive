[[comments]]
order = 0
subject = "وماذا بعد؟"
author = "SoFy"
posted = "2006-06-12"
text = "وماذا بعد خروج \" أيمن نور \" ؟ ، أولاً ما يحلم به النوّاب هو شبه مستحيل ، و سنشاهد الرئيس يقول \" لا أتدخل في شؤون القضاء\" وبذلك يحاول أن يجعل نفسه في صورة جديدة مدعياً إحترامه للقضاء الذي دنّسه هو و حكومته الحقيرة .<br />الإحتمال الثاني أن يوافق ! و هذا فرض ضعيف جداً جداً ، لكن حتى لو حدث هذا فسيظهر فخامة الرئيس على أنه رجل ديموقراطي يحب أيمن نور و أفرج عنه لأنه يحب الديموقراطية و يحترم الآخرين حتى لو كانو يكرهونه !<br />في الحالتين سيحاول \"فخامته\" أن يظهر بشكل جديد مدعيا أموراً ليست فيه..."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614142546/http://masr.20at.com:80/article.php?sid=504"

[[comments]]
order = 1
subject = "هو أهبل؟!"
author = "بتاع الأتوبيس"
posted = "2006-06-13"
text = "هو أهبل عشان -قال ايه- يتدخل في حكم القضاء ويقول معلش سامحوا الواد أيمن ده عرف غلطته خلاص وهايحرم. دي فرصة عشان يتنطط ويغني -قال ايه- باستقلال القضاء! الكلمات مش هاتخرج عن \"احنا مالناش دعوة بالقضاء، احنا عندنا قانون وعندنا دستور ولازم نحترمه. ده القضاء ده فوق الجميع\". كفاية خيابة!"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614142546/http://masr.20at.com:80/article.php?sid=504"

[[comments]]
order = 2
subject = "طريقك مسدود مسدود مسدود يا طلعت يا ولدى"
author = "نيفين نيفى نوفا"
posted = "2006-06-13"
text = "قال طلعت السادات الكلام دا امبارح ف القاهره اليوم<br />و جاب معاه مستندات بتثبت ان اتنين من النواب(المحترمين)سحبو توقيعهم<br />و السبب معروف<br />محدش هيعرف يعمل حاجه لايمن يا جماعه<br />و مع اختلافى مع ايمن نورؤ ف حاجات كتير لازم احقاقا للحق اقول ان الراجل دا ميستحقش اللى بيحصله<br />ربنا على المفترى"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614142546/http://masr.20at.com:80/article.php?sid=504"

[[comments]]
order = 3
subject = "عمري الشيشة يابت!"
author = "المذهول"
posted = "2006-06-13"
text = "إيه ياكماعة هو أنتم غيرتم الصنف وإلا إيه؟ هو صحيح الغش دخل كل حاجة، لكن الشهادة لله، ربنا يحفظ سيادة الريس لينا إحنا بتوع الحشيش والكيف موفر لنا أحسن الأصناف بأسعار معقوله. نقوا فيها بقى أنتم، يا جهله ياعدمات الذوق والروقان، إجري ياوله إنته وهي، قال طلعت هباب قال، إنتو حمير بجد؟ طيرتم تعميرة الحشيش من دماغي منكم لله!<br />طلعت هباب الطين قال،<br />هو مين خارب البلد أساسا غير هو واللي زيه ياعبط، بجد هو يعرف يقك الخط، إيه ياولاد هو مفيش غير المنايفة,<br />عمري الشيشة يابت!"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614142546/http://masr.20at.com:80/article.php?sid=504"

