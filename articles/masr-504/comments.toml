[[comments]]
order = 6
subject = "والنبي إيه"
author = "المذهول"
posted = "2006-06-13"
text = "روقي كدة يا ست أم العيال، ولا شرفينا وشدي كم نفس معايا أنا ومراتي وكله يبقى تمام، أصل ده حشيش شرعي، وجايبه من القسم بنفسي، ولو عايزه تشتري، قولى والعسكري يوصله لعندك وفي أي وقت.<br />يعني بسلامته أيمن نور كان حيجيب الديب من ذيله؟ قولي ياباسط، شوفي لوكانت إسرائيل راضيه عنه أكثر من حسنية الغزية أوجمالات عدلات، يبقى حيبقى ريس عصب عن عين حسنية الحمرا الورانية، ولو كان في أخينا نور ريحة وطنية، والله يصيفوه من بدري، واخده بالك؟<br />وبعدين إزاي حرامي كبير زي طلعت يتصدر في حاجات زي دي، أنتم نسيتم هو نهب قد إيه هو وأخوة عصمت وريسنا المؤمن ومدام جيجي وباقي الفاميلا؟ إيه المسرحية دي والنبي، شيوخ المنسر القدام والجداد عملين علينا رباطية ليه؟<br />أهلا أهلا أم العيال نورتي وآنستي."
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614142546/http://masr.20at.com:80/article.php?sid=504"

