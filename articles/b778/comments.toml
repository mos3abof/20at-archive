[[comments]]
order = 0
subject = "ال سعود نقيض الاصلاح"
author = "من زعم أنه يمكن اصلاح المجتمع الحرمي (نسبة الى الحرم) مع وجود ال سعود ، فقد أوهم نفسه بالسراب ، وخدع نفسه وغيره بالاماني الكاذبة."
posted = "2006-05-07"
text = "فوالله -الذي لا يحلف بغيره - أنه لاصلاح ولا قلاح ولا نجاح الا باجتجاث شجرة الخبث والرجس ال سعود(ببساطة أنتم لستم بحاجة اليهم)"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153225/http://www.20at.com/article2.php?sid=778"

[[comments]]
order = 1
subject = "كيف تسمحون بمرور مثل هذا التعليق"
author = "ِA"
posted = "2006-05-10"
text = "السادة الأفاضل القائمين علي الموقع<br />رجاء سرعة إزالة التعليق العنصري البذئ المتعجرف المكتوب فوق تعليقي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153225/http://www.20at.com/article2.php?sid=778"

[[comments]]
order = 2
subject = "زيلو التعليق اللى فوقى ؟؟؟؟"
author = "لباشمهدنس عاوزنا نشيل التعليق اللى فوقة ؟"
posted = "2006-05-10"
text = "لية انتا فاكر نفسك فى السعودية ولا اية<br />طب طزين على الطز يتاعت الاخ فى السعودية وام السعودية واللى من السعودية<br />هوا لما تسمى العربى اللى بيشتغل فى بلدك اجنبى مش عنصرية<br />هوا ياسعودى لما بلدك تعمل خط فى المطار لمواطنين مجلس العاون وخط لعموم الاجانب هى دى مش عنصرية"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153225/http://www.20at.com/article2.php?sid=778"

[[comments]]
order = 3
subject = "بسرعة ؟"
author = "توتة"
posted = "2006-05-10"
text = "الاخ السعودى بيطال بسرعة ازالة التعليق حاضر يافندم احنا بسرعة حنزيل التعليق ولاتقلق نفسك<br />بس لية بسرعة هوا فية حاجة حتكهرب مثلا لو اتاخرنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102153225/http://www.20at.com/article2.php?sid=778"
