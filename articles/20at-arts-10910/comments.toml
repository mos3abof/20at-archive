text = "انا موفق جدا على هذا المقترح ولكن لى تحفظ بسيط وهوعدم نشرصور مقاتلى حماس حتى لايعرفونها ويعملون اللازم عندما يجدوه او ممكن يوضع فى قائمة الارهاب ومن ثم السريه مطلوبه فى عدم نشراى صور لمقاومى حماس او غيرهم من الجمعات المسلحه الفلسطينيه<br />وياريت تكتب بعض المنتديات اليهوديه التى تعرفونها حتى يسهل على الجميع الدخول عليها والتسجيل بها"
