subject = "ملعوب"
author = "دودو"
posted = "2007-01-28"
text = "ملعبو يا استاذ عبد الله مش ممكن هذا الاحكام في اسرد انا بصراحة حسيت اني أقرا قصة قصيرة او اسكريبت فيلم روائي قصير عن حياة شيخ الازهر<br />طبعا مش محتاج تعليق حجد يا استاذ عبد الله وكذالك لم اشعر البتهكم على شيخ الازهر كما رددتن بعض التعليقات فالرجل لم يؤلف كلام ولكنه عرض لمواقف ونشرها بمنتهى الذوق والانسانية والاحترام"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131075256/http://masr.20at.com:80/article.php?sid=1503"

[[comments]]
order = 8
subject = "جدع يا عبده"
author = "ياسر أبو العلا"
posted = "2007-01-28"
text = "تصدق بالله يا عبد الله ،دى اول مرة اقرا موضوع ليك لاخره،اول مرة اشعر انك خرجت من (شرنقة التمحور حول الأفكار الهمايونية للنظرية البيروقراطية التى لا تفتأ أن ترتكز على ابعاد شعبوية واضحة) .<br />لازم نعيش مشاكل الناس وقضاياهم ونعبر عنهم بشكل ليس فيه تكلف او تفلسف ،الصحافة يا عمنا مش تقعر والسلام ،رسالتنا كبيرة والقضايا الموجودة أكبر بكتير .يللا ربنا يجوزك.دعوة حلوة تفتح النفس اهى ."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131075256/http://masr.20at.com:80/article.php?sid=1503"

