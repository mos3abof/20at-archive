[[comments]]
order = 17
subject = "مش ممكن !"
author = "محمد صبري"
posted = "2007-01-29"
text = "انا مركزتش ف الموضوع اد مركزت ف الاسلوب<br />ايييييييه دا<br />انت فظيع<br />فظيع بالمعنى الحرفى للكلمة<br />اسلوبك رائع جدا جدا جدا<br />فكرتنى بمقالة كتبت فى الدستور عن محامى من ايام الستينات شاذ جنسيا وقتل فى ظروف غامضة ...وكان مكتوب ان صاحب المقالة هو الدكتور الرخاوى ، لكن انا مصدقتش وقلت مستحيل .. ف العدد اللى بعده الرخاوى قال مش بتاعتى ياجدعان واعترف ان اللى كاتبها اسلوبه اكثر من رائع لكنها مش بتاعتى.<br />بؤلك ايه من الآخر انت جميل وموضوعك شائق ربما اعتبره البعض لايقدم جديد لكن انا قرأته باستمتاع كأنى بأكل قطعة جاتوه واعترف انى كنت بتمنى ماينتهيش.الف قصص وروايات!"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131075256/http://masr.20at.com:80/article.php?sid=1503"

