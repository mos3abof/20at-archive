text = "اولا شيخ الازهر والبابا شنوده دول رموز دينيه مش صح انها تنتقد وان انتقدت يبقى نقد بناء<br />ثانيا مين قلك انى الى بينتقد البابا بيتحرم من الكنيسه<br />ثالثا قال ملقوش فى الورده عيب قلولو يحمر الخدين, البابا دا راجل محبوب على الاقل من المسيحيين عشان كده محدش بينتقده"
