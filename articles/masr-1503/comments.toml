text = "انا اول ماقرات شيخ وجلباب عرفت ان الكاتب استاذ عبد الله والله انا خايف عليك<br />لحسن يمسكوك يا ريس<br />ويحكموك زي الراجل بتاع المدونة الي اتهموه بسب الازهر<br />ولا عادي كلنا وراك يا طحاوي سير سير واحنا وراك بالسواطير"
