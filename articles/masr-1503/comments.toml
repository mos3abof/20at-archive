[[comments]]
order = 2
subject = "المبتسم"
author = "فهد الا سلام"
posted = "2007-01-27"
text = "انا طبعا من اشد المعجبين بيك يا طحاوى بس لية تعليق الشيخ طنطاوى هو فعلا فقيه بس مش عارف هو لية بيعمل كدة بس عاوز اقولك ان احنا مش عاوزين ننزل من قدر علماء الدين وللاسف هو منهما وفية مقولة للشيخ كشك علية رحمة الله قال اذا رايتم العالم يتودد للحكم فا تهموة با لفسق اى ان لا بد ان يكون العا لم عكس الحاكم حتى لا ير ان كل شى يفعلهالحاكم هو الصح لا بد ان يكون العا لم هو ضمير الا مة ولكن الشيخ غير ذلك سال رسول الله صلى الله علية وسلم متى تقوم السا عة قال اذا وسد الا مر لغير اهلة يعنى يا عم طحاوى مين فى البلد اهل لا مركز هو فيه وابقى اقرلنا الفا تحة فى الحسين على الا مة الضا يعة"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131075256/http://masr.20at.com:80/article.php?sid=1503"

[[comments]]
order = 3
subject = "شيخ الازهر بقى شيخ الحزب الوطنى"
author = "شريف الدواخلى"
posted = "2007-01-28"
text = "انا مش هاقول الموضوع حلو بس هاقول انى توقعت كاتب المقال من العنوان لان العنوان عالى قوى عن بافى الموضوعات ..<br />ديه حاجة والحاجة التانية ان النت بيلعب على عامل الزهق \" يعنى كثف معلوماتك فى اقل عدد من الكلمات \" ولما يكون فى حد سرق عينك من اول الموضوع لاخره وبعد كده يجبرك انك تحتفظ بالموضوع على جهازك فانت تقرأ للاستاذ الطحاوى"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131075256/http://masr.20at.com:80/article.php?sid=1503"

[[comments]]
order = 4
subject = "اكتشف حواسك"
author = "اكتشف حواسك"
posted = "2007-01-28"
text = "شريف الدواخلي – عبقرينو - القاهرة<br />- تعرف عندك كام حاسة؟!<br />- خمسة طبعاً : الشم، اللمس، السمع، التذوق، الإبصار.<br />- للأسف إجابتك خاطئة، وتبناها معك أرسطو منذ قديم الأزل وانتشرت في جميع أنحاء العالم حتى صدقها الجميع دون أدنى محاولة لمعرفة الحقيقة!!<br />أكثر من خمسة!<br />هناك اتجاه تبناه بعض العلماء، وهو وجود أحاسيس بشرية تتخطى تلك الأصناف الخمسة، وإلا فكيف يمكن تفسير اختلاف درجة الإحساس بالأشياء؟!<br />فمثلاً .. وفق منطق الحواس الخمس، يفترض أن حاسة التذوق هى المختصة بالتعرف على الطعم فهل نحن نفرق بين الأطعمة على أساس أن لها مذاق من عدمه فقط، أم نتأثر بدرجته.. هل هو حلو أم مالح أم حامض أم مر؟<br />وكذلك حاسة البصر، فلا يمكن اعتبارها مجرد حاسة واحدة تستطيع الرؤية من عدمها وإنما يجب أن ننظر للإبصار على أنه حاستان الأولى للضوء والأخرى للون، أو أربعة... الضوء بالإضافة للألوان الأساسية الثلاث الأحمر والأخضر والأزرق.<br />والسمع أيضا هل يعتبر حاسة واحدة أم أكثر من ذلك، فقد نفقد السمع للأصوات عالية التردد دون فقدان حدة السمع للأصوات المنخفضة التردد والعكس صحيح، لذلك يمكن اعتبارها منفصلة عن بعضها البعض.<br />وكيف يمكن أن تفسر شعورك بالجوع أو العطش أو البرودة أو الحرارة... الخ؟!<br />فإذا نظرنا لكل حاسة على حدة فيمكن إدراج عدد لابأس به من الحواس الفرعية تحتها وذلك حسب كيفية تقسيمنا لأنظمتنا الحسية.<br />ولذلك يمكننا القول بأننا نمتلك 21 حاسة على الأقل وربما أكثر ولكنها مترابطة جداً لدرجة أن البعض يظن أنه يجدر بنا أن ننساها جميعا وأن نركز على ما ندركه فقط.<br />استغل كل حواسك<br />وأيا كان عدد الحواس، فالأمر الذي لابد أن تفكر فيه.. هو كيفية الاستفادة من كل تلك الحواس التى وهبها الله لك؟<br />فعقل الإنسا<br />اقرأ بقية التعليق .."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131075256/http://masr.20at.com:80/article.php?sid=1503"

[[comments]]
order = 5
subject = "الى كاتب المقال/ شيخ الازهر له كل الاحترام"
author = "ابومحسن"
posted = "2007-01-28"
text = "اولا احب ان اقول للناس ان شيخ الازهر له كل الاحترام والرجل يتصرف على حد علمه فهو راجل عالم جليل حكيم مواقفه من الاحداث السياسية والحكم كموقف الشيخ الشعراوي تماما والعلماء الكبار.<br />وبعيدا عن الشيخ الشعراوي وشيخ الازهر اريد ان انقل لك راي من هو اعظم منهم واجل منهم وهو<br />الحسن البصري.<br />عاش الحسن رحمه الله الشطر الاكبر من حياته في دولة بني أمية وكان موقفه متحفظًا على الاحداث السياسية وخاصة فيما يجر الى الفتنة وسفك الدماء حيث لم يتعاطف مع اي ثورة مسلحة ولو كانت باسم الاسلام ومبرر ذلك ان الخروج يؤدي الى الفوضى والاضطراب وفوضى ساعة يرتكب فيها من المظالم ما لا يرتكب في استبداد سنين ويؤدي الخروج الى طمع الاعداء في المسلمين وان شق على الداعية اصلاح الحاكم فمازال اصلاح المحكومين ميسرا.<br />ارجو ان تكون الرسالة مفهومه"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131075256/http://masr.20at.com:80/article.php?sid=1503"

[[comments]]
order = 6
subject = "اجلال العلماء من الدين"
author = "اريد من المسلمين ان يتعاملوا مع علمائهم كما يتعامل النصارى مع الباباوات وكما يتعامل الشيعة مع المرجعيات بكل احترام وتقدير."
posted = "2007-01-28"
text = "يا فضيلة شيخ الازهر انت على راس هرم العلماء في العالم كله<br />ولا يبغض علماء الدين الا منافق معلوم النفاق"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131075256/http://masr.20at.com:80/article.php?sid=1503"

[[comments]]
