[[comments]]
order = 10
subject = "حبيبي ..عبدالله الطحاوي"
author = "محمد مصطفى"
posted = "2007-01-28"
text = "قابلت عبدالله الطحاوي من ثلاث سنيين ..وساعتها كان كاتب مقال وأطلعني عليه ..المقال كان على ملف وورد ..قريته على جهاز كومبيوتر..وبصراحة تعبت قوي ..من القراءة على الكومبيوتر..ومن المقال !!<br />قدرت أجمع الأسم مع المقالات من تحقيق عن الكنيسة في موقع عشرينيات مدعوم بصورة للطحاوي.<br />المهم..اسلوب جميل وقوي...تنفيذاً..إنما الفكرة..مش على المستوى ..وأظن إن شيخ الأزهر عنده كتير ممكن يقال عليه غير العمة وقصر المشيخة والبوفيه وعبحق!!<br />وضع المشيخة القديم ردئ ولا يليق بمشيخة الازهر كقيمة..ولا يليق بدولة تقرير الجهاز المركزي للمحاسبات فيها بيدور على 10 مليار جنية في ميزانية النظام مش عارف راحت فين!<br />..ونفس التقرير بيطرح استفسار حول 2 مليار جنية مرتبات شهرية لمستشاريين في الوزارات..محدش عارف بيعملوا ايه في الوزارات..وبالرغم من كده البلد حالها ماشي من سئ إلى اسؤ !!<br />الأهم..أسلوب جميل يا طحاوي !!"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131075256/http://masr.20at.com:80/article.php?sid=1503"

[[comments]]
order = 11
subject = "الخطة الخمسية وطابور العواطلية"
author = "اعلنت جريدة الاهرام عدد العاطلين وصل الحد لله الي 9 مليون عاطل من الشباب."
posted = "2007-01-28"
text = "وقد تبادل سمو الوالي المقدس حسني مبارك المعرص<br />التهاني مع سمو الخليفة جيمي مبارك باشا التهاني بهذا الرقم العظيم .<br />وقد اعرب معالي الوزير احمدنظيف الخفيف سعادته بهذا الرقم مع تمنياته الكبيرة بزيادة هذا الرقم ليصبح 15 مليون في الخطة الخمسية القادمة.<br />وقد اعلن معالي الوزير نظيف في الصحف الحكومية المباركية انه من اهم انجازات عهد العارف بالله المقدس حسني المعرص انه اذا وقف العاطلين بجوار بعضهم البعض في طابور فسوف يصل الطابور من الاسكندرية الي اسوان, وتهدف الخطة الخمسية النظيفية القادمة وصول طابور العاطلين من الاسكندرية الي دولة جنوب افريقيا بهدف دعم العلاقات المصرية الجنوب افريقية, وتشجيع الاستثمارات والخصخصة والمصمصة."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131075256/http://masr.20at.com:80/article.php?sid=1503"

