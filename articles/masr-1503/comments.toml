subject = "العبيط اللى مبيفهمش ومبيعرفش"
author = "مصرىوفاهم وعارف"
posted = "2007-01-29"
text = "لتكفير والحرمان من حق العبادة في كنائس البابا شنودة، وربما النهي عن الصلاة عليها حال الوفاه ،كما حدث للقس الإصلاحي الراحل الصديق العزيز إبراهيم عبد السيد، ولعالم اللاهوت والإصلاحي الديني المعروف الراحل متى المسكين وللمفكر القبطي الكبير د. نظمي لوقا، والقس دنيال ربيع، وللكاتب الكبير موسى صبري، وأخيرا قرار منع المفكر السياسي اللامع جمال أسعد عبد الملاك من دخول الكنائس والأديرة."
archived = "2007-01-31"
