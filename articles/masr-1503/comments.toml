text = "يا جماعة استنوا شوية على الرجال لم يعمل الكام أرنب الباقيين وحتشفوه بعد طبعاً ما يتقلش لزلة لسان أو لرائحة عطنة زائدة حيتوب ويستغفر ويتبرأ من كل فتواه السابقة يبقى كده ضحك علينا كلنا وأخذ الدنيا والآخرة هكذا هم يعتقدوا فقد فعلها واحد قبله"
