[[comments]]
order = 14
subject = "مقال بطعم عصير الليمون"
author = "ياسر أبو العلا"
posted = "2007-01-28"
text = "لا يا طحاوى انا لما كنت باشتمك-قصدى بانتقدك يعنى -كان بعد قراءة الموضوع ولكن من غير نفس ،اصل فيه فرق انك تقرا موضوع بنفس او بدون ،عندك مثلا واحد زى حمدى رزق -وانا لا اشبهك به طبعا -باضطر اقرا له المقال بتاعه للاخر وانا عاصر على نفسى لمونة من ام ربع جنيه زى اللى كنا بنبيعها فى السوق بتاع افاق عربية ،بس علشان اعرف المستوى اللى وصلتله التقارير ال.....وهل مستولى اللى بيكنبوها اتحسن ولا لا،اما واحد زى فاروق جويدة ولا فهمى هويدى ولا غيرهم فالواحد بيقرا المقال بتاعهم وهو مش عاوز يخلصه .<br />اعتقد انك بدات تدخل -بالنسبة لى على الاقل -فى الصنف الثانى ."
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131075256/http://masr.20at.com:80/article.php?sid=1503"

