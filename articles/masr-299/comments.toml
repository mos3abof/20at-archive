[[comments]]
order = 1
subject = "من السبب"
author = "مصرية"
posted = "2006-05-11"
text = "الشعب المصرى اذكى من الا يفهم اللعبه وهى ان يتحول صراعه مع الاستبداد والفساد والتوريث وانتهاك الدستور والقانون ...الخ الى صراع مع بعضهم البعض قدتكون هناك فئه مضلله او متعمده لخدمه النظام الفاسد الزائل باذن الله لكن الشعب المصرى هو الباقى كما عشنا دائما فى نسيج واحدو ستختفى هذه النغمة النشاز من حياتنا وسيذهب معها كل ما هو فاسد قولوا آآآآآآآآآمين"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909021842/http://masr.20at.com:80/article.php?sid=299&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
