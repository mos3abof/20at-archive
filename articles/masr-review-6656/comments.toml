posted = "2008-07-22"
text = "فيلم يعد من أسوأ الأفلام في العشر سنوات الأخيرة، إسفاف ما بعده إسفاف، وكأن محمد سعد يخرج الكبت النفسي بداخله في وجوهنا نحن الجمهور الذين أتعسهم الحظ وشاهدوا الفيلم!! صراخ وضحك بدون سبب، إستظراف بدون داعي من محمد سعد المفترض أنه خفيف الظل جدا وكوميدي مخضرم. صدمت وأتمنى أن يكون فيلمه القادم بخلاف \"كركر\" وإلا فلا مكان لمحمد سعد بين نجوم الكوميديا."
