[[comments]]
order = 2
subject = "ياي ياي بلدي خالص"
author = "سوسة المفروسة"
posted = "2006-04-19"
text = "(مخ) ملكة جمال مصر?!!!!1......اصلا فيه تناقض شنيع (فزيع) رهيب (ختير) ياي خالص في الجملة دي<br />السنة اللي قبل اللي فاتت سالوا اللي بعد كده فازت باللقب :لو اخترتي تفقدي حاسه من حواسك تختاري ايه? ......قالت لهم مناخيري!!!!!!!!!! ...و لما المذيع كمل غباء و سالها ليه (مع التغاضي طبعا عن ان المناخير دي مش حاسة من الحواس) ..قالتله عشان الواحد ممكن يستخدمها في حاجات وحشة كتير!!!!!!!<br />وبعد كده هي اللي فازت و بقت الملكة<br />ده غير انهم لما سالوا العشرة الاوائل مين مثالكم الاعلى 9 قالوا سوزان مبارك و واحده قالت الاميرة ديانا....و نعم الامثلة<br />(مخ) ملكة جمال مصر...ايه المخ و الحاجات البلدي دي??........طب و حياة ابوك 2 مخ وواحد شاورمة قوام"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903172143/http://masr.20at.com:80/article.php?sid=199&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "سلعة رخيصة و قبيحه"
author = "عابر القارات"
posted = "2006-04-19"
text = "مسابقات ملكات الجمال و كل ما ينتمى للتسابق بالتعرى و قياس الصدور و الأفخاذ و الأرداف و خلافه التى تتفاخر البنات الفاسدات التافهات و التى أعترض و أشك أصلا أن يكن قد خلقهن الله بأمخاخ ... تذكرنى مثل هذه المسابقات بالمحلات المنتشرة فى بلدان غربية كثيرة و ربما عربية أيضا و هى علب الليل التى تقيم عروض \"أستربتيز\" أجلكم الله .. ففى هذه الاماكن تدخل لتشاهد إحداهن تتلوى و تتعرى لتدغدغ حواس التافهين من الرجال و كأنك داخل السيرك أو حديقة الحيوان لتشاهد القرد و هو يرقص على الحبل و يؤدى حركاته البهلوانية أو أنثى الأسد و هى تتمخطر و تتهادى اليمنه و اليسرة ... و أخيرا ما أرخصا و ما أذلها فتاة بلادى التى رضيت ببيع جسدها"
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903172143/http://masr.20at.com:80/article.php?sid=199&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

