[[comments]]
order = 15
subject = "لا اعتراض عالمبدأ"
author = "الصفاء"
posted = "2006-03-15"
text = "بسم الله الرحمن الرحيم<br />اعتقد ان فكرة الحج عالهواء كانت اكثرمن رائعة<br />جميله جدا هذه الفكرة<br />فلا انكر ان مشاهدة تلفاز الواقع تجذب الجميع<br />لذلك على المحبين لنهضة بلادهم ان يساهمو<br />في عمل مثل هذه البرامج<br />مااروع لو اخذنا شباب مسلمين<br />ووضعناهم في مدرسه تعلمهم الدين والاخلاق وحتى العلوم الحياتية<br />ومن ثم من يخترع اختراع او يكتشف شيء مفيد في العلوم الحياتية<br />يفوز ومن يتكاسل عن البحث يخسر<br />اعتقد انها فكرة رائعة وقد تنمي كثيرا في الشباب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131746/http://www.20at.com/article2.php?sid=532"
