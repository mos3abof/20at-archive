[[comments]]
order = 9
subject = "نصيحه لوجه الله باعتبار اني ملاك"
author = "هبهوب"
posted = "2006-03-07"
text = "يوووه كفايه ستار اكادمي وزفت بقي .... يا شباب اصحوا وخدوا من الغرب التقدم والفكر بتاعه . وحقول حاجه .<br />وقفت تسال ابها اي ابتي الي صف لي بلادي يا ابي .<br />قلت اسمعي مني بنيه هذه بلادك جنه تزهو مرابعها الغنيه دهرا حماها قومها يعطيهم الاقصي هويه لما تناسوا دينهم احتلها شر البريه .<br />قالت الا من عودة ماجده يا ابي . قلت لها اصغي يا ابنتي امران مفتاح القضيه اسلامنا والبندقيه ,,البصمات مش بتاعتي ,,<br />يا شباب فوقوا بقي اوعو تعولموا الجسد علي راي دكتور المسيري او تفلطحوا الارض علي راي فريدمان.<br />كلمه كمان حفظوا علي هويتكم واوعو تبيعو زيه .<br />زي \"عوووووووواد\""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131746/http://www.20at.com/article2.php?sid=532"

[[comments]]
order = 10
subject = "انا استعجلت..بعتذر"
author = "عبدالله مفتاح"
posted = "2006-03-07"
text = "لا معلش يا دبدوب انا بس اللي استعجلت وفهمت غلط<br />المهم بخصوص اني بهتم بكتب التراث والكتب الدينيه الموضوع ده حقيقي لاني قضيت فترة طويله ادمنت فيها مواقع وكتب الملحدين وبحثت عن رد لكل من شكك في اي شبهة وكنت دايما اقرا كلام الملحدين ولما معرفش ارد ادايق جدا جدا جدا واروح ابحث عن اجابه او رد على هذا التشكيك .<br />لغاية لما لقيت ان الجماعه الملحدين دول كلامهم لا ينتمي الي اي علم و ماديين جدا وحسيت اني مش بستفيد من قراءة كلامهم والبحث في كتب الدين عن الرد واظن ان الفترة دي لم تضف لي اي ثقافه سوى ثقافة المغالطه (كيف تكتشف السوفسطائي)<br />وعلى فكرة في كتاب اسلاميين كتير بيمزجوا بين كتاباتهم وثقافتهم وثقافةالاخرين منهم الكاتب الرائع الاستاذ انور الجندي ويا ريت تبحث عن كتابه (الصحافه والاقلام المسمومه)وكتاب (شبهات حول الاسلام)كتابين حلوين جدا جدا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131746/http://www.20at.com/article2.php?sid=532"

