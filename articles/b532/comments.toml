subject = "هو ميكافيللى ورايا ورايا"
author = "نيفين"
posted = "2006-03-08"
text = "3 مرات يبقى كتاب الامير دا ف ايدى و مقراهوش<br />مره لانى عرفت انه قال الغايه تبرر الوسيله فمقريتهوش اتباعا لمبدا الجواب بيبان من عنوانه<br />و المره التانيه علشان مكنش عندى و قت<br />و المره التالته لان صاحبته طلبته<br />بس هتخلونى اجيبه و اقراه<br />يا ريت نتناقش بهدوء يا شباب"
