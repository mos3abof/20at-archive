subject = "ساقطات أكاديمى"
author = "أبو عز"
posted = "2006-03-08"
text = "الىkamzoodكيف لايكون هذا فكر المؤامرة وقد نجحت المؤامرة وبدأنا نقلدهم مثلا برنامج ستار أكاديمى شلة من الساقطين والساقطات فى منزل واحد والعالم العربى كله بيدعوا لهم أن ربنا يوفقهم فى قلة الأدب ويكونوا راقصات ممتازات...وأهلهم بيتصلوا بهم علشان يشجعوهم على الفجور...ولا أنت ماشفتش الأحضان والقبلات العلنية اللى على الشاشة...وتقولى دا مش فكر مؤامرة"
