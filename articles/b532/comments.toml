[[comments]]
order = 7
subject = "الي عبد الله مفتاح .....شكرا"
author = "Dabdoob"
posted = "2006-03-07"
text = "التعليق اللي فوق ده لاكرم مش لعبد الله طبعا<br />الاخ عبد الله اولا اشكرك علي الاسلوب الهادئ والمنطقي (اخيرا) بعيدا عن صراخ المتدينين الدائم وارجو ان تقبل اعتذاري علي الاسلوب الجاف قليلا<br />اما بالنسبة لميكيافيلي فانه قد كتب الكثير والكثير من الكتب الهامة عن الحكم واشياء اخري ليس الامير اهمها او حتي اكبرها ولكنه اشهرها للاسف ربما لانه فضح اساليب الحكم الحقيقية وقد ساءني انه صار كاتبا سيء السمعة بلا ذنب خاصة وانه لم يعتمد اسلوب الغاية تبرر الوسيلة او يؤيده<br />بالنسبة لموضوع تليفزيون الواقع فانا لست من المؤيدين له او المهتمين او حتي المستمتعين ولكني قصدت ان برامج تليفزيون الواقع الدينية ليست الا استغلالا للدين لجذب المتدينين (واموالهم) الي شاشات تليفزيون الواقع كما يفعلون في الخارج حينما يعرضون برامج تليفزيون واقع اباحية لجذب المنحرفين اليها ....اقصد انها مجرد افكار لجذب الجمهور الي شاشات التليفزيون واستنزاف اموالهم ليس الا ...مجرد قالب واحد وحبكات مختلفة وارجو ان يكون كلامي واضحا<br />اخيرا فاني اعتب عليك كما اعتب علي الكثير من الاسلاميين انهم لا يقراون سوي كتب التراث والكتب الدينية ولا ينظرون الي افكار اخري كثيرة ومواضيع شتي (ربما خشية الفتنة)<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131746/http://www.20at.com/article2.php?sid=532"

