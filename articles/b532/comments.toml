[[comments]]
order = 0
subject = "هيا بنا نتذيل"
author = "عبدالله مفتاح"
posted = "2006-03-06"
text = "للاسف الشديد ان في مجتمعنا ناس كل همها جمع المال مش مهم الاسلوب او النتيجه وبذلك يكونوا قد انتصروا لميكافيللي اللي شاف ان الغايه تبرر الوسيله واذا كان الموضوع ده موجود عند الغرب يبقى مينفعش لمجتمعنا. لان المفروض ان مجتمعنا لا يقبل ان الغايه تبرر الوسيله بل يشترط ان الوصول لهدف نبيل لا بد ان يكون على قضبان الحلال لان النزول عن هذه القضبان نزول بالاخلاق والمبادئ والقيم .<br />وانا شايف ان اللي نقلوا فكرة تليفزيون الواقع للمجتمع العربي(بشكله الحالي) لم يضعوا في اذهانهم الا المكسب المادي هذا ان افترضنا حسن النيه بهم اما اذا اسأنا النيه هنقول عليهم عملاء لتخريب الشباب وتحبيب كل ما هو غربي لهم وتسهيل المعصية وتعسير الالتزام .<br />نقطة تانيه:انا شايف ان تليفزيون الواقع بيلغي خصوصية الفرد واذا كانوا المشتركين موافقين فهذا من اجل الشهرة وليس حبا في انتهاك الخصوصيه ولنا ان نتخيل ان احد المشتركين علم ان احدا راقبه لمده شهر بكاميرا في غرفته ترى هل كان سيسعدبانتهاك خصوصيته؟<br />نقطة اخيرة: حاجه لازم كلنا ناخد بالنا منها ان كلنا في تليفزيون واقع وكلنا متراقبين ويا ترى لو في كاميرات مراقبانا كنا هنتصرف تصرفاتنا اليوميه الروتينيه بما فيها من محرمات؟<br />فما بالك ان اللي بيرقبنا مش كاميرا ده اللي بيراقب قلوبنا وتصرفاتنا اللي خلقنا<br />تعليق اخير من حيث المبدا انا ضد تليفزيون الواقع لكن اذا كانت في فكرة بناءة ومفيده انا اول واحد هكون معاها لكن اننا نستنسخ برامج الغرب عندنا فهذا شيء سيء ويجب ان نتخلص من تبعيتنا والا تذيلنا العالم ان لم نكن قد تذيلناه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131746/http://www.20at.com/article2.php?sid=532"

[[comments]]
order = 1
subject = "لكل رايه"
author = "kazmood"
posted = "2006-03-06"
text = "في اعتقادي فكرة \" المؤامره \" من قبل الغرب بعيده كل البعد عن الواقع واكبر دليل على ذلك هو عرض هذه البرامج في الولايات المتحده والدول الاوروبيه لهذه البرامج حتى قبل بثها في الشرق الاوسط .<br />ولكن السؤال هنا ... هل من فائدة تجنى من وراء هذه البرامج ؟ اعتقد ان الفائده منصبه على المعديّن والقائمين على هذه البرامج فقط . ولا ننعت المشاهد بالخاسر لانه يقضي وقته بالاستمتاع بمشهادة بعض هذه البرامج ( المسلي منها ).<br />ولكن ايضا يجب الالتفات على ان بعض هذه البرامج تناقض عاداتنا وتقاليدنا بل وحتى وصلت الى خدش ما امرنا به ديننا الاسلامي من احتضان وتقبيل غير مبرر واجلى الادله ما يحدث في star academy من انحطاط اخلاقي من المشاركين وهذا ما يجب نبذه وايقافه<br />اما رأيي الشخصي المحايد هو ان لكل شي مميزات وعيوب واعتقد ان عيوب هذه البرامج تطغى على ايجابياتها"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131746/http://www.20at.com/article2.php?sid=532"

[[comments]]
order = 2
subject = "Bravooooo"
author = "Dabdoob"
posted = "2006-03-07"
text = "الموضوع رائع ووافي<br />اخيرا اقرا موضوعا بهذه الروعة والاكتمال<br />شكرا مي واتمني ان اقرا لك مواضيعا اكثر<br />الي الاخ عبد الله مفتاح<br />1- انصحك بقراءة كتب ميكيافيللي (احد رواد عصر النهضة ) لانه من الواضح انك لم تقرا له حرفا معتمدا علي الثقافة السمعية<br />2- لم افهم فكرة تدمير الشباب الي اخر ما تقول فما افهمه هو ان تليفزيون الواقع هو مجموعة من البرامج التليفزيونية التي تعتمد علي النقل الحي والمتابعة الدائمة المجموعة من المشتركين العاديين وهي بطبيعة الحال برامج هادفة للربح تعتمد في تسويقها علي المشاكل والاحلام العادية للناس.<br />3- لا يوجد فرق بين البرامج التي تنقل شعائر الحج والاخري ناقلة الاغاني من حيث مبدا الفكرة (ولي مشاركة عن هذا في موضوع جواز REAL TV ارجو ان تقراها)<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131746/http://www.20at.com/article2.php?sid=532"

[[comments]]
order = 3
subject = "الواقع العربي ( على الهواء في فلسطين و العراق مش في ستار اكاديمي )"
author = "أكرم"
posted = "2006-03-07"
text = "بصوا انا ايا كلمة واحدة بعد العنوان يا ريت الناس اللي بتعمل البرامج دي في مجتمعاتنا يختاروا عينة عشوائية من اكتر المحبين و المتابعين لبرامجهم مثل اختنا مروه المتحمسه لفادي و شادي و ( و انا و ليلى ) و يحطوا كاميرات في بيوتهم و نشوف ايه اللي عملوا البرنامج ده في حياتهم و ايه اللي ممكن يعملوا ( حتى لو هيسليهم شويه بس ) و بكده نقدر نحكم على البرنامج و اللي بيشوفوه و اكيد هتبقا المكاسب اكتر<br />و بعدين لو نجح نعمل برنامج للناس اللي بيشوفوا الناس اللي شافت البرنامج<br />حد شايف حاجة ؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131746/http://www.20at.com/article2.php?sid=532"

[[comments]]
order = 4
subject = "اخي دبدوب"
author = "عبدالله مفتاح"
posted = "2006-03-07"
text = "بداية قرات موضوع جواز real tv واحييك لانه كان موضوعا رائعا<br />ثانيا اعترف باني لم اقرا كتب لميكيافللي ولكن قرات عن شخصيته فقد كان رئيسا لوزراء ايطاليا كما قرات بعض اراؤه ففي كتابه (الامير) وضع اسس للحاكم عمادهاان(الغاية تبرر الوسيله)ولو طبقنا هذه النظريه في حياتنا لا بد انها ستخلف وراءها كوارث فكل من اراد ان يتصدق لا عليه سوى ان يسرق ويتصدق فالغايه هنا نبيله وهي اطعام المساكين ولكن الوسيله محرمه .<br />نقطه ثانيه فكرة تدمير الشباب التي لم تفهمها ليست معضله كنت قد قلت اننا اذا اسانا الظن بالقائمين على هذه البرامج سيكون هدفهم تدمير شباب المجتمع فبالطبع نقل هذه البرامج كما رايناهامتمثله في(ستار اكاديمي) لا تناسب بالمرة طبيعتنا كمجتمع مسلم فهناك فرق بين وجودهذه البرامج في مجتمع يعترف بحق الفتاه و الشاب بوجود علاقه بينهما ايا كان نوعها ومجتمع اخر يحرم اقامة العلاقات غير الشرعيه<br />نقطه ثالثة اظن ان من يضع في اعتباره انه مراقب والناس تنظراليه لا يتصرف على طبيعته وهذا يفقد الفكرة جزء من حيويتها وان كنت لا انكر انها فكرة جاذبه<br />نقطه رابعه هناك فرق جوهري بين البرامج التي تنقل شعائر الحج والاخرى التي تنقل الاغاني فالاولى هدفها تعليم الناس كيفية اداء الفريضه اما الثانيه فلا اجد لها هدفا سوى جني الاموال (اذا اهملنا فكرة تدمير الشباب التي لا تعجبك).<br />نقطه خامسه اشعر في نبرة حديثك معي اني منبوذ ولا ادري هل اسات لك حتى تتحدث بهذا الاسلوب (لم تقرا له حرفا).<br />نقطه اخيرة هل اذا استشهدت ببيت<br />اذا الشعب يوما اراد الحياة ***فلا بد ان يستجيب القدر لابي القاسم الشابي , هل يجب ان اكون قد قرات له دواوين؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102131746/http://www.20at.com/article2.php?sid=532"

