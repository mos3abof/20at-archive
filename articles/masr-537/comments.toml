subject = "الحكم يدور مع العلة"
author = "aboodaif"
posted = "2006-08-04"
text = "أرجو ألا تتسرعوا في إدانة هيفاء ومثيلاتها ، لأنهن تغنين بكلام كتبه ولحنه آخرون ، وقد كتبوه بوعي تام بما يحيط بالأمة العربية وما ينتظرها من مصير تم التحضير له منذ قرون على أيدي حكماء صهيون .<br />لذا أدعوكم للتوجه للاتجاه الصحيح الذي تهب منه رياح الفناء والدمار على العرب والمسلمين والنصارى ، ثم على العالم كله .<br />أنظروا إلى العلة قبل أن تحكموا ، فالحكم يدور مع العلة وجودا وعدما ."
archived = "2006-09-03"
capture_url = "https://web.archive.org/web/20060903022548/http://masr.20at.com:80/article.php?sid=537"

