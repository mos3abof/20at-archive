posted = "2006-06-24"
text = "واحد بيفهم زمان قال ان العلم فى الراس مش فى الكراس والكراس ده محير وزراء التعليم كل واحد يروح بلد يجى يطبق نظام تعليمها علينا حتى لو راح بوركينا فاسو ..احنا العالم التالث لنا مفهننا لنا تاريخنا مفيش داعى بلعبوا بينا"
