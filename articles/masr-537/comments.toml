[[comments]]
order = 3
subject = "بوسها انت يا دكتور!"
author = "قلم جاف"
posted = "2006-06-25"
text = "إيه رأيك يا دكتور إن اللي قلته عن حيثيات كتابة الطالب لبوس الواوا دة ينم عن فساد في الاستدلال؟!<br />الطالب عمل كدة يا دكتور كنوع من الاستهزاء والكراهية .. الطالب مغصوب على دخول المادة ودخول الكلية والمذاكرة ليهاوالشغل إن كان حيلاقي شغل ، وترجع بعد كدة تقول للطالب لما يتخرج يشارك في الانتخابات ، وتقول له اتكلم بحرية، اتكلم بديمقراطية ، حتى وانت قصدك تقول له اتكلم يابن الشششششششـ عب!<br />تفضل مقيد عقله ولاغيه ، ومقيد إرادته ولاغيها ، وعايزه بعد كدة يبقى عضو نافع في المجتمع؟ شفتوش استهبال أكثر من كدة؟<br />الدكتور باين عليه مش دارس الطلبة كويس خاللللللص.. اللي بيعوز يزور يبع كل الكلام اللي الدكتور قاله.. ما هو فيه غشاشين بشكل احترافي ، إذا ما تغاضينا عن التعريف الغريب اللي قلته لكلمة \"احترافي\".. أما اللي بيعمل زي بتاع الواوا دة فدة بيهزر وبيتهكم بغل وكراهية لكل شيء حواليه.. ودي الخطورة يا دكتور..<br />وبما إنك عارف الاحتراف أكثر مننا ، فنحن نطلب منك برجاء أخوي حار يا دكتور أن تبوس لنا الواوا.. خلي الواوا يصح!"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010559/http://masr.20at.com:80/article.php?sid=537"

