[[comments]]
order = 4
subject = "سؤال"
author = "كتكوتة"
posted = "2005-11-30"
text = "مكنأسأل سؤال هو موقع عشرينات نفسه راح فين كل ما افتحه يوديني على صفحة الانتخابات<br />هو صحيح الانتخابات دي حاجة مهمة بس انا بطلت اوجع دماغي<br />فوز الاخوان احساسي بيقولي انه بمخطط امريكي يجهله الاخوان نفسهم وهدف المخطط هو امتداد لمؤتمرات اقباط المهجر حتي تكتمل لائحة مخاوفهم من المسلمين في مصر فيحق وقتها لماما امريكا تتدخل في مصر ام الدنيا<br />ماعلينا قولتولي بقى الموقع راح فين؟"
archived = "2007-08-16"
capture_url = "https://web.archive.org/web/20070816235213/http://egyvote.20at.com:80/article.php?sid=90"

[[comments]]
order = 5
subject = "يا عم صباحي تعرف حكاية الارنب والتعلب والاسد؟احكيها لزبائنك"
author = "محمد السيد"
posted = "2005-11-30"
text = "ان التعلب متعود كل ما يشوف الأرنب يضربه ويقول له ودنك طويلة ليه ؟؟؟ جميل ....؟؟ جميل ...<br />الأرنب زهق من المعاملة دي ... وقال يروح يشتكي لكبير الغابة ... راح للأسد وشكي له من التعلب .....<br />بعد ما مشي الأرنب ... الأسد نادي علي التعلب وأخده وحده ... وبينصحه ... قال له : يا عبيط !! .... بدل ما كل مرة تضربه علي نفس السبب وتخلي شكلك وحش ... ابحث عن سبب مقنع $ ... كل مرة اخترع حاجة .......<br />مثلا اطلب منه يجيب لك حاجة ولما يجيبها اضربه وقول له مش عايز دي انا عايز التانية ... مثلا قول له : هات لي تفاحة ..... ولو جابها حمراء اضربه وقول له انا عايزها خضراء والعكس ...<br />التعلب ما صدق ... راح نادي علي الأرنب وقال له : هات لي تفاحة ...... راح رد الأرنب و عمل نفسه بيفهم وقال له ........... عايزها حمراء ولا خضراء ؟ ..........<br />قام التعلب ضربه وقال له : ودنك طويلة ليه ؟ ...........<br />يعني الحكومة قالت تحلي الحكاية وتقدم اصلاحات و حاجات كده ...عشان تنجح برضه ....<br />لقت الناس بتتذاكي عليها وبتسقط مرشحيها .... قامت ضاربة الناس ورجعت للأسلوب الأول وقالت لها ودنك طويلة ليه ....؟<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-08-16"
capture_url = "https://web.archive.org/web/20070816235213/http://egyvote.20at.com:80/article.php?sid=90"

[[comments]]
order = 6
subject = "الرجل ده دماغ"
author = "الخطير"
posted = "2005-12-01"
text = "ع انى اختلف معه فى طريقة الحياة الهامشية كما وصفتهاانت لكن والله الرجل ده ريح دماغة من وجع الدماغ طالما هو راضى بعيشته وحياته وكله تمام التمام يبقى احنا زعلانين ليه.<br />ربنا يدوم عليه نعمة الرضايبارك له فى رزقه القليل<br />اللهم نسالك الرضا والتقى و الهدى واغنى والعفاف ونعوذ بك من هم الرزق وسوء الخلق آمين آمين"
archived = "2007-08-16"
capture_url = "https://web.archive.org/web/20070816235213/http://egyvote.20at.com:80/article.php?sid=90"
