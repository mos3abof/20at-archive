[[comments]]
order = 1
subject = "البؤساء ... في مصر"
author = "aliaa"
posted = "2005-11-30"
text = "ا ترى كم عدد البؤساء في مصر ؟؟؟؟<br />إذا أردت أن تحسب عدد الفقراء والتعساء فعليك أن تقوم بحسبة بسيطة تعرف بها إجابة هذا السؤال ؟!!!!<br />عدد سكان مصر كام ؟؟؟؟؟<br />أطرح منهم الحكومة ، ورجال الأعمال اللي حتلاقيهم برضه في الحكومة والناتج هو المصري الغلبان .<br />هو ده المصري بجد .<br />وأخيرا طول ما في ناس زي عم صباحي ... يبقى أنت أكيد أكيد في مصر<br />وشكرا"
archived = "2007-08-16"
capture_url = "https://web.archive.org/web/20070816235213/http://egyvote.20at.com:80/article.php?sid=90"

