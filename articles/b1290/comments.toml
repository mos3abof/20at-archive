text = "موضوع جميل وشيق جدا<br />نرجوا نشر المزيد من هذه المقالات المفيدة<br />جزاكم الله خيرا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112736/http://www.20at.com/article2.php?sid=1290"

[[comments]]
order = 3
subject = "حقيقي"
author = "مؤمن محمد"
posted = "2006-10-01"
text = "موضوع اكتر من رائع ان شفت مره<br />في الجامعه عندنا بنرات مكتوب عليها ااسم الجمعيه<br />ممكن شرح اكتر عن الموضوع اصلي حابب انضم<br />وكيفيه الانضمان ليكم ازاي<br />ياريت الرد يكون سريع وجزاكم الله كل خير"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112736/http://www.20at.com/article2.php?sid=1290"

