subject = "ممكن سؤال"
author = "ابراهيم أبوبكر"
posted = "2006-10-01"
text = "السلام عليكم ورحمة الله وبركاته<br />المقال ما شاء الله احسن من الرائع خصوصا ان الثقافة الغ1ذائية في مجتمعنا الإسلامي عامة والمصري على زجه الخصوص ضعيفة جدا ان لم تكن منعدمه<br />لو فكرنا نتطبق المقال عملي ونتبرع بجزء من وجباتنا للمحتاجين نبقى ضربن عصفورين بحجر<br />و بالمناسبة ممكن كاتب المقال يعرفنا ايه المنتديات الصحية دي ونشاطها ايه<br />وياريت نقدر نشارك معاه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112736/http://www.20at.com/article2.php?sid=1290"

