[[comments]]
order = 6
subject = "ربنا يكرمكم يا رب"
author = "أحمد أسامه"
posted = "2006-10-02"
text = "جزاكم الله كل خير يا جماعة<br />أحسن حاجة فى المقال انه بيوضح فائدة تطبيق السنة لصحة الصائم..أن الواحد فينا بيطبق السنة عشان ياخد ثواب بس......و ما يعرفش انها فيها فائدة عظيمة لصحته......و أنا فى انتظار مقالات تانية لبيان مزيد من الهدى النبوى فى الصيام و التغذية بصفة عامة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112736/http://www.20at.com/article2.php?sid=1290"

[[comments]]
order = 7
subject = "ممكن أعرف فكرة عن نشاطكم"
author = "لؤى الإسلام"
posted = "2006-10-02"
text = "السلام عليكم<br />جزاكم الله كل خير يا جماعة على المقال الرائع ده<br />بس ممكن آخد فكرةعن نشاطكم؟؟؟؟؟هل هو يقتصر فقط على نشر المقالات على المواقع و لا فيه مجالات تانية؟؟؟<br />و هل الإشتراك ينحصر فقط على الأطباء؟؟؟"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112736/http://www.20at.com/article2.php?sid=1290"

[[comments]]
order = 8
subject = "لجنة العلاقات العامه بعد طول غياب"
author = "بإسمك نحيا لنصنع الحياة على خطى الحبيب"
posted = "2006-10-07"
text = "السلام عليكم ورحمة الله وبركاته<br />أنا أسف جدا يا جماعه لتأخري في الرد على طلب حضراتكم الخاص بنشاط الجمعية بس كنت حابب أكتر أشوف كام واحد علق ونفسه يتعرف علينا المهم<br />احنا الجمعية المصرية للمنتديات الصحية العالمية هدفنا نعمل توعية صحية للمجتمع بتاعنا علشان يصبح مجتمع صحي قادر على بناء النهضة<br />وعلشان نحقق الهدف ده بننزل للناس في كل مكان قرى ومساجد ومراكز شباب ومدارس نحاول نوصلهم التوعية بالوسائل الي متوفره لينا من مطبوعات وعروض مسرحية للأطفال و اغاني و أفلام كارتون تحمل الفكرة صمممها و أعده لينا كتيبة اللجنة الفنيةربنا يكرمهم وكمان نتابع الحالات المهتمه عن طريق اللجنة العلمية الي أعدت المقال ده<br />وكل ده بالمجان وبلا أي مقابل سوى ارضاء وجه الله تعالى<br />شفتوا بقى احنا محتاجين ناس معانا أد ايه<br />يارب أكون وصلت الفكرة ببساطة وتحت أمركم في أياضافة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112736/http://www.20at.com/article2.php?sid=1290"

[[comments]]
order = 9
subject = "و ماذا بعد رمضان ؟"
author = "صيدلاني : هشام نبيل"
posted = "2006-10-08"
text = "أخوتي في الله في جمعية المنتديات الصحيةالعالمية<br />تحية من عتد الله مباركة طيبة و سلام الله عليكم و رحمته و بركاته.<br />جزاكم الله عن أمتنا خير الجزاء ..<br />فإن المجتمع الإسلامي و العربي قد تفشت فيه العديد من الأمراض المزمنه و التي لها بالغ الأثر في مستوى أداء الفرد و انتاجيته الإقتصادية ... و سلوكياته الإجتماعية<br />أرجو من لجنة العلافات العامة الموقرة توضيح :<br />1- أهداف المشروع.<br />2- مميزات المشروع عن غيره العاملين في نفس مجاله<br />3- المناطق التي يعمل بها المشروع .<br />4- كيفيةالإلتحاق بالمشروع و شروط الإلتحاق.<br />5- نبذه عن خطة المشروع القادمة.<br />6- هل يقبل المشروع رعاه رسميين؟<br />7- وأية معلومات قد ترونها مناسبه .<br />و جزاكم الله عتا خيراً كثيراً"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112736/http://www.20at.com/article2.php?sid=1290"

[[comments]]
order = 10
subject = "جزاكم الله الخير كله"
author = "شيماء سامى المؤذن"
posted = "2006-10-08"
text = "السلام عليكم ورحمة الله وبركاته<br />أسفة على التأخير فى التعليق فقد كان الكومبيوتر معطل وبعد،،،<br />جزاكم الله خيرا كثيرا فأنتم تبدأون البداية الصحيحة للوقاية من الامراض<br />فكماقال حبيبنا ومعلمناالأول رسول الله ((المعدة بيت الداء}}<br />وفقكم الله وفتح عليكم وأعز بكم الإسلام وكل من يمشى معكم وعلى خطى الحبيب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112736/http://www.20at.com/article2.php?sid=1290"
