author = "واحدة مخنوقه منكم"
posted = "2009-01-30"
text = "بالزمة مش عيب عليكم دا موضوع ينتشر اصلا كاتبين شوية نكت هبله ونشرنها الصراحة عشرينات بقي مستواه هابببببببببط بجد وكل ما افتح مش الاقي موضوع عدل اقراه اصلا وكل الموقع علشان المنايفه بزمة يعني كل الاحداث اختفت مبقاش غير الحدث دا لدرجة ان الموقع كله عنه بجد حاجة تزعل احنا مش اتعودنا علي كدا وياريت تختاروا بقي مواضيع عدلة ولا انتم بتاخدوا بالكوسة والوساطة انتم كمان والله اقطع دراعي اذا ما كان مراسلينكم ولا محررينكم شغلين كدا بالكوسة اهو واحد يعرف واحد والسلام عليكم ويجعله عامر"
archived = "2009-05-02"
capture_url = "https://web.archive.org/web/20090502135825/http://www.20at.com:80/masr/t7kyk/11113.html"

