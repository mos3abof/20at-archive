subject = ""
author = "المصرى أفندى"
posted = "2009-01-29"
text = "كان فى مرة واحد منوفى كحيان جاب مجموع صغير فى الثانوية العامة فأبوه لقاه غبى قام دخله الجيش . ولما لقوا صحته زى الثور وعينه يندب فيها رصاصة راح داخل الطيران . بس لما كبر تعرفوا عمل فينا أيه ؟ خلانا شعب من الخصيان يأكل ويشرب وينام ويملأ الدنيا كلام. والنكتة أن اللى قبله وهو من نفس البلد أختار القفا ده علشان يدى البلد خازوق لا تنساه… أيه رأيكم فى النكتة المنوفى دى؟ ما بتضحكوش ليه ؟؟ ماتضحكوا… لا أنسى أن أدعوا بالرحمة لشهداء مصر من هذا البلد .. ,أدعوا بالرحمة لرجالات مصر المشير أبو غزالة والمشير عبد الغنى الجمسى .. سلام سلاح … وعلى فكرة هم من المنوفية.. فالأرض بتطرح شوك وبتطرح ورد كمان."
archived = "2009-05-02"
capture_url = "https://web.archive.org/web/20090502135825/http://www.20at.com:80/masr/t7kyk/11113.html"

