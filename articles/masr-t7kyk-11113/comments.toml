text = "لولا الناس المحترمة دى كان الواحد طالب باستقلال المنوفيه عشان يتلم فيها كل الحمير دول ويسيبوا البلد تتنفس<br />بس للاسف الناس المحترمة دى ماتت صعدت للى خلقها والناس العباقرة اصحاب الضربة اللولبية متبته فى الدنيا بطريقة غريبة اوى يا جدع دا انا لو وصلت للستين يبقى فضل ونعمة من عند ربنا … يارب انت القوى"
archived = "2009-05-02"
