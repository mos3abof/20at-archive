subject = "كل الاحترام لمخترقي الحواجز"
text = "اختي نهى<br />ما رسمته في مقالك لهو غيض من فيض لما نشعر به نحن الذين \"نتمرمط\"على الحواجز بشكل يومي<br />نقف حائرين و صابرين و محتسبين وقوفنا عند الله ان يجعله في ميزان حسناتنا و ان يؤتنا اجر الرباط و كلنا امل بل و اصرار و عزيمة على اجتياز بل اقتحام او حتى اختراق هذا السد الوهمي المسمى حاجز و الذي يحرسه بضعة جنود من اليهود لدرجة اننا نحسد القطط و الكلاب التي تجتاز الحاجز دونما ان يطلق عليها النار<br />من يصدق ان المسافة بين سكني و عملي هي 40 كيلومتر اقطعها احيانا في نصف ساعة و احيانا اخري في ساعة و احيانا في 5 ساعات و كثير من الاحيان في ايام<br />هذه الانتظارات على الحواجز ولدت لدينا نوعا جديدا من التعارف و الحياة الاجتماعية<br />فانت تعرف كل الذين يعبرون الحاجز بشكل يومي<br />وتعرف ارقام هواتفهم النقالة لماذا للاستفسار ممن يسبقونك الوصول الى الحاجز :\"الحاجز فاتح؟\" و كيف اخبار الطريق؟<br />و انت تعرف من يطول انتظاره معك لبفتح الحاجز لانك تسمع قصته: هل هذه اول مرة تقف على الحاجز<br />لا هذه الثانية حيث انني ذهبت لزيارة اختي بالامس و اغلقت علينا الطريق<br />يا رجل حد بيزور اخواته هالايام و بينقطع هالقطعة و الله ما لها لاومة<br />حرام هذه صلة رحم<br />و يتدخل الراكب الجالس جوار السائق<br />طيب انت كنت بتزور اختك و كسبت اجر صلة الرحم<br />انا ايش اقول في بنت ال.... اللي غير بدها بيض بلدي من خان يونس و اجيت على سوق الاربعاء اشتريه و سكرت الطريق<br />الى ما هنالك من احاديث تعلم فيها من تزوج و من تطلق و من . ومن.<br />هذه الحواجز الايستق من يخترقا الاحترم<br />و لكم كل الحترام اخوكم ابو محمود"
archived = "2004-11-14"
