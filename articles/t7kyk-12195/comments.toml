[[comments]]
order = 3
subject = ""
author = "مصطفى المصرى"
posted = "2009-05-26"
text = "اانا مصرى اعمل فى دبى<br />عند تجديد جواز سفرى كنت ادفع 550 درهم لتجديد الجواز و100 درهم لتسجيل العضوية فى القنصلية<br />بينما الهندى او البنغالى يذهب فى القنصلية المقابلة للقتصلية المصرية وفى نفس المنطقة فيدفع البنغالى 5 دراهم فى قنصلية بنجلاديش وياخذ جوازة فى نفس اليوم والقنصلية الهندية تستخرج الجواز للهندى بعشر دراهم<br />قلنا زى بعضة اهو كلة مساعدة لبلدنا<br />وحدث ان كان هناك اجتماعا للبرلمانيون فى دولة فى شرق اسيا وطبعا الوفد البرلمانى المصرى هيشارك - ونزل الوفد البرلمانى المصرى ترانزيت فى دبى وكلفت القنصلية المصرية فى دبى فى حجز اقامات لهم فى افخم واغلى فنادق دبى فندق برج العرب الذى ينزل فية الملوك واعظم عظماء القوم<br />ثم طار الوفد البرلمانى الى شرق اسيا وترك مندوب لة فى دبى ليشترى لهم المشتريات<br />وعند العودة نزل الوفد البرلمانى فى برج العرب يستجم وينتظر الطيارة بعد يومين تلاتة الى مصر<br />ساعتها قال المصريون فى دبى عرفتم لية اسعار تجديد الجواز عالية<br />على العموم تم تخفيض رسوم الجواز الى 350 درهم لا حقا<br />فلوسنا رايحة على السفريات والاقامة فى افخم الفنادق وبدلات السفر<br />كما قال مبارك - لا داعى للفشخرة"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527212453/http://www.20at.com:80/t7kyk/12195-2009-05-26-13-17-43.html"

