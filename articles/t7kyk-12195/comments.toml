author = "حالة توهان"
posted = "2009-05-27"
text = "انت عارف الشخص المخمور - او واحد شارب حجرين حشيش - او ضارب 3-4 سجاير بانجو<br />دى حالة البلد حاليا<br />فى حالة توهان<br />كل واحد بيعمل اللى على مزاجة ومعاك فلوس كل حاجة تيجى لك على باب البيت وعندك واسطة تفوت فى الحديد وعيالك يشتغلوا وتبقى اخر تمام<br />لا قانون ولا يحزنون<br />البلطجة هى السمة الزائدة<br />والكل شغال اخر حلاوة<br />عصابات سواقين الميكروباص<br />وعصابات البلطجية<br />وبتوع الذقون<br />وبتوع النقاب اللى فارشين بيبيعوا على الرصيف ادعية دخول القبر واوردة الصباح والمساء<br />مولد يا دنيا<br />مولد وصاحبة غايب<br />صاحب مخبز عيش قريب منى واحد بلطجى استولى على انتاجة ليضعة فى اكياس ويأخذ من كل مشترك 5 جنية فى الشهر وفى الحساب وجدنا انة يجمع 6 الاف جنية شهريا وتحت نظر الشرطة وبصرها<br />مولد وصاحبة غايب"
archived = "2009-05-27"
capture_url = "https://web.archive.org/web/20090527212453/http://www.20at.com:80/t7kyk/12195-2009-05-26-13-17-43.html"

