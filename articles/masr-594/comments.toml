[[comments]]
order = 5
subject = "بصيص آمل"
author = "آبن مصر"
posted = "2006-07-02"
text = "والله اللى حصل دة شىء مش حضرى ولكن النتيجة كانت جيدة جدا * لما ارئيس بيتكلم بنفسة فى حكاية بنت صغيرة * لازم نفكر ونقول فى حاجة جديدة دخلت البلد وهى اهتم الحكومة بالشعب وممعنى اصح خوف الحكومة من الشعب لانهم عرفين انى الشعب خلاص فضلة هبة بسيطة ويقوم على الحكومة والحكومة عرفة كدا كويس جدا بس اللى عجبنى فى الحكاية دة هى ان الشعب خلاص عرف ازاى يتكلم وستنباط الاشياء اللى وراء الكلام وربنا يستر *وشكرا*"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705082401/http://masr.20at.com:80/article.php?sid=594"
