[[comments]]
order = 3
subject = "حرية رأي"
author = "بنت مسلمة مصرية"
posted = "2006-07-01"
text = "تحدثت في الموضوع بصورة غريبة غير منطقية فيها تحيز للحكومة ..<br />اوكي ونداء لكل المصريين اكتموا واقفلوا افمامكم عشان ما يحصلش ليكم حاجة وحشة فمصر اول الدول التي لا تطبق حرية الراي وسبحان الله مع ان الدستور كفلها ولكنها لا تنفذ نحن في بلد لا رأي لا نقد لا حرية ولما قرأت موضوع آلاء وجدت ان هناك تقاربا كبيرا بيننا في سنة الدراسة والعمر و المحافظة فانا من ابناء الدقهلية و ايضا المستوي الدراسي<br />وصراحة الموضوع صغير ولكن من جعله يكبر هو المدرس الذي نقل الخبر لمصادر اعلي دون اكتراث او اهتمام بالفتاة فماذا سوف يحدث لو كان تكتم علي هذا ؟ فماذا ذكرت ؟ان ما ذكرته نقد لفتاة لا يؤثر رأيهافي مصر ....<br />فبدلا من ان يهمل المصحح الموضوع ولا يهتم<br />به رفعه لمصادر عليا واعتقد ان هذا تصفية خلافات او شجار بين والد آلاء و بين المصحح انتقام يعني"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705082401/http://masr.20at.com:80/article.php?sid=594"

[[comments]]
