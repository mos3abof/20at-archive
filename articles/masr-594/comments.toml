[[comments]]
order = 0
subject = "موالسون من خارج الحدود"
author = "السيد / عبد الرحمن الراشد"
posted = "2006-07-01"
text = "أكيد مش مصرى طبعا<br />و الله حتى لو ماكنش مصرى كانت الصوره حتبقى أوضح بالنسبه له أكتر من كده الا اذا كان نظره ضعيف و سمعه تقيل<br />أأأأأأأأأأأأأأأأأأأأاه يـــــا بــــلــــدى"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705082401/http://masr.20at.com:80/article.php?sid=594"

[[comments]]
order = 1
subject = "حاجات و محتاجات"
author = "عابر القارات"
posted = "2006-07-01"
text = "هوه موضوع جميل و لو إنه موضوع الأء إكتب عنه كتير و الحمد لله إن النهاية كانت سعيدة بالنسبة للبنت المسكينة اللى نشفوا دمها هيه و أهلها كام أسبوع و طبعا كل الحكاية ما كنتش تكون لو يقظة المدرس اللى عمل البوليكا دى و تقؤيبا و الله اعلم إن ورق الامتحانات بقى بيتصحح دلوقتى فى وزارة الداخلية مش وزارة التعليم و مش بعيد بعد كده هيرقوا المدرسين لدرجة ملازم أول و نقيب و الناظر مش هيقل عن عميد أمن دولة و علشان تقدم لأبنك فى مدرسة معينة لازم تجيب كارت من لواء :)) .... أما بالنسبة للى حاصل فأبشركم ان لا فى حرية رأى و اللى هيفتح بقه حتى علشان يتاوب هيتمسك و الهامش اللى المصريين فرحوا بيه و قالوا أهه جالنا الفرج ... فرج سافر و مش راجع تانى"
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705082401/http://masr.20at.com:80/article.php?sid=594"

