subject = "أيوة في كتيييييييييييييييييييييييييييييييييييييييييير"
author = "في كبت كتييييييرقوي ملينا كلنا مش احنا بس المصريين لكن كلنا ولاد سيدنا ءادم"
posted = "2007-02-03"
text = "رحت فين يا بونا وسبتنا لااحنا عارفي بعضنا ولا حتى نفسنا........أنت رحت فين<br />متزعلوش أنا مش هنكد وابكي عل الي راح بس يفيد بأيه يا ندم يا ندم وههتعمل إييه يا عذاب<br />احنا لازم نضحك علشان نعيش عبط ياعني ,بس الموضوع قلب بهبل مع الشباب والعيال والكبار بقينا ماشين نضحك على بعض.....أو على نفسنا<br />بس أنا بجد زعلانة علسان مكنتش موجودة وقتها اصلي تحت كوبري قصر النيل مكاني المفضل ابو جنيه معرفش غلي هوة كمان وبقي ب2 جنيه جت على دي ياعني دحنا في كبت ما زيهوش كبت ابدربنا يفك عننا ونحرر نفسنا بقي من الطناش"
archived = "2007-02-04"
capture_url = "https://web.archive.org/web/20070204012828/http://masr.20at.com:80/article.php?sid=1532"

