[[comments]]
order = 12
subject = "براء كذاب وعندي الأدله بالكوم"
author = "واحد لسه ما نامش"
posted = "2007-02-04"
text = "يا كابتن براء .. الكلام العبيط اللي بتقول إنه شعر وقصيده على منديل ومش عارف هباب إيه كان منشور هنا في تعليق من شهرين .. بلاش كده .. يا كابتن الفرقعات والكذب اللي اسمه براء على عكس وصفه خالص بطل فبركه وكذب ونصب .. طيب روح الرابط ده وهتلاقي فيه القصيده منشوره على أنها أغنيه من يوم 5 أغسطس سنة 2005 .. 2005 يا راجل وجاي تضحك علينا وتوصلنا رساله إنك صحفي ضمن خمسه صحفيين كنتم مش عارف فين .. إيه الخبل ده ؟<br />الرابط أهو يا بايخ وشوف تاريخ نشرها من إمته<br />طيب روح الرابط ده كمان وشوف الكلام ده منشور فيه من إمته<br />طيب روح هنا وشوف الأخ اللي بيتكلم على الأغنيه دي من سنتين برضه<br />طيب إيه رأي الناس هنا لو كل واحد خد كلمتين من اللي قال براء الكذاب أنه قرأها على منديل الحلو وحط الكلمتين دول في الباحث أي باحث ويشوف النتائج ..<br />عيب يا براء استحي على دمك وبلاش عك وقرف .. كرهتنا في الموقع ده وفي الاسم كمان<br />باين عليك واد معقد وكلك كلاكيع واحلام يقظه خايبه<br />طيب دخلنا احنا ايه بجنونك ولخبطة عقلك<br />يا عشرينات ريحونا بقى من براء واللي زيه<br />عيب كده"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212040502/http://masr.20at.com:80/article.php?sid=1532"

[[comments]]
order = 13
subject = "روحوا الروابط دي وشوفوا كذب براء على المكشوف"
author = "واحد لسه ما نامش"
posted = "2007-02-04"
text = "اللي فوق ده رابط فيه البحث على ياهو .. روحوا وشوفوا كذب السيد براء<br />وجربوا كمان الرابط ده<br />ليه أنا علقت كتير على الموضوع ؟ لأن السيد براء وقع في نفس الخطأ الذي وقعت فيه واحده هبله برضه اسمها مش مهم .. نسيته كانت كاتبه في الأهالي من سنتين عن الأغنية ديه وقال ايه الإخوان هم السبب فيها وهم اللي وراها .. يادي النصيبه .. هم الإخوان ورا كل حاجه كده في مصر ؟<br />الأكاده أن الصحفية العبيطه الهبلة بنت العبيطه برضه ما كملتش الأغنيه .. خدت بس كلمة السبحه من الموضوع .. لكن لو كملت كانت حتلاقي كلام عن الكنيسه برضه .. طيب ليه ما يكونش شنوده ورا الأغنيه ؟<br />الموضوع ببساطه أنها أغنيه لا علاقة لها بأية جهة .. بس الأفنديه المهابيل زي براء كده ولو انه واخدها من زاويه غريبه خالص بيدوروا على أي موضوع ولا حتى كلمه ويفبركوا منها موضوع<br />عالم بقر فاهمين الصحافه غلط والله<br />او يمكن لسه عيال محتاجين يتعلموا<br />باقولك ايه يا براء<br />بطل عك وفبركه يا كذاب<br />عيب كده احنا مش عيال صغيرين عشان تحتقر عقولنا وتقرفنا بهبلك ده<br />يا تكتب زي مخاليق ربنا يا تبطل وتريحنا<br />ويا عشرينات ارجوكم اتأكدوا من سلامة القوى العقلية لمن يكتب عندكم عشان هي مش ناقصه تهييس وهوس وقرف<br />واحد لسه ما نامش"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212040502/http://masr.20at.com:80/article.php?sid=1532"

[[comments]]
order = 14
subject = "الأغنية المسروقه كاملة هنا"
author = "واحد لسه ما نامش"
posted = "2007-02-04"
text = "لمّا تلاقي الجد في ايده حفيده<br />والناحية التانية سبحة في ايده<br />الطفل في عينه بريق<br />وفي وجه احساس برئ<br />لسّا جايب جلابيته النهاردة<br />وبينده وسط الطريق<br />ويقله ياجدو<br />ويمسك ايده ويشدو<br />ويقله انا عايز أتوضا<br />ويقله يللى نصلي العصر...<br />يبقى انت أكيد أكيد في مصر<br />يبقى انت أكيد أكيد في مصر<br />لمّا تلاقي الكنيسة جوّها دافي وأصيل<br />وكل ركن فيها شاهد على التاريخ<br />هنا المسيح والعدرا عاشوا بالسنين<br />في وسط ناسها وأهلها الطيبيين<br />ده كلام جرجس وعمي نصر...<br />ويبقى أنت أكيد أكيد في مصر<br />يبقى أنت أكيد أكيد في مصر<br />لمّا تلاقي في جرحك ألف عين باكية عليك<br />وتلاقي في فرحك زغاريط وزينة من حواليك<br />وبيتك البسيط يتحول قصر<br />والخير جواه مالوش حصر...<br />يبقى انت أكيد أكيد في مصر<br />ويبقى أنت أكيد أكيد في مصر<br />طيب آدي الأغنيه كامله يا عم براء<br />عسى الله يكرمك وتحل عن سمانا بكلامك الماسخ<br />وكذبك وفبركتك العجيبه على الفاضي<br />لسه برضه مصر تفهمنا إنك كنت مع خمسه صحفيين وانك صوحافي؟<br />طيب اتلهي بقى ودورلك على موضوع زي الناس"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212040502/http://masr.20at.com:80/article.php?sid=1532"

[[comments]]
order = 15
subject = "يبقى انت اكيد اكيد في مصر"
author = "عن مدونة شخابيت"
posted = "2007-02-04"
text = "شخابيط<br />07 يوليو, 2006<br />يبقى انت اكيد في مصر<br />بصوا من الآخر كده انا ملييش نفس اعمل أي حاجة في الدنيا يعني انا الخنقة اساسا وصلت بيا آخرها زيي زي كل الشعب المصري ...بس انا الجرعة عندي زيادة شوية ...يقوم منه لله عم احمد الزلنبحي البقال عندنا مشغل التليفزيون المصري لفتت نظري الأغنية اللي شغالة ...اغنية اسمها ...يبقى انت اكيد في مصر .<br />في البداية طنشت شوية ...وبعدين ركزت ..وركزت اكتر لقطت كلمتين من الأغنية ما معناه ...لما الحفيد يشد ايد جده ويقوله يلا يا جدي نصلي العصر ...يبقى انت اكيد اكيد في مصر .<br />هاهاهاهاهاهاهاهاهاهاهاهاهاهاه والنبي ايه حلوة دي ....يعني لو عيل صغير غلط واتخبل في عقله في الصومال مثلا وقال لجده تعالى نصلي العصر ...حيبقى بقدرة قادر تنقلب الصومال مصر علشان يبقوا اكيد في مصر .<br />والله اللي كتب الشعر ده دماغه لاسعة ( مع الأعتذار لقارئتنا المتميزة لاسعة ) .انا بقى لا شاعر ولا بفهم في الشعر ده لكن اللي اعرفه ان عندي حاجات كتير مش ممكن بجد مش ممكن تحصل لو حصلت إنك تقول غير حاجة واحدة ....تقول يبقى انت اكيد في مصر .<br />لو البلد تعبانة و44% من سكانها يعيشون تحت خط الفقر وفيها عبارة غرقانة وانفلوانزا الطيور ومع كده رئيسها يطلع في حوار صحفي والمذيعة تسأله انت مرتاح لوضع البلد ...فيكون الجواب مرتاح اوي ......يبقى انت اكيد في مصر ( يلا .... حتة من ورا ظهر الرقابة واللي يلحقها يلحقها )<br />لو لقيت الظابط ماسك شيخ عمال يديله على قفاه في مظاهرة ....يبقى أنت أكيد في مصر .( مظاهرة من مظاهرات الأصلاح في طنطا ظهر فيها ظابط يضرب شيخ معمم ...بجلباب وكاكولا ويضربه على قفاه )<br />لو لقيت نص شبابنا بيضرب بانجو وحشيش عـ القمة ......يبقى أنت أكيد في مصر .<br />لو صندوق زبالة ف<br />اقرأ بقية التعليق .."
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212040502/http://masr.20at.com:80/article.php?sid=1532"

