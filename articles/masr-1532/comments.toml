[[comments]]
order = 9
subject = "الله ينور عليك يا استاذ طحاوي"
author = "بهنساوي"
posted = "2007-02-03"
text = "بالرغم من ان الموضوع مش كاتبه الطحاوي الا انى بقله الله ينور عليك لانه قال كلمة اتاخدت عنوان وده مش جديد على صحفي كبير زي الطحاوي اللى بينقط صحافة وهو ماشي<br />اما بالنسبة للموضوع فمش عيب ان الواحد يشتغل صحافة حتى لو كان فى نزهة لان استاذنا الكبير مصطفي امين بيقول ان الصحفي بيعمل 24 ساعة يعنى ممكن يعمل موضوع صحفي من حلم شافه في المنان لكن اللى اعترض عليه الافراط في الحكاية دي كده الناس ممكن تحس ان الموقع موضوعاته ( ملاكي ) ارجو الا يساء فهمي"
archived = "2007-02-04"
capture_url = "https://web.archive.org/web/20070204012828/http://masr.20at.com:80/article.php?sid=1532"

[[comments]]
order = 10
subject = "الريس حرنكش"
author = "مفيص"
posted = "2007-02-03"
text = "الريس حرنكش<br />عليا الحرنكش يا ريس مبارك<br />فى عصرمزركش ملون بنارك<br />لابايعك وأبايع حكومة حمارك<br />ملعون أبو اللى يقدريقاطع قرارك<br />نهاره مقندل وليله مبارك<br />فهمبك وهجص وطلع فى ديننا<br />أكيد هو طالع يشاهد جمالك<br />جمالك مبارك سوزانك سوزاننا<br />يا محلا حصارك لمصر اللى جالنا<br />نسيمها فى عصرك بيشوى ف بدنا<br />أؤيد وأبايع فخامة جلالتك<br />وأيد أى واحد بيمسح ريالتك<br />ولأنك سر باتع هاننسى هبالتك<br />فأقعد يا ريس ودلدل حمامتك<br />حمامة السلام حمامتك ياريس<br />سلامة الحمامة وسلامتك ياريس<br />ياريس حمامة ياريس كويس<br />على تل مصر ياريتك تهيص<br />خرابة فسيحة عليها تمتيس<br />وأأمر تطاع فشعبك مفيص"
archived = "2007-02-04"
capture_url = "https://web.archive.org/web/20070204012828/http://masr.20at.com:80/article.php?sid=1532"

