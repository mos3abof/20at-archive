[[comments]]
order = 7
subject = "حرج عليا بابا... مشتمش المرشد!"
author = "حرج عليا بابا... مشتمش المرشد!"
posted = "2007-02-03"
text = "\"إن كان في الخلد خسر.. فالخير أن تخسروني\".. من أناشيد الإخوان!<br />اعتبروها المرة الأخيرة \"مؤقتا\".. لظروف أحتفظ بها لنفسي، ولأسباب تتعلق برغبتي في بقاء علاقتي بوالدي على ما هي عليه..<br />لما يزيد عن المائة تعليق ومثلها إيميلات، ولآلاف الكلمات التي كتبت على الماسينجر وعشرات كروت الشحن التي استخدمت في الموبايل.. لكل هذا أرى أنه من المناسب أن تكف هذه الأشياء عن الحدوث.. وتعود الأمور لـ \"طبيعتها\"..<br />فليستريح الإخوة المكفرون، فقد أسلمت من جديد، وليصفح عني الأصدقاء الذين جعلوني أشاهد وجوههم الحقيقية للمرة الأولى.. سأنسى ما رأيت.. وأظل مخدوعا!<br />لتمضي حملات المقاطعة في طريقها، وليبارك الله حملة الاعتذار، وليكف أيدي جنود الأمن المركزي عن متظاهري الإخوان الذين سيخرجون في القريب العاجل يدافعون عن معتقليهم ويطلبون \"الحرية\" لهم.. ويستمرون في منعها عن هؤلاء الذين \"كفروا\" بهم ووجدوا في عقولهم رأياً آخراً عنهم!<br />لأن الكلاب تعوي والقافلة تسير، وعواء الكلاب بالنسبة لي صوت مزعج بما فيه الكفاية، لا أحتمله.. فضلا عن أني لا أريد أن يشبه أحدهم كتاباتي بصوت لا أحبه.. كما أن تهمة مثل الكتابة في \"روزاليوسف\" لا تروق لشخص مثلي يعتبر قراءة \"روزاليوسف\" في حد ذاتها تهمة فضلا عن الكتابة فيها..<br />للأسباب السابقة أعلن أن المعركة انتهت لصالح الذين بدأوها منذ البداية.. وأقول أنها المرة الأخيرة التي أكتب فيها عن الإخوان ومرشدهم.. (لأنه لا يرشد الجميع) وسأكتفي كما قال لي أبي في نصيحته الأخيرة : \"انقد المجتمع.. ولو عايز تنقد الإخوان.. بلاش والنبي المرشد\"..<br />طالبت أبي أكثر من مرة أن يذكر في كلامه أن المرشد هذا اسمه \"مرشد الإخوان\"، وأن لفظة \"المرشد\" فيها خطأ لغوي، لأنها تن<br />اقرأ بقية التعليق .."
archived = "2007-02-04"
capture_url = "https://web.archive.org/web/20070204012828/http://masr.20at.com:80/article.php?sid=1532"

