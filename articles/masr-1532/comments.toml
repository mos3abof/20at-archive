[[comments]]
order = 17
subject = "روح نام احسن"
author = "خالد"
posted = "2007-02-04"
text = "والله بجد يابراء انت شكلك فاقع ناس كثيرة قوي بكلامك وبمقالاتك اللذيذة واحد اسمه محمد مصطفى بيتلكك على كلامك والاخ اللي لسه منمش ده شوف استقطع من وقته قد ايه عشان يعمل سيرش ويجيب كلام واغاني والاكداده بقى ان كل اللي جابه هنا ميغيرش في الموضوع ولا في الحدث ولا حرف واحد لان الاغنية مش متكررة من الاساس يا استاذ منمتش غير اول بيت وده عادي يعني ممكن الاخ اللي كتب ع المنديل يكون قرأ القصيدة قبل كده وممكن يكون من دماغه يعني هي كل الاغاني اللي في حياتنا متكررة ومتعادة مليون مرة يبقى براء اللي فبرك الموضوع<br />وبعدين ياعم الحلو لو براؤ مفبرك الموضوع مكنش قال ان كان فيه حد معاه كان كتب انه هو بس اللي شاف وده اوقع واسهل<br />وبعدين بمخك اللي على قدك وضيق افقك الغريب واللي واضح منه انك بتكره استاذ براء قوي الموضوع من الاصل مش هدفه القصيدة بقدر ما هو هدفه ايضاح الكبت والضيق والمهانة اللي بنعيشها تقوم تسيب كل ده وتتكلم على موضوع مالهوش اي لازمة<br />ربنا يرحمنا من تعليقات الناس الغريبة دي<br />وانا مؤدب ومش هاستخدم اسلوبك غير المحترم من شتيمة وتعبيرات بذيئة وياريت تخليك في نفسك"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212040502/http://masr.20at.com:80/article.php?sid=1532"

[[comments]]
order = 18
subject = "البراء رضي الله عنه !!"
author = "كمال رضا"
posted = "2007-02-04"
text = "المصريين من قهر النظام ليهم بقو يقهرو بعضهم ومحدش بيتقبل النقد وكلهم تعالي على بعض طيب فيها ايه لما حد ينتقد مقال البراء ولا يهاجم اسلوبه في الكتابه هو خلاص اتحول لصنم الكتابة في الموقع المقرف ده وكأنه منزه عن النقد مس عارف مهلالتية الموقع وهما بالطبه مهلالتية للبراء مش عاجبهم أي حد ميعجبوش كلام البراء وكأنه نبي الكتابة ولا إله الصحافة مع إن موضوعاته منها موضوعات كويسة وموضوعات تفقع المرارة وملهاش لازمة ومع ذلكتلاقي ناس عمالة تهلل للموضوع بالرغم من فقره الشديد وفي بعض الموضوعات كويسة وهنا بقى بتحصل كارثة من المعلقين والمحتفين بالبراء وأنه فتح عكة براحة شوية يا جماعة البراء البلد مش ناقصة مشاحنات وقلة حيلة وصدقوني مجموع إلي بيخدلو الموقع على بعضهم لا يتجاوز المائة شخص الواحد منهم بيخدل الموقع أكتر من مرة في اليوم وبالتالي الموقع بيعد زوار على الفاضي ده غير العاملين في الموقع إلي طول النهار عمالين يحدثو ويرفرشو الموقع وبالتالي الرانك بتاعه بيزيدهدو اعصابكم الموضوع ابسط منه مفيش<br />الشللية والجيوب والتطبيل والتهليل صفة المصريين من قديم الازل<br />انا لسة جاي من برة مصر وطول عمر برة مصر وكان نفسي استمر فيها بس بالوضع ده هاخد الاربع سنين بتوع الاكاديمية وهرجع تاني الوضع سئ للغاية"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212040502/http://masr.20at.com:80/article.php?sid=1532"

[[comments]]
order = 19
subject = "حسبي الله ونعم الوكيل"
author = "البراء أشرف"
posted = "2007-02-04"
text = "لا لا لا لا ..<br />بجد حسبي الله ونعم الوكيل..<br />الأخ اللي لسه منامش..<br />يا عم روح نام بس شوية وتعالى هتكتشف انك انت اللي غلطان..<br />انت عايز تفهمني انك مسمعتش اغنية محمود العسيلي يبقى انت اكيد في مصر<br />يا عم الشاب اللي انا قابلته ده كان بيحاكي الاغنية يا عم الناصح وبيكتب معاني مختلفة تانية عنها<br />لان في اغنية مشهورة جدا اسمها يبقى انت اكيد في مصر غناها وألفها ولحنها محمود العسيلي بالاشتراك مع آخرين وبرعاية الحزب الوطني<br />انما القصيدة المنشورة رغم ركاكتها فهي مجدر محاكاة للأغنية الاصلية اللي مصر كلها عارفاها وبالتالي رأيت اني هبقى بعيد اكتشاف البخار لما اقول انها قصيدة بترد على الاغنية لان المعنى مفهوم في \"بطن\" الشاعر..<br />عموما يا سيدي اديني بقولك ان الاغنية معروفة جدا.. ده مبدئيا<br />ثانيا بقى..<br />هو انا اللي كتبت القصيدة؟؟<br />الحقيقة ده محصلش.. انا كنت قاعد لا بيا ولا عليا خارج مع اصحابي ولقيت الشاب ده جالنا لوحده وكتبت موضوع هدفه الاساسي الكبت مش القصيدة<br />عموما يا عمي روح نام بس وروق شوية.. وربنا يعلم انت أسعدتني قد ايه بتعليقك اللي الحمد لله خلاني افهم الفرق بين المعلق القارئ والمعلق القاتل أمثال حضرتك.. أوعى تزعل مني .. أنا بهزر معاك.<br />اعتبر اللي حصل ده كله حكاية قبل النوم.. تصبح على خير<br />البراء أشرف<br />baraa_ashraf1@yahoo.com"
archived = "2007-02-12"
capture_url = "https://web.archive.org/web/20070212040502/http://masr.20at.com:80/article.php?sid=1532"

