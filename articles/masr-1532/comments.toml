[[comments]]
order = 0
subject = "الهندي"
author = "فعلا"
posted = "2007-02-02"
text = "فعلا الكتابة عن النفس عند الصحفي تمثل الكتابة عن الناس<br />وبخاصة لم يكون اللحظة توكد ان المشكلة في الناس والمشكلة في الدنيا<br />والمشكلة فعلا تكاد تبكي الواحد<br />الي انت قابلتة يا براء<br />مش واحد وعدي عليكم وخلاص<br />لا ده واحد تقريبا مش عايش<br />مدمن<br />بيحب مصر<br />عاطل<br />وبيحب مصر<br />ولما حس انة شاعر<br />قال انة بيحب مصر<br />واوعوا حد ينسي اننا بحب مصر<br />وكلنا بحب مصر<br />\" مصر بلادنا ومش هنبعها \"<br />h_elhandy@hotmail.com"
archived = "2007-02-04"
capture_url = "https://web.archive.org/web/20070204012828/http://masr.20at.com:80/article.php?sid=1532"

[[comments]]
order = 1
subject = "هي إيه حكاية \"حمص الشام\" معاك !!"
author = "محمد مصطفى"
posted = "2007-02-02"
text = "كتير بتكتب عن مغامراتك وتجولاتك في القاهرة وشوارعها..جميل ومفيش مشكلة..بالرغم من أغلبها على المستوى المهني وحتى على مستوى الفكرة مش قوي ..على عكس رأي السادة المعلقين في التعليقات إلي بتهلل بمجرد ظهور مقال للبراء أشرف ..مش عارف على إيه؟!..يمكن في إطار المجاملات من أصدقاء أو مقربين<br />ولكن الموضوع إلي شد انتباهي.هو \"حمص الشام\"..بالنسبة ليه أنا قريت ليك حوالي أربع موضوعات مش أكتر ..وكتير ورد ذكر حمص الشام في مقالات ليك ودايماً \"حمص الشام\" في مقدمة المقال أو ما يطلق عليه موضوعات بتكتبها..<br />ممكن أعرف السبب ؟!!"
archived = "2007-02-04"
capture_url = "https://web.archive.org/web/20070204012828/http://masr.20at.com:80/article.php?sid=1532"

