subject = "خلاص انا رفعت الراية البيضائ"
author = "يا جماعة من غير تعديلات دستورية ولا بطيخ انا موافق على ترشيخ جمال مبارك خلفا للسيد حسني مبارك وكفاية معتقلات وكفاية امن دولة."
posted = "2007-01-18"
text = "خلاص يا جماعة انا رفعت الراية البيضاء ومرحبا بجمال مبارك رئيسا لمصر خلفا لوالده حسني مبارك."
