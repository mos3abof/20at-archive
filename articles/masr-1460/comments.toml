author = "H.M"
posted = "2007-01-19"
text = "مجلس 3/4 أعضاؤه مطعون في عضويتهم قانونيا (لو في قانون يحترم) والواقع يؤكد إنهم مزورون هذا بالإضافة إنهم دائما موافقون أو منافقون لأن ولاؤهم للكرسي والحصانة مش لمصر وبيبرروا للحكومة أخطاءها مش بيحاسبوهاوبعد كده تريدون تعديلات دستورية لمصلحة مصر من المجلس الموقر ( المزور ) سيد قراره صباح الخير"
