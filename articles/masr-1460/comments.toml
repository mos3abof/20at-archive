subject = "التعليق"
author = "الدشم"
posted = "2007-01-18"
text = "ايوه كده ياللى رفعت الرايه البيضاء انت فى النهايه لا يبقى الا الحق فعلا هو جمال مبارك الاحق بالحكم بعد والده اطال الله عمره وياريت ناس تانيه كمان تفكر زيك كده<br />نعم للتوريث ولاستكمال المسيره"
archived = "2007-01-19"
capture_url = "https://web.archive.org/web/20070119203142/http://masr.20at.com:80/article.php?sid=1460"

[[comments]]
order = 3
subject = "الاخوان نوارة المجلس"
author = "ياسر أبو عمار"
posted = "2007-01-18"
text = "طيب والاه العظيم انا ما عارف المجلس ده من غير الاخوان كان هيبقى عامل ازاى ؟لانه الواضح للعيان ان مفيش غيرهم بيتكلم الا 5 افراد تقريبا وهما المعارضين المعروفين بالاضافة الى السيد مصطفى بكرى مبرر النظام والذى يتم استخدامه من جانب الحكومة بشكل مؤسف لمواجهة الاخوان والمعارضين .<br />تخيلوا لو ان الـ88 عضو بتوع الاخوان مكانوش فى المجلس كان هيبقى شكله يفرح!!!!!<br />مع الاخذ فى الاعتبار ان الاغلبية موافقة على كلام الحكومة على طول الخط ،انا بتكلم عن الدور فى النقاش واثارة القضايا وطرح هموم البشر اللى مش لاقيين حد من البهوات بتوع الحزب الوطنى بيسال فيهم .وكفاية اقول نموذج تاشيرا الحج الخمسة لكل نائب ،كلنا عارفين إن نواب الاخوان عملوا عليها قرعة ووزعوها على الناس اما البهوات بتوع الوطنى باعوها بعشرة الاف جنيه اما المحترمين منهم فاعطوها لحبايبهم وقرايبهم ،شفتوا الفرق؟"
archived = "2007-01-19"
capture_url = "https://web.archive.org/web/20070119203142/http://masr.20at.com:80/article.php?sid=1460"

