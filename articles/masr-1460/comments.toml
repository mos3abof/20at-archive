[[comments]]
order = 1
subject = "من يحكم"
author = "انا لا يهمنى من يحكم ولكن يهمنى فى المقام الاول توفير الضروريات للناس"
posted = "2007-01-18"
text = "لكل انسان الحق فى ان يعمل ويكسب ويتزوج ويجد سكن مناسب<br />ويعيش حياة فيها شىء من الادامية<br />لا يوجد شعب يحكم يقانون الطوارىء لمدة 26 سنة ولا حدثت فى اى دولة متقدمة او متخلفة الا فى مصر وسوريا<br />فى زمان الهنا حينما كانت الشرطة تريد القبض على اى شخص كانوا بيبعتوا مخبر يجيبة<br />انما دلوقتى لو عايزين يقبضوا على واحد بيبعتوا كتيبة وامن مركزى وسيارات ومدرعات ويحاصروا المنطقة وسلم نفسك يازعبور يا هنضربك بالهاونات<br />حدث هذا فى اعتقلات سيناء وغيرها<br />عايزين سيادة القانون الرحيم<br />الحكومة ليست عدو الشعب الحكومة جزء من الشعب ويجب ان تحترم ناسها"
archived = "2007-01-19"
capture_url = "https://web.archive.org/web/20070119203142/http://masr.20at.com:80/article.php?sid=1460"

[[comments]]
