[[comments]]
order = 11
subject = "التغيير"
author = "محمد خميس"
posted = "2006-05-28"
text = "دائما نتحدث عن التغيير ونلوم غيرنا ولكني اجد ان التغيير لم ياتي من أعلى ولك التغيير يأتي من أسفل لايغير الله بقوم حتى يغيروا ما بأنفسهم ولو كل اسان أصلح نفسه من الرشوة وأصلح ذات البين مع اسرته مع اخوته مع ابوه وامه مع ابنائه من هنا يبدا التغيير عندما نكون يد واحدة وعندما نكون قادرين على حب بعضنا وعندما نكون قادرين على تكوين اسرة حقيقية تخاف على بعضا البعض عندما يكون هناك انسان يضحي من اجل اسرته فالبتالي يكون هناك انسان يضحي من اجل بلده نقول ان هناك تغير في كل شئ وعلى جميع المستويات وعندما يكون هناك انتماء للوطن وللبلد من هنا يبدا التغييرفهذه نصيحة لكل انسان يقرأ هذه الرسالة ان يبحث عن عيوبه قبل عيوب الاخرين ولا يصنع شماعة يعلق عليها اخطاؤه ومشاكله فكلنا عيوب وكلنا أخطاء ويجب علينا مراجعة أنفسنا واصلاح انفسنا أولا حتى يعينا الله على التغيير وحتى يكون هناك هدف واضح لنا نبحث عنه في كل مكان فالمجتمع يتكون من الاسر والاسر تتكون من الافراد فعندما يصلح كل فرد نفسه يصبح المجتمع مجتمع صالح ينتج لنا قادة صالحين قادرين على التغيير 0"
archived = "2006-09-29"
capture_url = "https://web.archive.org/web/20060929094117/http://masr.20at.com:80/article.php?sid=63&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

