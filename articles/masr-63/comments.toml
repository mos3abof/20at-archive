[[comments]]
order = 13
subject = "مش معقولة اللى انتو بتقوله"
author = "محمد"
posted = "2006-06-05"
text = "ده مش طريقة نقد و لا طريقة كلام واضح من كلامكم ان الموقع من اجل التحدث عن الحكومة و مسيرات الحكومة مثل العديد من الاقلام و العديد من الشخصيات و التى وجدت ان ذلك الاسلوب و ذلك الطريق سيدر عليها اما شهرة او دخل او ماشابه<br />ان كنتم تتحدثون عن الحقوق و عن الادب و الاخلاق .... هل يجب لنا ان نتطرق الى تعريفة الركوب و بالله عليكم لتطلبوا من السائقين بموقف دسوق و المعتصمين ان يجيبوا على بعض الاسئلة ؟<br />1- لماذا يتم تحميل الركاب يوم الجمعة لسفر الطلبة و الموظفين ب 10 جنيها ؟<br />2- لماذا يتم تحصيل الاجرة فى الايام العادية ب 7.5 جنيه في حين انها 6.5 فقط<br />3- و اسئلة كثيرة و كثيرة<br />ام انكم وجدتكم ان ذلك الجانب سيرضى راى الكثيرين"
archived = "2006-09-29"
capture_url = "https://web.archive.org/web/20060929094117/http://masr.20at.com:80/article.php?sid=63&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

