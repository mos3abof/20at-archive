text = "والله الموضوع ده جامد جدا وفعلا كا عايز وقفه رجاله لان الاسر دى كلها كانت هتعيش منين اصل دخل السواق مش بيكفىمتطلبات الاسره هيجب منين 10 الاف جنيه والله ده ظلم"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022228/http://masr.20at.com:80/article.php?sid=63&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 5
subject = "نعيب زماننا والعيب فينا وما لزماننا عيب سوانا"
author = "أحمد دياب"
posted = "2006-03-26"
text = "السلام عليكم<br />للآسف يا مروة أنتى موضوعك جميل جدا ويستحض الاهتمام بس أى حد دلوقتى بيعمل حاجة غلط أو حاجة ميقدرش يصححها يلعن فى الزمن اللى أحنا فية مع أن العيب فينا أحنا بجد (نهجو الزمان بغير ذنب ولو نطق الزمان لهجانا)<br />يارب يا مروة تكونى فهمانى<br />ويارب تكون بداية سعيدة عليكى"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022228/http://masr.20at.com:80/article.php?sid=63&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

