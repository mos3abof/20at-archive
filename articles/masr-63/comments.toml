[[comments]]
order = 23
subject = "دسوق عروس النيل"
author = "الجوكر حمو"
posted = "2006-12-07"
text = "بسم الله الرحمن الرحيم انا من دسوق وبحبها جدا وموت بس لاكن الموضيع فى الفساد كتيره وفى كل شى فى البلديه وفى مجلس المدينه والنادى الرياضى واستاد دسوق الرياضى والاداره التعليميه وفى المركز اولا البلديه من حيث الزباله وماء المجارى الطفحه اللى بتقعد بالاسبيع من غير حتى ما يعبروها ومن جهه اخرى مجلس المدينه اللى نازل مناقصات على الفاضى وعلى المليان فى حاجات هايفه زى دهن عواميد النور وحاجات هايفه زى دى ولا يهتموا بالناس الاول وبعدين يهتموا بالعواميدمن الااخر دول حراميه ومنهم لله لان دسوق بلد ليه شهرته فى باقى انحاء الجمهوريه لسيدى ابراهيم الدسوقى والبلطجيه اللى مش لاقيين اللى يلمهم والحكومه اللى بتلمماشيه تعبط فى الناس على الفاضى وع المليان والمخبرين اللى عيزين يخدمو البلد فى الشتاء زباله لان البشوات الكناسين نايمين فى بيوتهم واللى قاعد ع القهوه حرام واللهى الجوكر عاشق دسوق"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216231554/http://masr.20at.com:80/article.php?sid=63&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 24
subject = "دسوق"
author = "واحد قرفان من سائقى دسوق"
posted = "2006-12-08"
text = "انا لو مسئول عن التراخيص اسحب كل التراخيص من السائقين بتوع دسوق واراهن اى حد بيركب من موقف عبود او دسوق يقول حاجة غير كدة السائقين الى عاملين اعتصام شفوهم بيعملو اية فى الركاب معاملة حيوانات لما الاجرة 7.5 ج يركبو ب 10ج وفى الاخر يعملو اعتصام كمان (ومن اعمالكم سلاط عليكم ) هو دة الواقع ما تتجدعوش."
