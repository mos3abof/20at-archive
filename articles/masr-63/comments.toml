posted = "2006-03-24"
text = "بصراحه يا انسه مروه الموضوع جامد وبالنسبه لبلد صغيره زى دسوق دى حاجه حلوه خالص يعنى وربنايكرمك ويوفقك فى طريقك"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022228/http://masr.20at.com:80/article.php?sid=63&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 3
subject = "هو ده حالنا علطول"
author = "محمود"
posted = "2006-03-24"
text = "بجد الموضوع فعلا محتاج لوقفه من جانب الحكومه<br />علشان كده كفايه بقه اوي وحرام<br />حرام اللي بيحصل للمواطن المصري<br />المواطن المطحون زي ما بيقوله عليه في دول الخليج ومعظم دول العالم كله<br />ولازم يبقي فيه تغير<br />والتغير ده مش هيجي غير الا اذا كل واحد من الحكومه عرف شغله كويس<br />وكل واحد من المواطنين عرف اد ايه القانون بيكفله حقوق كتير<br />بس للاسف المواطن المصري مش عارف القانون كويس ومش هيعرف حقوقه الا اذا عرف قانونه الاول<br />يا رب نفهم<br />يا رب نتغير بقه<br />لاحسن كده خلاص احنا تعبنا اوي<br />ملحوظه .<br />الف مبروك يا انسه مروه علي اول تحقيق صحفي ليكي<br />محمود<br />وبجد ده ممتاز بالنسبه ليكي كمبتدئه<br />يارب الي الامام علطول والي النجاح دائما"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022228/http://masr.20at.com:80/article.php?sid=63&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
