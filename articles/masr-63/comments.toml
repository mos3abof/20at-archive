text = "اولا شكرا لللانسة مروة على شرحها للموضوع .<br />ثانيا انا من دسوق وعايش كل المقاسى اللى بتعيشها الناس فى دسوق ودة لسبب بسيط ان الحكومة لسة على فكرها القديم ان دسوق بلد صغيرة واهلها غلابة ومش فاهمين الحكومة .. بالعكس الناس واعيين جدا ومتحضرين ومتمدنين وعارفين الحكومة عاوزة اية ..<br />الله يكون فى عونك يامصر ."
