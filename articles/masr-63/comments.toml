[[comments]]
order = 0
subject = "مصر وحالتها الان"
author = "ahmed"
posted = "2006-03-23"
text = "سلام عليكم<br />انا معجب بالموضوع ده عشان ده حاجات موجوده فعلا مش بس في دسوق لكن في مصر كلها فيه استغلال في والسواقين بيستغلوا الناس وبيرفعوا الاجره لما يبقي فيه زحمه والمستشفيات الحكوميه الناس مرميه بالكوم ومحدش بيسال فيهم يظهر الشعب كتر وعايزين يخفوا الحمل شويه عشان الحاله الاقتصاديه صعب جدا<br />انا مبسوط بان فيه ناس بهتم بامرنا جدا وبتشوف امور الناس وبتعيش معاهم"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022228/http://masr.20at.com:80/article.php?sid=63&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 1
subject = "دا حال البلد"
author = "محمد سمير"
posted = "2006-03-23"
text = "اولا بشكر الاخت مروه على مجهودها ف التغطيه المتميزه والصور المهمه دي.<br />بس موضوع الرشوه ده سوسه بتنخر في قوام المجتمع<br />وبقت الوظايف برشوه والمصالح برشوه<br />انا خايف الهوا يكون برشوه ف المستقبل<br />ومش ف المجال اللي انتي كاتبه فيه بس يا مروه اللي لازم الناس تحس بي..<br />بس عشان نقدر ان احنا نكون حاجه لازم اغلب نشاططتنا تنضف من الرشوه<br />ميرسي على موضوعك ومستنين جديدك"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022228/http://masr.20at.com:80/article.php?sid=63&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 2
subject = "بايظه جامد يا دسوق"
