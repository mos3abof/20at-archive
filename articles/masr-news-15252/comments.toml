text = "هيراقبوا اية فى الجامع والخطيب متعين باختيار الجهات الامنية - وخطبة الجمعة موحدة وبتيجى من الاوقاف<br />وبعدين اللى بيتأمر وعايز يعمل مشاكل مش هيروح الجامع ويفضح نفسة الا اذا كان اهبل وبيقول لهم امسكونى<br />ثم ان معظم رؤساء اقسام وادارات وزارة الاوقاف زى بقية الوزارات اصبحوا لواءات عسكريون سابقون<br />يبقى هتراقبوا اية بقى<br />كم واحد بيدخل الجامع وكم واحد بيخرج منة<br />وبعدين سيادة الرئيس فى خطابة الاخير قال ان اسباب مشاكل الفتنة فى نجع حمادى هو ضعف الخطاب الدينى فى الجامع والكنيسة<br />ضعف الخطاب الدينى يا سيادة الرئيس بسبب التدخل الامنى"
archived = "2010-02-09"
