[[comments]]
order = 7
subject = "my naughty brother"
text = "An excellent article which proves that I am right when I call you naughty because it shows what a naughty journalist you are<br />موضوع جميل و اختيار موفق للعبارات و الصور .. اختيار ينم على حس ساخر و قدره كبيره على ربط الحاضر بالماضى .<br />برافووووووو نوتى على .<br />لكن فى سؤال احب ان اطرحه .. ما هى امريكا ؟ هل القبح فى الشعب ام فى النظام الحاكم ؟ المشكله فى اعتقادى هى مشكلة نظام - و هى مشكله جميع الدول و نحن خير برهان على ذلك - لان الامريكيين انفسهم، المواطنيين العاديين رافضيين لاحتلالنا ، رافضين لسياسات القمع و الاضطهاد ، مقتنعيين فعلا بافكار الحريه و الديمقراطيه و العداله .. انك تستطيع ان تكسب دعم الكثير من الامريكيين اذا ما خاطبتهم بالعقل و هم شعب قادر على التحرك و التغيير اذا ما اقتنع . لقد خرجت مظاهرات ضخمه فى 50 ولايه امريكيه خلال الذكرى الاولى لاحتلال العراق ، تطالب بضروره سحب الجنود من العراق و انهاء الحرب فى افغانستان . ان الامريكيين مثلهم مثل اى شعب اخر لهم نفس المزايا و نفس العيوب، هم يختلفون فقط فى قناعتهم بافكر الحريه و العداله لو نظرنا الى تاريخ مجتمعهم المدنى سنجد ان كثير من قضايا الفساد التى تم الكشف عنها كان ورائها مواطن قرر ان يرفض ، و لعل الكشف عن فضيحة سجن ابوغريب دليل على ذلك .. الفرق بيننا و بين الغرب بشكل عام هو امتلاك الغرب لمؤسسات لمراقبه و محاسبه الحكومه اما نحن فلا نملك سوى ابواق . و هذا ليس دفاعا عن امريكا او شعبها فهم ليسوا ملائكه ، و لكنهم ايضا ليسوا شياطين و نحن نتحمل كثير من وزر ما نعانيه فساستهم لم ينجحوا فى اذلالنا الا لما اذللنا نحن انفسنا .. لذا فليكن خطابنا عقلانيا ."
archived = "2004-10-25"
capture_url = "https://web.archive.org/web/20041025144202/http://www.20at.com:80/article.php?sid=422"

