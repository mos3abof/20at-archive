text = "موش المهم اننا نعرف ان فلان قال وعلان طلع لسان وترتان سب ولعن في امريكا ..المهم اننا نعرف احنا هنعمل ايه ضد امريكا اللي محتلة أرضنا ودماغنا وأكلنا وشربنا ولبسنا وكله ...<br />هنعمل ايه ضد امريكا وسياستها اللي اصبحنا كلنا جزء منها ..؟؟!!<br />محدش يستغرب هي دي الحقيقة أمريكا بتنتصر اكتر وكتر كل يوم طول لاننا موش عارفين نقتل شبحها جوانا ..!!<br />ما علينا ..أنت يا ولد يا اللي اسمك علي ..<br />أحنا موش قلنا انك هتبطل كتابة ...؟<br />علي العموم سماح المرة دي ...الموضوع حلو فعلا ..!!"
