text = "لا اعلم هل اعلق على ابداع الاستاذ على و اختياره لعبارات و جمل على ألسنة شخصيات، تعتبر كشف لأكذوبة الولايات المتحدة الأمريكية و فضح لها، أم اعلق على هذا التاريخ و الحاضر و المستقبل الأمريكي الملطخ بالعار و دماء الأبرياء ...لا اعلم على ايهما اعلق<br />و لكن ليت \"امعات\" الوطن العربي، يعووا ما كتبه على و لا عزاء \"للكبار\""
