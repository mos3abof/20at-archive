order = 0
subject = "حسبي الله ونعم الوكيل"
text = "ما زال طلبة كلية الآداب بجامعة القاهرة يصلون في مساحة متر ف متر مضافا إليها طرقة تفتح على المخزن.<br />وحسبي الله ونعم الوكيل"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035551/http://www.20at.com:80/article.php?sid=299"

[[comments]]
order = 1
subject = "واحد من الشعب"
text = "هناء وهناك الكثير والكثير من المسلمين الذين ليس لديهم اعزار ولديهم الوقت والمساجد ولا لكنهم لا يدركون قيمةهذه الصلاة وهذه النعمةالتى هما بها والوقت الذى لديهم"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035551/http://www.20at.com:80/article.php?sid=299"

[[comments]]
order = 2
subject = "حسبنا الله"
text = "ومازال طلبة كلية الإعلام جامعة القاهرة يصلون تحت السلم في مكان أشبه بالبدروم"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035551/http://www.20at.com:80/article.php?sid=299"
