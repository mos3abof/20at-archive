[[comments]]
order = 11
subject = "رسالة الى شباب مصر"
author = "ابراهيم الدسوقى السيد"
posted = "2006-05-11"
text = "السلام عليكم ورحمة الله وبركاته<br />السيد رئيس الجمهورية محمد حسنى مبارك انه احسن رئيس مسك مصر وانا بحبة جدا لانه حامى دولتنا من الاعداء وهو من اعظم شخصيات مصر على الاطلاق انا فخور ان الرئيس ده مسك مصر ويارب يمسك طول العمر وانا بتمناله الف صحة والف سلامة وربنا يخليه لمصر ان شاء الله تكون مصر فى سلام ورخاء فى حكمه والسلام عليكم ورحمة الله وبركاته"
archived = "2006-09-08"
capture_url = "https://web.archive.org/web/20060908172032/http://masr.20at.com:80/article.php?sid=235&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

