[[comments]]
order = 1
subject = "دعاء الى الله العلى القدير بالشفاء"
author = "عاطف"
posted = "2006-06-05"
text = "ندعو الله العلى القدير له بالشفاء العاجل من أجل اسرته الصغيرة واسرته الكبيرة مصر ، هذه نوعية قليلة ونادرة من الرجال المحترمين ومصر فى حاجة الى المزيد من هذ النوعيةلكى يبقى فليل من الخير فى وجه هذا الطوفان من الشر"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120949/http://masr.20at.com:80/article.php?sid=455&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "الى كل شرفاء مصر من الشعب و الجيش..الثورة الآن"
author = "مصرية"
posted = "2006-06-05"
text = "كلنا ندعو الله من قلوبنا لشفائك..أنت ورفاقك مثالا للشرف والكرامة والأمل فى الخلاص..ولاحل للخلاص من هذا الفسادسوى بالثورة..الثورة الآن ياكل الشرفاء من الجيش والشعب ..انقذوا الوطن..لقد جاوز الذل والهوان المدى..لالالالالالالالالالالالا للقرصان وسلالتة وعصابتة...ونعم..نعم..نعم..لثورة الجيش والشعب ضد الظلم والفساد..اللهم اجعله يوما قريبا..آآآآآآآآمين"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905120949/http://masr.20at.com:80/article.php?sid=455&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

