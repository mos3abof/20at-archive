author = "اوعى تطنش"
posted = "2009-10-22"
text = "فية حاجات ممكن تطنش فيها<br />انما يوم الخميس على الغداء الست زوجتى دايما تذكرنى الليلة دى ليلة الجمعة واوعى تطنش<br />وطبعا بيبقى يوم جمعة اسود لو طنشت - من الساعة 6 صباحا المراتب لازم تطلع تتشمس والتنفيض يشتغل ومتعرفش تنام ساعة الصبح على بعضها"
archived = "2009-10-26"
