author = "جيمـي"
posted = "2009-10-21"
text = "الحل مش متجسد فى تصرفات الناس على قد مهو متجسد في إن الإعلامي يفهم دوره كويس<br />وأنه صاحب رسالة قبل ما يبقى صاحب السبق فى الفضايح<br />وأنه يفرق بين اللعب علي الأحداث الساخنة وقواعد اللعب عليها وبين الفضائح<br />وأنه يتعلم يعنى أيه مهنية إعلامية وميثاق شرف إعلامي .<br />وانه يعرف انه المفروض أنه محطوط فى مكانه ده علشان يقدم برنامج يخدم بيه الناس مش يعرض مشكلة بين اتنين ويتابعها وكل كام حلقة نلاقيه جايب حد من الأتنين الى بيتخانقوا … طب واحنا مالنا<br />برغم أن كل الإعلاميين الى فردوا مساحة جامدة جداً للموضوع ده .. هم من الإعلامين الكبار ( المفروض ) لكنهم للأسف معرفوش يتجنبوا الفخ ووقعوا فيه ."
archived = "2009-10-26"
capture_url = "https://web.archive.org/web/20091026180806/http://www.20at.com:80/masr/t7kyk/13782-2009-10-21-13-28-00.html"

