subject = ""
author = "طنش وابتسم"
posted = "2009-10-23"
text = "الناس فاضية<br />فية ركود حاد فى الحياة المصرية والناس تتنفس تحت الماء<br />ومفيش واحد بيعمل اى حاجة فى اى حاجة ولا فية مشروع بيتبنى علشان يجيب دخل بكرة ويحسن وضع البلد<br />سكوت المقابر<br />لو رحت المقابر هتلاقى نفس السكوت<br />يبقى لو شوبير ضرب جيص ورد علية مرتضى بحزقة جامدة او واحد من الاخوان كح او عطس او واحد شاذ قعد فى فندق يبقى نهار ابيض الفضائيات تشتغل وبرامج الشو تشتغل والف صفحة فى الف جريدة تنكب ومليون واحد يتناقشوا والبرامج فى كل مكان<br />هيصة<br />البلد فى هيصة<br />زفة يا ابا الحاج<br />مولد وصاحبة غايب<br />يبقى طنش<br />وفى اقسى ايام الشدة كنا نقول<br />انظر الى الجبل وطنش وابتسم"
archived = "2009-10-26"
capture_url = "https://web.archive.org/web/20091026180806/http://www.20at.com:80/masr/t7kyk/13782-2009-10-21-13-28-00.html"
