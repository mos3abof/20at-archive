text = "مثله كمثل الكلب ان تحمل عليه يلهث وان تتركه يلهث.ومثله كمثل الحمار يحمل اسفار.وضرب لنا مثلا ونسي خلقه قال من يحيي العظام وهي رميم قل يحيها الذي انشائها اول مره وهو بكل خلق عليم.وذللك مثلهم في التوراه ومثلهم في الانجيل كزرع اخرج شطاه فائزره فاستغلظ فاستوي علي سوقه يعجب الزراع ليغيظ بهم الكفار.وانا لله وانا اليه راجعون"
