posted = "2009-12-15"
text = "أشكركم في عشرينات على هذا الموقع الجميل الذي أرتاده يويما , ولكن لا أقم بالتعليق أما عن هذا الموضوع فستفزني وأجبرني على التعليق ::<br />صراحة لا أرى تعليق أكتر من الكلام الموجود في المقال نفسه , يعني أن هو كان دليليه عن قبح الأسلام في قصة الزواج ومثل تلك القصص رغم أن للدين الإسلامي حكمة في مثل تلك الأمور وحفظ وصون لحقوق الزوجة وحفظ لكرامتها , فأنا أرد عليه بقبحه هو وحزبه ومن يتبعونه ويقدسوه بأنهم عنصريين محدودين التفكير , يكفي على من يتبعوه أنهم يقدسوق هذا النقصان بعينه , فهذا كله إن دل على شئ بدل على قصور عندهم , لن أتحدث بكثرة خوفا من الوقع في الغلط والتجريح , فليحتفظوا بعنصريتهم المنتنة وبأسلوبهم المقزز , ولنبقى نحن المسلمين كما نحن نطبق ديننا ونحافظ عليه ,,<br />أكرر شكري لكم إخواني :)"
