text = "اود في االبدايه شكر من نقل إلينا هذا الموضوع<br />أما بالنسبه للرد على هذا الموضوع فيكفي أن أقول له : لو أن فعلا السلام دين قبيح كما تدعي فلم يتوافد إليه الناس أفواجا كل يوم ؟ هل كلهم أغبياء لا يفهمون تلك الأشياء المخزية التي تذكرونها أم انكم أنتم من العمى بمكان حتى لاتروا حقيقة هذا الدين العظيم و عظمته؟<br />و لكن دائما الشجرة المثمرة ترمى بالحجارة و حسبنا الله و نعم الوكيل"
