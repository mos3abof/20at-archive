[[comments]]
order = 1
subject = ""
author = "سمر محمد"
posted = "2009-12-15"
text = "( والله متم نوره ولو كره الكافرون ) صدق الله العظيم<br />ازاي رجل دين بجد مؤمن بدينه يهين اي دين سماوي وخاصة الاسلام<br />الاسلام اعظم واكرم من اي حد يتكلم عنه<br />اصل اليهود متعودين على النجاسة و الفحش والزنا والرزيلة<br />ما يفرق معاهم زواج او طلاق او حرمانية<br />الاسلام بيكبر و يتنشر لانه دين السماحة و اليسر<br />وزي ما قال احد الاشخاص هنا<br />اان الطلاق مباح عشان اذا استحالت العشرة بين الزوجين يقدروا يكملوا حياتهم مع شخص اخر يحبونه واذا كان لابد من محلل عشان يرجع الزوج لزوجته فهنا اذا طلق الزوج زوجته تلات مرات فقط في هذه الحالة<br />لكن<br />كل يوم اليهود وغيرهم من العنصرين و اعداء الاسلام بيثبتوا للعالم كله من غير ما يحسسوا ان الدين الاسلامي دين الحق والنور و ان دينهم الذي حرفوا بايديهم باطل مليان عيوب لانه من صنع بشر و خاصة اليهود<br />الخلاصة ان عمره هو ولا غيره هيقدروا ينزعوا الدين الاسلامي او يغيروا نظرة العالم ليه"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224115659/http://www.20at.com:80/20at/religious/14413-2009-12-15-11-34-24.html"

[[comments]]
order = 2
subject = ""
author = "امة الله"
posted = "2009-12-15"
text = "اقول لشايب العايب دا اتلهي على شيبتك<br />الدين الاسلامي اطهر منك ومن مليون واحد زيك<br />اتفووو عليك وعلى امثالك يانجس ياابن النجس<br />المهم ..<br />السبب الاساسي .. عشان الرجال مايستسهلوش الطلاق ..حتقول طب ليه ديننا فيه طلاق اصلا<br />حقولك عشان إباحة الطلاق ، من محاسن الإسلام ، ذلك أن الزواج قد لايمكن استمراره لسبب من الأسباب ، وتصبح العشرة بين الزوجين متعذرة ، وفيها مضرة كبيرة على الزوجين ، فيكون الزوج أو الزوجة بين خيارين :<br />أحدهما أن يتخذ الزوج عشيقة أو الزوجة عشيقا مع بقاء عقد النكاح إذا كان الطلاق لا يصح ، ومن فعل هذا فقد أغضب الله تعالى .<br />الثاني : أن يفترقا ، ويرى كل سبيله ، كما قال تعالى ( وإن يتفرقا يغن الله كلا من سعته ) ، وهو الطلاق الشرعي .<br />فاكيد بالعقل والمنطق الطلاق افضل من الرذيلة ياشعب الرذيلة<br />بختصر ياشايب ياعايب الحكم الشريعي في نوع من الترهيب والعقاب السليم<br />انكم تتطاولون على الاسلام بدون ادلة صريحة دامغة وتفهمون الاسلام ونصونه على اهوائكم<br />وبعدين انت مال اهلك بدين الاسلام<br />ديننا واحنا احرار ومبسوطين بيه ومقتنعين بيه وندعه الله يثبتنا على دين الاسلام<br />دين حبيبنا محمد صلى الله علي وسلم"
archived = "2009-12-24"
capture_url = "https://web.archive.org/web/20091224115659/http://www.20at.com:80/20at/religious/14413-2009-12-15-11-34-24.html"

