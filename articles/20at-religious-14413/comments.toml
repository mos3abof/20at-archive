text = "بسم الله الرحمن الرحيم ..منذ ظهور الاسلام وهناك من يبحث فيه عن ثغور ولكن دائما يرد كيدهم فى نحورهم …وهذا الذى يرى ان فى الاسلام قبحا لان الطريق الوحيد لكى تعود الزوجة لزوجها ان تتزوج بغيره زواجا شرعيا وان تنفصل عنه انفصلا طبيعيا …أن هذا من جمال الاسلام وتقديسه للعشرة الزوجية فقد اعطى الاسلام فرصة للزوج ثلاث مرات وبعد ذلك لابد ان يدفع الثمن غاليا لكى تعود اليه زوجته ويكون عبرة لمن يستهين بالزواج ويعرف ان الزوجة كنز وثمن استعادته غالى الثمن فهل هناك اصعب من ان يتخيل الرجل ان الطريق الوحيد لكى تعود اليه زوجته اذا طلقها رجل اخر فلن يستهان بالطلاق …لأنها مسالة كرمة ولايشعر بها من انعدمت عنده الكرامة…!!!"
