[[comments]]
order = 4
subject = "كفاية تفاهات"
author = "jehad"
posted = "2006-08-18"
text = "ندمت اشد الندم على تضييع 5 دقائق من وقتي الثمين لقراءة مقال تافه كهذا اين جندالله ومن ينصر الاسلام وكيف وهذا هو حالنا والمصيبة ان يكون حال شبابنا<br />قررت ان لا ادخل على اي موقع والا اقرا شيئا الا بعد ان احدد هدفي<br />ان كان الكاتب وقته بلا ثمن فينبغي ان يحرص على وقت الاخرين فهو عمرهم والدقيقة اغلى من الذهب لان الذهب ينتهي بانتهاء الدنيا اماالدقيقةسيحملها الانسان على ظهره ليقابل بها الله فيساله عنها<br />انظرو في حال المسلمين وما يحتاج اليه اسلامنا من اجتهاد ف الدنيا لنفوز بالاخرة<br />استخدمو النت للتعرف على دينكم فصفحاته ستشكوكم الى ربها<br />علماؤنا بذلو حياتهم لنتعلم ديننا بايسر السبل وامتعها ونحن صارت حياتنا بلامعنى<br />ادخلو على موقع الطبيب الواعظ بارك الله في عمره وصحته لينفع المسلمين د حازم شومان لتعلمو عن الله<br />وادخلو على مواقع الاخبار المختلفة لتروا كيف يحتاج اسلامنا لكل فرد منا ولكل دقيقة نحياها<br />اعتذر عن الكلام القاسي ولكن هذا ما كان في قلبي<br />هداني الله واياكم وعلمنا ما يصلح ديننا ودنيانا<br />وجزاكم الله خيرا"
archived = "2006-08-21"
capture_url = "https://web.archive.org/web/20060821064944/http://masr.20at.com:80/article.php?sid=741"
