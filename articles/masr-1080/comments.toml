[[comments]]
order = 4
subject = "ضمير مصر لا يموت"
author = "رضا"
posted = "2006-11-16"
text = "ربنا يرحمكضمير مصر<br />كامل زهيري: كان اشتراكيا بالفطرة ووطنيا بالطبيعة<br />الأبنودي: كان مستبشراً بمصر وأبا حقيقيا لكل مستنير<br />صلاح عيسي: طور لغة الصحافة وتعقدت الحياة برحيله<br />محفوظ عبدالرحمن: مثقف لا شبيه له<br />يوسف القعيد: علمنا أبجديات الحياة<br />محمود أمين العالم: هو خلاصة قيمنا الوطنية<br />سلماوي: نموذج فريد ألهم جيلي<br />د. حسن نافعة: كان قديسا ثورياً<br />أسامة أنور عكاشة: لم يقايض أبداً<br />سميحة أيوب: صداقتنا تاريخية وعميقة<br />مسيرة من الحب قطع أشواطها مفكر فى سمت راهب، ومثقف بروح أب وعالم بقلب مناضل، وضمير فى شخص رجل صوفى وحارس على تاريخ هو أحد صناعه ولم يكن صاحب هذه المسيرة سوى المعلم الأخير محمد عودة الذى رحل مخلفا وراءه غبار المعارك النبيلة ورهطا من تلاميذه وأبناءه الذين تعلموا جميعاً فى جامعته ونهلوا من نهر عطائه، رحل غاندى الثقافة العربية بعد ستين عاماً من العطاء والمحبة والمعرفة والريادة والاحتواء.<br />ولد عودة عام 1920 لوالد من كبار تجار القطن فى جهينة وكان أبوه قد أعلن إفلاسه إبان احتدام الأزمة الاقتصادية العالمية فى الثلاثينيات فشدت الأسرة رحالها إلى حى الحسين فأصطبغ بروح المكان وعبقريته.<br />وهناك التحق بمدرسة خليل أغا التى يعود إنشائها لعهد الخديو إسماعيل، ولأنه كان الأكثر تفوقا بين أقرانه فقد اختير لإلقاء قصيدة ترحيب بالملك فؤاد الذى سر سروراً بالغاً بل واندهش لنبوغ الصبى فأهداه طقم أدوات مكتبية مما أغضب أبوه الوفدى جدا، فلما انهى عودة دراسته الابتدائية التحق بمدرسة النوابغ المدرسة السعيدية بعد حصوله على منحة مجانية التعليم لأنه من المتفوقين، ووقع حظه فى فصل يضم أولاد الذوات المرفهين فكرهه للتفاوت الطبقى حتى فى تفاوت الطعام، فطلب نقله منه ولما تخرج التحق<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014840/http://masr.20at.com:80/article.php?sid=1080"

[[comments]]
order = 5
subject = "صلاح"
author = "مش انا"
posted = "2006-11-16"
text = "التغيير السياسي والأمن القومي : جهاد عودة مرة أخري<br />محمود الزهيري<br />mahmoudelzohery@yahoo.com<br />الحوار المتمدن - العدد: 1596 - 2006 / 6 / 29<br />بدأ السيد جهاد عودة مقاله بالمعضله وإنتهي بالتساؤل وهذا ليس من شيم رجال السياسة خاصة أنه رجل عضو لجنه سياسات الحزب الوطني والمفروض في العقلية السياسية أن لها بعد ورؤي في حلول كافة الإشكاليات التي تظهر علي السطح الإجتماعي وكافة مؤثراتها السياسية , أما أن يبدأ الأمر بالمعضله وينتهي بالتساؤل فهذه مصيبه المصائب من رجل لجنه السياسات , كما أن السيد جهاد عودة يربط بين النضج المجتمعي والتغيير السياسي والأمن القومي واضعا علامات فارقة بين الأمن القومي الذي هوفي واد يقرره أصحاب الرؤي السياسية الرصينه وهم في واد آخر<br />, وبين التغيير الإجتماعي الذي ينبني علي نضج مجتمعي لانعلم من الذي يحدد متي سيتم نضج الشعب ؟ ذلك الشعب الذي مازال حصرما وفجا , وكأن الشعب المصري شعب من الشعوب المتخلفة لم ينجب جهاد عودة وجمال مبارك وأحمد عز وصفوت الشريف وكمال الشاذلي , ويوسف والي ويوسف عبد الرحمن وعبد الرحمن حافظ والوكيل وتوفيق وممدوح إسماعيل وغيرهم كثير وكثير ممن نضجوا في ظل حكم وقيادة الزعيم القائد محمد حسني مبارك صاحب الضربة الجوية الأولي , من في تقدير السيد جهاد عودة الذي نعتبره من الشعب قد نضج ومن نعتبره لم ينضج بعد ؟ وماهو المقياس الذي يقاس به نضج الشعب المصري ؟ هل هو مقياس موضوعي أو شخصي ؟ كمي أو نوعي ؟ تكتيكي أو إستراتيجي ؟ وماهي المسطره التي سيقاس عليها الشعب المصري وتقاس عليها درجة نضجة ؟ ومن الذي سيحدد تلك المسطرة ؟ وماهو المدي الزمني المنشود للإنتهاء من النضج الذي سيتطلبه إنضاج هذا الشعب الغبي المتخلف ؟ وهذا رابط مغلوط ينبئ عن فساد في الرؤية وال<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014840/http://masr.20at.com:80/article.php?sid=1080"

[[comments]]
order = 6
subject = "عودة مش معئول"
author = "مش فاكر"
posted = "2006-11-16"
text = "ثمة فئة نادرة من الكتاب والمفكرين يمثلون الذاكرة الحية لأوطانهم ويعتبرون أن مهمتهم مرهونة سجل النضال الوطني لأبناء شعبهم، إضافة إلى الدفاع عن تجربته النضالية ضد كل مشكك فيه أو منتقص من قدرها، والى هذه الفئة النادرة كان ينتمي محمد عودة الذي ودعته مصر والعالم العربي صبيحة الثامن عشر من أكتوبر عام 2006 بعد صراع طويل مع المرض وبعد حياة حافلة بالعطاء في مجال الصحافة تجاوزت الستين عاما كان خلالها بحق أحد شيوخ هذه المهنة في مصر.<br />ولد محمد عودة عام 1920 م في قرية جهينة مركز فاقوس التابع لمحافظة الشرقية وكان والده واحدا من كبار تجار القطن ولكنه تأثر شأنه شأن غيره بالأزمة الاقتصادية التي ضربت مصر في الثلاثينات من القرن العشرين، وكانت الأسرة تطمح إلى أن يصبح ابنها محاميا مرموقا ليتمكن من استرداد الأراضي التي فقدتها الأسرة ، وبالفعل انتقل الشاب إلى القاهرة وانخرط في العمل بالمحاماة وذكر فيما بعد أنه قرأ مقولة لفرعون مصري جاء فيها أن مصر دولة زراعية ومن يريد أن يحكمها فعليه الاستياء على العاصمة، فقرر أن يستولي على العاصمة!<br />وكانت الحادثة التي هزت وعي عودة وجعلته يغير مساره عند عودته إلى قريته وزيارته لأحد المرضى بصحبة طبيب صديق له وحين أدرك الطبيب أن المريض مصاب بداء الكوليرا وأن حالته ميئوس منها سأله \"نفسك في إيه\" فأجاب المريض ببساطة \"نفسي في حلاوة طحينية\"! فقد كانت الحلاوة بالنسبة لأمثاله من فلاحي مصر في تلك الفترة أمنية غالية لا يستطيعون الحصول عليها.<br />وجعلت هذه الحادثة عودة يغير مجال اهتمامه –وعمله -من المحاماة إلى السياسة والكتابة بحثا عن وسائل لتغيير الأوضاع السياسية والاجتماعية المتردية التي شهدها ،وبدأ مسيرته من الهند التي ذهب إليها في أوائل الخمسينيات للعمل في الإذاعة الموج<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127014840/http://masr.20at.com:80/article.php?sid=1080"
