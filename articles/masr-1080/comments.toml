text = "اذكروا محاسن موتاكم.. نعم ولكن لماذا المبالغة الشديدة عند ذكر مناقب الأموات؟ هل هي عادة مصرية مثل الندب والنواح والتعديد؟ محمد عودة لا يمثل ضمير الشعب المصرى المسلم بل كان معاديا للشعب لأنه كان معاديا للإسلام ومعاديا للحرية والكرامة فهو قد أيد عبد الناصر في جبروته ولم يدافع عن الشعب الذى داسه عبد الناصر بالأحذية.."
