subject = "اين انت ياحمرة الخجل"
author = "a3mw"
posted = "2006-06-02"
text = "الدكاترة اللى المفروض يكونوا افاضل بصفتهم التربوية اقاموا الدنيا واقعدوهاوجيشوا الاعلام الغوغائى للدفاع عن حق هند فى الزنى مش مكسوف ياديوس من زنا بنتك وكنت فين انت والدكتورة لما كانت بنتك بايتة برة ولا لامؤخذة امها بتبات برة هيا الاخرى"
archived = "2006-06-15"
