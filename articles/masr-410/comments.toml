[[comments]]
order = 0
subject = "أين كان قاضي هند الحناوي"
author = "على فكرة لما شاهدت القاضي الذي حكم لهند الحناوي ليس استهادا بنص قرأني بل بشعر قباني ؛-)"
posted = "2006-05-30"
text = "المشكلة ليست في الشعر لكن طرأ تساؤل على عقلي لم استطع أستبعاده هو أين كان هذا القاضي الهمام أثناء تظاهر القضاة ، أنا مش شايفه في الصورة التي أمامنا ،ربما كان يحفظ ديوان هند الحناوي<br />أنا بالطبع مش بدافع عن أحمد الفيشاوي لأنه يستاهل ضرب الجزم ، فهو ارتكب الزنا رغم قدرته على الزواج ، ومعرفته الدينية ( التي إدعاها ) وغير ذلك من الأمور التي لا تبرر الزنا ، كما لا أدافع عن هند التي وجدت لها أبا مدافعا عنها مخطئة كانت أم محقة وأما تحلل وتحرم كما تشاء وترى إما أن نعمل بالدين ككل أو بالقانون ككل ، وفي برنامجها على قناة دريم لما قال لها الشيخ أن حد الزنا لا يطبق في مصر قالت إذا لا نطبق الشريعة في النسب كذلك بل نطبع قانون من عندنا أو نعود ونطبق الدين ككل<br />بصراحة أنا أشعر أن المبالغة في تسليط الضوء على قضية إثنين من الزناة ومحاولة حشد المعارف والأصدقاء والنفوذ في التأثير على خط سير القضية ومحاولة فتح الباب على البحري في موضوع تحليل الحمض النووي مما يتيح الفرصة للرشوى والتزوير ، وكثير من المفاسد<br />الموضوع طويل وأنا أشعر بالغثيان كلما تذكرته فالفيشاوي ليس عاجزاً عن الزواج في النور والحلال وهند الحناوي هي إبنه لوالدين من ( المربين ) الدكاترة بالجامعات خاصة الأم هي دكتورة بقسم علم النفس بكلية التربية جامعة حلوان<br />انا عن نفسي لو أن إبنتي قالت لي أنها تريد أن تلتحق بتلك الكلية ( ليس عندي إبنة ) فإني هفكر أكثر من مرة فالكلية بها مربية مثلها<br />نعود لموضوع القضاء فالحكم ليس نصرا ولا درسا للقضاء هذا من وجهة نظري والله أعلم"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132734/http://masr.20at.com:80/article.php?sid=410"

