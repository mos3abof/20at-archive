[[comments]]
order = 2
subject = "هذا ما جناه أبي وأمي... وما جنيت على أحد(لينا الفيشاوي الحناوي)"
author = "ز...و...ح"
posted = "2006-06-02"
text = "أخطر زوايا هذا الموضوع هي مفاجأة قصيدة حبلى لنزار قباني والتي افتتح بها القاضي (خليفة الله في الأرض) وممسك بميزان العدالة في بلد مصدره الرسمي الشريعة الإسلامية ... وبحسبان أن هذا الحكم الذي صدر سوف يؤصل ويؤسس قاعدة هامة جدا في موضوع إثبات الأنساب والأمر لصيق جدا بمبادئ واسس مرجعية إسلامية بحسان أن أطراف التداعي مسلمون والمحكمة مسلمة ومادة النزاع تستوجب للبت فيها الشريعة الإسلامية .. بما يعني أن الموضوع مغرق ومستغرق في الإطار الديني الإسلامي... فهل والعياذ بالله وحاشا لله عقم النص في الكتاب او في السنة الشريفة عما يستدل ويستهل ويفتتح ويستند فيه القاضي النزاري بتاع الحلمات وطفولة نهد وإلى أنثى لكي يؤصل ويبني حيثيات حكمة ... وهل أصبح نزار قباني مصدرا بديلا أو موازيا من مصادر التشريع الإسلامي"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615132734/http://masr.20at.com:80/article.php?sid=410"

