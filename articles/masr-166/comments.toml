[[comments]]
order = 27
subject = "طظ يطظ طظا"
author = "صرح السيد الرئيس مساء اليوم في حوار أجراه مع شبكة السي طظ طظ أنه طظ في مصر و اللى جابوا مصر و اللى في مصر و قد أدلى السيد الرئيس بهذه التصريحات بعد القرار الذي اتخذه بأن يتنحى تماما و نهائيا عن حكم البلاد .........استنوا ماتفرحوش أوي كده هيورثها لابنه يا حلوين و قد علل سيادته ذلك بانه بصراحة زهق بقى من كتر ضرب المصريين على قفاهم و هما محدش فيهم بيقوله حاجة و بصراحة ايده وجعته ( السن ليه حكمه بقى) فقرر أن يسلم الراية لأيد عفية و شابة و هي يد نجله المبجل علشان الضربات تبقى أقوي و تلسع أكتر على قفى المصريين.و قد صرحت منظمة( كفايه بقى ) أنها من اليوم سوف تسمى المصريين بالمطظوظين كانت هذه هي النشرة و إليكم هذا الفاصل أغنية وطنية:"
posted = "2006-04-17"
text = "المطظوظين أهما حيوية و عزم و همة جيل بعد جيل مضروبين"
