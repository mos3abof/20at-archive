[[comments]]
order = 10
subject = "مش محتاج"
author = "عابر القارات"
posted = "2006-04-14"
text = "يا جماعة الريس مش بتاع أقوال زى مرشد الأخوان .. الريس بتاع أفعال ... الريس كمم أفواه و رمى فى المعتقلات و عرض الحياة السياسية للخطر لأن ما عينش نائب لغاية دلوقتى و طبعا عمولات و طبعا تستر على نصابين و قتالين قتله و طبعا أرصده للحاشية و الكبار و طبعا تسميم بمبيدات و طبعا خط الفقر فى عهده قب على وش الدنيا و غطى أكتر من نصف الشعب ساكن المقابر و الباحث عن رزقه فى صفائح الزبالة و طبعا بطالة و أهه رزق القهاوى .... شوفتوا بقى إن الريس قالها من زمان بس إنتوا ما سمعتوش و جايين على الراجل الغلبان اللى نصب له واحد صحفى مطبلاتى و صياد ماهر فى المياه العكره و تقولوا لا مالوش حق يقول طظ !!"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212838/http://masr.20at.com:80/article.php?sid=166&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 11
subject = "قالها بالفعل"
author = "أبو مازن"
posted = "2006-04-15"
text = "مبارك ده راجل بتاع أفعال مش بيضيع وقته في كلمة طظ وغيره الراجل كل يوم بيعمل حاجات بتقول مليون طظ في الشعب واللي جابوا الشعب ومصر واللي فيها سرق البلد ونهب خيراتها وكون ثروة بالمليارات وساب اولاده ينهبوا البلد وكأنها عزبة ابوهم مش بلد المصريين وسجن آلاف الأبرياء من خيرة أبناء البلد ومنهم الإخوان .<br />فكلمة المرشد العام التي لم يكن يقصد معناها الذي تلقته الصحف الصفراء وهللت له فملايين المصريين يقولونها صباح مساء مما يرونه من فقر وذل وظلم في بلد الباشا مبارك وأولاده اللي بقت مش بلدهم<br />وفي النهاية الظلم له نهاية"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212838/http://masr.20at.com:80/article.php?sid=166&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

