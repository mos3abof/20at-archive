posted = "2006-04-15"
text = "جرى ايه يعم عبد الرحمن..<br />ما الريبس بقاله عشرين سنة بيقول طز فينا وفي اللي جابوناسواء في حادثة العبارة ولا في الفساد اللي مالي البلد<br />كفاية طز منه انه مش عامل لحد اي اعتبار<br />بس ليه اي بتحرج من الموضوع , المرشد قال طز<br />ومدام قال طز يبقى لازم يعتذر<br />هوا ايه يا أخي الشعب دا بقة سويقة اللي عايز يقل ادبه عليه يقل"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212838/http://masr.20at.com:80/article.php?sid=166&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

