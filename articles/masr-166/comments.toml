subject = "احسن منه وطزها"
author = "فتفوتة هانم"
posted = "2006-04-14"
text = "ايه ياجماعه انتم مش عاوزين بيبي (مبارك الف مبروك)يطز ليه<br />طب انتم عارفين يعنى ايه يطز باحدى اللهجات المحليه العتيقه بتعنى بيلعب الكورة<br />يطز الطزة<br />طب ماتخلوا الراجل يلعب الكورة للاسف بيلعب بكورة اكبر من حجمة بس مايضرش يجرب ماحنا فى وقت التجربة العمليه<br />اما النتايج فهيقشها خليفتة المحترم اليي لسه فى الحضانة...سلملى علي الطزة"
