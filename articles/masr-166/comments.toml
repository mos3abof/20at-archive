text = "وما حدث من ايام عندما قال مبارك على الشيعة ان ولائهم دائما لايران وليس لبلادهم طلع علينا وزير الخارجية ابو الغيط ومعظم الجرائد القوميه تبرر بالتطبيل والتزمير لما قاله مبارك ."
archived = "2006-05-24"
