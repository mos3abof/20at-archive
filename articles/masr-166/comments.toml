[[comments]]
order = 24
subject = "ياخسارة؟"
author = "مصرى"
posted = "2006-04-17"
text = "ياخسارة والف خسارة فى بلد كانت عظيمة<br />كانت عظيمة بشعبها ؟؟<br />كان نفسى اكتر واحد من كل الناس اللى فوق يتكلم بموضوعية<br />الحكاية ياجماعة اننا شعب تافهة ميهموش مصلحة البلد كل واحد فينا يهمة مصلحة نفسة احنا ياسادة مع الاسف شعب محترف ندب وعويل<br />الرشوة المتفشية فى مصر دلوقتى سببها اية ياترى حسنى مبارك نزل بيان بكدة ولا الناس اللى بتصلى فى الجوامع والكنايس واللى بتشجب كل حاجة فى البلد هما نفسهم اللى فاتحين جيوبهم ليل نهار للحرام<br />ياترىالمصرى اللى بيهرب من شغلة العام والخاص علشان قعدة حشيش ولا الشباب اللى بيزنى<br />انا مصرى قبل ماى حد يشتم<br />وانا واحد من الناس اللى بتتكلم كتير وعاوز ابطل ازدواجية فى حياتى نفسى زى مابنصلى ومابنسيبشى اى فرض ودقونا لغاية الارض نهتم بالمعاملات نبطل حقد وخبث<br />على فكرة كلنا بنقول طز فى مصر لان مافيش حد قلبة على البلد<br />وعاوزين الرئيس لوحدة يتحاكم ؟<br />طب واحنا"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212838/http://masr.20at.com:80/article.php?sid=166&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

