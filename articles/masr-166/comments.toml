text = "عارفين الريس لو قال طز اية اللى هايحصل هاتلاقى تانى يوم اسامة سرايا ومحمد الحديدى وعبد اللة كمال الخ من رجال الصحافة يمتدحون صراحة وشفافية الرئيس وتلاقى د مصطفى الفقى تانى يوم فى الاهرام عامل مقالة تاريخية عن تاريخ كلمة طز ودلالاتها التاريخية مستشهداً بوقائع وهتلاقى كل رجال الحزب الوطنى يسيرون على نهج قائدهم ويقولوها للشعب المصرى كلة<br />بس على فكرة الرئيس بيقولنا كلام كتير اوحش من طز واسفل منها كمان بس بأفعالة بس احنا مش مركزين معاة"
