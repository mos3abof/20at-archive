text = "يجماعه مبارك لا يمكن يقول طز دى<br />يقول طز عشان ايه<br />ده اكتر رائيس مستريح فى الروساء<br />ده مستريح عن جورج بوش زات نفسه<br />واحد ولا هامه الشعب ولا اللى بيحصله<br />والشعب ساكت له وساكت لتصرفاته هيلااقى فين شعب زى ده<br />مش لاقي ياكول وساكت<br />وياريت ساكت بس ده كمان بيمجده ويفخمه ويهتفلوه<br />مبارك مش هيقول طز ولو قال طز هيبقى احنا السبب"
