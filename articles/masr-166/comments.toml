[[comments]]
order = 7
subject = "لا بأس طهور ان شاء الله"
author = "كريم الشاذلي"
posted = "2006-04-14"
text = "ليست المشكلة في ان يقول مبارك طز ,, فالعيب لو خرج من أهل العيب مش عيب على راي جدتي الله يرحمها ..<br />لكن المشكلة كيف يتورط السياسي المحنك<br />الاستاذ عاكف في هذا المازق والذي استطاعت حكومة الدجل أن تستغله أفضل استغلال ..<br />التوقيت هام جدا قبل التصويت على قانون الطوارئ ..<br />يضع مبارك الاخوان في مازق التبرير .. بعدما نجحوا في التعتيم على انجازات النواب في مجلس الشعب<br />بصراحة انا مضايق<br />لكن ازمة وتعدي<br />وطهور ان شاء الله .."
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212838/http://masr.20at.com:80/article.php?sid=166&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

