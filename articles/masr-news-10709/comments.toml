author = "سعيد ابو مصطفى"
posted = "2008-12-14"
text = "الاجور المتدنية<br />الناس اللى عايشة فى الشهر ب 200 جنية<br />وفى اسوا مراحل الضنك - وفى اسوا نظام حكم مر على هذا البلد المتعوس<br />وفى ظل بطالة شاملة وعامة لكل الشباب<br />وانهيار لكل مرافق الدولة<br />جاى سى غالى يفرض ضرايب عقارية على الشقق القديمة اللى سترانا - واللة انا ما عنديش فلوس ادفع - يحبسونى انا جاهز - انما مش طالع من الشقة ولا عندى فلوس ادفعها"
archived = "2009-09-26"
capture_url = "https://web.archive.org/web/20090926134659/http://www.20at.com:80/masr/2khbar/10709.html"

[[comments]]
