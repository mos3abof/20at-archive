subject = ""
author = "---"
posted = "2008-12-14"
text = "هو النسر حصل لة اية هتغيروة<br />عجز - عندة تيبس فى العضلات ونظرة راح والا البعيد عمى ما النسر حلو وزى الفل<br />على فكرة انا مرة موظف فى وزارة الصحة رجعنى تانى اختم الشهادة علشان عين النسر مش باينة فى الختم وموظف تانى قال لى هو النسر فى الختم دبلان لية وراسة مطاطية لتحت قلت لة ابدا اصلوا مانمش بالليل كويس والموظف ختم بية<br />ومرة واحد بلدياتى من الصعيد وقف قدام قفص النسور فى جنينة الحيوانات وهو يشتكى للصعايدة ويتعجب هو دة النسر اللى بيختموا بية الاوراق وازاى<br />واخشى ان يضعوا مكان النسر التاج الملكى ويبقى اخرتك يا عم النسر"
archived = "2009-09-26"
capture_url = "https://web.archive.org/web/20090926134659/http://www.20at.com:80/masr/2khbar/10709.html"

