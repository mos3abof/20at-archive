[[comments]]
order = 1
subject = "تذكير لضباط الشرطة"
author = "رجل مصرى"
posted = "2006-10-03"
text = "تذكير لضباط الشرطة بأحداث الأمن المركزى<br />عام 1986 خرج جنود الأمن المركزى من معسكراتهم يحطمون كل شىء فى طريقهم ... وكانوا إذا رأوا ضابط يسرعون إليه ويقتلونه بأيديهم لا بالسلاح ... وجثث الضباط التى عثر عليها فى تلك الأحداث المؤسفة تبين حالة الكراهية تجاه الضباط والتى ظهرت فى طريقة قتلهم ... بعض الضباط خلعوا ملابسهم وجروا بالملابس الداخلية خوفا من جنود الأمن المركزى ...... والسؤال الآن : هل يتكرر ما رأيناه بأعيننا منذ 20 سنة عندما وجدنا ضباط الشرطة يخلعون ملابسهم ويجرون خوفا وهلعا ؟<br />هل سيتكرر تلك المشاهد المروعة عندما كان جنود الأمن المركزى يمسكون ضابط وينهالون عليه بأيديهم حتى يموت ؟<br />نعم هناك إحتمال أن يحدث هذا من جديد لضباط الشرطة !!!<br />هناك الملايين ليهم ثأر مع ضباط الشرطة ولو حدثت فوضى فى مصر لساعات أو لأيام ربما تكون النتيجة مقتل لآلاف ضباط الشرطة بطريقة وحشية كما فى أحداث 1986 ....<br />والحل الآن لمنع هذه الكارثة فى أيدى ضباط الشرطة لا فى أيدى غيرهم .... يجب أن يمنعوا الفوضى بأى شكل ، وهذا لن يتأتى إلا بحمايتهم للمتظاهرين الذين سيخرجون لإسقاط النظام قريبا !!!! ويجب أن يعلموا جيدا أن أى طلقة تأتى ناحية المتظاهرين معناها بداية فوضى وعدم سيطرة على الأوضاع وستكون النتيجة مقتل آلاف الضباط لا على أيدى المتظاهرين بل على أيدى الفئات المظلومة والتى أهينت وعذبت طوال ال25 سنة الماضية !!!!!!!<br />وأخيرا أقول لهم ، جمال لن ينفعكم بل سيهرب ، أنتم جزء من الشعب ، أولادكم وعائلاتكم تعيش هنا ، حافظوا على حياتكم وحياة أولادكم ، وتعاونوا مع المخلصين الذين سيخرجون لتطهير مصر ....<br />( رجل مصرى لا ينتمى لأى حزب أو جماعة وإن كنت من مؤيدى الإخوان على أساس أن مصر الآن فى أمس الحاجة إليهم"
archived = "2006-12-01"
capture_url = "https://web.archive.org/web/20061201081141/http://masr.20at.com:80/article.php?sid=1004"

[[comments]]
order = 2
subject = "تحية لعادل بن العادلة بين الزناة"
author = "سيكو"
posted = "2006-10-04"
text = "حذاري يابن تافة الأعاجم*** وإلا نال عرضك كل قاسم<br />أعادل إن أمك من مجوس*****لها ولع بإتيان المحارم<br />تأدب يا بن خالك دون شك***لعتت من الجحاجح والأكارم<br />يدب لخدر أمك يعتليها****أخوها العلج في ليل الفواحم<br />وجدك قائم بالباب هاجت***به الشهوات في شبق مهاجم<br />يناقل بين قائمتيه قهرا*****وينغط في خلاء نغط كاظم<br />وفاض به الغرام فلم يبالي****مقولة ناصح أو لوم لائم<br />فأولج في إست أمك نصف إير**فصاحت كله يابن الأشائم<br />وهاج الجار جار السوء هذا***فأقبل نحو ثالوث الغواشم<br />وألقمها هزيل الأير راحت*** تعاصره بفيها عصر ظالم<br />تعاورها الثلاثة ينكحوها *** تراوح فوقها فعل الحوائم<br />وأمك جودها بالعرض أضحى**يصاغر عنده جود لحاتم<br />تقلب طرفها من فرط شوق***لأير مثل أعواد اللهاذم<br />وتعدل بين طراق لديها**** كجور سدوم في غبش وعاتم<br />لهذا إسمك المنحول زورا**برغمك يابن ساعية الأراقم<br />حذاري ويل أمك أن تثرني**فتعلم هجمة الصيد الضراغم<br />عفوت اليوم عنك عن إقتدار**نجوت بجذع أنف منك راغم"
archived = "2006-12-01"
capture_url = "https://web.archive.org/web/20061201081141/http://masr.20at.com:80/article.php?sid=1004"
