subject = "مش فااااااااااااااهم"
text = "ماله الموضوع ده بعمرو خالد يا سيدى انتو ضاربين بانجو<br />100 / 100 يا بو درش وربنا يوفقك يابو قلب كبييييير<br />بس يا ماتفضلش كلب كبير وكرش كبيييييييييييييير<br />بحبك والله"
