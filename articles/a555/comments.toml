capture_url = "https://web.archive.org/web/20041130090346/http://www.20at.com:80/article.php?sid=555"

[[comments]]
order = 28
subject = "للأخ اللي مش عاجبه مصطفى"
text = "لو سمعت الأغنيه و تمعنت في كلماتها سوف تعرف ان كلمة الحمار ليست بمعناها الحيواني و لكن بالمعنى اللذي نحن فيه ... في مثل بيقول ( الشعب المصري بصفاره تلمهم و بكرباج تجريهم) و معنى هذا ان الأخ مصطفى يقصد ان نصحو بما يدور حولنا ولا ننساق ورا الكرباج ... يا اخي تمعن في الكلمات قبل ان تنتقد لأن انا سمعت الأغنيه و حسيت ان صلاح جاهين هو اللي كاتب الأغنيه و ليس طفل كبير و من مستمع لأغاني مصطفى محمود أقول له الى الأمام انت على الدرب الصحيح و في يوم من الأيام حنسمع تاني صلاح جاهين 2000 .<br />والسلام مسك الختام"
archived = "2004-11-30"
capture_url = "https://web.archive.org/web/20041130090346/http://www.20at.com:80/article.php?sid=555"

