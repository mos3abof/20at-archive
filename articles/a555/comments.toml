text = "ايه يا جماعه كل شويه واحد يقول الكرررررررررررش احنا خلاص اتعودنا علي مصطفي بالكرش ولو خس مش هنعرف نسمعه و بالنسبه للاخ المعترض علي (الحمار) فانا احب اقوله ان الاغنيه دي عبقرررريه وعلي فكره مفيش فرق بين النشيد و الاغنيه . شكرا"
