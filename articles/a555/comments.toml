capture_url = "https://web.archive.org/web/20041130090346/http://www.20at.com:80/article.php?sid=555"

[[comments]]
order = 39
subject = "nmamr_eg@link.net"
text = "أخيرا ظهر من نلتف حوله فاليحميه الله و ليباركه و يحفظه من كل سوء .. فقد وهبه الله صوت و وجه يخاطب العقل و القلب .. يارب أكثر من أمثال هذا الرجل .. فأنا أعمل فى مجال الفنون و لكنى أبتعد عنه الأن نظرا لأن ما نحن فيه أبعد ما يكون عن الفن أو عن عقيدتنا .. و رجاء كفاية عمرو خالد ، فأنه داعى مدعى فاليترك الشئ الجميل على جماله و كفاية الشرائط و الندوات .. عمرو عبدالله - مسلم - مصرى"
archived = "2004-11-30"
capture_url = "https://web.archive.org/web/20041130090346/http://www.20at.com:80/article.php?sid=555"

[[comments]]
order = 40
subject = "mahran47@hotmail.com"
text = "احمد-مصر<br />اتمني ان يفيق مطربينا العرب ويحتزوا بمثل هذا الشاب المؤمن وان يغنوا لنا اغاني تدخلنا الجنه لا تحدفنا في قاع النار فالشباب سيتغني بالذكر والصلاه علي المصطفي بدلا من ان يتغني بالحب والهوي"
archived = "2004-11-30"
capture_url = "https://web.archive.org/web/20041130090346/http://www.20at.com:80/article.php?sid=555"

