[[comments]]
order = 44
subject = "مسلمة غيورة"
text = "ماشاء الله هذا الموقع أصبح متخصص فى تلميع من ينتسبون زورا للمتدينين والدعاة<br />سامى يوسف ووحمزة يوسف وعمرو خالد وهذا المغنى<br />الذى رأيته بنفسى فى فرح يقال عنه إسلامى ولم<br />اتمكن من أن أحدد هذا منشد إسلامى أم حكيم أم عمرو دياب<br />بالله علبكم اتقوا الله فانتم تشوهون الصحوة الإسلامية"
archived = "2004-11-30"
capture_url = "https://web.archive.org/web/20041130090346/http://www.20at.com:80/article.php?sid=555"

[[comments]]
order = 45
subject = "أم خالد"
text = "السلام عليكم ورحمةالله وبركاته<br />أنا مش فاهمة ليه الأخ ولا الأخت اللي هاجمت عمرو خالد رغم إن هذا مش موضوعناوهو غني عن الدفاع عنه وبالنسبة للأخت اللي مش عاجبها أسلوب مصطفى محمود في الأفراح الأسلاميه أحب أقلها أن أسلوب مصطفى جعل الأسر الكبيرة التي كانت تلجأ إلى المطربين والمطربات الكبار لإحياء أفراحهم وكانت هذه الأفراح بها معصية لله يلجأون الآن إلى مصطفى لإحياء أفراحهم حتى تكون أفراحهم حلال ولأن مصطفى بخفة دمه وبأسلوبه الجميل في الغناء جعل من الفرح الأسلامي مرغوب فيه من الغني والفقير وعلى فكرة مصطفى زي ما بيعمل فرح في الهيلتون والشيراتون بيعمل أفراح للأسر الفقيرة وأحب أعرفك أن كل الناس بتحب أفراح مصطفى اللي مش عجباكي وبكرة تتجوزي لو ماكنتيش متجوزة وتقولي للعريس عايزة مصطفى يحيلي فرحي"
archived = "2004-11-30"
capture_url = "https://web.archive.org/web/20041130090346/http://www.20at.com:80/article.php?sid=555"

[[comments]]
