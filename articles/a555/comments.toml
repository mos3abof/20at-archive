subject = "مش عاجبني أوي يعني"
text = "ياجدعان الأصل في الموضوع هو النشيد مش الأغنية<br />والأخ مصطفى أقرب للاغنية منه للنشيد<br />يعني ياعم مصطفى عيب أوى تطلع واحدة تغني معاك<br />ده لو ماكنش أساسا حرام<br />زائد ان أغنية( ياحمار) لامؤاخذة يارجالة بصراحة حاجة تكسف<br />بصراحة الكلمتين دول زنقني من زمان وكان نفسي أقولهم لمصطقى<br />أي حد يعرفه ياريت يقولهوملوه"
