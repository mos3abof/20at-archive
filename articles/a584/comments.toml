text = "ايه يا جماعة ... انتو كبرتوا الموضوع قوي .. غنوة وعدت ... بس على فكرة دي غنوة لطيفة جدا وكريم ولد صغنون وقريب ونسيب عائلات أبو زيد لكن ده ما يمنعشي أنه بيعمل أغاني حلوة وبتعبر عن أفكار جيل جديد ... بطريقته وباحترام وبيعبر عن أفكار انا رأيي انها مش مبتذلة... وهو برضه مش بيتهوفن ولا سيد درويش...<br />اقترح على حاتم نصر الدين أنه يعمل موضوع المرة الجاية عن وائل عباس ... علشان الموضوع يبقى له قيمة والتعليقات تبقى في محلها"
