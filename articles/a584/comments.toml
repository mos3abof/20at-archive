[[comments]]
order = 27
subject = "وائل عباس"
text = "شكرا للاخت زهور على الرد الهاديء<br />بس عموما انا لم اقلل من احترام العلم والعلماء<br />لو كانوا علماء فعلا ويمتلكون العلم<br />ولو كان علمهم خاطيء مضل فواجب كل مسلم التحذير منهم<br />وبعدين لا يوجد من هو معصوم وفوق النفد منهم<br />واليك بعض من فتاوى ومعتقدات الوهابية:<br />الاحتفال بالمولد النبوي وحلاوة المولد حرام وبدعة<br />الاحتفال بشم النسيم حرام ولو مجاملة لاخواننا الاقباط<br />ياميش رمضان حرام وبدعة<br />زواج مسلم من قبطية او يهودية حرام<br />والاصح ان تصير له جارية يتسرى بها !!!<br />لا مودة بيننا وبين الاقباط ولا صداقة ولا تزاور<br />لاننا بيفصل بيننا وبينهم على حد زعم الوهابية الولاء والبراء !!!<br />حرام تقول للمسيحي السلام عليكم<br />وعمر عبد الكافي قال في احد شرائطه اللي الاخت مرمر بتسمعها: لما يقابلك جارك المسيحي على السلم ما تقولهوش سلامو عليكم ... قول له صباح الخير يابو وش عكر !!!<br />فهل هذه عقيدتنا ؟؟؟<br />خل هذا الفكر التافه هو ما نريده ان يحكمنا ؟؟؟<br />كفاية اللي هما فيه في بلدهم<br />فبرغم كل ما يفعلونه والصلاة اللي بالخرزانة<br />نسبة الايدز في بلدهم ثلاثة اضعافها في مصر<br />مع ان عدد سكان مصر اكثر من ثلاثة اضعاف عدد سكانهم !!!"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041338/http://www.20at.com:80/article.php?sid=584"

