[[comments]]
order = 23
subject = "وائل عباس"
text = "الاخت مرمر انتي قلتي حاجة معتقدة انها الصح وانا صلحتهالك برضه ووضحتلك ان مفهومك غلط فمش عارف انتي لسه بتتكلمي في ايه وعاوزة ايه ؟؟؟ هذا يسمى الكبر يا ماما وهو محرم !!!<br />ومعلشي يعني ما تقولينيش كلام انا ما قلتهوش لان انا ما قلتش ان كل الشيوخ وحشين دي لكن انا فلت انك بتسمعي للناس الغلط !!!<br />ثم يا ماما لما تتفقهي في الدين ممكن وقتها فقط تحددي ما هي الغيبة واحب اقول لك ان الفقهاء حددوا انواع من الغيبة وقالوا انها حلال زلال !!!<br />لانك لما تتكلمي عن ضلال بعض الشيوخ وتصحيح مفاهيم الناس مش زي ما الواحد يبقى قاعد على القهوة مثلا وبيجيب في سيرة الناس !!!<br />والاحوال اللتي تجوز فيها الغيبة كما حددها الفقهاء هي كالتالي:<br />1- التظلم: كالتظلم للسلطان والقاضي. فقد جاءتْ هند بنت عتبة امرأة أبي سفيان للنبي صلى الله عليه وسلم، وقالت له: إن أبا سفيان رجل شحيح (أي بخيل حريص)، وليس يعطيني ما يكفيني وولدي؛ إلا ما أخذت منه وهو لا يعلم. فقال صلى الله عليه وسلم: \"خذي ما يكفيك وولدك بالمعروف\" [رواه البخاري ومسلم].<br />وجاء رجل إلى النبي صلى الله عليه وسلم، وقال له: يا رسول الله، إن لي جاراً يؤذيني. فقال: \"انطلق فأخْرِجْ متاعك إلى الطريق\". فانطَلَق، فأخرج متاعه، فاجتمع الناس عليه، فقالوا: ما شأنك؟ قال: لي جار يؤذيني، فذكرتُ للنبي صلى الله عليه وسلم، فقال: \"انطلِقْ فأخرج متاعك إلى الطريق\". فجعلوا يقولون: اللهم العنهُ، اللهم أخْزِه، فبَلَغَهُ (أي بَلَغَ ذلك الجارَ المؤذي)، فأتاه، فقال: ارجع إلى منزلك؛ فوالله لا أوذيك\" [أخرجه البخاري في الأدب المفرد].<br />2- الاستفتاء: كأن يقول للمفتي: ظلمني أخي، أو فلان؛ فما طريقي في الخلاص؛ كما في الحديث السابق.<br />3- الاستعانة على تغيير منكر أو رفع بلاء عن مسلم. كما في قصّة هند مع زوجها أبي سفيان.<br />4- تحذير المسلمين ونصحهم من أصحاب الشرّ، وممن يضرّ بالمسلمين.<br />فعن زيد بن أرقم رضي الله عنه؛ قال: \"خرجنا مع رسول الله صلى الله عليه وسلم في سفر، أصاب الناس فيه شدة، فقال عبد الله بن أُبيّ لأصحابه: لا تنفقوا على من عند رسول الله حتى ينفضّوا من حوله. وقال: لئن رجعنا إلى المدينة؛ ليُخرجِنَّ الأعزُّ منها الأذلَ. فأتيتُ النبي صلى الله عليه وسلم، فأخبرته بذلك، فأرسل إلى عبد الله بن أبيّ، فسأله، فاجتهد يمينه ما فعل (أي أقسم الأيمان أنّه لم يقل ذلك)، وقال: كذب زيدٌ يا رسول الله. فأنزل الله تصديقي } يَحْلِفُونَ بِاللَّهِ مَا قَالُوا. وَلَقَدْ قَالُوا كَلِمَةَ الْكُفْرِ وَكَفَرُوا بَعْدَ إِسْلامِهِمْ، وَهَمُّوا بِمَا لَمْ يَنَالُوا، وَمَا نَقَمُوا إِلا أَنْ أَغْنَاهُمُ اللَّهُ وَرَسُولُهُ مِنْ فَضْلِهِ فَإِنْ يَتُوبُوا يَكُ خَيْراً لَهُمْ، وَإِنْ يَتَوَلَّوْا يُعَذِّبْهُمُ اللَّهُ عَذَاباً أَلِيماً فِي الدُّنْيَا وَالآخِرَةِ { (التوبة:74). [رواه البخاري ومسلم].<br />و من ذلك ما يذكره علماء الحديث عن الرواة، من ذكر صفاتهم، حسنة أو سيئة، فيما يُعرَف بعلم الجرح والتعديل، وذلك لحفظ حديث الرسول صلى الله عليه وسلم من الدّس والتّلاعب.<br />ومنه ما يذكره مَن يُستشار في شأن زواج أو مشاركة... من عيوب المخطوب أو الشريك...<br />فقد جاء في الحديث: \"حق المسلم على المسلم ست\". قيل: ما هنّ يا رسول الله؟ قال: \"إذا لقيته؛ فسلّم عليه، و إذا دعاك؛ فأَجِبْه، و إذا استنصحك؛ فانصح له…\" [رواه مسلم].<br />5- ذكر المجاهر بما فيه، أو صاحب البدعة ببدعته، ولا يُذْكَر بغير ذلك من العيوب.<br />فعن عائشة رضي الله عنها أنها قالت: قال رسول الله صلى الله عليه وسلم: \"ما أظنّ فلاناً وفلاناً يعرفان من ديننا شيئاً\" [رواه البخاري]. وكان يتكلّم عن رجلين من المنافقين.<br />6- التعريف: إن كان الإنسان معروفاً بلقب معين؛ كالأعرج، والأصم، والأعمى، ونحو ذلك. ولا يجوز مخاطبة أيّ شخص بمثل هذه الألقاب على وجه التحقير والتنقيص، وإن أمكن تعريفه بغير ذلك؛ فهو أفضل وأولى.<br />وقد لخّص بعض الفضلاء هذه الأحوال الست التي تجوز فيها الغيبة، أو لا يُعدُّ القدح والذمُّ فيها غيبة، في هذين البيتين:<br />القدحُ ليس بغيبة في ستّة<br />متظلّم ومعرِّفٍ ومحذّرِ<br />ولمُظهرٍ فسقاً ومستفتٍ ومَن<br />طلب المعونة في إزالة منكرِ<br />وبعدي يا اخت مرمر يدي الحلق للي بلا ودان ده مثل شعبي ومثله يا مستعجل عطلك الله وغيرها من الامثال الشعبية<br />وانظار المدرسة الظاهرية دائما يميلون لتفسير الاقوال بظاهرها كما يفعلون في القرانو السنة ولا ينظرون للحكمة من وراء الاقوال والحقيقة ان تلك الامثال اصولها دينية بحتة ولكن نحن لسنا بصدد شرح الامثال الشعبية<br />كمان يا اخت مرمر طالما انتي ملتزمة كده فمافيش داعي تقولي باي<br />لانك ها تلاقي ناس من اللي بتسمعيهم بيقولوا ان كلمة باي حرام وبيدع<br />Read the rest of this comment..."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041338/http://www.20at.com:80/article.php?sid=584"

