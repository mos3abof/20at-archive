subject = "لمبة محروقة"
text = "مرسي يا نصري على الموضوع الحلو دا<br />أنا بمووووووووت في كريم<br />والأغنية تجنن<br />بس كلمة (هاتجند)<br />كنت بسمعها (هاتجنن)<br />ههههههههههههههههههههههههه<br />أحلى حاجة إن الصحة تمام :))<br />بس على فكرة كان ممكن تكون الأغنية حماسية أكتر من كدة<br />يعني حاسا انها هدية أوي على موضوع زي الجيش<br />شكله حرام كان تعبان وهو بيغني من الجيش<br />بس بيني وبينكم<br />حبيت الجيش<br />عيزه اتجند مليش دعواااااااااااا<br />سلام يلي في بالي"
archived = "2004-09-26"
