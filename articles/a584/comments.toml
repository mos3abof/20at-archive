text = "السلام عليكم<br />أستاذ وائل أنا بعتذر بشدة عن وصول النقاش بيني وبين حضرتك للمستوي<br />وعلي العموم انا موش جاي أصفي حسابات وده لأني أصلا موش ضليع في الحساب<br />علي العموم أنا متشكر جدا لأرائك وبكرر إنسحابي من المناقشة لحرصي علي وقتي أولا وعلي بقاء الود بيني وبين المعلقين ثانيا ...<br />نونا ...متزعليش ..خناقة وبتحصل في أحسن العائلات :("
