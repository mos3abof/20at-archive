subject = "بيرو ..أنا رجعت"
text = "السلام عليكم<br />حمد الله علي سلامتي يا جماعة ...الله يسلمك يا بيرو<br />أنا رجعت يا رجالة ...والفوضي اللي كانت موجودة في التعليقات خلال اليومين اللي فاتوا انتهت خلاص فياريت كل واحد كان فرحان بنفسه وعلقله تعليقين يخف \"كيبورده\" علي الموقع كدة وبلاش عك ..<br />المهم الموضوع جميل جدا فعلا ...والاجمل ان حاتم اخو احمد نصر الكاتب المختفي علي عشرينات هو اللي كاتبه<br />برافو عشرينات ...ويا ريت تنزلوا الموضوع بتاعي بسرعة :)"
