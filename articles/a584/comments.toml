text = "انا عارفة إني جيت متأخرة جدا وأصلا مكنتش جاية لأني طبيعي مش هاتجند ومعنديش اخوات ولاد فقلت الموضوع مش مهم أقراه<br />ولكن سبحان الله فجأة لقيت نفسي زهقانة قلت أدخل اتفرج .. وفرحت أوي بالمقال وفتحت طرب أسمع الأغنية لأني بحب أوي كريم بحسه عسول وزي ماقالت سونيا تقريبا في التعليقات ولا مين انه بيتكلم عن الشباب زي ام تي إم كدة وعجبني جدا في العمة نور خفت دمه وقربه من القلب ..<br />طيب يا تجنيد ..<br />كلمة ( كسبنا الصلاة على النبي) اللي زعلت مرمر الصراحة أنا كنت أول مرة أسمعها .. وعلى كل حال يامرمر مشكورة انك بتوصلي المعلومات اللي عرفتيها وكل واحد بعد كدة ياأختي ربنا بيديه حسب نيته وحسب فهمه<br />ونونا وبيرو طبعا بحييكم وحمد الله على سلامتك بيرو وموضوعك يجنن نونا<br />أما بقى الأستاذ وائل .. (( أدينا قعدنا))<br />أول حاجة أهلا (بحضرتك) لأنك متقولش انك في (العشرينات) باين عليك ماشاء الله كبير من كلامك<br />وتعليقاتك وسعة صدرك وشهرتك ..<br />بس في حاجة بسيطة أوي جدا كنت أحب أقولها وياريت متقلبش عليا لأني ناوية أكتب موضوع قريب في عشرينات وعيزاك ترد عليا رد من ردودك الحلوة :)<br />في الأول أحب أقولك إني اتولدت في السعودية واتعلمت في مدارسها الحكومية لغاية ثانوي لكن عمري ماسمعت عن حاجة اسمها حركة وهابية إلا لما جيت الجامعة في مصر للأسف .. صدقني الناس هنا فاهمة غلط خالص .. مين قال إن كل حاجة حرام وغلط ؟؟؟؟؟؟ أنا بجد مستغربة .. دنا بعيط على أيام السعودية دي ونفسي أرجع أعيش هناك تاني كنا عايشين حياتنا بالعكس بحس في مصر خنقة وتعقيد في الدين .. هناك نتحرك براحتنا في أسواق نسائية مخصوصة حتى ملاهي وجنينة حيوانات وكل الترفيه للستات بس أو للعائلات وزيارات وعلاقات وجناين بجد كنا عايشين في نعيم .. هنا بقى في مصر ناس كتير أوي فاهمين الدين غلط .. فاهمين ان متدينين يعني ميدحكوش .. ميروحوش يلعبوا في الملاهي .. ميرحوش يصيفوا .. يتكلموا لغة عربية في البيت .. والله أنا شفت نماذج صدمتني بجد في مصر .. والسبب ليه .. كل واحد بيسمع كلمة بيصدقها .. مفيش مرجعية .. والمرجعية الأساس إنها تكون من القرآن والأحاديث الصحيحة .. عشان كدة ماخدش أي معلومة في الدين إلا إذا كان ليها دليل صريح وواضح .. غير كدا لا ..<br />وأحب أقولك أستاذ وائل إنك آخد فكرة غلط جدا حتى في بعض المعلومات .. اللي هوضحهالك دلوقت على ضوء دراستنا هناك .. وهو فعلا الشيخ محمد بن عبد الوهاب زي ما قالت نونا الله يمسيها بالخير جا في وقت كانت الناس سابت فيه عبادة ربنا خالص ورجعت للقبور وبقوا بيدبحوا لأصحابها الميتين وبيتوسلوا بيهم ونسيوا ربنا خالص فهو كل اللي عمله انه كان بيحذرهم من الشرك ويدعوهم للتوحيد .. حتى كتابه ((كتاب التوحيد الذي هو حق الله على العبيد )) والله العظيم مافيهوش ولا كلمة من عنده كله آيات وأحاديث .. ويمكن الناس اللي درست في السعودية تفتكر اننا درسناه في متوسط ..<br />هنيجي بقى لكلام سعادتك ..<br />((الاحتفال بالمولد النبوي وحلاوة المولد حرام وبدعة<br />الاحتفال بشم النسيم حرام ولو مجاملة لاخواننا الاقباط<br />ياميش رمضان حرام وبدعة))<br />الحرام مش الحجات دي ومحدش قال كدة .. الحرام (( اعتقاد أنها من الدين ومن شعائر الدين زي المولد)) لأن الصحابة والتابعين معملوهاش وهم كانوا أشد قربًا مننا للرسول وأشد اتباعا .. والنبي صلى الله عليه وسلم معملش عيد ميلاد لنفسه .. دا معناه ايه ؟؟؟ احنا نعرف أحسن منه ولا بنزود في الدين على مزاجنا .. دا غير الحجات اللي تكسف اللي بتحصل في الموالد دي .. تفتكر الرسول صلى الله عليه وسلم لو كان عايش بأبي هو وأمي كان هيتبسط من الموالد دي ؟؟؟؟ :((((<br />وشم السيم اللي هو عيد النيروز عند النصارى مش مفروض اننا نقلدهم على الأقل عشان كرامتنا .. هم أصلا مش ممكن يتنازلوا ويحتفلوا بأعيادنا لكن احنا للأسف زي ماقال علينا الرسول صلى الله عليه وسلم (( حتى لو دخلوا جحر ضب لدخلتموه)) ربنا يحفظنا<br />أما ياميش رمضان بقى دي واسعة شوية لأني عشت في السعودية 17 سنة مسمعتش عن الياميش دا غير منك دلوقت .. وعلى كل حال قيس على حلاوة المولد أو البليلة في عاشورا مثلا .. لو كان في اعتقاد إن الأكلة دي لما تتاكل في الوقت دا تبقى ((( عبادة ))) شوف أنا بقول عبادة دا اللي حرام .. زي الناس اللي يقولوا خلاص ميفعش تشتري حلاوة المولد إلا ليلة المولد وتلاقي محلات الحلويات بتضرب في بعضها وبياكلوها (للبركة) أو لأنها حاجة من الدين فهو دا اللي حرام لأن احنا مش من حقنا نقول إن في حاجة هناخد عليها ثواب أو من الدين ومفيش عليها دليل لأننا مش هانعدل على ربنا وهو اللي قال سبحانه وتعالى : ( اليوم أكملت لكم دينكم وأتممت عليكم عمتي ورضيت لكم الإسلام دينًا ) ..<br />أستاذ وائل أرجوك تفهم إني مش ماشية على مذهب ولا بتعصب لحاجة لكن لما حد بيديني حاجة في ا<br />Read the rest of this comment..."
