subject = "وائل عباس"
text = "سيادتك قلت: سؤال كمان ...معلش استحملني ...كتبت قبل كدة انك بتتكلم انجليزي وفرنساوي والماني وقريبا عبري ..(ادهم صبري وصل يا رجالة) -====== هو فين السؤال بقى جلالتك معلشي علشان سمعي تقيل ؟؟؟ بليز بيته سيلفوبليه جيف مي هامبورجر ؟؟؟ اقدر اعتبر ده وعد ؟؟؟ معلش اصلي خنيق ...<br />وشرف ليا اني اكتب في عرب تايمز اللتي قد تصدم الناس بجرأتها ونشرها للحقيقة العارية والمرة اللتي نعيشها ولكن تبقى الحقيقة هي الحقيقة ...<br />واكون من كتابها وليا قسم ثابت هناك باسمي كمان ها تلاقيه كده على ايدك الشمال ... ولما تلاقيني انا شخصيا قبحت يبقى ليك الكلام ... ولا تزر وازرة وزر اخرى يا اخ بيرو ولا رفيق بيرو ...<br />وبعدين كيف تنهى عن خلق وتاتي بمثله ... انت زعلان اني باسمع روك وبتقول اني متناقض ... طب ما انت بتسمع اسمو ايه ده وفي نفس الوفت بتدافع عن عمرو خالد !!! اهو ده بجد اللي تناقض ... مش عمرو بتاعك ده بيهاجم العري والفيديو كليب .. الخ<br />وزي انا ما قلت من قبل انا دقة قديمة فمش باخلص ولا بالخص وباحب اخنق فممكن انت تنفض وتحلق براحتك ومع نفسك وما تفرضشي اوامرك ...<br />شفت انك انت اللي بتصدر اوامر ازاي ... علشان انا باتخنق بعد اذنك لو تكرمت يعني ...<br />ثم ما حدش لا اتهمك ان عندك عقد نقص ولا دياولو ولا انا كمان عندي بس يعني قبل ما تخش في الناس شمال حاول تتعرف عليهم باللين الاول مش يمكن تكسبهم ؟؟؟ علشان الناس ما تتضطرش لتعريف نفسها بنفسها بطريقة ممكن ما تعجبشي سيادتك والصارحة انا مش عارف انا الناس ممكن تعرف نفسها ازاي هنا ... انا كنت زمان be0wulf زي ما انت بيرو دلوفتي ... لكن انا دلوقتي مش باخاف من حاجة وباكتب وائل عباس بكل صراحة قد تعتبرها انت وقاحة ... معلشي ياخويا اصلك خليتني متلخبط ومش عارف انت بتفكر ازاي ...<br />وسلامتك من العيا<br />انشالله شارون يا سيدي<br />والف سلامة"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041338/http://www.20at.com:80/article.php?sid=584"

