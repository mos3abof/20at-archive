[[comments]]
order = 13
subject = "بيرو"
text = "الأستاذ العظيم وائل عباس ...<br />من غير جوجل ولا انتر ولا اي حاجة في الانترنت اصلا<br />انا موش هدخل عل جوجل لسبب واحد بس ...اني موش مهتم بمعرفة اي شيء عنك زائد ان لهجة الامر والنرجسية اللي متوفرة بشدة في كلامك متخليش اي حد يكون مهتم انه يعرفك<br />المهم ..سؤال بسيط ...بما انك شايف عمرو خالد مجرد واحد بيعبي شرايط ...امال بتدخل علي عشرينات ليه ومتحمس قوي للموقع ومعظم موضوعاته تنتمي لما يسمي بــ \"تيار عمرو خالد \"<br />سؤال كمان ...بتسمع اجنبي وليك في المازيكا وجاي عند كريم ومتنرفز قوي ليه ...<br />انت موش شايف ان فيها تناقض<br />سؤال كمان ...معلش استحملني ...كتبت قبل كدة انك بتتكلم انجليزي وفرنساوي والماني وقريبا عبري ..(ادهم صبري وصل يا رجالة)<br />بما انك مهم وعضو لجنة الصحافة اللي موش ورقية بالنقابة وبتكتب في نص مواقع الانترنت حتي لو كانت اباحية بالالفاظ زي عرب تايمز<br />بما انك جبار كدة فأنا موش مهتم اني اتكلم مع واحد زيك ..علشان أنا عندي عقدة نقص وبتجيلي حساسية لما احس ان في حد احسن مني ...<br />استاذ وائل ....مرسي كتير لتعاونك معانا ...يا ريت نخلص بقي<br />بيرو<br />كنت عيان ورجعت ....حمد الله علي سلامتي :)"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041338/http://www.20at.com:80/article.php?sid=584"

[[comments]]
order = 14
subject = "تحياتى الحمراء وسلام ثورى"
text = "يعنى ومن غير اى مقدمات .. مين كريم ده بقى ان شاء الله؟<br />اه كريم ابو زيد ابن السيناريست العظيم محمود ابو زيد شقيق الفنانه نبيلة عبيد .. وأخوا الملحن والمؤلف كمان ..<br />يبقى هو كده ابن حسب ونسب ومعنديش مانع انما اقول انه عمل اغنية وكلمات روشة وحاجات ..<br />أولاً كريم بتاعكم ده ولا صوت ولا قبول وتحس انه عليه غضب من ربنا كده .. ويا اخواننا مكنتش اتصور ان انا ممكن اخد ثقافتى من واحد زى ده على اى حال واصح ان الموضوع تافه وميستحقش انى ارد تانى<br />بس لى رأى على اللى بيقول عمرو خالد سواء اللى بيهاجمه او بيدافع عنه .. احنا بنتكلم فى كريم ايش دخلنا للدين ؟؟<br />طيب سلام بقى يا ناس انما انا شايف يا زميل وائل ان كريم وأمثاله هما اللى هيزودوا التفاهه والتغييب اكتر واكتر .. وبعدين جيش ايه اللى هو بيتكلم عليه هو هيشتغلنا ولا ايه؟ أتحداه ان كان أصلاً دخل الجيش ولو دخل يبقى فى فندق ولا مركز قياده .. ولا دار من دور القوات المسلحة ولا مركز البولينج ده كريم البو ابن محمود ابو زيد يدخل الجيش .. ينعم عليكم باللى مش موجود"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041338/http://www.20at.com:80/article.php?sid=584"

[[comments]]
order = 15
subject = "وائل عباس"
text = "ايه يا عم بيرو دخلة الحملجية دي يا عم<br />دانا باقول عليك راجل مهم هنا وبتاع ومديك برستيجك<br />وما عكيتشي فيك ولا قلت نرجسية ولا فتحية ولا شوقبة<br />والامر لله وحده يا سيدنا وانا ما اعتقدشي ان كلامي كان فيه اي اوامر !!! DUH<br />لكن كلامك كان استهتار بيا واستفهام غرضه الانكار والاستهزاء وانت عارف ان انا راجل شغلتي الكلام وامور اخرى فصعب يعدي عليا كده ومع ذلك عديتها وما مسكتش فيها وقلت زيك نرجسية وفزدقية ومهلبية يا زعيمنا وافترضت فيك حسن النية اللي انت ما افترضتهوش فيا عامدا متعمدا برغم عدم وجود سابق معرفة بشخصك الكريم !!! DUH<br />ثانيا انا لو شايف ان الموقع ده بتاع عمرو خالد وتيار عمرو خالد زي ما انت بتقول ... الصراحة اول مرة اعرف ان المحاسب عمرو خالد ليه تيار ... ما كنتش جيت اساسا<br />وحتى لو جيت يا اخي ده برضه واجب الضيف يا اخي بتعمله معايا وانت كمان اصلا ضيف زيك زيي ما تزيدشي عني ولا حته ؟؟؟<br />لكن انا شايف ان الموقع بيقول كل حاجة وبيسمح للناس تقول رايها بعكس معاليكم يا بيرو باشا ياللي عاوز تطرد الناس علشان هما وحشين ومش بيسمعوا كلامك !!!<br />اه يا عم انا باسمع اجنبي واضح انك متابع تعليقاتي بعكس ما تدعي الان في ردك الاخير اللذي ينقصه بعض الكياسة ... وكنت باعزف جيتار كمان وباغني في باند هيفي ميتال وهارد روك والترنيتيف بس ياريت ترجع لتعليقاتي اللي اتكلمت فيها عن المزيكا وتشوف انا باسمع ايه وليه بالضبط ... ها تجدني اتكلمت عن البروتيست روك والمواضيع السياسية في الموسيقى ... ولا بدوب في هواه ولا بادوب في قفاه ...<br />سيادتك قلت: سؤال كمان ...معلش استحملني ...كتبت قبل كدة انك بتتكلم انجليزي وفرنساوي والماني وقريبا عبري ..(ادهم صبري وصل يا رجالة)"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041338/http://www.20at.com:80/article.php?sid=584"

