subject = "وائل عباس"
text = "معلشي يا اخ بيرو<br />مش ها اقدر اشرحلك الموضوع كده تيك اواي<br />او اعبيه في شريط كاسيت تسمعه وانت سايق العربية<br />زي ما الاخت مرمر كده بتعمل<br />ممكن حضرتك تتفضل وتقرا مقالاتي لو انت حقا عاوز تعرف وائل عباس ده بيبيع ايه في انهو حارة<br />ببساطة افتح Google<br />واكتب:<br />\"وائل عباس\"<br />ودوس Enter<br />وعيش حياتك يا زعامة<br />ولا اخفيك خبرا ها تلاقي ناس لاعنة سنسفيل جدود اللي جابوني برضه<br />اقراهم برضه علشان تكون وجهة نظر محايدة<br />وتستخرج نتيجة ليك انت شخصيا<br />واي خدعة يا باشا"
