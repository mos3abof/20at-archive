subject = "نونا"
text = "مصدومة فيكم<br />اتغريتم خلاص زي صاحب احدي الجنتين في سورة الكهف الي اتغر في نفسه و زي قارون<br />وائل مع احترامي لك<br />انا من احفاد محمد عبد الوهاب مؤسس الحركة الوهابية و ده راجل جه في وقت كان بيعملوا ولائم للجن وقت الناس بعدت فيه عن الدين و كان لازم يفوقوا<br />و مصدومة فيك يا بيرو يا الي كنت بقول عقلك اكبر من سنك عشان الردح الي ردحتوه انتم الجوز لبعض<br />يا وائل لو انت شايف انك احسن من محمد ابن عبد الوهاب يا ريت تألف لنا كتاب زي زاد المعاد و كتاب مختصر سيرة الرسول بما انك اغزر منه علما<br />وبيرو انا فعلا مصدومة فيك لان القوة مش بالصرعة بأنك تمسك نفسك عند الغضب"
