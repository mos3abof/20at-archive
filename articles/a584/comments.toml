subject = "وائل عباس"
text = "معلشي يا نونا مع احترامي لكونه جدك<br />ومع العلم برضه اني اصلي من اشراف قنا اللي بيقال انهم من نسل الرسول ... وهذا طبعا لا يعني تميزي عن احد الا بالتقوى والعمل الصالح ...<br />فاصلاح الاخطاء لا يكون بالاخطاء وتنشيف المخ وقفل باب الاجتهاد والتحجر والجمود والتطرف وادعاء الاقتداء بالسلف بينما في الحقيقة السلف عندهم هو ابن تيمية وابن القيم الجوزية واجتهاداتهم !!!<br />وساظل برغم ذلك اكبر عدو للوهابية في مصر واقاومها بكل ما اوتيت من قوة وعلم ... فمصر بلد الازهر وديننا دين صحيح على مذهب الامام ابي حنيفة النعمان ولا نحتاج خزعبلات وضلال الوهابية ... لان الموضوع ببساطة سياسة ورغبة من السعودية في نزع الريادة من مصر حتى انهم انشأوا ما يسمى الجامعة الاسلامية في المدينة المنورة لتنافس الازهر بل واستوردوا بعض ضعفاء النفوس من شيوخ الازهر بنقودهم لزرع الوهابية في مصر !!!<br />لو تذكرين تنبه محمد علي باشا لخطر الوهابية وارساله لابنه ابراهيم باشا ليقاومهم وضم الحجاز وقتها الى مصر ...<br />انا لو قعدت اتكلم عن الوهابية هنا ها يبقى دمي تقيل اوي وهنا ليس المكان لمثل تلك المناظرات فخلينا هنا خفيف خفيف كده والموقع لذيذ واللي عاوز يناقشني سياسة بحته او دين بحت فالمكان مش هنا ... والموضوع كله كان عن كريم اسمو ايه ده ومدى اهميته لدرجة ان احنا نهتم بانه دخل الجيش ولا دخل مفرمة تفرمه باذن الله !!!<br />واللي فتح الموضوع هو الاخت مرمر اللي ما اتكسفتشي وهي بتقول انها سمعت في شريط !!! بل وبتفرض عليا اسلام الكاسيت بتاعها افتراضا انه الصواب !!! ومصيبة هذا الجيل انه بطل يقرا كتب واكتفى بالشرائط والفضائيات !!!<br />الاخت نونا<br />الشيخ محمد متولي الشعراوي سافر وعمل في السعودية وفي معقل الوهابية وهو الجامعة الاسلامية ومع ذلك لم يعد الى مصر ليبشر بها ككثير من الشيوخ ضعاف العلم !!!<br />انصحك بالشيخ الشعراوي ويمكنك ايضا القراءة لابي حنيفة النعمان والامام المجدد محمد عبده وكذلك الشيخ جمال الدين الافغاني<br />وان تبتعدي عن كل من يحاول الغاء العقل اللذي كرمنا الله به وتغليب النقل على العقل وابعاد النصوص عن اسباب النزول فهي مدرسة لن تؤدي بنا الا الى التحول الى نظام مماثل للمملكة العربية السعودية وشره كبير لو كنتم تعلمون ...<br />وانا لست اغزر منه علما ولكن اعلم انه على خطأ وقال عنه جدي وكثير من شيوخ الازهر رحمهم الله انه ضال مضل يجب التحذير منه وكذلك قالوا على شيخه المبتدع ابن تيمية !!!<br />اما عن مسألة تاليف الكتب فممكن قدام شوية مش دلوقتي وبعدين ما انتي عارفة نظام الطباعة بقى والتكلفة ... خليها مقالات كفاية حاليا ...<br />وبعدي يعني مش طريقة لقفل المناقشة ان الواحد يقول وانت عملت ايه زي بيرو او يقول اعمل انت كذا زيك يا نونا لان انا كمان ممكن ببساطة ارد ردود محرجة زي انك انتي شخصيا بعيدة كل البعد عن منهج جدك محمد بن عبد الوهاب ... فما تطلبيش مني ابقى زيه ... ومعلشي كتبه ما اشتريهاش بتلاته تعريفة ... لان ماحدش بصراحة بيشتري الجهل والضلال لنفسه ... وانا دلوقتي باتكلم عن علمه وتاثيره مش علشان هو جدك فما تاخديش الموضوع بحساسية ..."
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041338/http://www.20at.com:80/article.php?sid=584"

[[comments]]
order = 22
subject = "وائل عباس"
text = "ومش عارف حقيقة هو الاخ بيرو غضب ليه على حد زعمك يا نونا ؟؟؟<br />محدش داس له على طرف وهو اللي اصلا دخل فيا شمال وش برغم اني باتكلم عن واحد ما يقربلهوش وهو هذا المغني وهو شخصية عامة يجوز نقدها ولكن بيرو اختار انه يهاجم شخصي والجرائد اللي باكتب فيها بطريقة فجة وغير مقبولة وتتنافى مع الذوق وغير مبررة وغير معروفة الاسباب !!!<br />ربما يعود ذلك الى مناقشة سابقة لم يستطع بيرو فيها اثبات حق او باطل معي واضطررته للانسحاب فيمكن جاي يصفي حساب قديم ولا حاجة ...<br />وبرضه مش ها يسلك ..."
archived = "2004-09-26"
