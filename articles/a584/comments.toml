text = "يا استاذة نونا<br />انا لم اقصد الاساءة<br />وانتي لو ماشية على نهج جدك مثلا المفروض تبقي منقبة<br />مش محجبة بس !!!<br />ولبس البنطلون حرام عند الوهابية !!!<br />والمفروض ما تشتغليش اساسا !!!<br />ومحرم عليكي التعليم المختلط والعمل المختلط !!!<br />ومحرم عليكي تسوقي سيارة !!!<br />لو انتي بتعملي ما سبق تبقي ماشية على نهج جدك<br />وهذا ما قصدته !!!<br />فارجوكي ما تاخديهاش على انها اساءة<br />هو يعني انا احيانا باستخدم اسلوب ادبي ومجازي وكنايات وتوريات في كلامي<br />بس للاسف احيانا بتتفهم غلط ..."
