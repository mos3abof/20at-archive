subject = "زهور"
text = "5/9<br />خرجتونا عن موضوع كريم خالص<br />أنا قرأت الموضوع متأخر واتصدمت زيك يا نونا<br />الأخ وائل /إحنا مش بنفرض عليك رأينا وبنحترم رأيك وكمان احترمت فيك اجتهادك للعلم الشرعي (بالنسبة لموضوع الغيبة ) ولعلي افتح جوجل وابحث عن مقالاتك وأقرئها<br />بس كمان أحب أقول<br />الأصل احترام العلم والعلماء الذين اجتهدوا وتعلموا العلم أي ان كان في الأزهر الشريف او في الجامعة الاسلاميه وعدم التجريح في علمهم لأنه علم،او في ذاتهم لانهم اجتهدوا..............<br />وكما تقول أن الله أكرمنا بالعقل فإننا نستطيع تمييز ما نسمع وما نقرا واختيار الأفضل بالنسبة لنا لا الأنسب بالنسبة للفكر والاتجاه.................<br />(الافضل الذي يضيف لنا ولعملنا خير في الدارين )<br />واعتقد انك أفرحت أعداء الإسلام بهذا النقاش الحاد بين اخوة في الدين<br />مع احترامي الشديد لك ولما كتبت<br />الاخ بيرو احترم فيك موقفك وتعليقك الاول رائع<br />شكلوا تعليقي بقى دمو تقيل كلوا احترام في احترام"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926041338/http://www.20at.com:80/article.php?sid=584"

