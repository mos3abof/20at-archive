text = "وانا سمعت برضه التهريج ده في شريط عمر عبد الكافي<br />وعلى فكرة المقولة ليس معناها ما يفهم من ظاهرها<br />كما فهمها هو من الظاهر<br />فالمقولة قديمة وتراثية<br />وهي تعني الرضى بالمصائب والنوازل<br />وانه مهما يحدث للانسان من بلوى يمكنه ان يكسب الصلاة على النبي<br />فهمتي يا اختي<br />ثانيا حاجة مهمة جدا<br />الدين عمره ما كان من شرائط الكاسيت<br />وانصحك بشراء مجموعة الشيخ الشعراوي لتفسير القرأن<br />وبعد سماعها كاملة ضستشعرين بمدى قزامة من يملأاون تلك الشرائط<br />و اولهم عمرو خالد !!!"
