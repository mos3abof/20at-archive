posted = "2007-03-16"
text = "طالما انكم مش فتحين التعليقات في ولاد البلد هعلق هنا<br />اه موضوع احمد زين ده الي كاتبة<br />الله يخرب بيوتكوا<br />هو ده موضوع يتنيل حد يقرا<br />عمال يقول كلمت احد الشباب واتيلت علي عيني<br />لا شفنا مصدر من الاخوان ولا غير الاخوان<br />انا راي ان الموقع يتنيل علي عينة وتسموه \" ملاكي البلد \" احسن من ولادها"
archived = "2009-07-12"
capture_url = "https://web.archive.org/web/20090712140514/http://www.20at.com:80/20at/klam-rosas/3430.html"

