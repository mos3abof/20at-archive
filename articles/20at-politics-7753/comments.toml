text = "السلام عليكم اولا اريد ان اوضح لكم اني لم اصرح باي كلمةمن الكلام المكتوب اعلاه باسمي ثانيا لتعرفوا اني بريئة من هذالا الكلام حيث اني لبم امد الصحفي بأي تصريح وانا ضد ثقافة الموت واضربات الجوع الا من اجل مطالب مصيريةتستدعي هذه الطريقة في الدفاع عنها وثانيا لا أبلغ من العمر 25 سنة كما جاء في التحقيق الصحفي بل 24 سنة فأنا من مواليد 17 يناير 1985<br />شكرا على اتاحة الفرصة للتعليق والتجاوب"
