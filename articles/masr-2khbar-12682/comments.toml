text = "الناس مش فاضية للروايات والقصص<br />الناس بتجيب من الاخر<br />بتوجة الدش على قمر الهوت بيرد وبيتفرجوا على الروايات والقصص الواقعية من غير تورية ولا طباق ولا جناس - بتوريك اللى عمرك ما هتشوفة<br />خلاص ايام الصاوى راحت وحتى الساقية بتاعتة اختفت تماما من الارياف واصبح الفلاح يروى ارضة بالطرمبة الهندية الديزل 7 حصان تجميع المنصورة ولو ذهبت قدام بيت اى فلاح هتلاقى الطرمبة الهندى دى واقفة والساقية راحت مع الذكريات والايام الخوالى التى لا اعادها اللة"
