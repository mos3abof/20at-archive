text = "ربكم فاستجاب لكم \"<br />يقول الله عز وجل ما غضبت على أحد كغضبى على عبد أتى معصية فتعاظمت عليه فى جنب عفوى<br />ـــــــــــــــ ــــــــ<br />أوحى الله لداود<br />\" يا داود لو يعلم المدبرون عنى شوقى لعودتهم ورغبتى فى توبتهم لذابــو شوقا الى<br />يا داود هذه رغبتى فى المدبرين عنى فكيف محبتى فى المقبلين على<br />ـــــــــــــــ ــــ<br />يقول الله عز وجل<br />\"إنى لأجدنى أستحى من عبدى يرفع الى يديه يقول يارب يارب فأردهما فتقول الملائكة الى هنا إنه ليس أهلا لتغفر له فأقول ولكنى أهل التقوى وأهل المغفرة أشهدكم إنى قد غفرت لعبدى\"<br />ـــــــــــــــ ــــ<br />\"جاء فى الحديث: إنه إذا رفع العبد يديه للسماء وهو عاصى فيقول يارب فتحجب الملائكة صوته فيكررها يارب فتحجب الملائكة صوته فيكررها يارب فتحجب الملائكة صوته فيكررها فى الرابعة فيقول الله عز وجل الى متى تحجبون صوت عبدى عنى؟؟؟ لبيك عبدى لبيك عبدى لبيك عبدى لبيك عبدى<br />ـــــــــــــــ ــــــ<br />\"ابن آدم خلقتك بيدى وربيتك بنعمتى وأنت تخالفنى وتعصانى فإذا رجعت الى تبت عليك فمن أين تجد إلهاً مثلى وأنا الغفور الرحيم \"<br />ـــــــــــــــ ـــ<br />\"عبدى أخرجتك من العدم الى الوجود وجعلت لك السمع والبصر والفؤاد<br />عبدى أسترك ولا تخشانى، اذكرك وأنت تنسانى، أستحى منك وانت لا تستحى منى. من أعظم منى جودا ومن ذا الذى يقرع بابى فلم أفتح له ومن ذا الذى يسألنى ولم أعطيه. أبخيل أنا فيبخل على عبدى؟ \"<br />ـــــــــــــــ ـ<br />\"جاء أعرابى الى رسول الله فقال له يارسول الله \" من يحاسب الخلق يوم القيامة؟ \" فقال الرسول \"الله\" فقال الأعرابى: بنفسه ؟؟ فقال النبى: بنفسه فضحك الأعرابى وقال: اللهم لك الحمد. فقال النبى: لما الابتسام يا أعرابى؟ فقال: يا رسول الله إن الكريم إذا قدر عفى إذا حاسب سامح قال النبى: فقه الأعرابى\".<br />ـــــــــــــــ ـ<br />قال الله تبارك وتعالى فى الحديث القدسى:<br />\"يا ابن آدم استطعمتك ولم تطعمنى فيقول: فكيف أطعمك وأنت رب العالمين فيقول: أفلم يستطعمك عبدى فلان أما تعلم انك لو أطعمته لوجدت ذلك عندى\"<br />\"يا ابن آدم استسقيتك ولم تسقنى فيقول: فكيف أسقيك وأنت رب العالمين فيقول: أفلم يستسقيك عبدى فلان أما تعلم انك لو اسقيته لوجدت ذلك عندى\"<br />\"يا ابن آدم مرضت ولم تعدنى فيقول: فكيف أعودك وانت رب العالمين فيقول: مرض عبدى فلان أما تعلم انك لو عدته لوجدتنى عنده\"<br />يقول الله تبارك وتعالى:<br />\"يا عبادى إنى حرمت الظلم على نفسى وجعلته بينكم محرما فلا تظالموا<br />يا عبادى كلكم جائع الا من أطعمته فاستطعمونى أطعمكم<br />يا عبادى كلكم عار الا من كسوته فاستكسونى أكسكم<br />يا عبادى كلكم ضال الا من هديته فاستهدونى اهدكم<br />يا عبادى انكم تخطئون بالليل والنهار وأنا أغفر الذنوب جميعا فاستغفرونى اغفر لكم<br />يا عبادى انكم لن تبلغوا ضرى فتضرونى ولن تبلغوا نفعى فتنفعونى<br />يا عبادى لو أن أولكم وأخركم وإنسكم وجنكم كانوا على أتقى قلب رجل واحد ما زاد من ملكى شيئا<br />يا عبادى لو أن أولكم وأخركم وإنسكم وجنكم كانوا على أفجر قلب رجل واحد ما نقص من ملكى شيئا<br />يا عبادى لو أن أولكم وأخركم وإنسكم وجنكم قاموا على صعيد واحد فسألونى فأعطيت كل واحد منهم مسألته ما نقص ذلك مما عندى الا كما ينقص المخيط إذا دخل البحر<br />جاء فى الحديث إنه عند معصية آدم فى الجنة ناداه الله<br />\"يا آدم لا تجزع من قولى لك \"أخرج منها\" فلك خلقتها ولكن انزل الى الارض وذل نفسك من أجلى وانكسر فى حبى حتى إذا زاد شوقك الى واليها تعالى لأدخلك اليها مرة أخرى<br />يا آدم كنت تتمنى ان أعصمك؟ قال آدم نعم<br />فقال: \"يا آدم إذا عصمتك وعصمت بنيك فعلى من أجود برحمتى<br />وعلى من أتفضل بكرمى، وعلى من أتودد، وعلى من أغفر<br />يا آدم ذنب تذل به الينا أحب الينا من طاعة تراءى بها علينا<br />يا آدم أنين المذنبين أحب الينا من تسبيح المرائيين<br />أرسلها لكل من تحب وجزاؤك على الله"
