text = "متقولش ايه ادتنا مصر … نقول حتدي ايه لمصر<br />ـــــــــــــــ ــــــــ<br />فاهم يله انت وهو<br />يعني تدفعوا ضرائب زي الكلاب<br />تدفعوا وبس من غير ولا كلمه"
