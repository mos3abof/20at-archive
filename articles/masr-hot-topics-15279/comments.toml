[[comments]]
order = 3
subject = ""
author = "بقية التعليق السابق"
posted = "2010-02-11"
text = "وكشف مركز الأرض في تقرير أعده عن مشكلات المياه في الريف أن أعدادا كبيرة من الفلاحين يعانون من أمراض متعلقة بتلوث المياه، حيث تؤثر السميات مثل المبيدات والفلزات الثقيلة في مياه الشرب والمنتجات الغذائية على الصحة البشرية، وكذلك على الحيوانات والطيور والأسماك، وأوضح التقرير أن الأمراض الشائعة بسبب تلوث المياه مثل الفشل الكلوي والتهاب الكبد الوبائي تصل نسبتها إلى 10% في أنحاء مصر.<br />وقسم الدكتور الباز الأسباب التي تؤدي إلى الفشل الكلوي، وأرجع بعضها إلى أن المياه الملوثة بالمعادن الثقيلة مثل الزئبق والكادميوم والزرنيخ والرصاص سبب رئيسي من أسباب الفشل الكلوي وسرطان المثانة،"
archived = "2010-02-13"
capture_url = "https://web.archive.org/web/20100213171710/http://www.20at.com:80/masr/hot-topics/15279-2010-02-10-16-24-24.html"

[[comments]]
order = 4
subject = ""
author = "بقية التعليق السابق"
posted = "2010-02-11"
text = "وأضاف أن 60 فرداً لكل مليون يتم زرع كلية لهم كل عام من المتبرعين الأحياء، وأن الوفيات من الفشل الكلوي بلغت 117 لكل ألف مصاب بإحصائيات ترجع إلى عام 1996.<br />وفي دراسة أعدها مركز الدراسات الريفية على حالة مياه الشرب بصعيد مصر، كشفت النتائج الأولية عن أن معظم قرى محافظة المنيا تواجه أزمة حادة في مياه الشرب، حيث كشفت الدراسة عن وجود أكثر من 200 قرية وعزبة لا توجد بها مياه شرب نقية، وأكدت نتائج التحاليل التي أجريت على عدد من العينات العشوائية ارتفاع نسبة الأملاح والمنجنيز عن الحدود المسموح بها، وأن هناك ارتباطا مباشرا بين ارتفاع نسبة الأملاح في مياه الشرب، وزيادة نسبة الإصابة بأمراض الفشل الكلوي وأمراض."
archived = "2010-02-13"
capture_url = "https://web.archive.org/web/20100213171710/http://www.20at.com:80/masr/hot-topics/15279-2010-02-10-16-24-24.html"

[[comments]]
order = 5
subject = ""
author = "بقية التعليق السابق"
posted = "2010-02-11"
text = "وأوصى الفريق العلمي الذي أشرف على هذه الدراسة في نهايتها باستعمال مواد بديلة لتعقيم مياه الشرب كالأشعة البنفسجية أو الأوزون، بدلا من الكلور الذي يتفاعل بدوره مع الأمونيا، ويؤكسده نتيجة استخدامه بشكل عشوائي في مرافق مياه الشرب.<br />ويرى أستاذ جراحة المسالك البولية وزراعة الكلي المساعد بمركز الكلي والمسالك البولية بالمنصورة الدكتور بدير على الدين الباز أنه نظرا لغياب الدور الحكومي في القيام بإحصاء حقيقي، فإنه لا توجد أرقام نهائية لهذا المرض، مؤكدا أن مصر بها على الأقل نحو 15 ألف مريض، بنسبة بلغت 225 مريضا لكل مليون، وفقا لآخر الدراسات التي أجريت في أواخر التسعينيات، وهذه النسبة ارتفعت على مدار السنوات السابقة، ففي عام 1974 كانت نسبة مرضى الفشل الكلوي لا تتجاوز 10 لكل مليون، وفقا للدراسة التي أجراها الطبيبان ماجد عبدالكريم وعادل عفيفي."
archived = "2010-02-13"
capture_url = "https://web.archive.org/web/20100213171710/http://www.20at.com:80/masr/hot-topics/15279-2010-02-10-16-24-24.html"

[[comments]]
order = 6
subject = ""
author = "سرطان وفشل كلوي"
posted = "2010-02-11"
text = "نعوذ بالله من ذلك<br />ـــــــــــــــ ـــــــــــ<br />كشفت دراسة جامعية أن 100 ألف يصابون بالسرطان سنوياً في مصر بسبب تلوث المياه، وأن أكثر من 35 ألفاً يصابون بالفشل الكلوي، بينهم أكثر من 17 ألف طفل يعانون من أعراض مزمنة.<br />وكانت الدراسة التي أعدها أساتذة الكيمياء التحليلية بكلية العلوم بجامعة المنصورة، وعرض لها الدكتور مجدي خليفة قد أكدت أن نسبة مرضي الفشل الكلوي في مصر ارتفعت في الآونة الأخيرة بنسبة كبيرة، حيث ذكرت بيانات الجمعية العامة لمكافحة الفشل الكلوي أن نسبة الإصابة بالفشل الكلوي ارتفعت بشكل مخيف في محافظات مصر بنسب تتجاوز 500 مريض لكل مليون نسمة، وتتزايد بنسبة 40% سنوياً."
archived = "2010-02-13"
capture_url = "https://web.archive.org/web/20100213171710/http://www.20at.com:80/masr/hot-topics/15279-2010-02-10-16-24-24.html"

[[comments]]
order = 7
subject = ""
author = "لو فية راجل يعملها"
posted = "2010-02-11"
text = "لو فية راجل فى الحكومة دى ياخد قرار بالغاء الدعم فى وضع المرتبات الحالى<br />يبقى راجل ابن راجل<br />لان البلد هتولع بعدها بكام يوم<br />ولان الدعم يحصل الفقير منة على الفتات - واظن على نفس موقع عشرينات اخبار ان<br />وزير المالية اتعالج على نفقة الدولة بمليون جنية واعضاء مجلس الشعب ب 500 مليون جنية ومش عارف الباقيين اتعالجوا بكام<br />دعم اية<br />الراجل يلغى الدعم عن رغيف العيش والبوتاجاز والبلد هتولع فى وش امة<br />الناس ماشية فى الشوارع بتكلم نفسها<br />والفريق طيار فى منتجع شرم الشيخ بيقابل ابو عباس او نتنياهو<br />ودقى يا مزيكة"
archived = "2010-02-13"
capture_url = "https://web.archive.org/web/20100213171710/http://www.20at.com:80/masr/hot-topics/15279-2010-02-10-16-24-24.html"

