subject = ""
author = "مش ححبك"
posted = "2010-02-10"
text = "الحكومة حتلغي الدعم علشان خاطر الكوره<br />ما هي ادت لكل لاعب مليون جنيه يعني المنتخب 25 لاعب يبقى 25 مليون جنيه على الترابيزه<br />يبقى ما فيش اي فرصة للدعم يا عم مصطفى شحاته<br />وليه الحكومة تدعم الشعب من اصله الشعب هو اللي المفروض يدعم الحكومة<br />يا مصطفى شحاته ما سمعتش شاديه زمان كانت بتغدي اغنية بتقول<br />ما نقلش ايه ادتنا مصر<br />نقول حندي ايه لمصر<br />اهو هو دا شعار الحكومة من يوم ما الفريق طيار شرف<br />سلام يا مصطفى شحاته وسلملي على محمد جمال الدين<br />البركه فيكم انتو بقا"
archived = "2010-02-13"
capture_url = "https://web.archive.org/web/20100213171710/http://www.20at.com:80/masr/hot-topics/15279-2010-02-10-16-24-24.html"

[[comments]]
order = 1
subject = ""
author = "مصر مش امريكا"
posted = "2010-02-11"
text = "البهوات بتوع الاقتصاد اللى بيطبقوا الطريقة الامريكية - بمعنى ان الدولة ما تعملش حاجة وتعتمد فى انفاقها على جباية الضرايب من الناس - مصر مش امريكا وامكانيات الشعب المصرى غير امكانيات الامريكان<br />ضرايب من اين ؟<br />القصة حدثت قبل ذلك فى مصر ايام المماليك<br />وكان فية مملوك بيجمع جباية بطال على عمال اسمة برديسى<br />وخرجت المظاهرات فى القاهرة تهتف<br />ايش تاخد من تفليسى يا برديسى<br />ونحن ممكن نهتف<br />ايش تاخد من تفليسى يا غالى<br />مش هندفع ضرايب لاننا ببساطة معندناش فلوس"
archived = "2010-02-13"
capture_url = "https://web.archive.org/web/20100213171710/http://www.20at.com:80/masr/hot-topics/15279-2010-02-10-16-24-24.html"

