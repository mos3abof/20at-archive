[[comments]]
order = 12
subject = "الي كل قاريء محترم وفقط"
author = "احمد البهنساوي"
posted = "2007-02-17"
text = "اكتب تعليقي لكل قاريء محترم يريد ان يستفيد او يفيد وليس لشرذمة تتبني منطق ( خالف تعرف ) او انه يريد فرض رايه بلوي الدراع مستخدما الفاظ نابية تدل على بيئته التي تربي فيها وبالتالي فلا حرج عليه في اراءه الشاذه وهؤلاء يكفيهم قول الشاعر ( اذا نطق السفيه فلا تجبه فان خيرا من اجابته السكوت )اما القاريء المحترم الذي ينتقدني نقدا بناءا فاؤكد له اني لا اريد بهذا الموضوع اثارة فتنة او تكفير احد بل ان ادق ناقوس الخطر على كل من يكفر اشخاص او مذاهب او طوائف بعنينها دون ان يكون معنيا بهذا او ليس له سند فضلا عن خطورة ثقافة التكفير التي انتشرت في المجتمع المصري في الفترة الاخيرة كما اني اكتب التحقيق وعيني على وطننا مصر الذي قد يصبح كالسفينة التى توشك ان تصطدم بجبل الثلج اذا شاع منطق التكفير لكل من هب ودب دون معرفة قيم الاسلام المتسامحة والتي اوردها كلام رب العالمين ( لا بنهاكم الله عن الذين لم يقاتلوكم في الدين ان تبروهم وتقسطوا اليهم ) وحديث خاتم الانبياء والمرسلين سيدنا محمد صلي الله عليه وسلم في حديث ما معناه ( من آذي ذميا فانا خصيمه يوم القيامة ) وفي النهاية ارجو الا يساء فهمي وان يكون القاريء العزيز على مستوي حسن الظن به من الفهم الصحيح ورحابة الصدر والتعليق الذي يعكس قيمه وسلوكه فضلا عن النقد البناء"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073753/http://masr.20at.com:80/article.php?sid=1601"

[[comments]]
order = 13
subject = "تصحيح"
author = "إبن بهيه"
posted = "2007-02-17"
text = "إيه ده ؟<br />مين علق بالنيابه عني كده ؟<br />وبيقول على لساني كلام لا قلته ولا يمكن أقوله نوهائيا ؟؟؟<br />وقال إيه كمان .. نحن معك لعبور المستقبل يا جمال..<br />طيب والله لو الأخ الذي تكلم بالنيابة عني كان كتب كلام معقول ومحرم شويه كنت سكت<br />لكن يقول على لساني ((نحن معك يا جمال))<br />لأ .. كده حضرة المنتحل لإسمي مش حرامي بس ده عبيط كمان .. لأن كل خلاياي تصرخ لا لمبارك الواطي الأول وسبعين ثمانين مليون لأ لمبارك الواطي الثاني ..<br />طبعا لا ومليون مليون لألألأ لمبارك الواطي الأول والتالي اللي عمره ما راح يشوفها بإذن الله غير إذا كانت مصر رجعت لزمن المماليك وحكم الخصيان فيها<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073753/http://masr.20at.com:80/article.php?sid=1601"

