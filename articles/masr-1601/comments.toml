[[comments]]
order = 23
subject = "الدين لله الدين لله"
author = "طبعا الاخ الـ.. غاوى يكتب عربى بالانجليزى و ده مش اول رد ليه عييييييب اوى عليك اللى انت بتعمله ده على فكره محدش يعبره و لا يعمل له اى اعتبار خليه كده يخبط دماغه فى الحيط ويتفلق ، وان كان ليه ملاحظات على رد احد يقول ملاحظاته دى باسلوب واضح حتى على الاقل بدل هذا الانحدار فى اسلوب الكلام"
posted = "2007-02-18"
text = "انما برضه من ناحيه تانيه اختلف مع فهد والاخ الذى يقول ان فهد يعبر عن الوسطيه اساله ما معنى التشدد فى رايك ؟؟<br />ملاحظه ثالثه عندما تدافع عن دينك اى كان فان تدافع عن القيم والاخلاق و الاداب فى الكلام و الفعل ، فعندما تفعل هذا لا يكون الدفاع بالسباب و الشتيمه فانت تخرج عن الدين الذى تدافع عنه. يعنى لو قلت .. ..اكيد حرام حرام حرام الموضوع مش محتاج عالم عشان يفتى بهذا الموضوع بالعقل و بمبادىء الدين البسيطه طبعا حرام."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219165940/http://masr.20at.com:80/article.php?sid=1601"

[[comments]]
order = 24
subject = "توضيح"
author = "فهد الا سلام"
posted = "2007-02-19"
text = "بسم الله الر حمن الر حيم بعد اذان كل الناس المحتر مين تو ضيح بس على البنادم الغير محترم با لمرة سفية السان لا نة مش متربى والله يا اخى اتحدك ان كنت حتى واخد دبلوم صنا يع لا نك مش محترم با لمرة وبر ضة سوف اقتص منك اولا انا واخد معهد قر ات مش قر ان يا جا هل وهل العلم با لشهادات الم تسمع عن الا ستاذ العقاد وغير ه من حملة العلم من غير شهادات ولله المثال الا على والله بكلمك واشك انك تفهم كلا مى ان يا حمار بينهق ادارس فقة وسنة وحديث فا هم ولا بر ضة زى الحمار ان كان عندك حجة فنا قش بلا دب اما انت زى الحمار يتبول فى مكانة من غير ان يعى انة وسخ المكان الى بيكل فية انا مش بكفر والعياز با لله ولكن بقول قال الله وقال الر سول ولا انت ملكش دعوة بكلام دة والله دة حتى لو و احد من خارج الا سلام يستحى ان يقول كلا مك حتى يا اخى انت من الجبنا لا تكتب اسمك يا اخى اتقى الله فى نفسك وكن محترم حتى مع نفسك واتحدك مرة اخرى ان كنت تعلم شى عن الدين عندما يتحدث اى شخص عن الدين يثور امثاللك من العلمنين الجهلين الم تسمع قول الله تعا لى وما خلقتكم الا لتعبدون اى نحن عبد الله وليس عبيدا هذة الدنيا الزالة اتق الله واستغفر الله حتى لو كلا مك عن صح بس اسلوبك القذر لا ير ضى عنة احد لمسلم ولا مسيحى ولا حتى يهودى تعلم الا دب لا كل هذة الا ديادن تحض على الا دب مش عارف هتفهم كلا مى ولا انت من الجهلا ءواسف ان كنت طلعت كلام يخدش شعور الا خوة المحتر مين بس كان لازم ارد على هذا اغبى حتى يفيق من الى هو فية والسلام عليكنم ومرة تا نية بعد اذان ادارة المو قع يا ريت حذف الا لفاظ الخا رخة لا ن من يسب ويضرب هو الضعيف اما نحن فنقول كلام الله سبحانة وجدلهم با لتى هى احسن وشكر"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219165940/http://masr.20at.com:80/article.php?sid=1601"

[[comments]]
order = 25
subject = "ثقافه انت من دشنا و ابن بهيه لا تقلق"
author = "نيفين نيفى نوفا"
posted = "2007-02-19"
text = "المشكله الحقيقيه اننا عايشين فى زمن انت لم تكن معى فانت ضدى<br />الحوار انعدم و محدش عايز يتقبل ثقافه و لا معتقدات الاخر<br />و لا مانع من الشتائم و التجريخ ان لزم الامر<br />زى نكته واحد صعيدى بيسال زميله ف الجيش انت من دشنا فقاله لا قاله تبقى من ديش العدو و لازم تموت<br />على فكره مش قصدى التريقه على اخواننا الصعايده لانهم على راسى و الله دا بس مثال<br />بالنسبه لابن بهيه<br />اطمن اكيد احنا عارفين ان دا مش رايك<br />بس خد باللك فيه ناس مستلمينك ف التعليقات اليومين دول عموما الشجره المثمره خى دايما اللى بتتحدف بالطوب"
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219165940/http://masr.20at.com:80/article.php?sid=1601"
