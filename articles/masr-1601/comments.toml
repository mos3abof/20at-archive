[[comments]]
order = 1
subject = "تعليق"
author = "BATISTUTA"
posted = "2007-02-16"
text = "التكفير لا يصدر الا من عالم موثوق فيه بناء على حجة واضحة ثبتت على الشخص المراد تكفيره لذا فموضوع تكفير شخص ما ليس موضعا للاهواء كما تحكمه ضوابط كثيرة حتى لا يعتقد احد انه بلا حدود .<br />ومن ناحية اخرى ارى ان التكفير سلاح ذو حدين مفيد من ناحية اظهار ذلك الشخص للجميع حتى يتجنب الناس افكاره الضاره وتطهير المجتمع من المنافقين وضار اذا انتشر بين العامة .<br />كلمة اخيرة عندما نتعرض لتكفير الطوائف الاخرى اقباطا أوشيعة أو بهائيين أرجو الا نسيس الموضوع فالاسلام لا يسيس لغرض آخر كالحفاظ على الامن والسلام والوحدة الوطنية .<br />ففى هذه الحالة كلام الله فى قرآنه الكريم هو من يقرر المسلم من الغير مسلم .<br />وأرجو ألا يتهمنى أحد بالتحريض على الفتنة و الخ .فما الضير من ان يعرف الاخرون انهم مخطئون وفى نفس الوقت تكون المعاملة حسنة مبينه على الود والسلام فالعنف لا يولد الا عنف وشكرا"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073753/http://masr.20at.com:80/article.php?sid=1601"

