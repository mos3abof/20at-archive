[[comments]]
order = 3
subject = "كاتب دماغه فاضيه"
author = "مصرى"
posted = "2007-02-16"
text = "الكاتب دماغه فاضيه....يعنى 1000 بهائى تقريبا يتعمل لهم مقال على ايه لادياده ولا ديالو شويه شاذين دماغهم ضارب واساسا وافدين على مصر وفكرهم منحل...وهل هناك اى بهائى ذو حيثيه فى المجتمع منذ ظهورهم..الحل التضيق عليهم حتى يخرجوا وللعلم كل اللى ظهروا فى التلفزيون من شكلهم حالتهم الماديه عاليه....وانا بقول للكاتب بيقولوا كل 500 سنه يظهر نبى لهم !فما رايه ان يظهر فى المستقبل نبى وفى مصر وفى تلك الحاله ستكون مصر مركز للبهائيه العالميه فهل يقبل ؟ فضوها سيره واتكلم عن ساكنى المقابر والعشوائيات واواومشاكل مصر اهم وسيبك من بتوع خليل افندى وحضرته والكلام الفاضى والخزعبلات دى ...اه حريه معتقد بس مصر متبقاش بزرميط وعبده شيطان وشواز وشيعه بيلطموا..ارحمونا من المواضيع الهايفه"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073753/http://masr.20at.com:80/article.php?sid=1601"

[[comments]]
order = 4
subject = "نحن معك فى عبور المستقبل"
author = "ابن بهية"
posted = "2007-02-16"
text = "نحن معك فى عبور المستقبل<br />نحن الموقعين ادناة الذين يستشعرون مدى الجهد المبذول والايمان الراسخ لدى السيد جمال مبارك فى التغلب على الصعاب والمشاكل التى تواجها مصرنا الحبيبة والشعب المصرى بكل طوائفة واطيافة.نعلن التاييد الكامل والقاطع للسيد جمال مبارك, وايماننا بما يسعى الية من ترسيخ مبادىء الحرية والديمقراطية والاصلاح وتكافوء الفرص بين ابناء البلد الواحد, وعدم قناعتنا بما يحاولة المشككين والمغرضين من تعطيل مسيرتة فى عبورة بنا الى المستقبل كما اننا نؤكد لة ان كل المصريين يدركون مدى المصداقية والشفافية والاخلاص الذى يتمتع بها السيدجمال مبارك, على الرغم من الحملات المنظمة التى يقوم بها المفسدين مستغلين المناخ الديمقراطى التى تنعم بة مصرنا الحبية فى عهد الرئيس محمد حسنى مبارك ونحن اذ نعاهد السيدجمال مبارك على اننا لن نسمح لهؤلاء القلة ببث تلك الافكار الهدامة وسنتصدى لتلك الحملات المنظمة ولن نتجاهلها, ولن نسمح لها بان تشكل عبئا ومساسا بمستقيل البلاد وامنها القومى وبناءا علية فقد عقدنا العزم على اتخاذ مجموعة من الاجراءات الفعلية كالاتى:<br />اولا: دعم المزيد من التوافق الوطنى والاجماع الشعبى تجاة مشروع جمال مبارك للعبور الى المستقبل ثانيا<br />توضيح ما اتخذة السيد جمال مبارك من سياسات ودعم المشاركة الشعبية فى دفعها الى حيز التنفيذ<br />ثالثا: مواجهة الافكار الهدامة والشائعات المغرضة فى كافة وسائل الاعلام والصحافة مثل مواجهة دعاوى التوريث ,بدعاوى التاسيس للمستقبل<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073753/http://masr.20at.com:80/article.php?sid=1601"

