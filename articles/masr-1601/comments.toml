author = ".. فهد الاسلام فرحان قوى ان معاة معهد قراءن الغريب فى الموضوع ان الاخطاء الاملائبة واضحة طيب يابو شخة انا بقى يافهد معايا ماجستير فى العلوم الاقتصادية وزميل جمعية المحاسبين وووووووووو مسلم وبس ومش عامل فيها شيخ"
