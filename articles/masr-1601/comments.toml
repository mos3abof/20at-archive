[[comments]]
order = 6
subject = "الله واحد"
author = "فهد الا سلام"
posted = "2007-02-17"
text = "بسم الله الر حمن الر حيم /الدكتور محمد عمارة هو علم جليل وعندما تكلم عن هذة القضية كان يتحدث عن راى الا سلام وليس رايه وهذا وضحة فى قناة دريم الفضاية مع مجدى مهنا ثا نيا الدين المسيحى هو نعم لرسالة سمو ية ولكن الا سلا م يجب ما قبلة كما فعلت اليهودية فكل الر ساللات تكملت لبعضة وكان الا سلام اخلر الا ديان فهو يلغى ما قبلة لا ن لو نظرنا الى القضية سنجدها واحدة ولكن بنى الا نسان هم الذين غير فى المضمون ومع ذلك نحن نعيش فى واقع ونرض بلا خوة المسحين اخوة لنا لا ن هذا هو معتقدهم لا ن دينا يقول لا اكرة فى الدين اما عن مثال الشيعة فا لشيعة هى فاة ضلا ة فى الا سلام لو يعرفون قدر الا سلام وقدر الله ورسولة وصحابة رسول الله ما فعلو هذا ولكن هم فية ضالة من جماعة عبد الله بن سبا اليهودى الذى تظاهر بلا سلام ولكنة فتن المسلمين بعضهم ببعض ومثال واحد عن هولا ء الشيعة غير سب سيدنا عمر وسيدنا اب بكر لو كانو فعلا مسلمين لماذا ارادو تفجر الكعبة المشرفة فى عام 90 وعلقو صورة المرتد الكافر الخمينى لعنة الله علية اقراو تا ريخ الشيعة هم يمجدون ابو لو لوة المجوسى قاتل الفاروق عمر بن الخطاب الذى قال عنة رسول الله هو فاروق الحق الشيعة هم من يدعوان على رسول الله الباطل ويقولون انة كان يخاف من عمر واب بكر والله انتم قوم ضلا لة وانا عندى الكثير عن الشييعى وافتحو مو قع القر ناس واقر واء تا ريخ الشيعة ام عن الكلب الا كبر بهاء الدين المدعو بلا لو هية فا يضا هو جاء من ايران من جمهورية الر افضة فهم كلاب تنبح ويحل دمهم شرعا وقا نو نا اما اخير الا خ الى بيسل انة كان مسلم وبقى مسيحى فالقول لهو انتم ما الا كابعوضة لا تهز الا سلام فى شى لا نى مش كل مسلم هو مسلم الا سلا م دين ودنيا وبحث عن الحقيقة اما مثالة ان الولة او<br />اقرأ بقية التعليق .."
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073753/http://masr.20at.com:80/article.php?sid=1601"

[[comments]]
order = 7
subject = "انا مش مقتنع"
author = "اول حاجه انا لم اعتنق الاسلام عن بحث وقراءه وبعد ذلك دخلت فى الاسلام بحريه شخصيه ولكن انا ولدت وجدت نفسى مسلم اليس من حقى ان اعتنق الدين الذى اقتنع به اي ان كان وليس من حق احد اى ان كان ان يكفرنى حتى وان كان عالم لانه ليس اله لان العباده هى علاقه بين الله والانسان اين حريه العقيده اين لا اكراه فى الدين ولا هى شعارات و ايات نرددها وخلاص دون تطبيق"
posted = "2007-02-17"
text = "وعاوز اؤل حاجه للناس الى بتتحمء اوى وبتفرض دينها على الاخرين وبتكفر فى الاديان الاخرى هو احنا بنعبد امك ولا بنعبد الله<br />احنا بنعبد الله يبقى دى علاقه بينى وبين الله محدش يدخل فيها اى ان كان<br />بتخنق اوى لما اسمع فى الشغل انى الراجل ده مسيحى والراجل ده مسلم احنا مالنا دينه ايه<br />دا مش بس كدا دا كمان حزب كامل اساسه تمييز الدين وحركات التبشير ليه ياجماعه احنا كلنا اخوات مصريين لما احنا هنعمل فى بعض كده ومال الاجانب يعملو فينا ايه<br />اه يعنى مسيحى يبقى مسلم او مسلم يبقى مسيحى احنا مالنا هو الى هيتحاسب والا احنا"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073753/http://masr.20at.com:80/article.php?sid=1601"

[[comments]]
order = 8
subject = "هى دى طبيعة شعبنا"
author = "ان كنت بقيت مسيحى ففى الف سلامة لن تضير الاسلام شيئا"
posted = "2007-02-17"
text = "الاسلام كل يوم يدخل الية الالاف من كل بقاع الارض بناقص واحد وان كنت اشك انك مسيحى من الاساس وبتقول كدة علشان تبين ان فية مسلمين بيتحولوا للمسيحية وهذا مشكوك فية<br />وانا اعتقد ان المسيحيين فى مصر خونة ويجب ابعادهم عن الوظائف الهامة<br />وكفاية عليهم تربية الخنازير هى ناقصة مش كفاية انهم مسيطرين على اقتصاد البلد"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073753/http://masr.20at.com:80/article.php?sid=1601"

