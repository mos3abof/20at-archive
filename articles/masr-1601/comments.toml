[[comments]]
order = 17
subject = "فضيلة الدكتور العلامة الجليل سلمان بن فهد العودة"
author = "الاسم : سلمان بن فهد العودة"
posted = "2007-02-18"
text = "الدولة : السعودية<br />البريد الإلكتروني: salman@aloadah.com<br />سيرة الشيخ ومعلومات عن حياته :<br />نسبه:<br />هو الشيخ سلمان بن فهد بن عبد الله العودة من مواليد عام 1376 هـ، وكان ميلاده في قرية البصر وهي قرية هادئة في الضواحي الغربية لمدينة بريدة من منطقة القصيم، وهو متزوج وعنده اثنا عشر ولداً ما بين ذكر وأنثى أكبرهم (معاذ).<br />النشأة العلمية :<br />كانت نشأته في تلك القرية ثم انتقل إلى الدراسة في بريدة بعد سنتين من الدراسة الابتدائية ثم التحق بالمعهد العلمي في بريدة وقضى فيه ست سنوات دراسية، وكان يضم نخبة من فضلاء مشائخ البلد منهم الشيخ صالح السكيتي – رحمه الله – والشيخ علي الضالع – رحمه الله – والشيخ صالح البليهي – رحمه الله – وأمثالهم كثير، أتاحت له الدراسة فرصة الجلوس بين أيديهم والأخذ من علمهم ومن أخلاقهم واستفاد من ذلك، كما أن التحاقه بالمعهد أتاح له فرصة الاستفادة من مكتبة المعهد آنذاك، وكانت عامرة بعدد كبير من الكتب، وهناك مكتبة للإعارة وتتجدد وقتا بعد وقت فتضم عدد كبيراً من الكتب الجديدة التي يحتاج الناس إليها .<br />حفظه للمتون وطلبه للعلم :<br />إن طبيعة تكوين الطالب في مراكز العلم الشرعي تهتم عادة بتلقين الطالب عدداً من المتون، ومن المتون التي حفظها على سبيل المثال فيما يتعلق بالعقيدة الأصول الثلاثة والقواعد الأربع، وكتاب التوحيد، والعقيدة الواسطية،، وفيما يتعلق بالنحو متن الآجرومية وقد حفظه وحفّظه لطلابه في المسجد، وكذلك فيما يتعلق بالفرائض هناك متن الرحبية وهو عبارة عن منظومة شيقة وخفيفة ومختصرة فضلاً عن كتاب زاد المستقنع في الفقه الحنبلي ولعله من أشهر متون الحنابلة وأكثرها مسائل، وقد قرأ جزأ كبيراً من شرحه في المعهد العلمي وقرأ شرحه على عد<br />اقرأ بقية التعليق .."
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073753/http://masr.20at.com:80/article.php?sid=1601"

