text = "الاسلام دين الفطره<br />يعني اي انسان بيتولد بيتولد مسلم<br />كما قال النبي محمد صلى الله عليه وسلم يولد الطفل على الفطره ثم يهودانه او ينصرانه او يمجسانه<br />والفطره يعني لا اله الا اله لان الله سبحانه وتعالى هو الذي خلق الكون بمن فيه وخلقنا فاصبحنا نعرفه دون ان نراه ونشعر به لانه هو الذي خلقنا"
