[[comments]]
order = 20
subject = "ادارة الموقع منتظرة ايه !!!!"
author = "فارس_fr"
posted = "2007-02-18"
text = "ارجو من ادارةالموقع حذف التعليقات المنافية للاداب العامة للحوار والتعليقات التى تحتوى على سب وقذف لبعض المعلقين المحترمين . وكذلك حذف اللينكات الغريبة التى اقتحمت اغلب الموضوعات<br />همسة فى اذنك يا بهنساوى :-<br />ان معاك ان مش من حق كل من هب ودب انه يكفر الناس ويحكم عليهم بانهم خارجين عن الملة ,, ولكن الكلام ده فى الحالات التى تحتاج الى مختص \"رجل دين \" يكون الحكم عليها من خلال هذا الرجل . لكن هناك حالات لايمكن السكوت عليها باى حال من الاحوال \"فالحلال بين والحرام بين \" زي حالات البهائية دى بالضبط ,,, وعموما مشكور على مقالك ."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219165940/http://masr.20at.com:80/article.php?sid=1601"

