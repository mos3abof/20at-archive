[[comments]]
order = 10
subject = "اقتنع"
author = "فهد الا سلام"
posted = "2007-02-17"
text = "بسم الله الواحد الا حد ان كنت يا اخى ولدت مسلم وهذا قدراك لم يمنعك احد من ان تبحث وتشتكشف عن الحقيقة مرة ثاثنية اقولك ان الا سلام دين علم وبحث عن الحقايق واتحدك ان كنت بحثت او حاولت تعرف شى عن الدين فانت علمانى والعلمنانية لا دخل له با لدين ومع ذلك نحن لا نكفر احد دة رايك وانت حر فية وبعد كدة انت متنقض مع نفسك تقول ان الله واحد وهو الى بيحسب ودى عقيدة المسلمين اما الا خوة المسحين فعقيدتهم ان الله ثلا ثة الاب والا بن والر وح القدس يعنى شوف انت عاوز مين من الثلا ثة نصيحة ليك ابحث عن الحق وما الدنيا الا دار ابتلاء وانت معترف انه فية حساب فماذا اعدات للوقوف امام الله ان كنت خرجت من الا سلام فكل يوم يدخل فية الا ف واخر احصاية انة فى مصر كل يوم فية 10 بياسلمو اتقى الله وندعو الله للك ان يبين لك طريق الحق"
archived = "2007-02-18"
capture_url = "https://web.archive.org/web/20070218073753/http://masr.20at.com:80/article.php?sid=1601"

