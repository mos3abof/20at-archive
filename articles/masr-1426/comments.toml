subject = "دستوركم يا اسيدنا"
author = "فاكرين التاريخ القديم لما كانت المظاهرات بتطالب - الدستور يا افندينا"
posted = "2007-01-10"
text = "بتتكلموا عن المادة 77 - المادة 77 بتنص على تحديد المدة بمرتين - لكن مجلس الموافقون عدلها الى مدى الحياة<br />انا رايى الشخصى ان البساط يبقى احمدى<br />ونعيش كدة حبايب لا دستور ولا دياولوا<br />وحتى لو كان فية مائة دستور هييجى اية تحت تهديد اى مخبر فى القبض على اى انسان بجناية الاشتباة<br />نضفوا القوانين اولا من سلطات الشرطة بالقبض على اى مواطن تحت بند الاشتباة<br />وحطوا قانون يحترم كرامة المواطن يمنع القبض على اى مواطن الا بامر القاضى<br />انما يقبض على اى انسان تحت الاشتباة فهذة قمة احتقار اى انسان<br />مش عايزين دستور على الرف - عايزين قوانين تحمى كرامة البشر"
archived = "2007-01-12"
capture_url = "https://web.archive.org/web/20070112142300/http://masr.20at.com:80/article.php?sid=1426"
