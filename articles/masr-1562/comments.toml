[[comments]]
order = 0
subject = "يا طفلى الغالى"
author = "ياطفلى الغالى انت فى بلد يحتضر ومكبل بكل روتينات المماليك والاتراك وعقد البكوات والبشوات"
posted = "2007-02-08"
text = "لو كنت فى بلد اخر سواء عالم عاشر او اول لحولت الشرطة حادثتك الى القضاء ولعقدت المحكمة فى نفس الاسبوع وقبل ان يمضى شهر يحكم لك بتكلفة العلاج وتعويض يكفل معاشا لك اربعون عاما<br />ولكنك فى بلد القضاء فية مكسح ويمشى فى سرعة السلحفاة<br />وحقوق الفقراء فية ضائعة<br />انهم يفرضون ضرائب وياخذون حق معلوم من اموال السائل والمحروم<br />بينما اغنيائهم يسرقون اموال البنوك ويهربون بها<br />لك اللة<br />ولبنتقم منهم اللة وياخذهم اخذ عزيز مقتدر"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210052926/http://masr.20at.com:80/article.php?sid=1562"

[[comments]]
order = 1
subject = "حسبي الله ونعم الوكيل"
author = "مواطن مصري طالع ميتين اهله"
posted = "2007-02-08"
text = "لما محمود ياسين يروح يتعالج علي نفقة الدولة ويتعمل بطل قومي<br />لما مدرب الاهلي ياخد 60 الف دولار في الشهر وملاين الشباب مرميين علي الارصفة<br />لما المطرب الفلاني ياخد في الحفلة الواحدة 100 الف جنيه والاف الاسر مش لاقيت تتعشي<br />وضحايا القطارات والمواصلات ميلقوش الفين جنيه تعويض ويدخوا في المحاكم عشان يخدوا نصهم<br />لما طفل يتشوه بسبب الاهمال والدولة ترفض تديله تعويض ويتعالج علي نفقتها<br />لما ولما ولما..............<br />يبقي انت اكيد في مصر<br />حسبي الله ونعم الوكيل"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210052926/http://masr.20at.com:80/article.php?sid=1562"

[[comments]]
order = 2
subject = "من هم لهم ياقلبي لا تحزن !!!!"
author = "فارس_fr"
posted = "2007-02-08"
text = "اولا الله يصبر اهل الطفل ده على اللى حصله من جراء الاهمال الحكومى . وهذه ليست اول حادثةمن هذاالنوع ولااخر حادثة طالما احنا شعب جبان و يستاهل الضرب على قفاه من اى كلب حكومى طالما اتنزعت مننا الكرامة والعزة والنخوة , طالما كل واحد بيقول وانا مالى يبقي قول علىالبلد السلامة .<br />حسبي الله ونعم الوكيل , طالما الشعب جبان ومستحمل الاهانات المستمرة والانتهاكات الدائمة لحقوقه , لابسط حقوقه , ومستسلم لارادة البلطجية من الشرطة ومن الجيش يبقي متستكتروش ان طفل يصعق وتبتر زراعية او مجموعة طلبة تتهان وتنضرب عشان جيمى مبارك . والله انا قلت ومازلت اقول واردد ان حلها فى \" تسونامى \" بس تسونامى من نوع تانى تسونامى نخوة وعزة وكرامة فكرينها الكرامة اللى نسيتوها على ايد مبارك وكلابه لو رجعت لينا كرامتنا وكل واحد فينا حط نفسه او ابنه او اخته او بنته مكان الطلبة دول واللى حصلهم شوفوا ممكن نعمل ايه !!!!<br />مازال عندى امل فى الـ\"تسونامى \" ."
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210052926/http://masr.20at.com:80/article.php?sid=1562"

