[[comments]]
order = 12
subject = "الاخ حسام الزمر"
author = "ابومحسن"
posted = "2007-02-08"
text = "اولا يا اخي الكريم انا قلت (على حسب علمي) في بداية الكلام وفي منتصفه<br />ثانيا انا استشهدت بقصة فرعون وموسى وهذه قصة حقيقية في حياة الاخوان المسلمين وفي كل دعوتهم ان الحاكم هو فرعون وهامان هو وزير الداخلية وجنودهما هو الجيش.<br />ثالثا: ان هذا الكلام نابع من فهمي لقصة معاوية ويزيد والحسن والحسين وفشل سيدنا الحسين الذي هو من اشرف خلق الله في استعادة الخلافة المسلوبه منه والذي هو الاحق بها لأن الملك لله يؤتيه من يشاء<br />رابعا: انا ادعو كل الناس سماع تفسير الشيخ محمد متولي الشعراوي كله وهو الان موجود على اسطوانه واحدة والذي فيه ان الذي نطق الشهادتين لا يمكن ان يكون كافرا ابدا مهما بدر منه.<br />خامسا: انا ادعو ان يؤلف الله بين قلوب المسلمين جميعا ويجعلهم امة واحدة كما تركها الرسول صلى الله عليه وسلموادعو الله ان يلهم الحاكم الى الحكم بما انزل الله وخلي بالك الحاكم اللي هو حسني مبارك يدافع عن المادة الثانية من الدستور التي تنص على ان الدين الرسمي هو الاسلام والشريعة الاسلامية هي مصدر التشريع ولو كان"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

