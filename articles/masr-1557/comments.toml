subject = "نعم .. في انتظار المحنة"
author = "عبدالرحمن عياش"
posted = "2007-02-14"
text = "نعم للأسف ما يمكن أن أقوه أن الإخوان المسلمين دائما يعتبرون أنفسهم في انتظار المحنة<br />ولكن هذا لا يعني الاستسلام للظالم لمجرد أن ما يفعله بنا يعتبر ابتلاء من الله<br />لكننا في جميع الأحوال نعتبر أن الاصلاح ليس إلا خطوة واحدة من خطواتنا نحو التغيير<br />وبالتالي لعل ما قد يصيبنا بعد الحكومة يكون أضعاف ما اصابنا قبلها<br />وليست المعتقلات وحدها هي الابتلاءات<br />فكما نرى جميعا مقاطعة العالم لحماس<br />وأيضا وضع الاخوان في بعض البلاد كالاردن مثلا على لائحة الارهاب<br />فالموضوع عبارة عن صراع أبدي بين الحق والباطل .. ونثق تمام الثقة أن ما نفعلههو الحق ..<br />وليس كل من يعارضوننا باطلا<br />جزاكم الله خيرا على الموضوع الرائع<br />والسلام<br />al-ghareeb.blogspot.com"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217225247/http://masr.20at.com:80/article.php?sid=1557"
