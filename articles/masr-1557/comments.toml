author = "ياء"
posted = "2007-02-08"
text = "النشيد ده كنت بسمعه زمان زمان ولسه لحد دلوقتى بسمعه<br />ووقفنا امام كل العواصف<br />وتحت تهديد االطغاه<br />علمنا اننا موتا اذ بقينا او نعود<br />فحملنا جرحنا النازف فينا<br />وتقدمنا الى الامام قلنا لن نفر<br />اَثم من سوف يرجع<br />نحن لله جنود<br />لن نفر<br />اَثم من قال جرحى<br />لن نفر<br />اَثم من قال نفسى<br />لن نفر<br />اَثم من خاف من بطش الطغاه<br />وانطلقنا<br />نحو وعد الله نمضى<br />نحو نور الله نمضى<br />نحو ارض الله نمضى<br />ننتصر للحق او جنه للخلد<br />لا اختيار<br />دائما بالصبر ياتى الانتصار<br />وعد الله<br />قُل لَّن يُصِيبَنَا إِلاَّ مَا كَتَبَ اللّهُ لَنَا هُوَ مَوْلاَنَا وَعَلَى اللّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ (51) سورة التوبة<br />إِنَّا لَنَنصُرُ رُسُلَنَا وَالَّذِينَ آمَنُوا فِي الْحَيَاةِ الدُّنْيَا وَيَوْمَ يَقُومُ الاشْهَادُ (51) سورة غافر<br />كَتَبَ اللَّهُ لاغْلِبَنَّ أَنَا وَرُسُلِي إِنَّ اللَّهَ قَوِيٌّ عَزِيزٌ (21) سورة المجادلة<br />معا نحمل الخير لمصر<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/<br />لا مواخذه يا جوليت مينفعش ابقا روميو ممكن تقبلينى عنتر"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

[[comments]]
order = 10
subject = "البداية الخاطئة لجماعة الاخوان"
author = "ابومحسن غربه 25 سنه"
posted = "2007-02-08"
text = "(على حسب علمي)<br />ان جماعة الاخوان المسلمين للاسف بدأت بفكره خاطئة في البداية وهي انهم طبقوا قصة فرعون وموسى على انفسهم يعني المرشد العام هو موسى والاخوان هما بنو اسرائيل والحاكم هو فرعون والجيش هو جيش فرعون ووزير الداخلية هو هامان<br />(ان فرعون وهامان وجنودهما كانوا خاطئين)<br />يعني قامت على تكفير الحاكم) على حسب علمي<br />وهذا الامر الذي حول البلاد على سجون ومعتقلات منذ 50 سنه ونسف الجسور الحوار بين الجماعة والحكومة.<br />والحاكم ليس بكافر بناء على فتوى الامام الشافعي عندما قال في احدى حواراته ومناظراته ( .....بما يسلم الكافر قالوا بالشهادتين قال اذن ناطق الشهادتين ليس بكافر......)<br />وتعالوا هنا نشوف عقيدة اهل السنة والجماعة بتقول ايه<br />*1* وجوب طاعة الأئمة والولاة ‏:‏<br />ولا نرى الخروج على أئمتنا وولاة أمورنا وإن جاروا ، ولا ندعوا عليهم ولا ننزع يدا من طاعتهم ، ‏(‏ 0/ 48‏)‏ ونرى طاعتهم من طاعة الله عز وجل فريضة ........... )<br />لطفا يرجى مراجعة عقيدة اهل السنة والجماعة.<br />واخيرا اللهم الف بين قلوب المسلمين<br />والف يا رب بين قلوب المصريين"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

