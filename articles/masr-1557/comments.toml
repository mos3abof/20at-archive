author = "ياسر أبو عمار"
posted = "2007-02-10"
text = "طيب ما هما الاخوان جماعة دعوية قبل ما تكون سياسية ،يعنى موضوع الصبر على الابتلاء شئ بديهى ،مش شايف فيه اى مشكلة ،وبالطبع المنطق ده هو اللى مخلى الاخوان صابرين على الابتلاءات دى من ايام حسن البنا لغاية الان ،فى الوقت الذى باع فيه الجميع القضية عند اقرب محطة ،ولا ارى داع لاذكركم بالمناضل الرفيق صلاح عيسى ،اللى طرمخ على تاريخه النضالى الشيوعى المعارض علشان خاطر 13 الف جنيه يتلقاها كل اول شهر من الاخ شعبان ،صراف جريدة القاهرة .<br />مش شايفين انه لازم يكون فيه مبرر لتحمل الايذاء على العنت الحكومى ،اذا كان البعض بيعتبر ان التحمل فى سبيل البلد هو اللى بيصبرهم ماشى مفيش مشاكل ،واذا كان البعض بيعتبر ان الدفاع عن فكره ومبادئه اهم من حريته فبرضه مفيش مشكلة ،اشمعنى لما الاخوان بيقولوا ان الصبر على الابتلاء هو اللى بيخليهم يصبروا على المحن والابتلاءات نقوم ننصبلهم مشنقة .<br />اظن اننا متفقين ان كل صاحب فكرة او دعوة او رسالة او هدف معرض للايذاء او الابتلاء حسب التسمية اللى كل واحد بيفضلها ،علشان يقدر يكمل المشوار .<br />انا عاوز اسال بس الاساتذة الجهابذة اللى تعبوا نفسهم فى تحليل القضية :انتوا شايفين ايه الاجراء اللى الاخوان ممكن ياخدوه امام التعنت الحكومى معاهم ؟؟؟العنف مثلا ؟ ما هو ده اللى عمالين تغنوا فى التحذير منه من زمان ،طيب ايه الحل ؟؟ما هو حاجة من الاتنين :اما الصبر والتحمل او العنف .انتوا شايفين ايه سيادتكم يعنى ؟؟ارجو بس من الاخوة المحررين انهم يختاروا مصادر عندها حاجة تقولها ."
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217225247/http://masr.20at.com:80/article.php?sid=1557"

[[comments]]
order = 23
subject = "الى الاخ اللي فوق ياسر"
author = "لا بد من تغيير استراتيجية الاخوان"
posted = "2007-02-11"
text = "تماما مثل ما فعل يا سر عرفات غير استراتيجية منظمة التحرير الفلسطينية علشان خاطر تستمر.<br />حضرتك عارف ان الاخوان اول محنة كانت باعتقال الاخوان واغتيال حسن البنا كانت في عهد الملك فاروق<br />لماذا<br />لانه تأكد ان هذه الدعوة ستطيح به<br />ونفس الشيء حصر مع جمال عبدالناصر<br />ونفس الشيء حصل مع السادات<br />والتاريخ يعيد نفسه مع حسني مبارك<br />اذن لا بد من تغيير الاستراتيجية"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217225247/http://masr.20at.com:80/article.php?sid=1557"

[[comments]]
order = 24
subject = "جندل"
author = "خليل علي حيدر"
posted = "2007-02-11"
text = "ألا يلفت نظرك أن تكون جماعات \"الإسلام السياسي\" والتيارات الدينية، بهذه القوة، وأن تكون في الوقت نفسه بهذا الفقر والسطحية وقلة العطاء والإبداع، في مجالات الثقافة والفكر والرواية والشعر والفن والفلسفة والفنون؟ هل يعقل مثلاً أن تتأسس حركة \"الإخوان المسلمين\" عام 1928، قبل ثمانين سنة تقريباً، وأن تنتشر في كل العالم العربي، وتستقطب الرجال والنساء، والشيب والشباب، والبسطاء والمتعلمين، ولا تعطي الحركة للثقافة العربية مفكراً من عيار محمد عابد الجابري أو شاعراً ينافس أدونيس والقباني والسياب، أو كاتباً من طبقة العقاد وطه حسين، أو روائياً كنجيب محفوظ أو مبدعاً يقارع جبران خليل جبران؟<br />وبالرغم من الطابع الديني والتشريعي للحركة، فإنها لم ترفد الثقافة اللغوية والقانونية وعلم مقارنة الأديان والقواميس الموسعة بالعطاء والإبداع. ويكفي أن نقارن عطاء التيار الديني في مجال الثقافة والإبداع الأدبي والفني بالتيار الليبرالي أو القومي أو الماركسي، لنرى الفارق الهائل بين ما قدمته هذه التيارات للثقافة العربية وما قدمه تيار \"الإخوان\" وسائر الجماعات الإسلامية العربية لها!"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217225247/http://masr.20at.com:80/article.php?sid=1557"

[[comments]]
order = 25
subject = "هناك مبدعين..ولكن سياسة الحجب والاستئصال !!"
author = "محمد ..من الاخوان المسلمين"
posted = "2007-02-11"
text = "الحركة الاسلامية والتيار الاسلامي لهما الكثير من المبدعين في المجالات الادبية والفنية ولكن السياسة المتبعة مع كل ماهو اسلامي من استئصال وحجب وتشويه وحجر واعتقالات وكثير من الممارسات القمعية تحجب المبدعين من الاخوان وابناء الحركة من الاتصال بالجماهير ووصول ابدعاتهم إلى الناس...<br />كما أم طبيعة الآداب والفنون كمجالات تحتاج إلى فضاء واسع وحرية في الممارسة لكي تبرز وتظهر للناس..ولكن مع الحجب والمنع والقهر الذي يتعرض له الاخوان تعد ممارسات قمعية تقتل الابداع و\"تطفش\" المبدعين ولكن مع ذلك هناك في المجالات الادبية كثريين من المبدعين من الاخوان أو من لهم خلفية إسلامية ولهم علاقة بطريقة او بأخرى بالتيار الاسلامي مثل الدكتورة أماني أبو الفضل وهي كاتبة وقاصة ولها العديد من الروايات الادبية والانتاج الادبي الغزير ولكن لا يتم تسليط الضؤ عليها إعلامياً مثلما يحدث مع قريناتها من هن أقل منها موهبة وإنتاجاً !!!<br />الشاعر مسعود خيري وله أكثر من ديوان شعري قيم بشهادة اساتذة النقد في كلية الآداب جامعة القاهرة ممن ناقشو ديوانه الاول \"من مذكرات الفتى\" وأثنوا عليه لا يتم تسليط الضؤ عليه..في حين أن هناك شعراء مغمورين ليس لهم إنتاج يذكر مع ضعف ما يقدمونه من انتاج تقام الدنيا لمجرد ظهور قصيدة أو ديوان جديد لهم بصورة مبالغة وفجة !!!<br />وغيرهم الكثير قديماً وحديثاً ممن ارتبطو بصورة أو بأخرى بالحركة الاسلامية ..وانتاجهم ليس إسلامياً لأن إبدعاتهم تخاطب الانسان وراجع د. أماني أبو الفضل في آخر مؤلفاتها والذي لن أقول لك على عنوانه حتى تجهد نفسك بالبحث بدلاً من وقوعك أسيراً لإعلام الريادة !!!<br />ولكن الناس ضحايا الاعلام المفبرك الغير منصف ..<br />الكلام موجه للأخ حيدر"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217225247/http://masr.20at.com:80/article.php?sid=1557"

