[[comments]]
order = 0
subject = "الاعتقالات جاية جاية.. من غير فلسفة حسام تمام ولا تخاريف صلاح عيسى!"
author = "محمد..من الاخوان المسلمين"
posted = "2007-02-07"
text = "شعرت بحالة من الالتباس وعدم الوضوح لما قريت التحقيق...<br />المهم..وبحكم كوني من الاخوان المسلمين ..تعليقي في نقاط محددة<br />1- لكل فصيل أو جماعة او تيار مصطلحاته المتداولة داخله وطبعاً كل المصطلحات مردودة للبيئة العامة المحيطة بالفصيل أو التيار وبم أن الاخوان جماعة في الاساس ترتكز في مفاهمها وتصوراتها على الاسلام فبالتالي المفاهيم والمصطلحات المتداولة داخل وحوالين الاخوان مرتبطة بالاساس بالاسلام ومفاهيم اللغة العربية<br />2- الابتلاء مصطلح عربي يعني الاختبار أو الامتحان يتعرض ليه المسلم وغير المسلم المؤمن وغير المؤمن والصالح والطالح بالخير والشر يعني الملايين إلي ربنا رزق بيها خيرت الشاطر بالحلال ومن غير تدليس ولا قروض بنكية ومن غير فهلوه ومن غير سرقة ..الملايين دي تسمى إبتلاء نعمة..الاعتقال ومصادرة الملايين والبعد عن الاهل والاحباب إبتلاء من نوع تاني<br />3- من غير فزلكة ولا تحليلات كلها تكلف وبعد عن الواقع هو رؤيتي الشخصية وأعتقد إنها رؤية الاخوان مش بعيدة عن الرؤية دي..وهو في الآخر كل الابتلاءات من وجهة النظر الاسلامية تعد خير..وده بعد نفسي الاسلام رسخة في النفوس<br />4- الاخوان ليهم أخطاء..زي أي حد...إنما لم تصل للخطايا..ومش معنى كده ندور مثلاً بطبلة وزمارة بأخطائنا..ومع ذلك بنعتذر لإننا عندنا شجاعة مش متوفرة عند كتير..<br />5- بالنسبة للإعتقالات الاخيرة..هي ابتلاءات..ودي حقيقة..إنما كلامك يا آنسة منى عن إن الموضوع ممكن يكون راجع لأخطاء سياسية أو كلام من ده..في وجهة نظري لا ..الموضوع وما فيه راجع لموقف الاخوان المعارض لسياسات النظام المختلفة.. وأظن إن في ثلاث محاور أثاروا النظام على الاخوان خلال الفترة إلي فاتت وهي<br />أولاً: موقف الاخوان الصريح المعارض وبشدة للتعديلات الدستورية المقترحة<br />http:<br />اقرأ بقية التعليق .."
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

[[comments]]
order = 1
subject = "نداء عاجل الى المرشد العام للاخوان المسلمين"
author = "يا فضيلة المرشد ارجوك اسحب اعضاء الجماعة من مجلس الشعب فورا وانسحب من اي معترك سياسي ودع الملك للمالك يؤتيه من يشاء كما هو قال في قرآنه سبحانه وتعالى قل اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء."
posted = "2007-02-07"
text = "واذكرت بمعاوية ابن ابي سفيان وابنه يزيد كيف حول معاوية الخلافة الراشدة الى مملكه وكيف استخدم كل سلطاته لتوريثها الى يزيد ومن الذي راح ضحية ذلك<br />انهم الحسن والحسين اشرف خلق الله<br />الحسين ذات نفسه لم يستطع فعل اي شيء امام اردة الله.<br />حرام الناس اللي في المعتقلات هذه<br />واوعا تفتكر ان حسني مبارك كافر حسني مبارك مسلم والدليل على ذلك انه يدافع عن المادة الثانية من الدستور التي تنص على ان الدين الرسمي للدولة هو الاسلام والشريعة الاسلامية هي مصدر التشريع رغم الحملات الجنوبية لاقباط المهجر ضده من اجل الغاء هذه المادة.<br />ارجوك انسحب من المعترك السياسي<br />كفاية سجون<br />كفاية معتقلات<br />كفاية امن دولة<br />كفاية مخبرين<br />كفاية تعذيب<br />كفاية ترويع امنين<br />كفاية كفاية كفاية"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

[[comments]]
order = 2
subject = "لا توجد احزاب لها اى نشاط"
author = "زهرة الرمان"
posted = "2007-02-07"
text = "الشباب المصرى العاطل عن العمل والبنات العوانس فى بيوت الاهل نتيجة عدم قدرة الشباب على الزواج وفتح بيوت وعدم التنفيس عن الضغط فى نشاط اجتماعى او سياسى فى اى حزب كان الشباب يائس وحانق ويتخذ الموقف المعادى للحكومة التى لا تلبى ادنى مطالبة<br />والانسان فى حالة الياس والازمة والضياع يتجة الى اللة<br />عسى اللة يفرج الكربة ويكشف الغمة وينتقم من المتسبب فيها باخذة اخذ عزيز مقتدر<br />ويكون اللة هو الحل او الاسلام هو الحل<br />من هنا تقوى جماعة الاخوان ولا تضعف ابدا رغم الاعتقالات والضربات فلا احد عندة شىء ليخسرة حتى تجىء لحظة الانفجار الكبير فلا ينفع امن مركزى ولا حتى جيش مركزى امام ثورة الجياع التى تتجمع عواصفها لتهب فى حريق كبير اذا لم يتولى الراشدون فى هذة الامة تدارك الخطر وايجاد حل<br />الياس والبطالة والحالة النفسية السيئة عند شبابنا والممارسات الشرطية الهمجية الغير مسئولة ستولد الانفجار الكبير<br />قلبى عليكى يامصر"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

[[comments]]
order = 3
subject = "هل دائما في انتظار المحنة؟؟"
author = "محمد السيد"
posted = "2007-02-07"
text = "الموضع جميل ... فكرا... و رأيا...وتناولا....وحيادا....<br />نيجي بقي نتناقش في أفكاره ؟؟<br />\"لماذا لا يغيرون ويجددون أنفسهم سياسيا وحركيا حتى يتغير ما بهم؟\"<br />لو عكست لك السؤال وطرحته عليكي ؟؟ يعني يعملوا إيه؟ ما البدائل المتاحة أو الغير متاحة ممكن بها إيقاف هجمات النظام عليهم؟؟<br />الطبيعي إن أي ديكتاتور ... لازم يهاجم ويتجبر ويمنع ويسجن أي معارضة أمامه ؟؟؟ المفروض نغير إيه؟<br />\"فكرة لتمحيص \"... قد تكون موجودة فعلا ...بس مش معايا إن ده لمصلحة الجماعة ... ولمصلحة العمل كله؟؟ يعني مش طبيعي يكون في تجارب و وسائل ممكن تظهرلك بعض<br />البيض الغير صالح في السلة ؟؟ أو العكس تظهر لك بعض الثمار المثرة أكثر من غيرها ؟؟؟<br />عن تجربة سابقة أقولك ... إن فعلا السجن أحد الوسائل التربوية عند الإحوان المسلمين ... ولو بنظرة شاملة بعض الشئ .. حتلاقيها عند غيرهم كمان ..<br />كل المناضلين والمفكرين واللي غيروا التاريخ .... مروا بالتجربة دي ... وكلامهم عن فترة سجنهم إنها كان لها دور كبير في تشكيل شخصيتهم وإصقال تجربتهم...<br />يبقي هنا العيب في الإخوان ...ولا الناس كلها...ولا دي تكون ميزة بشرية .. وطبيعة وفطرة إنسانية ؟؟؟<br />وهنا أكيد مش الجماعة هي اللي بتلقي بيه إلي السجن أو بتدفع إليه المحنة .... من أجل \"اختباره\"علي حد تعبيرك .... إنما الظروف ...<br />إن شاء الله ... مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

[[comments]]
order = 4
subject = "المشكلة الحقيقية ..إنه فعلا معسكر إخواني..في غاية الروعة"
author = "محمد السيد"
posted = "2007-02-07"
text = "معاكي في إن الإحوان طبعا بيحولاو السجن لمعسكر روحي وتربوي ..ولكن ؟؟؟ مش أوراد وصلاوات وأذكار ققط ... السجن بيتحول إلي دورة كاملة تبدأ بالرياضة في الصباح لتمر بالسياسة<br />والفقه والاجتماع ... لتنتهي في بالأدب في المساء ... يعني لو فعل الإخوان إيه .... ماكانوا ليحصلوا علي هذا المعسكر التثقيفي التربوي الروحي الرياضي ..وكله علي حساب<br />لحكومة ....<br />\"فكرة إن الصراع مع الباطل دليل علي سيرك في الطريق الصائب ....\" أنا مش بأشجعها بالناحية دي .... إنما ...<br />عند المقارنة ؟؟ هل نظام مبارك هو الصح؟هل أمريكا هي الصح ؟؟ هل الاستيادا وخنق الحريات والتلاعب بالشعب والنسا هو الصح ؟؟ هل الرضا بالفتات ن الحكومة والسكوت علي بعض ما<br />ترتكبه هو الصح ؟؟ هل مصالح الناس هي الغلط ؟؟ هل الحرية العامة وحق الكل في التواجد هو الغلط ؟؟ هل غلق المعتقلات هو الغلط؟؟ هل فلسطين هي الغلط ؟؟<br />قد نختلف في التناول ...وتتباين رؤانا حوله .. .إنما الفكرة العامة ...تظهر مين الحق ومين الباطل .... وباللغة المتداولة .. مين الصائب ومبن الخاطئ ...<br />\"تم المبالغة وتضخيم ثقافة التضحية على الجزء المتعلق ببناء الوعي السياسي وخريطة التحالفات والثقافة المستقبلية التي تعطى البناء الحركة القدرة على تلمس خطاهم , فالتكوين الثقافي لشباب<br />الحركة لا يساعد على هذا\"<br />ثاني جملة تثير بعض التساؤل ؟؟؟<br />هل شباب الإخوان دول جزء من المجتمع بكل مثالبه ولالأ؟؟ يعني جزء من عدم الثقافة العامة ..وقلة الوعي ....والحاجات دي كلها ..<br />ما يقدمه الإخوان .. هو نوع من تغيير هذه النماذج ..ومحاولة تصحيح الأوضاع ..ولكن يظل جزء يخضع لطبيعة المجتمع وظروفه ...<br />إن شاء الله ... مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />moha<br />اقرأ بقية التعليق .."
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

[[comments]]
order = 5
subject = "طيب وليه نعتبر إنه قدر علي الإخوان إنهم يتسجنوا ويتبهدلوا؟"
author = "محمد السيد"
posted = "2007-02-07"
text = "أما \"فهي حركة راكضة ولكنها غير قادرة على وضع التصور الاستراتيجي في اللحظة المناسبة\"<br />مش عارف ... أنا غير متفق تماما مع هذا الطرح ... الأيام يوم بعد يوم بتأكد إنهم ...أكثر من يسير علي استراتيجية وفكرة واضحة وحركاتهم كلها محسوبة وفيها نظرة مبصرة للعواقب<br />وما تأتي به الأيام ...<br />رأي الأستاذ جمال البنا محترم جدا ...وواقعي في طرحه فعلا ...وأظن دي وسام شرف ...وإلا المفروض نهيج الدنيا ونخليها ضرب في بعض ؟<br />وأفخر بتمتعي بالعفة السياسة ...<br />أحيانا يكون التصور إن الموضوع خلاص ..وإن سهل تحريك الشارع وإن الإخوان بيسكتوا علي كثير مما يمر بهم .. وإنهم كانوا ممكن يتصرفوا ويصعدوا الموضوع ..والأدهي بقي ..<br />عند حدوث حوارات بين الجهات الأمنية والإخوان ...<br />يا جماعة ..لما كام اتقبض علي بعض شباب كفاية...كله اتكلم كتير ..وكله قعد عمل مناحة علي مستقبلهم وأيامهم وحبهم لمصر وحرام اللي بيحصل \"فاكرين ما كتب عن محمد الشرقاوي هنا في<br />ولاد البلد\" بينما الإخوان آلاف بيمروا بنفس الظروف ومحدش بيعمل حملة عن \"كل شخص فيهم\" ولا أي حاجة ...<br />الكثيرين يتعاملوا مع عمليات القبض علي الإخوان وكأنه شئ طبيعي وجزء من اللعبة بين الإخوان والنظام ؟؟؟<br />الله ؟؟؟<br />ليه يعني ؟؟هو قدر علي الإخوان إنهم يتسجنوا ويعتقلوا ويتبهدلوا .. ومحدش يتكلم عنهم ..أو اللي يتكلم عنهم يتكلم باعتبارهم عدد وخلاص ....؟؟<br />أحيان علي فكرة ده بيسبب مرارة ... ادخلوا علي مدونة \"ياء\"...فيها شئ من الحديث عن هذه المرارة...<br />رأي صلاح عيسي بقي ..في سبب تحويلهم للمحاكمة العسكرية .. أولا حسيت إنه خارج إطار لموضوع ..يعني مش عارف ليه كتبتيه هنا ...؟<br />ثانيا بقي حسيت إني عايز أضحك ... مفيش حاجة اسمها فضلوا الصمت والحاجات دي والخوف من الت<br />اقرأ بقية التعليق .."
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

[[comments]]
order = 6
subject = "خايفين من تضارب التصريحات؟وفضلوا الصمت؟"
author = "محمد السيد"
posted = "2007-02-07"
text = "رأي صلاح عيسي بقي ..في سبب تحويلهم للمحاكمة العسكرية .. أولا حسيت إنه خارج إطار لموضوع ..يعني مش عارف ليه كتبتيه هنا ...؟<br />ثانيا بقي حسيت إني عايز أضحك ... مفيش حاجة اسمها فضلوا الصمت والحاجات دي والخوف من التصريحات المتضاربة.... وثقافة الابتلاء .... ده موقف سياسي جدا ... وكلنا كنا بنعمله في القضايا المتفبركة اللي معروف نتيجتها سلفا ..<br />لما كان وكيل النيابة بيسألنا .. ومن غير ما نرد يجاوب هو ... بالنفي ..لأنه عارف إن الموضع كله فشنك ...<br />علي فكرة\"بين قوسين وكلاء النيابة دول من أكثر الناس احتراما فعلا ....\"<br />وهم أول ناس عارفين إن القرار مش بإيديهم ومش حتفرق أقوالنا أمامهم في أي نتيجة للتحقيق ...<br />بيفكرني بتحقيق أحمد باشا موسي مراسل الأهرام الأمني في وزارة الداخلية .. عن رفضهم للقانوا الوضعي والكلام ده ...وعشان كده اتحولوا للمحاكمة العسكرية...<br />إن شاء الله ... مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

[[comments]]
order = 7
subject = "بس كالعادة ....... مني سليم ...أستاذة"
author = "محمد السيد"
posted = "2007-02-07"
text = "أسف إذا كنت طولت عليكي .. ولكن لعلمك ..دي أول مرة أعلق علي موضوع بالطول ده ... و يستهويني موضوع إني أرد علي كل تفصيلة فيه بالشكل ده ..<br />أختم بقي...بتحية كبييرة جدا .. حقيقي... علي الجهد اللي واضح في الموضوع ... وعلي الحياد والنظرة المتأنية الراقية ... وكالعادة... حلاوة الإسلوب ...والفكرةالجديدة ...<br />ودااااااائما ....<br />في اتنتظار الجديد ...<br />بس .... ادعي لي مش أسكت<br />إن شاء الله ... مش حاسكت<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

[[comments]]
order = 8
subject = "ابو يوسف"
author = "والله حاجة ضحك"
posted = "2007-02-07"
text = "الموضوع جميل جدا لكن انا ضحكتك جدا من كلام صلاح عيسي وانا مش مع الاخوان او ضد بس كلام صلاح عيسي كعادتة ثائر شيوعي يحابي النظام من جه ويتولي احد الجرائد الصادرة عن احدي وزارتة \" وزارة الثقافة\" ومن جهه اخري يقول راية الحر<br />بس الي ضحكني كلامة ان الاخوان خيفين يتكلموا انا مش عارف هما خيفين يروحوا يودوا نفسهم محاكمة عسكرية كلام مش مضبوط وعادي ان صلاح عيسي يقول ذلك لانة شيوعي معروف بكرة الشديد لكل ما هو اسلامي ومسلم يلا عادي كلام عبيط"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

