[[comments]]
order = 20
subject = "ال عمران (آية:142): ام حسبتم ان تدخلوا الجنه ولما يعلم الله الذين جاهد"
author = "روضه"
posted = "2007-02-09"
text = "اولا كتعليق على الموضوع انتى كدة بتعارضى ايه فى القران لا هى ففى كلام على جريشه ولا مجدى هلالى ولا تبادلها موقع الاخوان ولا شباب الاخوان<br />الايه بتقول ال عمران (آية:142): ام حسبتم ان تدخلوا الجنه ولما يعلم الله الذين جاهدوا منكم ويعلم الصابرين \"<br />كمان\"البقرة (آية:214): ام حسبتم ان تدخلوا الجنه ولما ياتكم مثل الذين خلوا من قبلكم مستهم الباساء والضراء وزلزلوا حتى يقول الرسول والذين امنوا معه متى نصر الله الا ان نصر الله قريب \"العنكبوت (آية:2): احسب الناس ان يتركوا ان يقولوا امنا وهم لا يفتنون \"<br />ثم انك ملقتيش غير حسام تمام وصلاح عيسى عشان تاخدى رايهم عن الاخوان!!؛موضوع بصراحة غير محايد فى راي على الاطلاق...معذرة؛وانتى استاذتنا يامنى<br />ثم خفيف الظل اللى بيقول خافوا يتكلموا عشان ميبقاش فى تضارب ! هو الاخ عندة كان سنة؟ 5 ونصف!! حتى لما تنتقد قول كلام منطقى....بصراحة مرضتش اكمل باقى التعليقات ولا تحملت قراءة الموضوع تفصيلا ؛وليس لعيوب صحفيه فيه وانما فكريه...معذرة"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

[[comments]]
order = 21
subject = "نداء عاجل الى المرشد العام للاخوان"
author = ": يا فضيلة المرشد ارجوك اسحب اعضاء الجماعة من مجلس الشعب فورا وانسحب من اي معترك سياسي ودع الملك للمالك يؤتيه من يشاء كما هو قال في قرآنه سبحانه وتعالى قل اللهم مالك الملك تؤتي الملك من تشاء وتنزع الملك ممن تشاء."
posted = "2007-02-10"
text = "واذكرت بمعاوية ابن ابي سفيان وابنه يزيد كيف حول معاوية الخلافة الراشدة الى مملكه وكيف استخدم كل سلطاته لتوريثها الى يزيد ومن الذي راح ضحية ذلك<br />انهم الحسن والحسين اشرف خلق الله<br />الحسين ذات نفسه لم يستطع فعل اي شيء امام اردة الله.<br />حرام الناس اللي في المعتقلات هذه<br />واوعا تفتكر ان حسني مبارك كافر حسني مبارك مسلم والدليل على ذلك انه يدافع عن المادة الثانية من الدستور التي تنص على ان الدين الرسمي للدولة هو الاسلام والشريعة الاسلامية هي مصدر التشريع رغم الحملات الجنوبية لاقباط المهجر ضده من اجل الغاء هذه المادة.<br />ارجوك انسحب من المعترك السياسي<br />كفاية سجون<br />كفاية معتقلات<br />كفاية امن دولة<br />كفاية مخبرين<br />كفاية تعذيب<br />كفاية ترويع امنين<br />كفاية كفاية كفاية"
archived = "2007-02-17"
capture_url = "https://web.archive.org/web/20070217225247/http://masr.20at.com:80/article.php?sid=1557"

