[[comments]]
order = 16
subject = "لا حول ولا قوة إلا بالله"
author = "مسلم مش إخواني"
posted = "2007-02-08"
text = "السلام عليكم جميعا<br />المقال رائع والتعليقات أروع<br />الصورة أعلاه أثرت في بشدة ... هذا المهندس رجل الأعمال الثري خيرت الشاطر ... أول مرة أشوفه رغم اني سمعت عنه من قبل ... ما شاء الله وجهه منور ... ربنا ينصره في محنته لأننا جميعنانعلم ان الموضوع تليفيق في تلفيق وسياسة في سياسة<br />الغريب انك عندما تقرأ أسماء الذين تم اعتقالهم ستجدهم جميعا مهندس وطبيب وأستاذ جامعة ورجال أعمال ناجحين<br />لم أسمع في حياتي أن فيه واحد من الاخوان فاسد أو مرتشي أو مختلس أو مزور أو تاجر في دم الشعب الغلبان ... لم نسمع أبدا أن منهم من استورد لحوما فاسدة أو تاجر بأكياس الدماء الملوثة لأو استولى على أراضي الدولة بأبخس الأسعار أو نهب قروض بالملايين من البنوك وفر هاربا خارج البلاد<br />أحسدهم على ثباتهم وتمسكهم بمبادئهم وحرصهم على دينهم ... كنت أتمني أن أكون واحدا منهم لكني للأسف أضعف ألف مرة من أن أصل لهذا الشرف<br />إلى متي ستظل النظم المتعاقبة في بلدنا تنكل بهم ونحن نكتفي بالفرجة والمشاهدة ومصمصة الشفايف ... وكيف تأتيهم القدرة على الصبر على التعذيب والبهدلة والمرمطة في سجون يقوم عليها أناس لا يخافون الله ويتفننون في اللهو بالبشر واللعب بأجسادهم<br />أتخيل نفسي في أحد هذه المعتقلات وأحد هؤلاء الضباط يعذبني ويطفئ السجائر في جسدي ويعلقني على الحائط ويمنعني من النوم بصب الماء البارد على أرضية الزنزانةالخ الخ ... ماذا سأفعل به بعد أن أخرج من السجن ... والله لأقتله .. والله لأقتله.. والله لأقتله ... كيف يصبر الإخوان على ذلك ولا يردون على كل هذا ... اللهم ارحمهم واغفر لهم وفك كربهم وجميع المسلمين وألهمنا من لدنك بعض الشجاعة حتى نكون رجالا لا نخاف الا الله ولا نهاب حاكم ظالم أو أمن مركزي أو أمن دولي أو محاكم عسكرية... آمي<br />اقرأ بقية التعليق .."
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

