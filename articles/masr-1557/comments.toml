[[comments]]
order = 14
subject = "تحياتي ... و أقول"
author = "إخوانية"
posted = "2007-02-08"
text = "اولا ابدأ بتحية جامدة جدا للاستاذة منى على تحقيقها الاذي توافرت فيه و ببراعة الحيادية و الاتقان و الجهد البارز ... و اركز جدا على نقطة الحيادية دي جدا...لان عادة المقالات التي تتحدث عن الاخوان بتكون حاجة من الاتنين ... الاولى بتكره الاخوان عمى و تهاجم الجماعة عمال على بطالو التانية متعاطفة مع الاخوان لدرجة انها تنزهها عن الخطأ حتى اذا اعترف الاخوان نفسهم بيه...<br />ثانيا احيي كمان اللي دخلو و شاركوا بتعليقاتهم على الموضوع و احييهم اوي على مستوى الحوار الراقي ده..<br />ثالثا تحية خاصة للاستاذ محمد السيد على رده المفصل و تعليقه على التحقيق...هو فعلا غطى معظم النقاط و ارجو ان الامر يكون واضح..<br />رابعاالاستاذ أبو محسن احييك على قراءتك للتاريخ....انت لم تخطأ فعلا بشأن قصة موسى و فرعون و لا بشأن قصة الحسين و ابنه يزيد...لكن ما علاقة هذا بالاخوان... حقيقة فان جماعة الاخوان التي عرفتها هي جماعة تحق الحق و تبطل الباطل و هي ابعد ما يكون عن افكار التكفير... لاتدعو ابدا للخروج على الحكام بالعكس بل تدعو دائما لضرورة احترام و طاعة ولي الامر..طالما كان على الحق..فاذا خالفه ...وقفوا له دون تكفير او ارهاب او ....و تحية خاصة لك يا ابو محسن لانك قلت \"على حد علمي\" و لم تقذف اتهاما او تعتبرها حقيقة... و لاني المح في كلامك حديث رجل مثقف فاني ادعوك للقراء اكثر عن الاخوان من خلال كتاباتهم و رسائلهم..<br />و اخيرا...آسفة على الاطالة"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210050400/http://masr.20at.com:80/article.php?sid=1557"

