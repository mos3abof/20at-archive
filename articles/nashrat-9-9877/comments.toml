text = "مسلسل اسمهان من اروع المسلسلات التي شاهدتها في حياتي ، احترم كثيرا مصداقية العمل ، فلم يظهر اسمهان بأنها ملاك في صورة انسان ، كان واقعيا وجميلا .. والمسلسل من الناحية الفنية جميل ،اخراج جيد جدا واهنيء سلاف فواخرجي فقد ابدعت في تجسيد الدور ، فنانة جيدة تتقدم بشكل رائع تمتلك موهجبة مذهلة ، وما اروع التتر (شارة البداية) توزيع موسيقى عالي المستوى … مسلسل يستحق النجاح بغض النظر عن رأي الورثة الشرعيين من آل الاطرش ، أنا أؤيد ان قصة المسلس هي الاقرب إلى الحقيقة ."
