[[comments]]
order = 12
subject = "الجامعات لاتقبل الأنترنيت"
author = "حسين الركابي"
posted = "2006-11-06"
text = "هل من المعقول أن تقنية الأنترنيت لم تصل الى الجامعات المصرية لحد الآن حيث أني رشحت من قبل العراق للدراسة في كليات الحقوق في أحدى جامعات مصر وقد خاطبت معظمها حول السماح لي بالدراسة لديهاوأرسلت وثائقي على مواقعهم الألكترونية ورفظوا أستلامها وأتصلت هاتفيا بهم وأخبروني بأنهم لايتعاملوا مع الأنترنيت وطلبوا أرسالها عن طريق البريد العادي الذي أستخدم في القرن السابع عشر تصوروا أن جميع زملائي المرشحين معي جلبوا قبولات من الدول الأسيوية والعربية الا جامعات مصر فكيف تطلبون أن تحتل لها موقعا بين جامعات العالمولأنترنيت لم يصل اليها بعد ؟؟؟مجرد سؤال"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143304/http://masr.20at.com:80/article.php?sid=358&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 13
subject = "العرب منتحلين حتى الصحفيين منهم"
author = "ساطع الحاج"
posted = "2006-11-08"
text = "لا بد أن محرر التعليم العالي أبو السعود محمد قد وقع نظره على تعليقي الذي كتبته في صحيفة الشرق الأوسط بتاريخ 21/9/2006 حول ما جاء في مقالة الصحفي الفذ الأستاذ محمد صادق دياب، الذي كتب مقالا قيما حول مهزلة شراء الشهادات ورخص الضمائر في البلاد العربية وتدني مستوى التعليم حتى العالي. يبدو أن السيد أبو السعود حاول الدبلجة لكنه وقع في الفخ لأنه بالتأكيد لم ير التقرير بل قرأ فقط تعليقي المنشور في ذلك التاريخ ولم يشر إليه. يمكن الرجوع للتعليق على موقع صحيفة الشرق الأوسط، ولذلك اخترت لتعليقي هذا عنوان (العرب منتحلين حتى الصحفيين منهم). وعنوان التعليق هذا لن يغضب المبدعين من العرب لأنهم مثلي تحرقهم الغيرة على حال التعليم في كل مراحلة، لكن يبدو أن الصحافيين العرب ليسوا بأحسن حال من الأكاديميين العرب. musawi2@yahoo.com"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117143304/http://masr.20at.com:80/article.php?sid=358&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
