[[comments]]
order = 3
subject = "كلاكيت عاشر مرة"
author = "بسمه"
posted = "2006-05-24"
text = "اعتقد يا اخت داليا بعد ان استضافت المذيعه مني الشاذلي عميد جامعه حلوان والدكتور ابو الغار والدكتور عمر تاكد لك ان معقوله جدا ان تكون جامعتنا خارج اى تصنيف وهذا الكلام الانشائي عن بعض شخصيات متناثره على الساحه العالميه ليس معناه على الاطلاق اى انتساب لمنهج علمى فى اطار منظومه علميه سليمه بل الوصف الحقيقي لها انها عشوائيه واهم هذه المعايير هو عدم انتاج العلم وهو ما يحدث فى جامعتنا"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010546/http://masr.20at.com:80/article.php?sid=358"

[[comments]]
order = 4
subject = "العلم يرفع الأمم والجهل يخفضها"
author = "أحمد"
posted = "2006-05-24"
text = "موضوع صفر الجامعات المصرية ليس للمعارضة فحسب فهو حقيقة لا خيال<br />هل مايحدث داخل الجامعات المصرية في شئون التدريس والبحث الأكاديمي والتطبيقي سليم و تنطبق عليه أقل معايير الجودة والكفاءة؟<br />هل أساتذة الجامعات المصرية وطلابها يستحقون ألقاب علماء وطلاب علم؟<br />هل رسائل الماجستير والدكتوراة في الجامعات المصرية تستحق الأشادة والأعتراف والصلاحية ؟<br />والله العظيم والله العظيم والله العظيم ياأخت داليا أنا أعرف أساتذة جامعات في مصر معرفة شخصية لايحسنون بل لايعرفون قراءة الأوراق العلمية فضلا عن إعدادها للنشر ناهيك عن السرقات العلمية والدكتوراة والماجستير للبيع<br />والله لقد درس لي شخصيا أحد الأساتذة في عام 2000 مادة كتب محاضراتها سنة 1975 أي قبل مولدي بسنين ولم يطلع علي أي شيئ خاص بها منشور بعد 1975<br />لقد تهت لم أعد أعرف هل السبب حسني مبارك أم الأساتذة أم الطلاب أم الكل أم من بالضبط قد يكون للجن دخل علي رأي أحد زملائي<br />الموضوع هام ياأخت داليا مش ناقصة دي ناقصة وناقصة وناقصة<br />رحمة الله علي الشيخ الغزالي حيث قال: لو حسبنا مافقده الشرق وهو يئن تحت وطأة الجهل والفقر والمرض لوجدناه أضعاف أضعاف مافقده الغرب وهو يبحث عن العلم والغني والصحة<br />اللهم أصلح لناالحال"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010546/http://masr.20at.com:80/article.php?sid=358"

[[comments]]
order = 5
subject = "ديه خلاصة الكلام وبعد كده مات الكلام"
author = "عمرو تولدو"
posted = "2006-05-25"
text = "من الاخر كده الكاترا عندنا فى الجامعه كل الجامعات عموما ولكن بتكلم على القاهره خاصا<br />الدكاترا كل هما تيجى ترمى الكلمتين وتلحق تفوك علشان يشوف مصلحته فى حته تانيه اى سبوبه يعنى<br />اما الطلبه كل اللى همهم نيجى نتقابل نهزر نهرج نلم بعض ونخرج فى اى حته ونيجى اخر النهار على الجامعه نشوف فى حاجه جديده حصلت ولا لأ؟<br />حصل جديد بنتفرج ونتريق ونمشى محصلش لو فى وقت نكمل بقية يومنا مفيش نتكل على الله نروح او نشوف احنا كمان اى سبوبه حلوه نطلع منها اى حاجه<br />الكلام ده شامل الطلبه شباب وبنات<br />اما بقا رئيس الجامعه والحاشيه<br />طول النهار قاعدين فوق فى التكييف ملهمش دعوه بحاجه خالص<br />وسايبين الامن يتحكم فى كل حاجه<br />وعايزين ناخد مركز<br />انت بتهرجوا والله<br />شوفوا حاجه تانى اهم اتكلموا فيها<br />ومتبوزوش نظام الجامعه اللى ماشيين عليه<br />سلام بقا علشان عايز اشوف حد من العيال الدحيحه اللى بتحضر ديه واشوف معاه حاجه مفيده ولا لأ؟<br />سلاااااااااام"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010546/http://masr.20at.com:80/article.php?sid=358"

[[comments]]
order = 6
subject = "ديه خلاصة الكلام وبعد كده مات الكلام"
author = "عمرو تولدو"
posted = "2006-05-25"
text = "اه نسيت اقولكم حاجه<br />طبعا هتقولولى مش كه وانت بتتكلم عن قله قليله والكلام اللى يعوج اللسان ده<br />هقولكم انا بكلم عن 99% من الجامعه سواء دكاتره او طلبه<br />وطبعا رئيس الجامعه والحائيه الكريمه<br />والـــ 1% اللى فاضل بيتمنا ومنى عينه يقلد الــ99% اللى كلمتكم عنهم<br />والله هو ده اللى بيحصل مش مقتنعين انزلوا الجامعه<br />والله قبل ما تخش هتقتنع بكلامى من على الباب لما تشوف وتعرف<br />يا بنى ادمين خلونا فى المفيد<br />السلاطه بيتحط عليها زيت ولا لأ؟"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010546/http://masr.20at.com:80/article.php?sid=358"

[[comments]]
order = 7
subject = "ليه ما عندناش 60 جامعة زي إيران؟"
author = "هو ليه كل ما تسأل أي مواطن عادي في الشارع عن سبب أزمة الثانوية العامة يجاوبك بكل بساطة أن السبب الرئيسي أن عدد الجامعات مازادش من 30 سنة بينماأي برنامج تليفزيوني حتى العاشرة مساء بيناقش المشكلة دي بيتجاهل تماماً السبب ده و يقعد يتكلم في حاجات هامشية زي صعوبة الأسئلة و خلافه؟؟؟؟؟؟ً، هي البرامج دي اصيبت بالعمى و الا ايه الحكاية؟"
posted = "2006-07-05"
text = "إزاي دولة زي إيران بنفس عدد سكاننا فيها 60 جامعة و احنا 7 بس ولو كان عندنا 60 جامعة كان حد حياخد دروس و مشتنيين ايه؟ لما المجاميع توصل ل 140%؟!!<br />الجامعات دي اهم من كل مشاريع البنية الأساسية، دي هي دي اساس البلد."
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719010546/http://masr.20at.com:80/article.php?sid=358"

