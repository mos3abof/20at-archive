text = "اختي شيرين منصور انا اوافقك على رايك ..<br />انا اقووول واوضح ان السينما الهندية بعيدة عن السينما اللبنانية بعد المشرق عن المغرب..<br />وقصدي بما قلته ان السينما الهندية تهدف إلى اشياء معينة..<br />اما السينما اللبنانية احس انها تهدف إلى الوطن العربي باجمعه..<br />بالنسبه للسينما المصرية كما قال الأستاذ محمد فضل..<br />لأعتقد ان ذلك صحيح.. فنحن إلى الأن نعيشها.."
