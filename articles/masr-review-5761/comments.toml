author = "شرين منصور"
posted = "2007-05-07"
text = "السلام عليكم انني لم ارى الفيلم لعدم نزوله بدور العرض في المكان الذي أعيش به ولكنني أستطيع التنبؤ بمستوى الفيلم لأنني على دراية كافية بمستوى الدراما اللبنانية برغم من ان هناك بعض المآخذ على بعضها وانما لا ننسى ان الدراما الحقيقة فهي دراما الواقع ونقل الواقع كما هو دون تزييف مثل مسلسل قصتي قصة فهو مسلسل تتحدث في كل حلقة عن مشكلة وواقع يعيشه أبناء لبنان أرض العزة والكرامة والرجولة ،ومسلسل من أحلى بيوت راس بيروت ومسلسل غربة المسلسل السياسي وغيرها من الدراما اللبنانية القوية المؤثرة ،اما عن الفيلم اتمنى ان اراه لأنه يعلم كيف يوصل رسالته للوطن العربي باختلاف لهجاته وذلك عن طريق الرقص والاستعراض كما ذكر فهو ذكاء يرفع له القبعات وكونه يحاول تثبيت قدم دور السينما اللبنانية والعربية في العالم العربي،، وهذه خطوة جريئة من السينما اللبنانية وهي منافسة السينما الهندية بالرغم من انني ارى ان السينما الهندية شيء وفيلم البوسطة شيء اخر بالرغم من اشتراكهما من ناحية الاستعراض نتمى من السينما المصرية وخاصة على القائمين بها ان يحاولو اجراء عملية انعاش قلب السينما المصرية لأننا بحاجة اليها بعدما توفاها الله كما قال الاستاذ المخرج الكبير محمد فاضل…"
archived = "2009-12-02"
capture_url = "https://web.archive.org/web/20091202102759/http://www.20at.com:80/masr/review/5761-2009-06-09-11-58-49.html"

