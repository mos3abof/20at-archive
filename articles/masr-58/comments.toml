subject = "امي وحشاني"
author = "الجنة تحت اقدام الامهات فعلا ربنا يحميها لك وياريت تكوني ابنه صالحة لها وتعوضيها جزء من تعبها معاكي وان كان هذا صعب للغاية ولكن فقط لتحاولي ومن الواضح انك تحبيها كثيرا"
