[[comments]]
order = 7
subject = "أيكفيك دمعة ام نهر دمع"
author = "رائد بغدادي"
posted = "2006-04-06"
text = "اذا ماتت ام العبد صاح ملك من السماء أبن آدم لقد ماتت من كنا نكرمك لأجلها فأعمل عملا صالحا نكرمك لأجله .والله لم استطع ان اكمل المقال فهناك ماسال على الخد وفضحتني هذه الدموع ووجدت نفسي اعيش في بيت دعاء وأقبل جبين امي التي وجدتها دعاء تدعوا والناس نيام وعندما مسحت مابلل جفني حاولت ان اكمل ولكني وجدت نفسي امسك هاتفي واتصل بها من بعد دولتين وبحرا :الو..أمي ..ألو حبيبي مابك صوتك مخنوق ..كيف حالك ياأمي..اقسمي انك بخير ..انا بخير مادام صوتك قربي..دعوت لك في صلاة الفجر ان تعود سالما واراك ..وانا دعوت لكي ان تسألي الله ان يعافي ويشفي ام المصريين كلهم ماما فادية.فمبارك لك على هذه الجنة يادعاء ومبارك لك زواجك ونسأل الله ان يفرحكم في الاخرة كما افرحكم في الدنيا ...<br />يقولون أمي في العراق مريضة ..فقلت لهم كل العراق مريض..جراح وصبر وافتراق وغربة ودمع ولا كل الدموع يفيض..عليك سلام الله امي حبيبتي..فمن مثلك غنى ساهرا ومن مثلك زرع ببابي مهجتي..فكم ضاقت الدنيا علي بأهلها فما اهتز ايماني وما بعت عزتي ..وفي غربتي عنكي فتحت حقيبتي ..وجدت حجابا فوق صورتي..ربطتيه ياامي بشيب مبارك..عليه تراب من ضريح الائمة..آه ..دعاء عظيم كان زادي برحلتي ..فقلبي على البيت الكبير ولوعتي..ولوعتي على والدي الغالي وصحبي واخوتي ..على التاريخ وشطآن دجلتي..ومدرستي الاولى وحناء جدتي..فياليتني امي جالس قربك اقبل كفيك وألعن غربتي ."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022148/http://masr.20at.com:80/article.php?sid=58&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"
