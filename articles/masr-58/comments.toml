author = "هوبه او هبهوب"
posted = "2006-03-22"
text = "بصوا يا بشر ماما دي روح حياتي وتحيه جامده للي شال<br />تعليقي بتاع امبارح كنت محبطه معلش<br />اولا انا وامي اكتر من الاخوات .<br />بقالي _______سنه مشفتاش دلوقت والاجازه \" الفظيعه\"<br />اللي قضتها معها كانت شهر يتيم<br />للمره الاخيره \" لسوف اعود يا امي اقبل راسك الزاكي \"<br />وكل سنه وامهات مصر كلها بخير ."
