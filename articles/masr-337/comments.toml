[[comments]]
order = 2
subject = "كورة_كوسة"
author = "أبو أسامة"
posted = "2006-05-24"
text = "لقداصبحت الكورة هى مرادف للكوسة على راى وحيد سيف اصبح لاعب الكورة من القريبين من السياسةوالسياسة والكورة فى المشهد الحالى قريبى الشبه من بعض لأن الأتنين بنتفرج عليهم لكن لايسمح لأحد بالنزول الى أرض الملعب والشبه التانى ان الأتنين أصبحت ا لكوسة رحيتهافايحةوبشكل يقرف فاللوأحصرم يشتغل مزيع مع ان صوته يقرف واللوأ مدحت يزيع مع انه بيحب الكوسة والنفاق واللواءشوبير يزيع لا شوبير مش لواءلكن بكرة يدولوا اللوائية ماهومش ناقصه<br />غيرهاعلشان يبقى لم الوظائف الى فى البلد<br />فلأخ مزيع وعضو فى الحزب الوثنى ومعلق وشمثارو....الخ وكان الشباب كله متعين ومش لقيين حدمشتغلش والله الكورة دالوقتى بقت حاجة تغيظ بس الحمد لله بطلت اتفرج عليهافى مصر لكن الكورة برة حاجة تانية<br />على الأقل مبيخدوش فلوس من عندناوبيقدموا فن مش كوسة......"
archived = "2006-09-21"
capture_url = "https://web.archive.org/web/20060921112239/http://masr.20at.com:80/article.php?sid=337&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "مفيش كورة في مصر"
author = "طهقان"
posted = "2006-06-17"
text = "من الآخر وقبل ما اتكلم، أنا لا أهلاوي ولا زملكاوي، أنا بطلت اتفرج على كورة مصرية أصلا...<br />على الساحة الكروية المصرية مفيش أي فريق غير النادي الأهلي، ودي مش حاجة مفرحة، لأن ده يعني إن انتصارات الأهلي انتصارات مزيفة، لأنه ما بيواجهش فرق حقيقية، مجرد عرايس، والدليل على كدة مواجهات المنتخب المصري لنظائره الأوروبيين، وآخرهم أسبانيا، اللي ما كانتش بتلعب أصلا، وبالرغم من كدة كسبتنا.... ولا حول ولا قوة إلا بالله...<br />خبر هام:<br />انتقلت إلى رحمة الله تعالى السيدة كورة مصرية، والعزاء بعمر مكرم...."
archived = "2006-09-21"
capture_url = "https://web.archive.org/web/20060921112239/http://masr.20at.com:80/article.php?sid=337&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
