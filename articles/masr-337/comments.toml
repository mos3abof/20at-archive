subject = "العربليزيانز والملازم"
author = "اين عاشور"
posted = "2006-05-18"
text = "الأخ اللي كاتب بالعربليزي، أنا باحب الناس اللي بتجي في الهايفة وتتصدر<br />ياريت الأخ اللي كاتب المقال يبقى يعملهولوا ملازم يمكن يذاكر ويفهم..يارب نفهم يارب"
archived = "2006-09-21"
