[[comments]]
order = 0
subject = "عادى"
author = "ياء"
posted = "2006-05-17"
text = "ياراجل عيب عليك الكلام ده<br />دا النادى الاهلى نادى كبير<br />دا نادى القرن ثم دا بيحقق لنتصارات على طول صحيح بيلعب لوحده بس بيلعب<br />لكن الاسره الواحده قلى بتقول عليها لا بتلعب ولا بتحقق حاجه<br />الاهلى بيمتع حماهيره الاسره بتنكد على مصر كلها<br />الاهلى فيه 11 لعيب ومدير فنى ومدير كوره<br />الاسره مفيهاش غير 4 عليهم لعنه الجماهير<br />اهم فرقبن ان الاهلى بيقبل قرارات الحكم قلى هو القاضى فى اللعب<br />الاسره بتحاكم الحكم قلى هو القاضى<br />الاهم ان الاهلى فيه لعيبه بتعتزل<br />الاسره دى لا<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784.blogspot.com<br />yehia2784@hotmail.com"
archived = "2006-09-21"
capture_url = "https://web.archive.org/web/20060921112239/http://masr.20at.com:80/article.php?sid=337&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

