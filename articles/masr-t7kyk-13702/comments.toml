text = "بتوع الخليج عموما بيحبوا المسلسلات الصعيدى حتى ولو مش مطابقة للحقيقة الفعلية لان مفيش فيها رقاعة ولا تقصيع ممثلات ولا دلع بنات ماسخة ولا عرى ولا الفاظ جارحة او سوقية او ايحاءات جنسية فجة<br />زمان كان كتاب السيناريو ادباء زى نجيب محفوظ وعبد الحى اديب وغيرهم وغيرهم وكانوا بيختاروا الكلمات واللفظ بعناية انما دلوقتى يقول الواقعية ويجيبوا الفاظ حوار سوقية وعلى العموم مسلسلات الصعايدة وان كانت وحشة فهى احسن من اى عمل اخر<br />اما انا فكنت اتابع المسلسل الصعيدى الدياسطى وكان رائعا"
