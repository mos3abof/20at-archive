author = "بقية التعليق السابق"
posted = "2009-12-21"
text = "يا استاذ زخاري القاضي لما بيحكم في اي قضية بيحكم على حسب الاوراق الثابتة بملف القضية<br />القاضي ما شفتش متهم ولا مجني عليه ولا حضر اي حاجه ولا شاف اي حاجه<br />بيقرا ملف القضية وبيحكم<br />احنا كلنا كده هيا زخاري<br />احنا ما شفناش حاجه لا شفنا انبياء ولا شفنا حاجه ولا حضرنا حاجه<br />احنا بنقرأ كتب واوراق وبنحكم على حسب اللي موجود في الاوراق اللي وصلتنا<br />وانت راجل محامي كبير والمفروض انت اللي تفهمنا الكلام دا"
archived = "2009-12-28"
capture_url = "https://web.archive.org/web/20091228090949/http://www.20at.com:80/masr/egyptian-newspapers/14474-2009-12-20-11-29-17.html"

[[comments]]
order = 7
subject = ""
author = "طلال"
posted = "2009-12-21"
text = "السلام على من اتبع الهدى<br />اولا لدي تعليق على اخر ما جاء في الحوار هو ان المسلمين لا يحرمو التبرك بالاماكن و هذا الامر غير مقبول و هو رد على اصحابه , ولكن نجد الصوفية و الشيعة لديهم نفس العقيدة النصرانية في التبرك بالاماكن فتجدهم تارة يتمسحون بقبر ولي و تارة بتراب بلد مثل كربلا.<br />اما المسلم الحق المتبع لسنة نبينا محمد صلى الله عليه وسلم يصرف عبادته و اعتقاده لله الواحد الأحد.<br />اما بخصوص ظهور العذراء فأقول لأخواننا النصارا انتم تعلمون اننا نجل العذراء و المسيح و ان القرأن ذكر المسيح اكثر من ذكر محمد صلى الله عليه و سلم و لكن كيف يمكن للعذراء و قد توفاها الله ان تتجلى ؟ و ان قلتم انها كرامة فألأولى بالتجلي و الظهور هو المسيح الذي تزعمون انه الرب تعالى الله عما تقولون.<br />ايضا مادامت العذراء قد وصلت لماذا لم تنزل من سقف الكنيسة و تكلم الناس و تدعو الناس للدين الحق ؟<br />لنكن واقعيين !!<br />اين العقول ؟؟؟؟؟؟؟؟<br />هذا الامر مثل الصوفية و الشيعة عندما يذكرون مناقب الولي الفلاني او السيد العلاني ليضحكو على الجهال من الرعاع , لكن اسأل الله ان يعافينا من ما ابتلاكم به"
archived = "2009-12-28"
capture_url = "https://web.archive.org/web/20091228090949/http://www.20at.com:80/masr/egyptian-newspapers/14474-2009-12-20-11-29-17.html"

