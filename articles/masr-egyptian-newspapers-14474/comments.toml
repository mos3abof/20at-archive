posted = "2009-12-21"
text = "وجود المسيح في مصر دليل قاطع على عدم الوهيته وانه انسان مثلنا مثله<br />لان السيدة مريم هربت بالمسيح الى مصر خوفا عليه من القتل<br />والقتل للبشر ولو كان اله او ابن اله ما خافت عليه من القتل<br />لان الالهة لا تقتل يا زخاري<br />فهمتها يا زخاري<br />سيدنا المسيح ابن مريم وسيدتنا مريم شرفوا مصر وباركوها بهذه الزياره نحن المسلمين نعتقد في ذلك<br />وهذه الزيارة فيها الدليل القاطع والساطع على عدم الوهية المسيح لانه هرب من القتل<br />المفروض انت راجل محامي بالنقض والادارية العليا تبقى فاهم الدليل دا احسن مني ومن كل المسلمين"
archived = "2009-12-28"
capture_url = "https://web.archive.org/web/20091228090949/http://www.20at.com:80/masr/egyptian-newspapers/14474-2009-12-20-11-29-17.html"

