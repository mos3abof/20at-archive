text = "مرة زمان خالص من حوالي يمكن اكثر من اربعين سنه ظهرت العذراء في الزيتون<br />وكان الناس يذهبون من بعد العشاء الى الفجر ينتظرون العذراء ولا تظهر<br />فمرة طلعت نكته والناس واقفين طول الليل مستنيين ظهور العذراء<br />طلع المسيح وقالهم<br />ماما زمانها جايه<br />جايه بعد شوية<br />جايبه لعب وحجات<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ<br />وطبعا الكلام هنا ليس على المسيح ومريم الذين ذكرهم القران حاشاهم صلوات الله وسلامه عليهم وعلى نبينا وجميع الانبياء"
