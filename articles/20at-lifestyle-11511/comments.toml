text = "هذا الموضوع مرتبط بالأداء الجنسى للرجل تجاه المرأة فالرجل يهرب إلى صديقه إذا كان لديه قصور فى الأداء الجنسى تجاه زوجته ويعوض هذا بالكلام مع صديقه عن الجنس وأوضاع الجنس المختلفة التى ربما يريدها ولا يستطيع أن يتحدث مع زوجته فى هذا الأمر ولى صديق متزوج منذ أقل من 3 سنوات ولو قسمت الأيام التى عاشها مع زوجته لن تكون ربع الأيام الذى يعيشها مع أصدقائه . ramigalal62@yah oo.com"
