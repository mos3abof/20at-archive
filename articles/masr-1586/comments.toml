[[comments]]
order = 3
subject = "مأساه"
author = "ayman"
posted = "2007-02-17"
text = "بسم الله الرحمن الرحيم<br />الموضوع ماساة اسره<br />اكتب ماساة اسره ضاع املها في عيان السلطه واستهتار المسؤلين وانا الان اكتب الي السيد رائيس مصر واب كل شاب وفتاه واتمنا من الله ان تراعوا الله في حياة الارواح البريئه من التدمير بسبب اهمال المسؤلين وسعيهم وراء المال والسلطه<br />الحادثه<br />بصراحه اخي الكابتن الشهيد ايمن عبد المنعم محمد الشربيني كان كابتن بنادي بيلا الرياضي ومقيد بسجلات الاتحاد المصري لكرة القدم لعام 2000/2001 م وكان صديقه المقرب له حسام غالي بالرغم من ان الشهيد كان لاعب ممتاز واحسن من حسام غالي شوفوا الحال دلوقتي هو فين حسام وبيتعقده معاه بكام مليون . ولكن الاهمال الذي اخذ روحه دون شعور بالاهمال.ولقد ذهب الشهيد مع فريقه لتادية مباراه امام نادي شبين الكوم والذي لقي مصرعه عند احتكاكه بعمود كهرباء لا يبعد اكثر من مترين من الضربه الركنيه وقد تم نقله بسيارة الشرطه لانعدام سيارات الاسعاف وقد راحت اخر انفاسه في مباراة الاهمال وكما انزل عرقه في حرم الملعب كانت هناك في نفس هذا الملعب اخر انفاسه والذي خرجت من روحه بسبب اهمال الوزارات ومن المعروف ان اتحاد الكوره المصريه كان يشرف وينظم هذه المباريات ولابد من وجود لجنه لمراعاة السلامه والامان لكلا الفريقين وكان من المفروض ان الملعب كان غير صالح ممنوع اعطاء تصريح من قبل اللجنه لاتحاد الكوره بالعب عليه مدام ملعب فاسد ذي الاتحاد .وشبكة الكهرباء الذي بنت عامود مكهرب وبدون تغطيه اسلاكه المميته في حرم الملعب والذي ادي الي قتل هذا الكابتن الذي لا يستحق هذا الاهمال من جميع المسؤلين في شبكة الكهرباء والاتحاد المصري لكرة القدم الظالم والغير منصف<br />ومنذ هذه الكارثه التي المت بنا عام2000 ونحن نس<br />اقرأ بقية التعليق .."
archived = "2007-02-19"
capture_url = "https://web.archive.org/web/20070219123059/http://masr.20at.com:80/article.php?sid=1586"

