[[comments]]
order = 0
subject = "الله اعلم"
author = "السعيد المصرى"
posted = "2006-11-07"
text = "ما ورد فى هذه الكلمات لا يمكن ان يمر بهذه السهولة<br />ما كتب الان خطير بل ورهيب<br />اين دليلكم على هذا الكلام<br />وان صح هذا الكلام فيا للمصيبة<br />يالمصيبة هذه البلد<br />وانت كنت اقول ان الكاتب مصطفى بكرى بالفعل غريب وغير مفهوم فى احيان كثيرة<br />و اتذكر عند سقوط صدام اخرج عدد الجريدة بالكامل عن صدام حسين والدفاع عنة وتحاشى مساوء الرجل واعتذر يومها عدد ليس بالقليل من كتاب الجريدة عن الكتابة فى هذا العدد<br />من الممكن ان يكون مصطفى بكرى منهم<br />بس يا ناس الدليل<br />الدليل<br />سامحك الله يا بكرى"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"

