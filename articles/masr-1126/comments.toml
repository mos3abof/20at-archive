text = "مش مستاهله انك تجيب ارقام تليفونات لضباط امن دوله ..عشان تعرف حقيقه العلج ده.. يكفى انك تقرا مقالاته اللى بيهاجم فيها كل شيىء ما عدا حسنى مبارك عشان تعرف حقيقته<br />ابن الابالسه سود وجوهنا احنا الصعايده!!<br />دا حتى مسمينه هو واخوه (عائله زيزى)فى الوسط الصحفى .. حتى اسألوا الصحفى الشريف جمال فهمى.. اخصصصص"
