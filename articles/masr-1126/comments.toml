subject = "حرررااااااااام"
author = "محمد المصري"
posted = "2006-11-25"
text = "يا منى الكلام اللي انتي كتباة دة خطير جدا جدا جدا بس مينفعش يتقال كدة كلام مرسل وخلاص من غير اي دليل وخصوصا ان انتي بتشككي في زمة واحد من القلة اللي الشعب المصري بيثق فيهم ومينفعش الكلام دة يكون مرسل لانة فعلا لو بجد يبقى المفروض نهجر البلد دي وكفاية علنا كدة علشان العملية كدة في الضياع"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"
