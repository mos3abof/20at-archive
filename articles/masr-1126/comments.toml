text = "اتعجب مما ارى لما نحب دائما القاء الطوب ونثر التراب على اى شىء يلمع فى عيون الناس وكأن مكتوب علينا ان نعيش فى جو خانق من كل الاتجاهات اليس فى تلك البلد من رجل رشيد؟ اهكذا الكل يعمل لمصلحته الخاصه فقط من رئيس الجمهوريه حتى بواب العماره حتى من رحل عن دنيانا من الرؤساء لم يتركوا بسلام خلاص لم تعد تنجب مصر الا خونه وغدارين واصحاب مصالح شخصيه هو التعامل مع القذافى جريمه يعاقب عليها وصدام حسين خارج عن المله والتعامل معه من المكفرات هو فيه ايه كرهتونا عشيتنا كلما قلنا هذا ملتزم وهذا زين تدخلونا بيت الرعب كى نسمع ما يربكنا ويكدر حيتنا من نصدق ومن نكذب وممن نسمع وكل يوم نرى رموز وكأنها جلمود صخر حطه السيل من على وتتهاوى معهم اعصابنا ونفسياتنا لوجه الله اتركو شىء حلو فى حياتنا"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"

[[comments]]
order = 44
subject = "مؤلف كبييير"
author = "1-بكري معندوش أسرار المقابلات بين شخصيات كبيرة ولا حاجة..هو ببساطة بيألفهم!!"
posted = "2006-11-23"
text = "مثلا...نشر موضوع كبيييير علي صفحة كاملة وليها 5 مانشيت عالصفحة ألأولي..عن لقاء سري بين كسينجر وصدام حسين ..قال إيه ..إن كسينجر قال لصدام..اطلع في التلفزيون قول للمقاومة تقف..وحنسيبك تعيش..القصة كان فيها تفاصيل دقيقة عن طريقى جلسة كسينجر وازاري صدام كان بيبص لكسينجر من فوق لتحت!!<br />حاجة من تلاتة..يا امة هو مركب كاميبرات مراقبةفي سجن صدام..يا امة كان عنده جاسوس في سجن صدام..يا امة هو قعد ضربله جوان محترم..وفبرك الصفحة عشان يملي المساحة!!"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"

[[comments]]
order = 45
subject = "أه هو منهم"
author = "مصراوى"
posted = "2006-11-24"
text = "أيوة ياسيدى هو منهم , الريس خده معاه على طيارته فى كذا رحلة و آخرها الصين , شوفوا عنده أيه دلوقتى جرنال ملاكى و فيلا فى المعادى النضيفة, شوفوه لما كانت إنتخابات نقابة الصحفيين كان بيتمسكن و يذلل نفسه, لو ناوى يخدم ما كانش يذل نفسه بيذلها لحساب نفسه, و حسنى لغى الحبس بتاعه و خلاه غرامة, و أتحداه أن يقول كلمة فى حق حسنى أو يعلن رفضه لتوريث جيمى , لماذا الهجوم على طلعت السادات الآن ( هو الآخر أزفت منه)<br />الأفاقين الذين يدعون الشرف كثيرون:<br />أيمن نور الأفاق الأكبر الذى خدع الكثيرين و الذين يريدون الخلاص من حسنى و سنينه<br />و طلعت السادات الذى نهبها هو و أبوه و العيلة الكريمة<br />و المدعو مصطفى بكرى الذى يظهر بألف وجه"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"

