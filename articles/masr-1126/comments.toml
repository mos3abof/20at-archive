posted = "2006-11-07"
text = "كل الاعلام والصحافة المصرية متامنة ما عدا اتنين وائل الابراشي و ابراهيم عيسي و هالاخير طريقة الي السجن اخضر لان دماغه ناشفة حبتين اما الاول احتمال يظبط علشان الامن بيضيقها علي الجريدة والضرائب والحركات الشفتشي بتاعة المصريين وده مكتوم في المصري اليوم برضه صحيفة مستقلة و رئيس تحريرها يا امن يا امن وربنا ما يحرمناش من رجال الامن الشرفاء"
