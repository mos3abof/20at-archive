subject = "بكرى -- وايمن نور"
author = "حمار-- سابقا"
posted = "2006-11-07"
text = "اقرار --- اقر واعترف اننى كنت حمار حصاوى وناقص له بردعه ولجام نظرا لاننى كنت يوم من الايام احسب الاخ بكرى من الحركه الوطنيه واعده من الصحفيين اصحاب القلم الحر الشريف وفى نفس الوقت كنت احتقر الدكتور ايمن نور واعده عميلا للغرب تسانده امريكا للوصول الى كرسى الحكم والان بعد ان تكشفت حقائق لم اكن اعلمها وبعد تعليق ابن بهيه الذى لااشك فى وطنيته فاننى لا اخجل من ان اقول اسف دكتور ايمن انت رمز للشرفاء مهما قالو ونالو منك و من سمعتك ومهما لمعوا امثال بكرى وقرناؤه فلابد من يوم معلوم ترد فيه المظالم بيضه على كل مظلوم سوده على كل ظالم"
