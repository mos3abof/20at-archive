[[comments]]
order = 16
subject = "دى وساخة حمدى رزق"
author = "zaki_dabor@yahoo.com"
posted = "2006-11-07"
text = "يا جماعة خلوا بالكم الكلام دة لخط حمدى رزق لانة الايام دى بيرسم على النقابة وبيطهر نفسة من دور محجوب عبد الدايم الى عاشة فى عصر مكرم محمد احمد وخرج من المولد بلا حمص.<br />اسالوا حمدى رزق عن علاقتة برامى لكح و حكاية سبوبة التليفزيون اسبوعيا، وحقدة على مجدى الدقاق و محمود سعد وعبداللة كمال، وخاصة تلاخير لان حمدى بيقول علية كلام فى ظهرة وامامة مابقولوش الى يا ( ساحر) شوفوا تانفاق ، وبعدين جاى يعمل شريف و هو اوسخ من مصطفى بكرى."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"

