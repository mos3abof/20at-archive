subject = "اخيرا عرفتوا حقيقة مصطفي بكري"
author = "حمدي"
posted = "2006-11-08"
text = "الحقيقه ان مصطفي بكري طول عمره منافق وافاق والجكايه مش صدمه ولا حاجه اللي بيتابع مقالاته منذ نشاته سيعرف انه مجرد افاق يلعب بالبيضه والحجر<br />ياريت بقي نفكر شويه قبل ما نطلع بالسماء لكل واحد قال كلمتين وحشتيين عن امريكا يبقي صلاح الدين<br />مصطفي بكري طول عمره افاق كبير اقرا مقالاته في صحيفة الاحرار قبل الاسبوع وكمان الاسبوع<br />مصطفي بكري وقف بجوار صفوت الشريف ودافع عنه وكانه ابو بكر الصديق<br />مصطفي بكري اتحدي ان يكون له مقال واحد ينتقد فيه مبارك بشكل صريح<br />مصطفي بكري الافاق يدافع عن الديكتاتوريه في العالم العربي بحجة القضايا الكبري ومواجهة اسرائيل!!!!<br />مصطفي بكري يتهم كل من ينادي بالديمقراطيه ويقف في وجه النظام بالعماله للغرب<br />انا فرحان جدا لان اخيرا حد عنده الشجاعه انه يواجه هذا الافاق الفاسد المنافق ويظهر حقيقته للناس المخدوعه<br />الصحفي الوحيد اللي انا متاكد من تزاهته في مصر هو ابراهيم عيسي<br />لكن مش معني كده ان الباقي سيئين لكني انظر للجميع بعين الشك الا ان تبين الايام معدنهم وحقيقتهم"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"

