[[comments]]
order = 2
subject = "لا تلوموا بكري .. كلهم بكري"
author = "إبن بهية"
posted = "2006-11-07"
text = "ومخالفات شركة الملاحات سنة 1999م ، والتي تبدلت المستندات الدالة على المخالفات والسلب والنهب فيها إلى إعلانات على صفحات الأسبوع ؟! كثيرة مصائب بكري ولا أعتقد أن هناك من يجهلها ولولا تلك المصائب ما كان بكري .. هذا إخراج طبيعي لعصر مبارك .. لا يمكن لأي شريف أن ينتصب القامة ويعلو بهامته مطلقاً إلا عبر هذا الطريق القذر في مصر المحروسة .. عشرات ومئات وربما آلاف الصحفيين الشرفاء هربوا من بلاط صاحبة الجلالة لأنهم لم يستطيعوا الطأطأة وبيع ضمائرهم وشرفهم .. صدقوني .. في هذا الزمن الرديء (زمن مبارك) لا يمكن أن تجد شريفالمع نجمه في الوسط الصحفي إلا ما ندر جداً جداً .. هذا منطق الأزمنة الخربة فلا تلوموا بكري وحده على بيع شرفه ولكن لوموا ذلك النظام الكريه الواطي .. لدينا في مصر مليون بكري وبكري ولا مناص للخلاص منهم غير الخلاص من ذلك النظام البغيض وزعيمه الواطي حسني مبارك .. وسيبوا بكري ياكل عيش وجاتوه لغاية ما ييجي اليوم وما يحصلش العيش والحلاوة في معتقل الكلاب وأذناب النظام البائد قريباً بإذن الله ...<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"

