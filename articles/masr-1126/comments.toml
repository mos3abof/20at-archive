[[comments]]
order = 4
subject = "مصطفي ...كفياك عاد"
author = "الصياد"
posted = "2006-11-07"
text = "يختلف اثنان على ان الصحفي مصطفى بكري شخص يلعب لمصلحته فهو ممثل ممتاز وكان الاجدر به دخول معهد الفنون المسرحية ,<br />متخذ شعار القومية العربية وديدنه اهانة الحكام العرب ماعدا الحكام المغردين خارج السرب امثال معمر القذافي وصدام حسن(سابقاً) , ومحترف الظهور بالمظاهرات ضد الغرب (أطردوا هذا السفير ..و..و..و) (الكلام ببلاش)<br />ولا تختلف طريقة مصطفى بكري عن اخوه محمود بكري فقد قرأت له من الكتب ما يكتب به مناقشات بين السياسيين والرؤساء (نظرية المؤامرات) وحتى الحوارات التليفونية (قمة الكذب)..لا ادري هل كان معهم؟؟<br />ومصطفى كذلك مؤلف لايشق له غبار وملفق حوارات ..يريد ان يصبح بطل القومية العربية الزائفة ..والعامة والرعاع هم من يصدقه أما المثقفين فيقولون له (العب غيرها)<br />مصطفى إذا كنت تقرأ كلامي هذا فأعرف أن الكثيرين يعلمون مدى أتقانك للعبة والضرب على الوتر الحساس للعامة العرب وهو الوحدة العربية وتبني الفكير الناصري ..ولكن أصبحت مكشوف ..كشف القناع ..دور لك على قناع ثاني...للاسف"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"

[[comments]]
order = 5
subject = "مش عارف اقول ايه !"
author = "بصراحة انا مش برتاح لمصطفى بكري مش عارف ليه؟!"
posted = "2006-11-07"
text = "بس الكلام الي اتقال ده خطير ...بس مفيش دليل قوي وواضح على ما ماجاء في تقرير .<br />بس يبقى ان التقرير دسم وأثار كتير من التساؤلات وجهد موفق من منى سليم...بس يبقى امر ان الكلام مفيش مادي ملموس عليه...بمعنى ان محدش سمع الريس وهو بيتصل بمصطفى ولا قصة التعريف الي قام بيها البلتاجي لمصطفى وتجنيده...ولا حد شاف موبايل الراجل وخرج منها تليفونات ظباط امن الدولة...بس هو بالفعل في كلام كتير حوالين شخصية بكري وعلاقاته سواء داخل مصر او خارجها...يبقى ان منى سليم عملت شغل كويس ولكن يبقى انه في حاجة لمزيد من التوثيق !<br />شكراً"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"

[[comments]]
order = 6
subject = "مصطفى و المجلس"
author = "من حلوان دائرة مصطفى بجري"
posted = "2006-11-07"
text = "مصطفى بجري ( بسرعة) أو كما هو دوره في المسلسل مصطفى بكري رجل المعارضة الصعيدي النزيه ذو اليد البيضاء حامل لواء الدفاع عن المواطن المطحون و لكن يا أخ مصطفى كلنا نعرف أنها تمثيلية و أخر النهار كله بيطلع في الغسيل و بالنسبة للأخ اللي بيسأل على دليل أنصح سيادتك بزيارة عابرة اللى منطقة حلوان و بالأخص حلوان البلد دائرة 25 التي شهدت من المجازر ما شهدت خلال 15 عاما ما بين بكري و محمد علي محجوب وزير الأوقاف الأسبق على كرسي المجلس حتى نالها بكار العجيب تقدر تقوللي بالله عليك ايه اللي ممكن يخليك تضحي بفلوسك و أهلك و ناسك 15 سنة من أجل كرسي تحت القبة؟؟؟ متقوليش خدمة الناس.. لأنك في زيارتك العابرة سترى انجازات بكري في المجاري و العشوائيات و الخرابات...الخ .<br />على العموم سامحه الله المهم بلاش الدور ده لأنه مش لايق عليه"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"

[[comments]]
order = 7
subject = "كنت حاسس"
author = "عنتر مش لاقى سيفه"
posted = "2006-11-07"
text = "السلام علي من اتبع الهدى<br />موضوع رائع و هايل يا منى, والله ياجماعة انا ياما قرأت و سمعت لناس كتير من اللي بيطلعوا و يطبلوا للحكومة, و يوم معاهم و يوم عليهم, و كانوا بيبقوا باين عليهم النفاق و الكذب, اللا الراجل دة, عمري ما اقتنعت به و لا حسيت في يوم من الايام ان ليه مثلا قضية معينة او هدف معين, حتي اسلوب نفاقه بيبقي اسلوب مقزز و مقرف, تحس انه واحد مش لاقي شغلانة و معاة شوية فلوس عامل بيها جريدة, لا الجريدة ليهاهدف و لا معنى, و لا هو ليه موقف و لا رأي, مجرد واحد بيحب يشهر بالناس و يحب الفضايح و الاشاعات, لا في مصداقية و لا فية حقيقة, و لا تعرفله عدو من حبيب, واحد بيجري ورا الفلوس و خلاص.<br />بس ارجع و اقول علي رأي الكبير اوي الاستاذ ابن بهية, هي جت يعني علي بكري, ما هي كل حاجة لا بقي ليها طعم و لا معنى و لا ريحة, بقينا عاملين زي اللي عايشين في الشارع بالظبط, لا عارفين لينا بيت و لا مطرح يلمنا, و لا عارفين لينا هاوية و لا طابع و لا هدف و لا امل, الله يجازي اللي كان السبب, اللي خلي المصري من كتر الخوف و الرهبة يبطل يقول كلمة لأ, و لا يعترض علي حاجة و لا يوافق علي حاجة و لا له رأى و لا وجهة نظر, بقي الانسان المصري المواطن الغلبان كل همه لقمة عيشة, وفي اغلب الاحيان مابقتش تهمه دي كمان و بيفوتلها الدنيا كلها بارادته.<br />حسبي الله ونعم الوكيل في كل من تسبب و شارك و ساهم في الحالة اللي احنا وصلنلها دي, الواحد بقي كل امله في ربنا سبحانه و تعالي انه ينتقم من الناس دي كلها و يورينا فيهم عجائب قدرته....قادر علي كل شيء."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"

[[comments]]
order = 8
subject = "مع مين بظبط يا درش"
author = "ايمن العربى"
posted = "2006-11-07"
text = "كل يوم فى حال زى الدنيا ياعم درش مرة مع المعاضة ومرة مع الحكومة فين الجبهة الوطنية ولية انت على الفضائيات تهاجم النظام الرئيس وعلى التلفزيون المصرى تحمل المسئولية لمن تحت الرئيس وان لرئيس لان يرضة بهذا لو يعلم ولا نسة انك كنت تحرض الدولة على الزعيم الوطنى الذى يدفع الثمن وحدة الان زعيم الفقرا الذى احبة لشعب رغم هجوم الكدابين وخدام الدولة من لكتاب علية وكتبت صفحة يوم انتخابات الرائسة انة سيستعين بامريكا وانة سيحرض انصرة للنزول للشارع فى مظاهرات وكان يسمية مرشح المعارضة وان لبلد سسدخل فى فوضة الحمة يارب من هذة لانواع من البشر لكى تصل على اكتاف لشرفاء والفقراء ولتحية للزعيم ايمن نور"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"

