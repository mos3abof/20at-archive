[[comments]]
order = 14
subject = "كنا بناكل من الكلام دة زمان"
author = "بسلة مسلمة مصرية"
posted = "2006-11-07"
text = "والله الراجل دة كنت بقول علية فى الاول انة من اشرف الاقلام الصحفية العربية فى فترة كدة بعد كدة اتقلبت الاية عموما مش بس مصطفى بكرى دة واضح ان القاعدة كبيرة اوى بطريقة تبكى وعموما بقى فى طريقة جديدة عشان نعرف الشريف واللى مش نضيف لو دقننا النظر حنلاقى ان الشرفاء اللى فى البلد نصهم ويمكن اكتر فى السجن والباقى رهن الاعتقال اما اللى مش نضاف فهما اللى اكلنها ولعة .<br />وعموما خلى اللى يستخبا يستخبا بس يخلية عارف انة حيجلة يوم مش بس يتعرف لاء دة حيتفضح<br />ومع تحياتى(اتمنى ان نكون من الشرفاء اللى موقعهم رهن الاعتقال)"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015033/http://masr.20at.com:80/article.php?sid=1126"

