text = "كيف تاتى الحرية ونحن يلعب بيناء ناس تلعب على جميع الحبال والاحرار تدخل السجن واقزام السياسة والكدابين تلعب علينا نحن الشعب عجيب يا زمان ايمن نور افضل برلمانى وسياسى عن افريقيا وعن الشرق الاوسط فى السجن والكدبين خارج السجن تحية لابطال هذا الوطن بجد كريم الشاعر والشرقاوى ومحمد الطاهر ووائل عباس وعلاء ومنال وكل احرار هذا الوطن وتحية خاصة للدكتور ايمن نور والاستاذ طلعت السادت ولا عزء للكدابين"
