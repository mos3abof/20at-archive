text = "مصطفى بكرى نسخه محسنه من موسى صبرى<br />آنا توقفت عن شراء جريدته منذ فترة<br />تجد آغلب المقالات تطييب للمعتوه الكبير وهجوم على اللى النظام غضب عليهم بالفعل<br />زى ما محمود سعد وصفة بالضبط \"معارض فى بلاط السلطه\"<br />وكله توزيع آدوار فى فيلم ساقط"
