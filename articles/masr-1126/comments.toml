posted = "2006-11-19"
text = "يااخ عربى لا تلقى الاتهامات جزافا ؟ فعبد البارى عطوان فلسطينى يعيش فى لندن ودفاعه عن صدام ليس حبا فيه ولكن لانه الرئيس العربى الوحيد الذى خرج بعيدا عن قافلة العمالة المسماه (حكام العرب ) وغرد بعيدا عن السرب ؟ فكان جزاء كل من دافع عنه ان اتهمته المخابرات الامريكيه بانه كان يتلقى اموالا من الحكومه العراقيه -- المهم يجب ان نعلم انه اذاتوافقت بعض الاراء فى شخص معين او قضيه معينه فليس هذا دليل على انهما يتبعان خطا واحدا فى كل القضايا --- والا هل وقوف القوى الوطنيه بجانب حزب الله فى معركته الاخيره مع اسرائيل هو وقوف بجانب الشيعه فى جميع قضاياهم ؟ كلا؟ كذلك اذا التقى مصطفى بكرى وعبد البارى عطوان فى موضوع معين واتفقا على نقطةواحده هل هو التقاء فى جميع النقاط !فلا تشبه عبد البارى عطوان بمصطفى بكرى فاالفارق كبير بينهما ولاوجه للتشابه الا فى نقطة واحده (بغض امريكا واسرائيل وحب من يبغضهما)حتى ولو كان صدام"
