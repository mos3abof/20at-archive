subject = "خائبون خائبون"
author = "هذا المقال 100 % صح"
posted = "2006-12-13"
text = "كفايه غباوه بقى الاخوان هم اسوا على مصر من اى شىء ... انتو عاملين زى واحد بيعدى الشارع و فى عربيه نص نقل جايه و هتشيله والناس عماله تنده عليه يا عم حاسب يا عم خلى بالك و هو بمنتهى الغباء ماشى الى نهايته ... و مسيركم تتاكدوا من كده بس بعد فوات الاوان كالعاده."
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030221/http://masr.20at.com:80/article.php?sid=1289"

[[comments]]
order = 6
subject = "طول عمرك كلب وحقير يا حمدى"
author = "فارس_fr"
posted = "2006-12-13"
text = "يعنى لم بلطجية الحزب الوطنى دخلواالجامعات وضربوا الطلبة كلها اخوان مع يساري مع كفاية كله على كله ,, مسمعتش صوتك يا حمدى يا كلب ,, لم منعوا الطالبات المنتقبات من دخول المدينة الجامعية مسمعتش صوتك يا كلب ,, انت عنك حق فى السطر التانى اللى قلت فيه ان البلد محتله ,, فعلا هى محتله من كلب زيك كده واولادة وحاشيته ,,, يا حمدى يا واطى يا مخبر يا معفن ,,, الاخوان انظف منك ومن اللى زيك ,,,, اللى زيك اللى هو \"كرم زفت جبر \" اللى امبارح اتكلم فى العاشرة مساءا ومستغرب وخايف من اللى حصل ,, ازاى هيودى ابنه ولا بنته الجامعه بعد الى حصل من الاخوان ,,, طب يارب يكون فعلا من الاخوان ويكونوا هم اللى منظمينها ويكون فعلا عندهم تنظيم جهادى ,,,, كفاية بقي كفاية عليكوا كده يا كلاب البلد ,,, ارحمونا وارحموا شعبها الغلبان هو لم بلطجية الحزب الوطنى يبهدلوكم ويضربوكم على قلبكم زى العسل والاخوان لم تعمل عرض سلمى ويارب يكون ليهم علاقة بيه ,,, خلاص القيامه قامت .... انت يا حمدى انت وكرم من كلاب الحكومة وابواقها لموا نفسكوا لانكم هتكونوا اول الضحايا يا ولداه فى عمليةالتطهير ان شاء الله ..... وارحمونا بقى ياولاد البلد من حمدى زفت ده ومقالاته السخيفه . الاخوان انظف منك ومن اللى جابوك وعلى فكرة\"انا لا اخوان ولا لى علاقة بيهم \" بس بداية مبشرة وعسي ان تكون حقيقة ."
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030221/http://masr.20at.com:80/article.php?sid=1289"

[[comments]]
order = 7
subject = "نايم نايم ....صحوه!!"
author = "بحب الاخوان"
posted = "2006-12-15"
text = "باين الاستاذ حمدى كان نايم ساعت:<br />1-شطب طلاب الاخوان المتفوقين من المدينة لمجرد انهم من الاخوان<br />2-شطب طلاب الاخوان من الانتخابات الطلابية<br />3-ادخال البلطجية وارباب السوابق للاعتداء على طلاب الجامعة وترويعهم ومحاولة الاعتداء على اساتذة الجامعة من الاخوان<br />4-فصل طلاب الاخوان وخاصة المتفوقين منهم لمنعهم من اداء الامتحان<br />5-ضرب طالبات الاخوان فى جامعة عين شمس<br />6-منع تعين طلاب الاخوان الاوائل على دفعاتهم فى الجامعة<br />7-منع تعيين اساتذة الاخوان فى رئاسة الاقسام مع احقيتهم العلمية والاقدمية بها<br />وبعد دا كله صحى على صامدون... صامدون!<br />صحى النوم يا استاذ حمدى"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030221/http://masr.20at.com:80/article.php?sid=1289"

[[comments]]
order = 8
subject = "اتقو يوما ترجعون فيةالى الله"
author = "امة الله حنان سعيد"
posted = "2006-12-17"
text = "ياترى يااخى انت مع مين على مين الكلمة امانة وانت محاسب<br />وصيتى الى ولى الامركم بقى من العمر ياترى ؟؟؟ ماذا ستقول لملك الملوك قف لحظة واحدة مع ظلمة القبرمازال امامك فرصةللاصلاح قبل ان تقول ربى ارجعون اعمل صالحا فيما تركت ترى هل سيذكرك اقرب المقربون بعداسبوع من وفاتك بلله عليك كيف تنام وانت ستسال عن 75 مليون نفس انجو بنفسك من الحساب اللهم بلغت اللهم فاشهد اقول قولى هذا واستغفر الله لى ولكم"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030221/http://masr.20at.com:80/article.php?sid=1289"
