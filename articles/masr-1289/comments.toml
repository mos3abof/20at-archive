[[comments]]
order = 1
subject = "ايه يا حمدى جاتك داهية"
author = "عمار"
posted = "2006-12-12"
text = "ايه يا حمدى يعنى ما حدش سمع حسك لما حصل اللى حصل للصحفيات فى نقابة الصحفيين يوم الاستفتاء الاسود وما حدش سمع لك حس لما القضاة اسحلوا عالارض زى الخرفان ..ايه يا حمدى انتا هتعيش الدور على امنا ولا ايه احنا عارفينك من ساسك لراسك ع العموم جهنم الاخوان ومهدى عاكف والشاطر والعريان ولا جنة مبارك وسرور والعادلى ...م الحق مبروك يا حمدى على سبوبة (هوا فيه ايه)شد حيلك بقى فى حلبة النفاق علشان الفضائية المصرية مستنياك"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030221/http://masr.20at.com:80/article.php?sid=1289"

[[comments]]
order = 2
subject = "الهندي"
author = "حمدي حبيب قلبي"
posted = "2006-12-12"
text = "ازيك يا استاذ حمدي اللذيذ انت كنت فين يا راجل والله انت كنت اخرس ولا انت مسمعتش عن ضرب الطلاب في عين شمس ولا اعتقالهم في حلوان ولا انت مسمعتش عن ضرب الامن المركزي في القاهرةولا التحقيق مع الاساتذة في بني سويف ولا مكنتش بتعرف تقري والحمد لله عرفت تقراء الان والله كويس انك طلعت كويس عقبال العودة ممكن سوال هو بكام المقال بتاع المصري اليوم الي بتشتم في الاخوان وممكن سوال بكام المقال لو مشتمتش الاخوان<br />مبروك ومنكم لله يا بتوع الازهر"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030221/http://masr.20at.com:80/article.php?sid=1289"

