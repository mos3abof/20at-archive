[[comments]]
order = 4
subject = "محاكمه رد فعل"
author = "ايمن امام"
posted = "2006-12-12"
text = "ياحمدوف قهر السلطه هو الدافع الى مانشر الدوله تفرض ماتريده بالقوه ومن خلال اما الضرب وهتك العرض واما الاعتقال - ما المطلوب منهم ومن غيرهم - قمع وقمع وقمع- وتعذيب وهتك اعراض ولاحسيب ولارقيب - انا شخصيا لم يعجبنى ما نشر وصور العرض وتوقيته - ولاالتمس العذر لاحد ولكن - قل لمن يجلس الى جوارك من الباشوات هذه نتيجه القهر وانتم من ستشعلون هذا البلد وانتم لاتخافون على هذا البلد بقدر خوفنا عليها- القهر المستمر وتكميم الافواه والاعتقال العشوائى - والفصل والطرد من العمل او الجامعه - الاحساس بالظلم - هو الذى سيفجر الاوضاع فى هذا البلد - لو وجد هؤلاء الشباب من يستمع اليهم ومن يعطيهم حقهم - لما رأينا ما رأيناه -ولكنكم تعودتم ان يصمت الشعب وينصرف الى مشاهده الكره ويبقى الوضع على ماهو عليه- اتحاد طلبه تفرضون اراده العصا نقابه عماليه سياسه العصا نقابه مهنيه سياسه العصا -حتى القضاه لم ينجوا من العنف - اساتذه جامعات تعرضوا للضرب والاذلال - علماء دين تعرضوا للاذلال والقهر- ماذا تنتظر ياحمدوف هل استمرأتم الامر - لابد من ظهور رد فعل مختلف عما تعودتم عليه - الشعب يكرهكم ويكره شخوصكم وانت تعلم جيدا ماذا يقول عنكم الشعب - هل تنصلتم من مصريتكم هل اصبحتم تنظرون الى هذا الشعب باعتباره مجموعه خراف تساق الى الحظيره كيفما شئتم - ما حدث فى جامعه الازهر هو نتيجه لمقدمات كثيره - واستخدام نفس السياسه القمعيه معها سيؤدى الى الاخطر - تعقلوا ولاتغرنكم قوتكم وسلطتكم وسجونكم - لاتستمعوا الى من ينفخ فى النار - لاتستمعوا الى الماركسيين ورجال البلاط الامريكى فى مصر- ايمن امام"
archived = "2006-12-19"
capture_url = "https://web.archive.org/web/20061219030221/http://masr.20at.com:80/article.php?sid=1289"

[[comments]]
