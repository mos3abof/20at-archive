subject = "الأسد الشيخ عدنان الطرشة"
author = "بسم الله الرحمن الرحيم"
text = "في الحقيقة يتوقف القلم عندما تريد الكتابة عن شيخك واستاذك ويكتب القلب أجمل المعاني وأإقوى التعبيرات هذا شعوري عندما أكتب عن أستاذنا الكبير الشيهان/عدنان الطرشة الذي قام ولايزال يتدريبنا ولم أر طوال مسيرتي في الفنون القتالية مدربا أحسن أسلوبا وأنضج فكرا منه حتى أنه يجعلك تنشد الدرس المقبل وتتشوق له لروعة أسلوبه وحسن أخلاقه مع النظام الذي يدربه أخشن وأعنف نظام قتالي في العالم<br />والشيخ قد جمع مع دماثة الخلق وحسن المعشر وطيب النفس الوقار والمهابة كما أنه يمتاز بالعلم الشرعي وقدأشاد المختصون من أهل العلم بها وبمحاسنها الجمة وأثنى الأدباء والمفكرون على جودة أسلوبه وسيلان قلمه..نحسبه كذلك ولا نزكي الله احدا..<br />نسأل الله أن يبقيه ذخرا للإسلام والمسلمين وأن يعز به دينه وأن ينفعنا به...اللهم آمين تلميذه أبوعبدالله الشمري"
archived = "2006-11-02"
