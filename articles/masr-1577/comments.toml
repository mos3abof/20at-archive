subject = "تعليق على تعليق ابن تانت بهية الناصري"
author = "يا ابن تانت بهية يا ناصري"
posted = "2007-02-12"
text = "حسني مبارك بيدافع عن المادة الثانية من الدستور التي تنص على ان الشريعة الاسلامية هي مصدر التشريع والدين الرسمي للدولة هو الاسلام.<br />اما عبدالناصر صحبك صديق الروس والشيوعيين<br />هو الذي اسقط القضاء الشرعي من مصر والقصة عارفنها الناس القدامى بتاعة القاضي سيد الفيل"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215074132/http://masr.20at.com:80/article.php?sid=1577"

