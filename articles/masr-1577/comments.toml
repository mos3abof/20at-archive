[[comments]]
order = 8
subject = "الاسماء"
author = "الاسماء السهلة المصرية الحلوة بتاع ولاد البلد"
posted = "2007-02-12"
text = "مش الاسماء العبرانية<br />مين فى المصريين بيسمى ابنة موسى<br />نادر<br />ومين بيسمى يوسف<br />نادر<br />ومين بيسمى عيسى<br />نادر جدا<br />ومين بيسمى ابراهيم<br />بدأت تنقرض<br />الاسم السهل الحلو الجميل مثل حسنى وطلعت وجمال والسادات<br />اما ابو قويق والقاسى وعبد الجبار وخيشة والسلعوة<br />ومحضية وام الخير وست ابوها<br />وعصام ابن جدو<br />فعلية العوض ومنة العوض"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215074132/http://masr.20at.com:80/article.php?sid=1577"

[[comments]]
order = 9
subject = "و ليه لأ"
author = "نيفين نيفى نوفا"
posted = "2007-02-13"
text = "اولا اضم صوتى لصوت ابن بهيه و كل الرافضين لوضع صضوره الراجل اللى فوق دا<br />و بعدين دى ممكن تسد نفس الناس عن قراءه الموضوع<br />بالنسبه للموضوع انا بقول ان فعلا الاسم يا جماعه ساعا بيعمل مشكله لصاحبه<br />و بعدين ايه المشكله لو حد يتضايق من اسمه انه يغيره<br />المشكله لما المسكين او المسكينه يقرروا التغيير هيشوفو الويل ف الدوران الروتينى على مكاتب موظفين من ماركه فوت علينا بكره يا سيد<br />و لا خلوها فوت علينا بكره يا هيثم"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215074132/http://masr.20at.com:80/article.php?sid=1577"
