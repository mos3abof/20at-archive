[[comments]]
order = 0
subject = "رغم أن الموضوع فيه جهد واضح إلا ان التنفيذ سئ جدا !"
author = "شريف الدواخلى"
posted = "2007-02-12"
text = "بص يا سيدى محرر الموضوع مبدئياٌانتا تعبت فى الموضوع جدا و جبت شويه مصادر إلى حد ما غطت الموضوع كله بس فى كام حاجة انت مطالب أما منا كقراء بتفسريها أحتراما لنا كما نحترمك و هى<br />1- مين اللى عمل الدراسه وتاريخ صدورها \" وانا مستغرب ازاى اصلا الموضوع نزل بدون هذان العنصران ومش تقولى ان الدراسه جديده لان للاسف أنا عندى معلومات غير كده ومش عاوز اقولها عمل بحسن الظن بك \"<br />2- صاحب الدراسه كان من المفترض أنك تقابله لاخذ تعليق ولو صغير منه على دراسته<br />3- ذكرت انه عند تأكدنا من الخبر عملنا وسوينا \" طيب اتأكدت ازاى \" ولو كان معاك الدراسه فعلا كما ذكرت فلماذا تتأكد اصلا !<br />4- اكثر حاجة نقطتنى فى الموضوع أن المصدر الامنى اللى قالك على الاجراءات المتبعة عند تغيير الاسم لسبيين<br />أ- هو مش قالك سر أو سربلك انفراد ده قال كلمتين اصغر موظف فى احقر اسم يعرفهم<br />ب - انتا قلت انه لما عرف ان الكلام لولاد البلد مش رضى يقول اسمه \" ديه اساءه صريحه للموقع الذى تعمل فيه يااستاذ واوعى تفكر ان معناه انه كده خايف من الموقع ... لا المعنى مش كده خالص<br />واخيرا ... يعلم أصغر طالب فى اولى اعلام قبل حتى ما يتخصص صحافة أن الخبر لابد أن يحوى معلومه و ما يثير القارئ لقراءه الخبر هو عنوانه ... تقدر تقولى بقى ايه المعنى اللى وصلى من العنوان اللى مش فى خبر اصلاً وكله مبتدأ \" ولو كنت تقصد المقارنه بين الاسماء القديمه والجديده يبقى كنت تحط اسمين كده واسمين كده مش واحد اللى هو هيثم و3 اللى هما اسماء مستهجنه وكان لازم ساعتها تعمل خبر فى العنوان تقول مثلا أن دول تحولوا لكده<br />يعنى جعيدى وبهيه بقوا هيثم وانجى \" ! مثلا .. أظنه عنوان اوقع<br />وارجو الرد على ما افردت من التعليق .. وشكرا ً"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215074132/http://masr.20at.com:80/article.php?sid=1577"

[[comments]]
order = 1
subject = "الكلب كلب ولو بطوق دهب .. برضه كلب"
author = "إبن بهيه"
posted = "2007-02-12"
text = "أعترض بشدة على الموضوع لسبب وجيه جدا ومن حقي كمواطن .. بلاش مواطن لأننا ما بقيناش عارفين إذا كنا مواطنين ولا لأ .. لكني كزائر لهذا الموقع من حقي الاعتراض والتأفف والضجر والصراخ كمان ....<br />السبب الوجيه لدي هو وجود صورة كلب الحراسة ذاك على الموضوع<br />ما علاقة الموضوع بصورة كلب الحراسة المربوط في حديقة بيت العيلة الواطيه؟<br />ما تقوليش ده كلب بسلسلة دهب وطوق مزخرف ووو ... برضه كلب<br />يبقى إيه دخله هنا بزمتكم ؟؟؟<br />ما تقوليش برضه عشان قال إيه السدق المدني تابع لزير الداخليه وعشان كده حطينا صورة الزير ده هنا<br />كل ده مرفوض<br />ارحمونا من الصور العفشة دي حرام عليكم بجد<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215074132/http://masr.20at.com:80/article.php?sid=1577"

