[[comments]]
order = 3
subject = "يا عم شريف"
author = "ياسر فرج"
posted = "2007-02-12"
text = "يا عم شريف يا دواخلي أنا نفسي أعرف أنت شغال فين يا أخي نفسي أقرأ شغللك عشان أتعلم منه لأانه لازم الناقد العبقري اللي زيك دا يبقي فلتة طبعا أنت زعلان لأن الوحي بدل ما ينزل عليك نزل علي محمد حسنين هيكل يا أخي الموضوع بسيط جدا بالنسبة للعنوان يا بتاع الأبجديات لازم يشد القارئ و علي فكرة أنا كنت كاتب بعد المبتدأ بتاعك يا مدرس النحو كلمة مش طايقين نفسهم لكن الديسك عارفه و لا أشرحه لك هو اللي شاف أن العنوان كدة أوقع و أفضل و بعدين يا ريت تأخد عنواني عشان تعرف الاتجاهات الحديثة في التغطية الصحفية و دي محاضرات أحن"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215074132/http://masr.20at.com:80/article.php?sid=1577"

[[comments]]
order = 4
subject = "تغيير الاسم"
author = "وفيه بعض الحالات بيبقى الاسم جميل وكل حاجه ولكن الواحد بيبقى محتاج يغير اسمه بالكامل علشان خاطر يبدأ حياة جديدة مع ناس جداد."
posted = "2007-02-12"
text = "لكن ممكن اسم الواحد او اسم ابوه او اسم العيله بتاعته يكون بيفكروا بواقعة سيئة او احداث معينة تؤلمه نفسيا.<br />فنرجوا المسئولين ينتبهوا لهذه النقطة ويوافقوا على تغيير الاسم وطالما اللي عايز يغير حيدفع الرسوم"
archived = "2007-02-15"
capture_url = "https://web.archive.org/web/20070215074132/http://masr.20at.com:80/article.php?sid=1577"

[[comments]]
