[[comments]]
order = 63
subject = "اخترناة ومشينا وراة"
author = "وطنى"
posted = "2006-11-22"
text = "عيب يا جماعة انتم مش حاسين بالديمقراطية ولا اية طب هقولكم روحو كدة اى مصلحة وحاول تخلص ورقك من غير متدفع شوف اية اللى هيحصلك هتلاقي بكل ادب راح ملففك البلد كلها ودى اسمها الديمقراطية الرياضية روح اى قسم ومثلا انسى البطاقة هتلاقية بكل ذوق يخيرك تحب تضرب ولا... ولك حرية الاختيار ودى اسمها ديمقراطية البوليس المصرى المحترم اللى بيدافع عن حقوقنا واموالنا وكرامتنا واوعى حد يقول حاميها حراميها ولا قولك بلاش حتى في بلدك سافر برة واقول انك من مصر هتلاقيهم بردو صدرولك الديمقراطية في اي بلد بتروحها لانهم عارفين انك في بلد ديمقراطى ومتقدرش تعيش من غير ديمقراطية ..........عمار يا مصر"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215114157/http://masr.20at.com:80/article.php?sid=201&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 64
subject = "حلم خير اللهم اجعلو خير"
author = "وطنى"
posted = "2006-11-22"
text = "امبارح واللة يا جماعة حلمت حلم غريب قال اية الرئيس المصرى والسعودى كان بيتقابلو في حتة وفجأة واحد حاول يغتال الرئيس حسنى فضربة اول ضربة بالمسدس ممتش فراح ضربة بقذيفة ممتش راح مولع فية راح ميت واللة يا جماعة هو دة الحلم تقريبا حد يقولى دة حلم ولا حديث نفس"
archived = "2006-12-15"
