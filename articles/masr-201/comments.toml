subject = "حيره في حيره وايام طويله"
author = "حمدي"
posted = "2006-04-26"
text = "طبيبي يا طبيبي انت فين<br />حبيبي يا كابوس عشت انا عمري قرفان وياه<br />لو اغمض عيني واصحي ما الاقيك هنا<br />للحكم نهايه وانت بقالك 25 سنه<br />حيره في حيره وايام طويله بصبر عيني اللي طالعه في عهدك<br />شايف رئيسي في قربك بيجري لي ايه<br />دائما في بالي وبعد الليالي قرفني ياغالي انت وجمال<br />انت اللي لايق عليه الخصام وانت اللي ما خلصت فيه الكلام"
