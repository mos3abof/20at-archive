[[comments]]
order = 0
subject = "خد عندك يا سيدى"
author = "عابر القارات"
posted = "2006-04-19"
text = "خد عندك يا سيدى :<br />1- \"كداب يا خيشه كداب قوى ده أنا كنت فاكرك فهلوى\" للموسيقار خالد الذكؤ شعبان عبد الرحيم<br />2- \"و مهما توعدنى هأقولك بكرة و يجى بكرة أقولك بكرة يعنى النهارده بقولك لأه و بكره برضه مش راح أقولك أه\" للفنانة الجميلة عفاف راضى<br />3- المواطن المصرى بيغنى \" فى يوم فى شهر فى سنة تهدى الجراح و تنام و عمر جرحى أنا أطول من الأيام\" للعندليب<br />4- الشعب الغلبان بيغنى\"الأمل لولاه عليا كنت فى \"حكمك\" ضحية\" لكوكب الشرق<br />5- الشعب الغلبان بيغنى \"حيرت قلبى معاك و أنا بدارى و أخبى قولى أعمل إيه وياك و لا أعمل إيه ويا غلبى\" برضه لكوكب الشرق"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113143/http://masr.20at.com:80/article.php?sid=201&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

