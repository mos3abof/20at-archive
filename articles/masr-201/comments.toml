posted = "2006-05-04"
text = "كده خدت اكتر من وقتك<br />ودي غلطتي اني انا صدقتك<br />طلعت مش طيب ابدا بتغش علشان مصلحتك<br />على كل حال كتر خيرك<br />ومسيري ها القى رئيس غيرك<br />بقى تبقى ذاللني واحبك يعني ها اجيب الحب منين<br />لا ده مهما كان انا زى زمان ولا انت نسيت انا مين"
