[[comments]]
order = 2
subject = "قوم يا مصرى"
author = "نمر من ورق"
posted = "2006-04-20"
text = "يا شعب مذلول و دلدول و مش فالح غير فى الكلام و الهتافات و تفريغ الشحنات على صفحات الانترنت ... قوم يا خانع يا خاضع يا خرنج من قعدتك على القهاوى و على الكراسى قدام الكمبيوتر قوم و قول للحاكم بتاعك إنتا ظالم و كفياك ظلم لحد كده قوم يا اللى بتغنى إخترناك و زفتناك رضيتم بالخنوع و العجز و بقيت زى القوادين بتصهين على الدعارة اللى شايفها عينيى عينيك و شايف الحاكم بتاعك نازل إغتصاب فى بلدك و بلدك بتصرخ و بتستغيث بيك و إنتا إبنها و برضه عامل نفسك مش شايف و لا كأن اللى بيغتصب بلدك هو برضه اللى بيغتصبك و بيديك على قفاك فى الرايحه و الجايه و واضح إنك خلاص إتكيفت و عاوز كمان ... إتفو عليك ما طلعتش من صلب أحمس و لا عرابى و لا الرجاله فى ثورة 19 ... طلعت إبن حرام و لقيط"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113143/http://masr.20at.com:80/article.php?sid=201&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "الى صاحب التعليق اللى فوقى"
author = "مسلمه"
posted = "2006-04-20"
text = "لا اله الا الله<br />ايه ده انت نازل فى المصريين شتيمه<br />ازاى عايز تفوق الناس كده وتقول قوم يامصرى<br />انت كده زى الام اللى بتصحى ابنها وبتقوله اقوم كتك خيبه انت مش نافع<br />هو كده محدش اصلا هينفع<br />المفروض الناس تتكلم بالحسنى<br />\"من كان يؤمن بالله واليوم الاخر فليقل خيرا او ليصمت\"<br />اللهم انتا فى الدنيا حسنه وفى الاخرة حسنه وقنا عذاب النار"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113143/http://masr.20at.com:80/article.php?sid=201&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

