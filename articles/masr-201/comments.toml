posted = "2006-12-19"
text = "كان فى تعليق بواسطة زميل كفاح اسمه حسام على يسأل اذا كان حد شاف فيلم:<br />v for vendetta<br />ايوه أنا شوفته..الفيلم ده خرافى و بيلخص اللى بيحصلناو بيحصل لكل الشعوب المحكومة بشوية مستبدين لا يفقهون فى البطاطس.. بس الحكومة اللى فى الفيلم كانت شبه الحكومة النازية كده أى نعم مستبدين بس البلد قوة عظمى.. بلد نظيفة من غير(نظيف باشا) و رغم كده حصلت ثورة... ايه رأيكوا بقى فى الفساد الوسخخخخخخخخخخخ اللى احنا عايشين فيه؟ و بناكله و بنشربه و .. و لا بلاش ."
