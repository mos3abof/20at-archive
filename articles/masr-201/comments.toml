posted = "2006-05-14"
text = "مش عارف اقولكم ايه بس انا هحاول اكون منطقى على بقدر الامكان<br />انا زى ملايين الشباب اتخرجت وحلمت بحياه كويسه انا لا بتاع كلام ولا ثورات ولا حاجات من دى كل اللى كنت بطليه انى ( اعيش )<br />طلعت لا لقيت وظيفه ولا تقدير ولا احترام ولا اى حاجه ........ كل اللى عملته انى سافرت ايوا بعدت عن مصر وبرضه باختصار لقيت كل اللى بحلم بيه<br />تفتكروا دى بلد ممكن الواحد يعمل عشانها حاجه وبلاش مزايده على الوطنيه لانى بحب مصر لكن بكره اللى فيها<br />ممكن حد يحل المشكله دى ويقولى ازاى انا وغيرى نرجع مصر ؟"
