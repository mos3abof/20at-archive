[[comments]]
order = 56
subject = "اين انتي ياسيدتي ياحبيبتي"
author = "خليل الكردي"
posted = "2006-06-23"
text = "اين انتي يا سيدتي يا حبيبتي<br />شاخت كلمات الحب .. ياسيدتي<br />شاخت الألف<br />شاخت الحاء<br />شاخت الباء<br />فقدت تاءات التانيث بكارتها<br />ولم تعد نون النسوة<br />تدر حليبا<br />كل شيئ<br />تساقط كالورق اليابس<br />على أرض مخيلتى<br />كل خواتمك<br />كل مكاحلك<br />كل قبعاتك الصيفية<br />كل صرعاتك الهيبية<br />تحولت الى فتافيت خبز<br />أكلتها العصافير..<br />أخبريني يا سيدتي<br />ماذا يفعل العاشق بزجاح القلب<br />حين ينكسر ؟<br />وبالشهوة حين لاتشتهي ؟<br />وبالصراخ حين لا يصرخ ؟<br />وبالعشق حين لا يعشق ؟<br />نحن مختلفان فى كل شيئ<br />أنت متمسكة بموسيقي خلاخيلك<br />و أنا متمسك بموسيقي حريتي<br />أنت من حزب الوسط<br />وانا من حزب الحرية<br />انتي مقيمة فى النصوص<br />وأنا مهاجر منها<br />انت ملتزمة بسلطة القبيلة<br />وأنا ضد جميع السلطات<br />أنت جزء من التاريخ<br />وأنا لا تاريخ لى<br />يا التي كنت تملأين الدنيا<br />وتشغلين الناس<br />ماذا فعل بك الزمان ؟<br />ماذا فعلت بنفسك؟<br />كيف تحولت من بطلة شهيرة<br />الى فتاة كومبارس ؟<br />ومن رواية كلاسيكية عظيمة<br />الى مقالة صحفية<br />ومن عمل تشكيلي<br />الى عمل لا شكل له<br />ومن امرأة تشعل الحرائق<br />الى امرأة تحت الصفر<br />أيتها الفينيقية<br />التي تاجرت بكل شئ<br />وخسرت كل شئ<br />لماذا لا تعترفين<br />بأن ثوراتك كلها<br />كانت على الورق<br />وعواطفك كلها<br />كانت من ورق<br />ومراكبك كلها<br />كانت مصنوعة من ورق<br />اختلفت طموحاتنا يا سيدتي<br />فأنا ذاهب الى يسار القصيدة<br />وأنت ذاهبة الى يمينها<br />أنا ذاهب باتجاة البحر<br />وأنت ذاهبه باتجاة الجاهلية<br />أنا ابحث عن حجر الفلاسفة<br />وأنت تبحثين عن أحجار الزمرد والياقوت<br />أنا أبحث عن عناوين الريح<br />و أنت تبحثين عن باب المحكمة الشرعية"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113143/http://masr.20at.com:80/article.php?sid=201&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

