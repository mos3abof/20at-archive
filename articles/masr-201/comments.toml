[[comments]]
order = 19
subject = "فى الجون يا عابر القارات"
author = "نيفين"
posted = "2006-04-27"
text = "تعليقاتك بتعجبنى بس المره دى ف الجون<br />حلوه كداب يا خيشه دى<br />و انا متهيالى ان الشعب الصابر يوم ما يغنى هيقول طيب يا صبر طيب<br />و كل مواطن انخدع و ادى صوته للراجل اللى ف الصوره فوق هيقول غلطه ندمان عليها<br />و الدول العربيه لما تغنى للشعب المصرى هتقول ظلموه<br />و سرقوه<br />و نهبوه<br />و قتلوه<br />مع الاعتذار للعندليب"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113143/http://masr.20at.com:80/article.php?sid=201&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

