capture_url = "https://web.archive.org/web/20060907113143/http://masr.20at.com:80/article.php?sid=201&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 17
subject = "تحت الشجر يا وهيبة"
author = "sara"
posted = "2006-04-27"
text = "كداب يا خيشة كداب قوى بعد كدة اغنية كداب لانوشكا ثم اغنية تتقال له فى عيد ميلاده تقول غنوا لكلب الليل سنة حلوة يا جميل سنة حلوة يا سنسن يامسمسم يا جميل كلنا ندعيلوه هنا ونغنيله عربية تشيلوا عربية تشيلوا ولا نعرفله طريق ومن الامثال حجة البليد مسح الصبورة , حاميها حراميها, سبحان العاطى الوهاب بعد الشبشب والقبقاب واغنية تتقال لمبارك وسوزان فى عيد جوازهم بتقول \"تحت الشجر ياما اكلنا برتقال \""
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113143/http://masr.20at.com:80/article.php?sid=201&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

