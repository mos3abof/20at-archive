[[comments]]
order = 30
subject = "سنخوض معاركنا معهم"
author = "خالد المصرى"
posted = "2006-05-08"
text = "سنخوض معاركنا معهم وسنمضى جموعا نردعهم على فكره انا مش بغنى للمجاهدين فى فلسطين ولا فى العراق ولا فى الشيشان انا بغنى للجهاد فى مصر اه اوعى حد يستغرب اصل مصر وجب عليهاالجهاد فعلا ضد جيوش الامن المركزى الغازيه وكتائب امن الدوله وميلشيا وزاره الدخليه وانا عن نفسى بعلن ان احنا انشاءنا تنظيم المولعين بجاز وان عدد كبير من الاستشهاديين جاهزين لتنفيذ عمليات حرق جماعى لنفسهم علشان الريس ينبسط ويتبط هوه والمدام بتاعه العيال (لسه بتاكل عيال مبطلتش )وبدات كثائب الاسير ايمن نور فى التحرك لاسقاط النظام الفاسد وميليشيا الاسير عبود الزمر فى التحرك ايضا (شوفت التحركات شديده ازاى وشك يعنى ) وفى النهايه صحيت من النوم لقيت انى مش متغطى فعلا مش متغطى ولا عمرى اتغطيت لانى معيش اشترى لامؤخذه ملايه اتغطى بيها"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113143/http://masr.20at.com:80/article.php?sid=201&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 31
subject = "يااابشر"
author = "باتستوتا"
posted = "2006-05-08"
text = "عايزين تبقوا رجاله فعلا كفاية كلام فى كلام كفاية انقسام بينكم.<br />فكرة جميلة جدا وسلهة وغير مرهقة ولكن حاولوا قدر الامكان الا يراكم احد ممكن يطلع امن دولة .<br />تسيرليلا وعندما تجد صورة لمبارك تمزقها او تلوثها تكتب على حوائط الشوارع عبارات حماسية للبشر الخانعين تشجعهم وتزيل من قلوبهم الرهبة مثل \"يسقط مبارك وكفاية فساد واللهم خلصنا من الطاغية المستبد وهكذا بهذا تكون قد لسهمت فى فعل شئ وشكرا"
