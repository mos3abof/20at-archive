[[comments]]
order = 46
subject = "احكيلكم حكاية غريبه"
author = "احمد صالح"
posted = "2006-05-20"
text = "كان يا مكان في يوم 29-11-2005 قبل يوم الإنتخابات بيوم كنت في المحل اللي انا شغال فيه ... الوقت بعد العصر .. جالي حوالي 20 شخص منهم ظابط في امن الدوله ورئيس قسم المباحث في المركز علي المحل والكل لابس ملكي دخلوا عليا المحل .. فين صاحب المحل ( الظابط ) مش موجود اسمك ايه قلتلو اسمي .... اه انتا ابن الأستاذ .... طيب ياالا تعالا معانا قلت حاضر هقفل المحل ( المحل اتبهدل بهدله ) نزلوا الحاجه معايا نزلوها والبنى ادمين اللي قدام المحل واقفين يتفرجوا عليا وفتحين بقهم استنه حد يتكلم .... سكوت .. طيب قفلت المحل سريعا وجدت المحامي بتاعي هو بيته جمب المحل نزل سريعا وقاله علي فين ياباشا قلب ابعتلي ابوه او صاحب المحل وخمس دقايق بالظبط وهيكون في البيت ... اتاري البيت ده .. ( معتقل برج العرب ) 55 يوم مش 5 دقايق اترحلنا انا والناس الساعة 11 علي معسكر قوات الأمن ومن هنا ويوم السبت الساعة 9 الصبح اصح ياللا علشان هتترحلوا واترحلنا علي برج العرب وقعدنا هناك 50 يوم بالتمام والكمال وشكرا ادي الحريه ذنبي ايه .. اني ابن راجل صالح ومبيسبش ركعه ربنا يجعله في ميزان حسناتنا"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113143/http://masr.20at.com:80/article.php?sid=201&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

