[[comments]]
order = 8
subject = "اللى مش عاجبه"
author = "مواطن مصرى"
posted = "2006-04-20"
text = "الى أختى مسلمة و الى الاخ الذى وصفنى بالقبيح (شكرا) على أى حال و كل إناء بما فيه ينضح ... اللى ما فهمش و مدروش و اللى عامل فيهاوطنى بس على صفحات الانترنت ... أنتم يا إخوانا دفنين رووسكن فى الرمل و كل واحد عامل فيها مناضل و أخره إنه مناضل بالكيبورد و يكتبله كلمتين قبل ما ينام و هوه بيرد على إيميلاته و أهه كله من باب الوطنية .. أقولكم يا أخوانا أنتم مش عاوزين تشوفوا الحقيقة المرة و أنا ما كتبتش الكلام ده الا من يأسى و إحباطى اللى حسيت بيه و عاوز أسألكم أنتم مشيتوا فى مظاهرات و نزل على جتتكم البلا من عصيان الامن المركزى و أتكسر دراع واحد فيكم على الاقل أو فى بنت منكم (و الكلام للاخت مسلمة) قطعوا هدومها و هتكوا عرضها قدام مئات البشر اللى واقفين يتفرجوا .... إنتم حاسيين أصلا ايه اللى بيدور فى البلد من تدهور أخلاقى و إجتماعى و ثقافى و دينى و سياسى سببه الفقر و الفساد و البطالة و لا كل واحد فيكم أبوه لبصرف عليه و مش حاسس بحاجه و أهه بيقول كلمتين على النت من باب انه ماشى مع الرايجه و مايصحش إنه يدخل النت و ما يكتبش كلمتين ... أنا بقى يا أخوانا مشيت فى المظاهرات و أنا بقى يا أخوانا أتبهدلت و أتسبيت بأمى و أبويا من عساكر أمن مركزى جهله و اللى بيحركهم ظباط أكثر منهم جهلا و أنا بقى شفت بعينيا دول بنات بتتقطع هدومها فى الشاعر قدام اللى يسوى و اللى ما يسواش بإيدين بلطجيه و تحت سمع و بصر لواءات و أنا بقالى تلت سنين مش لاقى شغل مع إنى المفروض ناجح فى بكالوريوس التجارة بتفوق و أكبر ماهيه ممكن أخدها حاليا هيا 300 جنيه كعامل فى سوبر ماركت و بعد ده كله مش عاوزين أكتب و أسب و العن فى أبو سلبية الناس اللى وصلتنا لكده و على رأى أختنا مسلمة \"أروح أصحى إبنى و أقوله قوم يا روح أمك قوم يا حبيبى قوم يا<br />اقرأ بقية التعليق .."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113143/http://masr.20at.com:80/article.php?sid=201&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 9
subject = "اللى مش عاجبه - الجزء الثانى"
author = "مواطن مصرى"
posted = "2006-04-20"
text = "يا دلوعة أبوك\" إذا كان ابنى صاحى و مغمض عينيه و إذا كان راضى بالفشل و النوم و إذغ كان شايف زمايله متفوقين و صاحيين لحالهم و هوه مبلط فى الخط و عامل نفسه نليم يبقى مش برضه من الهبل و السذاجه إنى على رأى نانسى عكرت \"أطبطب و أدلع\" مش برضه ممكن الاب أو الام يضرب إبنه (و الكلام للأخت مسلمة) علشان مصلحته و علشان يصحيه من سباته العميق و يقوم يذاكرله كلمتين بدل ما هو فاشل فى كل حاجه حتى فاشل فى إنه ياخد حقه ... و الى الاخ مواطن مصرى اللى وصفنى بالقبيح الله يسامحك فواضح إنك من مناضلى الكيبورد و ياريت بقى يا دكر يا سبع رجال ما تتشنجش قوى كده و ترفص و تهدى أعضاءك علينا شوية و يا ريت نشوف تشنيجك ده فى مظاهرة و لا فى حق أخدته و لا دافعت عن حق إتاخد منك مش بس كلام و فين الرقابة و فين مش عارف إيه"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113143/http://masr.20at.com:80/article.php?sid=201&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

