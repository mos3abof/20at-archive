subject = "للاخ القبيح"
author = "مواطن مصري"
posted = "2006-04-20"
text = "الاخ اللي نازل شتيمة في المصريين اراهن انك لست مصريا لان المصري لا يشتم اخيه المصري على صفحات النت<br />شوية احترام يا اخ لانك فعلا بذيء اللسان وتهين كل المصريين اللي اكيد في يوم حيكون ليهم رد فعل وحيصحوا من غفوتهم ومافيش داعي للشتيمة وقلة الادب<br />وياريت نتعلم ازاي يكون فيه اسلوب للحوار والا مش ح دخل على الموقع ده تاني<br />الناس حصلها اية وانتوا يا بتوع الموقع فين الرقابة وازاي تسمحوا لحد بشتيمة كل المصريين<br />اللهم اسالك الهداية"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907113143/http://masr.20at.com:80/article.php?sid=201&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

