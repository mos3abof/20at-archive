subject = "اخوي يا احلا هداف"
author = "اسيل عتال"
posted = "2006-06-16"
text = "انشاء الله يا اخوي بتمنالك النجاح انشاء الله ونشكر كل من علق علي الخبر واحلي فهد يا اخي وتحيه من كل دار العتال لاحلي ابن في العيله ونتمنا لك التفوق الدائم يا رب وتحيه من نائل عتال وصائب عتال لاحلي فهد عتال وانشاء الله هداف العالم علي طول"
archived = "2006-11-02"
