author = "عبدالله مرداوي عاشق الادزوري"
posted = "2006-06-16"
text = "فهداسم علي مسمي احلي فهد حبلاوي اصيل بنتمنالك النجاح انشاء الله في المحافل الدوليه القادمه والنجاح مع نادي الوحدات وانشاء الله هداف العالم علي طول والله ايخليك لاهلك وينجحك"
