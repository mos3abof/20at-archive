[[comments]]
order = 2
subject = "بيان شعب مصر لشعب لعراق"
author = "مناضل أنترنتى قديم"
posted = "2006-04-17"
text = "السلام عليكم ورحمة الله و بركاته<br />من شعب مصر العظيم الموعود بالمتخلفين عقليا شويه فى المنيا و شويه فى الأسكندريه نعتذر عن تصريحات الكبير اوى أبوجمال بيه و علاء بيه والتى قالها فى حق شعبنا المرابض فى العراق و نحن إذ نعتذر عن هذه التصريحات حيث ثبت بعد التحرى أن صاحب هذه التصريحات مختل عقليا"
archived = "2006-04-23"
capture_url = "https://web.archive.org/web/20060423183007/http://masr.20at.com:80/article.php?sid=169"
