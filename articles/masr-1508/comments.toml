[[comments]]
order = 2
subject = "بداية صراع بين منير اديب وشريف الدواخلي"
author = "دايما متألقة يا اميره !"
posted = "2007-01-30"
text = "أرسل هذا التعليق بواسطة : شريف الدواخلى<br />اللقطه مبدعه يا اميره والحوار تحفة فنيه ... ورد كلام العجوز لتصريحات مبارك احلى ما فى الموضوع ... يعنى الموضوع 10 على 10<br />30/01/2007<br />برافو يا أميره<br />أرسل هذا التعليق بواسطة : منير أديب<br />فعلا برافو يا أميره ، الموضوع أكثر من رائع ، وأفضل ما أعجبني فيه اللغه الجميله والحوار الممتع بينك وبين العجوز وبين العجوز وأبنها ، علاوه علي الحس الصحفي المتيقظ فيك والذي جعلك تقفين لمتابعة ما يحدث بين هذه الأمه وفلذة كبدها ، بل تصلينا إليهما، لتعرفي المشكله، ومن ثما تعليقينا عليها ، بصراحه الموضوع يستحق أن نرفع القبعات عالية تحيه لكي ولما كتبته، وأنصحك بالبعد شوية عن كتابات الإخوان والإسلام السياسي ، وياريت تدور علي هموم المواطن العادي ، لنك بالفعل أبدعتي في هذا الموضوع ، ربما لحسك المرهف بهم رجل الشارع العادي ، وربما لأن الكتابه في هذا المجال تستحويك ، المهم المحصله واحده ، أن فعلا قلمك حلو في هذه الموضوعات ، ياريت متدفنيش نفسك ، وتستمر في هذا النوع من الكتابه<br />30/01/2007"
archived = "2007-02-10"
capture_url = "https://web.archive.org/web/20070210135904/http://masr.20at.com:80/article.php?sid=1508"
