subject = "خلى الهم يضحك"
author = "حسن الجمال"
posted = "2007-01-29"
text = "ضحك هم ورقص هم<br />لم جراحك لملم لم<br />ارقص حبه واعمل زوربا<br />وامسح دمعك والا تهتم"
