[[comments]]
order = 3
subject = ""
author = "مفيش شغل فى الحكومة"
posted = "2009-07-12"
text = "دة كلام صح<br />ومفيش شغل خارج الحكومة كلام صح<br />طيب نشتغل فين<br />نسرق<br />نقتل يا عم نظيف<br />نفك قضبان السكة الحديد علشان نبيع حديدها لتجار الخردة<br />والا نقطع كابلات التليفون ونبيعها لبتوع الخردة برضة علشان نعرف نصرف ونعيش<br />مش هو دة اللى حاصل<br />اللة يخرب بيوتكم حكومة فاشلة<br />بقى محطات المية اللى هى كم طرمبة ومحطات المجارى فى القرى هى دى التنمية بتاع الحكومة<br />خليكوا قاعدين لغاية البلد ما تنفجر والناس تقتل بعضها فى اشوارع وبعدين تحكموا عليهم بالاعدام"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713154533/http://www.20at.com:80/masr/2khbar/12624-2009-07-12-10-56-37.html"

[[comments]]
order = 4
subject = ""
author = "صدقت يا نظيف"
posted = "2009-07-12"
text = "فعلا صدق نظيف في هذه المقوله<br />كما نصح نظيف الشباب بعدم الالتفاف إلي‮ ‬السلبيات التي‮ ‬ينشرها الإعلام حتي‮ ‬لا‮ ‬يشعروا بالاحباط كما اتهم رئيس الوزراء وسائل الإعلام بعدم تسليط الضوء علي‮ ‬ايجابيات الحكومة والاهتمام فقط بالسلبيات<br />اعلام فاشل اعلام رخيص اعلام اثاره فقط<br />وذلك لانه يتحكم فيه غير المتخصصين"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713154533/http://www.20at.com:80/masr/2khbar/12624-2009-07-12-10-56-37.html"
