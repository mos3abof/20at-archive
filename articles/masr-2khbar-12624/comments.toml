subject = ""
author = "دماغة ابيض يا ورد"
posted = "2009-07-12"
text = "شفت لقاء فى التليفزيون فى البيت بيتك مع المدعو نظيف<br />صدقونى اصبت بالذهول<br />واللة العظيم لو البلد دى مسكها معلم بياض او معلم محارة او بياع فراخ هيتكلم احسن من الناس دى وهيبقى كلامة موزون<br />يا جماعة مفيش<br />دى فرحان خالص بالانجازات الرهيبة اللى هى انة بيوزع ازازة زيت تموين وكيلو سكر وكيلو ارز على 60 مليون مصرى تحت خط الفقر وانة بجلالة قدرة اضاف عشرين مليون مصرى الى الفقراء بتوع التموين<br />وشوية شوية هيبقى انجازة القادم توزيع الزيت والسكر على 80 مليون مصرى اللى تحت خط الفقر"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713154533/http://www.20at.com:80/masr/2khbar/12624-2009-07-12-10-56-37.html"

