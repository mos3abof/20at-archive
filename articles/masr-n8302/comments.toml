[[comments]]
order = 2
subject = "يا اهلا بالموز ......"
author = "اللي فوق دي ."
posted = "2006-05-24"
text = "\" طفي النور يا بهيه \" دي الكلمه اللي حضرتك قولتهالي اخر مره لو حضرتك \"واحد تاني \".<br />الغريبه اني قولت مش عايزين نشوف الواحد \"فاي \" بعديها اختفيت فعلا,<br />ليه يا بت قفلت البلج بتاعك عشان اتعرضت لمضايقات اولها ان ماليش خبره في حكايه البلجات دي وتلقيني بخبط في الحلل وانا اساسا هبله في الكمبيوتر وعملت البلج دي بالصدفه مش عايزه اقول اني مكنتش اعرف بالضغط علي اسم الشخص تخش البلج بتاعه , المهم ايه يا سيدي بعد ما اكتبت عن الايميل بتاعي لقيت بشر كتيره عايزه تضيفيني , الووووو مين حضرتك معرفش , السبب التاني بقي افضل الاحتفاظ بيه , واخيرا سوال جامد اووووووووي<br />هو فين الواحد التالت ؟؟؟؟؟؟؟؟؟؟"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906101224/http://masr.20at.com:80/article.php?sid=364&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

