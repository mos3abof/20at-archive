[[comments]]
order = 0
subject = "كدا البيئه ولاه .....بلاش"
author = "هوووووووبه , مش شغلك وهبهوب سابقا"
posted = "2006-05-23"
text = "والله يا عجم يا بني انت كدا جبت\" البيئه \"اللي علي اصولها , فكرتني وانا عامله زي الهبله بتخانق عشان اشوف الحنه في الشارع والاغاني الكميله دي\" بس اموت واعرف الست اللي كانت شايله الحنه علي راسها والبتاع اللي الشفاف دا ما بيتحرقش ليه ؟؟\" ,و فيها ريحه بكاروالمندره و البرسيم كمان يا خراشي ياني\" ان هدا لكثير وخدالي بالك يا نوفا \",<br />و\"كان يا ما كان \" بيتين شعر حلوين اهو بهديهم للي في بالي .<br />و اة و يا فرحة قلبي<br />كنت طير و صبحت مراكب<br />بجناحين و حملت حبايبي<br />يا هنايا في ريح النيل<br />و ابتسام الفجر دليل<br />يا حياتي و سر حناني<br />لما افتح لك انا احضاني<br />كل شط يلاقي التاني<br />و العطاشي يلاقوا سبيل<br />و الليالي تقول لك اة<br />اة و اة و يا فرحة قلبي........<br />كل شط لقيتة طارح حلم بكرة و حلم امبارح<br />و القلوب كلها تتصالح<br />في الغناوي و المواويل<br />الي تعلي معاها الاهة<br />اة و اة و يا فرحة قلبي........<br />والله انا بقالي قرن بتحايل علي الموقع دا ان حد يسمعنا زغروده مش راضين , اسمعكوا انا لووولوووووووولووووووووي قطعت نفسي يا جدع ."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906101224/http://masr.20at.com:80/article.php?sid=364&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

