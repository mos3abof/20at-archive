subject = "يا مي"
author = "زعبله السادس عشر"
posted = "2007-01-25"
text = "يا مي اهنمى بنفسك شوية<br />واعملى مكياج تقيل شوية<br />اكتبى عن الطبيخ وتربية العيال وكتاب ابلة نظيره<br />يمكن واحد يتهف فى مخة ويتجوزك<br />مالك ومال الاشاعات<br />دا ملك ومنظمة صاحبة<br />ابعدى عن المواضيع دى<br />ولا اقول لك<br />اكتبى عن البخت<br />وياريت البخت الاسود"
archived = "2007-01-27"
