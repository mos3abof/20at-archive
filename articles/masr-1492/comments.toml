[[comments]]
order = 2
subject = "موضوع مكتبى جدا !!"
author = "شريف الدواخلى"
posted = "2007-01-25"
text = "انا مش عارف اقول ايه بس<br />بس انا مش متعود انه اقرأ حاجة ويتحرق دمى بيها ومش اعلق<br />الموضوع صراحة فكرته حلوه وديه يمكن الميزة الوحيدة لان التنفيذ سئ جدا جدا<br />ونمسك حاجة حاجة<br />1- الموضوع كله معمول كده \" بالفهامة يعنى \" يعنى مفيهوش سطر واحد حسيت ان صاحبه الموضوع تعبانه فى معلومة فيه<br />2- انتى عماله تتكلمى عن الاشاعات طيب بالله عليكى انتى تعرفى معنى مصطلح اشاعة<br />\" كان المفروض يااستاذه تاخدى راى استاذ متخصص فى الدعاية عشان الاشاعات احد تكنيكات الدعاية<br />3- ضرورى جدا انك كنتى تاخدى رأى دكتور علم نفس يحلل نفسية ضعاف العقول الذين تستهواهم الاشاعات<br />4- انتى ماتعبتش نفسك ورجعت للارشيف عشان تعرفى الوقائع المشابهم كخلفيه لموضوعك<br />وأخيرا ... كان لازم تلفتى النظر لوجهة النظر القانونية فى موضوع الاشاعات ..بس هى جت على ديه"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127134113/http://masr.20at.com:80/article.php?sid=1492"

[[comments]]
order = 3
subject = "إشاعات إشاعات إشاعات"
author = "إشاعات إشاعات إشاعات"
posted = "2007-01-25"
text = "Submitted by عبدالله النديم on Wed, 22/02/2006 - 00:54. من الحياة<br />إلى الشعب المصرى القاطن على نهر النيل, لاتشرب المياه, المياه بها انفلونزا<br />فى ثوانى انتشرت تلك الصيحة, ولاقت صدى, عرفت كدة بعدما اكتشفت اختفاء امبريال من على الخريطة, رحت كعادتى السيئة اشترى شيكولاتة من البقال, باكل شيكولاتة كتير جدا لدرجة انى حاسس انى هموت بالقلب قريب, قال ايه ياسيدى لقيت الناس ملمومة وكله بيشخط ويزعق ويهتف عايز كرتونة مياة, هاتلى كرتونة مياه, سألت لانى حشرى زى مانتوا كلكم عارفين, قالولى المياه فيها انفلونزا, رديت عادى يعنى اشاعة والحكومة كذبت, وبعدين هى هتحوق معانا ماحنا عايشين فى ظل وباء عام اسمه حكم مبارك ومبيدات والى ولا حصل لنا حاجة<br />وانت بتصدق الحكومة يا استاذ, رد حاج طيب واقف جنبى, قلتله: يعنى ساعات بصدق, انما على حد علمى ان المرض ما بينتقلش الا بالاختلاط بالفرخة, حاجة كدة زى العشرة بينك وبينها يقوم يطلعلك ريش<br />التفت لم يكن مهتما بالسماع كان مهتما بالكرتونة وهى بركة ولاحياة, مش عارف ايه الفرق, اشتريت الشيكولاتة , واكتشفت خناقة على سعر الكرتونة, هى بخمستاشر ولا بعشرين, انا طبعى حنفى , اى بشرب من مياه الحنفية, فما مش عارف هى اساسا بكام<br />التفت خارجا كانت هناك سيدة عجوز واقفة على الباب سمعتها تقول رزق الهبل على المجانين<br />رزق الهبل على المجانين, لخصتها تلك السيدة, رزق الهبل الذى رفع سعر الكرتونة وغرق الفراخ فى النيل, وجعل عامل البوفيه عند عمرو عزت يغلق البوفيه ويقول لهم انفلونزا يا باش مهندسين<br />وماشيا فى الشارع اغنى<br />اشاعات اشاعات اشاعات<br />اشاعات اشاعات اشاعات<br />بيقولوا فيه فرخات<br />ميتة فى الميات<br />اشاعات اشاعات<br />فتحت بيت ناس اشاعات<br />اوقفنى احدهم, تخيلت ان يسألنى عن بطاق<br />اقرأ بقية التعليق .."
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127134113/http://masr.20at.com:80/article.php?sid=1492"

