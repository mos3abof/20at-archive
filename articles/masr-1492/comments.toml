subject = "بمناسبة التنكر"
author = "بجوار مستشفي اليوم الواحد فيه مدرسه وبعد الاشاعة ييجي بيومين لاقيت زحمة علي باب المدرسة كان فيه امتحانات .واولياء الامور ملمومه حول راجل شكله مهم عرفت في الاخر انه ضابط"
posted = "2007-01-24"
text = "المهم الضابط قعد يحلف ان ما فيش حاجة اسمها سفاح ولا حاجة وقعد يطمن اولياء الامور في منتهي الادب والوعي بالموقف الامني بجد مش هزار لكن المفاجئة الكبيرة انه يا دوب قدر يقنع الناس انها اشاعه واذا بسائق العربة جاي من بعيييييد وفي يده دوسيه مكتوب عليه بالقلم الاسود العريض ( سفاح المعادي ) وقال له \" انت نسيت الورق ده يا باشا\"<br />طبعا الراجل اتكسف ودخل المدرسة جري والله اعلم عمل ايه في السواق"
archived = "2007-01-27"
capture_url = "https://web.archive.org/web/20070127134113/http://masr.20at.com:80/article.php?sid=1492"

