subject = "/"
author = "النرجسية هو مرض عشق الذات و المصاب بة يعانى من إضطراب فى السلوك و الشخصية لإن عشقة لذاتة يؤثر على عملة و على علاقتة مع الأخرين إذ أن ذاتة أهم من كل الأخرين و من كل شىء أخر. و معظم الأمراض العقلية و النفسية الخطيرة عادة ما تكون مصحوبة بمرض النرجسية. الشخصيات عدوة المجتمع(السيكوباتيون) من أمثال نيرون و ستالين و هتلر و مبارك و زوجتة سوزان يعانون لذلك من النرجسية أيضا. ستالين السفاح الذى سفك دماء 20 مليون سوفيتي ليظل يحكم الإتحاد السوفيتى 30 سنة بالحديد و النار كان شكلة قبيح و قزم و ضعيف البنية إلا إنة كان يقدم نفسة لشعبة من خلال الصور الممنتجة على إنة عملاق و ذو ملامح شابة و قوية لا تلين و لا تهزم بهدف إخافة الشعب و ترويعة. صورة ستالين المبينة و هى صورة ممنتجة لا تعكس الوجة الحقيقى لستالين هى التى كانت تنشر فى وسائل الإعلام السوفيتية طوال فترة حكم ستالين بناء على أوامرة للترويج لفكرة ستالين القوى. و بالرغم أن مبارك و ستالين سفاحين إلا أن الفارق بينهما يكمن فى أن السفاح ستالين حول روسيا من دولة زراعية متخلفة الى دولة عظمى فى أقل من ربع قرن بينما حول السفاح مبارك مصر من دولة واعدة ترتيبها ال 40 بين الدول الى دولة متخلفة متدهورة مفلسة بلا حاضر أو مستقبل ترتيبها ال 140 بين باقى الدول فى أقل من ربع قرن. بنفس الإسلوب و لذات الأسباب أصدرت عيلة مبارك النرجسية السفاحة تعليمات الى وسائل الإعلام الحكومية و المأجورة بعدم بنشر أى صور \"لفخامة الرئيس\" و \"للسيدة الفاضلة\" سوى الصورتين المبينتين دون غيرهما على الرغم من أن الصورتين عمرهما حوالى ربع قرن. حسنى و سوزى لا يريدان الشعب أن يراهما و قد بلغ بهما العمر أرذلة و أسلمتهما المنون الى إنقطاع. إنهما لا يريدان الشعب أن يشاهد على وجهيهما علامات ا"
posted = "2006-08-10"
text = "اقرأ بقية التعليق .."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831091725/http://masr.20at.com:80/article.php?sid=785"

