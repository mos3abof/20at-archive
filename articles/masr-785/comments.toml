[[comments]]
order = 9
subject = "الفساد اصبح سرطان الان"
author = "ابو اسلام"
posted = "2006-08-11"
text = "انا مواطن عمرى 47 عام طول عمرى اسافر واقدح حتى ابنى مستقبل لااولادى بنيت منزل مكون من اربع طوابق وكنت اعيش انا واولادى فى المنزل فى الوراق وجاء المدعو حمدى عبد العزيز عامرواخوتة ببناء ثلاث ابراج سكنية بدون عمل خوازيق ولا دراسة ولا جسات للارض بارتفاع ثلاث عشر طابق مخالفين لكل قوانين البناء بناء على تقرير مركز البحوث والتفتيش على اعمال البناء من سنة 2001 وانا اقدم شكاوى لجميع المسئولينفى البلد اكثر من 200 شكوى وتلغرافات لرئيس الجمهورية حتى اصغر موظف فى محافظة الجيزة وقابلت محافظ الجيزة السابق المستشار محمود ابو الليل واصد قرارات ولاكن بدون تنفيذ ولا يوجد متابعة لتنفيذ القرارات وتم تحرير عدة محاضر ولا فائدة ويتم التحايل على القوانين وارسلت للرقابة الادارية مشكورة قامت بالمعاينة وتم ارسال القضية للنيابة العامة فى سنة 2003 وارسلت للنيابة الادارية وعملت قضية وارسلت للنيابة العامة بخصوص المسئولين فى مجلس مدينة الوراق وتم اخذ اقوالى فى النيابة منذ ثلاث سنوات والاى الان لم يتم عمل اى شيء لاان بناء هذة الابراج مخالفة تسببت فى اضرار جسيمة فى عشرة منازل ومنهم منزلى كثر فى الكمرات وشروخ نافذة فى الحوائط والعمدان وهبوط فى الارضية فى الاربع طوابق كل ذالك تم بالرشاوى داخل مجلس مدينة الوراق اصحاب الابراج معهم محامين يتحايلون على القوانين ويساعدوهم فى ذالك بتوع مجلس المدينة والى الان لم يتم التوصل لنتيجة وتركت منزلى خوفا من الانهيار على اولادى واسكن فى سكن قريب من المنزل واصحاب الابراج يعملو على محاربتى فى عمل محاضر كيدية لكى اكف عن الشكاوى واخرها هم واقارب لهم اتفقو مع جزار يتعامل معهم محلة امام العقار الذى اقيم بةقا م بالتعدى علية بالضرب هو وابية واخية وعندما استنجد بالشرطة التى هى فى نظر ال<br />اقرأ بقية التعليق .."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831091725/http://masr.20at.com:80/article.php?sid=785"

[[comments]]
order = 10
subject = "واللهى العظيم لو اتمله البحر المتوسط طماطم مش هتكفى الكوسه اللى بمصر"
author = "الكفران المخنوق"
posted = "2006-08-11"
text = "انا ولا مسطول ولا بطوح انا جاى اقول حاجه ومرح انا شاب لسه متخرج ومعايا تقديرا عالى وللاسف مفيش شغل ممكن اعرف بئى لما انا وغيرى من الشباب لما مش نلاقى شغل اذا احنا مفروض نلجاء الى السرقه وقطاع الطرق<br />واظن دى حاجه مش صعبه على اى شاب يمسك مطوه ويطلع على اى حد من ابوه حارمى وقلبوا وسعتها الشاب الخريج المحترم تحول الى مجرم بسبب البلد اللى هوه فيها متقولش الكلمه المعتاده بتاعت اى حد ال ايه (متقلش خد ايه قول ادتلها ايه) ودى حتت مقوله فاشله هندلها ازاى ومفيش شغل الشاب المصرى مستنى فرصت الشغل واكيد هيعمل وهيعمل وهيعمل شكرا<br />المضاء : واحد من الناس"
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831091725/http://masr.20at.com:80/article.php?sid=785"

