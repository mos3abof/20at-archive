[[comments]]
order = 4
subject = "6"
author = "تقرير عن الفساد في \"مصر المحروسة\""
posted = "2006-08-10"
text = "(نتحدى أى مسؤل أن يستطيع انكار أى من الحقائق المذكورة هنا)<br />1- فساد نجلى رئيس الجمهورية<br />يشارك كل من علاء و جمال مبارك على سبيل الرشوة و البلطجة بحصص مجانية تبلغ 50 بالمائة فى رأس مال كبرى الشركات التجارية و الصناعية بمصر و كان من نتيجة فرض هذة النسبة المرتفعة جدا على هذة الشركات أن هذة الشركات أصبح يتهددها خطر الافلاس و الانهيار وقد تم طرد نسبة كبيرة من العاملين بها مما أسهم فى زيادة نسبة البطالة و ارتفاع معدلات الكساد. و مما زاد الطين بلة أن جمال و علاء يفلسان و يطفشان من السوق من لا يدفع لهما و يستمر فى السوق مع ذلك و بكل بجاحة لينافس الشركات التى تعطى لهما حصة مجانية برأس المال مما أدى الى خروج الألاف من المستثمرين و رجال الأعمال الشرفاء الجادين من السوق و نتج عن ذلك توقف الإنتاج فى معظم الوحدات الإقتصادية بالبلاد و طرد العاملين بها مما أوصلنا الى الحالة الراهنة من البطالة الشاملة و هى نموذج لحالة إقتصادية إجتماعية سيئة لم يعرف العالم مثيلا لها منذ أزمة الكساد العالمى فى نهاية العشرينات من القرن الماضى. و بالرغم أن جمال و علاء شركاء ببلاش يعنى مش دافعين حاجة الا أنهما بسبب جشعهما لا يرحمان شركاءهما و لا يقدرا ظروف الكساد و يرفضا سماع أعذار و حجج فلا بديل عن دفع نصيبهم البالغ 50% و مش مشكلتهما إذا كان شركاءهم خسرانين و لا كسبانين. و من الشركات التى يشارك فيها جمال و علاء بنسبة 50% بالمجان هى: مارلبورو و مترو و هيرميس و ماكدونلدز (منصور)، سكودا (شفيق جبر) ، حديد العز (أحمد عز) ، دريم لاند( أحمد بهجت) ، اية أر تى (صالح كامل) ، فرست (كامل والخولى) ، موفينبيك ( حسين سالم) ، التجارى (الملوانى) ، فودافون (نصير) ، سيراميكا (أبو العنين)<br />اقرأ بقية التعليق .."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831091725/http://masr.20at.com:80/article.php?sid=785"

[[comments]]
order = 5
subject = "جمال مبارك لن يحكم مصر"
author = "المصرى اوى"
posted = "2006-08-10"
text = "لنا كلمة لابد ان نوضحها فى الجدال الدائر حول تولى جمال مبارك الحكم000000<br />1- بداية، الحالة الصحية لجمال مبارك لا تسمح لة بتولى مهام رئيس الجمهورية لانة مصاب و فى مرحلة متأخرة بسرطان الدم و يضطر مثل والدتة التى أورثتة هذا المرض الى السفر الى الخارج للعلاج عدة مرات كل عام بعد أن استنفذ عدد المرات المسوح بها لتغيير دمة.<br />2- تعديل المادة 76 باطل لإن مجلس الشعب باطل أعضاءة نجحوا بالتزوير فضلا عن أن وجود مبارك فى الحكم سببة البلطجة و التزوير كما أن التصويت تعديل المادة المذكورة باطل لما شابة من تزوير.<br />3- جمال مبارك يحمل جنسية أجنبية (الجنسية البريطانية)<br />4- جمال مبارك متهرب من أداء الخدمة العسكرية.<br />4- جمال مبارك مصاب بداء الشذوذ الجنسى و لن يقبل الشعب المصرى أو أى شعب أخر أن يحكمة رئيس لواطى. معظم المقربين من جمال يعرفون إنة على علاقة شاذة بكل من عمر طنطاوى و وليد حافظ الذين جعلهما من أغنى \"رجال\" مصر. حتى زوجة كل من عمر و وليد تعرف بهذة العلاقة الشاذة. يحتفظ جمال ببلايين الدولارات فى حسابات بإسم عمر و وليد فى سويسرا و بريطانيا و أمريكا و النمسا و الباهاما و هونج كونج.<br />5- جمال مبارك مدمنا للكوكايين و الهرويين و الخمر و لا يعقل أن تكون مقدرات هذة الأمة فى يد مدمن.<br />6- جمال مبارك يفتقر الى شرط حسن السمعة اذ أن هناك أدلة و اثباتات بما فيها شهادة الشهود تؤكد أن جمال مبارك شخص منحرف و فاسد. على سبيل المثال يحصل جمال مبارك من رجال أعمال و غيرهم على أموال طائلة على سبيل الرشوة لتوفير مزايا لهم أو على سبيل الأتاوة لمنع أذى عنهم. و طبقا للثابت من الأدلة المتوفرة فجمال مبارك يتاجر فى السلاح و الأثار و يحمى كبار بارونات المخدرات بمصر و منهم محمد منصور و أحمد المغربى و عفت<br />اقرأ بقية التعليق .."
archived = "2006-08-31"
capture_url = "https://web.archive.org/web/20060831091725/http://masr.20at.com:80/article.php?sid=785"

