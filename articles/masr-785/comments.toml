subject = "222"
author = "سوزان"
posted = "2006-08-10"
text = "شعر من أشعار الكاتب أحمد محمد<br />اشعار باللغة الأجنبية لأحمد محمد:<br />Message to western leaders<br />Suzanne<br />The Brotherhood<br />و باللغة العربية:<br />بينا و بينك دم<br />مش سوزان و الشيطان طلعوا قرايب<br />و متفاهمين و بيكملوا بعض فى النوايب<br />بيشتغلوا سوا فى بزنيس المصايب<br />الشر و الجشع و حب المال خلوهم أكبر حبايب<br />عشان كدة كل اللى حوليها تربية زرايب<br />و مطلعة ماشاء اللة عيال أحايب<br />و العالم المنافقة بتقولها عز المجايب<br />دول سارقين فلوس متلتلة تملى زكايب<br />مع انها يا ميلت بختها إتجوزت دهول و خايب<br />شكلة بيقول انة جاى من كفر المنايب<br />بتقول إنها نجرتة و نضفتة لكن برضة لسة عايب<br />و مع إنة رجل برة و رجل جوة و شايب<br />لكنة مفترى و لا يخاف اللة و لا منة هايب<br />هو بشكلة و غباوتة و حركاتة اللى كلها عجايب<br />متلاقيش فى وطيانتة إتنين من هنا لحلايب<br />من كتر الهباب اللى بيشربة مخة على طول غايب<br />حد يصدق إن مقدراتنا فى إيد هذا الشخص اللى عقلة سايب<br />سوزان شكلها الخارجى يدى نسائى<br />لكن كل ما تقرب حا تلاقية شيطانى<br />مناخيرها مقوصة و شكلها غربانى<br />و شعرها واخد مكوة رجل و صبغاة برازى على كاستانى<br />و رجليها مكرسعة و عصيانى<br />و وشها خبيث و مكار و بهلوانى<br />و لا جسمها يخلى الواحد يقول أة يانى<br />و عينيها مدغمسة من المستحضرات فرز تانى<br />و طالعة فيها مع إنها جاية من ريف بريطانيا الجوانى<br />و أبوها حكيم الصحة كان من الإدمان يعانى<br />أما عشقها الأول فهو كل ما هو مالى<br />و بخلاف الفلوس مالهاش عزيز أو غالى<br />مهما كان جميل أو مثالى<br />و كمان بتموت فى أبو بلاش حتى لو كان أقل من العادى<br />لعابها يسيل على ممتلكات الغير و لا يتوقف لثوانى<br />عشان كدة جوزها ط<br />اقرأ بقية التعليق .."
archived = "2006-08-31"
