author = "رايت فى اندونسيا"
posted = "2009-06-28"
text = "كنت فى زيارة لاندونسيا ورايتهم فى احدى المدن يعملون محارق للزبالة فى سخانات مياة وهذة المياة الساخنة تضخ فى شبكة مياة الحى بحيث يتلقى السكان ساعتين فى اليوم مياة ساخنة من شبكة مياة المدينة - يعنى الست تفتح الحنفية تنزل لها مياة ساخنة للغسيل او الاستحمام<br />انما عندنا مفيش تشغيل مخ - كلة بياكل فول ويتمطى زى الحمار ويسيب الزبالة تملىء الشوارع والروائح الكريهة تنتشر<br />اللهم انعم علينا بنعمة العقل"
archived = "2009-11-15"
capture_url = "https://web.archive.org/web/20091115172622/http://www.20at.com:80/masr/places-of-egypt/12497-2009-06-28-12-42-14.html"

