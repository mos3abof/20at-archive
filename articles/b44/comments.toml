text = "انا عشت في سوريا خمسة وعشرون عاماوكنت اكش الحمام وكانت اجمل ايام عمري والان اعيش في غزة اربي الحمام بدون كش وتختلف اسماء كل نوع من بلد لاخر وشكرا....... شكلي مسود بوز شخشلي ابلق منمر عرجاني برملي دجي مصلي بني بربريسي اسطنبولي"
