[[comments]]
order = 9
subject = ""
author = "نور الشمس"
posted = "2009-12-31"
text = "مرسي جدا للطريقة<br />تسلمي<br />انا بعرف طريقة اخري لها بكتبها لكم<br />ويارب تعجبكم<br />المقادير:<br />عدد 2 كابوريا.<br />ربع كيلو سبيط.<br />ربع كيلو بيبي شريم (الجمبري الصغير).<br />ربع كيلو سمك فيليه.<br />ربع كيلو بصل جندوفللي.<br />2 ملعقة دقيق.<br />ربع كوب لبن.<br />عصير 2 ليمونة.<br />بصلة مفرومة.<br />كسبرة مفرومة.<br />ملح وفلفل.<br />كرفس وجزر وورق لورو.<br />الطريقة:<br />ـ يوضع 2 لتر ماء في إناء ويوضع على النار ثم يقطع عليها البصل وعودين كرفس وتترك حتى يتم غليان الماء.<br />ـ تسقط فيها الكابوريا والجندوفللي والكريماريا حتى يتم سواهم بعد عشرين دقيقة وتصفى، ثم يطرح الماء.<br />ـ يوضع إناء على النار وبه الزبدة مع الدقيق وتضاف إليه الشوربة واللبن ويطرح معها عصير الليمون ويضاف إليها الجمبري الصغير والسمك الفيلية والكابوريا والجندوفللي والسبيط مرة أخرى حتى تغلي.<br />ـ يتم وضع الكريمة عليه، يرش ورق الكسبرة على الوش وتقدم.<br />تحياتي"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127081627/http://www.20at.com:80/banat/kitchen/14571.html"

[[comments]]
order = 10
subject = ""
author = "llily29982"
posted = "2010-01-05"
text = "لا يا جماعة انا بعملها ومش بسلق اى حاجة بره كله مع بعضه بس اهم حاجه انك تنضفى الكبوريا كويس تفتحيها نصين ووتشيلى الزوائد وبعدين بلمون تدعكيها كويس وبجد مش بيبقى فيها بعد كده اى ريحة زفارة وهكذا مع السيبيا برضه ننضفها ووندعكها بلمون والجمبرى نقشره وندعكه برضه وطبعا لو هنحط بقلويظ لازم يكون منقوع قبلها بيوم فى ميه بملح علشان يخرج الرمل من جواه بس كده<br />طريقه التحضير نفسها تقريبا نفس اللى دينا قالته بس انا مش بحط غير بصلة كبيرة وتكون متخرطه صغير جدا علشان متبقاش باينه فى الشوربة و كام فص توه برضه مفرومين كويس وبحطهم فى الحلة اللى هعمل فيها الشوربة مع حتة سمنه و فص مستكه وحبهان يادوب ياخدوا لون واضيف الكابوريا ونسيبهم شويه لحد ما تلاقوا لون الكابوريا بدأ يبقى برتقالى وتنزل ميتها بعدين تضيفوا السيبيا وشوية لما تلاقوا السيبيا بدأت تتكسر كده بالمعلقه نضيف الجمبرى وده يادوب خمس دقايق وبعدين نضيفلهم البقلويظ طبعا بنعرف ان البقلويظ استوى لما يبدأ يفتح صدفته وبعدين نضيف ميه فيها لبن نيدو وكريمه وطبعا بهارات ملح وفلفل ورشة جنزبيل ويادوب هتغلى وتبقى جاهزه للكل<br />صدقونى الوصفه دى دمياطيه ميه فى الميه"
archived = "2010-01-27"
capture_url = "https://web.archive.org/web/20100127081627/http://www.20at.com:80/banat/kitchen/14571.html"
