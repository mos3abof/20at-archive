posted = "2010-03-02"
text = "اللى هيحكم البلد دى فى الهيصة دى<br />لواء فى مكان ما يتأهب<br />قد يكون لواء فى الامن المركزى<br />وقد يكون لواء فى الشرطة<br />وقد يكون لواء جيش<br />ومع من تأتى بة المقادير<br />فالعلم عند اللة<br />ومحدش عارف<br />قل اللهم مالك الملك تؤتى الملك من تشاء وتنزع الملك ممن تشاءئ بيدك الملك وانت على كل شىء قدير<br />ولم يكن احد ولا حتى فى الاحلام يتخيل ان يحكم مصر انور السادات<br />ولا حتى فى احلام وخيال السكارى ان يحكم مصر حسنى مبارك<br />ولكنها تدبير السميع العليم لامر ما<br />فانتظروا ما تأتى بة المقادير"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064535/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?"

