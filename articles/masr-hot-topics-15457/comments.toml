posted = "2010-03-07"
text = "روى البخارى ومسلم<br />0( روى البخارى ومسلم ان الرسول علية السلام قال<br />0 يكبر ابن ادم ويكبر معة اثنان - حب المال وطول العمر )<br />قال قتادة<br />اعلموا ان طول العمر حجة فنعوذ باللة ان نعير بطول العمر<br />( او لم نعمركم ما يتذكر فية من يذكر وجاءكم النذير )<br />وقال المصطفى<br />اعمار امتى بين الستين الى السبعين واقلهم من يجوز ذلك<br />رواة الترمذى وابن ماجة<br />فالعلاج فى المانيا او فى روسيا لن يطيل العمر"
