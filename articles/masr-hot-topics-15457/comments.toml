subject = ""
author = "حساب التضخم"
posted = "2010-03-03"
text = "الحكومة الفاشلة بتقول التضخم نزل ل 8 % وعلشان كدة خسفت بالفوائد فى البنوك ل 6 %<br />يعنى الفوائد اللى اسر كتير بتاكل منها بعد سنين الغربة نزلت ل 6 %<br />طيب يا حكومة اندال احنا الشعب بنحسب التضخم بطريقة تانية<br />بمعنى ان السنة اللى فاتت كان كيلو اللحمة ب 35 جنية<br />السنة دى كيلو اللحمة ب 55 جنية<br />يعنى بزيادة 40 % عن اسعار السنة اللى فاتت<br />والمرتبات زى ما هى لم تزيد<br />يبقى التضخم 40 %<br />نصدق الواقع اللى بنعيشة والمرار اللى بنشوفة فى الشوارع والا بيانات الحكومة والوزراء اللى بيخاطبوا شعب تانى غيرنا<br />مش عارفين نعيش<br />صدقونا حياتنا مرار وقرف وضغوط نفسية<br />الشعب المصرى فى مأساة حقيقية وجوعان وتعبان الا ما رحم ربى<br />40 فى المية من الزيجات بتنتهى بالطلاق لان الشباب بيفقد وظيفتة ومش عارف يصرف على اسرة<br />ارحمونا بقى يا ال مبارك وغوروا فى ستين داهية"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064535/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?"

[[comments]]
order = 28
subject = ""
author = "نختار محافظ"
posted = "2010-03-03"
text = "السادة المحافظون فى المديريات المختلفة كلهم والحمد للة لواءات اركان حرب وقادة جيوش ورؤساء اركان - لماذا لا نرشح خمسة منهم ونختار واحد فى الانتخابات<br />كلهم رجال وكلهم ابطال وبعضهم لا يعانى من التخلف ولا الزهايمر ويمكن شافوا فى حياتهم كمبيوتر بيشتغل وبيشتغل ازاى<br />واذا كنتم عايزين واحد مدنى فالحمد للة فية كتير<br />عندك مثلا فى ايران<br />الاستاذ احمدى نجاد استاذ فى كلية هندسة طهران وكان بيدرس مادة اسمها تخطيط مدن وعمران<br />نشوف استاذ عندنا يخطط المدن ويمنع العشوائيات وسكان القبور ويمسك الحكم 5 سنين ويسيب لغيرة<br />البدائل كتير جدا<br />عسكرى مدنى - مصر مليانة بالكفاءات"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064535/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?"

[[comments]]
