posted = "2010-03-04"
text = "مفيش فايدة<br />لا البرادعى<br />ولا عمرو موسى<br />ولا اى مصرى<br />اللى هيحكم الاستاذ جمال مبارك<br />وبعد اربعين سنة من الان<br />الاستاذ هيثم جمال حسنى مبارك<br />وبعد 80 سنة من الان<br />الاستاذ محمد هيثم جمال حسنى مبارك<br />وخلاص<br />ارتاحوا بقى<br />ترلم ترلم ترلم ترلم ترلم<br />مش هى دى مصر اللى انتو عايزينها"
archived = "2010-03-05"
capture_url = "https://web.archive.org/web/20100305224701/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?utm_source=facebook_ads&utm_medium=masr&utm_campaign=amr_mousa"

