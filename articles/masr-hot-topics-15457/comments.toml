author = "حياتنا سواد"
posted = "2010-03-02"
text = "يا عم ارحل بقى وخد عيالك معاك<br />كفاية جوعتنا وكفاية قهرتنا ووقفتنا فى طوابير وازمات<br />كفاية اننا عاطلين عن العمل<br />كفاية ان الشعب بيجرى طوال النهار وراء لقمة حاف وطبق فول<br />كفاية ان الاقتصاد بيعتمد على الهبات والتسول والمعونات<br />ارحل بقى بعد ما خربتها وقعدت على تلها<br />كتمت انفاسنا بمليون عسكرى امن مركزى<br />رجالتك كل يوم واحد منهم قدام المحاكم<br />مش انت اللى اعطيت وزير الاسكان السابق وسام علشان بيسرق ويوزع وينهب<br />كفاية غور بقى<br />كفاية 30 سنة"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064535/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?"

