[[comments]]
order = 36
subject = ""
author = "البرادعي جوز عايده"
posted = "2010-03-04"
text = "محمد مصطفى البرادعي (17 يونيو 1942)، دبلوماسي مصري ومدير الوكالة الدولية للطاقة الذرية السابق. حاصل على جائزة نوبل للسلام سنة 2005. ولد في الدقي (حاليا حي في محافظة الجيزة في مصر). والده مصطفى البرادعي محام ونقيب سابق للمحامين. تخرج في كلية الحقوق في جامعة القاهرة سنة 1962 بدرجة ليسانس الحقوق.<br />وهو متزوج من عايدة الكاشف، وهي مُدرِّسة في رياض أطفال مدرسة فينا الدولية، ولهما ابنان. ابنتهما ليلى محامية وابنهما مصطفى مدير استوديو في محطة تلفزة خاصة، وهما يعيشان في لندن."
archived = "2010-03-05"
capture_url = "https://web.archive.org/web/20100305224701/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?utm_source=facebook_ads&utm_medium=masr&utm_campaign=amr_mousa"

[[comments]]
