subject = ""
author = "يوسف المصرى"
posted = "2010-03-04"
text = "عمرو موس والبرادعى بحترمهم جدااااااااااااا ااااااااااا<br />انا كان نفسى عمر موسى يبقى رئيس الجمهوريه انبسطت لما عرفت ان البرادعى مرشح نفسه وكمان عمرو موسى هيبقى النائب ده كد حلووووووووووووو قوىىىىىى<br />بس ياريت ده يحصل مانتو فاهمين ربنا يستر وربنا يحفظهم ويعوضونا ياااااااااااااا ااااااااااااااا ارب<br />خلو بالكو يا مصريين الموضوع ده هيغير حاجااااااااتا كتيرررر قوى احنا داخلين على تغيير جذرى وللاحسن ان شاء الله بس يتم على خير اهم حاجه وربنا يحفظهم ويعوضو الشعب المصرى اللى خلاص والله العظيم الناس بتكلم نفسها فى الشارع ده غير اللى بيحصل يوم عن يوم من مأسى وطاحونة الحياه … الله المستعان"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064535/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?"

[[comments]]
order = 33
subject = ""
author = "حكم الامير"
posted = "2010-03-04"
text = "زمان اشتغلت فترة فى دولة الامارات العربية - وكانت فى امارة الفجيرة وهى امارة كانت فقيرة فى الموارد فلا بترول ولا صناعة ولا اى شىء<br />وطبعا الامير يحكم الامارة تحت اسم الشيخ فلان - فلا مجلس شعب ولا برلمان ولا مجلس محلى ولا كل تلك المسميات<br />طيب نظام الحكم اية ؟<br />ديكتاتورى واعتقالات وحبس وتعذيب وتكميم افواة واغتيالات - ابدا<br />الشيخ مخصص يوم الجمعة فى الديوان الاميرى لمقابلة الشعب وكل من يريد مقابلة الحاكم لعرض اى شىء علية علية ان يذهب بدون حجز وبدون ان يسألة احد انت جاى لية وعلشان اية<br />لقاء مفتوح على الارض بين الحاكم والرعية وبدون اى تكبر ولا حواجز<br />والناس بتقول للحاكم اللى هى نفسها فية واللى بتعانية والراجل بيحل مشاكلهم مع الوزرات الاتحادية ويسمع لهم باهتمام<br />والامير بيسوق عربيتة فى وسط الناس بدون اى حراسة الا عسكرى واحد وراة<br />وبيدخل اى مكان عام بدون خوف<br />صدقونى امارة الفجيرة فيها الان عمران كبير جدا وفيها مطار وميناء ومخططة حديثا<br />عايزين نظام حكم هنا فى مصر ملتصق بمشاكل الناس<br />نظام حكم عايش مشاكل الناس واوجاعهم<br />مش نظام قاعد فى شرم الشيخ يبلبط فى المية والناس بتاكل زلط"
archived = "2010-03-05"
capture_url = "https://web.archive.org/web/20100305224701/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?utm_source=facebook_ads&utm_medium=masr&utm_campaign=amr_mousa"

