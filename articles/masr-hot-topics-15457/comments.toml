author = "نخلص من البلوى اولا"
posted = "2010-02-23"
text = "المهم نخلص من البلوى الاول وبعدبن مش مهم مين يبقى النائب<br />المهم ندفن الميت الاول<br />وبعدين ما تحلمش كتير"
