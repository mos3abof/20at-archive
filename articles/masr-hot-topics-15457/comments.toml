text = "كويس خالص<br />البرادعي ما طلعش فلاح زي بتوع كفر مصيلحه وميت ابو الكوم وبني مر<br />البرادعي ابن اكابر ابوه نقيب محاميين سابق وساكن في الدقي<br />يعني ابن اكابر زي جمال مبارك بالضبط<br />خلاص ننتخبه<br />وربنا يكفيه شر شوية لواءات مصر المجرمين"
