subject = ""
author = "اللة يا برادعى"
posted = "2010-02-24"
text = "لما شفت كلام الراجل شعرت من كلامة ان الراجل ممكن يكون هدية كبيرة لمصر<br />واهم حاجة فية<br />انة ليس منافق ولا كداب<br />راجل كبير- عالمى<br />مش منافق ولا كداب زى حسنى وابنة"
archived = "2010-02-26"
capture_url = "https://web.archive.org/web/20100226134847/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html"

[[comments]]
