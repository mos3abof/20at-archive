[[comments]]
order = 20
subject = ""
author = "عقدة الفلاحين"
posted = "2010-03-02"
text = "الشعب المصري مصاب بعقدة الفلاحين<br />طيب ما هو جمال عبدالناصر كان فلاح وخرب البلد واعضاء مجلس الثورة كلهم كانوا فلاحين ولاد كلب وسرقوا البلد ونهبوها<br />وحسني مبارك فلاح من كفر مصيلحه مش عاجبك ليه<br />واحد هلفوت اسمه البرادعي وصايع<br />بص في الصورة كويس شوفوا بيضحك ازاي زي الكلب<br />اما جمال مبارك ابن اكابر ووطني جدا ابوه كان لواء طيار وفريق طيار وقائد طيران مصر وبطل من ابطال حرب اكتوبر<br />وتربى في بيت الرئاسه وفهم حاجات عمر ما البرادعي فاهمها<br />البرادعي دا حمار والبرادعي دا اللي بيفصل البردعات بتاعة الحمير في الكفر حداهم<br />وبعدين انتو يا بتوع البرادعي الانتخابات اللي فاتت كنتو بتوع ايمن نور<br />وقلبت بيكم للبرادعي ومنعرفش الانتخابات الجاية حيكون مين<br />بطلوا هبل وعبط بقا"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064535/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?"

[[comments]]
order = 21
subject = ""
author = "برضة البرادعى"
posted = "2010-03-02"
text = "الواد ابن الممرضة ما ينفعش يبقى رئيس ولا مساعد رقاصة لانة شاذ<br />انما الفلاح الدكتور وكيل وزارة الخارجية المصرية ايام مجدها وحائز على جائزة نوبل والفلاح ابن مدينة ابيار هو اللى هيبقى الرئيس<br />وهيبقى الرئيس يعنى هيبقى الرئيس"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064535/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?"

[[comments]]
order = 22
subject = ""
author = "alialiomar20021@yaho"
posted = "2010-03-02"
text = "احنا المصرين انخلو بالنا سواء اركب رئيس البرادعى او عائلة مبارك ده كوليته مش هيفرق.<br />بس الاهم عندينا انحنا تبقى عندينا معلومه انى كول الى يركب ريس من بعد عبد الناصر بينهب فينا<br />يعنى ايه كول واحد يدور على مصلحته افضل وسيبكم من الانتخبات .<br />بس افضل لينا الى ينفع رئيس مبارك او عياله<br />قولى ليه لان البرادعى طول عمره فى متربى وعايش فى الغرب ولا عمره شافنا ولا عمره اسمع على شعب مصر<br />ومش عرفينا لو مسك منصب الرئيس هيعمل فينا ايه اما لو امبارك او عياله فاحنه ايه عرفينهم واحنا امربينهم على ايدينا ولا هيجبولنا حرب ولا هيجبولنا حاجه احنا مش متعودين عليها ولا ايه .<br />واحنا مع بعضينا فى الاول والاخر عرفين مين الى هيكسب فى الاخر يبقى نقعدو سكتين ومحدش يتنفس .وانا ولا بكسكس ولا بنيل انا بقول الحقيقه اى كولنا عرفينها .<br />وفى مثل مصر يقو الى نعرفوه احسن من الى منعرفوهش<br />وفى الاول ولا الاخر البردعى لو بيدور على حقوق مصر كان نصر اخوان مصر ولا ايه .<br />ولو انا غلطان قلولى انا غلطان وادى اميلى عنديكو (alialiomar2002 1<br />yahoo.com)<br />اوك باى وهنسيبكو مع بابا مبارك وماما سوزان والابناء الاشقياء على"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064535/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?"

[[comments]]
order = 23
subject = ""
author = "برادعي وشعب عبيط"
posted = "2010-03-02"
text = "الشعب العبيط عايز ينتخب البرادعي<br />مع ان البرادعي كان ضمن العصابه اللي ضيعت العراق<br />فاكرين ولا نسيتو يا شعب اهبل وعبيط<br />نسيتو البرادعي ايام بوش<br />ارجعو بالذاكره وشوفو موقف البرادعي من العراق والعصابه اللي كان البرادعي عضو فيها<br />سلام يا شوية عبط<br />جمال مبارك اشرف مليون مرة من البرادعي<br />والحديث يطول شرحه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــ<br />مش رغداء بندق ولا عجم"
