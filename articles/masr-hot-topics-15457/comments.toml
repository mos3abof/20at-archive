[[comments]]
order = 1
subject = ""
author = "موسى والبرادعي"
posted = "2010-02-24"
text = "موسى والبرادعي تحت جذمه الريس<br />وكل دا تمثيل وصرف فلوس على الفاضي<br />وعيب على الحكومة لما تضحك على شغبها وتصرف فلوس شعبها في انتخابات ملهاش قيمه والنتيجة معروفة ومحتومه مسبقا<br />عيب يا حمومه يا فاشله"
archived = "2010-02-26"
capture_url = "https://web.archive.org/web/20100226134847/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html"

[[comments]]
