subject = ""
author = "يا بتوع الوطنى"
posted = "2010-03-01"
text = "جمال حمارك مينفعش<br />الشعب كلة وراء البرادعى<br />لان البرادعى مصرى زينا<br />ولو بصمجى هننتخبة<br />كفاية حكم للعملاء والجواسيس والفاسدين<br />الشعب كلة ورائك يا برادعى<br />والبرادعى هو الحل"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064535/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?"

[[comments]]
order = 4
subject = ""
author = "حسن السكرى"
posted = "2010-03-01"
text = "عايز تبقى ريس ليه<br />العراق وخربتها<br />وايران عايز تخربها<br />هتعمل ايه فى مصر<br />انت مجرد ارجوز<br />لا تفهم فى النووى ولا تعرف عنه حاجه<br />انت مجرد محامى<br />ايه دخلك بالنووى<br />ولما انت فاهم اوى<br />وما كونت دخلت على اسرائيل بدال العراق وايران ولا هيا لمعه دماغ على الفاضى<br />بلاش تلعب فاللى ملكش فيه<br />المصريين مش فاضيين للعب العيال ده<br />ثم انت مش هتغير الكون ولا هتفجر كنوز الارض اللى فمصر<br />ان يدوب هتقول كلمتين وشكرا تروح تنام فى فرنسا<br />وتسيبها تقضرب تقلب"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064535/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?"

[[comments]]
order = 5
subject = ""
author = "محمد وحيد"
posted = "2010-03-01"
text = "يا مصريين افهموا و يا اصحاب العقول \" مصر لم تخل حرب منذ أكثر من 30 سنة \" ده اكتر من ممتاز و تاني حاجة ان البرادي مثلا الي انتو فكرينوا ملاك ده قضي اكتر من نصف عمره خلرج مصر يعني مصري الجنسية و لكن امريكي قالبا و قالبا مثل احمد زويل كده \" مبارك مش حلو و جمال مش حلو بس مفيش احسن منهم \" من رأيي ان الجامعات المصرية و خصوصا عين شمس و القاهرة فيهم من هم احس من البرادعي و موسي 1000 مرة و الاكتر من كده انهم مصريين قالبا و قالبا مش مصري متأمرك و البرادي ده مادرش يحوط رجله في اسرائيل او كوريا لجنوبية و اما كان من اهم اساب دخول العراق الي الغرب اغتصب اردها و نسائها و اطفالها و لو كان فعلا رجل حق كان عمل بمنصبة و دخل فتش في اسرائيل و متنسوش انها منظمة دولية اكبر من اي دولة و في الحق و العدل تذكروا قول رسول الله \" لو أن فاطمة بنت محمد سرقت لقطعت يدها \" لو زويل مصري لاكان ادي علمه لمصر و لو البرادي مصري لاكان ساهم في تطوير المسسة النووية في مصر : الله يرحمك يا د/ مصطفي مشرفة و بعيدا عن اي حد \" لو لم اكن مصريا لوددت ان اكون مصريا \" و تاني افتكروا ان الرسول م قال ان خير اجناد الارض هم جنود مصر"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064535/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?"

