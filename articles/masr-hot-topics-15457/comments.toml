subject = ""
author = "لا تشغل بالك"
posted = "2010-03-08"
text = "سيبك من الموضوعات دى<br />احنا هييجى لنا اية من جمال مبارك والا البرادعى والا عمرو موسى<br />اى واحد فيهم هيستفيد<br />انما احنا لا لينا فى الثور ولا فى الطحين<br />هى كانت بلد ابونا لوحدنا<br />خلينا نشوف هنتصرف ازاى فى ازمة العيش وازمة البوتاجاز والنهاردة الصبح فى ازمة السولار وبتوع الميكروباص بيسبوا ميت دين للكبار لان مفيش بنزين 80 ولا فية سولار<br />فكر كدة فى حاجة نسرقها ونغتنى زى الحرامية الكبار<br />فكر كدة ننصب فى جمع اموال لنثتثمرها فى النصب<br />شوف لنا احد فى الوطنى واصل نهتف وراة ونتغدى وناخد كم قرار على علاج الدولة المجانى<br />يا عم شوف لنا سبوبة نرتزق منها<br />بلاها سوسو وبلاها نرمين وبلاها برادعى وبلاها جمال - شوف لنا سبوبة نرتزق منها"
archived = "2010-03-10"
capture_url = "https://web.archive.org/web/20100310122313/http://www.20at.com:80/masr/interviews/15457-2010-02-23-16-56-23.html"
