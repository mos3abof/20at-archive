[[comments]]
order = 18
subject = ""
author = "alialiomar20021@yaho"
posted = "2010-03-02"
text = "البرادعى جاى مصر علشان يبيع البلد وايش الى ضمنا انى البرادعى مش بعتها امريكا والغرب على مصر علشان يخربها زى مخرب العراق امبارك امبارك احسن من غيره هو وعياله على الاقل هوما فهمين البلد ماشيه ازاى وهو الحق يدور نائبا للرئيس يا راجل روح العب بعيد منينا احنا مش فيقين .<br />احنا اعرف امبارك ازاى يلهينا ويحميانا من الغرب واحنا مبسوطين على كدا يا عم كفايه روح دور على بلد تانى العب فيها وخرب فيها انت لو صح بدور على مصلحت البلد كان اديت علمك لبلدك مش طاير على بره وجاى تتريس عليا انت ايه الى عرفك بظروفنا واحولنا امانا عليك كفايه وفضها وخد بعضك وارجع من مكان ماجيت وخد الى جو معاك وقول للبعتوك دى مصر الى ذكرت فى القران على"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064535/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?"

