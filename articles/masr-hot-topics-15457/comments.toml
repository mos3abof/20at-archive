author = "جور الحكام"
posted = "2010-03-03"
text = "قال رسول الله صلى الله عليه وآله وسلم :<br />يأتي زمان علي أمتي يحبون خمس وينسون خمس … يحبون الدنيا وينسون الآخرة<br />يحبون المال وينسون الحساب يحبون المخلوق<br />وينسون الخالق يحبون القصور وينسون القبور يحبون المعصية<br />وينسون التوبة فإن كان الأمر كذلك ابتلاهم الله بالغلاء والوباء والموت<br />الفجأة وجور الحكام"
archived = "2010-03-04"
capture_url = "https://web.archive.org/web/20100304064535/http://www.20at.com:80/masr/hot-topics/15457-2010-02-23-16-56-23.html?"

