[[comments]]
order = 0
subject = "وسسسسع طريق الاسعاف"
author = "هووووبه او هبهوب"
posted = "2006-03-31"
text = "اقول ولاه مقولش<br />اتحيلوا عليا كمان شويه ...خلاص خلاص متقزقش<br />عشان الحلفان بس<br />اولا احب اتكلم في الموضوع دا مخصوص من خلال فلمين<br />الاول \"همام في امستردام\"و\"شورت وفانله وكاب\"<br />حتكلم بصفتي عشرت الناس دي اللي اتجوزت عربي من عربيه<br />اوعربي من اجنبيه والعكس<br />نقول ليه بتجوزها وعشان ايه وازاي?<br />صلوا علي النبي.....<br />اولا الشباب اللي بيهاجر ليه تلات حالات<br />-طالع الغرب وورقه \"اسود\"يعني معهوش ورق شرعي يسمحله<br />بالاقام هفبحاول يقعد قانوني زي همام يقعد ازاي بقي عن طريق<br />الزواج ببنت البلد \"امريكيه ,فرنسيه.....\"<br />لو امريكيه مثلا يقعد معها لمده اربع سنين بعد كدا<br />حسب سلوكه لو مودب ومهدب ياخد الورق وياسلام بقي لو خلف حط تحت \"خلف\" دي مليون خط لان دي مربط الفرس<br />بالنسبه للحلات اللي عشرتها<br />-اتجوز امريكيه عشان الورق وبعد ما خده بنته مصاحبه<br />ومبتعرفش عربي ولاعايزه<br />-وواحد اتجوز امريكيه خد الورق وخلف وابنه في حضانه امه<br />-واحد اتجوز امريكيه بعد ماخد الورق مازال لبحث جاريا<br />عن ابنه.<br />وبلاوي كتتتتتير في نظري الجوزات دي كلها فاشله<br />لان الهدف الاول \"مصلحه\" حط تحت مصلحه دي 2مليون خط<br />خلص مفيش \"سكينه \"مفيش \"موده' اهي ...اهي<br />المشكله التانيه بتاعت \"شورت وكاب\" مش حقول غير<br />كلمتين\"اه يابلد \" للدرجه دي الكيل طفح<br />المشكله الاسسيه في كلا الحالتين \"الجيل اتاني \"والتالت\"<br />بمعني الطفل طالع مش عارف انتمائه لمين للغرب ولاه الشر<br />ابوه بيكلمه عن حاجات هو مش شايفها هو عايش هناك مدرسته<br />هناك الانسان ابن\" البيئه \"يبتدي بقي صراع الاباء مع<br />الابناء من منطلق ان الاتين من بيئه مختلفه.وشفتها كتتير االحالات دي.<br />مالها بنت البلد مالها ونا عن نفسي بكره جواز العربي<br />من عربيه او العكس صحيح في زيجات صالحه<br />اقرأ بقية التعليق .."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015750/http://masr.20at.com:80/article.php?sid=100&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 1
subject = "انا عايزه مكركروم"
author = "هووووبه او هبهوب"
posted = "2006-03-31"
text = "فين بقيت التعليق ???<br />علي العموم هقول بالنسبه تاني للعربي والعربيه<br />مش كويس في حاجات وكويس في حاجات , بس اللي الواحد<br />شافه يقول بلاها خلاص , المشكله لما ينزل مثلا بلده<br />اوبلادهاالام وعايزه تدخل عيالها المدارس<br />الطفل بيحس انه غريب في بلد ابوه او امه<br />ياسلام بقي لو مصري متجوز تونسيه مثلا ابنهم يشجع مين<br />اخيرا علي راي عمرو خالد محدش بيتجوز مرات غيره<br />وايه الفرق بين \"بودره تللك خمس خمسات \"و\"الجواز'<br />الاولي قسمه ولشبريشي والتانيه\"قسمه ونصيب \"<br />وسمعونا الزغروده انا لسه مزغرده من شويه لما اتقطع نفسي."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015750/http://masr.20at.com:80/article.php?sid=100&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 2
subject = "الفلوس مش كل حاجة"
author = "لميس"
posted = "2006-04-25"
text = "أكيد عبارة الفلوس مش كل حاجة بتتآل على كل لسان<br />بس للأسف في زمنا الحالي (زمن الدمقراطية)بإت كل حاجة في ساعات مفيش حد بيحأأ حلمة إلا بالفلوس و مننساش الوسطة (دي أهم حاجة) أما بأة مصر فدي حالة تنية معروفة عند الشعوب لالشياكة والفلوس والوسطة عشان تعدي ولا ناوي تعد على الرصيف(دا مصر متسدأ)<br />اما عن الجواز فبلاش منة لإنة بيزيد نسبة السكان وحرام عليك كدة كفاية (الحكومة إتخنإت )"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015750/http://masr.20at.com:80/article.php?sid=100&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 3
subject = "سلام عليكم"
author = "هند اختها"
posted = "2006-04-25"
text = "انا صديقه للموقع من زمان وانا اللي معرفه هبه عليه كمان بس مبحبش اعلق عشان كل تعليقاتي اشكر كاتب المقالوبس علي راي هبه غير ان معندناش كي بورد عربي فبخمن<br />الحروف فبقعد وقت طويل عشان القي الحرف الموضوع الليحضرتكم تفضلتو وطرحتوه هام جدا وهبه اشارت لحتت فيالاهميه بلنسبه للجيل التاني والاول اوضح اكتر بطه اللي هي ماما ناتج خليط بين تركي ومصري لما جدها جه مصر<br />الجيل التاني طلع مصريين وكدلك الثالث اما بخصوص عربي من عربيه فاعتقد ان الرسول صلي الله عليه وسلم تزوج من السيدة ماريه القبطيه موضوع زواج عربي من عربيه.خلاف بيني وبينها اساسا وعلي رايها بودرة تلك خمس خمسات وقسمه والشبرويشي وقسمه ونصيب"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015750/http://masr.20at.com:80/article.php?sid=100&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 4
subject = "وانا اقول يا هبهووب كلامك ملخبط ليه"
author = "حمدي"
posted = "2006-04-25"
text = "الان بس فهمت يا هبهووب انا ليه بحس اني<br />محتاج مترجم لما اجي اقرا التعليقات بتاعتك بتفكريني بالاخ الباكستاني اللي كنت يقول مائه كلمه علي مالقط منهم كلمتين<br />حلو تفاعل الحضارات ده بيطلع حاجات تجنن<br />** بقول يا هبهوب لو عندك شابه في مقتبل العمر عندها كده ستين سبعين سنه ابقي قوليللي علشان اكمل حياتي معاها<br />ونعمل مشروع حضاري عظيم<br />ويا بخت من وفق راسين في الحلال"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015750/http://masr.20at.com:80/article.php?sid=100&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

