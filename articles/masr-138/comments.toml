[[comments]]
order = 3
subject = "طيب جمعه ذنبه إيه"
author = "عابر القارت"
posted = "2006-04-08"
text = "بالنسبة لأيمن نور عارفين غلطته و أنه تطاول و حاول أن يقف فى وجه المفرمه و كان صادقا فيما فعله و ربنا أعلم بنيته أما الحاج جمعه فقد دخل الانتخابات أصلا كديكور بوصفه منافس قال إيه قوى و ده لأنه أحد رؤساء الاحزاب من بقايا الانتخانه و التى سمح بإستمرارها فقط لتعطى العالم إنطباع أننا دولة ديمقراطية ليس إلا و لكن الحقيقة أننا دولة تعيش فى عصر ستالين بغض النظر عن سياسية \"البريستو\" ... و سياسية البريستو لمن لا يعرفها هى نفس نظرية حلة الضغط الموجوده فى بيوت كثيره و حتى لا تنفنجر من فرط الضغط داخلها زودت بصمام ينفتح بمقدار معين يزداد بزياده الضغط فالحلة هى مصر و الماء الذى يغلى هو الشعب و صمام الامان هو الجرائد و المواقع الحزبية و البخار اللى بيطلع هو غضب الناس و فى الاخر اللى عاوزه تطبخه السلطه بيستوى و بالهنا و الشفا"
archived = "2006-09-13"
capture_url = "https://web.archive.org/web/20060913161441/http://masr.20at.com:80/article.php?sid=138&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "الله الله"
author = "مونتى"
posted = "2006-04-12"
text = "اللهم نسالك بكل اسم سمية به نفسك انزلته في كتابك او احتفظة به لنفسك اللهمة نسألك بحق انه لا اله الا انت الواحد الاحد الفرد الصمد الذي لم يلد ولم يولد ولم يكن له كفؤا احد اللهم نسألك بعظيم قوتك وجلال قدرتك وبأنك قادر على كل شئ احط بكل شئ علما ان تخرج ايمن ونعمان وتدخل جمال وعلاء والحمد لله رب العالمين والصلاة والسلام على محمد اشرف المرسلين والحمد لله رب العالمين"
archived = "2006-09-13"
capture_url = "https://web.archive.org/web/20060913161441/http://masr.20at.com:80/article.php?sid=138&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

