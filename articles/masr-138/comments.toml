subject = "حبيب - - - - shut down"
author = "somebody like u"
posted = "2006-04-07"
text = "اية يا عم حبيب اللى انتا كاتبة دة<br />طب خلاص خليك كدة قاعد على الرصيف جنب القطر و خلية يعدى من جنبك ولا من عليك انتا و اصحابك و اهلك و حبايبك<br />بس ماتنساش ان القطر هايعدى عليك هوا و ابنة و ابن ابنة و مراتة و العيلة كلها<br />كمان القطر دة من النوع النتن اللى رحتة زى الزفت و غالبا هايولع باللى راكبينة<br />بس طبعا المقصورة و الدرجو الاولى مش هايشموا ريحة النار اساسا<br />أرجوا انك تكون فهمت اى حاجة انت ولا غيرك<br />و مبروك لمصر"
archived = "2006-09-13"
capture_url = "https://web.archive.org/web/20060913161441/http://masr.20at.com:80/article.php?sid=138&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

