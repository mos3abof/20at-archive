author = "القانون 238 لسنة 199"
posted = "2009-08-18"
text = "ممتاز ممتاز ممتاز<br />اول مرة الدولة تعمل حاجه صح<br />كما ان الطبيب لازم يكون معاه تصريح مزاولة مهنة<br />والمحامي لازم يكون معاه تصريح مزاولة مهنة<br />والمهندس كذلك<br />والدين ليس اقل من كل ذلك"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906160623/http://www.20at.com:80/masr/2khbar/12965-2009-08-18-09-44-29.html"

[[comments]]
order = 1
subject = ""
author = "اطمئنوا جدا"
posted = "2009-08-18"
text = "كمواطن عادى جدا<br />لا اذهب الى صلاة الجمعة الا بعد ان ينتهى خطيب الاوقاف الذى يخطب من ورقة معة فيها كلام كلة غثاء من خطبتة<br />ادخل المسجد لاقامة الصلاة فقط بعد ان ينتهى من خطبتة<br />وكذلك اغلب المصلين<br />خطباء الاوقاف اصبحوا موظفين لا يفهمون شيئا غير ترديد كلام الاوقاف ونحن فى غنى عنة<br />ونستمع الى الخطباء الذين نحبهم فى الماتم وفى الحفلات"
archived = "2009-09-06"
capture_url = "https://web.archive.org/web/20090906160623/http://www.20at.com:80/masr/2khbar/12965-2009-08-18-09-44-29.html"
