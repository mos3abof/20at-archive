subject = ""
author = "رمضان ـ ميلاد المسيح"
posted = "2009-08-18"
text = "المسلمون يحتفلون برمضان كما يحتفل النصارى بعيد ميلاد المسيح<br />المسيحيين يحتفلون بميلاد المسيح بشرب الخمر والزنا<br />والمسلمون يحتفلون برمضان بالمسلسلات والافلام<br />رمضان في اوله رحمة واخره مغفره واخره عتق من النار"
archived = "2009-08-19"
capture_url = "https://web.archive.org/web/20090819141601/http://www.20at.com:80/masr/t7kyk/12972-2009-08-18-12-56-07.html"

[[comments]]
order = 2
subject = ""
author = "ونبطل عبادة"
posted = "2009-08-18"
text = "هو اسمة شهر رمضان والا شهر المسلسلات<br />اية كمية الفلوس دى كلها علشان المسلسلات الهايفة لصرف الناس عن تلاوة القران والصلاة<br />اية النشاط دة كلة<br />الملايين اللى انصرفت على المسلسلات دى ممكن تفتح عشر مصانع وتشغل الاف الشباب وتحل مشكلة البطالة والعنوسة<br />فيها اية لو كان مسلسل واحد زى زمان نتفرج علية كلنا وخلاص<br />البلد دى مين اللى بيخطط لها علشان تدمير شبابها<br />انا الساعة عشرة صباحا اخرج من البيت الاقى الشارع كلة نايم والدكاكين مقفلة<br />فية خطة جهنمية وضعت لتدمير هذا البلد الذى كان منتجا<br />اية القرف دة"
archived = "2009-08-19"
capture_url = "https://web.archive.org/web/20090819141601/http://www.20at.com:80/masr/t7kyk/12972-2009-08-18-12-56-07.html"
