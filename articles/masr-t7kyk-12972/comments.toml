subject = ""
author = "بابا عبدة"
posted = "2009-08-18"
text = "زمان لما كانت الدنيا بخير<br />كان فية فى التليفزيون فوازير بعد الفطار وبعد صلاة التراويح كان فية مسلسل واحد اسمة بابا عبدة ايام السادات اللة يرحمة<br />بس<br />دلوقتى خمسميت مسلسل بيتكلموا فى قصة معادة ومكررة الف مرة<br />بيخذبوا الشباب علشان ما يرحش الجوامع ولا يقرا قران<br />وبعدين تروح البركة ويحل الخراب وتخرب الزمم ويزيد التحرش والاغتصاب والقتل<br />مستر كوهين مستشار الاعلام فى التليفزيون بيخطط كويس<br />وعارف بيعمل اية"
archived = "2009-08-19"
capture_url = "https://web.archive.org/web/20090819141601/http://www.20at.com:80/masr/t7kyk/12972-2009-08-18-12-56-07.html"

[[comments]]
