posted = "2009-12-23"
text = "موضوع جميل بجد جزاك الله خير<br />الموضوع كان ملخبط عندى شوية"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227041028/http://www.20at.com:80/20at/religious/14555-2009-12-23-14-55-18.html"

[[comments]]
