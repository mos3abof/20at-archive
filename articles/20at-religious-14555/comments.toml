[[comments]]
order = 1
subject = ""
author = "دياب"
posted = "2009-12-23"
text = "موضوع جميل فعلا في قالب ممتع وفائدة عظيمة<br />ياريت تهتموا بالحاجات دي افضل من المواضيع الهايفة التي لا تفيد بس متنساش تحطها بطريقة مشوقة واكثر دعمها بالصور لان الناس دلوقتي بتكسل تقرا لو مفيش صورة في الخبر"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227041028/http://www.20at.com:80/20at/religious/14555-2009-12-23-14-55-18.html"

[[comments]]
