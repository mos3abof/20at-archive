author = "مسلمات أبناء مسلمين"
posted = "2009-12-24"
text = "والله دخلت جامع الحصري بمصر ومعرفتش أصلي صلاة الجنازة وقلت هادور ونسيت’ وكنت مبسوطة لما لقيتها.<br />جزاكم الله خيرا"
archived = "2009-12-27"
capture_url = "https://web.archive.org/web/20091227041028/http://www.20at.com:80/20at/religious/14555-2009-12-23-14-55-18.html"

