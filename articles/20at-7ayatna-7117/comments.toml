text = "بجد حاجة تفرح وتحزن في نفس الوقت<br />تفرح عشان في شباب كادح وعقله كبير لدرجة انه اهتم ازاي يعرف يغطي مصاريفه وبطريقة جميلة..منها خدمة لاهل بلده اللي جعانين في الشوارع..ومنها بيكسب رزقه بعرق جبينه..هو ده الشباب اللي عاوز ينجح بجد<br />اللي بيزعلني بقة ان عندنا عمالين نقول البطالة ومش لاقين شغل<br />لا والله الشغل موجود كتير جدا<br />بس اما بيكون شغل مش مناسب لطموحات الشباب لانه شغل يدوي وهيبقى عامل بقة وهيتعب والشباب اليومين دول عاوز الحاجة تيجي على الجاهز<br />يا اما بيكون الشغل كويس بس مطالبه غير متوفرة في كثير من المتقدمين..وبرضه الشباب ما فهوش حيل انه ينمي ادراكه ويحاول يشوف ناقصه ايه ويحصل عليه عشان يعرف يحصل على الوظيفة دي<br />للاسف شبابنا مش عاوز يكافح وعاوز يلاقي كل حاجة ع الجاهز وعاوز يتخرج ويتجوز وخلاص..معدش في طموح ولا صبر<br />ربنا يهديهم<br />ورغم كده في نماذج مشرقة والناس حاليا بدأت تصحى ودي باعتبرها بارقة امل<br />انا مثلا زميلتي بتشتغل وبتاخد مرتب رغم اننا لسة في الكلية والكلية صعبة مش سهلة..وبالمرتب بتاعها بتدفع تمن كورس في الجامعة الامريكية يزيد على 500 جنيه..ودي بنت.. بجد ساعتها قلت ان الدنيا لسة بخير واتمنى ان الاقي شباب مصر كلهم بيفكرو بايجابية وطموحين قول مع فعل..مش شباب مصر بس.. لا شباب العالم العربي كله"
archived = "2009-08-31"
