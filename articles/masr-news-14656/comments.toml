author = "خلي بالك من كلامك"
posted = "2009-12-30"
text = "اقتباس نحن لا نحتفل:<br />نحن الاغلبية العظمى من المصريين خارج العاصمة والاسكندرية لا نحتفل برأس السنة ولا حتى بذيل السنة<br />لانها ليست اعياد مصرية ولا فى عادتنا<br />نحن لنا اعيادنا - الفطر والاضحى<br />ولنا ليالى احتفالية مثل نصف رجب والاسراء والمراج وعاشوراء<br />احتفلوا بة كما شئتم مثل الخواجات ولكن نحن لا والف لا<br />انت ليه بتتكلم على المصريين ؟؟؟ المصرين بيحتفلو براس السنه و المصرين بيحتفلوا بشم النسيم من ساعه الفراعنه لحد دلوقت … المسلمين بقى هما اللي مبيحتفلوش .. وضح كلامك … ثانيا هو عين اننا نحتفل بسنه جديده جايه علينا و نحاول نبتدي فيها من جديد ؟؟ و اللا انت مش مقتنع بالتقويم الميلادي ؟؟؟ انت قلتلي عيد ميلادك امتى ؟؟ و لا مبتحتفلش بيه ده راخر ؟"
archived = "2010-01-01"
capture_url = "https://web.archive.org/web/20100101100731/http://www.20at.com:80/masr/news/14656-2009-12-30-10-39-32.html"

