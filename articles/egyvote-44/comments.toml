text = "صالح الإخوان والأقباط في سلة واحدة فعلا وعليهم أن ينسقوا سويا بدل ما هما قاعدين يتحفزوا لبعض والكلام بتاع ميلاد حنا موش مسئول وموش واعي<br />لان قوة الاخوان اصبحت واضحة للجميع وكمان الاخوان لازم ينسقوا مع الاقباط في مصر قبل ما خطر اقباط المهجر يزيد ويبقى شكلها موش ظريف<br />بس عموما المقال حلو ومختلف"
