[[comments]]
order = 0
subject = "امممممممممممممم .. هعمل ايه ؟"
author = "sweet_princess"
posted = "2006-04-05"
text = "انا كان نفسي ادخل اعلام ..<br />لكن مكتب التنسيق الله يعمر بيته هو اللي وداني فسلفه ...<br />وانا بقول الله يعمر بيته عشان انا اللي لو كنت في الموقف دا ..<br />كنت هتجنن عليهم ..<br />واقلع جومتي وانسرها على دماغ اتخن تخين ...ومش مهم اروح حافيه ..<br />انا بحمد ربنا اني اترحمت بجد لان دي مش اول شكوى اسيمعها من طلبة اعلام ...<br />وعموما كلنا قرفانين والله في دراستنا ...<br />لكن هنقول ايه بقى .. ربنا ينتعنا بالسلامه ..<br />عشان البنات يقعدوا في البيت يستنوا بيت العدل ..<br />الشباب ياخدوا دورات في الطاوله والدومينو ... واهو كله تعليم .."
archived = "2006-04-20"
capture_url = "https://web.archive.org/web/20060420195618/http://www.masr.20at.com:80/article.php?sid=124&PHPSESSID=a417ce98b7af7a46e663526893c140fa"

[[comments]]
order = 1
subject = "اعتصام يا جماعة"
author = "بلال"
posted = "2006-04-05"
text = "الحمد لله العيال صحابي خلصوا الكلية قبل الفكيرة دي ما تطلع والله لو انا كنت مكانكم كنت اخدت مجموعة من كفاية ورحنا في مكتب العميدة الحلوة بتاعتكم دي وعملنا اعتصام يعني ولا اكل ولا شرب ولا محاضرات ولا مرواح لحد ما يبان لنا صاحب"
archived = "2006-04-20"
capture_url = "https://web.archive.org/web/20060420195618/http://www.masr.20at.com:80/article.php?sid=124&PHPSESSID=a417ce98b7af7a46e663526893c140fa"

[[comments]]
order = 2
subject = "وربنا ما كنت سكت"
author = "مشاكس"
posted = "2006-04-05"
text = "انا خلصت اعلام من بدري لكن اقسم برب العزة ان ده لو حضل ايامنا ما كنا سكتنا اساسا ، ول حتي وصلت للاعتصام والامتناع عن الحضور وحملة في التليفزيون والجرائد ..<br />يا جماعة موضوع يتنشر كدة وخلاض مش كلام لازم بجد تعملوا حاجة ده تهريج واسستعباط.. انت يا جماعة المفروض انكم اعلامي المستقبل وبتوع الكلام والتغيير .<br />انا مش فاهم ساكتين ليه واية لازمة الاسر واتحاد الطلاب جاتكم نيلة فيكم وفي جبنكم .<br />وسلبيتكم"
archived = "2006-04-20"
capture_url = "https://web.archive.org/web/20060420195618/http://www.masr.20at.com:80/article.php?sid=124&PHPSESSID=a417ce98b7af7a46e663526893c140fa"

[[comments]]
order = 3
subject = "الفساد فى كل مكان"
author = "محمد حسن"
posted = "2006-04-05"
text = "يا جماعه متزعلوش قوى كدة و استحملوا شوية و اهو كلة تدريب عشان اما تخلصوا و تطلعوا للحياة تبقوا اخدتم تدريب عملى على اللى انتوا هتشوفوة و الله انتوا المفروض تشكروهم و تترجوهم انهم يكتروا المقالب. على فكرة دى مش هستيريا دا بجد لان و الله الفساد وصل لكل مكان لكل جحر فى البلد دى. حتى اسالوا الناس بتوع البحث العلمى اللى انا واحد منهم ( مفيش حاجة اسمها بحث علمى فى مصر ) بعد ما كنت اتمنى طول عمرى انى انضم للبحث العملمى يا ريتنى ما انضميت لهم وادينى كنت بكرامتى فى القطاع الخاص. معلشى طولت عليكوا بس بجد لا تعملوا حاجة تغيروا بيها الواقع ياما تخرصوا خالص و متهللوش ع الفاضى."
archived = "2006-04-20"
capture_url = "https://web.archive.org/web/20060420195618/http://www.masr.20at.com:80/article.php?sid=124&PHPSESSID=a417ce98b7af7a46e663526893c140fa"
