posted = "2006-06-24"
text = "مبروك عليك انضمامك للشله اياها<br />و اكاد اجزم ان خلافتك لممتاز القط او عبدالله كمال او كرم جبر اصبحت شبه مؤكده<br />كما كسبت ثقه الداخليه<br />ربنا يتوب علينا من الاشكال المقرفه دى بقى<br />أأأأأأأأأأأأأأأأأأأأأأأه يـــــأ بــــــلــــــدى"
