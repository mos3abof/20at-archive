[[comments]]
order = 1
subject = "يا سلام علي النائب ... ويا سلام عليك انت كمان ياحمدي رزق ...آخرتها إيه"
author = "محمد السيد"
posted = "2006-06-17"
text = "مممممممم ...<br />جهاز إطلاق الشائعات .... طيب والله مكنتش أعرف إن جهاز زي ده موجود .... شوف إزاي ؟؟؟ إزاي يعملو حاجة زي دي من غير ما يقولوا لي ....؟؟<br />هم الإخوان كبار أوي كده وإحنا مش عارفين ...؟ والله أنا لما ألاقي حد عنده الامكانيات اللي ألناس بيتكلموا عنها بأقول إيه الجمال ده ...عندالإخوان ده كله .... ومش عارفين يحكموا العالم كله ..مش مصر بس ...؟<br />وبعد كده سيادة الكاتب ...هاجم الصحفيين والجماعات كلها بتوع الإشاعات .. ولاد الـ....!!!<br />وبعد كده الريس حمدي كان شوية ويدلع اللواء أحمد ضياء مساعد وزير الداخلية ...<br />في إيه ياعم حمدي ....<br />سيادتك .... في رايي المتواضع أكبر سيئة في المصري اليوم .... وربنا يشيل الغمم كلها ...<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619140028/http://masr.20at.com:80/article.php?sid=532"

[[comments]]
order = 2
subject = "عجبا"
author = "مصري مدحور"
posted = "2006-06-18"
text = "لا أدري لماذا يصاب كثير من الناس بالارتكاريا عند سماع ايم جماعة الإخوان المسلمين (أنا لست إخوانيا) ويخشون من وصول الإخوان لمناصب قيادية أو قوة محركة فب البلد, أليست هذه دولة مسلمة أم أننا صرنا مثل تركيا التي تمنع رجب طيب أردوغان من الترشيح لمنصب رئاسة الجمهورية لأن زوجته محجبه؟ ياللجرم!! قد نختلف مع بعض توجهات الإخوان وشعاراتهم ولكن ليعلم الناس جميعا أن هذا البلد وسائر بلاد المسلمين لن يصلح حالها إلا بالعودة إلى الدين بعد أن صار مجتمعنا جاهلا بدينه وبالطبع مقصر في حقوقه, ليست دعوة ترويجية للإخوان ولكن مرحبا بتوجه ديني يأتي بأشخاص ملتزمين يتقون الله يتولون شئون هذا البلد بدلا من أن نطلق نكاتا فقط مثل أن رئيسا منذ 25 سنة فقط سأل أحد الناس من أفضل أنا أم السادات فقال المواطن أنت طبعا لأن السادات كان يخشى أمريكا وأنت لا<br />فقال الرئيس من أفضل أنا ام عبد الناصر<br />فقال المواطن مسرعا أنت طبعا فناصر كان يخشى الاتحاد السوفيتي وأنت لا<br />فتهلل الرئيس وقال من أفضل أنا أم عمر بن الخطاب<br />فتحير المواطن قليلا ثم قال أنت طبعا فعمر كان يخشى الله وأنت لا"
archived = "2006-06-19"
capture_url = "https://web.archive.org/web/20060619140028/http://masr.20at.com:80/article.php?sid=532"

