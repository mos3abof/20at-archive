[[comments]]
order = 6
subject = ""
author = "نيفين نيفى نوفا"
posted = "2008-07-29"
text = "انا شفت البيت بيتك و مندهشتش من ان فيه ناس كتير متعلرفش ديانع شاهين لكن اللى دهشنى هو قول خيرى رمضان ان شاهيين اوصى بعد خروج جثمانه من الكاتدراءيع انع يمر بعمر مكرم<br />بس هو دع شاهين<br />التناقض المنسجم<br />من اول راءعته اسكندريه ليه لحد هى فوضى<br />هو ده شاهين المصير و الناصر صلاح الدين<br />و رغم اختلافنا حول اسلوبه و فلسفته فتاثابت اللى ميختلفش حوله اتنتين انه كان مبدع<br />وداعا شاهين"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014349/http://www.20at.com:80/masr/hot-topics/9734.html"

[[comments]]
order = 7
subject = ""
author = "مش شريف الدواخلي ولا البراء اش"
posted = "2008-07-29"
text = "طالما عمل فيلم اسمه الناصر صلاح الدين يبقى بكل تأكيد مات على الاسلام<br />لان الاقرار بالشهادتين اقرار قلبي وجزم عقائدي وهو امر خفي يظهر على تصرفات الانسان<br />وفيه مسيحيين كثير ظاهريا ومسلمين باطنيا"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014349/http://www.20at.com:80/masr/hot-topics/9734.html"

[[comments]]
order = 8
subject = ""
author = "ابومحسن"
posted = "2008-07-29"
text = "صدق الله العظيم<br />يا جماعة اي مسيحي في مصر نفسه يسلم<br />سيدنا المسيح ابن مريم عليه وعلى نبينا الصلاة والسلام جه زار مصر وعاش في مصر ودعا لاهل مصر وبناء عليه كانت مصر درة البلاد المفتوحة واصبحت قلب العالم الاسلامي ودخل شعب مصر كله في الاسلام ما عدا 6% فقط<br />وكل المسيحيين في مصر يتمنون ان يدخلوا في الاسلام ومعي الدليل<br />هو انني كثير مطالعة مواقع المسيحيين المصريين في خارج مصر وداخلها<br />والله العظيم يستخدمون ايات القرأن في التعبير عن مشاكلهم<br />يعني مثلا قرأت في موقع مايكل منير بتاع امريكا موضوع بعنوان<br />(ولا تجادلوا اهل الكتاب الا بالتي هي احسن)<br />كان يقصد الكاتب ان المسلمين هم اهل الكتاب<br />وموضوع ثاني قرأته في موقع عدلي ابادير<br />(ولن يرضى عنك المسلمين حتى تتبع ملتهم)<br />وكلام كتير اوي اوي يطول شرحه<br />فهما يقرون بالقران اقرار لا مثيل له ولكن الله يهدي من يشاء<br />والله العظيم بيصعبوا عليا لما بلاقيهم مش قادرين يسلموا<br />يا جماعة المسيحيين في مصر (اسلموا تسلموا)<br />ادعو ربنا انه يهديكم وتنطقوا الشهادتين"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014349/http://www.20at.com:80/masr/hot-topics/9734.html"

