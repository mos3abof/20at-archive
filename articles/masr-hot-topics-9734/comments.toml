[[comments]]
order = 12
subject = ""
author = "حسين محمد على"
posted = "2008-08-04"
text = "يوسف شاهين رحمة الله عليه ليس هو الأفضل بين المخرجين المصريين فهناك كمال الشيخ وصلاح ابو سيف ومحمد كريم واحمد بدرخان وغيرهم والجائزة التي حاز هليها في معرجان كان عن فيلمه المصير خارج المنافسه لم تكن إلا لرفع اسهمه في مصر وتزويده بشحنة من الجرأة والتجاسر على مصر الحضارة بعد ان اصابه الفشل في بعض افلامه الأخيرة كغودة الأبن الضال التي استقى فكرته من الكتاب المقدس والمصير واسكندرية ليه وأخيرا هي فوضى التي صبغها صبغة دينية ووظفها سياسيا فصفق له الفرنسيون لا لأنه ابدع ولكن لبشجيغه في تمرده والمضى في غيه البغيض كمسيحي كاثوليكي ذات جذور غير مصريه في رمي جمرات الشر على المجتمع المصري المسالم البسيط الطيب ."
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014349/http://www.20at.com:80/masr/hot-topics/9734.html"

[[comments]]
order = 13
subject = ""
author = "ابو غايب البغدادي"
posted = "2009-08-03"
text = "قبل كل شيء اقول رحم الله المخرج العريق والمصري الاصيل يوسف شاهين ثم اود الرد على التعليق المرقم (11) للأخ محمود زكي زخاري وذلك بدعوته الى ان يحمد ربه ويشكره على وجود حكومة قوية في مصر ماسكة بزمام الامور وان يتمنى ان لا يصيبها اي مكروه كما اصاب حكومة العراق السابقة للأحتلال الامريكي للعراق حيث ان \"جمرات\" ما يحدث في العراق موجودة في مصر (ونراها في فلسطين مثلا ذات المذهب الواحد!!) ولا اتمنى ان نرى ما سيحدث فيها (اي مصر) من \"بحار\" الدم في حالة خدوث اي مكروه للحكومة المصرية الحالية (لا سمح الله), وازيد بأن ما يحدث في العراق مرشح ان يحدث في كل الدول العربية والاسلامية وما هي حكومات هذه الدول الماسكة بزمام الامن بالقبضة الحديدية الا \"بنج\" او مسكن مؤقت للأنفجار الذي سيحدث ان عاجلا ام اجلا ولا حول ولا قوة الا بالله…"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014349/http://www.20at.com:80/masr/hot-topics/9734.html"
