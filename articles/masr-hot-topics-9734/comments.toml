posted = "2008-07-30"
text = "المقال ده عامل زى فيلم حسن ومرقص الفيلم خلانا ننزل فى بعض احضان وبوس وشوية وهسمع شعار الوحدة الوطنية والسلام الجمهورى يخرج من حناجر جحافل- متخضوش من جحافل دى - المصريين<br />خلاص بقى فيه شرخ كبييييييييييييي ييييييييييييييي ييييييييييييييي ير اعتقد انه ما ينفعش يتصلح والافضل ان كل واحد ينعزل عن التانى طالما احنا قتله وسفاكين دماء وخطافين وهما ملايكة العيبة ما تخرجش من بقهم"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014349/http://www.20at.com:80/masr/hot-topics/9734.html"

[[comments]]
