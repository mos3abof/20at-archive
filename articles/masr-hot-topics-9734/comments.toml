subject = ""
author = "اكتب اسمك هنا"
posted = "2008-07-29"
text = "انا على فكرة يا جماعة متابع عشرينات من مدة طويلة لأن مواضيعها شيقة و بتغطى بلدان كتير غير مصر.<br />لكن انا فى الفترة الأخيرة لاحظت ان تقريبا كل موضوع فى عشرينات لازم الاقى فيه تعليق \"ايه الموضوع الغبى دا\" أو \"و احنا استفدنا ايه يعنى من الكلام الهايف دا\" , اكننا خلاص كلنا بقينا علماء و رجال اعمال و ضيعنا كتير من وقتنا الثمبن فى قراءة موضوع, يا جماعة اختلاف الرأى لا يفسد فى الود قضية , و اللى مش هيعجبك هيعجب غيرك , و مش لازم احس ان فيه ناس مخصوص بتدخل علشان تخنق اللى بيحاول يكتب أى موضوع عن أى حاجة.<br />يا ريت نبقى واسعين الأفق أكتر"
archived = "2009-12-13"
capture_url = "https://web.archive.org/web/20091213014349/http://www.20at.com:80/masr/hot-topics/9734.html"

