text = "اذا وقف بين يدي الله عز وجل , خلوا افلامه تنفعه ساعتها , وش قدم لنفسه …؟؟؟!!!<br />يعني اذا كان عاجبكم بسال وش قدم عشان ينفعنا بحياتنا او تحسن صورتنا كامه قدام جميع الامم ؟؟؟!!!<br />اكيد ولا شي … وكلنا عارفين يوم صرح وقال صوت الاذان يزعجني<br />كلامه الحين ينسال عنه ,,, وفي نار جهنم يارب اللهم امين"
