posted = "2008-07-31"
text = "ما هذاالهراء بخصوص الديانة باللة عليكم ماذا تفرق الديانة اليس هذا الراحل مصريا ام مازا؟<br />جميعنا مصريين و يجمعنا تراب هذا الوطن باختلاف العقيدة<br />نحن مصريين جميعنا رغم اختلاف القيدة<br />والحمد للة اننا نعيش فى مصر و ليس فى العراق المخروب<br />اشكرك يا رب العباد"
