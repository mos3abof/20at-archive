author = "ما بحبش الكلاب"
posted = "2010-03-12"
text = "يطلع اية صفوت الشريف<br />كتب كم كتاب<br />او كم صفحة<br />او كم مقالة<br />فكرة السياسى اية<br />الهوهوة والتسبيح بحمد النظام والحاكم وابنة<br />انا طول عمر لا احب الكلاب<br />وخصوصا اذا كانت كلاب السكك"
archived = "2010-03-15"
capture_url = "https://web.archive.org/web/20100315004614/http://www.20at.com:80/masr/news/15705-2010-03-11-11-24-23.html"
