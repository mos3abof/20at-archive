author = "البرادعى ممنوع"
posted = "2010-03-11"
text = "بالدستور الحالى لا يوجد اى ذرة امل لترشيح البرادعى او ايمن نور<br />اولا للترشيح يجب ان يكون عضو فى حزب والبرادعى ليس عضو فى حزب وثانيا ان يكمل عضوية فى الحزب اكثر من سنة ليحق لة الترشيح فلو انضم البرادعى لحزب الوفد اليوم فلن تكون قد مرت سنة على عضويتة قبل الترشيح<br />يعنى البرادعى برة اللعبة قانونا"
archived = "2010-03-15"
capture_url = "https://web.archive.org/web/20100315004614/http://www.20at.com:80/masr/news/15705-2010-03-11-11-24-23.html"

