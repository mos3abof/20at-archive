[[comments]]
order = 19
subject = "ربنا يهدى"
author = "الاخ الحسن النيه صاحب تعليق رجاء :"
posted = "2006-12-23"
text = "اسرائيلى ايه اللى داخل يوقع بين العرب يا عم الحج صباح الفل ، ما تدخل كده على اى موقع سعودى هتلاقى الكلام ده واكتر او اسأل اى حد راح السعوديه واشتغل واحتك بعامه الناس هناك (مش راح سياحه مثلا ولا حج) هتلاقى من الكلام ده كتير اوى ، او روح ماتش كوره ضد فرقه سعودى و اسمع اللى بيتقال ، بلاش دى اسأل حد فى جامعه خاصه معاه حد سعودى هتلاقيه جاى هنا و بيتعلم هنا و برضه بيشتم ، بلاش نضحك على نفسينا و نقول ده حد بيوقع ولا نقول دى قله ... لا فى مشكله حقيقيه فى العلاقات العربيه العربيه على مستوى الشعوب تصل الى حد العداء و الكراهيه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

