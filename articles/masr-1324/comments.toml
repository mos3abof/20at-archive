[[comments]]
order = 1
subject = "عيب يا عم الصحفي"
author = "واحد واقعي"
posted = "2006-12-19"
text = "انا و الله مش شايف الكلام اللي بيتنشر وحش بس المشكلة ان الصحفي اللي عامل الموضوع اللي اسمه هاني الاعصر لو مسلم فياريت يقول لنا هو بيعمل الموضوعات دي ليه و لو مسيحي فياريت ماينشرش المواضيع دي في موقع معظم اللي بيقروا شغلوا فيه ناس عاوزه مصيبة و تشبع فيها لطم لو الناس اللي في الموقع فعلا هدفهم مصلحة الاسلام و المسيحية و مصر فانا معنديش مانع الكلام ده يتنشر و لو الناس معظمهم مش كلهم ارهابيين فياريت بلاش تكتب الكلام ده في الموقع ده"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

[[comments]]
order = 2
subject = "منين اجيب ناس قصيده جديده"
author = "محمد المصرى"
posted = "2006-12-19"
text = "منين اجيب ناس لمعناة الكلام يتلوه<br />ان صح قولى اشهدولى وأن كان غلط انسوه<br />أنا المصرى اللى طول عمرى بالحديد حكموه<br />اكلونى لحم ولما ما فضلش غير العضم رموه<br />عايش ومش عايش والعيشه بقت مره<br />سنين طويله مافرحتش ولا مره<br />والكدب شغال عن افراج جايه ومسره<br />انا مش لاقى ااكل وبيكلمنى ع الذره<br />يا اخواناما فى شىء فى بلدنا ما تبعشى<br />طب والفلوس راحت فين اناعن نفسى معرفشى<br />ولو حد سأل كانوا فى المعتقل نفخوه<br />بياع وسمسار وحواليه الكلاب يحموه<br />طيار وجبار وعلى تلها مبلط<br />لا والمصيبه عايز ابنه كمان يلهط<br />طايح فى عزبة ابوه فرحان ومزقطط كان يوم مهبب يوم ما البعيد ولدوه"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

