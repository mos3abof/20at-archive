subject = "انت مش مسلم"
author = "بحب المسلمين"
posted = "2006-12-19"
text = "علي فكرة مايصحش تشتم علينا كدة انت مالكش اي فضل في انك مسلم و لا انا لي ا فضل في اني مسيحي و انت بالشكل ده مش مسلم لانك مش بتنفذ و صايا الرسول اللي وصاكم باقباط مصر و علي فكرة احنا دينا بيقولنا لما حد يشتمنا نسامحه و اعتقد ان الاسلام مش بيقول عكس كدة انتوا طول النهار بتتفاخروا بالاسلام ياريت تنفذوه"
archived = "2007-01-28"
