subject = "المصريين الى اين ؟؟"
author = "ابو فارس"
posted = "2007-01-05"
text = "أوسخ شعب يعيش في الخليج وخصوصا السعوديةهم هؤلاء الفراعنة الملحدين النصابين والمحتالين الذي يبيع شرف زوجته واخته من اجل 200 ريال او صاروخ حشيش واقول لكم يامصريين لولا الخليج لانتم احقر واسفل مما عليه انتم الان رواتبكم التي تأخذونها هي من نفطنا وراتب رئيسكم البقرة الضاحكة هذا الفرعوني الخسيس من نفطنا ولولا الملك فهد يرحمه الله لهذا البقرة الضاحكة يبحث في الزبالة عن فتات الخبز كما شعبه الشحات الذي ينصب على بعضه البعض هو فقير ونصهم في السجون ويعملون في البطالة والى الذي يقول مصاحب سعودية 5 سنوات هذي ياخي غير سعودية هذي هي من بقايا الحجاج وبالتأكيد اصلها مصري فرعونية عاهرة رماها شط البحر الاحمر فيزة حاجة وبقت في السعودية الى ان ذهبت للدراسة في بلدكم بلد البنت العاهرة او لاجل العهر ومهما تكلمتم عننا لن نضعف ولن تهزنا كلمة فرعوني حقير لان ملفاتكم سوداء وتاريخكم ملئ بالوساخة والعهر والفجر من ايام الملك فاروق الى هذا البقرة الضاحكة الذي يدفع لاسرائيل ملايين الدولارات كي تحميه وكي يجلب العاهرات لينام معهم يومياوالى من يقول نحن بتوع عيال وبتوع خدم اولا انظر الى مافي بلدك من حقارات وتفاهات وبطالة ووضعكم المخزي بعدين تعال وتكلم والقي حقدك وقهرك الدفين وتهمك الباطلة علينا وانتم من زرع العنصرية ونظرة التكبر بين الشعوب العربية من قديم الزمان ومن لايعلم ذلك فليرجع الى تاريخ مصر وارض الكنانة وام الدنيا."
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

[[comments]]
order = 22
subject = "رحم الله عبدالناصر"
author = "فارس"
posted = "2007-01-16"
text = "حملت جبال الحب فيك وإنني ِ.<br />لأعجز عن حمل القميص واضعف ِ .<br />حبي لك لا عن حسن ولا عن سماحة ً .<br />ولكنه شيء به الروح تكلف ِ .<br />والله ما طلعت شمس ولأغربت .<br />إلا وحبك مقرون بأنفاسي ِ .<br />ولا تنفست مسروراً ومكتئبا ً .<br />إلا وأنت صهيني بين أنفاسي ِ .<br />ولا شربت شراب الماء من عطش ً .<br />إلا رأيت خيال منك في الكاسي ِ .<br />الله يرحمك يا عبد الناصر انتي اللي خليت الخليجة دوله بني ادمين وبعدين<br />خلونا احنا تحت جزمتهم<br />لكن السبب كان واحد مننا هو اللي خلي النصاري والخليجيين بيعملوا فينا ده<br />انا لله وانا اليه راجعون<br />رحم الله الزعيم الفذ جمال عبدالناصر"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

