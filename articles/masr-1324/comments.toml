posted = "2007-01-26"
text = "السلامعليكم ورحمة الله وبركاتة الي بيشتم مريض ربنا يهدة ويعافيه والي يرد علية اتعدى منة مصري اية وسعودي اية دى دعوى جاهلية نسيتوا ان سيدنا بلال كان حبشي وسيدنا صهيب كان رومي وسيدنا سلمان كان فارسي كلهم مسلمين جنسيتهم الاسلام لا يفقنا عرق ولا دولة ولا لون ام عن دولة الاقباط هما اصلهم بيستعبطوا لان قبطي معناها مصري يعنى كل المصرين اقباط مش النصارى بس هما الي مصرين من اهل البلد اما ان تقوم دولة نصرانية في مصر دة ممكن لو قدروا يموتوا كل المسلمين اما كونها تبقى دولة اسلامية فدة اكيد قريب باذن الله دعووات كل المسلمين لمصر"
