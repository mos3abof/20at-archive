text = "كل السعوديين مغتصبين عيال ، يموتوا في نيك العيال ، ونسواهم وبناتهم شغالين شغل كويس مع السواقين والخدم .. وبعدين يقولوا أحلى من الشرف مفيش ، صحيح مفيس مخ ... يا جرب"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

[[comments]]
order = 15
subject = "كل إناء بما فيه ينضح"
author = "مسلم عربي مصري"
posted = "2006-12-20"
text = "دعكم من يسب يسب فهو ينم عن جهل ووضاعة في التربية ، دعكم من تبادل الشتائم مع هؤلاء ، فترفع جميعاً عن البذاءة وأعلموا هناك أخت لكم تدخل على الموضوع وعيب قوي تجد مثل تلك الألفاظ ، والخليجي من اثار الموضوع لماذا تدخل على موقع مصري وأنت تغل لهم كل هذا الغل ، سأقول لك كلمة واحدة .. كل إناء بما فيه ينضح ... عارف يعني أيه ينضح .. أكيد أنت مش عارف حاجة في أي حاجة غير حاجة واحدة ... سأترفع عن ذكرها لأنك أنت أعلم بأحوالك يا مريض نفسياً"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

[[comments]]
order = 16
subject = "الي الاخ مصري عربي مسلم"
author = "مصري غيور"
posted = "2006-12-20"
text = "يا أخي طريقة التمسكن والتذلل لهؤلاء الاعراب التي تكتب بها تزيد من طمعهم فينا وسيبك من حكاية العروبة والقومية لاننا عندما زرنا هذه الدول وتعاملنا مع هذه الشعوب الهمجية البدائية وجدنا حقدهم وكراهيتهم الكبيرة لكل ما هو مصري دول ما ينفعش معاهم غير ضرب الجزمة علي دماغهم وعن تجربة اذا عاملت أي خليجي وسعودي بالذات بأدب عمره ما يحترمك لازم تعامله بكل احتقار عشان يحترمك اوي"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

