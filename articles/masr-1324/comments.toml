[[comments]]
order = 5
subject = "دولة علمانية"
author = "مصرية مهمومة"
posted = "2006-12-19"
text = "ياجماعة احنا اساسا دولة علمانية والعلمانية مختلفة عن المسيحية او اى شى تانى لانها بتقوم اساسا على فصل السياسة عن الدين يعنى الاصلح بس بغض النظر عن دينه او لونه او اى حاجة تانى<br />الناس اللى بتشتم بقى<br />ياجماعة عيب والاسلام بيرفض الى بتعملوه ده وهافكركم بحديث الرسول صلى الله عليه وسلم(من اذى كتابيا فانا حجيجه يوم القيامة) صدق رسول الله صلى الله عليه وسلم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

[[comments]]
order = 6
subject = "مصر منبع الدعاره"
author = "خليجي تاج راس كل مصري"
posted = "2006-12-19"
text = "لعنة الله عليهم هؤلاء ( اعزكم الله ) المصريين الكلاب<br />نعم فان النصب والاحتيال منبع الرئيسي هو مصر ( اعزكم الله )<br />لعنة الله على مصر ( اعزكم الله ) وعلى شعبها الحرامي الواطي الوسخ المعفن الكلاب<br />حقا المصريين ( اعزكم الله ) اوصخ شعوب الارض واكثرهم حقاره ونذاله<br />يكفي ان ابليس باض في بلدهم النتنه العفنه<br />اتتتتففففوووو على مصر ( اعزكم الله )<br />اتتتففففوووو على شعب مصر ( اعزكم الله )<br />اتتتففففوووو على كل من قال انا مصري ( اعزكم الله )<br />بلد الرقاصات والحراميه والشحاذين والمنافقين والكلاب<br />اشرف بنت مصريه ( اعزكم الله ) فيفي عبده<br />للبيع مصريه ( اعزكم الله ) شريفه لم يدخل في طيزها سوى الف زب<br />المصري ( اعزكم الله ) ينقهر اذا ماعنده اخت حلوه لانه ما يقدر يعطيها حق خليجي ينيكها ههههههههههههههههههههه<br />بخمسه جنيه تشتري مصر ( اعزكم الله ) وشعبها الوسخ من شماله الى جنوبه<br />تعطي المصري ( اعزكم الله ) جنيه يجيب لك اخته تنيكها<br />لعنة الله عليكم يا مصرييين ( اعزكم الله ) يا وقحين<br />لعنة الله عليكم يا مصرييين ( اعزكم الله ) يا وقحين<br />لعنة الله عليكم يا مصرييين ( اعزكم الله ) يا وقحين<br />لعنة الله عليكم يا مصرييين ( اعزكم الله ) يا وقحين"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

