subject = "العب غيرها ياوسخ"
author = "مصرى"
posted = "2006-12-19"
text = "والله ما يقول هذا الكلام الا انسان سافل عديم الدين والضمير وطبعا انت هدفك ومرادك ان المصريين ترد عليك وعلى كل خليجى ابدا يا اسرائيلى يا جبان عمرنا ما حنبلع الطمع ونعمل الحريقه اللى نفسك فيها ولا مؤاخذه خليها.......... اكيد فهمت يا حقير"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

[[comments]]
order = 9
subject = "دين ام العرب"
author = "المصريين كلهم"
posted = "2006-12-20"
text = "انا مش عارف احنا مصريين مع بعض اقباط مسلميين<br />ملحدين علمانيين مخبرين مصيفين<br />مال ام العرب ولاد الوسخة بينا<br />احنا حرين مع بعض ناكل بعض انتوا مالكم يا ولاد الوسخة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

[[comments]]
order = 10
subject = "عمل مشين"
author = "معاذ محمود عامر"
posted = "2006-12-20"
text = "بدون شك هذا تصرف مشين ولا يهدف إلا إلى فتنة أو أن صاحبه غير واع تماما بما يفعل<br />ولكن النقطة الأهم أن هذا هو رد الفعل الطبيعي وهذا هو المتوقع حدوثه عندما ينادي كل طرف بدولة دينية<br />والمفروض أن مصر لا إسلامية ولا مسيحية ويهودية ولا يجوز للدولة أن يكون لها دين معين فيحدث تمييز على أساسه بين المواطنين وبعضهم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

[[comments]]
order = 11
subject = "بيقولوا أشراف"
author = "المصري سيدك"
posted = "2006-12-20"
text = "شوفوا نسوانكم من برا هلا هلا ومن جوه يعلم الله .. أنتم أهل الدعارة والشرمطة ، أنا مرافق واحدة سعودية هنا مصر عايشة معايا 5 سنوات ، يامغفلين يا جهلة ، أنتم معروفين عنكم بتوع الجنس والخمر والنسوان والعيال ، أنتم من بدعتم اغتصاب البذور يا عقول كلها بذور ، جاتكم نيلة ناس بقر"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

[[comments]]
order = 12
subject = "الي الخليجي الكلب النجس"
author = "مصري حاطك تحت جزمته"
posted = "2006-12-20"
text = "يا أحط المخلوقات وأنجس الحيوانات أسمعيا خنزير الاعراب يا من تلبس علي رأسك طرحة مثل النساء بذمتك أنت عارف مين أبوك وامك متناكة من الهنود والبنجالة السواقين اللي طايحين نيك في كس امك وييجوا مصؤ ويقلعوا العباية ويلبسوا كل ما هو خليع عشان يجيبوا رجل مصري ينيكهم وينيك رجالتهم اللي معاهم عشان شاذين وخولات اتفو عليك وعلي كس امك شعوب عقلها في طيازها ولاد ستين الف شرموطة"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

[[comments]]
order = 13
subject = "مين تاج راس مين يا خروف"
author = "اتشرف أني مصري"
posted = "2006-12-20"
text = "الى السعودي القفل<br />أعرف ازاي تلبس جزمة الأول وبعدين نظف نفسك يا وسخ وبعدين تعال نعلمك ازاي تتلكم زي الناس يا خروف ...<br />انتم آخر ناس أجلاف تتكلموا عن المصريين أسيادكم وتاج رؤوسكم من التخين فيكم ، نسوانكم جوه كده كده وبره كده على كده ، خلي الطابق مستور وبلاش نفتح المستخبي ، نسوانكم سكر وعربدة تتمنى واحد مصري بس ... عارف ليه ... مش هقولك على أنت من الخرفان اياهم يا خروف عتيبي ، طيزك كلها ليه حبيب أمك يا معفن يا نجس يا واطي يا زبالة العرب يا خرووووووف<br />يا سعودي يابقري ، عملت أيه فلوسكم نظفت مخكم ، منظرة وفشخرة ووسخة ونجاسة ، اتلم ولم نفسك ، وأنا قاعدلك وراني ليتك يا خروف ماو ماو ... صحيح القوالب نامت والأنصاص قامت . يا نص كم"
archived = "2007-01-28"
capture_url = "https://web.archive.org/web/20070128102234/http://masr.20at.com:80/article.php?sid=1324"

[[comments]]
