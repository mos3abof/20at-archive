posted = "2009-01-17"
text = "مع احترامى وتقديرى للدور المصرى لكن اتمنى فى نفس الوقت ان ترفع مصر يدها وتترك الحرب الفلسطنية الاسرائيلية تدور وتشتعل حتى تنتهى بنصر طرف وهزيمة الاخر !! حماس الارهابية تريد الحرب واسرائيل فى نفس الوقت تريد الحرب !! حماس من تحت الانقاض تقول لنا انها حققت نصرا على اسرائيل فقد استطاعت صواريخ حماس الورقية ان تصيب بعض سكان المستوطنات بالهلع ( تخيلوا هلع ) اذن بالنترك الحرب ولا دخل لنا بمن يقتل من الفلسطنين ومن يهلع من الاسرائيلين ,, واخيرا اتمنى ان تكون تلك الحرب عبره وعظه للجميع حتى لا يثق احد بعد اليوم فى المتأسلمين وادعياء الدين ممن اطلقوا اللحى ونشروا الحجاب الاخوانى واستعرضوا عضلاتهم فى الداخل فقط فبثوا الرعب والخوف فى نفوس مواطنيهم , اما وقت الجد ووقت الحروب فيختفوا فى الجحور ويتركوا اوطانهم تدمر ويتركوا اطفالهم ونسائهم فى مواجهة العدو !! حينما اشاهد صور الضحايا فى نشرات الاخبار اجدهم من الاطفال والنساء وكبار السن والغريب انى لا اجد اصحاب اللحى والذقون من بين الضحايا !! لماذا !! لانهم كالعادة تركوا ارض المعركة وذهبوا الى جحورهم ."
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105152426/http://20at.com/masr/egyptian-blogs/10897.html"

