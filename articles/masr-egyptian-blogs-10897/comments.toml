text = "ربنا يخرب بيت حماس على بيت الاخوان المتأسلمين على بيت ايران , هم دول سبب البلاوى والكوارث والنكبات !! وهنا اتمنى من الرئيس مبارك ان يبتعد حماس ويلغى المبادرة المصرية والسبب اسرائيل تريد الحرب وحماس تريد الخراب ( نسبهم بقى يولعوا فى بعض ) ."
