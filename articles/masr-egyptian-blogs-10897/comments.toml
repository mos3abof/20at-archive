author = "نزار قباني"
posted = "2009-01-07"
text = "ثلاثية \"أطفال الحجارة\" لنزار القباني<br />بهروا الدنيا<br />وما في يدهم إلا الحجارة<br />وأضاؤوا كالقناديل<br />وجاؤوا كالبشارة.<br />قاوموا<br />وانفجروا<br />واستشهدوا<br />وبقينا دببا قطبية<br />صفحت أجسادها ضد الحرارة.<br />قاتلوا عنا<br />إلى أن قتلوا<br />وبقينا في مقاهينا<br />كبصاق المحارة:<br />واحد<br />يبحث منا عن تجارة<br />واحد<br />يطلب مليارا جديدا<br />وزواجا رابعا<br />ونهودا صقلتهن الحضارة<br />واحد<br />يبحث في لندن عن قصر منيف<br />واحد<br />يعمل سمسار سلاح<br />واحد<br />يطلب في البارات ثاره<br />واحد<br />يبحث عن عرش وجيش<br />وإمارة.<br />آه يا جيل الخيانات<br />ويا جيل العمولات<br />ويا جيل النفايات<br />ويا جيل الدعارة<br />سوف يجتاحك -مهما أبطأ- التاريخ.<br />أطفالَ الحجارة.<br />يا تلاميذ غزة<br />علّمونا<br />بعض ما عندكم<br />فنحن نسينا..<br />علمونا<br />بأن نكون رجالا<br />فلدينا الرجال<br />صاروا عجينا..<br />علمونا<br />كيف الحجارة تغدو<br />بين أيدي الأطفال<br />ماسا ثمينا..<br />كيف تغدو<br />دراجة الطفل لغما<br />وشريط الحرير<br />يغدو كمينا..<br />كيف مصاصة الحليب<br />إذا ما اعتقلوها<br />تحولت سكينا.<br />يا تلاميذ غزة<br />لا تبالوا<br />بإذاعاتنا<br />ولا تسمعونا..<br />اضربوا<br />اضربوا<br />بكل قواكم<br />واحزموا أمركم<br />ولا تسألونا..<br />نحن أهل الحساب<br />والجمع<br />والطرح<br />فخوضوا حروبكم<br />واتركونا..<br />إننا الهاربون<br />من خدمة الجيش<br />فهاتوا حبالكم<br />واشنقونا..<br />نحن موتى<br />لا يملكون ضريحا<br />ويتامى<br />لا يملكون عيونا..<br />قد لزمنا جحورنا<br />وطلبنا منكم<br />أن تقاتلوا التنينا..<br />قد صغرنا أمامكم<br />ألف قرن<br />وكبرتم<br />خلال شهر قرونا.<br />يا تلاميذ غزة<br />لا تعودوا<br />لكتاباتنا ولا تقرؤونا..<br />نحن آباؤكم<br />فلا تشبهونا..<br />نحن أصنامكم<br />فلا تعبدونا..<br />نتعاطى<br />القات السياسي<br />والقمع<br />ونبني مقابرا<br />وسجونا.<br />حررونا<br />من عقدة الخوف فينا<br />واطردوا<br />من رؤوسنا الأفيونا..<br />علمونا<br />فن التشبث بالأرض<br />ولا تتركوا<br />المسيح حزينا.<br />يا أحباءنا الصغار<br />سلاما<br />جعل الله يومكم<br />ياسمينا..<br />من شقوق الأرض الخراب<br />طلعتم<br />وزرعتم جراحنا<br />نسرينا..<br />هذه ثورة الدفاتر<br />والحبر<br />فكونوا على الشفاه<br />لحونا..<br />أمطرونا<br />بطولة وشموخا<br />واغسلونا من قبحنا<br />اغسلونا..<br />لا تخافوا موسى<br />ولا سحر موسى<br />واستعدوا<br />لتقطفوا الزيتونا..<br />إن هذا العصر اليهودي<br />وهم<br />سوف ينهار<br />لو ملكنا اليقينا.<br />يا مجانين غزة<br />ألف أهلا<br />بالمجانين<br />إن هم حررونا..<br />إن عصر العقل السياسي<br />ولى من زمان<br />فعلمونا الجنونا.<br />يرمي حجرا<br />أو حجرين<br />يقطع أفعى إسرائيل إلى نصفين<br />يمضغ لحم الدبابات<br />ويأتينا<br />من غير يدين..<br />في لحظات<br />تظهر أرض فوق الغيم<br />ويولد وطن في العينين..<br />في لحظات<br />تظهر حيفا<br />تظهر يافا<br />تأتي غزة في أمواج البحر<br />تضيء القدس<br />كمئذنة بين الشفتين..<br />يرسم فرسا<br />من ياقوت الفجر<br />ويدخل<br />كالإسكندر ذي القرنين..<br />يخلع أبواب التاريخ<br />وينهي عصر الحشاشين<br />ويقفل سوق القوادين<br />ويقطع أيدي المرتزقين<br />ويلقي تركة أهل الكهف<br />عن الكتفين..<br />في لحظات<br />تحبل أشجار الزيتون<br />يدر حليب في الثديين..<br />يرسم أرضا في طبريا<br />يزرع فيها سنبلتين..<br />يرسم بيتا فوق الكرمل<br />يرسم أما تطحن عند الباب<br />وفنجانين..<br />في لحظات تهجم رائحة الليمون<br />ويولد وطن في العينين..<br />يرمي قمرا من عينيه السوداوين..<br />وقد يرمي قمرين..<br />يرمي قلما<br />يرمي كتبا<br />يرمي حبرا<br />يرمي صمغا<br />يرمي كراسات الرسم<br />وفرشاة الألوان..<br />تصرخ مريم يا ولداه<br />وتأخذه بين الأحضان..<br />يسقط ولد<br />في لحظات<br />يولد آلاف الصبيان..<br />يكسف قمر غزاوي<br />في لحظات<br />يطلع قمر من بيسان..<br />يدخل وطن للزنزانة<br />يولد وطن في العينين..<br />ينفض عن نعليه الرمل<br />ويدخل في مملكة الماء..<br />يفتح أفقا آخر<br />يبدع زمنا آخر<br />يكتب نصا آخر<br />يكسر ذاكرة الصحراء..<br />يقتل لغة مستهلكة<br />منذ الهمزة حتى الياء..<br />يفتح ثقبا في القاموس<br />ويعلن موت النحو<br />وموت قصائدنا العصماء..<br />يرمي حجرا<br />يبدأ وجه فلسطين<br />يتشكل مثل قصيدة شعر..<br />يرمي الحجر الثاني<br />تطفو عكا فوق الماء قصيدة شعر..<br />يرمي الحجر الثالث<br />تطلع رام الله بنفسجة من ليل القهر..<br />يرمي الحجر العاشر<br />حتى يظهر وجه الله<br />ويظهر نور الفجر..<br />يرمي حجر الثورة<br />حتى يسقط آخر فاشستي<br />من فاشست العصر..<br />يرمي<br />يرمي<br />يرمي<br />حتى يقلع نجمة داوود<br />بيديه<br />ويرميها في البحر..<br />تسأل عن الصحف الكبرى<br />أي نبي هذا القادم من كنعان؟<br />أي صبي<br />هذا الخارج من رحم الأحزان؟<br />أي نبات أسطوري<br />هذا الطالع من بين الجدران؟<br />أي نهور من ياقوت<br />فاضت من ورق القرآن؟<br />يسأل عنه العرافون<br />ويسأل عنه الصوفيون<br />ويسأل عنه البوذيون<br />ويسأل عنه ملوك الجان:<br />من هو الولد الطالع<br />مثل الخوخ الأحمر..<br />من شجر النسيان؟<br />من هو هذا الولد الطافش<br />من صور الأجداد<br />ومن كذب الأحفاد<br />ومن سروال بني قحطان؟<br />من هو هذا الباحث<br />عن أزهار الحب<br />وعن شمس الإنسان؟<br />ومن هو هذا الولد المشتعل العينين<br />كآلهة اليونان؟<br />يسأل عنه المضطهدون<br />ويسأل عنه المقموعون<br />ويسأل عنه المنفيون<br />وتسأل عنه عصافير خلف القضبان:<br />من هو هذا الآتي<br />من أوجاع الشمع<br />ومن كتب الرهبان؟<br />من هو هذا الولد<br />التبدأ في عينيه<br />بدايات الأكوان؟<br />من هو<br />هذا الولد الزارع<br />قمح الثورة<br />في كل مكان؟؟<br />يكتب عنه القصصيون<br />ويروي قصته الركبان:<br />من هو هذا الطفل الهارب من شلل الأطفال<br />ومن سوس الكلمات؟<br />من هو<br />هذا الطافش من مزبلة الصبر<br />ومن لغة الأموات؟<br />تسأل صحف العالم:<br />كيف صبي مثل الوردة<br />يمحو العالم بالممحاة؟<br />تسأل صحف في أمريكا<br />كيف صبي غزاوي<br />حيفاوي<br />عكاوي<br />نابلسي<br />يقلب شاحنة التاريخ<br />ويكسر بلّور التوراة؟؟"
