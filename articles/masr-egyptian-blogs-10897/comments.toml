text = "اتق الله يا من تقدح في حماس وفي اسلوبها في المقاومة وتتهمها بانها تختبيء في الجحور وتترك النساءوالاطفال ، انت لا تعلم قدراتهم وطريقتهم واستراتيجياتهم ، بل فقط تتهمهم وتساعد عدوهم ، هذا بدلا من ان تشد من عضدهم ، اذا كان يا سيدي المقاومون للعدو هم في الجانب الخطأ فمن بربك في الجانب الصواب ، اتق الله وراجع نفسك ، اذا هجمت اسرائيل بكل وسائلها التقنية والحربية والاسلحة المحرمة دوليا تريد ان تقتلع حماس من تلك الارض تقتلع الشوكة التي تقف في حلقها وتمنعها هي وكل من يقاوم من ابتلاع ما تبقى من فلسطين وتنغص عليها حياتها ، ولا تتركها تستمتع بما اخذته ، ا على الاقل لا تجعل اخذه سهلا هينا وانت تريد ان يقفوا بصدورهم لكل هذه القوة العسكرية ويقولوا هانحن اقتلونا قبل النساء والاطفال واتركوهم ثم بعد ان تقتلونا اكملوا احتلالكم للارض واكملوا حلمكم وليبقى النساء والاطفال معززين مكرمين في ظل احتلالكم وتخلصوا من كل من يريد ان يقاومكم بكل سهولة ها نحن اولئك اقتلونا حتى لا يقول قائل باننا نهرب ، وبدلا من ان يعتبرنا في صف المقاومين والشهداء ، يصمنا بننا نهرب ونحتمي بالاطفال . . . للاسف انقلبت الموازين"
archived = "2010-01-05"
capture_url = "https://web.archive.org/web/20100105152426/http://20at.com/masr/egyptian-blogs/10897.html"
