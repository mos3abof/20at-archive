[[comments]]
order = 22
subject = "للجميع"
author = "مواطن مغترب"
posted = "2006-05-26"
text = "حرام عليكم الكلام ده اقول كلامي لكل اللي بيشتموا عمال علي بطال ويقولوا علي من يمدح في مبارك انه منافق وانة قبض فلوس اواواو<br />ليه انا الان برة البلد ومغترب علشان لقمة العيش ولم انتظر من الحكومةالوظيفة او يحلولي مشاكلي لاني اعرف تمام المعرفة ان حسني مبارك ليس امير المؤمنين عمر ابن الخطاب الذي كانت جيوشة تغزو العالم وترسل لهالاموال من كل مكان ولكني اعرف اننا وفي مصر غول يأكل الاخضر واليابس وهو الانفجار السكانى لعلمكم انا سافرت الي اكثر من دولة عربية<br />وموضوع البطالة منتشر اكثر من عندنا بالنسبة المؤوية لعدد السكان والمحسوبيةكذلك اما عن الديمقراطية الله يرحم ايام زمان لما كنت اقول اسم الريس واتلفت يمين ويسار خوفا اما الان انتم في نعمة لم تحسوا بها انتم الان تتجمعون وتتظاهرون وتنشؤون مدونات ومواقع علي النت بكل حرية ولكنكم فاكرين ان الحرية شتيمة الريس واسرتة والذى قال في اكثر من مناسبة انه لن يورث حكمة لابنة ولكنكم مصممون علي قول ذلك في كل مناسبة<br />اخواني يا من ترفعون شعار ان حسني احتل مصر اطلب منكم ان لا تتحدثو بأسمي وتقولوا اني اكره مبارك وارجو منكم ان لا تقولوا عني انني منافق وارجو منكم ان تقولوا لي من دفع لكم لكي تعكرو صفو مصر وتسمموا شباب مصر بهذا الكلام الذي لولا الديمقراطية لما سمعنا عنكم وقرأنا لكم واطب من كل واحد منكم ان يقدم الحلول لجميع مشاكلنا بدل الشتيمة والتجريح ."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

