posted = "2006-06-13"
text = "اقول للبيشتموا مبارك ( انتم بهايم لانكم بتشتموه الان ويوم القيامة هياخد الشتيمة منكم حسنات )<br />انا اقترح للجميع ان كل واحد منا<br />اما ان يفضح مسؤلا<br />او يذكر مشكلة من مشاكلنا نحن الشعب المصري ويذكر معها طريقة التغلب عليها<br />اما الشتيمة فهي ذم في حق من تشتموه وهي تصدر من جبان عندما لا يقدر ان يواجه خصمة فيشتمه في غيابه ولا نريد ان نكون كذلك<br />وللعلم انا لست عميلا لاحد لاي مسافر برة البلد من 16 سنة"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

