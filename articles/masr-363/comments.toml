text = "كفاية قرف بقى من المنافقين إللى عمالين يكتبوا عن حسنى مبارك هو إنتم عايزين تعملوله شعبية بالعافية يا بهوات التاريخ لا يخلد إلا الأبطال ولا يجمع شعب على باطل والشعب المصرى كله أجمع على كراهيته لحسنى مبارك وإبنه يبقى كفاية قرف ونفاق"
