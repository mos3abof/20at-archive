[[comments]]
order = 29
subject = "عايز أقول حاجة"
author = "مصرى"
posted = "2006-05-26"
text = "السلام عليكم ورحمة الله وبركاته<br />أحبائى فى الله<br />أحنا كلنا مصريين ومايصحش يكون هو دة إسلوب التفاهم مع بعض لا زم نكون متحضرين أكثر من كده بس أنا نفسى أقول إن حسنى مبارك بقاله 25 سنة بيوعد بحاجات ومعملش ولا حاجة منها بلعكس ديون مصر عمالة تزيد وكل يوم يكتشفوا واحد من أعوانهم الفسدة مهرب ملايين للخارج أو مضيع على الدولة ملايين وده علشان محدش كان بيحاسبهم والمال السايب بيعلم السرقة المهم إنه بعد 25 سنة جاء حسنى مبارك وقال للناس أنا عامل برنامج إصلاح طيب ياجماعة هو حد حكم مصر غيرة وهو الفساد جه منين غير منه ومن إلمحميين بيه فهل هذا كلام يعقل وده كمان بعد ضغط من أمريكا عليه ولو مكنتش قالتله مكنش فكر يعمل حاجة طيب فيها إيه لو الإخوان حكموا مصر وأخذوا فرصتهم وخصوصاً إنهم ناص منظمين فى أفكارهم ومرتبين فى برامجهم وأكيد ها يكون ده لصالح مصر ليه بنحاربهم من غير لما يعملوا حاجة وسايبين الفساد عمال ينتشر وبتهللوا وبتقولوا مبارك هو عملكوا إيه خير مصر ونهبه وشبابة فى بطاله ومصانع وبتتباع وشركات وبتتقفل طيب ها نستنى لما تيجى دولة تحتلنا ولا نلحق مصر من الفساد على إيدين ناس بيخافوا ربنا ومشفناش منهم إى حاجة وحشة دول ناس بيحفروا فى الصخر علشان يحافظوا على مصر مش بينهبوها وعايزين يورثوا الباقى أصحوا وكفاية بقى نوم مكفكوش 25 سنة"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

