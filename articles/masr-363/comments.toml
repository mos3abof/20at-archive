[[comments]]
order = 42
subject = "مصر بتتسرق من ايام الهكسوس"
author = "من أيام الهكسوس مصر تنسرق ولسه الناس"
posted = "2006-05-27"
text = "عايشة ... سبحان الله .<br />ياحسني انت مكسوف تترك الكرسي<br />كفاية بقى .<br />البواسير وجعتنا قوي .<br />الشعب المصري بهوق على الاخر<br />حرام عليكي ياحسني . حرام عليك ياجمال<br />عايز تعمل فينا ايه تاني .<br />حسني : اية ياحوش ياغجر مش كفاية اننا حكمنكم . عايزين ايه تاني صحيح كلاب وحوش<br />الشعب : نفسنا نعيش .<br />حسني : ما انتوا عايشين اهو مش حاسين بالوجع ، ده دليل انكم عايشين .<br />الشعب : على رأي العاهرة نجلا التونسية ، ما عتشي حاجة اديهولك .خلاص حرام كفاية تعب بيوجع . بيوجع ، بيوجع .<br />حسني : استحملوا ... ما انتوا مستحملين 25 سنة ... جت على 25 سنة كمان ، خلوا الواد يفرح ويمسح البلد شوية ،<br />هو شاب برضوا وروش طحن ، وراح يحزمكم كلكم .<br />الشعب : طيب ياريس اعملنا قانون لجواز الرجالة من بعض لاننا خلاص مش قادرين نتجوز حريم .. والرجالة ممكن تقضيها في اي حته من غير بيوت ولا عفش ولا عيال ...<br />حسني : ياولاد الجذمة ... فكرة حلوة ..<br />ازاي فاتت على ابن الجذمة كمال الشاذلي ..والحمار صفوت الشريف .. بس لما اشوفهم .<br />الشعب : ياريس ... ممكن تستورد لنا جلد ألمانية علشان البواسير تكمل معانا الـ 25 سنة اللي جاية .<br />حسني : بس عليها ضريبة مبيعات ، وضريبة بواسير ، اقولكم خلينا انا راح اخلي جمال يفتح 100 مصنع لتصنيع البواسير والجلد جاهزة ، ونستبدل بواسير الشعب كله ، واخلي خديجة تفتح مراكز تدريب على تركيب وصيانة البواسير . العيال برضوا عايزة تسترزق ....<br />انا بقالي 5 سنين قاعد من غير شغل ..<br />هو صحيح فيه شغل ، ومفيش شغل في نفس الوقت<br />فيه شغل بـ 150 جنيه . وبـ 200 جنيه .<br />المواصلات باصرف فيها 200 جنيه<br />طيب اكل من فيه واشرب من فين والبس من فين<br />اشتغل في الدعارة<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

