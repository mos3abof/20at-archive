[[comments]]
order = 44
subject = "سوق الخضار"
author = "مصرى"
posted = "2006-05-27"
text = "لماذا أشعر عندما أرى جزء من أخوانى المصريين يتحاورون , أشعر كأنى أقف فى سوق شعبى للخضار والفاكهة , هناك من يهتف وبصوت عالى و بغوغائية , ربنا يخليك ياريس , ربنا يحميك ياريس , ,اذا نظرت الى قدماه ستجده حافى القدمين وأيام البؤس قد تركت سماتها على وجهه , تجد من يتحدث عن الانجازات الحضارية وقائد السفينة ( وماأدراك مالسفينة ) , واذا نظرت الى وجهه تجده يخطب من ورقة مكتوبة أمامه وهو خلف نافذة مكتب فخم مكيف , عجبا ,,, أما وللاسف من ينقلون أنفاس وانات المظلومين والمحرومين والذين زادوا فقرا على فقرهم , واصبحت بطاقة درجات البلد فى جميع المجالات صفر فهم من وجهة نظر أخواننا فى الله مجموعة من السوداويين المحبطين الماجورين , اتقوا الله ياعباد الله وادخلو الاحياء الشعبية , اتقوا الله ياعباد الله وأنظروا فى وجوه المصريين فى الصباح أو فى المساء , أتقوا الله سوف تنافقون وتخسرون بلا تمن فقد نضبت البقرة وجف لبنها , أنا لاأتهم مبارك بتهم لااعلم عنها شيئا وأنما الذى أعرفه أنه رجل فاشل سياسيا واقتصاديا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

