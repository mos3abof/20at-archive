subject = "بدأ وقت تصفية الحسابات"
author = "مصرى"
posted = "2006-05-24"
text = "لقد إنتهى جمال مبارك من تصفية حساباته مع الدكتور أيمن نور ثم تلاه الدكتور نعمان جمعة ثم تلاه بداية تجرأه على القضاه لتحجيمهم ثم بدأ يتطاول على الكتله الشعبية التى أختارها الشعب بإرادته ولولا تزوير الإنتخابات لكان الإخوان إكتسحوا كل المقاعد بحب الشعب لهم ولن يترك الشعب الإخوان للنظام لكى يفتت فيهم ليستطيع أن ينول منهم هو وحاشيته الفاسدة من معدومى الضمير من الصحفيين الذين لا يعبرون إلا عن رأى أسيادهم من الفسدة ولكه بحسابه ولكن الشعب لن يتكرك الإخوان المسلمين يواجهون أى تحدى وحدهم فهم المرشحين من قبل الشعب وصوت الشعب وعلى الحاكم أن يلم تعابينه ويبعد عن هذه المنطقة من التحدى هو وإبنه الأهبل لأن مصر كلها خلفهم وهو خاسر فى هذه الحرب الغير متكافئة معه والمضمونة الإنتصار فى صالح الإخوان والشخص المنافق الذى ينادى مبارك بطوله وعرضه عيب عليه هو مش مصرى وشايف حال البلد بقى شكلها إيه من نهب وسلب وفساد ياسيدى حبه مهو كله بحسابه بس حب مصر برضوا وإعرف إن مبارك لا يحب مصر ولكن يحب النهب والسلب من مصر وهو يعتبر المصريين عبيد عنده وأنت واحد من العبيد حبه بقى زى ما إنت عايز"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "يا مبارك يا حبيب الشعب"
author = "احباء الرئيس مبارك"
posted = "2006-05-24"
text = "الرئيس مبارك بطل حرب 1973<br />الرئيس مبارك هو الرئيس المنتخب من الشعب المصرى<br />لماذا يتشدق الجميع بالشرعيه وينسه ان الرئيس مبارك انتخب بطرية شرعيه<br />شوف كم الف مصانع اتبنه فى عهده<br />شوف كم الف مدرسة اتبنة فى عهده<br />شوف كم الف مساكن اتبنة فى عهده<br />شوف كم الف شارع اترصف فى عهده<br />شوف كم الف مستشفى اتبنة فى عهده<br />شوف بتفرج وتشوف كم قناه وتقرا كم صحافه<br />وتتفرج حتى لو كانت بتشتمه<br />انجازة الرئيس مبارك لاتعد ولاتحصى"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "شوف كام"
author = "طهقان"
posted = "2006-05-24"
text = "للمحموق قوى على إنجازات حسنى مبارك شوف كام معتقل فى السجون وشوف كام ألف مليار إتهربت فى حساباته السرية هو وأسرته وشوف كام ألف مصنع وشركة إتباعت وإتشرد العمال إللى فيها وشوف كام ألف عاطل وشوف كام ألف عانس فى عهده وشوف كام ألف زورت آرائهم فى كل إنتخابات علشان هو يبقى فى الحكم وشوف كام ألف إتضرب من المصريين وأتسحل علشان هو يبقى فى الحكم بل ويورث الحكم لأبنه رغم إفتقادة للشرعية بحكم الدستور وشوف كام ألف طفل بيموتوا من الأمراض المتوطنة فى مصر ومن الفقر وسوء التغذية وشوف الأسعار أرتفعت قد إيه فى عهده المجيد كفاية بقى وأعتقد أنك عملت بالفلوس إللى أنت قبضتها وكفاية روح بيتك وإشترى إللى نفسك فيه وحسبى الله ونعم الوكيل فى كل منافق وكذاب"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

