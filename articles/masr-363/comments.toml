[[comments]]
order = 19
subject = "للرد علي المنافقين"
author = "بحب مصر"
posted = "2006-05-26"
text = "يبقى انت أكيد .. أكيد فى مصر<br />يبقى أنت أكيد.. أكيد فى مصر<br />لما الجنين فى بطن أمه يبايع<br />لما تخاف تمشى فى الشارع<br />لما تلاقى شباب ضايع<br />يبقى أنت أكيد.. أكيد فى مصر<br />لما تلاقى حاكم طاعن فى السن ومتسلطن<br />وإعلامه الرائد على طول بيطنطن<br />لما تاكل أكل كلاب أو متسرطن<br />يبقى أنت أكيد.. أكيد فى مصر<br />لما تموت من الغيط وتطق<br />وما تقدرش تقول لأ<br />يبقى أنت أكيد.. أكيد فى مصر<br />لما تلاقى شقق فاضية وناس فى المقابر ساكنين<br />لما تخاف تعيا وترقد وما تعرفش تروح فين<br />لما يتاجروا باسم الوطنية أو الدين<br />يبقى أنت أكيد.. أكيد فى مصر<br />لما تحارب نهارك كله لأجل القوت<br />ومن القهر أو الذل تموت<br />يبقى أنت أكيد.. أكيد فى مصر<br />اغنيه للرد علي المنافقين العملاء"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 20
subject = "الموقع ده مش بتاع مبارك"
author = "الاستاذشيكو"
posted = "2006-05-26"
text = "المنافقين بتوع مبارك وماما سوزان باقولهم الموقع ده للي مش لاقي ياكل واللي عاطل واللي تهقان من حياته وقرفان من الحكم واللي فيه من اكبر راس الي الديل يعني كل الحمار اااااسف اقصد النظام جاتكو القرف ماليتو البلد كفايه عاليكو بابا مبارك وماما سوزان روحوا ارفعولها ديل الفستان من الارض 0000000000000000000 هوه انتو ورانا ورانا البلد اللي احنا بنتكلم عنها مش بلد مبارك والهليبه اللي معاة واللله باين عاليك عبدالله كمال بتاع روزاليوسفولاكداب الزفه سمير زفت رجب ولا الاخ اللي طالعلي في المقضر جديد اسمه عمرو عب السميع اللاميع ماانتوا عارفين الشله المنافقه بتاعه حسني واللي معاه همه اللي بيحبو مبارك انا عارفهم بالاسم همه 4000 واحد نصهم بره البلد والنص التاني وزير سابق او وزير لاحق وهكذا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

