text = "والله انا مل عارف اقول ايه بس ممكن اقول كلمة واحدة حسبي الله ونعم الوكيل واللي يقول ان حسني مبارك صلح البلد يبقي منافق وطمعان في منصب اصل البلد بلد غنية 25 واحنا بنتسرق ومحدش يقدر يقول لا عشان خايفين من سيادة الرئيس والله بلد لا ينفع فيها الا الراقصين وصدقت كلمة الممثل ساعة ما قال الشعب المصري كله ماسك في ايد الحكومة كانها امه اللي خلفته لكن لسه في امل بس مش لينا للي جاي"
