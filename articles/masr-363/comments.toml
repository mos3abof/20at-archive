text = "ما زالت كلاب النظام تعوي من اصحاب المصالح والامتيازات في عهد دولة الفساد العظمي , يعني المنافق الي كاتب لعمنا الكبير (حمكشة), اكيد موظف مرتشي,اوحرامي كبير,اوقريب عضو حزب وطني معينه في البترول او الكهرباء<br />هي ديه العينات الوسخة بنت الكلب الي قرفانا كل يوم بالهتافات المؤيدة لعمنا الكبير (حمكشة) بالروح والدم نفديك يا صدام ....اخ....اسف.....نفديك يا (حمكشة)"
