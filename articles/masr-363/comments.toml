[[comments]]
order = 60
subject = "ا لــــــــــــحــــــــل ا لــــــو حـــــــــيــــــد"
author = "مــــــصـــر ي أ صــــــيــــل"
posted = "2006-11-08"
text = "يــا شـعـب مـصـر<br />مـبـارك أرفعـوا عـليـه قـضـيـة خـلـع هـو وأسـرتـه الـكـريـهـه وهـذه الـقـضـيـة لـيـسـت فـي أي مـحـكـمـة انـمـا بـخـلـعـة بـضـرب الـجـزمـة عـلـي رأسـه حـتـي إخـراجـه مـن الـدنـيـا هـو وأسـرتـه . مـالـكـوش حـل غـيـر كـده . وحطوني رئيس مكانه وكنت بعمل للشعب اآتي --<br />1- وظيفة لكل مواطن في سن العمل<br />2- مرتب محترم يعيش الأسرة في أحسن مستوي يلبي كل متطلباتها بالكامل ويتبقي شوية للإدخار<br />3- كل مواطن يتملك قطعة أرض يبني عليها فيلا أو عمارة أو مشروع حسب كيفه<br />4- بأعطي لكل مواطن قرض من فلوس الدولة اللي هي ملك لكم يا شعبي الحبيب علي 40 سنه يسدد منها قسط بسيط جدا 1% من رواتبكم كل شهر وفي حالة الوفاه لا سمح الله الدولة تتنازل عن باقي القرض لصالح الايتام<br />5- صرف مرتب محترم ومضاعفة المعاش 5 مرات لكبار السن . ماكلها من فلوسكم يا حبايبي<br />6-الغاء قانون الطوارئ الحقير وحرقه في ميدان عام<br />7- تطبيق عقوبة الاعدام لكل شخص يثبت علية سرقة اموالكم ياشعبي الحبيب<br />8- قتل كل الرقاصات حرقا\" واعدام الفنانات العاهرات وبخلي سمعة الأقرع ينيك بوسي سمير في ميدان عام<br />9- اعدام جميع الوزراء والمسئولين في نظام الفرعون مبارك واولهم الوسخ كمال الشاذلي ابو كرش 20 متر والكلب صفوت العرص ملك الدعارة ووبخلي الشعب ينيك نسوانهم ماعدا كمال الجنزوري وعلي لطفي واحمد رشدي وغيرهم من الوزراء الكويسين امثال عمرو موسي<br />10- كل مواطن بياخد عربية عالزيرو جديدة<br />11- بلغي الدروس الخصوصية والمدرس اللي هيدي درس هنحكم عليه بالاعدام<br />12- اي ظابط شرطة ابن كلب حيضرب أو يشتم اي واحد من الشعب هقعده علي خازوق واخلي الشعب يرجمة بالحجارة مثل الزواني<br />13 بشغل المخابرات جوه الشعب تجبلي اخبار الحرامية والمعرصين اللي بيفسدوا ا<br />اقرأ بقية التعليق .."
archived = "2006-11-11"
capture_url = "https://web.archive.org/web/20061111122405/http://masr.20at.com:80/article.php?sid=363"

