text = "السلام عليكم ورحمة الله وبركاته<br />ياجماعه ااولا احب ان اوضح امرا انا شاب عندى 24 سنه بعمل مهندس معمارى متزوج وعندى طفل والله العظيم ياجماعه عمرى مكرهت احداا مثلما كرهت حكومتى ورئيسى مبارك وليس كرها لمجرد الكره او معاهم معاهم والله كل يوم عندما انظر لا حوال بلادى اشعر بذلك انا من قلرارة نفسى اعلم اننى كمواطن من الممكن ان اعتقل واسجن وتشرد زوجتى وابنى لمجرد اعتراضى على اى شىء يخص الحكومه او الغلاء فا اعلم اننا كمصريين ليس لنا ادميه داخل مصرنا وايضا ليس لنا كرامه خارجها فبالله عليكم كيف يحترمنا الغرب ويعطينا حقوقنا ونحن نأخذ عفوا بالجزم داخل بلادنا من حكومتنا ورئيسنا .....كفايه بقى ...والله العظيم كنت بستغرب ازاى واحد يلف حول وسطه حزام مفرقعات وينسف الطغاه...اليوم وانا شاب مصرى متزوج واعول ابنى يوسف الصغير واعمل مهندسا مستعد للتضحيه بنفسى وزوجتى وابنى من اجل ان ارنا نعيش حياة ادميه وكريمه يكون فيها ضابط الامن فى حمايتى ويحترمنى لا انا يعاملنى كأنه سيد ونحن احقر عبيد...حسبى الله ونعم الوكيل<br />شريف الكاشف..شاب مصرى... قرب يصاب بأكتأب"
