[[comments]]
order = 14
subject = "كلمة حب"
author = "واحد بيحب بلده"
posted = "2006-05-26"
text = "الحمد لله والصلاة والسلام على رسل الله (ص) وبعد<br />فى الحقيقة مصر ما تستاهيلش كل اللى بيحصل لها من حكامها.... ولو نتكلم بموضوعية شوية عن حال البلد على الاقل فى العشرين سنة الماضيةنجد انفسنا من سىء الى اسوأ فى كل حاجة مثال :<br />1- التعليم : هل مستوى التعليم سواء من الناحية العلمية او الاخلاقية او اى ناحية وكذلك الفوضى فى كل حاجة تمس التعليم . وبنظرة بسيطة ان تخريب العمليةالتعليمية متعمد لدرجة ان اخر احصاء على مستوى العالم لم تفز اى من جامعاتنا حتى مركز 500 ...من المسؤل؟<br />2-الاقتصاد: يعنى اسعار السلع الضرورية بالنسبة لاى انسان وربط هذه الاسعار بالاجور وكذلك فرص العمل لاى شاب .. مسؤلية مين؟<br />وكذلك هل يوجد لدينا استقلال حتى فى لقمة العيش ...<br />موضوع الخصخصة وبيع الشركات لاى حد؟؟؟؟<br />هو طبعا انت لست متخصص وحضراتكم ممكن تضيفوا اكثر منى...<br />3- الحالة الامنية: بالنسبة للمواطن البسيط هل لو دخل قسم شرطة لاى مصلحة هل سيعامل معاملة ادمية.. ناهيك عن لو كان متهم .. وفى الاخر يطلع ان فيه خطأ فى الاسم او في 1.5 جنية متاخر او اى جاجة . هل فيه حد يقدر يجبله حقه؟<br />رئيس المحكمة اللى انضرب وانسحل فى الشارع .. حد سال عنه<br />الاعتداء على القضاة وكل الناس المؤيدة فى الوقت اللى الجرايد القومية وشبه القومية واجعة دماغنا بالاشادة بالتجربة الديمقراطية واننا نحمد ربنا على كده.<br />بصراحه انا دماغى وجعنى ياريت حضراتكم تكملوا لاننى مش قادر"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

