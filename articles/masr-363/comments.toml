text = "كفانا تصريحات نريد ان نتحد اخوان ومعارضه وشعب لاسقاط هذا الديكتاتور اللص ومحاكمته هوومن معه من القوادين لان حكومه الرزيله هذه لن تسقط بالتصريحات لابد من مظاهره تخرج في العاشر من رمضان المقبل نرتب لهاعلى هذا الموقع نخرج فيها جميعا كل من وقع عليه ظلم يخرج ليقول لاولن نعود الى بيوتنا الا احرار او اموات نخرج من السلوم حتى حلايب كل من وقع على ظلم يخرج ليقول لا للظلم تحت اي قياده منظمه اخوان معارضه قضاه اي جهه محترمه تنظمنا انا معهاومن يوافقنى وان لم اجد جهه حره او احد يخرج معي فليرحمكم الله جميعا ولاعزاء للسيدات وكفانا تصريحات وساخرج وليعينني الله ببعض من كرهوا الظلم من خلال هذا الموقع والله الموفق"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

