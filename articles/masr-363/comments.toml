[[comments]]
order = 52
subject = "واح بيحب مصر"
author = "حاتم"
posted = "2006-06-04"
text = "في البداية أناشد الجميع أن يتحاورا مع بعضهم بدون سب أو تجريح.<br />بالرغم من أن هناك سلبيات للرئيس مبارك فإن أحدا لا يمكنه أن ينكر إنجازات سيادته.<br />يجب أن يعلم الجميع أن أمريكا لا تريد خيرا لمصر هاهو الدور يأتي على مصر بعد إحتلال العراق وأفغانستان ومحاصرة سوريا والسودان.<br />يجب جميعا أن نلتفت حول الرئيس مبارك ويجب ألا ننخدع بالحرية وبأمريكاوإعلموا أن مصر مستهدفة من الصهيونية العالمية.<br />وفي المقابل لا أحد يمكن أن يشكك في الإخوان وأحترم كل الإحترام السيد محمد مهدي عاكف الذي يشيد به الجميع ودوره الباسل في مقاومة الإنجليز"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 53
subject = "المهتم بالامر"
author = "عايز بس أقول للأخوة أو الاْخوات احنا صحيح مانقدرش ننكر دور الريس مبارك فى حرب أكتوبر والضربة الجوية بس الكلام ده بقى تاريخ وتاريخ قديم كمان."
posted = "2006-06-05"
text = "لكن الجديد أيه؟؟ أزاى أحنا أول دولة تستقبل يهود أولمرت بعد أمريكا وأزاى هرب ممدوح اسماعيل بعد ماكان السبب فى غرق أكثر من 1000 مصرى غلبان وألناس اللى ماتت فى المنيا واتخذت اعضائها ولبسوا الموضوع لولد الغلبان والسحل والضرب للبنات اللى فى المظاهرات فى الشوارع ده النظام دلوقتى وأتحدى أنه يكون فى اى انجازات ملموسة غير انهم قاعدين يفككوا البلدويبيعوها حتة حتة وشوية غوغاء بيهتفوا باسم الريس لاْنهم مش حيعرفوا يضحكوا على نظام تانى وحيفضلوا يكبروا ويسمنوا فى الظل ده مش فى ظل أخر.<br />بس أعتقد أن ده ظاهرة عربية مش مصرية حالة الضياع واحدة لان خلاص مافيش زعامة وكلهم من أتخن واحد لاْقذر واحد اقزام ولاد أقزام.<br />بس مستنيين المعجزة ومش حنيأس وأعتقد انها حتكون من هنا من مصر زى مادايما بيحصل."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

