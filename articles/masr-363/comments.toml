[[comments]]
order = 31
subject = "الى كل الاخ السائل عن كيفية الانضمام للاخوان"
author = "ابن الاسلام"
posted = "2006-05-26"
text = "اولا السلام عليكم ورحمة الله وبركاته<br />ايها السائل الكريم عن كيفية الانضمام للاخوان فالاخوان دعوه فمن الممكن ان تكون من الاخوان بفعلك المطابق لدعوة الاخوان المباركه<br />فمن اقوال الامام الشهيد حسن البنا<br />\"كمن منا وليس فينا وكم فينا وليس منا\"<br />واذا كنت راغب فى الانضمام الى صفوف الجماعه فستجد اخوان لك قريبون منك وسيرحبون بك<br />والسلام عليكم ورحمة الله<br />\"الاسلام هو الحل\""
