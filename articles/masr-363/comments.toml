subject = "كفاية نفاق يا كلاب"
author = "ابو كرتونة"
posted = "2006-05-26"
text = "مش تستغربوا انكوا تلاقوا شوية منافقين خونة وعملاء للنظام , ان التاريخ يعيد نفسه مره اخري.<br />شوفوا مثلا صدام كان عامل ايه في شعبه من دمار وخراب , ومع ذلك كنا نلاقي الانتخابات لصالح صدام بنسبة 100% , وبالروح والدم نفديك يا صدام, وشوفوا نفس الناس الي كانت بتهتف لصدام حسين هي الي ضربت تمثاله بالشباشب والجزم مع دخول الامريكان, وحتي الان الاغلبية العظمي من الشعب العراقي تلعن صدام وحاشيته الفاسده, ونفس الاحداث تتقرر الان, بالروح والدم نفديك يا حمكشة..... طبعا انتوا عارفين الباقي."
