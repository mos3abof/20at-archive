subject = "أكيد"
author = "مصرى"
posted = "2006-05-27"
text = "أللى عمال يكتب مبارك ده واحد من ثلاثة<br />1 أما هو حسنى مبارك نفسه<br />2 أما يكون أبنه علشان يورث الحكم لنفسه رغم إنعدام أى خبرات ليه بالمقارنة بخبراء مصر إللى كرمهم العالم وإللى ربنا قال عنهم خير جنود الأرض ولكنه سايق الهبالة ومستعبط وفاكر أننا ها نسيبه<br />3 أما يكون حد من أتباعه العبيد إللى عايشين على الفتات إللى بيلفظه ليهم من خير مصر المنهوبة على إيدية وإيد أبنه وزوجته وكل الحاشية الفاسدة من حولة<br />بس أنا نفسى أقولكم إن إللى عمله حسنى مبارك لأمريكا وأسرائيل أكثر بكثير قوى من إللى عمله لشعبه يعنى شوفوا أتفاقية الكويز خدمت أسرائيل أد إيه وشوفوا تصدير البترول لإمريكا بنصف الثمن لمدة عشرين سنة ده ها يخدم أمريكا أد إيه وشوفوا تصدير الغاز لإسرائيل بخط مفتوح وتوصيل المية ليها وشوفوا المزرعة الإسرائيلية إللى فى سيناء لخدمة إسرائيل وشوفوا الإسمنت والحديد إللى بيروح لإسرائيل علشان تبنى بيهم الجدار العازل وقارنوا بين حالة الفقر والفساد وبيع أملاك الشعب إللى الشعب عايش فيها وقارنوا بين حساباته بره وشوفوا بتزيد ٌقد إيه كل سنة يا أخوانى أمريكا قالت فى يوم أنه رصيده عندها بس وصل 50 مليار دولار وشوفوا إبنه بيعمل بزنس فى كام شركة بتوعه كل ده من خير مصر ومن بطالبة شبابها ومن بيع شركاتها ومصانعها وأكل حقوق العمال فيها يا أخوانا حسنى مبارك عنده دلوقتى 79 سنة يعنى خلاص واحد عايش علشان يرفه نفسه من أمريكا لألمانيا للمغرب لأسبانيا وعمال يوقع العرب فى بعضهم علشان يظهر قدام الأمريكان أن وجوده ضرورى علشان يصلح المشاكل بين العرب أتمنى أن أنتوا تفوقوا بقى وتعرفوا مصر رايحه فى ستين داهية على أيدين حسنى مبارك"
