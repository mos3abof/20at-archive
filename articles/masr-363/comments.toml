subject = "هو إيه ده"
author = "كنت زمان مصرى"
posted = "2006-05-27"
text = "هو إيه إللى عليه عفريت أسمه مبارك ده أصله معذور علشان مش لاقى أى إنجاز لمبارك يكتبه جنب إسمه وعلشان همه دفعوله مبلغ بسيط يادوبك على قد المصطلح ده إللى إسمه مبارك<br />بصوا بقى أنا قرأت كل التعليقات ولقيت بسم الله ماشاء الله كل التعليقات تأييد وبإجماع على حب الإخوان المسلمين وفكرهم المنظم ليه بقى الإنتظار ليه نفضل ساكتين على الفاسد وإبنه لغاية لما نلاقية مورثه الحكم وكأنه قاعد فى عزبة وناسى أنه أصلاً موجود فى الحكم من غير أى شرعية وأنه مرزور للإنتخابات تبقى برضوا دى أسقطت كل شرعية ليه وبالتالى هو ما لوش أى مكان فى الحكم ولا هو ولا إبنه يا أخوانى حسنى مبارك وإبنه الشعب كله بيكرهمم والشعب مش عايز غير قيادة تقوده علشان نخلص فى الفساد المعفن إللى موجود فى البلد محتاجين قوى نوحد كلمتنا كلنا ومحتاجين نكون أقوى من كده ونبقى صف وآحد وده إللى مخوف الحاكم من الإخوان أنه عارف أنهم يد وأحدة علشان كده هو دلوقتى بيحاول يفتتها زى معمل فى الأحزاب التانية مثل الغد والوفد والتجمع عايزين قيادة قوية ورأى موحد وبعد كده إرادة الشعب هى إللى ها ترفض الفاسد ده وياريت يلاقيله مزبلة تلمه هو وأسرته وتاريخه القذر ويرحل عن مصر ويروح فى داهية اللهم آمين يارب العالمين"
