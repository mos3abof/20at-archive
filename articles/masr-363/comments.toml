[[comments]]
order = 51
subject = "يا ناس يا شر كفايه قر"
author = "كفايه"
posted = "2006-05-28"
text = "أبث هذا التعليق الي كل الاخوه الموالسون و\"الهطل\" في بلادنا وايضا للذي يريد معرفه ماذا فعلت الحكومه في الاشهر الماضيه من فضائح قد ظهرت مؤخرا والله اعلم \"ايه المسنخبي\"<br />كل ما اريد قوله اننا في مصر ولله الحمد حاصلين علي المركز الرابع في الفساد علي مستوي العالم \"شفتوا التفوق\"<br />-أنا اتعجب في ظل نظام ارستقراطي تافه وفاسد ينفق بالمليارات وبدون حساب وكأن الخزرينه العامه للدوله هي خزينه جيب \"ابوه\".... ليأتي ويعايرنا بعد ذلك بتعداد السكان الكبير والذي لا تنفع معه تتنميه او انجازات \"شايفين النباهه\"بدون ان يختشي علي دمه ودم \"اللي خلفوه\" ويعترف بالتسيب لأموال اهدرها كانت كفيله في اقامه حياه كريمه للمواطن بدون ان يتكلم عن الانجازات الوهميه \"اللي بيتفشخروا بيها \" وانتم تعرفون .<br />ٍابدا (ببعض المليارات) التي ضاعت بلا طائل بسبب استيراد الحكومه الموقره علي المصل الصيني الفاسد زالذي حقق من ورائه اللصوص ارباحا وصلت الي مليار جنيه !!<br />فثمن المصل 40 جنيها ويتم بيعه بالقوه لأصحاب المزراع ب 480 جنيه!!! لا حول ولا قوه الا بالله ..وعلي الرغم من معرفه الحكومه بان هذا المصل يخالف كل الاراء العمليه لككنهم طبقوا مقوله \"هييه بناقص عباره ..!!\"<br />فوفقا للأبحاث سبب التاعمل الغبي للحكومه مع المرض الي خسائر نحو 20 مليار جنيه ... نفوت دي مااااااااااااااشي<br />عندك مثال اخر تسببت الحكومه الجليله في اكبر خساره لمحصول القطن نحو 2 مليا جنيه وكان من ضمنها 750 مليون جنيه قيمه ما تم استيراده من اقطان وممكن ان تتخيل الكترثه التي جعلت مصر تصبح في \"المؤخره\" عالميا في انتاج القطن.<br />وتعالوا معي لتوشكي والذه وصفه الموالسون اياهم بانه عبور ومرحله في التنميه والكوسه ...الخ ,الا ان الواقعه اثبتت انه ليس الا كذبه كبيره عاشت فيها الح<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
