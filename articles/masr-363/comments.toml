[[comments]]
order = 6
subject = "منقول"
author = "م"
posted = "2006-05-24"
text = "سيدي الرئيس .. أنت جبان<br />أراك تلتصق الآن في مقعدك الوثير، وتثبّت عينيك على الشاشة الصغيرة، وترتعش يداك وهما تتعّرقان حول سمّاعة الهاتف، وقد جاءك صوتٌ من أحد كبار الكبار يطمئنك بأن كل الأمور على ما يرام، وتمام يا أفندم، فقواتك الباسلة، يا صاحب الضربة الجوية الأولى، اخترقت بشجاعة منقطعة النظير جيشاً عرمرم من شباب صغير ومرهَق من السهر استعدادا للامتحانات، ثم لبى نداء قضاته الشرفاء.<br />كانوا عشرة على الرصيف، وجنودك الأبطال أكثر من تسعمئة يحاصرونهم. القانون يقول بأنه يتم القبض على مخالفيه، ثم يُعْرَضون على النيابة. أما قانون الجبان فيطلب من كل ثلاثين أو أربعين كلبا محاصرة مواطن واحد، ثم القائه أرضا، وركله بشدة في كل أنحاء جسده حتى يتورم، وتنفجر من مساماته دماء حمراء قانية.<br />أراك هاربا في ايطاليا أو ألمانيا أو المغرب أو شرم الشيخ، وأتحداك أن تخرج في موكب مخترقا شوارع العاصمة ولو كنت في حماية أمريكا واسرائيل وكل كلابك الذئبية المفترسة.<br />أقدم اعتذاري الشديد لكل الطيارين الأبطال الوطنيين الذين رعتهم سماء مصر في السادس من أكتوبر عام 1973، وأقول لهم بأن هذا الرجل ليس منكم وليس مِنّا.<br />لعلك كنت تستلقي من الضحك على غضروفك الذي آلمك عندما بلغك نبأ تحرش ضباطك وجنودك بفتيات مناضلات أصغرهن أكثر منك شجاعة، وأعمق حبا للوطن، وأقرب لروح السماء منها لتراب الأرض.<br />انتقدتك كثيرا، وكتبت عنك ما ظننت أنه يفجر الماء من الصخر، ولكنني هذه المرة أحمل لك رسالة من سبعين مليونا من المصريين، ومعهم ستة ملايين مغترب منعهم ظلمك أن يدلوا بأصواتهم في الانتخابات الأخيرة خشية أن يكون الوعي قد أصابهم، والخوف من زائر الفجر قد زال عنهم في الغربة.<br />الرسالة التي أستطيع أن أختصر لك فيها ربع قرن من حكمك العفن والتي<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072508/http://masr.20at.com:80/article.php?sid=363&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

