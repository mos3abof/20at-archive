subject = "سألبي النداء"
author = "متغاظ ومستغرب"
posted = "2006-06-23"
text = "يعني ايه التعليقات دي؟؟؟هي العالم دي ايه معنداش خشي؟؟..ثم انا لو غتت المفروض اروح للهانم اللي حاطة الكلام ده وألبش معاها يعني؟؟<br />ورد فعل الهانم هيبقي ايه؟؟؟<br />ولو ده تحت بند الحرية..انا ذنبي ايه تبقي اختي جنبي وشايفة جملة كاتبها واحد سافل ومعلقها بيقول ان سيادته..لامؤاخذة يعني!!"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170457/http://masr.20at.com:80/article.php?sid=556"

