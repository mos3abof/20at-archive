[[comments]]
order = 8
subject = "ملوش حل"
author = "زينب فاروق"
posted = "2006-06-24"
text = "موضوعك حقيقي ملوش حل بصراحه انا مكنش بيلفت نظري قبل كده عبارات زي دي انما انا رايي انهم اصلا ممكن يكونو لاما مش عارفين معناها اساسا لاما مجرد منظره واستعراض ورايي انو مدام استعراض يبقي مفيش حد يعبرهم اساسا والمفروض ان زي مافيه قانون بيمنع اي فواحش اوي منظر يخل بالاداب في الشوارع عبارات زي دي المفروض متكونش علي عربيات في شوارع ممكن تدايق مشاعر حد بس هي عشان بالانجليش فمحدش واخد بالو اوي ده غير ان ممكن يكونو الظباط اصلا مش عارفين معناها"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170457/http://masr.20at.com:80/article.php?sid=556"

[[comments]]
order = 9
subject = "مش شرط يا درينى"
author = "نيفين نيفى نوفا"
posted = "2006-06-25"
text = "ياه يا هوووبه انتى لسه فاكره و الله يا هبهوب ما بنسى الجمله دى<br />تعتبر فعلا الجمله الوحيده اللى خلتنى و انا ف الطريق اطلع ورقه و قلم و اكتبها<br />تعرفى يا بت يا هبهوب انتى زى كل اصحابى بلاقيهم فاكرين عنى حاجات انا نفسى مش فاكراها<br />والموضوع حلو يا درينى بس مش شرط تعكس الجمله اللى على العربيه شخصيه راكبها لان مش شرط اصلا انه يكون عارف معناها<br />و هى دى المصيبه"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170457/http://masr.20at.com:80/article.php?sid=556"
