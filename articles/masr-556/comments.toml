order = 0
subject = "مش حتقدر"
author = "غالبا محدش يقدر يقرب لاصحاب هذه السيارات لأنهم من نوع"
posted = "2006-06-22"
text = "أنت عارف انا ( ابن مين أو بنت مين ) ؟؟!!!<br />و حتى أن العسكري أو حتى الضابط اللي واقف في الإشارة وقف العربية و قلها مخالفة ملصقات مش حيلاقي العربية قدامه على أقل تقدير إذا منزلش اللي سايق العربية و طرقع للضابط على قفاه و لا طلع الموبيال و اتصل بأنكل فلان عشان يدي الضابط كلمتين في جنابه عشان وقف الباشا<br />المضحك أن السيد اللواء رئيس الإدارة العامة للمرور أو نائبة أو أي حد من المسئولين في المرور يقولك في التلفيزيون اللي هو بتاع الحكومة :ان احنا قمنا بمصادرة هذه الملصقات و مش بص من العربيات و لكن احنا عملنا كبسات على المحال التي تبيع هذه الملصقات ( من المنبع يعني على حد تعبيره ) و قفلنا المحلات دي ...........!!؟؟؟؟ و عجبي"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170457/http://masr.20at.com:80/article.php?sid=556"

[[comments]]
order = 1
subject = "لا فاهمة بصحيح"
author = "Max"
posted = "2006-06-22"
text = "طب انا عندى حاجة اكيد كلكو سمعتو عنها ان معظم الناس الى بتعلق حاجة اوتكتب كلام على خلفية العربية مش عارفة معناها ايه على سبيل المثال زى ما سمعت من صديق ممكن يكون كداب او صادق الله اعلم او بيئلف ان هو سال بنت عن الشخص الى هى معلقاه على خلفية العربية هو مين قالتله مش عارفة شكله عجبنى قلت اعلقه الصورة كانت لجيفارا نص مصر معلقاه على خلفية العربية ومعظمهم ميعرفوش هو مين انا نفسى ما كنتش عارف بس تقعد جنب واحد يقلك ده شيوعى بصراحة انا وفرت الكلام ده وقعدت اعمل سرش على النت وفى الاخر اتخنقت نفضت للحوار اعتقد ان انا لما اعرف ده مين مش هيفدنى بحاجة والاحسن يا جماعة الى يعلق حاجة يلق صورة مصطفى كامل على عربيته طبعا انا عارف هو مين واحمد ربنا انى عارف!!!!!"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170457/http://masr.20at.com:80/article.php?sid=556"

[[comments]]
order = 2
subject = "مشكلة"
author = "أحمد ندا"
posted = "2006-06-22"
text = "المشكلة الحقيقية تكمن في الأبعاد النفسية والاجتماعية لهذه العبارات..<br />لأن اللغة الانجليزية عادة هذه الأيام هي لغة الطبقة الغنية الذين يريدون الفرادة والتميز عن أبناء الطبقات الأخرى..لكن الملفت بحق هو العبارات التي توضع على خلفيات سيارات الأجرة والنقل على شاكلة (ماتبصليش بعين ردية شوف اللي اندفع في)<br />وهذا وإن دفعنا للضحك ..يدفعنا أيضا إلى الخلفية النفسية وراء هذه العبارات"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170457/http://masr.20at.com:80/article.php?sid=556"

[[comments]]
order = 3
subject = "جامد يااااااااض يا درايني"
author = "هووووووووووبه"
posted = "2006-06-22"
text = "كلامك جميل نقح وعجبني , بس عايزه اضيف حاجه العبارات الكوووخه دي علي ما افتكر ماكنتش بس علي خلفيات العربيات في في فتره ظهر قمصان وتشيرتات كان مكتوب عليها نفس العبارات واتمسحت من الاسواق او ندر بيعها , كان البشر بيلبسوها وهما مش فاهمين معناها , وغير المالوف الحلوه ماشيه تدلع ولاسفلت بيولع .......<br />ووعلي راي نوفا علي عربيه مرسيدس<br />\" Don't look behind you there is nothing you can do\""
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625170457/http://masr.20at.com:80/article.php?sid=556"

