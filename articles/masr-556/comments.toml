text = "مكنتش أعرف أنك هايل في الترجمة كده :)...أنا كنت بشوف فعلا الحاجات دية علي العربيات بس مشفتش حاجات صعبة اووي زي ديه...أوعدك أني اما اجيب عربية مش ها اكتب عليها حاجة ..عشان بصراحة ها اخاف عليها تتخربش."
