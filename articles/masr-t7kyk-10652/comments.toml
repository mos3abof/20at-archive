text = "والله الفنادق الكبرى اللي شغالين في النظافه فيها معاهم شهادات جامعية<br />مش عيب ياابني دول بيعلمون شغلانه تكميلية"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620063857/http://www.20at.com:80/masr/t7kyk/10652.html"

[[comments]]
order = 1
subject = ""
author = "مش ححبك"
posted = "2008-12-01"
text = "ما لها ياابني جمع القمامه<br />هو انت في ديك الساعة لما تجمع قمامه<br />دا جمع القمامه شغلانه ت[ *** ]ب دهب<br />اي حد يستهتر بجمع القمامه اقف جنب صندوق القمامه وشوف ايه اللي بيدور حواليه<br />انا جربت شخصيا<br />لقيت كل شوية عربية كارو تيجي وينزل السائق ويبص في الزبالة ويلم منها الحجات المهمة صفيح خشب وهما عارفين ايه اللي ينفع<br />وهما دول اللي حيمسكوا البلد مستقبلا"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620063857/http://www.20at.com:80/masr/t7kyk/10652.html"

[[comments]]
order = 2
subject = ""
author = "مش لازم"
posted = "2008-12-01"
text = "مالها يا ابني النقاشة دا النقاش دلوقتي بقى احسن من مهندس الديكور<br />تعالى شوف النقاش ياابني بي[ *** ]ب كام في ضربة الفرشه<br />ويعني لما تتخرج وحتدخل كلية التجارة حتتخرج وحتبقى صايع محترم<br />اتعلم النقاشة ياابني خليك تضمن مستقبلك وتلاقي بنت الحلال"
archived = "2009-06-20"
capture_url = "https://web.archive.org/web/20090620063857/http://www.20at.com:80/masr/t7kyk/10652.html"
