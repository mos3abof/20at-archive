text = "اعتقد بأن الحلم نفسه قد امتدت يد النظام الطويله لتعبث به كما تعبث بمقدرات ذلك الوطن<br />فلتحلم ايها الخانع المستكين المنتهكه حقوقك فى مصرنا المخروسه<br />احلم بمن يحقق احلامك ويقدمها اليك وانت جالس تنتظر ما لن يجىء الا اذا اثبت بأنك جدير به كى يكون جدير بك<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأأه يـــــــــــا بـــــــــلــــــــدى"
