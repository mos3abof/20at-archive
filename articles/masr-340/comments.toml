[[comments]]
order = 7
subject = "حجة النسل لتبرير الفشل"
author = "ابو كرتونة"
posted = "2006-05-20"
text = "يطلع علينا عمنا لتبرير الفشل المدوي لحكوماته الفاشلة ويبرر الاخفاق في التنمية بسبب الزيادة السكانية (حجة البليد) , شوفوا الصين مثلا عدد سكانها قارب علي المليارين نسمة والهند مليار ونصف نسمه ولكن اقتصادهم يفوق اقتصادنا مائة الف مرة علي الاقل مع العلم انهم دخلوا مسيرة التنمية معنا في نفس الوقت خلال الستينات . ولكن انظروا الان اين هم واين نحن؟؟؟؟؟؟<br />وكمان هما مش عندهم(قناة السويس,ومعظم اثارالعالم , ومناطق سياحية متميزة,وبترول وغاز, وثروة معدنية....الخ)<br />والي ذلك الايدي المصرية الذكية التي اذا وفق توجيهها الي العمل لاصبحنا اكبر دولة صناعية وزراعية في العالم , وليس كما يقول عمنا الكبير ان السكان عالة علينا كانه بيصرف من جيبه ....."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906101201/http://masr.20at.com:80/article.php?sid=340&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

