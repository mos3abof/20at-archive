subject = "غرييييييب"
author = "أحلام حلوة لكن كلها غريبة و مش ممكن تطبق قبل 150 سنة من النهارده؟؟؟!!!!"
posted = "2006-05-17"
text = "خصوصا ان المصريين واضح انهم مش ناوويين يغيروا حاجة؟<br />ثم ايه علاقة النسل بالتقدم الأغرب ان الدول المتقدمة اللي (على ما أظن) انت نفسك مصر تبقى واحده منها بتحث على النسل مش على قلة النسل!!!<br />كمان لعلمك الصين اللي قربوا يوصلوا 2مليار نسبة البطالة عندهم أقل من النسبة اللي عندنا بمراحل و مطلعوش في يوم من الأيام و قالوا يا ناس حراام عليكم كأن اللي الولاد اللي بييجوا دول بياخدوا حته مش من نصيبهم مثلا؟؟؟؟!!!!"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906101201/http://masr.20at.com:80/article.php?sid=340&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

