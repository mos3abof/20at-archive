text = "حنا بقالنا 25سنه عايشين فى كابوس ..من الصعب اننا نحلم..ولو كان فينا حد يقدر يحلم ..فحيكون نفس الحلم ... الخلاص .. الخلاص..الخلاص من هذا الكابوس..أنا شخصيا..أعيش كل ثانيه من عمرى فى حالة انتظار... انتظار الافاقة من كوما مبارك..والله الأسم ده مش لايق عليه اطلاقا ..وهناك الكثير من الأسماء المطابقة تمامالهذا الشىء..هوه يادوب شىء لأنه لو كان انسان وعنده قليل من اللون الأحمر فى عروقه كان ساب الحكم من زمان بعد ما أثبت فشله هو وشله لصوصه وخربوا البلد .. وسرقوها ونهبوها .. الأخطبوط.. القرصان..السرطان...السفاح....الخ...انسب الأسماء لك ... أنتم احقر الكلمات فى قواميس كل لغات الدنيا...لالالالالالالالالالالا لمبارك وسلالته..لالالالالالالالالالالالالالا للفساد...لالالالالالالالالالالالالالالا لقانون الطوارىء..ونعم ..نعم ..نعم لتعديل الدستور...ربنا يخلصنا منكم ونلاقى داهيه ترضى تاخدكم ..قولواآآآآآآآآآآآآآآمين"
