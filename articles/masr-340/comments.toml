posted = "2006-05-26"
text = "يا اخي هوه انته لازم تحشر العمل والاجتهاد والنظام والامانه 0000الخ كله لازم يبقي حلم هوة دة اخرك تحلم بس هوة ده اللي انته عايزة تحلم0 نقطنه بسكاتك يا عم وبلاش نكد اما تحديد النسل فبلاش النغمه الحكومي اقصد كلام ماماوبابا وان السكان التهمو ثروة مصر بلاش الكلام ده عشان خاطر المطحونين في الارض اللي التهم ثروة مصر كان في الاصل حلواني اقصد حرامي"
