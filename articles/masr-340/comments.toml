subject = "فكرتوني بحزبي الاهبل"
author = "مش شغلك"
posted = "2006-05-19"
text = "والله افتكرت الحزب اللي كنت عامله<br />واعضاءه اكرم اللي اختفي في العباره باين<br />ودبدوب اللي مفيش فايده فيه ...<br />ونوفا اللي بتصالح البشر...<br />وسوسه اللي عندها عقده نقص ...<br />وسويت الرغايه ...<br />اما بالظبط بقي اللي ماشيه اوي يعني علي الحزب بتاع اكرم ماشي روش طحن . نفس البشر اللي فيه<br />اليساري واليميني و المتطرف والمتدين والونج يمين وشمال. والساعه \"فاي \" نتقابل ."
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906101201/http://masr.20at.com:80/article.php?sid=340&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

