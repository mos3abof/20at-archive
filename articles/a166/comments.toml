[[comments]]
order = 8
subject = "كونان"
text = "انا شايفة ان البي بي سي هي القناة الغربية الوحيدة اللي كانت موضوعية في نقلها لحرب العراق وطبعا الموضوعية نسبية لان مفيش شيء اسمه الموضوعية الكاملة وبالنسبة لنقلها لاحداث فلسطين فهي بتحاول تعرض وجهتي النظر ورغم تبعيتها للخاريجة البريطانية فهي ليست اداة في يد المخابرات البريطانية ولا حاجة واكلام عن صلة مقتعلة زي دي كلام فاضي نابع من نظرية المقامرة اللي معششة في عقول العرب كلهم مش عارفة ليه تابعوا البي بي سي وورلد بجد وبعدين احكموا وقارنوا بينها وبين فوكس الاميركية وانتوا تعرفوا الحقيقة"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926035158/http://www.20at.com:80/article.php?sid=166"
