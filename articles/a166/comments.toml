[[comments]]
order = 3
subject = "على فكرة"
text = "رغم المشاكل والصدامات التي وقعت بين البي بي سي، وبين الحكومة البريطانية، إلا أن تحليل مضمون ما قدمته البي بي سي أثناء تغطيتها لحرب العراق وجدوا أنها كانت منحازة لوجهة النظر الأنجلو أمريكية، سواء بترويج آرائهم أو بالاعتماد على المصادر العسكرية الأنجلوأمريكية دون العراقية أثناء تحليلهم لمجريات الحرب، لذا لم يكن هذا التحيز ضد الرنتيسي بجديد على ذلك الموقع الذي يحسبه البعض معنا، بينما هو علينا"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616172047/http://www.20at.com:80/article.php?sid=166"

[[comments]]
order = 4
subject = "ما هي البي بي سي ؟؟ (قطوب)"
text = "عندما نعلم أن البي بي سي ما هي إلا هيئة إعلامية حكومية تابعة للخارجية البريطانية، وأنها ليست سوى أداة في إيدي جهاز الإستخبارات الخارجية البريطاني MI6 ندرك أنه من الطبيعي أن تبرز تلك الأداة \"وقت اللزوم\" لخدمة أغراض السياسة العليا ومصالح المملكة المتحدة في الخارج.. وهذا الطرح ليس بدعة جديدة في دنيا الإعلام ولا يستخدم للمرة الأولى في تاريخ البشر، فقد كان للقسم الألماني بهيئة الإذاعة البريطانية دور فاعل في الحرب العالمية الثانية، ومن الطبيعي أن تستخدم بريطانيا أداة كتلك في حربهاالإستعمارية في الشرق الأوسط، وفي مواجهة ذلك المد الإعلامي الغربي لا بد أولاً أن يتيقظ الوعي العربي والإسلامي وأن يتجه إلى القنوات الإعلامية التتي تلتزم بالحيادية والاحتراف الحقيقيين، مثل الجزيرة وإسلام أون لاين، والعربية..<br />كما ينبغي أن يفطن العرب جميعاً ومستثمريهم خاصة ، أن الحرب والمقاومة على الصعيد الإعلامي، من أهم وأخطر وأنجع سبل الدفاع وإعلاء الهمموإيقاظ الوعي العربي والإسلامي.."
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616172047/http://www.20at.com:80/article.php?sid=166"

[[comments]]
order = 5
subject = "مقالٌ واعٍ"
text = "شكرًا لإلقاء الضوء على الموضوع بهذا الأسلوب الخفيف النافذ.<br />هذا بالنسبة للمقال ، أما عن البي بي سي ، ففعلا كما ورد بالتعليق السابق :إنها أصلا أداة إعلامية غير عربية الهوية ، وإن كانت عربية اللغة، أي أنها إذاعة بريطانية موجهة بلسان عربي ، ولكن لا أحد من القائمين عليها (في الصورة) من العرب يجرؤ على تجاوز الحدود الحمراء الشائكة المطوقة له ، ولا تجاوز الخطط المرسومة من قبل السياسة البريطانية ، فأنى لنا بعد كل هذا أن ننتظر من هيئة إعلامية كهذه إنصافا للعرب والمسلمين ، أو حتى عدلا في التوجُه والتناول؟!<br />أجنادين"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616172047/http://www.20at.com:80/article.php?sid=166"

[[comments]]
order = 6
subject = "رنين الحب"
text = "بسم الله الرحمن الرحيم<br />لابد من ان تكون البىبىسى بالغه العربيه حتى يستطيعو ان يوصلو لنا مايريدون وان نغير ارائنا تجاه اى عمليه يفعلوها ولازم كمان يقولو اسباب مافيهاش اى شىء من الصحه فى عمليه الرنتيسى واحمد ياسين وباقى اغتيالات وتفجيرات التى يفعلوهالازم يقولولنا عن اشياء لكى يزيفو الحقيقه اومال هانبقى هادين ازاى عشان ما نعملشى ثورات بس كلنا بنهدى بكلامهم والدليل على كده اننا لم نفعل شىء بعد اغتيال الشيخ ياسين اللى اول ما اغتالوه قالنا كلنا دى نهايتهم لكن للاسف نيمونا وكملو واسفه فى التعبير بس هى دى الحقيقه.استاذ احمد زين ياريت ما اكونشى ساذجه وياريت تعطينا رايك الشخصى بعيدا عن المقال وبالغه العاميه حتى تستطيع ان تصل للساذجين<br />رنين الحب"
archived = "2004-06-16"
capture_url = "https://web.archive.org/web/20040616172047/http://www.20at.com:80/article.php?sid=166"

