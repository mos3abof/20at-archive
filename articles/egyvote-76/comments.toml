[[comments]]
order = 0
subject = "المحللين"
author = "مستاء"
posted = "2005-11-27"
text = "يء مضحك جدا.<br />لا تزال أحزاب الأنابيب تتحفنا كل يوم بما يثير العجب. بالله عليكم حد يعرف من الأحزاب دي سوى الحزب العربي الإشتراكي الذي يعترض على الوطني و تجربتنا معاهم و مع الإشتلراكية أمر من العلقم طوال الخمسينات و الستينات؟<br />و الله أنا أشك أن هذه الأحزاب مدفوعة من الحزب الوطني لتنفيذ نفس أجندة إنتخابات الرئاسه حيث لعب هذا البلياتشو وحيد الأقصري دور المحلل لسيادة الرئيس حتى يتم له إغتصاب مصر للمرة الرابعة.<br />كم مرشح لهذه الأحزاب المضحكة نزل الإنتخابات من الأصل حتى يعترضوا. و هل يريد سيادته للمرشحين الفائزين عن المعارضةو مؤيدوهم و مناصروهم أن يدخلوا تلك الدوامة مرة أخرى و يتعرضوا للبلطجة و القتل و الإعتقال و التحرش الجنسي بعدما أخذوا حتى الآن ما يزيد عن ال85 مقعدمن فم الأسد؟ و أنا هنا لا أتكلم عن الإخوان و لكن عن كل المعارضة.<br />لكن سيادته مش خسران حاجة. و على رأى المثل \" زغرطي ياللى مانتيش غرمانة\". إرحمونا الله يرحمكم جميعاً."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625175150/http://egyvote.20at.com:80/article.php?sid=76"

