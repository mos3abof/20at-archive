[[comments]]
order = 5
subject = "لاديمقراطيةمع شعب عاطفى غير عقلانى"
author = "ابن مصر"
posted = "2005-12-13"
text = "تمنى ان يعرف الشعب اولا معنى واختصاصات مجلس الشعب ومدى اهميتة فى صنع حضارة ومستقبل الامة وليس شعارات براقة واصحاب مصالح شخصيةوتصفية حسابات واتمنى ان يكون لااحزاب مصر برامج توعيةللمواطنين لمعنى كلمة انتخاب ومدى صلاحيات الاعضاء<br />وعندى كلام كتير ولكن لعل الشعب يفكر بعقلة ويترك العواطف والمصالح الشخصية جانبا ونبحث جميعا عن الذى يكون سببا فى تقدم بلدنا<br />والسلا م على من تبع الهدى"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625175150/http://egyvote.20at.com:80/article.php?sid=76"

[[comments]]
order = 6
subject = "حزب ايه اللى انت جى تقول عليه"
author = "الفهدالصاحى"
posted = "2006-01-11"
text = "نا بسال سؤال هل يا ترى الاحزاب التى تشكك فى نتائج الانتخابات لهاوجود فىالشارع المصرى انا لست مؤيدا للحكومة وانما اود ان نتحدث بصراحه الاحزاب دى ماجوره او بتبحث على الشهره باى طريقه واهو العيار اللى ميصبش يدوش وياريت الحكومة الموقره تلغى قانون الطؤارئ حتى نعرف حجم الحكومه وحجم المعارضه وبنقول للحكومه انتى خايفه من ايه الناس كلها بتحبك يا حكومه الناس المتخرجه ومش لاقيه شغل بتحب الحكومه الناس التعبانه من غلاء الاسعار بتموت فى الحكومه والمواصلات فاضيه والعيش متوفروالامن مستتب وكله تمام يااحزاب شوفوا نفسكم فى مراية الحقيقه واكلموا في مشاكل الناس وبعد كده قولوا بطلان الانتخابات وخليها تيجى من حد تانى دالانتخابات كانت حره نزيهه مافيش غلق جماعى للجان بطاقات مضروبه وتدفع كام وكده كفايه لان الانجازات كتيره سواء للاحزاب او الحكام"
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625175150/http://egyvote.20at.com:80/article.php?sid=76"

[[comments]]
order = 7
subject = "اذهب يا مبارك"
author = "سمير المصرى"
posted = "2006-03-26"
text = "رسالة مفتوحة الى حسنى مبارك<br />السيد/ محمد حسنى مبارك<br />بعد التحية<br />نرجو أن تستقيل أنت و حكومتك فورا و أن تتنازل عن الحكم الى لجنة مؤقتة تتألف من رؤساء الأحزاب و بعض الأعضاء المستقلين بمجلس الشعب لحين تعديل الدستور و اجراء انتخابات حرة مفتوحة يختار الشعب من خلالها رئيس الجمهورية و نائبة و رئيس الوزراء و أعضاء الحكومة<br />و أسباب استقالتك هى<br />أولا: انك تفتقر الى الشرعية فلم تجيء الى الحكم من خلال انتخابات حرة مفتوحة كما أن الظروف التى أدت الى تبؤك السلطة فى البلاد مشكوك بها و مثيرة للجدل<br />ثانيا: انك تخطط لحكم البلاد مدى حياتك عن طريق تزوير ارادة الشعب فى الوقت الذى لا توجد فية وسيلة سلمية متاحة للشعب لتغييرك<br />ثالثا: أنك تخطط لأن تورث الحكم الى نجلك جمال مبارك<br />رابعا: انك خدعت الشعب طيلة 21 عاما باخفائك عنة سببك الحقبقى لعدم تعيين نائبا لرئيس الجمهورية و الذى تبين بأنك كنت تخطط و تعدابنك جمال مبارك ليرث الحكم من بعدك<br />خامسا: انك عرضت أمن البلاد و سلامتها للخطر طيلة فترة حكمك بعدم تعيينك لنائبا لرئيس الجمهورية و كان ذلك بسبب مأرب شخصى لك و هو توريث الحكم لنجلك من بعدك<br />سادسا: انك حكمت البلاد باستخدام أبشع اساليب البطش و التنكيل و الارهاب تحت وطأة و نير الأحكام العرفية و قانون الطوارىء و قوانين و قرارات أخرى كبلت بها الحريات و كممت بواستطها الأفواة بمصر دون مبرر صحيح والتى فرضتها على الأمة لتستعيض بها على انعدام شرعية وجودك و انتهكت بمقتضاها حقوق الانسان و نكلت بخصومك و معارضيك أبشع تنكيلا و هى أفعال مؤثمة و خسيسة أدانتها و شجبتها الحكومات و المنظمات الدولية.<br />سابعا: انتشر الفساد فى عهدك بصورة لم يسبق لها مثيل و ضمت زمرتك الحاكمة عناصرجا<br />اقرأ بقية التعليق .."
archived = "2006-06-25"
capture_url = "https://web.archive.org/web/20060625175150/http://egyvote.20at.com:80/article.php?sid=76"
