[[comments]]
order = 1
subject = "اغرب عصابات البلد"
author = "حازم طه محمد"
posted = "2006-04-22"
text = "بسم الله الرحمن الرحيم<br />انا اخد حقى ازاى<br />اغيثونى من اخطر حرامية البلد<br />شريف محمد رشدى مديرية امن الجيزة (ساحر) و صالح ( المرماح ) بنىسويف ( ساحر)<br />و محمد احمد عبد السلام (ساحر) مكتب محافظ القاهرة<br />و الز عيم رجل اعمال من عباس العقاد يمتلك احد المعارض به و عنده بنت اسمها ايمان و تم سرقة صفقات منى و مبلغها ملا يين الدولارت و الله العظيم هذا حقيقى و تم ابلغى امن الدولة و قال لى هذا ليس من اختصاصى اذهب الى الاموال العامة و تم ابلغى و الى الان لم استطيع اخذ حقى و الله العظيم مع و قف الحال التام مع العلم انى سافر ت شهرين. الى احد الدول الا جنبية للتسويق و حدث معى نفس اللى حدث فى مصر فما الحل اغيثونى و شكراً للتفاصيل فى انتظار الرد<br />حازم طه محمد<br />0106364582"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210816/http://masr.20at.com:80/article.php?sid=90&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

