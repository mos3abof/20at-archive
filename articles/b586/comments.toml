[[comments]]
order = 10
subject = "الحدوته الجديده"
author = "هوووووبه او هبابه او هبهوب"
posted = "2006-03-20"
text = "لسه يا نوفا.<br />\" في شي واحد عندي اكيد دنيتانا بتمشي بعيد ما بتستناش \"<br />\" لكن طول الحياه حنكون طوقك للنجاه لو يوم من الايام حلمك تاه \"<br />\" حتلاقينا واقفين وقت الشده موجودين وانتي حتكميلي المشوار . مهما عمرك حيطول في شي راح يتحدي الكون ان قلوبنا حتكون قلب كببببببببير \"<br />\" وهي دي دايره الحياه _______\"<br />تيمون \" هكونا متاتا \" يعني اديها \"طبنجه\" . بس تكون عمرانه."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133354/http://www.20at.com/article2.php?sid=586"

[[comments]]
order = 11
subject = "يا كرمله"
author = "هبهوب , هبه , هوبي"
posted = "2006-03-20"
text = "بص يا كرمله الموضوع بتاع الشرق والغرب دا<br />انا خلاص زهقت منه لا شرق راضي يتمسك بروحانيته اللي اشك ان لسه فيه ولا الغرب راضي يسيب ماديته اللي متاكده انها فيه<br />يبقي يا باشا ان المشكله \" صراع اديان \"<br />وعلي راي مصطفي محمود لو امريكا بتحارب الاسلام بيجيها من البوابه الخلفيه \" اللي هما الامريكان نفسهم \"<br />تقدر تقولي ليه مسكه \" يوسف اسلام \",<br />هما نفسهم بيسالوا ولما يسالوا يعرفوا واستاذنا حمزه يوسف . \" انا بتلخط ما بنهم \"<br />وغيره وغيره ودا ليه اسلم ودا ليه<br />الرك يا باشا علي اللي عندهم اسلام ومش عارفين الصح فين<br />بص الموضوع دا كبير وعايزله \" قهوه تركي \"."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133354/http://www.20at.com/article2.php?sid=586"

