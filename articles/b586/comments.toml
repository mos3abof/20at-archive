text = "معلشي الكابتن اللي فوق جمع الشيخ اسامة بن لادن مع العتة والنماردة والجبارين<br />لا معلشي من فضلك دة اول مسلم ينطق ويجاهد بجد وساب اللي وراة واللي قدامة ورضي يترمي في الصحرا كل دة عشان مين ؟"
