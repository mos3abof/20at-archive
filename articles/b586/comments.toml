[[comments]]
order = 0
subject = "باربى جيرل"
author = "نيفين"
posted = "2006-03-18"
text = "موضوع اننا نعمل تان تان عربى ده بيفكرنى لما قرر العرب يحارب العروسه باربى اعروسه عربيه و سموها فله<br />حاةلنا نعمل توم اند جيرى و معرفناش<br />عملنا بكار<br />نحاول نعكل تان تان عربى<br />متهيالى ممكن<br />عايزين بس عقول كويسه تحترم عفليه الطفل العربى اذكى اطفال العالم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133354/http://www.20at.com/article2.php?sid=586"

[[comments]]
order = 1
subject = "نحن لا ننظر للمستقبل"
author = "مسلم مصري"
posted = "2006-03-18"
text = ". . نحن لا ننظر إلا تحت أقدامنا كثيرا ما نفشل في عرض أي مادة إعلامية توضح للطفل العربي الثقافة العربية الصحيحة خالصة من الشوائب الأوربية .<br />وفعلا الطفل العربي من أذكى أطفال العالم ولكن إن تم استغلال تفكيره بصورة سليمة ولكن غالبا تتوجه هذه العقلية الصغيرة للتفكير في تفاهات الأمور تاركين كبيرها.<br />وأخيرا . . أقول في قصص النبي صلى الله عليه وسلم وأصحابه عبرة ، لعلنا نعتبر .<br />ويمكن من أفضل وأنجح ما قدمه التليفزيون العربي وبالتحديد المصري . .قصص الأنبياء بالصلصال التي نالت إعجاب الكثيرين فعلا . . ولكنها كانت تحتاج لبعض التنقيحات وأنا لا أقلل من قدرها."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133354/http://www.20at.com/article2.php?sid=586"

[[comments]]
order = 2
subject = "حلو"
author = "virus"
posted = "2006-03-18"
text = "احييك ع الموضوع .. موضوعك حلو فعلا<br />وواضح انك تعرضت لكثير من تان تان ..<br />احمد خالد توفيق وروايات مصرية للجيب اعتقد انها بتحترم عقلية المراهقين نسبيا .. اما قصص مصورة فلا اعتقد ان المراهقين سينجذبو لها .. هيحسوا انهم كبروا عليها .. اعتقد جديا المفروض نبدا ندرس اصلا عقلية الطفل وبعدين نطبق عليه كيفية التعلم من القصص المصورة امثال ميكي .. ميكي بقت متخلفة اوى اوى والغريب انها لسه مستمرة على تخلفها !!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133354/http://www.20at.com/article2.php?sid=586"

[[comments]]
order = 3
subject = "مشكله"
author = "عبدالله مفتاح"
posted = "2006-03-18"
text = "الموضوع اكبر من كده انا عن نفسي في حاجات من طفولتي لسه عالقه في بالي ومش عارف ليه؟<br />الغريبه ان الحاجت اللي كانت بتتعرض على انها كرتون انا والله مكسوف اكتبها دلوقتي وانتو تقرؤوها<br />بستغرب ازاي كانو بيعرضوها علينا احنا الاطفال ولو مصمممين على انكم تعرفوا القصه عايزكم تقولولي وانا هبقا اكتبها<br />والى اللقاء"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133354/http://www.20at.com/article2.php?sid=586"

[[comments]]
order = 4
subject = "اه بس حعمل اني ناسيه"
author = "هبهوب , هبه , هوبي"
posted = "2006-03-18"
text = "اولا بقي الكارتون حاجه لديده اوي اوي اوي<br />ولسه بتفرج عليها ودا ميقلليش من صاحبها<br />\" عيله اصلي \"<br />رويات مصريه للجيب مش للمراهقين بس يا سي فيروس<br />المهم هي عايزه توصل ايه وعلي فكره بعد اما زهقت من قريتها رجعت وقرتها تاني \" هبل اصله \"<br />باربي جيرل يا نفين اللي اعتقد كانوا وسموها فله او حاجه كدا فكره لديده فعلا<br />بتنمي الانتماء دا غير انها كانت مصصممه علي هيئه فتاه محجبه وبتعلم الحجاب للفتيات الصغار .<br />الكارتون اللي شوفته وعجابني \" محمد الرساله \".<br />وبحب كمان \" اغنيه بكار \" موت وبهديها \"لاسوان \"<br />انا في فتره اتفرجت علي الفاتح \" وقطز \" بتاع كتائب التتار كويس جدا ولون<br />الاعداد مش بالمستوي<br />اهتموا يا بشر بالصغار وعلموهم بالصلصال<br />\" اوعي يلغوص اديهم \".<br />يبقي بقي حبيب قلبي \" ليون كينج \"<br />اللي في معني كتير بحبها اوي<br />بس كفايه عليكوا كدا النهارده بكره الصبح ححكلكوا \" حدوته جديده \""
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133354/http://www.20at.com/article2.php?sid=586"

[[comments]]
order = 5
subject = "انا باعشق تان تان وعم دهب"
author = "Dabdoob"
posted = "2006-03-19"
text = "انا باعشق تان تان وجرانديزر والحاجات دي<br />وكنت بادور عليها علي طول وانا صغير وكنت باستمتع بيها جدا<br />ولحد دلوقتي لسة بحس ان الكارتون والقصص المصورة (comics) جزء من ذكرياتي وطريقة تفكيري يعني لحد دلوقتي قصة (قصة حياة دهب) اللي كانت بتتنشر مسلسلة في سوبر ميكي سنة 1996 وازاي كون ثروته العملاقة دي<br />بصراحة القصة تحفة وممتعة جدا وبتعلمنا حاجات كتير<br />بس ارجع اقول للاخ عبدالله مفتاح انه يفتكر ان بعض الفقهاء السلفيين حرموا هذه النوعية من القصص لان بها روح<br />فارجو منك التعليق مع ملاحظة اني علي الماسنجر لحد الساعة 4.5 النهاردة<br />وسلام<br />Dabdoob"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133354/http://www.20at.com/article2.php?sid=586"

[[comments]]
order = 6
subject = "نفسى اكةن حره اطير و لا هو مصير على الجبين"
author = "نيفين..نيفى..نوفا"
posted = "2006-03-19"
text = "اه يا هبه اه يا اكرم عملت زيكو و غيرت اسمى.. فعلا يا مصرى مسلم فصص الانبياء اللى بالصلصال دى كانت تحفه و الاتحفمن فعل ت ح ف )تتر البدايه و النهايه بالذات بصوت الحجار....كمان كنت بحب و انا صغسره اليس فى بلاد العجاءب<br />هبه انا بتعجبنى الجمله دى اوى<br />معلش انى مبعتلكيش<br />مشاغل (يختى)<br />متعوضه يا هوبه<br />استنينى<br />متنسوش يا جماعه فقره توم اند جيرى على سبيستون الساعه 9"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133354/http://www.20at.com/article2.php?sid=586"

[[comments]]
order = 7
subject = "غياب الحرية يقتل الابداع"
author = "مسلم"
posted = "2006-03-19"
text = "يا أخوان ، لعلكم سئمتم كلامي من كثر ما أكرره ، لكن هذه هي الحقيقة .<br />إن مشكلتنا في العالم العربي ، ليست في عدم وجود الملاكات المبدعة ، لا - يا أخوتي- المشكلة في غياب الحريات ، فنحن لا ننتفس الا هواء الديكتاتورية والقمع .<br />قما ظنكم بمسجون ، هل يبدع شيئا.<br />أولويتنا اليوم ، هي التحرر من قيد الديكتاتورية والقمعية ، حينئذ سترون شلالات من الابداع."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133354/http://www.20at.com/article2.php?sid=586"

[[comments]]
order = 8
subject = "تان تان كون كتير من شخصيتي"
author = "كرميلينو"
posted = "2006-03-20"
text = "اولا احب اشكر صاحب الموضوع لانه موضوع مهم بالفعل و اتكتب من غير فذلكةو لا فرض رأي و لا حاجات كتير من اللي انا بتخنق منها<br />ثانيا احب ااقول فعلا ان قصص تان تان كونت كتير من شخصيتي و المعروف ان شخصية البني الادمين بيتكون اكثر من 90 % منها في الطفولة و الباقي على مدار العمر<br />تان تان هو من صنيع الغرب و طبيعي انه يكون منحاز ليهم ضد كل الثقافات و احنا هنا في مصر بنقول على الهندي انه بينام على مسامير و بيعبد البقر و بيركب الفيل مع ان الهند عضو في النادي النووي و نادي الفضاء و اكبر مصدر للسوفت وير<br />المشكلة مشكلة حوار حضارات حقيقي غايب و هيغيب و هيغيب على طول<br />مادام في ناس زي جورج بوش و توني بلير و اسامة بن لادن و حسني مبارك و عبد الله بن عبد العزيز و بويز مشرف طبيعي يحصل صراع حضارات و يبقا في حوار اشبه بحوار الطرشان بيننا و بين الغرب<br />و طول ما في شعوب هابلة و جاهله زي الشعوب العربيةو الشعوب الغربية مفيش فايده ( على رأي دبدوب ) و ده مش احباط و الله ده الوضع الحخقيقي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102133354/http://www.20at.com/article2.php?sid=586"

[[comments]]
