subject = "هاهاهاهاها"
author = "منة الحضرى"
posted = "2006-08-02"
text = "لو سألتك انت زملكاوى تقولى ايه تقولى فشر انا اهلاوى و الزمالك طظ فيه هاهاهاهاهاهاهاهاى كفاية ان كل لعيبة الزمالك بيحلموا يلعبوا فى الاهلى كفاية ان اغلب لعيبة المنتخب من النادى الاهلى و انا عايزة اقول انى باعشق الحضرى جدا جدا جدا و باموت فيه و ان اسمى بين صحابى منة الحضرى يعنى اكتر من كده ايه ربنا يديك يا عصام اكتر من كده و دايماتبقى الحارس الاول فى مصر و افريقيا و العالم العربى كله و كلمة اخيرة الاهلى و بس و الباقى خس هاهاهاهاهاهاهاى قال زمالك قال"
archived = "2006-09-06"
capture_url = "https://web.archive.org/web/20060906100808/http://masr.20at.com:80/article.php?sid=325"

