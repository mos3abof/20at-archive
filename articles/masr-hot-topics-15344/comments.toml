author = "حمرا يا زخاري"
posted = "2010-02-15"
text = "جدع يا زخاري 2010-02-15 / 23:08 شهدت الأسابيع الماضية إطلاق حركة جديدة أطلقت على نفسها اسم \"نعم\"، أسسها مواطن قبطي اسمه ممدوح زخاري جرجس. ويرى مؤسسو الحركة الجديدة أن جمال مبارك هو الأصلح لحكم مصر بعد والده، وفق ما نقلت صحيفة \"المصريون\" الأربعاء."
archived = "2010-02-17"
