author = "شيلنى واشيلك"
posted = "2010-02-16"
text = "العلاج على نفقة الدولة لاعضاء مجلس الشعب بمبلغ 5 مليون جنية يوميا<br />عارفين العلاج للمرضى بيتم فين<br />فى المستشفى الخاص ملك السيد وزير الصحة الهمام - مستشفى دار الفؤاد ومستشفيات الاثتثمار الخاصة بأصدقاء الوزير وحبايبة ومعارفة<br />يعنى الفلوس فى النهاية بتصب فى جيب الوزير وحبايبة<br />ولو مش كدة<br />مفيش ولا قرار بالعلاج على نفقة الدولة هيصدر<br />مش قلنا لكم انها عزبة<br />والكل بيلهط فيها"
archived = "2010-02-17"
capture_url = "https://web.archive.org/web/20100217192859/http://www.20at.com:80/masr/hot-topics/15344-2010-02-15-19-53-17.html"

