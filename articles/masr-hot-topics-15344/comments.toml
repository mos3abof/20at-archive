subject = ""
author = "العار فى مصر"
posted = "2010-02-16"
text = "ذهبت لتحليل عينة الدم ومعرفة نوع فصيلة الدم فى مستشفى حكومى كبير فية اكثر من 80 طبيب<br />والمصيبة الكبرى ان الدكتورة كتبت فصيلة الدم الخاصة بى من دماغها بدون تحليل فى شهادة لتقديمها لمنطقة التجنيد<br />ولما سالتها لية مفيش تحليل حقيقى لفصيلة الدم<br />قالت لى - للاسف المادة الكيميائية بتاع التحاليل غير متوفرة بالمستشفى<br />وتخيل لو مصاب فى حادث او سيدة فى حالة وضع وعندها نزيف ومحتاجة نقل دم ولا احد يعرف فصيلة دمها<br />المستشفيات الحكومية مأساة كبيرة<br />وكل ميزانية الصحة والتعليم رايحة لوزارة الداخلية والامن المركزى"
archived = "2010-02-17"
capture_url = "https://web.archive.org/web/20100217192859/http://www.20at.com:80/masr/hot-topics/15344-2010-02-15-19-53-17.html"
