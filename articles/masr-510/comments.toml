[[comments]]
order = 1
subject = "حـــــــتــى الــطــفــولـــه ؟؟؟؟"
author = "مثل كل شىء فى مصر مبارك ...منتهك"
posted = "2006-06-15"
text = "لكن بالنسبه للاطفال فالامر اقسى و امر و يثير الالم بداخل اقسى القلوب غلظه عدا قلب النظام و اعوانه بالطبع<br />لو مريت على اى منطقه صناعيه من المناطق الصغيره غير الادميه المنتشره فى كل مكان حتلاقى النسبه الاكبر من العماله اطفال و معاملتهم من اصحاب الورش و العمال الاكبر منهم شىء لايتخيله انسان طبيعى و تلاقى اللى بيدافع و يقول اصل انا بعلمه و الاغرب ان اسر الطفال دى تحت ضغط الفقر المدقع بتوافق ان اطفالها تتعذب بالشكل ده علشان الجنيهات القليله اللى بيحصلوا عليها نتيجه شغلهم<br />الـــــرحــــمــــه يـــا رب<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأأه يــــــا بـــــلــــدى"
archived = "2006-06-16"
capture_url = "https://web.archive.org/web/20060616051612/http://masr.20at.com:80/article.php?sid=510"

