[[comments]]
order = 3
subject = "مش همة بس"
author = "ام العيال"
posted = "2006-06-16"
text = "مش همة بس الليكدة دا احنا كلنا ولاد شوارع في ظل حكم مبارك كلنا مصيرنا الشحاتة والطبقة المستغلة هية اللي بتدينا<br />مين قال ان مصر فقيرة<br />مصر بلدنا ياولاد مسروقة<br />والنتيجة اهوة احنا احسن الامم شوفوا ولادنا بقوا ولاد شوارع<br />والله احنا فدا مصر بس تتعدل الاحوال<br />نموت نموت وتحيا مصر<br />بس اسالوا نفسكم الاول السبب مين؟؟<br />مش حسني بس هوة السبب ولا ابنة جمال<br />احنا الاساس احنا السبب الرئيسي في خراب بلدنا لاننا ساكتين كل دة<br />نستاهل واكتر لان كلنا اجبن من ان نتكلم<br />يارب نتفق وانا معاكم علشان مش بس حننقذ العيال دي<br />حننقذ عيالنا واهالينا ومصيرنا وحياتنا القادمة"
archived = "2006-06-17"
capture_url = "https://web.archive.org/web/20060617174122/http://masr.20at.com:80/article.php?sid=510"
