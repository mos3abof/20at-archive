[[comments]]
order = 5
subject = "بلد اشاعات صحيح"
author = "ايمن امام"
posted = "2006-12-02"
text = "خبر عاجل<br />فاروق برىء يارجاله- الاخوان هما اللى الفو القصه -علشان يهدموا الانجازات التى تحققت فى العهد الماضى والحاضر والمستقبل- مش عيب عليكو تصدقوا الاخوان وتصدقو جرنال المصرى اليوم-ما هو المصرى اليوم غير المصرى امبارح - والصحفى بتاعكو طلع عميل لكنتانوبيا وبيقبض منها دره مشويه على الكورنيش - وطالما ان الامر طلع هبل فى هبل - يبقى كلام الحكومه صح - انتو ماينفعش تصوتو فى اى انتخابات لانكم هبل والحكومه هى الوصى عليكو ياهبل- وروقه - اقصد سكر بيه المحلى - اتظلم فى اللعبه دى -شعب مابيعرفش يقراء ولايفهم الحكايه ان سكر بيه لما اتكلم على الحجاب كان يقصد الحجاب الحاجز لكن انتو نيتكو وحشه فسرتو الكلام على مزاجكم - قال ايه خريجى جامعات قال جاتكو النيله جهله - حد يشتم فى سكر بيه منهم لله الاخوان - دايما كده يظلمو الشرفاء - ولابلاش الشرفاء دى- دايما يظلمو المثقفين - الراجل كان بيتكلم عن الحجاب الحاجز اللى بيفصل بين الامعاء والاذن الوسطى - انتو فهمتو غلط - اه يابلد - مش كفايه عليكو الراجل مثقفكو-عشان كده اقترح نألف نشيد فى حب فاروق نقول فيه - مين ثقفنا مين قدمنا مين فهمنا = سكر/ مين علمنا مين شغلنا مين وسعنا= سكر/ مين ظلموه مين دبحوه مين هانوه=سكر/ مين متطرف مين ارهابى مين متخلف =مسلم/ مين اخرنا مين ضيعنا= مسلم/ - اه يابلد بقى الراجل المحترم دا تعملو فيه كده- الرجل الاوسع ثقافه فى مصر تعملو فيه كده - مفخره مصر - تعملو فيه كده- طب ايه رأيكو ان صورته ها يحطوها على العلم بتاعنا بدل النسر - قال نسر قال- بالذمه نسر ولاسكر- دا حته يبقى علم كله سكر- واوعدك انه ها يتباع منه كتير بره مصر فى اوروبا والدول المتجدمه- واكيد ها يعملو له عمله تذكاريه بدل ابو الهول- ورمسيس- والشله دى لانها موض<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073404/http://masr.20at.com:80/article.php?sid=1234"

[[comments]]
order = 6
subject = "عيب عليكم"
author = "بسمة"
posted = "2006-12-04"
text = "بصراح انتم زي حكمكم كل من يخلفكم الراى هو عميل او بيحارب الاسلام بالظبط نسخة مكررة من الحزب الوطني مستبدين في افكاركم وارئكم اتمات جاهزة او مفبركة لا تسمعون الا اصواتكم هذا الاسلوب في التجريح والسباب لكاتب المقال لانه وجهه نظرة مخالفة لما تريدون ان تسمعونه يا ابن بهية اسفة اقولك عبد الناصر زعيم عربي عظيم ولا اري في الدفاع عن فكرهة ان نشتم الاخرين بل ان نتكلم في اعراضهم ونخوض في مسائل شخصية ثم اذا كنت لا تريد ان يسب احد الناصريون والاخوان المسلمين فلماذا تعطي نفسك هذا الحق يا اخي لماذا انتم دائما تتوسمون في من يخالفكم الرائ العمالة و الخروج عن الاسلام وهي اتهمات خطيرة وا رجعوا لسيرة نبيا الكريم محمد عليه الصلاة والسلام لتعلما جميعا كيف كان رجل دولة ورجل دين"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073404/http://masr.20at.com:80/article.php?sid=1234"
