[[comments]]
order = 1
subject = "فين المنتج يا عمونا ؟؟؟"
author = "إبن بهيه"
posted = "2006-12-01"
text = "كلام معقول برضه يا مجدي حكاية تايوان دي .. ياهـ ... تصور أنا صدقت يا أخي وطلعت عبيط وأهبل زيك كده بالظبط .. أتاريه كان مبسوط ولا هامه وكان عايز الشعب المصري اللي ظلمه يعتذر له ويبوس إيديه عشان تفضل ترعانا وترعى ثقافتنا وثقافة ولادنا .. أما إننا ناس مهابيل ... تصور يا أخي صدقنا الفيلم ؟؟؟ اللي كتبه مفيد شهاب ومثله وأخرجه فاروق حسني اللي عمل فيه دور البطل والبطله كمان زي عادته في الحقيقه .. أيوه يا مجدي دي إضافه من عندي .. مش حضرتك قلت البطل بيتجوز البطله .. طيب آديك وقعتنا في مشكله .. يا ترى نخلي فاروق بطل ولا بطله ؟؟؟ عشان كده أنا راح أخليه يعمل الدورين وهيكون فيهم أحسن بكتير من علاء ولي الدين في الناظر وطبعا أطعم من هنيدي في يانا يا خالتي .. بكده تكون النهايه معقوله ... لكن حضرتك برضه نسيت المنتج يا أستاذ مجدي .. برضه كده ؟؟؟ حد ينسى ماما سوزي الحنينه السكر دي اللي حلفت ببرطوشة أبوها (راسه يعني) يا ترجع صاحبتها فيفي الوزاره يا ما هياش قاعده في البيت وحتسيب مصر وترجع لبيت جدها في ويلز ببريطانيا عند خالاتها هناك وممكن يلاقولها عريس .. ولا يجوزوها تشارلز اللي راح يتوج قريبا ملكا لبريطانيا ولا حوجه للمصري المعفن الواطي اللي هنا اللي عايزه تعمل منه ملك لكنه أوطى من كده بكتير ... دي عمله يا مجدي برضه تنسى المنتج يا راجل ؟؟؟<br />على فكره يا مجدي إحنا مش ناسيين أن جرنالكم هو اللي نشر قصة الفيلم ، عشان كده خلي بالك ممكن ماما سوزي السكر الحنينه تقفلهالكم .. يالا أحسن .. عشان تبطلوا أوشاعات يا وحشين ...<br />إبن بهيه<br />http://ibnbahya.blogspot.com/"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073404/http://masr.20at.com:80/article.php?sid=1234"

