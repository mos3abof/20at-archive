[[comments]]
order = 3
subject = "وبريالة كمان"
author = "mego_mego"
posted = "2006-12-01"
text = "استاذى الفاضل / مجدى مهنا<br />السيدالمحترم ابن بهية :<br />اولا شكرا على كل التوضيحات لكن اسألكم واتستحلفكم بالله حد يقولى مين الاهبل والعبيط واللى بريالة احنا ولا هما حد يسيب وزير يفض فى منصبة من عام 1986 الى عام 2006 انتم شاربين حاجة<br />وبعد كده الاخ مجدى مهنا بيقولنا ان الفيلم ده جامد طيب ما هو الفيلم الاجمد بعد ما اثار مصر اتنهبت والناس اتحرقت فى قصر الثقافة وانتم سايبين الراجل ده ولا بلاش راجل لاحسن يزعل سايبنه كده ازاى واحد وعشرين سنة وزير<br />مش عارف اقول حاجة لان مافيش حاجة تتقال غير حسبى الله ونعم الوكيل<br />ا مجدى مهنا فهمنا قصدك<br />السيد ابن بهية تحية من اخوك رئيس تحرير اللى دعاك واى الان لم تقبل دعوته<br />رئيس تحرير"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205073404/http://masr.20at.com:80/article.php?sid=1234"

