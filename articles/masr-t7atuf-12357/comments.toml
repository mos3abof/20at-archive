text = "حلووا عن عمرو خالد عاد بكفي لما تكون الأمة أمية إمعه تابعة ورا اكم من مذهب حطوهم ناس مفش بقلوبهم تقوى والعياذ بالله<br />ولما تكون الامة عمياء وعقولها عليها أقفال اشي طبيعي يثوروا ضد عمرو خالد<br />هوه عمرو خالد ما غلط ل غلط فعلا كان لازم يكون اشد من هيك واكثر في ما يقهركم<br />زادك الله يا عمرو تقدما وزادهم هدى او قهرا هم عباده وله امرهم<br />شو كاين بعمل عمرو خالد ول عليكم هوه كاين بكفر بس بحكي كلام كبير على عقولكم المغموسة في الدنيا وتظل تقول هل من مزيد<br />سحقا بعدا لكل من عادى عمرو خالد او اي شيخ آخر يا أعداء الله ماذا اوتيتم انتم فتبطلوا قوله وكأن الله انزل معجزاته عليكم فلولا تذكرونا انا كنا كثيروا النسيان<br />إستغفروا ربكم عسى ان يزيل عن قلوبكم حجودها انه هو الغفورالرحيم<br />قدروا نعمة بين ايديكم اسمها عمرو خالدواشكروها ولا تكفروها"
