[[comments]]
order = 6
subject = "يا عربياتك يا مصر"
author = "نيفين..نيفى ..نوفا"
posted = "2006-05-18"
text = "و الله يا جماعه بتبقى حاجه مسليه اوى ان الواحد فعلا يقرا التعليقات اللى بتبقى مكتوبه ع العربيات خدو عندكو<br />على عربيات النقل<br />الحلوه لكا تدلع تخلى الاسفلت يولع(اساسى ف كل النقل ف مصر)<br />يقينى بالله يقينى<br />ايه يعمل الحاسد مع الرازق(ال يعنى حال البلد منتعش و يسر)<br />و على الملاكى خدو عندكو<br />the big boss<br />بكابوزا<br />who can race me<br />انسلى يا عمرو<br />شيكى دودو<br />دا غير الحروف الاولى لاى couple<br />ممكن تلاقى wa<br />fu<br />nd<br />دا غير التعليقات اللى انتو عارفينها و الواحد ميقدرش يقولها و اشهرها اللى كان انتشر ايام مسلسل زكيه زكريا و كلكو اكيد عارفينه<br />بس يمكن من اخر التعليقات اللى قراتها على عربيه ملاكى لسه من يومين<br />do not look behind u..there is nothing u can do<br />نصيحه برده"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112821/http://www.20at.com/article2.php?sid=815"

[[comments]]
order = 7
subject = "مرة قرأت ملصق جيد"
author = "لو كان الرزق بالجري مكنش حد حصلني"
posted = "2006-06-08"
text = "بس في العموم اللي يلصق شيء مكتوب بالعربي في العموم الناس بتعتبره مش كلاس عمومًا أن جربت ألصق ستيكر بتاع شركة ملابس معروفة إلى حد ما اسمها مومو MOMO وفعلاً لزقته لى الزجاج الخلفي لمدة يوم واحد فقط ثم نزلت من الشغل لأجد فرع شجرة ضخم مشرف على الكنبة الخلفية للسيارة وبالطبع الزجاج مهشم عن آخره واللي يزعل طبعًا أن الملصق باظ \"حاجة تزعل بجد\" علشان كده لو أنت حاتت ملصق مومو فكر تاني"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112821/http://www.20at.com/article2.php?sid=815"

