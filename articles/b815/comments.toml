subject = "عندنا"
author = "فى مصر عندنا الوضع مشابه لكن معظم اللحوات تكون على سيارات الاجره واشهرها"
posted = "2006-05-16"
text = "عضه اسد ولا نظره حسد<br />العين صابتنى ورب العرش نجانى<br />ربك لنا يريد<br />ومن السائقين من يكتب اسماء اولاده مسبقين بالقاب مثل<br />البرنس فلان - الاميره --<br />ومنهم قلى بيكتب مقاطع من اغانى<br />منهم لله اخدو صاحبى منى<br />اخى رجع صوتك هز الورا سيبقا شعاعا يضئ الثرا فان غيبوك ليخفت نور فانت بقلبى هنا نيرا<br />الحريه للمعتقلين الحريه للوطن<br />لا للتمديد...لا للتوريث... نعم لتعديل الدستور<br />yehia2784@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102112821/http://www.20at.com/article2.php?sid=815"

