subject = "من اقوال الرسول (ص)"
author = "احمد المصرى"
posted = "2006-05-15"
text = "قال رسول الله صلى الله عليه وسلم اطلبو العلم ولاو فى الصين *<br />ومدمتى طالبت علم فيجب عليكى التحمل<br />ومدامت انا اب او انت ام تسقى فى<br />ابنتك او ابنكفلا داعى للخوف<br />مادمت ازراع كما يجب<br />فابتائكيد هاحصد ما زراعت<br />اذا لما الخوف ؟؟؟؟؟؟؟؟؟؟؟؟"
