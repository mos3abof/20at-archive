[[comments]]
order = 3
subject = "today is a new day to learn some thing new"
author = "هبهوب..هبابه..هووووبه"
posted = "2006-04-24"
text = "فعلا البنات لما بتتغرب باختلاف مكان المدينه الجامعيه بتتغير , انا مثلا هبه بتاعت<br />امبارح العصر مش هبه دلوقتي اكيد اغيرت , بدل من المدرسه للبيت ومن البيت للدرس<br />اتغيرت وبقيت من حاجه لحاجه . مكان الدرس اتغير طبعا . وجهه نظري ان المرمطه بتعلم<br />علي راي بويا وسيان بنات .. صبيان اتمرمطوا , دا حتي المرمطه طعمه اوي واهم حاجه بتعلمها الاعتماد علي النفس<br />اه \"الكابتن\" واحد تاني \" اجابه سؤال حضرتك في الارشيف قسم علاقات موضوع<br />منفوخه مصريه في السعوديه حتلاقي تعليقي \"منور\" يا \"متنور \"."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071718/http://masr.20at.com:80/article.php?sid=216"

