[[comments]]
order = 5
subject = "يااااااااااااااااه قلبتوا عليا المواجع"
author = "smsma"
posted = "2006-04-25"
text = "يااااااااااااااااه قلبتوا عليا المواجع<br />فكرتوني باجمل سنتين عدوا عليا<br />انا فاكرة اول ما وصلت المدينة وشفت انها بلاط ومش مفروشة وسرايرها حديد ومراتبها زي الورق كانت معايا ماما قلتلها اني حاروح اصلي الظهر ساعتها قعدت اصلي وانا بعيط<br />وقعدت حوالي يومين تلاتة مش بعمل حاجة غير اني اعيط<br />بس كنت ساعتها مش متخيلة الوضع بقيت باكل اي حاجة وبغسل حاجتي بايدي لا في غسالة اتوماتيك ولا حتي العادية وبصحي لوحدي وبصرف علي نفسي<br />بس بعد ما حولت وخلصت الغربة خلاص بجد وحشتني الغربة والمدينة بكل اللي فيها بحلوها ومرها واجمل ما فيها مرها ايام المدينة وحكاوي المدينة وتهيسنا مع بعض وحشرات المدينة والشاي ...المشروب الرسمي هناك والمكرونة اللي ما تتاكلش والرز المعجن والاكل اللي كل واحدة بتجربه في التانيين و ازمة اخر الشهر وكشري اخر الشهر وايام الامتحانات والمذاكرة مع بعض والسهر والحكاوي علشان نهرب من المذاكرة والسلف من طوب الارض اخر الشهر ونلم من بعضنا بالربع جنيه علشان نجيب اللوح ولا علشان نتغدي<br />ياااااااااااااااااه كانت ايام بهدلة بس بنستحمل علشان مع بعض بجد ياريت ترجع الواحد ساعات كتيييييييييييييير بيزعل انه رجع بلده"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071718/http://masr.20at.com:80/article.php?sid=216"

[[comments]]
order = 6
subject = "دي أحلي حاجة .... وفي نفس الوقت أصعب حاجة"
author = "محمد السيد"
posted = "2006-04-25"
text = "والله وقلبت المواجع يا دعاء ... هي ناقصة يعني ؟؟؟<br />انا بقالي خمس سنين دلوئتي ... لما خلاص جبت أخري ....<br />بقي اسكندرية بحالها مش عارفين يعملوا فيها كلية لحاسبات ومعلومات ومناطق تانية عاملين فيها ... مفهاش ربع سكان إسكندرية ...<br />دي تقليعة من تقليعات نظامنا المبارك ...<br />يالا ..كانت أحلي سنة أول سنة .... فيها شفت الدنيا بجد ...<br />تعرفوا رحت كل حتة ... ولوحدي من غير ما آخد أي حد معايا ....<br />اتفسحت في القاهرة كلها...<br />القلعة .. الأهرامات .. المتحف المصري .... تمشية وسط البلد ...<br />كانت أول مرة<br />رحت لوحدي نقابة الصحفيين ... المحامين ...<br />مظاهرات التحرير ...<br />مظاهرات شباب الإخوان في الجامعة ...<br />الأزهر بعد صلاة الجمعة مع حزب العمل ..<br />الحقيقة ... أحلي حاجة لما تجرب كل ده لوحدك ... وقي النهاية أكيد ..<br />الغربة علمتني ......<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071718/http://masr.20at.com:80/article.php?sid=216"

[[comments]]
order = 7
subject = "اتعلمت قسوة القلب"
author = "heba"
posted = "2006-05-08"
text = "أولا انا احب اشكرك يا دعاء على موضوعك ده لأنه على قد ماكلمة غربة بتعني الألم على قد ما الواحد لما بيلاقي ان فيه ناس زيه في غربه بيهون عليه ....<br />انا عن نفسي الغربه علمتني ازاي اعتمد على نفسي...<br />وإزاي اتعامل مع ناس مختلفه واتعرف على شخصيات جديده ..<br />ده غير الفايده من الحاجه الي انا متغربه علشانها ...<br />لكن مع كل ده لقيت نفسي بتعلم حاجه تانيه ...ان الواحد لما يحب يتغرب لازم ينسى ان ليه حاجه اسمها قلب<br />يا كده يا مش هايعيش..."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071718/http://masr.20at.com:80/article.php?sid=216"

