[[comments]]
order = 9
subject = "الغربه والاغتراب والفرق"
author = "مصطفى"
posted = "2006-06-05"
text = "الاستاذه دعاء السلام عليكم ورحمة الله<br />اسعدنى حقا موضوعك ولكن كان حقا عليكى ان يشمل الغربه بمفهوما الاوسع لانك ياسيدتى تتحدثيين عن شخصاتغرب وهو داخل الوطن بمعنى انه فى اى وقت يستطع يرى اهله او اولاده او زوجته فلا تغفلى معناهاولا تغفلى ايضا معناها عندما يكون الشخص مجبر على ترك وطنه واهله اى مغرب بسبب الحكومه المبروكه وما فعلته بشباب هذا الوطن الغالى ... وتقبى تحياتى<br />مصطفى محمد<br />عضو المنظمة العالمية لمواجهة التطرف<br />لندن"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071718/http://masr.20at.com:80/article.php?sid=216"

