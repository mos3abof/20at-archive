subject = "رسالة من تحت الماء"
author = "واحد تاني"
posted = "2006-04-24"
text = "الأستاذة دعاء عنوان الموضوع جيد ومثير للافكار بس ايه رأيك لو نفتح الموضوع اكتر من كونه لغربة البنات داخل مدينتهم الى افاق الغربة الاوسع وماذا علمتنا؟<br />فلكل منا غربته (حتى وان كانت داخل وطنك او داخلك) والتى يمكن ان يروى عنها الكثير...<br />هذا اقتراح, ان من حق الضيف ان يبدى اقتراح وان لم يكن فلكم مني اعتذار."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071718/http://masr.20at.com:80/article.php?sid=216"

