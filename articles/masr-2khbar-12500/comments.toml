subject = ""
author = "الاخوان المسيحيون 1"
posted = "2009-06-29"
text = "عدلى ابادير يوسف -،رئيس منظمة الاقباط متحدون<br />مجدى خليل- عضو لجنة إدارة مؤتمر واشنطن<br />سليم نجيب - رئيس الهيئة القبطية الكندية<br />منير بشاى - رئيس جمعية اقباط كاليفورنيا<br />عادل جندى -كاتب وناشط قبطى ، باريس<br />وليم الميرى- صحفى وناشط قبطى<br />ميلاد اسكندر رئيس الهيئة القبطية الامريكية<br />رائف مرقص -رئيس الاتحاد القبطى الدولى<br />الفونس قلادة -الاتحاد القبطى الدولى<br />ايهاب زكى- الاتحاد القبطى الدولى<br />فؤاد سمعان -الهيئة القبطية الامريكية<br />عادل حنا -الهيئة القبطية الامريكية<br />سعد اسكندر- الهيئة القبطية الامريكية<br />عماد يوسف- ناشط قبطى ، كندا"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062952/http://www.20at.com:80/masr/2khbar/12500--4-.html"

[[comments]]
