subject = ""
author = "لدواعى الامن"
posted = "2009-06-29"
text = "نحن لسنا اخوان ولا نتبنى افكارهم ولكن ما يضايق هو اغلاق الشركات<br />من حق الامن القبض على اى انسان لدواعى الامن حتى ولو كان وزير - ذلك هو حق الامن وواجبة<br />ولكن ما يضايق هو اغلاق الشركات وتشريد العاملين بها<br />متى يكون تصرفنا حضاريا"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062952/http://www.20at.com:80/masr/2khbar/12500--4-.html"

[[comments]]
order = 3
subject = ""
author = "تحرير الاقتصاد"
posted = "2009-06-29"
text = "كيف تسمح الدولة بسيطرة اقلية قبطية 4 % من السكان على 60 % من اقتصاد مصر<br />60% من الاقتصاد المصرى لشعب تعدادة 80 مليون نسمة يملكة 4 % من التعداد اقباط<br />فهم يسيطرون على محلات الذهب والصيدليات والشركات والمصانع وتكفى زيارة الى مصانع العاشر من رمضان لترى كم مصنع يملكة قبطى<br />انة استعمار وسيطرة قبطية على اقتصاد البلد<br />تماما كسيطرة اليهود على اقتصاد المانيا قبل هتلر فلما جاء هتلر حرقهم جميعا"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062952/http://www.20at.com:80/masr/2khbar/12500--4-.html"

[[comments]]
order = 4
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-06-29"
text = "سياسة النظام يا سيدى المحترم كاتب العليق رقم(1)<br />هو توفيى الامن و الامان لهذا الشعب المسالم<br />و ايضا توفير لقمة العيش لمواطنيها الشرفاء<br />اما الجماعة المحظورة فماذا و فرت لهذا الشعب سوى التظاهر و الاعتقال؟<br />اما الاقباط فكان دورهم توفير فرص العمل و فتح بيوت العاملين لتوفير لقمة العيش الشريف<br />بالالاة عليك كفى اسفافا و تهجما على الدولة و النظام و الاقباط من رجال الاعمال و الكنيسة<br />و ارجو منكم محاولة فهم ما كتبت لكم حيث اعتقد انكم و للاسف الشديد انعدام تفكيركم الموتور؟<br />هداكم اللة دنيا و اخرة"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062952/http://www.20at.com:80/masr/2khbar/12500--4-.html"

[[comments]]
order = 5
subject = ""
author = "الى the خاري"
posted = "2009-06-29"
text = "امال الحرامية دول بيعملوا ايه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــ<br />نجيب جبرائيل رئيس منظمة \"الاتحاد المصري لحقوق الإنسان\"،<br />ونادر فوزي رئيس منظمة \"مسيحيي الشرق الأوسط\"،<br />وحلمي جرجس رئيس منظمة أقباط المملكة المتحدة<br />وبهاء رمزي رئيس الهيئة القبطية الهولندية<br />ونبيل عبد الملك، رئيس المنظمة المصرية الكندية لحقوق الإنسان،<br />ووديع فهمي منظمة أقباط النمسا<br />وخيري مالك رئيس جمعية الصداقة القبطية الأمريكية.<br />بيتر ميخائيل \"هيئة الشاب القبطي الأسترالي\"،<br />وكمال عبد النور رئيس \"منظمة اندماج وصداقة أقباط النمسا\"،<br />ونسيم كامل شحاتة \"هيئة الشاب القبطي الفرنسي\"،<br />وصبحي جرجس \"رئيس جمعية الصداقة القبطية بفرنسا\"،<br />ورمسيس شحاتة رئيس \"منظمة اندماج وصداقة أقباط ألمانيا\".<br />الكلب عدلي أبادير منظمة \"الأقباط متحدون\"<br />كميل حليم \"التجمع القبطي الأمريكي\"<br />سليم نجيب \"الهيئة القبطية الكندية\""
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062952/http://www.20at.com:80/masr/2khbar/12500--4-.html"

[[comments]]
order = 6
subject = ""
author = "ممدوح زكى زخارى جرجس"
posted = "2009-06-29"
text = "ممكن تشرح لى بالتفصيل الممل<br />ما هى علاقة الكنيسة او غبور او ساويرس بتلك الجماعة المحظورة؟<br />عفوا اقصد تلك الجماعة الموبؤئة<br />عمر الاقباط ما فكروا فى هدم وطنهم<br />الا تصدقنى القول<br />قل لى منذ متى تم القاء القبض على اقباط بتهمة تهديد الامن القومى او محاولات اغتيال لرموز الدولة او القيام بعمليات ارهابية ضد هذا الشعب المسالم الامن"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062952/http://www.20at.com:80/masr/2khbar/12500--4-.html"

[[comments]]
order = 7
subject = ""
author = "لماذا اغلاق الشركات"
posted = "2009-06-29"
text = "لماذا اغلاق الشركات وفيها بشر بيشتغلوا ولهم زوجات واولاد - لماذا قطع ارزاق الناس -<br />ولماذا لم تغلق شركات غبور وسواريس وغيرهم الذين يدفعون الملايين للكنيسة ويدعمون اقباط المهجر ويدعمون التمرد للاقباط فى قرى الصعيد<br />انا مش فاهم سياسة النظام دة"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062952/http://www.20at.com:80/masr/2khbar/12500--4-.html"
