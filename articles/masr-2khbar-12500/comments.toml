subject = ""
author = "الاخوان المسيحيون 2"
posted = "2009-06-29"
text = "حلمى جرجس- رئيس الهيئة القبطية البريطانية<br />ابراهيم حبيب- الهيئة القبطية البريطانية<br />ناجى عوض- رئيس الهيئة القبطية الاوروبية، باريس<br />ملاك غبريال- رئيس الهيئة القبطية بكاليفورنيا<br />ماهر رزق الله- رئيس الهيئة القبطية بتورنتو<br />نبيه عبد الملك- اوتاوا كوبتس<br />شريف منصور- ناشط قبطى ، مشارك فى تنظيم مؤتمر واشنطن<br />صموئيل فاهد- رئيس الهيئة القبطية الاسترالية<br />جميل حلمى-الهيئة القبطية الاسترالية<br />فكرى ماكس- صحيفة المصرى، استراليا<br />منير داوود- ناشط قبطى ، نيوجيرسى<br />اقلاديوس ابراهيم- صحفى ، لندن<br />أرنست أوريجانيوس- رئيس الهيئة القبطية بتكساس<br />جورج فرج الله- الهيئة القبطية بكاليفورنيا<br />-نبيل الشماع-ناشط قبطى<br />-احمد اباظة- ناشط قبطى<br />فايز عبد الملك-محرر صوت النيل<br />صبرى جوهرة- استاذ بكلية طب اوهايو، ناشط قبطى"
archived = "2009-06-30"
capture_url = "https://web.archive.org/web/20090630062952/http://www.20at.com:80/masr/2khbar/12500--4-.html"

[[comments]]
