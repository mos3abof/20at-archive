[[comments]]
order = 3
subject = ""
author = "ولاء أحمد"
posted = "2009-12-27"
text = "شكرا للمعلومات<br />احب اضيف ان من اكتر الحاجات الغنيه بالحديد هو العسل الاسود و كمان الجسم بيستفيد بنسبة كبيرة جدا منه<br />و يفضل العسل يكون معاه طحينة لانها غنية بالكالسيوم<br />اما للاسف المصادر النباتيه للحديد لا يستفيد منها الجسم بشكل تام<br />لان الخضروات بها نسبة من الاوكسالات التى تتحد مع الحديد و تمنع امتصاصه"
archived = "2009-12-29"
capture_url = "https://web.archive.org/web/20091229123710/http://www.20at.com:80/banat/health-and-beauty/health/14591-2009-12-27-07-05-16.html"

