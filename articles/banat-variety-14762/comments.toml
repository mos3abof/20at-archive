[[comments]]
order = 13
subject = ""
author = "ranran"
posted = "2010-02-05"
text = "فعلا.. المفروض ان الحرم الجامعي له احترامه .. ماينفعش بجد اللي الواحد بيشوفه دة سواء من لبس البنات أو الولاد .. اللي تلاقيه مطوّل شعرة .. او لابس قميص وفاتحه .. او رايح ببنتكور .. ا،ا بدخل بحس اني داخلة نادي مش حرم جامعي ليه مكانته واحترامه ..<br />هو مش حرب عالاسلام ولا حاجة .. هما مامنعوش النقاب طول السنة هما منعوه بس فترة المتحانات و السبب زي ماكتبتلكوا قبل كدة ..<br />واذا كانوا بيخلوا المنقبات وهما داخلين يرفعوا النقاب امام سيدات فدة لأن احنا عارفين للأسف في ناس استعملوا النقاب استعمال اجرامي أساؤا بيه فعلا للنقاب<br />أنا أعرف منقبات محترمات كتير قوي بيشتكوا نفسهم من اللي بيحصل لكن للأسف السيئة تعم"
archived = "2010-02-13"
capture_url = "https://web.archive.org/web/20100213194916/http://www.20at.com:80/banat/variety/14762.html"

