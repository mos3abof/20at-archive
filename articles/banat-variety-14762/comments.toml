[[comments]]
order = 10
subject = ""
author = "ranran"
posted = "2010-01-25"
text = "يا جماعة اسمحولي بس اوضح نقطة انتو مش فاهمينها<br />قرار الجامعة بمنع ارتداء النقاب فترة الامتحانات مش لأنهم بيعارضوا فكرة النقاب في حد ذاته لأ (و الا كانوا منعوه طول السنة)الموضوع كله لأن للأسف في بنات بيستخدموا النقاب كوسيلة للغش من تحته سواء بالكلام في الموبايل أو سماعات البلو توث لدرجة كمان ان ساعات مش البنت نفسها هي اللي بتيجي تمتحن!<br />أنا معيدة في جامعة عين شمس وقابلنا الحالات دي كتير جدا والله<br />يا جماعة انا مع فكرة ان كل واحد حر يلبس اللي هو عايزه .. اللي عايزة تتنقب تتنقب واللي مش عايزة هي حرة دي حرية شخصية ومش من حق أي حد انه يفرض رأيه عالأخرين ومش معنى ان في واحدة منقبة يبقى هي في منزلة أعلى عند ربنا من مثيلاتها الغير منقبات والعكس صحيح<br />كل واحد شايف الصح من وجهة نظره بس لما نكون بنتكلم في استعمال النقاب كوسيلة للغش مثلا يبقى ساعتها لازم يتاخد قرار اللي للأسف بياخد العاطل مع الباطل<br />للأسف السيئة تعم وبعض المنقبات أساؤا بتصرفاتهم دي بجد للباقيات المحترمات<br />ياريت يا جماعة نفهم الموضوع بشكله الصحيح .. الموضوع كله ليه علاقة بتحقيق الأمن و المساواة داخل الحرم الجامعي"
archived = "2010-02-13"
capture_url = "https://web.archive.org/web/20100213194916/http://www.20at.com:80/banat/variety/14762.html"

