[[comments]]
order = 8
subject = ""
author = "shaimaa.manhag"
posted = "2010-01-07"
text = "حسبى الله ونعم الوكيل فى شيخ الازهر اللى اشعل نار الفتنة<br />وجت الفتنة من راس مقر الدين الاساسى فى مصر ولما تيجى البلوة تيجى من المفروض اسمة صاحب دين<br />ربنا يثبتهم \"إنا لمنتصــــــــــ ـــــــــــــــ ـــــــــــــــ ـــرون\"<br />والله متم نورة ولو كرة الكافــــــــــ ـــــ ـــــــــــرون\"<br />مطلعوش قرار لية بمنع التبرج والعرى ومفيش بنت تدخل الجامعة ببنطلون ضيق وبدى محزق ومينفعش تمتحن بالمنظر المشين دة<br />بلد ولا ليها ولا ظابط ولا رابط<br />منهم لله<br />نحن معهن بدعائنا<br />ربنا معاهم ويحميهم وينصرهم على القوم الظالمين"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112161922/http://www.20at.com:80/banat/variety/14762.html"

