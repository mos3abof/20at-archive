subject = "مبروك التخرج ميادة"
author = "الحيوان"
posted = "2006-10-12"
text = "3سنوات صابر ومستنى ردك<br />ليه<br />ليه<br />هم اولاد الناس لعبة فى ايد البنات الحلوة المؤدبة<br />بحبك يا بنت الناس الطيبة<br />انتى شغالة فى اي جريدة بعد ما اتخرجتى؟ ربنا يوفقك<br />انهندس أوفى محمد"
archived = "2006-11-17"
