order = 0
subject = "توضيح صغنتت"
author = "على فكرة ، يوم 22 مش يوم عادي .."
posted = "2006-03-24"
text = "بالإضافة للحفلة دي ،<br />هو ذكرى استشهاد الشيخ أحمد ياسين ،<br />و ذكرى احتلال العراق!"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210314/http://masr.20at.com:80/article.php?sid=70&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 1
subject = "حتى القهاوي مليانه"
author = "كرميلينو"
posted = "2006-03-25"
text = "يا ترى بعد ما لغوا التعييين هيودوا الهلمه دي كلها منين<br />يا مين يديني وسطه<br />حتى القهاوي مش هتقدر تستوعب الاعداد الهائلة من هؤلاء القوم<br />ااقولكوا نصيحة<br />لازم موع عشرينات يعين 50 خريج كل سنه<br />عشان نظبط الموع شويه<br />مش كده و لا ايه ؟؟؟؟؟؟"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210314/http://masr.20at.com:80/article.php?sid=70&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 2
subject = "يااااارب"
author = "أم عمارة"
posted = "2006-06-10"
text = "\"بسم الله الرحمن الرحيم \"<br />ألف مبرووووك للخريجين ..واتنى انهم يفيدوا دينهم ومجتمعهم وامتهم كلها بالاقسام اللي درسوها ..لان الاعلام اصبح من اهم واخطر الوسائل اللي نقدر من خلالها نطرح افكارنا ونوضح صحيح دينا ..وهو برده -الاعلام -سلاح خطير جدا بيستخدموا اعدائنا لتشويه افكارنا وابعادنا عن دينا ومعتقداتنا"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905072011/http://masr.20at.com:80/article.php?sid=70&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

