subject = "ميادة خضري"
author = "مهندس أوفى"
posted = "2006-10-12"
text = "أرجوكى تسمحينى أنا مش عارف اعيش من غيرك انا اشتغلت وجبت الشقة وهسافر اخر السنة الى الخليج انا اسف جدا وارجو ان يكون قلبك كبير وتسمحينى<br />لا اله الا الله محمد رسول الله"
