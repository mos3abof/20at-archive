subject = "وأغنى لمصر اللى بتتولد من جديد ف ساعه ضلمه ما يعلم بيها الا ربنا"
author = "نيفين نيفى نوفا"
posted = "2006-06-13"
text = "لو تعرفوها نهى صاحبتى الى سافرت و بقالى كتير بدور عليها و مش عارفه اوصللها<br />لو تعرفوهم كل اصحابى المتوزعين على بلاد الخليج و اللى بغنياهم الطير المهاجر و اعيط<br />لو تعرفوهم و لاد البلد امثال الشرقاوى و الشاعر<br />لو تعرفوه الاتيكيت او الذوق ف التعامل اللى ضاع من الناس او هما اللى ضيعوه ف زحمه الحياه<br />لو تعرفوه الحب العمله النادره اللى خيفه تكون ذهبت مع الريح<br />الموضوع تحفه يا براء"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233304/http://masr.20at.com:80/article.php?sid=497"

