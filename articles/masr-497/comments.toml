subject = "اليسا عندي حق ..."
author = "هوووووووبه"
posted = "2006-06-15"
text = "مش حقول ناس كتير عشان انتو ماتعرفهومش ولو عرفتوهم مش حتقدرو تقولهم الي عايزه اقوله<br />بس اللي اعرفه في الموقع<br />لو تعرفوا البت نوفا قولولها بطلي رومانسيه يا مصيبه انتي ومتتفرجيش علي مسلسل الوسيه كتير عشان بعيط . واقري دهب مع الريح الاول وبعدين بعديها بسرعه الفيلم الاتنين مع بعض يعملو قفله رهيبه .<br />لو تعرفوا براء او دودو قولهم شدو حليكو عايزين نفرح بيكو .<br />لو تعرفو الكابتن ميت قلوله خلاص وضحت الفكره وبهديك اغنيه i'm alive \"غيظه يعني \"<br />لو تعرفو امي سلمولي عليها هي وكل الحبايب وسرسوره .<br />لو تعرفوني ادعولي مامتش بعيد عن اهلي ."
