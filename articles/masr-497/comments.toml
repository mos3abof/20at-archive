[[comments]]
order = 25
subject = "سيدي شلبيات"
author = "وحيد شلبيات"
posted = "2006-11-10"
text = "سيدي الرئيس<br />في عيد ميلادك الكام وسبعين<br />كل سنة وأنت طيب<br />واحنا مش طيبين<br />كل سنة وأنت حاكم<br />واحنا محكومين<br />واحنا مظلومين<br />واحنا متهانين<br />ويا ترى يا حبيب الملايين<br />فاكرنا ولا احنا خلاص منسيين<br />فاكر المعتقلين<br />فاكر الجعانين<br />فاكر المشردين<br />فاكر اللي ماتو محروقين<br />فاكر الغرقانين<br />الله يكون في عونك - هاتفتكر مين وللا مين<br />في عيد ميلادك الكام وسبعين<br />بقول لك كلمتين<br />الأوله<br />شيلتنا طين<br />وهل تعلم أن النيل بقى رشاح<br />والجو أصبح بيئة والعيشة ولعة<br />والشرفا قلوبهم عالبلد والعة<br />وانت عاملهم مذبحة ولا بتاعة القلعة<br />والاقتصاد سداح<br />والسرقة بقت كفاح<br />ومصر متاحة بس للسياح<br />وعرض البلد بقى مستباح<br />والتانية<br />ورتنا الويل<br />دا الخطوة في عهدك بقت ميل<br />والضحك بقى نواح وعويل<br />والكوسة<br />عارف الكوسة<br />ممكن أقولك فيها موواويل<br />والجامعة بقت يا إما كباريه أو دار مسنين<br />والشباب معظمهم من غير خمرة سكرانين<br />والعلم عز على المتعلمين<br />والأساتذة بقم دجالين<br />والقادة بقم طبالين<br />واديني في الهايف يا حبيب الملايين<br />والتالتة<br />عارف اليابانيين<br />زمان في سنة اتنين وخمسين<br />كان عندنا تروماي وكان عندنا علم ومتعلمين<br />وثقافة ومثقفين<br />وأدبا وعلما وفنانين<br />وكانو اليابانيين<br />بالنووي لسة مضروبين<br />وللصدقة مستحقين<br />دلوقتي إحنا فين وهما فين<br />هما فوق واحنا في أسفل سافلين<br />والرابعة<br />أمن البلد بقى تنين<br />والمحاكم اتملت مظالم<br />والعدالة بقت كمالة<br />وكلمة الحق في الزبالة<br />وأصحابها في الزنازين<br />والخامسة<br />القطاع العام…. عام<br />والفساد…. ساد<br />وفي جتة بلدنا بيرعى<br />أفتكر لجنابك إيه وللا إيه<br />وكل ذكرى ليك بدمعة<br />أنا كنت حالف ميت يمين<br />أكملهم لك تمنية وسبعين<br />بس هاكفيهم ورق منين<br />وكل سنة وأنت<br />واحنا طيبين"
archived = "2006-11-17"
capture_url = "https://web.archive.org/web/20061117210538/http://masr.20at.com:80/article.php?sid=497&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

