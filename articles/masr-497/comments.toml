subject = "حلوة"
author = "محمد"
posted = "2006-06-11"
text = "حلوة اوى يا براء ، حقيقى فى حاجات كتيرة بتوحشنا وناس كتير بيوحشونا ، بيفرقنا الزمن عن حبايبنا ، لكن اكتر من وحشنى هى مصر ، مصر اللى كان ليها قامة اطول من اى بلد فى العالم ، مصر اللى كان ليها كرامة وكبرياء ، وحشتينا يا بلدى ، ربنا ينصركم يا احلى شباب ونقدر نرجع مصر زى ما كانت"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233304/http://masr.20at.com:80/article.php?sid=497"

