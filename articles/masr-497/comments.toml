subject = "عبد المنعم محمود"
author = "محمد"
posted = "2006-06-11"
text = "السلام عليكم<br />الموضوع ممتاز يا براء ما شاء الله أهنيك عليه<br />محتاجين فعلا كل واحد فينا يقعد مع نفسه ويقولها لو تعرفوا بس مش بتاعت إليسا<br />بخصوص عبد المنعم فأنا أعرفه شخصيا بالرغم من كلامتك الجميلة عنه يابراء إلا إن عبد المنعم شخص أكبر من كدة بكتير رغم بساطته ربنا يفك أسر جميع المعتقلين"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233304/http://masr.20at.com:80/article.php?sid=497"

[[comments]]
order = 5
subject = "احساسك عالى جدا"
author = "أحمد هندي"
posted = "2006-06-11"
text = "يا براء انت احساسك عالي اوى اوى فى الكلام - مع انى مبسمعش أغاني - لكن لا يختلف اتنين على انك انسان رقيق واحساسك عالي جدا جدا وشاب محترم جدا ومصري جدا واتمني انك متفهمش التعليق كانه أى شكر وخلاص بس انا معجب بيك جدا ونفسي اكون زيك كاتب عندي احساس عالي وقوة فى المنطق وسخرية فى الاسلوب ومرح ودعابة وزي الاستاذ بلال فضل كمان-لازم ندي كل واحد حقه برضة بالالقاب يعني لحد ما يجون بيننا تعامل - وعموما ادعي لى ربنا يوفقني"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233304/http://masr.20at.com:80/article.php?sid=497"

[[comments]]
order = 6
subject = "لو تعرفوه.... تعرفوه؟؟ نفسي أعرفه"
author = "محمد السيد"
posted = "2006-06-11"
text = "أنا حأعلق عن عبد المنعم...لأنت ده اللي سمعت عنه ....<br />الحقية اللي سمعته عنه يكفيني إني أفخر بيه وأتمني إني أتعرف عليه بجد<br />وبعدين أهه مثال للإخوان المسلمين الفاهمين ....<br />ربنا يرجعه بالسلامة ..وأطمنك عليه ..هو جوه مرتاح علي الإخر ..كان معايا ناس كانوا معاه والحقيقة مرتاحين والحمد لله<br />لا للتمديد ... لا للتوريث ... نعم لتعديل الدستور المصري<br />mohamedmat@hotmail.com"
archived = "2006-06-14"
capture_url = "https://web.archive.org/web/20060614233304/http://masr.20at.com:80/article.php?sid=497"

