subject = "بله أين العرب ياصاح؟!!!"
author = "عمرو بن ود"
posted = "2006-07-20"
text = "السؤال الذي يجب أن يطرح\"أين أختفي.. .. العرب!!\" هل خسقت بهم الأرض أو تختطفتهم سكان المجرات الأخرى لإجراء التجارب عليهم وإثبات أن مايجري بعروقهم هو الثلج لا الدماء.<br />أين العرب؟ أين لسان العرب؟ أين بني أمية؟ أين العرب الأقحاح؟ لاأجد إلا رطانة خارج أرضية بكل تصريحاتهم لاهي عربية ولا عجمية، والجاهل فقط باللسان والأنساب من يغره زي يرتديه مدعو العروبة بجزيرة العرب وأكنافها..ورطانة فيها كلمات عربية مشوهة..ونسب زائف لبني فلان..يشهد الله وملاءكته الأبرار..أنهم من أبناء الجواري والإماء لا الحرائر.<br />ومع ذلك كان فيهم من أراد أن يك عربيا محضا أبيا كديدن العربي، هؤلاء النفر شاركوا بما إستطاعوا بمساندة مصر بحرب إكتوبر، وسطرت ميادين القتال بطولات رائعة لهؤلاء عند عبور القنال..قاتل العراقي والمغربي والفلسطيني والجزائري والليبي مع أخيه المصري، وبأول الطلاعات الجوية كان السرب العراقي أشد الأسراب ضراوة وفتكا. ليس من خائن غير الكافر السادات الذي فرق شمل العرب وتآمر على جنده وعلى النصر ليمضى في درب العمالة والخنوع. إنظروا يابني العروبة كيف تعاقب الواحدة تلو الأخرى دول عربية ساندت مصر في القتال!. وللآن نجحوا لحد كبير في أن ينزعوا من أيدينا السلاح ويعطونا بدلا عن آلات العزف والمجون."
