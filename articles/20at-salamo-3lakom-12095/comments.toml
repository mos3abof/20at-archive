author = "شاب ازهري"
posted = "2009-08-20"
text = "لم تكن اجابة الامام غير مقنعه ولكنها كانت صائبة وليس كل ما اشتهينا ان نسمعه يجب ان نسمعه من علماء الدين فقد ورد عن الرسول في الصحيحين ان الرسول صلي الله علية وسلم وجد حبلا مربوطا بين ساريتي المسجد فسال لمن هذا قالوا لزينب اذا فترت قال حلوة ليصلين احدكم نشاطة فاذا فتر فليرقد فهذا علي مستوي النوافل اما علي مستوي الفروض فخير صلاة وخير ثواب من يؤدي الفرائض وهو يصارع الشيطان في الكسل والاخفاق في عمل العبادة ولنا في صحابة رسول الله اسوة حسنة حينما قطعت قدمة وكان يزحف ليصل الي المسجد فهل سينتظر الشباب حتي يذهبوا زحفا الي المسجد ام انهم سيقومون لله مثني وفرادي"
archived = "2009-08-22"
