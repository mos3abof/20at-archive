text = "انا الحمد لله بصلى واقفه …بس بصراحه مش بصلى سنن دايما الاالقليل جدا لعذر الارهاق<br />وعاجبنى ايجابيه حضرتك وحسن التصرف وعدم نقد الناس صراحه فى وجوههم واكتفين بنقاش الامر امامهم فقط …وده احنا مفتقدينه جدا لان كل واحد شايف نفسه له الحق فى نقد الناس وتوجيههم ولو بشكل غير مقبول وده بيحصل قدامنا كتير"
archived = "2009-05-21"
