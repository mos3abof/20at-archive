text = "من غير شعارات برتقالي مصر فعلا حبيبتي<br />كنت احب برضه ابقى مصرية اصل دي البلد اللي اتربيت فيها واللي فيها كل الناس اللي بحبهم وفيها اصحابي وشارع مدرسي والجامعه بتاعتي اللي حسيت اول يوم وانا دخلاها اني حد مهم اوي<br />مصر حبيبتي اللي فيها النيل والناس الطيبيين كان ممكن اكون ايه غير مصرية وليه اي بلد تاني هيعمل ايه اجمل من احتواء مصر وطيبتها وحتى ضعفها وكسرتها ايه!"
