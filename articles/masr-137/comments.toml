subject = "لو لم اكن يعني سوف اكون حاجه غير اللي موجوده بس هي فاهم كدا"
author = "هبابه او هوبه او هبهوب"
posted = "2006-04-09"
text = "مصريه .. مصريه ... مصريه ...مصريه ...مصريه<br />نوبيييه ...نوبيييه<br />شرقيه ...شرقيه<br />يا بششششششششششر دي مصر<br />مش عايزه اتكلم لحسن اعيط<br />بس لو افترضنا اني اتولدت بجنسيه تانيه نقول فرنساوي ليه عشان البلغم اللي في لسانهم علي طول دا يع .<br />اتفق مع سوسه المفروسه هي كورياوانا ايران يلا ان شاء الله ما عند حد حوش .<br />اممممم . دول الشرق اسيويه اللي تحت دي رائع كثقافه وبشر .<br />واحب اكون اسبانيه علي مغربيه مكس يعني<br />فيها اصاله برده حته اندلسي كدا<br />اكون صينيه فيها عادات رهيبه تختلف من حته لحته واهو اتعلم ماردرين واقرفكو بس بجد الصين بلد بلد يعني .<br />وسلام يا مصري واردني ويا شامي\"دول عربيه اصلها \" وسلام يا بششششششششششر"
archived = "2006-04-15"
