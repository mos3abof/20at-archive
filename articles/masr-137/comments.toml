[[comments]]
order = 2
subject = "للاسف هأقولكم نفسى أكون إيه"
author = "عابر القارات"
posted = "2006-04-07"
text = "للاسف هأقولكم لو لم أكن مصريا لوددت أن أكون إسرائيليا .... نعم فبالرغم من الرائحه الكريهه التى تنبعث بمجرد أن تذكر سيرة هذه الدولة البغيضة الا أنكم لو دخلتم الى داخل هذه البلد لوجدتم فعلا بلد متقدمه جدا كواحة فى وسط صحراء من التخلف ... و التخلف هنا و التقدم هما تخلف و تقدم فى جميع النواحى سواء السياسية أو الاقتصادية و التعليمية و يكفى أن تعرف ان متوسط دخل الاسرائيلى هو 400 ضعف المصرى و و ربما 40 ضعف الخليجى ... و ارجو أن يجيبنى أحد كيف أن دوله تاريخها 60 سنة تفوقت على أمه أكبر دولة فيها تاريخها 7000 سنة !! و أرجو أن لا أسمع أسباب من قبيل إن هذه الدولة لقيطه و مسنوده من الكبار و غير هذه الخرافات التى أقنعنا بها حكامنا ليبرروا عجزهم و تخلفهم و كأنهم حفاة عراة لا يملكون أقوى مقومات الحضارة و التقدم من كل نوع ... و أرجو الا أتهم بالعمالة و الخيانة فما أقوله هو المرارة بعينها"
archived = "2006-04-15"
capture_url = "https://web.archive.org/web/20060415170837/http://masr.20at.com:80/article.php?sid=137"

[[comments]]
order = 3
subject = "المصري حايفضل مصري ....."
author = "aroundu_4) Towards Light ("
posted = "2006-04-08"
text = "المصري حايفضل مصري ...كلام بنسمعه والبعض بيحس بيه<br />لكن الحب والكره لبلدنا يرتبط بسياسة الحكومة المتخلفة<br />التي أرادت لنا التأخر والتخلف في كل الميادين<br />حينما أعمل لبلدي أحس بها كثيرا<br />وعندما أواجه الصعاب ألعن كل ....فاجر<br />حب الوطن<br />ما عندنا خبز ولا وقود.<br />ما عندنا ماء.. ولا سدود<br />ما عندنا لحم.. ولا جلود<br />ما عندنا نقود<br />كيف تعيشون إذن؟!<br />نعيش في حب الوطن!<br />الوطن الماضي الذي يحتله اليهود<br />والوطن الباقي الذي<br />يحتله اليهود!<br />أين تعيشون إذن؟<br />نعيش خارج الزمن!<br />الزمن الماضي الذي راح<br />ولن يعود<br />والزمن الآتي الذي<br />ليس له وجود!<br />فيم بقاؤكم إذن؟<br />بقاؤنا من أجل أن نعطي التصدي حقنة،<br />وننعش الصمود لكي يظلا شوكة<br />في مقلة الحسود<br />أحمد مطر<br />راسلنا علي :<br />http://groups.yahoo.com/group/aroundu_4"
archived = "2006-04-15"
capture_url = "https://web.archive.org/web/20060415170837/http://masr.20at.com:80/article.php?sid=137"

