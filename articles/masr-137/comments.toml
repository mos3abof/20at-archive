[[comments]]
order = 14
subject = "مصرى دائما"
author = "هيثم سيد محمود محمد"
posted = "2006-04-15"
text = "لو لم اكن مصريا لوددت ان اكون مصريافانا دائما انظر الى نصف الكوب الممتلئ بالماء لا الفارغ نعم كل مصرى ينقصه اكثر من الكثير ولكن الصعوبات تولد الكثير من الرجال و لا اود ان اكون شخص اخر فشهداء حرب اكتوبر لم يستفيدوا شئ من ذلك الا انهم احياء عند ربهم يرزقون و كل املى ان تكون هناك ثقة بين الشعب والحكومة اعرف ان للحكومة مسؤليات كثيرة لكن لنا ابسط الحقوق و هى ان نحيا مثل اى شعب وان نجدفرص عمل على الاقل وان تنتهى الواسطة من مصر و اقول بلادى بلادى لك حبى و فؤادى ومن اجلك اتمنى استشهادى انا اتمنى التوفيق لمصر دائماو ارجو من كل ابناء مصر ان يقولوا لو لم اكن مصريا لوددت ان اكون مصريا انا مطلع على معظم الاحداث الجارية فى معظم دول العالم لكن حبى لمصر مثل فرض دينى و اعتبر ذلك اضافة الى ركن من اركان الاسلاممصر لن تستمر الا بشبابها ونحن الان على شفا حفرة من نار حارقة تحيط بنا من كل اتجاه ارجو من الحكومة اعطاء فرص جادة للشباب ان كان الشاب كفائة لذلك استفادة منه بلاده وان لم يكن فقد عرف انه وضع نفسه تحت امر بالده ولكن مصر بها سبعون مليون شخص موهوب تنقصهم سبعين مليون فرصة لكل منهم"
archived = "2006-04-15"
capture_url = "https://web.archive.org/web/20060415170837/http://masr.20at.com:80/article.php?sid=137"

