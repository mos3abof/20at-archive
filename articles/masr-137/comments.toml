posted = "2006-04-07"
text = "لو لم اكن مصريا لوددت ان اكون مصريا فى ومن اخر وارض اخرى يمكن لو كان فيه فعلا<br />ابعاد كونية لمصر فى حته تنيه بس بحاله تنيه كونت وددت ان اكون مصريا لكن دلوقتى<br />اكون يابانى افضل على الاقل ليه سعر ومحدش<br />يقدر يدوس عليه"
