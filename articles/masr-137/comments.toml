[[comments]]
order = 18
subject = "مصرى محب لمصر"
author = "مصرى"
posted = "2006-05-06"
text = "لو لم أكن مصرياً لوددت أن أكون مصرياً ولكن لا يحكمنى حسنى مبارك ولا طاقم الفساد إللى حوليه ولكن يحكمنى زعيم مثل احمد نجاد حتى أشعر أن بلدى لها كرامة ولا يحكمها عميل لأمريكا وإسرائيل وأتمنى أن أرى شعبى له كرامة وكبرياء شعب أمريكا وأتمنى أن أرى شباب بلدى كلهم يعملون وعندهم طموح أن بكرة ها يكون أحسن وأتمنى الأ أرى مريض لا يستطيع دفع نفقات العلاج وأن يكون خير بلدى لشعبها وليس للنهب والسلب وأن تكون الإنتخابات ديمقراطية كما كانت إنتخابات إيران وليست بالتزوير وضرب الناخبين وأحلام كثير قوى بس المهم إن ربنا يحققها يارب"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524212029/http://masr.20at.com:80/article.php?sid=137&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 19
subject = "لو لم اكن مصريا لوددت ان اكون حزب وطنى"
author = "هيثم سيد محمود محمد"
posted = "2006-06-01"
text = "لقد كتبت فى هذا التعليق مرة من قبل لكن هذه المرة وجدت ان الظروف اختلفت فانا اخترت ان اكون (حزب وطنى) و اختيارى لهذا الحزب يرجع الى عدة اشياء<br />1-النجاح فى اى انتخابات بالبلطجة<br />2-السرقة من البلد اللى ورثها الحزب<br />3-اعطاء اوامر بسحل المواطنين<br />4-اعطاء اوامر بضرب الشعب بالجزمة<br />5-اعطاء الفرصة للشعب بزيارة المعتقل<br />6-تجريد النساء من ملابسهن<br />7-منح فرص عمل للشباب من الجنسين و طبعا الشباب دول من ابناء اكبر لصوص اقصد اكبر رجال الدولة<br />مش عارف اكتب لرقم ايه لكن الحزب الوطنى حاليا يدرس مع الحكومة احتياجات المواطن<br />ههههههههه لسه فاكر ان المواطن له احتياجات بعد اكتر من 25 عام .<br />اسمحوا لى ان ابعث برسالة الى اكبر رجال الدوله وخاصة الحزب الوطنى لقد اخذتم قوت الشعب و ام نتكلم و لن نطالب بما اخذتوه ولن ارحالوا بكل ما جمعتم و اتركوا مصر تعيش لست اخاف من المعتقل لسبب بسيط ان قد يجعلنى لا اشعر بمرارة البحث عن فرصة عمل على الاقل<br />يا عالم يا مصريين نسبة الفقر فى مصر من بيان اقره احد اعضاء مجلس الشعب وصلت الى 60 مليون شخص فى الفقر و الباقى فى قمة الرفاهية لكل بلد هرم يتكون من فقراء فى الاسفل وطبقة متوسطة فى الوسط و طبقة كبار الرجال و هى الطبقة العليا ولكن باختفاء الطبقة المتوسطة سوف تنهار الدوله من فضلكم يا افضل رجال فى الدولة يا محترمين ارجوكم ارحلوا ودعوا الشعب يكمل باقى الهرم من جديد حلال عليكم ما حصلتم عليه ولن يفيدكم شئ قتل البلد اقتلوا الشعب و اتركوا البلد او لو عجبتكم البلد خليكم بس امنحوا للمواطن فرصة فى ابسط حقوقه مع خالص احترامى واحترامى لكم من احترامكم للمواطن ولا اتذكر فى موقف مثل هذا الا ان اتذكر قول اكرم الخلق الرسول0صلى الله عليه وسلم)<br />(اهل مصر فى رباط الى يوم الدين)وقد ذكرت مص<br />اقرأ بقية التعليق .."
archived = "2006-09-15"
capture_url = "https://web.archive.org/web/20060915221559/http://masr.20at.com:80/article.php?sid=137&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

