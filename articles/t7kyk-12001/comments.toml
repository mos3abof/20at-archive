text = "راجعييييييييييي ن<br />نقرا و نعلق و نعيش مع عشرينات حياتنا<br />مع الاعتزار لعمرو دياب<br />و الله يا جماعه كان نفسى ارجع اعلق ف موضوع اسعد من كده<br />ايام و بنعيشها<br />لا و الاسوا ان بيقولو فيه كمان انفلونزا الخيول<br />و الله خايفه نلاقى انفلونزا القطط و الكلاب و الاسماك<br />ربنا بستر"
