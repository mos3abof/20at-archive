subject = "نقلا عن القدس برس .."
text = "فجرت عملية قتل الطفلة الفلسطينية إيمان الهمص (13 عاما) التي جرت صبيحة 5 أكتوبر/تشرين الأول 2004 بإفراغ ضابط إسرائيلي رصاصا في جسدها حتى بعد استشهادها، جدلا حول دور الأقليات التي بقيت في الأراضي المحتلة في 1948 بعدما تكشف أن الضابط القاتل ليس \"يهوديا\" وإنما \"درزي\" وهو ما لا يرى فيه الفلسطينيون أية مفاجأة.<br />وفتحت الهمص برحيلها الذي جرى على نحو مؤلم، ملفا له تداعياته الخاصة وانعكاساته الشائكة، خصوصا بعد التأكد من أن قائد السرية التي فتكت بها، درزياً، وهو الذي تولى بنفسه إفراغ أمشاط الرصاص في جسدها وفق الرواية الأكثر تداولاً. وبدأ التساؤل المطروح مصاغا على هذا النحو: ما الذي يدفع ضابطاً درزياً إلى الفتك بطفلة فلسطينية بهذه الطريقة، أو إلى الإشراف على قتل طفلة على الأقل بحكم موقعه القيادي للسرية؟<br />تصرف الضابط \"الدرزي\" لم يفاجئ الفلسطينيين<br />يرى المواطنون الفلسطينيون، سواء في قطاع غزة أم في الضفة الغربية أن ما أقدم عليه الضابط الدرزي ليس تصرفاً مفاجئاً بحد ذاته بالنسبة إليهم. ويمكن العثور على انطباع مشابه في التجمعات الفلسطينية وراء \"الخط الأخضر\"، أي في الأراضي المحتلة سنة 1948.<br />ولا تنطلق هذه التقديرات من فراغ، فقد كان الجنود والضباط الدروز في صدارة وحدات التنكيل والبطش بالفلسطينيين في الضفة الغربية وقطاع غزة. وكان لهم دور فاعل في البطش بهم إبان الانتفاضة الشعبية السابقة، خصوصا من خلال وجودهم الكثيف في قوات \"حرس الحدود\" (مشمار هكفول) التي تحظى بسمعة سيئة لدى الأوساط الفلسطينية.<br />وعادة ما كانت القبعة الحمراء التي يعتمرها جندي \"حرس الحدود\" إبان تلك الانتفاضة إيذاناً باعتداءات يصعب تقديرها \"فقد جاء الدروز\"، كما كان يحذر المواطنون الفلسطينيون بعضهم بعضاً آنذاك استعداداً للأسوأ. ومن هنا أصبحت للدرزي صورة راسخة في الوعي الجمعي الفلسطيني لا تعدو أن تكون \"جندي الاحتلال الأكثر قسوة\". وفي واقع الأمر لم تتغير هذه الصورة مع مرور الأيام إلا بتفاقمها كما يرى الفلسطينيون. فبعد الدور المشهود للجنود الدروز في حفلات التنكيل بالمواطنين الفلسطينيين اتخذ الأمر منحى أكثر دراماتيكية عبر حوادث وممارسات منسوبة إلى ضباط وجنود دروز، كان آخرها قضية الطفلة إيمان الهمص.<br />ويبدو أن قصة الدروز وولاؤهم لإسرائيل تعود إلى بدايات الاحتلال حين عمدت إسرائيل لاتباع سياسة \"فرق تسد\" نحو العرب، فالفلسطينيون في الأراضي المحتلة سنة 1948 جرى تقسيمهم بحسب الطائفة الدينية ونمط العيش، فكان الناتج في النظام الإسرائيلي مجرد \"أقليات\"، هي المسلمون والمسيحيون والدروز والبدو.<br />وتم استبعاد المسلمين والمسيحيين من الانخراط في الجيش الإسرائيلي بوصفهم يشكلون \"الوسط العربي\"، وهم الأغلبية العظمى من العرب وراء الخط الأخضر. وجرى العمل في المقابل على استيعاب الدروز و\"البدو\" في ذلك الجيش، على أمل تحويلهم إلى أداة طيعة ضد الشعب الفلسطيني.<br />في ما يتعلق بالمصنفين إسرائيلياً على أنهم \"بدو\" فقد تحقق الانخراط في جيش الاحتلال بالفعل، لكنه لم يكن بلا مشكلات. فعلى الرغم من أن الأمر سار لبعض الوقت بلا أزمات متبادلة يمكن الوقوف عندها؛ فإن تصاعد الدور التنكيلي لجيش الاحتلال، ابتداء من الانتفاضة السابقة، كان مصحوباً بمراجعات ذاتية لدى الضباط والجنود البدو، الذين انسحب عدد منهم من جيش الاحتلال معلنين \"توبتهم\".<br />مكاسب إسرائيلية من الدروز<br />وتحول الأمر إلى ظاهرة في أوساط \"البدو\" تزامنت مع نشاط الحركة الإسلامية في الأراضي المحتلة سنة 1948 في صفوفهم. ويبدو أن العنصر البدوي الفلسطيني آخذ بالتحول إلى \"مادة للاشتباه والشك\" بشكل متزايد، خاصة مع الاتهامات التي تتردد بين الحين والآخر بشأن حصول المقاومة الفلسطينية على أسلحة وذخائر بواسطة عناصر بدوية.<br />بموازاة ذلك لم يكن \"الوسط الدرزي\" يشهد تحولات جديرة بالانتباه. فقد بقيت الطائفة الدرزية في نطاق دولة إسرائيل حريصة على الظهور بهيئة الحليف الدائم والوفي لهذه الدولة، متناسية انتماءها الفلسطيني حسبما يقول مراقبون.<br />وجنت السياسة الإسرائيلية جملة من المكاسب المباشرة جراء هذا \"الحلف\" الذي لا يبدو قابلاً للمساس بين \"الدولة اليهودية\" و\"الطائفة الدرزية\". فقد تم دق إسفين تاريخي بين الدروز من جانب والأغلبية العربية والمسلمة في فلسطين والجوار والمنطقة برمتها. وتم قطع الطريق على تشكيل جسم موحد، فوق طائفي، لفلسطينيي 48 كافة من أجل تحقيق مكاسب سياسية واجتماعية واقتصادية.<br />ونجحت الآلة العسكرية الإسرائيلية في استعمال الشبان الدروز لأكثر أدوارها فظاظة وقسوة بحق المواطنين الفلسطينيين، فهم عملياً \"عناصر المهمات القذرة\" في قوات الاحتلال، بدءاً من الصورة التقليدية الرائجة للجندي الدرزي في \"حرس الحدود\"، الذي يقتحم البيت الفلسط<br />Read the rest of this comment..."
