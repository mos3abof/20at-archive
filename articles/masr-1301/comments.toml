posted = "2006-12-14"
text = "شعبي مَجهولٌ مَعلومْ !<br />ليسَ لهُ معنىً مفهومْ .<br />يَتبنَّى أُغنيةَ البُلبُلِ ،<br />لكنْ .. يَتغنَّى بالبُومْ !<br />يَصرُخُ منْ آلامِ الحُمّى ..<br />وَيَلومُ صُراخَ المعدومْ !<br />يَشحذُ سيفَ الظَّالِمِ ، صُبْحا ً،<br />وَيُولْوِلْ ، لَيلاً : مَظلومْ .<br />يَعدو مِن قَدَرٍ مُحتَمَلٍ ..<br />يَدعو لِقَضاءٍ مَحتومْ !<br />يَنطِقُ صَمْتاً<br />كَيلا يُقْفَلْ !<br />يَحيا مَوتاً<br />كيلا يُقتلْ !<br />يَتحاشى أن يَدْ عسَ لُغْماً<br />وهوَ منَ الدَّاخِلِ مَلغومْ !<br />قيلَ اهتِفْ للشَّعبِ الغالي .<br />فَهتَفتُ : يَعيشُ المَرحومْ !"
