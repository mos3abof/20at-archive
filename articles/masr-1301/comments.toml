[[comments]]
order = 1
subject = "شكرا عبدالله .. برغم أهمية الموضوع .. بس مش وقته ولا مكانه"
author = "إبن بهيه"
posted = "2006-12-14"
text = "أخي عبدالله الطحاوي المحترم .. لا أعتقد أنني وحدي من يحترم كتاباتك المتزنه فغير كثر ، ما طرحته أخي الفاضل على أهميته وضرورة تناوله بصورة أرشد وأعمق إلا أنه في رأيي المتواضع يبتعد قليلاً عن إدراك الكثيرين ، لا أدري كم عمرك .. عموما سأقص عليك قصة طريفه .. زمان .. زمان أوي قبل عشرين سنه يمكن كان الفيلسوف الكبير ذكي نجيب محمود يكتب صفحة أسبوعيه يوم الثلاثاء في الأهرام .. وكنت أقص هذه الورقة وأعيد قراءة ما بها عدة مرات (على فكره عادة القص دي وعمل الأراشيف قبل الإنترنت والكومبيوتر أصلا هي التي جعلتني أعلم الكاذبين والأفاقين من الكتاب أو الحكام .. ما علينا) المهم يا أخي الفاضل كنت أستعين بهذه الصفحة في فهم كتبه ، لسبب بسيط وهو أنه كان يكتب للصحافة بأسلوب أيسر مما يكتب في الكتب .. وبرغم هذا كنت أجد صعوبة آنذاك في فهم عباراته المعقدة إلى حد بعيد جداً مما دفعني إلى قراءة كل من ذكرهم في كتبه (أقصد فلسفاتهم) .. وذات مرة لم يتمكن عقلي الصغير من فهم كلمة وعباره لفترة طويلة ولا أجد حولي من يشرحها لي لسبب بسيط أيضاً وهو أن ذكي نجيب محمود كان مكروهاً وعاش ومات هكذا رحمه الله ، وسيعلم العربان بعد مائة عام أنه كان لديهم فيلسوفاً عظيماً لم يتعلموا منه ككثير مما يمر بنا ولا نستفيد منه أونتعلم منه .. عادي .. المهم قابلت الرجل صدفة في مؤتمر وزاحمت الجميع والتصقت به وليس على لساني غير رغبتي في فهم ذلك الموضوع .. على فكره .. لم أفهم ساعتها ولو أنني كنت أوميء كالفاهمين حتى لا أجهد الرجل في إعادة الشرح وقد كان متعبا جدا ..<br />هل تتصور أخي الكريم أن تجد تجاوباً من الإخوة لمناقشة مواضيع كهذه هنا ؟ هل يمكن أن يكون هذا مكانها ؟ كلامك برغم جماله وأسلوبك الشيق إلا أن لنا عليه مآخذ كثيرة ولا نقبله كله ومع هذا<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190957/http://masr.20at.com:80/article.php?sid=1301"

