[[comments]]
order = 17
subject = "افهموها"
author = "ايمن ابوزيد"
posted = "2006-12-16"
text = "انا نفسي اقول كلمة بسيطة انا لما احتاج انقض فكرة او شخص لازم ادرس الفكرة او الشخص جيدا حتي اكون واقعي في النقض لا اعتمد علي معلومات مغلوطة وتخمينات لا تقودني الي الصواب ان ما حدث في جامعة الازهر هو عمل طلابي وليس له علاقة باي جهات اخوانية خارجية لان الاخوان يعلمون جيدا ما خطورة عمل هكذا في مثل هذه الظروف وهذا يوضح لنا مدي حرية العمل الطلابي وانه نابع من داخلهم وقد يخطا ويصيب لحماستهم فلابد لنا من علاج الواقع وعدم التصرف بشيء من الغباء يقودنا الي محك الله اعلم بمداه من اعتلاق ينشيء في النفوس ما هو اشد مما حدث والسلام"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190957/http://masr.20at.com:80/article.php?sid=1301"

[[comments]]
order = 18
subject = "متطهر"
author = "بسم الله الرحمن الرحيم"
posted = "2006-12-23"
text = "نصحني صديقي أحمد ندا بقراءة هذا المقال للأستاذ الطحاوي ، و جزاه الله خيرا على نصحه ، لأن المقال جيد بالفعل و بلا أدنى مبالغه لا لصديقي و لا لأستاذنا الطحاوي<br />و الفقير إلى الله الآن متعجب بشدة لما سمعت عن بذاءات و انتقادات لاذعة خرجت عن الذوق العام في تعليقات سابقة على هذا الموضوع ، و أتشوق لرؤية التعليقات بعد إصلاح المشكلة التقنية التي حدثت بالموقع و التي أودت بإزالة الردود (مؤقتاً)<br />و لكن يمكننا التكهن ببعض الردود من خلال عدة عناصر منها الجو العام الذي احتل ساحة التعليقات في عشرينات (للأسف)<br />فأوجه تساؤلي إلى المنتمين لأي تيار ( اخوان ، سلفية ، تبليغ .....<br />هل يجوز لنا الاساءة لأحد لمجرد أنه لم يمدحنا ؟ هل يجوز لنا تكفيره ؟ هل يجوز لنا نعته بالعمالة و الموالسة لمجرد أنه وصف واقع معاصر مهما كان سلبياً أم ايجابيا ؟<br />أبتنا نختلق الخلاف لمجرد الاختلاف ؟<br />أستاذ عبدالله كأنك كنت تصف الفقير إلى الله فعلاً في المقال عندما تحدثت عن المتدينين الغير حركيين ، المتطهرين ( أتعرف أن اسم مدونتي هو \" متطهر \" ؟ و هذا الاسم لا أدعيه لذاتي الحقيرة و لكني أرجوه من فضل المولى عز و جل ، و اخترته من القرآن الكريم منذ سنة و استقريت عليه لتسمية مدونتي منذ مايزيد على شهرين ) أو كما يسميهم أستاذ حسام تمام بالمتدينين الجدد ، و لا أرى في ذلك أي عيب أو نقيصة<br />فبالفعل ليس لي انتماء لتيار او جماعة او حزب بعينه ، و لكن لا يعني ذلك ان طموحي وواجبي الايماني فردي فقط ، و أشدد على هذه النقطة فليس كل من لا يتبع جماعة هو انسان متقوقع<br />أمنية محبة صادقة إلى المحررين بعشرينات و كاتب هذا المقال : عليكم بمراجعة المقالات قبل نشرها لغويا و نحويا ، لأن هذه الأخطاء قد تشكل على الفهم في بعض الأح<br />اقرأ بقية التعليق .."
archived = "2006-12-31"
capture_url = "https://web.archive.org/web/20061231001051/http://masr.20at.com:80/article.php?sid=1301"

