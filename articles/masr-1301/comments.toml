[[comments]]
order = 6
subject = "الازهر"
author = "شنَّت قوات الأمن المصرية حملةَ اعتقالات واسعةً في صفوف طلاب الإخوان المسلمين بجامعة الأزهر، شملت حتى كتابة هذه السطور 180 طالبًا، معظمهم من مدينة الصفا الجامعية، إضافةً إلى اعتقال عدد من الطلاب من مساكنهم الخاصة والشقق التي يقطنون بها بالقرب من الجامعة، كما قامت قوات الأمن باعتقال عدد آخر من أمام الجامعة أثناء توجههم إلى محاضراتهم صباح اليوم."
posted = "2006-12-14"
text = "وقالت مصادر طلابية لـ(إخوان أون لاين): إن قوات الأمن قامت في تمام الساعة الثانية من صباح اليوم الخميس 14/12/2006م بمحاصرة مبنى الصفا الواقع في الحي السابع بضاحية مدينة نصر شرق القاهرة، ويسكن فيه معظم طلاب الإخوان المغتربين بالجامعة، واعتقلت نحو 180 طالبًا من بين 1000 طالب يسكنون فيه.<br />كما لاحقت قوات الأمن مجموعاتٍ أخرى من الطلبة من الأقاليم المختلفة في مصر في مدنهم وقراهم، ووردت أنباء مؤكدة عن أنَّ قوات الأمن قد اعتقلت عددًا منهم بالفعل في بلدانهم الأصلية، ومن مساكنهم في مدينة نصر، ومن بين الطلاب المعتقلين صهيب شوكت الملط رئيس الاتحاد الحر لطلاب جامعة الأزهر، كما تتردد أنباءٌ عن اعتقال قوات الأمن عددًا كبيرًا من أساتذة جامعة الأزهر، فضلاً عن قيادات إخوانيَّة أخرى ذات صلة بالنشاط الطلابي والعمليَّة التعليميَّة.<br />ويقوم طلاب الإخوان حاليًا بالتظاهر داخل جامعة الأزهر احتجاجًا على هذه الحملة الأمنيَّة الجديدة التي جاءت نتيجة لقيام بعض وسائل الإعلام بنقل صورة غير صحيحة عن الاستعراض المسرحي، الذي قام به بعض طلاب الإخوان بالجامعة مؤخرًا خلال اعتصامهم؛ احتجاجًا على فصل عدد من طلاب الإخوان بسبب انتخابات اتحاد الطلاب الحر، وتصوير هذا الاستعراض على أنَّه استعراضٌ لميليشيات عسكريَّة شكَّلها طلاب الإخوان، وهو ما نفاه الطلاب بشدة<br />اقرأ بقية التعليق .."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190957/http://masr.20at.com:80/article.php?sid=1301"

