author = "ليس من عادتي ان اتداخل في الحوارت باعتباران ذلك حق مكتسب للقارئ يقول فيه ما يشاء وهذا شرط الاعلام الحر الذي نبغيه ونحاول ان نمسك باهدابه وهذا المقال بملاحظتك الثاقبة هوتحليل اجتماعي عن ظاهرة نعايشها جميعا وهو كان معد للنشر في احد المواقع المتخصصة لكن الحدث والحوار الذي تم اقصد الازهر جعلني افكر في نشره في هذا المكان لم اتعمد التقعر الموضوع لابد ان يطرح من هذا المستوى وعلى ذاك التجريد فلم يكن ابدا من هدفي التطاول او السب احببت اخي الفاضل ان اجرب بجانب الضحكة والقفشة نجرب الهشة والسؤال نجرب ان نتعمق ان نفكر رصانة بين الضحكة والضحكة اليس من حقنا ان نغير ان نفكك ونبني ان نحلل اليس من حق الشباب انى يناوشوا بين الحين والحين افكار الكبار وعلى فكرة من غبر وجه الحياة الشباب سعدبن معاذ والنووي واسبينوزا وحسن البنا وعبدالناصر كانوا شباب دعنا نجرب ونرى ربما يستحي الماء على دمه هذه المرة ويكذب كل من يصدون الشباب"
