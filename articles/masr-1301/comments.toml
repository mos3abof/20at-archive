[[comments]]
order = 15
subject = "عنوان التعليق"
author = "البراء"
posted = "2006-12-16"
text = "لقد كان ما يميز الاخوان به انفسهم من دون الجماعات الاسلاميه الاخرى كونهم لا يتعمدون على ما يسمى بالفصائل او الكتائب او سمها ما شئت وانهم ملتزمون بالنهج السلمى فى التعامل مع الحكومات المختلفه ، فما الذى جرى الان<br />لذا فقد اتحفظ بعض الشىء على ان هذا الذى رايناه جميعا ما هو الا نوع من نشاط الكشافه .. كشافه!! ان فى هذا - ولا اقصد اهانه - نوع من الاستخفاف بالقارىء بدات به الموضوع وعلى العكس تماما - وكما اشار المحترم ابن بهيه - تغيرت لغه الحديث تماما و دخلت الكلمات القويه و الرنانه ، فاستخدمت كلمات معقده كان من الممكن استبدالها بما هو ابسط و يخدم نفس المعنى ، نعم وصلنا تمكنك الممتاز من اللغه و لكن ما الفائده ان لم يصلنا فكرك وهدفك من المقال اصلا!! وكما يبدو فالمقال مكتوب خصيصا للموقع والذى رواده معظمهم من الشباب و حال التعليم الان ( زى مانت راسى) وحال الثقافه العامه ( بعافيه حبتين) ، مثلا لو خرجنا الى الشارع وسألنا الشباب عن كلمات مثل التى كتبت كايدولوجيه مثلا لوجدت اجابات من نوعيه: انها رائعه خاصه لو كانت فراخ بالايدولوجيه."
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190957/http://masr.20at.com:80/article.php?sid=1301"

