[[comments]]
order = 13
subject = "حزب التجمع والاخوان"
author = "حديث عهد بالسياسه"
posted = "2006-12-14"
text = "ايه ده هو لسه فى حزب اسمه التجمع ؟لاء وليه مكتب طلاب كمان! ياترى كام طالب فى المكتب اللى اول مره نسمع عنه ده (ويمكن اخر مره) كان فين المكتب ده والطلبه بيتهرسوا من قوات الامن فى جامعة القاهره ؟ ولا المكتب مابيظهرش الا اذا كان الموضوع متعلق بالاخوان ! خلاص كل البلاوى اللى فى مصر بقى سببها الاخوان --- كل ده علشان الاخوان اسقطوا خالد محيى الدين فى كفر شكر ؟ مش معقول -- طب ايه السبب اللى يخلى حزب معارض ذى حزب التجمع يقول(نار مبارك ولا جنة الاخوان )اكيد فى سبب والله ماعرفه --- اللى يعرفه يعرفهولى ينوبكم ثواب"
archived = "2006-12-16"
capture_url = "https://web.archive.org/web/20061216190957/http://masr.20at.com:80/article.php?sid=1301"

