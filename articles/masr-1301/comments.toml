text = "هو بجد الناس الي كتبة موضوع البيان من حزب التجمع هوجزب التجمع طلع بيان عن اعتقال الطلاب ولا المرشدين لم يعطوا له الامر ولا يمكن رفعت السعيد لم يستاذن صفوت الشريف رئيس مجلس الشوري الي هو عضو معين فية<br />انا كنت حاسس انة بيان حزب امن الدولة لجنة جابر"
