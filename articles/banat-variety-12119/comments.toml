author = "جيمس"
posted = "2010-01-06"
text = "بجد وبصراحة البنات بتكدب اكثر بس ياجماعة انا عاوز اقول حاجة ان هنا البنات مابتغلطش نفسها ابدا كله على الرجل مش شايف مثلا يعنى واحدة بتتكلم على لبس البنات العريان ولا اللبس الضيق واللبس الا اصلا مافيش لبس وبعدين تزعلم من التحرش والاغتصاب يعنى الشاب لما بيشوف بنت عريانة بيقلس عليها ويقول وترجعوا تقولوا اغتصاب وتحرش طيب يابنات ياحلوين يامثقفين انتم ليه مابتلتزموش علشان الولد يلتزم معاكم وبعدين فى موضوع الحب من الاخر كله بيضحك على كله والولد عارف هو عاوز ايه من البنت والبنت عارفة هى عاوزة ايه من الولد اوعا تقولم ان فى ولد بيضحك على بنت مافيش ولد بيضحك على بنت غير الا لما تكون هى عاوزة يضحك عليها وبمزاجها والشباب مش عبيط علشان يصدق وهى بتقول ضحك على ضحك عليكى فى شقته وايه الا وصلك شقته كنتى هتطبخيله ولا هتكنسى له غرفة نومه معلهشى لما شاب يلاقى بنت مع ولد يعنى فى وضع مخل كدة فى عربية يقوموا الشباب يقولوا ايه مزة مصلحة حلال لنا يقوم يغتصبوها لانهما لقوها بتغتصب بس بمزاجها وشكرا"
archived = "2010-01-08"
capture_url = "https://web.archive.org/web/20100108101305/http://www.20at.com:80/banat/variety/12119--9.html"

