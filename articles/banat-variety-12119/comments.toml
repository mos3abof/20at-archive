text = "اقتباس محمد مصطفى:<br />كلكوا زوق والله<br />البنات فعلا بيخافوا على مشاعر الرجاله وعشان كده لسه واحده انهارده اعرفها من فتره بتقولى متيجى تتجوزنى وللاسف افتكرتها بتهزر لكن كانت بتتكلم بجد ؟؟؟جواز رسمى بالبطايق قالتهالى كده بالظبط …<br />فمحدش يقولى لغة المواربه دى لسه موجوده لان كل الكلام دلوقتى على عينك يا تاجر احنا الرجاله دلوقتى اللى بنتكسف<br />لو عايزين رائي الستات كلها ناقصات عقل ودين ومتناقضين جدا يعني لو طلبت منه يكون صديقي ويحكيلي كل حاجه وجيه حكالي على موقف مع بنت وحاسيت انه كتر في كلامة او اعجبل بالشخصيه يبقى يومه اسود ومش معدي ولو كنت معرفتش ودارا عليا مكنتش نكدت عليه"
archived = "2010-01-08"
capture_url = "https://web.archive.org/web/20100108101305/http://www.20at.com:80/banat/variety/12119--9.html"

