text = "انا مشكلتي ان بكرة الكذب جدا وفي اول جوازي لما كنت بحكي لجوزي على كل حاجة بصراحة شديدة كان يزعل مني ويقولي لية تعملي كدة وتقلي بخناقة ومشكلتي الكبيرة ان جوزي بيحاسبني على كل حاجة بعملها ولما بحاول اداري علية حاجة مبعرفش ونتخانق اكتر لما يعرف ان داريت علية الحاجة الفلانية مع اني واللة الحمد للة كل تصرفاتي صح بس جوزي عصبي جدا وحاططت في دماغة اني لسة صغيرة مش بعرف اعمل اي حاجة وانا بحاول ارضية ومش عارفة"
archived = "2010-03-08"
