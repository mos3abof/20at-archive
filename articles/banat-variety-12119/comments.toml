posted = "2009-12-25"
text = "اقتباس tamtam:<br />مبدئيا الكلام ده مش علمى بالمره<br />وطبعا اللى كاتبه راجل اولا لما الست بتقول انا بحبك بس مش واقعه فى غرامك ده معناه انك محتاج تبذل مجهود اكتر عشان انت مقصر<br />وعباره \"إنني ظلمت من قبل الرجال الذين ارتبطت معهم في الماضي وهم مجانين ديه معناها لو سمحت ما تحاولش تجرح مشاعرى عشان انا اتجرحت قبل كده<br />اما بقى عبارة \"لا تفسد صداقتنا فديه حسب اللى قدام الواحده يعنى لو هى فعلا مش بتحبه حتقوله كده لكن لو بتحبه حتقول نفس الجمله لكن بغرض انه يطمنها ان هو مش حيتغير او انه فعلا بيحبها<br />انتى كلام صح الللى مكتوب فوق ده بعيد البعد عن الحيقيه<br />وانت ولد مش بنت فعلا لانك لو بنت كنت فهمت يا اخ<br />والبنت لما بتقول لصديق ليها لا تفسد صداقتنا هى بتبقى خايفه لو ارتبطوا ومنفعش الارتبناط هتبقى مجبر تسيبه"
archived = "2010-01-08"
capture_url = "https://web.archive.org/web/20100108101305/http://www.20at.com:80/banat/variety/12119--9.html"

