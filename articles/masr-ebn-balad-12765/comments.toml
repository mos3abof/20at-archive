author = "جيـــــــــمـي"
posted = "2009-07-27"
text = "تحية لذلك الرجل الذي لم يستبيح الفساد .<br />طب وهياكل منين دلوقتي واطفاله … واكيد فيه غيره كتير من الى انتوا ماوصلتلهمش او الى ماتوا من كتر الظلم والى مش عارفين يوصلوا صوتهم لحد … علشان كدة بنقول لازم يبقى فيه دورات توعية للمواطنين لو حاصل معاهم أيه يروحوا فين … مش كل حاجة مظاهرات وأحتجاجات .<br />وعاجبني شغل الشباب بتوع 6 أبريل في حكاية انهم مش مركزين دلوقتي في المظاهرات على قد ما هما مركزين في حملتهم الجديدة ( وسطتك مصريتك) والى بتقوم على توعية الناس بواجباتهم قبل حقوقهم ."
archived = "2009-08-02"
capture_url = "https://web.archive.org/web/20090802222427/http://www.20at.com:80/masr/ebn-balad/12765-2009-07-27-12-20-39.html"

