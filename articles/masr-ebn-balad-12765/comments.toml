order = 2
subject = ""
author = "غلطان بالنمرة"
posted = "2009-07-27"
text = "طبعا غلطان ويستحق الضرب بالجزمة<br />اذا كانت السرقة تتم باوامر من اعلى مستوى والحرامية يحكمون تبقى انت يا حتة زبلة هتقف فى وش التيار<br />طبعا مكانك هيبقى فى الشارع لانك لمض ووش فقر وبتاع حلال وحرام<br />اذا كان رئيسك حرامى تبقى تعمل زى ما بيعمل والا انت عايز تروح النار وتعصى اولى الامر وتخرج عليهم يا فاسق يا ضال<br />لازم تطيع ولى الامر وحتى ان ضرب ظهرك<br />عالم وش فقر"
archived = "2009-08-02"
capture_url = "https://web.archive.org/web/20090802222427/http://www.20at.com:80/masr/ebn-balad/12765-2009-07-27-12-20-39.html"
