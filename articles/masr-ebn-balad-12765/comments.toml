author = "صبي قهوة"
posted = "2009-07-27"
text = "صبي قهوة ودي بقي نحويا ولا زي صبي عالمة كده أنا معرفش مهنة اسمها صبي قهوة أعرف القهوجي وأعرف الرمال وأعرف السييخ اللي هو بيسيخ الشيش أنما صبي قهوة مشوفتهاش قبل كده مع العالمة ( الرقاصة اللي بترقص ) .. صحيح ويخلق مالا تعلمون"
archived = "2009-08-02"
