[[comments]]
order = 0
subject = "كيري موش في تفكيري ..!!"
text = "بصراحة نفسي أشوف البني آدم واقف قدام البيت الأبيض بيقول ..والله يا جماعة أنا موش عارف مين بالظبط اللي ضرب تمثال الحرية ..<br />بس علي العموم أحنا هنضرب ايران وسوريا لحد منعرف<br />صدقوني بوش هو كيري وكيري هو بوش لما أحنا نتغير هما ممكن يتغيروا<br />من أعمالكم يولي عليكم<br />بيرو"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018154111/http://www.20at.com:80/article.php?sid=638"

[[comments]]
order = 1
subject = "الموجي"
text = "ايه ياجماعة<br />انت تعبتوا من كتابة المقالات ولا ايه<br />عموما احنا كمان تعبنا من القراءة<br />أو بمعنى آخر مالناش نفس نقرا<br />اديني كمان كبسولات ياحاج على"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018154111/http://www.20at.com:80/article.php?sid=638"

[[comments]]
order = 2
subject = "عزيزى على"
text = "لم يساورنى ادنى شك و انا اقراء عنوان المقال قبل ان افتحه، فى انك كاتبه .. هذا الحس الساخر ينتمى الى مدرسة \" اتوبيس \" و \" فكره \" .. استطيع ان اميزه دون عناء . انتقاء رائع للصور يا على .. و تعليقات لها مغذاها .. ليخرح مقالك فى النهايه اشبه بمسرحيه من مسرحيات بيرنارد شو .<br />Waiting for more"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018154111/http://www.20at.com:80/article.php?sid=638"

[[comments]]
order = 3
subject = "نونا"
text = "حاج علي ... دائما في المقدمة<br />انت الي رديت علي الايميل انا كنت شاكك في براء لكن قفشتك... ( انا ماسكه مسدس ميه )<br />موضوعاتك دايما حلوة ... و كيري صراحة بعيدا عن سيايته لان انا مش بفهم في السياسة بس شكله واد مش كول و رنة موبايلة مش كول .. و بوش شكله عامل زي العيال الهابلة الصغيرة الي بتزن وتشبط و مزعجة و شكله مش هيجيبها البر<br />لا ده عدل ولا ده عدل ولا هيجي من وش امريكا حد عدل<br />الفرق بينهم ان واحد بيدمرنا و يدربنا من تحت لي تحت وعامل فيها مش واخد باله و التاني عايز يعمل فيها البطل المغوار و مستني العالم يتوجه بأكاليل الغار علي هبله .... لكن مفيش منهم صديق للعرب و لا المسلمين الفرق في طريقة تدمير الشعب ده من تحت لي تحت ولا علي المكشوف"
archived = "2004-10-18"
capture_url = "https://web.archive.org/web/20041018154111/http://www.20at.com:80/article.php?sid=638"

