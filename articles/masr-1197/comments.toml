[[comments]]
order = 11
subject = "من حجاب مصر الى حجاب تونس"
author = "يا ايها الذين امنوا اصبروا وصابروا وصابروا"
posted = "2006-11-23"
text = "اعتداء متواصل على المحجّبات في تونس<br />مقدم بواسطة Ched فى ثلث, 2006-11-14 13:01. سياسة | تونس<br />وردت علينا رسالة من لجنة الدفاع عن المحجّبات في تونس تشير إلى اعتداء سافر تعرّضت له امرأة عجوز بالطريق العام في تونس العاصمة ننقلها للرأي العام الوطني والدولي لمعرفة حقيقة المعاملات الوحشيّة التي يمارسها البوليس التّونسي ضدّ المرأة المحجّبة في تونس وفيما يلي نصّ الحادثة :<br />تم إيقاف امرأة تجاوز عمرها الستّين من قبل اثنان من أعوان الأمن بمنطقة \"الباساج\" بتونس العاصمة لاستجوابها عن سبب ارتدائها الحجاب و تذكيرها بالتصريحات الأخيرة لرئيس الدّولة . تمّ على إثرذلك أمرها بنزع حجابها فورا فلما رفضت قام أحدهما بنزعه بالقوة عندها صاحت المرأة من هول الفاجعة و لم تتمالك نفسها فدعت عليه قائلة : \"فضحك الله في الآخرة كما فضحتني في الدنيا\". عندها انهالا عليها عوني الأمن ضربا بالعصا حتى سقطت على الأرض على مرأى من المارة.<br />و يجدر الإشارة أن المرأة تعمل كمعينة منزلية و هي من ضعاف الحال و قد قررت الانقطاع عن العمل و لزوم بيتها خوفا من أن تتكررلها الحادثة مرة أخرى ."
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125171949/http://masr.20at.com:80/article.php?sid=1197"

[[comments]]
order = 12
subject = "الى الجاهل الجهيل المجهول"
author = "انسان"
posted = "2006-11-23"
text = "لن اضيف جديد على ما سبق ولكنى اتسائل لماذا تقفون في وجهة الحشمة والاحترام والادب ولا نسمع منكم تعليقا على العرايا الذين يملئون البلاد. فأذا احتشمت البنت واجهت اتهامات بالرجعية والتخلف واذا التزم الشاب واجهة اتهامات بالارهاب والاجرام اليس هذا تناقضا غريبا انة في اسبوعين متتاليين يأتى احدكم ليطعن في النقاب فأذا جاء الاسبوع الذى يلية وحدثت احداث وسط البلد تلومون الشباب على ما فعلوة وتهتموهم بضياع الاخلاق كيف تنزعزن منهم الاخلاق نزعا ثم تلوموهم على فقدانها (القاة في اليم مكتوفا واقول اياك اياك ان تبتل بالماء)"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125171949/http://masr.20at.com:80/article.php?sid=1197"

[[comments]]
order = 13
subject = "هذا هو الرد"
author = "انسان"
posted = "2006-11-23"
text = "انا سمعنا اختنا شيئا عجاب..قالو كلاما لايسر عن الحجاب... قالو ظلاما حالكا بين الثياب..قالو التأخر والتخلف في النقاب..نادو بتحرير الفتاة والفو فية الكتاب..رسمو طريقا للتبرج لا يضيعة الشباب..يا أختنا هم ساقطون الى الحضيض الى التراب...يا أختنا صبرا تذوب ببحرة كل الصعاب ..يا أختنا انت العفيفة والمصونة بالحجاب... فالنار مثوى الظالمين لهم عقاب ..واللة يكشف ظلمهم يوم الحساب ... والجنة المأوى ويا حسن المئاب"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125171949/http://masr.20at.com:80/article.php?sid=1197"

[[comments]]
order = 14
subject = "الهم انتقم من جمال البنا الهم ارنا فيه يوم أسود"
author = "غاده فتوح"
posted = "2006-11-23"
text = "يارب ينتقم منك يا جمال ده أسمك خساره فيك فين الجمال اللا فيك ده روح سمى نفسك ملحد كافر او اقولك سمى نفسك (أبو لهب 0 أو أبو جهل ) طيب والله لو كانوا موجودين فى زمانا لزعلوا منى دول حتى كانوا رجال مش ديوثين مثلك يا راجل ده انت ممكن تموت فى أى لاحظه هتقول لربنا أيه حريه الرأى ديه على مراتك على أهل بيتك أنشله يمشوا عرينين حتى أحنا ملنا أحنا ناس بندور أزاى نرضى ربنا ده حتى أنا منقبه و معتزه بكده على ألاقل لا يرى جسمى او وجهى واحد على شاكلاتك أنا كل الى يهمنى زوجى مش برضه ربنا قال ولا يبدين زينتهن الا لأزوجهم او محارمهم الله ينقم منك أنت وزير الثقافه هذا حسبنا الله و نعم الوكيل ده حتى لو الحجاب قاصر على أمهات المؤمنين فنحن يزيدنا عزه اننا نتخذهم قدوه قال النبى ( المرء على دين خليله فلينظر أحدكم من يخالل ) وقال ( المرء يحشر مع من أحب ) و انا أشهد كل الى على الموقع انى احب رسول الله و أصحابه و أزواجه و أتمنى أن أحشر معهم يوم تبيض وجوه و تسود وجوه 0 يوم أتمنى ان أشرب من يدى الرسول الكريم شربه ماء لا أظمأ بعدها أبدأ 0 بسم الله الرحمن الرحيم(و لقد جئتمونا فردى كما خلقنكم أول مره و تركتم ما خولنكم وراء ظهوركم و ما نرى معكم شفعاءكم الذين زعمتم أنهم فيكم شركؤا لقد تقطع بينكم و ضل عنكم ما كنتم تزعمون) صدق الله العظيم0 يا أخيتى والله الذى لا ألا هو لن ينفعك فى قبرك لا فاروق حسنى ولا جمال البنا سوف يجلسك منكر و نكير و يسئلنك عن من ربك و ما دينك وماذا تقول فى الرجل الذى بعث فيكم 0 بالله عليك هتردى أزاى و أنت مضيعه دين و كلام الله و سنه رسوله أتقوا الله فأن أكثر الموتى شباب هذه الايام 0"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125171949/http://masr.20at.com:80/article.php?sid=1197"

