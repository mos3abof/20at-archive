subject = "هاد الي فالحين في"
author = "يعني موضوع انكتب تاني يوم ما شاء الله على التعليقات شو كتيرة... بس باقي المواضيع السياسية الحمد لله ما حدا بدخلها و لا بعلق عليها غير واحد و لا تنين... يعني هاد الموضوع زهقنا من كتر الحكي في و بصراحة مش شايفةانو في لازمة لكل هالحكي .. يعني بجد صرت احس انو فعلا الدين افيون الشعوب... اذا بدك تلهي الناس عن القضايا الكبيرة اشغلهم بالدين مرة قبطي و مسلم و بعدين شيعي و سني و محجبةو سافرة و ملتحي ولا لا و اللحية لازم طويلةو لا قصيرة.. بكفي و شفولكم موضوع اهم تحكو في .... مهو الحجاب منتشر هلا اكتر من اي وقت و الي بدو يتحجب ما حدا مانعو لشو هالضجة الي ما الها معنى... الزلمة عندو وجهة نظر تانية هو حر.. ما تسمعلوش و خلصونا"
