[[comments]]
order = 26
subject = "طارق الوزير"
author = "tark alwzer@yahoo.com"
posted = "2006-11-24"
text = "الى من اطلق وصف (الكلاب متحدون )والله عيب يا اخى دا الكلاب احسن منهم ولكن الموقع اسمه (اتحاد المبرشمون ) او (المبرشمون متحدون )! ومن يستعمل هذا التعبير يذكرنى لاننى سجلته باسمى !<br />والرد على الاستاذ حسن البنا بسيط جدا<br />1- هو غير متزوج للاسف فلماذا يتدخل فيما لم يحسه .<br />2- لقد سقط من نظرى بعد فتواه التدخين حلال فى رمضان.<br />3- واعتقد فتواه القادمه ستكون حول اختصار عدد الركعات فى الصلاه لانها ليست فى القرأن !!<br />4- اما الحجاب فموجود فى مصر من زمان الملايه اللف والطرحه والمنديل المحلاوى وابواويه واليشمك والملس وغيره...وببساطه الاستاذ يعرف ان هناك ايات فى القرأن يطلب منها الله الا يكشفن عن زينتهن !ومن الزينه المشغولات الذهبيه التى احلها للمرأه وحرمها على الرجل !<br />ومن تريد ان تعرض فلتعرض وعلى المبرشميين الذين يعرضون بضاعتهم علينا ان يعرضوها فلهم الميكروجيب والشهر الذهبى....والبطاعه المكشوفه دائما تجدها غير مستساغه ويصابون بالعنه كذلك بالاضافه الى اكل لحم الخنزير والخمره فتجدوهم لايثارون مثل المسلميين ؟<br />وحد عنده سؤال لان تعليقاتى تجعلهم تائهون وهم يعرفوا"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125171949/http://masr.20at.com:80/article.php?sid=1197"

[[comments]]
order = 27
subject = "بالراحة بس..."
author = "علي"
posted = "2006-11-24"
text = "البوب اللي نقل شوية أيات و إعتبر إنه كده جاب من الأخر, يا ريت بس تبقي تقري كويس في لتفسير علشان أول أية بتتكلم عليها كانت لتمييز النساء الحرائر عن العبيد (وده موجود في تفاسير كتير للي هيعمل مجهود) و في أية تانية بتقول \"فليضربن بخمرهن علي جيوبهن\" بتقول الجيوب اللي هيه الصدر وبتتكلم علي الخمار علي إنه حاجة موجودة قبل الإسلام, أما الأية اللي بتتكلم علي الزينة فهيا محددتش إيه بالضبط اللي المقصود بماضع الزينة. فيه بقي كمان حديث بيقول ميبانش غير الكفين و الوجه و ده من أحاديث الأحاد اللي مبيتبنيش عليه لوحدها قاعدة شرعية.<br />مش الهدف من الكلام تغيير راي حد في إذا كان الحجاب فرض و لأ, الغرض بس إننا نتفاهم مع بعضنا من غير تكفير ولا دعا علي بعض ولا مصادرة علي الأراء التانية كأن مفيش إحتمال حد يبقي ليه وجهة نظر مختلفة و محترمة.<br />أما بقي الأخ اللي قال علي ماركس و إنجلز فيارب ميطلعش من اللي بيجيبوا معلوماتهم عن اليساريين من كتب السلفيين و شرائط الرصيف. إختلف مع ماركس و قول إنه حمار, ده حقك, بس ياريت تقراه الأول و تعرف إنه أثر في تاريخ البشرية كلها لأن كتير من نظريات الإقتصاد اللي بتتطبق دلوقتي (جوه الرأسمالية) أساسها في فكره. غير طبعا إسهامه في الفلسفة و علم الإجتماع و ووو.<br />www.demleft.org"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125171949/http://masr.20at.com:80/article.php?sid=1197"

[[comments]]
order = 28
subject = "هداكم الله"
author = "محمدأغا"
posted = "2006-11-24"
text = "ارجو ممن ليس لهم علاقة بالدين ان يكفو السنتهم ويتقوا الله فما يكب الناس على وجوههم فى النار الا من حصاد السنتهم الدين ليس بالعقل ولكن بالنص من القران والسنة الشريفة وما ترك الله ورسوله امرا غامض على الناس ومن بعدهم السلف الصالح<br />والله لن نفلح ونحن نترك السفهاء يقطعوا فى الاسلام ويفهمونا ديننا برئيتهم المريضة فيجب ان نسال اهل العلم الذين نرضى دينهم ومنهجهم والقران الكريم لايخضع لاجتهاد كل سفيه فيجب ان نلتزم بتفسير شيوخنا الاجلاء الذين لاغبار عليهم<br />هدانا الله واياكم"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125171949/http://masr.20at.com:80/article.php?sid=1197"

