subject = "القافلة تسير والكلا..........."
author = "أنا عربي"
posted = "2006-11-23"
text = "أولاً أوجه كل شكري وتقديري للسيد المحترم عماد أبو عز لأنه رد بالقرأن والكريم والسنة النبوية الشريفة وباقي التشريعات التي يأخد بهاالمسلمون وذلك حتى يرى السيد البنا أن ليس جميع الشعب حيرد بالشتيمة وشوية يقولوا حسبي الله لا لا لا يا بنا إحنا إنشاء الله نعرف كويس من كتاب الله وسنة نبية الكتاب الحق والسنة السليمة بعيداً عن كل تلك التفسيرات الهوائية التي لا تمت بأي صلة للعقل والعقلاء يا سيد ويكفي أن الحجاب من الأشياء الثابتة على مر العثور منذ فجر الإسلام الذي لميتعرض للجدل إلا في تلك الأيام وكأنه نكاية بهؤلاء المتعففات أما من يريد أن تكون بناته وزوجته وأخواته زهور يشمها القاصي والداني فله ذلك ولكن ذلك يندرج تحت بند التعر.... وليس حرية الرأي ولم يكن يوماً حرية الرأي تعني التطاول على الأديان وثوابتها وأنا مستني رد السادة الشيوخ إلي بتلاتة مليم زي ما قال الفنان فاروق حسني لأنه بكل جدارة أكبر فنان شوفته في حياتي"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125171949/http://masr.20at.com:80/article.php?sid=1197"

[[comments]]
order = 20
subject = "الحجاب معروف من الدين بالضروره مثل الصلاه"
author = "ناصر الاسلام"
posted = "2006-11-23"
text = "بسم الله الرحمن الرحيم,الخمار يعنى الغطاء المحيط بالشىء لذا سميت الخمر خمرا لانها تغطى العقل وتخامره وعليه فان المقصود بخمرهن هو الغطاء الساتر المحيط لشعر المرأه وعنقها وصدرها , والخطاب فى الايات موجه لامهات المومنين ولنساء المؤمنين فى كل عصر من الاعصرلا كما قيل انه لعصر مخصوص وهو عصر النبوه او مكان مخصوص يعنى جزيره العرب فلاسلام جاء للناس كافه والا قلنا ان الصلاة هى الاخرى لا تلزم الا الصحابه واهل الجزيره دون من دخل فيما بعد فى الاسلام من الامم الاخرى وهذا كلام ضد المنطق والعقل, والغريب فى الامر ان جمال البنا يعلم جيدا انه اذا جاء الاسلام واقر عادةحسنه كانت موجوده فى الجاهليه,مثل اكرم الضيف اوالزواج بشاهدين وباشهر وبرضاء الزوجه ووليها او الديه التى تقرر لولى الميت عند عفوه عن القاتل كل هذة احكام جاء الاسلام واقرها لانها احكام عادله فى ذاتها وبعد اقرارهل من قبل الشرع فان مصدرها هو الشرع , واقرب مثال لذلك السنه التقريريه من النبى صلى الله عليه وسلم حينما كان يقر عمل احد الصحابه فيصير ما اقره النبى سنه نبويه وليس عمل من اعمال الصحابه, وعليه لو افترضنا جدلا ان الحجاب كان عاده سابقه على الاسلام وعرفت عند حرائر العرب وجاء الشرع الحنيف واقر هذه العاده اصبحت من يوم اقرارها امر شرعى ومصدره هو التشريع الالهى لا العادهالسابقه على ظهور الاسلام, وبما ان اى انسان بيدعى انه مفكر اسلامى يعرف هذه الامور لانها الف باء الفكر الاسلامى والثقافه الاسلاميه ,فهذا اكبر دليل على سوء نية جمال البنا وخلطة للحق بالباطل وهو يعلم وتلبيسه للامور واخفاء الحقيقه يدل على انه ابعد ما يكون عن التفكير العلمى والمنطق العقلانى الذى دعانا جميعا اليه الاسلام > كما وانه ادعى بدون دليل واضح ان الاحاديث المتعلقه<br />اقرأ بقية التعليق .."
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125171949/http://masr.20at.com:80/article.php?sid=1197"

