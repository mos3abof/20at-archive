author = "مصرى للابد"
posted = "2006-11-25"
text = "يبدو ان السرطان الوهابى اصابكم جميعا<br />فاصبحتم تدافعون عن السعودية اكثر من مصر بلدكم الحقيقى<br />الى هذا الحد انتشر السرطان الوهابى فيكم ؟<br />انا لست صهيونيا بل مصرى وللابد<br />ولو اننى صيهونى حقا لشاركت فى نشر الوهابية فى مصر<br />حتى يصبح المصريون مجموعة من الهمج يسهل لاسرائيل سحقها<br />كما فعلت امريكا مع حركة طالبان التى جعلت الافغان يعيشون حياة القرون الوسطى<br />انتم اصبحتم لا تتبعون الرسول الكريم \"محمد بن عبد الله \" بل تتبعون نبى الوهابية \"محمد بن عبد الوهاب\"<br />هل يعرف احدكم شئ عن الخطة التى يجرى تنفيذها بدقة و التى تعرف باسم خطة \"مصرستان\"؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />افيقوا يا مصريييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييييين<br />نعم انا اتمنى ان تقوم امريكا بسحق السعودية وازالة الوهابية من الوجود<br />قد لا يحدث ذلك فى عهد الرئيس الغبى بوش<br />فهذا الرئيس شديد الغباء يتحدث عن العراق كمحور للشر و لا يذكر دولة الارهاب الاولى فى العالم السعودية الوهابية<br />ومرة ثانية كمصريين ماذا يجب علينا ان نفعل لمحاربة السرطان الوهابى فى بلادنا ؟<br />التوقيع<br />مصرى للابد"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125171949/http://masr.20at.com:80/article.php?sid=1197"

