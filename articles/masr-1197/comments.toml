[[comments]]
order = 7
subject = "إلي جدو البنا"
author = "عماد أبو عز"
posted = "2006-11-23"
text = "جدو جمال يا من عشت شبابك فى الأربعينات و رغم أنك تمتعت متعة كاذبة بالنظر المحرم فى عصر كانت الملابس المحترمة فيه تحت الركبة بشبر ، إلا أنك لا تحترم نذير الموت الأبيض فى شعر رأسك ، و تنكر معلوما من الدين بالضرورة دون علم منك رغم أنك تدعى العلم ، و لكى تعلم أنه ما عليك أن تتحدث فى الدين أبدا و أنك فيه من الجهلاء ، إقرأ الكلام التالي بدقة و حاول أن تفهمه .<br />مصادر التشريع الإسلامي هي : القرآن و السنة و الإجماع .<br />أما القرآن : فقد قال الله تعالى : ( يَا أَيُّهَا النَّبِيُّ قُل لِّأَزْوَاجِكَ وَبَنَاتِكَ وَنِسَاء الْمُؤْمِنِينَ يُدْنِينَ عَلَيْهِنَّ مِن جَلَابِيبِهِنَّ ذَلِكَ أَدْنَى أَن يُعْرَفْنَ فَلَا يُؤْذَيْنَ وَكَانَ اللَّهُ غَفُورًا رَّحِيمًا ) الأحزاب - 59 .<br />قال السيوطي رحمه الله تعالى: ( هذه آية الحجاب في حق سائر النساء، ففيها وجوب ستر الرأس والوجه عليهن ) .<br />و قال تعالى في سورة النور : ( وَقُل لِّلْمُؤْمِنَاتِ يَغْضُضْنَ مِنْ أَبْصَارِهِنَّ وَيَحْفَظْنَ فُرُوجَهُنَّ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا مَا ظَهَرَ مِنْهَا وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَى جُيُوبِهِنَّ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا لِبُعُولَتِهِنَّ أَوْ آبَائِهِنَّ أَوْ آبَاء بُعُولَتِهِنَّ أَوْ أَبْنَائِهِنَّ أَوْ أَبْنَاء بُعُولَتِهِنَّ أَوْ إِخْوَانِهِنَّ أَوْ بَنِي إِخْوَانِهِنَّ أَوْ بَنِي أَخَوَاتِهِنَّ أَوْ نِسَائِهِنَّ أَوْ مَا مَلَكَتْ أَيْمَانُهُنَّ أَوِ التَّابِعِينَ غَيْرِ أُوْلِي الْإِرْبَةِ مِنَ الرِّجَالِ أَوِ الطِّفْلِ الَّذِينَ لَمْ يَظْهَرُوا عَلَى عَوْرَاتِ النِّسَاء وَلَا يَضْرِبْنَ بِأَرْجُلِهِنَّ لِيُعْلَمَ مَا يُخْفِينَ مِن زِينَتِهِنَّ وَتُوبُوا إِلَى اللَّهِ جَمِيعًا أَيُّهَا<br />اقرأ بقية التعليق .."
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125171949/http://masr.20at.com:80/article.php?sid=1197"

