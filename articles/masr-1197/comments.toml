[[comments]]
order = 3
subject = "الى ولاد البلد"
author = "مطلوب فوري"
posted = "2006-11-23"
text = "جمال البنا دا انا شفت ليه حديث صحفي في موقع (الكلاب متحدون) متاسف اقصد الاقباط متحدون وفضل يشكك في الاسلام ويطعن فيه وكأنه مسيحي واتذكر انه قال ان القرأن ليس معجزه.<br />وعلشان الاقباط بيقولوا انهم هما (((ولاد البلد))) فجايبين هذا التحقيق الفاشل زيهم علشان يعملوا بيه فتنة ويخلوا المعلقين (المسلمين) يشتموا ويسبوا ويلعنوا وهما فرحانين انهم خلوا المسلمين يشتموا ويسبوا ويلعنوا وانا ارد عليهم بآية قرأنية.<br />(ان الذين يحبون ان تشيع الفاحشة فب الذين امنو لهم عذاب اليم في الدنيا والاخرة)<br />(ان الذين يحبون ان تشيع الفاحشة فب الذين امنو لهم عذاب اليم في الدنيا والاخرة)<br />(ان الذين يحبون ان تشيع الفاحشة فب الذين امنو لهم عذاب اليم في الدنيا والاخرة)<br />والأيام بيننا"
archived = "2006-11-25"
capture_url = "https://web.archive.org/web/20061125171949/http://masr.20at.com:80/article.php?sid=1197"

