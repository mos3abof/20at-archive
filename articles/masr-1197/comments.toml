posted = "2006-11-23"
text = "عشنا وشفنا يا مصر .. بقى عندنا ترابي أجدع من تراب السودان وأخ عقيد (من باب اللعب بالعقيدة) كمان أجدع من العقيد لاقذافي ... يالا ما هو زمن أغبر ما لوش وش ولا قفا حتى .. زمن يبقى فيه حصاوي رئيس دولة في أمريكا وفي مصر لازم يكون كده ولا إيه رأيكم يا سامعين في الشيخ كباب كفته الأمين .. طالع يعر المسلمين امال يا ريته كان كفر .. ((على رأي عمنا بيرم التونسي الله يرحمه))<br />إبن بهية<br />http://ibnbahya.blogspot.com/"
