[[comments]]
order = 1
subject = "ات كاتب المقال دا وانت عندك كام سنه ؟؟؟!!!"
author = "هوووووووووبه"
posted = "2006-05-31"
text = "والله يا جدعان لسه بلعب صلح مع اختي وبتتريق عليا , بحب اغتت عليها فعلا بالعبه دي ممتعه جدا , ياسلام يا عم عجم \" انت بتتكلم عربي الاول \"لما ترجعني صغننه , استغمايه وصلح وسيجه والحاجات الكميله بردو دي , استغمايه دي كنت بلعب مع صبيان وبنات الحته نفر نفر وماما كانت تزعقلي متلعبش مع الصبيان معرفش ليه؟؟ وكنت بحب اغشهم واعمل نفسي قال ايه مش شايفاهم وبعدين نروح علي \"الامه \" كنت بجري بسسسسسسرعه اوي عشان الامه دي , وكمان شد الكوبس وازاي واحد يساعد التاني ويفك بلمسه باين ويقي فك اسره ويقدر يتحرك ,وكهرررررررربا , ايه تاني يا بت امممممممم في لعب بالايدين كدا ولاغنيه بتاعتها شيوكلاته شوكلاته شوكلاته يوه اي لف يو قناه السويس بناها اجددنا عيسي وعويس جاه البرنس قالنا هوس انتو النص وحنا النص وجاء مستر كاجو كاجو في وسط البناتو ناتو يا بنت الحسيني سيني هاتيلي قبلتين قبله علي اليمين مين وقبله علي اليسار سار دات الوجنتين \" وايه تاني يا بت ايه ايه امممم يا طالع الشجره هاتي معاك بقره بقره صعيديه حلابه النيه تحلب وتسقيني بالمعلقه الصيني المعلقه انكسرت اي مين يداويني يارتني كنت زرته عن النبي وزرته والحج سبع مرات .. واحد اتنين ... تلاته ..اربعه .. خمسه.. سته ...\"سبعه\" وكل الوجوه تتلتف عشان تشوف السبعه حتيجي علي مين . \"سيجه \" كنت بلعبها علي الارض مبوظه الارض طباشير<br />وياما خدت علقه سخنه بسبب الموضوع دا اولا عشان اخواتي طيبين وانااللي بستهبلهم وبجيب رجلهم ونشترك في الجريمه سوا بس المعفين بيفتنو عليا , لن انسي لهم هدا الموقف .ياجدعان محدش عنده اللعب تاني ويبعتهالي في اميل انا دلوقتي عندي رغبه فظيعه في اشغل اغنيه فيرز يا\" ليالي العمر ارجعلي\"."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133350/http://masr.20at.com:80/article.php?sid=427"

