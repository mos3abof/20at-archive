subject = "يتبع اللعب .."
author = "هوووووووووبه"
posted = "2006-05-31"
text = "معلش يا جدعان الاغنيه الاساسيه اهيه \" كان في واحد نجار حب يصلح باب الدار كام مسمار يلزمه في تصليح باب الدار \" وكل كلمه من الاغنيه يعني شخص , واللي شخص اللي تيجيه عليه كلمه \"الدار\" يختار عدد المسامير , عشره سبعه ,......ويتكرر العدد علي الاشخاص لغايه مايجيه عليه الرقم عشره ,سبعه , سته ,......... ويبقي هو اللي فيها . ومشفكوش فيها."
