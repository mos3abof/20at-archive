[[comments]]
order = 6
subject = "فكرتوني بالذي مضي"
author = "مرمورة"
posted = "2006-06-02"
text = "ليه بس كده .الواحد كان بيحاول ينسي ان هوكبر خلاص....قصدكم تقولوا كده ان الالعاب دي احنا كبرنا عليها بما اننا عشريناتيه وخلاص مش هنلعبها تاني ..........ايه ده يعني مفيش استغمايهتاني ولا كهربا ولا اي حاجه ليه بس فوقتوني.........مش عايزة اقولكم اني بتلكك لما الاقي حد من العيال الصغيرين بتوع العيلهبيلعبوا مع بعض بروح اغلس عليهم كاني بلعب معاهم واقعد بيني وبين نفسي ابتسم واستعيد ذكريات الطفوله ..يااااااااااه انا لعبت كده وجريت هنا وضربت الواد اخويا هنا وزقيت جارتنا هنا ..اما هنا بقي عورت اختي الصغيرة ...بجد بجد كانت احلي ايام من غير هموم ولا كابه ولا مشاكل ولا مسئوليات ولا واجبات ولا اي حاجه في اي حاجه .......لعب وبس........براءة وبس ..ضحك وهزار وبس ...كانت ايام"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133350/http://masr.20at.com:80/article.php?sid=427"

[[comments]]
order = 7
subject = "لماذ ا يكرة المصريون هذة الالعاب"
author = "هناء"
posted = "2006-06-04"
text = "لماذا ةهيا العاب شب المصريون ووجدوها تعيش بينهم وهيا العاب كان تعتبر بالنسبة للاجيال الماضية هى الوسيلة الوحيدة للترفية وانها جميلة وتناسب اى انسان انا مثلا احب الكرتون حبا شديدا وارى فية نفسى وما يناسب شخصيتى تماما وارى فية الصدق ماذا يعنى هذا حتى لعبة العريس والعروسة كل النساء لعبتها حتى الرجال لانهم بهم فطرة وغريزة الامومة"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615133350/http://masr.20at.com:80/article.php?sid=427"

