[[comments]]
order = 0
subject = "انا معلمه"
author = "امة الله"
posted = "2005-12-17"
text = "السلام عليكم و رحمه الله و بركاته<br />انا اعمل معلمه في مدرسه ابتدائيه و بادرس الاطفال ماده محتاجه فهم بس للاسف مش قادره اتعامل معاهم لانهم للاسف واخدين عليه و بيحبوني لدرجه انهم مش بيخافوا مني صحيح الحاجه اللي باطلبها منهم من غير المقررات الدراسيه بينفذوها زي مثلا عده اهانه بعضهم قص الاظافر بر الوالدين انما مش باقدر اسيطر غليهم في الفصل و باشف المدرسين التانيين بيضربوا و بيشتموا شتايم رهيبه و بالتالي الاولاد برضه بيسمعوا الكلام بس مش ممكن تسمعلهم نفس في الفصل مشكلتي اني مش قادره اتعامل مع الاطفال الا بالقيم و المثاليات مش باعرف اضرب بشده و لا بقدر اشتم بطريقه المدرسين ااتانيين بس باعتمد في طريقتي و لو اني باتعب على تعليمهم حب العلو لذاته و اعلمهم ان المسلم الصح لازم يكون متفوق في كل حاجه و الله المعين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113918/http://www.20at.com/article2.php?sid=65"

[[comments]]
order = 1
subject = "انا معلم في الاردن"
author = "بدون فضايح"
posted = "2006-03-14"
text = "انا بشتغل مدرس في عمان الثانية .... والله لو يأتي وزير التربية والتعليم على المدرية الي انا بشتغل فيها ... والله ليقدم استقالته... ويمكن الحكومة نفسها تقدم ستقالتها.... في المدرسة عندي طبعاً مكان للتدخين الطلاب ... الطلاب يشتموا المدير قبل المعلم ... وحصلت حالة تعدي على استاذ .. وغيره وغيره ... ليش المدير ما بياخذ اجرائات .. السبب هو انه خايف انه الوزارة تحط عينها عليه وعلى المدرسة فالمدير ضايلوا سنتين للتقاعد وما بدو مشاكل....<br />والله انه الحق على الوزارة ... وطول ما في نقابة للمعلم تحميه طول ما رح نسمع عن حالات و حالات..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113918/http://www.20at.com/article2.php?sid=65"

[[comments]]
order = 2
subject = ": كاد المعلم أن يكون.. \"قتيلا"
author = "تفاحة"
posted = "2006-03-22"
text = "ناقص ليا شهرين و أتخرج من كلية التربية و أهلي نفسهم إن انا اشتغل وبصراحة انا مش عايزة عشان هي مهنة لا يوجد بهاأحترام لأدمية المعلم أو مرتبها عدل و طبعا لازم ادي دروس خصوصية عشان الواحد يقدر يصرف علي نفسه وأغلب فلوس الدروس الخصوصية بيكون مدعي عليها من الأهالي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113918/http://www.20at.com/article2.php?sid=65"

[[comments]]
order = 3
subject = "حسبي الله ...... مافي للمعلم غير الله"
author = "الدوايمة"
posted = "2006-04-15"
text = "في البداية ليس لأنني معلم فقط أتحدث عن هذا الموضوع ولكن للأمانة الهدف من هذه المهزلة التي تصيب المعلم في الأردن بالأخص هي أكبر بكثير من الظاهر ..... لا عطل لمعلمي التربية لا احترام ولا قيمة ولا راتب محرز وبالتالي نفور من مهنة التعليم .الأللمدارس الخاصة وبالتالي خصخصة التعليم .وهو المراد ... بفكرونا شعب غبي ... لكن الحق مش على الوزارة وبس بل الق على الأهالي الي بسيرو مع اللعبة وهم مش داريين... اضغطو على أبائكم باحترام المعلم غصب عنه ومش بإرادته ..لأن الحرية الغربية التي جاؤوا بها ليذلونا ويهزموناما بدنا اياها بدنا الحرية الإسلامية العربية التي تدعو لإعتبار المعلم \"والد\" وليس شغيل واجبه يدرسك غصب عنه وللأسف هذا الصاير ...<br />وبالتالي أناادعو كل أب و رب أسرة أن ينتبه لهذا الأمر فهو خطير جداً........واصحى يا شعبناالأردني .زالقادم مؤلم أكثر من الوالحالي .... والسلام عليكم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113918/http://www.20at.com/article2.php?sid=65"

[[comments]]
order = 4
subject = "التعليم"
author = "طالبة"
posted = "2006-05-23"
text = ",الله يقع المدرسة الي انا فيها ليش؟ سوال يطرح نفسه<br />اولا المدرسات بيكرهن الواحد الدراسة الي جوزها ضاربها الي مخلفه الي فقعة فيها طنجرة ضغط<br />ثانيا ممنوع ناخذ حريتنا ورجاء ما حدا يحرجني<br />الطالبة اخلاص _عجلون _الاردن"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113918/http://www.20at.com/article2.php?sid=65"

[[comments]]
order = 5
subject = "المسؤولية"
author = "محمد"
posted = "2006-07-16"
text = "أقول لاخواني واخواتي اننا نتحمل نسؤولية كبيرة ويجب علينا الخروج من مستنقع التخلف الذي تعيشه الامة..<br />لازم نعلم ونتعلم وندافع عن حقوق المعلمين والمعلمات.<br />يا حكومتنا بالله عليكي حسني وضع المعلم خلي المسيرة تمشي..<br />والله أكبر ولله الحمد.<br />طالب جامعي."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102113918/http://www.20at.com/article2.php?sid=65"

