subject = "لكم دينكم و لى دينى"
author = "غاده"
posted = "2006-11-22"
text = "يا أخوانى فى البدايه انا أهنىء من انار الله قلبه لهذا الدين العظيم الهم ثبتك ونور طريقك و أعظم أجرك 0 يا أخوانى ربنا العظيم قال بسم الله الرحمن الرحيم ( من شاء فليؤمن و من شاء فليكفر) صدق الله العظيم فيا أخوانى يجب أن نعيش مع بعض فى سلام فأن الله و رسوله لم يضغط على احد للدخول فى الاسلام و قال الله ايضا( انك لا تهدى من احببت ولكن الله يهدى من يشاء) الهم اهدى كل مشرك بك و نحن نوحدك يا الهى العظيم لا نشرك بك شىء"
