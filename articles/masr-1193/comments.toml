posted = "2006-11-23"
text = "ليه نتضايق من الموضوعية والحياد الذي يناقش به الموضوع ..برافو ريهام وبرافو ولاد البلد على جرأتكم ..بلاش كل حاجة ندفن راسنا في الرمال بحجة عدم إثارة الفتنة...الفتنة موجودة ومثارة بالفعل وتجاهلنا لها يزيدها اشتعالا ...ربما لما نناقش الموضوعات بجدية وموضوعية...نحل كثير من الأزمات والحساسيات بين المسلمين والمسيحيين.."
