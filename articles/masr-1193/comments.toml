subject = "وماله"
author = "عمرو دياب"
posted = "2006-12-20"
text = "وماله ياست الكل...... مالمسلمين متسيطين مش بس محليا لا وعالميا انهم ارهابيين... كام فيلم اجنبي يطلع فية المسلمين ارهابيين وكام فيلم عربي طلع مسيحي واحد ارهابي .. مفيش... يتهمشوا احسن ولا يتبهدلوا.... واما عن التريقة او الستهزاء بالمسيحية ... برضة المسلمين يستهزء بهم اكثر كام فبلم عربي مفهوش ماذون واظنك عارفة ماذون في فيلم عربي............. او راجل يقول قال الله وقال الرسول وهو منحرف او ظالم او مجرم ... المسلمين اللي لازم يتنصفوا في الافلام وغيرة"
archived = "2006-12-22"
capture_url = "https://web.archive.org/web/20061222173319/http://masr.20at.com:80/article.php?sid=1193"

