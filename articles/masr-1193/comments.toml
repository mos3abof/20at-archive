[[comments]]
order = 15
subject = "مصرى مسيحى"
author = "للبيقولوا ان المسيحين بيتعلموا يكرهوا المسلمين"
posted = "2006-11-29"
text = "طبعا كلام فارغ لسبب صغير لو الكلام ده صحيح انهم بيعلمونا نكره الاسلام والمسلمين كنا لقينا واحد مسيحى يهجم على جامع او حتى زاوية او لقينا واحد مسيحى او جماعة تطلق على نفسها جماعة الاخوان المسيحين تحاول تقتل المسلمين او توصل للحكم عالشان تزل المسلمين<br />الكلام اللى بيحصل كله من اول اللى حصل فى الاسكندرية من قريب او اللى حصل قبل كده من اعتداء على الكنائس لاحداث الاقصر والاحداث اللى بقت مالية مصر ده كله يدل على حاجة من اتنين للاسف الدين الاسلامى مليان باحاديث الارهاب وايات الارهاب عالشان كده نادرا متلاقى واحد مسلم يطلع يقول كلمة حق بعد كل جريمة تحصل ضد المسيحين ودايما المسيحين همه الجناة يعنى دايما المسيحى الضحية هوه الجانى<br />واللى يقول ان اقباط المهجر همه اللى كرهوه فى المسيحين او ان همه السبب فى اللى بيحصل<br />شوفوا برضك المسلمين استكتروا على المسيحين الشكوة يعنى المفروض يضرب ويقول كمان اصلنا فى دولة حكمها الارهاب خلاص . واللى يجى يقول الشكوة برا مصر لا محسسنى ان فى حد عارف يشتكى جوا مصر وان لو طلعت مجموعة مسيحية وقالت اللى بيحصل واشتكت مش هيطلع الارهابين اللى بقوا مالين مصر بسبب الغير ماسوف على امره انور السادات ويقتلوه لانهم وبكل بساطة مينفعش يتحكم على المسلم بالاعدام لما يموت مسيحى اصله كافر اى عدالة عايزينها جوا مصر وبعدين مياخدش اعدام ياعم طيب يتسجن يطلع الرهابين ويقولوا مهم المسيحين عبيد لينا ودمه ونسائه وماله غنيمة لنا ازاى نتعاقب عليها<br />دا الوزير قال كلمة رايه الدنيا اتقلبت . بطلم تضحكوا على نفسكم"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210843/http://masr.20at.com:80/article.php?sid=1193"

