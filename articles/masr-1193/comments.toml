text = "أرسل هذا التعليق بواسطة :<br />عجبا للمسيح بين النصارى****والى اي والد نسبوة<br />أسلموة الى اليهودوقالوا****انهم بعد قتلة صلبوة<br />فاذا كان ماتقولون حقا****وصحيحا فأين كان أبوة؟<br />حين خلى أبنة رهين الأعادي****أتراهم أرضوة أم أغضبوة؟<br />فلئن كان راضيا بأذاهم**** فأعذروهم لأنهم وافقوة<br />ولئن كان ساخطا فاتركوة****واعبدوهم لأنهم غلبوة"
