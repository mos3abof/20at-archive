[[comments]]
order = 10
subject = "فعلا ...ليه يا ريهام"
author = "نيفين نيفى نوفا"
posted = "2006-11-22"
text = "ريهام ايه لازمه موضوع زى دا دلوقتى<br />و ف التوقيت دا بالذات<br />ايه لباغزمه مواضيع بتعمل فتنه و يتقلب الامر ف الاخر ان التعليقات بتبقى عباره عن ناس بتشتم بعضها<br />منهم اللى فاهم<br />و منهم اللى مش عايز يفهم<br />ومنهم اللى فاهم و بيستهبل<br />و منهم كدابين الزفه<br />و الناس المحتلرمه اللى بيغلطو ف بعض ير جعو يعتذروا<br />و المحصله ف الاخر صفر<br />مع اخترامى ليكى و لكل الناس اللى بتعلق<br />رجاء يا ريهام بلاش المواضيع دى<br />و مش بقوا اسلوبك الصحفى وحش و الله دا مش قصدى<br />انتى قلمك جميل و الموضوع نفسه كويس<br />يس صدقينى هتلاقى ناس من اصحابنا اياهم هتاخد من كلمات موضوعك دا وقود لنار انتى عارفه اكيد من المتسبب فيهاو المستفيد منها"
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210843/http://masr.20at.com:80/article.php?sid=1193"

