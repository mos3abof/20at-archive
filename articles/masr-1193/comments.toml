subject = "الى ريهام المصري – ولاد البلد:"
author = "بصراحه الموضوع جميل جدا ولكن يخساره المعلقين كلهم جهله وذلك لتعليقهم خارج الموضوع الأمر الذي يؤكد انهم علقوا قبل ان يقرؤوا الموضوع"
posted = "2006-11-22"
text = "ـــــــــــــــــــــــــــــــــ<br />وبعدين انا عايز اقول حاجه الاقباط هما اللي عملوا في نفسهم كده لما قيادات ا لكنيسة وجدت ان الاسلام منتصر لا محاله وان كل مصر منتقلون الى الاسلام لجأت الى الحيله والى المكر والى الخديعه وهو منهج للمحافظه على البقية الباقية من المسيحيين وهو تكريههم في الاسلام والقول بأن المسلمين غزاه وان المسيحيين هما اصحاب البلد الحقيقيين.<br />وفي العالي الاخ الذي روى قصة اسلامه يشهد على منهج التكريه في الاسلام وهناك عاليه مقال من الاخ ابو اسلام يبين ان اهل مصر الحقيقيين دخلوا كلهم في الاسلام"
