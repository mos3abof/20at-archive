subject = "قبطي يسرق كنيسة العذراء بالقليوبية"
author = "قبطي يسرق كنيسة العذراء بالقليوبية"
posted = "2006-11-22"
text = "أمر أحمد عزوز مدير نيابة الخانكة بحبس سائق القس «يسطس فانوس» راعي كنيسة العذراء بالقليوبية ٤ أيام علي ذمة التحقيقات سرق خزينة الكنيسة وبداخلها ٤٥ ألف جنيه، وادعي أن مجهولين اقتحموا الكنيسة وارتكبوا الحادث كشفت المباحث غموض الواقعة وأدلي المتهم باعترافات تفصيلية في تحقيقات النيابة.<br />قال المتهم غبريال نادر عزيز «٣٥ سنة» إنه يعمل سائقاً للقس يسطس فانوس «بطرس» راعي كنيسة السيدة العذراء «مطرانية الأقباط الأرثوذوكس» بمنطقة ورش أبوزعبل منذ أكثر من ٥ سنوات تزوج قبل عامين وأنجب طفلة، تطالبه الزوجة بمصاريف بالغة تفوق راتبه الشهري، حاول الالتحاق بعمل إضافي إلا أن الوقت لم يسمح له.<br />ذات يوم شاهد السائق القس يسطس ومعه ٣ آخرون من مسؤولي الكنيسة داخل حجرة مبني الخدمات الملحق بالكنيسة وقفوا أمام خزينة حديدية، بابها كان مفتوحاً تظهر المبالغ المالية منه.. وقف السائق علي باب الحجرة اتخذ قراره بالاستيلاء علي تلك الأموال عاين المكان والحراسة الأمنية علي الحجرة حدد طريقة الدخول عاد إلي منزله اتصل بالقس وأبلغه أنه مريض واستأذن في الراحة واستقر القس داخل منزله هو الآخر. توجه السائق إلي الكنيسة غافل حارس الحجرة ويدعي جاب الله غالي سليمان وكسر زجاج الباب الداخلي المفضي إلي الحجرة حمل الخزينة ووضعها داخل حقيبة سيارة القس وعاد إلي منزله خبأ الخزينة في جدار خزان الصرف الصحي بداخل منزله ولم يفتحها.<br />وأضاف المتهم أنه ارتكب الواقعة نظراً لمروره بضائقة مالية كما أن المبالغ التي شاهدها في الخزينة أغرته واعتقد أنها ستحل له كل مشاكله واستمعت النيابة لأقوال حارس الحجرة والقس الذي قام بفتح الخزينة وأكد سلامة الأموال الموجودة به<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210843/http://masr.20at.com:80/article.php?sid=1193"

[[comments]]
order = 1
subject = "أقباط مصر مسلمون لا نصارى !! وإليكم الأدلة"
author = "منقول من الانترنت"
posted = "2006-11-22"
text = "أقباط مصر مسلمون لا نصارى !! وإليكم الأدلة<br />بقلم<br />أبوإسلام أحمد عبدالله<br />Abuislam_a@hotmail.com<br />الحمد لله ، والصلاة والسلام على رسول الله 00 إن القضية التي سأتحدث عنها مباشرة، هي تلك الفِرية التي سموها (( فتنة طائفية )) ، والتي تموت وتحيا ، تم تموت ، ونحن لا نملك أي قدر من المعرفة حول مَن يُصدر القرار بموتها ، ثم مَن الذي يتولى ـ في كل مرة ـ مخاضها ؟‍‍! 0 إنها أزمة يعانيها سبعة وستون مليوناً من المسلمين المؤمنين بإله واحد ، وكتاب واحد ، وسُنَّة نبوية واحدة ، ينهل منها ملايين الفقهاء والعلماء والدعاة والمفكرين وطلبة العلم والدارسين والعوام في علاقتهم بأربعة ملايين نصراني ـ على أفضل تقدير ـ بنسبة 87,5% تقريبا من إجمالي السكان ، وينقسمون ـ فيما بينهم ـ إلى ما لا يقل عن أربعين ملة عقَدية في مصر وحدها !<br />وفي البداية ، أرجو رفْع التكاليف والحواجز النفسية والحساسيات المرهفة ـ تكتيكاً أو استراتيجيةً ـ إن أردْنا الوصول إلى حلول عملية لمشكلة تؤرِّق مضاجع السياسيين منذ غاب الإسلام العقَدي 0<br />تلك التي وجد فيها اللادينيون ( العلمانيون ) وسَقَط متاع الشيوعية وبقايا الماركسيين مستنقع ماء آسِن ، غاصوا فيها حتى أذقانهم ؛ ظناً منهم أن بها صفاءً أرادوا تعكيره ، ووجد فيها بعض العابثين من النصارى ـ المتطلعين إلى النجومية والشهرة ـ سيوفاً على رقبة الحاكم وحكومته ، يغازلونهم بلمعانها بين الفينة والأخرى؛ إثارة للرعب، أو لهواً بما هو ليس بلهو !0<br />نربأ بالعقلاء أن يزايدوا أو يروا في دفن الرؤوس كالنعام منجاةً من الخطر ؛ ففرض الحقائق ليس بحال طعناً ، أو إساءةً لاحد ، والحديث عن النصارى والنصرانية ليس مِنطقة ألغام كما يروجون فى أسماعنا ؛ لتخلو لهم ساحة الأمة ، فيعب<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210843/http://masr.20at.com:80/article.php?sid=1193"

[[comments]]
order = 2
subject = "قصة اسلام قبطي"
author = "منقول من الانترنت"
posted = "2006-11-22"
text = "قصة أسلامي<br />بسم الله الرحمن الرحيم<br />* الحمد الله على نعمة الاسلام نعمة كبيرة لا تدانيها نعمة لأنه لم يعد على الأرض من يعبد الله وحده الا المسلمين.<br />* ولقد مررت برحلة طويلة قاربت 40 عاما الى أن هدانى الله وسوف أصف لكم مراحل هذه الرحلة من عمرى مرحلة مرحلة:-<br />مرحلة الطفولة:- ( زرع ثمار سوداء )<br />* كان أبى واعظا فى الاسكندرية فى جمعية أصدقاء الكتاب المقدس وكانت مهنته التبشير فى القرى المحيطة والمناطق الفقيرة لمحاولة جذب فقراء المسلمين الى المسيحية.<br />* وأصر أبى أن أنضم الى الشمامسة منذ أن كان عمرى ست سنوات وأن أنتظم فى دروس مدارس الأحد وهناك يزرعون بذور الحقد السوداء فى عقول الأطفال ومنها: -<br />1- المسلمون اغتصبوا مصر من المسيحين وعذبوا المسيحين.<br />2- المسلم أشد كفرا من البوذى وعابد البقر.<br />3- القرآن ليس كتاب الله ولكن محمد اخترعه.<br />4- المسلمين يضطهدون النصارى لكى يتركوا مصر ويهاجروا..... وغير ذلك من البذور التى تزرع الحقد الأسود ضد المسلمين فى قلوب الأطفال.<br />* وفى هذه الفترة المحرجة كان أبى يتكلم معنا سرا عن انحراف الكنائس عن المسيحية الحقيقية التى تحرم الصور والتماثيل والسجود للبطرك والاعتراف للقساوسة.<br />مرحلة الشباب ( نضوج ثمار الحقد الأسود )<br />أصبحت استاذا في مدارس الأحد و معلما للشمامسة وكان عمري 18 سنة وكان علي أن أحضر دروس الوعظ بالكنيسة والزيارة الدورية للأديرة ( خاصة في الصيف ) حيث يتم استدعاء متخصصين في مهاجمة الإسلام والنقد اللازع للقرآن ومحمد ( صلي الله علية وسلم ) .<br />* وما يقال في هذه الإجتماعات :<br />1- القرآن مليء بالمتناقضات ( ثم يذكروا نصف آية ) مثل ( ولا تقربوا الصلاة ...)<br />2- القرآن مليء بالألفاظ الجنسية ويفسرون كلمة ( نكا<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210843/http://masr.20at.com:80/article.php?sid=1193"

[[comments]]
order = 3
subject = "ليه كده يا ريهام ؟؟؟؟؟"
author = "إبن بهية"
posted = "2006-11-22"
text = "بداية أود التأكيد على أن لي العديد من الأصدقاء المسيحيين وبنحب بعض جداً .. ثانياً لا أنا ولا أصدقائي السميحيين ولا أي مصري شريف يرضى بنشر مثل هذا الموضوع يا أخت ريهام .. ليه ؟؟؟ لأننا مش ناقصين حضرتك تدخلينا في حسبة برما وكام مرة المسيحيين ظهروا في الأفلام ؟؟؟ ويا ترى كام دقيقة ؟؟؟ إيه الكلام الفارغ ده ؟؟؟ حضراتكم عايزين إيه بالظبط من الموضوع ده ؟؟؟ يعني المفروض نحسب عدد المسيحيين في مصر ونشوف نسبتهم كام (6% وفق بيانات وزارة الخارجية الأمريكية) يعني لو عندنا فيلم فيه عشر ممثلين نخلي نص ممثل منهم مسيحي .. ولو الفيلم مدته ساعة ونص يبقى لازم نخلي فيه 6 دقائق جوه كنيسه .. إيه رأيكم في العبط ده ؟؟؟ المسيحيين يا ست ريهام عايشين جوا النسيج مش قاعدين في أطراف البلد هناك لوحدهم منعزلين عشان نفكر نعملهم أفلام عنهم والكلام الفارغ ده ؟؟؟<br />بعيدا عن نظرية المؤامرة الحقيقية تماما .. لكنها هنا لا تنطبق عليكي لأنك طيبة وماشية ورا أشياء غريبة بدون تفكير في مقاصيدها .. يا أخت ريهام مش لازم نكتب لو مش لاقيين موضوع حراق وحلو لمجرد الكتابة وبس .. يعني لما نعمل مواضيع عادية أفضل من عمل مواضيع ممكن تضر بلدنا .. أنا مش باهاجم حضرتك ولا شيء لكن حبيت أوضح ليكي بعض الأمور .. موضوع المحاصصة لكل فئة حصتها هذا موضوع صهيوأمريكي لتفتيت بلادنا كلها وعشان كده بنكره كمصريين كلنا الغباء والعمالة والخيانة التي يقوم بها بعض من يسمون أنفسهم أقباط المهجر الذين يتلقون تمويلهم من الموساد .. حكاية الحصص دي لازم نبطلها .. ولا نتكلم فيها خالص لا مسلمين ولا مسيحيين لأسباب كثيرة أهمها وأشدها فتكا أنها تؤدي إلى تقسيم المجتمع المصري الواحد المتجانس رغم أنف اللي خلفوهم ..<br />من ناحية تانية .. لو حضرتك ماشية في الشارع ممكن<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210843/http://masr.20at.com:80/article.php?sid=1193"

[[comments]]
order = 4
subject = "كلمة أخيرة بس برضه طويلة شوية"
author = "إبن بهية"
posted = "2006-11-22"
text = "أنا كتبت الرد السابق الطويل أوي بسرعة وكان ناقص بس ملاحظة بسيطة لإخواني الشباب المسيحي اللي مشحون أوي ضد الإخوان المسلمين وكأنهم لو حكموا سيشنقوا كل مسيحي .. يا شباب الكنيسة عيب يكون فكركم بالسذاجة دي .. يا ريت تراجعوا وتقرأواالتاريخ كويس وتشوفوا المسيحيين كانوا عايشين ازاي في مصر طول القرون الماضية التي حكم مصر فيها حكام مسلمين بجد مش هفق زي ما حضراتكم راسيين .. شوفوا لاقدس الشريف كان إيه قبل ما تتلخبط الأمور فيه بالصهيونية .. شوفوه كان عامل ازاي تحت الحكم الإسلامي .. شوفوا الكلام ده بلسان وأقلام المسيحيين مش المسلمين .. حكاية فوبيا الإخوان اللي شغالة دي مش صح لأنكم من الأساس ما جربتوش حكم الإخوان مطلقا من قبل .. كمان ما قرأتوش تاريخ الحكام المسلمين العادلين في بلادنا الإسلامية وكيف كان يحيا إخوانا المسيحيين تحت ذلك الحكم .. بلاش تسيبوا ودانكم للي عايز يخرب البلد ... سواء حكم الإخوان ولا ما حكموش الكلام ده راح يبني بينكم وبين المسلمين كلهم في مصر سد كبير .. يكبر ويكبر كمان على مر السنين سواء حكم الإخوان أو ما حكموش .. فكرتي مفهومة ؟؟؟<br />أرجوكم يا جماعة الموضوع ده حساس جدا وبلاش نسيب ودانا للعدو عشان يعبي في دماغنا أفكار مسمومة عن طريق أعوانه في الداخل من كتاب كلاب مناجيس من المسلمين والمسيحيين على حد سواء .. مصر نسيج واحد حكما الإخوان ولا غيرهم فلا يفترض أن تنتحر مصر أو تسلخ حتة منها عشان خايفة من كده .. الكلام ده عيب .. مش المسيحيين دلوقتي اللي عندهم مشكلة مع النظام .. أعتقد أننا جميعا تحت مصيبة كبيرة .. وأكاد أجزم بأن النظام القذر بقوادة مبارك الواطي يحيا ويقتات على الفتنة الطائفية .. مرة يولعها ومرة يهديها .. تقولش العيال دي عرايس من بتاعة المرحوم شكوكو يحركها النظام الق<br />اقرأ بقية التعليق .."
archived = "2006-12-05"
capture_url = "https://web.archive.org/web/20061205210843/http://masr.20at.com:80/article.php?sid=1193"

