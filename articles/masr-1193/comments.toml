[[comments]]
order = 18
subject = "يا خساره والف خساره"
author = "المصرى الحزين"
posted = "2006-12-08"
text = "هذه الكتابات كشفت روابط وعوامل مشتركه بين بعض المسلمين والمسيحيين وهى درجة السفاله وقلة الادب وطول اللسان وعدم التربيه والانحطاط الاخلاقى والادبى والله انا حزين واعتقد ان كل من يخاف على هذا البلد او عنده ره من ضمير ايضا حزين ولن يرتاح هؤلاء الا بعد ان يروا مصر كومه من الرماد افيقوا يا عقلاء البلد السباب والشتائم ليست فى صالح احد ابحثوا عن اسباب الخلافات والمشكلات وفكروا فى حلها<br />بدلا من ترك الساحه لعديمى الادب والدين<br />اصحاب اللسان الطويل"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214129/http://masr.20at.com:80/article.php?sid=1193"

[[comments]]
order = 19
subject = "الى كمال ابو العزايم"
author = "سمير المصرى"
posted = "2006-12-11"
text = "بصراحة يا اخ كمال ابو العزايم انت واضح انك راجل عميل مدفوعلك لخراب البلدوكمان متربى فى بلاعة يا راجل دى الفاظ يكتبها راجل محترم وربتة سيدة فاضلة اشك فى كدة بصراحةواضح ان حضرتك عندك مشكلة مع سيدات عائلتك ومش قادر تحكمهم ومجبر يا حرام انك تكون قواد<br />لانك الارجح تكون شاز وفى عند حضرتك مرض عضوى الافضل انك تتعالج منة لان<br />كدة حتتعبك جداوعشان المرض دة انت بتشغل حريمك فى الحرام والعياز بللةاتقى ربنا يااخى وحافظ على شرفكولا تكون مثل الديوس صحيح القافلة تسير والكلاب تعوى اخس عليك وعلى شرفك المتنازل عنة وزلك نظير ثمن ايها القواد كمال ابو العزايم"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214129/http://masr.20at.com:80/article.php?sid=1193"

[[comments]]
order = 20
subject = "قصيدة فتح عينك تاخد جايزه"
author = "محمد المصرى"
posted = "2006-12-11"
text = "لحد وقت قريب كنت فاكر ان الكوسه والقرع من اهم المحاصيل اللى بتتميز بيهم مصر اما بعد ماقريت خبر حصول سيدة مصر الاولى<br />سوزانكو على جايزة حقوق الانسان من برلين بالمانيا قلت فى عقل بالى بركاتك يا مبارك انت ومراتك حلت على الكره الارضيه بحالها وكنت اتمنى ان سوزان هانم تاخد معاها ( رمضان التوربينى ) وكمان بقية الشله بقو .. وبزازه ... وحماطه والسويسى اشهر عصابه لقتل واغتصاب الاطفال والمراهقين<br />ليكونوا شاهدين وخير دليل على جهودها هى وجوزها والمحروس الصغير جيمى بيه من اجل الشعب المصرى وحقوق الانسان وبالمناسبه كتبت قصيده جديده اهديها برضه لعمنا احمد فؤاد نجم وجميع الشعب المصرى الغلبان<br />فتح عينك تاخد جايزه<br />مليون جايزه كمان لو عايزه<br />بص يا محسن وانتى يا فايزه<br />ماما سوزان قال اخدت جايزه<br />جايزه لحقوق الانسان<br />المصرى المهرى الكحيان<br />هى وجوزها التور ابو ودان<br />ضحكوا على عقل الالمان<br />سافروا على العاصمه برلين<br />على حسابنا يا مستمعين<br />سايبنا عرايا وجعانيين<br />نستنى معونه واحسان<br />ارجع مصر يا ابن الهرمه<br />وهات القرشانه بنت الصرمه<br />خلى فى وشكوا حبة حشمه<br />دا بكره المستخبى يبان<br />وشوبش يا حقوق الانسان"
archived = "2006-12-17"
capture_url = "https://web.archive.org/web/20061217214129/http://masr.20at.com:80/article.php?sid=1193"

