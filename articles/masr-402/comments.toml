subject = "بيب بيب"
author = "مهزلة"
posted = "2006-06-01"
text = "بيب وطنى تيت اخوان توت كفايه<br />الحزب الوطنى اقصد الوطنيون الوحيدون فى جهمورية مصر العالمية على راى الاستاذ اللمبى يفهمون احسن منا فهما اللى عرفين امتى نتحرك للاصلاح و امتى نوقف والله الذى نفسى بيده مش عاوز اقول مين ابن الفكيكة اللى قال ان الشعب ده مش فاهم يعنى ايه ديموقراطية وفضحنا فى بلاد الفرنجه وخلى بوش يتهمنا ويفكر يعملها معانا زى بتوع العراق<br />تيت اخوان<br />المهم كلام فى سرك لو مسكوا اللى احنا عرفينه هيبقوا اخوان وكلام تانى حاسس برضه بمصيبة .......... يا لطيف يا لطيف<br />نوت توت كفايه<br />الحركة دى انا قلبى حاسس انهم عملاء للنظام و نفسى اعرف مين اللى بيمولهم مع عذرى على الفاظى بس ده راى وهنا مساحه حرية وعجبى<br />الديموقراطية معناها انك يكون لك راى وخلاص سواء صح او خطأ<br />الديموقراطية معناها انك يكون لك صوت حتى فى قسم البوليس<br />الديموقراطية معناها انك يكون لى خصمك صوت فى وشك حتى لو خطى ويسعى مثلك لتحقيقة بشتى الطرق القهرية ( بيان للسلطة المصرية)"
