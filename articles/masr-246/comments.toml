subject = "بس بس"
author = "بتنجان"
posted = "2006-05-02"
text = "ايه يا اسطى.. موش عارف اللي دخل فلسطين في خطاب عيد العمال..<br />اصله طلع خطاب عبد الناصر يا فالح<br />انا اتخنقت من الاخوة المعلقين اللي داخلين يتفرجوا ع الصور دول<br />ارحمونا انتوا شوية.. وشا ريت ترحمونا شويتين تلاتة.. كتكوا نيلة مليتوا الانترنت<br />جاليلك يا ضلمة.. ابقى حصلني على هناك"
archived = "2006-05-05"
capture_url = "https://web.archive.org/web/20060505044444/http://masr.20at.com:80/article.php?sid=246"

