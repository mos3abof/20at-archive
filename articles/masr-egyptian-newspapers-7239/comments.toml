author = "قرن غزال"
posted = "2007-10-02"
text = "لاعز ولا حزبة او حكومتهم قادرين على فتح المجال للاستثمارات الاجنبية الكبيرة لدخول البلد والتذرع بحجج واهية زى الامن الوطنى ودة طبعا مش صحيح بس هما مصالحهم الشخصية تبقى كدة ولا يعنى واحد زى رجل الاعمال الهندى لكشمى على فكرة دة من العشر ة اغنى اغنياء العالم وشارى مصانع حديد تقريبا فى الخمس قارات ياما مشاركة اوملكية كاملة ودة طبعا لما يستثمر عارف هو بيعمل اية لكن الضروف عندنا فى مصر مختلفة عن جميع دول العالم يعنى علشان تدخل مجال معين لازم تدفع ارباحك عن المشروع اللى حتعملة مقدما رسوم ورش والذى منة وطبعا الكلام دة مبيمشيش عند الشركات العالمية الناجحة"
archived = "2010-02-14"
capture_url = "https://web.archive.org/web/20100214023359/http://www.20at.com:80/masr/egyptian-newspapers/7239.html"

