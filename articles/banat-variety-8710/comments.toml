author = "محمد نواف الحمدالله ..."
posted = "2008-04-08"
text = "القانون = تنظيم، وترتيب، وتوجيه، وضبط الحياة على كافة الجوانب، وعلى مختلف الناحي والمناحي الإجتماعية، والثقافية، والعلمية، الصحية، البيئية، .. الخ<br />بإختصار (( القانون )) يعبر عن حياتنا …<br />أنا طالب سنة أولى قانون _ جامعة الشارقة _ الإمارات العربية<br />على رااااااااسي شباب وشابات القانون ..<br />تحياتي للموضوع المميز ..<br />وبالتوفيق للطلبة وطالبات القانون أين ماكانوا .. وبأي جامعة كانوا .. وللجميع _ بإذن الله _ .."
archived = "2010-01-16"
capture_url = "https://web.archive.org/web/20100116164927/http://www.20at.com:80/banat/variety/8710-2009-11-04-13-15-08.html"
