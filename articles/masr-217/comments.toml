[[comments]]
order = 0
subject = "حرام عليك ياحسنى"
author = "حرام صغير"
posted = "2006-04-24"
text = "نته لسه عايز تعمل فين ايه ياحسنى خاف ربنا 3 مشاهد 1 انفجارات دهب وباعت الياهود يسعدو وهم الى عاملوها حرام عليك حاكم ظالم حسبى الله ونعم الوكيل فيك ضمرة الشباب دمرتهم والله لو ليه سلطه لحكمتك بس الوهاب موجود"
archived = "2006-05-02"
capture_url = "https://web.archive.org/web/20060502172924/http://masr.20at.com:80/article.php?sid=217"

[[comments]]
order = 1
subject = "انفجار دهب"
author = "ارهابى فى مصر"
posted = "2006-04-24"
text = "كل الحكايه عن حاكم ظالم اسمه حسنى مبارك ريس شعب مصر المضمرين من ووزوجته مدام سوزان الله يخرب بتهم وحد يسرق والتنيه تقول الاطفال وهى بدمرهم حسبى وةالله ونعمه الوكيل فى الظلمه وبعدين يجيبو ابنهم جمال وننوس مام اكل الكول موش حرام عليك ياظالم والله انا من عارف اشتغل حاجة بسببك"
archived = "2006-05-02"
capture_url = "https://web.archive.org/web/20060502172924/http://masr.20at.com:80/article.php?sid=217"

[[comments]]
order = 2
subject = "الا ان نصر الله قريب"
author = "محمد"
posted = "2006-04-25"
text = "ان نهاية كل ظالم باتت واضحة على النظام المصرى لان الاستخدام المفرط للقوة هذا اقصى ما فى يد اى نظام فاشل وظالم بل لم يعد يخفى على احد مثقف او من العوام ما فى مصر من فساد تحمية الحكومة او تقوم بة الحكومة لذالك فنهاية الظالم وحاشيتة باتت قريبة جدا وهذا هو التخبط الذى يسبق السقوط"
archived = "2006-05-02"
capture_url = "https://web.archive.org/web/20060502172924/http://masr.20at.com:80/article.php?sid=217"

