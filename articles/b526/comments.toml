text = "لاتستغربوا من تعليقي ربما هو يختلف عن ماتنتظرونه كلكم لكنني من فرط حزني لم اجد سوى هدا المنبر لاقول للسيدة هباري ام خليفة اتقي الله سوف تسئلون من هي هباري ام خليفة انها فتاة جزائرية منذ 5شهور وهي تطارد زوجي للزواج بها رغم انها تعلم انه متزوج من ثلاث وهمها الوحيد هو المجيء لمصر للعيش فيها. انها منتهى الانانية ان تدوس على ثلاث قلوب لهدف العيش في مصر. وافظع من ذلك انها تقول على من تريد الارتباط به انه عجوز لايصلح للزواج ان كان كذلك فلمادا تطاردينه ليلا ونهارا.<br />اناشدكم الله ان تبلغوا هباري ام خليفة ان تبتعد عن الرجل الدي ياوي ثلاث اسر لا معيل لهم سواه فوجودها سيدمر ثلاث اسر قولوا اتقي الله عنوانها هو- هباري ام خليفة ص-ب رقم 17 تنيرة سيدي بلعباس 22000 الجزائر ورقم هاتفها هو 0021378929406<br />ساعدوا الزوجات الثلاث من فضلكم قولوا لها حرام ما تفعلينه"
archived = "2006-11-02"
