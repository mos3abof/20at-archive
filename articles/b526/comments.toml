subject = "oosama"
author = "من زمان ما دخلتش لموقع عشرينات الذى أحبه جداً هيييه...والله زمان!!"
posted = "2006-06-07"
text = "تعرفوا الموضوع ده بالذات جذبنى ليه؟؟<br />لأنى من أكثر من ثلاث شهور أبحث عن فتاة متدينة أرتبط بها؟؟<br />الأمر المثير للضحك والبكاء والضيق والدهشة والعجب والغرابة وغير ذلك كثير فى آن واحد؟<br />أننى كنت أتوقع فى بداية الرحلةأن المتدينة كما نقرأ فى الكتب لا تسأل عن شىء سوى الدين ولو عاشت على حصير كما عاشت السيدة فاطمة بنت رسول الله صلى الله عليه وسلم ...ولكن الواقع الذى لمسته وألمسه حتى لآن مغاير لذلك تماماً..لدرجة أن إحداهن وهى متنقبة؟كان من شروطها المقدسة أن تعيش فى المدينة لأن حياة الريف لا تروق لها!!<br />وأنا أرى أن الإعلام له الدور الأساسى فى ذلك فى كل المسلسلات والأفلام والأعمال الفنية يتم التصوير فى فلل وقصور ويكون فى الفرح فى أفخم النوادى ...الخ؟<br />كل ذلك صنع صوراً خيالية لدى الشباب تختلف عن الواقع بدرجة180درجة..<br />الموضوع جيد جداً وأرجو أن يناقش بصورة أوسع والسلام عليكم ورحمة الله وبركاته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134311/http://www.20at.com/article2.php?sid=526"

[[comments]]
order = 33
subject = "عريس من جهة استفهامية"
author = "ساسو"
posted = "2006-06-18"
text = "مساء الخير اعضاء الموقع والله كلمكم جميل بس محدش فكر لية احنا بقينا بنقول عريس لقطة خلنى اشرحلكم الجملة دية بقينا بنقولها لية مش بسب الاهل والله الاهل لو شايفين ان العريس دة كامل ولو واحد فى المية مش حيقول لة فى الزمن دة ودة لعدة اسباب منطقية جدا ولازم نعمل حسلبة مش بس البنات ولكن اكتر الرجال علشلن الحياة مش بتمشى وتستمرا من طرف واحد يحلم كل شاب وفتاة بدخول عش الزوجية, لكن متطلبات الزواج المادية ترهق كاهل الشباب الذين يحلمون بتحقيق ذاتهم خاصة مع انكماش سوق العمل أمام حاملي الشهادات الذين يعولون على تعليمهم لإيجاد فرص عمل تتناسب مع اختصاصهم, وفي أيامنا هذه تتعدد الأسباب التي تحول دون الزواج<br />وإذا كنا نشكو من الزواج المبكر فقد أصبحنا نعاني من تأخر سن الزواج والغريب في الأمر أن الشباب المثقف الذي حمل شعار محاربة الزواج المبكر في مجتمعنا وكشف مساوئه هو نفسه ضحية مشكلة تأخر سن الزواج ولكن لأسباب خارجة عن إرادته فماذا عن الشباب الذين تجاوزوا العمر المناسب للزواج ولم يتزوجوا? ما أسباب عزوفهم? وما هي مسوغاتهم أن تأخر سن الزواج يرجع لمجموعة من العوامل أهمها: الأسباب الاقتصادية والتعليم وتغير نمط الحياة وتعقيد متطلبات تكوين الأسرة وغيرها, كما نجد أن لارتفاع سن الزواج محاسنه من قبيل وضوح خيارات كل من الشريكين ونضجهما الاجتماعي والعاطفي وأخذ الفرصة لتأمين منزل وغيرها من المتطلبات, ويمكن أن نعتبره أمراً طبيعياً بالنسبة للاتجاه نحو تطور المجتمعات بشكل عام يعنى من الاخير مش عريس وخلص‏"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134311/http://www.20at.com/article2.php?sid=526"

