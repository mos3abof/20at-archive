[[comments]]
order = 29
subject = "أبعاد أخرى في قضية اختيار شريكة الحياة"
author = "باحث بإصرار وصبر ويقين"
posted = "2006-05-27"
text = "بينما يغرق البعض في شكاوى مغالاة الأهل في المطالب المادية لضمان \"استقرار\" الزوجية, يتضاعف تعجبي وتزداد دهشتي لهذه المبالغة الغريبة كمقابل غير منطقي لتواضع مستوى الفتاة العربية المعاصرة اجتماعياوتضاؤل قدراتهاالشخصية كزوجة وحبيبة وأم وحليفة مستقبلية لنحو 30 عاما من الشراكة في بناء أسرة جديدة في ظل تلك الأخطار البيئية والاجتماعية المتزايدة من جهة وضحالة مصادر ثقافة تلك الزوجة المنشودة ومهاراتها العملية أو التربوية من جهة أخرى..<br />ومصدر تشككي الأساسي هو الأسرة ذاتها التي أفترض أنها مركز التدريب الابتدائي لتكوين القاعدة الإنسانية الأساسية التي سترتكز عليها شخصية تلك المرأة القوية تحسّبالقدرتها على مواجهة صعوبات عالمنا المتزايدة وإخطاره.. وأرى بإسرتهاأسباب قلق لا يخفى على أحد: بين والدين دائمي الشجار والمنافسة الخشنة, يوجهان 3/4 جهدهما خارج المنزل لجلب الأموال إليه وتأمين مصروفاته التي تتضاعف أيضا بازدياد أوقات عملهما, كما تزداد احتمالات خطر ابتعادهما عن مركز حياة ابنتهما إنسانيا وتربويا حتى اضطرارها إلى البحث عن المثل الجدير بالاحتذاء به خارج مثل تلك الدار, مع ما يصاحب ذلك من مغامرة ومخاطرة لا تخلو من الآثار الضارة المهددة بل أحيانا المدمرة..<br />ويتقدم قلقي بإدراكي لتقصير المدرسة الحديثة الأشبه في تكوينهابالمسرح إذ لا تفتقر أحياناإلى الكوميدياوغالبا إلى التراجيدياأيضا, بين فقر علمي تجريبي إلى تمزق إداري وفراغ تربوي وكم هائل من بؤر الفساد الأخلاقي المعدي يدرك الجميع خطورتهابالإجماع لكنهم يتفقون أيضا على تخطي ذلك اليقين بازدواجية محيرة , وكأنه مجرد حلم لا يؤثر في مستقبل الفتاة..<br />وتأثير باقي تضاريس البيئة من ناد مرتغع المستوى إلى مقاه المنطقة وشوارعها يضاعف خوفي وفزعي ولا يوحي بأي ثقة أو بريق أمل.. إذ أن خطر الصحبة يتزايد منذ الابتدائية (حيث تجارب التدخين الجماعية الأولى مثلا) مرورا بالإعدادية والثانوية والجامعية دون الخوض في التفاصيل المثيرة , لدراية الجميع بها دراية تامة.<br />وأفتقد ذلك الجو الذي عهدناه في طفولتنا وقرأنا عنه في كتابات السباعي ونجيب وإدريس وغيرهم.. وغمرته جرأة الإعلانات الاستهلاكية للتلفيزيون والسينماوالمسرح ومجون الوسائل الإعلامية الحديثة والالكترونية البديلة.. حتى أن الفتاة المسكينة تكاد تخلو تماما من صفات حضارية أساسية مثل إجادة القراءة والكتابة الحرتين رغم انكبابها بعصبية وتشنج ومنذ الأسبوع الدراسي الأول على استظهار المناهج الدراسية المنحصرة بين دروس خصوصية ومجموعات تقوية وتلقين خرفي لصفحات المناهج بمختلف المواد الدراسية, استعدادا للحصول على أعلى الدرجات بأي طريقة وبكل وسيلة مهما غلى الثمن واضطربت المثل..<br />ولا أريد أن أسترسل في تحليل البنية النفسانية أو العقلانية للفتاة المسكينة بعد قضاء 16 عاما من فصول تلك المسرحية محكمة الانغلاق الثقافي وانعزالها تماماوتفردهاعن مثيلاتهافي بقية أنحاء العالم.. لأننا جميعا نعرف تفاصيل ذلك خير المعرفة, ونلمس نتيجته وآثاره جيدا في جميع نواحي المجتمع وليس فقط في ما يعرضه التلفزيون يوميا أكثر من 4 مرات لمن يريد..<br />والحقيقة قد تدعو لدهشة وحزن بل إلى يأس واستسلام.. لكني مثل كثيرين من الباحثين عن شريكة الحياة, الذين يمضون أكثر من 10 أعوام ثمينة بحثا عنها بصبر جميل ودقة لا تهن ولا تكل , لا يفارقني أمل بالغ ويقين قوي من تحقيق ذلك الحلم التقليدي رغم كل الصعوبات : حلم العثور على أليفتي الشاردة التي نجحت بقوة إرادتها الشخصية (وربما بدعم من أسرة مستنيرة مباركة وتوفيق خاص من رب العالمين) في استنباط الطريق الخفي بالمرور حول تلك المشاكل دون الخوض في تفاصيلها, بل ربمابمعاونة الكثيرات على التغلب عليها والمساعدة الفعالة على حلولها في كافة مراحلها..<br />مثل تلك المرأة أنشد وخلفه ينطلق بحثي بصبر قد يطول 10 أعوام أخرى إذا لزم الأمر.. فادعولي ولها بالتوفيق! والله موفقنا وملهمنا جميعا!<br />قولوا معي آمين!"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134311/http://www.20at.com/article2.php?sid=526"

