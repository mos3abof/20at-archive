[[comments]]
order = 10
subject = "الا دموعك انت"
author = "هبهوب"
posted = "2006-03-07"
text = "عشانك انت بس يا سويتي .اميلي وصلك علي اليااااهو يا جدعان انا خلاص جالي شلل نصفي علي الياهو افضل وارجو رسالتي تكون وصلتك اللي بعتها . هي ممكن مش وثيقه بالموضوع اوي بس عجبتني<br />.قالت أيسمو الشعر في **** دنياك عن أوصافنا؟<br />ويعز يا من تنسج الأشـ **** ـواق عن أشواقنا؟<br />يا شاعر الآهات لم نسمـ **** ـمع حديث غرامنا؟!<br />تشدو به فيذيب بالأ **** لحان مُرّ جراحنا<br />أنسيت أيام الرضى؟ **** ونسيت عذب كلامنا؟<br />أنسيت ترنيم القصا **** ئد في ربوع صفئنا؟<br />فأجبتها – متلطفا - **** حقا ذكرت ولا عليك<br />فلكم ركضت وراء **** أحلامي لألمح مقلتيك<br />فلقد أرى في الهدب **** رسم بشائر مما لديك<br />والقلب – يا من تعتبين **** عليّ- كم يرنو إليك<br />ويغار - لا تستنكري ما **** قلت – حتى من يديك<br />لما تلامس يا فتاة **** الحسن وردة وجنتيك<br />لكنني بشريعتي **** أحيا على درب اليقين<br />أنا لاأدافـع حين أنشد **** عن قلوب الوالهين<br />فقلوب أهل الشعر لا **** تخشى الصبابة والأنين<br />والقلب حين تناله الأشـ **** ـواق يحرقه الحنين<br />أناعاشق للقمة الشمـ **** ـاء للحبل المتين<br />لكتابي السامي ويكفيـ **** ـني به شرفا ودين<br />فتراجعت والأدمع **** الخجلى على وجناتها<br />وعيونها الكحلاء تنظـ **** ـر في سجل حياتها<br />رسمت أمامي صورة **** الآلام من زفراتها<br />وتكلمت والصدق يسبقـ **** ـها إلى كلماتها:<br />أنعم بقصدك فاسم **** للعلياء من طرقاتها<br />وارحم مشاعر أمة **** تبكي على فلذاتها<br />إنا سنعلنها فما نهـ **** ـوى الشباب التائهين<br />نهوى شبابا أريحيا **** يرتدي ثوب القين<br />ويرد عن أوطانه بالعـ **** ـزم كيد الخائينين<br />نهوى شبابا شاعريّ الحـ **** ـس موفور الحنين<br />متوقد العزمات ذا شـ **** ـرف وذا خلق ودين<br />يعلو بدين الله في **** صف الرجال الخالدين<br />ومضت وفي عينيّ أشتـ **** ـات من الصور العجيبة<br />قلبي يهيم بها وعقلي **** قد سما عن كل ريبة<br />وظللت يصرع فكري **** السامي أماني الغريبة<br />ومشاعر الإيمان تسقي **** ارض أحلامي الخصيبة<br />فمضيت أدعو أمتي **** لترد أوطاني السليبة<br />يا أمتي ... سيري ، فكـ **** ـأس النصر دانية قريبة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134311/http://www.20at.com/article2.php?sid=526"

