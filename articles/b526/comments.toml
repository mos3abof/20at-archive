subject = "مين اللي قال ان الصفر علي الشمال مالوش لزمه؟"
author = "هبهوب"
posted = "2006-03-06"
text = "هي\" بحبك يا واد هتشوف بابا امتي بقي ؟<br />هو: وانا كمان بس اعمل ايه في الكام صفر بتوع ابوكي دول.<br />هي: ولا يهمك يارب حياتنا كلها \"صفار في صفار\".<br />بعد الجواز.<br />الاكل بيض \" بصفاره \" وعيد الجواز في شهر \"صفر\".<br />ضحكتني يا اكرم وراي في الموضوع دا مخصوص سخثي وهقوله لصخابي البنات اللي في الموقع وبس \" نفين \" وسويت برنيس \"<br />وهديكوا اشاره روحوا شوفوا قصيده \" بين الهوي والعقل لعبد الرحمان العشماوي. وخلي ايامك حب في حب"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134311/http://www.20at.com/article2.php?sid=526"

