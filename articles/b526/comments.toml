order = 0
subject = "انا زهقت من الموضوع دا"
author = "هبهوب"
posted = "2006-03-05"
text = "يووه بصوا محدش بيتجوز مرات غيره . وربنا يكون في عونه من الاخر .وبعدين يعني اخر ما اغلب هعمل زي خالتو. ايه يا بشر الموضيع دي , الي تحب وحببها يسبها \" يا وحش انت \". واللي تتجوز واحد مطهقها في عشتها واللي قرفانه من الجواز اصلاً \" البت سالي \" لما كانت كاتبه الراجل دا هيجنيني \". ايه يا بشر . انا عايزه \"ادهم صبري\" من الاخر .اوعوا تعملوا زي ماما وتسالوني هو مين وابن مين . ارجع برده واقول محدش بيتجوز مرررات غيره . وسمعين زغروده يا حببتي ."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134311/http://www.20at.com/article2.php?sid=526"

[[comments]]
order = 1
subject = "اتخنقت ونفسي افضفض شويه"
author = "sweet_princess"
posted = "2006-03-06"
text = "بجد بجد انا اتخنقت من الاهالي واسلوب تفكيرهم في العريس المتقدم ومستواه المادي اللي كان في الخمسينات والستينات لما بيبقى عنده شقه (ايجار )كان بيبقى لقطه ومافيش زيه((وياحبذا)) لو كان عنده عربيه نص عمر يبقى هو دا العريس اللقطه اللي( وقع من السما).<br />اما لو كان انسان بسيط (ولسه بيقول يا هادي)يبقى (((كحيان)))ومايصلحش لطلب ايد الهانم بنتهم مع انها ممكن يكون(ضاربها السلك) هي كمان.<br />اما في زماننا دا :<br />لو ماكانش عنده شقه تمليك وعربيه فخمه (ونايم على خميره حلوه في البنك ..... يبقى يحنن يا حبيبي .... مبسوطين منك اوييييي وعاوزين عرض قفاك).<br />انا حقيقي بستغرب على الاهل اللي بيغالو في المهور وبعدين يشتكو من ارتفاع معدل العنوسه في مصر.<br />لكن بالرغم من دا بلاقي برضه بعض الناس (وهما قليلين للاسف)عقلهم نضيف وبيفكروا صح.<br />ودا اللي حصل معايا :<br />لما محمد خطبني مالقيتش التشدد دا من مامتي واخويا بل بالععكس كان فيه تفهم للموضوع بالرغم من اننا لسه بندرس انا وهو (لكن والدتي قالت ان اهم شيئ هو الاخلاق والدين)وطبعا دي كانت معروفه بحكم انه صديق اخوياوزي ماقلت قبل كده للاسف الشديد جدا نادر لما بلاقي حد كده.<br />المشكله اللي لمستهاان لازم كل شيئ يبقى ع الجاهز وان البنت (ماتتمرمطش )على حد قول الناس اللي عندهم بنت وهتتجوز .<br />لكن لو افترضنا جدلا انها هتتمرمط: (فيها ايه لما نتعب ونسافر ونروح ونيجي ونتمرمط واحنا لسه صغيرين...؟)نفسي افهم فيها ايه....؟!!!!<br />ولعملمكم بقى كلمه دايما بسمعها من جدتي:<br />(اللي بييجي بالساهل بيروح بالساهل).<br />وبعدين البنت لو تعبت مع الانسان اللي ارتبطت بيه في بداية حياتهم سوا واتحملت وفضلت تشجعه هيفضل فاكرهالها ويحطها في عينيه.<br />واخيرا هو الموضوع كبير وانا لو اتفتحت في الكلام (مش هبطل رغي).<br />لكن زي ماعمرو خالد ... ثم هبهوب قالم:<br />ماحدش بيتجوز مرات حد غيره.<br />اللي مكتوبالك هي اللي هتتجوزها(وتقعد في ارابيزك طوووووووول العمر ).<br />ولو فيها غلاسه يعني (انا بوجه همسة عتاب لخالتي وكل اللي بيفكروا زيها....حرام يا خالتي البت هتموت ع الواد سيبيها تتجوزه ومش ضروري العربيه طالما في شقه (وبعدين ماحدش بيبات من غير عشا ).<br />لكني عارفه مسبقا ان كلامي (ولا حياة لمن تنادي).<br />لكن في النهايه هدعي برضه (ربنا ياخدك وينتقم منك بعدله ....ياللي في بالي ضيعتنا اكتر ما احنا ضايعين وعمال تبيع في شركات البلد بدون وجه حق(وماخفي كان اعظم....(دعوة مدموزيل مخنوقه منك)(((خد من قلبي وصر))).<br />وختاما دا رايي المتواضع جدااللي ممكن كتير يتفقوا معايا فيه ...وكتيييير جدا هيختلفوا معايا.<br />يا ترى يا (سيد اكرم )الموضوع دا برضه ماشي في دمياط )وللا الناس هناك عندها ((عقل))؟ .<br />عشان الواحد يقولها بالفم المليان (لو لم اكن دمياطيه لوددت ان اكون دمياطيه) .<br />الكلام اللي حكيته دا عن تجربه شخصيه ومواقف حصلت قدام عيني وياريت لو حد حصلله موقف يحكيه.<br />ياللا سلام."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134311/http://www.20at.com/article2.php?sid=526"

[[comments]]
order = 2
subject = "المشكلة مش في دمياط المشكلة في العنطظة المصرية"
author = "أكرم"
posted = "2006-03-06"
text = "تعرفوا انا كنت في رحلة البحث عن عاملات نظافة لمصنع لاحد اصدقائي و بالفعل روحنا لمكتب توظيف عماله لاقينا كل دبلومات التجارة طالبين وظيفة سكرتيرة و اللي تقبل على نفسيتها تشتغل عاملة نظافة في شركة محترمة بتشترط المرتب و كان ناقص كمان تطلب ال cv بتاعت صاحب المصنع امال لما تتجوز هتعمل ايه ؟؟<br />بصراحه المشكلة مش في الاهل لان الاهل يهمهم الاول سترة البنت و في الاخر الماديات اما البنات اللي طالعين في العالي و كل واحده عندها تنطلعات برجوازية<br />فبسيطه الحال عايزة عريس ينتشلها من الفقر اللي طحقت منه ( مع انه لذيذ و طعم )<br />اما ميسورة الحال فمفيش عندها استعداد ترجع تبدأ من الًصفر ( على فكرة الصفر ده اختراع عربي صرف )<br />و في الاخر اقول لهبهوب صعب قوي تلاقي اليومين دول واحد بيحرك اطرافه الاربعه في نفس الوقت<br />و الى سويت اول خيرا فعل اهلك و هو ده عين العق فالحب لا يكيل بالبتنجان و احنا بنشتري راجل ( هو الراجل بقا بكام اليومين دول ؟؟؟ )"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134311/http://www.20at.com/article2.php?sid=526"

