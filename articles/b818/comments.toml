subject = "الحضن الدافئ (قصة اسرة)"
author = "عبدالله مفتاح"
posted = "2006-05-17"
text = "في سكون الليل وقبل اذان الفجر يصلان الى باب المنزل ترتسم على وجهيهماامارات السعاده والرضا ، ولم لا فقد اتما رسالتهما على اكمل وجه هما رجل وامراة ترك الزمن على وجهيهما المضئ آثاره<br />ابتسم في وجهها وقال لها وهو يفتح الباب :تفضلي يا ملكتي انها مملكتك<br />قالت ضاحكة وهي تدخل :الملكه بلغت من الكبر عتيا حتى اضحت بقايا ملكه<br />لحق بها ثم اغلق الباب وامسك بيدها يقبلها قائلا:انك ملكه متوجه على عرش النساء مهما تقدم بك العمر<br />فقالت على استحياء :انك تكرر الجمله التي قلتها يوم اغلقت خلفنا الباب لاول مرة<br />- يوم ان قررنا ان نهب حياتنا لله -عز وجل-لنعطي لكل الاسر مثالا يحتذى به للحياة الزوجيه<br />- قالت وهي تتنهد:يا له من يوم رائع<br />- هيا بنا نكرره - قالها وهم ان يحملها ليطوف بها اركان المنزل ولكن أنّى للظهر المنحنى ان يتحمل العبء و أني للعظام الواهنه ان تتماسك<br />- ادركت ان في حمله لها مشقه كبيرة على قلبه المريض فاسرعت بالفرار متعلله ان جسدها لا يقوى على التكور فوق يديه<br />تاكد من نبرتها انها اشفقت عليه فاستيقظت بداخله حمية الرجل. وما ان حملها حتى كاد يفقد توازنه لولا ستر الله .<br />طاف بها بعض اركان المنزل وهو يهمس في اذنها بانفاسه المتلاحقه: انها مملكتك يا لب قلبي<br />وامام ارهاقه الشديد وتوسلاتها المتتابعه انزلها وجلسا يستندان الى الحائط وحتى لا يتكلم وهو مضطرب النفس اقترحت عليه في دلال ان تحكي له حكاية ستنال اعجابه فاوما بالموافقه<br />_ كانت هدى فتاه ليست كقريناتها من الفتيات فوسط ملابسهن الصاخبه كانت ملابسها هادئه وبينما كانت قلوبهن حائرة كان قلبها مطمئن حازت على حب واحترام الجميع خاصة صديقتها الصدوق عفاف تلك الفتاه التي تبادلت مع هدى الحب في الله عسى الله ان يظلهما في ظل عرشه يوم لا ظل الا ظله كان لعفاف اخ يشهد له الجميع بحسن الخلق ونظرا لان هدى لم تتحدث اليه مطلقا ولا تذكر انها راته او رآها كانت مفاجاه لها ان تطلب منها عفاف موعدا ليتقدم اخوها لها<br />سارت الامور فيما بعد طبيعيه اذا اهملنا كثرة السخريه والاستهزاء بهدى وخطيبها حيث ان حياءهما الشديد منعهما من التحدث بحريه كبيرة كان قد التقط انفاسه فاستسمحها ان يكمل الحكايه فوافقت :<br />تزوجا زواجا لا عصيان في مظاهره ومنذ الوهله الاولى شكر الله على هذه الزوجه الصالحه فكم من المواقف التي كانت تتقمص دور الاب او الام او الاخت او الاخ فتكون بلسما او ترياقا للسعاده<br />رزقهم الله بثلاث فتيات احسنت تربيتهم وتنشئتهم على العفاف ومرادفات الحياء والصفاء وطهارة النفس<br />كانت النقطه الفاصله التي تاكد منها انه ترك بناته ليد امينه ،عندما اكثرت ابنته الكبرى اغلاق غرفتها وهي في سن المراهقه وبدت شاردة . وذات مساء قرر الذهاب الى غرفتها .....طرق الباب بلطف وعندما دخل وجد عيناها وقد اغرقهما الدموع واذا بها تتامل قوله تعالى (وجوه يومئذ ناعمه لسعيها راضيه...) اغلق<br />الباب في هدوء حتى لايقطع عليها لحظات التامل وامتلات نفسه بالراحه فما احلاه من شعور<br />.....الى هنا قطع حديثه صوته القادم من اعماقه آآآآآآآآآآآآآآآآآآآآآآآه<br />وثبت زوجته وارتدعدت اوصالها<br />- ما يك ارجوك لا تتالم(قالتها وتقلصات الفزع باديه على وجهها)<br />- يبدو انها الازمه القلبيه مرة اخرى ولكنها حاده آآآآآآآآآآآآآآه<br />كادت تبكي وهي تحضر له القرص ليدسه تحت لسانهانطلق صوت اذان الفجر<br />(الله اكبر الله اكبر......................الله اكبر الله اك)<br />آآآآآآآآآآآه آآآآآآآآآآآآآآآآه آآآآآآآآآآآآآه<br />( اشهد ان لا اله الا الله............اشهد ان لا اله الا الله )<br />تكلم بصوت متحشرنج يملؤه التقطع:انها على غير العاده يبدو ان وقت الفراق قد حان<br />آآآآآآآآآآآآه<br />انفجرت في البكاء وهي تحتضنه :ارجوك كف عن هذا<br />( اشهد ان محمدا رسول الله ...................اشهد ان محمدا رسول الله )<br />عاد يتكلم والالام تبرحه : لقد حققت كل ماتمنيت حصلت على المنصب والسلطه ولم اخشى<br />في الحق لومة لائم ، حضرت زفاف اخر بناتي اليوم وقبل ذلك كله حفظت القران على يدك انك نعم الزوج آآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآآه<br />(حي على الصلاة ...................حي على الصلاة )<br />انتحب صوتها من البكاء وزاد تشبثها به : توقف ارجوك توقف لا حياة لي بدونك لا حياة بدونك<br />(حي على الفلاح ................حي على الفلاح(<br />قالها متقطعه مرتعشه:اشهد الله اني احبك كما لم احب احدا من قبل يا حسنة الدنيا<br />واسال الله ان يجمعني واياكي في حسنة الاخرة آآآآآآآآآآآآآآآآآه<br />كانت دموعها قد اغلقت عينيها واصبحت كالام المكلومه على ولدها الوحيد:لا حياة لي بدونك لا لا لا كف عن هذا ستسترد عافيتك لنجلس سويا تطعمني من عطفك وحنانك يا نهر الحب<br />( الله اكبر .........................الله اكبر)<br />لم يجب فقد كان قد نطق الشهادتين وفاضت روحه احتضنته برفق وقد عجز الكلام عن التعبير فاعتصر قلبها واعتصر واعتصر حتى توقف عن الخفقان<br />( لا اله الا الله )"
