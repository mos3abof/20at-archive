[[comments]]
order = 0
subject = "جزاكم الله الف خير"
author = "سجود \"بنت يافا\""
posted = "2006-06-05"
text = "هذا المقع جميل جيدا والواحد يمكنه التعلم والاستفاده من هذا الكلام واتمنى من كل قارئ ان يستفيد ويقرأ لأن هذا مفيد وشكرا لكم..........بأحترامي سجود من يافا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124156/http://www.20at.com/article2.php?sid=831"

[[comments]]
order = 1
subject = "الى سجود"
author = "بنت فلسطين\"ايضاً انا اسمي سجود"
posted = "2006-06-05"
text = "اولا اهلا بأهل يافا ثانيا اريد ان اتعرف عليكي وكلمك مثل السكر يا عسل وبالنسبة للموضوع فأنة حقا جميل ومفيد كما قالت سجود من يافا وسلمي على يافا وعلى البحر يا امر"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124156/http://www.20at.com/article2.php?sid=831"

[[comments]]
order = 2
subject = "والله انوا المضوع جميل"
author = "سليمان حبيب الشعب"
posted = "2006-06-05"
text = "حقا انا اريد ان اقول للجميع الأمه الأسلاميه ان لا تجلس على الكومبوتر ليلاً ونهاراً على المسنجر والدردشة انما ندخل الى مواقع دنية ونستفيد منهاواتمنى ان يتحقق هذا الشيئ وشكرا لكم ..."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102124156/http://www.20at.com/article2.php?sid=831"

