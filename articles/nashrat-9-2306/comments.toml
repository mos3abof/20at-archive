subject = "صبوحه"
author = "ولاء"
posted = "2006-08-05"
text = "كخكخكخكخكخكخ صباح متل الي طالعه من القبر شعرها المكنفش وعيونها لي طالعين لبره... كيف لونها ما بتوخذ ابر للتجميل يا صباح البين على صباح. ورولا الله يستر عليها عنجد عمليات التجميل بينفعو هادول الايام شفتو شكلها قبل ما تعمل عمليات التجميل خخخخخخخ بتخزي ههههههههههه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102145744/http://www.20at.com/article2.php?sid=990"

