text = "ياحمدى اكبر شوية المقالات دى مش هاتجيبك رئيس تحرير المصور ولا حتى التقرير الامنى فى بلال فضل علشان تطيرة من الاوربيت ها يخلى الحكومة ترضى عنك مش كفاية عبد اللة كمال واحد هايبقوا اتنيين."
