[[comments]]
order = 2
subject = ""
author = "تعبان"
posted = "2008-01-14"
text = "طيب يا سى حمدى رزق - انت موجوع لية - ما كل واحد حر فى زفتة - انا ها اجيب قرداتى فى الزفة بتاعتى وها اجيب عيال يطبلوا على غطى حلة او صفيحة<br />انت بتهاجم المتدينون واصحاب الحجاب - عايزهم يجيبوا تحية كريوكا والا هند رستم<br />انت ما بتختشيش -<br />الفقر هو اللى اوصلنا الى كدة<br />فرح اورديحى - طبيخ من غير لحمة - لما يبقى معانا نبقى نجيب فرقة موسيقية"
archived = "2009-05-14"
capture_url = "https://web.archive.org/web/20090514061057/http://www.harb.20at.com:80/masr/t7atuf/8021.html"

[[comments]]
order = 3
subject = ""
author = "متابعك يا حمدى"
posted = "2008-01-18"
text = "اسلوبك فى الكتابه يثير الغثيان وكتابتك بالعاميه تقرف وانت لاتساوى شيء فى الصحافه وانت اكبر منافق ولا تساوى ذره من كبير الساخرين عمنا محمود السعدنى شفاه الله<br />انت تافه ومقرف وعشان اريحك انا لاناصرى ولا اخوانى ولا مهياص زيك …فقط انا مصرى وطنى"
archived = "2009-05-14"
capture_url = "https://web.archive.org/web/20090514061057/http://www.harb.20at.com:80/masr/t7atuf/8021.html"

[[comments]]
order = 4
subject = ""
author = "امل"
posted = "2008-07-23"
text = "لا حول ولا قوة إلا بالله من انت لتحلل وتحرم وتقول ان هذه الاغنية تراث حلال لا يمكن لمسه ويا ليت يا أخي لو انك تدكر عالم واحد من الالف اللي انت داكرهم يقول ان المعازف حلال بل لا يجوز المساس بها اتقي الله في ضعاف الايمان اتقي الله في من يمكن ان يسمع هدا الكلام فيصدقه<br />اللهم اهدينا للصواب و ابعد عنا من لا يرى وهو يبصر"
archived = "2009-05-14"
capture_url = "https://web.archive.org/web/20090514061057/http://www.harb.20at.com:80/masr/t7atuf/8021.html"
