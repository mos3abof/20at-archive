subject = "وما باليد حيلة"
text = "لم نعد نستطيع الا البكاء والعويل والصرخات المتتاليه التي تعجز ولو حتي عن مداوة جرح ام فقدت ابنها فقط صرنا نتكلم ونتكلم ونسمع الشعارات الكاذبه هنا وهناك الي ان ضعنا وضاعت معنا القضيه لم يعد لدينا ما نبكي عليه امس كنا نتحدث عن حدود 48 واليوم نتحدث عن حدود غزة ورفح اين هي القضيه تاهت القضيه وبالفعل لم يعد في مقدورنا الا المساعده باس ام اس او مساعدات ماليه ولكن تلك المساعده الماليه كفيلة بان تلملم جرح تلك الام الثكلي لا اظن اللهم رحماك"
archived = "2004-09-26"
capture_url = "https://web.archive.org/web/20040926230041/http://www.20at.com:80/article.php?sid=249"
