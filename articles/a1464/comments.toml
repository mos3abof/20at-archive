author = "لسلام عليكم"
text = "لقد رأيت الحرم النبوي الشريف بكل دقة ولكن الحرم المكي الشريف كان أقل دقة منه.<br />أيضا وجدت عيبا غريبا في هذا البرنامج وهو محرك البحث الخاص به، فعندما كتبت مكة makkah قال أنه لا يوجد نتائج للبحث ولكن عندما ظللت أبحث عن مكة وجدته يسميها بنفس الاسم makkah !! وهكذا الحال في بعض المدن الاخرىز عدا عن ذلك فالبرنامج ممتع جدا !"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143421/http://www.20at.com/article.php?sid=1464"

