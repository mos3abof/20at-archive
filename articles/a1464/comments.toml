[[comments]]
order = 9
subject = "@اخفةشهم.ؤخةelmaganon"
author = "ش راح ارد الا بان اسرائيل من غير امريكا ولا تسوى وانا اتشرف بان اضع هذه القصيدة لشاعار العمية عصام علم الدين"
text = "القدس أرض المسلمين<br />مع كل كلمه نقراها<br />وكل صوره العين تراها<br />مع كل دمعه م العيون سالت<br />وكل دمعه خبيناها<br />وف كل لحظة صدق<br />مرت علينا عشناها<br />كنا بنسأل نفسنا<br />فينك ياصوت الحق<br />وليه الظلم لف الدنيا<br />وعشش فيها وملاها<br />وليه أمريكا حاكماها<br />وهي القاضي والجلاد<br />وحبال المشنقه<br />وقيود المعتقل<br />وقضبان الزنازن<br />والعساكر<br />اللي بيقيموا المجازر<br />والآباتشي<br />اللي بتدك المنازل<br />وهي كل فكر صهيوني<br />ياأمريكا<br />ياأمريكا مهما تساوي<br />مهما تكوني<br />مسيرك زي عاد وثمود<br />وهاتزولي<br />جايز يكون بكره<br />يجوز لسه زمان وسنين<br />جايز نكون متنا<br />يمكن نكون عايشين<br />يجوز جيل تاني<br />غير جيلنا<br />لكن إحنا ومش غيرنا<br />في حضن الأقصى<br />هانصلي<br />والآدان يفضل يكبر<br />تبقى عاليه<br />الله أكبر<br />القدس مش بلد الصهاينه<br />القدس أرض المسلمين<br />فوق ترابها نبينا صلى<br />بالأنبياء والمرسلين<br />ياإنتفاضه كوني ثوره<br />كوني دايمآ مستمره<br />وإحنا بيكي مؤمنين<br />إحنا ليكي مصدقين<br />إستمري بإيد ولادك<br />راجعه ضروري فلسطين<br />والقدس<br />القدس أرض المسامين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102143421/http://www.20at.com/article.php?sid=1464"
