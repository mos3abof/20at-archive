subject = "(( من ابو فهد )) الى احباب المنتدى الطيبين الحلوين"
author = "خرجَ من معطفهِ الجريده.."
text = "وعلبةَ الثقابِ<br />ودون أن يلاحظَ اضطرابي..<br />ودونما اهتمامِ<br />تناولَ السكَّرَ من أمامي..<br />ذوَّب في الفنجانِ قطعتين<br />ذوَّبني.. ذوَّب قطعتين<br />وبعدَ لحظتين<br />ودونَ أن يراني<br />ويعرفَ الشوقَ الذي اعتراني..<br />تناولَ المعطفَ من أمامي<br />وغابَ في الزحامِ<br />مخلَّفاً وراءه.. الجريده<br />وحيدةً<br />------------ كاظم الساهر<br />اولا احبابي المنتدى لااخذ ارائكم وليس لترقيم تقول حنا في شارع الحلية والا في سوق صيرفي مجيا مول انا لاانكر انني لاحب الفتيات واحد رواد مجيا مول بس الانسان عندما يتعرف على الشات وبهذه السذاجة مع احترامي للجميع اي كان ( فتى او فتاة) في اسلوب وفي دقة في التعامل مو بس الانسان يبي يعمل غزلنجي من الباب الى الطاقة تعلموا اسلوب العصر المدراس لم تخلف جيل بهذا المستوى الردئ انت هنا لتعطي رائيك وليس شي اخر وياحبذا ان تكون هنك نوع من الثقافة المندمة مع الغرب لكي تتعلوم اصول احترام الغير وعدم التجريح حنا لسنا حيوانات همنا ( النيك ) فقط بغظ التنظر عن القيم والاسس التي تفرضها شريعتنا السمحه انا لست بالمثقف في الدين وليس صايع بالشوارع لكن الحياة هي الدرس لابن الانسان ولم يكن اي درس بل قاسي فمالك عندما تتحدث بسخريه وعدم اللامباة ليس العيب فيك بل العيب من يخاويك وسلامت الرجاجيل اللي راح زمانهم وخلنا في ( شنقط حبش )"
