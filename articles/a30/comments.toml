author = "ا شباب خافوا الله"
text = "انا باسلك سوال انت بتضمن اذا خلصت من تعليق انك تعيش؟<br />لا والله ما تظمن لذلك لاتدع ربك يقبض روحك وانت في موقف لاتريد ان تبعث عليه بالضم)<br />فتخيل لو نزل عليك ملك الموت وانت امام الشاشه ماموقفك؟<br />والله انك لك من العذاب مالله به عليم<br />بعدين انا استغرب من الناس اللس مايكتفوا انهم هم يشاهدوا وهم يزنوا مع عظيم الاثام<br />بل<br />انهم يرسلون الافلام والقصص والصور لفلان وفلان يرسل لاخر والاخر يرسل لاخر الى انت تنتشر الى ماللله به عليم<br />وكل هذا في رقبتك<br />وفي عملك<br />فتخيل انك انت في القبر وهذا يزيني لانه ينظر الى فلم انت ارسلته<br />والاثام عليك وانت رهيب قبرك<br />اخيرا<br />ترا اللي يكتبوا من السعوديه مايمثلوا الانفسهم بس مايمثلوا السواد الاعظم منها<br />واخيرا<br />الداعين الى الله هنا استمروا فان اجركم ع الله وموسى دعا قومه 950 عام<br />فلاتهنوا ولا تحزنوا وانتم الاعلون<br />والسلام<br />سطام الزهراني"
