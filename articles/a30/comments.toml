subject = "ياويله من عذاب ربنا"
author = "بقول شي اللي ما يستحي من الكلام اللي قاعد يقوله على الاقل استحي من ربك وانا اتحدا واااحد يجهل هذا الكلام او يقول انه مايعرفه قال ربنا( افريتم ان متعناكم سنين) إلى اخر الاية الله سبحانه عطاك المتعه تفنيها فيما لايرضي ربك سبحانة ليش ايش اللي استفته من اللي تقوله أصلا ولا احد يلبي الناس اللي معاك تضحك عليك ليش كذا وبعدين تضع رقم تلفونك ايش هذا الناس ينظرون اليك بعين الغضب لانهم ما يرضوا على اهاليهم وانت اصلا كذلك ما ترضى على اهلك استر على حياة الناس واسرهم كيف الناس يشوفونك بعين الغضب عجل كيف ربك سبحانه يراك الله سبحانه يقول في حديث قدسي ( لو انكم تعتقدون انني لا أراكم فالخلل في إيمانكم ولو انكم تعتقدون أنني أراكم فلا تجعلوني أهون الناظرين إليكم) ليش تجعل ربك أهون الناظرين إليك إذا أنت مو ملتزم على الاقل خاف ربك الذي اعطاك ورباك ونماك ورزقك تروح وتفنيها فيما لايرضيه الله يستطيع ان يمحيها عنك جميعها من الذي خلق لك النظر اليس الله طيب ليش تشوف الحرام طيب الله مو قادر ان يخطف بصرك قال سبحانه وتعالى( إن الله على كل شي قدير) يعني قادر على كل شي فأحذر من الفتن وحصن نفسك على الاقل تزوج الزواج والله والله حلال مو حرام حصن نفسك وابتعد عن الحرام الذي يغضب ربنا سبحانه"
text = "وقولتي لاإله إلا الله عجب هذا الذي اشوفه امام ناظري اعيني توبوا إلى ربكم وابتغي سبيل ربك بالحكمه والموعظه الحسنه<br />aseer551@hotmail.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102142406/http://www.20at.com/article.php?sid=30"

