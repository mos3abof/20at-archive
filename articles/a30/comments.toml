author = "ذكر بعد كل كلمه تنطقها هادم الذات ومفرق الجماعات {تذكر سكرة الموت {وجئت سكرة الموت وهم في غفلة مما يعملون }وقال تعالى {وجئت سكرة الموت بالحق ذالك ماكنت عنه تحيد)"
text = "اسالك سؤال متى ستموت وفي اي لحظةومتى الوقت ؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟وهل تعلم على اي حاله ستموت بها اتق الله ارجوك<br />هل تريدين ان تتزوجي زاني يخونك لماذا ترظين بخيانته ان كل كلمه تقولينها تقلل من هيبتك ومقدارك عند القراء<br />لا لا لا لا تقولي رظو ا وقراؤ بل كنتي العوبه بايديهم<br />كوني دره مكنونه ولاتكوني زهره ذات رائحه الكل يشم عطرها ويتمناها ثم بعد ماتذبل ترما في برميل الزبالة لاتكوني ظحلام يه لها ولا الذئاب ياحبيبتي وسلام مسك 0الختام."
