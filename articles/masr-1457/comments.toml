subject = "تحية لحكيم منير صليب وكل شرفاء مصر من ولاد بهيه"
author = "إبن بهيه"
posted = "2007-01-17"
text = "كنت أتمنى كتابة الكثير في هذا الموضوع لولا أنني مضطر للخروج فوراً لأمر هام .. وآثرت إلا أن أدلو بدلوي في هذا الموضوع الجيد وأوجه التحية لإسم هذا المصري الوطني المحترم .. لك منا كل تحية وتقدير يا حكيم منير صليب<br />وللجميع تحياتي<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042546/http://masr.20at.com:80/article.php?sid=1457"

