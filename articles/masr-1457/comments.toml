[[comments]]
order = 0
subject = "لسه بدرى"
author = "بسمه"
posted = "2007-01-17"
text = "ما تستناش لانه مش ها يحصل معلوماتي المتواضعة في السبعينات كان لسه الشعب المصرى متمسك بشوية مبادئ وقيم من مخلفات الثورة عتي حبة ثقافة لكن سياسة الانفتاح السداح مداح و الهجرة الي بلاد الخليج و كوارثها علينا من كل النواحي حولتنا الي غرباء عايشين في مكان بيجمعنا حتي وصلنا الي ما نحن فيه من سلبيه و اصبح شعارنا واحنا مالنا العيال عايزين يتربوا خلينا ماشيين جانب الحيطه او نكتفي بالدعاء ان ربنا ياخدهم واحنا متاكدين انهم قاعدين علي قلوبناو الدليل الاسعار زادت كم مرة بلاش الاسعار كل الكوارث اللي بتحصل من غرق العبارة علي حرق الناس على مبيدات مسرطنة و تلوث مياة الشرب و مخلفات المصانع والسحابة السوداء الحقيقة ان القائمة حافلة ومع ذلك الناس بتسرق و ترتشي و تشحت وتصلي في الجوامع والكنائس عادى يعني واهي عيشة والسلام"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042546/http://masr.20at.com:80/article.php?sid=1457"

[[comments]]
order = 1
subject = "تحية للقاضي القبطي"
author = "مصري زهقان"
posted = "2007-01-17"
text = "تحية لهذا القاضي القبطي يعني المصري و الف رحمه ونور تنزل عليه علشان هو مات السنة اللي فاتت<br />أول مرة أشوف رئيس محكمة أمن دولة محترم<br />وكمان قبطي حاجة تفرح أنة مخفش من السادات"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042546/http://masr.20at.com:80/article.php?sid=1457"

[[comments]]
order = 2
subject = "قضية فشنك"
author = "ديمة"
posted = "2007-01-17"
text = "الموضوع حلو اوى، وبتهيألى دى من اهم النقاط اللى المفروض نتكلم عليها فى القضية ان بعد كلام الجرايد وقوى الرفض وجماعات التخريب والقوى العميلة ، وبعد قوات الامن فى الشارع وسحب الناس على السجون ، ترتبن قضية لكل هذا العدد من السياسيين وفى الآخر (فشنك) مش بيعرفوا حتى يحبكوا الكدب، ادعو لكل فريق القضاء والدفاع بالرحمة من كان حى منهم او رحل"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042546/http://masr.20at.com:80/article.php?sid=1457"

[[comments]]
order = 3
subject = "مصرى"
author = "مصرى"
posted = "2007-01-17"
text = "احنا منقدرش اننا نفصل القضاة عن المجتمع لأنهم ابناء نفس المجتمع اللى احنا عايشين فيه<br />القاضى ده كان متربى فى مجتمع بيؤمن بالوطن و الانسان و ده اثر فيه و خلاه يعمل كده<br />و ده الطبيعى من انسان اختار انسانيته و حققها على ارض الواقع مش مجرد تأييد و تنديد<br />و برده الطبيعى من انسان عارف يعنى ايه منصة قاضى .. بس الفكرة اللى اظن احمد اتكلم عنها انه مش مجرد موقف مشرف بس كمان موقف نتعلم منه يعنى ايه وطن لأننا نسينا معنى الاسم ده مع محاولات الحكومة المستميتة فى ربط اسم مصر = الوطن = مصالح الوطن مع حزبها اللى خرب بيوتنا كلنا فاصبحنا كلنا ننفر من اسم وطن و بالتالى مش حاسين معناه .. لازم ننفض كل الهموم ده فى سبيل اعلاء بعض القيم اللى موجودة فينا و مغروسة جوانا"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042546/http://masr.20at.com:80/article.php?sid=1457"

[[comments]]
order = 4
subject = "تحية احترام لهذا الرجل"
author = "حكيم منير صليب مصرى مسيحى يحب بلدة ويخاف على ناسها ويحترمهم ويرعاهم ويقول كلمة الحق فى وجة سلطان جائر"
posted = "2007-01-17"
text = "ولاننى عجوز مش فى العشرينات زيكم ولكن معجب بافكاركم<br />زمان ايام حرب اكتوبر كنا فى الميدان على الجبهة وكان معى فى الخندق ضابط احتياط زميل مسيحى وكنا ناكل معا وننام معاوننتناقش ساعات فى كل المواضيع والرجل كان اذا رحت فى النوم يصحينى الفجر ويقولى علشان تلحق تصلى<br />وجرح وتبرعت لة بدمى<br />كنا اخوة فى الخنادق والحرب ومفيش تفرقة<br />والحقوق واحدة للجميع<br />اية اللى حصل<br />لية تباعدنا ونتباعد اكثر ونسمع نغمات غريبة عن الاضهاد والحقوق<br />مفيش حد يطلب حقوق لنفسة وانما يطلب لكل المصريين والدين مالوش دعوة<br />احنا كلنا مصريين ودى بلدن كلنا واللورد كرومر شتمنا احنا المصريين وقال انهم كلهم اوغاد ولا تستطيع ان تفرق بينهم الا عندما يذهبون للصلاة هذا فى مسجد واخر فى كنيسة<br />هذا رجل من الجيل الوطنى المصرى الشجاع<br />هذا رجل افرازات ثقافة مجتمع عانى وتربى على الفضيلة والشجاعة وقول الحق<br />رجل لم يسأل اين القوة ليقف بجانبها وانما سأل اين الحق ليقف بجانبة<br />تحية لك حكيم منير صليب"
archived = "2007-01-31"
capture_url = "https://web.archive.org/web/20070131042546/http://masr.20at.com:80/article.php?sid=1457"

[[comments]]
