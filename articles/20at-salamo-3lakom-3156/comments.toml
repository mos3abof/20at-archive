text = "رجعتوني للطفوله والعالم الجامده , فكرتوني بشريط امي الحنونه تحفه اول مره كنت اسمع شريط فلسطيني<br />وابو راتب والعالم الجامده دي , علي فكره منتشره في مصر كمان الاناشيد وشباب تحت العشرين متابعها كمان"
