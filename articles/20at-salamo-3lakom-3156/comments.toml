text = "السلام عليكم.مااريد قوله هو اني جد فخورة بالشباب العربي على هذه القفزة النوعية او الاقبال المتزايد على الاستماع للأناشيد الدينية,بدل الأغاني التي تحمل في معانيها كلمات رذيئة تخل بقيمنا الاسلامية…ودعائي الى الله سبحانه وتعالى باصلاح الامة الاسلامية …آمين."
