posted = "2007-02-03"
text = "شكرا أخى\" كامل \"على هذه الأخبار الرائعة التى تدل على أن الشباب عاد إلى الإسلام من جديد بعد سنين طويلة من البعد عن الله .<br />نعم إنها الصحوة الإسلامية التى بدات ولن تنتهى بإذن الله وأدعوا الله أن يثبت شباب المسلمين وفتياتهم على الإسلام وأن يكونوا زادا لنصرته وحاميا ضد مايكاد ضده من الكافرين والمنافقين.<br />وأتمنى من \"عشرينات\" أن يتناول مثل تلك المواضيع باستمرار حتى ندرك جميعا أن المسلمين مازالوا بخير ."
archived = "2009-08-04"
capture_url = "https://web.archive.org/web/20090804041413/http://www.20at.com:80/20at/salamo-3lakom/3156.html"

