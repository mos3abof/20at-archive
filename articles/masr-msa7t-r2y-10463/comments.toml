text = "النبي محمد صلى الله عليه واله وسلم حل مشكلة المرأة مع الرجل في كلمتين صلوات الله وسلامه عليه<br />اترضاه لامك<br />1) التحرش ـ اترضاه لامك<br />2) الزنا ـ اترضاه لامك<br />3) الاغتصاب ـ اترضاه لامك<br />4) الخطف ـ اترضاه لامك<br />5) الحرمان من الميراث ـ اترضاه لامك<br />6) اهانة المرأة ـ اترضاه لامك<br />7) … ـ اترضاه لامك<br />9) …<br />صلى الله عليه يا علم الهدى لولاك ما هبت النسائم وما ناحت على الايك الحمائم<br />صلى الله عليه وسلم"
