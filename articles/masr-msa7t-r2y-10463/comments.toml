author = "محسن منير السكري"
posted = "2008-11-17"
text = "سوزان تميم تتعاون مع صلاح الشرنوبي<br />بيروت: «الشرق الأوسط»<br />غادرت المطربة اللبنانية سوزان تميم الى القاهرة بغية التعاون مع عدد من الملحنين المصريين، وتحديداً صلاح الشرنوبي الذي اختارت منه لحناً سيتصدر البومها المقبل. كذلك ستتعاون تميم ايضاً مع عصام كاريكا وسليم سلامة وسام الامير وطارق ابو جودة.<br />ومن المنتظر ان تعود سوزان الى الربوع اللبنانية نهاية الاسبوع لتقضي فترة استراحة وتمارس رياضة التزلج، وهي المفضلة لديها. وكانت قد سافرت الى دولة الامارات العربية وشاركت في مهرجان دبي الغنائي الى جانب المطرب السعودي عبد المجيد عبد الله.<br />كذلك كانت تميم قد ابلغت عن سرقة سيارتها خلال الشهر الماضي، مفيدة ان مجوهراتها كانت في السيارة المسروقة، ثم عُثر على السيارة بعد حوالي الاسبوعين قرب منزلها الجبلي."
archived = "2009-06-08"
capture_url = "https://web.archive.org/web/20090608090033/http://20at.com:80/masr/msa7t-r2y/10463.html"

