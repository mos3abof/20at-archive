text = "مر الكلام زى الحسام يقطع مكان ما يمر<br />أما المديح سهل ومريخ يخدع صحيح ويغر<br />والكلمة دين 000من غير ايدين<br />بس الوفا ع احر<br />أحسنت ايتها الانسانة الصادقة الجادة<br />ولكن موضوع الوزارة دة عايز حوار كبير على مستوى عالى<br />يكون فية للمتخصصين وأصحاب الرأى لهم دور فية حتى تكون النتائج لها رد فعل ايجابى<br />خاصة فى ظل الظروف التى تمر بها البلد<br />فهو أمر ليس بالهين ولكن يحتاج الى حملة شعبية وحملة توعية شاملة على مستويات مختلفة لنشر ثقافة التكافل الاجتماعى التى كادت أن تكون فى طى النسيان<br />والكلام كتير 0000000"
