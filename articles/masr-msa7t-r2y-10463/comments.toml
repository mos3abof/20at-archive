text = "قال الشاعر يشرح كيف ينال من محبوبتة وكيف ينال رضاها<br />فخرة العشاق يا من عشقوا *************** ********* ذهب ينثرة او ورق<br />واذا باب الرضا قد اغلقوا *************** ************** يفتح الدرهم ما قد اغلقوا<br />هكذا قد قال فى تنزيلة *************** *************** * لن تنالوا البر حتى تنفقوا<br />اما حب شراء الجنس بالمال عند الغوانى يقول شاعرنا الشعبى فى الموال المصرى فى حوارى القرى والمدن<br />اللى معة مال لو طلب الثريا نال<br />واللى بلا مال صكوة الملاح بنعال<br />وان كان معك مال هاتة تبلغ الامال<br />ما كان معك مال طردوك الملاح فى الحال<br />وهذا كلام مسلوق وارد من شخص عديم الذوق"
