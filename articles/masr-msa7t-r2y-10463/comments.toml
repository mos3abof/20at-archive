text = "بعض الشباب يعشقون النسوان العواجيز<br />فى اخر زيارة للغردقة وجدت شابا مصريا لم يتجاوز الثلاثين متزوج من عجوز المانية تجاوز عمرها التسعين وفرحان قوى بيها لانها ستعمل لة التاشيرة وستاخذة الى المانيا<br />وبحثت فى الادب العربى القديم عن حب النسوان العواجيز<br />فوجدت ابياتا فى منتهى الظرف فى احداها<br />تعشقها شمطاء شاب وليدها ——————————————- وللناس فيما يعشقون مذاهب<br />وصال عمنا ابو نواس وجال واتى الى مصر يسأل شاعرا حدادا وقف على باب حانوتة<br />ماذا تقول رعاك اللة فى رجل ———————————————- اضناة حب عجوز بنت تسعين<br />فاجابة الحداد بقولة :<br />يبكى علية فقد اودى بمهجتة ————————————————————- حب القباح وترك الحور العين<br />فزواج شاب من امرأة عجوز هو عين سرقة الجنس من شاب صغير تسرقة امراة عجوز شمطاء<br />والسرقات انواع والوان"
archived = "2009-06-08"
capture_url = "https://web.archive.org/web/20090608090033/http://20at.com:80/masr/msa7t-r2y/10463.html"

