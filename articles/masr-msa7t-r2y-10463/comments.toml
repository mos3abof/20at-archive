text = "لا تفكر بعصافير الوطن<br />وباشجار وانهار واخبار الوطن<br />ولا تفكر بالذين اغتصبوا شمس ونساء الوطن<br />ان سيف القمح القمح والخبز ياتيك صباحا<br />فى عناوين الجريدة<br />وتفاعيل القصيدة<br />وبقايا قهوتك<br />لا تنم بين زراعى زوجتك<br />ان زوارك عند الفجر<br />موجودون تحت الكنبة<br />لا تطالع كتبا فى النقد او الفلسفة<br />ان زوارك عند الفجر<br />مزرعون مثل السوس فى كل رفوف المكتبة<br />ابق فى برميلك المملوء نملا وبعوضا وقمامة<br />ابق من رجليك مشنوقا الى يوم القيامة<br />ابق من صوتك مشنوقا الى يوم القيامة<br />ابق من عقلك مشنوقا الى يوم القيامة<br />ابق فى البرميل حتى لا ترى وجة هذة الامة المغتصبة"
