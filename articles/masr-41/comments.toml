subject = "نحن السابقون"
author = "صحفي مكتئب"
posted = "2006-03-20"
text = "كان فيه زي حالتكم 20 محرر غلابة ، راحوا ضحية التخلف الحزبي لمل مجلتهم قفلت بع ما كان كلهم أمل... لكن كان الظلام أقوي منهم، وبدل ما كانت ( بداية ) بقت (نهاية)..والي اللقاء من احباطات صحفية أخري"
archived = "2006-05-24"
