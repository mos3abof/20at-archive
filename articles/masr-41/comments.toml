text = "مش واخد بالي، هو الجورنال بتاع التسلخات<br />يا عم بلا خيبة... في عيال بتكتب بس حرام في جورنال زي ده<br />شكلة جورنال خايب صاحبه واحد خايب مستغل لشباب طموح"
