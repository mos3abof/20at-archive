[[comments]]
order = 1
subject = "وإيه يعني"
author = "مختار"
posted = "2006-03-20"
text = "مش عارف ليه مش بالع موضوع ان الجورنال ده كان جامد.. أنا اشتريت منه عددين وكان يغم النفس ومفيهوش اي حاجة تضحك، بس هما يستحقوا نتعاطف معاهم.. ممكن يقعدوا يعملوا مجلات حائط لحد ما ربنا يفرجها، وبعدين هانت كلها عددين ولا تلاتة والدستور وصوت الامة والفجر هيقفلوا، ويقعدوا مع بعض كلهم يشتغلوا في الصفحة دي.. بلا خيبة وجعتوا دماغنا"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205347/http://masr.20at.com:80/article.php?sid=41&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

