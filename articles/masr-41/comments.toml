posted = "2006-03-20"
text = "إيه يا عم مختار<br />مالك مغمقها كدة ليه<br />العيال كانوا عاملين شغل جامد برضه<br />وبعدين يا اخي تعاطفك لوحده موش كفاية<br />ساعدهم باي حاجة .. ان شلا بسكوتك<br />نسيت اقولكم مبروك ع الصفحة دي.. يلا ورونا شطارتكم"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205347/http://masr.20at.com:80/article.php?sid=41&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

