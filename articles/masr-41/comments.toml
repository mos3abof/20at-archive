[[comments]]
order = 6
subject = "الصحافة ماتت"
author = "محمود الغول"
posted = "2006-04-11"
text = "من اربع سنين وانا بكتب موضوعات ساخرة ولما طلعت اضحك للدنيا فرحت قوى والبداية كانت قوية بس بعد رحيل الجيل الاول لقيت ان المستوى مش اللى هوه ومع ذلك كنت مبسوط من صدور الجرنال وبعد التوقف حصلى صدمة وبقول يا رب الجرنال يرجع تانى علشان خاطر العيال الغلابة دول ونة الاخر كة مفيش صحافة فى مصروكل واحد عامل نفسة وطنى بالبق بس ويمكن اضحك للدنيا كانت الحاجة الحقيقية الوحيدة اللى فى البلد دى"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205347/http://masr.20at.com:80/article.php?sid=41&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 7
subject = "ليه"
author = "احمد موسى"
posted = "2006-04-16"
text = "لوكانت المشكلة مشكلة تمويل ليه سعر الجورنال ما زودتوهوش ده فيه جرايد ملهاش معنى وثمنها2 جنيه هتقولولى ماكانش حد حيشتريه حقولكم مين قال كده انتم جربتوا أتمنى إنى الاقى الجورنال عاد للاسواق مرة أخرى بس بالجيل الأول اللى كان ساخر بجد لان الجيل الجديد ماكنتش مبسوط منه بالقدر بتاع الجيل اللى كان شغال مع الأستاذ خيرى رمضان كان فعلا أستاذ"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205347/http://masr.20at.com:80/article.php?sid=41&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 8
subject = "والله فكرة"
author = "محمود الغول"
posted = "2006-04-16"
text = "فيه صديق اقترح عودة اضحكة للدنيامع زيادة السعر الفكرة كويسة جدا وممكن كلنا نساهم باى طريقة يعنى مثلا انا اتمنى اكتب فيها ببلاش وكمان اشتريها لو حد يعرف اى حد فى اضحك للدنيا يا ريت يتصل بى محمودالغول5583476"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205347/http://masr.20at.com:80/article.php?sid=41&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 9
subject = "بلاشششششش"
author = "ابو رشاد"
posted = "2006-04-27"
text = "ليه بلاش الوداع يا حبيبى ههههههه<br />على فكرة الجريدة دة زى العسل وبلاش وداعا دى هى فعلا جريدة ظريفة بجد اوى اوعى حد يعمل كدة ازعل اوى<br />لو تشغلونى فى الجريدة ان شالله اى حاجة هخلى الجريدة دى زى الفل وعلشان الستعلام نمرة التليفون 0129475894"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205347/http://masr.20at.com:80/article.php?sid=41&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

[[comments]]
order = 10
subject = "طول ما فى الضحك"
author = "ابو رشاد"
posted = "2006-04-27"
text = "انتو بتقولو وداعا ليه هو انتو لو الجريدة دى دنتها مفتوحة ايه الى هيحصل<br />على فكرة الحكاية كدة شكلها مقلب كبير اوى ومفيش وداعا ولا حاجة<br />هههههههه<br />احدى مقالب اضحك للدنيا"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524205347/http://masr.20at.com:80/article.php?sid=41&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"
