[[comments]]
order = 6
subject = "ان غدا لناظره قرييييييييييييييييييييييييييييييييب"
author = "ايها المدعو فرج"
posted = "2006-05-26"
text = "عندما يحدث ما نتتظره جميعا فلتختفى انت و كل الفروج الذين هم على شاكلتك بوجوهكم الكالحه البليده<br />فر بعمرك فلن ارحمك ولن تشفع لك توسلاتك و اعذارك بأنك كنت تنفذ الاوامر وانك مسكين غرر به سوف اعلقك من قدميك مثل الذبيحه و سوف يكون الموت اغلى امنياتك ايها الجبان<br />انتقاما لما فعلت بأمى وأختى و حبيبتى فقمت باءنتهاك اعراضهن عندما طالبن بالحريه وأبى الذى اعتقلته بدون وجه حق او محاكمه و سلبك اياى حقى فى الحياه الكريمه و.......و......و.......<br />ابحث لنفسك من الان عن مكان<br />أأأأأأأأأأأأأأأأأأأأأأأأأأأأأأه يـــــا بـــــــلـــــــدى"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071850/http://masr.20at.com:80/article.php?sid=345"

