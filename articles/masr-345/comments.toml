subject = "حتي انت يا فرج"
author = "الاستاذشيكو"
posted = "2006-05-26"
text = "هوة يعني فرج ده مالوش نفس ماهوة كمان عاليه ضغط من كل جهه 00000000 انا باهززر ربنا ياخدك يا فرج انت واللي زيك واللي مشغلينك واللي مقوينك واللي مخالينك زى حته الحلاوة المزننخهوالله دوله الباطل ساعه ودوله الحق الي قيام الساعه"
