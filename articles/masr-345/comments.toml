subject = "الظالمون"
author = "زنوبه"
posted = "2006-05-19"
text = "ولا تحسبن الله غافلا عما يعمل الظالمون 42 {إبراهيم: 42}،<br />إنا أعتدنا للظالمين نارا أحاط بهم سرادقها 29 {الكهف: 29}.<br />ما للظالمين من حميم ولا شفيع يطاع 18 {غافر: 18}.<br />يوم لا ينفع الظالمين معذرتهم ولهم اللعنة ولهم سوء الدار 52 {غافر: 52}."
archived = "2006-09-05"
