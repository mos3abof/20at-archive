subject = "فرجه قريب"
author = "مقضيها نت"
posted = "2006-05-17"
text = "شكلك كده عاوز تتعرفى على فرج عموما بسيطة بكرة الخميس انزلى فى المظاهرة بتاعة القضاه واول ظابط تقابليه اضربية قلمين وانتى بعدها على طول هتشوفى فرج وابو فرج واخو فرج وام فرج وعيلة فرج كلها ويمكن الحى اللى ساكن فيه فرج ..<br />ربنا يكفينا شر فرج واللى مشغلينة الله يحرقهم كلهم !! معلش انا بهرج ربنا ينجحكوا ويبعد عنكم فرج بتاع الحكومة ويكرمكم بفرج الله . وفرجة قريب"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905071850/http://masr.20at.com:80/article.php?sid=345"

