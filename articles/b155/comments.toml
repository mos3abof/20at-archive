subject = "مفاجائة قوية"
author = "علي حسين الحافي"
posted = "2006-05-17"
text = "*** يا الله ندور على الارهابية العرب ونقبض عليهم مش هيعرفونا اسرائلين لانى ركبين جمال عربية زيهم وهلاء احنا رايحين على سيناء بس نروح طابا ولا دهب ***"
archived = "2006-11-02"
