[[comments]]
order = 1
subject = "الله محيي اصلنا"
author = "عرب ثم عرب ثم عرب"
posted = "2005-12-29"
text = "انا من عرب الداخل (عرب اسرائيل).<br />و بحيي كل الوطن العربي من مصر لبغداد<br />و من السعوديه لليمن و كل واحد شامي مسلم .......... الله يعين هاي الامه"
archived = "2006-11-02"
