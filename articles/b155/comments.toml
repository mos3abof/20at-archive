[[comments]]
order = 2
subject = "هموم عربية"
author = "محمد جوده"
posted = "2006-02-23"
text = "هناك القدس تبكي وتصرخ تهدد بالرحيل او بالبقاء....<br />لا يا قدس لا ترحلي فهناك كثير من الاوفياء....<br />ترد القدس انا غريبة واهلي يعيشون بي غرباء....<br />لا يا قدس لستي غريبة ابدا ولن نبقي جبناء....<br />فلو سمعكي صلاح الدين لبكي ويحق له البكاء....<br />ابكي صلاح الدين وابكي اروي بدموعك الصحراء...<br />هذا جزء من قصيدة كتبتها ارجو ان يوضح وجهة نظري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125622/http://www.20at.com/article2.php?sid=155"

[[comments]]
order = 3
subject = "فلسطين واحدة .. وان قسموها"
author = "طارق الكرد- القدس"
posted = "2006-03-30"
text = "ستبقى فلسطين .. فلسطين .. لن يغيرها شيء.. مهما بلغ التهويد .. مهما صارت تنازلات ستبقى ارض فلسطين وقفا اسلاميا الى يوم القيامة .. ولن نعترف بكيان اليهود لا الان ولا بعد حين . وانها دولة زائلة لا محالة.. فقد راينا الامم من قبلها تسقط وتتهاولا .. وان من ياتي الى بلادنا مصيره الانهزام و الاخروج هاربا في غيابة البحار .. لا اقولا متحمسا بل قانعا تمام الاقتناع ان امام الاحتلال الاسرائيلي.. خيار واحد هو الانسحاب والخروج من ارض فلسطين كل فلسطين .. من حيف .. من عكا .. من يافا .. من الناصرة الجليل.. المثلث.. رام الله .. الخليل .. بيت لحم .. القدس.. تاج وعروس فلسطين .. لن نرضى بوجودهم على ارضنا ، و المسالة مسالة وقت .. علينا بالصبر و الصلاة .. والمقاومة .. واذا لم تحرر بلادنا في زمننا لن نسلم ابنائنا واحفادنا هزيمة اخرى باعتراف بالاحتلال.. و الله مع الصابرين<br />بحبك يا فلسطين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125622/http://www.20at.com/article2.php?sid=155"

