[[comments]]
order = 6
subject = "نحن ونحن الصامدوم"
author = "منة الله"
posted = "2006-06-19"
text = "نحن تاعلرب الحقيقيون<br />وعلى الارض محافظون وباقون<br />وفي وجه الاعصار صامدون<br />اسمحوا لي لاتقولوا بامونا منشغلون<br />كلها شعارات ولقضيتنا بائعون<br />لا يعرف مدى معضلتنا ايها الذين يالشعارات تنادون<br />انتم وشعاراتكم لنا مضرون وغير نافعون<br />تقولوا تحبوا فلسطين وشعب فلسطين<br />وانتم اول اول من غرس السكبن في ظهورنا يا منافقون"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125622/http://www.20at.com/article2.php?sid=155"

[[comments]]
order = 7
subject = "خلفى يهودى فاقتلوه"
author = "سامى"
posted = "2006-07-31"
text = "يكفى أن أقول أن الاسلام أخبرنا أن اليهود سيقتلون على يد العرب ولن يستطيع يهودى أن يفلت حتى أن بعضهم سيختبىء خلف الصخرة<br />فتقول الصخرة خلفى يهودى أقتلوه وقد يكون هذا فى زماننا أو المستقبل المهم انهم سيتذوقوا ما أذاقوه للفلسطينين والعرب فأهلا بالاسلام"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125622/http://www.20at.com/article2.php?sid=155"

[[comments]]
order = 8
subject = "فلسطين عربيه"
author = "وليد"
posted = "2006-08-03"
text = "السلام عليكم ورحمة الله وبركاته<br />انا وليد من (( ارض الحرمين الشرفين المقدسه)) السعوديه<br />بس حبيت اقول فلسطين سوف تضل عربيه ثم عربيه ثم عربيه<br />ونرا من الذي سوف ينتصر بالنهايه<br />طبعا الكلام موجه لبعض الناس يعرفوا انفسهم....؟؟؟<br />نحنا فداااك يانصرالله نحنا جنود لك ياحزب الله<br />واخيييرا...اللهم اني رضيت بالله رب وبالاسلام دين وبمحمد نبي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125622/http://www.20at.com/article2.php?sid=155"

[[comments]]
order = 9
subject = "من انتم؟؟؟؟؟؟"
author = "عموور"
posted = "2006-08-07"
text = "من باب الفضول اريد ان اسال من هم ذو الذين يضعون الخوذ الاسرائيلية على رؤسهم في حرس الحدود الاسرائيلي؟؟؟؟؟<br />انهم؟؟؟؟؟<br />انهم؟؟؟؟؟<br />انهم؟؟؟؟؟<br />والاغلبية من عرب 48<br />لماذا؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟؟<br />اخبروني لوسمحتم؟؟؟؟؟؟<br />لما يخاف اهل فلسطين من الضفة والقطاع من عرب48 اكثر من خوفهم من اليهود؟؟؟؟؟<br />شكرا لكم قد صمدتم وبقيتم ولم تتنازلوا عن ارضكم لكن لو سمحتم اكملوا معروفكم ولا تطلقوا النار على دماء عربية وارواح عربية .........<br />تعليق صغير.... انا سوري ولي اقرباء كما يقال لي من عرب 48 ولكن؟؟؟؟؟؟؟<br />لن اقبل عمايحصل ولو كان من ابي"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125622/http://www.20at.com/article2.php?sid=155"

[[comments]]
order = 10
subject = "قلنسوة(عرب 48)"
author = "محمد"
posted = "2006-08-20"
text = "اولا قبل البدايه اريد ان اعلق على (من انتم) الي بتقول عنهم الي في حرس الحدود هدور دروز لانه الدروز مفروض عليهم ان يدخلوا اما نحن الاغلبيه في المثلث والشمال والجنوب مسلمين ولا ندخل الجيش ولكن نتمتع في العنصريه ونسبح في الكراهيه ونحلم التمييز انتي سوري فقير ما بتعرف ايشي عايش تحت حكم بشار الاسد ممنوع الكلام .احنا اجدع عرب نواجه الاحتلال ةالتمييز .<br />انت لا تعرف من عرب ال 48 لا تعرف توفيق زياد .ولا تعرف حنا نقاره محمامي الارض والشعب ولا تعرف توفيق طوبي ولا تعرف رائد صلاح. من تعرف انت ؟تعرف حافظ الاسد وبشار الاسد ومحمد حسني مبارك هههههه اجب اجب<br />ههههه احنا اجدع عرب مدافعين عن الاقصى كل يوم من بلدنا يخرج الى مسجد الاقصى قوافل الباصات لكي لا يخلى من المصلين بسبب الاحتلال ايها السوري"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102125622/http://www.20at.com/article2.php?sid=155"

