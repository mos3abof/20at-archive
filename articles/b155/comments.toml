subject = "هى كلمه ودايما بقولها"
author = "نيفين"
posted = "2005-12-27"
text = "اه يا وطنى هل اشكو العروبه ام اشكو لك العربا<br />سقوا فلسطين احلاما ملونه و اطعموها سخيف القول و الخطبا<br />بقوا على هامش الاحداث ما انتفضو للارض مسلوبه و العرض مغتصبا<br />نزار قبانى"
