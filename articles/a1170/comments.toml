subject = "الى الملحدين"
text = "يعنى انتم عايشين ليه بقى<br />علشان الاكل و الشرب و الجنس<br />طيب ما الحيوانات بتعمل كده كل ساعة ايه الفرق يعنى ساويتم نفسكم بيهم<br />مش كده و بس ده بعد ما تموت انت و هو حاتكلك الصراصير و الخنافس<br />مش كد و بس .<br />ده فيه يوم حييظهر فيه انت اتخلقت بنى ادم ليه مش حا قولك حايحصل لك فيه ايه علشان مش عايزين نحشر الإسلام زى ما انت بتقول.<br />نسيبك بقى تشرب و تنسى علشان متفكرش كتير<br />اعوذ بالله"
archived = "2005-06-02"
capture_url = "https://web.archive.org/web/20050602090455/http://www.20at.com:80/article.php?sid=1170"

[[comments]]
order = 17
subject = "اسأل مجرب"
text = "اكبر خطأ فصل الدين عن الدنيا ..امال احنا عايشين ليه ...ربنا خلقنا و نقوله لأ احنا هنعبدك في البيت بس و برة البيت مفيش دين ....مسلم يبقى لازم تكون مسلم بجد ...الدين هوه الاساس لكل حاجة و هو العمود الفقري لحياتك و لو انهار حياتك مالهاش لازمة لان الدنيا مش آخر المطاف و في آخرة مستنياك........<br />و أخيرا الناس اللي بتقول الموضوع هايف<br />لا و ألف لأ مش هايف عشان همه مش حاسين يعني ايه واحد يتحبس ظلم ...انتم مش حاسين بينا ...مش حاسين يعني ايه تصحى فجأة تلاقي والدك و اخوك اتقبض عليهم ظلم و التهمة نيتهم يعملوا مظاهرة ..اضحك ولا اعيط..<br />مش حاسين يعني ايه ناس يتقبض عليهم من الجامع ...و تبدأ سلسة التهم الغبية بتاعة امن الدولة...<br />مش لازم ربنا يبعت مصيبة عشان نفوق ...يا ريت تفوقوا من غير مصايب ................."
archived = "2005-06-02"
capture_url = "https://web.archive.org/web/20050602090455/http://www.20at.com:80/article.php?sid=1170"

