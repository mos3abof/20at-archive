[[comments]]
order = 13
subject = "التعلب"
text = "عايز منجه ياخد منجه..عايز فراوله ياخد فراوله..عايز فلوس ياخد فلوس...هو محتاج فلوس بصلى على النبي..ده بيركب ببلاش...ربنا يخليهولنا يارب ويكترله فيتاميناته ...اللهم كتر فيتامينات الرئيس...وأكله كباب وكفته طول عمره....عايز كباب الوحده ياخد ..عايز كفته الوحدها ياخد..عايز مشكل وماله...واديله سلطات على قد نيته..الهم اديله طحين...الهم اطحن الزعيم...الهم اكثر من بابا غنجه....واديله طرشي..اللهم طرشيه...اللهم فلفه وخيارله وجزرله..واديلي كل المشهيات يارب العالمين..واديله جرجير..اللهم جرجره بحق جاه النبي...<br />اللهم جرجر الزعيم القائد...واديله بطيخ..اللهم ما بطخه...اللهم ادي للزعيم بطيخ..و من غير بزر...لسه الريس هيقعد يتفتف ...وبتاع...فاضيين احنا للحاجات دي....الزعيم يلهط علطووووووووووول...<br />وابعد عنه الامراض المتوطنه...اللهم قلل من امساكه و اكثر من اسهاله..يخربيت الي بيكرهو..يخربيت الي بيحبه وهو جواه بيكرهوا...يخربيت الي بيحبوا وهو جواه بيحبه..وحنبيه واحد بيكرهوا...الزعيم القائد والثوره...يخليهولنا ويخليلنا جميع الزعماء...اللهم خليلنا جميع الزعماء والرؤساء................اديهم الصحه والعافيه.........<br />اللهم اخرب بيتنا احنا يا شيخ...اللهم ما موت الشعوب كلها في يوم واحد....عشان الرؤساء يصحوا الصبح...ما يلقوش شعب يحكموهم....يجيبو عقد عمل يروحوا السعوديه بقى....<br />اللهم افقرنا واغنيهم....الهم خد مننا واديهم...اللهم شلحنا وغطيهم....اللهم انفخونا وفسيهم...<br />أتمنى تكون عجبتكم.........<br />*مع تحيات التعلب...."
archived = "2005-06-02"
