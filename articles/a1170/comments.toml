text = "ي استاذى الفاضل احنا بنعانى من الفقرمن كل حاجة نفتقر الصدق والحق نفتقر للحكومة العادلة بكل الستف بتاعهادةوربنا يعدل الامور صدقونى انا فعلا زعلان للى احنا ةصلنالوة دةعلشان احنا مش عارفين نحكم انفسنا قبل ما نحكم البلد اصلى هى بلد ملهاش كبير<br />ابقو اكتبو للوزرا المرة الجاية بيقوا يفضوا البنوك من الللى هى فية علشان هى مش كد الحمل والطمع بتاعهمم دةاما بالنسبة للاحزاب فااحما بصراحة مسش عارفين ناحد حريتنا اصلى دى بلد الحرية ةالديمقراطية بامارة المعتقلات اللى ماليانة بيهة اخواتنا المصريين"
