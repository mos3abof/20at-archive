subject = "التعلب"
text = "اخرج من كوكارك..ارفع علمك اشعارك...بسلاحك صوتك شاري..راح نهتف لا لمبارك..<br />سرقو الشعب و ذبحوه..ولقبور الفقر جابوه...ولكل الدنيا باعوه..وصراخه كمان كتموه...<br />حكام بايعين الدين...وكمان أرض فلسطين...واليهود رايحين جايين..وفي طابا الناس شاهدين<br />ياويل حاكم بيخون..صوت سبعين مليون...هيهز حضاره الكون..ملعون الخوف ملعون...<br />المصري في بلده أسير..يا شعب صبرت كتيير..ارفع صوت التدبير...اليوم يوم التغيير...<br />اخرج من كوكارك..ارفع علمك اشعارك...بسلاحك صوتك شاري..راح نهتف لا لمبارك..<br />*مع تحيات التعلب"
