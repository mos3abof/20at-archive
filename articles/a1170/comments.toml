[[comments]]
order = 25
subject = "أحييكم يا رجال(نسأل الله الثبات)"
text = "السلام عليكم و رحمة الله و بركاته<br />جزاكم الله خيرا..يا رب صوتك يوصل للناس كلها و أصواتنا معاك..بس يا ريت يفهموا كلهم..أحسن أنا اللي بيغظني بقى..منعدمي الفهم اللي بيقاوحوا و بيحبوا يحسسوك إن هم فاهمين كل حاجة في الدنيا..و هما دماغهم فاضية من كتر الغسيل اللي إتعمل لدمغات الشعب..روح يا إبني ..ربنا ينصرك على من يعاديك"
archived = "2005-06-02"
capture_url = "https://web.archive.org/web/20050602090455/http://www.20at.com:80/article.php?sid=1170"
