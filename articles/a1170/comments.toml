text = "مهما فعلوا فلن يسكتوا صوت الحق ..<br />أشد ما يبهرني في هؤلاء أنهم لاعيبين من الدرجة الاولى في الخلط بين المصطلحات واللعب بها كيف ما شاؤوا والذي يريد ان يعرف ذلك جليا يتتبع اعلامهم عندنا في المغرب خاصة بعد احداث 16 ماي..<br />احيانا كثير احدث نفسي لو كانت عندهم هذه البديهة واليقظة في تمكين بلدهم اقتصاديا واجتماعيا لحصدوا الخير لانفسهم ولما اضاعوا الجهد هباءا منثورا<br />اختم بان الاخوان هم في مرحلة جديدة من مراحل مسيرة الاصلاح وهم اقل ما يمكن ان يحصلوا عليه من نتائج ان يقبل بالملف الذي قدم سابقا عن الحزب الاسلامي الجيد المنبثق عن بعض افراد الجماعة هذا ان استمروا في دعم المظاهرات واعطاءها طابعا شعبيا<br />هذا يبقى رايي والله اعلم وانتم اعلم ببلدكم<br />وتحياتي"
archived = "2005-06-02"
capture_url = "https://web.archive.org/web/20050602090455/http://www.20at.com:80/article.php?sid=1170"

