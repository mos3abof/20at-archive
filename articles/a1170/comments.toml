text = "مقال جيد . . يا إسلام<br />بداية أحب أن أقول أنني أقطن بجوار الدكتور عصام ، وأن الشارع الذي يسكن فيه يقف على ناصيته مخبر 24 ساعة فلا داعي للإقتراب<br />كما أحب أن أنوه عناية السادة القراء أن جماعة الإخوان خطيرة للغاية فهي تدعو لتحكيم كتاب الله ، وكذلك العمل بسنة رسوله وإعطاء المرأة حقوقها ، وإعطاء المسيحيين حقوقهم<br />لذلك فهي جماعة نازية فاشية ، لا تتمشى مع دستورنا الذي يحمل الإسلام دينا رسميا !!!!"
