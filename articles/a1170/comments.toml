[[comments]]
order = 6
subject = "ياعم اسلام يا لطفى...حزب ايه الى انت جاى تقول عليه"
text = "انا مش هتكلم عن رأيى فى المقال ولا طريقة الكتابة<br />هتكلم عن الفكرة نفسيها....<br />براحة كده ومن غير تهليل<br />حزب للتيار الاسلامى<br />فى شوية نقاط لازم نحطها فى الاعتبار<br />* اى تيار اسلامى فيهم الاخوان ولا السلفيين ولا الجماعة الاسلامية ولا الجهاد...<br />للعلم كل جماعة فيهم عايزة تعمل حزب مستقل عن التانى لأن احد المشاكل الرئيسية الى مخليه الحكومة المصرية متفرجش عن بعض القيادات الى تنتمى للجهاد والجماعة الاسلامية هى ان الداخلية و امن الدولة عايز ياخد عليهم تعهد بعدم ممارسة اى نشاط سياسى بعد الافراج عنهم و ده الى هما رفضينه نهائى<br />* لو هنفترض مثلاً ان الاخوان الى عمالين يهللو بأنهم اعظم الناس و اطهر الناس واجدع الناس وكلام فاضى كده و ملوش لازمة ميأكلش عيش فى سوق السياسة دلوقت...<br />مينفعش الاخوان يدخلو الحياة الحزبية و هما ركباهم الروح دى وكتير من الاخوان عارفين البلاوى الى فى التنظين بتاعهم و مغركمش مجموعة الاخوان الى بيطلعو فى التلفزين دى حاجة كده من على وش القفص اما الباقى فلامؤخزة عد غنمك يا جحا او مقسمين ما بين الموقوذة والنطيحة و المنخنقة وما أكل السبع...<br />مش كده ولا ايه ياعم اسلام<br />عمر الاخوان او التيار الاسلامى ما هيكون ليه شأن فى الحياة السياسية المصرية طول ماهما مبعترفوش بأخطائهم و بصين لروحهم على انهم ملائكة فى حين انك لو استعرضت الامور داخل الاخوان هتلاقى بلاوى يعنى هتلاقى الحرامى الى خد فلوس الجماعة و مش راضى يرجعها و بعض اللجان و المشاريع المفروض انها مشاريع دعوية او ملكية للجماعة يعنى مال وقف واتعملت بفلوس الاشتراكات بتاعة الاخوان وبعد كده اتحولت لعزب و ناس اشترت عربيات و شقق و اراضى ومدارس و حولتها لملكية خاصة...<br />ولما جت بعض القيادات المحترمة جوه الاخوان تسأل الفلوس دى فين ...<br />قالولهم أمك فى العش ولا طارت...<br />يا ياعم اسلام يا لطفى ...<br />دى اى محاولة من اى اخوانى جوه الجماعة يعنى مخرجش و لا فضح الجماعة و هياكلها على صفحات الجرايد اى محاولة لنقد الذات او تبصير الجماعة بأخطائها بتقابل بعنف و حزم غير عادية و بيتم تجنيب الاخوانى ده و حجزه و التتضيق عليه و دفعه دفع انه يطفش بره الجماعة .... كل ده و الراجل جوه الجماعة يعنى بينقد من الداخل<br />مش كده ولا ايه ياعم اسلام<br />علشان كده بقولك<br />احسن حاجة للاخوان انهم يفضلو زى ماهما كده وفى وضعهم الى هما فيه ...احسن اى محاولة لتوسيع دورهم اكتر من كده هتيجى بالبلا عليهم و على البلد...و ارجع تانى و اقولك<br />ياعم اسلام يا لطفى...حزب ايه الى انت جاى تقول عليه !!!"
archived = "2005-06-02"
capture_url = "https://web.archive.org/web/20050602090455/http://www.20at.com:80/article.php?sid=1170"

[[comments]]
order = 7
subject = "ملاحظات"
text = "نصيحة لغوية قبل البدء: في اللغة الغربية كلمة غير لا تأتي معرفة (ما لم تكن وحدها)، فلا تقل الرجال الغير محترمين، بل الرجال غير المحترمين.<br />ثانيا: ثبت الله سجين الرأي الدكتور عصام العريان.<br />الأهم: لا بد من النقاش على اساس الاحترام، حتماً لا بد من وجود كيان رسمي معترف به للاخوان المسلمين والشباب المسيحين، بغير ذلك سنظل ندور في حلقات دموية.<br />أرفض اعتبار وكلاء النيابة من الأعداء، بل يجب النظر إليهم على أنهم اخواننا في المجتمع..<br />وكيل النيابة طالع بوزه زي زيك طول النهار، بيحاول يعيش شريف، بس زحمة المواصلات وهدومه اللي دابت عليه مخلياه حينفجر.<br />الدكتور أيمن الظواهري كان من ضباط البوليس اللي حققوا مع رعيل الجهاد الأول، وانتهى الأمر بيه قائد الجهاد.<br />لو وكلاء النيابة شعروا بالأمل في حركة كفاية مثلا، حينقلب الأمر على الفرعون.<br />لو ضباط الجيش شعروا إن الوقت جه عشان يتحركوا وينحوا الملك - حيتحركوا.<br />حسني قال كلمة حق يحسد عليها، لا بد من وجود فكر سياسي منظم يرتب الأمور، وهو سياسته حالياً قائمة على عدم السماح لغيره بالظهور - ودا شيء طبيعي - أي حاكم/فرعون/سلطان/رئيس محنك مكانه كان عمل كده.<br />اعتقد ان لو جمال مسك البلد - الأحوال حتبقى أوسخ من أيام الملك فاروق - لأنه الجميل فكره رأسمالي - يعني بيزنس - فلوس - أرباح - قصور في فرنسا وحسابات في سويسرا وجاتوه للي مش لاقين لقمة عيش تسد جوعهم.<br />بس طالما إن احنا بنتفرج على أغاني النسوان العريانة، ونسهر في كازينوهات الخمرة والرقص البلدي، فمافيش خوف على نظام الحكم - لكن لما نبدأ نتناقض مع بعضنا ونعمل مظاهرات صامتة - كدة لازعم ندعم الخمرة ونطنش على شحنات الحشيش ونحرك الهز البلدي<br />مصري مطحون زيكم"
archived = "2005-06-02"
capture_url = "https://web.archive.org/web/20050602090455/http://www.20at.com:80/article.php?sid=1170"

[[comments]]
order = 8
subject = "ملحد"
text = "بالرغم من إني ملحد إلا أنني أتمنى قيام الأخوان المسلمين بإنشاء حزب سياسي.<br />فهي الطريقة الشرعية الوحيدة للتعبير عن أنفسهم بحرية. حيث أن الكبت يولد العنف.<br />بل و أتمنى أن يصلوا إلى الحكم فتلك الطريقة الوحيدة التي يستطيع الناس إختبارهم بها. فإن نجحوا في تحسين الأوضاع المعيشية و الحالة الإقتصادية و السياسية فهنيئاً لهم و لنا. أما إن فشلوا فمن حق الناس إختيار حزب آخر و هكذا حتى يصبح التنافس على السلطة أساسه الصلاحية في الإدارة و ليس الخلفية الدينية أو اللادينية.<br />سؤال هل يسمح الدستور بإنشاء حزب ملحد لا يعترف بالأديان؟<br />للمناقشة مع ملحد زر موقع اللادينيين العرب<br />http://ladeeni.net<br />لدينا أيضاًمسلمين لا يعترفون بالأحاديث (قرآنيين)"
archived = "2005-06-02"
capture_url = "https://web.archive.org/web/20050602090455/http://www.20at.com:80/article.php?sid=1170"

