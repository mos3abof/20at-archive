text = "وبعدين بقـة ف اللخبطـة دي<br />يعني الواحد لما المقال يعجبه مش هيبقى عارف مين كتبه ، عمومًا يا (هدى) مقال جميل :) بما إن اسمك عليه ، ولا أشكر عماد الدين أديب ....<br />بـس كنا عاوزين ( نعكـشـة ) أكثر من كده<br />أراكِ على خـيـر<br />إبـراهيم :)"
