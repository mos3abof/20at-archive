[[comments]]
order = 20
subject = "المقال ده عاجبني"
text = "الأخ الفرارجي اللي كتب تعليق كده من شويه أحب اوضح له إن الإخوان زيهم زى أى شريحة في المجتمع تحمل فكر معين و بالتالي فهم مش ملايكة و مش كل حاجه عندهم صح وعندهم أخطاء زيهم زى أى حد واللي ينكر كده فيهم يبقى غلطان ولكن علشان يبقى حكمك عادل اديهم حريات الأول و بعدين تعالى حاكمهم اديهم فرصة الأول وبعدين قيمهم.. يعني ما تقولش عليهم دكتاتوريين علشان مرشدهم واحد وانت مش مديهم فرصة أصلا يعملوا انتخابات .. ماتقولش عليهم حرامية من غير ما تحاسبهم حساب دقيق و تلاقي فعلا انهم بيسرقوا و هكذالما تيجي تتكلم عن حد خلي كلامك موضوعي حتى يكون قابل للتصديق و ياريت بلاش موضوع العشش و الفراخ ده...نرتقي بأسلوب كلامنا شويه ..."
archived = "2005-06-02"
capture_url = "https://web.archive.org/web/20050602090455/http://www.20at.com:80/article.php?sid=1170"

