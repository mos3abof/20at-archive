text = "السلام عليكم ورحمةالله وبركاته<br />سؤال وجيه : هل تقبل بحاكم كافر ، أو خارجى ظالم بدلا من رئيس ظالم ؟<br />الإجابة : امامك صدام ، وأمامك أمريكا ، وعليك أن تقرر ؟<br />والسلام عليكم ورحمة الله وبركاته"
