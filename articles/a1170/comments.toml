subject = "ملحد"
text = "زهقان من المسلمين اللي بيحشروا الإسلام في كل حاجة.<br />طهقتونا خللونا نتنفس<br />دا أنا كفرت بالإسلاممن عمايلك<br />م<br />نيابة عن أعضاء شبكة اللادينيين العرب و كل الملحدين بالعالم العربي أدعو كل من زهق مثلي للإنضمام إلينا بموضوعات جديدة بعيد عن سلطة الإسلامجية و الصـلبانيين و الصهاينة<br />عالم بل أديان<br />إنضم إلينا أو تواصل معنا بشبكة الليبراليين العلمانيين الملحدين الأحرار<br />http://ladeeni.net"
