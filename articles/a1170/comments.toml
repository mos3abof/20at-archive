text = "الموضوع جامد أوي وطريقة كتبته كويسه جدا جدا...<br />من كام يوم كده..كان الريس في حوار مع صحيفه كويتيه...قال فيه..ان هو لو ترك الرئاسه للاخوان...هياخدوها الى الأبد....<br />أمال هو بيعمل ايه حاليا...واخدها يومين وهيسيبها!!!<br />عموما كلنا لازم نقاطع الانتخابات لو الدستور ماتغيرش...وهي عموما مش هتفرق كله بيزور...بدستور ولا من غير دستور..."
