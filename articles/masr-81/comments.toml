[[comments]]
order = 0
subject = "منى محمد"
author = "بسم الله الرحمن الرحيم والله المناهج الى احنا بنخده دى معقدة فانا لسه فى اولى ثانوى وكراهه نفسى مابالك فى ثانية وثالثة هعمل ايه ربنا يستر بس المناهج معقدة كده ليه وليه كلها بتعتمد على الحفظ غير انها مش مفيده خالص فى الحياة الى احنا عيشنها وغير كده برده انها خالية من الدين الاسلامى نهائيا اول خطوة لازم تقوم بيها مصر من اجل النهضة هى اصلاح التعليم ووضع مناهج تنمى الذكاء والقدرة على التفكير وكمان تدعونا الى التمسك بدنا"
posted = "2006-03-28"
text = "mona_mohamad10@yahoo.com"
archived = "2006-05-24"
capture_url = "https://web.archive.org/web/20060524210625/http://masr.20at.com:80/article.php?sid=81&PHPSESSID=fa67b88393d9d5e656ddd51a44f821d0"

