[[comments]]
order = 4
subject = "امة اتربت على الخوف"
author = "المصري"
posted = "2006-06-30"
text = "يؤسفني جدا يا جماعة ان اقول اننا امة اتربت على الخوف والقهر. وانت صغير اوعى تتكلم لحسن المدرس يضربك, اوعى ترد على ابوك لحسن يضربك, في الجيش: اوعى تتكلم لحسن تترمي في السجن (كبر دماغك وعدي ايامك), في الشغل: اوعى تتكلم لحسن الحيطان لها ودان .. حسبي الله ونعم الوكيل. يعني من المهد الى اللحد. الأخطر في الموضوع دة هو ان لما بتطلع كدة بيكون عندك سقف للإبداع وحدود للإبتكار والتجديد. فخلاص امة بهذا الشكل كل سنة وانت طيب مافيش خلق ولا ابداع ولا اختراعات. وكدة تبقى صعت يا معلم وبقيت عالة على الناس التانية (اللي عندهم حرية). هذا هو الداء وهذا هو التشخيص وهذه هي النتيجة الحتمية."
archived = "2006-07-05"
capture_url = "https://web.archive.org/web/20060705101613/http://masr.20at.com:80/article.php?sid=584"

