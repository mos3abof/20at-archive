[[comments]]
order = 12
subject = "إلحق يا ريس البت جمالات هربت من جوزها .. جاتك نيله ريس"
author = "كاره الفساد"
posted = "2006-07-11"
text = "طبعاً الناس بتفرح وتهلل لما سيادة فخامة عظمته جلالة المفدى حسني مبارك يتكرم وتفضل مشكوراً محبوراً (مقبوراً قريباً جداً) ويتدخل بنفسه لحل قضية تلميذه ؟؟؟ ويتدخل لوضع قانون الصحافو ويتدخل عشان يرجع البت جمالات لجوزها بعد ما هربت وسابتله خمس عيال .. بذمتك إنته فاكر نفسك رئيس دوله كده ؟؟؟ ولا شيخ حاره ؟؟؟ طيب هي فين الدولة ؟؟؟ كلم يا حسونة حبيبك أحمد عز بيناديلك من الصبح يا أونكل يا أونكل .. كلم يا أونكل ... بصراحة البلد بقت زفت خالص وآخر هيافة ومسخرة .. الأفنديات الجهابذة فاكرين إنهم بكده يخلوا الريس الحبوب يبقى محبوب عند الشعب الغلبان .. الناس حتحبك بجد يا ريس لو فارقتهم وسبتهم يختاروا بنفسهم من يحكمهم .. لكن تفضل كاتم على أنفاس أمنا وكمان عمال تربي في الريس الصغير عشان يمسك بدالك ويستمر الفساد والسرقة والمليارات اللي بتتنهب من دم مصر .. كده باكرهك عمى .. ربنا يهد المفتري ..<br />http://ibnbahya.blogspot.com/"
archived = "2006-07-19"
capture_url = "https://web.archive.org/web/20060719124820/http://masr.20at.com:80/article.php?sid=584"

