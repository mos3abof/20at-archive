[[comments]]
order = 1
subject = "من جريدة المصري اليوم"
author = "محمد الشيخ"
posted = "2006-07-18"
text = "18-7-2006<br />واصلت محكمة جنايات المنيا نظر قضية مذبحة بني مزار التي راح ضحيتها ١٠ أفراد من ٣ أسر بقرية شمس الدين، وفجر طلعت السادات محامي المتهم مفاجأة بإعلانه أثناء المرافعة أنه تلقي اتصالاً تليفونيا من مصدر في الخارج ـ رفض الإفصاح عنه ـ أخبره أن الأعضاء البشرية للضحايا سافرت إلي إسرائيل وتم استخدامها هناك، لذلك تعاملت أجهزة الدولة مع القضية بأسلوب «ضرورة إغلاقها»، وأن مدير الأمن العام حضر من القاهرة خصيصاً لمقابلة والد المتهم وقال له بالحرف الواحد إنهم لن يتركوا مقاعدهم من أجل ابنه، وطمأنه بأنه سيتم الإفراج عنه في أقرب وقت لأنه مجنون<br />أوضح طلعت السادات محامي المتهم محمد علي عبداللطيف أن الأجهزة المسؤولة تعلم أن عمليات فتح بطون الضحايا تمت بواسطة شخص محترف، لذلك رفضت الإفصاح عن عن ذلك، وأنها أشارت إلي أن الأداة المستخدمة في الجريمة «سكين» وليس «مشرط طبي» لأنها قدمت متهماً لا يعلم شيئا عن احتراف الطب، وتم اقتياده إلي الشرطة، وأعطوه أنواعاً من «الحبوب الطبية» بالإضافة إلي الضرب والتعذيب، وقدموه للنيابة العامة علي أنه مجنون وسارت تحقيقات النيابة في هذا الاتجاه.<br />وتهكم السادات علي رواية العثور علي الأعضاء التي تم بترها، حيث ورد فيها أنهم عثروا عليها بجوار ديك رومي، فهل من المعقول أن يظل عضو ذكري بجوار الديك لمدة ٣ أيام دون أن يلتهمه؟ وأضاف أنه تلقي اتصالا تليفونيا من الخارج، كان الطرف المتحدث شخص مسؤول أكد له أن الأعضاء التي تم بترها من الضحايا سافرت إلي إسرائيل، وتم استخدامها طبيا هناك، وأن الأجهزة المسؤولة كانت علي معرفة بهذه المعلومات فتعاملت مع الحادث بأسلوب ضرورة إغلاقه نهائيا، وطلب الدفاع سماع أقوال والد المتهم."
archived = "2006-07-20"
