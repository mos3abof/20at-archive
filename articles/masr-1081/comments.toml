[[comments]]
order = 0
subject = "اكثر الله من امثاله"
author = "اشرف"
posted = "2006-10-22"
text = "اللهم اجعل احدى ولداى او كليهما مثل الشيخ فكرى وقر عينى بهما ياكريم امين اميييين"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061902/http://masr.20at.com:80/article.php?sid=1081"

[[comments]]
order = 1
subject = "بارك الله فيه"
author = "معاذ محمود عامر"
posted = "2006-10-23"
text = "هو شاب رائع وذو حس عذب بالفعل ونبرة صوته رائعة وموهوب بطريقة فذة<br />وما جذبني اليه هو صغر سنه<br />بارك الله فيه"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061902/http://masr.20at.com:80/article.php?sid=1081"

[[comments]]
order = 2
subject = "اوعو تقولو لحمدوف عليه"
author = "ايمن امام"
posted = "2006-10-24"
text = "السلام عليكم وكل سنه وانتم طيبين<br />انضم لفكره وضع مقطع صوتى لهذا الشيخ لكى ان نفرح بظهور رجل دعوه جديد - لكن لى اقتراح هو انكم ما تجيبوش سيره لحمدوف عليه لحسن الواد ياولداه يروح فى توكر والتهمه جاهزه دا بيدعى على اليهود / ايمن امام"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061902/http://masr.20at.com:80/article.php?sid=1081"

[[comments]]
order = 3
subject = "ممتاز يا ولاد البلد"
author = "معتز"
posted = "2006-10-24"
text = "أكثر الله من أمثالهم<br />ممتاز يا ولاد البلد<br />هؤلاء نماذج ينبغي ألقاء الضوء عليهم ليكونوا قدوة للشباب في زمن قلت فيه القدوات<br />ولا أعني فقط ألقاء الضوء على القراء والدعاة الشباب فقط وإن كانوا بالطبع مكانتهم عالية جدا<br />ولكن أيضا ألقاء الضوء على نماذج شبابية ناجحة في مجالات الحياة من طب وهندسة وعلوم ولغة وغيرها<br />وجزاكم الله خيرا"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061902/http://masr.20at.com:80/article.php?sid=1081"

[[comments]]
order = 4
subject = "اللهم أني أسألك"
author = "مروان المصري"
posted = "2006-10-24"
text = "اللهم أني أسألك أن تهدي والدي وتجعلهم مثل الشسخ فكري .................<br />اللهم أسألك أن تكثر من أمثال الشيخ فكري........ اللهم أسألك كل شاب مثله<br />..... الهم أسألك الأستجابة<br />بارك الله فيك يا شيخ فكري"
archived = "2006-11-06"
capture_url = "https://web.archive.org/web/20061106061902/http://masr.20at.com:80/article.php?sid=1081"
