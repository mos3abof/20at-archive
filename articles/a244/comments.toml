[[comments]]
order = 4
subject = "خديجة خديجة"
text = "ين قال ان أمن عائشة - مع كامل احترامنا لمكانتها في قلب الرسول - هي أكبر حب في حياته.. بين زوجاته وقت ما كان زوجها أيوا.. لكن - وعلى قوله - ما أبدله الله خيرا من خديجة.. ومحدش فينا يقدر يحكم.. مين الحب الأكبر.."
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803081635/http://www.20at.com:80/article.php?sid=244"

[[comments]]
order = 5
subject = "فكرت في كدة"
text = "فكرت في نفس المداخلة أمنا خديجة ولا امنا عائشة<br />لكن ما وصلتش لحاجة حاسس أصلا أن أمنا خديجة فعلا حاجة تانية خالص<br />كأني حاسس انها الزوجة والام لكن أمنا عائشة كانت الزوجة الحبيبة<br />بس برده مش عارف الموضوع عايز تفكير"
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803081635/http://www.20at.com:80/article.php?sid=244"

[[comments]]
