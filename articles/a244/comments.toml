[[comments]]
order = 7
subject = "خديجة وعائشة"
text = "الما هي كانت حاجة مختلفة.. يبقى محتاجين ندرك الموضوع ده فعلا.. أكتر من انناا نفكر.. يمكن احنا اللي المفروض نستوعب ان كل واحدة فيهم كان لها مكانتها الخاصة.. هم مش محل مقارنة.. لأن حتى ربنا سبحانه وتعالى ماوضعهمش الوضع ده.. كانت خديجة الواحدة.. وعائشة الأولى.. وقلب الرسول شال حب كبير وفريد للاتنين.. حب خلى كل واحدة فيهم سعيدة به وهو ده المهم.. ربنا يجمعنا بيهم.."
archived = "2004-08-03"
capture_url = "https://web.archive.org/web/20040803081635/http://www.20at.com:80/article.php?sid=244"

