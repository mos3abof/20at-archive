author = "عارفين الرد عليك"
posted = "2010-02-22"
text = "هيطلع واحد مطبلاتى وزمار من بتوع الوطنى ويرد على الكلام دة اللى بنسمعة من 30 سنة<br />الفقر سببة ان الملك مينا موحد القطرين كان بيحارب ومصاريف الحرب ايام الملك مينا من 10 الاف سنة هى سبب الفقر<br />اما البطالة فالناس بتخلف كتير وشغالين فى التناسل بس واحنا بنعمل برنامج فى القرية الذكية اننا نوصل التناسل والخلفة والعيال لمن يستحقها<br />هتلاقى مطبلاتية كتير وجهل كتير<br />وربنا معاك"
archived = "2010-02-25"
capture_url = "https://web.archive.org/web/20100225200743/http://20at.com:80/masr/hot-topics/15429-2010-02-22-03-53-25.html"

