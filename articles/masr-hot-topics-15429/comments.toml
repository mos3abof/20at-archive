[[comments]]
order = 5
subject = ""
author = "االامارات من اوروبا"
posted = "2010-02-22"
text = "الامارات من 30 سنة لم تكن شيئا تذكر<br />الامارات الان قطعة من اوروبا<br />ومبارك يحكم مصر من 30 سنة - عمل اية فى 30 سنة - خرب البلد - سوء ادارة - فساد - جهل - نهب منظم للبلد - انتشار الفقر والامية والبطالة<br />ومصر لما بتقع بيقوم واحد من عيالها<br />راجل زى البرادعى جاى من ابيار ولف العالم ولة علاقات مع معظم الرؤساء ومتعلم ومحترم يحاول ينقذ شىء ويرفع مع الشعب البائس اليائس حطام البلد العظيم مصر<br />نؤيدك يا برادعى<br />ربنا معاك يا برادعى<br />معقول 30 سنة وبلد 80 مليون مفيش فية غير سرور والشريف ويوسف والى والشاذلى والفقى وفاروق حسنى وحسنى وابنة ومراتة - هى دى مصر<br />اخية"
archived = "2010-02-25"
capture_url = "https://web.archive.org/web/20100225200743/http://20at.com:80/masr/hot-topics/15429-2010-02-22-03-53-25.html"

[[comments]]
