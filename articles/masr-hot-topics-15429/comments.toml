posted = "2010-02-22"
text = "بجد انا مبسوطة بكلام د البردعى ونفسى بجد التغير يحصل لان احنا كدة بنتاخر والحياة بتغلى والنهب بيزيد وعايزين نقول لمبارك كفايا عليك كدة بقى ومش عايزين ابنك كفايا بقى كتم على انفساسنا سيب غيرك يغير البلد معاك يابردعى"
