author = "وظيفة شاغرة"
posted = "2010-02-22"
text = "وظيفة رئيس الجمهورية فى مصر شاغرة منذ وفاة السادات<br />والقائم بالاعمال لهذة الوظيفة قاعد فى خلوة على الحدود فى منتجع سياحى يضم المواخير وصالات القمار والمراقص اسمة شرم الشيخ<br />ولنا اللة<br />واملنا فى رئيس مصرى مننا يحررنا من التبعية لامريكا واسرائيل ونشوف مصر حرة مستقلة<br />ونحل مشاكلنا"
archived = "2010-02-25"
capture_url = "https://web.archive.org/web/20100225200743/http://20at.com:80/masr/hot-topics/15429-2010-02-22-03-53-25.html"

