text = "كوبا دولة محاصرة اقتصادياً منذ 40 عاماً، ولكن نسبة الأمية فيها صفر، فيها أغنياء ولكن ليس فيها فقراء ولا شحاذون.<br />هذه العبارة تستلزم من المصريين ان يبكوا على ما وصلت اليه مصر ( ام الدنيا سابقا )"
