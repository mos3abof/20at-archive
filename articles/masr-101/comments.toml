subject = "بقيـة .. العائلة !!"
author = "جمال مبارك : 137 ألف مرة ( منهم35 مرة بصسغة ( اسمه جمال مبارك ) ومرة واحدة ( بحب) ..."
posted = "2006-04-02"
text = "في حين حصل ( علاء ميارك ) على 722مرة فقط !!<br />ـــــــــــ<br />جمال ( عبدالناصر ) : 331 ألف مرة ( ولاحظت أن هناك ناس \" تانية \" غير الريس ( اللاااااه يرحمه ) اسمها كده ، فقلت ...<br />الرئيس جمال عبد الناصر : 36300 مرة .. بس !! ، يمكمن عشان بيقولوا عليه ( الزعيم )599 أكثر !!!<br />على فكرة ( أياميه ) ما كانش في انترنت من أصله !!!<br />بس تخيلوا ( الرئيس ( الراحل) محمد أنور السادات ( ورد ذكره ) كام مرة ؟؟؟؟<br />ده أقل من علاء<br />حلوة فكرة الأرشيف دي :)<br />ثانك ألوت .... إبراهيم"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525015803/http://masr.20at.com:80/article.php?sid=101&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

