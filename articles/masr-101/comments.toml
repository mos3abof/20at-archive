text = "أنا خالد سيدالأهل المحامى بالأستئناف العالى ومجلس الدوله ومكتبى بمدينة منيا القمح شرقيه -مصر<br />احب اعرفكم إنى مليش اى علاقه بالأخين إللى قبلى دول وأعتقد إنه تشابه أسماء أو حد سرق الأميل الخاص بى واستعمله وأحيئ جوجل وكل مستخدمى جوجل"
