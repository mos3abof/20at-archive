text = "السؤال اللي طرح نفسه عليا وأنا بأقرا …<br />طيب ياتري ؟؟ تذاكر المسرحية بكام ؟؟؟<br />أصلي زي ما تقولوا كده .. طول عمري بأدخل سينما بس … لكن مدخلتش مسرح قبل كده …<br />يمكن لو اللي معايا ميكفيش … أروح أدخل سينما مترو بأفلامها القديمة تاني وخلاص …<br />ولا بلاها فرجة خالص لو مفيش جديد … كوباية عصير علي البحر عندنا هنا كفااااااااااااا اااااية<br />مش حاسكت برضه<br />لا للتمديد … لا للتوريث … نعم لتعديل الدستور المصري\" بس مش كده أوي يعني .. \"34\" مرة واحدة؟؟\"<br />دلوقتي تقدروا تروحوا هناك … وتشرفونا خلاص …<br />www.mesh7askot.blogspot.com<br />mohamedmat@hotm ail.com"
