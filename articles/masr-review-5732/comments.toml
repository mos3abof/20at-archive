author = "نيفين نيفى نوفا"
posted = "2007-05-06"
text = "ان جيت للحق يا براء مش حكايه لن سينما مترو حطت افلام جديده و لا لا و مش حكايه مسرحيه سقطت جماهيريا لكاتب كبير<br />الحكايه ان طول عمر المسرح مبيجذبش المشاهدين<br />ولو انت خارج مع 5 من اصحابك و سالتهم نروح مسرح و لا سينما اتحداك ان 4 منهم ان مكانوش كلهم هيقولو سينما<br />و لكن بعتبار انى من عشاق المسرح انا افضل انى اشوف مسرحيه نص نص عن انى اشوف فيلم من الافلام التيك اواى اللى بتعرض حاليا<br />من ضمن كاااام فيلم بتشوف فيلم واحد كويس؟<br />و حتى ف وجود الفيلم الكويس لو تخيرنى اشوف الفيلم ده و لا جزء من مسرحيه لمحمد صبحى مثلا هختار صبحى اكيد<br />ناهيك بقى لو المسرحيه ادب عالمى<br />انسى"
archived = "2009-09-03"
