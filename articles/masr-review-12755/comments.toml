author = "اهلى يا اهلى"
posted = "2009-07-26"
text = "النادى الاهلى نادى افريقى<br />يعنى يلعب مع الافريكان بس<br />لان مستواة مستوى افريقى<br />لما يلاعب احقر نادى فى اوروبا هيهزا الاهلى ويطلع عين امة<br />لازم نبقى نفهم مستوانا واحنا مين<br />تعبان يا قلبى<br />وبعدين مش معنى الرياضة هى اللى هتنفع فى الفساد دة"
