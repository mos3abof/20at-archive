[[comments]]
order = 5
subject = "ياعيش مبارك حبيب الملايييييييييييييين"
author = "عيل ضايع"
posted = "2006-06-19"
text = "ياعيش مبارك اه شردنا وبعناوخلاص بس احنا حمير مش فاهمين حاجه مهى ده ياجماعه بلده جنسيه مبارك مصرى وجنسيه السبعين مليون عبيد والحمدلله ان مبارك باع البلد مش لغرب بعها لجمال وسوزان وشيخ البلد صفوت العميل والعجل الشازلى شيخ الغفر<br />ارحمنونا ياولاد الكلب ياعجول ياظلمه"
archived = "2006-06-20"
capture_url = "https://web.archive.org/web/20060620061517/http://masr.20at.com:80/article.php?sid=508&PHPSESSID=21c1da686e11b97f5ce68fa71c774ee1"
