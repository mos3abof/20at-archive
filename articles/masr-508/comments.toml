[[comments]]
order = 1
subject = "حسني باع مصر"
author = "أمير"
posted = "2006-06-12"
text = "سمعنا إن الريس كتب مصر لأبنه جمال بيع و شرا بعقد بيع ابتدائي..وأن إجراءات إعداد عقد البيع النهائي ماشيه علي قدم و ساق ... و سوف يتم توثيق البيع في مكتب التوثيق النموزجي بمجلس الشعب الموقر ( الشهير بسيد قراره ) .. حصل و لا محصلش لسه؟؟؟ أظنه حصل ...أفيدونا أفادكم الله."
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010154/http://masr.20at.com:80/article.php?sid=508"

[[comments]]
order = 2
subject = "مطلوب مقصدار"
author = "ابو شريف"
posted = "2006-06-13"
text = "في ظل الاحداث المتلاحقة حاليا سوف يتم الاعلان قريبا عن وظيفة شاغرة بمجلس الشعب سابقاً ( سيد قراره حالياً ) يكون قادرا علي قص ولزق قانون كل ساعة بشرط أن تكون الثقوب واضحة جدا للحكومة الذكية وأبيض أمام الشعب المصري وسوف يتم تحديد نسبة العمولة طبقاً للقانون الذي سوف يتم تفصيله وأهميته ، وسوف يتم تقديم الطلبات علي العنوان التالي : -<br />كوبري القبة - رئاسة الإمبراطورية المباركية - حسني مبارك<br />أو علي العنوان الدائم للإمبراطور : -<br />شرم الشيخ - منتجع أم سمسم<br />حسبي الله ونعم الوكيل فيكوا يابعدا"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010154/http://masr.20at.com:80/article.php?sid=508"

[[comments]]
order = 3
subject = "حسبنا الله و نعم الوكيل"
author = "امه الله"
posted = "2006-06-13"
text = "السلام عليكم و رحمه الله و بركاته<br />اوعى حد يفتكر ان اللي اتسبب في موت الف بني ادم او عدد اقل غرقا او حرقاعملته دي هاتعدي كده.<br />لأ لأ لأ<br />اذا كان المسئول عن البلد ميعرفش العدل<br />فالمسئول عن الكون كله اسمه العدل<br />ربنا مش هايسيبه<br />اذا كانت الحكومه هربته هو وامثاله من اللي بيظلموا و بياكلوا حقوق الناس<br />هيروح فين من ربنا؟؟<br />هايهرب؟؟؟<br />كده كده هايقابل ربنا غصب عنه و لوحده و يبقى يخلى \"حد\" ينفعه<br />و ياريته كان اخد عقابه في الدنيا كان هايخف عنه شويه من بتاع الاخره بس هوه ما حسبهاش صح لا هوه و لا اللى هربوه لانهم شالوا معاه الوزر بتاعه و اهالى الضحايا بقولهم ان النبى عليه الصلاه و الاتم قال ان الغريق شهيد و ان الحريق شهيد فموتاكم ان شاء الله شهداء الان\" احياء عند ربهم يرزقون \" و اللي ظلم مش هاتعدي بسيطه كده لأ<br />هو حد عارف هو حاسس بايه دلوقتي؟؟<br />دي القلوب بايد ربنايمكن يكون دلوقتي بيتعذب باي حاجه<br />اللي عايزه اقوله كمان لاهالى الضحايا<br />ان الدنيا كده كده هانسيبها بعد ايام او شهور او حتى سنين و انتم اولادكم و اخواتكم سابوها في ميعادهم اللي ربنا كاتبهلهم بس سابوها باذن الله شهدا و ده شرف<br />ربنا يصبركم و يا رب يفرج كرب المكروبين اجمعين<br />و حسبنا الله و نعم الوكيل و جزاكم الله خيرا"
archived = "2006-06-15"
capture_url = "https://web.archive.org/web/20060615010154/http://masr.20at.com:80/article.php?sid=508"

