[[comments]]
order = 1
subject = ""
author = "جيمي"
posted = "2009-11-17"
text = "ما اعتقدش أنها فكرة صائبة أن عبد الظاهر يلعب .. وده مش تشكيك في خبرته في المكان ده .. بس مش عارف ليه حاسس أنه مش قادر يتعامل مع أسلوب الكرة السريعة .. أو انه هو بيلعب بدماغ و الباقي كله بيلعب بدماغ تانية خالص .<br />والخطة حلوة .. بس أعتقد انه لازم يميل ناحية الدفاع اكتر … يعنى تبقي<br />3/5/2 بشقها الدفاعي وليس الهجومي .<br />الماتش اللى فات أستغربت حاجة غريبة اوي … أن عمرو زكي كان بيروح يرفع الكورة من على الجنب … طب هو المفروض كان مين يحطها .. هتقولى زيدان .. زيدان ماينفعش كألعاب هوائية وسط مدافعى الجزائر لأنهم كلهم طوال .<br />ولو حد يعرف يوصل صوتى للمعلم .. يقوله أن الماتش اللى فات اثبت أن الكور العالية معظنها مش من نصيبنا .. وان أحنا لما بنلعب على الأرض بنكون الأحسن والأفضل في السيطرة و المهارة .<br />ويعلم اللعيبة أن يبقى فيه مليون طريقة تانية .. نجرب واحدة مانفعتش ننقل على اللي بعديها على طول .. وناخد أماكن جديدة ونعمل الكور بشكل مختلف بخيث أن سعدان مايقدرش يثبت على طريقة معينة للعبنا علشان مايعرفش يتصدي ليها ."
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119040203/http://www.20at.com:80/masr/hot-topics/14081-2009-11-17-16-39-46.html"

