author = "youssef elmasrawy"
posted = "2009-11-17"
text = "يا جماعة احمد حسن يا ريت ينزل الشوط الثانى و ننزل المحمدى و بلاش زيدان و يا ريت المتعب عماد متعب وعبد الظاهر يريح و عبد الفضيل ينزل و ان اتمنى النصر لمصر هبة اية هباة اة انشاء الله هانكسب 2/1قولوة يا رب و بلاش 352خليها وائل و عبد افضيل مساكين ةو هانى لبروة خلية المحمدى و حسنى وراة نص الملعب و يراقبوة الخطوط الى ورا و ابو السيد و ابو الفتوح خليهم منطلقين للأمام و ابو تريكة البركة يلعب على ذكى و متعب فى الاماكن الواسعة و الحضرى يعمل الى علية و خلوها3412او 343 يا ربمصر تكسب يوسف المصراوى"
archived = "2009-11-19"
capture_url = "https://web.archive.org/web/20091119040203/http://www.20at.com:80/masr/hot-topics/14081-2009-11-17-16-39-46.html"

