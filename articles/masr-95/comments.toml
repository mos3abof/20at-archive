text = "فعلا مفيش تعليق<br />ما هما شباب الشعب المصري<br />تلات ترباعهم كده<br />وربنا عالظالم و المفتري اللي كانوا السبب<br />واخص بالذكر الحكومه المصريه<br />وعلي راسها<br />الراس الكبيره المسرطنه<br />حسني مبارك<br />ويا ما لسه هنشوف"
