[[comments]]
order = 17
subject = "فعلا موضوع هايل"
author = "واحد من التافهين"
posted = "2006-04-10"
text = "بصراحة موضوع هايل جدا ومعبر للغاية عن واقع الشباب المصري كله انت فعلا كتبت كل اللي جوانا وان شاء الله ربنا يوفقك يا ايهاب بس الحتة اللي غيظاني اوي هي الجزء المكتوب عن الزمالك ده\"فهي حكاية تقترب في تفاصلها مع معجزة عصا موسى عليه السلام\" ازاي يشبهوا لعب الكورة بمعجزة إلاهيه لأحد المرسلين اللهم لا حول ولا قوة إلا بالله وإنا لله وإنا إليه راجعون<br />علشان كده يا جماعة انا مابقرأش الجرايد لأنها فعلا بتزيد من تفاهتنا وغير كده بتقلل من الإيمان لما يوصلوا الكورة للنبوة ولا ايه؟"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022927/http://masr.20at.com:80/article.php?sid=95&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

