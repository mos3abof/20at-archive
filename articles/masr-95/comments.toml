[[comments]]
order = 13
subject = "ربنا يهديك ياايهاب"
author = "أيمو"
posted = "2006-03-31"
text = "الموضوع حلو وشغال<br />بس فيةجمل كتير ان دلت على شىء تدل على قلة ايمان اللى كتبها..لان ربنا اللى بيرزق ويحكم وقادر على كل شىء<br />وعارف ومتأكد ان الكاتب كان يقصد فقط السخرية من اوضاعنا الحالية وهى فعلا كارثة اللى احنا بنعيشة<br />بس ياريت قبل ماتكتبو وتنشرو.. تفكرو كتير فى الكلمات اللى ممكن تضل اكتر ماتهدى<br />ياشباب احنا عايشين فى مجتمع منيل بستين نيلة بس مش هانقضيها شتايم وسخرية وخلاص<br />لازم نغير وانا مش قصدى نقتل ونضرب لا انا قصدى ننصح ونرشد ومنغطيش الفساداللى نشوفة(الشيطان ضعيف) ونبدأالتغيير بانفسنا.<br />اللى مبيصليش يفتكر قبرة.واللى بيخاف من حاكم ظالم يدعى ربنا ينصرنا علية واللى بتمشى من غير هدوم تعرف ان كل عين هاتشوفها هاتشهد عليها. واللى مزاجة جايبة لسجارة يشم ريحة بقة وهو بيصلى جماعة ويتكسف على اهلة.<br />ياجماعة واللة احنا اللى بنعقد نفسنا بنفسنا بالكلام التافة وكلام القهاوى و(مفيش فايدة) الراجل بجد لايمكن يقول مفيش فايدة.. ولا احسن يغير بطاقتة ولا يترمى جنب الحيط وياكل على قفاة ويسكت"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022927/http://masr.20at.com:80/article.php?sid=95&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

