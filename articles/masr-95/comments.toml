[[comments]]
order = 9
subject = "جعلونى تافهاَ"
author = "ايهاب على"
posted = "2006-03-31"
text = "فى الحقيقه انا عمرى ماكنت باعرف أكتب أو بحب الكتابه (حتى مواضيع التعبير فى المدرسه) بس هى خرجت كده نتيجه تزايد الضغوط النفسيه<br />24 ساعه تحت ضغط نفسى وحواليك ناس مغيّبه فى منتهى التفاهه بيضغطوا عليك من الناحيه التانيه – كأنك فى فيلم \"\"Truman show أو فى الكاميرا الخفيه ومستنى إبراهيم نصر يطلع يقولك عايز تذيع قول ذيع ، بس مبيطلعش ..<br />فى تعليقات كتيره افتكرت انى بقصد الحكومه هى السبب وهما اللى جعلونى ، بس فى الحقيقه فعلاَ كل حاجه حواليك بتضغط عليك .. مش عايز اقول إسرائيل و مخطط و الكلام الكبير ده .. يمكن يكون ليهم دور ، بس 90% من المشكله سببها الناس ( ضعف العلاقات الأسريه ، ضعف الأيمان ، الأحساس بالوحده والفراغ ، عدم وجود هدف ) .. كل دى مشاكل سببها الناس أدت للحاله دى .. أنا معنديش حلول بصراحه للمشاكل دى .. بس حاول .. و ربنا يفرجها من عنده<br />أنا سعيد جداَ بكل تعليقاتكم<br />شكراَ للموقع عشان نشر القصه .."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022927/http://masr.20at.com:80/article.php?sid=95&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

