[[comments]]
order = 5
subject = "فعلا انت تافها.بلا شك"
author = "عقلاني"
posted = "2006-03-30"
text = "لو ملكش في الحريم ولا الحرام.يبقي انت محترم.والناس بتوع الايدي الخفية هيلعبو في دماغك.<br />ممكن أعرف مين الايدي الخفيه\"الناس اياهم\" ؟ اللي هيلعبو في دماغ الواحد ويقولوله صلي.حسن من نفسك.ابقي بني ادم واختار الحاكم اللي يحترمك. ليه مسميهم اياهم! يعني ايه اياهم.ويعني ايه يلعبو في دماغك! هو بتاع الحريم والخمرة والحشيش مش ملعوب في دماغة.وهو دلوقتي الانسان السوي.والمحترمين ملعوبين في دماغهم!<br />يعني ايه رزق الهبل علي المجانين يا مهندس. مين رزقو علي مين!<br />مين مقسم الأرزاق. ربنا هو اللي بيرزق الطائر والحيوان والانسان سواء اهبل او مجنون كمان.مين بقي المجانين اللي بيرزقو الهبل!<br />طيب هقولك الله يرحم.تقدر من 10 سنين كنت تقول علاء وجمال مبارك دخلو الجيش؟ هقولك الله يرحم والديك.وان كنت نسيت اللي جرى."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022927/http://masr.20at.com:80/article.php?sid=95&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 6
subject = "الى الأخ عقلانى .."
author = "واحد تافه .."
posted = "2006-03-30"
text = "تعليقك غريب ويدل على قصور فى المخ (مش عقلانى خالص ) واضح انك مفهمتش اى حاجه من اللى مكتوب ..<br />\"ممكن أعرف مين الايدي الخفيه\"الناس اياهم\" ؟ اللي هيلعبو في دماغ الواحد ويقولوله صلي\" .. ايه ده !!<br />انت بتقرا عربى مكسّر ؟<br />\"ابقي بني ادم واختار الحاكم اللي يحترمك. ليه مسميهم اياهم! يعني ايه اياهم.ويعني ايه يلعبو في دماغك! هو بتاع الحريم والخمرة والحشيش مش ملعوب في دماغة.وهو دلوقتي الانسان\" .. ايه ده<br />السوي.والمحترمين ملعوبين في دماغهم!\" .. ايه ده؟!<br />ياعم العربى بيتقرى من اليمين للشمال .."
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022927/http://masr.20at.com:80/article.php?sid=95&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

[[comments]]
order = 7
subject = "مسلمه"
author = "الحقيقه الموضوع اجمل من رائع"
posted = "2006-03-31"
text = "وحقيقى المحترم مبيلقيش حته يروح فيها واضف كمان المحترمه<br />تعرفوا انا بقالى فتره نفسى البس النقاب وابطل افكر فى الدنيا لكن للاسف هى مش سايبانى<br />اجيب طقم روش كده وحركات بعدين اقول انا جبته ليه واروح جايبه عليه طرحه طويله تطلع شيفون وبشاشيب اقول بقى خلاص المره دى وكمان انا لازم البس اللبس الجميل ده اللى كله ذوف زييييييييييي وهكذا بلا توبه<br />واقول انا احسن من بنات كتير انا محترمه وفى حالى\"يعنى مش بتاعة ولاد\"<br />بس الروشنه دى علشان انا صغيره وكده بقى الشيطان شغاااااااااااااااااال<br />ربنا يهدينا اللهم اهدى شباب المسلمين اللهم فتيات المسلمين اللهم ردنا الى دينك مردا جميلا"
archived = "2006-05-25"
capture_url = "https://web.archive.org/web/20060525022927/http://masr.20at.com:80/article.php?sid=95&PHPSESSID=0e02dd3f354a18347b48eef338f41d4d"

