text = "Hi Ihab;<br />Sorry I cannot write in arabic, but the story is great, I really loved it<br />Yet, I have 1 main comment on it. You know what shcuh case is named, no not paranoia, you can name it mentally crippled. Do not feel bad, but this is the problem itis exactly what they wantus to feel and be.<br />If you are Mentally crippled you will say besholah mafesh faydah, and get drepressed anf forget about what change, time, future, and all these nice terms.<br />I know that situation most of the times is so depressing, but beleive me we need to change this attitude.<br />We need to tell people stories of people who fought and made a differance. I know at least a list of thopusands of people who started in a way worest stituationa nd they are away better now (no no men gher korod)<br />Guys, We need to change our attitude before it kills us..<br />Finally, and lel2asaf, I agree that moslty every single word u said is 100% true. Yet, we need to stand for Us or just die"
