author = "شرين (ام فريدة)"
posted = "2007-03-15"
text = "بصراحة فعلا الموضوع ده حلو جدا وياريت فعلا يا بنات تعملوا بالنصيحة ديه انا مكنت بسمع كلام ماما لما كانت بتقولي متكتريش من الحاجة بكرة حتزهقي من كل الحاجات ديه وتبئي عاوزة تغيريها وفعلا حصل انا بقالي سنة و3 شهور متجوزة واكتشفت ان في حجات كتير بندفع فيها مبالغ كبيرة وهي مش بالأهمية الفظيعة اللي بنكون مدينهالها زي مثلا طقم الصيني مفتكرش اني طلعته في خلال السنة ديه غير مرتين مرة في عزومة اهل جوزي ومرة علشان انضف التراب ا للي عليه وبعد كدة طنشته تماما في حاجة كمان مش مهمة خالص مفرش السرير ده بندفع فيه فلوس كتيرة وفي الاخر بيتفرش بالكتير اوي اول شهر وبعد كدة بالسلامة علي فوق الدولاب ، ودلوقت زهقت من الملايات بتاعتي وعاوزة اجيب غيرها بس للأسف خلاص نو مني اني موووووووووور خلصتهم علي الجهاز والحمد لله وفي حاجة كمان اللي مش حتجيبيه دلوقت حتلاقي احلي منه بعدين متسمعيش كلام اللي يقولولك اللي مش حتجيبيه قبل الجواز مش حتجيبيه بعده الكلا ده غلط جدا لان الموديلات بتباي احلي بعدين وربنا ييسر لكل المخطوبين ويسهل للي لسة متجوزوش"
archived = "2009-05-11"
capture_url = "https://web.archive.org/web/20090511180424/http://www.20at.com:80/7ayatna/3425.html"

