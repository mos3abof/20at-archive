text = "lموضوع هايل بجد يا دعاء روحك فيه حلوة وكمان الملومات قيمة ومفيدة فعلا ياترى ممكن نعرف في موضوع تاني ايه الحاجات بالتفصيل اليالواحدة محتاجاها فعلا اصل انا بصراحة على وش جواز واتدبست في نص الحاجات اللي انت قلتي متيجبوهاش اعمل ايه بقى<br />انا اتجوز في شهر سبعة الجاي"
