posted = "2009-07-11"
text = "منى زكي تافع عن مشاهد ساخنه<br />شهد العرض الأول لفيلم 'احكي يا شهرزاد' زحاما إعلاميا شديدا وحضورا واسعا لعشرات القنوات الفضائية التي سعى كل منها للحصول على انطباعات الحاضرين ، وأغلبهم من النقاد والصحفيين ، على الفيلم.<br />وغاب النجم أحمد حلمي الذي تم الترويج بشكل واسع لحضوره للرد على شائعات طالت زوجته منى زكي بطلة الفيلم بالإعتماد على العري والمشاهد الساخنة<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــ<br />اعلامنا فاشل وشعبنا فاشل<br />الشعب مسكين مش لاقي يتجوز الجواز اصبح في الاحلام فقط<br />يبقى لازم نستغله علشان خاطر نعمل الملايين<br />ونجيب واحدة ساقطه تقدم مشاهد جنسية ساخنه<br />علشان الشعب يخرج ويجري على الحمامات للاستمتاع ولو للحظه<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــ<br />لعنة الله على اكلي مال الشعب ومستغلي خيبة الشعب"
