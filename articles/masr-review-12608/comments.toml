text = "وغاب النجم أحمد حلمي الذي تم الترويج بشكل واسع لحضوره للرد على شائعات طالت زوجته منى زكي بطلة الفيلم بالإعتماد على العري والمشاهد الساخنة لاستعادة بريق نجوميتها التي يتردد انها خفت في العامين الأخيرين.<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـ<br />الفنانين بتوعنا عاهرات وقوادين للاسف<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــ<br />زمن افن الجميل<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــــــــ<br />مش ححبك"
