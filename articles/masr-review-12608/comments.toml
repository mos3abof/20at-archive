author = "احمد حلمي ركب قرون"
posted = "2009-07-11"
text = "قال الرداد: وافقت على الفيلم قبل قراءته، لأن العمل مع مخرج بحجم يسري نصر الله شرف لي ولو في مشهد واحد، فهو علمني كيفية التعامل مع الكاميرا وقراءة ما بين السطور، حسب صحيفة \"وشوشة\".<br />وتابع: كما ساعدتني منى كثيرا، وكانت متعاونة معي إلى أقصى درجة، وكانت دائما ما تنصحني وتوجهني، خاصة وأنا متوتر في بداية التصوير.<br />وعن الانتقادات الموجة له ولمنى عن مشاهدهما الساخنة قال حسن: تردد أن هذه المشاهد ضايقت الفنان أحمد حلمي، وهذا غير صحيح على الإطلاق، لأن المشاهد موظفة جيدا في السياق الدرامي، كما أنها جاءت خفيفة، وربما تكون جديدة وغير مألوفة من منى، لكنها في النهاية فنانة ذكية تعرف كيف تختار أدوارها التي تناسبها في"
