author = "احكي يا شهرزاد"
posted = "2009-07-11"
text = "ايرادات الفيلم 12 مليون جنيه في اسبوع<br />\" الفيلم واقعي وجريء حيث يتناول عددا من الحكايات النسائية تعبر عن حالة الازدواجية والتناقض الذي يعيشها المجتمع، فالفيلم يكشف عن أساليب القهر الذي يمارسها بعض الرجال على بعض النساء ما بين قهر فكري وسياسي واجتماعي وجنسي أيضا \".<br />وعن الحملة التي شنت ضد مني زكي بسبب مشاهدها الساخنة وملابسها المثيرة بالفيلم قال: \" لا أريد الحديث عن تلك المهاترات وكل ما استطيع أن أقوله أن مني زكي ممثلة موهوبة والفيلم يعيد اكتشافها من جديد \".<br />ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ـــــــــــــــ ــــــ<br />اصحا يا شعب عيب كده لما ياخدوا منك فلوسك علشان خاطر شوية مشاهد جنسية يا شعب<br />اصحا يا شعب عيب كده لما الكلاب تغتني على قفاك يا شعب وهما يبقوا معاهم ملايين وانت تفضل مفلس على طول<br />اصحا يا شعب<br />_______________ _______________ ________<br />مش شريف الدواخلي ولا البراء اشرف"
archived = "2009-07-13"
capture_url = "https://web.archive.org/web/20090713043241/http://www.20at.com:80/masr/review/12608-2009-07-11-08-08-48.html"

