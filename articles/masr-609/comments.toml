subject = "ببساطه شديده"
author = "مهند فريد"
posted = "2006-07-06"
text = "حضرتك ياللي بتتكلم عن السبوبه ماخدتش إذن منا بنشر شغلنا ، و من الآخر ايوه هيا سبوبه و رزق للعاوز يشتغل، مش للقاعد مش لاقي حاجه يعملها غير إنه يستنفع علي قفا غيره ...<br />و ياريت تخللي عندك دم و تشيل شغلنا من علي الموقع بتاعك فورا ، و إنت حر تكتب إللي إنت عاوز تكتبه ... أو تحط لينك ... بس كده..."
