subject = "البنات هم السبب وبلذات ابوظبى عن تجربة"
author = "برجركينج"
posted = "2006-06-12"
text = "البنات يلحقونك مع السواق واذاماوقفت تنصدم وتصيرمشكلة ثانية بس اناوقفت وشفتهم بنات زى العسل بس الحاجة اللى مااعجبتنى حاطين حنا فى ايديهم ورجليهم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134154/http://www.20at.com/article2.php?sid=875"

[[comments]]
order = 11
subject = "ايوة كدة فوقو"
author = "سارة"
posted = "2006-07-15"
text = "ان مع العقوبة دى بالتاكيد بس انا بردوا مع اللى بيقول ان البنات لازم تلم نفسها الاول لان اذا ملمتش نفسها يبقى الطين هيزداد بلة وتبقى البلوى بلوتين لان الراجل مهيبص هذا لاقى البنت مستورة ومحترمة نفسها ويارب استر عورات المسلمين"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134154/http://www.20at.com/article2.php?sid=875"

[[comments]]
order = 12
subject = ": \"التجريس\".. عقوبة المعاكسة"
author = "هبهوبة"
posted = "2006-07-15"
text = "ياريت الأمر ده يطبقوه في مصر عشان الماعكسة ما بقاش يقوم بيها شباب صغير وبس بل أنك تجد راجل شايب وعايب وبيعاكس لاهواحترم سنه ولا عياله ولازوجته"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134154/http://www.20at.com/article2.php?sid=875"

[[comments]]
order = 13
subject = "ما ينفعش في مصر!"
author = "قشطة"
posted = "2006-07-16"
text = "لو القانون ده اتطبق في مصر، الجرايد هتبقى عبارة عن فضايح ومعاها ملحق فيه الأخبار العادية<br />الشباب مش لاقي يتجوز، والبنات مش قادرين يلموا نفسهم والاتنين ما عندهمش لا أخلاق ولا حبة دم"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134154/http://www.20at.com/article2.php?sid=875"

[[comments]]
order = 14
subject = "تجريش البنات"
author = "الطويل"
posted = "2006-07-26"
text = "الرجل دائما يكون من حظه البهداة الكبيرة ماالبنت تخرج الى الشارع بكل مفاتنها من اجل زبون يتابعها واذا نطالب بتجريش معتبر لكل مايلة مميلة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134154/http://www.20at.com/article2.php?sid=875"

[[comments]]
order = 15
subject = "و النبى مش مكسوفين"
author = "مواطن عادى"
posted = "2006-07-29"
text = "و النبى مش مكسوفين و انتو بتقولوا يحاسبوا البنات و يلموهم.مش قادر تمسك نفسك يا افندى لما تشوف واحده حلوه و لا جسمها حلو,يا اخى سيبها و امشى مش لازم تبصبص و تبحلق و بعدين تقول احنا شباب و مظلومين,دى حريه شخصيه و الجزاء فى الاخره عند ربنا مش عندكو يا فطاحل امسكوا انتو بس نفسكو"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134154/http://www.20at.com/article2.php?sid=875"
