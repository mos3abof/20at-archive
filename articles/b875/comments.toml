subject = "الحل"
author = "عبدالله مفتاح"
posted = "2006-05-29"
text = "لازم البنات بردو يتعملهم حاجه تخليهم يحترموا نفسهم لان مش معقوله البنت يكون من حقها تلبس اللي هي عايزاه وتمشي بالطريقة اللي هي عايزاها وتضحك بالطريقة اللي هي عايزاهاوالولد بقا مطلوب منه يكون محترم ويغض بصره وميعاكسش ولو اتعاكس كمان يبقى مطلوب منه يلم نفسه<br />زي منتو عايزين تحاسبوا الولاد حاسبوا البنات الاول"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134154/http://www.20at.com/article2.php?sid=875"

