text = "التعزير: هي العقوبة التي يراها القاضي مناسبة للجرم سواء الجلد او السجن لمدة معينة او غرامة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134154/http://www.20at.com/article2.php?sid=875"

[[comments]]
order = 6
subject = "انا برضو معاكم"
author = "مسلمه"
posted = "2006-05-30"
text = "جميل اوى ده لو اتطبق عندنا متخيله كام مليون هيحصل فيهم كده يااااااااااااااه<br />دى البلد كده كلها هتتعذر \"هتتجرس\"<br />بس انا معاكم جدا ان البنات لازم تلم نفسها وبالذات اليومين دول امتحانات والبنات مجننين المراقبين يعنى\" سيبنى اغش وانا هاسيبك تبص\"حاجه تقرف<br />ربنا يسترنا جميعا ويستر بنات المسلمين<br />اللهم استر عوراتنا وامن روعاتنا<br />اللهمارنا الحق حقا وارزقنا اتباعه وارنا الباطل باطلا وارزقنا اجتنابه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134154/http://www.20at.com/article2.php?sid=875"

[[comments]]
order = 7
subject = "يارب"
author = "احمد المصرى"
posted = "2006-05-31"
text = "يارب يتنفذ<br />فى كل الدول العربيه على الاقل على الاقل نبطل نشوف المسخره الى موجوده فى المدن<br />دلوقتى بصراحه باقت حاجه مقرفه فعلا<br />مع انى شاب وممكن الشطان يلعب فى دماغى نوبه الا لو فى قانون عقوبه بالشكل داه والله اضرب الشيطان بالجزمه على طول بلا نقاش يلا ربنا يسترها معانا ومع ولايانا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134154/http://www.20at.com/article2.php?sid=875"

[[comments]]
order = 8
subject = "لازم تدخل سريع"
author = "علا"
posted = "2006-06-10"
text = "أنا مع تطبيق هذا القانون في كل الدول العربية والإسلاميةلأن بعض الناس لا يرتدعون إلا بالعقوبة ومن الواجب أيضا ليكون القانون أكثر فاعلية سن قانون آخر مكمل له لردع البنات والنساء اللواتي يتبرجن ويخضعن بالقول والفعل والشكل في الأماكن العامة"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134154/http://www.20at.com/article2.php?sid=875"

[[comments]]
order = 9
subject = "الماهية عند العرب مفقودة"
author = "عصام"
posted = "2006-06-11"
text = "نحن بعض اللاحيان نكدب على بعضنا البعض<br />لا يعقل ان تكون هاته هي الحيلة لابعاد الشباب عن المعاكسة<br />الحل هو تشجيع الشباب على الصلاة لانها هي التي ستبعدهم عن المعاكسة<br />اللهم اهدينا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134154/http://www.20at.com/article2.php?sid=875"

[[comments]]
