[[comments]]
order = 4
subject = "أسمه التعذير مش التجريس"
author = "مسلم"
posted = "2006-05-29"
text = "أسمه التعذير مش التجريس<br />و هي عقوبة شرعيةيتم فيها تعذير المتهم أي فضحه و معاقبتة بأي صورة يراها القاضي مناسبة<br />و أنا مع الأخ مفتاح الذي يرى وجوب معاقبة الفتيات أيضا التي تعمل ما بدا لها و تغري الفتيان في الشوارع و لكن ليس بنشر صاحبتها و إلا فتاني يوم هتوكن طالعة بتمثل في فيلم و لا حاجة و تشتهر علي حسابنا"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134154/http://www.20at.com/article2.php?sid=875"

[[comments]]
