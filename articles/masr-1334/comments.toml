[[comments]]
order = 6
subject = "يامصر ؟"
author = "غنت شادية زمان اغنية ياحبيبتى مصر وكنا وقتها منهزمين ومضروبين وحالتنا بالبلاء"
posted = "2006-12-21"
text = "ومن تجاربى انة حينما تكون مصر فى خطر او متوعكة او مريضة تلاقى ولاد البلد صبيان وصبايا من النجوع والكفور والقرى كلهم بيقول ياحبيبتى يامصر<br />حب حقيقى وقوى مثل حب الام<br />اسمعوا اغنية شادية حبيبة مصر وهى تغنى بعاطفة قوية جدا ياحبيبتى يا مصر<br />حقا يا حبيبتى يا مصر"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224418/http://masr.20at.com:80/article.php?sid=1334"

[[comments]]
order = 7
subject = "موقع عشرينات انضم لابواق الحكومة الفاسدة"
author = "المواطن المطحون"
posted = "2006-12-21"
text = "اظني ان موقع عشرينات اصبح حكومي اكتر من الحكومة نفسها , فالانتقادات الموجهه للحكومة اصبحت قليلة والمواضيع التي تكشف الفساد والفاسدين انعدمت , وكنت شعرت اني اقرء جريدة الاهرام بدلا من موقع عشرينات.<br />عيب عليكم يا موقع عشرينات ان تخسروا الحرب ضد الفساد والفاسدين وعملاء الوطن وعلي راسهم مبارك وجمال (رضي بوش عنهما) وتخسروا ايضا القراء الاحرار الذين يقروا مدونتكم.<br />وشكرا"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224418/http://masr.20at.com:80/article.php?sid=1334"

[[comments]]
order = 8
subject = "الصور حلوة"
author = "سوسة"
posted = "2006-12-24"
text = "حلوووووووووووووووووووو جدا ايه ياجماعة الجمال ده والله كنت لسه بافكر في الاغنية دي قريب وكمان ازبهليت لما لقيت ناس مش عارفاها اصلا والصور حلوة قوي ومين الاخ اللي بيقول ان الصور مفيهاش غير غلابة هي مصر ايه غير الغلابة ولا عايزهم يحطوا لك صور مبارك وابنه ومراته عشان تبقى مصر<br />سيبكم نم الكلام ده واعملوا كمان والنبي ويارت بقى كليبات كثير عن مصر"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224418/http://masr.20at.com:80/article.php?sid=1334"

