[[comments]]
order = 10
subject = "لو سالتك انت مصرى تقوللى ايه"
author = "نيفين نيفى نوفا"
posted = "2006-12-25"
text = "طالما البراء اشرف و دعائء الشامى يبقى اكتر من رائع و انا مغمضه<br />هى دى مصر<br />اللى بتتولد من جديد ف ساعه ضلمه ما يعلم بيها الا ربنا<br />بس لاول مره الام بتتولد على ايد ولادها<br />هى دى مصر يا جماعه<br />رغم وزاره الداخليه<br />و رغم الفاسدين<br />و اللى عايزين يضيعوها<br />و اللى بيبيعوها<br />و اللى بيقسموها<br />هى دى مصر رغم عربيات الامن المركزى<br />ورغم كلاب الداخليه<br />هى دى مصر اللى طله فيها على نيل القاهره بالليل بالعالم كله<br />البراء و دعاء تسلم ايديكو"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224418/http://masr.20at.com:80/article.php?sid=1334"

[[comments]]
order = 11
subject = "ايه ده"
author = "واحد من الناس"
posted = "2006-12-28"
text = "ايه الروعة دي<br />قنبلة يا دعاااااااااءءء روعة غير عادية<br />ربنا يقويكي<br />دعاء خلتيني اخد قلم في نفسي لن راي فيكي من الاول ماخيبش انت واحدة مختلفة مافيش منها كتير"
archived = "2007-01-07"
capture_url = "https://web.archive.org/web/20070107224418/http://masr.20at.com:80/article.php?sid=1334"

[[comments]]
order = 12
subject = "هي دي عبله يا مصر"
author = "هووووووبه"
posted = "2006-12-29"
text = "بعد السلام علي نوووووفا , اكتر من روعه يا دودو بجد عيطت يا بنتي حرااام نفسي ازور اهلي وانا فرحانه , واشوف البسمه علي وشهم واهل بلدي لولكش الكلاب يلا<br />بوسي نفسك كتتتتتتتتتير"
archived = "2007-01-07"
