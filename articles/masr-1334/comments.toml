author = "ايه بقى ؟؟ الصور مش ماشية مع الاغنية بالمرة ..كل اللعب على شريحة معينة وهما الغلابة ..ومظاهرات كفاية ..وصور عبد الناصر.. حتى توقعت ان فيها بعض الكلمات في الاغنية تركب معاها الصورلقيت مفيش و الموضوع كله ماشي على وتيرةواحدة ..يعني حد اتعلم برنامج وجربه ..لكن مش شغل محترفين ولاحتى مبتدئين!!أحلى مافيالموضوع اغنية محمدمنير بس ..."
