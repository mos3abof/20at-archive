text = "ربنا يتوب علينا من ايام الامتحانات ايام تتعب ودكاتره مبترحمش<br />قلى جى الاسكندريه مينساش يزور مكتبه الاسكندريه وجنبها على طول حيلاقى اكبر مجمع طلبه ممكن يشوفه<br />المجمع النظرى<br />الحكومه حتخلى الشعب يصيف مع بعض فى طره<br />الحريه للمعتقلين الحريه للوطن<br />بلادى بلادى لك حبى وكفاحى<br />yehia2784@hotmail.com<br />http://yehia2784.blogspot.com/"
