[[comments]]
order = 3
subject = "مافيا التصوير"
author = "واحد قديم"
posted = "2006-05-30"
text = "غير تسريح العيال فى الجامعة للم المحاضرات وغير الإتفاق مع المعيدين لتوزيع دروسهم حصرياوغير الواد ابو ميكروفون فى نص الشارع وغير تجنيد طلبة من كل المراحل فى الكليات لسحب الزباين وتوزيع ورق الدعاية<br />\"لسنا الوحيدون ولكننا الأفضل\"<br />كل مكتب مخترع خلفية لونها نبيتي أو بني كئيب - تتطلع عين اللي بيقرأها- علشان ما حدش يصور ورقه من المكاتب التانية وتبقي العملية حصرية بيه<br />ده غير شغل تزوير الكتب اللي على ودنه<br />وبصراحة الحكومة مش مقصرة<br />قضايا مصنفات وبرضه على ودنه<br />علشان الدكاترة الغلبانة إتخربت بيوتهم من تزوير كتبهم"
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914182408/http://masr.20at.com:80/article.php?sid=394&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "الاخ اللي فوق0000"
author = "الاستاذشيكو"
posted = "2006-05-30"
text = "باين علي الاخ اللي فوق اما دكتور او ماشي في السلك ده 000000<br />او معيد في كليه فقرانه ومالهاش سوق<br />ممكن زراعه<br />هو ايه ان الحكومه مش مقصرة وده برضه زي مش مقصرة في مكافه البطالهوغيرها<br />اسمع يا سيدي الفاضل<br />اللي بيحصل دليل علي ان الحكومه مجرمه في حق جيل بالكامل من الشباب المصري اللي مش عارف يعمل ايه<br />اللي بيصور كتاب بتاع دكتور بيكون الدكتور ده مفتري وبيخللي الكتاب ب50 جنيه وتلاقي الكتاب شكله مايجيش ب3 جنيه وده في الارياف اللي انا منها<br />انا عمرى ما شوفت دكتور فقران 0000<br />كلهم اللي راكب عربيه واللي عنده شقه ماعرفش فين<br />دول واكلينها ولعه يا با<br />بلاش جشع روح لطلاب اللي اهاليهم بطقطع من لحمهم عشان الواد اااااااال ايه 0000يتعلم!!!!<br />وبعدين 00000000<br />ولا حاجه كلام فاضي ولا ليه اي قيمه لانه مش بيتفهم واللي بيفهمه ويكون بارع فيه الحكومه تقعد تعقد في امه لغايه مايسيب البلد ويسافر اي دهيه حتي لو كانت اسرائيل!!!!!!!!!<br />بلاش الدعاء بغير الحقيقه مش هنا كمان"
archived = "2006-09-14"
capture_url = "https://web.archive.org/web/20060914182408/http://masr.20at.com:80/article.php?sid=394&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

