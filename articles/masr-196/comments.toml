[[comments]]
order = 0
subject = "ديه كلها همبكة"
author = "مصري مقيم باجمل بلد ( دبي )"
posted = "2006-04-20"
text = "بصراحة يا شباب انا حاسس ان ايمن نور وحكايته ديه كلها فرقعة يعني كان مين ايمن نور ده ومن امتي طلع ان شاء الله كنا بنشوفه في مجلس الشعب بيهيص وخلاص وحركة كفاية ديه كمان مين دوووووول اصلاُ وايه مستوياتهم الفكرية والعلمية علشان ينظموا حركة سياسية منظمة انا متأكد ان هما شوية بلطجية او صيع من الشوارع<br />وعلي فكرة الموقع ده عايز يتعملوا دعاية اكتر من كده وانا هاساهم معاكوا يا شباب لان انا حاسس ان انتوا اصحاب انتماءات فكرية متعددة يعني مش تبع اتجاه بعينه يعني ممكن عرض جميع وجهات النظر"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909021805/http://masr.20at.com:80/article.php?sid=196&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 1
subject = "مبروك ايمن نور"
author = "عمرو حلمى"
posted = "2006-04-21"
text = "مبروك عليك ياايمن الزعامةالمصرية فعلا مصر محتاجة واحد زيك انت تفكرنى بالماضى القريب امثال ليش فاليشيا فى بولنداوايضا برءيس فانزيويلا اظن انك زكى جداوجعلت من اعداءك اداة لشهرتك وبناء زعامتك القادمة لامحالةفالف مبروك لشعب مصر بزعيمها الجديد ايمن نور"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909021805/http://masr.20at.com:80/article.php?sid=196&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 2
subject = "من فلسطيني محب لمصر"
author = "محمود حمدان"
posted = "2006-04-21"
text = "الله يهدينا للخير ، مع اني معرفش افكارك يا ايمن بس بلاشك لازم احترمك لانك اول حامل لراية المعارضة الجديدية ووقفت وقفة راجل بجد ( رجل في مواجهه حكومة ) دة امر مش سهل وعلشان كدة اكيد ربنا هينصرك ، وسيبك من كل اللي عايزين يقللوا من شأنك او يهينوك واعرف ان في ناس كتييييييييير وراك ولو صوتهم مش واصل ليك بس قلوبهم معاك وعلى فكرة انا مش منضم لاي حزب سياسي او ديني بس انا انسان شايف الصح والغلط وشايف الحقير والتحقير وحبيت بس اقول الحق ، اما الاخ اللي في دبي اللي مش عارف شي وشايف ان مين دول وانها همبكة عايز اقلة انك باين عليك مبتجيش مصر من زمان<br />وحابب اقلك انها بقت مهزلة يا اخي واللي ببص بيرفع راسة هتتقطع وتعالي وجرب<br />تحياتي ( محب لشعب مصر الواعي )"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909021805/http://masr.20at.com:80/article.php?sid=196&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 3
subject = "نور لن ينطفى"
author = "مصرى"
posted = "2006-04-24"
text = "أيمن نور لن ينطفى لأنه فكر ومبدأ فهو الشاب القوى الذى وقف ودافع عن المصرى فى الإنتخابات وهو الذى أظهر فساد رجل أعتبر مصر بشعبها من أملاكه، وفرضاً كان أيمن نور زور فهل لا يكفى أن كثير من أبناء المصريين رشحوه عن إقتناع فى إنتخابات الرئاسة فهل هذا لا يمحى التزوير ويعترف بإرادة ابناء مصر فى وجوده ولماذا لم يعاقب حسنى مبارك على تزويره فى أنتخابات الرئاسة وقد كان يسوق العاملين فى الدولة فى سيارات الحكومة بالأمر ليرشحوه وهذا مخالف للدستور بالإضافة للتزوير أنها ملفقة حتى يقضوا على الشعب بالقضاء على كل رمز مخالف للدكتاتور هو وإبنه ولكن الشعب أصبح يعرف كل فسادهم ويرفضه وكلنا مع أيمن نور ومع كل معارض لفساد حسنى مبارك وإبنه وزوجته والحاشية الفاسدة من حولهم."
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909021805/http://masr.20at.com:80/article.php?sid=196&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 4
subject = "الزعيم"
author = "محمد فؤاد"
posted = "2006-04-26"
text = "فى بداية تعليقى احب ان اشكر هذا الموقع التعليق بسيط جدا ان الدكتور أيمن نور زعيم مصر لانه الرجل الذى وقف امام الطاغيه مبارك وولده فتحيه الى زعيم مصر القادم الدكتور ايمن نور اما بالنسبة للقضيه فهى ملفقه بشكل واضح فأيمن نور موجود فى قلب كل مصرى ولن ننساه ابدا"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909021805/http://masr.20at.com:80/article.php?sid=196&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 5
subject = "كلمة حق"
author = "said arub"
posted = "2006-04-27"
text = "لن نقول غير كلمة حق وهي أن من يراسني هو من يراعي حقوقي كأنسان وأنا أتابع د.أيمن نور منزو دخوله مجلس الشعب وهو المدافع عن الشعب ومحاربة الفسادفي هذا البلدوأتابع كل تاريخه السياسي منزو أن كان طالباوالشهادات الذي حصل عليهاوهي الأسبات الوحيد علي أنه أفضل وأصغر برلماني علي مستوي البحر الأبيض المتوسط ولذالك أقف معه بقلبي وأدعو الله القادر المقتدر بأن ينصر كلمة الحق بلسان شاب يضع نفسه في مواجه صعبه من أجل شعبا بأكمله ليحقق الحريه لكل الشعب المصري وأتتضامن مع نادي القضاه في الأعتصام ونطالب بأستقلال القضاء وحرية الصحافه وحرية الأحزاب والغاء قانون الطوارئ المقيد للحريات ؟"
archived = "2006-09-09"
capture_url = "https://web.archive.org/web/20060909021805/http://masr.20at.com:80/article.php?sid=196&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

