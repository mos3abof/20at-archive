subject = "الى المصرى( المزور)"
author = "مصرى"
posted = "2007-01-13"
text = "انت من بتوع الطمى ..........ربنا يشفيك<br />وبعدين هو اعترف بهزيمه الجيش فى 67 وبوش موكوس فى العراق وبيقول انتصر...وعبد الناصر اعاد بناء الجيش وتاريخ 30 يونيه 1970 هو الانتهاء من بناء حائط الصواريخ وعيد الدفاع الجوى حتى الان ...واعتمد فكره مضخات المياه للتنفيذ فى 73....ربنا يشفيك يكفى ان المصرى ايامه كانت مرفوعه راسه ولا يتمنى السفر للخارج ..روح عالج نفسك يا مش اصيل مزور من بتوع الطابور الخامس وانت فاهمنى"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

[[comments]]
order = 11
subject = "مش عايزين ديمقراطية"
author = "اية الفايدة ان يبقى فية ديمقراطية وانا جوعان وعريان ولا لاقى شقة ولا عارف اتجوز"
posted = "2007-01-13"
text = "اية الفايدة ان يبقى فية شوية جرائد تشتم شوية ودى تبقى الحرية والديمقراطية واحنا جائعين<br />عايزين الضروريات اولا الاكل والسكن<br />اة فية ناس مبسوطة قوى لكن كم مليون مش لاقى نسمة هواء<br />كم مريض مش لاقى الدواء وبيموت على ابواب المستشفيات<br />ياعم مش عايزين ديمقراطية عايزين ناكل ونشتغل ونلبس هدمة نضيفة وعندنا كرامة"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

[[comments]]
order = 12
subject = "الي الجهلاء"
author = "مصري صميم"
posted = "2007-01-13"
text = "أيها الجهلة يا عبيد الدكتاتورية والكرباج الناصري تكذبون وتقولون أن عبد الناصر باني مصر أتحدي أن تقولوا لي علي كوبري واحد بناه عبد الناصر في البلد الجامعات والمدارس ا،شأ معظمها في العهد الملكي جامعة فؤاد الاول هي جامعة القاهرة وجامعة فاروق هي جامعة الاسكندرية وجامعة ابراهيم باشا هي جامعة عين شمس وكان ان صدر في اواخر العهد الملكي أنشاء جامعة في أسيوط باسم جامعة محمد علي ده تاريخ لن تستطيعوا تزويره أما المصانع فمعظمها سرق من أصحابه باسم التاميم وكانت هناك مصانع الغزل والنسيج في المحلة وكفر الدوار التي انشأها طلعت حرب ومصانع السكر والأسمنت التي أنشأها عبود باشا والزجاج التي أنشاها السيد ياسين باشا والزيوت والصابون وشركة مصر للادوية كل هذه سرقها عبد الناصر من أصحابها وبعد ان كانت تنتج انتاجا ممتازا أصبح انتاجها رديء تريدون ان ترجع أيام الفقر الناصري عندما كانت المحلات خاوية ولا يوجد لا سكر ولا زيت ولا صابون الا ما يعطونه بما يسمي التموين وكان اذا انتهي تموينك فبل الشهر لا تجد أي سلع من هذه في المحلات هذا هو الجوع أيام عبد الناصر يا عبيدالفرد ومن الذي أخترع المنع من السفر والمصادرات وفرض الحراسة والسلخانات في السجون الا أن خيانته الكبري التي تفوق الوصف هي تسليمه سيناء مرتين لاسرائيل بدون حرب وسكوته المخزي علي قتل أسرائيل لالاف الاسري المصريين ودفنهم أحياء بينما هو يقوم بغسل مخ للشعب عن طريق أغاني عبد الحليم وام كلثوم ومن الذي كان ينقل الصحفيين المغضوب عليهم ال محلات باتا للاحذية اليس هو زعيمكم الملهم ومن الذي قام بمذبحة القضاء وفصلهم نهائيا لرفضهم الأانضمام للاتحاد الاشتراكي اليس هو الخائن الاكبر عبد الهزائم والله هذا المجرم وأتباعه الذين يحكمنا ذيوله ال ال<br />اقرأ بقية التعليق .."
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

[[comments]]
order = 13
subject = "الهرم الرابع"
author = "الى المصرى التايوانى"
posted = "2007-01-13"
text = "وكيف اصدق ان الهرم الرابع مات ؟<br />القائد لم يذهب ابدا<br />بل دخل الغرفة كى يرتاح<br />وسيصحوا حين تطل الشمس<br />كما يصحو عطر التفاح<br />الخبز سياكلة معنا<br />وسيشرب قهوتة معنا<br />ونقول لة<br />ويقول لنا<br />القائد يشعر بالارهاق<br />فخلوة يغفو ساعات<br />يامن تبكون على ناصر<br />السيد كان صديق الشمس<br />فكفوا عن سكب العبرات<br />السيد ما زال هنا<br />يتمشى فوق جسور النيل<br />ويجلس فى ظل النخلات<br />ويزور الجيزة عند الفجر<br />ليلثم حجر الاهرامات<br />يسأل عن مصر ومن فى مصر<br />ويسقى ازهار الشرفات<br />شكرا نزار"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

