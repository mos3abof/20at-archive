subject = "الى المصرى الصميم"
author = "مصرى متغرب"
posted = "2007-01-13"
text = "تعرف تتلهى جتك ستين خيبة انت ومبارك بتاعك هى فين الانجازات بتاعتة على الاقل هو دلوقتى مبيحاربش لكن مستوى الفقر زاد والبطالة بقت ازاى والجريمة زادت ازاى هتقولى وهو مالة بالجريمة اقولك الفقر والجهل والبطالة هما سبب انتشار الجريمة ؟ ولا كلة كوم والامراض اللى ربنا بلانا بيها بسبب سياستة الفاشلة هو والحرامية اللى بيجيبهم ولا المصانع اللى سياستة خربتها وبعدين راح بايعها علشان يسترزق هو وعيلتة والحاشية اللى حوالية خليك مبسوط بيه لما ابنة يمسك الحكم بعده علشان يكمل الانجازات بتاعتة ؟؟؟ عالم هبلة"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

[[comments]]
order = 15
subject = "مبارك مين والناس عاطلين"
author = "مصري مقهور"
posted = "2007-01-13"
text = "يا عم يا بتاع مبارك وانجازاته المستحيلة روح اتنيل عليك وعلي الي جابوك , باين عليك احول ومش بتشوف , انصحك بلبس النظارة. بس من النظارة الطبية , لكن نظارة الانتماء والوطنية والشرف والعمل لشعب مصر , عليك مقارنة عهد عبدالناصر وعهد مولانا مبارك وابنه وسوف تلاحظ الفرق الشاسع بين من يسعي الي رفع قيمة اهل مصر بين الامم ومن سوء هذه السمعة حتي اصبحت المصري ليس له قيمة تذكر في عهدنا الحالي.<br />والمثال علي ذلك المذلة التي يعانيها المصريين في الخارج بحثا عن فرصة عمل شريفة لم ولن يجدها في وطنه المسلوب والمنهوب في عهد زبانية الحزب التوربيني الديموقراطي , ولن اتكلم عن قتيات الليل المصريات الذين زادو بصورة رهيبة من ليبيا غربا الي الامارات شرقا هروبا من الفقر المدقع والعنوسة المستفحلة في مصر,<br />وحسبي الله ونعم الوكيل فيك يا مبارك يا عميل اسرائيل وامريكا."
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

[[comments]]
order = 16
subject = "الى من يدعى انه مصرى صميم"
author = "مهندس مدنى"
posted = "2007-01-13"
text = "هل تعلم ان مشروع السد العالى اختير من قبل الغرب من مشاريع القرن..ولقد خرج مدرسه من المهندسين العظام ..ودكتور ماده الرى بالكليه كان يفتخر دوما لنا بانه شارك فى بناء السد العالى وكانت دراسه الدكتوراه عنه..انه افتخار وعزه مثل من شارك فى حرب اكتوبر..وموضوع الطمى عولج بانشاء مصنع كيما لانتاج سماد يعوض الارض والامريكان يريدون اغلاق هذا المصنع للعلم..اما الكهرباء نعم 20 % وكهرباء نظيفه بدون ان ندفع دولارات للبترول ولا تكلفنا شىء..اما عن ضربه من الصهاينه فهو سد ركامى عرضه حوالى كيلو متر !!!فاهم ركامى يعنى ايه والعرض 1000م(يمكن )هدم جزء فقط بالقنبله النوويه وهذا موضوع اخر لانك تستعمل اسلوب الفزاعه لكى نكره السد العالى...وللاسف هذا اسلوب الخائبيين والمفلسين والصايعين وكما قال هنا اخ مصرى اسلوب الطابور الخامس لفقد الثقه بجيل بنى السد العالى انه جيل الشموخ ....واخيرا هل تعلم ايها الجاهل بان منسوب مياه النيل قد تم تثبيتها والان تم البناء على اراض كانت كل فيضان تتضرر..لان السد جعل هناك امان .. وانا لن ازيد فى الكلام عن منشأت الرى والاعمال الصناعيه ... فهمت ايها الجاهل الغبى"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

[[comments]]
order = 17
subject = "مستقيل"
author = "نيفين نيفى نوفا"
posted = "2007-01-13"
text = "اسمحولى امتنع عن التعليق<br />لان فيه هنا ناس بقدرهم وبحترمهم مش عايزه ازعلهم منى<br />و ادى كمان حته من قصيده قتلناك يا اخر الانبياء لنزار قبانى فى رثاء عبد الناصر<br />انادى عليك ابا خالد<br />و اعرف انى انادى بواد<br />و اعرف انك لن تستجيب<br />و ان الخوارق ليست تعاد<br />يا رب اكون كاتباها صح<br />لانى مش حافظاها اوى<br />؟؟؟"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

[[comments]]
order = 18
subject = "عندما يسأل اولادنا"
author = "عندما يسأل اولادنا"
posted = "2007-01-13"
text = "من أنتم ؟<br />فى أى عصر عشتم ؟<br />فى عصر اى ملهم ؟<br />فى عصر اى ساحر ؟<br />نجيبهم فى عصر عبد الناصر<br />اللة مااروعها من شهادة<br />ان يوجد الانسان فى عصر عبد الناصر<br />ارفع رأسك ياأخى فقد مضى عهد الاستعباد"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

[[comments]]
order = 19
subject = "الي الاغبياء أنصار الهزائم والخيانة"
author = "مصري صميم"
posted = "2007-01-13"
text = "اولا أيها الغبياء أنا ضد مبارك علي طول الخط لا نه حاكم عسكري جاهل من ذيول زعيمكم عبد الناصر ونتيجة لانقلاتبه المشئوم عام 52 وعلي فكرة انتم ومبارككم أضعكم في سلة واحدة هي سلة الحكم العسكري الدكتاتوري اللي ابتلينا به من ايام زعيمكم العسكري الفاشل عبد الهزائم المنكرة فهمت يا غبي يا اللي اسمك متغرب واللي عامل نفسه مهندس الم تهدد اسرائيل أكثر من مرة سابقا بضرب السد العالي ولا أنتم شاطرين في الاغاني العنترية الخائن الاكبر خادم أسرائيل المسمي عبد الناصر اللي كل اللي بيعمله في أي حرب هو تسليمهم سيناء علي طبق من فضة والله أنتم وامثالكم هم سبب تخلف مصر ورغم سيطرتكم التامة علي وسائل الأ علام الا أنكم تعرفون أنكم مرفوضون شعبيا أنتم وزعيمكم ويسقط حزبكم الناصري بكل مرشحيه في أي انتخابات رغم تدليل الدولة ومبارك اللي زيكم دكتاتور قذر عمرنا ما شوفنا مبارك بيعتقل الناصريين بل يذكركم وانقلابكم المشئوم وزعيمكم بكل مدح وانتماء الله يلعن أمثالكم غاويين حاكم يضربكم بالجزمة عمرنا ما سمعنا عن كلمة معارضة وأحزاب في العهد الناصري الفاسد بطلوا تطبيل وهبل لواحد عمره ما دافع عن مصر وسا هم في أسرائيل الكبري وضياع القدس والمسجد الاقصي وعلي فكرة معظمكم عملاء لمباحث امن الدولة اللي بتتبني خط عبد الناصر في الخطف والتعذيب والمعتقلات اللهم أنقذ مصر من الخونة والعملاء أمثالكم"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

[[comments]]
order = 20
subject = "فلننصر الديمقراطية"
author = "محسن"
posted = "2007-01-13"
text = "في الوقت الذي نجاهد ونتظاهر من أجل الديمقراطية واحترام حقوق الانسان ورفض وأدانة التعذيب تذكروننا وتشيدون بمؤسس جمهورية التعذيب والمعتقلات عبد الناصر الذي كان يفخر في احدي خطبه باعتقال 18000شخص في ليلة واحدة يجب أن نعلي من كرامة الانسان المصري وماذا يفيد 100 سد والانسان المصري مهان ومحطم ولا يستطيع التكلم او التنفس الا المسبحين بحمد الطاغية يجب أن نكون ضد هؤلاء الحكام الطواغيت الذين جلبول لبلادهم الهزيمة والخزي والعار وندوسهم تحت أقدامنا من اجل بلاد تسودها الديمقراطية واحترام حقوق الانسان"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"
