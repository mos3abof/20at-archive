subject = "عبد الناصر ...هو السد العالى"
author = "مصرى"
posted = "2007-01-12"
text = "واضيف على عرضك الممتاز يا اخى ان سعه التخزين للسد حوالى 70مليار ..وطول بحيره ناصر حوالى 500كم يقع فى مصر 350 كم بعرض 15 كم ثروه مائيه لمصر بالاضافه الى سمك البحيره اللذيذ...الف رحمه عليك يا عبد الناصر ...مت على سرير حكومى لم تمتلكه ولم تعش فى قصور من ذهب..ودعناك بقلوب تبكى....اللهم عوض مصر بامثالك يا ناصر"
