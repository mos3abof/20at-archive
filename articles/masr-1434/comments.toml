[[comments]]
order = 1
subject = "رحم الله جمال"
author = "توتى"
posted = "2007-01-12"
text = "الف رحمه عليك و على ايامك يا جمال<br />و الله لو لم يكن جمال انجز فى حياته الا مشروع السد فقط فهذا يكفيه<br />فما قولكم فى باقى اعماله العظيمه و مشاريعه الباقيه حتى الان<br />عفوا لقد نسيت فنحن الان نبيعها ابتداء من المصانع و الشركات و حتى البنوك<br />فليرحمنا الله و يكفى ان جمال فى قلوبنا مهما قالوا عنه و عن دكتاتوريته<br />السنا الان نعيش اسوأ حالا من ايام ناصر بمراحل"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

[[comments]]
order = 2
subject = "اتمنى"
author = "مدحت"
posted = "2007-01-12"
text = "الحمد لله الذى هيء لاهل مصر الحماية من الموت غرقا بسبب الفيضانات أو عطشا بسبب الجفاف. أثناء قرائتى لهذا الموضوع تصورت احتفالا يتم فيه التكريم والعرفان بالجميل لكل شخص تضرر بسبب بناء السد وكل شخص ساعد فى بناء السد وأيضا تقديم الشكر لروسيا كدولة ومجاملة الروس كشعب بدعوة أكبر عدد ممكن منهم من مختلف الطبقات لزيارة مصر والسد. مفارقة غريبة ان مصر (حكومة وجزء من الشعب) احتفلت منذ سنوات بذكرى احتلال فرنسا لها وتتجاهل الان ذكرى بناء السد."
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

[[comments]]
order = 3
subject = "عرفان لمصرى فى اصقاع الدلتا"
author = "قريتى يانااصر على احد افرع النيل فى الدلتا وكانت تحاصرها البرك والفيضانات فى ايام النيل والناموس والروائح الكريهة والخوف والفزع من دخول الماء الى البيوت اثناء الليل ونحن نيام"
posted = "2007-01-12"
text = "يا ناصر قريتنا دخلت كهرباء السد العالى بيوتها<br />واخبر روحك الطاهرة ان قريتنا قد ودعت اخر ساقية فيها من عشر سنوات والفدان الذى كان يروى فى يوم بالساقية يروى الان بالمضخات فى ثلاث ساعات<br />الجرارات التى كنت تستوردها وتصنعها لنا بايدى مصرية تملا القرية وانتهى عصر المحراث الفرعونى<br />ياناصر فى قريتى بنايات ياناصر فيها اسانسيرات<br />فى قريتى ياناصر اربعة مدارس<br />فى قريتى ياناصر من ابناء القرية اطباء ومهندسين وضباط وخبرات تعمل فى كل دول العالم<br />ولكن ياناصر من بعدك جائتنا امراض السرطان والفشل الكلوى وكل امراض الكبد المستوردة<br />شبابنا عاطلون عن العمل بعد بيع المصانع<br />ويشربون البانجو<br />سيدى بعدك تغيرت المسائل<br />سيدى لتسكن روحك الطيبة عند رحمة اللة<br />فانت ابو الفقراء والمساكين وكنت تكافح لينالوا حقوقهم<br />لقد اطعمت الجياع وعلى الاقل منعت الحفاء بين الشعب<br />سيدى لك رحمة اللة"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

[[comments]]
order = 4
subject = "عندي إضافه وطلب .."
author = "إبن بهيه"
posted = "2007-01-12"
text = "شكرا لعشرنات على هذا الموضوع واحتفالهم لوحدهم بعيد ميلاد السد .. وليسمحوا لي بإضافة سبب جديد لامتناع مبارك الواطي وحكومته القذره عن الاحتفال بأعظم إنجاز مصري في العصر الحديث ..<br />الاحتفال بالسد يا عشرينات .. يعني كلام عن النيل .. والميه .. والنيل يا حضرات جاي من فين ؟ من القرن الأفريقي .. من عند الحبشه ..والحبشه دي إيه يا حضرات دلوقتي ؟ وبتعمل إيه في الصومال بأيدي جنود الصهيونية الإسرائيليين والأمريكان؟<br />طبعا الاحتفال بالنيل هيخلي الكل يتكلم ويبعبع ويقول عن استحواز الصهاينه على القرن الأفريق .. مش مهم ضياع الصومال (دولة عربية) وإيه يعني ما كتير بلاد عربيه بتضيع .. لكن ..<br />لكن لما الصهاينه يمسكوا الحنفيه هناك وينقطوا الميه في النيل نقطه نقطه .. ووو هو ده الرغي اللي مبارك مش عايزه .. أصله مش وقته خالص زي ما أسياده فهموه .. بلاش نتكلم في القرن الأفريقي دلوقتي .. ولا حتى بعدين ..<br />ده في رأيي سبب آخر هام يجب إضافته إلى ما لدى مبارك الواطي وعصاباته من أسباب لطمس ناصر وإنجازاته اللي لازم الناس هتقارن بينها وبين الخيانه والعماله اللي ماليه مصر دلوقتي ..<br />ولا رأيكم إيه ؟<br />ما تنسوش يا عشرينات أن ميلاد عبدالناصر بعد بكره .. يعني 15 يناير عايزين مواضيع كرامه وعزه وكبرياء وبهيه<br />أرق تحياتي لكم وللجميع<br />وتحية لإبن بهيه العظيم .. جمال عبدالناصر رحمه الله رحمة واسعه وأسكنه فسيح جناته ..<br />لا تنسوا 15 يناير<br />إبن بهيه<br />http://ibnbahya.blogspot.com"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

