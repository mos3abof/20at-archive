[[comments]]
order = 8
subject = "كفي هزلا"
author = "مصري صميم"
posted = "2007-01-13"
text = "تترحمون علي رجل جلب الخراب والهزائم المذلة لمصر مثل هزيمة 56 وهزيمة 67 الم يكن تأميم قناة السويس هو السبب المباشر للعدوان الثلاثي واحتلال أسرائيل لسيناء لمدة 7 أشهر وانسحابها بشروط مذلة لمصر مثل اشتراطها استخدام خليج العقبة ورغم ان القناة كانت ستعود لنا بدون حرب بعد 12 سنة وانتهي بعبد الناصر أن اغلق القناة نهائيا بعد هزيمة 67 الي أن فتحها وطهرها أنور السادات رحمه الله وبعدين السد العالي لا يمد مصر سوي ب 20% من الكهرباء والباقي 80% من محطات الكهرباء وعيوبه حجز الطمي وراءه وتقليل خصوبة الارض الزراعية ألا ان أخطر شيء في السد انه أصبح نقطة ضعف مصر عسكريا فلو ضربته اسرائيل بالطائرات والصواريخ لاندفعت المياه المحجوزة ورائه في البحيره وغرقت مصر تهللون لرجل سحق كرامة المصريين بالمعتقلات والسجون والتعذيب وخرب أقتصاد مصر بالحرب خمسة سنوات في اليمن بينما أمام اسرائيل لا يستطيع أن يصمد يومين وكل ما يعرفه أصدار قرار الانسحاب وتسليم سيناء لاسرائيل ومن الذي امم الصحافة وجعلها بوق للحاكم ومن الذي أخترع 99.9% في الاستفتاءات اليس هو زعيمكم المقبور كل البلاوي والمصائب التي نعاني منها الان أساسها حكم الفرد الناصري المهزوم من الممكن ان نتكلم صفحات وصفحات عن هذا الحاكم الدكتاتور الذي كان بحق كارثة قومية علي مصر والعرب الذين قلدوا النموذج الناصري في الدكتاتورية اتقوا الله أيها الغافلين وليحشركم الله معه يوم القيامة"
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

[[comments]]
order = 9
subject = "الى المصرى الصميم"
author = "ورغم كل ما قلت وبعضة صح فانة عندما مات لم تكن على مصر ديون خارجية اطلاقا"
posted = "2007-01-13"
text = "لا من البنك الدولى ولا من غيرة<br />وكان الخريج سواء فى التعليم المتوسط او العالى يجد فرصة عمل بعد تخرجة بشهور<br />كانت حرية رغيف الخبز مكفولة للجميع وتكافؤ الفرص بين كل الناس<br />مات عبد الناصر الانسان وفى جيبة او فى خزانتة 7 جنية<br />كل المدارس والجامعات من عصرةوانشا اول جامعة فى الصعيد هى جامعة اسيوط<br />لا تنسى انة هو من اسس اذاعة القران الكريم<br />هل رايت مبنى الاذاعة والتلفزيون بناة عبد الناصر<br />هل رايت برج القاهرة بناة عبد الناصر<br />هل تعرف الجيش المصرى العظيم بكل تشكيلاتة الحديثة بناة عبد الناصر<br />هل تعرف انة كان للاقطاعيين سجون خاصة داخل عزبهم يحبسون فيها من شاءوا بدون دولة ولا قانون ولا قضاة اى سجن خاص جدا<br />هل تعرف انة كان فى العصر الملكى التركى ان كلمة مصرى كانت معنا العار وتعتبر مسبة فلاح خرسيس<br />كم كيلوا مترات رصفت ووصل الاسفلت الى القرى<br />هل تعرف انة كانت فى القاهرة بعض الاحياء بدون كهرباء او الكهرباء تزورها ساعات وقصة فأر السبتية معروفة<br />من الذى عمل شبكة الكهرباء الموحدة حهد 500 كيلو فولت من اسوان الى الاسكندرية<br />من الذى بنى مصانع الحديد والصلب ومصنع السيارت وتوسع فى مصانع المحلة وفتح باب الرزق امام الملايين<br />بجانب السد من الذى بنى محطة كهرباء غرب القاهرة الحرارية والجنوب والشمال والتبين التى بنيت مخصوص للحديد والصلب<br />الكهرباتء التى تتحدث عنها معظم المحطات بنيت فى عصرة ثم تم توسعتها ايام المهندس العظيم ماهر اباظة<br />نعم لم يبنى ديمقراطية ولكنة قبلها قد امن رغيف الخبز لمعظم الناس<br />نسيت ايضا ان اقول لك ان مصانع الدواء كلها بنيت فى عصرة ايام حصار الدواء<br />وان السكك الحديدية كانت القطارات تشتغل بالفحم واظنك تذكر اغ<br />اقرأ بقية التعليق .."
archived = "2007-01-13"
capture_url = "https://web.archive.org/web/20070113143658/http://masr.20at.com:80/article.php?sid=1434"

