author = "ايمن حلمي"
posted = "2008-01-07"
text = "السيد الاستاذ المحترم عبد الله كمال ا زعجت عندما قرأة مقالك بتاريخ 3/½008مش لانها كذب وبس لاكن لانك صاحب قلم صحفي جميل بس مشعارف الي بيحصل دة لصالح مين انت رحت جزيرة القرصاية لو رحت تبقا كذاب ولو مارحتش مصيبة كبيرة<br />وانا هرد علي ماكتبتة يامحترم ولو استطعت مش هبعت الرد دة علي النت بس بل اعدي علي الناس واحد واحد في عملهم وفي الشارع بصوت عالي لانة صوت الحق يامحترم<br />اولأ السفير السوسري جاء بناء علي طلب من 2 اثنان من الجالية السوسرية ليشاهد ظلم واقع عليهم احنا لينا سفير ولاغفير سال عن 5000 شخص يامحترم<br />ثانيا عدد الفيلات 30 ياكبير هما فين واحدة بتاعة راجل جراح عملها عيادة مجانية وسكن لية وابنتة وابنة وانا شاهد عيان يامحترم والثانية ملك رجل اعمال من الجماعة الي بيحبو الحلال وبيعمل معة في الزراعة النظيفة وتربية المواشي 60% من سكان الجزيرة عارف يعني اية نظيفة يامحترم يعني بدون كيماويات من اسرائيل ياكبير وكمان واحد ملك فنان وناس محترمين جدا<br />ثالثا يامحترم مساحة القرصاية ياراجل 30فدان دي القرية الفرعونية بتاعة حسن رجب 35 فدان واكثر ولو سالت في الاملاك هيقولون لك المساحة من واقع السجلات من نشات الجزيرة 107 فدان<br />رابعا الردم يامحتلرم معمولة محضر في المسطحات برقم 444 ولو سالت مش هيخبو ولما تشوف المحضر يامحترم العمال بتوع الحفارات قالو في المحضر انهم بيعملو بناء عن تعليمات وزارة الري<br />وخامسا جزيرة المعادي انا نفسي اتفرج عليها من قريب اصل ابناء الغلابة ميقدروش يذهبوا اليها يامحترم<br />نسيت موضوع الصور الي منزلتهاش زي الصور الي صورتها روزاليوسف ساعة ماجيش اطلق النار علي الفلاحين لصالح من كل هذا والله في حساب يوم القيامة ومن فلاح مظلوم حزبي الله ونعم الوكيل فيك انت ومن ظلمنا ايمن حلمي محمد القرصاية مصر shams018sh<br />hotmail.com"
archived = "2010-01-20"
