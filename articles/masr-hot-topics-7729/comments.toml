author = "اكتب اسمك هنا"
posted = "2007-12-04"
text = "والنبي يا استاذ احمد الهواري ايه رايك في القصيدة بتاعتي عايزك تقرأها وقولي ايه رايك وشكرا<br />بعنوان يا حلو ما تحن عليا :]<br />حته بتلو انما موووووزه<br />لابسه جيبه وبلوزه<br />الجيبه بتاعتها هوستنى<br />فيها حاجه لطشتنى<br />مش عارف اذا كانت هدومها<br />ولا جمالها وسحر اوامها<br />فقلت اعاكسها واكلمها<br />فقلت يا حلو يا مدلع<br />يا مخلى قلبى مولع<br />ولعت قلبى ببنزين<br />لو اعرف بس انته منين<br />كنت جبت العربيه<br />يا حلو ما تحن عليا<br />دا انا معايا سته600<br />وهيا ماشيه قدامى<br />وعامله مش سامعه كلامى<br />دى طارشه ولا تقيله عليا<br />لكن يا دوب بعد شويه<br />وراحت ضربالى كلكس (ها ها ها ها )<br />انا قلت لا دا انا واد اكس<br />قلت كلمه واجيب رجليها<br />ومشيت برضه اعاكس فيها<br />شويه وراحت بصالى<br />وما اقلوكوش ع اللى جرالى<br />ما يتحكيش وما يتوصفش<br />بعيد عنكوا دى ما تتشافش<br />لو شفتووها تقولوا اخييييييه<br />وشها قطر معدى عليه<br />او شكله كده ملعوب فيه<br />ماتش بوكس ولا مصارعه<br />وراسها تقريبا قرعـــــــــه<br />لا حرام كانت صلعه<br />عشان بس ما اظلمهاش<br />وبصت وقالت ما اتعرفناش<br />قلتلها لا ما اعطلكيش<br />انا اساسا ما انفعكيش<br />ايه اللى سحبك يالسانى<br />ان ما كنت اربيك<br />وخدت ديلى فى سنانى<br />ورحت قايل يا فكيك"
archived = "2010-01-20"
capture_url = "https://web.archive.org/web/20100120090117/http://www.20at.com:80/masr/hot-topics/7729.html"

