text = "المرة دى كانوا صاحيين واكتشفوا ان اللحوم فاسدة ,,, ان شاء الله المرةالجاية ال210 طن اللى جايين للغلابة \"الموظفين وخلافه \" هتبقى فاسدة برده !!! بس هينيموا لجنة الفحص الطبي وتدخل اللحمة كالعادة هو حد بيدورعلى المواطن ولا على مصلحته ؟؟؟؟<br />حد عنده اى خبر عن التعويضات فى حادث العبارة اتاكلت ولا لسه ؟؟؟؟"
