[[comments]]
order = 3
subject = "برضه نفس التعليق ممكن هنا"
author = "إبن بهية"
posted = "2006-11-15"
text = "في بلد سايب ما لوش كبير ممكن تلاقي كل شيء .. في بلد كبيرة مشغول بتعزيز موقف عائلته وعصاباته لمواصلة النهب والسرقة فكل شيء مباح ومستباح .. في بلد مربي كلب زي العادلي (بوبي جيمي) للحراسة فطبيعي أن تجد كل التابعين لوزارة البوبي الحبيب من البوبيهات اللذيذة اللي بتنهش بس في أي واحد يفكر يقرب من الهواء المحيط بأسيادهم وأولياء نعمتهم من الحرامية ... تمام زي ما بتشوف في السيما كل زعيم عصابة حاطط شوية كلاب للحراسة حوالين بيته وليهم زعيم اسمه العادلي وكل صبيانه في خدمة العصابة من أجل حتة العظمة التي تلقى لهم كل يوم .. والعظم عندنا مشاريع وشقق وأراضي وما لا ندري من جسد الحبيبة الحبيسة مصر الذي يوزع على الكلاب والبوبيهات .. بلد زي ده لازم يكون فيه كل شيء مستباح .. تعالى فهمني لو في مصر واحد ممكن يأخذ حقه بالقانون .. طيب هو فيه أصلاً قانون ؟؟؟ طيب عايز إيه تاني ؟؟؟ اسكت بقى وخلي الماجور مكفي على أوضاعنا المأساوية لغاية ما ربك يعدلها والحكومة القذرة نقدر نبدلها .. نبدلها بناس مننا وفينا .. مش حرامية وكلاب حراسة لهم ... على فكره أنا مش يائس .. أبدا ... أنا أكثر واحد متفائل بقرب الخلاص وكمان قرب النهوض ... الخلاص لأننا خلاص وصلنا لآخر القاع وما فيش بعد كده قاع نسقط إليه ... والنهوض لأن محمد علي في خمس سنين عمل من مصر جنة .. وببساطة كده لو ربنا قدر لمصر التخلص من نظام مبارك الواطي وعصاباته في 2007 (قادر كريم جبار) يبقى في 2012 راح نشوف مصر تانية ... يا رب خلصنا من مبارك الواطي وأذنابه من الوزير لعضو المجلس المحلي الحرامية ... يعني السيستم كله ينزاح وحتشوفوا البلد دي هتبقى ازاي في 2012 بإذن الله بإيدين رجالة جدعان من أولاد بهية مش ولاد الواطيين اللي موجودين دلوقت ...<br />إبن بهية<br />http://ibnbah<br />اقرأ بقية التعليق .."
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015223/http://masr.20at.com:80/article.php?sid=1157"

[[comments]]
order = 4
subject = "سؤال برئ جدا"
author = "ريهام"
posted = "2006-11-15"
text = "بصراحة هو مش سؤال واحد لكن اكتر من سؤال اولا : هو ازاي الشركة اللي استوردت الشحنة الفاسدة هي نفسها الشركة اللي هتستورد تاني؟ ثم هي الشركة دي تابعة لمين في البلد؟<br />ثانيا: هي الشحنة الفاسدة دي مش المفروض ان فلوس استيرادها من اموال الدولة لانها طبعا كانت جايه للغلابة هل تم التعويض عنها؟ ولا اتحرقت كده وخلاص ويعوض علينا ربنا لا دوقنا اللحمة ولا طولنا الفلوس؟<br />ثالثا: طيب لما نفس الشركة تستورد من نفس المكان مرة تانية يا ترى هتبقى فاسدة برضه ويحروقها ولا هتبقى تمام تمام لان الحكومة حكومة صادقة ورشيدة وتبقى طالما ما اتحرقتش تبقى صالحة؟ ولا هيعملو زي فيلم الرجل التاني؟<br />والنبي حد يجاوبني قبل ما الربع الباقي في عقلي يطير"
archived = "2006-11-27"
capture_url = "https://web.archive.org/web/20061127015223/http://masr.20at.com:80/article.php?sid=1157"

