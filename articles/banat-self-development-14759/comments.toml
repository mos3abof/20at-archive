[[comments]]
order = 11
subject = ""
author = "roro22"
posted = "2010-01-19"
text = "وصدقيني انت وبس اللي هتشيلي نتيجت غلطك معاه ميغركيش انه بيقلك كلام حلو او حتى بيقلكاي كلمة حب صدقيني كل ده كدب ووهم لو فعلا عوزك بجد يدخل البيوت من ابوابها ولو مش مستعد يروح لوحدة ويرجعلك لما يكون مستعد معأني انا مرشحش الأرتباط بيه اصلا علشان سوري يعني ذيل الكلب عمره مبيتعدل<br />وصدقة رسول الله من تردونه دينه وخلقة<br />ولا تتزوجي بزير النساء فأنها ادمان والله حتى لو تزوج 100 سيدة بردة هيبقة الحرام عندة اهم من الحلال<br />ويريت تفكري في المستقبل ليكي ان شاء الله هيجيلك احسن منه بكتير مترميش نفسك في التهلكة<br />وربنا يوفقك وياريت اسمع ردك على ما كتبته ليكي قريبنا<br />ربنا يبعد عنك شيطين الأنس والجان ويهديكي لما يحب ويرضى اللهم امين"
archived = "2010-01-25"
capture_url = "https://web.archive.org/web/20100125064642/http://www.20at.com:80/banat/self-development/14759-2010-01-05-10-20-36.html"

[[comments]]
order = 12
subject = ""
author = "roro22"
posted = "2010-01-19"
text = "والرجاله اللي مشيين في طريق الحرام بيجلهم حاله من القرف من نفسهم ومن اللي بيمرسو الحرام معاهم او الزنا يعني فتيات الليل علشان بيكونو لكل راجل مش ليهم لوحدهم فبيحبو ويحولو يدوره على وحدة وبس تكون ليهم وبس مش لكل راجل يعني ياريت تفهمي قصدي فهوه دلوقتي بيستترجج عن طريق الحب والعاطفه علشان البنات عطفيه اوي وبيقعو فريسه امام الذئاب البشريه مثل هذا الشخص حولي تبعدي عنه بشتى الطرق"
archived = "2010-01-25"
capture_url = "https://web.archive.org/web/20100125064642/http://www.20at.com:80/banat/self-development/14759-2010-01-05-10-20-36.html"

[[comments]]
order = 13
subject = ""
author = "roro22"
posted = "2010-01-19"
text = "للأنسة الفاضله fedo انا هقلك بختصار الولد دة عمره مهيتغير خالص سيدنا محمد صلى الله عليه وسلم قل من تردنه دينه وخلقة وكمان وصف الراجل زير الساء وشارب الخمر ولاعب الميسر والبخيل دول انواع واصناف الرجال اللي الست مترطبتش بيهم<br />وصدقيني لو خوضى في العلاقة دية اكتر من كدة انت اللي هتخصري كل حاجة في حياتك<br />علشان الخطوه الجايه منه هيقلك علشان ابقة ليكي لوحد وتنسيني كل وحدة تبقي انت اللي معايه علطول وليه تعملي معاه ما لا يحمد عقباه وتغضبي ربنا وتخصري اعز حاجة عندك علشان ترضية اسمعي كلامي الحب الصح ما يرضي ربنا ورسوله وحفظي على نفسك وابعدي عنه نهائي وبنات السوء كثير يروح يشفله حد يعمل معاه كل حاجة بيحبها لكن انتي مش ممكن تعوضي اللي انتي هتعمليه معاه علشان ترضيه واتقي الله في نفسك وفي اهلك ولدتك وولدك واخوتك<br />ومن يتقي الله يجعل له مخرجا ويرزقه من حيث لا يحتسب<br />اللهم بلغت اللهم فشهد"
archived = "2010-01-25"
capture_url = "https://web.archive.org/web/20100125064642/http://www.20at.com:80/banat/self-development/14759-2010-01-05-10-20-36.html"

