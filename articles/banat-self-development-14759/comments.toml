text = "قبل منفكر احنا هنعمل اية فى الموقف لازم نفكر احنا عايزين اية من فكرة الارتباط اعتقد دة هيسهلنا المواقف الى زى دية ولازم نكون صرحين مع نفسنا عشان ناخد الخطوة التى تقرب الى الصواب بحد عينة اة ونسال نفسنا هل احنا مستعدين ولا لاء للفكرة نفسها ومواصفات الى احنا عايزين نرتبط بيهم طبعا دون المبالغة فى المواصفات دية<br />شكرا للموضوع"
