text = "الاخت Fedo انا شايف انك تبعدى عن الولد دة لان الموضوع دة مش هيتحل الا اذا قرب جداا من ربنا … انا معرفش انت هتقدري تسيبية فعلا ولا لا لانى محبتش قبل كدة لكن اعرف ان الموضوع صعب بالنسبة للبنت اما بالنسبة للولد كانه بيغير الاب بتاعة يعنى بيصعب علية اللاب توب القديم شوية وفرحته بالجديد بتنسية الاب توب القديم وتلاقية بيلعنة<br />roro22 عندها حق الولد اللى عايزك بجد هيدخل البيت من بابه"
archived = "2010-01-25"
