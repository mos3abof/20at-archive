[[comments]]
order = 6
subject = ""
author = "fedo"
posted = "2010-01-07"
text = "انا دي اول مرة اكتب في موقع بس محتاجة ان حد يقف جنبي او اخد رايه مش هاينفع اني ادخل اهلي دلوقتي وماليش صحاب قوي عشان اتكلم معاهم في موضوعي انا كنت عارفة واحد من سنتين والمفروض اننا بنحب بعض بس كنا عالطول نتخانق ونزعل ونسيب بعض بس كانت الصدف هي اللي بتجمعنا ببعض تاني من يومين صدفة رجعتنا تاني لبعض بس المرة دي احنا متاكدين ان فيه رابط غريب جامعنا ببعض ومش عارفين سبب ايه هو قالي انه بيحبني ومتمسك بيا جدا وانا بحبه لاني ماحبتش حدبعده المشكلة انه بيحب السيكس انا اسفة جدا عالكلمة بس دي الحقيقة دة كله بسبب شغله وسفره برة كتير والبنات اللي كانو معاه في الشغل هو طلب اني اقف جنبيه واحاول ابعده عنها عشان مايعملش حاجة غلط وانا كل حاجة ليه بس انا مش عارفة اعمل ايه انا بحبه جدا ونفسي اوقفه عنها ياريت حد يقولي رايه او يقولي اعمل ايه"
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112125158/http://www.20at.com:80/banat/self-development/14759.html"

