[[comments]]
order = 9
subject = ""
author = "northstar"
posted = "2010-01-08"
text = "على فكرة التوبك حلو أوي و الموقع كله ما شاء الله جميل بارك الله فيكم.<br />ممكن تسمحلي الأنسه fedoأني أرد على موضوعها…<br />بصي يا جميل الشخص دا لو بيحبك فعلا كان أتقدملك من زمان. و خلي بالك من حاجة هو لو عاوز فعلا يتوب من الموضوع إللي أنتي ذكرتيه دا كان أتجه لربنا سبحانه و تعالى بقلب سليم و نية خالصه ما كانش يطلب من مجرد إنسان يساعده. و خليني اسألك سؤال تجاوبية بصراحة… لو حصل و اتجوزتيه هل هاتقدري تنسي الموضوع دا ؟ كل نظرة لواحدة ها تترجميها غلط و الحكايه ها تكبر من ما فيش. أعتقد إني لو مكانك كنت ها أتهي الموضوع دا من زمان."
archived = "2010-01-12"
capture_url = "https://web.archive.org/web/20100112125158/http://www.20at.com:80/banat/self-development/14759.html"

