[[comments]]
order = 9
subject = "معنديش معني ليها"
author = "samson"
posted = "2006-04-27"
text = "بسم الله الرحمن الرحيم<br />انا عاندي مشكلة كبيره وعايز حاد يديني الحل :<br />المشكلة هي اني اعرف بنت متربي انا وهي من زمان ياعني ما يقارب من 20 سنة والام تعرف امي من 20 سنة يا عني العلاقة من زمان .<br />انا كنت علي صداقة مع البنت وكل الاسرار الي معها بقيت معاي واصبحنا شخص واحد في اقل من مدة . وكانت الصداقة دية الناس كلها عرفاها حتي اني كنت سعات ببات عندهم في البيت ولما حد بيشوفني من خالتها وكانو يسقالو ام البنت كانت بتقول ده ابني الكبير .<br />وفي يوم امها سافرة الي دبي وتركتها مع اقاربها . وكنت انا دائم الاتصال معها بسبب وبدون سبب عادي .وفي يوم كنت عند قريب ليها وكنت بكالمها من الموبيل عادي وهو جية وسمع المكالمة عادي بس مكانشي يعرف بس انا كنت باتكلم وهو جية عادي وانا كملت المكالمة وعادي . بعدها بيوم هو اتصل قلها انتي كنتي بتكالمي محمد الي هو انا هي قالت ايوة بكل بصاطة عادي<br />هو قام عامل مشكلة كبيرة الي هو ازاي انا بكلم واحدة قرابتة ومقلتلوش بس .<br />بدي يضغط علي عايز ياعرف كل حاجة عني من غير اي سبب وكل مبتهارب منة كنت بكدب علية علشان هو واحد ميعرفش الي بنا وبين بعض من اسرار وكنشي لازم اني قول اي حاجة عن البنت دية .<br />هو بدي بالاتصال بي اكثر من مرة وبدي ياعملي مشكلة .<br />وللاسف وانا تحت ضغط منة قولت علي موقف كان بالنسبالي هو موقف زود من صداقتي بالبنت دية وهو انها كانت بتكالم ولد علي النت وبعد كدة بدي يراخم عليها فانا عرافت عن طريق الصدفة فقولت للبنت علي الي انا عرفتة هي اتكالمت معاي بكل صراحة هي مشكلة البنت انها كانت عايشة برة معاي ومرة وحده نزلت مصر ودخلة الجامعة والكل فينا عارف يا عني اية الجامعة بس فبداقت اخاف عليها من اي حد .<br />بس في عارفت اني قولت لاقربها علي كل حاجة عن الولد دة الي كانت تعرف علي النت بس .<br />هي ليها حق بس انا عايز اعرف ينفع اقول لولداتها علي الي حصل ولا لأ علشان اكون في موقف سليم .ةعايز اراجع الماية لماجاريها بس مش عارف .<br />ياريت الحل يجيلي علي الايمال لو سمحتو<br />mohammed_978@yahoo.com"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134551/http://www.20at.com/article2.php?sid=250"

