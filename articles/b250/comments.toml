text = "انا حبيت واحد من خمس سنوات وبعد ثلاث سنوات اكتشفت انه عنده عيال وبعد سنتين عرفت انا زوجته معه وبعد ما عد ماينفعش رجوع لاني اعطيته كل شي وفي الآخر عندم جاء لي عريس فتوسلت اليه بان يتقدم للزوج مني فقال لي انه ليس بتاع زوج وانا لا احب الشخص المتقدم ليه ولكن اهلي يضغطون عليه وانا احب هذا الشخص الندل بالرغم كل اللي عمله فيه ومش قادره انساه اعمل ايه مشكلتي اني مخلصة للانسان اللي حبيته وانا رومانسية"
archived = "2006-11-02"
