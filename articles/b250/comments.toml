posted = "2006-03-26"
text = "سؤالي<br />كيف ممكن تعرف البنت بدون زيارة طبيب إنها فقدت عذريتها<br />لأني متخوفه أكون فقدت عذريتي بسبب الجهل لأني في طفولتي أصابتني إلتهابات وأعطاني الطبيب مراهم وقال لي للإستخدام الداخلي وبجهل كنت أستخدمها عن طريق تدخيل الكريم او المرهم بأصبعي للداخل او بإستخدام أعواد تنظيف الأذن<br />لذلك أعيش برعب أخاف أكون فقدت عذريتي بسبب جهلني<br />ولو علم أهلي بذلك فلن يصدقوني وسيتهمونني بالزنا ماذا افعل ارجوكم أفيدوني جزاكم الله خيرا"
