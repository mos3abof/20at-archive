text = "دى شخص كلب وعلية حكم من المحكمة وهارب خارج البلاد<br />هو اى كلب يفسر القران على مزاج اهلة يبقى مفكر لما يخالف الاجماع<br />هذا شخص فاسد يستحق ضرب الجزمة فى اى مكان يدخلة<br />طلع هذا التافة يقول لك ان البنت ترث مثل الرجل - لية - هو شايف كدة<br />طيب فى الصعيد عندنا 90% من العئلات يرفضون ان يورثوا البنات اى ميراث ويخالفون الشرع اللى بيقول نصف حق الذكر<br />مفكر تعبان وباحث عن شهرة كدابة"
