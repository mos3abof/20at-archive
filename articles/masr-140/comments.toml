subject = "فلتة ايه بس يا جماعة"
author = "مصري مخنوق في دبي"
posted = "2006-04-15"
text = "فلتة ايه بزمتك ده اصلاً واحد في السلطة عن طريق قانون الطوارئ والقمع والترهيب أسامة بيه الباز لازم يقول فلتة لأن المليارات اللي اسامة بيه بيجمعها لازم تخلي مبارك فلتة المهم انتوا شوفتوا تعليقه الاخير علي موضوع الشيعة ده برده علشان فاتة صح ربنا يسترها علي مصر ويحميها من حراميها.<br />الموقع بتاعكوا رائئئئئئئئئئئئئئئئئئئئع"
