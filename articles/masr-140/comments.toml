[[comments]]
order = 9
subject = "خروف امريكا"
author = "شاهد على العرص"
posted = "2006-08-06"
text = "عندما سمع سقوط الطياره المصريه وهى قدمه من امريكا ذهب الى فرنسا حتى يعلج اذن سيته ومن وقتها لا يسمع لانه يمشع على النهج الصهيونى اصل مكنتش موجود وقتها<br />ماذا ننتظر من اطرش وخروف لايسمح حتى بزبحه لانه دمه زفر اما لبنان والدول العربيه ليس لهم وزن عنده لان الزى عينه لايعطيه الامر ان يتحرك<br />حرك الجيش المصرى الى العراق بعد اوامر من امريكا اما لبنان لالالالالالالالالالالا<br />لان الابن هو من يعتدى<br />حسبى الله ونعم الوكيل"
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223523/http://masr.20at.com:80/article.php?sid=140&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

[[comments]]
order = 10
subject = "التوريث قادم"
author = "عمرو"
posted = "2006-09-14"
text = "التوريث قادم لا محالة مع اختلاف مع الكاتب الكبير فهمي هويدي<br />قطار التوريث قادم بتنحي مبارك الحياة السياسية ـ او رئاستة للحزب الوطني فقط<br />لفتح الطريق امام جمال مبارك للجلوس علي عرش مصر المحروسة<br />سؤال<br />القوة السياسية والاحزاب والحركات المعرضة<br />ما الذي سوف تفعلة لمنع التوريث"
archived = "2006-11-18"
capture_url = "https://web.archive.org/web/20061118124130/http://masr.20at.com:80/article.php?sid=140&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

