[[comments]]
order = 1
subject = "الازوزة في الكازوزة"
author = "الشاعر احمد فؤاد نجم"
posted = "2006-04-10"
text = "الازوزة في الكازوزة//والعبارة في الدوبارة//ونظيف في الوزارة//وبابا في الرياسة// وابن بابا في الوراثة//والمدام اخر شياكة//والفلوس في البنوك//والبزنس للتيوس//والبوليس عندة اوامر اضرب الشعب المعارض//اللي بيقول كفاية احنا وصلنا للنهاية//مش باقول الازوزة في الكازوزة والعبارة في الدوبارة"
archived = "2006-09-05"
