subject = "مش حاسيب"
author = "احمد فؤاد نجم"
posted = "2006-04-10"
text = "مش حاسيب دة قدر ونصيب///اسيب العز والجاة واكل السمك البكلاة//دة غير اني عايش بلاش بلةشي بلالالوشي//دة غير فلوسي اللي بتغطي مصر من المعصرة لحد الانفوشي//دة غير البرلمان اللي مليان خرس وطرش وعميان//والجرانين اللي بتكتب عني من الصبح للفجرية//ومباحث صاحية طول اليومية//عشان حركة كفاية اللي بيقولو عنها حركة شطار//لكن قصاد مين يا ولاد الحمار"
archived = "2006-09-05"
