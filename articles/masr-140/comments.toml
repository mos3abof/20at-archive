[[comments]]
order = 6
subject = "منتهى الفلته"
author = "مصرية"
posted = "2006-05-18"
text = "طبعا ريسنا المعتق فلته ونص فى تاريخ مصر كلها حتى ايام الحمله الفرنسية أو الاحتلال البريطانى ...لم تسرق وتنهب وتهرب أموال مصر كما يحدث الآن .. لم تملأ السجون بالمتقلين السياسيين ..اويمارس القمع والارهاب بالصورة التى نراهاالآن ..وللاسف ..ان هذه الصورة القبيحة..رسمها حاكم مصرى بالجنسية فقط..لأن مصر بريئة منه...لم نرى او نسمع عن حاكم فىظله فسدت جميع اجهزة الدولة.. وانتهك فيها القانون كما يحدث الآن.. انه أول حاكم مصرى الجنسية .. يعمل جاهدا على ان يصبح المصريين بلا هوية بنشره الفساد فى اجهزة الاعلام.. بافلام اميريكية خارجة لاتتناسب مع قيمنا ..وترك مافيا الاعلام يمارسون هواياتهم فى بث البرامج السخيفة المنفره لانهم اصلا ملهمش فى الاعلام..ولو دققت فى الأسماء والألقاب..حنلاقى سبب تعيينهم..وبالتالى ..هم يجيدون التهليل والتسبيح لاولياء نعمهم..وخنق فسادهم كل من كان شريفا ..اتذكرون حمدى قنديل .. شاهدوه فى محطة دبى الرائعة..فى برنامج قلم رصاص يوم الجمعة عندما ارى هذا الانسان الشريف احس بالفخر لأنه مصرى وبالحزن لأنه اجبر على الا يقول كلمة حق ..سحبوا كل الشرفاء وتركوها للهتيفه ..وبعد ان كان اعلامنا الاول عربيا ..اصبح بفضله اعلام فاشل من الدرجة الرابعة الذى لانفع منه ولا امل فيه لهيمنة الجهلة والمنافقين من اتباعهم عليه ..والشرفاء منهم لاتصل كلماتهم لأكثر من آذانهم....<br />طبعا فلته ونص واكيد حيتسجل فى موسوعة جينيس فى اكتر من موضوع .. الأكثر بقاء فى الحكم رغم انف أبناء شعبه..والأبرع فى الآتى: ممارسة الأرهاب والقمع على الشعب..عدم احترام القانون والدستور باهانة رموزه..تهريب الاموال الذى تم فى عصره يمكن ان يكون ميزانية لدولة..الفساد المتمفشى فى كل اجهزة الدول<br />اقرأ بقية التعليق .."
archived = "2006-09-05"
capture_url = "https://web.archive.org/web/20060905223523/http://masr.20at.com:80/article.php?sid=140&PHPSESSID=b21753af24e3fec8c8003677058e91e3"

