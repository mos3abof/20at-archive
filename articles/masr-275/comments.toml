text = "هو انتو دايرين ريس احسن من حبيبنا مبارك حفظه الله ( كيفما تكونوا يولي عليكم ) المشكلة مافي بديل يعني يا مبارك يا مبارك يا جمال مبارك ... يلا بلا لمة بقي ."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112749/http://masr.20at.com:80/article.php?sid=275"

[[comments]]
order = 30
subject = "عجايب اخر زمن"
author = "واحد من اشعب"
posted = "2006-07-17"
text = "ما هذا الزمن الذى اصبح فيه يحكم من لا يعقل الا كيف يسرق وينهب و يهدأ بل انه لا يهدأ لكنه يمنع الناس من الغضب بالقوة هل هذا مسلم الذى اسلوبة فى الحكم محاربة من كان ملتحيا [اطلق اللحية]اى بمعنى اصح من اقترب ان يتبع سنة سيدنا محمد عليه افضل الصلاة والسلام واللهم ارحمنا من هذا و حسبى الله و نعم الوكيل<br />ان ما عنده لا يقدر على صرفة بل ان شاء الله لن يلحق ان يصرفة<br />فأن كان استطاع ان يجعلنا لا نقدر ان نتكلم فالله موجود والدعاء لا يسمعة الا الله<br />فعلى كل مسلم مصرى ان يدعو الله ان يخلصنا من هذا اللهم امين"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112749/http://masr.20at.com:80/article.php?sid=275"

