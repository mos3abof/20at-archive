subject = "اجمل كلام"
author = "طارق حسن"
posted = "2006-05-11"
text = "الظاهر ان مكتوب علينا نحن ابناء هذا الوطن الكادحين ان نكون وقود النار فى سهرات بشوات الوطن سواء السهرات الحلوة او المهببه<br />فاشاوس الصحافه شنفوا اذانى واطنبوها باجمل الكلمات عن حب الوطن والتضحيه من اجله ومن اجل الشعب وكتبوا كلام يخلى الواحد مننا لو حمار يلبس البردعه ويتقام على اول مظاهرة وفى المظاهرة سيكتشف انه حمار لانه ببساطه مش هيلاقى اى حد من الناس دول فى المظاهرة لان الناس دى للكلام بس<br />طب حد منكم شاف الاستاذ يوسف السباعى فى مظاهرة او الاستاذابراهيم عيسى او عادل حمودةاو حتى عمرو سليم او بلال فضل<br />مع احترامى الكامل لكل هؤلاء لكن كفايه لازم ينزلوا والا الموضوع بالنسبه لهم كلام وبس"
