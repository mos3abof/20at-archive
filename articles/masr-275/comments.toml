[[comments]]
order = 3
subject = "وكأن العيب فيه لوحده"
author = "معتز"
posted = "2006-05-04"
text = "اللي يشوف جرايد المعارضة والمواقع اللي زي ولاد البلد يقول الشعب كله تمام أو حتى اغلبه لا في موظفين مرتشين ولا حد بيكتب شكاوى كيدية ولا حد بيخرب في الممتلكات العامة والناس بتحب بعض مفيش خناقات حتى بين الأخوات ومفيش ناس بتظلم ناس حتى اليتامى من أبناء اخواتهم ومفيش ومفيش<br />الشعب كله تمام لكن هم تلاتين أربعين (الريس والحكومة) هم اللي وحشين<br />حتقولي كل المفاسد اللي في الشعب دي سببها الريس وحكومته<br />هقولك لسه في ناس شرفاء كتير جدا عايشين تحت نفس الحكم<br />يبقى العيب فينا وفي حكومتنا<br />هل لو قعدنا نتكلم ونشتم ونتظاهر ونحتج ونتريق هنغير في الحكومة<br />الواقع فال لأ<br />يبقى ننشغل بنفسينا ونصلح في بعضينا كشعب عشان ربنا يكرمنا<br />ملحوظة طريفة يوم ما بنسيب الكلام على الحكام تلاقي كل مواطن في الشعب المصري ديما يقول (الشعب المصري ده ما يعلم بيه غلا ربنا، ده شعب........ مفيش فايدة فيه) سبحان الله لما كلنا بننتقد الشعب أمال فين الشعب، ما احنا الشعب وأكيد كل واحد ليه سلبيات بتأثر في مجتمعه<br />لكن بدل ما يدور عليها ويصلحها بنستسهل الشكوى والشتيمة<br />ربنا يصلح حالنا جميعا<br />ويغيره لأحسن حال"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112749/http://masr.20at.com:80/article.php?sid=275"

[[comments]]
order = 4
subject = "كلام معتز صح"
author = "مصري مقيم باجمل بلد ( دبي )"
posted = "2006-05-04"
text = "بجد برافو عليك يا معتز كلامك كله صح احنا لازم الاول نصلح من نفسينا بعد كده نبص للحكومة فيها ايه, الموظف اللي قاعد وبيفتح الدرج علشان ياخد 10 جنيه رشوة ده ماله ومال الحكومة بقي يا جماعة ,ولا النفسيات المريضة اللي بتشوفوها في كل مكان احنا ,فينا عيوب بس لو اتغلبنا عليها هنقدر نعمل حاجة ,بس برده يا معتز الحكومة ديه زبالة اوي اوي وخراب علي البلد يعني يا اخي نفسي تشوفوا البلد اللي انا فيها ديه دبي بصراحة يعني كل حاجة فيها 100% صح ,الشعب بيحب الحكام لان حاكمها الشيخ محمد جزاه الله كل خير بيحب البلد وبيحب الشعب, يآآآه حصرة علي مصر ام الدنيا."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112749/http://masr.20at.com:80/article.php?sid=275"

