[[comments]]
order = 28
subject = "تعرفو اه عن البلد"
author = "مصرى"
posted = "2006-05-22"
text = "المفروض علينا بدل منقعد ننقد الريس ونعلق عليه نشوف الاول احنا بنعمل ايه بص وشوف جالرج اهلك وصحابك تقدر تقول تعرف عنهم لااكن احنا اقدين نقول اصل وفصل لو عندنا زره ايمان مهنشتم ولا نجيب سيره حد كمان لااكن ممكن يكون هناك نقاش يفدنى ويفيدك ويفيد كل ولاد البلد الى عملو الموقع ده وانا مش لقيلو عنوان"
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112749/http://masr.20at.com:80/article.php?sid=275"

[[comments]]
