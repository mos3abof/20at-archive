[[comments]]
order = 32
subject = "لا والف لا"
author = "علاء احمد شعلان أحمد"
posted = "2006-12-09"
text = "لا والف لا لان الريس هو الى حمينا والمفروض عندما نذكرة نذكر الخير الذى حققة للبلد وليس لفرد وارد على كل واحد من الغافلين عن ذلك انهم لو كانو مكانة لفكرو فى انفسهم قبل اى شىء ولهذا اعتذر عن لسان كل من قال شىء مخجل فى حقق يا ريس الامن والامن الا تكفى هذة الكلمة الامن والامان الذى حققة للبلدمنذ ما توالى نصبة والله المعين لة ولنا مع حبى وتقديرى ( مع أرق واجمل امنياتى ) علاء شعلان من بنها"
archived = "2006-12-15"
capture_url = "https://web.archive.org/web/20061215041541/http://masr.20at.com:80/article.php?sid=275&PHPSESSID=b21753af24e3fec8c8003677058e91e3"
