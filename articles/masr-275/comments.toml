text = "منذ اكثر من عشر سنوات سمعت احد المشايخ يقول كلاما احسبه حديث وان كنت لا ادي مدي قوه سنده \"قال صلي الله عليه وسلم(انما الولاء من الله فاذا احب الله قوما ولي عليهم والًٍٍََُُِِِ صالح واذا سخت الله علي قوم ولي عليهم وال ظالم فالظالم يد الله ينتقم به ثم ينتقم منه) لهذا وغيره العيب فينا وانه لمن دواعي سخت الله علي قوم تركهم الفحشاء والمنكر تستشري فيهم دونما يتمعض وجههم لذلك وهذا حالنا من المرتشي من السارق من الزاني من العاريه من الساقطه من ...من.... واعظم من ذلك ان نظلم ونصمت فالعيب فينا ولا حول ولا قوه الا بالله<br />0"
