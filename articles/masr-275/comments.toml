[[comments]]
order = 8
subject = "بلاش نتصيد لبعض الأخطاء"
author = "أحمد عزت"
posted = "2006-05-05"
text = "الأستاذ المحترم اللي بيستهزأ من أخوه<br />في كلمة سخط وسخت<br />دي غلطه إملائيه وتعدي<br />لكن الكلام لما ماجاش على هواه حب يبين فزلكته ومايبينش جهله باللي بيقوله أخوه<br />طالما انت عارف الصح خليك عارفه ورد على معنى الكلام المراد<br />لكنك مالا قيت شئ ترد عليه إلا من هذه الجهه الغلطة الإملائية<br />مشكلتك إنك غلبت هواك<br />بمعني<br />لما قاللك قال رسول الله إستشط غضبا<br />ومش عايز تقول أنا غلط<br />وده من إدى أشكال التكبر<br />مع إن عمدتنا في أي كلام يا مسلمين<br />الكلام السابق ده كله طبعاليك إن كنت مسلم<br />وإن ماكنتش مسلم يبقى لإخوانا من المسلمين<br />لما ربنا يقول<br />قال تعالي : [ قل إن كنتم تحبون الله فاتبعوني يحببكم الله ويغفر لكم ذنوبكم والله غفور رحيم ]<br />آل عمران<br />قل أطيعوا الله والرسول فإن تولوا فإن الله لا يحب الكافرين ] . ( آل عمران 31)<br />قال تعالي : [ فلا وربك لا يؤمنون حتى يحكموك فيما شجر بينهم ]. ( النساء 4 : 65)<br />(وأطيعوا الله والرسول لعلكم ترحمون(آل عمران 132<br />(قل أطيعوا الله وأطيعوا الرسول، فإن تولوا فإنما عليه ما حمل وعليكم ما حملتم)<br />(ياأيها الذين آمنوا استجيبوا لله وللرسول إذا دعاكم لما يحييكم)<br />(ياأيها الذين آمنوا استجيبوا لله وللرسول إذا دعاكم لما يحييكم)<br />والآيات كتيييييييييير جدا<br />وتحث على طاعة الرسول<br />لأن طاعة الرسول من طاعة الله<br />وربنااللي أمرنا بكده<br />هتقولي إيه دخل الكلام ده بموضوعنا؟!!!<br />أقولك طاعة الرسول مش بس بالكلام اللي لا بيقدم ولا يأخر<br />لكن بالعمل يعني لما نختلف أنا وأنت في شئ وإحنا الإثنين مسلمين<br />وجيت قلتلك قال رسول الله<br />تسكت وأنا هكذا<br />طاعته في سماع أوامره من غير تريقه ولا استهزاء عن طريق جهل اللي نابع فينا<br />زي ما ربنا بيقول في كتابه العزيز<br />(فلا وربك لا يؤمنون حتى يحكموك فيما شجر بين<br />اقرأ بقية التعليق .."
archived = "2006-09-07"
capture_url = "https://web.archive.org/web/20060907112749/http://masr.20at.com:80/article.php?sid=275"

