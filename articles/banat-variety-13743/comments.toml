text = "بداية اشكر من قام بالتدوين ،<br />طبعا نحن لا يحق لنا ان نقوم بالافتاء لأننا على غير علم .<br />ولكن باعتقادي طالما الكلام لم يتجازو الحدود الشرعية والدينية<br />ولم يدخل في باب العواطف والخصوصيات .<br />وكان مجرد تعبير عن الرأي او تبادل أفكار … لا اجد فيه مشكلة<br />والله أعلم"
