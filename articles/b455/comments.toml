[[comments]]
order = 5
subject = "محجوره"
author = "هندي المري"
posted = "2006-09-12"
text = "الاقارب محبه الاقارب عنوان الشرف<br />أخي الكريم أختي الكريمه<br />ارجو منكم عدم سو الفهم<br />انا من الناس اللي ابي اخذ من خارج القبيله لكن مو كره فيهم لا بس ابي اعدل النسل وانتعرف عليهم بس للأسف بأت بالفشل بنت اعرفها من الصغر ولا بنت توى اعرف ابوها او اخوها الجهل متغطرس في المجتمع كيف اخذا وحده عشان ابوها طيب او اخوها ذباح حشوان انا باخذها ولا باخذا ابوها انا جايت قبيله خطبت عندهم كل شي زين وافقو بس جات العادة الخبيثه لحد يسمع الكلمه يقول اني متحسف عليها خيره ماحد ياخذ إلا نصيبه في الدنياء قال محجوره والله لاتاخذالبنت اذبحك افاااااااااااااء خربت تدرون لو اخذ البنت شنو يصير يعدون عليه الفنجان يعني اذا جاء في المجلس يعطون الرياجيل قهوه إلا هو مايعطونه لازم يذبحني قهوه مرررررررررره مقابل نفس زكيه روح مسلمه تروح بشربت قهوه"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134515/http://www.20at.com/article2.php?sid=455"
