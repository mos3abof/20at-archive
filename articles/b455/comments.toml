[[comments]]
order = 1
subject = "لا تنتظر تجربتك المريرة"
author = "أخواني, العلماء لا يقصدون بأن جميع عمليات الزواج من الأقارب فاشلة ولكن يقصدون النسبة الكبيرة جدا منها والتي تصل الى 90%."
posted = "2006-03-26"
text = "ثانيا بزواجك من غير الاقارب فوائد عديدة تحسين النسل وذلك لفرصة اجتماع صفات مختلفة جيدة من الزوجين اضافة الى التعرف على عائلات ومخالتطهم."
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134515/http://www.20at.com/article2.php?sid=455"

[[comments]]
order = 2
subject = "اتفلوا على تلك المقولة وضعوها تحت أقدامكم"
author = "أبو محمد"
posted = "2006-07-10"
text = "إنا لله وإنا إليه راجعون<br />أعوذ بالله أن أكون من الجاهلين<br />يا جماعة الخير هذه المقولة<br />الأقارب عقارب<br />تحتاج إلى تفصيل فإذا كان المقصد زواج الإنسان فهذا حلال له<br />فلا يجوز لإنسان أن يعنف على الزواج من الأقارب ويعمم كلامه ويجعل من نظرية الأقارب عقارب نظرية مطلقة<br />فالأمر جائز حلال بل هو سنة فقد تزوج الرسول صلى الله عليه وسلم من قريباته بل كان يبحث عن ذلك<br />فلا يحقر في هذا الشيء إلا إنسان قليل الفقه والعقل<br />وإن كان المقصد من كلمة<br />الأقارب عقارب<br />التنفير من صلة الرحم بعممها<br />فوالله إنها الكارثة بأم عينها<br />فكيف يعجب الإنسان بمقولة عابرة فاسدة مثل ( الأقارب عقارب )<br />ويترك قول الله وقول الرسول صلى الله عليه وسلم الذين أمروا بصلة الرحم وأكدوا عليها وجعلوا من لا يصل رحمه ملعونا مقطوعا ممنوعا من الجنة<br />مرتكبا لكبيرة من كبائر الذنوب<br />فانتبهوا يا جماعة الخير ممن يروج لمثل هذه العبارات التافهة فالأقارب أوصى الله بهم<br />وآتي ذا القربى حقه<br />إن الله يأمر بالعدل والإحسان وإيتاء ذي القربى<br />... وعشرات الآيات والأحاديث ...<br />اللهم أعنا على صلة ما أمرتنا به أن يوصل<br />ونعوذ بك من مروجي الضلال"
archived = "2006-11-02"
capture_url = "https://web.archive.org/web/20061102134515/http://www.20at.com/article2.php?sid=455"

