text = "حسبي الله ونعم الوكيل<br />ماسمعتوى القرآن والحديث<br />ماتعرفون معن كلامكم<br />متعرفون انه اللي يسن سنة !!<br />حرام عليكم<br />ماتشوفون اللحين الزلازل والبراكين<br />كل هذا غضب<br />ماتشوفون الغبار؟؟<br />الى متى تطالبون باللي تسمونه الحرية وتسمون الانفتاح؟؟<br />معنى كلامكم ان الاسلام ماعنده حرية اذا انتم مع الانفتاح وووو ؟؟؟<br />اللهم اكفنا شرهم وشر ما يؤلون بنا اليه"
