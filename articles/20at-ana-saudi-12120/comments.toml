text = "ارجو من الاخوة الانتباه لما يؤول الية المجتمع السعودى المحافظ والله يا اخوانى واخواتى المسلمات اعزكم الله المرآة مطالبة با تقر فى بيتها والله انتن يا سعوديات فى نعمة يحسدكم عليها كل فرد مسلم وهى العفة وحفظ الزوجات والبنات والاخوات من الاختلاط المدمر والله انكم فى نعمة<br />مع ذلك ان الموضوع له جوانب كثيرة ممكن سواقة المرآة السيارة تحميها وممكن تضرها على حسب التربية<br />*اذا كانت المرآة عندها خلل فى التربية ونقص دين بالتالى وجود السواق معها اكبر كارثة<br />*اذا كانت المرآة متدينة ومتربية كويس بالتالى لاخوف عليها ولكن السواق يكون ملتز<br />-اذا كانت المرآة غير متدينة وعندها نقص تربية ممكن تستغل السيارة فى الحرام وتركب بها اغراب وتفعل الفاحشة وهذة هى الحقيقة اللى دائما الاخوة بيداروا وجههم عنها مثل النعام عند الخطر بيدفن وجهه فى التراب<br />نداء الى كل مسلم عندة ضمير يتقى الله فى بيته ويراقب اللى بيحصل<br />احذروا السواق البنقالى والفلبينى وغيره كم من بيت مدمر مدمر مدمر آآآآآآآآآآآآآآآ آآآة يا عرب !<br />السائق العربى الملتزم حل جميل ولكن لك قاعدة شواذ !<br />الرجال الغير واثق من بيته ياتى بسائق غير عربى"
archived = "2009-11-24"
capture_url = "https://web.archive.org/web/20091124085539/http://www.20at.com:80/20at/ana-saudi/12120-2009-05-19-10-14-49.html"
